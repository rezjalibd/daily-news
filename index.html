  <style>

      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;

      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;

      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;

      margin: 0;
      padding: 0;

    }
    body {

      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;

    .container {

    .header-actions {

      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;

    .btn-action:hover {

    .meta-tag {

      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {

      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {

      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {

      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;

      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {

      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;

    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }

      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;

    .btn-close:hover {
      color: var(--text);

    .modal-body {

      display: flex;

      border: 1px solid var(--card-border);

      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }

      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

شینه مهاجرتی» داشتند و دادستان‌ها در حال بررسی این موضوع هستند که آیا مهاجم قربانیان را به دلیل «نژاد، قومیت، ملیت یا مذهب» هدف قرار داده یا نه. مردی مسلح روز جمعه اول آبان با تیراندازی از داخل خودروی خود در حومه پاریس، یک نفر را کشت و پنج نفر دیگر را مجروح کرد. گزارش شده که دختری ۱۲ ساله که هشت گلوله به او اصابت کرده نیز جزو مجروحان است. لوران نونیز، وزیر کشور فرانسه، این تیراندازی مرگبار از داخل خودرو را «اقدامی تروریستی» توصیف کرد. علی رابه، شهردار شهر تراپ می‌گوید مهاجم هنگام رانندگی در شهرهای کارگرنشین تراپ و لا وری‌یر در جنوب‌ غرب پاریس، «به‌طور تصادفی تیراندازی می‌کرد و قصد داشت حمام خون به راه بیندازد». یک منبع پلیس به خبرگزاری فرانسه گفت مهاجم حدود ساعت ۱۰:۳۰ صبح به وقت محلی، از داخل خودروی خود به‌صورت رگباری تیراندازی را آغاز کرد. به گزارش خبرگزاری فرانسه، بیشتر قربانیان «پیشینه مهاجرتی» داشتند و دادستان‌ها در حال بررسی این موضوع هستند که آیا مهاجم قربانیان را به دلیل «نژاد، قومیت، ملیت یا مذهب واقعی یا تصورشده آن‌ها» هدف قرار داده است یا نه. به گفته یک منبع آگاه از پرونده، مظنون تیراندازی مردی ۳۹ ساله است که در شهر نزدیک کوآنی‌یر بازداشت شده است. نیکولا دنویل، شهردار لا وری‌یر، فرد مظنون را «دارای ظاهری اروپایی» توصیف کرده است. یک منبع پلیس گفت مأموران هنگام بازداشت، یک مسلسل دستی و نارنجک‌های گاز اشک‌آور نزد او پیدا کردند. شهردار تراپ می‌گوید مهاجم از داخل خودروی خود به‌طور پراکنده تیراندازی می‌کرد و فرد کشته‌شده «آفریقایی‌تبار» بوده است. او افزود یکی از مجروحان که «در وضعیت بحرانی» قرار دارد، نیز اهل شمال آفریقاست. این شهردار حمله را «آشکارا نژادپرستانه و احتمالاً اسلام‌هراسانه» توصیف کرد و هم‌زمان با افزایش شمار زخمی‌ها از چهار نفر به پنج نفر، خواستار اتحاد ملی شد.", "image_url": "https://gdb.rferl.org/88cdca3f-4710-48e4-b03e-48cba112c9d7_w1200_h630.jpg", "category": "موسیقی و هنر", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱ آبان • ۱۹:۳۰"}, {"source": "Radio Farda", "title": "ممنوعیت تولید تریاک در افغانستان؛ «گسترش» کشت خشخاش در مناطق مرزی ایران و پاکستان", "link": "https://www.radiofarda.com/a/iran-pakistan-opium-poppy-cultivation-afghanistan-tal اری یا ویرایش بومی وجود ندارد. ChatGPT Slides بخشی از تلاش OpenAI برای ارائه یک مجموعه اداری کامل به کاربران در داخل برنامه های ChatGPT است. Pages (پردازنده کلمه) در حال حاضر برای سطوح حرفه ای و بالاتر در دسترس است، در حالی که یک برنامه صفحه گسترده در راه است که به زودی قادر خواهید بود تمام کارهای خود را بدون هیچ کمکی از Google یا Microsoft انجام دهید. در حالی که اسلایدهای Chatgpt در حال حاضر فقط در برنامه های گران قیمت در دسترس هستند، احتمالاً در آینده به سطوح پایین تری اشتراک خواهند رسید. اما در حال حاضر، چگونه این ابزار در مقایسه با آنچه که در سطوح رایگان و پلاس موجود است، مقایسه می‌شود، نه اینکه بگوییم با Gemini در اسلایدهای Google چه کارهایی می‌توانید انجام دهید؟ من یک نگاه دقیق انداختم چگونه ChatGPT ارائه‌ها را برای کاربران رایگان و حرفه‌ای مدیریت می‌کند وقتی نوبت به آزمایش ابزارهای هوش مصنوعی می‌رسد، به تمرکز روی چیزی که قبلاً در مورد آن آگاهی دارید کمک می‌کند تا بتوانید هر اشتباهی را تشخیص دهید.", "image_url": "https://lifehacker.com/imagery/articles/01M5MDEG0XSF280TC4Y9ZQEC7J/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Google", "Apple"], "datetime_fa": "۱ آبان • ۲۰:۰۰"}, {"source": "Lifehacker", "title": "Why the Holidays Are Actually the Best Time of Year to Start Working Out", "link": "https://lifehacker.com/start-working-out-during-the-holidays?utm_medium=RSS", "summary": "We may earn a commission from links on this page. If you have even the tiniest inkling that you might want to get in shape in the new year or anytime really don t wait until January. This isn't a \"winter arc\" self-improvement pitch; it's just facts. The best time to start a gym habit is before the holiday season. Heck, in December, you ll even have the place mostly to yourself. Sure, technically right now is always the best time to start exercising, but the holiday season is special. If you wait until January, gyms will be packed. The first two weeks of the year, everybody thinks they re at the start of an amazing new fitness habit...and by February, most of them have forgotten all about it. Don t make life harder for yourself by starting during the big rush. Classes will fill up, you ll have to fight people for the squat rack, and it will be hard to have any real fun. So start now. ZICOTO Ultimate Fitness Journal with consistency tracker $13.99 at Amazon Shop Now Shop Now $13.99 at Amazon In October and November, gyms and classes are at more or less their normal capacities. This is a good time to feel out the vibe of a new place. But it gets better: Once December rolls around, the fair-weather gymgoers will be off shopping for gifts after work and attending holiday parties on the weekends. They won t feel like getting out of their warm beds in the morning, either. When you arrive, the squat rack will be free. You ll have your choice of treadmills. The gym will be your oyster. If you start now, you'll have about two months to get up to speed before the rush starts in January. And that is a perfect little time frame to set a small goal and keep it. Vow to hit the gym three times a week, and you ll be able to get in 24 workouts before Christmas, even if you take a few days off for festivities. You can get a lot stronger in 24 workouts. Or run, if that's the fitness journey you're most excited about. If you start a couch-to-5k running plan now, you ll be routinely running 30 minutes at a stretch by the time we get to January. Yes, the holiday season can be busy and stressful, but remember that working out tends to help our brains manage stress . Mark workouts on your calendar, and keep those appointments with yourself. Don t worry about missing out on deals. Any gym or studio that offers a January special probably offers sales year-round anyway. And ultimately, if you get into the habit of actually using the gym, you're getting a lot more value for your money", "date_str": "2026-10-23T15:30:00+00:00", "hash": "5963ebac5bda703d", "title_fa": "چرا تعطیلات در واقع بهترین زمان از سال برای شروع و SMC با انحصار چین بر عناصر خاکی کمیاب", "link": "https://www.zoomit.ir/tech/469625-tsmc-seeks-rare-earth-alternatives/", "summary": "تی‌اس‌ام‌سی در حال بررسی جایگزین‌های عناصر خاکی کمیاب در تجهیزات کارخانه‌ای برای کاهش خطرات ناشی از محدودیت‌های صادراتی چین است.", "date_str": "2026-10-23T15:15:00+00:00", "hash": "7628a225e1f803dd", "title_fa": "نبرد خاموش TSMC با انحصار چین بر عناصر خاکی کمیاب", "summary_fa": "تی‌اس‌ام‌سی در حال بررسی جایگزین‌های عناصر خاکی کمیاب در تجهیزات کارخانه‌ای برای کاهش خطرات ناشی از محدودیت‌های صادراتی چین است. تبلیغات بزرگ‌ترین سازنده‌ی قراردادی تراشه در جهان، بررسی گزینه‌های جایگزین برای قطعات حاوی عناصر خاکی کمیاب در تجهیزات کارخانه‌ای را آغاز کرده است. سه منبع آگاه به رویترز اعلام کرده‌اند هدف از اقدام مذکور، کاهش ریسک اختلال در تولید پیشرفته‌ترین ریزتراشه‌های جهان در پی محدودیت‌های صادراتی چین به شمار می‌رود. تسلط چین بر عناصر خاکی کمیاب پس از وضع تحریم‌ها روی برخی مواد، آهن‌رباها و فناوری‌های پردازش، به نقطه‌ی آسیبی برای صنعت تراشه تبدیل شده است. آهن‌رباهای خاکی کمیاب معمولا در موتورهایی به کار می‌روند که قطعات متحرک تجهیزات صنعتی از جمله ماشین‌آلات اتوماسیون کارخانه‌ها را به حرکت درمی‌آورند. کمبود چنین قطعات تخصصی خط تولید تراشه‌های مربوط به گوشی، سرورهای هوش مصنوعی، دیتاسنترها و زنجیره‌های تامین دفاعی را با چالش روبه‌رو می‌کند. مدیران صنعتی آگاه گزارش داده‌اند که TSMC امکان‌سنجی استفاده از موتورهای فاقد عناصر خاکی کمیاب را با تامین‌کنندگان مطرح کرده است. گفت‌وگوها در مراحل آغازین قرار دارد و هنوز به مرحله‌ی پیاده‌سازی گسترده در خطوط تولید نرسیده است. مدیران این مرکز صنعتی حاضر به ارائه‌ی توضیحات بیشتر درباره‌ی برنامه‌های جاری نشدند. ریموند گرین ، مدیر مؤسسه‌ی آمریکایی در تایوان، گفت: «ایالات متحده در همکاری با تایوان و شرکای دیگر در حال توسعه‌ی منابع تامین جایگزین، گسترش ظرفیت پردازش و ساخت زنجیره‌های تامین انعطاف‌پذیرتر است.» کونگ مینگ-سین ، وزیر اقتصاد تایوان، گفت: «دولت از مؤسسه‌ی پژوهش‌های فناوری صنعتی حمایت خواهد کرد تا فناوری‌های مرتبط با عناصر خاکی کمیاب را توسعه دهد و خط تولید آزمایشی ظرف سه سال راه‌اندازی شود؛ خطی که می‌توان olatile,\" and not just for us, but for our 8-year-old daughter. When it came time to plan our first summer vacation with just me and her, I knew it would likely be a splurge, but I needed it to be special. We needed activity. We needed reconnection. We needed a dude ranch . This was our first big adventure for just the two of us My research led me to an all-inclusive ranch in Colorado. The website had footage of horses running across a bridge over a winding stream. It looked perfect. Although I was apprehensive about the two of us traveling from Texas during the week of July 4th, I inevitably found it liberating. Wheeling luggage stuffed with heavy cowboy boots while lugging backpacks through airports, shuttling to the rental car, and navigating unknown mountainous switchbacks could have been disastrous, but we managed it well. It was our first accomplishment in independence. The author said some independent time each day helped her and her daughter connect with other guests. Courtesy of Rebecca Lillian. We encountered some surprises \"You have arrived,\" the navigation system announced in our rental as we turned onto the dirt drive lined with quintessential log cabins with thick white chinking, set on manicured lawns before the Rocky Mountain backdrop. Each porch had bright pink, purple, and red petunias hanging in baskets above shellacked wooden rocking chairs. It was just like we imagined it. After parking our red Wrangler, we were greeted by ranch staff in full cowboy gear who guided us past the soft pink peonies nestled between the grayish-white aspen trees to check in. At check-in, while planning our next seven days , I discovered that children eat dinner most nights with the other children and their counselors and take separate trail rides twice a day. This concept is great for families, giving mom", "date_str": "2026-10-23T15:19:40+00:00", "hash": "caf6ee0c8e75f3c9", "title_fa": "من و دخترم بعد از طلاق به یک شروع جدید نیاز داشتیم. یک تعطیلات در یک مزرعه در  permanently. Heather Snow I swapped homes with a stranger and traded my San Francisco condo for a house in Seattle. For a month, I lived in Seattle to figure out if I would want to move there permanently. Although Seattle isn't the right city for me, the experience taught me what I want in my next home. After 18 years of living in San Francisco , I was seriously starting to consider moving. I loved the life I had built there, but taking the next step — like buying my own house with a yard — felt out of reach for me. However, I was afraid I would regret leaving the place I had called home for so many years. When thinking of places I'd like to live, Seattle immediately came to mind. I figured the city would offer similar energy and career opportunities as San Francisco , and I loved its proximity to striking natural beauty. Plus, I'd visited the West Coast city many times and had a good friend who lived there, so it seemed like a logical move. But instead of taking the leap immediately, I decided to test out living in the city for a month to make sure it was the right fit for me. Through HomeExchange, a platform that allows users to swap homes with people from around the world, I traded my Noe Valley condo for a house with a yard in the Ballard neighborhood of Seattle for the month of July. I got to experience Seattle as a local instead of a tourist It was interesting being able to experience the city as a local would. Heather Snow Although I'd visited Seattle many times over the years, this was my first chance to test everyday life there with my dog, Pepper — not just experience the city as a tourist. I worked remotely, went grocery shopping , and checked out the Ballard Farmers Market on Sundays. Pepper and I explored different parks on morning walks and went to local breweries in the evenings. I really prioritized spending time in Ballard, since that was the neighborhood I was most interested in possibly calling home. I loved that the residential parts were filled couples make the same mistakes. Courtesy of Cameron Dever I've worked as a wedding photographer for years, and I've seen couples make the same mistakes. Too many people schedule the day to the minute and don't get the chance to enjoy their wedding. Not budgeting for the right photographer and videographer can lead to disappointing results. I've been photographing weddings for over a decade, so I've witnessed countless ceremonies and receptions — some disastrous, others impeccable. Throughout the years, I've also watched couples make the same mistakes over and over. Here are a few I wish they'd avoid. Filling the day-of schedule with way too much Couples have to find time for the ceremony, photos, eating and drinking, dancing, talking to the people they invited, and connecting with each other. When you try to fit too many things into the day, no one — especially the married couple — has time to breathe and relish the moments. The day can feel rushed and more focused on activities than the celebration of love. A packed schedule often leaves couples stressed, with no time to eat because they've been pushed from one 15-minute window to the next. However, your wedding day shouldn't be a blur. You should have time to soak in every moment. When you map out your day, prioritize traditions you love and estimate how long each will take … then add buffers. I also recommend working with a wedding planner or coordinator to plan your timeline, or consulting with your photographer and other vendors when arranging your schedule. They've experienced countless weddings and know firsthand how much time each activity usually takes. Letting small mishaps and issues ruin the whole day Learning how to laugh off the small mishaps is absolutely key. Courtesy of Cameron Dever One of the things I always tell my couples right before their wedding day is that something will go wrong. I don't say this to scare them or make them worry, but mostly to adjust their expectations. No matter how much planning you do, people are imperfect, the weather can be unpredictable, and life happens. By the time the day comes, couples have done all they can to make sure it's how they pictured it. All that matters after that is that they enjoy their wedding. Missing flowers or a cake that's the wrong flavor can throw off your day — but these unexpected mishaps shouldn't be so consuming that they're all you remember from your wedding. I don't ", "date_str": "2026-10-23T14:44:18+00:00", "hash": "3960dfd8a44e6acd", "title_fa": "بیش از یک دهه است که از عروسی عکاسی کرده ام. در اینجا 4 تا از بزرگترین اشتباهاتی که می بینم زوج ها مرتکب می شوند آورده شده است.", "summary_fa": "من در دهه گذشته انواع عروسی ها را دیده ام، اما بسیاری از زوج ها اشتباهات مشابهی را انجام می دهند. با حسن نیت از Cameron Dever من سال ها به عنوان عکاس عروسی کار کرده ام و زوج ها را دیده ام که اشتباهات مشابهی انجام می دهند. بسیاری از مردم هر روز برنامه ریزی می کنند و فرصت لذت بردن از عروسی خود را ندارند. عدم تخصیص بودجه برای عکاس و فیلمبردار مناسب می تواند به نتایج ناامیدکننده ای منجر شود. من بیش از یک دهه است که از عروسی ها عکاسی می کنم، بنابراین شاهد مراسم و پذیرایی های بی شماری بوده ام - برخی فاجعه بار، برخی دیگر بی عیب و نقص. در طول سال‌ها، من زوج‌ها را بارها و بارها مشاهده کرده‌ام که اشتباهات مشابهی انجام می‌دهند. در اینجا چند مورد است که ای کاش آنها از آنها اجتناب می کردند. پر کردن برنامه روزانه با بیش از حد زیاد زوج ها باید برای مراسم، عکس، خوردن و آشامیدن، رقصیدن، صحبت کردن با افرادی که دعوت کرده اند و ارتباط با یکدیگر وقت پیدا کنند. وقتی سعی می کنید چیزهای زیادی را در روز بگنجانید، هیچ کس - به خصوص زوج متاهل - وقت برای نفس کشیدن و لذت بردن از لحظات ندارند. این روز ممکن است عجله داشته باشد و بیشتر بر فعالیت‌ها متمرکز باشد تا جشن عشق. یک برنامه فشرده اغلب زوج ها را تحت فشار قرار می دهد و زمانی برای غذا خوردن ندارند زیرا آنها از یک پنجره 15 دقیقه ای به پنجره بعدی فشار آورده اند. با این حال، روز عروسی شما نباید تار باشد. شما باید در هر لحظه زمانی برای غوطه ور شدن داشته باشید. وقتی روز خود را ترسیم می کنید، سنت هایی را که دوست دارید اولویت بندی کنید و تخمین بزنید که هر کدام چقدر", "image_url": "https://i.insider.com/68483fcd85e81483682bc5fc?width=1200&format=jpeg", "category": "سینما و سریال", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۸:۱۴"}, {"source": "Business Insider", "title": "Volvo plans to cut 2,500 jobs due to China's bruising pricing war", "link": "https://www.businessinsider.com/volvo-layoffs-job-cuts-china-pricing-pressure-2026-10", "summary": "Legacy automakers are struggling to compete in China. Bloomberg/Getty Images Legacy carmakers continue to report slumping sales in China. Volvo is the latest. It's planning 2,500 global job cuts to save about $530 million. America is a problem, too. Tariffs, crushed EV incentives, and Polestar's exit also hurt. China's merciless car market is taking a bite out of Volvo. On Friday, the Swedish luxury automaker said revenue in China fell by almost 50% over the past year. The company said, like many legacy premium automakers, it's facing increasing \"hypercompetition\" from Chinese competitors. Volvo plans to cut 2,500 jobs globally in response, it said, including roughly 2,000 in Sweden. That's part of an effort to slash costs by about $530 million. \"We continue to operate in a very tough environment with strong external challenges: de-globalisation, hypercompetition and climate change,\" CEO Håkan Samuelsson said in a statement. It's the latest stark example of the increasing pressure on legacy automakers in China. Several big-name car companies — including Volkswagen, BMW, and Mercedes-Benz — have recently reported slowing sales from their Chinese dealerships. Volvo is majority-owned by Geely Auto Group, a Chinese automaking conglomerate. The company said the reductions will be made by a combination of ending consultant contracts, natural attrition, and targeted employee exit packages. China is not Volvo's only problem. The company also said that US tariffs and the loss of Washington's consumer incentives for electrified cars squeezed margins. Volvo previously bet heavily on a rapid consumer transition to electric vehicles, aiming for an all-electric portfolio by 2030 . It's since walked back that goal to include plug-in hybrid vehicles. The automaker also said that Polestar — its EV offshoot that is exiting the US market — also posted losses. Volvo's answer is to get more local: the automaker said it would introduce two fresh cars tailored specifically for the Chinese market by the middle of next year. Those cars will be developed in close collaboration with Geely and will include a Chinese tech stack and advanced driver-assist technologies \"to make them fully competitive in China.\" Read the original article on Business Insider", "date_str": "2026-10-23T14:40:10+00:00", "hash": "4392be7c42a001df", "title_fa": "ولوو قصد دارد 2500 شغل خود را به دلیل جنگ قیمت گذاری کبود در چین اخراج کند", "summary_fa": "خودروسازان قدیمی برای رقابت در چین با مشکل مواجه هستند. بلومبرگ/گتی ایماژ خودروسازان قدیمی همچنان از کاهش فروش خود در چین خبر می دهند. ولوو جدیدترین است. در حال برنامه ریزی برای 2500 کاهش شغل جهانی برای صرفه جویی در حدود 530 میلیون دلار است. آمریکا هم مشکل دارد. تعرفه‌ها، مشوق‌های کاهش‌یافته خودروهای برقی و خروج Polestar نیز صدمه دیده است. بازار خودروهای بی‌رحم چین در حال لقمه‌ای از ولوو است. روز جمعه، این خودروساز لوکس سوئدی اعلام کرد که درآمد چین در سال گذشته تقریباً 50 درصد کاهش یافته است. این شرکت گفت، مانند بسیاری از خودروسازان ممتاز قدیمی، با افزایش \"فوق العاده رقابت\" از سوی رقبای چینی مواجه است. ولوو اعلام کرد که قصد دارد در پاسخ به این اقدام 2500 شغل در سطح جهان از جمله حدود 2000 شغل در سوئد را تعدیل کند. این بخشی از تلاش برای کاهش حدود 530 میلیون دلاری هزینه ها است. هاکان ساموئلسون، مدیرعامل این شرکت در بیانیه‌ای گفت: «ما در یک محیط بسیار سخت با چالش‌های خارجی قوی به فعالیت خود ادامه می‌دهیم: جهانی‌زدایی، رقابت بیش از حد و تغییرات آب و هوایی.» این آخرین نمونه واضح از افزایش فشار بر خودروسازان قدیمی در چین است. چندین شرکت خودروسازی بزرگ - از جمله فولکس واگن، بی‌ام‌و و مرسدس بنز - اخیراً کاهش فروش را از نمایندگی‌های چینی خود گزارش کرده‌اند. اکثریت ولوو متعلق به گروه خودروسازی جیلی، یک مجموعه خودروسازی چینی است. این شرکت گفت که این کاهش ها با ترکیبی از پایان دادن به قراردادهای مشاور، فرسایش طبیعی و بسته های هدفمند خروج کارکنان انجام خواهد شد. چین تنها مشکل ولوو نیست. این شرکت همچنین گفت که تعرفه های ایالات متحده و از دست دادن مشوق های مصرف کننده واشنگتن برای خودروهای برقی باعث کاهش حاشیه سود شده است. ولوو قبلاً روی انتقال سریع مصرف‌کنندگان به خودروهای الکتریکی شرط‌بندی", "image_url": "https://i.insider.com/6adb62b2dc67b5b4d01f6d01?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۸:۱۰"}, {"source": "Business Insider", "title": "I spent years building a 'stable' life and climbing the ladder at work. Then, I quit my job and moved to Hungary.", "link": "https://www.businessinsider.com/left-well-paying-job-moved-countries-making-less-money-happier-2026-10", "summary": "I always loved Budapest, but never thought I d actually be able to move here. Sarah Catherine Cowie I spent my 20s climbing the career ladder and building the life of my dreams in Scotland. Then, after losing my dad, I decided to make a big change: I moved abroad and went back to school. I've been struggling financially, but I know that I made the right choice. For most of my 20s, I wanted to climb the career ladder — and hoped that as soon as I reached the top, everything would become clear and I would live happily ever after. My life felt like it was headed in the right direction. I was on a steady, exciting career trajectory in the climate policy field. I even bought my first flat in an up-and-coming area of Edinburgh. Then, my dad was diagnosed with terminal cancer in late 2022. The next few years were spent grappling with his illness and, eventually, his death. I quickly felt the whole ecosystem of my life fall apart. I was struggling at work, and I didn't know how to ask for help. I tried my best to carry on as normal and try to convince myself that the work I was doing — and, by extension, myself — was important. As I edged toward my 30th birthday in early 2025, against a backdrop of grief and burnout, the need for change felt urgent and existential. I made a drastic change I decided to go back to school in a new country. Sarah Catherine Cowie It was shortly after this, in the spring, that I decided a move abroad was exactly what I needed. I quit my job and spent the next few months sending applications to schools across Europe, hoping to pursue a master's degree in my field and embark on a fresh start. When an offer came from a university in Budapest, I knew that was where I would be going. I had visited for the first time about a decade prior, and fallen in love. I remember thinking, \"I could see myself living here one day,\" not thinking that that \"one day\" would ever actually come. In September, I packed up my life, started renting out my Edinburgh flat, and made the move. The first few months brought a mix of excitement, fear, and disbelief. There was a lot of bureaucracy to navigate — forms to fill out, applications to be processed — and I couldn't relax until everything was completed. I was also pretty lonely in the beginning. When I first moved, I didn't know a single person in Budapest and had to build a completely new social circle from scratch. I also sometimes felt like an imposter: I was a lot older than the fresh-faced students in their", "date_str": "2026-10-23T14:40:01+00:00", "hash": "58ce9fce011b104c", "title_fa": "من سالها صرف ساختن یک زندگی «پایدار» و بالا رفتن از نردبان کار کردم. سپس کارم را رها کردم و به مجارستان رفتم.", "summary_fa": "من همیشه بوداپست را دوست داشتم، اما هرگز فکر نمی کردم واقعا بتوانم به اینجا نقل مکان کنم. سارا کاترین کاوی من 20 سالگی خود را با بالا رفتن از نردبان شغلی و ساختن زندگی رویاهایم در اسکاتلند گذراندم. سپس، پس از از دست دادن پدرم، تصمیم گرفتم تغییر بزرگی ایجاد کنم: به خارج از کشور نقل مکان کردم و به phone company in the 1980s. The experience inspired his beloved comic strip, \"Dilbert.\" By the end of the decade, the character and his satirical office humor began appearing in comic strips. At its peak, \"Dilbert\" was syndicated in over 2,000 newspapers. A cartoon series debuted in 1999, running for two seasons. Adams gained notoriety when he began writing blog posts praising Donald Trump during his 2016 presidential run. In 2023, \"Dilbert\" was pulled from newspapers across the US following racist comments made by Adams. Adams died on January 13 from metastatic prostate cancer . Brad Arnold, 47 Brad Arnold. Scott Gries/ImageDirect/Getty Images The lead singer of 3 Doors Down, Brad Arnold launched the group into fame with the 2000 rock anthem \"Kryptonite,\" which peaked at No. 3 on the Billboard Hot 100 that year. The success led to other hits like \"Loser,\" \"Here Without You,\" and \"When I'm Gone.\" Arnold's vocal range and lyrics focused on love and love lost, which fueled the group to stardom. Arnold died on February 7 from a type of kidney cancer. Afrika Bambaataa, 68 Afrika Bambaataa. Paul Natkin/WireImage/Getty A hip-hop pioneer during the 1970s and 1980s, Lance Taylor, known professionally as Afrika Bambaataa, first gained attention as a DJ in the Bronx. He signed with Tommy Boy Records in 1981 and released landmark songs like \"Jazzy Sensation\" and \"Planet Rock.\" He would go on to influence the likes of Queen Latifah and A Tribe Called Quest throughout his career. Bambaataa founded the hip-hop awareness group, Universal Zulu Nation, in the 1970s to steer kids away from gang life. Bambaataa stepped down as the head of the organization in 2016 after accusations of sexual abuse . Bambaataa denied all claims. He died on April 9 due to prostate cancer . Rob Bass, 59 Rob Bass. Al Pereira/Michael Osche Archives/Getty Images One of the icons responsible for bringing hip-hop to the mainstream, Rob Bass crafted the iconic track \"It Takes Two\" alongside       media: [{"source": "Billboard", "title": "Jamie Miller Becomes First Male Solo Welsh Artist to Top U.K. Singles Chart in 41 Years With ‘Babydoll’", "link": "https://www.billboard.com/music/chart-beat/jamie-miller-babydoll-number-1-uk-singles-chart-1236367178/", "summary": "Jamie Miller ’s “Babydoll” has ascended to No. 1 on the U.K. s Official Singles Chart (dated Oct. 23), making him the first Welsh artist in 15 years to land a chart-topping single. The Cardiff-born singer’s achievement marks the first time a Welsh artist has topped the U.K. singles chart since Sian Evans featured on DJ Fresh’s “Louder,” which reached No. 1 in 2011. He also becomes the first Welsh solo male artist to lead the chart in 41 years, since Shakin’ Stevens topped the chart with his holiday hit “Merry Christmas Everyone” in 1985. “Babydoll,” which has become a viral smash in recent weeks due to Miller’s two-step choreography trend, narrowly edged out Tate McRae’ s “Housewife” (No. 2) to hit the summit. Miller told the Official Charts Company in a statement: “I don t even know what to say other than thank you so much for getting me No. 1. This is the biggest thing that s ever happened to me in my life I love you guys.” Elsewhere on the chart, Olivia Rodrigo ’s “Expectations” remix with Chappell Roan lands at No. 3. Ashe’s “Stop the Wedding” follows at No. 4, while Sienna Spiro’s previous chart-topper “Great Expectation” falls to No. 5. Country superstar Zach Bryan scores a new U.K. chart best as “Lies,” featuring Lana Del Rey, climbs to No. 7. Bryan also lands another track in the top 40, with “Lodi When” reaching No. 33 following the release of his new EP, Young Manhood and Other Donatable Organs . Fontaines D.C., who reins triumphant on this week’s Official Albums Chart with chart-topping fifth LP Dopamine Chamber , lands three songs in the top 40. Marianne” finishes at No. 12, marking a new personal best for the Irish five-piece, while “Japan” debuts at No. 14 and “Demolition” enters at No. 18. Justice also returns to the U.K. top 40 for the first time in 20 years. The French electronic duo’s new Grand Theft Auto VI song, “Flower In a Hurricane” featuring Tame Impala and SZA, finishes at No. 31. Rounding out the week’s chart highlights, Michael Jackson’s classic “Thriller” creeps back into the top 40 at No. 39 as Halloween approaches.", "date_str": "2026-10-23T17:00:00+00:00", "hash": "11788f47ee64a05d", "title_fa": "جیمی میلر با «Babydoll» به اولین هنرمند ولزی سولو مرد تبدیل شد که در 41 سال گذشته در جدول تک آهنگ های بریتانیا قرار گرفت.", "summary_fa": "«Babydoll» جیمی میلر در جدول تک‌آهنگ‌های رسمی بریتانیا (مورخ 23 اکتبر) به رتبه 1 صعود کرد و او را به اولین هنرمند ولزی در 15 سال اخیر تبدیل کرد که موفق به کسب یک تک آهنگ برتر شد. موفقیت این خواننده متولد کاردیف اولین بار است که یک هنرمند ولزی پس از حضور سیان ایوانز در آهنگ \"Louder\" از دی جی فرش که در سال 2011 به رتبه اول رسید، در صدر جدول تک آهنگ های بریتانیا قرار گرفت. او همچنین به اولین هنرمند مرد ولزی تبدیل شد که در 41 سال گذشته چارت را رهبری می‌کند، از زمانی که Shakin' Stevens با آهنگ تعطیلاتش «Merry Christmas Everyone» در سال 1985 در صدر جدول قرار گرفت. برای زدن قله میلر در بیانیه‌ای به شرکت نمودارهای رسمی گفت: «من حتی نمی‌دانم چه بگویم جز اینکه از شما بسیار سپاسگزارم که من را شماره 1 کردید. این بزرگترین اتفاقی است که در زندگی من برای من افتاده است. در جای دیگری از چارت، ریمیکس «انتظارات» اولیویا رودریگو با چاپل روان در رتبه 3 قرار می گیرد. «عروسی را متوقف کنید» از اش در رتبه 4 قرار می گیرد، در حالی که «انتظار بزرگ» از سینا اسپیرو در رتبه 5 قرار دارد. با حضور لانا دل ری به شماره 7 صعود می کند. برایان همچنین آهنگ دیگری در 40 آهنگ برتر قرار می گیرد که آهنگ Lodi When به شماره 7 رسید. 33 پس از انتشار EP جدید او، جوانمردی و سایر اعضای قابل اهدا. Fontaines D.C. که در چارت آلبوم های رسمی این هفته با رتبه پنجم آلبوم دوپامین Chamber پیروز شد، سه آهنگ را در بین 40 آهنگ برتر به دست آورد. ماریان در رتبه 12 قرار گرفت و بهترین آلبوم شخصی جدید برای پنج قطعه ایرلندی را به خود اختصاص داد، در حالی که \"Japan\" در رتبه 8.14 اولین بار", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Jamie-Miller-Matthew-Langlois-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Fontaines D.C. Earns 2026’s Biggest Opening Week By a Group as ‘Dopamine Chamber’ Hits No. 1 on U.K. Albums Chart", "link": "https://www.billboard.com/music/chart-beat/fontaines-dc-dopamine-chamber-number-1-uk-albums-chart-1236364318/", "summary": "Fontaines D.C. has secured its second No. 1 on the U.K. s Official Albums Chart with Dopamine Chamber , delivering one of the biggest album debuts of 2026 so far. Related Fontaines D.C. s Dopamine Chamber : Every Song Ranked Fontaines D.C. Enlist Rosalía for Stunning Duet Where Is Gone? : Listen Tate McRae Debuts at No. 1 In Australia With ‘Housewife’ According to the Official Charts Company, the Irish five-piece shifted more than 70,000 chart units during the album’s opening week for the chart dated Oct. 23, giving Dopamine Chamber the third-biggest opening week for an album in 2026, following Harry Styles’ Kiss All the Time. Disco, Occasionally (183,000 chart units) and Olivia Rodrigo’s you seem pretty sad for a girl so in love (103,000 chart units). It marks the band’s second U.K. chart-topper, following 2022’s Skinty Fia . Reviewing Dopamine Chamber for Billboard U.K. , editor Thomas Smith wrote that the album treads a fine line between introspection and darkness, with stadium-headlining ambition and does so superbly, adding that the set could be the start of the band s Imperial Phrase, to borrow a phrase from Pet Shop Boys’ Neil Tenant. Rodrigo’s you seem pretty sad follows at No. 2, while Michael Jackson’s The Essential Compilation lands at No. 3. Olivia Dean’s The Art of Loving holds firm at No. 4, while Sienna Spiro’s July debut LP, Visitor , rounds out the top five. British-Zimbabwean singer Rachel Chinouriri earns her first top 10 album as sophomore LP I Think I Spoke Too Soon finishes at No. 9, with Zach Bryan’s Young Manhood and Other Donatable Organs coming in at No. 11. Tate McRae’s 2025 album So Close To What also rebounds into the top 40, landing at No. 29 following renewed interest sparked by her latest single, “Housewife.” Midlands singer-songwriter Nieve Ella scores a milestone as her debut album, How Long Will It Take? , enters the chart at No. 31.", "date_str": "2026-10-23T17:00:00+00:00", "hash": "e8dfa571a6ae5af5", "title_fa": "Fontaines D.C بزرگترین هفته افتتاحیه سال 2026 توسط گروهی را به دست آورد که «اتاق دوپامین» رتبه اول جدول آلبوم های بریتانیا را به دست آورد.", "summary_fa": "Fontaines D.C با دوپامین چمبر دومین شماره 1 جدول آلبوم های رسمی بریتانیا را به دست آورده است و یکی از بزرگترین آلبوم های سال 2026 را ارائه کرده است. اتاق دوپامین مربوط به فونتینز دی سی: هر آهنگ رتبه بندی شده فونتینز دی سی. روزالیا را برای دوئت خیره کننده کجا رفته؟ : گوش دادن به اولین حضور تیت مک‌ری در شماره. 1 در استرالیا با «Housewife» طبق اعلام شرکت نمودارهای رسمی، این پنج قطعه ایرلندی بیش از 70000 واحد چارت را در هفته افتتاحیه آلبوم برای چارت مورخ 23 اکتبر جابجا کرد و به Dopamine Chamber سومین هفته افتتاحیه بزرگ آلبوم را در سال 2026، پس از هری استایلز «Kiss All the Time» داد. دیسکو، Occasionally (183000 واحد نمودار) و Olivia Rodrigo برای دختری بسیار عاشق به نظر می رسد بسیار غمگین هستند (103000 واحد نمودار). این دومین گروه در بریتانیا است. پس از Skinty Fia در سال 2022، برترین نمودار. سردبیر توماس اسمیت، با بررسی Dopamine Chamber برای Billboard U.K، نوشت که این آلبوم خط باریکی را بین درون نگری و تاریکی، با جاه‌طلبی سرفصل استادیوم طی می‌کند و این کار را فوق‌العاده انجام می‌دهد، و اضافه کرد که این مجموعه می‌تواند آغازی بر عبارت Imperial گروه باشد، تا عبارتی از پت شاپ پسران نیل تنانت را قرض بگیرم. به نظر می‌رسد شما بسیار غمگین از رودریگو در رتبه دوم قرار می‌گیرد، در حالی که فیلم The Essential Compilation از مایکل جکسون در رتبه 3 قرار می‌گیرد. The Art of Loving اثر اولیویا دین در رتبه 4 قرار دارد، در حالی که اولین آلبوم LP سینا اسپیرو با عنوان Visitor در ژوئیه، پنج نفر برتر را تکمیل می کند. راشل چینوریری، خواننده بریتانیایی زیمبابوه‌ای، اولین آلبوم 10 آلبوم برتر خود را به عنوان آلبوم دوم LP I Think I Speke Too Soon در رتبه 9 به پایان", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/Fontaines-DC-Elizaveta-Porodina-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Cardi B Treats Herself to Extremely Rare $3M Pink ‘Barbie’ Rolex Daytona for Her Birthday: ‘Gift From Me to Me’", "link": "https://www.billboard.com/music/rb-hip-hop/cardi-b-rare-pink-rolex-3-million-dollar-birthday-video-1236367173/", "summary": "Cardi B is treating herself after turning 34 earlier in October. The Bronx native flexed an extremely rare pink Barbie Rolex Daytona in an Instagram post on Thursday (Oct. 22), which appears to have a price tag pushing $3 million. Related Cardi B Reveals Her Pick for the Greatest Album of All Time That Every Woman Should Listen To No Beef: Cardi B Buys a Coach Bag After Controversy Over Like What (Freestyle) Lyric Cardi B Explains Why She d Rather Spend Money at the Strip Club Than on a Private Jet From Belcalis to Cardi B…a gift from me to me!! Thank you @Mavani for searching all around the world and finding me this watch, authenticated by Rolex, she wrote to Instagram. And thank you @pristine_jewelers for my custom made ring.. 7 karat natural diamonds especially made for me!! Jeweler Mavani searched far and wide across the globe to find Cardi the exact factory-made watch she wanted, and she wouldn t settle for any aftermarket wristwear. Mavani estimates in the video Cardi shared that there are only 10 made in the world, and hers was the only one for sale. Thank you for searching everywhere around the world. I want to say thank you because I know I was driving you crazy, but I need somebody I trusted, she said in the video while showing off the shining bezel filled with pink sapphires. No aftermarket s t, all factory. I deserve; I work so hard. Mavani — who has serviced the likes of Drake and Kim Kardashian — confirmed the seven-figure price tag on Instagram Stories, posting a pair of wire transfers from Cardi totaling $2,850,000. No capping over here! No after market Barbie s! he wrote on his IG Story. The wire hit @IamCardiB. Billboard has reached out to Rolex for comment. The spoils didn t stop there for the Grammy-winning rapper, who also revealed in her post that she had purchased a seven-carat diamond ring and added a pink Hermès Mini Kelly bag to her growing collection, which will perfectly match her new Barbie Rolex. Cardi B turned 34 on Oct. 11, and she has been booked and busy throughout 2026. She launched her first-ever headlining arena tour, which grossed more than $70 million, won best hip-hop at the MTV VMAs, picked up a win at the BET Awards and notched a top 25 hit on the Billboard Hot 100 with AH HA. The accolades don t stop there: Cardi will accept Billboard Canada ’s first-ever Global Woman of the Year award in November. Find photos and clips of Cardi B s fresh timepiece below. View this post on Instagram", "date_str": "2026-10-23T16:29:48+00:00", "hash": "bc1284fa73ee0857", "title_fa": "Cardi B برای تولدش از خود با Rolex Daytona صورتی بسیار نادر 3 میلیون دلاری استفاده می کند: «هدیه من به من»", "summary_fa": "کاردی بی بعد از اینکه اوایل اکتبر 34 ساله شد در حال درمان خود است. این فرد بومی برانکس روز پنجشنبه (22 اکتبر) یک باربی رولکس دیتونا صورتی بسیار کمیاب را در پستی در اینستاگرام به نمایش گذاشت که به نظر می رسد قیمت آن 3 میلیون دلار است. Cardi B انتخاب خود را برای بهترین آلبوم تمام دوران که هر زنی نباید بدون گوشت گاو گوش کند، فاش می‌کند: Cardi B پس از بحث و جدل در مورد آنچه (آزادی) ترانه‌ای می‌خرد، Cardi B توضیح می‌دهد که چرا او ترجیح می‌دهد در استریپ کلاب پول خرج کند تا اینکه برای یک جت شخصی از من به من می‌رسد! از شما @Mavani که در سراسر جهان جستجو کردید و این ساعت را که توسط رولکس تأیی ally sports her CEO BADDIES iced-out chain and a black shirt and skirt outfit and holds up a blingy Natalie necklace before laying down, only to wake up in full North gear in a clip she captioned Uno reverse. In place of her lopsided bob and lounge clothes, Nunn is suddenly transformed into a mature version of Kim Kardashian and ex-husband Ye s eldest daughter, down to the 13-year-old s signature long candy blue hair in pigtails held up by studded bracelets, spiked collar, blue grillz, death metal sweatshirt and hand and lip piercings. Nunn lip-syncs along to the song, bouncing her head in a rocker fashion and then doubles down on the homage in a series of follow-up clips on railroad tracks where she rocks out and does some of North s signature mouth-covering hand motions to the metal riff from the teen s punk rap song #NOrth4evr. In other videos, Nunn keeps the act up by lip-syncing along to the viral phrase It looks like I m the best and you re the worst from the meme song ENA REMIX by Cótiles. Nunn also took the look on the road in a clip in which she s riding in a limo and feigns shyness as fans scream hi Northy! I would love some ice cream, with the audio borrowed from a recent North ComplexCon promotional appearance . The Freaky Friday reverse came a day after North rolled up millions of views for her homage to Baddies star Nunn, in which she wore an exaggerated, prosthetic homage to Nunn s prominent chin and a version of her CEO Baddies chain. The Bad Girls Club alum instantly and enthusiastically approved and gave North props. “I GOTTA GET @northwest her baddie chain now! ❤️❤️❤️❤️ SHE GETS A BADDIE CHAIN HAPPY HALLOWEEN MONTH !!” Nunn wrote on Instagram in a repost of North’s original video.", "date_str": "2026-10-23T16:15:44+00:00", "hash": "a2ebcad99117de72", "title_fa": "ناتالی نون به طرز خنده‌داری پس از بازی نورث وست در نقش ستاره «بدیس» برای هالووین: «Uno Reverse» به او برمی‌گردد.", "summary_fa": "ناتالی نون ثابت کرد که نه تنها این شوخی را دریافت کرده است، بلکه می‌خواهد در روز پنجشنبه (22 اکتبر) زمانی که از لباس هالووین خود رونمایی کرد، بخشی از سرگرمی باشد. ستاره تلویزیون واقعیت Baddies به رپر نورث وست که برای هالووین لباس او را به تن کرده بود، با چرخاندن میزها و اتخاذ ظاهر گوتی/ایمویی نورث در مجموعه‌ای از ویدیوهای TikTok واکنش نشان داد. مرتبط LISA، مایلی، کیسی ماسگریوز جان مایر: راهنمای موسیقی جدید جمعه کیم کارداشیان در لباس دختر نورث وست یکی از رقبای اولیه بهترین لباس هالووین است کریستین کاسترو جایزه یک عمر دستاورد بیلبورد را به نام عشق رمانتیک در اولین , cued to My Number1, cued to North1n, cued to North. مدیر عامل او BADDIES زنجیر یخی و پیراهن و دامن مشکی را به تن دارد و قبل از دراز کشیدن یک گردنبند زیبای ناتالی را بالا می‌گیرد، اما در کلیپی که او زیرنویس Uno معکوس را نوشته بود، با دنده کامل شمال از خواب بیدار شد. نون به جای لباس‌های باب و لانج، ناگهان به نسخه‌ای بالغ از کیم کارداشیان و همسر سابقش یعنی دختر بزرگ یه، تبدیل می‌شود تا موهای بلند آب نباتی 13 ساله با دم خوک‌هایی که با دستبندهای میخ‌دار، یقه‌های قلاب‌دار، یقه‌های فلزی و یقه‌های فلزی و کباب‌پزهای آبی بلند شده است. نون با آهنگ لب‌های همگام می‌کند، سرش را به شکل راکر تکان می‌دهد و سپس در یک سری کلیپ‌های بعدی در مسیر راه‌آهن ادای احترام می‌کند، جایی که تکان می‌خورد و برخی از حرکات دستی که نورث دهان را می‌پوشاند به ریف متال آهنگ رپ پانک نوجوان #NOrth4ev انجام می‌دهد. در ویدیوهای دیگر، نون با همگام سازی لب با عبارت ویروسی به نظر می رسد که من بهترین هستم و شما بدترین آهنگ میم ENA REMIX از کوتیلس هستید، این کار را ادامه می دهد. نون همچنین", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/1688006461-e1792769961944.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۹:۴۵"}, {"source": "Billboard", "title": "Seeker Music Acquires JoJo’s Catalog, Including Hit ‘Too Little Too Late’", "link": "https://www.billboard.com/pro/seeker-music-acquires-jojos-catalog/", "summary": "Seeker Music has partnered with pop/R B artist JoJo to acquire her original and 2018 re-recorded versions of JoJo and The High Road. The news arrives the same day as JoJo releases the 20th anniversary deluxe edition of The High Road on streaming platforms via Seeker Music. The new version of the album, first released in 2006, includes a Spanish-language rendition of her hit Too Little Too Late. JoJo is the latest talent to partner with Seeker Music, an independent music company founded by songwriter Evan Bogart and backed by M G Investments. Since quietly launching in 2020, the company has acquired shares in 19,000 copyrights, including songs written and recorded by Beyoncé , Christopher Cross , Drake , The Go-Gos , Jay Sean , J-Kwon , Joan Jett and Lewis Capaldi . The company states that their holdings are worth over $400 million to date. Related Publishing Briefs: Seeker Enters Global Distribution Partnership With Virgin — Plus, UMPG Rebrands Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit In March, Seeker Music Group announced that it had secured $267 million through an asset backed security to fund future catalog acquisitions. This was Seeker’s first capital raise through a debt offering, and it was arranged by backer M G and rated by Kroll, Fitch and S P. JoJo has been working in the entertainment industry as an actor and singer since childhood, and she marked her arrival as a hitmaker in popular music at just 13 with the release of Leave (Get Out). Now, with her partnership with Seeker, much of JoJo s catalog is united in one place. Seeker will work with the original versions of her self-titled debut album and The High Road, plus her re-recordings of those works. Seeker, however, has already had pieces of the catalog before this deal with JoJo. The company already holds publishing interests in Too Little Too Late, via co-songwriter RuthAnne Cunningham, and Leave (Get Out), via Soulshock Karlin’s catalog from Notting Hill Music. Already the company, which is known for its active approach to marketing older music, has worked to bring the music to new fans. This includes supporting Levi Mario s reimagining 2 Little 2 Late and Alexander Stewart s The Way a Heart Breaks, which interpolates Too Little Too Late. JoJo says of the deal: “Deciding who to trust with such a personal and important part of my catalog wasn’t something I took lightly. So, when discussio", "date_str": "2026-10-23T16:11:28+00:00", "hash": "cd1f4f55b107d0d5", "title_fa": "Seker Music کاتالوگ JoJo را به دست آورد، از جمله آهنگ «خیلی کم خیلی دیر»", "summary_fa": "Seeker Music با JoJo هنرمند پاپ/آر بی شریک شده است تا نسخه‌های اصلی و ضبط‌شده 2018 JoJo و The High Road را به دست آورد. این خبر در همان روزی می رسد که جوجو نسخه لوکس بیستمین سالگرد The High Road را از طریق Seeker Music روی پلتفرم های استریم منتشر کرد. نسخه جدید آلبوم که برای اولین بار در سال 2006 منتشر شد، شامل اجرای اسپانیایی زبان آهنگ آهنگ او خیلی کم خیلی دیر است. جوجو آخرین استعدادی است که با Seeker Music، یک شرکت موسیقی مستقل که توسط ترانه سرا ایوان بوگارت تأسیس شده و توسط M G Investments حمایت می شود، شریک شده است. از زمان راه اندازی بی سر و صدا در سال 2020، این شرکت سهامی در 19000 حق چاپ، از جمله آهنگ های نوشته و ضبط شده توسط بیانسه، کریستوفر کراس، دریک، گو-گوس، جی شان، جی کوون، جوآن جت و لوئیس کاپالدی به دست آورده است. این شرکت بیان می کند که دارایی آنها تا به امروز بیش از 400 میلیون دلار ارزش دارد. خلاصه‌های مربوط به انتشار: Seeker وارد شراکت توزیع جهانی با Virgin شد - به علاوه، UMPG Rebrands Diddy از زندان نیوجرسی به تأسیسات مشابه در پنسیلوانیا ویزر نقل مکان کرد تا جایزه Legend of Live را در سال 2026 دریافت کند. تامین مالی خریدهای کاتالوگ آینده این اولین افزایش سرمایه Seker از طریق یک پیشنهاد بدهی بود، و توسط حامی M G تنظیم شد و توسط Kroll، Fitch و S P رتبه‌بندی شد. اکنون، با مشارکت او با Seeker، بسیاری از کاتالوگ JoJo در یک مکان متحد شده است. Seeker با نسخه های اصلی اولین آلبوم خود و The High Road، به علاوه ضبط مجدد آن آثار، کار خواهد کرد. با این حال، Seker قبلاً قطعاتی از کاتالوگ را قبل از این معامله با JoJo داشته است. این شرک  با مدل موی شیکی که اخیراً گرانده پوشیده است، موهایش چند اینچ بالاتر از شانه‌هایش کوتاه می‌شود، و انتهای آن به شکلی سرحال به سمت بالا می‌چرخد. گرانده اجازه داد ظاهر جدید خودش صحبت کند، عکس‌ها را با یک قلب ساده شرح می‌دهد و آرایشگر براندون پیچ را تگ می‌کند. نظرات به سرعت مملو از دوستان مشهوری شد که از تغییر چهره برنده گرمی تعریف می کردند، با نوشتن جیجی حدید، بسیار زیبا!!!!!!!!! و بازیگر پیروز دانیلا مونه در حال تایپ کردن، عیار طبیعی. اما نظر آلوارز قطعاً جلوگیرترین بود. عکاس نوشت: می خواهم از شما درخواست کنم. گرانده و آلوارز برای اولین بار در سال 2015 با هم قرار گرفتند و زمانی که او به عنوان رقصنده پشتیبان خواننده کار می کرد با هم ملاقات کردند. آنها زمانی در سال 2016 از هم جدا شدند، اما یک دهه بعد دوباره عاشقانه خود را احیا کردند، و طرفداران آنها را در طول تابستان 2026 در کنار هم در میان تور Eternal Sunshine Tour و آلبوم گلبرگ بازیگر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/P103MHHX-e1786379508733.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۱۸:۵۶"}, {"source": "Billboard", "title": "After a Turbulent Year, BNXN Is ‘Back Outside’ & Taking Charge of His Career: Find His Track-by-Track Guide to New EP", "link": "https://www.billboard.com/lists/bnxn-still-in-charge-back-outside-interview/", "summary": "After a heated split with his former management team in 2025, BNXN finds himself in redemption mode. The Nigerian hitmaker, who dropped out of college after catching Burna Boy s attention in the early 2020s, is looking to recapture his momentum, one song at a time. “A whole lot has changed,” BNXN reflects shortly after releasing his new EP, Still in Charge . “After I dropped the Captain album, I toured, reshuffled my team, and took a lot of time off to prepare the music that was coming next. Came back in May and dropped a little project with Sarz called The Game Needs Us. One of the songs went really crazy, Back Outside. I m really excited I got to put that out because it showed people that [ Captain ] wasn t a joke. He really knows what he s doing.” With Still in Charge , released earlier this month, the Afrobeats star sounds rejuvenated and eager to turn the page. Whether he s joining forces with Asake on the opener “Eja Meja” or wrestling with his past on “Deliberate Work,” BNXN (pronounced Benson) moves with purpose and intention. The six-track offering also radiates a warm, festive energy as he looks to shed the remnants of his turbulent past and embrace a fresh start. On “Shamaya,” BNXN trades his frustrations for celebration, revealing a lighter, more carefree side of the twenty-something singer-songwriter. Billboard caught up with BNXN for his explanation of each of the six tracks on Still in Charge , the surprising amount he paid Qing Madi for her background vocals on “16,” and how he bounced back from his highly publicized online crashout.", "date_str": "2026-10-23T15:16:31+00:00", "hash": "a5427531d34fb879", "title_fa": "پس از یک سال پرتلاطم، BNXN \"بازگشت به بیرون\" است و مسئولیت حرفه خود را بر عهده می گیرد: راهنمای آهنگ به تراک او را برای EP جدید پیدا کنید", "summary_fa": "پس از جدایی شدید با تیم مدیریت سابق خود در سال 2025، BNXN خود را در حالت رستگاری می بیند. هیت ساز نیجریه ای که پس از جلب توجه Burna Boy در اوایل دهه 2020، کالج را رها کرد، به دنبال این است که شتاب خود را دوباره به دست آورد، یک آهنگ. BNXN مدت کوتاهی پس از انتشار EP جدید خود، Still in Charge، منعکس می کند: «خیلی چیزها تغییر کرده است. «بعد از اینکه آلبوم کاپیتان را رها کردم، به تور رفتم، تیمم را تغییر دادم و زمان زیادی را برای آماده کردن موسیقی که در راه بود، گرفتم. در ماه می برگشتم و پروژه کوچکی را با Sarz به نام The Game Needs Us منتشر کردم. یکی از آهنگ ها واقعا دیوانه شد، Back Outside. من واقعاً هیجان‌زده‌ام که مجبور شدم آن را بیان کنم، زیرا به مردم نشان داد که [کاپیتان] شوخی نبود. او واقعاً می داند که دارد چه کار می کند.» با Still in Charge که در اوایل این ماه منتشر شد، ستاره Afrobeats جوان شده و مشتاق به تغییر صفحه به نظر می رسد. چه او در حال پیوستن به نیروهای Asake در بازکننده \"Eja Meja\" یا کشتی با گذشته خود در \"Deliberate Work\" باشد، BNXN (تلفظ بنسون) با هدف و نیت حرکت می کند. پیشنهاد شش آهنگی همچنین انرژی گرم و جشنی را ساطع می کند، زیرا او به دنبال رها کردن بقایای گذشته آشفته خود و در آغوش گرفتن شروعی تازه است. در «شمایا»، BNXN ناامیدی‌هایش را با جشن عوض می‌کند و جنبه‌ای سبک‌تر و بی‌خیال‌تر از خواننده و ترانه‌سرا بیست و چند ساله را نشان می‌دهد. بیلبورد با BNXN برای توضیح هر یک از شش آهنگ در Still in Charge، مبلغ شگفت‌انگیزی که به چینگ مادی برای آواز پس‌زمینه‌اش در «16» پرداخت کرد، و نحوه بازگشت او از کراش اوت", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/bnxn-2026-press-cr-mykyta-vashchenko-billboard-1800.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۸:۴۶"}, {"source": "Billboard", "title": "John Legend to Appear With Democratic Ohio Gov. Candidate Amy Acton Amid Backlash Against Opponent’s ‘Deeply Troubling’ Ad", "link": "https://www.billboard.com/culture/politics/john-legend-appear-ohio-gov-candidate-acton-backlash-ramaswamy-1236367094/", "summary": "John Legend will throw his hat into the ring for Ohio gubernatorial candidate Dr. Amy on Monday (Oct. 26), when he is slated to appear with the former state director of the Ohio Department of Health at a rally in Dayton. Legend is just one of the bold-faced names Acton will bring out on the road with her in the lead-up to the Nov. 3 midterm election in which she is facing off against tech mogul and former DOGE co-lead Vivek Ramaswamy. First up on Sunday (Oct. 25) will be a joint appearance in Akron with Democratic U.S. Senator from Georgia Rev. Raphael Warnock, followed by a rally in Cincinnati on Oct. 28 featuring Queen City natives Aaron Dessner and Matt Berninger of The National. Springfield, Ohio native Legend has long used his platform to stump for candidates and causes, backing former President Barack Obama in 2008 and endorsing former Vice President Kamala Harris in her 2024 presidential bid. He also spoke out during that campaign against unfounded, hateful racist attacks by then-candidate Donald Trump and running mate and Ohio native JD Vance against the Haitian resident of Springfield. Legend s support for Acton comes as Ramaswamy s campaign has come under fierce bipartisan pushback for a campaign ad in which Acton s long-estranged mother repeatedly calls her daughter a liar while insinuating that Acton s claims that she was sexually abused by her stepdad, and that the family was homeless and lived in a tent for a period, are untrue. “It’s not easy for a mother to say this, but Amy has a serious problem,” Donna Arthur says in the ad. “She lies about her past. She says she grew up living in a tent. None of that is true. She’s lied her entire life. Acton, 60, has said she hasn t spoken to her mother since she was 12-years-old, when officials removed her from her mother s custody. Police arrested Acton s stepfather in July 1978 on rape charges , with a grand jury later indicting Arthur for engaging in sexual conduct with Acton when she was under the age of 13. Arthur, who pleaded not guilty to the charges initially, did not appear in court and later fled, along with her mother, and became a fugitive. 13ABC also reported that documents provided by Acton s campaign include police and court records and a 1982 sheriff s report in which a park manager confirmed that Acton s stepfather, Cledith Arthur, lived at the campground years earlier. The ad, which many political pundits have called the most disturbing of a very heated political season, has gotten pu", "date_str": "2026-10-23T15:16:30+00:00", "hash": "fe8e12699023103d", "title_fa": "جان لجند با امی اکتون، نامزد دموکرات فرماندار اوهایو در میان واکنش‌های شدید علیه تبلیغ «عمقاً نگران‌کننده» مخالف ظاهر می‌شود.", "summary_fa": "جان لجند روز دوشنبه (26 اکتبر)، زمانی که قرار است همراه با مدیر سابق وزارت بهداشت اوهایو در یک گردهمایی در دیتون ظاهر شود، کلاه خود را برای کاندیدای فرمانداری اوهایو، دکتر امی، به رینگ خواهد انداخت. Legend تنها یکی از نام‌های جسورانه‌ای است که اکتون در انتخابات میان‌دوره‌ای 3 نوامبر با او در جاده‌ها به میدان می‌آورد و در آن با غول فناوری و همکار سابق DOGE ویوک راماسوامی روبرو می‌شود. اولین بار در روز یکشنبه (اکتبر. 25) یک حضور مشترک در آکرون با سناتور دموکرات ایالات متحده از جورجیا کشیش رافائل وارنوک خواهد بود و پس از آن گردهمایی در سینسیناتی در 28 اکتبر با حضور بومیان کوئین سیتی آرون دسنر و مت برنینگر از The National برگزار خواهد شد. افسانه بومی اسپرینگفیلد، اوهایو، مدت‌هاست که از پلتفرم خود برای حمایت از نامزدها و اهداف، حمایت از باراک اوباما، رئیس‌جمهور سابق در سال 2008 و حمایت از معاون رئیس‌جمهور سابق کامالا هریس در رقابت‌های ریاست‌جمهوری سال 2024 استفاده کرده است. او همچنین در جریان آن مبارزات انتخاباتی علیه حملات نژادپرستانه بی‌اساس و نفرت‌انگیز توسط دونالد ترامپ، نامزد سابق انتخابات و جی‌دی ونس، اهل اوهایو، علیه ساکنان هائیتی در اسپرینگفیلد صحبت کرد. حمایت افسانه‌ای از اکتون در حالی صورت می‌گیرد که کمپین راماسوامی با واکنش شدید دو حزبی برای تبلیغات کمپینی روبرو شده است که در آن مادر اکتون که مدت‌ها از او دور شده بود، بارها دخترش را دروغگو خطاب می‌کند و در عین حال القا می‌کند که اکتون ادعا می‌کند که توسط پدرخوانده‌اش مورد آزار جنسی قرار گرفته است، و اینکه خانواده بی‌خانمان بوده و در یک چادر زندگی می‌کنند. دونا آرتور در تبلیغ می گوید: گفتن این حرف برای مادر آسان نیست، اما امی یک مشکل جدی دارد. او در مورد گذشته خود دروغ می گوید. او می گوید که در یک چادر بزرگ شده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P106J9VJ-e1792765487484.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۱۸:۴۶"}, {"source": "Billboard", "title": "‘People Might Think I’m a Closed Book’: On Her Debut Album, Jazzy Is Opening Up", "link": "https://www.billboard.com/music/music-news/jazzy-interview-peace-and-patience-album-calvin-harris-1236367057/", "summary": "Jazzy had made a lot of music for her debut album — and when it came time to decide which songs would make it onto the project, she selected tracks around two related themes. These concepts were so crucial to the music and the experiences that informed it that she ultimately made them the name of the album. This 13-song set, Peace Patience , is out today (Oct. 23) via Chaos Records. A tight 36 minutes of sumptuous house-leaning dance pop, the album is centered around Jazzy s gorgeously textured voice and cements her as a crucial next-gen dance pop hitmaker. Related Head Trip 2026 Was (Accidentally) the Craziest One-Night Lineup in EDM History: Seven Takeaways From the Historic Festival Tate McRae Debuts at No. 1 In Australia With Housewife LISA, Miley, Kacey Musgraves John Mayer: New Music Friday Guide She s developed this reputation in her native Ireland and nearby U.K. over the last half-decade with a series of chart hits, including 2023 s Giving Me — her first solo single, which reached No. 3 on the UK Singles Chart and hit No. 1 on the Official Irish Singles Chart, knocking “Miracle” by Calvin Harris and Ellie Goulding into the No. 2 position. Harris noticed, which led to him and Jazzy pairing up for May s Satisfy, which itself hit No. 1 on Billboard s Dance Airplay chart this past June. All in, the Dublin-born DJ/producer has made these successes look pretty easy — and in fact, she makes her journey from Dublin child violinist to chart-topping dance star sound pretty breezy too. Meeting with Billboard in a sunny office in the Capitol Records building in Los Angeles on a recent Friday morning, Jazzy — dressed in athleisure — is cheerful and warm. Tonight (Oct. 23), she ll play a set at the nearby nightclub Sound, the second to last date on an American club tour around Peace Patience . The album s release party will find her back in her native Dublin, where she plans celebrate at the pub with a handful of friends before joining many thousand more the next evening for a show at the city s 3Arena that will mark her biggest headlining performance to date. Here, Jazzy talks about her origins, her album and being in the studio with Harris. You ve said you had a lot of music to choose from for the album, some of it a few years old. Were you selecting songs around a theme in terms of what ultimately made it on? Yeah, I wanted them to be cohesive, and I wanted to pick ones that meant the most to me — ones with stories I wanted to tell. I feel like people might ", "date_str": "2026-10-23T15:01:51+00:00", "hash": "5a9f46a36213bc51", "title_fa": "\"مردم ممکن است فکر کنند من یک کتاب بسته هستم\": در اولین آلبوم خود، Jazzy در حال باز شدن است", "summary_fa": "Jazzy برای اولین آلبوم خود آهنگ های زیادی ساخته بود - و زمانی که زمان تصمیم گیری فرا رسید که کدام آهنگ ها وارد پروژه شوند، او آهنگ هایی را با دو موضوع مرتبط انتخاب کرد. این مفاهیم به قدری برای موسیقی و تجربیاتی که به آن کمک می‌کرد بسیار حیاتی بودند که در نهایت او آنها را به نام آلبوم تبدیل کرد. این مجموعه 13 آهنگی، صبر صلح، امروز (23 اکتبر) از طریق Chaos Records منتشر شد. این آلبوم با 36 دقیقه رقص پاپ مجلل و متمایل به هاوس، حول صدای بسیار زیبای Jazzy متمرکز شده است و او را به عنوان یک سازنده هیت پاپ رقص نسل بعدی تعیین می کند. Related Head Trip 2026 (به طور تصادفی) دیوانه‌کننده‌ترین ترکیب یک شبه در تاریخ EDM بود: هفت نکته از جشنواره تاریخی تیت مک‌ری در رتبه اول در استرالیا با زن خانه‌دار لیزا، مایلی، کیسی ماسگریوز جان مایر: New Musicby Friday Guide او در نزدیکی Ureput. در نیم دهه گذشته با مجموعه‌ای از پرفروش‌ها، از جمله Giving Me در سال 2023 - اولین تک‌آهنگ انفرادی او، که به رتبه 3 جدول تک‌آهنگ‌های بریتانیا رسید و در جدول رسمی تک‌آهنگ‌های ایرلندی به شماره 1 رسید و آهنگ Miracle توسط کالوین هریس و الی گولدینگ را به رتبه 2 رساند. هریس متوجه شد، که منجر به جفت شدن او و Jazzy برای May s Satisfy شد، که خود در ژوئن گذشته در جدول Dance Airplay بیلبورد در رتبه اول قرار گرفت. در مجموع، دی‌جی/تهیه‌کننده متولد دوبلین این موفقیت‌ها را بسیار آسان جلوه داده است - و در واقع، او سفر خود را از نوازنده کودک ویولن دوبلین تا ستاره‌ی رقص برگزیده در جدول، بسیار شاداب می‌کند. ملاقات با بیلبورد در یک دفتر آفتابی در ساختمان Capitol Records در لس آنجلس در صبح olas Sparks novel that ran on Broadway in 2024, will makes its West End debut this spring. The musical no cast has been announced will begin performances at the newly renamed Judi Dench Theatre (formerly the Shaftesbury Theatre) on March 10, 2027, [ ]", "date_str": "2026-10-23T15:08:58+00:00", "hash": "450d37b0104d5f88", "title_fa": "اولین نمایش موزیکال پلان‌های نوت بوک وست اند", "summary_fa": "نوت بوک، اقتباسی موزیکال اینگرید مایکلسون-بکا برانستتر از رمان نیکلاس اسپارکس که در سال 2024 در برادوی پخش شد، اولین نمایش خود را در بهار امسال وست اند انجام می دهد. این موزیکال هیچ بازیگری اعلام نشده است که اجراهای خود را در تئاتر جودی دنچ که به تازگی تغییر نام داده است (تئاتر سابق شفتزبری) در 10 مارس 2027 آغاز خواهد شد، [ ] The Notebook , اقتباس موزیکال روی صحنه اینگرید مایکلسون-بکا برونستتر از رمان نیکلاس اسپارکس که در بهار 20 در West2 اکران خواهد شد. کارگردانی این فیلم موزیکال بر عهده مایکل گریف و شل ویلیامز و طراحی رقص توسط کیتی اسپلمن خواهد بود. این موزیکال بر اساس رمان Sparks ساخته شده است، موسیقی و اشعار مایکلسون و کتابی از Brunstetter. داستان‌های مرتبط بازیگران ساشا بارون کوهن تایید کرد که در کوئنتین تارانتینو بازی می‌کند و در مرحله غربی بازی با تاریخ‌های در حال فروش اخبار اعلام شده است کیت بلانشت از تماشاگران لندنی می‌خواهد فیلمبرداری را متوقف کنند. سال‌ها پیش که این داستان چنین تأثیر ماندگاری در سراسر جهان خواهد داشت. واکنش جهانی باورنکردنی بوده است، و من خوشحالم که این آخرین تحول داستان را با تماشاگران لندن به اشتراک می‌گذارم.\" Watch on Deadline مایکلسون گفت: «چیزی که یک موزیکال را برای من بسیار خاص می‌کند، ماهیت مشارکتی آن است و نمی‌توانم تیم بهتری از افراد را تصور کنم که The Notebook را ساخته باشند.", "image_url": "https://deadline.com/wp-content/uploads/2024/03/240208_TheNotebook_R1-5-F_17412e-e1710354397577.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۱۸:۳۸"}, {"source": "Pitchfork", "title": "Chappell Roan Duets With Caroline Polachek, PinkPantheress, and Lola Young", "link": "https://pitchfork.com/story/c ter, Conover plays [ ]", "date_str": "2026-10-23T15:00:00+00:00", "hash": "8916a0012fcb55a2", "title_fa": "کریگ کانور از ساوترن چرم در فیلم براوو میکرودرام «جذاب هیولای جنوبی» که برای اولین بار در فیلم طاووس قرار دارد بازی می کند.", "summary_fa": "کریگ کانور خود را یک داستان‌نویس در South Charm نامیده است و اکنون این شانس را دارد که داستانی تلخ را در Charmed by a Southern Monster تعریف کند. میکرودرام عمودی فیلمنامه Bravo Original دوشنبه، 9 نوامبر، در برنامه تلفن همراه Peacock با نیکول متوکس در کنار کانور نمایش داده می شود. در فیلم The Charmed by a Southern Monster، کانور نقش [ ] را بازی می کند. داستان به دنبال Maeve است، یک تعمیرکار باهوش شرکتی که فرستاده می شود تا هانتر، یک قاتل شایعه شده، را برای فروش املاک خانواده اش متقاعد و اغوا کند. اما وقتی متوجه می‌شود که ترسناک‌ترین مرد شهر ممکن است در واقع بیشترین سوءتفاهم را داشته باشد و تنها کسی که می‌تواند از او در برابر دوست پسر خطرناک سابقش محافظت کند، میو در دنیای شکارچی گرفتار می‌شود. از آنجایی که اسرار خانوادگی و یک قرارداد توسعه میلیارد دلاری تهدید می‌کند ارتباط رو به رشد آنها را از بین ببرد، او باید با گذشته‌اش روبرو شود و تصمیم بگیرد که چقدر حاضر است برای عشق ریسک کند. در ددلاین تماشا کنید مرتبط: براوو مجموعه‌ای از بازیگران «مشکل شهر کوچک: تگزاس» شامل آلوم بحث‌برانگیز «برادر بزرگ» را به نمایش می‌گذارد. این سریال بدون فیلمنامه به دنبال جورجیا گی، دختر خانه‌دارهای واقعی شهر سالت لیک سیتی، هدر گی، بود که پس از ترک خانواده‌اش به زندگی ادامه می‌داد. براوو دومین درام عمودی خود را در برنامه تلفن همراه Peacock، Salon Confessionals، با بازی مدیسون لکروی، بازیگر Southern Charm، به نمایش گذاشت. مطالب مرتبط: عکس‌های بازیگران فصل ۱۲ «جذاب جنوبی»، تاریخ پخش تریلر در براوو تنظیم شد، هنر کلیدی فیلم Charmed by a Southern Monster را در زیر ببینید.", "image_url": "https://deadline.com/wp-content/uploads/2026/10/charmed-by-a-southern-monster-craig-conover-bravo-peacock.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۱۸:۳۰"}, {"source": "Deadline", "title": "Abramorama Takes North America Righ
