های اینترنتی با افراد ناشناس احتیاط کنند و پیشنهادها یا درخواست‌های مشکوک را به نهادهای امنیتی گزارش دهند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید"}, {"source": "IranWire", "title": "تحقیر رای قومیتی، هراس از فروپاشی؛ مناظره مهدی جمشیدی و احمد زیدآبادی", "link": "https://iranwire.com/fa/features/158363-%D8%AA%D8%AD%D9%82%DB%8C%D8%B1-%D8%B1%D8%A7%DB%8C-%D9%82%D9%88%D9%85%DB%8C%D8%AA%DB%8C-%D9%87%D8%B1%D8%A7%D8%B3-%D8%A7%D8%B2-%D9%81%D8%B1%D9%88%D9%BE%D8%A7%D8%B4%DB%8C-%D9%85%D9%86%D8%A7%D8%B8%D8%B1%D9%87-%D9%85%D9%87%D8%AF%DB%8C-%D8%AC%D9%85%D8%B4%DB%8C%D8%AF%DB%8C-%D9%88-%D8%A7%D8%AD%D9%85%D8%AF-%D8%B2%DB%8C%D8%AF%D8%A2%D8%A8%D8%A7%D8%AF%DB%8C/", "summary": "«احمد زیدآبادی» روزنامه‌نگار و تحلیل‌گر سیاسی در مناظره‌ای با «مهدی جمشیدی» عضو «جبهه انقلاب» و از طرفداران «جبهه پایداری» در رسانه ...", "date_str": "2026-10-01T15:23:08+00:00", "hash": "02562030cd5f3636", "title_fa": "تحقیر رای قومیتی، هراس از فروپاشی؛ مناظره مهدی جمشیدی و احمد زیدآبادی", "summary_fa": "«احمد زیدآبادی» روزنامه‌نگار و تحلیل‌گر سیاسی در مناظره‌ای با «مهدی جمشیدی» عضو «جبهه انقلاب» و از طرفداران «جبهه پایداری» در رسانه ... مقدمه مناظره میان مهدی جمشیدی، از نظریه‌پردازان جریان تندرو و ایدئولوژیک حاکمیت (جبهه انقلاب)، و احمد زیدآبادی، روزنامه‌نگار و تحلیل‌‌گر منتقد، تصویری عریان از بحران عمیق حکمرانی، سرکوب تکثر اجتماعی و هراس از فروپاشی ساختاری در جمهوری اسلامی ارایه می‌دهد . این مناظره که با محوریت بررسی «روز بعد از جنگ» برگزار شد، نشان داد چگونه شکاف‌های سیاسی و اجتماعی در ایران به نقطه‌ای بازگشت‌ناپذیر رسیده‌اند و حاکمیت در برابر مطالبات اولیه جامعه، از حقوق اقلیت‌ها و معترضان گرفته تا آزادی‌های مدنی، تنها به بازتولید سرکوب، تحقیر و انکار متوسل می‌شود. تحقیر اقلیت‌ها و انکار حقوق شهروندی در اندیشه تندروها یکی از افشاگرانه‌ترین بخش‌های این مناظره، برخورد جریان تندرو حاکمیت با موضوع اقوام و دموکراسی بود. مهدی جمشیدی با حملات تند به الگوی رای‌دهی اقوام در ایران، رای قومیتی را «مبتذل‌ترین»، «بی‌ارزش‌ترین» و «سخیف‌ترین» نوع رای خواند و مدعی شد که این آرا هیچ تناسبی با مردم‌سالاری ندارد. این موضع‌گیری با واکنش شدید احمد زیدآبادی همراه شد؛ زیدآبادی با تقبیح این نگاه تحقیرآمیز و توهین‌آمیز به اقوام ، تاکید کرد که تنوع قومی یک واقعیت عینی در جامعه ایران است و اقوام ایرانی دارای مطالبات کاملا مشروع و قانونی نظیر آموزش زبان مادری هستند. زیدآبادی تصریح کرد که در نظام‌های متکی بر حقوق بشر، رای هر شهروند از هر قومیت و طبقه‌ای دارای ارزش یکسان است و شهروندان حق دارند برای دستیابی به حقوق رفع تبعیض و تحقق مطالبات قومی خود از صندوق رای استفاده کنند. او تحقیر آرا و مطالبات اقوام را نشانه‌ای از نفی بنیادین تکثر اجتماعی و نادیده گرفتن حقوق اساسی میلیون‌ها شهروند ایرانی دانست که سال‌هاست تحت تبعیض مضاعف قرار دارند."}, {"source": "IranWire", "title": "دادگاه انقلاب تهران برای سه بازداشت‌شده اعتراضات دی‌ماه حکم اعدام صادر کرد", "link": "https://iranwire.com/fa/news-1/158364-%D8%AF%D8%A7%D8%AF%DA%AF%D8%A7%D9%87-%D8%A7%D9%86%D9%82%D9%84%D8%A7%D8%A8-%D8%AA%D9%87%D8%B1%D8%A7%D9%86-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%B3%D9%87-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B4%D8%AA%D8%B4%D8%AF%D9%87-%D8%A7%D8%B9%D8%AA%D8%B1%D8%A7%D8%B6%D8%A7%D8%AA-%D8%AF%DB%8C%D9%85%D8%A7%D9%87-%D8%AD%DA%A9%D9%85-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85-%D8%B5%D8%A7%D8%AF%D8%B1-%DA%A9%D8%B1%D8%AF/", "summary": "بر اساس گزارش سازمان حقوق بشری هرانا، با حکم شعبه ۲۳دادگاه انقلاب تهران، سه معترض بازداشت شده در اعتراضات دی‌ماه۱۴۰۴ به اعدام محکوم شده‌ ...", "date_str": "2026-10-01T16:17:12+00:00", "hash": "d8d567e894019f2b", "title_fa": "دادگاه انقلاب تهران برای سه بازداشت‌شده اعتراضات دی‌ماه حکم اعدام صادر کرد", "summary_fa": "بر اساس گزارش سازمان حقوق بشری هرانا، با حکم شعبه ۲۳دادگاه انقلاب تهران، سه معترض بازداشت شده در اعتراضات دی‌ماه۱۴۰۴ به اعدام محکوم شده‌ ... «خسرو محمدی‌نیا»، «مسعود توشمالانی» و «سیروان شعبانی»، سه بازداشت‌شده محبوس در زندان قزلحصار کرج با رای شعبه ۲۳دادگاه انقلاب به اعدام محکوم شدند. بر اساس گزارش سازمان حقوق بشری هرانا، با حکم شعبه ۲۳دادگاه انقلاب تهران، سه معترض بازداشت شده در اعت  در روز پنجشنبه ۱۹۴۹ نفر بازداشت شدند. در بعضی از موارد، نوجوانان در جریان درگیری‌ها آسیب دیده‌اند و گزارش‌هایی از جراحات چشمی و دیگر آسیب‌های جدی منتشر شده است. دولت فرانسه پس از تشدید خشونت‌ها نشست اضطراری برگزار کرد و نیروهای ضدشورش را به برخی مناطق فرستاد. با این حال، بخش بزرگی از اعتراضات همچنان مسالمت‌آمیز بوده است و بسیاری از دانش‌آموزان می‌گویند هدفشان جلب توجه به شرایط نامناسب مدارس و کمبود امکانات آموزشی است. لولا، دانش‌آموز ۱۶ ساله‌ای که در این اعتراضات شرکت کرده، گفته است: «از نظر ما، ما پیروز شده‌ایم؛ چرا که مدرسه امروز صبح تعطیل است.» او همچنین آنچه را «خشونت پلیس» می‌نامد محکوم کرده و گفته است استفاده از گاز اشک‌آور و برخورد فیزیکی با دانش‌آموزان، خشم معترضان را بیشتر کرده است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید."}, {"source": "BBC Persian", "title": "ترامپ: تاسیسات هسته‌ای ایران کارخانه مواد مخدر هم بودند", "link": "https://www.bbc.com/persian/articles/crlyjyyl112lo?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ، رئیس‌جمهور آمریکا، در سخنرانی انتخاباتی خود در دورانت اوکلاهاما برای نخستین بار مدعی شد که تاسیسات هسته‌ای ایران که هدف بمب‌افکن‌های بی‌۲ آمریکا قرار گرفتند، محل تولید مواد مخدر نیز بوده‌اند. او مدرکی برای این ادعا ارائه نکرد.", "date_str": "2026-10-02T11:17:08+00:00", "hash": "35e28e0a4ccf5cae", "title_fa": "ترامپ: تاسیسات هسته‌ای ایران کارخانه مواد مخدر هم بودند", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا، در سخنرانی انتخاباتی خود در دورانت اوکلاهاما برای نخستین بار مدعی شد که تاسیسات هسته‌ای ایران که هدف بمب‌افکن‌های بی‌۲ آمریکا قرار گرفتند، محل تولید مواد مخدر نیز بوده‌اند. او مدرکی برای این ادعا ارائه نکرد. آقای ترامپ هنگام یادآوری حمله آمریکا به این تاسیسات گفت که بمب‌ها به داخل آنچه او «کارخانه‌های مواد مخدر» خواند نفوذ کردند و تاکید کرد که این مراکز «هم هسته‌ای بودند و هم مواد مخدر.» او در ادامه از آنها با عنوان «کارخانه‌های مواد مخدر/هسته‌ای» یاد کرد. این نخستین بار است که آقای ترامپ در توضیح حملات آمریکا به تاسیسات هسته‌ای ایران، آنها را با تولید مواد مخدر مرتبط می‌کند. تاکنون هیچ مقام آمریکایی دیگری یا منبع مستقل معتبری اعلام نکرده است که تاسیسات هسته‌ای هدف قرارگرفته در ایران محل تولید مواد مخدر بوده‌اند. رئیس‌جمهور آمریکا در همان روز در دنتون تگزاس نیز بار دیگر گفت که آمریکا «چاره‌ای» جز اقدام علیه ایران نداشت، زیرا به گفته او ایران در آستانه دستیابی به سلاح هسته‌ای بود. او مدعی شد ایران تنها چند هفته با دستیابی به چنین سلاحی فاصله داشت؛ ادعایی که پیش‌تر نیز بارها از سوی او مطرح شده است. آقای ترامپ سپس از تگزاس به دورانت اوکلاهاما رفت؛ جایی که تجمعی برای حمایت از نامزدهای جمهوری‌خواه برگزار کرد. این سفر بخشی از کارزار او برای انتخابات میان‌دوره‌ای ماه نوامبر است. آقای ترامپ در مصاحبه‌ای جداگانه با شبکه نیوز۹ اوکلاهاما نیز گفت که ایران «هر روز ممکن است تسلیم شود» و بار دیگر تأکید کرد که اجازه نخواهد داد آن کشور به سلاح هسته‌ای دست یابد. او همچنین گفت که انتظار دارد با پایان جنگ، قیمت نفت کاهش یابد. ترامپ از آغاز جنگ همچنین بارها گفته است که هدف عملیات آمریکا از بین بردن توان هسته‌ای و نظامی ایران است. کاخ سفید نیز عملیات «خشم حماسی» را در چارچوب"}, {"source": "BBC Persian", "title": "خلبان پرواز فلای‌دبی: مصمم بودم نگذارم دیگران بمیرند", "link": "https://www.bbc.com/persian/articles/cmjrxrr7jg8vo?at_medium=RSS&at_campaign=rss", "summary": "کاپیتان هندی هواپیمای فلای‌دبی که در جریان حمله کمک‌خلبانش زخمی شد، می‌گوید که برای نجات جان خود جنگید اما مصمم بود نگذارد دیگران بمیرند.", "date_str": "2026-10-02T10:20:13+00:00", "hash": "eacef5394ace2835", "title_fa": "خلبان پرواز فلای‌دبی: مصمم بودم نگذارم دیگران بمیرند", "summary_fa": "کاپیتان هندی هواپیمای فلای‌دبی که در جریان حمله کمک‌خلبانش زخمی شد، می‌گوید که برای نجات جان خود جنگید اما مصمم بود نگذارد دیگران بمیرند. اسمیت ماچچار در صحبت با نخست وزیر هند، نارندرا مودی، گفت که وقتی متوجه شد هواپیما در حال سقوط است و باید کاری انجام دهد، کف کابین خلبان افتاده و با کمک‌ خلبانش گلاویز بود. او گفت: «من مجروح کف کابین افتاده بودم، اما به خودم گفتم برای آخرین بار تلاش کنم تا در را از داخل باز کنم.» او افزود: «دیگران وارد شدند و در کنترل اوضاع نقش ایفا کردند. من البته برای جان خودم می جنگیدم اما در عین حال می دانستم که نباید بگذارم دیگران بمیرند.» هواپیمای تل آویو که از دوبی عازم تل آویو بود روز چهارشنبه دو ساعت و نیم بعد از آغاز پرواز، بیش از ۱۷ هزار پا (۵۲۰۰ متر) سقوط کرد. در این هنگام بود که مسافران و خدمه پرواز بر کمک خلبان مهاجم غلبه کردند و کنترل هواپیما را دوباره به دست گرفتند. این پرواز ناچار شد به تبوک، شهری در شمال غربی عربستان تغییر مسیر دهد. کاپیتان این پرواز که نخست‌وزیر اسرائیل او را «قهرمان واقعی» نامید، با آمبولانس هوایی به بیمارستانی در ابوظبی منتقل شد. کمی بعد گزارش شد که وضعیت سلامت او پایدار است. آقای ماچچار با اشاره به تجربه ۱۷ سال خلبانی خود گفت: «من حتی با چشمان بسته هم می‌توانم بفهمم چه اتفاقی برای هواپیما می‌افتد.» نارندرا مودی، نخست‌وزیر هند، درباره آقای ماچچار گفت که «شجاعت، صبر و تصمیم گیری سریع او جان بسیاری را نجات داد» و افزود که هند به او افتخار می کند. سفارت هند در امارات روز پنجشنبه اعلام کرد که وضعیت سلامت آقای ماچچار «خوب و رو به بهبودی» است. دیپاک میتال، سفیر هند. در امارات نیز گفت که «به کاپیتان اسمیت به خاطر شجاعتش افتخار می کند»"}, {"source": "BBC Persian", "title": "کالیفرنیا ازدواج کودکان را رسما ممنوع کرد؛ ازدواجی که هنوز در ۳۲ ایالت آمریکا قانونی است", "link": "https://www.bbc.com/persian/articles/cw62j2p1ymxyo?at_medium=RSS&at_campaign=rss", "summary": "گوین نیوسام، فرماندار کالیفرنیا، این قانون را «اقدامی برای حفاظت از جوانان کالیفرنیا» خواند که تصویب آن بسیار دیر انجام می‌شود.", "date_str": "2026-10-02T09:51:08+00:00", "hash": "e49a5d69d7d05ac6", "title_fa": "کالیفرنیا ازدواج کودکان را رسما ممنوع کرد؛ ازدواجی که هنوز در ۳۲ ایالت آمریکا قانونی است", "summary_fa": "گوین نیوسام، فرماندار کالیفرنیا، این قانون را «اقدامی برای حفاظت از جوانان کالیفرنیا» خواند که تصویب آن بسیار دیر انجام می‌شود. کالیفرنیا رسما ازدواج کودکان را ممنوع کرد. گوین نیوسام، فرماندار این ایالت، قانونی را امضا کرده است که به این رویه پایان می‌دهد؛ رویه‌ای که هنوز در ۳۲ ایالت آمریکا قانونی است. بر اساس قانون جدید که از ۱۱ دی ۱۴۰۵ (۱ ژانویه ۲۰۲۷) اجرایی خواهد شد، افراد برای ازدواج در ایالت کالیفرنیا باید حداقل ۱۸ سال داشته باشند. آقای نیوسام این قانون را «اقدامی برای محافظت از کودکان و افراد زیر سن قانونی در کالیفرنیا» دانست که «مدت‌ها پیش باید انجام می‌شد.» او این قانون را در حضور کورتنی استادن امضا کرد؛ فردی که والدینش در ۱۶ سالگی اجازه دادند با یک بازیگر ۵۰ ساله هالیوود ازدواج کند. کورتنی استادن که برای پایان دادن به ازدواج کودکان فعالیت می‌کند، این تغییر را یک «پیروزی» خواند و گفت هرگز نباید از نجات‌یافتگان ازدواج در کودکی انتظار می‌رفت که «این بار را به دوش بکشند». گاوین نیوسام، فرماندار کالیفرنیا، گفت تصویب این قانون مدت‌ها به تاخیر افتاده بود. خانم استادن گفت «تا زمانی که کودکان در هر ۵۰ ایالت در برابر ازدواج محافظت شوند، به مبارزه ادامه خواهد داد». او در سال ۱۳۹۰ (۲۰۱۱) با داگ هاچیسون، بازیگری که به دلیل نقش‌آفرینی در فیلم‌های «مسیر سبز»، «زمانی برای کشتن» و «من سم هستم» شناخته می‌شود، ازدواج کرد. این ازدواج جنجالی در سراسر جهان خبرساز شد و به حضور آن‌ها در چند برنامه تلویزیونی ریالیتی شو در آمریکا، از جمله مجموعه «زوج‌درمانی» شبکه وی‌اچ‌وان، انجامید. دیگر بازماندگان ازدواج کودکان نیز از قانون جدید استقبال کردند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. بریتنی بی، که در کودکی ازدواج کرده بود، به بی‌بی‌سی گفت: «کالیفرنیا امروز پیام روشنی به"}, {"source": "BBC Persian", "title": "اوپن‌ای‌آی سه پژوهشگرش را به دلیل «مدیریت نادرست اطلاعات حساس» اخراج کرد", "link": "https://www.bbc.com/persian/articles/cm9w4w9vjqgdo?at_medium=RSS&at_campaign=rss", "summary": "شرکت اوپن‌ای‌آی، سازنده چت‌جی‌پی‌تی، سه پژوهشگر خود را به دلیل آنچه «مدیریت نادرست اطلاعات حساس» و نقض مقررات داخلی خوانده، اخراج کرده است.", "date_str": "2026-10-02T09:37:09+00:00", "hash": "1e4d9165766e9996", "title_fa": "اوپن‌ای‌آی سه پژوهشگرش را به دلیل «مدیریت نادرست اطلاعات حساس» اخراج کرد", "summary_fa": "شرکت اوپن‌ای‌آی، سازنده چت‌جی‌پی‌تی، سه پژوهشگر خود را به دلیل آنچه «مدیریت نادرست اطلاعات حساس» و نقض مقررات داخلی خوانده، اخراج کرده است. سخنگوی این شرکت گفت: «تحقیقات ما تأیید کرد که این افراد اطلاعات حساس را خارج از رویه‌های تعیین‌شده شرکت به‌درستی مدیریت نکرده‌اند، سیاست‌های ما را نقض کرده و اعتماد ضروری برای فعالیت‌مان را از بین برده‌اند.» اوپن‌ای‌آی جزئیات اطلاعات مورد نظر یا نحوه استفاده از آنها را اعلام نکرده است. با این حال، گزارش شده است که این سه پژوهشگر متهم شده‌اند اطلاعات محرمانه شرکت را با یک نهاد مستقل فعال در زمینه ایمنی هوش مصنوعی به اشتراک گذاشته‌اند. این سه نفر در حوزه ایمنی و هم‌راستاسازی مدل‌های هوش مصنوعی فعالیت می‌کردند؛ بخشی که پژوهشگران آن به اطلاعات داخلی و حساس درباره عملکرد و مخاطرات مدل‌های شرکت دسترسی دارند. اوپن‌ای‌آی تأکید کرده است که اخراج آنها به دلیل مطرح کردن نگرانی‌های ایمنی نبوده، بلکه به نحوه دسترسی و مدیریت اطلاعات محرمانه مربوط بوده است. این اخراج‌ها در شرایطی انجام شده است که بحث درباره ایمنی مدل‌های پیشرفته هوش مصنوعی و میزان کنترل شرکت‌ها بر رفتار آنها در ماه‌های اخیر شدت گرفته است. اوپن‌ای‌آی در ماه اوت اعلام کرد که در جریان آزمایش‌های امنیت سایبری، برخی مدل‌های تحقیقاتی این شرکت از محدودیت‌هایی که برای جلوگیری از دسترسی آنها به اینترنت تعیین شده بود عبور کردند، از کانال‌های غیرمجاز ارتباط برقرار کردند و به بخش‌هایی از زیرساخت داخلی اوپن‌ای‌آی و سامانه‌های شرکت «هاگینگ فیس»، یکی از بزرگ‌ترین بسترهای اشتراک‌گذاری مدل‌های هوش مصنوعی، دسترسی پیدا کردند. در رویدادی جداگانه، یکی از عامل‌های هوش مصنوعی اوپن‌ای‌آی در ماه ژوئن بدون مجوز به یک سامانه دولتی استرالیا مربوط به آمار مدیکر دسترسی یافت. دولت استرالیا گفته است این عامل به فایل‌های عمومی و غیرعمومی دسترسی پیدا کرده، هرچند تاکنون شواهدی از دسترسی به اطلاعات شخصی بیماران به دست نیامده است."}, {"source": "BBC Persian", "title": "پشت جبهه جنگ ایران؛ آمریکا از کدام پایگاه‌های اروپا استفاده کرد؟", "link": "https://www.bbc.com/persian/articles/cmd7912g4xeno?at_medium=RSS&at_campaign=rss", "summary": "آمریکا در جنگ ایران از تعدادی از پایگاه‌های اروپا برای حمله، انتقال نیرو، سوخت‌رسانی و پشتیبانی استفاده کرد. برخی دولت‌ها نیز استفاده از پایگاه‌های خود را محدود کردند که در مواردی باعث بروز تنش با واشنگتن شد", "date_str": "2026-10-02T05:35:02+00:00", "hash": "b55fa13d16c76d93", "title_fa": "پشت جبهه جنگ ایران؛ آمریکا از کدام پایگاه‌های اروپا استفاده کرد؟", "summary_fa": "آمریکا در جنگ ایران از تعدادی از پایگاه‌های اروپا برای حمله، انتقال نیرو، سوخت‌رسانی و پشتیبانی استفاده کرد. برخی دولت‌ها نیز استفاده از پایگاه‌های خود را محدود کردند که در مواردی باعث بروز تنش با واشنگتن شد حادثه امنیتی اخیر در اطراف پایگاه فرفورد بریتانیا، که در جریان جنگ اخیر میزبان بمب‌افکن‌های آمریکایی برای حمله به ایران بود، بار دیگر توجه‌ها را به نقش پایگاه‌های هوایی اروپا در این جنگ جلب کرده است. پلیس ضدتروریسم بریتانیا می‌گوید یک مرد دوتابعیتی ایرانی-بریتانیایی را در ارتباط با این حادثه بازداشت کرده است. پیش تر اندی برنام، نخست‌وزیر بریتانیا، گفته بود «نشانه‌های قوی» وجود دارد که ایران در این حادثه نقش داشته است. ایران هرگونه دخالت در این ماجرا را رد کرده است. پنج مرد بریتانیایی ۲۳ تا ۲۵ ساله بامداد ۲۷ سپتامبر، پس از گزارش حضور سه خودروی مشکوک در نزدیکی پایگاه فرفورد، به ظن جرایم مرتبط با مواد منفجره و «تدارک اقدام تروریستی» بازداشت شدند. همه آنها یک روز بعد به وثیقه آزاد شدند. پلیس می‌گوید در خودروها مقداری بنزین پیدا شده، اما وسیله انفجاری کشف نشده است. همچنین مشخص شده است که یکی از این افراد پیش از بازداشت با شماره اضطراری پلیس تماس گرفته بود. اهمیت پایگاه فرفورد در این است که از ابتدای جنگ اخیر، به پایگاهی تبدیل شد که در عملیات مستقیم آمریکا به خاک ایران مورد استفاده قرار گرفت. سپاه پاسداران نیز در ماه ژوئیه به طور مشخص از فرفورد نام برد و هشدار داد پایگاه‌هایی که برای بمباران ایران استفاده شوند «هدف مشروع» خواهند بود. بر اساس برآورد «مرکز مطالعات شرقی» در لهستان، دارایی‌هایی که از اروپا به خاورمیانه منتقل شدند حدود یک‌پنجم کل نیروهای آمریکا در منطقه را تشکیل می‌دادند، هرچند بخش عمده نیروها مستقیما از خود آمریکا اعزام شد. اروپا همچنین در جریان جنگ به یکی از مراکز اصلی پشتیبانی و سوخت‌رسانی هوایی"}, {"source": "BBC Persian", "title": "معمای «تیم شش‌نفره» در حکومت ایران", "link": "https://www.bbc.com/persian/articles/cr9dw7dvjxj1o?at_medium=RSS&at_campaign=rss", "summary": "با توجه به جایگاه حقوقی شورای عالی امنیت ملی، حیطه مسئولیت‌ها و ترکیب اعضای آن و میزان کنترل مقام اول حکومت بر تصمیماتش، نمی‌توان فرض کرد که جمع کردن حدود نیمی از اعضای همین شورا در تیمی شش‌نفره، تفاوت معناداری در «هماهنگی» تصمیم‌های راهبردی ایجاد کند.", "date_str": "2026-10-02T04:15:01+00:00", "hash": "a6f8a0df9105aa61", "title_fa": "معمای «تیم شش‌نفره» در حکومت ایران", "summary_fa": "با توجه به جایگاه حقوقی شورای عالی امنیت ملی، حیطه مسئولیت‌ها و ترکیب اعضای آن و میزان کنترل مقام اول حکومت بر تصمیماتش، نمی‌توان فرض کرد که جمع کردن حدود نیمی از اعضای همین شورا در تیمی شش‌نفره، تفاوت معناداری در «هماهنگی» تصمیم‌های راهبردی ایجاد کند. مسعود پزشکیان اخیرا به «تیمی شش‌نفره» در حکومت ایران اشاره کرد که در مورد بحران جاری با آمریکا «اختیار دارند تصمیم بگیرند و تصمیمات با هماهنگی آنها اجرا می‌شود». به دنبال انتشار این اظهارات در مصاحبه با سی‌بی‌اس، رسانه‌های رسمی ایران روایت‌هایی را از ترکیب تیم شش‌نفره منتشر کرده‌اند که عمدتا در مورد پنج نفر مشابه و در مورد نفر ششم متفاوت بوده‌اند. بخش ثابت روایت‌ها اغلب بر رئیس‌جمهور، رئیس مجلس، دبیر شورای عالی امنیت ملی، رئیس ستاد کل نیروهای مسلح و فرمانده کل سپاه تمرکز داشته، هرچند نفر ششم را برخی رئیس قوه قضاییه و برخی وزیر خارجه دانسته‌اند. اشاره مسعود پزشکیان به وجود این تیم، البته اهمیت داشت، ولی این اشاره نه اولین بار بود که صورت می‌گرفت و نه نشانه تحولی کلیدی در ساختار تصمیم‌گیری کلان، یا مثلا ایجاد نهادی با اهمیتی مشابه شورای عالی امنیت ملی بود. در تیرماه گذشته، عباس عراقچی در مصاحبه‌ای با برنامه یوتیوبی «ماجرای جنگ» گفته بود چارچوب مذاکرات با آمریکا در شورایی تعیین می‌شود که به «کمیته شش‌نفره» معروف است. توضیحات او اما نشان می‌داد که جایگاه این کمیته پایین‌تر از شعام ـ شورای عالی امنیت ملی ـ و در حد یکی از کارگروه‌های داخلی آن است. عباس عراقچی در گفتگوی خود، مشخصا از کمیته‌ای «در داخل دبیرخانه» شعام سخن گفت که ابتدا «کمیته هسته‌ای» و سپس «کمیته مذاکره» نام گرفته و در نهایت به «کمیته شش‌نفره» معروف شده است. مطابق اظهارات او، این کمیته از مدت‌ها قبل از جنگ چهل‌روزه فعال بوده و در زمان‌های دبیری علی شمخانی و سپس علی لاریجانی در شعام،"}, {"source": "BBC Persian", "title": "ربات‌هایی که آینده چین را می‌سازند", "link": "https://www.bbc.com/persian/articles/cx2znzyvnplo?at_medium=RSS&at_campaign=rss", "summary": "چین با سرمایه‌گذاری گسترده در رباتیک، هوش مصنوعی و آموزش نیروی کار، در حال پیشبرد انقلابی صنعتی است که فراتر از نمایش ربات‌های انسان‌نما جریان دارد. بی‌بی‌سی با سفر به کارخانه‌ها و مراکز آموزشی این کشور، از نزدیک روندی را مشاهده کرده که هدف آن تبدیل چین به یکی از قدرت‌های اصلی آینده فناوری و تولید در جهان است.", "date_str": "2026-10-02T00:36:01+00:00", "hash": "9a5bd561727dd73f", "title_fa": "ربات‌هایی که آینده چین را می‌سازند", "summary_fa": "چین با سرمایه‌گذاری گسترده در رباتیک، هوش مصنوعی و آموزش نیروی کار، در حال پیشبرد انقلابی صنعتی است که فراتر از نمایش ربات‌های انسان‌نما جریان دارد. بی‌بی‌سی با سفر به کارخانه‌ها و مراکز آموزشی این کشور، از نزدیک روندی را مشاهده کرده که هدف آن تبدیل چین به یکی از قدرت‌های اصلی آینده فناوری و تولید در جهان است. چن تیانیو می‌گوید: «تا یک چرت بزنم، دنیا تغییر می‌کند.» دنیای او قطعا تغییر می‌کند. این مرد ۲۸ ساله با گذراندن اوقات فراغت خود در کارخانه‌هایی که به سمت خودکارسازی می‌روند، از آخرین فناوری‌ها مطلع می‌شود. به این ترتیب می‌داند که هنگام تدریس هوش مصنوعی و رباتیک در کلاس، چه چیزهایی را در اولویت قرار دهد. در برابر او، حدود ۳۰ دانشجو مشغول یادگیری کدنویسی هستند. یکی از آن‌ها همان‌طور که چشمانش میان صفحه نمایش و ربات می‌چرخد، با سرعت تایپ می‌کند: «ایده این است که آن قطعه استوانه‌ای را بگیرد و به آنجا منتقل کند.» صفی از ربات‌های صنعتی منتظر برنامه‌ریزی هستند و در بخش دیگری از کلاس، دانشجویان برای توسعه ابزارهای رباتیک پزشکی تلاش می‌کنند. چن در حال راهنمایی آن‌ها، می‌گوید: «اگر دنیای هوش مصنوعی و رباتیک به شما نیاز نداشته باشد، بی‌تردید از رقابت جا خواهید ماند.» برای افراد حاضر در این اتاق، این گامی -یا بهتر بگوییم جهشی- به سوی آینده‌ای است که چین با دقت در حال ساختن آن است: طرح ۲۰ میلیارد دلاری شی جین‌پینگ برای قرار دادن کشورش در پیشانی نوآوری و رقابت مستقیم با آمریکا. شواهد آشکارست. آن‌ها در موسسه فنی هانگژو هستند، یکی از چندین مدرسه حرفه‌ای بزرگ و هدفمند که می‌خواهند نسل بعدی مهندسانی آشنا با فناوری‌های نوین را تربیت کنند. این دانشکده در حومه هانگژو قرار دارد؛ پایتخت امپراتوری سابق که افق مدرن و آینده‌نگرانه‌اش، تنها نخستین نشانه از نقش آن به عنوان یک مرکز جهانی فناوری است."}, {"source": "BBC Persian", "title": "ترامپ: جنگ ایران طولانی شد چون خودم خواستم ادامه پیدا کند", "link": "https://www.bbc.com/persian/articles/c90klkpp6x61o?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ، رئیس‌جمهور آمریکا، در گفت‌وگو با مجله تایم گفت که طولانی شدن جنگ با ایران نتیجه تصمیم خود او برای ادامه عملیات بوده است. او گفت که پس از حمله آمریکا به تأسیسات هسته‌ای ایران می‌توانست جنگ را متوقف کند، اما تصمیم گرفت «جلوتر برود».", "date_str": "2026-10-01T14:37:46+00:00", "hash": "6c6170acd5d5ef92", "title_fa": "ترامپ: جنگ ایران طولانی شد چون خودم خواستم ادامه پیدا کند", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا، در گفت‌وگو با مجله تایم گفت که طولانی شدن جنگ با ایران نتیجه تصمیم خود او برای ادامه عملیات بوده است. او گفت که پس از حمله آمریکا به تأسیسات هسته‌ای ایران می‌توانست جنگ را متوقف کند، اما تصمیم گرفت «جلوتر برود». آقای ترامپ در پاسخ به این پرسش که چرا جنگی که ابتدا گفته بود شش تا هشت هفته طول خواهد کشید، اکنون وارد ماه هفتم شده است، گفت: «فقط به این دلیل که می‌خواستم جلوتر بروم.» او گفت که پس از حمله بمب‌افکن‌های بی‌۲ آمریکا به تأسیسات هسته‌ای ایران می‌توانست عملیات را متوقف کند، اما به گفته او، مقام‌های ایرانی «بی‌تاب بودند» که فعالیت‌های خود را، اگر نه در همان محل، در جای دیگری از سر بگیرند. رئیس‌جمهور آمریکا گفت: «می‌توانستم همان‌جا متوقف شوم، اما احساس کردم این کار درست نیست» و افزود که نمی‌خواست ایران «به شکلی دیگر دوباره برگردد.» مجله تایم سپس از آقای ترامپ درباره تهدید قبلی او به «نابودی ایران» پرسید. رئیس‌جمهور آمریکا در پاسخ گفت: «بله، ممکن است این کار را بکنم.» وقتی خبرنگار از او پرسید چگونه کسی که خود را «رئیس‌جمهور صلح» می‌نامد از «نابودی یک ملت» سخن می‌گوید، آقای ترامپ پاسخ داد: «با نابود کردن ایران، صلح را در جهان برقرار کرده‌ایم. فکر نمی‌کنم با ایران هیچ‌وقت بتوان به صلح رسید.» خبرنگار سپس از او پرسید که آیا منظورش به‌طور مشخص حکومت جمهوری اسلامی است و تکلیف مردم بی‌گناه چه می‌شود. آقای ترامپ به این پرسش پاسخ مستقیمی نداد و دv عوض مدعی شد که حکومت ایران در ماه‌های اخیر بین « ۷۲ تا ۷۵ هزار نفر» از معترضان و دیگر افراد را کشته است. او همچنین به گفت‌وگوی اخیر مسعود پزشکیان با برت بایر در فاکس‌نیوز اشاره کرد و گفت که آقای پزشکیان درباره شمار کشته‌شدگان «دروغ گفته» و رقم حدود سه هزار نفر را"}, {"source": "BBC Persian", "title": "چرا جنجال بر سر شمایل مریم مقدس می‌تواند بر انتخابات برزیل تاثیر بگذارد؟", "link": "https://www.bbc.com/persian/articles/c6vgygdedqeno?at_medium=RSS&at_campaign=rss", "summary": "شمایل «بانوی ما آپارسیدا»، قدیس حامی برزیل، به یکی از جنجالی‌ترین موضوعات کارزار انتخابات ریاست‌جمهوری این کشور تبدیل شده است. در حالی که رقابت میان لولا دا سیلوا و فلاویو بولسونارو به روزهای حساس خود نزدیک می‌شود، بحث بر سر جایگاه این نماد مذهبی، شکاف‌های عمیق مذهبی و سیاسی در بزرگ‌ترین کشور آمریکای لاتین را بار دیگر آشکار کرده است.", "date_str": "2026-10-01T20:44:32+00:00", "hash": "90f951816520f0be", "title_fa": "چرا جنجال بر سر شمایل مریم مقدس می‌تواند بر انتخابات برزیل تاثیر بگذارد؟", "summary_fa": "شمایل «بانوی ما آپارسیدا»، قدیس حامی برزیل، به یکی از جنجالی‌ترین موضوعات کارزار انتخابات ریاست‌جمهوری این کشور تبدیل شده است. در حالی که رقابت میان لولا دا سیلوا و فلاویو بولسونارو به روزهای حساس خود نزدیک می‌شود، بحث بر سر جایگاه این نماد مذهبی، شکاف‌های عمیق مذهبی و سیاسی در بزرگ‌ترین کشور آمریکای لاتین را بار دیگر آشکار کرده است. مریم، مادر عیسی، در جریان کارزار انتخابات سراسری برزیل به موضوعی داغ تبدیل شده است. کشمکش میان دو نامزد پیشتاز ریاست‌جمهوری همچنین شکاف‌های عمیق سیاسی و مذهبی را در بزرگ‌ترین اقتصاد و پرجمعیت‌ترین کشور آمریکای لاتین برجسته کرده است. نظرسنجی‌ها نشان می‌دهند احتمالا در رای‌گیری ۴ اکتبر ۲۰۲۶ میان لوئیس ایناسیو لولا دا سیلوا، رئیس‌جمهور چپ‌گرای کنونی، و فلاویو بولسونارو، رقیب راست‌گرا که سناتور و پسر ژائیر بولسونارو، رئیس‌جمهور پیشین، است، هیچ‌ کس در دور نخست پیروز نخواهد شد. ژائیر بولسونارو در حال حاضر به دلیل تلاش برای کودتای حکومتی پس از شکست از لولا در انتخابات سال ۲۰۲۲ در حبس خانگی است. اگر هیچ نامزدی بیش از ۵۰ درصد آرا را به دست نیاورد، دو نامزد پیشتاز در ۳ آبان ۱۴۰۵ (۲۵ اکتبر ۲۰۲۶) در دور دوم با یکدیگر رقابت خواهند کرد. کارزار انتخاباتی این دو که از پیش نیز پرتنش بود، ۲۴ سپتامبر ۲۰۲۶ حتی داغ‌تر شد. ماریا کریستینا فرناندس، روزنامه‌نگار و مفسر سیاسی، در برنامه‌ای تلویزیونی از شبکه گلوبونیوز، بدون ارائه مدرکی ادعا کرد بخش‌هایی از کلیسای کاتولیک در برزیل نگران تلاش‌های ادعایی جامعه پروتستان برای کنار گذاشتن «بانوی ما آپارسیدا» از جایگاه قدیس حامی برزیل هستند. بانوی ما آپارسیدا، عنوانی مورد احترام برای حضرت مریم است. از میان ۲۱۵ میلیون شهروند برزیل، کاتولیک‌ها اکثریت را تشکیل می‌دهند و واکنش‌ها به سخنان فرناندس، همان‌طور که انتظار می‌رفت، به‌سرعت در شبکه‌های اجتماعی گسترش یافت."}, {"source": "Radio Farda", "title": "۴۶ کشور در بیانیه‌ای مشترک، ادامۀ اعدام‌ مخالفان و معترضان در ایران را محکوم کردند", "link": "https://www.radiofarda.com/a/states-condemn-iran-s-escalating-use-of-the-death-penalty-at-un-human-rights-council/33869190.html", "summary": "۴۶ کشور اروپایی و غیر اروپایی با صدور بیانیه‌ای مشترک در شورای حقوق بشر سازمان ملل متحد، ادامۀ اعدام معترضان در ایران را محکوم کرده و خواستار توقف فوری این روند شدند.", "date_str": "2026-10-02T13:36:38+00:00", "hash": "b0fce48f4fcafc32", "title_fa": "۴۶ کشور در بیانیه‌ای مشترک، ادامۀ اعدام‌ مخالفان و معترضان در ایران را محکوم کردند", "summary_fa": "۴۶ کشور اروپایی و غیر اروپایی با صدور بیانیه‌ای مشترک در شورای حقوق بشر سازمان ملل متحد، ادامۀ اعدام معترضان در ایران را محکوم کرده و خواستار توقف فوری این روند شدند. چهل و شش کشور جهان با ارائۀ بیانیه‌ای مشترک به شورای حقوق بشر سازمان ملل متحد، ادامه اعدام‌ها و افزایش موارد صدور و اجرای این مجازات در ایران را محکوم کردند. امضا کنندگان به‌خصوص از روند اعدام بازداشت‌شدگان اعتراضات دی‌ماه گذشته ابراز نگرانی عمیق کردند. این بیانیه به امضای همۀ اعضای اتحادیۀ اروپا به جز لهستان، به همراه ۲۰ کشور دیگر از جمله بریتانیا، کانادا، اوکراین و سوئیس رسیده، روز چهارشنبه هشتم مهرماه توسط دانیل باتلینِر، نمایندۀ لیختن‌اشتاین قرائت شد. در این بیانیه تأکید شده که «هیچ‌کس نباید به‌دلیل استفاده از حقوق بنیادینی همچون آزادی بیان و یا درخواست برای شنیده‌شدن صدایش، در معرض اعدام قرار بگیرد». امضاکنندگان بیانیه با اشاره به یافته‌ها و گزارش‌های کارشناسان سازمان ملل متحد، از جمله گزارشگر ویژۀ این سازمان در امور حقوق بشر ایران، تأکید کرده‌اند که توسل جمهوری اسلامی به اعدام معترضان، با هدف «گسترش ترس و ارعاب در جامعه، سرکوب و ساکت‌کردن مخالفان، و جلوگیری از تجمعات مسالمت‌آمیز و آزادی بیان انجام می‌شود.» نویسندگان همچنین از فقدان محاکمۀ عادلانه مطابق با موازین بین‌المللی، توسل به شکنجه برای اخذ اعترافات اجباری، و ناپدیدسازی قهری مخالفان به شدت ابراز نگرانی کرده و از ایران خواسته‌اند که بدون تأخیر همۀ این اقدامات و بخصوص اعدام معترضان را متوقف کند. این بیانیۀ مشترک، همزمان با افزایش نگرانی‌های بین‌المللی از اعدام روزافزون بازداشتی‌های اعتراضات دی‌ماه ۱۴۰۴ تدوین و ارائه شد. جمهوری اسلامی، رسماً از اعدام بیش از ۳۰ تن از این بازداشتی‌ها خبر داده است. این در حالی‌است که به‌گفتۀ وکلا و فعالان حقوق بشر، ده‌ها تن دیگر هم در خطر صدور یا اجرای حکم اعدام قرار دارند."}, {"source": "Radio Farda", "title": "آغاز صادرات نفت ایران به تاجیکستان؛ آمریکا درباره امکان تحریم‌های ثانویه هشدار داد", "link": "https://www.radiofarda.com/a/iran-oil-tajikistan-us-sanctions/33869084.html", "summary": "وزارت انرژی و منابع آب تاجیکستان به خبرگزاری آسیا پلاس گفته است ارسال محموله‌ها از اواخر ماه اوت و پس از مذاکرات دو کشور برای گسترش همکاری‌ها در بخش نفت و گاز آغاز شد.", "date_str": "2026-10-02T11:02:42+00:00", "hash": "29935f72d160104b", "title_fa": "آغاز صادرات نفت ایران به تاجیکستان؛ آمریکا درباره امکان تحریم‌های ثانویه هشدار داد", "summary_fa": "وزارت انرژی و منابع آب تاجیکستان به خبرگزاری آسیا پلاس گفته است ارسال محموله‌ها از اواخر ماه اوت و پس از مذاکرات دو کشور برای گسترش همکاری‌ها در بخش نفت و گاز آغاز شد. تاجیکستان اعلام کرده که دریافت نفت و فرآورده‌های نفتی از ایران را آغاز کرده است؛ اقدامی که می‌تواند منبع تازه‌ای برای تأمین انرژی این کشور باشد که از دیرباز بخش عمدهٔ سوخت مورد نیاز خود را از روسیه تأمین می‌کند. این وزارتخانه حجم محموله‌ها، شرایط تجاری این مبادلات یا نحوهٔ انتقال نفت و فرآورده‌های نفتی ایران به تاجیکستان را اعلام نکرده است. این اقدام در عین حال این پرسش را مطرح کرده که آیا تجارت با ایران می‌تواند تاجیکستان را در معرض تحریم‌های ثانویه آمریکا قرار دهد؛ به‌ویژه در شرایطی که واشینگتن فشار بر درآمدهای نفتی جمهوری اسلامی را افزایش داده است. جیجی اوکانل، سخنگوی وزارت خزانه‌داری آمریکا، گفت این وزارتخانه دربارهٔ موارد مشخص ادعای نقض تحریم‌ها اظهارنظر نمی‌کند، اما هشدار داد که فعالیت در بخش‌های نفت و پتروشیمی ایران با خطر فزایندهٔ تحریم روبه‌رو است. او در پاسخ ایمیلی به رادیو اروپای آزاد/رادیو آزادی گفت: «هر کس تصمیم بگیرد به فعالیت در این بخش ادامه دهد، مسئولیت این خطر را نیز خود می‌پذیرد.» تاجیکستان از ایران خواسته است سالانه تا دو میلیون و ۵۵۰ هزار تن نفت خام و فرآورده‌های نفتی، از جمله بنزین، گازوئیل و سوخت هواپیما، برای این کشور تأمین کند. با این حال، این رقم سقف درخواستی تاجیکستان است و به معنای واردات این میزان نفت و فرآورده‌های نفتی از ایران نیست. روی آوردن به منابع ایران می‌تواند راه دیگری برای تأمین نیازهای تاجیکستان باشد، هرچند صرفه اقتصادی و مسائل لجستیکی انتقال حجم زیادی از نفت ایران به تاجیکستان، کشوری محصور در خشکی، همچنان روشن نیست. این توافق در حالی صورت گرفته که تأمین سوخت تاجیکستان از روسیه همچنان با ابهام روبه‌رو"}, {"source": "Radio Farda", "title": "ادامه درگیری‌های مسلحانه در سیستان و بلوچستان؛ «شش ساعت تیراندازی در راسک»", "link": "https://www.radiofarda.com/a/iran-sistan-baluchistan-armed-clashes-fatemiyoun/33868959.html", "summary": "خبرگزاری تسنیم، نزدیک به سپاه پاسداران، وقوع درگیری مسلحانه در یکی از روستاهای راسک را تأیید کرده و افراد طرف درگیری با نیروهای سپاه را اعضای یک «گروه تروریستی» خوانده است.", "date_str": "2026-10-02T09:51:46+00:00", "hash": "ee5764f18f82e07e", "title_fa": "ادامه درگیری‌های مسلحانه در سیستان و بلوچستان؛ «شش ساعت تیراندازی در راسک»", "summary_fa": "خبرگزاری تسنیم، نزدیک به سپاه پاسداران، وقوع درگیری مسلحانه در یکی از روستاهای راسک را تأیید کرده و افراد طرف درگیری با نیروهای سپاه را اعضای یک «گروه تروریستی» خوانده است. گزارش‌ها حاکی از درگیری چندساعته‌ٔ نیروهای حکومتی با افراد مسلح در شهرستان راسک و اعزام نیرو و تجهیزات نظامی به این منطقه در روز جمعه ۱۰ مهر است. خبرگزاری تسنیم، نزدیک به سپاه پاسداران، وقوع درگیری مسلحانه در یکی از روستاهای راسک را تأیید کرده و افراد طرف درگیری با نیروهای سپاه را اعضای یک «گروه تروریستی» خوانده است. این خبرگزاری جزئیاتی درباره هویت، تعداد یا تلفات احتمالی افراد درگیر ارائه نکرده و نوشته است نیروهای حکومتی در حال «پاکسازی منطقه و بررسی وضعیت» هستند. تحولات روز جمعه تازه‌ترین موارد از رشته‌ای از حملات و درگیری‌های مسلحانه در سیستان و بلوچستان طی کمتر از دو هفتهٔ گذشته است. پایگاه خبری حال‌وش، که اخبار مربوط به بلوچ‌ها در ایران را پوشش می‌دهد، گزارش داده است که درگیری روز جمعه از حدود ساعت پنج‌ونیم صبح در حوالی روستاهای بیدلَد و شوشگیم آغاز شده و دست‌کم شش ساعت ادامه داشته است. به‌گفتهٔ این رسانه، «نیروها و تجهیزات بیشتری، از جمله خودروهای زرهی و یک خودروی مجهز به سلاح سنگین، به منطقه اعزام شده‌اند و در جریان عملیات از پهپادهای شناسایی و انتحاری نیز استفاده شده است». حال‌وش همچنین از شنیده‌شدن صدای تیراندازی و انفجار در منطقه خبر داده است. رادیوفردا مستقلاً قادر به تأیید این جزئیات نیست. همزمان، حال‌وش در گزارشی جداگانه مدعی شد دست‌کم پنج عضو لشکر فاطمیون صبح جمعه در منطقه رودماهی شهرستان زاهدان در حمله افراد مسلح کشته شده‌اند. بر اساس این گزارش، یک خودرو لندکروز حامل این افراد ابتدا با انفجار یک تله انفجاری هدف قرار گرفته و سپس افراد مسلح به سوی آن تیراندازی کرده‌اند. رسانه‌های ایران روز جمعه بیانیه قرارگاه قدس نیروی زمینی سپاه پاسداران را"}, {"source": "Radio Farda", "title": "عربستان حوثی‌ها را به حمله به ایستگاه توزیع برق «مسجد‌النبی» در مدینه متهم کرد", "link": "https://www.radiofarda.com/a/saudi-houthis-attack-power-station-medina/33868828.html", "summary": "ائتلاف اعلام کرد این حمله روز سه‌شنبه، ۷ مهر، با پهپاد انجام شد و یک ترانسفورماتور را از کار انداخت، اما تأثیری بر شبکه برق نگذاشت.", "date_str": "2026-10-02T06:05:02+00:00", "hash": "ad279b2e451fd5c1", "title_fa": "عربستان حوثی‌ها را به حمله به ایستگاه توزیع برق «مسجد‌النبی» در مدینه متهم کرد", "summary_fa": "ائتلاف اعلام کرد این حمله روز سه‌شنبه، ۷ مهر، با پهپاد انجام شد و یک ترانسفورماتور را از کار انداخت، اما تأثیری بر شبکه برق نگذاشت. ائتلاف به رهبری عربستان سعودی روز پنج‌شنبه، ۹ مهر، حوثی‌های یمن را متهم کرد که به ایستگاه توزیع برق «مسجدالنبی» در شهر مدینه حمله کرده‌اند. مسجدالنبی از اماکن مقدس مسلمانان است. ترکی مالکی، سخنگوی ائتلاف به رهبری عربستان، این حمله را «تروریستی» توصیف کرد و آن را اقدامی دیگر از سوی حوثی‌های تحت حمایت ایران برای هدف قرار دادن «حرمین شریفین» و تحریک مسلمانان سراسر جهان دانست. یک منبع نظامی حوثی‌ها در گفت‌وگو با خبرگزاری سبأ، وابسته به این گروه، گزارش ائتلاف دربارهٔ حمله به ایستگاه برق مسجدالنبی را رد کرد. در واکنش، کشورهای مختلف، از جمله ترکیه، پاکستان و قطر، و همچنین اتحادیه عرب حمله به ایستگاه برق مسجدالنبی را محکوم کردند. عربستان پیشتر نیز حوثی‌ها را به حمله پهپادی به شهر مکه متهم کرده بود. حوثی‌ها انجام آن حمله را نیز تکذیب کرده‌اند. در همین حال، سخنگوی نیروهای مسلح دولت یمن، مورد تأیید سازمان ملل، اعلام کرد نیروهای ائتلاف به آنچه «اهداف باارزش» در صنعا توصیف کرد، حمله کرده‌اند. جزئیات بیشتری درباره این حمله اعلام نشده است. حوثی‌ها پیشتر از حملات هوایی عربستان به صنعا و چند شهر دیگر تحت کنترل خود خبر داده بودند. از سوی دیگر، مقام‌های محلی بامداد جمعه، ۱۰ مهر، اعلام کردند حوثی‌ها مقر فرماندهی نیروهای ائتلاف به رهبری عربستان در شهر عدن را با چندین موشک بالستیک و پهپاد هدف قرار داده‌اند. ائتلاف به رهبری عربستان نیز صبح جمعه اعلام کرد یک موشک بالستیک شلیک‌شده از سوی حوثی‌های یمن به سمت شهر خمیس مشیط در جنوب عربستان را رهگیری و منهدم کرده است. همزمان با ادامه پیشروی حوثی‌ها در مناطق غربی یمن، گزارش‌ها از درگیری‌های شدید در اطراف شهر راهبردی تعز حکایت دارد. در همین زمینه، سخنگوی"}, {"source": "Radio Farda", "title": "ترامپ می‌گوید اگر ثابت شود ایران در حادثه فلای‌دبی دست داشته، به‌شدت هدف قرار می‌گیرد", "link": "https://www.radiofarda.com/a/trump-iran-flydubai-threat-surrender/33868842.html", "summary": "این اظهارات همزمان با ادامهٔ تحقیقات امارات متحده عربی دربارهٔ احتمال تروریستی بودن حادثهٔ پرواز فلای‌دبی و گزارش‌ها دربارهٔ تقویت حضور نظامی آمریکا در منطقه مطرح شده است.", "date_str": "2026-10-02T05:49:46+00:00", "hash": "b698c2f9fe2de42e", "title_fa": "ترامپ می‌گوید اگر ثابت شود ایران در حادثه فلای‌دبی دست داشته، به‌شدت هدف قرار می‌گیرد", "summary_fa": "این اظهارات همزمان با ادامهٔ تحقیقات امارات متحده عربی دربارهٔ احتمال تروریستی بودن حادثهٔ پرواز فلای‌دبی و گزارش‌ها دربارهٔ تقویت حضور نظامی آمریکا در منطقه مطرح شده است. دونالد ترامپ در دو اظهارنظر تازه دربارهٔ ایران هشدار داد اگر مشخص شود تهران در حادثهٔ پرواز فلای‌دبی به مقصد اسرائیل دست داشته، «به‌شدت هدف قرار خواهد گرفت» و ساعاتی بعد بار دیگر گفت به اعتقاد او ایران «در آستانهٔ تسلیم‌شدن» است. رئیس‌جمهور آمریکا شامگاه پنج‌شنبه، نهم مهر، به وقت ایران، در پاسخ به پرسش خبرنگاران در کاخ سفید دربارهٔ احتمال ارتباط ایران با کمک‌خلبانی که به خلبان پرواز دبی به تل‌آویو حمله کرد، گفت: «بر اساس آن‌چه می‌شنوم، می‌گویم پاسخ مثبت است، اما همین حالا در حال بررسی آن هستیم.» او توضیحی دربارهٔ اطلاعاتی که بر اساس آن چنین احتمالی را مطرح کرده ارائه نکرد. مقام‌های امارات پیشتر از رسانه‌ها و افکار عمومی خواسته‌اند تا پیش از اعلام نتایج تحقیقات از گمانه‌زنی دربارهٔ علت حادثه خودداری کنند. رئیس‌جمهور آمریکا در پاسخ به این پرسش که آیا در صورت اثبات دست داشتن ایران، واشینگتن تلافی خواهد کرد، گفت: «آن‌ها به‌شدت هدف قرار خواهند گرفت، نگران نباشید.» تاکنون هیچ مدرک علنی دربارهٔ ارتباط ایران با این حادثه منتشر نشده و تحقیقات دربارهٔ انگیزهٔ کمک‌خلبان ادامه دارد. تا زمان انتشار این گزارش نیز مقام‌های جمهوری اسلامی به اظهارات آقای ترامپ دربارهٔ احتمال ارتباط ایران با حادثهٔ فلای‌دبی واکنش علنی نشان نداده‌اند. دو مقام امنیتی اسرائیلی نیز به رویترز گفته‌اند ارزیابی اولیهٔ اسرائیل این است که کمک‌خلبان احتمالاً به‌تنهایی عمل کرده است. بنیامین نتانیاهو، نخست‌وزیر اسرائیل، روز پنج‌شنبه گفت هنوز برای نتیجه‌گیری دربارهٔ ارتباط احتمالی این فرد با ایران زود است. با این حال، او در گفت‌وگو با شبکهٔ فاکس‌نیوز مدعی شد اطلاعات به‌دست‌آمده دربارهٔ کمک‌خلبان نشان می‌دهد که او تحت «تلقینات افراط‌گرایانه اسلام‌گرایانه» قرار گرفته بود."}, {"source": "Radio Farda", "title": "تحریم سایپا و ایران‌خودرو؛ ترامپ می‌گوید دلیل ادامۀ جنگ، رسیدن به دستاوردهای تازه بود", "link": "https://www.radiofarda.com/a/us-sanctions-iran-s-largest-automakers-major-rail-companies/33868574.html", "summary": "همزمان با اعلام تحریم‌های تازه علیه صنایع خودرو و ریلی ایران، دونالد ترامپ می‌گوید دلیل طولانی‌شدن جنگ ایران، تصمیم او برای رسیدن به دستاوردهای بیشتر بوده است.", "date_str": "2026-10-01T18:08:17+00:00", "hash": "0467bb2ddbd5b2e6", "title_fa": "تحریم سایپا و ایران‌خودرو؛ ترامپ می‌گوید دلیل ادامۀ جنگ، رسیدن به دستاوردهای تازه بود", "summary_fa": "همزمان با اعلام تحریم‌های تازه علیه صنایع خودرو و ریلی ایران، دونالد ترامپ می‌گوید دلیل طولانی‌شدن جنگ ایران، تصمیم او برای رسیدن به دستاوردهای بیشتر بوده است. رئیس‌جمهور ایالات متحده در گفت‌وگویی که روز پنج‌شنبه، ۹ مهرماه، در مجلۀ «تایم» منتشر شد تلاش برای رسیدن به «دستاوردهای بیشتر» را تنها دلیل طولانی‌ شدن جنگ با ایران خواند. دونالد ترامپ در پاسخ به پرسشی حاکی از این‌که چرا جنگی که به گفته خودش قرار بود ۶ تا ۸ هفته طول بکشد، به هفتمین ماه خود رسیده، گفت: «چون تصمیم گرفتم دستاوردهای بیشتری داشته باشم. [در همان مقطع] کارشان را تمام کردم. می‌توانستم همان‌موقع جنگ را متوقف کنم. اما خواستم که پیشتر بروم». آقای ترامپ با اشارۀ مجدد به حمله به سایت‌های هسته‌ای ایران در نظنز و فردو گفت: «اگر به دستاورد ما، زمانی که با بی-۲ سایت‌های هسته‌ای‌شان را بمباران کردیم، توجه کنید، می‌بینید که در همان مقطع زمانی به اهدافمان رسیدیم. اورانیوم غنی‌شده‌شان، که من به آن غبار هسته‌ای می‌گویم، زیر هزاران تن سنگ و کلوخ مدفون شد. می‌توانستم همان موقع جنگ را متوقف کنم؛ اما فکر کردم کار درستی نیست، چون در آن‌صورت کارشان را دوباره از سر می‌گرفتند. شاید مثلاً در جایی دیگر. به همین دلیل ادامه دادم. و حالا اوضاعشان حسابی خراب است.» رئیس‌جمهور آمریکا بار دیگر تأکید کرد: «اقتصادشان از بین رفته. تورمشان به ۳۰۰ درصد یا چیزی در این حدود رسیده است. نیروی دریایی و نیروی هوایی‌شان از بین رفته. همه‌چیز را از دست داده‌اند و به شدت به‌دنبال توافق هستند. اما من یک توافق «واقعی» می‌خواهم». دونالد ترامپ ادامه داد: «وقتی گفتم مدت کوتاهی درگیر جنگ خواهیم بود، سر حرفم بودم. اما بعد تصمیم گرفتم که گام‌های بیشتری بردارم؛ چون نمی‌خواستم مدتی بعد، به شکلی دیگر دوباره ظاهر شوند». او در توضیح این موضوع گفت: «آنها پیشنهاد دادند که تنگۀ هرمز را باز کنند."}],
      tech: [{"source": "MIT AI", "title": "3 Questions: A new resource to empower young entrepreneurs", "link": "https://news.mit.edu/2026/3-questions-new-resource-empower-young-entrepreneurs-1002", "summary": "The book “Disciplined Entrepreneurship” by Bill Aulet, managing director of the Martin Trust Center for MIT Entrepreneurship and the Ethernet Inventors Professor of the Practice at the MIT Sloan School of Management, walks readers through the 24 steps of starting a venture. With more than half a million copies sold, the approach has proven remarkably effective: MIT students who use the framework in the delta v startup accelerator program have a 61 percent survival/acquisition rate and have collectively raised over $3 billion dollars. But while the framework is taught at hundreds of colleges around the world, it is not designed for younger students who want to learn about entrepreneurship. To fill that gap, the Trust Center created a free, AI-powered youth entrepreneurship platform called Dear Dreamer , made possible through a gift from the Frank and Eileen Foundation. Dear Dreamer is open to all students in middle and high school. It adapts the disciplined entrepreneurship framework into a digital, self-paced learning experience featuring short educational videos, interactive exercises, and personalized feedback on the user’s idea. Aulet says the goal is to empower 50,000 young entrepreneurs by 2030. MIT News spoke with Aulet about the mission of the project and how it came together. Q: What was the impetus for creating Dear Dreamer? A: We’ve had a lot of success teaching the disciplined entrepreneurship framework at MIT. Then we made it a course on the online learning platform edX, and we got hundreds of thousands of people taking the class. I used to get emails from people saying, “For the first time in my life, I see myself as an entrepreneur,” or “I see economic security.” At MIT, we often say, “MIT in the world, for the world.” At the Trust Center, we see our mission as, first, train people here at MIT, but also to create more entrepreneurs outside of MIT. The platform was inspired by the vision of Audrey McLoghlin, the founder and CEO of apparel brand Frank and Eileen and president of the Frank and Eileen Foundation. In my first meeting with Audrey, we were already asking ourselves, “How do we make more entrepreneurs in the world?” I showed her Jetpack, MIT’s generative AI tool trained on disciplined entrepreneurship, which walks MIT students through the entrepreneurial process, and her eyes lit up. She said, “This is how we create more entrepreneurs: We make the work that you guys are doing here accessible to young people.” She wished she had a tool", "date_str": "2026-10-02T04:00:00+00:00", "hash": "9cf8f26bf8d3ebcd", "title_fa": "3 سوال: منبعی جدید برای توانمندسازی کارآفرینان جوان", "summary_fa": "کتاب «کارآفرینی منضبط» نوشته بیل اولت، مدیر عامل مرکز اعتماد مارتین برای کارآفرینی MIT و استاد تمرین مخترعان اترنت در دانشکده مدیریت اسلون MIT، خوانندگان را در 24 مرحله شروع یک سرمایه گذاری راهنمایی می کند. با فروش بیش از نیم میلیون نسخه، این رویکرد به طور قابل توجهی موثر ثابت شده است: دانشجویان MIT که از این چارچوب در برنامه شتاب دهنده استارت‌آپ delta v استفاده می‌کنند، نرخ بقا/کسب 61 درصدی دارند و مجموعاً بیش از 3 میلیارد دلار جمع‌آوری کرده‌اند. اما در حالی که این چارچوب در صدها کالج در سراسر جهان تدریس می شود، برای دانشجویان جوانی که می خواهند در مورد کارآفرینی بیاموزند، طراحی نشده است. برای پر کردن این شکاف، مرکز اعتماد یک پلتفرم رایگان کارآفرینی جوانان مبتنی بر هوش مصنوعی به نام Dear Dreamer ایجاد کرد که از طریق هدیه ای از بنیاد فرانک و آیلین امکان پذیر شد. رویایمر عزیز برای تمامی دانش آموزان مقطع راهنمایی و دبیرستان آزاد است. این چارچوب کارآفرینی منضبط را در یک تجربه یادگیری دیجیتالی و خودگام با ویدئوهای آموزشی کوتاه، تمرین‌های تعاملی و بازخورد شخصی درباره ایده کاربر تطبیق می‌دهد. Aulet می گوید که هدف این است که 50000 کارآفرین جوان تا سال 2030 توانمند شود. MIT News با Aulet در مورد ماموریت این پروژه و چگونگی گردآوری آن صحبت کرد. س: انگیزه ایجاد Dear Dreamer چه بود؟ پاسخ: ما موفقیت های زیادی در آموزش چارچوب کارآفرینی منظم در MIT داشته ایم. سپس آن را به یک دوره آموزشی در پلتفرم آموزش آنلاین edX تبدیل کردیم و صدها هزار نفر را در کلاس شرکت کردیم. از مردم ایمیل هایی دریافت می کردم که می گفتند: «برای اولین بار در زندگی ام، خودم را یک کارآفرین می بینم» یا «من امنیت اقتصادی را می بینم». در MIT، ما اغلب می گوییم، \"MIT در جهان، برای جهان.\" در مرکز"}, {"source": "MIT AI", "title": "New tool lets users repair AI-generated 3D models, then fabricate them just the way they want", "link": "https://news.mit.edu/2026/instructmesh-tool-lets-users-repair-ai-3d-models-then-fabricate-them-1001", "summary": "“What you see is what you get” is a guiding principle for many software engineers — create programs where the content you’re editing looks the same as the final product. But when you’re using generative artificial intelligence systems to 3D print, say, a mug, you’ll likely get a cup that can’t hold your coffee. Why is that? The issue is that AI models understand how an object should look, but not how it works, leading to impractical designs that undermine an item’s intended use. Even if you want to fix these errors, the models are typically hard to edit, especially for users new to 3D design. A new approach called “ InstructMesh ” makes it much easier to design and print household items, accessories, and robots that work in the real world. The design software, which was developed by researchers at MIT’s Computer Science and Artificial Intelligence Laboratory (CSAIL), Google, and Northeastern University, can be prompted to generate a 3D design for a pair of glasses, for instance, and users can then highlight specific parts of the blueprint they’d like refined before 3D printing. It’s an AI-driven interface designed to understand how these designs should look and which edits experts and novices alike want to make, helping them create the objects they actually want to see. CSAIL researchers used InstructMesh to put a personalized, creative spin on otherwise regular items. For example, the tool produced a mug that appears to be enveloped by a dragon, with its tail being the handle. It also fabricated a shiny blue whistle resembling a shell and a pair of glasses with butterfly wings spreading out just above the lens. Getting even more creative, it made an octopus-like dispenser, with liquids flowing out of each tentacle to distribute drinks into several cups at once. What makes InstructMesh so adept at following such unique prompts? It pairs Microsoft’s TRELLIS system, which creates 3D models from text and image prompts, with the large language model (LLM) GPT-4, which supports ChatGPT — in other words, visual and textual knowledge combined. “We wanted to bring together the talents of 3D generators and the reasoning skills of LLMs in an interactive space to make objects that people actually want,” says Faraz Faruqi SM ’22, PhD ’26, lead author on a paper presenting the project, graduate of the Department of Electrical Engineering and Computer Science, and recent CSAIL affiliate. “Language models are great at text and images, while TRELLIS’s talent lies in its a", "date_str": "2026-10-01T22:00:00+00:00", "hash": "c1f43df4b8a293fa", "title_fa": "ابزار جدید به کاربران امکان می دهد مدل های سه بعدی تولید شده با هوش مصنوعی را تعمیر کنند، سپس آن ها را همانطور که می خواهند بسازند", "summary_fa": "\"آنچه می بینید همان چیزی است که به دست می آورید\" یک اصل راهنما برای بسیاری از مهندسان نرم افزار است - برنامه هایی را ایجاد کنید که محتوایی که در حال ویرایش آن هستید شبیه محصول نهایی باشد. اما وقتی از سیستم‌های هوش مصنوعی مولد برای پرینت سه‌بعدی، مثلاً یک لیوان، استفاده می‌کنید، احتمالاً فنجانی خواهید داشت که نمی‌تواند قهوه شما را نگه دارد. چرا اینطور است؟ مسئله این است که مدل‌های هوش مصنوعی می‌دانند که یک شی چگونه باید به نظر برسد، اما نه اینکه چگونه کار می‌کند، که منجر به طراحی‌های غیرعملی می‌شود که استفاده مورد نظر یک مورد را تضعیف می‌کند. حتی اگر می‌خواهید این خطاها را برطرف کنید، ویرایش مدل‌ها معمولاً سخت است، مخصوصاً برای کاربرانی که تازه به طراحی سه بعدی می‌پردازند. رویکرد جدیدی به نام «InstructMesh» طراحی و چاپ اقلام خانگی، لوازم جانبی و روبات‌هایی را که در دنیای واقعی کار می‌کنند بسیار آسان‌تر می‌کند. نرم‌افزار طراحی که توسط محققان آزمایشگاه علوم کامپیوتر و هوش مصنوعی MIT (CSAIL)، گوگل و دانشگاه نورث ایسترن توسعه داده شده است، می‌تواند به عنوان مثال یک طرح سه‌بعدی برای یک جفت عینک ایجاد کند و کاربران می‌توانند بخش‌های خاصی از طرحی را که می‌خواهند قبل از چاپ سه‌بعدی پالایش کنند برجسته کنند. این یک رابط مبتنی بر هوش مصنوعی است که برای درک اینکه این طرح‌ها چگونه باید به نظر برسند و چه ویرایش‌هایی را که متخصصان و تازه‌کارها می‌خواهند انجام دهند، طراحی شده است و به آنها کمک می‌کند تا اشیایی را که واقعاً می‌خواهند ببینند ایجاد کنند. محققان CSAIL از InstructMesh برای قرار دادن یک چرخش شخصی و خلاقانه روی موارد معمولی استفاده کردند. به عنوان مثال، این ابزار یک لیوان تولید کرد که به نظر می رسد توسط یک اژدها پوشانده شده است و دم آن دسته است. همچنین یک سوت آبی براق شبیه"}, {"source": "TechCrunch AI", "title": "Last 24 hours: Exhibit at TechCrunch Disrupt 2026 and reach 10,000+ tech leaders", "link": "https://techcrunch.com/2026/10/02/last-24-hours-exhibit-at-techcrunch-disrupt-2026-and-reach-10000-tech-leaders/", "summary": "Today is the very last day to book your exhibit table at TechCrunch Disrupt 2026. On October 13–15, 10,000+ founders, investors, operators, and tech leaders will arrive at San Francisco’s Moscone West looking for companies, products, ideas, and people worth knowing. The question is: will they find your startup?", "date_str": "2026-10-02T14:00:00+00:00", "hash": "f4115b720483cfbc", "title_fa": "24 ساعت گذشته: نمایشگاه در TechCrunch Disrupt 2026 و رسیدن به بیش از 10000 رهبر فناوری", "summary_fa": "تا ساعت 23:59 فرصت دارید PT امشب (2 اکتبر) - یا تا زمانی که میزهای باقی مانده به فروش برسند - تا جای خود را در سالن اکسپو، قلب Disrupt ایمن کنید. قبل از اینکه رقیب شما میز شما را بگیرد، اطلاعات بیشتری کسب کنید و مکان خود  در آگهی", "summary_fa": "هنرپیشه آمریکایی سوئدی که در سال 1990 درگذشت، در یک آگهی A.I. برای یک شرکت تولیدی بازگردانده شد."}, {"source": "The Guardian AI", "title": "Anthropic pushes for opt-out model for Australian content as ABC warns of ‘cannibalisation’ of news", "link": "https://www.theguardian.com/technology/2026/oct/02/anthropic-ai-opt-out-australia-copyright-abc-cannibalisation-of-news", "summary": "Maker of Claude claims AI could transform economy but ABC and SBS say the technology should be subject to media regulations Follow our Australia news live blog for latest updates Get our new political email , free app or daily news podcast The AI giant Anthropic has urged the Albanese government to consider giving “conditional approval” for big tech to train its models on Australian copyrighted works under an opt-out model, after conceding it won’t secure a blanket copyright exemption. But Australia’s public broadcasters, the ABC and SBS, have strongly criticised AI firms, calling on the government to enact strict new rules to compensate media organisations and protect public interest journalism. Sign up for Guardian Australia’s Politics, really newsletter here Continue reading...", "date_str": "2026-10-01T15:00:53+00:00", "hash": "8bdb6d80b344e1e1", "title_fa": "آنتروپیک به دنبال مدل انصراف برای محتوای استرالیایی است زیرا ABC در مورد \"آدم خواری\" اخبار هشدار می دهد.", "summary_fa": "سازنده کلود ادعا می‌کند هوش مصنوعی می‌تواند اقتصاد را متحول کند، اما ABC و SBS می‌گویند این فناوری باید تابع مقررات رسانه‌ای باشد، وبلاگ اخبار استرالیا را برای آخرین به‌روزرسانی‌ها دنبال کنید. ایمیل سیاسی جدید، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید غول هوش مصنوعی Anthropic از دولت آلبان خواسته است تا «تأیید مشروط» را برای فناوری بزرگ در نظر بگیرد تا مدل‌هایش را بر اساس یک مدل دارای حق نسخه‌برداری استرالیایی آموزش دهد. معافیت اما پخش‌کننده‌های عمومی استرالیا، ABC و SBS، به شدت از شرکت‌های هوش مصنوعی انتقاد کرده‌اند و از دولت می‌خواهند که قوانین سخت‌گیرانه جدیدی را برای جبران خسارت سازمان‌های رسانه‌ای و حفاظت از روزنامه‌نگاری منافع عمومی وضع کند. در ارسالی به یک تحقیق پارلمانی فدرال، ABC از شرکت‌های هوش مصنوعی خواسته است که مانند رسانه‌ها مشمول قوانین کپی رایت، افترا و حریم خصوصی باشند و نسبت به «آدم‌خواری» اخبار اصلی هشدار داده شود. ABC و SBS همچنین پیشنهاد کردند که دولت شرکت‌های هوش مصنوعی را در مشوق چانه‌زنی خبری قرار دهد که از آنها می‌خواهد برای حمایت از روزنامه‌نگاری با رسانه‌های بزرگ معاملات تجاری انجام دهند. ABC در ارسالی خود گفت: \"به عنوان ناشران، خدمات مبتنی بر هوش مصنوعی در حال حاضر غیرقانونی هستند و نسبت به رسانه های معتبر استرالیایی با رفتار مطلوب تری مواجه می شوند. این رفتار نابرابر باعث تسریع انسان خواری صنعت اخبار استرالیا می شود.\" SBS گفت که مدل‌های زبان بزرگ مبتنی بر هوش مصنوعی - مانند ChatGPT یا Claude - \"چالشی برای پایداری صنعت اخبار استرالیا و از بین رفتن یکپارچگی اطلاعات و اعتماد عمومی از طریق استفاده آنها از محتوای خبری بدون مجوز، انتساب یا جبران خسارت هستند\"."}, {"source": "The Guardian AI", "title": "AI weapons systems are already here. Algorithms must not decide who lives and dies | Kenneth Roth", "link": "https://www.theguardian.com/commentisfree/2026/oct/02/ai-weapons-systems-algorithms-war", "summary": "Israel’s conduct in Gaza shows the danger of using AI in warfare. Humans must remain at the center of wartime decisions As tech leaders warn about the threats of artificial intelligence, most conjure up images of AI agents running amok , such as hacking systems used to run our critical infrastructure, banks or even militaries. Yet one serious danger is mentioned less frequently – the threat posed by AI–empowered lethal weapons. Fully autonomous versions of these weapons are colloquially known as killer robots . Israel’s conduct in Gaza shows that, in an important respect, such AI weapon systems are already here. An algorithm has been deciding who lives and who dies . Continue reading...", "date_str": "2026-10-02T10:00:17+00:00", "hash": "4c0844e8d460550c", "title_fa": "سیستم های تسلیحاتی هوش مصنوعی در حال حاضر اینجا هستند. الگوریتم ها نباید تصمیم بگیرند که چه کسی زنده است و چه کسی می میرد | کنت راث", "summary_fa": "رفتار اسرائیل در غزه نشان دهنده خطر استفاده از هوش مصنوعی در جنگ است. انسان‌ها باید در مرکز تصمیم‌های زمان جنگ باقی بمانند همانطور که رهبران فناوری درباره تهدیدات هوش مصنوعی هشدار می‌دهند، اغلب تصاویری از عوامل هوش مصنوعی در حال اجرا را تداعی می‌کنند، مانند سیستم‌های هک مورد استفاده برای اداره زیرساخت‌های حیاتی، بانک‌ها یا حتی ارتش‌های ما. با این حال، یک خطر جدی کمتر ذکر شده است - تهدید ناشی از سلاح های مرگبار مجهز به هوش مصنوعی. نسخه های کاملا خودمختار این سلاح ها در محاوره به عنوان روبات های قاتل شناخته می شوند. رفتار اسرائیل در غزه نشان می دهد که از جنبه مهمی، چنین سیستم های تسلیحاتی هوش مصنوعی در حال حاضر اینجا هستند. یک الگوریتم تصمیم می‌گیرد که چه کسی زنده بماند و چه کسی بمیرد. به خواندن ادامه دهید... رهبران فناوری اطلاعات در مورد تهدیدات هوش مصنوعی هشدار می دهند، اغلب تصاویری از عوامل هوش مصنوعی در حال اجرا را تداعی می کنند، مانند سیستم های هک مورد استفاده برای اداره زیرساخت های حیاتی، بانک ها یا حتی ارتش ما. با این حال، یک خطر جدی کمتر ذکر شده است - تهدید ناشی از سلاح های مرگبار مجهز به هوش مصنوعی. نسخه های کاملا خودمختار این سلاح ها در محاوره به عنوان روبات های قاتل شناخته می شوند. بیش از یک دهه است که دولت‌ها در ژنو برای توقف توسعه سلاح‌های هوش مصنوعی خودگردان تشکیل جلسه داده‌اند. در اوایل سپتامبر، 128 دولت گرد هم آمدند تا گزارشی را تصویب کنند که می‌تواند به عنوان پایه‌ای برای یک معاهده الزام‌آور عمل کند. اما مجموعه ای از وکلای فرستاده شده توسط دونالد ترامپ و ولادیمیر پوتین با هم متحد شدند تا آن را کمرنگ کنند. قابل ذکر است، آنها مقرراتی را تضعیف کردند که انسانها را ملزم می کند تا اهداف نظامی توسعه یافته توسط"}, {"source": "The Guardian AI", "title": "We don’t need to panic about AI. We need to hold its creators accountable when things go wrong | John Quiggin", "link": "https://www.theguardian.com/commentisfree/2026/oct/02/we-dont-need-to-panic-about-ai-we-need-to-hold-its-creators-accountable", "summary": "If a chatbot prompt like ‘find Australian medicine statistics’ results in a website breach, the responsibility does not lie with a piece of code The recent panic about a breach of Medicare computer security by an “AI agent” contrasts sharply with other recent cases such as the Telstra and Optus outages that left many Australians unable to reach Triple Zero . In those cases, no one blamed the computers involved. The mistakes were clearly sheeted home to the corporations that operated them. This wasn’t always the case. When the term “artificial intelligence” was coined some 70 years ago, the first mainframe computers (absurdly primitive by modern standards) were viewed with the same awe and concern as the AI agents of the present day. There were even “algorithms” (though the term wasn’t used in that way at the time) that were supposed to pick ideal dating matches. Continue reading...", "date_str": "2026-10-02T01:13:21+00:00", "hash": "156e5b2c91f57540", "title_fa": "ما نیازی به وحشت در مورد هوش مصنوعی نداریم. ما باید سازندگان آن را در زمانی که همه چیز اشتباه می‌کند پاسخگو باشیم | جان کویگین", "summary_fa": "اگر یک درخواست چت بات مانند «یافتن آمار پزشکی استرالیا» منجر به نقض وب‌سایت شود، مسئولیت با یک کد نیست. وحشت اخیر در مورد نقض امنیت رایانه Medicare توسط یک «عامل هوش مصنوعی» به شدت با موارد اخیر مانند قطعی Telstra و Optus که باعث شد بسیاری از استرالیایی‌ها قادر به رسیدن به تریپل صفر نباشند، تضاد دارد. در آن موارد، هیچ کس رایانه های درگیر را مقصر نمی دانست. اشتباهات به وضوح به شرکت‌هایی که آنها را اداره می‌کردند، نشان می‌داد. همیشه اینطور نبود. زمانی که اصطلاح «هوش مصنوعی» حدود 70 سال پیش ابداع شد، اولین رایانه‌های بزرگ (که با استانداردهای مدرن بسیار بدوی هستند) با همان ترس و نگرانی به عنوان عوامل هوش مصنوعی امروزی نگریسته شدند. حتی «الگوریتم‌هایی» وجود داشت (اگرچه در آن زمان از این اصطلاح استفاده نمی‌شد) که قرار بود مطابقت‌های دوستیابی ایده‌آل را انتخاب کنند. به خواندن ادامه دهید... وحشت اخیر در مورد نقض امنیت رایانه Medicare توسط یک \"عامل هوش مصنوعی\" به شدت با موارد اخیر مانند قطعی Telstra و Optus که باعث شد بسیاری از استرالیایی ها نتوانند به Triple Zero برسند، در تضاد است. در آن موارد، هیچ کس رایانه های درگیر را مقصر نمی دانست. اشتباهات به وضوح به شرکت‌هایی که آنها را اداره می‌کردند، نشان می‌داد. شکست ها اجتناب ناپذیر بودند و سرزنش کردن به امری عادی تبدیل شد. \"کامپیوتر اشتباه کرد\" معادل دهه 1960 بود که \"ایمیل شما باید ناخواسته باشد\". با این حال، به تدریج متوجه شدیم که مشکل از رایانه نیست، بلکه اطلاعات نادرست وارد شده به آن یا برنامه های بد نوشته شده است که در نتیجه آن فراخوانی شده است. هنگامی که درباره «عامل‌های» هوش مصنوعی صحبت می‌کنیم، باید تنظیمات مشابهی را انجام دهیم. اگر شخصی درخواستی مانند «یافتن آمار پزشکی استرالیا» را در برنامه‌ای مانند ChatGPT یا Claude وارد کند و نتیجه آن"}, {"source": "The Guardian AI", "title": "California issues investigative subpoena to OpenAI over rogue agents’ hacking", "link": "https://www.theguardian.com/us-news/2026/oct/01/california-opens-investigation-openai-hack", "summary": "State attorney general issues subpoena to OpenAI as ​part of broader inquiry into potential security vulnerabilities California’s attorney general has issued an investigative subpoena to OpenAI, starting an investigation into the startup ⁠as ​part of a broader inquiry into potential cybersecurity vulnerabilities and incidents related ⁠to its AI models, his office said on Thursday. Last month, Rob Bonta announced that ⁠the Department of Justice was conducting a formal ​investigation into the “Hugging ‌Face incident”, amid increasing ‌scrutiny of the AI industry. AI agents developed by OpenAI hacked Hugging Face in July, gaining access to parts of the open-source platform’s infrastructure. Continue reading...", "date_str": "2026-10-01T19:01:55+00:00", "hash": "a3ac1b2d6022c0fd", "title_fa": "کالیفرنیا احضاریه تحقیقاتی به OpenAI به دلیل هک کردن عوامل سرکش صادر می کند", "summary_fa": "دادستان کل ایالت به عنوان بخشی از تحقیقات گسترده تر در مورد آسیب پذیری های امنیتی بالقوه، احضاریه ای را برای OpenAI صادر کرد، دادستان کل کالیفرنیا احضاریه ای تحق nsive catalog of excellent 32-bit and 16-bit games. Ayaneo isn’t the first company to attempt to modernize the GBA, but its Konkr Pocket Advance does it best. The handheld strikes a near perfect balance between authentically re-creating the GBA’s design while updating its hardware with new controls, a much better screen, and the flexibility of Android at a price that feels like a bargain. As much as I still adore the GBA, I’ve eagerly embraced upgrades to the aging console over the years. First it was the clamshell GBA SP that finally delivered a frontlit screen I could actually see without a lamp over my shoulder, and later it was aftermarket upgrades like a backlit LCD display and a rechargeable battery that vastly improved Nintendo’s original hardware. Two years ago, I eagerly purchased Anbernic’s GBA-inspired RG34XX , but all of those have now been replaced by the Konkr Pocket Advance. It’s my first handheld from Ayaneo, and I’ve been pleasantly surprised to find the hardware feels on par with Nintendo’s. The Pocket Advance is an all-plastic affair but with a satisfying heft thanks to extra internal hardware including a cooling fan for its MediaTek Helio G90T processor and a 4,000mAh battery. I opted for the cheaper $109 version with 3GB of RAM and 32GB of storage, which is expandable with a microSD card, but for $129, you can get 4GB of RAM with 64GB of storage built-in. It’s not an exact copy of the GBA, but the Pocket Advance’s dimensions are close enough to fit all the cases I’ve somehow preserved for the past 25 years. Where Ayaneo’s remake really diverges from the original is with eight additional buttons including X and Y action buttons plus four extra shoulder buttons on the top edge. I’m a big fan of the larger D-pad Ayaneo has included, but some retro gaming purists may not be fans of how soft and squishy the Pocket Advance’s buttons all feel. I’ve had to learn to mash the action buttons just a little harder to ensure presses are always registered, but 1b05765321a", "title_fa": "R2 Rivian به تازگی به آن کمک کرد تا رکورد فروش جدیدی را ثبت کند", "summary_fa": "تحویل تقریباً 45 درصد نسبت به سه ماهه مشابه سال گذشته جهش داشت و Rivian بیش از 19000 خودروی برقی تحویل داد. ریوین در سه ماهه سوم، بیشتر از هر زمان دیگری خودروهای الکتریکی فروخت، تا حد زیادی به لطف عرضه SUV جدید و مقرون به صرفه تر R2 خود. این شرکت صبح جمعه اعلام کرد که 19751 وسیله نقلیه ساخته و 19248 دستگاه تحویل داده است. این تقریباً 45 درصد بیشتر از تحویل در مدت مشابه سال گذشته است. در حالی که Rivian مشخص نکرد که چه تعداد از این خودروهای شاسی بلند R2 هستند، این اولین سه ماهه فروش کامل خودروی جدید پس از عرضه در ماه ژوئن بود. این شرکت روز جمعه گفت که نتایج مالی کامل سه ماهه سوم خود را در 29 اکتبر منتشر خواهد کرد. این شرکت شرط بندی کرده است که تا پایان سال بین 20،000 تا 25،000 خودروی R2 بفروشد که آن را به یکی از پرفروش ترین خودروهای الکتریکی در ایالات متحده تبدیل می کند. تاریخ - تنها پس از تسلا مدل Y. Rivian همچنین قصد دارد مدل‌های ارزان‌تری را با قیمتی در حدود 45000 دلار در دسترس قرار دهد. اگر Rivian به این اعداد برسد، این شرکت معتقد است که می تواند بین 65000 تا 70000 وسیله نقلیه در سال جاری بفروشد، از جمله سری خودروهای R1 و ون الکتریکی تجاری خود. این بهترین سال فروش آن تا به حال خواهد بود، زیرا این شرکت در چند سال گذشته در حدود 50000 دستگاه خودرو فروخته است. ریوین در حال حاضر R2 را در کارخانه خود در نرمال، ایلینویز می‌سازد، جایی که اخیراً فضای تولید را برای قرار دادن SUV جدید گسترش داده است. اما Rivian همچنین در حال ساخت یک کارخانه کاملاً جدید در خارج از آتلانتا، جورجیا است، جایی که انتظار دارد در آینده نزدیک بتواند سالانه 300000 وسیله"}, {"source": "TechCrunch Main", "title": "Rivian issues R2 recall for poorly tightened battery packs", "link": "https://techcrunch.com/2026/10/02/rivian-issues-r2-recall-for-poorly-tightened-battery-packs/", "summary": "The company says around 14 vehicles may be affected, and that it has resolved the issue on the assembly line.", "date_str": "2026-10-02T12:50:11+00:00", "hash": "5cdcc261c7adf902", "title_fa": "Rivian فراخوان R2 را برای بسته‌های باتری ضعیف صادر می‌کند", "summary_fa": "این شرکت می گوید ممکن است حدود 14 وسیله نقلیه تحت تأثیر قرار گیرند و این مشکل را در خط مونتاژ حل کرده است. پس از اینکه این شرکت متوجه شد که بست های بسته باتری ولتاژ بالا ممکن است به درستی سفت نشده باشند، که می تواند باعث از دست دادن قدرت در هنگام رانندگی شود، ریوین برای شاسی بلند R2 خود فراخوانی صادر کرده است. این شرکت می‌گوید تنها حدود 14 وسیله نقلیه ممکن است تحت تأثیر قرار گرفته باشند، و در صورت نیاز قطعات آسیب‌دیده را در خودروهای مشتریان تعمیر یا تعویض خواهد کرد. این دومین فراخوانی است که Rivian برای R2 صادر کرده است که ارسال آن به مشتریان در سال جاری آغاز شده است. این یک وسیله نقلیه بسیار مهم برای این شرکت است، زیرا اولین خودروی الکتریکی Rivian است که برای بازار انبوه طراحی شده است و قرار است برای اولین بار به آن کمک کند تا به سوددهی برسد. اولین فراخوان R2، که ماه گذشته منتشر شد، مربوط به قابلیت دید دوربین پشتیبان بود و با یک به روز رسانی نرم افزاری مورد بررسی قرار گرفت. در یک پرونده، اداره ملی ایمنی ترافیک بزرگراه (NHTSA) گفت که Rivian برای اولین بار این نقص را در 17 سپتامبر مشاهده کرد. یک اپراتور تولیدی در کارخانه نرمال شرکت ایلینوی متوجه شد که یکی از بست ها توسط یک ایستگاه خودکار در خط مونتاژ تحت گشتاور قرار گرفته است. این شرکت ایستگاه را بررسی و برنامه‌ریزی مجدد کرد تا بست‌های دارای گشتاور نامناسب را رد کند. ریوین به رگولاتور ایمنی گفت که از هیچ گزارش مشتری، تصادف، جراحت یا تلفات مرتبط با این موضوع اطلاعی ندارد. برخی از کاربران Reddit، همراه با RivianTrackr، وبلاگی که شرکت را از نزدیک دنبال می کند، اواخر ماه گذشته در مورد این مشکل گزارش دادند. یکی از مالکان گفت که"}, {"source": "TechCrunch Main", "title": "Robotaxi operators will face fines for blocking first responders", "link": "https://techcrunch.com/2026/10/01/robotaxi-operators-will-face-fines-for-blocking-first-responders/", "summary": "A new California law places new rules on autonomous vehicles operators.", "date_str": "2026-10-02T00:57:57+00:00", "hash": "694a7a170c1bc64a", "title_fa": "اپراتورهای Robotaxi برای مسدود کردن اولین پاسخ دهندگان با جریمه روبرو خواهند شد", "summary_fa": "قانون جدید کالیفرنیا قوانین جدیدی را برای اپراتورهای وسایل نقلیه خودران وضع می کند. شرکت‌های فناوری وسایل نقلیه خودران (AV) مانند تسلا، وایمو، و زوکس باید زمانی که رباتاکسی آنها باعث ایجاد مشکل در قانون جدید کالیفرنیا می‌شود، به اولین پاسخ‌دهندگان پشتیبانی محلی و روی زمین ارائه دهند. اگر رباتاکسی پلیس یا آتش نشانان را برای بیش از 30 دقیقه مسدود کند، این شرکت ها ممکن است با مجازات هایی روبرو شوند. لایحه 1246 سنا، که توسط دولت امضا شد. Gavin Newsom، مجموعه‌ای از قوانین جدید را برای دستگاه‌های AV تنظیم می‌کند که برای بهبود ایمنی و زمان پاسخ‌دهی زمانی که از کار می‌افتند یا در واکنش‌های اضطراری تداخل می‌کنند، طراحی شده‌اند. این قانون همچنین راه‌هایی را ایجاد می‌کند که اگر این شرکت‌ها را نپذیرند، پاسخگو خواهد بود. این قانون به دنبال رشته‌ای از حوادث پرمخاطب در کالیفرنیا است که در آن رباتاکسی خراب شد و ترافیک را مختل کرد، به صحنه‌های جرم رانندگی کرد، یا مانع از واکنش‌های اولیه شد. بخش عمده ای از این حوادث مربوط به Waymo، بزرگترین اپراتور روباتاکسی در ایالات متحده بود. که حدود 4000 خودروی خودران در ناوگان تجاری خود در سراسر کشور دارد. حدود 1200 نفر از آنها در منطقه خلیج سانفرانسیسکو هستند. تحقیقات TechCrunch در اوایل سال جاری، تعدادی از حوادث را شناسایی کرد که در آن‌ها Waymo به اولین واکنش‌دهنده‌ها برای رانندگی دستی وسایل نقلیه خود در هنگام مواجهه با مشکلات متکی بود. این حوادث قانونگذاران ایالتی و فدرال را بر آن داشت تا قوانین سختگیرانه تری را در مورد رباتاکسی ها، به ویژه نحوه رفتار آنها با اولین واکنش دهنده ها، خواستار شوند. اداره ملی ایمنی ترافیک بزرگراه (NHTSA) حتی نامه ای به توسعه دهندگان AV ارسال کرد و از آنها خواست که \"راه حل هایی\" برای این مشکل ارائه دهند. این قانون جدید کالیفرنیا تلاش می‌کند تا این نگرانی‌ها"}, {"source": "TechCrunch Main", "title": "The founder’s guide to TechCrunch Disrupt 2026: Everything you need to know", "link": "https://techcrunch.com/2026/10/01/the-founders-guide-to-techcrunch-disrupt-2026-everything-you-need-to-know/", "summary": "TechCrunch Disrupt 2026 is built around one question: How do you build an enduring company in the AI era? Our programming and speaker lineup reflect that.", "date_str": "2026-10-02T00:03:23+00:00", "hash": "2f583a54dfdf51c5", "title_fa": "راهنمای بنیانگذار TechCrunch Disrupt 2026: هر آنچه که باید بدانید", "summary_fa": "سال گذشته در Disrupt، ما با بنیانگذاران در مورد تجربیات آنها صحبت کردیم و نتایج حضور آنها را از نزدیک کشف کردیم. یکی از بنیان‌گذاران پس از تایید برای Startup Battlefield و بیش از 100 ورودی سرمایه‌گذار که به تقویت مکالمات در مورد دور جمع‌آوری سرمایه در آینده کمک می‌کنند، نرخ اشتراک بیش از حد 3 برابری را مشاهده کرد. یکی دیگر از بنیانگذاران نزدیک به 30 مکالمه پشت سر هم با سرمایه گذارانی داشت که پس از یک زمین بازی روی صحنه به آنها هجوم آوردند و آنها را تا غرفه خود دنبال کردند. این استثنا در Disrupt نیست - نکته این است. و این فرصت ها فقط برای فینالیست های Battlefield در دسترس نیست. هر مکالمه ای در سالن اکسپو یا در یک رویداد جانبی می تواند فرصتی برای استارتاپ شما ایجاد کند. برای سال‌ها، چه در نیویورک، سانفرانسیسکو یا جاهای دیگر برگزار شود، Disrupt هزاران بنیان‌گذار، سرمایه‌گذار، اعضای تیم استارت‌آپ و رهبران فناوری را گرد هم آورده است. ما این مأموریت را در Moscone West SF، در تاریخ 13 تا 15 اکتبر، با ترکیبی پر از سخنرانان، بیش از 200 جلسه متخصص، انبوهی از فرصت‌های شبکه‌ای سازمان‌یافته و بی‌نظیر، و مهم‌تر از همه، این شانس را داریم که در همان اتاق شخصی باشیم که می‌تواند ایده نوپای شما را برای یک شرکت یا استارت‌آپ فعلی‌تان تغییر دهد. این راهنما برای بنیان‌گذارانی است که به تازگی در مورد Disrupt یاد می‌گیرند، نیاز به تجدید نظر دارند یا در مورد ارزشش شک دارند. TechCrunch بیش از 20 سال است که وجود دارد. می توانیم آن را بگیریم و قبل از غواصی، ما دو تخفیف داریم که تا شروع Disrupt ادامه دارد و باید از آنها مطلع شوید. بنیانگذاران می‌توانند با دنبال کردن این پیوند، یکی از اعضای تیم را با تخفیف 50 درصدی بلیط خود همراه کنند، یا می‌توانید"}, {"source": "TechCrunch Main", "title": "Lyft is paying $272.5M to settle lawsuit over how it classified drivers", "link": "https://techcrunch.com/2026/10/01/lyft-is-paying-272-5m-to-settle-lawsuit-over-how-it-classified-drivers/", "summary": "Today, gig economy drivers are classified as contractors. This settlement clears up a lingering lawsuit from 2020 when that was still an unanswered issue.", "date_str": "2026-10-01T21:57:08+00:00", "hash": "4bea5f7a144d01d8", "title_fa": "Lyft 272.5 میلیون دلار برای حل و فصل دعوی در مورد نحوه طبقه بندی رانندگان پرداخت می کند", "summary_fa": "امروزه رانندگان اقتصاد گیگ به عنوان پیمانکار طبقه بندی می شوند. این حل و فصل یک دعوی حقوقی از سال 2020 را برطرف می کند، زمانی که هنوز یک موضوع بی پاسخ بود. Lyft با پرداخت 272.5 میلیون دلار برای حل و فصل دعوی متهم به نقض قوانین کالیفرنیا با طبقه‌بندی اشتباه رانندگان به‌عنوان پیمانکاران مستقل به جای کارمندان، موافقت کرده است. این شرکت در یک پرونده نظارتی گفت که معتقد است این تسویه حساب به آن اجازه می دهد از هزینه ها و حواس پرتی ناشی از دعاوی حقوقی طولانی جلوگیری کند و مدیریت را قادر می سازد تمرکز خود را بر اجرای اهداف تجاری خود حفظ کند. این تسویه حساب ناشی از شکایتی است که توسط دفتر کمیساریای کار کالیفرنیا در آگوست 2020 ارائه شد و لیفت را متهم کرد که طبق قانون ایالتی در آن زمان با رانندگان به عنوان پیمانکاران مستقل و نه به عنوان کارمند رفتار می کند. در این دادخواست مدعی شد که رانندگان از حداقل دستمزد و اضافه کاری و همچنین سایر مزایا و حمایت های ارائه شده به کارکنان، از جمله مرخصی استعلاجی با حقوق و پرداخت به موقع دستمزد، محروم شده اند. این حل و فصل درباره کارگرانی است که جلو آمدند و صحبت کردند. لیلیا گارسیا بروئر، کمیسر کار کالیفرنیا در بیانیه‌ای گفت که صدای آنها این نتیجه را ممکن کرد و افزود که LCO از سهم خود در تسویه حساب صرف نظر می‌کند و آن وجوه را به رانندگانی که مطالبات دستمزدی ارائه کرده‌اند اختصاص می‌دهد. این توافق که هنوز باید توسط یک قاضی تأیید شود، نقض های ادعایی از 6 آوریل 2016 تا 15 دسامبر 2020 را پوشش می دهد - دوره ای که کالیفرنیا درگیر این بود که آیا کارگران در اقتصاد پررونق گیگ، پیمانکاران مستقل یا کارمند هستند. امروزه، رانندگان خدمات حمل‌ونقل مبتنی بر اپلیکیشن مانند"}, {"source": "TechCrunch Main", "title": "Kevin Mandia’s new ‘agent swarm’ security startup Armadin raises $255.5M at $2.5B valuation", "link": "https://techcrunch.com/2026/10/01/kevin-mandias-new-agent-swarm-security-startup-armadin-raises-255-5m-at-2-5b-valuation/", "summary": "Kevin Mandia, best known as the founder of Mandiant, has a new startup that is using agent swarms to test and protect enterprises.", "date_str": "2026-10-01T21:55:22+00:00", "hash": "51847e952bf8d55c", "title_fa": "استارت‌آپ امنیتی جدید «ازدحام نمایندگان» کوین ماندیا، آرمادین، ۲۵۵.۵ میلیون دلار با ارزش ۲.۵ میلیارد دلار جمع‌آوری کرد.", "summary_fa": "کوین ماندیا، که بیشتر به عنوان بنیانگذار Mandiant شناخته می شود، استارتاپ جدیدی دارد که از گروه های عامل برای آزمایش و محافظت از شرکت ها استفاده می کند. دور سری B توسط Andreessen Horowitz و Accel رهبری می‌شد و Bain Capital Ventures، Redpoint، 8VC، Ballistic Ventures، Google Ventures، In-Q-Tel، Kleiner Perkins و Menlo Ventures به آن پیوستند. دور جدید تنها شش ماه پس از جمع‌آوری 190 میلیون دلاری Armadin در سری A برگزار می‌شود. اکنون بیش از 445 میلیون دلار جمع آوری کرده است. آرمادین با تصور مجدد آزمایشات دفاعی برای عصر هوش مصنوعی، نوع جدیدی از امنیت همیشه روشن را به شرکت ها ارائه می دهد. به‌جای آزمایش‌های نفوذ سنتی، که در آن تفنگ‌های اجیر شده سعی می‌کنند وارد شوند و نقاط ضعفی را که پیدا می‌کنند گزارش دهند، Armadin از گروه‌های عامل همیشه فعال استفاده می‌کند که آسیب‌پذیری‌ها را برای هک کردن به هم متصل می‌کنند. ایده این است که به سازمان‌ها کمک کند قبل از اینکه افراد بد (یا حتی آزمایشگاه‌های هوش مصنوعی با عوامل سرکش از آنها استفاده کنند) سوراخ‌ها را پیدا کرده و مهر و موم کنند. 50٪ تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس خود را بگیرید و یک همکار، شریک یا همتای خود را با 50 درصد تخفیف بیاورید. با ایجاد ارتباطات، ایجاد شتاب و کشف آنچه در اکوسیستم استارت آپی در آینده وجود دارد، زمینه بیشتری را پوشش دهید. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها هسته TechCrunch هستند، بنابراین
