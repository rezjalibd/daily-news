 12 $349.99 (List Price $399.00) Sony WH-1000XM5 $198.00 (List Price $248.00) Deals are selected by our commerce team", "date_str": "2026-10-08T19:00:58+00:00", "hash": "5eab84841db5c041", "title_fa": "این تبلت گلکسی سامسونگ پس از روز اول اکتبر 70 دلار تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. روز اول اکتبر به پایان رسیده است، اما هنوز هم می توانید از این معامله عالی استفاده کنید. Samsung Galaxy Tab A11+، تبلتی با نقد و بررسی خوب با قیمتی مناسب. آمازون در حال حاضر آن را به قیمت 229.99 دلار می فروشد که 70 دلار کمتر از قیمت فهرست 299.99 دلار است. Samsung Galaxy Tab A11+ 128GB 11\" 1920x1200 Tablet Android (خاکستری) 229.99 دلار در آمازون 299.99 دلار صرفه جویی 70.00 دلار دریافت معامله دریافت معامله 229.99 دلار در آمازون 299.99 دلار صرفه جویی 70.00 دلاری این تبلت Galaxy Tab A11-inch با صفحه نمایش ref 0 اینچ H این مدل دارای 6 گیگابایت حافظه و 128 گیگابایت حافظه داخلی است، در حالی که این یک SSD به خصوص بزرگ نیست، مشخصات باید برای بسیاری از کارها کافی باشد، خواه مرور، پخش جریانی، بازی یا انجام برخی کارها. گلکسی تب A11+ دارای دوربین جلوی 5 مگاپیکسلی برای تماس‌های ویدیویی و باتری بزرگی است که می‌تواند در یک پرواز طولانی دوام بیاورد. اگر متوجه شدید که به رم یا فضای ذخیره سازی بیشتری نیاز دارید، مدل 256 گیگابایتی با 8 گیگابایت حافظه در حال حاضر تخفیف ندارد: می توانید آن را با 379.99 دلار تهیه کنید. بهترین تخفیف‌های روز نخست ما با ویرایشگر تأیید شده در حال حاضر Apple AirPods Pro 3 Noise Cancelling Heart Rate Earbuds 199.00 دلار (قیمت فهرستی 249.00 دلار) دوربین امنیتی سیمی 2K دوربین داخلی حلقه‌ای (بسته 2، سفید) 99.99 دلار (قیمت فهرستی iPadFi A119.18 اینچ) اپل 119.11 گیگابایت (آبی، 2025) 399.99 دلار (فهرست قیمت 449.00 دلار) Apple Watch Series 12 349.99 دلار (قیمت فهرستی 399.00 دلار) Sony WH-1000XM5 198.00 دلار (قیمت فهرست 248 دلار) تخفیف ها به عنوان یک منبع تجاری"}, {"source": "Lifehacker", "title": "Your Mac Should Be Doing More of the Work. Here's How MacPaw Helps", "link": "https://lifehacker.com/ad/tech/your-mac-should-be-doing-more-of-the-work-heres-how-macpaw-helps?utm_medium=RSS", "summary": "The following content is brought to you by Lifehacker partners. If you buy a product featured here, we may earn an affiliate commission or other compensation. The work you actually sat down to do rarely gets interrupted by something dramatic. It gets interrupted by housekeeping a quick fix here, a quick lookup there, each one small enough to feel harmless and just long enough to break your focus. This is true for freelancers, founders, designers, and developers. But it s also true for work-from-home employees and busy people in general. And it s not that any of these tasks are difficult (which almost makes them more annoying); it s that each one takes just enough time and attention to pull you away from whatever you actually sat down to do. Little interruptions may not seem like much, but they add up to a surprising amount of time spent taking care of your Mac instead of letting your Mac take care of you. MacPaw has spent 18 years building tools that take everyday work off Mac users' hands by noticing the small stuff you've stopped noticing, and quietly handling it for you. For anyone whose Mac doubles as an office, the files, apps, and projects add up but the upkeep shouldn't have to. MacPaw Get more out of your Mac with less effort Learn More Learn More Here s how MacPaw s products help you save time and frustration while using your trusty Mac computer. The cleanup you keep putting off When storage starts disappearing, you can open folders one by one, sort through old downloads, track down duplicate files, and try to uncover large files that are eating up space and collecting dust. Or, you can make that maintenance somebody else's problem. CleanMyMac keeps everyday care in one place, so maintenance takes less of your attention. If you work with video or like to keep many applications open at once, freeing up space can help your Mac work as intended. You ll spend less time staring at the dreaded spinning color wheel and more time getting things done. CleanMyMac at MacPaw Shop Now Shop Now at MacPaw The small, niche task that might already have a plug-and-play solution Sometimes you just need an app for one specific task. Maybe you need to compress a video before sending it to a client. The job itself takes two minutes, but first you have to find an app, compare your options, figure out whether you trust it, download it, and possibly even pay for yet another subscription. Setapp cuts out much of the scavenger hunt by giving you one trusted place to look fo", "date_str": "2026-10-08T18:42:49+00:00", "hash": "d1ab3bddfca411a2", "title_fa": "مک شما باید بیشتر کار را انجام دهد. در اینجا نحوه کمک MacPaw آمده است", "summary_fa": "محتوای زیر توسط شرکای Lifehacker برای شما آورده شده است. اگر محصولی را بخرید که در اینجا مشخص شده است، ممکن است کمیسیون وابسته یا غرامت دیگری دریافت کنیم. کاری که در واقع برای انجام آن نشسته اید، به ندرت توسط چیزی دراماتیک قطع می شود. با یک تعمیر سریع خانه داری در اینجا، یک جستجوی سریع در آنجا، هر یک به اندازه ای کوچک که احساس بی ضرری داشته باشید و فقط به اندازه ای طولانی باشد که تمرکز شما را از بین ببرد، کار قطع می شود. این برای فریلنسرها، بنیانگذاران، طراحان و توسعه دهندگان صادق است. اما برای کارمندان کار از خانه و به طور کلی افراد پرمشغله نیز صادق است. و این نیست که هیچ یک از این وظایف دشوار باشد (که تقریباً آنها را آزاردهنده تر می کند). این این است که هر یک به اندازه کافی زمان و توجه لازم را می گیرد تا شما را از هر کاری که واقعاً روی آن نشسته اید دور کند. وقفه‌های کوچک ممکن است زیاد به نظر نرسند، اما به جای اینکه اجازه دهند مک شما از شما مراقبت کند، زمان شگفت‌انگیزی برای مراقبت از مک شما صرف می‌شود. MacPaw 18 سال را صرف ساختن ابزارهایی کرده است که با توجه به چیزهای کوچکی که دیگر متوجه آنها نشده‌اید، کار روزمره را از دست کاربران مک می‌کشد و بی‌صدا آن‌ها را برای شما مدیریت می‌کند. برای هر کسی که مک او به عنوان یک آفیس عمل می‌کند، فایل‌ها، برنامه‌ها و پروژه‌ها اضافه می‌شوند، اما نگهداری لازم نیست. MacPaw با تلاش کمتر از Mac خود بهره بیشتری ببرید بیشتر بدانید بیشتر بیاموزید در اینجا نحوه استفاده از محصولات MacPaw به شما در صرفه جویی در وقت و ناامیدی هنگام استفاده از رایانه Mac قابل اعتماد خود می پردازیم. پاکسازی که مدام به تعویق می‌اندازید وقتی فضای ذخیره‌سازی شروع"}, {"source": "Lifehacker", "title": "We Now Know When Apple Will Host Its Next Big Tech Event", "link": "https://lifehacker.com/tech/how-to-watch-apples-next-big-tech-announcement?utm_medium=RSS", "summary": "Last month's Apple event was a big one . The company announced (and subsequently released) the iPhone 18 Pro, iPhone 18 Pro Max, Apple Watch Series 12, and Apple Watch Ultra 4. It also announced the iPhone Duo, though the company's first foldable phone still isn't out yet. Despite all these new products, Apple apparently wasn't finished. Next week, the company will host another product announcement, titled \"Welcome Home.\" Here's what we know. What will Apple announce at its \"Welcome Home\" event? Apple's product announcement hints are usually pretty subtle. This time, it isn't. \"Welcome Home\" is almost assuredly referencing Apple's long-rumored smart home devices. Sure, the company makes some smart devices, like the HomePod and HomePod mini, but leaks suggest the company has some big updates up its sleeve. Perhaps no announcement will be bigger than its smart home hub . This device, according to the rumor mill, will be a mix between an iPad and a HomePod, competing with similar devices from companies like Amazon and Google. It may ship with a six-inch display (some reports suggest the screen is a square), but it won't be like an iPad on a stand. Instead, the experience seems more focused, letting you control smart home devices, make and receive FaceTime calls, watch videos, display the news and water data, and check your calendar. Of course, it will likely work with Siri AI, the company's new AI-powered assistant. Apple may even expect users to buy more than one of these hubs. The idea could be to have multiple hubs throughout your house, which could let you use them like intercoms. (Apple currently offers a similar feature with its HomePods.) If the rumors are to be believed, the smart hub will understand the voice of whoever is talking to it, and tailor the experience to that user personally. If you have guests over, you could switch to a \"visitor mode\" to avoid revealing sensitive information. While the smart home hub may steal the show, Apple is planning some updates to existing devices as well . The HomePod mini may come in new colors, and is expected to get both the N1 chip for improvements to wifi and Bluetooth, as well as an upgraded S-series chip for Siri AI. Apple may also update the Apple TV 4K with the A19 or A19 Pro chip, as well as that new N1 chip, and a new Siri remote. Apple may take this opportunity to reveal its new OLED iPad mini, but the company may keep the focus on smart home specifically. When is Apple's \"Welcome Home\" event? Accordi", "date_str": "2026-10-08T18:00:00+00:00", "hash": "5e8e01b3953f85a9", "title_fa": "اکنون می دانیم که اپل چه زمانی رویداد بزرگ فناوری خود را میزبانی می کند", "summary_fa": "رویداد ماه گذشته اپل یک رویداد بزرگ بود. این شرکت آیفون 18 پرو، آیفون 18 پرو مکس، اپل واچ سری 12 و اپل واچ اولترا 4 را معرفی کرد (و متعاقباً عرضه کرد). با وجود همه این محصولات جدید، ظاهرا اپل کارش را تمام نکرده است. هفته آینده، این شرکت میزبان معرفی محصول دیگری با عنوان «به خانه خوش آمدید» خواهد بود. این چیزی است که ما می دانیم. اپل در رویداد \"Welcome Home\" خود چه چیزی را اعلام خواهد کرد؟ نکات اعلامی محصول اپل معمولاً بسیار ظریف هستند. این بار، اینطور نیست. «به خانه خوش آمدید» تقریباً به دستگاه‌های خانگی هوشمند اپل که مدت‌ها شایعه شده بود اشاره می‌کند. مطمئناً، این شرکت برخی از دستگاه‌های هوشمند مانند HomePod و HomePod mini را می‌سازد، اما اطلاعات فاش شده نشان می‌دهد که این شرکت به‌روزرسانی‌های بزرگی را در آستین خود دارد. شاید هیچ اطلاعیه ای بزرگتر از مرکز خانه هوشمند آن نباشد. طبق شایعات، این دستگاه ترکیبی بین آی‌پد و هوم پاد خواهد بود که با دستگاه‌های مشابه شرکت‌هایی مانند آمازون و گوگل رقابت می‌کند. ممکن است با یک صفحه نمایش شش اینچی عرضه شود (برخی گزارش ها نشان می دهد صفحه نمایش مربعی شکل است)، اما مانند یک iPad روی پایه نخواهد بود. در عوض، این تجربه متمرکزتر به نظر می‌رسد و به شما امکان می‌دهد دستگاه‌های خانه هوشمند را کنترل کنید، تماس‌های FaceTime برقرار و دریافت کنید، ویدیوها را تماشا کنید، اخبار و داده‌های آب را نمایش دهید و تقویم خود را بررسی کنید. البته، احتمالاً با Siri AI، دستیار جدید مبتنی بر هوش مصنوعی این شرکت کار خواهد کرد. حتی ممکن است اپل انتظار داشته باشد که کاربران بیش از یکی از این هاب ها را خریداری کنند. ایده می تواند داشتن هاب های متعدد در سرتاسر خانه باشد که به شما امکان می دهد از آن ها"}, {"source": "Lifehacker", "title": "These Are the Best Deals You Can Still Get on Smartwatches After October Prime Day", "link": "https://lifehacker.com/tech/last-minute-best-deals-on-smartwatches-october-prime-day-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Amazon's October Prime Day sale is over, but some good deals on smartwatches are still live, from traditional smartwatches like those from Apple, Google, and Samsung, as well as fitness-focused watches from companies like Garmin. Here are the best sales still active right now. The Apple Watch Series 12 is $50 off The Series 12 is the newest watch in Apple's lineup, and it's one that I think is definitely worth the upgrade . It's been on the market less than a month, but it's already on sale for $50 off its original price. The GPS-only model starts at $349.99 (normally $399) and the cellular model at $449.99 (normally $499). This is the watch with the new heart rate sensor, which I found to be very accurate , on par with the best Garmins. It also has step counts and recovery HRV, features that will unfortunately not be coming to the Series 11 or earlier. Apple Watch Series 12 (42mm) $34 out tracking. (Add my standard disclaimer that rings are never good workout trackers .) In any case, the Gen 2 Air is on sale right now. This is a pared-down version of the Gen 2 ring, but honestly, you don't lose much just sleep apnea monitoring and a few days of battery life. That still leaves the Air with a 10-day battery life, so it's a tradeoff that's well worth it if you want an affordable smart ring. RingConn Gen 2 Air (Size 8, Dune Gold) $159.20 at Amazon $199.00 Save $39.80 Get Deal Get Deal $159.20 at Amazon $199.00 Save $39.80 The Garmin Forerunner 165 is $50 off If you mainly want a general fitness tracker during the day, but would appreciate a precise and full-featured watch for workouts, something on the lower end of the Forerunner line can do both at a good price. Right now, the Forerunner 165 is $199.99 , down from $249.99. This is an entry-level Forerunner from the previous generation (they're up to the 170 now), but I wouldn't call it out of date. Garmins age well, and the 165 is a solid pick that will give you many years of use. Garmin Forerunner 165 $199.99 at Amazon $249.99 Save $50.00 Get Deal Get Deal $199.99 at Amazon $249.99 Save $50.00 The Polar Loop smart band is $30 off Polar makes a screen-free smart band called the Loop that normally retails for $199.99, but right now it's on sale for $169.99 (and some colors are $161.99). The Polar Loop looks like a slightly more stylish Whoop. In my testing , I enjoyed the physical design, but was underwhelmed by the app (it's pretty barebones). Still, it has no subscription, and may be just the minimalist tracker you're looking for. Polar Loop $169.99 at Amazon $199.99 Save $30.00 Get Deal Get Deal $169.99 at Amazon $199.99 Save $30.00 The Fitbit Charge 6 is $26 off Fitbit's Charge 6 normally retails for $159.99, but right now it's on sale for $133.49. Or som", "date_str": "2026-10-08T16:50:31+00:00", "hash": "41c700029d5e7de7", "title_fa": "این تخفیف‌های ردیاب تناسب اندام پس از روز اول اکتبر همچنان فعال هستند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. روز اول اکتبر به طور رسمی به پایان رسیده است، اما برخی از معاملات همچنان ادامه دارند. بیشتر معاملاتی که دیروز پوشش دادم هنوز فعال هستند، از جمله روی یکی از ارزان‌ترین حلقه‌های هوشمند خوب که احتمالاً پیدا می‌کنید، و همچنین چندین معامله در Garmins، و حتی یک یا دو Fitbit. حلقه هوشمند RingConn Gen 2 Air با قیمت 159.20 دلار RingConn برخی از حلقه های هوشمند بدون اشتراک بهتر را در بازار تولید می کند. من حلقه‌های Gen 2 و Gen 3 را آزمایش کردم و متوجه شدم که آنها در ردیابی خواب و سبک زندگی بسیار خوب هستند، اگرچه همیشه در ردیابی تمرینات عالی نیستند. (سلب مسئولیت استاندارد من را اضافه کنید که حلقه ها هرگز ردیاب های تمرین خوبی نیستند.) در هر صورت، Gen 2 Air در حال حاضر در فروش است. این یک نسخه کاهش‌یافته از حلقه Gen 2 است، اما صادقانه بگوییم، فقط نظارت بر آپنه خواب و چند روز عمر باتری چیز زیادی از دست نمی‌دهید. این همچنان عمر باتری 10 روزه را برای Air باقی می‌گذارد، بنابراین اگر یک حلقه هوشمند مقرون‌به‌صرفه می‌خواهید، ارزش آن را دارد. RingConn Gen 2 Air (Size 8, Dune Gold) 159.20 دلار در آمازون 199.00 دلار صرفه جویی 39.80 دلار دریافت معامله دریافت معامله 159.20 دلار در آمازون 199.00 دلار صرفه جویی 39.80 دلار Garmin Forerunner 165 50 دلار تخفیف دارد. تمرینات، چیزی در انتهای پایین خط Forerunner می تواند هر دو را با قیمت مناسب انجام دهد. در حال حاضر، Forerunner 165 199.99 دلار است که از 249.99 دلار کاهش یافته است. این یک Forerunner سطح پایه از نسل قبلی است (الان تا 170 هستند)، اما من آن را قدیمی نمی‌دانم. گارمین"}, {"source": "Lifehacker", "title": "These Heart Rate Monitors Are Still on Sale After Prime Day", "link": "https://lifehacker.com/health/best-last-minute-deals-on-chest-straps-october-prime-day-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. The heart rate sensors on smartwatches are usually good enough for casual training (and some of them are really good ), but to get the best possible accuracy, you want a separate heart rate monitor ideally a chest strap . Fortunately, these wearables are still on sale even after the end of October Prime Day. Heart rate monitors from Polar, Coospo, and more were available at discounts, and two of my favorite models are still discounted. The Polar H10 chest strap is $20 off All electrical chest straps are good, but the consensus in the fitness world is that if you want the best, you get the Polar H10. It s the chest strap that Apple used in its own heart-rate accuracy testing; it s also the one I recall being put on me when I did a VO2max test in a lab. It retails for $104.95 but goes on sale from time to time, and now is one of those times: You can pick up a Polar H10 for $84.74 . Polar H10 Heart Rate Monitor $84.74 at Amazon $104.95 Save $20.21 Get Deal Get Deal $84.74 at Amazon $104.95 Save $20.21 My favorite budget brand, Coospo, is 29% off I love when a budget option works as well as the top-of-the-line model, and that s why I swear by my Coospo heart rate monitor. Full disclosure, the H6 model I used for over four years finally gave up its ghost, so I ve moved on to a newer model, the H808S . Both are on sale: the H6 for $23.99, down from $29.99, and the H808S is $26.26, down from $36.99. COOSPO Bluetooth Heart Rate Monitor Chest Strap H808S, ANT+ BLE HR Monitor Chest, HRM IP67 Waterproof, Use for Running Cycling Gym and Other Sports $26.26 at Amazon $36.99 Save $10.73 Get Deal Get Deal $26.26 at Amazon $36.99 Save $10.73 How to use a heart rate monitor Heart rate monitors connect to your watch or to gym equipment wirelessly, usually with Bluetooth and sometimes with an older protocol called ANT+. (Many heart rate monitors can do both.) You ll need to set up the heart rate monitor to either broadcast your heart rate or to pair to another device. (Usually you broadcast to gym equipment, but pair to a watch or phone.) The specifics vary by brand, but it s usually pretty straightforward. If you have a fitness watch like a Garmin, an Apple Watch, or a Samsung Galaxy Watch, pairing a chest strap is a simple job. Pixel Watches, unfortunately, can t pair a heart rate sensor. But even without a watch, you can use a sensor with your phone", "date_str": "2026-10-08T16:47:11+00:00", "hash": "4489247fb06768a9", "title_fa": "این مانیتورهای ضربان قلب هنوز هم پس از پرایم روز به فروش می‌رسند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. سنسورهای ضربان قلب در ساعت‌های هوشمند معمولاً برای تمرین‌های معمولی به اندازه کافی خوب هستند (و برخی از آنها واقعاً خوب هستند)، اما برای به دست آوردن بهترین دقت ممکن، یک مانیتور ضربان قلب جداگانه می‌خواهید که در حالت ایده‌آل یک بند سینه است. خوشبختانه، این گجت‌های پوشیدنی حتی پس از پایان روز اول اکتبر همچنان در فروش هستند. مانیتورهای ضربان قلب از Polar، Coospo و غیره با تخفیف در دسترس بودند و دو مدل مورد علاقه من هنوز تخفیف دارند. بند سینه Polar H10 با 20 دلار تخفیف تمام تسمه های سینه الکتریکی خوب هستند، اما اتفاق نظر در دنیای تناسب اندام این است که اگر بهترین ها را می خواهید، Polar H10 را دریافت می کنید. این بند قفسه سینه ای است که اپل در تست دقت ضربان قلب خود استفاده کرده است. این همان چیزی است که به یاد می‌آورم وقتی آزمایش VO2max را در آزمایشگاه انجام دادم روی من گذاشته شد. این دستگاه با قیمت 104.95 دلار به فروش می رسد، اما هر از چند گاهی به فروش می رسد، و اکنون یکی از آن زمان هاست: می توانید یک Polar H10 را با قیمت 84.74 دلار خریداری کنید. نمایشگر ضربان قلب Polar H10 84.74 دلار در آمازون 104.95 دلار صرفه جویی 20.21 دلار دریافت معامله دریافت معامله 84.74 دلار در آمازون 104.95 دلار صرفه جویی 20.21 دلار. نام تجاری محبوب من، Coospo، 29 درصد تخفیف دارد. افشای کامل، مدل H6 که من بیش از چهار سال استفاده می‌کردم، سرانجام روح خود را از دست داد، بنابراین من به سراغ مدل جدیدتر، H808S رفتم. هر دو در فروش هستند: H6 با قیمت 23.99 دلار که از 29.99 دلار کاهش یافته است"}, {"source": "Lifehacker", "title": "You Can Still Save 19% on the Galaxy Z Fold Ultra After October Prime Day", "link": "https://lifehacker.com/tech/galaxy-z-fold-ultra-last-minute-october-prime-day-2026?utm_medium=RSS", "summary": "Samsung's Galaxy Z Fold series is excellent, and its devices are perhaps the best foldable smartphones you can buy. (Though we'll see if the iPhone Duo stacks up later this month.) The very best of these devices, the Galaxy Z Fold Ultra , comes with everything Samsung has to offer in a folding smartphone, which doesn't come cheap. Samsung lists this device at $2,099.99, which could buy you two or three laptops, let alone one foldable. But during the even after October Prime Day , you can save 19% on this device and take advantage of big discounts on Samsung's other foldables. Samsung Galaxy Z Fold 8 Ultra $1,699.99 at Amazon $2,099.99 Save $400.00 Get Deal Get Deal $1,699.99 at Amazon $2,099.99 Save $400.00 When closed, the Galaxy Z Fold 8 Ultra has a 6.5-inch 1080p display, perfectly usable as a typical smartphone experience. But once opened, you get an eight-inch 120Hz display with a much higher resolution of 2256 by 2504, effectively turning the Z Fold 8 Ultra into a small tablet. It comes with the same Snapdragon 8 Elite Gen 5 chip as the Galaxy S26 line, which means performance is on par with Samsung's flagship smartphone lineup. You also get some of the benefits of the S26 Ultra's cameras: The Z Fold 8 Ultra has a 200MP wide lens, a 10MP telephoto lens, and a 50MP ultrawide lens. And since this is a foldable phone, you also get two selfie cameras: One 10MP ultrawide on the inside, and one 10MP side on the outer display. Amazon's deal on the Z Fold 8 Ultra is great, but it's still expensive. You save $415, but you still need to put down $1,684.99. Alternatively, you could take advantage of Amazon's deal on the Galaxy Z Fold 8 . This device is 18% off, down to $1,549.99 from $1,899.99. This is Samsung's \"passport-shaped\" foldable, with a smaller 5.5-inc  Exynos 2500 chip, and 8GB of RAM with either 128GB or 256GB of storage. Samsung's standard S26 is probably the best balance for most people. It offers a smaller 6.3-inch AMOLED display with three rear cameras: 50MP, a 12MP ultrawide, and a 10MP telephoto lens, with a 12MP selfie camera. Crucially, with the S26 you get the Snapdragon 8 Elite Gen 5 chip, which offers better performance than the Exynos 2500. The smaller footprint gets a 4300mAh battery, with 12GB of RAM. While this model does come in 256GB, only the 512GB model is discounted, which is the case for the other phones here. For the S26's features with the FE's larger display, go with the Galaxy S26+. This option comes with a 6.7-inch AMOLED display, with a higher resolution than either of the previous devices. The rest of the features are the same, however, minus the 4900mAh battery. But for the best Samsung has to offer, choose the Galaxy S26 Ultra . This option comes with Samsung's biggest and best display, a 6.9-inch AMOLED with the same solution as the Galaxy S26+. It has Samsung's best cameras, too: a 200MP wide lens, a 10MP telephoto lens, a 5", "date_str": "2026-10-08T15:06:54+00:00", "hash": "dbf8bd8ac5af7939", "title_fa": "کل مجموعه گلکسی اس 26 سامسونگ پس از روز اول اکتبر همچنان در فروش است", "summary_fa": "ارزان ترین این دسته گلکسی S26 FE است. این مدل «بودجه» سری گلکسی S26 است، اما هنوز هم در نوع خود یک گوشی عالی است. این گوشی دارای صفحه نمایش 6.7 اینچی AMOLED با سه دوربین پشتی است: 50 مگاپیکسل عریض، 12 مگاپیکسل اولترا واید و 8 مگاپیکسل تله فوتو. (دوربین سلفی 12 مگاپیکسلی نیز دریافت می کنید.) باتری 4900 میلی آمپر ساعتی، تراشه اگزینوس 2500 و 8 گیگابایت رم با 128 یا 256 گیگابایت حافظه داخلی دارد. S26 استاندارد سامسونگ احتمالا بهترین تعادل برای اکثر مردم است. صفحه نمایش 6.3 اینچی AMOLED کوچکتر با سه دوربین پشتی: 50 مگاپیکسلی، 12 مگاپیکسلی فوق عریض و لنز تله فوتو 10 مگاپیکسلی با دوربین سلفی 12 مگاپیکسلی را ارائه می دهد. نکته مهم این است که با S26 شما تراشه Snapdragon 8 Elite Gen 5 را دریافت می کنید u can take $70 off the AirPods Pro 3, bringing the price down to $179. That's $10 more than the all-time low of $169 they hit back in June. AirPods Pro 3 $199.00 at Amazon $249.00 Save $50.00 Get Deal Get Deal $199.00 at Amazon $249.00 Save $50.00 The new AirPods 5 may come with Active Noise Cancellation, but it's not quite as good as that on the AirPods Pro 3. According to Apple, the Pros can cancel sound up to three times more effectively than AirPods 5, which makes them the better choice for noisy environments like airplanes. Part of that may be due to the seal created by the Pros' silicone ear tips. While some prefer the one-size-fits-all approach of the AirPods 5, AirPods Pro 3 come with different-sized tips, so you can choose the size that fits your ears best. Another \"Pro\" feature is the built-in heart rate sensor. If you don't have a fitness tracker , or just want to leave it at home, you can use your AirPods to keep tabs on your heart rate during workouts. While you shouldn't go swimming with them, the Pros are IP57 rated against dust and water, so working out in the rain shouldn't be a problem. The Pros are also the only AirPods in Apple's lineup that are FDA-certified hearing aids. As part of that feature, you can take a hearing test with the AirPods Pro to learn more about your personal hearing health. In addition, the Pros come with hearing protection features, which can help block out loud sounds that might otherwise damage your hearing. AirPods Pro 3 also come with Adaptive Audio, which automatically blends Transparency and Active Noise Cancellation based on how loud or quiet your environment is. There's also Conversation Awareness, which automatically lowers the volume of your audio when you start speaking. A few seconds after you stop speaking, your AirPods will bring your audio back up again. Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $199.00 (List Price $249.00) Ring Indoor Cam Plus", "date_str": "2026-10-08T15:00:58+00:00" ro is so expensive. Apple saves its most premium features for this product line mini-LED displays, built-in fans, HDMI and SD ports, and, depending on the model, the most powerful chips. None of these comes cheap, and, after recent RAM-related price hikes, the MacBook Pro now starts at a steep $1,999. That's not the case following October Prime Day , however: Right now, you can take a decent chunk off many MacBook Pro models, and even more if you opt for one of Apple's M5 Pro or M5 Pro Max devices. You can save $160 on the M5 MacBook Pro Let's start with the standard M5 MacBook Pro . This uses a similar M5 chip to the one found in the MacBook Air, though the Pro does come with 10 GPU cores (that costs extra on the Air). Other than that, these are the same processors, running the same 16GB of RAM though the M5 MacBook Pro comes with 1TB of storage standard. You also get most of the hardware perks of the other MacBook Pro devices, without venturing into $2,499 and up territory, including three USB-C ports, the HDMI and SD card ports, a 14.2-inch mini-LED display, and a 12MP FaceTime camera. Typically, that'd cost you $1,999. But on Amazon, you can pick this machine up today for $1,869. M5 MacBook Pro (14-inch) $1,599.00 at Best Buy Get Deal Get Deal $1,599.00 at Best Buy Save $155 on the 14-inch M5 Pro MacBook Pro This is a great price for this MacBook, but it's not the only savings you'll find on MacBook Pros this October Prime Day. If you upgrade to the M5 Pro MacBook Pro , you can save $155 off its retail price, bringing the machine down to $2,345 from $2,499. With this laptop, you get all the perks of the M5 MacBook Pro, but with the M5 Pro chip, which is much more powerful. This chip comes with a 15-core CPU and 16-core GPU, along with 24GB of RAM and a 1TB SSD. It also supports Wi-Fi 7, while the M5 MacBook Pro only supports Wi-Fi 6E. M5 Pro MacBook Pro $2,339.00 at Amazon $2,499.00 Save $160.00 Get Deal Get Deal $2,339.00 at Amazon $2,499.00 Save $160.00 Amazon  clock. This MacBook Air comes with a 13.6-inch display (Apple calls it the \"13-inch\" for marketing purposes), with a resolution of 2560 by 1664 and a maximum brightness of 500 nits. You get the M5 chip, which, according to Geekbench, outperforms the MacBook Neo's A18 Pro by nearly 22% in single-core tasks and 134% in multi-core tasks. That extra $400 isn't just going towards an \"Apple tax,\" as you'll notice real-world performance increases for your money. You'll also get a 12MP Center Stage camera for video conferencing and FaceTime calls, Touch ID built into the keyboard, and support for MagSafe charging though you can also charge using either of the two USB 4 ports. Importantly, this model comes with 16GB of RAM and 512GB of storage. That should be plenty for most users, but Amazon is ", "date_str": "2026-10-08T14:53:16+00:00", "hash": "7bc6f2fd233a7ae8", "title_fa": "شما می توانید یک مک بوک ایر را با قیمتی که قبل از بحران رم دارد تهیه کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اگر یکی از مک‌بوک‌های M5 اپل را در زمان عرضه بخرید، برای مدل پایه آن 1099 دلار هزینه داشتید. سپس، بحران حافظه عوارض خود را گرفت و ناگهان، همان دستگاه بدون هیچ ویژگی یا تغییر جدیدی، قیمت آن 200 دلار افزایش یافت. مک بوک ایر که سال ها از 999 دلار شروع شده و با M5 به 1099 دلار رسیده است (در حالی که حداقل فضای ذخیره سازی بیشتری به شما می دهد)، اکنون از 1299 دلار شروع می شود. اگر فضای ذخیره‌سازی بیشتری می‌خواهید یا می‌خواهید به مدل 15 اینچی ارتقا دهید، فقط هزینه بیشتری برای شما خواهد داشت. این قیمت ها فقط مشتریان را به سمت مک بوک نئو ارزان قیمت اپل سوق می دهد. این لزوما چیز بدی نیست: Neo با اکثر ویژگی‌هایی که مردم در لپ‌تاپ اپل به دنبال آن هستند، با تقریباً نصف هزینه مک‌بوک ایر ارائه می‌شود. اما اینها ماشینهای یکسان نیستند. کاربرانی که Neo over the Air را انتخاب می کنند، نمایشگر بزرگتر و با کیفیت بالاتر را از دست می دهند. یک پردازنده ساخته شده برای macOS؛ صفحه کلید با نور پس زمینه؛ و شارژ MagSafe، فقط برای نام بردن چند امتیاز. همه اینها ویژگی های عالی هستند، اما توجیه 600 دلار اضافی دشوار است. اما اگر بتوانید 200 دلار پس انداز کنید چه؟ این باعث می شود که این امتیازات کمی ارزش ارتقاء را داشته باشند. M5 MacBook Air (13 اینچی) 1,099 دلار در آمازون 1,299 دلار صرفه جویی 200 دلاری دریافت معامله دریافت معامله 1,099 دلار در آمازون 1,299 دلار صرفه جویی 200 دلاری صرفه جویی 200 دلاری حتی با وجود اینکه اکتبر Prime Day به پایان رسیده است، آمازون معامله بسیار خوبی را در"}],
      media: [{"source": "Billboard", "title": "Tito Double P Suspends La People Tour Stadium Dates in Mexico — Natanael Cano Does the Same", "link": "https://www.billboard.com/music/latin/tito-double-p-natanael-cano-postpone-tours-mexico-1236357900/", "summary": "Tito Double P suspended the remaining dates of his La People Tour in Mexico “until further notice,” according to a statement posted to his Instagram account Wednesday (Oct. 7). One day later, Natanael Cano announced that he would also postpone the rest of his Natanael Cano Vol. 1 Tour to focus on “his health and well-being.” Related Natanael Cano Postpones Remaining Mexico Stadium Tour Dates to ‘Focus on His Health Well-Being’ Tito Double P, Ozuna, Pablo Alborán, Kapo More to Perform at 2026 Billboard Latin Music Awards Tito Double P Makes Billboard Album Charts Debut With ‘Incómodo : ‘Wow, I’m So Honored The back-to-back announcements affect two of the biggest tours from the new generation of música Mexicana. Tito and Cano are frequent collaborators and central figures in the corridos tumbados movement; they recently joined Ovi and Víctor Mendívil on “Olivia La Flaca,” which was released Sept. 24. “We regret to inform you that, for reasons beyond the artist’s and his team’s control, the announced dates for La People Tour will be suspended until further notice,” Tito’s team said in its statement in Spanish. It noted that tickets will be refunded through the authorized points of purchase. The tour was scheduled to visit cities including Puebla (Oct. 30), Monterrey (Oct. 31), Aguascalientes (Nov. 14), León (Nov. 21), Chihuahua (Nov. 26), Mérida (Dec. 3) and Guadalajara (Jan. 30, 2027). The statement did not specify whether the suspension affects other previously announced appearances, including Tito’s participation in Coca-Cola Flow Fest. After the announcement, a fan asked on Instagram whether he would still appear at the festival, to which Tito replied, “God willing, I’ll see you there.” On Thursday (Oct. 8), Cano’s team provided Billboard Español with a statement announcing the postponement of the remaining dates of his stadium tour in Mexico: “After careful consideration, Natanael Cano is postponing the remaining dates of the Natanael Cano Vol. 1 tour to focus on his health and well-being.” The announcements come at a moment of major visibility for both artists. Cano’s latest album, Natanael Cano, Vol. 1 , debuted at No. 4 on Top Regional Mexican Albums and No. 10 on Top Latin Albums. Tito, meanwhile, continues to build his solo career with his latest album, Acomodo , which debuted at No. 3 on Top Latin Albums , No. 1 Top Regional Mexican Albums June 13, as well as No. 41 on the all-genre Billboard 200 . Tito Double P is confirmed to perform at the 2026 ", "date_str": "2026-10-09T14:26:57+00:00", "hash": "b267564422e94f18", "title_fa": "Tito Double P تاریخ بازدید از استادیوم La People را در مکزیک به حالت تعلیق درآورد - Natanael Cano نیز همین کار را می کند", "summary_fa": "طبق بیانیه ای که چهارشنبه (7 اکتبر) در حساب اینستاگرام خود منتشر شد، تیتو دابل پی تاریخ های باقی مانده از تور La People خود در مکزیک را \"تا اطلاع ثانوی\" به حالت تعلیق درآورد. یک روز بعد، ناتانائل کانو اعلام کرد که بقیه آثار Natanael Cano Vol خود را نیز به تعویق خواهد انداخت. 1 تور برای تمرکز بر \"سلامت و رفاه او\". ناتانائل کانو تاریخ‌های باقی مانده در استادیوم مکزیک را به تعویق انداخت تا روی سلامتی او تمرکز کند. تیتو دابل پی، اوزونا، پابلو آلبوران، کاپو مور در جوایز موسیقی لاتین بیلبورد در سال 2026 اجرا می‌کنند. بزرگترین تورهای نسل جدید موسیقی مکزیک. تیتو و کانو از همکاران و چهره های اصلی جنبش کوریدوس تومبادو هستند. آنها اخیراً به Ovi و Victor Mendivil در \"Olivia La Flaca\" ملحق شدند که در 24 سپتامبر منتشر شد. تیم تیتو در بیانیه خود به زبان اسپانیایی گفت: \"ما متأسفیم به اطلاع شما می‌رسانیم که به دلایلی خارج از کنترل هنرمند و تیمش، تاریخ‌های اعلام شده برای تور La People تا اطلاع ثانوی به حالت تعلیق در می‌آیند.\" وی خاطرنشان کرد که هزینه بلیط از طریق مراکز خرید مجاز مسترد خواهد شد. این تور قرار بود از شهرهایی مانند پوئبلا (30 اکتبر)، مونتری (31 اکتبر)، آگواسکالینتس (14 نوامبر)، لئون (21 نوامبر)، چیهواهوا (26 نوامبر)، مریدا (3 دسامبر) و گوادالاخارا (30، 20 ژانویه) بازدید کند. در این بیانیه مشخص نشده است که آیا این تعلیق بر سایر ظاهرهای اعلام شده قبلی، از جمله شرکت تیتو در جشنواره کوکاکولا فلو فست تأثیر می گذارد یا خیر. پس از اعلام این خبر، یکی از طرفداران در اینستاگرام پرسید که آیا او همچنان در جشنواره حضور خواهد داشت یا خیر، که تیتو پاسخ داد: \"انشالله من شما را آنجا خواهم دید.\" روز پنجشنبه (۸ اکتبر)، تیم کانو بیانیه‌ای را در اختیار بیلبورد اسپانیا قرار داد"}, {"source": "Billboard", "title": "Fuerza Regida Talk Street Mob Records, A&R & Their Stadium Tour | Billboard Cover Interview", "link": "https://www.billboard.com/video/fuerza-regida-billboard-cover-interview/", "summary": "In this Billboard Cover Interview Fuerza Regida’s JOP opens up about Street Mob Records and why he signs artists he wants to be “bigger than me.” In this Billboard Cover Interview, Fuerza Regida breaks down the business, the vision, and the “2032” mindset behind their stadium-level era. JOP talks about balancing being the frontman of one of música mexicana’s biggest groups while also running Street Mob as an executive and how he switches between “artist mode” and “CEO mode.” He explains how Street Mob grew from a small team into a real label structure, what he looks for when signing new talent, and how he discovers artists online. Plus, the group talks tour highlights, the concept behind their time-travel show, and what “2032” means to Fuerza Regida as they keep leveling up. Jesús Ortíz Paz I wanna tell all my artists and everybody, like, if, if I ma sign somebody it s because I want you to be bigger than me. Isabela Raygoza Hey, JOP. We are here in New York City in this incredible structure called The Vessel, here in the East Coast. What does it mean to you to be here in the East Coast, and what does this all mean? How do you perceive this? Jesús Ortíz Paz No, I think it s cool. I heard we re the first ones to shoot here, so that s cool, you know? It s a nice structure.I like the architect who worked on it. It s, it s real, it s real futuristic. It s what we re on right now. On, on our 2032 vibe. Isabela Raygoza And how about the East Coast, here in New York City? Jesús Ortíz Paz Uh, I love the East Coast. Isabela Raygoza Yeah. Jesús Ortíz Paz I love all the culture in the East Coast. Isabela Raygoza Yeah. Jesús Ortíz Paz But, you know, I m, I, I m from the West Coast, you know? Isabela Raygoza Okay. So you re not gonna relocate anytime soon here to the East Coast. Watch the full video above!", "date_str": "2026-10-09T14:08:31+00:00", "hash": "f263337eb7e98f79", "title_fa": "Fuerza Regida Talk Street Mob Records، A&R و تور استادیوم آنها | مصاحبه جلد بیلبورد", "summary_fa": "در این مصاحبه با جلد بیلبورد، Jop Fuerza Regida درباره Street Mob Records و اینکه چرا او با هنرمندانی که می‌خواهد «بزرگ‌تر از من» باشند، قرارداد امضا می‌کند. در این مصاحبه با جلد بیلبورد، Fuerza Regida کسب‌وکار، چشم‌انداز و طرز فکر «2032» را که در دوران استادیوم‌شان وجود دارد، تجزیه می‌کند. JOP در مورد تعادل بودن رهبر یکی از بزرگ‌ترین گروه‌های موسیقی مکزیکی صحبت می‌کند و در عین حال Street Mob را به‌عنوان مدیر اجرایی می‌کند و اینکه چگونه بین «حالت هنرمند» و «حالت مدیر عامل» تغییر می‌کند. او توضیح می دهد که چگونه استریت موب از یک تیم کوچک به یک ساختار برچسب واقعی تبدیل شد، در هنگام امضای قرارداد با استعدادهای جدید به دنبال چه چیزی می گردد و چگونه هنرمندان را به صورت آنلاین کشف می کند. به‌علاوه، نکات مهم تور گفتگوی گروه، مفهومی که در پس برنامه سفر در زمان آن‌ها وجود دارد، و معنای «2032» برای Fuerza Regida در حالی که آنها در حال بالا رفتن هستند. خسوس اورتیز پاز می‌خواهم به همه هنرمندانم و همه بگویم، مثلاً اگر قرار است با کسی امضا کنم، به این دلیل است که می‌خواهم شما بزرگ‌تر از من باشید. ایزابلا رایگوزا هی، JOP. ما اینجا در شهر نیویورک در این سازه باورنکردنی به نام کشتی، اینجا در ساحل شرقی هستیم. بودن اینجا در ساحل شرقی برای شما چه معنایی دارد و همه اینها چه معنایی دارد؟ این را چگونه درک می کنید؟ خسوس اورتیز پاز نه، فکر می کنم عالی است. من شنیدم که ما اولین کسانی هستیم که اینجا شلیک می کنیم، خوب است، می دانید؟ این سازه خوبی است. من از معماری که روی آن کار کرده است خوشم می آید. این واقعی است، آینده نگر واقعی است. این همان چیزی است که ما در حال حاضر روی آن هستیم. روشن، در حال و هوای 2032"}, {"source": "Billboard", "title": "Fuerza Regida: Photos From the Billboard Cover Shoot", "link": "https://www.billboard.com/photos/fuerza-regida-photos-billboard-cover-shoot-1236355116/", "summary": "On a humid August afternoon, as storm clouds threaten, a quintet of guys who look like they just stepped out of The Matrix approaches the Vessel, the spiraling steel structure in Manhattan’s Hudson Yards. Against the backdrop of its blue lights and fire-red central glow, they pose — in their black leather, coordinated metallic accessories, slicked-back hair, dark shades and Mexican cowboy boots — with dead-serious expressions. It’s pure Fuerza Regida — the música mexicana band from San Bernardino, Calif., known for stretching the boundaries of corridos tumbados with the bravado of SoCal gangster rap and, occasionally, club-oriented experimentation. The group’s charismatic singer, Jesús Ortiz Paz, better known as JOP, looks up at the Vessel’s futuristic geometry approvingly. “It’s what we’re on right now,” he says. The Vessel is also a fitting representation of Fuerza’s next era — its upcoming album, which its team will only say is coming soon, is rumored to be titled 2032 — and its most consequential expansion yet. The band has just completed its first U.S. stadium tour, a run that grossed $53.2 million and moved 369,000 tickets across nine sold-out shows, according to Billboard Boxscore. Read the full Fuerza Regida Billboard cover story here. The música mexicana band is set to headline a Superstar Q A at Billboard Latin Music Week 2026. Billboard Latin Music Week runs from Oct. 19-22 at Miami’s Faena Forum Miami Beach; registration is open now .", "date_str": "2026-10-09T13:58:25+00:00", "hash": "7dadb6848cf34f06", "title_fa": "Fuerza Regida: عکس هایی از تصویر جلد بیلبورد", "summary_fa": "در یک بعد از ظهر مرطوب اوت، در حالی که ابرهای طوفانی تهدید می‌کنند، گروهی از افراد که انگار تازه از ماتریکس خارج شده‌اند، به کشتی نزدیک می‌شوند، سازه فولادی مارپیچی در یارد هادسون منهتن. در پس زمینه نورهای آبی و درخشش مرکزی قرمز آتشین آن، آنها - با چرم مشکی، اکسسوری‌های فلزی هماهنگ، موهای صاف، سایه‌های تیره و چکمه‌های کابویی مکزیکی - با حالت‌های بسیار جدی ژست می‌گیرند. این Fuerza Regida ناب است - گروه موسیقی مکزیکی از سن برناردینو، کالیفرنیا، که به دلیل گسترش مرزهای کوریدوس تومبادو با جسارت رپ گانگستری SoCal و گاهی اوقات، آزمایش‌های کلوپ‌گرا شناخته شده است. ژسوس اورتیز پاز، خواننده کاریزماتیک گروه، که بیشتر با نام JOP شناخته می‌شود، هندسه آینده‌نگر کشتی را با تأیید می‌بیند. او می گوید: «این چیزی است که ما در حال حاضر در آن هستیم. The Vessel همچنین نمایش مناسبی از دوره بعدی Fuerza است - آلبوم آتی آن، که تیمش فقط می گوید به زودی منتشر می شود، شایعه شده است که عنوان آن 2032 خواهد بود - و پیامدترین گسترش آن تاکنون. طبق بیلبورد باکس اسکور، گروه به تازگی اولین تور خود در استادیوم ایالات متحده را به پایان رسانده است، دوره ای که 53.2 میلیون دلار فروش داشت و 369000 بلیت در 9 نمایش فروخته شده به فروش رسید. داستان کامل جلد بیلبورد Fuerza Regida را اینجا بخوانید. گروه música mexicana قرار است در هفته موسیقی لاتین بیلبورد 2026 تیتر یک سوپراستار Q A باشد. ثبت نام در حال حاضر باز است. از چپ: Mois s L pez، Samuel J imez، Khrystian Ramos، Jose Garc a و JOP. از چپ: جیمز، راموس، JOP، گارسیا و لوپز. طراحی توسط IMAGiNE. نظافت توسط آدری گیلهولی. Fuerza Regida لباس 424، Campillo، Rick Owens و Vetements."}, {"source": "Billboard", "title": "Skillet’s John Cooper Talks Split With Former Church: ‘I Am Not Doubting My Faith — But I’m Like, ‘Man, How Can People Hurt Each Other This Bad?”", "link": "https://www.billboard.com/music/rock/skillet-john-cooper-new-ep-after-the-storm-1236357571/", "summary": "As Skillet celebrates its 30 th anniversary this month, the Christian rock band is dropping one of the most vulnerable, angst-ridden collections of its storied career. After a tumultuous season in frontman John Cooper’s life, Skillet has emerged with the appropriately named After the Storm, a six-song EP out Friday (Oct. 9) that takes an unflinching look at hurt and betrayal, yet continues to serve up a message of hope that has become the band’s signature. “We definitely have talked a lot about mental health and depression in our past. This EP has a lot more of that,” Cooper says. “[The songs] are honest about the hurt and the difficulties of life and the ups and downs, but there is hope. Even the title, After the Storm , gives you hope: ‘Okay, I’m still here.’” Skillet members Cooper (lead vocals, bass), his wife Korey (guitar, keys), Jen Ledger (drums, vocals) and Seth Morrison (lead guitar) have built a successful career in mainstream rock while continuing to grow their fan base in Christian music. They have been certified for moving 30 million equivalent albums by the RIAA, and the band s seven-times platinum 2009 hit “Monster” has surpassed five billion global streams, while becoming the first Christian song to surpass a billion streams on Spotify, according to the streamer. Following an international run, Skillet is on tour in the U.S. through Nov. 10 on their Comatose 20 Years, Still Screaming Tour — in celebration of the band’s landmark 2006 album Comatose , which Cooper credits with “changing the trajectory” of the band’s career. Obviously, career success doesn’t make people immune from personal challenges — and After the Storm was inspired by Cooper’s fractured relationship with the church he and his family had helped build and had attended for years. “It was just a really tough couple of years seeing, I think, just some of the worst of Christianity,” he says. “Of course I’m still a Christian. I have my faith and am not doubting my faith or shaken in that way, but I’m like, ‘Man, how can people hurt each other this bad?’ . . . I just don’t understand it. But it’s not like God doesn’t know. It’s not like it’s a surprise to Him that you are angry and you’re not doing good, so tell Him and ask Him to help you. It was a real exercise of faith to me. God is my refuge and He is my strength and He’s not going to let me down.” Though Cooper declines to go into specifics about the situation at his church, he more broadly adds he feels there are church lea", "date_str": "2026-10-09T13:41:16+00:00", "hash": "0f29cea8b6b925f5", "title_fa": "صحبت های جان کوپر از اسکیلت با کلیسای سابق منشعب شد: \"من به ایمانم شک ندارم - اما مثل این هستم که \"ای مرد، مردم چگونه می توانند اینقدر به یکدیگر آسیب برسانند؟\"", "summary_fa": "در حالی که Skillet سی‌امین سالگرد خود را در این ماه جشن می‌گیرد، گروه راک مسیحی یکی از آسیب‌پذیرترین و پر اضطراب‌ترین مجموعه‌های حرفه‌ای خود را حذف می‌کند. پس از یک فصل پر فراز و نشیب در زندگی جان کوپر، خواننده اصلی، اسکیلت با نام مناسب After the Storm، یک EP شش آهنگی که جمعه (9 اکتبر) منتشر شد، ظاهر شد که نگاهی سرسختانه به آسیب و خیانت دارد، اما همچنان پیام امیدی را ارائه می دهد که به امضای گروه تبدیل شده است. کوپر می‌گوید: «ما قطعاً در گذشته درباره سلامت روان و افسردگی زیاد صحبت کرده‌ایم. «[آهنگ‌ها] صادقانه درباره آسیب‌ها و مشکلات زندگی و فراز و نشیب‌ها هستند، اما امیدی وجود دارد. حتی عنوان، پس از طوفان، به شما امیدواری می دهد: «خوب، من هنوز اینجا هستم.» اعضای Skillet، کوپر (خواننده اصلی، بیس)، همسرش کوری (گیتار، کلید)، جن لجر (درام، خواننده) و ست موریسون (گیتار اصلی) یک حرفه موفق در موسیقی جریان اصلی راک ایجاد کرده‌اند. طبق گفته استریمر، آنها برای جابجایی 30 میلیون آلبوم معادل توسط RIAA گواهینامه دریافت کرده اند و آهنگ هفت بار پلاتینیوم گروه \"Monster\" در سال 2009 از پنج میلیارد استریم جهانی فراتر رفت و در عین حال اولین آهنگ مسیحی شد که در Spotify از یک میلیارد استریم عبور کرد. پس از یک مسابقه بین المللی، Skillet تا نوامبر در ایالات متحده در تور است. 10 در تور Comatose 20 Years, Still Screaming - در جشن آلبوم برجسته گروه در سال 2006 Comatose که کوپر آن را با \"تغییر مسیر\" حرفه گروه می داند. بدیهی است که موفقیت شغلی افراد را از چالش‌های شخصی مصون نمی‌سازد - و پس از طوفان الهام‌گرفته از روابط گسسته کوپر با کلیسایی بود که او و خانواده‌اش در ساخت آن کمک کرده بودند و سال‌ها در آن شرکت کرده بودند."}, {"source": "Billboard", "title": "Earth, Wind & Fire Drummer John Paris Enters Rehab After Hospitalization", "link": "https://www.billboard.com/music/rb-hip-hop/earth-wind-fire-drummer-john-paris-enters-rehab-insurance-1236357876/", "summary": "Earth, Wind Fire drummer John Paris, 58, has been moved to a rehabilitation center after completing a two-month hospital stay. An update to a GoFundMe for the R B band s longtime timekeeper on Thursday (Oct. 8), revealed that, After more than two months in the hospital, we have wonderful news: John has left the hospital and begun the next phase of his recovery in rehabilitation. The note added, This is a milestone we have prayed for — but it is not the end of John s journey. In many ways, a new one is just beginning. Paris suffered an unspecified critical medical emergency on Aug. 6, just before EW F were scheduled to play a gig with co-headliner Lionel Richie in San Francisco. After two major surgeries, Paris was placed in a medically induced coma, which he woke from on Aug. 20 . Paris was then hospitalized for two months in San Francisco. In the GoFundMe update, the page s organizers noted that Paris was battling an unspecified spinal cord injury and that the musician did not have medical insurance when he suffered his medical emergency; though few details have emerged about the specifics of his health issue, the San Francisco Fire Department earlier confirmed that crews responded to a report of a cardiac incident at the venue and transported one person to a hospital in critical condition. John’s prolonged hospitalization, spinal cord injury, rehabilitation and continuing medical needs have created a financial situation far beyond what we anticipated when Standing With John began, the fundraiser update reported. [Wife] Kathy [Merrick] and John are pursuing every available source of assistance, including Medicare and workers’ compensation, but what ultimately will be covered remains unresolved. They added, Reaching rehabilitation is a victory. But John still has a long road ahead as he works toward regaining as much independence as possible and, ultimately, returning home. That’s why we’re beginning Phase Two of Standing With John. If you’ve already donated, you helped Kathy remain beside John during one of the hardest periods of their lives. You helped when they needed you. At press time, the fundraiser had brought in more than $101,000 of its $110,000 goal.", "date_str": "2026-10-09T12:58:56+00:00", "hash": "fcde6ce091c035ed", "title_fa": "جان پاریس درامر زمین، باد و آتش پس از بستری شدن در بیمارستان وارد مرکز توانبخشی می شود", "summary_fa": "جان پاریس 58 ساله، درامر Earth, Wind Fire، پس از گذراندن دو ماه بستری در بیمارستان به یک مرکز توانبخشی منتقل شد. به‌روزرسانی یک GoFundMe برای وقت‌نگار قدیمی گروه R B در روز پنجشنبه (8 اکتبر)، نشان داد که پس از بیش از دو ماه بستری شدن در بیمارستان، خبر فوق‌العاده‌ای داریم: جان بیمارستان را ترک کرده و مرحله بعدی بهبودی خود را در توانبخشی آغاز کرده است. یادداشت اضافه کرد: این نقطه عطفی است که ما برای آن دعا کرده ایم - اما پایان سفر جان نیست. از بسیاری جهات، یک مورد جدید تازه شروع شده است. پاریس در 6 آگوست، درست قبل از اینکه EW F با همکار لیونل ریچی در سانفرانسیسکو یک کنسرت برگزار کند، دچار یک اورژانس پزشکی وخیم نامشخص شد. پس از دو عمل جراحی بزرگ، پاریس در یک کما ناشی از پزشکی قرار گرفت که در 20 اوت از خواب بیدار شد. پاریس سپس به مدت دو ماه در بیمارستان سانفرانسیسکو بستری شد. در به‌روزرسانی GoFundMe، برگزارکنندگان صفحه اشاره کردند که پاریس با آسیب نخاعی نامشخصی دست و پنجه نرم می‌کرد و این نوازنده در زمان اورژانس پزشکی خود بیمه پزشکی نداشت. اگرچه جزئیات کمی در مورد جزئیات مشکل سلامتی وی منتشر شده است، اما سازمان آتش نشانی سانفرانسیسکو قبلاً تأیید کرد که خدمه به گزارش یک حادثه قلبی در محل مسابقه پاسخ دادند و یک نفر را در شرایط وخیم به بیمارستان منتقل کردند. به‌روزرسانی جمع‌آوری کمک مالی گزارش داد که بستری طولانی‌مدت جان، آسیب نخاعی، توانبخشی و نیازهای پزشکی مستمر، وضعیت مالی بسیار فراتر از آنچه در زمان شروع Standing With John پیش‌بینی می‌کردیم، ایجاد کرده است. [همسر] کتی [مریک] و جان به دنبال هر منبع کمکی در دسترس هستند، از جمله مدیکر و غرامت کارگران، اما آنچه در نهایت تحت پوشش قرار خواهد گرفت، حل نشده باقی مانده است. آنها افزودند،"}, {"source": "Billboard", "title": "Dolly Parton Makes Posthumous Appearance in Video At Awards Show Honoring Music Teachers: ‘Thank You For Your Passion’", "link": "https://www.billboard.com/music/country/dolly-parton-posthumous-video-cma-music-teachers-excellence-1236357873/", "summary": "Before her death at 80 in August, Dolly Parton recorded a special tribute to music teachers, and on Thursday (Oct. 8) the Country Music Association shared a clip of the moment introduced by Zac Brown in which the late country icon heaped praise on the instructors whose passion has inspired the next generation to pick up instruments. Related Cast of Dolly: A True Original Musical Broadway Production Revealed Performers Announced for CMA’s Dolly Parton Tribute Special Noah Kahan Reacts to First Kids Choice Award Nomination: Holy Sh I Finally Did It Not long before we lost her, Dolly recorded a special message for the teachers in this room, said Brown during Wednesday s (Oct. 7) ceremony for the Country Music Association Foundation s 10th annual Music Teachers of Excellence event, held at Parton s recently opened Nashville SongTeller Hotel. She took the time to speak directly to you and I can t think of a better way to begin this night. Parton, whose legacy includes an unparalleled catalog of classic country hits, was a lifelong advocate for literacy and education and Brown said her commitment to creating opportunities for others was part of the magic of her life. “Well, hey there, it s Dolly! And I am so happy to welcome you to Nashville as the CMA Foundation celebrates 10 years of Music Teachers of Excellence, Parton said brightly in the clip. I’ve always believed that music brings people together. But none of that happens without dedicated teachers who encourage, inspire and believe in the next generation. And that’s why we’re celebrating tonight. And to every music teacher of excellence, I want to thank you for your passion, patience and care that you give your students each day. Congratulations on this incredible milestone and keep making beautiful music together.” Among Parton s charitable efforts aimed at education was her Imagination Library, which has distributed more than 300 million books to children worldwide over the past 30 years. Parton died on Aug. 25 following what was described as short battle with cancer and the CMA teacher s award event marks the second posthumous video appearance from the beloved country legend. Last month, Parton made a surprise appearance at the 2026 Americana Awards and Honors at Ryman Auditorium in Nashville in a message taped before her death accepting the organization s Lifetime Achievement Award. I’m honored to be receiving a Lifetime Achievement Award from the Americana Music Association,” Parton said in the video", "date_str": "2026-10-09T12:25:09+00:00", "hash": "5961aff8deaaf0a7", "title_fa": "دالی پارتون پس از مرگ در ویدئویی در نمایش جوایز تجلیل از معلمان موسیقی ظاهر شد: \"از علاقه شما متشکرم\"", "summary_fa": "دالی پارتون قبل از مرگش در 80 سالگی در ماه اوت، ادای احترام ویژه‌ای به معلمان موسیقی ضبط کرد، و روز پنجشنبه (8 اکتبر) انجمن موسیقی کانتری کلیپی از لحظه معرفی زک براون را به اشتراک گذاشت که در آن نماد کانتری فقید، مدرسانی را که اشتیاق نسل بعدی برای برداشتن سازها الهام‌بخش است، تمجید کرد. بازیگران مرتبط Dolly: A True Original Musical Broadway Production مشخص شد اجراکنندگان برای ادای احترام دالی پارتون CMA معرفی شدند ویژه نوح کاهان به اولین نامزدی جایزه انتخاب بچه ها واکنش نشان می دهد: Holy Sh I در نهایت انجامش دادیم مدت زیادی قبل از اینکه او را از دست دادیم، دالی یک پیام ویژه برای معلمان در این اتاق ضبط کرد (براون در روز چهارشنبه در طول Oct. 7) مراسم دهمین رویداد سالانه معلمان عالی موسیقی بنیاد انجمن موسیقی کانتری، که در هتل نشویل SongTeller اخیراً افتتاح شده در پارتون برگزار شد. او وقت گذاشت و مستقیماً با شما صحبت کرد و من نمی توانم راه بهتری برای شروع این شب بیاندیشم. پارتون، که میراثش شامل فهرست بی‌نظیری از آثار کلاسیک کانتری است، یک حامی مادام العمر برای سوادآموزی و آموزش بود و براون گفت تعهد او به ایجاد فرصت‌هایی برای دیگران بخشی از جادوی زندگی او بود. پارتون به روشنی در این کلیپ گفت: \"خب، هی، دالی است! و من بسیار خوشحالم که به شما در نشویل خوش آمد می گویم، زیرا بنیاد CMA 10 سال از معلمان عالی موسیقی را جشن می گیرد. من همیشه معتقد بودم که موسیقی مردم را دور هم جمع می کند. اما هیچ کدام از اینها بدون معلمان متعهد که تشویق می کنند، الهام می گیرند و به این باور دارند که چرا نسل بعدی ما را تشویق می کنند، اتفاق نمی افتد. و از هر معلم برتر موسیقی، می خواهم از شما برای اشتیاق، صبر"}, {"source": "Billboard", "title": "Bad Bunny, Lana Del Rey (and Her Husband), Morgan Wallen, Robyn & Burna Boy to Host ‘Grand Theft Auto VI’ In-Game Radio Stations", "link": "https://www.billboard.com/culture/lifestyle/grand-theft-auto-vi-radio-station-hosts-bad-bunny-lana-del-rey-1236357868/", "summary": "Rockstar Games anticipated Grand Theft Auto VI is about a month away (Nov. 19) from dropping, but on Thursday (Oct. 8) it revealed the hosts for the six virtual in-game radio stations fans will be able to dial into while playing. Leading the pack is Cocoteo FM, a Latin music station hosted by Bad Bunny and fellow Puerto Rican singer RaiNao, who will take to the air under the names El Martillo and La Gata. Over on Back Country Radio, Lana Del Rey and Morgan Wallen will spin classic country and outlaw country tunes as MW and Delta Dawne, with help from roving reporter Mud Dog Mike (aka Del Rey s husband Jeremy Dufrene) giving all the pertinent updates from the game s Florida-like state, Leonida. Other stations include AfroBank FM, hosted by Nigerian star Burna Boy with DJ Palms Trax playing contemporary and classic African songs, pop station Flash FM, hosted by Robyn and model/actress Alex Consani, the hip-hop station Dirty South Classics hosted by Trick Daddy and Trina and a metal station called The Chamber 106.6 hosted by Slayer guitarist Kerry King and singer/bassist Tom Araya. You can learn more about the stations and hear previews here . The game s 34-track original soundtrack album is also on the way — dropping on Nov. 19 as well — with last month s six-song preview setting the stage with Yung Lean (ft. Metro Boomin and Future) offering up That s It, Travis Scott s RHYNO (produced by Daft Punk s Guy-Manuel de Homem-Christo) and CA7RIEL Paco Amoroso, PinkPantheress, Fred again.. and Étienne de Crécy contributing some “Sexy Magic. Other songs released so far include Keith Richards Bright Lights, Big City, Rauw Alejandro s Macacoa 2000 and Wallen s The Last Thing You Need.", "date_str": "2026-10-09T11:47:06+00:00", "hash": "05554134c22643d4", "title_fa": "Bad Bunny، Lana Del Rey (و شوهرش)، Morgan Wallen، Robyn و Burna Boy میزبان ایستگاه های رادیویی درون بازی «Grand Theft Auto VI» خواهند بود.", "summary_fa": "Rockstar Games پیش‌بینی می‌کرد که Grand Theft Auto VI حدود یک ماه دیگر (19 نوامبر) باقی مانده است، اما در روز پنجشنبه (8 اکتبر) نشان داد که میزبان‌های شش ایستگاه رادیویی مجازی درون‌بازی طرفداران می‌توانند در حین بازی با آن تماس بگیرند. رهبر این گروه Cocoteo FM است، یک ایستگاه موسیقی لاتین با میزبانی Bad Bunny و خواننده پورتوریکویی RaiNao، که با نام‌های El Martillo و La Gata روی آنتن خواهد رفت. در رادیو بک کانتری، لانا دل ری و مورگان والن آهنگ‌های کلاسیک کانتری و غیرقانونی کانتری را به عنوان MW و Delta Dawne پخش می‌کنند، با کمک گزارشگر سرگردان ماد داگ مایک (معروف به شوهر دل ری، جرمی دوفرن) که همه به‌روزرسانی‌های مربوط به بازی را از ایالت فلوریدا، لئونیدا ارائه می‌دهد. ایستگاه‌های دیگر عبارتند از AfroBank FM، میزبان ستاره نیجریه‌ای Burna Boy با DJ Palms Trax در حال پخش آهنگ‌های آفریقایی معاصر و کلاسیک، ایستگاه پاپ Flash FM، میزبان رابین و مدل/بازیگر Alex Consani، ایستگاه هیپ‌هاپ Dirty South Classics به میزبانی Trick Daddy و Trina و یک ایستگاه متال به نام The Chamber6. تام آرایا خواننده/نوازنده بیس. در اینجا می‌توانید درباره ایستگاه‌ها بیشتر بدانید و پیش‌نمایش‌ها را بشنوید. آلبوم موسیقی متن اصلی 34 آهنگی بازی نیز در راه است - همچنین در 19 نوامبر منتشر می شود - پیش نمایش شش آهنگ ماه گذشته با حضور یونگ لین (ft. Metro Boomin and Future) که همان چیزی است، تراویس اسکات RHYNO (تولید شده توسط DaftChumanristo Home-MRico-Guy) و DaftChanganristo Home-M. Amoroso، PinkPantheress، Fred دوباره.. و Étienne de Crécy با برخی از \"جادوی سکسی\". آهنگ های دیگری که تاکنون منتشر شده اند عبارتند از: Keith Richards Bright Lights، Big City، Rauw Alejandro's Macacoa 2000 و Wallen's The Last Thing You Need."}, {"source": "Billboard", "title": "Pet Shop Boys Salute Computer Pioneer Alan Turing on ‘A Man From The Future’: Stream It Now", "link": "https://www.billboard.com/music/pop/pet-shop-boys-alan-turing-on-a-man-from-the-future-stream-1236357860/", "summary": "On Pet Shop Boys ’ new album, the British electro-pop duo goes back to the future. Arriving at midnight, A man from the future (via Parlophone Records) is a concept album that explores eight important chapters in the life and death of Alan Turing, the English mathematician and logician who is widely regarded as the father of modern computing. Produced by Pet Shop Boys and Sven Helbig, Future is a combination of electronic music and string arrangements by Sven Helbig performed by the Manchester Camerata Octet. Juliet Stevenson contributes spoken words from Andrew Hodges’ book Alan Turing: the Enigma . Neil Tennant and Chris Lowe originally wrote the work with Hodges back in 2012-13, just prior to the theatrical release of The Imitation Game , in which the great thinker was played by Benedict Cumberbatch. Later, in July 2014, Pet Shop Boys performed pieces from it at a BBC Prom at London’s Royal Albert Hall. More than a decade later, the project has been updated, reworked and rearranged with new electronic elements, new text and fresh orchestrations by Sven Helbig. The LP unfolds chronologically from Turing’s school days, capturing his interest in mathematics and science and the realization of his sexuality, through to his university days at Cambridge, his leading role working for the British Government unlocking the German Enigma machine’s encrypted messages during World War II, his place in the invention of the digital computer, his prediction of Artificial Intelligence, his trial and conviction for a homosexual relationship, and then his suicide in 1954. “Our motive in creating this work was to make a musical memorial to Alan Turing who gave so much to his country and the world and was rewarded for it by being prosecuted for his sexuality,” reads a statement from Pet Shop Boys. “Alan made a massive contribution to the defeat of Germany in World War II and was a pioneer of computing, imagining a world with intelligent computers. He also looked forward to a time when being gay would be accepted as normal. In both his professional and private lives, he was ahead of his time.” A man from the future is the followup to 2024’s Nonetheless, which peaked at No. 2 on the Official U.K. Albums Chart. In their homeland, the duo has amassed 22 top 10 hit singles, including four No. 1s. Pet Shop Boys have landed ten top 10 albums in the United Kingdom, including a No. 1 with 1993’s Very . In the United States, the act has enjoyed 12 appearances on the Billboard Hot 100,", "date_str": "2026-10-09T09:00:26+00:00", "hash": "c885f034548928b1", "title_fa": "سلام پسران پت شاپ به پیشگام کامپیوتر، آلن تورینگ در «مردی از آینده»: اکنون آن را پخش کنید", "summary_fa": "در آلبوم جدید پسران پت شاپ، این دو گروه الکترو-پاپ بریتانیایی به آینده بازمی گردند. در نیمه شب، مردی از آینده (از طریق Parlophone Records) یک آلبوم مفهومی است که هشت فصل مهم در زندگی و مرگ آلن تورینگ، ریاضیدان و منطق‌دان انگلیسی را که به طور گسترده به عنوان پدر محاسبات مدرن شناخته می‌شود، بررسی می‌کند. Future که توسط Pet Shop Boys و Sven Helbig تولید شده است، ترکیبی از موسیقی الکترونیک و تنظیم های زهی توسط Sven Helbig است که توسط منچستر Camerata Octet اجرا می شود. جولیت استیونسون سخنان گفتاری را از کتاب آلن تورینگ: معمای اندرو هاجز ارائه می دهد. نیل تنانت و کریس لو ابتدا این اثر را با هاجز در سال‌های 2012-2013 نوشتند، درست قبل از اکران در سینمای The Imitation Game که در آن بندیکت کامبربچ نقش متفکر بزرگ را بازی می‌کرد. بعداً، در ژوئیه 2014، پت شاپ بویز قطعاتی از آن را در جشن بی بی سی در رویال آلبرت هال لندن اجرا کرد. بیش از یک دهه بعد، این پروژه با عناصر الکترونیکی جدید، متن های جدید و ارکستراسیون های تازه توسط Sven Helbig به روز، بازسازی و تنظیم مجدد شد. LP به صورت زمانی از دوران مدرسه تورینگ آشکار می شود و علاقه او به ریاضیات و علوم و درک تمایلات جنسی او را به تصویر می کشد، تا دوران دانشگاهش در کمبریج، نقش اصلی او که برای دولت بریتانیا کار می کرد و پیام های رمزگذاری شده دستگاه انیگما آلمان را در طول جنگ جهانی دوم باز می کرد، جایگاه او در اختراع کامپیوتر دیجیتال، پیش بینی همنوع و هوش مصنوعی، رابطه سه گانه و هوش مصنوعی او. سپس در سال 1954 خودکشی کرد. در بیانیه ای از Pet Shop Boys آمده است: \"هدف ما از خلق این اثر، ساختن یادبودی موسیقایی برای آلن تورینگ بود که به کشورش"}, {"source": "Billboard", "title": "As National Tour Gets Underway, Olivia Dean’s ‘The Art Of Loving’ Returns to No. 1 on ARIA Chart", "link": "https://www.billboard.com/music/chart-beat/olivia-dean-the-art-of-loving-returns-no-1-aria-chart-1236357851/", "summary": "Olivia Dean enjoys the warmest of welcomes to Australia, as her hit sophomore album The Art Of Loving (via Universal) returns to No. 1 on the ARIA Chart . The British singer started her six-date trans-Tasman tour in support of Loving with the first of two shows Monday (Oct. 5) at Melbourne’s Rod Laver Arena. Promoted by Handsome Tours and Laneway Presents, Dean’s jaunt moves on to Sydney for two shows at Afterpay Arena (Oct. 9 and 10), Brisbane Entertainment Centre (Oct. 13), and skips the ditch to New Zealand for one show at Auckland’s Western Springs Bowl (Oct. 17). The excitement around her latest, and biggest, headline tour of these parts sends The Art Of Loving to No. 1 for its 14th non-consecutive week. Loving hasn t left the top five since it debuted at No. 1 last October, ARIA reports, and last led the chart in late April. Meanwhile, ‘80s Australian rock act V.Spy V.Spy (originally known as originally known as Spy vs. Spy) returns to the ARIA Albums Chart with two titles, both of which crack the top 10 for the first time following 40 th anniversary reissues. Harry’s Reasons (SL1) from 1986 enters at No. 7, and 1987’s A.O Mod. TV. Vers (SL1) bounces to No. 8. After the release of an expanded version with four new tracks, Drake ’s HABIBTI (Republic/Universal) returns to the top 10, at No. 10. HABIBTI peaked at No. 5 after its arrival earlier in the year. The deluxe version, titled Habibti (FOMO) , includes Cold Shoulder (featuring Don Toliver and Yebba), Solar Eclipse (featuring Don Toliver), Quebec, and Classic Pt. 2. West Australian rock act Old Mervs find a spot in the top 20 with their second album, Carparks (Dew Process/Universal). It’s new at No. 16. Old Mervs’ self-titled debut from 2025 peaked at No. 4. Also blasting into the top 20 is Killing Heidi singer Ella Hooper with Overnight Success (MGM), new No. 19. It’s her third solo album and first to enter the ARIA Top 50, the charts compiler reports. As a member of Killing Heidi, Hooper collected four ARIA Awards and three top 20 albums. The band’s 2000 collection Reflector logged six weeks at No. 1, and spawned the classic “Weir,” which cracked triple j’s inaugural Hottest 100 of Australian Songs poll, at No. 77. New top 50 arrivals on the ARIA Chart, published Friday, Oct. 9, including Imminence’s Axis Mundi (at No. 27 via Sumerian Records/Inertia), Soul Wun’s independently-released Kaleidoscope (No. 29), former Little River Band frontman Glenn Shorrock’s Legendary (The Ultimate Collection) (", "date_str": "2026-10-09T07:53:04+00:00", "hash": "6da698f303110162", "title_fa": "با شروع تور ملی، «هنر دوست داشتن» اثر اولیویا دین به رتبه اول جدول ARIA بازگشت.", "summary_fa": "اولیویا دین از گرم ترین استقبال ها به استرالیا برخوردار است، زیرا آلبوم موفق دوم دوم او The Art Of Loving (از طریق یونیورسال) به شماره 1 نمودار ARIA بازگشته است. این خواننده بریتانیایی تور ترانس تاسمن شش روزه خود را در حمایت از Loving با اولین نمایش از دو برنامه دوشنبه (5 اکتبر) در راد لاور آرنا ملبورن آغاز کرد. سفر دین که توسط Handsome Tours و Laneway Presents تبلیغ می‌شود، برای دو نمایش در Afterpay Arena (9 و 10 اکتبر)، مرکز سرگرمی Brisbane (اکتبر) به سیدنی می‌رود. 13)، و از خندق به نیوزلند می‌پرد تا یک نمایش در کاسه وسترن اسپرینگز اوکلند (17 اکتبر) انجام دهد. هیجانی که پیرامون آخرین و بزرگ‌ترین تور او در این بخش‌ها وجود دارد، The Art Of Loving را برای چهاردهمین هفته متوالی خود به شماره 1 می‌فرستد. آریا گزارش می دهد که Loving از زمانی که در اکتبر گذشته در رتبه اول قرار گرفت، از پنج نفر برتر خارج نشد و آخرین بار در اواخر آوریل در جدول رهبری شد. در همین حال، بازیگر راک استرالیایی دهه 80 V.Spy V.Spy (که در ابتدا با نام Spy vs شناخته می شد. Spy) با دو عنوان به نمودار آلبوم های ARIA بازگشته است که هر دو برای اولین بار پس از انتشار مجدد چهلمین سالگرد در بین 10 آلبوم برتر قرار می گیرند. Harry’s Reasons (SL1) از سال 1986 در رتبه 7 قرار می گیرد و A.O Mod در سال 1987. تلویزیون. Vers (SL1) به رتبه 8 می رسد. پس از انتشار نسخه توسعه یافته با چهار آهنگ جدید، HABIBTI دریک (جمهوری/جهانی) به 10 برتر باز می گردد، در رتبه 10. HABIBTI پس از ورودش در اوایل سال در رتبه 5 قرار گرفت. نسخه لوکس، با عنوان Habibti (FOMO)، شامل Cold Shoulder (شامل Don Toliver و Yebba)، Solar Eclipse (با حضور Don Toliver)، Quebec،"}, {"source": "Billboard", "title": "Journey Drummer Deen Castronovo Suffers On-Stage ‘Medical Emergency’", "link": "https://www.billboard.com/music/rock/journey-drummer-deen-castronovo-medical-emergency-1236357831/", "summary": "Deen Castronovo was reportedly rushed to hospital Thursday night (Oct. 8) after falling ill during Journey ’s performance at BOK Center in Tulsa, Okla. Tulsa World sports reporter Eric Bailey was at the scene and shared the news with his followers on X. “At the Journey concert where drummer Deen Castronova had a ‘medical emergency’ after two songs. Was helped off the stage. Show is delayed for now at the BOK Center.” The message is accompanied by a clip of bass player Jonathan Cain addressing the crowd. “Have your prayers ready. Have your prayers ready for Deen Castronovo, everybody. Thank you,” he says. According to Ultimate Classic Rock , co-founder and lead guitarist Neal Schon then told the crowd that Castronovo was en route to the hospital and that the band s drum tech, Steve Toomey, would fill in. In a separate post, Bailey reports that the show continued after a 20-minute delay. Later on the night, Schon dedicated the concert to Castronovo. “This concert’s for Deen tonight. I’d love you all to pray for him. Everybody’s been going through a lot. I think he’s going to be fine,” Ultimate Classic Rock reports. Journey are making their final go-round with a lineup featuring Castronovo, Schon, Cain, and singer Arnel Pineda , who joined the group in 2007, replacing original lead singer Steve Perry. Castronovo, 62, played drums and contributed vocals for Journey from 1998 until 2015, and later rejoined the group. A member of Bad English and Hardline, his extensive CV includes stints playing for the late Ozzy Osbourne, Steve Vai, Paul Rodgers, and GZR, with Black Sabbath s Geezer Butler. Castronovo made headlines last year when, during a concert at NRG Stadium, the stage caught fire. “Hey, Houston! An act of God tonight!, he later wrote on Instagram. Fire broke out underneath the stage — right under my drum riser! I was literally on fire for 4 ½ songs, all the power cables melted, and the show was a BUST!” Journey s ongoing Final Frontier North American tour expanded in May with the announcement of 40 additional concerts . The next stop is Oct. 10, when Journey is booked to perform at Frost Bank Center in San Antonio, Texas. Earlier this summer, Journey returned to the Billboard Hot 100 for the first time since 1997 with “Don’t Stop Believin’.” The No. 9 hit from 1981 re-charted at No. 35 after it was played June 19 at Lumen Field in Seattle for the United States’ FIFA World Cup match again Australia, which the home team won 2-0. At the time of writing, Jour", "date_str": "2026-10-09T06:23:15+00:00", "hash": "58b9b45d26c98ba1", "title_fa": "دین کاسترونوو، درامر Journey در صحنه از \"اورژانس پزشکی\" رنج می برد", "summary_fa": "بنا بر گزارش ها، دین کاسترونوو پنج شنبه شب (8 اکتبر) پس از مریض شدن در حین اجرای Journey در BOK Center در تولسا، اوکلا، به سرعت به بیمارستان منتقل شد. اریک بیلی، گزارشگر ورزشی Tulsa World در محل بود و این خبر را با دنبال کنندگان خود در X به اشتراک گذاشت. نمایش در حال حاضر در مرکز BOK به تعویق افتاده است. این پیام با کلیپی از جاناتان کین، نوازنده باس در حال خطاب به جمعیت همراه است. «دعاهایت را آماده کن. دعایتان را برای دین کاسترونوو همه آماده کنید. به گفته Ultimate Classic Rock، نیل شون، یکی از بنیانگذاران و نوازنده گیتاریست اصلی، سپس به جمعیت گفت که کاسترونوو در راه بیمارستان است و استیو تومی، فن درام گروه، آن را پر خواهد کرد. بیلی در یک پست جداگانه گزارش می دهد که نمایش پس از 20 دقیقه تاخیر ادامه یافت. بعد از آن شب، شون کنسرت را به کاسترونوو اختصاص داد. Ultimate Classic Rock گزارش می دهد: \"این کنسرت امشب برای دین است. من دوست دارم همه شما برای او دعا کنید. همه چیزهای زیادی را پشت سر گذاشته اند. من فکر می کنم او خوب خواهد شد.\" Journey آخرین بازی خود را با ترکیبی از Castronovo، Schon، Cain و خواننده آرنل پیندا انجام می دهد که در سال 2007 به این گروه پیوست و جایگزین خواننده اصلی استیو پری شد. کاسترونوو، 62 ساله، از سال 1998 تا 2015 درام می نواخت و آواز می خواند و بعدها دوباره به گروه پیوست. یکی از اعضای Bad English و Hardline، CV گسترده او شامل بازی برای آزی آزبورن فقید، استیو وای، پل راجرز، و GZR، با جیزر باتلر از Black Sabbath است. کاسترونوو سال گذشته زمانی که در حین کنسرت در استادیوم NRG،  که تا به حال دیده‌ام»", "summary_fa": "مندی پتینکین واقعا Digger را حفاری می کند. ستاره میهن در یک پیام ویدیویی پرآشوب که بلافاصله پس از تماشای Digger در یک تئاتر منتشر شد، از پیروانش درخواست کرد که متنفران را نادیده بگیرند و فیلم فاجعه زیست محیطی تام کروز را تماشا کنند. پاتینکین Digger به کارگردانی Alejandro G. Inárritu را به عنوان یک کلاسیک فوری توصیف کرد و گفت که یکی از بهترین قطعات [ ] این یک اثر باورنکردنی است. قلب و روح را دوباره وارد سینما می کند. همه چیزهایی که همه ما در مورد سینما دوست داریم، همین است. لطفا، لطفا، لطفا، فرار کنید! او ادامه داد: راه نروید، بدوید و این فیلم را نبینید. اخبار مرتبط، آن هاتاوی، حفار تام کروز را درخشان می خواند: ارزش آن را دارد که وقت بگذارید. Digger DOA با 20 میلیون دلار WW - 10 به روز رسانی جهانی باکس آفیس، پتینکین آخرین ستاره ای است که پس از اینکه فیلم توسط بسیاری از منتقدان وحشیانه و در باکس آفیس بمباران شد، حمایت خود را از Digger اعلام کرد. آن هاتاوی در Letterboxd نقدی پنج ستاره به این فیلم داد و گفت: این فیلم باهوش و گیج کننده و تهاجمی و خنده دار و جاه طلب است. گیلرمو دل تورو، یکی از دوستان نزدیک I rritu، نیز در شبکه های اجتماعی به شدت از دیگر دفاع کرده است. در ددلاین تماشا کنید، پتینکین در پیامی کتبی افزود: کوبیدن این فیلم توسط منتقدان خارج از درک است. هر کسی که این قطعه را از میان گل می کشد باید اسکن مغزی بگیرد یا دوباره آن را ببیند زیرا حتماً توجه نکرده است. این یکی از جسورانه‌ترین، بدیع‌ترین و تحریک‌آمیزترین آثار هنری است که من دیده‌ام و آفرین به هر کسی که دستی روی آن گذاشته است. من دست راستم را داده بودم تا در این فیلم نقش اضافی"}, {"source": "Deadline", "title": "TIFF Lightbox Sets Animation Season Guest Curated By Masaaki Yuasa", "link": "https://deadline.com/2026/10/tiff-lightbox-masaaki-yuasa-animation-season-1237150833/", "summary": "Katsuhiro Ôtomo’s Akira and Lee Unkrich’s Toy Story 3 are among the animated titles that will screen at the TIFF Lightbox as part of Drawn Universes: Visions in Animation, the animation season guest-curated by veteran Japanese filmmaker Masaaki Yuasa. Drawn Universes: Visions in Animation will run from November 19 to December 29 at TIFF Lightbox. [ ]", "date_str": "2026-10-09T10:50:48+00:00", "hash": "1d9bfb14c1df1464", "title_fa": "مهمان فصل انیمیشن مجموعه لایت باکس TIFF با سرپرستی ماساکی یواسا", "summary_fa": "Akira از Katsuhiro Ôtomo و Toy Story 3 از Lee Unkrich از جمله عناوین انیمیشنی هستند که در لایت باکس TIFF به عنوان بخشی از Drawn Universes: Visions in Animation، فصل انیمیشن که توسط ماساکی یواسا، فیلمساز کهنه کار ژاپنی سرپرستی می شود، نمایش داده می شود. Drawn Universes: Visions in Animation از ۱۹ نوامبر تا ۲۹ دسامبر در لایت باکس TIFF اجرا خواهد شد. [ ] Katsuhiro tomo s Akira و Lee Unkrichs Toy Story 3 از جمله عناوین انیمیشنی هستند که در لایت باکس TIFF به عنوان بخشی از Drawn Universes: Visions in Animation، فصل انیمیشن که توسط ماساکی یواسا، فیلمساز کهنه کار ژاپنی سرپرستی می شود، نمایش داده می شود. یواسا در بیانیه‌ای گفت: در سرپرستی این مجموعه، می‌خواستم به فیلم‌هایی نگاه کنم که تخیل من را برانگیخت و بر پیشینیان من و نسل‌های بعدی تأثیر گذاشت. کارگردان یواسا کار خود را با مجموعه تلویزیونی Chibi Maruko-chan و Crayon Shin-chan آغاز کرد. اولین کارگردانی او بازی ذهن (2004) بود که چندین افتخار از جمله جایزه بزرگ جشنواره هنرهای رسانه ای ژاپن و جوایز جشنواره بین المللی فیلم فانتزیا را به دست آورد. او بعداً The Tatami Galaxy و Ping Pong the Animation را کارگردانی کرد و در سال 2013 استودیوی انیمیشن ژاپنی Science SARU را با Eunyoung Choi تأسیس کرد. او یک قسمت از Adventure Time را کارگردانی کرد و نامزد جایزه Annie شد و برای The Night Is Short, Walk On Girl برنده انیمیشن سال در جوایز آکادمی ژاپن شد. او Science SARU را در سال 2020 پس از Eizouken ترک کرد! او بعداً در سال 2021 مدال را با روبان بنفش دریافت کرد. او Inu-Oh را کارگردانی کرد که نامزدی جوایز گلدن گلوب و آنی را به دست آورد. در سال 2025، یواسا یک استودیوی جدید به نام Ame Pippin, Inc."}, {"source": "Deadline", "title": "Sitges-Bound Cypriot Horror ‘Motherwitch’ Sells To North America", "link": "https://deadline.com/2026/10/sitges-cypriot-horror-motherwitch-north-america-1237150808/", "summary": "E اً از روی منافع شخصی عمل می‌کنند. چیزی که من در مورد این فیلم دوست دارم این است که به یک داستان پیچیده تبدیل می شود که پاسخ ساده ای برای آن وجود ندارد. هدف ما این است که تماشاگر را بارها و بارها درباره نحوه قضاوت شخصیت ها در طول فیلم بیندیشیم. اندرسون به نوبه خود می گوید: قبل از شروع تمرین، بن شخصاً کل فیلمنامه را با هر بازیگر بررسی کرد. او پذیرای سؤالات، نگرانی‌ها و"}, {"source": "Netflix NL", "title": "Verrassing op Netflix: avonturenserie ‘ein-de-lijk te zien’", "link": "https://www.netflix-nederland.nl/verrassing-op-netflix-avonturenserie-ein-de-lijk-te-zien/", "summary": "Soms koopt Netflix de rechten van series op bij concurrenten, bij SkyShowtime bijvoorbeeld (Yellowstone) of bij Disney+. Sinds kort kun je op de streamingdienst daarom naar Percy Jackson and the Olympians kijken. Percy Jackson and the Olympians van Disney staat opeens op Netflix Percy Jackson and the Olympians is een avonturenserie van Disney (en een fantasyboekenreeks van Rick Riordan) en gaat over Percy Jackson, een twaalfjarige jongen die ontdekt dat de verhalen uit de Griekse mythologie echt zijn. De Griekse goden bestaan nog steeds en krijgen soms kinderen met gewone mensen. Percy ontdekt dat hij zo n halfgod is en dat zijn vader Poseidon, de god van de zee, is. Hierdoor beschikt hij over bijzondere krachten die vooral met water te maken hebben. Percy komt terecht in Camp Half-Blood, een veilige plek waar kinderen van Griekse goden worden opgevangen en getraind. Daar leert hij meer over zijn afkomst en over de wereld waarvan hij nooit wist dat die bestond. Hij trekt veel op met Annabeth Chase, de slimme en strijdlustige dochter van Athena, en Grover Underwood, Percy s beste vriend die in werkelijkheid een satyr (half mens, half dier) is. Wanneer de machtige bliksemschicht van Zeus wordt gestolen, raakt Percy betrokken bij een conflict tussen de goden. Samen met Annabeth en Grover begint hij aan een gevaarlijke reis om de bliksemschicht terug te vinden en een oorlog tussen de goden te voor
