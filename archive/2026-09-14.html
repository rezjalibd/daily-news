ور مستمر راستی‌آزمایی کند. گروسی امروز دوشنبه ۲۳شهریور۱۴۰۵ در سخنرانی خود در هفتادمین کنفرانس عمومی آژانس بین‌المللی انرژی اتمی گفت نبود اطلاعات درباره این مواد هسته‌ای و نداشتن دسترسی به تاسیسات برای راستی‌آزمایی آن‌ها، «مایه نگرانی جدی درباره اشاعه هسته‌ای» است. مدیرکل آژانس تاکید کرد این وضعیت باید «با نهایت فوریت» مورد رسیدگی قرار گیرد. به گفته گروسی، وضعیت نظارت آژانس بر برنامه هسته‌ای جمهوری اسلامی در سال ۱۴۰۵ وخیم‌تر شده و این نهاد پس از حملات اسفند۱۴۰۴ ناچار شد بازرسان خود را از ایران خارج کند. او افزوده آژانس بیش از شش ماه است، به‌جز یک مورد بازرسی از نیروگاه هسته‌ای بوشهر، هیچ راستی‌آزمایی میدانی در ایران انجام نداده است. گروسی در بخش دیگری از سخنرانی خود بر ضرورت بازگشت به مسیر دیپلماسی تاکید کرد و خواستار ازسرگیری مذاکرات برای یافتن راه‌حلی درباره برنامه هسته‌ای جمهوری اسلامی شد."}, {"source": "IranWire", "title": "پیام وریشه مرادی در چهارمین سالگرد جنبش «زن، زندگی، آزادی»", "link": "https://iranwire.com/fa/news-1/157580-%D9%BE%DB%8C%D8%A7%D9%85-%D9%88%D8%B1%DB%8C%D8%B4%D9%87-%D9%85%D8%B1%D8%A7%D8%AF%DB%8C-%D8%AF%D8%B1-%DA%86%D9%87%D8%A7%D8%B1%D9%85%DB%8C%D9%86-%D8%B3%D8%A7%D9%84%DA%AF%D8%B1%D8%AF-%D8%AC%D9%86%D8%A8%D8%B4-%D8%B2%D9%86-%D8%B2%D9%86%D8%AF%DA%AF%DB%8C-%D8%A2%D8%B2%D8%A7%D8%AF%DB%8C/", "summary": "«وریشه مرادی»، زندانی سیاسی، در چهارمین سالگرد جنبش «زن، زندگی، آزادی»، این جنبش را گسستی در مناسبات مبتنی بر «سلطه، خشونت، تبعیض و بازت ...", "date_str": "2026-09-14T13:22:39+00:00", "hash": "76d6994696637936", "title_fa": "پیام وریشه مرادی در چهارمین سالگرد جنبش «زن، زندگی، آزادی»", "summary_fa": "«وریشه مرادی»، زندانی سیاسی، در چهارمین سالگرد جنبش «زن، زندگی، آزادی»، این جنبش را گسستی در مناسبات مبتنی بر «سلطه، خشونت، تبعیض و بازتولید نابرابری» توصیف کرده است. در متنی که به‌عنوان چکیده‌ای از دیدگاه‌ها، نامه‌ها و نوشته‌های وریشه مرادی درباره این جنبش در صفحه اینستاگرام او منتشر شده، «زن، زندگی، آزادی» نه تنها نام یک خیزش یا شعاری اعتراضی، بلکه بیان خواستی برای بازپس‌گرفتن «زندگی، آزادی، کرامت و اراده انسان» معرفی شده است. در این متن، «ژن» یا زن در مرکز این دگرگونی قرار دارد و نه صرفا قربانی ساختارهای سرکوب، بلکه «سوژه و نیروی پیش‌برنده تغییر» توصیف می‌شود. مرادی معتقد است هیچ تغییر دموکراتیکی بدون حضور و سوژگی زنان امکان‌پذیر نیست و مبارزه برای رهایی زنان را نمی‌توان از مبارزه برای رهایی جامعه جدا کرد. براساس دیدگاه‌های مطرح‌شده، مقاومت زنان در خیابان، جامعه و زندان نیز بخش‌هایی از یک مبارزه واحد برای پایان دادن به مناسبات مردسالارانه و اقتدارگرایانه به شمار می‌روند. مرادی در تفسیر بخش «ژیان» این شعار نیز زندگی را فراتر از صرف زنده‌ماندن می‌داند و بر حق برخورداری از زندگی «آزاد، انسانی، برابر و باکرامت» تاکید می‌کند؛ زندگی‌ای که بدن، اراده و انتخاب انسان در آن از سلطه و اجبار رها باشد. در این متن، آزادی‌های فردی و جمعی، عدالت اجتماعی و اقتصادی، حق تعیین سرنوشت، حقوق قومی و زبانی، عدالت فرهنگی و برابری جنسیتی از مطالبات به‌هم‌پیوسته این جنبش برشمرده شده‌اند؛ مطالباتی که از نگاه مرادی، مناسبات قدرت و روابط اجتماعی را به چالش می‌کشند و افق ساختن جامعه‌ای «دموکراتیک و چندصدا» را ترسیم می‌کنند."}, {"source": "IranWire", "title": "۷۷ شناور از سوی «نهاد مدیریت آبراه خلیج فارس» تهدید شدند", "link": "https://iranwire.com/fa/news-1/157582-77-%D8%B4%D9%86%D8%A7%D9%88%D8%B1-%D8%A7%D8%B2-%D8%B3%D9%88%DB%8C-%D9%86%D9%87%D8%A7%D8%AF-%D9%85%D8%AF%DB%8C%D8%B1%DB%8C%D8%AA-%D8%A2%D8%A8%D8%B1%D8%A7%D9%87-%D8%AE%D9%84%DB%8C%D8%AC-%D9%81%D8%A7%D8%B1%D8%B3-%D8%AA%D9%87%D8%AF%DB%8C%D8%AF-%D8%B4%D8%AF%D9%86%D8%AF/", "summary": "نهاد «مدیریت آبراه خلیج فارس» که جمهوری اسلامی پس از جنگ اخیر تاسیس کرد، فهرست شناورهایی را که به گفته این نهاد مقررات تعیین‌شده برای عب ...", "date_str": "2026-09-14T13:45:09+00:00", "hash": "6241918c7215284d", "title_fa": "۷۷ شناور از سوی «نهاد مدیریت آبراه خلیج فارس» تهدید شدند", "summary_fa": "نهاد «مدیریت آبراه خلیج فارس» که جمهوری اسلامی پس از جنگ اخیر تاسیس کرد، فهرست شناورهایی را که به گفته این نهاد مقررات تعیین‌شده برای عبور از تنگه هرمز را نقض کرده‌اند، به‌روزرسانی کرد. شمار کشتی‌های این فهرست اکنون به ۷۷ شناور رسیده است. این نهاد در شبکه اجتماعی ایکس به «شرکت‌های بیمه»، «کلاب‌های P I» و «موسسات رده‌بندی» هشدار داد از ارایه خدمات به شناورهای قرار گرفته در این فهرست خودداری کنند. در بیانیه این نهاد آمده است: «به شرکت‌های بیمه‌گر، کلاب‌های پی‌اند‌آی و همچنین موسسات رده‌بندی هشدار داده می‌شود به‌منظور مصونیت از تبعات ناشی از ارتباط با این شناورها، از ارائه خدمات به آن‌ها خودداری نمایند.» براساس این اطلاعیه، شناورهای فهرست‌شده در صورت عبور دوباره از تنگه هرمز ممکن است با محدودیت‌هایی از جمله جریمه، توقیف یا مصادره مواجه شوند. نهاد مدیریت آبراه خلیج فارس همچنین اعلام کرد هر شناوری که از طریق انتقال کشتی‌به‌کشتی، جابه‌جایی محموله یا روش‌های مشابه با کشتی‌های موجود در این فهرست همکاری کند، به فهرست «متخلفان» افزوده خواهد شد. جمهوری اسلامی با آغاز جنگ چهل‌روزه، تنگه هرمز را بسته اعلام کرد و از آن زمان تنها به برخی کشتی‌ها مجوز عبور می‌دهد. سپاه پاسداران نیز برخی شناورهایی را که بدون دریافت مجوز جمهوری اسلامی قصد عبور از این آبراه را داشته‌اند، هدف قرار داده است."}, {"source": "IranWire", "title": "فیلم «چشم ناظر» داستان «کوثر افتخاری» برنده جشنواره مکزیک شد", "link": "https://iranwire.com/fa/news-1/157581-%D9%81%DB%8C%D9%84%D9%85-%DA%86%D8%B4%D9%85-%D9%86%D8%A7%D8%B8%D8%B1-%D8%AF%D8%A7%D8%B3%D8%AA%D8%A7%D9%86-%DA%A9%D9%88%D8%AB%D8%B1-%D8%A7%D9%81%D8%AA%D8%AE%D8%A7%D8%B1%DB%8C-%D8%A8%D8%B1%D9%86%D8%AF%D9%87-%D8%AC%D8%B4%D9%86%D9%88%D8%A7%D8%B1%D9%87-%D9%85%DA%A9%D8%B2%DB%8C%DA%A9-%D8%B4%D8%AF/", "summary": "مستند «چشم ناظر» به کارگردانی «عباس غزالی» که زندگی و تجربه‌های «کوثر افتخاری»، از آسیب‌دیدگان چشمی جنبش «زن، زندگی، آزادی» را روایت می‌ ...", "date_str": "2026-09-14T13:29:50+00:00", "hash": "b9c2981adad66ded", "title_fa": "فیلم «چشم ناظر» داستان «کوثر افتخاری» برنده جشنواره مکزیک شد", "summary_fa": "مستند «چشم ناظر» به کارگردانی «عباس غزالی» که زندگی و تجربه‌های «کوثر افتخاری»، از آسیب‌دیدگان چشمی جنبش «زن، زندگی، آزادی» را روایت می‌کند، در چهاردهمین دوره جشنواره بین‌المللی «علیه سکوت، همه صداها» (Contra el Silencio, Todas las Voces) در مکزیک برنده جایزه شد. براساس اعلام رسمی این جشنواره، «چشم ناظر» به‌عنوان فیلم برگزیده بخش «مرزها، مهاجرت‌ها و تبعیدها» انتخاب شده است. این مستند روایتگر زندگی و تجربه‌های کوثر افتخاری و مواجهه او با آسیب چشمی و پیامدهای آن است. افتخاری در جریان جنبش «زن، زندگی، آزادی» از ناحیه چشم هدف قرار گرفت و آسیب دید. این فیلم در اسپانیا ساخته شده و تهیه‌کنندگی آن را «اسکاک فیلمز» برعهده داشته است. جشنواره «علیه سکوت، همه صداها» از رویدادهای باسابقه سینمای مستند مستقل در مکزیک به شمار می‌رود که فعالیت خود را از سال ۲۰۰۰ آغاز کرده و در سال ۲۰۲۶ بیست‌وششمین سال فعالیتش را پشت سر گذاشته است. این جشنواره با تمرکز بر سینمای مستند اجتماعی و مستقل و آثاری مرتبط با واقعیت‌های مکزیک، آمریکای لاتین و جهان اسپانیایی‌زبان شکل گرفته و برای نمایش و گسترش آثاری درباره مسائل اجتماعی، انسانی و دغدغه‌های جوامع مختلف فعالیت می‌کند. این رویداد طی ۲۶ سال فعالیت، بیش از ۶۵۰۰ فیلم را در آرشیو خود گردآوری کرده و به بستری برای نمایش، گفت‌وگو و ترویج سینمای مستند مستقل و اجتماعی تبدیل شده است."}, {"source": "IranWire", "title": "تعویق نشست تنگه هرمز؛ بقایی عربستان، تسنیم نفوذ را مقصر دانستند", "link": "https://iranwire.com/fa/news-1/157558-%D8%AA%D8%B9%D9%88%DB%8C%D9%82-%D9%86%D8%B4%D8%B3%D8%AA-%D8%AA%D9%86%DA%AF%D9%87-%D9%87%D8%B1%D9%85%D8%B2-%D8%A8%D9%82%D8%A7%DB%8C%DB%8C-%D8%B9%D8%B1%D8%A8%D8%B3%D8%AA%D8%A7%D9%86-%D8%AA%D8%B3%D9%86%DB%8C%D9%85-%D9%86%D9%81%D9%88%D8%B0-%D8%B1%D8%A7-%D9%85%D9%82%D8%B5%D8%B1-%D8%AF%D8%A7%D9%86%D8%B3%D8%AA%D9%86%D8%AF/", "summary": "«اسماعیل بقایی»، سخنگوی وزارت امور خارجه جمهوری اسلامی، امروز دوشنبه ۲۳شهریور۱۴۰۵ اعلام کرد عربستان سعودی خواستار تعویق نشست منطقه‌ای مس ...", "date_str": "2026-09-14T08:55:16+00:00", "hash": "072705e2a75c084e", "title_fa": "تعویق نشست تنگه هرمز؛ بقایی عربستان، تسنیم نفوذ را مقصر دانستند", "summary_fa": "«اسماعیل بقایی»، سخنگوی وزارت امور خارجه جمهوری اسلامی، امروز دوشنبه ۲۳شهریور۱۴۰۵ اعلام کرد عربستان سعودی خواستار تعویق نشست منطقه‌ای مسقط شده و انتساب این درخواست به تحولات یمن را «انحراف از ریشه‌های اصلی این بحران» خواند. بقایی در جمع خبرنگاران گفت: «درخواست عربستان برای تعویق نشست منطقه‌ای و منتسب ساختن آن به تحولات یمن، انحراف از ریشه‌های اصلی این بحران است.» سخنگ دیرعامل اوپن‌ای‌آی، و ایلان ماسک، مدیرعامل شرکت ایکس‌ای‌آی، به طور علنی از هشدار او حمایت کردند. ماسک گفت: «داریو حق دارد.» آلتمن در مصاحبه‌ای که روز شنبه در مجله فورچون منتشر شد اعلام کرد که اوپن‌ای‌آی امسال برای عرضه اولیه سهام به بورس اقدام نخواهد کرد، زیرا تمرکز شرکت بر موضوع ایمنی است."}, {"source": "Euronews Persian", "title": "راستی آزمایی یک ادعای جنجالی در نروژ: آیا توربین‌های بادی باعث تولد حیوانات ناقص‌الخلقه می‌شوند؟", "link": "https://parsi.euronews.com/my-europe/2026/09/14/fact-checking-do-wind-turbines-cause-the-birth-of-deformed-animals", "summary": "نروژ در ۶ مارس ۲۰۲۴ میلادی با دستیابی به توافقی تازه برای همزیستی مسالمت‌آمیز میان جامعه سامی و یکی از بزرگ‌ترین مجموعه‌های نیروگاه بادی خشکی اروپا، گامی تاریخی برداشت.", "date_str": "2026-09-14T13:09:36+00:00", "hash": "dd47eb1d7550a118", "title_fa": "راستی آزمایی یک ادعای جنجالی در نروژ: آیا توربین‌های بادی باعث تولد حیوانات ناقص‌الخلقه می‌شوند؟", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! نروژ در ۶ مارس ۲۰۲۴ میلادی با دستیابی به توافقی تازه برای همزیستی مسالمت‌آمیز میان جامعه سامی و یکی از بزرگ‌ترین مجموعه‌های نیروگاه بادی خشکی اروپا، گامی تاریخی برداشت. «سامی‌ها» یک قوم بومی در شمال اروپا هستند که در بخش‌هایی از نروژ، سوئد، فنلاند و روسیه زندگی می‌کنند و پرورش گوزن شمالی یکی از فعالیت‌های سنتی مهم آنهاست. بر اساس این توافق، دامداران سامی که به پرورش گوزن شمالی مشغول‌ هستند، به مراتع بیشتری برای چرای زمستانی دسترسی پیدا کردند؛ همچنین بخشی از برق مورد نیازشان را رایگان دریافت می‌کنند و حق دارند با واگذاری امتیازهای احتمالی برای احداث نیروگاه‌های بادی در آینده مخالفت کنند. در مقابل، آنها پذیرفتند ۱۵۱ توربین بادی که شرکت Roan Vind اداره می‌کند، در منطقه ساحلی فوسن باقی بماند. با این حال دو سال بعد، روایتی نادرست در شبکه‌های اجتماعی که صدها هزار بار دیده شد، ماجرا را کاملا وارونه جلوه داد. در این روایت ادعا شده بود که دیوان عالی نروژ دستور جمع‌آوری توربین ب اقامت در آن از ۶۵۹ یورو آغاز می‌شود، تشریفات پیش از کنسرت را به بخشی از اقامت تبدیل کرده و میکروفون، میز آرایش، آینه‌های نورپردازی‌شده و آثار هنری الهام‌گرفته از کنسرت‌های سلین را در خود جای داده است. ماجرا به اینجا ختم نمی‌شود. مدیریت هتل حتی به طرفدارانی که اقامت در این سوییت را انتخاب نمی‌کنند نیز فرصت داده است تا پاریس را به سبک سلین تجربه کنند. به همین دلیل همه‌جای هتل حال و هوای کنسرت‌های سلین را دارد. حتی غذاها و نوشیدنی‌ها الهام‌گرفته از موسیقی، عطر، تجربه‌های شنیداری تعاملی، لحظه‌های عکاسی و فعالیتهای خلاقانه مربوط به اوست. این برنامه از ۱۲ سپتامبر تا ۱۸ اکتبر اجرا می‌شود. امکان شرکت در برنامه «همخوانی طرفداران» نیز وجود دارد؛ تور پیاده‌روی رایگان دوساعته‌ای که به رابطه سلین با پاریس ادای احترام می‌کند و در آن شرکت‌کنندگان از نمادهای مشهور شهر از جمله برج ایفل، طاق پیروزی و رود سن دیدن می‌کنند و البته برای نوشیدن شامپاین هم توقفی در نظر"}, {"source": "Euronews Persian", "title": "چه کسی از گرگ می‌ترسد؟ ایتالیا چگونه با افزایش جمعیت گرگ میان افسانه و هشدار زندگی می‌کند", "link": "https://parsi.euronews.com/2026/09/14/who-is-afraid-of-the-wolf-how-italy-lives-with-the-growing-number-of-specimens-amid-myths", "summary": "بر اساس آخرین آمار، حدود ۳۵۰۰ گرگ در سراسر ایتالیا زندگی می‌کنند و کارشناسان از افزایش این رقم خبر می‌دهند. در میان گزارش‌های مشاهده و هشدار، چه باید کرد تا گرگ‌ها، دامداران و مردم بتوانند در کنار هم زندگی کنند؟", "date_str": "2026-09-14T12:42:58+00:00", "hash": "b6a98d3b0117ac50", "title_fa": "چه کسی از گرگ می‌ترسد؟ ایتالیا چگونه با افزایش جمعیت گرگ میان افسانه و هشدار زندگی می‌کند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp بر اساس آخرین آمار، حدود ۳۵۰۰ گرگ در سراسر ایتالیا زندگی می‌کنند و کارشناسان از افزایش این رقم خبر می‌دهند. در میان گزارش‌های مشاهده و هشدار، چه باید کرد تا گرگ‌ها، دامداران و مردم بتوانند در کنار هم زندگی کنند؟ از حملات در پولیا تا مشاهده گرگ‌ها در امیلیا-رومانیا، اومبریا و لاتزیو، تابستان ۲۰۲۶ در فضایی از هشدار و نگرانی نسبت به گرگ‌ها سپری شد. بر اساس داده‌های آخرین پایش ملی که در سال ۲۰۲۲ توسط ایسپرا (منبع به زبان ایتالیایی) ، موسسه عالی حفاظت و پژوهش محیط‌زیست، انجام شده، در حال حاضر در ایتالیا حدود ۳۵۰۰ گرگ زندگی می‌کنند. تا امروز جمعیت گرگ‌ها حدود ۱۵۰ فرد، به ویژه در ناحیه آلپ، افزایش یافته است. اما آنچه بحث درباره گرگ را دوباره باز کرده، فقط افزایش تعداد یا مشاهده آنها در نزدیکی مناطق مسکونی نیست. در مارس ۲۰۲۶، ایتالیا دستورالعمل ۲۰۲۵ اتحادیه اروپا درباره وضعیت حفاظتی گرگ را که مقررات سال ۱۹۹۲ را اصلاح می‌کند، در قانون خود پذیرفت. به این ترتیب این حیوان از رده «گونه بسیار محافظت‌شده» به «گونه محافظت‌شده» منتقل شد و همین تنزل، در میان کارشناسان تردیدهایی را درباره فایده واقعی آن برانگیخته است. آیا تعداد گرگ‌ها در ایتالیا بیش از حد زیاد است؟ خطر برای جمعیت شهرنشین تا چه حد واقعی است و مردم چگونه باید رفتار کنند؟ یورونیوز برای پاسخ به این پرسش‌ها و زدودن افسانه‌ها و هشدارهای اغراق‌آمیز، با کارشناسان این حوزه گفت‌وگو کرده است. پیرو جنوزی، رئیس سرویس هماهنگی حیات‌وحش در ایسپرا، به یورونیوز می‌گوید: «حملات گرگ همچنان پدیده‌ای بسیار نادر است، بنابراین برای مردم خطر واقعی وجود ندارد؛ با این حال در سال‌های اخیر شاهد افزایش این موارد بوده‌ایم و آنها را با دقت بسیار زیر نظر داریم»."}, {"source": "Euronews Persian", "title": "بازگشت سلین دیون به صحنه پس از شش سال؛ استقبال پرشور هواداران از کنسرت پاریس", "link": "https://parsi.euronews.com/2026/09/14/celine-dion-returns-to-stage-after-six-years-fans-welcome-at-paris-concert", "summary": "سلین دیون، خواننده سرشناس کانادایی شامگاه شنبه با برگزاری نخستین کنسرت از مجموعه ۲۶ کنسرت خود در پاریس، پس از شش سال بار دیگر به صحنه بازگشت و در برابر ۳۵ هزار نفر از هوادارانش اجرا کرد.", "date_str": "2026-09-14T12:24:24+00:00", "hash": "426477005f1ffdd6", "title_fa": "بازگشت سلین دیون به صحنه پس از شش سال؛ استقبال پرشور هواداران از کنسرت پاریس", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! سلین دیون، خواننده سرشناس کانادایی شامگاه شنبه با برگزاری نخستین کنسرت از مجموعه ۲۶ کنسرت خود در پاریس، پس از شش سال بار دیگر به صحنه بازگشت و در برابر ۳۵ هزار نفر از هوادارانش اجرا کرد. تمام بلیت‌های این کنسرت که در سالن «پلنیتود آرنا» در نانتر در غرب پاریس برگزار شد، از پیش به فروش رسیده بود. دیون در این برنامه که دو ساعت و ۱۵ دقیقه ادامه داشت، ۲۵ ترانه برای هوادارانش اجرا کرد. این خواننده ۵۸ ساله در بخش‌هایی از برنامه نتوانست احساساتش را پنهان کند و خطاب به هوادارانش گفت: «قول داده بودم برگردم و دوباره روی صحنه باشم. حالا اینجا هستم؛ برای شما می‌خوانم، برای خودم می‌خوانم و برای زندگی می‌خوانم.» این نخستین بار در شش سال گذشته است که او یک کنسرت کامل برگزار می‌کند. آخرین باری که سلین دیون پیش از بیماری یک کنسرت برگزار کرده بود، به هشتم مارس ۲۰۲۰ بازمی‌گردد. دو سال بعد پزشکان تشخیص دادند که او به «سندرم شخص سفت» مبتلاست؛ بیماری عصبی بسیار نادری که می‌تواند باعث سفتی عضلات و گرفتگی‌های شدید و دردناک شود. ابتلا به این بیماری باعث شد دیون تور جهانی خود را نیمه‌کاره رها و باقی کنسرت‌هایش را لغو کند. کنسرت شنبه نخستین حضور دیون در برابر تماشاگران پس از تشخیص بیماری نبود. او در ژوئیه ۲۰۲۴ در مراسم افتتاحیه بازی‌های المپیک پاریس نیز از برج ایفل ترانه‌ای اجرا کرد؛ اجرایی چهار دقیقه‌ای که بازگشت او به خوانندگی پس از چند سال بیماری را رقم زد. اما کنسرت پاریس آزمونی به‌مراتب دشوارتر برای او بود."}, {"source": "Euronews Persian", "title": "ترامپ اتهام کمک اطلاعاتی چین به ایران در حمله مرگبار به سربازان آمریکایی را کم‌اهمیت دانست", "link": "https://parsi.euronews.com/2026/09/14/trump-downplays-claims-china-provided-intelligence-iran-deadly-attack-us-troops", "summary": "پکن روز دوشنبه گزارش‌ها درباره ارسال تصاویر ماهواره‌ای از یک پایگاه نظامی میزبان نیروهای آمریکایی در اردن به ایران توسط نهادهای چینی را «بی‌اساس» خواند و رد کرد. این تصاویر مربوط به پیش و پس از حمله موشکی ایران بود که به کشته شدن سه سرباز آمریکایی انجامید.", "date_str": "2026-09-14T11:43:59+00:00", "hash": "93467dea95ea8a49", "title_fa": "ترامپ اتهام کمک اطلاعاتی چین به ایران در حمله مرگبار به سربازان آمریکایی را کم‌اهمیت دانست", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp پکن روز دوشنبه گزارش‌ها درباره ارسال تصاویر ماهواره‌ای از یک پایگاه نظامی میزبان نیروهای آمریکایی در اردن به ایران توسط نهادهای چینی را «بی‌اساس» خواند و رد کرد. این تصاویر مربوط به پیش و پس از حمله موشکی ایران بود که به کشته شدن سه سرباز آمریکایی انجامید. گوئو جیاکون، سخنگوی وزارت امور خارجه چین، روز دوشنبه در نشست خبری خود گفت: «ما قاطعانه با طرح ادعاهای بی‌اساس و اتهام‌زنی بدون ارائه شواهد مخالفیم.» دونالد ترامپ، رئیس جمهوری آمریکا نیز روز یکشنبه گزارش‌ها درباره تامین تصاویر ماهواره‌ای پایگاه نظامی آمریکا در اردن برای تهران از سوی نهادهای چینی، پیش و پس از حمله ایران که به کشته شدن سه سرباز آمریکایی منجر شد، را کم‌اهمیت جلوه داد. آقای ترامپ یک روز پس از انتشار گزارش وال‌استریت ژورنال درباره همکاری اطلاعاتی چین با ایران، در هواپیمای «ایر فورس وان» گفت: «وقتی می‌گویند چین از ما جاسوسی می‌کند، می‌گویم درست است؛ ما هم از آنها جاسوسی می‌کنیم.» آقای ترامپ گفت: «ما هم همین کار را می‌کنیم و آن‌ها اساسا همان کاری را انجام می‌دهند که ما انجام می‌دهیم.» این ماجرا می‌تواند در آستانه سفر رسمی برنامه‌ریزی‌شده شی جین‌پینگ، رئیس جمهوری چین، به کاخ سفید در ۲۴ سپتامبر (دو مهر)، تنش‌ها میان واشنگتن و پکن را افزایش دهد. ایران در ۱۷ ژوئیه (۲۶ تیر) پایگاه هوایی موفق‌السلطی در اردن، محل استقرار نیروهای آمریکایی، را هدف حملات موشکی قرار داد. در این حمله سه سرباز ارتش آمریکا کشته شدند."}, {"source": "Euronews Persian", "title": "ترامپ در برابر قواعد اخلاقی کوتاه می‌آید، راه برای قانون‌گذاری بزرگ رمزارز هموار می‌شود", "link": "https://parsi.euronews.com/business/2026/09/14/trump-concedes-on-ethics-rules-clearing-the-way-for-major-crypto-legislation", "summary": "دونالد ترامپ رئیس‌جمهور آمریکا پس از مدت‌ها مقاومت با محدودیت‌های اخلاقی جدید موافقت کرده و اخرین مانع بر سر راه لایحه «وضوح» را برداشته است؛ مهم‌ترین قانونگذاری مرتبط با رمزارزها در تاریخ آمریکا که اکنون منتظر رای سرنوشت‌ساز سنا در روز سه‌شنبه است.", "date_str": "2026-09-14T11:25:20+00:00", "hash": "bff70160c3295915", "title_fa": "ترامپ در برابر قواعد اخلاقی کوتاه می‌آید، راه برای قانون‌گذاری بزرگ رمزارز هموار می‌شود", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp دونالد ترامپ رئیس‌جمهور آمریکا پس از مدت‌ها مقاومت با محدودیت‌های اخلاقی جدید موافقت کرده و اخرین مانع بر سر راه لایحه «وضوح» را برداشته است؛ مهم‌ترین قانونگذاری مرتبط با رمزارزها در تاریخ آمریکا که اکنون منتظر رای سرنوشت‌ساز سنا در روز سه‌شنبه است. لایحه ای که سرانجام مشخص می‌کند کدام نهاد بر شرکت های رمزارزی آمریکایی نظارت دارد، دوباره به جریان افتاده است. سناتورهای جمهوری خواه آخر هفته متنی را که آن را نسخه نهایی می‌نامند منتشر کردند؛ متنی که شامل بسته بازنگری شده قواعد اخلاقی است و دونالد ترامپ، رئیس جمهوری آمریکا، پس از ماه ها بن بست با آن موافقت کرده است. قانون کلاریتی (CLARITY Act) که نام رسمی آن «قانون شفافیت بازار دارایی های دیجیتال» است، در صورت تصویب نظارت بر دارایی های دیجیتال را میان کمیسیون معاملات آتی کالای آمریکا و کمیسیون بورس و اوراق بهادار تقسیم می‌کند و جایگزین نظام پراکنده کنونی می‌شود که در آن درباره طبقه بندی دارایی ها عمدتا از مسیر اقدامات اجرایی و دعاوی قضایی تصمیم گیری شده است. مجلس نمایندگان نسخه خود از این لایحه را در ژوئیه ۲۰۲۵ با ۲۹۴ رای موافق در برابر ۱۳۴ رای مخالف تصویب کرد و از آن زمان مانع اصلی خود ترامپ بود. اظهارنامه های مالی رئیس جمهوری آمریکا نشان داد که درآمدهای مرتبط با رمزارز او بین ۱.۴ میلیارد تا ۲.۲ میلیارد دلار (به ترتیب حدود ۱.۲ و ۱.۹ میلیارد یورو) بوده است، از جمله از میم کوین TRUMP و پروژه «ورلد لیبرتی فایننشیال» که یک طرح مالی غیرمتمرکز وابسته به خانواده اوست. دموکرات ها خواهان محدودیت های الزام آور بودند؛ خواسته ای که کاخ سفید تا کنون در برابر آن مقاومت می‌کرد."}, {"source": "Euronews Persian", "title": "کنترل حوثی‌ها بر بر باب‌المندب تقویت شد؛ شورشیان یمنی جزایر حنیش را تصرف کردند", "link": "https://parsi.euronews.com/2026/09/14/houthis-capture-more-yemeni-red-sea-islands-tightening-grip-on-bab-el-mandeb", "summary": "مقام‌های دولتی یمن و نیروهای شورشی انصارالله یمن (حوثی‌ها) روز دوشنبه تایید کردند که شورشیان حوثی مورد حمایت ایران چند جزیره راهبردی دیگر را در جنوب دریای سرخ به کنترل خود درآورده‌اند. حوثی‌ها با این اقدام کنترل خود بر یکی از مسیرهای مهم کشتیرانی دریایی را تقویت کردند.", "date_str": "2026-09-14T11:15:18+00:00", "hash": "272664262e230dca", "title_fa": "کنترل حوثی‌ها بر بر باب‌المندب تقویت شد؛ شورشیان یمنی جزایر حنیش را تصرف کردند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp مقام‌های دولتی یمن و نیروهای شورشی انصارالله یمن (حوثی‌ها) روز دوشنبه تایید کردند که شورشیان حوثی مورد حمایت ایران چند جزیره راهبردی دیگر را در جنوب دریای سرخ به کنترل خود درآورده‌اند. حوثی‌ها با این اقدام کنترل خود بر یکی از مسیرهای مهم کشتیرانی دریایی را تقویت کردند. حوثی‌های یمن که مورد حمایت تهران هستند جزایر بیشتری را در جنوب دریای سرخ تصرف کردند و به گفته مقام‌های دولتی و حوثی در روز دوشنبه کنترل خود را بر یکی از مسیرهای اصلی حمل‌ونقل دریایی تقویت کردند. تصرف جزایر حنیش بزرگ و حنیش کوچک جدیدترین پیشروی سریع این گروه در اطراف تنگه باب‌المندب است؛ گذرگاهی کلیدی برای صادرات نفت که در جریان جنگ ایران با آمریکا اهمیت آن بیشتر شده، زیرا تنگه هرمز همچنان زیر محاصره آمریکا و ایران است. همانند هرمز که در دهانه خلیج فارس قرار دارد، تنگه باب‌المندب در سوی دیگر شبه‌جزیره عربستان یک گلوگاه دریایی است که اقیانوس هند را به دریای سرخ وصل می‌کند و آن را به یکی از مسیرهای اصلی عبور محموله‌ها به دریای مدیترانه تبدیل کرده است. حوثی‌ها بیش از یک ماه است که زیرساخت‌های نفتی عربستان و کشتیرانی را در دریای سرخ هدف قرار می‌دهند؛ حملاتی که فشار بر قیمت جهانی نفت را افزایش داده و اهرم فشار ایران را در جنگ با آمریکا تقویت کرده است. نیروهای دولت یمن که از نظر بین‌المللی به رسمیت شناخته می‌شود تلاش کرده‌اند خود را سازمان‌دهی کرده و ضدحمله بزنند اما به نظر می‌رسد پیشروی‌های حوثی‌ها با مقاومت اندکی روبه‌رو شده است. به گفته دو مقام دولتی و یک مقام حوثی، حوثی‌ها پس از عقب‌نشینی صدها نیروی هم‌پیمان دولت از مجمع‌الجزایر، در جزایر حنیش که ۱۶۰ کیلومتر شمال تنگه باب‌المندب قرار دارد مستقر شدند."}, {"source": "Euronews Persian", "title": "جراحی آب‌مروارید برای فضانوردان در مریخ؟ آزمایش ایمپلنت‌های چشم در فضا", "link": "https://parsi.euronews.com/next/2026/09/14/could-astronauts-have-cataract-surgery-on-mars-scientists-are-testing-eye-implants-in-spac", "summary": "تیم پژوهشی ۱۳۵ عدسی مصنوعی بدون بسته‌بندی را به ایستگاه فضایی بین‌المللی فرستاد؛ این عدسی‌ها حدود شش ماه در شرایط مدار پایین زمین بودند و سپس برای تحلیل به زمین بازگردانده شدند.", "date_str": "2026-09-14T10:52:59+00:00", "hash": "a17ab5675ed12f1b", "title_fa": "جراحی آب‌مروارید برای فضانوردان در مریخ؟ آزمایش ایمپلنت‌های چشم در فضا", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp تیم پژوهشی ۱۳۵ عدسی مصنوعی بدون بسته‌بندی را به ایستگاه فضایی بین‌المللی فرستاد؛ این عدسی‌ها حدود شش ماه در شرایط مدار پایین زمین بودند و سپس برای تحلیل به زمین بازگردانده شدند. سفر به مریخ می‌تواند ماه‌ها طول بکشد. حالا اگر یک فضانورد در میانه راه با یک مشکل جدی در چشم روبه‌رو شود چه باید کرد؟ گروهی از پژوهشگران در ایالات متحده عدسی‌های مصنوعی مورد استفاده در جراحی آب مروارید را به بیرون ایستگاه فضایی بین‌المللی فرستادند تا مشخص شود ایمپلنت‌هایی که برای جراحی‌های آینده لازم است، می‌توانند سفر به مقاصدی مانند مریخ را تاب بیاورند یا نه. پژوهشگران این مطالعه معتقدند که در طول عمر نسل حاضر، بالاخره فردی روی مریخ به جراحی آب مروارید نیاز پیدا خواهد کرد. مورگان میکله‌تی، جراح چشم و مدیر تحقیقات در مرکز چشم‌پزشکی برکلی در آمریکا، گفت: «سفر به مریخ می‌تواند تقریبا یک سال زمان ببرد و بازگشت به زمین برای درمان آب مرواریدی که دید را محدود می‌کند، آسیب یا دیگر مشکلات جراحی چشم ممکن است واقع‌بینانه نباشد.» او افزود: «در نهایت درمان باید همان‌جا انجام شود که بیمار حضور دارد.» آب مروارید زمانی شکل می‌گیرد که عدسی طبیعی چشم کدر می‌شود. در طول جراحی، پزشکان این عدسی را برمی‌دارند و آن را با عدسی مصنوعی شفافی که «عدسی داخل چشمی» نام دارد جایگزین می‌کنند."}, {"source": "Euronews Persian", "title": "حمله هوایی اسرائیل به خودرویی در غزه دو مهندس حماس را کشت و ۱۳ نفر را زخمی کرد", "link": "https://parsi.euronews.com/video/2026/09/14/israeli-strike-on-gaza-vehicle-kills-two-hamas-engineers-13-wounded", "summary": "به گفته منابع پزشکی، ۱۳ سپتامبر در حمله هوایی اسراییل به خودرویی در محله تل الهوا غزه دست‌کم دو نفر کشته و ۱۳ تن زخمی شدند. اسراییل گفت هدف دو مهندس حماس دخیل در تولید سلاح بودند.", "date_str": "2026-09-14T10:10:43+00:00", "hash": "58ab4c76f4714bb8", "title_fa": "حمله هوایی اسرائیل به خودرویی در غزه دو مهندس حماس را کشت و ۱۳ نفر را زخمی کرد", "summary_fa": "تصاویر منتشرشده از محل حادثه نشان می‌داد خودروی مورد نظر در میان شعله‌ها فرو رفته و افرادی که در اطراف بودند تلاش می‌کردند آتش را خاموش کنند. تیمهای دفاع غیرنظامی بعدتر لاشه سوخته خودرو را بررسی کردند و در همین حال آمبولانس‌ها مجروحان و کشته‌ها را به بیمارستان الشفا منتقل کردند. کادر پزشکی در این بیمارستان اجساد و مجروحان را تحویل گرفت. در بیمارستان الشفا، فلسطینی‌ها بعدتر برای اقامه نماز میت گردهم آمدند و سپس اجساد را برای خاکسپاری منتقل کردند. مسئولان بهداشت فلسطین گفتند انفجار، پیکر قربانیان را تکه‌تکه کرده و از مردم خواستند برای شناسایی دو نفر کشته‌شده کمک کنند. ارتش اسرائیل اعلام کرد در این حمله دو مهندس حماس، حسن علی ابو ندا و عبدالرحیم احمد خلیل خوا، هدف قرار گرفته‌اند. این ارتش آنها را به دست داشتن در تولید سلاح متهم می‌کند. این حمله در حالی انجام شد که با وجود آتش‌بس با میانجیگری آمریکا که از اکتبر ۲۰۲۵ برقرار است، درگیری‌ها در سراسر نوار غزه همچنان ادامه دارد."}, {"source": "Euronews Persian", "title": "توقف خط‌ لوله عربستان صادرات نفت به اروپا و آسیا را تهدید می‌کند", "link": "https://parsi.euronews.com/2026/09/14/saudi-pipeline-shutdown-threatens-oil-exports-to-europe-and-asia-as-kingdom-relies-on-stor", "summary": "اختلال در خط لوله همزمان رخ می‌دهد که صادرات نفت خلیج فارس کاهش یافته و مسیرهای کشتیرانی با تهدیدها روبه‌رو هستند. بدون اعلام زمان از سرگیری، تاثیر بر صادرات به اروپا و آسیا وابسته به طول تعطیلی است.", "date_str": "2026-09-14T10:07:01+00:00", "hash": "47133c4de8226f25", "title_fa": "توقف خط‌ لوله عربستان صادرات نفت به اروپا و آسیا را تهدید می‌کند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp اختلال در خط لوله همزمان رخ می‌دهد که صادرات نفت خلیج فارس کاهش یافته و مسیرهای کشتیرانی با تهدیدها روبه‌رو هستند. بدون اعلام زمان از سرگیری، تاثیر بر صادرات به اروپا و آسیا وابسته به طول تعطیلی است. عربستان سعودی برای حفظ صادرات نفت پس از آنکه حملات پهپادی خط لوله شرق-غرب این کشور را از کار انداخت، به نفت ذخیره‌شده تکیه می‌کند؛ حملاتی که تحویل محموله‌ها به خریداران در اروپا و آسیا را تهدید می‌کند. وزارت انرژی عربستان سعودی روز جمعه به صورت احتیاطی از توقف این خط لوله خبر داد، پس از آنکه پنجشنبه گذشته این خط در مناطق ریاض و مدینه هدف حمله قرار گرفت. به گفته این وزارتخانه، تیم‌های اضطراری و فنی مشغول ایمن‌سازی خط لوله و بررسی ایمنی آن هستند. مقام‌های سعودی و عراقی اعلام کردند که این حمله پهپادی از عراق انجام شده است. در اطلاعیه این وزارتخانه مشخص نشده که پمپاژ چه زمانی از سر گرفته می‌شود یا گزارش کاملی از میزان خسارت ارائه نشده است. خریداران و معامله‌گران نفت عربستان که در گزارش‌های منتشرشده روز یکشنبه نقل قول شده‌اند، برآورد کردند که تداوم طولانی این توقف می‌تواند روزانه حدود ۴ میلیون بشکه، معادل تقریبا ۴ درصد عرضه جهانی نفت، را در معرض خطر قرار دهد. به گفته آنها، نفت ذخیره‌شده در بندر ینبع در ساحل دریای سرخ می‌تواند صادرات را برای پنج تا هفت روز ادامه دهد. مقام‌های سعودی هیچ‌یک از این برآوردها را تايید نکرده‌اند."}, {"source": "Euronews Persian", "title": "مجله خبری| ۲۳ شهریور ۱۴۰۵ (۱۴ سپتامبر ۲۰۲۶) - نیم‌روزی", "link": "https://parsi.euronews.com/video/2026/09/14/mglh-khbri-shhrior-sptambr-nimrozi", "summary": "آخرین تحولات اروپا و جهان را دنبال کنید ۲۳ شهریور ۱۴۰۵ (۱۴ سپتامبر ۲۰۲۶). با یورونیوز در جریان آخرین اخبار و رویدادهای سیاسی، اقتصادی، فرهنگی و سرگرمی قرار بگیرید.", "date_str": "2026-09-14T10:00:22+00:00", "hash": "79009f7471764ac0", "title_fa": "مجله خبری| ۲۳ شهریور ۱۴۰۵ (۱۴ سپتامبر ۲۰۲۶) - نیم‌روزی", "summary_fa": "آخرین تحولات اروپا و جهان را با این بولتن خبری یورونیوز دنبال کنید. تحریریه ما در چند دقیقه، تازه‌ترین خبرها و اخبار فوری را در حوزه سیاست، اقتصاد، فرهنگ، ورزش، سرگرمی و سفر، همراه با زمینه‌ای که برای درک یک روز پرشتاب و پر از رویداد لازم دارید، در اختیارتان می‌گذارد. این مرور منظم که با استقلال و نگاه اروپایی ویژه یورونیوز تهیه شده است، تصویری روشن و قابل اعتماد از مهم‌ترین رویدادهایی که هم‌اکنون جهان ما را شکل می‌دهند به شما می‌دهد، هر کجا که باشید و از هر جا که تماشا کنید."}, {"source": "Euronews Persian", "title": "وزیر اسرائیلی تهدید به لغو شهروندی کارگردانان مستند درباره جنگ غزه کرد", "link": "https://parsi.euronews.com/culture/2026/09/14/israeli-minister-threatens-to-strip-israeli-directors-of-citizenship-over-venice-winning-g", "summary": "وزیر فرهنگ اسرائیل خواستار سلب تابعیت از کارگردانان اسرائیلی برنده اسکار فیلم \"NAZA\"، یووال آبراهام و راچل زور شده‌است؛ این مستند درباره کشتار گسترده غیرنظامیان غزه برنده جایزه ویژه هیات داوران ونیز شد.", "date_str": "2026-09-14T09:44:21+00:00", "hash": "bb73a398b52a8900", "title_fa": "وزیر اسرائیلی تهدید به لغو شهروندی کارگردانان مستند درباره جنگ غزه کرد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp وزیر فرهنگ اسرائیل خواستار سلب تابعیت از کارگردانان اسرائیلی برنده اسکار فیلم NAZA ، یووال آبراهام و راچل زور شده‌است؛ این مستند درباره کشتار گسترده غیرنظامیان غزه برنده جایزه ویژه هیات داوران ونیز شد. یکی از پرسر و صداترین و تحسین‌شده‌ترین فیلم‌های جشنواره فیلم ونیز امسال NAZA است؛ فیلم جدیدِ کارگردانان اسرائیلی No Other Land ، یووال آبراهام و راشل زور، و تنها مستندی که برای رقابت در بخش اصلی امسال انتخاب شده‌است. در خلاصه رسمی فیلم آمده که این اثر «سازوکارهای پشت کشتار جمعی حساب‌شده غیرنظامیان فلسطینی در غزه به دست اسرائیل» را با جزئیات نشان می‌دهد. این مستند 80 دقیقه‌ای و بحث‌برانگیز که در جریان جنگ جاری غزه، به صورت مخفیانه و شب‌ها روی پشت‌بام‌های تل‌آویو فیلم‌برداری شده، شامل گفت‌وگو با 24 افسر اطلاعات نظامی، سرباز و افشاگر اسرائیلی است. آنها توضیح می‌دهند که فلسطینی‌ها چگونه هدف قرار می‌گیرند؛ نکته‌ای که عنوان فیلم نیز به آن اشاره دارد؛ مخفف اصطلاحی نظامی که نیروهای مسلح اسرائیل برای اشاره به تعداد غیرنظامیان مورد انتظار در یک حمله هوایی در غزه به کار می‌برند. این مخفف از عبارت «Nezek Agavi» گرفته شده و به معنای «خسارت جانبی» است. در جریان مراسم اهدای جوایز روز شنبه ، NAZA برنده جایزه ویژه هیات داوران شد. تنها یک روز بعد، میکی زوهر، وزیر فرهنگ اسرائیل، اعلام کرد که «فورا برای لغو تابعیت اسرائیلی» این زوج کارگردان اقدام خواهد کرد و انتقاد از اقدامات اسرائیل را مستقیما با یهودستیزی همسان دانست. بر اساس ترجمه‌ای که در ایکس منتشر شد، میکی زوهر فیلم NAZA را «موهن» و افتخار جشنواره فیلم ونیز را «تکان‌دهنده» توصیف کرد و افزود: «خودنفرتی‌ای که در وجود این خالقان می‌سوزد و آنها را حاضر می‌کند تنها برای گرفتن تشویق از یهودستیزان سراسر جهان"}, {"source": "Euronews Persian", "title": "موج برخوردهای امنیتی و قضایی در ایران؛ قوه قضائیه از «۲۴۰ مورد» توقیف اموال خبر داد", "link": "https://parsi.euronews.com/2026/09/14/wave-of-security-and-judicial-crackdowns-in-iran-judiciary-announces-the-seizure-of-asset", "summary": "قوه قضائیه ایران روز دوشنبه اعلام کرد که طی ماه‌های گذشته «۲۴۰ مورد از اموال» افرادی که از سوی مقام‌های ایران «وطن فروشان و خائنین به کشور» خوانده شده‌اند «توقیف شده است.»", "date_str": "2026-09-14T09:10:38+00:00", "hash": "5b4900baddd40765", "title_fa": "موج برخوردهای امنیتی و قضایی در ایران؛ قوه قضائیه از «۲۴۰ مورد» توقیف اموال خبر داد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp قوه قضائیه ایران روز دوشنبه اعلام کرد که طی ماه‌های گذشته «۲۴۰ مورد از اموال» افرادی که از سوی مقام‌های ایران «وطن فروشان و خائنین به کشور» خوانده شده‌اند «توقیف شده است.» خبرگزاری میزان وابسته به قوه قضائیه می‌گوید «۱۴۳ مورد» از موارد توقیف اموال در تهران بوده است. بنا به همین گزارش افرادی که اموال‌شان توقیف شده است دست به «اقدامات تبلیغی یا عملی علیه کشور و به نفع دولت‌های متخاصم» زده بودند. میزان نوشته است که «بخشی از این اموال متعلق به خبرنگاران رسانه‌های ضد انقلاب مانند اینترنشنال، من و تو و ...، فعالان و گردانندگان رسانه‌های معاند و همچنین چهره‌های سرشناس خائن ساکن خارج کشور بوده است. » قوه قضائیه ایران همچنین از مسدود شدن حساب‌های بانکی این افراد خبر داده است. در گزارش میزان شمار موارد بسته شدن حساب بانکی «۱۸۲ مورد» ذکر شده است. طبق این گزارش «بیش از ۲ هزار استعلام نیز از بانک مرکزی در رابطه حساب‌های متهمان گرفته شده است که در حال پیگیری است.» قوه قضائیه ایران تهدید کرده است که «احتمال تشکیل پرونده‌های جدید و اتخاذ تصمیم‌های قضایی درباره اموال و دارایی‌های مرتبط نیز وجود دارد.» یکی از موارد پر سر و صدای برخورد قضایی با مخالفان حکومت پرونده صادق ساعدی‌نیا از کارآفرینان ایران بود که منجر به توقیف اموال و صدور حکم حبس تعزیری برایش شد."}, {"source": "Euronews Persian", "title": "تشدید درگیری‌ها در یمن؛ با پیشروی حوثی‌ها و حملات به عربستان بیش از ۸۲ هزار نفر آواره شدند", "link": "https://parsi.euronews.com/2026/09/14/escalation-yemen-over-82000-people-displaced-amid-houthi-advances-and-attacks-on-saudi-ar", "summary": "در پی تشدید درگیری‌ها در یمن، نیروهای دولتی با پشتیبانی عربستان حملات خود به مواضع حوثی‌های مورد حمایت ایران را در سواحل دریای سرخ افزایش داده‌اند که با حملات موشکی و پهپادی حوثی‌ها به سمت عربستان مواجه شدند. حملاتی که بیش از ۸۲ هزار نفر را از آغاز ماه سپتامبر آواره کرده است.", "date_str": "2026-09-14T08:42:22+00:00", "hash": "2cc056d73051a418", "title_fa": "تشدید درگیری‌ها در یمن؛ با پیشروی حوثی‌ها و حملات به عربستان بیش از ۸۲ هزار نفر آواره شدند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! در پی تشدید درگیری‌ها در یمن، نیروهای دولتی با پشتیبانی عربستان حملات خود به مواضع حوثی‌های مورد حمایت ایران را در سواحل دریای سرخ افزایش داده‌اند که با حملات موشکی و پهپادی حوثی‌ها به سمت عربستان مواجه شدند. حملاتی که بیش از ۸۲ هزار نفر را از آغاز ماه سپتامبر اکتی در بانجارماسین منتقل شدند. برخی از آنان گفتند همزمان با کج شدن کشتی، مسافران به عرشه بالایی هجوم برده و برای به دست آوردن جلیقه‌های نجات تلاش می‌کردند. بر اساس فهرست مسافران، این کشتی ۲۴۳ نفر را حمل می‌کرد: ۲۱۳ مسافر و ۳۰ خدمه، به همراه ۸۹ خودرو. ترکیب مسافران شامل ۵۹ مسافر بزرگسال، یک کودک و ۱۲۶ راننده و کمک‌راننده، به اضافه ۲۷ نفر از کارکنان مرتبط با کشتی بود. این شناور حدود ساعت ۲ بامداد یکشنبه به وقت محلی، پس از آنکه ناخدا از امواجی تا ارتفاع ۳ متر و انحراف شدید کشتی به سمت راست خبر داد، ارتباطش را از دست داد و یک بالگرد عبوری بعدا تایید کرد که کشتی واژگون شده است. مقامها حدود دو ساعت پس از قطع ارتباط، پیام اضطراری دریافت کردند. تا روز دوشنبه دست کم ۶۲۲ نفر نیرو با استفاده از ۱۷ شناور و پنج فروند هواپیما، از جمله ناوهای نیروی دریایی و بالگردها، برای جست‌وجوی محدوده اطراف محل غرق شدن کشتی به کار گرفته شده بودند. آژانس ملی جست‌وجو و نجات اندونزی (باسارناس) اعلام کرد غواصان و پهپادهای زیردریایی تحت اداره نیروی دریایی برای بررسی داخل و اطراف بدنه واژگون‌شده به کار گرفته خواهند شد، اما توفانی بودن دریا و جریانهای شدید آب تلاشها را با مشکل روبه‌رو کرده است. مقامها گفتند این کشتی مسافربری بیش از حد مجاز بارگیری نشده بود و تعداد افراد سوار کمتر از ظرفیت حداکثری ۵۰۰ نفر بود، هرچند تاکید کردند که در اندونزی رقم واقعی مسافران اغلب با آنچه در فهرستها درج می‌شود تفاوت دارد. این کشتی مسافربری رو-رو به طول ۱۱۹"}, {"source": "Euronews Persian", "title": "سکس گروهی در ساختمان شهرداری؛ نشست سیاستمدار آلمانی به مهمانی رابطه جنسی تبدیل شد", "link": "https://parsi.euronews.com/my-europe/2026/09/14/group-sex-in-the-municipal-building-german-politicians-meeting-turned-into-a-sex-party", "summary": "یک عضو شورای شهر مانهایم در آلمان که پیش‌تر وعده داده بود یک گردهمایی سکس گروهی در ساختمان شهرداری برگزار خواهد کرد به وعده‌اش عمل کرد.", "date_str": "2026-09-14T08:27:15+00:00", "hash": "e3791cddd0fed838", "title_fa": "سکس گروهی در ساختمان شهرداری؛ نشست سیاستمدار آلمانی به مهمانی رابطه جنسی تبدیل شد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter cdcde390", "title_fa": "سازندگان هوش مصنوعی خواستار کند شدن توسعه با افزایش ترس از تسلط مهارنشده شدند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp استعفای یک پژوهشگر Anthropic و نفوذ مدل های هوش مصنوعی به سامانه های رقیب چند هفته ای پرآشوب رقم زده که بزرگان صنعت را واداشته پیش از آنکه هوش مصنوعی از توان مهارشان پیشی بگیرد خواستار تدابیر ایمنی شوند هشدارهای تازه از درون صنعت هوش مصنوعی بار دیگر یک بحث قدیمی را شعله‌ور کرده است. آیا ممکن است هوش مصنوعی پیشرفته از کنترل انسان خارج شود و بقای بشر را به خطر بیندازد و آیا شرکت‌هایی که آن را توسعه می‌دهند به اندازه کافی برای جلوگیری از چنین خطری اقدام می‌کنند؟ داریو آمودی، مدیرعامل شرکت انتروپیک، روز شنبه گفت که این صنعت باید سرعت خود را کم کند. او هشدار داد که اگر شرکت‌ها تدابیر حفاظتی قوی‌تری اعمال نکنند، ظرف شش ماه تا یک سال ممکن است گروهی از عامل‌های هوش مصنوعی کنترل اینترنت را در دست بگیرند. آمودی طرحی برای شرکت‌های فعال در حوزه هوش مصنوعی و دولت‌ها ارائه کرد تا بتوانند مدل‌های هرچه توانمندتر را با ارزش‌های انسانی همسو نگه دارند. هشدار او تنها چند روز پس از آن مطرح شد که دو پژوهشگر سابق بخش ایمنی انتروپیک علناً اعلام کردند خطرات وجودی ناشی از هوش مصنوعی به اندازه کافی جدی گرفته نمی‌شود. همزمان با افزایش توان این فناوری، نگرانی‌ها درباره خطرات آن نیز رو به افزایش است. هرچه مدل‌ها توانمندتر شوند، احتمال سوءاستفاده توسط افراد با نیت مجرمانه بیشتر می‌شود؛ از جمله در سناریوهای فاجعه‌باری مانند ساخت و انتشار یک عامل بیماری‌زا که قادر باشد بخش بزرگی از جمعیت جهان را از بین ببرد، و همچنین خطر سرکشی سامانه‌های هوش مصنوعی. انتروپیک هفته گذشته اعلام کرد تلاش بازیگران مخرب برای استفاده از مدل‌های این شرکت در حملات سایبری، جاسوسی و تحقیقاتی را که می‌تواند به توسعه سلاح‌های بیولوژیک"}, {"source": "Euronews Persian", "title": "درخواست آمریکا برای جلوگیری از حضور مقام هسته‌ای ایران در وین؛ محمد اسلامی از نشست آژانس بازماند", "link": "https://parsi.euronews.com/2026/09/14/us-block-iranian-nuclear-official-vienna-mohammad-esla ی به بندرهای دریای سرخ منتقل می‌کند و امکان می‌دهد نفت بدون عبور از تنگه هرمز به پایانه‌های صادراتی برسد؛ بنابراین از کار افتادن آن در لحظه‌ای که خود تنگه در خطرناک‌ترین وضعیت است مهم‌ترین مسیر جایگزین را از میان برداشته است. این خطر روز یکشنبه نیز خود را نشان داد؛ زمانی که به گفته مقام‌های ایرانی یک کشتی تجاری در تنگه هدف حمله قرار گرفت و یک نفر کشته و سه نفر زخمی شدند. عبور و مرور از این آبراهه اکنون کاملا متفاوت از دوران پیش از جنگ انجام می‌شود."}, {"source": "Euronews Persian", "title": "۳۵۹۵۹ پرواز در روز: رکورد ترافیک هوایی تابستان اروپا با وجود جنگ خاورمیانه", "link": "https://parsi.euronews.com/travel/2026/09/14/35959-flights-a-day-europe-saw-record-summer-air-traffic-despite-middle-east-war", "summary": "این درگیری باعث افزایش چشمگیر پروازها به کشورهایی چون آلبانی، کرواسی، قبرس، یونان، مونته‌نگرو، مقدونیه شمالی، صربستان و اسلوونی شده چون اروپایی‌ها مقاصد تعطیلاتی نزدیک‌تر را انتخاب می‌کنند.", "date_str": "2026-09-14T07:41:40+00:00", "hash": "839767d5e7dff989", "title_fa": "۳۵۹۵۹ پرواز در روز: رکورد ترافیک هوایی تابستان اروپا با وجود جنگ خاورمیانه", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp این درگیری باعث افزایش چشمگیر پروازها به کشورهایی چون آلبانی، کرواسی، قبرس، یونان، مونته‌نگرو، مقدونیه شمالی، صربستان و اسلوونی شده چون اروپایی‌ها مقاصد تعطیلاتی نزدیک‌تر را انتخاب می‌کنند. آسمان اروپا در دوره تعطیلات تابستانی از ژوئیه تا اوت ۲۰۲۶، با وجود اخلال‌های ناشی از جنگ خاورمیانه، شلوغ‌ترین وضعیت تاریخ خود را تجربه کرد. بر اساس داده‌هایی که یوروکنترل، نهاد سراسری ایمنی هوانوردی در قاره اروپا، منتشر کرده است، در این بازه به طور میانگین روزانه ۳۵ هزار و ۹۵۹ پرواز در اروپا انجام شده که نسبت به ۲۰۲۵ افزایشی ۲٫۴ درصدی داشته و در روز جمعه ۱۰ ژوئیه، با ۳۷ هزار و ۶۴۰ پرواز، رکورد زده است. با وجود افزایش پروازها در سراسر قاره، ۷۲٫۶ درصد پروازها به موقع به مقصد رسیدند که نسبت به ۲۰۲۵ یک ممیز ۲ واحد درصد بهبود نشان می‌دهد. فرانسه همچنان از نظر تاخیرهای ناشی از مشکلات مدیریت کنترل ترافیک هوایی بدترین وضعیت را داشت و به تنهایی مسئول ۳۲ درصد تمام این تاخیرها بود. یوروکنترل با آن که اذعان کرده است جنگ ایران و آمریکا بر فصل گردشگری امسال «تاثیر گذاشته»، تاکید می‌کند این درگیری همچنین بسیاری از شهروندان اروپایی را تشویق کرده تا تعطیلات خود را در داخل قاره بگذرانند؛ جایی که به طور گسترده امن‌تر تلقی می‌شود. گزارش یوروکنترل که روز جمعه منتشر شد نشان می‌دهد این درگیری به کاهش ترافیک در بلغارستان، مجارستان و ترکیه منجر شده اما در مقابل، به افزایش چشمگیر سفر به کشورهایی از جمله آلبانی ، کرواسی، قبرس، یونان ، مونته‌نگرو، شمال مقدونیه ، صربستان و اسلوونی انجامیده و در جنوب غرب اروپا نیز از «رشد مداوم» حکایت دارد."}, {"source": "Euronews Persian", "title": "حمله پهپادی مسیر کلیدی تدارکات اوکراین از لهستان را زد: آتش‌سوزی در مرز", "link": "https://parsi.euronews.com/video/2026/09/14/drone-strikes-hit-key-ukraine-poland-supply-route-sparking-border-fires", "summary": "اوکراین اعلام کرد حمله پهپادی روسیه بامداد یکشنبه ۱۳ سپتامبر نزدیک گذرگاه مرزی یاخودین–دوروخوسک با لهستان پمپ‌بنزینی را آتش‌زد؛ ویدیوها شعله‌ها، دود غلیظ و تلاش آتش‌نشانان برای مهار حریق را نشان می‌دهد.", "date_str": "2026-09-14T07:28:32+00:00", "hash": "850a534a0ad32adb", "title_fa": "حمله پهپادی مسیر کلیدی تدارکات اوکراین از لهستان را زد: آتش‌سوزی در مرز", "summary_fa": "ولنتینا چرنیش، سخنگوی اداره گمرک ولین، گفت که سقوط بقایای پهپادها باعث آتش‌سوزی در یک پمپ‌بنزین و چند کامیون در نزدیکی گذرگاه مرزی یاهودین در غرب اوکراین شده است. او به شبکه عمومی اوکراینی «سوسپیلنه» گفت که خودِ ایست‌ بازرسی هدف قرار نگرفته و سالم مانده است. در این حادثه کسی زخمی نشد. فعالیت‌های مرزی در جریان آژیر حمله هوایی به طور موقت متوقف شد، چون کارکنان گمرک و مسافران در پناهگاه‌ها مستقر شدند. پس از آن، با حضور نیروهای امدادی برای رسیدگی به خسارت، روند کنترل مرزی از سر گرفته شد. تصاویر منتشر شده از محل، حضور آتش‌نشانان و دیگر نیروهای اضطراری در پمپ‌بنزین و همچنین آسیب دیدن جاده‌ای در نزدیکی آن را نشان می‌داد. این حادثه در شرایطی رخ داد که پهپادهای روسیه چند منطقه در غرب اوکراین را هدف قرار دادند؛ منطقه‌ای که تاکنون تا حد زیادی از شدیدترین نبردها در شرق کشور در امان مانده است. به گفته شرکت دولتی راه‌آهن اوکراین «اوکرزالیزنیتسیا»، حملات شبانه همچنین به یک قطار مسافربری کی‌یف–ورشو در نزدیکی مرز اصابت کرد و حدود دو کیلومتر مانده به خاک لهستان، لوکوموتیو آن را آسیب زد. پس از هشدار قبلی و تخلیه مسافران و کارکنان، هیچ‌کس آسیب ندید. گذرگاه یاهودین–دوروهوسک یکی از مسیرهای اصلی زمینی برای ورود کمک‌های نظامی و بشردوستانه از لهستان و دیگر متحدان غربی به اوکراین است. آندری سیبیها، وزیر خارجه اوکراین، گفت این حملات در نزدیکی مرز تنها حمله‌ای به مرزهای اوکراین نیست و آنها را «ترور پوتین که مستقیم بر درهای اتحادیه اروپا و ناتو می‌کوبد» توصیف کرد و از کشورهای اروپایی خواست تحریم‌ها علیه مسکو را تشدید کنند. مقام‌های لهستانی اعلام کردند محل اصابت حدود ۸۰۰ متر با مرز لهستان فاصله داشته و تایید کردند که در سمت لهستان هیچ مورد جراحتی گزارش نشده است. مقام‌های اوکراین و لهستان همچنان در حال ارزیابی پیامدهای این حملات بودند."}, {"source": "Euronews Persian", "title": "رای یکپارچه برای تغییر نام فرودگاه نشویل به فرودگاه بین‌المللی دولی پارتون", "link": "https://parsi.euronews.com/culture/2026/09/14/dolly-parton-international-airport-unanimous-vote-for-nashville-airport-to-be-renamed-afte", "summary": "«در جایی که تنسی از جهان استقبال می‌کند شایسته است فرودگاه بین‌المللی نشویل نام دختر محبوب ایالت ما را بر خود داشته باشد.»", "date_str": "2026-09-14T06:34:55+00:00", "hash": "10839b9509e3e435", "title_fa": "رای یکپارچه برای تغییر نام فرودگاه نشویل به فرودگاه بین‌المللی دولی پارتون", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp «در جایی که تنسی از جهان استقبال می‌کند شایسته است فرودگاه بین‌المللی نشویل نام دختر محبوب ایالت ما را بر خود داشته باشد.» به ندرت پیش می‌آید که هم جمهوری‌خواهان و مقام‌های دموکرات هم‌نظر شوند، اما به نظر می‌رسد دالی پارتن از معدود چهره‌های فرهنگی بوده که توانسته همه را در آمریکا دور هم جمع کند. این موضوع بار دیگر ثابت شده است. در نمونه‌ای کم‌سابقه از توافق دوحزبی، به‌ویژه میان دولت ایالتیِ تحت سلطه جمهوری‌خواهان و شهرداریِ تحت کنترل دموکرات‌ها در تنسی، دو طرف با تغییر نام فرودگاه بین‌المللی نشویل به نام خواننده محبوب و بسیار مورد دلتنگی، دالی پارتن، موافقت کرده‌اند. هیئت کمیسرهای سازمان فرودگاه نشویل متروپولیتن با رای ۶ به ۰ آغاز فرایند تغییر نام فرودگاه به یاد این اسطوره فقید موسیقی کانتری را تصویب کرد. این تغییر باعث می‌شود پارتن به نخستین زنی تبدیل شود که نامش بر یکی از ۵۰ فرودگاه پررفت‌وآمد آمریکا قرار می‌گیرد. سازمان فرودگاه نشویل اعلام کرده است که هرچند هنوز نام نهایی تعیین نشده است، «در حال همکاری نزدیک با طرف‌های ذیربط است تا با دقت مشخص کند نام و میراث دالی پارتن چگونه در این فرودگاه لحاظ خواهد شد». پیگیری تغییر نام فرودگاه به پیش از درگذشت پارتن بازمی‌گردد و درخواست رسمی برای نامگذاری آن به «فرودگاه بین‌المللی دالی پارتن» در اوایل سال ۲۰۲۵ آغاز شده بود. پس از مرگ او در ۲۵ اوت، این ایده با حمایت بیشتری از سراسر طیف سیاسی روبه‌رو شد. بیل لی، فرماندار جمهوری‌خواه، اندکی پس از درگذشت او این تغییر را پیشنهاد کرد و فردی اوکانل، شهردار دموکرات نشویل، نیز از این ابتکار حمایت کرد. بیل لی در نخستین بیانیه خود گفت: «در جایی که تنسی از جهان استقبال می‌کند، شایسته است فرودگاه بین‌المللی نشویل"}, {"source": "Euronews Persian", "title": "انرژی در دل سنگ‌ها: آیا زیرزمین باتری مورد نیاز برای گذار انرژی است؟", "link": "https://parsi.euronews.com/2026/09/14/energy-in-rocks-could-the-underground-be-the-battery-we-need-for-the-energy-transition", "summary": "یک مطالعه پژوهشگران پرتغالی گزینه‌های مختلف ذخیره‌سازی انرژی با هوای فشرده در سنگ‌های متخلخل در عمق زمین را بررسی کرده است. در بهترین حالت، یک مخزن می‌تواند انرژی کافی برای مصرف یک شهر کوچک را ذخیره کند.", "date_str": "2026-09-14T06:27:25+00:00", "hash": "a17d0c6859c33104", "title_fa": "انرژی در دل سنگ‌ها: آیا زیرزمین باتری مورد نیاز برای گذار انرژی است؟", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp یک مطالعه پژوهشگران پرتغالی گزینه‌های مختلف ذخیره‌سازی انرژی با هوای فشرده در سنگ‌های متخلخل در عمق زمین را بررسی کرده است. در بهترین حالت، یک مخزن می‌تواند انرژی کافی برای مصرف یک شهر کوچک را ذخیره کند. ذخیره انرژی در زیرزمین شبیه داستان های علمی تخیلی به نظر می‌رسد اما در حوزه تحقیقات زمین شناسی چیز تازه ای نیست. این فرایند که از دهه ۱۹۷۰ میلادی و با نخستین آزمایش ها در غارهای نمکی آلمان شناخته شده، دنیایی از امکان ها در زمینه انرژی های تجدیدپذیر و نیاز به ذخیره‌سازی همراه آن پیش رو می‌گذارد. ریکاردو پریرا، پژوهشگر مرکز GeoBioTec در دانشکده علوم و فناوری دانشگاه نووای لیسبون، در گفتگو با یورونیوز توضیح می‌دهد: «یکی از مشکلاتی که در گذار انرژی وجود دارد این است که انرژی بیشتری از منابع تجدیدپذیر در دسترس است اما امکان ذخیره آن را نداریم». این پژوهشگر پرتغالی می‌گوید: «می‌توان از این مازاد برق استفاده کرد و آن را برای مدتی در سنگ های زیرسطحی، در عمق ۵۰۰، ۱۰۰۰ یا ۲۰۰۰ متری، ذخیره کرد». پریرا می‌گوید: «با استفاده از زمین، از سنگ ها، به عنوان نوعی باتری می‌توانیم مقادیر زیادی انرژی ذخیره کنیم که می‌تواند برق شهرهای کوچک را تامین کند و این بزرگ ترین مزیت این فناوری است». در مورد سنگ های متخلخل، این فرایند به این صورت است که با استفاده از مازاد برق تولید شده از منابع تجدیدپذیر مانند توربین های بادی یا پنل های خورشیدی، کمپرسورهای هوا تغذیه می‌شوند و سپس این هوا، بدون هیدروژن و بدون CO2 و در نتیجه بدون خطر انفجار، از طریق یک چاه به لایه ای از سنگ متخلخل در عمق زمین تزریق می‌شود. هوا فضای میان دانه های سنگ را که معمولا پر از آب شور"}, {"source": "Euronews Persian", "title": "اروپا تودی: سوید به قدرت چپ میانه نزدیک می‌شود، ترامپ سفر دوبلین را پایان می‌دهد", "link": "https://parsi.euronews.com/my-europe/2026/09/14/europe-today-sweden-edges-towards-centre-left-rule-as-trump-ends-dublin-visit", "summary": "نظرسنجیهای پس از رای‌گیری نشان میدهد ماگدالنا اندرسون سوسیال‌دموکرات پس از پیروزی بلوک چپ شاید نخست‌وزیر بعدی سوئد شود. همزمان ترامپ سفر دوبلین را تمام میکند، اوربان به سیاست مجارستان برمیگردد و از نخست‌وزیر لتونی آندریس کولبرگز میشنویم.", "date_str": "2026-09-14T06:03:28+00:00", "hash": "1857e1772e380c1f", "title_fa": "اروپا تودی: سوید به قدرت چپ ه و فرد متعلق به جامعه دگرباشان جنسی، ده‌ها نفر را در شهرهای بزرگ استانبول، آنکارا، ازمیر، آیدین و مرسین بازداشت کردند و به دفاتر انجمن‌ها و پاتوق‌های محبوب آنها یورش بردند.", "date_str": "2026-09-14T05:51:25+00:00", "hash": "34b4917073fb2cb8", "title_fa": "برخورد گسترده پلیس ترکیه با دگرباشان جنسی؛ ده‌ها نفر با هدف «حفاظت از کودکان و نهاد خانواده» بازداشت شدند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! مقام‌های ترکیه بامداد یکشنبه ۱۳ سپتامبر (۲۲ شهریور) در اقدامی گسترده علیه چندین گروه و فرد متعلق به جامعه دگرباشان جنسی، ده‌ها نفر را در شهرهای بزرگ استانبول، آنکارا، ازمیر، آیدین و مرسین بازداشت کردند و به دفاتر انجمن‌ها و پاتوق‌های محبوب آنها یورش بردند. این اقدام مقام‌های ترکیه در ادامه تشدید فشارهای چندساله دولت ترکیه علیه گروه‌های دگرباشان جنسی به‌ویژه در آستانه انتخابات، صورت گرفته است. عملیات پلیس به طور همزمان از ساعت یک بامداد در شهرهای بزرگ استانبول، آنکارا، ازمیر، آیدین و مرسین آغاز شد. آکین گورلک، وزیر دادگستری ترکیه در شبکه‌های اجتماعی اعلام کرد تحقیقات درباره ۱۶۲ مظنون، ۹ انجمن و ۱۳ واحد تجاری با هدف «حفاظت از کودکان، نهاد خانواده و نظم عمومی» و در چارچوب فرمان اجرایی ۱۰ ساله رجب طیب اردوغان، رئیس‌جمهوری ترکیه در حوزه خانواده و کودکان انجام شده است. طرحی که هدف آن مقابله با کاهش نرخ زاد و ولد و پیر شدن جمعیت ترکیه عنوان شده است. آکین گورلک گفت: «بر اساس وظیفه‌ای که قانون اساسی برای حفاظت از خانواده و کودکان بر عهده دولت گذاشته است، هیچ سازمان مجرمانه، شبکه سوءاستفاده یا فعالیت غیرقانونی که کودکان، نوجوانان یا خانواده‌ها را هدف قرار دهد، تحمل نخواهد شد.» این عملیات اعضای فعلی و سابق چندین انجمن برجسته مدافع حقوق دگرباشان جنسی و آگاهی‌رسانی درباره ایدز/اچ‌آی‌وی را نیز هدف قرار داد. وب‌سایت‌های این سازمان‌ها نیز مسدود شدند. وزیر دادگستری ترکیه همچنین گفت مشخص شده است که این انجمن‌ها مبالغ قابل‌توجهی کمک مالی از منابع و نهادهای بین‌المللی دریافت کرده‌اند. دادستانی استانبول اعلام کرد عملیات روزهای آخر هفته ه‌عنوان بشریت، به انرژی بدون کربن نیاز داریم. انرژی‌های تجدیدپذیر به‌تنهایی کافی نخواهد بود. تقاضای انرژی بشر خیلی زیاد است. اگر می‌خواهیم کربن‌زدایی کنیم، به انرژی همجوشی برای همه بخش‌ها نیاز داریم: حمل‌ونقل، هوانوردی، کشتیرانی، صنعت، گرمایش؛ در این حوزه‌ها بازار عظیمی برای تولید انرژی بدون CO₂ در حال شکل‌گیری است.» با این حال، پروفسور سون لینو عضو هیات مشورتی علمی اقلیم دولت ایالتی هسن نگاه تردیدآمیزی دارد. او در پاسخ به این پرسش یورونیوز ارث که آیا باید همچنان مبالغ هنگفتی برای توسعه انرژی همجوشی هزینه شود یا نه، می‌گوید: «از نظر شخصی من نباید به این سمت برویم.» در روزی بسیار گرم و شرجی، در سایه برج آینده‌گرای دانشگاه علوم کاربردی دارمشتات با لینو برای مصاحبه دیدار می‌کنیم. لینو می‌گوید: «هنوز هیچ‌کس نشان نداده که این کار واقعا عمل می‌کند.» در ایالات متحده، آزمایش‌ها نشان داده که در"}, {"source": "Euronews Persian", "title": "فشار آمریکا برای کاهش قیمت داروها، انتظار بیماران اروپایی را طولانی تر می کند", "link": "https://parsi.euronews.com/health/2026/09/14/us-push-to-cut-drug-prices-could-mean-longer-waits-for-european-patients", "summary": "مطالعه‌ای تازه هشدار می‌دهد بیماران اروپایی ممکن است برای دسترسی به برخی داروهای جدید بیشتر منتظر بمانند، چون تلاش آمریکا برای پایین آوردن قیمت دارو شرکت‌های داروسازی را به تعویق عرضه در بازارهای ارزان‌تر ترغیب می‌کند.", "date_str": "2026-09-14T05:03:21+00:00", "hash": "b9ff06208c22f50c", "title_fa": "فشار آمریکا برای کاهش قیمت داروها، انتظار بیماران اروپایی را طولانی تر می کند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp مطالعه‌ای تازه هشدار می‌دهد بیماران اروپایی ممکن است برای دسترسی به برخی داروهای جدید بیشتر منتظر بمانند، چون تلاش آمریکا برای پایین آوردن قیمت دارو شرکت‌های داروسازی را به تعویق عرضه در بازارهای ارزان‌تر ترغیب می‌کند. ماه مه گذشته، دونالد ترامپ رییس جمهور آمریکا کوشید (منبع به زبان انگلیسی) قیمت داروها را با پایین‌ترین سطح در میان دیگر کشورهای توسعه‌یافته همسو کند؛ سیاستی که به «قیمت‌گذاری کشور دارای بیشترین ترجیح» (MFN) معروف است. با این حال این سیاست قیمت‌گذاری می‌تواند پیامدهای منفی به همراه داشته باشد. براساس یک مطالعه مدل‌سازی جدید که در نشریه لنست منتشر شد (منبع به زبان انگلیسی) ، ممکن است بیماران اروپایی برای دسترسی به برخی داروهای نوآورانه مدت بیشتری منتظر بمانند؛ زیرا آمریکا شرکت‌های دارویی را وادار می‌کند قیمت‌هایی ارائه کنند که با قیمت‌های دیگر کشورهای پردرآمد مانند آلمان یا فرانسه همخوان باشد. پژوهشگران ۱۹۵ داروی ثبت‌اختراع‌شده را بررسی کردند که در مجموع ۸۷.۹ میلیارد دلار از هزینه سالانه دارو در آمریکا را به خود اختصاص می‌دهند. آنها دریافتند در سه چهارم داروهای بررسی‌شده، میزان پولی که شرکت‌ها با کاهش قیمت‌ها در آمریکا از دست می‌دهند از کل فروش سالانه آنها در کشورهایی که مبنای تعیین قیمت در آمریکا قرار می‌گیرند بیشتر است. به گفته پژوهشگران، برای به حداقل رساندن زیان‌ها در آمریکا، که بزرگ‌ترین بازار دارویی جهان (منبع به زبان انگلیسی) است، شرکت‌ها ممکن است انگیزه پیدا کنند عرضه دارو در کشورهای مرجع با پایین‌ترین قیمت را به تعویق بیندازند؛ زیرا با عقب انداختن ورود به این بازارها می‌توانند از مجبور شدن به تطبیق قیمت‌های پایین‌تر در آمریکا بگریزند. کِرستین ووکینگر، نویسنده این مطالعه از موسسه فناوری فدرال زوریخ (ETH Zurich) و دانشگاه زوریخ، در یک بیانیه مطبوعاتی گفت: «سیاست‌های آمریکا ممکن است بر دسترسی"}, {"source": "Euronews Persian", "title": "پیشتازی چپ‌ها در رقابت انتخاباتی فشرده سوئد؛ آرای راست افراطی کاهش یافت", "link": "https://parsi.euronews.com/my-europe/2026/09/14/left-wing-bloc-leads-in-tight-swedish-election-race-far-right-vote-share-drops", "summary": "نتیجه انتخابات پارلمانی سوئد که روز یکشنبه برگزار شد از رقابت تنگاتنگ و فشرده بین دولت راستگرا و اپوزیسیون چپگرا حکایت دارد. نخست‌وزیر کنونی و رهبر اپوزیسیون هر دو اعلام کرده‌اند که آماده تشکیل دولت هستند.", "date_str": "2026-09-14T04:45:21+00:00", "hash": "bf9d4a7899901d52", "title_fa": "پیشتازی چپ‌ها در رقابت انتخاباتی فشرده سوئد؛ آرای راست افراطی کاهش یافت", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! نتیجه انتخابات پارلمانی سوئد که روز یکشنبه برگزار شد از رقابت تنگاتنگ و فشرده بین دولت راستگرا و اپوزیسیون چپگرا حکایت دارد. نخست‌وزیر کنونی و رهبر اپوزیسیون هر دو اعلام کرده‌اند که آماده تشکیل دولت هستند. این در حالی است که به نظر می‌رسد جریان راست افراطی در مقایسه با انتخابات دوره گذشته بخشی از حمایت خود را از دست داده است. با شمارش بیش از ۹۰ درصد آرا، چهار حزب مخالف دولت به رهبری ماگدالنا آندرسون، رهبر حزب سوسیال‌دموکرات و نخست‌وزیر پیشین سوئد، در پارلمان سه‌کرسی بیشتر از ائتلاف راست‌گرای نخست‌وزیر اولف کریسترسون به دست آورده بودند. حزب راست افراطی «دموکرات‌های سوئد» نیز بخشی از این ائتلاف راست‌گرا است. ماگدالنا آندرسون، ۵۹ ساله که بین سال‌های ۲۰۲۱ تا ۲۰۲۲ نخستین نخست‌وزیر زن سوئد بود، در جمع هوادارانش گفت: «در حال حاضر ما پیشتاز هستیم. و اگر این نتیجه تایید شود، سوئد دولت جدیدی خواهد داشت.» با این حال، حزب او که در بیشتر قرن بیستم بر این کشور اسکاندیناوی حکومت کرده و همچنان بزرگ‌ترین حزب سوئد محسوب می‌شود ظاهرا با کسب حدود ۲۸ درصد آرا ضعیف‌ترین نتیجه خود در بیش از یک قرن گذشته ثبت کرده است. در همین حال اولف کریسترسون، نخست‌وزیر کنونی که حزبش ۱۹.۹ درصد از آرای شمارش‌شده را به دست آورده است، گفت اگر نتیجه نهایی همین باشد، تلاش ماگدالنا آندرسون برای تشکیل دولت با سه حزب دیگر جناح چپ را محترم خواهد شمرد. اما او خاطرنشان کرد که این چهار حزب اختلافات حل‌نشدنی با یکدیگر دارند و بعید است بتوانند بر سر برنامه‌ای مشترک برای دولت به توافق برسند."}, {"source": "Euronews Persian", "title": "کارگردان سینما ایزابل کویکست میراث جهان آنالوگ را برای آینده موسسه سروانتس می‌سپارد", "link": "https://parsi.euronews.com/culture/2026/09/14/isabel-coixet-leaves-a-claim-of-the-analogue-world-to-the-future-cervantes", "summary": "کارگردان کاتالان در نامه‌ای که در مراسم بزرگداشتش در نهاد ترویج زبان اسپانیایی خوانده شد، به هوش مصنوعی و نابودی جهانی طبیعت می‌تازد و چند شیء به گفته خودش «غیرمعاصر» را برای جعبه حروف می‌سپارد که نیم قرن دیگر گشوده می‌شود.", "date_str": "2026-09-14T03:59:29+00:00", "hash": "b2ee4225632253a6", "title_fa": "کارگردان سینما ایزابل کویکست میراث جهان آنالوگ را برای آینده موسسه سروانتس می‌سپارد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp کارگردان کاتالان در نامه‌ای که در مراسم بزرگداشتش در نهاد ترویج زبان اسپانیایی خوانده شد، به هوش مصنوعی و نابودی جهانی طبیعت می‌تازد و چند شیء به گفته خودش «غیرمعاصر» را برای جعبه حروف می‌سپارد که نیم قرن دیگر گشوده می‌شود. یک نوار کاست با ۱۸ ترانه که در آن کامارون، لوچو گاتیکا و به شکلی بسیار معنادار رومبای کاتالانیِ «La lista de la compra» از لا کابرا مکانیکا و ماریا خیمنس در هم می‌آمیزند. یک کلاژ شخصی با حال و هوای «لینچی» به دلیل فقدان عمدیِ معنای صریح. و نامه‌ای نوشته شده با خودکار بیک که در آن ایزابل کویشت دستی بودن کارش را به رخ می‌کشد و در عین حال از شیرینی سنتی توریحاس، کوزه‌های سفالیِ بوتیخو و سینمای روباز تابستانی هم می‌نویسد. این فیلمساز (سانت آدریا دل بسوس، ۱۹۶۰) در نهایت با نگاهی نوستالژیک از امروزی در حال انقراض دفاع می‌کند؛ اکنونی که شاید تا سال ۲۰۷۶ به طور کامل از میان رفته باشد. قرار است در همین سال صندوق شماره ۱۵۸۶ موسسه سروانتس دوباره گشوده شود؛ جعبه‌ای که هنرمند مورد تجلیل این اشیا را در آن به عنوان بخشی از میراث خود برای این نهاد عمومیِ ترویج زبان اسپانیایی سپرده است. فلورنس گرین در «La Librería» می‌گوید: «درک کردن ذهن را تنبل می‌کند». کویشت ـ تاریخ‌دان، تبلیغاتچی، فیلم‌نامه‌نویس و نماد موج سوم کارگردانان زن اسپانیایی ـ این جمله را در سخنرانی خود نقل کرد تا توضیح دهد چرا برای کلاژِ میراث سروانتسی‌اش، که روی جلد کتابی رهاشده از سال ۱۹۱۳ ساخته شده، معنای مشخصی قائل نمی‌شود. او در نامه‌اش، که متن آن در مراسم موسسه خوانده شد، می‌نویسد: «این را با خودکار بیک، محبوبم، برایت می‌نویسم. نمی‌دانم هنوز وجود دارند یا نه. تو، هر که هستی، گول"}, {"source": "Euronews Persian", "title": "تعویق نشست ایران و کشورهای خلیج فارس؛ اکسیوس: عربستان خواستار اصلاح طرح ایران و عمان برای تنگه هرمز شد", "link": "https://parsi.euronews.com/2026/09/14/iran-gcc-meeting-postponed-saudi-demands-hormuz-plan-changes-axios-sep-2026", "s
