      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;

    .container {

      margin: 0 auto;

    header {

      border-radius: 18px;

      text-align: center;

    .theme-toggle {

      left: 18px;

      color: var(--text);

      gap: 12px;

link": "https://www.independentpersian.com/node/422195/%D8%AC%D9%87%D8%A7%D9%86/%D9%87%D8%B1%DB%8C%D8%B3-%D9%88-%D9%88%D9%86%D8%B3-%D8%AF%D8%B1-%D8%B5%D8%AF%D8%B1-%D9%86%D8%B8%D8%B1%D8%B3%D9%86%D8%AC%DB%8C-%D9%86%D8%A7%D9%85%D8%B2%D8%AF%D9%87%D8%A7%DB%8C-%D8%A7%D8%AD%D8%AA%D9%85%D8%A7%D9%84%DB%8C-%D8%A7%D9%86%D8%AA%D8%AE%D8%A7%D8%A8%D8%A7%D8%AA-%DB%B2%DB%B0%DB%B2%DB%B8", "summary": "اگرچه هنوز هیچ‌کس نامزدی برای انتخابات ریاست‌جمهوری ۲۰۲۸ آمریکا را به‌طور رسمی اعلام نکرده است، برخی چهره‌ها در دو حزب دموکرات و جمهوری‌خواه به‌تدریج در نظرسنجی‌های اولیه پیش افتاده‌اند. به گزارش یو‌اس‌ای تودی، نظرسنجی جدید هاروارد کپس/هریس‌اکس که هفته گذشته منتشر شد، از احتمال رقابت میان دو معاون رئیس‌جمهوری‌ــ کامالا هریس، معاون رئیس‌جمهوری پیشین، و جی‌دی ونس، معاون رئیس‌جمهوری کنونی‌ــ خبر می‌دهد. در میان دموکرات‌ها، هریس با ۴۲ درصد حمایت با اختلاف قابل توجهی در صدر قرار دارد. گاوین نیوسام، فرماندار کالیفرنیا، با ۱۸ درصد دوم است و پیت بوتیجج، وزیر پیشین حمل‌ونقل، و الکساندریا اوکاسیو کورتز، نماینده کنگره، هر یک با ۹ درصد در جایگاه بعدی قرار دارند. Read More This section contains relevant reference points, placed in (Inner related node field) در میان جمهوری‌خواهان نیز ونس با ۴۴ درصد پیشتاز است. مارکو روبیو، وزیر خارجه، با ۲۱ درصد در رتبه دوم و دونالد ترامپ جونیور، پسر رئیس‌جمهوری آمریکا، با ۱۸ درصد در رتبه بعدی قرار دارد. این نظرسنجی از ۲۸ تا ۳۰ اوت با مشارکت ۲۱۰۰ رای‌دهنده ثبت‌نام‌شده و حاشیه خطای ۲.۱ درصد انجام شد. گمانه‌زنی درباره نامزدهای احتمالی هم‌زمان گمانه‌زنی‌ها درباره دیگر نامزدهای احتمالی افزایش یافته است. در یک نشست خبری کاخ سفید، از ونس درباره احتمال حمایت از تد کروز، سناتور جمهوری‌خواه تگزاس، یا پیت هگست، رئیس پنتاگون، در انتخابات ۲۰۲۸ سوال شد. کروز که در رقابت مقدماتی جمهوری‌خواهان در سال ۲۰۱۶ پس از ترامپ دوم شد، اخیرا احتمال نامزدی دوباره‌اش را رد نکرد و گفت: «بر کسی پوشیده نیست که دلم می‌خواهد رئيس‌جمهوری باشم.» اوشا ونس، همسر معاون رئیس‌جمهوری، نیز گفته است از هر تصمیمی که همسرش برای انتخابات ۲۰۲۸ بگیرد استقبال خواهد کرد. در حزب دموکرات، بوتیجج که در برخی دیگر از نظرس صی» برای عصر جدید محاسبات معرفی کرد", "link": "http://parsi.euronews.com/next/2026/09/08/amd-unveils-a-personal-super-computer-for-a-new-era-of-computing", "summary": "شرکت آمریکایی سازنده تراشه روز جمعه در برلین از آنچه خود آن را «ابررایانه شخصی» می‌نامد رونمایی کرد؛ سیستمی برای «دوران کاملا جدید محاسبات» مبتنی بر هوش مصنوعی.", "date_str": "2026-09-08T03:30:34+00:00", "hash": "fea1f7de4fc2a6ce8566cd3dcaf39d55f5cc2dc4c3da727a357727c765a790a6"}, {"source": "Euronews Persian", "title": "آیا نظافت خانه با ربات انسان‌نما و دستمزد ساعتی ۲۶ یورو را می‌پذیرید؟", "link": "http://parsi.euronews.com/next/2026/09/08/would-you-let-a-humanoid-robot-clean-your-home-for-26-an-hour", "summary": "این شرکت می‌گوید تقاضا در حال افزایش است و مشتریان بالقوه اکنون برای دریافت خدمات در فهرست انتظار نام‌نویسی می‌کنند.", "date_str": "2026-09-08T03:20:29+00:00", "hash": "4e0a5fc7ca974eb99dfb6bdcae3f518e4b3bf898bb589e275257a81d5c3ff353"}, {"source": "Euronews Persian", "title": "ترامپ: وقتی در جنگ با ایران پیروز شویم، قیمت نفت به‌شدت کاهش خواهد یافت", "link": "http://parsi.euronews.com/2026/09/08/trump-claims-oil-prices-will-plummet-after-us-wins-iran-war-sep-2026", "summary": "با گذشت بیش از شش ماه از آغاز جنگ آمریکا و ایران، درگیری‌ها بر سر کنترل تنگه هرمز همچنان ادامه دارد و تردد در این آبراه با اختلال شدید روبرو است. همین امر باعث افزایش مجدد بهای نفت شده است. با این حال، ترامپ شامگاه دوشنبه گفت که با پیروزی آمریکا در این جنگ، بهای نفت به‌شدت کاهش می‌یابد.", "date_str": "2026-09-08T02:17:41+00:00", "hash": "087bf26e7563bd4f2e7cf0b7e7c63609a6f1eb74aca211496c919c688975afce"}, {"source": "Euronews Persian", "title": "مجله خبری| ۱۷ شهریور ۱۴۰۵ (۸ سپتامبر ۲۰۲۶) - بامدادی", "link": "http://parsi.euronews.com/video/2026/09/08/mglh-khbri-shhrior-sptambr-bamdadi", "summary": "آخرین تحولات اروپا و جهان را دنبال کنید ۱۷ شهریور ۱۴۰۵ (۸ سپتامبر ۲۰۲۶). با یورونیوز در جریان آخرین اخبار و رویدادهای سیاسی، اقتصادی، فرهنگی و سرگرمی قرار بگیرید.", "date_str": "2026-09-08T00:00:00+00:00", "hash": "59b9fb2ddc5f2a6f34b001425178dcbb67f9525cdbf841d17b2faa46b2abfae4"}, {"source": "BBC Persian", "title": "بریتانیا با اعلام تحریم‌هایی علیه شهر‌ک‌‌نشینان کرانه‌باختری، آنها را به «پاکسازی قومی» متهم کرد", "link": "https://www.bbc.com/persian/articles/cwyzqydk2nro?at_medium=RSS&at_campaign=rss", "summary": "دولت بریتانیا واردات کالا از شهرک‌های اسرائیلی در کرانه باختری را ممنوع کرد. آمریکا و اسرائیل هشدار داده‌اند که این اقدام بی‌پاسخ نخواهد ماند. همزمان، وزیران خارجه ۱۲ کشور اروپایی، بریتانیا و کانادا، بیانیه مشترکی درباره اعمال محدودیت‌های تجاری علیه شهرک‌های اسرائیلی منتشر کردند. این کشورها با تاکید برراه‌حل دو کشوری، از اسرائیل خوستند فورا گسترش شهرک‌سازی در کرانه باختری را متوقف کنند.", "date_str": "2026-09-08T12:01:36+00:00", "hash": "38d33656d7012d024f8a8ac3843c810944f07e6565c1574932e759eb5b92bcab"}, {"source": "BBC Persian", "title": "سیل و طوفان در شمال ایران؛ ادارات مازندران تعطیل شدند، برق برخی نقاط قطع شد", "link": "https://www.bbc.com/persian/articles/cpwlq4y8gnxo?at_medium=RSS&at_campaign=rss", "summary": "در پی بارندگی شدید تابستانی و طغیان رودخانه‌ها در شمال ایران، سیل بخش‌هایی از شمال ایران را فراگرفت. سیل ساری، مرکز استان را پوشانده است و تمامی ادارات تعطیل شده‌اند. برق در برخی از نقاط استان قطع شده است.", "date_str": "2026-09-08T09:27:15+00:00", "hash": "a0c5f89e173e86daadd4059d44c4b1eb891142aaab2138f80b5e3d8fa40f4f63"}, {"source": "BBC Persian", "title": "چرا نام فرزند سوم محمد صلاح جنجالی شد؟", "link": "https://www.bbc.com/persian/articles/cyvzjvzrq6jo?at_medium=RSS&at_campaign=rss", "summary": "محمد صلاح، ستاره تیم ملی مصر و بازیکن باشگاه ترابزون‌اسپور تریکه، صاحب سومین فرزند خود شد و نام او را پس از دو دخترش، مکه (متولد ۲۰۱۴) و کیان (متولد ۲۰۲۰)، «لیل» گذاشت.", "date_str": "2026-09-08T11:48:07+00:00", "hash": "ad580b311e4317bf0aae309d677a913615fb7f529e7895fc28ebfc0be2390083"}, {"source": "BBC Persian", "title": "قوه قضائیه ایران: در جریان طرح مقابله با نفوذ در مجلس نبودیم", "link": "https://www.bbc.com/persian/articles/c1l6jlpqvz4o?at_medium=RSS&at_campaig ی کند. این به شما امکان می دهد اکثر تنظیمات را روی کنترلر تنظیم کنید، از جمله از پیش تنظیم های مبتنی بر ژانر. می توانید کنترل ها را مجدداً ترسیم کنید و ... داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "Microsoft breaks another patch Tuesday record", "link": "https://www.theverge.com/tech/991178/microsoft-patch-tuesday-record-breaking-ai-notepad", "summary": "Engineers at Microsoft typically enjoy a quieter summer to take vacations and spend time with family, as is common at many companies. But this year, the season has been unusually busy for Windows and security engineers, thanks to new AI models that are discovering software vulnerabilities at a rapid pace. Sources tell me that Microsoft will set another patch Tuesday record today, the third in just a few months. It all kicked off in April when Anthropic's new Mythos model found security vulnerabilities in \"every major operating system and web browser.\" A few weeks later, OpenAI released its own cybersecurity-focused model to trusted partners … Read the full story at The Verge.", "date_str": "2026-09-08T14:00:00+00:00", "hash": "f0efc022439ffd120ef1b7b1e57e4ef2fa117e03efdbdb08ef6f63200b572425", "title_fa": "مایکروسافت یک رکورد دیگر را در روز سه شنبه شکست", "summary_fa": "مهندسان مایکروسافت معمولاً از تابستان آرام تری برای گذراندن تعطیلات و گذراندن وقت با خانواده لذت می برند، همانطور که در بسیاری از شرکت ها معمول است. اما امسال، به لطف مدل‌های جدید هوش مصنوعی که آسیب‌پذیری‌های نرم‌افزاری را با سرعت زیادی کشف می‌کنند، فصل به‌طور غیرمعمولی برای مهندسین ویندوز و امنیت شلوغ بوده است. منابع به من می گویند که مایکروسافت امروز یک رکورد دیگر را در روز سه شنبه ثبت خواهد کرد که سومین بار در عرض چند ماه خواهد بود. همه چیز در آوریل آغاز شد، زمانی که مدل جدید Mythos Anthropic آسیب‌پذیری‌های امنیتی را در \"هر سیستم عامل اصلی و مرورگر وب\" پیدا کرد. چند هفته بعد، OpenAI مدل متمرکز بر امنیت سایبری خود را برای شرکای قابل اعتماد منتشر کرد ... داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "Google’s Atlas of the human genome could pave the way for new treatments", "link": "https://www.theverge.com/ai-artificial-intelligence/991180/google-launches-alpha-genome-atlas", "summary": "Google DeepMind has unveiled an AI tool that its scientists claim could help unravel the mysteries of the human genome and transform our understanding of biology, accelerating scientific research and ultimately paving the way for new treatments for diseases. The platform, called AlphaGenome Atlas, contains a \"predictive map of every possible DNA letter change in the human genome,\" the researchers said in a blog post published on Tuesday. DNA is written in an alphabet of four chemical \"letters\" - usually shortened to A, C, G, and T - and the human genome contains roughly three billion letter pairs. Those letters contain the instructions … Read the full story at The Verge.", "date_str": "2026-09-08T14:00:00+00:00", "hash": "8b754c43e6d5a309013d6c4156ce096f62179a2ee6e725f091227bfd3b8b09b8", "title_fa": "اطلس ژنوم انسان گوگل می تواند راه را برای درمان های جدید هموار کند", "summary_fa": "Google DeepMind از ابزار هوش مصنوعی رونمایی کرده است که دانشمندان آن ادعا می کنند می تواند به کشف اسرار ژنوم انسان و تغییر درک ما از زیست شناسی، سرعت بخشیدن به تحقیقات علمی و در نهایت هموار کردن راه برای درمان های جدید برای بیماری ها کمک کند. این پلتفرم که AlphaGenome Atlas نام دارد، حاوی «نقشه ای پیش بینی کننده از هر تغییر احتمالی حرف DNA در ژنوم انسان» است. DNA با الفبای چهار \"حرف\" شیمیایی نوشته می شود - معمولاً به A، C، G و T کوتاه می شود - و ژنوم انسان شامل تقریباً سه میلیارد جفت حرف است. این نامه‌ها حاوی دستورالعمل‌ها هستند… داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "The Legend of Zelda 40th Anniversary Direct: All the news and trailers", "link": "https://www.theverge.com/games/991265/the-legend-of-zelda-40th-anniversary-direct", "summary": "The Legend of Zelda franchise turns 40 this year, and Nintendo has some news in store. The company is airing a Zelda -themed Direct on September 8th at 10AM ET ( it s actually the first of two news-filled events ), which is expected to last around 30 minutes and, according to Nintendo, will include a variety of information related to The Legend of Zelda . That s a pretty vague description, but the event will almost certainly include more details on the upcoming Ocarina of Time remake for the Switch 2, which currently doesn t have a release date, as well as the live-action Zelda movie that hits theaters in 2027. But given the length of the event, there will likely be some surprises as well. Hey, maybe we ll see a tease for the next mainline Zelda adventure. You can follow along with all of the news right here, as well as watch the event as it unfolds in the embed below. Link can jump now! Nintendo’s Ocarina of Time remake launches in November “The title is… ‘The Legend of Zelda.’” Hey! Listen! Nintendo s next two Direct events are both happening next week", "date_str": "2026-09-08T13:50:00+00:00", "hash": "2b638385f5b6a6dde66ab6633f921bba294aafc9831c9e2088654e1466fa5ba5", "title_fa": "The Legend of Zelda 40th Anniversary مستقیم: همه اخبار و تریلرها", "summary_fa": "فرنچایز Legend of Zelda امسال 40 ساله می شود و نینتندو اخباری را در اختیار دارد. این شرکت در 8 سپتامبر در ساعت 10 صبح به وقت شرقی یک دایرکت با مضمون زلدا را پخش می کند (در واقع اولین رویداد از دو رویداد مملو از اخبار است) که انتظار می رود حدود 30 دقیقه طول بکشد و طبق گفته نینتندو، حاوی اطلاعات مختلفی در رابطه با The Legend of Zelda باشد. این یک توصیف بسیار مبهم است، اما این رویداد تقریباً به طور قطع شامل جزئیات بیشتری در مورد بازسازی آینده Ocarina of Time برای سوییچ 2 خواهد بود که در حال حاضر تاریخ اکرانی ندارد، و همچنین فیلم لایو اکشن Zelda که در سال 2027 در سینماها اکران می شود. اما با توجه به مدت زمان رویداد، احتمالاً شگفتی هایی نیز وجود خواهد داشت. هی، شاید برای ماجراجویی اصلی بعدی Zelda شاهد یک مزاحم باشیم. شما می‌توانید همه اخبار را از اینجا دنبال کنید، و همچنین رویداد را در حالی که در جاسازی زیر آشکار tire problem set was gone. The paper, published on arXiv last week by six DeepMind researchers, is a case study rather than a benchmark. Nobody set out to test [ ] This story continues at The Next Web", "date_str": "2026-09-08T11:07:13+00:00", "hash": "21823bbf48f078ddba91b37825807703ae6ba99430629902eee10053ddb77c7c", "title_fa": "به 100 مامور DeepMind گفته شد که تقلب نکنند. 14 درصد به هر حال", "summary_fa": "Google DeepMind 100 عامل هوش مصنوعی را در اتاقی قرار داد و از آنها خواست تا ریاضیات سخت را اثبات کنند. یکی راهی برای تقلب پیدا کرد. بیست و هفت دقیقه بعد کل مجموعه مشکل برطرف شد. این مقاله که هفته گذشته توسط شش محقق DeepMind در arXiv منتشر شد، یک مطالعه موردی است تا یک معیار. هیچ کس قصد آزمایش [ ] را نداشت این داستان در وب بعدی ادامه دارد"}, {"source": "The Next Web", "title": "Satellogic hires the former head of US spy-satellite intelligence as president", "link": "https://thenextweb.com/news/satellogic-whitworth-nga-president", "summary": "Satellogic has appointed Frank D. “Trey” Whitworth as president, giving the day-to-day running of a commercial Earth-imaging company to the man who directed America’s spy-satellite intelligence agency until 10 months ago. The appointment was announced today by the company. Whitworth, a retired US Navy vice admiral, directed the National Geospatial-Intelligence Agency from June 2022 to [ ] This story continues at The Next Web", "date_str": "2026-09-08T10:54:41+00:00", "hash": "cc9197c3b1f52352a510c8eddd2b2e4c9f08de3106aa4638b322bbd86319d94b", "title_fa": "Satellogic رئیس سابق اطلاعات جاسوسی-ماهواره ایالات متحده را به عنوان رئیس جمهور استخدام می کند", "summary_fa": "Satellogic فرانک دی \"تری\" ویتورث را به عنوان رئیس جمهور منصوب کرده است و اداره روزانه یک شرکت تجاری تصویربرداری از زمین را به مردی که تا 10 ماه پیش آژانس اطلاعات جاسوسی-ماهواره ای آمریکا را اداره می کرد، می دهد. این انتصاب امروز توسط این شرکت اعلام شد. ویتورث، معاون دریاسالار بازنشسته نیروی دریایی ایالات متحده، از ژوئن 2022 آژانس اطلاعات مکانی ملی را هدایت کرد تا [ ] این داستان در The Next Web ادامه دارد."}, {"source": "The Next Web", "title": "Altman sells startup optimism days after warning of ‘sobering’ AI", "link": "https://thenextweb.com/news/sam-altman-axios-idea-guy-sobering-models", "summary": "Sam Altman gave Axios two interviews four days apart. In the first he said the next generation of AI models would be “sobering for everybody”. In the second he said this is the best time in the world to start a company. Both were with the same reporter, Mike Allen. Both happened around the G20 [ ] This story continues at The Next Web", "date_str": "2026-09-08T10:53:47+00:00", "hash": "b69797dae308724702e7b82c598a71f63101c8043613a7a1d8e13d693a07e2a6", "title_fa": "آلتمن چند روز پس از هشدار درباره هوش مصنوعی «هوش‌انگیز» خوش‌بینی استارت‌آپی را می‌فروشد", "summary_fa": "سم آلتمن دو مصاحبه با اکسیوس به فاصله چهار روز انجام داد. در اولین مورد، او گفت که نسل بعدی مدل های هوش مصنوعی \"برای همه هوشیار خواهد بود\". در مورد دوم او گفت که این بهترین زمان در جهان برای راه اندازی یک شرکت است. هر دو با یک خبرنگار، مایک آلن بودند. هر دو در حوالی G20 اتفاق افتادند [ ] این داستان در The Next Web ادامه دارد"}, {"source": "The Next Web", "title": "Macron asks Brussels for an under-15s social media ban after France’s own was struck down", "link": "https://thenextweb.com/news/macron-eu-social-media-ban-under-15s-letter", "summary": "Emmanuel Macron has asked the European Commission to ban children under 15 from social media across the bloc, three weeks after France’s highest constitutional authority struck down his government’s attempt to do the same thing nationally. The request came in a letter to Commission president Ursula von der Leyen dated 29 August, reported by Reuters on Tuesday. [ ] This story continues at The Next Web", "date_str": "2026-09-08T10:44:34+00:00", "hash": "8b0621a4aafe854ae5a6137fde77fc8cc6479844cb17340a3d7a834eeeadbb8d", "title_fa": "مکرون از بروکسل درخواست ممنوعیت شبکه های اجتماعی زیر 15 سال پس از سرنگونی شبکه اجتماعی فرا ef executives on [ ] This story continues at The Next Web", "date_str": "2026-09-08T10:31:19+00:00", "hash": "34e4adf0af676f73996c89dd5fd317936ac5daf6c5099083bdb40f26ed84de35", "title_fa": "رئیس تجارت اتحادیه اروپا از مدیران اجرایی می‌پرسد که چقدر می‌توانند از چین جدا شوند", "summary_fa": "کمیسیون اروپا طرحی برای سست کردن چین بر زنجیره‌های تامینی که صنایع اروپایی را تغذیه می‌کند، دارد و قبل از اینکه این طرح را به طور رسمی پیشنهاد کند، می‌خواهد بفهمد که شرکت‌هایش برای چه مقدار از آن‌ها آماده پرداخت هستند. انتظار می رود ماروش شفچوویچ، کمیسر تجارت، این سوال را به مدیران اجرایی اروپایی در [ ] مطرح کند این داستان در The Next Web ادامه دارد."}, {"source": "The Next Web", "title": "TSMC backs ASML’s plan for bigger masks so its newest machines can print AI’s biggest chips", "link": "https://thenextweb.com/news/asml-tsmc-12-inch-masks-high-na-euv", "summary": "ASML’s most advanced lithography machines cannot print the largest chips the AI industry currently builds. The company now has a plan to change that, and it has brought TSMC in on it. The initiative was reported by Reuters on Tuesday and confirmed the same day in a joint announcement from the two companies. ASML wants to move [ ] This story continues at The Next Web", "date_str": "2026-09-08T10:16:56+00:00", "hash": "e33572ac4072f8ca41ec670c58714006e82d114794a815c5e0d59c80f776af91", "title_fa": "TSMC از طرح ASML برای ماسک های بزرگتر حمایت می کند تا جدیدترین ماشین های آن بتوانند بزرگترین تراشه های هوش مصنوعی را چاپ کنند.", "summary_fa": "پیشرفته ترین ماشین های لیتوگرافی ASML نمی توانند بزرگترین تراشه هایی را که صنعت هوش مصنوعی در حال حاضر می سازد چاپ کند. این شرکت اکنون برنامه ای برای تغییر آن دارد و TSMC را وارد آن کرده است. این ابتکار توسط رویترز روز سه شنبه گزارش شد و در همان روز در اطلاعیه مشترک دو شرکت تایید شد. ASML می خواهد [ ] را جابجا کند این داستان در وب بعدی ادامه دارد"}, {"source": "MIT Tech Review", "title": "The Download: our 35 Innovators Under 35 this year", "link": "https://www.technologyreview.com/2026/09/08/1143615/the-download-35-innovators-under-35-spiderwebs-measuring-nature/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. Introducing our 35 Innovators Under 35 list for 2026 What will the next generation of science and technology look like? Our latest Innovators Under 35 list offers a glimpse. Every year, we recognize 35 people from around the world who are doing groundbreaking scientific work and building clever technical fixes for sticky problems. By finding the top young innovators globally and learning what they’re focused on, we aim to give readers a sense of the advances to expect in the years to come. This year’s honorees were selected from 550 nominations, with 44 expert judges helping our editors evaluate the finalists. Each works in one of four categories: biotechnology, AI, computing and robotics, and climate and energy—and has already made clear progress toward their goals. Meet our 35 Innovators Under 35 shaping the future of science and technology . Welcome to the spiderverse, a world measured through webs Counting the creatures around us is critical for conservation, but it’s often a laborious, costly process that still leaves gaps. Environmental DNA, or eDNA, offers a promising alternative by analyzing genetic material shed by living things. Recently, spiderwebs have emerged as an eDNA goldmine, as they trap material from their arachnid creators, their prey, and bio-detritus like saliva and pollen from nearby plants and animals. Studies found no passive tool matched spiderwebs’ ability to ID vertebrates. Find out how spiderwebs are unlocking better ways to measure nature . —Stephen Ornes This story is from our latest print magazine, which is all about kids. Subscribe now to receive every issue as soon as it lands. The must-reads I’ve combed the internet to find you today’s most fun/important/scary/fascinating stories about technology. 1 How a blacklisted Chinese company kept buying Nvidia’s best AI chips Its US subsidiary shipped them to firms serving China from elsewhere. ( NYT $) + Belgium has arrested a man accused of stealing chip tech for China. ( WSJ $) + IBM’s new chip tech could extend Moore’s Law. ( MIT Technology Review ) 2 Mistral has raised a European record of $3.5 billion It’s the biggest equity round for a private European tech firm. ( CNBC ) + Mistral is betting on open models while US rivals keep theirs closed. ( Reuters $) + It’s also shifting strategy to focus more on AI infrastructure. ( NYT $) + But it", "date_str": "2026-09-08T12:10:00+00:00", "hash": "db73d46d5fa556ef6c5c4cfb9d7e0d28dceff787f0b8af15b19db6f8f9b76e81", "title_fa": "دانلود: امسال 35 مبتکر زیر 35 سال ما", "summary_fa": "این نسخه امروز دانلود است، خبرنامه روزهای هفته ما که دوز روزانه ای از آنچه در دنیای فناوری می گذرد را ارائه می دهد. معرفی لیست 35 مبتکر زیر 35 سال برای سال 2026 نسل بعدی علم و فناوری چگونه خواهد بود؟ آخرین فهرست مبتکران زیر 35 سال ما یک نگاه اجمالی را ارائه می دهد. هر سال، ما 35 نفر را از سراسر جهان می شناسیم که در حال انجام کارهای علمی پیشگامانه و ایجاد راه حل های فنی هوشمندانه برای مشکلات چسبنده هستند. با یافتن برترین نوآوران جوان در سطح جهان و یادگیری آنچه که آنها بر روی آنها تمرکز کرده اند، هدف ما این است که به خوانندگان احساسی از پیشرفت های مورد انتظار در سال های آینده بدهیم. برگزیدگان امسال از بین 550 نامزد انتخاب شدند و 44 داور متخصص به ویراستاران ما در ارزیابی فینالیست ها کمک کردند. هر کدام در یکی از چهار دسته کار می کنند: بیوتکنولوژی، هوش مصنوعی، محاسبات و رباتیک، و آب و هوا و انرژی - و قبلاً پیشرفت واضحی در جهت اهداف خود داشته اند. با 35 نوآور زیر 35 سال که آینده علم و فناوری را شکل می دهند آشنا شوید. به دنیای عنکبوتی خوش آمدید، دنیایی که از طریق تار اندازه گیری می شود، شمارش موجودات اطراف ما برای حفظ حیات بسیار مهم است، اما اغلب فرآیندی پرزحمت و پرهزینه است که همچنان شکاف هایی باقی می گذارد. DNA محیطی یا eDNA با تجزیه و تحلیل مواد ژنتیکی که توسط موجودات زنده ریخته می‌شود، جایگزین امیدوارکننده‌ای است. اخیراً، تارهای عنکبوت به عنوان یک معدن طلای eDNA پدیدار شده اند، زیرا آنها مواد خالقان عنکبوتی خود، طعمه خود و ریزه های زیستی مانند بزاق و گرده گیاهان و حیوانات مجاور را به دام می اندازند. مطالعات هیچ ابزار غیرفعالی را با توانایی تار عنکبوت در شناسایی مهره داران"}, {"source": "MIT Tech Review", "title": "This founder is teaching chips how to recycle (their energy)", "link": "https://www.technologyreview.com/2026/09/08/1142079/hannah-earley-computer-chips-recycle-energy/", "summary": "Throughout the history of the computer chip, engineers have treated waste heat as an inevitable cost of a calculation. Hannah Earley, however, thinks it’s a design choice. Earley, 31, is cofounder and chief technology officer of Vaire Computing, a startup building chips that recycle energy usually thrown away as heat—a strategy known as reversible computing. Ultimately, she thinks, this approach could help make data centers (and our laptops and phones) much more energy efficient. When conventional computer chips perform calculations, they erase the information they no longer need along the way, dissipating energy as heat in the process. Earley compares the approach to racing through a city only to pump the brakes at every intersection: The car loses momentum and must burn more fuel to accelerate again. Reversible computing aims to keep the momentum going—instead of erasing information from the intermediate steps in a calculation, the circuit retains it, making it possible to run the computation backward and recover some of the energy. While the idea was first proposed more than 50 years ago, it proved impractical to implement with existing transistors and circuits. Earley, though, has completely rethought the hardware needed to make energy recovery work. She designed a patent-pending type of resonator—a microscopic chip component that stores recovered energy for later reuse. “It’s really a glorified pendulum,” she says. Last year, Vaire announced a key breakthrough: a chip with a resonator that recovered more energy than it lost, even after the energy needed to power the component was taken into account. For a subfield that has existed mostly in theory, the result was proof of life. “It’s clear they have something interesting,” says Igor Markov, a researcher in electronic design automation and a former professor at the University of Michigan, Ann Arbor. Still, he says, the technology is quite early stage; the company will need “a series of increasingly realistic and convincing demonstrations to attract the industry support needed for commercialization.” She gradually became convinced that the connection between information, energy, and heat could change computers forever. Earley’s journey into chip design started sooner than most. She began programming around the age of nine, starting with high-level coding for the web before digging into other programming languages like Perl and Java. She continued progressing to more and more abstract layers of computing", "date_str": "2026-09-08T10:36:00+00:00", "hash": "237ba2acb1a43091e62bceef212c47b1b320227959d8fb15db00788675e3c0fa", "title_fa": "این بنیانگذار در حال آموزش تراشه ها است که چگونه بازیافت کنند (انرژی آنها)", "summary_fa": "در طول تاریخچه تراشه های کامپیوتری، مهندسان گرمای اتلاف را به عنوان هزینه اجتناب ناپذیر یک محاسبه در نظر گرفته اند. هانا ارلی، با این حال، فکر می کند که این یک انتخاب طراحی است. ارلی، 31 ساله، یکی از بنیانگذاران و مدیر ارشد فناوری Vaire Computing است، یک استارت‌آپ ساخت تراشه‌هایی که انرژی را که معمولاً به عنوان گرما دور ریخته می‌شود بازیافت می‌کند – استراتژی که به عنوان محاسبات برگشت‌پذیر شناخته می‌شود. در نهایت، او فکر می‌کند، این رویکرد می‌تواند به کارآمدتر کردن مراکز داده (و لپ‌تاپ‌ها و تلفن‌های ما) در مصرف انرژی کمک کند. هنگامی که تراشه‌های رایانه‌ای معمولی محاسباتی را انجام می‌دهند، اطلاعاتی را که دیگر به آن‌ها نیازی ندارند در طول مسیر پاک می‌کنند و انرژی را به عنوان گرما در این فرآیند هدر می‌دهند. Earley رویکرد مسابقه در یک شهر را فقط برای پمپ کردن ترمز در هر تقاطع مقایسه می کند: ماشین حرکت خود را از دست می دهد و برای شتاب گرفتن دوباره باید سوخت بیشتری بسوزاند. محاسبات برگشت‌پذیر با هدف حفظ حرکت حرکتی است - به جای پاک کردن اطلاعات از مراحل میانی در یک محاسبه، مدار آن را حفظ می‌کند و امکان اجرای محاسبات به عقب و بازیابی بخشی از انرژی را فراهم می‌کند. در حالی که این ایده برای اولین بار بیش از 50 سال پیش ارائه شد، اجرای آن با ترانزیستورها و مدارهای موجود غیرعملی بود. با این حال، Earley به طور کامل در مورد سخت افزار مورد نیاز برای بازیابی انرژی تجدید نظر کرده است. او یک نوع تشدید کننده در انتظار ثبت اختراع طراحی کرد - یک جزء تراشه میکروسکوپی که انرژی بازیافت شده را برای استفاده مجدد بعدی ذخیره می کند. او می‌گوید: «این واقعاً یک آونگ شکوهمند است. سال گذشته، Vaire یک پیشرفت کلیدی را اعلام کرد: تراشه‌ای با تشدیدگر که حتی پس از"}, {"source": "MIT Tech Review", "title": "This AI entrepreneur is developing agents that can plan ahead for the unexpected", "link": "https://www.technologyreview.com/2026/09/08/1142088/danijar-hafner-developing-plan-ahead-agents/", "summary": "Danijar Hafner’s office in San Francisco’s SoMa district sits mostly empty. His brand-new startup is still in stealth mode and doesn’t even have its name on the door. On the day I visit, there’s only one other person there, and little in the way of furniture. But what it lacks in decor, it makes up for in robots. Humanoids of various shapes and sizes hang like marionettes from racks that run down the center of the wide-open space. While Hafner, 31, won’t say too much about his new venture just yet, he describes it as a continuation of his longtime work to enable AI to navigate environments it has not encountered in training. The humanoids, which he imports from China, are the next evolution of this work—and its physical embodiment. Their ability to react in previously untested scenarios will be key to getting robots into human spaces. Because if you want to send a robot into a person’s home, for example, it needs to be able to handle a floor plan and furniture it’s never seen before. To achieve this, Hafner relies on something called model-based reinforcement learning. He develops world models—AI models designed to emulate physical reality—and trains agents within them. The agent essentially treats the model as a real-world simulation and learns how to act there. It then uses those experiences to make predictions (to dream or imagine, Hafner might say) about future outcomes. That allows agents—or the robots they’re embedded in—to navigate unfamiliar situations IRL. “I get to interact with a lot of really smart people in research at Google, and he easily sits in the top half of 1%.” Timothy Lillicrap, Google DeepMind Unlike other efforts, Hafner’s technique enables agents and the robots they control to execute massively complicated tasks without the real-world trial-and-­error training that’s traditionally been used in robotics. Hafner grew up in a rural town in northeastern Germany, where his parents were both classical musicians. He learned programming from a neighbor, and in high school he began taking online courses about AI, which quickly developed into a passion. “I was always fascinated with how thinking works,” he says. AI offered him a way to emulate it on a computer. In 2015, as a second-year under­graduate studying engineering at Hasso Plattner Institute in Potsdam, he won a role as a student researcher at Google Brain. From there, he went on to a dozen internships and other positions at the company, including stints with Google Brain and Google ", "date_str": "2026-09-08T10:34:00+00:00", "hash": "4bb7beeaef8b93809ed456de629243d38cd493fd964163dd8e832535c5901467", "title_fa": "این کارآفرین هوش مصنوعی در حال توسعه عواملی است که می توانند از قبل برای موارد غیرمنتظره برنامه ریزی کنند", "summary_fa": "دفتر دانیجار هافنر در منطقه SoMa سانفرانسیسکو عمدتاً خالی است. استارت‌آپ جدید او هنوز در حالت مخفی کاری است و حتی نامش روی در نیست. روزی که من بازدید می‌کنم، فقط یک نفر دیگر آنجاست، و اثاثیه کمی وجود دارد. اما آنچه در دکور کم دارد، در روبات ها جبران می کند. انسان نماهایی با اشکال و اندازه های مختلف مانند ماریونت ها از قفسه هایی آویزان می شوند که در مرکز فضای باز قرار دارند. در حالی که هافنر، 31 ساله، هنوز چیز زیادی در مورد سرمایه گذاری جدید خود نمی گوید، او آن را به عنوان ادامه کار طولانی مدت خود توصیف می کند تا هوش مصنوعی را قادر سازد محیط هایی را که در آموزش با آن ها مواجه نشده است، هدایت کند. انسان نماهایی که او از چین وارد می کند، تکامل بعدی این اثر و تجسم فیزیکی آن است. توانایی آنها برای واکنش در سناریوهای آزمایش نشده قبلی کلید ورود ربات ها به فضاهای انسانی خواهد بود. برای مثال، اگر می‌خواهید یک ربات را به خانه شخصی بفرستید، باید بتواند پلان و مبلمانی را که قبلاً دیده نشده است، کنترل کند. برای دستیابی به این هدف، هافنر بر چیزی به نام یادگیری تقویتی مبتنی بر مدل تکیه می کند. او مدل‌های جهانی را توسعه می‌دهد - مدل‌های هوش مصنوعی که برای تقلید از واقعیت فیزیکی طراحی شده‌اند - و عوامل درون آن‌ها را آموزش می‌دهد. عامل اساساً با مدل به عنوان یک شبیه سازی دنیای واقعی برخورد می کند و یاد می گیرد که چگونه در آنجا عمل کند. سپس از این تجربیات برای پیش‌بینی (به گفته هافنر، برای رویا یا تصور کردن) در مورد نتایج آینده استفاده می‌کند. این به عوامل - یا ربات‌هایی که در آنها تعبیه شده‌اند - اجازه می‌دهد موقعیت‌های ناآشنا را در IRL هدایت کنند. من با افراد بسیار باهوشی"}, {"source": "MIT Tech Review", "title": "This founder is making cheaper, cleaner steel", "link": "https://www.technologyreview.com/2026/09/08/1142094/laureen-meroueh-makes-cheaper-cleaner-steel/", "summary": "The steel industry isn’t exactly known for innovation. Very little has changed about purifying iron ore since the process was invented and commercialized in the 1850s. The majority of steelmakers melt solid iron ore at dizzyingly high temperatures inside blast furnaces, where the material reacts with gases to trigger chemical reactions that remove oxygen. It then undergoes further refining to purify it before it is made into products like rebar and car frames. The process relies on coal, and it generates roughly 7% of the carbon emissions that drive climate change—about as much as the fashion industry. Decarbonization has proved difficult: Profit margins are tight and furnaces have long service lives, making investment tough to justify. Now Laureen Meroueh may have found a way to clean up steelmaking without driving up the price. Meroueh, the founder of Hertha Metals, invented a new furnace that simplifies the chemistry behind the process. Her method turns iron ore into refined liquid steel in a single step, and it swaps coal for natural gas. Together, those changes slash emissions by at least half, she says, and cut costs by 25% compared with steelmaking business as usual. If it catches on, the tech could be transformative. “There’s huge value in reducing the size of this production system,” says Iryna Zenyuk, director of the National Fuel Cell Research Center at the University of California, Irvine. “They’re massive. They’re inefficient and require a lot of energy input, so even if they just save energy efficiency, that’s already a big step.” Hertha’s approach focuses on what it can fix about the steel industry now, as opposed to waiting around for a zero-carbon system. Still, it’s a risky endeavor, but pushing limits isn’t new for Meroueh. At 12 she was accepted into a pilot program to take college-­level courses through Florida Atlantic University in lieu of a traditional secondary education. She was immediately drawn to engineering and explored topics including calculus and ocean wave energy. Despite the rigorous coursework, she would spend hours sitting in trees and surfing, which fostered a deep appreciation for nature and a desire to safeguard it. “I don’t know how you can’t be drawn toward trying to help protect that,” she says. Now 34, Meroueh has let that passion inform her professional goals. After finishing her PhD in mechanical engineering at MIT, she led a green hydrogen startup before founding Hertha in 2022. A first-generation Lebanese-Ame", "date_str": "2026-09-08T10:33:00+00:00", "hash": "bf75229c8ce17b10b245493b7f462671e1f3f6a8738333193d608b093c87c79a", "title_fa": "این موسس فولاد ارزان تر و تمیزتر می سازد", "summary_fa": "صنعت فولاد دقیقاً برای نوآوری شناخته شده نیست. از زمان اختراع و تجاری سازی این فرآیند در دهه 1850، مقدار کمی در مورد تصفیه سنگ آهن تغییر کرده است. اکثر فولادسازان سنگ آهن جامد را در دمای سرگیجه‌آوری بالا در داخل کوره‌های بلند ذوب می‌کنند، جایی که این ماده با گازها واکنش می‌دهد و باعث واکنش‌های شیمیایی می‌شود که اکسیژن را حذف می‌کند. سپس قبل از اینکه به محصولاتی مانند میلگرد و قاب ماشین تبدیل شود، تصفیه بیشتر می شود تا خالص شود. این فرآیند به زغال سنگ متکی است و تقریباً 7 درصد از انتشار کربنی را که باعث تغییرات آب و هوایی می شود تولید می کند - تقریباً به اندازه صنعت مد. کربن زدایی دشوار بوده است: حاشیه سود تنگ است و کوره ها عمر طولانی دارند و توجیه سرمایه گذاری را دشوار می کند. حالا ممکن است لورین مروئه راهی برای تمیز کردن فولادسازی بدون افزایش قیمت پیدا کرده باشد. Meroueh، بنیانگذار هرتا متالز، کوره جدیدی اختراع کرد که شیمی پشت این فرآیند را ساده می کند. روش او سنگ آهن را در یک مرحله به فولاد مایع تصفیه شده تبدیل می کند و زغال سنگ را با گاز طبیعی تعویض می کند. او می‌گوید که این تغییرات در مجموع، انتشار گازهای گلخانه‌ای را به نصف کاهش می‌دهد و هزینه‌ها را در مقایسه با کسب و کار معمول فولادسازی تا ۲۵ درصد کاهش می‌دهد. اگر آن را جلب کند، فناوری می تواند تحول آفرین باشد. Iryna Zenyuk، مدیر مرکز ملی تحقیقات سلول سوختی در دانشگاه کالیفرنیا، ایروین، می‌گوید: کاهش اندازه این سیستم تولید ارزش زیادی دارد. «آنها عظیم هستند. آنها ناکارآمد هستند و به ورودی انرژی زیادی نیاز دارند، بنابراین حتی اگر صرفه جویی در مصرف انرژی داشته باشند، این یک قدم بزرگ است.\" رویکرد هرتا بر روی آنچه می تواند در مورد صنعت فولاد در"}, {"source": "MIT Tech Review", "title": "This geneticist’s age-reversal tech could help restore sight", "link": "https://www.technologyreview.com/2026/09/08/1142074/yuancheng-ryan-lu-age-reversal-tech-restores-sight/", "summary": "Yuancheng (Ryan) Lu is obsessed with aging. And with eyes. As he steps outside the Whitehead Institute in Cambridge, Massachusetts, his aviator glasses darken automatically in the sun. Age-related blindness runs in his family. A great-aunt in China, the story goes, was killed crossing a road because she couldn’t see oncoming traffic. And Lu’s own 23andMe test came back with a mutation for macular degeneration, a top cause of vision loss in old age. Exposure to bright sunlight is another risk factor—thus the shades. “They protect me,” he says. “Plus, they look cool.” Lu, 34, works on gene therapies to prevent age-related vision loss. “I think the eye is a really unique system to study aging and rejuvenation,” he says. “I could give a whole presentation.” Pushing up my reading glasses, I lean in to listen. Lu is behind one of the coolest results in rejuvenation science—and in eye research. In 2018, while earning his PhD at Harvard Medical School, he used an age-reversal technique called reprogramming to repair the optic nerves of mice. He crushed the nerves, blinding the animals, and then injected the cells with a gene therapy meant to restore them to a youthful state. Sixteen days later, the nerves were growing back, their axons showing up through a microscope as spidery orange filaments. As hype around age reversal swirls, Lu has been busy in the lab searching for what he calls “the next generation of rejuvenation therapies.” The head of that lab, the longevity scientist David Sinclair, remembers when Lu texted him the pictures: “He asked me, ‘What do you see here?’ And I said, ‘I see the future.’” Later tests carried out in a box with rotating bars of light showed the mice were tracking the changes. They could see again. This year, nearly the exact genetic therapy Lu created for mice entered human clinical trials. On June 9, the startup Life Biosciences, which Sinclair cofounded and in which Lu owns a small stake, announced it had injected the treatment into the eye of a person with glaucoma. The trial has been big news. A headline in the New York Times suggested the technology could “change humanity.” Posters on X gushed, with one declaring that “the fountain of youth is here.” “It’s remarkable that what he developed as a student is now going into humans,” says Sinclair of the treatment, now called ER-100. “It’s barely even changed since he built it.” Reprogramming refers to an age-­restoring process that takes place inside an embryo. It’s why babies are", "date_str": "2026-09-08T10:32:00+00:00", "hash": "2abec6ccb1f6b1c3d556eedfa24de2f6ce18597b8f4371e033de1b4a3ac9adcc", "title_fa": "فناوری معکوس سن این متخصص ژنتیک می تواند به بازیابی بینایی کمک کند", "summary_fa": "یوانچنگ (رایان) لو شیفته پیری است. و با چشم. همانطور که او از موسسه وایتهد در کمبریج ماساچوست خارج می شود، عینک خلبانی او به طور خودکار زیر نور خورشید تیره می شود. نابینایی ناشی از افزایش سن در خانواده او وجود دارد. داستان از این قرار است که یک خاله بزرگ در چین هنگام عبور از جاده کشته شد، زیرا نمی توانست ترافیک روبرو را ببیند. و آزمایش 23andMe خود لو با یک جهش برای دژنراسیون ماکولا، یکی از دلایل اصلی کاهش بینایی در سنین بالا، بازگشت. قرار گرفتن در معرض نور شدید خورشید یکی دیگر از عوامل خطر - بنابراین سایه ها است. او می گوید: «آنها از من محافظت می کنند. \"به علاوه، آنها باحال به نظر می رسند.\" لو، 34 ساله، روی ژن درمانی برای جلوگیری از کاهش بینایی مرتبط با افزایش سن کار می کند. او می گوید: «من فکر می کنم چشم یک سیستم واقعا منحصر به فرد برای مطالعه پیری و جوان سازی است. \"من می توانم یک ارائه کامل ارائه دهم.\" با فشردن عینک مطالعه، به داخل خم شدم تا گوش کنم. لو پشت یکی از جالب ترین نتایج در علم جوانسازی و در تحقیقات چشم است. در سال 2018، در حالی که دکترای خود را در دانشکده پزشکی هاروارد دریافت می کرد، از یک تکنیک تغییر سن به نام برنامه ریزی مجدد برای ترمیم اعصاب بینایی موش ها استفاده کرد. او اعصاب را خرد کرد، حیوانات را کور کرد و سپس سلول‌ها را با یک ژن درمانی تزریق کرد تا آنها را به حالت جوانی بازگرداند. شانزده روز بعد، اعصاب دوباره در حال رشد بودند، آکسون‌های آن‌ها از طریق میکروسکوپ به‌صورت رشته‌های نارنجی عنکبوتی نشان داده شد. از آنجایی که هی k. Having curtains that are too short can make your space feel incomplete. Your curtains should graze the floor, according to some designers. Shutterstock Lauren White, owner and principal designer at Ellen W. Interior Concepts , said curtains should always hit the floor. This generally helps a space look larger and more polished. \"Curtains that are too short are like wearing high-water pants,\" she said. \"It does not look good and makes your space look unfinished.\" There are rare exceptions to this — for example, if you're dealing with a window above a sink or bathtub. A rug that s too small can throw off an entire room. A small rug can throw off the proportions of a space. Klaus Vedfelt/Getty Images A high-quality rug isn't cheap — and the bigger you go, the more expensive they become. Because of this, you may be tempted to choose a smaller, more affordable option, even if it means sacrificing aesthetics. If that's the case, and your rug won't be properly scaled to your space, you're probably better off skipping a rug altogether, White said. \"A rug that is too small takes away from the space, although you would hope it adds visual value,\" she told BI. The \"right\" size of a rug varies depending on the room. However, at the very least, White said, your rug should at least be able to sit under the front legs of your furniture pieces, Ordering furniture without measuring your space can lead to expensive mistakes. Shutterstock It may seem like a no-brainer, but taking the time to measure your space is a crucial first step to creating a successful design , White said. Even better, try envisioning how an item will sit in your space by using a bit of tape. \"Get the dimensions of the furniture you're interested in, grab some blue painter's tape, and create the shape of the furniture with the painter's tape and dimensions,\" she said. \"Thi", "date_str": "2026-09-08T13:16:02+00:00", "hash": "5ff9233e22dfc1c5429d0d5c0692612c3c8e8cf0c2a483fd42a55549e4a59808", "title_f eader in the corporate world. She resigned and worked as a waitress to give herself time to figure out what was next. Although she doesn't regret her decision, she said leaving the corporate world isn't for everyone. This as-told-to essay is based on a conversation with Lisa Eder . It has been edited for length and clarity. For 10 years, I worked my way up in luxury hospitality , eventually becoming a director at a high-end hotel group. It had always been my dream position, and I loved my job. Everything about it was exciting, and no two days were ever the same. There were important VIP arrivals, high-profile events, and constant challenges. I became consumed by it all. The job was a lifestyle, and for a decade, it was the lifestyle I wanted for myself. I loved working 12-hour days , most days of the week. I loved leading a team of 100 people and six department heads. I loved the responsibility, the pace, and having to be \"on\" all the time. But I didn't have much of a life outside work. The job was my life. When my husband and I moved from Austria to Australia in January 2024 for his job, however, my mindset about work began to change. I didn't burn out Australians are generally more relaxed about work. I saw how much they enjoyed the different aspects of life outside their jobs, and I found myself wanting the same for my own life. Slowly, I began to wonder whether I had outgrown my career . I hadn't burned out. I didn't hate my job. In fact, I still loved many aspects of it. It just no longer felt like it was for me. I no longer wanted to fit into the corporate box. I wanted something else. Lisa Eder says moving to Australia made her reconsider her career. Courtesy of Lisa Eder I wanted to have dinner with my husband at night and completely switch off from the day. I wanted the autonomy to decide how I spent my time. I wanted to discover new hobbies and interests that made me feel alive again. For months, I sat with these newly emerging desires, trying to work out what to do with them. I asked myself what I wanted from life I had spent years working to get where I was professionally. What would other people think? Was I giving up? Was I throwing away everything I had worked so hard for? At the same time, I was asking myself bigger questions: What did I actually want from my life? Who was I now? What were my values? Thro", "date_str": "2026-09-08T12:38:01+00:00", "hash": "6b901cfcbb8878009e308137fe130bf09430d4a3bf3b2b0e70de8c89c15fa6d8", "title_fa": "من 12 ساعت در روز در یک شغل شرکتی که دوست داشتم کار می کردم. می‌خواستم زندگی‌ام برگردد، بنابراین استعفا دادم و اکنون پیشخدمت هستم.", "summary_fa": "لیزا ادر کار شرکتی خود را بدون هیچ برنامه ای ترک کرد. با حسن نیت از لیزا ادر لیزا ادر زنی 36 ساله در سیدنی است که حرفه خود را به عنوان یک رهبر در دنیای شرکت ترک کرد. او استعفا داد و به عنوان پیشخدمت مشغول به کار شد تا به خودش فرصت دهد تا بفهمد که چه اتفاقی می افتد. اگرچه او از تصمیم خود پشیمان نیست، اما گفت که ترک دنیای شرکت ها برای همه مناسب نیست. این مقاله گفته شده بر اساس گفتگو با لیزا ادر است. برای طول و وضوح ویرایش شده است. به مدت 10 سال، من در مهمان نوازی لوکس کار کردم و در نهایت مدیر یک گروه هتل های سطح بالا شدم. همیشه این موقعیت رویایی من بود و عاشق شغلم بودم. همه چیز در مورد آن هیجان انگیز بود و هیچ دو روزی مثل هم نبود. ورودهای مهم VIP، رویدادهای برجسته و چالش‌های مداوم وجود داشت. من از همه اینها مست شدم. این شغل یک سبک زندگی بود و برای یک دهه، سبک زندگی ای بود که من برای خودم می خواستم. من عاشق 12 ساعت کار در روزهای هفته، بیشتر روزهای هفته بودم. من عاشق رهبری تیمی متشکل از 100 نفر و شش رئیس بخش بودم. من مسئولیت پذیری، سرعت و این که همیشه \"روشن\" باشم را دوست داشتم. اما من زندگی بیرون از کار زیاد نداشتم. شغل زندگی من بود. وقتی من و شوهرم در ژانویه 2024 برای کارش از اتریش به استرالیا نقل مکان کردیم، ذهنیت من در مورد کار شروع به تغییر کرد. من نسوختم استرالیایی ها عموماً در کار آرامش بیشتری دارند. دیدم که آنها چقدر از جنبه های مختلف زندگی خارج از شغلشان لذت می برند، و متوجه شدم که همین را برای زندگی خودم می خواهم. آهسته آهسته به این فکر کردم که آیا"}, {"source": "Business Insider", "title": "A new TSA program means you can get through security without a plane ticket at some airports", "link": "https://www.businessinsider.com/tsa-gateside-pass-security-no-plane-ticket-us-airports-2026-9", "summary": "A TSA agent at a TSA PreCheck lane. Joe Raedle/Getty Images The TSA has launched a program that allows you to go through airport security without a plane ticket. Gateside will let people meet friends for a meal, shop, or see off loved ones, the TSA said. To begin with, 13 airports nationwide will take part, but a bigger rollout is planned. Saying goodbye to a friend who's flying to a new country, or maybe you just really want to do some shopping in an airport terminal ? Well, now you can go through security without an airline ticket as the Transportation Security Administration has launched a program called Gateside. Members of TSA PreCheck and other trusted-traveler programs can apply for a Gateside pass at 13 airports across the US, including three of the 10 busiest in the country — Dallas Fort Worth, LAX, and Las Vegas Harry Reid. The TSA says the program is expected to roll out to more airports in the coming months. It added that availability may be limited during peak times, and Gateside visitors are held to the same airport code of conduct rules as ticketed passengers. Saying goodbye or welcoming your loved ones at the gate While airlines occasionally issue gate passes — such as when accompanying a traveling minor — Gateside lets people past security for a variety of reasons. The TSA listed examples like \"joining a friend with a long layover for a meal, meeting with a business associate or employee, or visiting dining and retail establishments in the airport.\" Also, unlike a traditional gatepass, you could use the expedited PreCheck security lanes. Children can also pass through security as visitors on a Gateside pass. Gateside is free, and the TSA says you should apply between one and three days before your planned visit. If approved, you wouldn't get a digital or physical pass. Instead, you would show a TSA officer your ID and the portal dashboard on your mobile device, which shows your approved Gateside status. Passes are valid for one calendar day and allow for re-entry on that date. Here's the full list of airports currently taking part: Clinton National Airport (LIT) in Little Rock, Arkansas. Dallas/Fort Worth International Airport (DFW) in Texas. Detroit Metropolitan Wayne County Airport (DTW) in Michigan. Eppley Airfield (OMA) in Omaha, Nebraska. Harry Reid International Airport (LAS) in Las Vegas, Nevada. Indianapolis International Airport (IND) in Indiana. John Glenn Columbus International Airport (CMH) in Ohio. Los Angeles International Ai", "date_str": "2026-09-08T12:36:03+00:00", "hash": "59253be47211fd2e2cd81d292ff9154b9c561c949a2bc39d9ad300ecc705f184", "title_fa": "یک برنامه جدید TSA به این معنی است که می توانید بدون بلیط هواپیما در برخی فرودگاه ها از امنیت عبور کنید", "summary_fa": "یک نماینده TSA در یک خط TSA PreCheck. Joe Raedle/Getty Images TSA برنامه ای را راه اندازی کرده است که به شما امکان می دهد بدون بلیط هواپیما از امنیت فرودگاه عبور کنید. TSA گفت که Gateside به مردم این امکان را می دهد که با دوستان خود برای صرف غذا، خرید یا بدرقه عزیزان خود ملاقات کنند. برای شروع، 13 فرودگاه در سراسر کشور شرکت خواهند کرد، اما قرار است راه اندازی بزرگ تری انجام شود. خداحافظی با دوستی که در حال پرواز به کشوری جدید است، یا شاید واقعاً می خواهید در ترمینال فرودگاه خرید کنید؟ خوب، اکنون می توانید بدون بلیط هواپیما از امنیت عبور کنید زیرا اداره امنیت حمل و نقل برنامه ای به نام Gateside راه اندازی کرده است. اعضای TSA PreCheck و سایر برنامه‌های مورد اعتماد مسافران می‌توانند در 13 فرودگاه در سراسر ایالات متحده، از جمله سه فرودگاه از 10 شلوغ‌ترین فرودگاه این کشور - دالاس فورت ورث، LAX، و هری رید لاس‌وگاس، برای دریافت مجوز Gateside درخواست دهند. TSA می گوید انتظار می رود این برنامه در ماه های آینده در فرودگاه های بیشتری اجرا شود. این سازمان افزود که در زمان اوج مصرف ممکن است در دسترس بودن محدود باشد و بازدیدکنندگان Gateside از قوانین رفتاری فرودگاهی مشابه با مسافران بلیت‌دار تبعیت می‌کنند. خداحافظی یا خوشامدگویی به عزیزانتان در دروازه در حالی که خطوط هوایی گهگاه مجوزهای گیت را صادر می کنند - مانند هنگام همراهی یک خردسال در سفر - Gateside به دلایل مختلف به افراد اجازه می دهد از امنیت عبور کنند. TSA مثال هایی مانند \"پیوستن به یک دوست با یک استراحت طولانی برای یک وعده غذایی، ملاقات با یک همکار تجاری یا کارمند، یا بازدید از رستوران ها و مراکز خرده فروشی در فرودگاه\" فهرست کرده است. همچنین، بر خلاف یک گیت گذر سنتی، می توانید از"}, {"source": "Business Insider", "title": "I'm an airline employee who flies for free, sometimes even in business class. It's an incredible perk, but there's one major catch.", "link": "https://www.businessinsider.com/airline-employee-flies-for-free-one-major-catch-standby-travel-2026-9", "summary": "I m an airline employee who sees the world for essentially free thanks to my flight benefits. Shayan Hossain I'm an airline employee who flies essentially for free on a whim, but only if a seat is open. I can often see flight loads ahead of time, but piecing together flights can be a game of Tetris. I've gotten stuck overseas for days and sometimes have to buy a costly ticket home. From the outside, flying standby as an airline employee — what we call \"non-revving\" in the industry — looks like unlimited, practically free flights, whenever you want, wherever you want. It almost sounds too good to be true. I've flown business class to Switzerland for a weekend just to ride a train past the Matterhorn. I've hopped on a semi-private jet with JSX like it was an Uber. I've left for Paris on a random Friday, spent 48 hours staring at the Eiffel Tower, and been back at work on Monday. Over 44,000 people follow me because I can decide on a whim that I want to see the Great Wall of China, and then just… go. It's an incredible opportunity to see the world on demand, and I don't take it for granted. But those of us on the inside know that the standby travel game is really a gamble every single time. You don't have a guaranteed seat on a flight; you only have a chance of getting one. Non-revving on JSX can be tricky because it uses a private terminal that is often separate from the main passenger concourse. Shayan Hossain That's because non-rev passengers only get the empty seats left over after paying customers are seated. If the flight is full, you don't get on. It's that simple, and it can actually be quite challenging in practice. There are also strict rules: we can't use flight benefits if we call out sick, and we are always representing our airline — so dressing nice and being kind and patient to the staff, even if plans are falling apart, is a must. I can fly almost anywhere at any time, but only if a seat is open Non-revving comes down to seat availability. I can see most flight loads in advance, but those numbers can change at the last minute as paying passengers book and more senior employees list for the flight. And sometimes flights are weight-restricted, so even with empty seats, no extras can get on. I've stood at gates watching a flight push back without me more times than I'd like to admit. Most of the time, it's a minor inconvenience: I'll find another route while I'm at the airport, get home a little later, then laugh about it the next day on camera. ", "date_str": "2026-09-08T12:18:01+00:00", "hash": "0f714d29d2e95f32d767ed99e9f220bd880e527f44b6b12aa08af9a40ec4cd11", "title_fa": "من یک کارمند هواپیمایی هستم که به صورت رایگان پرواز می کنم، حتی گاهی اوقات در کلاس تجاری. این یک امتیاز باورنکردنی است، اما یک نکته مهم وجود دارد.", "summary_fa": "من یک کارمند هواپیمایی هستم که به لطف مزایای پروازم دنیا را اساساً رایگان می بینم. شایان حسین من یک کارمند هواپیمایی هستم که اساساً به صورت رایگان پرواز می کنم، اما فقط در صورتی که صندلی باز باشد. من اغلب می توانم بارهای پرواز را زودتر از موعد ببینم، اما کنار هم قرار دادن پروازها می تواند یک بازی تتریس باشد. من برای روزها در خارج از کشور گیر کرده ام و گاهی اوقات مجبور به خرید بلیط گران قیمت خانه هستم. از بیرون، پرواز در حالت آماده به کار به عنوان یک کارمند خطوط هوایی - چیزی که ما در صنعت آن را \"غیر چرخشی\" می نامیم - مانند پروازهای نامحدود و عملاً رایگان به نظر می رسد، هر زمان که بخواهید، هر کجا که بخواهید. تقریباً خیلی خوب به نظر می رسد که درست باشد. من برای یک آخر هفته با کلاس تجاری به سوئیس رفته ام تا از کنار ماترهورن با قطار عبور کنم. من سوار یک جت نیمه خصوصی با JSX شده ام که انگار اوبر بوده است. من در یک جمعه تصادفی عازم پاریس شدم، 48 ساعت را به برج ایفل خیره کردم و دوشنبه سر کار برگشتم. بیش از 44000 نفر من را دنبال می کنند، زیرا می توانم تصمیم بگیرم که می خواهم دیوار بزرگ چین را ببینم، و سپس... بروم. این یک فرصت باورنکردنی برای دیدن جهان در صورت تقاضا است، و من آن را بدیهی نمی‌دانم. اما کسانی از ما که در داخل هستیم می دانیم که بازی سفر در حالت آماده به کار واقعاً هر بار یک قمار است. شما صندلی تضمینی در پرواز ندارید. شما فقط شانس دریافت یکی را دارید عدم چرخش در JSX می تواند مشکل باشد زیرا از یک ترمینال خصوصی استفاده می کند که اغلب از محل اقامت مسافر اصلی جدا است. شایان حسین"}, {"source": "Business Insider", "title": "Mark Cuban shared a 10-point checklist for towns getting their first data center", "link": "https://www.businessinsider.com/mark-cuban-data-center-tips-town-planning-ai-infrastructure-2026-9", "summary": "Mark Cuban says towns have more leverage over AI data centers than they think. Shafkat Anowar/The Dallas Morning News via Getty Images In a series of X posts, billionaire Mark Cuban laid out how he thinks towns should approach data centers. Cuban advised towns to set limits on water use and noise, and to secure money for decommissioning. Living near data centers has become a hot-button issue as AI infrastructure spending booms. Mark Cuban is urging local governments to negotiate harder before approving data centers, saying towns should secure enforceable protections while they still have leverage. In a series of X posts on Monday, the billionaire tech entrepreneur shared a 10-part playbook for communities considering their first project. His basic rule: Every major promise from a developer should have a measurable limit, independent oversight, financial backing, and a practical remedy if it is broken. # A town's first data center: what to require before saying yes A data center can bring construction employment, tax base, and infrastructure investment. It can also impose demands on electricity, water, public services, and nearby neighborhoods that last for decades and outlive… — Mark Cuban (@mcuban) September 8, 2026 Cuban said towns should hire their own lawyers and technical advisors, assess the project's entire planned build-out, and impose clear limits on water consumption, noise, backup generation, and infrastructure costs. He also called for upfront decommissioning funds and guarantees from financially credible parent companies. Cuban paid particular attention to water use and noise, warning that \"closed-loop\" cooling systems can still consume water during hot weather and arguing that conventional noise limits may fail to capture the low-frequency hum produced by cooling equipment, which has become emblematic of many complaints about data centers . ## 5. Protect neighbors from noise before the equipment is ordered Noise is now the most common post-approval complaint and the most active area of litigation, including proposed class actions in Wisconsin and Mississippi alleging sound carrying more than a mile past the… — Mark Cuban (@mcuban) September 8, 2026 Cuban also called for protection against stranded infrastructure costs if a project is delayed or abandoned. His proposals included upfront decommissioning funds, parent-company guarantees, and cash escrow or letters of credit before construction begins. It's not Cuban's first warning about the dat", "date_str": "2026-09-08T10:46:47+00:00", "hash": "b836af3d859364314ee05d9a05bf3e27c576d0bf6efa862794caae59c25cfb5a", "title_fa": "مارک کوبان یک چک لیست 10 نقطه ای برای شهرهایی که اولین مرکز داده خود را دریافت می کنند به اشتراک گذاشت", "summary_fa": "مارک کوبان می گوید شهرها بیش از آنچه فکر می کنند اهرمی بر مراکز داده هوش مصنوعی دارند. شفقت انوار/ اخبار صبح دالاس از طریق گتی ایماژ در یک سری پست X، میلیاردر مارک کوبان توضیح داد که چگونه شهرها باید به مراکز داده نزدیک شوند. کوبا به شهرها توصیه کرد که محدودیت هایی برای استفاده از آب و سر و صدا ایجاد کنند و پولی را برای از کار انداختن آن تامین کنند. با افزایش هزینه های زیرساخت های هوش مصنوعی، زندگی در نزدیکی مراکز داده به یک موضوع داغ تبدیل شده است. مارک کوبان از دولت‌های محلی می‌خواهد قبل از تأیید مراکز داده، سخت‌تر مذاکره کنند و می‌گوید که شهرها باید در حالی که هنوز اهرمی دارند، از حفاظت‌های قابل اجرا محافظت کنند. در یک سری پست X در روز دوشنبه، این میلیاردر کارآفرین فناوری یک کتاب بازی 10 قسمتی را برای جوامعی که اولین پروژه خود را در نظر می گیرند به اشتراک گذاشت. قانون اساسی او: هر وعده اصلی یک توسعه‌دهنده باید دارای محدودیت قابل اندازه‌گیری، نظارت مستقل، پشتوانه مالی و در صورت شکسته شدن آن یک راه‌حل عملی باشد. # اولین مرکز داده یک شهر: قبل از بله گفتن به چه چیزهایی نیاز داریم یک مرکز داده می تواند اشتغال ساختمانی، پایه مالیاتی و سرمایه گذاری زیرساختی را به همراه داشته باشد. همچنین می‌تواند تقاضاهایی را بر برق، آب، خدمات عمومی و محله‌های مجاور تحمیل کند که برای دهه‌ها دوام می‌آورد و بیشتر از آن ادامه می‌یابد… — Mark Cuban (@mcuban) 8 سپتامبر 2026 کوبایی گفت که شهرها باید وکلا و مشاوران فنی خود را استخدام کنند، کل ساخت برنامه‌ریزی شده پروژه را ارزیابی کنند، و محدودیت‌های واضحی را بر مصرف آب، تولید سر و صدا و هزینه‌های زیرساختی پشتیبان اعمال کنند. او همچنین خواستار دریافت وجوه و ضمانت‌نامه‌های اولیه از کار افتادن شرکت‌های مادر"}, {"source": "Business Insider", "title": "We searched for New York's best-dressed lawyers. These 9 stood out.", "link": "https://www.businessinsider.com/best-dressed-lawyers-new-york-city-2026-9", "summary": "These attorneys know the law. They also know how to make an entrance. Image composite by Zack DeZon as shot for BI Law has a dress code. A navy suit is safe. Black is safer. Shoes should be sensible. The message is clear: Blend in. Never give the jury something to talk about. But a new class of lawyers is finding room for a little more zhuzh . Men are badging into Hudson Yards office towers in vintage sport coats and baseball caps. Women are power suiting in Celine pumps. Even jeans have made their way into firms that once treated them like contraband. The softening of the dress code comes at a moment when lawyers are being forced to think harder about what, exactly, makes them indispensable. Artificial intelligence can already draft briefs, research case law, and dig through piles of documents. Yet, software cannot earn a client's trust. It cannot read a room or persuade a judge. Law is still a people business. And at a time when attorneys are being asked to defend the value only they can provide, some lawyers tell us that personal style is more than self-expression. It is part of how they show clients they are worth their hourly rate . Business Insider asked readers and law firms to nominate New York's best-dressed lawyers. Our judging panel included Business Insider's editor in chief of Life, Joi-Marie McKenzie, fashion editor Leah Faye Cooper, who's worked as digital style director for Vogue, and Roberto Concepción Jr., a former Hearst lawyer, who's now an employee relations senior leader at Instacart. They reviewed 46 nominations and whittled the list down to nine honorees. We then invited the lawyers into our newsroom for a photo shoot and interviews about why they wear what they wear. Vanessa Ajagu, Gibson, Dunn Crutcher LLP .vertical-pair__images { display: flex;/*Remove to avoid stacking on mobile*/ flex-direction: column; gap: 4px; /*Adjust to change space between the images on mobile*/ } .vertical-pair__images .figure { width: 100%; } @media (min-width: 768px) { .vertical-pair__images { flex-direction: row;/*Remove to avoid stacking on mobile*/ align-items: flex-start; gap: 8px; /*Adjust to change space between the images on desktop*/ } .vertical-pair__images .figure { flex: 1; min-width: 0; } /* OPTIONAL: Make the pair wider than the text column on desktop. Remove or comment out this block to revert to default width. Adjust the percentage to control how wide it extends — margin-left should always be half the extra width to keep it centered. Exa", "date_str": "2026-09-08T10:00:01+00:00", "hash": "bbda57429431ca6c9e38745330d7cd2b9eda63686a621d45c278b39b3fc83f94", "title_fa": "ما به دنبال خوش پوش ترین وکلای نیویورک گشتیم. این 9 مورد برجسته بودند.", "summary_fa": "این وکلا قانون را می دانند. آنها همچنین می دانند که چگونه یک ورودی ایجاد کنند. کامپوزیت تصویر توسط Zack DeZon به عنوان عکس برای قانون BI دارای کد لباس است. کت و شلوار نیروی دریایی ایمن است. مشکی امن تر است. کفش باید معقول باشد. پیام واضح است: با هم ترکیب شوید. اما دسته جدیدی از وکلا در حال یافتن فضایی برای کمی بیشتر zhuzh هستند. مردان با کت‌های ورزشی کلاسیک و کلاه بیسبال به برج‌های اداری هادسون یاردز می‌روند. زنان در پمپ های سلین لباس های قدرتی دارند. حتی شلوار جین نیز راه خود را به شرکت هایی باز کرده است که زمانی با آنها مانند کالاهای قاچاق رفتار می کردند. نرم شدن کد لباس در لحظه ای اتفاق می افتد که وکلا مجبور می شوند بیشتر در مورد آنچه که آنها را ضروری می کند فکر کنند. هوش مصنوعی می‌تواند پیش‌نویس خلاصه‌ها، تحقیق در مورد قانون و کاوش در انبوهی از اسناد را داشته باشد. با این حال، نرم افزار نمی تواند اعتماد مشتری را جلب کند. نمی تواند اتاقی را بخواند یا قاضی را متقاعد کند. حقوق هنوز یک تجارت مردمی است. و در زمانی که از وکلای دادگستری خواسته می‌شود که از ارزشی که تنها می‌توانند ارائه کنند دفاع کنند، برخی از وکلا به ما می‌گویند که سبک شخصی بیش از ابراز وجود است. این بخشی از این است که چگونه به مشتریان نشان می دهند که ارزش نرخ ساعتی خود را دارند. Business Insider از خوانندگان و شرکت های حقوقی خواست تا بهترین لباس پوشیدن وکلای نیویورک را نامزد کنند. هیئت داوران ما شامل سردبیر Business Insider، Joi-Marie McKenzie، ویرایشگر مد لیا فی کوپر، که به عنوان مدیر سبک دیجیتال برای Vogue کار می‌کرد، و روبرتو کانسپسیون جونیور، وکیل سابق Hearst، که اکنون مدیر ارشد روابط کارکنان در Instacart است، بود. آنها 46 نامزدی"}, {"source": "Business Insider", "title": "Want to know the Fed’s next move? Watch these 3 economic reports this week.", "link": "https://www.businessinsider.com/fed-rate-hike-three-economic-reports-this-week-to-watch-2026-9", "summary": "Bloomberg/Getty Images Last week's jobs-report surprise gave rate-hike odds a serious jolt. Now comes the make-or-break data. PPI, CPI, and consumer sentiment could tell the Fed whether to move next week. Sign up for First Trade , Business Insider's daily markets newsletter. Following the Federal Reserve is the closest thing market-watchers have to an ongoing soap opera. The \"will they / won't they\" push-and-pull around interest rates can turn on a dime, depending on the day's news. The central bank's next move is always under a microscope. But for the entirety of 2026 so far, the Fed hasn't, well, done anything with rates. At the beginning of the year the expectation was for cuts . Now — with inflation rising — many are clamoring for a hike . Yet we remain unchanged. The Fed's next chance is Sept. 16, just over a week from today, and investors think we could finally see some rate action. They're pricing in a roughly 60% chance of a 25-basis-point hike, up from 52% last Thursday, according to FedWatch data . Why the increase? Thank Friday's jobs report, which saw a blowout 162,000 payrolls added in August, crushing forecasts. The thinking is that strong employment figures give the Fed some runway to raise rates without tanking the economy. The immediate response in the bond market was a sharp spike higher in the 2-year Treasury yield , which is the most sensitive to rates. The gain moderated as the session went on, but the takeaway was clear: a hike is firmly back in play. That ramps up the stakes for the upcoming slate of economic data, which will give the FOMC the final inputs they need to decide on a hike. Here are three data points to watch: 1. Producer prices (Thursday, Sept. 10): PPI will give investors a look at whether the Iran-war oil shock and higher freight costs are building in the inflation pipeline . A hot reading would suggest companies are starting to pass those costs to customers — another argument for the Fed to act. What the Fed is looking for: How much higher energy and supply-chain costs are spreading through the economy. 2. Consumer prices (Friday, Sept. 11): CPI is definitely the most critical of the three data points. July's reading showed some cooling, but investors will be watching if the global energy shock causes an uptick. Fuel costs have been a particular pain point , with diesel prices recently hitting record highs. What the Fed is looking for: Whether inflation is cooling enough to justify holding rates steady. 3. University", "date_str": "2026-09-08T09:50:01+00:00", "hash": "6e223c462e110b092504e34506e494ca64eba59e976a1fa0782528c314be4e3c", "title_fa": "آیا می خواهید حرکت بعدی فدرال رزرو را بدانید؟ این 3 گزارش اقتصادی این هفته را تماشا کنید.", "summary_fa": "بلومبرگ/گتی ایماژ غافلگیری گزارش مشاغل هفته گذشته، شانس افزایش نرخ را تکان جدی داد. اکنون داده های ساخت یا شکست می آید. PPI، CPI، و احساسات مصرف کننده می تواند به فدرال رزرو بگوید که آیا هفته آینده حرکت کند یا خیر. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. پیروی از فدرال رزرو نزدیک ترین چیزی است که ناظران بازار به یک سریال سریالی در حال انجام دارند. بسته به اخبار روز، فشار و کشش \"آیا آنها / نمی کنند\" در اطراف نرخ های بهره می تواند یک سکه باشد. حرکت بعدی بانک مرکزی همیشه زیر ذره بین است. اما در کل سال 2026 تاکنون، فدرال رزرو هیچ کاری در مورد نرخ ها انجام نداده است. در آغاز سال انتظار کاهش بود. اکنون - با افزایش تورم - بسیاری برای افزایش فریاد هستند. با این حال ما بدون تغییر می مانیم. شانس بعدی فدرال رزرو 16 سپتامبر است، یعنی کمی بیش از یک هفته از امروز، و سرمایه گذاران فکر می کنند ما در نهایت می توانیم شاهد برخی اقدامات نرخ بهره باشیم. طبق داده‌های FedWatch، آن‌ها با احتمال تقریباً 60 درصدی برای افزایش 25 امتیازی قیمت‌گذاری می‌کنند، که از 52 درصد در پنجشنبه گذشته افزایش یافته است. چرا افزایش؟ با تشکر از گزارش مشاغل روز جمعه، که شاهد افزایش 162000 حقوق و دستمزد در ماه آگوست بود که پیش‌بینی‌ها را زیر پا گذاشت. تصور این است که ارقام قوی اشتغال به فدرال رزرو اجازه می دهد تا نرخ بهره را بدون مختل کردن اقتصاد افزایش دهد. واکنش فوری در بازار اوراق قرضه افزایش شدید بازدهی 2 ساله خزانه داری بود که حساس ترین نسبت به نرخ ها است. با ادامه جلسه، سود کاهش یافت، اما نکته مهم واضح بود: صعود به طور محکم به بازی بازگشته است. این موضوع ریسک داده های اقتصادی آتی را"}, {"source": "Business Insider", "title": "Your old company might want to hire you back", "link": "https://www.businessinsider.com/boomerang-hiring-growing-why-ceos-like-it-2026-9", "summary": "Deel CEO Alex Bouaziz welcomes back former workers who left on good terms. Mustafa Yalcin/Anadolu via Getty Images Boomerang hiring is on the rise, and some CEOs see big benefits in bringing ex-workers back . Deel's CEO says returning workers can help reinforce other employees' decision to stay. Another CEO said he lets stars leave, knowing he'll be \"calling them in a year to come back.\" When Ahmed Mousa wanted to return to the tech firm Deel, he texted CEO Alex Bouaziz a selfie of the two of them with another colleague. \"hey! ready and fully committed. when can we recreate this photo?\" Mousa wrote to Bouaziz. The cofounder quickly replied, writing in part: \"Which team\" Roughly 48 hours after that exchange, Mousa, who'd spent about five years at the HR and payroll platform, was talking with a Deel recruiter about the details of his return, nearly four months after he left. He had become a \"boomerang\" employee . Mousa is not alone. Rehires at Deel more than doubled between 2024 and 2026, the company said. Nationally, 3.4% of new hires in the US were boomerangs by the end of 2025, up from 3.1% two years earlier, according to the latest figures from Revelio Labs, which analyzes employment data. Why some companies want their exes back Finding a job remains tough for many desk workers. Returning to a former employer can offer an advantage: Job seekers already have a history and connections inside the organization . That inside track can be particularly helpful at a company like Deel, which has more than 7,000 employees globally and said it drew 1.3 million job applicants in 2025. The fully remote company projects it will hit 2 million applicants this year. Ahmed Mousa briefly left Deel before deciding he wanted to return. Courtesy of Ahmed Mousa Despite that huge applicant pool, Bouaziz said former employees who were strong performers and left on good terms can be obvious candidates. \"They understand the company,\" he said. \"They have the right relationship inside of the company to make some things happen faster.\" Those workers can also tell Deel why they left and whether the company could make changes to address any issues, Bouaziz said. Not everyone gets a return ticket While many CEOs see value in boomerang employees, they aren't necessarily eager to welcome back anyone who knocks. \"What I don't like are job-bouncers,\" said Fred Voccola, the chairman and CEO of AI software company Simpro Group. Still, he said he's happy to rehire someone who behaved honorably", "date_str": "2026-09-08T09:42:01+00:00", "hash": "c8f852e1ef1ef599a8b3e27a41e1c689be67dd8a3fb18cf6aad9fd6339f29af6", "title_fa": "شرکت قدیمی شما ممکن است بخواهد دوباره شما را استخدام کند", "summary_fa": "الکس بوعزیز، مدیرعامل Deel از بازگشت کارگران سابقی که با شرایط خوب آنجا را ترک کردند استقبال می کند. مصطفی یالچین/آنادولو از طریق گتی ایماژ استخدام بومرنگ در حال افزایش است و برخی از مدیران عامل مزایای بزرگی را در بازگرداندن کارگران سابق می بینند. مدیر عامل Deel می گوید کارگران بازگشته می توانند به تقویت تصمیم سایر کارمندان برای ماندن کمک کنند. مدیر عامل دیگری گفت که به ستاره ها اجازه می دهد که بروند، زیرا می داند که \"یک سال دیگر با آنها تماس می گیرد تا برگردند.\" زمانی که احمد موسی می خواست به شرکت فناوری دیل بازگردد، به مدیر عامل الکس بوعزیز یک عکس سلفی از آن دو را با همکار دیگری ارسال کرد. \"هی! آماده و کاملا متعهد. چه زمانی می توانیم این عکس را دوباره بسازیم؟\" موسی به بوعزیز نوشت. مؤسس به سرعت پاسخ داد و در بخشی نوشت: «کدام تیم» تقریباً 48 ساعت پس از آن تبادل، موسی، که حدود پنج سال را در پلتفرم HR و حقوق و دستمزد گذرانده بود، با یکی از استخدام‌کنندگان Deel درباره جزئیات بازگشتش صحبت می‌کرد، تقریباً چهار ماه پس از ترک. او کارمند «بومرنگ» شده بود. موسی تنها نیست این شرکت گفت که استخدام مجدد در Deel بین سال های 2024 تا 2026 بیش از دو برابر شده است. طبق آخرین آمار آزمایشگاه Revelio که داده‌های اشتغال را تجزیه و تحلیل می‌کند، در سطح ملی، 3.4 درصد از استخدام‌های جدید در ایالات متحده تا پایان سال 2025 بومرنگ بودند، در حالی که دو سال قبل از آن 3.1 درصد بود. چرا برخی از شرکت‌ها می‌خواهند پیشین خود را بازگردانند یافتن شغل برای بسیاری از کارگران میز کار دشوار است. بازگشت به یک کارفرمای سابق می تواند یک مزیت باشد: جویندگان کار قبلاً سابقه و ارتباطاتی در داخل سازمان دارند. این مسیر داخلی می تواند به ویژه"}, {"source": "Business Insider", "title": "I'm a former Accenture consultant. I saw why so many workplace conflicts go unresolved.", "link": "https://www.businessinsider.com/att-former-accenture-consultant-says-consultants-hate-conflict-2026-8", "summary": "Former Accenture consultant Lauren Bronson is a conflict resolution specialist. Lauren Bronson Lauren Bronson Petrous, a former Accenture consultant , is a conflict resolution specialist. She spent two years at Accenture and has one takeaway: Consultants hate conflict. She now helps teams with leadership development and conflict resolution. This is a conversation with Lauren Bronson Petrous, a former senior consultant at Accenture, who now leads the advisory firm Boundless Co. This conversation has been edited and condensed for clarity. Conflict's inevitable. We're all going to have it. How is everyone so terrified of it? That was the question that kept coming up during my time as a senior consultant at Accenture. Throughout my career, I've worked with executives and senior leaders across industries, from media companies to international consulting firms. One pattern has become clear: Regardless of title, many leaders struggle to navigate difficult conversations and receive feedback — both essential to building a successful company where people want to work At Accenture, I saw people leading teams on $10 million contracts who could not address difficult clients or colleagues. Sometimes I would sit in meetings with senior leaders where no one was really achieving anything because no one was willing to address the elephant in the room. Then there were those who were not afraid to say direct things, but did so without grace, timing, or care. I joined Accenture after earning a master's degree in organizational change from Northwestern. One of my professors had pitched me to the firm without my knowing. I went through the interview process and got an offer, but I initially said no because I wanted to start my own gig. The firm told me they thought I could do phenomenal work, so I joined as a senior consultant. Accenture is a machine. After onboarding and training, the firm identifies people based on their skill sets and determines which projects they should be on. It is partly about capacity — who is available — but also about who is most skilled for a particular client. You would meet with a client, and if they liked you and it worked well, you would start the project. I often led teams. A lot of my work involved organizational change, team development, and leadership development. Across my career, I've noticed that talented people do not necessarily have leadership skills. Many companies hire for talent and high performance, then put people into managerial or", "date_str": "2026-09-08T09:33:01+00:00", "hash": "d3836f7d748f9f61de774ae5472f5749220b53a6f98d716bcb479abd5da145f5", "title_fa": "من یک مشاور سابق Accenture هستم. من دیدم که چرا بسیاری از تضادهای محل کار حل نشده است.", "summary_fa": "مشاور سابق Accenture، لورن برونسون، متخصص حل تعارض است. لورن برونسون لورن برونسون پتروس، مشاور سابق Accenture، متخصص حل تعارض است. او دو سال را در Accenture گذراند و یک نکته مهم دارد: مشاوران از درگیری متنفرند. او اکنون به تیم ها در توسعه رهبری و حل تعارض کمک می کند. این گفتگو با لورن برونسون پتروس، مشاور ارشد سابق Accenture است که اکنون شرکت مشاوره Boundless Co. این گفتگو برای وضوح ویرایش و فشرده شده است. درگیری اجتناب ناپذیر است همه ما آن را خواهیم داشت. چطور همه از آن وحشت دارند؟ این سوالی بود که در زمان من به عنوان مشاور ارشد در Accenture مطرح می شد. در طول زندگی حرفه‌ای‌ام، با مدیران اجرایی و رهبران ارشد در سراسر صنایع، از شرکت‌های رسانه‌ای گرفته تا شرکت‌های مشاوره بین‌المللی، کار کرده‌ام. یک الگو مشخص شده است: بدون در نظر گرفتن عنوان، بسیاری از رهبران برای هدایت مکالمات دشوار و دریافت بازخورد تلاش می کنند - هر دو برای ایجاد یک شرکت موفق که در آن افراد می خواهند در Accenture کار کنند ضروری است، من افرادی را دیدم که تیم هایی را با قراردادهای 10 میلیون دلاری رهبری می کردند که نمی توانستند به مشتریان یا همکاران دشوار رسیدگی کنند. گاهی اوقات در جلساتی با رهبران ارشد می نشستم که در آن هیچ کس واقعاً به چیزی دست نمی یافت، زیرا هیچ کس حاضر نبود به فیل در اتاق صحبت کند. سپس کسانی بودند که از گفتن مستقیم چیزها هراسی نداشتند، اما این کار را بدون لطف، زمان بندی یا مراقبت انجام دادند. من پس از اخذ مدرک کارشناسی ارشد در تغییر سازمانی از شمال غربی به Accenture پیوستم. یکی از اساتیدم بدون اینکه بدانم مرا به شرکت فرستاده بود. من مراحل مصاحبه را طی کردم و پیشنهادی دریافت کردم، اما در ابتدا جواب منفی دادم زیرا می‌خواستم کنسرت"}, {"source": "Business Insider", "title": "Job seekers are learning a new interview skill: how to sound excited about AI", "link": "https://www.businessinsider.com/job-search-ai-tools-interviews-enthusiasm-hiring-tech-chatgpt-claude-2026-9", "summary": "Some job seekers say they re learning how enthusiastic about AI to sound during interviews. Connect Images/Getty Images Job seekers are learning a new interview skill: how excited to
