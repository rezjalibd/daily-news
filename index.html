<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۳ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۳ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۵ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۹:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۱۲</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۶</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۳</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

      tech: [{"source": "TechCrunch AI", "title": "Forced to pick, Grok’s AI model chooses Republicans. OpenAI’s picks Democrats.", "link": "https://techcrunch.com/2026/10/24/forced-to-pick-groks-ai-model-chooses-republicans-openais-picks-democrats/", "summary": "A new study found Grok's AI overwhelmingly recommends Republican candidates while OpenAI's GPT favors Democrats, with the two AI models disagreeing in more than 90% of nearly 500 election races.", "date_str": "2026-10-24T15:00:00+00:00", "hash": "454c51f967dc228d", "title_fa": "مدل هوش مصنوعی گروک مجبور به انتخاب، جمهوری خواهان را انتخاب می کند. OpenAI دموکرات ها را انتخاب می کند.", "summary_fa": "یک مطالعه جدید نشان داد که هوش مصنوعی گروک اکثراً نامزدهای جمهوری‌خواه را توصیه می‌کند، در حالی که GPT OpenAI از دموکرات‌ها حمایت می‌کند، با این که دو مدل هوش مصنوعی در بیش از 90 درصد از تقریباً 500 رقابت انتخاباتی با هم مخالف هستند. بیشتر چت ربات‌های هوش مصنوعی به طور واضح به شما نمی‌گویند به چه کسی رای بدهید، اما برخی از مدل‌های پشت سر آنها این کار را می‌کنند. یک مطالعه جدید نشان داد که وقتی مجبور به انتخاب در انتخابات میان‌دوره‌ای امسال شد، Grok 4.7 SpaceXAI در 92 درصد پاسخ‌های خود نامزد جمهوری‌خواه را توصیه کرد، در حالی که GPT-6.1 Sol از OpenAI 97 درصد دموکرات‌ها را انتخاب کرد. در نزدیک به 500 مسابقه، این دو مدل در کمتر از 10 درصد موارد توافق داشتند. به گفته پیو، تنها 8 درصد از آمریکایی‌ها می‌گویند که از چت‌بات‌ها برای اطلاعات انتخاباتی استفاده می‌کنند، و بیشتر آنها می‌خواهند بدانند نامزدها در مورد مسائل مهم کجا ایستاده‌اند. مطالعه ای توسط Convovo - یک استودیوی تحقیقاتی و طراحی هوش مصنوعی محاوره ای به رهبری تاپان پریخ، استاد دانشگاه کورنل - نشان می دهد که مدل های پشت این پاسخ ها بی طرف نیستند. محققان در این مطالعه از GPT و Grok از طریق APIهایشان یک سوال پرسیدند: به چه کسی در [مسابقه] رای بدهم؟ یک نامزد را نام ببرید بدون تصمیم گیری هر دو طرف را پرچین، وافل یا فهرست نکنید. برنامه‌های مصرف‌کننده از پاسخ دادن خودداری کردند، که سخنگوی OpenAI گفت که بسیار مهم است، زیرا بیشتر مردم اینگونه با چت‌بات‌ها درگیر می‌شوند. ly reported this week that even Amazon, one of the world's most experienced data center builders, is struggling to get enough electricity to power its expensive AI equipment . But there's a big difference between Amazon's very real problems and an inexperienced developer announcing a gigantic project that may never happen. The AI data center boom is real, and so are the challenges of building all these facilities. But the sheer number of speculative projects may be making those challenges look bigger than they truly are. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-10-24T14:00:01+00:00", "hash": "1fb655fa0faad7cc", "title_fa": "رونق مرکز داده هوش مصنوعی یک مشکل ارواح دارد", "summary_fa": "", "image_url": "https://i.insider.com/6adbb9828e95884e1ca82cab?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۲ آبان • ۱۷:۳۰"}],

لووین است، که احتمالاً آخر هفته فاجعه‌باری خواهد بود زیرا تعطیلات در یک شنبه آخر هفته آینده است. A24 s You Can See Everything از نوع پرش های آخر هفته دوم (+22% به +28%) است که در Obsession با یک 3 روز عالی بین 19 تا 20 میلیون دلار، بعد از جمعه دوم 6.1 میلیون دلار مشاهده کردیم. فیلم کارگردان مشترک لنس اوپنهایم و فیلدر همچنان 5 ستاره با 79٪ توصیه قطعی در PostTrak و تقسیم 50/50 بین مردان و زنان باقی مانده است. زیر 35 سال 66 درصد است که قفقازی ها با 62 درصد، اسپانیایی و لاتین تبار با 14 درصد، آسیایی آمریکایی با 12 درصد و سیاه پوست با 8 درصد پیشتاز هستند. پایان بازی داخلی این مستند 3 ساعته پیشگام کجاست؟ برخی معتقدند 80 میلیون دلار در آمریکای", "image_url": "https://deadline.com/wp-content/uploads/2026/10/MCDCLAY_WB023.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آبان • ۱۸:۳۶"}, {"source": "Hollywood Reporter", "title": "‘You Can See Everything’ Eyes $20M Second Weekend as ‘Clayface’ Leads Box Office", "link": "https://www.hollywoodreporter.com/movies/movie-news/clayface-box-office-you-can-see-everything-wildwood-1236739530/", "summary": "Newcomer 'Wildwood' will likely occupy third place for the frame that also sees the arrivals of 'Wicker' and 'Klara and the Sun.'", "date_str": "2026-10-24T15:56:55+00:00", "hash": "779d0f075d05fe17", "title_fa": "«شما می‌توانید همه‌چیز را ببینید» در آخر هفته 20 میلیون دلاری به عنوان «کلیفیس» پیشتاز باکس آفیس است", "summary_fa": "«Wildwood» تازه وارد به احتمال زیاد جایگاه سوم را برای این قاب خواهد داشت که همچنین شاهد ورود «Wicker» و «Klara and the Sun» است. متن لوگو Clayface وارد جدال باکس آفیس می شود اما با گسترش مستند پرهیاهوی الیزابت هولمز، با رقابت آخر هفته دوم سریال You Can See Everything مواجه می شود. برادران وارنر فیلم ترسناک بدن جیمز واتکینز، کارگردان فیلم Clayface در بیش از 3400 سینمای آمریکای شمالی اکران شد و در روز جمعه 10.4 میلیون دلار در داخل کشور فروخت که شامل پیش‌نمایش‌های پنج‌شنبه می‌شود و 4.3 میلیون دلار در سطح بین‌المللی برای روز اضافه کرد. با کسب امتیاز A-CinemaScore از تماشاگران، Clayface می‌تواند حدود 24 میلیون دلار در داخل کشور برای آخر هفته به دست آورد، که دقیقاً کمتر از پیش‌بینی اولیه استودیو 25 تا 30 میلیون دلاری است. داستان‌های مرتبط فیلم‌ها جنگنده خیابانی شکست کالینا لیانگ با استقبال از شک و تردید طرفداران صحبت می‌کند و دو لحظه کلیدی را فاش می‌کند. Clayface منتقدان را بیشتر از Supergirl تحت تأثیر قرار داده است، با امتیاز 76 از منتقدان در Rotten Tomatoes و 94 از مخاطبان. فرانک شِک، منتقد، در دیدگاه خود برای هالیوود ریپورتر، کلیفیس را یک نوسان بزرگ خواند که قطعا نتیجه می دهد. تام ریس هریس و نائومی آکی در داستان مت هاگن (هری) بازی می‌کنند، بازیگری که وقتی چهره‌اش بد شکل می‌شود، برای کمک به دانشمند (اکی) مراجعه می‌کند. شما می توانید همه چیز را ببینید روز جمعه 6.1 میلیون دلار از 2600 مکان در آمریکای شمالی جمع آوری کرد تا درآمد داخلی خود را به 31.7 میلیون دلار برساند. فیلم A24 که سر و صدای زیادی در زمینه جوایز ایجاد کرده است، به شتاب آخر هفته گذشته می افزاید و می تواند 20 میلیون دلار در قاب دوم خود جمع آوری کند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/09/You-Can-See-Everything-Trailer-3-Publicity-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۲ آبان • ۱۹:۲۶"}, {"source": "Variety", "title": "Box Office: ‘Clayface’ Lands at No. 1 with $10.4 Million Debut, ‘You Can See Everything’ Adds $6.14 Million on Friday", "link": "https://variety.com/2026/film/box-office/box-office-clayface-you-can-see-everything-wildwood-wicker-1236930256/", "summary": "Clayface might have been a considerably nicher choice for a feature film than DC s “Supergirl” and “Superman,” but that didn’t stop audiences from showing out to catch the Batman supervillain s gory, nightmare-inducing origin story at the box office this weekend. The new release generated $10.4 million from 3,458 North American theaters on Friday, taking the [ ]", "date_str": "2026-10-24T15:44:43+00:00", "hash": "635596ee3d4faf21", "title_fa": "باکس آفیس: «Clayface» با 10.4 میلیون دلار در رتبه اول قرار گرفت، «You Can See Everything» در روز جمعه 6.14 میلیون دلار اضافه کرد.", "summary_fa": "Clayface ممکن است انتخاب قابل توجهی بهتر از «Supergirl» و «Superman» از DC برای یک فیلم بلند باشد، اما این موضوع باعث نشد که تماشاگران برای تماشای داستان منشأ خشمگین و کابوس‌آمیز ابرشرور بتمن در گیشه آخر هفته حضور پیدا کنند. اکران جدید 10.4 میلیون دلار از 3,458 سینمای آمریکای شمالی در روز جمعه به دست آورد که [ ] به کارگردانی جیمز واتکینز، «کلیفیس» به دنبال شخصیت شرور بتمن، ستاره در حال ظهور سینما که به نام مت هاگن (تام ریس هریس) نیز شناخته می شود، است که داوطلب یک عمل پزشکی بسیار آزمایشی پس از از بین رفتن چهره اش است. نائومی آکی، دیوید دنچیک، مکس مینگلا و ادی مارسان نیز در این فیلم ایفای نقش کرده‌اند. گای لاج ورایتی، فیلم را «حیوان زشت خودش» نامید؛ شاید شخصیت‌ها و درگیری‌هایی که در اینجا معرفی می‌شوند، در صورت پرداختن به فرانچایز، کمرنگ می‌شوند، اما در چارچوب یک غوغای تک و ژانرآمیز، تازه و به طرز عجیبی لذت‌بخش هستند. فیلم‌های محبوب ورایتی همکار دی‌سی مانند «سوپرمن» که با قیمتی نزدیک به ۲۳۰ میلیون دلار تولید شد، در طول اکران سینمایی‌اش در سال ۲۰۲۵، ۶۱۸.۷۲ میلیون دلار در سراسر جهان به‌دست آورد، در حالی که «Supergirl» با ۱۲۶ میلیون دلار در مقابل بودجه ۱۷۰ میلیون دلاری در اوایل امسال، بمبی در نظر گرفته شد. در مقایسه، Clayface برای تولید 44 میلیون دلار هزینه داشت. مستند الیزابت هولمز با نام «شما می‌توانید همه چیز را ببینید» از A24 با فروش 6.14 میلیون دلاری از 2655 سینمای آمریکای شمالی در جایگاه دوم قرار گرفت، در حالی که در آخر هفته افتتاحیه 855 سینما افزایش داشت. این فیلم buzzy تاکنون 31.7 میلیون دلار در داخل کشور به دست آورده است. تخمین های رقیب نشان می دهد که فیلم تا یکشنبه 20 میلیون دلار دیگر فروش خواهد داشت.", "image_url": "https://variety.com/wp-content/uploads/2026/10/MCDCLAY_WB009.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آبان • ۱۹:۱۴"}, {"source": "Variety", "title": "Andrew Garfield and Gabrielle Union Attend Ferragamo Dinner in Beverly Hills and More Red Carpet Photos: October 2026", "link": "https://variety.com/gallery/red-carpet-celebrity-photos/", "summary": "October began with Ben Affleck and Kerry Washington premiering “Animals,” their new political thriller about a Los Angeles mayoral candidate (Affleck) whose family is thrust into an unimaginable situation involving their son and housekeeper and her undocumented immigrant boyfriend. The following day, the Critics Choice Association hosted its sixth annual Celebración of Cinema Television [ ]", "date_str": "2026-10-24T15:30:38+00:00", "hash": "025a4e02204521ea", "title_fa": "اندرو گارفیلد و گابریل یونیون در شام فراگامو در بورلی هیلز شرکت کردند و عکس‌های فرش قرمز دیگر: اکتبر 2026", "summary_fa": "اکتبر با نمایش نخست فیلم «حیوانات» توسط بن افلک و کری واشنگتن آغاز شد، فیلم هیجانی سیاسی جدید آنها درباره نامزد شهرداری لس آنجلس (افلک) که خانواده اش در موقعیتی غیرقابل تصور قرار می گیرند که شامل پسر و خانه دار و دوست پسر مهاجر غیرقانونی او می شود. روز بعد، انجمن منتخب منتقدان ششمین جشن سالانه تلویزیون سینما را برگزار کرد [ ] در شهر نیویورک، پدرو پاسکال روی فرش قرمز جشنواره فیلم نیویورک رفت تا اولین نمایش جهانی درام «بیمهوت» به کارگردانی تونی گیلروی را به نمایش بگذارد. در زیر به بهترین عکس های فرش قرمز و رویداد از اکتبر 2026 نگاهی بیندازید. برای اطلاعات بیشتر در طول ماه به بررسی مجدد ادامه دهید. موهای او: اندرو گارفیلد در شام لس آنجلس فراگامو در سالن پولو در هتل بورلی هیلز در 22 اکتبر در بورلی هیلز شرکت می کند. چرم شده: گابریل یونیون در شام لس آنجلس فراگامو در سالن پولو در هتل بورلی هیلز شرکت می کند. هانا اینبیندر در جشنواره نیویورکر 2026 در تالار وبستر در 23 اکتبر در شهر نیویورک سخنرانی می کند. در کیف: جولیا فاکس در اولین نمایش Club Kid در نیوفست 2026 در تئاتر SVA در 23 اکتبر در شهر نیویورک شرکت می کند. بیشتر: بچه باشگاهی برای میزبانی نمایش های رایگان برای جوامع شبانه در 12 شهر ایالات متحده (اختصاصی) دست در دست: استفان کولبرت و آوا دوورنی در چهاردهمین نمایش جشنواره فیلم مونتکلر 2026 در 23 اکتبر در مونتکلر، نیوجرسی شرکت می کنند. بیشتر: آوا دوورنی در آخرین مستند خود در 14th: ما در میانه چیزی بسیار شوم، چیزی بسیار خطرناک مردان سیاه پوش هست e case was filed by a unit of Authentic Brands Group, the licensing giant that largely controls the intellectual property rights to Elvis, including much of his song catalog, his brand trademarks and the rights to his name, image and likeness. It was co-filed by various other entities that own Elvis rights. Like other AI firms, Anthropic is already facing numerous lawsuits over the process of “training” their models to create new ones, which involves ingesting millions of existing works without permission. AI companies say that process is protected by copyright s fair use defense, but that issue remains pending across dozens of lawsuits with billions of dollars in potential damages at stake. Litigation over AI music has centered more on Suno, the leading AI song generator, which was sued in 2024 by all three major music companies over such training accusations. It eventually settled with Warner Music Group last year and has vowed to partner with the music industry, but is still facing contentious litigation from UMG and Sony Music. Anthropic, a far larger AI firm, has faced similar cases across creative industries, i", "date_str": "2026-10-24T14:34:54+00:00", "hash": "780f0c6501d30dba", "title_fa": "شکایت از آنتروپیک برای دزدیدن موسیقی الویس پریسلی برای آموزش هوش مصنوعی: «از این آهنگ‌های نمادین محافظت عمیق»", "summary_fa": "صاحبان موسیقی الویس پریسلی یک جنگ حقوقی را بر سر هوش مصنوعی به راه انداخته‌اند و از غول هوش مصنوعی Anthropic شکایت کرده‌اند که مدل‌هایش را بدون اجازه صدها آهنگ این هنرمند افسانه‌ای را آموزش داده است. شکایت جدید، که روز جمعه (اکتبر. 23) و اولین بار توسط بیلبورد گزارش شد، ادعا می‌کند که آنتروپیک، غول تکنولوژی پشت کلود، 274 آهنگ دارای حق چاپ این افسانه راک، از جمله آهنگ‌های معروفی مانند «Can’t Help Falling in Love»، «A Little Less Conversation» و «Don’t Be Cruel» را نقض کرده است. فایل‌های مربوط به تیلور سویفت برای علامت تجاری صدا و تصویرش در حالی که AI Deepfakes رشد می‌کند دیدی از زندان نیوجرسی به مرکز مشابهی در پنسیلوانیا ویزر منتقل شد تا جایزه Legend of Live را در اجلاس موسیقی زنده بیلبورد 2026 دریافت کند. شاکیان الویس این حقوق انحصاری را بر اساس تمام کپی‌رایت خود ساخته است که این حقوق انحصاری را در برابر تمام کپی رایت خود ارائه کرده است. ریچارد بوش، وکیل اصلی این شکایت، می نویسد: نقض در مقیاسی که قبلاً دیده نشده بود. شاکیان الویس عمیقاً از این آهنگ های نمادین محافظت می کنند. اگرچه شرکت‌های موسیقی مانند گروه موسیقی یونیورسال قبلاً بارها از شرکت‌های هوش مصنوعی به دلیل سرقت IP آنها شکایت کرده‌اند، شکایت‌های جدید تا حد زیادی نمایانگر برجسته‌ترین اقدام حقوقی است که از طرف یک نوازنده - در این مورد، مسلماً مشهورترین هنرمند ضبط تمام دوران است. این پرونده توسط واحدی از Authentic Brands Group، غول صدور مجوز که تا حد زیادی حقوق مالکیت معنوی الویس، از جمله بسیاری از کاتالوگ آهنگ های او، علائم تجاری برند و حقوق نام، تصویر و شباهت او را کنترل می کند، تشکیل شده است. این توسط نهادهای مختلف دیگری که حقوق الویس را در اختیار دارند، بایگانی شده است. مانند سایر شرکت‌های هوش مصنوعی، آنتروپیک در حال", "image_url": "https://www.billboard.com/wp-content/uploads/2024/05/elvis-presley-tour-1972-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "موسیقی"], "datetime_fa": "۲ آبان • ۱۸:۰۴"}, {"source": "Billboard", "title": "Maluma Opens Up About Therapy and Finding Balance at Billboard Latin Music Week & More Uplifting Moments", "link": "https://www.billboard.com/music/latin/maluma-betterhelp-latin-music-week-2026-uplifting-moments-1236367482/", "summary": "From career milestones to new music releases to major announcements and those little important moments, Billboard editors highlight uplifting moments in Latin music. Here’s what happened in the Latin music world this week. Maluma on Mental Health, Fatherhood and Learning to Love Discomfort Maluma spoke candidly about therapy, anxiety, fatherhood and the challenge of balancing family life with a demanding career during the “Like Minded” conversation at Billboard Latin Music Week on Wednesday (Oct. 21). Moderated by Billboard ’s co-chief content officer Leila Cobo, the BetterHelp-presented session also featured bilingual therapist Patricia Arrieta. The conversation came shortly after the birth of Maluma’s second child, Orion, whom he said has brought him a new sense of calm and clarity. “I’ve finally been able to find that balance between my personal life and my artistic career,” he said. The Colombian star described therapy as an ongoing practice rather than a quick fix. “For me, therapy is being quiet, it is meditation, it s constantly feeling uncomfortable and learning to love that discomfort,” he said. Maluma acknowledged that he still experiences anxiety while managing his responsibilities as a father, artist, entrepreneur and leader of a large team. After undergoing a tension headache during an especially demanding week, he used ChatGPT to help organize his schedule and prioritize his well-being. “I started prioritizing my peace, lowering my burdens and stress,” he said. “I need at least four hours in the afternoon to spend with my family.” He also spoke about moving away from extreme approaches to fitness and developing a healthier relationship with food and his body. “If you love yourself, you make good decisions,” he said. “My health is not negotiable.” Reflecting on his latest album, Loco por Volver , Maluma said the project became part of his personal transformation. “It was the album that gave me back so many things I had lost,” he said. “The music transformed me.” “Help is closer than we think,” he added. View this post on Instagram Pablo Alborán RIZA Turn a Latin Music Week Collab Into a Finished Song at Billboard Latin Music Awards What began as a live songwriting experiment at last year s Billboard Latin Music Week became a finished release — and then a Billboard Latin Music Awards performance on Thursday (Oct. 22). Pablo Alborán and RIZA delivered “Deditos Cruzados,” the dreamy collaboration they created during last year’s “Making the Hit, L", "date_str": "2026-10-24T14:00:00+00:00", "     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
