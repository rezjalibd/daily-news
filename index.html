ر خواهیم گرفت، از جمله: این که آنها در ایالات متحده مستقر هستند تأثیر آنها، از جمله شرکت هایی که برای آنها استخدام می کنند و استخدام های خاصی که در سال 2026 استخدام کرده اند، قدرت شبکه آنها، و شهرت آنها نزد مشتریان و نامزدها، توانایی آنها در مشاوره، نه صرفاً پر کردن نقش ها، نقش هایی که آنها روی آنها تمرکز می کنند فرم را در اینجا پر کنید، یا در زیر بخوانید: مقاله اصلی را در Businesssi بخوانید:"}, {"source": "Business Insider", "title": "A candidate brought her toddler to an interview. It didn't bother me — and she got the job.", "link": "https://www.businessinsider.com/toddler-joined-interview-candidate-got-job-2026-9", "summary": "Recruiter Jalonni Weaver is a parent and says she approaches candidates with the understanding she d want if she were job-hunting. Courtesy of Jalonni Weaver Recruiter Jalonni Weaver says job candidates shouldn't be penalized when life gets messy. She said she advanced a job seeker who interviewed alongside her toddler because the woman did well. Weaver says communication matters most and that she tries to put herself in every candidate's shoes. Jalonni Weaver is an in-house recruiter at a life insurance company in the Dallas-Fort Worth area. She's worked in the field since 2021. The following has been edited for brevity and clarity. I was interviewing a candidate for an early-career role. We got on the call, and she introduced herself, then moved the camera. She was like, \"My toddler's sitting right here eating. Is it OK? He's not going to be a problem.\" She explained that she couldn't afford childcare because she was unemployed. Her toddler wasn't a problem. I have a one-year-old, and she's a problem. Most of the time, her toddler was just eating. He would make noises every now and then, but we were able to get through the full interview. I've been unemployed with a kid. Thankfully, I could still provide because I had a significant other, but I understood where she was coming from. People face challenges. Not every applicant may have a strong WiFi signal. Not every applicant may have a super quiet environment. I've had several times when people have been interviewing from their cars or from closets. I don't really look at where you are because I try to put myself in everybody's shoes. I'm like, \"In this market, if you're doing this, you need a job .\" I try to look at the bigger picture and not flag people just because they're not in a suit sitting at a desk. I try to look at it from a human lens rather than, \"You'll get docked because you had to reschedule your interview because you're in the hospital.\" That doesn't mean there are no red flags. If someone reschedules and reschedules, I'm sending an email asking, \"Hey, is there something going on? Are you still interested?\" If somebody doesn't show up, I'll send one email and say, \"If you would like to reschedule, here's the link.\" It's all about communication . The people who show up with their kids or interview in their cars are making an effort. In this case, I moved the woman forward in the process because she did well, not because I felt pity for her. For the second round , she came in person to inte", "date_str": "2026-09-16T09:44:01+00:00", "hash": "b489395e89a54f3f", "title_fa": "یک نامزد کودک نوپای خود را به مصاحبه آورد. آزارم نداد - و او کار را گرفت.", "summary_fa": "جالونی ویور، استخدام‌کننده، یکی از والدین است و می‌گوید که با درک و فهمی که می‌خواهد به دنبال کار باشد، با نامزدها نزدیک می‌شود. با حسن نیت از Jalonni Weaver استخدام کننده Jalonni Weaver می گوید که نامزدهای شغلی نباید زمانی که زندگی به هم ریخته می شود جریمه شوند. او گفت که یک جوینده کار را ارتقا داده است که در کنار کودک نوپاش مصاحبه کرده است زیرا این زن خوب عمل کرده است. ویور می‌گوید ارتباطات بیشترین اهمیت را دارد و او سعی می‌کند خود را به جای هر نامزدی قرار دهد. Jalonni Weaver یک استخدام کننده داخلی در یک شرکت بیمه عمر در منطقه Dallas-Fort Worth است. او از سال 2021 در این زمینه کار کرده است. موارد زیر برای اختصار و وضوح ویرایش شده است. من در حال مصاحبه با نامزدی برای یک نقش اولیه بودم. تماس گرفتیم و او خودش را معرفی کرد و سپس دوربین را حرکت داد. او می گفت: \"کودک نوپای من اینجا نشسته است و غذا می خورد. اشکالی ندارد؟ او مشکلی ایجاد نخواهد کرد.\" او توضیح داد که به دلیل بیکاری نمی تواند هزینه مراقبت از کودک را بپردازد. کودک نوپا او مشکلی نداشت. من یک بچه یک ساله دارم و او یک مشکل است. بیشتر اوقات، کودک نوپای او فقط غذا می خورد. او هر از چند گاهی سر و صدا می کرد، اما ما توانستیم مصاحبه کامل را پشت سر بگذاریم. من با یک بچه بیکار شده ام خوشبختانه، من هنوز هم می توانستم ارائه دهم، زیرا شخص دیگری داشتم، اما فهمیدم که او از کجا می آید. مردم با چالش هایی روبرو هستند. هر متقاضی ممکن است سیگنال WiFi قوی نداشته باشد. هر متقاضی ممکن است محیطی فوق العاده آرام نداشته باشد. من چندین بار دیده ام که مردم از ماشین خود یا از کمدها مصاحبه می"}, {"source": "Business Insider", "title": "The things Priscilla Chan and Mark Zuckerberg allow — and forbid — their daughter to vibe code", "link": "https://www.businessinsider.com/mark-zuckerberg-priscilla-chan-parenting-ai-limits-vibe-coding-2026-9", "summary": "Priscilla Chan said she limits what her daughter can vibe code. Taylor Hill/Getty Images Priscilla Chan said she doesn't let her daughter vibe code products that are \"open to the internet.\" \"She wanted to build a dating site,\" Chan told Colossus. \"That was a no.\" Mark Zuckerberg and his wife have long limited their children's access to technology. Mark Zuckerberg's daughter is vibe coding. Her mom isn't vibing with the open web. The Meta CEO has long set tech restrictions on his children. In 2019, he told Fox News that he liked that his kids could video chat with their extended family, but didn't want them to sit in front of a computer \"for a long time.\" We're now in the age of AI, and the Zuckerbergs — like parents everywhere — have a whole new technology to contend with. In a Monday profile about her husband in Colossus , Priscilla Chan showed Jeremy Stern her daughter's account on Replit, a vibe coding platform . While she lets her daughters explore, Chan said she limits the kinds of apps they can build. \"She's quite limited, because Mom doesn't let her build things that are open to the internet,\" Chan said. Chan walked through some of her daughter's vibe-coded creations, like a messaging app. There were also apps similar to GeoCities and the game FarmVille , according to Colossus. Like her father, Zuckerberg's daughter seems to have an entrepreneurial spirit. Each app included a plan for marketing and sales plan. Other things were off limits. \"She wanted to build a dating site,\" Chan said. \"That was a no.\" Zuckerberg's children have long been experimenting with AI tech. In 2024, he said that his daughter was 40 pages into writing a novel about \"mermaid crystals\" with AI-generated images. (It's not immediately clear which of Zuckerberg's three daughters was vibe coding. August, their middle child, wrote the mermaid book.) Chan isn't alone in limiting her daughter's access to the web. Google CEO Sundar Pichai didn't give his middle-school-aged kid a phone, and Mark Cuban set up special routers to monitor his kids' internet usage at home. The tech tradition dates back to Steve Jobs , who famously didn't let his kids use the iPad he helped create. Meta is investing big in AI, pouring more and more cash into the expansion of its computing power. The company has its own vibe coding product , which it announced in August, as well as the new personal agent Muse. Zuckerberg said he used Muse to find kid-friendly recipes . For the record, Zuckerberg doesn't seem", "date_str": "2026-09-16T09:30:01+00:00", "hash": "a2c478f701f5a182", "title_fa": "چیزهایی که پریسیلا چان و مارک زاکربرگ به دخترشان اجازه می دهند - و آنها را منع می کنند - کدهای ویبر را انجام دهد", "summary_fa": "پریسیلا چان گفت که وی کدهای دخترش را محدود می کند. تیلور هیل/ گتی ایماژ پریسیلا چان گفت که به دخترش اجازه نمی دهد محصولاتی را که \"به روی اینترنت باز هستند\" رمزگذاری کند. چان به Colossus گفت: \"او می خواست یک سایت دوستیابی بسازد.\" \"این یک نه بود.\" مارک زاکربرگ و همسرش مدت‌هاست که دسترسی فرزندانشان به فناوری را محدود کرده‌اند. دختر مارک زاکربرگ در حال کدنویسی ویبر است. مادرش با وب باز نمی لرزد. مدیرعامل متا مدت‌هاست که محدودیت‌های فنی برای فرزندانش وضع کرده است. در سال 2019، او به فاکس نیوز گفت که دوست دارد فرزندانش بتوانند با خانواده بزرگ خود چت تصویری داشته باشند، اما نمی‌خواهد آنها «مدت طولانی» جلوی رایانه بنشینند. ما اکنون در عصر هوش مصنوعی هستیم و زاکربرگ ها - مانند والدین در همه جا - یک فناوری کاملاً جدید برای مبارزه با آن دارند. پریسیلا چان در نمایه‌ای درباره همسرش در کولوسوس، حساب دخترش را در Replit، یک پلتفرم کدنویسی vibe، به جرمی استرن نشان داد. چان گفت در حالی که به دخترانش اجازه می دهد کاوش کنند، انواع برنامه هایی را که می توانند بسازند محدود می کند. چان گفت: «او کاملاً محدود است، زیرا مادر به او اجازه نمی‌دهد چیزهایی بسازد که در اینترنت باز هستند. چان در میان برخی از خلاقیت‌های دخترش با کدهای پرشور مانند یک اپلیکیشن پیام‌رسان قدم زد. طبق گفته Colossus، برنامه‌هایی مشابه GeoCities و بازی FarmVille نیز وجود داشت. به نظر می رسد دختر زاکربرگ نیز مانند پدرش روحیه کارآفرینی دارد. هر برنامه شامل طرحی برای بازاریابی و فروش بود. چیزهای دیگر خارج از محدوده بود. چان گفت: \"او می خواست یک سایت دوستیابی بسازد.\" \"این یک نه بود.\" فرزندان زاکربرگ مدت‌هاست که با فناوری هوش مصنوعی آزمایش می‌کنند. در سال 2024، او گفت که دخترش 40 صفحه در نوشتن رمانی در مورد \"کریستال های"}, {"source": "Business Insider", "title": "I quit my Google software engineering job and became a watercolor artist. Here’s how I’m using — and not using — AI.", "link": "https://www.businessinsider.com/watercolor-artist-ex-google-software-engineer-does-doesnt-use-ai-2026-9", "summary": "Watercolor artist Sara Wilczynska explains how she uses AI to help her with her business — and where she draws the line with the technology. Courtesy of Sara Wilczynska Sara Wilczynska is a Google software engineer turned watercolor artist in San Diego. She uses AI to help her as a business owner with planning, bookkeeping, copyediting, and coaching. However, she says she has a clear boundary of not using AI to generate any of her actual artwork. This as-told-to essay is based on a conversation with Sara Wilczynska, a 41-year-old watercolor artist and founder of Swil Arts who lives in San Diego. Prior to her art career, she worked as a software engineer in the finance and tech industries before quitting her job at Google in 2022. The following has been edited for length and clarity. I started using AI pretty early on. I founded my art studio in 2023 — after quitting my software engineer job at Google the year prior — which was when generative AI started to become more accessible and powerful. In a way, I was growing my studio with it, and having a tech background made me more prone to experiment, be excited, and feel less scared of it. However, I was always very clear that I never wanted AI to replace me at the core and the heart of my business. I wanted to create and to add value to people's lives through my creativity. Still, I identified that there are many things involved in running a business that require time, energy, and money, which AI can really help reduce friction with. I believe there's a way for artists and creatives to work with AI, and it can hopefully help us redefine the value we add as artists and creatives. Here's how I do and don't use AI. How I don't use AI I'd never use AI to generate any artwork. I've always had a very clear boundary around that — I'll never use AI for art creation, ideation, creative brainstorming, and visual storytelling. From the beginning of my art career, I've used traditional media — ink, watercolor, brushes, and paper. Even if I digitize it later in order to put it on products, the heart of it is creating everything in a traditional way with hands and traditional mediums. Sara Wilczynska says she will never use AI in the creation of her art. Courtesy of Sara Wilczynska I saw a lot of potential and value in the human aspect of it, like sketching on location and capturing with all the senses. AI can process an image, but it's not going to have that experience or perspective or interpretation or locality — all th", "date_str": "2026-09-16T09:15:01+00:00", "hash": "e3dbdccba45438d5", "title_fa": "من شغل مهندسی نرم افزار گوگل خود را رها کردم و یک هنرمند آبرنگ شدم. در اینجا نحوه استفاده من - و نه استفاده از - AI آمده است.", "summary_fa": "هنرمند آبرنگ سارا ویلچینسکا توضیح می‌دهد که چگونه از هوش مصنوعی برای کمک به کسب‌وکارش استفاده می‌کند - و اینکه او با این فناوری مرزبندی می‌کند. با حسن نیت از Sara Wilczynska سارا Wilczynska یک مهندس نرم افزار گوگل است که به هنرمند آبرنگ در سن دیگو تبدیل شده است. او از هوش مصنوعی برای کمک به او به عنوان یک صاحب کسب و کار در برنامه ریزی، حسابداری، ویرایش کپی و مربیگری استفاده می کند. با این حال، او می‌گوید که مرز مشخصی برای عدم استفاده از هوش مصنوعی برای تولید آثار هنری واقعی خود دارد. این مقاله همانطور که گفته شد بر اساس گفتگو با سارا ویلچینسکا، هنرمند 41 ساله آبرنگ و بنیانگذار Swil Arts که در سن دیگو زندگی می کند، است. او قبل از شروع حرفه هنری خود به عنوان مهندس نرم افزار در صنایع مالی و فناوری قبل از ترک شغل خود در Google در سال 2022 کار می کرد. موارد زیر برای طولانی و واضح بودن ویرایش شده است. من خیلی زود شروع به استفاده از هوش مصنوعی کردم. من استودیوی هنری خود را در سال 2023 تأسیس کردم – پس از ترک شغل مهندس نرم افزارم در گوگل در سال قبل – زمانی که هوش مصنوعی مولد شروع به در دسترس تر و قدرتمند شدن کرد. به نوعی، استودیوی خود را با آن رشد می‌دادم، و داشتن پیش‌زمینه‌ی فنی باعث می‌شود بیشتر مستعد تجربه، هیجان‌زده و احساس ترس کمتر از آن باشم. با این حال، من همیشه کاملاً واضح بودم که هرگز نمی‌خواستم هوش مصنوعی جایگزین من در هسته و قلب تجارت من شود. من می خواستم خلق کنم و با خلاقیتم به زندگی مردم ارزش بیافزایم. با این حال، من متوجه شدم که در راه اندازی یک تجارت چیزهای زیادی وجود دارد که به زمان، انرژی و پول نیاز دارد، که هوش"}, {"source": "Business Insider", "title": "Goldman's investment banking chief shares how she uses AI most — and how juniors should use it to get ahead", "link": "https://www.businessinsider.com/goldman-sachs-kim-posnett-investment-banking-ai-use-junior-analysts-2026-9", "summary": "Posnett said junior employees need to strike a balance with their AI usage. Bloomberg/Getty Images Kim Posnett, co-head of investment banking at Goldman, said AI \"raises the bar\" for client meetings. She said junior bankers need to strike the right balance with AI and offered five pieces of advice. Though AI can automate grunt work, Posnett said learning the technical basics remains important. Even the highest echelons of Goldman Sachs' investment bank are having to re-learn the art of the client meeting. Kim Posnett , the firm's co-head of investment banking, said AI has transformed the nature of those meetings for the bank and the client, both of whom can now access and understand far more information. Now, the CEOs, founders, and investors she talks to have higher expectations for good advice. \"It raises the bar for having high-impact meetings, because everyone is more educated and more intelligent before the meeting,\" she said. Posnett also uses AI to synthesize intel faster when preparing to meet with clients and, in turn, spends time on higher-order thinking, as she said is true for many senior bankers. Kim Posnett is the co-head of investment banking at Goldman Sachs. Goldman Sachs Junior bankers are similarly better prepared to sit in on client meetings, which is accelerating an apprenticeship culture that's central to the firm's identity, Posnett said. The youngest analysts can now spend more time where the true learning lives: listening to complex conversations and watching how senior bankers advise clients through high-stakes choices. Find the right AI balance Goldman Sachs spent around $6 billion on technology , and the bank's CEO, David Solomon, advised this year's interns to experiment with AI in his annual letter . As Posnett sees it, young people across industries should take his advice and aim to \"learn faster, to prepare better, and to spend more time on higher-value work.\" For investment banking analysts at Goldman Sachs, she said that often means speeding up the research process, maybe by summarizing earnings calls or analyzing industry trends. Yet juniors need to find the right balance between mastering AI and depending on it, Posnett said. \"Learn how the technology works, experiment with it, use it, and understand how it can make you more productive,\" she said. \"But my second piece of advice is even more important: invest heavily in the human skills that AI struggles to perfectly replicate, ask better questions, develop judgment, lear", "date_str": "2026-09-16T09:12:01+00:00", "hash": "966f23aac8a74341", "title_fa": "رئیس بانک سرمایه گذاری گلدمن نحوه استفاده بیشتر از هوش مصنوعی را به اشتراک می گذارد - و چگونه جوانان باید از آن برای پیشرفت استفاده کنند.", "summary_fa": "پوزنت گفت که کارمندان جوان باید تعادلی در استفاده از هوش مصنوعی خود ایجاد کنند. بلومبرگ/گتی ایماژ کیم پوسنت، یکی از مدیران بانکداری سرمایه گذاری در گلدمن، گفت که هوش مصنوعی \"نقاط\" را برای جلسات مشتریان افزایش می دهد. او گفت که بانکداران جوان باید تعادل درستی را با هوش مصنوعی ایجاد کنند و پنج توصیه ارائه کرد. اگرچه هوش مصنوعی می‌تواند کار غرغر را خودکار کند، پوزنت گفت که یادگیری اصول فنی همچنان مهم است. حتی بالاترین رده های بانک سرمایه گذاری گلدمن ساکس مجبورند هنر ملاقات با مشتری را دوباره بیاموزند. کیم پوسنت، رئیس مشترک بانکداری سرمایه گذاری این شرکت، گفت که هوش مصنوعی ماهیت این جلسات را برای بانک و مشتری تغییر داده است، که هر دو اکنون می توانند به اطلاعات بسیار بیشتری دسترسی داشته باشند و آنها را درک کنند. در حال حاضر، مدیران عامل، بنیانگذاران، و سرمایه گذارانی که او صحبت می کند انتظارات بالاتری برای مشاوره خوب دارند. او گفت: \"این سطح را برای برگزاری جلسات پرتأثیر بالا می برد، زیرا همه قبل از جلسه تحصیل کرده تر و باهوش تر هستند.\" پوزنت همچنین هنگام آماده شدن برای ملاقات با مشتریان از هوش مصنوعی برای ترکیب سریعتر اطلاعات استفاده می کند و به نوبه خود، همانطور که به گفته او برای بسیاری از بانکداران ارشد صادق است، وقت خود را صرف تفکر درجه بالاتر می کند. کیم پوسنت رئیس بانکداری سرمایه گذاری در گلدمن ساکس است. پوزنت گفت: بانکداران جونیور گلدمن ساکس به طور مشابه آمادگی بیشتری برای نشستن در جلسات مشتریان دارند، که این امر فرهنگ کارآموزی را که برای هویت شرکت مرکزی است، تسریع می کند. جوانترین تحلیلگران اکنون می توانند زمان بیشتری را در جایی که یادگیری واقعی زندگی می کند صرف کنند: گوش دادن به مکالمات پیچیده و تماشای نحوه مشاوره بانکداران ارشد به مشتریان از طریق انتخاب های"}, {"source": "Business Insider", "title": "Montana Senate candidate who shot a stand-in Flock camera in a campaign ad calls for federal limits on surveillance tech", "link": "https://www.businessinsider.com/montana-senate-candidate-shoots-flock-camera-campign-ad-federal-regulation-2026-9", "summary": "Seth Bodnar, who is running for US Senate in Montana, called for federal regulation on surveillance tech. William Campbell/Getty Images A new campaign ad from Seth Bodnar, an Independent running for US Senate in Montana, targets Flock. Bodnar said he supports federal legislation to address privacy risks posed by Flock. \"This isn't an issue that's about left or right,\" Bodnar said. Seth Bodnar pulls a shotgun from the back of his truck, lines up his mark on a tree stump with a bag of flour set behind, takes aim, and pulls the trigger. His target? A Flock camera . Or a stand-in for one at least. Bodnar, an Independent running for US Senate in Montana , performed the stunt in a new campaign ad shared this week. The veteran and former University of Montana president told Business Insider that Flock cameras are an issue on which voters across the political spectrum can agree. \"This isn't an issue that's about left or right,\" he said. \"This is about individual freedom.\" Bodnar said he put out the video because Montanans have told him they don't want a corporation logging every trip they take, whether it's to church, the doctor, the gun store, or a friend's house. They're not alone. Flock Safety has drawn the ire of Americans across the country, who have taken issue with the company's automated license-plate readers, which are found in thousands of communities in the US. Trump says he \"likes\" Flock cameras. I say \"Flock off.\" pic.twitter.com/NekA0w4VJd — Seth Bodnar for Montana (@SethBodnarForMT) September 14, 2026 In addition to privacy concerns, critics have pointed to cases in which the tech has misidentified plates or police have misused the data, like by monitoring an ex. A Business Insider investigation found several cases where police using Flock wrongfully targeted or arrested a person who had not committed a crime. Flock and police departments have said the technology has been helpful in addressing crime, including vehicle break-ins, and finding missing people. Last month, the company rolled out new guardrails , such as reducing the default retention period for data, in response to the backlash. Some local and state jurisdictions have also responded by cutting their use of Flock . Call for federal limits on surveillance tech Bodnar said he supports the bipartisan Flock-Off Act, introduced this month by Reps. Thomas Massie and Eric Burlison, which is intended to cut federal funding used for automated license-plate readers and biometric surveillance camera", "date_str": "2026-09-16T09:11:01+00:00", "hash": "a86ef44dea7de353", "title_fa": "کاندیدای سنای مونتانا که در یک تبلیغات تبلیغاتی از دوربین Flock عکس گرفت، خواستار محدودیت‌های فدرال برای فناوری نظارت شد.", "summary_fa": "ست بودنار، که برای مجلس سنای ایالات متحده در مونتانا نامزد می شود، خواستار تنظیم مقررات فدرال در زمینه فناوری نظارت شد. ویلیام کمپبل/ گتی ایماژ یک تبلیغ کمپین جدید از ست بودنار، یک مستقل که برای مجلس سنای ایالات متحده در مونتانا شرکت می کند، فلاک را هدف قرار می دهد. بودنار گفت که از قانون فدرال برای رسیدگی به خطرات حریم خصوصی ناشی از Flock حمایت می کند. بودنار گفت: «این موضوع مربوط به چپ یا راست نیست. ست بودنار یک تفنگ ساچمه ای را از پشت کامیونش بیرون می کشد، علامت خود را روی کنده درخت با کیسه ای آرد در پشت آن ردیف می کند، نشانه می گیرد و ماشه را می کشد. هدف او؟ دوربین گله یا حداقل یک استند این. Bodnar، یک عضو مستقل که برای مجلس سنای ایالات متحده در مونتانا نامزد می شود، این شیرین کاری را در تبلیغات کمپین جدیدی که این هفته به اشتراک گذاشته شد، انجام داد. این کهنه کار و رئیس سابق دانشگاه مونتانا به Business Insider گفت که دوربین های Flock موضوعی است که رای دهندگان در سراسر طیف سیاسی می توانند در مورد آن توافق کنند. او گفت: «این موضوعی نیست که مربوط به چپ یا راست باشد. \"این در مورد آزادی فردی است.\" بودنار گفت که او این ویدئو را منتشر کرده است زیرا مونتانی‌ها به او گفته‌اند که نمی‌خواهند شرکتی در هر سفری که می‌روند، اعم از کلیسا، دکتر، فروشگاه اسلحه یا خانه یک دوست، ثبت نام کند. آنها تنها نیستند. Flock Safety خشم آمریکایی‌ها را در سرتاسر کشور برانگیخته است، آنها با پلاک‌خوان‌های خودکار این شرکت که در هزاران جامعه در ایالات متحده یافت می‌شوند، مشکل دارند. ترامپ می گوید دوربین های Flock را \"دوست دارد\". من می گویم \"گله دور.\" pic.twitter.com/NekA0w4VJd — ست بودنار برای مونتانا (@SethBodnarForMT) 14 سپتامبر 2026 علاوه بر"}, {"source": "Business Insider", "title": "Amazon's next move could reshape how America shops — all over again", "link": "https://www.businessinsider.com/amazon-plans-1000-same-day-fulfillment-centers-challenge-walmart-2026-9", "summary": "A worker scans an Amazon package on a Prime delivery truck in New York Bloomberg/Getty Images Amazon wants to build more than 1,000 same-day delivery facilities by 2031. The plan would put same-day hubs within 10 miles of most Amazon Prime customers in the US. The expansion could challenge Walmart's physical delivery advantage, and change shopping habits. Amazon is plotting an unprecedented expansion of its same-day delivery operation that could redraw the map of American retail and take on Walmart 's biggest advantage in everyday shopping. The initiative, codenamed Project Mercury, would expand Amazon's same-day fulfillment network to more than 1,000 locations by 2031, an increase of more than tenfold from the roughly 85 facilities the company operates today, according to internal planning documents reviewed by Business Insider. The effort will cost billions of dollars and could reshape how Americans shop for everyday items such as fresh food, paper towels, and cough medicine. Walmart, with thousands of huge stores close to most US consumers, has dominated this valuable, sticky market. Amazon is betting it can rewrite the rules of everyday retail by moving inventory dramatically closer to customers through hundreds of new Same Day Fulfillment Centers, or SSDs, which stock its 90,000 most popular products. \"Transformational\" One document described Project Mercury as a \"transformational initiative to reshape the Same-Day Delivery network.\" The project fundamentally redesigns this network around shorter distances. Amazon currently puts these same-day facilities about a 90-minute drive from customers. Now, it aims to put SSDs within a 10-mile straight-line radius of 80% of Prime subscribers in the US by 2031, according to the documents. An Amazon spokesperson told Business Insider that internal projections are \"preliminary, subject to significant revision, and shouldn't be treated as finalized plans.\" Amazon's same-day network currently serves more than 10,000 cities and towns, including rural communities, the spokesperson added, though same-day orders aren't exclusively fulfilled through SSD facilities. \"That said, it's no secret that we're focused on delivering faster for customers and the expansion of our same-day delivery network is playing a big role in that,\" the spokesperson said. \"We continue to invest in fast delivery speed and convenience alongside wide selection and everyday low prices.\" Taking on Walmart's physical advantage The plan could help Am", "date_str": "2026-09-16T09:00:01+00:00", "hash": "98a4a22fdfb4f016", "title_fa": "حرکت بعدی آمازون می‌تواند نحوه خریدهای آمریکا را دوباره شکل دهد", "summary_fa": "یک کارگر بسته آمازون را در یک کامیون تحویل پرایم در نیویورک اسکن می کند. این گسترش می تواند مزیت تحویل فیزیکی والمارت را به چالش بکشد و عادات خرید را تغییر دهد. آمازون در حال برنامه ریزی برای گسترش بی سابقه عملیات تحویل همان روز خود است که می تواند نقشه خرده فروشی آمریکا را دوباره ترسیم کند و از بزرگترین مزیت والمارت در خریدهای روزمره بهره مند شود. بر اساس اسناد برنامه ریزی داخلی بررسی شده توسط Business Insider، این ابتکار با نام رمز پروژه مرکوری، تا سال 2031 به بیش از 1000 مکان در آمازون گسترش می دهد که بیش از 10 برابر بیشتر از تقریباً 85 تأسیساتی است که شرکت امروزی دارد. این تلاش میلیاردها دلار هزینه خواهد داشت و می‌تواند نحوه خرید آمریکایی‌ها برای اقلام روزمره مانند غذای تازه، دستمال کاغذی و داروهای سرفه را تغییر دهد. والمارت، با هزاران فروشگاه بزرگ نزدیک به اکثر مصرف کنندگان ایالات متحده، بر این بازار ارزشمند و چسبنده تسلط داشته است. آمازون شرط می‌بندد که می‌تواند قوانین خرده‌فروشی روزمره را با نزدیک‌تر کردن موجودی به مشتریان از طریق صدها مرکز جدید در همان روز یا SSD، که دارای 90000 محبوب‌ترین محصول آن است، بازنویسی کند. یک سند \"تحول کننده\" پروژه مرکوری را به عنوان \"ابتکار تحولی برای تغییر شکل شبکه تحویل همان روز\" توصیف کرد. این پروژه اساساً این شبکه را در فواصل کوتاه‌تر دوباره طراحی می‌کند. آمازون در حال حاضر این امکانات یک روزه را در فاصله 90 دقیقه ای از مشتریان قرار می دهد. بر اساس این اسناد، اکنون قصد دارد تا سال 2031، SSD ها را در شعاع خط مستقیم 10 مایلی 80 درصد از مشترکان Prime در ایالات متحده قرار دهد. یکی از سخنگویان آمازون به Business Insider گفت که پیش‌بینی‌های داخلی \"مقدمه‌ای هستند، در معرض بازنگری قابل توجهی هستند و نباید به عنوان"}, {"source": "Business Insider", "title": "The latest evidence of hedge funds using real estate to draw talent: $35 billion Brevan Howard is opening a Greenwich office", "link": "https://www.businessinsider.com/brevan-howard-new-greenwich-office-talent-war-location-2027-2026-9", "summary": "Brevan Howard is currently run by Aron Landy. ADFW Brevan Howard is opening an office in Greenwich next year. The $35 billion firm will also open its Miami office later this year. Office locations in tax-free or commuter-friendly locales are tools funds use in the ongoing talent war. Forget Greece — Brevan Howard's latest real-estate digs will be in an old-school hedge fund hot spot. The $35 billion manager is adding an office in Greenwich, the leafy Connecticut suburb long known for its concentration of hedge funds, early next year, a person close to Brevan told Business Insider. It will be the European-based firm's fourth American outpost, along with offices in New York, Austin, and Miami, the latter of which is set to open later this year. The firm, which has personnel in London, Jersey, and Geneva, does not currently have an outpost in Athens. The Greek capital has been an industrywide topic of conversation after onetime Brevan cofounder Chris Rokos decided to move there personally and establish an office for his $22 billion macro fund. Regardless of whether an office is near the Long Island Sound or the Aegean Sea, hedge funds have long used workplace locales to recruit and retain top investors. As the industry's war for talent continues, and cities around the world compete to become the next financial hub, office openings have become a unique barometer for the industry's competitiveness and geopolitical moves. It's rare to find a major American hedge fund without a presence in Connecticut, which boasts plenty of commuter communities that make up the broader Tri-State metro area. Hedge funds that count Greenwich as their headquarters include AQR and Verition, while Bridgewater is in nearby Westport, and Point72 and Viking Global are in Stamford. Brevan's soon-to-debut Miami office, meanwhile, follows several big-name funds that have added real estate in Florida, which has attracted wealthy individuals with no state income tax and year-round sunshine. Citadel relocated its headquarters to the Magic City in 2022, while Elliott is now based in West Palm Beach. Internationally, Greece is the latest entrant in the competition to win over کی صنعت تبدیل شده است. به ندرت می توان یک صندوق سرمایه گذاری بزرگ آمریکایی را بدون حضور در کانکتیکات پیدا کرد، که دارای تعداد زیادی از جوامع"}, {"source": "Business Insider", "title": "Parents are drowning in school apps", "link": "https://www.businessinsider.com/parents-drowning-school-apps-pickup-grades-kids-sports-teachers-2026-9", "summary": "Getty Images; Alyssa Powell/BI Elly Dominicis doesn't consider herself a tiger parent — but the technological jungle of modern-day parenting might turn her into one. She's inundated by the battery of apps and tools required to handle her sons' schooling and activities. There's ClassDojo for communication and behavior management, a school portal for the gradebook, homework, and lunch payments, and \"good ol' email,\" Dominicis says. Then there are the WhatsApp groups: the official ones for each class, the unofficial spinoffs for the soccer team and mom chat , and the spinoff of the spinoff without the one mom nobody likes. \"It takes up a lot of brain space,\" Dominicis, a 40-year-old mother of a kindergartener and second grader in Miami, says. Technology has given parents a remarkable amount of visibility into their kids' daily lives. In some ways, this is a welcome change — no more worrying about lost permission slips or wondering how school really was. But it's also a lot . Schools use a sea of apps for grades, announcements, bus schedules, activity signups, and pickup times. These tools are hard to keep track of and often don't link to each other, meaning parents wind up managing mini workplace software stacks just to tread water. Dominicis has also started noticing more AI-generated content from teachers , including \"overly verbose\" emails about relatively minor issues. \"I just respond with AI back, and we're just AI-ing to each other about a missing assignment or something,\" she says. She feels like she can't turn off any notifications and, as a result, is constantly a little on edge. Teachers and districts aren't doing much triage, either. \"A message about a lice outbreak, let's say, versus a reminder to wear a weird hat for wacky Wednesday — it truly hits my nervous system in the same way,\" she says. The morning we spoke, she thought she'd had a panic attack. K-12 school districts in the United States have access to an average of 3,000 digital tools, according to the educational technology company Instructure. While many of those apps aren't parent-facing, the deluge means that every school year parents have to get acquainted with a new wave of tech — and remember last year's logins. A constellation of factors explain why these systems remain so fragmented. Teachers have a lot of autonomy over which apps they use, and many simply have different preferences. Edtech companies target individual teachers, hoping that if enough of them start using a tool, th", "date_str": "2026-09-16T08:27:01+00:00", "hash": "6eb67d6d1085df2b", "title_fa": "والدین در برنامه های مدرسه غرق می شوند", "summary_fa": "گتی ایماژ; آلیسا پاول/بی‌آی الی دومینیسیس خود را یک والد ببر نمی‌داند - اما جنگل‌های تکنولوژیکی والدین امروزی ممکن است او را به یکی از آنها تبدیل کند. او توسط باتری برنامه ها و ابزارهای مورد نیاز برای اداره مدرسه و فعالیت های پسرانش غرق شده است. Dominicis می‌گوید ClassDojo برای مدیریت ارتباط و رفتار، یک پورتال مدرسه برای دفترچه نمرات، تکالیف و پرداخت‌های ناهار و «ایمیل خوب» وجود دارد. سپس گروه‌های واتس‌اپ هستند: گروه‌های رسمی برای هر کلاس، اسپین‌آف‌های غیررسمی برای تیم فوتبال و چت مادر، و اسپین‌آف اسپین‌آف بدون مادری که هیچ‌کس دوست ندارد. دومینیسیس، مادر 40 ساله مهدکودکی و کلاس دومی در میامی، می گوید: «این کار فضای زیادی از مغز را اشغال می کند. فناوری به والدین دید قابل توجهی در زندگی روزمره فرزندانشان داده است. از برخی جهات، این یک تغییر خوشایند است - دیگر نگران از دست دادن برگه های مجوز یا تعجب نباشید که واقعاً مدرسه چگونه بوده است. اما این هم زیاد است. مدارس از دریایی از برنامه‌ها برای نمرات، اطلاعیه‌ها، برنامه‌های اتوبوس، ثبت‌نام فعالیت‌ها و زمان‌های تحویل استفاده می‌کنند. ردیابی این ابزارها سخت است و اغلب به یکدیگر مرتبط نیستند، به این معنی که والدین می‌توانند پشته‌های نرم‌افزار مینی محل کار را فقط برای پا گذاشتن آب مدیریت کنند. Dominicis همچنین متوجه محتوای بیشتر معلمان تولید شده توسط هوش مصنوعی شده است، از جمله ایمیل های \"بیش از حد پرمخاطب\" در مورد مسائل نسبتاً جزئی. او می‌گوید: «من فقط با هوش مصنوعی پاسخ می‌دهم، و ما فقط در مورد یک تکلیف از دست رفته یا چیز دیگری با هوش مصنوعی با هم صحبت می‌کنیم. او احساس می‌کند که نمی‌تواند هیچ اعلان‌هایی را خاموش کند و در نتیجه دائماً کمی در حاشیه است. معلمان و بخش ها نیز تریاژ زیادی انجام نمی دهند. او می‌گوید: «مثلاً پیامی در مورد شیوع شپش در"}, {"source": "Business Insider", "title": "Goldman Sachs checked one of the bond market's biggest fears. It hasn't happened yet.", "link": "https://www.businessinsider.com/us-bonds-treasury-yield-rates-foreign-demand-goldman-sachs-2026-9", "summary": "Investors are closely watching whether foreign demand for US corporate bonds can withstand rising Treasury yields and higher interest rates. Michael M Santiago/Getty Images Foreign demand for US corporate bonds is holding up despite this year's bond market selloff. European investors have been the biggest buyers, outpacing Asia by more than two to one. Goldman Sachs says the world's biggest credit market has few real alternatives. Investors have worried that higher yields would drive foreign buyers out of the US corporate bond market. So far, that hasn't happened. Despite a sharp rise in Treasury yields this year, foreign demand for US corporate bonds has remained robust, according to Goldman Sachs. Through the end of June, net foreign purchases of US corporate bonds totaled $251 billion, putting 2026 on pace to nearly match last year's record $392 billion, according to Lynam's analysis. \"This is notable as the foreign appetite for US credit has persisted despite a range of headwinds in recent years, including fluctuations in the strength of the dollar and the cost of hedging,\" Amanda Lynam, the chief credit strategist at Goldman Sachs, wrote in a Tuesday note. Foreign investors own about 29% of the US corporate bond market, making them a crucial source of demand. Goldman's note comes as investors assess whether higher borrowing costs will put further pressure on the bond market ahead of the Federal Reserve's policy decision on Wednesday. The benchmark 10-year Treasury yield closed at 5% on Tuesday after hitting its highest level since 2007 as investors increasingly expect interest rates to stay higher for longer. Japan's pullback may not matter Since early 2022, European investors have accounted for 52% of net foreign purchases of US corporate bonds, more than double Asia's 21% share. Even so, recent market attention has centered on Japan, where investors have watched whether rising domestic bond yields and policymakers' calls for greater investment at home would prompt institutions to shift money back to Japanese assets. However, Lynam expects any further reductions in Japanese holdings of US investment-grade and high-yield bonds to be \"manageable in the context of the broader market.\" Despite higher Treasury yields, Japan's policy shift, and years of debate over foreign demand for US assets, Goldman says there are still few alternatives to the size and depth of the US corporate bond market. \"We continue to expect a floor to remain under foreign purchase", "date_str": "2026-09-16T05:34:03+00:00", "hash": "2676a35e6c840823", "title_fa": "گلدمن ساکس یکی از بزرگترین ترس های بازار اوراق قرضه را بررسی کرد. هنوز اتفاق نیفتاده", "summary_fa": "سرمایه گذاران به دقت دنبال می کنند که آیا تقاضای خارجی برای اوراق قرضه شرکتی ایالات متحده می تواند در برابر افزایش بازده خزانه داری و نرخ های بهره بالاتر مقاومت کند یا خیر. مایکل ام سانتیاگو/ گتی ایماژز تقاضای خارجی برای اوراق قرضه شرکتی ایالات متحده علیرغم فروش بازار اوراق قرضه در سال جاری همچنان ادامه دارد. سرمایه گذاران اروپایی بزرگترین خریداران بوده اند و بیش از دو بر یک از آسیا پیشی گرفته اند. گلدمن ساکس می گوید که بزرگترین بازار اعتباری جهان جایگزین های واقعی کمی دارد. سرمایه گذاران نگران هستند که بازدهی بالاتر خریداران خارجی را از بازار اوراق قرضه شرکتی ایالات متحده خارج کند. تا کنون، این اتفاق نیفتاده است. به گفته گلدمن ساکس، علیرغم افزایش شدید بازدهی خزانه داری در سال جاری، تقاضای خارجی برای اوراق قرضه شرکتی ایالات متحده همچنان قوی باقی مانده است. بر اساس تحلیل Lynam، تا پایان ماه ژوئن، خالص خریدهای خارجی اوراق قرضه شرکتی ایالات متحده به 251 میلیارد دلار رسید که سال 2026 را با سرعتی نزدیک به رکورد 392 میلیارد دلاری سال گذشته رساند. آماندا لینام، استراتژیست ارشد اعتباری گلدمن ساکس، در یادداشتی در روز سه‌شنبه نوشت: «این امر قابل توجه است زیرا اشتهای خارجی برای اعتبار ایالات متحده علی‌رغم طیفی از بادهای مخالف در سال‌های اخیر، از جمله نوسانات در قدرت دلار و هزینه پوشش ریسک، ادامه داشته است». سرمایه گذاران خارجی حدود 29 درصد از بازار اوراق قرضه شرکتی ایالات متحده را در اختیار دارند که آنها را به منبع حیاتی تقاضا تبدیل می کند. یادداشت گلدمن در حالی منتشر می‌شود که سرمایه‌گذاران ارزیابی می‌کنند که آیا هزینه‌های استقراض بالاتر فشار بیشتری بر بازار اوراق قرضه پیش از تصمیم‌گیری فدرال رزرو در روز چهارشنبه وارد می‌کند یا خیر. بازدهی شاخص 10 ساله خزانه داری در روز سه شنبه پس از رسیدن به بالاترین سطح خود"}, {"source": "Business Insider", "title": "Tom Cruise, 64, says he saw himself as the ‘CEO’ of his life early on", "link": "https://www.businessinsider.com/tom-cruise-ceo-of-his-life-career-filmmaking-work-ethic-2026-9", "summary": "Tom Cruise says he wrote down his goals as a teenager after realizing he wanted to make movies. Gilbert Flores/Variety via Getty Images Tom Cruise said he knew at a young age that he wanted to make movies. He wrote down his goals and the steps he needed to take to achieve them. The \"Mission: Impossible\" actor said his career moves were \"not happenstance.\" Tom Cruise , 64, said it was his childhood dream to make movies, and he worked hard to make that dream a reality. Speaking to GQ in an interview published Tuesday, Cruise said he would map out the skills he needed to make films, breaking each one into actionable tasks. \"What I did was write goals ,\" Cruise said. \"Still, it's like you're looking at something, you write a goal, and then you write underneath, what are those things you need to learn to be able to accomplish those goals?\" The \" Mission: Impossible \" star said he would learn new skills and apply them in his own work. He would also study how other movies use camera placement, lenses, lighting, and set architecture. Cruise said he was passionate about filmmaking even as a teenager, but stopped sharing his ambitions because some of the adults around him dismissed him as \"a little kid.\" \"But I never let go of it, and I understood very early on, this is for me,\" Cruise said. \"I'm a CEO of my life, I know the dreams that I want,\" Cruise said. \"I want to see what those people are like in those different countries. What is it like that language? What are they saying? What's it like hearing that? And movies for me were an in.\" Cruise said he is a \"hard worker\" and felt he \"could outwork anyone.\" Even now, when he's not on a movie set, he's preparing for the next project. He added that his career moves, including filming in locations like Prague and China and working with Ridley Scott in England, were \"not happenstance.\" \"I would see those doors that open. I'm going, 'here's an opportunity,'\" Cruise said. He said his work ethic extends to collaborators, and he is upfront about the high standards he expects. \"The rumors are true,\" he added. Getting older also hasn't changed his ambitions or his appetite for taking on new challenges. \"Life, I'm coming right at it,\" he said. \"You know what I mean? It's coming at me, and I'm coming right at it.\" After more than four decades in entertainment, Cruise remains one of Hollywood's most sought-after stars. In 2023, he told Business Insider that he was \"always pushing\" to make each film as entertaining as possible. ", "date_str": "2026-09-16T04:54:16+00:00", "hash": "8597f4b7243c538e", "title_fa": "تام کروز، 64 ساله، می گوید که در اوایل خود را به عنوان \"مدیرعامل\" زندگی خود می دید", "summary_fa": "تام کروز می گوید در دوران نوجوانی پس از اینکه فهمید می خواهد فیلم بسازد، اهداف خود را یادداشت کرده است. گیلبرت فلورس/ورایتی از طریق گتی ایماژ تام کروز گفت که در سنین جوانی می‌دانست که می‌خواهد فیلم بسازد. او اهداف خود و اقداماتی را که برای رسیدن به آنها باید انجام دهد، یادداشت کرد. بازیگر فیلم «ماموریت غیرممکن» گفت که حرکت‌های حرفه‌ای‌اش «تصادفی نبودند». تام کروز 64 ساله گفت که رویای دوران کودکی‌اش ساختن فیلم بوده است و او سخت تلاش کرده تا این رویا را به واقعیت تبدیل کند. کروز در مصاحبه‌ای با GQ که روز سه‌شنبه منتشر شد، گفت که مهارت‌های مورد نیاز برای ساخت فیلم را ترسیم می‌کند و هر کدام را به وظایف عملی تقسیم می‌کند. کروز گفت: «کاری که انجام دادم نوشتن اهداف بود. \"با این حال، مثل این است که شما به چیزی نگاه می کنید، هدفی را می نویسید، و سپس زیر آن می نویسید، آن چیزهایی که باید یاد بگیرید تا بتوانید به آن اهداف برسید، چیست؟\" ستاره \"ماموریت غیرممکن\" گفت که مهارت های جدیدی را یاد خواهد گرفت و آنها را در کار خود به کار خواهد گرفت. او همچنین نحوه استفاده فیلم‌های دیگر از محل قرارگیری دوربین، لنزها، نورپردازی و معماری مجموعه را مطالعه می‌کند. کروز گفت که او حتی در نوجوانی به فیلمسازی علاقه داشت، اما از به اشتراک گذاشتن جاه طلبی های خود دست کشید زیرا برخی از بزرگسالان اطرافش او را به عنوان \"بچه کوچک\" رد می کردند. کروز گفت: \"اما من هرگز آن را رها نکردم و خیلی زود فهمیدم که این برای من است.\" کروز گفت: \"من مدیر اجرایی زندگی ام هستم، رویاهایی را که می خواهم می دانم.\" «می‌خواهم ببینم آن‌ها در کشورهای مختلف چگونه هستند. آن زبان چگونه است؟ آنها چه می گویند؟ شنیدن آن چه حسی دارد؟ و فیلم‌ها برای من"}, {"source": "Business Insider", "title": "OpenAI's CFO says AI is replacing some jobs, but many are mundane ones", "link": "https://www.businessinsider.com/sarah-friar-openai-cfo-ai-replacing-mundane-jobs-2026-9", "summary": "OpenAI s CFO said AI is reducing the need for workers doing repetitive tasks, like credit checks. Bloomberg/Getty Images OpenAI CFO Sarah Friar said AI is reducing the need for workers doing repetitive tasks. Friar said OpenAI uses AI for \"mundane\" finance work like credit checks. Friar said that with AI, the cost of each credit check fell from $200 to about $0.17. OpenAI CFO Sarah Friar said that AI is reducing the need for some workers , but only repetitive ones. In a Tuesday interview with CNBC's Jim Cramer on \"Mad Money,\" Friar addressed AI use for efficiency at OpenAI, using her own finance department as an example. \"There is no doubt we are doing things with our own products inside of finance, for example, that do limit the number of people we need,\" Friar told Cramer. \"But in many cases it's for jobs that I don't think of as great jobs, frankly.\" Friar pointed to credit checks as one example. OpenAI's procurement operation was conducting them at an annual rate of 2,800 last year, she said. \"That credit check is a pretty mundane piece of work,\" Friar said. \"Do you want a junior analyst doing that, or can we get a very intelligent model to do it for us?\" \"I think it's actually enabling people to do more work at the edge, more work where intelligence is needed,\" Friar added. \"And then you get a lot of the rote stuff done by the model and actually done at probably a better scale and with more accuracy, frankly.\" The financial payoff was significant: Friar said the cost per check fell from $200 per check to about 17 cents. \"That is a great ROI for a CFO,\" Friar added. Friar's comments come as some leading AI figures issue much starker warnings about the technology's impact on employment. Anthropic CEO Dario Amodei has said AI could eliminate half of entry-level white-collar jobs, while Geoffrey Hinton , the Nobel Prize-winning computer scientist known as a \"godfather of AI,\" recently said such predictions were \"probably right.\" Hinton said AI still fails at some tasks, but cautioned that the technology is improving quickly. \"We're in the very early stages,\" Hinton told Bernie Sanders in an interview in November 2025. \"This is a new technology . It's getting better very fast.\" Read the original article on Business Insider", "date_str": "2026-09-16T04:01:01+00:00", "hash": "e01b6c486d3c5639", "title_fa": "مدیر مالی OpenAI می‌گوید هوش مصنوعی جایگزین برخی از مشاغل می‌شود، اما بسیاری از آنها مشاغل پیش پا افتاده هستند", "summary_fa": "مدیر مالی OpenAI گفت هوش مصنوعی نیاز به کارگرانی را که کارهای تکراری انجام می‌دهند، مانند بررسی اعتبار، کاهش می‌دهد. سارا فریار، مدیر مالی OpenAI بلومبرگ/ گتی ایماژ گفت که هوش مصنوعی نیاز به کارگرانی که کارهای تکراری انجام می دهند را کاهش می دهد. فریار گفت OpenAI از هوش مصنوعی برای کارهای مالی \"دنیوی\" مانند چک های اعتباری استفاده می کند. فریار گفت که با هوش مصنوعی، هزینه هر چک اعتباری از 200 دلار به حدود 0.17 دلار کاهش یافت. سارا فریار، مدیر مالی OpenAI، گفت که هوش مصنوعی نیاز به برخی از کارگران را کاهش می دهد، اما فقط به کارگران تکراری. فریار در مصاحبه روز سه شنبه با جیم کرامر از CNBC در مورد \"Mad Money\" به استفاده از هوش مصنوعی برای بهره وری در OpenAI پرداخت و از بخش مالی خود به عنوان مثال استفاده کرد. فریار به کرامر گفت: «شکی نیست که ما کارهایی را با محصولات خودمان در حوزه مالی انجام می دهیم، به عنوان مثال، تعداد افراد مورد نیاز ما را محدود می کند. اما در بسیاری از موارد این برای مشاغلی است که من آنها را به عنوان مشاغل عالی فکر نمی کنم. فریار به چک های اعتباری به عنوان یک نمونه اشاره کرد. او گفت که عملیات تدارکات OpenAI آنها را با نرخ سالانه 2800 در سال گذشته انجام می داد. فریار گفت: «این بررسی اعتباری یک کار بسیار پیش پا افتاده است. \"آیا می خواهید یک تحلیلگر جوان این کار را انجام دهد، یا می توانیم یک مدل بسیار هوشمند برای انجام آن برای ما داشته باشیم؟\" فریار افزود: «من فکر می‌کنم این در واقع به مردم این امکان را می‌دهد که کارهای بیشتری را در لبه‌ها انجام دهند، کارهای بیشتری در جایی که به هوش نیاز است. \"و سپس شما بسیاری از کارها را که توسط مدل انجام می"}, {"source": "Business Insider", "title": "Mark Zuckerberg says AI labs can slow down on their own when safety demands it", "link": "https://www.businessinsider.com/zuckerberg-says-ai-labs-slow-down-market-pressure-for-safety-2026-9", "summary": "The Meta CEO said AI labs don t need an industry-wide pact to slow down for safety. Bloomberg/Getty Images Mark Zuckerberg said AI labs don't need an industry-wide pact to slow down for safety. Zuckerberg said market pressure will make trust and alignment competitive advantages. Zuckerberg said Meta delayed its Muse model for months without asking rival labs to do the same. Mark Zuckerberg said AI companies don't need an industry-wide agreement to slow development when safety concerns emerge. In a post on X on Tuesday, the Meta CEO argued that market pressure will make alignment, meaning ensuring that AI systems follow their users' intentions, a competitive advantage. \"Every lab has the responsibility and incentive to move at the pace required to train its models safely,\" Zuckerberg said. \"My view is that trust and alignment are quickly becoming the most important capabilities that will differentiate agents and models,\" Zuckerberg added. \"Any lab that doesn't focus on alignment will fall behind.\" Zuckerberg pointed to Meta's decision to delay its Muse model for several months to strengthen its safety and security . \"We didn't call for everyone else to do this before we would,\" Zuckerberg said. \"We just did it.\" Zuckerberg's comments land amid an escalating debate over whether frontier AI development should be slowed through coordinated, verifiable safeguards. Anthropic has called for government regulations and mechanisms that would allow leading labs to pause if warning signs emerge, but other tech leaders, including Nvidia CEO Jensen Huang , have said they favor independent evaluations and individual liability for AI companies. Meta Chief AI Officer Alexandr Wang echoed Zuckerberg with his own post later on Tuesday, saying labs need strong governance, external evaluators, and independent oversight of model launches. \"Racing on recursive self-improvement is one of the riskiest pathways for potential loss of control to powerful models,\" Wang said. \"Meta is committing the significant majority of our compute towards serving people rather than racing on RSI, and other labs can choose to do the same,\" Wang added. \"AI is a very powerful technology, and there is immense responsibility in developing it safely alongside the right checks and balances.\" Read the original article on Business Insider", "date_str": "2026-09-16T01:25:35+00:00", "hash": "05ce06a51b6a0ec8", "title_fa": "مارک زاکربرگ می‌گوید که آزمایشگاه‌های هوش مصنوعی می‌توانند در مواقعی که ایمنی ایجاب می‌کند، سرعت خود را کاهش دهند", "summary_fa": "مدیر عامل متا گفت که آزمایشگاه‌های هوش مصنوعی برای ایمنی نیازی به یک پیمان در سطح صنعت ندارند. بلومبرگ/گتی ایماژز مارک زاکربرگ گفت آزمایشگاه‌های هوش مصنوعی برای ایمنی نیازی به یک پیمان در سطح صنعت ندارند. زاکربرگ گفت فشار بازار اعتماد و همسویی را به مزیت های رقابتی تبدیل می کند. زاکربرگ گفت متا مدل Muse خود را برای ماه‌ها به تعویق انداخت بدون اینکه از آزمایشگاه‌های رقیب بخواهد همین کار را انجام دهند. مارک زاکربرگ گفت که شرکت‌های هوش مصنوعی برای کاهش سرعت توسعه در زمانی که نگرانی‌های ایمنی ظاهر می‌شوند، نیازی به یک توافق کل صنعت ندارند. در پستی در روز سه‌شنبه در X، مدیر عامل متا استدلال کرد که فشار بازار باعث همسویی می‌شود، به این معنی که اطمینان حاصل شود که سیستم‌های هوش مصنوعی از اهداف کاربران خود پیروی می‌کنند که یک مزیت رقابتی است. زاکربرگ گفت: \"هر آزمایشگاهی مسئولیت و انگیزه ای برای حرکت با سرعت لازم برای آموزش ایمن مدل های خود دارد.\" زاکربرگ افزود: \"نظر من این است که اعتماد و همسویی به سرعت به مهمترین قابلیت هایی تبدیل می شوند که عوامل و مدل ها را متمایز می کند.\" \"هر آزمایشگاهی که بر روی هم ترازی تمرکز نکند، عقب خواهد ماند.\" زاکربرگ به تصمیم متا برای به تاخیر انداختن چند ماهه مدل Muse خود برای تقویت ایمنی و امنیت آن اشاره کرد. زاکربرگ گفت: \"ما قبل از ما از دیگران دعوت نکردیم که این کار را انجام دهند.\" \"ما فقط این کار را انجام دادیم.\" اظهارات زاکربرگ در بحبوحه بحث تشدید شده در مورد اینکه آیا توسعه هوش مصنوعی مرزی باید از طریق پادمان های هماهنگ و قابل تأیید کند شود یا خیر، سرچشمه می گیرد. Anthropic خواستار مقررات و مکانیسم‌های دولتی شده است که به آزمایشگاه‌های پیشرو اجازه می‌دهد در صورت ظهور علائم هشدار توقف کنند، اما سایر رهبران فناوری، از"}, {"source": "Business Insider", "title": "Target offers worker dress-code options harkening back to 'Tar-zhay.", "link": "https://www.businessinsider.com/target-mizrahi-exclusive-apparel-for-employees-dress-code-2026-9", "summary": "The name of Target s employee apparel Collection 186 is a reference to the trademark red shade Pantone 186. Target Target employees are getting a new line of approved apparel options for work. The collection, designed by style icon Isaac Mizrahi, features the company's trademark shade of red. \"It's also to create that feeling of a little bit of swagger,\" Target's chief stores officer told BI. Target workers are getting a stylish new way to follow the retailer's dress code. The company said Tuesday it is offering employees access to a line of apparel in the bullseye's trademark red, designed by style icon Isaac Mizrahi. Target implemented tighter dress code requirements earlier this summer for store workers as part of new CEO Michael Fiddelke's larger effort to elevate the shopping experience and return the company to growth . The new rules require blue or beige pants, and that tops be primarily Target-shaded red. Social media reaction to the policy change was mixed. \"Dress code is important because we want our team members to be recognizable to our guests,\" chief stores officer Adrienne Costanzo told Business Insider in an interview ahead of the announcement. \"A level of professionalism and how we show up for our guests matters.\" Only active Target employees can buy the new Collection 186. Target The new apparel harkens back to Target's \"cheap chic\" aesthetic — pioneered by Mizrahi — that earned the brand the \"Tar-zhay\" moniker. \" Store team members are the heart and soul of Target, and I was thrilled to contribute to their experience in the way I know best,\" Mizrahi said in a statement to Business Insider. Starting at $10 before employee discounts, the 16-piece collection joins Target's employee-exclusive workwear line dubbed Collection 186, which refers to the trademark red shade Pantone 186. The limited-edition items are slated to be available on October 5, and some items will not be replenished if they sell out. Target said the collection includes performance fabric shirts, as well as layers such as track jackets, cardigans, blazers, and vests. Stores already provide basic vests that employees may borrow if they're not wearing an allowed shade of red. The company said says all items in the 186 assortment are optional for employees, and that dress code compliant clothing may be purchased anywhere. Costanzo said the collection has something for those who are more focused on performance as well as more fashion-minded employees. The new collection is a mix", "date_str": "2026-09-15T22:27:07+00:00", "hash": "d02de3fcf67635e5", "title_fa": "Target گزینه‌های کد لباس کارگر را ارائه می‌دهد که به «Tar-zhay» بازمی‌گردد.", "summary_fa": "نام مجموعه 186 پوشاک کارکنان Target اشاره ای به علامت تجاری سایه قرمز Pantone 186 است. کارمندان Target Target در حال دریافت خط جدیدی از گزینه های پوشاک تایید شده برای کار هستند. این مجموعه که توسط نماد سبک اسحاق میزراحی طراحی شده است، دارای رنگ قرمز رنگ قرمز است. مدیر فروشگاه‌های Target به BI گفت: «این نیز برای ایجاد این احساس کمی فحاشی است. کارگران هدف روشی جدید و شیک برای پیروی از کد لباس خرده فروش دریافت می کنند. این شرکت روز سه‌شنبه اعلام کرد که به کارمندانش اجازه می‌دهد تا به یک خط لباس در رنگ قرمز علامت تجاری bullseye که توسط نماد سبک اسحاق میزراحی طراحی شده است دسترسی داشته باشند. هدف در اوایل تابستان امسال برای کارگران فروشگاه به عنوان بخشی از تلاش بزرگ‌تر مدیر عامل جدید مایکل فیدلکه برای ارتقای تجربه خرید و بازگرداندن شرکت به رشد، الزامات کد لباس سخت‌تر را اجرا کرد. قوانین جدید به شلوارهای آ to be able to embed my knowledge in a set of weights I control. My IP shouldn't leak.\" Nadella's comments come amid an intensifying debate over whether frontier AI companies should slow development to address emerging risks. Last week, an Anthropic researcher quit and said that leading AI companies are \"gambling with our lives.\" The debate has also been fueled by an incident in which an OpenAI model escaped a research sandbox and accessed Hugging Face 's production infrastructure. The model had not yet undergone alignment training and was operating with reduced safeguards. Prominent AI leaders have since then weighed in. While OpenAI and Dario Amodei, the Anthropic CEO, called for slower AI development in favor of more guardrails, other tech leaders like Jensen Huang , the Nvidia CEO, have said that an AI slowdown won't happen. Nadella said companies should take as much time as necessary to test advanced models, including welcoming third-party testers and taking a page from the engineer playbook. \"It's possible that they see stuff which are showstoppers before the rest, and if you see a showstopper, stop the show to fix the bugs,\" Nadella said of the AI industry. \"One of the biggest things you learn as an early engineering lead is how to deal with a showstopper bug. Do you stop and fix, or you defer, or you go in and say, 'Hey, this is such an edge case?'\" \"In fact, I love this idea of having third-party testers,\" Nadella added. \"We should take all the time we want to test thi", "date_str": "2026-09-15T22:17:29+00:00", "hash": "bf384b5093acdbe2", "title_fa": "ساتیا نادلا می گوید یک قانون «عقل سلیم» وجود دارد که شرکت های هوش مصنوعی باید از آن پیروی کنند", "summary_fa": "ساتیا نادلا، مدیر عامل مایکروسافت، گفت که او باید از یک قانون ساده هوش مصنوعی پیروی کند و آن حفظ کنترل انسان ها است. Sven Hoppe/تصویر اتحاد از طریق Getty Images ساتیا نادلا گفت هوش مصنوعی قدرتمند باید در خدمت بشریت باشد و تحت کنترل انسان باقی بماند. رهبران آموزش در میان درخواست ها برای توسعه at, again, will bring the probability of things going wron", "date_str": "2026-09-15T21:34:48+00:00", "hash": "1f53f2f765875df7", "title_fa": "محقق هوش مصنوعی که هشدار آخرالزمانش در فضای مجازی منتشر شد، اختلافات خود را با رهبری آنتروپیک بیان می کند.", "summary_fa": "محقق سابق Anthropic، Jacob Coxon، دلیل ترک غول هوش مصنوعی را بیشتر توضیح داد. بلومبرگ/گتی ایماژ، محقق سابق Anthropic Jacob Coxon یک AMA در X برگزار کرد. او همچنین در مدت کوتاهی که در غول هوش مصنوعی حضور داشت، مسخره کرد. محقق سابق Anthropic، Jacob Coxon، اختلافات خود را با غول هوش مصنوعی در طول یک AMA در روز سه شنبه در X توضیح داد. کاکسون نوشت: \"اگر مسابقه اجتناب ناپذیر است، شما نباید مشارکت کنید.\" کاکسون گفت که رهبری آنتروپیک در پیروی از یک \"فلسفه پیامدگرا\" در مورد اینکه چرا باید در پیشبرد مرز تحقیقات هوش مصنوعی مشارکت کند، اشتباه است. به طور خاص، کاکسون از فشار Anthropic برای RSI یا خود-بهبودی بازگشتی، فرآیندی که توسط آن مدل‌های هوش مصنوعی می‌توانند خود را بهبود بخشند و جانشینان خود را بسازند، نام برد. کاکسون نوشت: «آنها عمدتاً رقابت اخیر برای RSI را آغاز کردند، زیرا اعتقاد به اجتناب ناپذیر بودن آن داشتند. \"توجه داشته باشید که OpenAI مجبور شد یک دسته از وزنه های مرده خود را مانند سورا کاهش دهد زیرا آنتروپیک به دنبال ژوگولار بود.\" 0. اختلاف اصلی در مورد اجتناب ناپذیر بودن یک مسابقه بود. 1. من فکر می کنم رهبری در مورد چین و دولت ایالات متحده بسیار پارانویا است. آنها باور ندارند که امکان مذاکره وجود داشته باشد. 2. آنها عمدتاً رقابت اخیر برای RSI را آغاز کردند، به دلیل اعتقاد به آن… — Jacob Coxon (@hilbertspaess) 15 سپتامبر 2026، نمایه کاکسون هفته گذشته پس از انتشار توضیحی برای استعفای خود از Anthropic، که پس از حضور در OpenAI به آن پیوست، منفجر شد. کاکسون گفت که هیچ یک از آزمایشگاه‌ها بهترین مسیر را دنبال نمی‌کنند. کاکسون در اعلامیه استعفای خود نوشت: \"آنها مستقیماً به سمت سوپرهوش خودسازی و قمار با زندگی ما مسابقه می دهند.\" کوکسون همچنین هشدار داد که در داخل، کارکنان هوش"}, {"source": "Business Insider", "title": "The best 43-inch TVs of 2026", "link": "https://www.businessinsider.com/guides/tech/best-43-inch-tvs", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Roku and Samsung both make some of our favorite 43-inch TV models. Amazon/Business Insider If you're looking for a 40-, 42-, or 43-inch TV, you've probably noticed that the selection isn't what it used to be. Most brands now focus on larger screen sizes, so there are fewer smaller TVs available. But that doesn't mean you're out of luck. There are still some excellent options out there — you just have to know where to look. I've been covering TVs for over a decade, so I've used my expertise to recommend the best 43-inch TVs on the market. I've focused on models that address a few key needs across budgets. However, it's important to note that the market is pretty split at this size. Most 42- and 43-inch TVs are either affordable, entry-level sets or premium models that cost significantly more, as many brands have phased out 43-inch versions of their midrange TVs. At the top of the list, the Samsung S90H stands out for its OLED panel, which delivers pixel-level contrast. It also boasts one of the most effective anti-glare screens I've seen, which makes it great for bright rooms. It's also one of the few 42-inch sets with a fast 165Hz refresh rate, making it especially appealing for gaming. The catch is the cost. If you're trying to spend less, the Roku Select Series is a great value pick, with a common deal price of under $200. Its image quality is as basic as it gets, but its LED screen still delivers a sharp 4K picture and reliable smart TV features with Roku's easy-to-use interface. Editor's note : Brands manufacture TVs in slightly different sizes, depending on the panel type. For this guide, I considered displays ranging from 40 to 43 inches. However, 40-inch TVs are rare, and most are bested by similarly priced 42- or 43-inch models. Our top picks for the best 43-inch TVs Best overall : Samsung S90H OLED TV - See at Amazon Best entry-level :
