had a college degree. It was that he misrepresented his education and then doubled down when questioned, she said. White House controversy Zacharia's self-described legal career has been the subject of intense scrutiny in recent days following her appointment as White House press secretary. When asked by a reporter what state she passed the bar exam in, she responded, \"When I moved to China.\" Business Insider reviewed records for all 50 states and the District of Columbia and found no evidence that Zacharia had been admitted to any state bar in the US after she graduated with a law degree from Pepperdine University in 2011. Zacharia later defended calling herself a lawyer, saying that after failing the bar exam the first time, she did not take it a second time. On Friday, a White House official confirmed that she is \"transitioning out\" of the role. Vetting résumés One of a recruiter's jobs is to vet a candidate's background. Research suggests it's not uncommon for candidates to exaggerate their credentials. Some 37% of Americans said they've put inaccurate information on their résumés, according to a June report from Novorésumé, an online résumé-building service. Nearly 7% said they'd claimed a degree, certification, or other credential they didn't possess, while 6.1% said they'd listed a job that didn't exist or was substantially fabrica", "date_str": "2026-10-16T18:49:23+00:00", "hash": "80e761be4e3c89de", "title_fa": "سوالات مربوط به اعتبارنامه کتی زاخاریا باعث شده است که استخدام کنندگان در مورد نحوه بررسی نامزدها صحبت کنند.", "summary_fa": "کیتی زکریا، سخنگوی کاخ سفید، اولین نشست خبری خود را روز سه شنبه برگزار کرد. Win McNamee/Getty Images سوالاتی در مورد اعتبار حقوقی کتی زاخاریا، دبیر مطبوعاتی سابق، ادعاهای مربوط به رزومه را در کانون توجه قرار داد. استخدام کنندگان به اشتراک می گذارند که چگونه نامزدها را در حال اختراع شغل، جعل مدرک تحصیلی یا اغراق در گذشته خود دستگیر کرده اند. یک نظرسنجی نشان داد که تقریباً 4 نفر از هر 10 آمریکایی اعتراف می کنند که اطلاعات نادرستی در رزومه خود قرار داده اند. برای استخدام‌کنندگان شرکت‌هایی مانند مارتا هلر، پرسیدن سؤالاتی در مورد اعتبار یک نامزد شغلی - مانند سؤالی که این هفته در اطراف کتی زاخاریا، دبیر مطبوعاتی سابق کاخ سفید چرخید - برای این دوره مناسب است. هنگامی که چند سال پیش یک بررسی پیشینه نتوانست مدرک دانشگاهی یک نامزد اجرایی را تأیید کند، هلر در مورد این اختلاف سوال کرد. این نامزد که برای شغل در یک شرکت بیمه کالیفرنیا در نظر گرفته شده بود، ادعا کرد که سیل در مدرسه او رکوردهای سال فارغ التحصیلی را از بین برده است. هلر با شک و تردید با کالج تماس گرفت و متوجه شد که چنین رویدادی رخ نداده است. او گفت: «این کار شبیه کارآگاهی بود.» او افزود که مشکل این نیست که داوطلب مدرک دانشگاهی داشته باشد یا خیر. او گفت، این بود که او تحصیلات خود را اشتباه معرفی کرد و سپس در هنگام بازجویی دو برابر شد. جنجال های کاخ سفید حرفه حقوقی زاخاریا که خود را توصیف می کند، در روزهای اخیر پس از انتصاب او به عنوان سخنگوی مطبوعاتی کاخ سفید، موضوع مورد بررسی شدید قرار گرفته است. وقتی خبرنگاری از او پرسید که در چه ایالتی امتحان وکالت را قبول کرد، پاسخ داد: \"وقتی به چین نقل مکان کردم.\" Business Insider سوابق تمام 50 ایالت و ناحیه"}, {"source": "Business Insider", "title": "A US Army general says he had a change of heart about high-flying balloons after seeing them in action", "link": "https://www.businessinsider.com/us-army-eyes-bigger-role-for-balloons-in-warfare-2026-10", "summary": "An Urban Sky High-Altitude Balloon system inflates during an international training exercise in the Philippines. Staff Sgt. Brandon Rickert/US Army The US Army is expanding its use of high-altitude balloons for surveillance and communications. The balloons can operate 60,000 to 100,000 feet above Earth, providing space-like capabilities. Army officials plan more experiments as the service expands its space warfare ranks. The US Army is looking to expand its use of high-altitude balloons as the service builds out its capabilities near and in outer space. These balloons operate in the stratosphere, roughly 60,000 to 100,000 feet above Earth, the space in between where conventional aircraft fly and satellites. Army officials say they see an opportunity to use the balloons to deliver satellite-like surveillance and communication capabilities closer to the battlefield. Lt. Gen. John Rafferty, commander of Army Space and Missile Defense Command, said he was initially skeptical of the technology. He recalled hearing proposals to use high-altitude balloons while serving in what was then Army Futures Command and questioning whether they'd prove practical. The general's view, however, changed after he saw the balloons hold their positions and conduct high-altitude surveillance during a training exercise. \"I went from nowhere to a huge believer very quickly once I saw them in action,\" Rafferty said at this week's Association of the United States Army conference in Washington, DC. The Army is exploring a range of balloon systems for different missions, from surveillance and communications to supporting long-range strikes. Col. Joseph Mroszczyk, who oversees the efforts to integrate emerging space capabilities into Army operations as the director of Transformation Integration Space Superiority, said at AUSA that he wants a \"family of stratospheric systems .\" Unlike satellites, which travel set paths in orbit, high-altitude balloons can exploit different wind currents to maneuver or maintain a presence over an area of interest, he said. Mroszczyk said the Army could use favorable winds to position balloons carrying sensors, communications equipment, or payloads supporting strikes. \"What that enables us to provide is space-like capabilities, really exploiting a transition point between what is normally considered the aerial layer and the space domain,\" he said. Operating at those altitudes could give the Army persistent coverage across large areas from the stratosphere w", "date_str": "2026-10-16T18:18:21+00:00", "hash": "688a368e766d57f2", "title_fa": "یک ژنرال ارتش ایالات متحده می گوید که او پس از دیدن بالن های بلند پرواز در حال عمل، نظرش تغییر کرده است", "summary_fa": "یک سیستم بالون در ارتفاع بالا در طول یک تمرین آموزشی بین المللی در فیلیپین باد می شود. گروهبان کارکنان براندون ریکرت/ ارتش ایالات متحده ارتش ایالات متحده در حال گسترش استفاده از بالون های ارتفاع بالا برای نظارت و ارتباطات است. این بالون ها می توانند در ارتفاع 60000 تا 100000 فوتی بالای زمین کار کنند و قابلیت هایی شبیه به فضا را ارائه دهند. مقامات ارتش آزمایش های بیشتری را برنامه ریزی می کنند زیرا این سرویس درجات جنگ فضایی خود را گسترش می دهد. ارتش ایالات متحده به دنبال گسترش استفاده از بالون های ارتفاع بالا است زیرا این سرویس قابلیت های خود را در نزدیکی و در فضای بیرونی ایجاد می کند. این بالون ها در استراتوسفر، تقریباً 60000 تا 100000 پا بالاتر از زمین، فضایی که بین هواپیماهای معمولی و ماهواره ها پرواز می کنند، کار می کنند. مقامات ارتش می گویند که فرصتی را برای استفاده از بالن ها برای ارائه قابلیت های نظارتی و ارتباطی شبیه ماهواره به میدان جنگ می بینند. سپهبد جان رافرتی، فرمانده فرماندهی فضایی و دفاع موشکی ارتش، گفت که در ابتدا نسبت به این فناوری شک داشت. او به یاد آورد که پیشنهادهایی برای استفاده از بالون های ارتفاع بالا در حین خدمت در فرماندهی آتی ارتش در آن زمان شنیده بود و از اینکه آیا آنها عملی می شوند یا خیر. با این حال، دیدگاه ژنرال پس از اینکه دید بالن‌ها در موقعیت‌های خود ایستاده‌اند و در طول یک تمرین آموزشی در ارتفاع بالا نظارت می‌کنند، تغییر کرد. رافرتی در کنفرانس این هفته انجمن ارتش ایالات متحده در واشنگتن دی سی گفت: \"وقتی آنها را در حال عمل دیدم، خیلی سریع به یک مؤمن بزرگ رسیدم.\" ارتش در حال بررسی طیف وسیعی از سیستم های بالون برای ماموریت های مختلف، از نظارت و ارتباطات گرفته تا پشتیبانی"}, {"source": "Business Insider", "title": "HALF A MOOCH: Katie Zacharia is out after 5 days as White House press secretary", "link": "https://www.businessinsider.com/katie-zacharia-fired-white-house-press-secretary-job-trump-statement-2026-10", "summary": "Katie Zacharia. Jim WATSON / AFP via Getty Images President Donald Trump said he told Katie Zacharia to reconsider the White House press secretary job. Shortly after, a White House official said she is \"transitioning out\" of the role. She lasted five days in the role after mounting scrutiny over her legal credentials. Embattled White House press secretary Katie Zacharia is out of the job after just five days, making her the shortest-tenured person to hold the role in history. President Donald Trump said on Friday that he told Zacharia to reconsider taking on the high-profile job. Shortly after his statements, The New York Times and CNN reported that Zacharia had been fired after less than a week in the role. A White House official told Business Insider that she is \"transitioning out\" of the role. \"I said to Katie just two minutes ago, I said, 'Katie, you know, you don't have to do this if you don't want,'\" Trump told reporters at the White House, adding that Zacharia responded that the job is \"a lot tougher\" than she thought. \"I said to her, 'Honestly, if I were you, I'd reconsider. You think about it, but I would reconsider,'\" Trump said. A conservative commentator who has repeatedly described herself as a lawyer , Zacharia made her White House press briefing debut on Tuesday and quickly came under intense scrutiny over her legal credentials. She was widely panned after the roughly 14-minute briefing, most of which was spent on reading from prepared remarks. After the briefing, while alongside Trump, Zacharia was asked which state she passed the bar exam in and replied, \"When I moved to China,\" raising eyebrows. National headlines soon followed reports that Zacharia had not been licensed to practice law in any US jurisdiction. On Thursday, Zacharia said she took the bar exam but failed, and never retook it. Trump told reporters on Friday that Zacharia had been treated \"very badly\" and \"very unfairly\" by the media. \"She's been treated very rough, and she's a nice person, very nice person,\" the president said. \"I've watched her for years on television, but I said, 'Is this for you, Katie? Because, honestly, you don't need this.'\" \"She's been treated, I would say, very nastily,\" he said. A rocky start Following her first briefing, CNN reported that \"several White House officials\" were questioning how long she could remain in the role. The news of Zacharia's ouster means Trump will be searching for a top spokesperson again after Karoline Leavitt left the role", "date_str": "2026-10-16T18:11:41+00:00", "hash": "e75e4c52b57314cf", "title_fa": "HALF A MOOCH: کیتی زاخاریا پس از 5 روز به عنوان سخنگوی مطبوعاتی کاخ سفید خارج شد", "summary_fa": "کیتی زکریا. جیم واتسون / خبرگزاری فرانسه از طریق گتی ایماژ، دونالد ترامپ، رئیس جمهور آمریکا گفت که به کیتی زاخاریا گفته است که در پست معاونت مطبوعاتی کاخ سفید تجدید نظر کند. اندکی پس از آن، یکی از مقامات کاخ سفید گفت که او در حال «خارج شدن» از این نقش است. او پس از بررسی دقیق مدارک قانونی خود، پنج روز در این نقش دوام آورد. کتی زاخاریا، سخنگوی کاخ سفید پس از تنها پنج روز از کار بیکار شد و او را به کوتاه‌ترین مدت در تاریخ تبدیل کرد. دونالد ترامپ، رئیس‌جمهور آمریکا روز جمعه گفت که به زکریا گفته است که در این شغل پرمخاطب تجدید نظر کند. اندکی پس از اظهارات او، نیویورک تایمز و سی ان ان گزارش دادند که زکریا پس از کمتر از یک هفته در این نقش اخراج شده است. یکی از مقامات کاخ سفید به Business Insider گفت که او در حال \"خارج شدن\" از این نقش است. ترامپ به خبرنگاران در کاخ سفید گفت: من همین دو دقیقه پیش به کتی گفتم، کتی، می‌دانی، اگر نمی‌خواهی مجبور نیستی این کار را انجام دهی. ترامپ گفت: \"من به او گفتم: \"راستش من اگر جای شما بودم، تجدید نظر می کردم. شما در مورد آن فکر کنید، اما من تجدید نظر خواهم کرد.\" یک مفسر محافظه کار که بارها خود را به عنوان یک وکیل معرفی کرده است، زاخاریا اولین جلسه مطبوعاتی خود را در کاخ سفید در روز سه شنبه انجام داد و به سرعت در مورد اعتبار قانونی خود تحت نظارت شدید قرار گرفت. او پس از جلسه توجیهی تقریباً 14 دقیقه‌ای که بیشتر آن صرف خواندن اظهارات آماده شده بود، به طور گسترده مورد بررسی قرار گرفت. پس از جلسه توجیهی، زمانی که در کنار ترامپ بود، از زکریا پرسیده شد که در کدام ایالت امتحان وکالت داد"}, {"source": "Business Insider", "title": "How Princess Charlene of Monaco's style has evolved, from her days as an Olympic athlete to a European princess", "link": "https://www.businessinsider.com/princess-charlene-of-monaco-style-evolution-photos", "summary": "Princess Charlene at the 20th Anniversary Gala Of the Prince Albert II of Monaco Foundation. Arnold Jerocki/Getty Images Princess Charlene of Monaco hasn't always been as fashionable as she is now. Before marrying Prince Albert, Charlene was an Olympic swimmer representing South Africa. Finding her \"fashion feet\" was a challenge, Charlene said — but now she's embraced daring looks. When Princess Charlene married Prince Albert of Monaco in 2011, her life changed. Once best known as an Olympic swimmer representing South Africa, she was reintroduced to the world as a princess. The official Monaco royal website says she was born Charlene Lynette Wittstock on January 25, 1978, in Bulawayo, Zimbabwe. At age 12, she moved to South Africa with her parents and her younger brothers. There, she began forging a career as a swimmer, taking home several awards at the 1997 South African championship , including the coveted title of best female swimmer. Charlene went on to represent South Africa at the 2000 Sydney Olympics. As fate would have it, her future husband, Albert, was there as a spectator — though the pair wouldn't officially cross paths until she visited Monaco for a swimming competition later that year. They eventually married and later had twins, Prince Jacques and Princess Gabriella. However, marrying into a royal family came with certain lifestyle adjustments, including Charlene's sense of style . From her days as an Olympic athlete to being one of the most recognized princesses around the world, here's a closer look at how Charlene's fashion has evolved. In 2001, Charlene was still very much in her athletic era. Princess Charlene pictured in South Africa on June 28, 2001. Terry Shean/Sunday Times/Gallo Images via Getty Images She was photographed in South Africa wearing a laid-back look that consisted of gray sweatpants, a navy-blue windbreaker, and Nike sneakers. Later that year, she maintained her sporty style on the front cover of South African Sports Illustrated. Princess Charlene poses for a portrait shoot for South African Sports Illustrated in November 2001 in South Africa. Jacques Weyers/SA Sports Illustrated/Touchline/ Getty Images For the photo shoot, Charlene wore a sporty red tank top, white flared jeans, and a sailor hat. In keeping with the easygoing, nautical aesthetic of the shoot, she opted to go barefoot. Charlene and Albert made their first public appearance as a couple at a 2006 F1 Monaco Grand Prix party. Charlene with Albert at the Au", "date_str": "2026-10-16T17:12:06+00:00", "hash": "d360d876f33c307b", "title_fa": "چگونه سبک پرنسس شارلین موناکو از روزهای او به عنوان یک ورزشکار المپیک تا یک شاهزاده خانم اروپایی تکامل یافته است.", "summary_fa": "پرنسس شارلین در جشن بیستمین سالگرد بنیاد شاهزاده آلبرت دوم موناکو. آرنولد جروکی/گتی ایماژ پرنسس شارلین موناکو همیشه مثل الان شیک پوش نبوده است. شارلین قبل از ازدواج با شاهزاده آلبرت، یک شناگر المپیکی بود که نماینده آفریقای جنوبی بود. شارلین گفت که پیدا کردن \"پاهای مد\" او یک چالش بود - اما اکنون او از ظاهر جسورانه استقبال کرده است. هنگامی که پرنسس شارلین در سال 2011 با شاهزاده آلبرت موناکو ازدواج کرد، زندگی او تغییر کرد. او که زمانی به عنوان یک شناگر المپیکی به نمایندگی از آفریقای جنوبی شناخته می شد، دوباره به عنوان یک شاهزاده خانم به جهان معرفی شد. وب سایت رسمی سلطنتی موناکو می گوید که او در 25 ژانویه 1978 در Bulawayo، زیمبابوه، Charlene Lynette Wittstock به دنیا آمد. در 12 سالگی به همراه پدر و مادر و برادران کوچکترش به آفریقای جنوبی نقل مکان کرد. در آنجا، او شروع به ساختن حرفه ای به عنوان یک شنا کرد و جوایز متعددی را در مسابقات قهرمانی آفریقای جنوبی در سال 1997 به خانه برد، از جمله عنوان آرزوی بهترین شناگر زن. شارلین در المپیک 2000 سیدنی نماینده آفریقای جنوبی شد. طبق سرنوشت، همسر آینده‌اش، آلبرت، به‌عنوان یک تماشاگر در آنجا حضور داشت – اگرچه این زوج رسماً با هم تلاقی نمی‌کردند تا زمانی که او اواخر همان سال برای یک مسابقه شنا از موناکو دیدن کرد. آنها در نهایت ازدواج کردند و بعدا صاحب دوقلو شدند، شاهزاده ژاک و پرنسس گابریلا. با این حال، ازدواج در یک خانواده سلطنتی با تغییراتی در سبک زندگی همراه بود، از جمله حس سبک شارلین. از روزهای او به عنوان یک ورزشکار المپیک تا یکی از شناخته شده ترین شاهزاده خانم ها در سراسر جهان، در اینجا نگاهی دقیق تر به نحوه تکامل مد شارلین داریم. در سال 2001، شارلین هنوز در دوران ورزشی خود بود. عکس"}, {"source": "Business Insider", "title": "Want Apple's folding iPhone? 'Duo' you have patience?", "link": "https://www.businessinsider.com/apple-iphone-duo-expected-shipping-times-slip-2027-2026-10", "summary": "Apple launched preorders for the iPhone Duo on Friday. credit should read CFOTO/Future Publishing via Getty Images Preorder sales for Apple's iPhone Duo kicked off on Friday. Unless you pounced, don't expect to receive your shipment in time for Christmas. Shipping dates have slipped into 2027 due to current demand and Apple's initial supply, which was expected to be limited. Anyone purchasing an Apple iPhone Duo online as a Christmas gift may want to find a backup plan. Expected shipment dates for new orders of the highly anticipated smartphone model have been pushed back to January 25, 2027. That includes iPhone Duos across all available carriers, colors, and storage sizes. For those who pounced on preorders when they went live early Friday morning, shipments will start arriving as early as October 23. For latecomers, there is always the Hunger Games that is lining up early outside an Apple store on launch day to try to snag in-store inventory. The cheapest version of the foldable phone, with 256 GB of storage, costs $1,999. The model with 2 TB of storage is priced at $3,199. While early demand for the iPhone Duo is certainly a factor in pushing back shipping dates, it's not unusual for new Apple products to see extended shipment times. Apple is also navigating \"limited\" supply due to supply chain constraints, Bloomberg previously reported. Then-CEO Tim Cook talked about general supply constraints on Apple's broader product lineup during the company's third-quarter earnings call in July. \"If you look forward into the current quarter, the September quarter, we continue to expect high levels of demand,\" Cook said, speaking of broader product demand. \"However, with less flexibility in the supply chain, we expect the impact from the supply constraints to increase significantly sequentially.\" Read the original article on Business Insider", "date_str": "2026-10-16T17:09:39+00:00", "hash": "a9f00f7bc329461c", "title_fa": "آیفون تاشو اپل را می‌خواهید؟ \"دو\" شما صبر دارید؟", "summary_fa": "اپل پیش خرید آیفون Duo را روز جمعه آغاز کرد. اعتبار باید CFOTO/Future Publishing از طریق Getty Images خوانده شود. انتظار نداشته باشید که محموله خود را به موقع برای کریسمس دریافت کنید، مگر اینکه هجوم آوردید. به دلیل تقاضای فعلی و عرضه اولیه اپل که انتظار می‌رفت محدود باشد، تاریخ ارسال به سال 2027 کاهش یافته است. هرکسی که یک Apple iPhone Duo را بصورت آنلاین به عنوان هدیه کریسمس خریداری می کند، ممکن است بخواهد یک برنامه پشتیبان پیدا کند. تاریخ‌های مورد انتظار ارسال برای سفارش‌های جدید مدل گوشی هوشمند مورد انتظار به 25 ژانویه 2027 بازگردانده شده است. این تاریخ شامل iPhone Duos در همه حامل‌ها، رنگ‌ها و اندازه‌های ذخیره‌سازی موجود می‌شود. برای کسانی که در اوایل صبح جمعه هنگام پخش زنده اقدام به پیش‌سفارش کردند، محموله‌ها از 23 اکتبر شروع می‌شود. ارزان ترین نسخه گوشی تاشو با ۲۵۶ گیگابایت فضای ذخیره سازی ۱۹۹۹ دلار قیمت دارد. مدل با فضای ذخیره سازی 2 ترابایتی 3199 دلار قیمت دارد. در حالی که تقاضای اولیه برای iPhone Duo مطمئناً عاملی در عقب انداختن تاریخ های ارسال است، برای محصولات جدید اپل طولانی شدن زمان ارسال غیرعادی نیست. بلومبرگ قبلا گزارش داده بود که اپل به دلیل محدودیت های زنجیره تامین، عرضه \"محدود\" را دنبال می کند. تیم کوک، مدیر عامل آن زمان، در مورد محدودیت‌های عرضه عمومی در خط تولید گسترده‌تر اپل در طی تماس سه ماهه سوم این شرکت در ماه جولای صحبت کرد. کوک در مورد تقاضای محصولات بیشتر گفت: «اگر به سه‌ماهه جاری، یعنی سه‌ماهه سپتامبر نگاه کنید، ما همچنان انتظار تقاضای بالایی را داریم. با این حال، با انعطاف‌پذیری کمتر در زنجیره تأمین، انتظار داریم تأثیر محدودیت‌های عرضه به طور قابل توجهی افزایش یابد.» مقاله اصلی را در Business Insider بخوانید"}, {"source": "Business Insider", "title": "The most haunted place in every state", "link": "https://www.businessinsider.com/most-haunted-place-every-state-photos", "summary": "From homes and hotels to churches and cemeteries, there are places all over the country that are said to be haunted. Nomad_Photo/Shutterstock There are places all over the country that are said to be haunted. The Eastern State Penitentiary in Philadelphia, now a museum, is said to be haunted by ex-inmates. NBA players have also reported seeing ghosts at the Skirvin Hotel in Oklahoma City. From homes and hotels to churches, theaters, and cemeteries, there's no shortage of supposedly haunted places across the US. Nearly every state has its own eerie legends — stories of restless spirits, mysterious footsteps in empty hallways, and unexplained flickering lights that locals swear attest to these spots being haunted. Many of these sites are also steeped in history, with tragic pasts or notorious events. Business Insider examined local legends and historic sites to determine the most reportedly haunted locations in every state, with many having reported ghost sightings , strange occurrences, or bloody histories. Whether you believe in ghosts or just love a good scare, these haunted places across the US have earned spooky reputations. Madeline Diamond contributed to an earlier version of this story. ALABAMA: Sloss Furnaces, Birmingham Sloss Furnaces is reportedly haunted. Stephen Reeves/Shutterstock The Sloss Furnaces are now a historic national landmark, but in the late 19th century, they produced iron, which was then turned into steel. James \"Slag\" Wormwood was the boss at the furnaces, and it's said that he subjected his employees to some inhumane working conditions. Labor laws didn't exist at the time, and furnace temperatures often exceeded 100 degrees. A total of 47 men died with Wormwood as their boss, and even Wormwood himself lost his life in the furnaces when he slipped and fell into the iron ore, causing his body to melt, Travel South USA reported. Wormwood and his workers are believed to haunt the furnaces to this day. ALASKA: Kennecott cybercrisi/Shutterstock Kennecott is a remote Alaskan town that's been mostly abandoned since 1950. The town was a hub for copper mining from 1911 to 1938, but after the area's copper supply was diminished, Kennecott's population dwindled. Today, many rickety wooden buildings still stand in Kennecott, and many people believe that they are haunted by former miners and railroad workers, the Anchorage Daily News reported. ARIZONA: Lost Dutchman State Park, Apache Junction Lost Dutchman State Park EdwinM/Shutterstock The L", "date_str": "2026-10-16T16:58:50+00:00", "hash": "6b7a7521f3092f10", "title_fa": "جن زده ترین مکان در هر ایالت", "summary_fa": "از خانه ها و هتل ها گرفته تا کلیساها و گورستان ها، مکان هایی در سراسر کشور وجود دارد که گفته می شود خالی از سکنه است. Nomad_Photo/Shutterstock در سراسر کشور مکان هایی وجود دارد که گفته می شود خالی از سکنه است. گفته می شود که زندان ایالتی شرقی در فیلادلفیا، که اکنون یک موزه است، توسط زندانیان سابق تسخیر شده است. بازیکنان NBA همچنین گزارش داده اند که ارواح را در هتل Skirvin در اوکلاهاما سیتی دیده اند. از خانه‌ها و هتل‌ها گرفته تا کلیساها، تئاترها و گورستان‌ها، هیچ کمبودی در مکان‌های خالی از سکنه در سراسر ایالات متحده وجود ندارد. تقریباً هر ایالت افسانه‌های وهم‌آور خود را دارد - داستان‌هایی از ارواح بی‌قرار، قدم‌های مرموز در راهروهای خالی، و چراغ‌های سوسوزن غیرقابل توضیحی که مردم محلی قسم می‌خورند که این نقاط خالی از سکنه هستند. بسیاری از این مکان ها نیز غرق در تاریخ هستند، با گذشته های غم انگیز یا رویدادهای بدنام. Business Insider افسانه‌های محلی و مکان‌های تاریخی را بررسی کرد تا مکان‌های خالی از سکنه‌شده‌ای را در هر ایالت مشخص کند، که بسیاری از آن‌ها مشاهده ارواح، اتفاقات عجیب و غریب یا تاریخ‌های خونین را گزارش کرده‌اند. چه به ارواح اعتقاد داشته باشید و چه فقط عاشق ترساندن خوب باشید، این مکان های جن زده در سراسر ایالات متحده شهرت وحشتناکی به دست آورده اند. Madeline Diamond به نسخه قبلی این داستان کمک کرد. آلاباما: کوره‌های اسلوس، کوره‌های اسلوس بیرمنگام، بنا به گزارش‌ها تسخیر شده است. استفن ریوز/ شاتراستوک کوره های اسلوس اکنون یک نقطه عطف ملی تاریخی هستند، اما در اواخر قرن نوزدهم، آهن تولید کردند که سپس به فولاد تبدیل شد. جیمز «سرباره» ورم‌وود رئیس کوره‌ها بود و گفته می‌شود که او کارمندانش را در شرایط کاری غیرانسانی قرار می‌داد. در آن زمان قوانین کار وجود نداشت و دمای کوره اغلب از"}, {"source": "Business Insider", "title": "AI debt fears are suddenly rippling across Wall Street as yields surge", "link": "https://www.businessinsider.com/ai-debt-hyperscalers-wall-street-bond-yields-rates-coreweave-2026-10", "summary": "AI debt jitters are spreading on Wall Street as more bonds funding data center projects enter distressed territory. Spencer Platt/Getty Images Investors are growing nervous about stress in the market's mountain of AI-linked debt. More data center bonds have dropped to distressed levels in the last month. The decline reflects factors like reduced investor demand, increased supply, and higher rates. The AI debt mountain is drawing nervous scrutiny from markets this week. The jitters rippled through Wall Street in recent days as investors eyed the huge sums of borrowed money being used to fund the AI buildout, the health of which is being questioned as yields surge and more of the debt inches toward distressed territory. The concern is that more stress could be on the way, potentially resulting in negative consequences for the AI trade and the broader financial system if losses on the bonds trigger a cascading effect the trickles into the stock market. That fear was in the spotlight midweek when Chamath Palihapitiya, the billionaire venture capitalist, drew attention to some of CoreWeave's bonds, which have seen yields spike and prices tumble into distressed territory. Here's a quick rundown of the events: Tuesday: The value of CoreWeave bonds fall below 80 cents on the dollar, the threshold that marks debt as distressed. CoreWeave stock plunges 15%. As of Friday, shares were on track to end the week 20% lower. Tuesday, 6:01 PM: Chamath Palihapitiya posts on X about CoreWeave's bond yield rising to 15.1%, up from 9.6% in June. Palihapitiya also included an analysis that theorized that AI is blowing up a private credit bubble . Tuesday, 7:43 PM: Tesla CEO Elon Musk replies \"Yikes\" to Palihapitiya's post, drawing more attention. Wednesday morning : DA Davidson's Gil Luria, a tech analyst, says on a podcast that CoreWeave stock could fall to $0 if the AI spending boom falters. Wednesday evening: The Financial Times reports Anthropic brought in $16.8 billion in revenue in the third quarter. The figure causes unease among investors, as it reflects a slowdown from the prior quarter's revenue growth and adds to concerns that the boom may be waning. Thursday morning: The sell-off in chip stocks picks up, with the sector heading for $1 trillion in losses . More tech selling on Friday pushes stocks toward their worst week since July. Price declines in AI debt have been most acute in smaller neocloud companies , but even among hyperscalers, the value of some loans is in", "date_str": "2026-10-16T16:57:06+00:00", "hash": "0c0f0768f9f98abd", "title_fa": "ترس از بدهی هوش مصنوعی به طور ناگهانی در سراسر وال استریت موج می زند زیرا بازدهی افزایش می یابد", "summary_fa": "نگرانی‌های بدهی هوش مصنوعی در وال استریت در حال گسترش است، زیرا اوراق قرضه بیشتری که پروژه‌های مراکز داده را تامین مالی می‌کنند، وارد قلمروی پریشان می‌شوند. Spencer Platt/Getty Images سرمایه گذاران در مورد استرس در کوه بدهی های مرتبط با هوش مصنوعی در بازار نگران هستند. اوراق قرضه مراکز داده بیشتر در ماه گذشته به سطوح مضطرب سقوط کرده است. این کاهش منعکس کننده عواملی مانند کاهش تقاضای سرمایه گذاران، افزایش عرضه و نرخ های بالاتر است. کوه بدهی هوش مصنوعی این هفته مورد بررسی عصبی بازارها قرار گرفته است. در روزهای اخیر در حالی که سرمایه گذاران به مبالغ هنگفتی از پول قرض گرفته شده برای تامین مالی ساخت هوش مصنوعی چشم دوخته بودند که سلامت آن با افزایش بازدهی و افزایش اینچ بدهی ها به مناطقی که دچار مشکل شده اند، زیر سوال رفته است. نگرانی این است که استرس بیشتری در راه باشد و اگر زیان اوراق قرضه منجر به نفوذ به بازار سهام شود، به طور بالقوه پیامدهای منفی برای تجارت هوش مصنوعی و سیستم مالی گسترده‌تر خواهد داشت. این ترس در اواسط هفته زمانی که Chamath Palihapitiya، سرمایه‌دار سرمایه‌دار میلیاردر، توجه را به برخی از اوراق قرضه CoreWeave جلب کرد، که شاهد افزایش بازدهی و سقوط قیمت‌ها در قلمروی مضطرب بوده‌اند، در کانون توجه قرار گرفت. در اینجا خلاصه‌ای از رویدادها آمده است: سه‌شنبه: ارزش اوراق قرضه CoreWeave به زیر 80 سنت بر دلار سقوط می‌کند، آستانه‌ای که بدهی را به‌عنوان مضطرب نشان می‌دهد. سهام CoreWeave 15 درصد سقوط کرد. از روز جمعه، سهام در مسیر پایان هفته 20 درصد کاهش بود. سه‌شنبه، 6:01 بعد از ظهر: Chamath Palihapitiya در X در مورد افزایش بازده اوراق قرضه CoreWeave به 15.1٪، از 9.6٪ در ژوئن، پست می‌کند. Palihapitiya همچنین تجزیه و تحلیلی را ارائه کرد که این نظریه را مطرح کرد که هوش مصنوعی یک"}, {"source": "Business Insider", "title": "Want to work for a billionaire investor? Vinod Khosla is hiring.", "link": "https://www.businessinsider.com/vinod-khosla-hiring-chief-of-staff-vc-2026-10", "summary": "Vinod Khosla wants a new chief of staff who can handle 12-hour workdays. Steph Chambers/Getty Images Billionaire VC Vinod Khosla is hiring a chief of staff to help evaluate investments and work with founders. The role requires a three-year commitment, 12-hour days, and availability on nights and weekends. The opening comes amid growing demand for chiefs of staff and an AI-fueled venture capital boom. One of the biggest names in venture capital is looking to hire a new right-hand person. Vinod Khosla , founder of Khosla Ventures, said on X Thursday that he's seeking his next chief of staff, a job that offers a rare opportunity to work in close contact with the billionaire investor whose Silicon Valley firm is known for its early bets on OpenAI, DoorDash, and Instacart. \"What matters is how quickly you learn, the questions you ask, and whether you can think from first principles,\" Khosla wrote. \"You'll help evaluate opportunities and work with founders building consequential companies.\" The opening comes as demand for chiefs of staff is growing at a fast clip, with the role offering a potential path to senior leadership. For the person Khosla hires, it also offers a front-row seat to an AI-fueled venture capital boom . A hot job Job postings for chiefs of staff on Indeed were nearly 90% above pre-pandemic levels in September, far outpacing management jobs and postings overall. In the San Francisco Bay Area, the median advertised salary for the role is $175,000, compared with about $152,000 nationally, according to Indeed. Through the first three quarters of this year, US VC deal value reached $516 billion across an estimated 14,199 deals, according to PitchBook. That is already the highest total in the research firm's dataset and roughly 44% above the prior record, set in 2021. Most chiefs of staff in the US stay in the same profession when they change jobs, but some move into senior leadership roles , according to a March study from LinkedIn. Becoming a chief operating officer was the second most common career move, accounting for 2.9% of transitions. Another 3.7% became founders or cofounders, while 1% became CEOs. Close contact Khosla's new chief of staff will work directly with him to evaluate investment opportunities, meet founders, research emerging technologies , and support portfolio companies, according to the job posting. As the person earns Khosla's trust, they'll also lead conversations on his behalf and help determine which opportunities to purs", "date_str": "2026-10-16T16:39:29+00:00", "hash": "07b4e7da70faf8cc", "title_fa": "آیا می خواهید برای یک سرمایه گذار میلیاردر کار کنید؟ وینود خسلا استخدام می کند.", "summary_fa": "وینود خوسلا یک رئیس ستاد جدید می خواهد که بتواند 12 ساعت روز کاری را اداره کند. استف چمبرز/ میلیاردر گتی ایماژ VC Vinod Khosla در حال استخدام یک رئیس ستاد برای کمک به ارزیابی سرمایه گذاری ها و همکاری با بنیانگذاران است. این نقش به تعهدی سه ساله، 12 ساعت روز و در دسترس بودن در شب ها و آخر هفته ها نیاز دارد. افتتاحیه در بحبوحه تقاضای فزاینده برای روسای کارکنان و رونق سرمایه گذاری خطرپذیر مبتنی بر هوش مصنوعی صورت می گیرد. یکی از بزرگترین نام ها در سرمایه گذاری خطرپذیر به دنبال استخدام یک فرد راست دست جدید است. Vinod Khosla، بنیانگذار Khosla Ventures، در روز پنج شنبه X گفت که به دنبال رئیس ستاد بعدی خود است، شغلی که فرصتی نادر برای همکاری نزدیک با سرمایه‌گذار میلیاردری است که شرکت Silicon Valley برای شرط‌بندی اولیه‌اش در OpenAI، DoorDash و Instacart شناخته می‌شود. خسلا نوشت: «آنچه مهم است این است که چقدر سریع یاد می‌گیرید، سؤالاتی که می‌پرسید و اینکه آیا می‌توانید از اصول اولیه فکر کنید یا خیر. \"شما به ارزیابی فرصت‌ها و کار با بنیان‌گذاران برای ساخت شرکت‌های پیامد کمک خواهید کرد.\" افتتاحیه در حالی انجام می شود که تقاضا برای روسای ستاد در یک کلیپ به سرعت در حال رشد است، و این نقش مسیری بالقوه برای رهبری ارشد ارائه می دهد. برای شخصی که Khosla استخدام می کند، یک صندلی در ردیف جلو برای رونق سرمایه خطرپذیر مبتنی بر هوش مصنوعی ارائه می دهد. یک شغل داغ آگهی‌های شغلی برای روسای کارکنان در Indeed تقریباً 90 درصد بالاتر از سطوح قبل از همه‌گیری در ماه سپتامبر بود که در مجموع از مشاغل مدیریتی و پست‌ها پیشی گرفت. طبق گزارش Indeed، در منطقه خلیج سانفرانسیسکو، متوسط ​​دستمزد آگهی شده برای این نقش 175000 دلار است، در حالی که طبق گزارش Indeed این رقم"}, {"source": "Business Insider", "title": "Retail investors are piling into AI stocks, while institutional money is turning defensive", "link": "https://www.businessinsider.com/retail-traders-ai-stocks-coreweave-bonds-crwv-citadel-securities-2026-10", "summary": "Traders work on the floor of the New York Stock Exchange TIMOTHY A. CLARY / AFP via Getty Images Sentiment toward the AI trade has diverged among big money and retail investors. Retail traders piling back into the top AI plays, Citadel Securities says. Meanwhile, institutional investors are turning increasingly defensive. Everyday investors have been piling into AI bets at a moment when institutional money is playing defense. Retail is showing renewed willingness to pour money into high-flying tech stocks, adding exposure to chips, neoclouds, and other infrastructure plays in the last week. \"Retail buying is picking up again, even as overall trading activity remains below average,\" wrote Scott Rubner of Citadel Securities. \"Last week, retail net bought $9.1 billion of US equities on our platform, the largest weekly net buying in 15 weeks (since late June) and the ninth-largest week over the past year.\" The buying was concentrated heavily in AI play. Semiconductors saw $2.6 billion of net inflows, and October is set to be the largest month of net retail buying on Citadel Securities' platform. The $700 million poured into neocloud stocks is the largest weekly buying spree the firm has observed among retail. Rubner said the cohort's weekly net buying has risen steadily over the past three weeks, jumping from $4.8 billion to $6.4 billion to last week's $9.1 billion figure. In a previous note, Rubner said that October would be an opportune month for investors to reload their portfolios with stocks after September volatility reset valuations. His latest analysis shows that individual traders are doing exactly that, following a classic playbook of buying the dip. Meanwhile, a combination of hotter-than-expected inflation, growing speculation about a credit event in AI-linked debt , and a volatile bond market has sparked fresh volatility lately, spurring a sharp defensive turn among institutional traders. Viraj Patel, global market strategist of Vanda Research, flagged a \"buyer's strike\" taking place on Wall Street. \"The institutional equity bid is starting to fade. Aggregate US equity positioning has gone nowhere since the summer, with HF exposure rolling over and institutional options buying losing momentum,\" Patel said. \"More tellingly, investors are rotating away from growth quality towards defensives. The institutional dip-buying appetite is clearly fading.\" The divergence in sentiment was on display this week with CoreWeave , the neocloud firm that saw its s", "date_str": "2026-10-16T16:14:01+00:00", "hash": "6bde1fc5d573d081", "title_fa": "سرمایه گذاران خرد در حال انباشته شدن در سهام هوش مصنوعی هستند، در حالی که پول نهادی در حال تبدیل شدن به حالت تدافعی است", "summary_fa": "معامله گران در بورس اوراق بهادار نیویورک تیموتی ای کلاری / خبرگزاری فرانسه از طریق گتی ایماژ کار می کنند. Citadel Securities می‌گوید، معامله‌گران خرده‌فروشی به برترین بازی‌های هوش مصنوعی بازگشته‌اند. در همین حال، سرمایه گذاران نهادی به طور فزاینده ای به حالت تدافعی روی می آورند. سرمایه گذاران هر روزه در لحظه ای که پول سازمانی در حال بازی دفاعی است، شرط های هوش مصنوعی را روی هم می گذارند. خرده‌فروشی تمایل دوباره‌ای برای ریختن پول به سهام‌های فناوری پرطرفدار، افزایش قرار گرفتن در معرض تراشه‌ها، نئوکلادها و سایر زیرساخت‌ها در هفته گذشته نشان می‌دهد. اسکات رابنر از سیتادل سکیوریتیز می‌نویسد: «خرید خرده‌فروشی دوباره در حال افزایش است، حتی با وجود اینکه فعالیت‌های تجاری کلی کمتر از حد متوسط ​​است. هفته گذشته، خالص خرده فروشی 9.1 میلیارد دلار از سهام ایالات متحده را در پلتفرم ما خریداری کرد که بزرگترین خرید خالص هفتگی در 15 هفته (از اواخر ژوئن) و نهمین هفته بزرگ در سال گذشته است. خرید به شدت در بازی هوش مصنوعی متمرکز بود. نیمه هادی ها شاهد 2.6 میلیارد دلار ورودی خالص بودند و اکتبر بزرگترین ماه خرید خالص خرده فروشی در پلتفرم Citadel Securities است. 700 میلیون دلاری که به سهام neocloud سرازیر می شود، بزرگترین ولگردی خرید هفتگی است که این شرکت در میان خرده فروشی ها مشاهده کرده است. رابنر گفت که خرید خالص هفتگی گروه در سه هفته گذشته به طور پیوسته افزایش یافته است و از 4.8 میلیارد دلار به 6.4 میلیارد دلار به رقم 9.1 میلیارد دلار در هفته گذشته جهش کرده است. در یادداشت قبلی، رابنر گفت که اکتبر ماه مناسبی برای سرمایه گذاران خواهد بود تا پس از ارزیابی مجدد نوسانات در سپتامبر، پرتفوی خود را با سهام بارگذاری کنند. آخرین تجزیه و تحلیل او نشان می دهد که معامله گران فردی دقیقاً همین کار را انجام می"}, {"source": "Business Insider", "title": "This new theory on how AI ‘thinks’ could impact whether it kills us all", "link": "https://www.businessinsider.com/ai-reasoning-theory-nick-cammarata-safety-neural-networks-2026-10", "summary": "AI neurons and their connections are easier to understand than we thought, according to a researcher s new findings. : Sergi Reboredo/VW Pics/Universal Images Group via Getty Images AI researchers don't really know how the models they are building \"think.\" They know what goes into them and what comes out, but that's about it. A new theory may change that, allowing safety researchers to prevent them from going off the rails. How AI models think may be easier to decipher than we thought. An independent researcher who formerly worked at OpenAI published a report on Thursday that some in the AI world are describing as a bombshell. It could have implications as safety researchers scramble to get the jump on AI models that may not have humanity's best interests in mind. Previously, the prevailing wisdom was that AI \"neurons,\" which, like those in a human brain, light up when an AI model encounters specific stimuli, were ultimately uninterpretable — meaning, basically, that there was no way to guess why a specific neuron would fire when an AI model was exposed to, say, a picture of a cat. Those building AI models at places like OpenAI and Anthropic don't write instructions for everything a model does. Instead, they train neurons to respond to information and influence one another. As the AI learns, it develops its own ways of processing that information, and humans have not yet cracked the code of how it works. That means those building AI models know what goes into the AI and what comes out, but not necessarily what happens in between. So if an AI goes rogue , they don't always know why. The author of the new report, however, says he may have discovered patterns in how the neurons react to stimuli that make sense. Nick Cammarata, who said he left OpenAI in 2023, said AI neural networks are knowable, so long as you look carefully. In one example, he says that a single AI neuron might react to both a cat and the front of a car. Humans would see those as two very different things, and different neurons would fire as a result. The AI, however, sees something related, perhaps the triangle shape of the two, and a single neuron fires for both. For years, AI researchers had assumed that AI models packed unrelated things into a single neuron to save space. \"Almost the entire network is interpretable if we look closely enough,\" Cammarata wrote. The findings, though undeniably dense, couched in polysyllabic jargon, and still theoretical, could have real-world implications ", "date_str": "2026-10-16T16:05:18+00:00", "hash": "c9a5622f9893c297", "title_fa": "این نظریه جدید در مورد چگونگی «فکر» هوش مصنوعی می تواند بر اینکه آیا همه ما را می کشد یا خیر، تأثیر بگذارد", "summary_fa": "بر اساس یافته‌های جدید یک محقق، نورون‌های هوش مصنوعی و اتصالات آن‌ها آسان‌تر از آنچه فکر می‌کردیم قابل درک است. : Sergi Reboredo / VW Pics / Universal Images Group از طریق Getty Images محققان هوش مصنوعی واقعا نمی‌دانند مدل‌هایی که می‌سازند چگونه «فکر می‌کنند». آنها می دانند که چه چیزی به آنها وارد می شود و چه چیزی بیرون می آید، اما همین. یک نظریه جدید ممکن است آن را تغییر دهد و به محققان ایمنی اجازه دهد تا آنها را از ریل خارج نکنند. اینکه مدل‌های هوش مصنوعی چگونه فکر می‌کنند ممکن است راحت‌تر از آنچه فکر می‌کردیم رمزگشایی شود. یک محقق مستقل که قبلا در OpenAI کار می کرد، روز پنجشنبه گزارشی را منتشر کرد که برخی در دنیای هوش مصنوعی آن را به عنوان یک بمب توصیف می کنند. این می تواند پیامدهایی داشته باشد زیرا محققان ایمنی در تلاش برای دستیابی به مدل های هوش مصنوعی هستند که ممکن است بهترین منافع بشر را در ذهن نداشته باشند. پیش از این، حکمت غالب این بود که «نورون‌های» هوش مصنوعی، که مانند نورون‌های موجود در مغز انسان، هنگامی که یک مدل هوش مصنوعی با محرک‌های خاصی مواجه می‌شود، روشن می‌شوند، در نهایت غیرقابل تفسیر بودند - به این معنی که اساساً هیچ راهی برای حدس زدن وجود ندارد که چرا یک نورون خاص وقتی یک مدل هوش مصنوعی مثلاً در معرض تصویر یک گربه قرار می‌گیرد، شلیک می‌کند. کسانی که مدل‌های هوش مصنوعی را در مکان‌هایی مانند OpenAI و Anthropic می‌سازند، دستورالعمل‌هایی را برای هر کاری که یک مدل انجام می‌دهد، نمی‌نویسند. در عوض، آنها نورون ها را آموزش می دهند تا به اطلاعات پاسخ دهند و بر یکدیگر تأثیر بگذارند. همانطور که هوش مصنوعی می‌آموزد، روش‌های خاص خود را برای پردازش این اطلاعات ایجاد می‌کند و انسان‌ها هنوز کد نحوه عملکرد آن را شکسته‌اند. این"}, {"source": "Business Insider", "title": "Tesla's vision for the future: Manually driving your own car will be a luxury for the rich", "link": "https://www.businessinsider.com/tesla-roadster-only-manually-driven-car-future-luxury-sport-2026-10", "summary": "The Roadster s price is likely at least $250,000. Musk said it will be Tesla s only vehicle that humans drive themselves. Tesla Want to physically drive a Tesla in the future? The Roadster will be your only option, Musk said. The car is not cheap. Musk has compared today's driving to elevator operators. Want to physically drive a Tesla in the future? Get ready to pay up. On Thursday, Tesla CEO Elon Musk unveiled the new Roadster with a gravity-defying demo . The car suctioned to the side of a vertical ramp, drove upside down, briefly flew, stuck the landing, and later bunny-hopped and twirled over a standing lineup of other Tesla vehicles. The stunts were choreographed with autonomy, Musk said — but Roadster owners will eventually be able to manually take the wheel. That will make it unique in Tesla's lineup. \"This will actually be, long-term, the only manually driven car that Tesla makes,\" Musk said on stage, before Tesla's lead engineer, Lars Moravy, added, \"You gotta have some fun sometimes.\" Tesla hasn't revealed the car's final price, but we know it'll firmly be in the luxury supercar tier. The company's reservation queue asks customers who want the base Performance trim to fork over a $50,000, due within 10 days. That reservation, alone, is nearly the price of an average car in America , and it doesn't capture the car's final price. Our best pricing ballpark dates back to 2017, when Tesla first said it was bringing back the Roadster. At the time, the automaker collected $250,000 payments from people who wanted a Founder Series model. Meanwhile, Tesla has been ramping up its autonomy push for its more price-conscious vehicles. In September, it started rolling out the Cybercab — a vehicle that leans so heavily into self-driving that it has no steering wheel, brake pedals, or side mirrors. Tesla says it wants to eventually sell those cars to consumers at less than $30,000 apiece . On recent earnings calls, Musk has also praised the recurring revenue from subscriptions of Full Self-Driving (Supervised) from Cybertruck, Model Y, and Model 3 owners. Musk has talked a lot about a world where driving becomes obsolete. He has compared driving a car to operating an elevator, a profession that was largely phased out in the mid-20th century as elevators became automated. \"Now, you just get in, press a button and a modern elevator, if inspected regularly, is extremely safe,\" he wrote on X in March. Treating driving like elevator operation requires a pretty big le", "date_str": "2026-10-16T15:54:06+00:00", "hash": "6bbdd99b39a2c00d", "title_fa": "چشم انداز تسلا برای آینده: رانندگی دستی ماشین شخصی برای ثروتمندان یک امر تجملی خواهد بود", "summary_fa": "قیمت رودستر احتمالا حداقل 250000 دلار است. ماسک گفت این تنها وسیله نقلیه تسلا خواهد بود که انسان ها خودشان رانندگی می کنند. تسلا آیا می خواهید در آینده به صورت فیزیکی تسلا رانندگی کنید؟ ماسک گفت که رودستر تنها گزینه شما خواهد بود. ماشین ارزان نیست. ماسک رانندگی امروز را با اپراتورهای آسانسور مقایسه کرده است. آیا می خواهید در آینده به صورت فیزیکی تسلا رانندگی کنید؟ برای پرداخت آماده شوید روز پنجشنبه، ایلان ماسک، مدیرعامل تسلا، رودستر جدید را با یک نسخه نمایشی گرانش معرفی کرد. ماشین به سمت یک سطح شیبدار عمودی مکش کرد، وارونه رانندگی کرد، برای مدت کوتاهی پرواز کرد، فرود را چسباند، و بعداً با خرگوش پرید و روی صف ایستاده دیگر وسایل نقلیه تسلا چرخید. ماسک گفت که این بدلکاری ها با خودمختاری طراحی شده اند - اما مالکان رودستر در نهایت می توانند به صورت دستی فرمان را در دست بگیرند. این امر آن را در خط تولید تسلا منحصر به فرد می کند. ماسک روی صحنه گفت: «این در واقع در درازمدت تنها خودروی دستی خواهد بود که تسلا می‌سازد. تسلا قیمت نهایی این خودرو را اعلام نکرده است، اما می دانیم که این خودرو به طور قطعی در ردیف سوپراسپرت های لوکس قرار خواهد گرفت. صف رزرو این شرکت از مشتریانی که می خواهند تریم پرفورمنس پایه را بخواهند بیش از 50000 دلار هزینه کنند که ظرف 10 روز موعد پرداخت می شود. این رزرو، به تنهایی، تقریباً قیمت یک خودروی متوسط ​​در آمریکا است و قیمت نهایی خودرو را نشان نمی‌دهد. بهترین قیمت بالپارک ما به سال 2017 برمی گردد، زمانی که تسلا برای اولین بار گفت که رودستر را باز می گرداند. در آن زمان، این خودروساز 250000 دلار از افرادی که خواهان مدل سری Founder بودند، دریافت کرد. در همین حال، تسلا تلاش خود را برای خودمختاری"}, {"source": "Lifehacker", "title": "I’m a Deals Writer, and These Are My Top 10 Tech Deals This Week", "link": "https://lifehacker.com/tech/best-tech-deals-this-week?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. As Lifehacker's deals writer, I'm always looking for the best bargains on TVs, speakers, laptops, and other tech. Now that it's Friday, I've gathered together this week's sales highlights , all of which I've vetted using my favorite price-tracking tools to make sure they are actually good deals. This week, you can find bargains axy Watch Ultra2، خاکستری تیتانیوم، ساعت هوشمند 47 میلی متری LTE | طراحی مستحکم، دستیار هوش مصنوعی، مربی خواب و دویدن پیشرفته، دارای رتبه شیرجه، ردیابی ضربان قلب [نسخه ایالات متحده، گارانتی ۲ ساله] ۶۷۴٫۹۹ دلار در آمازون دریافت معامله دریافت معامله ۶۷۴٫۹۹ دلار در آمازون مشاهده 0 بیشتر Galaxy Watch Ultra نسبت به سایر ساعت‌ها در یک ویژگی کلیدی برتر است. اگر یک کوهنورد مشتاق یا ورزشکاری هستید که ساعات طولانی را در"}, {"source": "Lifehacker", "title": "Whatever Happened to Daylight Saving Time Going Away?", "link": "https://lifehacker.com/what-happened-to-ending-daylight-saving-time?utm_medium=RSS", "summary": "It will soon be time, once again, for our clocks to fall back. Nov. 1 is the date most places in the U.S. quit daylight saving time for 2026 and go back to standard time. We're still on this clock-changing treadmill, despite legislation that was supposed to eliminate it a few years ago, and despite medical professionals warning that these clock changes are bad for our health. For example, a study out of the Stanford School of Medicine found that switching the time back and forth every year probably contributes to increased rates of stroke and obesity. Permanent daylight saving time would be an improvement on that, and permanent standard time would be even better, health-wise. The American Academy of Sleep Medicine published a position paper a few years ago stating that scientific evidence supports the idea \"that the United States should eliminate seasonal time changes in favor of permanent standard time, which aligns best with human circadian biology.\" But despite all this, we ll still have to turn the clocks ahead again in spring. So whatever happened to those bills in Congress aiming to abolish the time changes? The most recent attempt to eliminate clock changes failed The Sunshine Protection Act was a federal bill that would have made Daylight Saving Time permanent. If enacted, it would have taken effect on Nov. 5, 2023, the date that we would otherwise have changed the clocks. The result would be that our winter mornings would stay dark an hour longer than they currently do, but we d get an hour more of daylight in the winter evenings. The bill passed the Senate in March of 2022, but it wasn't taken up by the House of Representatives. In July of 2026, a similar law passed the House of Representatives , and President Trump wrote on Truth Social this month that \"Republicans in the Senate have to get moving on what I call the 'No More Changing of Clocks Act.'\" The Senate Majority Leader said it doesn't have the support to pass , since it would mean dark mornings for commuters and for children waiting for morning buses. Which time would we stay with if we stopped changing the clocks? We operate on two different times throughout the year: \"standard time\" and \"daylight saving time.\" These even get their own time zones! For example, if a time is marked as \"EST,\" that means eastern standard time, which is different from eastern daylight time . Standard time is the one we use in winter, and daylight saving time is the one we use in summer. The bill mentioned ab", "date_str": "2026-10-16T17:30:00+00:00", "hash": "463532a465c4a884", "title_fa": "چه اتفاقی برای خاموش شدن ساعت تابستانی افتاد؟", "summary_fa": "به زودی یک بار دیگر زمان آن فرا می رسد که ساعت ما به عقب برگردد. 1 نوامبر، تاریخی است که اکثر مکان‌ها در ایالات متحده از ساعت تابستانی برای سال 2026 خارج می‌شوند و به زمان استاندارد باز می‌گردند. با وجود قانونی که چند سال پیش قرار بود آن را حذف کند، و با وجود هشدار متخصصان پزشکی مبنی بر اینکه این تغییرات ساعت برای سلامتی ما مضر است، ما هنوز روی این تردمیل تغییر ساعت هستیم. به عنوان مثال، یک مطالعه از دانشکده پزشکی استنفورد نشان داد که تغییر زمان به عقب و جلو در هر سال احتمالاً به افزایش نرخ سکته مغزی و چاقی کمک می کند. ساعت دائمی تابستانی بهبودی در این زمینه خواهد بود و زمان استاندارد دائمی از نظر سلامتی حتی بهتر خواهد بود. آکادمی پزشکی خواب آمریکا چند سال پیش یک مقاله موضعی منتشر کرد که در آن اظهار داشت که شواهد علمی از این ایده حمایت می کند که \"ایالات متحده باید تغییرات زمان فصلی را به نفع زمان استاندارد دائمی حذف کند، که به بهترین وجه با زیست شناسی شبانه روزی انسان همخوانی دارد.\" اما با وجود همه اینها، ما هنوز باید در بهار دوباره ساعت ها را به جلو بچرخانیم. پس برای آن لوایح در کنگره با هدف لغو زمان، چه اتفاقی افتاد؟ آخرین تلاش برای حذف تغییرات ساعت شکست خورد. قانون حفاظت از آفتاب، یک لایحه فدرال بود که ساعت تابستانی را دائمی می کرد. در صورت تصویب، از 5 نوامبر 2023، تاریخی که در غیر این صورت ساعت را تغییر می‌دادیم، اعمال می‌شد. نتیجه این می‌شود که صبح‌های زمستانی ما یک ساعت بیشتر از زمان فعلی تاریک می‌ماند، اما در غروب‌های زمستان یک ساعت بیشتر روشنایی روز دریافت می‌کنیم. این لایحه در مارس 2022 به تصویب سنا رسید، اما مجلس نمایندگان آن را به تصویب نرساند. در ژوئیه"}],
      media: [{"source": "Billboard", "title": "Becky G Brings World Mental Health Day Festival to a Powerful Close in NYC & More Uplifting Moments", "link": "https://www.billboard.com/music/latin/becky-g-world-mental-health-day-latin-grammys-leading-ladies-1236360559/", "summary": "From career milestones to new music releases to major announcements and those little important moments, Billboard editors highlight uplifting moments in Latin music. Here’s what happened in the Latin music world this week. Becky G Opens Up About Identity and Mental Health at Project Healthy Minds Event Becky G brought Project Healthy Minds’ World Mental Health Day Festival to a powerful close on Saturday (Oct. 10) in New York with an intimate conversation on identity, creativity and mental health. Moderated by NBC News correspondent Morgan Radford, the panel gave the Mexican American star space to reflect on growing up in the public eye, protecting her peace and learning to tell her story on her own terms. “The whole concept of being a role model is to model this idea of perfection, and I don’t think that is real at all,” Becky G said. “Instead of being a role model, I’ve always felt the responsibility to be a real model, which means I’m not going to have all the answers. I’m not going to get it right every single time.” She also spoke candidly about therapy, family and her healing journey, saying: “I had to become the person that I needed most, and that’s when Becky G came to be.” The conversation arrives just days before she is scheduled to join Billboard ’s Latin Music Week for a Superstar Q A this Wednesday (Oct. 21). Becky G poses with fans at the Project Healthy Minds Fifth Annual World Mental Health Day Festival at Spring Studios on Oct. 10, 2026 in New York City. Credit: Rob Kim/Getty Images for Project Healthy Minds Rob Kim/Getty Images for Project Healthy Minds BMI Creates Space for Women Songwriters in Música Mexicana “ Música mexicana has historically been a male-dominated field, making it more important than ever to champion the women creatives who are shaping its future, said Lilibeth Patron, BMI’s associate director of creative for Latin, in a statement. “Las Compositoras+ is about fostering community and creating space for connection and collaboration.” Led by singer-songwriter Erika Vidrio, the camp began at the Fender offices before moving to a Bel Air house, where the participants spent several days developing new music together. Held in Los Angeles earlier this month and announced Sept. 30, the four-day retreat brought together Damaris Bojor, Lorena Cabral, Tania Dominguez, Poe Leos, MXKA, Marián Oviedo, Jacqie Rivera and Adriana Ríos to collaborate and write new songs for potential placements. BMI s Las Compositoras Song Camp on Sept. ", "date_str": "2026-10-17T14:00:00+00:00", "hash": "2ba716f5653bd5e7", "title_fa": "Becky G جشنواره روز جهانی سلامت روان را در نیویورک و لحظات نشاط آور بیشتر به پایان می رساند", "summary_fa": "ویراستاران بیلبورد از نقاط عطف شغلی گرفته تا انتشار موسیقی جدید تا اطلاعیه های مهم و آن لحظات مهم کوچک، لحظات نشاط آور در موسیقی لاتین را برجسته می کنند. این چیزی است که این هفته در دنیای موسیقی لاتین اتفاق افتاد. Becky G در رویداد Project Healthy Minds درباره هویت و سلامت روان صحبت می کند بکی جی جشنواره روز جهانی بهداشت روان پروژه Healthy Minds را در روز شنبه (اکتبر) به پایان رساند. 10) در نیویورک با گفتگوی صمیمی در مورد هویت، خلاقیت و سلامت روان. این پانل با مدیریت مورگان رادفورد، خبرنگار ان‌بی‌سی نیوز، به ستاره آمریکایی مکزیکی فضایی داد تا درباره بزرگ شدن در چشمان عمومی، محافظت از آرامش خود و یادگیری داستانش با شرایط خودش فکر کند. بکی جی گفت: «کل مفهوم الگو بودن، الگوبرداری از این ایده از کمال است، و من فکر نمی‌کنم این ایده اصلا واقعی باشد. به جای اینکه یک الگو باشم، همیشه مسئولیت این را احساس کرده‌ام که یک الگوی واقعی باشم، به این معنی که همه پاسخ‌ها را نخواهم داشت. قرار نیست هر بار به درستی آن را دریافت کنم.» او همچنین به صراحت در مورد درمان، خانواده و سفر شفابخش خود صحبت کرد و گفت: \"من باید به فردی تبدیل می شدم که بیشتر به آن نیاز داشتم و آن زمان بود که بکی جی به وجود آمد.\" این گفتگو چند روز قبل از پیوستن او به هفته موسیقی لاتین بیلبورد برای یک سوپراستار Q A در این چهارشنبه (21 اکتبر) انجام می شود. بکی جی در پنجمین جشنواره سالانه روز جهانی بهداشت روانی پروژه ذهن سالم در استودیو اسپرینگ در 10 اکتبر 2026 در شهر نیویورک با طرفداران ژست می گیرد. اعتبار: Rob Kim/Getty Images برای Project Healthy Minds راب کیم/Getty Images برای Project Healthy Minds BMI فضایی برای زنان ترانه سرا در Música Mexicana ایجاد می"}, {"source": "Billboard", "title": "‘I’m Experiencing Everything I’ve Ever Wanted’: Recapping Miley’s Live Return, On Her Own Terms", "link": "https://www.billboard.com/lists/miley-hollywood-bowl-live-return-recap/", "summary": "It s always been a dream of mine to play such an iconic venue, Miley wrote on social media just hours ahead of her Hollywood Bowl performance on Friday night (Oct. 16). It was a funny reminder for longtime fans who have seen the child actor ascend to pop star heights; while Miley has been around and iconic for so many years, it s really been the last few in which her career has been celebrated more widely. At the 2024 Grammys, she won her first award (actually, two) for her Billboard Hot 100 No. 1 smash Flowers, taking home record of the year and best pop solo performance. In 2025, she joined Spotify s exclusive Billions Club, delivering a hits-filled set in Paris to perform her biggest songs including Wrecking Ball and The Climb. And earlier this year, she celebrated the 25th anniversary of Hannah Montana with a Disney+ special and rare media blitz. Already this year, she dropped Cyrus from her stage name joining mononymous legends like Madonna, Cher and Beyoncé. And now, in her own words, she is living out a longtime dream of playing Los Angeles famed venue the Bowl. Miley last performed a full set four years ago, in Mexico for over 150,000 fans (the Bowl s capacity is 17,500). Since, she became a frequent guest at Chateau Marmont for intimate, invite-only sets but has otherwise remained absent from the stage. Needless to say, anticipation and fervor was at an all-time high for her first of two sold-out Bowl shows (the second is Sunday, Oct. 18). From the live debut of Bass Persuades standouts to the sing-alongs for generational hits like We Can t Stop, Party in the U.S.A and The Climb, here are the seven most notable moments from Miley s major live return.", "date_str": "2026-10-17T08:09:27+00:00", "hash": "cff6f612b9931960", "title_fa": "«من هر چیزی را که همیشه می‌خواستم تجربه می‌کنم»: خلاصه کردن بازگشت زنده مایلی، با شرایط خودش", "summary_fa": "مایلی فقط چند ساعت قبل از اجرای خود در هالیوود بول در جمعه شب (16 اکتبر) در شبکه های اجتماعی نوشت: همیشه رویای من بود که در چنین مکان نمادینی بازی کنم. این یک یادآوری خنده دار برای طرفداران قدیمی بود که دیده اند این بازیگر کودک به ارتفاعات ستاره های پاپ صعود کرده است. در حالی که مایلی سال‌های زیادی در اطراف و نماد بوده است، این واقعاً آخرین آخرین موردی است که در آن حرفه او به طور گسترده‌تری مورد تجلیل قرار گرفته است. در گرمی 2024، او اولین جایزه خود (در واقع دو جایزه) را برای بیلبورد Hot 100 No. در سال 2025، او به کلاب انحصاری میلیاردها اسپاتیفای ملحق شد و مجموعه‌ای پر بازدید در پاریس برای اجرای بزرگترین آهنگ‌هایش از جمله Wrecking Ball و The Climb ارائه کرد. و در اوایل سال جاری، او 25 سالگی هانا مونتانا را با یک پخش برقی ویژه و نادر رسانه ای Disney+ جشن گرفت. در همین سال، او کوروش را از نام هنری خود کنار گذاشت و به اسطوره‌های تک نامی مانند مدونا، شر و بیانسه پیوست. و اکنون، به قول خودش، او در حال زندگی کردن در رویای دیرینه بازی در محل مشهور لس آنجلس باول است. مایلی آخرین بار چهار سال پیش یک مجموعه کامل را در مکزیک برای بیش از 150000 طرفدار اجرا کرد (ظرفیت Bowl 17500 است). از آن زمان، او مهمان مکرر Chateau Marmont برای ست های صمیمی و فقط دعوت شده بود، اما در غیر این صورت از صحنه غایب بود. نیازی به گفتن نیست که انتظار و شور و اشتیاق او برای اولین بار از دو نمایش باول فروخته شده او (دومین نمایش یکشنبه، 18 اکتبر) در بالاترین حد خود بود. از اولین پخش زنده بازیگران Bass Persuades گرفته تا آواز خواندن برای موفقیت های نسلی مانند We Can t Stop،"}, {"source": "Billboard", "title": "Harry Styles Pays Tribute to Liam Payne With Unreleased Song on Anniversary of His Death", "link": "https://www.billboard.com/music/music-news/harry-styles-dedicates-song-to-liam-payne-1236362307/", "summary": "Harry Styles paid tribute to his late One Direction bandmate Liam Payne at Madison Square Garden on Friday (Oct. 16), debuting an unreleased song he wrote for his friend on the second anniversary of Payne’s death. Performing as part of his 30-night residency at the New York venue, Styles paused to address the crowd before the tribute. “I feel incredibly lucky to get to play these shows here in New York, and this building means a lot to me,” he said, reflecting on the people who had shaped his life. “And two years ago today, I lost one of those friends.” “I’m sure a lot of you have been through similar things. I hope you haven’t. But really, it’s just about looking after each other,” Styles continued. “So many people who have touched my life in such special ways, I wouldn’t be here without. I’m gonna play you a song I wrote for my friend about two years ago, if that’s all right.” He then introduced the song by name — “This is ‘What Is Enough’” — and performed its live debut. Payne, who rose to fame alongside Styles, Niall Horan, Louis Tomlinson and Zayn Malik in One Direction, died in October 2024 at age 31. The group, which formed on the U.K.’s The X Factor in 2010 and went on hiatus in 2016, remains one of the best-selling boy bands of all time, with four consecutive No. 1 albums on the Billboard 200. In the two years since Payne’s death, each surviving member has returned to making music. The tribute came amid a landmark run for Styles. His Together, Together Tour — in support of his fourth studio album, Kiss All the Time, Disco Occasionally — includes a record-breaking 30-show residency at Madison Square Garden, for which Ticketmaster reported 11.5 million people registered for presale access. A two-time Grammy winner, Styles has topped the Billboard Hot 100 with “Watermelon Sugar” and “As It Was” — the latter spending 15 weeks at No. 1 — and scored three consecutive No. 1 albums on the Billboard 200 as a solo artist. https://www.instagram.com/reels/DelDRGbuG8H", "date_str": "2026-10-17T05:07:06+00:00", "hash": "eec8995193ae0d81", "title_fa": "هری استایلز به مناسبت سالگرد مرگ لیام پین با آهنگی منتشر نشده به او ادای احترام کرد.", "summary_fa": "هری استایلز روز جمعه (16 اکتبر) در مدیسون اسکوئر گاردن به هم گروه فقید خود در One Direction، لیام پین، ادای احترام کرد و آهنگی منتشر نشده را که در دومین سالگرد مرگ پین برای دوستش نوشت. استایلز که به عنوان بخشی از اقامت 30 شبه خود در محل برگزاری نیویورک اجرا می کرد، قبل از ادای احترام، برای سخنرانی برای جمعیت مکث کرد. او با تأمل در مورد افرادی که زندگی او را شکل داده اند، گفت: \"من بسیار خوش شانس هستم که این نمایش ها را اینجا در نیویورک بازی می کنم، و این ساختمان برای من ارزش زیادی دارد.\" و دو سال پیش امروز، یکی از آن دوستان را از دست دادم. استایلز ادامه داد: \"مطمئنم که بسیاری از شما موارد مشابهی را پشت سر گذاشته اید. امیدوارم ندیده باشید. اما در واقع، این فقط مراقبت از یکدیگر است.\" «بسیاری از افرادی که زندگی من را به شیوه‌های خاصی تحت تأثیر قرار داده‌اند، بدون من اینجا نبودم. اگر درست باشد، آهنگی را که حدود دو سال پیش برای دوستم نوشتم، برای شما پخش خواهم کرد.» او سپس آهنگ را با نام - \"این است \"به اندازه کافی\" معرفی کرد - و اولین اجرای زنده آن را اجرا کرد. پین که در کنار استایلز، نایل هوران، لوئیس تاملینسون و زین مالیک در وان دایرکشن به شهرت رسید، در اکتبر 2024 در سن 31 سالگی درگذشت. این گروه که در سال 2010 در بریتانیایی ایکس فاکتور شکل گرفت و در سال 2016 به پایان رسید، همچنان یکی از پرفروش ترین گروه های پرفروش تمام دوران است. 1 آلبوم در بیلبورد 200. در دو سال پس از مرگ پین، هر یک از اعضای بازمانده به ساخت موسیقی بازگشته اند. این ادای احترام در بحبوحه اجرای برجسته برای استایلز برگزار شد. تور او با هم، با هم - در حمایت از"}, {"source": "Billboard", "title": "50 Cent Says Diddy’s ‘Gonna Turn Up in This Next Joint’ After Prison Transfer", "link": "https://www.billboard.com/music/rb-hip-hop/50-cent-diddy-transfer-prison-reaction-1236362276/", "summary": "Diddy was reportedly transferred to a Pennsylvania federal prison following a physical altercation earlier this week, and 50 Cent wasted no time in trolling Combs on Friday (Oct. 16). The G-Unit mogul has been busy in promo mode for his Street Fighter movie , which hit theaters on Friday, but he made sure to carve out a few seconds to stay updated on the Diddy saga behind bars. Related A Timeline of 50 Cent and Diddy s Tumultuous Relationship 50 Cent Trolls Diddy Over 50-Month Prison Sentence: I m Available Here s How 50 Cent Reacted to Diddy Reportedly Watching His The Reckoning Docuseries Diddy on the move, he gonna turn up in this next joint on gang, he quipped on IG . The second slide had 50 s followers in stitches, as he posted a wind-up toy resembling Diddy that was blowing bubbles out of his butt. Yoo this nicca the worst son nah lollll yall niccas stupid son, Bobby Shmurda wrote. TMZ was the first to report that Combs had been transferred from FCI Fort Dix in New Jersey to Federal Correctional Institution, Allenwood in Pennsylvania. Diddy was allegedly involved in a confrontation with another inmate that left him hospitalized with a head injury, but both Diddy‘s family and the Bureau of Prisons denied reports about the alleged dispute between the disgraced Bad Boy mogul and Christopher “Dudus” Coke, who is the leader of an infamous Jamaican crime organization. A spokesperson for Diddy confirmed to Billboard that Combs was moved from Dix Hills to a low-security facility. We appreciate the Bureau of Prisons taking the safety and security of Sean and everyone involved seriously, the spokesperson said in a statement. His transfer from one low-security facility to another is an important distinction, and while we cannot speak to the BOP s specific reasons for the move, it is consistent with a decision made with safety and security in mind. We are grateful for the attention being given to his well-being and hope he can continue serving his time without unnecessary disruption. 50 Cent was behind last year s Sean Combs: The Reckoning docuseries detailing Diddy s case and history of alleged sexual abuse, which the Queens rapper won an Emmy for. The In Da Club rapper appeared on Jimmy Kimmel Live! on Tuesday (Oct. 14) where he reacted to reports of Combs watching the series about his downfall in prison. He saw the whole thing I’m sure (he) thought it was the best documentary he ever saw in his life, 50 said. Combs was sentenced to 50 months behind bars in Oc", "date_str": "2026-10-17T00:54:44+00:00", "hash": "66c9c25db013976e", "title_fa": "50 سنت می‌گوید دیدی پس از انتقال به زندان «در این مشترک بعدی ظاهر می‌شود»", "summary_fa": "دیدی در اوایل این هفته در پی یک درگیری فیزیکی به زندان فدرال پنسیلوانیا منتقل شد و 50 سنت در روز جمعه (16 اکتبر) هیچ وقت را برای ترول Combs تلف نکرد. غول G-Unit در حالت تبلیغاتی برای فیلم Street Fighter خود که روز جمعه اکران شد، مشغول بوده است، اما او مطمئن شد که چند ثانیه از حماسه Diddy در پشت میله‌ها به‌روز می‌شود. مربوط به جدول زمانی رابطه آشفته 50 سنت و دیدی 50 سنت ترول دیدی بیش از 50 ماه حبس محکوم شد: من در دسترس هستم در اینجا نحوه واکنش 50 سنت به دیدی گزارش شده است که در حال تماشای مستندات او بود. اسلاید دوم 50 دنبال کننده در بخیه داشت، زیرا او یک اسباب بازی بادگیر شبیه دیدی را که حباب ها را از باسن او بیرون می زد، ارسال کرد. بابی شموردا نوشت: یو، این نیکا، بدترین پسر است. TMZ اولین کسی بود که گزارش داد که Combs از FCI Fort Dix در نیوجرسی به موسسه اصلاحی فدرال، Allenwood در پنسیلوانیا منتقل شده است. ظاهراً دیدی درگیر درگیری با یک زندانی دیگر بود که باعث شد او با جراحت از ناحیه سر در بیمارستان بستری شود، اما خانواده دیدی و اداره زندان ها گزارش های مربوط به اختلاف ادعایی بین غول بدنام پسر بد و کریستوفر «دودوس» کوکا را که رهبر یک سازمان جنایتکار بدنام جامائیکا است، رد کردند. سخنگوی دیدی به بیلبورد تایید get . He’s also asking an appeals court to shorten the prison term for violations of federal prostitution laws, arguing that his sentencing judge unfairly disregarded a jury’s decision to acquit him of more serious racketeering and sex-trafficking charges.", "date_str": "2026-10-17T00:53:07+00:00", "hash": "2e9e5c5302d3f814", "title_fa": "دیدی از زندان نیوجرسی به مرکز مشابهی در پنسیلوانیا نقل مکان کرد", "summary_fa": "بیلبورد تایید می کند که شان «دیدی» کامبز از یک زندان با امنیت پایین در نیوجرسی به یک مرکز فدرال مشابه در پنسیلوانیا منتقل شده است. سخنگوی اداره فدرال زندان ها به بیلبورد گفت که Combs روز جمعه (16 اکتبر) از FCI Fort Dix به بخش امنیتی پایین FCI Allenwood منتقل شد. نماینده زندان گفت: «به دلایل حفظ حریم خصوصی، ایمنی و امنیتی، ما در مورد شرایط حبس برای هیچ فردی که در بازداشت هستیم، از جمله دلایل انتقال صحبت نمی کنیم. زندان فورت دیکس در نیوجرسی و مرکز آلن‌وود در پنسیلوانیا همان سطح مؤسسه‌ای با امنیت پایین هستند. نماینده Combs بلافاصله درخواستی برای اظهار نظر در روز جمعه ارائه نکرد. کامبز از اکتبر 2025 در فورت دیکس زندانی بود، مدت کوتاهی پس از آن که به دلیل ترتیب دادن رویدادهای فحشا بین ایالتی به نام \"فروک ​​آف\" به چهار سال زندان محکوم شد. او یک سال قبل از آن را در بازداشتگاه متروپولیتن بروکلین گذراند و این مدت به اعتبار کلی محکومیت او خواهد بود. طبق گزارش ها، غول سابق موسیقی از زمان ورود به فورت دیکس و بیش از یک بار در سلول انفرادی درگیر چندین دعوا شده است. در ماه سپتامبر، یک تحقیق بمب‌گذاری‌شده NBC News گزارش داد که او در فورت دیکس زندگی «نازخورده‌ای» با گوشی‌های هوشمند قاچاق، ماساژ به سبک چینی و کنیاک هنسی داشته است. Combs در حال حاضر قرار است در مارس 2028 منتشر شود، اگرچه برنامه آزادی Bureau of Prison یک هدف متحرک است. او همچنین از دادگاه تجدیدنظر می‌خواهد که مدت حبس را برای نقض قوانین فحشا فدرال کاهش دهد و استدلال می‌کند که قاضی محکوم‌کننده او به‌طور ناعادلانه تصمیم هیئت منصفه مبنی بر تبرئه او را از اتهامات جدی‌تر تجاوز جنسی و قاچاق جنسی نادیده گرفته است. بیلبورد می تواند تایید کند که شان «دیدی» کامبز از یک زندان با"}, {"source": "Billboard", "title": "Swizz Beatz Reveals Michael Jackson Had a Crush on Alicia Keys: ‘I Think Janet Was the One That Told A.K.’", "link": "https://www.billboard.com/music/rb-hip-hop/swizz-beatz-michael-jackson-crush-alicia-keys-1236362241/", "summary": "Swizz Beatz and Alicia Keys stopped by Michael Jackson s house shortly before the King of Pop s untimely death back in 2009. The Bronx record producer recently stopped by The Real Report With Tony Yayo and Uncle Murda and revealed that Jackson apparently had a crush on his R B superstar wife. Swizz didn t feel offended or disrespected or anything like that. He actually thought it was kind ve cool and took initiative to set a meet-up between the two singers. I found out that Michael had a crush on my wife. In a cool way, but Michael s a virgo, so I don t know. I m a virgo, he said jokingly. And so I think Janet was the one that told A.K. and she was like, You know, my brother always had a crush on you. So I thought it was cool to set up for her to meet him. Just for both of them to just have that moment as fans of each other. He added: We set up the meeting at the crib. We go to the house, Michael was so cool Michael was so cool, bro. Just seeing him in his real element. He had his beautiful kids there. I remember we brought gifts for the kids and he was just excited about going on a tour. He was just like, Yo, when I do this, I mma hit em with that, showing A.K. some of his moves. He also raved about a jerk lobster dish that Mike s Jamaican personal chef made and said he offered him his framed Thriller plaques after Swizz said he noticed them sitting on the floor propped up on a wall, but he said no because he didn t want to seem too thirsty, even after Mike dismissed them as just things. You can watch the full conversation below.", "date_str": "2026-10-17T00:04:55+00:00", "hash": "e747522b01cc6911", "title_fa": "سوئیز بیتز فاش کرد که مایکل جکسون به آلیشیا کیز علاقه داشت: «فکر می‌کنم جانت کسی بود که به A.K.» گفت.", "summary_fa": "سوئیز بیتز و آلیشیا کیز اندکی قبل از مرگ نابهنگام پادشاه پاپ در سال 2009 در خانه مایکل جکسون توقف کردند. تهیه کننده رکورد برانکس اخیراً به گزارش واقعی با تونی یایو و عمو مردا رفت و فاش کرد که جکسون ظاهراً عاشق همسر فوق ستاره R B خود بوده است. سوئیز احساس توهین یا بی احترامی یا چیزی شبیه به آن نداشت. او در واقع فکر می‌کرد که خیلی خوب است و ابتکار عمل را برای ایجاد یک ملاقات بین این دو خواننده به دست گرفت. فهمیدم که مایکل عاشق همسرم شده است. به طرز جالبی، اما مایکل یک باکره است، بنابراین من نمی دانم. به شوخی گفت من باکره هستم. و بنابراین فکر می کنم جانت کسی بود که به A.K. و او مثل این بود، می دانید، برادرم همیشه شما را دوست داشت. بنابراین فکر کردم که خیلی خوب است که او را برای ملاقات با او آماده کنم. فقط برای اینکه هر دو آن لحظه را به عنوان طرفدار یکدیگر داشته باشند. وی افزود: جلسه را در گهواره برپا کردیم. میریم خونه، مایکل خیلی باحال بود مایکل خیلی باحال بود داداش. فقط او را در عنصر واقعی اش می بینم. او بچه های زیبایش را آنجا داشت. یادم می‌آید برای بچه‌ها هدایایی آوردیم و او فقط برای رفتن به یک تور هیجان‌زده بود. او دقیقاً مثل \"یو\" بود، وقتی من این کار را انجام دادم، با آن ضربه ای به او زدم و A.K را نشان دادم. برخی از حرکات او او همچنین از یک غذای خرچنگ تند و تیز که سرآشپز شخصی جامائیکایی مایک درست کرده بود ابراز خوشحالی کرد و گفت پس از اینکه سوئیز گفت متوجه شده که آنها روی زمین نشسته اند و روی دیوار تکیه داده اند، پلاک های قاب شده تریلر خود را به او تقدیم کرده است، اما او"}, {"source": "Billboard", "title": "Billboard’s Music Industry Events Calendar", "link": "https://www.billboard.com/pro/music-industry-events-calendar-festivals-awards-conferences/", "summary": "As part of our continuing efforts to serve the music industry and its creators, Billboard Pro now features a music industry events calendar for readers. The calendar will act as music s most complete summary major national and international industry events, from conferences to festivals to networking mixers and more. Just as Billboard is music s must-read source for news, charts and analysis, now it also is th
