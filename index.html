ایی گزارش داده بود که ایران پیش از حمله به یک پایگاه نظامی در «اردن»، تصاویر ماهواره‌ای را با وضوح بالا از نهادهای چینی دریافت کرده است. به گفته این مقام‌ها، میان تصاویر دریافتی و حمله‌ای که سه نظامی آمریکایی در آن کشته شدند، ارتباط معناداری وجود داشت."}, {"source": "IranWire", "title": "عملیات نیروهای دولت یمن علیه حوثی‌های مورد حمایت جمهوری اسلامی آغاز شد", "link": "https://iranwire.com/fa/news-1/158452-%D8%B9%D9%85%D9%84%DB%8C%D8%A7%D8%AA-%D9%86%DB%8C%D8%B1%D9%88%D9%87%D8%A7%DB%8C-%D8%AF%D9%88%D9%84%D8%AA-%DB%8C%D9%85%D9%86-%D8%B9%D9%84%DB%8C%D9%87-%D8%AD%D9%88%D8%AB%DB%8C%D9%87%D8%A7%DB%8C-%D9%85%D9%88%D8%B1%D8%AF-%D8%AD%D9%85%D8%A7%DB%8C%D8%AA-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D8%A2%D8%BA%D8%A7%D8%B2-%D8%B4%D8%AF/", "summary": "نیروهای دولت یمن با پشتیبانی عربستان سعودی روز یک‌شنبه ۱۲مهر ۱۴۰۵ ضدحمله‌ای را علیه حوثی‌ها آغاز کردند؛ عملیاتی که هدف اصلی آن بازپس‌گیر ...", "date_str": "2026-10-04T15:00:02+00:00", "hash": "0926a7f5b50251bc", "title_fa": "عملیات نیروهای دولت یمن علیه حوثی‌های مورد حمایت جمهوری اسلامی آغاز شد", "summary_fa": "نیروهای دولت یمن با پشتیبانی عربستان سعودی روز یک‌شنبه ۱۲مهر ۱۴۰۵ ضدحمله‌ای را علیه حوثی‌ها آغاز کردند؛ عملیاتی که هدف اصلی آن بازپس‌گیر ... رشاد علیمی، رییس شورای ریاست‌جمهوری یمن، در سخنرانی خود با اعلام آغاز عملیات گفت فرصت‌های کاهش تنش با «شبه‌نظامیان حوثی» به پایان رسیده است. تنگه باب‌المندب یکی از مسیرهای مهم تجارت جهانی و صادرات نفت عربستان به شمار می‌رود. کنترل مناطق ساحلی نزدیک این تنگه توسط حوثی‌ها، به این گروه و ایران، که از آن حمایت می‌کند، اهرم قابل‌توجهی در برابر آمریکا، متحدانش در خلیج فارس و اقتصاد جهانی داده است. این عملیات طی چند هفته گذشته با برنامه‌ریزی دولت مورد شناسایی بین‌المللی یمن و عربستان آماده شده است و ده‌ها هزار نیروی زمینی وفادار به دولت یمن در آن مشارکت دارند. عربستان سعودی نیز عمدتا با تامین پوشش هوایی برای نیروهای یمنی و انجام حملات هوایی علیه مواضع حوثی‌ها از این عملیات پشتیبانی می‌کند. یکی از اهداف اصلی نیروهای دولتی، بازپس‌گیری صنعا، پایتخت یمن، است که چندین سال تحت کنترل حوثی‌ها قرار داشته است. حوثی‌ها همزمان با آغاز این عملیات، در روزهای اخیر به حملات موشکی علیه اهدافی در عربستان ادامه داده‌اند و از جمله تاسیسات شرکت نفتی دولتی آرامکو را هدف قرار داده‌اند. با وجود درخواست‌های عربستان، آمریکا در حال حاضر قصد ندارد مستقیما وارد نبرد با حوثی‌ها شود. مقام‌های آمریکایی گفته‌اند واشنگتن در این مرحله اطلاعات و پشتیبانی مربوط به شناسایی و هدف‌گیری را در اختیار نیروهای یمنی و عربستان قرار می‌دهد. دولت دونالد ترامپ، رییس‌جمهوری آمریکا، از یک سو به دنبال حمایت از محمد بن سلمان، ولیعهد عربستان و متحد خود، و از سوی دیگر در تلاش است از ورود به یک جبهه نظامی جدید در خاورمیانه جلوگیری کند. به گفته یک مقام آمریکایی، فرماندهی مرکزی آمریکا نیز درباره آغاز حملات علیه حوثی‌ها نگرانی‌هایی داشته و آن را عاملی برای منحرف شدن"}, {"source": "IranWire", "title": "وزیر انرژی آمریکا: فشار دیپلماتیک و نظامی بر ایران ادامه پیدا می‌کند", "link": "https://iranwire.com/fa/news-1/158453-%D9%88%D8%B2%DB%8C%D8%B1-%D8%A7%D9%86%D8%B1%DA%98%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D9%81%D8%B4%D8%A7%D8%B1-%D8%AF%DB%8C%D9%BE%D9%84%D9%85%D8%A7%D8%AA%DB%8C%DA%A9-%D9%88-%D9%86%D8%B8%D8%A7%D9%85%DB%8C-%D8%A8%D8%B1-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%A7%D8%AF%D8%A7%D9%85%D9%87-%D9%BE%DB%8C%D8%AF%D8%A7-%D9%85%DB%8C%DA%A9%D9%86%D8%AF/", "summary": "کریس رایت، وزیر انرژی آمریکا، گفت دولت دونالد ترامپ همزمان مسیرهای دیپلماتیک و نظامی را برای مقابله با برنامه هسته‌ای جمهوری اسلامی دنبا ...", "date_str": "2026-10-04T17:01:44+00:00", "hash": "e58e1646272bd88c", "title_fa": "وزیر انرژی آمریکا: فشار دیپلماتیک و نظامی بر ایران ادامه پیدا می‌کند", "summary_fa": "کریس رایت، وزیر انرژی آمریکا، گفت دولت دونالد ترامپ همزمان مسیرهای دیپلماتیک و نظامی را برای مقابله با برنامه هسته‌ای جمهوری اسلامی دنبا ... رایت روز یک‌شنبه ۱۲ مهر در گفت‌وگو با شبکه سی‌بی‌اس درباره احتمال تشدید درگیری با ایران گفت آمریکا در حال بررسی همه راه‌های ممکن برای دستیابی به هدف خود، از جمله فشار اقتصادی و آمادگی برای اقدامات نظامی، است. او افزود: «در تمام زمان‌ها» هر دو مسیر دیپلماسی و فشار نظامی دن  نیروها انجام داده و صدها موضع متعلق به حوثی‌ها را هدف قرار داده است. حوثی‌ها پیشروی نیروهای دولتی در این منطقه را رد کرده‌اند. باب‌المندب دریای سرخ را به خلیج عدن متصل می‌کند و یکی از مسیرهای اصلی کشتیرانی بین آسیا و اروپا به شمار می‌رود. حوثی‌های مورد حمایت جمهوری اسلامی در هفته‌های اخیر تلاش کرده‌اند کنترل این آبراه حیاتی را در دست بگیرند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید"}, {"source": "Independent Persian", "title": "صدای ما می‌تواند نشان دهد بدن‌‌مان با چه سرعتی پیر می‌شود", "link": "https://www.independentpersian.com/node/422542/%D8%B2%D9%86%D8%AF%DA%AF%DB%8C/%D8%B9%D9%84%D9%88%D9%85/%D8%B5%D8%AF%D8%A7%DB%8C-%D9%85%D8%A7-%D9%85%DB%8C%E2%80%8C%D8%AA%D9%88%D8%A7%D9%86%D8%AF-%D9%86%D8%B4%D8%A7%D9%86-%D8%AF%D9%87%D8%AF-%D8%A8%D8%AF%D9%86%E2%80%8C%E2%80%8C%D9%85%D8%A7%D9%86-%D8%A8%D8%A7-%DA%86%D9%87-%D8%B3%D8%B1%D8%B9%D8%AA%DB%8C-%D9%BE%DB%8C%D8%B1-%D9%85%DB%8C%E2%80%8C%D8%B4%D9%88%D8%AF", "summary": "صدای ما احتمالا بیش از آنچه گمان می‌کنیم حاوی اطلاعاتی درباره وضعیت جسمی و مغزی ماست. پژوهشگران به‌تازگی ابزاری مبتنی بر هوش مصنوعی ساخته‌اند که با گوش دادن به نحوه صحبت کردن افراد، سن آنها را تخمین می‌زند؛ تخمینی که ممکن است سرنخ‌هایی از سرعت پیری و حتی خطر زوال عقل به دست دهد. این ابزار فقط به تن صدا یا زیر و بمی آن توجه نمی‌کند، بلکه صدها ویژگی، از سرعت حرف زدن و مکث‌ها گرفته تا انتخاب واژه‌ها و شیوه بیان احساسات را می‌سنجد. پژوهشگران با آزمایش این مدل روی نزدیک به سه هزار اسپانیایی‌زبان دریافتند که هرچه سن تخمینی هوش مصنوعی از سن واقعی او بیشتر باشد، احتمال بروز اختلالات شناختی، زوال عقل و شتاب روند پیری زیستی در آنها بالاتر است. این افراد همچنین محرومیت‌های اجتماعی و اقتصادی بیشتری را هم از سر گذرانده بودند. نتایج این مطالعه روز چهارشنبه ۳۰ سپتامبر در نشریه علمی «ساینس ادونسز» (Science Advances) منتشر شد. به نوشته تارنمای لایو‌ساینس، طرح اصلی این پژوهش بی‌شباهت به «ساعت‌های پیری» نیست؛ روش‌هایی که با بررسی نشانه‌های زیستی بدن تل 4T17:25:19+00:00", "hash": "a63a4eabcc6cebd2", "title_fa": "ادامه اعتراضات دانش‌آموزی در فرانسه؛ ۴۰۰ تا ۵۰۰ مدرسه تعطیل یا نیمه‌تعطیل می‌شوند", "summary_fa": "وزارت آموزش فرانسه اعلام کرده است که در پی ادامه اعتراضات دانش‌آموزی، بین ۴۰۰ تا ۵۰۰ مدرسه متوسطه روز دوشنبه نیز به‌طور کامل یا جزئی تعطیل خواهند بود؛ اعتراضاتی که در روزهای اخیر با درگیری با پلیس، آسیب به مدارس و خشونت‌های خیابانی همراه شده است."}, {"source": "BBC Persian", "title": "ممنوعیت ورود پولانسکی به اسرائیل پس از تصویب «صهیونیسم نژادپرستی است» در حزب سبز بریتانیا", "link": "https://www.bbc.com/persian/articles/cmn04epzgyngo?at_medium=RSS&at_campaign=rss", "summary": "وزارت خارجه اسرائیل ورود زک پولانسکی، رهبر حزب سبز بریتانیا، را به اسرائیل ممنوع اعلام کرد. این ممنوعیت پس از آن اعلام شد که اعضای این حزب دیروز در کنفرانس سالانه در برایتون مرامنامه‌ای را به تصویب رساندند که صهیونیسم را شکلی از نژادپرستی می‌داند. وزارت خارجه اسرائیل این را «متنی آشکارا یهودستیزانه» و فراتر از «مرز بحث سیاسی مشروع» توصیف کرد. خود آقای پولانسکی در رای‌گیری روز یکشنبه شرکت نکرد. این مرامنامه، صهیونیسم را ایدئولوژی‌ای تعریف می‌کند که از یک «دولت قومگرای یهودی» حمایت می‌کند. براساس این مرامنامه، حزب سبز حمایتش از «یک دولت فلسطینی دموکراتیک واحد در سراسر فلسطین تاریخی» را هم اعلام کرد.", "date_str": "2026-10-05T12:38:04+00:00", "hash": "47b4a65e781cb36c", "title_fa": "ممنوعیت ورود پولانسکی به اسرائیل پس از تصویب «صهیونیسم نژادپرستی است» در حزب سبز بریتانیا", "summary_fa": "وزارت خارجه اسرائیل ورود زک پولانسکی، رهبر حزب سبز بریتانیا، را به اسرائیل ممنوع اعلام کرد. این ممنوعیت پس از آن اعلام شد که اعضای این حزب دیروز در کنفرانس سالانه در برایتون مرامنامه‌ای را به تصویب رساندند که صهیونیسم را شکلی از نژادپرستی می‌داند. وزارت خارجه اسرائیل این را «متنی آشکارا یهودستیزانه» و فراتر از «مرز بحث سیاسی مشروع» توصیف کرد. خود آقای پولانسکی در رای‌گیری روز یکشنبه شرکت نکرد. این مرامنامه، صهیونیسم را ایدئولوژی‌ای تعریف می‌کند که از یک «دولت قومگرای یهودی» حمایت می‌کند. براساس این مرامنامه، حزب سبز حمایتش از «یک دولت فلسطینی دموکراتیک واحد در سراسر فلسطین تاریخی» را هم اعلام کرد. برخی گروه‌های یهودی از آن انتقاد کرده‌اند و آن را «حمله به جامعه یهودیان» خوانده‌اند. هیئت نمایندگان یهودیان بریتانیا و شورای رهبری یهودیان در بیانیه‌ای گفتند: «صهیونیسم ضدنژادپرستی است و پس از هزاران سال آزار و اذیت یهودیان در خارج از سرزمین باستانی‌شان، پناهگاهی برای یهودیان در سرزمین اجدادی‌ ایجاد می‌کند.» در این بیانیه آمده است: «برچسب زدن به اکثر یهودیان بریتانیا و نهادهای یهودی با عنوان &#x27;نژادپرست&#x27;، پس از سالی که یهودیان بریتانیا در کنیسه به قتل رسیده‌اند، در خیابان‌ چاقو خورده‌اند، و شاهد بمب‌ آتش‌زا در اماکن عمومی خود بوده‌اند، به پراکندن نفرت از یهودیان دامن می‌زند.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. وزارت خارجه اسرائیل این مرامنامه را «لکه‌ای در تاریخ بریتانیا» توصیف کرد. این مرامنامه بین چهره‌های ارشد حزب اختلاف انداخته است، از جمله بین دو معاون حزب؛ متین علی از آن حمایت کرده اما ریچل میلوارد متن را «مشکل‌دار» توصیف کرده است. اعضای حزب اما این مرامنامه را که گروهی از فعالان در کنفرانس حزب در برایتون پیشنهاد کردند، با ۱۰۲۲ رای موافق در مقابل ۸۱۳ رای مخالف تصویب کردند."}, {"source": "BBC Persian", "title": "قوه قضائیه ایران از اعدام علیرضا سپاهی و علیرضا رئیسی، دو بازداشتی اعتراضات دی‌ماه میدان علیخانی اصفهان، خبر داد", "link": "https://www.bbc.com/persian/articles/cvn063p79kz1o?at_medium=RSS&at_campaign=rss", "summary": "قوه قضائیه ایران از اعدام علیرضا سپاهی و علیرضا رئیسی، از بازداشتیان اعتراضات دی‌ماه میدان علیخانی ملک‌شهر اصفهان خبر داده است. حکومت ایران می‌گوید در جریان درگیری دراین میدان در تاریخ ۱۸ دی، چهار تن از ماموران بسیج و فراجا کشته شدند.", "date_str": "2026-10-05T11:17:31+00:00", "hash": "2dc4fd1e30fe7b1e", "title_fa": "قوه قضائیه ایران از اعدام علیرضا سپاهی و علیرضا رئیسی، دو بازداشتی اعتراضات دی‌ماه میدان علیخانی اصفهان، خبر داد", "summary_fa": "قوه قضائیه ایران از اعدام علیرضا سپاهی و علیرضا رئیسی، از بازداشتیان اعتراضات دی‌ماه میدان علیخانی ملک‌شهر اصفهان خبر داده است. حکومت ایران می‌گوید در جریان درگیری دراین میدان در تاریخ ۱۸ دی، چهار تن از ماموران بسیج و فراجا کشته شدند. پیش‌تر، شهرزاد شهبازی، وکیل علیرضا سپاهی خبر داده بود که موکلش بامداد دوشنبه ۱۳ مهر اعدام شده است. قوه قضائیه آقای سپاهی و آقای رئیسی را متهم کرده که «یک نیروی امنیتی را در حالی که زنده بوده با بنزین سوزانده‌اند.» خبرگزاری میزان، وابسته به قوه قضائیه، از علیرضا سپاهی به عنوان «متهم اصلی» پرونده میدان علیخانی ملک‌شهر اصفهان نام برده است. در بیانیه قوه قضائیه ایران همچنین آمده است که « در بازرسی از منزل علیرضا سپاهی، چندین سلاح سرد از جمله قداره، چاقو، شوکر، تبر و باتوم فلزی کشف شده است.» پیش‌ترهم حکم اعدام پنج نفر از متهمان این پرونده اجرا شد که ابوالفضل سپاهی، پسرعموی علیرضا سپاهی هم در بین آنها بود. شب گذشته یک فایل صوتی منتشر شد که در آن شنیده می‌شود خطبه عقد علیرضا سپاهی و مهشاد کشانی، دیگر متهم همین پرونده با وکالت پدرانشان خوانده می‌شود. این خطبه پیش از انتقال آقای سپاهی به زندان انفرادی خوانده شد. براساس گزارش‌ها مهشاد کشانی که پیش از این به ۵ سال حبس تعزیری محکوم شده، برای گذراندن حبس خود در زندان است. به گفته فعالان حقوق بشر این ازدواج، آخرین تلاش برای جلوگیری از اجرای حکم اعدام آقای سپاهی بود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. مای ساتو، گزارشگر ویژه سازمان ملل در امور حقوق بشر ایران، در یادداشتی ضمن تایید خبر اعدام علیرضا سپاهی، به پرونده او و روند رسیدگی به پرونده متهمان در ایران پرداخته است. خانم ساتو نوشته است: این پرونده با نگرانی‌های جدی در مورد"}, {"source": "BBC Persian", "title": "چرا کانادا خود را برای سناریوی حمله آمریکا آماده می‌کند؟", "link": "https://www.bbc.com/persian/articles/cm9dzyex0e51o?at_medium=RSS&at_campaign=rss", "summary": "مارک کارنی، نخست‌وزیر کانادا، هفته گذشته اذعان کرد که خود را برای سناریویی آماده کرده است که تا همین اواخر تصورش هم دشوار بود: حمله آمریکا به کانادا.", "date_str": "2026-10-05T06:47:48+00:00", "hash": "3455338e14799b34", "title_fa": "چرا کانادا خود را برای سناریوی حمله آمریکا آماده می‌کند؟", "summary_fa": "مارک کارنی، نخست‌وزیر کانادا، هفته گذشته اذعان کرد که خود را برای سناریویی آماده کرده است که تا همین اواخر تصورش هم دشوار بود: حمله آمریکا به کانادا. او با اشاره به اینکه خطر چنین اتفاقی اندک و احتمال وقوع آن بسیار ناچیز است، به نیویورک تایمز گفت در شرایطی که روابط آمریکا و کانادا در دوران ریاست‌جمهوری دونالد ترامپ در حال بازتعریف شدن است، وظیفه دارد همه سناریوهای ممکن را در نظر بگیرد. اعمال تعرفه‌های گسترده ترامپ و اصرار مکرر او بر تبدیل کانادا به پنجاه‌ویکمین ایالت آمریکا، کانادا را واداشته است سناریوی حمله نظامی آمریکا را در قالب رزمایش‌ها و شبیه‌سازی‌های راهبردی بررسی کند. رئیس‌جمهور آمریکا در سال ۲۰۲۵ گفته بود که استفاده آمریکا از زور علیه کانادا «بسیار بعید» است. او در عوض اعلام کرد که برای دستیابی به اهداف سیاسی خود، به اعمال فشارهای اقتصادی ادامه خواهد داد. کاخ سفید در بیانیه‌ای به بی‌بی‌سی اعلام کرد: «رئیس‌جمهور ترامپ بیش از هر کس دیگری برای محافظت از مردم بزرگ کانادا تلاش کرده است.» کارشناسان نظامی که با بی‌بی‌سی گفت‌وگو کرده‌اند نیز معتقدند احتمال حمله نظامی بسیار اندک است. آن‌ها به شیوه‌های متعدد همکاری دفاعی میان دو کشور اشاره می‌کنند. با این حال، روشن است که این موضوع ذهن کانادایی‌ها را به خود مشغول کرده است. ژانویه ۲۰۲۶، پس از آنکه آمریکا نیکولاس مادورو را در ونزوئلا دستگیر کرد، نظرسنجی موسسه لژه نشان داد که بیش از ۳۰ درصد کانادایی‌ها معتقدند حمله نظامی آمریکا به کشورشان محتمل است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. سپهبد کریستوفر کوتس، افسر سابق نیروی هوایی سلطنتی کانادا که ۳۴ سال سابقه خدمت نظامی و تصدی سمت‌های ارشد مختلف را دارد، می‌گوید جنگ میان کانادا و آمریکا بسیار پیچیده و تقریبا تصورناپذیر خواهد بود."}, {"source": "BBC Persian", "title": "دخترانی که در ایران «بساط می‌کنند»؛ «لیسانس دارم، بساط می‌کنم و خجالت هم نمی‌کشم»", "link": "https://www.bbc.com/persian/articles/cmz7z4xlpp0do?at_medium=RSS&at_campaign=rss", "summary": "اعتراض‌های اجتماعی و اقتصادی در سال‌ها‌ی اخیر در ایران و دور‌ه های مختلف جنگ ایران و آمریکا و اسرائیل که به قطعی اینترنت در ایران انجامید بسیاری از کسب و کارهای اینترنتی و صفحات اینستاگرامی را تعطیل کرد. برخی از آنلاین‌شاپ ها به بساط کردن در خیابان‌ها روی آورده‌اند. این مطلب نگاهی است به دختران «بساط کن» در ایران.", "date_str": "2026-10-05T04:09:53+00:00", "hash": "67b6c7d9fd9c9d1a", "title_fa": "دخترانی که در ایران «بساط می‌کنند»؛ «لیسانس دارم، بساط می‌کنم و خجالت هم نمی‌کشم»", "summary_fa": "اعتراض‌های اجتماعی و اقتصادی در سال‌ها‌ی اخیر در ایران و دور‌ه های مختلف جنگ ایران و آمریکا و اسرائیل که به قطعی اینترنت در ایران انجامید بسیاری از کسب و کارهای اینترنتی و صفحات اینستاگرامی را تعطیل کرد. برخی از آنلاین‌شاپ ها به بساط کردن در خیابان‌ها روی آورده‌اند. این مطلب نگاهی است به دختران «بساط کن» در ایران. اینترنت در ایران ۸۹ روز قطع بود و پس از بازگشت محدود آن، بسیاری از کاربرانی که درآمدشان به اینترنت وابسته بود، شغل خود را از دست داده و همزمان با قیمت‌های سر‌به‌فلک‌کشیده دست‌وپنجه نرم می‌کردند. از آن زمان، موج جدیدی از فروش خیابانی توسط زنان در ایران آغاز شد؛ از عرضه غذاهای خانگی و صنایع‌دستی گرفته تا فروش اقلامی مانند زیورآلات، کیف و عروسک. فروشندگان خیابانی از رده‌های سنی مختلف هستند؛ از جوانان ۱۷ساله تا زنانی که برای تامین معاش نوه‌هایشان تلاش می‌کنند. حتی در میان آن‌ها کودکانی هستند که می‌گویند از ۱۲سالگی در اینستاگرام یا پلتفرم‌های دیگر فروشگاه آنلاین داشته‌اند؛ سنی پایین‌تر از حداقل سن مجاز برای داشتن حساب در اینستاگرام. آن‌ها تاکید می‌کنند که «کودک کار» نیستند و در تحصیل نیز موفق‌اند. بسیاری از این زنان «بساط‌کن» در اینستاگرام نیز صفحه دارند و بساط خود را تبلیغ می‌کنند. آن‌ها آدرس و ساعت کارشان را اعلام می‌کنند و از دنبال‌کنندگانشان می‌خواهند از صفحه‌شان حمایت کنند. با این حال، به نظر می‌رسد بازار بساط آن‌ها نیز رونقی ندارد. صفحه «عالی‌شاپ» ۹ اوت ۲۰۲۶ در اینستاگرام نوشت: «وضعیت کاسبی‌مون افتضاح شده. از هر ده نفر که میان سر بساط، یک نفر به زور خرید می‌کنه و می‌ره.» فروشنده دیگری از بندرعباس ویدیویی منتشر کرده که خلوتی ساحل را نشان می‌دهد. او می‌گوید: «هرچقدر هم در اینستاگرام بگویم در فلان ساعت و فلان مکان هستم، وضعیت مردم شهر این است؛ کسی بیرون نیست.» این زن که مادری تنهاست، می‌گوید برای تامین معاش"}, {"source": "BBC Persian", "title": "روایت جان لی اندرسون از آمریکای لاتین در عصر ترامپ: «وارد دوره‌ای شوم شده‌ایم»", "link": "https://www.bbc.com/persian/articles/c9n73ymkk8v3o?at_medium=RSS&at_campaign=rss", "summary": "جان لی اندرسون، روزنامه‌نگار و نویسنده آمریکایی که چهار دهه تحولات آمریکای لاتین را از نزدیک دنبال کرده، می‌گوید این قاره وارد دوره‌ای «شوم» و پرابهام شده است؛ دوره‌ای که به باور او دونالد ترامپ بیش از هر زمان دیگری بر سرنوشت کشورهای منطقه اثر می‌گذارد و حتی می‌تواند به مداخلات مستقیم‌تر آمریکا در آمریکای لاتین منجر شود. او در گفت‌وگو با بی‌بی‌سی از فشار فزاینده واشنگتن بر کشورهای منطقه، آینده کوبا پس از کاستروها و بحران چپ در آمریکای لاتین سخن می‌گوید.", "date_str": "2026-10-04T20:14:25+00:00", "hash": "3f606509947c5ed3", "title_fa": "روایت جان لی اندرسون از آمریکای لاتین در عصر ترامپ: «وارد دوره‌ای شوم شده‌ایم»", "summary_fa": "جان لی اندرسون، روزنامه‌نگار و نویسنده آمریکایی که چهار دهه تحولات آمریکای لاتین را از نزدیک دنبال کرده، می‌گوید این قاره وارد دوره‌ای «شوم» و پرابهام شده است؛ دوره‌ای که به باور او دونالد ترامپ بیش از هر زمان دیگری بر سرنوشت کشورهای منطقه اثر می‌گذارد و حتی می‌تواند به مداخلات مستقیم‌تر آمریکا در آمریکای لاتین منجر شود. او در گفت‌وگو با بی‌بی‌سی از فشار فزاینده واشنگتن بر کشورهای منطقه، آینده کوبا پس از کاستروها و بحران چپ در آمریکای لاتین سخن می‌گوید. جان لی اندرسون از سال ۱۹۹۸ خبرنگار مجله نیویورکر بوده، زندگی‌نامه چه‌گوارا را نوشته و نویسنده مقالاتی درباره هوگو چاوز، فیدل کاسترو و گابریل گارسیا مارکز است. او معتقد است که اکنون سراسر قاره آمریکا در نوعی وضعیت بلاتکلیف و پرابهام به سر می‌برد؛ وضعیتی که به گفته او ناشی از «رفتار مردی است که وارد کاخ سفید شد و شخصیت و منافع خود را بالاتر از منافع کشورش قرار داد»؛ اشاره‌ای به دونالد ترامپ، رئیس‌جمهور آمریکا. در همین زمینه، دونالد ترامپ در سخنرانی خود در مجمع عمومی سازمان ملل متحد گفت: «اگر لازم باشد، ایالات متحده از قدرت نظامی بی‌همتای خود برای تضمین منافع ملی خود در منطقه استفاده خواهد کرد.» او به دستگیری نیکلاس مادورو، رئیس‌جمهور ونزوئلا، در سوم ژانویه به‌عنوان نمونه‌ای از این سیاست اشاره کرد. اما اندرسون می‌گوید تنها کشورهای آمریکای لاتین نیستند که زیر فشار دائمی ترامپ قرار دارند. او می‌افزاید: «حتی با کانادا هم طوری رفتار می‌شود که انگار کره شمالی است.» به گفته او، سبک ترامپ در حال شکل دادن به رهبران قاره است و بسیاری از آن‌ها به دنبال جلب تایید رئیس‌جمهور آمریکا هستند. اندرسون می‌گوید: «ما در دوره‌ای شوم زندگی می‌کنیم و سراسر آمریکای لاتین نیز همین وضعیت را تجربه می‌کند. برخی سیاستمداران به شکلی فرصت‌طلبانه از رابطه خود با آمریکا برای کسب منفعت استفاده کرده‌اند.»"}, {"source": "BBC Persian", "title": "راز بقای کهن‌ترین تمدن آمریکا؛ سازگاری به جای جنگ", "link": "https://www.bbc.com/persian/articles/c3rv1dp1le0o?at_medium=RSS&at_campaign=rss", "summary": "باستان‌شناسان در پرو شهری ۳۸۰۰ ساله را کشف کرده‌اند که می‌تواند درک پژوهشگران از خاستگاه تمدن در قاره آمریکا را تغییر دهد. یافته‌های تازه از محوطه «پِنیکو» نشان می‌دهد بخشی از مردم تمدن کارال پس از یک بحران اقلیمی طولانی، بدون توسل به جنگ خود را با شرایط جدید سازگار کرده‌اند.", "date_str": "2026-10-04T23:41:19+00:00", "hash": "14273c593ac0a939", "title_fa": "راز بقای کهن‌ترین تمدن آمریکا؛ سازگاری به جای جنگ", "summary_fa": "باستان‌شناسان در پرو شهری ۳۸۰۰ ساله را کشف کرده‌اند که می‌تواند درک پژوهشگران از خاستگاه تمدن در قاره آمریکا را تغییر دهد. یافته‌های تازه از محوطه «پِنیکو» نشان می‌دهد بخشی از مردم تمدن کارال پس از یک بحران اقلیمی طولانی، بدون توسل به جنگ خود را با شرایط جدید سازگار کرده‌اند. کشف شهری در دامنه‌های بیابانی پرو که ۳۸۰۰ سال قدمت دارد، می‌تواند درک ما از خاستگاه تمدن در قاره آمریکا را دگرگون کند. در حدود چهار ساعت رانندگی در شمال لیما، دامنه‌های خاکی دره سوپه چشم‌اندازی خشک و نامهربان دارند: دشت‌هایی بادخیز، دیوارهای فروریخته خشت و گلی و موج گرمایی که از دل بیابان برمی‌خیزد. دشوار است تصور کنیم که این دامنه‌های خشک زمانی میزبان یکی از نخستین تمدن‌های بزرگ جهان بوده‌اند و اکنون نیز کشفی تازه در دل همین بیابان، روایت تاریخ قاره آمریکا را دگرگون می‌کند. در ژوئیه ۲۰۲۵، دکتر روث شیدی، باستان‌شناس پرویی، از شهر پِنیکو رونمایی کرد؛ شهری ۳۸۰۰ ساله که به تمدن باستانی کارال در پرو تعلق دارد. در این محوطه تازه کاوش‌شده، ۱۸ سازه از جمله معابد آیینی و مجموعه‌های مسکونی شناسایی شده است. اما اهمیت اصلی این کشف در ارائه شواهدی تازه از این واقعیت نهفته است که مردم کارال بدون توسل به جنگ، خود را با فاجعه‌های اقلیمی سازگار کردند؛ راهبردی برای بقا که امروز نیز به همان اندازه شگفت‌انگیز به نظر می‌رسد که هزاران سال پیش بوده است. دکتر شیدی که سه دهه هدایت پژوهش‌ها در این دره را بر عهده داشته، می‌گوید: «پِنیکو ادامه‌دهنده نگرش تمدن کارال به زندگی بدون مناقشه و درگیری است.» خیلی پیش از آزتک‌ها، مایاها و اینکاها، سواحل خشک پرو محل زندگی تمدن کارال بود؛ یکی از کهن‌ترین و صلح‌آمیزترین جوامع شناخته‌شده جهان. مهم‌ترین مرکز این تمدن، کارال-سوپه، که از آن به عنوان خاستگاه تمدن در قاره آمریکا یاد می‌شود و از سال ۲۰۰۹ در"}, {"source": "Radio Farda", "title": "مرگ مشکوک در آزمایشگاه ایرکوتسک روسیه؛ آمریکا از احتمال بروز طاعون ریوی ابراز نگرانی کرد", "link": "https://www.radiofarda.com/a/us-monitors-suspected-plague-case-in-russia-as-calls-grow-for-travel-restrictions/33870602.html", "summary": "دولت آمریکا می‌گوید گزارش‌ها درباره مرگ یک کارمند آزمایشگاه در منطقه ایرکوتسک روسیه بر اثر مورد مشکوک به طاعون ریوی را زیر نظر دارد.", "date_str": "2026-10-05T11:23:57+00:00", "hash": "3b6099fa1eb99ef2", "title_fa": "مرگ مشکوک در آزمایشگاه ایرکوتسک روسیه؛ آمریکا از احتمال بروز طاعون ریوی ابراز نگرانی کرد", "summary_fa": "دولت آمریکا می‌گوید گزارش‌ها درباره مرگ یک کارمند آزمایشگاه در منطقه ایرکوتسک روسیه بر اثر مورد مشکوک به طاعون ریوی را زیر نظر دارد. یک سخنگوی وزارت خارجه آمریکا روز ۱۲ مهر به رادیو اروپای آزاد/رادیو آزادی گفت واشینگتن از گزارش‌ها درباره «یک مورد مرگبار مشکوک به طاعون ریوی» در استان ایرکوتسک آگاه است و این موضوع را همراه با مرکز کنترل و پیشگیری از بیماری‌ها و دیگر نهادهای دولتی دنبال می‌کند. طاعون ریوی یکی از اشکال بیماری طاعون است که ریه‌ها را درگیر می‌کند و می‌تواند از طریق قطرات تنفسی و تماس نزدیک میان افراد منتقل شود. این بیماری در صورت درمان دیرهنگام می‌تواند مرگبار باشد، اما آنتی‌بیوتیک‌ها در صورت تجویز سریع معمولاً مؤثرند. وزارت خارجه آمریکا از مقام‌های روس خواسته است اطلاعا واهد کرد که مسیر فعلی به کجا منتهی می‌شود و چه چیزی می‌تواند آن را بشکند. مکس هوداک، بنیانگذار Science Corporation، به آینده ای که در آن فناوری به طور فزاینده ای مستقیماً با بدن انسان در تعامل است، فراتر از صفحه نمایش ها نگاه می کند، در حالی که Garrett Langley، مدیر عامل Flock Safety برای گفتگوی صریح در مورد"}, {"source": "TechCrunch AI", "title": "Can Safeworld convince people that GenAI robots won’t hurt them?", "link": "https://techcrunch.com/2026/10/05/can-safeworld-convince-people-that-gen-ai-robots-wont-hurt-them/", "summary": "Safeworld is building digital humans to make sure robots don't hurt the real ones.", "date_str": "2026-10-05T12:00:00+00:00", "hash": "dfe63c1b1da19a0a", "title_fa": "آیا Safeworld می‌تواند مردم را متقاعد کند که ربات‌های GenAI به آنها صدمه نمی‌زنند؟", "summary_fa": "Safeworld در حال ساخت انسان‌های دیجیتالی است تا مطمئن شود روبات‌ها به انسان‌های واقعی آسیب نرسانند. روند بزرگ در ربات ها، واگذاری کلیدها به یک مدل هوش مصنوعی مولد است، اما این مسئله با خود یک مشکل را به همراه دارد: اینکه معماری مانند الگوریتم های سنتی قابل پیش بینی نیست. چگونه می توانید مطمئن شوید که انسان نمای جدید شما ایمن است؟ دکتر دینگ ژائو، که آزمایشگاه هوش مصنوعی ایمن در دانشگاه کارنگی ملون را اداره می کند، تقریباً در تمام دوران حرفه ای خود روی این مشکل کار کرده است. او اکنون به همراه مدیر باسابقه استارتاپ کایل وانگ و مهندس یادگیری ماشین، سیمو راچیدی، شرکتی به نام Safeworld را تاسیس کرده است که قصد دارد آن را حل کند. چالش ایمنی که ما در مورد آن صحبت می کنیم ترکیبی از یک ارزیابی احتمالی هوش مصنوعی مولد واقعاً پیشرفته است - چگونه می توان ریسک یک سیستم احتمالی را پذیرفت؟ ژائو می گوید. بخش دوم که واقعا سخت است، بخش اعتماد است و برای استقرار یک ربات به هر دو نیاز دارید. Safeworld امروز با سرمایه گذاری بیش از 12 میلیون دلاری به رهبری Shine Capital و a16z Speedrun، با سرمایه گذاری اضافی از گروه Box، دانشگاه کارنگی ملون، Innovation Endeavors و SV Angel از مخفی کاری خارج می شود. جاناتان لای، شریک a16z Speedrun به TechCurnch گفت: زمان ساخت استاندارد ایمنی صنعتی اکنون در حالی است که روبات‌ها در حال طراحی و استقرار هستند. زمانی که روبات هایی در خانه داشته باشید که با بچه ها برخورد می کنند و باعث بروز حوادث ایمنی می شوند، خیلی دیر شده است. تخصص Safeworld ارزیابی یک سیستم کنترل رباتیک در شبیه سازی هایی است که با مدل های واقعی انسانی پر شده است. این شبیه به چالشی است که شرکت هایی مانند تسلا یا ویو با آن مواجه"}, {"source": "TechCrunch AI", "title": "Google froze its open source bug bounty program due to a ‘significant rise’ in AI submissions", "link": "https://techcrunch.com/2026/10/04/google-froze-its-open-source-bug-bounty-program-due-to-a-significant-rise-in-ai-submissions/", "summary": "AI slop seems to be overwhelming bug bounty programs.", "date_str": "2026-10-04T20:31:07+00:00", "hash": "ac168cd54a9c74ff", "title_fa": "گوگل برنامه پاداش باگ منبع باز خود را به دلیل «افزایش قابل توجه» ارسالی های هوش مصنوعی متوقف کرد.", "summary_fa": "گوگل با سرزنش افزایش قابل توجه ارسال‌های هوش مصنوعی، برنامه پاداش باگ منبع باز خود را تا سال آینده متوقف کرده است. سال گذشته، TechCrunch گزارش داد که کارشناسان امنیت سایبری هشدار می‌دهند که افت هوش مصنوعی خطری جدی برای برنامه‌های پاداش باگ دارد. به نظر می‌رسد این مشکلی است که با برنامه پاداش‌های آسیب‌پذیری نرم‌افزار منبع باز Google مواجه است، جایی که محققان برای یافتن آسیب‌پذیری‌ها در نرم‌افزار منبع باز شرکت پاداش دریافت کردند. در پست‌هایی در X و وب‌سایت برنامه، گوگل اعلام کرد که برنامه پاداش اشکال از اول اکتبر متوقف شد، با وعده ارائه «به‌روزرسانی» در سه ماهه اول سال 2027. طبق گفته Tom’s Hardware، مهندسان Google و نگهبانان منبع باز تحت تأثیر گزارش‌هایی قرار گرفتند که نامعتبر بودند یا حاوی توهم بودند. این شرکت گفت: «این توقف به دلیل افزایش قابل توجه ارسال‌های خودکار است که اکثریت قریب به اتفاق آن‌ها معتبر نیستند». در این میان، شرکت‌کنندگان تشویق می‌شوند تا سایر برنامه‌های پاداش باگ Google را در نظر بگیرند. 50% تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس خود را دریافت کنید و یک همکار، شریک یا همتای خود را با 50 درصد تخفیف بیاورید. با ایجاد ارتباطات، ایجاد شتاب و کشف آنچه در اکوسیستم استارت آپی در آینده وجود دارد، زمینه بیشتری را پوشش دهید. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها هسته TechCrunch هستند، بنابراین بهترین پوشش ما را هر هفته دریافت کنید. به متحرکان و تکان دهنده ها اطلاعاتی را که برای شروع روز خود نیاز دارند ارائه می دهد. با ارسال ایمیل خود، با شرایط و اعلامیه حریم خصوصی ما موافقت می کنید."}, {"source": "TechCrunch AI", "title": "Can ‘super intelligence’ and a non-binding safety pact solve AI’s image problem?", "link": "https://techcrunch.com/2026/10/04/can-super-intelligence-and-a-non-binding-safety-pact-solve-ais-image-problem/", "summary": "On Equity, we discussed the Trump administration's attempts to rebrand AI.", "date_str": "2026-10-04T20:08:34+00:00", "hash": "ff19976575df88e6", "title_fa": "آیا «هوش فوق العاده» و یک پیمان ایمنی غیر الزام آور می توانند مشکل تصویر هوش مصنوعی را حل کنند؟", "summary_fa": "در Equity، تلاش‌های دولت ترامپ برای تغییر نام تجاری هوش مصنوعی را مورد بحث قرار دادیم. پرزیدنت دونالد ترامپ این هفته میزبان بسیاری از بزرگ‌ترین نام‌های هوش مصنوعی بود – تا حدی برای اعلام اینکه دولت ایالات متحده دیگر آن را هوش مصنوعی نمی‌نامد. حالا این هوش فوق العاده است. در آخرین قسمت از پادکست سهام TechCrunch، کریستن کوروسک، شان اوکین، و من درباره انگیزه پشت جلسه و تأثیر آن بر صنعت هوش مصنوعی صحبت کردیم. همه ما نسبت به \"تعهد مشترک در مسئولیت های مرزی\" که مدیران امضا کردند بسیار بدبین بودیم، به خصوص که - همانطور که شان اشاره کرد - \"عمیقاً غیر الزام آور\" است، حداقل از منظر قانونی. (در عوض، ترامپ گفت که آن را «اخلاقی الزام‌آور» می‌داند.) کرستن پیشنهاد کرد که اهمیت واقعی نشست ممکن است به‌عنوان «تلاش تغییر نام تجاری حول هوش مصنوعی» باشد. (تلاشی که این آخر هفته با اعلام ترامپ در مورد یک نیروی ابر اطلاعاتی جدید ادامه یافت.) برای او، پیام بزرگ این بود: \"هوش مصنوعی ما را می کشد، ترسناک است، شغل ها را اشغال می کند - اما ابر هوش نه.\" برای پیش نمایش مکالمه ما که برای طولانی و وضوح ویرایش شده است، به خواندن ادامه دهید. آنتونی: رسماً به دستور رئیس جمهور ایالات متحده، دیگر هوش مصنوعی نیست، فوق هوش است. ما هفته گذشته در مورد این موضوع صحبت می کردیم، زیرا این چیزی است که [ترامپ] به آن اشاره کرده است - او اشاره ای نمی کند، او مدتی است [آن را] می گوید. اما اکنون به دستور اجرایی امضا شده است. اگر نماینده رسمی ایالات متحده هستید، قرار است بگویید هوش فوق العاده، نه هوش مصنوعی."}, {"source": "TechCrunch AI", "title": "Trump unveils his new Super Intelligence Force", "link": "https://techcrunch.com/2026/10/04/trump-unveils-his-new-super-intelligence-force/", "summary": "This new task force is Trump's latest response to the debate over AI safety.", "date_str": "2026-10-04T15:15:10+00:00", "hash": "f8076687b936ce64", "title_fa": "ترامپ از نیروی ابر اطلاعاتی جدید خود رونمایی کرد", "summary_fa": "این کارگروه جدید آخرین پاسخ ترامپ به بحث ایمنی هوش مصنوعی است. همانطور که وعده داده بود، رئیس جمهور دونالد ترامپ تشکیل یک نیروی اطلاعاتی جدید را اعلام کرد که به گفته او توسط جی کلیتون، مدیر اطلاعات ملی و سایر اعضای دولت او رهبری خواهد شد. ترامپ در پست صبح یکشنبه خود در شبکه اجتماعی Truth Social گفت: «نیروی ابر اطلاعاتی وظیفه هماهنگی تلاش‌های دولت فدرال را دارد تا اطمینان حاصل شود که آمریکا همچنان در زمینه ابراطلاعات جهانی که به گفته بسیاری بزرگ‌تر از انقلاب صنعتی و اینترنت است و از منافع و زندگی همه آمریکایی‌ها محافظت می‌کند، رهبری خواهد کرد». در ماه سپتامبر، ترامپ در پاسخ به بحث ایمنی هوش مصنوعی که رئیس‌جمهور تا حد زیادی آن را به‌عنوان حقه‌ای ایجاد شده توسط «دوموکرات‌های چپ رادیکال» رد کرد، گفت که با وجود این، یک نیروی هوش مصنوعی تشکیل می‌دهد و یک تزار هوش مصنوعی منصوب می‌کند («فقط افراد دارای ضریب هوشی بالا باید درخواست کنند!»). از آن زمان، ترامپ فرمان اجرایی را امضا کرد که به دنبال تغییر نام هوش مصنوعی به عنوان «فوق هوشی» بود، اصطلاحی که ظاهراً با برخی اشتباهات، توسط مدیران فناوری که این هفته برای امضای یک تعهد ایمنی غیر الزام آور در کاخ سفید گرد آمدند، پذیرفته شد. (این تعهد شامل یک اشتباه تایپی قابل توجه بود.) بنابراین طبیعی است که گروه کاری جدید ترامپ مطابق با این نام تجاری جدید نامگذاری شود. وال استریت ژورنال گزارش می‌دهد که کلایتون ریاست نیروی اطلاعاتی فوق‌العاده را بر عهده خواهد داشت و در واقع او را به پادشاه جدید AI/SI تبدیل می‌کند و اندرو فرگوسن، رئیس کمیسیون تجارت فدرال، امیل مایکل معاون وزیر جنگ در امور تحقیقات و مهندسی، و مدیر دفتر مدیریت پرسنل اسکات کوپور، به عنوان معاونان کار می‌کنند."}, {"source": "NYT Tech", "title": "The Humanoid Robot Future Has Arrived at a South Korean Park. Sort of.", "link": "https://www.nytimes.com/2026/10/05/world/asia/south-korea-ai-humanoid-robot-park.html", "summary": "I went to Galaxy Robot Park in Seoul to see how we might one day live with robots. It was part cutting-edge technology, part theatrics.", "date_str": "2026-10-05T12:57:32+00:00", "hash": "b50f87f7f27014f1", "title_fa": "آینده روبات انسان نما به پارکی در کره جنوبی رسید. به نوعی", "summary_fa": "من به پارک ربات گلکسی در سئول رفتم تا ببینم چگونه ممکن است روزی با روبات ها زندگی کنیم. بخشی از تکنولوژی پیشرفته و بخشی تئاتر بود. https://www.nytimes.com/2026/10/05/world/asia/south-korea-ai-humanoid-robot-park.html مقاله کامل را به اشتراک بگذارید 0 در حالی که ما در حال بررسی دسترسی شما هستیم، یک نمای پیش نمایش از این مقاله دارید. هنگامی که ما دسترسی را تأیید کردیم، محتوای کامل مقاله بارگیری می شود. گوش دادن · 8:32 دقیقه اشتراک‌گذاری مقاله کامل 0 توسط یان ژوانگ ربات برای من دست تکان می‌دهد. به طور آزمایشی به عقب دست تکان می دهم. با خیره شدن به چهره مشکی شیشه‌ای آن، نمی‌توانم کاملاً تشخیص دهم که آیا واقعاً به کاری که من انجام می‌دهم پاسخ می‌دهد یا فقط از دستورات کنترل‌کننده‌ای که چند فوت دورتر ایستاده است پیروی می‌کند. دستم را دراز می کنم و این ژست را منعکس می کند. وقتی می‌خواهم دستش را تکان دهم، بازویش تکان نمی‌خورد. من در گلکسی ربات پارک در کره جنوبی هستم و آینده را تجربه می کنم - یا حداقل، یک چشم انداز از آینده. تاکنون میلیون‌ها نفر ویدیوهای ویروسی از روبات‌های انسان‌نما را دیده‌اند. آنها در بهترین حالت خود رکوردهای جهانی دو و میدانی را شکستند و رقص های همزمان پیچیده را اجرا می کنند. در بدترین حالت، آن‌ها با سر به دیوارها می n convicted of manslaughter after an A.I.-generated video of his victim was played in court.", "date_str": "2026-10-04T21:04:44+00:00", "hash": "af337b230d5f3b05", "title_fa": "دادگاه حکم را پس از A.I. ویدیوی قربانی «بخشیدن» قاتلش پخش شد", "summary_fa": "دادگاه استیناف در آریزونا حکم زندان مردی را که به قتل عمد محکوم شده بود، پس از پخش ویدئویی که توسط هوش مصنوعی از قربانی وی در دادگاه پخش شد، لغو کرد."}, {"source": "The Guardian AI", "title": "Internet Watch Foundation reports huge rise in AI child sexual abuse material", "link": "https://www.theguardian.com/technology/2026/oct/05/internet-watch-foundation-huge-rise-ai-child-sexual-abuse-material", "summary": "Abuse material monitor says number of AI images assessed this year is already 40% higher than last year’s total AI-generated child sexual abuse material is proliferating online, with the amount of illegal material investigated this year already exceeding the total for 2025. Analysts at the Internet Watch Foundation have found more photorealistic child sexual abuse material in the first half of 2026 than for the whole of the prior year. The UK-based IWF, which monitors abuse material globally, said it had assessed 6,310 AI images that met the legal definition of child sexual abuse, 40% higher than last year’s total of more than 4,500. Continue reading...", "date_str": "2026-10-05T05:00:49+00:00", "hash": "ea548a6e4490f98f", "title_fa": "بنیاد دیده بان اینترنت از افزایش چشمگیر مواد سوء استفاده جنسی از کودکان با هوش مصنوعی خبر می دهد", "summary_fa": "ناظر مواد سوء استفاده می گوید که تعداد تصاویر هوش مصنوعی ارزیابی شده در سال جاری 40 درصد بیشتر از کل مطالب مربوط به سوء استفاده جنسی از کودکان در سال گذشته است که در سال گذشته در حال گسترش است، با میزان مواد غیرقانونی بررسی شده در سال جاری از کل سال 2025 بیشتر شده است. IWF مستقر در بریتانیا، که بر مواد سوء استفاده در سطح جهانی نظارت دارد، گفت 6310 تصویر هوش مصنوعی را ارزیابی کرده است که با تعریف قانونی سوء استفاده جنسی از کودکان مطابقت دارد که 40 درصد بیشتر از مجموع بیش از 4500 تصویر در سال گذشته است. به خواندن ادامه دهید... موارد سوء استفاده جنسی از کودکان توسط هوش مصنوعی چندین سال است که افزایش یافته است، به ویژه با افزایش شدید ویدیوها، اگرچه آخرین آمار IWF فقط به تصاویر ثابت اشاره دارد. اکثر تصاویری که توسط تحلیلگران مشاهده شد، مربوط به دختران و کودکان 7 تا 13 ساله بود. IWF گفت که این ارقام بر نیاز به مقررات قانونی جدید در مورد هوش مصنوعی تأکید می کند. دولت اندی برنهام نشان نداده است که لایحه جدیدی با تمرکز بر این فناوری قریب الوقوع است. کانیشکا نارایان، وزیر هوش مصنوعی بریتانیا، گفته است «هیچ چیز از نظر مقررات جدید خارج از میز نیست»، اما آزمون برای هر پیشنهاد قانونی این خواهد بود: «آیا مردم بریتانیا را امن‌تر می‌کند؟» هانا سویرسکی، رئیس سیاست گذاری در IWF، گفت که از درخواست های نمایندگان مجلس برای \"قانون الزام آور در مورد هوش مصنوعی\" برای وادار کردن شرکت ها به ساخت مدل های ایمن تر حمایت می کند. او گفت: \"بر عهده شرکت های فناوری است که ابزارهایی بسازند که نمی توان از آنها سوء استفاده کرد.\" این مشکل توسط فناوری ایجاد شده است و اگر شرکت‌ها ابزارهایی را که از نظر طراحی ایمن هستند نمی‌سازند."}, {"source": "The Guardian AI", "title": "OpenAI must explain action taken to stop AI hacking Australians’ private data, chair of federal inquiry says", "link": "https://www.theguardian.com/australia-news/2026/oct/06/openai-must-explain-action-taken-to-stop-ai-hacking-australians-private-data-chair-of-federal-inquiry-says", "summary": "Unions, employer groups, banks and industry experts will appear at the four-day hearings along with OpenAI, Anthropic, Microsoft and Google Get our new political email , free app or daily news podcast OpenAI must explain how they will stop their models from inappropriately accessing Australian data, the Labor chair of the parliament’s committee on artificial intelligence has warned, ahead of federal inquiry hearings which will grill the tech company alongside Anthropic, Microsoft and Google. Independent senator David Pocock is also demanding answers, saying OpenAI “still have a lot they need to answer” about their AI agent accessing Services Australia data on Medicare and the company’s “appalling” tardiness in notifying the federal government about the incident. Follow our Australia politics live blog for latest updates Continue reading...", "date_str": "2026-10-05T14:00:27+00:00", "hash": "debbc5a316e22998", "title_fa": "رئیس تحقیقات فدرال می گوید که OpenAI باید اقدامات انجام شده برای جلوگیری از هک اطلاعات خصوصی استرالیایی ها توسط هوش مصنوعی را توضیح دهد", "summary_fa": "اتحادیه‌ها، گروه‌های کارفرما، بانک‌ها و کارشناسان صنعت در جلسات استماع چهار روزه به همراه OpenAI، Anthropic، Microsoft و Google ظاهر خواهند شد. گوگل. سناتور مستقل دیوید پوکاک نیز خواستار پاسخ‌هایی است و می‌گوید OpenAI «هنوز باید پاسخ‌های زیادی در مورد دسترسی نماینده هوش مصنوعی به داده‌های Services Australia در مدیکر و تأخیر «هولناک» این شرکت در اطلاع‌رسانی به دولت فدرال درباره این حادثه داشته باشد. برای اطلاع از آخرین به روز رسانی ها، وبلاگ زنده سیاست استرالیا ما را دنبال کنید. به خواندن ادامه دهید... کمیته منتخب مشترک هوش مصنوعی در این هفته چهار روز جلسه استماع برگزار خواهد کرد که از شرکت های فناوری و همچنین اتحادیه ها، گروه های کارفرمایی، بانک ها و کارشناسان صنعت استماع خواهد کرد. جلسه سه‌شنبه شامل نمایندگانی از گروه‌های کپی رایت و هنرمندان می‌شود تا مسائل مربوط به دسترسی به داده‌ها برای آموزش مدل‌های هوش مصنوعی و همچنین شرکت پخش استرالیایی را که در ارسال خود نسبت به «آدم‌خواری» روزنامه‌نگاری هشدار داده و از شرکت‌های هوش مصنوعی خواسته است مشمول قوانین کپی‌رایت، افترا و حریم خصوصی مانند رسانه‌های خبری باشند، را بررسی کنند. مدیر ارشد استراتژی OpenAI، جیسون کوون، در کنار آدام کوهن، رئیس سیاست اقتصادی شرکت، و رهبر امنیت ملی آسیا-اقیانوسیه، پیتر آنستی، در جلسه استماع خواهد بود. OpenAI هفته گذشته به دلیل حادثه Services Australia و نحوه اطلاع رسانی به دولت عذرخواهی کرد و گفت که \"برای بهتر شدن کار می کند\"."}, {"source": "The Guardian AI", "title": "Accept ‘bad things’ in return for benefits of AI, says Sam Altman", "link": "https://www.theguardian.com/technology/2026/oct/05/sam-altman-open-ai-chatgpt-benefits-risks", "summary": "Boss of OpenAI calls for a regulatory light touch because of the ‘good stuff’ the technology can deliver Sam Altman says he believes the world should accept “bad things” happening with AI in exchange for the benefits of the technology. The chief executive of OpenAI cited hacks, scams and “other bad things that will happen” in an interview that sparked an instant backlash from critics of the big AI companies. His comments came after one of his company’s safety experts resigned , saying at the weekend that its “culture is broken”. Continue reading...", "date_str": "2026-10-05T13:27:45+00:00", "hash": "ceded78acdab1e38", "title_fa": "سم آلتمن می گوید در ازای مزایای هوش مصنوعی، «چیزهای بد» را بپذیرید", "summary_fa": "رئیس OpenAI به دلیل \"چیزهای خوبی\" که فناوری می تواند ارائه دهد، خواستار یک لمس سبک نظارتی است. مدیر اجرایی OpenAI در مصاحبه‌ای به هک‌ها، کلاهبرداری‌ها و «چیزهای بد دیگری که رخ خواهد داد» اشاره کرد که واکنش شدید منتقدان شرکت‌های بزرگ هوش مصنوعی را برانگیخت. اظهارات وی پس از استعفای یکی از کارشناسان ایمنی شرکتش مطرح شد و در آخر هفته گفت که \"فرهنگ آن شکسته است\". به خواندن ادامه دهید... در مصاحبه ای که روز دوشنبه منتشر شد، از آلتمن سوال شد که چگونه رویکرد OpenAI به ایمنی با رویکرد Anthropic که خواستار کاهش سرعت صنعت پس از ترک کار یکی از محققان خود شده است، پرسیده شد و هشدار داد که کارشناسان هوش مصنوعی معتقدند \"می تواند تا پایان دهه همه ما را بکشد\". آلتمن گفت: «من فکر می‌کنم نور روز زیاد است. یکی از تفاوت‌های ما و برخی از افراد سختگیرتر ایمنی هوش مصنوعی این است که ما معتقدیم که جهان باید اتفاقات بدی را برای مزایای این فناوری و افرادی که دارای آژانس هستند بپذیرد [برای استفاده گسترده از هوش مصنوعی]. من فکر می‌کنم موضع ملایم‌تر نظارتی که ما از آن دفاع می‌کنیم با پذیرش این واقعیت است که برخی از اتفاقات بد در حال رخ دادن است، زیرا جامعه متوجه وضعیت مقاومت می‌شود. او گفت: \"من معامله ای را انجام نمی دهم که بگویم مطمئن خواهیم شد که هیچ هک بزرگی وجود ندارد، هیچ سوء استفاده ای از این فناوری وجود ندارد، هیچ کلاهبرداری یا همه چیزهای بد دیگری رخ نخواهد داد، زیرا فکر می کنم که مردم کارهای فوق العاده - در حد بزرگی - بیشتر از چیزهای بد انجام خواهند داد.\" مصاحبه برای پادکست رمزگشایی Politico با واکنش شدید ران دیسانتیس، فرماندار فلوریدا مواجه شد. او گفت که \"هیچ تاس\" با این ایده \"تعدادی از الیگارش های فناوری باید این تصمیم را"}, {"source": "The Guardian AI", "title": "﻿The UK’s G20 presidency will push Andy Burnham to the centre of the global stage. What will he use it for? | Michael Jacobs", "link": "https://www.theguardian.com/commentisfree/2026/oct/05/uk-g20-presidency-andy-burnham-global-stage-technology-food-climate-economy", "summary": "This is a chance for the PM to advance his progressive agenda and tackle urgent issues such as AI regulation and climate action Among the many crucial decisions Andy Burnham has to make over the next few weeks, one has gone almost completely unremarked: what Britain’s priorities will be when it assumes the presidency of the G20 next year. Burnham has said he wants to concentrate on domestic policy. But with the world in turmoil, chairing the group of the world’s largest economies will be one of his most important responsibilities. Michael Jacobs is professor of political economy at the University of Sheffield and a former energy and climate change adviser to Gordon Brown when he was prime minister Continue reading...", "date_str": "2026-10-05T09:39:04+00:00", "hash": "dfa9b6845dd4898c", "title_fa": "ریاست گروه 20 بریتانیا، اندی برنهام را به مرکز صحنه جهانی سوق خواهد داد. او برای چه استفاده خواهد کرد؟ | مایکل جیکوبز", "summary_fa": "این فرصتی برای نخست‌وزیر است تا دستور کار مترقی خود را پیش ببرد و به مسائل فوری مانند مقررات هوش مصنوعی و اقدامات آب و هوایی بپردازد. برنهام گفته است که می خواهد روی سیاست داخلی تمرکز کند. اما با آشفتگی جهان، ریاست گروه بزرگ‌ترین اقتصادهای جهان یکی از مهم‌ترین مسئولیت‌های او خواهد بود. مایکل جیکوبز استاد اقتصاد سیاسی در دانشگاه شفیلد و مشاور سابق انرژی و تغییرات آب و هوای گوردون براون در زمان نخست وزیری او است. ادامه خواندن... در میان بسی 69", "title_fa": "تحرک TechCrunch: مهار در روباتاکسی", "summary_fa": "به TechCrunch Mobility، مرکز شما برای آینده حمل و نقل و اکنون، بیش از هر زمان دیگری، نقشی که هوش مصنوعی در آن ایفا می کند، خوش آمدید. در یک روز متوسط ​​در سانفرانسیسکو، ممکن است ده‌ها (صدها؟) رباتاکسی Waymo را ببینید که در سراسر شهر در حال چرخش هستند - و با کمی اختلال. اما، همانطور که TechCrunch گزارش کرده است، حوادث متعددی از روباتاکسی رخ داده است که مانع از ترافیک، رانندگی در صحنه های جرم و تداخل با اولین پاسخ دهندگان شده است. و نه فقط در منطقه خلیج. در برخی موارد، شرکت ها برای جابجایی رباتاکسی خود به اولین پاسخ دهندگان متکی هستند. این اختلالات در مراحل اولیه دوران روباتاکسی رخ می دهد. کالیفرنیا یک قانون جدید دارد که امیدوار است قبل از موج بعدی فرود رباتاکسی، از این مشکل پیشی بگیرد. لایحه 1246 سنا، که در این هفته توسط فرماندار گاوین نیوسام به تصویب رسید، مجموعه ای از قوانین جدید را برای دستگاه های AV تعیین می کند که برای بهبود ایمنی و زمان پاسخ به هنگام از کار افتادن یا تداخل با امدادگران اضطراری طراحی شده است. این قانون همچنین راه‌هایی را ایجاد می‌کند که اگر این شرکت‌ها را پاسخگو نمی‌دانند. شرکت‌های فناوری خودروهای خودمختار مانند تسلا، وایمو و زوکس باید زمانی که روباتاکسی آن‌ها مشکلی ایجاد می‌کند، اولین پاسخ‌دهندگان را با پشتیبانی محلی و روی زمین ارائه کنند و همچنین اگر روباتاکسی پلیس یا آتش‌نشان‌ها را برای بیش از 30 دقیقه مسدود کند، ممکن است با مجازات‌هایی روبرو شوند. این قانون همچنین می گوید که توسعه دهندگان AV فقط می توانند از رانندگان راه دور استفاده کنند که در ایالات متحده مستقر هستند و این رانندگان باید دارای گواهینامه ایالات متحده باشند. گواهینامه رانندگی آنها همچنین باید شهرها، شهرک‌ها و سایر حوزه‌های قضایی محلی را در مورد مکان و وضعیت وسایل نقلیه در"}, {"source": "Ars Technica", "title": "Explaining Hall-effect, TMR, and other new types of \"mechanical\" switches", "link": "https://arstechnica.com/gadgets/2026/10/the-hows-and-whys-of-non-mechanical-mechanical-keyboard-switches/", "summary": "The mechanical keyboard isn't always so mechanical anymore. Over the past six years, keyboards with optical, Hall-effect, and other \"contactless\" switches have become increasingly common, often going for higher prices than traditional mechanical keyboards, which already command a premium over basic membrane boards. In return, they promise some theoretical advantages, particularly for gamers. In daily use, though, the differences can be pretty subtle. So what exactly are you paying for? In this guide, we break down how the newest switches work, why contactless designs are becoming more popular, and where their advantages—and disadvantages—really matter. Read full article Comments", "date_str": "2026-10-05T11:00:41+00:00", "hash": "df7ea73b862c3ba5", "title_fa": "توضیح Hall-effect، TMR، و دیگر انواع جدید سوئیچ های \"مکانیکی\".", "summary_fa": "صفحه کلید مکانیکی دیگر همیشه آنقدر مکانیکی نیست. در طول شش سال گذشته، صفحه‌کلیدهایی با سوئیچ‌های نوری، جلوه هال و سایر سوئیچ‌های «بدون تماس» به طور فزاینده‌ای متداول شده‌اند و اغلب قیمت‌های بالاتری نسبت به صفحه‌کلیدهای مکانیکی سنتی دارند، که در حال حاضر نسبت به بردهای غشایی اصلی برتری دارند. در عوض، آنها مزایای نظری، به ویژه برای گیمرها را نوید می دهند. با این حال، در استفاده روزانه، تفاوت ها می تواند بسیار ظریف باشد. پس دقیقاً برای چه چیزی پرداخت می کنید؟ در این راهنما، نحوه عملکرد جدیدترین سوئیچ‌ها، اینکه چرا طرح‌های بدون تماس محبوب‌تر می‌شوند و مزایا و معایب آنها واقعاً در کجا مهم هستند را توضیح می‌دهیم. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش صفحه کلید مکانیکی دیگر همیشه آنقدرها مکانیکی نیست. ابتدا، بیایید مرور کنیم که وقتی کلیدی را با یک کلید مکانیکی سنتی در داخل فشار می دهید چه اتفاقی می افتد. همانطور که در نمودار یک سوئیچ Cherry MX Brown در زیر مشاهده می کنید، کلیدهای مکانیکی استاندارد دارای دو برگ فلزی هستند - در این مورد، \"نقطه متقاطع\" - که شکل متفاوتی دارند و بالای برگ بزرگتر از برگ کوچکتر خم شده است. هنگامی که یک کلید مکانیکی را فشار می دهید، ساقه پلاستیکی آن به سمت پایین به سمت PCB صفحه کلید حرکت می کند و یک فنر پیچیده شده در اطراف ساقه فشرده می شود. همانطور که دکمه را رها می کنید، فنر منبسط می شود و ساقه را مجبور می کند تا به موقعیت اولیه خود برگردد. هنگامی که یک سوئیچ در حالت استراحت است، یک تکه بیرون زده از ساقه پلاستیکی از تماس دو برگ کلید جلوگیری می کند. همانطور که ساقه به سمت پایین"}, {"source": "Ars Technica", "title": "New forensic evidence supports Egyptian \"retainer sacrifice\"", "link": "https://arstechnica.com/science/2026/10/new-forensice-evidence-supports-egyptian-retainer-sacrifice/", "summary": "Egyptologists have long debated whether the earliest pharoahs of the First Dynasty were buried with various servants and officials to serve them in the afterlife—a form of human sacrifice . But there is very little archaeological evidence available, given that many of the earliest Egyptian tombs were plundered and/or hastily excavated. A new paper published in the journal Frontiers in Environmental Archaeology reassesses a collection of skulls excavated from tombs in the 1920s and concludes that over one-third show evidence of blunt force trauma. This suggests that they may have been victims of so-called \"retainer sacrifice.\" Author Roselyn Campbell is a bioarchaeologist at Purdue University who has long been fascinated with the history of human sacrifice. \"I'm interested in how we as human beings decide which types of violence are okay and which are not, and how we even define violence,\" Campbell told Ars. \"It's very context specific. We have to be careful not to extend our own ideas about what violence is and how it's used into other cultures. With Egypt, we have such a long history of European and colonial archeology; they came in with very specific ideas about what this culture was. You really have to make an effort to contextualize the legacy data we have.\" Naturally she found the debate over whether ancient Egyptians practiced retainer sacrifice pertinent to her interests. \"People tend to fall into one of two camps,\" said Campbell. \"Either retainer sacrifice definitely happened, end of discussion, or it definitely didn't happen, end of discussion. But nobody's actually looked at the bones in a very long time.\" Forensic science has advanced considerably over the last century, so re-analysis could be useful. Complicating matters is the fact that older sets of remains are often incomplete and/or modified for preservation, destroying vital forensic information in the process. Read full article Comments", "date_str": "2026-10-05T04:00:52+00:00", "hash": "4675e6aeabb33be4", "title_fa": "شواهد جدید پزشکی قانونی از \"قربانی نگهدارنده\" مصری حمایت می کند", "summary_fa": "مصرشناسان مدتهاست بحث کرده اند که آیا اولین فراعنه سلسله اول با خدمتکاران و مقامات مختلف دفن شده اند تا در زندگی پس از مرگ به آنها خدمت کنند - نوعی قربانی انسانی. اما شواهد باستان شناسی بسیار کمی در دسترس است، با توجه به اینکه بسیاری از قدیمی ترین مقبره های مصر غارت شده و/یا با عجله حفاری شده اند. مقاله جدیدی که در مجله Frontiers in Environmental Archeology منتشر شده است، مجموعه ای از جمجمه های حفاری شده از مقبره ها در دهه 1920 را مجددا ارزیابی می کند و به این نتیجه می رسد که بیش از یک سوم شواهدی از ترومای نیروی بلانت را نشان می دهد. این نشان می دهد که آنها ممکن است قربانی به اصطلاح \"قربانی نگهدارنده\" شده باشند. نویسنده روزلین کمبل، زیست باستان‌شناس در دانشگاه پردو است که مدت‌ها مجذوب تاریخ فداکاری انسان‌ها شده است. کمپبل به Ars گفت: \"من به این موضوع علاقه مندم که چگونه ما به عنوان انسان تصمیم می گیریم که کدام نوع خشونت خوب است و کدام یک خوب نیست، و چگونه خشونت را تعریف می کنیم.\" ما باید مراقب باشیم که عقاید خود را در مورد خشونت و نحوه استفاده از آن به فرهنگ‌های دیگر تعمیم ندهیم. در مصر، ما سابقه طولانی در باستان‌شناسی اروپایی و استعماری داریم؛ آن‌ها با ایده‌های بسیار خاصی در مورد اینکه این فرهنگ چه بوده است، وارد شدند. شما واقعاً باید تلاش کنید تا داده‌های میراثی را که در اختیار داریم بسازید.\" طبیعتاً او بحث در مورد اینکه آیا مصریان باستان قربانی نگهدارنده را انجام می‌دادند مربوط به علایق او می‌دا ws/huawei-qualcomm-patent-deal-5g-ai", "summary": "Huawei and Qualcomm have agreed to a multi-year patent licensing deal covering 5G, AI, computing and networking, and announced the agreement today. “This agreement not only demonstrates the value of Huawei’s innovations, but also recognizes Qualcomm’s foundational contributions to modern communication technologies,” said Alan Fan, Huawei’s Chief Intellectual Property Officer. Under the deal, each company [ ] This story continues at The Next Web", "date_str": "2026-10-05T11:19:50+00:00", "hash": "b591fcc231cf5e61", "title_fa": "هواوی و کوالکام قرارداد ثبت اختراع مربوط به 5G، هوش مصنوعی و شبکه را امضا کردند", "summary_fa": "هواوی و کوالکام با یک قرارداد چند ساله مجوز اختراع که شامل 5G، هوش مصنوعی، محاسبات و شبکه می‌شود، توافق کردند و امروز این توافق را اعلام کردند. آلن فن، مدیر ارشد مالکیت معنوی هوآوی گفت: «این توافق نه تنها ارزش نوآوری‌های هواوی را نشان می‌دهد، بلکه کمک‌های اساسی کوالکام در فناوری‌های ارتباطی مدرن را نیز به رسمیت می‌شناسد». بر اساس این قرارداد، هر شرکت [ ] این داستان در The Next Web ادامه دارد. این اولین قرارداد مجوز بین این دو است که 5G را پوشش می دهد، و هیچ یک از شرکت ها شرایط مالی یا نرخ حق امتیاز را فاش نکردند. هواوی انتظار دارد این توافق پس از تکمیل، ارزش کل قراردادهای مجوز پتنت خود را به بیش از 6.9 میلیارد دلار افزایش دهد. این شرکت همچنین گفت که کسب و کار صدور مجوز آن از سال 2021 درآمد مثبتی داشته است. رابطه بین این دو شرکت در طول زمان تغییر کرده است. هوآوی اولین پرداخت مجوز خود را در سال 2001 به کوالکام انجام داد و اولین درآمد مجوز خود را یک دهه بعد از موتورولا دریافت کرد. جان هان، معاون اجرایی و مدیر کل صدور مجوز فناوری کوالکام، گفت: «این توافق مجدداً به رسمیت شناختن صنعت رهبری فناوری 5G کوالکام و موفقیت برنامه صدور مجوز SEP 5G کوالکام تأیید می‌کند. در همین حال، هواوی از سال 2019، زمانی که محدودیت‌های تجاری ایالات متحده شروع به محدود کردن دسترسی این شرکت به تراشه‌های پیشرفته و نرم‌افزارهای کلیدی کرد، هزینه‌های زیادی را صرف تحقیقات کرده است. این محدودیت ها به طور خودکار معاملات مجوز پتنت را مس ، عینک‌هایی با دوربین و ویژگی‌های هوش مصنوعی یا سایر فناوری‌های پوشیده شده روی بدن که می‌تواند همین کار را انجام دهد، بپوشاند. دولت اقلیت در اسرع وقت لایحه ای را به مجلس خواهد فرستاد. همچنین گروهی از کارشناسان را برای مشاوره در مورد قوانین پایدار برای چنین دستگاه هایی تشکیل خواهد داد. Torgeir Micaelsen حدود چهار هفته پیش وزیر دیجیتالی شدن نروژ شد. تلویزیون نروژی 2 گزارش داد که سلف او، کاریانه تونگ، از ممنوعیت حمایت نکرد. فشار روی عینک دوربین در سایر نقاط اروپا نیز در حال افزایش است. هفته گذشته، زنجیره عینک هلندی Hans Anders فروش عینک Ray-Ban"}, {"source": "The Next Web", "title": "Schneider Electric to buy US software maker PTC for $22.6bn in cash", "link": "https://thenextweb.com/news/schneider-electric-ptc-22-6bn", "summary": "Schneider Electric has agreed to buy PTC, a US maker of industrial design and engineering software, for about $22.6bn (€20.1bn) in cash. The French group announced the deal on Monday morning. The announcement came a day after the Financial Times first reported that the two companies were close to an agreement, at a price of about $20bn. Under [ ] This story continues at The Next Web", "date_str": "2026-10-05T09:22:44+00:00", "hash": "70e5524dd41cfbdc", "title_fa": "اشنایدر الکتریک شرکت آمریکایی PTC را به قیمت 22.6 میلیارد دلار به صورت نقدی خریداری می کند", "summary_fa": "اشنایدر الکتریک با خرید PTC، سازنده نرم افزارهای مهندسی و طراحی صنعتی در ایالات متحده، به مبلغ 22.6 میلیارد دلار (20.1 میلیارد یورو) به صورت نقدی موافقت کرده است. این گروه فرانسوی صبح دوشنبه این معامله را اعلام کرد. این اعلامیه یک روز پس از آن منتشر شد که روزنامه فایننشال تایمز برای اولین بار گزارش داد که این دو شرکت به توافق نزدیک شده اند و قیمت آن حدود 20 میلیارد دلار است. تحت [ ] این داستان در The Next Web ادامه دارد طبق شرایط نهایی، اشنایدر 205 دلار برای هر سهم PTC پرداخت خواهد کرد. این شرکت گفت که این مبلغ 42.3 درصد نسبت به قیمت بسته شدن PTC در جمعه 144.03 دلار است. با احتساب بدهی، ارزش این معامله PTC در حدود 23.7 میلیارد دلار است. بلومبرگ گزارش داد که این بزرگترین خرید اشنایدر تا به امروز است. بزرگترین معامله نرم افزاری قبلی آن خرید شرکت نرم افزار صنعتی انگلستان Aveva بود که در سال 2023 تکمیل شد و ارزش آن را حدود 9.5 میلیارد پوند برآورد کرد. PTC، مستقر در بوستون، نرم‌افزاری تولید می‌کند که تولیدکنندگان از آن برای طراحی، ساخت و خدمات محصولات خود استفاده می‌کنند. بیش از 30000 مشتری در سراسر جهان دارد. اولیویه بلوم، مدیر اجرایی اشنایدر گفت: «خرید PTC نشان‌دهنده یک گام مهم رو به جلو در جاه‌طلبی ما برای رهبری عصر جدید انرژی و هوش صنعتی است. هیئت مدیره PTC این معامله را تایید کرده و آن را به سهامداران توصیه خواهد کرد. شرکت‌ها انتظار دارند تا سه ماهه سوم سال 2027، پس از امضای تنظیم‌کننده‌ها و سهامداران PTC، آن را تکمیل کنند. اشنایدر انتظار دارد که این قرارداد تا سومین سال پس از بسته شدن آن، حدود 250 میلیون یورو در سال پس انداز کند. خرید به مجموعه معاملات نرم افزاری می افزاید. در ماه ژوئن، اشنایدر موافقت کرد"}, {"source": "MIT Tech Review", "title": "Bringing predictive analytics to the agentic AI era", "link": "https://www.technologyreview.com/2026/10/05/1143813/bringing-predictive-analytics-to-the-agentic-ai-era/", "summary": "In 2026, the question for enterprise AI is no longer whether predictive models can outperform statistical forecasts—that argument is settled. The big question now is how to enable predictive systems to act on their own conclusions without drifting from business intent. The frontier has moved from prediction to autonomous decision making, and the gap between leaders and laggards is widening accordingly. “Enterprises are done with a backward-looking point of view; they want to be more forward-thinking,” says Vishal Gupta, partner at research firm Everest Group. DOWNLOAD THE REPORT Intelligent analytics, powered by technologies like deep learning and generative AI, are making this possible. Real-time training allows AI to evolve continuously instead of waiting for quarterly refreshes. In addition, the data that newer predictive engines rely upon has expanded to encompass not just neat, numerical records but also messy, unstructured sources of insight-rich interactions. As a result, AI-powered analytics are moving enterprises from passive hindsight to pragmatic foresight. AI takes predictive analytics—a broad discipline that includes predictive modeling, data prep, analysis workflows, interpretation of results, and decision-making applications—to new heights. “In many ways I think the word ‘analytics’ is giving way to AI,” says Gupta. “Everything is becoming AI.” Download the report This content was produced by Insights, MIT Technology Review’s custom content arm, not its editorial staff. It was researched and written by humans, with any AI tools that may have been used limited to production processes under human oversight.", "date_str": "2026-10-05T13:29:32+00:00", "hash": "870e155cc41b4c40", "title_fa": "آوردن تجزیه و تحلیل پیش بینی کننده به عصر هوش مصنوعی", "summary_fa": "در سال 2026، سوال برای هوش مصنوعی سازمانی دیگر این نیست که آیا مدل‌های پیش‌بینی‌کننده می‌توانند از پیش‌بینی‌های آماری بهتر عمل کنند یا خیر، این بحث حل شده است. اکنون سوال بزرگ این است که چگونه می توان سیستم های پیش بینی را قادر ساخت تا بر اساس نتایج خود بدون منحرف شدن از قصد تجاری عمل کنند. مرز از پیش‌بینی به تصمیم‌گیری مستقل منتقل شده است و شکاف بین رهبران و عقب‌مانده‌ها بر همین اساس در حال افزایش است. ویشال گوپتا، شریک شرکت تحقیقاتی Everest Group می‌گوید: «شرکت‌ها با دیدگاهی به عقب‌نگر انجام می‌شوند؛ آن‌ها می‌خواهند آینده‌نگرتر باشند». دانلود گزارش تجزیه و تحلیل هوشمند، با فناوری هایی مانند یادگیری عمیق و هوش مصنوعی مولد، این امکان را فراهم می کند. آموزش در زمان واقعی به هوش مصنوعی اجازه می دهد تا به جای انتظار برای تجدید سه ماهه، به طور مداوم تکامل یابد. علاوه بر این، داده‌هایی که موتورهای پیش‌گوی جدیدتر به آن‌ها تکیه می‌کنند، گسترش یافته است تا نه تنها رکوردهای عددی منظم، بلکه منابع نامرتب و بدون ساختار تعاملات غنی از بینش را نیز در بر بگیرد. در نتیجه، تحلیل‌های مبتنی بر هوش مصنوعی، شرکت‌ها را از آینده نگری غیرفعال به آینده‌نگاری عمل‌گرایانه سوق می‌دهند. هوش مصنوعی تجزیه و تحلیل پیش‌بینی‌کننده - رشته گسترده‌ای که شامل مدل‌سازی پیش‌بینی‌کننده، آماده‌سازی داده‌ها، جریان‌های کاری تجزیه و تحلیل، تفسیر نتایج و برنامه‌های تصمیم‌گیری است- را به اوج می‌رساند. گوپتا می‌گوید: «از بسیاری جهات فکر می‌کنم کلمه «تحلیل» جای خود را به هوش مصنوعی داده است. \"همه چیز در حال تبدیل شدن به هوش مصنوعی است.\" دانلود گزارش این محتوا توسط Insights، بازوی محتوای سفارشی MIT Technology Review، نه هیات تحریریه آن تولید شده است. این توسط انسان ها تحقیق و نوشته شده است، با هر ابزار هوش مصنوعی که ممکن است محدود به فرآیندهای تولید تحت نظارت انسان باشد."}, {"source": "MIT Tech Review", "title": "The Download: AI’s popularity paradox and EmTech Future 2026", "link": "https://www.technologyreview.com/2026/10/05/1145711/the-download-ai-popularity-paradox-emtech-future-2026/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. People really hate AI, so why can’t they get enough? —Will Douglas Heaven Over the summer I talked to the CEO of Springboards, a startup building an LLM designed to come up with a wide variety of responses . He said something that’s been stuck in my head since: “We often say that we’re a self-loathing AI company. We don’t know if we really like what we’re doing.” My reply? “I guess that makes me a self-loathing AI journalist.” It was a joke! I love my job. But I do not love many of the things the technology I write about has become: warped by hype, steered by zealots, inescapable —and I’m far from alone. Around the world, a love/hate attitude toward AI is very much the vibe right now. Public sentiment is souring fast, with more people saying AI will have a negative impact than a positive one. At the same time, AI use is skyrocketing. So why do people hate AI but keep coming back for more? Here’s my theory . To stay up-to-date with the latest in AI, sign up to get The Algorithm, our weekly AI newsletter, in your inbox every Monday. EmTech Future 2026: when AI meets everything Last week, EmTech Future 2026 explored some of the biggest questions shaping technology right now: how AI is changing industries, where quantum is heading, what new energy systems could make possible, and how robotics are evolving. It also looked at what happens when these technologies start to converge. The full program is now available on demand. And today, we’re releasing two sessions exclusively to subscribers: a chat with Google Research’s Yossi Matias on how AI is reshaping biology, infrastructure, manufacturing and science, and a special panel with MIT Technology Review editors that takes you inside our newsroom. Watch the sessions and access the full EmTech Future 2026 program here . The must-reads I’ve combed the internet to find you today’s most fun/important/scary/fascinating stories about technology. 1 Trump has unveiled a “Super Intelligence Force” to oversee AI The group will coordinate US AI policy and industry engagement. ( NBC News ) + Trump named national intelligence chief Jay Clayton as its leader. ( NPR ) + Elon Musk says he will rename SpaceXAI to SpaceXSI. ( Reuters $) + Trump has doubled down on voluntary AI safeguards. ( Information $) + Who’s liable when AI agents go rogue? ( MIT Technology Review ) 2 Zelensky asked Trump t", "date_str": "2026-10-05T12:10:00+00:00", "hash": "d75c91b069368fc2", "title_fa": "دانلود: پارادوکس محبوبیت هوش مصنوعی و EmTech Future 2026", "summary_fa": "در طول تابستان با مدیرعامل Springboards صحبت کردم، استارت‌آپی که یک LLM طراحی کرده بود تا پاسخ‌های متنوعی ارائه دهد. او چیزی گفت که از آن زمان در ذهن من گیر کرده است: \"ما اغلب می گوییم که یک شرکت هوش مصنوعی از خود متنفریم. نمی دانیم که واقعاً کاری را که انجام می دهیم دوست داریم یا خیر.\" پاسخ من؟ حدس می‌زنم این باعث می‌شود که من یک روزنامه‌نگار هوش مصنوعی بدبین باشم.» شوخی بود! من عاشق کارم هستم. اما من خیلی از چیزهایی را دوست ندارم که فناوری که در مورد آنها می نویسم تبدیل شده است: منحرف شده توسط هیاهو، هدایت شده توسط متعصبان، اجتناب ناپذیر - و من به دور از تنهایی هستم. در سرتاسر جهان، نگرش عشق/ نفرت نسبت به هوش مصنوعی در حال حاضر بسیار رایج است. احساسات عمومی به سرعت در حال تشدید است، به طوری که افراد بیشتری می گویند هوش مصنوعی تأثیر منفی خواهد داشت تا مثبت. در عین حال، استفاده از هوش مصنوعی در حال افزایش است. پس چرا مردم از هوش مصنوعی متنفرند اما به دنبال موارد بیشتر هستند؟ در اینجا نظریه من است. هفته گذشته، EmTech Future 2026 برخی از بزرگ‌ترین پرسش‌های شکل‌دهنده فناوری در حال حاضر را بررسی کرد: هوش مصنوعی چگونه صنایع را تغییر می‌دهد، کوانتومی به کجا می‌رود، چه سیستم‌های انرژی جدیدی می‌توانند امکان‌پذیر کنند، و چگونه رباتیک در حال تکامل است. همچنین بررسی شد که وقتی این فناوری ها شروع به همگرایی می کنند چه اتفاقی می افتد. برنامه کامل اکنون در صورت تقاضا در دسترس است. و امروز، دو جلسه را به طور انحصاری برای مشترکین منتشر می‌کنیم: گپ با یوسی ماتیاس، پژوهشگر گوگل در مورد اینکه چگونه هوش مصنوعی در حال تغییر شکل زیست‌شناسی، زیرساخت‌ها، تولید و علم است، و یک پنل ویژه با ویراستاران MIT Technology Review که شما را به"}, {"source": "MIT Tech Review", "title": "People really hate AI, so why can’t they get enough?", "link": "https://www.technologyreview.com/2026/10/05/1145682/people-really-hate-ai-so-why-cant-they-get-enough/", "summary": "Over the summer I talked to the CEO of Springboards, a startup building an LLM that’s designed to come up with a wider variety of responses than its mainstream rivals do. At the start of the call, he said something that’s been stuck in my head since: “We often say that we’re a self-loathing AI company. We don’t know if we really like what we’re doing.” “I guess that makes me a self-loathing AI journalist,” I replied. It was a joke! I love my job. But I do not love many of the things the technology I write about has become: warped by hype , steered by zealots , inescapable . The CEO of Springboards and I are far from alone. Around the world, a love/hate attitude toward AI is very much the vibe right now. On the one hand, public feelings are souring fast. According to the Pew Research Center, more adults in the US think AI will have a negative impact on them personally, and on society in general, than expect a positive one. The pessimism is strongest among the young. More than half of people worldwide say that AI products and services make them nervous, according to a report from Stanford University . In a Gallup poll in May, 71% of US adults said they would oppose construction of a new AI data center in their area, far more than the 53% who said they would oppose a new nuclear power plant. And in an NBC poll in March, AI was less popular than ICE. Yet the number of people using AI is still skyrocketing. ChatGPT hit a billion monthly users in May, according to the market analysis firm Sensor Tower. Google DeepMind’s Gemini is close behind, logging 950 million users in July. According to Pew, half of US adults now say they use a chatbot , more than twice the number who said they did in 2023. One in four people say they do so every day. And it’s a global habit: More than a third of adults across all 38 OECD countries (a group of the world’s wealthiest democracies) report having used generative AI tools in the last three months . All these surveys paint a picture of two contradictory truths: A lot of people really do not like AI and a lot of people cannot get enough of it. What’s going on? It’s possible that these are two distinct groups, but I doubt it. The numbers don’t add up unless the Venn diagram is on its way to being a circle. It’s also possible that the more people use AI, the more negative their opinions about it will be. There’s at least a correlation to back this up : The Global North, where adoption is highest, skews pessimistic. In the Global Sout", "date_str": "2026-10-05T08:00:00+00:00", "hash": "1dc86b7352899751", "title_fa": "مردم واقعاً از هوش مصنوعی متنفرند، پس چرا نمی توانند به اندازه کافی سیر شوند؟", "summary_fa": "در طول تابستان با مدیر عامل اسپرینگ بردز صحبت کردم، استارت آپی که یک LLM ایجاد می کند که برای ارائه پاسخ های متنوع تری نسبت به رقبای اصلی خود طراحی شده است. در ابتدای تماس، او چیزی گفت که از آن زمان در ذهن من گیر کرده بود: \"ما اغلب می گوییم که ما یک شرکت هوش مصنوعی هستیم که از خود متنفر هستیم. نمی دانیم که آیا واقعاً کاری را که انجام می دهیم دوست داریم یا خیر.\" من پاسخ دادم: «حدس می‌زنم این باعث می‌شود که من یک روزنامه‌نگار هوش مصنوعی بدبین باشم. شوخی بود! من عاشق کارم هستم. اما من بسیاری از چیزهایی را دوست ندارم که فناوری که در مورد آنها می نویسم تبدیل شده است: منحرف شده توسط هیاهو، هدایت شده توسط متعصبان، اجتناب ناپذیر. من و مدیرعامل Springboards تنها نیستیم. در سرتاسر جهان، نگرش عشق/ نفرت نسبت به هوش مصنوعی در حال حاضر بسیار رایج است. از یک طرف، احساسات عمومی به سرعت در حال تشدید است. به گفته مرکز تحقیقاتی پیو، بزرگسالان در ایالات متحده بیشتر فکر می کنند که هوش مصنوعی تأثیر منفی بر شخص آنها و به طور کلی بر جامعه خواهد گذاشت، تا اینکه انتظار مثبت داشته باشد. بدبینی در میان جوانان شدیدتر است. بر اساس گزارشی از دانشگاه استنفورد، بیش از نیمی از مردم در سراسر جهان می گویند که محصولات و خدمات هوش مصنوعی آنها را عصبی می کند. در نظرسنجی گالوپ در ماه مه، 71 درصد از بزرگسالان آمریکایی گفتند که با ساخت یک مرکز داده جدید هوش مصنوعی در منطقه خود مخالف هستند، بسیار بیشتر از 53 درصدی که گفته بودند با یک نیروگاه هسته ای جدید مخالف هستند. و در نظرسنجی NBC در ماه مارس، هوش مصنوعی نسبت به ICE محبوبیت کمتری داشت. با این حال، تعداد افرادی که از هوش مصنوعی استفاده می"}, {"source": "MIT Tech Review", "title": "EmTech Future 2026: When AI Meets Everything", "link": "https://www.technologyreview.com/2026/10/05/1145413/emtech-future-2026-when-ai-meets-everything/", "summary": "Yossi Matias, Vice President Head of Google Research, explores how AI is beginning to reshape biology, infrastructure, manufacturing, and science, and why its greatest impact may come when it intersects with other fields. Step inside the newsroom with our MIT Technology Review editors for sharp analysis and unpublished insights from the team that researches and reports on emerging tech daily. There’s much more to discover These are just two sessions from EmTech Future 2026 . Across three days, EmTech Future explored some of the most important questions shaping technology right now: how AI is impacting industries, where quantum is heading, what new energy systems could make possible, how robotics are evolving, and what challenges and opportunities arise when these technologies start to converge. Hear the ideas, insights, and perspectives you missed at EmTech Future 2026. The full program is now available on demand, giving you access to all the conversations and sessions from the event, including: Qua ntum in context Hartmut Neven, founder and lead at Google Quantum AI, explores how quantum is advancing alongside other frontiers and why its significance may lie not only in what it can do on its own, but in how it begins to interact with the systems around it. Energy Systems for the Future Evelyn Wang, VP for energy climate at MIT, explores how energy, computing, infrastructure, and climate technologies are increasingly interconnected, and what these converging systems could mean for the future of industry and society. Rethinking our relationship with AI –Cory Doctorow, bestselling author and award-winning writer, explores how AI is changing the way we work and think. As an MIT Technology Review subscriber, you’ll get a 20% discount , meaning you can access the full EmTech Future 2026 program for just $596. ACCESS FULL PROGRAM", "date_str": "2026-10-05T04:00:00+00:00", "hash": "d0eb7816ee979e58", "title_fa": "EmTech Future 2026: وقتی هوش مصنوعی همه چیز را ملاقات می کند", "summary_fa": "یوسی ماتیاس، معاون رئیس بخش تحقیقات گوگل، به بررسی این موضوع می‌پردازد که چگونه هوش مصنوعی شروع به تغییر شکل زیست‌شناسی، زیرساخت‌ها، تولید و علم می‌کند و چرا بیشترین تأثیر آن ممکن است زمانی رخ دهد که با سایر زمینه‌ها تلاقی می‌کند. برای تجزیه و تحلیل دقیق و بینش های منتشر نشده تیمی که روزانه درباره فناوری های نوظهور تحقیق و گزارش می کند، با سردبیران مرور فناوری MIT ما وارد اتاق خبر شوید. چیزهای بیشتری برای کشف وجود دارد اینها فقط
