ذا خود را گسترش می دهد، وارد بازاری می شود که شرکت کارگزاری Bernstein تخمین می زند سالانه 18 تا 20 درصد رشد می کند. با این حال، تحویل آنلاین هنوز هم چیزی بیش از 15 درصد از صنعت گسترده تر خدمات غذایی هند را تشکیل می دهد. Zomato که متعلق به Eternal است و Swiggy با هم"}, {"source": "VentureBeat Tech", "title": "fal launches FLUX 3 Max, claiming 22× faster AI video generation than Seedance 2.5", "link": "https://venturebeat.com/technology/fal-launches-flux-3-max-claiming-22-faster-ai-video-generation-than-seedance-2-5", "summary": "Popular enterprise AI multimedia creation platform fal.ai today launched FLUX 3 Max, a video model developed with German AI model lab Black Forest Labs that aims to make high-quality AI footage practical to generate and revise in seconds. Read more", "date_str": "2026-10-19T22:29:58+00:00", "hash": "fe3bb9338d23483a", "title_fa": "fal FLUX 3 Max را راه‌اندازی می‌کند و ادعا می‌کند که تولید ویدئو با هوش مصنوعی 22× سریع‌تر از Seedance 2.5 است.", "summary_fa": "پلتفرم ایجاد چندرسانه‌ای چندرسانه‌ای سازمانی fal.ai امروز FLUX 3 Max را راه‌اندازی کرد، یک مدل ویدیویی که با آزمایشگاه مدل‌های هوش مصنوعی آلمانی آزمایشگاه‌های جنگل سیاه توسعه یافته است و هدف آن این است که فیلم‌های هوش مصنوعی با کیفیت بالا را برای تولید و بازبینی در چند ثانیه عملی کند. ادامه مطلب"}, {"source": "VentureBeat Tech", "title": "MiniMax's new M3.1 Flash beats DeepSeek and Opus 5 on a key business benchmark at lower cost — but with a high hallucination rate", "link": "https://venturebeat.com/technology/minimaxs-new-m3-1-flash-beats-deepseek-and-opus-5-on-a-key-business-benchmark-at-lower-cost-but-with-a-high-hallucination-rate", "summary": "Chinese artificial intelligence company MiniMax has released M3.1 Flash, a new AI model designed to handle complex enterprise workflows, software development and computer-use tasks at dramatically lower costs than many competing frontier models — including the popular Chinese rival DeepSeek during peak hours. Read more", "date_str": "2026-10-19T19:38:49+00:00", "hash": "6678979e08987c8d", "title_fa": "فلش M3.1 جدید MiniMax در معیارهای تجاری کلیدی با هزینه کمتر - اما با نرخ توهم بالا - DeepSeek و Opus 5 را شکست می دهد.", "summary_fa": "شرکت هوش مصنوعی چینی MiniMax M3.1 Flash را منتشر کرده است، یک مدل هوش مصنوعی جدید که برای رسیدگی به گردش‌های کاری پیچیده سازمانی، توسعه نرم‌افزار و وظایف استفاده از رایانه با هزینه‌های بسیار پایین‌تری نسبت به بسیاری از مدل‌های مرزی رقیب - از جمله رقیب چینی محبوب DeepSeek در ساعات اوج مصرف، طراحی شده است. ادامه مطلب"}, {"source": "Ars Technica", "title": "Meta Muse exposes users' personal and business secrets when they share conversations", "link": "https://arstechnica.com/security/2026/10/meta-muse-exposes-users-personal-and-business-secrets-when-they-share-conversations/", "summary": "Muse, the new general-purpose AI agent from Meta, can expose sensitive information when users share conversations through Web links, researchers reported Monday. Like many online services, Muse allows users to share searches, conversations, images, and similar content with other people. Such share features usually involve clicking an option to create a unique URL that anyone can use to load a page hosting the content. To keep potentially sensitive information from being accessible to unintended people, the URLs typically contain a long sequence of text that can’t be easily guessed. A single query is all that's required Muse, which Meta CEO Mark Zuckerberg said last month was “built from the ground up for privacy and security,” seems to take the same precautions. But a central design decision for constructing URLs has made the links easy to discover. As a result, researchers from security firm Claroc said they were able to enumerate 6,800 links Muse users created for sharing conversations with others. After opening a few hundred of them, the researchers found information that was clearly not intended to be publicly available, including: Read full article Comments", "date_str": "2026-10-20T12:33:13+00:00", "hash": "cacb9d6dc06f6383", "title_fa": "Meta Muse اسرار شخصی و تجاری کاربران را هنگام به اشتراک گذاشتن مکالمات فاش می کند", "summary_fa": "محققان روز دوشنبه گزارش دادند که Muse، عامل هوش مصنوعی همه منظوره جدید متا، می‌تواند اطلاعات حساس را هنگامی که کاربران مکالمه‌ها را از طریق پیوندهای وب به اشتراک می‌گذارند، افشا کند. مانند بسیاری از خدمات آنلاین، Muse به کاربران اجازه می دهد تا جستجوها، گفتگوها، تصاویر و محتوای مشابه را با افراد دیگر به اشتراک بگذارند. چنین ویژگی‌های اشتراک‌گذاری معمولاً شامل کلیک کردن روی گزینه‌ای برای ایجاد یک URL منحصربه‌فرد است که هر کسی می‌تواند از آن برای بارگذاری صفحه میزبان محتوا استفاده کند. برای اینکه اطلاعات حساس بالقوه در دسترس افراد ناخواسته قرار نگیرد، URL ها معمولاً حاوی یک توالی طولانی از متن هستند که به راحتی قابل حدس زدن نیست. به نظر می‌رسد Muse، که مدیرعامل متا، مارک زاکربرگ، ماه گذشته گفت «از پایه برای حفظ حریم خصوصی و امنیت ساخته شده است»، تنها چیزی است که مورد نیاز است. اما یک تصمیم طراحی مرکزی برای ساخت URL ها، کشف پیوندها را آسان کرده است. در نتیجه، محققان شرکت امنیتی Claroc گفتند که توانستند 6800 پیوندی را که کاربران Muse برای اشتراک‌گذاری مکالمات با دیگران ایجاد کرده‌اند، برشمارند. پس از باز کردن چند صد مورد، محققان اطلاعاتی را یافتند که مشخصاً قرار نبود در دسترس عموم قرار گیرد، از جمله: خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش Muse، عامل جدید هوش مصنوعی همه منظوره از Meta، می‌تواند اطلاعات حساس را از طریق مکالمه تحقیقاتی کاربران در دوشنبه به اشتراک بگذارد. محققان نوشتند: «اگر از قبل از ما می‌پرسیدید، حدس می‌زدیم که جمع‌آوری این موارد به تلاش واقعی نیاز دارد. \"یک پرس و جو طول کشید.\""}, {"source": "Ars Technica", "title": "Visiting Slate’s first showroom as its $25,000 electric truck nears production", "link": "https://arstechnica.com/cars/2026/10/visiting-slates-first-showroom-as-its-25000-electric-truck-nears-production/", "summary": "As I sat in the cab of the pickup truck and manually rolled down the windows, I closed my eyes and, for the briefest moment, flashed back to opening the windows on a cold, winter day in my dad’s 1975 Ford Ranger to let more cigarette smoke escape. I opened my eyes and looked through the windshield at a wall in the Slate Customer Experience Center studded with bright color chips. Last week, in a former Tesla store staffed by some former Tesla employees, Slate opened its first showroom. Located in the Fulton Market District just northwest of the Chicago Loop, the Slate Experience Center is a place for would-be buyers to poke around a prototype, check out customization options, buy some Slate merch, and even pre-order a new Slate Truck with a $300 deposit. Designed for the American obsession with pickup trucks, the Slate Truck is a bare-bones electric pickup truck retailing for $24,950 . It sports plastic panels, a minimalist interior design sensibility, actual window winders, and a projected range of 205 miles. Ars got to go for a ride in a Slate Truck over the summer , but we haven't had a chance to shop for one. So I stopped by the Slate Experience Center so I could, er, experience the Slate. Read full article Comments", "date_str": "2026-10-20T11:00:16+00:00", "hash": "493b4c6ed212eeb6", "title_fa": "بازدید از اولین نمایشگاه Slate با نزدیک شدن به تولید کامیون الکتریکی 25000 دلاری آن", "summary_fa": "همانطور که در کابین وانت نشسته بودم و به صورت دستی شیشه ها را پایین می زدم، چشمانم را بستم و برای کوتاه ترین لحظه، دوباره به باز کردن پنجره ها در یک روز سرد و زمستانی در فورد رنجر پدرم 1975 بازگشتم تا دود سیگار بیشتری خارج شود. چشمانم را باز کردم و از پشت شیشه جلو به دیواری در مرکز تجربه مشتریان اسلیت که با تراشه های رنگ روشن پوشیده شده بود نگاه کردم. هفته گذشته، Slate اولین نمایشگاه خود را در یک فروشگاه سابق تسلا با کارکنان سابق تسلا افتتاح کرد. مرکز تجربه Slate که در منطقه بازار Fulton درست در شمال غربی حلقه شیکاگو واقع شده است، مکانی برای خریداران احتمالی است که می‌توانند نمونه اولیه را بررسی کنند، گزینه‌های سفارشی‌سازی را بررسی کنند، برخی از کالاهای Slate را بخرند، و حتی یک کامیون جدید Slate را با مبلغ 300 دلار پیش‌سفارش کنند. Slate Truck که برای علاقه آمریکایی ها به کامیون های وانت طراحی شده است، یک وانت بار الکتریکی بدون استخوان است که به قیمت 24950 دلار به فروش می رسد. دارای پانل‌های پلاستیکی، حساسیت طراحی داخلی مینیمالیستی، پیچ‌شکن‌های واقعی پنجره‌ها و برد پیش‌بینی‌شده ۲۰۵ مایلی است. Ars باید در تابستان سوار یک کامیون اسلیت شود، اما ما فرصتی برای خرید آن نداشتیم. بنابراین من در مرکز تجربه اسلیت توقف کردم تا بتوانم اسلیت را تجربه کنم. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش در حالی که در کابین وانت وانت نشسته بودم و به صورت دستی شیشه ها را پایین می آوردم، چشمانم را بستم و برای کوتاه ترین لحظه به باز کردن پنجره ها در یک روز سرد و زمستانی رها شدم. فرار دود سیگار چشمانم را باز کردم و"}, {"source": "Ars Technica", "title": "Japan launches mission to bring home a piece of the Martian moon Phobos", "link": "https://arstechnica.com/space/2026/10/japan-launches-mission-to-bring-home-a-piece-of-the-martian-moon-phobos/", "summary": "Japan launched a $578 million mission Monday on a five-year expedition to land on the largest moon of Mars and retrieve samples for return to Earth, a daring international project that could yield new insights into the formation of the Solar System. The robotic Martian Moons eXploration mission, known as MMX, lifted off at 3:41 pm EDT Monday (4:41 am Japan Standard Time Tuesday) from Tanegashima Space Center in southern Japan. The MMX spacecraft rode into orbit atop a 207-foot-tall (63-meter) H3 rocket, Japan's flagship launch vehicle. The rocket assigned to MMX debuted a new souped-up configuration with four strap-on solid rocket boosters, full-throttle main engines, and an extended payload shroud to accommodate the demands of Japan's heaviest and most ambitious interplanetary mission to date. Read full article Comments", "date_str": "2026-10-20T05:59:56+00:00", "hash": "0d597377c3dac09c", "title_fa": "ژاپن ماموریتی را برای آوردن قطعه ای از قمر مریخی فوبوس به خانه انجام می دهد", "summary_fa": "ژاپن یک ماموریت 578 میلیون دلاری را روز دوشنبه در یک سفر 5 ساله برای فرود بر روی بزرگترین قمر مریخ و بازیابی نمونه هایی برای بازگشت به زمین، یک پروژه بین المللی جسورانه که می تواند بینش جدیدی در مورد شکل گیری منظومه شمسی ارائه دهد، آغاز کرد. مأموریت اکتشافی رباتیک مریخ ماه‌ها، معروف به MMX، در ساعت 3:41 بعدازظهر روز دوشنبه (4:41 صبح سه‌شنبه به وقت استاندارد ژاپن) از مرکز فضایی تانگاشیما در جنوب ژاپن به پرواز درآمد. فضاپیمای MMX بر فراز یک موشک H3 با ارتفاع 207 فوت (63 متر) که پرچمدار پرتاب ژاپنی بود، وارد مدار شد. راکتی که به MMX اختصاص داده شده بود، پیکربندی جدیدی را با چهار تقویت کننده موشک جامد با تسمه، موتورهای اصلی تمام دریچه گاز و یک پوشش محموله گسترده برای پاسخگویی به خواسته های سنگین ترین و جاه طلبانه ترین ماموریت بین سیاره ای ژاپن تا به امروز ارائه کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید کمینه کردن برای پیمایش ژاپن روز دوشنبه ماموریتی 578 میلیون دلاری را برای فرود بر روی بزرگترین قمر مریخ و بازیابی نمونه‌هایی برای بازگشت به زمین راه‌اندازی کرد، پروژه‌ای بین‌المللی جسورانه و جدید که می‌تواند منجر به سیستم بزرگ شود. مرحله فوقانی موشک فضاپیمای MMX را به حداکثر سرعت بیش از 24000 مایل در ساعت شتاب داد که به اندازه کافی سریع بود تا از کشش گرانشی زمین برای سفر 10 ماهه به مریخ رهایی یابد. فضاپیمای تقریباً 9900 پوندی (4.5 متری تن) - دو سوم جرم آن از پیشران تشکیل شده است - حدود 71 دقیقه پس از بلند شدن از موشک H3 جدا شد. هیروشی یاماکاوا، رئیس آژانس اکتشافات هوافضای ژاپن (JAXA) این پرتاب را موفقیت آمیز اعلام کرد. یاماکاوا گفت: «یک"}, {"source": "Ars Technica", "title": "Pennsylvania issues alert on congenital measles—something US hasn't seen for decades", "link": "https://arstechnica.com/health/2026/10/pennsylvania-issues-alert-on-congenital-measles-something-us-hasnt-seen-for-decades/", "summary": "Pennsylvania's health department issued a health alert Monday as cases of measles in pregnancy and, in turn, cases of congenital measles have continued to increase. Before the current outbreak—which continues to rage across the state—congenital measles cases hadn't been seen in decades, the department noted in its advisory. The alert included detailed clinical guidance for managing measles exposures and cases during pregnancy as well as cases in newborns. Many doctors have never seen such cases in their careers given the decades of successful use of the measles, mumps, and rubella (MMR) vaccine. But now, with vaccination rates slipping nationwide, the highly infectious virus is better able to get footholds in communities and spread rapidly through under-vaccinated pockets, as is happening in Pennsylvania. As of October 19, Pennsylvania had reported 1,286 measles cases this year across 42 counties. Of those, 247 have been hospitalized, and six people have reportedly died (though the latest reported death is still pending an investigation by the state health department before it is added to the state tally). Read full article Comments", "date_str": "2026-10-19T22:44:26+00:00", "hash": "212e0df5ffa30259", "title_fa": "پنسیلوانیا در مورد سرخک مادرزادی هشدار می دهد - چیزی که ایالات متحده برای دهه ها ندیده است", "summary_fa": "وزارت بهداشت پنسیلوانیا روز دوشنبه هشدار بهداشتی صادر کرد زیرا موارد سرخک در بارداری و به نوبه خود موارد سرخک مادرزادی همچنان در حال افزایش است. این وزارتخانه در توصیه‌های خود خاطرنشان کرد، قبل از شیوع فعلی - که همچنان در سراسر ایالت به شدت ادامه دارد - موارد سرخک مادرزادی در دهه‌ها مشاهده نشده بود. این هشدار شامل راهنمایی بالینی دقیق برای مدیریت قرار گرفتن در معرض سرخک و موارد در دوران بارداری و همچنین موارد در نوزادان بود. بسیاری از پزشکان با توجه به چندین دهه استفاده موفق از واکسن سرخک، اوریون و سرخجه (MMR) هرگز چنین مواردی را در حرفه خود ندیده اند. اما اکنون، با کاهش نرخ واکسیناسیون در سراسر کشور، ویروس بسیار عفونی بهتر می تواند در جوامع جای پای خود را داشته باشد و به سرعت از طریق جیب های واکسینه نشده پخش شود، همانطور که در پنسیلوانیا اتفاق می افتد. تا 19 اکتبر، پنسیلوانیا 1286 مورد سرخک را در سال جاری در 42 شهرستان گزارش کرده است. از این تعداد، 247 نفر در بیمارستان بستری شده‌اند و شش نفر بر اساس گزارش‌ها جان خود را از دست داده‌اند (اگرچه آخرین مرگ گزارش‌شده هنوز در انتظار بررسی توسط اداره بهداشت دولتی قبل از اضافه شدن به آمار ایالتی است). مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید اداره بهداشت پنسیلوانیا روز دوشنبه هشدار بهداشتی صادر کرد زیرا موارد سرخک در بارداری و به نوبه خود موارد سرخک مادرزادی همچنان در حال افزایش است. این وزارتخانه در توصیه‌های خود خاطرنشان کرد، قبل از شیوع فعلی - که همچنان در سراسر ایالت به شدت ادامه دارد - موارد سرخک مادرزادی در دهه‌ها مشاهده نشده بود."}, {"source": "Ars Technica", "title": "Russian spacecraft maneuvers in \"extreme proximity\" to satellite used by Ukraine", "link": "https://arstechnica.com/space/2026/10/russian-spacecraft-maneuvers-in-extreme-proximity-to-satellite-used-by-ukraine/", "summary": "A Russian military satellite maneuvered in \"extreme proximity\" of a commercial Earth-imaging satellite in recent days in the first known example an unsanctioned rendezvous in low-Earth orbit, according to orbital intelligence company LeoLabs. The Russian spacecraft, Kosmos 2612, \"conducted a deliberate series of maneuvers toward ICEYE-X36, a US-operated commercial imaging satellite,\" LeoLabs said. \"Kosmos 2612 closed from hundreds of kilometers away to extreme proximity to ICEYE-X36. It then maneuvered around ICEYE-X36, remained nearby for an extended period, and then began moving away.\" US military officials and independent analysts have tracked Kosmos 2612 since its April launch on a Soyuz rocket from a spaceport in northern Russia. Within weeks, it became apparent that at least four of the six satellites from that launch were stalking ICEYE-X36 after they adjusted orbits to line up with the orbit of the ICEYE spacecraft. Read full article Comments", "date_str": "2026-10-19T20:54:17+00:00", "hash": "aa03f483074b2e62", "title_fa": "مانور فضاپیمای روسیه در \"نزدیک شدید\" به ماهواره مورد استفاده اوکراین", "summary_fa": "به گفته شرکت اطلاعات مداری LeoLabs، یک ماهواره نظامی روسی در روزهای اخیر در \"نزدیک شدید\" یک ماهواره تجاری تصویربرداری از زمین در اولین نمونه شناخته شده قرار ملاقات بدون مجوز در مدار پایین زمین مانور داد. LeoLabs گفت: فضاپیمای روسی، Kosmos 2612، \"یک سری مانورهای عمدی را به سمت ICEYE-X36، یک ماهواره تصویربرداری تجاری تحت اداره ایالات متحده انجام داد.\" «Kosmos 2612 از صدها کیلومتر دورتر تا نزدیکی شدید به ICEYE-X36 بسته شد. سپس در اطراف ICEYE-X36 مانور داد، برای مدت طولانی در این نزدیکی ماند و سپس شروع به دور شدن کرد.\" مقامات نظامی ایالات متحده و تحلیلگران مستقل، Kosmos 2612 را از زمان پرتاب آن در ماه آوریل بر روی موشک سایوز از یک فرودگاه فضایی در شمال روسیه ردیابی کرده اند. در عرض چند هفته، مشخص شد که حداقل چهار ماهواره از شش ماهواره از آن پرتاب با ماهواره های YE-X یا 6 بیتی که پس از آن پرتاب شده بودند، در حال تعدیل بودند. فضاپیمای ICEYE خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای ناوبری به حداقل برسانید یک ماهواره نظامی روسی که در روزهای اخیر در \"نزدیک شدید\" یک ماهواره تجاری تصویربرداری از زمین مانور داده است، در اولین نمونه شناخته شده یک قرار ملاقات غیرمجاز در کمپین اطلاعاتی Learth orbit orbit. وضعیت تا هفته گذشته ثابت بود، زمانی که Kosmos 2612 به سرعت به سمت ICEYE-X36 حرکت کرد. LeoLabs گفت که تا روز جمعه، Kosmos 2612 ایستگاه را در فاصله 2 تا 3 کیلومتری قبل از تغییر موقعیت در جلو و پشت ماهواره ICEYE نگه داشته بود. آدام مارش، معاون راه‌حل‌های فنی LeoLabs، گفت: ماهواره‌ها در آخر هفته در فاصله 500 متری (1640 فوت) از یکدیگر قرار داشتند و «احتمالاً کمی از آن نزدیک‌تر بودند»."}, {"source": "Ars Technica", "title": "Accused OpenAI spy had folder called “Saudi Gov Docs,” FBI says", "link": "https://arstechnica.com/tech-policy/2026/10/accused-openai-spy-had-folder-called-saudi-gov-docs-fbi-says/", "summary": "On Monday, a court granted the US government's request to deny release of a former OpenAI engineer accused of bugging a top-secret conference room to steal the frontier lab’s secrets. In a court filing Sunday, US attorney Craig Missakian argued that Abdulrahman Alfozan must continue to be detained while the US makes its case that Alfozan brazenly spied on OpenAI, either for his own personal business gain or to benefit the Kingdom of Saudi Arabia. Evidence showed that Alfozan had been chatting with a member of the KSA royal family on WhatsApp, while pursuing opportunities to permanently move back to Saudi Arabia during the country's biggest AI push yet, the government argued. Shortly before his arrest, the FBI found he accessed a folder called \"Saudi Gov Docs\" on his iPhone, where he also allegedly stored photos of a second bug he planted in the offices. Read full article Comments", "date_str": "2026-10-19T20:21:53+00:00", "hash": "072d31a4ddcdb972", "title_fa": "اف‌بی‌آی می‌گوید که جاسوس OpenAI پوشه‌ای به نام «اسناد دولت عربستان سعودی» داشت", "summary_fa": "روز دوشنبه، دادگاهی با درخواست دولت آمریکا مبنی بر رد آزادی یک مهندس سابق OpenAI متهم به دستکاری یک اتاق کنفرانس فوق سری برای سرقت اسرار آزمایشگاه مرزی موافقت کرد. کریگ میساکیان، وکیل ایالات متحده در یک پرونده در دادگاه روز یکشنبه استدلال کرد که عبدالرحمن آلفوزان باید همچنان در بازداشت بماند تا زمانی که ایالات متحده ادعا می کند که آلفوزان گستاخانه از OpenAI جاسوسی کرده است، چه برای منافع تجاری شخصی خود یا به نفع پادشاهی عربستان سعودی. دولت استدلال می‌کند که شواهد نشان می‌دهد که آلفوزان با یکی از اعضای خانواده سلطنتی عربستان سعودی در واتس‌اپ چت می‌کرده است، در حالی که به دنبال فرصت‌هایی برای بازگشت دائمی به عربستان سعودی در طول بزرگترین فشار هوش مصنوعی این کشور تاکنون بوده است. اندکی قبل از دستگیری، FBI متوجه شد که او به پوشه‌ای به نام «Saudi Gov Docs» در آیفون خود دسترسی داشته است، جایی که گفته می‌شود عکس‌های یک اشکال دوم را که در دفاتر کار گذاشته بود، ذخیره کرده بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش روز دوشنبه، دادگاهی درخواست دولت ایالات متحده برای رد آزادی یک مهندس سابق OpenAI را که متهم به ایجاد اشکال در اتاق کنفرانس فوق سری برای سرقت اسرار آزمایشگاه مرزی بود، پذیرفت. میساکیان ادعا کرد که با وجود شواهد بسیار علیه او، آلفوزان - یک تبعه عربستان سعودی و مقیم قانونی دائمی ایالات متحده - با حمایت ظاهراً بی پایان دولت سعودی یک خطر فرار است. میساکیان گفت که اف بی آی آلفوزان را چند روز قبل از اینکه بتواند با هواپیما بپرد دستگیر کرد. وکیل آمریکایی خاطرنشان کرد که آلفوزان قبلاً برای او، همسرش و نوزادشان بلیط یک طرفه به ریاض، پایتخت عربستان سعودی"}, {"source": "Ars Technica", "title": "Batteries help reduce emissions, but how do we reduce their emissions?", "link": "https://arstechnica.com/science/2026/10/batteries-have-a-small-carbon-footprint-we-can-make-it-smaller/", "summary": "The first order of business for the energy transition is electrifying applications like vehicles and heating and making sure that the electricity that powers them is made using renewables. But once the dominant slices of the emissions pie have shrunk, other categories with less potential to reduce emissions become important. A new study led by Haiwei Zhou at the University of Melbourne focused on the emissions associated with making lithium-ion batteries, which many parts of the energy transition rely on. Those emissions aren’t zero, so as we use more and more batteries, that number will grow. Right now, the researchers estimate that these emissions only account for 0.18 percent of annual greenhouse gas releases, but they could increase by a factor of 10 or more by 2050. Avoiding production There are a number of ways to reduce the emissions required to make a battery. Some elements used in various lithium-ion battery chemistries are more energy-intensive to mine and refine than others. The battery manufacturing process involves many steps that could be made more energy-efficient. And then there’s recycling, which can put battery materials back into the loop while requiring much less energy than mining. Read full article Comments", "date_str": "2026-10-19T20:03:55+00:00", "hash": "1c39b8784c3eb7b5", "title_fa": "باتری ها به کاهش انتشار گازهای گلخانه ای کمک می کنند، اما چگونه انتشار آنها را کاهش دهیم؟", "summary_fa": "اولین کار برای انتقال انرژی برق رسانی به کاربردهایی مانند وسایل نقلیه و گرمایش و اطمینان از اینکه برقی که آنها را تغذیه می کند با استفاده از انرژی های تجدیدپذیر ساخته می شود. اما به محض اینکه بخش‌های غالب پای انتشار کاهش یافت، دیگر دسته‌هایی که پتانسیل کمتری برای کاهش انتشار دارند مهم می‌شوند. یک مطالعه جدید به رهبری Haiwei Zhou در دانشگاه ملبورن بر انتشارات مرتبط با ساخت باتری‌های لیتیوم یون متمرکز شد که بسیاری از بخش‌های انتقال انرژی بر آن متکی هستند. این آلاینده ها صفر نیستند، بنابراین با استفاده از باتری های بیشتر و بیشتر، این تعداد افزایش می یابد. در حال حاضر، محققان تخمین می زنند که این انتشار تنها 0.18 درصد از انتشار سالانه گازهای گلخانه ای را تشکیل می دهد، اما می تواند تا سال 2050 تا 10 برابر یا بیشتر افزایش یابد. اجتناب از تولید راه های مختلفی برای کاهش انتشار گازهای گلخانه ای مورد نیاز برای ساخت باتری وجود دارد. برخی از عناصر مورد استفاده در مواد شیمیایی مختلف باتری لیتیوم یونی نسبت به سایرین برای استخراج و پالایش انرژی بیشتری دارند. فرآیند تولید باتری شامل مراحل زیادی است که می‌توان آن‌ها را از نظر انرژی کارآمدتر کرد. و سپس بازیافت وجود دارد، که می تواند مواد باتری را دوباره به حلقه بازگرداند در حالی که به انرژی بسیار کمتری نسبت به استخراج نیاز دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری اولین کار برای انتقال انرژی برق رسانی به برنامه هایی مانند وسایل نقلیه و گرمایش و اطمینان از اینکه برقی که آنها را تغذیه می کند با استفاده از انرژی های تجدید پذیر ساخته می شود. اما به محض اینکه بخش‌های غالب پای انتشار کاهش یافت،"}, {"source": "Ars Technica", "title": "PSA: Patch your Plex media server before someone hacks it", "link": "https://arstechnica.com/security/2026/10/recently-fixed-plex-media-vulnerabilities-are-being-exploited-to-install-malware/", "summary": "Recently fixed vulnerabilities in the Plex Media Server are under active exploitation in attacks that, when successful, install malware, including cryptominers and residential proxy apps, a researcher said. Plex fixed four vulnerabilities at the start of last month. Three weeks later, published CVE designations revealed five vulnerabilities, with one of them carrying a severity rating of 8.6 out of 10. A researcher last week revealed an exploit that chained four of them together to achieve remote code execution of the device running a vulnerable Plex version. The researcher named the chain \"Plex2Shell.\" Complex exploit chain The new details allowed a separate researcher to create a honeypot that could track attempts in the wild to exploit the vulnerability chain. Within a day, the researcher began seeing active scanning of the simulated Plex server and eventually successful attempts to infect devices. So far, successful attacks are installing two payloads. One is a cryptominer, which uses the device to mine cryptocurrency and deposit it into a wallet controlled by the attacker. The other payload is residential proxy software, which allows people to anonymize their Internet activity (much of it illegal) by connecting to the infected box and then using it to send the user’s traffic to a final destination. Read full article Comments", "date_str": "2026-10-19T19:39:19+00:00", "hash": "ebe4bd4b0323f657", "title_fa": "PSA: سرور رسانه Plex خود را قبل از هک کردن آن وصله کنید", "summary_fa": "یک محقق گفت، آسیب‌پذیری‌هایی که اخیراً در سرور Plex Media Server برطرف شده‌اند در حملاتی که در صورت موفقیت آمیز بودن، بدافزارها از جمله cryptominers و برنامه‌های پراکسی مسکونی را نصب می‌کنند، مورد بهره‌برداری فعال هستند. Plex چهار آسیب پذیری را در ابتدای ماه گذشته برطرف کرد. سه هفته بعد، نام‌گذاری‌های منتشر شده CVE پنج آسیب‌پذیری را نشان داد که یکی از آنها دارای رتبه‌بندی 8.6 از 10 بود. یک محقق هفته گذشته اکسپلویتی را فاش کرد که چهار مورد از آنها را به هم زنجیر کرد تا به اجرای کد از راه دور دستگاهی که نسخه آسیب پذیر Plex را اجرا می کند، دست یابد. محقق نام این زنجیره را «Plex2Shell» گذاشت. زنجیره بهره برداری پیچیده جزئیات جدید به یک محقق جداگانه اجازه می دهد تا یک هانی پات ایجاد کند که می تواند تلاش ها را در طبیعت برای بهره برداری از زنجیره آسیب پذیری ردیابی کند. در عرض یک روز، محقق شروع به مشاهده اسکن فعال سرور Plex شبیه سازی شده و در نهایت تلاش های موفقیت آمیز برای آلوده کردن دستگاه ها کرد. تا کنون، حملات موفق، دو بار را نصب می کنند. یکی یک cryptominer است که از دستگاه برای استخراج ارز دیجیتال و واریز آن به کیف پولی که توسط مهاجم کنترل می شود استفاده می کند. بار دیگر، نرم‌افزار پراکسی مسکونی است که به افراد امکان می‌دهد با اتصال به جعبه آلوده و سپس استفاده از آن برای ارسال ترافیک کاربر به مقصد نهایی، فعالیت اینترنتی خود را (که بیشتر آن غیرقانونی است) ناشناس کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش آسیب پذیری های اخیراً رفع شده در سرور رسانه Plex تحت سوء استفاده فعال در حملاتی هستند که"}, {"source": "Ars Technica", "title": "Startup taps underwater volcano as energy source in \"proof point\" test", "link": "https://arstechnica.com/science/2026/10/startup-taps-underwater-volcano-as-energy-source-in-proof-point-test/", "summary": "The world’s first demonstration of a subsea geothermal power plant has taken place near an active underwater volcano almost a mile below the ocean surface. It generated less than 10 seconds of net-positive electricity but showed the technical feasibility of tapping another form of renewable energy underwater. The three-week test deployment of the 3-ton prototype power plant took place at the Axial Seamount in the northeast Pacific Ocean in September. Endurance Energy, the Seattle-based startup behind the effort, aims to eventually commercialize subsea geothermal power for Pacific island nations and other customers looking for alternatives to importing expensive fossil fuels. “The deep ocean gives us unlimited cold seawater for cooling, and its weight keeps the system and the well pressurized, so our plants can be compact,” said Andrew Redd , founder and CEO of Endurance Energy, in an email to Ars. Read full article Comments", "date_str": "2026-10-19T19:27:24+00:00", "hash": "14df4fe3850a882e", "title_fa": "راه اندازی از آتشفشان زیر آب به عنوان منبع انرژی در تست \"نقطه اثبات\" استفاده می کند", "summary_fa": "اولین نمایش نیروگاه زمین گرمایی زیر دریا در جهان در نزدیکی یک آتشفشان فعال زیر آب تقریباً یک مایل زیر سطح اقیانوس انجام شد. کمتر از 10 ثانیه برق خالص مثبت تولید کرد اما امکان فنی بهره برداری از شکل دیگری از انرژی تجدیدپذیر در زیر آب را نشان داد. استقرار آزمایشی سه تنی نمونه اولیه نیروگاه 3 تنی در Axial Seamount در شمال شرقی اقیانوس آرام در ماه سپتامبر انجام شد. Endurance Energy، استارت‌آپ مستقر در سیاتل که پشت این تلاش است، در نهایت قصد دارد انرژی زمین گرمایی زیر دریا را برای کشورهای جزیره‌ای اقیانوس آرام و سایر مشتریانی که به دنبال جایگزین‌هایی برای واردات سوخت‌های فسیلی گران قیمت هستند تجاری‌سازی کند. اندرو رد، بنیانگذار و مدیر عامل Endurance Energy، در ایمیلی به Ars گفت: \"اقیانوس اعماق آب دریای سرد نامحدودی را برای خنک کردن به ما می دهد و وزن آن باعث می شود که سیستم و به خوبی تحت فشار قرار گیرند، بنابراین گیاهان ما می توانند فشرده باشند.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید برای ناوبری به حداقل برسانید اولین نمایش در جهان از یک نیروگاه زمین گرمایی زیر دریا در نزدیکی یک آتشفشان فعال زیر آب تقریباً یک مایل زیر سطح اقیانوس انجام شد. کمتر از 10 ثانیه برق خالص مثبت تولید کرد اما امکان فنی بهره برداری از شکل دیگری از انرژی تجدیدپذیر در زیر آب را نشان داد. اما تلاش‌ها برای بهره‌برداری از نیروی زمین گرمایی در بستر دریا با چالش‌های مختلفی از پروژه‌های زمین گرمایی زمینی مواجه است که می‌تواند هزینه‌های نصب و عملیات بیشتری را نیز افزایش دهد. بنابراین انرژی استقامتی باید عملیات مداوم زیر آب را نشان دهد و همچنین ثابت کند که این رویکرد می تواند مقرون به صرفه"}, {"source": "Ars Technica", "title": "ReactOS reaches major milestone with NTFS install support", "link": "https://arstechnica.com/information-technology/2026/10/reactos-reaches-major-milestone-with-ntfs-install-support/", "summary": "Open source Windows alternative ReactOS has reached a major milestone: The operating system can now be installed directly onto an NTFS drive partition. As reported by Phoronix , the move to NTFS clears a long-standing hurdle for the project and brings it one step closer to finally reaching beta. Prior to this latest announcement, ReactOS required users to keep a FAT32 partition for installations. A proprietary Microsoft-developed filesystem, NTFS can trace its roots back through the Windows NT family lineage starting in 1993 with Windows NT 3.1. The variant introduced with Windows XP in 2001 remains the standard used by most Windows systems today. With ReactOS's stated goal of reaching binary compatibility with Windows Server 2003, being confined to FAT32 partitions was a practical barrier to clear on the way to reproducing the Windows environment. However, users looking to hop off the Windows train shouldn't be grabbing their bags just yet. ReactOS wrote that the new driver still \"lacks caching (which causes inferior performance), journaling and security support.\" So while the new driver is here, even the most intrepid of OS tinkerers should tread carefully. The ReactOS team warned in its announcement on X that there are still \"potentially undiscovered bugs.\" Read full article Comments", "date_str": "2026-10-19T18:30:56+00:00", "hash": "85f4033d0cad66a7", "title_fa": "ReactOS با پشتیبانی از نصب NTFS به نقطه عطف مهمی می رسد", "summary_fa": "ReactOS جایگزین ویندوز منبع باز به یک نقطه عطف بزرگ رسیده است: سیستم عامل اکنون می تواند مستقیماً روی یک پارتیشن درایو NTFS نصب شود. همانطور که توسط فورونیکس گزارش شده است، حرکت به سمت NTFS مانع طولانی مدت این پروژه را برطرف می کند و آن را یک قدم به رسیدن به مرحله بتا نزدیکتر می کند. قبل از آخرین اعلامیه، ReactOS کاربران را ملزم می‌کرد تا یک پارتیشن FAT32 را برای نصب نگه دارند. یک سیستم فایل اختصاصی توسعه یافته توسط مایکروسافت، NTFS می تواند ریشه های خود را از طریق خانواده ویندوز NT که در سال 1993 با ویندوز NT 3.1 شروع شد، ردیابی کند. نسخه ای که با ویندوز XP در سال 2001 معرفی شد، استانداردی است که امروزه توسط اکثر سیستم های ویندوز استفاده می شود. با هدف اعلام شده ReactOS برای دستیابی به سازگاری باینری با ویندوز سرور 2003، محدود شدن به پارتیشن‌های FAT32 مانعی عملی برای پاکسازی در راه تولید مجدد محیط ویندوز بود. با این حال، کاربرانی که به دنبال خروج از قطار ویندوز هستند، نباید هنوز کیف خود را بردارند. ReactOS نوشت که درایور جدید هنوز \"از حافظه پنهان (که باعث عملکرد ضعیف می شود)، ژورنال و پشتیبانی امنیتی ندارد.\" بنابراین، در حالی که درایور جدید اینجاست، حتی بی‌باک‌ترین قلاب‌زنان سیستم‌عامل نیز باید با دقت قدم بردارند. تیم ReactOS در اطلاعیه خود در مورد X هشدار داد که هنوز \"اشکالات بالقوه کشف نشده\" وجود دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش جایگزین ویندوز منبع باز ReactOS به نقطه عطفی بزرگ رسیده است: سیستم عامل اکنون می تواند مستقیماً روی یک پارتیشن درایو NTFS نصب شود. همانطور که توسط فورونیکس گزارش شده است، حرکت به سمت NTFS مانع"}, {"source": "Ars Technica", "title": "AI game clones are making indie developers afraid to show their work", "link": "https://arstechnica.com/gaming/2026/10/ai-game-clones-are-making-indie-developers-afraid-to-show-their-work/", "summary": "Since its earliest days, the video game industry has been built on developers creating clones of competing games , with varying levels of originality and varying levels of enforcement from game platforms . Now, though, AI coding tools are making that cloning process so efficient that many developers are getting extremely cautious about sharing their early work too widely. Developer Alliance Arts highlighted this trend over the weekend, delaying the launch of a planned public demo for its demon-themed Russian Roulette drinking game Drunken Goddess Reflux , which had been set to go live with today's launch of Steam Next Fest . In a post on social media Friday evening , the Alliance Arts team wrote that, in addition to concerns about managing streaming restrictions, \"we're concerned that the demo's content could be used to quickly imitate or replicate the game's presentation and gameplay with AI or other tools and that such works could be released before our launch.\" Read full article Comments", "date_str": "2026-10-19T16:59:22+00:00", "hash": "98f83173b10ec201", "title_fa": "کلون‌های بازی‌های هوش مصنوعی باعث می‌شوند توسعه‌دهندگان مستقل از نمایش آثار خود هراس داشته باشند", "summary_fa": "صنعت بازی‌های ویدیویی از همان روزهای اولیه خود بر پایه توسعه‌دهندگانی ساخته شده است که کلون‌هایی از بازی‌های رقیب را ایجاد می‌کنند، با سطوح مختلف اصالت و سطوح مختلف اجرا از پلتفرم‌های بازی. با این حال، اکنون ابزارهای کدنویسی هوش مصنوعی این فرآیند شبیه‌سازی را چنان کارآمد می‌کنند که بسیاری از توسعه‌دهندگان در مورد اشتراک‌گذاری کارهای اولیه خود بسیار محتاط هستند. Developer Alliance Arts این روند را در آخر هفته برجسته کرد و راه‌اندازی یک نسخه نمایشی عمومی برنامه‌ریزی‌شده برای بازی نوشیدنی رولت روسی مستانه رفلاکس با تم شیطانی خود را به تاخیر انداخت، که قرار بود با راه‌اندازی امروز Steam Next Fest پخش شود. در پستی در شبکه‌های اجتماعی عصر جمعه، تیم Alliance Arts نوشت که علاوه بر نگرانی‌ها در مورد مدیریت محدودیت‌های استریم، \"ما نگران این هستیم که محتوای دمو برای تقلید یا تکرار سریع ارائه و گیم پلی بازی با هوش مصنوعی یا ابزارهای دیگر مورد استفاده قرار گیرد و چنین آثاری ممکن است قبل از راه‌اندازی ما منتشر شوند.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش از اولین روزهای خود، صنعت بازی های ویدیویی بر پایه توسعه دهندگانی ساخته شده است که کلون هایی از بازی های رقیب را ایجاد می کنند، با سطوح مختلف اصالت و سطوح مختلف اجرا از پلتفرم های بازی. با این حال، اکنون ابزارهای کدنویسی هوش مصنوعی این فرآیند شبیه‌سازی را چنان کارآمد می‌کنند که بسیاری از توسعه‌دهندگان در مورد اشتراک‌گذاری کارهای اولیه خود بسیار محتاط هستند. در عوض، توسعه‌دهنده اکنون قصد دارد نسخه نمایشی را فقط در «جلسات بسته» با افرادی که با قوانین مربوط به ارسال و پخش بازی موافق هستند به اشتراک بگذارد."}, {"source": "Ars Technica", "title": "Florida DMV hacked after police dept insecurely stored login info", "link": "https://arstechnica.com/tech-policy/2026/10/huge-dmv-data-breach-impacted-current-and-former-florida-residents/", "summary": "The Florida Department of Highway Safety and Motor Vehicles (FLHSMV) has begun notifying victims impacted by a recent data breach of driver’s license and motor vehicle data, but not everyone whose information was stolen will receive an alert. In a notice posted Friday, FLHSMV confirmed that it took “immediate steps” after discovering that “a malicious actor accessed certain department records on September 4, 2026, using compromised credentials.” There’s “no evidence” that data has yet been misused, the department said, but law enforcement “determined the information potentially affected includes driver license and motor vehicle data, to include document images, and other personal information.” FLHSMV is sending out letters to everyone affected, offering victims one year of credit monitoring from Sontiq, Inc. However, the state acknowledged that it may not have current contact information for many former Florida residents whose data was still being stored. Those potential victims can confirm if their data was stolen by emailing FLHSMV at customerinquiry@flhsmv.gov , officials said. Read full article Comments", "date_str": "2026-10-19T16:38:13+00:00", "hash": "dbf9f95d742057b3", "title_fa": "فلوریدا DMV پس از اینکه پلیس اطلاعات ورود به سیستم را به طور ناامن ذخیره کرد هک شد", "summary_fa": "دپارتمان ایمنی بزرگراه و وسایل نقلیه موتوری فلوریدا (FLHSMV) شروع به اطلاع رسانی به قربانیان تحت تأثیر نقض اطلاعات اخیر در گواهینامه رانندگی و داده های وسایل نقلیه موتوری کرده است، اما همه افرادی که اطلاعات آنها به سرقت رفته است هشدار دریافت نمی کنند. در اطلاعیه‌ای که روز جمعه منتشر شد، FLHSMV تأیید کرد که پس از کشف اینکه «یک بازیگر مخرب در 4 سپتامبر 2026 با استفاده از اعتبارنامه‌های به خطر افتاده به برخی از سوابق بخش دسترسی پیدا کرده است، اقدامات فوری انجام داده است». این وزارتخانه گفت \"هیچ مدرکی\" مبنی بر سوء استفاده از داده ها وجود ندارد، اما مجریان قانون \"تعیین کردند که اطلاعاتی که بالقوه تحت تاثیر قرار می گیرند شامل اطلاعات گواهینامه رانندگی و وسایل نقلیه موتوری، شامل تصاویر اسناد و سایر اطلاعات شخصی است.\" FLHSMV نامه هایی را برای همه افراد آسیب دیده ارسال می کند و به قربانیان یک سال نظارت بر اعتبار از شرکت Sontiq، Inc. با این حال، ایالت اذعان کرد که ممکن است اطلاعات تماس فعلی بسیاری از ساکنان سابق فلوریدا را که اطلاعات آنها هنوز در حال ذخیره است، نداشته باشد. مقامات گفتند که قربانیان احتمالی می توانند با ارسال ایمیل به FLHSMV به آدرس customerinquiry@flhsmv.gov تایید کنند که آیا داده های آنها به سرقت رفته است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید اداره ایمنی بزرگراه ها و وسایل نقلیه موتوری فلوریدا (FLHSMV) شروع به اطلاع رسانی به قربانیانی کرده است که تحت تأثیر نقض اطلاعات اخیر گواهینامه رانندگی و اطلاعات وسیله نقلیه موتوری قرار گرفته اند، اما هرکسی که اطلاعات وسیله نقلیه موتوری دزدیده شده است را دریافت نخواهد کرد. برای همه ساکنان فعلی و سابق فلوریدا، FLHSMV توصیه می کند اقدامات"}, {"source": "Ars Technica", "title": "Disney found a way to buy Character.AI without buying its lawsuits", "link": "https://arstechnica.com/tech-policy/2026/10/disney-found-a-way-to-buy-character-ai-without-buying-its-lawsuits/", "summary": "This week, Character.AI declared bankruptcy. While some saw the fall of a chatbot platform as a harbinger for the industry , court filings indicate that the decision was actually a key part of a deal that has let Disney hire most of Character.AI’s staff—including its now former CEO Karandeep Anand —potentially acquire most of Character.AI’s technology , and avoid the beleaguered startup’s many legal liabilities and obligations. In the past few years, Character.AI has faced multiple private lawsuits over the safety of its chatbots, as well as investigations from regulators around the world. In a declaration filed as part of the bankruptcy, Character.AI’s newly appointed CEO explained that the goal of the bankruptcy was to reach a “consensual resolution” with personal injury claimants and a group of states investigating the company, while maximizing the value of the company’s assets for shareholders. The Disney deal seems to be structured so that whatever is left of Character.AI will retain responsibility for those legal battles, some of which are still ongoing. Read full article Comments", "date_str": "2026-10-19T14:45:43+00:00", "hash": "ec10f6c93ada3611", "title_fa": "دیزنی راهی برای خرید Character.AI بدون خرید دعوای خود پیدا کرد", "summary_fa": "این هفته Character.AI اعلام ورشکستگی کرد. در حالی که برخی سقوط یک پلتفرم چت بات را منادی این صنعت می‌دانستند، پرونده‌های دادگاه نشان می‌دهد که این تصمیم در واقع بخش مهمی از معامله‌ای بوده است که به دیزنی اجازه می‌دهد بیشتر کارکنان Character.AI - از جمله مدیر عامل سابق فعلی آن کاراندیپ آناند - را استخدام کند و به‌طور بالقوه بیشتر فناوری Character.AI را در اختیار بگیرد و از بسیاری از تعهدات قانونی محاصره شده اجتناب کند. در چند سال گذشته، Character.AI با شکایت‌های خصوصی متعددی بر سر ایمنی چت‌بات‌های خود و همچنین تحقیقاتی از سوی تنظیم‌کننده‌ها در سراسر جهان مواجه شده است. در اعلامیه ای که به عنوان بخشی از ورشکستگی ثبت شده است، مدیرعامل تازه منصوب شده Character.AI توضیح داد که هدف از ورشکستگی رسیدن به یک \"راه حل توافقی\" با مدعیان آسیب های شخصی و گروهی از ایالت ها است که در حال بررسی شرکت هستند، در حالی که ارزش دارایی های شرکت را برای سهامداران به حداکثر می رساند. به نظر می رسد قرارداد دیزنی به گونه ای تنظیم شده است که هر آنچه از Character.AI باقی مانده است، مسئولیت آن نبردهای حقوقی را که برخی از آنها هنوز ادامه دارد، حفظ کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به ناوبری به حداقل برسد این هفته، Character.AI اعلام ورشکستگی کرد. در حالی که برخی سقوط یک پلتفرم چت بات را منادی این صنعت می‌دانستند، پرونده‌های دادگاه نشان می‌دهد که این تصمیم در واقع بخش مهمی از معامله‌ای بوده است که به دیزنی اجازه می‌دهد بیشتر کارکنان Character.AI - از جمله مدیر عامل سابق فعلی آن کاراندیپ آناند - را استخدام کند و به‌طور بالقوه بیشتر فناوری Character.AI را در اختیار بگیرد و از بسیاری از تعهدات قانونی"}, {"source": "Ars Technica", "title": "A Chinese rocket deorbited over Minnesota and left this in a farmer's cornfield", "link": "https://arstechnica.com/space/2026/10/a-chinese-rocket-deorbited-over-minnesota-and-left-this-in-a-farmers-cornfield/", "summary": "About a month ago, a Chinese rocket took off from a remote spaceport in the Gobi Desert, released 10 satellites into orbit, then reignited its engine and put itself on a trajectory to rain down debris over the American Midwest. The rocket's flight on September 15 lasted between 75 and 80 minutes, and it came down without completing a full orbit of the Earth. Social media posts at the time showed streaks of fiery debris falling from the sky, heading north over Kansas toward Minnesota . The overnight spectacle was also visible on the western horizon from Wisconsin . The exact time, location, and direction of the debris allowed experts to connect it to the launch of a Zhuque-2E rocket, a medium-lift vehicle built by a Chinese company called LandSpace. The rocket had launched from Dongfeng, a commercial launch zone co-located with the military-run Jiuquan Satellite Launch Center in northwestern China, less than two hours before. Read full article Comments", "date_str": "2026-10-19T14:35:01+00:00", "hash": "dbc0d61ddccddbdf", "title_fa": "یک موشک چینی بر فراز مینه سوتا منهدم شد و آن را در مزرعه ذرت یک کشاورز رها کرد", "summary_fa": "حدود یک ماه پیش، یک موشک چینی از یک فرودگاه فضایی دورافتاده در صحرای گوبی به پرواز درآمد، 10 ماهواره را به مدار فرستاد، سپس موتور خود را دوباره روشن کرد و خود را در مسیری قرار داد تا زباله‌ها را بر فراز غرب میانه آمریکا ببارد. پرواز این موشک در 15 سپتامبر بین 75 تا 80 دقیقه به طول انجامید و بدون تکمیل یک مدار کامل از زمین سقوط کرد. پست‌های رسانه‌های اجتماعی در آن زمان رگه‌هایی از زباله‌های آتشین را نشان می‌دادند که از آسمان می‌ریختند و به سمت شمال کانزاس به سمت مینه‌سوتا حرکت می‌کردند. منظره یک شبه نیز در افق غربی از ویسکانسین قابل مشاهده بود. زمان، مکان و جهت دقیق زباله‌ها به کارشناسان اجازه می‌دهد تا آن را به پرتاب موشک Zhuque-2E متصل کنند، وسیله نقلیه‌ای با ارتفاع متوسط ​​که توسط یک شرکت چینی به نام LandSpace ساخته شده است. این موشک کمتر از دو ساعت قبل از دانگ فنگ، یک منطقه پرتاب تجاری که با مرکز پرتاب ماهواره نظامی جیوکوان در شمال غربی چین قرار دارد، پرتاب شده بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش حدود یک ماه پیش، یک موشک چینی از یک فرودگاه فضایی دورافتاده در صحرای گبی به پرواز درآمد، 10 ماهواره را به مدار فرستاد، سپس موتور خود را دوباره روشن کرد و خود را در مسیری به سمت غرب آمریکا قرار داد. پرواز این موشک در 15 سپتامبر بین 75 تا 80 دقیقه به طول انجامید و بدون تکمیل مدار کامل زمین سقوط کرد. پست‌های رسانه‌های اجتماعی در آن زمان رگه‌هایی از زباله‌های آتشین را نشان می‌دادند که از آسمان می‌ریختند و به سمت شمال n Old and New", "link": "https://www.wired.com/story/final-fantasy-vii-revelation/", "summary": "Game director Naoki Hamaguchi talks about scale and expectations for one of gaming’s most ambitious remakes.", "date_str": "2026-10-20T10:30:00+00:00", "hash": "606d5ce63101913f", "title_fa": "چگونه «Final Fantasy VII Revelation» تعادل بین قدیم و جدید را ایجاد می کند", "summary_fa": "کارگردان بازی نائوکی هاماگوچی در مورد مقیاس و انتظارات برای یکی از جاه طلبانه ترین بازسازی های بازی صحبت می کند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان اگر در آستانه تکمیل یکی از جاه طلبانه ترین پروژه های تاریخ بازی های ویدیویی هستید، احتمالاً استرس دارید. اگر پروژه مذکور سه‌گانه Final Fantasy VII Remake است که یک دهه را در بر می‌گیرد، بازسازی اولیه و گسترش شدید یکی از تأثیرگذارترین بازی‌های 30 سال اخیر، احتمالاً حتی بیشتر مضطرب می‌شوید. با این حال، نائوکی هاماگوچی استرس ندارد. وقتی از مدیر استودیو Square Enix و مدیر بازی می‌پرسم که با نزدیک شدن به انتشار Final Fantasy VII Revelation، که مجموعه‌ای را که بیش از یک دهه روی آن کار کرده است، چه احساسی دارد، تنها پاسخ این است که «من خیلی متمرکز بودم، واقعاً احساس می‌کردم که در یک لحظه گذشت». رفتار آرام هاماگوچی با توجه به سنگینی انتظارات پیرامون پروژه تعجب آورتر است. نسخه اصلی Final Fantasy VII که در سال 1997 در پلی استیشن سونی منتشر شد، یک پدیده فرهنگی پاپ بود – نه اولین نسخه غربی سری ژاپنی-RPG، بلکه بدون شک عنوان موفقیت آمیز آن بود. یکی که درست زمانی وارد شد که بازی در حال رشد از جایگاه مخصوص بچه ها و تبدیل شدن به یک رسانه اصلی بود. هنوز هم به‌عنوان یکی از بهترین فیلم‌های فاینال فانتزی در نظر گرفته می‌شود، و داستان آن درباره قهرمان بی‌میل Cloud Strife و گروه بی‌مصرف دوستان جنگجوی محیط‌زیست او که با یک شرکت قدرتمند که سیاره را نابود می‌کند می‌جنگند، بیش از هر زمان دیگری مرتبط است. نسخه بازسازی شده از زمان پلی استیشن 2 در حال آماده شدن بوده است و حتی با یک نسخه نمایشی فناوری سینمایی در کنار رونمایی PS3 مورد آزار و اذیت قرار گرفته است."}, {"source": "Wired", "title": "Sexual Assault Is a Free Speech Issue", "link": "https://www.wired.com/story/the-big-interview-mary-anne-franks/", "summary": "Mary Anne Franks has spent years fighting against online abuse. When people are abused with impunity, she says, the message becomes “We do not care about women’s voices.”", "date_str": "2026-10-20T10:30:00+00:00", "hash": "a8cbe369c71210d0", "title_fa": "تجاوز جنسی یک مسئله آزادی بیان است", "summary_fa": "مری آن فرانک سال ها را صرف مبارزه با سوء استفاده آنلاین کرده است. او می‌گوید وقتی مردم بدون مجازات مورد آزار قرار می‌گیرند، پیام این می‌شود: «ما به صدای زنان اهمیتی نمی‌دهیم». Loader Save Story ذخیره این داستان نظر Loader Save Story Save this Story این گواهی بر ماهیت عمیقا زن ستیزانه رسانه های اجتماعی است که اندکی پس از اینکه ماه گذشته ادعاهای بد رفتاری هولناک جنسی علیه هفت عضو فرات کرنل منتشر شد، مردم در اینترنت بلافاصله شروع به تلاش برای دکس کردن قربانی کردند. در چند هفته گذشته، تحریک‌کنندگان راست‌گرا و حساب‌های ترول تصادفی به طور یکسان تلاش کرده‌اند جین دو، دانش‌آموز ناشناس سابق کرنل را که هفت عضو برادر چی فی را متهم به تجاوز جنسی به او در سال 2024 متهم کرده بود، به طور علنی شناسایی کنند. تلاش برای انتشار نام و سایر جزئیات شخصی او باعث ایجاد تجاوز جنسی می‌شود - اما بر اساس تاریخچه رسانه‌های اجتماعی مری آن فرانک، همه آن‌ها به عنوان تاریخچه رسانه‌های اجتماعی مری آن فرانک می‌گویند. خیلی رایج فرانک، استاد دانشکده حقوق دانشگاه جورج واشنگتن است که در زمینه تلاقی حقوق مدنی، آزادی بیان و فناوری تخصص دارد. او همچنین رئیس‌جمهور و مدیر سیاست‌گذاری فناوری قانونگذاری در ابتکار حقوق مدنی سایبری است، جایی که سال‌ها در مبارزه با سوء استفاده آنلاین و سوء استفاده جنسی مبتنی بر تصویر صرف کرده است. برای دهه‌ها، فرانکز در ردیف اول در مورد روش‌های بی‌شماری که مردان در اینترنت نسبت به زنان توهین می‌کنند، و همچنین برخی از استدلال‌های قانون اساسی که توسط مفسر مستقل مایکل تریسی استناد می‌شود، صحبت می‌کرده است، که استدلال می‌کند دکس جین دو طبق متمم اول قانون اساسی است. فرانکس می‌گوید: «وقتی مفهومی انتزاعی از آزادی بیان را فتیش‌سازی می‌کنید، یک کاری که انجام می‌دهد این است که یک مکالمه را از بین می‌برد."}, {" ن تمام هزینه‌ها و قیمت‌های منو هستند. این برنامه شامل 250 مارک در هنگام راه اندازی است و برنامه هایی برای گسترش این پیشنهاد وجود"}, {"source": "Wired", "title": "Demi Adejuyigbe Thinks You Should Only Post 3 Times a Day", "link": "https://www.wired.com/story/demi-adejuyigbe-user-behavior/", "summary": "The comedian sees being online as similar to visiting the zoo. “I don’t need to interact with that,” he says. “It’s just a thing that I enjoy, and then I walk away.”", "date_str": "2026-10-20T10:00:00+00:00", "hash": "48f6c32d277dd8bc", "title_fa": "Demi Adejuyigbe فکر می کند که شما باید فقط 3 بار در روز پست کنید", "summary_fa": "این کمدین آنلاین بودن را شبیه به بازدید از باغ وحش می داند. او می گوید: «من نیازی به تعامل با آن ندارم. \"این فقط چیزی است که از آن لذت می برم، و سپس می روم.\" Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Demi Adejuyigbe می‌خواهد کلاس‌های رقص توسط دولت برای همه مردان برگزار شود—یا او به کریم رحما در Subway Takes گفته است. سخت است که ایده دنیایی را دوست نداشته باشیم که در آن همه به سختی یک کمدین غوغا می کنند، چه در مجموعه نمادین موزیک ویدیوهای سالانه اش که روی زمین قرار می گیرد، چه در «سپتبر» Wind Fire یا اعداد موزیکال پوچ از نمایش های تک نفره مشهور او. (عنوان اولین بازی او در ادینبورگ فرینج تبلیغ می کرد که او روی صحنه نیز یک بک تلنگر انجام خواهد داد). آدجوییگبه در میان فعالیت‌های بی‌شمار خود به عنوان یک مرد رنسانس قرن بیست و یکم، از جمله دی‌جی‌ست، نویسندگی تلویزیون، پادکست و عکاسی فیلم، زمانی را برای پاسخ به هر متن و تحقیق در مورد جلوه‌های بصری در فیلم‌ها پیدا می‌کند. مانند لبرون جیمز در میم مورد علاقه‌اش، او واقعاً «با تمام وجود لبخند می‌زند». این یک بسیار پیش فرض است. من فقط به چیزی نیاز دارم که شبیه هیچ چیز دیگری نباشد. من یک لحن سفارشی نمی‌زنم، زیرا احساس می‌کنم می‌توانم به سادگی بگویم: «اوه، این آهنگ است»، اما به چیزی نیاز دارم که خیلی سریع آزاردهنده باشد. من برای آن اعلان‌هایی دریافت می‌کنم و همیشه می‌گویم: «این به من مربوط نیست». من زیاد با گوشیم سر و کار دارم من از تلفنم در برنامه ام استفاده می کنم. من چیزها را ضبط می کنم. فاش شد که مدیر عامل [اسپاتیفای] در حال [سرمایه گذاری] در شرکت های هوش مصنوعی و پیمانکاران نظامی بود و این آخرین"}, {"source": "Wired", "title": "5 Best AI Notetakers (2026), Tested and Reviewed", "link": "https://www.wired.com/gallery/best-ai-notetakers/", "summary": "A growing collection of pocket-size gadgets lets you easily make recordings and extract info from them. Here are our favorites.", "date_str": "2026-10-20T10:00:00+00:00", "hash": "7fa4f34a69ca2be4", "title_fa": "5 بهترین یادداشت‌نویس هوش مصنوعی (2026)، آزمایش شده و بازبینی شده", "summary_fa": "مجموعه رو به رشد ابزارهای جیبی به شما امکان می دهد به راحتی ضبط کنید و اطلاعات را از آنها استخراج کنید. در اینجا موارد مورد علاقه ما هستند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان برگزیده در این مقاله من هرگز علاقه ای به یادداشت برداری نداشته ام و تنها نیستم. روند نوشتن چیزی باعث می شود که بلافاصله آنچه گفته شده را از دست بدهم. من همچنین دستخط بدی دارم، یعنی به ندرت می توانم یادداشت هایم را بخوانم. ضبط مصاحبه‌ها مدت‌ها راه‌حل بوده است، اما رونویسی آنها گام دیگری است (با هزینه اضافی) که می‌تواند هزاران کلمه را در اختیار شما بگذارد که بیشتر آن‌ها بی‌ربط هستند. یادداشت نویسان هوش مصنوعی یک راه حل واضح و قانع کننده ارائه می دهند. آنها با قرار دادن قدرت هوش مصنوعی در (یا حداقل در مجاورت) یک دستگاه قابل حمل که ضبط کننده میکروکاست سال گذشته را تداعی می کند، یادداشت برداری IRL را آسانتر و سریعتر می کنند. مانند همه چیزهای هوش مصنوعی، هیئت منصفه در مورد اینکه آیا یادداشت نویسان هوش مصنوعی واقعا مفید هستند یا دور زدن سختگیری فکری نوشتن آنچه مردم می گویند، ما را احمق تر می کند یا خیر. حداقل آن‌ها را روشی مناسب برای به تصویر کشیدن نکات اصلی یک مکالمه می‌دانستم – و برای ثبت بحث‌ها و جلساتی که ممکن بود فوراً فراموش کرده بودم، مفید باشند. یادداشت‌کنندگان هوش مصنوعی در سراسر نمایشگاه CES 2026 حضور داشتند و در طول سال محبوبیت خود را افزایش دادند. امروزه بیش از دوجین گزینه به هر شکلی موجود است. و ویژگی‌های یادداشت‌برداری در حال حاضر به دسته‌های دیگر محصولات نفوذ می‌کند، با ویژگی‌های خلاصه صوتی محدودی که اکنون در نرم‌افزار بتا برای اپل واچ و عکس‌های فوری صوتی بخشی از هدفون Nothing Ear (3a) موجود است."}, {"source": "Wired", "title": "How to See the Orionid Meteor Shower and Other Upcoming Astronomical Events", "link": "https://www.wired.com/story/how-to-see-the-orionid-meteor-shower-and-other-upcoming-astronomical-events/", "summary": "Made up of small fragments left behind by Halley’s Comet, these meteors are known for being especially bright and speedy.", "date_str": "2026-10-20T09:30:00+00:00", "hash": "c84dc7e2aeab4aa8", "title_fa": "چگونه می توان بارش شهابی شکارچی و سایر رویدادهای نجومی آینده را مشاهده کرد", "summary_fa": "این شهاب‌سنگ‌ها از تکه‌های کوچک به جا مانده از دنباله‌دار هالی تشکیل شده‌اند و به‌خاطر درخشان و سریع بودن شهرت دارند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان دنباله دار هالی تا چند دهه دیگر از زمین قابل مشاهده نخواهد بود، اما می توانید تکه هایی از آن را در آسمان در این ماه در بارش شهابی شکارچی مشاهده کنید. این رویداد اوایل این ماه آغاز شد اما در 21 و 22 اکتبر به اوج خود خواهد رسید. در اینجا نحوه مشاهده این ستاره های تیرانداز و سایر پدیده های نجومی آینده آمده است. با این حال، این شهاب‌های خاص به دلیل درخشندگی و همچنین سرعتشان شناخته می‌شوند، و در برخی موارد به ویژه شهاب‌های سریع می‌توانند به «گلوله‌های آتشین» تبدیل شوند و مانند سیاره زهره درخشان شوند. با این حال، شرایط تاریک برای مشاهده برخی دیگر از پدیده‌های مرتبط با این رویداد بهترین خواهد بود، مانند قطارهای درخشانی از زباله‌هایی که شهاب‌سنگ‌های Orionid گاهی اوقات در پی خود ترک می‌کنند. باران نام خود را از صورت فلکی شکارچی گرفته است، زیرا این \"تابش\" باران است، منبعی که به نظر می رسد بخش بزرگی از شهاب ها از آن می آیند. با این حال، برای لذت بردن از نمایش، نیازی به پیدا کردن Orion ندارید. در واقع بهترین مشاهده اغلب دور از صورت فلکی است و شهاب ها باید از هر قسمت از آسمان شب قابل مشاهده باشند. در اوایل این ماه، زحل به مخالفت رسید، یعنی زمین بین خورشید و زحل عبور کرد. از آنجایی که غول گازی در حوالی غروب خورشید در شرق آسمان طلوع می کند بی، پنتاگون، اوهایوآینا جنوبی، پنتاگون، اوهایونا، اوکینا جنوبی داکوتا، تنسی، یوتا، ویرجینیا، واشنگتن، ویسکانسین، و وایومینگ."}, {"source": "Wired", "title": "Japan’s MMX Mission Wants to Bring Martian Moon Samples Back to Earth", "link": "https://www.wired.com/story/japan-audacious-mmx-mission-sample-martian-moon/", "summary": "JAXA is leading an international mission to reach Mars’ Phobos moon and bring soil back to Earth. If successful, it could unlock new clues about the history of the solar system.", "date_str": "2026-10-19T18:45:06+00:00", "hash": "5dbc85299ad65da8", "title_fa": "ماموریت MMX ژاپن می خواهد نمونه های ماه مریخ را به زمین بازگرداند", "summary_fa": "JAXA یک ماموریت بین المللی را برای رسیدن به قمر فوبوس مریخ و بازگرداندن خاک به زمین هدایت می کند. در صورت موفقیت، می تواند سرنخ های جدیدی در مورد تاریخ منظومه شمسی باز کند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان دشوار است تصور سفری دلهره آورتر از سفر به یک ماه بیگانه که به نام خدای یونانی ترس نامگذاری شده است – به خصوص زمانی که سه تلاش دیگر برای انجام آن سفر شکست خورده باشد. کیوشی کوراموتو، که رهبری تعداد زیادی از دانشمندان بین‌المللی این مأموریت را بر عهده دارد، می‌گوید با این حال، در حالی که آژانس فضایی ژاپن، JAXA، و همکارانش برای ارسال یک فضاپیما به ماه با نام فوق‌العاده مریخ آماده می‌شوند، «همه اعضا مملو از حسی آرام از هیجان هستند». این مأموریت که کاوش قمرهای مریخی (MMX) نام دارد، قرار است از مرکز فضایی تانگاشیما ژاپن در ساعات اولیه سه‌شنبه در ژاپن (بعدازظهر دوشنبه در ایالات متحده) پرتاب شود. پس از تقریبا یک سال سفر، فضاپیما به مریخ و دو قمر آن خواهد رسید: فوبوس به معنای ترس در یونانی و دیموس به معنای ترس. MMX این جفت را از دور مشاهده می‌کند و نمونه‌هایی از فوبوس جمع‌آوری می‌کند تا به یک سوال علمی در حال ظهور پاسخ دهد: قمرها دقیقاً چگونه به وجود آمدند؟ محققان ده ها سال است که در حال انجام بازی های مشابه هستند. از دهه 1980، روسیه سه کاوشگر به فوبوس فرستاد که همه آنها شکست خوردند. با این حال، محققان مشتاق رسیدن به این ماموریت غیرممکن هستند زیرا منشا فوبوس و خواهر و برادرش همچنان یک راز باقی مانده است. برخی از ویژگی‌های آنها، مانند الگوی نور مرئی که منعکس می‌کنند، نشان می‌دهد که آنها سیارک‌هایی هستند که توسط گرانش آن در مدار مریخ گرفته شده‌اند. تام استاتلر، مدیر برنامه MMX"}, {"source": "Wired", "title": "All-Clad Factory Seconds Sale: Cookware Deals for Fall Cooking", "link": "https://www.wired.com/story/all-clad-factory-seconds-sale-october-2026/", "summary": "Upgrade your cold-weather cooking setup with discounted cookware for soups, stews, and roasts.", "date_str": "2026-10-19T16:10:40+00:00", "hash": "0ece1457b21b2058", "title_fa": "فروش ثانیه های تمام پوشیده کارخانه: تخفیف ظروف آشپزی برای آشپزی پاییزی", "summary_fa": "تنظیمات آشپزی خود را در هوای سرد با ظروف آشپزی با تخفیف برای سوپ، خورش و کباب ارتقا دهید. این داستان را ذخیره کنید ذخیره داستان ذخیره این داستان طبق گفته تیم WIRED Reviews و، خوب، همه ظروف پخت و پز همه‌پوش یک ابزار اصلی خرید برای همیشه هستند. پدر و مادر من تا زمانی که یادم می‌آید یک ماهیتابه تمام‌پوش 8 اینچی دارند - و من در دهه 80 بزرگ شدم - و من یک ماهیتابه تمام‌پوش دارم که تقریباً 25 سال از عمرم گذشته است و هنوز هم به نظر می‌رسد که آن را پارسال خریدم. توجه داشته باشید که برای دسترسی به فروش باید آدرس ایمیل خود را وارد کنید (اگرچه وقتی این کار را انجام دادم، یک کوپن برای ارسال رایگان بیش از 60 دلار دریافت کردم). تمام فروش نهایی است. و اقلامی که می بینید تعداد محدودی دارند و ممکن است دوباره ذخیره نشوند، بنابراین اگر چیزی را که دوست دارید مشاهده کردید، منتظر نمانید. این ماهیتابه ای است که من دارم، و در ویلیامز سونوما واقعاً 180 دلار است. این بسیار همه کاره است با کناره های مستقیمش که به شما امکان می دهد غذاهای یک دیگ بپزید، و تا دمای 600 درجه فارنهایت در فر قابل استفاده است، بنابراین می توانید آن را حتی در زیر جوجه های گوشتی استفاده کنید. اگر قرار بود از این فروش یک چیز بخرم، این قیچی آشپزخانه است. قیچی آشپزخانه یکی از مفیدترین چیزهایی است که می توانید به عنوان یک آشپز خانگی داشته باشید، چه برای بریدن گیاهان و چربی ها و چه برای بریدن استخوان های کوچک. من All-Clad's را امتحان نکرده ام، اما تصور می کنم آنها قانونی هستند. Home and Cook Sales می‌گوید این پایین‌ترین قیمتی است که این روستر تا کنون داشته است، اما توجه داشته باشید که شامل قفسه نمی‌شود. با"}, {"source": "Wired", "title": "WhatsApp Help Pages Leaked Hidden Instructions for a Meta Chatbot", "link": "https://www.wired.com/story/whatsapp-help-pages-leaked-hidden-instructions-for-a-meta-chatbot/", "summary": "Around 80 pages on WhatsApp’s website exposed instructions that were designed for its chatbot, including “WHAT NOT TO SAY.” Meta says a bug caused the issue.", "date_str": "2026-10-19T16:00:00+00:00", "hash": "1e8c312b3cb0b0d8", "title_fa": "صفحات راهنمای واتس اپ دستورالعمل های مخفی یک ربات متا چت را فاش کردند", "summary_fa": "حدود 80 صفحه در وب‌سایت واتس‌اپ دستورالعمل‌هایی را که برای چت ربات آن طراحی شده بود، از جمله «WHAT NOT TO SAY» نشان می‌دهد. متا می گوید یک باگ باعث این مشکل شده است. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان ده‌ها صفحه وب واتس‌اپ که برای پاسخ به سؤالات مردم در مورد برنامه پیام‌رسانی رمزگذاری‌شده متا طراحی شده‌اند، به‌طور ناخواسته دستورالعمل‌های خود شرکت را در اختیار چت‌باتش قرار دادند. این بخش‌ها شامل بخش‌هایی با عنوان «چه چیزی نباید گفت» برای کاربرانی بود که سؤال می‌پرسیدند و دستورالعمل‌های صریح برای عدم ارائه مشاوره حقوقی به مردم. یک تحلیل جدید نشان می‌دهد که حدود ۸۰ صفحه راهنما و پرسش‌های متداول در وب‌سایت واتس‌اپ دستورالعمل‌های متنی را نشان می‌دهند که برای یک مدل زبان بزرگ، به‌ویژه یکی از مدل‌های متا طراحی شده‌اند. دستورالعمل ها، طبق یافته های شرکت حریم خصوصی Redact، در کد صفحات وب ظاهر شده و حاوی جزئیات مکتوب است که به صراحت در صفحات راهنمای WhatsApp وجود ندارد. در میان 100 بلوک متن پنهان، به نظر می‌رسد که دستورالعمل‌ها راهنمایی می‌کنند تا یک LLM را از پاسخ دادن به سؤالات کاربران به روش‌های غیرمفید هدایت کند و نگاهی اجمالی به نحوه ایجاد دستورالعمل‌ها برای چت‌بات‌ها ارائه دهد. در یک نمونه، صفحه واتس اپ در مورد نحوه حذف حساب شما حاوی دستورالعمل هایی بود که در کنار توصیه های دیگر، می گفت: «توصیه نکنید با هیچ مرجع حفاظت از داده، تنظیم کننده یا مرجع نظارتی در مورد این مشکل تماس بگیرید». WIRED متن در معرض دید را مشاهده کرد، که همچنان هنگام مشاهده کد زیرین نسخه های آرشیو شده صفحات راهنما قابل مشاهده است. دن سالتمن، مدیر عامل و بنیانگذار Redact.dev می گوید: «نکته برجسته در اینجا شکاف بین آنچه به مردم گفته می شود در مقابل LLM ها است. او می‌گوید این شرکت"}, {"source": "MIT Tech Review", "title": "The Download: the claim shaking up AI and the internet’s agent problem", "link": "https://www.technologyreview.com/2026/10/20/1147355/the-download-claim-shaking-up-ai-internet-agent-problem/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. “We were looking at it wrong”: The explosive claim that’s upended the AI world “I think I have good news about the nature of neural networks.” With those simple words of optimism, Nick Cammarata, a researcher at AI startup Goodfire, kicked off a 26,000-word blog post that has knocked the AI world on its head, sparking wild speculation as well as cautious (and not-so-cautious) celebration. Cammarata claims that LLMs might be far easier to understand, and thus to monitor and control, than people previously thought. If true, it’s a huge deal. But not everyone is convinced. I talked to Cammarata the day after his post blew up. We discussed what he thinks researchers are getting wrong, what his work actually shows, and why skeptics aren’t ready to celebrate just yet. Read the exclusive interview to find out what Cammarata’s claims could mean for AI . —Will Douglas Heaven Making the internet better for AI agents might make it worse for everyone else Until recently, you could split internet users into just two categories: bots and people. But personal AI agents are slowly but surely disrupting that divide by taking on online tasks, from booking flights to reserving hotel rooms. Meta’s Muse alone was downloaded 5 million times in its first month. The mingling of these agents with human visitors—on an internet designed largely to prioritize people—has gone poorly, with many websites blocking AI agents. If that demand keeps rising, the internet could be redesigned for agents rather than people. Find out what that could mean for the rest of us . —James O Donnell This story is from The Algorithm, our weekly AI newsletter. Sign up to receive it in your inbox every Monday. 10 Climate Tech Companies to Watch: Moment Energy and its work to repurpose used EV batteries Moment Energy is one of MIT Technology Review’s 10 Climate Tech Companies to Watch 2026 , available exclusively to subscribers . Demand for energy storage is surging, with capacity expected to grow eightfold in the next decade. To meet that demand, Moment Energy wants to shortcut a supply chain that now flows largely through China by domestically repurposing EV batteries into new grid-connected storage systems. Ongoing trade battles between the US and China have been a shot in the arm for the company. And soon, it will be able to categorize its repurposed batteries as dome", "date_str": "2026-10-20T12:10:00+00:00", "hash": "f03582c0ce1b498b", "title_fa": "دانلود: ادعایی که هوش مصنوعی و مشکل عامل اینترنت را تکان می دهد", "summary_fa": "فکر می‌کنم خبرهای خوبی در مورد ماهیت شبکه‌های عصبی دارم.» نیک کامماراتا، محقق در استارت‌آپ گودفایر هوش مصنوعی، با همین کلمات ساده خوش‌بینانه، یک پست وبلاگی 26000 کلمه‌ای را آغاز کرد که دنیای هوش مصنوعی را به هم ریخته و باعث گمانه‌زنی‌های وحشیانه و همچنین جشنی محتاطانه (و نه چندان محتاطانه) شد. Cammarata ادعا می کند که درک LLMها، و بنابراین نظارت و کنترل، بسیار آسان تر از آنچه مردم قبلاً تصور می کردند، هستند. اگر درست باشد، معامله بزرگی است. اما همه قانع نشده اند. من با کامماراتا یک روز پس از منفجر شدن پستش صحبت کردم. ما در مورد اینکه او فکر می‌کند محققان اشتباه می‌کنند، کار او واقعاً چه چیزی را نشان می‌دهد و اینکه چرا شکاکان هنوز آماده جشن گرفتن نیستند، بحث کردیم. مصاحبه اختصاصی را بخوانید تا بفهمید ادعاهای Cammarata چه معنایی برای هوش مصنوعی دارد. تا همین اواخر، کاربران اینترنت را فقط به دو دسته تقسیم می‌کردید: ربات‌ها و افراد. اما عوامل هوش مصنوعی شخصی با انجام وظایف آنلاین، از رزرو پرواز تا رزرو اتاق هتل، به آرامی اما مطمئناً این شکاف را بر هم می زنند. Meta’s Muse به تنهایی در ماه اول 5 میلیون بار دانلود شد. اختلاط این عوامل با بازدیدکنندگان انسانی - در یک اینترنت که عمدتاً برای اولویت‌بندی افراد طراحی شده است - ضعیف بوده است و بسیاری از وب‌سایت‌ها عوامل هوش مصنوعی را مسدود می‌کنند. اگر این تقاضا همچنان در حال افزایش باشد، اینترنت می تواند برای نمایندگان به جای مردم طراحی شود. دریابید که این می تواند برای بقیه ما چه معنایی داشته باشد. Moment Energy یکی از 10 شرکت فناوری اقلیمی MIT Technology Review برای تماشای 2026 است که به طور انحصاری برای مشترکین در دسترس است. تقاضا برای ذخیره سازی انرژی در حال افزایش است و انتظار می رود ظرفیت در دهه آینده هشت برابر"}, {"source": "MIT Tech Review", "title": "AI adoption by industry shows what other sectors can learn", "link": "https://www.technologyreview.com/2026/10/20/1145423/ai-adoption-by-industry-shows-what-other-sectors-can-learn/", "summary": "The current narrative around artificial intelligence in the workplace is largely driven by Silicon Valley. But treating the tech sector as an island misses the actual trends in technology adoption–tech is just the first industry in line. As generative AI and automation tools mature, the shifts currently reshaping software engineering and product management will inevitably filter into healthcare, education, retail, and manufacturing. The variation in adoption rates today isn t a sign that non-tech industries are falling behind, but rather a reflection of the different speeds at which industries absorb new workflows. For leaders and their teams outside of tech, this differential pace provides a practical blueprint for how AI adoption unfolds, and where the opportunities lie. The AI adoption spectrum by industry Recent survey data from TripleTen highlights just how stark the current adoption curve is across different sectors of the economy (see Figure 1). Figure 1: The AI adoption curve remains steep across industries, but non-tech industry adoption rates are increasing. Source : TripleTen , 2026 While tech leads the way, finance emerges as a clear second: 48% of finance workers have been asked to use AI chatbots, and 32% have been asked to automate parts of their workflow. This demonstrates how rapidly knowledge work integrates AI once clear use cases emerge. By contrast, sectors like healthcare (18% asked to use chatbots) and education (25%) reflect lower initial exposure. Because these broad industry categories encompass a mix of specialized hands-on professionals, clinical or instructional personnel, and back-office administrative staff, universal adoption was never going to happen overnight. Integrating automated tools into compliance-heavy or human-facing operations requires a more deliberate pace, which is reflected by the lower numbers. The AI skills workers are being asked to learn Across all surveyed industries, 79% of workers report being asked to learn at least one skill they didn t previously have. Looking at the specific competencies demanded in tech today offers a preview of the skill sets likely to shift into other sectors (see Figure 2). Figure 2: Workforces across industries are learning new skills. Source : TripleTen , 2026 Although some of these sound like niche skills confined to tech, many of them will translate to frontline work across sectors—from hospital systems managing patient logistics to school districts processing administrative", "date_str": "2026-10-20T12:00:00+00:00", "hash": "c164a396f61a1f9a", "title_fa": "پذیرش هوش مصنوعی توسط صنعت نشان می دهد که سایر بخش ها چه چیزی می توانند بیاموزند", "summary_fa": "روایت فعلی در مورد هوش مصنوعی در محیط کار عمدتاً توسط دره سیلیکون هدایت می شود. اما تلقی کردن بخش فناوری به عنوان جزیره ای که گرایش های واقعی در پذیرش فناوری را از دست می دهد – فناوری تنها اولین صنعت در خط است. با بلوغ هوش مصنوعی و ابزارهای اتوماسیون، تغییراتی که در حال حاضر مهندسی نرم‌افزار و مدیریت محصول را تغییر می‌دهند، ناگزیر به بخش مراقبت‌های بهداشتی، آموزش، خرده‌فروشی و تولید می‌شوند. تغییر در نرخ پذیرش امروزه نشانه ای از عقب افتادن صنایع غیرفناوری نیست، بلکه بازتابی از سرعت های متفاوتی است که صنایع در آن جریان های کاری جدید را جذب می کنند. برای رهبران و تیم‌های آن‌ها خارج از فناوری، این سرعت متفاوت، طرحی عملی برای چگونگی پذیرش هوش مصنوعی و موقعیت‌های فرصت‌ها فراهم می‌کند. طیف پذیرش هوش مصنوعی توسط صنعت داده های نظرسنجی اخیر از TripleTen نشان می دهد که منحنی پذیرش فعلی در بخش های مختلف اقتصاد چقدر واضح است (شکل 1 را ببینید). شکل 1: منحنی پذیرش هوش مصنوعی در بین صنایع تند باقی می ماند، اما نرخ پذیرش صنعت غیرفناوری در حال افزایش است. منبع: TripleTen، 2026 در حالی که فناوری پیشرو است، امور مالی به عنوان یک ثانویه آشکار ظاهر می شود: از 48٪ از کارکنان مالی خواسته شده است که از چت ربات های هوش مصنوعی استفاده کنند و از 32٪ خواسته شده است که بخشی از گردش کار خود را خودکار کنند. این نشان می دهد که کار دانش با چه سرعتی هوش مصنوعی را به محض ظهور موارد استفاده واضح، یکپارچه می کند. در مقابل، بخش‌هایی مانند مراقبت‌های بهداشتی (18 درصد درخواست استفاده از ربات‌های چت) و آموزش (25 درصد) نشان‌دهنده قرار گرفتن در معرض اولیه کمتر هستند. از آنجایی که این دسته‌بندی‌های صنعتی گسترده ترکیبی از متخصصان حرفه‌ای، پرسنل بالینی یا آموزشی و کارکنان اداری پشتیبان"}, {"source": "MIT Tech Review", "title": "How to study a swiftly melting climate disaster", "link": "https://www.technologyreview.com/2026/10/20/1147135/how-to-study-a-swiftly-melting-climate-disaster/", "summary": "Andrew Haverdink, a tall grad student in a rain bib and rubber boots, wrenched a double-handed drill from the frozen soil that underlies much of Alaska’s Denali National Park and then unclipped the hollow barrel from the end of the bit. He knelt in front of a blue tarp, lined the barrel up with a plastic tray, and pushed a rod through the opposite end. A perfect solid, cylindrical core of ancient soil emerged—dark, rich permafrost at least a foot long. On that late morning in early July, Haverdink was among a team of Northern Arizona University students and staff gathering samples and data from a research plot, divided by surveyor’s tape unspooled atop tussocks, alders, and fireweed. In late June of 2013, a lightning strike sparked a fire in this stretch of mostly treeless tundra, in the northern backcountry of the park. Whipped by the Chinooks , intense downslope winds created as moist ocean air surmounts and then descends the Alaska Range , the fire ripped across nearly 35,000 acres . It burned through much of the vegetation and deep into the topsoil, stripping away the insulating layer that preserves the frozen permafrost, a massive storehouse of carbon that underlies 85% of Alaska. During their first survey, in 2016, the researchers found that in places where the fire burned hottest and deepest, the thawed soil above the permafrost (known as the active layer) extended between a foot and nearly two feet deeper than in plots outside the burn scar—an indication of deep thawing. Northern Arizona University graduate student Andrew Haverdink drills out permafrost cores in the northern backcountry of Alaska’s Denali National Park. JAMES TEMPLE Crucially, the fire also crossed two sets of survey grids that the National Park Service established in 2001, including the one where the researchers stood that morning. That pre-fire snapshot offered the Northern Arizona group a rare opportunity to study how the blaze has altered the vegetation, carbon, and permafrost across time, says Xanthe Walker, one of the principal investigators on the project, who was watching over Haverdink’s work that morning. These direct observations from high-latitude fires are helping scientists to better understand the impacts of wildfire and permafrost loss on climate change, she says. “There’s a lot of uncertainty,” Walker says. “These are huge biomes with massive fires that no one’s ever been to or ever looked at.” They’re among a growing group of researchers striving to untangle what ", "date_str": "2026-10-20T10:00:00+00:00", "hash": "9c5c7e2ce22b8812", "title_fa": "چگونه یک فاجعه آب و هوایی که به سرعت در حال ذوب شدن است را مطالعه کنیم", "summary_fa": "اندرو هاوردینک، یک دانش‌آموز قدبلند در مقطع کارشناسی ارشد با کفش بارانی و چکمه‌های لاستیکی، مته‌ای دو دستی را از خاک یخ‌زده‌ای که در زیربنای بیشتر پارک ملی دنالی آلاسکا قرار دارد، بیرون آورد و سپس لوله توخالی را از انتهای سوراخ جدا کرد. او در مقابل یک برزنت آبی زانو زد، بشکه را با یک سینی پلاستیکی ردیف کرد و یک میله را از انتهای مخالف آن هل داد. یک هسته جامد و استوانه ای کامل از خاک باستانی پدیدار شد - منجمد تاریک و غنی که حداقل یک فوت طول دارد. در اواخر آن صبح در اوایل ژوئیه، هاوردینک در میان تیمی از دانشجویان و کارکنان دانشگاه آریزونا شمالی بود که نمونه‌ها و داده‌ها را از یک طرح تحقیقاتی جمع‌آوری می‌کردند که بر اساس نوار نقشه‌بردار بر روی ساق‌ها، توسکا و علف‌های آتشین تقسیم شده بود. در اواخر ژوئن 2013، یک صاعقه باعث آتش‌سوزی در این بخش از تاندرای عمدتاً بدون درخت، در بخش شمالی پارک شد. آتش سوزی که توسط شینوکس ها شلاق خورده است، بادهای پایین شیب شدیدی ایجاد می شود که با غلبه بر هوای مرطوب اقیانوس و سپس پایین آمدن از رشته کوه آلاسکا، آتش تقریباً 35000 هکتار را درنوردید. در بسیاری از پوشش گیاهی و در اعماق خاک سطحی سوخت و لایه عایق را که یخ‌های دائمی منجمد را حفظ می‌کند، از بین برد، یک انبار عظیم کربن که زیر 85 درصد آلاسکا قرار دارد. در طول اولین بررسی خود، در سال 2016، محققان دریافتند که در مکان‌هایی که آتش داغ‌ترین و عمیق‌ترین سوخت را می‌سوزاند، خاک ذوب‌شده بالای یخ‌های دائمی (معروف به لایه فعال) بین یک پا و تقریباً دو فوت عمیق‌تر از قسمت‌های خارج از جای زخم سوختگی امتداد می‌یابد که نشانه‌ای از ذوب عمیق است. اندرو هاوردینک، دانشجوی فارغ‌التحصیل دانشگاه آریزونا شمالی، هسته‌های منجمد دائمی را در منطقه شمالی پارک"}, {"source": "MIT Tech Review", "title": "A visit to Samsung’s massive new semiconductor hub", "link": "https://www.technologyreview.com/2026/10/20/1145916/dispatch-visit-to-samsung-massive-new-semiconductor-hub/", "summary": "_____________ THE PLACE Pyeongtaek, South Korea Generative AI models run on powerful chips known as GPUs, which depend on stacks of specialized memory chips packaged with the processor. To meet growing demand for memory, Samsung is building a massive new semiconductor manufacturing complex in Pyeongtaek, South Korea. Three fabs already operate around the clock, and a fourth is coming online. Construction of a fifth was halted during a drop in demand for memory chips in 2024 but restarted when the AI boom sent demand soaring. It’s just before noon on a Monday, and construction workers are pouring out of Samsung’s fabs in Pyeongtaek, a farming city south of Seoul where rice paddies abut a sprawling chipmaking complex. Thousands of workers, dressed head to toe in black with sky-blue vests, take off helmets bearing their names and fab numbers. They walk to lunch, sweaty and flushed, in chunky sneakers capped with yellow rubber toe guards. Some hop on scooters or motorcycles to get around the campus, which covers an area about the size of New York City’s Central Park. They’ll dine at buffets, diners, and beef stew joints, walking past banners advertising short-term leases for studio apartments. Some stop by real estate offices to inquire, stepping up to the same counters where Samsung’s salaried engineers buy new homes . In front of the fourth fab, I meet Choi Hye-rin, a 35-year-old safety officer, as she wipes her forehead with a handkerchief. At dawn, she boarded one of the shuttle buses that ferry workers in from Songtan, an older, scrappier district. She oversees the safety of a crew responsible for building cable ducts. She writes reports, inspects equipment, and checks the chemicals the workers handle. She’s one of hundreds of women working on site, many employed as spotters who walk ahead of heavy equipment. Safety is a big deal here. After lunch, construction picks right back up. Excavators move past rust-red steel structures rising high under tower cranes. Banners that hang from the highest girders read, “Even if the work runs late, don’t rush.” A giant LED scoreboard announces the winners of a contest for writing a poem about safety. Helmets stickered with a pledge, “I will not work if it’s not safe,” perch atop lockers. The finished fabs glisten from across the street. Along with the cautionary messages, there’s a sense of urgency in the air. Samsung predicts that demand for memory chips will continue to surge through 2028. And for years the company ", "date_str": "2026-10-20T09:00:00+00:00", "hash": "64f22ae1579efa2d", "title_fa": "بازدید از هاب جدید و عظیم نیمه هادی سامسونگ", "summary_fa": "_____________ THE PLACE مدل های هوش مصنوعی مولد پیونگ تاک، کره جنوبی بر روی تراشه های قدرتمند معروف به GPU اجرا می شوند که به پشته های تراشه های حافظه تخصصی بسته بندی شده با پردازنده بستگی دارند. برای پاسخگویی به تقاضای فزاینده برای حافظه، سامسونگ در حال ساخت یک مجتمع جدید و عظیم تولید نیمه هادی در پیونگ تاک، کره جنوبی است. سه فاب در حال حاضر به صورت شبانه روزی کار می کنند و چهارمی در حال عرضه آنلاین است. ساخت پنجمین آن در طول کاهش تقاضا برای تراشه های حافظه در سال 2024 متوقف شد، اما زمانی که رونق هوش مصنوعی باعث افزایش تقاضا شد، دوباره شروع شد. درست قبل از ظهر روز دوشنبه است، و کارگران ساختمانی در پیونگ تاک، شهری کشاورزی در جنوب سئول، جایی که شالیزارهای برنج در کنار مجتمع عظیم چیپس‌سازی قرار دارند، از مغازه‌های تولیدی سامسونگ بیرون می‌روند. هزاران کارگر، سر تا پا سیاه پوشیده با جلیقه‌های آبی آسمانی، کلاه‌هایی را از سر برمی‌دارند که نام‌ها و شماره‌های آنها را نشان می‌دهد. آنها عرق کرده و برافروخته، با کفش های کتانی درشت که با محافظ های لاستیکی زرد انگشت پا پوشیده شده اند، به سمت ناهار می روند. برخی سوار اسکوتر یا موتورسیکلت می‌شوند تا در محوطه دانشگاه که منطقه‌ای به اندازه پارک مرکزی نیویورک را پوشش می‌دهد، بچرخند. آن‌ها در بوفه‌ها، غذاخوری‌ها و غذاخوری‌های گوشت گاو غذا می‌خورند و از کنار بنرهای تبلیغاتی اجاره‌های کوتاه‌مدت آپارتمان‌های استودیویی عبور می‌کنند. برخی برای پرس و جو به دفاتر املاک می روند و به همان پیشخوان هایی می روند که مهندسان حقوق بگیر سامسونگ خانه های جدید می خرند. جلوی
