layoffs-following-board-upheaval-and-executive-departures/", "summary": "Sources say more cuts could follow as the company looks to improve its finances.", "date_str": "2026-10-21T20:15:00+00:00", "hash": "ad406f9474ac31bc", "title_fa": "Automattic پس از تغییرات هیئت مدیره و خروج مدیران، اخراج کارکنان را آغاز می کند", "summary_fa": "منابع می گویند با توجه به اینکه شرکت به دنبال بهبود وضعیت مالی خود است، کاهش های بیشتری ممکن است دنبال شود. Automattic، شرکت مادر WordPress.com، WooCommerce، Tumblr، و دیگران، اخراج کارکنان خود را آغاز کرده است و خودی ها به ما می گویند که برای کاهش بیشتر آماده می شوند. حداقل در هفته گذشته، این کاهش ها بر تیم ارتباطات، تیم اجتماعی، WordPress.com و کسب و کار شرکت VIP تأثیر گذاشته است. این خروج نشان دهنده آشفتگی بیشتر در Automattic است، تیمی که هنوز درگیر تلاش ناموفق هیئت مدیره برای برکناری مت مولنوگ در ماه سپتامبر است که منجر به جابجایی کامل هیئت مدیره و خروج سایر مدیران از جمله مدیر مالی، مدیر مالی موقت و مدیر ارشد حقوقی شد. مگان فاکس، مدیر ارتباطات Automattic، هفته گذشته در لینکدین پستی درباره جدایی خود منتشر کرد و گفت که این انتقال پایانی غیرمنتظره بود و نقش او حذف شده است. در همین حال، پس از اینکه TechCrunch گزارش داد که جرمی کلاپرمن، مدیر مالی موقت Automattic اوایل این ماه، تنها چند هفته پس از تغییر هیئت مدیره، مولنوگ پستی در X منتشر کرد که نشان می‌دهد ممکن است کلاپرمن از تصمیم شرکت برای جستجوی نامزدهای خارجی برای ایفای این نقش آزرده شده باشد. (با این حال، ما شنیده بودیم که در داخل از کلاپرمن خواسته بود که در مورد ترک خود تجدید نظر کند.) طبق تصاویر مشاهده شده توسط TechCrunch، در یک مقطع، Mullenweg همچنین اطلاعات شخصی یکی از مدیرانی که اخیراً در Slack داخلی شرکت جدا شده بود، به اشتراک گذاشت. این پست مربوط به یک موضوع بهداشتی بود که همسر فرد را تحت تأثیر قرار داد و ادعا کرد که این شرکت بیمه بسیار مورد نیاز COBRA را به این شخص ارائه نمی دهد. مولنوگ گفت که مدیر اجرایی در این مورد تهدید به شکایت کرده است. مولنوگ"}, {"source": "TechCrunch Main", "title": "GM is betting compute and AI will help it compete with Chinese automakers", "link": "https://techcrunch.com/2026/10/21/gm-is-betting-compute-and-ai-will-help-it-compete-with-chinese-automakers/", "summary": "To compete with Tesla, Rivian, and a host of Chinese automakers, GM’s fourth-gen EV platform will roll out a new central computer and electrical architecture that will debut in 2028 in the Cadillac Escalade IQ.", "date_str": "2026-10-21T19:52:20+00:00", "hash": "53a872a2652638b6", "title_fa": "جنرال موتورز در حال محاسبه شرط بندی است و هوش مصنوعی به آن کمک می کند تا با خودروسازان چینی رقابت کند", "summary_fa": "پلتفرم نسل چهارم EV جنرال موتورز برای رقابت با تسلا، ریوین و تعدادی از خودروسازان چینی، یک کامپیوتر مرکزی و معماری الکتریکی جدید را عرضه خواهد کرد که در سال 2028 در کادیلاک اسکالید IQ معرفی خواهد شد. هنگامی که جنرال موتورز در روز چهارشنبه نسل چهارم پلتفرم EV جدید خود را معرفی کرد، چیزی که این خودروساز به اشتراک نمی گذاشت تقریباً به اندازه آنچه انجام داد قابل توجه بود. پلت فرم جدید EV که بخشی از مجموعه ای از اعلامیه های متمرکز بر فناوری است که در جریان رویداد سالانه GM Forward در نیویورک منتشر شد، در مورد هندسه سیستم تعلیق، نسبت داشبورد به محور و استحکام پیچشی صحبتی نکرد، که همگی اصطلاحات خودرویی نامطلوب هستند که به نحوه تجربه مردم از یک خودرو ترجمه می شوند. انعطاف پذیر است یا اسپرت؟ آیا موضعی تصفیه شده دارد؟ وقتی به چاله برخورد می‌کند، احساس می‌کند خزانه بانک یا بشقاب کاغذی است؟ در عوض، اعلامیه جنرال موتورز بر شیمی باتری جدید، موتورهای الکتریکی اصلاح شده، و یک پلت فرم محاسبات مرکزی کاملاً جدید و معماری الکتریکی متمرکز شد که همه سیستم‌های خودرو، از جمله شتاب و قدرت، فرمان، ترمز، و ویژگی‌های ایمنی فعال و همچنین نرم‌افزار را به هم متصل می‌کند. نرم افزارهای بسیار زیاد. استرلینگ اندرسون، معاون اجرایی، محصول جهانی و مدیر تولید جنرال موتورز، در مصاحبه اخیر با TechCrunch به TechCrunch گفت: اگر آنها را به فضاهایی تبدیل کنیم که زمینه را درک می کنند، اصطکاک را کاهش می دهند و لحظاتی را به مردم می بخشند که در غیر این صورت توسط خواسته های جاده مصرف می شود. از زمان ورود خودروسازان تسلا، ریوین و چینی، این صنعت مانند قبل نبوده است. سواری و هندلینگ همچنان مهم هستند، اما آنها جزء میز هستند. آنچه امروزه وسایل نقلیه را متمایز می کند تا حد زیادی توسط نرم افزار"}, {"source": "TechCrunch Main", "title": "Meta ordered to pay $25B in case related to Cambridge Analytica scandal", "link": "https://techcrunch.com/2026/10/21/meta-ordered-to-pay-25-billion-in-case-related-to-cambridge-analytica-scandal/", "summary": "The payout is related to a recent trial involving the social media giant that revolved around its data privacy practices.", "date_str": "2026-10-21T19:42:32+00:00", "hash": "2759158a5c47e67b", "title_fa": "متا به پرداخت 25 میلیارد دلار در پرونده مربوط به رسوایی کمبریج آنالیتیکا محکوم شد", "summary_fa": "این پرداخت مربوط به آزمایشی است که اخیراً مربوط به این غول رسانه‌های اجتماعی است که حول شیوه‌های حفظ حریم خصوصی داده‌ها می‌چرخد. داستان رسوایی داده های کمبریج آنالیتیکا طولانی است - و هزینه های هنگفتی برای متا دارد. نیویورک تایمز گزارش می دهد که روز چهارشنبه، یک قاضی به غول رسانه های اجتماعی دستور داد تا بزرگترین پرداخت خود را آغاز کند: 25 میلیارد دلار به ایالت نیومکزیکو برای نقش غول فناوری در فریب کاربران ساکن در مورد شیوه های حفظ حریم خصوصی داده هایش. این مبلغ هنگفت به دنبال یک محاکمه دو هفته ای است که در آن هیئت منصفه نیومکزیکو در مورد تخلفات ادعایی این شرکت به بحث و بررسی پرداختند. هیئت منصفه دریافت که شرکتی که پشت فیس بوک و اینستاگرام قرار دارد، 43 میلیون تخلف از قوانین حمایت از مصرف کننده ایالتی را مرتکب شده است که هر کدام 5000 دلار جریمه دارند. وال استریت ژورنال گزارش می دهد که بخشی از پرونده حول مدیریت یک برنامه شخص ثالث مرتبط با نقض داده های کمبریج آنالیتیکا از سوی شرکت می چرخد. بخش‌های دیگر شامل سیاست‌های حفظ حریم خصوصی داده‌ها و تلاش‌های آن برای کاهش اطلاعات نادرست در پلتفرم آن بود. کمبریج آنالیتیکا محصول یک پیمانکار دفاعی بریتانیا به نام SLC Group بود که در عملیات نفوذ و سایر کارهای سیاسی تخصص داشت. این شرکت به ویژه در طول انتخابات ریاست جمهوری 2016 با کمپین ترامپ همکاری می کرد. همچنین در تعدادی از ابتکارات بحث برانگیز شرکت داشت. رائول تورز، دادستان کل نیومکزیکو، در یک کنفرانس مطبوعاتی در اظهار نظر درباره حل این پرونده به خبرنگاران گفت: «ممکن است برای 100 سال آینده هزینه ساخت مدارس را پرداخته باشیم. سی جی ماهونی، مدیر ارشد حقوقی متا، در بیانیه ای که از طریق ایمیل با TechCrunch به اشتراک گذاشته شده است، گفت: این حکم و رویکرد دادستان"}, {"source": "TechCrunch Main", "title": "The internet is having a very bad cybersecurity day", "link": "https://techcrunch.com/2026/10/21/the-internet-is-having-a-very-bad-cybersecurity-day/", "summary": "From AI-discovered PHP vulnerabilities to flaws in Node.js and popular AI tool LiteLLM, cybersecurity teams have plenty to worry about this week.", "date_str": "2026-10-21T19:03:28+00:00", "hash": "01831d5c0af46377", "title_fa": "اینترنت روز بسیار بدی را در زمینه امنیت سایبری سپری می کند", "summary_fa": "از آسیب‌پذیری‌های PHP کشف‌شده توسط هوش مصنوعی گرفته تا نقص‌های Node.js و ابزار محبوب هوش مصنوعی LiteLLM، تیم‌های امنیت سایبری نگرانی‌های زیادی در مورد این هفته دارند. اینترنت از منظر امنیت سایبری روز بدی را سپری می کند. رویترز گزارش داد که وب سایت های دولتی در سرتاسر جهان پس از کشف آسیب پذیری های امنیتی حیاتی که بر زبان برنامه نویسی PHP توسط هوش مصنوعی تأثیر می گذاشت، آفلاین شدند. مسائل به حدی شدید بود که ایالات متحده آژانس امنیت ملی (NSA) به سازمان‌هایی که از PHP در سیستم‌های خود استفاده می‌کنند توصیه می‌کند که فوراً سیستم‌های خود را به‌روزرسانی یا آفلاین کنند تا زمانی که بتوانند. اما به روز رسانی PHP تنها دردسری نبود که امنیت سایبری در روز چهارشنبه با آن روبرو بود. Node.js، محیط اجرای متن‌باز جاوا اسکریپت، زمانی که به اشتراک گذاشت که چهار آسیب‌پذیری با شدت بالا به تازگی در آخرین نسخه خود اصلاح شده‌اند، یک شگفتی امنیتی برای خود ایجاد کرد. یکی اجازه اجرای کد از راه دور را می‌داد و دو مورد دیگر اجازه عبور اعتبار TLS را می‌دادند، که به طور بالقوه به مهاجمان اجازه می‌داد تا چک‌هایی را که برای تأیید هویت سرور در نظر گرفته شده بود دور بزنند. علاوه بر این، LiteLLM، یک پراکسی منبع باز محبوب برای مسیریابی درخواست‌ها به چندین ارائه‌دهنده LLM، توسط مهاجمی که کد مخرب تزریق کرده بود، در معرض خطر قرار گرفت، این شرکت در پستی در روز چهارشنبه بعد از ظهر در X به اشتراک گذاشت. در این پست اشاره شد که مصنوعات مخرب در PyPI (شاخص بسته پایتون)، Docker Hub و GHCR (رجیستری کانتینر GitHub) منتشر شدند. گفته می‌شود که این کد مخرب شامل یک دزد اطلاعات است که اعتبارنامه‌های ابری، گذرواژه‌ها و اعتبار سرویس‌های هوش مصنوعی را هدف قرار می‌دهد، به علاوه یک تروجان دسترسی از راه دور که می‌تواند"}, {"source": "TechCrunch Main", "title": "Legal AI startup Legora raises $550M Series E at $8.8B valuation", "link": "https://techcrunch.com/2026/10/21/legal-ai-startup-legora-raises-550m-series-e-at-8-8b-valuation/", "summary": "Legal AI startup Legora announced Wednesday that it raised a $550 million Series E round, valuing it at $8.8 billion.", "date_str": "2026-10-21T18:51:56+00:00", "hash": "2133037db2dc8702", "title_fa": "استارت‌آپ حقوقی هوش مصنوعی لگورا 550 میلیون دلار سری E را با ارزش 8.8 میلیارد دلار افزایش داد.", "summary_fa": "استارت‌آپ حقوقی هوش مصنوعی Legora روز چهارشنبه اعلام کرد که یک دور سری E با ارزش 550 میلیون دلار جمع‌آوری کرده است و ارزش آن را 8.8 میلیارد دلار برآورد کرده است. این شرکت به خودکارسازی و کمک به وظایف گردش کار برای متخصصان حقوقی کمک می کند، زیرا صنعت فراتر از دستیاران هوش مصنوعی به سمت خدمات هوش مصنوعی حرکت می کند که به آنها کمک می کند کار را انجام دهند. این خبر تنها یک ماه پس از آن منتشر شد که هاروی، بزرگترین رقیب لگورا، افزایش 550 میلیون دلاری با ارزش 15.5 میلیارد دلاری را اعلام کرد. در ماه مارس، هاروی همچنین اعلام کرد که درآمد دوره ای سالانه آن (ARR) بیش از 200 میلیون دلار است. سری E لگورا به دنبال اعلام ماه آوریل این شرکت مبنی بر تمدید 50 میلیون دلاری سری D سری D به ارزش 550 میلیون دلار است که ارزش شرکت را به 5.6 میلیارد دلار می رساند. در آن زمان، این شرکت گفت که ARR آن به 100 میلیون دلار رسیده است. این رقم در حال حاضر بیش از 200 میلیون دلار است، این شرکت روز چهارشنبه به اشتراک گذاشت. سرمایه گذاران در آخرین تامین مالی عبارتند از Atreides Management که رهبری دور را برعهده داشت و همچنین Baron Capital، Bessemer Venture Partners، General Catalyst، Menlo و دیگر نام های برتر. این شرکت قصد دارد از سرمایه جدید برای گسترش بیشتر در سراسر آمریکای شمالی استفاده کند. یک پاس بخرید، دومین جلد رایگان را در بوت کمپ موسس نهایی سال TechCrunch با آوردن هم بنیانگذار یا شریک خود به صورت رایگان کتاب قبل از انقضای قرارداد BOGO دریافت کنید مشترک شدن برای بزرگترین اخبار فناوری صنعت هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است."}, {"source": "TechCrunch Main", "title": "GM is giving OnStar an AI makeover", "link": "https://techcrunch.com/2026/10/21/gm-is-giving-onstar-an-ai-makeover/", "summary": "It's one of the biggest overhauls ever to the 30-year-old connected car product.", "date_str": "2026-10-21T18:00:00+00:00", "hash": "6640acf0cdaeaebd", "title_fa": "جنرال موتورز به OnStar تغییر هوش مصنوعی داده است", "summary_fa": "این یکی از بزرگترین تعمیرات اساسی در محصول 30 ساله خودروی متصل است. جنرال موتورز یک دستیار هوش مصنوعی شخصی را به OnStar به عنوان بخشی از تغییر گسترده‌تر خدمات خودروی متصل مبتنی بر اشتراک که این خودروساز آمریکایی 30 سال پیش راه‌اندازی کرد، اضافه می‌کند. این شرکت روز چهارشنبه در رویداد GM Forward خود در نیویورک گفت که دستیار هوش مصنوعی OnStar در 2027 کادیلاک لیریک EV 2027 در ماه‌های آینده معرفی خواهد شد و وسایل نقلیه GM بیشتری در پی خواهد داشت. این شرکت اعلام کرد که در سال 2027 یک اپلیکیشن موبایل جدید OnStar راه اندازی خواهد کرد که با نرم افزار داخل خودروی آن تکمیل و همگام خواهد شد. برنامه تلفن همراه جدید OnStar جایگزین برنامه فعلی OnStar Guardian خواهد شد که در سال 2020 راه اندازی شد و همچنین برنامه های برند خودرو برای Buick، Cadillac، Chevrolet و GMC. این راه‌اندازی مجدد مبتنی بر فناوری برخلاف سایر تلاش‌ها برای مدرن‌سازی OnStar است و به‌ویژه هوش مصنوعی عاملی را در مرکز قرار می‌دهد. این شرکت خدمات ایمنی و کمک‌های کنار جاده‌ای را بارها در تاریخ خود به‌روزرسانی کرده است، به‌ویژه در پنج سال گذشته زیرا تلاش کرده تا با رقبای نوظهور و پیشروی فناوری مانند تسلا همگام باشد. در سال 2021، این شرکت برنامه OnStar Guardian خود را گسترش داد، که تشخیص تصادف، کمک اضطراری و اشتراک‌گذاری موقعیت مکانی را به هر کسی که دارای تلفن سازگار بود، حتی اگر خودروی GM نداشت، ارائه داد. یک سال بعد، GM شروع به استفاده از Google Cloud AI Dialogflow کرد تا درخواست‌های گفتاری خاص را تشخیص دهد و در سال 2023 به رانندگان پاسخ داد تا به سؤالات رایجی مانند کمک مسیریابی و ناوبری پاسخ دهد - همه اینها بخشی از برنامه جنرال موتورز برای ایجاد یک تجارت اشتراک 25 میلیارد دلاری تا سال 2030 است."}, {"source": "VentureBeat Tech", "title": "Anthropic’s answer to Muse is here: Claude Duet, a mobile and desktop AI agent that takes actions proactively", "link": "https://venturebeat.com/technology/anthropics-answer-to-muse-is-here-claude-duet-a-mobile-and-desktop-ai-agent-that-takes-actions-proactively", "summary": "A missed customer email, an overdue invoice and a meeting scheduled at the wrong time can each create work that nobody planned to do. Anthropic wants its latest app to spot those problems and start handling them before a business owner or employee thinks to ask. Read more", "date_str": "2026-10-21T20:44:38+00:00", "hash": "0b9b5ba7800245e4", "title_fa": "پاسخ Anthropic به Muse اینجاست: Claude Duet، یک عامل هوش مصنوعی تلفن همراه و دسکتاپ که اقدامات پیشگیرانه را انجام می دهد.", "summary_fa": "یک ایمیل مشتری از دست رفته، یک فاکتور عقب افتاده و یک جلسه در زمان نامناسب هر کدام می توانند کاری را ایجاد کنند که هیچ کس برای انجام آن برنامه ریزی نکرده است. Anthropic می‌خواهد آخرین برنامه‌اش این مشکلات را شناسایی کرده و قبل از اینکه صاحب کسب‌وکار یا کارمند بخواهد بخواهد شروع به رسیدگی کند. ادامه مطلب"}, {"source": "VentureBeat Tech", "title": "Deel launches Pangaea AI models for HR and payroll, betting specialists can cut the cost of answers by 98%", "link": "https://venturebeat.com/technology/deel-launches-pangaea-ai-models-for-hr-and-payroll-betting-specialists-can-cut-the-cost-of-answers", "summary": "An HR team asking an AI assistant about employee leave needs more than a convincing explanation. It needs the correct rule for the country involved, quickly enough to help someone make a decision before an error reaches a paycheck. Read more", "date_str": "2026-10-21T16:28:28+00:00", "hash": "ea4d2f6e30aeeb94", "title_fa": "Deel مدل های هوش مصنوعی Pangea را برای منابع انسانی و حقوق و دستمزد راه اندازی می کند، متخصصان شرط بندی می توانند هزینه پاسخ ها را تا 98٪ کاهش دهند.", "summary_fa": "یک تیم منابع انسانی که از یک دستیار هوش مصنوعی در مورد مرخصی کارمندان می پرسد به چیزی بیش از توضیح قانع کننده نیاز دارد. به قانون صحیح برای کشور درگیر نیاز دارد، آنقدر سریع که به کسی کمک کند قبل از اینکه خطا به یک چک حقوقی برسد تصمیم بگیرد. ادامه مطلب"}, {"source": "Ars Technica", "title": "Forget \"Malaise 2.0,\" GM says it's still all-in on EVs and autonomy", "link": "https://arstechnica.com/cars/2026/10/forget-malaise-2-0-gm-says-its-still-all-in-on-evs-and-autonomy/", "summary": "GM provided flights from Detroit to New York and accommodation so Ars could attend the GM Future event. Ars does not accept paid editorial content. It’s easy to criticize US automakers and their tepid approach to electric vehicles under the current administration and the expiration of the EV tax credit . It’s also easy to look at the rest of the world's embrace of EVs and wonder if the US is entering a “Malaise 2.0” era. Which is why GM wants the world to know that it is still focused on its end goals of electrification, autonomy, and improving vehicle quality while reducing development time. At this year’s GM Forward event, company executives announced that its hands-off, eyes-off Super Cruise technology will expand across the lineup and be available on nearly every vehicle. This will include the pickup trucks and the crossovers, and not just the Escalade IQ that it was announced for last year. Sterling Anderson, GM’s head of product, said the company is testing this technology to the tune of 1 million miles (1.6 million km) a month in both the virtual and real world. The goal is that not only would the vehicle be able to take you places, but it could go and do things for you. Read full article Comments", "date_str": "2026-10-22T13:04:32+00:00", "hash": "7c3a68503fb614ac", "title_fa": "«Malaise 2.0» را فراموش کنید، جنرال موتورز می‌گوید که هنوز همه‌چیز در خودروهای برقی و خودمختاری است.", "summary_fa": "جنرال موتورز پروازهایی از دیترویت به نیویورک و محل اقامت فراهم کرد تا Ars بتواند در رویداد GM Future شرکت کند. Ars محتوای تحریریه پولی را نمی پذیرد. انتقاد از خودروسازان آمریکایی و رویکرد ملایم آنها نسبت به خودروهای الکتریکی در دولت فعلی و انقضای اعتبار مالیاتی خودروهای الکتریکی آسان است. همچنین به راحتی می توان به استقبال سایر نقاط جهان از خودروهای برقی نگاه کرد و تعجب کرد که آیا ایالات متحده وارد عصر \"مالایز 2.0\" می شود یا خیر. به همین دلیل است که جنرال موتورز می‌خواهد جهان بداند که هنوز بر روی اهداف نهایی خود یعنی برقی‌سازی، خودمختاری و بهبود کیفیت خودرو و در عین حال کاهش زمان توسعه متمرکز است. در رویداد امسال GM Forward، مدیران این شرکت اعلام کردند که فناوری Super Cruise دست‌آلود و چشم‌آلود آن در سراسر خط تولید گسترش خواهد یافت و تقریباً در هر خودرویی در دسترس خواهد بود. این شامل پیکاپ تراک ها و کراس اوورها می شود و نه فقط Escalade IQ که سال گذشته برای آن معرفی شد. استرلینگ اندرسون، رئیس محصولات جنرال موتورز، گفت که این شرکت در حال آزمایش این فناوری به میزان 1 میلیون مایل (1.6 میلیون کیلومتر) در ماه در دنیای مجازی و واقعی است. هدف این است که نه تنها وسیله نقلیه بتواند شما را جاهایی ببرد، بلکه بتواند برود و کارهایی را برای شما انجام دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش انتقاد از خودروسازان ایالات متحده و رویکرد ملایم آنها در مورد خودروهای الکتریکی تحت دولت فعلی و انقضای اعتبار مالیاتی خودروهای الکتریکی آسان است. همچنین به راحتی می توان به استقبال سایر نقاط جهان از خودروهای برقی نگاه کرد و تعجب کرد که آیا ایالات متحده"}, {"source": "Ars Technica", "title": "333 Tor exit nodes hijacked to intercept SSH traffic and retrieve plaintext email", "link": "https://arstechnica.com/information-technology/2026/10/300-tor-exit-nodes-hijacked-to-intercept-ssh-traffic-and-retrieve-plaintext-email/", "summary": "Unknown hackers hijacked more than 300 Tor exit nodes and reconfigured them to favor unencrypted email traffic and redirect SSH connections through servers they controlled, a researcher reported Tuesday. The hijacking began in late August, when, according to Tor volunteers , the attacker used a valid password that had been reused to gain access to a Tor management server. The attacker then installed Ebury , a backdoor written for Linux that was discovered 12 years ago. Mysteries remain Then the attacker connected from the management server to a second Tor server, called Switzerland2, through SSH, using an RSA key that, for unknown reasons, investigators couldn’t find among Switzerland2’s authorized keys. With administrative control of Switzerland2, the attackers installed Ebury there as well. Finally, the attacker reconfigured settings on two exit nodes that Switzerland2 hosted. Read full article Comments", "date_str": "2026-10-22T11:30:33+00:00", "hash": "acc9740256bf019d", "title_fa": "333 گره خروج Tor برای رهگیری ترافیک SSH و بازیابی ایمیل متن ساده ربوده شدند", "summary_fa": "یک محقق روز سه شنبه گزارش داد که هکرهای ناشناس بیش از 300 گره خروج Tor را ربودند و آنها را برای حمایت از ترافیک ایمیل رمزگذاری نشده و هدایت اتصالات SSH از طریق سرورهای تحت کنترل خود مجدداً پیکربندی کردند. ربودن هواپیما در اواخر آگوست آغاز شد، زمانی که به گفته داوطلبان Tor، مهاجم از رمز عبور معتبری استفاده کرد که برای دسترسی مجدد به سرور مدیریت Tor استفاده شده بود. سپس مهاجم Ebury را نصب کرد، یک درب پشتی نوشته شده برای لینوکس که 12 سال پیش کشف شد. اسرار باقی می ماند سپس مهاجم از طریق SSH از سرور مدیریت به سرور دوم Tor به نام Switzerland2 وصل شد و با استفاده از یک کلید RSA که به دلایل نامعلومی، محققان نتوانستند در میان کلیدهای مجاز Switzerland2 پیدا کنند. با کنترل اداری Switzerland2، مهاجمان Ebury را نیز در آنجا نصب کردند. در نهایت، مهاجم تنظیمات را روی دو گره خروجی که Switzerland2 میزبانی می کرد، دوباره پیکربندی کرد. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید هکرهای ناشناس بیش از 300 گره خروج Tor را ربودند و آنها را به گونه ای تنظیم کردند که ترافیک ایمیل رمزگذاری نشده و هدایت اتصالات SSH از طریق سرورهایی که سه شنبه گزارش داده اند را از طریق سرورهایی که سه شنبه گزارش داده اند، هدایت کنند. در نهایت، 333 رله خروج در SSH و کمپین رهگیری ایمیل دخیل بودند، اگرچه بازرسان مشخص نکرده‌اند که چگونه مهاجمان کنترل همه سرورهای اساسی را به دست آورده‌اند. سپس مهاجمان سرورها را مجدداً پیکربندی کردند. مجموعه ای از تغییرات، ترافیک SSH را که Tor عبور می کرد به یکی از ۱۲ سرور رهگیر کنترل شده توسط مهاجم هدایت کرد. کاربران Tor که هشدارهایی مبنی بر"}, {"source": "Ars Technica", "title": "UN says we're going to blow past 1.5º warming, offers a \"now what?\" answer", "link": "https://arstechnica.com/science/2026/10/un-accepts-the-obvious-were-not-going-to-avoid-a-1-5o-c-warming/", "summary": "In 2015, all but two countries agreed to make an effort to keep global temperatures from reaching 1.5° C above pre-industrial readings. Since then, most of the world has largely treated what they signed on to as aspirational, and one of the largest emitters (the US) has alternately withdrawn and recommitted to the agreement. Meanwhile, the planet has responded as expected to steadily rising carbon emissions and appears to be practically at the 1.5° limit. On Wednesday, for the first time, the United Nations Environmental Programme (UNEP) acknowledged that reality , and conceded that the goal of keeping warming below 1.5° was no longer a viable one. Instead, its new goalposts focus on keeping both how long we exceed that limit and how much we exceed it by, at a minimum. Doing that will require both dramatic emissions cuts now and the removal of hundreds of gigatonnes of carbon dioxide from the atmosphere before the century is out. Bowing to the inevitable Depending on which baseline you use to establish pre-industrial temperatures, as well as which reconstruction of global temperatures you rely on, the world has either gotten very close to, or already exceeded the 1.5° milestone. The current El Niño event, which appears exceptionally strong, will almost certainly mean that we've gone over it no matter which records you choose. Read full article Comments", "date_str": "2026-10-22T11:15:36+00:00", "hash": "bb80b1d8a8a72e50", "title_fa": "سازمان ملل می گوید که ما از 1.5 درجه گرمایش عبور خواهیم کرد، پیشنهاد می کند \"حالا چه؟\" پاسخ دهید", "summary_fa": "در سال 2015، همه کشورها به جز دو کشور توافق کردند که تلاش کنند دمای جهانی را از رسیدن به 1.5 درجه سانتیگراد بالاتر از دمای پیش از صنعتی شدن حفظ کنند. از آن زمان، بیشتر کشورهای جهان تا حد زیادی آنچه را که بر روی آن امضا کرده‌اند، آرزویی تلقی کرده‌اند، و یکی از بزرگترین تولیدکنندگان گاز (ایالات متحده آمریکا) متناوبا عقب‌نشینی کرده و مجدداً به این توافق متعهد شده است. در همین حال، این سیاره همانطور که انتظار می رود به افزایش پیوسته انتشار کربن واکنش نشان داده است و به نظر می رسد عملاً در حد 1.5 درجه باشد. روز چهارشنبه، برای اولین بار، برنامه محیط زیست سازمان ملل متحد (UNEP) این واقعیت را پذیرفت و پذیرفت که هدف حفظ گرمایش زیر 1.5 درجه دیگر قابل اجرا نیست. در عوض، اهداف جدید آن بر روی حفظ حداقل مدت زمانی که از آن حد فراتر می‌رویم و اینکه چقدر از آن فراتر می‌رویم، تمرکز می‌کنند. انجام این کار نیازمند کاهش چشمگیر انتشار گازهای گلخانه ای در حال حاضر و حذف صدها گیگاتن دی اکسید کربن از جو قبل از پایان قرن است. تعظیم در برابر اجتناب ناپذیر بسته به اینکه از کدام خط پایه برای ایجاد دمای پیش از صنعتی شدن استفاده می کنید، و همچنین بازسازی دمای جهانی که بر آن تکیه می کنید، جهان یا بسیار به نقطه عطف 1.5 درجه نزدیک شده یا از آن فراتر رفته است. رویداد فعلی ال نینو، که به‌طور استثنایی قوی به نظر می‌رسد، تقریباً به این معنی است که ما بدون توجه به اینکه کدام رکورد را انتخاب کرده‌اید، از آن عبور کرده‌ایم. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری در سال 2015، همه کشورها به"}, {"source": "Ars Technica", "title": "FCC chair warns media not to run the \"fake polls\" Trump keeps complaining about", "link": "https://arstechnica.com/tech-policy/2026/10/fcc-chair-warns-media-not-to-run-the-fake-polls-trump-keeps-complaining-about/", "summary": "Federal Communications Commission Chairman Brendan Carr today warned broadcasters about airing \"fake polls,\" amplifying one of the many complaints that President Trump has regularly made about the news media. Carr's post on X said, \"Many journalists and broadcasters have been amplifying or airing these Polls without regard to basic journalistic ethics and without informing the public that those Polls lack a scientific, accurate, or even real basis... Broadcasters are advised to avoid engaging in News Distortions or running Broadcast Hoaxes by airing Polls that would violate their regulatory obligations.\" Carr urged broadcasters to \"provide their viewers with additional context and information about Polls they have covered.\" In fact, one small polling outfit was exposed as a hoax this week, and a similar incident occurred in August. News outlets have reported on these hoaxes, providing the very \"context\" that Carr said is needed. Read full article Comments", "date_str": "2026-10-21T22:17:50+00:00", "hash": "df7589c162be47e1", "title_fa": "رئیس FCC به رسانه‌ها هشدار داد که «نظرسنجی‌های جعلی» را که ترامپ مدام از آن شکایت می‌کند، انجام ندهند", "summary_fa": "برندان کار، رئیس کمیسیون ارتباطات فدرال، امروز به پخش‌کنندگان در مورد پخش «نظرسنجی‌های جعلی» هشدار داد، که یکی از شکایات بسیاری را که رئیس‌جمهور ترامپ مرتباً از رسانه‌های خبری مطرح می‌کند، تشدید می‌کند. پست کار در X می‌گوید: «بسیاری از روزنامه‌نگاران و پخش‌کننده‌ها این نظرسنجی‌ها را بدون توجه به اصول اولیه اخلاق روزنامه‌نگاری و بدون اطلاع عموم مردم مبنی بر اینکه این نظرسنجی‌ها فاقد مبنای علمی، دقیق یا حتی واقعی هستند، تقویت یا پخش می‌کنند. به پخش‌کنندگان توصیه می‌شود از شرکت در تحریف‌های خبری یا اجرای حقه‌های پخش با پخش نظرسنجی‌هایی که تعهدات قانونی آن‌ها را نقض می‌کند، خودداری کنند.» کار از پخش‌کننده‌ها خواست که «زمینه و اطلاعات بیشتری درباره نظرسنجی‌هایی که پوشش داده‌اند در اختیار بینندگان خود قرار دهند.» در واقع، یک دستگاه نظرسنجی کوچک در این هفته به‌عنوان یک فریب افشا شد، و یک رویداد مشابه در اوت گزارش شد. که کار گفت لازم است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید، برندان کار، رئیس کمیسیون ارتباطات فدرال، امروز به پخش‌کننده‌ها در مورد پخش «نظرسنجی‌های جعلی» هشدار داد، که یکی از شکایات بسیاری را که رئیس‌جمهور ترامپ مرتباً درباره اخبار مطرح می‌کند، تقویت کرد. پست کار در X می‌گوید: «بسیاری از روزنامه‌نگاران و پخش‌کننده‌ها این نظرسنجی‌ها را بدون توجه به اصول اخلاقی روزنامه‌نگاری و بدون اطلاع عموم مردم مبنی بر اینکه این نظرسنجی‌ها فاقد مبنای علمی، دقیق یا حتی واقعی هستند، تقویت یا پخش می‌کنند... به پخش‌کنندگان توصیه می‌شود از درگیر شدن در تحریف اخبار یا اجرای فریب‌های پخش با پخش نظرسنجی‌هایی که تعهدات نظارتی آنها را نقض می‌کند، خودداری کنند.»"}, {"source": "Ars Technica", "title": "Xbox wants you to pay 24 to 40 cents per hour to stream games you already bought", "link": "https://arstechnica.com/gaming/2026/10/xbox-wants-you-to-pay-24-to-40-cents-per-hour-to-stream-games-you-already-bought/", "summary": "In September, when Microsoft severely limited the game-streaming buffet available to Game Pass subscribers , the company said non-subscribers would soon be able to \"purchase cloud playtime hours through the Xbox Store and stream eligible games they own on supported devices.\" Today, Microsoft rolled out those a la carte Cloud Playtime purchases to Xbox Insiders, with prices that might be a bit galling for players who have already purchased these streamable games. The \"introductory launch pricing\" for Xbox's Cloud Playtime purchases is as follows: 10 hours for $4 (~$0.40/hour) 25 hours for $8 (~$0.32/hour) 50 hours for $12 (~$0.24/hour) Purchased playtime \"remains available until it’s used,\" Microsoft writes, so you don't have to worry about your 50-hour purchase expiring before you can use it fully. Read full article Comments", "date_str": "2026-10-21T22:06:07+00:00", "hash": "5a441058dc733582", "title_fa": "ایکس‌باکس از شما می‌خواهد برای پخش بازی‌هایی که قبلاً خریداری کرده‌اید، 24 تا 40 سنت در ساعت بپردازید", "summary_fa": "در ماه سپتامبر، زمانی که مایکروسافت به شدت بوفه پخش جریانی بازی را برای مشترکین Game Pass محدود کرد، این شرکت گفت که غیر مشترکین به زودی می‌توانند «ساعت‌های پخش ابری را از طریق فروشگاه Xbox خریداری کنند و بازی‌های واجد شرایطی را که دارند در دستگاه‌های پشتیبانی‌شده پخش کنند». امروز، مایکروسافت آن خریدهای کارتی Cloud Playtime را برای Xbox Insiders عرضه کرد، با قیمت‌هایی که ممکن است برای بازیکنانی که قبلاً این بازی‌های قابل پخش را خریداری کرده‌اند کمی دلخراش باشد. «قیمت راه‌اندازی مقدماتی» برای خریدهای Xbox Cloud Playtime به شرح زیر است: 10 ساعت برای 4 دلار (~ 0.40 دلار در ساعت) 25 ساعت برای 8 دلار (~0.32 دلار در ساعت) 50 ساعت برای 12 دلار (~0.24 دلار در ساعت) زمان پخش خریداری شده، بنابراین مایکروسافت نگران نباشید تا زمانی که آن را بنویسید، از آن استفاده نکنید. خرید 50 ساعته قبل از اینکه بتوانید به طور کامل از آن استفاده کنید منقضی می شود. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید در ماه سپتامبر، زمانی که مایکروسافت بوفه پخش بازی را در دسترس مشترکان Game Pass به شدت محدود کرد، این شرکت گفت که غیر مشترکین به زودی می‌توانند «بازی‌های پخش جریانی را در فروشگاه e-box بخرند و ساعت‌های پخش خود را از طریق Xlig Store پشتیبانی کنند». امروز، مایکروسافت آن خریدهای کارتی Cloud Playtime را برای Xbox Insiders عرضه کرد، با قیمت‌هایی که ممکن است برای بازیکنانی که قبلاً این بازی‌های قابل پخش را خریداری کرده‌اند کمی دلخراش باشد. مایکروسافت می‌نویسد: «قیمت راه‌اندازی مقدماتی» برای خریدهای Xbox Cloud Playtime به شرح زیر است: مایکروسافت می‌نویسد زمان پخش خریداری‌شده «تا زمانی که استفاده نشود در دسترس است»، بنابراین لازم نیست قبل از اینکه بتوانید به طور کامل از آن"}, {"source": "Ars Technica", "title": "Enterprises keep buying software upgrades that IT thinks will make things worse", "link": "https://arstechnica.com/information-technology/2026/10/survey-enterprises-waste-28-percent-of-software-budgets-on-unwanted-upgrades/", "summary": "Enterprise-sized businesses spend, on average, 28 percent of their software budgets on unwanted upgrades, migrations, and licensing changes. Often, those firms' IT heads think those changes are detrimental. Those results are according to a survey of 2,018 chief information officers and senior IT decision-makers at companies with at least 10,000 employees that Origina commissioned for its report, “ The Software Tax .” About half of the respondents (1,011) are from the US, and the rest are from the United Kingdom. All respondents worked at companies with at least $1 billion in annual revenue. Keep in mind that Origina provides maintenance for various enterprise software. Its report points to independent software maintenance as a way for IT leaders to regain control over software budgets, illustrating its potential bias. A third-party research consultancy, Censuswide , conducted the survey. Read full article Comments", "date_str": "2026-10-21T21:48:52+00:00", "hash": "c4d1637463669f38", "title_fa": "شرکت‌ها به خرید ارتقاء نرم‌افزاری ادامه می‌دهند که IT فکر می‌کند اوضاع را بدتر می‌کند", "summary_fa": "کسب و کارهای بزرگ به طور متوسط ​​28 درصد از بودجه نرم افزاری خود را صرف ارتقاء ناخواسته، مهاجرت و تغییرات مجوز می کنند. اغلب، مدیران فناوری اطلاعات آن شرکت ها فکر می کنند که این تغییرات مضر است. این نتایج بر اساس نظرسنجی از 2018 مدیر ارشد اطلاعات و تصمیم گیرندگان ارشد فناوری اطلاعات در شرکت هایی با حداقل 10000 کارمند است که Origina برای گزارش خود با عنوان \"مالیات نرم افزار\" سفارش داده است. حدود نیمی از پاسخ دهندگان (1011) اهل ایالات متحده و بقیه از بریتانیا هستند. همه پاسخ دهندگان در شرکت هایی با حداقل یک میلیارد دلار درآمد سالانه کار می کردند. به خاطر داشته باشید که Origina برای نرم افزارهای مختلف سازمانی نگهداری می کند. گزارش آن به نگهداری مستقل نرم‌افزار به عنوان راهی برای رهبران فناوری اطلاعات جهت بازیابی کنترل بر بودجه‌های نرم‌افزار اشاره می‌کند و این نشان‌دهنده‌ی سوگیری بالقوه‌ی آن است. یک شرکت مشاوره تحقیقاتی شخص ثالث به نام Censuswide این نظرسنجی را انجام داده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید کسب و کارهای با اندازه سازمانی به طور متوسط ​​28 درصد از بودجه نرم افزاری خود را صرف ارتقاء ناخواسته، مهاجرت و تغییرات مجوز می کنند. اغلب، مدیران فناوری اطلاعات آن شرکت‌ها فکر می‌کنند که این تغییرات مضر هستند. در میان نگران‌کننده‌ترین یافته‌های گزارش، شرکت‌ها اغلب نرم‌افزارهایی را خریداری می‌کنند که مدیران فناوری اطلاعات معتقدند می‌تواند به سازمان آسیب برساند. در این گزارش آمده است: 95 درصد از پاسخ دهندگان گفتند: \"سازمان آنها برای ارتقاء، مهاجرت یا تغییر مجوز مبتنی بر فروشنده در سه سال گذشته پرداخت کرده است که در آن زمان معتقد بود عملکرد، قابلیت اطمینان یا ارزش تجاری را کاهش می دهد.\" این گزارش"}, {"source": "Ars Technica", "title": "Tesla profits drop 43% in Q3", "link": "https://arstechnica.com/cars/2026/10/tesla-profits-drop-43-in-q3/", "summary": "Tesla published its third-quarter 2026 financial results this afternoon. Earlier in October, it reported its sales and deliveries for the three-month period, selling fewer cars than in the same quarter in 2025 , yet it still beat analyst projections. Now we can see how those sales translate to the bottom line. Tesla brought in $28 billion in revenue in Q3, almost the same as in 2025. Automotive revenues were $20.6 billion, a 3 percent decrease year over year. Perhaps more troubling is the decline in revenue from solar panels and storage batteries—this line of business had been growing, but for Q3 revenue fell 16 percent year over year to $2.9 billion. Services and other revenues, though, which include parts and Supercharger use, grew by a third to $4.6 billion. But the company—like the rest of us—has seen its expenses go up. Operating expenses rose by 39 percent to $4.8 billion, dropping the company’s operating margin to just 2.6 percent; in Q3 2025, Tesla’s margin was 5.8 percent. Net profit fell to $787 million, down 43 percent year over year. What’s more, capital expenditures were up by 110 percent to $4.7 billion, and free cash flow was down 62 percent to $1.5 billion. Read full article Comments", "date_str": "2026-10-21T21:35:07+00:00", "hash": "20956b23635bf6e9", "title_fa": "سود تسلا در سه ماهه سوم 43 درصد کاهش یافت", "summary_fa": "تسلا امروز بعدازظهر نتایج مالی سه ماهه سوم سال 2026 خود را منتشر کرد. پیش از این در ماه اکتبر، فروش و تحویل خود را برای دوره سه ماهه گزارش کرد و خودروهای کمتری نسبت به سه ماهه مشابه در سال 2025 فروخت، اما همچنان پیش بینی های تحلیلگران را شکست داد. اکنون می‌توانیم ببینیم که این فروش‌ها چگونه به نتیجه نهایی تبدیل می‌شوند. تسلا در سه ماهه سوم 28 میلیارد دلار درآمد داشت که تقریباً مشابه سال 2025 بود. درآمد خودرو 20.6 میلیارد دلار بود که 3 درصد نسبت به سال گذشته کاهش داشت. شاید نگران‌کننده‌تر کاهش درآمد از پنل‌های خورشیدی و باتری‌های ذخیره‌سازی باشد – این خط کسب‌وکار در حال رشد بود، اما درآمد سه‌ماهه سوم نسبت به سال گذشته ۱۶ درصد کاهش یافت و به ۲.۹ میلیارد دلار رسید. خدمات و سایر درآمدها، که شامل قطعات و استفاده از سوپرشارژر می شود، با یک سوم رشد به 4.6 میلیارد دلار رسید. اما شرکت - مانند بقیه ما - شاهد افزایش هزینه‌هایش بوده است. هزینه های عملیاتی با 39 درصد افزایش به 4.8 میلیارد دلار رسید و حاشیه عملیاتی شرکت را به 2.6 درصد کاهش داد. در سه ماهه سوم 2025، حاشیه سود تسلا 5.8 درصد بود. سود خالص به 787 میلیون دلار کاهش یافت که نسبت به سال گذشته 43 درصد کاهش داشت. علاوه بر این، مخارج سرمایه با 110 درصد افزایش به 4.7 میلیارد دلار و جریان نقدی آزاد با 62 درصد کاهش به 1.5 میلیارد دلار رسید. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید تسلا نتایج مالی سه ماهه سوم 2026 خود را امروز بعد از ظهر منتشر کرد. پیش از این در ماه اکتبر، فروش و تحویل خود را برای دوره سه ماهه گزارش کرد و"}, {"source": "Ars Technica", "title": "The new human-crafted Apple Music brand matters in an AI world", "link": "https://arstechnica.com/culture/2026/10/the-new-human-crafted-apple-music-brand-matters-in-an-ai-world/", "summary": "Apple just revealed a new brand identity for Apple Music, with the expected turn to Liquid Glass. I’m not much of a fan of their new design language in general; this is where I admit that I’m still running MacOS Sequoia and have grumpy things to say about rounded corner radii and text legibility. It’s just a trend, it will pass, and at some point I’ll probably cave and upgrade when it starts actually affecting my ability to get work done, or more importantly get security updates. Once I adjust, I’ll stop noticing it, and life will go on. As such, I wouldn’t normally find an obvious rebrand like this notable, much less feel like I had much to say about it. But then I happened to catch Apple’s behind-the-scenes video in my YouTube recommendations, and I realized I did have thoughts. Read full article Comments", "date_str": "2026-10-21T19:44:40+00:00", "hash": "ca990b0d2554d01c", "title_fa": "برند جدید Apple Music ساخته شده توسط انسان در دنیای هوش مصنوعی اهمیت دارد", "summary_fa": "اپل به تازگی هویت نام تجاری جدیدی را برای Apple Music فاش کرده است، با چرخش مورد انتظار به Liquid Glass. من به طور کلی خیلی از طرفداران زبان طراحی جدید آنها نیستم. اینجاست که اعتراف می‌کنم که هنوز از MacOS Sequoia استفاده می‌کنم و چیزهای بدی در مورد شعاع گوشه‌های گرد و خوانایی متن دارم. این فقط یک روند است، می گذرد، و زمانی که شروع به تأثیرگذاری بر توانایی من برای انجام کار، یا مهم تر از آن دریافت به روز رسانی های امنیتی کند، احتمالاً غافل می شوم و ارتقا می دهم. زمانی که من خودم را تنظیم کنم، دیگر متوجه آن نمی شوم و زندگی ادامه خواهد داشت. به این ترتیب، من معمولاً یک تغییر نام تجاری آشکار مانند این قابل توجه نمی یابم، خیلی کمتر احساس می کنم چیز زیادی برای گفتن در مورد آن دارم. اما پس از آن اتفاقاً ویدیوی پشت صحنه اپل را در توصیه‌های یوتیوب خود دیدم و متوجه شدم که افکاری داشتم. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش اپل به تازگی هویت نام تجاری جدیدی را برای Apple Music آشکار کرد، با چرخش مورد انتظار به Liquid Glass. من به طور کلی خیلی از طرفداران زبان طراحی جدید آنها نیستم. اینجاست که اعتراف می‌کنم که هنوز از MacOS Sequoia استفاده می‌کنم و چیزهای بدی در مورد شعاع گوشه‌های گرد و خوانایی متن دارم. این یک کلیپ کوتاه است که اگر می‌خواهید خودتان آن را تماشا کنید، کمی بیش از یک دقیقه طول می‌کشد. بیایید بخش واضح را از سر راه برداریم: اپل بسیار اوج است. بیش از کمی ادعایی، با تمام منابع، ارزش بازار 5 تریلیون دلاری می تواند برای هر مشکلی به ارمغان بیاورد. یک"}, {"source": "Ars Technica", "title": "RIP BioWare: EA shuts down storied RPG studio after over three decades", "link": "https://arstechnica.com/gaming/2026/10/rip-bioware-ea-shuts-down-storied-rpg-studio-after-over-three-decades/", "summary": "The legendary studio behind series like Mass Effect , Dragon Age , Neverwinter Nights , and Star Wars: Knights of the Old Republic is no more. BioWare announced via social media Wednesday afternoon that \"after more than three decades of shared adventures, BioWare is closing and early development on the next Mass Effect project is ending.\" The official announcement was posted mere minutes after a Bloomberg report detailed 400 job cuts across BioWare parent company Electronic Arts, including 50 at BioWare, based on reports from \"a person familiar with the company's plans.\" \"Across our portfolio, we’re making deliberate choices to align talent and investments where we see the greatest opportunities for players and long-term growth,\" EA executives wrote in a message to staff, according to Bloomberg. Read full article Comments", "date_str": "2026-10-21T19:12:16+00:00", "hash": "4fc5cac4a31bbd83", "title_fa": "RIP BioWare: EA استودیوی RPG را پس از بیش از سه دهه تعطیل می کند", "summary_fa": "استودیوی افسانه ای پشت مجموعه هایی مانند Mass Effect، Dragon Age، Neverwinter Nights، و Star Wars: Knights of the Old Republic دیگر وجود ندارد. BioWare بعد از ظهر چهارشنبه از طریق رسانه های اجتماعی اعلام کرد که \"پس از بیش از سه دهه ماجراجویی مشترک، BioWare در حال بسته شدن است و توسعه اولیه پروژه بعدی Mass Effect به پایان می رسد.\" این اطلاعیه رسمی تنها دقایقی پس از گزارش بلومبرگ منتشر شد که بر اساس گزارش‌های «یکی از افراد آشنا با برنامه‌های این شرکت»، 400 شغل را در شرکت مادر BioWare، Electronic Arts، شامل 50 مورد در BioWare کاهش داد. بر اساس گزارش بلومبرگ، مدیران EA در پیامی به کارکنان نوشتند: «در سراسر مجموعه خود، ما در حال انجام انتخاب‌های عمدی هستیم تا استعدادها و سرمایه‌گذاری‌ها را در جایی که بیشترین فرصت‌ها را برای بازیکنان و رشد طولانی‌مدت مشاهده کنیم، انتخاب می‌کنیم. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید برای پیمایش به حداقل برسانید استودیوی افسانه‌ای پشت مجموعه‌هایی مانند Mass Effect، عصر اژدها، Neverwinter Nights، و Star Wars: Knights of the Old Republic دیگر وجود ندارد. BioWare بعد از ظهر چهارشنبه از طریق رسانه های اجتماعی اعلام کرد که \"پس از بیش از سه دهه ماجراجویی مشترک، BioWare در حال بسته شدن است و توسعه اولیه پروژه بعدی Mass Effect به پایان می رسد.\" به گزارش بلومبرگ، مدیران EA در پیامی به کارکنان نوشتند: «در سراسر مجموعه خود، ما در حال انجام انتخاب‌های عمدی هستیم تا استعدادها و سرمایه‌گذاری‌ها را در جایی که بیشترین فرصت‌ها را برای بازیکنان و رشد بلندمدت می‌بینیم، انجام دهیم. پس از تأسیس در سال 1995 در ادمونتون، آلبرتا، BioWare برای اولین بار از طریق خرید در سال 2007 تحت چتر EA قرار گرفت، قبل از"}, {"source": "Ars Technica", "title": "OpenAI's latest AI models are coming to Google Cloud and Antigravity", "link": "https://arstechnica.com/ai/2026/10/openais-latest-ai-models-are-coming-to-google-cloud-and-antigravity/", "summary": "Google would certainly prefer that everyone used its Gemini models with Google Cloud services, but soon, you'll have more options. OpenAI and Google have come to an arrangement that will see the former's frontier models arrive in Google Cloud services. Perhaps more importantly, GPT models will soon appear in Antigravity, Google's agent-powered coding tool. For enterprise customers and AI enthusiasts, OpenAI's latest model will appear in Google's \"Model Garden\" in the coming weeks, adding to its 200-plus options. The garden already offers access to Google's Gemini models, as well as an assortment of open models like Mistral, Llama, and Gemma. Anthropic's Claude AI has also been available for some time. Google says it's now the only large cloud provider offering access to all three leading closed LLMs. While OpenAI notes that Microsoft continues to be its primary cloud partner, the full suite of current GPT 6 and 6.1 models—Astra, Sol, and Luna—will launch on Google Cloud. Astra will naturally cost the most to run, but Google's system supports dynamically moving workloads between LLMs based on performance, latency, and efficiency. Read full article Comments", "date_str": "2026-10-21T18:51:42+00:00", "hash": "ce590f9edffc2ea1", "title_fa": "جدیدترین مدل‌های هوش مصنوعی OpenAI به Google Cloud و Antigravity می‌آیند", "summary_fa": "گوگل مطمئناً ترجیح می دهد که همه از مدل های Gemini آن با سرویس های Google Cloud استفاده کنند، اما به زودی، گزینه های بیشتری خواهید داشت. OpenAI و Google به ترتیبی دست یافته اند که مدل های مرزی قبلی را به سرویس های Google Cloud وارد می کنند. شاید مهمتر از آن، مدل‌های GPT به زودی در Antigravity، ابزار کدنویسی مبتنی بر عامل Google ظاهر شوند. برای مشتریان سازمانی و علاقه مندان به هوش مصنوعی، آخرین مدل OpenAI در هفته های آینده در \"باغ مدل\" گوگل ظاهر می شود و به بیش از 200 گزینه آن اضافه می شود. این باغ در حال حاضر امکان دسترسی به مدل‌های Gemini Google و همچنین مجموعه‌ای از مدل‌های باز مانند Mistral، Llama و Gemma را فراهم می‌کند. کلود هوش مصنوعی Anthropic نیز مدتی است که در دسترس بوده است. گوگل می گوید اکنون تنها ارائه دهنده بزرگ ابری است که به هر سه LLM بسته پیشرو دسترسی دارد. در حالی که OpenAI اشاره می کند که مایکروسافت همچنان شریک اصلی ابری خود است، مجموعه کامل مدل های فعلی GPT 6 و 6.1 - Astra، Sol و Luna - در Google Cloud راه اندازی می شود. Astra طبیعتاً بیشترین هزینه را برای اجرا خواهد داشت، اما سیستم Google از بارهای کاری به صورت پویا بین LLM ها بر اساس عملکرد، تأخیر و کارایی پشتیبانی می کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید حداقل کردن برای پیمایش Google مطمئناً ترجیح می دهد همه از مدل های Gemini آن با خدمات Google Cloud استفاده کنند، اما به زودی گزینه های بیشتری خواهید داشت. OpenAI و Google به ترتیبی دست یافته اند که مدل های مرزی قبلی را به سرویس های Google Cloud وارد می کنند. شاید"}, {"source": "Ars Technica", "title": "Report: Musk ordered Starlink slowdown in Ukraine, then blamed it on Trump", "link": "https://arstechnica.com/tech-policy/2026/10/report-says-musk-not-trump-ordered-starlink-throttling-that-blindsided-ukraine/", "summary": "A Wall Street Journal report said SpaceX CEO Elon Musk ordered the Starlink throttling that blindsided Ukraine's air assault forces last week, despite Musk's claim that all decisions on the military version of Starlink are made by the US military and President Trump. Trump denied ordering the restrictions. While Musk may have spoken to Trump and administration officials before the decision, The Wall Street Journal reported yesterday that Musk made the final call. The decision came after both Musk and Trump criticized Ukraine for attacking Russian diesel refineries. \"Elon Musk ordered the slowdown of a military-grade version of Starlink relied on by Ukraine, a decision that sparked panic in Kyiv and confusion inside the Trump administration,\" the WSJ wrote, citing unnamed US officials and people familiar with the matter. The report said that \"Musk capped the speeds at which Ukrainian hardware could stay connected to the satellite-based network... rendering some offensive drones and interceptor drones virtually useless.\" Read full article Comments", "date_str": "2026-10-21T18:35:38+00:00", "hash": "54cc8005af8dc17b", "title_fa": "گزارش: ماسک دستور کاهش سرعت Starlink در اوکراین را صادر کرد و سپس ترامپ را مقصر دانست", "summary_fa": "در گزارشی از وال استریت ژورنال آمده است که ایلان ماسک، مدیر عامل اسپیس ایکس، هفته گذشته دستور گلف استارلینک را صادر کرد که نیروهای حمله هوایی اوکراین را کور کرد، علیرغم ادعای ماسک مبنی بر اینکه تمام تصمیمات در مورد نسخه نظامی Starlink توسط ارتش ایالات متحده و رئیس جمهور ترامپ گرفته می شود. ترامپ دستور این محدودیت ها را رد کرد. در حالی که ماسک ممکن است قبل از تصمیم با ترامپ و مقامات دولت صحبت کرده باشد، وال استریت ژورنال دیروز گزارش داد که ماسک آخرین تماس را انجام داده است. این تصمیم پس از آن اتخاذ شد که هم ماسک و هم ترامپ از اوکراین به دلیل حمله به پالایشگاه‌های دیزل روسیه انتقاد کردند. WSJ به نقل از مقامات ناشناس آمریکایی و افراد آشنا به این موضوع نوشت: «الون ماسک دستور کاهش سرعت نسخه نظامی Starlink را صادر کرد که مورد اعتماد اوکراین است، تصمیمی که باعث وحشت در کیف و سردرگمی در داخل دولت ترامپ شد». در این گزارش آمده است که ماسک سرعت اتصال سخت افزار اوکراینی به شبکه ماهواره ای را محدود کرده است. برخی از پهپادهای تهاجمی و هواپیماهای بدون سرنشین رهگیر را تقریباً بی‌فایده می‌کند.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. تصمیمات در مورد نسخه نظامی Starlink توسط ارتش ایالات متحده و رئیس جمهور ترامپ اتخاذ می شود. WSJ به نقل از مقامات ناشناس آمریکایی و افراد آشنا به این موضوع نوشت: «الون ماسک دستور کاهش سرعت نسخه نظامی Starlink را صادر کرد که مورد اعتماد اوکراین است، تصمیمی که باعث وحشت در کیف و سردرگمی در داخل دولت ترامپ شد». در این گزارش آمده است که ماسک سرعت اتصال سخت‌افزار اوکراینی به شبکه ماهواره‌ای را محدود کرد و برخی پهپادهای تهاجمی"}, {"source": "Ars Technica", "title": "Judge rejects Trump’s wild claim EPA can dismiss data center pollution lawsuits", "link": "https://arstechnica.com/tech-policy/2026/10/judge-rejects-trumps-wild-claim-epa-can-dismiss-data-center-pollution-lawsuits/", "summary": "Elon Musk’s SpaceXAI is stuck facing a lawsuit over alleged data center pollution after Donald Trump failed to convince a judge that his Environmental Protection Agency (EPA) has complete control over all Clean Air Act lawsuits and can dismiss any suit at whim. Soon after unpermitted gas turbines were discovered powering Musk’s giant Colossus data center in Memphis, Tennessee, the NAACP sued . Its lawsuit sought an injunction requiring xAI (which, following a merger , is known now as SpaceXAI) to use the best available pollution control technology when operating the turbines and ordering penalties up to $124,426 per day per violation. Without such remedies, the turbines risked drastically spiking pollution in already vulnerable neighborhoods housing predominantly Black communities nearby, the NAACP argued. To block the lawsuit, Trump tried to intervene, arguing that the EPA had the power to unilaterally dismiss lawsuits any time the president decides against enforcing the Clean Air Act. According to Trump, it would supposedly “not serve the public interest” if citizens were allowed to seek massive civil penalties to punish polluting AI firms that were trying to get data centers operational as fast as possible to support Trump’s AI Action Plan . Read full article Comments", "date_str": "2026-10-21T18:20:40+00:00", "hash": "ac243a7245b0d4e6", "title_fa": "قاضی ادعای وحشیانه ترامپ را رد می کند که EPA می تواند شکایت های مربوط به آلودگی مراکز داده را رد کند", "summary_fa": "SpaceXAI متعلق به ایلان ماسک پس از اینکه دونالد ترامپ نتوانست قاضی را متقاعد کند که آژانس حفاظت از محیط زیست او (EPA) کنترل کاملی بر تمامی دعاوی مربوط به قانون هوای پاک دارد و می تواند هر گونه دعوی را به هوس رد کند، با شکایتی به دلیل آلودگی مرکز داده مواجه شده است. اندکی پس از کشف توربین‌های گازی غیرمجاز که مرکز داده غول پیکر ماسک در ممفیس، تنسی را تامین می‌کردند، NAACP شکایت کرد. دعوای آن به دنبال دستوری بود که xAI (که پس از ادغام، اکنون با نام SpaceXAI شناخته می‌شود) را ملزم می‌کرد تا از بهترین فناوری کنترل آلودگی موجود در هنگام کار با توربین‌ها استفاده کند و مجازات‌هایی تا سقف ۱۲۴۴۲۶ دلار در روز برای هر تخلف صادر کند. NAACP استدلال می‌کند که بدون چنین راهکارهایی، توربین‌ها به‌شدت در محله‌های آسیب‌پذیری که جوامع عمدتاً سیاه‌پوست در آن نزدیکی زندگی می‌کنند، با خطر افزایش آلودگی مواجه می‌شوند. برای جلوگیری از شکایت، ترامپ سعی کرد مداخله کند و استدلال کرد که سازمان حفاظت از محیط زیست این اختیار را دارد که هر زمانی که رئیس جمهور علیه اجرای قانون هوای پاک تصمیم بگیرد به طور یکجانبه شکایت ها را رد کند. به گفته ترامپ، اگر شهروندان اجازه داشته باشند برای مجازات شرکت‌های آلوده کننده هوش مصنوعی که تلاش می‌کنند تا مراکز داده را در سریع‌ترین زمان ممکن عملیاتی کنند تا از برنامه اقدام هوش مصنوعی ترامپ حمایت کنند، به دنبال مجازات‌های مدنی گسترده باشند، ظاهراً «در خدمت منافع عمومی نیست». مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید SpaceXAI ایلان ماسک پس از اینکه دونالد ترامپ نتوانست قاضی را متقاعد کند که آژانس حفاظت از محیط زیست او می تواند کنترل کاملی بر قوانین CPA داشته باشد، SpaceXAI با"}, {"source": "Ars Technica", "title": "Does opting out of smart TV tracking work? Research finds “suspicious” traffic.", "link": "https://arstechnica.com/gadgets/2026/10/does-opting-out-of-smart-tv-tracking-work-research-finds-suspicious-traffic/", "summary": "Smart TVs running operating systems from Samsung, Vizio, and Roku continue sending data to automatic content recognition (ACR) endpoints after users opt out of tracking in the devices’ settings, according to research published on Monday. The paper from Northeastern University researchers points to potential privacy violations from some of the biggest TV brands. ACR captures video screenshots or audio clips from smart TVs and sends the data to remote servers, where it's used for things like measuring content viewership and serving targeted ads. The paper, \"Watching the Watchers: Privacy Analysis of US Smart TV Automatic Content Recognition,\" examined eight smart TV OSes across 12 smart TVs from 10 manufacturers (Amazon, Hisense, LG, Roku, Samsung, Sony, Supersonic, TCL, Vizio, and Westinghouse) to examine when smart TVs use ACR and how effective opting out of user tracking is. Read full article Comments", "date_str": "2026-10-21T18:00:37+00:00", "hash": "5371114de95e137d", "title_fa": "آیا انصراف از ردیابی تلویزیون هوشمند کار می کند؟ تحقیقات ترافیک \"مشکوک\" را پیدا می کند.", "summary_fa": "بر اساس تحقیقی که روز دوشنبه منتشر شد، تلویزیون‌های هوشمندی که از سیستم‌عامل‌های سامسونگ، Vizio و Roku استفاده می‌کنند، پس از انصراف کاربران از ردیابی در تنظیمات دستگاه‌ها، به ارسال داده‌ها به نقاط پایانی تشخیص خودکار محتوا (ACR) ادامه می‌دهند. مقاله محققان دانشگاه نورث ایسترن به نقض احتمالی حریم خصوصی برخی از بزرگترین برندهای تلویزیون اشاره می کند. ACR اسکرین شات های ویدیویی یا کلیپ های صوتی را از تلویزیون های هوشمند می گیرد و داده ها را به سرورهای راه دور ارسال می کند، جایی که برای مواردی مانند اندازه گیری میزان بازدید محتوا و ارائه تبلیغات هدفمند استفاده می شود. مقاله \"تماشاگرها: تجزیه و تحلیل حریم خصوصی تشخیص خودکار محتوای تلویزیون های هوشمند ایالات متحده\"، هشت سیستم عامل تلویزیون هوشمند را در 12 تلویزیون هوشمند از 10 سازنده (Amazon، Hisense، LG، Roku، سامسونگ، سونی، سوپرسونیک، TCL، Vizio، و Westinghouse) مورد بررسی قرار داد تا بررسی کند که چگونه استفاده از تلویزیون های هوشمند ACR چقدر موثر است. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش تلویزیون های هوشمند دارای سیستم عامل سامسونگ، Vizio و Roku پس از انصراف کاربران از ردیابی در تحقیقات منتشر شده در تنظیمات دستگاه، به ارسال داده ها به نقاط پایانی تشخیص خودکار محتوا (ACR) ادامه دهید. مقاله محققان دانشگاه نورث ایسترن به نقض احتمالی حریم خصوصی برخی از بزرگترین برندهای تلویزیون اشاره می کند. مقاله «تماشای تماشاگران: تجزیه و تحلیل حریم خصوصی تشخیص خودکار محتوای تلویزیون هوشمند ایالات متحده»، هشت سیستم عامل تلویزیون هوشمند را در 12 تلویزیون هوشمند از 10 سازنده (آمازون، هایسنس، ال‌جی، روکو، سامسونگ، سونی، سوپرسونیک، TCL، Vizio، و وستینگ‌هاوس) مورد بررسی قرار داد تا بررسی کند که چگونه استفاده از تلویزیون‌های هوشمند چقدر موثر است."}, {"source": "Ars Technica", "title": "SpaceX to attempt Starship catch on next flight, with eye on rapid cadence increase", "link": "https://arstechnica.com/space/2026/10/spacex-will-attempt-to-reach-weekly-starship-launches-by-early-2027/", "summary": "In its current iteration, SpaceX is largely a data company seeking to provide enormous amounts of compute for artificial intelligence. During an earnings call on Tuesday afternoon, company officials spent much of their time discussing ambitious plans to roll out up to 10 GW of compute in 2027—on the ground. Gone are the days of aspirational talk about sending humans to Mars and settling the red planet. Now it is almost all about artificial intelligence and the data needed to support its expansion. However, the company's long-term ambitions to provide data services from space, initially with the Starlink Internet constellation and eventually through the \"Starmind\" data center constellation, still rely on an actual rocket. That would be the Starship vehicle, and during the earnings call, SpaceX founder Elon Musk and the company's president and chief operating officer, Gwynne Shotwell, provided new performance targets for the vehicle. Read full article Comments", "date_str": "2026-10-21T16:46:19+00:00", "hash": "3e6fbbd677e9d633", "title_fa": "SpaceX در پرواز بعدی، با توجه به افزایش سریع آهنگ، تلاش می کند تا Starship را بگیرد", "summary_fa": "در تکرار فعلی، SpaceX تا حد زیادی یک شرکت داده است که به دنبال ارائه مقادیر عظیمی از محاسبات برای هوش مصنوعی است. در طول یک تماس سود در بعدازظهر سه‌شنبه، مقامات این شرکت بیشتر وقت خود را صرف بحث در مورد برنامه‌های بلندپروازانه برای عرضه تا 10 گیگاوات محاسبات در سال 2027 کردند. دوران صحبت های آرزویی درباره فرستادن انسان به مریخ و اسکان سیاره سرخ گذشته است. اکنون تقریباً همه چیز در مورد هوش مصنوعی و داده های مورد نیاز برای پشتیبانی از گسترش آن است. با این حال، جاه طلبی های بلندمدت این شرکت برای ارائه خدمات داده از فضا، در ابتدا با صورت فلکی اینترنت استارلینک و در نهایت از طریق صورت فلکی مرکز داده «Starmind»، هنوز بر یک موشک واقعی تکیه دارد. این وسیله نقلیه استارشیپ خواهد بود، و در طول این تماس، ایلان ماسک، بنیانگذار اسپیس ایکس و گوین شاتول، رئیس و مدیر عامل شرکت، اهداف عملکردی جدیدی را برای این وسیله نقلیه ارائه کردند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش در تکرار فعلی خود، SpaceX عمدتاً یک شرکت داده است که به دنبال ارائه مقادیر عظیمی از محاسبات برای هوش مصنوعی است. در طول یک تماس سود در بعدازظهر سه‌شنبه، مقامات این شرکت بیشتر وقت خود را صرف بحث در مورد برنامه‌های بلندپروازانه برای عرضه تا 10 گیگاوات محاسبات در سال 2027 کردند. کمی بیش از سه هفته از چهاردهمین پرواز آزمایشی این موشک عظیم می گذرد که علی رغم برخی مشکلات موتور موشک رپتور، تا حد زیادی به خوبی انجام شد. ماسک گفت که اسپیس ایکس داده‌های کافی از آن آزمایش را جمع‌آوری کرده است تا در پرواز بعدی، هم مرحله اول سوپر سنگین موشک و هم مرحله"}, {"source": "Ars Technica", "title": "The $15 billion ad-powered AI startup your doctor may already be using", "link": "https://arstechnica.com/ai/2026/10/the-15-billion-ad-powered-ai-startup-your-doctor-may-already-be-using/", "summary": "Nearly two-thirds of US doctors are turning to an AI-powered search engine to make patient decisions, propelling a little-known tech startup to a $15 billion valuation while prompting a debate over the future of  سطوح جدیدی ارتقا می دهند، و انتظار دارید که در ایالات متحده، عکاسی را به سطح جدیدی بخرید. دلایل برخی از تولیدکنندگان گوشی های چینی در داخل کشور ممنوع شده اند، در حالی که سایر برندها ترجیح می دهند تلاش های خود را در کشورهایی متمرکز کنند که اپل سهم زیادی از بازار ندارد. توضیح هرچه که باشد، من درک کاملی از بهترین تلفن‌هایی دارم که نمی‌توانید به‌طور رسمی در ایالات متحده بخرید، زیرا گوشی‌های جهانی را برای سال‌ها آزمایش کرده‌ام. بسیاری از این تولیدکنندگان تلفن، چندین دستگاه را تحت برندهای فرعی عرضه می کنند. با در نظر گرفتن این موضوع، در اینجا اطلاعات اولیه وجود دارد: شیائومی برند پشت پوکو و ردمی است. Nubia از ZTE آمده است. Honor یکی از زیرمجموعه های هواوی بود اما پس از ممنوعیت هواوی در ایالات متحده از هم جدا شد. و Realme از Oppo خارج شد. مردم در بریتانیا و سایر نقاط اروپا می‌توانند بسیاری از تلفن‌های موجود در راهنمای ما را در مورد بهترین تلفن‌های اندروید، بهترین آیفون‌ها و بهترین گوشی‌های ارزان قیمتی که در ایالات متحده به فروش می‌رسند، خریداری کنند. به‌روزرسانی اکتبر 2026: Oppo Find X10 Pro Max، Nothing Phone (4b)، اشاره‌ای به TCL P80 Ultra، Xiaomi Poco F9 Ultra و Pro، و Xiaomi Redmi Note 17 Pro Max را اضافه"}, {"source": "MIT Tech Review", "title": "The Download: computing’s next leap and permafrost’s climate threat", "link": "https://www.technologyreview.com/2026/10/22/1147612/the-download-computing-next-leap-permafrost-climate-threat/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. How far can we push computing? On a December evening in 1959, the physicist Richard Feynman gave a lecture called “There’s Plenty of Room at the Bottom.” There is no physical law stopping us from writing the entire Encyclopædia Britannica on the head of a pin, he argued. We simply had not built the tools yet. He was right, and for decades, computing took us into that space almost for free, as transistors repeatedly halved in size. But that easy descent has now stalled. Today, the industry is increasingly turning to brute force, building ever-bigger data centers to boost performance. Yet the laws of physics leave plenty of room for improvement. Here’s how researchers are exploring ways to unlock the next leap in computing . —Volkan Gurses This story is from the latest edition of our print magazine: The Impossible issue . Subscribe now to read it in full . It’s also part of MIT Technology Review Explains , our series exploring the ideas shaping technology. Read more from the series . Three things you should know about permafrost How much do you know about permafrost? Maybe, like me, you’ve been aware that this layer of frozen soil is thawing, that it’s important in the global puzzle of climate change … and that’s about the extent of it. The great news for both of us is that my colleague James Temple just helicoptered into Alaska’s forests to report on the fires threatening permafrost and their complicated potential climate effects . Here are three things I took away from his reporting . —Casey Crownhart This story is from The Spark, our weekly climate tech newsletter. Sign up to receive it in your inbox every Wednesday. Roundtables: a conversation with the creator of AI-designed viruses Can AI design new life forms? In 2025, Stanford University PhD student Samuel King offered a preliminary answer by using a generative AI model to propose genetic blueprints for microscopic viruses. It isn’t yet an example of AI-generated life, but that could be next. In our latest Roundtables conversation, MIT Technology Review senior AI reporter James O’Donnell spoke with King about his work, being named one of our Innovators Under 35 , and new ways of seeing biology. Subscribers can now watch a full recording of the event . Want to join the next conversation? Subscribe to MIT Technology Review for exclusive access to all our Roundtables.", "date_str": "2026-10-22T12:10:00+00:00", "hash": "7e6859ffe5cdc007", "title_fa": "دانلود: جهش بعدی محاسبات و تهدید آب و هوای همی look to move AI from experimentation into everyday operations, the challenge ahead is giving technology the context to act usefully within complex business processes. For Devavrat Shah, chief scientist of enterprise AI at Celonis, that context is central to what he calls “decision intelligence.” AI agents can support individual tasks within larger decision-making processes, he argues, but they need to understand the role each task plays and the business conditions surrounding it. “You can t just do that in a vacuum,” he says. Without the right operational context, agents risk overlooking important constraints, making costly mistakes, or consuming excessive computing resources as they try to work out what they need to know. The solution begins with connecting AI to the processes and data enterprises already use. A contextual layer can help agents understand workflows, operate within defined guardrails, and produce recommendations that people can review and approve. Shah advises organizations to start with a specific business decision, identify its most difficult steps, and test whether AI can improve them. Measuring gains in speed and value can then help determine whether an application is worth scaling. This approach could also change how employees spend their time. Automating repetitive, manual work and coordinating tasks across teams could free people to focus on more complex strategic decisions. Realizing that benefit, however, will require investment in workforce education, so employees can understand AI outputs and their implications instead of just handing decisions over to agents. Looking to the future, Shah sees opportunities extending from routine operational tasks to enterprise-wide planning in areas such as finance, workforce management, marketing, and sales. With the right context, AI could help organizations evaluate options and make consequential decisions more quickly. As Shah puts it, “Now, maybe [resource planning] should not take that much time, an tle": "Three things you should know about permafrost", "link": "https://www.technologyreview.com/2026/10/22/1147591/permafrost-primer/", "summary": "How much do you know about permafrost? Maybe, like me, you’ve been aware that this layer of frozen soil is thawing, that it’s important in the global puzzle of climate change … and that’s about the extent of it. The great news for both of us is that my colleague James Temple just published two in-depth stories about permafrost. His reporting took him to the boreal forests of Alaska, where he helicoptered into the wilderness to learn more about how this material could affect our climate both now and in the future. I’d recommend you give both of James’s stories a read. There’s this feature about efforts to tackle the intensifying fires that are threatening permafrost, as well as this look at how researchers are trying to understand the complicated tangle of potential climate effects. Here are three things I took away. Permafrost is a massive blind spot for climate change Permafrost is the frozen layer of soil that’s under about 15% of land around the Northern Hemisphere. While technically material needs to be frozen for only two consecutive years to count as permafrost, most of our current permafrost formed during the last ice age. That means there’s organic material that’s been frozen, and essentially locked away, for thousands of years. But as global temperatures tick up and this layer thaws, microbes are able to break down that organic matter, releasing carbon dioxide and methane—powerful greenhouse gases that drive climate change. Those emissions form a feedback loop, accelerating warming further. The steady rise in global temperatures has already shrunk the footprint of the Arctic permafrost by about 12% since 1850, and the pace has been picking up in the last 50 years. The wild thing is, only a minority of the models that have been used in UN climate reports actually take into account the gradual loss of permafrost. And none of them include the abrupt thaw and collapse that can happen after events like heat waves and fires (more on those fires in a moment). There are efforts to make sure future UN reports reflect the growing science, but for now, all this means that we’re probably underestimating how much and how fast the planet is going to warm. Wildfires can speed up permafrost loss Fire is a natural part of boreal forests’ life cycle, but they’re getting more intense because of climate change. And crucially, fires can accelerate the thawing of permafrost. By the end of the century, this effect could release the equivalent of 80 billion metric tons o", "date_str": "2026-10-22T10:00:00+00:00", "hash": "00c205f19074c3ad", "title_fa": "سه چیز که باید در مورد منجمد دائمی بدانید", "summary_fa": "چقدر در مورد پرمافراست می دانید؟ شاید شما نیز مانند من آگاه بوده باشید که این لایه خاک یخ زده در حال ذوب شدن است، که در معمای جهانی تغییرات آب و هوایی مهم است... و این در حدود وسعت آن است. خبر عالی برای هر دوی ما این است که همکار من جیمز تمپل به تازگی دو داستان عمیق در مورد منجمد دائمی منتشر کرده است. گزارش‌های او او را به جنگل‌های شمالی آلاسکا برد، جایی که او با هلیکوپتر به بیابان رفت تا درباره اینکه چگونه این مواد می‌تواند بر آب و هوای ما چه در حال حاضر و چه در آینده تأثیر بگذارد، بیشتر بیاموزد. توصیه می کنم هر دو داستان جیمز را بخوانید. این ویژگی در مورد تلاش‌ها برای مقابله با آتش‌سوزی‌های فزاینده‌ای که یخبندان دائمی را تهدید می‌کنند، و همچنین این نگاه به چگونگی تلاش محققان برای درک پیچیدگی اثرات بالقوه آب و هوا وجود دارد. در اینجا سه ​​چیز است که من حذف کردم. منجمد دائمی یک نقطه کور عظیم برای تغییرات آب و هوایی است. منجمد دائمی لایه یخ زده خاک است که در زیر 15 درصد از زمین های اطراف نیمکره شمالی قرار دارد. در حالی که از نظر فنی مواد فقط برای دو سال متوالی باید منجمد شوند تا به عنوان منجمد دائمی حساب شوند، بیشتر یخ‌های دائمی فعلی ما در آخرین عصر یخبندان تشکیل شده‌اند. این بدان معناست که مواد آلی وجود دارد که برای هزاران سال یخ زده و اساساً قفل شده است. اما با افزایش دمای کره زمین و آب cc763933a44c", "title_fa": "زمان عرضه مدل کوچک مرسدس جی‌کلاس مشخص شد", "summary_fa": "مرسدس بنز اعلام کرد شاسی‌بلند جدید و کامپکت جی‌کلاس با هدف جذب گروه متفاوتی از خریداران تا ۲ سال آینده معرفی می‌شود. تبلیغات مرسدس بنز مرزبندی مشخصی میان جی‌کلاس اصیل و نسخه‌ی کامپکت جدید خود ترسیم کرده است. مدیران این خودروساز تأکید دارند که محصول کوچک‌تر با تمرکز بر آفرود و حفظ زبان طراحی شاخص خانواده، بخش مجزایی از بازار شاسی‌بلندهای لوکس کامپکت را هدف قرار می‌دهد. اولا کالنیوس مدیرعامل مرسدس بنز بازه‌ی زمانی رونمایی از این خودرو را کمتر از ۲۴ ماه دیگر عنوان کرده که نشان‌دهنده‌ی احتمال معرفی آن در سال ۲۰۲۸ است. اشتفان وکباخ ، مدیرعامل مرسدس-AMG، می‌گوید : «ما اطمینان حاصل خواهیم کرد که لیتل جی [جی‌کلاس کوچک] بخش متفاوتی از بازار را هدف قرار دهد.» وکباخ صراحتا اعلام کرد که این مدل برای مشتریان سنتی طراحی نشده و خریدارانی را هدف می‌گیرد که به دنبال شاسی‌بلند فول‌سایز نیستند. کالنیوس نیز با اشاره به آزمون‌های سخت کوه شوکل در اتریش یادآور شد نسخه‌ی جمع‌وجور قرار نیست عملکردی هم‌سطح برادر بزرگ‌تر خود ارائه دهد. مدیرعامل مرسدس بنز می‌گوید: «تنها یک خودرو در جهان وجود دارد که می‌تواند چنین کاری را انجام دهد و آن جی است.» مهندسان آلمانی توسعه‌ی این شاسی‌بلند را روی هندسه‌ی سیستم تعلیق، ابعاد چرخ‌ها و مفصل‌بندی محورها متمرکز کرده‌اند تا قابلیت‌های آفرود مناسبی فراهم شود. در بخش فنی نیز پس از درخواست نمایندگی‌های آمریکای شمالی، علاوه بر پیشرانه‌ی تمام‌برقی مجهز به دو موتور، نسخه‌ی بنزینی چهار سیلندر توربوشارژ نیز عرضه خواهد شد و خط مونتاژ آن در مجارستان قرار دارد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "ساخت بازی جهان‌باز فوتبال آمریکایی تأیید شد", "link": "https://www.zoomit.ir/gaming/469594-ea-sports-open-world-football/", "summary": "الکترونیک آرتز از توسعه‌ی یک اثر ورزشی جهان‌باز با نام Project Gridiron در کنار نسخه‌ی جدید Fight Night خبر داد.", "date_str": "2026-10-22T05:43:56+00:00", "hash": "5dbb3a1ea54601b6", "title_fa": "س
