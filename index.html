اس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/dyabt-atfal_TTbx__v1024x512__box_0%2C55%2C620%2C381.jpeg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۴ آبان • ۱۸:۴۲"}, {"source": "IranWire", "title": "هشدار سیلاب در هشت استان؛ آماده‌باش ۱۱هزار و ۵۰۰نیروی امدادی", "link": "https://iranwire.com/fa/news-1/159850-%D9%87%D8%B4%D8%AF%D8%A7%D8%B1-%D8%B3%DB%8C%D9%84%D8%A7%D8%A8-%D8%AF%D8%B1-%D9%87%D8%B4%D8%AA-%D8%A7%D8%B3%D8%AA%D8%A7%D9%86-%D8%A2%D9%85%D8%A7%D8%AF%D9%87%D8%A8%D8%A7%D8%B4-%DB%B1%DB%B1-%D9%87%D8%B2%D8%A7%D8%B1-%D9%88-%DB%B5%DB%B0%DB%B0-%D9%86%DB%8C%D8%B1%D9%88%DB%8C-%D8%A7%D9%85%D8%AF%D8%A7%D8%AF%DB%8C/", "summary": "سازمان مدیریت بحران کشور از آماده‌باش ۱۱هزار و ۵۰۰تیم عملیاتی، امدادی و انتظامی در پی ورود یک سامانه بارشی به ایران خبر داد و اعلام کرد ...", "date_str": "2026-11-05T15:37:43+00:00", "hash": "aff80431193f5cb6", "title_fa": "هشدار سیلاب در هشت استان؛ آماده‌باش ۱۱هزار و ۵۰۰نیروی امدادی", "summary_fa": "سازمان مدیریت بحران کشور از آماده‌باش ۱۱هزار و ۵۰۰تیم عملیاتی، امدادی و انتظامی در پی ورود یک سامانه بارشی به ایران خبر داد و اعلام کرد ... آسمان بندرعباس شامگاه چهارشنبه ۱۴آبان۱۴۰۵ تگرگ در بندرعباس سازمان مدیریت بحران کشور از آماده‌باش ۱۱هزار و ۵۰۰تیم عملیاتی، امدادی و انتظامی در پی ورود یک سامانه بارشی به ایران خبر داد و اعلام کرد احتمالا در چند استان وقوع سیلاب محتمل است. «امید محترمی»، معاون و سخنگوی سازمان مدیریت بحران کشور، اعلام کرد که این سامانه بارشی از روز پنجشنبه ۱۴آبان۱۴۰۵ از مناطق غربی وارد کشور می‌شود و فعالیت آن تا دوشنبه ۱۸ آبان در استان‌های مختلف ادامه خواهد داشت. به گفته او، نیمه شمالی خوزستان، جنوب لرستان، چهارمحال و بختیاری، کهگیلویه و بویراحمد، غرب اصفهان و بخش‌هایی از استان‌های تهران، البرز و قزوین از مناطق در معرض بارش‌های گسترده و خطر سیلاب هستند. به گفته معاون سازمان مدیریت بحران کشور بر اساس برخی مدل‌های هواشناسی، میزان بارش در نقاط مرتفع و ین خبر توسط کرملین، رسانه‌های حکومتی در ایران نوشتند که رضایی «پیام رهبر معظم انقلاب را به رئیس جمهور روسیه تقدیم کرد». از محتوای پیام منسوب به رهبر تازه جمهوری اسلامی هنوز خبری منتشر نشده است. خبرهای مربوط به مجتبی خامنه‌ای در حالی در ایران منتشر می‌شود که در هشت ماه گذشته نه فایلی صوتی و نه ویدئویی از او منتشر شده است. روز ۱۱ آبان نیز رسانه‌های ایران از گفت‌وگوی تلفنی محسن رضایی و ولادیمیر پوتین خبر داده بودند. محتوای آن گفت‌وگو هم اعلام نشد. رضایی که سابقه فرماندهی سپاه پاسداران را دارد در پی آغاز جنگ با آمریکا و مرگ علی خامنه‌ای و اعلام جانشینی پسر او، مجتبی، در اسفندماه ۱۴۰۴، همزمان با افزایش قدرت سپاه در حکومت جمهوری اسلامی، جایگاهی مهم‌تر در سیاست خارجی کشور یافته است. حال دیدار این مقام امنیتی جمهوری اسلامی با رئیس جمهور روسیه در شرایطی اتفاق افتاده است که ولادیمیر پوتین در هفته‌های اخیر بارها به اظهار نظر درباره ایران پرداخته و از لزوم توافق واشینگتن و تهران با یکدیگر صحبت کرده است. پوتین پیشتر حدود دو هفته پیش در دیدار با استیو ویتکاف، نماینده ویژه رئیس جمهور آمریکا، در مسکو گفته بود هنوز برای حل بحران ایران از راه دیپلماسی فرصت وجود دارد و باید با تهران به توافق رسید. رئیس‌جمهور روسیه همچنین «برای کمک به حل بحران ایران اعلام آمادگی کرده» و گفته است علاقه‌مند است ارزیابی آمریکا از وضعیت این بحران", "image_url": "https://gdb.rferl.org/350d9fb0-ba8b-4d7d-ec71-08df13a87301_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۱۴ آبان • ۱۹:۱۳"}, {"source": "IranWire", "title": "کسری آبخوان‌های یزد از ۱۰ میلیارد مترمکعب گذشت", "link": "https://iranwire.com/fa/news-1/159840-%DA%A9%D8%B3%D8%B1%DB%8C-%D8%A2%D8%A8%D8%AE%D9%88%D8%A7%D9%86%D9%87%D8%A7%DB%8C-%DB%8C%D8%B2%D8%AF-%D8%A7%D8%B2-%DB%B1%DB%B0-%D9%85%DB%8C%D9%84%DB%8C%D8%A7%D8%B1%D8%AF-%D9%85%D8%AA%D8%B1%D9%85%DA%A9%D8%B9%D8%A8-%DA%AF%D8%B0%D8%B4%D8%AA/", "summary": "کسری تجمعی مخازن آب زیرزمینی استان یزد از ۱۰ میلیارد مترمکعب فراتر رفته است؛ رقمی که به گفته رییس گروه مطالعات آب‌های زیرزمینی شرکت آب م ...", "date_str": "2026-11-05T13:56:32+00:00", "hash": "d7a27b88f9f9606f", "title_fa": "کسری آبخوان‌های یزد از ۱۰ میلیارد مترمکعب گذشت", "summary_fa": "کسری تجمعی مخازن آب زیرزمینی استان یزد از ۱۰ میلیارد مترمکعب فراتر رفته است؛ رقمی که به گفته رییس گروه مطالعات آب‌های زیرزمینی شرکت آب م ... پیام ما خبر داد فهیمی، رییس گروه مطالعات آب‌های زیرزمینی شرکت آب منطقه‌ای یزد، گفته است بر اساس اندازه‌گیری‌های ماهانه در حدود ۴۴۰ چاه مشاهده‌ای، سطح آب در بیشتر آبخوان‌های استان طی سال آبی ۱۴۰۳ـ۱۴۰۴ کاهش یافته است. بیشترین افت سالانه به آبخوان صاحب‌آباد با ۱۰۳ سانتی‌متر مربوط بوده است. پس از آن، آبخوان‌های ابرکوه با ۸۷ سانتی‌متر، مروست با ۸۴ سانتی‌متر، بهادران با ۷۶ سانتی‌متر و چاهک شهریاری با ۷۴ سانتی‌متر افت قرار دارند. کسری مخازن آب زیرزمینی یزد در همان سال آبی حدود ۲۸۷ میلیون مترمکعب برآورد شده است؛ رقمی که ۴۳ میلیون مترمکعب از میانگین بلندمدت بیشتر است. آبخوان یزدـاردکان‌ با ۱۱۵ میلیون مترمکعب، بیشترین سهم را در این کسری داشته است. کسری آبخوان ابرکوه ۴۸ میلیون و مروست ۲۱ میلیون مترمکعب اعلام شده است. فهیمی گفته است شوری آب در ۱۰ آبخوان، از جمله سرخ‌زیتون، کویر دره‌انجیر، چاگیر، بافق و یزدـاردکان‌ افزایش یافته است. او همچنین درباره وضعیت آبخوان‌هایی که آب شرب یزد را تامین می‌کنند هشدار داده است. آبخوان یزدگرد به‌طور میانگین سالانه یک متر و ۱۸ سانتی‌متر افت می‌کند و افت سطح آب در آبخوان چرخاب نیز از یک متر فراتر رفته است. به گفته او، این دو منبع با تهدید کمی و کیفی روبه‌رو هستند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D9%85%D8%AE%D8%A7%D8%B2%D9%86-%D8%A7%D8%A8%DB%8C-%DB%8C%D8%B2%D8%AF_pFtR__v1024x512__box_0%2C0%2C1488%2C782.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۴ آبان • ۱۷:۲۶"}, {"source": "IranWire", "title": "امیر دلشاد، از بازداشت‌شدگان اعتراضات دی‌ماه، در مشهد به اعدام محکوم شد", "link": "https://iranwire.com/fa/news-1/159843-%D8%A7%D9%85%DB%8C%D8%B1-%D8%AF%D9%84%D8 D9%87%D8%A7%D9%86/%D9%87%D8%B4%D8%AF%D8%A7%D8%B1-%D8%A8%D9%85%D8%A8%E2%80%8C%DA%AF%D8%B0%D8%A7%D8%B1%DB%8C-%D8%AF%D8%B1-%DB%B1%DB%B8-%D9%BE%D8%B1%D9%88%D8%A7%D8%B2-%D8%A7%D8%B1%D9%88%D9%BE%D8%A7%DB%8C%DB%8C%D8%9B-%D9%81%D8%B1%D9%88%D8%AF%D9%87%D8%A7%DB%8C-%D8%A7%D8%B6%D8%B7%D8%B1%D8%A7%D8%B1%DB%8C-%D9%88-%D8%A7%D8%B3%DA%A9%D9%88%D8%B1%D8%AA-%D8%A8%D8%A7-%D8%AC%D9%86%DA%AF%D9%86%D8%AF%D9%87", "summary": "موج تازهٔ هشدارهای بمب‌گذاری در پروازهای مسافربری اروپا، روز پنجشنبه ۱۴ آبان به تغییر مسیر هواپیماها، فرودهای اضطراری یا اعزام جنگنده‌های نظامی برای همراهی برخی پروازها انجامید. بر اساس تازه‌ترین اخبار تأییدشده، شمار پروازهای تحت تأثیر این تهدیدها تا بعدازظهر پنجشنبه، به دست‌کم ۱۸ مورد رسید. این حوادث در حالی رخ می‌دهد که تنها دو روز پیش، موج مشابهی از هشدارهای بمب‌گذاری، فعالیت چند فرودگاه اروپایی را مختل کرده بود. تا زمان انتشار این گزارش، بازرسی‌هایی که نتیجهٔ آن‌ها اعلام شده، به کشف مواد منفجره یا اشیای خطرناک منجر نشده است. با این حال، دریافت تهدیدها برای هواپیماهای شرکت‌های مختلف در مسیرهای متعدد نیروهای امنیتی و مسئولان هوانوردی چندین کشور را همزمان درگیر کرده است. برخی هواپیماها در مقصد اصلی فرود آمده‌اند و تعدادی دیگر برای بررسی امنیتی، به فرودگاه‌های جایگزین هدایت شده‌اند. یکی از مهم‌ترین حوادث به پرواز شماره ئی‌آی۴۰۲ (EI402) شرکت ایرلندی ایرلینگوس از دوبلین به رم مربوط بود. این هواپیمای ایرباس ای۳۲۰ پس از دریافت هشدار بمب‌گذاری، مسیرش را تغییر داد و در پایگاه هوایی اورو در نرماندی فرانسه فرود آمد. دفتر سباستین لوکورنو، نخست‌وزیر فرانسه، اعلام کرد تمام ۱۵۱ مسافر و شش خدمه هواپیما در سلامت‌اند و به محل امن منتقل شده‌اند. تیم‌های نظامی خنثی‌سازی بمب برای بازرسی هواپیما مستقر شدند و دفتر نخست‌وزیر فرانسه از پیگیری لحظه‌ای وضعیت خبر داد. داده‌ پایگاه‌های اینترنتی رهگیری پرواز نشان می‌داد هواپیما هنگام نزدیک شدن به پاریس از مسیر اصلی خارج شد و پس از چند بار دور زدن در آسمان، به سمت اورو حرکت کرد. ایرلینگوس تغییر مسیر را اقدامی احتیاطی برای حفظ امنیت توصیف و اعلام کرد برای رساندن مسافران به مقصد نهایی تلاش می‌کند. در ایتالیا، پرواز ای‌وای۱۷۶۱ (AY1761) شرکت فین‌ای ue to the use of NDAs. OpenAI also unveiled new commitments to communities near its data centers, including a promise to pay for the full cost of energy usage and infrastructure, prioritize closed-loop cooling systems that use less water and work with local unions to fill jobs at the data centers. The company also pledged to invest in community improvement projects of the residents' choosing. OpenAI has been well aware of the public backlash against their facilities. The company previously promised to invest in community improvement projects selected by local residents. They also announced plans to rebrand data centers as \"compute campuses,\" an apparent acknowledgement of the widespread public dislike for the infrastructure's longtime name. This story originally appeared on POLIT", "date_str": "2026-11-05T14:06:14+00:00", "hash": "23397b714bb88ee4", "title_fa": "OpenAI چارچوب سیاست جدیدی را برای مراکز داده ارائه می کند", "summary_fa": "ساخت یک مرکز داده 16 میلیارد دلاری در سالین، میشیگان، توسعه یافته توسط Related Digital برای Oracle و OpenAI. : جیم وست/UCG/گروه تصاویر جهانی از طریق Getty Images OpenAI از اقداماتی با هدف رسیدگی به نگرانی‌های جامعه در مورد توسعه مرکز داده، طبق اعلامیه سیاستی که ابتدا با POLITICO به اشتراک گذاشته شد، رونمایی کرد. این چارچوب به دنبال رسیدگی به مخالفت های عمومی است و در عین حال به سیلیکون ولی اجازه می دهد تا زیرساخت های هوش مصنوعی را گسترش دهد. بر اساس این طرح، توسعه دهندگان مصرف آب و انرژی، سر و صدا و فرصت های شغلی را گزارش می دهند. بر اساس اعلامیه سیاستی که با POLITICO به اشتراک گذاشته شده است، OpenAI از مجموعه جدیدی از اقدامات حمایت کرده است که شرکت می گوید به جوامع اجازه می دهد تا در توسعه مرکز داده سهم بیشتری داشته باشند. این چارچوب نشان می‌دهد که چگونه یکی از آزمایشگاه‌های هوش مصنوعی پیشرو در جهان تلاش می‌کند تا مخالفت عمومی با زیرساخت را با نیاز سیلیکون ولی به ایجاد مراکز داده برای حمایت از توسعه هوش مصنوعی تطبیق دهد. این غول هوش مصنوعی در پیشنهاد جدید خود که هدفش مقامات محلی، ایالتی و فدرال است، گفت که ارائه دهندگان خدمات شهری abi. Cohen founded Humble last year, betting that building the truck and its self-driving system together would give it an edge over rivals retrofitting vehicles originally designed for human drivers. Humble is raising money at a time when investors are pouring billions into robotics and physical AI. But self-driving trucks are a reminder of how difficult it is to get machines to work in the real world. Humble has yet to begin moving freight commercially. Cohen said customer pilots will start in the first quarter of 2027 with conventional trucks moving freight to collect data. The company will then simulate the routes and test them in a virtual environment before deploying its own vehicle called the Humble Hauler. Cohen expects commercial operations to begin in the third quarter of 2027. And although Humble holds a California permit to test its vehicles with a safety driver, it would need to clear additional regulatory steps before testing without a driver or deploying commercial service in the state. The company is going after regional routes, generally under 250 miles, connecting ports, warehouses, and distribution centers. According to federal data , 87% of goods shipped by truck in the US by weight traveled less than 250 miles in 2021. Cohen also sees an opening in an industry that has long struggled to recruit and retain drivers . He argues that autonomous trucks could handle undesirable shifts and repetitive routes, freeing human d", "date_str": "2026-11-05T14:00:01+00:00", "hash": "cff25c45376cd109", "title_fa": "یک مهندس سابق اپل و اوبر 51 میلیون دلار جمع آوری کرد تا در مورد کامیون خودران تجدید نظر کند", "summary_fa": "Humble Hauler Humble Robotics Humble Robotics 51 میلیون دلار برای ساخت کامیون های برقی خودران بدون کابین جمع آوری کرد. بنیانگذار Eyal Cohen قبلا در Apple، Uber و Waabi کار می کرد. این استارت آپ انتظار دارد عملیات تجاری در سه ماهه سوم سال 2027 آغاز شود. بسیاری از شرکت های کامیون های خودران در تلاش هستند تا به کامیون های موجود آموزش دهند که خودش ate cloud service subscription. While you can back up your media to Google Photos, as of earlier this year, more data from your Android backups count toward your Google Account storage cap unless you exclude specific types. Alternatively, you can also cobble together a decent amount of cloud storage from other providers at no extra cost , but automatic backups between Android and Windows minimize the likelihood that you'll forget to save data, and your PC provides plenty of space for free. How Android Quick Share backs up to your PC Once the feature is available on your device, you'll be able to initiate backups in the Quick Share for Windows app. Your Android and Windows devices must be in close proximity and signed into the same Google Account. You can toggle Automatic backups on and change the settings for what gets backed up and to where. The transfers will then occur wirelessly in the background. As Android Authority reports, early hints at this feature suggested that Samsung phones and PCs would be excluded from automatic backups, but the release notes don't specify any further details.", "date_str": "2026-11-05T14:30:00+00:00", "hash": "21937fbbe801731a", "title_fa": "راه جدیدی برای پشتیبان گیری خودکار از عکس های اندرویدی شما به صورت رایگان وجود دارد", "summary_fa": "اگر از کاربران اندرویدی هستید که به دنبال راهی برای ذخیره عکس‌ها و ویدیوهای خود بدون به حداکثر رساندن فضای ذخیره‌سازی ابری خود هستید، ممکن است دستگاه شما به زودی قادر به پشتیبان‌گیری خودکار در رایانه شخصی شما باشد. همانطور که توسط Android Authority مشاهده شد، گوگل در یادداشت‌های انتشار خود برای سرویس‌های Google Play نسخه 26.43، پشتیبان‌گیری خودکار از اندروید به ویندوز را از طریق اشتراک سریع اضافه کرد. از رایانه شخصی خود به عنوان فضای ذخیره محلی رایگان برای عکس ها و فیلم ها استفاده کنید Quick Share یک ویژگی اشتراک گذاری فایل بی سیم برای Android است که به کاربران امکان می دهد عکس ها، فیلم ها و اسناد را به دستگاه های اطراف، از جمله رایانه های Windows و آیفون های دارای AirDrop ارسال کنند. ویژگی جدید       media: [{"source": "Billboard", "title": "How AURORA & Bear McCreary Crafted a ‘Hauntingly Ethereal’ Love Song for Galadriel in ‘The Rings of Power’ Season 3", "link": "https://www.billboard.com/music/music-news/aurora-bear-mccreary-rings-of-power-morning-shall-come-1236374364/", "summary": "Unless we’re talking about scalding pits of lava, things aren’t looking so hot in Middle Earth for season 3 of The Lord of the Rings: The Rings of Power, which premieres next Wednesday (Nov. 11). Jumping forward a few years from the events of season 2, the war between Sauron and the Elves is raging, with the forces of evil vastly outnumbering the defenders of good as the Dark Lord works to finish the One Ring. But it’s not all Mount Doom and gloom. “In this season we’re telling a love story about Galadriel and Celeborn,” composer Bear McCreary — who has been crafting delicate, dark and dynamic themes for The Rings of Power since its first season — explains in a preview clip premiering exclusively below. To help tell their love story, McCreary turned to singer-songwriter AURORA , one of Norway’s most fascinating musical exports. I couldn’t imagine a better vocal match for Tolkien’s narrative world than AURORA. From her hauntingly ethereal tones to her projecting chest voice powerful enough to echo off distant mountains, I knew she would bring something special to The Rings of Power, ” McCreary says. “I was thrilled to collaborate with her to write and perform ‘Morning Shall Come,’ a heartbreaking tribute to the love story between Galadriel and Celeborn depicted in the series’ epic third season.” Bear and I hatched a plan to create something that showed the duality that lives inside of all of us. Dark and light. Soft and tough. Being able to work alongside so many beautiful instruments and play from Bear s vision was truly an honor and a joy,” AURORA shares. “I hope people can hear themselves in it, both the part that wants to break and the part that refuses to. “It’s been r  GoodTalk, which he refers to as a full-service entertainment company across music and brands. In that vein, Burroughs brings a wealth of experience, having served as chief marketing officer for Def Jam across a five-year period, working on projects by the likes of Justin Bieber and Ye (the artist formerly known as Kanye West ), and as head of commercial relationships for Syco, where he worked on brand partnerships for the X Factor and America’s Got Talent franchises. He previously also was an exec at RCA and Bad Boy, while he has worked for the past half-decade at his own firm THTWRKS, working on artist partnerships for brands like Nike, Disney and Meta, among others. “Bringing Jeff on board is a full-circle moment for me,” Shipes said in a statement. “I’ve known him for 30 years, going back to when I was 16 and used to bug him to listen to my beats at Bad Boy. I ve always admired how he operates at the highest level while keeping things cool and having fun. Now, having him lead GoodTalk as we build its future together is a dream come true.” Related Jonny Shipes Sells Cinematic Music Group Catalog to Interscope, Launches GoodTalk “The best work of my career has happened next to a true creative visionary, and Shipes is that,” added Burroughs in a statement. “He and his incredible team built something with a real cultural identity and you can t microwave that. GoodTalk builds across music, content and brands as one business, not three. My job is to help artists build car", "date_str": "2026-11-05T17:00:00+00:00", "hash": "5785878b9cdc372e", "title_fa": "جف باروز، مدیر کهنه کار لیبل، به عنوان رئیس جمهور به GoodTalk جانی شیپس می پیوندد.", "summary_fa": "این شرکت پنجشنبه (5 نوامبر) تایید کرد، جف باروز، یک مدیر باسابقه شرکت ضبط که در دف جم، Syco، RCA و غیره سمت‌های بلندپایه‌ای داشته است، به عنوان رئیس جدید شرکت موسیقی GoodTalk Jonny Shipes پیوسته است. در نقش جدید، باروز وظیفه دارد حوزه فعالیت شرکت را از جمله در برچسب، محتوا و مشارکت در برندسازی، و همچنین حمایت از طرح‌های توسعه هنرمندان آن، گسترش دهد. جانی شیپس مرتبط با گروه موسیقی سینمایی در مورد هنرمندان در حال توسعه و زیبایی مستقل ماندن کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در سن 71 سالگی درگذشت. در سال 2007 که پشت سر موفقیت هنرمندانی مانند Joey Bada$$، Nipsey Hussle، Big K.R.I.T بود. ، شان کینگستون و اسموک دیزا، در میان دیگران. او در نهایت کاتالوگ سینماتیک را در سال 2023 به Interscope فروخت و GoodTalk را راه‌اندازی کرد که از آن به عنوان یک شرکت سرگرمی با خدمات کامل در موسیقی و برندها یاد می‌کند. در این راستا، باروز تجربیات فراوانی را به ارمغان می‌آورد، او به عنوان مدیر ارشد بازاریابی برای Def Jam در یک دوره پنج ساله خدمت کرده است، روی پروژه‌هایی مانند جاستین بیبر و یه (هنرمندی که قبلاً به عنوان کانیه وست شناخته می‌شد) کار کرده است، و به‌عنوان رئیس روابط تجاری برای Syco، جایی که در شراکت با برند برای X Factor و America’s franchis Got کار می‌کرد. او قبلاً یکی از مدیران RCA و Bad Boy بود، در حالی که در نیم دهه گذشته در شرکت خود THTWRKS کار کرده است و روی مشارکت هنرمندان برای برندهایی مانند نایک، دیزنی و متا و غیره کار کرده است. شیپس در بیانیه ای گفت: «اوردن جف برای من یک لحظه کامل است. من او را 30 سال است که می شناسم، به زمانی که 16 سال داشتم و عادت داشتم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Jeff-Burroughs-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Meta", "موسیقی"], "datetime_fa": "۱۴ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Luke Bryan on ‘Country Girl (Shake It for Me),’ ‘Play It Again’ & His Biggest Hits | Chart History", "link": "https://www.billboard.com/video/luke-bryan-country-girl-shake-it-for-me-play-it-again/", "summary": "Luke Bryan takes a trip down memory lane in Billboard Chart History , revisiting the songs and stories behind his biggest hits. He reflects on how “Rain Is a Good Thing” became his first Billboard No. 1, the emotion behind “Drink a Beer,” the making of fan favorites such as “Country Girl (Shake It for Me)” and “One Margarita,” and the moments that shaped his career. Watch as Bryan looks back on the music, collaborators and memories behind his chart history. Luke Bryan: Hey, I m Luke Bryan, and this is my Billboard Chart History . [ Song snippets play ] Oh my God. This is my song. I ve been listening to the radio all night long / Start washing all our worries down the drain. Rain is a good thing. With “Rain Is a Good Thing,” obviously seeing the video brings back so many memories. I was right outside of my college town. I think it was our first farm tour show ever. The beauty of that video is it s just really, really me in a nutshell. I mean, we didn t have a super big video budget. We just, we knew we had a great little show to video. We knew we could make the video for “Rain Is a Good Thing.” And just watching the fans interact and me interacting with them brings back really a special time in my career, where I m praying every day that I can build my career. And the best way to build your career is to have your first No. 1 song on Billboard , and obviously “Rain Is a Good Thing” was that. And I wrote it with one of my best friends in the world, Dallas Davidson. We were still relatively young writers, and we took a phrase that we grew up hearing in South Georgia: “Well, rain makes corn, corn makes whiskey, here s, you know, cheers, boys.” And the fact that we were able to take something that we heard as young men and go on to have it become my first Billboard No. 1 was really, really incredible. And the president of my record label at the time, Mike Dungan, heard it. He just really believed in what it said: Rain makes corn, corn makes whiskey. We didn t have a signature lick. J.T. Corenflos, he created that signature lick. It was truly genius what he did there, and I remember walking out the studio going, “Man, what are you doing with your fingers?” And I remember getting home one night, and he had showed me, and I spent, like, five days. And finally, I kinda mastered it, but the fact that he was able to do it like that was pretty special. Washing all our worries down the drain. Keep watching for more!", "date_str": "2026-11-05T17:00:00+00:00", "hash": "61183396ae1e0e69", "title_fa": "لوک برایان در «دختر روستایی (آن را برای من تکان بده»، «دوباره بازی کن» و بهترین آثار او | تاریخچه نمودار", "summary_fa": "لوک برایان در تاریخچه بیلبورد چارت سفری به خط حافظه دارد و آهنگ‌ها و داستان‌های پشت بزرگ‌ترین موفقیت‌هایش را مرور می‌کند. او به این فکر می‌کند که چگونه «باران چیز خوبی است» به اولین بیلبورد شماره 1 او تبدیل شد، احساساتی که در پس «یک آبجو بنوش»، ساخت محبوب‌های مورد علاقه طرفداران مانند «دختر روستایی (برای من تکان بده)» و «یک مارگاریتا» و لحظاتی که زندگی حرفه‌ای او را شکل دادند. تماشا کنید که برایان به موسیقی، همکاران و خاطرات پشت تاریخ نمودار خود نگاه می کند. لوک برایان: هی، من لوک برایان هستم، و این تاریخچه نمودار بیلبورد من است. [ پخش قطعات آهنگ ] خدای من. این آهنگ منه من تمام شب را به رادیو گوش می دهم / شروع به شستن همه نگرانی هایمان در زهکشی کنیم. باران چیز خوبی است. با «باران چیز خوبی است»، بدیهی است که دیدن این ویدیو خاطرات بسیاری را زنده می کند. من درست خارج از شهر دانشگاهم بودم. فکر می کنم این اولین نمایشگاه تور مزرعه ما بود. زیبایی آن ویدیو در این است که به طور خلاصه واقعاً واقعاً من هستم. منظورم این است که ما بودجه ویدیویی فوق العاده زیادی نداشتیم. ما فقط، می دانستیم که یک نمایش کوچک عالی برای ویدیو داریم. ما می‌دانستیم که می‌توانیم ویدیوی «باران چیز خوبی است» را بسازیم. و فقط تماشای تعامل طرفداران و تعامل من با آنها واقعاً زمان خاصی را در حرفه من به ارمغان می آورد، جایی که من هر روز دعا می کنم که بتوانم حرفه خود را بسازم. و بهترین راه برای ساختن حرفه خود این است که اولین آهنگ شماره 1 خود را در بیلبورد داشته باشید، و واضح است که \"باران چیز خوبی است\" همین بود. و من آن را با یکی از بهترین دوستانم در جهان، دالاس دیویدسون نوشتم. ما هنوز نویسنده‌های نسبتاً جوانی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Chart-History-Thumbnail-Luke-Bryan-1920x1080-V1.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Karol G Celebrates Her Album ‘No Me Arrepiento de Sentir Tanto’ With Massive Party Streamed on TikTok", "link": "https://www.billboard.com/music/latin/karol-g-no-me-arrepiento-de-sentir-tanto-party-tiktok-1236374809/", "summary": "Karol G celebrated her album No Me Arrepiento de Sentir Tanto with a massive party in Mexico City, an exclusive event streamed on TikTok on Wednesday night (Nov. 4), where four million fans tuned in simultaneously. The Colombian superstar performed a variety of songs during the show and featured special guests such as Greg González, the group La Obsesión Factory and DJ John Summit, who announced the remix of her hit “BbY WOW.” Related Karol G Sweeps Latin Airplay’s Top 3 With ‘No Me Arrepiento de Sentir Tanto’ Tracks Karol G Earns Her 23rd Latin Airplay No. 1 With Drake Collab ‘Ahi’ The Highest Grossing Latin Tours in Billboard Boxscore History Held at Quarry Studios, the performance served as a prelude to the Latin American leg of her current Viajando Por El Mundo Tropitour, which kicks off with six shows in two of Mexico’s biggest stadiums: Nov. 6, 7 and 8 at Monterrey’s Estadio BBVA, and Nov. 13, 14 and 15 at Mexico City’s Estadio GNP Seguros. The nearly hour-long celebration began at 8 p.m. local time with the songs Maybe and Bebiendo lágrimas. It followed with “Eclipse,” a piano rendition of “Final Feliz” and “Matadora.” Joined by Greg González, leader of the rock band Cigarettes After Sex on guitar, she performed “Después de Ti.” “This is my favorite song from the entire album, so I hope you sing it really loud,” Karol G said as she introduced “Con Quién Andará?” while dancing with her fans. Released Aug. 7 via Bichota/Interscope/Capitol, No Me Arrepiento de Sentir Tanto debuted at No. 1 on Billboard ’s Top Latin Albums chart and spent 11 weeks at the summit. It also entered the Billboard 200 top 10, peaking at No. 8. Karol performed a total of 11 songs during the event, including “Si Lo Ven,” a mind-blowing remix of “BbY WOW” alongside DJ John Summit. The original track, recorded with Judeline and rusowsky, has spent three weeks at No. 1 on the Latin Airplay chart and six weeks atop the Billboard Global 200 and Billboard Global Excl. U.S. charts. The setlist also included a remix of “AltaFarra,” featuring Mexican band La Obsesión Factory and DJ Maracuya. Following her North American trek, the Viajando Por El Mundo Tropitour now begins its journey in Latin America, with Mexico as one of its key stops before continuing to Europe. Karol’s arrival in the country comes after a year of significant milestones in her career. At the 2026 Billboard Latin Music Awards, she took home four honors: Hot Latin Songs Artist of the Year, Female; Top Latin Albums Arti", "date_str": "2026-11-05T16:56:31+00:00", "hash": "8b49d650b58acf52", "title_fa": "کارول جی آلبوم خود \"No Me Arrepiento de Sentir Tanto\" را با مهمانی عظیم در TikTok جشن گرفت", "summary_fa": "کارول جی آلبوم خود را No Me Arrepiento de Sentir Tanto را با یک مهمانی عظیم در مکزیکو سیتی جشن گرفت، رویدادی انحصاری که چهارشنبه شب (4 نوامبر) در TikTok پخش شد، که در آن چهار میلیون طرفدار به طور همزمان کوک کردند. سوپراستار کلمبیایی در طول برنامه آهنگ‌های مختلفی را اجرا کرد و مهمانان ویژه‌ای مانند گرگ گونزالس، گروه La Obsesión Factory و دی‌جی جان سامیت که ریمیکس آهنگ موفق او «BbY WOW» را اعلام کردند، را به نمایش گذاشت. کارول جی با تراک‌های «No Me Arrepiento de Sentir Tanto» در میان 3 آهنگ برتر لاتین ایرپلی قرار گرفت. 1 با Drake Collab \"Ahi\" پردرآمدترین تورهای لاتین در تاریخ بیلبورد باکس اسکور که در استودیوی کواری برگزار شد، این اجرا به عنوان مقدمه ای برای بازی در آمریکای لاتین از Viajando Por El Mundo Tropitour فعلی او بود که با شش نمایش در دو تا از بزرگترین استادیوم های مکزیک آغاز می شود: 8 نوامبر در EVA، Montdioery، و Monte 13، 14 و 15 نوامبر در Estadio GNP Seguros مکزیکو سیتی. این جشن تقریباً یک ساعته از ساعت 8 شب آغاز شد. به وقت محلی با آهنگ های Maybe و Bebiendo lágrimas. پس از آن «Eclipse»، اجرای پیانویی از «Final Feliz» و «Matadora» پخش شد. او با همراهی گرگ گونزالس، رهبر گروه راک Cigarettes After Sex با گیتار، آهنگ Después de Ti را اجرا کرد. کارول جی هنگام معرفی \"Con Quién Andará؟\" گفت: \"این آهنگ مورد علاقه من از کل آلبوم است، بنابراین امیدوارم آن را با صدای بلند بخوانید.\" در حالی که با طرفدارانش می رقصید در 7 آگوست از طریق Bichota/Interscope/Capitol منتشر شد، No Me Arrepiento de Sentir Tanto اولین بار در No. 1 در جدول آلبوم های لاتین برتر بیلبورد و 11 هفته را در اجلاس سپری کرد. همچنین وارد 10 آهنگ برتر بیلبورد 200 شد", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/karol-g-vito-fernicola-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۲۰:۲۶"}, {"source": "Billboard", "title": "‘Rocky’ Theme ‘Gonna Fly Now’ at 50: ‘Never Giving Up Is the Message’", "link": "https://www.billboard.com/music/chart-beat/rocky-theme-gonna-fly-now-carol-connors-1236374770/", "summary": "As the Rocky franchise of films &#x2014; the original, five Rocky sequels and three Creed movies &#x2014; has resonated with moviegoers for a half-century, so has its theme song. Fifty years ago , Rocky , about the ascent of fictional boxer Rocky Balboa, brought to life by Sylvester Stallone, was released. Made on a shoestring budget of $980,000 &#x2014; minuscule by blockbuster film standards, even in 1976 &#x2014; and shot over 28 days via a manuscript written in longhand by Stallone in three-and-a-half days, it went on to win Oscars for best picture, best director (John Alvidsen) and best editing. Related The Top 75 Movie Songs of All&#xA0;Time 2026 Is the 50th Anniversary of These 20 Milestone Music&#xA0;Moments &#x2018;Fifty Shades&#x2019; 5 Other Film Franchises With Multiple Top 10s From Different&#xA0;Movies Likewise, its anthem, &#x201C;Gonna Fly Now,&#x201D; knocked out all competition to top the Billboard Hot 100 dated July 2, 1977 . Carol Connors and Ayn Robbins cowrote its lyrics; Bill Conti was the composer. The song is packing a punch again thanks to the new movie I Play Rocky , which revisits the making of the original Rocky . (On Sept. 29, the three-song Celebrating the 50th Anniversary of Rocky was released, featuring a new orchestral version of &#x201C;Gonna Fly Now.&#x201D;) Anthony Ippolito plays Stallone in I Play Rocky , directed by Peter Farrelly. The Amazon MGM Studios film, whose title reflects Stallone&#x2019;s gloves-off insistence that he star in Rocky , premiered Sept. 12 at the Toronto International Film Festival ahead of its limited release in the United States Friday (Nov. 6) and in theaters nationwide Nov. 20. To borrow from a phrase related to the sport, I Play Rocky could be a contender &#x2014; for its own best picture award, as it has been widely thumbs-upped by critics. &#x201C;Ayn Robbins and I went to see the rough cuts of a little film they called Rocky , hoping to see if there was the possibility of a theme song we could write. There was, but it took a while to find the lyrics ,&#x201D; Connors, 84, tells Billboard about the origin of &#x201C;Gonna Fly Now.&#x201D; &#x201C;Suddenly one day when I was in the shower, I could see the whole film, especially with Rocky in training, drinking the eggs and running through the streets,&#x201D; she says. &#x201C;I knew what the film was about, I knew what the song was about and what the song should say. I had the words &#x2018;gonna fly now,&#x2019; because, to me, Rocky co", "date_str": "2026-11-05T16:50:37+00:00", "hash": "1f935acb6b8987f2", "title_fa": "تم «راکی» «اکنون پرواز خواهم کرد» در 50 سالگی: «هرگز تسلیم نشدن پیام است»", "summary_fa": "همانطور که مجموعه فیلم های راکی ​​- اصلی، پنج دنباله راکی ​​و سه فیلم کرید - برای نیم قرن با تماشاگران سینما طنین انداز شده است، آهنگ موضوعی آن نیز به همین ترتیب است. پنجاه سال پیش، راکی، درباره صعود بوکسور خیالی راکی ​​بالبوآ، که توسط سیلوستر استالونه زنده شد، منتشر شد. این فیلم که با بودجه بسیار اندک 980000 دلاری ساخته شد - حتی در سال 1976، با استانداردهای فیلم پرفروش، بسیار ناچیز بود - و بیش از 28 روز از طریق دست نوشته ای به دست استالونه در سه روز و نیم فیلمبرداری شد. مرتبط 75 آهنگ برتر فیلم تمام دوران 2026 پنجاهمین سالگرد این 20 لحظه موسیقی نقطه عطف است «Fifty Shades» 5 فرانچایز دیگر فیلم با چندین 10 فیلم برتر از فیلم‌های مختلف به همین ترتیب، سرود آن، «Gonna Fly Now» در ژوئیه در صدر رقابت قرار گرفت. 2، 1977. کارول کانرز و آین رابینز اشعار آن را سروده اند. بیل کونتی آهنگساز بود. این آهنگ به لطف فیلم جدید I Play Rocky که ساخت راکی ​​اصلی را دوباره مرور می کند، دوباره در حال افزایش است. (در 29 سپتامبر، سه آهنگ جشن پنجاهمین سالگرد راکی ​​منتشر شد که شامل نسخه ارکسترال جدیدی از \"اکنون پرواز خواهم کرد.\") آنتونی ایپولیتو در نقش استالونه در I Play Rocky به کارگردانی پیتر فارلی بازی می کند. فیلم آمازون ام جی ام استودیو، که عنوان آن منعکس کننده اصرار دستکش استالونه برای بازی در فیلم Rocky است، اولین بار در سپتامبر اکران شد. 12 در جشنواره بین المللی فیلم تورنتو پیش از اکران محدود آن در جمعه (6 نوامبر) در ایالات متحده و در سینماهای سراسر کشور در 20 نوامبر. برای وام گرفتن از عبارتی مرتبط با این ورزش، من راکی ​​بازی می کنم می تواند یک رقیب باشد - برای جایزه بهترین فیلم خودش، زیرا به طور گسترده", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/56332188-e1793893941161.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۴ آبان • ۲۰:۲۰"}, {"source": "Billboard", "title": "‘One Night on Sugar Hill’ Concert to Honor Sugar Hill Records’ Barry Poss: ‘We All Owe Him Our Careers’", "link": "https://www.billboard.com/music/country/one-night-on-sugar-hill-concert-honor-label-barry-poss-1236374748/", "summary": "Eight months ago, Bluegrass Hall of Famer and 14-time Grammy winner Jerry Douglas had an idea to bring artists together for a concert to honor the late bluegrass music champion, Sugar Hill Records’ longtime owner and co-founder Barry Poss, who died at age 79 in May 2025. “Everybody kept saying yes,” Douglas tells Billboard . “Every one of them knew Barry, and this is our wake of sorts, as well, because not everybody got to say goodbye, and we all owe him our careers.” Poss was known for launching, propelling and shaping Sugar Hill Records into a leading force in bluegrass, roots and Americana music and for helping bring scores of artists including Douglas, Ricky Skaggs, Hot Rize, Chris Thile and Nickel Creek into wider acclaim. On Nov. 5, a who’s-who of bluegrass and roots artists will gather at Durham, North Carolina s The Carolina Theatre to pay tribute to Poss’s visionary career, with One Night On Sugar Hill: Celebrating the Life of Barry Poss the Legacy of Sugar Hill Records. The towering lineup of “yeses” includes Hot Rize (Nick Forster, Tim O’Brien, Peter Wernick and Bryan Sutton), Sam Bush, Stuart Duncan, Sarah Jarosz, Robert Earl Keen, Daniel Kimbro, Doyle Lawson, Russell Moore, Mollie O’Brien, Quicksilver (a reunion with Lawson and Jimmy Haley), Peter Rowan, Kristin Scott Benson, Skaggs, Ed Snodderly, Bryan Sutton, The Red Clay Ramblers’ Jim Watson, The Whites’ Sharon Skaggs and Cheryl White, and Robin and Linda Williams. Poss, a Brantford, Ontario, native, became immersed in roots music while studying sociology at Duke University, notably after attending the Union Grove Fiddlers’ Convention. Early on, he worked for Virginia label County and Rebel Records, before forming Sugar Hill Records with Dave Freeman in 1978. Poss gained full control of the label in 1980. Poss continued spearheading the label until selling it to Welk Music Group in 1998 (Concord Music currently owns Sugar Hill Records, as a division of Rounder). Poss and Sugar Hill played an essential role in introducing the world to the talents of artists including Nickel Creek, Chris Thile, Boone Creek, Skaggs, Douglas and more. The label also recorded influential bluegrass artists including Doc Watson, Tim O’Brien, The Infamous Stringdusters, Larry Cordle, The Seldom Scene, New Grass Revival, Bryan Sutton, Doyle Lawson, The Del McCoury Band and more. Over the years, Sugar Hill has also released albums by Americana acts including Chris Hillman, Robert Earl Keen, and Guy Clark, as well as ", "date_str": "2026-11-05T16:45:21+00:00", "hash": "6de11365eceb42f8", "title_fa": "کنسرت «یک شب در تپه قندی» برای قدردانی از Sugar Hill Records بری پوز: «همه ما شغل خود را مدیون او هستیم»", "summary_fa": "هشت ماه پیش، جری داگلاس تالار مشاهیر بلوگرس و برنده 14 گرمی، ایده ای داشت تا هنرمندان را برای برگزاری کنسرتی گرد هم بیاورد تا به افتخار قهرمان فقید موسیقی بلوگراس، صاحب قدیمی و یکی از بنیانگذاران Sugar Hill Records، بری پوس، که در سن 79 سالگی در می 2025 درگذشت. همه آنها بری را می‌شناختند، و این هم نوعی از ماست، زیرا همه نمی‌توانستند خداحافظی کنند و همه ما حرفه‌مان را مدیون او هستیم.» پوس به دلیل راه‌اندازی، هدایت و شکل‌دهی Sugar Hill Records به یک نیروی پیشرو در موسیقی بلوگراس، ریشه‌ها و موسیقی آمریکاییانا و کمک به جلب توجه تعداد زیادی از هنرمندان از جمله داگلاس، ریکی اسکاگز، هات رایز، کریس تیل و نیکل کریک شناخته شد. در نوامبر 5، هنرمندانی که از بلوگراس و هنرمندان ریشه‌دار هستند، در دورهام، کارولینای شمالی در تئاتر کارولینای شمالی گرد هم می‌آیند تا با یک شب در تپه قندی: جشن زندگی بری، میراث Sugar Hill Records، به حرفه رویایی پوس ادای احترام کنند. ترکیب قدرتمند «yeses» شامل هات رایز (نیک فورستر، تیم اوبراین، پیتر ورنیک و برایان ساتون)، سم بوش، استوارت دانکن، سارا جاروس، رابرت ارل کین، دانیل کیمبرو، دویل لاوسون، راسل مور، مولی اوبراین، پیتر هالون، کوئیک سیلور، و پیتر هالیون، کوئیک سیلور، و پیتر هالیون، کوئیک سیلور (به همراه لاوسون) است. اسکات بنسون، اسکاگز، اد اسنادرلی، برایان ساتن، جیم واتسون از رامبلرز قرمز، شارون اسکاگز و شریل وایت از سفیدها، و رابین و لیندا ویلیامز. پوس، بومی برنتفورد، انتاریو، در حین تحصیل در رشته جامعه شناسی در دانشگاه دوک، به ویژه پس از شرکت در کنوانسیون کمانچه داران یونیون گروو، غرق در موسیقی ریشه ای شد. او در اوایل، قبل از تشکیل Sugar Hill Records با دیو فریمن در سال 1978، برای لیبل ویرجینیا County و Rebel Records کار کرد. Poss در سال 1980 کنترل کامل این لیبل را", "image_url": "https://www.billboard.com/wp-content/uploads/2026/ lled ATEEZ: LIGHT THE WAY IN CINEMAS . Sony said Michael Jackson’s catalog saw a nearly 300% increase in physical and digital music following the release of the biographical film Michael in April. Ella Langley has surpassed 1.8 billion cumulative streams globally, as Choosin’ Texas landed a record-extending 26th week at No. 1 on the Billboard Hot 100 on Nov. 2. Related During ATEEZ s Biggest Year, Leader Hongjoong Wanted to Share a Song About Having Enough Music publishing reported a 12.2% increase in revenue to 119 billion yen. Physical revenue grew by 16.5% to 32 billion yen. Adjusted operating income before depreciation and amortization (OIBDA) rose more than 10% to 155 billion yen on increased revenue.", "date_str": "2026-11-05T16:43:00+00:00", "hash": "8e77112f7dd1a075", "title_fa": "کی پاپ، کانتری، لاتین: فهرست جهانی سونی باعث رشد درآمد دو رقمی می شود", "summary_fa": "کسب‌وکار موسیقی سونی در روز پنج‌شنبه (5 نوامبر) بیش از 10 درصد رشد درآمد سه‌ماهه را گزارش کرد، زیرا فهرست پرفروش‌ترین هنرمندان جهانی از جمله ATEEZ، مایکل جکسون، الا لنگلی و Bad Bunny، رشد درآمدهای استریم، کالا و کنسرت را تقویت کرده است. بخش موسیقی سونی که شامل Sony Music Entertainment، Sony Music Entertainment (ژاپن) و Sony Music Publishing است، درآمد کلی 598 میلیارد ین (3.75 میلیارد دلار) را گزارش کرد. درآمد عملیاتی 6.4 درصد افزایش یافت و به 123 میلیارد ین (772.1 میلیون دلار) رسید، زیرا درآمد پخش جریانی رشد قابل توجهی 7 درصدی در تجارت موسیقی ضبط شده و 6 درصدی در تجارت انتشارات را بر اساس دلار آمریکا نشان داد. خلاصه درآمدهای مربوط به سه ماهه سوم موسیقی: این چیزی است که هر شرکتی ساخته است (در حال به روز رسانی) کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در ۷۱ سالگی درگذشت. فروش. این قدرت گسترده حمایتی را برای مدیریت سونی فراهم کرد تا پیش‌بینی کل سال خود را برای فروش 5 درصد به 2.3 تریلیون ین (14.438 میلیارد دلار) و با 6 درصد درآمد عملیاتی به 445 میلیارد ین (2.793 میلیارد دلار) برساند. یکی از پرفروش‌ترین گروه‌ها در این سه‌ماهه، ATEEZ، سومین آلبوم خود را در رتبه 1 بیلبورد re Swift had been scheduled to play three Eras shows in August 2024 with knives or homemade explosives. Aided by United States intelligence, Austrian authorities were able to arrest him and two other suspects linked to the plot before the attacks could be carried out, but the concerts were still canceled out of caution for public safety. Investigators discovered that, leading up to the thwarted attacks, the three men had pledged allegiance to the Islamic State after being radicalized on the internet. This is one of three core areas of exploration the documentary will delve into, with a synopsis reportedly promising that Taylor Swift Wien will contrast the extremist, misogynistic online communities to which the suspects belonged with the inclusive, empowered world of the Swifties, many of whom gathered in the streets of Vienna despite the concert cancellations to sing songs, trade friendship bracelets and find comfort in one another in the face of near tragedy. The other focus of the doc will be the authorities “ticking clock” investigations and ultimate prevention of the terrorist plot. Having our Vienna shows cancelled was devastating, Swift wrote in an Instagram statement a couple of weeks after the arrests. The reason for the cancellations filled me with a new sense of fear, and a tremendous amount of guilt because so many people had planned on coming to those shows. But I was also so grateful to the authorities because thanks to them, we were gri", "date_str": "2026-11-05T16:34:51+00:00", "hash": "67a6f709e2fbf871", "title_fa": "نمایش‌های تور کنسل شده دوره‌های تیلور سوئیفت در اتریش: مستند جدید توطئه تروریستی و مقاومت طرفداران خنثی شد", "summary_fa": "بیش از دو سال از زمانی که تیلور سوئیفت مجبور شد به دلیل توطئه تروریستی که قصد کشتن ده‌ها هزار نفر را داشت، برنامه‌های Eras Tour خود را در وین لغو کرد، وضعیتی که اکنون سوژه یک مستند جدید خواهد شد، می‌گذرد. مظنون مرتبط در طرح حمله به کنسرت تیلور سویفت در وین محکوم به 15 سال توطئه تروریستی در کنسرت تیلور سوئیفت نمی‌تواند از دیزنی برای سریال «پایان یک دوران» شکایت کند، قاضی حکم می‌کند تیلور سوئیفت در دوره‌های وین تور کنسرت بسیاری را بازداشت می‌کند. مردم در حد امکان همانطور که ورایتی در روز پنجشنبه (5 نوامبر) گزارش داد، تیلور سویفت وین در دست ساخت از کارگردانان آندریاس پیچلر و ورونیکا کاسرر است و در اکتبر 2027 به نمایش در خواهد آمد. پس از انتشار اولیه آن در پخش کننده آلمانی ZDF، این پروژه در سطح بین المللی توزیع خواهد شد. این خبر تنها چند ماه پس از آن منتشر شد که یک مظنون به نام Beran A. به دلیل برنامه ریزی برای حمله به سویفتی ها در و اطراف استادیوم ارنست هاپل، جایی که سوئیفت قرار بود در اوت 2024 سه نمایش Eras را با چاقو یا مواد منفجره دست ساز اجرا کند، به 15 سال زندان محکوم شد. با کمک اطلاعات ایالات متحده، مقامات اتریشی توانستند او و دو مظنون دیگر مرتبط با توطئه را قبل از انجام حملات دستگیر کنند، اما کنسرت ها همچنان به دلیل احتیاط برای امنیت عمومی لغو شد. بازرسان متوجه شدند که منجر به حملات خنثی شده، این سه مرد پس از اینکه در اینترنت رادیکال شده بودند، با دولت اسلامی بیعت کرده بودند. این یکی از سه حوزه اصلی کاوشی است که مستند به آن می‌پردازد، با خلاصه‌ای که ظاهراً نوید می‌دهد که تیلور سویفت وین، جوامع آنلاین افراطی و زن‌ستیز را که مظنونان به آن تعلق داشتند را با", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/P10XA4H-e1771352478287.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱۴ آبان • ۲۰:۰۴"}, {"source": "Billboard", "title": "Doja Cat Tweaks ‘Paint the Town Red’ Lyrics After Texas Turns Blue Following Democrats’ Victory", "link": "https://www.billboard.com/music/rb-hip-hop/doja-cat-paint-the-town-red-lyrics-change-midterm-elections-1236374750/", "summary": "Doja Cat brought the Tour Ma Vie World Tour to Dallas on Wednesday night (Nov. 4), and she celebrated Texas midterm election results by reworking her Paint the Town Red lyrics. Related ‘Dreams Do Come True’: Celebrities React as Democrats Sweep to Power In 2026 Midterm Election Doja Cat s Tour Ma Vie Setlist: Every Song Played at the First U.S. Show Eminem s Not Afraid Featured in Abdul El-Sayed s Election Day Campaign In the midst of performing her Billboard Hot 100 No. 1 hit, Doja made a slight tweak to have the American Airlines Center painted blue in celebration of Texas overwhelming victory by the Democrats. I let all that get to my head/ I don t care, I paint the town blue, she raps while strutting around in a silver bikini and matching heels. The second time around, Doja gave the Texas audience the chance to repeat the tweaked line in the chorus back to her. Like many other states, the midterm elections brought on a wave of blue throughout the United States. Texas underwent major changes, with Democrat James Talarico taking a seat in the Senate seat with his win over the Trump-backed Republican Ken Paxton. It was a historic victory for Democrat Gina Hinojosa in the gubernatorial election, as she became the first Latina governor in the Lone Star State s history. Hinojosa took out the incumbent Greg Abbott, a Republican. Republican Texas Sen. Ted Cruz even admitted defeat on X after seeing the drubbing by the Democrats. 2026 was not simply a blue wave; it was a blue tsunami. It was an a kicking, he wrote. It was not simply a bad 2006 midterm election. It was a Watergate-level repudiation. Around the country, Democrats have flipped seven Senate seats and 35 House seats as of press time to gain control of Congress. Five states also went from Republican to Democrat governors. Paint the Town Red arrived in August 2023 as the lead single heading into Scarlet . The anthem became Doja s first solo No. 1 smash on the Hot 100 and was nominated for best pop solo performance at the Grammy Awards. It remains to be seen if Doja who has a pair of Texas concerts coming up will continue with the lyric revision. The 31-year-old is set to bring the Tour Ma Vie World Tour to San Antonio (Nov. 6) and Houston (Nov. 7).", "date_str": "2026-11-05T16:26:58+00:00", "hash": "3af97779a0a00d05", "title_fa": "پس از اینکه تگزاس در پی پیروزی دموکرات ها آبی شد، متن ترانه «شهر را به رنگ قرمز رنگ کنید» را تغییر می دهد.", "summary_fa": "Doja Cat تور جهانی Tour Ma Vie را چهارشنبه شب (4 نوامبر) به دالاس آورد و نتایج انتخابات میان دوره ای تگزاس را با بازنویسی اشعار Paint the Town Red خود جشن گرفت. «رویاها به حقیقت می پیوندند» مرتبط: سلبریتی ها با رسیدن دموکرات ها به قدرت در انتخابات میان دوره ای 2026 واکنش نشان می دهند. با 1 ضربه، دوجا تغییرات جزئی انجام داد تا مرکز خطوط هوایی آمریکا را به رنگ آبی در جشن پیروزی قاطع تگزاس توسط دموکرات ها بپوشاند. اجازه می‌دهم همه چیز به سرم برود/ اهمیتی نمی‌دهم، من شهر را آبی رنگ می‌کنم، او در حالی که با بیکینی نقره‌ای و کفش‌های پاشنه‌دار همسان به اطراف می‌چرخد، رپ می‌زند. بار دوم، دوجا به تماشاگران تگزاس این فرصت را داد که خط بهینه‌سازی شده در گروه کر را برای او تکرار کنند. مانند بسیاری از ایالت های دیگر، انتخابات میان دوره ای موج آبی را در سراسر ایالات متحده به راه انداخت. تگزاس دستخوش تغییرات عمده ای شد و جیمز تالاریکو دموکرات با پیروزی بر کن پکستون جمهوری خواه مورد حمایت ترامپ، در کرسی سنا نشست. این یک پیروزی تاریخی برای جینا هینوجوسا دموکرات در انتخابات فرمانداری بود، زیرا او اولین فرماندار لاتین در تاریخ ایالت لون استار شد. هینوجوسا گرگ ابوت، رئیس جمهوری خواه را کنار زد. سناتور جمهوری خواه تگزاس تد کروز حتی پس از دیدن دعوای دموکرات‌ها، شکست در X را پذیرفت. 2026 فقط یک موج آبی نبود. سونامی آبی بود او نوشت: این یک لگد زدن بود. این فقط یک انتخابات میان دوره ای بد در سال 2006 نبود. این یک انکار در سطح واترگیت بود. در سرتاسر کشور، دموکرات ها هفت کرسی سنا و 35 کرسی مجلس نمایندگان را تا زمان انتشار این خبر تغییر داده اند تا کنترل کنگره را به دست آورند. پنج ایالت نیز از فرمانداران جمهوری خواه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/2283783100-e1786636561580.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۴ آبان • ۱۹:۵۶"}, {"source": "Deadline", "title": "Robert Pattinson To Receive The 40th Annual American Cinematheque Award", "link": "https://deadline.com/2026/11/robert-pattinson-40th-american-cinematheque-award-1237 om/2026/music/news/rush-sphere-residency-elevate-from-the-norm-las-vegas-1236940351/", "summary": "The group Rush, which undertook a highly successful reunion tour this year, has announced a residency at Las Vegas Sphere for May 2027, with five dates set to take place under the banner of Elevate From the Norm. The 2027 Sphere shows are set for May 21, 23, 26, 28 and 30. Tickets for the [ ]", "date_str": "2026-11-05T16:10:39+00:00", "hash": "b22d909d25664141", "title_fa": "راش اقامتگاه Sphere را در لاس وگاس برای بهار 2027 اعلام کرد", "summary_fa": "گروه راش که امسال یک تور گردهمایی بسیار موفق را انجام داد، اقامت خود را در لاس وگاس Sphere برای می 2027 اعلام کرده است، با پنج تاریخ که قرار است تحت پرچم Elvate From the Norm برگزار شود. نمایش‌های Sphere 2027 برای روزهای 21، 23، 26، 28 و 30 می تنظیم شده است. بلیت‌های [ ] گروه راش، که تور گردهمایی بسیار موفقی را در سال جاری انجام داد، اقامت خود را در لاس وگاس Sphere برای می 2027 اعلام کرده است، با پنج تاریخ که قرار است تحت پرچم Elvate From the Norm برگزار شود. گدی لی، خواننده و بیسیست، نظرات خود را در مورد نواختن Sphere در بیانیه ای اعلام کرد. وقتی برای اولین بار نام Sphere را شنیدم، با خودم فکر کردم، \"وای، چه حیف که راش دیگر در تور نیست، زیرا این مکان برای نوع نگرش بصری که ما همیشه برنامه هایمان را با آن طراحی کرده ایم، ساخته شده است.\" به طور معمول ما ماه ها را صرف طراحی جلوه های بصری برای نمایش هایمان می کنیم و این سناریو شبیه گیلاس بالای تیم طراحی ما به نظر می رسید. اما زندگی اگر نگوییم تعجب آور نیست و اکنون، اینجا هستیم که در زمان حال زندگی می کنیم و در حال گردش هستیم و می توانیم آن رویای خاص را محقق کنیم. او ادامه داد، ما در حال حاضر سخت کار می‌کنیم تا مفاهیم تور خود را گسترش دهیم و دیوانه‌های جدیدی را به تناسب این مکان باورنکردنی بسازیم و از نظر موسیقی نمایشی را که در برخی از شهرهای خود انجام می‌دادیم اجرا کنیم. به معنای پخش تمام 2112 و تمام تصاویر متحرک به همراه مجموعه ای از آهنگ های دیگر. ما بسیار هیجان زده هستیم که از این فرصت باورنکردنی برای خوشحال کردن طرفدارانمان هم از نظر بصری و هم از نظر", "image_url": "https://variety.com/wp-content/uploads/2025/10/Rush-press-photo-Richard-Sibbald-e1759758957927.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۹:۴۰"}, {"source": "Variety", "title": "Mike Lee and Darren Yan Unveil ISO, a Next-Generation Management Firm Specializing in Creators, Live Streamers, Gaming and Music", "link": "https://variety.com/2026/digital/news/mike-lee-darren-yan-iso-management-plaqueboymax-1236940038/", "summary": "Gaming and digital media veterans Mike Lee and Darren Yan have joined together to launch ISO, a talent management firm that specializes in representing the hottest commodities in marketing and media these days: creators and livestreaming personalities. Based in Los Angeles, Lee and Yan have quietly been building ISO’s operations for about a year, with [ ]", "date_str": "2026-11-05T16:09:05+00:00", "hash": "a0954a2f71a78567", "title_fa": "مایک لی و دارن یان از ISO، یک شرکت مدیریت نسل بعدی متخصص در سازندگان، پخش‌کننده‌های زنده، بازی و موسیقی رونمایی کردند.", "summary_fa": "مایک لی و دارن یان کهنه‌کارهای بازی و رسانه‌های دیجیتال به هم پیوسته‌اند تا ISO را راه‌اندازی کنند، یک شرکت مدیریت استعداد که در معرفی داغ‌ترین کالاها در بازاریابی و رسانه این روزها تخصص دارد: سازندگان و شخصیت‌های پخش زنده. لی و یان که در لس آنجلس مستقر هستند، تقریباً یک سال است که بی سر و صدا عملیات ISO را ایجاد می کنند، با [ ] رهبران سابق UTA و FaZe Clan هدفشان شکل دادن به نمایندگی برای ستاره های بومی دیجیتالی است. یان، مدیر ارشد استعدادیابی سابق شرکت سبک زندگی الکترونیکی FaZe Clan، به عنوان یکی از بنیانگذاران و رئیس موسیقی فعالیت می کند. ISO (که مخفف In Search Of است) در حال حاضر حدود 24 کارمند دارد که بین لس آنجلس، نیویورک و آتلانتا پراکنده شده اند. این فهرست شامل بیش از 90 پخش کننده زنده، گیمر، هنرمند، VTubers (معروف به پخش زنده که از آواتارهای متحرک استفاده می کنند) و سازندگان سبک زندگی فعال در زمینه زیبایی، غذا و سایر محتواهای بسیار جذاب است. مت آلسبرگ، یکی از آلبرت‌های پلی‌استیشن، توییچ و UTA سونی، به‌عنوان رئیس استعدادهای ISO قرارداد امضا کرده است. لی به Variety می‌گوید: «آنچه ما در تلاشیم تا بسازیم چیزی است که به خالق دیجیتال اختصاص داده شده است. هر دو بنیانگذار تجربه کار در UTA و شرکت های بزرگی را دارند که از گرمای ستاره های نسل بعدی اقتصاد توجه استفاده می کنند. ایزو از این باور لی و یان متولد شد که شرکت‌های نمایندگی استعداد باید برای حمایت از استعدادهای بومی دیجیتالی بسیار متفاوت از قرن گذشته در فیلم، تلویزیون و موسیقی سنتی عمل کنند. فهرست ISO در هنگام راه اندازی شامل حدود 90 مشتری، از جمله ستاره های دیجیتالی قابل توجهی مانند PlaqueBoyMax، Jasontheween، Ironmouse، Lacy، Vanillamace، Kyedae، jessechrisss، Angelo Marasigan، RDCWorld و غیره است. ISO و مشتریانش در حال", "image_url": "https://variety.com/wp-content/uploads/2026/11/ISO-Co-Founders-L-to-R_-Darren-Yan-Mike-Lee-Color-e1793865060434.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۴ آبان • ۱۹:۳۹"}, {"source": "Variety", "title": "Lady Gaga, Jack White, Boy George Lead Songwriters Hall of Fame 2027 Nominees", "link": "https://variety.com/2026/music/news/songwriters-hall-fame-2027-nominees-lady-gaga-boy-george-1236939635/", "summary": "The Songwriters Hall of Fame has announced the nominees for its 2027 class, a genre- and generation-spanning list led by stars like Lady Gaga, Jack White, Boy George, Deborah Harry and Chris Stein of Blondie, Sia, Vince Gill and Grandmaster Melle Mel as well as “non-performing” songwriters like disco titan Pete Belotte, Scandinavian pop powerhouses [ ]", "date_str": "2026-11-05T16:00:00+00:00", "hash": "f1b039f0c8468c82", "title_fa": "نامزدهای تالار مشاهیر 2027 لیدی گاگا، جک وایت، پسر جورج آهنگسازان اصلی", "summary_fa": "تالار مشاهیر ترانه سراها نامزدهای کلاس 2027 خود را اعلام کرده است، یک فهرست ژانر و نسل که توسط ستارگانی مانند لیدی گاگا، جک وایت، بوی جورج، دبورا هری و کریس استاین از بلوندی، سیا، وینس گیل و استاد بزرگ مل مل و همچنین ترانه‌های بی‌نقشه‌ای مانند آهنگ‌ها و ترانه‌های نوازنده، نامزد شده است. نیروگاه  of 20 years, but why quibble?) Swift was the first former recipient of the Hal David Starlight Award, which honors rising songwriters, to graduate to full induction into the SHOF. Ne-Yo, who is on this year’s ballot, could become the second. He received the Starlight Award in 2010. Related Here s Taylor Swift s Full 20-Minute Induction Speech at the 2026 Songwriters Hall of Fame Several of this year’s nominees have collaborated with past SHOF inductees. Pete Bellotte wrote many hits with and for Donna Summer, who was inducted posthumously in 2025. Andreas Carlsson co-wrote major hits with Max Martin, a 2017 honoree. Toni Wine co-wrote the 1966 smash “A Groovy Kind of Love” with 1987 inductee Carole Bayer Sager. Eight members of WAR – five living and three deceased – are vying for a spot on the performing songwriters’ list. If they make it, they’ll become the largest ensemble to be inducted into the SHOF. That distinction is currently held by The Isley Brothers. Six members of that legendary R B group were inducted in 2022. Other deceased songwriters on this year’s ballot are Frank Beard and Dusty Hill of ZZ Top (nominated alongside their still-living colleague Billy Gibbons) and Bob Feldman, best known for co-writing the 1963 smash “My Boyfriend’s Back,” who is nominated alongside his still living collaborators Jerry Goldstein and Richard Gottehrer. Several of this year’s SHOF candidates have won major songwriting awards. Gaga won an Oscar for best original song for co-writing “Shallow.” Vince Gill has won song of the year at the CMA Awards a record four times. Tom Douglas won a CMA Award for song of the year for co-writing Miranda Lambert’s “The House That Built Me.” Dan Wilson has won both a Grammy for song of the year (for co-writing The Chicks’ “Not Ready to Make Nice”) and a CMA Award for song of the year (for co-writing Chris Stapleton’s White Horse”). It’s not easy to be elected to the SHOF. Twenty-six songwriters or teams of songwriters are vying for just six spots in the Class of 2027 – divided e", "date_str": "2026-11-05T16:00:00+00:00", "hash": "da2bac06137f9193", "title_fa": "لیدی گاگا، شکیرا، P!nk و بیشتر نامزدهای کلاس تالار مشاهیر ترانه سرایان 2027: فهرست کامل نامزدها", "summary_fa": "تیلور سوئیفت قدرت ستارگان زیادی را به مراسم گالا جوایز القایی تالار مشاهیر 2026 در ماه ژوئن به ارمغان آورد. چندین نامزد در رای گیری برای افتخارات 2027، از جمله لیدی گاگا، شکیرا و P!nk، می توانند قدرت ستاره ای مشابهی را ارائه دهند. یک ترانه‌سرا با کاتالوگی از آهنگ‌های قابل توجه، 20 سال پس از اولین انتشار تجاری یک آهنگ، واجد شرایط القاء می‌شود. (اولین تک آهنگ گاگا، \"Just Dance\" (هنر. Colby O'Donis) در آوریل 2008 منتشر شد، کمی خجالتی از 20 سال، اما چرا قیچی؟) سوئیفت اولین دریافت کننده سابق جایزه ستاره لایت هال دیوید، که به افتخار ترانه سرایان در حال ظهور، فارغ التحصیل شد تا به طور کامل به SHOF القا شود. Ne-Yo که در رای امسال است، می تواند دومین شود. او در سال 2010 جایزه ستاره لایت را دریافت کرد. مطالب مرتبط در اینجا سخنرانی کامل 20 دقیقه ای تیلور سوئیفت در تالار مشاهیر ترانه سرایان 2026 چندین نفر از نامزدهای امسال با اعضای قبلی SHOF همکاری کرده اند. پیت بلوت با و برای دونا سامر، که پس از مرگش در سال 2025 انتخاب شد، آهنگ های موفق زیادی نوشت. آندریاس کارلسون به همراه مکس مارتین، برنده جایزه سال 2017، آهنگ های مهم را نوشت. تونی واین در سال 1966 با کارول بایر ساگر، کارول بایر ساگر، فیلم فوق‌العاده «A Groovy Kind of Love» را نوشت. هشت عضو WAR - پنج زنده و سه مرده - برای جایگاهی در لیست ترانه سرایان مجری رقابت می کنند. اگر آن‌ها موفق شوند، به بزرگترین گروهی تبدیل می‌شوند که به SHOF معرفی می‌شوند. این تمایز در حال حاضر توسط The Isley Brothers برگزار می شود. شش عضو از آن گروه افسانه ای R B در سال 2022 معرفی شدند. دیگر ترانه سرایان متوفی در رای گیری امسال فرانک بیرد و داستی هیل از ZZ Top (نامزد شده", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2259476107-e1793738425264.jpg?w=1024", "category": "سینما و سریال", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۴ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Ozzfest Announces 2027 Return With Three-Date U.K./North American Run", "link": "https://www.billboard.com/music/concerts/ozzfest-2027-return-three-dates-uk-us-mexico-details-tickets-1236374758/", "summary": "After starting a countdown clock earlier this week to a major announcement, Ozzfest confirmed on Thursday morning (Nov. 5) that it will celebrate its 30th anniversary with a trio of shows in the U.K., U.S. and Mexico. The kick-off date will take place at the National Bowl in Milton Keynes, U.K. on July 10, followed by a show at the Glen Helen Amphitheater in San Bernardino, Calif. on Sept. 11 and a gig at Estadio GNP Seguros in Mexico City on Sept. 18. At press time no lineup for the shows had been announced. Ozzy was the first to launch his own traveling metal festival,” said Sharon Osbourne, the event s co-founder and widow/manager of the festival s namesake, late metal legend Ozzy Osbourne . And Ozzfest will always remain an important part of Ozzy’s legacy.” The Live Nation-promoted shows will include a nod to Ozzfest s legacy, as the San Bernardino venue is the same one where the festival launched in 1996; the Mexico City date will represent the first edition of the show in Mexico. It will also be the first Ozzfest since Osbourne s passing last July, less than two weeks after his final performance at the all-star Back to the Beginning concert on July 5, 2025. Osbourne was on hand for the most recent Ozzfest show, which took place at The Forum in Los Angeles on New Year s Eve 2018. Sharon Osbourne will curate the lineups for the 2027 shows, with a promise of a full lineup reveal in the coming months. Early Bat tickets for all three shows will go on sale on Friday (Nov. 6) at 10 a.m. local time here and here . Ozzfest was conceived by Sharon Osbourne in 1996 after she was unable to book Ozzy on the then-popular Lollapalooza alt rock festival. It quickly became a popular annual touring festival that brought a day of hard rock to the U.S. and Europe through 2008. Since then, it has taken place sporadically, most recently as a one-day event at the Forum in 2018 with a lineup featuring Rob Zombie, Body Count, Marilyn Manson and others. Speaking to Billboard earlier this year, Sharon Osbourne revealed that she was in negotiations with Live Nation to bring the festival back. “It was something Ozzy was very passionate about: giving young talent a stage in front of a lot of people,” she said. “We really started metal festivals in this country. It was [replicated but] never done with the spirit of what ours was, because ours was a place for new talent. It was like summer camp for kids.”", "date_str": "2026-11-05T15:46:24+00:00", "hash": "79a708da1ac58139", "title_fa": "Ozzfest بازگشت 2027 را با سه تاریخ بریتانیا / آمریکای شمالی اعلام کرد", "summary_fa": "پس از شروع یک ساعت شمارش معکوس در اوایل این هفته برای اعلامیه مهم، Ozzfest در صبح پنجشنبه (5 نوامبر) تایید کرد که 30 سالگی خود را با سه نمایش در بریتانیا، ایالات متحده و مکزیک جشن خواهد گرفت. تاریخ شروع در 10 ژوئیه در National Bowl در میلتون کینز، بریتانیا برگزار خواهد شد، پس از آن نمایشی در آمفی تئاتر گلن هلن در سن برناردینو، کالیفرنیا در 11 سپتامبر و یک کنسرت در Estadio GNP Seguros در مکزیکو سیتی در 18 سپتامبر برگزار خواهد شد. در زمان مطبوعات هیچ ترکیبی برای نمایش ها اعلام نشده بود. آزی اولین کسی بود که جشنواره متال مسافرتی خود را راه اندازی کرد. و Ozzfest همیشه بخش مهمی از میراث آزی باقی خواهد ماند.\" برنامه های پخش شده توسط Live Nation شامل اشاره ای به میراث اوزفست خواهد بود، زیرا محل برگزاری سن برناردینو همان مکانی است که جشنواره در سال 1996 در آن راه اندازی شد. تاریخ مکزیکوسیتی نشان دهنده اولین نسخه نمایش در مکزیک خواهد بود. همچنین این اولین جشنواره آزبورن از زمان درگذشت آزبورن در جولای گذشته خواهد بود، کمتر از دو هفته پس از آخرین اجرای او در کنسرت ستاره بازگشت به آغاز در 5 ژوئیه 2025. آزبورن برای آخرین نمایش Ozzfest، که در The Forum در لس آنجلس در شب سال نوی 2018 برگزار شد، حاضر بود. شارون آزبورن با وعده‌هایی که در ماه‌های آینده نمایش‌های کاملی را ارائه خواهد کرد، خط‌آپ‌ها را برای نمایش‌های 2027 مدیریت خواهد کرد. بلیت های Early Bat برای هر سه نمایش در روز جمعه (6 نوامبر) ساعت 10 صبح به وقت محلی اینجا و اینجا به فروش می رسد. آزفست توسط شارون آزبورن در سال 1996 پس از اینکه او نتوانست اوزی را در جشنواره محبوب موسیقی آلت راک Lollapalooza در آن زمان رزرو کند، شکل گرفت. این به سرعت به یک", "image_url": "https://www.billboard.com/wp-content/uploads/2026/03/610277660-e1772544862393.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۹:۱۶"}, {"source": "Billboard", "title": "How IFPI CEO Victoria Oakley Is Tackling AI & Streaming Fraud Head-On: ‘We’ve Got Work to Do’", "link": "https://www.billboard.com/pro/ifpi-ceo-victoria-oakley-ai-streaming-fraud-interview/", "summary": "This June, IFPI sprang into action. The trade organization for the recorded-music business around the world is best known for its annual Global Music Reports, which track annual economic growth and development for the industry by country and region. But that month, it launched the first of three initiatives intended to tackle issues it sees as critical to the health of the global business: tagging and identifying AI-generated songs on streaming services; disqualifying AI-generated songs from its 60-plus international charts; and combating streaming fraud. Related IFPI Launches Initiative to Combat Streaming Fraud The measures were a relatively rare foray into consumer and business practices for the organization, which traditionally spends the majority of its efforts on government lobbying for legal protections for the creative industry and infrastructure support for the industry in developing regions. But for Victoria Oakley , who became CEO of IFPI in April 2024 after a decades-long career in British diplomacy and corporate consulting, the rapid advancement of technology, particularly AI, has made such industrywide consensus-building essential. I think music at this period in its evolution, with the challenges and opportunities that it s facing, the real mix between tech, creativity, business and government, is a complex and really important blend right now, says Oakley, who spent 18 years in the British Foreign Office before stints advising companies like Google, Apple and McDonald’s prior to IFPI. I didn t want to go to a trade body that argues about a press release that nobody really wants to issue. I wanted to come and do lobbying and advocacy and storytelling for an industry that I think matters. This year in particular, the music industry has confronted challenges that teeter on the existential, none more so than AI, which both offers huge creative potential and very real risks to the streaming business model and trust of consumers. And while the broader AI conversation is much bigger than music, Oakley is determined to make sure the sector doesn’t get lost in the shuffle. In the regulatory and political world, I think music is a sector that s beloved but not particularly thought about or understood, and that s because we haven t told our story, Oakley says. But we re now at a time where AI is not coming; it s here. And we need to be able to use AI as an opportunity for music, but also we need governments to help us build the right systems and guard", "date_str": "2026-11-05T15:40:46+00:00", "hash": "b91bf1987f9132bb", "title_fa": "ویکتوریا اوکلی، مدیر عامل IFPI چگونه با هوش مصنوعی و کلاهبرداری جریانی مقابله می‌کند: \"ما باید کاری انجام دهیم\"", "summary_fa": "ژوئن امسال، IFPI وارد عمل شد. سازمان تجارت برای تجارت موسیقی ضبط شده در سراسر جهان بیشتر به خاطر گزارش های موسیقی جهانی سالانه خود شناخته شده است که رشد و توسعه اقتصادی سالانه این صنعت را بر اساس کشور و منطقه دنبال می کند. اما در آن ماه، اولین ابتکار از سه ابتکار برای مقابله با مسائلی را که برای سلامت تجارت جهانی حیاتی می‌داند، راه‌اندازی کرد: برچسب‌گذاری و شناسایی آهنگ‌های تولید شده توسط هوش مصنوعی در سرویس‌های پخش. رد صلاحیت آهنگ های تولید شده توسط هوش مصنوعی از بیش از 60 نمودار بین المللی. و مبارزه با تقلب در جریان. IFPI مرتبط برای مبارزه با کلاهبرداری جریانی، اقدامی نسبتاً نادر برای اقدامات مصرف‌کننده و تجاری برای سازمان بود، که به طور سنتی اکثر تلاش‌های خود را صرف لابی‌گری دولت برای حمایت‌های قانونی از صنعت خلاق و پشتیبانی زیرساختی برای صنعت در مناطق در حال توسعه می‌کند. اما برای ویکتوریا اوکلی، که در آوریل 2024 پس از چندین دهه فعالیت در دیپلماسی بریتانیا و مشاوره شرکتی، مدیرعامل IFPI شد، پیشرفت سریع فناوری، به‌ویژه هوش مصنوعی، چنین اجماع‌سازی در سطح صنعت را ضروری کرده است. اوکلی که 18 سال را در وزارت خارجه بریتانیا گذراند و قبل از IFPI مشاور شرکت‌هایی مانند گوگل، اپل و مک‌دونالد بود، می‌گوید: فکر می‌کنم موسیقی در این دوره در تکامل خود، با چالش‌ها و فرصت‌هایی که با آن مواجه است، ترکیب واقعی بین فناوری، خلاقیت، تجارت و دولت، ترکیبی پیچیده و واقعاً مهم در حال حاضر است. من نمی خواستم به یک سازمان تجاری بروم که در مورد یک بیانیه مطبوعاتی که هیچ کس واقعاً نمی خواهد منتشر کند بحث می کند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/victoria-oakley-billboard-2026-bb12-cr-Louise-Haywood-Schiefer-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Apple", "موسیقی"], "datetime_fa": "۱۴ آبان • ۱۹:۱۰"}, {"source": "Billboard", "title": "Rush Bringing Reunion Tour to Sphere With ‘Elevate From the Norm’ Residency", "link": "https://www.billboard.com/music/rock/rush-sphere-2027-residency-dates-tickets-1236374729/", "summary": "Rush will bring their triumphant reunion tour to Las Vegas Sphere next spring. The beloved prog rock band fronted by co-founders singer/bassist Geddy Lee and guitarist Alex Lifeson announced on Thursday (Nov. 5) that they will touch down at the iconic venue for the five-date Elevate From the Norm residency on May 21, 23, 26, 28 and 30. Related Ozzfest Announces 2027 Return With Three-Date U.K./North American Run Rush Members Helped Push Campaign For Permanent Neil Peart Memorial in Ontario Park Over the Top With Massive Donation Rush s Fifty Something Tour 2026 Setlist: Every Song Played at the First Show Each night will feature a set o رت‌آپ‌ها، مدتی طول می‌کشد تا بسیاری از کمیک‌ها به سود برسند - اگر اصلاً قرار است سودی به دست بیاید. بنابراین، اسمک تصمیم گرفت که برای سرمایه گذاری کمدی خود پول جمع کند و خود را در برابر سرمایه گذاران مسئول نگه دارد. او به سرویس استارت‌آپ تأمین مالی Wefunder روی آورد و اولین سرگرمی‌کننده‌ای بود که از سرمایه‌گذاران در این پلتفرم دعوت کرد. در اوایل سال گذشته، او نزدیک به 60000 دلار از 104 سرمایه‌گذار جمع‌آوری کرد که اکثریت آنها بین 100 تا 150 دلار سرمایه‌گذاری کردند. خرید در اسمک یک سرمایه گذاری قانونی است که توسط SEC تنظیم می شود. این کمدین برای راه اندازی دور اولیه خود، به اصطلاح، 5000 دلار خرج وکلا کرد. اسمک سرمایه گذاران بالقوه را در یک نمایش طنزآمیز که در صفحه Wefunder خود ارسال شده بود، دعوت کرد. او شروع کرد: «اگر مستقیماً روی یک کمدین استندآپ سرمایه گذاری نکنید، نمی توانید یک نمونه کار واقعاً متنوع داشته باشید. اسمک به خانواده، دوستان و افراد غریبه در اینترنت این فرصت را داد تا 10 درصد از درآمد ناخالص خود را تا سال 2029 تقسیم کنند. در ژانویه. در تاریخ 1، 2030، سرمایه گذاری آنها به ارزش سهام 1 میلیون دلاری قبل از پول تبدیل می شود. اسمک", "image_url": "https://variety.com/wp-content/uploads/2026/10/Pete-Smack-head-shot.jpg?crop=0px%2C2326px%2C4672px%2C2626px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری", "بورس و طلا"], "datetime_fa": "۱۴ آبان • ۱۹:۱۵"}, {"source": "Variety", "title": "‘Adam’s Law’ Enjoys Early TV-Ratings Judgment at CBS", "link": "https://variety.com/2026/tv/news/adams-law-tv-ratings-cbs-adam-levy-1236940269/", "summary": "Adam Levy usually delivers verdicts, but he probably doesn’t mind receiving this one. His syndicated program, “Adam’s Law” is the most-watched new series in the category so far in the 2026-2027 TV season, according to data from Nielsen. During the week of October 19, the program hit a new high in viewership, capturing an average [ ]", "date_str": "2026-11-05T15:15:00+00:00", "hash": "9d005bcd2dd115a7", "title_fa": "«قانون آدم» از قضاوت اولیه رتبه‌بندی تلویزیون در CBS لذت می‌برد", "summary_fa": "آدام لوی معمولاً احکامی را صادر می کند، اما احتمالاً از دریافت این حکم بدش نمی آید. طبق داده‌های نیلسن، برنامه سندیکایی او، \"قانون آدم\" پربیننده‌ترین سریال جدید در این رده تاکنون در فصل تلویزیونی 2026-2027 است. طبق داده‌های نیلسن، در هفته 19 اکتبر، این برنامه به بالاترین میزان بیننده رسید و میانگین [ ] برنامه سندیکایی او، «قانون آدم» پربیننده‌ترین سریال جدید در این رده تاکنون در فصل تلویزیونی 2026-2027 است. در هفته 19 اکتبر، این برنامه به بالاترین میزان بیننده دست یافت و میانگین بینندگان 1.33 میلیون را به خود اختصاص داد. تا به امروز، این برنامه به طور متوسط ​​1.29 میلیون بیننده را جذب کرده است. داستان‌های مرتبط تریلر فصل سوم Rings of Power: Dragons, Balrogs and Ringwraiths Go to War in Middle-Earth «Rings of Power» ستاره ادی مارسان در مورد بازی در نقش یک کوتوله تشنه قدرت و چرا او یک بار 2000 جفت از اورلاندو بلوم داشت، گوش‌های الف اورلاندو بلوم را در پشت زیرشیروانی او قرار دادند. جودی، یکی از اصلی‌ترین برنامه‌های تلویزیونی روزانه که به مدت 25 سال در تلویزیون پخش می‌شد. برای لوی، این کار کوچکی نیست. جودی شیندلین، ستاره آن برنامه، مادر اوست. لوی در مصاحبه اخیر خود می گوید: «از بینندگان خواسته می شد که به دلیل اینکه مادرم چه کسی بود و چه کسی با آن فامیل بودم، برنامه من را تنظیم کنند. خیلی ها مردد بودند و فکر می کردند که این یک حقه است. او اکنون پس از چند هفته روی آنتن، امیدوار است که تماشاگران از آنچه او به روی پرده می آورد تحت تأثیر قرار بگیرند. لوی مطمئن می شود که بررسی می کند که آیا اصحاب دعوا در این برنامه سابقه حضور در دادگاه را داشته اند یا سابقه ثابتی در طرح ادعاهای بیهوده دارند.", "image_url": "https://variety.com/wp-content/uploads/2026/08/JUDGE-ADAM-LEVY-ON-SET-e1786025919992.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۴ آبان • ۱۸:۴۵"}, {"source": "Billboard", "title": "Tate McRae, Olivia Rodrigo & Harry Styles: Which Pop Stars Won October 2026? (Greatest Pop Stars Podcast)", "link": "https://www.billboard.com/music/pop/tate-mcrae-harry-styles-greatest-pop-stars-podcast-october-1236374718/", "summary": "There s just two months left in 2026 — and while it feels like the big picture is starting to shake out for the year in pop stardom, there s plenty of game still left to be played. With the finish line now in sight, a lot of the biggest pop stars were outside in October, either shoring up their cases, forcing their way into the center of the discussion, or maybe even making some fashionably late entrances to the mix in general. This week on the Greatest Pop Stars podcast , we catch up with all the stars who defined October 2026 in pop stardom. Host Andrew Unterberger is joined by Billboard staffers Michael Saponara and Emily Fuentes to share and debate our respective October top five lists, while also naming some honorable mentions, some disappointments, and some artists who we’re looking forward to in the final few months of the year. (If you want to listen back to our first nine 2026 recaps, or any of our 2025 episodes, you can check them all out here .) Along the way, we answer all the most pressing questions about October in pop stardom: Is Tate McRae doing her new album cycle the right way? Which of Taylor Swift s Showgirl: The Encore bonus cuts are holding up for us? How d Olivia Rodrigo and Chappell Roan fare on their first-ever remix? Is Harry Styles ending the year in a stronger place than we expected? Are people really saying that Jay-Z doesn t have the catalog to play the Super Bowl? Do the Texas elections mean that Choosin Texas is gonna get another 10 weeks atop the Hot 100? How have we not made a true pop star out of Dominic Fike yet? And perhaps most importantly: What were our takes on the Kelly Clarkson animatronic bird mini-controversy? Check it out above, and subscribe to the Greatest Pop Stars podcast on Apple Music or Spotify (or wherever you get your podcasts ) for weekly discussions every Thursday about all things related to pop stardom! And as we say in every one of these GPS podcast posts — if you have the time and money to spare,
