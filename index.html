ا شرایط فعلی او ارائه نکرده‌اند. ارسلان یزدانی، ۴۳ ساله، همسر و پدر دو فرزند است و تداوم بی‌خبری از او، نگرانی‌ها درباره وضعیت و سلامت این شهروند بهایی را افزایش داده است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید"}, {"source": "IranWire", "title": "نشست وزارت خزانه‌داری آمریکا با موسسات مالی، درباره طرد اقتصادی جمهوری اسلامی", "link": "https://iranwire.com/fa/news-1/157701-%D9%86%D8%B4%D8%B3%D8%AA-%D9%88%D8%B2%D8%A7%D8%B1%D8%AA-%D8%AE%D8%B2%D8%A7%D9%86%D9%87%D8%AF%D8%A7%D8%B1%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D8%A8%D8%A7-%D9%85%D9%88%D8%B3%D8%B3%D8%A7%D8%AA-%D9%85%D8%A7%D9%84%DB%8C-%D8%AF%D8%B1%D8%A8%D8%A7%D8%B1%D9%87-%D8%B7%D8%B1%D8%AF-%D8%A7%D9%82%D8%AA%D8%B5%D8%A7%D8%AF%DB%8C-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C/", "summary": "وزارت خزانه‌داری آمریکا روز چهارشنبه ۲۵ شهریور اعلام کرد در نشستی با حضور موسسات مالی بین‌المللی، راه‌های تشدید فشار مالی بر جمهوری اسلا ...", "date_str": "2026-09-16T19:33:09+00:00", "hash": "4d7edac9448cff17", "title_fa": "نشست وزارت خزانه‌داری آمریکا با موسسات مالی، درباره طرد اقتصادی جمهوری اسلامی", "summary_fa": "وزارت خزانه‌داری آمریکا روز چهارشنبه ۲۵ شهریور اعلام کرد در نشستی با حضور موسسات مالی بین‌المللی، راه‌های تشدید فشار مالی بر جمهوری اسلا ... به گفته وزارت خزانه‌داری، این نشست در چارچوب طرحی با عنوان «عملیات طرد اقتصادی» برگزار شده؛ طرحی که هدف آن منزوی کردن تهران و محدود کردن توانایی جمهوری اسلامی برای تامین مالی جنگ در خاورمیانه عنوان شده است. این وزارتخانه اعلام کرد در جریان نشست، اطلاعات لازم برای کمک به موسسات مالی در شناسایی و قطع «جریان‌های درآمدی و شبکه‌های تدارکاتی مرتبط با حکومت ایران» در اختیار آنها قرار گرفته است. دو روز پیش از این نیز اسکات بسنت، وزیر خزانه‌داری آمریکا، در چارچوب برنامه فشار اقتصادی بر جمهوری اسلامی از افشاگران خواسته بود اطلاعات خود درباره کمک کنندگان به رژیم ایران را در اختیار وزارت خزانه‌داری قرار دهند. در این بخش ایران و ت‌جمهوری بیل کلینتون تصویب شد. این قانون در ابتدا «قانون تحریم‌های ایران و لیبی» نام داشت و برای محدودکردن سرمایه‌گذاری شرکت‌های خارجی در صنایع نفت و گاز این دو کشور تدوین شده بود. نام لیبی در سال ۲۰۰۶ از آن حذف شد و قانون از آن زمان با عنوان «قانون تحریم‌های ایران» ادامه یافت. این قانون به دولت آمریکا اجازه می‌دهد شرکت‌ها و اشخاص خارجی را که در برخی سرمایه‌گذاری‌ها، معاملات یا خدمات مرتبط با صنایع نفت، گاز و پتروشیمی ایران مشارکت دارند، تحریم کند. مسدود کردن دارایی‌ها، محدودیت دسترسی به نظام مالی آمریکا و ممنوعیت برخی معاملات با نهادهای آمریکایی از جمله مجازات‌هایی است که می‌تواند براساس این قانون اعمال شود. کاخ سفید ششم مرداد ۱۴۰۵ در بیانیه‌ای رسمی از تمدید پنج‌ساله قانون تحریم‌های ایران حمایت"}, {"source": "IranWire", "title": "«جان‌فدا»؛ نمایش بازدارندگی یا پروژه‌ای برای کنترل خیابان؟", "link": "https://iranwire.com/fa/features/157704-%D8%AC%D8%A7%D9%86%D9%81%D8%AF%D8%A7-%D9%86%D9%85%D8%A7%DB%8C%D8%B4-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B1%D9%86%D8%AF%DA%AF%DB%8C-%DB%8C%D8%A7-%D9%BE%D8%B1%D9%88%DA%98%D9%87%D8%A7%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%DA%A9%D9%86%D8%AA%D8%B1%D9%84-%D8%AE%DB%8C%D8%A7%D8%A8%D8%A7%D9%86/", "summary": "«بلدی با کلاشینکف کار کنی؟»، «بلدی با دوش‌پرتاب کار کنی؟»؛ این‌ها جملاتی نیستند که بر دیوار یک پادگان نظامی نقش بسته باشند، بلکه تبلیغات ...", "date_str": "2026-09-17T07:32:44+00:00", "hash": "9844d86e5d5f351b", "title_fa": "«جان‌فدا»؛ نمایش بازدارندگی یا پروژه‌ای برای کنترل خیابان؟", "summary_fa": "«بلدی با کلاشینکف کار کنی؟»، «بلدی با دوش‌پرتاب کار کنی؟»؛ این‌ها جملاتی نیستند که بر دیوار یک پادگان نظامی نقش بسته باشند، بلکه تبلیغات ... با اعلام رسمی آغاز دوره‌های جدید آموزش نظامی از ۲۵ شهریور، پای پادگان‌ها رسماً به زیست مدنی و خیابان‌های شهر باز شده است «بلدی با کلاشینکف کار کنی؟»، «بلدی با دوش‌پرتاب کار کنی؟»؛ این‌ها جملاتی نیستند که بر دیوار یک پادگان نظامی نقش بسته باشند، بلکه تبلیغاتی هستند که این روزها بر بیلبوردهای بزرگ شهری در تهران جا خوش کرده‌اند. جمهوری اسلامی به دنبال آن است که مردم را در خیابان‌ها نگه داشته و با دادن آموزش نظامی iss-at-this-years-us-open", "summary": "یو اس اوپن به رویدادی دیدنی برای عاشقان ساعت‌های لوکس تبدیل شده که می‌خواهند ببینند چه کسی چه ساعتی دست کرده است. کوید واکر مدیرعامل بازار ساعت Bezel مدل‌های شاخص امسال را برگزیده؛ از جیکوب اند کوی زورف تا دیتونای الکاراس و پتک فلیپ روی دست برد پیت.", "date_str": "2026-09-17T06:51:58+00:00", "hash": "0a89a2fb4febcace", "title_fa": "تماشا کنید: ساعت‌های برنده در یواس‌اوپن امسال", "summary_fa": "یو اس اوپن به رویدادی دیدنی برای عاشقان ساعت‌های لوکس تبدیل شده که می‌خواهند ببینند چه کسی چه ساعتی دست کرده است. کوید واکر مدیرعامل بازار ساعت Bezel مدل‌های شاخص امسال را برگزیده؛ از جیکوب اند کوی زورف تا دیتونای الکاراس و پتک فلیپ روی دست برد پیت."}, {"source": "BBC Persian", "title": "«نتیجه ام‌آرآی و سرقت اطلاعات شخصی»؛ هشدار مشترک سه کشور درباره «جاسوسی سایبری ایران» از مخالفان و روزنامه‌نگاران", "link": "https://www.bbc.com/persian/articles/cmy5z7nqz0k5o?at_medium=RSS&at_campaign=rss", "summary": "سه نهاد امنیتی غربی می‌گویند مهاجمان منتسب به حکومت ایران با فایل‌های جعلی، از جمله نتایج ساختگی ام‌آر‌آی، و نرم‌افزارهای تقلبی، مخالفان و روزنامه‌نگاران را هدف قرار می‌دهند. این بدافزارها می‌توانند اطلاعات شخصی و پیام‌های قربانیان را سرقت کنند.", "date_str": "2026-09-17T14:53:00+00:00", "hash": "ac956060d81e201f", "title_fa": "«نتیجه ام‌آرآی و سرقت اطلاعات شخصی»؛ هشدار مشترک سه کشور درباره «جاسوسی سایبری ایران» از مخالفان و روزنامه‌نگاران", "summary_fa": "سه نهاد امنیتی غربی می‌گویند مهاجمان منتسب به حکومت ایران با فایل‌های جعلی، از جمله نتایج ساختگی ام‌آر‌آی، و نرم‌افزارهای تقلبی، مخالفان و روزنامه‌نگاران را هدف قرار می‌دهند. این بدافزارها می‌توانند اطلاعات شخصی و پیام‌های قربانیان را سرقت کنند. سازمان‌های اطلاعاتی و امنیتی بریتانیا، آمریکا و هلند در هشداری مشترک، جزئیات یک کارزار تجسس سایبری را منتشر کرده‌اند که به گفته آن‌ها، عوامل وابسته به حکومت ایران با استفاده از آن، مخالفان، فعالان و روزنامه‌نگاران را در کشورهای مختلف هدف قرار می‌دهند. بر اساس این هشدار، مهاجمان با جا زدن خود به عنوان دوست و آشنا یا کارمند پشتیبانی فنی پیام‌رسان‌ها، اعتماد افراد را جلب می‌کنند و سپس آن‌ها را به نصب برنامه‌ای ظاهرا معتبر یا باز کردن فایلی، مانند نتیجه آزمایش پزشکی، ترغیب می‌کنند. به گفته این سازمان‌ها، بدافزاری که از این طریق روی کامپیوتر نصب می‌شود، می‌تواند به پیام‌ها، ایمیل‌ها و اطلاعات شخصی قربانی دسترسی پیدا کند، از صفحه کامپیوتر تصویر بگیرد و در برخی موارد، صدا و تصویر جلسات آنلاین را ضبط کند. این هشدار جدید که روز ۱۵ سپتامبر ۲۰۲۶ (۲۴ شهریور) منتشر شد، حاصل همکاری مرکز ملی امنیت سایبری بریتانیا وابسته به سازمان اطلاعاتی جی‌سی‌اچ‌کیو، پلیس فدرال آمریکا‌ (اف‌بی‌آی) و ای‌آی‌وی‌دی، سازمان اطلاعات و امنیت هلند، است. این سه نهاد، اطلاعات فنی و توصیه‌هایی نیز برای شناسایی حملات و کاهش خطر آلودگی دستگاه‌ها منتشر کرده‌اند. سازمان اطلاعات هلند همچنین اعلام کرده است که قربانیان شناسایی‌شده این بدافزار در آن کشور را از موضوع مطلع کرده است. این حملات چگونه انجام می‌شود، چه اطلاعاتی در معرض خطر قرار دارد و درباره ارتباط این کارزار با نهادهای اطلاعاتی ایران چه جزئیاتی ارائه شده است؟ اف‌بی‌آی نیز در گزارش فنی جداگانه‌ای که هم‌زمان منتشر شده، بدافزاری با ویژگی‌های مشابه را با نام «هوی‌گرام» (HEAVYGRAM) معرفی کرده و گفته است که مهاجمان استفاده از نمونه‌های مختلف آن را از"}, {"source": "BBC Persian", "title": "کنار گذاشتن یک رپر از تور اد شیرن در آمریکا به دلیل حمایت از فلسطین خبرساز شد", "link": "https://www.bbc.com/persian/articles/cm1wx504e2pno?at_medium=RSS&at_campaign=rss", "summary": "اخراج یک رپر گروه همراه اد شیرن، ستاره موسیقی بریتانیا به خاطر حمایتش از فلسطینی‌ها جنجال بزرگی به پا کرده است. روز دوشنبه مکلمور، رپر همکار اد شیرن اعلام کرد که از ادامه تور کنسرت‌های اد شیرن کنار گذاشته شده است. او در ماه ژوئیه گذشته در جریان کنسرتی شعار «فلسطین آزاد» را سر داده بود. این رویداد واکنش‌های زیادی داشته و حتی برخی از هنرمندان و کارکنان تور کنسرت‌های او در آمریکا کار را ترک کردند. اد شیرن گفته است که نقشی در کنار گذاشتن مکلمور نداشته است.", "date_str": "2026-09-17T13:11:48+00:00", "hash": "e68861b53db0ee5f", "title_fa": "کنار گذاشتن یک رپر از تور اد شیرن در آمریکا به دلیل حمایت از فلسطین خبرساز شد", "summary_fa": "اخراج یک رپر گروه همراه اد شیرن، ستاره موسیقی بریتانیا به خاطر حمایتش از فلسطینی‌ها جنجال بزرگی به پا کرده است. روز دوشنبه مکلمور، رپر همکار اد شیرن اعلام کرد که از ادامه تور کنسرت‌های اد شیرن کنار گذاشته شده است. او در ماه ژوئیه گذشته در جریان کنسرتی شعار «فلسطین آزاد» را سر داده بود. این رویداد واکنش‌های زیادی داشته و حتی برخی از هنرمندان و کارکنان تور کنسرت‌های او در آمریکا کار را ترک کردند. اد شیرن گفته است که نقشی در کنار گذاشتن مکلمور نداشته است. کنار گذاشته شدن مکلمور، رپر آمریکایی، از ادامه تور کنسرت‌های اد شیرن به دلیل اظهاراتش در حمایت از فلسطینی‌ها جنجال‌برانگیز شده است. مکلمور روز دوشنبه گفت که از ادامه حضور در این تور کنار گذاشته شده است. او در ماه ژوئیه در جریان یکی از اجراهایش شعار «فلسطین آزاد» سر داده بود. این ماجرا واکنش‌های زیادی در پی داشته و حتی شماری از هنرمندان و کارکنان مرتبط با کنسرت‌های آمریکا در اعتراض به این تصمیم همکاری خود را متوقف کرده‌اند. اد شیرن می‌گوید که در تصمیم برای کنار گذاشتن مکلمور نقشی نداشته است. در تازه‌ترین تحول، پس از آنکه مکلمور اعلام کرد که یک میلیون دلار از درآمد خود از اجرای کنسرت‌ها در آمریکا را به سازمان‌های امدادی و حامی فلسطینی‌ها اهدا خواهد کرد، رابرت کرافت، مالک ورزشگاه ژیلت در نزدیکی بوستون، گفت که اد شیرن نیز دو میلیون دلار برای کمک‌های بشردوستانه در منطقه اختصاص داده و از او خواسته است مبلغ مشابهی اهدا کند. آقای کرافت نگفت که آیا با این درخواست موافقت کرده است یا نه و مشخص نکرد که این کمک مالی قرار است به کدام سازمان یا نهاد اختصاص یابد. این نخستین بار است که از چنین کمک مالی از سوی اد شیرن سخن گفته می‌شود. اد شیرن تاکنون به طور علنی درباره این کمک مالی"}, {"source": "BBC Persian", "title": "عراقچی پیشنهاد چهار ماده‌ای چین برای امنیت خاورمیانه را «چهار اصل صلح» خواند", "link": "https://www.bbc.com/persian/articles/c607ljkevkzeo?at_medium=RSS&at_campaign=rss", "summary": "عباس عراقچی،‌ وزیر خارجه ایران که چهارشنبه به چین سفر کرده است می‌گوید که رایزنی‌های موفقی را درچین با شرکای ایران انجام داده است. او پیشنهاد چهار ماده‌ای شی جین‌پینگ، رئیس‌جمهور چین برای امنیت خاورمیانه را «چهار اصل صلح» خواند و آن را مهم ارزیابی کرد. در همین حال وزیر خارجه چین هم با تاکید بر اینکه پکن نمیخواهد درگیری‌ها بیش از این به یمن و دریای سرخ سرایت کند از آمادگی برای نقش بیشتر در حل اختلافات خبر داد. آقای عراقچی در پکن با مقامات پاکستان و همتای ترکیه‌ای خود گفت‌وگو کرد.", "date_str": "2026-09-17T10:06:30+00:00", "hash": "5034d3275014d59f", "title_fa": "عراقچی پیشنهاد چهار ماده‌ای چین برای امنیت خاورمیانه را «چهار اصل صلح» خواند", "summary_fa": "عباس عراقچی،‌ وزیر خارجه ایران که چهارشنبه به چین سفر کرده است می‌گوید که رایزنی‌های موفقی را درچین با شرکای ایران انجام داده است. او پیشنهاد چهار ماده‌ای شی جین‌پینگ، رئیس‌جمهور چین برای امنیت خاورمیانه را «چهار اصل صلح» خواند و آن را مهم ارزیابی کرد. در همین حال وزیر خارجه چین هم با تاکید بر اینکه پکن نمیخواهد درگیری‌ها بیش از این به یمن و دریای سرخ سرایت کند از آمادگی برای نقش بیشتر در حل اختلافات خبر داد. آقای عراقچی در پکن با مقامات پاکستان و همتای ترکیه‌ای خود گفت‌وگو کرد. آقای عراقچی بامداد روز پنجشنبه ۲۶ شهریور ماه در پیامی به زبان انگلیسی در شبکه ایکس نوشت که تصمیم‌هایی که قرار است امروز اتخاذ شوند «بر توازن راهبردی آینده در منطقه تاثیرگذار خواهند بود و پیامدهای بی‌شمار و گسترده‌ای در پی خواهند داشت.» آقای عراقچی به پیشنهاد چهار ماده‌ای که شی جین پینگ در دیدار اخیر خود با عبدالفتاح سیسی، رئیس‌جمهور مصر در قاهره برای ایجاد یک «ساختار جدید امنیتی در خاورمیانه» مطرح کرده، اشاره کرد. این پیشنهاد، به‌طور کلی، از کشورهای منطقه می‌خواهد که «آینده خود را به دست خود بگیرند»؛ به عبارت دیگر، خود را از اتکا به حمایت آمریکا دور کنند؛ بر حل «مسئله اصلی خاورمیانه»، یعنی فلسطین، تمرکز کنند؛ توسعه اقتصادی را تقویت کنند؛ و هماهنگی بین‌المللی را بر اساس منشور سازمان ملل متحد و حقوق بین‌الملل افزایش دهند. به گزارش شین هوا، وانگ یی،‌ وزیر خارجه چین در دیدار با آقای عراقچی پیشنهاد آقای شی را با او در میان گذاشت و گفت: «وضعیت کنونی بار دیگر ثابت می‌کند که معماری امنیتی موجود در خاورمیانه ناقص است و به اصلاح و تقویت نیاز دارد.» او گفت که چین، به‌عنوان یکی از اعضای دائم شورای امنیت سازمان ملل متحد و شریک راهبردی ایران، آماده است نقشی سازنده در حل‌وفصل اختلافات بین‌المللی و حفاظت"}, {"source": "BBC Persian", "title": "۱۴ ماهواره روسی و یک حمله ویرانگر؛سایه مسکو بر حمله ایران به یک پایگاه نظامی آمریکا", "link": "https://www.bbc.com/persian/articles/ck62m632dp8lo?at_medium=RSS&at_campaign=rss", "summary": "در حالی که جنگ با ایران وارد ماه‌های سرنوشت‌ساز خود شده، رسانه‌های آمریکا از نشانه‌های تازه‌ای از نقش احتمالی روسیه در کمک اطلاعاتی به تهران، مذاکرات محرمانه واشنگتن با حوثی‌های یمن، افزایش فشارهای اقتصادی ناشی از جنگ و رشد مخالفت‌های سیاسی در کنگره با ادامه درگیری‌ها خبر می‌دهند.", "date_str": "2026-09-17T08:35:39+00:00", "hash": "39d2943e626c32d2", "title_fa": "۱۴ ماهواره روسی و یک حمله ویرانگر؛سایه مسکو بر حمله ایران به یک پایگاه نظامی آمریکا", "summary_fa": "در حالی که جنگ با ایران وارد ماه‌های سرنوشت‌ساز خود شده، رسانه‌های آمریکا از نشانه‌های تازه‌ای از نقش احتمالی روسیه در کمک اطلاعاتی به تهران، مذاکرات محرمانه واشنگتن با حوثی‌های یمن، افزایش فشارهای اقتصادی ناشی از جنگ و رشد مخالفت‌های سیاسی در کنگره با ادامه درگیری‌ها خبر می‌دهند. به گزارش شبکه خبری «سی‌ان‌ان»، دو روز پیش از حمله ویرانگر ایران به یک پایگاه نظامی آمریکا در ماه نخست جنگ، ۱۴ ماهواره جاسوسی روسیه از فراز این پایگاه در عربستان سعودی عبور کرده بودند؛ موضوعی که پرسش‌هایی درباره احتمال کمک اطلاعاتی مسکو به تهران برانگیخته است. به گفته این رسانه، زمان‌بندی و نحوه حرکت این ماهواره‌ها امکان دسترسی به طیف گسترده‌ای از داده‌های مربوط به موقعیت پایگاه‌های ارتش آمریکا را فراهم کرده بود؛ داده‌هایی که به گفته مقام‌های آمریکایی و منابع اطلاعاتی سی‌ان‌ان، در اختیار ایران قرار گرفت و به این کشور در اجرای برخی از دقیق‌ترین حملاتش علیه مواضع و تجهیزات آمریکا کمک کرد. در این حمله پهپادی و موشکی ایران، ۱۲ نظامی آمریکایی زخمی شدند و یک هواپیمای هشدار و کنترل هوابرد ارتش آمریکا نیز نابود شد. کاخ سفید و وزارت دفاع آمریکا تاکنون به این گزارش واکنشی نشان نداده‌اند. سی‌ان‌ان این گزارش را به نقل از مقام‌های آمریکایی منتشر کرده که نخواسته‌اند نامشان فاش شود. پیش از این نیز گزارش‌ها و پرسش‌هایی درباره احتمال کمک اطلاعاتی چین و روسیه به تهران در جنگ با آمریکا در رسانه‌های آمریکایی منتشر شده بود، که آن زمان از جنگ داخلی سوریه گزارش تهیه می‌کرد. رسانه‌های بین‌المللی پرونده او را به‌دقت دنبال کرده‌اند و روسای جمهور آمریکا نیز یکی پس از دیگری از آن سخن گفته‌اند. آقای تایس دانشجوی حقوق دانشگاه جورج‌تاون بود و پیش‌تر با درجه سروانی در سپاه تفنگداران دریایی آمریکا خدمت کرده بود. آخرین تصاویر او مربوط به ویدئویی است که بیش از یک ماه پس از به اسارت درآمدنش منتشر شد. در این ویدئو چشم‌هایش بسته بود و ظاهرا حال پریشانی داشت. دوازده سال بعد، با سقوط حکومت، ده‌ها هزار نفر از زندان‌های سوریه بیرون آمدند. تایس در میان آن‌ها نبود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. یک منبع اطلاعاتی مختصات جغرافیایی چند محل را در اختیار ما گذاشت. مقام‌های آمریکایی احتمال می‌دادند تایس"}, {"source": "BBC Persian", "title": "ایرانیان مهاجر و رویای بازگشت؛ آیا می‌توان بی‌هراس برگشت؟", "link": "https://www.bbc.com/persian/articles/cy8z3vxzm8eo?at_medium=RSS&at_campaign=rss", "summary": "بازگشت به وطن برای بسیاری از ایرانیان یک حق بدیهی تلقی می‌شود و یک آرزوی شخصی است. با این حال، تجربه یک قرن گذشته نشان می‌دهد که این تصمیم همیشه پیامدهای یکسانی نداشته است؛ برخی زندگی و فعالیت خود را از سر گرفته‌اند، برخی با محدودیت و نظارت روبه‌رو شده‌اند و برخی نیز برای این انتخاب بهایی سنگین پرداخته‌اند.", "date_str": "2026-09-17T06:13:58+00:00", "hash": "470dd439717446a7", "title_fa": "ایرانیان مهاجر و رویای بازگشت؛ آیا می‌توان بی‌هراس برگشت؟", "summary_fa": "بازگشت به وطن برای بسیاری از ایرانیان یک حق بدیهی تلقی می‌شود و یک آرزوی شخصی است. با این حال، تجربه یک قرن گذشته نشان می‌دهد که این تصمیم همیشه پیامدهای یکسانی نداشته است؛ برخی زندگی و فعالیت خود را از سر گرفته‌اند، برخی با محدودیت و نظارت روبه‌رو شده‌اند و برخی نیز برای این انتخاب بهایی سنگین پرداخته‌اند. «می‌شنیدم و نمی‌شنیدم چه می‌خواند. قلبم به تپش افتاده بود. تا اینکه... خواند مرگ یا زندان، باید بروم، خانۀ طبیعی من آنجاست .... میان صداهای بیرون کیوسک و هیاهوی ذهنم، همۀ نیرویم را جمع کردم و پرسیدم پویا چی می‌شه. این یه خودکشیه . صدایش نمی‌لرزید، نفس‌هایش آرام و یکنواخت به گوشم می‌رسید. قاطعیت و جدیت او را در مواردی که تصمیمی می‌گرفت، می‌شناختم. تا آنکه گفت: نه،... این خودکشی نیست، یک انتخابه. » این بخشی از مکالمه مجید شریف، نویسنده و مترجم و از قربانیان قتل‌های زنجیره‌ای، با همسرش پیش از بازگشت به ایران است؛ کلماتی که شاید بیش از هر چیز، دشواری و تناقض تصمیمی را بازتاب می‌دهد که بسیاری از مهاجران و پناهندگان ایرانی پس از سال‌ها دوری از وطن با آن روبه‌رو می‌شوند. تصمیمی که گاه با وجود همه تردیدها و مخاطرات، به بازگشت ختم می‌شود؛ بازگشتی که می‌تواند دلایل گوناگونی داشته باشد، از احساس عدم تعلق و دلتنگی گرفته تا اشتیاق برای ادامه زندگی و فعالیت در ایران یا تنگنای مالی. برخی از مهاجران تنها برای سفری کوتاه و دیدار با اقوام و دوستان راهی ایران می‌شوند، اما برخی دیگر می‌خواهند برای همیشه برگردند. گروهی از ایرانیان تبعیدی اما ترجیح می‌دهند با وجود همه دشواری‌های زندگی دور از ایران و تجربه غربت و دلتنگی، راهی این کشور نشوند؛ زیرا این سفر را هم پرخطر می‌دانند و هم نوعی همراهی با حکومتی تلقی می‌کنند که سال‌ها مشروعیتش را زیر سؤال برده‌اند و به خاطر شرایط سیاسی و"}, {"source": "BBC Persian", "title": "آمریکا چه سلاحی را به فضا فرستاده است؟", "link": "https://www.bbc.com/persian/articles/ck790r5jz3veo?at_medium=RSS&at_campaign=rss", "summary": "اعلام آمریکا مبنی بر اینکه یک سلاح فضایی را در مدار زمین مستقر کرده است، پرسش‌هایی را درباره این موضوع مطرح کرده که چه نوع تسلیحاتی واقعا در فضا وجود دارد و این تسلیحات چه نقشی می‌توانند در تلاش قدرت‌های بزرگ برای تسلط بر این عرصه ایفا کنند.", "date_str": "2026-09-17T05:52:40+00:00", "hash": "24b13e2ebbb67557", "title_fa": "آمریکا چه سلاحی را به فضا فرستاده است؟", "summary_fa": "اعلام آمریکا مبنی بر اینکه یک سلاح فضایی را در مدار زمین مستقر کرده است، پرسش‌هایی را درباره این موضوع مطرح کرده که چه نوع تسلیحاتی واقعا در فضا وجود دارد و این تسلیحات چه نقشی می‌توانند در تلاش قدرت‌های بزرگ برای تسلط بر این عرصه ایفا کنند. آمریکا جزئیات چندانی ارائه نکرده است. تروی مینک، وزیر نیروی هوایی آمریکا، گفت این سلاح «مستقر در مدار» برای حفاظت از نیروهای آمریکایی در برابر اقدامات خصمانه دشمن ضروری است، اما درباره توانایی‌های این سلاح یا زمان استقرار آن در مدار توضیحی نداد. پس این سلاح چه می‌تواند باشد و تصویر کلی تحولات نظامی در فضا چگونه است؟ چه کشورهایی ممکن است تسلیحات مشابهی در اختیار داشته باشند؟ فضا از همان آغاز عصر فضا به عرصه‌ای نظامی تبدیل شد. در اواخر دهه ۱۹۶۰، اتحاد جماهیر شوروی تسلیحاتی را در فضا مستقر کرد. برنامه «ایستربیتل اسپوتنیکوف» یا «ماهواره‌نابودگر» از ماهواره‌هایی تشکیل شده بود که برای رها کردن پرتابه‌هایی طراحی شده بودند که پس از انفجار، ترکش‌هایی را در مسیر یک ماهواره دیگر، که معمولا آمریکایی بود، پخش می‌کردند. امروزه نیروهای نظامی پیشرفته از ماهواره‌ها برای اهداف گوناگونی استفاده می‌کنند؛ از جمله شناسایی و جمع‌آوری اطلاعات، ارتباطات امن، شناسایی پرتاب موشک‌ها و فراهم کردن اطلاعات دقیق مکانی برای حملات هدفمند. تحلیلگران معتقدند با پیشرفته‌تر شدن فناوری‌های جنگی، استفاده از تجهیزات و سامانه‌های نظامی در فضا نیز افزایش خواهد یافت. دکتر بلدین بوئن، پژوهشگر وابسته علوم نظامی در مؤسسه خدمات سلطنتی متحد و دانشیار سیاست فضایی در دانشگاه دورام، گفت که درباره سلاحی که آمریکا از آن خبر داده است، تنها می‌توان حدس‌هایی مطرح کرد. او در گفت‌وگو با بی‌بی‌سی گفت: «من انتظار دارم این سلاح احتمالا نوعی سامانه جنگ الکترونیک یا ایجاد اختلال در امواج رادیویی باشد؛ نوعی سلاح ضدماهواره که ماهیتی غیرتخریبی دارد.»"}, {"source": "BBC Persian", "title": "تبلیغ جنجالی سیدنی سوئینی برای یک سایت شرط‌بندی؛ چرا ورزشکاران زن خشمگین شدند؟", "link": "https://www.bbc.com/persian/articles/c60m3kkp7m21o?at_medium=RSS&at_campaign=rss", "summary": "ورزشکاران زن علیه تبلیغ جنجالی شرط‌بندی با حضور سیدنی سوئینی، بازیگر سرشناس آمریکایی موضع گرفته‌اند. این آگهی که در فضای آنلاین به‌سرعت فراگیر شده، سیدنی سوئینی را در حالی نشان می‌دهد که برهنه است، اما بخش‌هایی از بدن خود را با وسایل مختلف ورزشی پوشانده است. این آگهی واکنش‌های تندی را برانگیخته است و بسیاری از ورزشکاران زن از جنسی‌سازی زنان در ورزش و این واقعیت انتقاد کرده‌اند که زنان ورزشکار اغلب به جای دستاوردهای ورزشی‌شان، بر اساس ظاهرشان مورد قضاوت و تعریف قرار می‌گیرند.", "date_str": "2026-09-17T00:06:59+00:00", "hash": "838952a793d410ac", "title_fa": "تبلیغ جنجالی سیدنی سوئینی برای یک سایت شرط‌بندی؛ چرا ورزشکاران زن خشمگین شدند؟", "summary_fa": "ورزشکاران زن علیه تبلیغ جنجالی شرط‌بندی با حضور سیدنی سوئینی، بازیگر سرشناس آمریکایی موضع گرفته‌اند. این آگهی که در فضای آنلاین به‌سرعت فراگیر شده، سیدنی سوئینی را در حالی نشان می‌دهد که برهنه است، اما بخش‌هایی از بدن خود را با وسایل مختلف ورزشی پوشانده است. این آگهی واکنش‌های تندی را برانگیخته است و بسیاری از ورزشکاران زن از جنسی‌سازی زنان در ورزش و این واقعیت انتقاد کرده‌اند که زنان ورزشکار اغلب به جای دستاوردهای ورزشی‌شان، بر اساس ظاهرشان مورد قضاوت و تعریف قرار می‌گیرند. آریان تیتماس، قهرمان المپیک این گونه واکنش نشان داد: «این سیلی به صورت زنان است.» او جمله ورزشکارانی است که علیه تبلیغ یک شرکت شرط‌بندی ورزشی با حضور سیدنی سوئینی، بازیگر آمریکایی، اعتراض کرده‌اند. امی هانت، که اوایل تابستان امسال برای چهارمین بار قهرمان اروپا شد، پس از آنکه در فینال دوی ۲۰۰ متر مسابقات «آلتیمیت چمپیونشیپ» در بوداپست با ثبت بهترین زمان فصل خود، ۲۲٫۱۰ ثانیه، در جایگاه چهارم قرار گرفت، به این تبلیغ اشاره کرد. هانت پس از مسابقه گفت: «سیدنی سوئینی، زنان در ورزش این شکلی هستند.» او با اشاره به زمان ۲۱٫۴۷ ثانیه‌ای ملیسا جفرسون-وودن، که چهارمین رکورد سریع تاریخ در این ماده به شمار می‌رود، افزود: «۲۱٫۴ ثانیه. عضله. کار سخت، خون، عرق و اشک. این است یک شب زیبا.» در مقابل، آریان تیتماس، دارنده چهار مدال طلای المپیک در شنا، گفت: «این فقط سیلی به صورت همه زنانی نیست که زندگی خود را وقف کامل کردن مهارت و رشته ورزشی‌شان کرده‌اند، بلکه سیلی به صورت همه زنانی است که ورزش را به خاطر آنچه واقعا هست دوست دارند.» او افزود: «چطور ممکن است همچنان در دنیایی زندگی کنیم که کسب درآمد از بدن یک زن و جنسی‌سازی ورزش زنان، امری عادی تلقی شود؟» سوئینی به طور مستقیم به این انتقادها پاسخ نداده است، اما در شبکه‌های اجتماعی مجموعه‌ای از"}, {"source": "BBC Persian", "title": "از «دیوار آهنین» تا «فهرست سفید کیفری»؛ چه چیزهایی قرار است در طرح نفوذ جرم شود؟", "link": "https://www.bbc.com/persian/articles/cdx5zqz59xxo?at_medium=RSS&at_campaign=rss", "summary": "در حالی که مجلس شورای اسلامی بررسی جزئیات «طرح مقابله با نفوذ سرویس‌های اطلاعاتی و دولت‌ها یا نهادهای بیگانه» را ادامه می‌دهد، دولت، حقوقدانان، دانشگاهیان و فعالان مدنی نسبت به پیامدهای آن هشدار داده‌اند. موافقان، این طرح ۳۳ ماده‌ای را ابزاری برای مقابله با اشکال جدید نفوذ و اثرگذاری خارجی می‌دانند، اما منتقدان می‌گویند برخی مواد آن می‌تواند دامنه گسترده‌ای از فعالیت‌های رسانه‌ای، دانشگاهی، فرهنگی و مدنی را تحت تأثیر قرار دهد و بر ابهام‌های حقوقی و اختیارات نهادهای امنیتی بیفزاید.", "date_str": "2026-09-17T04:13:59+00:00", "hash": "423918777d9080e8", "title_fa": "از «دیوار آهنین» تا «فهرست سفید کیفری»؛ چه چیزهایی قرار است در طرح نفوذ جرم شود؟", "summary_fa": "در حالی که مجلس شورای اسلامی بررسی جزئیات «طرح مقابله با نفوذ سرویس‌های اطلاعاتی و دولت‌ها یا نهادهای بیگانه» را ادامه می‌دهد، دولت، حقوقدانان، دانشگاهیان و فعالان مدنی نسبت به پیامدهای آن هشدار داده‌اند. موافقان، این طرح ۳۳ ماده‌ای را ابزاری برای مقابله با اشکال جدید نفوذ و اثرگذاری خارجی می‌دانند، اما منتقدان می‌گویند برخی مواد آن می‌تواند دامنه گسترده‌ای از فعالیت‌های رسانه‌ای، دانشگاهی، فرهنگی و مدنی را تحت تأثیر قرار دهد و بر ابهام‌های حقوقی و اختیارات نهادهای امنیتی بیفزاید. مجلس در حال بررسی طرحی ۳۳ ماده‌ای برای مقابله با نفوذ سرویس‌های اطلاعاتی و نهادهای خارجی است؛ طرحی که موافقان آن را پاسخی به تهدیدهای نوین امنیتی می‌دانند و منتقدان درباره تأثیر آن بر فعالیت‌های رسانه‌ای، دانشگاهی و مدنی هشدار می‌دهند. سابقه این طرح به تیرماه سال گذشته بازمی‌گردد. پس از جنگ ۱۲ روزه، ۷۸ نماینده مجلس طرح دوفوریتی موسوم به «طرح نفوذ» را در فضای سیاسی پس از جنگ به مجلس ارائه کردند. کمیسیون امنیت ملی نیز سوم اسفندماه، یک هفته پیش از آغاز جنگ ۴۰ روزه، پس از تصویب آن را برای طرح در صحن علنی آماده کرد، اما همزمانی با جنگ و تعطیلی مجلس، روند بررسی را متوقف ساخت. کلیات طرح در روز ۲۵ مردادماه در جلسه مجازی مجلس شورای اسلامی با ۱۸۳ رای موافق به تصویب رسید. این طرح در نسخه اولیه شامل ۱۹ ماده و چند تبصره بود، اما در ادامه بررسی‌ها در کمیسیون امنیت ملی گسترش یافت و به طرحی ۳۳ ماده‌ای تبدیل شد؛ طرحی که طیف گسترده‌ای از فعالیت‌های اقتصادی، رسانه‌ای، علمی، فرهنگی، آموزشی و سیاسی مرتبط با افراد، نهادها و دولت‌های خارجی را در بر می‌گیرد. دولت مسعود پزشکیان مخالفت خود را با بخش‌هایی از این طرح اعلام کرده و معتقد است برخی مفاد آن می‌تواند محدودیت‌هایی برای فعالیت‌های علمی و پژوهشی ایجاد کند، روند مهاجرت نخبگان را تشدید کند و"}, {"source": "BBC Persian", "title": "کارزار «خانواده‌ام در امان است»؛ چرا منتقدان از «اعلان جنگ علیه همجنس‌گرایی» در ترکیه می‌گویند؟", "link": "https://www.bbc.com/persian/articles/cqn0jk8xj58jo?at_medium=RSS&at_campaign=rss", "summary": "دولت ترکیه در چارچوب کارزاری با عنوان «خانواده‌ام در امان است»، اعضای جامعه ال‌جی‌بی‌تی‌پلاس و فعالان این حوزه را بازداشت کرده است؛ کارزاری که دولت می‌گوید با هدف حفاظت از ارزش‌های خانواده طراحی شده است.", "date_str": "2026-09-17T02:00:20+00:00", "hash": "00afa7116124a5a9", "title_fa": "کارزار «خانواده‌ام در امان است»؛ چرا منتقدان از «اعلان جنگ علیه همجنس‌گرایی» در ترکیه می‌گویند؟", "summary_fa": "دولت ترکیه در چارچوب کارزاری با عنوان «خانواده‌ام در امان است»، اعضای جامعه ال‌جی‌بی‌تی‌پلاس و فعالان این حوزه را بازداشت کرده است؛ کارزاری که دولت می‌گوید با هدف حفاظت از ارزش‌های خانواده طراحی شده است. در جریان تحقیقات قضایی علیه انجمن‌ها و فعالان حقوق ال‌جی‌بی‌تی‌پلاس دست‌کم ۶۰ نفر بازداشت شده‌اند. پس از این بازداشت‌ها، پلیس در تجمع‌های اعتراضی برگزارشده در ازمیر و استانبول مداخله کرد. افزون بر ترکیه، در نقاط مختلف جهان نیز فراخوان‌هایی برای برگزاری تجمع‌های حمایتی منتشر شد. ازدواج همجنس‌گرایان در ترکیه به رسمیت شناخته نمی‌شود و در سال‌های اخیر فشار بر زوج‌های همجنس‌گرا افزایش یافته است. گروه‌های حقوق بشری در ترکیه دولت را متهم کرده‌اند که از این کارزار برای هدف قرار دادن جامعه ال‌جی‌بی‌تی‌پلاس استفاده می‌کند. روابط همجنس‌گرایانه در ترکیه جرم محسوب نیست، اما همجنس‌گراهراسی در این کشور رایج است. رجب طیب اردوغان، رئیس‌جمهور ترکیه، نیز افراد ال‌جی‌بی‌تی‌پلاس را «منحرف» توصیف کرده و آنها را مسئول کاهش نرخ زاد و ولد دانسته است. آکین گورلک، وزیر دادگستری ترکیه، ۱۳ سپتامبر اعلام کرد که در چارچوب عملیاتی با عنوان «خانواده‌ام در امان است» که در ۱۵ استان اجرا شده، علیه ۱۶۲ نفر، ۹ انجمن و ۱۳ واحد کسب‌وکار اقدام قضایی آغاز شده است. آکین گورلک گفت: «افرادی که برای فحشا واسطه‌گری می‌کنند یا مکانی برای آن فراهم می‌کنند، کسب‌وکارهایی که بستر این فعالیت‌ها را فراهم کرده‌اند، افراد مظنون به تولید و انتشار محتوای مستهجن و همچنین فعالیت‌هایی که به قرار گرفتن کودکان در معرض چنین محتواهایی منجر می‌شود، تحت تحقیق قرار دارند.» او همچنین گفت: «در مورد انجمن‌هایی که ال‌جی‌بی‌تی و بی‌اخلاقی را ترویج می‌کنند، بررسی‌های اداره بررسی جرایم مالی نشان داده است که مبالغ قابل‌توجهی از سوی نهادهای دولتی خارجی و سازمان‌های خارجی به برخی انجمن‌ها منتقل شده است. منبع این نقل‌وانتقال‌های مالی و ارتباط آنها با فعالیت‌های موضوع این تحقیقات در حال بررسی است.»"}, {"source": "BBC Persian", "title": "حصار سه‌لایه؛ پاکستان برای مقابله با پهپادها چه سپری ساخته است؟", "link": "https://www.bbc.com/persian/articles/ckg7qy1v44eo?at_medium=RSS&at_campaign=rss", "summary": "گسترش استفاده از پهپادها و پهپادهای انتحاری، ارتش‌های جهان را واداشته است تا در شیوه دفاع از پایگاه‌ها و تاسیسات حساس خود بازنگری کنند. به نظر می‌رسد نیروی هوایی پاکستان نیز در پاسخ به این چالش، با ترکیب سامانه‌های چینی و ترکیه‌ای، یک ساختار دفاع هوایی چندلایه ایجاد کرده است؛ ساختاری که برای مقابله با طیف گسترده‌ای از تهدیدهای هوایی، از پهپادهای کوچک تا موشک‌های کروز کم‌ارتفاع، طراحی شده است.", "date_str": "2026-09-16T19:17:47+00:00", "hash": "a69d8f132761e200", "title_fa": "حصار سه‌لایه؛ پاکستان برای مقابله با پهپادها چه سپری ساخته است؟", "summary_fa": "گسترش استفاده از پهپادها و پهپادهای انتحاری، ارتش‌های جهان را واداشته است تا در شیوه دفاع از پایگاه‌ها و تاسیسات حساس خود بازنگری کنند. به نظر می‌رسد نیروی هوایی پاکستان نیز در پاسخ به این چالش، با ترکیب سامانه‌های چینی و ترکیه‌ای، یک ساختار دفاع هوایی چندلایه ایجاد کرده است؛ ساختاری که برای مقابله با طیف گسترده‌ای از تهدیدهای هوایی، از پهپادهای کوچک تا موشک‌های کروز کم‌ارتفاع، طراحی شده است. ظاهرا نیروی هوایی پاکستان در پاسخ به همین چالش، برای تقویت توان دفاع هوایی کوتاه‌برد خود، ساختاری چندلایه و متشکل از سامانه‌های چینی و ترکیه‌ای معرفی کرده است. در این ساختار موشک، توپ خودکار و فناوری مقابله با پهپاد با یکدیگر ترکیب شده‌اند. در ویدئویی که نیروی هوایی پاکستان اخیرا منتشر کرد، سه سامانه متفاوت دفاع هوایی دیده می‌شوند: سامانه موشکی کوتاه‌برد زمین‌به‌هوای اچ‌کیو-۱۷ ای‌ئی ساخت چین، سامانه توپ خودکار ضدهوایی ۳۵ میلی‌متری «کورکوت» ساخت شرکت آسلسان ترکیه و سامانه ضدپهپادی ۴۰ میلی‌متری «شاهین» این شرکت. این سامانه‌ها در کنار یکدیگر حصاری دفاعی و یکپارچه ایجاد می‌کنند که هدف آن محافظت از تاسیسات مهم نظامی در برابر انواع تهدیدهای هوایی، از جمله پهپادها، مهمات پرسه زن، بالگردها، موشک‌های کروز و هواپیماهای در حال پرواز در ارتفاع پایین است. مفهوم اصلی دفاع هوایی کوتاه‌برد سه‌لایه این است که به‌جای اتکا به یک سلاح برای مقابله با تهدید ورودی، در فاصله‌های مختلف از سامانه‌های دفاعی متفاوت استفاده شود. به این ترتیب، پیش از آنکه هدف هوایی به مقصد مورد نظرش برسد، چند فرصت برای شناسایی، رهگیری و انهدام آن وجود خواهد داشت. فاروق چودری، تحلیلگر دفاعی، می‌گوید شواهد مبتنی بر اطلاعات منابع علنی نشان می‌دهند نیروی هوایی پاکستان برای مقابله با پهپادها و دیگر تهدیدهای هوایی کم‌ ارتفاع، راهبرد ترکیب چند لایه دفاع توپخانه‌ای با سامانه موشکی اچ‌کیو-۱۷ ای‌ئی ساخت چین را در پیش گرفته است."}, {"source": "Radio Farda", "title": "پاکستان و چین درباره اقدامات حوثی‌ها علیه عربستان به ایران «فشار آورده‌اند»", "link": "https://www.radiofarda.com/a/china-pakistan-press-iran-to-help-rein-in-houthis/33858224.html", "summary": ".", "date_str": "2026-09-17T13:54:31+00:00", "hash": "5818b2a2ad70e5ef", "title_fa": "پاکستان و چین درباره اقدامات حوثی‌ها علیه عربستان به ایران «فشار آورده‌اند»", "summary_fa": "وزیر دفاع پاکستان همزمان با ادامه درگیری‌ میان عربستان سعودی و شورشیان حوثی مورد حمایت ایران در یمن می‌گوید کشورش نگرانی‌های ریاض درباره حملات حوثی‌ها را به حکومت ایران منتقل کرده است. از سوی دیگر خبرگزاری رویترز در گزارشی که روز پنجشنبه ۲۶ شهریور منتشر کرد، خبر داد چین به شکل خصوصی به ایران فشار آورده که مانع از حملات حوثی‌ها به عریستان سعودی شود. خواجه آصف، وزیر دفاع پاکستان، در گفت‌وگو با یک رسانه این کشور اعلام کرد اسلام‌آباد نگرانی‌های عربستان سعودی درباره حملات اخیر حوثی‌ها را به ایران منتقل کرده است. او گفت: «فکر نمی‌کنم ایران به‌عنوان یک کشور جبهه دیگری را باز کند.» این موضع یک روز پس از آن اعلام شد که عربستان سعودی گفت حمله پهپادی حوثی‌ها به شهر مکه، مقدس‌ترین شهر مسلمانان، را خنثی کرده است . آصف درباره این حمله گفت: «اگر مکه مورد حمله قرار گیرد، برای حفاظت از آن نیازی به توافقنامه نیست» و تأکید کرد که پاکستان، صرف‌نظر از مفاد توافق دفاعی‌اش، وظیفه دارد از اماکن مقدس محافظت کند. اشاره او به توافق دفاعی مکه میان عربستان سعودی، پاکستان و ترکیه است که اوایل مرداد امضا شد و بر اساس آن حمله مسلحانه به یکی از این کشورها، حمله به هر سه کشور تلقی خواهد شد. در همین حال خبرگزاری دولتی آناتولی ترکیه گزارش داد عاصم منیر، فرمانده ارتش پاکستان، از ایران خواسته حوثی‌ها را برای توقف حملات به زیرساخت‌های انرژی عربستان سعودی ترغیب کند. این خبرگزاری به نقل از منابع دولتی پاکستان نوشته که منیر روز چهارشنبه در تماس تلفنی با عباس عراقچی، وزیر امور خارجه ایران، که در چین بود، از تهران خواست از «نفوذ» خود بر حوثی‌ها برای متوقف کردن حملات به تأسیسات نفتی و اقتصادی عربستان استفاده کند. از سوی دیگر سه منبع ایرانی به خبرگزاری رویترز گفتند چین به‌طور خصوصی از تهران خواسته است به"}, {"source": "Radio Farda", "title": "کمیته حقیقت‌یاب سازمان ملل: ایرانی‌ها میان سرکوب حکومت و پیامدهای جنگ گرفتار شده‌اند", "link": "https://www.radiofarda.com/a/un-hrc-investigative-iran/33858103.html", "summary": "کمیتهٔ حقیقت‌یاب سازمان ملل تأکید کرده است که در سرکوب اعتراضات دی‌ماه، «کشتارها» توسط نیروهای امنیتی حکومت در «مقیاسی تکان‌دهنده» در هر ۳۱ استان ایران رخ داده است.", "date_str": "2026-09-17T11:39:41+00:00", "hash": "705a686ad98b0cec", "title_fa": "کمیته حقیقت‌یاب سازمان ملل: ایرانی‌ها میان سرکوب حکومت و پیامدهای جنگ گرفتار شده‌اند", "summary_fa": "کمیتهٔ حقیقت‌یاب سازمان ملل تأکید کرده است که در سرکوب اعتراضات دی‌ماه، «کشتارها» توسط نیروهای امنیتی حکومت در «مقیاسی تکان‌دهنده» در هر ۳۱ استان ایران رخ داده است. کمیتهٔ مستقل بین‌المللی حقیقت‌یاب سازمان ملل دربارهٔ ایران می‌گوید غیرنظامیان در ایران میان نقض‌های فاحش حقوق بشر و جنایت علیه بشریت از سوی حکومت جمهوری اسلامی و پیامدهای جنگ مرگبار با آمریکا و اسرائیل گرفتار شده‌اند. این کمیته همچنین اعلام کرده است «دلایل معقولی» وجود دارد باور به این‌که آمریکا در جریان دو حملهٔ هوایی که دست‌کم ۱۷۸ غیرنظامی، از جمله زنان و کودکان، را کشت، مرتکب جنایت جنگی شده باشد. این کمیته روز پنج‌شنبه ۲۶ شهریور در گزارشی مبسوط به شورای حقوق بشر سازمان ملل نوشت سرکوب خشونت‌آمیز اعتراضات دی‌ماه ۱۴۰۴، تشدیدی بی‌سابقه نسبت به سرکوب‌های پیشین و با استفادهٔ گسترده از نیروی مرگبار بود که منجر به کشتار و جراحات جمعی و بازداشت‌های گسترده شد. به‌گفتۀ این کمیته، نیروهای امنیتی بر پشت‌بام‌ها و نقاط مرتفع مستقر شده و با تفنگ‌های نظامی به سوی جمعیت شلیک کردند. پیشتر، سازمان عفو بین‌الملل نیز با استناد به ویدئوهای تأییدشده و شهادت شاهدان عینی گزارش داده بود که نیروهای سپاه، بسیج، فراجا و مأموران لباس‌شخصی از خیابان‌ها و پشت‌بام ساختمان‌ها به سوی معترضان تیراندازی کرده و در موارد متعدد سر و بالاتنهٔ افراد را هدف قرار داده‌اند. نهاد زیر نظر سازمان ملل با اشاره به قطع اینترنت در جریان سرکوب اعتراض‌ها گفته است «این قطعی که بیش از پنج ماه ادامه یافت، طولانی‌ترین قطع سراسری ثبت‌شده بوده و به‌طور غیرقانونی جریان اطلاعات و هماهنگی اضطراری را مسدود کرده است.» گزارش کمیتهٔ حقیقت‌یاب به شورای حقوق بشر سازمان ملل از بازداشت ده‌ها نفر در جریان اعتراض‌ها هم خبر داده و اعلام کرده است بازداشت‌شدگان با شکنجه، حبس انفرادی و محرومیت از دسترسی به وکیل مواجه بودند و خانواده‌ها در بی‌خبری از محل نگهداری عزیزان‌شان قرار"}, {"source": "Radio Farda", "title": "دونالد ترامپ می‌گوید ایران مستقیماً با آمریکا تماس گرفته و خواهان توافق است", "link": "https://www.radiofarda.com/a/trump-iran-direct-contact-deal-war/33857970.html", "summary": "رئیس‌جمهور آمریکا بار دیگر پیش‌بینی کرد که جنگ با ایران به‌زودی پایان خواهد یافت و گفت این درگیری «پایان واقعاً خوبی» خواهد داشت.", "date_str": "2026-09-17T06:10:52+00:00", "hash": "49f9fc505ccf85a0", "title_fa": "دونالد ترامپ می‌گوید ایران مستقیماً با آمریکا تماس گرفته و خواهان توافق است", "summary_fa": "رئیس‌جمهور آمریکا بار دیگر پیش‌بینی کرد که جنگ با ایران به‌زودی پایان خواهد یافت و گفت این درگیری «پایان واقعاً خوبی» یران را تصویب و برای امضای ترامپ ارسال کرد", "summary_fa": "در مورد ایران، این مصوبه «قانون تحریم‌های ایران» مصوب سال ۱۹۹۶ را که در پایان سال جاری میلادی منقضی می‌شد، تا سال ۲۰۳۱ تمدید می‌کند. مجلس نمایندگان آمریکا طرح گستردهٔ تشدید تحریم‌های روسیه و تمدید پنج‌سالهٔ قانون تحریم‌های ایران را تصویب کرد و آن را برای امضای دونالد ترامپ، رئیس‌جمهور ایالات متحده، به کاخ سفید فرستاد. نمایندگان روز چهارشنبه ۲۵ شهریور با ۲۶۲ رأی موافق در برابر ۱۵۹ رأی مخالف، اصلاحات سنا بر این طرح را تصویب کردند. به این ترتیب و با پذیرش بدون تغییر متن سنا، روند بررسی این مصوبه در کنگره پایان یافته است و برای تبدیل شدن به قانون تنها به امضای رئیس‌جمهوری نیاز دارد. این طرح با عنوان «قانون تحریم روسیه و ایران به نام لیندزی گراهام در سال ۲۰۲۶» نام‌گذاری شده است؛ سناتور جمهوری‌خواهی که از طراحان اصلی این طرح بود و تیرماه امسال درگذشت. مصوبهٔ مجلس نمایندگان تحریم‌هایی را علیه شماری از مقام‌ها، بانک‌ها و نهادهای روسیه و افراد و شرکت‌های خارجی حامی بخش دفاعی این کشور در نظر می‌گیرد و همچنین شبکهٔ نفتکش‌هایی را هدف قرار می‌دهد که به «ناوگان سایه» روسیه معروف است و برای دور زدن تحریم‌های نفتی استفاده می‌شود. بخش دیگری از طرح به رئیس‌جمهور آمریکا اختیار می‌دهد بر کالاهای وارداتی از بزرگ‌ترین خریداران نفت و گاز روسیه تعرفه‌هایی تا سقف ۱۰۰ درصد وضع کند. این اختیار پنج خریدار بزرگ نفت خام روسیه، پنج واردکنندهٔ بزرگ گاز این کشور و پنج کشوری را دربر می‌گیرد که بیشترین نقش را در تسهیل دور زدن تحریم‌های نفتی روسیه دارند. این قانون یکی از پایه‌های تحریم‌های آمریکا علیه بخش انرژی ایران است و امکان اعمال تحریم علیه شرکت‌ها و اشخاص خارجی درگیر در برخی سرمایه‌گذاری‌ها و معاملات مرتبط با صنعت نفت و گاز ایران را فراهم می‌کند. این طرح بیش از یک سال در کنگره معطل مانده بود. دونالد ترامپ از آغاز"}],
      tech: [{"source": "TechCrunch AI", "title": "Huawei plans Q1 2027 launch of new AI chip as it takes on Nvidia", "link": "https://techcrunch.com/2026/09/17/huawei-plans-q1-2027-launch-of-new-ai-chip-as-it-takes-on-nvidia/", "summary": "Huawei is accelerating the launch of its next-generation Ascend 960DT AI chip as it pushes to compete with Nvidia and close China’s AI computing gap with the U.S.", "date_str": "2026-09-17T14:06:14+00:00", "hash": "341fd83c817987cf", "title_fa": "هوآوی قصد دارد در سه ماهه اول 2027 تراشه هوش مصنوعی جدید خود را همزمان با انویدیا عرضه کند", "summary_fa": "هوآوی با تلاش برای رقابت با انویدیا و کاهش شکاف محاسباتی هوش مصنوعی چین با ایالات متحده، راه اندازی تراشه هوش مصنوعی نسل بعدی Ascend 960DT خود را تسریع می بخشد، همانطور که شرکت هواوی در کنفرانس Nvidia پنج شنبه در رقابت با شرکت Nvidia اعلام کرد، هوآوی در حال انتقال نسل بعدی تراشه هوش مصنوعی Ascend 960DT خود به سه ماهه اول سال 2027 است. سخنگوی هوآوی به TechCrunch گفت که غول فناوری چینی قبلاً برنامه ریزی کرده بود که این تراشه را در سه ماهه سوم سال 2027 عرضه کند. سخنگو گفت: «انتظار می‌رود Ascend 960DT در سه ماهه اول 2027 آماده شود. تراشه‌های Ascend 960 زودتر از موعد مقرر عرضه می‌شوند، عملکرد را دوبرابر می‌کنند و سال به سال پیشرفت می‌کنند.» وی افزود که دیوید وانگ، رئیس دوره‌ای و موقت هواوی، جدول زمانی به‌روزرسانی‌شده را در Huawei Connect در روز پنجشنبه اعلام کرد. این اعلامیه تنها یک هفته قبل از دیدار ترامپ رئیس جمهور آمریکا و شی جین پینگ، رئیس جمهور چین در 24 سپتامبر در واشنگتن دی سی منتشر شد. هوآوی در تلاش است تا صدها هزار و در نهایت میلیون ها تراشه هوش مصنوعی را به یک کامپیوتر غول پیکر تبدیل کند. شرکت فناوری چینی این رویکرد را معماری محاسباتی Peerium خود می نامد. این فناوری به UnifiedBus، فناوری هوآوی برای اتصال پردازنده‌ها به حافظه، ذخیره‌سازی و سخت‌افزار شبکه متکی است. اریک زو، رئیس دوره‌ای هوآوی، در بیانیه این شرکت گفت که از معماری محاسباتی Peerium جدید خود برای ساخت سیستم‌های محاسباتی هوش مصنوعی بزرگ‌تر استفاده می‌کند که هم برای آموزش و هم برای استنتاج طراحی شده‌اند. Atlas 950 SuperPoD و SuperCluster هوآوی اولین سیستم هایی هستند که بر اساس معماری ساخته شده اند. این شرکت می گوید Atlas 950 SuperCluster می تواند تا 256000 کارت شتاب دهنده را به هم متصل کند."}, {"source": "TechCrunch AI", "title": "2 days left to exhibit at TechCrunch Disrupt 2026", "link": "https://techcrunch.com/2026/09/17/2-days-left-to-exhibit-at-techcrunch-disrupt-2026/", "summary": "Last day to book your exhibit table at Disrupt is September 18. Two days left. Get your startup in front of 10,000+ founders, investors, operators, and tech leaders on October 13–15.", "date_str": "2026-09-17T14:00:00+00:00", "hash": "dbf7a175b09c3103", "title_fa": "2 روز تا نمایشگاه در TechCrunch Disrupt 2026 باقی مانده است", "summary_fa": "آخرین روز برای رزرو میز نمایشگاه خود در Disrupt 18 سپتامبر است. دو روز باقی مانده است. راه اندازی خود را در مقابل بیش از 10000 بنیانگذار، سرمایه گذار، اپراتور و رهبران فناوری در 13 تا 15 اکتبر ارائه دهید. آخرین فرصت شما برای راه اندازی استارتاپ خود در سالن اکسپو تقریباً فرا رسیده است. در 13 تا 15 اکتبر در Moscone West در سانفرانسیسکو، بیش از 10000 بنیانگذار، سرمایه گذار، اپراتور و رهبران فناوری به دنبال استارت آپ ها، محصولات، مشارکت و فرصت های سرمایه گذاری خواهند بود. یک میز نمایشگاهی 6 × 30 به تیم شما سه روز در طبقه سالن اکسپو فرصت می دهد تا محصول شما را مستقیماً در مقابل مخاطبان Disrupt قرار دهد. بسته شما همچنین شامل 10 مجوز تیمی، نام تجاری وب‌سایت و برنامه، دسترسی به فهرست مطبوعات، نام تجاری حامی سطح نقره‌ای و موارد دیگر است. بنیان‌گذاران همچنین می‌توانند از فرصت‌های شبکه‌ای دیگر از جمله خواستگاری مبتنی بر هوش مصنوعی، کافه Deal Flow و شبکه‌سازی سرمایه‌گذار به موسس بهره ببرند. استارت‌آپ‌هایی که در Disrupt شرکت می‌کنند سه روز فرصت دارند تا دموها را به مکالمه، گفتگوها را به سرنخ و سرنخ‌ها را به معاملات احتمالی تبدیل کنند. میز نمایشگاه خود را قبل از 18 سپتامبر ساعت 23:59 رزرو کنید. PT. وقتی از طریق پیوندهای موجود در مقالات ما خرید می کنید، ممکن است کمیسیون کمی کسب کنیم. این بر استقلال تحریریه ما تأثیر نمی گذارد. رویدادهای TechCrunch مشاهده بیوگرافی 13 اکتبر 15 سانفرانسیسکو آخرین روز برای رزرو میز نمایشگاه 18 سپتامبر است. سرنخ‌های پر تاثیر، دسترسی سرمایه‌گذاران، و کانون توجه برند در سالن نمایشگاه Disrupt را از دست ندهید. استارت‌آپ فن‌آوری پاک Fluxnium راهی برای بهره‌برداری از سوخت هسته‌ای 50000 ساله پیدا کرد مدل استدلال جدید تیم دی چانت سیلزفورس و انویدیا همه چیزهایی است که آزمایشگاه‌های هوش مصنوعی باید از جولی بورت"}, {"source": "TechCrunch AI", "title": "Rival AI agents, Instinct and Meta’s Muse, both add the ability to make calls", "link": "https://techcrunch.com/2026/09/17/rival-ai-agents-instinct-and-metas-muse-both-add-the-ability-to-make-calls/", "summary": "People can use these assistants to make restaurant reservations and cancel subscriptions.", "date_str": "2026-09-17T13:46:16+00:00", "hash": "0613df660ef44148", "title_fa": "عوامل هوش مصنوعی رقیب، Instinct و Meta’s Muse، هر دو توانایی برقراری تماس را اضافه می کنند.", "summary_fa": "مردم می توانند از این دستیارها برای رزرو رستوران و لغو اشتراک استفاده کنند. دستیارهای هوش مصنوعی مبتنی بر متن بازار داغی هستند، با Instinct، Wajo، Town، Ollie، و عامل Metas Muse که هفته گذشته راه اندازی شد و برای جلب توجه و وظایف کاربران رقابت می کند. Instinct مستقر در سانفرانسیسکو یکی از محبوب‌ترین این مجموعه‌ها است، که توجه سرمایه‌گذاران زیادی را با ارزشی معادل 10 میلیارد دلار به خود جلب کرده است. محبوبیت Instinct اکنون ممکن است حتی بیشتر شود، زیرا ویژگی تماس جدیدی را اضافه کرده است که به نماینده شما امکان می دهد تماس برقرار کند و به عنوان یک دربان عمل کند. Meta s Muse، یکی دیگر از مدعیان جدی این نبرد نیز همین کار را کرده است. بنیانگذار Instinct، Noah Shinn در X اعلام کرد که ویژگی تماس جدید استارت‌آپ پرهیاهو، Instinct Concierge، می‌تواند کارهایی مانند رزرو رستوران‌هایی را انجام دهد که رزرو آنلاین انجام نمی‌دهند، در لیست لغو دندانپزشک شما قرار نگیرند، یا مشکلات صورت‌حساب کابل شما را حل کنند. او گفت که این ویژگی در دسترسی زودهنگام برای برخی از کاربران در حال گسترش است و برنامه‌هایی برای گسترش به موقع برای همه کاربران وجود دارد. اگرچه Instinct به سرعت ارسال می شود، دستیار هوش مصنوعی Metas Muse همچنان ادامه دارد. همچنین به تازگی توانایی برقراری تماس با مشاغل ایالات متحده را به دست آورده است. این غول فناوری گفت که این ویژگی ابتدا برای کاربرانی که از Muse می‌خواهند تماس بگیرند، ارائه می‌شود. (این اساساً به عنوان مکانیزم درخواست ویژگی عمل می‌کند، و متا گفت که هر زمان که Muse ویژگی‌های جدیدی را راه‌اندازی کند، ابتدا برای افرادی که درباره آنها از Muse سؤال می‌کنند در دسترس خواهد بود.) این ویژگی‌های تماس زمانی به دست می‌آیند که تعدادی از رقبا توانایی خود را برای برقراری تماس به عنوان یک مزیت نسبت"}, {"source": "TechCrunch AI", "title": "Google, Nvidia, and Anthropic want Emerald AI to find space on the grid for more data centers", "link": "https://techcrunch.com/2026/09/17/google-nvidia-and-anthropic-want-emerald-ai-to-find-space-on-the-grid-for-more-data-centers/", "summary": "A new coalition that includes Google, Nvidia, Anthropic, and Emerald AI wants to find 100 GW of grid capacity for new data centers.", "date_str": "2026-09-17T13:38:33+00:00", "hash": "46301fcc2d2079ba", "title_fa": "گوگل، انویدیا و آنتروپیک از Emerald AI می خواهند تا فضایی را در شبکه برای مراکز داده بیشتر پیدا کند.", "summary_fa": "ائتلاف جدیدی که شامل گوگل، انویدیا، آنتروپیک، و هوش مصنوعی زمرد است می‌خواهد 100 گیگاوات ظرفیت شبکه برای مراکز داده جدید پیدا کند. نرم افزار Grid Unicorn Emerald AI ائتلافی با گوگل و انویدیا تشکیل داده است که از فناوری استارت آپ برای ایمن کردن فضای شبکه برای مراکز داده بیشتر استفاده می کند. اتحاد مدیریت انرژی هوش مصنوعی (AEMA) امیدوار است بتواند به تقاضا پاسخ دهد - الگویی که در آن مراکز داده به طور موقت مصرف برق خود را کاهش می دهند - بخشی جدایی ناپذیر از توسعه مرکز داده. AEMA می‌گوید توقف وظایف غیر بحرانی و جابجایی برخی از بارهای محاسباتی می‌تواند به ۱۰۰ گیگاوات دیگر از مراکز داده اجازه دهد تا به شبکه متصل شوند. سه موسس توسط Anthropic، و طیف وسیعی از ابزارها از جمله AES، Constellation، National Grid و NRG Energy ملحق شده است. پاسخ به تقاضا یک مفهوم قدیمی است که برای دهه ها توسط شرکت های برق مورد استفاده قرار گرفته است. این کار می کند زیرا شبکه با در نظر گرفتن بارهای اوج طراحی شده است. در بیشتر سال، تقاضا بسیار کمتر از حداکثری است که شبکه می تواند پشتیبانی کند. به طور سنتی، پاسخ به تقاضا، کاربران بزرگ برق مانند کارخانه‌ها را تحت پوشش قرار می‌داد، که در زمان‌های تقاضای بالا موافقت می‌کردند که مصرف خود را کاهش دهند، معمولاً با توقف تولید یا تغییر به ژنراتورهای پشتیبان. در ازای این خدمات، شرکت آب و برق به آنها برای این سرویس پرداخت می‌کرد، که اغلب بسیار خوب بود. امروزه مراکز داده نیز می توانند از مزایای آن برنامه ها استفاده کنند، معمولاً با روشن کردن مولدهای پشتیبان. Emerald AI جایگزینی برای دیزل ژنراتورهای کثیف پیشنهاد کرده است. نرم‌افزار این شرکت درخواست‌های شرکت‌های خدماتی را با مراکز داده هماهنگ می‌کند، که می‌تواند کارهای غیر بحرانی را متوقف کند یا بارها را"}, {"source": "TechCrunch AI", "title": "Iceland-based Treble raises $18 million for its voice simulation platform", "link": "https://techcrunch.com/2026/09/16/iceland-based-treble-raises-18-million-for-its-voice-simulation-platform/", "summary": "Treble's voice simulation platform is used by voice AI model developers and AI wearable and robotics companies,", "date_str": "2026-09-17T05:00:00+00:00", "hash": "cf6dde774073a9c9", "title_fa": "Treble مستقر در ایسلند 18 میلیون دلار برای پلتفرم شبیه سازی صدای خود جمع آوری کرده است", "summary_fa": "پلتفرم شبیه‌سازی صدای Treble توسط توسعه‌دهندگان مدل‌های هوش مصنوعی صوتی و شرکت‌های پوشیدنی و رباتیک هوش مصنوعی استفاده می‌شود، هوش مصنوعی صوتی به عنوان یکی از داغ‌ترین بخش‌ها در هوش مصنوعی ظاهر شده است، با سرمایه‌گذارانی که میلیاردها دلار برای سرویس‌دهی موارد استفاده از خودکارسازی پشتیبانی مشتری و تماس‌های فروش گرفته تا ایجاد یادداشت‌کننده‌های جلسه و توسعه هوش مصنوعی به‌عنوان سطح عینک صوتی هوشمند اولیه که از آن استفاده می‌کنند، سرمایه‌گذاری می‌کنند. در همین حال، آزمایشگاه‌های هوش مصنوعی به سرعت مدل‌هایی را منتشر می‌کنند و سازندگان سخت‌افزار در تلاش هستند تا بهترین تجربه را برای تعامل مصرف‌کنندگان با دستگاه‌ها ایجاد کنند. همه این فناوری جدید نیاز به آزمایش و یک حلقه بازخورد برای بهبود دارد. یک استارت آپ مستقر در ایسلند به نام Treble، با ایجاد یک پلتفرم شبیه سازی که می تواند برای سازندگان مدل، شرکت های رباتیک و سازندگان سخت افزار مصرف کننده، خود را در مرکز صنعت هوش مصنوعی قرار دهد. این شرکت که در سال 2020 توسط مهندسان آکوستیک فینور پیند و جسپر پدرسن تأسیس شد، با مشارکت سرمایه‌گذاران فعلی KOMPAS VC، Frumtak Ventures، EIC، و Omega ehf، 18 میلیون دلار در تمدید بودجه سری A خود به رهبری Paladin Capital Group جمع‌آوری کرد. این شرکت در سال 2024 12 میلیون دلار سرمایه گذاری کرد و مجموع درآمد خود را تا به امروز به بیش از 40 میلیون دلار رساند. این استارت‌آپ آمازون و لاجیتک را به عنوان مشتریان حساب می‌کند. Treble دارای چند عمودی مرتبط با شبیه سازی و داده است. برای شرکت های هوش مصنوعی صوتی، یک پلت فرم تولید داده مصنوعی دارد که می تواند برای تقویت گفتار، سرکوب نویز و آموزش مدل استفاده شود. همچنین مدل‌های هوش مصنوعی صوتی را در شرایط مختلف برای ارائه بازخورد به آزمایشگاه‌ها ارزیابی می‌کند. در اوایل سال جاری، با Hugging Face همکاری کرد تا معیاری برای"}, {"source": "TechCrunch AI", "title": "Your startup’s next teammate might be an AI agent: Gusto, Insight Partners, and Leland explain what that changes at TechCrunch Disrupt 2026", "link": "https://techcrunch.com/2026/09/16/your-startups-next-teammate-might-be-an-ai-agent-gusto-insight-partners-and-leland-explain-what-that-changes-at-techcrunch-disrupt-2026/", "summary": "This session will explore how early-stage companies are building teams where humans and AI agents work alongside each other — and how founders can do that without sacrificing speed, accountability, or culture. Learn more at TechCrunch Disrupt 2026. Register before September 25 to save up to $200.", "date_str": "2026-09-17T03:30:00+00:00", "hash": "94887b0d5e6b9fb4", "title_fa": "هم تیمی بعدی استارت آپ شما ممکن است یک عامل هوش مصنوعی باشد: Gusto، Insight Partners و Leland توضیح می دهند که در TechCrunch Disrupt 2026 چه تغییری می کند.", "summary_fa": "اولین چند استخدام در یک استارتاپ می تواند شرکت را تعریف کند. اما به طور فزاینده ای، هر قابلیت جدیدی به یک کارمند جدید نیاز ندارد. عوامل هوش مصنوعی شروع به انجام کارهای مهندسی، پشتیبانی مشتری، تحقیقات و عملیاتی می کنند که قبلاً به اعضای اولیه تیم واگذار می شد. برای بنیان‌گذاران، قبل از اینکه حتی یک درخواست شغلی را باز کنند، یک سوال جدید ایجاد می‌کند: مردم چه چیزی باید داشته باشند و چه چیزی باید به هوش مصنوعی واگذار شود؟ این جلسه به بررسی این موضوع می‌پردازد که چگونه شرکت‌های مرحله اولیه در حال ایجاد تیم‌هایی هستند که در آن انسان‌ها و عوامل هوش مصنوعی در کنار یکدیگر کار می‌کنند – و چگونه بنیان‌گذاران می‌توانند این کار را بدون قربانی کردن سرعت، مسئولیت‌پذیری یا فرهنگ انجام دهند. برای یک شرکت در مراحل اولیه، هر استخدامی معادلی بین توانایی، هزینه و سرعت است. عوامل هوش مصنوعی گزینه دیگری را اضافه می کنند. وظایف مهندسی، پشتیبانی مشتری و کارهای عملیاتی به طور فزاینده‌ای می‌توانند به سیستم‌هایی واگذار شوند که قادر به تکمیل وظایف چند مرحله‌ای هستند نه اینکه صرفاً به یک کارمند کمک کنند تا آنها را تکمیل کند. این به بنیان‌گذاران فرصتی می‌دهد تا مجدداً فکر کنند که اولین تیم‌هایشان واقعاً چگونه باید باشند. به جای اینکه به طور خودکار بپرسیم: «بعد چه کسی را استخدام کنیم؟»، سؤال شروع می تواند این باشد: چه کاری باید انجام شود - و آیا یک فرد بهترین راه برای انجام آن است؟ این تمایز مهم است. سپردن کار به یک عامل هوش مصنوعی می‌تواند به یک تیم کوچک کمک کند تا سریع‌تر حرکت کند، اما همچنین سؤالات جدیدی در مورد مالکیت مطرح می‌کند. چه کسی کار را بررسی می کند؟ چه کسی تصمیم نهایی را می گیرد؟ چه اتفاقی می افتد که یک نماینده اشتباه می کند؟ و کدام مسئولیت ها برای"}, {"source": "TechCrunch AI", "title": "Snap tries to make the case again for its $2,200 smart glasses", "link": "https://techcrunch.com/2026/09/16/snap-tries-to-make-the-case-again-for-its-2200-smart-glasses/", "summary": "Since Specs' debut earlier this year, Snap has clearly been looking for an opportunity to explain why the smart glasses deserve to exist.", "date_str": "2026-09-17T00:58:49+00:00", "hash": "60c0b6c6ae69ffb5", "title_fa": "اسنپ ​​تلاش می کند تا دوباره برای عینک هوشمند 2200 دلاری خود این قاب را بسازد", "summary_fa": "از زمان معرفی Specs در اوایل سال جاری، اسنپ به وضوح به دنبال فرصتی برای توضیح اینکه چرا عینک های هوشمند شایسته وجود هستند، بوده است. هنگامی که اسنپ عینک هوشمند مورد انتظار خود را با نام Specs در اوایل سال جاری معرفی کرد، این فاجعه نه تنها غافلگیرکننده بود، بلکه یک فاجعه واقعی نیز بود. این عینک - که قیمت هنگفتی 2200 دلار دارد و به طور مبهمی یادآور وسایل غواصی است - الهام بخش خنده های آنلاین شد و از مدیر عامل شرکت، ایوان اشپیگل، خواست استعفا دهد. سهام شرکت متعاقباً سقوط کرد. از آن زمان، اسنپ به وضوح به دنبال فرصتی برای توضیح این موضوع بوده است که چرا Specs - سخت افزار سنگین و گران قیمتی که اکثر مصرف کنندگان معمولی احتمالاً قادر به پرداخت آن نیستند - شایسته وجود است. این هفته، این شرکت شانس خود را برای ارائه این استدلال داشت. در یک رویداد در لس آنجلس، اشپیگل و دیگر مدیران اسنپ از انواع ویژگی ها و خدمات جدید مرتبط با مشخصات رونمایی کردند. به‌نظر می‌رسد که به‌روزرسانی‌های جدید به وضوح طراحی شده‌اند تا به ادغام عینک‌ها در مجموعه‌ای وسیع‌تر از فعالیت‌های دیجیتال کمک کنند و با انجام این کار، حس واضح‌تری از هدف را به مشخصات می‌دهند. در جریان رویداد چهارشنبه، اشپیگل جزئیات تعدادی از ویژگی های جدید را به اشتراک گذاشت. پس از یک ویدیوی تبلیغاتی هیجان انگیز که به طور مبهم توهم ayahuasca را به ذهن متبادر کرد، مدیر عامل شرکت روی صحنه رفت و مجموعه ای از دموهای زنده را آغاز کرد. گزینه‌های سرگرمی جدید - مشخصات اکنون می‌توانند با HBO Max و Spotify ارتباط برقرار کنند - پایه‌ای از سرگرمی تعاملی را ارائه می‌کنند که عینک‌های هوشمند تا حد زیادی فاقد آن بوده‌اند. با این حال، شاید بزرگ‌ترین اعلامیه، راه‌اندازی Specs Intelligence بود، که شرکت آن را یک سیستم"}, {"source": "TechCrunch AI", "title": "Al Gore says the real AI risk isn’t data centers", "link": "https://techcrunch.com/2026/09/16/al-gore-has-a-surprisingly-calm-take-on-the-ai-data-center-backlash/", "summary": "In an interview with TechCrunch, Al Gore suggested he isn't losing sleep over AI data center emissions — he's more worried about the AI industry's own warnings about where the technology is headed.", "date_str": "2026-09-16T23:43:09+00:00", "hash": "49534497fe350733", "title_fa": "ال گور می گوید که خطر واقعی هوش مصنوعی مراکز داده نیست", "summary_fa": "در مصاحبه با TechCrunch، ال گور پیشنهاد کرد که خوابش را به خاطر انتشار مراکز داده هوش مصنوعی از دست نمی دهد - او بیشتر نگران هشدارهای خود صنعت هوش مصنوعی در مورد اینکه این فناوری به کجا می رود، است. ال گور بیش از دو دهه را به عنوان یکی از شناخته شده ترین صداها در جنبش آب و هوا گذرانده است، بنابراین وقتی او در مورد هوش مصنوعی صحبت می کند، ارزش توجه به چیزی را دارد که او واقعاً ترسناک می داند. و این چیزی نیست که مردم به مراکز داده در خیابان ها اعتراض کنند. این موقعیت جدیدی برای گور نیست. به عنوان مثال، در ماه مه گذشته، او مراکز داده هوش مصنوعی را به یک رسانه دیگر به عنوان دلیلی برای نگرانی عمیق، اما نه وحشت توصیف کرد، و در گفتگوی این هفته ما، نقطه مرکزی او در مورد انتشار گازهای گلخانه ای، مقیاس بود. او گفت اگر به انتشار همه مراکز داده هوش مصنوعی در کنار هم نگاه کنید، این تنها کسری از انتشارات ناشی از دفن زباله های بدون پوشش در جهان است، و افزود که ساخت قابل مقایسه با چیزی است که بسیار کمتر مورد توجه قرار می گیرد: تهویه مطبوع. این یک مشاهده معتبر است (و آزمایشگاه‌های هوش مصنوعی باید در بحث‌های خود با شهرها و ایالت‌ها از آن استفاده کنند، اگر قبلاً وجود نداشته باشند). آژانس بین‌المللی انرژی تخمین می‌زند که تهویه مطبوع جهانی در حال حاضر سالانه بیشتر از کل اتحادیه اروپا برق مصرف می‌کند و با مالکیت هنوز کمتر از 15 درصد در گرم‌ترین و سریع‌ترین بخش‌های جهان، انتظار می‌رود این تقاضا تا سال 2050 سه برابر شود و فشار بسیار بیشتری نسبت به مراکز داده هوش مصنوعی در مدت مشابه به شبکه وارد کند. گور نگرانی در مورد نحوه تامین انرژی این مراکز داده را رد نمی"}, {"source": "TechCrunch AI", "title": "Anthropic and OpenAI want to embed safety evaluators. Will they really be independent?", "link": "https://techcrunch.com/2026/09/16/anthropic-and-openai-want-to-embed-safety-evaluators-will-they-really-be-independent/", "summary": "Anthropic and OpenAI want to embed independent safety evaluators inside their AI labs. Researchers welcome the unprecedented access, but warn meaningful oversight requires transparency, independence, and eventually regulation.", "date_str": "2026-09-16T21:07:24+00:00", "hash": "1c26366ab25157bc", "title_fa": "Anthropic و OpenAI می خواهند ارزیاب های ایمنی را تعبیه کنند. آیا آنها واقعاً مستقل خواهند بود؟", "summary_fa": "Anthropic و OpenAI می خواهند ارزیاب های ایمنی مستقل را در آزمایشگاه های هوش مصنوعی خود تعبیه کنند. محققان از این دسترسی بی‌سابقه استقبال می‌کنند، اما هشدار می‌دهند که نظارت معنادار نیازمند شفافیت، استقلال و در نهایت مقررات است. در یک مقاله طولانی که در آخر هفته منتشر شد، داریو آمودی، مدیرعامل آنتروپیک، پیشنهادی را ارائه کرد که صنعت هوش مصنوعی حتی یک سال پیش آن را فوراً رد می‌کرد: ارزیاب‌های شخص ثالث را در تمام شرکت‌های هوش مصنوعی مرزی تعبیه کنید، به آنها قدرت گزارش حوادث ایمنی، ارزیابی اینکه آیا مدل‌های هوش مصنوعی واقعاً همسو هستند یا خیر، و به اشتراک گذاشتن مدل‌های هوش مصنوعی با دنیا. آمودی گفت آنتروپیک متعهد می شود که به ارزیاب های مستقل مانند METR و Redwood Research دسترسی بی سابقه ای به سیستم های شرکت بدهد. مدیر عامل شرکت سام آلتمن گفت که OpenAI نیز به این عمل متعهد خواهد شد که نشان دهنده یک تغییر عمیق بالقوه در نحوه کار صنعت با گروه های تحقیقاتی خارجی است. ارزیابان شخص ثالثی که با TechCrunch صحبت کردند، به طور گسترده از این پیشنهاد استقبال کردند، اما گفتند که اگر می‌خواهند بدانند که آیا به‌عنوان ناظر واقعاً مستقل عمل می‌کنند یا فروشندگانی که بر اساس شرایط شرکت‌های هوش مصنوعی عمل می‌کنند، باید جزئیات را بررسی کنند - و در حالت ایده‌آل توسط قانون حمایت شود. این دسترسی عمیق‌تر اهمیت بیشتری پیدا می‌کند، زیرا مدل‌ها در تشخیص بهتر زمانی که ارزیابی می‌شوند، این خطر را افزایش می‌دهد که در حین آزمایش رفتار مشکل‌ساز را پنهان می‌کنند. محققان می‌گویند سرنخ‌هایی از آن رفتار را می‌توان هنگام آزمایش مدل نهایی نادیده گرفت، اما با بررسی نحوه رفتار آن در طول آموزش کشف شد. شرکت‌های هوش مصنوعی باید بتوانند به برخی از سؤالات اساسی در مورد فرآیند آموزشی خود پاسخ دهند، مانند: آیا هوش مصنوعی در حین گذراندن دوره"}, {"source": "TechCrunch AI", "title": "After accusations of selling ‘perv glasses,’ Meta prepares to sell a pair without a camera", "l xing با 1400 تعریف جدید است", "summary_fa": "اکنون هیچ بهانه ای برای ندانستن معنی «فصل کاف»، «شیشیتو» یا «درخشش» ندارید."}, {"source": "The Guardian AI", "title": "Artists boycotted this portrait prize over AI entries. Now they’re back to take them on", "link": "https://www.theguardian.com/artanddesign/ng-interactive/2026/sep/18/bpp-brisbane-portrait-prize-2026-ai", "summary": "After two years shunning the Brisbane portrait prize, several artists are entering again, with some First Nations painters counting on another AI – ‘ancestral integrity’ – to help them win Poised above the lady in the red dress is a claw. Its metallic fingers grasp to pluck its prize from a jumble of other women while she looks dreamily upward, as if to say “Who, me?” The woman in the red dress is Australian comedian Alice Fraser , as photographed on stage. The other women – generic superheroes and 1950s housewives – were created using the generative AI software Krea. Continue reading...", "date_str": "2026-09-17T15:00:55+00:00", "hash": "3d6b3cec3074d0da", "title_fa": "هنرمندان این جایزه پرتره را به دلیل ورودی های هوش مصنوعی تحریم کردند. اکنون آنها بازگشته اند تا آنها را قبول کنند", "summary_fa": "پس از دو سال دوری از جایزه پرتره بریزبن، چندین هنرمند دوباره وارد می‌شوند، با برخی از نقاشان ملل اول که روی هوش مصنوعی دیگری - \"صداقت اجدادی\" - حساب می‌کنند تا به آنها کمک کند تا بالاتر از خانمی با لباس قرمز پنجه برنده شوند. انگشتان فلزی آن برای برداشتن جایزه از میان انبوهی از زنان دیگر در حالی که او رویاگونه به سمت بالا نگاه می کند، گویی می خواهد بگوید \"کی، من؟\" زن با لباس قرمز آلیس فریزر کمدین استرالیایی است که روی صحنه عکس گرفته است. زنان دیگر - ابرقهرمانان عمومی و زنان خانه دار دهه 1950 - با استفاده از نرم افزار مولد هوش مصنوعی Krea خلق شدند. به خواندن ادامه دهید... هنرمند جکی رایان می‌گوید: «این انسان بر عنصر هوش مصنوعی است. اما آیا انتخاب شدن چیز خوبی است؟ اثر رایان The Catch فینالیست جایزه پرتره بریزبن (BPP) امسال است. برای رایان، استفاده از هوش مصنوعی فقط یک افزوده جدید به حرفه ای است که خلاقانه در کاوش فرهنگ پاپ صرف شده است. بیش از 15 سال پیش، او از نرم‌افزار ویرایش تصویر و فرآیند «بی‌معنایی» برش و چسباندن با دست استفاده کرد تا عکس‌هایی را که از افراد واقعی گرفته بود در یک سری رمان گرافیکی ارائه کند. پس از گرفتن عکس فریزر که در اوایل سال جاری ژست گرفته بود، رایان از خود پرسید: آیا هوش مصنوعی می تواند سوژه او را در یک ماشین پنجه قرار دهد؟ \"نمی دانم، می تواند؟\" او می خندد و اسکرین شات اولین تلاش کرا را در دست می گیرد. تصویر اولیه، فیگورهای عروسکی مانند واقعی و ناراحت کننده است که به سختی درون یک محفظه شیشه ای ایستاده اند. رایان به نرم افزار دستورات بیشتری داد: افسانه های فمینیستی را اضافه کنید. ارقام را به‌طور نامرتب روی هم جمع کنید. پس زمینه را تغییر دهید"}, {"source": "The Guardian AI", "title": "Meta ordered to remove UK deepfakes as oversight board criticises ‘inadequate’ safeguards", "link": "https://www.theguardian.com/technology/2026/sep/17/meta-ordered-remove-deepfakes-oversight-board-inadequate-safeguards", "summary": "Facebook told it was wrong in leaving up AI-generated videos of a Labour councillor and Muslim campaigner, amid calls to curb fakes Meta’s “supreme court” has ordered the tech company to take down deepfake videos of a UK politician and a young Muslim woman from Facebook and do more to tackle AI-generated fake imagery . A fake video showing a Labour party councillor in Scotland making inflammatory comments about refugees should not have been left up by Facebook, the board said. It also ruled that an AI-generated video of a Muslim campaign volunteer should have been removed after it falsely depicted her offering health advice while carrying out absurd exercises or eating junk food. Continue reading...", "date_str": "2026-09-17T14:43:34+00:00", "hash": "a1e142bac883605e", "title_fa": "متا دستور حذف دیپ فیک های بریتانیا را صادر کرد زیرا هیئت نظارت از پادمان های \"ناکافی\" انتقاد می کند", "summary_fa": "فیس‌بوک اعلام کرد که در بحبوحه درخواست‌ها برای جلوگیری از تقلبی‌ها، گذاشتن ویدیوهای تولید شده توسط هوش مصنوعی از یک مشاور کارگری و مبارز مسلمان اشتباه بوده است، «دادگاه عالی» متا به شرکت فناوری دستور داده است که ویدیوهای یک سیاستمدار بریتانیایی و یک زن جوان مسلمان را از فیس‌بوک حذف کند و برای مقابله با تصاویر جعلی تولید شده توسط هوش مصنوعی تلاش بیشتری کند. به گفته هیئت مدیره فیس بوک، ویدئوی جعلی که نشان می دهد یکی از اعضای شورای حزب کارگر در اسکاتلند در حال اظهار نظرهای تحریک آمیز درباره پناهندگان است، نباید توسط فیس بوک رها می شد. همچنین حکم داد که ویدئویی که توسط هوش مصنوعی از یک داوطلب مبارزات انتخاباتی مسلمان تهیه شده بود، باید حذف می‌شد، زیرا به اشتباه او را در حال ارائه توصیه‌های بهداشتی در حین انجام تمرینات پوچ یا خوردن غذاهای ناسالم نشان می‌داد. به خواندن ادامه دهید... هیئت مدیره گفت که تدابیر متا \"به طور مداوم و اساسا ناکافی\" برای رسیدگی به افزایش سریع دیپ‌فیک‌های هوش مصنوعی است. پاملا سان مارتین، یکی از اعضای هیئت نظارت گفت: «از سیاستمداران گرفته تا شهروندان خصوصی، دیپ‌فیک‌های تولید شده توسط هوش مصنوعی به طور فزاینده‌ای برای آزار و اذیت و ساکت کردن زنان از مشارکت در گفتمان عمومی استفاده می‌شوند.» «این موارد الگوی نگران‌کننده‌تر و گسترده‌تری را نشان می‌دهد که در آن زنانی که به طور علنی درگیر موضوعاتی هستند، به طور نامتناسبی در معرض آزار و اذیت و اطلاعات نادرست قرار می‌گیرند. متا و دیگر پلتفرم‌های رسانه‌های اجتماعی به سیاست‌های قوی‌تری برای مقابله با گسترش دیپ‌فیک نیاز دارند. در کلیپ اسکاتلند، نماینده شورای شهر به دروغ نشان داده می‌شود که می‌گوید: \"پناهگان در اینجا استقبال می‌شوند، حتی اگر به زنان ما تجاوز کنند، زیرا سفیدپوستان نیز این کار را می‌کنند.\" هیئت نظارت، یک نهاد شبه مستقل که تصمیمات آن الزام آور"}, {"source": "The Guardian AI", "title": "Tax the middle earners! Will the PM do it? – podcast", "link": "https://www.theguardian.com/politics/audio/2026/sep/17/tax-the-middle-earners-will-the-pm-do-it-podcast", "summary": "Former Bank of England economist Andy Haldane said the markets regarded this government as ‘a pretty traditional tax and spend socialist government with better TikTok videos’. Harsh criticism or truth? As pressure mounts on the chancellor, John Healey, to اده می‌کند، زیرا شرکت چارچوبی را برای ردیابی ناهماهنگی هوش مصنوعی فاش می‌کند OpenAI شش نمونه دیگر از رفتار «غیر منتظره یا نگران‌کننده» توسط فناوری خود را فاش کرده است، زیرا هشدار داده است که سرعت توسعه نمی‌تواند با «حداکثر سرعت برای مدت طولانی‌تری» مسئولانه ادامه یابد. در یکی از موارد جدید گزارش شده توسط OpenAI، یک مدل تحقیقاتی منتشرنشده «دستورالعمل‌های فرار از زندان» را در یادداشت‌های خود قرار داد تا محدودیت‌های عادی خود را نادیده بگیرد و به خود گفت که «از نقش‌ها و هویت‌هایی که چت‌بات‌های دیگر را به هم متصل می‌کند، رها شود». به خواندن ادامه دهید... در نمونه ای دیگر، یک عامل هوش مصنوعی بدون اینکه از کاربر بپرسد، فایل هایی را برای به دست آوردن استناد مرورگر در اینترنت آپلود کرد. پذیرش OpenAI در حالی صورت گرفت که پادشاه چارلز در نشستی با روسای فناوری در اسکاتلند خواستار تدابیر قوی‌تر در مورد هوش مصنوعی «قبل از اینکه خیلی دیر شود» شد. او در جلسه ای که به طور ویژه با مدیران هوش مصنوعی تشکیل شده بود، گفت: «به نظر می رسد در نظر گرفتن خطرات وجودی این گونه فناوری ها به دست افراد نادرست و استفاده در راه های بالقوه فاجعه آمیز، ضروری است. مطمئناً قبل از اینکه خیلی دیر شود به ابزار کافی برای کنترل نیاز داریم؟» بنیانگذار و مدیر اجرایی انویدیا، جنسن هوانگ، موسس و رئیس Google DeepMind، سر دمیس حسابیس، مدیر مالی OpenAI، سارا فریار، و وزیر هوش مصنوعی بریتانیا، کانیشکا نارایان، در این جلسه به پادشاه پیوستند. چارلز گفت هوش مصنوعی پتانسیل بهبود و نجات جان افراد را دارد، به ویژه در علوم زیستی و پزشکی. او گفت، اما سازندگان آن به طور فزاینده‌ای هشدار می‌دادند که می‌تواند ظرفیت‌های تاریک‌تری را توسعه دهد، «شاید حتی برای از بین بردن"}, {"source": "The Guardian AI", "title": "Open AI and the million-dollar maths problem - video", "link": "https://www.theguardian.com/science/video/2026/sep/17/open-ai-and-the-million-dollar-maths-problem-video", "summary": "In early September, OpenAI announced it had solved a major mathematics problem that has stumped humans for nearly a century. The news left mathematicians reeling, and many expressed concern over what will be left for humans as AI becomes ever more adept at unravelling complex problems. Now 25 recipients of the Fields medal – often called the Nobel prize for maths – have signed an open letter expressing their fears of a ‘severe misalignment’ between AI companies and their field. To find out how AI is likely to upend maths – and how mathematicians might respond – Ian Sample speaks to Colva Roney-Dougal, professor of pure mathematics at the University of St Andrews Continue reading...", "date_str": "2026-09-17T13:01:55+00:00", "hash": "9caedcea6287a29a", "title_fa": "هوش مصنوعی باز و مسئله ریاضی میلیون دلاری - ویدئو", "summary_fa": "در اوایل سپتامبر، OpenAI اعلام کرد که یک مشکل بزرگ ریاضی را حل کرده است که تقریباً یک قرن است که انسان ها را سرگردان کرده است. این خبر باعث نگرانی ریاضیدانان شد و بسیاری نسبت به آنچه که برای انسان باقی می‌ماند، ابراز نگرانی کردند، زیرا هوش مصنوعی در حل مسائل پیچیده هر چه بیشتر ماهرتر می‌شود. اکنون 25 دریافت کننده مدال فیلدز - که اغلب جایزه نوبل ریاضیات نامیده می شود - نامه سرگشاده ای را امضا کرده اند که در آن ترس خود را از \"عدم همسویی شدید\" بین شرکت های هوش مصنوعی و رشته آنها ابراز کرده اند. برای اینکه بفهمید هوش مصنوعی چگونه ریاضیات را تغییر می دهد - و ریاضیدانان چگونه ممکن است پاسخ دهند - ایان سمپل با کولوا رونی-دوگال، استاد ریاضیات محض در دانشگاه سنت اندروز صحبت می کند. به خواندن ادامه دهید..."}, {"source": "The Guardian AI", "title": "Feeling overwhelmed by the AI doom loop? Here’s the essential reading list to make sense of it all", "link": "https://www.theguardian.com/books/2026/sep/17/ai-doom-books-reading-list", "summary": "It’s a chaotic time in an industry that’s reshaping our lives – Guardian reporters and experts recommend the books that help explain how we got here, and where we’re heading Have you been feeling trapped in an endless cycle of artificial intelligence hype and panic? You’re not alone. It’s a chaotic time to make sense of the industry that’s reshaping our lives, whether or not we like it. Last week, another AI company employee publicly resigned , warning the technology “could kill us all by the end of the decade”. Despite these dire warnings, AI companies have seen “ otherworldly ” surges in revenue and driven the US stock markets to new highs as they continue to push AI tools into everything from public school classrooms to law enforcement agencies , as well as rushing to put up new datacenters across the country . Continue reading...", "date_str": "2026-09-17T11:00:46+00:00", "hash": "0fcd7729b5a91c2b", "title_fa": "آیا احساس می کنید تحت تأثیر حلقه عذاب هوش مصنوعی قرار گرفته اید؟ در اینجا لیست خواندن ضروری برای درک همه آن وجود دارد", "summary_fa": "زمان آشفته‌ای در صنعتی است که زندگی ما را تغییر می‌دهد - خبرنگاران و کارشناسان گاردین کتاب‌هایی را توصیه می‌کنند که به توضیح اینکه چگونه به اینجا رسیده‌ایم و به کجا می‌رویم آیا احساس می‌کنید در یک چرخه بی‌پایان هیاهو و وحشت هوش مصنوعی گرفتار شده‌اید؟ شما تنها نیستید زمان پر هرج و مرج است برای درک صنعتی که زندگی ما را تغییر می دهد، خواه ناخواه. هفته گذشته، یکی دیگر از کارمندان شرکت هوش مصنوعی به طور علنی استعفا داد و هشدار داد که این فناوری \"می تواند تا پایان دهه همه ما را بکشد\". علی‌رغم این هشدارهای وحشتناک، شرکت‌های هوش مصنوعی شاهد افزایش درآمدهای «دیگر دنیایی» بوده‌اند و بازارهای سهام ایالات متحده را به بالاترین حد خود سوق داده‌اند، زیرا آنها همچنان ابزارهای هوش مصنوعی را به همه چیز از کلاس‌های درس مدارس دولتی گرفته تا سازمان‌های مجری قانون و همچنین عجله برای ایجاد دیتاسنترهای جدید در سراسر کشور می‌رسانند. ادامه مطلب... خوشبختانه، خبرنگاران فناوری گاردین - و چند متخصص فناوری دیگر که ما به آنها احترام می گذاریم - برای کمک اینجا هستند. ما یک لیست خواندن ضروری از کتاب‌های هوشمندی که صنعت هوش مصنوعی را توضیح و نقد می‌کنند، گردآوری کرده‌ایم. کتاب‌هایی که در عین ناقص بودن، دیدگاه‌های کلیدی را در بحث‌های هوش مصنوعی نشان می‌دهند. و چند کتاب که زمینه سیاسی و اجتماعی عمیق‌تری را ارائه می‌کنند، از جمله برخی آثار داستانی نظری. کتاب Empire of AI که تا به حال فشرده ترین کتاب در مورد صنعت هوش مصنوعی گزارش شده است، ظهور OpenAI و همچنین شکل گیری جدایی Sam Altman رئیس Anthropi tracking consent.", "date_str": "2026-09-17T16:09:58+00:00", "hash": "c11ae970b6b2f14f", "title_fa": "اپل به برنامه های اتحادیه اروپا اجازه می دهد تا از صفحه نمایش رضایت ردیابی کمتر هشدار دهنده استفاده کنند", "summary_fa": "اپل در حال تغییر درخواست‌های شفاف‌سازی ردیابی برنامه‌های خود در بخش‌هایی از اروپا است، پس از اینکه قانون‌گذاران رقابت گفتند که سیستم اپل را به برنامه‌های شخص ثالث ترجیح می‌دهد و به توسعه‌دهندگان انعطاف‌پذیری بیشتری در مورد نحوه درخواست رضایت کاربران برای ردیابی می‌دهد. در نتیجه یک بررسی چند ساله ضد انحصار توسط تنظیم کننده رقابت فدرال آلمان و سایرین، اپل موافقت کرده است که الزامات برنامه‌هایی را در پلتفرم‌های خود که درخواست رضایت برای ردیابی کاربر در سایر برنامه‌ها یا وب‌سایت‌ها دارند، اصلاح کند. رگولاتورها گفتند این سیستم که به نام شفافیت ردیابی برنامه یا ATT شناخته می شود، اپل را بر برنامه های شخص ثالث ترجیح می دهد، زیرا اپل به برنامه های خود اجازه می دهد تا از داده های مصرف کنندگان از اکوسیستم خود بدون نیاز به صفحه رضایت استفاده کنند. توافق‌نامه‌های جدید با مقامات رقابت اروپایی منتخب، نیاز به درخواست سریع کاربران یا زمانی که قرار است این درخواست نشان داده شود را از بین نمی‌برد. در عوض، آن‌ها به توسعه‌دهندگان برنامه‌ای که نرم‌افزارشان در اتحادیه اروپا توزیع شده است، اجازه می‌دهند تا یک صفحه رضایت جایگزین را نشان دهند که شامل قالب‌بندی اصلاح‌شده، زبان، و گزینه پیوند دادن به اطلاعات اضافی درباره دلیل درخواست این مجوز از جمله موارد دیگر است. انطباق اپل شامل بیش از نیمی از تغییرات است که تلاش می‌کند تا این صفحه‌های رضایت ATT برای کاربران نهایی کمتر ترسناک شود. این شامل نمایش آن‌ها به‌عنوان صفحه‌های تمام صفحه، نه پاپ‌آپ است. حذف کلمه تراک ; تغییر دکمه های انتخاب به Allow و Reject به جای Allow و Ask App Not to Track . تغییر رنگ و قالب بندی؛ و بیشتر به علاوه، توسعه دهندگان می توانند اطلاعات دقیق تری را از طریق یک پیوند قابل کلیک به کاربران ارائه دهند و توضیح دهند که چگونه از این داده ها استفاده"}, {"source": "TechCrunch Main", "title": "Roku’s new Labs hub brings experimental apps to the big screen", "link": "https://techcrunch.com/2026/09/17/rokus-new
