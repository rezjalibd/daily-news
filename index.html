<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۳ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۳ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۵ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۶</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۸</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۸</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

n his 60s and the couple has two young kids. Courtesy of the author Especially when it came to the big life decisions , including having children, we had those conversations before we even got engaged. I knew exactly how old he was. I knew there would be things about growing older together that would be different for us. But I guess there's a big difference between being aware of something that could eventually happen and actually living it. Our age difference has been showing up in more ways than one lately, and there's a part of me that's angry with myself for being surprised by it. It's not like my husband was always going to be the 48-year-old I met when I was 25. I knew he would age. I knew things would change as he got older. I knew there would eventually be a point when the difference between us became more noticeable. I just don't think I ever wanted to admit to myself exactly how much. He's in his 60s now I knew he was going to be an older father. I knew all of this. But knowing something and seeing it firsthand are two very different things. Lately, I've seen just how much his 61 years are catching up to him, and it's been putting me ", "date_str": "2026-10-24T14:36:01+00:00", "hash": "e546110d96bcce94", "title_fa": "من 38 ساله هستم و احساس می کنم زندگی ام در حال افزایش است. شوهر 61 ساله من می خواهد سرعتش را کم کند.", "summary_fa": "نویسنده و همسرش 23 سال فاصله سنی دارند. با حسن نیت از کارولین چیریچلا شوهر من 23 سال از من بزرگتر است، اما تفاوت سنی ما قبلاً هرگز مرا آزار نمی داد. اکنون که او 61 ساله است و ما دو فرزند جوان را بزرگ می کنیم، متوجه سطوح مختلف انرژی خود هستم. من عاشق زندگی مشترکمان هستم، اما با واقعیت های فاصله سنی خود دست و پنجه نرم می کنم. وقتی من و شوهرم برای اولین بار در سال 2014 با هم آشنا شدیم، چیزی را داشتیم که خیلی ها آن را یک عاشقانه طوفانی می دانستند. ما با هم آشنا شدیم، تقریباً بلافاصله عاشق هم شدیم، پس از یک سال با هم نقل مکان کردیم، شش ماه بعد نامزد کردیم، یک ماه بعد ازدواج کردیم و کمی بیش از یک سال بعد، به اولین فرزندمان خوش آمد گف ow-you quizzes for the committee that we hoped to be paired as Big and Little sisters. We were, and the rest is history. Our college days were constantly filled with plans together, and by graduation, we couldn't imagine embarking on this next phase of adulthood with over 180 miles between us. She's from the Boston area, while I'm from Connecticut and moved to New York City right after college. So, we agreed to prioritize our friendship and made a pact to spend time together in person every year. Since graduating in 2015, we've planned a getaway together every summer. Our trips haven't always looked the same, but they have some constants Distance has never kept us apart because we didn t let it. Alexa Mellardo Right out of college, Lisa and I looked forward to a few sun-drenched days spent catching up on Long Beach Island, New Jersey. From the Victoria Guest House to the Engleside Inn, we'd book a charming yet affordable place steps away from the beach to spend long days working on our tans, cranking up the tunes, and sipping spiked seltzers. At night, we'd head out for bar hopping and dancing to live music until the wee hours of the morning. The next day, we would rinse and repeat. We initially chose the Jersey Shore because it's an easy ride to perfect summer weather and beautiful beaches. It became our go-to place, though we now switch up locations every now and then. No matter where we go, I know we ll have a good time. Alexa Mellardo Fast-forward to more than a decade after graduating from college, and our summer tradition is still going strong — but it looks quite different. For this year's getaway, we stayed in a charming room at Greydon House in downtown ", "date_str": "2026-10-24T14:28:01+00:00", "hash": "6c8367fe21e4a8ce", "title_fa": "من و بهترین دوستم از زمان دانشگاه هر سال با هم سفر می کنیم. محل های فرار ما اکنون بسیار متفاوت به نظر می رسد.", "summary_fa": "اگرچه سفرهای ما از سرگرمی و وحشیانه در دهه 20 سالگی به سرگرمی و آرامش در اوایل 30 سالگی تبدیل شده است، ما همیشه هیجان زده هستیم که این زمان خاص را با هم بگذرانیم. الکسا ملاردو پس از کالج، بهترین دوستم و من متعهد شدیم که هر سال با هم به یک سفر برویم. این یک راه عالی برای ارتباط ماندن و ایجاد خاطرات جدید بوده است، حتی با تغییر زندگی ما. سفرهای ما در دهه 30 زندگی ما آرام تر از 20 سالگی است، اما همه آنها فوق العاده بوده اند. من کاملاً معتقدم که در این دنیا افرادی هستند که قرار است آنها را ملاقات کنید و برای همیشه در زندگی خود داشته باشید. برای من، یکی از این افراد خواهرخوانده من، لیزا، خواهر کوچکم است. بعد از اینکه در طول سال دوم استخدام در مورد چیزهای زیادی با هم صحبت کردیم - از جمله عشق مشترک ما به Blink-182 و پانک راک - هر دو ناخودآگاه در آزمون های آشنایی با شما برای کمیته ای که امیدوار بودیم به عنوان خواهران بزرگ و کوچک جفت شویم، یادداشت کردیم. ما بودیم و بقیه اش تاریخ است. روزهای دانشگاهی ما دائماً پر از برنامه‌های مشترک بود، و با فارغ‌التحصیلی، نمی‌توانستیم تصور کنیم که مرحله بعدی بزرگسالی را با بیش از 180 مایل بین ما آغاز کنیم. او اهل منطقه بوستون است، در حالی که من از کانکتیکات هستم و بلافاصله بعد از کالج به شهر نیویورک نقل مکان کردم. بنابراین، ما توافق کردیم که دوستی خود را در اولویت قرار دهیم و پیمان بستیم که هر سال زمانی را به صورت حضوری با هم بگذرانیم. از زمانی که در سال 2015 فارغ التحصیل شدیم، هر تابستان یک دور با هم برنامه ریزی کرده ایم. سفرهای ما همیشه یکسان به نظر نمی‌رسیدند، اما ثابت‌هایی دارند که فاصله هرگز ما", "image_url": "https://i.insider.com/6ad7d5f9e50b02f612be568d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آبان • ۱۷:۵۸"}, {"source": "Business Insider", "title": "The AI data center boom has a ghost problem", "link": "https://www.businessinsider.com/ai-data-center-boom-ghost-projects-bragawatts", "summary": "Halloween ghosts on a Silicon Valley lawn. Alistair Barr/Business Insider A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . The AI data center boom looks like it's running into serious trouble. Projects are being delayed, canceled, or abandoned. Electricity shortages are holding everything up. But there's a twist: A lot of these data centers were probably never going to get built in the first place. Bernstein Research analyzed thousands of planned US data centers and concluded that only about 35% of the announced capacity is likely to become reality. The industry has a wonderful name for some of the more dubious projects: \" Bragawatts .\" These are enormous data centers announced by companies that often have little experience building them. Some haven't secured electricity, construction permits, or even customers. Then there are the \"ghost projects.\" Developers submit multiple requests for electricity connections, hoping at least one location works out. In Texas, these requests have reached more than five times the state's existing electricity supply. No wonder the grid looks overwhelmed. This doesn't mean the AI boom is fake. Far from it. My colleague Eugene Kim exclusively reported this week that even Amazon, one of the world's most experienced data center builders, is struggling to get enough electricity to power its expensive AI equipment . But there's a big difference between Amazon's very real problems and an inexperienced developer announcing a gigantic project that may never happen. The AI data center boom is real, and so are the challenges of building all these facilities. But the sheer number of speculative projects may be making those challenges look bigger than they truly are. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-10-24T14:00:01+00:00", "hash": "1fb655fa0faad7cc", "title_fa": "رونق مرکز داده هوش مصنوعی یک مشکل ارواح دارد", "summary_fa": "", "image_url": "https://i.insider.com/6adbb9828e95884e1ca82cab?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۲ آبان • ۱۷:۳۰"}],
      media: [{"source": "Billboard", "title": "Anthropic Sued For Stealing Elvis Presley Music to Train AI: ‘Deeply Protective of These Iconic Songs’", "link": "https://www.billboard.com/pro/elvis-presley-estate-sues-suno-anthropic/", "summary": "The owners of Elvis Presley s music have launched a legal war over artificial intelligence, suing AI giant Anthropic over accusations that it trained its models on hundreds of the legendary artist’s song without permission. The new lawsuit, filed Friday (Oct. 23) and first reported by Billboard , claims that Anthropic, the tech behemoth behind Claude, infringed 274 of the rock legend s copyrighted songs, including famed hits like “Can’t Help Falling in Love, “A Little Less Conversation” and “Don’t Be Cruel.” Related Taylor Swift Files to Trademark Her Voice and Image as AI Deepfakes Grow Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit The Elvis Plaintiffs bring this action to enforce these exclusive rights against the defendant that has built its entire business model based on copyright infringement at a scale never seen before, writes Richard Busch , the lead attorney behind the lawsuit. The Elvis Plaintiffs are deeply protective of these iconic songs. Though music companies like Universal Music Group have already repeatedly sued AI companies for stealing their IP, the new lawsuits represents by far the most high-profile legal action filed on behalf of an individual musician — in this case, arguably the most famous recording artist of all time. The case was filed by a unit of Authentic Brands Group, the licensing giant that largely controls the intellectual property rights to Elvis, including much of his song catalog, his brand trademarks and the rights to his name, image and likeness. It was co-filed by various other entities that own Elvis rights. Like other AI firms, Anthropic is already facing numerous lawsuits over the process of “training” their models to create new ones, which involves ingesting millions of existing works without permission. AI companies say that process is protected by copyright s fair use defense, but that issue remains pending across dozens of lawsuits with billions of dollars in potential damages at stake. Litigation over AI music has centered more on Suno, the leading AI song generator, which was sued in 2024 by all three major music companies over such training accusations. It eventually settled with Warner Music Group last year and has vowed to partner with the music industry, but is still facing contentious litigation from UMG and Sony Music. Anthropic, a far larger AI firm, has faced similar cases across creative industries, i", "date_str": "2026-10-24T14:34:54+00:00", "hash": "780f0c6501d30dba", "title_fa": "شکایت از آنتروپیک برای دزدیدن موسیقی الویس پریسلی برای آموزش هوش مصنوعی: «از این آهنگ‌های نمادین محافظت عمیق»", "summary_fa": "صاحبان موسیقی الویس پریسلی یک جنگ حقوقی را بر سر هوش مصنوعی به راه انداخته‌اند و از غول هوش مصنوعی Anthropic شکایت کرده‌اند که مدل‌هایش را بدون اجازه صدها آهنگ این هنرمند افسانه‌ای را آموزش داده است. شکایت جدید، که روز جمعه (اکتبر. 23) و اولین بار توسط بیلبورد گزارش شد، ادعا می‌کند که آنتروپیک، غول تکنولوژی پشت کلود، 274 آهنگ دارای حق چاپ این افسانه راک، از جمله آهنگ‌های معروفی مانند «Can’t Help Falling in Love»، «A Little Less Conversation» و «Don’t Be Cruel» را نقض کرده است. فایل‌های مربوط به تیلور سویفت برای علامت تجاری صدا و تصویرش در حالی که AI Deepfakes رشد می‌کند دیدی از زندان نیوجرسی به مرکز مشابهی در پنسیلوانیا ویزر منتقل شد تا جایزه Legend of Live را در اجلاس موسیقی زنده بیلبورد 2026 دریافت کند. شاکیان الویس این حقوق انحصاری را بر اساس تمام کپی‌رایت خود ساخته است که این حقوق انحصاری را در برابر تمام کپی رایت خود ارائه کرده است. ریچارد بوش، وکیل اصلی این شکایت، می نویسد: نقض در مقیاسی که قبلاً دیده نشده بود. شاکیان الویس عمیقاً از این آهنگ های نمادین محافظت می کنند. اگرچه شرکت‌های موسیقی مانند گروه موسیقی یونیورسال قبلاً بارها از شرکت‌های هوش مصنوعی به دلیل سرقت IP آنها شکایت کرده‌اند، شکایت‌های جدید تا حد زیادی نمایانگر برجسته‌ترین اقدام حقوقی است که از طرف یک نوازنده - در این مورد، مسلماً مشهورترین هنرمند ضبط تمام دوران است. این پرونده توسط واحدی از Authentic Brands Group، غول صدور مجوز که تا حد زیادی حقوق مالکیت معنوی الویس، از جمله بسیاری از کاتالوگ آهنگ های او، علائم تجاری برند و حقوق نام، تصویر و شباهت او را کنترل می کند، تشکیل شده است. این توسط نهادهای مختلف دیگری که حقوق الویس را در اختیار دارند، بایگانی شده است. مانند سایر شرکت‌های هوش مصنوعی، آنتروپیک در حال", "image_url": "https://www.billboard.com/wp-content/uploads/2024/05/elvis-presley-tour-1972-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "موسیقی"], "datetime_fa": "۲ آبان • ۱۸:۰۴"}, {"source": "Billboard", "title": "Maluma Opens Up About Therapy and Finding Balance at Billboard Latin Music Week & More Uplifting Moments", "link": "https://www.billboard.com/music/latin/maluma-betterhelp-latin-music-week-2026-uplifting-moments-1236367482/", "summary": "From career milestones to new music releases to major announcements and those little important moments, Billboard editors highlight uplifting moments in Latin music. Here’s what happened in the Latin music world this week. Maluma on Mental Health, Fatherhood and Learning to Love Discomfort Maluma spoke candidly about therapy, anxiety, fatherhood and the challenge of balancing family life with a demanding career during the “Like Minded” conversation at Billboard Latin Music Week on Wednesday (Oct. 21). Moderated by Billboard ’s co-chief content officer Leila Cobo, the BetterHelp-presented session also featured bilingual therapist Patricia Arrieta. The conversation came shortly after the birth of Maluma’s second child, Orion, whom he said has brought him a new sense of calm and clarity. “I’ve finally been able to find that balance between my personal life and my artistic career,” he said. The Colombian star described th     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
