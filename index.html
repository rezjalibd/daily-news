یم که آنها در سراسر مجموعه استعدادهای باورنکردنی که صنعت موسیقی است ارائه می دهند.\" ما 50 سال است که به خاطر آن استخر، از تولیدکنندگان و مهندسان گرفته تا نجارها و دکل ها، ضبط و تور می کنیم. «افراد سال» نمی‌تواند عنوان بهتری باشد، زیرا افرادی هستند که ما خیلی خوش شانس بوده‌ایم که با آنها کار کنیم، و البته مخاطبان رام نشدنی ما، که به ما این فرصت را داده‌اند که به ساختن موسیقی ادامه دهیم و به چیزهایی که واقعاً به آنها اهمیت می‌دهیم تکان بخوریم. این یک افتخار است، و ما بسیار هیجان زده هستیم که در ردیف اول اولین کنسرت U2 خود قرار می گیریم... می دانیم که از ما پیشی گرفته ایم.\" ترزا ولترز، مدیر اجرایی MusiCares، اضافه کرد: \"U2 در طول زندگی حرفه‌ای خود، قدرت خارق‌العاده موسیقی را برای گرد هم آوردن مردم، جلب توجه به نیازهای فوری و الهام بخشیدن به اقدامات نشان داده است.\" U2 امسال مشغول بوده اند، دو EP جدید منتشر کرده اند، Pogues را پوشش می دهند و آهنگی از آلبوم استودیویی آینده خود را که هنوز عنوان نشده است، به نمایش گذاشته اند."}, {"source": "Pitchfork", "title": "Geese Finally Respond to “Psyop” Allegations", "link": "https://pitchfork.com/story/geese-finally-respond-to-psyop-allegations/", "summary": "“We marched up to our label over email…. like, ‘How long have all our fuckin’ fans been fake, you sons of bitches?’” says Cameron Winter", "date_str": "2026-09-10T15:50:19+00:00", "hash": "fc2a5900488ba7ec", "title_fa": "غازها سرانجام به اتهامات \"روانی\" پاسخ می دهند", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان غازها، احساسات راک مستقلی که سال گذشته انتشار آنها به یک کمپین اخترگردی متهم شد، پیامدهای ارتباط خود با آژانس بازاریابی دیجیتال Chaotic Good را بررسی کرده اند. به نظر نمی‌رسد آن‌ها از روایتی که گفته می‌شود طرفداران قلابی باعث افزایش استراتوسفر گروه در پشت Getting Killed شده‌اند، ناراحت نیستند. کامرون وینتر در کاور جدیدی با رولینگ استون با خنده گفت: «من هم همین فکر را کردم، واقعاً انجام دادم. به نظر می‌رسید که این یک توضیح معقول است.» او ادامه داد: «ما درست مثل این بودیم که «اوه، خدای من. همه چیز لعنتی ساختگی است.» ما در ن سالم به در نبردند. برخی از داوطلبان، مانند من، جای دیگری برای رفتن نداشتند: آپارتمان من در خیابان جان تنها چهار یا پنج بلوک با مرکز تجارت جهانی فاصله دارد، و من نمی دانستم خانه ای برای بازگشت من باقی مانده است یا خیر. دیگران، مانند دوست دخترم، کت، تمام روز را برای اهدای خون به پیاده‌رو می‌کوبیدند، در صف O-positive در بیمارستان سنت وینسنت در وست ویلج منتظر بودند، اما مثل بقیه روی‌گردان شدند. ما باید کاری را به خوبی انجام می‌دادیم، باید کاری برای انجام دادن وجود داشت. من و کت در حوالی پنج به اسکله چلسی رسیدیم و به جک پات رسیدیم. نه، آنها اهدای خون نداشتند، اما یک گروه بیست نفره از داوطلبان را انتخاب کردند و به ما شغل دادند. ما مأمور شدیم که بیماران را به داخل OR اسکورت کنیم، که کت آن را به‌عنوان صحنه‌ی صوتی تشخیص داد که در آن قانون و نظم فیلمبرداری می‌کنند. زنی با مگافون به ما یک درس سریع در مورد اسکورت بیماران داد: وقتی آنها می رسیدند، ما اطلاعات شخصی آنها، از جمله هرگونه آلرژی یا بیماری مزمن و مذهب آنها را دریافت می کردیم. ما با آنها از آمبولانس به اتاق سبز (جراحات جزئی)، اتاق زرد (جراحات جدی) یا اتاق قرمز (نزدیک به مرگ) راه می‌رفتیم. ما به نرده تکیه دادیم در حالی که زنی که مگافون را"}, {"source": "Rolling Stone", "title": "Here Are 8 TV Programs Commemorating 9/11 — and How to Watch Them", "link": "https://www.rollingstone.com/product-recommendations/streaming/9-11-anniversary-tv-programs-where-to-stream-online-1235624929/", "summary": "These TV specials and shows remember the terror attacks 25 years later, through live tributes and documentary investigations", "date_str": "2026-09-11T12:04:00+00:00", "hash": "a65ac3335c961493", "title_fa": "در اینجا 8 برنامه تلویزیونی به یادبود 11 سپتامبر وجود دارد - و نحوه تماشای آنها", "summary_fa": "اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، رولینگ استون ممکن است کمیسیون وابسته دریافت کند. 25 سال از حملات تروریستی 11 سپتامبر 2001 می گذرد که سالگرد مهمی برای یکی از بدترین تراژدی های کشورمان است. برای یادآوری روز سیاه، اکثر شبکه‌های بزرگ تلویزیونی در چند هفته اخیر برنامه‌های ویژه منتشر کرده‌اند و سایر شبکه‌های تلویزیونی برنامه‌های یادبود خود را جمعه یازدهم اجرا می‌کنند. از جمله این پوشش ویژه می توان به ABC s 9/11 Tribute in Light: Live From Lower Manhattan و 9/11 Reunited، History Channel s 102 Minutes Inside the Towers، CBS Daughters of 9/11، و برنامه های ویژه تمام روز در فاکس نیوز اشاره کرد. اگر به دنبال پیوستن به روز ملی یادبود با تنظیم یک یا چند مورد از ویژه برنامه های تلویزیونی 11 سپتامبر هستید، ادامه مطلب را بخوانید. در زیر چندین برنامه برتر، از جمله گزینه‌های زنده و درخواستی، به‌علاوه جزئیاتی در مورد مکان پخش همه آن‌ها در امروز آمده است. ساعت 8 شب ET امشب، ABC از نصب Tribute in Light در Ground Zero در شهر نیویورک، که از سال 2002 هر سال در 11 سپتامبر به نمایش گذاشته شده است، پخش زنده خواهد شد. جریان 9/11 Tribute in Light: Live From Lower Manhattan به صورت زنده در DirecTV یا Fubo. ABC همچنین یک ویژه با نام 9/11: United We Stand 25 Years Later در سپتامبر منتشر کرد. 1، و در 11 سپتامبر در شبکه نمایش داده خواهد شد. این ویژه دو ساعته به میزبانی مایکل استراهان به بررسی چگونگی استفاده آمریکایی ها از ورزش، موسیقی، تئاتر و کمدی برای بهبودی پس از حملات می پردازد. پخش جریانی 11/9: United We Stand 25 Years After Encore ABC با DirecTV یا Fubo، یا آن را در صورت تقاضا در Disney+"}, {"source": "Rolling Stone", "title": "Mick Jagger, Yoko Ono, Lou Reed and More Talk About 9/11 Devastation", "link": "https://www.rollingstone.com/music/music-lists/9-11-mick-jagger-yoko-ono-lou-reed-1235623963/", "summary": "In the weeks after the attacks, artists reflected on how their lives have already changed", "date_str": "2026-09-11T12:00:00+00:00", "hash": "b0c6df03293e3e3f", "title_fa": "میک جگر، یوکو اونو، لو رید و دیگران درباره ویرانی 11 سپتامبر صحبت می کنند", "summary_fa": "در 25 اکتبر 2001، هفته‌ها پس از حملات تروریستی 11 سپتامبر، رولینگ استون یک شماره ویژه را تهیه کرد که مستقیماً از Ground Zero و در سراسر جهان داستان‌هایی را روایت می‌کرد. بازتاب هایی را از هنرمندانی که هنوز در حال پردازش اخبار بودند جمع آوری کردیم. یوکو اونو در مورد آنچه جان لنون از آن ساخته و امیدهایش برای صلح صحبت کرد. آلانیس موریست شوک ناشی از اطلاع از این حملات را توضیح داد. و میک جگر به یاد آورد که تلاش ناامیدانه ای برای رسیدن به دخترش در شهر نیویورک داشت. من در حالت شوک بودم، زیرا [دخترم] الیزابت حدود پانزده بلوک آنطرفتر زندگی می کند. ما نتوانستیم عبور کنیم عصر از طریق آفریقای جنوبی رد شدیم که واقعاً عجیب بود. آنچه من از بسیاری از دوستان آمریکایی ام احساس می کنم، اگرچه واقعاً نمی توانند آن را در قالب کلمات بیان کنند، یک احساس نقض است. شکستن این احساس چیز وحشتناکی است - اینکه آمریکا جایی بود که همه آنها احساس امنیت می کردند. ما در سی سال گذشته [در انگلستان] با آن زندگی کرده‌ایم – افرادی که بمب‌ها را در میخانه‌ها و مراکز خرید، جایی که افراد بی‌گناه بودند، پرتاب می‌کردند. من در چندین موقعیت بوده ام که این اتفاق افتاده است، جایی که صدای انفجار بمب را می شنوید. خیلی ترسناک بود با تروریسم، چه پنج نفر را بکشید و چه 5000 نفر، باز هم بی اعتنایی به ارزش های عادی انسانی است، چیزی که در یک جامعه متمدن انتظار دارید. من هرگز به خشونت به عنوان راهی برای دستیابی به اهداف سیاسی که در آهنگ هایی مانند «مرد مبارز خیابانی» اشاره کردیم، اعتقاد نداشتم. افرادی که به آن اعتقاد دارند - من هیچ زمانی برای آنها ندارم، هیچ زمانی برای تصورات عاشقانه ای که آنها را احاطه کرده است. من در آغاز این در"}, {"source": "Rolling Stone", "title": "On 9/11, My Neighborhood Vanished", "link": "https://www.rollingstone.com/culture/culture-features/9-11-kurt-loder-mtv-my-neighborhood-vanished-1235623062/", "summary": "MTV News anchor Kurt Loder was living in TriBeCa, three blocks from the World Trade Center, when he was awakened by the first explosion", "date_str": "2026-09-11T11:55:00+00:00", "hash": "3c74ec1fd80822df", "title_fa": "در 11 سپتامبر، محله من ناپدید شد", "summary_fa": "مقاله زیر در شماره 25 اکتبر 2001 رولینگ استون منتشر شد. حدس می‌زنم که محله کوچکم در مرکز شهر را بیشتر از آنچه تصور می‌کردم دوست داشتم. کافه های روباز در امتداد غرب برادوی. گردشگاه پر از چمن در امتداد رودخانه هادسون. خیابان‌های فرعی سنگ‌فرش‌شده، اغذیه‌فروشی‌های کره‌ای تمام‌شب، کتاب‌فروشی بزرگ مرزی، تنها پنج دقیقه پیاده‌روی پایین‌تر از خیابان چرچ، جایی که من صبح‌های زیادی را در قفسه‌ها نگاه می‌کردم. و البته، آپارتمانی که در ده سال گذشته در آن زندگی کرده‌ام، تنها سه بلوک با برج‌های ابری مرکز تجارت جهانی فاصله دارد. برخی از اینها اکنون برای همیشه از بین رفته است. بقیه هرگز دوباره مثل قبل نخواهند بود. فکر می کنم مانند بسیاری از افراد محلی دیگر، کمی قبل از ساعت 9 صبح روز 11 سپتامبر، با موشکی که حتی بر اساس استانداردهای غم انگیز نیویورک هم لرزان بود، از رختخواب بیرون آمدم. وقتی به سمت خیابان رفتیم، من و دوست دخترم دیدیم که دود در آسمان جنوب، در همان نزدیکی پر شده است، و گره هایی از مردم متحیر شروع به تشکیل در گوشه های پایین کردند. فقط آتش بود؟ لوله گاز منفجر شده؟ چی؟ سپس انفجار دیگری صحنه را تکان داد و ناگهان کلمه ای غیرقابل تصور در هوا پخش شد: تروریست ها. وقتی به آپارتمان برگشتم تا دو سگمان را جمع کنیم، صدای هرج و مرج و فاجعه را می شنیدم که صدای آژیرها و فریادهای بیرون بلند می شد و صدای خس خس وحشتناک چیزی که به طرز غیرقابل تصوری در حال فرو ریختن بود. پشت در خیابان، پلیس و آتش نشانان همه جا حضور داشتند. مردم با وحشت افسارگسیخته از خیابان گرینویچ فرار می کردند. خودم را به دیوار ساختمانی چسباندم و به برج‌های دوقلوی مرکز تجارت جهانی، آشناترین و غالب‌ترین منظره محله، خیره شدم. یکی از آنها به طرز حیرت آور، غیرممکنی رفته"}, {"source": "Hollywood Reporter", "title": "Cynthia Erivo’s First Film Since ‘Wicked’ Required Her to Go Dark, Deep and Fearless: “I’d Feel Sick and Angry”", "link": "https://www.hollywoodreporter.com/movies/movie-features/cynthia-erivo-prima-facie-tiff-exclusive-1236697306/", "summary": "The two-time Oscar nominee found safety and support in the making of ‘Prima Facie,’ which offers an unflinching look at the aftermath of sexual assault. In her first interview about the film, she explains, “I would go too far and it would be hard to come back.”", "date_str": "2026-09-11T14:00:00+00:00", "hash": "6d84e207b0be140f", "title_fa": "اولین فیلم سینتیا اریوو پس از «شرور» که او را مجبور به تاریکی، عمیق و نترس می‌کرد: «احساس بیماری و عصبانیت می‌کردم»", "summary_fa": "هیچ راه آسانی برای آماده شدن برای پروژه ای مانند Prima Facie وجود ندارد. سینتیا اریوو، دو بار نامزد اسکار و برنده تونی، از تجربه چندین ساله فیلمبرداری و تبلیغ پشت سر هم فیلم های Wicked بیرون آمد. او موافقت کرد که در نقشی قدم بگذارد که از نظر روحی و جسمی، با موادی که تکان دادن آنها دشوار است، از او خیلی بیشتر بهره می برد. وقتی وارد تولید شد، او به ابزارهایی تکیه کرد که در دوران حرفه‌ای آراسته‌اش به کار گرفته شده بود تا بتواند آماده باشد تا آنجا که می‌توانم و من نیاز داشتم، تا داستان را تا جایی که ممکن است کامل بگویم. داستان‌های مرتبط فیلم‌های Man in Motion: The Rick Hansen Story Doc بینندگان را به دهه 1980 برمی‌گرداند سفر با صندلی چرخدار: این فیلم‌های دیوانه‌کننده ساخته شده است تورنتو: تهیه‌کنندگان رسانه‌های جهانی از قوانین محتوای محلی قوی‌تر برای جلوگیری از سلطه‌ی جریانی درخواست می‌کنند. مطمئن باشید که هر زمان که لازم بود به آنها ضربه زدم. فیلم Prima Facie که یکشنبه در جشنواره بین‌المللی فیلم تورنتو نمایش داده می‌شود، توسط سوزی میلر از نمایشنامه تحسین‌شده‌اش به همین نام اقتباس شده است. داستان در مورد تسا (اریوو)، وکیل دادگستری در لندن است که به عنوان یک مدافع پولادین و حیله گر از مردان متهم به تجاوز جنسی نامی برای خود دست و پا کرده است. تصورات او از عدالت و قانون در واقع، در مورد احساس او از خود، زمانی که خود توسط جولیان (دانیل اینگز)، همکار و دوست پسرش که از یک پس زمینه نسبتاً ممتاز است، مورد تعرض قرار می گیرد، تغییر می کند. تولید صحنه اصلی با بازی جودی کامر و تنها جودی کامر در نمایش انفرادی برنده تونی و اولیویه در برادوی و وست اند."}, {"source": "Hollywood Reporter", "title": "‘Man in Motion: The Rick Hansen Story’ Doc Takes Viewers Back to 1980s Globe-Circling Wheelchair Trek: “It’s Just Insane”", "link": "https://www.hollywoodreporter.com/movies/movie-news/man-in-motion-rick-hansen-1236694451/", "summary": "Director Adrian Buitenhuis explores the extremes of a paraplegic athlete pushing himself to the limits of human endurance in a visceral film set for a Toronto Film Fest world premiere.", "date_str": "2026-09-11T13:30:00+00:00", "hash": "df3ec69dc3f07382", "title_fa": "مستند «مردی در حرکت: داستان ریک هنسن» بینندگان را به سفر با صندلی چرخدار در چرخش کره زمین در دهه 1980 می برد: «این فقط دیوانه است»", "summary_fa": "داستان ورزشکار کانادایی تبدیل به فعال معلولیت، ریک هنسن، در حال حرکت با ویلچر خود به 40075 کیلومتر در سراسر جهان در تور Man in Motion در سال 1984 برای جمع‌آوری پول و آگاهی برای آسیب‌های نخاعی، قبلاً یک افسانه است. اما تصور یک مستند با داستانی ناگفته نشان می‌دهد که چهل سال پیش دنیا چیزهای زیادی را نمی‌دید. و آدریان بویتنهویس کارگردان و دریک موری تهیه‌کننده، با فیلم Man in Motion: The Rick Hansen Story، تهیه‌کنندگی رایان رینولدز و حداکثر تلاش، به مجموعه‌ای از خاطرات صوتی خصوصی ضبط شده توسط هانسن در سن 27 سالگی و فلج شدن از کمر به پایین، و هرگز دیده نشده از فیلم‌های تهیه‌کننده موسیقی، دیوید، اشاره می‌کنند. همه اینها بر تصمیم آنها برای نگاهی به پشت صحنه یک سفر طاقت فرسا 26 ماهه با ویلچر با حال و هوای Free Solo تاکید می کند. داستان‌های مرتبط فیلم‌ها تورنتو: تهیه‌کنندگان رسانه‌های جهانی قوانین محتوای محلی قوی‌تری را برای جلوگیری از فیلم‌های سلطه‌ی جریانی درخواست می‌کنند تورنتو: جاستین ترودو نخست‌وزیر سابق فیلم و بنر تولید تلویزیون را راه‌اندازی می‌کند. بویتنهویس به هالیوود ریپورتر در مورد تبدیل مصیبت به تصادف کامیون در سن 15 سالگی که هنسن را از کمر به پایین فلج کرد، به هالیوود ریپورتر می گوید که من فکر نمی کنم رسانه ها در ابتدا بتوانند آن را به تصویر بکشند، چالش ها و چالش های زیادی وجود دارد. آنچه در این دوره از فیلم مستند Man in Motion به پایان می رسد، داستان عاشقانه ای است که در تور جهانی بین هانسن و فیزیوتراپیستش آماندا رید، که به دور از تابش خیره کننده رسانه ها، دوست دختر او شد، حتی در حالی که به سختی از موانع بی پایان برای حفظ استقامت روحی و جسمی خود عبور می کرد، رشد کرد. داستان عشق آنها در طول این دو سال، دو ماه و"}, {"source": "Hollywood Reporter", "title": "Freeze Turkey! 50 Years Later, the Wild True Story Behind ‘Charlie’s Angels‘", "link": "https://www.hollywoodreporter.com/movies/movie-features/charlies-angels-50th-anniversary-1236694163/", "summary": "The behind-the-scenes betrayals. The casting chaos. The simmering resentments. The itsy-bitsy bikinis. Turns out the set of this 70s TV phenomenon wasn't always heaven.", "date_str": "2026-09-11T13:00:00+00:00", "hash": "e8b1ab07d7137d7f", "title_fa": "ترکیه را منجمد کنید! 50 سال بعد، داستان واقعی وحشی پشت \"فرشتگان چارلی\"", "summary_fa": "روزی روزگاری سه دختر کوچک بودند که دو تا از تگزاس و دیگری از آلاباما برای معروف شدن به هالیوود آمدند. و در ابتدا به هر یک از آنها نقش های بسیار جذابی اختصاص داده شد، از جمله یک روح ناگفته در یک سریال صابون خون آشام و یک زن پیشرو در تبلیغات کرم موبر و شامپو. اما بعد از آن یک تهیه کننده آمد که آنها را از همه اینها دور کرد و آنها رفتند تا برای او کار کنند. از اولین نمایش آن در سپتامبر. 22، 1976، فرشتگان چارلی یک پدیده بود که در اوج خود 40 میلیون بیننده یک قسمت را جذب کرد، حتی در آن زمان، حتی برای یک برنامه اسپلینگ آرون. عقیده کلی این بود که مردان بیکینی و شورت کوتاه را تنظیم می‌کردند، به‌ویژه زمانی که فارا فاست، ستاره برجسته، آن‌ها را پوشیده بود در حالی که زنان مراقب لباس‌های دیگر بودند. حتی ممکن است عده ای آن را فقط برای دنبال کردن تکالیف مخفی حواس پرت فرشتگان روشن کرده باشند. مثل زمانی که در یک رولر دربی نفوذ کردند. یا زمانی که آنها به یک تیم تشویق کننده حرفه ای فوتبال نفوذ کردند. یا مسابقه زیبایی یا زندان یک زن داستان‌های مرتبط فیلم‌ها تورنتو: تولیدکنندگان رسانه‌های جهانی قوانین محتوای محلی قوی‌تری را برای جلوگیری از سلطه جریان‌ها درخواست می‌کنند اخبار عمومی 11/9: آتش‌نشان دوباره در حمله ممدانی جولیانی: سیاست را کنار بگذارید منتقدان از آن متنفر بودند. کندی، بیوه اسپلینگ، به یاد می‌آورد که وقتی تبلیغات شروع شد، تمام این انتقادها درباره این برنامه وجود داشت که تلویزیون جیگل بود. هارون آن را شخصاً نگرفت، او واقعاً این کار را نکرد. او گفت: اوه، تبلیغات بیشتر. دیوید بیانکولی، منتقد تلویزیونی کهنه کار و یکی از مجریان برنامه هوای تازه شبکه NPR می افزاید: باید به خاطر داشته باشید که ABC مانند فاکس زمان"}, {"source": "Hollywood Reporter", "title": "Toronto: Global Media Producers Urge Stronger Local Content Laws to Fend Off Streaming Domination", "link": "https://www.hollywoodreporter.com/movies/movie-news/toronto-global-media-producers-urge-local-content-streamers-1236697536/", "summary": "A consortium of 23 industry groups warned the “ubiquity of global streaming services puts local stories at risk” as Netflix, Amazon and YouTube reshape the global TV market,", "date_str": "2026-09-11T12:48:25+00:00", "hash": "f288e8217478096f", "title_fa": "تورنتو: تولیدکنندگان رسانه‌های جهانی برای جلوگیری از سلطه جریان‌ها، قوانین قوی‌تر محتوای محلی را درخواست می‌کنند", "summary_fa": "ائتلافی از سازمان‌های رسانه‌ای بین‌المللی از دولت‌ها خواسته است تا از تولیدکنندگان محلی در برابر فراگیر شدن سرویس‌های پخش جهانی که کمیسیون‌های داستان‌سرایی متنوع را به خطر می‌اندازد، حمایت کنند. این فراخوان که در جشنواره فیلم تورنتو صادر شد، در حالی است که کشورها در سطح بین‌المللی از سیاستمداران خواسته‌اند تا پلتفرم‌های استریم خارجی را وادار کنند که به تولید رسانه‌های محلی یارانه بدهند زیرا نتفلیکس، آمازون و یوتیوب بازارهای جهانی فیلم و تلویزیون را تغییر می‌دهند. رینولدز ماستین، رئیس و مدیر عامل انجمن تولیدکنندگان رسانه کانادا، به نمایندگی از تولیدکنندگان مستقل، در بیانیه‌ای که همزمان با آغاز فعالیت TIFF در روز جمعه منتشر شد، گفت که پخش جریانی، نحوه سفارش‌دهی، تولید و دیده شدن محتوا را تغییر داده است، اما سیاست‌های داخلی با آن همگام نبوده است. داستان‌های مرتبط فیلم‌ها تورنتو: جاستین ترودو، نخست‌وزیر سابق، فیلم و بنر تولید تلویزیونی را راه‌اندازی می‌کند. امید کار سخت شیوه زندگی بهترین لابی هتل‌های تورنتو کانادا، مانند بسیاری از کشورهای جهان، به قوانین و مقررات به‌روزشده برای دنیای دیجیتال نیاز دارد، و ما هرکدام به دولت‌های مربوطه خود نگاه می‌کنیم تا از حاکمیت فرهنگی خود دفاع کنند. 23 سازمان بخش نمایشگر که بیانیه مشترک را امضا کردند شامل تولیدات سمعی و بصری اروپا، تولیدکنندگان صفحه نمایش استرالیا، تولیدکنندگان صفحه نمایش ایرلند، انیمیشن ایرلند، تهیه کنندگان تلویزیون فیلم سوئد و AnimFrance هستند. تماس گروه‌هایی که نماینده حدود 750000 کارگر در سراسر کانادا، استرالیا و اروپا هستند، هشدار داد که قوانین محتوای داخلی برای تقویت تولید داستان‌های محلی لازم است. تهیه‌کنندگان کانادایی اخیراً از دولت اتا ننده‌شان، به شهر کوچکش در میسوری بازمی‌گردد، و هر یک از آن‌ها وظیفه تمیز کردن آشفتگی‌های احساسی و تحت اللفظی به جا مانده از آن‌ها را داشتند. داستان‌های مرتبط فیلم‌ها بررسی هیومن: درام سیان هدر درباره مبارزه برای حقوق معلولیت یادداشت‌های آشنا را می‌زند، اما باعث ارتقای الهام‌بخش می‌شود. کار انجام شده است. هرون می‌گوید ما رابطه‌ای واقعاً پیچیده اما زیبا داشتیم. من احساس خوشبختی می کنم که قبل از اینکه او بگذرد، به مکان بسیار خوبی رسیدیم. هرون که در آن زمان در اتاق نویسندگانی در لس آنجلس کار می‌کرد، همراه با خانواده‌اش، با تدارکاتی مواجه شد که اغلب درباره آن صحبت نمی‌شد که با عبور یکی از عزیزانش همراه بود: پیدا کردن مدارک، تمیز کردن خانه‌ها و پریدن از میان تعداد به ظاهر بی‌پایانی از حلقه‌های بوروکراتیک. او نوشتن فیلمنامه «کوه آشغال» را به عنوان یک تمرین تهاجمی آغاز کرد: هرگز فکر نمی کردم صادقانه درباره آن فیلم بسازیم. اما پس از ارسال آن برای دوستان فیلمساز کالین ترورو و لیلی واچوفسکی که هر کدام به عنوان تهیه کننده قرارداد امضا کردند، روند تولید"}, {"source": "Hollywood Reporter", "title": "How ‘Obsession’ Rewrote TIFF History", "link": "https://www.hollywoodreporter.com/movies/movie-news/how-obsession-rewrote-tiff-history-1236697010/", "summary": "A year after a $750,000 horror movie became the biggest Toronto sale ever, can the fest’s first official market catch that lightning again?", "date_str": "2026-09-11T11:30:00+00:00", "hash": "2f92131387375025", "title_fa": "چگونه \"وسواس\" تاریخ TIFF را بازنویسی کرد", "summary_fa": "احتمالاً هرگز لحظه ای بدتر برای باز کردن بازار فیلم در کانادا وجود نداشته است. این کشور در یک جنگ تجاری سخت با بزرگترین شریک و نزدیکترین همسایه خود گرفتار شده است. تهدیدات تعرفه ای از فولاد و چوب به گفتگوهای سرگرمی نفوذ کرده است و تجارت فیلم مستقل محصول واقعی عرضه شده در تورنتو این هفته در میانه بازسازی اسلوموشن خود است. دسته توزیع‌کنندگان جدید پرشور که دو سال پیش با نقدینگی تازه و صحبت‌های بزرگ وارد TIFF شدند، به‌طور قابل‌توجهی کاهش یافته است. پخش کننده ها کمتر خرید می کنند و کمتر پرداخت می کنند. تئاتر تلنگر سکه است. داستان‌های مرتبط فیلم‌ها The Don of Hollywood North آخرین فیلم‌های خود را می‌گیرد تورنتو فروشگاه یک‌جای خود را می‌سازد و در عین حال TIFF: The Market، که در سپتامبر اجرا می‌شود. 10-16 در مرکز همایش مترو تورنتو در کنار بزرگترین جشنواره فیلم آمریکای شمالی، با چیزی افتتاح می‌شود که هیچ بازاری در سال اول حق آن را ندارد: شتاب و یک افسانه بنیانگذار. دوازده ماه پیش، یک کمدین اسکچ 25 ساله در یوتیوب با فیلم ترسناکی که به قیمت 750000 دلار با گروهی از بازیگران ناشناس فیلمبرداری کرده بود، وارد تئاتر رویال الکساندرا شد. او با بزرگ‌ترین خرید TIFF در تاریخ به مبلغ 15 میلیون دلار در سراسر جهان با Focus Features کنار رفت و این فیلم به فروش 513 میلیون دلاری در سطح جهانی رسید و تبدیل به پرفروش‌ترین پیکاپ جشنواره تمام دوران شد. در واقع، داستان پیروزی Obsession s TIFF در واقع از Croisette شروع شد. Ruzanna Kegeyan، مدیر اجرایی Capstone که در سال 2010 Midnight Madness Insidious را فروخته بود، در همان لحظه ای که پیتر کوپلووسکی، برنامه نویس TIFF، پیتر کوپلووسکی را فرود آورد، کمین کرد. او گفت، آیا در مورد کری بارکر چیزی شنیده ای؟ کوپلووسکی می‌گوید در ابتدا من خالی کردم. سپس او"}, {"source": "Hollywood Reporter", "title": "The Don of Hollywood North Takes His Final Bow", "link": "https://www.hollywoodreporter.com/movies/movie-news/don-carmody-the-don-of-hollywood-north-takes-final-bow-tiff-1236696654/", "summary": "After 50 years, $2 billion in production and an Oscar for Chicago, Don Carmody is retiring — with one final gift to Canada’s next producers.", "date_str": "2026-09-11T11:00:00+00:00", "hash": "64467b492804fdda", "title_fa": "دان هالیوود شمالی آخرین تعظیم خود را می گیرد", "summary_fa": "دان کارمودی با به دست آوردن بیش از 130 تیتراژ فیلم در طول 50 سال کار تهیه کنندگی، مدتهاست که به عنوان دان شمال هالیوود توسط کانترهای استودیویی شناخته می شود که اعداد و ارقام را به هم زدند و تصمیم گرفتند با فیلمبرداری در کانادا در پول خود صرفه جویی کنند. اکنون کارمودی، در 75 سالگی، آماده است تا صحنه یا حداقل مجموعه فیلم های کانادایی را با یک ارسال مجلل برای جشنواره فیلم تورنتو 2026 ترک کند. کارمودی به هالیوود ریپورتر می‌گوید روزهای     let currentTab = 'persian';

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);

      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';

      container.innerHTML = sortedItems.map((item, idx) => {

        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}

              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">

                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {

    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';

      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

        modal.classList.remove('active');
