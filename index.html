    }
  </style>
</head>

ed by local residents. They also announced plans to rebrand data centers as \"compute campuses,\" an apparent acknowledgement of the widespread public dislike for the infrastructure's longtime name. This story originally appeared on POLIT", "date_str": "2026-11-05T14:06:14+00:00", "hash": "23397b714bb88ee4", "title_fa": "OpenAI چارچوب سیاست جدیدی را برای مراکز داده ارائه می کند", "summary_fa": "ساخت یک مرکز داده 16 میلیارد دلاری در سالین، میشیگان، توسعه یافته توسط Related Digital برای Oracle و OpenAI. : جیم وست/UCG/گروه تصاویر جهانی از طریق Getty Images OpenAI از اقداماتی با هدف رسیدگی به نگرانی‌های جامعه در مورد توسعه مرکز داده، طبق اعلامیه سیاستی که ابتدا با POLITICO به اشتراک گذاشته شد، رونمایی کرد. این چارچوب به دنبال رسیدگی به مخالفت های عمومی است و در عین حال به سیلیکون ولی اجازه می دهد تا زیرساخت های هوش مصنوعی را گسترش دهد. بر اساس این طرح، توسعه دهندگان مصرف آب و انرژی، سر و صدا و فرصت های شغلی را گزارش می دهند. بر اساس اعلامیه سیاستی که با POLITICO به اشتراک گذاشته شده است، OpenAI از مجموعه جدیدی از اقدامات حمایت کرده است که شرکت می گوید به جوامع اجازه می دهد تا در توسعه مرکز داده سهم بیشتری داشته باشند. این چارچوب نشان می‌دهد که چگونه یکی از آزمایشگاه‌های هوش مصنوعی پیشرو در جهان تلاش می‌کند تا مخالفت عمومی با زیرساخت را با نیاز سیلیکون ولی به ایجاد مراکز داده برای حمایت از توسعه هوش مصنوعی تطبیق دهد. این غول هوش مصنوعی در پیشنهاد جدید خود که هدفش مقامات محلی، ایالتی و فدرال است، گفت که ارائه دهندگان خدمات شهری باید از مشتریان بزرگ برق بخواهند تا هزینه هایی را که به شبکه اضافه می کنند پوشش دهند و در صورت شکست پروژه از سایر مشتریان محافظت کنند. همچنین به ارائه دهندگان این امکان را می دهد تا در دوره های پر تقاضا برق را به مراکز داده انتقال دهند. بر اساس این طرح، توسعه دهندگان همچنین با الزامات گزارش عمومی برای استفاده از آب و انرژی، سر و صدا و فرصت های شغلی احتمالی مواجه خواهند شد. این پیشنهاد همچنین شرایطی را که در آن توسعه‌دهندگان می‌توانند از مقامات دولتی بخواهند موافقت‌نامه‌های عدم افشای اطلاعات را", "image_url": "https://i.insider.com/6aec8af2c54bfafa6 ving freight to collect data. The company will then simulate the routes and test them in a virtual environment before deploying its own vehicle called the Humble Hauler. Cohen expects commercial operations to begin in the third quarter of 2027. And although Humble holds a California permit to test its vehicles with a safety driver, it would need to clear additional regulatory steps before testing without a driver or deploying commercial service in the state. The company is going after regional routes, generally under 250 miles, connecting ports, warehouses, and distribution centers. According to federal data , 87% of goods shipped by truck in the US by weight traveled less than 250 miles in 2021. Cohen also sees an opening in an industry that has long struggled to recruit and retain drivers . He argues that autonomous trucks could handle undesirable shifts and repetitive routes, freeing human d", "date_str": "2026-11-05T14:00:01+00:00", "hash": "cff25c45376cd109", "title_fa": "یک مهندس سابق اپل و اوبر 51 میلیون دلار جمع آوری کرد تا در مورد کامیون خودران تجدید نظر کند", "summary_fa": "Humble Hauler Humble Robotics Humble Robotics 51 میلیون دلار برای ساخت کامیون های برقی خودران بدون کابین جمع آوری کرد. بنیانگذار Eyal Cohen قبلا در Apple، Uber و Waabi کار می کرد. این استارت آپ انتظار دارد عملیات تجاری در سه ماهه سوم سال 2027 آغاز شود. بسیاری از شرکت های کامیون های خودران در تلاش هستند تا به کامیون های موجود آموزش دهند که خودشان رانندگی کنند. Humble Robotics فکر می کند که کامیون خود نیاز به بازنگری دارد. این شرکت به طور انحصاری به Business Insider گفت: استارت آپ سانفرانسیسکو که در حال ساخت کامیون های برقی خودران بدون کابین راننده است، 51 میلیون دلار جمع آوری کرده است. این دور توسط Obvious Ventures با مشارکت سرمایه گذاران موجود Eclipse و Energy Impact Partners رهبری شد. کل بودجه Humble را به 75 میلیون دلار می رساند. این شرکت از افشای ارزش خود خودداری کرد. بنیانگذار و مدیر عامل Humble، ایال کوهن، بیشتر دوران حرفه ای خود را صرف تعقیب وعده رانندگی خودران کرده است. او روی پر e is available on your device, you'll be able to initiate backups in the Quick Share for Windows app. Your Android and Windows devices must be in close proximity and signed into the same Google Account. You can toggle Automatic backups on and change the settings for what gets backed up and to where. The transfers will then occur wirelessly in the background. As Android Authority reports, early hints at this feature suggested that Samsung phones and PCs would be excluded from automatic backups, but the release notes don't specify any further details.", "date_str": "2026-11-05T14:30:00+00:00", "hash": "21937fbbe801731a", "title_fa": "راه جدیدی برای پشتیبان گیری خودکار از عکس های اندرویدی شما به صورت رایگان وجود دارد", "summary_fa": "اگر از کاربران اندرویدی هستید که به دنبال راهی برای ذخیره عکس‌ها و ویدیوهای خود بدون به حداکثر رساندن فضای ذخیره‌سازی ابری خود هستید، ممکن است دستگاه شما به زودی قادر به پشتیبان‌گیری خودکار در رایانه شخصی شما باشد. همانطور که توسط Android Authority مشاهده شد، گوگل در یادداشت‌های انتشار خود برای سرویس‌های Google Play نسخه 26.43، پشتیبان‌گیری خودکار از اندروید به ویندوز را از طریق اشتراک سریع اضافه کرد. از رایانه شخصی خود به عنوان فضای ذخیره محلی رایگان برای عکس ها و فیلم ها استفاده کنید Quick Share یک ویژگی اشتراک گذاری فایل بی سیم برای Android است که به کاربران امکان می دهد عکس ها، فیلم ها و اسناد را به دستگاه های اطراف، از جمله رایانه های Windows و آیفون های دارای AirDrop ارسال کنند. ویژگی جدید پشتیبان‌گیری خودکار، که احتمالاً به تدریج عرضه می‌شود، از قابلیت اشتراک‌گذاری سریع برای انتقال کپی‌های عکس‌ها و ویدیوهای روی تلفن شما به رایانه شخصی در هنگام نزدیکی استفاده می‌کند. از آنجایی که این پشتیبان‌گیری‌ها به صورت محلی انجام می‌شوند، نیازی نیست که فقط به فضای ذخیره‌سازی ابری در حساب Google خود متکی باشید، و همچنین لازم نیست به یاد داشته باشید که انتقال عکس‌ها و ویدیوها را بین دستگاه‌ها آغاز کنید. به علاوه، این همه رایگان است و به اشتراک سرویس ابری جداگانه نیاز ندارد. در حالی که می‌توانید از رسانه‌های خود در Google Photos نسخه پشتیبان تهیه ک       media: [{"source": "Billboard", "title": "Tate McRae, Olivia Rodrigo & Harry Styles: Which Pop Stars Won October 2026? (Greatest Pop Stars Podcast)", "link": "https://www.billboard.com/music/pop/tate-mcrae-harry-styles-greatest-pop-stars-podcast-october-1236374718/", "summary": "There s just two months left in 2026 — and while it feels like the big picture is starting to shake out for the year in pop stardom, there s plenty of game still left to be played. With the finish line now in sight, a lot of the biggest pop stars were outside in October, either shoring up their cases, forcing their way into the center of the discussion, or maybe even making some fashionably late entrances to the mix in general. This week on the Greatest Pop Stars podcast , we catch up with all the stars who defined October 2026 in pop stardom. Host Andrew Unterberger is joined by Billboard staffers Michael Saponara and Emily Fuentes to share and debate our respective October top five lists, while also naming some honorable mentions, some disappointments, and some artists who we’re looking forward to in the final few months of the year. (If you want to listen back to our first nine 2026 recaps, or any of our 2025 episodes, you can check them all out here .) Along the way, we answer all the most pressing questions about October in pop stardom: Is Tate McRae doing her new album cycle the right way? Which of Taylor Swift s Showgirl: The Encore bonus cuts are holding up for us? How d Olivia Rodrigo and Chappell Roan fare on their first-ever remix? Is Harry Styles ending the year in a stronger place than we expected? Are people really saying that Jay-Z doesn t have the catalog to play the Super Bowl? Do the Texas elections mean that Choosin Texas is gonna get another 10 weeks atop the Hot 100? How have we not made a true pop star out of Dominic Fike yet? And perhaps most importantly: What were our takes on the Kelly Clarkson animatronic bird mini-controversy? Check it out above, and subscrib tely for her, the amphitheater is next to the Circuit of the Americas racetrack, and a fleet of F1 cars were just starting their day. “It was like, feeoooo , feeoooo , feeeoooo ,” Duff says, approximating the sound of those cars throttling by at 150 miles an hour. Staring down another day of being a mother before getting onstage to be a pop star, Duff was on the verge of malfunction. “I’d only gotten two hours of sleep, and it was like, ‘Help me, please,’” she recalls. “My husband grabbed my pillow, my blanket, blasted sound machines, gave me an eye mask, gave me earplugs, put headphones on top of the earplugs and was like, ‘I will keep the kids away from you. Don’t come out of here for six hours, because you have a show tonight.’ ” Nearly 25 years into her musical career, Duff is no stranger to life on the road. But until her zeitgeist-capturing Lucky Me Tour this past summer, she’d never brought her husband and kids along for the ride. The ongoing run is supporting her February album, Luck … Or Something , a surprise hit after Duff’s 11-year break from music that reached No. 3 on the Billboard 200 . With its tight 37 minutes of catchy, clever and often genuinely deep bops, it proved she still has serious pop cachet to spare. The album currently has 411.4 million on-demand official U.S. streams, according to Luminate. Read Billboard’s full Hilary Duff cover story here . Hilary Duff will sit down for an exclusive conversation at the 2026 Billboard Live Music Summit, where she will receive the Outstanding Pop Tour of the Year Award. Tickets for the Nov. 10 event are available here .", "date_str": "2026-11-05T14:59:35+00:00", "hash": "84217cc87957ff24", "title_fa": "هیلاری داف: عکس‌هایی از عکس روی جلد بیلبورد", "summary_fa": "بچه‌های هیلاری داف در اتوبوس تور در حالی که به آمفی‌تئاتر بیمه آلمانیا آستین می‌رفت، خواب بودند. ساعت 5 صبح بود، اما داف، با آدرنالین زیاد در برنامه شب قبلش، کاملاً بیدار بود - درست مثل هفت شب قبل. او امیدوار بود بالاخره کمی بخوابد، اما متأسفانه برای او، آمفی‌تئاتر در کنار پیست مسابقه‌ای Circuit of the Americas قرار دارد و ناوگانی از اتومبیل‌های F1 تازه روز خود را شروع می‌کردند. داف می گوید: «مثل این بود، feeoooo، feeoooo، feeeoooo،» با تقریبی صدای آن ماشین ها که با سرعت 150 مایل در ساعت حرکت می کردند. داف که یک روز دیگر از مادر شدن را قبل از اینکه به روی صحنه برود تا یک ستاره پاپ شود، خیره شده بود، در آستانه نقص بود. او به یاد می آورد: «من فقط دو ساعت خوابیده بودم، و مثل این بود که «لطفا به من کمک کن». شوهرم بالش، پتوم را گرفت، دستگاه‌های صدا را به صدا درآورد، ماسک چشمی به من داد، گوش‌گیر به من داد، هدفون را روی گوش‌گیر گذاشت و گفت: «بچه‌ها را از شما دور می‌کنم. شش ساعت از اینجا بیرون نرو، چون امشب برنامه‌ای دارید.» «نزدیک به 25 سال زندگی او در مسیر موسیقی عجیب نیست. اما تا زمانی که در تابستان گذشته تور «لاکی من» را جلب کرد، هرگز شوهر و بچه‌هایش را برای این سفر همراه نکرده بود. این برنامه در حال اجرا از آلبوم فوریه او، Luck… or Something پشتیبانی می کند، موفقیتی غافلگیرکننده پس از وقفه 11 ساله داف از موسیقی که به رتبه 3 بیلبورد 200 رسید. با 37 دقیقه بازی‌های جذاب، هوشمندانه و غالباً عمیق، ثابت کرد که او هنوز هم چیزهای جدی پاپ دارد. طبق گفته Luminate، این آلبوم در حال حاضر دارای 411.4 میلیون استریم رسمی ایالات متحده است. داستان کامل جلد بیلبورد هیلاری داف را اینجا بخوانید. هیلاری", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/cover-hilary-duff-billboard-2026-bb12-gleeson-paulino-1-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۸:۲۹"}, {"source": "Billboard", "title": "Guitarricadelafuente on His Acclaimed Acting Debut in ‘La Bola Negra’: ‘It Was an Extension of What I Was Feeling Musically’", "link": "https://www.billboard.com/music/latin/guitarricadelafuente-la-bola-negra-acting-debut-1236374471/", "summary": "Guitarricadelafuente has spent nearly a decade building a career from a place that, at first, served almost as a hiding spot. The artist, whose real name is Álvaro Lafuente, began singing under that pseudonym precisely because he was shy, and wanted to maintain some distance between himself and the person behind the songs. But, over time, music ended up doing the exact opposite, giving him the tools to show himself. Now, his journey has taken on a new dimension with La Bola Negra , the film directed, co-written and produced by Javier Calvo and Javier Ambrossi — known in Spain as “Los Javis” — inspired by Federico García Lorca’s unfinished play, and representing Spain in the race for the 2027 Oscar for best international feature film. For Guitarricadelafuente, this means that many people are discovering him for the first time, through something entirely different from his music. “They should know that I really come from music and making songs,” he tells Billboard Español . “I’ve been fortunate that, in this film, in some way, the character I’ve portrayed is an extension of what I was feeling musically. I think it’s very beautiful that this has been able to happen.” La Bola Negra follows the lives of three gay men at three key moments in Spanish history: 1932, 1937 and 2017. Guitarricadelafuente — who co-stars in the film alongside Milo Quifes and Carlos González — plays Sebastián, a young musician (trumpeter) forcibly recruited by Franco’s forces after surviving an attack during the Spanish Civil War. From this project, the song “La Nieve” was born, an original piece he wrote alongside Raül Refree and Lucas Durán, further intertwining his two worlds within the film. But long before portraying Sebastián, there were the songs he began sharing online, almost anonymously. In 2018, he released his first original composition, “El Conticinio,” recorded with a PlayStation microphone. That same year, he launched “Guantanamera,” which reached No. 69 on PROMUSICAE’s songs chart. Those early steps shaped Guitarricadelafuente, a project that, according to the artist, was born as a way to protect himself from his own shyness. “I’ve always been someone very timid,” he explains. “The reason I call myself Guitarricadelafuente was to create a nickname so that no one would know it was me behind it. From the first time I got on stage, I was always using the guitar as a shield so no one could see me.” Over the years, that relationship with the audience changed, and music ended ", "date_str": "2026-11-05T14:25:12+00:00", "hash": "5c61de6877fb5056", "title_fa": "Guitarricadelafuente در اولین بازی تحسین‌برانگیز خود در «La Bola Negra»: «این بسط چیزی بود که من از نظر موسیقی احساس می‌کردم»", "summary_fa": "Guitarricadelafuente نزدیک به یک دهه را صرف ساختن شغلی از جایی کرده است که در ابتدا تقریباً به عنوان یک مخفیگاه عمل می کرد. این هنرمند که نام اصلی او آلوارو لافونته است، دقیقاً به این دلیل که خجالتی بود شروع به خواندن با این نام مستعار کرد و می‌خواست فاصله‌ای بین خود و شخصی که پشت آهنگ‌ها بود حفظ کند. اما با گذشت زمان، موسیقی دقیقاً برعکس عمل کرد و ابزارهایی را در اختیار او قرار داد تا خودش را نشان دهد. اکنون، سفر او با La Bola Negra، فیلمی به کارگردانی، نویسندگی و تهیه کنندگی مشترک خاویر کالوو و خاویر آمبروسی - که در اسپانیا با نام \"لس جاویس\" شناخته می شود - با الهام از بازی ناتمام فدریکو گارسیا لورکا و نماینده اسپانیا در رقابت برای بهترین فیلم بلند بین المللی اسکار 2027، ابعاد جدیدی به خود گرفته است. برای Guitarricadelafuente، این بدان معنی است که بسیاری از مردم برای اولین بار او را از طریق چیزی کاملاً متفاوت از موسیقی او کشف می کنند. او به Billboard Español می گوید: «آنها باید بدانند که من واقعاً از موسیقی و آهنگسازی آمده ام. \"خوشبخت بودم که در این فیلم، به نوعی، شخصیتی که به تصویر کشیده‌ام، بسط احساسی است که از نظر موسیقی داشتم. فکر می‌کنم بسیار زیباست که این اتفاق می‌افتد.\" La Bola Negra زندگی سه مرد همجنس گرا را در سه لحظه کلیدی در تاریخ اسپانیا دنبال می کند: 1932، 1937 و 2017. Guitarricadelafuente - که در این فیلم در کنار میلو کویفس و کارلوس گونزالس بازی می کند - نقش سباستین، نوازنده جوانی (ترومپت) را بازی می کند که پس از جان سالم به در بردن از یک حمله در طول جنگ داخلی اسپانیا، به زور توسط نیروهای فرانکو به خدمت گرفته شد. از این پروژه، آهنگ \"La Nieve\" متولد شد، قطعه ای اورجینال", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Guitarricadelafuente-2026-credit-wolfgang-tillmans-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۴ آبان • ۱۷:۵۵"}, {"source": "Billboard", "title": "Netflix Rolls Out More Than An Hour of ‘KPop Demon Hunters’ Bonus Material, Including Playlists, Short-Form Stories and Games", "link": "https://www.billboard.com/culture/tv-film/netflix-kpop-demon-hunters-bonus-material-playlists-games-details-1236374696/", "summary": "Netflix dropped a ton of bonus KPop Demon Hunters content on Monday (Nov. 2) as part of a roll-out of 22 new episodes inspired by the wildly popular, Oscar-winning animated film. The 78 minutes of fresh content ranges from stop-motion adventures to games, official dance and choreo videos and kids shorts. The new material includes KPop Demon Hunters PLAYlist , a 13-episode, 49-minute collection of shorts that kicks off with HUNTER/X Backstage Pass , which follows Rumi, Mira and Zoey as they battle with rival idols and demon janitors, confront writer s block, fashion emergencies and face off against rivals the Saja Boys in a promo photo shoot face off. The bonus episodes also include stop-motion animation toy versions of the movie s characters acting out some of the original film s biggest moments and interactive games focused on the character s backstage lives. There is also a nine-episode bundle of dance videos that run just under 30 minutes that includes animated Kpop girl group HUNTR/X going through a dance rehearsal for How It s Done featuring choreo not seen in the movie, as well as a live-action dance performance video of the song. Fans can also watch full, live-action choreo videos for Golden, Takedown, Soda Pop and Your Idol, in which choreographers Leejung Lee, Nail and K-Tigers break down how and why Mira, Rumi and Zoey move the way they do. The massively popular animated movie that launched on Netflix in انیمیشن پرطرفدار که در سال 2025 در نتفلیکس عرضه شد، رکورد 325 میلیون بار پخش شده و همچنین در سینماهای سراسر جهان به نمایش درآمده است و تهیه کنندگان تایید کرده اند که دنباله ای بر پربیننده ترین عنوان این استریمر در تمام دوران ها در افق است. در حالی که در حال حاضر جزئیاتی در دسترس نیست، کارگردانان مگی کانگ", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2254686935-e1793884937395.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۱۴ آبان • ۱۷:۳۰"}, {"source": "Billboard", "title": "2026 CMA Awards Announce Kacey Musgraves, Ella Langley, Tim McGraw & More Performers, Plus Dolly Parton Tribute", "link": "https://www.billboard.com/music/awards/cma-awards-performers-2026-kacey-musgraves-tim-mcgraw-dolly-1236374456/", "summary": "The upcoming 60th annual CMA Awards performer lineup is set to include a string of hitmakers, fan favorites, and a newly minted Country Music Hall of Famer. The first round of CMA Awards performers includes Kacey Musgraves , Cody Johnson , Miranda Lambert , The Red Clay Strays, Zach Top and Tucker Wetmore, as well as Ella Langley, whose Choosin Texas has dominated the all-genre Billboard Hot 100 this year. The initial performer lineup reveal also features Tim McGraw, who was just inducted into the Country Music Hall of Fame last month. Related Inside the Plans to Celebrate the CMA Awards at 60: We Have to Meet Fans Where They Are As Final-Round Voting Opens Today for the 2026 CMA Awards, Here Are the Races We’re Watching Ella Langley Leads Nominations for 2026 CMA Awards: Full List The CMAs will also pay tribute to late Country Music Hall of Fame member Dolly Parton, who died in August. Reigning CMA entertainer of the year Lainey Wilson will host the CMA Awards for a third consecutive year. The awards show will air live from Nashville s Bridgestone Arena on Wednesday, Nov. 18, on ABC and Disney+ and will be available the following day on Hulu. Langley leads this year s nominees with nine nods, including entertainer, album ( Dandelion ), female vocalist, musical event and music video of the year, as well as two nominations for single and song of the year. Johnson, the reigning CMA male vocalist of the year, is up for four CMA Awards trophies, including entertainer, male vocalist, single and music video of the year. Lambert has seven nominations this year, among them two for single of the year and her 19th nomination for female vocalist of the year (with 70 career nominations, Lambert also holds the record for the most CMA Awards nominations by a female artist). Musgraves has five nominations heading into the awards ceremony, among them album ( Middle of Nowhere ), female vocalist and song of the year. The Red Clay Strays are the reigning vocal group of the year and look to retain their title this year. Zach Top, the reigning new artist of the year, is nominated twice heading into this year s awards ceremony, including male vocalist of the year and album of the year ( Ain t In It for My Health ). Wetmore picks up his second CMA Awards nomination this year in the new artist of the year category. Last year s CMA Awards winners also included Wilson taking home album of the year for Whirlwind , Langley and Riley Green s You Look Like You Love Me earning song and", "date_str": "2026-11-05T14:00:00+00:00", "hash": "9907d996dcf7876e", "title_fa": "جوایز CMA 2026 کیسی ماسگریوز، الا لنگلی، تیم مک‌گرو و هنرمندان دیگر، به علاوه ادای احترام به دالی پارتون را اعلام کرد.", "summary_fa": "شصتمین سالانه نوازندگان جوایز CMA قرار است شامل مجموعه‌ای از هیت‌سازان، علاقه‌مندان به علاقه‌مندان، و تالار مشاهیر موسیقی کانتری باشد. اولین دور از اجراکنندگان جوایز CMA شامل کیسی ماسگریوز، کودی جانسون، میراندا لمبرت، رد رسی استریز، زک تاپ و تاکر وتمور و همچنین الا لنگلی است که Choosin Texas او امسال در همه ژانر Billboard Hot 100 تسلط داشته است. در فاش شدن ترکیب اولیه مجریان، تیم مک گرو نیز حضور دارد که ماه گذشته به تالار مشاهیر موسیقی کانتری راه یافت. مربوط به برنامه های مربوط به جشن گرفتن جوایز CMA در 60 سالگی: ما باید با طرفداران در جایی که هستند ملاقات کنیم، همانطور که رای گیری دور نهایی امروز برای جوایز CMA 2026 باز می شود، در اینجا مسابقه هایی است که در حال تماشای آن هستیم الا لنگلی نامزدهای اصلی جوایز CMA 2026: لیست کامل CMA ها از اعضای کانتری که به عضویت Hall Dollte نیز پرداخت خواهند کرد. در ماه اوت درگذشت. لاینی ویلسون، هنرمند برتر سال CMA، برای سومین سال متوالی میزبان جوایز CMA خواهد بود. نمایش جوایز در روز چهارشنبه، 18 نوامبر، از شبکه ABC و Disney+ به صورت زنده از ورزشگاه بریجستون نشویل پخش خواهد شد و روز بعد در Hulu در دسترس خواهد بود. لنگلی با 9 نوبت، از جمله خواننده، آلبوم (قاصدک)، خواننده زن، رویداد موزیکال و موزیک ویدیوی سال، و همچنین دو نامزدی برای تک آهنگ و آهنگ سال، پیشتاز نامزدهای امسال است. جانسون، خواننده مرد سال CMA، برای چهار جایزه جایزه CMA، از جمله خواننده، خواننده مرد، تک‌آهنگ و موزیک ویدیوی سال رقابت می‌کند. لمبرت امسال هفت نامزدی دارد، از جمله دو نامزدی برای تک آهنگ سال و نوزدهمین نامزدی او برای خواننده زن سال (با 70 نامزدی حرفه ای، لمبرت همچنین رکورد بیشترین نامزدی جوایز CMA توسط یک هنرمند زن را دارد). ماسگریوز پنج نامزدی برای حضور", "image_url": "https://www.billboard.com/wp-content/uploads/2026/04/2271973110-e1777478704457.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۷:۳۰"}, {"source": "Billboard", "title": "Cristian Castro Signs With Enso Music for Management: ‘Chance to Build Something Truly Historic’", "link": "https://www.billboard.com/pro/cristian-castro-management-deal-jorge-juarez-enso-music/", "summary": "Cristian Castro , who was recently honored with a Billboard Lifetime Achievement Award , has signed a management deal with Enso Music, Billboard can exclusively announce on Thursday (Nov. 5). The new partnership opens a new chapter in the celebrated career of the Mexican pop icon, now under the guidance of renowned Latin music executive Jorge Juárez . Related Cristian Castro Accepts the Billboard Lifetime Achievement Award In the Name of Romantic Love Carín León s Manager Jorge Juárez on the Significant Cultural Moment of History-Making Sphere Shows Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 “Cristian is one of the most important and recognizable artists in Latin music, with a voice and a catalog that have transcended generations and borders,” Juárez, CEO of Enso Music, said in a statement. “It’s a privilege to begin this new chapter together and to welcome, here at Enso Music, an artist with such a rich history who is also experiencing an extraordinary moment in his career. We share a vision of continuing to build, to grow, and to take his music to new stages and audiences around the world.” Meanwhile, Castro celebrated his arrival at the company and expressed being “deeply grateful” for the trust that Juárez and his team have placed in him for the next chapter of his career, which includes a new album slated for 2027 and the continuation of his Nada Solo Éxitos Tour, which began on Sept. 11 in Las Vegas and will run through March 2027. Some opportunities go far beyond a signature. They represent hope, excitement, dreams and the chance to build something truly historic, an unrepeatable mark along the way, he said. Thank you for believing in me, opening doors for me and making me feel wanted and cared for. My commitment is to give my very best, work with passion and rise to the occasion. Thank you for making this joy possible today. On the horizon, I see great achievements and many successes we’ll share together.” With more than 12 million albums sold, Castro, who has established himself as one of the defining voices of Latin pop and romantic music, began his Billboard chart journey in 1992 when “No Podrás” became his first entry on Hot Latin Songs, peaking at No. 3. His debut album, Agua Nueva , reached No. 2 on the Top Latin Pop Albums chart in January 1993, and since then, he has earned six No. 1s on Hot Latin Songs, including “Nunca Voy a Olvidarte,” “Amor” and “Azul,” which spent four, 11 and nine weeks at the ", "date_str": "2026-11-05T14:00:00+00:00", "hash": "2d100aef1b449fe7", "title_fa": "کریستین کاسترو با موسیقی Enso برای مدیریت امضا می‌کند: «شانس برای ساختن چیزی واقعاً تاریخی»", "summary_fa": "کریستین کاسترو، که اخیراً با جایزه یک عمر دستاورد بیلبورد مفتخر شد، قرارداد مدیریتی با Enso Music امضا کرده است، بیلبورد می تواند به طور انحصاری در روز پنجشنبه (5 نوامبر) اعلام کند. این همکاری جدید فصل جدیدی را در حرفه مشهور نماد پاپ مکزیکی باز می کند که اکنون تحت هدایت مدیر اجرایی مشهور موسیقی لاتین خورخه خوارز است. مرتبط: کریستین کاسترو جایزه یک عمر دستاورد بیلبورد را به نام عشق رمانتیک می پذیرد. مدیر کارین لئون، خورخه خوارز در لحظه فرهنگی مهم حوزه تاریخ ساز، کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران موسیقی Big Deal، یکی از مهمترین بنیانگذاران موسیقی است. خوارز، مدیرعامل Enso Music، در بیانیه ای گفت: هنرمندان قابل تشخیص در موسیقی لاتین، با صدا و کاتالوگ که از نسل ها و مرزها فراتر رفته است. این یک افتخار است که این فصل جدید را با هم شروع کنیم و در انسو موزیک به هنرمندی با چنین تاریخ غنی که لحظه‌ای خارق‌العاده را در کار خود تجربه می‌کند، خوش آمد بگویم. ما دیدگاهی مشترک برای ادامه ساختن، رشد و بردن موسیقی او به صحنه ها و مخاطبان جدید در سراسر جهان داریم.» در همین حال، کاسترو ورود خود را به این شرکت جشن گرفت و ابراز \"عمقاً سپاسگزار\" کرد به خاطر اعتمادی که خوارز و تیمش به او برای فصل بعدی حرفه‌اش، که شامل آلبوم جدیدی برای سال 2027 و ادامه تور Nada Solo Éxitos است، که از 2 سپتامبر و 10 مارس در لاس وگاس آغاز شد، به او داده اند. برخی فرصت ها بسیار فراتر از یک امضا هستند. او گفت که آنها نشان دهنده امید، هیجان، رویاها و فرصتی برای ساختن چیزی واقعاً تاریخی هستند، علامتی تکرار نشدنی در طول مسیر. ممنونم که به من ایمان داشتی، درها را به روی من باز کردی و باعث شدی احساس کنم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Jorge-Juarez-Cristian-Castro-2026-cr-socios-music-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۷:۳۰"}, {"source": "Deadline",     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
