      media: [{"source": "Billboard", "title": "YouTube Streaming Data to Return to Billboard Charts", "link": "https://www.billboard.com/pro/youtube-streaming-data-return-billboard-charts/", "summary": "YouTube s global head of music Lyor Cohen said in a blog post Monday (Nov. 9) that the company s streaming data will return to Billboard ’s charts, resuming in 2027. The blog post follows Billboard ’s announcement earlier on Monday that the chart methodology will change to narrow the ratio between paid/subscription streams and ad-supported streams to 1:1.5 after previously having been at a 1:2.5 ratio. Related Billboard to Update Chart Methodology in 2027 Following Annual Industry Revenue Review Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City Michael Jackson s Thriller Scares Up Highest Rank on Billboard 200 Albums Chart in More Than 40 Years We are returning to the Billboard charts starting in 2027, Cohen wrote, in a two-line update to YouTube s original announcement from December 2025 that it was pulling out of the charts. Billboard ’s new methodology better reflects how fans engage with music today across both subscription and ad-supported services. Effective Jan. 16 (reflecting data from Jan. 1-7), each album consumption unit on the Billboard 200 will equal 1,500 ad-supported or 1,000 paid-subscription on-demand official audio and video streams generated by songs from an album. Currently, the Billboard 200 considers each album consumption unit as equal to 2,500 ad-supported streams or 1,000 paid/subscription on-demand official audio and video streams generated by songs on an album. Each album consumption unit equals one album sale or 10 individual tracks sold from an album. YouTube withdrew its streaming data from the Billboard charts earlier this year, beginning with the charts dated Jan. 31, in response to Billboard ’s announcement that paid/subscription streams would be weighed against ad-supported streams at a 1:2.5 ratio. YouTube was first included as part of the Billboard charts in 2013, when its streaming data was incorporated into Billboard ’s song charts, including the Hot 100 . Billboard was the first to include YouTube’s streaming data in charts. In 2019, Billboard began incorporating YouTube streaming data into the Billboard 200 . Paid/subscription streams were first weighted higher than ad-supported streams on the Billboard charts in 2019, and international organizations including the IFPI also began to incorporate weighted systems. At the time, Billboard wrote, “It is Billboard ’s belief that assigning values to the levels of consumer engagement and access — along with the compensation derived from those opt", "date_str": "2026-11-09T16:31:26+00:00", "hash": "fca96477c7a28d10", "title_fa": "داده‌های جریانی YouTube برای بازگشت به نمودارهای بیلبورد", "summary_fa": "لیور کوهن، رئیس جهانی موسیقی YouTube، دوشنبه (9 نوامبر) در یک پست وبلاگی گفت که داده‌های پخش جریانی شرکت به نمودارهای بیلبورد بازخواهد گشت و در سال 2027 از سر گرفته می‌شود. این پست وبلاگ به دنبال اعلام بیلبورد در اوایل روز دوشنبه است مبنی بر اینکه روش نمودار تغییر می‌کند تا نسبت بین جریان‌های پولی/اشتراک‌ها را کاهش دهد: جریان‌هایی که قبلاً در جریان‌های 51 پشتیبانی می‌شدند. نسبت 1:2.5 بیلبورد مرتبط برای به‌روزرسانی متدولوژی نمودار در سال 2027 پس از بررسی درآمد صنعت سالانه تیلور سویفت و کارلی کلوس در بازی تراویس کلس در کانزاس سیتی شرکت کردند. از سال 2027، کوهن در یک به روز رسانی دو خطی به اطلاعیه اصلی یوتیوب از دسامبر 2025 نوشت که از چارت ها خارج می شود. روش جدید بیلبورد نحوه تعامل طرفداران با موسیقی امروزی را در هر دو سرویس اشتراکی و تبلیغاتی بهتر منعکس می کند. از 16 ژانویه (منعکس کننده داده‌های 1-7 ژانویه)، هر واحد مصرف آلبوم در Billboard 200 برابر با 1500 پخش صوتی و تصویری رسمی با پشتیبانی آگهی یا 1000 پخش صوتی و تصویری رسمی درخواستی با اشتراک پولی خواهد بود که توسط آهنگ‌های یک آلبوم تولید می‌شود. در حال حاضر، بیلبورد 200 هر واحد مصرف آلبوم را برابر با 2500 جریان تبلیغاتی یا 1000 جریان صوتی و تصویری رسمی بر اساس تقاضای پولی/اشتراک تولید شده توسط آهنگ های یک آلبوم در نظر می گیرد. هر واحد مصرف آلبوم برابر است با فروش یک آلبوم یا 10 قطعه منفرد از یک آلبوم. یوتیوب در اوایل سال جاری، داده‌های استریم خود را از نمودارهای بیلبورد خارج کرد و از نمودارهای تاریخ ژانویه آغاز شد. در 31، در پاسخ به اعلام بیلبورد مبنی بر اینکه جریان‌های پولی/اشتراک با نسبت 1:2.5 در مقابل جریان‌های پشتیبانی‌شده از آگهی سنجیده می‌شوند. یوتیوب برای اولین بار در سال 2013 به عنوان بخشی از", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۲۰:۰۱"}, {"source": "Billboard", "title": "Anuel AA Reveals Plans for Real Hasta la Muerte Festival in 2027: ‘Every Year It’ll Be In a Different Country’", "link": "https://www.billboard.com/music/latin/anuel-aa-real-hasta-la-muerte-festival-2027-plans-1236377903/", "summary": "Anuel AA is expanding the Real Hasta la Muerte franchise into live events. In a conversation with Billboard ’s co-chief content officer Leila Cobo, the Puerto Rican superstar revealed plans for a music festival beginning in 2027. Related Anuel AA Talks Corridos Era, Fuerza Regida Collab Posts About Ex Karol G: Maybe She’ll Unblock Me Anuel AA Reveals He’s Dropping an All-Corridos Album Along With ‘RHLM 2’: Everything We Know Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City “I’m starting now with the Real Hasta la Muerte Festival,” said Anuel. “My festival [will feature] lots of artists. I’ll announce the date soon, he added. The artist mentioned that he plans to launch the fest in the summer of 2027, and Europe may be its first stop. But the location is not settled. The first year, I think [we will host it in] Spain,” he said, while noting he was still “going back and forth between Chile or Spain right now.” He also did not share a date, city, venue or lineup, but said the event would bring together “lots of artists.” Every year it ll be in a different country, said Anuel, stating that the international festival is also considering Puerto Rico, Mexico and Colombia as host possibilities. The live music announcement came amid a broader conversation about Anuel’s next moves. He told Cobo that Real Hasta la Muerte 2 is due Nov. 19 and that he could release his corridos album, Cartel Real Hasta la Muerte , on the same day. Exploring the genre, he said, has made him “fall in love with music all over again — with something new, not the same old thing.” The interview also touches on his relationship with Colombian megastar Karol G, his decision to get sober and how he’s rethinking his life and music. Watch the full conversation below.", "date_str": "2026-11-09T16:18:00+00:00", "hash": "1458f802615af68f", "title_fa": "Anuel AA برنامه های خود را برای جشنواره واقعی Hasta la Muerte در سال 2027 فاش می کند: \"هر سال در کشوری متفاوت خواهد بود\"", "summary_fa": "Anuel AA در حال گسترش امتیاز Real Hasta la Muerte به رویدادهای زنده است. در گفتگو با لیلا کوبو، مدیر ارشد محتوای بیلبورد، سوپراستار پورتوریکویی برنامه های خود را برای جشنواره موسیقی که از سال 2027 آغاز می شود، فاش کرد. پست‌های مرتبط Anuel AA Talks Corridos Era, Fuerza Regida Collab درباره سابق کارول جی: شاید او من را رفع انسداد کند Anuel AA فاش می‌کند که آلبوم All-Corridos را همراه با «RHLM 2» منتشر می‌کند: همه چیزهایی که می‌دانیم تیلور سویفت و کارلی کلوس در بازی Kanssaefvis در حال حاضر شرکت می‌کنند. با جشنواره Real Hasta la Muerte، گفت: Anuel. او افزود: \"در جشنواره من هنرمندان زیادی حضور خواهند داشت. به زودی تاریخ آن را اعلام خواهم کرد.\" این هنرمند اشاره کرد که قصد دارد جشنواره را در تابستان 2027 راه اندازی کند و اروپا ممکن است اولین ایستگاه آن باشد. اما مکان حل نشده است. سال اول، فکر می‌کنم [ما در اسپانیا میزبان آن خواهیم بود»، در حالی که اشاره کرد که «در حال حاضر بین شیلی یا اسپانیا رفت و آمد می‌کند». او همچنین تاریخ، شهر، مکان یا ترکیبی را به اشتراک نمی گذارد، اما گفت که این رویداد \"هنرمندان زیادی\" را گرد هم می آورد. آنوئل با بیان اینکه جشنواره بین المللی پورتوریکو، مکزیک و کلمبیا را نیز به عنوان میزبان در نظر می گیرد، گفت: هر سال در کشور دیگری برگزار خواهد شد. اعلام موسیقی زنده در میان گفتگوی گسترده تر در مورد حرکات بعدی آنوئل منتشر شد. او به کوبو گفت که Real Hasta la Muerte 2 قرار است در 19 نوامبر برگزار شود و او می تواند آلبوم کوریدوس خود، Cartel Real Hasta la Muerte را در همان روز منتشر کند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/anuelqa.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۹:۴۸"}, {"source": "Billboard", "title": "Del Casher, Inventor of Guitar Wah-Wah Pedal Dies at 88", "link": "https://www.billboard.com/music/music-news/del-casher-death-inventor-guitar-wah-wah-pedal-dies-obituary-1236377908/", "summary": "Del Casher, a session musicians and the inventor of one of rock guitarist s most beloved effects, the wah-wah pedal, has died at 88. The news came as part of a GoFundMe campaign to help support his wife, Eiko, revealing that Casher passed on Oct. 1 following a battle with cancer. Related Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City Gone But Not Forgotten: Musicians We Lost in 2026 Michael Jackson s Thriller Scares Up Highest Rank on Billboard 200 Albums Chart in More Than 40 Years The GoFundMe started by neighbor and good friend Al Burg, noted that in addition to fighting cancer, Casher s sound studio business had been devastated by the COVID-19 pandemic, forcing him to sell valuable guitars and equipment to pay the bills, in addition to taking out a reverse mortgage on the couple s home. Casher, born Delton Edward Kacher in Hammond, Ind. on Dec. 28, 1937, is best known for the wah-wah pedal, an effects device for electric guitar that mimics the sound of a human voice reciting the onomatopoetic phrase wah-wah when stepped on or pushed with the foot. He got his start after college performing guitar and banjo on The Lawrence Welk Show in 1959, as well as sitting in with singing cowboy Gene Autry and the instrumental group Three Suns while tinkering with technologies that could make his playing more distinctive. According to Guitar Player magazine, Casher hit upon his signature invention while working with Vox amplifier and its American parent company, Thomas Organ, where he turned a tone-control circuit into a foot-operated effect that allowed guitarists to cycle through a sequence of frequencies that gave the pedal its distinctive name. While working as a Vox consultant in 1966, Casher noticed that a variable tone control on one of the company s amps produced the wah-wah effect when it was adjusted a certain way, realizing that he could change the way an electric guitar sounded and bend it to sound like a trumpet or a harmonica player cupping his hands around the mic and his instrument. Casher convinced the company s engineers to adapt his idea into a foot-operated pedal that was initially called a Cry Baby, then recorded a demo album for music stores to demonstrate his device, though neither the pedal nor the album gained much traction when they were released in 1967. “They thought I was a crackpot, but they humored me,” Casher told The New York Times in 2011 about idea to record the demo album. Casher got his big break, h", "date_str": "2026-11-09T16:13:22+00:00", "hash": "5b9bc13e30e6bebf", "title_fa": "دل کشر، مخترع پدال گیتار Wah-Wah در ۸۸ سالگی درگذشت", "summary_fa": "دل کشر، یک نوازنده جلسه و مخترع یکی از محبوب ترین افکت های گیتاریست راک، پدال wah-wah، در 88 سالگی درگذشت. این خبر به عنوان بخشی از یک کمپین GoFundMe برای کمک به حمایت از همسرش، ایکو، منتشر شد و فاش کرد که کشر در 1 اکتبر در پی نبرد با سرطان درگذشت. تیلور سوئیفت و کارلی کلوس در بازی Chiefs Travis Kelce در کانزاس سیتی شرکت کردند Gone But Not Forgotten: Musicians We Lost in 2026 Thriller مایکل جکسون می ترساند بالاترین رتبه در جدول آلبوم های بیلبورد 200 در بیش از 40 سال توسط The GoFundMe با سرطان شروع شد. کسب و کار استودیوی صدای کشر در اثر همه گیری کووید-19 ویران شده بود و او را مجبور کرد تا گیتارها و تجهیزات ارزشمندی را برای پرداخت قبوض بفروشد، علاوه بر آن وام مسکن معکوس برای خانه این زوج دریافت کند. کشر، با نام دلتون ادوارد کاچر در هاموند، هند در 28 دسامبر 1937، بیشتر به خاطر پدال wah-wah شناخته می شود، یک وسیله افکت برای گیتار الکتریک که صدای انسان را تقلید می کند که عبارت انوماتوپوزیک wah-wah را هنگام پا گذاشتن یا فشار دادن با پا، تقلید می کند. او شروع خود را پس از اجرای گیتار و بانجو در کالج در نمایش لارنس ولک در سال 1959 آغاز کرد، و همچنین با گاوچران جین اوتری و گروه ساز سه خورشید کنار هم نشست و در عین حال به فناوری‌هایی پرداخت که می‌توانست نواختن او را متمایزتر کند. طبق مجله گیتار پلیر، کشر در حین کار با آمپلی‌فایر Vox و شرکت مادر آمریکایی آن، توماس ارگان، به اختراع امضای خود دست یافت، جایی که او یک مدار کنترل صدا را به یک افکت کارکرده با پا تبدیل کرد که به گیتاریست‌ها اجازه می‌داد تا از میان توالی فرکانس‌هایی که به پدال نام متمایز آن می‌داد بچرخند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/del-casher-1998-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۹:۴۳"}, {"source": "Billboard", "title": "Watch Jung Kook Ham It Up in Festive Fashion Campaign for ‘Styles That I Always Come Back To’", "link": "https://www.billboard.com/music/music-news/bts-jung-kook-calvin-klein-2026-holiday-fashion-campaign-1236377909/", "summary": "Jung Kook s friends and family in search of the perfect Christmas gift for the BTS member can t go wrong with a little bit of Calvin Klein especially the denim, he revealed in a new holiday campaign with the fashion house. Related Jung Kook Reveals the Little Secret Between Me ARMY Hidden in His First-Ever Clothing Line BTS Plans to Add More ARIRANG Tour Dates Work on New Music Solo Projects in 2027 BTS’ Comeback Drives HYBE s Quarterly Earnings to All-Time Highs The K-pop superstar and CK debuted their latest partnership on Monday (Nov. 9), featuring a collection of outfits curated by Jung Kook based on his favorite pieces. It includes different-colored jeans, shirts emblazoned with the brand s logo and accessories such as belts an reen Film how he developed the sound for the adaptation of Andy [ ]", "date_str": "2026-11-09T16:45:00+00:00", "hash": "e6fed50cfbec9672", "title_fa": "دانیل پمبرتون، آهنگساز «Project Hail Mary» با استفاده از ابزارهای جدید - صدا و فیلم سینمایی «زبانی از پایه» را ساخت", "summary_fa": "در پروژه درود مری، فضانورد آماتور رایلند گریس (رایان گاسلینگ) یاد می گیرد که با بیگانه ای که در یک ماموریت ناامیدکننده در فضا ملاقات می کند، ارتباط برقرار کند. برای موسیقی متن فیلم، آهنگساز دانیل پمبرتون قصد داشت زبان موسیقایی جدیدی خلق کند و در فیلم Sound Screen از Deadline به اشتراک گذاشت که چگونه صدا را برای اقتباس از اندی [ ] در پروژه درود مری، فضانورد آماتور رایلند گریس (رایان گاسلینگ) یاد می گیرد که در یک ماموریت با بیگانه ای که در فضا ملاقات می کند، ارتباط برقرار کند. برای موسیقی فیلم، آهنگساز دانیل پمبرتون قصد داشت زبان موسیقایی جدیدی خلق کند و در فیلم Deadline's Sound Screen نحوه ساخت صدا را برای اقتباس از کتاب اندی ویر به کارگردانی فیل لرد و کریس میلر به اشتراک گذاشت. پمبرتون گفت: \"این مانند تلاش برای ساختن یک زبان از پایه بود، که وقتی می خواهید زبانی را با پالت صدا بسازید، کار را بسیار پیچیده می کند.\" \"بنابراین وقتی چیزهایی را با صداهای مختلف امتحان می کنید، آزمایش های زیادی وجود دارد.\" یکی از سازهایی که پمبرتون می خواست در آن گنجانده شود طبل فولادی بود. با این حال، ثابت شد که بسیار شبیه به یک فیلم معروف دیگر است. او گفت: «فکر می‌کردم آنها در موسیقی باحال و با احساس هستند، اما بعد از آن شبیه پری دریایی کوچک به نظر می‌رسد. امتیاز عالی، بی احترامی به پری دریایی کوچک نیست، اما برای این کار مناسب نیست. چیزی در وزن طبل های فولادی وجود دارد که جالب است.» پمبرتون برای برانگیختن صدایی مشابه با کیفیت‌های شنیداری متفاوت، از سازهایی مانند بلوک‌های چوبی و کریستال بسکت، مجموعه‌ای از میله‌های شیشه‌ای که نوازنده با آب می‌مالد، استفاده کرد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Daniel-Pemberton-Project-Hail-Mary.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۸ آبان • ۲۰:۱۵"}, {"source": "Deadline", "title": "Adam Devine ده باشد", "summary_fa": "بیایید برای لحظه ای وانمود کنیم که شما رئیس جمهور هستید و رای دهندگان فقط با سرزنش تاریخی میان دوره ای حزب شما به حکومت شما پاسخ دادند. احتمالاً به دنبال کنترل آسیب هستید. ممکن است برخی از روسای کابینه بروند، اعضای رهبری حزب ممکن است بازنشسته شوند، شما ممکن است - در صورتی که وضعیت به اندازه کافی وخیم باشد - یک مصاحبه اختصاصی با یک برنامه خبری معتبر داشته باشید تا یک چرخش مثبت در هفته بی رحمانه ایجاد کنید. ترامپ یکشنبه شب، زمانی که در برنامه 60 Minutes ظاهر شد - که اخیرا تحت مدیریت محافظه‌کارانه‌تر قرار گرفته بود - تا حدی برای پاسخگویی به ضررهای میان‌دوره‌ای جمهوری‌خواهان، تلاش کرد چنین چارچوب‌بندی مجددی را انجام دهد. چند لحظه برجسته بود. رئیس‌جمهور از سودجویی مستمرش از شرکت‌های خانواده‌اش دفاع کرد و مدعی شد «همه» دارایی خالص خود را ۳ میلیارد دلار افزایش داده‌اند (نه فقط خودش)، و عدم محبوبیت جنگ ایران را به دلیل «پیام‌های بد» مقصر دانست. شگفت آورتر از همه - به ویژه برای برخی از جمهوری خواهان - رئیس جمهور در مقابل دوربین اعتراف کرد که سیاست های مهاجرتی او \"بیش از حد سخت\" است. \"یک چیزی که دوست دارید با اکثریت دموکرات روی آن کار کنید چیست؟\" راس دوتات مجری برنامه از رئیس جمهور پرسید که او پاسخ داد که \"دوست دارد کاری در زمینه مهاجرت انجام دهد.\" با توجه به ذوقی که دولت با آن از زمان بازگشت ترامپ به قدرت، سرکوب بی رحمانه و آشکارا ظالمانه را در مورد مهاجرت دنبال کرده است، که صراحتاً مهاجران رنگین پوست و جوامع اقلیت را هدف قرار می دهد، کمی منحنی بود. وقتی ترامپ تحت فشار قرار گرفت که آیا فکر می‌کند سیاست‌های مهاجرتی‌اش به رای‌دهندگان کمک کرده یا به او آسیب رسانده است، ترامپ سعی کرد به هر دو صورت این کار را انجام", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/donald-trump-60-minutes.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۲۰:۲۳"}, {"source": "Rolling Stone", "title": "Divorce, Near-Death, and Drugs: Darius Rucker Will Look Back in New Documentary", "link": "https://www.rollingstone.com/music/music-news/darius-rucker-documentary-release-date-1235654600/", "summary": "They Called Me Hootie arrives Nov. 16 on Hulu/Disney+ and examines Hootie and the Blowfish singer’s rise to country-rock stardom", "date_str": "2026-11-09T16:51:28+00:00", "hash": "016baf7d291b621b", "title_fa": "طلاق، نزدیک به مرگ، و مواد مخدر: داریوش راکر در مستند جدید به گذشته نگاه خواهد کرد", "summary_fa": "They Called Me Hootie در 16 نوامبر در Hulu/Disney+ می رسد و به بررسی ظهور هوتی و خواننده Blowfish به ستاره کانتری راک می پردازد. Darius Rucker: They Called Me Hootie در 16 نوامبر از طریق Hulu/Disney+ در ایالات متحده و بازارهای بین المللی محدود وارد می شود. They Called Me Hootie زندگی راکر را از آغازش در چارلستون، SC تا سوپراستار شدن راک بررسی می‌کند و در عین حال به لحظات تاریک‌تری در حرفه‌اش از جمله طلاق، تجربیات نزدیک به مرگ و اعتیاد به مواد مخدر می‌پردازد. این مستند دارای تصاویری است که قبلاً هرگز دیده نشده بود از Hootie and the Blowfish و تریلر نوید مصاحبه با هم گروه Hootie، Jim Sonefeld، Mark Bryan، Dean Felber، دوست صمیمی Woody Harrelson، Brad Paisley و غیره را می دهد. راکر در سطرهای آغازین تریلر می گوید: داستان اساسی زندگی من [این است که] هر بار که می خواهم کاری انجام دهم، کسی به من می گوید که نمی توانم آن را انجام دهم. راکر در بیانیه‌ای گفت: \"من فرصت‌هایی فراتر از هر چیزی که آرزو می‌کردم داشته‌ام، اما زمان‌هایی نیز وجود داشته است که مجبور شده‌ام از فرصت استفاده کنم، روی خودم شرط‌بندی کنم و اعتماد داشته باشم که می‌توانم کارها را به روش خودم انجام دهم. اما من هرگز به تنهایی این راه را طی نکرده‌ام. عشق و حمایت خانواده‌ام، خانواده‌ی جاده‌ای‌ام، و افرادی که به اندازه کافی خوش شانس بوده‌ام که در کنارشان کار کنم، در قلب همه کارهایی که ما به دست آورده‌ایم بوده‌اند. او ادامه داد: با آنها مرا هوتی نامیدند، می‌توانم درباره آن سفر، افراد و تجربیاتی که به من شکل داده‌اند، فکر کنم و جنبه‌ای از داستانم را که ممکن است مردم ندانند به اشتراک بگذارم. داستان‌های پرطرفدار تماشای آریانا گرانده، بن استیلر، رابرت دنیرو در «The Tonight Show» که صدای U2 در «Carnaval", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/darius-rucker-doc.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۲۰:۲۱"}, {"source": "Rolling Stone", "title": "Phil Collins Contemplating Possible Comeback Tour: ‘I Never Say Exactly Never’", "link": "https://www.rollingstone.com/music/music-news/phil-collins-contemplating-comeback-tour-1235654574/", "summary": "Days before his induction into the Rock and Roll Hall of Fame as a solo artist, Phil Collins revealed that his touring days might not be forever behind him", "date_str": "2026-11-09T16:42:06+00:00", "hash": "2317ea447b11e114", "title_fa": "فیل کالینز در حال فکر کردن به تور بازگشت احتمالی: \"من هرگز نمی گویم دقیقا هرگز\"", "summary_fa": "فیل کالینز چند روز قبل از ورودش به تالار مشاهیر راک اند رول به عنوان یک هنرمند انفرادی، فاش کرد که روزهای تور او ممکن است برای همیشه پشت سر او نباشد. کالینز فاش کرد که در فکر بازگشت به جاده است. او گفت، وقتی تمام عمر روی صحنه بودی و طعم آن را چشیدی، متوقف کردن آن دشوار است. من هرگز نمی گویم دقیقا هرگز. هرازگاهی به این فکر می‌کنم، خوب، دوباره به جاده بروم. شما نمی توانید چنین کاری را فقط برای یک دوجین نمایش انجام دهید، زیرا از نظر مالی عملی نیست. بنابراین هر از چند گاهی فکر می کنم که تمام نکرده ام. کالینز پس از پایان تور کوتاه خود به نام Going Back Motown در سال 2010، استراحت طولانی از جاده کرد. هنگامی که او در سال 2017 برای تور Not Dead Yet Live بازگشت، به دلیل آسیب شدید عصبی ناشی از آسیب نخاعی که باعث می‌شد نقاره زدن برای او غیرممکن شود، مجبور شد مدت زمان نمایش را روی صندلی بگذراند. پسر نوجوانش، نیک کالینز، به جای او طبل زد. و علی‌رغم محدودیت‌های فیزیکی فیل، این تور یک موفقیت فوق‌العاده بود که عرصه‌هایی را در سراسر جهان پر کرد. در سال 2021، او Genesis را برای تور خداحافظی Last Domino اصلاح کرد. نیک کالینز یک بار دیگر پشت درام کیت قرار گرفت، و نمایش هر دوره از Genesis را مرور کرد، از جمله چندین آهنگ از دوران تصدی پیتر گابریل به عنوان فرستمن. هنگامی که تور در 26 مارس 2022 در لندن s 02 Arena به پایان رسید، گابریل خود در بین تماشاگران بود.", "image_url": "https://www.rolling sh": "78e7f42db6670726", "title_fa": "گری گلمن مجموعه کمدی ویژه HBO «Grandiloquent» (انحصاری)", "summary_fa": "سریال تک نفره گری گولمن Grandiloquent در قالب یک کمدی ویژه به شبکه HBO می آید. این سریال در ماه دسامبر آغاز به کار خواهد کرد و همچنین برای پخش از HBO Max در دسترس خواهد بود. Grandiloquent با استعدادی تئاتری، مرد 56 ساله متولد ماساچوست را می بیند که داستان هایی از دوران کودکی و تجربیات شکل دهنده خود تعریف می کند. گلمن به این موضوع می پردازد که چگونه اولین [ ] ما گلمن، Grandiloquent را به عنوان یک تولید خارج از برادوی در اوایل سال 2025 آغاز کرد و در تئاتر لوسیل لورتل در نیویورک اقامت گرفت. او همچنین این نمایش را تور کرد و آن را به لس آنجلس، فیلادلفیا، تورنتو، لندن و دیگر شهرهای بزرگ آورد. Grandiloquent سومین پروژه گلمن زیر چتر HBO است، پس از The Great Depresh در سال 2019 که از HBO پخش شد، و 2023s Born on 3rd Base که اولین بار در استریمری که آن زمان به عنوان مکس شناخته می شد، پخش شد. این پنجمین ویژه او در مجموع است. اولین او، مرد پسرانه، در سال 2006 به نمایش درآمد. این ویژه توسط گلمن نوشته و اجرا شده و مایکل بونفیگلیو کارگردانی آن را بر عهده دارد. جیسون واندرمر مدیر فیلمبرداری است و جود آپاتو، برایان استرن، مارک لیبرمن، امیلی کوهن، جاش چرچ، بونفیگلیو، گلمن، کارلی بریگلیا، مایکل لاووی و موریتز فون استولپناگل تهیه‌کنندگی اجرایی آن را بر عهده دارند. گلمن سه دهه را به عنوان یک کمدین استندآپ گذرانده است و در برنامه های شبانه دیوید لترمن، استیون کولبرت، جیمی کیمل، کانن او برین، جی لنو، ست مایرز، کریگ فرگوسن و غیره اجرا کرده است. او همچنین در فیلم پرفروش جوکر ظاهر شد و در سریال Hulu زندگی بث به کارگردانی امی شومر همبازی شد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Grandiloquent_10262026_GE_00234_V2.jpg?crop=354px%2C146px%2C2520px%2C1416px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۸ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "Media City Qatar Supports Regional Productions All the Way to the Big Screen", "link": "https://variety.com/2026/biz/news/media-city-qatar-supports-regional-productions-all-the-way-to-big-screen-1236921546/", "summary": "A year after Media City Qatar announced its support at MIPCOM Cannes 2025, Arabic drama series “Lamma Shefet” and “Kawalees,” developed by licensed company ImagiQ Productions with The Big Picture Studios, have moved from development into production and are now complete. The same journey takes shape across three films: “First to Fly” by Alaqat, “Jodari [ ]", "date_str": "2026-11-09T17:00:00+00:00", "hash": "21e0a3286068fe29", "title_fa": "مدیا سیتی قطر از تولیدات منطقه ای تا حد امکان در صفحه نمایش بزرگ پشتیبانی می کند", "summary_fa": "یک سال پس از اعلام پشتیبانی مدیا سیتی قطر در MIPCOM Cannes 2025، سریال‌های درام عربی \"Lamma Shefet\" و \"Kawalees\" که توسط شرکت دارای مجوز ImagiQ Productions با استودیوی بیگ پیکچر ساخته شده‌اند، از توسعه به مرحله تولید منتقل شده‌اند و اکنون کامل شده‌اند. همین سفر در سه فیلم شکل می‌گیرد: «اولین پرواز» ساخته علاقات، «جوداری [ ] شرکت‌ها می‌توانند در قطر بسازند و تولید کنند و با پشتیبانی مدیا سیتی قطر به خدمات و زیرساخت‌ها متصل شوند. این پنج محصول جهان‌های مختلف، از سرگرمی‌های معاصر گرفته تا ورزش، هویت و جاه‌طلبی شخصی را بررسی می‌کنند. «لما شفت» به کارگردانی دیوید اوریان، فیلمساز برنده جایزه و تهیه کنندگی رونی جازار و مازن فیاد، یک فیلم درام-هیجان‌انگیز 10 قسمتی از ساندرین زینون است که با بازی بازیگران منطقه‌ای تحسین‌شده ایمه سیاح و محمد آل احمد به شهرت رسید. \"Kawalees\" نوشته نادین جابر فیلمنامه نویس برنده جایزه و کارگردانی امیل اسلیاتی، دیما کندلافت در نقش یک روزنامه نگار تحقیقی سابق که پادکست شده بود، یک آلبوم عکس را کشف می کند که به خواننده ای که در دهه 1990 ناپدید شده بود، مرتبط است. همچنین توسط زینون و تهیه کنندگی جزار و فیاد، این فیلم به دنبال کشف او در دنیایی از استثمار و رسوایی در صنعت سرگرمی است. این سه فیلم این محدوده را گسترش می دهند. «اولین پرواز»، فیلمی از رودریگو وازکز سالسی، دو ژیمناست جوان را دنبال می‌کند که در مسابقات قهرمانی جهان با هم در قطر، بلغارستان و ماداگاسکار رقابت می‌کنند. فیلم مستند «جوداری منو» نیزه‌ماهی‌گیر و کارگردان قطری جمال الخنجی را دنبال می‌کند که در تلاش برای فرود آوردن یک ماهی تن دندان سگ رکورددار جهانی است، در سفری عمیقاً شخصی به کاوش در وسواس، مرگ‌ومیر و جستجوی معنا.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Media-City-Qatar.webp?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۸ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "Adobe Unveils 10 Filmmakers Receiving Total of $1 Million in Direct Grants, Forms Film & TV Advisory Board With Lena Waithe, Reggie Hudlin, Kerstin Emhoff and More", "link": "https://variety.com/2026/film/news/adobe-film-tv-fund-filmmakers-direct-grants-advisory-board-1236941355/", "summary": "Adobe is stepping up its efforts to fuel creative work from independent voices in the entertainment biz including directly giving money to creators. In 2024, the digital creative tools and services giant launched the Adobe Film TV Fund, aimed at expanding opportunities for emerging and mid-career filmmakers to get their projects made. Now [ ]", "date_str": "2026-11-09T17:00:00+00:00", "hash": "dbce21157cdf2231", "title_fa": "ادوبی از 10 فیلمساز که مجموعاً 1 میلیون دلار کمک مالی دریافت کرده اند، هیئت مشاوران فیلم و تلویزیون با لنا وایت، رجی هادلین، کرستین امهوف و غیره را تشکیل می دهد.", "summary_fa": "ادوبی تلاش های خود را برای تقویت کار خلاقانه از صداهای مستقل در حوزه سرگرمی از جمله پول دادن مستقیم به سازندگان افزایش می دهد. در سال 2024، غول خدمات و ابزارهای خلاق دیجیتال، صندوق تلویزیونی Adobe Film را با هدف گسترش فرصت‌ها برای فیلمسازان نوظهور و میان دوره‌ای برای انجام پروژه‌های خود راه‌اندازی کرد. اکنون [ ] علاوه بر این، ادوبی تشکیل هیئت مشاوره صندوق تلویزیونی فیلم جدید را با حضور رهبران سرگرمی از جمله لنا وایت، رجی هادلین و کرستین امهوف اعلام کرد. این خبر پیش از کنفرانس Adobe MAX 2026 این شرکت که از 10 تا 12 نوامبر در میامی برگزار می شود، منتشر می شود. ما به هالیوود اعتقاد داریم. لارا بالاز، مدیر ارشد بازاریابی ادوبی، به ورایتی گفت: ما برای دهه ها شریک قابل اعتماد هالیوود بوده ایم. ما می خواهیم فیلمسازانی را که به این جامعه اهمیت می دهیم توانمند کنیم. ما همچنین می‌دانیم که تامین مالی سخت است و می‌توانیم در آن نقش داشته باشیم. او گفت که بودجه مستقیم این شرکت برای سازندگان هیچ محدودیتی ندارد. از زمان راه اندازی، صندوق تلویزیونی Adobe Film بیش از 1000 سازنده را از طریق کمک هزینه تحصیلی، حمایت مالی، راهنمایی و دسترسی به ابزارهای خلاقانه حرفه ای Adobe حمایت کرده است. این شرکت در کنار شرکای غیرانتفاعی و صنعتی از جمله Gold House، Rideback RISE و موسسه ساندنس برای کمک به فیلم‌سازان و رساندن پروژه‌هایشان به مراحل مهم صنعتی مانند ساندنس کار کرده است. ما قصد داریم این جامعه را جشن بگیریم. بالاز گفت که معیشت آنها چیزی است که ما به آن اهمیت می دهیم. او افزود، زمان بسیار هیجان انگیزی برای دیدن ابزارهای مبتنی بر هوش مصنوعی است که در واقع به کل اکوسیستم کمک می کند تا کار کند و ایده های خود را به ثمر برساند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Adobe-Film-TV-Fund-Board-Lena-Waithe-Reggie-Hudlin-Kerstin-Emhoff.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما", "سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "Kanye West Breaks His Own Record for Biggest Rap Concert in U.S. History — Again — With 83,132 Fans", "link": "https://variety.com/2026/music/news/kanye-west-biggest-rap-concert-1236943088/", "summary": "Kanye West broke his own record this past Saturday as his show at Dallas’ AT T Stadium became the most-attended hip-hop concert in U.S. history, with 83,132 fans, and the fifth-highest-grossing concert in U.S. history, with more than $18 million in reported gross revenue generated in a single night, according to his rep. It is the [ ]", "date_str": "2026-11-09T16:49:24+00:00", "hash": "ddbd2b6f2ba90ff2", "title_fa": "کانیه وست رکورد خود را برای بزرگترین کنسرت رپ در تاریخ ایالات متحده شکست - دوباره - با 83132 طرفدار", "summary_fa": "کانیه وست شنبه گذشته رکورد خود را شکست زیرا نمایش او در استادیوم AT T دالاس با 83132 طرفدار به پربازدیدترین کنسرت هیپ هاپ در تاریخ ایالات متحده تبدیل شد و taining to a long deceased son, will soon get its Middle East launch at the Doha Film Festival. After playing positively in Venice and Toronto, Conversation [ ]", "date_str": "2026-11-09T16:49:14+00:00", "hash": "1c0567ff6311adb8", "title_fa": "مویاد علایان درباره درام «گفتگو با دریا» با صحنه اورشلیم: «نمی‌توان از تقریباً دو میلیون فلسطینی که در اسرائیل زندگی می‌کنند اجتناب کرد»", "summary_fa": "درام «مکالمه با دریا» به کارگردانی «معایاد علایان» کارگردان مقیم اورشلیم، درباره یک مرد مسن فلسطینی است که به طور ناگهانی از سوی دادگاه اسرائیلی به پرداخت بدهی کلان تأمین اجتماعی مربوط به پسری که مدت‌هاست درگذشته دستور می‌دهد، به‌زودی در جشنواره فیلم دوحه در خاورمیانه عرضه می‌شود. پس از بازی مثبت در ونیز و تورنتو، گفتگو [ ] تصویری از زندگی فلسطینی در اسرائیل به زودی در جشنواره فیلم دوحه اولین نمایش خاورمیانه ای خود را خواهد داشت. او نقش یک نانوا بیوه سالخورده به نام کمال را بازی می کند که در شهر قدیمی اورشلیم زندگی می کند. کمال یک اخطار کافکایی از دادگاه اسرائیل دریافت می کند که در آن خواستار پرداخت بدهی کلان تامین اجتماعی شده است که گفته می شود پسرش وائل که چندین دهه قبل در دریای سرخ غرق شده بود، بدهکار است، اگرچه هیچ سند رسمی از مرگ پسرش یافت نمی شود. حادثه محرک فیلم الهام گرفته از وقایع واقعی است که برای خانواده هلمر اتفاق افتاده است. به گفته Alayan، آنها منعکس کننده زندگی فلسطینی هایی هستند که در اورشلیم زندگی می کنند، جایی که شما به قول کارگردان روزانه با سربازان و شهرک نشینان مسلح روبرو می شوید. علایان در مورد گفتگو با دریا و ارتباط خاص آن پس از انتخابات اخیر اسرائیل که پس از آن گادی آیزنکوت، رقیب اصلی نخست وزیر بنیامین نتانیاهو، در حال حاضر فرصتی برای تشکیل ائتلاف دولتی اسرائیل با حمایت احزاب عربی که اعضای رسمی ائتلاف او نیستند، دارد، صحبت کرد. بله. سال‌ها پیش، پدرشوهرم و همسرم دستوری از سازمان تامین اجتماعی اسرائیل دریافت کردند که از آنها خواسته بود مبلغ هنگفتی از برادر شوهرم که بیش از 20 سال پیش در اثر غرق شدن درگذشت، بدهکار بودند. این یک شوک برای خانواده بود. واقعا برای همه خیلی احساسی بود. ظاهراً در سیستم آنها، او", "image_url": "https://variety.com/wp-content/uploads/2026/11/Hiwar-ma-albahr-Conversation-With-The-Sea-Portrait-Session-The-83rd-Venice-International-Film-Festival-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "سینما"], "datetime_fa": "۱۸ آبان • ۲۰:۱۹"}, {"source": "Billboard", "title": "Meet the 2026 Latin Grammy Best New Artist Nominees: Aria Vega, Macario Martínez, Delilah & More", "link": "https://www.billboard.com/lists/meet-latin-grammys-2026-best-new-artists-nominees-category/", "summary": "Best New Artist is one of the Latin Grammys’ four General Field categories, placing a newcomer conversation alongside Record, Album and Song of the Year. It is also the category that asks voters to make a bet: not about who had a breakthrough year, but whose voice, point of view or musical world feels like the beginning of something. The award has a history of recognizing artists before they became fixtures. Juanes won in 2001, Calle 13 took the honor in 2006 before becoming one of the most audacious and decorated acts in Latin music, and Karol G won in 2018, years before her global stadium era. Those names are not a forecast for any one nominee, of course, but they underline the category’s particular thrill: sometimes the “new” artist is the next artist who changes the conversation. For 2026, the Latin Recording Academy has assembled 11 nominees across a striking range of geographies and approaches: Mexican indie folk, coastal Colombian rhythms, Brazilian R B, dream-pop, singer-songwriter confessionals and more. The spread is part of the story. Macario Martínez’s roots-minded songs and viral rise sit in a very different lane from maye’s hazy, finely layered pop. Arath Herce’s songwriter craft shares the ballot with ARIA VEGA’s Caribbean-facing pop, while three Brazilian nominees bring distinct perspectives from one of Latin America’s most influential music cultures. Two of those artists, Loulu Gilberto and Zeca Veloso, are also the children of bossa nova and tropicalia icons João Gilberto and Caetano Veloso, respectively — a notable family footnote, but not a substitute for hearing what they make on their own. Here’s a closer introduction to all 11 nominees — what they sound like, the moments that brought them here, and where Billboard readers may already have encountered them — in alphabetical order.", "date_str": "2026-11-09T16:00:00+00:00", "hash": "daaa0c903bd82808", "title_fa": "با نامزدهای بهترین هنرمند جدید جایزه گرمی لاتین 2026 آشنا شوید: آریا وگا، ماکاریو مارتینز، دلیلا و غیره", "summary_fa": "بهترین هنرمند جدید یکی از چهار دسته بخش عمومی گرمی لاتین است که یک مکالمه تازه وارد را در کنار ضبط، آلبوم و آهنگ سال قرار می دهد. همچنین این مقوله ای است که از رای دهندگان می خواهد که شرط بندی کنند: نه در مورد اینکه چه کسی سال موفقیت آمیز داشته است، بلکه در مورد صدا، دیدگاه یا دنیای موسیقی که به نظر می رسد شروع چیزی است. این جایزه سابقه ای در شناخت هنرمندان قبل از تبدیل شدن به فیکسچر دارد. Juanes در سال 2001 برنده شد، Calle 13 در سال 2006 قبل از تبدیل شدن به یکی از جسورانه ترین و آراسته ترین بازیگران موسیقی لاتین این افتخار را به دست آورد، و Karol G در سال 2018، سال ها قبل از دوران استادیوم جهانی او، برنده شد. البته این نام‌ها برای هیچ یک از نامزدها پیش‌بینی نمی‌شوند، اما بر هیجان خاص این دسته تأکید می‌کنند: گاهی اوقات هنرمند «جدید» هنرمند بعدی است که گفتگو را تغییر می‌دهد. برای سال 2026، آکادمی ضبط لاتین 11 نامزد را در طیف وسیعی از جغرافیاها و رویکردها جمع آوری کرده است: موسیقی محلی مکزیکی، ریتم های ساحلی کلمبیایی، R B برزیلی، پاپ رویایی، اعترافات خواننده و ترانه سرا و غیره. گسترش بخشی از داستان است. آهنگ‌های ماکاریو مارتینز که ریشه‌دار هستند و ظهور ویروسی در مسیری بسیار متفاوت از پاپ مه‌آلود و لایه‌های ظریف Maye قرار دارند. هنر ترانه سرای آرات هرس رأی را با موسیقی پاپ کارائیب آریا وگا به اشتراک می گذارد، در حالی که سه نامزد برزیلی دیدگاه های متفاوتی از یکی از تأثیرگذارترین فرهنگ های موسیقی آمریکای لاتین به ارمغان می آورند. دو تن از این هنرمندان، لولو گیلبرتو و زکا ولوسو، به ترتیب فرزندان نمادهای بوسا نوا و ژائو ژیلبرتو و کائتانو ولوسو نیز هستند - یک پاورقی قابل توجه خانوادگی، اما نه جایگزینی", "image_url": "https://www.billboard.com/wp-content/uploads/2025/10/Macario-Martinez-Credit-daviddbarajas-billboard-1800.jpg?w=1024", "category": "سینما و سریال", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Paul Anka, Stevie Wonder, Cher & More Kennedy Center Honorees Who Were Teenagers When They First Hit the Billboard Hot 100 (Full List)", "link": "https://www.billboard.com/lists/kennedy-center-honorees-teenagers-when-first-hit-full-list/", "summary": "Paul Anka was just 15 – two weeks away from turning 16 – when he first made Billboard ’s pop chart in July 1957 with the smash “Diana.” (This was more than a year before Billboard introduced the Hot 100.) Last week, Anka was announced as a 2026 recipient of the Kennedy Center Honors, one of the most prestigious career cappers in the entertainment field. Anka is the 11th artist who later received the Kennedy Center Honors who first hit the Hot 100 as a teenager. Anka was a bona-fide teen idol when he started out, with such teen-targeted hits as “Put Your Head on My Shoulder” and “Puppy Love,” but most of the artists on this list weren’t teen idols, as such. They simply knew what they wanted to do from an early age and got off to a fast start. Related Paul Anka, David Foster Barbara Mandrell Are Among 2026 Kennedy Center Honorees: Complete List In addition to these 11 artists who received Kennedy Center Honors as individuals, two artists who received the Honors as part of a group first made the Hot 100 as teenagers. Pete Townshend was 19 when The Who first made the Hot 100 with “I Can’t Explain” in March 1965. The Who received the Kennedy Center Honors in 2008. Verdine White was 19 when Earth, Wind Fire first made the Hot 100 with “Love Is Life” in July 1971. EWF received the Kennedy Center Honors in 2019. This year’s other Kennedy Center Honorees are songwriter/producer David Foster , actor/director Andy Garcia, playwright David Mamet, and country star Barbara Mandrell . The awards will be presented on Dec. 7 at Capitol One Arena in Washington, D.C. Here’s a complete list of artists who went on to receive the Kennedy Center Honors who first hit the Hot 100 as teenagers. They are listed in chronological order by the year they received the Kennedy Center Honors.", "date_str": "2026-11-09T15:37:02+00:00", "hash": "58629c302f368c88", "title_fa": "پل آنکا، استیوی واندر، شر و دیگر برگزیدگان مرکز کندی که برای اولین بار در بیلبورد هات 100 نوجوان بودند (فهرست کامل)", "summary_fa": "پل آنکا تنها 15 سال داشت - دو هفته تا 16 سالگی - وقتی برای اولین بار در ژوئیه 1957 با آهنگ فوق العاده \"دیانا\" در جدول پاپ بیلبورد قرار گرفت. (این بیش از یک سال قبل از معرفی Billboard Hot 100 بود.) هفته گذشته، Anka به عنوان دریافت کننده افتخارات مرکز کندی در سال 2026 معرفی شد، یکی از معتبرترین بازیگران حرفه ای در زمینه سرگرمی. آنکا یازدهمین هنرمندی است که بعداً افتخارات مرکز کندی را دریافت کرد و اولین بار در نوجوانی موفق به کسب رتبه 100 شد. آنکا زمانی که شروع به کار کرد، یک بت نوجوان خوب بود، با آثاری مانند «سرت را روی شانه من بگذار» و «عشق توله سگ»، اما اکثر هنرمندان این فهرست به این ترتیب بت های نوجوان نبودند. آنها به سادگی می دانستند که چه کاری می خواهند انجام دهند و به سرعت شروع کردند. مرتبط پل آنکا، دیوید فاستر باربارا ماندرل در میان برگزیدگان سال 2026 مرکز کندی هستند: فهرست کامل علاوه بر این 11 هنرمندی که به صورت انفرادی جوایز مرکز کندی را دریافت کردند، دو هنرمندی که به عنوان بخشی از یک گروه این افتخارات را دریافت کردند، ابتدا در نوجوانی موفق به کسب جایزه Hot 100 شدند. پیت تاونشند ۱۹ ساله بود که اولین بار The Who با «I Can't Explain» در مارس 1965، Hot 100 را ساخت. The Who در سال 2008 افتخارات مرکز کندی را دریافت کرد. وردین وایت 19 ساله بود که Earth, Wind Fire برای اولین بار با «Love Is Life» در ژوئیه 1971 به فیلم Hot 100 رسید. EWF در سال 2019 جوایز افتخاری مرکز کندی را دریافت کرد. دیگر افتخارآفرینان مرکز کندی امسال دیوید فاستر، ترانه‌سرا/تهیه‌کننده، بازیگر/کارگردان اندی گارسیا، و رایت گارسیا کا  واشنگتن دی سی را منعکس می‌کند، در اولویت قرار می‌دهد». مستندهای منتخب برای مشاهده در منطقه مترو D.C در سرویس پخش WETA+ در weta.org/wetaplus در دسترس خواهند بود. دوین کارامبلاس، معاون برنامه‌ریزی و عملیات تلویزیونی در WETA گفت: «ما مفتخریم که سازمان رسانه‌ای عمومی برای منطقه D.C هستیم که از داستان سرایی ریشه‌دار در جامعه ما دفاع می‌کند. «منطقه واشنگتن دی سی مملو از داستان ها و داستان سرایان خارق العاده است، و ما هیجان زده هستیم که با تیم فوق العاده DC/DOX در این ابتکار جدید شریک شویم. ما نمی‌توانیم منتظر بمانیم تا فیلم‌های منتخب را در مقصد خودمان برای فیلم‌های مستند، WETA+، با بینندگان خود به اشتراک بگذاریم.» در ددلاین تماشا کنید", "image_url": "https://deadline.com/wp-content/uploads/2026/11/WETA-DC-DOX-split-image-1000.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["سینما", "سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۱۹:۳۰"}, {"source": "Deadline", "title": "Emily Watson To Lead ‘John Daniel’, Dominic Cooke’s Drama About Unlikely Friendship Between English Woman And Baby Gorilla", "link": "https://deadline.com/2026/11/emily-watson-leading-john-daniel-dominic-cooke-drama-1237217226/", "summary": "Emily Watson (Hamnet, Chernobyl) has been cast in the lead role in Dominic Cooke’s British drama John Daniel. She will play Alyce Cunningham, a fiercely independent English woman who strikes up an unlikely friendship with a baby gorilla in the aftermath of the First World War. Based on a true story, the screenplay was written [ ]", "date_str": "2026-11-09T16:00:00+00:00", "hash": "5e61f5bb4103c89d", "title_fa": "امیلی واتسون کارگردانی «جان دانیل»، درام دومینیک کوک درباره دوستی بعید بین زن انگلیسی و بچه گوریل", "summary_fa": "امیلی واتسون (همنت، چرنوبیل) برای نقش اصلی در درام بریتانیایی جان دانیل به کارگردانی دومینیک کوک انتخاب شده است. او نقش آلیس کانینگهام، یک زن انگلیسی به شدت مستقل را بازی خواهد کرد که پس از جنگ جهانی اول، با یک بچه گوریل دوستی غیرمحتمل برقرار می کند. بر اساس یک داستان واقعی، فیلمنامه نوشته شد [] امیلی واتسون (همنت، چرنوبیل) برای نقش اصلی در درام ب دلین طولانی نمی‌ماند، و حتی اگر او در عنوان نام گروهش را ذکر می‌کند، داستان‌های Go-Go کمتر از نیمی از محتوای آن را تشکیل می‌دهند. در عوض، او جزئیات بسیاری از روابط دشوار خود را توضیح می دهد، توضیح می دهد که چگونه جنبش #MeToo زندگی او را تغییر داد، برای مشکلات آلبوم هایی مانند Cold (که با گروهش Frosted در سال 1996 منتشر شد، در طول حرفه انفرادی او که متاسفانه نادیده گرفته", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/jane-wiedlin-memoir-LEAD.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۹:۱۳"}, {"source": "Rolling Stone", "title": "Is This Pete Hegseth’s Last Stand?", "link": "https://www.rollingstone.com/politics/politics-features/pete-hegseth-last-stand-pentagon-1235654580/", "summary": "After last week's blue wave, the Defense Secretary's reign of incompetence at the Pentagon may be on its last legs", "date_str": "2026-11-09T15:39:10+00:00", "hash": "8c20fe18a77bdd68", "title_fa": "آیا این آخرین موضع پیت هگزث است؟", "summary_fa": "پس از موج آبی هفته گذشته، سلطنت وزیر دفاع از بی کفایتی در پنتاگون ممکن است در آخرین پاهای خود باشد. پس از انتخابات روز سه‌شنبه، به نظر می‌رسد که هگزت کسی است که می‌خواهد از این موضوع مطلع شود. منابعی در کاپیتول هیل و در محافل نظامی فکر می کنند که دوران هگزت در پنتاگون در حال پایان است. توماس ماسی، یک جمهوری خواه اهل کنتاکی، در حال برنامه ریزی برای معرفی مقالات استیضاح این هفته است. اما مقامات دفاعی هشدار می دهند که وزیر دفاع جنگنده از اشتباهات متعدد جان سالم به در برده است. در پاسخ به درخواست‌ها برای استیضاح و اخراج، هگزت یک کمپین روابط عمومی هماهنگ با یک ویدیو و عکس‌های کوتاه در سراسر کانال‌های رسانه‌های اجتماعی پنتاگون از هگزث با «ایستادن، مبارزه، دفاع از جمهوری» را راه‌اندازی کرد. شعار شان پارنل، سخنگوی ارشد پنتاگون می گوید که هگزت در مواجهه با «شکار جادوگران ساختگی» و «تحقیقات ساختگی» از اجرای دستور کار پرزیدنت ترامپ منصرف نخواهد شد. پارنل می گوید که هگزت متعهد به رهبری وزارت دفاع تا پایان دوره ریاست جمهوری ترامپ است. ترامپ تاکنون از هگزت حمایت می‌کند و به خبرنگاران گفته است که وزیر کارش را خوب انجام می‌دهد، اما گزارش‌های قبل از انتخابات حاکی از آن است که رئیس‌جمهور از مشاورانش پرسیده است که آیا هگزت باید بماند یا خیر. جیمز آر. وب، کهنه سرباز نیروی دریایی عراق که به عنوان دستیار قانونگذاری نظامی برای سناتور رند پل کار می کرد، به من می گوید: «به نظر می رسد روزهای او به طور جدی به پایان رسیده است. اگر او را نگه دارند، احتمالاً اولین کسی خواهد بود که توسط کنگره جدید استیضاح می‌شود.»", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/hegseths-future-thin-ice.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۱۹:۰۹"}, {"source": "Rolling Stone", "title": "Farewell to Richard Lloyd, the Wild Guitar Boy at the Heart of Television", "link": "https://www.rollingstone.com/music/music-features/richard-lloyd-television-guitarist-tribute-1235654514/", "summary": "Remembering the virtuoso who brought a sense of mischief and adventure to everything he played", "date_str": "2026-11-09T15:26:00+00:00", "hash": "c04d2047383c656a", "title_fa": "وداع با ریچارد لوید، پسر گیتار وحشی در قلب تلویزیون", "summary_fa": "به یاد هنرپیشه ای که حس بدجنسی و ماجراجویی را به همه چیزهایی که نواخت. لوید در مشارکت پر فراز و نشیب خود با تام ورلین، تلویزیون را به یکی از بهترین گروه‌های گیتار در تمام دوران تبدیل کرد. او روز شنبه در 75 سالگی پس از مبارزه با سرطان درگذشت. اما او یک عمر جادوی راک را با تلویزیون خلق کرد، در آثار کلاسیکی مانند \"Marquee Moon\"، \"Little Johnny Jewel\" و \"Days\". تلویزیون به سختی به مدت پنج سال و دو آلبوم به هم چسبیده بود - با این حال این کافی بود تا صدای موسیقی گیتار را از آن زمان تغییر دهد. آن‌ها هرگز در پخش رادیویی آمریکایی هیچ عکسی دریافت نکردند، اما الهام‌بخش افراد تازه‌کار در سراسر جهان، مانند R.E.M.، U2، Sonic Youth و Radiohead بودند. لوید بسیاری از خیره‌کننده‌ترین سولوهای آن‌ها را نواخت، مانند «Elevation»، «Guiding Light» یا «See No Evil»، جایی که گیتار او تمام «نیازهای مخرب» را که ورلین درباره آن می‌خواند خلاصه می‌کند ت واجد شرایط آزادی مشروط خواهد بود، اما تنها پس از گذراندن دو سوم دوران محکومیت خود. این بدان معناست که او حداقل هفت سال را پشت میله های زندان سپری خواهد کرد و در صورت آزادی مشروط، باید باقیمانده دوران محکومیت خود را تحت نظارت و با رعایت قوانین خاص بگذراند. قبل از صدور حکم زندان برای برند، قاضی جوئل بناتان توضیح داد که چگونه به مجازات محکوم می شود و بسیاری از شهادت زنانی را که ادعاهایشان منجر به محکومیت برند شده است، بازگو کرد. در بسیاری از موارد، بناتان در امان نبود. او بارها برند را یک شکارچی جنسی نامید، از \"غرور خیره کننده\" کمدین انتقاد کرد و او را مورد انتقاد قرار داد \"با این باور که شهرت به این معنی است که می توانی هر زمان که دوست داری هر طور که دوست داری رفتار کنی، بدون اینکه قوانینی که افراد شایسته زندگی می کنند\" (از طریق The Guardian).", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/GettyImages-2303156520.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۱۸:۰۰"}, {"source": "Hollywood Reporter", "title": "Emily Watson Cast in British Drama From Dominic Cooke ‘John Daniel’", "link": "https://www.hollywoodreporter.com/movies/movie-news/emily-watson-john-daniel-gorilla-film-dominic-cooke-1236750796/", "summary": "Based on a true story, the film stars the 'Hamnet' actress as an Englishwoman who befriends a baby gorilla in 1918.", "date_str": "2026-11-09T16:00:00+00:00", "hash": "022d9c61023892c8", "title_fa": "امیلی واتسون بازیگران درام بریتانیایی از دومینیک کوک «جان دانیل»", "summary_fa": "این فیلم که بر اساس یک داستان واقعی ساخته شده است، بازیگر زن «همنت» در نقش یک زن انگلیسی است که در سال 1918 با یک بچه گوریل دوست می شود. امیلی واتسون رهبری درام بریتانیایی آینده دومینیک کوک را بر عهده خواهد داشت. نامزد دوبار آکادمی و بفتا که بیشتر به خاطر بازی در فیلم های Breaking the Waves، Hamnet و Chernobyl شناخته می شود، در این فیلم نقش آلیس کانینگهام را بازی خواهد کرد. جان دانیل بر اساس داستان واقعی غیرمعمول دوستی غیرمحتمل بین یک زن انگلیسی مستقل و یک بچه گوریل در عواقب جنگ ج ": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۱۹:۰۵"}, {"source": "Billboard", "title": "Publishers Quarterly: Sony Music Publishing Makes History Again in Q3", "link": "https://www.billboard.com/pro/ella-langley-sony-top-music-publisher-rankings-q3/", "summary": "This year, Sony Music Publishing keeps topping its own record-breaking performances as measured by Billboard ’s 20-year-long history of ranking music publishers by market share for hit songs. After scoring the highest-ever market share for the Hot 100 in the second quarter with 37.32%, Sony has now become the first publisher ever to surpass the 40% market share milestone with 42.86% in the just-completed third quarter, setting a new record for that chart. Related 2026 Q3 Record Label Market Share: UMG Rebounds, Columbia Climbs Michael Sanft, Attorney Who Represented Keffe D in 2Pac Murder Trial, Dies at 54 Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 That performance makes Sony the top-ranked publisher for the Hot 100 chart, while it was also the No. 1 publisher on the Top Radio Airplay chart, with a 36.02% tally, thus keeping its No. 1 streak going on both charts for the sixth consecutive quarter. To accomplish that feat, Sony claimed 76 songs on the Hot 100 chart and 74 songs on the Radio Airplay Songs list, including Ella Langley ’s “Choosin’ Texas,” which finished at No. 1 and No. 2, respectively. Also helping Sony maintain its No. 1 ranking was its role as the administrator for the top songwriter on the Radio Airplay chart, Shane “ sombr ” Boose, who placed three songs on that chart, including the No. 30 tune “Back To Friends.” Perhaps the most astounding part of Sony’s performance on the Hot 100 publisher rankings this quarter is that it beat out the No. 2 publisher by 25 percentage points. Coming in second place this quarter was Warner Chappell Music, which turned in a 17.86% market share on the Hot 100 rankings. On the Top Radio Airplay rankings, Warner Chappell was also the No. 2-ranked publisher with a stronger showing, where it tallied a 23.07% market share. On the Top Radio Airplay song list, Warner Chappell snared a stake in 55 songs, with its top song being the No. 3 tune, Bruno Mars ’ “Risk It All.” It also had 44 songs on the Hot 100 chart, with its top song, Ariana Grande ’s “hate that I made you love me,” landing at No. 4. This marks the third consecutive quarter that Warner Chappell ranked at No. 2 on both charts. For the 12th consecutive quarter, Warner Chappell was also the top-ranked publisher on the Country Radio Airplay chart with a 33.12% share. Similarly, for the third consecutive quarter, Universal Music Publishing Group, Kobalt and BMG ranked, respectively, No. 3, No. 4 and No. 5 on both ch", "date_str": "2026-11-09T15:00:00+00:00", "hash": "b481cc1351af6eb7", "title_fa": "فصلنامه ناشران: انتشارات موسیقی سونی دوباره در سه ماهه سوم تاریخ می‌سازد", "summary_fa": "امسال، Sony Music Publishing همچنان در صدر اجراهای رکوردشکن خود قرار دارد که با سابقه بیست ساله بیلبورد در رتبه‌بندی ناشران موسیقی بر اساس سهم بازار برای آهنگ‌های موفق اندازه‌گیری شده است. پس از کسب بالاترین سهم بازار برای Hot 100 در سه ماهه دوم با 37.32 درصد، سونی اکنون به اولین ناشر تبدیل شده است که از 40 درصد سهم بازار با 42.86 درصد در سه ماهه سوم که به تازگی تکمیل شده است، پیشی گرفته و رکورد جدیدی را برای این نمودار ثبت کرده است. سه‌ماهه سوم سال 2026 سهم بازار مرتبط: UMG Rebounds، Columbia Climbs Michael Sanft، وکیل مدافع Keffe D در دادگاه قتل 2Pac، فوت در 54 سالگی Kenny MacPherson، ناشر کهنه کار موسیقی و بنیانگذار Big Deal Music، سونی را در رتبه 70 منتشر کرد. نمودار، در حالی که با 36.02 درصد در رتبه اول ناشر در چارت Top Radio Airplay قرار داشت، بنابراین ردیف شماره 1 خود را برای ششمین سه ماهه متوالی در هر دو نمودار حفظ کرد. برای انجام این موفقیت، سونی 76 آهنگ را در جدول Hot 100 و 74 آهنگ را در لیست آهنگ های Radio Airplay Songs از جمله \"Choosin' Texas\" از الا لنگلی، که به ترتیب در رتبه های 1 و 2 قرار گرفت، به دس th annual Grammy Awards ran from Aug. 31, 2025, through Aug. 28, 2026. The field of likely album of the year contenders hasn’t changed much since we first previewed them in July . I bumped Don Toliver ’s Octane up from “Within Reach” to the top tier, taking the place of RAYE ’s This Music May Contain Hope., which is competing with a more commercially successful album by another classy English pop-soul singer, Olivia Dean . Both albums could make it, of course, but with many strong albums vying for just eight slots on the final ballot, something’s gotta give. Related Categories With the Most Fewest Entries for 2027 Grammys Paul McCartney and Taylor Swift are both going for history. If McCartney is nominated for The Boys of Dungeon Lane , it will be his record-extending 10th career nomination in this category. If Swift is nominated for The Life of a Showgirl , it will be her eighth nod in this category — more than anyone else in Grammy history for strictly solo albums. Swift is a better bet: She has been nominated in this category with each of her last four regular studio albums. McCartney was last nominated here in 2006. We show the deluxe editions of hit albums by Noah Kahan and Rosalía because those are the ones that were entered in the Grammy competition. A total of 683 albums were on the eligibility list in this category. Here are our best ", "date_str": "2026-11-09T15:00:00+00:00", "hash": "fc9b46bdc978d0e1", "title_fa": "پیش بینی های نهایی نامزدهای گرمی 2027: آلبوم سال", "summary_fa": "زمانی که نامزدهای شصت و نهمین جوایز سالانه گرمی در روز دوشنبه (16 نوامبر) اعلام شود، احتمالاً سال رویایی الا لنگلی به اوج خود می رسد. به لطف تغییر قانون در رده بهترین هنرمند جدید که در ماه ژوئن اعلام شد، که به یک هنرمند اجازه می‌دهد به جای سه بار، چهار بار وارد شود، لنگلی می‌تواند در چهار مورد از شش دسته کلی رشته - آلبوم، ضبط و آهنگ سال به علاوه بهترین هنرمند جدید نامزد شود. اگر این اتفاق بیفتد، لنگلی اولین هنرمند متقاطع کانتری خواهد بود که پس از بابی جنتری در سال 1968 به این شاه  Minutes Michael Jackson s Thriller Scares Up Highest Rank on Billboard 200 Albums Chart in More Than 40 Years According to People magazine, Timberlake walked the runway with his 7-year-old niece, Zaya, while attending the nonprofit s Be Beautiful Be Yourself fashion show in the Mile High city in support of brother-in-law Justin Biel and his wife Rose s daughter, who has Down syndrome. “Jessica and I adore Zaya, and we couldn’t be prouder of the remarkable difference she is making in the world,” Timberlake said in a statement shared with the organization, the magazine reported. “Every person with Down syndrome deserves the opportunity to reach their full potential, and that’s why GLOBAL’s work means so much to our family.” In an Instagram Story featuring a picture of the singer, his sons and Zaya, he wrote , We walked my beautiful niece Zaya down the @globaldownsyndrome runway last night ❤️. He followed that with a slide in which he held a smiling Zaya in his arms on the red carpet, with the caption Proud uncle! In photos from the night, Zaya held her uncle and cousin Silas hands as she walked down the catwalk with a big smile. The Timberlake men came dressed to impress, with Justin rocking a roomy black suit, while Phineas matched his dad s energy in all black and Silas opted for black pants with a black leather jacket over a white shirt and black tie, accented by sunglasses. Zaya made her own statement in a black-and-white polka dot cress and fringe boots. In a video from the event , JT and Silas bust some moves as Zaya gets a boost up onto the singer s hip as they wave to the crowd. She has some moves. Maybe her uncle Justin has taught her some moves and her auntie Jessica, says the show s announcer to cheers from the audience. The organization teased the appearance last week, posting a pic of Timberlake and wife Jessica Biel with her brother and his wife, writing, 🎉 BIG NEWS! Grammy and Emmy Award-winning superstar @justintimberlake will rock the runway with his beautiful niece, #GLOBALAmbassador alum Zaya Biel @", "date_str": "2026-11-09T14:21:20+00:00", "hash": "b5c07c1ca0a26513", "title_fa": "حضور نادر جاستین تیمبرلیک با پسران و خواهرزاده‌اش در ران وی در فشن شوی بنیاد سندروم داون", "summary_fa": "جاستین تیمبرلیک با دو پسر خردسال خود، سیلاس 11 ساله و فینیاس 6 ساله، در حالی که خانواده در روز شنبه (7 نوامبر) در دنور گرد هم آمدند تا نوزدهمین نمایشگاه مد سالانه بنیاد جهانی سندروم داون را جشن بگیرند، حضور نادری در عموم داشت. تیلور سوئیفت و کارلی کلوس مرتبط در بازی تراویس کلس در کانزاس سیتی حضور دارند. بیش از 40 سال به نقل از مجله People، تیمبرلیک در حالی که برای حمایت از برادر شوهر جاستین بیل و همسرش دخترش رز مبتلا به سندروم داون در نمایشگاه مد غیرانتفاعی Beautiful Be Yourself در شهر مایل بالا شرکت می کرد، همراه با خواهرزاده 7 ساله خود، زایا، روی باند فرودگاه رفت. تیمبرلیک در بیانیه‌ای که با این سازمان به اشتراک گذاشته شد، گفت: من و جسیکا زایا را می‌پرستیم و نمی‌توانیم به تفاوت قابل توجهی که او در جهان ایجاد می‌کند افتخار کنیم. هر فرد مبتلا به سندرم داون سزاوار این فرصت است که به پتانسیل کامل خود دست یابد و به همین دلیل است که کار GLOBAL برای خانواده ما بسیار مهم است. او در استوری اینستاگرامی با تصویری از این خواننده، پسرانش و زایا، نوشت: دیشب خواهرزاده زیبایم زایا را در باند فرودگاه @globaldownsyndrome پیاده کردیم. او آن را با یک اسلاید دنبال کرد که در آن زایا خندان را روی فرش قرمز در آغوش گرفته بود، با نوشته عموی مغرور! در عکس‌هایی از شب، زایا در حالی که با لبخندی بزرگ از سکوی راه می‌رفت، دست عمو و پسر عمویش سیلاس را گرفته بود. مردان تیمبرلیک با لباس پوشیدن آمدند تا تحت تأثیر قرار بگیرند، جاستین یک کت و شلوار مشکی جادار را تکان می داد، در حالی که فینیاس با انرژی پدرش به رنگ مشکی کاملاً هماهنگ می شد و سیلاس شلوار مشکی را با کت چرمی مشکی روی پیراهن سفید و کراوات مشکی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2304072901-e1794234332591.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۱۷:۵۱"}, {"source": "Billboard", "title": "NCT DREAM Takes a Nostalgic Trip With ‘Boogie Woogie’ Video: Exclusive Behind-the-Scenes Photos", "link": "https://www.billboard.com/photos/nct-dream-boogie-woogie-video-behind-the-scenes-photos-1236375284/", "summary": "RENJUN, JENO, HAECHAN, JAEMIN, CHENLE and JISUNG were first introduced as NCT DREAM , the colorful and bright teenage unit within NCT 10 years ago, and have since grown into one of K-pop’s leading acts while maintaining their roots musically with themes of youth and self-discovery. The group’s music has continued to evolve alongside the members and their fans, with everything they experienced together over the past decade. Now, following the six members’ contract renewal with label SM Entertainment, NCT DREAM enters a new chapter and celebrates this milestone with its sixth studio album, DREAM AFTER DREAM , which arrived Nov. 9. Related A Release Calendar of Upcoming Albums in 2026 The album features lead track “Boogie Woogie,” a song that JENO describes to Billboard as “a celebration of the past 10 years we’ve shared with our fans, and a way for us to all have fun together.” That celebratory spirit and the brotherhood the members have built together come to life in exclusive photos shared with Billboard from the set of the “Boogie Woogie” music video, which was released the same day as the album. “Boogie Woogie” blends ’70s disco-funk influences with modern synths, capturing the joy of looking back on the past while embracing everything still to come, and its music video reflects that same celebratory spirit. Cowritten by JAEMIN, the track features lyrics that commemorate NCT DREAM’s decade together, expressing gratitude for the memories they’ve shared and how even the simplest moments become meaningful when spent together. The group’s brotherhood is a recurring theme throughout DREAM AFTER DREAM , as shown in the music video for the album’s opening track, “The Sun,” just a few weeks before the album s arrival. JENO sums up the “Boogie Woogie” music video in three words: retro, quirky and celebration. “The music video features nostalgic spots for us, like a neighborhood stationery store, a Korean snack bar, a shopping mall and a bowling alley, which really give it that retro feel, he tells Billboard . It s also packed with unexpected, funny moments, like a swing spinning 360 degrees or someone suddenly popping out of a fridge!” See Billboard s exclusive photos from the music video s set below.", "date_str": "2026-11-09T14:03:23+00:00", "hash": "9c4341d706e87f89", "title_fa": "NCT DREAM با ویدیوی «Boogie Woogie» سفری نوستالژیک می‌کند: عکس‌های اختصاصی از پشت صحنه", "summary_fa": "RENJUN، JENO، HAECHAN، JAEMIN، CHENLE و JISUNG برای اولین بار به عنوان NCT DREAM، واحد نوجوانان رنگارنگ و روشن در NCT 10 سال پیش معرفی شدند و از آن زمان به یکی از کنش های برجسته کی پاپ تبدیل شدند و در عین حال ریشه های خود را از نظر موسیقی با مضامین جوانی و خودشناسی حفظ کردند. موسیقی این گروه در کنار اعضا و طرفدارانشان، با هر آنچه که در دهه گذشته با هم تجربه کردند، به تکامل خود ادامه داده است. اکنون، پس از تمدید قرارداد شش عضو با لیبل SM Entertainment، NCT DREAM وارد فصل جدیدی شده و این نقطه عطف را با ششمین آلبوم استودیویی خود، DREAM AFTER DREAM، که در 9 نوامبر عرضه شد، جشن می گیرد. مربوط به تقویم انتشار آلبوم‌های آینده در سال 2026 این آلبوم دارای آهنگ اصلی «Boogie Woogie» است، آهنگی که JENO آن را به بیلبورد به عنوان «جشن 10 سال گذشته که با طرفداران خود به اشتراک گذاشته‌ایم، و راهی برای همه ما برای خوشگذرانی با هم» توصیف می‌کند. این روحیه جشن و برادری که اعضا با هم ایجاد کرده‌اند در عکس‌های اختصاصی به اشتراک گذاشته شده با بیلبورد از مجموعه موزیک ویدیوی «Boogie Woogie» که در همان روز آلبوم منتشر شد، زنده می‌شوند. \"Boogie Woogie\" تأثیرات دیسکو-فانک دهه 70 را با ترکیبات مدرن ترکیب می کند و لذت نگاه کردن به گذشته را در حالی که همه چیزهای آینده را در آغوش می کشد به تصویر می کشد و موزیک ویدیوی آن همان روحیه جشن را منعکس می کند. این آهنگ که توسط JAEMIN نوشته شده است، دارای اشعاری است که به یاد دهه NCT DREAM با هم هستند، و از خاطراتی که آنها به اشتراک گذاشته‌اند و اینکه ند: پروژه هایی از وانگ بینگ، ریچل لی جونز، ویتالی مانسکی، خوانجو پریرا، لیانگ ژائو. فضانورد، اما الهام از طریق ارتباط خانوادگی و تجربه جابجایی خود، آن را عمیقاً شخصی می کند. \"این چشم اندازی فراتر از سرفصل ها در مورد افغانستان ارائه می دهد، و دیدن این فیلم که با تماشاگران در سراسر جهان طنین انداز شد، باورنکردنی بود. من مفتخرم که از الهام و تیم در ادامه سفرش حمایت می کنم.\" در ددلاین تماشا کنید این فیلم به دنبال سفر مومند به فضا در سال 1988 به عنوان بخشی از ماموریت شوروی است. داستان او و در این روند، داستان افغانستان در این دوران را به تصویر می کشد. کوتاه قبلی احساس، زرد، نامزد بفتا شد و در فهرست نهایی جوایز اسکار در سال 2024 قرار گرفت. او فیلم مرد فضایی فراموش شده را نوشت و کارگردانی کرد که داستان خانواده خودش را نیز روایت می‌کند، پدرش اولین کسی بود که با مومند پس از بازگشت به زمین مصاحبه کرد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/forgotten_spaceman.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۸ آبان • ۱۷:۵۴"}, {"source": "Rolling Stone", "title": "Dashboard Confessional Announce 2027 Unplugged: 25th Anniversary Tour", "link": "https://www.rollingstone.com/music/music-news/dashboard-confessional-unplugged-25th-anniversary-tour-2027-1235654504/", "summary": "The tour will celebrate the emo band's 2002 performance on MTV's Unplugged", "date_str": "2026-11-09T14:16:26+00:00", "hash": "9b8ed90d64211e22", "title_fa": "Dashboard Confessional Annance 2027 Unplugged: 25th Anniversary Tour", "summary_fa": "این تور، اجرای گروه ایمو در سال 2002 را در داشبورد Unplugged MTV جشن خواهد گرفت. این سفر در 12 مارس در شیکاگو آغاز می شود و تا 3 آوریل ادامه می یابد، زمانی که در سانفرانسیسکو به پایان می رسد. شهرهایی مانند نیویورک، بوستون، نشویل و لس آنجلس را تحت تاثیر قرار خواهد داد. کریس کارابا در بیانیه‌ای گفت: \"Dashboard Confessional's Unplugged لحظه ای محوری و متحد کننده برای گروه و طرفداران ما بود. من بسیار هیجان زده هستم که آن لحظه را در زمان جشن می گیرم. اخیراً برخی از نمایش های آکوستیک انفرادی کوچک و هیجان انگیز را در نشویل، نیویورک و لس آنجلس اجرا کرده ام - انرژی در اطراف آن برنامه ها برقی بود. من هیجان زده هستم که این روحیه را به سالن های بزرگتر با ترتیبات گروه از اجرای اصلی ما Unplugged منتقل کنم. داشبورد Confessional در ۲۴ آوریل ۲۰۰۲ در سریال Unplugged MTV اجرا کرد. این آلبوم به‌عنوان یک آلبوم با نام MTV Unplugged 2.0 در دسامبر آن سال، یک سال قبل از آلبوم جدیدشان در سال 2003، A Mark, a Mission, a Brand, a Scar منتشر شد. اطلاعات بلیط برای تور در وب سایت گروه موجود است. پیش فروش کلوپ هواداران Saints Sailors از 12 نوامبر ساعت 9 صبح محلی آغاز می شود. پیش فروش هنرمند از 12 نوامبر ساعت 10 صبح محلی آغاز می شود. داستان‌های پرطرفدار تماشا کنید آریانا گرانده، بن استیلر، رابرت دنیرو در برنامه امشب حضور دارند، صدای U2 احیا شده در Carnaval de Luz Del Casher، نوازنده گیتاریست که پدال Wah-Wah را اختراع کرد، در 88 سالگی مرده است.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/DC-PRESS-PHOTOS-CROPPED-2-1.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۷:۴۶"}, {"source": "Hollywood Reporter", "title": "Donnie Dunagan, Original Voice of Bambi, Dies at 92", "link": "https://www.hollywoodreporter.com/movies/movie-news/donnie-dunagan-dead-bambi-son-frankenstein-1236750818/", "summary": "The future U.S. Marine also appeared as a youngster in the horror films ‘Son of Frankenstein’ and ‘Tower of London’ during his brief stay in Hollywood.", "date_str": "2026-11-09T14:22:14+00:00", "hash": "e11716b305e3337d", "title_fa": "دانی دانگان، صدای اصلی بامبی، در ۹۲ سالگی درگذشت", "summary_fa": "تفنگدار آمریکایی آینده همچنین در طول اقامت کوتاه خود در هالیوود به عنوان یک جوان در فیلم های ترسناک «پسر فرانکشتاین» و «برج لندن» ظاهر شد. دانی داناگان که صدای بامبی را برای فیلم کلاسیک اصلی دیزنی ارائه کرد و در دو فیلم در کنار باسیل راتبون و بوریس کارلوف بازی کرد، پیش از دریافت سه جایزه Purple Hearts به عنوان تفنگدار دریایی آمریکا، درگذشت. نویسنده و مورخ فیلم تام ویور گزارش داد که او 92 سال داشت. داناگان روز چهارشنبه بر اثر سرطان ریه درگذشت. داناگان مو بور و مجعد شیرینی به فیلم های ترسناک یونیورسال 1939 پسر فرانکشتاین و برج لندن اضافه کرده بود که مادرش به تماس تلفنی کسی جز خود والت دیزنی در خانه خانواده در وست وود پاسخ داد. داستان‌های مرتبط تلویزیون الن دی جنرس، تهیه‌کننده نمایش الن دی جنرس، فیلم‌های فاش شد علت مرگ اثر متیو رایت، پل هاوارد، پسر مو هوارد از The Three Stooges، در سن 91 سالگی می‌میرد، داناگان در مصاحبه جدید خود به یاد می‌آورد که رئیس استودیو از کودک می‌خواست «به هنرمندش کمک کند تا بیان یک کودک را روی گوزن نشان دهد.» در بربنک دیری نگذشت که داناگان روی بامبی (1942) کار کرد و او بیش از یک سال را صرف این فیلم انیمیشن کرد. در یکی از احساسی ترین سکانس های فیلم، شخصیت دم سفید او پس از تعقیب آنها در جنگل توسط یک شکارچی برای مادرش فریاد می زند. او در سال 2011 گفت: «این را خوب به یاد دارم. وقتی به من گفتند که با کمی استرس بگویم: «مادر... مادر»، حتماً آن لحن ترسی که داستان نیاز داشت را نداشتم. یک مربی، فکر می‌کنم خانم خوبی در استودیو بود، از من پرسید که اگر مادر واقعی‌ام گم شود و در خطر بزرگی قرار بگیرد، چگونه با صدای بلند گریه می‌کنم. این کار را آسان کرد.»", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/03/Donnie-Dunagan-Obit-Template-Headshot-Getty-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۸ آبان • ۱۷:۵۲"}, {"source": "Hollywood Reporter", "title": "SiriusXM Names Tubi CEO Anjali Sud New Leader", "link": "https://www.hollywoodreporter.com/business/digital/siriusxm-names-tubi-ceo-anjali-sud-new-leader-1236750788/", "summary": "The exec will take over as CEO of the audio giant as Jennifer Witz steps down.", "date_str": "2026-11-09T13:12:54+00:00", "hash": "2adc571755bf5b98", "title_fa": "SiriusXM مدیر عامل Tubi، Anjali Sud New Leader را معرفی کرد", "summary_fa": "با کناره گیری جنیفر ویتز، مدیر اجرایی این غول صوتی به عنوان مدیرعامل شرکت خواهد کرد. جنیفر ویتز، مدیر عامل SiriusXM، از سمت خود کناره گیری می کند و آنجلی سود، مدیر عامل توبی، قرار است مسئولیت آن را بر عهده بگیرد. ساد، که از مارس 2025 عض     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
