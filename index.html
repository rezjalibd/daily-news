ve week. Related THAT s a Halloween Song Now?! Some Unexpected Songs Seeing Streaming Bumps This Oct. 31 Queens of the Stone Age Crowned on ARIA Chart With Perfecth Lil Baby Brings Fresh to Life: Stream It Now The Cardiff-born musician first hit the top spot Oct. 23, knocking off Taylor Swift s “Patient Zero.” He also became the first Welsh act to top the charts in 15 years since Sian Evans featured on DJ Fresh’s 2011 No. 1 “Louder ; Miller also the first Welsh male solo act in 41 years to achieve the feat after Shakin Steven’s chart-topping holiday hit “Merry Christmas Everyone” in 1985. “Babydoll” is currently at a new peak of No. 47 on the Billboard Hot 100 , up 25 places from the previous week. Only a handful of songs have secured three or more weeks at No. 1 on the U.K. charts in 2026: Sam Fender and Olivia Dean s Rein Me In (23 weeks); Taylor Swift s Patient Zero (three weeks); Sienna Spiro s Great Expectation (three weeks). Tate McRae’s “Housewife” holds its position at No. 2, her highest ever placing on the Official Singles Chart. Ashe’s “Stop the Wedding” stays at No. 3, followed by Spiro’s “Great Expectation, which is up one position to No. 4. Michael Jackson’s “Thriller” reaches its highest ever position at No. 5, 43 years after its original release; the Official Charts Company reports a 74% week-over-week rise owing to Halloween celebrations last weekend. A number of other spooky songs also enjoy a bump, with Ray Parker Jr.’s “Ghostbusters” at No. 12, Rockwell’s “Somebody’s Watching Me” at No. 14 and Tame Impala’s “Dracula” seeing a 158% week-on-week surge to No. 15. Bobby Boris Pickett s “Monster Mash” closes at No. 19, followed by Danny Elfman s “This Is Halloween” (No. 22) and Andrew Gold s “Spooky Scary Skeletons” (No. 23).", "date_str": "2026-11-06T18:00:00+00:00", "hash": "2d61a7b3abd25a6e", "title_fa": "«Babydoll» جیمی میلر برای سومین هفته متوالی تک‌آهنگ شماره ۱ بریتانیا شد.", "summary_fa": "جیمی میلر در جدول تک‌آهنگ‌های رسمی بریتانیا در تاریخ 6 نوامبر با موفقیت «Babydoll» برای سومین هفته متوالی رتبه اول را دارد. مرتبط که الان آهنگ هالووین است؟! برخی از آهنگ‌های غیرمنتظره با دیدن برآمدگی‌های جریانی در این 31 اکتبر در نمودار ARIA با پرفکت لیل بیبی تاجگذاری کردند: اکنون آن را پخش کن موسیقی‌دان متولد کاردیف برای اولین بار در اکتبر به رتبه اول رسید. او همچنین اولین هنرمند ولزی است که پس از ۱۵ سال، از زمان حضور سیان ایوانز در آهنگ شماره ۱ «Louder» از دی‌جی فرش در سال ۲۰۱۱، به صدر جدول موسیقی راه می‌یابد. میلر همچنین اولین هنرمند تک‌نفره مرد ولزی است که پس از آهنگ «کریسمس مبارک همه» از شاکین استیون در سال ۱۹۸۵ که در صدر جدول موسیقی تعطیلات قرار گرفت، در ۴۱ سال گذشته به این موفقیت دست می‌یابد. «Babydoll» در حال حاضر با ۲۵ رتبه صعود نسبت به هفته قبل، در رتبه ۴۷ جدول ۱۰۰ آهنگ داغ بیلبورد قرار دارد. تنها تعداد انگشت شماری از آهنگ ها سه هفته یا بیشتر در رتبه اول جدول بریتانیا در سال 2026 قرار گرفته اند: سم فندر و اولیویا دین، Rein Me In (23 هفته). بیمار صفر تیلور سوئیفت (سه هفته)؛ انتظار بزرگ سینا اسپیرو (سه هفته). «خانم‌دار» اثر تیت مک‌ری جایگاه خود را در رتبه دوم قرار داده است که بالاترین رتبه او در جدول تک‌نفره‌های رسمی است. \"Stop the Wedding\" از Ashe در رتبه 3 باقی می ماند و پس از آن \"Great Expectation\" اسپیرو قرار دارد که با یک رتبه در رتبه 4 قرار دارد. «هیجان‌انگیز» مایکل جکسون، ۴۳ سال پس از اکران اولیه‌اش، به بالاترین جایگاه خود در رتبه ۵ رسید. شرکت نمودارهای رسمی به دلیل جشن های هالووین آخر هفته گذشته، 74 درصد افزایش هفته به هفته را گزارش می دهد. تعدادی دیگر از ترانه‌های شبح‌آمیز نیز از دست‌اندازی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Jamie-Miller-Matthew-Langlois-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۲۱:۳۰"}, {"source": "Billboard", "title": "Meet the ‘Unflappable’ Exec Bringing Superstars To Madison Square Garden and Sphere", "link": "https://www.billboard.com/pro/josephine-vaccarello-touring-executive-of-the-year/", "summary": "On her first day of work at New York’s Radio City Music Hall in 1998, Josephine Vaccarello — just a month out of college, starting a job as an administrative assistant — left the building in the evening and had to use the after-hours exit. That required walking through the opulent theater itself, and she wasn’t about to waste the moment. “I was like, ‘I’m standing on the stage of Radio City Music Hall. I’m just going to do a thing!’ ” Vaccarello recalls today. So the self-professed “theater kid” from Long Island launched into “On My Own,” Éponine’s iconic lament from Les Misérables . “I had to go for it,” she says with a proud grin. Nearly 30 years later, Vaccarello is sitting high above Midtown Manhattan on the roof of 2 Penn next to Madison Square Garden, which bought Radio City six months after she started that job. She’s in a very different position: In September, after three years as executive vp, live of Madison Square Garden Entertainment (MSGE) — where she’s spent her entire career — she was named its president. “I’m going to be honest: I never wanted to leave,” Vaccarello, 50, says of her time with the company. “I love the company I work for. I love the buildings I get to work in. It still makes me get excited when I stand inside any of the venues and watch an entire room of people singing every word to every song, and I’m like, ‘I get to be part of that.’ It’s cool.” Since the promotion, she hasn’t exactly kicked back to celebrate: The week we speak took her to Sphere in Las Vegas, where she oversees residencies, for Metallica’s opening; the Garden for a New York Rangers hockey game and two Harry Styles shows, part of his historic 30-night Together, ­Together residency; and the 30 Rock cast reunion at Radio City, back where it all started. Banner years may be business as usual at this point for both Sphere and the Garden, but even by those standards, 2026 was exceptional for both. The singular Las Vegas venue, in its third full year of operation, diversified its artist bookings with acts ranging from Carín León to No Doubt. The arena’s year was led by three monumental events: the New York Knicks’ NBA championship win; Styles’ residency; and a certain wedding of music and sports royalty (though of Taylor Swift and Travis Kelce’s nuptials, even Vaccarello can only say with a smile, “It occurred. It happened”). And this past summer was the biggest in the Garden’s history, with 57 shows (including multinight runs from Rush and Bon Jovi) compared with", "date_str": "2026-11-06T17:59:49+00:00", "hash": "aa6a4ed66b8f6ab6", "title_fa": "ملاقات با مدیر اجرایی \"Unflappable\" که سوپراستارها را به باغ مدیسون اسکوئر و Sphere می آورد", "summary_fa": "ژوزفین واکارلو در اولین روز کاری خود در سالن موسیقی رادیو سیتی نیویورک در سال 1998 - فقط یک ماه از دانشگاه فارغ التحصیل شد و به عنوان دستیار اداری مشغول به کار شد - عصر ساختمان را ترک کرد و مجبور شد از خروجی بعد از ساعات کاری استفاده کند. این مستلزم قدم زدن در خود تئاتر مجلل بود، و او قرار نبود این لحظه را تلف کند. Vaccarello امروز به یاد می آورد: \"من فکر می کردم، \"من روی استیج رادیو سیتی موزیک هال ایستاده ام. من فقط می خواهم کاری انجام دهم!\" بنابراین «بچه تئاتر» خودخوانده از لانگ آیلند وارد «به تنهایی»، نوحه نمادین اپونین از Les Misérables شد. او با پوزخندی مغرور می‌گوید: «من مجبور بودم آن را دنبال کنم. نزدیک به 30 سال بعد، Vaccarello در بالای میدتاون منهتن در پشت بام 2 Penn در کنار مدیسون اسکوئر گاردن نشسته است، که رادیو سیتی را شش ماه پس از شروع کار او خرید. او در موقعیت بسیار متفاوتی قرار دارد: در ماه سپتامبر، پس از سه سال به عنوان معاون اجرایی، به صورت زنده در مدیسون اسکوئر گاردن اینترتینمنت (MSGE) - جایی که او تمام دوران حرفه ای خود را در آنجا گذرانده است - به عنوان رئیس آن انتخاب شد. واکارلو، 50 ساله، درباره دورانش با شرکت می گوید: «راست خواهم بود: هرگز نمی خواستم آن را ترک کنم. من عاشق شرکتی هستم که در آن کار می کنم. وقتی در داخل هر یک از سالن‌ها می‌ایستم و کل اتاقی از مردم را تماشا می‌کنم که هر کلمه‌ای را برای هر آهنگ می‌خوانند، هنوز هیجان‌زده می‌شوم، و من می‌گویم، \"من می‌توانم بخشی از آن باشم.\" از زمان ارتقاء، او دقیقاً برای جشن گرفتن برنگشت: هفته ای که ما صحبت می کنیم او را به Sphere در لاس وگاس برد، جایی که او بر اقامتگاه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/02-josephine-vaccarello-eoty-billboard-2026-bb12-cr-rich-fury-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۲۱:۲۹"}, {"source": "Billboard", "title": "Ella Langley ‘Again’ Claims 2 Spots on Country Airplay Chart’s Top 3", "link": "https://www.billboard.com/music/chart-beat/ella-langley-loving-life-again-number-1-country-airplay-2nd-week-1236376145/", "summary": "Ella Langley returns to the top of Billboard ’s Country Airplay chart as “Loving Life Again” rebounds a spot for a second week at No. 1 on the list dated Nov. 14. It drew 33.8 million audience impressions (up 6%) Oct. 30-Nov. 5, according to Luminate. Related 2026 CMA Awards Announce Kacey Musgraves, Ella Langley, Tim McGraw More Performers, Plus Dolly Parton Tribute Ella Langley’s ‘Choosin’ Texas’ Rebounds for Record-Extending 25th Week at No. 1 on Hot 100 Ella Langley’s ‘Choosin’ Texas’ No. 1 on Hot 100 for Record-Extending 26th Week The song is just the second by a solo-billed woman to top Country Airplay for nonconsecutive weeks since the chart launched in 1990. Langley also achieved the feat with “Choosin’ Texas,” which ruled for three nonconsecutive weeks in February and March. Overall, just 20 titles have returned to No. 1 after relinquishing the lead. Plus, Langley leaps 6-3 on Country Airplay with “Jaded,” her Koe Wetzel team-up (26.6 million, up 13%). She was already the only woman to chart two in the top three, first doubling up for a week in May with “Be Her” and “Choosin’ Texas.” When “Loving Life Again” first reached No. 1 on the Oct. 31-dated chart, Langley became the first woman to notch at least four Country Airplay leaders in a single year. Only three other artists have done so: Morgan Wallen (2024-26), Luke Combs (2021) and Garth Brooks (1991 and 1993). “Loving Life Again” also marks the fourth Country Airplay No. 1 from Langley’s Dandelion , following “Choosin’ Texas,” “Be Her” and her Wallen duet “I Can’t Love You Anymore.” The album is just the third by a woman to generate four leaders. Plus, “Loving Life Again” became the milestone 1,000th No. 1 since Country Airplay began. Hudson Westbrook Is Doing Pretty Good Hudson Westbrook earns his second Country Airplay top 10 as “Painted You Pretty” climbs 13-10 (16.3 million, up 7%). He earns his second top 10 with just two entries, after “House Again” hit No. 6 in February. By God, HARDY s Done It HARDY ’s “By God” opens at No. 32 on Country Airplay (3.9 million). The gospel-meets-country track marks his best debut for a song with no billed collaborators on the chart, where he has earned five top 10s, including four No. 1s. His most recent leader, “Favorite Country Song,” spent three weeks on top in January-February. All charts dated Nov. 14 will update Tuesday, Nov. 10, on Billboard.com.", "date_str": "2026-11-06T17:48:13+00:00", "hash": "d09cad8184610bbb", "title_fa": "الا لنگلی «دوباره» 2 جایگاه را در 3 جدول برتر جدول پخش کانتری کسب کرد", "summary_fa": "الا لنگلی به صدر جدول پخش کانتری بیلبورد باز می گردد زیرا «دوباره زندگی دوست داشتنی» برای دومین هفته در رتبه اول فهرست مورخ 14 نوامبر قرار گرفت. از 30 اکتبر تا نوامبر 33.8 میلیون مخاطب (افزایش 6 درصدی) را به خود جلب کرد. 5، به گفته لومینیت. جوایز مرتبط CMA 2026 کیسی ماسگریوز، الا لنگلی، تیم مک‌گرو بازیگران بیشتری را اعلام کردند، به‌علاوه دالی پارتون قدردانی می‌کند بازگشت‌های «انتخاب» تگزاس از الا لنگلی برای رکورد طولانی بیست و پنجمین هفته در رتبه 1 در 100 فیلم داغ «الا لنگلی» تگزاس. 1 در Hot 100 برای رکورد طولانی هفته بیست و ششم این آهنگ تنها دومین آهنگ از یک زن مستقل است که برای هفته های متوالی از زمان راه اندازی نمودار در سال 1990 در صدر کانتری ایرپلی قرار می گیرد. لنگلی همچنین با \"Choosin' Texas\" که برای سه هفته متوالی در فوریه و مارس حکومت کرد به این شاهکار دست یافت. به طور کلی، تنها 20 عنوان پس از کنار گذاشتن برتری به شماره 1 بازگشته اند. به‌علاوه، لنگلی در کانتری ایرپلی با «جادد»، تیم کوئه وتزل (26.6 میلیون، 13 درصد افزایش) 6-3 می‌جهد. او پیش از این تنها زنی بود که در جدول دو جدول قرار گرفت و ابتدا در ماه می برای یک هفته با آهنگ های Be Her و Choosin' Texas دو برابر شد. هنگامی که «دوباره زندگی دوست داشتنی» برای اولین بار به رتبه 1 جدول تاریخ 31 اکتبر رسید، لنگلی اولین زنی بود که در یک سال حداقل چهار رهبر کانتری ایرپلی را به دست آورد. فقط سه هنرمند دیگر این کار را انجام داده اند: مورگان والن (2024-26)، لوک کامبز (2021) و گارث بروکس (1991 و 1993). «دوباره عشق به زندگی» همچنین چهارمین پخش شماره کانتری را نشان می‌دهد. 1 از Langley's Dandelion، پس از \"Choosin' Texas\"، \"Be Her\" و دوئت والن", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/ella-langley-greek-theatre-2026-cr-baylee-robillard-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۵ آبان • ۲۱:۱۸"}, {"source": "Billboard", "title": "Doja Cat Talks Life on Mars, Barefoot Plane Etiquette and ‘Tangible Ghosts’ on ‘Jennifer Hudson Show’", "link": "https://www.billboard.com/music/rb-hip-hop/doja-cat-life-on-mars-tangible-ghosts-jennifer-hudson-show-watch-1236376054/", "summary": "Doja Cat dropped by The Jennifer Hudson Show on Friday (Nov. 6) to chat up her recently released fifth album, Vie , and share the story behind the male childhood alter ego that is still a part of her life today. Related Queens of the Stone Age Crowned on ARIA Chart With Perfecth Doja Cat Opens Up About Cocaine Use, Struggling With Alcohol Dealing With Self-Hate Issues: You’re Not Indestructible’ Doja Cat Tweaks Paint the Town Red Lyrics After Texas Turns Blue Following Democrats Victory But the rapper/singer also provided some super helpful tips during a rapid fire segment where she weighed in on everything from the eternal question of whether there s life on Mars, to the proper plane footwear debate, the appropriate number of people for a group chat and the one song she could listen to forever. First things first. She cannot tell you if there is life on Mars, and frankly, she added, neither can beloved astrophysicist Neil deGrasse Tyson. I think that there might be life somewhere else in the universe, she said of her thoughts on humanity s eternal question about our place in the cosmos. But Mars? If it s anything it s like microbes, she said, casually mentioning that the red planet has something called water bears, aka Tardigrades, extremely hardy microscopic animals that scientists think could possibly survive Mars harsh climate under certain conditions. When Doja mentioned to Hudson that these creatures have already visited Earth, the show s host was visibly creeped out. Doja was less certain when Hudson asked if it s okay to take your shoes off on a plane. It depends on where you are, Doja said. And what your vibe is. If you have no socks on? No! And in case you were wondering, Doja thinks 20 people on a group chat is too much, as is 15, but 12 is just about right. The Paint the Town Red star was also adamant that she doesn t believe in ghosts and, if she s being honest, does not care for them. I m not afraid [of ghosts]. I don t like the idea of ghosts, like the way that Hollywood has formed ghosts as, like, a thing, she explained. Every scary movie that s about ghosts is the same exact movie Like, Oh! There was something? No, there wasn t.' When Hudson asked what Doja would like ghosts to do instead, she said firmly, Be tangible. Like be materialized. If I can punch you that s scary because then that means you can punch me back! The final lighting round query asked if she could play one song for the rest of her life — her own, or someone else s — wha", "date_str": "2026-11-06T17:41:03+00:00", "hash": "d951e7e1b4448e51", "title_fa": "گربه دوجا درباره زندگی در مریخ، آداب هواپیمای پابرهنه و «اشباح ملموس» در «شوی جنیفر هادسون» صحبت می‌کند.", "summary_fa": "Doja Cat توسط The Jennifer Hudson Show در روز جمعه (6 نوامبر) برای گپ زدن با پنجمین آلبوم اخیر خود به نام Vie و به اشتراک گذاشتن داستانی که در پس این تغییر من در دوران کودکی مرد قرار دارد که هنوز هم بخشی از زندگی او است به اشتراک بگذارد. ملکه‌های مرتبط عصر حجر تاج‌گذاری شده در نمودار ARIA با پرفکت دوجا گربه درباره استفاده از کوکائین، مبارزه با الکل درگیر با مشکلات نفرت از خود: تو نابود نشدنی نیستی. جایی که او همه چیز را بررسی کرد، از این سوال ابدی که آیا زندگی در مریخ وجود دارد، تا بحث کفش مناسب هواپیما، تعداد افراد مناسب برای یک گپ گروهی و آهنگی که او می توانست برای همیشه به آن گوش دهد. اول چیزها او اضافه کرد که او نمی تواند به شما بگوید که آیا زندگی در مریخ وجود دارد یا نه، و صراحتاً، او اضافه کرد، اخترفیزیکدان محبوب نیل دگراس تایسون نیز نمی تواند. من فکر می کنم که ممکن است در جای دیگری در جهان زندگی وجود داشته باشد، او در مورد افکار خود در مورد سوال ابدی بشر در مورد مکان ما در کیهان گفت. اما مریخ؟ او گفت اگر چیزی شبیه میکروب است، و به طور معمول اشاره کرد که سیاره سرخ دارای چیزی به نام خرس آبی، با نام مستعار Tardigrades، حیوانات میکروسکوپی بسیار مقاوم است که دانشمندان فکر می کنند احتمالاً می توانند تحت شرایط خاص از آب و هوای سخت مریخ جان سالم به در ببرند. زمانی که دوجا به هادسون گفت که این موجودات قبلاً از زمین دیدن کرده‌اند، مجری برنامه به‌طور آشکاری به بیرون خزید. زمانی که هادسون پرسید اشکالی ندارد کفش‌های خود را در هواپیما درآورید، دوجا کمتر مطمئن بود. دوجا گفت بستگی به این دارد که کجا باشید. و حال و هوای شما چیست اگر جوراب", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/doja-cat-jennifer-hudson-show-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۵ آبان • ۲۱:۱۱"}, {"source": "Billboard", "title": "Future Reunites With Drake & Travis Scott for Supercharged ‘Ya Hit’ Single Featuring Loe Shimmy: Listen", "link": "https://www.billboard.com/music/rb-hip-hop/future-drake-travis-scott-loe-shimmy-ya-hit-1236375892/", "summary": "The stars aligned for Future to recruit Travis Scott, Drake and Loe Shimmy for a loaded posse cut titled Ya Hit, which hit streaming services with a surprise drop on Friday (Nov flix", "link": "https://www.hollywoodreporter.com/tv/tv-news/nobody-wants-this-renewed-season-4-netflix-1236749442/", "summary": "The Kristen Bell and Adam Brody-led rom-com will return after delivering Netflix's biggest opening week for a returning comedy series this year.", "date_str": "2026-11-06T17:00:00+00:00", "hash": "eaf060a111e0af31", "title_fa": "«Nobody Wants This» برای فصل 4 در نتفلیکس تمدید شد", "summary_fa": "رام کام به رهبری کریستن بل و آدام برودی پس از ارائه بزرگترین هفته افتتاحیه نتفلیکس برای یک سریال کمدی بازگشته در سال جاری بازخواهند گشت. هالیوود ریپورتر دریافته است که نتفلیکس Nobody Wants This را برای فصل چهارم تمدید کرده است. این تمدید تنها دو هفته پس از انتشار فصل سوم سریال پرطرفدار رام کام انجام می‌شود که امسال بزرگترین هفته افتتاحیه را برای یک سریال کمدی بازگشته در استریمر ارائه کرد. این سریال که توسط ارین فاستر و با بازی کریستن بل و آدام برودی ساخته شد، در دو هفته اول 13.4 میلیون بازدید داشت. فاستر، جنی کنر و بروس اریک کاپلان، مجریان برنامه و تهیه‌کنندگان اجرایی در بیانیه‌ای گفتند: «ما بسیار خوشحال و هیجان‌زده هستیم که فصل دیگری از برنامه مورد علاقه‌مان را در تلویزیون اجرا می‌کنیم، که اتفاقاً همان برنامه‌ای است که ما اجرا می‌کنیم. داستان های مرتبط کسب و کار نتفلیکس به روبرتو استانیچی از Mattel ضربه می زند تا محصولات و تجربیات مصرف کننده را پیشتاز رتبه بندی پخش تلویزیونی کند: از جلوه های نتفلیکس تا بالای نمودارها فصل سوم شاهد تحولات عمده ای برای زوج مرکزی جوآن (بل) و خاخام نوح (برودی) بود که در ادامه رابطه خود را با هم ادامه دادند. این فصل همچنین پویایی پیچیده بین مورگان (جاستین لوپ)، ساشا (تیموتی سیمونز) و استر (جکی تون) را بیشتر بررسی کرد، و این دو بعد از جدایی آنها در پایان فصل دوم، دوباره به دنیای دوستیابی بازگشتند. (اسپویلرهای کامل رویداد Nobody Wants This فصل سوم را اینجا بیابید.) بازیگران فصل سوم نیز شامل استفانی فاراسی، مایکل هیچکاک، پل بن ویکتور، تووا فلدشو، اندرو رانلز، سارا سیلورمن، شیلو بیرمن و شری کولا بودند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/09/NWT_305_Unit_00436RC2X2-H-2026.jpg?w=1296&#03 : "طبق رتبه‌بندی‌های زنده +همان روز نیلسن، «اینترتینمنت امشب» به عنوان مجله خبری سندیکایی شماره 1، با میانگین 2.99 میلیون بیننده در هفته 5 اکتبر، در حال افزایش است. آن هفته برای برنامه «سرگرمی امشب» که توسط CBS Media Ventures تولید و توزیع شد، مهم بود، زیرا همزمان با هفته پخش پربیننده شبکه CBS بود. «ET» در مقابل [ ] 9 درصد رشد داشت. 1 مجله خبری سندیکایی، با میانگین 2.99 میلیون بیننده در هفته 5 اکتبر، بر اساس رتبه‌بندی زنده +همان روز Nielsen. در همین حال، \"Entertainment Tonight\" نیز از رشد دو رقمی سال به سال برای اولین ماه فصل تلویزیون (از 28 سپتامبر تا 25 اکتبر) در دموهای اصلی برخوردار است. CBS Media Ventures این تحلیل را انجام نداده است، اما این اتفاق با پایان مجله خبری سرگرمی رقیب «دسترسی به هالیوود» که در 11 سپتامبر پس از 30 فصل به پایان رسید (و پس از اینکه NBCUniversal بخش پخش اول خود را حذف کرد) مصادف شد. به هر دلیلی، برای اولین ماه فصل در نیلسن زنده+همان روز، فصل 46 «Entertainment Tonight» به طور متوسط ​​2.88 میلیون بیننده داشت که 8 درصد نسبت به سال گذشته (2.67 میلیون) افزایش داشت، همچنین امتیاز 0.27 برای بزرگسالان 18 تا 49 سال، 37 درصد بیشتر از سال گذشته (0.20) بود. در بزرگسالان 25 تا 54 سال، نمایش 23 درصد افزایش داشت (از 0.32 به 0.39 امتیاز). و در دموهای کلیدی زنان، جهش ها نیز بسیار زیاد بود: در زنان 25 تا 54 سال، امتیاز 0.47 بود (افزایش 32 درصدی از 0.36)، و در زنان 18 تا 49، امتیاز 0.30 بود که 38 درصد از 0.22 افزایش داشت. ارین جانسون، تهیه کننده اجرایی \"Entertainment Tonight\" گفت: \"در چهل و شش فصل، این تیم هنوز هر روز یک سوال می پرسد: چرا امشب ما را تماشا کنید؟ پاسخ این است که هیچ کس دیگری", "image_url": "https://variety.com/wp-content/uploads/2026/11/KevinNischelle_Alcove_4074-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۵ آبان • ۲۱:۰۰"}, {"source": "Variety", "title": "Netflix Alum Emily Feingold Joins Disney as Executive VP of Communications", "link": "https://variety.com/2026/tv/news/emily-feingold-disney-executive-vp-communications-netflix-1236940972/", "summary": "Netflix alum Emi r again. The Puerto Rican trap star says he decided about six months ago to stop smoking and drinking, and that he feels more alert now. “You mature over time, you know what I mean? And life teaches you things,” he admits. “Drugs don’t fulfill you, fame doesn’t fulfill you, money doesn’t fulfill you.” Related Anuel AA Reveals He’s Dropping an All-Corridos Album Along With ‘RHLM 2’: Everything We Know Anuel AA Asks Karol G to Unblock Him While Promoting Vuelve : I Fall Deeply in Love Queens of the Stone Age Crowned on ARIA Chart With Perfecth That change comes amid a busy stretch for his music. Anuel says Real Hasta la Muerte 2 is coming Nov. 19, and he may also release Cartel Real Hasta la Muerte — a Mexican corridos album he’s still finishing — on the same day. Exploring the genre has meant learning a different way to sing and working with Mexican musicians. “I fell in love with music all over again — with something new, not the same old thing,” he says. “There are going to be songs produced by Fuerza Regida. I’m talking with Jesús [Ortiz Paz] — he’s my brother, and he’s helping me with a few songs,” he adds. The conversation also touches on his kids, business ventures and relationships with his exes. When Cobo asks if he asked Karol G to unblock him on social media, Anuel laughs: “No, I’m just messing with her. But maybe she’ll unblock me.” “Do you want all your exes to be at peace with you?” Cobo asks. “Well, not all of them — not my ex… We should live in peace, right?” he replies. The exchange stays playful, and Anuel jokes that a movie about his love life would be called Los Amores perros de Anuel (or Anuel’s Love s a B ch ): “It’ll sell a lot. It’ll be incredible.” Between news about his upcoming projects and personal revelations, the interview offers a look at Anuel as he rethinks his life and music. Watch the full conversation above.", "date_str": "2026-11-06T17:00:00+00:00", "hash": "2aeacf9beb6ba0e8", "title_fa": "Anuel AA Talks Corridos Era، Fuerza Regida Collab و پست هایی درباره سابق Karol G: \"شاید او من را رفع انسداد کند\"", "summary_fa": "آنوئل AA چیزهای زیادی برای صحبت دارد، از تغییرات اخیری که در زندگی خود ایجاد کرده تا نقل مکانش به کریدوس مکزیک - و شوخی های بازیگوش او در مورد سابقش، فوق ستاره کلمبیایی کارول جی. در مصاحبه ای با لیلا کوبو، مدیر ارشد محتوای بیلبورد، که جمعه (6 نوامبر) در قایق تفریحی در میامی منتشر شد، او همچنین توضیح می دهد که چرا دوباره عاشق موسیقی شده است. ستاره تله پورتوریکویی می گوید حدود شش ماه پیش تصمیم گرفت سیگار و الکل را کنار بگذارد و اکنون احساس هوشیاری بیشتری دارد. او اذعان می‌کند: \"شما به مرور زمان به بلوغ می‌رسید، منظور من را می‌دانید؟ و زندگی چیزهایی به شما می‌آموزد.\" \"مواد مخدر شما را برآورده نمی کند، شهرت شما را برآورده نمی کند، پول شما را برآورده نمی کند.\" مرتبط Anuel AA نشان می دهد که او یک آلبوم All-Corridos را همراه با \"RHLM 2\" منتشر می کند: همه چیزهایی که می دانیم Anuel AA از Karol G می خواهد هنگام تبلیغ Vuelve او را مسدود کند: من عمیقا عاشق Queens of the Stone Age Crowned on ARIA Chart با موسیقی Perfecth است. آنوئل می‌گوید Real Hasta la Muerte 2 در 19 نوامبر عرضه می‌شود، و او همچنین ممکن است Cartel Real Hasta la Muerte - یک آلبوم مکزیکی کوریدوس که او هنوز در حال اتمام است - در همان روز منتشر کند. کاوش در این ژانر به معنای یادگیری روشی متفاوت برای آواز خواندن و کار با نوازندگان مکزیکی است. او می‌گوید: «من دوباره عاشق موسیقی شدم - با چیزی جدید، نه همان چیز قدیمی. قرار است آهنگ هایی توسط Fuerza Regida تولید شود. من با خسوس [اورتیز پاز] صحبت می‌کنم - او برادر من است و با چند آهنگ به من کمک می‌کند.» او می‌افزاید. این مکالمه همچنین به بچه‌ها، سرمایه‌گذاری‌های تجاری و روابط با سابقش", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/billboard-latin-music-week-2026-mary-beth-koeth-anuel-aa-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۱۵ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Anuel AA on His Sobriety, Mending His Relationship With Cosculluela & His New Corridos Album | Billboard Latin", "link": "https://www.billboard.com/video/anuel-aa-sobriety-corridos-album-karol-g-interview/", "summary": "In his first in-depth interview in several years, Anuel AA talks about how, after hitting rock bottom with drugs and alcohol, he found the strength to return to music not with one album, but two. On Nov. 19, Anuel AA will release Real Hasta la Muerte 2 , a tribute to the original Real Hasta la Muerte , alongside his first corridos album, Cartel Real Hasta la Muerte . The rapper also shares that Karol G still hasn’t unblocked him on social media and how he made peace with fellow rapper Cosculluela. He opens up about his sobriety, and how during his darkest moments, he couldn’t recognize himself in the mirror. Today, he’s celebrating new collaborations with Fuerza Regida and Luis R Conriquez, as well as his love for Mexican culture. He also talks about how much he loves his children, why De La Rose is like “Anuel in a woman’s body,” Puerto Rico, and the new music festival he’ll launch in 2027. Leila Cobo: That you asked Karol to unblock you. Anuel AA: Yes. And did she unblock you? No. Hello, everyone. I’m Leila Cobo. I’m here with Anuel, and we’re here chatting on a small boat, on a yacht, here in the city of Miami, where you live, right, Anuel? Yes. This is your home. Yes, this is my home. First of all, let’s see, they’re two guns. I thought it was a cross, but no. No, they’re two guns, and they have lasers too here. Well, and where did you get them? Honestly, I’d never seen them. A jeweler that I’m working with now. He’s called Limitless. He’s very good. Here in Miami? Yes, here in Miami. OK. You’re doing a lot of new things, right? Yes, I’m working a lot. Many different things. In music and outside of music? Yes, yes. In music and outside of music. Let’s see, but first let’s talk about you. New jeweler. Yes, 100 percent. New habits. You told me you’re not smoking anything anymore. Right, yes, no, I don’t smoke anymore. You’re not drinking alcohol anymore. That either. Are you exercising every day? No. Almost every day. No, no— Not either? I’m not exercising. I’m working, eating healthy and working — pure music and pure business always. Well, and eating healthy. Yes. And when did this lifestyle change start? It started about six months ago. And why? Because one matures with time, if you understand me. Through life situations, one learns, and I don’t know, I started to feel like I already wanted — I wanted it, I wanted a change in me already. Keep watching for more!", "date_str": "2026-11-06T17:00:00+00:00", "hash": "b9b7e5f4a3f399f1", "title_fa": "Anuel AA در مورد هوشیاری خود، اصلاح رابطه خود با Cosculluela و آلبوم جدید Corridos او | بیلبورد لاتین", "summary_fa": "در اولین مصاحبه عمیق خود پس از چندین سال، Anuel AA در مورد این صحبت می کند که چگونه پس از رسیدن به کف با مواد مخدر و الکل، قدرت بازگشت به موسیقی را نه با یک آلبوم، بلکه با دو آلبوم پیدا کرد. در 19 نوامبر، Anuel AA Real Hasta la Muerte 2 را منتشر خواهد کرد که ادای احترامی به Real Hasta la Muerte اصلی است، همراه با اولین آلبوم کوریدوس خود، Cartel Real Hasta la Muerte. این خواننده رپ همچنین به اشتراک می‌گذارد که کارول جی هنوز او را در رسانه‌های اجتماعی رفع انسداد نکرده است و اینکه چگونه با خواننده رپ Cosculluela صلح کرده است. او در مورد متانت خود صحبت می کند، و اینکه چگونه در تاریک ترین لحظاتش، نمی تواند خود را در آینه بشناسد. امروز، او در حال جشن گرفتن همکاری های جدید با Fuerza Regida و Luis R Conriquez، و همچنین عشق خود به فرهنگ مکزیکی است. او همچنین در مورد اینکه چقدر فرزندانش را دوست دارد، اینکه چرا د لا رز مانند «آنوئل در بدن زن» است، پورتوریکو و جشنواره موسیقی جدیدی که در سال 2027 راه‌اندازی خواهد کرد، صحبت می‌کند. Anuel AA: بله. و آیا او شما را رفع انسداد کرد؟ نه. سلام به همه. من لیلا کوبو هستم. من اینجا با آنوئل هستم، و ما اینجا در یک قایق کوچک، در یک قایق بادبانی، اینجا در شهر میامی، جایی که شما زندگی می کنید، صحبت می کنیم، درست است، آنوئل؟ بله. اینجا خانه شماست بله، اینجا خانه من است. اول از همه، بیایید ببینیم، آنها دو اسلحه هستند. فکر کردم صلیب است، اما نه. نه، آنها دو اسلحه هستند و اینجا هم لیزر دارند. خوب، و آنها را از کجا گرفتید؟ راستش من هرگز آنها را ندیده بودم. جواهرسازی که اکنون با آن کار می کنم. او نامحدود است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/anuelqa.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Olivia Dean, Kehlani, Juanes & More to Announce 2027 Grammy Nominations", "link": "https://www.billboard.com/music/awards/2027-grammy-nominations-announcement-livestream-details-1236375604/", "summary": "Olivia Dean is widely expected to receive multiple Grammy nominations, including album, record and song of the year, on Monday Nov. 16. She’s also set to help announce the nominations on a livestream bright and early that morning, along with Kehlani , who won two Grammys earlier this year and could be in line for more awards for her eponymous album; Amy Allen , who has won songwriter of the year, non-classical the last two years; and Pharrell Williams , a past three-time winner of producer of the year, non-classical. Related Don Toliver, Megan Moroney ADÉLA — Who Made the Entry List for Best New Artist at the 2027 Grammys Who Didn t? Harvey Mason jr. on 2,300 New Grammy Voting Members, the Asian Pop Category Uproar More: ‘We Want To Bring More People Into the Tent’ Categories With the Most Fewest Entries for 2027 Grammys Other artists set for the nominations livestream include Alan Menken, Carly Pearce, David Guetta, FYÜTCH Aura V, Herbie Hancock, Israel Houghton, Juanes, Linda Perry, Meghan Foley Michelle Holme, Renée Fleming, YUNGBLUD and Ziggy Marley, as well as Harvey Mason jr., Grammys CEO, and Dr. Chelsey Green, chair of the Recording Academy Board of Trustees. Nominees across all 100 categories for the 2027 Grammys will be revealed during a special presentation on Grammy.com and the Grammys YouTube channel, with special live coverage on Good Morning America . The nominations livestream begins on Monday, Nov. 16 at 7:45 a.m. ET / 4:45 a.m. PT. There will be a wrap-up show at 9 a.m. ET/6 a.m. PT (times approximate). For the first time, the Grammy Nominations special presentation will be broadcast live at The Square in Times Square, presented by Hilton. The complete nominations list will be published on Grammy.com and at Billboard.com at 9:00 a.m. ET / 6:00 a.m. PT. The Grammys also made an important announcement about the 2027 Grammys, which will air one hour earlier than in the past. The 69th annual Grammy Awards will air/stream live on Sunday Feb. 7, 2027 at 7:00 p.m. ET / 4:00 p.m. PT on ABC, and stream on Disney+ and Hulu. This follows the lead of the Oscars, which first moved up their show to start at 4 p.m. PT for the 96th Academy Awards in 2024. The move is designed to allow viewers on the East Coast to remain with the show for the top awards without having to stay up to midnight. 2024 was Raj Kapoor’s first year as an executive producer of the Oscars. Kapoor is also an executive producer of the Grammys. The 2027 Grammys will again be held at C", "date_str": "2026-11-06T17:00:00+00:00", "hash": "16de171e84c5b0bb", "title_fa": "اولیویا دین، کهلانی، خوانس و دیگران نامزدهای گرمی 2027 را اعلام می کنند", "summary_fa": "انتظار می رود که اولیویا دین در روز دوشنبه 16 نوامبر چندین نامزدی گرمی از جمله آلبوم، آلبوم و آهنگ سال را دریافت کند. او همچنین قرار است به معرفی نامزدها در پخش زنده و در اوایل صبح آن روز کمک کند، همراه با کهلانی، که اوایل امسال دو جایزه گرمی گرفت و می‌تواند در صف دریافت جوایز بیشتر برای آلبوم همنامش باشد. امی آلن، که در دو سال گذشته برنده ترانه سرای سال، غیر کلاسیک شده است. و فارل ویلیامز، برنده سه بار تهیه کننده سال، غیر کلاسیک. مرتبط دان تولیور، مگان مورونی آدیلا — چه کسی در فهرست ورودی بهترین هنرمند جدید در گرمی 2027 قرار گرفت. هاروی میسون جونیور در 2300 عضو جدید رای‌دهنده گرمی، گروه موسیقی پاپ آسیایی سروصدای بیشتری به پا کرد: «ما می‌خواهیم افراد بیشتری را به چادر بیاوریم» رده‌ها با کمترین ورودی‌ها برای گرمی 2027 سایر هنرمندانی که برای نامزدی در جریان مستقیم نامزدی حضور دارند عبارتند از: Alan Menken، Carly Pearce، David Guetta، VYÜCHUT, FYÜTHE, FYÜTHE, FYÜTh لیندا پری، مگان فولی میشل هولم، رنه فلمینگ، YUNGBLUD و زیگی مارلی، و همچنین هاروی میسون جونیور، مدیرعامل گرمی، و دکتر. چلسی گرین، رئیس هیئت امنای آکادمی ضبط. نامزدهای هر 100 دسته برای جایزه گرمی 2027 طی یک ارائه ویژه در Grammy.com و کانال YouTube Grammy با پوشش زنده ویژه در صبح بخیر آمریکا مشخص خواهند شد. پخش زنده نامزدها از دوشنبه، 16 نوامبر، ساعت 7:45 صبح به وقت شرقی / 4:45 صبح به وقت PT آغاز می شود. یک نمایش پایانی در ساعت 9 صبح به وقت شرقی / 6 صبح به وقت محلی (زمان‌های تقریبی) برگزار می‌شود.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/02/P103YS8I-e1770029955529.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "P1Harmony Say It’s Never Too Late to ‘BLOW UP,’ Citing Charli xcx As Inspiration", "link": "https://www.billboard.com/music/pop/p1harmony-blow-up-interview-1236375456/", "summary": "During P1Harmony s first six years together, there was a stretch when members couldn t articulate why they were working so hard. What I felt was hardest in this process was when I couldn t find a reason for running, Intak tells Billboard during a sit-down in their downtown Los Angeles hotel hours before they fly home to Seoul. There were times the company just had us run without a clear purpose or a point to reach and I think I got a little worn out the moment I realized that. What is our purpose in this moment? What are we running this hard for? Is it even true that running like this will get us there? Every time I had moments like that, I d suddenly feel drained and it was hard. But even if our steps were really small, we always climbed little by little. Six years into their career, the six-piece of Intak, Keeho, Theo, Jiung, Soul and Jongseob has a much clearer view of where all that running is taking them. The K-pop act s newest EP BLOW UP arrived Friday (Nov. 6), and its title doubles as a mantra for where the group stands today. After years of steady gains on the charts, in album sales, in concert audiences and in hard-won lessons inside the boy band, they re ready to break through in a bigger way. P1Harmony’s performance at 82WORLD: LA , their first headlining slot at a U.S. festival the previous weekend, felt like proof. The last time we did an outdoor thing was the first time we came to L.A., leader Keeho recollects. It s been like almost four to five years and that s a really big, full-circle moment. Numbers show how far that gratitude goes, with Intak saying he can track the group s progress in chart positions. Before, our goal was just to get onto Billboard , he says. Just the other day we were at No. 60, then we re getting into the top 20 and now the top 5. Because we achieved these things one by one, I feel reassured now and I think it s good that we can show our fans we re artists who can do at least this much. P1H s six albums’ worth of Billboard 200 history all EPs show just that: After first entering the chart at No. 51 with HARMONY : ALL IN during the summer of 2023, P1Harmony earned their first top 40 album with 2024 s Killin It (No. 39 peak), followed by SAD SONG (No. 16 in 2024), DUH! (No. 23 in 2025) and their debut English-language EP, EX (No. 9, their first Top 10 in fall 2025). Earlier this year, UNIQUE debuted at No. 4 on the Billboard 200 , the group s best showing yet, earning 58,000 equivalent album units in its first week. Wh", "date_str": "2026-11-06T16:58:16+00:00", "hash": "c535417ce99f1fe2", "title_fa": "P1Harmony می گوید هرگز برای \"BLOW UP\" دیر نیست، با ذکر الهام از Charli xcx", "summary_fa": "در طول شش سال اول همکاری P1Harmony، زمانی که اعضا نمی‌توانستند توضیح دهند که چرا اینقدر سخت کار می‌کنند، طولانی شد. اینتاک به بیلبورد در خلال نشستن در هتل مرکز شهر لس آنجلس، ساعاتی قبل از پرواز به سئول، به بیلبورد می‌گوید: آنچه در این فرآیند احساس می‌کردم سخت‌ترین چیزی بود که نمی‌توانستم دلیلی برای دویدن پیدا کنم. مواقعی وجود داشت که شرکت ما را بدون هدف یا نقطه مشخصی برای رسیدن به آن اداره می کرد و فکر می کنم لحظه ای که متوجه شدم کمی فرسوده شدم. هدف ما در این لحظه چیست؟ برای چه اینقدر دویدن داریم؟ آیا حتی این درست است که اینگونه دویدن ما را به آنجا می رساند؟ هر بار که چنین لحظاتی داشتم، ناگهان احساس خستگی می کردم و سخت بود. اما حتی اگر پله های ما واقعاً کوچک بود، همیشه کم کم بالا می رفتیم. شش سال پس از دوران حرفه‌ای‌شان، شش تکه اینتاک، کیهو، تئو، جیونگ، سول و جونگ‌سئوب دید بسیار واضح‌تری از این که آن همه دویدن آنها را به کجا می‌برد دارد. جدیدترین EP BLOW UP اکت کی پاپ جمعه (نوامبر. 6)، و عنوان آن به عنوان یک مانترا برای جایگاه امروز گروه دو برابر می شود. پس از سال‌ها پیشرفت ثابت در چارت‌ها، فروش آلبوم‌ها، مخاطبان کنسرت و درس‌هایی که به سختی در گروه پسر به دست آورده‌اند، آن‌ها آماده هستند تا به شیوه‌ای بزرگ‌تر به موفقیت برسند. اجرای P1Harmony در 82WORLD: LA، اولین جایگاه آنها در یک جشنواره ایالات متحده در آخر هفته قبل، مانند یک مدرک به نظر می رسید. رهبر کیهو به یاد می‌آورد که آخرین باری که کاری در فضای باز انجام دادیم، اولین باری بود که به لس آنجلس آمدیم. تقریباً چهار تا پنج سال گذشته است و این یک لحظه بسیار بزرگ و دایره کامل است. اعداد نشان می‌دهند که این قدردانی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P1Harmony-2026-Courtesy-of-FNC-Entertainment-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۲۰:۲۸"}, {"source": "Billboard", "title": "5 Best Moments of the 2026 HEAT Latin Music Awards: Olga Tañón, Gloria Trevi & More", "link": "https://www.billboard.com/lists/heat-latin-awards-olga-tanon-gloria-trevi-best-moments/", "summary": "The HEAT Latin Music Awards, popularly known as Premios HEAT, were held for the first time in Puerto Vallarta, Mexico, on Thursday (Nov. 5). The ceremony attracted a slew of stars, including Gloria Trevi, Olga Tañón, Los Ángeles Azules, Jessi Uribe, Arthur Hanlon, La Arrolladora Banda El Limón de René Camacho and Piso 21. Related Carlos Rivera Wins Big at 2026 Heat Latin Music Awards: Complete Winners List The event, which took place at the Puerto Vallarta International Convention Center and was broadcast live on LosHeat.tv and Jalisco TV, celebrated a variety of genres, including regional Mexican music, pop, urbano, cumbia, reparto and reggaetón. Joining the event were artists such as Ha*Ash, Majo Aguilar, Mar Solís, Dayanara, Paola Jara, Pututi Nesty, Grupo 5 and Corridos Del Rey. One standout performances of the evening was a segment titled Los que siempre viven ( Those Who Live On ), where various artists sang timeless classics in tribute to late legends such as Selena, Vicente Fernández, José José, Paquita la del Barrio, Antonio Aguilar and Flor Silvestre, creating an emotional and heartfelt moment. Another highlight was the tribute to Puerto Rican merengue icon Olga Tañón s career. Also known as La Mujer de Fuego (Woman of Fire), Tañon shared the stage with Mar Solís and Grupo 5, performing Contigo o Sin Ti with the former and the classic “Ya Me Cansé” with the latter. The Mexican-American sister duo Ha*Ash delivered a live performance of its new single “Antes Que Te Cases,” originally recorded with Cristian Castro, taking its pop music to new heights. Meanwhile, Gloria Trevi, who was honored this year as Artista Oro (Golden Artist) at the HEAT Latin Music Awards al Estilo Jalisco, closed the show with a vibrant medley of her greatest hits, including “Todos Me Miran,” “Me Lloras,” “Pelo Suelto” and “Con Los Ojos Cerrados.” The awards ceremony capped off HEAT Week, which ran from Oct. 31 to Nov. 5 in the state of Jalisco, coinciding with the traditional Día de los Muertos (Day of the Dead). Carlos Rivera emerged as the night’s biggest winner, taking home three awards. Other notable winners included Karol G, Grupo Firme and Ovy on the Drums. For the full list of winners, click here . Here are five standout moments from the HEAT Latin Music Awards al Estilo Jalisco, organized in collaboration with the government of Jalisco and the municipality of Puerto Vallarta, in alphabetical order of the artists involved.", "date_str": "2026-11-06T16:56:54+00:00", "hash": "caef9ad41c1d8160", "title_fa": "5 بهترین لحظه جوایز موسیقی لاتین HEAT 2026: اولگا تانیون، گلوریا تروی و بیشتر", "summary_fa": "جوایز موسیقی لاتین HEAT، که عموماً به عنوان Premios HEAT شناخته می شود، برای اولین بار در پورتو والارتای مکزیک، روز پنجشنبه (5 نوامبر) برگزار شد. این مراسم ستارگان زیادی از جمله گلوریا تروی، اولگا تانیون، لس آنجلس آزولس، جسی اوریبه، آرتور هانلون، لا آرولادورا باندا ال لیمون د رنه کاماچو و پیسو 21 را به خود جلب کرد. کارلوس ریورا در جوایز موسیقی لاتین Heat 2026 برنده شد: فهرست کامل برندگان این رویداد که در مرکز همایش های بین المللی Puerto Vallarta برگزار شد و به طور زنده از LosHeat.tv و Jalisco TV پخش شد، ژانرهای مختلفی از جمله موسیقی منطقه ای مکزیکی، پاپ، شهری، کامبیا، رپارتو و. هنرمندانی مانند Ha*Ash، Majo Aguilar، Mar Solís، Dayanara، Paola Jara، Pututi Nesty، Grupo 5 و Corridos Del Rey به این رویداد پیوستند. یکی از اجراهای برجسته این شب، بخشی با عنوان Los que siempre viven (کسانی که در آن زندگی می کنند) بود، که در آن هنرمندان مختلف کلاسیک های جاودانه ای را برای ادای احترام به اسطوره های متاخر مانند سلنا، ویسنته فرناندز، خوزه خوزه، پاکیتا لا دل باریو، آنتونیو آگیلار و فلور سیلوستره خواندند و لحظه ای احساسی و قلبی خلق کردند. یکی دیگر از نکات برجسته، ادای احترام به حرفه اولگا تانیون نماد مرنگ پورتوریکویی بود. Tañon که با نام La Mujer de Fuego (زن آتشین) نیز شناخته می شود، صحنه را با Mar Solís و Grupo 5 به اشتراک گذاشت و Contigo o Sin Ti را با اولی و کلاسیک \"Ya Me Cansé\" را با گروه دوم اجرا کرد. دو خواهر مکزیکی-آمریکایی Ha*Ash اجرای زنده تک آهنگ جدید خود \"Antes Que Te Cases\" را که در ابتدا با کریستین کاسترو ضبط شده بود، اجرا کردند و موسیقی پاپ خود را به اوج جدیدی رساندند. در همین حال، گلوریا تروی، که امسال به عنوان Artista Oro (هنرمند طلایی)", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Gloria-Trevi-cr-Premios-HEAT-billboard-1800.jpg?w=1024", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۲۰:۲۶"}, {"source": "Billboard", "title": "Taylor Swift Called the ‘Fakest’ New York Knicks Fan by 2 of Team’s Players: ‘It’s a Little Performative’", "link": "https://www.billboard.com/music/music-news/taylor-swift-fakest-ny-knicks-fan-tyler-kolek-miles-mcbride-1236375916/", "summary": "After drawing ire from disgruntled football fans in 2023 who felt she was present at too many games, Taylor Swift has managed to irk men in another sport for apparently attending too few. New York Knicks point guards Tyler Kolek and Miles Deuce McBride recently criticized the pop star as the fakest fan of the 2026 NBA champions, accusing her and other celebrity row visitors of being performative. Related Travis Kelce Can’t Wait to Make New Traditions With Taylor Swift on His First Christmas As a Married Man Taylor Swift Made Sure She Didn t Kick Somebody Off of Toy Story 5 by Agreeing to Write the End Credits Song Seattle Seahawks Shade Taylor Swift Travis Kelce After Ending Kansas City s Undefeated Streak In a clip from an NBA 2K TikTok livestream Deflected posted Thursday (Nov. 5), the two men fiddled with game controllers while debating who they believe is the least authentic celebrity Knicks fan. Maybe Taylor Swift, Kolek said, to which McBride offered, I would agree. What defines a fake Knicks fan, in their eyes? They just want to be seen at the game, they re not necessarily fans, Kolek noted. I don t know if I ve seen her at any other games. I m gonna get some hate from the Swifties. I guess she s got a lot going on, so she can t come all the time. But it s a little performative. Swifties not gonna like that answer, McBride said with a laugh as the two players shouted out Ben Stiller and Tracy Morgan for showing up consistently at Knicks games. Everybody else [but Swift] is usually solid. Billboard has reached out to Swift s rep for comment. The 14-time Grammy winner was present at Game 4 of the NBA Finals, cheering on the Knicks alongside Mariska Hargitay and Este and Alana Haim in custom Knicks T-shirts. Before that, she also traveled with now-husband Travis Kelce to watch an away game against the Cleveland Cavaliers. It s ironic that Swift who, as Kolek generously pointed out, might ve been a little busy this season, having been gearing up to release Billboard Hot 100 -topping song I Knew It, I Knew You for Toy Story 5 the same month of the NBA Finals, among other projects is now getting flack for this reason. It wasn t long ago that football fans expressed upset over the amount that she was seen at NFL games when she first started showing up to support Kelce. I think we all know that if there’s one thing that male sports fans want to see in their spaces and on their screens, Swift later sarcastically joked about the outrage in her 2025 cameo on N", "date_str": "2026-11-06T16:48:14+00:00", "hash": "a7f0cb56ac45da39", "title_fa": "تیلور سوئیفت توسط 2 بازیکن تیم، \"کاذب ترین\" هوادار نیویورک نیکس نامیده شد: \"این کمی عملکردی است\"", "summary_fa": "پس از خشم طرفداران ناراضی فوتبال در سال 2023 که احساس می کردند او در بازی های زیادی حضور دارد، تیلور سوئیفت توانسته است مردان را در ورزش دیگری به دلیل حضور بسیار کم آنها عصبانی کند. تایلر کولک و مایلز دیوس مک براید، گاردهای پوینت نیویورک نیکس، اخیراً از ستاره پاپ به عنوان جعلی ترین طرفدار قهرمانان NBA در سال 2026 انتقاد کردند و او و سایر بازدیدکنندگان ردیف سلبریتی را به نمایشی بودن متهم کردند. مرتبط تراویس کلسه بی‌صبرانه منتظر ساخت سنت‌های جدید با تیلور سویفت در اولین کریسمس خود به عنوان یک مرد متاهل است. پخش زنده NBA 2K TikTok منحرف شد که پنجشنبه (نوامبر. 5)، این دو مرد با کنترلرهای بازی در حال بحث و گفتگو بودند که معتقدند چه کسی معتبرترین طرفدار نیکس است. کولک گفت، شاید تیلور سویفت، که مک براید به آن پیشنهاد داد، من موافقت کنم. چه چیزی یک هوادار قلابی نیکس را از نظر آنها تعریف می کند؟ کولک خاطرنشان کرد: آنها فقط می خواهند در بازی دیده شوند، آنها لزوما طرفدار نیستند. نمی دانم او را در بازی های دیگری دیده ام یا نه. من از سویفتی ها متنفر خواهم شد. من حدس می زنم که او خیلی اتفاق می افتد، بنابراین او نمی تواند همیشه بیاید. اما کمی عملکردی است. مک براید با خنده گفت که سویفتیس از این پاسخ خوشش نمی آید، در حالی که دو بازیکن فریاد می زدند بن استیلر و تریسی مورگان به خاطر حضور مداوم در بازی های نیکز. بقیه [به جز سویفت] معمولاً محکم هستند. بیلبورد برای اظهار نظر با نماینده سوئیفت تماس گرفته است. برنده 14 گرمی در بازی 4 فینال NBA حضور داشت و در کنار ماریسکا هارگیتای و استه و آلانا هیم با تی شرت های سفارشی نیکس، نیکس را تشویق می کرد. قبل از آن، او همچنین به همراه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/2280983591-e1791476348999.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۵ آبان • ۲۰:۱۸"}, {"source": "Billboard", "title": "Lil Baby’s ‘FRESH’: All 17 Tracks Ranked", "link": "https://www.billboard.com/lists/lil-baby-fresh-best-songs-tracks-ranked/", "summary": "Lil Baby finds himself at an interesting point in his career. On one hand, he s six years removed from his star-making My Turn era, and hasn’t had the same kind of hit records or released a critically acclaimed album since. Conversely, he has also amassed 160 Billboard Hot 100 entries (including 13 top 10s) throughout his career, as well as four consecutive Billboard 200 No. 1 albums, showing that his core audience and beyond have remained invested in what he puts out. In the music game, though, narratives are often just as impactful as numbers. So while one person may feel he is still highly successful, another may rightfully say he has lost steam since the massive “We Paid” with 42 Dugg, and his politically-charged anthem The Bigger Picture. As for Baby himself — per his recent comments on Popcast — he doesn’t even view what could be perceived as a “cold streak” as a slump. This year’s “Dead Fresh”, a top 20 song on the Billboard Hot 100, showed some people that even if he can’t catch lightning in a bottle again, he still has a little electricity in his arsenal. The true intrigue, for many, is: How can he evolve his style? What new stories does he have to tell? Was 2020-2022 just a run, or is he as good as he established himself then to be? His new album FRESH isn’t a major shift in his sound, and doesn t reveal much new about him. But it is a reminder that he can rap well, and is among the best of this era within his tier of artists. There are some fun, inspired production choices, but, for the most part, Lil Baby remains who we have always known him to be. Check out our ranked list of the 17 tracks on FRESH below.", "date_str": "2026-11-06T16:47:30+00:00", "hash": "6da7bfac67d3a163", "title_fa": "\"FRESH\" از Lil Baby: همه 17 آهنگ رتبه بندی شده اند", "summary_fa": "لیل بیبی خود را در نقطه جالبی از حرفه خود می بیند. از یک طرف، او شش سال از دوران ستاره‌سازی «نوبت من» کنار گذاشته شده است و از آن زمان تاکنون چنین رکوردهای موفق یا آلبومی منتشر نکرده است که مورد تحسین منتقدان قرار گرفته است. برعکس، او همچنین 160 آلبوم 100 بیلبورد داغ (شامل 13 آلبوم برتر) و همچنین چهار آلبوم متوالی شماره 1 بیلبورد 200 را جمع آوری کرده است که نشان می دهد مخاطبان اصلی او و فراتر از آن روی آنچه او منتشر می کند سرمایه گذاری کرده اند. با این حال، در بازی موسیقی، روایت ها اغلب به اندازه اعداد تأثیرگذار هستند. بنابراین در حالی که ممکن است یک نفر احساس کند هنوز بسیار موفق است، دیگری ممکن است به درستی بگوید که پس از فیلم عظیم «ما پرداختیم» با 42 داگ، و سرود سیاسی‌اش «تصویر بزرگ»، قدرت خود را از دست داده است. در مورد خود بیبی - طبق نظرات اخیرش در پاپکست - او حتی آنچه را که می تواند به عنوان یک \"رگه سرد\" به عنوان یک رکود تلقی شود، نمی بیند. امسال «Dead Fresh»، یکی از 20 آهنگ برتر بیلبورد Hot 100، به برخی افراد نشان داد که حتی اگر دوباره نتواند رعد و برق را در یک بطری بگیرد، باز هم مقداری برق در زرادخانه خود دارد. فتنه واقعی، برای بسیاری، این است: چگونه او می تواند سبک خود را تکامل دهد؟ او چه داستان جدیدی برای گفتن دارد؟ آیا سال‌های 2020-2022 فقط یک دویدن بود یا به همان خوبی که در آن زمان تثبیت شده بود؟ آلبوم جدید او FRESH تغییر عمده ای در صدای او نیست و چیز جدیدی درباره او فاش نمی کند. اما این یک یادآوری است که او می تواند به خوبی رپ بخواند و در ردیف هنرمندان خود جزو بهترین های این دوره", "image_url": "https://www.billboard.com/wp-content/uploads/2025/08/Lil-Baby-cr-Kevin-Mares-2024-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۵ آبان • ۲۰:۱۷"}, {"source": "Billboard", "title": "Why Tom Petty ‘Origins 1971-1978’ Isn’t Your Normal Box Set: ‘The Important Thing Was Making a Good Album’", "link": "https://www.billboard.com/music/rock/tom-petty-origins-1971-1978-album-1236375419/", "summary": "Adria Petty says an anniversary, to her, is a very uncool marketing thing. But this year s 50th anniversary of the self-titled debut album by her father, the late Tom Petty, and his band the Heartbreakers was too good of a storytelling opportunity to pass up. I really want to acknowledge the Heartbreakers this year, cause they re all alive and have achieved so much and are still going strong now, Petty who co-produced the new box set Origins 1971-78 tells Billboard via Zoom from California. This anniversary is really important to us. It s really important to us that everybody gets their flowers when they re still alive…. ( Origins ) is the musical diagram to how Tom became Tom and the Heartbreakers and how they found their way to this music. Out Friday (Nov. 6), Origins represents a two-year undertaking that dove deep into Petty and the Heartbreakers vaults, primarily conducted by the Petty Legacy LLC brain trust which also includes longtime producer/engineer Ryan Ulyate and managers Will Botwin and Scott Greer. The multi-disc set includes new mixes of Tom Petty and the Heartbreakers and 1978 s You re Gonna Get It! (with extended versions of some of the tracks), an unreleased Live From the Record Plant 1977 performance and videos from the BBC s Old Grey Whistle Test in 1978. The focal point, however, is No Sleep Til L.A ., which features a dozen early tracks from 1971-77 recorded by the pre-Heartbreakers band Mudcrutch and Petty solo in addition to the Heartbreakers as well as five more included on an EP dubbed The Cut Out Bin . Those will also be issued as a separate, individual album as well as on the box set. This body of work, to me, is sort of a Rosetta Stone for rock n roll in a weird way, explains Adria Petty, a music video and commercial director in addition to her Petty Legacy role. Since Tom Petty s death in 2017 at the age of 66, she s also co-produced archival projects. They could take it to reggae, they could take it to disco, they could take it to soul, they could really take it to country rock this, that or the other. They went their own way and became an amalgam of all that. They were just experimenting, making noise together that they liked. My responsibility here is to point out the cultural importance, that during disco, during their aftermath of Vietnam, these guys blazed their own trail and kept it going for 50 years. Heartbreakers keyboardist Benmont Tench, who was also part of Mudcrutch along with Petty and guitarist Mike Campbell, c", "date_str": "2026-11-06T16:24:48+00:00", "hash": "4722e48d0dea77f7", "title_fa": "چرا تام پتی «Origins 1971-1978» جعبه معمولی شما نیست: «نکته مهم ساخت یک آلبوم خوب بود»", "summary_fa": "آدریا پتی می‌گوید که یک سالگرد برای او یک چیز بازاریابی بسیار ناخوشایند است. اما امسال پنجاهمین سالگرد اولین آلبوم پدرش، تام پتی فقید، و گروهش Heartbreakers، فرصت داستان سرایی بسیار خوبی بود. من واقعاً می‌خواهم از Heartbreakers در این سال قدردانی کنم، زیرا همه آنها زنده هستند و به دستاوردهای زیادی دست یافته‌اند و هنوز هم قوی هستند. این سالگرد واقعا برای ما مهم است. برای ما واقعا مهم است که همه وقتی هنوز زنده هستند گل هایشان را بگیرند…. ( Origins ) نموداری موزیکال است که نشان می دهد چگونه تام به تام و Heartbreakers تبدیل شد و چگونه به این موسیقی راه پیدا کردند. جمعه (آبان. 6)، Origins نشان‌دهنده یک تعهد دو ساله است که در اعماق خزانه‌های پتی و Heartbreakers انجام می‌شود، که عمدتاً توسط Trust مغزی Petty Legacy LLC انجام می‌شود که شامل تهیه‌کننده/مهندس قدیمی رایان اولیت و مدیران ویل بوتوین و اسکات گریر نیز می‌شود. مجموعه چند دیسکی شامل میکس‌های جدیدی از تام پتی و قلب‌شکن‌ها و فیلم 1978 You Re Gonna Get It است! (با نسخه‌های توسعه‌یافته برخی از آهنگ‌ها)، اجرای پخش‌نشده Live From the Record Plant در سال 1977 و ویدئوهایی از تست سوت خاکستری قدیمی بی‌بی‌سی در سال 1978. با این حال، نقطه کانونی No Sleep Til L.A. است که شامل ده‌ها آهنگ اولیه از سال‌های 1971 تا 1971 است که توسط Mubreakers و Sobreakers به اضافه‌ی 1977 ضبط شده است. به Heartbreakers و همچنین پنج مورد دیگر که در EP دوبله The Cut Out Bin گنجانده شده است. آن‌ها نیز به‌عنوان یک آلبوم مجزا و مجزا و همچنین در مجموعه جعبه‌ای منتشر خواهند شد. آدریا پتی، یک موزیک ویدیو و کارگردان تجاری، علاوه بر نقش میراث کوچک، توضیح می دهد که این مجموعه از کار، به نظر من، به نوعی سنگ روزتا برای راک اند رول است. از زمان مرگ", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Tom-Petty-and-the-Heartbreakers-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۵ آبان • ۱۹:۵۴"}, {"source": "Billboard", "title": "25th Anniversary Edition of Britney Spears’ Self-Titled Third LP Features 11 Bonus Tracks: Listen", "link": "https://www.billboard.com/music/pop/britney-spears-third-lp-25th-anniversary-11-bonus-tracks-listen-1236375912/", "summary": "Britney Spears third studio album, 2001 s Britney , was reissued in an expanded edition on Friday (Nov. 6) featuring the entire original album along with 11 bonus tracks. The digital version of the LP is available now, with a physical package due out on Jan. 22 available for pre-order now here . Related Queens of the Stone Age Crowned on ARIA Chart With Perfecth Britney Spears Seemingly Calls Out Stars Copying Her Image: At Least Mine Was Real Lil Baby Brings Fresh to Life: Stream It Now The expanded edition also includes five songs that are being officially released for the first time: the 2022 Pepsi commercial track “Right Now (Taste The Victory),” “She’ll Never Be Me,” “Am I A Sinner,” “When I Say So” and “My Big Secret, as well as two remixes, Overprotected (Darkchild Remix),” and “Boys (feat. Pharrell Williams) (The Co-Ed Remix). The vinyl version of the album will be pressed on Bombastic Blue Splatter, with the package for the physical version including unreleased photos from the period when the singer recorded the LP, according to a press release. Another vinyl variant, a liquid-filled version from Bad World, is also available for pre-order today. Britney was originally released on Nov. 6, 2001 and debuted at No. 1 on the Billboard 200, cementing Spears place in music history as the first female artist ever to have their first three studio albums debut at No. 1. It spawned the Billboard Hot 100 No. 27 hit I m a Slave 4 U and the Nov. 86 hit Overprotected, and featured the fan-favorite songs I m Not a Girl, Not Yet a Woman, as well as Boys, and a cover of Joan Jett s I Love Rock n Roll. The original album ends with What It s Like to Be Me, a track co-written and co-produced by Spears then boyfriend, *NSYNC s Justin Timberlake, and choreographer Wade Robson. Spears, who has said she is effectively retired from the music business, has not released a new album since 2016 s Glory and does not appear to be involved in the promotion of the anniversary edition. She did, however, preview the classic Britney pop banger She ll Never Be Me , last month, giving fans a listen to the song she co-wrote with Timberlake along with Bradley Daymond (*NSYNC) and Alex Greggs (*NSYNC, Paris Hilton) and which was co-produced by Riprock ‘n’ Alex G. The resurfaced unreleased songs are the first new music from Spears since she teamed with will.i.am on 2023 s one-off Mind Your Business. In January, Spears vowed that she would “ never perform in the U.S. again ,” seven years af", "date_str": "2026-11-06T16:02:23+00:00", "hash": "94e0f106b44a4cf9", "title_fa": "نسخه بیست و پنجمین سالگرد سومین آلبوم بریتنی اسپیرز دارای 11 آهنگ ه نخل طلا - که آخرین فیلم او، آبدره، ارسال رسمی رومانی برای بهترین فیلم بلند بین المللی در اسکار است - رهبری هیئتی از کشورش در بازار فیلم آمریکا آینده را بر عهده خواهد داشت، جایی که رومانی به عنوان اولین کشور مورد توجه تاریخ قرار گرفته است. هیئت رومانیایی یک فضای نمایشگاهی اختصاصی در Fairmont برای ملاقات با خریداران بین المللی و شرکای صنعتی خواهد داشت. شرکت‌های حاضر عبارتند از Augmented Films، Bulls Records، Idea Film، Nomad Films Global، Profesional Film Partners، Quantum Media Creative، Frame Film، Mavish Ask، Negrea Visuals، Sýmbolon و مشاوره بازاریابی Tarnovski. این ابتکار با نمایش بازار فیلم‌های رومانیایی در سینمای AMC Century City 15، از جمله درام روان‌شناختی Comatogen، فیلمساز مولداوی، ایگور کوبیلینسکی تکمیل می‌شود. مستند سفر دوچرخه سواری آندری دااسکالسکو Gone Guy; درام Ligia Ciornei Grounded که در آغاز جنگ در اوکراین اتفاق می افتد. و تریلر The Circle اثر والریو آندریوتا. مونگیو یکی از سخنرانان پنلی با عنوان فراتر از موج جدید: رومانی به عنوان شریک تولید بعدی شما خواهد بود که در نوامبر برگزار می شود. 14 در Fairmont. والنتین ساوو، مدیر کل دفتر رومانیایی فیلم و سرمایه گذاری در فرهنگ، به او روی صحنه خواهد پیوست. آلما باکولا، رئیس تولید و شریک شرکت آیکون فیلمز در بخارست؛ و تهیه کنندگان برجسته رومانیایی، ایولیانا تارنووتچی، گابریل پوپسکو و ایونو یونسکو. این پنل فرصت های فیلمبرداری در رومانی، مشارکت با تولیدکنندگان محلی و دسترسی به مشوق های تولید این", "image_url": "https://variety.com/wp-content/uploads/2026/11/Getty-Images-Portrait-Studio-Presented-By-IMDb-And-IMDbPro-At-The-Intercontinental-Hotel-Toronto-2026-1000_68395f.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "بورس و طلا"], "datetime_fa": "۱۵ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Weezer: Photos From the Billboard Cover Shoot", "link": "https://www.billboard.com/photos/weezer-photos-billboard-cover-shoot-1236373143/", "summary": "Rivers Cuomo is reclining in a zero-gravity chair in a musty, windowless room deep within Tampa, Fla.’s Benchmark Arena — baseball cap on his head, a copy of Cormac McCarthy’s Blood Meridian and a pair of headphones beside him. Nearby, there’s a keyboard, a small drum kit and an acoustic guitar that his Weezer bandmate, drummer Patrick Wilson, periodically picks up and noodles on; a jar of peanut butter; a printed, official-looking setlist on a spreadsheet; and a paper bag labeled “clarinet books” in marker. It’s flummoxing to consider that in just a few hours, this soft-spoken iteration of the Weezer frontman will be channeling the power-pop gods onstage for thousands of screaming fans. But this is Cuomo in power-saving mode, restoring the energy he burned onstage the night prior outside of Fort Lauderdale and didn’t quite recover on the four-hour overnight bus ride across the Sunshine State. Yet at precisely 9:12 p.m. on this October night — just like every show night this tour — the lights will go down for Weezer’s headlining set, and Cuomo will transform. This is the precise time that, like clockwork, the lights have gone down for every show on the Weezer: The Gathering Tour, and it’s the time they will continue to go down for its remainder; if all goes as planned, Weezer will leave the stage at 10:53 p.m. on the dot. A prerecorded video plays, setting up the show’s concept: A kid makes a wish for Weezer to play at his house, and when the quartet receives the magical transmission, it links up to answer the call. Finally, after the clip rolls, one of the great American rock bands strides onto the stage — which is decked out with a fake house, fence, yard and power lines to resemble the home from the video. “Dearly beloved, we’re gathered here tonight,” Cuomo declares into his mic as the band revs up, “to celebrate a thing called Weezer!” Read the full Weezer Billboard cover story here. Weezer will be honored with the Legend of Live award and sit down for an exclusive Q A at the 2026 Billboard Live Music Summit on Nov. 10 at the 1 Hotel West Hollywood. Tickets for the Nov. 10 event are available here .", "date_str": "2026-11-06T15:01:26+00:00", "hash": "caba85ecc777fe67", "title_fa": "Weezer: Photos from the Billboard Cover Shoot", "summary_fa": "ریورز کومو روی صندلی گرانش صفر در اتاقی کپک‌آلود و بدون پنجره در اعماق تامپا، ورزشگاه بنچمارک فلوریدا - کلاه بیسبال روی سرش، کپی از مریدین خونی کورمک مک کارتی و یک جفت هدفون در کنارش، خوابیده است. در همان نزدیکی، یک کیبورد، یک درام کیت کوچک و یک گیتار آکوستیک وجود دارد که هم گروه ویزر، درامر پاتریک ویلسون، هر چند وقت یکبار آن را برمی دارد و نودل می زند. یک شیشه کره بادام زمینی؛ یک مجموعه چاپ شده با ظاهر رسمی در یک صفحه گسترده. و یک کیسه کاغذی با برچسب \"کتاب های کلارینت\" در نشانگر. عجیب است که در نظر بگیریم که تنها در چند ساعت، این تکرار با زبان نرم پیشکسوت ویزر، خدایان پاور پاپ را روی صحنه برای هزاران طرفدار فریاد می کشد. اما این کومو در حالت صرفه جویی در مصرف انرژی است و انرژی را که شب قبل در خارج از فورت لادردیل روی صحنه سوزانده بود بازیابی می کند و در سفر چهار ساعته اتوبوس در طول شب در ایالت Sunshine کاملاً بهبود نیافته است. با این حال دقیقاً در ساعت 9:12 شب. در این شب اکتبر - درست مانند هر شب نمایشی در این تور - چراغ ها برای مجموعه تیترهای ویزر خاموش می شوند و کومو متحول می شود. این زمان دقیقی است که، مانند ساعت، چراغ‌ها برای هر نمایش در Weezer: The Gathering Tour خاموش می‌شوند، و زمانی است که آن‌ها برای باقیمانده‌اش خاموش می‌شوند. اگر همه چیز طبق برنامه پیش برود، ویزر در ساعت 22:53 صحنه را ترک خواهد کرد. روی نقطه یک ویدیوی از پیش ضبط‌شده پخش می‌شود و مفهوم نمایش را تنظیم می‌کند: یک بچه آرزو می‌کند که ویزر در خانه‌اش بازی کند، و وقتی گروه کوارتت انتقال جادویی را دریافت می‌کند، برای پاسخ دادن به تماس وصل می‌شود. در نهایت، پس از پخش کلیپ،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/cover-weezer-billboard-2026-bb12-pooneh-ghana-1-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۱۸:۳۱"}, {"source": "Billboard", "title": "Feid Announces Ferxxo – The Green Star Tour 2027: See North American Dates", "link": "https://www.billboard.com/music/latin/feid-2027-tour-dates-ferxxo-green-star-tour-ticket-info-1236374747/", "summary": "Feid is bringing his Ferxxo experience to arenas across North America. The Colombian hitmaker will launch Ferxxo – The Green Star Tour 2027 on Feb. 5 at Orlando’s Kia Center, Billboard can report Friday (Nov. 6). Promoted by Live Nation, the tour will travel through major markets including Miami, New York, Toronto, Chicago, Dallas and Los Angeles before continuing to Mexico. The run is set to conclude in Mexico City on May 27. The new arena trek gives fans a chance to hear the global Latin music star’s chart-topping catalog alongside the energy and stage presence that have helped make him one of the genre’s defining artists. The announcement bills it as Feid’s biggest stage yet. Tickets go on sale to the general public on Nov. 12 at 10 a.m. local time via Ticketmaster . Presales are scheduled to begin Nov. 10. Fans can visit elgreenprint.com for tour information and presale registration. Citi cardmembers will also have access to a presale through Citi Entertainment. VIP packages, which may include premium tickets, early venue entry and access to a pre-show lounge, will be available through VIP Nation . Throughout his career, Feid has placed seven songs on the Billboard Hot 100 and 25 on the Billboard Global 200 . He has collaborated with artists including Bad Bunny, J Balvin, Ty Dolla $ign and DJ Premier. In 2023, the Medellín superstar was featured on the cover of Billboard . Here are Feid s Ferxxo – The Green Star Tour 2027 dates: Feb. 5 — Orlando, Fla. — Kia Center Feb. 6 — Tampa, Fla. — Benchmark International Arena Feb. 11 — Miami — Kaseya Center Feb. 18 — Duluth, Ga. — Gas South Arena Feb. 20 — Charlotte, N.C. — Spectrum Center Feb. 23 — Boston — TD Garden Feb. 25 — Washington, D.C. — Capital One Arena Feb. 26 — Philadelphia, Pa. — Xfinity Mobile Arena Feb. 28 — Hartford, Conn. — Peoples Bank Arena March 3 — Brooklyn — Barclays Center March 11 — Toronto — Scotiabank Arena M 0 و 25 آهنگ را در Billboard Global 200 قرار داده است. او با هنرمندانی از جمله Bad Bunny، J Balvin، Ty Dolla $ign و DJ Premier همکاری کرده است. در سال 2023، سوپراستار مدلین روی جلد بیلبورد قرار گرفت. تاریخ‌های Feid s Ferxxo – The Green Star Tour 2027: 5 فوریه – اورلاندو، فلوریدا – کیا سنتر 6 فوریه – تامپا، فلوریدا", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Feid-Photographer-Sismatyc.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Stove God Cooks Finds Home for Highly-Anticipated Sophomore Album", "link": "https://www.billboard.com/pro/stove-god-cooks-all-this-for-me/", "summary": "Stove God Cooks has found a home for his much anticipated sophomore album. After a year of false starts, a scrapped Goat Stamp album, a February lead single in Welcome to My Garden and a previous March 27 release date , All This For Me? will be released early 2027 via Babygrande Records in partnership with Warner Records Billboard has exclusively learned. And while the Syracuse, N.Y. rapper has been keeping himself busy with features on songs like “ Live or Let Die ” with French Montana and Max B and “ The Aroma ” with Fat Joe and Jadakiss , he s remained patient and is excited to finally give his fans a new full length album. “Everything played out exactly how it was supposed to, he said in a press release. Real power is knowing when to walk away! Even from something the world thinks you need. A lot of people are afraid to do that. I’m not one of them. When God has His hand on you, what’s meant for you can’t miss you. This new season isn’t luck! It’s confirmation! I’m excited about this next chapter and what we’re building with Warner Records, but even more excited to give my fans the music and the moment they’ve patiently waited for.” Chuck Wilson , founder and CEO of Babygrande Records used his industry connects to help find a home for this particular record after he and Stove r  اندوه در کنار تسکین وجود دارد. او ادامه داد: همه چیز رنگ و بویی دارد و در دادگاه ثابت شد که یک اتفاق وحشتناک رخ داده است و این بدان معنی است که یک اتفاق وحشتناک رخ داده است. رایان قبلاً در سال 2022 هنگامی که به لوئیس تروکس در مجموعه مستند بی‌بی‌سی خود گفت که با یک کمدین مرد ناشناس در مورد رفتارهای غارتگرانه او روبرو شده بود، خبرساز شد. در طول مصاحبه، رایان گفت که در کنار مردی در یک برنامه تلویزیونی کار کرده است و او را یک شکارچی نامید و عواقب قانونی احتمالی آن را به عنوان یک میدان مین دعوا توصیف کرد. نظرات او به این گمانه زنی دامن زد که اشاره او به برند است. رایان هرگز به طور علنی هویت کمدین مورد بحث خود را تایید نکرده است. برند، 51 ساله، روز پنجشنبه به دلیل یک مورد تجاوز جنسی و سه مورد تجاوز جنسی پس از یک محاکمه چهار هفته ای در دادگاه سلطنتی Southwark لندن مجرم شناخته شد. او از دو اتهام تجاوز جنسی دیگر و یک مورد تجاوز غیرقانونی تبرئه شد. این کمدین که تمام", "image_url": "https://variety.com/wp-content/uploads/2026/11/katherine-ryan-russell-brand-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۵ آبان • ۱۸:۴۶"}, {"source": "Billboard", "title": "Tom Jones Thought His Life Was ‘Over’ After Recent Battle With the Flu: ‘You’ve Had a Wonderful Life’", "link": "https://www.billboard.com/music/pop/tom-jones-thought-life-over-flu-hospital-return-stage-1236375859/", "summary": "When Sir T om Jones contracted a nasty upper respiratory infection back in July that forced him to postpone a show in Germany , he apologized to disappointed fans and promised to make it up to them. But on Wednesday night (Nov. 4) during his rescheduled show at the Greek Theatre in Los Angeles on his Come Gather Round tour — which was originally scheduled for Oct. 26 and then postponed after Jones contracted the flu — Jones, 86, revealed that his latest health scare had him fearing the worst. [I thought], Oh, well, this is it,' he told the crowd at the Greek, according to BBC News . You ve had a wonderful life, Tommy, but it s over right now. Jones reportedly spent a week at the Ronald Reagan UCLA Medical Center in Los Angeles due to the illness described at the time as a bad case of the flu , which resulted in the rescheduling of shows in L.A. and San Diego. He later had to reschedule another California show as doctors ordered more rest and then postponed gigs in Sacramento and San Francisco as well on doctor s advice. I must say this, in the UCLA, they really did a wonderful job. So I m here, he told the L.A. audience. [The medical staff said] What do you want to do now? I was there for a week. And I said, I ve got to get back on the stage. This is where I belong. I can t live without this, believe me.' Jones next scheduled show is a rescheduled gig at the Yaamava Theater in Highland, Calif. on Friday night (Nov. 6).", "date_str": "2026-11-06T14:29:16+00:00", "hash": "c2791f01ef95eb7d", "title_fa": "تام جونز فکر می کرد که زندگی او پس از نبرد اخیر با آنفولانزا به پایان رسیده است: \"شما زندگی شگفت انگیزی داشته اید\"", "summary_fa": "هنگامی که در ماه ژوئیه سر تی ام جونز دچار عفونت تنفسی فوقانی شد که او را مجبور به تعویق یک نمایش در آلمان کرد، از طرفداران ناامید عذرخواهی کرد و قول داد که آن را جبران کند. اما چهارشنبه شب (4 نوامبر) در طول نمایش برنامه ریزی شده خود در تئاتر یونانی در لس آنجلس در تور Come Gather Round خود - که در ابتدا برای 26 اکتبر برنامه ریزی شده بود و سپس پس از ابتلای جونز به آنفولانزا به تعویق افتاد - جونز، 86 ساله، فاش کرد که آخرین ترس از سلامتی او باعث شده است که از بدترین حالت می ترسد. به گزارش بی بی سی نیوز، او به جمعیت یونانی گفت، اوه، خوب، همین است. تو زندگی فوق‌العاده‌ای داشتی، تامی، اما الان تمام شده است. جونز یک هفته را در مرکز پزشکی رونالد ریگان UCLA در لس آنجلس گذراند به دلیل بیماری که در آن زمان به عنوان یک مورد بد آنفولانزا توصیف شد، که منجر به برنامه ریزی مجدد نمایش ها در لس آنجلس و سن دیگو شد. او بعداً مجبور شد یک برنامه دیگر در کالیفرنیا را برنامه ریزی کند زیرا پزشکان دستور استراحت بیشتری دادند و سپس اجرای برنامه در ساکرامنتو و سانفرانسیسکو و همچنین به توصیه پزشک به تعویق افتاد. این را باید بگویم، در UCLA، آنها واقعاً کار فوق العاده ای انجام دادند. او به مخاطبان لس آنجلس گفت پس من اینجا هستم. [کارکنان پزشکی گفتند] حالا می‌خواهی چه کار کنی؟ یک هفته آنجا بودم. و من گفتم، باید به صحنه برگردم. این جایی است که من به آن تعلق دارم. من نمی توانم بدون این زندگی کنم، باور کنید. نمایش برنامه ریزی شده بعدی جونز، یک کنسرت برنامه ریزی شده در تئاتر یااماوا در هایلند، کالیفرنیا در جمعه شب (6 نوامبر) است. آدرس ایمیل شما منتشر نخواهد شد. فیلدهای", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/1486427880-e1793973539408.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۵ آبان • ۱۷:۵۹"}, {"source": "Billboard", "title": "Splice Reimagines the DAW With ‘Create’ — Its Agentic AI-Powered Platform for Newcomers", "link": "https://www.billboard.com/pro/splice-daw-create-agentic-ai-powered-platform/", "summary": "Splice has launched its first-ever digital audio workstation (DAW), featuring agentic and assistive AI features to help new producers learn the program and finish songs. Most notably, the DAW features a chatbot, offering production tips and following instructions from a producer s voice or text prompts. It also offers a way to mix and match samples from the Splice library with greater ease. The company, known best for its library of more than three million human-made, licensed samples and loops, enters the DAW market at a time of disruption. While incumbent DAWs, like Ableton, Logic, ProTools and FL Studio, remain the market s top players, new browser-based applications, like BandLab, have grown a fanbase in recent years, offering a simpler and cheaper option for the novice producer. Plus, as generative AI has taken hold, AI platforms like Suno and Moises have also leaned in to DAW features to provide users with more optionality after a track is generated. Related AI’s Second Wave, From Anxiety to Imagination (Guest Column) Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Meanwhile, remixing and DJ-like features — which also encourage fans to customize their favorite songs — have never been of greater interest. Spotify , Udio, Klay and more are working on AI-powered music remix features. Both Spotify and Apple Music include DJ features in-app, and start-ups like Hook are working on licensed remix concepts for the TikTok generation. Despite all the buzz of generative AI, Splice has held steadfast on its commitment to providing only human-created samples, loops and instruments, instead, opting to use AI to better tailor and customize those samples by using it to better shift timbre, key, tempo and more. In 2023, Splice s CEO, Kakul Srivastava , said in an interview with Billboard : One of the things that we find disturbing about a lot of the work that is happening in generative AI is that it is push button creativity, she said. For us, that’s eliminating the creative as opposed to putting tools into the creatives’ hands. In that interview, she discussed Splice s Create in its first form: an AI-powered tool to mix and match Splice samples to, hopefully, help producers begin the song creation process and help them find the perfect sample faster. Now, Create has morphed into a full-fledged DAW, thanks to its acquisition of Kits AI at the start of the year. ", "date_str": "2026-11-06T14:24:20+00:00", "hash": "6400dc645f5b3f49", "title_fa": "Splice DAW را با «Create» دوباره تصور می کند - پلتفرم عاملی با هوش مصنوعی آن برای تازه واردان", "summary_fa": "Splice اولین ایستگاه کاری صوتی دیجیتال خود (DAW) را راه اندازی کرده است که دارای ویژگی های هوش مصنوعی عاملی و کمکی است تا به تولیدکنندگان جدید کمک کند برنامه را یاد بگیرند و آهنگ ها را به پایان برسانند. مهمتر از همه، DAW دارای یک ربات چت است که نکات تولید را ارائه می دهد و دستورالعمل های صوتی یا متنی تولید کننده را دنبال می کند. همچنین راهی برای ترکیب و تطبیق نمونه ها از کتابخانه Splice با سهولت بیشتر ارائ
