شخصی فراتر از چهار حوزه تمرکز نمی شد. این پست را در اینستاگرام مشاهده کنید این طعنه کمتر از دو سال پس از اجرای Soulja Boy در Crypto Ball، رویدادی که در جشن تحلیف دونالد ترامپ در ژانویه 2025 برگزار شد، انجام شد و بعداً با بیان اینکه او برای این کنسرت دستمزد خوبی دریافت کرده بود، واکنش‌های منفی را از بین برد. این ایده نیز کاملاً جدید نیست. در ژانویه 2019، Saturday Night Live مصاحبه ویروسی Soulja Boy با Breakfast Club را به طرحی تبدیل کرد که تصور می کرد او برای ریاست جمهوری نامزد می شود، کریس رد در نقش خواننده رپ و مدعی اعتبار برای الهام بخشیدن به ترامپ و باراک اوباما است. Soulja Boy در آن"}, {"source": "Billboard", "title": "Night One Of Head Trip 2026 Ends Early Due to Weather", "link": "https://www.billboard.com/music/music-news/head-trip-2026-ends-early-weather-1236358640/", "summary": "The first night of Head Trip 2026 , a one-time-only dance music festival on the Coachella grounds in Indio, Calif., has ended early due to weather. At 9 p.m. PT on Saturday (Oct. 10), a set by Under Construction (the duo made up of Fisher and Chris Lake) was cut off by an announcement saying, Attention, in the festival, this is a lightning alert. The show is suspended due to lightning. Exit the venue the way you entered or seek shelter in personal vehicles or shuttle. Related Goldenvoice to Host New Head Trip Fest at Coachella Grounds With Skrillex, Calvin Harris More Charli XCX Welcomes Tinashe for Surprise Performance at 2026 Austin City Limits Festival For World Mental Health Day, a check-up on the music industry Within a half hour, attendees were informed that the show would not be continuing on night one, with the festival app being updated to say Tonight s show has ended. Due to continued lightning in the area, tonight s show will not resume. Please exit safely the way you entered. We ll share updates soon. Campers were later advised to continue to shelter in their vehicles until further notice as a weather system containing lightning moved into the Coachella Valley region, as tropical storm Rachel hit the coast of Southern California. The night s headliner Calvin Harris , who was due to take the stage at 9:30 p.m. PT following the performance by Under Construction, which followed a b2b set by Peggy Gou and Four Tet and another b2b from Seth Troxler and Ben Sterling. Rain is currently predicted to fall in Indio and the wider region through Sunday morning. Day two of Head Trip is scheduled to begin in the early afternoon and into the night with sets from DJ Harvey, The Blessed Madonna, Dom Dolla b2b Kettama, Skrillex and Swedish House Mafia. Head Trip is a one-time-only festival by Goldenvoice, which follows the template of the 2023 metal-focused Power Trip and the 2016 classic rock fest Desert Trip.", "date_str": "2026-10-11T06:22:50+00:00", "hash": "bc6682a4d783c0c5", "title_fa": "Night One Of Head Trip 2026 به دلیل آب و هوا زود به پایان می رسد", "summary_fa": "شب اول Head Trip 2026، یک جشنواره موسیقی رقص که فقط یک بار در زمین کواچلا در ایندیو، کالیفرنیا برگزار می شود، به دلیل آب و هوا زود به پایان رسید. ساعت 9 شب PT در روز شنبه (10 اکتبر)، مجموعه‌ای از Under Construction (دو نفر متشکل از فیشر و کریس لیک) با اعلامیه‌ای که می‌گفت، توجه کنید، در جشنواره، این یک هشدار رعد و برق است، قطع شد. نمایش به دلیل صاعقه به حالت تعلیق درآمد. همانطور که وارد شده اید از محل خارج شوید یا در وسایل نقلیه شخصی یا شاتل به دنبال سرپناه باشید. Goldenvoice مرتبط به میزبانی جشنواره سفر جدید سر در Coachella Grounds با Skrillex، Calvin Harris More Charli XCX از Tinashe برای اجرای شگفت‌انگیز در جشنواره محدودیت‌های شهر آستین 2026 استقبال می‌کند برای روز جهانی سلامت روان، بررسی صنعت موسیقی در عرض نیم ساعت، شرکت‌کنندگان در یک شب مطلع نشدند که برنامه به‌روزرسانی نمی‌شود. برنامه امشب تموم شد به دلیل ادامه رعد و برق در منطقه، نمایش امشب از سر گرفته نمی شود. لطفا با خیال راحت از راهی که وارد شده اید خارج شوید. به‌زودی به‌روزرسانی‌ها را به اشتراک خواهیم گذاشت. پس از آن که طوفان استوایی ریچل به سواحل کالیفرنیای جنوبی برخورد کرد، بعداً به افراد کمپ توصیه شد که تا اطلاع ثانوی در وسایل نقلیه خود به پناهگاه ادامه دهند زیرا یک سیستم هواشناسی حاوی رعد و برق به منطقه دره کواچلا حرکت کرد. کالوین هریس، تیتر لاین شب، که قرار بود ساعت 9:30 شب روی صحنه برود. PT پس از اجرای Under Construction، که به دنبال یک مجموعه b2b توسط پگی گو و فور تت و یک b2b دیگر از ست تراکسلر و بن استرلینگ بود. پیش‌بینی می‌شود در حال حاضر تا صبح یکشنبه در هندو و مناطق وسیع‌تر باران ببارد. قرار است روز دوم Head Trip در اوایل بعد"}, {"source": "Billboard", "title": "Barry Manilow Walks Off Stage, Cancels Vegas Shows Due to Bronchitis", "link": "https://www.billboard.com/music/music-news/barry-manilow-cuts-short-las-vegas-show-cancels-concerts-1236358635/", "summary": "Barry Manilow has cut short his return to Las Vegas, walking offstage two songs into a show and canceling a pair of concerts after coming down with bronchitis. The 83-year-old had only just returned to the International Theater at the Westgate Las Vegas Resort Casino on Thursday (Oct. 8), in what his team called a “triumphant welcome-back concert” following a weeks-long break. But at Friday’s show, he stopped after two songs — reportedly telling the crowd, “Talk amongst yourselves” — and didn’t come back. According to Vital Vegas , his band played instrumentals before a voice came over the PA to announce the show was over, and attendees said they later received refund emails from Ticketmaster. Saturday’s concert was called off entirely. “After a triumphant welcome-back concert on Thursday, Barry got hit with bronchitis and had to cancel his Friday and Saturday shows,” a representative for the musician and the venue told Variety . The illness carries particular significance for Manilow. He disclosed in December 2025 that he had been diagnosed with early-stage lung cancer, discovered after doctors ordered scans while he was recovering from a bout of bronchitis; he subsequently underwent surgery. The health issues repeatedly postponed his Westgate residency, originally set to begin in February, before he returned to the stage in the U.K. and resumed Vegas dates in July. In late August, he announced another break after a demanding summer run, saying “we were pushing a little too hard.” His team has not said whether upcoming dates — the residency is listed to continue Oct. 15 — will be affected. One of the most successful recording artists of all time, Manilow has sold more than 85 million records worldwide. He scored his first Billboard Hot 100 No. 1 with “Mandy” in 1975 and went on to land three chart-toppers, including “I Write the Songs” and “Looks Like We Made It,” along with a long run of adult-contemporary staples such as “Copacabana (At the Copa)” and “Can’t Smile Without You.” He has charted more than a dozen top-40 Hot 100 hits and remains a fixture on Billboard’s Adult Contemporary chart, where his 2026 single “Once Before I Go” reached the top 10. Manilow’s Westgate residency has made him one of Las Vegas’ most enduring headliners, with his tally of shows at the venue surpassing Elvis Presley’s record.", "date_str": "2026-10-11T03:52:24+00:00", "hash": "50f7fe788424edd6", "title_fa": "بری مانیلو از صحنه خارج می‌شود، نمایش‌های وگاس را به دلیل برونشیت لغو می‌کند", "summary_fa": "بری مانیلو بازگشت خود را به لاس وگاس کوتاه کرد و دو آهنگ را از صحنه خارج کرد و در یک برنامه اجرا کرد و یک جفت کنسرت را پس از ابتلا به برونشیت لغو کرد. این مرد 83 ساله به تازگی در روز پنجشنبه (8 اکتبر) به تئاتر بین المللی در Westgate Las Vegas Resort Casino بازگشته بود. اما در برنامه روز جمعه، او پس از دو آهنگ متوقف شد - طبق گزارش ها به جمعیت گفت: \"در میان خود صحبت کنید\" - و دیگر برنگشت. به گفته ویتال وگاس، گروه او قبل از اینکه صدایی در PA برای اعلام پایان نمایش به گوش برسد، ساز می نواخت و شرکت کنندگان گفتند که بعدا ایمیل های بازپرداختی از Ticketmaster دریافت کردند. کنسرت شنبه به کلی لغو شد. یکی از نمایندگان این نوازنده و محل برگزاری به ورایتی گفت: «بعد از یک کنسرت پیروزمندانه خوش آمدگویی در روز پنجشنبه، بری دچار برونشیت شد و مجبور شد برنامه های جمعه و شنبه خود را لغو کند. این بیماری برای مانیلو اهمیت خاصی دارد. او در دسامبر 2025 فاش کرد که به سرطان ریه در مراحل اولیه مبتلا شده است که پس از دستور پزشکان در حین بهبودی از برونشیت، تشخیص داده شد. او پس از آن تحت عمل جراحی قرار گرفت. مسائل بهداشتی بارها و بارها اقامت وی ​​در وستگیت را به تعویق انداخت، که در ابتدا قرار بود در فوریه آغاز شود، قبل از اینکه او به صحنه تئاتر در بریتانیا بازگشت و در ماه جولای تاریخ های وگاس را از سر گرفت. در اواخر آگوست، او پس از یک دوره سخت تابستانی، یک وقفه دیگر را اعلام کرد و گفت: «ما کمی سخت می‌کشیدیم». تیم او نگفته است که آیا تاریخ های آینده - اقامت در لیست برای ادامه 15 اکتبر - تحت تاثیر قرار خواهد گرفت یا خیر."}, {"source": "Billboard", "title": "‘Golden’ Is Still Golden, Wins Best Song at 2026 World Soundtrack Awards (Full Winners List)", "link": "https://www.billboard.com/music/awards/2026-world-soundtrack-awards-winners-list-1236358619/", "summary": "“Golden” from KPop Demon Hunters is still picking up awards. The global smash, which won a Golden Globe, a Grammy and an Oscar last winter, among many other awards, won best original song at the 2026 World Soundtrack Awards, which were held on Saturday (Oct. 10) at the annual WSA Ceremony Concert during Film Fest Gent, Belgium’s biggest international film festival. Related Golden From KPop Demon Hunters Wins Best Original Song at 2026 Oscars, But Speech Is Cut Short ‘KPop Demon Hunters’ Sets New Record for Most Weeks at No. 1 on Billboard’s Soundtracks Chart: Full List Golden From KPop Demon Hunters Shines as First K-Pop No. 1 in U.K. in 13 Years The song, which was written by Kim Eun-jae, Mark Sonnenblick, Joong Gyu Kwak, Yu Han Lee, Hee Dong Nam, Jeong Hoon Seo and Teddy Park and performed by HUNTR/X: EJAE, Audrey Nuna REI AMI , topped the Billboard Hot 100 for eight weeks. British composer Daniel Pemberton was named film composer of the year for Project Hail Mary , The Drama , The Bad Guys 2 and Masters of the Universe . The television composer of the year award was presented to Jeff Russo for Alien: Earth , Cape Fear and Citadel (Season 2). Hannah Peel took home the award for discovery of the year, while the public choice award went to Kevin Smithers score for Soy Frankelda . For three days, international film and film music professionals gathered in Music Centre De Bijloke in the historic heart of Ghent for talks, workshops and masterclasses about the art of composing film music. The last day concluded with the award ceremony and a live concert with selected music by WSA guest of honour Hildur Guðnadóttir and lifetime achievement award recipient Trevor Jones, performed by Brussels Philharmonic and conducted by Dirk Brossé. Here’s a complete list of winners at the 2026 World Soundtrack Awards. Film composer of the year Alexandre Desplat – Frankenstein; Eagles of the Republic; Jurassic World Rebirth; L’homme qui rétrécit (The Shrinking Man) Jonny Greenwood – One Battle After Another Hildur Guðnadóttir – The Bride!; Hedda; 28 Years Later: The Bone Temple WINNER: Daniel Pemberton – Project Hail Mary; The Drama; The Bad Guys 2; Masters of the Universe Max Richter – Hamnet Television composer of the year David Fleming – Widow’s Bay Finneas O’Connell – Beef (season two) Martin Phipps, Benji Merrison – Steal Dave Porter – Pluribus WINNER: Jeff Russo – Alien: Earth; Cape Fear; Citadel (season two) Best original song WINNER: “Golden” from KPop Demon Hunters – w", "date_str": "2026-10-10T23:16:32+00:00", "hash": "1c6ff83d6eaea507", "title_fa": "\"طلایی\" هنوز طلایی است، برنده بهترین آهنگ در جوایز موسیقی متن جهانی 2026 (فهرست کامل برندگان)", "summary_fa": "\"طلایی\" از KPop Demon Hunters هنوز در حال گرفتن جوایز است. این فیلم جهانی که زمستان گذشته برنده گلدن گلوب، گرمی و اسکار شد، در کنار جوایز دیگر، بهترین آهنگ اصلی را در جوایز موسیقی متن جهانی 2026 که در روز شنبه (10 اکتبر) در کنسرت سالانه WSA در جریان فیلم Fest Gent، بزرگترین جشنواره بین المللی فیلم بلژیک برگزار شد، دریافت کرد. Golden مرتبط از KPop Demon Hunters برنده بهترین آهنگ اصلی در اسکار 2026 شد، اما Speech Is Cut Short \"KPop Demon Hunters\" رکورد جدیدی را برای اکثر هفته ها در رتبه اول جدول موسیقی متن بیلبورد ثبت کرد: فهرست کامل Golden From KPop Demon Hunters به ​​عنوان اولین K-Pop No.K می درخشد. در 13 سال این آهنگ که توسط کیم یون جائه، مارک سوننبلیک، جونگ گیو کواک، یو هان لی، هی دونگ نام، جئونگ هون سو و تدی پارک نوشته شده بود و توسط HUNTR/X: EJAE، Audrey Nuna REI AMI اجرا شد، برای 10 هفته در بالای بیلبورد قرار گرفت. آهنگساز بریتانیایی دانیل پمبرتون برای پروژه های درود مری، درام، بدها 2 و استادان کیهان به عنوان آهنگساز فیلم سال انتخاب شد. جایزه آهنگساز تلویزیونی سال به جف روسو برای فیلم Alien: Earth، Cape Fear و Citadel (فصل 2) اهدا شد. هانا پیل جایزه کشف سال را به خانه برد، در حالی که جایزه انتخاب عمومی به کوین اسمیترز برای سویا فرانکلدا رسید. به مدت سه روز، متخصصان بین‌المللی فیلم و موسیقی فیلم در مرکز موسیقی De Bijloke در قلب تاریخی گنت برای گفتگو، کارگاه‌ها و مسترکلاس‌ها درباره هنر ساخت موسیقی فیلم گرد هم آمدند. روز آخر با مراسم اهدای جوایز و یک کنسرت زنده با موسیقی منتخب مهمان افتخاری WSA و تروور جونز برنده جایزه یک عمر دستاورد، با اجرای فیلارمونیک بروکسل و رهبری دیرک بروسه به پایان رسید. در اینجا لیست کاملی از برندگان جوایز"}, {"source": "Billboard", "title": "Geordie Greep Responds to Sexual Misconduct Allegation, Cancels Tour Dates", "link": "https://www.billboard.com/music/music-news/geordie-greep-misconduct-allegation-cancels-tour-dates-1236358602/", "summary": "Geordie Greep is responding to sexual misconduct allegations made against him. During his show in Vancouver on Thursday (Oct. 8), the former Black Midi frontman addressed accusations of rape after an individual outside the Pearl venue distributed flyers to concertgoers accusing him of sexual assault. The flyers read , “Geordie Greep A Rapist. You know what you did this morning Oct 8th. He thinks he can do what he wants. Let Him Know What Vancouver Thinks of Rapists.” Greep took the stage about an hour later than scheduled and performed without his backing band, addressing the flyers distributed outside the venue. “Essentially what happened last night, me and some of the band we went out to some bars, we went around, we met people, and it ended up in a situation where really late at a house party, I got the wrong end of the stick with someone who was there, and I made a move, and it didn’t come off, Greep told the audience . “I really quickly, of course, apologized, and it was a complete misunderstanding on my part. I felt extremely bad, I feel extremely sorry, and extremely upset about the whole situation. I would never rape a woman. I’m not a rapist. It’s not how that went down.” Greep said he would perform the Vancouver concert solo because he didn’t want to force them to still play a show in the light of that happening. He also noted that proceeds from the show would be donated to an anti-violence organization in British Columbia. We were unsure what the response would be to all this, and I can only tell you that it’s okay if people want refunds, if they want to leave, it’s fine, Greep continued. “I just wanted to be transparent with you about what happened. I’m very, very, very sorry. I made someone uncomfortable without meaning to. It’s not a good thing, it’s not good.” Billboard has reached out to Greep s representatives for further comment. Following the allegations, Greep canceled several dates on his current North American tour , including shows in Boise, Idaho, on Friday (Oct. 9), and Salt Lake City, Utah, on Saturday (Oct. 10). He also canceled upcoming concerts scheduled in Boulder and Denver, Colorado. The final two dates of Greep’s North American tour, scheduled for Des Moines, Iowa, and Omaha, Nebraska, had not been canceled at press time. Greep is also scheduled to embark on a European tour beginning Nov. 1 in the Netherlands, followed by shows in France, Spain and Portugal.", "date_str": "2026-10-10T20:04:35+00:00", "hash": "c77b2737032b5976", "title_fa": "Geordie Greep به اتهامات سوء رفتار جنسی پاسخ می دهد، تاریخ های تور را لغو می کند", "summary_fa": "جوردی گریپ به اتهامات سوء رفتار جنسی علیه او پاسخ می دهد. در جریان برنامه خود در ونکوور در روز پنجشنبه (8 اکتبر)، خواننده سابق بلک میدی پس از اینکه فردی در خارج از محل برگزاری Pearl، بروشورهایی را برای شرکت کنندگان در کنسرت پخش کرد و او را به تجاوز جنسی متهم کرد، به تجاوز جنسی متهم شد. در برگه ها نوشته شده بود: \"Geordie Greep A Rapist. شما می دانید که امروز صبح 8 اکتبر چه کردید. او فکر می کند می تواند کاری را که می خواهد انجام دهد. به او اجازه دهید بداند ونکوور در مورد متجاوزین چه فکری می کند. گریپ حدود یک ساعت دیرتر از زمان برنامه ریزی شده روی صحنه رفت و بدون گروه خود به اجرای برنامه پرداخت و به آگهی‌هایی که در خارج از محل پخش شده بود، سخنرانی کرد. گریپ به حضار گفت: «در اصل اتفاقی که دیشب افتاد، من و تعدادی از گروه به چند بار رفتیم، دور زدیم، با مردم آشنا شدیم، و در موقعیتی ختم شد که خیلی دیر در یک مهمانی خانگی، من با کسی که آنجا بود به اشتباه برخورد کردم، و حرکتی انجام دادم، و آن حرکت نکرد. من به شدت احساس بدی داشتم، بسیار متاسفم و به شدت از این وضعیت ناراحت هستم. من هرگز به یک زن تجاوز نمی کنم. من متجاوز نیستم اینطوری نشد.» گریپ گفت که کنسرت ونکوور را به صورت انفرادی اجرا خواهد کرد زیرا نمی‌خواست آنها را مجبور کند که با توجه به این اتفاق همچنان یک برنامه اجرا کنند. او همچنین خاطرنشان کرد که درآمد حاصل از این نمایش به یک سازمان ضد خشونت در بریتیش کلمبیا اهدا خواهد شد. گریپ ادامه داد: ما مطمئن نبودیم که چه پاسخی به این همه خواهد داشت، و من فقط می‌توانم به شما بگویم که اگر مردم بخواهند بازپرداخت کنند،"}, {"source": "Billboard", "title": "Charli XCX Welcomes Tinashe for Surprise Performance at 2026 Austin City Limits Festival", "link": "https://www.billboard.com/music/music-news/charli-xcx-tinashe-2026-austin-city-limits-festival-1236358595/", "summary": "Charli xcx brought out a surprise guest during her headlining set at the Austin City Limits Festival. At Zilker Park on Friday (Oct. 9), Charli welcomed Tinashe to the stage to perform two tracks from the singer’s new album, Popstar , which debuted at No. 6 on the Billboard 200 in early October. Related Charli xcx, Rüfüs Du Sol, ía در SNL: اینجا جایی است که می توان به صورت آنلاین و رایگان شنبه شب زنده در بریتانیا تماشا کرد. : اینجا جایی است که فصل 2 را به صورت آنلاین و رایگان به صورت زنده در Sphere 2027 تماشا کنیم: اینجا کجا می توان بلیط های مقرون به صرفه آنلاین خرید پول در بانک در روز شنبه (10 اکتبر)، از ساعت 6 بعد از ظهر شروع می شود. ET/3 بعد از ظهر PT. این رویداد در مرکز اسموتی کینگ در نیواورلئان، لوئیزیانا برگزار می شود. اگرچه WWE هنوز اعلام نکرده است که چه کسی The Star-Spangled Banner و God Bless America را در شروع رویداد اجرا خواهد کرد، مروجین A Milli توسط Lil Wayne را به عنوان آهنگ رسمی Money in the Bank نامگذاری کردند. به احتمال زیاد رپر در رویداد WWE ظاهر می شود یا آهنگ را اجرا می کند زیرا او اهل نیواورلئان است. اشتراک در DirecTV به شما امکان دسترسی به تلویزیون زنده، کانال های محلی و کابلی"}, {"source": "Billboard", "title": "For World Mental Health Day, a check-up on the music industry", "link": "https://www.billboard.com/music/features/for-world-mental-health-day-2026-1236358584/", "summary": "When Olivia Rodrigo dropped her third studio album You Seem Pretty Sad for a Girl So in Love , it quickly became one of the year’s biggest breakouts, with legions of fans seeing themselves in its melancholy themes of sadness, loneliness and heartache. On the standout track “what’s wrong with me,” she opens the song with a wrenching and telling line: “I m just staring at the ceiling, can t describe this feeling.” Luckily, she was fibbing on that last part: Rodrigo has a knack for describing the depths of despair, and making us all feel a little less alone as a result – with Grammy nominations possibly waiting in the wings as a result. Rodrigo’s album would make the perfect soundtrack for today’s World Mental Health Day . An annual tradition since 1992, it’s a moment to acknowledge that, like Rodrigo bravely points out, we’re not alone in our struggles. In Billboard’s latest episode of their Like Minded series in partnership with BetterHelp, Monaleo and Kehlani discussed motherhood and the permission to take care of oneself. “63% of U.S. women struggle to prioritize their health,” as reported in the launch of The Permission Projec t, a BetterHelp initiative focused on women’s mental health. Between giving yourself permission and this year’s theme of World Mental Health Day, Lived experiences heard: real voices, real change, it all coincides with the music industry’s intimate relationship with mental health and giving oneself the OK to seek help. In the past year, the music world saw a genre-spanning slate of artists both wearing their hearts on their sleeves in their art, as well as publicly prioritizing their own mental health like never before. Proving that it doesn’t matter whether you’re a fledgling singer-songwriter playing coffee shops and looking for a break, or the record-breaking artist Ella Langley, struggles don’t discriminate. Langley, who is breaking Billboard Hot 100 records as of late with her No. 1 smash “Choosin’ Texas,” has regularly sung about mental health and feeling less than. Take, for instance, “Be Her,” Langley’s vulnerable single from sophomore album Dandelion . On the song, Langley talks about wanting to emulate a fellow gal she’s idolizing. “I just want to be her so bad it hurts,” she croons with a signature twang, alluding to fretting about being less-than and an empty feeling of longing. But beyond the lyrics, Langley has prioritized her mental health even as her immense success was unfolding before her. In fact, just before the", "date_str": "2026-10-10T15:08:44+00:00", "hash": "57a6c2b2959d43cf", "title_fa": "برای روز جهانی بهداشت روان، بررسی صنعت موسیقی", "summary_fa": "هنگامی که اولیویا رودریگو سومین آلبوم استودیویی خود را برای دختری خیلی غمگین به نظر می‌رساند، به سرعت به یکی از بزرگ‌ترین آلبوم‌های سال تبدیل شد، با لشکرهایی از طرفداران که خود را در مضامین مالیخولیایی غم، تنهایی و درد دل می‌بینند. در آهنگ برجسته \"چه مشکلی با من دارد\"، او آهنگ را با یک خط آچار باز می کند: \"من فقط به سقف خیره شده ام، نمی توانم این احساس l exchange between the Korean and Sakha screen production sectors. The Sakha Republic (Yakutia), in Russia’s Far East, has built one of the country’s most [ ]", "date_str": "2026-10-11T02:18:37+00:00", "hash": "4ee768ae11fe0ad3", "title_fa": "انجمن فیلمسازان سخا و انجمن تهیه کنندگان کره پیمان برای تولید مشترک", "summary_fa": "انحصاری: انجمن تهیه کنندگان کره (PGK) و انجمن فیلمسازان سخا (SFA) یادداشت تفاهمی (MOU) با هدف ایجاد مسیر مستقیم برای تولید مشترک بین المللی و تبادل حرفه ای بین بخش های تولید صفحه نمایش کره و سخا امضا کرده اند. جمهوری سخا (یاکوتیا)، در خاور دور روسیه، یکی از بهترین [ ] این کشور را ساخته است. تفاهم نامه همکاری با PGK در غرفه انجمن فیلمسازان سخا در جریان بازار فیلم محتوای آسیایی (ACFM) در بوسان، با هدف شروع یک مشارکت صنعتی بلندمدت بین تولیدکنندگان دو منطقه امضا شد. بر اساس این توافق، PGK و SFA چارچوب جدیدی را برای تولید مشترک بین تولیدکنندگان کره ای و سخا ایجاد خواهند کرد که هدف آن توسعه پروژه ها و به اشتراک گذاری اطلاعات در مورد منابع مالی عمومی موجود در هر دو منطقه است. این مشارکت شامل نمایشگاه های پروژه، جلسات تولیدکننده به تولید کننده و جلسات B2B خواهد بود که برای شناسایی پروژه های دارای پتانسیل بین المللی و حرکت آنها به سمت تولید مشترک طراحی شده است. این دو سازمان همچنین شراکت را به بازارهای بین‌المللی بزرگ از جمله ACFM، هنگ کنگ Filmart و Cannes March du Film خواهند آورد و فرصت‌های جدیدی را برای پروژه‌های سخا برای ارتباط با صنعت گسترده‌تر آسیایی و بین‌المللی ایجاد خواهند کرد. برای PGK، این توافقنامه به برنامه مشارکت های بین المللی ایجاد شده از زمان همه گیری، در کنار تفاهم نامه هایی با انجمن تولیدکنندگان رسانه ای کانادا (CMPA)، انجمن مدیران تولید فیلم هنگ کنگ (HKFPEA)، انجمن تهیه کنندگان فیلم اندونزی (APROFI) و اتحادیه صنعت سمعی و بصری برزیل (SIAESP) ادامه می دهد."}, {"source": "Deadline", "title": "DOJ Launches Investigation Of Networks For Suspending TV Pool Amid Trump’s Ban On CNN", "link": "https://deadline.com/2026/10/trump-doj-antitrust-investigation-network-tv-pool-1237154137/", "summary": "UPDATED: The Justice Department has launched an investigation into whether the five major networks violated antitrust laws when they suspended participation in the White House TV pool in protest of Donald Trump s ban on CNN. Emily Covington, a spokesperson for the Justice Department, said in a statement, Members of the television press pool have boycotted [ ]", "date_str": "2026-10-11T01:05:49+00:00", "hash": "576fbd87146d5dbe", "title_fa": "تحقیقات وزارت دادگستری در مورد شبکه‌هایی برای تعلیق استخر تلویزیون به دلیل ممنوعیت ترامپ در CNN", "summary_fa": "به روز شده: وزارت دادگستری تحقیقاتی را در مورد اینکه آیا پنج شبکه اصلی در اعتراض به ممنوعیت دونالد ترامپ از شبکه سی ان ان تعلیق کردند، قوانین ضدانحصار را نقض کردند یا خیر، آغاز کرده است. امیلی کاوینگتون، سخنگوی وزارت دادگستری، در بیانیه‌ای گفت: پس از اعلام ممنوعیت ترامپ از CNN، Politico و MS NOW در محوطه کاخ سفید، اعضای گروه مطبوعات تلویزیون [] را تحریم کردند. 18، CNN نیز از استخر تلویزیون محدود شد. سی‌ان‌ان، سی‌بی‌اس نیوز، ای‌بی‌سی نیوز، ان‌بی‌سی نیوز و فاکس نیوز به‌عنوان بخشی از یک هماهنگی طولانی‌مدت، وظایف استخر را به صورت چرخشی ارائه می‌کنند و پوشش فنی، ویدیویی و گزارش‌دهی رئیس‌جمهور را ارائه می‌کنند و سپس فیدها در دیگر شبکه‌ها و سازمان‌های خبری توزیع می‌شوند. استخر به دلیل محدودیت فضا در مناطق کاخ سفید، مانند دفتر بیضی شکل، یا در ایر فورس وان ضروری است. تماشا در مهلت پس از متوقف شدن CNN، سایر اعضای استخر تلویزیون مشترکاً در 21 سپتامبر اعلام کردند که از نوبت چرخشی خودداری خواهند کرد، اقدامی که در اعتراض به تلاش کاخ سفید برای مسدود کردن شبکه خبری انجام شد. عموم مردم علاقه ای حیاتی به دریافت اطلاعات دقیق و مستقل در مورد دولت خود دارند. این پنج شبکه در آن زمان در بیانیه ای اعلام کردند که هیچ دولتی نباید یک سازمان خبری را محدود کند زیرا با گزارش آن مخالف است. این تعلیق حدود چهار روز به طول انجامید، اما در جریان سفر شی جین پینگ رئیس جمهور چین به کاخ سفید صورت گرفت. تعلیق استخر تلویزیون به این معنی بود که پوشش تصویری بسیار کمتری از مراسم اصلی و سایر رویدادهای پیرامون دیدار وی وجود داشت. ترامپ بعداً شکایت کرد که CNN و MS NOW سفر شی‌پینگ را پوشش نداده‌اند، بدون اینکه به تلاش‌های وی برای ممنوع کردن این دو رسانه از محوطه کاخ سفید اشاره"}, {"source": "Deadline", "title": "‘Blade Runner 2099’ Trailer: Hunter Schafer Teams Up With Michelle Yeoh To Find “Cure For All Replicants” — NYCC", "link": "https://deadline.com/2026/10/blade-runner-2099-trailer-hunter-schafer-michelle-yeoh-nycc-1237154128/", "summary": "Nearly 45 years later, a new Blade Runner is back to make the Ridley Scott franchise more human than human once again. On Saturday at New York Comic-Con, Prime Video released key art and a new trailer for the eight-episode limited series created by Silka Luisa with Amazon MGM Studios and Alcon Television Group, premiering [ ]", "date_str": "2026-10-11T00:33:17+00:00", "hash": "3e7c7d9e4e369ed1", "title_fa": "تریلر «Blade Runner 2099»: Hunter Schafer با Michelle Yeoh همکاری می کند تا «درمانی برای همه Replicants» پیدا کند - NYCC", "summary_fa": "تقریباً 45 سال بعد، یک Blade Runner جدید بازگشته است تا فرنچایز Ridley Scott را بار دیگر بیشتر انسانی کند تا انسانی. روز شنبه در نیویورک کامیک کان، پرایم ویدیو هنر کلیدی و تریلر جدیدی از سریال هشت قسمتی محدودی را منتشر کرد که توسط Silka Luisa با استودیو آمازون MGM و گروه تلویزیونی Alcon ساخته شده بود، اولین نمایش آن [ ] 50 سال پس از وقایع Blade Runner 2049، لس آنجلس دوباره متولد شده است، نه توسط بشریت. کورا (هانتر شفر)، فراری در تلاش نهایی برای توقف دویدن، آخرین هویت را به خود می گیرد: بلید رانر. او مجبور به شریک شدن با اولون (میشل یوه)، یک Replicant چند روز پس از مرگ می شود، او فراری را که حقیقتی را پنهان می کند که می تواند یک شهر شکننده را از بین ببرد، شکار می کند. لویزا، یئو و شفر روز یکشنبه در پنل پرایم ویدئو NYCC به همراه بازیگران دیمیتری ابولد، لوئیس گریبن و متیو نیدهام و همچنین تهیه کنندگان اجرایی اندرو کوسوو و برودریک جانسون روی صحنه رفتند. در ددلاین تماشا کنید این سریال همچنین بازیگرانی چون کاتلین رز داونی، دنیل ریگبی، جانی هریس، امی لنوکس، شیلا آتیم، تام برک و مائوریزیو لومباردی هستند. لویزا به عنوان مجری برنامه، خالق و تهیه کننده اجرایی فعالیت می کند. EP های اضافی عبارتند از: ریدلی اسکات، بنیانگذاران Alcon Entertainment، اندرو کوسوو و برودریک جانسون، رئیس تلویزیون Alcon بن رابرتز، استیون جانسون، دیوید دبلیو. زوکر و کلایتون کروگر از اسکات فری پروداکشنز، ریچارد شارکی، تام اسپزیالی، مایکل گرین، سینتیا یورکین، فرانک گیوسترا، تیم گیبل، ایزا دیک هکت و جاناتان ون تولکن که دو قسمت اول را کارگردانی کردند. فیلم اصلی Blade Runner به کارگردانی اسکات در سال 1982 با بازی هریسون فورد و شان یانگ به نمایش درآمد. در سال 2017، فورد بار دیگر نقش ریک دکارد را"}, {"source": "Netflix NL", "title": "Netflix voegt opeens nieuwe Nederlandse misdaadfilm toe", "link": "https://www.netflix-nederland.nl/netflix-voegt-opeens-nieuwe-nederlandse-misdaadfilm-toe/", "summary": "Het Nederlandse aanbod op Netflix wordt groter en groter. En de toevoegingen komen vaak uit het niets. Neem bijvoorbeeld de Nederlandse misdaadfilm EB, die opeens naar de streamingdienst komt. Netflix voegt EB toe EB is dus een Nederlandse misdaadthriller (uit 2026), geregisseerd door Klaas de Jong, met Vajèn van den Bosch, Juvat Westendorp en Mingus Dagelet in belangrijke rollen. De film speelt zich af op het Waddeneiland Ameland, waar een ogenschijnlijk rustig wetenschappelijk onderzoek uitmondt in een gevaarlijke zaak vol criminaliteit, geheimen en verraad. Het verhaal draait om Lynn (Vajèn van den Bosch), een ambitieuze ecologe die voor haar werk terugkeert naar Ameland, het eiland waar ze is opgegroeid. Ze wil onderzoek doen naar het bijzondere natuurgebied, maar ontdekt al snel dat er achter de rustige uitstraling van het eiland een duistere wereld schuilgaat. Tijdens haar werkzaamheden stuit ze op aanwijzingen voor drugssmokkel tussen Nederland en Duitsland. Levensgevaarlijk mysterie Wat aanvankelijk een aantal vreemde gebeurtenissen lijken, groeit langzaam uit tot een levensgevaarlijk mysterie. Wanneer er slachtoffers vallen, beseft Lynn dat ze betrokken is geraakt bij een crimineel netwerk dat er alles aan doet om zijn geheimen verborgen te houden. Tot haar schrik ontdekt ze bovendien dat ie م، و از کل وضعیت بسیار ناراحت هستم. من هرگز به یک زن تجاوز نمی‌کنم. من متجاوز نیستم. اینطور نیست.\""}, {"source": "Rolling Stone", "title": "See the Raconteurs Reunite for First Time in Seven Years at Jack White’s Nashville Concert", "link": "https://www.rollingstone.com/music/music-news/the-raconteurs-reunite-jack-white-nashville-concert-1235640937/", "summary": "Band plays five-song set during the encore for first performance since 2019", "date_str": "2026-10-11T13:19:42+00:00", "hash": "b9702a7188181812", "title_fa": "برای اولین بار پس از هفت سال، گروه Raconteurs را در کنسرت نشویل جک وایت ببینید.", "summary_fa": "گروه موسیقی پنج آهنگ را در حین اجرای اولین اجرا از سال 2019 اجرا می کند. Raconteurs برای اولین بار پس از هفت سال شنبه در جریان کنسرت جک وایت در نشویل دوباره روی صحنه جمع شدند. در اوایل روز، وایت نه چندان ظریف اشاره کرد که کنسرت انفرادی او در سالن The Truth با یک گردهمایی مجدد Raconteurs همراه خواهد بود، و در رسانه های اجتماعی نوشت، اطلاعات داخلی برای هر طرفدار Raconteurs در منطقه Nashville که ممکن است بخواهید برای نمایش جک وایت امشب در The Truth بلیط بخرید، ممکن است کمی غافلگیرکننده باشد. بنسون، جک لارنس، و پاتریک کیلر از جمله Steady as She Goes و سه آهنگ دیگر از اولین آلبوم گروه در سال 2006، سربازان پسر شکسته: داستان‌های پرطرفدار به‌روزرسانی آخر هفته SNL، از دست دادن جایزه صلح نوبل ترامپ را مسخره می‌کند، طرح اجرای باز پیت هگزث: SNL Colrd. اعلامیه نگران‌کننده‌ای درباره فصل آنفولانزا می‌دهد. آلیس کوپر بالاخره آماده است تا حقیقت را بگوید این اجرا، Raconteurs برای اولین بار از دسامبر 2019، با اعلام اخیر که سری White Man Records Vault بعداً بر نسخه بیستمین سالگرد بازی Broken Boy Soldiers تمرکز خواهد کرد، از جمله ضبط اولین گروه، از اولین کنسرت گروه و همچنین کنسرت در 2 مارس 02، تمرکز خواهد کرد. The Raconteurs آخرین بار سومین آلبوم خود را به من غریبه کمک کن در سال 2019 منتشر کرد که 11 سال پس از آلبوم دوم گروه، Consolers of the Lonely در سال 2008 منتشر شد. مشخص نیست که آیا اتحاد مجدد شنبه برای نشان دادن انتشار مجدد «سربازان پسر شکسته» و/یا افتتاح سالن جدید «حقیقت» در نشویل بود یا اینکه گروه برنامه‌های بزرگتری در پیش دارد."}, {"source": "Rolling Stone", "title": "Fired Government Scientists Are Finding New Ways to Spread the Word on Climate Change", "link": "https://www.rollingstone.com/politics/politics-features/climate-change-report-published-fired-scientists-1235640295/", "summary": "The Trump administration killed the National Climate Assessment. The researchers who were working on it aren't giving up", "date_str": "2026-10-11T13:15:00+00:00", "hash": "7539fd95a762e22c", "title_fa": "دانشمندان دولتی اخراج شده در حال یافتن راه های جدیدی برای انتشار اخبار در مورد تغییرات آب و هوا هستند", "summary_fa": "دولت ترامپ ارزیابی ملی آب و هوا را نابود کرد. محققانی که روی آن کار می‌کردند دست از کار نمی‌کشند در آوریل سال گذشته، دولت دونالد ترامپ کار بر روی گزارش علم آب و هوا را که ایالات متحده بیش از 20 سال تولید می‌کرد، متوقف کرد. ارزیابی ملی آب و هوا (NCA) که از سوی کنگره تعیین شده است، به این منظور است که به آمریکایی ها دید واضحی از چگونگی تأثیر تغییرات آب و هوایی بر کشور بدهد. دولت صدها دانشمند و محققی را که روی آخرین نسخه کار می کردند اخراج کرد. اکنون، بسیاری از این دانشمندان اولین گزارش از یک سری گزارش‌ها را منتشر کرده‌اند که هدف آن بررسی چگونگی پیشرفت تحقیقات آب و هوایی از آخرین NCA در سال 2023 است و تحقیقات آب و هوایی می‌تواند به کجا برسد. این گزارش به طور همزمان در دو مجله علمی به نام‌های بولتن انجمن هواشناسی آمریکا و آینده زمین منتشر شد تا به مخاطبان بیشتری دست یابد. این تلاش U.S. مجموعه آب و هوا این گزارش جایگزینی برای NCA نیست، اما کمک می‌کند تا آنچه را که در سال‌های اخیر در تحقیقات آب و هوایی رخ داده است، به تصویر بکشد، زیرا ترامپ بحران آب و هوا را یک فریب خوانده و توانایی دولت را برای مبارزه با آن کاهش داده است. ملیسا کنی، نویسنده اصلی گزارش و مدیر تحقیقات موسسه محیط زیست دانشگاه مینه سوتا، به رولینگ استون می گوید: چندین سال از آخرین ارزیابی ملی آب و هوا می گذرد، و این تلاش برای فکر کردن به آنچه می دانیم، آنچه از آن زمان پیشرفت کرده است و اولویت های نوظهور باید مورد توجه قرار گیرد، است. این گزارش به چگونگی پیشرفت علم آب و هوا از آخرین NCA و موضوعاتی که نیاز به تحقیقات بیشتر دارد، از جمله خطرات ترکیبی مانند امواج گرما"}, {"source": "Rolling Stone", "title": "Remi Wolf Burned Out on Touring. She Prioritizes Healing on New Album ‘Mud’", "link": "https://www.rollingstone.com/music/music-features/remi-wolf-interview-touring-album-mud-1235639076/", "summary": "\"I had so many feelings I had been kind of repressing for a while,\" says the songwriter, who decamped with friends to a rental in Big Bear, California, to craft the follow-up to 2024's Big Ideas", "date_str": "2026-10-11T13:00:00+00:00", "hash": "c25c9a7da832a413", "title_fa": "رمی ولف در یک تور سوخته شد. او در آلبوم جدید \"Mud\" شفا را در اولویت قرار می دهد", "summary_fa": "رمی ولف درباره Mud می‌گوید: «احساسات زیادی داشتم که مدتی آن‌ها را سرکوب می‌کردم. اما در عین حال، این سرگرم کننده ترین رکوردی بود که تا به حال در زندگی ام نوشتم. Mud در روز جمعه از طریق Island Records کاهش یافت و سومین آلبوم استودیویی برای Wolf است، رکوردی که نسبت به دو ال‌پی اول این ستاره آلت‌پاپ به موسیقی محلی بسیار نزدیک‌تر است. این آلبومی است که او پس از پنج سال تور بی امان شروع به نوشتن در اواخر سال 2024 کرد و جای خود را به استرس، اضطراب، فرسودگی شغلی و پایان یک رابطه داد. این عنوان نام خود را از آهنگ Covered in Mud گرفته است، همچنین آثار هنری آلبوم که خواننده را در خاک پاشیده است. زندگی ولف در آن زمان اینگونه بود: آشفته. او می‌گوید: من بیش از دو ماه، مثلاً پنج سال بود که در یک مکان نبودم. احساس می کردم یک جورهایی گم شده و گیج شده بودم و داشتم از هم جدا می شدم. او عازم نشویل شد، علیرغم اینکه هرگز قبلاً در آنجا کار نکرده بود، و روی فرهنگ نویسندگی شهر قمار کرد. این به نوعی شبیه یک آزمایش بود: اگر من برای دو هفته به نشویل بروم، ببینیم چه اتفاقی می‌افتد. زمانی که آنجا بود، او به آرامی به یک زیبایی شناسی برای Mud رسید: هر آهنگی باید بتواند در اطراف آتش با گیتار آکوستیک نواخته شود. تاکید شهر بر نوشتن به روشن شدن مسیر او کمک کرد. او می‌گوید، در مورد داستان سرایی بسیار سرسخت است. این واقعاً یک ذهنیت آهنگ اول است. اما بومی کالیفرنیا کشش ایالت خود را نیز احساس کرد و با چند آهنگ در دست برای Mud، به همراه گروهی از دوستان نزدیک خود، از جمله جارد سولومون، همکار قدیمی اش، به بیگ بیر، کالیفرنیا رفت. ولف می‌گوید که احساس می‌کرد آسیب‌پذیر بود"}, {"source": "Rolling Stone", "title": "Bears vs. Packers: Where to Watch Today’s Game Online", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/where-to-watch-bears-vs-packers-football-online-free-1235639904/", "summary": "The Bears' Tyson Bagent will start against the Packers while Caleb Williams recovers from a hamstring injury", "date_str": "2026-10-11T11:00:00+00:00", "hash": "455ca27c5cad92ef", "title_fa": "Bears vs. Packers: Where to Watch Today’s Game Online", "summary_fa": "تایسون باجنت خرس ها در مقابل پکرز شروع می کند در حالی که کالب ویلیامز از آسیب دیدگی همسترینگ بهبود می یابد. خرس‌ها و پکرز برای یک هفته پنج بازی در میدان لامبو در رقابت طولانی مدت تیم‌ها به مصاف هم می‌روند. تایسون باجنت در پست کوارتربک برای خرس ها شروع خواهد کرد در حالی که کالب ویلیامز از کشیدگی همسترینگ بهبود می یابد. باجنت هفته گذشته تیم را به پیروزی 23-12 مقابل نیویورک جتس هدایت کرد و خرس ها از دو برد پیاپی لذت می برند. بر اساس گزارش ESPN، خرس‌ها برنده بازی هستند. پکرز که توسط کوارتربک جردن لاو هدایت می‌شود، در این فصل 2-2 به پایان رسید و در مقابل تیم تامپا بای باکانیرز پیروز شد. خرس ها در دو دیدار اخیر خود در برابر پکرز پیروز شده اند، هر دو در میدان سرباز شیکاگو. آخرین باری که خرس ها در لامبو فیلد پیکرز را شکست دادند ژانویه 2025 بود. Packers یک یونیفرم رقابتی جایگزین با رنگ‌های قدیمی و تفسیری دوباره از لوگوی کلاسیک خود خواهند پوشید. خارج از زمین، خرس ها در حال بحث و گفتگو با قانونگذاران ایلینویز هستند که این تیم کجا بازی خواهد کرد و اینکه آیا در ایالت پریری ادامه خواهد داد یا خیر. خرس ها به دنبال ترک میدان سرباز پیر هستند و فرماندار ایلینویز J.B. پریتزکر با راجر گودل، کمیسر NFL ملاقات کرد تا در مورد طرح احتمالی تیم برای ساخت استادیوم در حومه شیکاگو در آرلینگتون هایتس بحث کند. این بازی ساعت 13 از شبکه فاکس پخش می شود. در بازارهای منتخب اگر کابل یا آنتن ندارید، فاکس به صورت آزمایشی رایگان برای سرویس پخش زنده تلویزیونی مانند DirecTV یا Fubo در دسترس است. بلیط یکشنبه NFL تلویزیون YouTube گزینه دیگری است که به طرفداران امکان دسترسی به بازی‌های خارج از بازار را می‌دهد. همچنین می‌توانید بازی را در"}, {"source": "Rolling Stone", "title": "‘SNL’: Cop Talk Show Host Shane Gillis Interrogates Nervous Guests", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/snl-cop-talk-show-host-shane-gillis-interrogate-nervous-guests-1235640829/", "summary": "The talk show is meant to be proof that talking to the cops \"doesn't have to be stressful,\" but it has a long way to go", "date_str": "2026-10-11T06:26:28+00:00", "hash": "3e5f2e9e4289c103", "title_fa": "\"SNL\": شین گیلیس مجری برنامه تاک شو پلیس از مهمانان عصبی بازجویی می کند", "summary_fa": "این برنامه تاک شو باید اثبات کند که صحبت کردن با پلیس \"نیازی نیست که استرس زا باشد\"، اما راه درازی در پیش دارد در شنبه شب زنده، شین گیلیس فاش کرد که اگر پلیسی میزبان یک برنامه گفتگو باشد، چگونه خواهد بود: صحبت کردن با مهمانانش به گونه ای که دارد آنها را کنار می کشد، در حالی که رفتار ترجیحی با نوع خاصی از افراد دارد. گیلیس، در سومین بار خود در SNL پس از حضور در فوریه 2024 و مارس بعد، با مایکی دی، دستیار خود در Cop Talk همکاری می کند، که آنها ادعا می کنند برای نشان دادن این است که صحبت با پلیس نباید استرس زا باشد. معلوم است، هنوز هم هست. افسر دویل کانلی (گیلیس) مقدمه ای کوتاه برای اولین مهمان خود ارائه می دهد: نویسنده ای که کتابی نوشته است. کانلی بعد از اینکه به نویسنده (جرمی کولهن) گفت که پنجره را روی بازوی صندلی‌اش پایین بیاورد، می‌پرسد، امشب چطور هستیم؟ او این موضوع را دنبال کرد، می‌دانی چرا تو را به اینجا آوردم؟ بعد آمد، شما در مورد چیزی عصبی هستید؟ و شما یک شناسه دارید؟ وقتی نویسنده دستش را در جیبش می برد، کانلی و شریک زندگی اش عصبانی می شوند و به او می گویند که این کار را به آرامی انجام دهد. در نهایت او را رها کردند، اما بدون اینکه درباره کتابش صحبت کند. کانلی می گوید تو خوش شانسی که من با یک اخطار شما را رها کردم، حالا از اینجا برو بیرون. همه چیز برای مهمان بعدی، یک هنرمند محلی (بن مارشال) که ابتدا از دانلی به عنوان آقا یاد می کند، و سپس خود را به عنوان افسر تصحیح می کند، به همین ترتیب پیش می رود. به حرف هایت دست و پا می زنی؟ مستی تو چی؟ دانلی می پرسد. وقتی هنرمندان پاسخ"}, {"source": "Rolling Stone", "title": "‘SNL’ Weekend Update Mocks Trump’s Nobel Peace Prize Loss, Pete Hegseth’s Execution Plan", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/snl-weekend-update-mocks-trump-nobel-peace-prize-loss-pete-hegseth-execution-plan-1235640827/", "summary": "\"He's taking it all in stride,\" Colin Jost jokes as Trump fumes about again losing the award he craves", "date_str": "2026-10-11T05:24:35+00:00", "hash": "48d8432010dc9565", "title_fa": "به‌روزرسانی آخر هفته «SNL» از دست دادن جایزه صلح نوبل ترامپ، طرح اعدام پیت هگزث را مسخره می‌کند.", "summary_fa": "کالین جوست به شوخی می‌گوید: «او همه چیز را آرام می‌گیرد» در حالی که ترامپ درباره از دست دادن مجدد جایزه‌ای که آرزویش را دارد عصبانی می‌شود، به‌روزرسانی آخر هفته پخش زنده شنبه شب، دونالد ترامپ را به خاطر باخت دوباره و اینکه فکر می‌کند واقعاً شانسی برای جایزه صلح نوبل دارد، مورد تمسخر قرار می‌دهد و نقشه‌های بحث برانگیز پیت هگزث برای اجرای پخش زنده را مورد هدف قرار می‌دهد. کمیته نوبل روز جمعه جایزه خود را به نوانتم ناوی پیلای، وکیل و قاضی حقوق بشر آفریقای جنوبی که در مورد جنایات جنگی برای سازمان ملل و دادگاه کیفری بین‌المللی تحقیق می‌کرد، اهدا کرد. متأسفانه باید امشب را با یک داستان غم انگیز و در حال توسعه که شامل پرزیدنت ترامپ می شود شروع کنیم. نه، نه، کالین جوست به شوخی گفت. متأسفانه رئیس جمهور ترامپ جایزه صلح نوبل را دریافت نکرده است، اما نگران نباشید. من فکر می کنم او همه چیز را آرام گرفته است. جوست سپس سخنان رئیس‌جمهور را در تظاهراتی در سیراکوز، نیویورک در روز جمعه، که در آن او گفت هیچ‌کس تا به حال نام دریافت‌کننده را نشنیده بود، قطع کرد. جوست تاکید کرد که او از اینکه جایزه صلح را نبرده است واقعا عصبانی است. ترامپ رئیس‌جمهور ونزوئلا را ربود، سپس آنقدر جنگ کرد که موشک‌هایمان تمام شد، و هنوز فکر می‌کرد: امسال سال من است. جاست درباره انیمیشن لایو اکشن 2021 گفت: واقعاً مثل این است که فکر می کردم ممکن است برای تام جری اسکار بگیرم. مایکل چه، مجری برنامه، سپس به این موضوع پرداخت که چگونه پیلای اساساً تمایل ترامپ را برای دریافت جایزه مسخره کرده است. او گفت که اگر کمی بیشتر کف بزنی، ممکن است این جایزه را با ترامپ تقسیم کنم. به گفته چه، این یک شوخی کوچک بی ضرر است که ممکن است ترامپ را وادار"}, {"source": "Rolling Stone", "title": "‘SNL’ Cold Open: RFK Jr. Makes a Disturbing Announcement About Flu Season", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/snl-cold-open-rfk-jr-makes-disturbing-announcement-about-flu-season-1235640835/", "summary": "The vaccine skeptic has to rename the time of year as measles cases rise", "date_str": "2026-10-11T04:24:05+00:00", "hash": "4543da594ab8b999", "title_fa": "\"SNL\" Cold Open: RFK Jr. اعلامیه نگران کننده ای درباره فصل آنفولانزا می دهد", "summary_fa": "با افزایش موارد سرخک، شکاک واکسن باید زمان سال را تغییر نام دهد. در شنبه شب زنده، رابرت اف کندی جونیور، شکاک واکسن، تغییرات نگران کننده ای را در نحوه تفکر آمریکایی ها درباره فصل سرماخوردگی و آنفولانزا اعلام کرد. کندی (جیمز آستین جانسون) توسط وزیر دفاع پیت هگزت (کالین جوست) معرفی شد که در حال خطاب به ملوانان یو اس اس لینکلن بودند که پس از مدت طولانی در دریا در نزدیکی ایران به ایالات بازگشته بودند، مأموریتی که بنا بر گزارش ها شاهد چندین اقدام به خودکشی در میان وخامت شرایط در کشتی بود. وزیر دفاع گفت، اکنون متوجه شدم که همه شما با یک کشتی مملو از اسهال به خانه برگشتید، اما سلامتی شما از هم اکنون بیشترین نگرانی ماست. بنابراین، در اینجا با مروری بر اینکه چگونه او دوباره آمریکایی را سالم می کند، تنها مردی است که بیشتر از من کرگدن خرخر می کند. کندی که به دلیل نارسایی اسپاسمیک خود با لرزش صحبت می کرد، به طور غیرقابل قبولی اصرار داشت که آمریکا از همیشه سالم تر است. به همین دلیل است که من رسماً دوست دارم فصل سرماخوردگی و آنفولانزا را به این نام تغییر دهم: سرماخوردگی و آنفولانزا، لیستریا و سرخک و فصل مغزی، او گفت، در میان بدترین سال سرخک در کشور از سال 1991. ما همچنین در حال بررسی چیزی به نام زوال عقل بیضه هستیم. کندی ادامه داد: و بله، 200000 پوند گوشت خوک، گوشت گاو و بز فراخوان شده است، اما من فقط می خواهم تاکید کنم که گربه ماهی، پونی و کریکت پروتئین های قابل دوام برای هر خانواده آمریکایی هستند. اما من می خواهم از شما تشکر کنم. ما توانستیم با آزمایش گوشت‌های کشتی شما، این یادآوری‌ها را زود تشخیص دهیم. تحقیقاتی که در مورد عملیات هل کروز ارائه کردید برای سالهای آینده حیاتی خواهد بود."}, {"source": "Rolling Stone", "title": "The ‘Scream’ 30th Anniversary Box Set Comes With a Replica of the Bloody Phone From the Film’s Iconic Opening Scene", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/scream-30th-anniversary-blu-ray-box-set-phone-buy-online-1235640891/", "summary": "Fans of the 1996 hit can pick up an anniversary edition that features a 4K Blu-ray version of the film, plus some killer collectibles", "date_str": "2026-10-11T01:03:26+00:00", "hash": "6568755231384ba3", "title_fa": "مجموعه جعبه سی‌امین سالگرد «فریاد» با نسخه‌ای از تلفن خونین از صحنه نمایش نمادین فیلم ارائه می‌شود.", "summary_fa": "طرفداران فیلم موفق سال 1996 می‌توانند نسخه سالگردی را انتخاب کنند که دارای نسخه بلوری 4K از فیلم است، به‌علاوه برخی از کلکسیون‌های قاتل اگر محصول یا خدماتی را که به‌طور مستقل بررسی شده را از طریق پیوندی در وب‌سایت ما خریداری کنید، رولینگ استون ممکن است کمیسیون وابسته دریافت کند. 30 سال از زمانی که فیلم Slasher Scream ساخته وس کریون در سینماها اکران شد، می‌گذرد که مخاطبان را با قاتل نقابدار Ghostface و گروهی از شخصیت‌های شهری کوچک که هنوز هم بخشی از کانون ترسناک امروزی هستند، می‌گذرد. اکنون، طرفداران موفقیت اصلی 1996 می‌توانند نسخه 30 ساله Scream را انتخاب کنند که دارای نسخه بلوری 4K Ultra HD از فیلم بر روی دو دیسک، به‌علاوه تعدادی کلکسیون قاتل است. انحصاری AMAZON Scream: 30th Anniversary Edition [4K UHD] 109.99 دلار اکران فیزیکی شامل فیلم بلند اصلی، به علاوه ساعت‌ها محتوای پشت صحنه، از نظرات بازیگران و خدمه تا فیلم‌هایی از مجموعه تولید است. خرید شما همچنین شامل یک کد دیجیتالی است که می‌توانید آن را برای نسخه قابل دانلود Scream که می‌توانید به صورت آنلاین تماشا و پخش کنید، پس‌خرید کنید. اما چیزی که شما واقعاً برای خرید این جعبه جیغ می‌خ شا کنید. همچنین به ده ها کانال دیگر دسترسی خواهید داشت. DIRECTV در حال حاضر یک دوره آزمایشی رایگان پنج روزه را برای کاربران جدید ارائه می دهد که می توانید از آن برای پخش زنده بازی Guardians vs White Sox Game 5 به صورت آنلاین و رایگان استفاده کنید. پس از اتمام دوره آزمایشی رایگان، که شامل TBS و بیش از 90 کانال دیگر می‌شود، برنامه‌ها از 59.99 دلار در ماه برای بسته سرگرمی DIRECTV شروع می‌شوند. یا می‌توانید قبل از اتمام دوره آزمایشی رایگان آن را لغو کنید تا از کسر هزینه جلوگیری کنید. برای بهترین ارزش پخش، باید Hulu + Live TV را بررسی کنید، که به شما امکان می دهد به کل کتابخانه پخش Hulu، به علاوه 100 کانال تلویزیونی زنده از جمله TBS دسترسی داشته باشید. برای تماشای"}, {"source": "Hollywood Reporter", "title": "Javier Bardem on Declining ‘Skyfall’ Role, Pitching to Sam Mendes: “What If He Wants to Have Sex With Mr. Bond?”", "link": "https://www.hollywoodreporter.com/movies/movie-news/javier-bardem-skyfall-bond-bunker-bfi-london-film-festival-1236727169/", "summary": "The Spaniard spoke at a BFI London Film Festival session about his glittering career, including why 'No Country for Old Men' supporting actor Gene Jones shares half of Bardem's Oscar.", "date_str": "2026-10-11T14:27:21+00:00", "hash": "c37278ba24fe67a2", "title_fa": "خاویر باردم در مورد رد کردن نقش «اسکای فال»، خطاب به سم مندس: «اگر او بخواهد با آقای باند رابطه جنسی داشته باشد، چه؟»", "summary_fa": "این بازیکن اسپانیایی در جلسه جشنواره فیلم BFI لندن در مورد حرفه درخشان خود صحبت کرد، از جمله اینکه چرا جین جونز بازیگر نقش مکمل فیلم «کشوری برای پیرمردها نیست» نیمی از اسکار باردم را به اشتراک می گذارد. خاویر باردم، ستاره اسپانیایی، از جمعیت جشنواره فیلم BFI لندن که صبح یکشنبه صبح زود بیرون آمدند و با او در یک جلسه گفتگوی نمایشی شرکت کردند، تشکر کرد. باردم، که نیمه دیگرش، پنه لوپه کروز، امسال نیز مدتی در کانون توجه قرار گرفته است (به لطف مجموعه ای از فیلم های پرهیاهو: La Bola Negra، The Invite و Bunker)، در پایتخت بریتانیا است و در حال تبلیغ پناهگاه خود و کروز و همچنین The Beloved است که در آن با لوئن بازی می کند. باردم در طول این گفتگو به یک حرفه پر زرق و برق فکر کرد، از اوایل زندگی اش که در یکی از معتبرترین خانواده های بازیگری اسپانیا بزرگ شد تا برنده شدن اسکار و در نهایت امسال، ترسش از صحنه را غلبه کرد. داستان‌های مرتبط فیلم‌ها جان مالکوویچ می‌گوید که کمپین اسکار تنها راه برای ترغیب مردم به سینما است اکنون کسب‌وکار نتفلیکس در حدود 300 عنوان از هوش مصنوعی استفاده کرده است، اما لمس انسانی حیاتی است، مدیر اجرایی در بوسان می‌گوید در یکی از لحظات سبک‌تر جلسه، باردم، که برای نقش‌هایی در فیلم Caristinabean20 شناخته می‌شود. Dead Men Tell No Tales (2017) و فرانچایز Dune، در مورد رد کردن یکی از نمادین‌ترین نقش‌هایش در ابتدا به عنوان عامل شرور اما از نظر جنسی مغناطیسی سابق جودی دنچ، رائول سیلوا، در Skyfall در سال 2012 صحبت کردند. این بازیگر در ابتدا درباره رد کردن نقش گفت: حدس می‌زنم عصبی بودم. مثلاً من در فیلم جیمز باند چه کار می کنم؟ چه کاری می توانم انجام دهم؟ اما بعد نشستیم. سم مندز یک نابغه است، و"}, {"source": "Hollywood Reporter", "title": "John Malkovich Says an Oscars Campaign “Is the Only Way to Get People to Go to the Theaters Now”", "link": "https://www.hollywoodreporter.com/movies/movie-news/john-malkovich-oscars-campaign-wild-horse-nine-film-movie-1236727173/", "summary": "The actor, currently at the beginning of the awards trail for 'Wild Horse Nine,' also told a London Film Festival crowd on Sunday about JFK's assassination: \"I know what didn't happen is what they said happened.\"", "date_str": "2026-10-11T13:55:51+00:00", "hash": "0ecbe98c5beae157", "title_fa": "جان مالکوویچ می‌گوید که کمپین اسکار «تنها راهی است که می‌توان مردم را اکنون به سالن‌های سینما سوق داد»", "summary_fa": "این بازیگر که در حال حاضر در ابتدای جوایز برای «اسب وحشی نه» است، روز یکشنبه در جمع تماشاگران جشنواره فیلم لندن درباره ترور جی اف‌کی گفت: «می‌دانم اتفاقی که نیفتاد همان چیزی است که آنها گفتند اتفاق افتاده است». جان مالکوویچ به خوبی از شتاب جوایز فعلی خود آگاه است، حتی اگر هجوم توجه ها با شخصیت بومی او مطابقت نداشته باشد. ایالات متحده این ستاره با تراژیکومدی مارتین مک‌دونا، اسب وحشی نه، که در آن به‌عنوان بهترین بازی حرفه‌ای‌اش و تقریباً مطمئناً نامزدی اسکار شناخته می‌شود، وارد مدار جشنواره شده است. این اولین جایزه اسکار نیست که او به دست آورده است و قبلاً در سال‌های 1985 و 1994 برای مکان‌هایی در قلب و در خط آتش به رسمیت شناخته شده بود، اما در یک سخنرانی جشنواره فیلم لندن در BFI بعد از ظهر یکشنبه، این بازیگر اذعان کرد که کمپین جوایز یک جانور کاملاً متفاوت در Netflix درباره Stories 2026 است. مدیر اجرایی در فیلم‌های بوسان می‌گوید: 300 عنوان، اما لمس انسانی حیاتی است، اسکار: U.K. ایران Doc Rehearsals for a Revolution را به‌عنوان بهترین فیلم بلند بین‌المللی انتخاب می‌کند [احساس می‌کنم] احتمالاً [درباره در نظر گرفتن جوایز] با من [زمانی که In the Line of Fire اکران شد] متفاوت است، زیرا تجارت فیلم وجود داشت [و] به نظر من، به‌نظر من، جایگاه بسیار بالایی در فرهنگ داشت. و وقتی می‌گویم مستحق نیست، منظورم این است که این تعداد شهرک چینی یا پدرخوانده یا پدرخوانده دوم وجود نداشت، او شروع کرد. در حال حاضر، [پیش جوایز] تنها راه برای ترغیب مردم به تئاتر است، همه چیز، و این ماه ها و ماه ها و ماه هاست. او به یاد می آورد که نامزد مکان هایی در قلب شد و به اولین و تنها جایزه اسکار خود در سال 1985 رفت. او در ماشین بود و از مدیر"}, {"source": "Hollywood Reporter", "title": "‘Wildwood’ Review: Laika’s Ambitious Stop-Motion Epic Is Both a Technical and Emotional Triumph", "link": "https://www.hollywoodreporter.com/movies/movie-reviews/wildwood-review-laika-travis-knight-1236726335/", "summary": "A teenage girl enters a mysterious kingdom in search of her kidnapped brother in Travis Knight's animated fantasy film, voiced by an all-star cast including Carey Mulligan and Mahershala Ali.", "date_str": "2026-10-11T13:15:00+00:00", "hash": "a04289e1ed930cc4", "title_fa": "نقد و بررسی \"Wildwood\": حماسه جاه طلبانه استاپ موشن لایکا یک پیروزی فنی و احساسی است", "summary_fa": "یک دختر نوجوان در جستجوی برادر ربوده شده خود در انیمیشن فانتزی تراویس نایت، با صداپیشگی بازیگرانی از جمله کری مولیگان و ماهرشالا علی، وارد یک پادشاهی مرموز می شود. نمی دانم این ترسناک است یا شایان ستایش، شخصیت اصلی انیمیشن جدید استاپ موشن لایکا در یک نقطه مشاهده می کند. پاسخ هر دو است، وایلدوود نشان دهنده یک دستاورد خیره کننده از شرکتی است که تلاش های فوق العاده ای مانند Coraline و Kubo and the Two Strings به ما داده است. این ماجراجویی فانتزی نفس گیر 132 دقیقه طول می کشد و رکورد طولانی ترین فیلم استاپ موشن را به نام خود ثبت می کند، اما از لحظه اول تا آخر جذاب است. بر اساس رمان فانتزی پرفروش کالین ملوی در سال 2011 با تصاویری از کارسون الیس، خط داستانی گسترده حول محور دختر نوجوان پرو (پیتون الیزابت لی) می چرخد ​​که در منطقه پورتلند، اورگان، با والدین دوست داشتنی اش (جیک جانسون (آر نایت، مایور) برادرش زندگی می کند. پروو علیرغم دستورات سختگیرانه‌اش مبنی بر اینکه مک از خانه بیرون نرود، از غیبت موقت آنها استفاده می‌کند و او را به سواری شادی در پورتلند می‌برد، در یک زمین بازی می‌پیچد که ناگهان توسط قتل کلاغ‌ها ربوده می‌شود در صحنه‌ای که به همان اندازه ترسناک در فیلم پرندگان هیچکاک است (فیلم شایسته امتیاز PG-1 است). داستان‌های مرتبط ستارگان دختر جدید تلویزیون دوباره متحد می‌شوند -- به روشی کمی متفاوت از فیلم‌های ادعایی مکس گرینفیلد بررسی ری گان: سام راکول و اسکارلت جوهانسون در انیمیشن فراموش‌شدنی برد برد برد نئو نوآر وایلد وود از هر نظر شگفت‌انگیز است. تاریخ اکران: جمعه، 23 اکتبر بازیگران: پیتون الیزابت لی، جیکوب ترمبلی، کری مولیگان، ماهرشالا علی، آنجلا باست، آکوافینا، مایا ارسکین، جیک جانسون، چارلی دی، تام ویتس، ریچارد ای."}, {"source": "Hollywood Reporter", "title": "Netflix Has Used AI on About 300 Titles, but “Human Touch Is Critical,” Exec Says in Busan", "link": "https://www.hollywoodreporter.com/business/business-news/netflix-ai-300-titles-busan-film-fest-1236727138/", "summary": "Netflix’s Asia-Pacific production head Sung Q Lee, ‘The Outlaws’ director Kang Yun-sung and Wētā FX's Kimball Thurston discussed creative possibilities, production savings and the limits of AI at the streamer’s Creative Asia event in Busan.", "date_str": "2026-10-11T05:12:50+00:00", "hash": "16491d35e9261b98", "title_fa": "نتفلیکس در حدود 300 عنوان از هوش مصنوعی استفاده کرده است، اما مدیر اجرایی در بوسان می‌گوید \"لمس انسانی حیاتی است\"", "summary_fa": "سونگ کیو لی، سرپرست تولید آسیا و اقیانوسیه نتفلیکس، کانگ یون سونگ، کارگردان «قانون‌ها» و کیمبال تورستون از Wētā FX در رویداد آسیای خلاق استریمر در بوسان درباره احتمالات خلاقانه، صرفه‌جویی در تولید و محدودیت‌های هوش مصنوعی صحبت کردند. یکی از مدیران ارشد تولید آن روز شنبه در جریان یک بحث صنعتی در جشنواره بین المللی فیلم بوسان گفت نتفلیکس قبلاً در حدود 300 عنوان از هوش مصنوعی در ظرفیت های مختلف استفاده کرده است. سانگ کیو لی، مدیر ارشد تولید نتفلیکس برای آسیا و اقیانوسیه، گفت که این فناوری در سراسر فرآیند ساخت فیلم به کار گرفته شده است، اما بر اهمیت حفظ خلاقیت انسان تاکید کرد. لی گفت که [AI] در پیش نمایش، طراحی تولید، کار کردن با مفاهیم پیش از موعد، در ویرایش و البته در VFX استفاده می شود. اما سوالی که برای من مهم است این نیست که چقدر هوش مصنوعی می توانیم در این عنوان بگذاریم؟ اما، این عنوان با هوش مصنوعی چه کمکی بیشتری می تواند بکند؟ داستان‌های مرتبط فیلم‌ها آوا دوورنی زنگ خطر فرسایش دموکراسی را در چهاردهمین اکران جهانی به صدا در می‌آورد: ما باید با فیلم‌ها بجنگیم اسکار: بریتانیا تمرین‌های مستند ایران را برای یک انقلاب به‌عنوان بهترین فیلم بلند بین‌المللی انتخاب می‌کند لی در رویداد سالانه نتفلیکس که با همکاری جشنواره بین‌المللی فیلم آسیای خلاقانه بوسان ارائه شد، سخنرانی می‌کرد. در این پنل که با همکاری انجمن تصاویر متحرک میزبانی می شد، کانگ یون سونگ، فیلمساز کره ای، کارگردان یاغی ها و یکی از کاربران مشتاق ابزارهای هوش مصنوعی، و کیمبال تورستون، مدیر ارشد فناوری در W t FX نیز حضور داشتند. بیشتر بحث‌ها بر فرصت‌هایی متمرکز بود که هوش مصنوعی می‌تواند برای فیلم‌سازانی که با بودجه‌های محدود کار می‌کنند ایجاد کند، اگرچه سخنرانان بارها بر نیاز به حفظ قضاوت خلاقانه انسان تأکید کردند. این مناسبت همچنین نشان داد"}, {"source": "Hollywood Reporter", "title": "‘New Girl’ Stars Reunite — in a Slightly Different Way Than Max Greenfield Claimed", "link": "https://www.hollywoodreporter.com/tv/tv-news/new-girl-stars-reunite-different-way-max-greenfield-claimed-1236727002/", "summary": "Zooey Deschanel, Max Greenfield, Jake Johnson, Lamo  او باید فرار کند و مطمئن شود که از برادر کوچکش محافظت می کند، و در نهایت این ماموریت را انجام می دهد که در آن او به عنوان یک بلید رانر با LAPD مخفیانه می رود. Yeoh با کنایه گفت که شخصیت او در سریال محدود در حال مرگ است: او می داند که زمان در حال اتمام است"}, {"source": "Hollywood Reporter", "title": "Joseph Gordon-Levitt Says Instead of Being Afraid of AI, “We Should Be Concerned About the People Building AI”", "link": "https://www.hollywoodreporter.com/movies/movie-news/joseph-gordon-levitt-concern-people-building-ai-1236727031/", "summary": "\"These models are being trained to hijack your intimacy, to make friends with you, to get you to fall in love with it,\" the actor said of technology's training.", "date_str": "2026-10-10T22:48:07+00:00", "hash": "3424590eb18af443", "title_fa": "جوزف گوردون-لویت می گوید به جای ترس از هوش مصنوعی، \"ما باید نگران افرادی باشیم که هوش مصنوعی می سازند\"", "summary_fa": "این بازیگر درباره آموزش فناوری گفت: «این مدل ها آموزش می بینند تا صمیمیت شما را ربوده، با شما دوست شوند، تا شما را عاشق آن کنند. جوزف گوردون-لویت، که در ماه مارس به عنوان اولین مدافع جهانی سازمان ملل برای حکومت دیجیتال انسان محور منصوب شد، استدلال می کند که به جای ترس از هوش مصنوعی، باید نگران افرادی باشیم که هوش مصنوعی می سازند. در یک مصاحبه ویدیویی جدید با نیویورک تایمز، از این بازیگر بزرگ ترین ترس فعلی اش در مورد این فناوری پرسیده شد. گوردون-لویت پاسخ داد که من فقط به این دلیل به این سوال اعتراض می کنم که یکی از مشکلات کاهش این نگرانی ها به یک لقمه ترس است. به من گفت: اوه، من می ترسم که هوش مصنوعی بتواند تمام بشریت را که واقعاً متوجه اصل نگرانی نیست، نابود کند. این نگرانی اعتبار واقعی دارد. او گفت، اما این چیزی نیست که واقعاً من را نگران می‌کند، و توضیح داد که نگرانی‌هایش بسیار پیچیده‌تر و خسته‌کننده‌تر است که در مورد آن صحبت کنم، زیرا بسیار متراکم‌تر است و به زوال دموکراسی، کاهش همدلی انسانی به عنوان یک نگرانی اشاره کرد. داستان‌های مرتبط فیلم‌ها دنی بویل دلیل استفاده از هوش مصنوعی را برای مگی تاچر در جوهر به اشتراک می‌گذارد - بدون اینکه از دارایی‌اش و عشق او به وسواس و کسب‌وکار اتاق‌های پشتی بپرسد چه چیزی برای هالیوود در سال جاری Iberseries Platino Industria اهمیت دارد این شرکت‌ها روی این تصور شرط می‌بندند که قرار است کل اقتصاد را تصاحب کنند. گوردون-لویت افزود که این یک توتالیتاریسم است و واقعاً بد است. به طور همزمان، این مدل ها آموزش می بینند تا صمیمیت شما را ربوده، با شما دوست شوند، تا شما را عاشق آن کنند. ما نباید از هوش مصنوعی بترسیم. ما باید نگران افرادی باشیم که هوش مصنوعی می‌سازند."}, {"source": "Variety", "title": "John Malkovich Says the Oscars Race Was a ‘Different World’ When He Was Last on the Campaign Trail: ‘Now, That’s the Only Way to Get People to Go to Theaters’", "link": "https://variety.com/2026/film/festivals/john-malkovich-oscars-campaigning-only-way-people-theaters-1236907530/", "summary": "John Malkovich has been highly tipped for an Oscar nomination for his performance in Martin McDonagh s CIA black comedy Wild Horse Nine, making it his first real shot at an Academy Award in three decades. The 72-year-old actor was previously nominated for best supporting actor in Places in the Heart (1984) and In the Line [ ]", "date_str": "2026-10-11T14:11:59+00:00", "hash": "402a0163ca7e25f2", "title_fa": "جان مالکوویچ می‌گوید که مسابقه اسکار زمانی که آخرین بار در کمپین حضور داشت، یک «دنیای متفاوت» بود: «اکنون، این تنها راه برای ترغیب مردم به تئاتر است».", "summary_fa": "جان مالکوویچ برای بازی در کمدی سیاه وحشی نهم به کارگردانی سیا به کارگردانی مارتین مک‌دونا برای نامزدی اسکار بسیار مورد توجه قرار گرفته است و این اولین فیلم واقعی او در یک جایزه اسکار در سه دهه اخیر است. این بازیگر 72 ساله قبلاً در فیلم‌های Places in the Heart (1984) و In the Line [ ] نامزد دریافت جایزه بهترین بازیگر نقش مکمل مرد شده بود. داستان‌های مرتبط نقد گودزیلا منهای صفر: نبرد گودزیلا و شاه گیدورا تا مرگ در ادامه‌ی بزرگ‌تر گودزیلا منهای نقد وان کروکس: پرتره‌ای تاریک از زندگی روستایی آلمانی در پایان تلخ جنگ جهانی دوم، به نظر من، جایگاهی ناشایست داشت، اما با این وجود در فرهنگ بسیار بالایی قرار داشت. مالکوویچ می‌گوید و وقتی می‌گویم مستحق نیست، یعنی این تعداد شهرک چینی یا پدرخوانده یا پدرخوانده دوم وجود نداشت. بنابراین اکنون، این تنها راه برای ترغیب مردم به رفتن به تئاتر است. و آن ماه و ماه و ماه است. مالکوویچ که بیش از 30 سال پیش در آخرین باری که برای جایزه اسکار حضور داشت، محبوبیت زیادی در Variety داشت، گفت که مبارزات انتخاباتی چندان شدید نبود. زمانی که من نامزد جایزه اسکار شدم، یکی گفت، شما نامزد جایزه اسکار هستید. با این حال، مالکوویچ به هر حال هرگز از طرفداران پر و پا قرص مراسم جوایز نبوده است، و تنها یک بار در مراسم اسکار شرکت کرد، زمانی که نامزد فیلم Places in the Heart شد. او به جمعیت لندن گفت که از این تجربه کاملاً غرق شده است. من مدیری داشتم به نام فیلیس کارلایل، و ما در راه بودیم به غرفه دوروتی چندلر، و او کمی رئیس بود. او به یاد می آورد، حالا عزیزم، وقتی به آنجا برسیم، مردم زیادی خواهند بود. و من گفتم، باشه، اما ما فقط می‌توانیم از در کناری برویم، درست است؟ و او،"}, {"source": "Variety", "title": "‘Wildwood’ Director Travis Knight Reflects on Animated Feature’s 16-Year Journey at London Premiere: ‘When We Started This, Barack Obama Was a Fresh-Faced President’", "link": "https://variety.com/2026/film/global/wildwood-director-animation-16-year-journey-london-premiere-1236908166/", "summary": "Stop-motion animation is a notoriously time-consuming method to make a film, with most features taking several years of painstakingly detailed work by vast teams of creatives. But few have likely taken as long as Laika s sweeping fantasy epic Wildwood, which had its world premiere at the BFI London Film Festival on Sunday. Speaking on stage [ ]", "date_str": "2026-10-11T14:02:12+00:00", "hash": "47be11fb7d374d66", "title_fa": "تراویس نایت، کارگردان «وایلد وود» در مورد سفر 16 ساله انیمیشن در اولین نمایش لندن می نویسد: «وقتی این کار را شروع کردیم، باراک اوباما یک رئیس جمهور تازه نفس بود».", "summary_fa": "انیمیشن استاپ موشن یک روش بسیار وقت گیر برای ساخت یک فیلم است، با اکثر ویژگی ها چندین سال کار دقیق و پرزحمت توسط تیم های عظیمی از خلاقان طول می کشد. اما تعداد کمی از آنها احتمالاً به اندازه حماسه فانتزی وح د", "summary_fa": "Pat McAfee در مکان های بیشتری در ESPN ظاهر شده است. Super Bowl یکشنبه را به لیست اضافه کنید. McAfee تعداد فزاینده‌ای از به‌اصطلاح بازیگران جایگزین را هدایت می‌کند که حول برنامه‌های Super Bowl سال 2027 دیزنی ساخته شده‌اند. میزبان صراحتا برای لنگر کردن Field Pass، یک گزینه تفسیر محور که در کنار پخش سنتی [ ] پخش می شود، استفاده شده است، علاوه بر این، شرکت پخش تلویزیونی Super Bowl با تمرکز بر آمار، Playbook را ارائه خواهد کرد که توسط فیلد یتس، چیس دانیل، لوئیس ریدیک و ست والدر رهبری خواهد شد. محبوب در Variety Field Pass در ESPNU ظاهر می شود، در حالی که Playbook در روز یکشنبه Super Bowl در شبکه NFL اجرا می شود."}, {"source": "Variety", "title": "‘Wildwood’ Review: Laika’s Most Ambitious Feature to Date Is a Richly Textured, Transportive Fairytale Epic", "link": "https://variety.com/2026/film/reviews/wildwood-review-1236908019/", "summary": "Enjoy handmade art before it s gone forever. Keen-eyed viewers may read these words fleetingly on screen in the early stages of Wildwood, amid a wealth of fast-passing sights and sight gags as its young heroine cycles furiously through the homey, bustling streets of Portland, Oregon. Printed on a sign next to the craggly wares of [ ]", "date_str": "2026-10-11T13:15:00+00:00", "hash": "7c3e0d7e14bc86ed", "title_fa": "نقد و بررسی «Wildwood»: جاه‌طلبانه‌ترین ویژگی لایکا تا به امروز یک حماسه با بافت غنی و حمل‌ونقل است", "summary_fa": "قبل از اینکه برای همیشه از بین برود از هنر دست ساز لذت ببرید. بینندگان با چشم تیزبین ممکن است این کلمات را در مراحل اولیه وایلد وود، در میان انبوهی از مناظر سریع و وقفه های بینایی که قهرمان جوانش با عصبانیت در خیابان های خانه دار و شلوغ پورتلند، اورگان می چرخد، زودگذر بخوانند. بر روی تابلویی در کنار اجناس تند [ ] چاپ شده است. عناصر داستانی آشنا به وفور در فیلم تراویس نایت، اقتباس شده از رمان محبوب کودکان کالین ملوی در سال 2011 وجود دارد، اما تماشای استاپ موشن مجلل به آن احساس تازگی و سرزندگی می دهد. این به خودی خود یک مکاشفه نیست. سبک بصری بسیار ارگانیک، خاص لایکا (و بگذارید گفته شود، به طرز ماهرانه‌ای با CG تقویت شده) از اولین فیلم آن‌ها در سال 2009، فیلم کلاسیک کودکانه مدرن هنری سلیک، کورالاین، تا کمدی مسخره‌ای شبیه حلقه گمشده، یک دهه بعد، تحت تأثیر قرار گرفته است. هر دوی این فیلم‌ها یک سبک داستان‌سرایی عجیب و غریب را انتخاب کردند که با صمیمیت مهارت‌شان مطابقت داشت. با این حال، در سال 2016، در ماجراجویی تاریخی ژاپنی کوبو و دو رشته، نایت این رسانه مینیاتوریستی را به قلمروی حماسی وحشیانه سوق داد، هدفی که او در این ماجراجویی 130 دقیقه‌ای که به طور روایی از افسانه‌های گوتیک تا جنگ‌های درونی را در بر می‌گیرد، جاه‌طلبانه‌تر دنبال می‌کند. برخی از طرفداران قدیمی لایکا ممکن است احساسات گرم تری نسبت به سفرهای کوچکتر و عجیب و غریب استودیو داشته باشند، اما Wildwood به عنوان یک دستاورد رسمی و یک نسل خوشایند از جمعیت، یک موفقیت تماشایی است. محبوب در Variety اگر فیلم، در سطح داستان، کلی بیشتر از چیزی است که ما از کتاب بازی Laika انتظار داریم، این برای کتابی که از آن اقتباس شده نیز صدق می کند."}, {"source": "Variety", "title": "Christopher Nolan’s ‘The Odyssey’ Overtakes ‘Avatar: The Way of Water’ as Korea’s Biggest International Film of All Time (EXCLUSIVE)", "link": "https://variety.com/2026/film/box-office/odyssey-passes-avatar-korea-top-international-film-ever-1236908100/", "summary": "Christopher Nolan’s “The Odyssey” has overtaken “Avatar: The Way of Water” in local-currency terms to become the highest-grossing international release in Korean box office history, with a cumulative KRW139.2 billion ($101.5 million) as of Oct. 11. The Universal release now ranks as the top Hollywood title ever in the territory. Only two Korean films have [ ]", "date_str": "2026-10-11T13:00:00+00:00", "hash": "98575215ff7b1c98", "title_fa": "«اودیسه» کریستوفر نولان از «آواتار: راه آب» به عنوان بزرگ‌ترین فیلم بین‌المللی تمام دوران کره پیشی گرفت (اختصاصی)", "summary_fa": "«اودیسه» کریستوفر نولان از نظر ارز محلی از «آواتار: راه آب» پیشی گرفت و با مجموع 139.2 میلیارد وون (101.5 میلیون دلار) تا 11 اکتبر، به پردرآمدترین اکران بین‌المللی در تاریخ باکس آفیس کره تبدیل شد. تنها دو فیلم کره‌ای توانسته‌اند [ ] ادیسه کریستوفر نولان از آواتار: راه آب پیشی بگیرد و به پردرآمدترین اکران بین‌المللی در تاریخ باکس آفیس کره تبدیل شود. از جمعیت کشور هیچ فیلم بین المللی دیگری امسال از مرز 10 میلیون نفر عبور نکرده است. اودیسه همچنین شماره شماره را داشت. 1 امتیاز برای هفت آخر هفته متوالی، طولانی‌ترین رشته برای یک عنوان بین‌المللی در کره. محبوب در Variety اکنون بزرگترین فیلم نولان در کره و همچنین بزرگترین عنوان یونیورسال در این کشور است. این فیلم رکورد Imax را نیز در اختیار دارد، در مجموع با اکران فیلم در هفته دهم خود در صفحه نمایش های فرمت، به رشد خود ادامه می دهد. هیچ فیلمی که در کره اکران شده است تعداد بیشتری را در نمایشگرهای Imax و Dolby Cinema دریافت نکرده است و نمایش‌های Imax به طور مداوم در هفته پنجم اکران به فروش می‌رسند که طولانی‌ترین فروش در تاریخ است. این فیلم در 33 روز از 10 میلیون پذیرش عبور کرد، سریع‌تر از هر عنوان بین‌المللی بدون فرانچایز. این اولین فیلم بین‌المللی با امتیاز 15+ بود که به آن سطح رسید و اولین اکران اوت از هر نوعی بود که به این سطح رسید. نتیجه این کار، نولان را به اولین کارگردان با دو فیلم بین‌المللی بدون فرانچایز با بیش از 10 میلیون پذیرش در کره تبدیل کرد."}, {"source": "Variety", "title": "AI-Native Studios Can Create Original IP While Traditional Studios Keep Their Edge, VFX Veteran Hong Jae Cheol Says at Busan", "link": "https://variety.com/2026/film/markets-festivals/ai-native-studios-create-original-ip-vfx-veteran-busan-1236908092/", "summary": "Small, AI-native companies running automated pipelines can develop their own intellectual property, while traditional studios hold on to their advantages in established franchises, production infrastructure, talent and distribution, according to VFX veteran Hong Jae Cheol. Hong, a producer-director at Viscode who began his career at Industrial Light Magic and worked on films including “Iron [ ]", "date_str": "2026-10-11T10:33:16+00:00", "hash": "bc2f06cb88bafba7", "title_fa": "هونگ جائه چئول، کهنه کار VFX در بوسان می گوید: استودیوهای AI-Native می توانند IP اصلی ایجاد کنند در حالی که استودیوهای سنتی برتری خود را حفظ می کنند.", "summary_fa": "به گفته Hong Jae Cheol، کهنه کار VFX، شرکت‌های کوچک و بومی هوش مصنوعی که خطوط لوله خودکار را اجرا می‌کنند، می‌توانند مالکیت معنوی خود را توسعه دهند، در حالی که استودیوهای سنتی مزایای خود را در امتیازات، زیرساخت‌های تولید، استعداد و توزیع حفظ می‌کنند. هانگ، تهیه‌کننده و کارگردان Viscode که کار خود را در Industrial Light Magic آغاز کرد و روی فیلم‌هایی از جمله «Iron [ ] شرکت‌های کوچک و بومی هوش مصنوعی که خطوط لوله خودکار را اجرا می‌کنند، می‌توانند مالکیت معنوی خود را توسعه دهند، در حالی که طبق گفته Ja Cheeol Hong کهنه‌کار VFX، استودیوهای سنتی مزیت‌های خود را در امتیازات، زیرساخت‌های تولید، استعداد و توزیع حفظ می‌کنند. هونگ استدلال کرد که هوش مصنوعی مدل تولید را تغییر می‌دهد، در حالی که جلوه‌های بصری سنتی برای قابل استفاده کردن مواد تولید شده روی صفحه ضروری هستند. او آینده را به عنوان یک ترکیب ترکیبی و مشارکت بین هوش مصنوعی و خلاقیت انسانی، به جای جایگزینی عمده استودیوهای موجود، ترسیم کرد. محبوب در Variety Hong یک لایو اکشن معمولی و فرآیند VFX را که شامل دارایی‌های سه بعدی، انیمیشن، رندر و ترکیب‌بندی است، با رویکردی به کمک هوش مصنوعی مقایسه کرد. در دومی، بازیگران در یک مجموعه کنترل شده اجرا می کنند. هوش مصنوعی محیط ها و عناصر بصری را تولید می کند. و هنرمندان VFX ردیابی، ادغام و تکمیل را انجام می دهند. او همچنین کاربردهای فعلی هوش مصنوعی را در VFX، انیمیشن و فیلمسازی، از جمله روتوسکوپی، پاکسازی، پیش‌بینی، طراحی کاراکتر، تست‌های دوربین و ایجاد محیط را تشریح کرد. مارک واکهولز، مدیر خلاق استودیو Dreamkite مستقر در برلین، که فیلم‌های هوش مصنوعی او، The Cinema That Never Was و C remony برنده جوایز برتر جشنواره‌های فیلم هوش مصنوعی شده‌اند، از جنبه خلاقانه به این تغییر نزدیک شد. او ایجاد مشترک هوش مصنوعی را دعوتی برای"}, {"source": "Variety", "title": "‘12.12: The Day’ Director Kim Sung-soo Says AI ‘Shows What’s in Your Imagination’", "link": "https://variety.com/2026/film/markets-festivals/12-12-the-day-director-kim-sung-soo-ai-craft-1236908089/", "summary": "Kim Sung-soo, director of Korean box office hit “12.12: The Day,”     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
