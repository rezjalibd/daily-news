<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۶ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۶ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۸ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۹:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۲۴</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۳۰</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۴۱</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

 و حسن نیت خود را نشان دهد». این مقام قطری افزود که دوحه اظهارات مثبتی از سوی مقام‌های جمهوری اسلامی شنیده است، اما تهران باید در عمل نیز حسن نیت نشان دهد، از تهدید کشورهای منطقه دست بردارد و تنگۀ هرمز را بازگشایی کند. به‌گفتۀ او، این اقدامات", "image_url": "https://gdb.rferl.org/9a85a8b1-ea08-4c18-886d-09c70739ad2d_cx0_cy10_cw0_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۵ آبان • ۱۷:۳۵"}],
      tech: [{"source": "NYT Tech", "title": "How Billionaires Are Fighting the Prop 40 California Wealth Tax", "link": "https://www.nytimes.com/2026/10/27/technology/proposition-40-california-billionaire-tax.html", "summary": "The latest Silicon Valley billionaire club is a $333 million political ad machine that is heavily engaged in next week’s elections.", "date_str": "2026-10-27T14:55:35+00:00", "hash": "5d1e6b735a5f0243", "title_fa": "چگونه میلیاردرها با مالیات بر ثروت کالیفرنیا Prop 40 مبارزه می کنند", "summary_fa": "آخرین باشگاه میلیاردرهای سیلیکون ولی یک دستگاه تبلیغات سیاسی 333 میلیون دلاری است که به شدت درگیر انتخابات هفته آینده است. در حالی که ما در حال بررسی دسترسی شما هستیم، یک نمای پیش نمایش از این مقاله دارید. وقتی دسترسی را تأیید کردیم، محتوای کامل مقاله بارگیری می شود. گوش دادن · 11:17 دقیقه اشتراک گذاری مقاله کامل 86 نوشته تئودور شلیفر و ارین گریفیث تئودور شلیفر درباره میلیاردرها می نویسد. ارین گریفیث سرمایه گذاری خطرپذیر را پوشش می دهد. در چند ماه گذشته، هر سه‌شنبه، دوجین نفر از ثروتمندترین افراد جهان یا مشاورانشان به یک کنفرانس تلفنی می‌روند و برای جنگ برنامه‌ریزی می‌کنند. جنگ علیه مالیات پیشنهادی است، اما نه هر مالیاتی. این علیه «مالیات بر ثروت» میلیاردرهای کالیفرنیا است، مالیاتی که ثروتمندترین دره سیلیکون آن را تهدیدی وجودی می‌داند که می‌تواند راه جدیدی برای حمله به آنها ایجاد کند. بنابراین در یادداشت‌های محرمانه، چت‌های واتس‌اپ و سیگنال و تماس‌های کنفرانسی، آن‌ها برای مقابله با یکدیگر متحد می‌شوند. این فراخوان‌ها توسط «ساختن کالیفرنیای بهتر» سازمان‌دهی می‌شوند، یک سازمان غیرانتفاعی که امسال برای مبارزه با پیشنهاد 40 آغاز شده است. هر هفته، عوامل سازمان غیرانتفاعی کمک کنندگان یا مشاوران آنها را در مورد نظرسنجی، تبلیغات و تحقیقات مخالفان توضیح می دهند. اغلب، تماس‌ها شامل این سؤال می‌شوند: آیا می‌خواهید کمی بیشتر بدهید؟ سوابق ایالتی نشان می‌دهد که حدود 80 اهداکننده بیش از 333 میلیون دلار برای ساختن کالیفرنیای بهتر فراهم کرده‌اند که آن را به یکی از بهترین تلاش‌های سیاسی در تاریخ کالیفرنیا تبدیل کرده است. فهرست اهداکنندگان از افراد مشهور فناوری است: سرگئی برین، بنیانگذار گوگل؛ اریک اشمیت، مدیر اجرایی سابق گوگل؛ پاتریک کولیسون، مدیر اجرایی استرایپ؛ سرمایه گذار افسانه ای جان دوئر.", "image_url": "https://static01.nyt.com/images/2026/10/26/business/00biz-billionaire-tax/00biz-billionaire-tax-videoSixteenByNineJumbo1600.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۵ آبان • ۱۸:۲۵"}, {"source": "The Guardian AI", "title": "Elon Musk says he has ‘cyber psychosis’. Do you too? | Arwa Mahdawi", "link": "https://www.theguardian.com/commentisfree/2026/oct/27/elon-musk-cyber-psychosis-ai-tech", "summary": "Whether using chatbots for childcare or taking up smoking, a new affliction is sweeping through the tech world. Here are the signs In the least surprising news you’ll hear all week, Elon Musk has said he’s not entirely right in the head. “I’ve got a little bit of cyber psychosis,” the world’s richest and most irritating man explained during an event this month. “Maybe a lot actually.” Musk added that, over “various points this year”, he’s had “AI or SI psychosis probably half a dozen times”. SI, in case you missed the super-important memo, stands for “ superintelligence ” and it’s what Donald Trump wants everyone to call AI now, for reasons too stupid to explain. While the phrase SI is still being used 0nly by weaselly tech bros desperate for Trump’s approval, you’ll probably have heard the term “ AI psychosis ” bandied around a lot. On the most serious level, it refers to delusional thinking induced or exacerbated by sycophantic chatbots. People who have ploughed their life savings into a ridiculous business idea, for example, because computer code told them they were the next Jeff Bezos. But the phrase has also been used more jokingly to describe overexuberance around artificial intelligence, and that seems to be how Musk was using it. The comments about his self-diagnosed bouts of cyber psychosis came as the tech mogul waxed lyrical about how great AI music videos have become, and how he believes artificial intelligence now “understands beauty and harmony”. Continue reading...", "date_str": "2026-10-27T15:01:14+00:00", "hash": "12097b0c2e0e8678", "title_fa": "ایلان ماسک می گوید که مبتلا به «روان پریشی سایبری» است. شما هم؟ | عروه مهدوی", "summary_fa": "چه از چت ربات ها برای مراقبت از کودکان استفاده کنید و چه سیگار کشیدن، رنج جدیدی در دنیای فناوری در حال فراگیری است. این نشانه‌ها هستند در کمترین خبر شگفت‌انگیزی که در طول هفته می‌شنوید، ایلان ماسک گفته است که او کاملاً درست نمی‌گوید. ثروتمندترین و عصبانی ترین مرد جهان در جریان رویدادی در این ماه توضیح داد: \"من کمی روان پریشی سایبری دارم.\" \"شاید در واقع خیلی زیاد.\" ماسک اضافه کرد که در «مقاله‌های مختلف امسال»، احتمالاً نیم دوجین بار به روان‌پریشی هوش مصنوعی یا SI مبتلا شده است. SI، در صورتی که یادداشت فوق‌العاده مهم را از دست دادید، مخفف «ابر هوش» است و این همان چیزی است که دونالد ترامپ می‌خواهد همه اکنون آن را هوش مصنوعی بنامند، به دلایلی که توضیح آن احمقانه است. در حالی که عبارت SI هنوز فقط توسط برادران فناوری راسو که از تایید ترامپ ناامید هستند استفاده می شود، احتمالاً اصطلاح \"روان پریشی هوش مصنوعی\" را زیاد شنیده اید. در جدی‌ترین سطح، به تفکر هذیانی اشاره دارد که توسط چت‌بات‌های غم انگیز القا یا تشدید می‌شود. افرادی که پس انداز زندگی خود را در یک ایده تجاری مضحک ریخته اند، برای مثال، زیرا کد کامپیوتری به آنها گفته است که جف بزوس بعدی هستند. اما این عبارت بیشتر به شوخی برای توصیف شور و نشاط بیش از حد پیرامون هوش مصنوعی استفاده شده است و به نظر می رسد ماسک از آن استفاده کرده است. نظرات در مورد حملات روان پریشی سایبری که خودش تشخیص داده بود، زمانی منتشر شد که غول فناوری درباره اینکه موزیک ویدیوهای هوش مصنوعی چقدر عالی شده اند و چگونه معتقد است هوش مصنوعی اکنون \"زیبایی و هارمونی\" را درک می کند، اظهار نظر کرد. به خواندن ادامه دهید... من در کمترین خبر شگفت انگیزی که در طول هفته خواهید شنید، ایلان ماسک گفته است", "image_url": "https://i.guim.co.uk/img/media/121853e4d08bed46c56e62c752f7dc3127c80dc0/1121_0_6827_5464/master/6827.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctb3BpbmlvbnMucG5n&enable=upscale&s=27f9cd237ce0219c539fb0feb94a76d5", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "موسیقی"], "datetime_fa": "۵ آبان • ۱۸:۳۱"}, {"source": "The Verge", "title": "Apple s latest AirTag is the cheapest it’s ever been", "link": "https://www.theverge.com/gadgets/1019138/apple-airtag-second-gen-cricut-joy-2-printer-deal-sale", "summary": "Thanksgiving is less than a month away, so now’s a good time to start preparing before the rush. Fortunately, Apple s latest AirTag can help you keep tabs on your luggage and other belongings amid the holiday chaos, and it’s currently down to an all-time low of $23 ($6 off) at Amazon and Walmart . Apple AirTag (second-gen) Where to Buy: $29 $23 at Amazon $29 $23 at Walmart If you own an iPhone, the second-gen AirTag is the best Bluetooth tracker you can buy. That’s largely due to Apple’s ultra-wideband chip, which enables Precision Finding and guides you to an object s exact location with on-screen arrows, vibrations, and sounds. The second-gen model can also help you find things faster than the prior generation, as it lets you pick up those directional cues from up to 50 percent farther (it also offers greater Bluetooth range). In our tests , that meant faster connections and better performance across multiple floors, which could come in handy if you ve left something behind in a hotel. You can even follow directions on an Apple Watch Series 9 or later, making it possible to track down your stuff without pulling out your phone. The latest AirTag offers a few other perks for travelers, too. You can share it with up to five other people, which is handy if you re traveling with family members. If your suitcase goes missing, you can also temporarily share its location with participating airlines, including both United and Delta . That means if your suitcase gets lost, airline staff can see its reported location, which can make it easier to track down and return to you. More conveniently, it runs on a replaceable CR2032 battery designed to last more than a year, so you won t have to worry about charging it before every trip. Read our AirTag (second-gen) review . window.HYPE_DESK_CONFIG = { productImageUrl: \"https://platform.theverge.com/wp-content/uploads/sites/2/2026/10/apple_watch_series_10.png\", productImageAlt: \"Apple Watch Series 10\", productTitle: \"Apple Watch Series 10\", shortDescription: \"Save on a refurbished Apple Watch Series 10\", longDescription: \"Get an Apple Watch Series 10 with a 46mm aluminum case and GPS connectivity for a fraction of its listed new price. Shop refurbished options at Back Market with a one-year warranty.\", purchaseUrl: \"https://www.awin1.com/cread.php?awinmid=18275 awinaffid=299513 platform=dl ued=https%3A%2F%2Fwww.backmarket.com%2Fen-us%2Fp%2Fapple-watch-series-10%3Futm_source%3Dchatgpt.com\", purchaseLinkText: \"Shop At Back M", "date_str": "2026-10-27T15:34:16+00:00", "hash": "cc9a0e5f95464e02", "title_fa": "آخرین AirTag اپل ارزان‌ترین AirTag است", "summary_fa": "کمتر از یک ماه دیگر به روز شکرگزاری باقی مانده است، بنابراین اکنون زمان خوبی برای شروع آماده سازی قبل از عجله است. خوشبختانه، آخرین AirTag اپل می تواند به شما کمک کند تا در میان هرج و مرج تعطیلات، چمدان ها و سایر وسایل خود را کنترل کنید، و در حال حاضر به کمترین قیمت 23 دلاری (6 دلار تخفیف) در آمازون و والمارت رسیده است. Apple AirTag (نسل دوم) از کجا بخریم: ۲۹ دلار ۲۳ دلار در آمازون ۲۹ دلار ۲۳ دلار در Walmart اگر آیفون دارید، نسل دوم AirTag بهترین ردیاب بلوتوثی است که می توانید بخرید. این تا حد زیادی به دلیل تراشه باند فوق العاده اپل است که جستجوی دقیق را فعال می کند و شما را با فلش های روی صفحه، لرزش ها و صداها به مکان دقیق یک شی راهنمایی می کند. مدل نسل دوم همچنین می‌تواند به شما کمک کند چیزها را سریع‌تر از نسل قبلی پیدا کنید، زیرا به شما امکان می‌دهد آن نشانه‌های جهت را تا 50 درصد دورتر انتخاب کنید (همچنین برد بلوتوث بیشتری ارائه می‌دهد). در آزمایش‌های ما، این به معنای اتصالات سریع‌تر و عملکرد بهتر در چندین طبقه بود که اگر چیزی را در هتل رها کرده باشید، می‌تواند مفید باشد. حتی می‌توانید دستورالعمل‌های اپل واچ سری 9 یا جدیدتر را دنبال کنید و امکان ردیابی موارد خود را بدون بیرون کشیدن گوشی فراهم کنید. آخرین AirTag چند امتیاز دیگر را نیز برای مسافران ارائه می دهد. می توانید آن را با حداکثر پنج نفر دیگر به اشتراک بگذارید، که اگر با اعضای خانواده سفر می کنید مفید است. اگر چمدانتان گم شد، می‌توانید به‌طور موقت مکان آن را با خطوط هوایی شرکت‌کننده، از جمله یونایتد و دلتا، به اشتراک بگذارید. این بدان معناست که اگر چمدان شما گم شود، کارکنان خطوط هوایی می توانند مکان گزارش", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/10/AirTagVergeDailyDeals.png?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["Apple", "تراشه"], "datetime_fa": "۵ آبان • ۱۹:۰۴"}, {"source": "Ars Technica", "title": "Apple iPhone Duo review: Two screens, two experiences, two thousand dollars", "link": "https://arstechnica.com/gadgets/2026/10/apple-iphone-duo-review-two-screens-two-experiences-two-thousand-dollars/", "summary": "I understand the appeal of foldable phones—they let manufacturers keep expanding screen sizes while still producing devices that can reasonably fit in a pocket. In practice, though, every foldable Android phone I've seen in public has had a ridiculously visible seam between the two halves of the screen, often with what looks like delamination from the underlying surface, giving the display an ugly, bubbly appearance. Back when Android phones began shipping with bigger and bigger screens and the iPhone was stuck at a miserly four inches, I was jealous. But I've never looked at anyone using a chunky, fragile-looking foldable phone in public and pined for Apple's take on the idea. Nevertheless, that take has arrived, in the form of the iPhone Duo . This $1,999-and-up foldable is the biggest change to the iPhone in years, with both hardware and software updates that dramatically change how you interact with the device. Read full article Comments", "date_str": "2026-10-27T14:20:26+00:00", "hash": "48c33d93ed6cee38", "title_fa": "بررسی Apple iPhone Duo: دو صفحه نمایش، دو تجربه، دو هزار دلار", "summary_fa": "من جذابیت تلفن‌های تاشو را درک می‌کنم—آنها به تولیدکنندگان اجازه می‌دهند تا اندازه صفحه نمایش را افزایش دهند و در عین حال دستگاه‌هایی تولید کنند که به طور منطقی در جیب جا شوند. با این حال، در عمل، هر گوشی اندرویدی تاشوی که در انظار عمومی دیده‌ام، بین دو نیمه صفحه‌نمایش درز به‌طور مسخره‌ای قابل مشاهده است، که اغلب به نظر می‌رسد که از سطح زیرین لایه لایه شده است و ظاهری زشت و حباب‌دار به نمایشگر می‌دهد. زمانی که گوشی‌های اندرویدی با صفحه‌نمایش بزرگ‌تر و بزرگ‌تر عرضه می‌شدند و آیفون در چهار اینچ خسیسی گیر کرده بود، حسادت می‌کردم. اما من هرگز به کسی نگاه نکرده‌ام که از یک تلفن تاشو با ظاهری شکننده و درشت استفاده می‌کند و به دنبال برداشت اپل از این ایده بودم. با این وجود، این برداشت به شکل iPhone Duo وارد شده است. این قابلیت تاشو با قیمت 1999 دلار و بالاتر، بزرگ‌ترین تغییر در آیفون در سال‌های اخیر است، با به‌روزرسانی‌های سخت‌افزاری و نرم‌افزاری که نحوه تعامل شما با دستگاه را به طرز چشمگیری تغییر می‌دهد. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش من جذابیت تلفن های تاشو را درک می کنم—آنها به سازندگان اجازه می دهند اندازه صفحه نمایش را افزایش دهند در حالی که هنوز دستگاه هایی تولید می کنند که به طور منطقی در جیب قرار گیرند. با این حال، در عمل، هر گوشی اندرویدی تاشوی که در انظار عمومی دیده‌ام، بین دو نیمه صفحه‌نمایش درز به‌طور مسخره‌ای قابل مشاهده است، که اغلب به نظر می‌رسد که از سطح زیرین لایه لایه شده است و ظاهری زشت و حباب‌دار به نمایشگر می‌دهد.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/IMG_3790-1152x648.jpeg", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۵ آبان • ۱۷:۵۰"}, {"source": "Ars Technica", "title": "Some iPhone Duo screens are already failing, Apple says only a \"small number\" are affected", "link": "https://arstechnica.com/gadgets/2026/10/some-iphone-duo-screens-are-already-failing/", "summary": "The iPhone Duo launched last week, offering anyone willing to spend $2,000 a chance to experience Apple's first foldable phone. For some early buyers, the morning after isn't going great. Despite the company's big talk about its \"precision-engineered\" hinge, some devices appear to have a hardware flaw that destroys the device's impressive internal display within hours (or minutes) of use. The Internet is currently overflowing with images of busted iPhone Duos, all sporting almost identical damage. The OLED is marred by several bright lines originating just below the midpoint of the display. These bands of damaged pixels extend all the way to the bottom and right edges. Some units also show lines of dead pixels following the crease from the top to the area where the bright lines begin. Anyone who has seen a damaged OLED panel will be familiar with this type of defect. When the layers of the display are damaged, the pixels no longer receive the correct voltage to illuminate them. Instead, they get the full driving voltage and are permanently on at maximum brightness. Some pixels can get no voltage, leaving them totally black. The only fix is to replace the OLED, but swapping the iPhone Duo's screen reportedly costs half as much as the device itself. Read full article Comments", "date_str": "2026-10-27T14:00:49+00:00", "hash": "15cf88f9276968b7", "title_fa": "برخی از صفحه‌نمایش‌های iPhone Duo در حال حاضر از کار می‌افتند، اپل می‌گوید که تنها تعداد کمی تحت تأثیر قرار می‌گیرند", "summary_fa": "آیفون Duo هفته گذشته راه اندازی شد و به هر کسی که مایل به خرج کردن 2000 دلار است فرصتی برای تجربه اولین گوشی تاشو اپل ارائه می دهد. برای برخی از خریداران اولیه، صبح بعد از آن خیلی خوب نیست. علیرغم صحبت های بزرگ این شرکت در مورد لولای \"مهندسی دقیق\" آن، به نظر می رسد برخی از دستگاه ها دارای نقص سخت افزاری هستند که نمایشگر داخلی چشمگیر دستگاه را ظرف چند ساعت (یا چند دقیقه) پس از استفاده از بین می برد. اینترنت در حال حاضر مملو از تصاویر آیفون Duos شکسته شده است که همگی آسیب تقریباً یکسانی دارند. OLED با چندین خط روشن که دقیقاً زیر نقطه میانی نمایشگر منشا می گیرند، مخدوش می شود. این نوارهای پیکسل های آسیب دیده تا لبه های پایین و سمت راست گسترش می یابند. برخی از واحدها همچنین خطوطی از پیکسل های مرده را به دنبال چین از بالا تا ناحیه ای که خطوط روشن شروع می شود نشان می دهند. هرکسی که پنل OLED آسیب دیده را دیده باشد با این نوع نقص آشنا خواهد بود. وقتی لایه‌های نمایشگر آسیب می‌بینند، پیکسل‌ها دیگر ولتاژ مناسبی برای روشن کردن آنها دریافت نمی‌کنند. در عوض، آنها ولتاژ رانندگی کامل را دریافت می کنند و به طور دائم در حداکثر روشنایی روشن هستند. برخی از پیکسل ها نمی توانند ولتاژ دریافت کنند و کاملا سیاه می شوند. تنها راه حل تعویض OLED است، اما طبق گزارش ها، تعویض صفحه نمایش آیفون Duo نصف خود دستگاه هزینه دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید iPhone Duo هفته گذشته راه اندازی شد و به هر کسی که مایل به خرج کردن 2000 دلار است فرصتی برای تجربه اولین", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/iphone-duo-oops-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۵ آبان • ۱۷:۳۰"}, {"source": "Ars Technica", "title": "Sculpture recreates odd optical effects of famed Lycurgus Cup", "link": "https://arstechnica.com/science/2026/10/scientists-recreate-the-1600-year-old-recipe-of-lycurgus-cup/", "summary": "Dating back to around 400 CE and made of dichroic glass, the Lycurgus Cup is notable for exhibiting different colors depending on the light. (It gets its name from the scene depicted on its surface, of King Lycurgus of Thrace.) Light it from the front, and the cup looks green; light it from behind, and the color changes to a deep red. University of Sheffield scientists have recreated the original recipe to produce a contemporary glass sculpture with the same optical effect. The cup is considered one of the seven glass wonders of the world, one of just 40 glass cage cups that survived. Exactly why the unusual color effects of the Lycurgus Cup occurred was a mystery until 2007 , when a team of scientists discovered the color shifts were due to the presence of nanoparticles in the glass—the result of Roman artisans adding finely ground gold and silver into the mix. Those nanoparticles change how the electrons in the cup vibrate in response to light so that the color one sees shifts with the observer’s vantage point. As we reported in 2019, it’s a similar phenomenon to the one responsible for the shifting colors of 19th-century daguerreotypes due to the scattering properties of nanoparticles. The Romans added salt when they melted the silicon (sand) to make the glass, and those salts contained gold atoms. In the melting process, those atoms aggregate and produce nanoparticles, which in turn produce the colors. It’s how any stained glass is made. It's also similar to how the precise lattice-like structure of photonic crystals produces iridescent colors in nature, like the wings of butterflies, or opals. Read full article Comments", "date_str": "2026-10-27T13:32:35+00:00", "hash": "89c94a610809fbb3", "title_fa": "مجسمه سازی جلوه های نوری عجیب جام لیکورگوس مشهور را بازسازی می کند", "summary_fa": "جام لیکورگوس که قدمت آن به حدود 400 سال پس از میلاد برمی گردد و از شیشه دو رنگ ساخته شده است، به دلیل نمایش رنگ های مختلف بسته به نور قابل توجه است. (نام خود را از صحنه ای که روی سطح آن به تصویر کشیده شده است، از پادشاه لیکورگوس تراکیه گرفته شده است.) آن را از جلو روشن کنید، و جام سبز به نظر می رسد. آن را از پشت روشن کنید و رنگ آن به قرمز تیره تغییر می کند. دانشمندان دانشگاه شفیلد دستور اصلی را برای تولید مجسمه شیشه ای معاصر با همان جلوه نوری بازسازی کردند. این فنجان یکی از هفت عجایب شیشه‌ای جهان است، یکی از تنها ۴۰ فنجان قفس شیشه‌ای که باقی مانده است. این که چرا اثرات رنگی غیرمعمول جام لیکورگوس رخ داد تا سال 2007 یک راز بود، زمانی که تیمی از دانشمندان دریافتند که تغییر رنگ به دلیل وجود نانوذرات در شیشه است - نتیجه‌ی اضافه کردن طلا و نقره ریز آسیاب شده توسط صنعتگران رومی به این مخلوط. این نانوذرات نحوه ارتعاش الکترون‌های جام در پاسخ به نور را تغییر می‌دهند به طوری که رنگی که فرد می‌بیند با نقطه دید ناظر تغییر می‌کند. همانطور که در سال 2019 گزارش دادیم، این پدیده مشابه پدیده ای است که به دلیل خواص پراکندگی نانوذرات مسئول تغییر رنگ دگرئوتیپ های قرن نوزدهمی است. رومی ها وقتی سیلیکون (ماسه) را برای ساختن شیشه ذوب کردند نمک اضافه کردند و این نمک ها حاوی اتم های طلا بودند. در فرآیند ذوب، آن اتم‌ها تجمع کرده و نانوذرات تولید می‌کنند که به نوبه خود رنگ‌ها را تولید می‌کنند. هر شیشه رنگی اینگونه ساخته می شود. همچنین شبیه به این است که چگونه ساختار دقیق شبکه مانند بلورهای فوتونی رنگ های رنگین کمانی مانند بال های پروانه ها یا عقیق ها را در طبیعت", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/lycurgusTOP-1152x648-1793103945.jpg", "category": "هوش مصنوعی مولد", "tags": ["بورس و طلا"], "datetime_fa": "۵ آبان • ۱۷:۰۲"}, {"source": "Ars Technica", "title": "US officials want Section 702 renewed before damaging court ruling goes public", "link": "https://arstechnica.com/tech-policy/2026/10/us-officials-want-section-702-renewed-before-damaging-court-ruling-goes-public/", "summary": "Two Democratic senators who have long overseen US intelligence say the Trump administration is illegally withholding a secret court’s findings from Congress until lawmakers renew a program that lets federal agents read Americans’ communications without a warrant. Seven months ago, the Foreign Intelligence Surveillance Court objected to search filters that let intelligence analysts pull Americans’ messages from intercepted data without the approvals, written justifications, or records the law requires. The court approved another year of surveillance anyway. The ruling has never been made public, and Senators Ron Wyden of Oregon and Adam Schiff of California say the administration’s own deadline for releasing it passed in September. The program, Section 702 of the Foreign Intelligence Surveillance Act (FISA), lapsed in June after Congress failed to renew it, though collection continues under the court’s March approval. The administration’s own public documentation says rulings like this one are reviewed for public release “within 180 days of issuance.” That window closed September 13, even as intelligence officials press lawmakers to reauthorize the program by the end of the year. Read full article Comments", "date_str": "2026-10-27T13:22:16+00:00", "hash": "f4d5bec963326611", "title_fa": "مقامات ایالات متحده خواهان تجدید بخش 702 قبل از علنی شدن حکم آسیب‌رسان دادگاه هستند", "summary_fa": "دو سناتور دموکرات که مدت‌هاست بر اطلاعات آمریکا نظارت داشته‌اند، می‌گویند که دولت ترامپ به‌طور غیرقانونی یافته‌های یک دادگاه مخفی را از کنگره پنهان می‌کند تا زمانی که قانون‌گذاران برنامه‌ای را تمدید کنند که به ماموران فدرال اجازه می‌دهد ارتباطات آمریکایی‌ها را بدون حکم بخوانند. هفت ماه پیش، دادگاه نظارت اطلاعات خارجی با فیلترهای جستجویی مخالفت کرد که به تحلیلگران اطلاعاتی اجازه می‌داد پیام‌های آمریکایی‌ها را از داده‌های رهگیری شده بدون تأیید، توجیه کتبی یا سوابق مورد نیاز قانون استخراج کنند. به هر حال دادگاه یک سال دیگر نظارت را تایید کرد. این حکم هرگز علنی نشده است و سناتورهای ران وایدن از اورگان و آدام شیف از کالیفرنیا می گویند که ضرب الاجل خود دولت برای انتشار آن در سپتامبر گذشته است. این برنامه، بخش 702 قانون نظارت بر اطلاعات خارجی (FISA)، در ماه ژوئن پس از اینکه کنگره نتوانست آن را تمدید کند، از بین رفت، اگرچه جمع آوری آن تحت تایید دادگاه در ماه مارس ادامه دارد. اسناد عمومی خود دولت می گوید که احکامی مانند این برای انتشار عمومی «طی 180 روز پس از صدور» بررسی می شوند. این پنجره در 13 سپتامبر بسته شد، حتی در شرایطی که مقامات اطلاعاتی به قانونگذاران فشار می‌آورند تا مجوز مجدد این برنامه را تا پایان سال صادر کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه it.ir/media/cyan-light-autonomous-vehicle-6adf14ac765406765ecb4f93?w=1920&q=75", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۵ آبان • ۱۸:۴۰"}, {"source": "Lifehacker", "title": "10 Shows Like 'VisionQuest' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-visionquest?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Following the events of WandaVision (and, slightly more tangentially, Agatha All Along ), VisionQuest returns to the story of Marvel's favorite synthic being, an artificial creation who fights supervillains and ponders the nature of his own existence, rather than more typical AI pursuits like creating deep fakes. White Vision (the character, not the political agenda) is a copy of the Vision who died two Avengers movies ago. He's living within his own mind on a fantasy country estate while on the run from bounty hunters and in pursuit of his semi-fictional son. In that spirit, here are 10 more science fiction shows that involve artificial people and/or elaborate constructed realities. Humans (2015 2018) In the near-future world, highly advanced synths are commonplace, doing the work that regular humans can t be bothered with. These beings are treated as entirely disposable sources of cheap labor, despite their apparent burgeoning humanity. The first season introduces the Hawkins family, who buy (on sale) a domestic servant synth named Anita (Gemma Chan); mom Laura is a little uncomfortable with the arrangement, especially when she finds her husband having sex with Anita, who has her own complicated backstory. Humans interrogates the ways humans always seem to find excuses to dehumanize others, which is just the type of thing that sci-fi is pretty great at. Stream Humans on Peacock , Prime Video , and Tubi . Humans (2015 2018) at Peacock Learn More Learn More at Peacock Murderbot (2025 ) One of the smartest recent shows is a dark comedy based on the Hugo-Award winning book series by Martha Wells. Alexander Skarsg rd is the title's hilariously deadpan robot, a private \"security construct\" who's managed to hack its way through its own programming and gain free will which it mostly wants to use to binge its favorite streaming shows. It can't just run off for fear of drawing attention, but the self-named Murderbot (it's being ironic, kinda) is content to do the bare minimum when it's assigned to a team of naive hippie researchers who don't see the need for a killer security robot at least, not until they're enmeshed in a complicated capitalist plot in which they're all just cogs. Stream Murderbot on Apple TV . Murderbot (2025 ) at Apple TV Learn More Learn More at Apple TV Demascus (2025) From playwright Tearrance Arvelle Chisholm ( Hooded: Or Being Black for Dummies ), this show stars Okieriete Onaodowan as the ", "date_str": "2026-10-27T15:30:00+00:00", "hash": "d6cdbb088c3e7cae", "title_fa": "10 نمایش مانند \"VisionQuest\" که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. پس از رویدادهای WandaVision (و کمی مماس تر، Agatha All Along)، VisionQuest به داستان موجود مصنوعی مورد علاقه مارول باز می گردد، یک ساخته مصنوعی که با ابرشرورها مبارزه می کند و به ماهیت وجود خود فکر می کند، نه به دنبال کارهای معمولی AI مانند ساختن جعلی های عمیق. White Vision (شخصیت، نه دستور کار سیاسی) یک کپی از Vision است که در دو فیلم Avengers درگذشت. او در حالی که در حال فرار از شکارچیان جایزه و در تعقیب پسر نیمه تخیلی خود است، در ذهن خود در یک ملک روستایی فانتزی زندگی می کند. با این روحیه، در اینجا 10 نمایش علمی تخیلی دیگر وجود دارد که شامل افراد مصنوعی و/یا واقعیت‌های ساخته‌شده است. Humans (2015 2018) در دنیای آینده نزدیک، مصنوعی‌های بسیار پیشرفته رایج هستند و کارهایی را انجام می‌دهند که انسان‌های معمولی نمی‌توانند با آن آزار دهند. این موجودات علیرغم انسانیت در حال رشد ظاهری، به عنوان منابع کاملاً دور ریختنی نیروی کار ارزان تلقی می شوند. فصل اول خانواده هاوکینز را معرفی می‌کند که (در فروش) یک خدمتکار خانگی به نام آنیتا (جما چان) را خریداری می‌کنند. مامان لورا از این ترتیب کمی ناراحت است، به خصوص وقتی می بیند که شوهرش در حال رابطه جنسی با آنیتا است که داستان پیچیده خودش را دارد. انسان‌ها روش‌هایی را مورد بازجویی قرار می‌دهند که به نظر می‌رسد انسان‌ها همیشه بهانه‌هایی برای بی‌انسان‌کردن دیگران پیدا می‌کنند، این همان چیزی است که علمی تخیلی در آن بسیار عالی است. Humans را در Peacock، Prime Video و Tubi پخش کنید. Humans (2015 2018) در Peacock بیشتر بدانید در Peacock Murderbot (2025) یکی از هوشمندانه‌ترین نمایش‌های اخیر، یک کمدی سیاه بر اساس مجموعه کتاب‌های برنده جایزه هوگو اثر مارتا ولز است. Alexander Skarsg rd ربات مرده خنده دار", "image_url": "https://lifehacker.com/imagery/articles/01M5T0FT42D7HE80VHAD3AV7JX/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple", "امنیت سایبری", "سینما"], "datetime_fa": "۵ آبان • ۱۹:۰۰"}, {"source": "Lifehacker", "title": "10 Hacks Every Google Messages User Should Know", "link": "https://lifehacker.com/tech/best-google-messages-hacks?utm_medium=RSS", "summary": "Google Messages is Google's official texting app, and while it hasn't always been first to roll out useful features, it has caught up to what other messaging services offer and has a handful of hidden hacks to make communicating and coordinating with contacts easier and safer. Here are the best tips and tricks that every Google Messages user should know. Use the Keep integration to coordinate group events directly in Google Messages Google Messages recently got a Google Keep integration, which allows group chat participants to collaborate on notes and checklists directly in the message thread without having to click over to a separate app. This also centralizes ideas in one place rather than spread across a thread with dozens of separate text messages. Changes to Keep Notes sync automatically for all users. Tap the plus icon in the message compose bar in Google Messages, select Keep Notes , and either choose an existing note or tap to create a new one to be shared in the chat. Turn on advanced scam detection to protect against security threats Over the last few years, Google has rolled out a number of security features for identifying and defending against scams and fraud spread via calls and text messages. These work by detecting suspected spam and either preventing it from being delivered or hiding it in a separate folder, as well as flagging suspicious links. A newer opt-in enhanced protection mode for Google Messages uses AI to catch more complex threats and alert you if a conversation or unfamiliar link that looks legit might put you at risk. Standard protection is on by default, but you can turn on enhanced protection under Messages settings Protection Safety Spam and scam protection . Use scheduled send to draft texts while maintaining good boundaries If you have an idea you want to write down but not send immediately because it's outside of work hours or late at night you can draft it in Google Messages and schedule it for later. \"Send later\" features in messaging and chat apps are useful for maintaining good boundaries without having to remember to type and send at a different time. Once you've entered your message in the text field, touch and hold Send , choose from the suggested actions, then tap Send again. Customize swipe actions for Google Messages inbox triage Swiping left or right on your conversations in Google Messages will either archive or delete them. You can customize which swipe maps onto which action for quick inbox triaging or disa", "date_str": "2026-10-27T15:00:05+00:00", "hash": "9afca4fc41c2e9ef", "title_fa": "10 هک که هر کاربر پیام های گوگل باید بداند", "summary_fa": "Google Messages برنامه رسمی پیامک Google است و اگرچه همیشه اولین بار نبوده است که ویژگی های مفیدی را ارائه کرده است، اما به آنچه که سایر سرویس های پیام رسانی ارائه می دهند پی برده است و تعداد انگشت شماری هک پنهان برای برقراری ارتباط و هماهنگی با مخاطبین آسان تر و ایمن تر است. در اینجا بهت icant steps to reduce fuel consumption, including slowing the itinerary and spending more time in port,\" Villa Vie Residences said. \"Those measures have not been enough to offset the extraordinary increase in fuel costs, and we have been unable to continue carrying the resulting operating losses.\" Villa Vie Residences sold permanent cabins on its 509-cabin ship, the Odyssey, ranging from $119,999 to $439,999. Its pitch to residents was a never-ending cruise around the world with stops at more than 400 ports of call and a global circumnavigation every three-and-a-half years. The ship, which has a pool deck, spa, and a pickleball court, also offered five-year residencies, starting at $59,999. The rising fuel costs put the company's operating model under unsustainable financial pressure, Villa Vie Residences said. The company added that it was evaluating options, but that no financing or transaction had been finalized. \"Passing the full increase on to residents is not a realistic solution,\" the company said. \"Our focus now is on supporting residents, crew, and employees while we work toward restructuring and recapitalization over the next 60 days. That work is ongoing, and no outcome is assured.\" The press release said the company", "date_str": "2026-10-27T14:23:23+00:00", "hash": "482c04d5428a689f", "title_fa": "یک کشتی «بی پایان» عملیات را متوقف کرده و به ساکنان گفته است که پس از افزایش 300 درصدی هزینه سوخت در کامبوج پیاده شوند.", "summary_fa": "کشتی کروز Villa Vie Residences Odyssey در سپتامبر 2024 از بلفاست به حرکت در آمد. PAUL FAITH/AFP از طریق Getty Images قرار بود یک کشتی تفریحی مسکونی بی پایان باشد. اکنون، عملیات متوقف شده است. ویلا وی رزیدنس گفت که به دلیل افزایش بیش از 300 درصدی هزینه های سوخت، دیگر نمی تواند کار کند. این خط کروز در سال 2024 با وعده یک سفر زنده و پیوسته در سراسر جهان حرکت کرد. یک کشتی تفریحی که وعده زندگی دائمی در دریا را می فروشد ناگهان متوقف شد. ویلا وی رزیدنس، که کشتی تفریحی مسکونی ویلا وی اودیسه را اداره می کند، روز سه شنبه اعلام کرد که فعالیت خود را در کامبوج به دلیل افزایش شدید هزینه های سوخت به حالت تعلیق درآورده است. این شرکت گفت که هزینه سوخت ماهانه برای هر کابین، که قبلاً به طور میانگین حدود 1800 دلار بود، تا 344 درصد در بخش‌هایی از آسیا افزایش یافته و به 6000 تا 8000 دلار تخمین زده شده است. اگر ساکن Villa Vie Odyssey هستید یا بوده اید و داستانی برای به اشتراک گذاشتن دارید، با این خبرنگار در تماس باشید: jzitser@businessinsider.com. جنگ ایالات متحده و اسرائیل با ایران در ماه فوریه آغاز شد و پس از آن بسته شدن تنگه هرمز توسط ایران - یک نقطه انسداد حیاتی برای محموله های نفتی جهانی - باعث افزایش قیمت انرژی در سراسر جهان شد. Villa Vie Residences گفت: «از زمانی که درگیری در اواخر فوریه آغاز شد، ما اقدامات قابل توجهی برای کاهش مصرف سوخت از جمله کاهش سرعت سفر و گذراندن زمان بیشتر در بندر انجام دادیم. این اقدامات برای جبران افزایش فوق‌العاده هزینه‌های سوخت کافی نبوده است و ما نمی‌توانیم زیان‌های عملیاتی ناشی از آن را تحمل کنیم.» Villa Vie Residences کابین های دائمی کشتی 509 کابینی خود به نام Odyssey را از 119999 دلار", "image_url": "https://i.insider.com/6ae0ab2c3ae265b597b0277e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۵ آبان • ۱۷:۵۳"}, {"source": "Business Insider", "title": "Stylists share 11 items you should get rid of from your fall wardrobe", "link": "https://www.businessinsider.com/fall-wardrobe-clothes-accessories-get-rid-of-stylists-advice-2026-10", "summary": "Certain styles will be especially trendy this fall, but others may be falling out of favor. Edward Berthelot/Getty Images We asked three stylists to share which wardrobe items people may want to reconsider this fall. Personality-driven pieces are replacing the quiet luxury trend, the experts said. Baggy and chunky styles could be getting a more refined update this fall. As the leaves change colors in autumn, wardrobes tend to shift too. Although adding warmer tones and heavier layers may be typical updates, other parts of your cozy fall transformation may be worth reconsidering this season. Business Insider asked three professional stylists which wardrobe staples are starting to feel dated and what they recommend wearing instead. Here's what they had to say. Sweaters with shoulder details could replace bulky cable-knits. You may want to save the chunkier knits for next season. Edward Berthelot/Getty Images Fashion is leaning away from dropped shoulders and oversized, bulky shapes in heavy-textured sweaters, said David Zyla , stylist and author of \"Color Your Style.\" Instead, the stylist recommends reaching for structured sweaters that bring the volume higher up on the body through more defined shoulder details. This might look like styles with \"built-in shoulder pads and strong horizontal boat-neck seaming or balloon sleeves,\" Zyla told BI. Wearing baggy everything may not be in style this fall. Edward Berthelot/Getty Images According to Fred Kim , a New York-based stylist, wearing baggy clothing from head to toe is fading in popularity. There's no need to rid your closet of relaxed pieces entirely, though. Instead, the stylist recommends being more intentional about where you add volume. \"I think a modern approach would be just kind of getting rid of the oversized items and just keeping it a little more refined, or choose one area to create volume,\" Kim said. For instance, he recommends pairing a fitted T-shirt with a relaxed trouser or a straight-leg jean with a looser-fitting jacket. Consider replacing low ankle booties with taller boots. Some ankle boots could be challenging to style. Edward Berthelot/Getty Images Wardrobe stylist Rachel Varney said booties that dip down too low on the ankle are starting to feel outdated. \"I just think that maybe it's better to keep our ankles covered for the fall,\" Varney told BI. She also said booties with a side zipper can create an especially awkward gap between the shoe and the pants, which can create a less-flatt", "date_str": "2026-10-27T14:15:37+00:00", "hash": "da7e232c790451bc", "title_fa": "استایلیست ها 11 مورد را به اشتراک می گذارند که باید آنها را از کمد لباس پاییزی خود حذف کنید", "summary_fa": "برخی از سبک ها به خصوص در پاییز امسال مد روز خواهند بود، اما برخی دیگر ممکن است مورد توجه قرار نگیرند. ادوارد برتلو/گتی ایماژ از سه استایلیست خواستیم تا به اشتراک بگذارند که افراد ممکن است بخواهند در پاییز امسال در مورد کدام اقلام کمد لباس تجدید نظر کنند. به گفته کارشناسان، قطعات شخصیت محور جایگزین روند آرام لوکس شده اند. استایل‌های گشاد و درشت می‌توانند در پاییز امسال به‌روزرسانی دقیق‌تری دریافت کنند. با تغییر رنگ برگ ها در پاییز، کمد لباس ها نیز تغییر می کنند. اگرچه افزودن رنگ‌های گرم‌تر و لایه‌های سنگین‌تر ممکن است به‌روزرسانی‌های معمولی باشد، سایر بخش‌های دگرگونی دنج پاییزی شما ممکن است ارزش بازنگری در این فصل را داشته باشند. Business Insider از سه استایلیست حرفه‌ای پرسید که کدام یک از کمد لباس‌ها شروع به قدیمی شدن کرده‌اند و به جای آن چه چیزی را توصیه می‌کنند. در اینجا چیزی است که آنها باید می گفتند. ژاکت‌هایی با جزئیات شانه می‌توانند جایگزین بافت‌های کابلی حجیم شوند. ممکن است بخواهید بافتنی های پرپشت تر را برای فصل بعد ذخیره کنید. ادوارد برتلو/ گتی ایماژ، دیوید زیلا، صاحب سبک و نویسنده کتاب «به سبک خودت رنگ کن» گفت: مد از شانه‌های افتاده و شکل‌های بزرگ و حجیم در ژاکت‌های بافت سنگین خم می‌شود. در عوض، آرایشگر توصیه می‌کند به سراغ ژاکت‌های ساختاری بروید که از طریق جزئیات مشخص‌تر شانه، حجم بدن را بالاتر می‌برد. زیلا به BI گفت: این ممکن است شبیه سبک‌هایی با «پدهای شانه‌ای توکار و آستین‌های بادکنکی یقه‌ای افقی و محکم باشد». پوشیدن همه چیز گشاد ممکن است در پاییز امسال شیک نباشد. ادوارد برتلو/ گتی ایماژ به گفته فرد کیم، استایلیست نیویورکی، پوشیدن لباس های گشاد از سر تا پا در حال محو شدن است. با این حال، نیازی نیست که کمد خود را به طور کامل از شر قطعات آرام خلاص", "image_url": "https://i.insider.com/6ae0b0bf3ae265b597b027af?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۵ آبان • ۱۷:۴۵"}, {"source": "Business Insider", "title": "Global soccer star Kylian Mbappé is losing sponsors in China after he joked about Chairman Mao", "link": "https://www.businessinsider.com/kylian-mbappe-chairman-mao-joke-chinese-brands-cut-ties-2026-10", "summary": "Kylian Mbappé is featured on bottles of Dongpeng s electrolyte drink. VCG/VCG via Getty Images One of soccer's biggest stars is in hot water in China over joking about Chairman Mao Zedong. Kylian Mbappé referred to Mao as a \"Chinese dictator\" during a podcast talk about his favorite memes. Two Chinese brands ended deals with Mbappé, while shares in shoemaker On, which sponsors him, fell. Chinese brands are cutting ties with Kylian Mbappé, one of the world's biggest soccer stars, after he joked about Mao Zedong on a podcast. Mbappé, who plays for Real Madrid and captains the French national team, has been nicknamed \"The Dictator\" for his confidence and influence over the teams he plays for. The nickname has spawned countless memes, many of which compare him to historical leaders, including Mao. The controversy was sparked by a clip circulating on social media from an interview with \"The Bridge,\" a French podcast co-hosted by one of Mbappé's teammates. In it, Mbappé said the meme that made him laugh the most was one where his face was superimposed onto that of \"some guy — I think he's a Chinese dictator.\" The video then cuts to an image of Mao with Mbappé's face. While millions died under Mao's leadership, he is still revered by the Chinese Communist Party for his role as the founding father of modern China. Jokes about him remain a social taboo in China and are considered disrespectful. Dongpeng, a drinks company whose ads and packaging feature Mbappé, announced on Tuesday that it would no longer work with him. \"Our company firmly opposes and has zero tolerance for actions that hurt national feelings,\" it said in a statement. \"Effective immediately, we are ending all cooperation with Kylian Mbappé.\" Mengniu, the country's largest dairy producer, also released a similar statement. Soon after it was posted, Dongpeng's statement became the top-trending topic on the Chinese social media site Weibo. Mbappé apologized in a statement on Tuesday morning, calling the comment \"ill-judged.\" \"I now understand that it hurt many people in China and in Chinese communities around the world,\" he said in the statement, which was posted in English, French, and Mandarin. \"I apologize to everyone my words have upset. This was absolutely not my intention. I have deep respect for the Chinese people and their history, and I am sincerely sorry.\" https://t.co/MQBo9NCSy5 — Kylian Mbappé (@KMbappe) October 27, 2026 Mbappé is one of soccer's biggest stars. On Monday, he came second in ", "date_str": "2026-10-27T14:00:37+00:00", "hash": "cc05d5d807f14faf", "title_fa": "کیلیان امباپه، ستاره جهانی فوتبال، پس از شوخی در مورد رئیس مائو، حامیان مالی خود را در چین از دست می دهد.", "summary_fa": "کیلیان ام‌باپه روی بطری‌های نوشیدنی الکترولیتی دانگ‌پنگ نشان داده شده است. VCG/VCG از طریق گتی ایماژ یکی از بزرگترین ستاره های فوتبال در چین به دلیل شوخی در مورد رئیس مائو تسه تونگ در آب داغ است. کیلیان ام‌باپه در پادکستی از مائو به عنوان «دیکتاتور چین» در مورد میم‌های مورد علاقه‌اش یاد کرد. دو برند چینی به قرارداد خود با امباپه پایان دادند، در حالی که سهام کفاش On، که حامی مالی او بود، سقوط کرد. برندهای چینی پس از شوخی درباره مائو تسه تونگ در پادکست، روابط خود را با کیلیان امباپه، یکی از بزرگترین ستاره های فوتبال جهان قطع می کنند. امباپه که برای رئال مادرید بازی می کند و کاپیتان تیم ملی فرانسه است، به دلیل اعتماد به نفس و نفوذش بر تیم هایی که در آنها بازی می کند، لقب \"دیکتاتور\" را به خود اختصاص داده است. این نام مستعار میم های بی شماری را ایجاد کرده است که بسیاری از آنها او را با رهبران تاریخی از جمله مائو مقایسه می کنند. این جنجال با پخش کلیپی در رسانه های اجتماعی از مصاحبه با \"پل\"، پادکست فرانسوی که یکی از هم تیمی های امباپه مجری آن بود، به راه افتاد. امباپه در آن گفت میمی که بیش از همه او را به خنده می‌آورد این بود که چهره‌اش روی چهره‌ی «فردی – فکر می‌کنم او یک دیکتاتور چینی» قرار گرفته بود. سپس این ویدیو به تصویری از مائو با چهره امباپه تبدیل می شود. در حالی که میلیون‌ها نفر تحت رهبری مائو جان باختند، حزب کمونیست چین همچنان او را به‌خاطر نقشش به‌عنوان پدر موسس چین مدرن مورد احترام قرار می‌دهد. شوخی در مورد او همچنان یک تابو اجتماعی در چین است و بی احترامی محسوب می شود. Dongpeng، یک شرکت نوشیدنی که تبلیغات و بسته بندی آن دارای امباپه است، روز سه شنبه", "image_url": "https://i.insider.com/6ae0972e8e95884e1ca83970?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["بورس و طلا"], "datetime_fa": "۵ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "4 mistakes people make when they order wine at restaurants, according to a sommelier", "link": "https://www.businessinsider.com/mistakes-people-make-ordering-wine-sommelier-advice-suggestions-2026-10", "summary": "Ordering wine doesn t have to be intimidating or difficult. Carlo Prearo/Shutterstock As a sommelier, I love trying new wines at restaurants, but they're not all winners. Many miss out on Italian whites, which are some of the most underappreciated wines in the world. Skip bottles from popular wine regions and order from their neighbors instead. It can be overwhelming to be handed an extensive wine list at a restaurant. Multiple pages with small print can be an overload of information — anxiety ensues, and you're not sure what to order. But as a sommelier , I've trained to understand all those little details, so you don't have to. Here are the mistakes I see people make when ordering wine — plus advice for what to do instead next time you're dining out. Ordering something they can readily buy at their local grocer Shebeko/Shutterstock Sommeliers work hard to curate thoughtful and interesting wine lists at restaurants. If you can get the wine at your grocery store or any retailer you frequent, skip it while you're out. Dining out is a time to explore and discover something new. This can be a grape you've never had, a producer you've never heard of, or a wine from a new-to-you region. Sure, you've had a Tuscan red wine, but have you had a red wine from Oltrepò Pavese made from pinot-noir grapes? At Italian restaurants, I always look out for bottles of La Genisia pinot. Exclusively sticking with overpriced bottles from major wine regions Ritu Manoj Jethani/Shutterstock Bordeaux is widely considered one of the finest wine regions in France, and Napa Valley reigns supreme in the US. So, it's no surprise that their wines often have price tags to match their elite status. Instead, I always look for areas near these benchmark regions to expand my horizons and save a few bucks. Just outside Bordeaux is a region called Cahors, which is known for making wines from the malbec grape. Crocus Wines is a reputable brand to try. In terms of Napa alternatives, I tend to reach for bottles from the Anderson Valley in Mendocino. Classic producers include Goldeneye Winery and Husch Vineyards. Only ever ordering white wines within their comfort zone guys_who_shoot/Shutterstock Ubiquitous, \"comfort zone\" white wines like chardonnay, sauvignon blanc, and pinot grigio tend to have cultlike followings. If you're open to branching out and are in a white-wine rut, I say start by taking a closer look at the menu. For example, Italy has a treasure trove of \"under the radar\" varieties. Th", "date_str": "2026-10-27T13:15:06+00:00", "hash": "87b450936421fc01", "title_fa": "4 اشتباهی که مردم هنگام سفارش شراب در رستوران مرتکب می شوند، به گفته یک سوملیه", "summary_fa": "سفارش شراب نباید ترسناک یا دشوار باشد. Carlo Prearo/Shutterstock به عنوان یک ساملی، من عاشق امتحان شراب های جدید در رستوران ها هستم، اما همه آنها برنده نیستند. بسیاری از شراب‌های سفید ایتالیایی که برخی از کم‌ارزش‌ترین شراب‌های جهان هستند، غافل می‌شوند. از بطری های مناطق معروف شراب صرف نظر کنید و به جای آن از همسایگان خود سفارش دهید. ارائه یک لیست شراب گسترده در یک رستوران می تواند غافلگیر کننده باشد. صفحات متعدد با چاپ ریز می تواند حجم زیادی از اطلاعات را به همراه داشته باشد - اضطراب ایجاد می شود و شما مطمئن نیستید که چه چیزی را سفارش دهید. اما به عنوان یک ساملی، من برای درک همه آن جزئیات کوچک آموزش دیده ام، بنابراین شما مجبور نیستید. در اینجا اشتباهاتی وجود دارد که می بینم مردم هنگام سفارش شراب مرتکب می شوند - به علاوه توصیه هایی برای اینکه دفعه بعد که بیرون غذا می خورید چه کاری انجام دهید. سفارش دادن چیزی که می‌توانند به راحتی در خواربار فروشی محلی خود بخرند، ساملی‌ها سخت تلاش می‌کنند تا فهرست‌های متفکرانه و جالب شراب را در رستوران‌ها تهیه کنند. اگر می‌توانید شراب را از خواربارفروشی یا هر خرده‌فروشی که به آن سر می‌زنید تهیه کنید، وقتی بیرون هستید از آن صرفنظر کنید. ناهار خوری زمانی برای کشف و کشف چیزهای جدید است. این می‌تواند انگوری باشد که هرگز نخورده‌اید، تولیدکننده‌ای باشد که هرگز نامش را نشنیده‌اید، یا شرابی از منطقه‌ای باشد که تازه به آن دست یافته‌اید. مطمئناً، شما یک شراب قرمز توسکانی مصرف کرده‌اید، اما آیا شراب قرمزی از Oltrepò Pavese که از انگور پینو نوآر ساخته شده بود، خورده‌اید؟ در رستوران های ایتالیایی، من همیشه به دنبال بطری های La Genisia pinot هستم. به طور انحصاری چسبیدن به بطری های گران قیمت از مناطق عمده شراب Ritu Manoj Jethani/Shutterstock Bordeaux به طور گسترده", "image_url": "https://i.insider.com/66e1d196cfb7f307e5708f54?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۵ آبان • ۱۶:۴۵"}, {"source": "Lifehacker", "title": "These Retro-Chic Nothing Headphones Are $100 Off Right Now", "link": "https://lifehacker.com/tech/nothing-headphones-1-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. In a crowded market of over-ear noise-canceling headphones, it can be tricky to find a pair with a distinctive style that stands out from the rest. Enter the retro-futuristic line of statement-making Nothing headphones. One of the brand s popular pairs, the Nothing Headphone (1) , is 33% off and down to $199 (originally $299), marking a record-low price. Nothing Headphone (1) $199.00 at Amazon $299.00 S tps://lifehacker.com/tech/how-to-export-arc-data-to-new-browser?utm_medium=RSS", "summary": "If you've been a dedicated Arc browser user, the time has finally come to say goodbye. The Browser Company paused development of Arc in 2025, continuing only with security updates. As announced late last week, Arc will officially sunset on Dec. 22, 2026, giving users two months to transition their data to an alternative. One option is to move to the company's new AI-focused Dia browser , though there are other (potentially better) choices depending on what you're looking for. Most data from Arc including Spaces, Favorites, pinned tabs, and folders as well as passwords, bookmarks, extensions, and history will transition automatically over to Dia, but if you're switching to a different platform entirely, you'll need to take what you can with you before Dec. 22. How to export your Arc data to a new browser Officially, Arc supports exporting Spaces and tabs only , and the resulting Export.md plain-text file is simply a list of links that you can open and bookmark in your new browser. MacOS users can initiate this process via Arc Settings Advanced Export Data and saving the file to a preferred location. On Windows, open the Arc menu, select Settings , and go to Export Spaces and tabs Export Data . To simply copy and paste every link from one folder, right-click the folder, select Copy All Links , and paste them wherever you'd like (select Copy All Links as Markdown to keep link titles on macOS). You can also save Easels as images by tapping the share icon Share Via... and selecting PNG . There's no formal process to export other Arc data. If you saved logins in Arc, now is a good time to start moving credentials over to a different platform. (Our top picks for password managers aren't tied to a single browser.) There are a few alternatives to Arc's official export process, which is highly manual and doesn't keep your folder structure intact. There are several third-party scripts available (for free) that can facilitate the transition as well as a paid extension called ArcEscape that can export folders and pinned tabs and import into another browser. The extension is available for Chrome, Edge, Brave, Vivaldi, and Firefox. According to Arc's FAQ, all user accounts will be deactivated on Dec. 22, and personal data will be deleted within 30 days of deactivation.", "date_str": "2026-10-27T14:00:00+00:00", "hash": "11cd747a7189c3ff", "title_fa": "چگونه داده های Arc خود را به یک مرورگر جدید صادر کنیم", "summary_fa": "اگر کاربر اختصاصی مرورگر Arc بوده اید، بالاخره زمان خداحافظی فرا رسیده است. شرکت مرورگر توسعه Arc را در سال 2025 متوقف کرد و تنها با به‌روزرسانی‌های امنیتی ادامه داد. همانطور که در اواخر هفته گذشته اعلام شد، Arc به طور رسمی در 22 دسامبر 2026 غروب می کند و به کاربران دو ماه فرصت می دهد تا داده های خود را به یک جایگزین انتقال دهند. یکی از گزینه ها این است که به مرورگر جدید Dia متمرکز بر هوش مصنوعی شرکت بروید، اگرچه بسته به آنچه به دنبال آن هستید، انتخاب های دیگری (به طور بالقوه بهتر) وجود دارد. بیشتر داده‌های Arc از جمله Spaces، Favorites، برگه‌ها و پوشه‌های پین‌شده، همچنین گذرواژه‌ها، نشانک‌ها، برنامه‌های افزودنی و تاریخچه به‌طور خودکار به Dia منتقل می‌شوند، اما اگر به طور کامل به پلتفرم دیگری تغییر مکان می‌دهید، باید قبل از ۲۲ دسامبر هر آنچه را که می‌توانید با خود ببرید. چگونه داده‌های Arc خود را به یک مرورگر جدید صادر کنیم به طور رسمی، Arc فقط از صادرات Spaces و برگه‌ها پشتیبانی می‌کند و فایل متنی ساده Export.md به سادگی فهرستی از پیوندهایی است که می‌توانید آن‌ها را باز کرده و در مرورگر جدید خود نشانک‌گذاری کنید. کاربران MacOS می توانند این فرآیند را از طریق Arc Settings Advanced Export Data و ذخیره فایل در مکان دلخواه آغاز کنند. در ویندوز، منوی Arc را باز کنید، تنظیمات را انتخاب کنید و به Export Spaces و برگه‌ها Export Data بروید. برای اینکه به سادگی هر پیوند را از یک پوشه کپی و جایگذاری کنید، روی پوشه کلیک راست کنید، Copy All Links را انتخاب کنید و هر کجا که می‌خواهید آن‌ها را جای‌گذاری کنید (برای حفظ عنوان پیوندها در macOS، Copy
