توسط Budrul Chukrut/SOPA Images/LightRocket از طریق Getty Images سهام تسلا پس از پرده برداری از رودستر جدید و پرطرفدار خود در معاملات قبل از بازار جهش کرد. این خودرو فروش بالایی را به همراه نخواهد داشت، اما پیشرفت های فنی تسلا را به رخ می کشد. جین مانستر، گاو قدیمی تسلا، این پرتاب را \"یک انعطاف مهندسی\" نامید. سهام تسلا پس از ساعاتی با رونمایی ایلان ماسک از رودستر جدید خود افزایش یافت - اما نه به این دلیل که سرمایه‌گذاران انتظار فروش بالایی از این ابرخودروی آینده‌نگر دارند. رودستر به‌عنوان یک خودروی کم‌تولید و گران‌قیمت، عامل اصلی درآمدزایی نخواهد بود و بخش کوچکی از تجارت تسلا خواهد بود. ماسک مدت‌هاست که مشخص کرده است که موفقیت آینده تسلا را نه در خودروهای سنتی، بلکه در رانندگی خودران و روبات‌های انسان‌نما می‌بیند. سهام تسلا به ندرت فقط بر اساس فروش کوتاه مدت خودرو معامله می شود. تسلا حدود 215 برابر سود تعدیل شده آینده معامله می‌کند، ارزشی که نشان‌دهنده انتظارات سرمایه‌گذاران برای رشد فراتر از تجارت اصلی خودرو است. نسخه ی نمایشی ویژگی های علمی تخیلی رودستر - مانند بلند کردن کوتاه از زمین و انجام مانورهای هوایی با استفاده از رانشگرهای گاز سرد الهام گرفته از اسپیس ایکس - بیشتر برای به نمایش گذاشتن ماهیچه های مهندسی این شرکت بود تا جلب علاقه انبوه خریداران. در سایت آزمایش اسپیس ایکس در تگزاس، تسلا رودستر را در حال انجام پرش، غلت زدن و فرود کنترل شده با استفاده از رانشگرهای گاز سرد نشان داد. این سیستم از هوای فشرده با فشار بالا برای تولید انفجارهای کوتاه رانش و کنترل استفاده می کند، فناوری که می تواند کاربردهای بسیار گسترده تری داشته باشد و به نظر می رسد که"}, {"source": "Business Insider", "title": "I embraced girlboss culture in my 20s. It didn't take long to realize I wanted out.", "link": "https://www.businessinsider.com/from-burnout-to-balance-new-take-on-rethinking-ambition-success-2026-10", "summary": "The author leaned out of hustle culture and said she enjoyed a more relaxed, but still fulfilling, life. Courtesy of Catherine Work. I spent my 20s believing that working hard and making money were the keys to independence. I realized I was working so much that I had no time or energy to enjoy the life I was building. Years later, being an ambitious woman looks different to me. I work less and have time for myself. I thought making a lot of money and working hard would make me happy. In my early 20s, I got great grades and finished my undergrad in three years. By my mid-20s, I had finished my graduate degree in law while frequently working 70-hour weeks. I leaned into the idea of being a girlboss , often working weekends or through my lunch, and focusing on making lots of money. It was a habit I saw modeled by my parents. It worked for them, and I thought it would work for me, until it didn't. I thought hard work was the point At 26, I worked long days at my home desk after making \"hard worker\" and \"responsible'\"my identity for years. I thought this was what an independent woman was: someone who worked constantly and optimized all of her time. The author said she spent so much time working in her 20s that she barely had time to enjoy the money she made. Courtesy of Catherine Work. Sure, I was saving lots of money and networking, but I was often too tired on my day off to do anything. I often chose to work on Saturdays and didn't even have time to spend my hard-earned money. Two things made me realize this wasn't a sustainable lifestyle: I once told a friend I couldn't take a 15-minute lunch break to call her, and another time I struggled to lift my full duffle bag for an upcoming trip after not working out for months. Something had to give. I didn't want to just recover from burnout I was clearly burned out. I could have taken some time off to recover and come back, but then the cycle would have continued. It helped that I spent my early 20s in Cameroon and Costa Rica, two places where work-life balance looks a lot different than it does in the US, and people live with their parents much longer. Looking back on those years when I was truly happy helped me to question what I was focusing on in my life. I came to a new conclusion. I didn't want to simply recover after burning out. I wanted to reject the premise that burnout was the price of being an ambitious woman. I stopped hustling toward anything In 2022, as the COVID restrictions were lifted more and a ", "date_str": "2026-10-16T10:21:01+00:00", "hash": "d44c1d33b8971048", "title_fa": "من در 20 سالگی فرهنگ دختربچه را پذیرفتم. طولی نکشید که فهمیدم می خواهم بیرون بروم.", "summary_fa": "نویسنده از فرهنگ شلوغی متمایل شد و گفت که از زندگی آرام تر، اما هنوز هم رضایت بخش تر لذت می برد. با حسن نیت از کاترین کار. 20 سالگی ام را با این باور گذراندم که سخت کار کردن و پول درآوردن، کلید استقلال است. متوجه شدم که آنقدر کار می کنم که وقت و انرژی برای لذت بردن از زندگی که می ساختم ندارم. سال ها بعد، یک زن جاه طلب بودن به نظر من متفاوت است. کمتر کار می کنم و برای خودم وقت دارم. فکر می کردم پول زیاد و سخت کار کردن باعث خوشحالی من می شود. در اوایل 20 سالگی ام، نمرات عالی گرفتم و کارشناسی را در سه سال تمام کردم. در اواسط 20 سالگی، مدرک تحصیلی خود را در رشته حقوق به پایان رسانده بودم در حالی که اغلب هفته ها 70 ساعت کار می کردم. من به این فکر افتادم که یک دختربچه باشم، اغلب آخر هفته ها یا ناهار کار می کنم، و روی کسب درآمد زیاد تمرکز می کنم. این عادتی بود که پدر و مادرم الگوبرداری کردند. برای آنها کار کرد، و من فکر می کردم برای من کار می کند، تا اینکه نشد. فکر می‌کردم سخت‌کوشی نکته مهمی است در ۲۶ سالگی، پس از اینکه سال‌ها هویت خود را «سخت‌کوش» و «مسئول» ساختم، روزهای طولانی را پشت میز خانه‌ام کار کردم. فکر می‌کردم این همان چیزی است که یک زن مستقل است: کسی که مدام کار می‌کند و تمام وقتش را بهینه می‌کند. نویسنده گفت که در دهه 20 سالگی آنقدر زمان صرف کار کرده است که به سختی فرصت دارد از پولی که به دست آورده است لذت ببرد. با حسن نیت از کاترین کار. مطمئناً، پول زیادی پس انداز می‌کردم و شبکه‌سازی می‌کردم، اما اغلب در روز مرخصی خیلی خسته بودم که نمی‌توانستم کاری انجام"}, {"source": "Business Insider", "title": "I've flown business class on dozens of airlines. My favorite premium cabin is on this lesser-known Asian carrier.", "link": "https://www.businessinsider.com/why-starlux-asian-carrier-is-my-favorite-business-class-review-2026-10", "summary": "I m a frequent business-class flyer. This is why a boutique Asian airline is my favorite premium experience. Zach Benitez I flew on a \"boutique\" Taiwanese airline called Starlux, and it blew me away. The seat was like a private pod, and the food was some of the best I've ever had. The crew seemed rushed during boarding, but were impeccable inflight. I'm a regular business-class traveler, having flown on dozens of airlines and hundreds of thousands of miles over the years. I often get asked the same question: What's the best business-class seat you've ever flown in? It's not the usual fan favorites of Singapore Airlines or Emirates. It's Starlux Airlines, a Taiwanese carrier many Americans have never heard of. Starlux first flew in January 2020 and bills itself as a \"boutique\" international airline that operates nonstop flights from Taipei to several US cities, including Los Angeles, San Francisco, and Seattle. My flight was on an Airbus A350-900 from Taipei to San Francisco, a nearly 12-hour overnight flight. It was the second leg of a trip that started in Kuala Lumpur, and the entire itinerary cost 85,000 Alaska Airlines miles. The Starlux business class seat. Zach Benitez The cash fare on this route ranges from $2,600 to over $5,000, depending on the season, so the points redemption — Alaska is a Starlux partner — was a very good deal. And the experience blew me away. The whole idea from the beginning was to build a luxury airline from nothing with meticulous attention to detail and an emphasis on the small stuff. After flying Starlux , those minor details made all the difference. Here's what my flight was like and why I'd easily book again. The seat felt like a private suite Every seat in Starlux's business class opens straight into the aisle, and every one has a sliding door. The cabin is decorated with faux marble finishes and shiny black panels. It honestly looks more like a boutique hotel lobby than the inside a plane. One of the cubbies stored a remote and headphones. Zach Benitez This extreme attention to detail is what sold me most. My favorite example: there's a little gap under the storage cabinet door, so you can leave a charging cable running out of it with the door closed. Exploring the seat illuminated several thoughtful design choices. The pod felt deliberate in a way some brand-new airline seats just aren't. Some people call business class doors a gimmick, mostly because they don't go all the way up. I loved mine anyway. Once the seat was", "date_str": "2026-10-16T10:15:01+00:00", "hash": "c7e52197b6ecc58c", "title_fa": "من در کلاس های تجاری در ده ها خط هوایی پرواز کرده ام. کابین ممتاز مورد علاقه من در این هواپیمای کمتر شناخته شده آسیایی است.", "summary_fa": "من یک مسافر مکرر در کلاس تجاری هستم. به همین دلیل است که یک خط هوایی بوتیک آسیایی تجربه ممتاز مورد علاقه من است. زک بنیتز من با یک خط هوایی تایوانی \"بوتیک\" به نام استارلوکس پرواز کردم، و آن مرا غافلگیر کرد. صندلی مانند یک غلاف خصوصی بود و غذا یکی از بهترین غذاهایی بود که تا به حال خورده ام. به نظر می رسید خدمه هنگام سوار شدن عجله داشتند، اما در هنگام پرواز بی عیب و نقص بودند. من یک مسافر معمولی در کلاس تجاری هستم که در طول سال ها با ده ها خط هوایی و صدها هزار مایل پرواز کرده ام. اغلب از من سؤال مشابهی پرسیده می شود: بهترین صندلی بیزینس کلاسی که تا به حال در آن پرواز کرده اید چیست؟ این مورد علاقه معمول هواداران خطوط هوایی سنگاپور یا امارات نیست. این شرکت هواپیمایی Starlux است، یک شرکت هواپیمایی تایوانی که بسیاری از آمریکایی‌ها هرگز نام آن را نشنیده‌اند. استارلوکس برای اولین بار در ژانویه 2020 پرواز کرد و خود را به عنوان یک شرکت هواپیمایی بین المللی \"بوتیک\" معرفی کرد که پروازهای بدون توقف از تایپه به چندین شهر ایالات متحده از جمله لس آنجلس، سانفرانسیسکو و سیاتل انجام می دهد. پرواز من با یک ایرباس A350-900 از تایپه به سانفرانسیسکو بود، یک پرواز شبانه نزدیک به 12 ساعت. این مرحله دوم سفری بود که از کوالالامپور شروع شد و کل برنامه سفر 85000 مایل خطوط هوایی آلاسکا هزینه داشت. صندلی کلاس تجاری Starlux. زک بنیتز کرایه نقدی در این مسیر بسته به فصل از 2600 دلار تا بیش از 5000 دلار متغیر است، بنابراین بازخرید امتیاز - آلاسکا شریک Starlux است - معامله بسیار خوبی بود. و این تجربه مرا غافلگیر کرد. کل ایده از ابتدا این بود که یک خط هوایی لوکس از هیچ با توجه دقیق به جزئیات"}, {"source": "Business Insider", "title": "Influencer marketers are leaning into FOMO to cut through the noise", "link": "https://www.businessinsider.com/influencer-marketings-new-trend-events-fomo-2026-10", "summary": "Substacker Erika Veurink hosted a pop-up vintage sale for her readers at Rothy s. Courtesy of Rothy s A version of this post appears in the CMO Insider: Creator Brief newsletter. Sign up for Business Insider's marketing newsletter . The latest hot marketing KPI: RSVPs. Creators ranging from Substackers to \"SNL\" stars are jumping off the screen to in-person events — and marketers can't get enough. \"IRL is the No. 1 brand equity builder of all the channels,\" said Justin Thomas-Copeland, CEO of the American Association of Advertising Agencies (4As). As it becomes harder to reach customers online, in-person events offer a way for brands to connect with their biggest fans — and hopefully inspire a flurry of social content. One night last month, Snapple turned a decommissioned Staten Island Ferry into a floating comedy club featuring Colin Jost and Pete Davidson. Lindsay Burstein , a top marketer at Snapple parent Keurig Dr Pepper, said the night resulted in about 200 pieces of user-generated content. \"It is the buzziest thing that the brand has done in a very long time,\" she said. Snapple threw a Snapple Island Ferry event with comedians Colin Jost and Pete Davidson. Snapple Events aren't a new phenomenon, but interest from marketers is surging. In its annual survey of marketers, Linqia found that 53% said they planned to work with influencers on events in 2026, up from 34% in 2025. \"We've seen an uptick in both custom brand pop-up experiences and brand activation at large events,\" Linqia's chief strategy officer Keith Bendes said. Influencer marketers are becoming event planners IRL activations and events can also help brands gauge the depth of a creator's connection with their audience — and how valuable partnering with them might prove. Substack creators, for instance, have \"rabid fans and followers\" who are hungry to connect in person, said Rothy's VP Anna Doré. After Substacker Erika Veurink's article for New York Magazine featuring Rothy's shoes went viral, Rothy's struck a partnership with the writer that included a vintage pop-up experience at a Rothy's in New York City. The Rothy's pop-up drew over 200 people and grew the store's foot traffic by 75% that day. There can be category-specific reasons some brands are going all in on events. Flushable wipes maker Goodwipes, for one, leans on IRL experiences, said SVP of marketing Meredith Diehn, \"partially because it's an intimate category, but there's a lot of questions around flushability and why should I", "date_str": "2026-10-16T10:00:03+00:00", "hash": "b7efff8dcab2d9a3", "title_fa": "بازاریابان اینفلوئنسر برای کاهش سر و صدا به FOMO متمایل شده اند", "summary_fa": "Substacker Erika Veurink میزبان فروش پاپ آپ وینتج برای خوانندگانش در Rothy s. با حسن نیت از Rothy s نسخه ای از این پست در خبرنامه CMO Insider: Creator Brief ظاهر می شود. برای خبرنامه بازاریابی Business Insider ثبت نام کنید. آخرین KPI بازاریابی داغ: RSVPs. سازندگان از Substackers گرفته تا ستاره های \"SNL\" در حال پرش از روی صفحه به رویدادهای حضوری هستند - و بازاریابان نمی توانند به اندازه کافی دریافت کنند. \"IRL شماره است. جاستین توماس کوپلند، مدیر عامل انجمن آژانس های تبلیغاتی آمریکا (4As) گفت: 1 سازنده ارزش ویژه برند در همه کانال ها. از آنجایی که دسترسی به مشتریان آنلاین دشوارتر می شود، رویدادهای حضوری راهی را برای برندها ارائه می دهد تا با بزرگترین طرفداران خود ارتباط برقرار کنند - و امیدواریم الهام بخش انبوهی از محتوای اجتماعی باشد. یک شب، Snappry Island به یک ایالت تبدیل شد. با حضور کالین جوست و پیت دیویدسون. لیندسی برستاین، یکی از بازاریاب‌های برتر در شرکت Snapple، Keurig Dr Pepper، گفت که این شب منجر به تولید حدود 200 محتوای تولید شده توسط کاربر شد. او گفت: \"این پرهیاهوترین کاری است که این برند در مدت زمان طولانی انجام داده است.\" Snapple یک رویداد Snapple Island Ferry با کمدین های کالین جوست و پیت دیویدسون برگزار کرد. رویدادهای Snapple پدیده جدیدی نیست، اما علاقه بازاریابان در حال افزایش است. Linqia در نظرسنجی سالانه خود از بازاریابان دریافت که 53٪ گفتند که قصد دارند با اینفلوئنسرها در رویدادهای سال 2026 کار کنند، در حالی که این رقم در سال 2025 34٪ بود. کیت بندز، مدیر ارشد استراتژی Linqia گفت: \"ما شاهد افزایش تجربه های پاپ آپ برند سفارشی و فعال سازی برند در رویدادهای بزرگ بوده ایم.\" بازاریابان اینفلوئنسر در حال تبدیل شدن به برنامه‌ریزان رویداد هستند. فعال‌سازی‌ها و رویدادهای IRL همچنین می‌توانند به برندها کمک کنند تا"}, {"source": "Business Insider", "title": "The scariest thing about Elizabeth Holmes' new documentary is how much I wanted to believe her", "link": "https://www.businessinsider.com/nathan-fielder-elizabeth-holmes-documentary-you-can-see-everything-review-2026-10", "summary": "Elizabeth Holmes in You Can See Everything. A24 A24's new documentary about Elizabeth Holmes, \"You Can See Everything,\" is in theaters now. Directed by Nathan Fielder and Lance Oppenheim, it's more character study than straightforward doc. The story about the downfall of Theranos has been told — but this one hasn't yet. Elizabeth Holmes famously does not blink, whether she's pitching investors or, by her own admission, flirting with a guy. Is her moony gaze haunting or hypnotic? A calculated act or proof of her naivete? At various points in A24's new documentary, \"You Can See Everything,\" I vacillated between each of the above. A good portion of Nathan Fielder and Lance Oppenheim's movie could be classified as a provocative staring contest, as Fielder probes Holmes about her life and the demise of her company, Theranos , in the weeks before she reported to prison to serve an 11-year sentence in May 2023. The answers he gets from Holmes are rarely satisfactory. (At one point, she insists she's never told a lie in her entire adult life; despite being convicted of fraud, she maintains her innocence throughout the film.) But with the camera zoomed in tight on Holmes' every micro-expression and clump of mascara, the movie's power is in the questions it raises in the space between her words. In these profoundly uncanny scenes, I found myself fluctuating between being freaked out by the lack of emotion in Holmes' vacuous gaze and, to my surprise, pitying her. Then I'd quickly shift back to being freaked out, because what if pity was exactly the reaction that Holmes — a talented, convicted fraudster — was angling for? If she could manipulate her voice to sound more authoritative in the workplace, she could certainly adapt her face to appear more sympathetic onscreen. It turns out that just because you can see everything, that doesn't mean you know anything. At least not for sure. 'You Can See Everything' is not the movie it appears to be Nathan Fielder and Elizabeth Holmes in You Can See Everything. A24 Much like its subject, \"You Can See Everything\" is a slippery mind-trick of a film — part character study, part psychological thriller, part surrealist thought experiment. What it is not, despite its subject, is a movie about a tech company. The story of how Holmes went from being named the youngest self-made female billionaire by Forbes to being convicted of defrauding investors as the founder and CEO of the blood-testing startup Theranos is well documented. Holme", "date_str": "2026-10-16T10:00:02+00:00", "hash": "6bb0a04e41b2861c", "title_fa": "ترسناک ترین چیز در مورد مستند جدید الیزابت هلمز این است که چقدر می خواستم او را باور کنم", "summary_fa": "الیزابت هلمز در تو می توانی همه چیز را ببینی. مستند جدید A24 A24 درباره الیزابت هولمز، \"شما می توانید همه چیز را ببینید\" اکنون در سینماها اکران می شود. این فیلم که توسط ناتان فیلدر و لنس اوپنهایم کارگردانی شده است، بیشتر مطالعه شخصیت است تا یک مستند ساده. داستان سقوط Theranos گفته شده است - اما این داستان هنوز گفته نشده است. الیزابت هولمز معروف است که پلک نمی‌زند، خواه سرمایه‌گذاران را جذب کند یا به اعتراف خودش، با یک پسر معاشقه کند. آیا نگاه مهتابی او ترسناک است یا هیپنوتیزم؟ یک عمل حساب شده یا اثبات ساده لوحی او؟ در بخش‌های مختلف مستند جدید A24، «شما می‌توانید همه چیز را ببینید»، من بین هر یک از موارد بالا متزلزل شدم. بخش خوبی از فیلم ناتان فیلدر و لنس اوپنهایم را می توان به عنوان یک مسابقه خیره تحریک آمیز طبقه بندی کرد، زیرا فیلدر در مورد زندگی هولمز و مرگ شرکتش، ترانوس، در هفته های قبل از گزارش او به زندان برای اجرای حکم 11 ساله در ماه مه 2023 تحقیق می کند. پاسخ هایی که هولمز دریافت می کند بسیار نادر است. (در یک نقطه، او اصرار دارد که در تمام زندگی بزرگسالی خود هرگز دروغ نگفته است؛ با وجود محکوم شدن به تقلب، او در طول فیلم بیگناه خود را حفظ می کند.) اما با زوم دوربین روی هر بیان ریز و توده ریمل هولمز، قدرت فیلم در سوالاتی است که در فاصله بین کلمات او ایجاد می کند. در این صحنه‌های عمیقاً غیرعادی، متوجه شدم که بین ترسیده شدن از فقدان احساسات در نگاه خالی هولمز و در کمال تعجب، ترحم برای او در نوسان بودم. سپس به سرعت به حالت عصبانی شدن برمی‌گشتم، زیرا اگر ترحم دقیقاً همان واکنشی باشد که هولمز - یک کلاهبردار با استعداد و محکوم - به دنبال آن"}, {"source": "Business Insider", "title": "What to buy from Brooklinen's Friends & Family Sale: An unfiltered review of the internet-famous sheets and pillows", "link": "https://www.businessinsider.com/guides/home/brooklinen-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Brooklinen is one of our favorite brands for bedding and bath. These are the top items we ve tested. Kinsley Searles/Business Insider; Shannon Ullman/Business Insider We’ve spent years putting virtually every core bedding and bath product from Brooklinen through its paces. You'll recognize their top performers across our roundup guides for the best sheets , best pillow , favorite comforter , and best towels , but this list goes beyond just the highlights. Below, our team shares our candid, unfiltered thoughts on almost everything Brooklinen makes: the absolute favorites, the slight nitpicks, and the honest truth on which items stayed on rotation long after testing ended. We also break down the differences from its core categories to help you find your dreamiest bed. Brooklinen Friends Family Sale top deals Save 20% off everything to restock your bed. Also find special promos to save up to 50% through October 26. Dreamweave Waffle Bath Towel Bundle : $154 $77 (Save 50% ) Woven Checkerboard Duvet Set : $358 $172 (Save 50%) Luxe Sateen Hardcore Sheet Bundle: $477 $305 (36% off) Our top 3 Brooklinen essentials More on Brooklinen Founded in 2014, Brooklinen makes bedding staples like sheets and pillows, as well as home and bath products such as candles and towels. It's probably best known for its sheet sets, with options from classic cotton to luxurious cashmere. The color palette spans quite neutral, but Brooklinen introduces seasonal colors and prints throughout the year, and occasionally partners with artists and other brands. Most Brooklinen products have a 365-day guarantee, so you can try out an item and send it back if it isn't for you. The yearlong trial period is generous, especially considering that washed and used items can be returned for a full refund, minus a $9.95 return fee. Brooklinen's core products, like their sheets, quilts, and towels, all also have an additional yearlong warranty for defective items after the initial 365-day trial period. Pillows and comforters Brooklinen's bedding foundations are available in both down and down-alternative options. They're both offered in comparable densities and warmth ratings, but ultimately come down to your material preferences. Down Down Alternative Fill Material DownMark-certified, ethically sourced down feather blend Recycled microgel polyester fiberfill Feel Loft Weightless, airy, and ultra-fluffy with tr", "date_str": "2026-10-16T10:00:01+00:00", "hash": "acbbbb3e89b0af5b", "title_fa": "چه چیزی از Brookline's Friends & Family Sale بخریم: بررسی بدون فیلتر ملحفه ها و بالش های معروف اینترنتی", "summary_fa": "این روشویی در سه اندازه و وزن مختلف ارائه می شود، بنابراین برای هر کسی مناسب است."}, {"source": "Business Insider", "title": "$17 billion hedge fund Walleye is beefing up its stock-picking unit despite losing a key executive to Citadel", "link": "https://www.businessinsider.com/walleye-hires-new-executives-portfolio-managers-after-giannini-citadel-exit-2026-10", "summary": "Walleye Capital is named after the freshwater fish native to Minnesota, the firm s original headquarters. Dennis Anderson/Star Tribune via Getty Images Walleye has brought on a pair of executives in recent weeks from Balyasny and Millennium. The firm recently lost Matt Giannini, a big-time hire for the $17 billion fund, who returned to Citadel. The manager's stock-picking business has been growing, internally and externally. Walleye Capital isn't letting the recent departure of a key executive derail the expansion of its stock-picking unit. The $17 billion asset manager has hired a pair of executives this month to support its equity long-short division, after Matt Giannini left to return to Ken Griffin's Citadel in September. Giannini had been the chief operating officer of the unit, a significant addition to the firm, before departing after less than a year in the role. Walleye has hired Jordan Tanner, Balyasny Asset Management's chief equities strategist, and Anna Dev, a Millennium Management recruiter, a person close to the firm told Business Insider. The hope is that the two hires will help keep growing the head count and risk-taking capacity for the stock-picking unit, which is run by Anil Gondi, a former Balyasny portfolio manager who previously worked with Tanner. Tanner will work across the firm's fundamental stock-picking, volatility, and central strategies teams. He will be tasked with using artificial intelligence and other technologies to increase collaboration among the different teams, the person said. Dev, meanwhile, will focus on recruiting investing talent across the firm and evaluating external investment opportunities. The pair will both begin at New York-based Walleye in mid-2027. Walleye, which gets its name from the freshwater fish native to Minnesota, the firm's original headquarters, declined to comment. External investments are a priority for Walleye. In 2026 alone, the firm's long-short equity division has added 14 external managers, a person close to the firm said. There are three other external stock-picking firms that Walleye is planning to back that have yet to launch, the person close to the manager said. The expansion this year nearly doubles the firm's roster of external stock-picking funds; Walleye started the year with investments in 18 equity long-short funds operating outside the firm's walls, the person said. Half of the equity long-short's market exposure is now run by outside funds, the person said. Spin-outs by form", "date_str": "2026-10-16T09:57:01+00:00", "hash": "81783a06095da326", "title_fa": "صندوق سرمایه گذاری 17 میلیارد دلاری Walleye در حال تقویت واحد جمع آوری سهام خود با وجود از دست دادن یک مدیر اجرایی کلیدی در Citadel است.", "summary_fa": "Walleye Capital از نام ماهی آب شیرین بومی مینه سوتا، مقر اصلی شرکت، گرفته شده است. دنیس اندرسون/ استار تریبون از طریق Getty Images Walleye در هفته‌های اخیر یک جفت مدیر از Balyasny و Millennium را استخدام کرده است. این شرکت اخیراً مت جیانینی را از دست داد، یکی از استخدام کنندگان بزرگ صندوق 17 میلیارد دلاری، که به سیتادل بازگشت. کسب و کار انتخاب سهام مدیر در داخل و خارج رشد کرده است. Walleye Capital اجازه نمی دهد که جدایی اخیر یک مدیر اجرایی کلیدی، گسترش واحد جمع آوری سهام خود را از مسیر خارج کند. مدیر دارایی 17 میلیارد دلاری، پس از اینکه مت جیانینی در ماه سپتامبر برای بازگشت به سیتادل کن گریفین در ماه سپتامبر رفت، یک جفت مدیر را برای حمایت از بخش لانگ-شورت سهام خود استخدام کرد. جیانینی قبل از اینکه پس از کمتر از یک سال از این سمت جدا شود، مدیر عملیات واحد بود که یکی از اعضای مهم شرکت بود. یکی از افراد نزدیک به شرکت به Business Insider گفت که Walleye جردن تانر، استراتژیست ارشد سهام شرکت Balyasny Asset Management و Anna Dev، استخدام کننده مدیریت هزاره را استخدام کرده است. امید این است که این دو استخدام به افزایش تعداد کارمندان و ظرفیت ریسک پذیری واحد جمع آوری سهام که توسط آنیل گوندی، مدیر سابق پورتفولیوی Balyasny که قبلا با Tanner کار می کرد، کمک کند. Tanner در بین تیم‌های اصلی انتخاب سهام، نوسانات و استراتژی‌های مرکزی شرکت کار خواهد کرد. این فرد گفت که او وظیفه استفاده از هوش مصنوعی و سایر فناوری ها را برای افزایش همکاری بین تیم های مختلف خواهد داشت. در همین حال، Dev بر جذب استعدادهای سرمایه گذاری در سراسر شرکت و ارزیابی فرصت های سرمایه گذاری خارجی تمرکز خواهد کرد. این جفت هر دو در Walleye مستقر در نیویورک در اواسط سال"}, {"source": "Business Insider", "title": "The AI trade may be giving investors somewhere new to hide", "link": "https://www.businessinsider.com/ai-selloff-treasury-bonds-hedge-stock-market-risk-for-investors-2026-10", "summary": "Michael Nagle/Bloomberg via Getty Images Treasurys played shock absorber when tech investors got the jitters, at least for a day. Even if Treasurys become a reliable escape hatch, debt-heavy AI companies still have plenty to worry about. Sign up for First Trade , Business Insider's daily markets newsletter. For much of 2026, a rough stretch in the stock market has been a double whammy . Investors have had to contend not only with stock losses, but bonds selling off, too. The dynamic upended the safety trade of rotating out of stocks and into Treasurys. It's hard to diversify when there's nowhere to hide. Why the break from tradition? Because inflation, federal deficits , oil , and the enormous financing needs of the AI buildout have all given bond investors reason to demand higher yields . At the same time, strong profit-growth projections for the stock market's top AI leaders have kept major indexes near record highs. But Thursday's decline in chipmakers — perhaps the most sensitive area of the AI trade — didn't follow the risk-off playbook that's defined 2026 so far. With chipmakers on pace for their worst week in three months, a 1% decline came alongside a 10-basis-point drop in the 10-year Treasury yield. At least for one day, investors rekindled the Treasury safety trade. That raises a potentially consequential question: Is the market finally getting its old shock absorber back? One day does not make a trend. But it's enough to make bond investors dream. Fear finally outran inflation Thursday presented investors with two competing reasons to move yields: hot producer-price inflation data on one side, and a rout in AI-spending-exposed stocks on the other. For much of the year, inflation and fiscal worries have won that tug-of-war. But this time, the flight to safety did. One notable driver of weakness in chipmakers was the latest financial release from AI giant Anthropic . Social media was immediately ablaze on Wednesday evening with naysayers repeating a common refrain: \" It's over .\" Their case is that Anthropic's financials, while objectively strong, still suggest a growth slowdown that could ripple through the global AI buildout. Chipmakers, ever the lightning rod of the AI trade , were of course hit hardest. The trade has been spooked by similar events many times before, and most have been mere blips on the radar. But if these Anthropic nerves spread, investors would be well served to use Treasurys as an escape valve. An important distinction Just", "date_str": "2026-10-16T09:50:01+00:00", "hash": "978c6de4386a4ee4", "title_fa": "تجارت هوش مصنوعی ممکن است به سرمایه گذاران جایی جدید برای پنهان کردن بدهد", "summary_fa": "مایکل ناگل/ بلومبرگ از طریق Getty Images وقتی سرمایه‌گذاران فناوری دست‌کم برای یک روز دچار اضطراب شدند، خزانه‌داری یک ضربه‌گیر انجام داد. حتی اگر خزانه داری به یک دریچه فرار قابل اعتماد تبدیل شود، شرکت های دارای بدهی سنگین هوش مصنوعی هنوز جای نگرانی زیادی دارند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. در بیشتر سال 2026، کشش خشن در بازار سهام یک ضربه مضاعف بوده است. سرمایه گذاران نه تنها با از دست دادن سهام، بلکه با فروش اوراق قرضه نیز دست و پنجه نرم می کردند. پویایی تجارت ایمنی چرخش خارج از سهام و به خزانه داری را تغییر داد. وقتی جایی برای پنهان شدن وجود ندارد، تنوع بخشیدن به آن سخت است. چرا سنت شکنی؟ از آنجا که تورم، کسری بودجه فدرال، نفت و نیازهای مالی عظیم حاصل از ایجاد هوش مصنوعی، همگی به سرمایه گذاران اوراق قرضه دلیلی برای تقاضای بازدهی بالاتر داده است. در عین حال، پیش‌بینی‌های قوی رشد سود برای رهبران برتر هوش مصنوعی بازار سهام، شاخص‌های اصلی را در نزدیکی بالاترین رکورد نگه داشته است. اما کاهش روز پنجشنبه در تولیدکنندگان تراشه - شاید حساس‌ترین حوزه تجارت هوش مصنوعی - از کتاب بازی ریسکی که تا کنون در سال 2026 تعریف شده بود، پیروی نکرد. با سرعت تولید تراشه‌سازان در بدترین هفته خود در سه ماه گذشته، کاهش 1 درصدی همراه با افت 10 واحدی بازدهی 10 ساله خزانه‌داری همراه بود. حداقل برای یک روز، سرمایه گذاران تجارت ایمنی خزانه داری را احیا کردند. این یک سوال بالقوه پیامد را ایجاد می کند: آیا بازار بالاخره کمک فنر قدیمی خود را پس می گیرد؟ یک روز روندی ایجاد نمی کند. اما این کافی است تا سرمایه گذاران اوراق قرضه رویاپردازی کنند. در نهایت ترس از تورم فراتر رفت در روز پنجشنبه دو دلیل رقابتی برای تغییر بازدهی به سرمایه‌گذاران"}, {"source": "Business Insider", "title": "Why Hightower's top investment strategist is sticking with stocks even as high treasury yields beckon", "link": "https://www.businessinsider.com/hightower-stephanie-link-stocks-treasury-yields-rise-2026-10", "summary": "Stephanie Link, chief investment strategist at Hightower. Hightower Stephanie Link is a \"glass half full\" investor, and she sees more good times ahead. Consumer spending has been the backbone of a bruised but still-growing economy. She gave some ideas on how to invest in optimism, and when investors might run to bonds. As the 10-year Treasury yields inch toward a 6% coupon, it begins to raise the question of when investors may consider switching their equity allocations to fixed income. After a long period of dominance by stocks, some investors may look at that 6% yield as a sign that it's time to switch things up and invest more heavily in fixed-income, said Stephanie Link, chief investment strategist for $350 billion wealth manager Hightower. A record $166 billion was poured into money market funds last week, showing that investors are already taking advantage of rising bond yields and lower prices. As of Thursday morning, yields started fallin \"There used to be no alternative to stocks,\" Link told Business Insider. \"Now you have a little bit of competition, which is healthy and positive from a diversification point of view.\" But Link, a \"glass half full\" type of investor, still thinks equities have room to run and is where investors will win long-term. A guaranteed 6% or more coupon is still much lower than the S P 500's inflation-adjusted 7.7% annual average and won't keep pace if inflation continues to rise. It's been a chaotic year for the markets, but the bottom has still not fallen out. \"You go back in January, we had Venezuela, we had SCOTUS overturning tariffs, we had private credit concerns, AI apocalypse, and yet the market continues to kind of grind higher,\" Link said. Those returns were \"not as easy\" as they'd been over the previous three years, but when the Atlanta Fed Tracker still projects growth above expectations, she sees optimism continuing to pay off. \"No one would have ever thought that in the face of all the gloom and doom,\" Link said. \"Negativity sells. Positivity is boring.\" US consumers are still spending The main thing buoying her positivity is strong consumer spending. People still have jobs, with initial non-farm jobless claims last week at their lowest since 1969. Spending continues apace , and while a divide remains between high earners and everyone else, Link sees signs that the K-shaped economy may be narrowing, with wage growth recently stronger among lower earners. \"It's always been a bad, bad move to bet against the US ", "date_str": "2026-10-16T09:49:01+00:00", "hash": "d11d1712c9181b56", "title_fa": "چرا استراتژیست ارشد سرمایه گذاری هایتاور با وجود بازدهی بالای خزانه داری به سهام پایبند است", "summary_fa": "استفانی لینک، استراتژیست ارشد سرمایه گذاری در هایتاور. Hightower Stephanie Link یک سرمایه گذار \"نیمه پر لیوان\" است و روزهای خوب بیشتری را در پیش دارد. مخارج مصرف کننده ستون فقرات یک اقتصاد آسیب دیده اما همچنان در حال رشد بوده است. او ایده هایی در مورد چگونگی سرمایه گذاری در خوش بینی و زمانی که سرمایه گذاران ممکن است به سمت اوراق قرضه بروند، ارائه کرد. از آنجایی که خزانه داری 10 ساله بازدهی اینچ به سمت کوپن 6 درصدی می کند، این سوال مطرح می شود که چه زمانی سرمایه گذاران ممکن است تخصیص سهام خود را به درآمد ثابت تغییر دهند. استفانی لینک، استراتژیست ارشد سرمایه گذاری برای هایتاور، مدیر ثروت 350 میلیارد دلاری، گفت: پس از یک دوره طولانی تسلط سهام، برخی از سرمایه گذاران ممکن است به سود 6 درصدی به عنوان نشانه ای از زمان تغییر اوضاع و سرمایه گذاری سنگین تر در درآمد ثابت نگاه کنند. رکورد 166 میلیارد دلار در هفته گذشته به صندوق های بازار پول سرازیر شد که نشان می دهد سرمایه گذاران در حال حاضر از افزایش بازده اوراق قرضه و کاهش قیمت ها استفاده می کنند. لینک به Business Insider گفت: از صبح پنجشنبه، بازده شروع به کاهش کرد: «در گذشته هیچ جایگزینی برای سهام وجود نداشت. اکنون شما کمی رقابت دارید که از نظر تنوع، سالم و مثبت است.» اما لینک، یک نوع سرمایه‌گذار «نیمه پر لیوان»، همچنان فکر می‌کند که سهام فضایی برای اجرا دارند و جایی است که سرمایه‌گذاران در بلندمدت برنده خواهند شد. کوپن تضمین شده 6% یا بیشتر همچنان بسیار کمتر از میانگین سالانه 7.7% تنظیم شده با تورم S P 500 است و اگر تورم همچنان به افزایش خود ادامه دهد، سرعت آن را حفظ نخواهد کرد. سالی پر از هرج و مرج برای بازارها بوده است، اما پایین هنوز سقوط نکرده"}, {"source": "Business Insider", "title": "IBM talent exec says it's better to be a specialist, not a generalist, in the AI era", "link": "https://www.businessinsider.com/ibm-chief-talent-officer-specialist-generalist-ai-era-2026-10", "summary": "Aparna Nair said that the world of generalists is long gone. : Lindsey Nicholson/UCG/Universal Images Group via Getty Images \"The world of generalists is long gone,\" said IBM's chief talent, leadership, and culture officer. Aparna Nair said IBM's clients aren't expecting general advice; they're looking for deep expertise. She said even if workers wear many hats, they still need extensive knowledge about their specialty. It's a hotly debated question: Is it better to be an expert or a generalist in the AI era? For Aparna Nair, IBM's chief talent, leadership, and culture officer, there's no debate. She said she doesn't think generalists alone \"will cut it\" in the workforce in the AI era. \"The world of generalists is long gone,\" Nair said. Aparna Nair is IBM s chief talent, leadership, and culture officer. IBM Nair said that generalists may be able to rely on AI to learn a lot, but at IBM, for example, the company's clients aren't expecting general advice from its workforce. IBM is hired for its deep technological expertise, she said. Nair said the same is true for entry-level hires. IBM, which has committed to doubling down on junior talent , expects new workers to arrive with the skills — and domain expertise — to take on more complex work earlier in their careers, Nair said. She said workers should identify an area that aligns with their employer's needs, become an expert in it, and \"go deep.\" That expectation remains even as engineering roles are starting to blur with AI. In the past, a software engineer might have spent 20% of their time coding and another 20% testing, Nair said. Now, AI can handle much of the coding work , and engineers need the critical-thinking and judgment skills to evaluate what the technology produces, Nair said. They also have more opportunities to work across the business , such as speaking with clients and marketing teams and bringing what they learn back into the products they're building. While today's engineers may wear many hats and work closely with different teams, they still need deep expertise in their field — and an understanding of how their work shapes the experience of clients and colleagues. Without that added knowledge, Nair said, it would be difficult for them \"to do anything meaningful.\" While domain expertise may be valuable, workers should also remain flexible. Nair said that there's \"nothing more powerful\" than when workers combine deep expertise with the right behaviors, and also use AI to their advantage. \"T", "date_str": "2026-10-16T09:24:01+00:00", "hash": "8d5f956b4fcf6d8b", "title_fa": "مدیر استعدادیابی IBM می‌گوید در عصر هوش مصنوعی بهتر است متخصص باشید، نه یک متخصص", "summary_fa": "آپارنا نیر گفت دنیای کلی گرایان مدت هاست که رفته است. : لیندزی نیکلسون/UCG/گروه یونیورسال تصاویر از طریق گتی ایماژ، مدیر ارشد استعدادها، رهبری و فرهنگ IBM گفت: «دنیای عمومی ها مدت هاست که از بین رفته است. آپارنا نیر گفت که مشتریان IBM انتظار مشاوره عمومی را ندارند. آنها به دنبال تخصص عمیق هستند. او گفت حتی اگر کارگران کلاه های زیادی بپوشند، باز هم به دانش گسترده ای در مورد تخصص خود نیاز دارند. این یک سوال داغ است: آیا در عصر هوش مصنوعی بهتر است متخصص باشید یا عمومی؟ برای آپارنا نیر، مدیر استعداد، رهبری و فرهنگ IBM، هیچ بحثی وجود ندارد. او گفت که فکر نمی‌کند عموم‌گرایان به تنهایی در نیروی کار در عصر هوش مصنوعی این کار را کاهش دهند. نیر گفت: «دنیای کلی گرایان مدت هاست که از بین رفته است. آپارنا نیر مدیر استعداد، رهبری و فرهنگ IBM است. IBM Nair گفت که ممکن است متخصصان عمومی بتوانند برای یادگیری چیزهای زیادی به هوش مصنوعی تکیه کنند، اما برای مثال در IBM، مشتریان این شرکت انتظار مشاوره کلی از نیروی کار خود ندارند. او گفت که IBM برای تخصص عمیق در فناوری خود استخدام شده است. نیر گفت که همین امر در مورد استخدام های سطح ابتدایی نیز صادق است. نیر گفت که IBM که متعهد به دو برابر کردن استعدادهای جوان است، انتظار دارد کارگران جدیدی با مهارت ها - و تخصص در حوزه - وارد شوند تا کارهای پیچیده تری را در اوایل حرفه خود انجام دهند. او گفت که کارگران باید حوزه‌ای را شناسایی کنند که با نیازهای کارفرمایشان همسو باشد، در آن متخصص شوند و «عمق کنند». حتی زمانی که نقش‌های مهندسی با هوش مصنوعی کم‌کم می‌شوند، این انتظار باقی می‌ماند. نیر گفت: در گذشته، یک مهندس نرم افزار ممکن است 20 درصد از زمان خود را صرف کدنویسی"}, {"source": "Business Insider", "title": "Rates will keep going up for one major reason related to the AI boom, a top economist says", "link": "https://www.businessinsider.com/why-interest-rates-are-rising-ai-infrastructure-bond-yields-2026-10", "summary": "Jay Janner/The Austin American-Statesman via Getty Images Apollo economist Torsten Sløk says interest rates are likely going to keep going up. In his view, the upward pressure is a function of the AI buildout. \"The AI spending boom is not sensitive to interest rates,\" he said. Torsten Sløk says the path forward for interest rates is up, and you can thank AI companies that are largely insulated from the surge in borrowing costs. The chief economist at Apollo Global Management said on Thursday that interest rates aren't likely to come down while AI capex continues to boom. That's because AI returns are still expected to be greater than the fed funds rate. \"The implication for investors is that upward pressure on rates persists until either the Fed raises rates above expected AI returns, or expected AI returns fall below the Fed funds rate,\" Sløk wrote in a blog post on Thursday. Sløk noted that long-term borrowing costs have increased over the past year, with 10-year treasury yields up by about 125 basis points. However, Wall Street analysts have only continued to increase their capex views for 2027. In Sløk's view, Wall Street is convinced that the payoff from the buildout of AI data centers, chips, and infrastructure will justify the monumental capex figures , and Big Tech's borrowing spree is wholly undeterred by rising rates. \"The reason is that many AI investors expect AI investments to return more than 10%, well above the 4% Fed funds rate,\" he added. \"With borrowing costs far below expected returns, the AI spending boom is not sensitive to interest rates, and tighter policy is losing its bite on the economy.\" Sløk recently speculated that interest rates could potentially hit their peak in the next month, primarily due to an improving outlook for the oil market. And while he maintains that the prospect of a peace deal in the Middle East could serve to temporarily ease inflation fears as Treasury yields fall, he still doesn't see that solving the bigger problem brewing in the bond market . \"The fundamental direction of travel for rates remains higher, especially with ongoing fiscal challenges and heavy Treasury issuance adding to the term premium,\" he stated. \"The bottom line for both public and private markets is that higher for longer continues.\" Read the original article on Business Insider", "date_str": "2026-10-16T09:15:01+00:00", "hash": "486965a5d693f438", "title_fa": "یک اقتصاددان برجسته می گوید که نرخ ها به یک دلیل عمده مربوط به رونق هوش مصنوعی ادامه خواهد یافت", "summary_fa": "جی جنر/ The Austin American-Statesman از طریق Getty Images، اقتصاددان آپولو، تورستن اسلوک، می‌گوید که احتمالاً نرخ‌های بهره به افزایش خود ادامه خواهند داد. به نظر او، فشار رو به بالا تابعی از ساختار هوش مصنوعی است. او گفت: «رونق هزینه‌های هوش مصنوعی به نرخ بهره حساس نیست. Torsten Sløk می‌گوید مسیر رو به جلو برای نرخ‌های بهره رو به جلو است و می‌توانید از شرکت‌های هوش مصنوعی که تا حد زیادی از افزایش هزینه‌های استقراض در امان هستند تشکر کنید. اقتصاددان ارشد Apollo Global Management روز پنجشنبه گفت که تا زمانی که سرمایه هوش مصنوعی به رشد خود ادامه می دهد، احتمال کاهش نرخ بهره وجود ندارد. به این دلیل که انتظار می رود بازدهی هوش مصنوعی بیشتر از نرخ وجوه فدرال باشد. اسلوک در پست وبلاگی روز پنجشنبه خود نوشت: «مفهوم برای سرمایه گذاران این است که فشار صعودی روی نرخ ها تا زمانی که فدرال رزرو نرخ ها را بالاتر از بازده مورد انتظار هوش مصنوعی افزایش ندهد، یا بازده مورد انتظار هوش مصنوعی کمتر از نرخ وجوه فدرال رزرو شود، ادامه می یابد. اسلوک خاطرنشان کرد که هزینه های استقراض بلندمدت در سال گذشته افزایش یافته است و بازده خزانه 10 ساله حدود 125 واحد پایه افزایش یافته است. با این حال، تحلیلگران وال استریت تنها به افزایش بازدیدهای سرمایه خود برای سال 2027 ادامه داده اند. از نظر اسلوک، وال استریت متقاعد شده است که سود حاصل از ساخت مراکز داده، تراشه ها و زیرساخت های هوش مصنوعی، ارقام عظیم سرمایه را توجیه می کند و ولگردی و استقراض Big Tech به طور کامل توسط افزایش نرخ ها مهار نمی شود. او افزود: «دلیل این است که بسیاری از سرمایه‌گذاران هوش مصنوعی انتظار دارند سرمایه‌گذاری‌های هوش مصنوعی بیش از 10 درصد بازدهی داشته باشد، بسیار بالاتر از نرخ 4 درصدی وجوه بانک مرکزی. با توجه"}, {"source": "Business Insider", "title": "Photos show how Prince Harry and Prince William's relationship has changed through the years", "link": "https://www.businessinsider.com/prince-harry-william-relationship-photos-2026-10", "summary": "Prince Harry and Prince William sharing an embrace back in 2014. Chris Jackson/Getty Images Prince William and Prince Harry's relationship has been fraught in recent years. The brothers haven't been photographed in the same room since King Charles' coronation in 2023. Photos of the pair show the evolution of their relationship over the years. It's no secret that Prince William and Prince Harry have a complicated relationship. Harry, 42, first confirmed a rift in his relationship with William, 44, in 2019, and their bond only grew more strained in the years that followed as Harry stepped back as a senior royal and began speaking publicly about his and Meghan Markle's issues with the royal family. Still, the brothers didn't always have such a complex relationship, sticking close to each other during their childhoods. Take a look at some photos that show the evolution of William and Harry's relationship. Prince William was publicly photographed with his younger brother for the first time in October 1984. Princess Diana holds a newborn Prince Harry in her arms while Prince William looks on in October 1984. AP Harry was born on September 15, 1984, and though he was photographed for the first time just a day later, he wasn't pictured with his brother, then 2 years old, until the following month. William sat on the floor in front of Princess Diana, who held an infant Harry in her arms. The brothers were photographed with their extended family at Harry s christening in December 1984. PA Images via Getty Images William posed for a few photos at Harry's christening, including a shot with his parents, Queen Elizabeth, and the Queen Mother. In the photo, baby Harry reaches out to touch his big brother. A 1985 photo of the brothers hinted at their bond. Tim Graham Photo Library via Getty Images The brothers seemed to have a close relationship from a young age, as the pair were often side by side in pictures. In this shot, they play the piano together with Diana at Kensington Palace. As the boys got older, they were photographed playing together, as in this 1986 shot. Princess Diana, Prince Harry, and Prince William at Highgrove House in July 1986. Tim Graham Photo Library via Getty Images Cameras captured the brothers playing at Highgrove House , where they lived with Diana and Charles when they were young. William waited at the bottom of a slide as Harry made his way down. The family appeared close-knit in shots shared before Charles and Diana split, such as this 1989", "date_str": "2026-10-16T09:06:02+00:00", "hash": "306941695ae8ae6c", "title_fa": "عکس ها نشان می دهد که چگونه رابطه شاهزاده هری و شاهزاده ویلیام در طول سال ها تغییر کرده است", "summary_fa": "پرنس هری و شاهزاده ویلیام در سال 2014 در آغوش یکدیگر قرار گرفتند. از زمان تاجگذاری پادشاه چارلز در سال 2023، از برادران در یک اتاق عکسی گرفته نشده است. عکس های این جفت سیر تکاملی رابطه آنها را در طول سالها نشان می دهد. بر کسی پوشیده نیست که شاهزاده ویلیام و شاهزاده هری رابطه پیچیده ای دارند. هری، 42 ساله، برای اولین بار در سال 2019 شکاف در رابطه خود با ویلیام، 44 ساله را تایید کرد، و پیوند آنها در سال‌های بعد تیره‌تر شد، زیرا هری به عنوان یک عضو ارشد سلطنتی کنار رفت و علناً در مورد مسائل خود و مگان مارکل با خانواده سلطنتی صحبت کرد. با این حال، برادران همیشه چنین رابطه پیچیده ای نداشتند و در دوران کودکی به یکدیگر نزدیک بودند. به چند عکس که سیر تکاملی رابطه ویلیام و هری را نشان می دهد نگاه کنید. شاهزاده ویلیام برای اولین بار در اکتبر 1984 با برادر کوچکترش در انظار عمومی عکس گرفته شد. پرنسس دایانا یک شاهزاده هری تازه متولد شده را در آغوش خود نگه می دارد در حالی که شاهزاده ویلیام در اکتبر 1984 به او نگاه می کند. AP هری در 15 سپتامبر 1984 به دنیا آمد و اگرچه برای اولین بار فقط یک روز بعد از او عکس گرفته شد، اما پس از 2 سال با برادرش تصویر شد. ویلیام در مقابل پرنسس دایانا که هری شیرخواره را در آغوش گرفته بود روی زمین نشست. این برادران در دسامبر 1984 در مراسم غسل تعمید هری با خانواده بزرگشان عکس گرفتند. تصاویر PA از طریق Getty Images ویلیام در مراسم تعمید هری چند عکس گرفت، از جمله عکسی با والدینش، ملکه الیزابت، و ملکه مادر. در عکس، بچه هری دستش را دراز می کند تا برادر بزرگش را لمس کند. عکسی از برادران در سال 1985 به پیوند"}, {"source": "Business Insider", "title": "I left my 13-year career at Google to work in sustainability. It wasn't an easy choice, but my values had changed.", "link": "https://www.businessinsider.com/quit-leadership-role-google-become-sustainability-consultant-2026-10", "summary": "Bruno Bianchini. Bruno Bianchini Bruno Bianchini quit his job at Google to focus on sustainability in Cambodia and green finance. While still at Google, he pursued a degree at Harvard in sustainable studies. He says leaving Google was a hard decision, but his career shift aligns with his values. This as-told-to essay is based on an interview with Bruno Bianchini, the 40-year-old former Head of Global Partnerships for the Middle East, Africa, and Turkey for Google, who is based in the Netherlands. It has been edited for length and clarity. Growing up in the Italian countryside, sustainability was simply part of everyday life. At 18, I left my small village near Milan to study at Bocconi University in Milan. In 2005, I started my degree in accounting, corporate finance, and law. Then I did a master's in business administration. When I was about to graduate, a friend at the university said a group of professors had opened a boutique consulting firm. I interviewed for the role and landed it. That path led me first to consulting and then to Google, where I spent more than 13 years before leaving to pursue work in sustainability. I started work as a business analyst at the consulting firm in January 2011 At 25, I was working on three projects — a hotel, a food company, and a company that made pressure gauges. My experience was very much about seeing problems through an analytical lens. In 2012, I was invited to a friend's birthday dinner, where I was seated opposite a guy working at Google. Although Google was already a huge company, I had little sense of its scale. I thought of it mainly as a search engine. We stayed in touch, and they eventually asked if I'd be interested in an interview I remember wearing a jacket and tie, and I thought, I can't show up at Google like this; they're never going to hire me. I roughed up my hair, removed my jacket and my tie, and went to the interview. I had three interviews at Google on the same day. One interviewer asked me about role-related knowledge, the next about more general knowledge, and the third was Googleyness — whether I was a culture fit. I remember thinking in the interview that I wanted to work with these people. About a week later, I had a fourth interview. The process moved quickly because it was for a temp job. In July 2012, I joined Google . The Google office in Milan was colorful and playful I remember there was a game area. In consulting, I'd start work at 8:30 a.m. and leave at 10:30 p.m. every day. At Go", "date_str": "2026-10-16T09:05:01+00:00", "hash": "1a305bb4d8c7d0dd", "title_fa": "من حرفه 13 ساله خود را در گوگل ترک کردم تا در زمینه پایداری کار کنم. انتخاب آسانی نبود، اما ارزش های من تغییر کرده بود.", "summary_fa": "برونو بیانچینی. برونو بیانچینی برونو بیانچینی شغل خود را در گوگل رها کرد تا بر پایداری در کامبوج و امور مالی سبز تمرکز کند. زمانی که هنوز در گوگل بود، مدرک خود را در هاروارد در رشته مطالعات پایدار ادامه داد. او می‌گوید ترک گوگل تصمیم سختی بود، اما تغییر شغلش با ارزش‌هایش همسو است. این مقاله گفته شده بر اساس مصاحبه ای با برونو بیانچینی، رئیس سابق مشارکت جهانی برای خاورمیانه، آفریقا و ترکیه برای گوگل، که در هلند مستقر است، 40 ساله است. برای طول و وضوح ویرایش شده است. با بزرگ شدن در حومه ایتالیا، پایداری به سادگی بخشی از زندگی روزمره بود. در 18 سالگی، روستای کوچکم را در نزدیکی میلان ترک کردم تا در دانشگاه بوکونی در میلان تحصیل کنم. در سال 2005 مدرک خود را در رشته حسابداری، امور مالی شرکت و حقوق شروع کردم. سپس فوق لیسانس مدیریت بازرگانی گرفتم. وقتی می خواستم فارغ التحصیل شوم، یکی از دوستان در دانشگاه گفت که گروهی از اساتید یک شرکت مشاوره بوتیک افتتاح کرده اند. من برای این نقش مصاحبه کردم و آن را دریافت کردم. این مسیر من را ابتدا به سمت مشاوره و سپس به Google هدایت کرد، جایی که بیش از 13 سال را قبل از ترک آنجا گذراندم تا کار در زمینه پایداری را دنبال کنم. من در ژانویه 2011 به عنوان یک تحلیلگر تجاری در شرکت مشاوره شروع به کار کردم در 25 سالگی روی سه پروژه کار می کردم - یک هتل، یک شرکت مواد غذایی و شرکتی که گیج های فشار تولید می کرد. تجربه من بسیار در مورد دیدن مشکلات از طریق یک لنز تحلیلی بود. در سال 2012، به شام ​​تولد یکی از دوستانم دعوت شدم، جایی که روبروی مردی که در گوگل کار می کرد، نشسته بودم. اگرچه گوگل قبلاً یک شرکت بزرگ بود، اما"}, {"source": "Business Insider", "title": "Middle-income Americans are feeling the squeeze", "link": "https://www.businessinsider.com/middle-income-americans-are-feeling-the-squeeze-2026-10", "summary": "A Pew Research Center survey found 71% of middle-income earners have cut back on spending on extras, such as eating out. andresr/Getty Images A Pew Research survey found only 47% of middle-income earners could save money in the past year. Lower-income earners are also having a hard time saving and affording necessities. Inflation moving in the wrong direction doesn't help the affordability situation. America's middle earners are feeling the squeeze. A new analysis from the Pew Research Center examines how Americans' finances are faring, an especially salient topic in a midterm season where affordability is very much on the ballot. America's middle earners — those who make between $50,700 and $152,000 after adjusting for their family sizes and the cost of living in their areas — increasingly don't have enough saved for an emergency. Just over half of middle-income Americans say they don't have rainy-day funds that would cover expenses for three months in the event of an emergency. Meanwhile, 47% of middle-income earners — and a measly 24% of lower-income earners — reported being able to save money in the past year. Across all income tiers, the majority of respondents said they had cut back spending on extras like eating out or streaming services . Those dwindling emergency funds and sacrifices might be due to rising costs, which often take a particularly large bite out of lower-earners' wallets. It could be getting worse; inflation is moving in the wrong direction. In September, the consumer price index inflation rate rose from 3.4% to 3.7%, just above the 3.6% forecast. Plus, inflation-adjusted wages have been falling for six months. Today's economy is still more difficult for those at the bottom of the earnings ladder. Fifty-one percent of lower-income respondents said they can pay all of their bills in full in the 2026 survey, down from 56% in 2020. For middle-income respondents, the share dropped from 81% in 2020 to 78% in 2026, while the share of upper-income respondents held steady at 93%. Pew also found 71% of lower-income US adults struggled with at least one kind of basic necessity, like affording medical care or paying their rent or mortgage, in the past year, compared with 39% of middle-income and 13% of upper-income Americans. But the latest survey marks another sign that middle-income earners are increasingly aligning with their lower-earning peers, a dour sign for the health of the middle class. A separate report from the Urban Institute found", "date_str": "2026-10-16T09:00:01+00:00", "hash": "7c3a171c206f88da", "title_fa": "آمریکایی های با درآمد متوسط ​​احساس فشار می کنند", "summary_fa": "نظرسنجی مرکز تحقیقات پیو نشان داد که 71 درصد از افراد با درآمد متوسط ​​از هزینه های اضافی مانند غذا خوردن در بیرون از خانه کم کرده اند. andresr/Getty Images نظرسنجی Pew Research نشان داد که تنها 47 درصد از افراد با درآمد متوسط ​​توانسته اند در سال گذشته پول پس انداز کنند. افراد کم درآمد نیز برای پس انداز و تامین مایحتاج خود با مشکل مواجه هستند. حرکت تورم در جهت اشتباه به وضعیت استطاعت کمکی نمی کند. درآمدهای متوسط ​​آمریکا این فشار را احساس می کنند. یک تحلیل جدید از مرکز تحقیقات پیو به بررسی چگونگی وضعیت مالی آمریکایی‌ها می‌پردازد، موضوعی که به‌ویژه در فصل میان‌دوره‌ای که استطاعت مالی در آن بسیار مورد توجه است. درآمدهای متوسط ​​آمریکا - کسانی که پس از تنظیم اندازه خانواده و هزینه زندگی در منطقه خود بین 50700 تا 152000 دلار درآمد دارند - به طور فزاینده ای پس انداز کافی برای شرایط اضطراری ندارند. بیش از نیمی از آمریکایی‌های با درآمد متوسط ​​می‌گویند که بودجه‌ای برای روزهای بارانی ندارند که بتواند هزینه‌های سه ماهه را در مواقع اضطراری پوشش دهد. در همین حال، 47 درصد از افراد با درآمد متوسط ​​- و تقریباً 24 درصد از افراد کم درآمد - گزارش کردند که در سال گذشته توانسته اند در پول خود پس انداز کنند. در تمام سطوح درآمدی، اکثر پاسخ دهندگان گفتند که هزینه های اضافی مانند غذا خوردن در بیرون از خانه یا خدمات پخش جریانی را کاهش داده اند. این کاهش وجوه اضطراری و قربانی‌ها ممکن است به دلیل افزایش هزینه‌ها باشد، که اغلب باعث می‌شود مقدار زیادی از کیف پول افراد کم‌درآمد را از بین ببرد. ممکن است بدتر شود؛ تورم در مسیر اشتباه حرکت می کند. در ماه سپتامبر، نرخ تورم شاخص قیمت مصرف کننده از 3.4 درصد به 3.7 درصد رسید، درست بالاتر از پیش بینی"}, {"source": "Business Insider", "title": "If you've gotten a raise in the past two years, it's now been nearly all eaten away by inflation", "link": "https://www.businessinsider.com/paycheck-raise-increase-inflation-prices-president-trump-2026-10", "summary": "Getting a job is the important part, as these job seekers might attest. But getting a raise is also a big deal: For many workers, the raises they ve gotten over the past couple of years have now been wiped out by inflation. Allison Joyce/Bloomberg via Getty Images Have you gotten a raise over the past couple of years? Inflation has likely eaten it away. Inflation-adjusted hourly earnings, which had risen after Donald Trump first took office, are now declining. And there are ominous signs that inflation could get worse. If you've gotten a raise over the last two years, almost all of those gains have now been eaten by inflation. That is, if you're the average wage-earner, considering the latest statistics released this week showing that prices were rising at a faster clip than expected. It's more evidence that affordability challenges in the US economy aren't going away. It also means that average hourly pay, which had risen after Donald Trump took office in January 2025, is now right back to where it started, when taking inflation into account. The average hourly wage was $35.84 in January 2025, according to federal statistics, or $37.79 in today's dollars, adjusted for inflation. The average hourly wage last month was $37.81 — basically unchanged over the past 20 months. Wednesday's consumer price index inflation report from the Bureau of Labor Statistics came in hotter than expected, with prices up 3.7% over the year in September. Economists had expected a 3.6% increase, and the rate was well above August's 3.4%. \"We read the September CPI report as another piece of evidence that the US is facing a persistent inflation problem,\" economists at BNP Paribas said in a note to clients. That problem means high prices — including gasoline that was up 9.1% in September compared to the previous month — are gobbling up pay increases you might get at work. Heather Long, chief economist at Navy Federal Credit Union, underlined that consumer price growth since 2025 has eroded nearly all wage gains, citing the impact of the war in Iran, which began at the end of February, on Americans' wallets. \"This is a very different picture from President Trump's first term when wages were up over 15%, well above about 8% inflation,\" Long said. \"It helps explain the frustration many households feel right now with the economy.\" Higher prices are adding to a general sense of malaise about the economy. The University of Michigan's consumer sentiment index dipped to 46.3 in October, do", "date_str": "2026-10-16T09:00:01+00:00", "hash": "86032d19bc900fcd", "title_fa": "اگر در دو سال گذشته افزایش حقوق دریافت کرده اید، اکنون تقریباً همه آن را تورم خورده است.", "summary_fa": "همانطور که این جویندگان کار ممکن است تأیید کنند، یافتن شغل بخش مهمی است. اما افزایش حقوق نیز مشکل بزرگی است: برای بسیاری از کارگران، افزایش حقوقی که در چند سال گذشته دریافت کرده‌اند، اکنون با تورم از بین رفته است. آلیسون جویس/بلومبرگ از طریق گتی ایماژ آیا در چند سال گذشته افزایش حقوق دریافت کرده اید؟ تورم احتمالاً آن را خورده است. درآمد ساعتی تعدیل شده بر اساس تورم که پس از روی کار آمدن دونالد ترامپ افزایش یافته بود، اکنون در حال کاهش است. و نشانه های شومی وجود دارد که تورم می تواند بدتر شود. اگر در دو سال گذشته افزایش حقوق دریافت کرده اید، تقریباً تمام این سودها اکنون با تورم خورده شده اند. یعنی اگر شما متوسط ​​دستمزد هستید، با در نظر گرفتن آخرین آمار منتشر شده در این هفته که نشان می‌دهد قیمت‌ها با کلیپ سریع‌تر از حد انتظار در حال افزایش هستند. این شواهد بیشتر نشان می دهد که چالش های مقرون به صرفه در اقتصاد ایالات متحده از بین نمی روند. همچنین به این معنی است که میانگین دستمزد ساعتی، که پس از روی کار آمدن دونالد ترامپ در ژانویه 2025 افزایش یافته بود، اکنون با در نظر گرفتن تورم، به همان جایی که شروع شده بود، بازگشته است. بر اساس آمار فدرال، متوسط ​​دستمزد ساعتی در ژانویه 2025، 35.84 دلار بود، یا 37.79 دلار به دلار امروز، با توجه به تورم تعدیل شده است. متوسط ​​دستمزد ساعتی در ماه گذشته 37.81 دلار بود - اساساً در 20 ماه گذشته بدون تغییر بود. گزارش تورم شاخص قیمت مصرف کننده در روز چهارشنبه از سوی اداره آمار کار گرمتر از حد انتظار بود و قیمت ها در سپتامبر 3.7 درصد نسبت به سال گذشته افزایش یافت. اقتصاددانان انتظار افزایش 3.6% را داشتند و این نرخ بسیار بالاتر از 3.4% در ماه اوت بود."}, {"source": "Business Insider", "title": "Trump's new press secretary Katie Zacharia is having a rough ride — even on friendly territory", "link": "https://www.businessinsider.com/katie-zacharia-first-week-white-house-press-secretary-2026-10", "summary": "Katie Zacharia, White House press secretary, has had a rough first week at work. Bloomberg/Getty Images Katie Zacharia says she did her best at her first White House briefing despite having little time to prepare. She said on \"Hannity\" that she only received briefing materials the morning of the press conference. Trump's new press secretary also confirmed she sat for the bar exam but did not pass. Katie Zacharia has had a tough first week at work. Her first briefing as the new White House press secretary lasted about 14 minutes, and she took three questions. Then came scrutiny over her legal career. During a Thursday appearance on \"Hannity\" on Fox News — known to be friendly territory for the Trump administration — Zacharia said she had done her \"very best\" in her debut and addressed the criticism over her legal career. \"What I feel is I really stepped up to the plate to do the press conference, Sean, with very little prep time,\" Zacharia told host Sean Hannity. Zacharia said she had been on the job for “less than maybe eight hours” and only received briefing materials on Tuesday morning — the day of the press conference. She also responded to criticism that she had taken questions only from conservative outlets, saying she had called on the Daily Mail, which \"is not known to be a conserva I agents can take on those tasks in multiple languages, too. That makes Starlink a useful, real-world test case for AI voice technology — and particularly useful for its global expansion . The company says Starlink serves more than 6 million active customers around the world. Instead of building a massive human customer-service operation to power call centers, SpaceX is betting it can serve its multilingual customers with AI. SpaceX did not respond to Business Insider's questions about which languages Grok supports or what types of calls still require a person. AI companies have been quickly rolling out more powerful voice models that do their best Chatty Cathy impression. In July, OpenAI released GPT-Live-1 with call-capable support, while Google has launched similar enterprise systems. The same is true for AI companies that are focusing on consumers. Meta's Muse, for example, can also handle phone calls for those let into the beta feature. So, soon, your bot may dial one for English — while a company's bot answers the call. Read the original article on Business Insider", "date_str": "2026-10-16T08:00:01+00:00", "hash": "0197ad036faef3f2", "title_fa": "تماس با خدمات مشتری Starlink؟ شما با گروک صحبت می کنید.", "summary_fa": "اسپیس‌ایکس می‌گوید هوش مصنوعی آن به بیشتر تماس‌های مشتریانش پاسخ می‌دهد. Anchiy/Getty Images - Nikolas Kokovlis/NurPhoto از طریق Getty Images SpaceX می‌گوید که Grok روزانه 20000 تماس مشتری Starlink را دریافت می‌کند - و 70٪ را بدون انسان می‌بندد. این شرکت در حین تبلیغ نماینده با قابلیت صوتی خود، این آمار را فاش کرد. این بخشی از یک مسابقه برای ساخت عوامل هوش مصنوعی است که عاشق چت کردن هستند - ممکن است (احتمالاً حتی) با یکدیگر. هوش مصنوعی ایلان ماسک یک سخنگو است. این هفته، شرکت ترکیبی هوش مصنوعی و اکتشاف فضایی ماسک، SpaceX، مدل جدیدی از Grok Voice را معرفی کرد - و فاش کرد که مراکز تماس Starlink در حال حاضر از فناوری هوش مصنوعی به عنوان مکالمه‌گرا برای پاسخگویی به تماس‌های 20000 مشتری در روز استفاده می‌کنند. این شرکت گفت که تقریباً 70 درصد از این تماس ها بدون انسان حل می شود. این شرکت گفت که نمایندگان Grok Voice مشتریان را تأیید می‌کنند، سخت‌افزار Starlink را عیب‌یابی می‌کنند، اعتبار صادر می‌کنند و تجهیزات جایگزینی را حمل می‌کنند. عوامل هوش مصنوعی آن می توانند این وظایف را به چندین زبان نیز انجام دهند. این امر Starlink را به یک مورد آزمایشی مفید و واقعی برای فناوری صدای هوش مصنوعی تبدیل می کند - و به ویژه برای گسترش جهانی آن مفید است. این شرکت می گوید Starlink به بیش از 6 میلیون مشتری فعال در سراسر جهان خدمات ارائه می دهد. اسپیس ایکس به جای ایجاد یک عملیات خدمات مشتری عظیم برای نیرو دادن به مراکز تماس، شرط می‌بندد که بتواند با هوش مصنوعی به مشتریان چند زبانه خود خدمات ارائه کند. SpaceX به سؤالات Business Insider در مورد اینکه Grok از کدام زبان‌ها پشتیبانی می‌کند یا چه نوع تماس‌هایی هنوز به شخص نیاز دارد، پاسخی نداد. شرکت‌های هوش مصنوعی به سرعت مدل‌های صوتی قدرتمندتری را"}, {"source": "Business Insider", "title": "Singapore's iconic skyline is shrouded in a fire-related haze. Here's what it looks like across the island.", "link": "https://www.businessinsider.com/singapore-haze-situation-cause-indonesia-fires-pollution-photos-2026-10", "summary": "Smoke from fires in neighboring Indonesia has blanketed Singapore in haze, disrupting daily life across the city-state. Joseph Nair/NurPhoto/Getty Images Smoke from fires in Indonesia has blanketed Singapore in haze, obscuring its iconic skyline. Air pollution hit its highest level this year on Friday, reaching \"very unhealthy\" levels. The haze has disrupted flights, shuttered outdoor sports facilities, and canceled a run for nearly 3,000. Singapore, the Southeast Asian financial hub known for its futuristic skyline, has been blanketed by milky haze as smoke from fires in neighboring Indonesia drifts across the region. The haze has affected Singapore for weeks, with conditions deteriorating in recent days. The pollution has disrupted flights, shut down outdoor sports facilities, and prompted organizers to call off a major running event. On Friday, air quality in part ama app Hongguo is taking over China. LIU JUNFENG/ Feature China/Future Publishing via Getty Images ByteDance's short-drama app, Hongguo, is riding high in China. It now trails only Douyin, WeChat, and Douyin Lite in terms of how much time Chinese users spend on it. Meanwhile, major long-form streaming platforms in the country are losing ground. Forget three-hour movies. China is getting hooked on bite-sized dramas — and ByteDance's Hongguo app is becoming one of the country's biggest platforms for streaming them. In August, ByteDance's apps accounted for 41.8% of the time users spent on China's 50 biggest mobile apps, up from 34.2% a year earlier. The figures come from Nomura's China Internet and New Media Monthly App Tracker, published October 5. Much of that growth came from its two apps: Douyin, the Chinese version of TikTok, and Hongguo, a streaming platform focused on short dramas. Hongguo ranks fourth among the country's biggest apps, behind ByteDance's Douyin and its Lite version, as well as WeChat. At the same time, China's long-form streaming services are losing ground. In August, the monthly time Chinese users spent on iQIYI, Tencent Video, and Mango TV fell by 35%, 40%, and 27%, respectively, year-on-year. Short dramas on the rise Launched in 2023, Hongguo is essentially TikTok for short dramas, operating on a free, ad-supported model. Chinese data firm QuestMobile said the platform had nearly 370 million users as of June. Hongguo is riding a broader short-drama boom in China. These shows are made for phone screens, with episodes lasting several minutes and storylines ranging from high-stakes romance and revenge to fantasy and family feuds. The format is taking off overseas, too. Tech market analysis firm Omdia expects the US, its largest market outside China, to generate roughly half of the $3 billion in international short-drama revenue forecast for this year. Omdia puts global short-drama revenue at about $11 billion in 2025 and expects it to climb to  work. \"Thirty years from now, they'll probably be working four or three and a half days a week. They'll have an income of per person of $300,000. It'll be a great life,\" he said. However, Dimon also warned that AI agents could carry out cyberattacks around the clock or pose security risks when given access to bank accounts to make payments on users' behalf. \"That means they are in your bank and you're assuming they're going to act properly on your behalf and they may not,\" Dimon said. He said businesses and governments needed to move quickly to address the cybersecurity risks posed by AI. \"You can't stop it. You just have to, like, manage the hell out of it.\" Dimon's statement comes the same week that multiple bankers sounded warnings about rogue AI agents and their capacity to unleash chaos if allowed to proliferate unchecked. Bank of America CEO Brian Moynihan also told analysts in a Wednesday", "date_str": "2026-10-16T05:28:49+00:00", "hash": "1a918515464c5338", "title_fa": "جیمی دیمون می گوید هوش مصنوعی آنقدر سریع در حال حرکت است که حتی دولت ها هم نمی توانند جلوی آن را بگیرند", "summary_fa": "جیمی دیمون، مدیر عامل جی‌پی مورگان چیس، پتانسیل زیادی برای هوش مصنوعی می‌بیند، اما در مورد خطرات امنیت سایبری آن هشدار داده است. لوک جانسون/ بلومبرگ/ گتی ایماژ جیمی دیمون می گوید هوش مصنوعی به قدری سریع در حال پیشرفت است که حتی دولت ها هم نمی توانند جلوی گسترش جهانی آن را بگیرند. مدیر عامل جی پی مورگان هوش مصنوعی را به سونامی تشبیه کرد و گفت که می تواند نحوه زندگی و کار نسل های آینده را تغییر دهد. دیمون همچنین هشدار داد که عوامل هوش مصنوعی می توانند بانک ها و زیرساخت های حیاتی را در معرض خطرات سایبری قرار دهند. جیمی دیمون، مدیر عامل JPMorgan Chase گفت: هوش مصنوعی به سرعت در حال پیشرفت است که حتی دولت ها نیز برای جلوگیری از گسترش آن تلاش می کنند. دیمون روز چهارشنبه در سخنرانی در باشگاه اقتصادی شیکاگو، هوش مصنوعی را با انقلاب صنعتی مقایسه کرد اما گفت که بسیار سریعتر از فناوری‌های قبلی پیشرفت می‌کند و قابلیت‌های جدیدی در عرض چند هفته ظاهر می‌شود. دیمون می‌گوید: «امروز ک nsider.com/guides/tech/samsung-galaxy-s26-ultra-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The S26 Ultra still offers the best cameras on a Samsung, even over the pricier Z Fold 8 Ultra. Mark Knapp / Business Insider From the early days of Android, Samsung has stood out as a leader of the pack, and over the last few years, the Ultra tier of Samsung's flagship Galaxy S line has served as a high bar for the rest of the market. The Samsung Galaxy S26 Ultra is the latest phone to fill that role, and it's little surprise that it's bringing a lot to the table. The S26 Ultra naturally packs the latest high-end Qualcomm Snapdragon 8 Elite Gen 5 chip for extreme speeds that'll hold up for years to come. It has a robust camera system that can rival the rest of the market. And for 2026, it naturally has a lot of AI features trying to find practical ways to fit into our lives. Samsung may not be innovating much in the phone's design, leaving it a tame-looking device with little to differentiate it from prior models, but it's still an all-around great phone with a little room for improvement here and there and hardly any major shortcomings. It comes at a high price, starting at $1,399 (it was $1,299 before a post-release price increase), so it won't be for everyone. If you know you're after a phone that goes hard at every turn, though, it's well worth a look. Specification Details Starting price $1,399/ £1,360 / €1,550 Colors Silver Shadow, Pink Gold, Cobalt Violet, Sky Blue, White, Black Release date March 11, 2026 Durability rating IP68 Display 6.9-inch OLED Resolution 1440 × 3120 Refresh rate 1-120Hz Peak brightness 2,600 nits Processor Qualcomm Snapdragon 8 Elite Gen 5 RAM 12GB/16GB (1TB model only) Storage 256GB/512GB/1TB Rear cameras 200MP Main - ƒ/1.4, 85° FOV 50MP Ultrawide - ƒ/1.9, 120° FOV 10MP 3x Telephoto - ƒ/2.4, 36° FOV 50MP 5x Periscope Telephoto - ƒ/2.9, 22° FOV Selfie cameras 12MP Dual Pixel
