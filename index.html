 طالبان، درخواست صریحی برای تحویل اطلاعات شخصی کاربران مطرح نکرده است و روشن نیست طالبان خواهان چه نوع همکاری‌‌ای هستند. حذف تبلیغات داعش و مسدود کردن حساب‌های مرتبط با این گروه، با ارائهٔ اطلاعات شناسایی کاربران از نظر پیامدهای حریم خصوصی تفاوت دارد. اگر همکاری احتمالی شامل ارائهٔ این اطلاعات باشد، سابقهٔ طالبان در بازداشت منتقدان، این نگرانی را ایجاد می‌کند که از داده‌ها برای شناسایی و تعقیب مخالفان سیاسی و نظامی استفاده شود. در چنین وضعیتی، سازوکار بررسی درخواست‌ها و تضمین‌هایی که جلو سوءاستفاده از اطلاعات را بگیرد اهمیت دارند. استفادهٔ گروه‌های افراطی و مسلح از سکوهای اینترنتی برای تبلیغات، سربازگیری و جمع‌آوری منابع مالی، از موضوع‌های مطرح‌شده در نشست سمرقند بود. سازمان همکاری شانگهای نیز اعلام کرد که مقابله با تروریسم و افراط‌گرایی در بستر فناوری‌های جدید، از محورهای این نشست بوده است. طالبان بارها بر مبارزه با شاخهٔ خراسان داعش تأکید کرده‌اند. برجسته کردن این موضوع را می‌توان بخشی از تلاش این رژیم برای جلب همکاری روسیه و کشورهای آسیای میانه دانست. تاجیکستان، ازبکستان و ترکمنستان با افغانستان هم‌مرزند و گسترش فعالیت داعش پیامده", "date_str": "2026-11-07T12:07:33+00:00", "hash": "263cad2c8c62e0f6", "title_fa": "طالبان از تیک‌تاکِ ممنوع‌شده و تلگرام کمک می‌خواهد", "summary_fa": "رژیم طالبان که استفاده از تیک‌تاک را در افغانستان ممنوع کرده است، اکنون از این شرکت و تلگرام خواسته است برای مقابله با فعالیت‌های آنلاین شاخهٔ خراسان دولت اسلامی (داعش)با طالبان همکاری کنند. ماهیت همکاری درخواستی روشن نیست، اما اگر شامل ارائه اطلاعات شناسایی کاربران باشد، سابقهٔ طالبان در تعقیب منتقدان، نگرانی‌هایی دربارهٔ امنیت کاربران افغان ایجاد می‌کند. ملا عبدالحق وثیق، رئیس استخبارات (اطلاعات) طالبان، در نشست امنیتی شانگهای پلاس در سمرقند ازبکستان گفت که برای مقابله با فعالیت‌های آنلاین داعش با کمبود امکانات فنی مواجه‌اند. او مدعی شد که این گروه از تلگرام، تیک‌تاک و دیگر ابزارهای دیجیتال برای ارتباطات، تأمین مالی و تبلیغات عقیدتی استفاده می‌کند، اما شرکت‌های اداره‌کنندهٔ این شبکه‌ها با طالبان همکاری نمی‌کنند. Read More This section contains relevant reference points, placed in (Inne دانشمندان با ساخت اتاق فرار برای اختاپوس‌ها، به رازی شگفت‌انگیز درباره‌ی توانایی این جانوران در عبور از باریک‌ترین شکاف‌ها پی بردند. تبلیغات اختاپوس‌ها می‌توانند بدن نرم و انعطاف‌پذیر خود را از سوراخ‌هایی عبور دهند که بسیار کوچک‌تر از اندازه‌ی بدنشان هستند. این توانایی شگفت‌انگیز مدت‌ها توجه دانشمندان را جلب کرده بود، اما چگونگی انجام آن به‌طور دقیق مشخص نبود. اکنون پژوهشگران با طراحی آزمایشی تازه دریافته‌اند که اختاپوس‌ها برای عبور از فضاهای تنگ، بسته به اندازه‌ی سوراخ از دو روش متفاوت استفاده می‌کنند. به‌گزارش آی‌اف‌ال‌ساینس ، گروهی از پژوهشگران برای بررسی نحوه‌ی عبور اختاپوس‌ها از فضاهای محدود، مجموعه‌ای از محفظه‌های شفاف پلکسی‌گلاس ساختند. این محفظه‌ها مانند اتاق فرار عمل می‌کردند و اختاپوس‌ها برای خروج از آن‌ها باید از سوراخ‌هایی با اندازه‌های مختلف عبور می‌کردند. در آزمایش‌ها دو گونه، شامل اختاپوس معمولی ( Octopus vulgaris ) و اختاپوس مایایی ( Octopus maya )، شرکت داشتند. پژوهشگران ابتدا فاصله‌ی میان چشم‌های هر اختاپوس را اندازه گرفتند تا بتوانند سوراخ‌هایی متناسب با ساختار بدن جانور طراحی کنند. بدن اختاپوس‌ها برخلاف بسیاری از جانوران، فاقد اسکلت سخت داخلی است و بیشتر قسمت‌های آن می‌توانند به‌شدت تغییر شکل دهند. بااین‌حال، همه‌ی بخش‌های بدن این جانور به یک اندازه انعطاف‌پذیر نیستند. ساختار سختی که از بخشی از دستگاه عصبی مرکزی محافظت می‌کند، در کنار منقار ساخته‌شده از کیتین، از قسمت‌هایی است که نمی‌تواند مانند بافت‌های نرم اطراف فشرده شود. به همین دلیل، فاصله‌ی میان چشم‌ها یکی از معیارهای مهم برای تعیین اندازه‌ی سوراخ‌هایی بود که اختاپوس‌ها می‌توانستند از آن‌ها عبور کنند. پژوهشگران سوراخ‌هایی اندکی بزرگ‌تر و اندکی کوچک‌تر از این فاصله طراحی کردند تا رفتار جانوران را در شرایط متفاوت بررسی کنند.", "image_url": "https://api2.zoomit.ir/media/octopus-passing-through-small-hole-6aeee530b001528ef859db89?w=1920&q=75", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "How much more money you need to make to afford a home in every US state", "link": "https://www.businessinsider.com/how-much-more-money-needed-to-buy-home-every-us-state-2026-11", "summary": "Salaries increased in nearly every state, but still not enough to afford the typical home. Grace Cary/Getty Images Incomes have increased in nearly every state, but buying a home hasn't gotten any easier. The national median income is still $31,136 short of affording the median-priced home. Realtor.com data shows that the additional income needed to buy a home ranges from $2,287 to $98,469. Nearly every state in the US experienced a bump in household income last year, yet it's still not enough to afford the typical home . States like Rhode Island and Virginia saw fairly large increases in income from 2024 to 2025 — 9.02% and 7.85%, respectively — but an additional five figures is needed to afford a median-priced home in each state, according to data from the US Census and Realtor.com. Realtor.com senior economist Hannah Jones said that even though households are bringing in more money, an increase in mortgage rates since last year isn't helping. \"Mortgage rates are more than one percentage point higher than a year ago, which cuts into buyer budgets and offsets the affordability gains from softening home prices and rising incomes,\" Jones said. \"Nationally, the median household income is not enough to afford the median-priced home in any state.\" The national median household income was $84,780 in 2025 — a roughly 3.8% increase from the previous year. However, with the national median listing price at $419,250 in September 2026, that's $31,136 short of the recommended income to buy, assuming a mortgage rate of 7.32% and a 10% down payment, according to Realtor. Realtor calculated the additional amount needed above the median income to afford the typical home in each state, and found that some require a couple thousand dollars, while others require nearly six figures. See how much more money you need to afford an average home in each state. States in ascending order of the additional household زایش داشت. با این حال، با در نظر گرفتن نرخ وام مسکن 7.32٪ و 10٪ پیش پرداخت، با فرض اینکه نرخ وام مسکن 7.32٪ و پیش پرداخت 10٪ در سپتامبر 2026 باشد، با متوسط ​​قیمت فهرست 419,250 دلار در سپتامبر 2026، این مبلغ 31,136 دلار کمتر از درآمد توصیه شده برای خرید است. Realtor مقدار اضافی مورد نیاز بالاتر", "image_url": "https://i.insider.com/6aedef8880d4b24f18346e47?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۱۷:۵۳"}, {"source": "Business Insider", "title": "Warren Buffett isn't running Berkshire anymore. You wouldn't know it.", "link": "https://www.businessinsider.com/warren-buffett-berkshire-hathaway-earnings-stocks-portfolio-cash-buybacks-abel-2026-11", "summary": "Warren Buffett is the former CEO and chairman of Berkshire Hathaway. Daniel Zuchnik/WireImage Warren Buffett is no longer at the helm of Berkshire Hathaway, but you might not know it. Berkshire bought and sold few stocks last quarter, echoing Buffett's final years in charge. New CEO Greg Abel did ramp up stock buybacks to $9.6 billion worth, the highest figure in years. Warren Buffett is no longer running Berkshire Hathaway, but you almost wouldn't know it. The famed investor's conglomerate reported third-quarter earnings on Saturday, showing minimal stock buying and selling. That was typical during the final years of Buffett's six decades in charge, as the bargain hunter struggled to find deals on stocks and businesses during a historic stock-market boom. He stepped down as Berkshire's CEO at the end of 2025, and as chairman this September. Under new CEO Greg Abel , Berkshire was a net seller of stocks last quarter, buying $2.4 billion and selling $2.8 billion. That's a striking slowdown from the second quarter, when it bought a net $20 billion of stocks. Berkshire's cash pile shrank by around $8 billion, to $357 billion, after subtracting $20.5 billion in Treasury payables. It has still more than doubled in size since the end of 2023, reflecti     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
