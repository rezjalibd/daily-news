      --tab-text: #94a3b8;

      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;

      --modal-bg: #151d30;

      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;

      display: flex;

    .btn-action {

      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;

      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;

      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;

    .search-input:focus {

    }
    .tabs {

      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {

      border-radius: 9999px;
      font-size: 0.8rem;

    .news-grid {

      flex-direction: column;
      gap: 16px;

    .news-card {

    .news-card.is-read:hover {

      margin-bottom: 12px;

      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;

      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;

    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;

    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;

      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;

    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);

      border-radius: 5px;

      transition: all 0.2s ease;
      font-weight: 500;

    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;

      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }

      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctbGl2ZS5wbmc&enable=upscale&s=5a3a27adc8667ba30d3c31b02e5e5a67", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "بورس و طلا"], "datetime_fa": "۲۸ آبان • ۱۸:۳۰"}, {"source": "The Guardian AI", "title": "Australian music industry rejects ‘divide and conquer’ proposal to give musicians exemption from AI scraping", "link": "https://www.theguardian.com/australia-news/2026/nov/20/australian-music-industry-rejects-proposal-to-give-musicians-exemption-ai-scraping", "summary": "Reported proposal to give musicians special treatment is ‘unworkable’, Aria CEO says, vowing to stand with other creatives Get our daily political email , free app or daily news podcast The music industry will not accept an AI carveout deal that leaves other creative sectors behind, rejecting a reported proposal to give musicians special treatment while allowing big tech to train on other copyrighted material – described by David Pocock as a “divide and conquer strategy”. The trade union representing writers and creatives is “alarmed” at a proposal to let AI companies train on Australian data if they buy a permit, an idea also strongly rebuffed by the Coalition and Greens. Sign up for Guardian Australia’s Politics, really newsletter here Continue reading...", "date_str": "2026-11-19T14:00:52+00:00", "hash": "0e0107f120fbfe72", "title_fa": "صنعت موسیقی استرالیا پیشنهاد «تفرقه بینداز و حکومت کن» مبنی بر معافیت نوازندگان از خراش دادن هوش مصنوعی را رد کرد.", "summary_fa": "مدیر عامل آریا می‌گوید پیشنهاد گزارش‌شده برای ارائه رفتار ویژه به نوازندگان «غیرقابل اجرا» است، و قول داده است در کنار دیگر خلاقان بایستد، ایمیل سیاسی روزانه، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید صنعت موسیقی قراردادی را که بخش‌های خلاقانه دیگر را پشت سر بگذارد، نمی‌پذیرد، و پیشنهاد گزارش‌شده مبنی بر ارائه رفتار ویژه به نوازندگان را رد می‌کند و در عین حال به فناوری‌های بزرگ اجازه می‌دهد بر روی سایر مطالب دارای حق نسخه‌برداری آموزش ببینند. اتحادیه کارگری که نماینده نویسندگان و خلاقان است از پیشنهادی که به شرکت‌های هوش مصنوعی اجازه می‌دهد در صورت خرید مجوز، در مورد داده‌های استرالیایی آموزش ببینند، «هاردار» است، ایده‌ای که ائتلاف و سبزها نیز به شدت آن را رد کردند. دولت آلبانی در مورد پیشنهاد گزارش شده اظهار نظر نمی کند، اما وزرای ارشد در روزهای اخیر نگرانی هایی را در مورد قانون فعلی کپی رایت مطرح کرده اند و به اصلاحات نیاز دارند. آنابل هرد، مدیر عامل انجمن صنعت ضبط استرالیا (آریا)، و کلر پولن، مدیر عامل انجمن نویسندگان استرالیا، گفتند که جامعه خلاق - که این هفته یک کمپین بزرگ هوش مصنوعی را راه اندازی کرد - در رد چنین تغییراتی متحد باقی خواهد ماند. پولن گفت: \"من نمی توانم ببینم هیچ کارگر خلاقی همکاران خود را پشت سر بگذارد.\" نشریه استرالیایی فایننشال ریویو روز پنجشنبه گزارش داد که دولت در حال بررسی تغییری در کپی رایت است که براساس آن شرکت‌های هوش مصنوعی مجوزهایی را برای آموزش محتوای استرالیایی خریداری می‌کنند، اما موسیقی ممکن است مستثنی شود. پس از آن‌که Anthropic مدلی از «تأیید مشروط» را برای حذف محتوا پیشنهاد کرد، مگر اینکه صاحب حقوق مخالفت کند، چنین پیشنهادی بیشتر با شرکت‌های هوش مصنوعی مطابقت دارد، و OpenAI به کمیته پارلمانی گفت که «به‌طور بالقوه» از پرداخت به صندوقی برای سازندگان حمایت می‌کند.", "image_url": "https://i.guim.co.uk/img/media/a97bdc0f91639c96d197dd5d8f13df1d8ae98f29/0_671_3022_2418/master/3022.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=6f713b67a86b8386b7f04c5e329faf82", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "موسیقی"], "datetime_fa": "۲۸ آبان • ۱۷:۳۰"}, {"source": "The Guardian AI", "title": "‘Communities are really angry’: how Australia’s datacentre opposition has gone from marginal to mainstream in five months", "link": "https://www.theguardian.com/australia-news/2026/nov/20/communities-are-really-angry-how-datacentre-opposition-has-gone-from-marginal-to-mainstream-in-five-months", "summary": "A network of grassroots campaigners around the country are sharing information to help push back against the datacentre boom Get our breaking news email , free app or daily news podcast When Heather Champion raised a council motion in March opposing a massive new gas plant to power a large datacentre in the Southern Highlands of New South Wales, it failed to pass. Five months later, when the local councillor for Wingecaribee raised a new motion calling for the federal government to implement a moratorium on new datacentres, it passed unanimously. Continue reading...", "date_str": "2026-11-19T14:00:50+00:00", "hash": "14703597e7bbf5b9", "title_fa": "\"جوامع واقعا عصبانی هستند\": چگونه مخالفت مرکز داده استرالیا در پنج ماه از حاشیه به جریان اصلی تبدیل شده است.", "summary_fa": "شبکه‌ای از مبارزان مردمی در سراسر کشور اطلاعاتی را به اشتراک می‌گذارند تا به مقابله با رونق مرکز داده کمک کنند. ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید وقتی هیدر قهرمان در ماه مارس یک طرح شورایی را در مخالفت با یک نیروگاه گازی عظیم جدید برای تامین انرژی یک مرکز داده بزرگ در ارتفاعات جنوبی نیو ساوت ولز مطرح کرد، این پیشنهاد به تصویب نرسید. پنج ماه بعد، زمانی که مشاور محلی Wingecaribee طرح جدیدی را مطرح کرد که در آن از دولت فدرال خواسته شد تا مراکز داده جدید را تعلیق کند، به اتفاق آرا تصویب شد. به خواندن ادامه دهید... چمپیون می گوید: «من فکر می کنم تغییر دیدگاه شورا نتیجه مستقیم تغییر احساسات در جامعه است. این تغییر موفقیت‌های مردمی را در عقب راندن ساخت مرکز داده و اینکه چگونه این پیروزی‌ها الهام‌بخش جوامع دیگر برای انجام اقدامات مشابه هستند را برجسته می‌کند. در ماه مه، گاردین استرالیا از سه پروژه مرکز داده در سراسر کشور گزارش داد - Hazelmere در استرالیای غربی، West Footscray در ویکتوریا، و Lane Cove در نیو ساوت ولز. از زمان گزارش، طرح‌های پیشنهادی پروژه در WA و NSW لغو شده است، و توسعه M3 NextDC در West Footscray پس از اینکه Jemena، ارائه‌دهنده برق، نصب تیرهای برق بلندتر را پس از اعتراض جامعه به تعویق انداخت، متوقف شد. ساشا تیچکوسکی، سخنگوی مسئول برنامه‌ریزی Lane Cove، می‌گوید پس از موفقیت در خروج مرکز داده مریخ گروه گودمن در لین کوو، او در حال کار با جوامع در غرب سیدنی و ارتفاعات جنوبی در کمپین‌های خود است. تیچکوسکی می‌گوید این گروه‌ها با همکاری یکدیگر، سیگنال قوی به صنعت و سیاستمداران ارسال می‌کنند که باید بهتر عمل کنند.", "image_url": "https://i.guim.co.uk/img/media/e90e77dce409ae1737f7a957cdd23366571c08e6/735_307_6367_5096/master/6367.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=7ed5fb3e6ebae11c9125e65a03e413d3", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۸ آبان • ۱۷:۳۰"}, {"source": "The Verge", "title": "How Silicon Valley lost the public, with Crooked Media’s Jon Favreau", "link": "https://www.theverge.com/podcast/1036484/jon-favreau-pod-save-america-offline-crooked-media-trump-big-tech-ai-2028-election", "summary": "Today, I’m talking with Jon Favreau, a political commentator and cofounder of Crooked Media. You probably know Jon best from a little show called Pod Save America , which Jon started with a group of fellow Obama staffers in the wake of Donald Trump’s election in 2016. It’s now one of the most popular podcasts in the country. Since then, Pod Save America and the company created around it, Crooked, have become one of the major success stories of independent liberal media. So one of my central questions for Jon was why he thought Democrats swept the midterms earlier this month and, more importantly, why it happened now — especially after a wave of tech billionaires made big swings to the right while buying huge pillars of the information ecosystem. That’s Elon Musk buying Twitter and turning it into X, Mark Zuckerberg sucking up to Trump while tearing down Meta’s content moderation infrastructure, the Ellison family buying stakes in TikTok, turning over the leadership of CBS News and now potentially CNN while integrating Warner into Skydance… the list goes on. How did they all miss the huge swing in the mood of the public — or, more apocalyptically, fail in their attempts to control the media and thus influence the public? Verge subscribers, don t forget you get exclusive access to ad-free Decoder wherever you get your podcasts. Head here . Not a subscriber? You can sign up here . Crooked itself is also just a fascinating business, as all creator businesses are. When we think of what you might call news creators, we tend to look to the right — after all, conservative media have been building an alternative, direct-to-consumer pipeline since the dawn of talk radio. But Jon and his fellow Crooked cofounders created a reliable template for liberal creators, and it’s working. Crooked hired its first CEO a few years ago, now offers more than a dozen original shows, and has a staff of around 100 people working on everything from live events to political advocacy. Jon tells me the subscription business has crossed 65,000 members. So of course I wanted to know how Jon feels about topics we cover a lot here on Decoder : online distribution, the platform power of YouTube, and how you balance running a media business that has to make money with a newsroom that, ultimately, has a political mission and a strong point of view. Of course, AI. Jon has turned his own podcast Offline into something close to an AI policy show this year. He has a lot of thoughts on how Congress ", "date_str": "2026-11-19T15:00:00+00:00", "hash": "e7251aae17e03ca3", "title_fa": "چگونه سیلیکون ولی با جان فاورو از Crooked Media عموم مردم را از دست داد", "summary_fa": "امروز، من با جان فاورو، مفسر سیاسی و یکی از بنیانگذاران Crooked Media صحبت می کنم. احتمالاً جان را بهتر از یک برنامه کوچک به نام Pod Save America می‌شناسید، که جان با گروهی از همکاران اوباما در پی انتخاب دونالد ترامپ در سال 2016 شروع کرد. این پادکست اکنون یکی از محبوب‌ترین پادکست‌ها در کشور است. از آن زمان، Pod Save America و شرکتی که پیرامون آن ایجاد شد، Crooked، به یکی از موفقیت‌های اصلی رسانه‌های لیبرال مستقل تبدیل شده‌اند. بنابراین یکی از سؤالات اصلی من برای جان این بود که چرا او فکر می‌کرد که دموکرات‌ها در اوایل این ماه در میان دوره‌ای قرار گرفتند و مهم‌تر از آن، چرا این اتفاق در حال حاضر رخ داد - به‌ویژه پس از اینکه موجی از میلیاردرهای فناوری نوسانات بزرگی را به سمت راست انجام دادند و ستون‌های عظیمی از اکوسیستم اطلاعاتی را خریداری کردند. این یعنی ایلان ماسک که توییتر را می‌خرد و آن را به X تبدیل می‌کند، مارک زاکربرگ در حالی که زیرساخت تعدیل محتوای متا را از بین می‌برد، خانواده الیسون سهام TikTok را می‌خرد، رهبری CBS News و اکنون بالقوه CNN را واگذار می‌کند در حالی که وارنر را در Skydance ادغام می‌کند... این لیست ادامه دارد. چگونه همه آنها نوسان عظیم خلق و خوی مردم را از دست دادند - یا به شکل آخرالزمانی تر، در تلاش برای کنترل رسانه ها و در نتیجه تأثیرگذاری بر مردم شکست خوردند؟ مشترکین همیشگی، فراموش نکنید که از هر جا که پادکست های خود را دریافت می کنید، به Decoder بدون آگهی دسترسی انحصاری دارید. به اینجا سر بزن مشترک نیستید؟ می توانید در اینجا ثبت نام کنید. Crooked نیز مانند همه مشاغل سازنده، فقط یک تجارت جذاب است. وقتی به آنچه شما ممکن است خالقان خبر بنامید فکر می‌کنیم، تمایل داریم به سمت راست نگاه کنیم", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DCD-Jon-Favreau.jpg?quality=90&strip=all&crop=0%2C10.711631919237%2C100%2C78.576736161526&w=1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "بورس و طلا"], "datetime_fa": "۲۸ آبان • ۱۸:۳۰"}, {"source": "The Verge", "title": "The Analogue 3D can now update itself over Wi-Fi", "link": "https://www.theverge.com/tech/1037552/analogue-3d-nintendo-64-console-wi-fi-activated-automatic-updates", "summary": "Analogue has long been good at expanding the features and functionality of its consoles through regular firmware updates, but installing those updates has always required moving حافظه نصب کنید، فعال شده است.", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/08/257891_Analogue_3D_AKrales_0002.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۸ آبان • ۱۸:۰۲"}, {"source": "The Verge", "title": "With the biggest IPO of all time, Anthropic’s ‘good guy’ reputation is on the line", "link": "https://www.theverge.com/ai-artificial-intelligence/1037459/anthropic-ipo-safe-ai-reputation-power-structure", "summary": "Today is a new beginning for Anthropic: a years-in-the-making IPO that beat out SpaceX for most valuable of all time, having raised $81.3 billion and set an important precedent for the other public AI lab debuts to come. But it's not simply a financial milestone. Anthropic was founded on the idea that it prioritized safety more than other labs; its founders had left executive research positions at OpenAI. As the AI race has accelerated, though, its executives have emphasized that Anthropic can only fulfill this mission by coming in first place, requiring lots of money and compute. Unsurprisingly, thoughtful, safe, and intentional AI develop … Read the full story at The Verge.", "date_str": "2026-11-19T14:25:37+00:00", "hash": "6bce2445f12f71a3", "title_fa": "با بزرگترین IPO در تمام دوران، شهرت «مرد خوب» آنتروپیک در خط است", "summary_fa": "امروز شروع جدیدی برای آنتروپیک است: یک IPO سال‌های بعد که اسپیس ایکس را برای باارزش‌ترین زمان‌ها شکست داد و ۸۱.۳ میلیارد دلار جمع‌آوری کرد و سابقه مهمی را برای دیگر آزمایشگاه‌های عمومی هوش مصنوعی در آینده ایجاد کرد. اما این فقط یک نقطه عطف مالی نیست. Anthropic بر این ایده بنا شد که ایمنی را بیش از سایر آزمایشگاه ها در اولویت قرار می دهد. بنیانگذاران آن سمت های تحقیقاتی اجرایی در OpenAI را ترک کرده بودند. با افزایش سرعت مسابقه هوش مصنوعی، مدیران آن تاکید کرده اند که آنتروپیک تنها با قرار گرفتن در رتبه اول می تواند این ماموریت را انجام دهد، که نیاز به پول و محاسبات زیادی themselves (compared to mice who didn't watch fights) when pitted against stronger, more aggressive opponents, according to a paper published in the journal Nature. The team assigned male mice randomly to three different groups—fighters, spectators, or novices—and then subjected each group to eight days of training involving three 10-minute sessions per day. The novices played with stuffed mice in isolation, while the spectators watched various pairs of fighter mice battle it out from a raised platform behind a transparent barrier—a set-up chosen to let them smell and listen to the fights as well as observe them. The ninth day was \"fight night,\" when all the mice had to face a daunting opponent in three 4-minute rounds. Each fight was filmed from above so that the mouse behavior could be analyzed. To monitor corresponding changes in brain activity, the team engineered the rodents' excitatory brain cells to glow green whenever they were activated, while inhibitory brain cells glowed red. They also implanted tiny optical fibers into 12 interconnected brain regions so they could track changing activity in every brain region simultaneously. Read full article Comments", "date_str": "2026-11-19T14:04:38+00:00", "hash": "97b39d71a1ec750e", "title_fa": "باشگاه مبارزه موش ممکن است توضیح دهد که چرا ما دوست داریم چیزهای خشونت آمیز تماشا کنیم", "summary_fa": "اعتبار: J.M. Iravedra-Garcia و همکاران، 2026 اعتبار: J.M. Iravedra-Garcia و همکاران، 2026 چیزی در مورد تماشای رویدادهای خشونت آمیز وجود دارد که به طور گسترده برای ما جذاب است، خواه این آخرین فیلم جان ویک، یک بازی ویدیویی، یا یک مسابقه زنده UFC باشد. دانشمندان بحث کرده اند که آیا تماشای چیزهای خشونت آمیز می تواند ما را تهاجمی تر کند، اما همچنین می تواند یک استراتژی بقای سازگار باشد. بر اساس مقاله ای که در مجله Nature منتشر شده، برای مثال، موش های نر که در حال نبرد موش های دیگر هستند، به اندازه کافی در مورد نحوه مبارزه برای محافظت بهتر از خود (در مقایسه با موش هایی که دعوا را تماشا نمی کردند) وقتی در برابر مخالفان قوی تر و  simple dinner recipe , I pick up an Ina Garten cookbook. The Barefoot Contessa is known for her no-fuss recipes that deliver big on flavor, and she's rarely led me astray. So, when I came across a 2008 recipe for mustard-roasted fish , cooked on a sheet pan and ready in under 30 minutes, I had to give it a try. Now, this elegant fish dish has become my go-to for easy meals and dinner parties alike. It's just fancy enough without being complicated. The ingredients are simple but flavorful. captiontk Lizzy Briskin You don't need a long list of ingredients for this fish recipe. The first, of course, is the fish, and though Garten suggests red snapper, you can use the sauce in this recipe on most varieties of fish, from salmon to tilapia. I recommend something flaky and flat — think cod, rather than swordfish or tuna — because the flavor-packed sauce livens up milder seafood. I used Wild Alaska Sole , which is also sometimes labeled flounder. Speaking of sauce, the fish is absolutely drenched in a rich, tangy combination of crème fraîche, two mustards (Dijon and whole-grain), shallots, and capers. The mustard duo brings acidity and a bit of a back-of-the-throat heat to the dish, while capers add lovely brininess and shallots add some bite and texture. Finally, crème fraîche, a high-fat cultured dairy product, is less tangy than sour cream but wonderfully rich — exactly what a lean fish fillet needs. The dish takes under 10 minutes to prep. captiontk Lizzy Briskin If your fish is frozen, be sure to defrost it first. Then, the recipe comes together in a snap. First, arrange the fillets on a baking sheet or in a baking dish. I used five fillets instead of four, as mine were thinner and smaller than the 8-ounce fillets Garten recommends. Don't worry if they overlap; you're not looking for crispiness in this recipe, so there's little risk of overcrowding the pan. Then, it's time to whip up the sauce. Simply stir everything together in a bowl, then cover the fish evenly. The goal is to cover the fish in sauce, but they don't need to be swimming in it (no pun intended). I cooked the fish in under 20 minutes, then topped ", "date_str": "2026-11-19T14:47:03+00:00", "hash": "853b938e1d89e6b3", "title_fa": "ماهی ورقه ای آسان اینا گارتن درست کردم. این غذا تنها با 6 ماده، شام جدید مورد علاقه من است.", "summary_fa": "این دستور پخت ماهی آسان بود، اما طعم آن بالا بود. Lizzy Briskin من دستور پخت ماهی برشته شده با خردل اینا گارتن را امتحان کردم که فقط 6 ماده لازم دارد. ظرف به سرعت جمع شد، و سس تند و غنی بود. حتما دوباره این غذا را درست می کنم، هم برای غذای آسان و هم برای مهمانی های شام با دوستان. هر زمان که به دنبال یک دستور غذای ساده برای شام هستم، کتاب آشپزی Ina Garten را برمی دارم. کونتسا پابرهنه به خاطر دستور العمل های بی سر و صداش که طعم و مزه خوبی ارائه می دهد، شناخته شده است و به ندرت مرا به بیراهه می کشاند. بنابراین، هنگامی که در سال 2008 با دستور پخت ماهی برشته شده خردل مواجه شدم که در یک تابه پخته شده بود و در کمتر از 30 دقیقه آماده شد، مجبور شدم آن را امتحان کنم. اکنون، این غذای ماهی شیک برای من برای وعده های غذایی آسان و مهمانی های شام به طور یکسان تبدیل شده است. این فقط به اندازه کافی فانتزی است بدون اینکه پیچیده باشد. مواد اولیه ساده اما خوش طعم هستند. captiontk Lizzy Briskin برای این دستور ماهی نیازی به لیست طولانی مواد ندارید. البته اولین مورد، ماهی است، و اگرچه گارتن اسنپ قرمز را پیشنهاد می کند، می توانید از سس در این دستور غذا بر روی اکثر انواع ماهی، از ماهی آزاد گرفته تا تیلاپیا استفاده کنید. من چیزی پوسته پوسته و مسطح را توصیه می کنم - به جای شمشیر ماهی یا ماهی تن به ماهی کاد فکر کنید - زیرا سس پر طعم غذای دریایی ملایم تری را زنده می کند. من از Wild Alaska Sole استفاده کردم که گاهی اوقات به آن برچسب flounder نیز می گویند. وقتی صحبت از سس شد، ماهی کاملاً از ترکیبی غنی و", "image_url": "https://i.insider.com/6afcae6cbcc92b799fa7ed7e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۸ آبان • ۱۸:۱۷"}, {"source": "Business Insider", "title": "15 Thanksgiving sides you can make in a slow cooker or Crock-Pot", "link": "https://www.businessinsider.com/thanksgiving-sides-slow-cooker-crock-pot", "summary": "From stuffing and mac and cheese to crowd-pleasing dips, these Thanksgiving sides can all be prepared in a slow cooker. DronG/Getty Images A slow cooker or Crock-Pot can make cooking easier on Thanksgiving Day . You can make classic side dishes in a slow cooker, from stuffing to cranberry sauce. You can even make dinner rolls and mashed potatoes in a slow cooker . Everyone knows that when it comes to Thanksgiving food , the sides are the best dishes. With the oven tied up for hours roasting the turkey, finding space for every side dish can be a challenge. That's where a Crock-Pot or slow cooker comes in. A slow cooker can free up valuable oven and stovetop space while keeping sides warm until it's time to eat. From stuffing and cranberry sauce to creamy mashed potatoes, green beans, and crowd-pleasing dips, there are plenty of Thanksgiving favorites you can make ahead with minimal hands-on work. Here are 15 Thanksgiving sides you can make in a slow cooker. Sweet-potato casserole with marshmallows can easily be made in a slow cooker. Sweet potatoes with cinnamon and marshmallows. Sara Seaberry/Getty Images Sweet-potato casserole topped with marshmallows is a Thanksgiving favorite, and numerous recipes show how to make it in a slow cooker. A recipe from Damn Delicious explains that the residual heat from the slow cooker is the perfect way to achieve gooey, melted marshmallows on top of your casserole. You might be surprised to learn you can make mashed potatoes in a slow cooker. The mashed potatoes after adding the cheese. Erin McDowell/Business Insider Mashed potatoes are a Thanksgiving staple — the meal simply wouldn't be complete without them. However, mashed potatoes can be a hassle, from parboiling them to mashing and finding a space on the stove for them. Don't fret: Mashed potatoes can easily be made in a slow cooker . Just make sure to add water to your pot, or you won't get the desired consistency for mashing. \"Mashed potatoes are great in the slow cooker, though it does take a bit of time for the potatoes to soften, so plan ahead,\" Sarah Olson, chef behind The Magical Slow Cooker, said. The potatoes can take about four hours to soften, so give yourself plenty of time. Try making your stuffing in a slow cooker, rather than in the oven or inside the turkey. bhofack2/Getty Images/iStockphoto Everyone has their preferred method of making stuffing for Thanksgiving. While some might opt for oven-baked stuffing or stuffing cooked inside the turkey, it's a", "date_str": "2026-11-19T14:47:02+00:00", "hash": "d6d0d4d79cd8839e", "title_fa": "15 غذای شکرگزاری که می توانید در اجاق گاز آهسته یا قابلمه درست کنید", "summary_fa": "از چاشنی و ماک و پنیر گرفته تا غذای دلپذیر، این غذای شکرگزاری را می توان در یک اجاق آهسته آماده کرد. DronG/Getty Images یک اجاق گاز آهسته یا قابلمه می تواند آشپزی را در روز شکرگزاری آسان کند. می توانید مخلفات کلاسیک را در آرام پز درست کنید، از قیمه گرفته تا سس کرن بری. حتی می توانید رولت شام و پوره سیب زمینی را در آرام پز درست کنید. همه می دانند که وقتی صحبت از غذای شکرگزاری می شود، کناره ها بهترین غذاها هستند. با ساعت‌ها بسته بودن فر بوقلمون، پیدا کردن فضایی برای هر ظرف جانبی می‌تواند چالش برانگیز باشد. اینجاست که یک دیگ یا آهسته پز وارد می شود. اجاق آهسته می تواند فضای با ارزش اجاق گاز و اجاق گاز را آزاد کند و در عین حال کناره ها را تا زمان صرف غذا گرم نگه دارد. از چاشنی و سس کرن بری گرفته تا پوره سیب زمینی خامه ای، لوبیا سبز و دیپ های دلپذیر، بسیاری از غذاهای مورد علاقه روز شکرگزاری وجود دارد که می توانید با حداقل کار عملی پیشاپیش درست کنید. در اینجا 15 غذای شکرگزاری وجود دارد که می توانید در اجاق گاز آرام درست کنید. کاسرول سیب زمینی شیرین با مارشمالو را می توان به راحتی در اجاق گاز آهسته درست کرد. سیب زمینی شیرین با دارچین و گل ختمی. سارا سیبری/ گتی ایماژ کاسه سیب زمینی شیرین که روی آن مارشمالو قرار داده شده است، غذای مورد علاقه روز شکرگزاری است و دستور العمل های متعدد طرز تهیه آن را در اجاق آهسته نشان می دهد. دستور العملی از Damn Delicious توضیح می دهد که حرارت باقیمانده از اجاق گاز آهسته بهترین راه برای رسیدن به گل ختمی و آب شده در بالای کاسه است. شاید تعجب کنید اگر یاد بگیرید که می توانید پوره سیب زمینی", "image_url": "https://i.insider.com/6afb34435aab055bb64422ce?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۸ آبان • ۱۸:۱۷"}, {"source": "Business Insider", "title": "I got my son a cellphone and never felt good about monitoring his texts. I decided to stop.", "link": "https://www.businessinsider.com/stopped-monitoring-sons-text-messages-cellphone-2026-11", "summary": "The author got her son a phone when he was in 5th grade. Courtesy of Ashley Archambault I got my son a cellphone two years ago. At first, I monitored his text messages, but I never felt great about it. My perspective on his right to privacy has changed. Toward the end of fifth grade, I got my son his first cellphone . However, it wasn't a smartphone, and it had several parental-safety features. For instance, I have access to his text messages on my phone and receive safety alerts when things are flagged, such as possible bullying. In the beginning, I sometimes went through his messages We had a lot of talks about being safe, such as giving his number only to people he knows and not answering any messages from anyone he doesn't. I liked being able to monitor the contacts he was adding on his own and asking him about names I didn't recognize. But monitoring all his messages felt invasive from the start. I thought a lot about when I was his age and what my friends and I talked about on the phone . Not everything was entirely innocent; there were incidents that had happened at school we'd prefer our parents not know about, but it was still important for us to talk about them with our peers. I put myself in his shoes at that age I wanted to give him some autonomy with his social life , so I laid off checking every message. Then one day, I got a flagged message that caught him in a lie. Since lying is my parenting pet peeve, I got upset and decided to go through the rest of his messages. Unfortunately for both of us, I caught him in more lies. The more I confronted him about each detail I had discovered, the more he shut down on me. At first, this just made me angrier about the situation. My son was so upset with me that he asked me if he could go stay with a relative for a week. It reminded me of when I would get so upset with my dad at his age that I would want to run away. I allowed him to get some time away from me, but I could tell he regretted his request almost immediately. I realized I had embarrassed him by digging around in his private life My son and I have always been close, but the week he was away, I started to see that he has the right to begin developing his own life, one separate from mine. I also reflected on the actual text messages I read, and nothing was out of the ordinary for his age. There were some crushes, break-ups, and friends I had no idea about. He wasn't really doing anything wrong; he was just becoming more independent . At his ag", "date_str": "2026-11-19T14:08:01+00:00", "hash": "159d779fabdd3b13", "title_fa": "من برای پسرم یک تلفن همراه گرفتم و هرگز از نظارت بر پیام هایش احساس خوبی نداشتم. تصمیم گرفتم توقف کنم.", "summary_fa": "نویسنده وقتی پسرش کلاس پنجم بود تلفنی گرفت. با حسن نیت از اشلی آرچمبل من دو سال پیش برای پسرم یک تلفن همراه گرفتم. در ابتدا پیامک های او را زیر نظر داشتم، اما هیچ وقت احساس خوبی نسبت به آن نداشتم. دیدگاه من در مورد حق او برای حفظ حریم خصوصی تغییر کرده است. در اواخر کلاس پنجم، اولین تلفن همراه پسرم را گرفتم. با این حال، این گوشی هوشمند نبود و دارای چندین ویژگی ایمنی والدین بود. به عنوان مثال، من به پیام‌های متنی او در تلفنم دسترسی دارم و هشدارهای ایمنی را در صورت علامت‌گذاری موارد، مانند قلدری احتمالی، دریافت می‌کنم. در ابتدا، گاهی اوقات پیام های او را مرور می کردم. ما صحبت های زیادی در مورد ایمن بودن داشتیم، مثلاً شماره او را فقط به افرادی که می شناسد می داد و به هیچ پیامی از کسی که نمی شناسد پاسخ نمی داد. دوست داشتم بتوانم مخاطبینی را که خودش اضافه می‌کرد نظارت کنم و از او درباره نام‌هایی که نمی‌شناختم بپرسم. اما نظارت بر همه پیام های او از همان ابتدا تهاجمی بود. خیلی به این فکر کردم که در سن او بودم و من و دوستانم در مورد چه تلفنی صحبت می کردیم. همه چیز کاملاً بی گناه نبود. حوادثی در مدرسه اتفاق افتاده بود که ترجیح می‌دهیم والدین‌مان از آن‌ها اطلاعی نداشته باشند، اما همچنان برای ما مهم بود که در مورد آنها با همسالان خود صحبت کنیم. در آن سنی که می‌خواستم خودم را به جای او بگذارم، می‌خواستم در زندگی اجتماعی‌اش به او استقلال بدهم، بنابراین بررسی هر پیامی را کنار گذاشتم. سپس یک روز، من یک پیام پرچمدار دریافت کردم که او را در یک دروغ گرفتار کرد. از آنجایی که دروغگویی حیوان خانگی من است، ناراحت شدم و تصمیم گرفتم بقیه پیام های او را مرور کنم. متاسفانه", "image_url": "https://i.insider.com/6adb929dc8572251b197f74e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۸ آبان • ۱۷:۳۸"}, {"source": "Business Insider", "title": "I made an entire Thanksgiving dinner using only Ina Garten recipes. Most dishes were delicious and cheap to make.", "link": "https://www.businessinsider.com/ina-garten-thanksgiving-menu-best-recipes-review-2026-11", "summary": "I created an easy Ina Garten Thanksgiving menu, using only her recipes to create an epic holiday feast. Terri Peters I made a Thanksgiving feast using only Ina Garten's recipes. Most were easy and affordable. I made turkey, green beans, stuffing, mac and cheese, mashed potatoes, pie, and cranberry sauce. After 10 hours of cooking, the meal for 12 was beautiful and filled with delicious highlights. When I first became interested in cooking, I spent a lot of time watching Ina Garten on Food Network and diving into her cookbooks and recipes. To me, Garten is one of the greats — so when I decided to cook an early Thanksgiving dinner for friends, it was a no-brainer that I'd put together a menu full of \"Barefoot Contessa\" recipes. Like Garten, I kept things simple and elegant, choosing classics like roasted turkey, mashed potatoes, and green beans. Although I've been cooking Thanksgiving dinner for my family for over 15 years, I learned new tricks and found recipes I would definitely make again. Here's what it was like to cook a full-on Garten-giving. All the ingredients were surprisingly easy to find. Terri Peters Still, since I was following recipes from a pro, I thought I'd probably have to go to four or five different grocery stores or specialty shops to gather all of the ingredients. However, my grocery list was actually simple, with lots of easy-for-me-to-acquire items like fresh green beans, tomatoes, elbow macaroni, tomatoes, butter, and goat cheese. To my surprise, I found everything I needed at Walmart on a single trip. I started cooking the day before and knocked out the apple pie first. Terri Peters Garten's deep-dish apple pie was to be our dessert, so I made it a day in advance to save time later. The recipe called for a lot of citrus zest, but it was simple to get the amount I needed from oranges and lemons using my microplane grater. It also required me to peel, quarter, and core several pounds of Granny Smith apples, which was time-consuming but not difficult. I'm pretty die-hard about following recipes, but I cheated a little on this one by using a store-bought pie crust rather than making my own. I was glad I did, as making the pie was still a lot of work. Next up was the cranberry sauce. Terri Peters I prepped Garten's make-ahead cranberry sauce the day before, too. I've made cranberry sauce from scratch before, but I prefer the canned variety, so I was curious how Garten's would stack up. The recipe called for tart Granny Smith apples, fres", "date_str": "2026-11-19T13:59:48+00:00", "hash": "d7c4a1415a0187ab", "title_fa": "من یک شام کامل شکرگزاری را فقط با استفاده از دستور العمل های Ina Garten درست کردم. اکثر غذاها خوشمزه و ارزان بودند.", "summary_fa": "من یک منوی آسان اینا گارتن برای شکرگزاری ایجاد کردم و فقط از دستور العمل های او برای ایجاد یک جشن حماسی تعطیلات استفاده کردم. تری پیترز من فقط با استفاده از دستور العمل های اینا گارتن یک جشن شکرگزاری درست کردم. اکثر آنها آسان و مقرون به صرفه بودند. بوقلمون، لوبیا سبز، قیمه، ماک و پنیر، پوره سیب زمینی، پای و سس کرن بری درست کردم. بعد از 10 ساعت آشپزی، غذای 12 نفره زیبا و پر از نکات خوشمزه بود. وقتی برای اولین بار به آشپزی علاقه مند شدم، زمان زیادی را صرف تماشای Ina Garten در شبکه غذا کردم و در کتاب های آشپزی و دستور پخت های او غواصی کردم. برای من، گارتن یکی از بزرگ‌هاست – بنابراین وقتی تصمیم گرفتم یک شام زودهنگام شکرگزاری را برای دوستان بپزم، بی‌معنی بود که منویی پر از دستور العمل‌های «کونتسا پابرهنه» تهیه کنم. مانند گارتن، من همه چیز را ساده و ظریف نگه داشتم و کلاسیک‌هایی مانند بوقلمون سوخاری، پوره سیب‌زمینی و لوبیا سبز را انتخاب کردم. اگرچه من بیش از 15 سال است که برای خانواده ام شام شکرگزاری درست می کنم، ترفندهای جدیدی یاد گرفتم و دستور العمل هایی را پیدا کردم که قطعاً دوباره درست خواهم کرد. در اینجا نحوه پختن غذای کامل در باغچه چگونه بود. پیدا کردن همه مواد به طرز شگفت آوری آسان بود. Terri Peters با این حال، از آنجایی که من دستور العمل های یک حرفه ای را دنبال می کردم، فکر کردم احتمالاً باید به چهار یا پنج فروشگاه مواد غذایی مختلف یا فروشگاه های تخصصی بروم تا همه مواد را جمع کنم. با این حال، لیست مواد غذایی من در واقع ساده بود، با بسیاری از اقلامی که به راحتی برای من تهیه می شد مانند لوبیا سبز تازه، گوجه فرنگی، ماکارونی آرنج، گوجه فرنگی، کره و پنیر", "image_url": "https://i.insider.com/6afdcd0e0b69407d788a3ecc?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۲۸ آبان • ۱۷:۲۹"}, {"source": "Business Insider", "title": "Travis Kalanick says he’d show up at Nvidia’s HQ with a ‘wafer-encrusted’ megaphone to back Jensen Huang’s return", "link": "https://www.businessinsider.com/travis-kalanick-jensen-huang-nvidia-hq-employee-walkout-2026-11", "summary": "Travis Kalanick at the TomorrowX Summit on Wednesday. Jordan Vonderhaar/Bloomberg via Getty Images Travis Kalanick is backing calls to bring back Jensen Huang as Nvidia CEO. He said a walkout is better than a petition, and he would support Nvidians with a \"wafer-encrusted\" megaphone. \"Let's fight for what's right and give it our best shot,\" the Uber cofounder added. Travis Kalanick says he would support an Nvidia walkout to reinstate Jensen Huang . \"I will show up to Nvidia HQ with a wafer-encrusted megaphone, with tons of Nvidia employees who want to walk out, tons of CEOs, founders,\" said Kalanick. Silicon wafers are used as the base material in AI chips. Speaking at the TomorrowX Summit in Austin on Wednesday, the former Uber CEO said he sent Huang screenshots of 2017 stories about a petition to reinstate him at the ride-hailing firm. Kalanick resigned from Uber under pressure following an investigation into its workplace culture that was prompted by a former engineer's allegations of sexual harassment and HR issues. \"I'm like, 'Petition good, walkout better,'\" Kalanick said at TomorrowX, adding that Huang didn't reply to his message. Onstage, Kalanick imitated Huang's trademark style by donning a black leather jacket. \"Yours looks a lot like Jensen's,\" said Antonio Gracias, a longtime ally and investor of Elon Musk, who was onstage with Kalanick. \"Yeah, we gotta bring Jensen back,\" Kalanick replied. Jensen Huang is known for his trademark leather jackets. Thomas Koehler/Photothek via Getty Images Kalanick said that in the future, AI should exist on humanity's terms rather than having power over us as an \"AI overlord.\" \"Jensen is the No. 1 guy that's going to give us that liberty, and stood for it,\" he added. \"That's why everybody here should be supporting him in coming back, because if we just care about that, that's enough,\" Kalanick said. \"But you should also care about justice and due process.\" Huang resigned from Nvidia last Thursday after the board began investigating whether he was the \"target of a foreign intelligence effort.\" The former CEO also apologized for being unfaithful to his wife. Although Huang said Tuesday that he would be \"honored\" to return and more than 200,000 people have signed a petition to reinstate him, the Nvidia board is not considering bringing him back, Business Insider reported. \"Let's fight for what's right and give it our best shot,\" Kalanick said of pushing for Haung's return. \"We don't have control of the outcome, bu", "date_str": "2026-11-19T13:40:37+00:00", "hash": "967ad4e816a22abc", "title_fa": "تراویس کالانیک می‌گوید که در مقر انویدیا با یک مگافون «ویفری پوشیده شده» برای حمایت از بازگشت جنسن هوانگ حاضر می‌شود.", "summary_fa": "تراویس کالانیک در نشست TomorrowX در روز چهارشنبه. جردن ووندرهار/ بلومبرگ از طریق Getty Images تراویس کالانیک از درخواست‌ها برای بازگرداندن جنسن هوانگ به عنوان مدیرعامل انویدیا حمایت می‌کند. او گفت که کناره گیری بهتر از یک طومار است و از Nvidians با یک مگافون \"ویفری پوشیده شده\" حمایت خواهد کرد. بنیانگذار اوبر افزود: \"بیایید برای آنچه درست است بجنگیم و بهترین تلاش خود را به کار ببریم.\" تراویس کالانیک می گوید که از کناره گیری انویدیا برای بازگرداندن جنسن هوانگ حمایت می کند. کالانیک گفت: «من با یک مگافون پوشیده از ویفر، با هزاران کارمند انویدیا که می‌خواهند بیرون بروند، تعداد زیادی مدیر عامل، بنیانگذار، به دفتر مرکزی انویدیا حاضر خواهم شد. ویفرهای سیلیکونی به عنوان ماده پایه در تراشه های هوش مصنوعی استفاده می شود. مدیر عامل سابق اوبر در روز چهارشنبه در نشست TomorrowX در آستین گفت که او اسکرین شات هایی از داستان های سال 2017 در مورد درخواستی برای بازگرداندن او به شرکت سواری ارسال کرده است. کالانیک پس از تحقیق در مورد فرهنگ محل کار اوبر که به دلیل ادعاهای یک مهندس سابق در مورد آزار جنسی و مسائل مربوط به منابع انسانی انجام شده بود، تحت فشار از اوبر استعفا داد. کالانیک در TomorrowX گفت: «من می‌گویم: «طومار خوب است، بهتر است کناره‌گیری کنید»، و افزود که هوانگ به پیام او پاسخی نداد. روی صحنه، کالانیک با پوشیدن یک ژاکت چرمی مشکی از سبک علامت تجاری هوانگ تقلید کرد. آنتونیو گراسیاس، یکی از متحدان قدیمی و سر cially if they'll save you time and energy. And I write this as someone who does not have a dishwasher — I will happily handwash — and writes about home DIY projects professionally. I've been having my laundry picked up and delivered for about two years now, and I believe it's a life-changing investment. The process is fairly simple and very time-saving I usually put my laundry in the same few reusable bags. Sarah Everett When I use this service, I first schedule a pickup time with my laundromat. Then, I sort my laundry, separating anything I want hang-dried into a labeled packing cube, and apply a stain-stick treatment to any coffee spills or stubborn stains. From there, I leave my laundry in a zip-top tote bag or an Ikea Frakta bag outside my door. Next, an employee from the laundromat picks it up and sends me a photo text confirmation that they have it. Once it's picked up, I've gotten about two to two and a half hours of my life back. My laundry will get done while I'm working, hanging in the park, doing other household chores, or watching TV — whatever I want to do with my time. When it's ready, the laundry is dropped off at my door in the same bags, just a little more consolidated: The clothes are flat, wrinkle-free, and folded. My hang-dry items are on ", "date_str": "2026-11-19T13:36:01+00:00", "hash": "9788a5fb82ae4d76", "title_fa": "من هر ماه لباس‌هایم را می‌گیرم، می‌شویم و تحویل می‌دهم. ارزش هر پنی را دارد - و یک ایده هدیه شگفت انگیز.", "summary_fa": "مادرم به مدت یک سال برای من پول داد تا لباس‌هایم را بردارم، بشویم و تحویل بدهم. بهترین هدیه بود سارا اورت بهترین هدیه ای که دریافت کردم این بود که لباس هایم را برداشت، شستم و تحویل دادم. من در شهر نیویورک زندگی می کنم و برای تحویل گرفتن، شستن و تحویل لباس هایم پول می پردازم. مادرم در ابتدا این هدیه متفکرانه را به من داد، اگرچه این یک ولخرجی است که من بارها و بارها برای آن پرداخت خواهم کرد. وقتی برای اولین بار به بروکلین نقل مکان کردم، شستن لباس به این شکل بود: یک تن لباس (که به دلیل بیزاری از روز لباسشویی رو lfillment, we have more volume going through our US stores than ever before,\" he said. On the call, Furner said adoption of Walmart's Sparky AI shopping assistant more than doubled since last year. It also added language support for Spanish and French and expanded access to Canada, Mexico, and Sam's Club. And at the company's warehouse chain, Sam's Club, fuel accounted for nearly half of the quarter's 9.7% sales growth as high gas prices during the quarter stretched ", "date_str": "2026-11-19T12:15:13+00:00", "hash": "7f06e8844f15e5c8", "title_fa": "فروشگاه‌های Walmart شلوغ‌تر از همیشه هستند، حتی با کاهش خرید در فروشگاه‌ها", "summary_fa": "قیمت بالای سوخت در سه ماهه گذشته به رشد فروش در Walmart و Sam s Club کمک کرد. Charles-McClintock Wilson/NurPhoto از طریق Getty Images والمارت با آمدن خریداران به دنبال بنزین و خواربارفروشی، سه ماهه دیگر رشد فروش را به ارمغان آورد. این غول خرده فروشی در این ماه یک میلیون بوقلمون بیشتر از نوامبر گذشته فروخت. در Sam's Club، سوخت تقریباً نیمی از رشد فروش بالای سه ماهه را به خود اختصاص داده است. به نظر می رسد که چرخ فلای والمارت در حال جمع آوری بخار است زیرا خریداران به دنبال ارزش و راحتی هستند. این غول خرده فروشی سه ماهه دیگر رشد فروش را در روز پنج شنبه ثبت کرد و مجموع درآمد آن 188.8 میلیارد دلار در سه ماهه بود که 5.2 درصد نسبت به سال گذشته و بالاتر از انتظارات تحلیلگران افزایش داشت. مدیر عامل جان فورنر در طول تماس با شرکت گفت: \"همانطور که خرید با ما راحت تر می شود، مشتریان بیشتر به ما مراجعه می کنند. این امر تجارت خرده فروشی ما را رشد می دهد و فرصت بیشتری برای عضویت، بازار و تبلیغات ایجاد می کند.\" فورنر همچنین گفت که والمارت منتظر یک فصل تعطیلات قوی است که باعث می شود راهنمایی های خود را برای کل سال افزایش دهد. او گفت که Walmart در این ماه یک میلیون بوقلمون بیشتر از نوامبر گذشته فروخته است. در بخش ایالات متحده، فروش قابل مقایسه 2.9٪ افزایش یافت، که به دلیل رشد خواربارفروشی و افزایش بازدید از خریداران با درآمد بالاتر بود. این شرکت گفت قوانین جدید در مورد قیمت گذاری دارویی حدود یک درصد از عملکرد فروش قابل مقایسه آن را کاهش داده است.       media: [{"source": "Billboard", "title": "Olivia Dean, Amy Lee & More Receive PLUS1 Impact Awards: Full List", "link": "https://www.billboard.com/pro/plus1-impact-awards-2026-full-list/", "summary": "Olivia Dean and Amy Lee of Evanescence — both past Grammy winners for best new artist — are among the winners of the third annual PLUS1 Impact Awards, which recognize the artists, industry leaders and partners driving measurable social impact across music and entertainment. The 2026 honorees span a wide range of causes and initiatives, including food access, youth arts education, grassroots community support and sustained philanthropic efforts. The awards recognize contributions from across the music industry, including artists, agents, managers, promoters, venues, festivals and other industry professionals. Related Sabrina Carpenter, Mumford Sons Among PLUS1 Impact Award Honorees for Social Impact: Full List Underscores Is First Transgender Woman Nominated for Best Dance/Electronic Recording Grammy Ella Langley Becomes First Act to Earn Top Two of TouchTunes Frontline Chart The music industry has an incredible ability to bring people and resources together around causes that matter, Marika Anthony-Shaw, founder and CEO of PLUS1, said in a statement. We re proud to recognize the artists and partners who are using their influence to support communities and create lasting impact, both on and off the stage. The PLUS1 Impact Awards recognize honorees based on their contributions to social impact through PLUS1, including funds raised, community engagement, ongoing philanthropic commitments and leadership in advancing meaningful initiatives. I think music has a really special ability to bring people together, and it s important to think about how we can use that connection to do something positive,” said Dean, who is receiving the Impact Leader Award for making the biggest impact through PLUS1 in 2026. “I m grateful to be recognized by PLUS1 and to be part of a community that believes in using music to make a difference.” “Giving back has always been important to us, and feels more crucial than ever,” said Evanescence s Lee, Outstanding Contribution Award honoree. “We are determined to use the platform we ve built to bring attention and resources to communities around the world that need them. Food, medical care, things we can’t take for granted. We are so grateful to PLUS1 for making that work possible and for recognizing the artists who are committed to doing more.” There s so much work that happens behind the scenes to help artists bring their philanthropic commitments to life,” said Eli Gelernter of THE·TEAM, who received the Agent of Change Award. “It s rew", "date_str": "2026-11-19T14:17:00+00:00", "hash": "991fca65fb9a1451", "title_fa": "اولیویا دین، امی لی و بیشتر جوایز PLUS1 Impact: فهرست کامل را دریافت کردند", "summary_fa": "اولیویا دین و امی لی از Evanescence - هر دو برنده گذشته گرمی بهترین هنرمند جدید - از جمله برندگان سومین جایزه سالانه PLUS1 Impact هستند که هنرمندان، رهبران صنعت و شرکای تاثیر اجتماعی قابل اندازه گیری را در موسیقی و سرگرمی به رسمیت می شناسند. برگزیدگان 2026 طیف وسیعی از دلایل و ابتکارات را شامل می‌شوند، از جمله دسترسی به غذا، آموزش هنر جوانان، حمایت از جامعه مردمی و تلاش‌های بشردوستانه پایدار. این جوایز مشارکت‌های سراسر صنعت موسیقی، از جمله هنرمندان، عوامل، مدیران، مروجین، مکان‌ها، جشنواره‌ها و دیگر متخصصان صنعت را به رسمیت می‌شناسند. مربوط به سابرینا کارپنتر، پسران مامفورد در میان برندگان جایزه PLUS1 Impact برای تأثیر اجتماعی: فهرست کامل نشان می‌دهد اولین زن تراجنسیتی است که نامزد بهترین رقص/ضبط الکترونیکی گرمی می‌شود. آنتونی شاو، بنیانگذار و مدیر عامل PLUS1 در بیانیه ای گفت. ما مفتخریم که هنرمندان و شرکایی را که از نفوذ خود برای حمایت از جوامع و ایجاد تأثیر ماندگار در صحنه و خارج از صحنه استفاده می‌کنند، بشناسیم. جوایز PLUS1 Impact جوایز برگزیدگان را بر اساس مشارکت‌هایشان در تأثیر اجتماعی از طریق PLUS1، از جمله بودجه جمع‌آوری‌شده، مشارکت جامعه، تعهدات بشردوستانه مداوم و رهبری در پیشبرد ابتکارات معنا     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
