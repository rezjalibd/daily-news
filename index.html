ورود، ایمیل‌ها یا اعلان‌های بانکی روی"}, {"source": "Business Insider", "title": "Fixing transportation issues is key to getting more workers into US submarine yards and keeping them, Navy official says", "link": "https://www.businessinsider.com/fixing-transportation-issues-us-submarine-workers-key-navy-official-2026-9", "summary": "One program has provided nearly $200,000 for transportation via gas cards and bus passes, the office said. US Navy Photo by John Narewski Transportation to submarine yards can be a hiring challenge for the US Navy. Programs have offered workers gas cards and bus passes to make commuting easier. The Navy is looking at local barriers as it races to expand the submarine workforce. Beyond pay, work-life balance, and scheduling, there are other basic challenges affecting the US submarine workforce, including how workers get to the job, a Navy official overseeing workforce concerns shared. The Navy's Submarine Industrial Base Program Office says it, along with its federal and state partners, has observed success in addressing region-specific problems, like transportation, that can be make-or-break for attracting new workers . Regional teams have been critical in examining the particular workforce needs around submarine construction and repair yards. Erica Logan, the office's director of workforce, told Business Insider earlier this year that her team looks at local factors, including education, demographics, unemployment, and cost of living. Transportation is also part of the assessment. \"What does the transportation system look like? Is it a very rural area where there may not be transportation?\" Logan said. \"How would we get folks there? What could we do to help a supplier that lives in an area like that?\" The office, she said, has supported several transportation pilots with bus systems to make it easier for submarine workers to get to and from work. These programs have prompted further questions about free bus passes and van pools. \"I think we've done a lot in that area using this regional approach to really just get a good understanding of what that region has,\" Logan said. The Navy's Submarine Industrial Base Program Office is working on rebuilding the network of suppliers, builders, and manufacturers that construct Navy submarines . As part of the broader efforts to fix decades-old shipbuilding problems in the US, the office has focused on attracting and retaining workers, as well as addressing everything from pay and work-life balance to problems unique to individual communities. In one example provided by the office, General Dynamics Electric Boat partnered with the Rhode Island Public Transit Authority to provide direct service to the Quonset Point shipyard. Ridership has more than doubled year over year, the office said, and it came at no cost to the ", "date_str": "2026-09-27T12:33:01+00:00", "hash": "e646e1ffe342bb5e", "title_fa": "یک مقام نیروی دریایی می گوید که رفع مشکلات حمل و نقل برای جذب کارگران بیشتر به محوطه زیردریایی های ایالات متحده و نگه داشتن آنها کلیدی است.", "summary_fa": "این دفتر گفت که یک برنامه نزدیک به 200,000 دلار برای حمل و نقل از طریق کارت های بنزین و کارت اتوبوس فراهم کرده است. عکس نیروی دریایی ایالات متحده توسط John Narewski حمل و نقل به محوطه زیردریایی می تواند یک چالش استخدام برای نیروی دریایی ایالات متحده باشد. برنامه‌ها برای آسان‌تر کردن رفت‌وآمد به کارگران کارت‌های بنزین و کارت اتوبوس ارائه می‌دهند. نیروی دریایی در حالی که برای توسعه نیروی کار زیردریایی تلاش می کند، به موانع محلی نگاه می کند. یکی از مقامات نیروی دریایی ناظر بر نگرانی های نیروی کار گفت: فراتر از دستمزد، تعادل بین کار و زندگی، و برنامه ریزی، چالش های اساسی دیگری نیز وجود دارد که بر نیروی کار زیردریایی ایالات متحده تأثیر می گذارد، از جمله چگونگی رسیدن کارگران به کار. دفتر برنامه پایگاه صنعتی زیردریایی نیروی دریایی می‌گوید که همراه با شرکای فدرال و ایالتی خود، موفقیت‌هایی را در رسیدگی به مشکلات خاص منطقه مانند حمل‌ونقل مشاهده کرده‌اند که می‌تواند برای جذب کارگران جدید مشکل ساز باشد. تیم های منطقه ای در بررسی نیازهای نیروی کار خاص در اطراف محوطه های ساخت و ساز و تعمیر زیردریایی بسیار مهم بوده اند. اریکا لوگان، مدیر نیروی کار دفتر، در اوایل سال جاری به Business Insider گفت که تیم او به عوامل محلی از جمله تحصیلات، جمعیت شناسی، بیکاری و هزینه های زندگی توجه می کند. حمل و نقل نیز بخشی از ارزیابی است. \"سیستم حمل و نقل چگونه به نظر می رسد؟ آیا این منطقه بسیار روستایی است که ممکن است حمل و نقل نباشد؟\" لوگان گفت. \"چگونه مردم را به آنجا برسانیم؟ برای کمک به تامین کننده ای که در چنین منطقه ای زندگی می کند، چه کاری می توانیم انجام دهیم؟\" او گفت که این دفتر چندین خلبان حمل و نقل را با سیستم اتوبوس پشتیبانی کرده است تا"}, {"source": "Business Insider", "title": "I'm a dietitian who specializes in weight loss. Here are 4 fiber- and protein-rich breakfasts I eat when I'm tired of eggs.", "link": "https://www.businessinsider.com/breakfast-ideas-dietitian-weight-loss-fiber-protein-recipes-2026-9", "summary": "As a dietitian, I have a few go-to breakfasts in my rotation when I want to start my day with protein and fiber. Vanessa Imus I'm a dietitian who eats eggs often. When I need a change, I pick these easy, nutritious breakfasts . I focus on breakfasts with enough protein and fiber to help me stay full through the morning. Overnight oats, yogurt parfaits, smoothies, and avocado toast are my favorites. As a dietitian, eggs are a staple in my typical breakfast routine — and for good reason. They're high in protein, I really enjoy them, and they're fairly cheap. Plus, they're quick and easy to make, which is essential as a working mom of three. I typically pair them with vegetables and whole-grain toast or fruit for a more complete and filling meal. That way, I get plenty of fiber, protein, vitamins, and minerals first thing in the morning. Every now and then, though, I like to switch it up. Here are my non-egg go-to breakfasts that are easy to prepare and still fit into a balanced diet without falling short on protein and fiber. It takes me 5 minutes to whip up a batch of overnight oats that gives me 4 days' worth of breakfasts Overnight oats can be made in batches. Vanessa Imus I typically start with a basic recipe of 2 cups of oats, 2 ½ cups of milk (sometimes I use soy milk), ¼ cup of chia seeds, and 1 serving of protein powder. From there, I adapt by adding peanut butter, chocolate chips, and pecans, or blueberries, strawberries, and almond butter. There are so many variations of overnight oats online; everyone can find something that fits their taste buds. Oats are a great source of soluble fiber, which can help reduce elevated LDL, or \"bad,\" cholesterol and support digestive health. Adding nut butter gives this breakfast healthy fats that help support vitamin absorption and make it more satisfying. Each serving of this pudding usually provides me with just over 20 grams of protein and more than 10 grams of fiber, both of which help make this more filling and support steadier blood sugar. (Notably, this varies based on the protein powder and add-ins I use.) This breakfast also helps me reduce sugar cravings later in the day. It doesn't get much easier than a yogurt parfait Yogurt parfaits are easy to customize. Vanessa Imus I love that this breakfast requires minimal ingredients and can be tailored to any food preferences. I start with 2 tablespoons of granola, then layer on some fresh or frozen fruit — berries are my favorite since they're a great source ", "date_str": "2026-09-27T12:20:01+00:00", "hash": "3f93b6d8a9d6471c", "title_fa": "من یک متخصص تغذیه هستم که در کاهش وزن تخصص دارم. در اینجا 4 صبحانه سرشار از فیبر و پروتئین که وقتی از تخم مرغ خسته می‌شوم می‌خورم، آورده شده است.", "summary_fa": "به عنوان یک متخصص تغذیه، زمانی که می‌خواهم روزم را با پروتئین و فیبر شروع کنم، چند صبحانه را به صورت چرخشی می‌خورم. ونسا ایموس من یک متخصص تغذیه هستم که اغلب تخم مرغ می خورد. وقتی نیاز به تغییر دارم، این صبحانه های آسان و مقوی را انتخاب می کنم. من روی صبحانه هایی با پروتئین و فیبر کافی تمرکز می کنم تا به من کمک کند تا صبح سیر بمانم. جو دوسر شبانه، پارفی ماست، اسموتی ها و نان تست آووکادو مورد علاقه من هستند. به عنوان یک متخصص تغذیه، تخم مرغ جزء اصلی برنامه معمول صبحانه من است - و دلیل خوبی هم دارد. آنها سرشار از پروتئین هستند، من واقعا از آنها لذت می برم، و نسبتاً ارزان هستند. به علاوه، آنها سریع و آسان ساخته می شوند، که به عنوان یک مادر شاغل سه فرزند ضروری است. من معمولا آنها را با سبزیجات و نان تست سبوس دار یا میوه برای یک وعده غذایی کاملتر و سیر کننده تر می کنم. به این ترتیب، اول صبح مقدار زیادی فیبر، پروتئین، ویتامین و مواد معدنی دریافت می کنم. هر چند وقت یکبار، من دوست دارم آن را تغییر دهم. در اینجا صبحانه‌های من بدون تخم‌مرغ است که به راحتی آماده می‌شوند و همچنان در یک رژیم غذایی متعادل بدون کمبود پروتئین و فیبر قرار می‌گیرند. 5 دقیقه طول می کشد تا یک دسته جو دو سر یک شبه درست کنم که به من 4 روز صبحانه می دهد. Vanessa Imus من معمولاً با دستور اولیه 2 فنجان جو، 2 ½ فنجان شیر (گاهی از شیر سویا استفاده می کنم)، ¼ فنجان دانه چیا و 1 وعده پودر پروتئین شروع می کنم. از آنجا، من با اضافه کردن کره بادام زمینی، چیپس شکلات، و گردو، یا زغال اخته، توت فرنگی و کره بادام سازگار می شوم. انواع"}, {"source": "Business Insider", "title": "I'm a matchmaker who charges up to $250,000. My clients want partners who are driven, but flexible.", "link": "https://www.businessinsider.com/matchmaker-wealthy-successful-clients-2026-9", "summary": "Matchmaker Sameera Sullivan works with men willing to pay $100,000 or more to find their partner. Photo credit: Jules Slütsky Sameera Sullivan has run a matchmaking business since 2013. Clients pay her up to $250,000, with the fee due before their first dates. She says dating apps have made people too picky, and she pushes back on client preferences. This as-told-to essay is based on a conversation with Sameera Sullivan . It has been edited for length and clarity . As far back as high school, I loved giving people dating advice . My mom could see that I had real skill, and she encouraged me. Yet, I didn't even know that matchmaking could be a business. Then, in 2012, I was recruited by a matchmaking agency. Before then, I'd studied psychology and worked in education and defense. The agency thought that background would make me good at helping others find love. When I started matchmaking, I knew I'd found what I was supposed to do. But I didn't like the way the agency operated, so I decided to go out on my own. Since then, I've personally matched more than 100 couples. I focus on quality, not quantity, but my results speak for themselves, and my clients are willing to pay for my expertise . Most pay between $100,000 and $150,000. But some — the really picky, specific ones — pay $250,000. I put a lot of work in up front, so they pay before we get started. Some successful men struggle to choose a partner All my clients are men , most in their 40s and 50s. I think of them in two groups: some are bad pickers, who have just never been great at choosing a partner. The others are coming out of a divorce. Those guys know what they want and what they don't. No matter what type of guy a client is, we do a lot of psychological work and neuroscience coaching. I ask about their past relationships, identify their personality type, and help them better understand themselves so they can see red, yellow, and green flags while they're dating. I have a database of about 22,000 women who are willing to be matched with my clients. I generally show the client about 15 profiles. From there, we work together to choose three women for them to go on dates with. Sameera Sullivan and her husband, Tim. Courtesy of Sameera Sullivan My clients want women with purpose, but flexibility Understanding what will make a relationship work takes a blend of skills. It's part empathy, part rationalization, and a little common sense. The men I work with are extremely successful and wealthy. They do", "date_str": "2026-09-27T12:07:01+00:00", "hash": "7a4dd5899adab9d7", "title_fa": "من یک خواستگاری هستم که تا 250000 دلار می گیرم. مشتریان من شرکایی می خواهند که هدایت شونده، اما انعطاف پذیر باشند.", "summary_fa": "کبریت ساز سامیرا سالیوان با مردانی کار می کند که مایل به پرداخت 100000 دلار یا بیشتر برای یافتن شریک زندگی خود هستند. اعتبار عکس: Jules Slütsky Sameera Sullivan از سال 2013 یک کسب و کار خواستگاری را اداره می کند. مشتریان تا 250,000 دلار به او می پردازند که هزینه آن قبل از اولین قرار ملاقاتشان پرداخت می شود. او می‌گوید اپلیکیشن‌های دوستیابی افراد را بسیار حساس کرده‌اند، و او ترجیحات مشتری را پس می‌زند. این مقاله گفته شده بر اساس گفتگو با سامیرا سالیوان است. برای طول و وضوح ویرایش شده است. از دوران دبیرستان، دوست داشتم به مردم مشاوره دوستیابی بدهم. مادرم می‌دانست که من مهارت واقعی دارم و مرا تشویق کرد. با این حال، من حتی نمی دانستم که خواستگاری می تواند یک تجارت باشد. سپس در سال 2012 توسط یک آژانس خواستگاری استخدام شدم. قبل از آن، من روانشناسی خوانده بودم و در آموزش و پرورش و دفاع کار می کردم. آژانس فکر می‌کرد که این پیشینه به من کمک می‌کند تا به دیگران کمک کنم عشق پیدا کنند. وقتی خواستگاری را شروع کردم، می دانستم که کاری را که قرار بود انجام دهم، پیدا کرده ام. اما روش کار آژانس را دوست نداشتم، بنابراین تصمیم گرفتم خودم بیرون بروم. از آن زمان، من شخصاً بیش از 100 زوج را با هم ست کردم. من روی کیفیت تمرکز می‌کنم، نه کمیت، اما نتایج من خودشان صحبت می‌کنند و مشتریان من حاضرند برای تخصص من هزینه بپردازند. اکثر آنها بین 100000 تا 150000 دلار پرداخت می کنند. اما برخی از آنها - افراد بسیار حساس و خاص - 250000 دلار می پردازند. من کارهای زیادی را پیشاپیش گذاشتم، بنابراین آنها قبل از شروع ما پول می دهند. برخی از مردان موفق برای انتخاب شریک زندگی با مشکل مواجه هستند. من آنها را در دو گروه فکر"}, {"source": "Business Insider", "title": "A NATO defense minister warns that the alliance needs to learn how to disperse weapons production before it's at war", "link": "https://www.businessinsider.com/nato-must-learn-disperse-weapons-making-before-war-minister-ukraine-2026-9", "summary": "NATO member Latvia wants to learn from how Ukraine makes weapons more dispersed and underground and industry s close relationship with soldiers. Ukrinform/NurPhoto via Getty Images A NATO defense minister wants his arms makers to work with Ukrainian ones and learn. This includes how they work across multiple sites during wartime to avoid devastating attacks. \"Our industry is a peacetime establishment,\" Latvia's defense minister said. NATO militaries need to learn how to disperse weapons production, as Ukraine does, before entering a war to preserve their ability to keep producing while under attack, a senior defense official advised. Raivis Melnis, the defense minister of Latvia, an alliance and EU member state bordering Russia, told Business Insider that industry in the West might not be ready to operate as it would need to in wartime. Ukrainian arms makers split up manufacturing across multiple sites, operate underground, and even move around to prevent a single successful Russian strike from having a huge impact on their operations. But in Europe, many companies run projects from larger factories, which could become a single point of failure. \"Our industry is a peacetime establishment\" that has been built under conditions where \"there is no threat,\" Melnis said. NATO companies work in a far more concentrated way, he said, and \"the question is whether we are ready to produce the systems in different locations, dispersed, and how we organize that.\" He said this is why he encourages partnerships between Latvian and Ukrainian defense companies, so they can learn from how the Ukrainian companies operate , including how their systems are \"built for war purposes.\" Ukraine has also demonstrated how a country \"can provide that reassurance if, for instance, an industry site is destroyed.\" Kyiv offers compensation for some business properties damaged or destroyed in Russian attacks and is planning additional support. Ukrainian officials and company leaders have been pushing for Western companies to adopt a more disaggregated approach to prepare for the possibility of a wider conflict. Davyd Aloian, the deputy secretary of Ukraine's National Security and Defense Council, told Business Insider that the Russian threat to Europe is so substantial that companies across NATO should \"definitely\" start breaking up their production more. Mykyta Rozhkov, the chief business development officer at Ukrainian arms maker Frontline Robotics, told Business Insider that some allian", "date_str": "2026-09-27T11:57:01+00:00", "hash": "23cb86394c386816", "title_fa": "یک وزیر دفاع ناتو هشدار می دهد که این ائتلاف باید یاد بگیرد که چگونه تولید تسلیحات را قبل از شروع جنگ پراکنده کند", "summary_fa": "لتونی عضو ناتو می‌خواهد از چگونگی پراکندگی سلاح‌های اوکراین و روابط نزدیک زیرزمینی و صنعتی با سربازان بیاموزد. Ukrinform/NurPhoto via Getty Images یک وزیر دفاع ناتو از سازندگان اسلحه خود می خواهد که با سازندگان اوکراینی کار کنند و یاد بگیرند. این شامل نحوه کار آنها در چندین سایت در زمان جنگ برای جلوگیری از حملات ویرانگر است. وزیر دفاع لتونی گفت: «صنعت ما یک تأسیسات در زمان صلح است. یک مقام ارشد دفاعی توصیه کرد که نظامیان ناتو باید یاد بگیرند که چگونه تولید تسلیحات را پراکنده کنند، همانطور که اوکراین انجام می دهد، قبل از اینکه وارد جنگ شوند تا توانایی خود را برای ادامه تولید در هنگام حمله حفظ کنند. رایویس ملنیس، وزیر دفاع لتونی، یک ائتلاف و کشور عضو اتحادیه اروپا که هم مرز با روسیه است، به Business Insider گفت که صنعت در غرب ممکن است آنطور که در زمان جنگ نیاز است آماده فعالیت نباشد. سازندگان تسلیحات اوکراینی تولیدات خود را در چندین سایت تقسیم کردند، زیرزمینی فعالیت می‌کنند، و حتی در اطراف حرکت می‌کنند تا از تأثیرگذاری یک حمله موفق روسیه بر عملیات‌هایشان جلوگیری کنند. اما در اروپا، بسیاری از شرکت‌ها پروژه‌هایی را از کارخانه‌های بزرگ‌تر اجرا می‌کنند که می‌تواند به یک نقطه شکست تبدیل شود. ملنیس گفت: «صنعت ما یک تأسیسات در زمان صلح است» که در شرایطی ساخته شده است که «هیچ تهدیدی وجود ندارد». او گفت که شرکت های ناتو به روشی بسیار متمرکزتر کار می کنند و \"سوال این است که آیا ما آماده تولید این سیستم ها در مکان های مختلف، پراکنده، و نحوه سازماندهی آن هستیم.\" او گفت که به همین دلیل است که او مشارکت بین شرکت‌های دفاعی لتونی و اوکراینی را تشویق می‌کند تا آنها بتوانند از نحوه عملکرد شرکت‌های اوکراینی، از جمله اینکه چگونه سیستم‌های آنها \"برای اهداف جنگی ساخته شده‌اند\" بیاموزند. اوکراین همچنین"}, {"source": "Business Insider", "title": "I moved countries for love in my late 40s. I had to rebuild my career, friendships, and identity.", "link": "https://www.businessinsider.com/moved-abroad-for-love-midlife-starting-over-2026-9", "summary": "The author moved after being long distance. Courtesy of the author I moved from India to Austria for my partner in my late 40s. I left an established career, close friendships, and a life I'd spent decades building. Starting over taught me that reinvention is possible at any age. I was in a long-distance relationship when I moved from India to join my partner in Austria. I first met him four years earlier while doing what I loved best — introducing travelers to India as an Airbnb experience host. We connected instantly. Two years later, in the middle of the pandemic, we became life partners. After another gap for visa formalities, I joined him in Austria. Unlike most people who make this shift in their 20s, I was doing it in my late 40s. It was a difficult decision because I was at the peak of my career as a content creator at a New York-based agency and had built a life in a city I loved. Many people said it was a mistake. But today, after relocating during a pandemic, making a cultural transition into another country, learning a new language , and reestablishing my career in the most unconventional way, we have built a life we love. Our relationship is stronger My move to Austria during the pandemic was slow. While cross-border moves usually involve bureaucratic hurdles, the pandemic made them even more complex. The author moved in her 40s to be with her partner. Courtesy of the author But we prepared carefully and fulfilled all legal requirements. Facing uncertainty together made us more certain of our plans and drew us closer. It helped us build the resilience we needed for the path ahead. Home is something you build together, not a place where you are born One of the most difficult things I had to do was gather over 40 years' worth of belongings into a bag. Doing that showed me how to downsize my life to what really mattered. When I arrived in Austria, my partner's things were still in boxes in our new house. I added my suitcase to them and we unpacked everything we owned. We built our home by making it a space that reflected both our identities. It's never too late to start again The difficult part about moving later in life is rebuilding your old systems from scratch. Not just the big things like settling into a new home or finding a job, but also the small things like figuring out how public transport works or navigating bureaucracy in a new country . The author says it s never too late to start again. Courtesy of the author I rebuilt my old system", "date_str": "2026-09-27T11:48:01+00:00", "hash": "14329b06c090e8da", "title_fa": "من در اواخر دهه 40م به خاطر عشق کشورها را نقل مکان کردم. من باید حرفه، دوستی ها و هویتم را بازسازی می کردم.", "summary_fa": "نویسنده پس از طی مسافت طولانی حرکت کرد. با حسن نیت نویسنده من در اواخر دهه 40م برای شریک زندگیم از هند به اتریش نقل مکان کردم. من یک شغل تثبیت شده، دوستی های نزدیک و زندگی ای را که چندین دهه صرف ساختن آن کرده بودم، ترک کردم. شروع دوباره به من آموخت که اختراع مجدد در هر سنی امکان پذیر است. زمانی که از هند نقل مکان کردم تا به شریک زندگیم در اتریش بپیوندم، در یک رابطه از راه دور بودم. من برای اولین بار چهار سال قبل با او ملاقات کردم، در حالی که کاری را انجام می دادم که بیشتر دوست داشتم - معرفی مسافران هند به عنوان میزبان تجربه Airbnb. ما فورا وصل شدیم. دو سال بعد، در میانه همه گیری، ما شریک زندگی شدیم. پس از یک شکاف دیگر برای تشریفات ویزا، در اتریش به او پیوستم. برخلاف بسیاری از افرادی که این تغییر را در دهه 20 خود انجام می دهند، من در اواخر دهه 40 زندگی خود را انجام می دادم. این تصمیم دشواری بود زیرا من در اوج کار خود به عنوان یک سازنده محتوا در یک آژانس مستقر در نیویورک بودم و زندگی را در شهری که دوست داشتم ساخته بودم. خیلی ها گفتند اشتباه بود. اما امروز، پس از جابجایی در طی یک بیماری همه گیر، انتقال فرهنگی به کشوری دیگر، یادگیری یک زبان جدید، و برقراری مجدد حرفه ام به غیر متعارف ترین روش، زندگی ای را ساخته ایم که دوستش داریم. رابطه ما قوی تر است حرکت من به اتریش در طول همه گیری به کندی انجام شد. در حالی که حرکت های فرامرزی معمولاً شامل موانع بوروکراتیک است، بیماری همه گیر آنها را پیچیده تر کرد. نویسنده در 40 سالگی نقل مکان کرد تا با شریک زندگی خود باشد. با حسن نیت از نویسنده، اما"}, {"source": "Business Insider", "title": "The British military is feeding a 'load of data' from the war in Ukraine into its next-gen Challenger 3 main battle tank", "link": "https://www.businessinsider.com/britains-new-main-battle-tank-evolving-alongside-ukraine-war-2026-9", "summary": "The next-generation Challenger 3 tank is absorbing lessons from the war. Rheinmetall BAE Systems Land/Screengrab via YouTube Britain's next-generation main battle tank is being developed and enhanced amid the war in Ukraine. The new tank is a fully modernized version of the decades-old Challenger 2, which Ukraine operates. It will feature a digital overhaul and new weaponry that make it more compatible with NATO. As drones completely reshape how armored vehicles are used on the battlefield in Ukraine, the developers behind the British Army's next-generation tank are taking these lessons into account. Britain's Challenger 3 main battle tank is intended as a major upgrade over its predecessor, which is in service with both the British Army and the Ukrainian military. The new tank will feature a digital overhaul and new weaponry that make it more compatible with other NATO forces . \"We're taking a load of data from Ukraine\" and feeding it into the Challenger 3 development, a UK defense ministry spokesperson told Business Insider at an exhibition near London last week. The tank has a smart targeting system built primarily for combating enemy armor, but it can be adapted to detect hostile drones, a major threat on the modern battlefield. For protection, the tank is equipped with explosive reactive armor. New features for the Challenger 3 are modular, meaning they can be swapped in and out, the spokesperson said, adding that Britain has options for drone-related equipment that can be installed as needed. British Army officers told Business Insider at the UK defense industry exhibition that the UK is learning lessons from Ukraine, not only for the development of the Challenger 3, but for armored vehicles in general, like how they can remain survivable on a modern battlefield. The officers emphasized that the version of the new Challenger 3 tank that exists today is not a finished product; the core platform will continue to be improved to keep pace with changes in modern warfare. The Challenger 3 is the successor to the decades-old Challenger 2. Rheinmetall BAE Systems Land/Screengrab via YouTube In 2021, the UK defense ministry awarded Rheinmetall BAE Systems Land a $1 billion contract to upgrade roughly 150 Challenger 2 tanks , which entered service with the British Army nearly three decades ago and have seen combat in the Middle East and Ukraine. The new upgraded tanks, designated as Challenger 3s, were designed as digital fighting vehicles with state-of-the-ar", "date_str": "2026-09-27T11:25:01+00:00", "hash": "4d102a4743394333", "title_fa": "ارتش بریتانیا \"باری از داده ها\" از جنگ اوکراین را به تانک اصلی جنگی چلنجر 3 خود وارد می کند.", "summary_fa": "نسل بعدی تانک چلنجر 3 درس های جنگ را جذب می کند. Rheinmetall BAE Systems Land/Screengrab از طریق یوتیوب تانک اصلی نبرد نسل بعدی بریتانیا در بحبوحه جنگ در اوکراین در حال توسعه و بهبود است. تانک جدید نسخه کاملاً مدرنیزه شده چلنجر 2 چند دهه ای است که اوکراین آن را اداره می کند. این هواپیما دارای تعمیرات اساسی دیجیتال و تسلیحات جدیدی است که آن را با ناتو سازگارتر می کند. از آنجایی که هواپیماهای بدون سرنشین به طور کامل نحوه استفاده از وسایل نقلیه زرهی در میدان نبرد در اوکراین را تغییر می دهند، توسعه دهندگان تانک نسل بعدی ارتش بریتانیا این درس ها را در نظر می گیرند. تانک اصلی نبرد چلنجر 3 بریتانیا به عنوان یک ارتقاء بزرگ نسبت به نمونه قبلی خود در نظر گرفته شده است که هم در خدمت ارتش بریتانیا و هم ارتش اوکراین است. تانک جدید دارای تعمیرات اساسی دیجیتال و تسلیحات جدیدی است که آن را با سایر نیروهای ناتو سازگارتر می کند. سخنگوی وزارت دفاع بریتانیا هفته گذشته در نمایشگاهی در نزدیکی لندن به Business Insider گفت: «ما حجم زیادی از داده‌ها را از اوکراین می‌گیریم» و آن‌ها را به توسعه Challenger 3 می‌دهیم. این تانک دارای یک سیستم هدف‌گیری هوشمند است که عمدتاً برای مبارزه با زره‌های دشمن ساخته شده است، اما می‌توان آن را برای شناسایی پهپادهای متخاصم که یک تهدید بزرگ در میدان نبرد مدرن است، سازگار کرد. برای محافظت، تانک به زره واکنشی انفجاری مجهز شده است. سخنگوی چلنجر 3 گفت که ویژگی‌های جدید چلنجر 3 ماژولار هستند، به این معنی که می‌توان آن‌ها را در داخل و خارج تعویض کرد و افزود که بریتانیا گزینه‌هایی برای تجهیزات مرتبط با پهپاد دارد که می‌توانند در صورت نیاز نصب شوند. افسران ارتش بریتانیا در نمایشگاه صنایع دفاعی بریتانیا به Business Insider گفتند که بریتانیا از"}, {"source": "Business Insider", "title": "My husband has been going on the same family trip every year since he was a baby. Now, we get to bring our daughter.", "link": "https://www.businessinsider.com/same-family-trip-annually-now-daughter-comes-too-2026-9", "summary": "The author s husband goes to the same place every summer for a family reunion. Last year, their daughter joined for the first time. Courtesy of Riana Ang-Canning My husband's family goes to the same place every year for a family reunion. I started going with him in 2015, and last year, our daughter went for the first time. I'm excited to continue the family tradition with the next generation. Every year, my husband's family gathers on the Sunshine Coast of British Columbia, Canada, for a long weekend family reunion . They fish, swim, hike, roast marshmallows around the campfire, and catch up on the back deck. The weekend culminates in the annual horseshoe tournament, where the winners add their names to the trophy and we all celebrate with a potluck roast dinner . My husband, Colin, has been going up to the Sunshine Coast every year since he was a baby. There's a tree on the property that he planted in elementary school that now stands over 40 feet tall. I started attending with him in 2015, first as his girlfriend and then in 2022, as his wife. And now we get to share this annual family tradition with our daughter. Last year, our daughter joined the family trip for the first time In 2025, we got to bring our daughter up to the Sunshine Coast for the first time. Not only was it her first time joining the family trip, but at 5 months old, it was her first trip ever. It was so fun to bring our daughter along and to introduce her to my husband's extended family . We spent most of our trip out on the back deck, where our daughter lay on a blanket, entertaining her relatives. The fresh air even helped her sleep through the night! In between naps and nursing, we squeezed in a family hike and a quick swim. But overall, it was a very laid-back vacation with our baby. The couple enjoys seeing their daughter experience the Sunshine Coast. Courtesy of Riana Ang-Canning This year, with a toddler, it was a completely different trip When we headed back up to the Sunshine Coast in July 2026, we knew it was going to be a totally different trip than the year before. This time, we had an 18-month-old toddler who was on the move, eating full meals, and only napping once per day. It was a lot more work to keep up with our daughter this year. Colin and I were constantly checking that someone was with her and taking inventory of everything she might need (toys, snacks, a life jacket, a water bottle, etc.). But it was also a lot of fun. Last year, she wasn't crawling or walking ", "date_str": "2026-09-27T11:17:01+00:00", "hash": "503579310588fb52", "title_fa": "شوهرم از بچگی هر سال به همین سفر خانوادگی می رفت. حالا باید دخترمان را بیاوریم.", "summary_fa": "شوهر نویسنده هر تابستان برای دیدار خانوادگی به همان مکان می رود. سال گذشته برای اولین بار دخترشان پیوست. با حسن نیت ریانا آنگ کانینگ خانواده شوهرم هر سال برای یک گردهمایی خانوادگی به همان مکان می روند. من از سال 2015 با او رفتم و پارسال برای اولین بار دخترمان رفت. من هیجان زده هستم که سنت خانواده را با نسل بعدی ادامه دهم. هر سال، خانواده شوهرم در ساحل آفتاب بریتیش کلمبیا، کانادا گرد هم می‌آیند تا برای یک گردهمایی طولانی آخر هفته خانوادگی. آنها ماهی می گیرند، شنا می کنند، پیاده روی می کنند، گل ختمی را در اطراف آتش کباب می کنند و به عرشه پشتی می رسند. آخر هفته با تورنمنت سالانه نعل اسبی به اوج می رسد، جایی که برندگان نام خود را به جام اضافه می کنند و همه ما با یک شام کباب شده جشن می گیریم. شوهرم، کالین، از زمانی که نوزاد بود، هر سال به ساحل آفتاب می‌رفت. درختی در ملکی که در مدرسه ابتدایی کاشته بود وجود دارد که اکنون بیش از 40 فوت ارتفاع دارد. در سال 2015 ابتدا به عنوان دوست دخترش و سپس در سال 2022 به عنوان همسرش با او شرکت کردم. و اکنون می‌توانیم این سنت خانوادگی سالانه را با دخترمان به اشتراک بگذاریم. سال گذشته، دخترمان برای اولین بار به سفر خانوادگی ملحق شد در سال 2025، برای اولین بار باید دخترمان را به ساحل آفتاب بیاوریم. نه تنها اولین باری بود که او به سفر خانوادگی می‌پیوندد، بلکه در 5 ماهگی، اولین سفر او بود. آوردن دخترمان و معرفی او به خانواده بزرگ شوهرم بسیار سرگرم کننده بود. بیشتر سفرمان را روی عرشه پشتی گذراندیم، جایی که دخترمان روی یک پتو دراز کشیده بود و از اقوامش پذیرایی می کرد. هوای تازه حتی به او کمک کرد تا تمام شب بخوابد! در"}, {"source": "Business Insider", "title": "My sister and I started a small business reselling vintage items. Here's what everyone gets wrong about our business.", "link": "https://www.businessinsider.com/what-people-get-wrong-about-small-business-reselling-vintage-2026-9", "summary": "The author (right) and her sister run a small business together. Courtesy of Amanda Leigh Lichtenstein My sister and I ruin a small business together, reselling vintage items we find in thrift stores. It's not as simple as it seems because we have to sift through thrift stores and estate sales. I don't worry about the ethics of upcycling vintage items because I'm providing a service. My heart flutters every time I spot a unique vintage treasure in the tchotchke aisle at the thrift store. But then I realize it has a chip or a crack, so I decide to put it back. The object may have sentimental value, but it's not a match for my vintage shop , where I always try to feature high-quality items that have survived the test of time. When my younger sister, Hillary, and I turned our love for vintage collecting into a small business nearly three years ago, we had no idea how hard it would be or how long it would take to sell a single vintage item . Most people think it's as simple as plucking an item, taking a few photos, crafting a savvy title, and plopping it on a platform. But there's way more that goes into running our tiny online vintage shop. We had to figure out the best places to source great items, how to navigate moody markets, how to do deep-dive historical research, how to clean and restore fragile pieces, how to set up systems, how to determine the value of our vintage objects, and, most importantly, how to learn to tell their stories. We have to dig, sift, and sort To source great items for the shop, Travel Far Now Vintage, my sister and I love a good thrift haul, estate sale dig, antique mall stroll, or flea market frenzy. But in the early days of selling vintage items, we started with the stuff in our own childhood home . Our mother collected all kinds of objects, from porcelain flowers to royal portraits in filigree frames, and we didn't know quite what to do with them all when she died. We were excited to discover a vast online world of collectors seeking niche nostalgia. As the shop grew, we widened and diversified our search. We learned that consistency is key. These days, we source items three to five times a week. This work has led us into all kinds of scenarios: scaling mold-infested shelves, digging deep into dusty boxes, and sorting through basement barrels. Sometimes we walk away with a bundle of goodies. Other days, we leave empty-handed. But we always shop with criteria for what we're looking for and how much we're willing to spend. Pricin", "date_str": "2026-09-27T11:07:01+00:00", "hash": "1d40eb1e6a183212", "title_fa": "من و خواهرم یک کسب و کار کوچک با فروش مجدد اقلام قدیمی راه اندازی کردیم. این چیزی است که همه در مورد تجارت ما اشتباه می کنند.", "summary_fa": "نویسنده (راست) و خواهرش یک تجارت کوچک را با هم اداره می کنند. با حسن نیت آماندا لی لیختنشتاین من و خواهرم یک تجارت کوچک را با هم خراب می‌کنیم و اقلام قدیمی را که در فروشگاه‌های دستفروشی پیدا می‌کنیم دوباره می‌فروشیم. آنقدرها هم که به نظر می رسد ساده نیست، زیرا ما باید فروشگاه های دستفروشی و فروش املاک را غربال کنیم. من نگران اخلاقیات بالا بردن اقلام قدیمی نیستم زیرا در حال ارائه خدمات هستم. هر بار که یک گنج منحصر به فرد قدیمی را در راهروی tchotchke در فروشگاه صرفه جویی می بینم، قلبم می لرزد. اما بعد متوجه شدم که یک تراشه یا ترک دارد، بنابراین تصمیم می‌گیرم آن را برگردانم. این شی ممکن است ارزش احساسی داشته باشد، اما با فروشگاه قدیمی من، جایی که من همیشه سعی می‌کنم اقلام باکیفیتی را ارائه کنم که از آزمون زمان جان سالم به در برده‌اند، همخوانی ندارد. وقتی من و خواهر کوچکترم، هیلاری، تقریباً سه سال پیش عشق خود را به کلکسیون‌های قدیمی تبدیل به یک تجارت کوچک کردیم، نمی‌دانستیم که فروش یک کالای قدیمی چقدر سخت است یا چقدر طول می‌کشد. اکثر مردم فکر می‌کنند که این کار به سادگی چیدن یک آیتم، گرفتن چند عکس، ساختن یک عنوان هوشمندانه، و نمایش آن روی یک پلتفرم است. اما راه های بیشتری برای راه اندازی فروشگاه کوچک آنلاین قدیمی ما وجود دارد. ما باید بهترین مکان‌ها را برای تهیه اقلام عالی، نحوه پیمایش در بازارهای بد خلق، نحوه انجام تحقیقات تاریخی عمیق، نحوه تمیز کردن و بازیابی قطعات شکننده، نحوه راه‌اندازی سیستم‌ها، چگونگی تعیین ارزش اشیاء قدیمی‌مان، و مهم‌تر از همه، نحوه یادگیری داستان‌های آنها را پیدا می‌کردیم. ما باید حفاری کنیم، الک کنیم، و مرتب کنیم تا بتوانیم اقلام عالی را برای مغازه تهیه کنیم، در حال حاضر Vintage سفر کنیم، من و خواهرم عاشق حمل"}, {"source": "Business Insider", "title": "The best rain jackets for women in 2026", "link": "https://www.businessinsider.com/guides/style/best-rain-jacket-women", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Rachael Schultz/Business Insider I can tell the difference between a good rain jacket and a great rain jacket on sight. It's made clear the moment you're caught in sudden downpour without an umbrella . Before all else, let's establish that water-repellent, water-resistant, and waterproof are not equal terms. For this guide, I've made sure to recommend only the most effectively water proof styles that effectively seal out all moisture. My main takeaway: Outdoor Research's Aspire 3L is the best rain jacket I tested. It's fully waterproof with taped seams, vents to release heat, and a well-designed hood I can cinch down when the wind picks up. That said, the best rain jackets for women go beyond waterproofing. A high-quality raincoat must also have zippered heat vents and an adjustable hood to keep you comfortable while you're on the move. I lived in New York for five years and have lived in the Colorado mountains for eleven, so I know firsthand what makes a rain jacket good for bustling commutes and long days outdoors. After putting 33 leading rain jackets to the test, these eight offered supreme waterproofing, great breathability, and nice-to-have features that make them worth the investment. The best rain jackets for women in 2026 Best for everyday: Outdoor Research Aspire 3L - See at Outdoor Research │ See at Amazon Best budget: Columbia Hikebound II - See at Columbia Best lightweight: Outdoor Research Helium UL - See at Outdoor Research │ See at Amazon Best full coverage: Fjällräven Vardag Rain Parka - See at Fjällräven │ See at Public Lands Best for travel: Halfdays Mary - See at Halfdays Best for hiking: Stio Ender ruction and around 1,000 operational jobs, eclipsing the local community by thousands. Angel Crawford of Delhi, a town about 10 minutes west of Holly Ridge, first noticed a surge in construction and operational workers arriving in her community last year. Around that time, she and her husband, Bryan, opened a mobile home park to help address the housing gap. Angel and Bryan Crawford founded Antley Pines. Angel Crawford Bryan and Angel Crawford initially worked in the nursing industry, but pivoted careers in 2024 after becoming empty nesters. \"We started with real estate and rentals because they are very much needed in this area,\" Angel told Business Insider. \"It's very rural here, so when there are fluctuating prices in the market, it doesn't really hit us because there are never enough houses for sale or rent.\" They began buying older homes and fixer-uppers that year. \"We had a vision to create a mobile home park, and already purchased some land when we heard about Meta's data center. That's what pushed us to keep going forward, \" Angel said. \"We understood there wasn't enough housing for residents, and our dream of building more multifamily houses was right", "date_str": "2026-09-27T10:39:01+00:00", "hash": "91e214a38fb07dbc", "title_fa": "مرکز داده متا در لوئیزیانا در حال ایجاد رونق مسکن است", "summary_fa": "متا در حال ساخت مرکز داده Hyperion خود در هالی ریج، لوئیزیانا است. شبکه USA TODAY از طریق رویترز Connect Meta در حال ساخت بزرگترین مرکز داده هوش مصنوعی تا به امروز در شمال شرقی لوئیزیانا است. بیش از 7500 کارگر تجاری در مرکز داده در اوج ساخت و ساز در محل خواهند بود. شکاف مسکن محلی باعث رونق پارک های خانه های متحرک مانند آنتلی پاین شده است. برای چندین دهه، ریچلند پریش یک جامعه کشاورزی کوچک در گوشه شمال شرقی لوئیزیانا باقی ماند. ساکنان محله - انبوهی از شهرهای روستایی و جوامع غیرمجاز - خانه خود را به دلیل سرعت پایین‌تر زندگی می‌شناختند. بخش اعظم منطقه مملو از جاده‌های پر پیچ و خم، زمین‌های کشاورزی وسیع، و خط افقی عاری از آسمان‌خراش‌های بلند است. نزدیکترین continues to grow. My interest in medical tourism began after I wrote for a travel-focused website about a viral TikTok influencer who praised the quality and affordability of medical care in Turkey. Months later, after an extremely disappointing annual physical at home in South Florida, I was compelled to seek medical care abroad. I originally planned to only get a comprehensive physical and enjoy Istanbul . After further research and some cosmetic care, I decided to indulge in a full-body reset this past April. My care was extensive The obvious overhead of participating in medical tourism is travel costs. Because the flight was roughly 10 hours, I knew I wanted to fly business class. Fortunately, I was able to save up enough credit card rewards to fly Turkish Airlines from Chicago O'Hare to Istanbul for free. The cash price of this flight is normally thousands. It was a great deal, and I used it as an excuse to see friends in Chicago for an evening before my adventure. The Memorial Hospitals Group in Turkey offers several comprehensive health checkup packages, which foreigners are able to book. I chose the most basic plan. I'm a healthy 32-year-old male, and figured I didn't need to invest more. The author was able to communicate with staff during his care through a translator who helped him in person and via WhatsApp. Courtesy of Brett Holzhauer. For $1,100 USD, I received: a full lab panel, cardiology tests, a chest X-ray, a dental radiograph, a thyroid ultrasound, and a whole-abdomen ultrasound. I also had internal medicine, ophthalmology", "date_str": "2026-09-27T10:29:01+00:00", "hash": "7311a2c972d3e740", "title_fa": "من ۷۵۰۰ دلار برای معاینه کامل بدن و عمل های زیبایی در ترکیه هزینه کردم", "summary_fa": "نویسنده گفت که از مراقبت های پزشکی که در خانه دریافت می کند ناراضی است، بنابراین از مایل های خطوط هوایی خود برای رزرو بلیط کلاس تجاری به ترکیه برای مراقبت و اقدامات زیبایی استفاده کرده است. با حسن نیت از برت هولژاور. من به استانبول سفر کردم تا بعد از یک چکاپ ضعیف در خانه، روی سلامتی و ظاهرم سرمایه گذاری کنم. من با استفاده از جوایز کارت اعتباری که بیش از یک سال پس انداز کرده بودم، رفت و برگشت در کلاس تجاری پرواز کردم. من از مراقبتی که دریافت کردم راضی هستم و می دانم که کسری از آنچه در ایالات متحده داشتم پرداخت کردم. سفر به ترکیه برای مراقبت‌های پزشکی اکنون چندین شعار و تداعی طنز دارد: مردانی که برای کاشت مو در \"Turkish Hairlines\" سفر می‌کنند، روکش‌هایی که \"دندان‌های بوقلمونی\" نامیده می‌شوند، و گردشگرانی که در اطراف استانبول قدم می‌زنند، طوری به نظر می‌رسند که گویی در کوچه پس کوچه‌ای بر اثر تورم بعد از جراحی درگیر شده‌اند. این یک بازار خاص یا روند اخیر نیست. میلیون‌ها آمریکایی هر ساله برای انجام عمل‌های پزشکی یا زیبایی در سطح بین‌المللی سرمایه‌گذاری می‌کنند و بازار همچنان به رشد خود ادامه می‌دهد. علاقه من به گردشگری پزشکی پس از آن شروع شد که برای یک وب سایت متمرکز بر سفر درباره یک تأثیرگذار ویروسی TikTok نوشتم که کیفیت و مقرون به صرفه بودن مراقبت های پزشکی در ترکیه را ستایش کرد. ماه‌ها بعد، پس از یک دوره فیزیکی سالانه بسیار ناامیدکننده در خانه در فلوریدا جنوبی، مجبور شدم به دنبال مراقبت پزشکی در خارج از کشور باشم. من در ابتدا قصد داشتم فقط یک فیزیکی جامع داشته باشم و از استانبول لذت ببرم. پس از تحقیقات بیشتر و برخی مراقبت‌های آرایشی، تصمیم گرفتم در آوریل گذشته به تنظیم مجدد کل بدن بپردازم. مراقبت‌های من گسترده بود. سربار مشهود"}, {"source": "Business Insider", "title": "Ruby on Rails creator declares 'pencils down' on handwritten code", "link": "https://www.businessinsider.com/ruby-on-rails-creator-no-more-handwritten-code-2026-9", "summary": "David Heinemeier Hansson runs a software company. He s also a race car driver. Jakob Ebrey/LAT Images David Heinemeier Hansson said his software firm was \"done writing code by hand.\" At 37signals, engineers only hand-write code when an AI agent isn't able to, Hansson said. \"This is a recognition of what is already happening,\" he said. A coding legend is waving goodbye to handwritten code. David Heinemeier Hansson — commonly known as DHH — is the creator of the popular webapp framework Ruby on Rails. He also runs the software company 37signals, where he just instituted a new rule: \"We're done writing code by hand.\" \"We are going, and have gone, pencils down,\" Hansson said during the Rails World keynote. At his software company, 37signals, Hansson said that hand-writing code was an \"exceptional state,\" only to be performed when something went wrong with the AI-generated code. When an AI agent isn't able to produce what the engineers want, they can \"get the old pencil out and dot it down for them,\" Hansson said — but then they \"fix the machine.\" \"This is a recognition of what is already happening,\" he said. Indeed, coding has radically transformed in the last year, thanks to AI tools like OpenAI's Codex, Anthropic's Claude Code, and Cursor. Some developers call coding agents exhilarating, and they stay up late into the night to build with them. Others call AI coding a lonely or tiresome process . What do engineers actually think? Business Insider polled over 150 software engineers in January about the rise of vibe coding. Over 45% of respondents said they felt they were \"keeping up\" with AI tools. 17.5% of respondents said they were opting out of using AI code-editing tools entirely. There's only one \"serious question\" in this moment of coding, Hansson said at the keynote: how to best reap the rewards of AI. \"Every other question is below that in the stack of values,\" he said. Hansson surveyed the audience: \"How many people here are still writing material amounts of code by hand on a weekly basis?\" After watching the crowd, Hansson let out an expletive. \"That's about five,\" he said. Read the original article on Business Insider", "date_str": "2026-09-27T10:04:01+00:00", "hash": "a615a6c62329edd0", "title_fa": "خالق Ruby on Rails روی کدهای دست‌نویس «مداد پایین» را اعلام می‌کند", "summary_fa": "دیوید هاین مایر هانسون یک شرکت نرم افزاری را اداره می کند. او همچنین یک راننده ماشین مسابقه است. Jakob Ebrey/LAT Images دیوید هاین مایر هانسون گفت که شرکت نرم افزاری او \"نوشتن کد با دست انجام شده است.\" به گفته هانسون، در 37signals، مهندسان تنها زمانی کد می نویسند که یک عامل هوش مصنوعی قادر به انجام این کار نباشد. او گفت: «این به رسمیت شناختن آن چیزی است که در حال حاضر اتفاق افتاده است. یک افسانه کد نویسی با دست نوشته خداحافظی می کند. David Heinemeier Hansson - که معمولاً با نام DHH شناخته می شود - خالق چارچوب محبوب برنامه وب Ruby on Rails است. او همچنین شرکت نرم‌افزاری 37signals را اداره می‌کند، جایی که او به تازگی قانون جدیدی را وضع کرده است: \"ما نوشتن کد را با دست تمام کردیم.\" هانسون در جریان سخنرانی جهانی ریلز گفت: «ما مدادها را پایین می‌رویم و رفته‌ایم. هانسون در شرکت نرم‌افزاری خود، 37signals، گفت که کد دست‌نویسی «وضعیت استثنایی» است که فقط زمانی انجام می‌شود که مشکلی در کد تولید شده توسط هوش مصنوعی رخ دهد. هانسون گفت: وقتی یک عامل هوش مصنوعی قادر به تولید آنچه مهندسان می‌خواهند نیست، می‌توانند «مداد قدیمی را بیرون بیاورند و آن را برایشان نقطه‌گذاری کنند» اما سپس «ماشین را تعمیر می‌کنند». او گفت: «این به رسمیت شناختن آن چیزی است که در حال حاضر اتفاق افتاده است. در واقع، به لطف ابزارهای هوش مصنوعی مانند OpenAI's Codex، Anthropic's Claude Code و Cursor، کدنویسی در سال گذشته به شدت تغییر کرده است. برخی از توسعه دهندگان عوامل برنامه نویسی را نشاط آور می نامند و تا دیروقت شب بیدار می مانند تا با آنها کار کنند. برخی دیگر کدنویسی هوش مصنوعی را فرآیندی تنها یا خسته کننده می نامند. مهندسان واقعا چه فکر می کنند؟ Business Insider در ماه ژانویه از"}, {"source": "Business Insider", "title": "5 BI staffers who put AI agents to work share what worked and what went wrong", "link": "https://www.businessinsider.com/staffers-test-personal-ai-agent-muse-instinct-highs-lows-2026-9", "summary": "Rebecca Zisser/BI 5 BI staffers told us how they've been using the hottest new thing in AI: personal AI agents. Their use cases include reserving library books and collecting K-pop merch. One editor used it to remind him to call his mother. Muse and Instinct — AI agents designed to help you run your personal life — are the talk of the town right now. So, obviously, we at Business Insider had to try them out. Five staffers across the newsroom's global offices — from headquarters in New York to divisions in London, San Francisco, and Singapore — have been testing both Meta and Instinct's personal AI agent offerings over the past week. Our editor-in-chief, Jamie Heller, got in on the action, too: My husband and I were puzzling over an opaquely described charge on our credit card. We put the wording into Chat GPT and Muse — asking each what it could be. Chat couldn't figure it out. Muse did. Keep reading for our 101 on what worked, and what didn't . And if you have an experience of your own to share, fill out our survey . In response to our requests for comment, a Meta spokesperson pointed us to a dedicated safety post on its website. Instinct did not respond to our request for comment. Will Martin, senior editor, used Instinct to pay a car fee, but it backfired Will Martin I downloaded Instinct two weeks ago and chose a very simple task to start with: Remind me to call my mother (she worries). My whoa moment: Instinct jumped to my aid when I told it I needed a new torque wrench for my bike. After a simple prompt, Instinct came back with four options: a cheap one, a mid-priced option, and two higher-end versions — all with links and a pro/con list. In the two weeks I've been using it, Instinct has created an itinerary for a weekend trip I'm taking next year, booked tickets for my daily commute into London, and secured me a refund on an $80 subscription I forgot to cancel after the free trial. My yikes moment: This past weekend, I took a trip to Oxford, one of Britain's most notoriously complex places to drive. Oxford is famed as a warren of one-way streets, traffic cameras, and tolls. I asked my Instinct agent to pay the city's congestion charge after I drove in. Instinct obliged, cross-checking my car's model against the different emissions tiers for the charging zone, and sending me a confirmation that it had paid for two days at £4 per day. As I touted how easy it all was to my AI-skeptical partner, she pointed out that the cost was £5, not £4. So I checked", "date_str": "2026-09-27T10:03:01+00:00", "hash": "e2877e4f1271a625", "title_fa": "5 کارمند BI که عوامل هوش مصنوعی را سرکار می‌گذارند، آنچه را که کار کرده و اشتباه کرده است، به اشتراک می‌گذارند", "summary_fa": "کارکنان Rebecca Zisser/BI 5 BI به ما گفتند که چگونه از داغ ترین چیز جدید در هوش مصنوعی استفاده کرده اند: عوامل هوش مصنوعی شخصی. موارد استفاده از آنها شامل رزرو کتاب های کتابخانه و جمع آوری کالاهای K-pop است. یکی از سردبیران از آن برای یادآوری تماس با مادرش استفاده کرد. Muse و Instinct - عوامل هوش مصنوعی که برای کمک به شما در اداره زندگی شخصی طراحی شده اند - در حال حاضر بحث شهر هستند. بنابراین، بدیهی است که ما در Business Insider مجبور بودیم آنها را امتحان کنیم. پنج کارمند در سراسر دفاتر جهانی اتاق خبر - از دفتر مرکزی در نیویورک گرفته تا بخش‌هایی در لندن، سانفرانسیسکو و سنگاپور - در هفته گذشته هر دو پیشنهادات عامل هوش مصنوعی متا و Instinct را آزمایش کرده‌اند. سردبیر ما، جیمی هلر، نیز وارد عمل شد: من و شوهرم در مورد هزینه‌ای که نامشخص از کارت اعتباری‌مان توضیح داده شده بود گیج بودیم. ما عبارت را در Chat GPT و Muse قرار دادیم - از هر کدام پرسیدیم که چه چیزی می تواند باشد. چت نتوانست آن را بفهمد. میوز انجام داد. برای 101 ما به خواندن ادامه دهید که چه کار کرده است و چه چیزی کار نکرده است. و اگر تجربه ای برای به اشتراک گذاشتن دارید، نظرسنجی ما را پر کنید. در پاسخ به درخواست‌های ما برای اظهار نظر، سخنگوی متا به ما به یک پست ایمنی اختصاصی در وب‌سایت خود اشاره کرد. غریزه به درخواست ما برای اظهار نظر پاسخ نداد. ویل مارتین، سردبیر ارشد، از Instinct برای پرداخت هزینه ماشین استفاده کرد، اما نتیجه معکوس داد ویل مارتین من Instinct را دو هفته پیش دانلود کردم و یک کار بسیار ساده را برای شروع انتخاب کردم: به من یادآوری کن که با مادرم تماس بگیرم (او نگران است). لحظه ی من: غریزه به"}, {"source": "Business Insider", "title": "AI is prompting these Gen Zers to learn how to type", "link": "https://www.businessinsider.com/gen-z-improving-typing-skills-amid-rise-ai-technology-2026-9", "summary": "Tom Vaughan-Mountford/Getty Images Gen Z grew up with phones and tablet typing, with many never learning keyboard skills. But in the age of AI-driven efficiency — and prompting — keyboard skills have a new use case. Some Gen Zers are becoming self-taught to avoid dictating AI prompts out loud. When Julia Andrusiak was in college, she noticed one of her professors repeatedly pausing his lecture. Eventually, she realized that she was the disruption: Her slow, two-finger typing was so loud that he couldn't concentrate. \"It was the first moment I realized that I may not be the best at this,\" Andrusiak said. So she began drilling: First, she typed out books. That made her faster, but she was still staring at her keyboard. Then, she advanced to touch typing — typing without looking at the keyboard. She's still working on her speed and accuracy. Now 26, Andrusiak has an AI-focused job that involves helping people use the technology and sometimes necessitates writing strong prompts. She still can't type fast, so when she has a longer prompt, she dictates it — and feels self-conscious about what looks like talking to herself in an open office. In 2024, The Wall Street Journal reported that digital natives were baffling \"teachers and parents with their lack of typing skills.\" Now, for some younger workers and students, typing is making a comeback . While AI might seem to harken a turn away from typing — who needs note-taking when you have an agent? — AI is only as good as the prompt it's given. Rambling voice prompts can be insufficiently clear and precise. The rise of AI has some Gen Zers looking for any efficiency edge they can carve out. \"With the ever increasingly fast world, we need to type quicker. But I feel like people are really relying on AI,\" Andrusiak, who happily uses AI as an aid for writing and research, said. \"One of my friends said, 'Well, you don't really have to type the whole page. You can just give it short sentences. It's not really that tiring.' But then I feel like it's outsourcing too much of cognitive power to a technology.\" Julia Andrusiak and her mechanical keyboard. Courtesy of Julia Andrusiak Typing as meditation and efficiency generator Andrey Gerasimov, a 23-year-old computer science graduate , never took typing classes. But he first needed the skill for his video game chats and decided to beef it up, eventually reaching 170 words per minute. As an AI user, he believes that faster typing makes for more efficient prompting. \"You're goi", "date_str": "2026-09-27T10:00:01+00:00", "hash": "78277a51ed5608fd", "title_fa": "هوش مصنوعی این ژنرال Zers را ترغیب می کند تا نحوه تایپ کردن را بیاموزند", "summary_fa": "Tom Vaughan-Mountford/Getty Images Gen Z با تایپ کردن گوشی‌ها و تبلت‌ها بزرگ شد و بسیاری هرگز مهارت‌های صفحه کلید را یاد نگرفتند. اما در عصر بهره وری – و انگیزه – مبتنی بر هوش مصنوعی، مهارت‌های صفحه کلید کاربرد جدیدی دارند. برخی از ژنرال زرها برای جلوگیری از دیکته کردن اعلان‌های هوش مصنوعی با صدای بلند، خودآموخته می‌شوند. هنگامی که جولیا آندروسیاک در کالج بود، متوجه شد که یکی از استادانش مکرراً سخنرانی خود را متوقف می کند. در نهایت، او متوجه شد که او اختلال ایجاد کرده است: تایپ آهسته و با دو انگشت او آنقدر بلند بود که نمی توانست تمرکز کند. آندروسیاک گفت: \"این اولین لحظه ای بود که فهمیدم ممکن است در این بهترین نباشم.\" بنابراین او شروع به حفاری کرد: ابتدا کتاب ها را تایپ کرد. این باعث شد سریع‌تر شود، اما همچنان به کیبوردش خیره شده بود. سپس، او به سمت تایپ لمسی پیش رفت - بدون نگاه کردن به صفحه کلید تایپ کرد. او همچنان روی سرعت و دقت خود کار می کند. آندروسیاک اکنون 26 ساله است و شغلی متمرکز بر هوش مصنوعی دارد که شامل کمک به مردم برای استفاده از این فناوری می شود و گاهی اوقات نیاز به نوشتن درخواست های قوی دارد. او هنوز نمی‌تواند سریع تایپ کند، بنابراین وقتی درخواست طولانی‌تری دارد، آن را دیکته می‌کند - و احساس می‌کند که در یک دفتر باز با خودش صحبت می‌کند. در سال 2024، وال استریت ژورنال گزارش داد که بومیان دیجیتال «معلمان و والدین را با عدم مهارت تایپ کردنشان گیج می‌کنند». اکنون، برای برخی از کارگران و دانشجویان جوان‌تر، تایپ کردن در حال بازگشت است. در حالی که ممکن است به نظر برسد هوش مصنوعی از تایپ کردن دوری می‌کند - وقتی نماینده دارید چه کسی به یادداشت برداری نیاز دارد؟ - هوش مصنوعی فقط به اندازه"}, {"source": "Business Insider", "title": "The startup trap that kept this longevity app founder stuck", "link": "https://www.businessinsider.com/death-clock-ceo-slow-failure-longevity-2026-9", "summary": "Brent Franson is the CEO of Death Clock. Courtesy of Death Clock Death Clock CEO Brent Franson said startups can get stuck in a phase he calls \"slow failure.\" He shut down his startup and threw out years' worth of code to build Death Clock, a consumer-health product. When a startup isn't viable , Franson says, founders should fully pivot rather than try to patch it. Brent Franson spent four years building a mental-health app that users liked, but that didn't ultimately work as a business. The product wasn't an obvious flop. It had enough promise, he said, to make further rounds of changes seem worthwhile — the trap of something that seemed \"pretty good,\" though ultimately isn't viable. \"Mediocrity is so dangerous,\" Franson said. In late 2024, seeing a need for a fresh start, he shut down the app, called Most Days, and discarded the codebase that his team had spent years building. The San Francisco-based staff then shifted their attention to building a consumer-health product called Death Clock, which Franson, 44, described as an \"AI private doctor.\" Users enter health information — ranging from cholesterol levels to diet and sleep habits — and the platform uses longevity research to estimate the age at which they might die and suggest changes that could help them live longer. The experience reshaped how the longtime early-stage entrepreneur, who in 2019 sold a prior software company he ran to WeWork, thinks about startups. Here are three lessons Franson has learned: An app people like is not necessarily a viable business Most Days had users, though the company could not acquire them cheaply enough to build a sound business, he said. The scary part of pivoting , Franson said, is not when a business is clearly failing or obviously taking off. It is when a product has users who like it and just enough promise to make another round of changes seem worthwhile. \"You can convince yourself to keep iterating on it,\" he said. Franson, who is CEO of Death Clock, calls that danger \"slow failure\": a business that lingers because its leaders keep rationalizing why it might soon work. One test, he said, is whether founders are working through concrete problems with conviction or trying to talk themselves into continuing. When you pivot, make a clean break For Franson, the response wasn't to rebrand Most Days or look for another half-measure like a savvy hire. It was to shut it down completely. He said the hardest decision was abandoning a company the team had spent years", "date_str": "2026-09-27T09:57:01+00:00", "hash": "25edd430cfcbc2b4", "title_fa": "تله استارتاپی که این بنیانگذار اپلیکیشن طول عمر را گیر کرد", "summary_fa": "برنت فرانسون مدیر عامل شرکت Death Clock است. برنت فرانسون، مدیر عامل شرکت Death Clock Death Clock گفت که استارت آپ ها می توانند در مرحله ای گیر کنند که او آن را \"شکست آهسته\" می نامد. او استارت‌آپ خود را تعطیل کرد و سال‌ها کد را برای ساخت Death Clock، محصولی برای سلامت مصرف‌کننده، کنار گذاشت. فرانسون می‌گوید زمانی که یک استارت‌آپ قابل دوام نیست، بنیان‌گذاران باید به‌جای تلاش برای اصلاح آن، به‌طور کامل تغییر کنند. برنت فرانسون چهار سال را صرف ساختن یک برنامه سلامت روان کرد که کاربران آن را دوست داشتند، اما در نهایت به عنوان یک تجارت کار نکرد. محصول یک شکست آشکار نبود. او گفت که این نوید کافی داشت که دورهای بعدی تغییرات را ارزشمند جلوه دهد - دام چیزی که \"بسیار خوب\" به نظر می رسید، اگرچه در نهایت قابل دوام نیست. فرانسون گفت: «متوسط ​​بودن بسیار خطرناک است. در اواخر سال 2024، با مشاهده نیاز به شروعی تازه، اپلیکیشنی را که به نام Most Days نامیده می‌شد، خاموش کرد و پایگاه کدی را که تیمش سال‌ها صرف ساخت آن کرده بود، کنار گذاشت. کارکنان مستقر در سانفرانسیسکو سپس توجه خود را به ساخت یک محصول سلامت مصرف کننده به نام ساعت مرگ معطوف کردند که فرانسون، 44 ساله، آن را \"پزشک خصوصی هوش مصنوعی\" توصیف کرد. کاربران اطلاعات مربوط به سلامتی را وارد می کنند - از سطح کلسترول گرفته تا عادات غذایی و خواب - و این پلتفرم از تحقیقات طول عمر برای تخمین سنی که ممکن است در آن بمیرند و پیشنهاد تغییراتی که می تواند به آنها کمک کند بیشتر عمر کنند، استفاده می کند. این تجربه نحوه تفکر کارآفرین قدیمی در مراحل اولیه را که در سال 2019 شرکت نرم افزاری قبلی خود را به WeWork فروخت، در مورد استارت آپ ها تغییر داد. در اینجا سه"}, {"source": "Business Insider", "title": "This small town librarian offers a 'Bye, Bye AI' class to take AI off your phone. Now everyone wants in.", "link": "https://www.businessinsider.com/library-bye-bye-ai-event-north-chatham-viral-2026-9", "summary": "Shea Wert, library director of the North Chatham Free Library, will be holding a Bye Bye AI event to help people turn off AI features on their phones. Shea Wert A small upstate New York library is offering a \"Bye Bye AI\" event. The librarian will help people turn off AI features on their phones or email. She told BI she's also happy to help people set up AI. The event has gone viral, with people around the world wanting to tune in. North Chatham, a hamlet in upstate New York halfway between Hudson and Albany, doesn't have much going on. You have to go to the next hamlet over for a store or restaurant. There's a church, a post office, and a small public library with only about 800 cardholders. The North Chatham Free Library has gotten a lot of attention lately, however, after a flyer for an upcoming \"Bye Bye AI\" event offering to remove the AI features from your phone or laptop went viral on Facebook, getting over 200 comments and 8,000 likes. The poster was made by the library's sole full-time librarian, Shea Wert. Wert told Business Insider that she had made this event in response to community demand — and was surprised by the reaction from far-flung places. \"Do I live anywhere near this library? No. Am I in support of this? Hell yeah!\" wrote one commenter. The event flyer went viral on Facebook, getting comments from around the world. https://www.facebook.com/share/p/1J7QUQUcU2/ \"I had to look at the library's main page to see where Chatham is. I'm in central CA and wonder if we can have a digital guide that our own Mariposa County Library could use for a similar program?\" wrote another. \"As someone in Ohio who just happened upon this post; will this be streamed or recorded?\" someone else asked. \"As somewhere near Chatham, UK, I was a little confused at first Regardless, thanks Shea!\" a jolly Brit wrote. The library does weekly tech support drop-in hours, and in April it held an \"AI for seniors\" class that covered the basics of AI and LLMs. But this latest offering was something new. The idea was based on requests Wert had noticed from the community. \"There's just been enough patrons asking about certain things that bothered them, specifically Gmail auto replies and auto completes really frustrate people,\" Wert told Business Insider during a recent phone call. \"I went to a presentation that another librarian was doing about this topic, and they had had success with it. And I was like, 'Okay, well, I've heard enough from my patrons that they're worried ab", "date_str": "2026-09-27T09:50:01+00:00", "hash": "ae2e0704dba97829", "title_fa": "این کتابدار شهر کوچک کلاس «بای، خداحافظ هوش مصنوعی» را برای حذف هوش مصنوعی از تلفن شما ارائه می‌کند. حالا همه می خواهند وارد شوند.", "summary_fa": "شی ورت، مدیر کتابخانه کتابخانه رایگان North Chatham، رویدادی با هوش مصنوعی بای بای برگزار خواهد کرد تا به مردم کمک کند ویژگی های هوش مصنوعی را در تلفن های خود خاموش کنند. Shea Wert یک کتابخانه کوچک در شمال ایالت نیویورک یک رویداد \"Bye Bye AI\" را ارائه می دهد. کتابدار به افراد کمک می کند تا
