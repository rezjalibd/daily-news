 جای داده است. خود مجموعه نطنز نیز که دو تاسیسات غنی‌سازی اورانیوم ایران در آن قرار داشت، در ماه مارس در جریان حملات نظامی آمریکا و اسرائیل به ایران هدف قرار گرفت. اسرائیل پیش از آن نیز در جنگ ۱۲ روزه سال گذشته با ایران، به نطنز حمله کرده بود. آقای ترامپ در اواسط ماه ژوئیه نیز ایران را به حمله به کوه کلنگ تهدید کرده بود. بنا بر گزارش شبکه خبری «سی ان ان»، بررسی شش‌ساله تصاویر ماهواره‌ای توسط «مرکز مطالعات راهبردی و بین‌المللی» مستقر در واشنگتن (CSIS) نشان داده است که فعالیت‌های ساختمانی در این محل در سال ۲۰۲۶ به شکل محسوسی افزایش یافته تا احتمالا به یک پناهگاه امن برای برنامه هسته‌ای ایران تبدیل شود. همزمان گزارش رسانه‌های آمریکا حاکی از آن است که این کشور در حال کار روی نسل جدیدی از بمب‌های نفوذگر و سنگرشکن است و بمب‌های جدید ممکن است بتوانند در «کوه کلنگ» نفوذ کنند. رئیس جمهور آمریکا پیش از عزیمت به تگزاس برای شرکت در گردهمایی جمهوری‌خواهان درباره انتخابات میان‌دوره‌ای، در گفت‌وگو با خبرنگاران در فرودگاه، موعد زمانی جدیدی را برای پایان درگیری‌ با ایران"}, {"source": "Euronews Persian", "title": "کمیسیون اروپا برای همپایی با پیشروی در روند الحاق مولداوی دست‌به‌کار شده است", "link": "https://parsi.euronews.com/my-europe/2026/09/10/eu-commission-scrambles-to-keep-pace-with-moldovas-accession-push", "summary": "کمیسیون اروپا برای همگام شدن با اصلاحات سریع مولداوی منابع خود را بازتوزیع می‌کند، هرچند روند عضویت آن همچنان به پرونده متوقف شده اوکراین توسط مجارستان گره خورده است.", "date_str": "2026-09-10T05:26:39+00:00", "hash": "6beef63a8195ad48", "title_fa": "کمیسیون اروپا برای همپایی با پیشروی در روند الحاق مولداوی دست‌به‌کار شده است", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp کمیسیون اروپا برای همگام شدن با اصلاحات سریع مولداوی منابع خود را بازتوزیع می‌کند، هرچند روند عضویت آن همچنان به پرونده متوقف شده اوکراین توسط مجارستان گره خورده است. کمیسیون اروپا پس از آن که سرعت اصلاحات در جمهوری مولداوی از توان این نهاد برای همراهی با آن پیشی گرفت، منابع داخلی خود را به فرایند گسترش اتحادیه اروپا به این کشور هدایت می‌کند؛ این را مقام‌های اتحادیه اروپا به یورونیوز گفته‌اند. دولت مولداوی آن قدر سریع اصلاحات مورد نیاز را پیش برده که کمیسیون حالا باید خود را با این روند هماهنگ کند و در حال تخصیص دوباره منابع موجود است تا بتواند از نزدیک پیشرفت‌ها را دنبال کند. مارتا کاس، کمیسر گسترش اتحادیه اروپا، سه‌شنبه در شبکه ایکس نوشت: «کارنامه چشمگیر مولداوی در زمینه اصلاحات مرتبط با اتحادیه اروپا جواب داده است. گفت‌وگوی تلفنی خوبی با نخست‌وزیر جدید، واسیله توفان، داشتم که در آن درباره گام‌های بعدی در مسیر عضویت مولداوی در اتحادیه اروپا صحبت کردیم.» بخش گسترش کمیسیون، که به دلیل پیشرفت همزمان در چند کشور نامزد از پیش تحت فشار بود، ناچار شده است منابع را به سمت کشورهایی که بهترین عملکرد را دارند جابه‌جا کند. کیشیناو از زمانی که مایا ساندو در سال ۲۰۲۰ رئیس‌جمهور شد، به شدت اصلاحات مورد نظر اتحادیه اروپا را پیش برده و دولتی طرفدار اتحادیه اروپا با اکثریت مطمئن در پارلمان روی کار آورده است. کریستینا گراسیمو، معاون نخست‌وزیر مولداوی در امور ادغام اروپایی، در حاشیه نشست وزرا در روز جمعه به خبرنگاران گفت: «اصلاحاتی که در پنج سال گذشته انجام داده‌ایم واقعا بی‌سابقه است.»"}, {"source": "Euronews Persian", "title": "آمادگی ذهنی برای جراحی به اندازه آمادگی جسمی اهمیت دارد", "link": "https://parsi.euronews.com/health/2026/09/10/getting-your-mind-ready-for-surgery-is-as-important-as-physical-preparation", "summary": "یک پژوهش جدید می‌گوید آماده شدن برای جراحی بزرگ فقط به کارهای جسمی محدود نیست و باید برای بهبودی موفق، از نظر ذهنی هم خود را آماده کرد.", "date_str": "2026-09-10T05:08:59+00:00", "hash": "b18ec08e912013b6", "title_fa": "آمادگی ذهنی برای جراحی به اندازه آمادگی جسمی اهمیت دارد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp یک پژوهش جدید می‌گوید آماده شدن برای جراحی بزرگ فقط به کارهای جسمی محدود نیست و باید برای بهبودی موفق، از نظر ذهنی هم خود را آماده کرد. بی‌توجهی به سلامت‌روان بیماران پیش از جراحی‌های سنگین می‌تواند روند بهبود آنها را کند کند، به‌ویژه در میان بیماران سالمند، بنا بر یک مطالعه (منبع به زبان انگلیسی) تازه که روز چهارشنبه در نشریه علمی JAMA Network Open منتشر شد. جوآنا آبراهام، نویسنده اصلی این مطالعه، در یک بیانیه خبری (منبع به زبان انگلیسی) گفت: «استرس ناشی از جراحی می‌تواند نشانه‌های اضطراب و افسردگی را تشدید کند و بر روند بهبود و سلامت کلی بیماران تاثیر بگذارد.» نویسندگان تاکید می‌کنند که مراقبت پیش از جراحی باید فقط به آماده‌سازی جسم محدود نشود و آمادگی ذهنی با کمک متخصصان آموزش‌دیده سلامت‌روان را هم دربر بگیرد؛ عنصری که در مراقبت‌های معمول پیرامون‌جراحی اغلب نادیده گرفته می‌شود. اریک جی. لنز، نویسنده ارشد مطالعه، گفت: «ما اهمیت آماده‌کردن بدن پیش از جراحی را می‌دانیم اما آماده‌کردن ذهن و مغز نیز به همان اندازه مهم است.» مایکل اس. اویدان گفت: «راه پیش رو این است که بیماران را به‌صورت جامع درمان کنیم» و افزود که این رویکرد با پیوند دادن بیهوشی و روان‌پزشکی محقق می‌شود. در این مطالعه ۳۰۶ بزرگسال ۶۰ ساله و بالاتر که قرار بود تحت جراحی قلب، سرطان یا ارتوپدی قرار گیرند شرکت داشتند. بیماران به دو گروه تقسیم شدند. یک گروه فقط مطالب خودیاری دریافت کرد تا به‌طور مستقل مطالعه کند در حالی که گروه دیگر طی ۸ تا ۱۲ جلسه تلفنی با یک متخصص آموزش‌دیده سلامت‌روان مانند مددکار اجتماعی یا مشاور سلامت‌روان گفت‌وگو کرد. گروه دوم همچنین یک مرور شخصی‌سازی‌شده دارویی از سوی داروسازان و پزشکان دریافت کرد تا دوز داروهای پرخطر آنها"}, {"source": "Euronews Persian", "title": "سیلاب نپال و یخچال‌های در حال ذوب مون بلان: «تابستان ما را تکان داد»", "link": "https://parsi.euronews.com/2026/09/10/summer-has-shaken-us-nepals-flood-disaster-feels-personal-amid-the-backdrop-of-melting-mon", "summary": "یک مقام محلی در شامونی می‌گوید شهرش باید فوری برای خطر سقوط تکه‌های یخچال‌های طبیعی یا سنگ آماده شود.", "date_str": "2026-09-10T05:02:25+00:00", "hash": "01e83da83b5ea782", "title_fa": "سیلاب نپال و یخچال‌های در حال ذوب مون بلان: «تابستان ما را تکان داد»", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp یک مقام محلی در شامونی می‌گوید شهرش باید فوری برای خطر سقوط تکه‌های یخچال‌های طبیعی یا سنگ آماده شود. قرنهاست که جوامع کوهستانی فرانسه و ایتالیا به یخچالها و برف به ظاهر جاودانه‌ای خیره شده‌اند که بلندترین قله اروپای غربی نامش را از آنها گرفته است: مون‌بلان، کوه سفید. اما گرمایش اقلیمی این چشم‌انداز را با سرعتی نگران‌کننده از هم می‌پاشد. موجهای گرمای بی‌سابقه اروپا در تابستان امسال لایه یخ‌زدگی دائمی را که طی هزاره‌ها همچون چسب در چشم‌انداز آلپ عمل کرده بود، به شدت آسیب زده است. صخره‌هایی که یخشان آب شده بود، از هم پاشید و ریزش سنگ از ارتفاعات به راه افتاد. دره‌ای که به خطرناکی مشهور است و کوهنوردان سالها در مسیر صعود به قله ۴۸۰۵ متری از آن عبور می‌کردند، موقتا غیرقابل عبور شد. استفان بزون، معاون شهردار شامونی-مون‌بلان، شهری فرانسوی در پای این غول که مرز فرانسه و ایتالیا را در می‌نوردد، می‌گوید: «برای کوه خود و برای تغییری که در آن رخ می‌دهد، اشک می‌ریزیم. این موضوع دل ما را به درد می‌آورد.» او می‌گوید: «از اواسط ژوئیه به بعد، شاهد افزایش ریزش سنگ بودیم. دیدیم که به دلیل عقب‌نشینی یخچالها و ذوب برف روی آنها، دسترسی به برخی مناطق دشوار شد؛ شکافها باز شد و فروریختن سنگها رسیدن یا عبور از بعضی نقاط را مشکل کرد.» هر درجه گرم‌شدن می‌تواند تاثیری نامتناسب داشته باشد. در قله آیگی‌ی دو میدی که در رشته‌کوه مون‌بلان ۳۸۴۲ متر ارتفاع دارد، میانگین دمای ماه ژوئیه به شدت افزایش یافته است. به گفته سازمان هواشناسی ملی فرانسه، متئو فرانس، میانگین دمای این قله در ژوئیه ۱۹۹۴ تنها ۱.۶ درجه سانتیگراد بود، اما امسال گرمترین ژوئیه ثبت‌شده با میانگین ۳.۳ درجه بوده است."}, {"source": "Euronews Persian", "title": "۱۰ شهر مناسب برای پیاده‌روی رتبه‌بندی شدند؛ هفت شهر در اروپا", "link": "https://parsi.euronews.com/travel/2026/09/10/the-worlds-most-walkable-cities-have-been-ranked-and-seven-are-in-europe", "summary": "بهترین سفرهای شهری همیشه نیازمند تاکسی، مترو یا برنامه‌ریزی پیچیده نیستند. یک شاخص تازه، قابل‌پیاده‌روی‌ترین مقاصد نوظهور جهان را رتبه‌بندی کرده که شهرهای اروپایی در آن پیشتازند.", "date_str": "2026-09-10T05:00:06+00:00", "hash": "1330f2033a2487a9", "title_fa": "۱۰ شهر مناسب برای پیاده‌روی رتبه‌بندی شدند؛ هفت شهر در اروپا", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp بهترین سفرهای شهری همیشه نیازمند تاکسی، مترو یا برنامه‌ریزی پیچیده نیستند. یک شاخص تازه، قابل‌پیاده‌روی‌ترین مقاصد نوظهور جهان را رتبه‌بندی کرده که شهرهای اروپایی در آن پیشتازند. بسیاری از ما از سفرهای کوتاه شهری لذت می‌بریم و مسافران باتجربه می‌دانند که موفقیت یک سفر تا حدی به قابل قدم‌زدن بودن مقصد بستگی دارد. اکنون اسکای‌اسکنر فهرست بهترین شهرهای جدید برای سفر کوتاه را منتشر کرده است؛ شهرهایی که انتخاب‌های بدیهی مثل برلین یا دوبروونیک نیستند. کارشناسان این پلتفرم رزرو سفر، داده‌های پرواز به مقاصدی خارج از ایالات متحده را بررسی کرده‌اند؛ شهرهایی که برای پیاده‌روی مناسب و گشت‌وگذار در آن‌ها ساده است. در مجموع ۱۴ عامل برای هر شهر ارزیابی شده است؛ از فاصله میان جاذبه‌های اصلی و تعداد مسیرهای پیاده‌روی گرفته تا میانگین ارتفاع، کیفیت هوا و میزان امنیت. نتیجه این بررسی، یک شاخص قابلیت پیاده‌روی (منبع به زبان انگلیسی) است؛ شاخصی که بر فاصله پیاده میان جاذبه‌های اصلی هر مقصد و تعداد قدم‌ها و زمانی که برای دیدن آن‌ها لازم است تمرکز دارد. این شاخص همچنین چگالی جمعیت، تعداد مسیرهای قابل گشت‌وگذار در داخل و اطراف هر شهر و شمار جاذبه‌ها در هر مقصد را بررسی می‌کند. درحالی‌که هیروشیما و ناگازاکی در ژاپن و ویکتوریا در کانادا در جمع ۱۰ شهر برتر قرار گرفته‌اند، بقیه جایگاه‌ها به شهرهای اروپایی رسیده است."}, {"source": "Euronews Persian", "title": "مدیرعامل جدید اپل آیفون‌های تازه و نخستین گوشی تاشو Duo را معرفی کرد", "link": "https://parsi.euronews.com/next/2026/09/10/new-apple-ceo-debuts-the-latest-iphones-and-its-first-foldable-duo", "summary": "اپل روز چهارشنبه نسل جدید آیفون‌های خود را معرفی کرد که در میان آنها یک نسخه تاشو بسیار مورد انتظار با نام Duo نیز دیده می‌شود.", "date_str": "2026-09-10T04:43:27+00:00", "hash": "001952aa6c7f4889", "title_fa": "مدیرعامل جدید اپل آیفون‌های تازه و نخستین گوشی تاشو Duo را معرفی کرد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp اپل روز چهارشنبه نسل جدید آیفون‌های خود را معرفی کرد که در میان آنها یک نسخه تاشو بسیار مورد انتظار با نام Duo نیز دیده می‌شود. مدیرعامل جدید اپل، جان ترنس، که اول سپتامبر جای تیم کوک را گرفت، تازه‌ترین محصولات این شرکت را در مقر اپل در کوپرتینوی کالیفرنیا معرفی کرد. ترنس پس از مرور به‌روزرسانی‌های دیگر برای آیفون، اپل‌واچ و ایرپاد، به حاضران در سالن استیو جابز گفت: «اتفاقا یک چیز دیگر هم مانده است»؛ اشاره‌ای به عبارت مشهور جابز که بنیان‌گذار اسطوره‌ای و درگذشته اپل آن را از مجموعه تلویزیونی کارآگاهی دهه ۱۹۷۰ «کلمبو» وام گرفته بود. ترنس گفت: «این تلفن تاشو بزرگ‌ترین نمایشگر را در میان همه آیفون‌ها دارد، اما همچنان در جیب جا می‌شود.» این گوشی در حالت باز به نمایشگری ۷٫۶ اینچی تبدیل می‌شود که ۸۰ درصد بزرگ‌تر از جدیدترین آیفون ۱۸ پرو است. کاربران در این گوشی می‌توانند از قلم اپل استفاده کنند؛ قابلیتی که تا پیش از این فقط در آیپد در دسترس بود. ترنس گفت: «آیفون Duo تجربه استفاده از تلفن تاشو را از نو تعریف خواهد کرد.» آیفون Duo به کاربران امکان می‌دهد صفحه‌نمایش را به دو بخش تقسیم کنند تا هم‌زمان دو اپلیکیشن مختلف روی دستگاه یا دو پنجره از یک وب‌سایت را برای کارهایی مثل مقایسه قیمت‌ها ببینند. با قیمت پایه ۱۹۹۹ دلار (حدود ۱۷۱۹ یورو)، این گران‌ترین آیفونی است که تاکنون عرضه شده‌است. بن وود، مدیر تحلیل ارشد در شرکت CCS Insight، گفت: «آیفون Duo از همان ابتدا قرار بود همه اعلام‌های دیگر اپل در این رویداد را تحت‌الشعاع قرار دهد. این دستگاه طراحی متمایز جدیدی به خانواده آیفون اضافه می‌کند و ورود اپل به بخش کوچک تلفن‌های‌هوشمند تاشو را رقم می‌زند.»"}, {"source": "Euronews Persian", "title": "کدام کشورهای اروپایی بیشترین نفت خام را وارد می‌کنند؟", "link": "https://parsi.euronews.com/business/2026/09/10/which-european-countries-import-the-most-crude-oil", "summary": "بهای نفت برنت پس از حملات تازه در تنگه هرمز از ۱۰۰ دلار گذشت. داده‌های یورواستات نشان می‌دهد کدام کشورهای اروپایی بیشترین نفت را می‌خرند و چه کسانی بیشترین آسیب‌پذیری را دارند.", "date_str": "2026-09-10T04:05:05+00:00", "hash": "0184c1741d46ad3a", "title_fa": "کدام کشورهای اروپایی بیشترین نفت خام را وارد می‌کنند؟", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp بهای نفت برنت پس از حملات تازه در تنگه هرمز از ۱۰۰ دلار گذشت. داده‌های یورواستات نشان می‌دهد کدام کشورهای اروپایی بیشترین نفت را می‌خرند و چه کسانی بیشترین آسیب‌پذیری را دارند. قیمت نفت‌خام برنت روز چهارشنبه از ۱۰۰ دلار برای هر بشکه عبور کرد و پس از حملات تازه به کشتی‌رانی در اطراف تنگه هرمز، صبح پنجشنبه نیز بالا ماند. بهای این شاخص از میانه فوریه تاکنون، یعنی نزدیک به هفت ماه، بالای ۷۰ دلار مانده و نسبت به پایان سال ۲۰۲۵ که در سطح ۶۰.۸۵ دلار بسته شده بود، ۶۵.۷ درصد افزایش یافته است. اما ماجرا دیگر فقط به بازار انرژی محدود نمی‌شود. گران‌تر شدن نفت‌خام هزینه گازوئیل، بنزین و سوخت هواپیما را بالا می‌برد. این افزایش‌ها سپس در شبکه‌های حمل‌ونقل و زنجیره‌های تامین سرریز می‌شود و در نهایت به قیمت مصرف‌کننده می‌رسد. این اتفاق از نظر زمانی برای اروپا در بدترین مقطع ممکن رخ داده است. نرخ تورم منطقه یورو در ماه اوت پیشاپیش به ۳.۳ درصد رسیده بود؛ بالاترین سطح از سپتامبر ۲۰۲۳. تنها قیمت انرژی در طول یک سال ۱۴.۳ درصد افزایش یافته است."}, {"source": "Euronews Persian", "title": "فرمول یک اجاره‌های گردشگری در مادرید را بالا برد: تا ۲۰ هزار یورو برای اقامت کنار پیست", "link": "https://parsi.euronews.com/business/2026/09/10/formula-1-drives-up-tourist-rentals-in-madrid-up-to-20000-euros-to-stay-near-the-circuit", "summary": "برگزاری گرند پری اسپانیا قیمت اجاره های کوتاه‌مدت واحدهای لوکس در مادرید را تا هزار درصد افزایش داده و عرضه در والدبباس را جهش داده است؛ در این منطقه برخی واحدها برای دوره رقابت تا ۲۰ هزار یورو آگهی شده‌اند.", "date_str": "2026-09-10T04:01:53+00:00", "hash": "6fc202b2e2bc9f83", "title_fa": "فرمول یک اجاره‌های گردشگری در مادرید را بالا برد: تا ۲۰ هزار یورو برای اقامت کنار پیست", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp برگزاری گرند پری اسپانیا قیمت اجاره های کوتاه‌مدت واحدهای لوکس در مادرید را تا هزار درصد افزایش داده و عرضه در والدبباس را جهش داده است؛ در این منطقه برخی واحدها برای دوره رقابت تا ۲۰ هزار یورو آگهی شده‌اند. مادرید در آستانه میزبانی رقابت‌های فرمول یک، با مسابقه‌ای موازی با رویداد ورزشی روبه‌رو شده‌است: افزایش سرسام‌آور قیمت محل‌های اقامت . گرند پری اسپانیا که قرار است از ۱۱ تا ۱۳ سپتامبر در پیست ماد‌رینگ برگزار شود، هزینه اجاره‌های کوتاه‌مدت در مناطق نزدیک به مسیر مسابقه و همچنین در برخی از لوکس‌ترین محله‌های مرکز پایتخت را به‌شدت بالا برده‌است. در هفته‌های اخیر هنوز می‌شد در والدبباس، جایی که پیست در آن قرار دارد ، در مجاورت مرکز نمایشگاهی ایفما، آگهی‌هایی برای اجاره خانه پیدا کرد که قیمت آنها برای اقامت‌هایی تنها چندروزه تا حدود ۲۰ هزار یورو می‌رسید. در برخی موارد، مالکان صراحتا مدت در دسترس بودن ملک را فقط به دوره برگزاری مسابقات محدود کرده‌اند. یکی از آگهی‌هایی که تا سه‌شنبه گذشته هنوز می‌شد آن را در پلتفرم AirBNB پیدا کرد (منبع به زبان اسپانیایی) ، چنین تبلیغ می‌کرد: «یک دقیقه پیاده تا پیست ماد‌رینگ؛ گرند پری فرمول یک اسپانیا ۲۰۲۶ را از بهترین ویلای لوکسِ واقع در مادرید تجربه کنید.» در این آگهی برای چهار روز، ۱۱ هزار و ۴۰۰ یورو در قبال اقامت در «خانه‌ای طراحی‌شده برای گروه‌های وی‌آی‌پی» مطالبه شده‌است. این جهش قیمت در مقایسه با نرخ‌های معمول منطقه به‌ویژه چشمگیر است. برخی از این واحدها بهای اجاره ماهانه متعارف را چندین برابر کرده‌اند؛ اجاره‌ای که در این محله معمولا حدود ۲۵۰۰ یورو در ماه است و مالکان با اتکا به تقاضای بسیار بالایی که در یک آخر هفته متمرکز شده ، آن را بالا برده‌اند. ماریو"}, {"source": "Euronews Persian", "title": "ساخت نسل جدید بمب‌های سنگرشکن در آمریکا همزمان با تلاش ایران برای مقاوم‌سازی تاسیسات «کوه کلنگ»", "link": "https://parsi.euronews.com/2026/09/10/new-bunker-busting-bombs-united-states-as-iran-reinforce-pickaxe-mountain-nuclear-base", "summary": "همزمان با تلاش‌های ایران برای مقاوم‌سازی تاسیسات هسته‌ای مخفی کوه کلنگ (پیک‌اکس) در برابر حملات احتمالی آمریکا، واشنگتن در حال کار روی نسل جدیدی از بمب‌های نفوذگر و سنگرشکن است که احتمالا می‌توانند در «کوه کلنگ» نفوذ کنند.", "date_str": "2026-09-10T03:39:14+00:00", "hash": "776b07463a672a3a", "title_fa": "ساخت نسل جدید بمب‌های سنگرشکن در آمریکا همزمان با تلاش ایران برای مقاوم‌سازی تاسیسات «کوه کلنگ»", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp همزمان با تلاش‌های ایران برای مقاوم‌سازی تاسیسات هسته‌ای مخفی کوه کلنگ (پیک‌اکس) در برابر حملات احتمالی آمریکا، واشنگتن در حال کار روی نسل جدیدی از بمب‌های نفوذگر و سنگرشکن است که احتمالا می‌توانند در «کوه کلنگ» نفوذ کنند. این تاسیسات زیرزمینی در نزدیکی مجموعه هسته‌ای نطنز است و بنا بر گزارش شبکه خبری «سی ان ان»، بررسی شش‌ساله تصاویر ماهواره‌ای توسط «مرکز مطالعات راهبردی و بین‌المللی» مستقر در واشنگتن (CSIS) نشان داده است که فعالیت‌های ساختمانی در این محل در سال ۲۰۲۶ به شکل محسوسی افزایش یافته تا احتمالا به یک پناهگاه امن برای برنامه هسته‌ای ایران تبدیل شود. تحلیل «مرکز مطالعات راهبردی و بین‌المللی» همچنین نشان می‌دهد که بخش مهمی از این فعالیت‌ها مربوط به تقویت و مقاوم‌سازی ورودی‌های تاسیسات، آسفالت و آماده‌سازی شبکه جاده‌های داخلی، تحکیم مناطق اطراف ورودی‌ها و حذف بقایای حفاری بوده است. به بیان دیگر، ایران ظاهرا در حال آماده‌سازی این مجموعه بگونه‌ای است که بتواند در برابر حملات آینده دوام بیاورد و دسترسی به بخش‌های زیرزمینی آن غیرممکن شود. بر اساس این گزارش، روند ساخت‌وساز در «کوه کلنگ» از اکتبر ۲۰۲۵ سرعت گرفته است؛ یعنی از زمانی که مقامات اطلاعاتی اسرائیل به دولت ترامپ هشدار دادند که ایران احتمالا در حال انتقال سانتریفیوژهای غنی‌سازی اورانیوم و تجهیزات مرتبط با آنها به این مرکز زیرزمینی است. بر اساس تحلیل «مرکز مطالعات راهبردی و بین‌المللی» نوع فعالیت‌های مشاهده‌شده در تصاویر ماهواره‌ای نشان می‌دهد که ایران پس از جنگ سال گذشته و حملات آمریکا و اسرائیل به تاسیسات هسته‌ای خود، تلاش کرده این مجموعه را با سرعت بیشتری مستحکم کند. البته طبق ارزیابی این مرکز، تاسیسات کوه «کوه کلنگ» هنوز در وضعیت لازم برای آغاز عملیات غنی‌سازی اورانیوم نیست."}, {"source": "Euronews Persian", "title": "یاشار سلطانی به یورونیوز: پرونده اختلاس مهدی تاج و چند مدیر فدراسیون فوتبال به دادگاه ارسال شده است", "link": "https://parsi.euronews.com/2026/09/09/the-case-directors-of-iran-football-federation-has-in-court", "summary": "یاشار سلطانی، روزنامه‌نگار و افشاگر پرونده‌های فساد می‌گوید برای مهدی تاج و شماری از ‏مدیران و چهره‌های فدراسیون فوتبال ایران در پرونده‌ای مرتبط با دریافت پاداش‌های جام ‏جهانی ۲۰۲۲ قطر، به اتهام اختلاس کیفرخواست صادر شده و پرونده به دادگاه ارسال شده ‏است.‏", "date_str": "2026-09-09T20:03:43+00:00", "hash": "7472d8410b86ab81", "title_fa": "یاشار سلطانی به یورونیوز: پرونده اختلاس مهدی تاج و چند مدیر فدراسیون فوتبال به دادگاه ارسال شده است", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp یاشار سلطانی، روزنامه‌نگار و افشاگر پرونده‌های فساد می‌گوید برای مهدی تاج و شماری از ‏مدیران و چهره‌های فدراسیون فوتبال ایران در پرونده‌ای مرتبط با دریافت پاداش‌های جام ‏جهانی ۲۰۲۲ قطر، به اتهام اختلاس کیفرخواست صادر شده و پرونده به دادگاه ارسال شده ‏است.‏ آقای سلطانی روز چهارشنبه در پیامی اختصاصی برای یورونیوز، جزئیاتی از این ماجرا را فاش کرد. او گفت: «این پرونده به پاداشی مربوط می‌شود که سال ۲۰۲۲ و در دوره ریاست‌جمهوری ابراهیم رئیسی، پیش از حضور تیم ملی فوتبال ایران در جام جهانی قطر به این تیم اختصاص یافته و مقرر شده بود این پاداش به‌طور اختصاصی در اختیار کادر فنی تیم ملی قرار گیرد؛ اما شماری از مدیران فدراسیون فوتبال خود را در زمره کادر فنی محسوب کرده و هر یک ۲۰ هزار دلار از این مبلغ دریافت کردند.» این روزنامه نگار و کنشگر گفت پس از تشکیل پرونده به اتهام اختلاس، افراد مورد نظر پول‌های دریافتی را بازگرداندند اما رسیدگی قضایی متوقف نشد و در پنجم شهریور برای آنها کیفرخواست صادر و پرونده به دادگاه فرستاده شد. یاشار سلطانی پیشتر در شبکه اجتماعی ایکس از مهدی تاج، محمدمهدی نبی، احسان اصولی‌صفا، تهمورث حیدری، محمدرضا ساکت و خداداد افشاریان به عنوان شماری از متهمان این پرونده نام برده بود. او همچنین با استناد به ماده ۷ قانون تشدید مجازات مرتکبین ارتشاء، اختلاس و کلاهبرداری گفت که وزیر ورزش و جوانان موظف است تا زمان صدور رأی دادگاه، حکم انفصال این افراد از سمت‌هایشان را صادر کند. به گفته او در صورت محکومیت متهمان در دادگاه، انفصال آنها می‌تواند دائمی شود و در صورت تبرئه، امکان بازگشت آنها به سمت‌هایشان وجود خواهد داشت."}, {"source": "BBC Persian", "title": "آیا واشنگتن خود را برای جنگی تا سال ۲۰۲۹ آماده می‌کند؟", "link": "https://www.bbc.com/persian/articles/cn4klzpywmeo?at_medium=RSS&at_campaign=rss", "summary": "پرسش محوری در بخشی از رسانه‌های آمریکا دیگر این نیست که جنگ چگونه پایان خواهد یافت، بلکه این است که آیا واشنگتن و تهران وارد رویارویی فرسایشی تازه‌ای شده‌اند؛ درگیری‌ای که می‌تواند سال‌ها ادامه پیدا کند و پیامدهای آن بازارهای جهانی انرژی را نیز تحت تأثیر قرار دهد.", "date_str": "2026-09-10T07:32:46+00:00", "hash": "2f7ff7dfa6643b6d", "title_fa": "آیا واشنگتن خود را برای جنگی تا سال ۲۰۲۹ آماده می‌کند؟", "summary_fa": "رسانه‌های آمریکا روز چهارشنبه بر این پرسش متمرکز بودند که آیا به جای پرسیدن «جنگ کی و چگونه پایان می‌یابد؟» باید پرسید: «آیا این جنگ در حال تبدیل شدن به یک مناقشه طولانی‌مدت منطقه‌ای است که می‌تواند به شوکی بزرگ در بازارهای انرژی منجر شود؟» روزنامه «وال‌استریت ژورنال» گزارش داده است که شماری از مقام‌های ارشد دولت ترامپ، از جمله جی‌دی ونس، معاون رئیس‌جمهوری، و مارکو روبیو، وزیر خارجه، در گفت‌وگوهای خصوصی از این احتمال سخن گفته‌اند که درگیری با ایران ممکن است تا پایان دوره ریاست‌جمهوری ترامپ، یعنی دو سال و چهار ماه دیگر، ادامه یابد. این ارزیابی تصویری متفاوت از آن چیزی ارائه می‌کند که ترامپ بارها درباره پایان قریب‌الوقوع جنگ مطرح کرده است. او در تازه‌ترین اظهاراتش گفت که فکر می‌کند جنگ بلافاصله پس از انتخابات میان‌دوره‌ای کنگره آمریکا که دو ماه دیگر برگزار می‌شود، پایان خواهد یافت. دونالد ترامپ مدعی شد که ایران می‌کوشد بر نتیجه این انتخابات تأثیر بگذارد تا افرادی در کنگره قدرت را در دست بگیرند که رویکرد سخت‌گیرانه‌ای نسبت به تهران نداشته باشند. ادامه درگیری‌ها در خلیج فارس و تنگه هرمز نیز از محورهای اصلی پوشش رسانه‌های آمریکایی بود. رسانه‌ها به گزارش‌ها درباره حمله آمریکا به نفتکش‌های ایرانی، پاسخ موشکی ایران به پایگاه‌های آمریکا در اردن و همچنین ادعاهای مقام‌های نظامی ایران درباره حمله به ناوگان آمریکا در آب‌های جنوبی ایران پرداختند. در مقابل، فرماندهی مرکزی نیروهای ایالات متحده اعلام کرده است که هیچ کشتی جنگی آمریکایی هدف قرار نگرفته است."}, {"source": "BBC Persian", "title": "چرا روسیه خواهان پیوستن ایران به «پیمان مکه» است؟", "link": "https://www.bbc.com/persian/articles/c980lp44879o?at_medium=RSS&at_campaign=rss", "summary": "سرگی لاوروف گفت روسیه بیش از ۲۰ سال پیش پیشنهاد کرده بود که کشورهای حاشیه خلیج فارس، از جمله «حکومت‌های عربی» و ایران، امکان تدوین یک چارچوب مشترک برای امنیت منطقه‌ای را بررسی کنند.", "date_str": "2026-09-10T05:52:28+00:00", "hash": "270a792499c9af50", "title_fa": "چرا روسیه خواهان پیوستن ایران به «پیمان مکه» است؟", "summary_fa": "اظهارات سرگی لاوروف، وزیر خارجه روسیه، مبنی بر این‌که ایران در آینده می‌تواند به «پیمان دفاعی مکه» بپیوندد، پرسش‌های تازه‌ای را درباره دامنه و آینده این سازوکار جدید دفاعی منطقه‌ای مطرح کرده است. وزیر خارجه روسیه روز هفتم سپتامبر در سخنرانی خود برای دانشجویان و استادان مؤسسه دولتی روابط بین‌الملل مسکو گفت: «اکنون زمان آن فرارسیده است که با کمک عربستان سعودی، ترکیه و پاکستان، همکاری میان کشورها سازمان‌دهی شود.» او با اشاره به پیمان مکه گفت که سه کشور امضاکننده این توافق، «برداشتی مشترک از امنیت جمعی و یک ائتلاف دفاعی» دارند. پاکستان، عربستان سعودی و ترکیه در هفتم اوت ۲۰۲۶ یک توافق دفاعی مشترک امضا کردند که «پیمان دفاعی مکه» نام گرفت. در این توافق تصریح شده بود که «هرگونه حمله مسلحانه به یکی از سه کشور، حمله به همه آنها تلقی خواهد شد.» با این حال، شهباز شریف، نخست‌وزیر پاکستان، و رجب طیب اردوغان، رئیس‌جمهور ترکیه، پیش‌تر تاکید کرده‌اند که این پیمان علیه هیچ کشوری نیست و سایر کشورهای منطقه نیز می‌توانند به آن بپیوندند. سرگی لاوروف نیز به همین موضوع اشاره کرد و گفت: «آنها (پاکستان، عربستان سعودی و ترکیه) می‌گویند که درهای این پیمان به روی کشورهای دیگر نیز باز است؛ نه فقط کشورهای خلیج فارس، بلکه مصر نیز می‌تواند به آن بپیوندد.»"}, {"source": "BBC Persian", "title": "«هشدار محمد بن زاید پیش از هفت اکتبر» در اسرائیل بحران آفرید؛ نتانیاهو تکذیب کرد و از هاآرتص شکایت می‌کند", "link": "https://www.bbc.com/persian/articles/c93vd20q925o?at_medium=RSS&at_campaign=rss", "summary": "گزارش روزنامه هاآرتص درباره هشدار ادعایی محمد بن زاید، رئیس امارات، به بنیامین نتانیاهو پیش از حمله هفت اکتبر، جنجال سیاسی و امنیتی گسترده‌ای در اسرائیل به راه انداخته است. این گزارش مدعی است نتانیاهو هشدار مربوط به آمادگی حماس برای اجرای «عملیاتی بزرگ» را به فرماندهان نهادهای امنیتی منتقل نکرده است؛ ادعایی که دفتر نخست‌وزیر اسرائیل آن را به شدت رد کرده و از شکایت علیه هاآرتص خبر داده است.", "date_str": "2026-09-10T04:22:33+00:00", "hash": "78c20a6ef093d2ce", "title_fa": "«هشدار محمد بن زاید پیش از هفت اکتبر» در اسرائیل بحران آفرید؛ نتانیاهو تکذیب کرد و از هاآرتص شکایت می‌کند", "summary_fa": "گزارش روزنامه هاآرتص درباره هشدار ادعایی محمد بن زاید، رئیس امارات، به بنیامین نتانیاهو پیش از حمله هفت اکتبر، جنجال سیاسی و امنیتی گسترده‌ای در اسرائیل به راه انداخته است. این گزارش مدعی است نتانیاهو هشدار مربوط به آمادگی حماس برای اجرای «عملیاتی بزرگ» را به فرماندهان نهادهای امنیتی منتقل نکرده است؛ ادعایی که دفتر نخست‌وزیر اسرائیل آن را به شدت رد کرده و از شکایت علیه هاآرتص خبر داده است."}, {"source": "BBC Persian", "title": "ترامپ: ایران به دلایل سیاسی تمایلی به پایان دادن به درگیری‌ها پیش از انتخابات آمریکا ندارد", "link": "https://www.bbc.com/persian/articles/clyjq9v7nezo?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ گفته است از نظر او جنگ با ایران احتمالا «بلافاصله پس از انتخابات میان‌دوره‌ای» آمریکا پایان خواهد یافت. آقای ترامپ که در گردهمایی هواداران حزب جمهوری‌خواه در تگزاس سخنرانی می کرد گفت ایران «به دلایل سیاسی» تمایلی به پایان دادن به درگیری‌ها پیش از انتخابات میاندوره‌ای در ایالات متحده که نوامبر (آبان) برگزار می‌شود، ندارد.", "date_str": "2026-09-10T06:22:53+00:00", "hash": "3eb419da18b072f9", "title_fa": "ترامپ: ایران به دلایل سیاسی تمایلی به پایان دادن به درگیری‌ها پیش از انتخابات آمریکا ندارد", "summary_fa": "دونالد ترامپ گفته است ایران «به دلایل سیاسی» تمایلی به پایان دادن به درگیری‌ها پیش از انتخابات میاندوره‌ای در ایالات متحده ندارد که نوامبر (آبان) برگزار می‌شود. رئیس‌جمهور آمریکا که در گردهمایی هواداران حزب جمهوری‌خواه در تگزاس سخنرانی می‌کرد گفت از نظر او جنگ با ایران احتمالا «بلافاصله پس از انتخابات میان‌دوره‌ای» آمریکا پایان خواهد یافت. برخی از چهره‌های سیاسی و مقام‌های دولتی آمریکا همچون اسکات بسنت، وزیر دارایی ایالات متحده در این نشست حاضر بودند. آقای ترامپ گفته است که آمریکا «تقریبا کنترل کامل تنگه هرمز» را در اختیار دارد و این موضوع فشار اقتصادی شدیدی بر ایران وارد کرده است. او گفت این کنترل، توانایی ایران برای صادرات نفت را محدود کرده است. مقام‌های ایرانی می‌گویند که جنگ با بازگشت آمریکا به تفاهم‌نامه‌ای که با میانجیگری پاکستان به دست آمده بود، متوقف خواهد شد اما در عین حال تاثیر محاصره دریایی بنادر ایران از سوی ایالات متحده را هم تایید می کنند. رئیس جمهور آمریکا در این سخنرانی گفته است که اقتصاد ایران در آستانه فروپاشی است و به تورم بالا، سقوط ارزش پول ملی و مشکلات مالی دولت ایران اشاره کرده است."}, {"source": "BBC Persian", "title": "معمای۰۰۷؛ هفت پرسش درباره آینده جیمز باند", "link": "https://www.bbc.com/persian/articles/cn8m1vryvjjo?at_medium=RSS&at_campaign=rss", "summary": "بیش از دو دهه از معرفی آخرین جیمز باند جدید می‌گذرد و حالا گمانه‌زنی‌ها درباره جانشین دنیل کریگ به اوج رسیده است. در حالی که آمازون ام‌جی‌ام روند انتخاب بازیگر نقش ۰۰۷ را آغاز کرده، هواداران منتظر پاسخ به پرسش‌هایی هستند که از هویت باند بعدی گرفته تا آینده این مجموعه سینمایی را در بر می‌گیرد.", "date_str": "2026-09-10T00:43:42+00:00", "hash": "32ec3339fb0c5eec", "title_fa": "معمای۰۰۷؛ هفت پرسش درباره آینده جیمز باند", "summary_fa": "منبع تصویر، WireImage/Corbis via Getty Images جیمز باند شخصیتی ویژه است. بازی در این نقش، بازیگر را وارد جمعی فوق‌العاده استثنایی و برگزیده از هنرپیشگان می‌کند. از شان کانری تا دنیل کریگ، تنها شش نفر در مجموعه رسمی فیلم‌های باند نقش او را ایفا کرده‌اند. برای این که تصور بهتری از این عدد داشته باشیم، بد نیست بدانیم که تنها در یک دهه گذشته، شمار نخست‌وزیران بریتانیا از شمار بازیگران نقش جیمز باند بیشتر بوده است و شمار کسانی که روی ماه قدم گذاشته‌اند، دو برابر کسانی است که نقش این مامور مخفی بریتانیایی را بازی کرده‌اند. آخرین بار ۲۱ سال پیش بود که یک باند جدید معرفی شد. بنابراین طبیعی است که هواداران جیمز باند، پرسش‌هایی درباره آینده یکی از پرطرفدارترین نقش‌های سینما در یکی از بزرگ‌ترین مجموعه‌های سینمایی داشته باشند. این همان پرسش بزرگی است که هواداران در شش سال گذشته درباره آن گفت‌وگو کرده‌اند. با نزدیک‌تر شدن زمان اعلام رسمی، گمانه‌زنی‌ها شدت گرفته است. ماه ها و شاید سال‌ها است که نام همان چهره‌های آشنا مطرح می‌شود. این نام‌ها به‌طور کلی شامل هنری کویل، هریس دیکینسون، جیکوب الوردی، جک لودن، جیمز نورتون، جک اوکانل، کالوم ترنر و آرون تیلورجانسون بوده است."}, {"source": "BBC Persian", "title": "چرا روابط بریتانیا و اسرائیل به پایین‌ترین سطح خود در چند دهه اخیر رسیده است؟", "link": "https://www.bbc.com/persian/articles/ckgx4mpn4zmo?at_medium=RSS&at_campaign=rss", "summary": "واکنش اسرائیل به تصمیم لندن برای ممنوع کردن تجارت با شهرک‌های اسرائیلی در کرانه غربی اشغالی، نشان‌دهنده اهمیت این تحول است.", "date_str": "2026-09-09T22:48:34+00:00", "hash": "3936fa03bc212639", "title_fa": "چرا روابط بریتانیا و اسرائیل به پایین‌ترین سطح خود در چند دهه اخیر رسیده است؟", "summary_fa": "واکنش خشمگینانه اسرائیل به تصمیم دولت بریتانیا برای ممنوع کردن تجارت با شهرک‌های اسرائیلی در کرانه غربی اشغالی، نشان‌دهنده اهمیت این تحول است. بیشترین سهم خشم اسرائیل متوجه بریتانیا بود، اما این واقعیت که ۱۲ کشور تصمیم گرفتند به‌صورت هماهنگ دست به این اقدام بزنند، به‌وضوح بر شدت این خشم افزود. مقام‌های لندن از ابتدا می‌دانستند که چنین تغییر چشمگیری در سیاست مربوط به مناقشه اسرائیل و فلسطین با واکنشی خصمانه روبه‌رو خواهد شد، اما به نظر می‌رسد از سرعت و شدت واکنش اسرائیل غافلگیر شده‌اند. بستن کنسولگری بریتانیا در بیت المقدس شرقی، که به امور کرانه غربی رسیدگی می‌کند و مستقیما با تشکیلات فلسطینی در رام‌الله در ارتباط است، و همچنین کنار گذاشتن نمایندگان بریتانیا از مرکز بین‌المللی حمایت از غزه، نهادی که سال گذشته برای هماهنگی تلاش‌های امدادی و تثبیت اوضاع در نوار غزه ایجاد شد، اقداماتی بسیار خصمانه به شمار می‌روند. این اقدامات نشان می‌دهد اسرائیل عمیقا از تصمیم بریتانیا و ۱۱ کشور دیگر، از جمله فرانسه، اسپانیا و کانادا، نگران و ناراضی است. محصولات تولیدشده در شهرک‌ها شاید سهم قابل توجهی از صادرات اسرائیل را تشکیل ندهند، اما اهمیت نمادین سیاسیِ جدا کردن این محصولات و مشمول رفتار ویژه قرار دادن آنها بسیار زیاد است."}, {"source": "BBC Persian", "title": "مصرف نوشیدنی‌های خیلی داغ خطر ابتلا به سرطان مری را افزایش می‌دهد", "link": "https://www.bbc.com/persian/articles/c305z91rd9mo?at_medium=RSS&at_campaign=rss", "summary": "نتایج یک تحقیق در بریتانیا نشان می‌دهد که نوشیدن منظم نوشیدنی‌های مانند چای و قهوه با حرارت بسیار بالا، خطر ابتلا به سرطان مری را افزایش می‌دهد.", "date_str": "2026-09-09T21:25:35+00:00", "hash": "1fa0826d531cb7f4", "title_fa": "مصرف نوشیدنی‌های خیلی داغ خطر ابتلا به سرطان مری را افزایش می‌دهد", "summary_fa": "00:36 توضیح ویدئو، «خیلی داغ» چقدر داغ است؟ اطلاعات مقاله نویسنده, میشل رابرتز شغل, سردبیر بخش سلامت دیجیتال منتشر شده در ۱۸ شهریور ۱۴۰۵ - ۹ سپتامبر ۲۰۲۶ زمان مطالعه: ۳ دقیقه نتایج یک تحقیق در بریتانیا نشان می‌دهد که نوشیدن منظم نوشیدنی‌هایی مانند چای و قهوه با حرارت بسیار بالا، خطر ابتلا به سرطان مری را افزایش می‌دهد. محققان می‌گویند این مطالعه که با شرکت نزدیک به یک میلیون نفر انجام شده، بزرگ‌ترین تحقیقی است که تاکنون ارتباط میان نوشیدنی‌های بسیار داغ و سرطان مری را بررسی کرده است. در این مطالعه، خطر ابتلا به سرطان مری در افرادی که نوشیدنی‌های خود را «بسیار داغ» می‌نوشیدند، حدود سه برابر کسانی بود که چای یا قهوه «گرم» می‌نوشیدند؛ با این حال، کارشناسان می‌گویند که احتمال کلی ابتلا به این نوع سرطان پایین است. نوشیدنی‌های بسیار داغ می‌توانند هنگام عبور به سمت معده، به سلول‌های پوشش داخلی مری آسیب بزند. این تحقیق دانشگاه آکسفورد که در «مجله بین‌المللی سرطان» منتشر شده، نوشیدنی‌های با دمای ۶۵ درجه سانتی‌گراد یا بالاتر را «بسیار داغ» و دارای خطر بالقوه توصیف کرده است. براساس داده‌های به‌دست‌آمده از ۹۷۷ هزار و ۲۸۲ زن و مرد میان‌سال، مصرف شش نوشیدنی داغ یا بیشتر در روز نیز خطر ابتلا به سرطان مری را افزایش می‌دهد."}, {"source": "Radio Farda", "title": "دیده‌بان حقوق بشر: حکومت ایران معترضان را «هفتگی» اعدام می‌کند؛ جان ده‌ها نفر در خطر", "link": "https://www.radiofarda.com/a/iran-protester-executions-human-rights-watch/33851700.html", "summary": "دیده‌بان حقوق بشر و مرکز عبدالرحمن برومند می‌گویند مقام‌های جمهوری اسلامی در ماه‌های اخیر معترضان و مخالفان را به‌طور هفتگی و پس از محاکمه‌هایی «به‌شدت ناعادلانه» اعدام کرده‌اند.", "date_str": "2026-09-10T11:58:45+00:00", "hash": "b200c3eb2f370f7c", "title_fa": "دیده‌بان حقوق بشر: حکومت ایران معترضان را «هفتگی» اعدام می‌کند؛ جان ده‌ها نفر در خطر", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند دیده‌بان حقوق بشر و مرکز عبدالرحمن برومند در گزارشی مشترک می‌گویند مقام‌های جمهوری اسلامی در ماه‌های اخیر معترضان و مخالفان سیاسی را به‌طور هفتگی و پس از محاکمه‌هایی «به‌شدت ناعادلانه» اعدام کرده‌اند و ده‌ها نفر دیگر نیز با خطر قریب‌الوقوع اعدام روبه‌رو هستند. این دو نهاد حقوق بشری در گزارش خود که روز پنج‌شنبه ۱۹ شهریور منتشر شد، اعلام کردند از ۲۷ اسفند ۱۴۰۴ مارس تا ۹ شهریور امسال امسال دست‌کم ۵۹ مرد با اتهام‌های سیاسی و امنیتی «مبهم» و پس از محاکمه‌های ناعادلانه اعدام شده‌اند. از این تعداد دست‌کم ۲۹ نفر در ارتباط با اعتراضات دی‌ماه ۱۴۰۴ بازداشت شده بودند و دست‌کم سه نفر دیگر نیز بنا بر گزارش‌ها از بازداشت‌شدگان اعتراضات «زن زندگی آزادی» در سال ۱۴۰۱ بودند. شماری از اعدام‌شدگان تنها ۱۸ یا ۱۹ سال داشتند و بسیاری دیگر در اوایل دهه بیست زندگی خود بودند. دیده‌بان حقوق بشر و مرکز برومند با اشاره به اعدام پنج نفر از این افراد در ملأعام گفته‌اند استفاده از اعدام‌های علنی نشانه‌ای از تشدید به‌کارگیری مجازات مرگ برای ایجاد هراس و جلوگیری از اعتراض‌های بیشتر مردم است. بهار صبا، پژوهشگر ارشد ایران در دیده‌بان حقوق بشر، گفت حکومت ایران معترضان، از جمله نوجوانان، را بر پایه «اعترافات زیر شکنجه» و پس از روندهای قضایی بسیار شتاب‌زده به پای چوبه دار می‌فرستد."}, {"source": "Radio Farda", "title": "تشدید سرکوب در روسیه؛ صدها نوجوان به «تروریسم» و «خیانت» متهم شده‌اند", "link": "https://www.radiofarda.com/a/russian-minors-are-face-terrorism-charges-added-to-terrorists-extremists-registry/33851516.html", "summary": "صدها نوجوان روسی از زمان آغاز جنگ روسیه و اوکراین با اتهام‌هایی چون «تروریسم» و «خیانت» مواجه شده‌اند که به‌گفتهٔ فعالان حقوق بشر، بخشی از تشدید سرکوب مخالفان و منتقدان جنگ است.", "date_str": "2026-09-10T07:18:13+00:00", "hash": "ba57f83026d1084c", "title_fa": "تشدید سرکوب در روسیه؛ صدها نوجوان به «تروریسم» و «خیانت» متهم شده‌اند", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند صدها نوجوان روس از زمان آغاز تهاجم تمام‌عیار روسیه به اوکراین با اتهام‌هایی چون «تروریسم»، «خرابکاری»، «افراط‌گرایی» و «خیانت» روبه‌رو شده‌اند که به‌گفتهٔ فعالان حقوق بشر، بخشی از تشدید سرکوب مخالفان و منتقدان جنگ در روسیه است. به گزارش رادیو ارپای آزاد/رادیو آزادی، با استناد به گزارش سازمان حقوق بشری «دپارتمان یک»، دست‌کم ۷۷۹ فرد زیر سن قانونی در فهرست تروریست‌ها و افراط‌گرایان روسیه قرار دارند و نزدیک به ۹۷ درصد آن‌ها پس از سال ۲۰۲۲، یعنی پس از آغاز جنگ اوکراین، به این فهرست افزوده شده‌اند. گروه حقوق بشری «مموریال» نیز می‌گوید دست‌کم ۱۲۴ فرد زیر سن قانونی در روسیه به دلایل سیاسی با پروندهٔ کیفری روبه‌رو هستند. پرونده‌های این نوجوانان طیف گسترده‌ای دارد؛ از انتشار مطالب ضدجنگ و انتقاد از ولادیمیر پوتین در شبکه‌های اجتماعی تا اتهام همکاری با سرویس‌های اطلاعاتی اوکراین برای انجام خرابکاری در خاک روسیه. در برخی پرونده‌ها، مقام‌های روسیه مدعی شده‌اند نوجوانان از طریق شبکه‌های اجتماعی از سوی سرویس‌های اطلاعاتی اوکراین جذب شده و برای آتش‌زدن تأسیسات، تخریب اموال یا دیگر اقدامات خرابکارانه آموزش دیده‌اند. گروه‌های حقوق بشری اما می‌گویند در بسیاری از این پرونده‌ها به دلیل غیرعلنی بودن تحقیقات و دادگاه‌ها، امکان بررسی مستقل شواهد و ادعاهای نهادهای امنیتی وجود ندارد."}, {"source": "Radio Farda", "title": "حوثی‌ها شهر بندری «المخا» در نزدیکی تنگهٔ باب‌المندب را «تصرف کردند»", "link": "https://www.radiofarda.com/a/yemen-houthis-saudi-arabia-clashes-taiz-khamis-mushait/33851466.html", "summary": "این تازه‌ترین نشانه از تشدید درگیری میان ریاض و حوثی‌های تحت حمایت حکومت ایران است که در روزهای اخیر، هم در داخل یمن و هم در خاک عربستان، جریان دارد.", "date_str": "2026-09-10T05:51:23+00:00", "hash": "6f3ab015322e2a2a", "title_fa": "حوثی‌ها شهر بندری «المخا» در نزدیکی تنگهٔ باب‌المندب را «تصرف کردند»", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند گزارش‌ها از یمن حاکی است که حوثی‌های مورد حمایت ایران روز پنجشنبه ۱۹ شهریور با پیشروی در غرب یمن، توانستند بندر «المخا» را که نزدیک تنگهٔ باب‌المندب است تصرف کنند. چهار منبع نظامی دولت یمن در گفت‌وگو با خبرگزاری رویترز تأیید کردند که حوثی‌های کنترل شهر تاریخی المخا را به دست گرفته‌اند. المخا در حدود ۷۵ کیلومتری شمال تنگهٔ باب‌المندب قرار دارد و این پیشروی می‌تواند نفوذ این گروه بر این تنگه را که یکی از مهم‌ترین مسیرهای کشتیرانی جهان است، افزایش دهد. رسانه‌های نزدیک به حوثی‌ها ساعاتی پیش از این گزارش گفته بودند نیروهای این گروه پادگان «خالد بن ولید» و تقاطع منتهی به بندر المخا در استان تعز را تصرف کرده‌اند. منابع رویترز گفته‌اند که حوثی‌ها همچنین حملاتی را علیه جزایر راهبردی «حنیش» در دریای سرخ آغاز کرده‌اند و نیروهای دولتی و متحدان‌شان در حال عقب‌نشینی و استقرار دوباره در جنوب، در منطقهٔ ذُباب، هستند."}],
      tech: [{"source": "MIT AI", "title": "MIT Schwarzman College of Computing launches pilot to help educators teach AI across disciplines", "link": "https://news.mit.edu/2026/mit-schwarzman-college-computing-launches-pilot-help-educators-teach-ai-across-disciplines-0909", "summary": "This summer, the MIT Schwarzman College of Computing welcomed faculty from colleges and universities across Greater Boston, South Carolina, West Virginia, and Texas to campus for the inaugural AI Educators Pilot, a weeklong workshop aimed at expanding how artificial intelligence is taught across disciplines and learning environments. Inspired by MIT class C01/C51 (Modeling with Machine Learning) , a course developed through the Common Ground for computing and AI education that focuses on helping students understand and apply foundational AI and machine learning concepts to problem-solving in their own disciplines, the workshop gave educators an opportunity to explore how its materials and teaching methods could be adapted for their classrooms. “The broader goal is to expand AI education to more students by investing in training for instructors,” says Dan Huttenlocher, dean of the MIT Schwarzman College of Computing and the Panasonic Professor of Electrical Engineering and Computer Science (EECS). “We want to empower students to become critical thinkers about AI, not just users of the technology,” says Asu Ozdaglar, deputy dean of academics for the MIT Schwarzman College and department head of EECS. A collaborative model for expanding AI education Bringing the program to life required broad collaboration across the college, including support from leadership, staff, and contributions from more than half a dozen instructors in fields ranging from finance and computer science to sustainability. Together, they helped shape a workshop that paired core technical concepts with examples and teaching materials adaptable to a range of classroom settings. “I have not seen an effort quite like it — this many dedicated instructors assembling materials of this richness, all to equip the educators who serve their students,” says Saurabh Amin, the Edmund K. Turner Professor in Civil Engineering and faculty director of the AI Educators Pilot. Amin is also co-director of the Operations Research Center, which is jointly housed within the MIT Schwarzman College of Computing and MIT Sloan School of Management. With support provided by Jake and Robin Reynolds, the pilot brought together 19 participants in July from Allen University, Babson College, Brandeis University, Marshall University, the University of Massachusetts at Lowell, the University of North Texas, and Wentworth Institute of Technology. Working alongside MIT faculty and instructors, participants explored the pedago", "date_str": "2026-09-09T20:40:00+00:00", "hash": "6d63622e4ded48d4", "title_fa": "کالج محاسباتی شوارتزمن MIT آزمایشی راه اندازی کرد تا به مربیان کمک کند تا هوش مصنوعی را در سراسر رشته ها آموزش دهند.", "summary_fa": "تابستان امسال، کالج محاسباتی MIT Schwarzman از اساتید کالج‌ها و دانشگاه‌های سراسر بوستون بزرگ، کارولینای جنوبی، ویرجینیای غربی و تگزاس در محوطه دانشگاه برای افتتاحیه خلبانی مربیان هوش مصنوعی، یک کارگاه یک هفته‌ای با هدف گسترش نحوه آموزش هوش مصنوعی در رشته‌ها و محیط‌های آموزشی استقبال کرد. این کارگاه با الهام از کلاس C01/C51 MIT (مدل سازی با یادگیری ماشین)، دوره ای توسعه یافته از طریق Common Ground برای آموزش محاسبات و هوش مصنوعی که بر کمک به دانش آموزان در درک و به کارگیری مفاهیم پایه هوش مصنوعی و یادگیری ماشینی برای حل مسئله در رشته های خود تمرکز دارد، این کارگاه به مربیان فرصتی داد تا بررسی کنند که چگونه مواد و روش های آموزشی آن می تواند برای کلاس خود تطبیق داده شود. دان هاتنلوچر، رئیس کالج محاسباتی MIT شوارتزمن و پروفسور مهندسی برق و علوم کامپیوتر پاناسونیک (EECS) می‌گوید: «هدف گسترده‌تر گسترش آموزش هوش مصنوعی به دانش‌آموزان بیشتر از طریق سرمایه‌گذاری در آموزش مربیان است. آسو اوزداگلار، معاون دانشکده MIT Schwarzman و رئیس بخش EECS می‌گوید: «ما می‌خواهیم دانش‌آموزان را توانمند کنیم تا به متفکران انتقادی در مورد هوش مصنوعی تبدیل شوند، نه فقط کاربران این فناوری». یک مدل مشارکتی برای گسترش آموزش هوش مصنوعی زنده کردن این برنامه نیازمند همکاری گسترده در سراسر کالج، از جمله حمایت رهبری، کارکنان، و مشارکت بیش از نیمی از مربیان در زمینه‌های مختلف از امور مالی و علوم کامپیوتر تا پایداری است. آنها با هم به شکل گیری کارگاهی کمک کردند که مفاهیم فنی اصلی را با مثال ها و مواد آموزشی سازگار با طیف وسیعی از محیط های کلاس درس جفت می کرد. Saurabh Amin، استاد مهندسی عمران Edmund K. Turner و مدیر دانشکده خلبان AI Educators می‌گوید: «من چنین تلاشی را ندیده‌ام - این تعداد مربی اختصاصی که موادی با این غنا را جمع‌آوری می‌کنند، همه برای"}, {"source": "TechCrunch AI", "title": "Maven Robotics wants to steal your robot deployment deal", "link": "https://techcrunch.com/2026/09/10/maven-robotics-wants-to-steal-your-robot-deployment-deal/", "summary": "Maven Robotics emerged from stealth today with a $100 million Series A and active deployments.", "date_str": "2026-09-10T14:17:37+00:00", "hash": "39127252b72c6355", "title_fa": "Maven Robotics می خواهد قرارداد استقرار ربات شما را بدزدد", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر بیش از 6 مرحله صنعتی را طی می کنند. 25% تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبار: Maven Robotics / Maven Robotics Robotics Maven Robotics می خواهد قرارداد استقرار ربات شما را بدزدد Tim Fernholz 7:17 AM PDT · 10 سپتامبر 2026 — در سال 2024 Robotics یک ربات جدید بود و Maven یک ربات جدید بود. حمزه درباس، مدیرعامل و یکی از بنیانگذاران، تیمی از افراد به TechCrunch گفت. با این حال، آنها شنیدند که یک شرکت بزرگ کالاهای مصرفی با نیازهای لجستیکی در شهر است تا با چهار شرکت روبات رقیب درباره اتوماسیون ملاقات کند. درباس راه خود را برای شرکت در جلسه ای با شرکت مطرح کرد و به جای صحبت در مورد دیدگاه های خود در مورد روبات ها، از کارخانه ها و انبارهای آنها خواست. ما دیدیم که مردم چگونه کار می کنند. او به TechCrunch گفت: ما جریان‌هایی را که می‌توانستیم فوراً ارزشی برای آنها ایجا
