ن و محل این نشست‌ها و حضور مقام‌ها در آن محدوده بود. هدف قرار گرفتن مقام‌های ارشد در دو جنگ نیز آسیب‌پذیری حلقه‌های حفاظتی حکومت ایران را به یکی از مهم‌ترین مسائل امنیتی حکومت تبدیل کرد. اکنون، با افزایش دوباره نگرانی‌ها درباره احتمال آغاز دور دیگری از درگیری، مشخص نیست دستگاه‌های اطلاعاتی جمهوری اسلامی ایران در ماه‌های پس از جنگ ۳۸روزه تا چه اندازه موفق به شناسایی و مسدود کردن مسیرهای دسترسی به این اطلاعات شده‌اند. همزمان، در حالی که برخوردهای گسترده امنیتی و قضایی با شهروندان به‌عنوان همکاری اطلاعاتی با سرویس‌های امنیتی اسرائیل و صدور و اجرای حکم اعدام به اتهام جاسوسی ادامه دارد، اطلاعات بسیار محدودی از نتایج تحقیقات درباره به رخنه‌های اطلاعاتی در بالاترین سطوح حاکمیت به شکل عمومی منتشر شده است. Read More This section contains relevant reference points, placed in (Inner related node field) ضربه به رأس امنیت؛ هشدارهایی که پیش از جنگ مطرح شده بود جمهوری اسلامی ایران در دو جنگ، علی خامنه‌ای، رهبر پیشین، علی لاریجانی، دبیر شورای عالی امنیت ملی، اسماعیل خطیب، وزیر اطلاعات، محمد کاظمی، رئیس سازمان اطلاعات سپاه، و شماری از فرماندهان ارشد نظامی خود را از دست داد. اهمیت این تلفات تنها به جایگاه سیاسی و نظامی افراد کشته‌شده محدود نمی‌شود. برخی از آنها در رأس نهادهایی قرار داشتند که مسئول حفاظت، ضدجاسوسی و مقابله با عملیات اطلاعاتی خارجی بودند. هدف قرار گرفتن این مقام‌ها، آن هم طی حملاتی دقیق، پرسش‌هایی درباره میزان دسترسی مهاجمان به اطلاعات مربوط به محل حضور و رفت‌وآمد آنها ایجاد کرد. گزارش‌های منتشرشده درباره جنگ ۱۲روزه، به نقل از منابع اسرائیلی ، از اشراف اطلاعاتی دقیق بر جزئیاتی مانند محل سکونت، عادت‌های روزانه و حتی محل اتاق خواب برخی اهداف حکایت دارند. این گزارش‌ها همچنین بر استفاده از منابع انسا", "date_str": "2026-10-04T05:40:27+00:00", "hash": "53d22b3fb9474a30", "title_fa": "حفره امنیتی درون جمهوری اسلامی ایران؛ استمرار بی‌پاسخ «نفوذ»", "summary_fa": "احتمال ازسرگیری حملات آمریکا و اسرائیل، جمهوری اسلامی ایران را بار دیگر با مسئله‌ای روبه‌رو کرده که در دو جنگ گذشته نقشی تعیین‌کننده داشت: دسترسی مهاجمان به اطلاعات حساس در قلب ساختار قدرت؛ موضوعی که مقام‌های ایران نی وشک‌های بالستیک اوکراین به مسکو خواهند رسید؟", "link": "https://www.bbc.com/persian/articles/cw8d3ddy89p5o?at_medium=RSS&at_campaign=rss", "summary": "ولودیمیر زلنسکی از نخستین استفاده رزمی موشک بالستیک تاکتیکی اف‌پی-۷ خبر داده است، اما توجه‌ها همچنان به موشک دوربرد اف‌پی-۹ دوخته شده؛ موشکی که شرکت اوکراینی فایر پوینت پیش‌تر وعده داده بود بتواند مسکو را هدف قرار دهد. این شرکت اکنون آزمایش و تکمیل اف‌پی-۹ را به پایان پاییز موکول کرده است؛ تاخیری که در کنار بودجه‌های کلان دولتی و وعده‌های محقق‌نشده، پرسش‌هایی را درباره پیشرفت واقعی برنامه موشکی اوکراین برانگیخته است.", "date_str": "2026-10-04T05:18:22+00:00", "hash": "8dd6d70bd08b32c9", "title_fa": "آیا موشک‌های بالستیک اوکراین به مسکو خواهند رسید؟", "summary_fa": "ولودیمیر زلنسکی از نخستین استفاده رزمی موشک بالستیک تاکتیکی اف‌پی-۷ خبر داده است، اما توجه‌ها همچنان به موشک دوربرد اف‌پی-۹ دوخته شده؛ موشکی که شرکت اوکراینی فایر پوینت پیش‌تر وعده داده بود بتواند مسکو را هدف قرار دهد. این شرکت اکنون آزمایش و تکمیل اف‌پی-۹ را به پایان پاییز موکول کرده است؛ تاخیری که در کنار بودجه‌های کلان دولتی و وعده‌های محقق‌نشده، پرسش‌هایی را درباره پیشرفت واقعی برنامه موشکی اوکراین برانگیخته است. ولودیمیر زلنسکی، رئیس‌جمهور اوکراین، اول اکتبر ۲۰۲۶ از نخستین استفاده رزمی از موشک بالستیک تاکتیکی اف‌پی-۷، ساخت شرکت اوکراینی فایر پوینت، خبر داد. با این حال، همچنان پرسش‌هایی درباره موشک بالستیک دوربرد اف‌پی-۹ مطرح است، که وعده داده شده بود این موشک تابستان ۲۰۲۶ مسکو را هدف قرار دهد. مدیران این شرکت مقررات اروپایی را عامل پیچیده‌تر شدن تولید سوخت جامد موشک دانسته‌اند. آن‌ها همچنین گفته‌اند گزارش‌های اثبات‌نشده درباره ارتباط فایر پوینت با یک بازرگان اوکراینی تحت تحریم، توافق‌ها با دولت دانمارک برای تولید سوخت موشک را مختل کرده است، ادعایی که دولت دانمارک آن را رد می‌کند. برخی مفسران اوکراینی گفته‌اند از وعده‌های تحقق‌نیافته این شرکت درباره موشک‌های بالستیک، که ولودیمیر زلنسکی، رئیس‌جمهور اوکراین، نیز مرتب آن‌ها را تکرار می‌کند، به‌طور فزاینده‌ای آزرده شده‌اند. اما گروهی دیگر می‌گویند پیچیدگی تولید موشک‌های بالستیک باعث می‌شود این تاخیر تعجب‌آور نباشد. دنیس اشتیلرمان، از بنیان‌گذاران فایر پوینت، گفت کپنهاگ در مه ۲۰۲۶ قرارداد این شرکت با دولت دانمارک برای تولید سوخت جامد موشک را به حالت تعلیق درآورد. این اتفاق پس از آن رخ داد که رسانه‌های اوکراینی متن مکالمات تلفنی ادعایی را منتشر کردند که نشان می‌داد تیمور میندیچ، شریک تجاری پیشین زلنسکی، یکی از ذی‌نفعان اصلی فایر پوینت است."}, {"source": "BBC Persian", "title": "گسترش نفوذ حوثی‌ها در آفریقا؛ ایران چه نقشی دارد؟", "link": "https://www.bbc.com/persian/articles/c64grg7j897no?at_medium=RSS&at_campaign=rss", "summary": "گزارش‌های اخیر از گسترش روابط حوثی‌های یمن با گروه‌های مسلح در شاخ آفریقا، بار دیگر توجه‌ها را به نقش ایران در این معادله جلب کرده است. هرچند گزارش‌ها از همکاری‌های رو به رشد میان انصارالله و برخی بازیگران مسلح در آن سوی دریای سرخ سخن می‌گویند، کارشناسان بر سر میزان نفوذ تهران بر حوثی‌ها و نقش آن در توسعه این شبکه‌های منطقه‌ای اتفاق نظر ندارند.", "date_str": "2026-10-04T04:14:51+00:00", "hash": "3fc6afab48278f70", "title_fa": "گسترش نفوذ حوثی‌ها در آفریقا؛ ایران چه نقشی دارد؟", "summary_fa": "گزارش‌های اخیر از گسترش روابط حوثی‌های یمن با گروه‌های مسلح در شاخ آفریقا، بار دیگر توجه‌ها را به نقش ایران در این معادله جلب کرده است. هرچند گزارش‌ها از همکاری‌های رو به رشد میان انصارالله و برخی بازیگران مسلح در آن سوی دریای سرخ سخن می‌گویند، کارشناسان بر سر میزان نفوذ تهران بر حوثی‌ها و نقش آن در توسعه این شبکه‌های منطقه‌ای اتفاق نظر ندارند. جنبش انصارالله حوثی‌های یمن پس از تصرف اخیر مناطق راهبردی نزدیک تنگه باب‌المندب و موفقیت در حمله به اهدافی در عمق خاک عربستان سعودی، قدرتمندتر و بانفوذتر به نظر می‌رسد. این رویدادها بازتاب پیشرفت چشمگیر توانایی‌های نظامی حوثی‌ها در سال‌های اخیر است. این توانمندی‌ها در شرایطی به دست آمده‌اند که شواهدی فزاینده از گسترش حضور و روابط حوثی‌ها در آن سوی دریای سرخ وجود دارد. گزارشی که «بنیاد قرن»، موسسه پژوهشی غیرانتفاعی آمریکایی مستقر در نیویورک، منتشر کرد، روابط رو به گسترش انصارالله با گروه‌های مسلح در منطقه شاخ آفریقا را مستند کرده است. پیش‌تر نیز گزارشی از سازمان ملل شواهدی درباره انتقال سلاح و افراد و آموزش میان حوثی‌ها و یکی از این گروه‌ها، یعنی جنبش اسلام‌گرای الشباب سومالی وفادار به القاعده، ارائه کرده بود. روابطی که حوثی‌ها در شاخ آفریقا برقرار کرده‌اند تا چه اندازه عمیق است؟ آیا همان‌طور که گزارش بنیاد قرن اشاره می‌کند، شاهد شکل‌گیری شبکه‌ای منطقه‌ای هستیم؟ آیا گسترش روابط گروه‌های مسلح در دو سوی دریای سرخ ممکن است به پیوند خوردن درگیری‌های موجود بینجامد؟ ندوه الدوساری، پژوهشگر مرکز گروه‌های مسلح و از نویسندگان گزارش بنیاد قرن، به بی‌بی‌سی عربی می‌گوید بسیاری از روابط حوثی‌ها در شاخ آفریقا در ابتدا به منفعت متقابل و معامله محدود بود: «حوثی‌ها همواره برای انتقال سلاح، افراد و کالا به قاچاقچیان و شبکه‌های تبهکاری در شاخ آفریقا متکی بوده‌اند، اما دریافتیم که این روابط به‌طور چشمگیری گسترش یافته‌اند؛ به‌ویژه پس از رویدادهای هفتم اکتبر.»"}, {"source": "BBC Persian", "title": "اگر جنگ به فضا کشیده شود؛ ماهواره‌ها چگونه هدف قرار می‌گیرند؟", "link": "https://www.bbc.com/persian/articles/cx2mk2j6v8vo?at_medium=RSS&at_campaign=rss", "summary": "در دوران جنگ سرد، آمریکا و روسیه روی زمین، در آسمان، زیر دریا و همچنین، بدون جلب توجه چندان، در فضا با یکدیگر مقابله می‌کردند. اما اکنون تنش‌ها بار دیگر در مدار زمین رو به افزایش است و این بار در معرض دید همگان قرار دارد. اهمیت موضوع نیز کم نیست؛ چرا که اقتصاد فضایی جهان با ارزشی حدود ۶۲۶ میلیارد دلار ممکن است در معرض خطر قرار گیرد.", "date_str": "2026-10-04T00:03:50+00:00", "hash": "01d779891ee83ecc", "title_fa": "اگر جنگ به فضا کشیده شود؛ ماهواره‌ها چگونه هدف قرار می‌گیرند؟", "summary_fa": "در دوران جنگ سرد، آمریکا و روسیه روی زمین، در آسمان، زیر دریا و همچنین، بدون جلب توجه چندان، در فضا با یکدیگر مقابله می‌کردند. اما اکنون تنش‌ها بار دیگر در مدار زمین رو به افزایش است و این بار در معرض دید همگان قرار دارد. اهمیت موضوع نیز کم نیست؛ چرا که اقتصاد فضایی جهان با ارزشی حدود ۶۲۶ میلیارد دلار ممکن است در معرض خطر قرار گیرد. حدود ساعت ۳ بامداد ۲۴ فوریه ۲۰۲۲، هزاران مودم ماهواره‌ای در سراسر اوکراین و اروپای مرکزی از کار افتادند. چند ساعت بعد، تهاجم روسیه به اوکراین آغاز شد. کری بینگن، مدیر پروژه امنیت هوافضا در مرکز مطالعات راهبردی و بین‌المللی آمریکا، می‌گوید: «نخستین حمله جنگ روسیه و اوکراین، ورود تانک‌ها به خاک اوکراین نبود بلکه حمله‌ای سایبری به یک سامانه ماهواره‌ای تجاری بود که بعدها به دولت روسیه نسبت داده شد.» «چرا چنین کاری کردند؟ می‌خواستند توانایی ارتش و دولت اوکراین برای برقراری ارتباط را تضعیف کنند.» در جنگ‌های مدرن، نخستین گلوله ممکن است نه از یک تفنگ یا موشک، بلکه در قالب رشته‌ای از کدهای مخرب شلیک شود؛ کدهایی که ماهواره‌های در حال گردش به دور زمین را هدف می‌گیرند. اوایل فوریه مشخص شد دو ماهواره روسی احتمالا از زمان تهاجم روسیه به اوکراین در سال ۲۰۲۲، ارتباطات دست‌کم ۱۲ ماهواره اروپایی را رهگیری کرده‌اند. چنین رهگیری‌هایی ممکن است به سرویس‌های اطلاعاتی روسیه امکان داده باشند داده‌های حساسی را که این ماهواره‌ها منتقل می‌کنند بخوانند یا حتی، به‌طور فرضی، کنترل آن‌ها را در اختیار بگیرند. در چند سال گذشته، تلسکوپ‌های مستقر روی زمین و دوربین‌های مداری، دو ماهواره روسی به نام‌های «لوچ-۱» و «لوچ-۲» را رصد کرده‌اند که مجموعه‌ای از مانورهای مشکوک را در مدار انجام داده‌اند. به‌ویژه مشاهده شده است که این دو ماهواره به ماهواره‌های زمین‌ایستای مهم اروپا، هرچند قدیمی، بسیار نزدیک شده‌اند. از جمله این ماهواره‌ها می‌توان"}, {"source": "BBC Persian", "title": "چه گنجینه‌هایی از دنیای باستان هنوز پیدا نشده‌اند؟", "link": "https://www.bbc.com/persian/articles/c9wxxd9jn7ko?at_medium=RSS&at_campaign=rss", "summary": "از نقاشی‌های گمشده غارها و ابزارهای چوبی که هزاران سال پیش پوسیده‌اند تا اجساد باتلاقی، روستاهای ناشناخته و ردپای بیماری‌هایی که تمدن‌های باستانی را دگرگون کرده‌اند؛ باستان‌شناسان معتقدند هنوز کشف‌های بزرگی در انتظارند. اگر این آثار روزی از دل خاک یا لایه‌های پنهان تاریخ بیرون آورده شوند، می‌توانند بسیاری از دانسته‌های ما درباره زندگی انسان‌های گذشته را به چالش بکشند و حتی تاریخ را از نو روایت کنند.", "date_str": "2026-10-03T21:16:18+00:00", "hash": "f2a0b88ea8ae9339", "title_fa": "چه گنجینه‌هایی از دنیای باستان هنوز پیدا نشده‌اند؟", "summary_fa": "از نقاشی‌های گمشده غارها و ابزارهای چوبی که هزاران سال پیش پوسیده‌اند تا اجساد باتلاقی، روستاهای ناشناخته و ردپای بیماری‌هایی که تمدن‌های باستانی را دگرگون کرده‌اند؛ باستان‌شناسان معتقدند هنوز کشف‌های بزرگی در انتظارند. اگر این آثار روزی از دل خاک یا لایه‌های پنهان تاریخ بیرون آورده شوند، می‌توانند بسیاری از دانسته‌های ما درباره زندگی انسان‌های گذشته را به چالش بکشند و حتی تاریخ را از نو روایت کنند. وقتی باستان‌شناس باشید، تا زمانی که یافته‌ای درست مقابل چشمانتان قرار نگیرد، نمی‌دانید قرار است چه چیزی کشف کنید. آیا حفاری بعدی‌تان رازی از گذشته را آشکار خواهد کرد که همه دانسته‌های ما درباره مردمانی را که هزار سال پیش زندگی می‌کردند زیر و رو کند؟ یا این‌که دست خالی بازخواهید گشت؟ اگر از یک باستان‌شناس بپرسید فکر می‌کند چه چیزهایی هنوز در انتظار کشف شدن هستند، ممکن است در ابتدا با احتیاط پاسخ دهد. اما اگر کمی بیشتر کنجکاوی کنید، بسیاری از آن‌ها در نهایت اعتراف می‌کنند که فهرستی از آرزوهای حرفه‌ای در ذهن دارند؛ اشیا و آثاری که دوست دارند روزی از دل خاک بیرون بکشند. بی‌بی‌سی این پرسش را با دو باستان‌شناس در میان گذاشت. پاسخ‌های آن‌ها نشان می‌دهد که اگر این کشفیات هیجان‌انگیز روزی به دست آیند، می‌توانند بسیاری از باورهای ما درباره گذشته را به چالش بکشند. جیل کوک، مسئول بخش بریتانیا، اروپا و پیشاتاریخ در موزه بریتانیا، می‌گوید فناوری‌های جدید و بهبود سامانه‌های نورپردازی می‌توانند به کشف نقاشی‌ها یا طرح‌های بیشتری بر دیوار غارها منجر شوند. هنر باستانی سرنخ‌هایی از شیوه تفکر انسان‌های ساکن غارها به ما می‌دهد. برای نمونه، تصاویر یک خوک و چند پیکره انسان‌مانند که در ژوئیه ۲۰۲۴ در جزیره سولاوسی اندونزی کشف شدند، نشان دادند انسان‌هایی که دست‌کم ۵۱ هزار و ۲۰۰ سال پیش زندگی می‌کردند، توانایی تفکر خلاقانه و قصه‌گویی داشته‌اند."}, {"source": "Radio Farda", "title": "رئیس‌جمهور یمن از آغاز عملیات بزرگ علیه حوثی‌های مورد حمایت ایران خبر داد", "link": "https://www.radiofarda.com/a/yemen-leader-announces-major-military-operations-against-iran-backed-houthis/33870092.html", "summary": ".", "date_str": "2026-10-04T13:15:47+00:00", "hash": "73bebc22b34221f8", "title_fa": "رئیس‌جمهور یمن از آغاز عملیات بزرگ علیه حوثی‌های مورد حمایت ایران خبر داد", "summary_fa": "رشاد العلیمی، رئیس شورای ریاست‌جمهوری یمن، روز یکشنبه ۱۲ مهر از آغاز یک عملیات نظامی گسترده علیه شورشیان حوثی مورد حمایت ایران را با هدف بازپس‌گیری مناطق تحت کنترل این گروه اعلام کرد. علیمی در یک سخنرانی تلویزیونی گفت: «امروز آغاز عملیات نظامی برای بازپس‌گیری مناطق باقی‌مانده جمهوری و گسترش حاکمیت دولت و نهادهای آن بر سراسر قلمرو ملی را اعلام می‌کنم.» مقام‌های منطقه‌ای و غربی پیش‌تر به خبرگزاری رویترز گفته بودند عربستان سعودی و متحدان یمنی آن در حال برنامه‌ریزی برای حمله به حوثی‌ها هستند؛ به‌گونه‌ای که نیروهای سعودی عملیات هوایی را هدایت کنند و نیروهای یمنی در میدان زمینی بجنگند. حکومت ریاض در سال ۲۰۱۵، در رأس ائتلافی عربی، وارد جنگ داخلی یمن شد و از دولت به رسمیت شناخته‌شده بین‌المللی حمایت کرد؛ دولتی که حوثی‌ها آن را از صنعا، پایتخت، بیرون رانده بودند. آتش‌بسی که در سال ۲۰۲۲ میان طرف‌های درگیر توافق شد، تا حد زیادی پابرجا ماند تا اینکه حوثی‌ها امسال، در پی جنگ آمریکا و اسرائیل با ایران، حملات موشکی و پهپادی علیه کشتی‌رانی و زیرساخت‌های نفتی عربستان انجام دادند. رئیس‌جمهور یمن روز یکشنبه همچنین گفت تصمیم برای آغاز ضدحمله پس از آن اتخاذ شد که تمامی فرصت‌ها برای کاهش تنش به پایان رسیده است. او حوثی‌ها را متهم کرد که در واکنش به تلاش‌ها برای آرام کردن درگیری‌ها، به بسیج نیرو و تشدید تنش‌ها ادامه داده‌اند. او گفت: «موضع ما امروز این است که پس از آنکه همه فرصت‌ها برای کاهش تنش به پایان رسیده، مسئولیت ملی مقابله با شبه‌نظامیان حوثی را بر عهده بگیریم.» العلیمی افزود به نیروهای مسلح، نیروهای امنیتی و تمامی تشکل‌های نظامی دستور داده است اجرای مأموریت‌های محوله خود را بر اساس طرح‌های مصوب آغاز کنند. رویترز می‌گوید با وجود آمادگی‌ها برای انجام یک ضدحمله، حوثی‌ها تاکنون ابتکار عمل را در میدان حفظ کرده‌اند. چند هفته پس از آنکه این"}, {"source": "Radio Farda", "title": "زلنسکی: اوکراین به زدن پالایشگاه‌های نفت روسیه «با قوت بیشتر ادامه خواهد داد»", "link": "https://www.radiofarda.com/a/ukraine-will-hit-russian-refineries-in-response-to-moscow-s-new-doctrine-of-airstrikes-zelenskiy-says/33869992.html", "summary": "ولودیمیر زلنسکی، رئیس جمهور اوکراین، روز شنبه، ۱۱ مهرماه، در مصاحبه‌ای وعده داد که ارتش کشورش به هدف گرفتن پالایشگاه‌های نفت روسیه «با قوت بیشتر»  Verge 's Nilay Patel and MKBHD's Marques Brownlee join David Pierce to help explain the history of ChromeOS and Chromebooks, and discuss whether Google's approach to computer hardware was the right one. View Link This has been an exciting season of Version History , as we've been exploring the most iconic school tech. Last week's episode explored Nicholas Negroponte … Read the full story at The Verge.", "date_str": "2026-10-04T12:00:00+00:00", "hash": "f57079532354e032", "title_fa": "Chromebook فراموش شده که همه چیز را آغاز کرد", "summary_fa": "گوگل حتی اولین کروم بوک را \"کروم بوک\" نامید. Cr-48 هیچ طراحی جالب و آرم روشنی نداشت - حتی به گونه‌ای طراحی نشده بود که بتوانید محصولی را بخرید. در عوض، این پورتالی بود برای یک ایده جدید بزرگ در مورد کامپیوتر. در قسمت این هفته از تاریخچه نسخه، Nilay Patel از The Verge و Marques Brownlee از MKBHD به دیوید پیرس می‌پیوندند تا به توضیح تاریخچه ChromeOS و Chromebook کمک کنند و درباره اینکه آیا رویکرد Google به سخت‌افزار رایانه درست بوده است یا خیر، صحبت می‌کنند. مشاهده پیوند این یک فصل هیجان انگیز از تاریخچه نسخه بوده است، زیرا ما در حال بررسی نمادین ترین فناوری مدرسه بوده ایم. قسمت هفته گذشته نیکلاس نگروپونته را بررسی کرد… داستان کامل را در The Verge بخوانید. پادکست گجت‌ها فناوری Chromebook فراموش‌شده که همه چیز را آغاز کرد در تاریخچه نسخه: مارکز براونلی و نیلای پاتل انتشار Cr-48، نمونه اولیه لپ‌تاپ Google را دوباره زنده کردند. Victoria Barrios 4 اکتبر 2026، ساعت 12:00 UTC پیوند به اشتراک گذاری هدیه Victoria Barrios یک تهیه کننده ناظر است که بر عملیات تحریریه تیم های ویدیویی و صوتی ما متمرکز است. او یک دهه تجربه در روزنامه نگاری ویدیویی و ارتباطات علمی دارد. گوگل حتی اولین کروم بوک را \"Chromebook\" نامید. Cr-48 هیچ طراحی جالب و لوگوی روشنی نداشت - حتی برای محصولی طراحی نشده بود که بتوانید بخرید. در عوض، این پورتالی بود برای یک ایده جدید بزرگ در مورد کامپیوتر. در اپیزود این هفته از تاریخچه نسخه، نیلی پاتل از The Verge و مارکز براونلی از MKBHD به دیوید پیرس می‌پیوندند تا به توضیح تاریخچه ChromeOS و Chromebook کمک کنند و در مورد 3 تجاری در نظر گرفته می شود. تقریباً به اندازه یک دسته کارت بود و شبیه یک پیجر بزرگ بود. در مارس 1998 در آسیا پرتاب شد، اما به سختی در رادار کسی قرار گرفت. این Diamond Rio PMP300 بود که چند ماه بعد، در سپتامبر 1998، در غرب رخنه کرد. کمی بزرگتر بود، و طراحی آن بیشتر شبیه چیزی است که وقتی به یک پخش کننده رسانه (یعنی iPod) فکر می کنیم، تصور می کنیم. اما حتی پس از آن، توجه بیشتری را به خود جلب کرد زیرا انجمن صنعت ضبط آمریکا (RIAA) از Diamond Multimedia در تلاش برای جلوگیری از گسترش MP3 ها شکایت کرد. بدون تعجب، F10 و PMP300 با استانداردهای امروزی ابتدایی بودند و تنها با 32 مگابایت - بله، مگابایت - فضای ذخیره سازی عرضه می شدند. این مقدار"}, {"source": "The Verge", "title": "Amazon’s colorful and sturdy new Kindles", "link": "https://www.theverge.com/tech/1004199/amazon-kindle-openai-dots-witcher-3-remastered-bose-wired-headphones", "summary": "Hi, friends! Welcome to Installer No. 146, your guide to the best and Verge -iest stuff in the world. (If you're new here, welcome, it's October already?, and also you can read all the old editions at the Installer homepage .) This week, I'm wishing I could do Walmart potato drone delivery in Portland , watching Mike Tomlin explain his incredible Minecraft city , pondering if the Gears of War pizza cutter is awesome or terrible, exploring Craig Mod's walks , nodding along with MKBHD's video about YouTube's A/B video testing feature , hoping that more concerts ban phones , and celebrating soup season. It's here! Programming note: David is back ne … Read the full story at The Verge.", "date_str": "2026-10-04T12:00:00+00:00", "hash": "55a57db6c511e815", "title_fa": "کیندل های رنگارنگ و محکم آمازون جدید", "summary_fa": "سلام دوستان به Installer No. 146، راهنمای شما برای بهترین و Verge-iest چیزهای جهان خوش آمدید. (اگر اینجا تازه وارد هستید، خوش آمدید، الان اکتبر است؟، و همچنین می‌توانید تمام نسخه‌های قدیمی را در صفحه اصلی Installer بخوانید.) این هفته، آرزو می‌کنم که می‌توانستم تحویل هواپیمای بدون سرنشین والمارت سیب‌زمینی را در پورتلند ان ت، صادر کرد. در اطلاعیه اپل آمده است که Bitchat در اپ استور خود در خارج از هند در دسترس خواهد بود. با این حال، دسترسی به برنامه از طریق سرویس تست بتا TestFlight آن نیز در کشور مسدود خواهد شد. هنگامی که TechCrunch در روز شنبه بررسی شد، Bitchat نیز دیگر برای دانلود از طریق Google Play در هند در دسترس نبود. وب‌سایت Bitchat در سراسر ارائه‌دهندگان خدمات اینترنتی مختلف در کشور غیرقابل دسترسی بود. هنوز مشخص نیست که آیا گوگل و ارائه دهندگان خدمات اینترنتی نیز دستورالعمل هایی را از دولت فدرال دریافت کرده اند یا خیر. اپل، گوگل و وزارت فناوری اطلاعات هند به درخواست ها برای اظهار نظر پاسخ ندادند. Bitchat که در ژوئیه سال گذشته راه اندازی شد، از شبکه مش بلوتوث استفاده می کند تا به دستگاه های اطراف اجازه دهد تا پیام های رمزگذاری شده را بدون اتکا به شبکه های سلولی، دسترسی به اینترنت یا سرورهای متمرکز مبادله کنند. در ژوئیه 2026، دورسی فاش کرد که مقامات هندی به گیت هاب دستور داده اند تا مخازن مرتبط با برنامه پیام رسان متن باز را حذف کند، و"}, {"source": "TechCrunch Main", "title": "Vessev built an electric ferry that almost flies", "link": "https://techcrunch.com/2026/10/03/vessev-built-an-electric-ferry-that-almost-flies/", "summary": "Vessev hopes its electric hydrofoil ferry will change the way people and cities think about boats.", "date_str": "2026-10-03T14:42:00+00:00", "hash": "d3dcc3a47917c427", "title_fa": "Vessev یک کشتی الکتریکی ساخت که تقریباً پرواز می کند", "summary_fa": "Vessev امیدوار است کشتی هیدروفویل برقی آن طرز فکر مردم و شهرها را در مورد قایق ها تغییر دهد. \"چه زمانی پرواز را شروع خواهیم کرد؟\" من از بنیانگذار و مدیر عامل Vessev از اریک لااکمان پرسیدم، در حالی که از اسکله بروکلین در کشتی برقی VS-9 استارت آپ دور می شدیم. ما قبلا هستیم. اعتراف می کنم که کمی ناامید شدم. من فکر می کردم لحظه ای که از قایقرانی مانند یک قایق معمولی به پرواز تقریباً به عنوان یک هیدروفویل سطحی تبدیل می شود، بسیار مهم تر است. من در سهم خود از قایق‌ها، از جمله کشتی‌های بزرگ، قایق‌های بادبانی کوچک، و بسیاری از قایق‌های دیگر در این بین، بوده‌ام، اما هرگز سوار هیدروفویل نشده‌ام و کنجکاو بودم که پرواز در امتداد آب در طی یک سواری کوتاه از مارینا بروکلین به سمت جزیره گاورنر در رودخانه شرقی در نیویورک چه حسی دارد. حس پرواز نداشت، اما کمی شبیه سواری بر یک ماشین اسپرت بود. قایق های سنتی با این اندازه - حدود 30 فوت - با افزایش سرعت شروع به پریدن می کنند و به آب سیلی می زنند. اما در یک هیدروفویل، این زمانی است که فویل ها شروع به انجام کار خود می کنند. در ظاهر، VS-9 مانند بسیاری از کاتاماران های دیگر به نظر می رسد. اما در زیر بدنه دو سازه بال مانند وجود دارد که قایق را در حین عبور از آب بالا می برند. فلپ های زیر آب که توسط کامپیوتر کنترل می شوند، سواری را صاف و پایدار نگه می دارند. در VS-9، بیشتر کار بلند کردن توسط فویل جلو انجام می‌شود که حدود 20 درصد آن توسط عقب انجام می‌شود. فویل عقب نیز میزبان موتور الکتریکی است که Vessev آن را در داخل خود می سازد. چرا آن را برون سپاری نمی کنید؟ Laakmann گفت که مهم است که"}, {"source": "Ars Technica", "title": "All hail electrification. But let’s talk about the hard part.", "link": "https://arstechnica.com/science/2026/10/all-hail-electrification-but-lets-talk-about-the-hard-part/", "summary": "If one form of energy becomes the cheapest, most secure, and cleanest, you’d probably adjust your economy to use more of it, right? That’s one of the ideas underpinning a report the International Energy Agency issued last week about the global move toward electrification. Fatih Birol, head of the IEA, discussed some of the concepts from the report the following day at the United Nations. “Many, many years in the energy world, we had three choices in front of us. Shall I choose the most secure energy option? Shall I choose the most economic energy option? Or shall I choose the cleanest energy option?” he asked . “We have to make choices, we have to make trade-offs but when we look at the world today, for the first time in years, all of these three objectives are getting aligned.” Read full article Comments", "date_str": "2026-10-04T11:05:53+00:00", "hash": "d450ae8b9ae900c3", "title_fa": "تمام برقی شدن تگرگ. اما اجازه دهید در مورد بخش سخت صحبت کنیم.", "summary_fa": "اگر یکی از انواع انرژی ارزان‌ترین، ایمن‌ترین و پاک‌ترین باشد، احتمالاً اقتصاد خود را برای استفاده بیشتر از آن تنظیم می‌کنید، درست است؟ این یکی از ایده‌هایی است که زیربنای گزارشی است که آژانس بین‌المللی انرژی هفته گذشته درباره حرکت جهانی به سمت برق‌رسانی منتشر کرد. فاتح بیرول، رئیس آژانس بین المللی انرژی، روز بعد در سازمان ملل برخی از مفاهیم گزارش را مورد بحث قرار داد. «سال‌های بسیار زیادی در دنیای انرژی، ما سه انتخاب پیش روی خود داشتیم. آیا مطمئن ترین گزینه انرژی را انتخاب کنم؟ آیا اقتصادی ترین گزینه انرژی را انتخاب کنم؟ یا پاک ترین گزینه انرژی را انتخاب کنم؟» او پرسید . ما باید انتخاب کنیم، باید معاوضه کنیم، اما وقتی به جهان امروز نگاه می‌کنیم، برای اولین بار پس از سال‌ها، همه این سه هدف در حال همسو شدن هستند.» مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری اگر یک نوع انرژی ارزان‌ترین، ایمن‌ترین و تمیزترین باشد، احتمالاً اقتصاد خود را برای استفاده بیشتر از آن تنظیم می‌کنید، درست است؟ اشاره بیرول به «سه‌گانه انرژی»، مفهومی در تحقیقات انرژی و اقتصاد در مورد نیاز به تعادل هزینه، امنیت و اثرات زیست‌محیطی منابع و سیستم‌ها. او گفت که این اولویت‌ها به طور فزاینده‌ای به دلیل جنگ ایران، که قیمت سوخت را افزایش داده و نگرانی‌ها در مورد امنیت انرژی را تشدید کرده است، به طور فزاینده‌ای همسو می‌شوند. قابل توجه است که رهبر سازمان تحقیقات انرژی پیشرو در جهان نسبت به برق رسانی بسیار خوشبین است. من این هفته با محققان انرژی تماس گرفتم تا واکنش آنها را دریافت کنم."}, {"source": "Ars Technica", "title": "Milt Windler, NASA flight director who helped save Apollo 13, dies at 94", "link": "https://arstechnica.com/space/2026/10/milt-windler-nasa-flight-director-who-helped-save-apollo-13-dies-at-94/", "summary": "Milt Windler, one of the four leaders of Mission Control who in 1970 directed the round-the-clock efforts to bring the Apollo 13 astronauts back to Earth safely, has died at the age of 94. Windler died on Thursday , surrounded by his loving family, according to a brief notice posted online. Named a NASA flight director in 1968 after working on recovery operations during the Mercury and Gemini programs, Windler also led a shift of flight controllers for the Apollo 8 first circumlunar flight and Apollo 10 lunar landing dress rehearsal, as well as the second, third and fourth moon landings — Apollo 12, Apollo 14 and Apollo 15. He then served as a flight director for all three crewed missions to the United States' first space station, Skylab. Read full article Comments", "date_str": "2026-10-03T19:45:17+00:00", "hash": "05bb3064596f2bfe", "title_fa": "میلت ویندلر، مدیر پرواز ناسا که به نجات آپولو ۱۳ کمک کرد، در ۹۴ سالگی درگذشت", "summary_fa": "میلت ویندلر، یکی از چهار رهبر کنترل ماموریت که در سال 1970 تلاش های شبانه روزی را برای بازگرداندن ایمن فضانوردان آپولو 13 به زمین هدایت کرد، در سن 94 سالگی درگذشت. طبق اطلاعیه کوتاهی که در اینترنت منتشر شد، ویندلر روز پنجشنبه در محاصره خانواده مهربانش درگذشت. ویندلر که در سال 1968 پس از کار بر روی عملیات بازیابی در طول برنامه‌های مرکوری و جمینی، به عنوان مدیر پرواز ناسا معرفی شد، همچنین تغییر کنترلرهای پرواز را برای اولین پرواز دور ماه آپولو 8 و تمرین لباس فرود ماه آپولو 10، و همچنین دومین، سوم و چهارمین پرواز ماه را رهبری کرد. هر سه ماموریت خدمه به اولین ایستگاه فضایی ایالات متحده، Skylab. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید میلت ویندلر، یکی از چهار رهبر کنترل ماموریت که در سال 1970 تلاش های شبانه روزی را برای بازگرداندن آپولو 13 هدایت کرد، فضانوردان دیپل را در سن 9 سالگی به زمین بازگردانده است. سرعتی سریع که فکر نمی‌کنم مردم فرصت فکر کردن به آن را داشته باشند. ویندلر در سال 2006 در یک مصاحبه تاریخ شفاهی برای دانشگاه تگزاس شمالی گفت: بعداً برای من واضح‌تر شد که ما در حال ساختن تاریخ هستیم. ویندلر گفت: «زمانی برای تأمل نبود. هر مدیر پرواز یک نام تیم (در اولین رنگ) انتخاب کرد. ویندلر به عنوان هفتمین فردی که به این سمت منصوب شد he wrapping paper and shipping. Go digital this year with subscriptions, ebooks, apps, and more.", "date_str": "2026-10-04T10:30:00+00:00", "hash": "592daf51b1203bb9", "title_fa": "بهترین کارت های هدیه آنلاین و ایده های هدیه دیجیتال (2026)", "summary_fa": "کاغذ بسته بندی و حمل و نقل را فراموش کنید. امسال با اشتراک‌ها، کتاب‌های الکترونیکی، برنامه‌ها و موارد دیگر دیجیتالی شوید. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان تراول کردن در فروشگاه‌های شلوغ خرده‌فروشی که به دنبال هدایا هستند، کار سختی است. خرید آنلاین می تواند به همان اندازه زمان بر باشد و ممکن است با تاخیر در تحویل مواجه شوید. حتی اگر انبوهی از هدایا را با موفقیت تهیه کنید، بسیاری از آنها در کمدها یا فروشگاه های خیریه جمع می شوند. وقت آن است که یک هدیه آنلاین را امتحان کنید. هدایای دیجیتال و کارت های هدیه آنلاین ساده تر است. از مبل راحتی یا تخت دنج خود خرید کنید—بدون نیاز به بسته بندی هدیه یا ارسال. ما یک smorgasbord مجازی از ایده های هدیه دیجیتالی خوشمزه داریم. همچنین باید اشتراک ها را به عنوان ایده های هدیه در نظر بگیرید. بهترین جعبه های اشتراک ما برای هدیه دادن، بهترین اشتراک های هدیه برای کودکان و بهترین اشتراک های جعبه زیبایی را بررسی کنید. به روز شده در اکتبر 2026: من ورودی ها را در چندین بخش اضافه کرده ام، از جمله غذا، بازی، و سفر. گزینه های متوقف شده حذف شد. و تمام لینک ها و قیمت ها را به روز کرد. کارت‌های هدیه الکترونیکی غذا و رستوران اشتراک‌های فیلم و تلویزیون خدمات پخش موسیقی کتاب‌های الکترونیکی و کتاب‌های صوتی اخبار و مجلات دیجیتال اشتراک‌های بازی رمز عبور مدیران و امنیت دوره‌های آموزشی آنلاین خدمات تناسب اندام خرید برنامه‌های وفاداری سفر و تجارب اهدا به خیریه به نام آنها کارت‌های هدیه الکترونیکی ممکن است کارت‌های هدیه الکترونیکی را انتخاب کنند. می خواهید، و دریافت آن هرگز ناامیدکننده نیست (با فرض اینکه در مکانی باشد که شما دوست دارید). کارت‌های هدیه همه جا هستند—همچنین می‌توانید به فراتر از غول‌های خرده‌فروشی نگاه کنید"}, {"source": "Wired", "title": "Rural Data Centers Are in for a Big Federal Tax Break", "link": "https://www.wired.com/story/rural-data-centers-are-in-for-a-big-federal-tax-break/", "summary": "Under the One Big Beautiful Bill Act, data center projects in rural areas could be eligible for major tax benefits starting next year. Some hyperscalers do not seem eager to take the free cash.", "date_str": "2026-10-04T10:00:00+00:00", "hash": "70c4564595503706", "title_fa": "مراکز داده روستایی در آستانه یک معافیت مالیاتی بزرگ فدرال هستند", "summary_fa": "بر اساس قانون یک لایحه بزرگ زیبا، پروژه های مرکز داده در مناطق روستایی می توانند از سال آینده واجد شرایط دریافت مزایای مالیاتی عمده باشند. به نظر می رسد برخی از هایپراسکیلرها مشتاق دریافت پول نقد رایگان نیستند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان به Power Play خوش آمدید! هر هفته، مولی تافت، نویسنده ارشد، به موضوعی در مورد بزرگترین مشکل این فصل میان ترم می پردازد: مراکز داده. اگر سؤال یا فکری برای ستون دارید، می‌توانید به ایمیلی به مولی در [email protected] شلیک کنید یا به‌طور ایمن در Signal در mollytaft.76 به آنها برسید. در 1 ژانویه، یک مالیات بادآورده جدید آغاز می شود که می تواند به نفع بسیاری از پروژه های مرکز داده روستایی باشد - همه اینها به لطف قانون یک لایحه بزرگ زیبا است. از سال آینده، پروژه‌هایی که در بخش‌هایی از زمین‌های روستایی در سراسر کشور مستقر می‌شوند، به تازگی واجد شرایط برای مجموعه‌ای از مزایای مالیات شرکتی خاص تحت برنامه‌ای که توسط این لایحه توسعه یافته است، خواهند بود. در بیانیه‌ای که جیسون اسمیت، رئیس کمیته راه‌ها و ابزارها در سال گذشته منتشر کرد، گفت: قوانین جدید «ممکن است به طور قابل توجهی موانع را برای پروژه‌های مقیاس بزرگ و سرمایه‌بر در مناطق روستایی کاهش دهد، به ویژه مراکز داده فوق‌مقیاس». او ادامه داد: «مورد اقتصادی ساخت مراکز داده در مناطق فرصت روستایی تعیین‌شده با برنامه جدید بسیار قانع‌کننده‌تر می‌شود». اما کارشناسان هشدار می دهند که نتایج برای جوامع روستایی ممکن است متفاوت باشد. امیلی کراشل، تحلیلگر سیاست های مالیاتی در موسسه سرچ لایت، یک اندیشکده سیاست عمومی، می گوید: «در حال حاضر، تنها شرط لازم برای دریافت مزایا، سرمایه گذاری سرمایه است. \"با این حال، این تضمین نمی کند که آن پول لزوماً شغل ایجاد می کند یا یک رونق اقتصادی محلی ایجاد"}, {"source": "Wired", "title": "Keurig Alta First-Look: No More Plastic K-Cups", "link": "https://www.wired.com/story/keurig-alta-coffee-brewer/", "summary": "Keurig is ready to ditch the K-Cup with a compostable and plastic- and aluminum-free coffee pod, but the price is steep.", "date_str": "2026-10-04T09:30:00+00:00", "hash": "7f7e7f55238fb5cd", "title_fa": "نگاه اول Keurig Alta: دیگر از K-Cup های پلاستیکی خبری نیست", "summary_fa": "Keurig آماده است تا K-Cup را با یک غلاف قهوه کمپوست پذیر و بدون پلاستیک و آلومینیوم کنار بگذارد، اما قیمت آن بالاست. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان نظرات در مورد سیستم Keurig’s K-Cup به دو دسته تقسیم می شود: طرفدارانی که برای راحتی یک ضربه سریع جاوا ارزش قائل هستند و قهوه پسندهایی که آن را به عنوان آب طعم دار کنار می گذارند. جایی در وسط فرود می‌آیم: لوبیاهایم را آسیاب می‌کنم و آنها را از طریق یک فیلتر قابل استفاده مجدد دم می‌کنم، اما به دستگاه اجازه می‌دهم بقیه کار را انجام دهد. بنابراین، شاید من مشتری هستم که Keurig با سیستم جدید Alta خود در ذهن دارد. Alta اولین قهوه‌ساز تک‌نفره Keurig است که از غلاف‌های قهوه بدون پلاستیک و آلومینیوم استفاده می‌کند – سرانجام پس از سال‌ها توسعه راه‌اندازی شد. اگر آلتا شروع به کار کند، احتمالاً شاهد آغاز پایانی برای K-Cup یکبار مصرف خواهیم بود که در سال 1998 عرضه شد. هر نظر شما در مورد چگونگی ساخت فنجان عالی، برای نزدیک به 50 میلیون خانه در ایالات متحده (و بدون احتساب تعداد بیشتری در دفاتر)، Keurig قهوه است. تقریباً 30 سال است که آموزش دیده‌ایم تا قهوه‌ساز قطره‌ای قدیمی را برای غلاف‌های یک‌بار مصرف کنار بگذاریم. اما اکنون، کوریگ از ما می‌خواهد که (در نهایت) K-Cup را ترک کنیم و غلاف AltaRounds را در آغوش بگیریم، یک گرد قهوه فشرده و کمپوست‌پذیر که یکسان عمل می‌کند: آن را در دستگاه بیندازیم، یک یا دو دکمه را فشار دهیم و جو بیرون می‌آید. فیل دراپو، معاون ارشد شرکت Future Coffee Systems شرکت Keurig در طی ارائه‌ای در شهر نیویورک، گفت که مشتریان چیزی بیش از قهوه دم کرده می‌خواهند. آنها می‌خواستند نوشیدنی‌های اسپرسو فانتزی درست کنند، از کاپوچینوهای ساده گرفته تا معجون‌های کاراملی نمکی که در"}, {"source": "Wired", "title": "Elusive ‘Geoneutrinos’ Are Building a New Map of Earth’s Volatile Interior", "link": "https://www.wired.com/story/elusive-geoneutrinos-are-building-a-new-map-of-earths-volatile-interior/", "summary": "A global network of detectors are reporting some of the most substantial measurements yet of neutrinos created deep underground by the radioactive elements that power our planet’s tectonic activity.", "date_str": "2026-10-04T09:00:00+00:00", "hash": "c7bc4d56c6c78019", "title_fa": "«ژئونوترینوهای» گریزان در حال ساختن نقشه جدیدی از فضای داخلی فرار زمین هستند", "summary_fa": "یک شبکه جهانی از آشکارسازها برخی از اساسی‌ترین اندازه‌گیری‌ها را از نوترینوهای ایجاد شده در اعماق زمین توسط عناصر رادیواکتیو که به فعالیت‌های زمین ساختی سیاره ما نیرو می‌دهند، گزارش می‌کنند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان نسخه اصلی این داستان در مجله Quanta ظاهر شد. در آزمایشگاهی در 2 کیلومتری زیر زمین، جرثقیل، مت دپاتی، یک تکنسین آشکارساز را از طریق دریچه ای به داخل غاری با دیواره سفید پر از حدود 7000 تن آب فوق خالص که در نور به آبی مانند مایع برف پاک کن می درخشد، پایین می آورد. دیپاتی در حالی که وارد یک قایق بادی می شود که در زیر آن منتظر است، از طریق رادیو می گوید: «Splashdown». به طور معمول، غار یکی از تاریک ترین مکان های روی زمین است، اما امروزه برای تعمیر و نگهداری روشن شده است و فرصتی نادر برای دیدن داخل آن به ما می دهد. از دریچه به دپاتی نگاه می‌کنم، در حالی که او برای بررسی آزمایش غرق‌شده پارو می‌زند. او در حال بررسی یک آشکارساز به اندازه یک خانه است که برای شناسایی برخی از گریزان‌ترین ذرات شناخته‌شده در فیزیک ساخته شده است: نوترینوها. این آزمایش نوترینوی SNO+ است که در اعماق معدن کریتون در اسنولب، یک آزمایشگاه فیزیک زیرزمینی در سادبری، کانادا، دفن شده است. SNO+ شامل یک کره اکریلیک است که با نزدیک به 10000 آشکارساز نور حساس پوشانده شده است و با 780 تن سوسوزن مایع روغنی پر شده است که وقتی توسط ذرات پر انرژی روشن می شود چشمک می زند. آب اطراف دستگاه و صخره بالای آن آشکارساز را در برابر تابش تابش کیهانی محافظت می کند و به سوسوهای فعل و انفعالات ذرات کمتر متداول اجازه می دهد تا از طریق آن بدرخشد. کل سفر ما به پایین بخشی از جنگ صلیبی"}, {"source": "Wired", "title": "The Nvidia Shield TV Is 7 Years Old. It Just Got a $100 Price Hike", "link": "https://www.wired.com/story/7-year-old-tv-now-100-dollars-more-expensive-thank-ai/", "summary": "The price of anything with memory is skyrocketing thanks to AI. Aging streaming devices are no exception.", "date_str": "2026-10-03T18:00:00+00:00", "hash": "bcb1086b07f72212", "title_fa": "تلویزیون Nvidia Shield 7 ساله شد. فقط 100 دلار افزایش قیمت داشته است", "summary_fa": "قیمت هر چیزی که حافظه دارد به لطف هوش مصنوعی سر به فلک کشیده است. دستگاه های جریان قدیمی نیز از این قاعده مستثنی نیستند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان عصر هوش مصنوعی مولد زنجیره های تامین فناوری را تغییر داده است و یک قانون آهنین در سال 2026 وجود دارد: اگر حافظه یا ذخیره سازی داشته باشد، گران تر می شود. حتی دستگاه‌هایی که دارای فناوری قدیمی در داخل هستند، هنوز مشمول این قانون نانوشته هستند. انویدیا به تازگی اعلام کرده است که Shield TV Pro ۱۰۰ دلار گران‌تر می‌شود و بلافاصله اعمال می‌شود. جدیدترین نسخه از جعبه استریم Shield در سال 2019 عرضه شد که دارای Android TV با ارتقاء مقیاس هوش مصنوعی و رمزگشایی سخت افزاری برای تقریباً هر نوع رسانه ای است. در حالی که یک پردازنده قدیمی Tegra X1+ را اجرا می کرد، برای پخش کننده رسانه تلویزیونی سریع بود (و هنوز هم هست). این دستگاه با قیمت 199.99 دلار و نسخه غیر پرو با قیمت 149.99 دلار به بازار عرضه شد. Shield غیر Pro Shield از آن زمان متوقف شده است، اما Shield TV Pro با قیمت جدید 299.99 دلار باقی می ماند. انویدیا تایید کرده است که می‌توانید هوش مصنوعی را به خاطر قیمت بالاتر Shield TV سرزنش کنید. یک سخنگوی به Ars گفت: \"از 2 اکتبر، SHIELD Pro با قیمت 299 دلار خواهد بود. هزینه قطعات، از جمله حافظه، به طور قابل توجهی در سراسر صنعت افزایش یافته است.\" هنگامی که Ars Technica در اوایل سال جاری با اندرو بل از انویدیا صحبت کرد، او Shield را به عنوان یک پروژه پرشور در نظر گرفت، اما به نظر می‌رسد که پروژه‌های پرشور هنوز باید صورت‌حساب‌های Nvidia را بپردازند. در آن مصاحبه، بل توضیح داد که انویدیا همچنان به طور فعال شیلد را تولید می"}, {"source": "The Next Web", "title": "Zelensky asked Trump to block Russia’s Starlink rival, FT reports", "link": "https://thenextweb.com/news/zelensky-trump-sanctions-rassvet-starlink-rival", "summary": "Ukrainian President Volodymyr Zelensky has asked Donald Trump to sanction the Russian and Chinese companies building Russia’s answer to Starlink, the Financial Times reported. He has raised it with Trump several times, including at a recent meeting in New York. Ukrainian news agency UNN cited those details from the FT report. A network for the front line The [ ] This story continues at The Next Web", "date_str": "2026-10-03T19:23:52+00:00", "hash": "79e43d02a23789c2", "title_fa": "به گزارش اف تی، زلنسکی از ترامپ خواسته است تا جلوی رقیب روسیه استارلینک را بگیرد", "summary_fa": "فایننشال تایمز گزارش داد ولودیمیر زلنسکی، رئیس جمهور اوکراین از دونالد ترامپ خواسته است تا شرکت های روسی و چینی سازنده پاسخ روسیه به استارلینک را تحریم کند. او این موضوع را چندین بار از جمله در نشست اخیر در نیویورک با ترامپ مطرح کرده است. خبرگزاری اوکراینی UNN به این جزئیات از گزارش FT اشاره کرد. شبکه ای برای خط مقدم [ ] این داستان در The Next Web ادامه دارد این شبکه که Rassvet نام دارد توسط شرکت روسی Bureau 1440 ساخته می شود. زلنسکی گفت که می تواند تا اوایل سال آینده شروع به کار کند. او گفت: \"ما می دانیم که چین روی ماهواره ها کار می کند و روی امکان کمک به روسیه با Starlink مشابه کار می کند.\" اینترنت ماهواره ای در میدان نبرد در اوکراین حیاتی شده است. استارلینک نیروها و پهپادها را به هم متصل می‌کند و روسیه سعی کرده سیگنال‌هایش را مسدود کند. یک شبکه روسی خودش به نیروهای مسکو پیوندی می دهد که ایالات متحده و اسپیس ایکس نمی توانند آن را قطع کنند. Rassvet فاصله زیادی با Starlink دارد. TNW در ژوئن گزارش داد که Bureau 1440 اولین 16 ماهواره فعال خود را در ماه مارس به فضا پرتاب کرد و برای ارائه خدمات به بیش از 250 ماهواره  2024 رهبری کرد. این مجموعه بیش از 58000 ساعت ضبط دارد که قدمت آن به سال 1957 بازمی‌گردد. او شنیده است که استرالیایی‌های اولین ملل تاریخ عمیق را توصیف می‌کنند و اعضای نسل دزدیده شده شهادت داده‌اند. او همچنین شنیده است که یک پناهنده از ویتنام از طریق دریا فرار کرده است و یک پزشک داروین که از طوفان تریسی جان سالم به در برده است. او استدلال می کند که شنیدن افراد بر خلاف ما باعث ایجاد همدلی می شود. این همان چیزی است که او می ترسد گم شود. او نوشت: \"همدلی غنی ترین پیشنهاد شنیدن هدیه است. اگر کمتر صحبت کنیم و کمتر بشنویم، این بزرگترین ضرر ما خواهد بود.\" این نگرانی زمانی ایجاد می‌شود که سالانه افراد بیشتری به چت‌بات‌ها روی می‌آورند."}, {"source": "The Next Web", "title": "US charges California man with smuggling $300mn of AI servers to China", "link": "https://thenextweb.com/news/greg-lui-earthmade-ai-server-smuggling-china", "summary": "US authorities have arrested a California man accused of smuggling more than $300mn of computer servers packed with AI chips to China, the Justice Department said on Thursday. Greg Lui, 38, of San Gabriel, also known as Yiu Kong Lui, was arrested on Wednesday, prosecutors said. Reuters also reported the case, in a story carried by The [ ] This story continues at The Next Web", "date_str": "2026-10-03T19:04:51+00:00", "hash": "1aaa209678c8682d", "title_fa": "ایالات متحده مرد کالیفرنیایی را به قاچاق 300 میلیون دلار سرورهای هوش مصنوعی به چین متهم کرد", "summary_fa": "وزارت دادگستری روز پنجشنبه اعلام کرد که مقامات ایالات متحده یک مرد کالیفرنیایی را به اتهام قاچاق بیش از 300 میلیون دلار سرور رایانه ای مملو از تراشه های هوش مصنوعی به چین دستگیر کرده اند. به گفته دادستانی، گرگ لوی، 38 ساله، اهل سن گابریل، که با نام ییو کونگ لویی نیز شناخته می شود، روز چهارشنبه دستگیر شد. رویترز همچنین در گزارشی که توسط The [ ] منتشر شد، این پرونده را گزارش کرد. این داستان در The Next Web ادامه دارد. این طرح ادعایی از سال 2023 تا 2024 اجرا شد. ظاهراً سرورها ابتدا به مالزی و سنگاپور رفتند، جایی که هیچ مجوزی لازم نیست، قبل از ارسال به چین. دادستان ها می گویند که لو ate_str": "2026-10-04T13:43:08+00:00", "hash": "bbde3b977f9fec62", "title_fa": "امیر براتی، هکر ایرانی، به آمریکا مسترد شد", "summary_fa": "مظنون ایرانی پرونده‌ی نفوذ سایبری به دانشگاه‌ها و سرقت ۳٫۴ میلیارد دلار اطلاعات، از مونته‌نگرو به آمریکا مسترد شد. تبلیغات مقام‌های قضایی مونته‌نگرو یکی از متهمان اصلی پرونده‌ی نفوذ به بیش از ۱۵۰ دانشگاه و ده‌ها سازمان خصوصی را پس از ماه‌ها بازداشت، به ایالات متحده تحویل دادند . امیر براتی ، تبعه‌ی ۴۰ ساله‌ی ایرانی‌تبار با تابعیت دوگانه‌ی ترکیه‌ای، در برابر دادگاه منطقه‌ی جنوبی نیویورک با اتهامات سنگین کلاهبرداری الکترونیکی و جرایم رایانه‌ای روبه‌رو خواهد شد. به‌گزارش رسانه‌های بین‌المللی از جمله سی‌ان‌ان، پلیس مونته‌نگرو امیر براتی را چند ماه پیش در شهر پودگوریتسا و بر اساس درخواست رسمی پلیس فدرال آمریکا بازداشت کرده بود. کیفرخواست صادرشده علاوه بر براتی، ۱۶ فرد دیگر را نیز در بر می‌گیرد که ظاهرا همگی در کارزار گسترده‌ی نفوذ به اهداف علمی و اقتصادی متهم شناخته شده‌اند. کپی لینک ابعاد پرونده و گستره‌ی نفوذ به اهداف دانشگاهی بررسی اسناد دادگاه نشان می‌دهد که اقدامات این گروه از سال ۲۰۱۳ آغاز شده و در جریان آن بیش از ۸ هزار حساب ایمیل متعلق به استادان و پژوهشگران در آمریکا، اروپا و سایر نقاط جهان هدف دسترسی غیرمجاز قرار گرفته است. دانشگاه‌های آسیب‌دیده برای فراهم‌آوری و دسترسی به اطلاعات دانشگاهی و دارایی‌های فکری سرقت‌شده، عددی نزدیک به ۳٫۴ میلیارد دلار هزینه کرده بودند. بر اساس ادعای اسناد دادگاه، براتی در ساختار این گروه نقش ردیابی روند پیشرفت نفوذها و تهیه‌ی فهرست اهداف بخش خصوصی را ایفا می‌کرد. اهداف تجاری آسیب‌دیده از این کارزار نفوذ عبارت‌اند از: استرداد متهمان پرونده‌های سایبری فرامرزی رویدادی کم‌سابقه در رویه‌های قضایی ایالات متحده به شمار می‌رود. دادستان‌های فدرال مدعی شده‌اند که بخش عمده‌ی این نفوذها با هدایت و به نفع نهادهای امنیتی انجام گرفته است، هرچند وکلای متهم تا کنون اظهارنظری در این خصوص ارائه نکرده‌اند."}, {"source": "Zoomit", "title": "سخنگوی دولت: آیین‌نامه‌ حمایت از بازگشت نخبگان خارج از کشور تصویب شد", "link": "https://www.zoomit.ir/iran-news/468475-iran-support-returning-elites-incentives/", "summary": "هی 48-shinyhunters-hacker-arrested-fbi-data-leak/", "summary": "یکی از اعضای مظنون گروه هکری شاینی‌هانترز در اردن بازداشت شد و هم‌اکنون با پلیس فدرال آمریکا همکاری می‌کند.", "date_str": "2026-10-04T07:09:12+00:00", "hash": "d0143dcca8f2e5bd", "title_fa": "«شکارچی» شکار شد؛ بازداشت خبرساز یک هکر در اردن و همکاری با اف‌بی‌آی", "summary_fa": "یکی از اعضای مظنون گروه هکری شاینی‌هانترز در اردن بازداشت شد و هم‌اکنون با پلیس فدرال آمریکا همکاری می‌کند. تبلیغات مقام‌های امنیتی اردن یکی از اعضای مظنون گروه هکری ShinyHunters معروف به «شکارچی‌های درخشان» را بازداشت کرده‌اند. فرد مذکور که با نام سیف‌الدین خضر (با نام مستعار Rey) شناخته می‌شود، طبق اعلام منابع مطلع، در حال حاضر با پلیس فدرال آمریکا برای شناسایی سایر اعضای گروه همکاری می‌کند. به گزارش رویترز ، گروه شاینی‌هانترز پیش‌تر مدعی شده بود اطلاعات تمامی کارکنان اف‌بی‌آی را به سرقت برده است. بررسی نمونه داده‌های افشا شده نشان می‌دهد این اطلاعات شامل مشخصات هویتی گسترده، سوابق شغلی حساس و جزئیات پزشکی و روان‌پزشکی کارمندان اف‌بی‌آی است. یکی از منابع آگاه درباره‌ی اهمیت همکاری این فرد با مجریان قانون گفت: «همکاری او برای تلاش‌های مداوم به‌منظور دستگیری این هکرها حیاتی است.» اف‌بی‌آی اگرچه از اظهارنظر مستقیم درباره‌ی بازداشت‌های خارج از کشور خودداری کرد، اما در بیانیه‌ای رسمی گفت: «دفتر تحقیقات فدرال به تحقیقات همه‌جانبه درباره‌ی حادثه‌ی سایبری اخیر مربوط به شاینی‌هانترز ادامه می‌دهد، تاکنون با همکاری شرکای خود چندین متهم را دستگیر کرده است و از هیچ منبعی برای سپردن تک‌تک افراد مسئول به دست عدالت دریغ نخواهد کرد.» کاش پاتل ، رئیس اف‌بی‌آی، با اشاره به بازداشت قبلی پپین فان در استپ در هلند، در پلتفرم X گفت: «تیم‌های اف‌بی‌آی همین حالا در حال بررسی سرنخ‌های جدید هستند. بازداشت‌های بیشتری روی میز است.» گروه شاینی‌هانترز سابقه‌ای طولانی در باج‌گیری سایبری از شرکت‌های بزرگ جهان دارد و نفوذ به استودیوی بازی‌سازی راک‌استار گیمز را در کارنامه‌ی خود ثبت کرده است. وب‌سایت دارک‌وب این گروه پس از ناپدیدشدن اخیر از دسترس خارج شده و گردانندگان آن اعلام کرده‌اند تمایلی به تشدید تنش با اف‌بی‌آی ندارند."}, {"source": "Zoomit", "title": "اعضای هی 00", "hash": "77443cc2b72e99d6", "title_fa": "«ترازوی داریک» منتشر شد؛ ۱۹۸ کیلوگرم طلای کاربران در داریک، ۲۰۰ کیلوگرم در انبار", "summary_fa": "بر اساس گزارش ترازوی داریک، این پلتفرم در برابر ۱۹۸ کیلوگرم دارایی ثبت‌شده کاربران، ۲۰۰ کیلوگرم طلای فیزیکی در انبار نگهداری می‌کند. تبلیغات داریک، انبار هوشمند فلزات گران‌بها، از ۸ مهر ۱۴۰۵ هر روز دو عدد را به‌صورت عمومی منتشر می‌کند: مجموع طلایی که کاربران در داریک دارند و مجموع طلای فیزیکی معادلی که در انبار هوشمند نگهداری می‌شود. بر اساس گزارش امروز، کاربران داریک در مجموع ۱۹۸ کیلوگرم طلا دارند و موجودی طلای فیزیکی انبار هوشمند ۲۰۰ کیلوگرم است. مهم‌ترین پرسش درباره‌ی هر سرویس طلای دیجیتال این است که طلایی که کاربر در اپلیکیشن می‌بیند، واقعاً در جایی نگهداری می‌شود یا نه. داریک به‌جای پاسخ با شعار، پاسخ را با عدد می‌دهد و هر روز آن را بروزرسانی می‌کند. گزارش در قالب تصویری ساده و با نام «ترازوی داریک» منتشر می‌شود: در یک کفه‌ی ترازو طلای کاربران و در کفه‌ی دیگر طلای انبار هوشمند قرار دارد. دیدن گزارش نیازی به حساب کاربری ندارد و در اپلیکیشن و شبکه‌های اجتماعی داریک در دسترس است. در ترازوی امروز، موجودی انبار ۲ کیلوگرم بیشتر از مجموع طلای کاربران است. این اختلاف ذخیره‌ی اضافه‌ای است که داریک عمداً بالاتر از تعهدات خود نگه می‌دارد؛ یعنی طلای فیزیکی انبار حدود ۱۰۱ درصد طلای کاربران را پوشش می‌دهد. طوفان قربان‌زاد مدیر روابط عمومی داریک در این باره می‌گوید: « شفافیت زمانی معنا پیدا می‌کند که اطلاعات مهم، قابل مشاهده و قابل پیگیری در اختیار مخاطب قرار بگیرد. با انتشار روزانه «ترازوی داریک»، تلاش کرده‌ایم یکی از مهم‌ترین پرسش‌های کاربران درباره طلای دیجیتال را با عدد پاسخ دهیم: میزان طلای کاربران چقدر است و چه میزان طلای فیزیکی در انبار نگهداری می‌شود.» لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری فاطمه محمدی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "جریمه ۴۰ میلیارد دلاری متا؛ نبرد حقوقی ایالت نیومکزیکو علیه مالک اینستاگرام", "link": "https://www.zoomit.ir/business/468334-meta-faces-40-billion-penalty/", "summary": "ایالت نیومکزیک وبی نیویورک نیز خدمت کرد. سنا در تابستان امسال صلاحیت او را برای هدایت جامعه‌ی اطلاعاتی تأیید کرد و پیش‌بینی می‌شود هم‌زمان با مسئولیت جدید، سمت فعلی خود را حفظ کند. جی کلیتون می‌گوید: «هوش مصنوعی بازی را تغییر می‌دهد و نه‌تنها یک فرصت، بلکه یک تهدید محسوب می‌شود.» پیش‌تر، دیوید ساکس دوره‌ی ۱۳۰ روزه‌ی فعالیت خود را به‌عنوان مسئول حوزه‌ی رمزارز و هوش مصنوعی به پایان رساند و طبق قوانین ایالات متحده، کارمندان ویژه‌ی دولتی در یک بازه‌ی ۱۲ ماهه به همین مدت محدود هستند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "شرکت دولتی چین از دورزدن تحریم‌ها و خرید تراشه‌های پیشرفته انویدیا خبر داد", "link": "https://www.zoomit.ir/ai-articles/468333-china-funds-nvidia-blackwell-chips/", "summary": "اسناد نظارتی نشان می‌دهند یک نهاد مالی دولتی در چین، بودجه لازم برای خرید سرورهای مجهز به تراشه‌های تحریم‌شده انویدیا را تامین کرده است.", "date_str": "2026-10-03T15:15:00+00:00", "hash": "d8c478965e1763a3", "title_fa": "شرکت دولتی چین از دورزدن تحریم‌ها و خرید تراشه‌های پیشرفته انویدیا خبر داد", "summary_fa": "اسناد نظارتی نشان می‌دهند یک نهاد مالی دولتی در چین، بودجه لازم برای خرید سرورهای مجهز به تراشه‌های تحریم‌شده انویدیا را تامین کرده است. تبلیغات اسناد ارائه‌شده به نهادهای نظارتی پکن نشان می‌دهند یک شرکت تامین مالی چینی متعلق به چندین نهاد دولتی محلی، بودجه‌ی خرید تراشه‌های هوش مصنوعی تحریم‌شده‌ی انویدیا را تامین کرده است؛ یافته‌هایی که فرضیه‌ی حمایت مستقیم دولت چین از تجارت غیرقانونی نیمه‌هادی‌ها برای پیشبرد پروژه‌های هوش مصنوعی را تقویت می‌کند. به گزارش بلومبرگ ، شرکت Semi-Tech Leasing Group طی یک سال گذشته سرمایه‌ی لازم برای خرید بیش از ۷۰۰ سرور را در اختیار شرکتی به نام Glory View Technology قرار داده است. یکی از قراردادها به‌طور مشخص نشان می‌دهد بودجه‌ی خرید ۳۲ دستگاه سرور ایسوس مجهز به تراشه‌های B300 انویدیا از یک فروشنده‌ی چینی تامین شده است. تراشه‌ی B300 بخشی از معماری قدرتمند Blackwell محسوب می‌شود که فروشش به چین بدون مجوز رسمی وزارت بازرگانی آمریکا ممنوع است. گفته می‌شود دلالان بازار سیاه با سوءاستفاده از ضعف نظارت‌ها، میلیاردها دلار سخت‌افزار پیشرفته را به چین قاچاق کرده‌اند و نهادهای دولتی این کشور نیز تسهیلات مالی این تبادلات را فراهم می‌کنند. سخنگوی انویدیا درباره‌ی این گزارش گفت: «در حال بررسی این گزارش هستیم و با شرکای تولیدکننده‌ی تجهیزات اصلی (OEM) خود برای پیگیری موضوع همکاری خواهیم کرد.» ایسوس نیز در بیانیه‌ای رسمی اعلام کرد: «این شرکت به رعایت دقیق تمامی قوانین و مقررات قابل اجرا، از جمله کنترل‌های صادراتی، متعهد است.» بررسی جزئیات نشان می‌دهد بیش از ۳ میلیارد یوان تسهیلات برای تحویل این سرورها اختصاص یافته و بخش عمده‌ی سخت‌افزارها، از جمله ۳۲ سرور مجهز به تراشه‌های سری بلک‌ول، در دیتاسنتر چاینا موبایل واقع در شهر جونگ‌وی نصب شده‌اند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟"}, {"source": "Business Insider", "title": "My husband and I finally took a trip without our 5 kids. It didn't go at all how we expected.", "link": "https://www.businessinsider.com/took-trip-without-kids-didnt-go-how-expected-2026-10", "summary": "Our adults-only trip away from our kids didn t go the way I expected it to, but I m still glad we gave it a try. Alexandra Frost My husband and I wanted to take a trip away from our five kids, so we planned a 4-day beach getaway . I didn't relax much, and it felt impossible to disconnect even though the kids had a trusted sitter. I missed my kids more than I expected, but I enjoyed being able to talk to my husband uninterrupted. My husband and I both work and parent our five kids, and some days the rat wheel of events and responsibilities feels endless. So, during a particularly tough season, we started scheming about whether it would actually be possible to \"get away.\" First, we tried to plan a little weekend cabin retreat nearby, but I knew I'd just come right back if something went wrong, and it didn't feel like a real getaway without sand and water. How hard could it be, really, to hand off our day-to-day responsibilities to a fully qualified adult babysitter who is also a local teacher in our area? Once we planned to travel further, we started a spreadsheet to help us map out a few logistics. Four pages later, we were able to see the load we'd been carrying and how complex it would be to transfer it over. Yet, we did it. We headed to Florida from Ohio for a four-day beach getaway, hoping for the best. It didn't go as planned. Trying to relax was challenging even before all the messages began Let s just say toes in the water doesn t cure it all. Alexandra Frost I'm not someone who typically has a tough time being away from my kids. I don't struggle when we're separated at day-care drop-off , on date night, or during their occasional overnight stay at grandma's. However, as our plane landed several states away, anxiety started to build around how complicated it would be to get back in an emergency, and whether the sitter would really be able to handle five kids. It took a good 24 hours to calm down about it, which unfortunately was 25% of the vacation. I did notice that it was nice to be able to think about my own needs first for a bit. What did I want for dinner? What would be fun for us to do? These mini luxuries helped me start to understand why rediscovering yourself on getaways is necessary. But when you run your own seven-person three-ring circus, you can't really just turn off your phone, or it might all come crashing down. So I left it on, and couldn't really disconnect. The messages and notifications wouldn't stop. It started with a forgotten u", "date_str": "2026-10-04T12:44:01+00:00", "hash": "f3a33aed00621289", "title_fa": "من و شوهرم در نهایت بدون 5 فرزندمان به سفر رفتیم. اصلاً آنطور که انتظار داشتیم پیش نرفت.", "summary_fa": "سفر ما که فقط برای بزرگسالان دور از بچه هایمان بود، آنطور که انتظار داشتم پیش نرفت، اما هنوز خوشحالم که آن را امتحان کردیم. الکساندرا فراست من و شوهرم می‌خواستیم به دور از پنج فرزندمان سفری داشته باشیم، بنابراین یک استراحت 4 روزه در ساحل برنامه ریزی کردیم. من زیاد آرام نگرفتم و حتی با وجود اینکه بچه ها یک پرستار مورد اعتماد داشتند، قطع ارتباط غیرممکن به نظر می رسید. دلم برای بچه هایم بیشتر از آنچه انتظار داشتم تنگ شده بود، اما از اینکه می توانستم بدون وقفه با شوهرم صحبت کنم لذت می بردم. من و شوهرم هر دو کار می کنیم و پدر و مادر پنج فرزندمان هستیم، و بعضی روزها چرخ موش رویدادها و مسئولیت ها بی پایان است. بنابراین، در طول یک فصل به خصوص سخت، ما شروع کردیم به طرح ریزی در مورد اینکه آیا واقعاً امکان \"فرار کردن\" وجود دارد یا خیر. اول، ما سعی کردیم برای استراحت آخر هفته در نزدیکی کابین برنامه ریزی کنیم، اما می دانستم که اگر مشکلی پیش بیاید، بلافاصله برمی گردم، و بدون شن و آب احساس یک فرار واقعی نمی کردم. واقعاً چقدر سخت است که مسئولیت های روزانه خود را به یک پرستار بچه بزرگسال کاملاً واجد شرایط که معلم محلی منطقه ما نیز هست بسپاریم؟ هنگامی که قصد داشتیم بیشتر سفر کنیم، یک صفحه گسترده راه اندازی کردیم تا به ما کمک کند چند تدارکات را ترسیم کنیم. چهار صفحه بعد، توانستیم باری را که حمل می‌کردیم و اینکه انتقال آن روی آن پیچیده است، ببینیم. با این حال، ما آن را انجام دادیم. از اوهایو برای یک استراحت چهار روزه در ساحل به سمت فلوریدا حرکت کردیم، به امید بهترین ها. طبق برنامه پیش نرفت. تلاش برای استراحت حتی قبل از شروع همه پیام ها چالش برانگیز بود. بگذارید فقط بگوییم"}, {"source": "Business Insider", "title": "I replaced Spotify with CDs for my 8-year-old. It's one parenting decision I haven't regretted.", "link": "https://www.businessinsider.com/kid-listens-cds-instead-streaming-spotify-algorithm-2026-10", "summary": "The author introduced the kids to CDs. Courtesy of the author I wanted my 8-year-old to have the freedom to discover music on her own. Spotify exposed her to distracting videos, AI songs, and inappropriate images. I switched her to CDs, where she can choose freely from music I've approved. Lately, I have been filling our home with piles and piles of CDs. I'm not alone: physical media (primarily vinyl, but also CDs) have been on an upward sales trend for the past five years. But unlike vinyl collectors or tastemakers looking for rare albums, I am listening to CDs as a parenting move because of my 8-year-old daughter. I didn't want her to listen to AI slop As she grew out of the \" Baby Shark \" music of her toddlerhood and into appreciating rock, pop, hip-hop, and folk, I wanted her to have the opportunity to explore on her own and the freedom to choose what she liked. But when I put Spotify in my daughter's hands, she would scroll, listen for a few seconds, then scroll again. She would become mesmerized by the short videos that play with the music. She would try searching for \"narwhal\" or \"axolotl\" and find AI slop songs . The final straw came when dozens of playlists popped up in the search results with NC-17-looking playlist cover art. I looked down at my phone screen filled with anime seductresses, and I was done forever with trying to let my child navigate Spotify on her own. I gave my child a pile of CDs An experiment ensued: a CD player and a pile of CDs. My CD player in 2026 is handsome, wooden, and Bluetooth-enabled. She can pick anything. If streaming were a sprawling trash pile filled with needles, CDs are a playground with a beautiful fence. If streaming were an art museum with AI-generated animations suddenly flashing in front of the Mona Lisa, CDs are a quiet gallery with perfect light. The author didn t want her 8-year-old listening to AI slop. Courtesy of the author Streaming wasn't just harmful for my kid; it was harmful for me. I had grown increasingly dissatisfied as my personalized playlists served me more and more familiar tracks, sending me into the same well-worn rivulets of songs that are inoffensive and foolproof for me. When I put on a CD, it is easier for me to surrender to letting it play from front to back. When I want to look up a lyric, I pull out the liner notes. There is no risk of my seeing a notification. The cover art might be faded and stiff, but it is not going to pivot to video. CDs are part of my war for presence, a sma", "date_str": "2026-10-04T11:33:01+00:00", "hash": "3eb669d69093692c", "title_fa": "من Spotify را با سی دی برای کودک 8 ساله خود جایگزین کردم. این یکی از تصمیمات والدینی است که از آن پشیمان نشده ام.", "summary_fa": "نویسنده سی دی ها را به بچه ها معرفی کرد. با حسن نیت از نویسنده، من می خواستم کودک 8 ساله ام آزادی کشف موسیقی را به تنهایی داشته باشد. Spotify او را در معرض ویدیوهای حواس پرت کننده، آهنگ های هوش مصنوعی و تصاویر نامناسب قرار داد. من او را به سی دی تغییر دادم، جایی که او می تواند آزادانه از بین موسیقی هایی که من تایید کرده ام انتخاب کند. اخیراً خانه مان را پر از انبوه سی دی ها کرده ام. من تنها نیستم: رسانه های فیزیکی (عمدتاً وینیل، بلکه سی دی ها) در پنج سال گذشته روند فروش صعودی داشته اند. اما برخلاف کلکسیونرهای وینیل یا مزه سازانی که به دنبال آلبوم های کمیاب هستند، من به خاطر دختر 8 ساله ام به عنوان یک حرکت والدین به سی دی گوش می دهم. من نمی خواستم او به آهنگ هوش مصنوعی گوش کند همانطور که او از موسیقی \"Baby Shark\" دوران کودکی خود بیرون آمد و به راک، پاپ، هیپ هاپ و فولک قدردانی کرد، می خواستم او این فرصت را داشته باشد که به تنهایی کاوش کند و آزادی انتخاب آنچه را که دوست دارد داشته باشد. اما وقتی اسپاتیفای را در دستان دخترم قرار دادم، او اسکرول می‌کرد، چند ثانیه گوش می‌داد و دوباره اسکرول می‌کرد. او با ویدیوهای کوتاهی که با موسیقی پخش می شود، مسحور می شد. او سعی می‌کرد به دنبال «narwhal» یا «axolotl» باشد و آهنگ‌های شیب‌دار هوش مصنوعی را پیدا کند. نقطه پایانی زمانی به وجود آمد که ده ها لیست پخش با روی جلد لیست پخش با ظاهر NC-17 در نتایج جستجو ظاهر شد. به صفحه تلفنم که پر از اغواگران انیمه بود نگاه کردم و برای همیشه از تلاش برای اجازه دادن به فرزندم در Spotify به تنهایی به پایان رسید. من به فرزندم یک انبوه"}, {"source": "Business Insider", "title": "I'm a matchmaker who works with older adults. People in their 70s are looking for someone to share a life with, not build one.", "link": "https://www.businessinsider.com/matchmaker-older-clients-dating-later-in-life-2026-10", "summary": "Brigitte Weil is a matchmaker who works with older clients. Photo Credit: Andrew French Brigitte Weil is a matchmaker based in Manhattan, working with the 50+ crowd. She says superficial details like looks and finances become less important with age. Widowed clients focus on what they want, while divorced clients focus on what they don't want. This as-told-to essay is based on a conversation with Brigitte Weil . It has been edited for length and clarity . My parents have been married for 62 years, and my grandparents were married for 76. I've always been surrounded by longevity in relationships , and it's something that captivates me. Becoming a matchmaker who works with older adults was a natural fit. Dating in your 70s or older is radically different from dating in your 30s or even 50s. Younger people are looking for someone to build a life with, but older people are seeking someone who can share a life that's already been created. Lifestyle compatibility becomes critical with age When I match older clients, I need to know that their lifestyles will mesh well. We're talking less about chemistry, or someone who checks all the boxes, and more about how their lifestyles can be shared. Older clients care less about a man's height or a woman's appearance in a bikini. Even finances play a smaller role. Instead, geography becomes a big issue: many people don't want to move and give up their community and family connections. To find long-term love , clients must share values on topics such as grandchildren and travel. People know their nonnegotiables Finding lifestyle compatibility can be a challenge. People become wiser with age, and they know themselves. They know what they're willing to compromise on, and what they're not. Take my client Sol , who at 96 is by far the oldest person I've worked with. Sol wants a woman to wake up next to every morning. He's not alone — most of my clients want cohabitation, even as marriage becomes less important to many of them. Sol's been on some great dates, but many of the women his age aren't interested in moving house. They already have their routines. She says her older clients know what they want in a partner. Photo Credit: Andrew French My clients are building on their experience with love Rarely do I work with someone who's never been married before; Most of my clients are divorced or widowed. Widowed clients usually start by telling me exactly what they want in a relationship. They've experienced a loving partner, and ", "date_str": "2026-10-04T11:13:01+00:00", "hash": "52ad5014d69fc91b", "title_fa": "من یک خواستگاری هستم که با افراد مسن کار می کنم. افراد 70 ساله به دنبال کسی هستند که با او زندگی مشترکی داشته باشند، نه اینکه بسازند.", "summary_fa": "بریژیت ویل خواستگاری است که با مشتریان مسن تر کار می کند. اعتبار عکس: اندرو فرنچ بریژیت ویل یک خواستگار مستقر در منهتن است که با جمعیت بالای 50 نفر کار می کند. او می گوید جزئیات سطحی مانند ظاهر و امور مالی با افزایش سن اهمیت کمتری پیدا می کنند. مشتریان بیوه بر آنچه می خواهند تمرکز می کنند، در حالی که مشتریان مطلقه بر آنچه نمی خواهند تمرکز می کنند. این مقاله گفته شده بر اساس گفتگو با بریژیت ویل است. برای طول و وضوح ویرایش شده است. پدر و مادر من 62 سال است که ازدواج کرده اند و پدربزرگ و مادربزرگم 76 سال ازدواج کرده اند. تبدیل شدن به یک خواستگاری که با افراد مسن کار می کند یک تناسب طبیعی بود. قرار ملاقات در دهه 70 یا بالاتر با قرار ملاقات در دهه 30 یا حتی 50 سالگی شما کاملاً متفاوت است. افراد جوانتر به دنبال کسی هستند که با او زندگی بسازند، اما افراد مسن به دنبال کسی هستند که بتواند زندگی ای را که از قبل ایجاد شده به اشتراک بگذارد. سازگاری سبک زندگی با افزایش سن بسیار مهم می‌شود. ما کمتر در مورد شیمی صحبت می کنیم، یا کسی که همه جعبه ها را بررسی می کند، و بیشتر در مورد اینکه چگونه می توان سبک زندگی آنها را به اشتراک گذاشت. مشتریان مسن کمتر به قد یک مرد یا ظاهر یک زن با بیکینی اهمیت می دهند. حتی امور مالی نیز نقش کمتری دارد. در عوض، جغرافیا به یک مسئله بزرگ تبدیل می‌شود: بسیاری از مردم نمی‌خواهند جابه‌جا شوند و از ارتباطات اجتماعی و خانوادگی خود دست بکشند. برای یافتن عشق بلندمدت، مشتریان باید ارزش های خود را در مورد موضوعاتی مانند نوه ها و سفر به اشتراک بگذارند. مردم چیزهای غیر قابل مذاکره خود را می دانند یافتن سازگاری با"}, {"source": "Business Insider", "title": "Approach shoes are the new fall sneaker trend you'll be seeing everywhere", "link": "https://www.businessinsider.com/guides/style/approach-shoes-climbing-sneaker-trend-how-to-get-the-look", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Tara Larson/Business Insider In the past, mountaineers wore approach shoes to walk the trails leading up to their actual climb (the \"approach\" refers to the route between the start of the hike and the base of a cliff). Nowadays, it feels like I can't throw a rock without hitting someone dripped out in these Gore-Tex sneakers. The New York Times calls them \" a shoe that looks great on everyone .\" It's true there's been an uptick of this outdoorsy style all over, from around my local coffee shop to the ad campaigns of luxury fashion houses like Proenza Schouler and Loewe. While true hiking boots are too clunky for long distances, an understated, low-profile approach shoe is much easier to slip on and walk in. We've tested the trendy Salomons , but here I've rounded up comfortable alternatives with a similar gorpy flair. These pairs can be styled with your favorite barrel jeans, cargo pants, or even a maxi skirt this fall. Keen Jasper Tara Larson/Business Insider Why we love them: These have a wide toe box and a molded cork footbed similar to Birkenstocks. Skip if: You prefer foam cushioning and meaningful arch support. Keen's Jasper line has been around since 2008, but thanks to the gorpcore trend, the shoe has made its way onto urban landscapes (Harry Styles and Zoe Kravitz were each seen wearing them). I wish I had tried them a little earlier — scrambling up a rock crevice in Sedona's Cathedral Rock hike a few months ago might have gone better with these in my rotation. When I first slipped them on, I noticed their rugged, yet soft suede uppers. I was concerned they would be too stiff for walking, but once they were on I found them comfortable. As for their technical qualities, the chunky soles are made of thick rubber material and use tread patterns inspired by tire tracks, giving it a little extra grip. The footbed is made up of cork and Latex footbed cushions, which is designed to mold to your foot, similar to Birkenstocks. These are a good fit if you like a wide toe box. Style-wise, the shoes are a happy medium between an walking shoe and an approach shoe. The Jasper is available in several colorways, from bright to neutral. They add a little spice to my typical bodega run or thrift shopping outings without going too far out of my comfort zone. Sorel Callsign Horizon Low GTX Gabrielle Chase/Business Insider Why we love them: They're fully waterproof with refle", "date_str": "2026-10-04T11:00:01+00:00", "hash": "5a6af1237e2e33fa", "title_fa": "کفش های Approach ترند جدید کفش های کتانی پاییزی هستند که در همه جا خواهید دید", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید تارا لارسون/Business Insider در گذشته، کوهنوردان برای پیاده روی در مسیرهای منتهی به صعود واقعی خود کفش های نزدیک می پوشیدند («رویکرد» به مسیر بین شروع پیاده روی و پایه یک صخره اشاره دارد). این روزها احساس می‌کنم که نمی‌توانم سنگی را بدون برخورد با کسی که در این کفش‌های ورزشی گورتکس چکه کرده است پرتاب کنم. نیویورک تایمز آنها را \"کفشی که برای همه عالی به نظر می رسد\" می نامد. درست است که این سبک فضای باز در همه جا افزایش یافته است، از اطراف کافی شاپ محلی من گرفته تا کمپین های تبلیغاتی خانه های مد لوکس مانند Proenza Schouler و Loewe. در حالی که کفش‌های پیاده‌روی واقعی برای مسافت‌های طولانی بیش از حد ضخیم هستند، کفش‌های ساده و کم‌حجم به راحتی می‌توان آن‌ها را به پا کرد و در آن راه رفت. ما سالومون‌های مد روز را آزمایش کرده‌ایم، اما در اینجا من جایگزین‌های راحت را با ویژگی‌های مشابهی گردآوری کرده‌ام. این جفت ها را می توان با شلوار جین بشکه ای مورد علاقه شما، شلوار باربری یا حتی دامن ماکسی در پاییز امسال استایل کرد. کین جاسپر تارا لارسون/ بیزینس اینسایدر چرا ما آنها را دوست داریم: اینها دارای یک جعبه پنجه پهن و یک پایه چوب پنبه ای شبیه به Birkenstocks هستند. از این موارد بگذرید: بالشتک فوم و حمایت قوس معنی دار را ترجیح می دهید. خط جاسپر Keen از سال 2008 وجود داشته است، اما به لطف روند gorpcore، این کفش به مناظر شهری راه پیدا کرده است (هری استایلز و زوئی کراویتز هر کدام با پوشیدن آنها دیده شدند). ای کاش کمی زودتر آنها را امتحان کرده بودم - چند ماه پیش در پیاده‌روی صخره‌های کلیسای جامع سدونا از شکاف صخره‌ای بالا"}, {"source": "Business Insider", "title": "My 16-year-old still has a 9 p.m. bedtime. It's great for our whole family.", "link": "https://www.businessinsider.com/teen-still-has-bedtime-sleep-priority-2026-10", "summary": "The author said her teen goes to bed at 9 p.m. almost every night. DMP/Getty Images A 9 p.m. bedtime ensures my 16-year-old daughter gets enough sleep for school success. Our bedtime routine encourages open communication and connection with my daughter. Maintaining a consistent bedtime is crucial for my daughter's health and daily routine. As my daughter prepared to go back to school this year, there was the usual business of buying school supplies, wondering about her new Biology teacher, and thinking about her birthday, which falls a few weeks after school starts. One thing we didn't have to worry about was getting back into a good sleep routine , because she still has a bedtime. Even in the summer . Even on weekends. Which might not sound that unusual, except she's 16 years old, and I expect her to be in bed by 9. The author said her daughter thrives on routines, so sticking to a bedtime still makes sense for her family. Courtesy of Sarah E. White. We still talk at bedtime We didn't plan to keep bedtime going this long; it just happened that we kept telling her it was bedtime, and she kept listening. I know there are kids who would protest this, and family lifestyles that would not support it, but it works for us, and I'm grateful for that. With the start of 11 th grade, we've pushed bedtime to 9 p.m. Devices go away, we say goodnight, and I sit with her for a few minutes (sometimes more than a few) to give her time to talk about whatever she wants to talk about. Do you have a hot take on a common parenting belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. Sometimes the bedtime chatter is about the video game she's playing or that video she watched about the history of Lunchables. But sometimes it's real talk , about homework or life worries. I know it makes me feel more connected to her, and I hope she feels the same way. We have a routine My daughter thrives on routine, not just at bedtime but throughout the day. When we've talked about potentially stopping the bedtime ritual, she says she could go to sleep without it, but she likes it for now. Bedtime itself isn't going anywhere. According to the Centers for Disease Control and Prevention, teens need 8 to 10 hours of sleep , and in a national sample, nearly 73 percent didn't get enough on school nights. High school is also the time when homework, extracurriculars, work, and other things might be keeping kids up later, even if they want to ", "date_str": "2026-10-04T10:54:01+00:00", "hash": "403a3be1a126ea48", "title_fa": "پسر 16 ساله من هنوز ساعت 9 شب دارد. زمان خواب برای کل خانواده ما عالی است.", "summary_fa": "نویسنده گفت که نوجوانش ساعت 9 شب به رختخواب می رود. تقریبا هر شب DMP/Getty Images A ساعت 9 شب. زمان خواب تضمین می کند که دختر 16 ساله من به اندازه کافی برای موفقیت در مدرسه بخوابد. روال قبل از خواب ما ارتباط آزاد و ارتباط با دخترم را تشویق می کند. حفظ یک ساعت خواب ثابت برای سلامتی و برنامه روزانه دخترم بسیار مهم است. وقتی دخترم امسال برای بازگشت به مدرسه آماده می‌شد، کار معمولی خرید لوازم مدرسه، تعجب در مورد معلم زیست‌شناسی جدیدش و فکر کردن به تولدش بود، که چند هفته پس از شروع مدرسه است. یکی از چیزهایی که ما نگران آن نبودیم این بود که به یک روال خواب خوب برگردیم، زیرا او هنوز زمان خواب دارد. حتی در تابستان. حتی آخر هفته ها. که ممکن است چندان غیرعادی به نظر نرسد، به جز اینکه او 16 ساله است و من انتظار دارم تا ساعت 9 در رختخواب باشد. نویسنده گفت که دخترش در روال‌های معمول رشد می‌کند، بنابراین پایبندی به زمان خواب هنوز برای خانواده‌اش منطقی است. با حسن نیت از سارا ای وایت. ما هنوز موقع خواب صحبت می‌کنیم. برنامه‌ای نداشتیم که زمان خواب را تا این حد ادامه دهیم. این اتفاق افتاد که ما مدام به او می گفتیم که وقت خواب است و او به گوش دادن ادامه داد. می‌دانم که بچه‌هایی هستند که به این موضوع اعتراض می‌کنند، و سبک زندگی خانوادگی که از آن حمایت نمی‌کند، اما برای ما کار می‌کند، و من از این بابت سپاسگزارم. با شروع کلاس یازدهم، زمان خواب را به ساعت 9 شب رساندیم. وسایل کنار می‌روند، شب بخیر می‌گوییم و من چند دقیقه (گاهی بیش از چند دقیقه) با او می‌نشینم تا به او فرصت بدهم تا درباره هر چیزی که می‌خواهد صحبت کند، صحبت کند. آیا در مورد یک باور"}, {"source": "Business Insider", "title": "Amazon exec says finding FDE talent is very challenging: ‘These are unicorns’", "link": "https://www.businessinsider.com/amazon-aws-fde-plans-hiring-2026-10", "summary": "Amazon Web Services vice president for forward-deployed engineering, Asa Kalavade, said the company is looking for a specific skill set. Amazon Amazon Web Services has made a $1 billion bet on FDEs. Finding the right workers isn't easy, an Amazon exec told Business Insider. \"These are unicorns,\" the exec said. Forward-deployed engineers are one of the hottest jobs in AI. Finding them isn't easy. \"These are unicorns,\" Asa Kalavade, vice president of forward-deployed engineering at Amazon Web Services , told Business Insider. Like its rivals, Amazon has made a big bet on the future of FDEs. In June, AWS announced a $1 billion investment to create a dedicated AWS FDE organization. Popularized by Palantir, FDEs are often embedded with companies to integrate AI into their workflows and to build more customized solutions. Anthropic, OpenAI, and Microsoft have announced major initiatives in recent months to compete for the lucrative enterprise AI business. Forrester estimates that between May and July alone, the three companies and Amazon pledged roughly $9 billion to FDE-related ventures. \"FDE hiring is sort of the rage in town these days,\" Kalavade said. \"Everybody wants to be an FDE.\" Amazon is being selective as it builds the team, Kalavade said, initially focusing on engineers who can hit the ground running. \"Our initial seed is what I call the insurgents, the frontier engineers who've been there, done this before,\" she said. Kalavade said it's \"a really hard role,\" and that those best positioned to succeed have a startup mindset. She said Amazon is essentially looking for three things: a product customer mindset, deep software expertise, and agentic experience. \"Different people will have different strengths, but at the end of the day, that's the package that we think makes the most successful FDEs,\" she said. Part of the issue, Kalavade said, is that colleges and universities are still developing FDE training programs. She said that recent groups of applicants have improved, especially in their familiarity with AI. \"The batch that came out this summer was the first one that grew up with more AI native thinking,\" she said. Kalavade said AI models alone can get customers \"halfway,\" but she said FDEs are needed to turn that into a customized solution. \"Anyone can build an agent now, but how do you make sure the agent has the right guardrails?\" she said. \"How do you figure out, 'OK, what's the best underlying model that I can use from a cost-based perspective?", "date_str": "2026-10-04T10:03:01+00:00", "hash": "0091f2e7dce7678f", "title_fa": "مدیر اجرایی آمازون می گوید یافتن استعدادهای FDE بسیار چالش برانگیز است: \"اینها تک شاخ هستند\"", "summary_fa": "آسا کالاواده، معاون خدمات وب آمازون در بخش مهندسی توسعه یافته، گفت که این شرکت به دنبال یک مجموعه مهارت خاص است. Amazon Amazon Web Services یک میلیارد دلار روی FDE ها شرط بندی کرده است. یکی از مدیران آمازون به Business Insider گفت که پیدا کردن کارگران مناسب کار آسانی نیست. مدیر اجرایی گفت: \"اینها تک شاخ هستند.\" مهندسان مستقر در آینده یکی از داغ ترین مشاغل در هوش مصنوعی هستند. پیدا کردن آنها آسان نیست. آسا کالاواده، معاون مهندسی پیشرو در خدمات وب آمازون، به Business Insider گفت: \"اینها تک شاخ هستند.\" آمازون نیز مانند رقبای خود، روی آینده FDE ها شرط بندی بزرگی کرده است. در ماه ژوئن، AWS سرمایه گذاری 1 میلیارد دلاری را برای ایجاد یک سازمان اختصاصی AWS FDE اعلام کرد. FDE ها که توسط Palantir محبوب شده اند، اغلب با شرکت ها تعبیه می شوند تا هوش مصنوعی را در جریان کاری خود ادغام کنند و راه حل های سفارشی تر بسازند. Anthropic، OpenAI، و مایکروسافت ابتکارات بزرگی را در ماه های اخیر برای رقابت برای کسب و کار سودآور هوش مصنوعی سازمانی اعلام کرده اند. فورستر تخمین می‌زند که تنها بین ماه‌های می تا جولای، این سه شرکت و آمازون تقریباً 9 میلیارد دلار به سرمایه‌گذاری‌های مرتبط با FDE متعهد شدند. کالاواده گفت: «استخدام FDE این روزها در شهر به نوعی خشم است. \"همه می خواهند FDE شوند.\" کالاواده گفت که آمازون در ساخت تیم گزینشی عمل می کند و در ابتدا بر روی مهندسانی تمرکز می کند که می توانند در حال اجرا باشند. او گفت: \"بذر اولیه ما چیزی است که من شورشیان می نامم، مهندسان مرزی که قبلاً در آنجا بوده اند، این کار را انجام داده اند.\" کالاواده گفت که این «نقش واقعاً سختی است» و کسانی که بهترین موقعیت را برای موفقیت دارند، ذهنیت استارتاپی دارند. او"}, {"source": "Business Insider", "title": "Americans’ love of oversized Halloween skeletons is still going strong", "link": "https://www.businessinsider.com/american-oversized-halloween-skeletons-still-going-strong-2026-10", "summary": "The original Skelly has amassed a massive following since it launched in 2020. Jay L. Clendenin/Getty Images The original 12-foot Skelly from Home Depot first went viral in 2020. Six years later, the trend of jumbo Halloween yard decorations seems as strong as ever. Walmart-owned Sam's Club is tapping into the trend with an 11-foot reaper, but Skelly remains king. It wasn't all that long ago that towering Halloween skeletons weren't really a thing. That all changed seemingly overnight in 2020, when Home Depot introduced its wildly popular 12-foot Skelly decoration, driving record Halloween sales for the home improvement chain that year. The trend is still going strong, with more than a dozen online communities devoted to supersized skeletons, including a Facebook group with nearly 300,000 members. Walmart-owned warehouse chain Sam's Club told Business Insider that sales of their version, an 11-foot Reaper, have been running ahead of expectations since it was launched back in June. The Reaper quickly rose to become one of the chain's top ten selling Halloween items, and was sold out at some warehouse locations, as of Friday. \"Halloween is now a season, just like Christmas,\" said Kara Deleon, Senior Director of Seasonal Merchandising at Sam's Club. \"It is truly taking on a much bigger persona than it's ever had in the past.\" Americans appear to have embraced the Summerween creep, with online visits to Sam's Club's Halloween decor product listings up 67% in July compared to the year before, the company said. But few things embody that bigger persona than the jumbo skeletons (and their friends) that have been popping up in yards across the US. Some setups last for just a few weeks, while others stay up year-round — to the consternation of some homeowners' associations. Phil Michalski, an instructional assistant who lives near Philadelphia, told Business Insider he owns both the Home Depot Skelly and Sam's Club Reaper, plus a few others. \"The majority are set up all year round, but the weather this year has beaten them down,\" he said. \"My other skeletons will be up until the new year as I put Santa suits on some and a Ebenezer Scrooge hat on another.\" \"I have the Deadwood up by my front door, and that's a local landmark,\" he said, referring to another 12-foot Halloween offering from Home Depot that looks like a menacing Groot from Marvel's Guardians of the Galaxy series. Nelson Bairos, an engineer who lives near Boston, told Business Insider he started a side h", "date_str": "2026-10-04T09:53:01+00:00", "hash": "0ca4597038ce15c2", "title_fa": "عشق آمریکایی ها به اسکلت های بزرگ هالووین همچنان قوی است", "summary_fa": "Skelly اصلی از زمانی که در سال 2020 عرضه شد طرفداران زیادی پیدا کرده است. Jay L. Clendenin/Getty Images Skelly اصلی 12 فوتی از Home Depot برای اولین بار در سال 2020 در فضای مجازی پخش شد. شش سال بعد، روند تزیینات حیاط هالووین جامبو مانند همیشه قوی به نظر می رسد. باشگاه سام متعلق به والمارت با دروگر 11 فوتی در حال استفاده از این روند است، اما اسکلی همچنان پادشاه است. خیلی وقت پیش نبود که اسکلت های بلند هالووین واقعاً چیزی نبود. همه چیز ظاهراً یک شبه در سال 2020 تغییر کرد، زمانی که Home Depot دکوراسیون بسیار محبوب 12 فوتی Skelly خود را معرفی کرد و رکورد فروش هالووین را برای زنجیره بهبود خانه در آن سال به ارمغان آورد. این روند همچنان به قوت خود ادامه دارد و بیش از دوازده جامعه آنلاین به اسکلت های بزرگ اختصاص داده شده اند، از جمله یک گروه فیس بوک با نزدیک به 300000 عضو. فروشگاه های زنجیره ای Sam's Club متعلق به Walmart به Business Insider گفت که فروش نسخه آنها، Reaper 11 فوتی، از زمانی که در ژوئن عرضه شد، فراتر از حد انتظار بوده است. Reaper به سرعت به یکی از ده اقلام برتر زنجیره ای در فروش هالووین تبدیل شد و از روز جمعه در برخی از مکان های انبار فروخته شد. کارا دلئون، مدیر ارشد تجارت فصلی در کلاب سام، گفت: «هالووین اکنون یک فصل است، درست مانند کریسمس. \"این واقعاً شخصیتی بسیار بزرگتر از آنچه در گذشته داشته است به خود می گیرد.\" به گفته این شرکت، به نظر می رسد آمریکایی ها خزش تابستانی را پذیرفته اند، با بازدید آنلاین از فهرست محصولات دکور هالووین کلاب سم در ماه جولای نسبت به سال قبل 67 درصد افزایش یافته است. اما چیزهای کمی آن شخصیت بزرگ‌تر از اسکلت‌های جامبو (و دوستانشان) را"}, {"source": "Business Insider", "title": "I used AI to track my job rejections. It changed my search, and I got hired.", "link": "https://www.businessinsider.com/
