براین برای همه مناسب نخواهد بود. با این حال، اگر می‌دانید که دنبال گوشی‌هایی هستید که در هر مرحله سخت می‌روند، ارزش دیدن دارد. جزئیات مشخصات قیمت شروع 1399 دلار / 1360 پوند / 1550 یورو رنگ سایه نقره ای، طلایی صورتی، بنفش کبالت، آبی آسمانی، سفید، مشکی تاریخ انتشار 11 مارس 2026 رتبه دوام IP68 صفحه نمایش"}, {"source": "Business Insider", "title": "Elizabeth Holmes' partner, Billy Evans, is the real villain in 'You Can See Everything.' Here's what to know about him.", "link": "https://www.businessinsider.com/elizabeth-holmes-fiance-partner-billy-evans-relationship-job-theranos", "summary": "Elizabeth Holmes and Billy Evans leave federal court in San Jose, California, in 2022. David Paul Morris/Bloomberg via Getty Images Elizabeth Holmes, the Theranos founder convicted of fraud, has two kids with William \"Billy\" Evans. Evans plays a big role in Nathan Fielder's new A24 documentary, \"You Can See Everything.\" In the film, Evans says he's trying to launch \"Theranos 2.0,\" another blood-testing startup. William \"Billy\" Evans emerges as the unlikely star of \" You Can See Everything ,\" the new A24 documentary about Theranos founder Elizabeth Holmes . But while Evans is certainly a scene-stealer, the doc doesn't cast him in the best light. Evans is Holmes' partner and the father of their two young children. The couple met in 2017, and, as Evans says in the doc, fell in love instantaneously. The couple welcomed their first child, William, in 2021. Their daughter, Invicta (Latin for \"invincible\"), was born sometime around February 2023 , just a few months after Holmes was sentenced to 11 years in prison for defrauding investors. Holmes has said she knew it was bad timing — to put it lightly — to fall in love and start a family. But she didn't want her felony convictions or the perception of outsiders to \"dictate how we live our lives.\" \"Finding your person in the middle of all of this and experiencing that love when you're going through hell is the most beautiful thing I've ever experienced,\" Holmes told The New York Times in 2023. In the weeks before her looming incarceration, Holmes and Evans invited comedian Nathan Fielder to observe and document their domestic life. The resulting film, \"You Can See Everything,\" depicts Evans as a dominant force in their home — chiding Holmes for how she prepares scrambled eggs, dictating her schedule, and frequently cutting in during her conversations with Fielder. Holmes reported to prison in May 2023, but the movie doesn't end there. Fielder continued to document Evans as he worked on a new blood-testing startup, building upon the vision that Holmes had for Theranos. \"The idea is to put the band back together and do it all again,\" Evans tells Fielder. Here's everything we know about Evans and his plans for \"Theranos 2.0.\" Evans grew up near San Diego as an heir to his family's successful hospitality business The Lodge Torrey Pines in La Jolla is one of the properties owned by Evans Hotels. Shutterstock.com Evans is one of three children born to his parents, Susan and William L. Evans, per the Daily Mail . The Evan", "date_str": "2026-10-16T01:47:01+00:00", "hash": "1db346216173ffc1", "title_fa": "شریک الیزابت هلمز، بیلی ایوانز، شرور واقعی در «شما می توانید همه چیز را ببینید» است. در اینجا آنچه باید در مورد او بدانید.", "summary_fa": "الیزابت هلمز و بیلی ایوانز دادگاه فدرال در سن خوزه، کالیفرنیا را در سال 2022 ترک می کنند. دیوید پل موریس/بلومبرگ از طریق گتی ایماژ الیزابت هلمز، بنیانگذار ترانوس که به اتهام کلاهبرداری محکوم شده است، دارای دو فرزند با ویلیام \"بیلی\" ایوانز است. ایوانز نقش بزرگی در مستند جدید ناتان فیلدر در A24، \"شما می توانید همه چیز را ببینید\" بازی می کند. در این فیلم، ایوانز می‌گوید که در تلاش است تا «Theranos 2.0» را راه‌اندازی کند، یک استارت‌آپ دیگر برای آزمایش خون. ویلیام \"بیلی\" ایوانز به عنوان ستاره بعید \"شما می توانید همه چیز را ببینید\"، مستند جدید A24 در مورد الیزابت هلمز، بنیانگذار ترانوس، ظاهر می شود. اما در حالی که ایوانز مطمئناً یک دزد صحنه است، دکتر او را در بهترین نور قرار نمی دهد. ایوانز شریک زندگی هولمز و پدر دو فرزند خردسال آنهاست. این زوج در سال 2017 با هم آشنا شدند و همانطور که ایوانز در مستند می گوید، بلافاصله عاشق هم شدند. این زوج در سال 2021 به اولین فرزند خود، ویلیام، خوش آمد گفتند. دختر آنها، Invicta (به لاتین \"شکست ناپذیر\")، حدوداً در فوریه 2023، تنها چند ماه پس از محکومیت هولمز به 11 سال زندان به دلیل کلاهبرداری از سرمایه گذاران، به دنیا آمد. هولمز گفته است که می‌دانست زمان بدی - به بیان ساده - عاشق شدن و تشکیل خانواده است. اما او نمی‌خواست محکومیت‌های جنایتکارانه‌اش یا برداشت افراد خارجی «به ما دیکته کند که چگونه زندگی کنیم». هولمز در سال 2023 به نیویورک تایمز گفت: «پیدا کردن شخص خود در میان همه این‌ها و تجربه آن عشق زمانی که در حال عبور از جهنم هستید، زیباترین چیزی است که من تا به حال تجربه کرده‌ام.» در هفته‌های قبل از حبس قریب‌الوقوع او، هلمز و ایوانز از نیتان فیلدر کمدین دعوت کردند تا زندگی خانگی خود را مشاهده"}, {"source": "Business Insider", "title": "Microsoft AI chief says the company beat OpenAI at its own game, using a quarter of the computing power", "link": "https://www.businessinsider.com/microsoft-ai-ceo-new-model-beats-openai-using-less-compute-2026-10", "summary": "Mustafa Suleyman, the CEO of Microsoft AI. Stephen Brashear/Getty Images Microsoft AI recently announced its latest model MAI-Base-2. AI CEO Mustafa Suleyman compared the model to a similar offering from OpenAI. Microsoft trained its model more efficiently than OpenAI, he said in an internal meeting. Microsoft AI CEO Mustafa Suleyman told employees an in-house model was better than a similar offering from OpenAI , one of the software giant's biggest customers and partners. \"We now have a stronger pre-trained base model than the model that currently powers GPT 5.6 Sol,\" Suleyman said during a town hall meeting with employees on Thursday. \"And in fact, we used one-quarter of the compute that OpenAI used to train their model.\" Pre-training is the first stage of building an AI model, when it learns patterns from huge amounts of text, images, and other information. This takes massive amounts of expensive computing power, so Microsoft could save money if it's worked out a way to do this more efficiently. Microsoft announced the model, MAI-Base-2, earlier on Thursday . Suleyman said Microsoft privately tested this model against OpenAI models, including one nicknamed \"Spud\" that powers GPT-5.6. He added that Microsoft's model performed better on tests measuring how well AI can understand and predict patterns in information. The comparisons are based on technical information Microsoft has about OpenAI's models, Suleyman said. \"Privately and confidentially, we've also compared it to the OpenAI models,\" Suleyman told employees, while suggesting that Microsoft has special access to information on how OpenAI models perform. It's notable that Suleyman would choose to highlight limitations of OpenAI models, even in private discussions. Microsoft has invested billions of dollars in OpenAI, and owns a stake in the startup that is likely worth more than $100 billion. Any criticism of OpenAI could potentially dent the value of this huge investment. The two companies also have a major partnership, with Microsoft offering OpenAI models to its Azure cloud customers. Microsoft has used OpenAI models for its own products such as Copilot, too. But the relationship between the two companies has frayed in the past year or so. Increasingly, Microsoft has tried to branch out from OpenAI, including by working on its own models. Suleyman also said Microsoft's new AI model used \"12 times less computation than was used for DeepSeek, for example, on compute efficiency.\" Suleyman didn't spe", "date_str": "2026-10-15T23:31:44+00:00", "hash": "b69b63ce360f92da", "title_fa": "رئیس هوش مصنوعی مایکروسافت می گوید که این شرکت با استفاده از یک چهارم قدرت محاسباتی OpenAI را در بازی خودش شکست داد", "summary_fa": "مصطفی سلیمان، مدیر عامل مایکروسافت هوش مصنوعی. Stephen Brashear/Getty Images هوش مصنوعی مایکروسافت اخیرا آخرین مدل خود را MAI-Base-2 معرفی کرد. مصطفی سلیمان، مدیر عامل هوش مصنوعی این مدل را با یک پیشنهاد مشابه از OpenAI مقایسه کرد. او در یک جلسه داخلی گفت که مایکروسافت مدل خود را کارآمدتر از OpenAI آموزش داده است. مصطفی سلیمان، مدیر عامل هوش مصنوعی مایکروسافت به کارمندان گفت که یک مدل داخلی بهتر از یک پیشنهاد مشابه از OpenAI، یکی از بزرگترین مشتریان و شرکای غول نرم افزاری است. سلیمان در جلسه ای در تالار شهر با کارکنان در روز پنجشنبه گفت: \"ما اکنون یک مدل پایه از پیش آموزش دیده قوی تر از مدلی داریم که در حال حاضر GPT 5.6 Sol را تامین می کند.\" و در واقع، ما از یک چهارم محاسباتی استفاده کردیم که OpenAI برای آموزش مدل خود استفاده کرد. پیش آموزش اولین مرحله ساخت یک مدل هوش مصنوعی است، زمانی که الگوها را از حجم عظیمی از متن، تصویر و سایر اطلاعات یاد می گیرد. این نیاز به مقادیر زیادی قدرت محاسباتی گران قیمت دارد، بنابراین اگر مایکروسافت راهی برای انجام کارآمدتر این کار پیدا کند، می‌تواند در هزینه‌های خود صرفه‌جویی کند. مایکروسافت مدل MAI-Base-2 را اوایل روز پنجشنبه معرفی کرد. سلیمان گفت که مایکروسافت به طور خصوصی این مدل را در برابر مدل های OpenAI، از جمله مدلی با نام مستعار \"Spud\" که GPT-5.6 را پشتیبانی می کند، آزمایش کرده است. او اضافه کرد که مدل مایکروسافت در آزمایش‌هایی که میزان هوش مصنوعی می‌تواند الگوهای اطلاعات را درک و پیش‌بینی کند بهتر عمل کرد. سلیمان گفت که مقایسه ها بر اساس اطلاعات فنی مایکروسافت در مورد مدل های OpenAI است. سلیمان به کارمندان گفت: «به‌طور خصوصی و محرمانه، ما آن را با مدل‌های OpenAI مقایسه کرده‌ایم. قابل توجه است که سلیمان ترجیح می دهد محدودیت های"}, {"source": "Business Insider", "title": "OpenAI's Dots head says AI means workers now have a choice between doing less or more", "link": "https://www.businessinsider.com/openai-dots-head-ai-lets-workers-do-less-or-more-2026-10", "summary": "Attendees at OpenAI s DevDay conference on September 29, 2026. Minh Connors/Bloomberg via Getty Images OpenAI's Alexander Embiricos said the AI era gives a choice: work more, or work less. He's in charge of Dots, the company's new always-on work assistant. AI is often pitched as freeing up time. Embiricos responded to the idea that it might add more work. As the competitive AI race pushes tech workers into long hours, the head of OpenAI's new Dots product says AI gives people another option: work a whole lot less. Alexander Embiricos, who leads OpenAI's enterprise product and helms the new Dots agent tool , told a crowd at TechCrunch's Disrupt conference on Thursday that AI's capabilities have created something of a fork in the road for workers. You can grind to meet the moment. Or you can use AI to kick your feet up a little. \"We basically have a lot more choice now,\" he said. Embiricos made the comments after a reporter asked about when AI systems will actually deliver more free time. The reporter shared an anecdote where an OpenAI employee used a ChatGPT mobile feature to work in their car and on a plane — not exactly liberated by the new tech. Embiricos said that the moment has already arrived where a worker can \"outsource\" tasks to AI and do less work. Then again, some people are so excited about AI's potential that they feel like it's an \"interesting, ripe moment\" to put in extra hours. \"I think that's why a lot of people are motivated to work very hard right now. That includes myself,\" he said. \"But I think actually there is this choice, and there's totally this other setup where you could delegate a ton more things.\" OpenAI is billing its Dots tool as a workplace assistant, always on and capable of proactively handing tasks and sorting to-dos. Embiricos uses his Dot often in Slack, he said, engaging on various threads. His perspective illustrates how early companies are in their journey to adopt AI tools. Most companies have not yet automated their work tasks, and many workers are still debating how much to use the tools. Early AI adopters, meanwhile, can sprint through some work that used to take days or weeks, especially in software engineering. Embiricos summed up the situation he feels workers are in: \"You either choose: do you expand the ambition of what you can do, or do you do less? I do think we're there.\" Have a tip? Contact this reporter via email at scouncil@businessinsider.com , or over text, Signal, Telegram, or WhatsApp at 415-757-819", "date_str": "2026-10-15T22:20:25+00:00", "hash": "d99a7d2489be2dcf", "title_fa": "رئیس نقطه‌های OpenAI می‌گوید هوش مصنوعی به این معناست که کارگران اکنون بین انجام کارهای کمتر یا بیشتر انتخاب دارند", "summary_fa": "شرکت کنندگان در کنفرانس DevDay OpenAI در 29 سپتامبر 2026. مین کانرز/ بلومبرگ از طریق Getty Images الکساندر امبیریکوس از OpenAI گفت که عصر هوش مصنوعی یک انتخاب می دهد: بیشتر کار کنید یا کمتر کار کنید. او مسئول Dots، دستیار جدید و همیشه فعال شرکت است. هوش مصنوعی اغلب به عنوان آزاد کردن زمان مطرح می شود. Embiricos به این ایده پاسخ داد که ممکن است کارهای بیشتری اضافه کند. از آنجایی که رقابت رقابتی هوش مصنوعی کارکنان فناوری را به ساعات طولانی سوق می‌دهد، رئیس محصول جدید OpenAI Dots می‌گوید هوش مصنوعی گزینه دیگری را در اختیار افراد قرار می‌دهد: بسیار کمتر کار کنید. الکساندر امبیریکوس، که محصول سازمانی OpenAI را رهبری می‌کند و ابزار عامل جدید Dots را هدایت می‌کند، روز پنجشنبه در کنفرانس TechCrunch's Disrupt به جمعی گفت که قابلیت‌های هوش مصنوعی چیزی شبیه به یک انشعاب در مسیر برای کارگران ایجاد کرده است. می‌توانید برای دیدار با لحظه‌های لحظه‌ای، خرد کنید. یا می توانید با استفاده از هوش مصنوعی پاهای خود را کمی بالا بیاورید. او گفت: «ما اساساً اکنون انتخاب های بیشتری داریم. Embiricos این اظهارات را پس از آن بیان کرد که یک خبرنگار پرسید که سیستم‌های هوش مصنوعی واقعاً چه زمانی زمان آزاد بیشتری را ارائه می‌کنند. خبرنگار حکایتی را به اشتراک گذاشت که در آن یک کارمند OpenAI از یک ویژگی تلفن همراه ChatGPT برای کار در ماشین و هواپیما استفاده می‌کرد - که دقیقاً توسط فناوری جدید آزاد نشده بود. Embiricos گفت که لحظه ای فرا رسیده است که یک کارگر می تواند وظایف خود را به هوش مصنوعی \"برون سپاری\" کند و کار کمتری انجام دهد. پس از آن، برخی از مردم آنقدر در مورد پتانسیل هوش مصنوعی هیجان زده هستند که احساس می کنند این یک \"لحظه جالب و آماده\" برای صرف ساعت های اضافی است. او گفت:"}, {"source": "Business Insider", "title": "18 clever small-space furniture picks for storage, seating, and hosting", "link": "https://www.businessinsider.com/guides/home/small-space-furniture-multi-functional-furniture", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Cozey;Ikea;Wayfair/Business Insider The challenge: Small spaces need versatile pieces that adapt for daily living, working, and hosting. Our top picks: Multifunctional designs including expanding dining tables, storage beds, fold-down desks, and modular sleepers. What we look for: Budget-smart, durable furniture with hidden storage and effortless transformation. Living in a small space shouldn't mean giving up on hosting dinner parties, accommodating overnight guests, or sacrificing storage and organization. While downsizing can even transform your spending habits for the better , the key isn't cutting back on what you own — it's choosing clever, stylish furniture that makes every single square foot work twice as hard. According to interior designers, navigating tight layouts comes down to avoiding common spatial mistakes and maximizing unused corners , especially when a single room must serve as a dining area, home office, and guest suite all at once. Whether it's an unassuming console table that expands to seat 12 for holiday dinners, a sleek bench hiding secret storage, or a playful accent chair that flips into a guest bed at a moment's notice, the best pieces double up on functionality without sacrificing aesthetics. We've rounded up smart, highly adaptable finds that earn their footprint in your home. Ahead, we've organized these problem-solving pieces room by room so you can easily upgrade your kitchen, living room, and bedroom to handle daily life and host effortlessly when company arrives. Our top small-space furniture picks Best budget storage bed: Latitude Run Braya Hydraulic Storage Bed Best modular sleeper sofa with hidden storage: Cozey Neptune Sofa Bed Best space-saving expanding dining table: Expand Furniture Junior Giant Table Best budget triple-duty seating and shelving: Ikea KOMPISHÄNG Stool Set Kitchen and dining small space ideas Beyond versatile dining tables, pairing multi-functional furniture with space-saving kitchen products helps keep prep surfaces clear and daily cooking hassle-free. A rolling kitchen island turned bar set Winsome Winsome Suzanne Kitchen Table Set with Stools Details at a glance Dimensions: 29.7 W x 29.2 D x 32.8 H inches Weight: 52 pounds Material: Wood/Wood Composite Colors: Coffee, Natural, Teak This counter-height kitchen cart plays double duty as extra prep space and converts into a dining table with the addition of", "date_str": "2026-10-15T22:00:01+00:00", "hash": "a5d93552cc1b879a", "title_fa": "18 انتخاب هوشمندانه مبلمان با فضای کوچک برای ذخیره سازی، نشستن و میزبانی", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Cozey;Ikea;Wayfair/Business Insider چالش: فضاهای کوچک به قطعات همه کاره نیاز دارند که برای زندگی روزمره، کار و میزبانی سازگار شوند. انتخاب های برتر ما: طرح های چند منظوره از جمله میزهای ناهار خوری بزرگ، تخت های ذخیره سازی، میزهای تاشو، و تخت خواب های مدولار. چیزی که ما به دنبال آن هستیم: مبلمان بادوام و باهوش با ذخیره سازی مخفی و دگرگونی بی دردسر. زندگی در یک فضای کوچک نباید به معنای کنار گذاشتن میزبانی مهمانی های شام، پذیرایی از مهمانان شبانه، یا قربانی کردن فضای ذخیره سازی و سازماندهی باشد. در حالی که کوچک کردن حتی می‌تواند عادات خرج کردن شما را به سمت بهتر شدن تغییر دهد، نکته کلیدی این نیست که چیزهایی را که دارید کاهش دهید - انتخاب مبلمان شیک و هوشمندانه است که باعث می‌شود هر فوت مربع دو برابر بیشتر کار کند. به گفته طراحان داخلی، پیمایش در چیدمان‌های فشرده به اجتناب از اشتباهات فضایی رایج و به حداکثر رساندن گوشه‌های استفاده نشده منجر می‌شود، به‌خصوص زمانی که یک اتاق یک نفره باید به‌عنوان یک ناهار خوری، دفتر کار خانگی و سوئیت مهمان به‌طور هم‌زمان عمل کند. چه یک میز کنسول ساده که برای شام تعطیلات تا 12 صندلی بزرگ می شود، یک نیمکت شیک که فضای مخفی را مخفی می کند، یا یک صندلی لهجه ای بازیگوش که در یک لحظه روی تخت مهمان می چرخد، بهترین تکه ها بدون از بین بردن زیبایی شناسی، کارایی را دوچندان می کنند. ما یافته های هوشمند و بسیار سازگار را گردآوری کرده ایم که ردپای خود را در خانه شما به دست می آورند. پیش از این، ما این بخش‌های حل‌کننده مشکل را اتاق به اتاق سازماندهی کرده‌ایم تا بتوانید به راحتی آشپزخانه، اتاق نشیمن و"}, {"source": "Business Insider", "title": "Netflix is getting a new content chief after a stock slump and viewership struggles", "link": "https://www.businessinsider.com/netflix-new-chief-content-officer-peter-rice-bela-bajaria-out-2026-10", "summary": "Netflix is replacing content chief Bela Bajaria with former Disney TV executive Peter Rice. Gonzalo Marroquin/Getty Images for Netflix; Beata Zawrzel/NurPhoto via Getty Images; Dimitrios Kambouris/Getty Images Netflix is replacing its content chief after laying off about 1,000 employees. Former Disney and Fox executive Peter Rice will take the role from departing Bela Bajaria. Netflix has gone through a bruising period as Wall Street questions its long-term direction. Netflix has hired a new content chief after a stock slump and struggles to grow its viewership. Peter Rice, a former Fox and Disney executive, will oversee Netflix's $20 billion budget for movies and shows starting on October 26, the company announced on Thursday. Rice will replace Bela Bajaria, who's leaving the company after almost a decade. Bajaria took the top content job in 2023 and memorably described the ideal Netflix show as a \"gourmet cheeseburger.\" The exec shake-up came a day after the streaming giant laid off about 1,000 employees , its biggest round of layoffs in four years. Netflix has had a tough year. Co-CEO Ted Sarandos said at a Bloomberg media event last month that Netflix is \"not growing as fast as I want us to, and we're working on making that move faster.\" Shares are down nearly 40% in the past 12 months as investors increasingly worry about slower viewership growth and the company's long-term direction. Netflix's attempt to buy Warner Bros. — which was ultimately stymied by David Ellison's Paramount — soured the Wall Street narrative about the company's future. Rice was previously the head of Disney's TV arm, where he ran Hulu and networks like ABC, Disney Channel, and FX. He was fired from the Mouse House in 2022 by former Disney CEO Bob Chapek and replaced by Dana Walden, who's now Disney's creative chief. \"Peter is one of the most effective at-scale operators in the entertainment industry,\" Sarandos said in a statement. The co-CEO added that Rice's \"business acumen is sharp, his talent relationships are exceptionally strong, and his experience across TV and film is deep and broad.\" Bajaria \"led enormous changes at Netflix,\" Sarandos said, crediting her for helping the streamer broaden its content mix to live events and sports. Under Bajaria, Netflix had hits like \"KPop Demon Hunters\" — its biggest movie ever — as well as breakout shows like \"Wednesday\" and Emmy Award winner \"Adolescence.\" However, Netflix's engagement growth was only 2% in the first half of 2026, and", "date_str": "2026-10-15T21:47:23+00:00", "hash": "17c9e66463d4d405", "title_fa": "نتفلیکس پس از رکود سهام و مشکلات بینندگان، مدیر محتوای جدیدی پیدا می کند", "summary_fa": "نتفلیکس در حال جایگزینی بلا باجاریا، مدیر اجرایی سابق تلویزیون دیزنی، پیتر رایس است. Gonzalo Marroquin/Getty Images برای نتفلیکس. Beata Zawrzel/NurPhoto از طریق گتی ایماژ; دیمیتریوس کامبوریس/ گتی ایماژ نتفلیکس پس از اخراج حدود 1000 کارمند خود، مدیر محتوای خود را جایگزین می کند. پیتر رایس، مدیر سابق دیزنی و فاکس، پس از جدایی بلا باجاریا، این نقش را بر عهده خواهد گرفت. نتفلیکس دوران کبودی را پشت سر گذاشته است زیرا وال استریت مسیر بلندمدت خود را زیر سوال می برد. نتفلیکس پس از رکود سهام و تلاش برای افزایش بینندگان خود، مدیر محتوای جدیدی را استخدام کرده است. پیتر رایس، یکی از مدیران سابق فاکس و دیزنی، بر بودجه 20 میلیارد دلاری نتفلیکس برای فیلم‌ها و نمایش‌ها که از 26 اکتبر شروع می‌شود، نظارت خواهد کرد. رایس جایگزین بلا باجاریا می شود که پس از تقریبا یک دهه شرکت را ترک می کند. باجاریا در سال 2023 شغل برتر محتوا را به دست گرفت و به طور به یاد ماندنی نمایش ایده آل نتفلیکس را به عنوان \"چیزبرگر لذیذ\" توصیف کرد. این تغییر مدیران یک روز پس از اخراج غول استریم حدود 1000 کارمند رخ داد که بزرگترین دور اخراج آن در چهار سال گذشته بود. نتفلیکس سال سختی را پشت سر گذاشت. تد ساراندوس، مدیر عامل شرکت بلومبرگ، ماه گذشته در یک رویداد رسانه ای بلومبرگ گفت که نتفلیکس \"به آن سرعتی که من می خواهم رشد نمی کند، و ما در حال کار بر روی این حرکت سریعتر هستیم.\" سهام در 12 ماه گذشته نزدیک به 40 درصد کاهش یافته است زیرا سرمایه گذاران به طور فزاینده نگران رشد کندتر بینندگان و جهت گیری بلندمدت شرکت هستند. تلاش نتفلیکس برای خرید برادران وارنر - که در نهایت توسط پارامونت دیوید الیسون متوقف شد - روایت وال استریت در مورد آینده این شرکت را تیره کرد. رایس"}, {"source": "Business Insider", "title": "Read the memo Apollo sent to put the brakes on private equity's frantic recruiting ritual", "link": "https://www.businessinsider.com/apollo-delaying-on-cycle-recruiting-private-equity-2026-10", "summary": "Marc Rowan, CEO of Apollo Global Management. Bloomberg/Getty Images Apollo is delaying recruiting for its 2028 associate class, Business Insider has learned. This follows last year's delay, which helped slowed down private equity's chaotic recruiting process. Apollo said it wants young bankers to have more experience before making their next career move. Apollo is delaying on-cycle recruiting again this year, after a similar move last year helped push back the recruiting timeline across the private equity industry. The private equity giant told prospective candidates Thursday afternoon that it will not recruit its 2028 associate class this calendar year, according to an email obtained by Business Insider. The memo, signed by David Sambur, co-head of Private Equity, and Antoine G. Munfakh, deputy global head of Private Equity, said the firm will wait until candidates who started their investment banking careers over the summer are \"closer to completing one full year of professional experience.\" The hope, the memo said, is that this will convince others in private equity to delay their process so both candidates and employers can make \"better decisions.\" Last year, after Apollo CEO Marc Rowan said the firm would delay on-cycle recruiting, others, such as General Atlantic also decided to pause. \"We were encouraged that others in the industry took similar steps, and we hope more firms will do the same this year,\" the memo said. On-cycle recruiting — the controversial process through which private equity firms hire junior investment bankers for associate roles a year or even two before they would start — had crept earlier and earlier in the years following the pandemic. Competition among private equity firms to lock up top talent pushed recruiting earlier and made the process notoriously intense . It would kick off with little warning, with junior bankers sometimes calling in sick or interviewing in the middle of the night to avoid jeopardizing their day jobs. JPMorgan's CEO , Jamie Dimon, has been a big critic of the process, calling it \"unethical.\" In 2025, amid rumblings that on-cycle recruiting could take place before some students even graduated from college, JPMorgan rolled out a policy that incoming analysts could be terminated for accepting future-dated private equity offers. Apollo then decided to pause its on-cycle recruiting for 2027 associates, setting off a chain reaction that delayed the process well into this year. Questions have swirled if the p", "date_str": "2026-10-15T21:37:43+00:00", "hash": "9d7f61bcf2e022e8", "title_fa": "یادداشتی را که آپولو فرستاده است را بخوانید تا از مراسم استخدام دیوانه وار سهام خصوصی جلوگیری کند.", "summary_fa": "مارک روآن، مدیر عامل مدیریت جهانی آپولو. بلومبرگ/گتی ایماژز، بیزینس اینسایدر دریافته است که آپولو استخدام برای کلاس همکار خود در سال 2028 را به تاخیر می اندازد. این به دنبال تاخیر سال گذشته است که به کند کردن روند استخدام بی نظم سهام خصوصی کمک کرد. آپولو گفت که می خواهد بانکداران جوان قبل از حرکت شغلی بعدی خود تجربه بیشتری داشته باشند. آپولو امسال دوباره استخدام در چرخه را به تعویق می اندازد، پس از حرکت مشابه سال گذشته که به عقب انداختن جدول زمانی استخدام در صنعت سهام خصوصی کمک کرد. بر اساس ایمیلی که Business Insider دریافت کرده است، غول سهام خصوصی بعدازظهر پنجشنبه به نامزدهای احتمالی گفت که در این سال تقویمی کلاس 2028 خود را استخدام نخواهد کرد. این یادداشت توسط دیوید سامبور، رئیس مشترک سهام خصوصی و آنتوان جی. منفخ، معاون جهانی سهام خصوصی، گفت که این شرکت تا زمانی که نامزدهایی که حرفه بانکداری سرمایه گذاری خود را در تابستان آغاز کرده اند، \"به تکمیل یک سال کامل تجربه حرفه ای نزدیک تر شوند، صبر خواهد کرد.\" در این یادداشت آمده است که امید است که این امر سایرین در سهام خصوصی را متقاعد کند که روند خود را به تاخیر بیاندازند تا هم نامزدها و هم کارفرمایان بتوانند \"تصمیمات بهتری\" بگیرند. سال گذشته، پس از اینکه مدیر عامل آپولو، مارک روآن، گفت که شرکت استخدام در چرخه را به تاخیر می اندازد، سایرین مانند جنرال آتلانتیک نیز تصمیم به توقف گرفتند. در این یادداشت آمده است: «ما تشویق شدیم که سایرین در صنعت گام‌های مشابهی برداشتند، و امیدواریم شرکت‌های بیشتری امسال همین کار را انجام دهند. استخدام در چرخه - فرآیند بحث‌برانگیز که از طریق آن شرکت‌های سهام خصوصی بانکداران سرمایه‌گذاری خردسال را برای نقش‌های وابسته یک یا حتی دو سال قبل از شروع استخدام می‌کنند - در سال‌های پس از"}, {"source": "Business Insider", "title": "Best fitness trackers of 2026", "link": "https://www.businessinsider.com/guides/tech/best-fitness-trackers", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We tested top fitness and health trackers from Garmin, Oura, Fitbit, Whoop, and Apple. Rachael Schultz/Business Insider The best fitness trackers can tell you a lot more than how many steps you've taken. Today's top wearables track your workouts, heart rate, sleep, recovery, and daily activity to give you a clearer picture of your overall health and fitness — and, more importantly, help you understand when to push harder or prioritize rest. But the right tracker for you depends heavily on what you want to monitor most and what you're most comfortable wearing. Popular options range from full-featured fitness watches to discreet bands and smart rings. Over the last two years, I've tested nearly 20 fitness and health trackers in real life, wearing them through strength workouts, runs, hikes, ski days, travel, sick days in bed, and long stretches at my desk. After all that testing, the Garmin Vivoactive 6 is still the best fitness tracker for most people thanks to its accurate health and workout data, comprehensive features, clean design, and long battery life. But if you're looking to spend less, the Fitbit Inspire 3 is my budget pick. It skips some advanced training features but still tracks the basics for under $100. And if you want something discreet to focus more on everyday health than on exercise goals, I highly recommend the Oura Ring 5 . It's lightweight, unobtrusive, and delivers insightful interpretations of your biometrics, including early signs that you may be getting sick. Below, you'll also find recommendations for runners, athletes focused on improving recovery, and those who want a screen-free band without the distractions of a display. Our top picks for the best fitness trackers Best overall : Garmin Vivoactive 6 - See at Amazon Best on a budget : Google Fitbit Inspire 3 - See at Amazon Best for daily health : Oura Ring 5 - See at Amazon Best for runners : Garmin Forerunner 265 - See at Amazon Best screenless band : Google Fitbit Air - See at Amazon Best for recovery : Whoop 5.0 - See at Amazon Best smartwatch for fitness : Apple Watch Series 12 - See at Amazon Best overall After testing 15+ wearables over the last two years, the sleek Garmin Vivoactive 6 nsider", "title": "The best weight loss cat foods, recommended with guidance from veterinarians", "link": "https://www.businessinsider.com/guides/pets/best-cat-foods-weight-loss", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The best weight loss cat foods provide complete and balanced nutrition while helping cats achieve a healthy weight. Royal Canin; Hill s; Iams; Purina; Farmina/Business Insider The best weight loss cat foods are typically lower in calories and fat than regular formulas while providing more nutrients per serving. These foods also often contain more fiber, which helps cats feel full even when they're eating fewer calories. Get to the point: Our top picks include Hill's Science Diet Perfect Weight Roasted Vegetable and Chicken Medley wet food and Royal Canin Weight Care dry food . Both foods are formulated to support fat metabolism and help cats feel fuller for longer. To choose the best weight management foods for this guide, we consulted veterinarians about what to look for in diets for overweight cats and evaluated dozens of recipes using their guidance. Every food below meets or exceeds the Association of American Feed Control Officials (AAFCO) standards and aligns with the Global Nutrition Guidelines published by the World Small Animal Veterinary Association (WSAVA). These are the benchmarks consistently recommended by the veterinarians we consult. Our top picks for the best weight loss cat foods Best overall wet: Hill's Science Diet Perfect Weight Roasted Vegetable and Chicken Medley, 2.9 oz. cans (24 count) - $52 at Chewy Best overall dry: Royal Canin Weight Care Adult Dry Cat Food, 6 lb. bag - $43 at Chewy Best budget wet: Blue Buffalo True Solutions Weight Control Chicken Recipe, 3 oz. cans (24 count) - $36 at Chewy Best budget dry: Purina One +Plus High Protein Chicken, 7 lb. bag - $18 at Chewy Best for seniors: Iams Proactive Health Healthy Senior Chicken Recipe, 7 lb. bag - $17 avige https://www.tiktok.com/@jennamiscavige Read the original article on Business Insider", "date_str": "2026-10-15T21:02:01+00:00", "hash": "6b808f66f4d4f970", "title_fa": "به گفته یک ساینتولوژیست سابق، ساینتولوژی چگونه عمل می کند", "summary_fa": "جنا میسکاویج خواهرزاده دیوید میسکاویج، رهبر کلیسای ساینتولوژی است. او به عنوان یک ساینتولوژیست بزرگ شد و زمانی که 22 ساله بود ترک کرد. ساینتولوژی که توسط نویسنده علمی تخیلی ال. ران هابارد در سال 1954 تأسیس شد، به یک جنبش مذهبی جهانی تبدیل شد و طبق گزارش ها در دهه 1990 به بیش از 100000 عضو رسید. حتی با کاهش رتبه‌هایش، ساینتولوژی جایگاه بزرگی را در فرهنگ عامه حفظ کرده است که دلیل آن اعضای برجسته‌ای مانند تام کروز و جان تراولتا است. جنا میسکاویج با Business Insider در مورد شهرت مخفیانه ساینتولوژی، تاکتیک های استخدام، امور مالی، اتهامات سوء استفاده و ارتباطات با افراد مشهور صحبت می کند. او نویسنده کتاب «فراتر از باور: زندگی مخفی من در ساینتولوژی و فرار وحشتناک من» است. جنا همچنین از رسانه های اجتماعی برای صحبت علیه ساینتولوژی و اطلاع رسانی به مردم استفاده می کند. کلیسای ساینتولوژی تصویر جنا میسکاویج از سازمان را رد می‌کند و در بیانیه‌ای ایمیلی می‌گوید: «آنچه [جنا] می‌فروشد یک مکاشفه جدید نیست. این اتهامات بی‌اعتبار است که برای سود بسته‌بندی شده‌اند. تلاش او برای بدنامی با نام خانوادگی برجسته ای شروع می شود و به پایان می رسد که او مایل است با آن معامله کند.\" برای اطلاعات بیشتر از جنا: https://www.youtube.com/@JennaMiscavige https://www.instagram.com/therealjennamiscavige https://www.tiktok.com/@jennamiscavige مقاله اصلی را بخوانید. نماد اشتراک گذاری Scientologist یک فلش منحنی به سمت راست X LinkedIn کپی پیوند فیس بوک نماد حرف F. David Ibekwe and Carter Thallon 2026-10-15T21:02:01.471Z نماد اشتراک گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند فیس بوک نماد حرف F. توضیحات Angle down icon نمادی به شکل زاویه ای که به سمت پایین است."}, {"source": "Business Insider", "title": "Katie Zacharia defends calling herself a lawyer in new interview", "link": "https://www.businessinsider.com/kate-zacharia-bar-exam-results-interview-la ت جداگانه کنترل می شوند، سیاهی عمیق را بدون درخشش نور پس زمینه ای که گاهی اوقات در صفحه های LCD مشاهده می کنید، تولید می کنند. مانیتور بازی ال‌جی Ultragear 27GS93QE OLED 499.99 دلار در آمازون 899.99 دلار صرفه جویی 400.00 دلار دریافت معامله دریافت معامله 499.99 دلار در آمازون 899.99 دلار صرفه جویی 400.00 دلار این کیفیت تصویر با کنتراست VESA Display010100000000000000000000 دیگر افزایش می‌یابد. نسبت و 98.5% پوشش رنگی DCI-P3، که به نمایان شدن جزئیات در صحنه های تیره تر کمک می کند و رنگ ها را زنده تر نشان می دهد. هنگامی که اکشن شروع شد، نرخ تازه‌سازی 240 هرتز و زمان پاسخگویی تقریباً آنی 0.03 میلی‌ثانیه، حرکت را صاف و واضح نگه می‌دارد، در حالی که سازگاری AMD FreeSync Premium Pro و Nvidia G-Sync باعث کاهش پارگی و لکنت در هنگام نوسان نرخ فریم می‌شود. شایان ذکر است که بهره مندی کامل از 240 هرتز در 1440p نیاز به یک رایانه شخصی توانا دارد، و اگرچه دو پورت HDMI 2.1 و ورودی DisplayPort 1.4 همگی از این نرخ به روز رسانی پشتیبانی می کنند، گیمرهای کنسول از چیزی فراتر از محدودیت"}, {"source": "Lifehacker", "title": "How to Enable Global Privacy Control in Every Browser (and Why You Should)", "link": "https://lifehacker.com/tech/how-to-enable-global-privacy-control-in-every-browser-and-why-you-should?utm_medium=RSS", "summary": "Security-wise, most browsers are an open door, happy to reveal your screen size, operating system, language preferences, or GPU model when a website asks. But telling those websites to stop selling your data to third parties is still more confusing than it should be. Although about a dozen U.S. states including California, Delaware, New Jersey, and Texas now require businesses to honor consumers privacy preferences online, most browsers do not offer a native opt-out option that lets you signal those preferences by default. Now, the California Opt Me Out Act , which goes into effect on Jan 1, 2027, is making it mandatory for browsers to do so. Still, for now, native support for a global privacy opt-out remains inconsistent among web browsers. TSome privacy-forward browsers like Brave, DuckDuckGo, and Mozilla Firefox enable this feature by default, while others, like Chrome or Edge, require you to install third-party extensions such as the EFF Privacy Badger. Since coverage and setup vary wildly, I ll walk you through the exact steps to enable this feature on every major browser. What is Global Privacy Control? Global Privacy Control (GPC) is an open-source consumer privacy protocol developed jointly by several universities, media organizations, and privacy-focused tech companies. Instead of having to hunt for a manual Do Not Sell or Refuse Third-Party Cookies link on every website and app, you enable this feature once in your browser to send a legal notification to every online destination you visit that you d like to opt out of all data sharing and targeted advertising features. On a technical level, GPC combines an HTTP header (Sec-GPC) with a JavaScript property (navigator.globalPrivacyControl) that your browser sends with every website fetch request to let website owners know that they are not supposed to share or sell your data. Unlike previous iterations like Firefox s Do Not Track , GPC issues a specific request that s backed by leading data protection legislation, including the General Data Protection Regulation (GDPR) and California Consumer Privacy Act (CCPA), making websites and businesses more likely to honor them. With over 150 million users and more than 66,000 participating websites, the GPC project has garnered support and participation from the Mozilla Foundation, The Washington Post, Automattic, Electronic Frontier Foundation (EFF), The New York Times, and others. It has even been made into an official work item at the World Wide Web Conso", "date_str": "2026-10-15T22:00:00+00:00", "hash": "cdf2043aa9f3445f", "title_fa": "نحوه فعال کردن کنترل حریم خصوصی جهانی در هر مرورگر (و چرا باید)", "summary_fa": "از نظر امنیتی، اکثر مرورگرها دری باز هستند و وقتی وب سایتی سؤال می کند، خوشحال می شوند اندازه صفحه نمایش، سیستم عامل، اولویت های زبان یا مدل GPU شما را نشان دهند. اما اینکه به آن وب‌سایت‌ها بگویید فروش داده‌های شما به اشخاص ثالث را متوقف کنند، همچنان گیج‌کننده‌تر از آن چیزی است که باید باشد. اگرچه حدود دوازده ایالات متحده ایالت‌هایی از جمله کالیفرنیا، دلاور، نیوجرسی و تگزاس اکنون از کسب‌وکارها می‌خواهند که اولویت‌های حریم خصوصی مصرف‌کنندگان را به‌صورت آنلاین رعایت کنند، اکثر مرورگرها یک گزینه انصراف بومی ارائه نمی‌دهند که به شما امکان می‌دهد به طور پیش‌فرض این تنظیمات را علامت‌گذاری کنید. اکنون، قانون کالیفرنیا Opt Me Out که از 1 ژانویه 2027 اجرایی می شود، انجام این کار را برای مرورگرها اجباری می کند. با این حال، در حال حاضر، پشتیبانی بومی برای انصراف از حریم خصوصی جهانی در بین مرورگرهای وب ناسازگار است. برخی از مرورگرهای انتقال حریم خصوصی مانند Brave، DuckDuckGo و Mozilla Firefox این ویژگی را به طور پیش‌فرض فعال می‌کنند، در حالی که برخی دیگر، مانند Chrome یا Edge، از شما می‌خواهند افزونه‌های شخص ثالث مانند EFF Privacy Badger را نصب کنید. از آنجایی که پوشش و تنظیم بسیار متفاوت است، من شما را از طریق مراحل دقیق فعال کردن این ویژگی در هر مرورگر اصلی راهنمایی می‌کنم. کنترل حریم خصوصی جهانی چیست؟ کنترل حریم خصوصی جهانی (GPC) یک پروتکل منبع باز حفظ حریم خصوصی مصرف کننده است که به طور مشترک توسط چندین دانشگاه، سازمان رسانه ای و شرکت های فناوری متمرکز بر حریم خصوصی توسعه یافته است. به‌جای اینکه در هر وب‌سایت و برنامه‌ای به دنبال پیوند دستی «فروش یا رد کوکی‌های شخص ثالث» باشید، این ویژگی را یک بار در مرورگر خود فعال می‌کنید تا به هر مقصد آنلاینی که بازدید می‌کنید، یک اعلان قانونی ارسال کند که می‌خواهید"}, {"source": "Lifehacker", "title": "One of the Best QLED TVs of 2026 Is Over $1,200 Off Right Now", "link": "https://lifehacker.com/tech/65-inch-tcl-qm8l-qled-tv-deal-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. TCL has been pushing the boundaries of QLED TVs, making some of the best in the market at very competitive prices. This year, the company released مینیمال"}, {"source": "Lifehacker", "title": "10 Hacks Every Goodreads User Should Know", "link": "https://lifehacker.com/tech/10-hacks-every-goodreads-user-should-know?utm_medium=RSS", "summary": "Goodreads is a popular platform for managing your To Be Read (TBR) pile, finding recommended titles, tracking your reading stats, and sharing reviews, ratings, and notes with friends, but there are ways to make the experience better. If you're an avid reader, use these tips, tricks, and hidden hacks to get the most out of what Goodreads has to offer. Use the barcode scanner to vet books while you're in the bookstore The Goodreads mobile app has a built-in scanner that uses your device's camera to scan either the book cover or barcode. It then pulls up information about the title, including a description and ratings/reviews from other Goodreads users, so you can decide whether to add it to My Books while you're in the store or perusing a friend's shelf. Simply tap the camera icon in the search bar. You can also see a history of scanned books in the camera tab. Log rereads with separate dates to avoid overwriting your existing data There are some books that are worth reading multiple times, and Goodreads allows you to track each reread as a separate activity so you don't overwrite your original entry or affect your reading challenge stats. If you just hit the Read button on the title page, it'll simply log the item as read without any additional information. Instead, select Edit my activity Add read date to enter start and finish dates for each reread. Select your book s correct edition to get accurate progress tracking If you care about nitty-gritty reading stats, make sure you choose the specific edition of the title you're reading. Different editions have different page numbers, and you can also select audiobook versions if you're listening rather than reading to keep those pages from being counted in your totals. Find available editions on the book's title page, or tap Show all editions and select Switch to this edition next to the correct one. Exclude audiobooks and graphic novels from your Reading Challenge to preserve your stats Goodreads counts all books read within a calendar year toward your annual Reading Challenge, but there may be titles you don't want included in your year-end stats. For example, if you're tracking audiobooks, graphic novels, or children's books in Goodreads, you can exclude them from your Reading Challenge so they don't count toward your page goal. You can also exclude titles if you want your Reading Challenge to focus specifically on one type of book. In the app, go to More Reading Challenge Challenge details , select the boo", "date_str": "2026-10-15T21:00:00+00:00", "hash": "1b11207d68f9b1c1", "title_fa": "10 هک که هر کاربر Goodreads باید بداند", "summary_fa": "Goodreads یک پلتفرم محبوب برای مدیریت مجموعه To Be Read (TBR)، یافتن عناوین توصیه شده، ردیابی آمار خواندن و به اشتراک گذاری نظرات، رتبه بندی ها و یادداشت ها با دوستان است، اما راه هایی برای بهبود تجربه وجود دارد. اگر خواننده مشتاق هستید، از این نکات، ترفندها و هک‌های پنهان استفاده کنید تا از آنچه گودریدز ارائه می‌کند حداکثر استفاده را ببرید. هنگامی که در کتابفروشی هستید از اسکنر بارکد برای بررسی کتاب ها استفاده کنید برنامه تلفن همراه Goodreads دارای یک اسکنر داخلی است که از دوربین دستگاه شما برای اسکن جلد کتاب یا بارکد استفاده می کند. سپس اطلاعات مربوط به عنوان، از جمله توضیحات و رتبه‌بندی/نظرات سایر کاربران Goodreads را جمع‌آوری می‌کند، بنابراین می‌توانید تصمیم بگیرید که آیا آن را در زمانی که در فروشگاه هستید یا در قفسه دوستان مطالعه می‌کنید به My Books اضافه کنید. به سادگی روی نماد دوربین در نوار جستجو ضربه بزنید. همچنین می توانید تاریخچه کتاب های اسکن شده را در تب دوربین مشاهده کنید. بازخوانی‌های گزارش با تاریخ‌های جداگانه برای جلوگیری از بازنویسی داده‌های موجودتان، کتاب‌هایی هستند که ارزش چندین بار خواندن را دارند، و Goodreads به شما این امکان را می‌دهد که هر بازخوانی شده را به‌عنوان یک فعالیت جداگانه دنبال کنید تا ورودی اصلی خود را بازنویسی نکنید یا بر آمار چالش خواندن تأثیر نگذارید. اگر فقط دکمه Read را در صفحه عنوان فشار دهید، به سادگی مورد را به عنوان خوانده شده بدون هیچ گونه اطلاعات اضافی ثبت می کند. در عوض، ویرایش فعالیت من را انتخاب کنید تا تاریخ خواندن را اضافه کنید تا تاریخ شروع و پایان هر بازخوانی را وارد کنید. برای دریافت ردیابی دقیق پیشرفت، نسخه صحیح کتاب خود را انتخاب کنید. نسخه‌های مختلف شماره صفحه‌های متفاوتی دارند، و همچنین می‌توانید نسخه‌های کتاب صوتی را در صورت گوش دادن به جای خواندن"}, {"source": "Lifehacker", "title": "I Tried a Smart Band That Measures Body Temperature During Workouts, and I'm on the Fence About It", "link": "https://lifehacker.com/health/i-tried-the-speediance-strap-and-i-am-on-the-fence-about-it?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The market for smart bands is getting pretty crowded. It s hard to beat the Fitbit Air on value or the Whoop on performance analytics, and anything in between struggles to make itself stand out. But the Speediance strap caught my eye for an unusual feature it includes: a sensor that claims to measure your core body temperature during workouts. Speediance Strap $159.00 at Speediance Shop Now Shop Now $159.00 at Speediance Does the Speediance Strap really measure core temperature? The only other device I ve seen make a similar claim is the Core 2 thermal sensor, which I wore for a summer s heat training and found it valuable and useful (though not without a few caveats). A Speediance rep told me their device works the same way as the Core 2: It has a sensor for skin temperature, and another for heat flux, which can estimate how much you re warming up over the course of a workout. Core 2 requires that you pair its device to a chest strap heart rate monitor because its algorithm can only relate data from the sensors to your core temperature if it knows how your heart rate is responding. It also asks you to wear the sensor on the chest strap, so that it s as close as possible to your actual core temperature. Speediance doesn t have those requirements; you can get temperature estimates while wearing the device on your wrist and without any extra equipment. To test Speediance s claims, I wore both devices together for several workouts and compared the heat strain each device says I was under. While the Core 2 device is geared toward heat adaptation, Speediance uses heat data mostly to tell you when you re done warming up and when your performance may be suffering due to heat. How I tested the core temperature features of the Speediance band Credit: Beth Skwarecki The Speediance app shows your heat load during workouts, right on the same screen that shows your heart rate, time, and running mileage. At the beginning of a workout, you ll see a label that says you re insufficiently warmed up. Once your body temperature rises by about 0.5 to 1 degree Celsius (about 1 to 2 degrees Fahrenheit), you re deemed to be in the optimal performance zone. A numerical strain index increases as you get warmer; above 5.0, you re told you re in performance decline, and above 7.0, you re in heat overload. For comparison, the Core 2 sensor uses a slightly different scale, or at least has different cutoffs: Between 1.0 and 2.9, you re i", "date_str": "2026-10-15T20:56:51+00:00", "hash": "80ed9dcfea03b171", "title_fa": "من یک بند هوشمند را امتحان کردم که دمای بدن را در طول تمرین اندازه گیری می کند، و من در مورد آن در حصار هستم", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. بازار باندهای هوشمند بسیار شلوغ شده است. شکست دادن Fitbit Air در ارزش یا Woop در تجزیه و تحلیل عملکرد دشوار است، و هر چیزی در این بین برای برجسته کردن خود تلاش می کند. اما بند Speediance به دلیل ویژگی غیرمعمولی که شامل آن می شود توجه من را به خود جلب کرد: سنسوری که ادعا می کند دمای بدن شما را در طول تمرین اندازه گیری می کند. تسمه Speediance $159.00 در Speediance Shop اکنون خرید کنید $159.00 در Speediance آیا بند Speediance واقعا دمای هسته را اندازه می‌گیرد؟ تنها دستگاه دیگری که دیدم ادعای مشابهی دارد، سنسور حرارتی Core 2 است که برای تمرین گرمای تابستانی آن را پوشیدم و آن را ارزشمند و مفید دانستم (البته بدون چند اخطار). یکی از نمایندگان Speediance به من گفت که دستگاه آنها مانند Core 2 کار می کند: یک سنسور برای دمای پوست و دیگری برای شار گرما دارد که می تواند میزان گرم کردن بدن شما را در طول یک تمرین تخمین بزند. Core 2 مستلزم این است که دستگاه آن را با یک مانیتور ضربان قلب بند سینه جفت کنید زیرا الگوریتم آن تنها در صورتی می تواند داده های حسگرها را به دمای مرکزی شما مرتبط کند که بداند ضربان قلب شما چگونه پاسخ می دهد. همچنین از شما می خواهد که سنسور را روی بند قفسه سینه بپوشانید تا تا حد امکان به دمای واقعی اصلی شما نزدیک شود. Speediance آن الزامات را ندارد. شما می توانید تخمین های دما را در حالی که دستگاه را روی مچ دست خود قرار می دهید و بدون هیچ تجهیزات اضافی دریافت کنید. برای آزمایش ادعاهای Speediance، هر دو دستگاه را برای چندین تمرین با هم پوشیدم و فشار حرارتی که هر دستگاه می‌گوید تحت آن قرار"}, {"source": "Lifehacker", "title": "Google Just Removed This Major Perk From Its AI Plus Subscription", "link": "https://lifehacker.com/tech/google-just-removed-this-major-perk-from-its-ai-plus-subscription?utm_medium=RSS", "summary": "While ChatGPT might have been first out of the generative AI gate, Google has established itself as more than a major player in this new technological race. While plenty of people use Gemini free of charge, there are also a plethora of paid subscribers who want access to Google's latest and greatest models. Like other AI subscriptions, Google's best plans are wildly expensive, but it's cheapest paid tier, AI Plus, is much more reasonable: For $4.99 per month, you get access to faster Gemini models, and bump your Google storage up to 400GB to boot. But if you're subscribed to Google AI Plus for access to better versions of Gemini, change is coming. Google is warning subscribers this week that they're losing a major perk perhaps the perk of the AI Plus subscription tier, as subscribers will soon no longer have access to Gemini's advanced models. How Google is changing its subscription tiers As 9to5Google reports , this isn't necessarily out of the blue. When Google rolled out Gemini 4 Argon , the company advertised that its latest model would only be available on AI Pro and AI Ultra plans, not AI Plus. At the same time, the company said that its plans meant AI Plus subscribers would soon lose access to all Gemini Pro models. It now seems those plans are now rolling out one Redditor shared an email they received from Google as an AI Plus subscriber, which reads: We wanted to let you know about changes to the models that you can access with your Google AI Plus plan. Starting on 1 3 N o v e m b e r 2 0 2 6 , the ability to select Pro models in both the Gemini app and AI Mode in Google Search will only be available to Google AI Pro subscribers and above. You ll still have access to our latest Flash-Lite model and Flash, built for speed and intelligence. Your previous chats using the Pro model can be continued with a different model. To learn more about these changes, you can visit our Help Centre article for additional details. You can manage or cancel your subscription at any time. Thank you for being a Google AI Plus subscriber. The Google One team According to the message, AI Plus subscribers have less than a month left to access Gemini Pro models. On Nov. 13, these users will be limited to Flash-Lite and Flash in both the Gemini app and AI Mode. While it's fortunate that previous Pro chats will still be available, users will need to use one of these less powerful models if they want to continue those conversations. So now, access to models in Google's AI sub", "date_str": "2026-10-15T18:00:00+00:00", "hash": "a72cd2e3067b6b73", "title_fa": "گوگل به تازگی این امتیاز بزرگ را از اشتراک AI Plus خود حذف کرده است", "summary_fa": "در حالی که ChatGPT ممکن است برای اولین بار از گیت هوش مصنوعی مولد خارج شده باشد، گوگل خود را بیش از یک بازیگر اصلی در این مسابقه فناوری جدید تثبیت کرده است. در حالی
