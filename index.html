اشته باشند: جلب نظر جوانان. با تشدید فشار به ساخت مراکز داده عظیم و پردیس‌های پر انرژی، ظاهراً صنعت رویکرد نرم‌تری را برای ایجاد جامعه با استفاده از تاکتیکی اتخاذ می‌کند که سایر صنایع دارای مشکل روابط عمومی امتحان کرده‌اند."}, {"source": "Wired", "title": "Valerion VisionMaster Max 4K Projector Review: Looks Great, Sounds OK", "link": "https://www.wired.com/review/valerion-visionmaster-max-4k-projector/", "summary": "The Valerion VisionMaster Max 4K Projector delivers superb blacks, great brightness, and more adjustment capabilities than many users need.", "date_str": "2026-10-18T10:00:00+00:00", "hash": "754102ee65f36761", "title_fa": "بررسی پروژکتور Valerion VisionMaster Max 4K: عالی به نظر می رسد، به نظر می رسد خوب است", "summary_fa": "پروژکتور Valerion VisionMaster Max 4K رنگ‌های مشکی فوق‌العاده، روشنایی فوق‌العاده و قابلیت‌های تنظیم بیشتر از نیاز بسیاری از کاربران را ارائه می‌دهد. اکنون بخرید چندین گزینه خرید موجود است 3,999 دلار در Valerion 3,699 دلار 3,499 دلار در آمازون Comment Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان امتیاز: 8/10 WIRED طراحی درجه یک. کیفیت تصویر، روشنایی و سطوح مشکی هیجان انگیز. Google TV یک راه اندازی ساده را ایجاد می کند. ریموت عالی اتصال و سازگاری فوق العاده TIRED با توجه به رقابت، برای یک پروژکتور همه کاره بسیار گران است. عملکرد صدا با کیفیت تصویر مطابقت ندارد. پروژکتور بیش از حد برای استفاده معمولی. کمپین Valerion's VisionMaster Kickstarter بیش از 8 میلیون دلار در سال 2024 جمع آوری کرد و آن را به پرمخاطب ترین کمپین در این پلتفرم در آن سال تبدیل کرد. پس از گذراندن چند هفته گذشته با VisionMaster Max، من مطمئن هستم که تعداد زیادی حامی راضی وجود دارد. با قیمت 3999 دلار، قیمت آن بسیار بیشتر از رقبای عالی نقطه و بازی، مانند Nebula X1 (9/10 WIRED توصیه می‌شود)، اما بسیار کمتر از پروژکتورهای سینمای خانگی 4K بومی برندهایی مانند سونی و JVC است. این باعث می‌شود که مکس در دو اردوگاه بسیار متفاوت قرار بگیرد. طراحی جمع و جور، تلویزیون داخلی گوگل، و راه‌اندازی خودکار آن، طبقه‌بندی یک پروژکتور سبک زندگی ممتاز را نشان می‌دهد، در حالی که زوم اپتیکال، تغییر عمودی لنز، عنبیه مکانیکی، و پردازش سطح سیاه پیچیده‌تر به چیزی بسیار توانمندتر اشاره می‌کند. استفاده از آن آسان است و برای نصب روی سقف تقریباً بسیار زیبا است، اما مسلماً برای گذراندن عمر خود روی میز کناری بسیار پیچیده است. بنابراین این سوال باقی می ماند: VisionMaster Max واقعا برای چه کسی است؟"}, {"source": "Wired", "title": "The Best AirPods Cases We’ve Used In Our Day-to-Day Lives (2026)", "link": "https://www.wired.com/story/best-airpods-case/", "summary": "These accessories add personality to your Apple headphones case, make them easy to find, and offer some protection, too.", "date_str": "2026-10-18T09:00:00+00:00", "hash": "7233d3930e98f941", "title_fa": "بهترین کیس های AirPods که در زندگی روزمره خود استفاده کرده ایم (2026)", "summary_fa": "این لوازم جانبی به قاب هدفون اپل شما شخصیت می بخشد، پیدا کردن آنها را آسان می کند و همچنین محافظتی نیز ارائه می دهد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان بهترین موارد AirPods ذهنی هستند، اما خوشبختانه، شما هزاران گزینه برای مطابقت با سبک و خلق و خوی خود دارید. شما می توانید تعداد زیادی کیس جدید را به صورت آنلاین پیدا کنید، که اکثر آنها خوب هستند. برای این راهنما، ما روی موارد با زاویه WIRED تمرکز کردیم. توصیه‌های زیر به‌جای مورد دیگری که شبیه غذا یا یک شخصیت مجاز است، عملکرد یا محافظتی فراتر از اصول اولیه را اضافه می‌کند. برای توصیه‌های بیشتر، راهنمای ما در مورد بهترین AirPods، بهترین هدفون بی‌سیم و بهترین لوازم جانبی iPad را بررسی کنید. بهترین قاب ایرپاد در مجموع بهترین قاب ایرپاد بهترین قاب محافظ MagSafe بهترین قاب چرمی بهترین قاب باز کن یک قاب با گیره بهترین کیف ایرپاد مکس دیگر قاب‌های ایرپاد ما موارد ایرپاد را آزمایش کردیم. سازگار با AirPods Pro (نسل 1، 2 و 3) و AirPods (نسل 3 و 4). Dbrand Grip Case فوق‌العاده به نظر می‌رسد، و حجم یا وزن آزاردهنده‌ای به هدفون من اضافه نمی‌کند. قاب از لاستیک مشکی ساخته شده است و می‌توان آن را با پوسته‌های انتخابی شما به‌علاوه یک بند اختیاری شخصی‌سازی کرد. بیش از 40 گزینه وجود دارد، و شما می توانید هر زمان که آنها را تعویض کنید، اگرچه پوسته های برچسب مانند قابل استفاده مجدد نیستند. Dbrand دستورالعمل های نصب را ارائه می دهد، اما من آن را بال زدم و به راحتی می توانم همه چیز را ردیف کنم. گزینه های پوست نیز نرم هستند. من به Holo White واکنش‌دهنده UV علاقه‌مند نیستم، اما برخی از آنها با اشعه ایکس یا زیبایی‌شناسی پیکسلی، الگوهای مدار، رنگ‌های ساده و موارد دیگر"}, {"source": "Wired", "title": "Climate Change Has It In for the World’s Best Surfing", "link": "https://www.wired.com/story/climate-change-has-it-in-for-the-worlds-best-surfing/", "summary": "As coastlines change, so do surf breaks. That may spell the end for premier waves and the tourist economies that depend on them.", "date_str": "2026-10-18T09:00:00+00:00", "hash": "a6fd68ce32584616", "title_fa": "تغییرات آب و هوایی برای بهترین موج سواری در جهان وجود دارد", "summary_fa": "همانطور که خطوط ساحلی تغییر می کند، استراحت های موج سواری نیز تغییر می کند. این ممکن است پایانی برای موج های برتر و اقتصادهای توریستی که به آنها وابسته هستند باشد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان این داستان در ابتدا در The Guardian ظاهر شد و بخشی از همکاری میز آب و هوا است. بحران آب و هوا برای برخی از بزرگ‌ترین موج‌های موج‌سواری در جهان پیش می‌آید، برخی از آن‌ها را با بالا رفتن سطح دریا به زیر آب می‌برد و برخی دیگر را با شکست‌های کلاسیک در برابر تحولات ساحلی از بین می‌برد. تجزیه و تحلیل ده‌ها موج معروف در ذخیره‌گاه‌های موج‌سواری جهانی (WSR) نشان داد که بیش از سه‌چهارم آن‌ها به دلیل تغییر سطح جزر و مد، خطوط ساحلی سخت‌شده و جابجایی شن‌ها در معرض خطر بالایی قرار دارند. این تأثیرات نه تنها برای موج سوارانی که امواج را می گیرند، بلکه برای جوامعی که به اقتصاد موج سواری چند میلیارد دلاری وابسته هستند، که اغلب در مکان هایی با چیزهای دیگر قرار دارند، اهمیت دارد. امواجی که در این مطالعه بیشترین خطر را داشتند شامل \"بمبباران بشکه\" در ساحل کروید در شمال دوون، انگلستان است. نقطه شکست در Noosa در استرالیا و Oriente Salvaje، السالوادور. و صخره های سانتا کروز کالیفرنیا مانند Sewer Peak و Wind and Sea. بهترین امواج موج سواری با ترکیب پیچیده ای از شکل کف دریا، جهت تورم و جزر و مد ایجاد می شوند. دن رینمن، دانشیار دانشگاه جزایر کانال دانشگاه ایالتی کالیفرنیا و یکی از نویسندگان این مطالعه می‌گوید: «شکست‌های موج‌سواری پدیده‌های اقیانوس‌شناسی فوق‌العاده منحصربه‌فردی هستند - ترکیبی از همه این عوامل که دقیقاً برای ایجاد موج در کنار هم قرار می‌گیرند - و بنابراین این فرآیندها واقعاً حساس هستند. گرمای جهانی سطح دریا را بالا می برد و الگوهای بارندگی"}, {"source": "Wired", "title": "Magnesium May Not Reach Your Brain, Despite Supplement Label Promises", "link": "https://www.wired.com/story/magnesium-may-not-reach-your-brain-despite-supplement-label-promises/", "summary": "Some of the many variants sold today promise to penetrate our gray matter, but biology isn’t in the habit of respecting marketing declarations.", "date_str": "2026-10-18T09:00:00+00:00", "hash": "7cdc5c99c28c0f26", "title_fa": "منیزیم ممکن است به مغز شما نرسد، علیرغم وعده های برچسب مکمل", "summary_fa": "برخی از انواع مختلفی که امروزه فروخته می شوند، وعده نفوذ در ماده خاکستری ما را می دهند، اما زیست شناسی عادت به احترام به اظهارات بازاریابی ندارد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان بیشتر ما احتمالاً به میزان مصرف منیزیم فکر نمی کنیم، اما بدن ما بدون آن نمی تواند کار کند. هر یک از ما معمولاً حاوی 25 گرم منیزیم است که بیش از نیمی از آن در استخوان ها ذخیره می شود. بقیه در سلول ها در سراسر بدن توزیع می شود و در صدها واکنش شیمیایی ضروری از جمله ساخت DNA و پروتئین ها و ارسال سیگنال ها در سیستم عصبی و بین مغز و بقیه بدن ما شرکت می کند. اما فقط به این دلیل که سلول های ما – و به خصوص نورون های ما – به منیزیم نیاز دارند، به این معنا نیست که منیزیم اضافی باعث عملکرد بهتر آنها می شود. نه تنها این، بلکه مصرف بیشتر این عنصر به این معنی نیست که به مغز شما یا واقعاً به بخش خاصی از بدن شما می رسد. در قرص های مکمل، منیزیم نه تنها به تنهایی بلکه بخشی از ترکیبی است که معمولاً «نمک منیزیم» نامیده می شود. این باید حل شود تا Mg²⁺، نسخه یونی که بدن ما استفاده می کند، آزاد شود. اینکه چه مقدار از این در واقع وارد سیستم شما می شود – در مقابل دفع می شود – به عوامل مختلفی از جمله دوز، محتویات معده و میزان منیزیم موجود در بدن شما بستگی دارد. به عبارت دیگر، هر چه دوز بالاتر باشد، منیزیم کمتری جذب می شود. این همه در صورتی است که مکمل در وهله اول حل شود. اکسید منیزیم که معمولاً پایه ارزان ترین قرص های ارائه شده است، به این راحتی تجزیه نمی شود. در حقیقت،"}, {"source": "Business Insider", "title": "AI companies scraped the web. Now they want to learn how you work.", "link": "https://www.businessinsider.com/ai-workplace-data-training-agents-robots", "summary": "An office in action before the rise of generative AI. Kirn Vintage Stock/Corbis via Getty Images A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . AI companies have already scraped much of the web. Now they're chasing something even more valuable: data that shows how humans actually work. That's the focus of Business Insider's new series, The AI Data Grab . This week, we published three stories showing how the race for workplace data is accelerating. One piece, from Charles Rollet, Tom Carter, and Stephen Council, examines the booming market for company records . AI firms are offering businesses six- and even seven-figure sums for anonymized Slack messages, emails, presentations, and internal documents. The goal is to teach AI systems how people solve problems, collaborate, make decisions, and complete long, multi-step tasks. Those real-world workflows are becoming the fuel for the next generation of AI agents. Another story, from Melia Robinson, explores how law firms are building AI systems around decades of legal knowledge , turning their own experience into a competitive advantage rather than relying solely on off-the-shelf AI models and tools. A third piece, by Rya Jetha, reveals how AI companies pay people to record real-world work , such as cooking dinners and packing warehouses, to teach robots how humans perform everyday physical tasks. Together, these stories point to a major shift in AI development. The first wave of generative AI was mostly about bigger models and faster chips. The next chapter is about machines understanding how work gets done, so AI can help us do it better and quicker. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-10-18T14:00:01+00:00", "hash": "1deac01981d051b3", "title_fa": "شرکت های هوش مصنوعی وب را خراش دادند. حالا آنها می خواهند یاد بگیرند که چگونه کار می کنید.", "summary_fa": "دفتری در حال فعالیت قبل از ظهور هوش مصنوعی مولد. Kirn Vintage Stock/Corbis via Getty Images نسخه ای از این داستان در ابتدا در خبرنامه AI Insider منتشر شد. برای خبرنامه هفتگی AI Insider Business Insider در اینجا ثبت نام کنید. شرکت های هوش مصنوعی در حال حاضر بسیاری از وب را خراشیده اند. اکنون آنها به دنبال چیزی حتی با ارزش تر هستند: داده هایی که نشان می دهد انسان ها واقعا چگونه کار می کنند. این تمرکز سری جدید Business Insider، The AI ​​Data Grab است. این هفته، ما سه داستان منتشر کردیم که نشان می‌دهد چگونه رقابت برای داده‌های محل کار شتاب می‌گیرد. یک قطعه، از چارلز رولت، تام کارتر، و استفان شورای، بازار پر رونق برای سوابق شرکت را بررسی می کند. شرکت‌های هوش مصنوعی مبالغ شش رقمی و حتی هفت رقمی را برای پیام‌های Slack، ایمیل‌ها، ارائه‌ها و اسناد داخلی ناشناس ارائه می‌کنند. هدف این است که به سیستم‌های هوش مصنوعی آموزش داده شود که مردم چگونه مشکلات را حل می‌کنند، با هم همکاری می‌کنند، تصمیم می‌گیرند و کارهای طولانی و چند مرحله‌ای را تکمیل می‌کنند. این گردش‌های کاری در دنیای واقعی به سوخت نسل بعدی عوامل هوش مصنوعی تبدیل می‌شوند. داستان دیگری، از ملیا رابینسون، به بررسی این موضوع می‌پردازد که چگونه شرکت‌های حقوقی در حال ساختن سیستم‌های هوش مصنوعی پیرامون چندین دهه دانش حقوقی هستند و تجربه خود را به جای تکیه بر مدل‌ها و ابزارهای هوش مصنوعی به یک مزیت رقابتی تبدیل می‌کنند. قطعه سوم، توسط Rya Jetha، نشان می‌دهد که چگونه شرکت‌های هوش مصنوعی به مردم برای ضبط کارهای دنیای واقعی، مانند پختن شام و بسته‌بندی انبارها، پرداخت می‌کنند تا به روبات‌ها آموزش دهند که چگونه انسان‌ها وظایف فیزیکی روزمره را انجام می‌دهند. این داستان ها با هم به یک تغییر اساسی در توسعه هوش مصنوعی اشاره می کنند. موج اول"}, {"source": "Business Insider", "title": "I spent a 4-day Amtrak trip working remotely so I wouldn't waste any PTO. I underestimated how difficult it would be.", "link": "https://www.businessinsider.com/worked-remotely-long-amtrak-train-ride-challenges-worth-it-2026-10", "summary": "Working remotely on an Amtrak train wasn t easy, but I would do it again. Laura Gio Carroll This summer, I took a four-day Amtrak trip with my spouse, and worked remotely the entire journey. I loved working in the café car while taking in views of the Mississippi River and the Great Plains. Even though the internet wasn't reliable, it was a great experience that I can't wait to do again. This summer, my spouse and I decided to take the longest Amtrak trip we've ever taken — three trains from Washington, DC, to Vancouver over four days. My partner, who is a teacher, had a break between the school year and the summer program, so this adventure was the perfect excuse to relax, disconnect from the world, and enjoy the train's views. That was, unfortunately, not the case for me. Since I have an office job with limited vacation time, I decided I would work remotely throughout the entire trip. Even though I had my boss's permission to work on the train and had packed all my essentials, I still wondered how successful this endeavor would be. Turns out, it was more challenging than I anticipated, but still worth the hassle. I made sure to prepare for any WiFi outages and pack accordingly. Laura Gio Carroll Before the trip, I researched whether the trains would have WiFi, but found that it could vary by route. Since I wasn't sure how reliable my internet options would be on board, I made sure to download the most important documents onto my computer instead of just relying on the cloud. This way, even if there was an unstable connection, I'd still be able to access them. Additionally, I made sure to have my phone's hotspot at the ready for whenever there wasn't WiFi on the train. And just as an extra precaution, I made a point of scheduling any important calls for either before or after our train rides , so that I wouldn't risk losing signal while speaking with my team. To prevent any other hiccups, I packed everything I could think of that I might need: my work laptop, my portable monitor , all the appropriate cords and chargers, and my planner for anything I needed to do on paper. The roomette s privacy was great, but it didn t have enough outlets. Laura Gio Carroll On two of our three train rides, we booked a roomette , a small bedroom with two seats facing each other that would convert into bunks at night. The internet was spotty in there, but I was still able to wrap up the last emails of the day without any problems. On the first train ride from DC to Chicago,", "date_str": "2026-10-18T13:57:01+00:00", "hash": "e009d58e187764ae", "title_fa": "من یک سفر 4 روزه Amtrak را صرف کار از راه دور کردم تا هیچ PTO را هدر ندهم. من دست کم گرفتم که چقدر سخت خواهد بود.", "summary_fa": "کار از راه دور در قطار Amtrak آسان نبود، اما من این کار را دوباره انجام خواهم داد. لورا جیو کارول تابستان امسال، من با همسرم یک سفر چهار روزه با آمتراک انجام دادم و کل سفر را از راه دور کار کردم. من دوست داشتم در ماشین کافه کار کنم، در حالی که از رودخانه می سی سی پی و دشت بزرگ دیدن می کردم. حتی با وجود اینکه اینترنت قابل اعتماد نبود، تجربه خوبی بود که نمی توانم دوباره آن را انجام دهم. تابستان امسال، من و همسرم تصمیم گرفتیم طولانی‌ترین سفر Amtrak را که تا به حال رفته‌ایم انجام دهیم - سه قطار از واشنگتن، دی سی، به ونکوور در طول چهار روز. شریک زندگی من که معلم است، بین سال تحصیلی و برنامه تابستانی استراحت داشت، بنابراین این ماجراجویی بهانه ای عالی برای استراحت، قطع ارتباط با دنیا و لذت بردن از مناظر قطار بود. متاسفانه برای من اینطور نبود. از آنجایی که من یک شغل اداری با زمان تعطیلات محدود دارم، تصمیم گرفتم در کل سفر از راه دور کار کنم. با وجود اینکه من از رئیسم اجازه کار در قطار را داشتم و همه وسایل ضروری خود را جمع کرده بودم، هنوز فکر می کردم که این تلاش چقدر موفق خواهد بود. معلوم شد، چالش‌برانگیزتر از آن چیزی بود که من پیش‌بینی می‌کردم، اما هنوز ارزش زحمت را دارد. من مطمئن شدم که برای هرگونه قطعی وای فای آماده شده و بسته بندی را مطابق با آن انجام می دهم. لورا گیو کارول قبل از سفر، در مورد اینکه آیا قطارها دارای WiFi هستند یا خیر، تحقیق کردم، اما متوجه شدم که ممکن است بسته به مسیر متفاوت باشد. از آنجایی که مطمئن نبودم گزینه‌های اینترنت من چقدر قابل اعتماد هستند، مطمئن شدم که مهم‌ترین اسناد را به‌جای تکیه بر فضای ابری در رایانه‌ام"}, {"source": "Business Insider", "title": "My family moved from a small country town to a big city this year. There are plenty of things we like, but a few we miss.", "link": "https://www.businessinsider.com/family-moved-small-town-to-big-city-pros-cons-2026-10", "summary": "The author and her family moved to the Gold Coast this year. Courtesy of Melissa Noble My family of five moved from a small country town to a city earlier this year. I wanted to spend more time with my parents, and there is plenty to love about the city. However, I miss the slower pace of life and the close-knit community. I've always been a city mouse, so when we decided to move from Melbourne, Australia, to Bright in country Victoria in 2021, I wasn't sure how long I'd last. Our family ended up falling in love with the slower pace of life and the people, and spent four years in the small alpine town at the foothills of the Victorian Alps. But in January, we moved from Bright to the Gold Coast, where I grew up. My parents' health was declining, and I wanted to spend quality time with them before it was too late. Moving from a small regional town of fewer than 3,000 people to a city of almost 700,000 was a profound lifestyle shift for our family of five. We had to make new friends , learn how to navigate a traffic light again (joking!), and get used to the buzzing city life. Overall, we've gained a lot from moving to the city, and I feel it's been especially beneficial to our kids, as it's helped build resilience. But there are definitely things about country life that I do miss, if I'm being honest. Life is full of trade-offs, and we've definitely made a few. We've gained convenience and accessibility In country Victoria, our nearest major retailer was an hour's drive away. If the kids needed new shoes or I needed new underwear, off we'd drive to the nearest major town. It often felt like a mission just to access simple amenities. Nowadays, everything we need is at our fingertips. If we want to eat Italian one night and Nepalese the next, we can. The Gold Coast has all the amenities we need, and a good mix of beaches, hinterland hikes, nightlife, festivals, and an up-and-coming food scene. There are more career and education opportunities Cities generally offer better career and education opportunities , without a doubt. In our family, my husband has probably benefited the most in that regard. When we moved here in January, he expanded his Muscle Freedom remedial massage and myotherapy business and started a clinic on the Gold Coast. Since then, the opportunities have been incredible, and he's treated some of Australia's biggest sporting identities. That would likely never have happened in country Victoria (unless they were holidaying there). Likewise, ou", "date_str": "2026-10-18T12:53:01+00:00", "hash": "2c723592278f1697", "title_fa": "خانواده من امسال از یک شهر کوچک روستایی به یک شهر بزرگ نقل مکان کردند. چیزهای زیادی وجود دارد که دوست داریم، اما چند مورد را از دست می دهیم.", "summary_fa": "این نویسنده و خانواده اش امسال به ساحل طلایی نقل مکان کردند. با اجازه ملیسا نوبل خانواده پنج نفره من در اوایل سال جاری از یک شهر کوچک روستایی به شهری نقل مکان کردند. من می‌خواستم زمان بیشتری را با والدینم بگذرانم، و عشق زیادی در مورد شهر وجود دارد. با این حال، دلم برای سرعت آهسته تر زندگی و اجتماع نزدیک تنگ شده است. من همیشه یک موش شهری بوده‌ام، بنابراین وقتی تصمیم گرفتیم در سال 2021 از ملبورن، استرالیا به برایت در کشور ویکتوریا نقل مکان کنیم، مطمئن نبودم چقدر دوام خواهم داشت. خانواده ما در نهایت عاشق روند کندتر زندگی و مردم شدند و چهار سال را در شهر کوچک کوهستانی در دامنه کوه‌های آلپ ویکتوریایی گذراندند. اما در ژانویه، ما از برایت به ساحل طلایی نقل مکان کردیم، جایی که من بزرگ شدم. سلامت پدر و مادرم رو به زوال بود و من می خواستم قبل از اینکه خیلی دیر شود با آنها وقت بگذرانم. نقل مکان از یک شهر کوچک منطقه ای با کمتر از 3000 نفر به شهری با تقریبا 700000 نفر تغییر سبک زندگی عمیقی برای خانواده پنج نفره ما بود. باید دوستان جدیدی پیدا می‌کردیم، یاد می‌گرفتیم که چگونه دوباره در چراغ راهنمایی حرکت کنیم (شوخی!)، و به زندگی پرهیاهوی شهری عادت کنیم. به طور کلی، ما از نقل مکان به شهر چیزهای زیادی به دست آورده‌ایم، و من احساس می‌کنم که این امر به ویژه برای فرزندانمان مفید بوده است، زیرا به ایجاد انعطاف‌پذیری کمک کرده است. اما اگر صادقانه بگویم قطعا چیزهایی در مورد زندگی روستایی وجود دارد که دلم برایشان تنگ شده است. زندگی مملو از معاوضه است و ما قطعاً چند معامله را انجام داده ایم. ما راحتی و دسترسی را به دست آورده‌ایم در کشور ویکتوریا، نزدیک‌ترین خرده‌فروش بزرگ ما یک ساعت با ماشین فاصله داشت. اگر"}, {"source": "Business Insider", "title": "My child may never earn a perfect attendance award. I'm fine with that.", "link": "https://www.businessinsider.com/parenting-hot-take-perfect-attendance-awards-need-to-go-unfair-2026-10", "summary": "The author said her child (not shown) probably won t ever get a certificate for perfect attendance, and she doesn t think anyone should. FatCamera/Getty Images Sometimes I have to take my child out of school for healthcare appointments. Perfect attendance can depend on health, access to care, and whether a parent can leave work. I'd rather schools reward kids for showing up after hard times than for perfect attendance. Whenever I schedule an appointment during the school day, I feel guilty. I ask for their latest available appointment. If that doesn't work, I pull up the school calendar . Then I start doing the ridiculous parent math: How long is the drive? What class will my child miss? Can I get them back before the final bell? Is there some magical way to make a 10:30 appointment happen without blowing up half the school day? Usually, there isn't. So I take the appointment. I'm a mother in rural North Carolina . Healthcare providers aren't always five minutes down the road, and appointments that fit perfectly between school dismissal and dinner aren't exactly falling from the sky. Sometimes the appointment you need is at 10:30 a.m. on a Tuesday. And sometimes you take it. I still feel guilty about it almost every time. I want my child in school. Of course I do. I know how quickly one missed class can turn into a missing assignment, which then becomes another assignment they don't understand because they missed the first one. But I also have to take care of my child. Sometimes those two responsibilities bump right into each other. And that's probably why perfect-attendance awards have always bothered me. My child is my priority I understand why schools care about attendance. Kids need to be in classrooms. They need instruction, routine, relationships with teachers and classmates , and all the little pieces of school that are hard to recreate at home. When a child is missing a lot of school, I absolutely think families should be supported in figuring out why and helping that child get back into a routine. Do you have a hot take on a common parenting belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. But perfect attendance is something different. An unbroken attendance record isn't necessarily a measure of how hard a child tried. Kids don't choose when they get the flu. They don't control when the specialist finally has an opening. They can't give their parents paid time off, fix the car when it ", "date_str": "2026-10-18T12:32:01+00:00", "hash": "0e5be134b0f96d81", "title_fa": "فرزند من ممکن است هرگز جایزه حضور کامل را کسب نکند. من با آن خوب هستم.", "summary_fa": "نویسنده گفت که فرزندش (نشان داده نشده) احتمالاً هرگز گواهی حضور کامل را دریافت نخواهد کرد و فکر نمی‌کند کسی این کار را کند. FatCamera/Getty Images گاهی اوقات مجبور می شوم فرزندم را برای قرار ملاقات مراقبت های بهداشتی از مدرسه خارج کنم. حضور بی نقص می تواند به سلامتی، دسترسی به مراقبت و اینکه والدین می توانند کار را ترک کنند بستگی دارد. من ترجیح می‌دهم مدارس به بچه‌ها برای حضور بعد از روزهای سخت جایزه بدهند تا برای حضور کامل. هر وقت در طول روز مدرسه قرار ملاقات بگذارم، احساس گناه می کنم. من برای آخرین قرار در دسترس آنها درخواست می کنم. اگر کار نکرد، تقویم مدرسه را بالا می کشم. سپس شروع به انجام ریاضیات مضحک والدین می کنم: مدت زمان رانندگی چقدر است؟ فرزند من چه کلاسی را از دست خواهد داد؟ آیا می توانم آنها را قبل از زنگ پایانی برگردانم؟ آیا روشی جادویی وجود دارد که بتوان یک قرار ساعت 10:30 را بدون وقفه در نیمی از روز مدرسه انجام داد؟ معمولا، وجود ندارد. بنابراین من قرار ملاقات را می پذیرم. من یک مادر در روستایی کارولینای شمالی هستم. ارائه دهندگان مراقبت های بهداشتی همیشه پنج دقیقه در راه نیستند، و قرار ملاقات هایی که کاملاً بین اخراج از مدرسه و شام تناسب دارد، دقیقاً از آسمان نمی افتد. گاهی اوقات قراری که نیاز دارید ساعت 10:30 صبح روز سه شنبه است. و گاهی آن را می گیرید. تقریباً هر بار هنوز در مورد آن احساس گناه می کنم. من بچه ام را در مدرسه می خواهم. البته من دارم. من می دانم که یک کلاس از دست رفته چقدر سریع می تواند به یک تکلیف از دست رفته تبدیل شود، که بعداً به تکلیف دیگری تبدیل می شود که آنها متوجه نمی شوند زیرا آنها اولین را از دست داده اند. اما"}, {"source": "Business Insider", "title": "I thought I loved being a minimalist. Then, my family moved from a 500-square-foot apartment to a 1,700-square-foot house.", "link": "https://www.businessinsider.com/moved-from-tiny-apartment-to-house-never-go-back-surprises-2026-10", "summary": "I loved living in a 500-square-foot apartment with my family, but moving to a bigger home changed my perspective. Courtesy of Alona Vasylieva I enjoyed living in a small, one-bedroom apartment with my family of three for years. Once we moved to a house more than triple the size, I totally changed my minimalist mindset. Now that we live in a bigger space, I can't imagine going back to living small or minimally. When my husband and I bought our apartment in Kyiv back in 2017, we were thrilled to finally have a family nest of our own. It was a cozy, 500-square-foot place with one bedroom, and we meticulously planned to optimize every inch of it. Our kitchen table doubled as my workspace, and our living room couch became the guest bed whenever family stayed over. Hosting required pure creative problem-solving and, with limited seating around our small table, I'd sometimes feed guests in shifts. It was chaotic at times, but I didn't mind. After our son was born, bright plastic toys, endless boxes of diapers, and bulky baby gear started claiming every free corner of our apartment. With the three of us packed into a single bedroom, finding space was a daily puzzle, but we made it work. Surprisingly, living so close together didn't feel limited back then — it felt intimate, cozy, and deeply fulfilling. Then COVID-19 hit. Spending so much time indoors made me feel isolated, and for the first time, I began dreaming about more living space. But we barely had time to figure things out before life took a drastic turn: When the war in Ukraine escalated in 2022, we made the heavy, life-changing decision to relocate to Canada . A few months after moving, we began renting a two-bedroom house, where we currently reside. At 1,700 square feet, it wasn't considered especially large by local standards, but to us, it felt vast. It didn't take long to adjust to having more space — and to quickly fill it up It s been nice having room for the gadgets and tools we ve wanted to buy. Courtesy of Alona Vasylieva At first, our house seemed almost too large for just three people. For the first time, we had two bedrooms and a basement, which instantly doubled our usable space at a ground level. After years of apartment living, though, the sheer thought of having so much space to keep clean felt exhausting. However, it didn't take long to change my mind. It turns out that when both you and your belongings finally have room to breathe — and you've got a trusty robot vacuum doing the heavy l", "date_str": "2026-10-18T12:18:01+00:00", "hash": "b5da9c16e16dbc9b", "title_fa": "فکر می کردم دوست دارم یک مینیمالیست باشم. سپس خانواده ام از یک آپارتمان 500 فوتی به خانه ای 1700 فوتی نقل مکان کردند.", "summary_fa": "من عاشق زندگی در یک آپارتمان 500 فوت مربعی با خانواده ام بودم، اما نقل مکان به یک خانه بزرگتر دیدگاه من را تغییر داد. با حسن نیت از آلونا واسیلیوا من سال ها از زندگی در یک آپارتمان کوچک و یک خوابه با خانواده سه نفره ام لذت بردم. زمانی که به خانه‌ای با ابعاد بیش از سه برابر نقل مکان کردیم، ذهنیت مینیمالیستی خود را کاملاً تغییر دادم. اکنون که در فضای بزرگتری زندگی می کنیم، نمی توانم تصور کنم که به زندگی کوچک یا مینیمال برگردم. هنگامی که من و شوهرم در سال 2017 آپارتمان خود را در کیف خریدیم، از اینکه بالاخره یک لانه خانوادگی برای خودمان داشته باشیم، هیجان زده شدیم. این یک مکان دنج با مساحت 500 فوت مربع با یک اتاق خواب بود و ما با دقت برنامه ریزی کردیم تا هر اینچ از آن را بهینه کنیم. میز آشپزخانه ما به عنوان فضای کار من دو برابر می شد و کاناپه اتاق نشیمن ما هر زمان که خانواده می ماندند، تخت مهمان می شد. میزبانی نیاز به حل مسائل خلاقانه داشت و با تعداد محدودی از صندلی‌های دور میز کوچکمان، گاهی اوقات به مهمانان در شیفت غذا می‌دادم. گاهی اوقات آشفته بود، اما من اهمیتی نمی‌دادم. پس از به دنیا آمدن پسرمان، اسباب‌بازی‌های پلاستیکی روشن، جعبه‌های بی‌پایان پوشک، و وسایل بزرگ بچه شروع به تسخیر هر گوشه آپارتمان ما کردند. وقتی ما سه نفر در یک اتاق خواب یک نفره جمع شده بودیم، پیدا کردن فضا یک معمای روزانه بود، اما ما آن را به کار انداختیم. با کمال تعجب، زندگی بسیار نزدیک با هم در آن زمان محدود به نظر نمی رسید - احساسی صمیمی، راحت و عمیقاً رضایت بخش بود. سپس COVID-19 ضربه خورد. گذراندن زمان زیادی در داخل خانه باعث شد احساس انزوا کنم و برای اولین بار، شروع"}, {"source": "Business Insider", "title": "I took my first Disney cruise without kids and loved it. There are 3 things I'd do differently next time.", "link": "https://www.businessinsider.com/disney-cruise-without-kids-adults-only-experience-2026-10", "summary": "The author took her first cruise trip on the Disney Wish. Courtesy of the author My friend and I have 7 kids between us, including 3 sets of twins. We took a Disney cruise alone. I loved the adults-only spaces, trivia games, spa treatments, and relaxing on Disney's private island. I'm already planning another Disney cruise with my kids, though I might prefer going without them. \"You've never been on a cruise?\" my friend basically yelled at me while we were planning an adults-only trip away from our kids. She insisted that cruising with her grandparents as an adult was one of the best trips she's ever taken. So, despite being a little terrified of being aboard essentially a floating skyscraper with thousands of people, I agreed to a Disney cruise for just the two of us. Honestly, it was so much fun that I'm already planning another Disney cruise with my kids — though I'm not sure I want to give up the adults-only version . It was such an easy getaway My family is known for taking really elaborate vacations. One time we stayed on a remote island near Sicily, which is an active volcano. It took us three flights and a long ferry ride to get there, but it was totally worth it to see the lava at night. This trip was different. We took a flight from Boston to Orlando, boarded the Disney Wish , and after that, we didn't have to think about anything. We have seven kids between the two of us (including three sets of twins), and the ease of the Disney cruise was exactly what we both needed. There were activities nonstop , and you could join any of them at any point. I took a quick class to learn how to draw Ursula, we participated in so many trivia games with other adults, and stopped to take photos with characters — who are all over the boat all the time — to send home to our kids. I really liked that almost everything was included Part of its ease was that most everything was included, so there were few extra costs. For example, all meals at the themed restaurants were part of the package, and we could order as many dishes as we wanted. Non-alcoholic beverages are also included, and you get room service 24/7. I especially liked the buffet-style meals at Marceline Market because I could mix in some healthy options (there were plenty) with some of my faves, like the fried hash browns for lunch or the Mickey-shaped churro waffles (which were highly recommended by the whole staff). The author really enjoyed the dirty martini for $14. Courtesy of the author Of course, t", "date_str": "2026-10-18T12:11:01+00:00", "hash": "e933af135048f168", "title_fa": "من اولین سفر دریایی خود در دیزنی را بدون بچه انجام دادم و آن را دوست داشتم. 3 کار وجود دارد که دفعه بعد متفاوت انجام می دهم.", "summary_fa": "نویسنده اولین سفر کروز خود را در Disney Wish انجام داد. با حسن نیت از نویسنده من و دوستم 7 فرزند بین خود داریم، از جمله 3 مجموعه دوقلو. ما به تنهایی با کشتی کروز دیزنی رفتیم. من عاشق فضاهای مخصوص بزرگسالان، بازی های بی اهمیت، درمان های اسپا و استراحت در جزیره خصوصی دیزنی بودم. من از قبل با بچه‌هایم سفر دریایی دیگری با دیزنی برنامه‌ریزی می‌کنم، اگرچه ممکن است ترجیح بدهم بدون آنها بروم. \"شما هرگز در سفر دریایی نبوده اید؟\" دوست من اساساً در حالی که ما در حال برنامه ریزی سفری برای بزرگسالان دور از بچه هایمان بودیم سر من فریاد زد. او اصرار داشت که سفر دریایی با پدربزرگ و مادربزرگش در بزرگسالی یکی از بهترین سفرهایی است که او تا به حال داشته است. بنابراین، علیرغم اینکه از حضور در یک آسمان‌خراش شناور با هزاران نفر کمی وحشت داشتم، با سفر دریایی دیزنی فقط برای ما دو نفر موافقت کردم. راستش را بخواهید، آنقدر سرگرم کننده بود که من در حال برنامه ریزی سفر دریایی دیگری با دیزنی با بچه هایم هستم - هرچند مطمئن نیستم که بخواهم نسخه مخصوص بزرگسالان را رها کنم. این یک فرار آسان بود خانواده من به داشتن تعطیلات بسیار پیچیده معروف هستند. یک بار در جزیره ای دورافتاده در نزدیکی سیسیل، که یک آتشفشان فعال است، ماندیم. سه پرواز و یک قایق طولانی برای رسیدن به آنجا طول کشید، اما دیدن گدازه های شبانه کاملاً ارزشش را داشت. این سفر متفاوت بود. ما یک پرواز از بوستون به اورلاندو گرفتیم، سوار Disney Wish شدیم و بعد از آن دیگر لازم نبود به چیزی فکر کنیم. ما بین دو نفری ما هفت بچه داریم (از جمله سه مجموعه دوقلو)، و راحتی سفر دریایی دیزنی دقیقاً همان چیزی بود که هر دوی ما به آن نیاز داشتیم. فعالیت‌هایی بی‌وقفه وجود"}, {"source": "Business Insider", "title": "Being the fun aunt is easy. Becoming an aunt they confide in and connect with takes more.", "link": "https://www.businessinsider.com/fun-aunt-how-to-build-strong-bond-with-niece-nephew-2026-10", "summary": "The author (left) plans one-on-one outings with her nieces and nephew. Here she s seen enjoying Wollman Rink with one of her nieces. Courtesy of Emily Cappiello. Of course I'm a fun aunt, but I've figured out a way to be so much more to my nieces and nephew. Spending meaningful one-on-one time with each of them has deepened our relationships. My \"Auntie Emily Days\" let each child enjoy personalized adventures based on their unique interests. You know those TikToks about the childless, traveling aunt ? The one who's somehow always at an airport, has a suspicious amount of money, occasionally shows up with gifts she definitely didn't need to buy (while carrying yet another new designer purse ), and is never quite sure what time zone she's in? Yep, that's me. For years, I happily embraced the stereotype . I'd swoop in for birthdays and holidays, always say yes to dessert (and extra dessert), create a little chaos, then head back to my own wonderfully independent life. I assumed I understood the assignment. Bring the snacks. Buy the birthday presents . Show up to holidays with something fun tucked under my arm. Be loud, be silly, make them laugh, then hand them back to their parents when the day was over. It was the best kind of job. I got all the joy without much of the responsibility. Or so I thought. The author now has Auntie Emily Days to spend uninterrupted time with each of her nieces and nephew. Courtesy of Emily Cappiello. As my nieces and nephew got older, I realized something that surprised me: I wasn't really getting to know them as they were maturing into their own people. I had to ask their moms what they wanted for birthdays, or worse, I just bought out the toy section at Target and hoped something would stick. I also didn't know who they were when they didn't have to compete for attention or weren't trying to impress me with the farthest throw, the coolest dive into the pool, or the biggest burp. That's when \"Auntie Emily Days\" were born. Their day reflects their personality Rather than trying to squeeze meaningful time into crowded family gatherings, I started planning one-on-one adventures with each child — all seven of them. Before we get together, they give me a guideline of what they want to do, and then I execute. Sometimes it's easy; dinner at The Melting Pot and a few hours spent at a cat café. Sometimes it's a bit more complicated with a sleepover at the Freehand (it has bunk beds!) and sightseeing in New York City. The author said she ", "date_str": "2026-10-18T12:02:01+00:00", "hash": "c7c0df88a51ab246", "title_fa": "خاله سرگرم کننده بودن آسان است. تبدیل شدن به عمه ای که آنها به او اعتماد می کنند و با آن ارتباط برقرار می کنند بیشتر طول می کشد.", "summary_fa": "نویسنده (سمت چپ) با خواهرزاده‌ها و برادرزاده‌اش برنامه‌ریزی می‌کند. در اینجا او در حال لذت بردن از Wollman Rink با یکی از خواهرزاده هایش دیده می شود. با حسن نیت از امیلی کاپیلو. البته من خاله سرگرم کننده ای هستم، اما راهی پیدا کرده ام که بتوانم خیلی بیشتر با خواهرزاده و برادرزاده ام رفتار کنم. گذراندن زمان معنادار یک به یک با هر یک از آنها روابط ما را عمیق تر کرده است. \"روزهای خاله امیلی\" من به هر کودک اجازه می دهد از ماجراجویی های شخصی بر اساس علایق منحصر به فرد خود لذت ببرد. آیا آن TikToks را در مورد عمه بدون فرزند و مسافر می شناسید؟ کسی که همیشه در فرودگاه است، مقداری پول مشکوک دارد، گهگاه با هدایایی که قطعاً نیازی به خرید آن نداشت ظاهر می‌شود (در حالی که کیف یک طراح جدید دیگری به همراه دارد)، و هرگز کاملاً مطمئن نیست که در چه منطقه زمانی است؟ بله، من هستم. سال‌ها، من با خوشحالی این کلیشه را پذیرفتم. من برای تولدها و تعطیلات می‌رفتم، همیشه به دسر (و دسر اضافی) بله می‌گفتم، کمی آشوب ایجاد می‌کردم، سپس به زندگی مستقل و شگفت‌انگیز خودم برمی‌گشتم. من فرض کردم که تکلیف را درک کرده ام. تنقلات را بیاورید. کادو تولد بخر در تعطیلات با چیزی سرگرم کننده در زیر بغلم حاضر شو. بلند بلند باشید، احمق باشید، آنها را بخندانید، سپس وقتی روز تمام شد آنها را به والدینشان برگردانید. این بهترین نوع کار بود. من تمام شادی را بدون مسئولیت زیاد به دست آوردم. یا اینطور فکر می کردم. نویسنده اکنون عمه امیلی دیز را دارد تا زمان بی وقفه ای را با خواهرزاده ها و برادرزاده هایش بگذراند. با حسن نیت از امیلی کاپیلو. وقتی خواهرزاده‌ها و برادرزاده‌هایم بزرگ‌تر شدند، متوجه چیزی شدم که مرا شگفت‌زده کرد: من واقعاً آنها را نمی‌شناختم، زیرا"}, {"source": "Business Insider", "title": "I'm a 31-year-old Canadian who bought an $11,000 house in rural Japan. Here's why I don't see it as an investment.", "link": "https://www.businessinsider.com/buy-cheap-house-rural-japan-wont-make-money-short-term-rentals-2026-10", "summary": "Canadian Andrew Koller bought a home in Japan. Courtesy of Andrew Koller Andrew Koller owns property in Canada, but decided to buy a home in Japan after visiting. Koller spent $15,000 CAD on an akiya and spent months renovating it. He plans to visit on occasion and rent it out some of the time. This as-told-to essay is based on a conversation with Andrew Koller, 31, a freelance camera operator who purchased a home in Yamagata, Japan, in March. Koller, who's based in Edmonton, Canada, renovated the home and plans to use it as a vacation home. The following has been edited for length and clarity. Like a lot of millennials, I was exposed to Japanese culture in some sense early on with \"Naruto,\" \"Pokemon,\" and \"Dragon Ball Z.\" After that, I don't think my interest really left. Come 2020, I had a bunch of time on my hands like everybody else. It seemed like a good time to finally learn Japanese. I've been learning Japanese with a private tutor since then. Then, in 2023, I made my first trip to Japan. Like everybody else who comes back from their first trip to Japan , I just fell in love. I couldn't stop talking about it, but I wanted a deeper connection to the community. Koller s home in Yamagata, Japan. Courtesy of Andrew Koller I wanted more than just the superficial, surface-level experience of Japanese life. So I thought maybe a good way to get that experience would be to buy a house that's not in a major tourist city , somewhat live there, and spend a good chunk of time over there getting involved with the community by renovating a forgotten property . The algorithm was watching for sure. After my first Japan trip, my YouTube and Instagram algorithms were suggesting to me all these similar people doing similar things. From that, I was like, this seems like something I can do. In my free time, I like to DIY. I have a little workshop — I wouldn't say I'm good at it, but I feel like I know enough to do the basics. I'm at the point in my life now where I've had all these ideas and I've said, \"Oh, it'd be cool to do this,\" but I never do it. I never follow through. I just wanted to prove to myself that I actually followed through on one of these somewhat whimsical ideas. The house I bought in Japan cost a fraction of what houses cost in Canada I've always been interested in real estate since a young age. Purchasing your first house is doable, but if you want to purchase a second house after that, like a rental, it's extremely challenging to do that in Canada. C", "date_str": "2026-10-18T11:56:01+00:00", "hash": "ec96d49452b0dd9d", "title_fa": "من یک کانادایی 31 ساله هستم که یک خانه 11000 دلاری در روستاهای ژاپن خریدم. به همین دلیل است که من آن را به عنوان یک سرمایه گذاری نمی بینم.", "summary_fa": "اندرو کولر کانادایی خانه ای در ژاپن خرید. با حسن نیت از اندرو کولر اندرو کولر دارای ملک در کانادا است، اما پس از بازدید تصمیم به خرید خانه در ژاپن گرفت. کولر 15000 دلار کانادا برای خرید یک اکیا هزینه کرد و ماه ها صرف بازسازی آن کرد. او قصد دارد به مناسبت‌های مختلف به آن سر بزند و برخی اوقات آن را اجاره کند. این مقاله گفته شده بر اساس گفتگو با اندرو کولر، 31 ساله، یک اپراتور مستقل دوربین است که در ماه مارس خانه ای را در یاماگاتا، ژاپن خریداری کرد. کولر، که در ادمونتون، کانادا مستقر است، خانه را بازسازی کرد و قصد دارد از آن به عنوان یک خانه برای تعطیلات استفاده کند. موارد زیر برای طول و وضوح ویرایش شده است. مانند بسیاری از هزاره ها، من در اوایل با «ناروتو»، «پوکمون» و «دراگون بال زد» با فرهنگ ژاپنی آشنا شدم. بعد از آن، فکر نمی کنم علاقه من واقعاً از بین رفت. در سال 2020، من هم مثل بقیه وقت زیادی در اختیار داشتم. به نظر می رسد زمان خوبی برای یادگیری زبان ژاپنی است. من از آن زمان با یک معلم خصوصی ژاپنی را یاد می گیرم. سپس در سال 2023 اولین سفرم را به ژاپن انجام دادم. من هم مثل هر کس دیگری که از اولین سفر خود به ژاپن برگشته است، عاشق شدم. من نمی توانستم در مورد آن صحبت نکنم، اما می خواستم ارتباط عمیق تری با جامعه داشته باشم. خانه کولر در یاماگاتا، ژاپن. با حسن نیت از اندرو کولر من چیزی بیش از تجربه سطحی و سطحی زندگی ژاپنی می خواستم. بنابراین فکر کردم شاید یک راه خوب برای به دست آوردن آن تجربه این باشد که خانه‌ای بخرم که در یک شهر توریستی بزرگ نیست، تا حدودی در آنجا زندگی کنم، و زمان زیادی را"}, {"source": "Business Insider", "title": "Ukraine's drone pilots want simple attack drones in large numbers. A soldier says Western designs are often overcomplicated.", "link": "https://www.businessinsider.com/ukraine-pilots-want-masses-of-basic-drones-but-west-overcomplicates-2026-10", "summary": "Ukraine s drone operators want drones that they can send en masse and tailor to their own needs. Kostiantyn Liberov/Libkos/Getty Images Ukraine's drone pilots want masses of cheap, simple drones, a soldier and analyst said. Western manufacturers overcomplicate them and \"get it so wrong,\" he added. Operators want drones they can tweak near the front and send out in large numbers. Ukrainian drone operators need masses of relatively simple drones without a bunch of flashy features, a soldier with firsthand experience explained, cautioning the West against making them too complicated as it readies for future drone fights. Ukraine's fight against Russia's invasion is a grinding war of attrition that is consuming weaponry so fast that combatants need affordable weapons in huge numbers, and battlefield technology becomes obsolete so quickly that soldiers need systems they can update easily to keep them relevant in battle. Dmytro \"Liber\" Zhluktenko, a former drone operator who is now a lessons learned analyst in Ukraine's 413th Unmanned Systems Regiment \"RAID,\" told Business Insider that \"we need something that works great but doesn't have superfluous features.\" \"That is something that most of the Western defense technology manufacturers, they get it so wrong,\" he said. Consider first-person-view attack drones, \"we need something that is really basic.\" \"We are yet to find Western manufacturers that are able to produce, let's say 500,000 FPV drones, simple ones that just work, that are fine-tuned without any extra autonomy or extra navigation or any features like that,\" he added, describing what Ukraine needs most as something pilots can easily take straight into combat. Ukrainian drone companies work closely with operators and units to learn what they want and need. Paula Bronstein/Getty Images Western-made drone tech, he said, is often \"too complicated, often detached from the battlefield, and much more expensive than Ukrainian options doing the same job. Therefore, most of the drones used at Ukraine's battlefield are Ukrainian-made.\" His assessment of the situations draws on both his experience as a drone operator and his role as an analyst, where he looks at battlefield trends, interviews operators, meets with foreign defense manufacturers, prepares briefs for higher command, and organizes the sharing of information between Ukrainian units. Simple drones give soldiers more flexibility Part of the appeal of simpler drones is that Ukrainian operators can adapt th", "date_str": "2026-10-18T11:54:01+00:00", "hash": "e85a8f97fe044173", "title_fa": "خلبانان پهپاد اوکراینی هواپیماهای بدون سرنشین تهاجمی ساده را به تعداد زیاد می خواهند. یک سرباز می گوید طرح های غربی اغلب بیش از حد پیچیده هستند.", "summary_fa": "اپراتورهای هواپیماهای بدون سرنشین اوکراین پهپادی می خواهند که بتوانند به صورت انبوه ارسال کنند و مطابق با نیازهای خود طراحی کنند. یک سرباز و تحلیلگر گفت که خلبانان پهپاد اوکراینی انبوهی از هواپیماهای بدون سرنشین ارزان و ساده را می خواهند. او افزود که تولیدکنندگان غربی آنها را بیش از حد پیچیده می کنند و \"این را بسیار اشتباه می کنند.\" اپراتورها هواپیماهای بدون سرنشینی را می خواهند که آنها بتوانند در نزدیکی جلو آن را تغییر دهند و به تعداد زیاد ارسال کنند. یک سرباز با تجربه دست اول توضیح داد که اپراتورهای هواپیماهای بدون سرنشین اوکراینی به انبوهی از هواپیماهای بدون سرنشین نسبتاً ساده بدون تعدادی ویژگی پر زرق و برق نیاز دارند و به غرب هشدار می دهد که آنها را بیش از حد پیچیده نکند زیرا برای نبردهای پهپادهای آینده آماده می شود. نبرد اوکراین در برابر تهاجم روسیه یک جنگ فرسایشی سخت است که تسلیحات را به قدری سریع مصرف می‌کند که جنگجویان به سلاح‌های مقرون‌به‌صرفه در تعداد زیادی نیاز دارند، و فناوری میدان نبرد آنقدر سریع منسوخ می‌شود که سربازان به سیستم‌هایی نیاز دارند که بتوانند به راحتی آن‌ها را به روز کنند تا آنها را در نبرد مرتبط نگه دارند. Dmytro \"Liber\" Zhluktenko، یک اپراتور سابق هواپیماهای بدون سرنشین که اکنون یک تحلیلگر آموخته شده در هنگ 413 سیستم های بدون سرنشین اوکراین \"RAID\" است، به Business Insider گفت که \"ما به چیزی نیاز داریم که عالی کار کند اما ویژگی های اضافی نداشته باشد.\" او گفت: «این چیزی است که اکثر تولیدکنندگان فن‌آوری دفاعی غربی آن را بسیار اشتباه می‌دانند.» پهپادهای تهاجمی دید اول شخص را در نظر بگیرید، \"ما به چیزی نیاز داریم که واقعاً اساسی باشد.\" او افزود: «ما هنوز سازندگان غربی را پیدا نکرده‌ایم که قادر به تولید مثلاً 500000 پهپاد FPV باشند، پهپادهای ساده‌ای که فقط کار"}, {"source": "Business Insider", "title": "I've never lied to my 10-year-old about death, Santa, or what's really in her dinner", "link": "https://www.businessinsider.com/parent-never-lies-to-daughter-honest-parenting-2026-10", "summary": "The author hasn t lied to her daughter, even about Santa. Courtesy of the author I've made it nearly 10 years into motherhood without telling my daughter a lie. I don't believe in white lies, even when telling the truth makes parenting harder. I think being honest has helped my daughter trust me and brought us closer together. From where I stand, it seems like most parents lie to their kids , at least once in a while. I am of the mindset that lying , whether to adults or to children, is wrong. Because I view it this way, I am uncomfortable with it and refuse to do it. My husband respects my stance, though he doesn't always follow suit and has told our child a handful of lies. But in the past decade since I became a mom, I have managed to avoid it. I don't think I'm better than other parents, and I don't think anyone else is bad for harmless untruths . I just knew going into this that I wanted to approach parenting differently in a lot of ways, and this is just one of them. Not lying doesn't equal to sharing every detail This doesn't mean I divulge every secret. Kids don't need to know every detail about everything, even when they ask questions. I was rather vague when she wondered why one of our relatives split up with her husband less than a year after the marriage, for example: \"He did something really bad, and it hurt her a lot. She's not able to forgive him,\" I said, that was the end of the conversation. The author s daughter asked her if Santa was real. Courtesy of the author I believe it is OK to keep some things a mystery indefinitely, to delay certain conversations or, when choosing to reveal things, to do so in an age-appropriate way (for example, where do babies come from?). But as far as not speaking any falsehoods , I have been consistent. She asked me if Santa was real I didn't tell her that Santa existed , but of course, as a toddler, she started believing through other friends, family, and Christmas marketing. I thought it was lovely and let her believe. Why spoil her fun? But when she was a little older and asked me point blank if Santa was real, I replied in a curious tone \"Hmmm, what do you think?\" and instead it turned a situation where she started wondering aloud and trying to reason whether it was possible. I listened in the car, nodding along in the parent drop-off line at school. I also told her that a lot of people — including kids in her class — do believe in Santa, so it wouldn't be nice for their parents if she expressed her doub", "date_str": "2026-10-18T11:27:01+00:00", "hash": "9697b0c9d9d880a2", "title_fa": "من هرگز به کودک 10 ساله ام در مورد مرگ، بابانوئل یا آنچه واقعاً در شام او است دروغ نگفته ام.", "summary_fa": "نویسنده حتی در مورد بابانوئل به دخترش دروغ نگفته است. با حسن نیت از نویسنده، من تقریباً 10 سال است که بدون اینکه به دخترم دروغ بگویم، مادر شدم. من به دروغ های سفید اعتقاد ندارم، حتی زمانی که گفتن حقیقت، والدین را سخت تر می کند. فکر می‌کنم صادق بودن به دخترم کمک کرده به من اعتماد کند و ما را به هم نزدیک‌تر کند. از جایی که من ایستاده ام، به نظر می رسد که اکثر والدین حداقل هر چند وقت یک بار به فرزندان خود دروغ می گویند. من بر این عقیده هستم که دروغ گفتن، چه برای بزرگسالان و چه به کودکان، اشتباه است. از آنجا که من اینگونه به آن نگاه می کنم، با آن ناراحت هستم و از انجام آن امتناع می کنم. شوهرم به موضع من احترام می‌گذارد، اگرچه همیشه از آن پیروی نمی‌کند و به فرزندمان یک مشت دروغ گفته است. اما در دهه گذشته از زمانی که مادر شدم، توانستم از آن اجتناب کنم. فکر نمی‌کنم بهتر از سایر والدین باشم، و فکر نمی‌کنم هیچ کس دیگری برای دروغ‌های بی‌ضرر بد باشد. من فقط می‌دانستم که وارد این موضوع می‌شوم که می‌خواهم از بسیاری جهات به شیوه‌ای متفاوت با فرزندپروری برخورد کنم، و این تنها یکی از آنهاست. دروغ نگفتن مساوی با به اشتراک گذاشتن تمام جزئیات نیست این بدان معنا نیست که من همه رازها را فاش می کنم. بچه ها نیازی ندارند که همه جزئیات را بدانند، حتی وقتی سؤال می کنند. وقتی او فکر کرد که چرا یکی از اقوام ما از شوهرش کمتر از یک سال پس از ازدواج مثلاً جدا شد، من نسبتاً مبهم بودم: \"او واقعاً کار بدی انجام داد و او را خیلی آزار داد. او نمی تواند او را ببخشد\" ، گفتم این صحبت پایان یافت. دختر نویسنده از او پرسید که آیا"}, {"source": "Business Insider", "title": "Quince jacket review: 12 coats that have kept our style editors warm season after season", "link": "https://www.businessinsider.com/guides/style/quince-jackets-coats-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Our favorites from Quince range from insulating puffers to wool dress coats and leather jackets. Gabrielle Chase, Sally Kaplan, Amir Ismael/Business Insider I live in a climate with four seasons, and for every one I have a Quince jacket I wear on repeat. While it's fall in New England, I'm in my leather bomber jacket to stay protected from the damp chill coming off the water. Last winter, I kept warm without spending on a $275 on a SuperPuff all because I had the Quince lookalike (which costs $150 and functions just the same). My main takeaway: The best Quince jackets are its Responsible Down Puffer , Wool Slouch Coat , and Oversized Leather Bomber Jacket . Stick with darker colors or distressed variations — the lighter ones tend to look flat in person. I ask a lot of my outerwear, and the only Quince jacket that didn't impress me was its Wool Scarf Coat. I've gotten a ton of use from every other Quince jacket I own because the designs are timeless. Plus, I've spent over three years learning the ins and outs of Quince sizing , so I can spot the brand's weak points. So, are Quince jackets good quality? To answer this, our team has written detailed reviews on every Quince jacket we own, with honest takes on each coat's quality, warmth, and aesthetic appeal. Learn more on how the Reviews team tests clothing at BI. Quince Responsible Down Puffer Jacket Sally Kaplan, Gabrielle Chase/Business Insider This wind-resistant and water-repellent Quince Puffer is insulated with 700+ fill power and has kept me warm single-digit temperatures. I wore it through back-to-back blizzards this last winter and it was effective at blocking icy winds and sleet from coming in. Outdoor gear expert Rachael Schultz elaborates in our guide to the best winter coats for women : \"The outer shell is wind-resistant and treated with a PFC-free, DWR water-repellent finish to keep snow out. It also has a bungee hem when you need to better trap body heat,\" she says. \"The Quince Puffer looks a lot like the Aritzia Super Puff with the same removable hood, thumbhole wrist cuffs, and extra pockets,\" she continues. \"The Aritzia Super Puff is slightly warmer (though our executive editor, Sally Kaplan, didn't feel a big difference here during testing) and comes in a lot more color options. But if you don't need either of those features, the Quince Puffer saves you a hundred bucks.\" The Quince Puffer Jacket a", "date_str": "2026-10-18T11:00:01+00:00", "hash": "2869f3a1eda8b244", "title_fa": "بررسی کت کوینیس: 12 کتی که فصل به فصل سردبیران استایل ما را گرم نگه داشته است", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید موارد دلخواه ما از Quince از پفک های عایق گرفته تا کت های پشمی و کت های چرمی است. گابریل چیس، سالی کاپلان، امیر اسماعیل/Business Insider من در آب و هوای چهار فصل زندگی می کنم و برای هر فصل یک ژاکت کوینیس دارم که تکرار می کنم. در حالی که در نیوانگلند پاییز است، من ژاکت بمب افکن چرمی خود را به تن دارم تا از سرمای مرطوبی که از آب خارج می شود محافظت کنم. زمستان گذشته، من بدون صرف 275 دلار برای SuperPuff گرم نگه داشتم، زیرا من شبیه به Quince (که 150 دلار قیمت دارد و عملکرد مشابهی دارد) داشتم. غذای اصلی من: بهترین ژاکت های کوینیس عبارتند از: پفک پر مسئولیت، کت پشمی و ژاکت بمب افکن چرم بزرگ. از رنگ‌های تیره‌تر یا تغییرات ناراحت‌کننده استفاده کنید - رنگ‌های روشن‌تر معمولاً صاف به نظر می‌رسند. من خیلی از لباس‌های بیرونی‌ام را می‌پرسم، و تنها ژاکت کوینسی که مرا تحت تأثیر قرار نداد، کت روسری پشمی آن بود. من از هر ژاکت کوینس دیگری که دارم استفاده زیادی کرده ام زیرا طرح ها بی انتها هستند. بعلاوه، من بیش از سه سال را صرف یادگیری نکات و نکات مربوط به اندازه‌گیری کوینس کرده‌ام، بنابراین می‌توانم نقاط ضعف برند را تشخیص دهم. بنابراین، آیا کت های کوینس کیفیت خوبی دارند؟ برای پاسخ به این، تیم ما بررسی‌های دقیقی را در مورد هر ژاکت کوئینس که داریم، نوشته است، با برداشتی صادقانه از کیفیت، گرما و جذابیت زیبایی هر کت. درباره نحوه آزمایش لباس‌ها در BI توسط تیم بررسی‌ها بیشتر بدانید. ژاکت پف دار Quince Responsible Down Sally Kaplan، Gabrielle Chase/Business Insider این پفک کوینس مقاوم در برابر باد و ضد آب با قدرت پرکنندگی +700 عایق شده است"}, {"source": "Business Insider", "title": "I thought working in AI would put me ahead of the curve. Two years in, I've never felt more behind and tired of the topic.", "link": "https://www.businessinsider.com/work-in-ai-burned-out-cant-keep-up-career-2026-10", "summary": "The author works in AI and is feeling burned out. Courtesy of Santiago Barraza Lopez I'm a lawyer who decided to work in AI to try to get ahead of this technological curve. Over the last two years, I've struggled to keep up because AI is advancing faster than I expected. I feel overwhelmed and burned out by the constant conversations around AI. For most of my career, I was a lawyer. There was something reassuring about how expertise worked in law. The longer I practiced, the more I knew. But after years in a demanding profession , I burned out. It wasn't that I stopped enjoying law. I just needed a change. Around two years ago, I started shifting my career toward AI because I thought it was the future. I didn't want to wake up 10 years later and realize technology had changed my profession without me. It seemed like the smartest career move I could make. Now, I'm not so sure. Joining the AI boom early seemed like the perfect career move I made the transition while the AI boom was still gaining momentum. Ironically, I landed a job at a legal tech company thanks to a conversation with ChatGPT . It seemed like the perfect opportunity to combine my experience with my growing interest in tech. My role involved testing the most advanced models, comparing their capabilities, and exploring how they could be used in legal work. I felt like I was ahead of a major change rather than trying to catch up with it. I also became the go-to person for anything AI-related among my family and friends. People would ask me which tools to use, whether AI would replace their jobs, or what I thought about the latest developments. I enjoyed being the person who seemed to understand something that everyone was suddenly talking about. But that feeling didn't last as long as I expected. Slowly, I began to realize that this wasn't just another new technology . It was something evolving at an almost frightening pace. And being close to it didn't necessarily mean being able to keep up with it. What initially felt like an advantage was gradually becoming a source of pressure. Things that took me weeks to learn or build became obsolete almost overnight New frontier AI models and companies seemed to arrive every few weeks, each promising capabilities that the previous lacked. Just as I began understanding one model, another would appear, forcing me to reconsider everything I thought I knew about what AI could and couldn't do. There was barely enough time to breathe before \"the next big thin", "date_str": "2026-10-18T10:47:01+00:00", "hash": "87e0c2cdb6f25c22", "title_fa": "فکر می‌کردم کار در هوش مصنوعی من را جلوتر از منحنی‌ها قرار می‌دهد. پس از دو سال، من هرگز بیشتر از این احساس عقب ماندن و خستگی از موضوع نداشتم.", "summary_fa": "نویسنده در هوش مصنوعی کار می کند و احساس می کند که خسته است. با حسن نیت از Santiago Barraza Lopez من وکیلی هستم که تصمیم گرفتم در AI کار کنم تا سعی کنم از این منحنی فناوری جلوتر باشم. در طول دو سال گذشته، من برای ادامه دادن تلاش کردم زیرا هوش مصنوعی سریعتر از آنچه انتظار داشتم پیشرفت می کند. من احساس می کنم از مکالمات مداوم پیرامون هوش مصنوعی خسته و خسته شده ام. بیشتر دوران حرفه ای ام وکیل بودم. در مورد چگونگی کارکرد تخصص در حقوق، چیزی اطمینان‌بخش وجود داشت. هر چه بیشتر تمرین می کردم، بیشتر می دانستم. اما پس از سال ها در یک حرفه سخت، من سوختم. این نبود که من از وکالت لذت نبردم. فقط نیاز به تغییر داشتم حدود دو سال پیش، من شروع به تغییر حرفه‌ام به سمت هوش مصنوعی کردم زیرا فکر می‌کردم این آینده است. من نمی خواستم 10 سال بعد از خواب بیدار شوم و بفهمم فناوری بدون من حرفه ام را تغییر داده است. به نظر هوشمندانه ترین حرکت شغلی من بود. حالا من خیلی مطمئن نیستم پیوستن به رونق هوش مصنوعی در اوایل به نظر می رسید حرکت شغلی مناسبی باشد که من این انتقال را انجام دادم در حالی که رونق هوش مصنوعی همچنان در حال افزایش بود. از قضا، به لطف گفتگو با ChatGPT، در یک شرکت فناوری قانونی شغلی پیدا کردم. به نظر می رسید این فرصت عالی برای ترکیب تجربیاتم با علاقه رو به رشدم به فناوری است. نقش من شامل آزمایش پیشرفته‌ترین مدل‌ها، مقایسه قابلیت‌های آنها و بررسی نحوه استفاده از آنها در کارهای قانونی بود. احساس می‌کردم به‌جای تلاش برای رسیدن به آن، از یک تغییر بزرگ جلوتر هستم. من همچنین در میان خانواده و دوستانم فردی مورد علاقه برای هر چیزی که مربوط به هوش مصنوعی بود"}, {"source": "Business Insider", "title": "Katie Zacharia and the real problem with workers embellishing their credentials", "link": "https://www.businessinsider.com/trump-press-secretary-zacharia-credentials-workers-2026-10", "summary": "Samuel Corum/Pool/FTWP This post originally appeared in the BI Today newsletter. You can sign up for Business Insider's daily newsletter here . The credibility concern When questions began swirling about new (and now former) White House press secretary Katie Zacharia's legal credentials , a colleague asked the obvious question: Why should anyone care? She was hired to be President Donald Trump's spokesperson, not his lawyer. Does it really matter if she overstated her qualifications? It does. She was let go on Friday , five days after starting the job. That's half the time Anthony Scaramucci infamously lasted as White House communications director during Trump's first term. Zacharia was widely panned for her performance during her first (and final) press briefing on Monday, as well as for misrepresenting herself as a lawyer. In workplaces, it turns out, bending the truth about one's background is not only problematic, but more common than you might think. And it can carry real consequences. BI's Sarah Needleman spoke with recruiters and found research suggesting that résumé inflation is very much a thing . A recent survey found 37% of respondents had included inaccurate information on a résumé, according to Novorésumé, an online résumé-building service. Nearly 7% said they claimed a degree, certification, or credential they didn't actually have. The trouble, of course, is that a small embellishment can raise much bigger questions. Brian Fink, a managing partner at tech recruiting firm The ReWork Group, told Sarah he rescinded an offer to someone after a background check couldn't verify certain information on the candidate's résumé and LinkedIn profile. \"If you're willing to lie about your education,\" Fink said, \"what else are you willing to lie about?\" Corporate America is full of cautionary tales. Over the years, executives at Samsonite , Walmart , and Yahoo , among others , misrepresented their backgrounds and ultimately lost their jobs as a result. Credentials matter. They are a promise of basic trust. Once that trust is called into question, it's really hard to win it back. Read the original article on Business Insider", "date_str": "2026-10-18T10:43:01+00:00", "hash": "578531120b08bb0c", "title_fa": "کتی زکریا و مشکل واقعی کارگرانی که مدارک خود را تزئین می کنند", "summary_fa": "Samuel Corum/Pool/FTWP این پست در اصل در خبرنامه BI Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. نگرانی در مورد اعتبار زمانی که سوالاتی در مورد اعتبار قانونی کیتی زاخاریا، سخنگوی مطبوعاتی جدید (و اکنون سابق) کاخ سفید شروع شد، یکی از همکاران این سوال واضح را پرسید: چرا کسی باید به آن اهمیت دهد؟ او به عنوان سخنگوی دونالد ترامپ رئیس جمهور آمریکا استخدام شد، نه وکیل او. آیا واقعاً اهمیتی دارد که او صلاحیت های خود را بیش از حد اعلام کند؟ این کار را انجام می دهد. او روز جمعه، پنج روز پس از شروع کار، مرخص شد. این نیمی از زمانی است که آنتونی اسکاراموچی به طور بدنام به عنوان مدیر ارتباطات کاخ سفید در دوره اول ریاست جمهوری ترامپ ادامه داد. زکریا به دلیل عملکرد خود در اولین (و آخرین) کنفرانس مطبوعاتی خود در روز دوشنبه و همچنین به دلیل ارائه نادرست از خود به عنوان یک وکیل به طور گسترده مورد انتقاد قرار گرفت. به نظر می رسد در محل کار، خم کردن حقیقت در مورد پیشینه فرد نه تنها مشکل ساز است، بلکه رایج تر از آن چیزی است که فکر می کنید. و می تواند عواقب واقعی داشته باشد. سارا نیدلمن از BI با استخدام کنندگان صحبت کرد و تحقیقاتی دریافت کرد که نشان می دهد تورم رزومه کاری بسیار مهم است. یک نظرسنجی اخیر نشان داد که 37 درصد از پاسخ دهندگان اطلاعات نادرستی را در یک رزومه درج کرده اند، به گفته Novorésumé، یک سرویس آنلاین رزومه سازی. نزدیک به 7 درصد گفتند که مدعی مدرک، گواهینامه یا مدرکی هستند که در واقع ندارند. البته مشکل این است که یک تزیین کوچک می تواند سوالات بسیار بزرگتری را ایجاد کند. برایان فینک، یک شریک مدیریتی در شرکت استخدام فناوری ReWork Group، به سارا"}, {"source": "Business Insider", "title": "How to watch the Texans vs. Jaguars: Channel, live streams, odds, and venue for the international NFL game", "link": "https://www.businessinsider.com/guides/streaming/how-to-watch-texans-vs-jaguars-nfl-2026-10", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more London will host today s Houston Texans vs. Jacksonville Jaguars game. Kenneth Richmond/G  روز ضمانت بازگشت پول) زمان: یکشنبه، 18 اکتبر، ساعت 9:30 صبح. ET / 2:30 بعد از"}, {"source": "Business Insider", "title": "They're spooky, sexy, slidey — and driving ticket sales at Hershey's amusement park", "link": "https://www.businessinsider.com/haunt-sliders-hersheypark-fryboy-archer-interview-2026-10", "summary": "The Decayed Brigade, a team of haunt sliders that appears at Hersheypark. Hersheypark Hersheypark's \"haunt sliders\" — scare actors who slide on knee pads — have gained a fanbase on TikTok. \"The makeup stays ON\" commented one thirsty fan. The attention has translated to good business for the park, who has seen growing ticket sales for its Dark Nights event. Imagine you're walking around an amusement park in October while it's Halloween themed. The air is crisp, you've got a giant pretzel, you're strolling with friends to get in line for the roller coaster. Out of the corner of your eye, you see tall man dressed in all black with skeletal face paint walking towards you. Suddenly, he leaps to the ground on all fours, and against everything you've known in your life about how human beings ambulate, he slides across the pavement on his hands and knees, coasting right up beside you at an incredible speed. Depending on who you are and your level of awareness of the \"haunt sliders\" of Hersheypark, this fast encounter leaves you either terrified or terrifyingly horny. @itzarcher PUMPKINN @thrillsandmagic @Hersheypark #fyp #darknights2025 #decayedbrigade #viral #itzarcher ♬ original sound - itzarcher Since 2021, Hershey's amusement park has employed a group of haunt sliders from a crew that calls itself the \"Decayed Brigade\" for its Dark Nights Halloween event that runs in September and October. Videos of Fryboy and his lookalike Archer, and others have racked up millions of views and created a dedicated fan base who travel from around the world just to see the creepy, sexy, slidey guys they saw on TikTok. And their online popularity is good for Hershey's bottom line. \"The comment section [on TikTok] is a treasure trove of insight into their popularity. I mean, we have seen people saying, 'I am coming from Europe. I'm coming from Australia. I had no idea Hersheypark existed, but now, because this was served to me on TikTok, I'm aware,'\" said Quinn Bryner, a spokesperson for Hersheypark. Archer, a haunt slider at Hersheypark Hersheypark \"We have people who have bought our season passes because of it,\" she added. \"So anecdotally, for sure, it has had a significant social commentary, which we think has also led to tickets.\" Bryner cautioned they can't say that the haunt sliders popularity is the sole driver of the growth of the Halloween event, but that the Dark Nights has become a success and grown year over year in attendance and ticket sales. \"We can confirm that th", "date_str": "2026-10-18T10:25:02+00:00", "hash": "a5c8352f93fcfe6f", "title_fa": "آنها ترسناک، سکسی، سرسره هستند - و فروش بلیط در پارک تفریحی Hershey's", "summary_fa": "The Decayed Brigade، تیمی از لغزنده های تسخیر شده که در Hersheypark ظاهر می شوند. Hersheypark «لغزنده‌های خالی از سکنه» Hersheypark - بازیگران ترسناکی که روی زانوبند سر می‌خورند - در TikTok طرفداران زیادی پیدا کرده‌اند. یکی از طرفداران تشنه اظهار داشت: \"آرایش روشن می ماند\". این توجه به تجارت خوبی برای پارک تبدیل شده است که شاهد فروش بلیط رو به رشد برای رویداد شب های تاریک خود بوده است. تصور کنید در ماه اکتبر در حال قدم زدن در یک شهربازی هستید در حالی که موضوع هالووین است. هوا صاف است، شما یک چوب شور غول پیکر دارید، با دوستان در حال قدم زدن هستید تا در صف ترن هوایی قرار بگیرید. از گوشه چشم خود مردی قد بلند را می بینید که لباس مشکی پوشیده و رنگ صورت اسکلتی دارد به سمت شما می رود. ناگهان، او چهار دست و پا به زمین می‌پرد، و در برابر همه چیزهایی که در زندگی‌تان درباره نحوه حرکت انسان‌ها می‌دانستید، روی سنگ‌فرش روی دست‌ها و زانوهایش می‌لغزد و با سرعتی باورنکردنی در کنار شما حرکت می‌کند. بسته به اینکه شما چه کسی هستید و سطح آگاهی شما از \"لغزنده های خالی از سکنه\" هرشی پارک، این برخورد سریع شما را یا وحشتناک می کند یا به طرز وحشتناکی شاخ در می آورد. @itzarcher PUMPKINN @thrillsandmagic @Hersheypark #fyp #darknights2025 #brigade decayed #ویروسی #itzarcher ♬ صدای اصلی - itzarcher از سال 2021، پارک تفریحی Hershey از گروهی از لغزنده های تسخیر شده از یک خدمه \"The Night Deight\" استفاده کرده است. رویداد هالووین که در ماه های سپتامبر و اکتبر برگزار می شود. ویدیوهای Fryboy و آرچر شبیه او و دیگران میلیون‌ها بازدید را جمع‌آوری کرده و یک پایگاه هواداران اختصاصی ایجاد کرده‌اند که از سراسر جهان سفر می‌کنند فقط برای دیدن مردان خزنده، سکسی و اسلایدی که در TikTok دیده‌اند. و"}, {"source": "Business Insider", "title": "My dad's death gave me a new perspective. I value experiences over money now.", "link": "https://www.businessinsider.com/dads-death-changed-perspective-work-life-money-2026-10", "summary": "When the author s dad died, she reevaluated her approach to work. Courtesy of Tayla Blaire I used to push myself at work, outearning myself year after year. When my dad died, and I heard how people talked about him, I reevaluated my approach. Now, I still make enough to cover what I need, but I'm living a fuller life. I'm a reformed workaholic. I'd love to say I slowly came to realize that my value isn't monetary or based on how high I can climb a ladder , but that epiphany wasn't achieved in a growth-centric way. Instead, it was a surprising side effect of losing my dad suddenly in September 2024. He was there, and just like that, he was gone. And my willingness to burn myself out died that day, too. In the flurry of administrative chaos and world-wrecking grief that follows sudden death, it took a while for me to notice the change. It was normal to work less while grieving . Except it's now almost two years later — and yes, I'm still very much grieving — but I am back in the flow of working. And it looks completely different. I had been working hard for years When I was balancing full-time teaching with a writing side hustle , I regularly pulled ridiculous hours, working from 7 am until late at night. Not only that, but I was also frequently working both weekend days and throughout school vacation. I even had an accident in May 2024 that put me out of work while my arm was in a sling to help the broken bones heal, but once I was back, I hit my highest earning month of all time. But then my dad died, and I just don't care the way I used to. There wasn't an inheritance that suddenly made working optional. And it's not all-consuming depression either — the months that followed were immensely dark, but I'm doing really well from a mental health perspective now. Instead, there's been a reshuffling of priorities. My identity fundamentally shifted in 2024. I came entirely too close to dying in an accident while riding horses , where doctors couldn't fathom how I survived without paraplegia, and then, mere months later, my dad had a heart attack at 65. The way people spoke about my dad made me want to live a fuller life The eulogies poured in for my dad, who was a beloved doctor. Hundreds of people messaged us, telling stories of my dad's generosity, his kindness, adventurous spirit, talent, sense of humor, and utter chaos. The sheer number of anecdotes was almost mythical, as it seemed impossible that someone could do so much with their time. My dad even starte", "date_str": "2026-10-18T10:25:01+00:00", "hash": "30c4f83be4e7053a", "title_fa": "مرگ پدرم دیدگاه جدیدی به من داد. من اکنون به تجربیات بر پول اهمیت می دهم.", "summary_fa": "وقتی پدر نویسنده درگذشت، او رویکرد خود را به کار ارزیابی کرد. با حسن نیت از تایلا بلر، من عادت داشتم در محل کار به خودم فشار بیاورم و سال به سال بیشتر از خودم درآمد داشته باشم. وقتی پدرم فوت کرد و شنیدم که مردم چگونه درباره او صحبت می کنند، رویکردم را دوباره ارزیابی کردم. در حال حاضر، من هنوز به اندازه کافی برای تامین نیازهایم درآمد دارم، اما زندگی کامل تری دارم. من یک معتاد به کار اصلاح شده هستم. دوست دارم بگویم کم کم متوجه شدم که ارزش من پولی نیست یا بر اساس اینکه چقدر می توانم از یک نردبان بالا بروم، نیست، اما این موفقیت به روشی رشد محور به دست نیامد. درعوض، از دست دادن ناگهانی پدرم در سپتامبر 2024 یک عارضه جانبی شگفت‌انگیز بود. او آنجا بود، و درست مثل آن، رفته بود. و تمایل من به سوزاندن خودم نیز همان روز مرد. در هجوم هرج و مرج اداری و اندوه ویرانگر جهان که به دنبال مرگ ناگهانی رخ می دهد، مدتی طول کشید تا متوجه تغییر شدم. این طبیعی بود که در هنگام سوگواری کمتر کار کنیم. با این تفاوت که اکنون تقریباً دو سال از آن زمان می گذرد - و بله، من هنوز خیلی غمگین هستم - اما دوباره به جریان کار برگشته ام. و کاملاً متفاوت به نظر می رسد. من سال‌ها سخت کار می‌کردم وقتی تدریس تمام وقت را با شلوغی نوشتاری متعادل می‌کردم، مرتباً ساعت‌های مضحکی را انجام می‌دادم، از ۷ صبح تا پاسی از شب کار می‌کردم. نه تنها این، بلکه اغلب هم در روزهای آخر هفته و هم در طول تعطیلات مدرسه کار می کردم. من حتی در ماه مه 2024 تصادف کردم که باعث شد من از کار بیکار شوم در حالی که بازویم برای کمک به التیام استخوان های شکسته در بند"}, {"source": "Business Insider", "title": "Why Berkshire Hathaway is betting nearly $1 billion on Bending Spoons", "link": "https://www.businessinsider.com/warren-buffett-berkshire-bending-spoons-stock-investing-acquisitions-deals-strategy-2026-10", "summary": "Warren Buffett is the former CEO and chairman of Berkshire Hathaway. Paul Morigi/Getty Images for Fortune/Time Inc Berkshire Hathaway is set to invest $330 million in Bending Spoons, adding to its previous $600 million. Warren Buffett's storied conglomerate is poised to hold a 4% stake in the owner of AOL and Vimeo. Berkshire's wager is a surprise, but there's some DNA in common with Bending Spoons. Berkshire Hathaway 's latest bet isn't a no-brainer or a head-scratcher; it's somewhere in between. What's the deal? Berkshire — which has seen Warren Buffett retire as CEO and chairman since the turn of the year — has agreed to invest $330 million in Bending Spoons, on top of a $600 million injection when the Italian tech conglomerate went public in July, giving the Nebraska behemoth a 4% stake. Bending Spoons disclosed Berkshire's backing in a press release on Wednesday, catapulting its stock up nearly 50% over two days, a phenomenon known as the \" Buffett effect .\" The stock fell on Friday, but still ended the week more than 20% above Monday's opening price. Berkshire has agreed to buy 10 million shares for $33 each, around a 13% discount to Bending Spoons ' closing price of $38 on Tuesday, the day before the deal was announced. CEO and cofounder Luca Ferrari described Berkshire in the press release as \"among the finest and most respected capital allocators in the world,\" and a \"longstanding inspiration\" for Bending Spoons. Neither company responded to requests for comment from Business Insider. What is Bending Spoons? Bending Spoons acquires digital businesses, transforms and optimizes them to increase profits, then reinvests those earnings in further acquisitions. It has been pursuing that strategy for more than a decade and has never sold a material business. Its acquisitions to date include AOL, Evernote, Vimeo, Eventbrite, and WeTransfer. Ferrari's company said in the press release that it \"strives to envision the most successful version of an acquired business,\" then works to close the gap between that vision and reality \"as quickly and completely as possible.\" Bending Spoons said that typically involves \"deep\" transformation such as \"reorganizing teams, overhauling technology, redesigning user interfaces, accelerating product development, and enhancing marketing and monetization,\" often with a good dose of AI. Ferrari gave the example of Evernote on a recent episode of the \"Joys of Compounding\" podcast. He said the business had around 350 employees wh", "date_str": "2026-10-18T10:08:01+00:00", "hash": "923e5a34ba5d1cad", "title_fa": "چرا برکشایر هاتاوی نزدیک به 1 میلیارد دلار روی قاشق های خمشی شرط بندی می کند؟", "summary_fa": "وارن بافت، مدیرعامل و رئیس سابق برکشایر هاتاوی است. پل موریگی/گتی ایماژ برای Fortune/Time Inc برکشایر هاتاوی قرار است 330 میلیون
