  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>

      --modal-bg: #151d30;

    :root[data-theme="light"] {

      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;

      --primary: #0284c7;
      --primary-hover: #0369a1;

      --tab-border: #e2e8f0;

      --tab-active-bg: #0284c7;

      padding: 4px 12px;

    .search-box {

    }

      padding: 13px 18px;
      border-radius: 12px;

      border: 1px solid var(--search-border);

      font-size: 0.95rem;

    .search-input:focus {

    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {

      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {

      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {

      flex-direction: column;
      gap: 16px;
    }
    .news-card {

      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;

    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">

  <script>

ion to really be intentional about how it’s engaging with AI products,” said Julian Ware, an Oakland spatial data administrator and member of International Federation of Professional and Technical Engineers Local 21. “Sometimes with a fancy new toy, it actually costs more, it’s more difficult to implement and the results are not as good.” Continue reading...", "date_str": "2026-11-12T15:00:44+00:00", "hash": "145c9ae15228defa", "title_fa": "کارگران ایالات متحده برای محافظت از مشاغل خود در برابر هوش مصنوعی مبارزه می کنند - و برنده می شوند", "summary_fa": "همانطور که دولت‌ها هوش مصنوعی را اتخاذ می‌کنند، کارگران در مورد نحوه استفاده از آن و محافظت از آن در برابر آسیب‌های آن به دست می‌آورند در سایه سیلیکون ولی، کارگران شهر اوکلند، کالیفرنیا، نگران هستند که منطقه از سیستم‌های هوش مصنوعی استفاده کند که می‌تواند نظارت را افزایش دهد و عملکرد آنها را ارزیابی نادرست کند. اتحادیه آنها در 22 اکتبر با اکثریت قاطع با 94.1 درصد موافق، با اصرار برای حمایت برای اطمینان از اخراج یا تنبیه کارگران توسط هوش مصنوعی، رای مثبت به اعتصاب داد. جولیان ور، مدیر داده‌های مکانی اوکلند و عضو فدراسیون بین‌المللی مهندسین حرفه‌ای و فنی محلی 21، می‌گوید: «ما فقط می‌خواهیم مدیریت شهری واقعاً عمدی در مورد نحوه تعامل با محصولات هوش مصنوعی داشته باشد.» «گاهی اوقات با یک اسباب‌بازی جدید فانتزی، هزینه بیشتری دارد، پیاده‌سازی آن به همان اندازه دشوار نیست و نتایج خوب است.» ادامه مطلب... در سایه سیلیکون ولی، کارگران شهر اوکلند، کالیفرنیا، نگران هستند که منطقه سیستم‌های هوش مصنوعی را مستقر کند که می‌تواند نظارت را افزایش دهد و عملکرد آنها را ارزیابی نادرست کند. اتحادیه آنها در 22 اکتبر با اکثریت قاطع با 94.1 درصد موافق، با اصرار برای حمایت برای اطمینان از اخراج یا تنبیه کارگران توسط هوش مصنوعی، رای مثبت به اعتصاب داد. رای تقریباً به اتفاق آرا تأثیر داشت. دولت شهر اوکلند و اتحادیه به توافقنامه آزمایشی سه ساله ای دست یافتند که شامل حفاظت های مرتبط با هوش مصنوعی می شود، مانند الزام شهر به آموزش مجدد یا استخدام مجدد کارگرانی که توسط هوش مصنوعی آواره شده اند به جای اخراج آنها. در نتیجه اعتصاب 5 نوامبر به حالت تعلیق lowing a late Wednesday night meeting, the board accepted Huang's letter of resignation as CEO, president, and board member, effective immediately, with current CFO Colette Kress appointed interim CEO. Kress has been with Nvidia since 2013, with previous stops at Cisco and Microsoft. Nvidia is also changing its corporate structure in Huang's absence, appointing former Synopsys CEO Harvey C. Jones as the fir … Read the full story at The Verge.", "date_str": "2026-11-12T13:53:16+00:00", "hash": "7ef682e772134363", "title_fa": "جنسن هوانگ، مدیر عامل انویدیا در بحبوحه رسوایی‌های جاسوسی، استعفا داد", "summary_fa": "جنسن هوانگ در GTC برلین ماه گذشته. | عکس: Soeren Stache/تصویر اتحاد از طریق Getty Images هیئت مدیره انویدیا اعلام کرد که جنسن هوانگ - بنیانگذار، رئیس و مدیرعامل قدیمی آن - پس از گزارش هایی مبنی بر دو رابطه خارج از ازدواج، یکی با یک جاسوس چینی و دیگری با یکی از مدیران انویدیا که به هوانگ گزارش داده است، استعفا داده است. پس از جلسه چهارشنبه شب، هیئت مدیره نامه استعفای هوانگ را به عنوان مدیرعامل، رئیس و عضو هیئت مدیره پذیرفت و بلافاصله اجرایی شد و کولت کرس، مدیر مالی فعلی، به عنوان مدیرعامل موقت منصوب شد. کرس از سال 2013 با انویدیا همکاری داشته است و قبلا در سیسکو و مایکروسافت حضور داشته است. انویدیا همچنین در غیاب هوانگ، ساختار شرکتی خود را تغییر می‌دهد و هاروی سی جونز، مدیر عامل سابق Synopsys را به‌عنوان صنوبر منصوب می‌کند… داستان کامل را در The Verge بخوانید. جنسن هوانگ، مدیر عامل شرکت انویدیا، جنسن هوانگ، مدیر عامل شرکت انویدیا استعفا داد پس از گزارش‌هایی مبنی بر دو رابطه خارج از ازدواج هوانگ با یک جاسوس و یکی از مدیران انویدیا، او خارج شد و کولت کرس، مدیر ارشد مالی انویدیا، وارد شد. Soeren Stache / ائتلاف تصویر از طریق Getty Images بخشی از همه چیزهایی است که تاکنون درباره رسوایی جاسوسی انویدیا با هدف قرار دادن مدیر عامل شرکت Jensen Huang می‌دانیم. او که بیش از پنج سال گزارشگری را شکست داد، کار او در CNBC، MIT Technology Review، Wired UK و سایر رسانه ها نیز منتشر شده است. هیئت مدیره انویدیا اعلام کرد که جنسن هوانگ - بنیانگذار، رئیس و مدیر عامل قدیمی آن - پس از گزارش هایی مبنی بر دو رابطه خارج از ازدواج، یکی با یک جاسوس چینی و دیگری با یکی از مدیران انویدیا که به هوانگ گزارش داده است، استعفا داده است.", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2301620664.jpg?quality=90&strip=all&crop=0%2C14.751764993408%2C100%2C70.496470013184&w=1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "Microsoft"], "datetime_fa": "۲۱ آبان • ۱۷:۲۳"}, {"source": "TechCrunch Main", "title": "Nvidia’s Jensen Huang resigns, chipmaker names CFO Colette Kress as interim CEO", "link": "https://techcrunch.com/2026/11/12/nvidias-jensen-huang-resigns-chipmaker-names-cfo-colette-kress-as-interim-ceo/", "summary": "Nvidia gets a new chief executive, days after former CEO Jensen Huang admitted to a romantic affair with an alleged Chinese spy.", "date_str": "2026-11-12T14:10:34+00:00", "hash": "a2760bfffd01a42a", "title_fa": "جنسن هوانگ انویدیا استعفا داد، تراشه‌ساز کولت کرس را به عنوان مدیرعامل موقت معرفی کرد.", "summary_fa": "چند روز پس از اعتراف جنسن هوانگ، مدیر عامل سابق، انویدیا مدیر اجرایی جدیدی پیدا کرد که با یک جاسوس چینی رابطه عاشقانه داشته است. این شرکت روز پنجشنبه گفت جنسن هوانگ از سمت خود به عنوان رئیس و مدیر اجرایی انویدیا استعفا داده است، تنها چند روز پس از اعتراف وی به رابطه عاشقانه با یک جاسوس چینی که جرقه بحران امنیت ملی در ایالات متحده را برانگیخت. انویدیا در یک پرونده نظارتی گفت که هیئت مدیره آن استعفای هوانگ را در روز چهارشنبه پذیرفت. انویدیا اعلام کرد که مدیر مالی فعلی و معاون اجرایی آن، کولیت کرس، تا زمانی که شرکت جانشین دائمی پیدا کند، به عنوان مدیر عامل موقت این شرکت انتخاب خواهد شد. کرس به عنوان مدیر مالی شرکت به خدمت خود ادامه خواهد داد. سهام انویدیا در معاملات صبح روز پنجشنبه نزدیک به 12 درصد کاهش یافت. از روز جمعه، سهام این شرکت تا 19 درصد کاهش یافته است که منجر به از دست دادن ارزش بازار بیش از 855 میلیارد دلار شده است. هوانگ انویدیا را در سال 1993 تاسیس کرد و از آن زمان تاکنون به عنوان مدیرعامل آن را رهبری می کند. تحت رهبری او، انویدیا نقش مهمی در توسعه واحد پردازش گرافیکی (GPU) ایفا کرد، یک تراشه تخصصی که پردازش گرافیکی را برای رایانه های شخصی انجام می دهد، همانطور که امروز می شناسیم. تراشه‌ها فورا مورد استقبال قرار نگرفتند و روزهای اولیه Nvidia با مبارزه و اخراج مشخص می‌شد، اما در نهایت، طراحی گرافیکی آن به قدری خوب بود که به استانداردی برای پردازش گرافیکی تبدیل شد. این تراشه‌ها همچنین در انجام همزمان تعداد زیادی محاسبات بسیار خوب عمل می‌کنند، که باعث محبوبیت آن‌ها برای کارهای محاسباتی مانند استخراج رمزنگاری و اخیراً آموزش و اجرای شبکه‌های عصبی، که مدل‌های هوش مصنوعی در هسته آن‌ها هستند، شده است.", "image_url": "https://techcrunch.com/wp-content/uploads/2025/03/GettyImages-2205210966.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۲۱ آبان • ۱۷:۴۰"}, {"source": "Ars Technica", "title": "Google pushes privacy angle as Gemini-powered smartglasses debut starting at $395", "link": "https://arstechnica.com/google/2026/11/google-pushes-privacy-angle-as-gemini-powered-smartglasses-debut-starting-at-395/", "summary": "Smartglasses have always faced an uphill road to acceptance. Not only is propping a computer up on your nose an uncomfortable proposition, but the privacy aspect has been vexing people since the Google Glass days . Now, Google is ready to take another swing at \" intelligent eyewear \" for the Gemini era after previewing its plans a couple of times. The first glasses are up for preorder today from Gentle Monster and Warby Parker, but they're no impulse buy. These devices are a collaboration between Google, Samsung, and the aforementioned eyewear designers. Gentle Monster and Warby Parker have each designed a few different frames, with options for transparent and tinted lenses. Samsung is providing the computing hardware that fits inside them, and Google has the software covered. Warby Parker has designed three frames for Google eyewear, called Alden, Reid, and Wren (see above). They are available with both standard optical and sun lenses in Pine, Saddle, and Jet Black colors at $395 and higher. Warby Parker is only selling devices in the US. Gentle Monster has gone a bit further with six styles, but Google hasn't told us any names for those yet. They come in dark red, pink, gray, and yellow colors and are available with clear, tinted, blue, or brown lenses. The Gentle Monster styles start a little higher at $449, and they will be available in the US and South Korea. Read full article Comments", "date_str": "2026-11-12T14:50:17+00:00", "hash": "741f9d666d3854d8", "title_fa": "گوگل با شروع اولین عینک هوشمند مجهز به جمینی که از 395 دلار شروع می شود، زاویه حریم خصوصی را افزایش می دهد.", "summary_fa": "عینک‌های هوشمند همیشه با مسیری سربالایی برای پذیرش روبرو بوده‌اند. نه تنها قرار دادن رایانه روی بینی شما یک پیشنهاد ناراحت کننده است، بلکه جنبه حفظ حریم خصوصی افراد را از روزهای Google Glass آزار می دهد. اکنون، گوگل پس از چند بار پیش‌نمایش برنامه‌های خود، آماده است تا تغییر دیگری در «عینک‌های هوشمند» برای عصر جمینی انجام دهد. اولین عینک امروز از Gentle Monster و Warby Parker برای پیش‌سفارش آماده شده است، اما آن‌ها بدون نیاز به خرید فوری هستند. این دستگاه ها با همکاری گوگل، سامسونگ و طراحان عینک فوق الذکر هستند. Gentle Monster و Warby Parker هر کدام چند فریم متفاوت با گزینه هایی برای لنزهای شفاف و رنگی طراحی کرده اند. سامسونگ سخت‌افزار محاسباتی را فراهم می‌کند که درون آن‌ها قرار می‌گیرد و گوگل نیز نرم‌افزار را پوشش می‌دهد. واربی ​​پارکر سه قاب برای عینک گوگل طراحی کرده است که Alden، Reid و Wren نام دارند (به بالا مراجعه کنید). آنها با لنزهای استاندارد نوری و آفتابی در رنگ های Pine، Saddle و Jet Black با قیمت 395 دلار و بالاتر در دسترس هستند. واربی ​​پارکر فقط دستگاه‌های خود را در ایالات متحده می‌فروشد. Gentle Monster با شش سبک کمی جلوتر رفته است، اما گوگل هنوز نامی برای آن ها به ما نگفته است. آنها در رنگ های قرمز تیره، صورتی، خاکستری و زرد هستند و با لنزهای شفاف، رنگی، آبی یا قهوه ای در دسترس هستند. سبک های Gentle Monster با قیمت 449 دلار کمی بالاتر شروع می شوند و در ایالات متحده و کره جنوبی در دسترس خواهند بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش عینک های هوشمند همیشه با جاده ای سربالایی برای پذیرش روبرو بوده اند. نه تنها", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/WP_ALDEN-Carousel_Lifestyle-copy-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲۱ آبان • ۱۸:۲۰"}, {"source": "Ars Technica", "title": "Nvidia CEO Jensen Huang has resigned", "link": "https://arstechnica.com/gadgets/2026/11/ceo-jensen-huangs-job-is-suddenly-on-the-line-at-nvidia/", "summary": "Nvidia chief executive Jensen Huang has resigned following revelations that he had two extramarital affairs, plunging the chipmaker at the heart of the global AI boom into crisis. The 63-year-old will be replaced by chief financial officer Colette Kress, who will serve as interim chief executive. His exit comes after he admitted to having a relationship with a woman that US authorities believe was a Chinese spy. It also emerged on Wednesday that Huang had an affair with a senior Nvidia executive. Read full article Comments", "date_str": "2026-11-12T14:05:17+00:00", "hash": "88a469109a7a693f", "title_fa": "جنسن هوانگ، مدیرعامل انویدیا استعفا داد", "summary_fa": "جنسن هوانگ، مدیر اجرایی انویدیا، پس از افشای دو رابطه خارج از ازدواج، از سمت خود استعفا داد و این سازنده تراشه در قلب رونق جهانی هوش مصنوعی را در بحران فرو برد. کولت کرس، مدیر مالی، جایگزین این 63 ساله خواهد شد که به عنوان مدیر اجرایی موقت خدمت خواهد کرد. خروج او پس از اعتراف به داشتن رابطه با زنی صورت می گیرد که مقامات آمریکایی معتقدند جاسوس چینی است. همچنین روز چهارشنبه مشخص شد که هوانگ با یکی از مدیران ارشد انویدیا رابطه نامشروع داشته است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. سهام انویدیا در معاملات قبل از بازار بیش از 10 درصد کاهش یافت که باعث افزایش زیان های قبلی پس از اعلام استعفای هوانگ شد. هوانگ، که در سال 1993 انویدیا را بنیانگذار کرد، آن را رهبری کرد که تا همین اواخر به ارزشمندترین شرکت جهان تبدیل شود. خروج هوانگ پایانی خیره کننده برای بیش از 33 سال تصدی او است که در طی آن انویدیا از یک شرکت کوچک تراشه بازی های ویدیویی به قطب اصلی رونق زیرساخت های هوش مصنوعی جهانی تبدیل شد. هوانگ به یکی از شناخته‌شده‌ترین چهره‌های فناوری تبدیل شده است، زیرا نیمه‌هادی‌های انویدیا برای آموزش و اجرای سیستم‌های هوش مصنوعی مانند ChatGPT OpenAI و Anthropic's Claude یکپارچه شدند. سهام انویدیا پس از اعلام این شرکت مبنی بر استعفای جنسن هوانگ از سمت مدیر اجرایی، کاهش قبل از بازار را افزایش داد.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/09/GettyImages-2296993009-1024x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Nvidia"], "datetime_fa": "۲۱ آبان • ۱۷:۳۵"}, {"source": "Ars Technica", "title": "Hundreds of streaming services and nothing to watch", "link": "https://arstechnica.com/gadgets/2026/11/hundreds-of-streaming-services-and-nothing-to-watch/", "summary": "“Fifty-seven channels, and nothin’ on.” Bruce Springsteen famously said those words during a concert and later in a song in the 1990s about the number of TV channels seemingly growing disproportionately to the availability of enjoyable content. Within a few years, there would be hundreds of TV channels and still, some would argue in hyperbolic frustration, “ nothing to watch.” Read full article Comments", "date_str": "2026-11-12T14:00:19+00:00", "hash": "34b19395e11170bd", "title_fa": "صدها سرویس استریم و چیزی برای تماشا", "summary_fa": "\"پنجاه و هفت کانال و هیچ چیز روشن نیست.\" بروس اسپرینگستین این کلمات را در طول یک کنسرت و بعداً در یک آهنگ در دهه 1990 در مورد تعداد کانال های تلویزیونی که ظاهراً به طور نامتناسبی نسبت به در دسترس بودن محتوای لذت بخش افزایش می یافت، گفت. در عرض چند سال، صدها کانال تلویزیونی وجود خواهد داشت و هنوز، برخی با ناامیدی هذلولی استدلال می‌کنند که «چیزی برای تماشا کردن نیست». مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش \"پنجاه و هفت کانال و هیچ چیز\" به حداقل برسانید. ظهور خدمات استریم به عنوان یک راه حل بالقوه برای این مشکل در نظر گرفته شد. به بینندگان امکان دسترسی آسان و درخواستی به هزاران فیلم و نمایش را می‌دهد، که از نظر تئوری می‌تواند تضمین کند که بینندگان همیشه چیزی برای تماشا پیدا کنند. با این حال، طبق نظرسنجی Nielsen’s Gracenote، امروز دقیقاً اینطور نیست. Gracenote، یک کسب‌وکار داده‌های محتوایی متعلق به نیلسن، از 3000 کاربر پخش ویدئو در ایالات متحده، برزیل، فرانسه، آلمان، مکزیک و بریتانیا که حداقل 18 سال سن داشتند، برای گزارش \"وضعیت بازی 2026: در میان ناامیدی‌های پراکنده، UX آینده استریم است\" نظرسنجی کرد. متوجه شد که بسیاری برای یافتن چیزی برای پخش کردن تلاش می کنند. با این حال، این لزوماً به این دلیل نیست که هیچ چیز خوبی در آن وجود ندارد، بلکه به این دلیل است که آنها به سختی می‌توانند محتوای خوب را در سرویس‌های پخش پخش کنند. برای مثال، بیش از 51 درصد از پاسخ‌دهندگان گفتند که «فراوانی محتوا و خدمات [جریان‌سازی] یافتن چیزی برای تماشا را سخت‌تر می‌کند». علاوه بر این، 19.2 درصد از پاسخ دهندگان گفتند که به طور متوسط ​​یا «همیشه» یا «اغلب» نمی دانند چه چیزی", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/GettyImages-2230766677-1024x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Engadget", "title": "Jensen Huang is out as NVIDIA CEO", "link": "https://www.engadget.com/2314584/jensen-huang-is-out-as-nvidia-ceo/", "summary": "He has held the position since the company s founding.", "date_str": "2026-11-12T14:04:30+00:00", "hash": "cdf609c2f7fd9650", "title_fa": "جنسن هوانگ به عنوان مدیرعامل NVIDIA کنار گذاشته شد", "summary_fa": "او از زمان تأسیس این شرکت این سمت را بر عهده داشته است. Heather Diehl/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover Jensen Huang دیگر مدیر عامل NVIDIA نیست. روز پنجشنبه       media: [{"source": "Billboard", "title": "Leveling Up With R&B Up-And-Comer of the Month Baby Rose: ‘I Love This Whole Freaky Journey I’m On’", "link": "https://www.billboard.com/music/rb-hip-hop/baby-rose-rb-up-and-comer-month-november-interview-1236380169/", "summary": "It’s two days after the one-night-only concert celebrating the 20th anniversary of Amy Winehouse’s seminal album Back to Black at The Roundhouse in London (Oct. 23) — and Baby Rose is still pinching herself. “It was amazing,” says a reverent Rose during a Zoom interview with Billboard . “The way they put it together was just insane … everything from the original band to the original album producers [Mark Ronson, Salaam Remi]. And the venue was the last place Amy performed at before she passed. It was just beautiful to be on one accord with all the women [who performed]. We may be from all over, but the one thing we have in common is how much Amy affected us.” Baby Rose was among a handpicked group of singers — including Corinne Bailey Rae, Jessie Reyez, FLO and Jorja Smith — paired with a track from the album to perform. Working with Paul Duffy, another producer on the Winehouse album, Rose was asked to sing the devastating ballad “Wake Up Alone.” This was just one in a series of breakout moments in what’s been a whirlwind year of leveling up for Baby Rose. Raised between Washington D.C. and Fayetteville, North Carolina, the rising star won her first Grammy for her collaboration on the track “I Used To.” It was her contribution to Leon Thomas’ album MUTT that won the 2026 award for best R B album. From there, the July release of third studio album Yearnalism (via Secretly Canadian) found the singer-songwriter zeroing in on honesty, freedom, self-love and other desires after moving beyond a low period. Aiding in that transformation: the 12-track album’s alternative mélange of R B/soul, jazz, gospel and rock and other genres, a contemporary homage described in press materials as “infused with t  کروز برگزار می‌کند. دیزنی همچنین از فصل دوم سریال +Disney Ahsoka و فیلم Star Wars: Starfighter رونمایی خواهد کرد. لینون برنان، یکی از رئیس‌های لوکاس‌فیلم در بیانیه‌ای گفت: «بسیار خاص است که پنجاهمین سالگرد را با بازگرداندن نسخه اصلی جنگ ستارگان به سینماها انجام دهیم تا مخاطبان بتوانند این بخش از تاریخ فیلم را روی پرده بزرگ تجربه کنند.» ما مشتاقانه منتظر جشن گرفتن با طرفداران خود در تمام طول سال هستیم - از انتشار Ahsoka و Star Wars: Starfighter گرفته تا کالاهای انحصاری، داستان های انتشارات جدید، تجربیات فراموش نشدنی و بازی های تعاملی. ما از انجمن شگفت انگیز خود بسیار سپاسگزاریم و امیدواریم این تجربیات برای طرفداران جنگ ستارگان در همه جا شادی ایجاد کند.\" Ahsoka، که روزاریو داوسون در نقش اصلی بازی می کند، در 20 ژانویه باز می گردد. جنگ ستارگان: جنگنده ستارگان، به کارگردانی شاون لوی، در تاریخ 28 می در سینماها به نمایش درخواهد آمد. این فیلم با بازی رایان گاسلینگ و در دوره ای کاملاً جدید از داستان سرایی جنگ ستارگان، با شخصیت ها و مکان های کاملاً جدید اتفاق می افتد. در بیانیه مطبوعاتی این فیلم توضیح داده شده است: هنگامی که یک یاغی بدبین با گذشته مرموز خود مواجه می شود، به یک ماجراجویی خطرناک در سراسر کهکشان پرتاب می شود که او را در مسیر تصادف با سرنوشت قرار می دهد.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Star-Wars-50-Years.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۸:۴۵"}, {"source": "Rolling Stone", "title": "Steve Carell, John C. Reilly to Star in Neil Simon’s ‘The Odd Couple’ on Broadway", "link": "https://www.rollingstone.com/culture/culture-news/steve-carell-john-c-reilly-neil-simon-odd-couple-broadway-1235655112/", "summary": "The revival officially opens at Stephen Sondheim Theatre in March", "date_str": "2026-11-12T14:22:10+00:00", "hash": "c035386b7fae1592", "title_fa": "استیو کارل و جان سی ریلی در فیلم «زوج عجیب» نیل سایمون در برادوی بازی خواهند کرد.", "summary_fa": "استیو کارل رسماً در ماه مارس در تئاتر Stephen Sondheim افتتاح می شود و جان سی ریلی در احیای فیلم کلاسیک نیل سایمون به نام The Odd Couple در برادوی بازی خواهد کرد. کارگردانی برنده جایزه تونی توماس کیل (همیلتون)، احیای آن در 23 مارس در تئاتر استفان ساندهیم اکران می شود. به مناسبت صدمین سالگرد تولد سایمون، نمایشنامه نویس، نمایشنامه مهم او برای اولین بار در سال 1965 در برادوی اکران شد و والتر ماتائو و آرت کارنی در آن بازی کردند. محصول اصلی برنده چهار جایزه تونی، از جمله بهترین نمایشنامه شد. همچنین در سال 1968 فیلم و مجموعه تلویزیونی محبوب پنج فصلی با همین نام و همچنین تولیدات بعدی بی‌شماری در سراسر جهان تولید شد. کیل در بیانیه‌ای گفت: «نیل سایمون یکی از کمدی‌های بزرگ آمریکایی را نوشت و این یک افتخار و هیجان است که بخشی از این تیم استثنایی باشم که این نمایشنامه را به برادوی بازمی‌گرداند». «زیر طنز فوق‌العاده چیزی عمیقاً انسانی است. استیو و جان دو بازیگر قابل توجهی هستند که می توانند یک لحظه تماشاگران را به شدت بخندانند و لحظه ای آنها را عمیقاً تحت تأثیر قرار دهند. ما قصد داریم جهانی بسازیم که احساس زنده بودن، بی واسطه بودن داشته باشد و بتواند به وضوح بیان کند که چرا این نمایشنامه بیش از 60 سال دوام آورده است.\" «چرا این کار را می کنیم؟ باید بخندیم دوره،\" یکی از تهیه کنندگان نمایش، جفری سلر، افزود. فروش بلیط های عمومی از روز سه شنبه، 17 نوامبر، ساعت 10 صبح به وقت شرقی از طریق سایت نمایش آغاز می شود. داستان های پرطرفدار ساد در مراسم معرفی تالار مشاهیر راک رول شرکت نمی کند مصاحبه «شما می توانید همه چیز را ببینید» که منتظر ملاقات باب دیلن با پاپ لئو بودید: افراد روی کاپوت ثابت بودند، اما دست ها صدا می کردند", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/steve-john-odd-couple.jpg?crop=0px%2C0px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۷:۵۲"}, {"source": "Hollywood Reporter", "title": "Maleficent Makes Her Debut in ‘Sofia the First: Royal Magic’ (Exclusive)", "link": "https://www.hollywoodreporter.com/tv/tv-news/maleficent-sofia-the-first-royal-magic-watch-video-1236753554/", "summary": "Watch a clip from the Disney Jr. show featuring the iconic villain.", "date_str": آف «زندگی مخفی همسران مورمون» هولو، که اکشن را از یوتا به سواحل آفتابی اورنج کانتی منتقل می‌کند، ممکن است ترس داشته باشید که آنها دو برابر می‌شوند. یکی از بازیگران اورنج کانتی، مک کال داپرون، یک رینگر مرده برای خواهرش، ستاره شاخص مایسی نیلی است. یک O.G واقعی مورمون [ ] جایی که اولین نسل از همسران مورمون به سرعت خود را به اصطلاح «گناهکاران» و «قدیس» تقسیم کردند، خدمه اورنج کانتی به حساب‌های مشابه تقسیم می‌شوند: «مولی مورمون‌ها» - دیده‌بان، اغلب بلوند و در ترتیبات خانوادگی سنتی - و همه افراد دیگر. اردوگاه دوم شامل برخی از زنان است که پیوندهایشان با کلیسای عیسی مسیح مقدسین آخرالزمان واقعاً ضعیف است، مانند پادکست مرده بابی آلتوف. برادر آلتوف در بزرگسالی به مورمونیسم گروید، اگرچه احتمالاً بازیگری او بیشتر به دنبال‌کنندگان آنلاین قابل توجه او مربوط می‌شود تا وابستگی مذهبی. ضربات داستانی که از این شکاف درونی به دست می‌آیند، با این وجود به طرز عجیبی آشنا هستند و سنت‌گرایی آماده پینترست را در برابر مدرنیته آینده‌نگر قرار می‌دهند. باز هم، هیچ کس در اولین \"همسران مورمون\" در رابطه ای به اندازه رابطه O.C. یوتیوب Aspyn Ovard، که در یک گروه کامل حضور دارد. همانطور که از شرح شغل‌هایی مانند «پادکستر» و «یوتیوب» برمی‌آید، «همسران مورمون» ابتدا متنی درباره شهرت اینترنتی و در درجه دوم مذهب است. (آلتوف حتی تنها گوینده حرفه‌ای در گروه نیست؛ اوری وودز مجری کمدی به او ملحق شده است.) به جای «#MomTok»، گروه دوستان موجود از همگام‌سازی‌کنندگان لب که سوژه آماده‌ای را برای یک نمایش واقعی ارائه می‌کنند، اورنج کانتی مجموعه‌ای از آشنایان را جمع می‌کند. وجه مشترک از لحاظ نظری افلک است که ادعا می کند خدمه دوستانی هستند که او در هنگام فیلمبرداری «رقص با ستاره ها» در لس آنجلس پیدا کرد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/SecretLivesofMormonWives-OrangeCounty-review.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۱ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "Hollywood’s Next Big Deal: Will Netflix Make an M&A Play for NBCU?", "link": "https://variety.com/2026/tv/news/will-netflix-make-acquisition-move-nbcuniversal-spinoff-1236946048/", "summary": "David Ellison has knocked out Warner Bros. Discovery, merging it with Paramount into the new Skydance Corp. Now the chatter around town is about the industry’s next megamerger. In the current landscape, only one media company of considerable size could be ripe for a takeover: NBCUniversal. Following its planned spinoff from Comcast in mid-2027, NBCU [ ]", "date_str": "2026-11-12T15:30:00+00:00", "hash": "ab9b80d920cf005b", "title_fa": "معامله بزرگ بعدی هالیوود: آیا نتفلیکس یک بازی M&A برای NBCU انجام می دهد؟", "summary_fa": "دیوید الیسون شرکت برادران وارنر دیسکاوری را حذف کرد و آن را با پارامونت در شرکت جدید Skydance ادغام کرد. اکنون صحبت‌های اطراف شهر درباره ادغام‌کننده بعدی این صنعت است. در چشم انداز فعلی، تنها یک شرکت رسانه ای با اندازه قابل توجه می تواند برای تصاحب آن آماده باشد: NBCUniversal. پس از برنامه‌ریزی‌شده آن از Comcast در اواسط سال ۲۰۲۷، تد ساراندوس، رئیس NBCU [ ] Netflix، پس از کناره‌گیری از تلاش پخش‌کننده برای خرید برادران وارنر. و HBO، گفت که نکته کلیدی او این بود که \"ما واقعا عضله M A خود را ساختیم.\" او دست خود را در مورد آنچه که نتفلیکس ممکن است در آینده دنبال کند، نگذاشته است، و تنها در ماه آوریل گفت که \"ما به صورت ارگانیک و فرصت طلبانه در این تجارت سرمایه گذاری می کنیم.\" در همین حال، مدیران Comcast، با اعلام برنامه‌های اسپین‌آف NBCU در ماه ژوئن، گفتند که شرکت رسانه‌ای را برای آماده کردن آن برای فروش جدا نمی‌کنند. اما هنگامی که در مورد احتمال M A پس از جدایی تحت فشار قرار گرفت، مایک کاوانا، مدیر عامل Comcast، که قرار است پس از اسپین، مدیر اجرایی NBCU شود، پیشنهاد داد که ممکن است معاملاتی در راه باشد. او به تحلیلگران وال استریت گفت، به‌عنوان یک شرکت مستقل، «اکنون این آزادی را خواهد داشت که کسب‌وکارهای مجاور را که در آن‌ها حق بازی داریم، کشف کند». جن فریدمن، افسر ارشد ارتباطات در بیانیه‌ای به Variety گفت: «ما از ابتدا گفته‌ایم که این چرخش را برای اهداف M A دنبال نمی‌کنیم. برنامه ما برای NBCU این است که کسب و کار را برای رشد آماده کنیم، و با توجه به کسب و کارهای پیشرو صنعت خود در جذاب ترین بخش های رسانه، استراتژی متفاوت و ترازنامه منحصر به فرد قوی ما، مسیری را برای انجام این کار می بینیم. نتفلیکس", "image_url": "https://variety.com/wp-content/uploads/2026/11/Mergers-Slot-Machine.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس", "سرمایه‌گذاری"], "datetime_fa": "۲۱ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "How Citrin Cooperman’s Arnie Herrmann Built a Career Rooted in ‘Trust and Service’", "link": "https://variety.com/2026/biz/news/arnie-herrmann-business-manager-variety-citrin-cooperman-1236944939/", "summary": "Arnie Herrmann was 22 years into his career as a business manager when he came face-to-face with a crisis that led him to a crossroads. At the time, Herrmann worked for the prominent New York-based firm of Starr and Company. The company was well known for representing stars and prominent figures in business. Herrmann had [ ]", "date_str": "2026-11-12T15:16:09+00:00", "hash": "2dacf01792148349", "title_fa": "چگونه آرنی هرمان از سیترین کوپرمن شغلی را ایجاد کرد که ریشه در «اعتماد و خدمات» داشت", "summary_fa": "آرنی هرمان 22 سال از زندگی حرفه ای خود به عنوان یک مدیر تجاری بود که با بحرانی روبرو شد که او را به یک دوراهی کشاند. در آن زمان، هرمان برای شرکت برجسته نیویورکی Starr and Company کار می کرد. این شرکت به دلیل نمایندگی از ستاره ها و چهره های برجسته در تجارت شناخته شده بود. هرمان [ ] برنده جایزه مدیر کسب و کار سال Variety به دلیل صداقت، شفافیت و روابط طولانی با مشتری، در حدود سال 2005، وضعیت Starr and Co. شروع به خراب شدن کرد بنیانگذار و مالک Kenneth I. Starr (نباید با دادستان فدرال فقید به همین نام اشتباه شود) شروع به رفتار نامنظم در زندگی شخصی خود کرد. با گذشت زمان، رفتار استار در حالی که چهارمین ازدواج خود را آغاز کرد، برای شرکت همنام او بازتاب داشت. بحران اقتصادی جهانی 2008-2009 و فوران رسوایی برنی مدوف فقط وضعیت را فوری تر کرد. مقصد استار برای زندان فدرال بود. در سال 2011، او به دلیل دزدی 33 میلیون دلار از مشتریانش در یک طرح پونزی به کلاهبرداری محکوم شد و به هفت سال و نیم محکوم شد. مانند بسیاری از کارمندان Starr and Co.، Herrmann از جزئیات آنچه در آن زمان در حال وقوع بود اطلاعی نداشت. اما او به وضوح می‌دانست که چیزی اشتباه است، و می‌دانست که شهرت طولانی مدت شرکت برای مقابله با طوفان کافی نیست. هرمان در ژانویه 2010 از شرکت استار استعفا داد تا به رقیبش سیترین کوپرمن بپیوندد. استار شش ماه بعد دستگیر شد و شرکت منفجر شد. هرمان می‌گوید: «من آنجا را ترک کردم که فقط به خاطر رفتار او از مراجعان خون می‌ریختیم. \"نیویورک می تواند یک مکان بسیار کوچک باشد. و در حالی که او در اطراف شهر نیویورک هیاهو می کرد، مردم نگران پول خود بودند.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/Arnie-Herrmann.jpg?crop=0px%2C1px%2C1500px%2C844px&#038;resize=1000%2C563", "category": "اقتصاد و بازرگانی", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۱ آبان • ۱۸:۴۶"}, {"source": "Variety", "title": "International Cinematographers Guild Celebrates 100 Years of Solidarity and Storytelling", "link": "https://variety.com/2026/artisans/news/international-cinematographers-guild-100-years-1236945738/", "summary": "The International Cinematographers Guild (ICG), IATSE Local 600, will officially commemorate its 100th anniversary on Nov. 15, celebrating a century of standing up for workers and championing the artistry, innovation and storytelling of its members who have helped shape film and television around the world. The ICG’s lineage traces back to Nov. 15, 1926, with [ ]", "date_str": "2026-11-12T15:01:00+00:00", "hash": "5157ddc7fc4310b0", "title_fa": "انجمن بین المللی فیلمبرداران صدمین سال همبستگی و داستان سرایی را جشن گرفت", "summary_fa": "انجمن بین‌المللی سینماگران (ICG)، IATSE Local 600، صدمین سالگرد خود را در 15 نوامبر جشن می‌گیرد و یک قرن دفاع از کارگران و دفاع از هنر، نوآوری و داستان‌سرایی اعضای خود را که به شکل‌گیری فیلم و تلویزیون در سراسر جهان کمک کرده‌اند، جشن می‌گیرد. نسب ICG به 15 نوامبر 1926 باز می گردد، با [ ] تبار ICG به نوامبر بازمی گردد. 15، 1926، با اجاره IATSE Local 644 در نیویورک، که در ابتدا توسط پیشگامان دوربین های عصر خاموش سازماندهی شد که مصمم به استانداردسازی دستمزدها، ساعات کار و ایمنی در محل بودند. در سال 1996، افراد محلی دوربین 644 در نیویورک، 659 در لس آنجلس و 666 در شیکاگو ادغام شدند تا یک سازمان ملی ایجاد کنند. در سال 2002، ICG نیروهای خود را با انجمن تبلیغاتی (IATSE Local 818) ترکیب کرد و متخصصان دوربین و تبلیغات را تحت یک اتحادیه گرد هم آورد. داستان‌های مرتبط بررسی «چگونه از بانک سرقت کنیم»: نیکلاس هولت و زوئه کراویتز در یک فیلم دزدی از عصر تأثیرگذار به طرز آزاردهنده و هیجان‌انگیزی دستمزد خود را می‌گیرند جان لیندلی، ASC، رئیس ملی انجمن بین‌المللی فیلم‌برداران، می‌گوید: «برای 100 سال، قدرت اعضای این انجمن نشأت می‌گیرد. این صدمین سالگرد فرصتی برای ارج نهادن به کسانی است که پیش از ما آمده‌اند، از افرادی که این میراث را امروز به پیش می‌برند، تجلیل می‌کنیم، و تعهد خود را برای حفاظت از صنایع دستی، معیشت و صدای خلاق نسل‌های اعضای آینده تأیید می‌کنیم. این صنف مبارزه برای استانداردهای حیاتی کار در سراسر صنعت سرگرمی را رهبری کرده است، رهبری اصلاحات اساسی در ایمنی مجموعه، کاهش خستگی، حفاظت از سلامت و حقوق بازنشستگی چند کارفرمایی، و حفاظ‌های قراردادی سختگیرانه پیرامون اتوماسیون و فناوری‌های نوظهور.", "image_url": "https://variety.com/wp-content/uploads/2026/11/600_100Years.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۸:۳۱"}, {"source": "Variety", "title": "Brooklyn’s Iconic Domino Sugar Refinery to Host New Music Venue", "link": "https://variety.com/2026/music/news/brooklyn-domino-sugar-refinery-new-music-venue-1236945867/", "summary": "Domino, a new all-ages 750-capacity venue and creative hub, will open in April 2027 on the Williamsburg waterfront in Brooklyn, New York — located in the iconic, landmarked Domino Sugar Refinery that has been a beacon of the Brooklyn waterfront for more than a century. The new venue will feature concerts, club nights, art and [ ]", "date_str": "2026-11-12T15:00:00+00:00", "hash": "347ed97e3a2acb78", "title_fa": "پالایشگاه قند دومینو نمادین بروکلین میزبان مکان موسیقی جدید است", "summary_fa": "دومینو، یک مکان جدید با ظرفیت 750 سن و مرکز خلاقانه، در آوریل 2027 در اسکله ویلیامزبورگ در بروکلین، نیویورک - واقع در پالایشگاه قند نمادین و دیدنی دومینو که بیش از یک قرن چراغ راه آب نما بروکلین بوده، افتتاح می شود. مکان جدید دارای کنسرت‌ها، شب‌های باشگاهی، هنری و [ ] خواهد بود. محل برگزاری همچنین عضو انجمن ملی محل مستقل است و پلتفرم فروش بلیت آن پلتفرم مستقل دایس خواهد بود که به دلیل قیمت‌گذاری شفاف و پشتیبانی از سالن‌های مستقل معروف است. این مکان همچنین متعهد شده است که از فروش کالاهای هنرمند خودداری کند. شاید مهم‌تر از همه، این یک مکان مستقل جدید در یک شهر بزرگ است، در زمانی که مکان‌های مستقل توسط غول‌های سرگرمی زنده چند میلیارد دلاری درهم شکسته می‌شوند. بن لاوت، بنیانگذار TVG، نوازنده کیبورد و یکی از اعضای مؤسس مامفورد سانز، می‌گوید: «ویلیامزبرگ معرفی من به شهر نیویورک بود، همانطور که برای بسیاری از هنرمندان و نوازندگان بیست سال پیش بود. \"محله از آن زمان به شدت تغییر کرده است، اما برای دهه‌ها، مردم در مکان‌هایی مانند جایی که ما می‌سازیم به دنبال جامعه بوده و پیدا کرده‌اند. دومینو شانس ما برای ادامه آن است: جایی که هنرمندان می‌توانند ایده‌های خود را توسعه دهند، مخاطبان می‌توانند چیز جدیدی را کشف کنند، و همسایه‌ها احساس می‌کنند به آنها تعلق دارند. محله‌ها تغییر می‌کنند. نیاز به مکانی مانند این هرگز وجود ندارد.» جن لیون، مالک MeanRed Productions و رئیس انجمن مکان مستقل نیویورک، می‌گوید: «محل‌های مستقل محله‌های بروکلین و اقتصاد زندگی شبانه نیویورک را ایجاد کردند. \"امید ما این است که شهر و ایالت از ما به عنوان یک صنعت حمایت کنند زیرا از مکان جدید TVG Hospitality و روحیه مستقلی که به بروکلین می آورد استقبال می کنیم.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/GettyImages-1499886432.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۱ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Keith Sweat Helps Build ‘Twin Pillars’ for New Tubi Drama Series", "link": "https://www.billboard.com/music/rb-hip-hop/keith-sweat-twin-pillars-new-tubi-series-1236379964/", "summary": "Keith Sweat , the singer-songwriter behind R B/pop classics such as “Twisted,” “Nobody” and “I Want Her,” is raising his voice in another medium. He is executive producer of the new drama Twin Pillars: A Series . The show’s first three episodes will be introduced Nov. 16 on Tubi. Sweat — who also portrays club owner Snow in the series — is working in tandem with producer/ choreographer Darrin Dewitt Henson, who created, directed and also stars in Twin Pillars: A Series. Twin Pillars focuses on fraternal twins Dre (Henson) and Maurice ( General Hospital ’s Alimi Ballard) who are placed in the foster care system as youngsters when their parents are incarcerated. As the brothers move forward in different directions, the storyline delves into how childhood adversity, family separation and life s choices influence their identities and futures. In addition to Sweat and Henson, the Twin Pillars cast includes Fat Joe, Sean Anthony Baker and Crystal Coney. “Music has always been my way of connecting with people through stories that speak to real-life experiences,” Sweat commented in the press announcement. “As an executive producer and actor on Twin Pillars , I have the opportunity to bring that same passion for storytelling to television. This series explores family, adversity and the choices that shape our lives. Darrin has created something meaningful, and I m proud to help bring a story to audiences that not only entertains but also sparks important conversations about resilience, family and second chances.” Concurrently, Sweat is preparing for the 2027 release of a new single, “Think Love.” Beginning with his 1987 debut album Make It Last Forever, he has logged five consecutive No. 1 albums on Billboard’s Top R B/Hip-Hop Albums chart during his career. Sweat also earned another No. 1 album on that tally in 2008 with Just Me . Beyond work as a director-producer-choreographer, Henson’s resumé lists various film and television acting credits. Among those credits: BET’s hit drama The Family Business , Soul Food: The Series and Stomp the Yard . Describing Twin Pillars : A Series as “more than a story about two brothers,” Henson further explained, “It s about the circumstances that shape us, the decisions that define us and the family connections that remain even when life pulls us in different directions. I wanted to create a series that reflects the complexity of the human experience, particularly for children whose lives are disrupted by circumstances they did no", "date_str": "2026-11-12T15:00:00+00:00", "hash": "f617837796ce9e59", "title_fa": "کیت عرق به ساخت «ستون‌های دوقلو» برای مجموعه‌های درام جدید توبی کمک می‌کند", "summary_fa": "کیت عرق، خواننده و ترانه سرای کلاسیک های R B/Pop مانند \"Twisted\"، \"Nobody\" و \"I Want Her\" صدای خود را در رسانه دیگری افزایش می دهد. او تهیه کننده اجرایی درام جدید Twin Pillars: A Series است. سه قسمت اول سریال 16 نوامبر در توبی معرفی می شود. عرق - که در سریال اسنو مالک باشگاه را نیز به تصویر می‌کشد - با تهیه‌کننده/ طراح رقص دارین دیویت هنسون، که خالق، کارگردان و همچنین ستاره‌دار سریال Twin Pillars: A Series است، کار می‌کند. ستون‌های دوقلو بر دوقلوهای برادر دره (هنسون) و موریس (علیمی بالارد از بیمارستان عمومی) تمرکز می‌کند که وقتی والدینشان در حبس هستند، در دوران جوانی در سیستم مراقبت از خانواده قرار می‌گیرند. همانطور که برادران در جهات مختلف به جلو حرکت می کنند، خط داستان به این می پردازد که چگونه ناملایمات دوران کودکی، جدایی خانواده و انتخاب های زندگی بر هویت و آینده آنها تأثیر می گذارد. علاوه بر Sweat و Henson، بازیگران Twin Pillars شامل Fat Joe، Sean Anthony Baker و Crystal Coney هستند. Sweat در بیانیه مطبوعاتی اظهار داشت: \"موسیقی همیشه راه من برای برقراری ارتباط با مردم از طریق داستان هایی است که به تجربیات واقعی زندگی می پردازند.\" \"به عنوان یک تهیه کننده اجرایی و بازیگر در ستون های دوقلو، من این فرصت را دارم که همان اشتیاق به داستان سرایی را به تلویزیون بیاورم. این مجموعه به بررسی خانواده، ناملایمات و انتخاب هایی می پردازد که زندگی ما را شکل می دهند. دارین چیزی معنادار خلق کرده است، و من مفتخرم که به ارائه داستانی برای مخاطبان کمک می کنم که نه تنها سرگرم کننده است، بلکه جرقه گفتگوهای مهمی در مورد انعطاف پذیری، خانواده و فرصت های دوم نیز می دهد.\" همزمان، عرق در حال آماده شدن برای انتشار یک تک آهنگ جدید در سال 2027 به نام \"Think Love\"", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Keith-Sweat-2026-press-cr-Denny-Mo-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۱ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Noga Erez Announces Fourth Album, ‘Duck Season,’ Drops Dark Pop Banger Single ‘People, I Hope You Know the World Is Ending’", "link": "https://www.billboard.com/music/pop/noga-erez-fourth-album-duck-season-world-ending-single-tour-1236380163/", "summary": "Noga Erez has seen the future and it is bleak. But it also has a great, catchy beat. The Tel Aviv, Israel-based singer/rapper laments the spiraling madness of modern life her new single, People, I hope you know the world is ending, the first taste of her upcoming fourth studio album, Duck Season . With her signature wit and laconic vocal style, Erez lists the litany of dumpster fires in the rapped verses on the song on which she laments, They never stopped delivering all the boxes/ That s the one thing/ They got you to step outside and see what the bombs did/ On God, over a loping beat. She continues cleverly weighing in on the various conflicts in our personal and collective lives with the lines: Let s weigh the options/ I think what it comes down to is we do Prozac or chocolate, right?/ You don t gotta wait for a siren to start runnin / You ran, I ran/ Wait, should we just send Baron?/ If we want a happy ending we could just a war with Thailand/ Send the Mossad to get a massage/ Hands up if you were on the island! The song then bursts into its soaring, uniting chorus, on which Erez sings, People, I hope you know the world is ending/ Oh yeah/ Don t you look so sad/ Oh no/ I hope you know the world is ending/ Oh yeah/ But we re going down together. Duck Season is due out on Feb. 26 t د تونی، در حال ساختن موفقیت‌های خود روی صفحه نمایش است، در حالی که Keyla Monterroso Mejia ممکن است پرکارترین ستاره‌ای باشد که در حال حاضر در تلویزیون کار می‌کند. داستان‌های مرتبط تلویزیون خارج از پردیس فصل 2 مجموعه‌های آوریل تاریخ اول پردیس THR داستان روی جلد رهایی چارلی دی املیو: چگونه ملکه TikTok زندگی خود را پس گرفت کلاس 2026 به فارغ‌التحصیلان نسل بعدی مانند Zendaya، Paul Mescal، Florence Pugh و اخیراً، David Jonsson تازه وارد پلنگ سیاه می‌پیوندد. مهم نیست که چگونه به این لحظه رسیده اند، این استعداد در حال حاضر مورد تقاضا است. همانطور که Sophie Nélisse برجسته است، رقابت داغ و جلیقه زردها می گوید: \"از نظر شغلی، این شلوغ ترین کاری است که من تا به حال داشته ام.\" در زمانی که کمدی‌های کمدی شبکه تقریباً منقرض شده‌اند و میانگین تعداد قسمت‌ها در یک فصل از کمدی‌های استریم که وجود دارند تک رقمی است (و این فصل‌ها تقریباً با فرکانس مشابه دنباله‌دار هالی می‌آیند)، مونتروسو مجیا توانسته است به چیزی تقریباً غیرممکن دست یابد:", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/TALENT_NEXT-GEN-WEB-LEADS_20262-SPLASH-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Hollywood Reporter", "title": "Rotterdam Film Festival, in Nod to ‘Backrooms’ and ‘Obsession,’ Sets Analog Horror 2.0 Focus", "link": "https://www.hollywoodreporter.com/movies/movie-news/rotterdam-2027-iffr-backrooms-nod-analog-horror-focus-1236753830/", "summary": "\"Recent horror hits, such as 'Obsession' and 'Backrooms,' mark the mainstream arrival of a cultural shift which has been in the making since the turn of the millennium.\" Also getting the focus treatment are Jordan Strafer, Slovenian filmmaker Andrej Zdravič, and the late Simon Field.", "date_str": "2026-11-12T14:00:00+00:00", "hash": "3200b2cfa10d0573", "title_fa": "جشنواره فیلم روتردام، در نود به «پشت‌خانه‌ها» و «وسواس»، فوکوس آنالوگ Horror 2.0 را تنظیم می‌کند.", "summary_fa": "فیلم‌های ترسناک اخیر، مانند «وسواس» و «پشت‌خانه‌ها» نشان‌دهنده ورود جریان اصلی یک تغییر فرهنگی است که از آغاز هزاره در حال شکل‌گیری بوده است.» جردن استرافر، فیلمساز اسلوونیایی آندری زدراویچ و سیمون فیلد فقید نیز تحت درمان قرار می گیرند. جشنواره بین‌المللی فیلم روتردام (IFFR) از برنامه‌های فوکوس خود برای نسخه ۲۰۲۷ خود، از جمله تمرکز بر فیلم ترسناک آنالوگ معاصر و نگاهی به آثار ایالات متحده، رونمایی کرد. هنرمند و فیلمساز جردن استرافر. برگزارکنندگان گفتند که روتردام همچنین «تأثیر ماندگار کاله بومان، تهیه‌کننده سوئدی را که شش دهه فعالیت او به شکل‌گیری نسل‌های فیلمساز کمک کرده است، جشن خواهد گرفت». برنامه‌ها با هم به بررسی ماهیت در حال تغییر سینما و افراد و تأثیراتی می‌پردازند که همچنان به شکل‌دهی آن ادامه می‌دهند، و دیدگاه‌های مختلف را گرد هم می‌آورند تا چگونگی ادامه تکامل رسانه، هم در صفحه و هم فراتر از آن را در نظر بگیرند.» تمرکز IFFR آنالوگ Nightmares 2.0 دارای اولین نمایش های جهانی مانند The Space Between اثر Joshua Garity و قسمت پایانی سریال YouTube Midwest Angelica: Landfall است که یک پروژه ترسناک، آنالوگ و کیهانی توسط استودیو AQ است. IFFR گفت: «آثارهای ترسناک اخیر، مانند Obsession و Backrooms، نشان دهنده ورود جریان اصلی یک تغییر فرهنگی است که از آغاز هزاره در حال شکل گیری بوده است. ترسناک آنالوگ با تکیه بر زیبایی‌شناسی رسانه‌های منسوخ، فیلم‌های یافت شده و پخش‌های تخیلی نگران‌کننده، زبان بصری و حساسیت متمایزی را ایجاد کرده است که توسط جوامع آنلاین، داستان‌گویی تعاملی و تخیل جمعی اینترنت شکل گرفته است. این پدیده با حرکت بین ویدیوهای آنلاین، بازی ها و بازی های واقعیت جایگزین، سینمای تئاتر و سایر اشکال ترانس مدیا، راه های جدیدی برای تجربه و درگیر شدن با وحشت ایجاد کرده است.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/The-Space-Between-film-still-IFFR-H-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Hollywood Reporter", "title": "LGBTQ Representation on TV Dropped in 2025-26, GLAAD Study Finds", "link": "https://www.hollywoodreporter.com/tv/tv-news/tv-lgbtq-representation-falls-2025-26-glaad-report-1236753347/", "summary": "Despite high-profile successes like 'Heated Rivalry,' the overall picture last season was less rosy.", "date_str": "2026-11-12T14:00:00+00:00", "hash": "d525ccbadae14540", "title_fa": "تحقیقات GLAAD نشان می دهد که نمایش LGBTQ در تلویزیون در سال 2025-26 کاهش یافته است", "summary_fa": "علیرغم موفقیت‌های برجسته‌ای مانند «رقابت داغ»، تصویر کلی فصل گذشته کمتر گلگون بود. علی‌رغم موفقیت‌های ناگهانی Heated Rivalry و برنده‌های متعدد امی برای Pluribus، فصل 2025-26 سال ضعیفی برای نمایندگی LGBTQ در تلویزیون بود. گزارش سالانه «جایی که هستیم» در تلویزیون GLAAD درباره وضعیت شخصیت‌های LGBTQ در سریال‌های فیلم‌نامه‌ای نشان می‌دهد که در فصل گذشته بازنمایی 25 درصد کاهش یافته است. این گزارش 369 شخصیت LGBTQ را در برنامه های پخش، پخش و شبکه های کابلی شمارش می کند که از 489 در فصل 2024-25 کمتر است. کاهش در میان شخصیت‌های تراجنسیتی به‌ویژه قابل توجه بود و از 33 نفر در سال‌های 2024-25 به تنها هفت نفر در فصل گذشته رسید - همه آنها در برنامه‌هایی که این فصل برنمی‌گردند. این لزوماً به این معنی نیست که در این فصل هیچ شخصیت ترنس در تلویزیون وجود نخواهد داشت، فقط نمایش‌هایی که آن هفت شخصیت در سال‌های 2025-2026 در آن ظاهر شدند، ادامه نمی‌یابند، چه به این دلیل که سریال‌های محدودی بودند، یا لغو شدند یا به اجرای مداوم پایان دادند. داستان‌های مرتبط رقابت شدید تلویزیون با نمایش‌های 4DX فیلم‌ها آغاز شد. آنها به شیوه هایی تهاجمی و خطرناک مورد هدف قرار گرفته اند. راینا دیرواتر، نویسنده اصلی گزارش و معاون مدیر تحقیقات سرگرمی و تجزیه و تحلیل موسسه رسانه ای GLAAD، گفت که زندگی از دست رفته است. اغلب می‌بینیم که رسانه‌ها آن را منعکس می‌کنند، و به دلیل بسیاری از گفتگوهای سیاسی، تعجب آور نیست که شاهد سقوط نمایندگان ترنس در تلویزیون باشیم. اما بسیار ناامید کننده است، به خصوص وقتی هنرمندان ترنس بزرگ زیادی وجود دارند که داستان های شگفت انگیزی را تعریف می کنند. در حال حاضر، نمایش‌های آن‌ها با نور سبز روشن نمی‌شوند، بنابراین باید در خارج از مکان‌های سنتی به آن‌ها بگویند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/01/hudson-williams-connor-storrie_3-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Hollywood Reporter", "title": "John Malkovich Recalls Spike Jonze’s Surprising Feedback for ‘Being John Malkovich’ in ’60 Minutes’ First Look", "link": "https://www.hollywoodreporter.com/movies/movie-news/john-malkovich-60-minutes-first-look-wild-horse-nine-1236753713/", "summary": "The actor's segment with Ariel Levy airs Sunday, timed to his acclaimed performance in 'Wild Horse Nine.'", "date_str": "2026-11-12T14:00:00+00:00", "hash": "e01ca5b490d1df7a", "title_fa": "جان مالکوویچ بازخورد غافلگیرکننده اسپایک جونز برای «جان مالکوویچ بودن» را در نگاه اول «60 دقیقه» به یاد می‌آورد.", "summary_fa": "بخش این بازیگر با آریل لوی یکشنبه پخش می شود و همزمان با بازی تحسین برانگیز او در «اسب وحشی نه» پخش می شود. با داغ شدن سر و صدای جوایز پیرامون فیلم جدیدش Wild Horse Nine، جان مالکوویچ در حال دریافت نمایه 60 دقیقه است. هالیوود ریپورتر دریافته است که مالکوویچ با آریل لوی برای قسمتی که در طول اپیزود یکشنبه مجله خبری CBS پخش می شود، می نشیند. مالکوویچ در کنار سم راکول و استیو بوشمی در فیلم کمدی جاسوسی مارتین مک‌دونا، مارتین مک‌دونا، در کنار سم راکول و استیو بوشمی بازی می‌کند و یکی از رقبای اصلی جایزه اسکار بهترین بازیگر مرد محسوب می‌شود. در طی یک کلیپ پیش‌نمایش که مختص THR است، مالکوویچ به لوی توضیح می‌دهد که اگرچه او نقش شخصیتی به همین نام را در کمدی اگزیستانسیال جان مالکویچ، کارگردان اسپایک جونز در سال 1999 بازی کرد، اما این تصویر ارتباط چندانی با خود واقعی او نداشت. داستان‌های مرتبط رتبه‌بندی تلویزیون: SNL با دروسکی به‌عنوان مجری تلویزیون دو سال به بالاترین حد خود رسیده است. نگاه اول به جوایز انتخاب بچه‌ها 2026 طراحی صحنه: ما واقعاً سعی کردیم یک زمین بازی بزرگ بسازیم (انحصاری) یک روز تمرین می‌کردیم - یادم نمی‌آید که چه بود - و اسپایک به من گفت، اینطوری مالی خوب بود، با پوزخند به یاد می آورد و من فقط فکر کردم که یادداشت فوق العاده ای بود. این بازیگر همچنین جان مالکویچ بودن را به خاطر دید منحصر به فردش ستایش می کند. ate": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
