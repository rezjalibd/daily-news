از کارکنان دفتر علی لاریجانی به مراحل پایانی رسیده و قرار است کیفرخواست این پرونده نیز پس از تکمیل مراحل قانونی صادر و به دادگاه ارسال شود. براساس اظهارات سخنگوی قوه قضاییه، حدود ۴۰۰ پرونده حقوقی در ارتباط با حملات آمریکا و اسرائیل در دادگستری‌های ایران تشکیل شده است. یکی از این پرونده‌ها بیش از ۳۵۰ هزار شاکی"}, {"source": "IranWire", "title": "یاشار سلطانی: جوجه اطلاعاتی‌ها مسوول فروش نفت ایران هستند", "link": "https://iranwire.com/fa/features/157779-%DB%8C%D8%A7%D8%B4%D8%A7%D8%B1-%D8%B3%D9%84%D8%B7%D8%A7%D9%86%DB%8C-%D8%AC%D9%88%D8%AC%D9%87-%D8%A7%D8%B7%D9%84%D8%A7%D8%B9%D8%A7%D8%AA%DB%8C%D9%87%D8%A7-%D9%85%D8%B3%D9%88%D9%88%D9%84-%D9%81%D8%B1%D9%88%D8%B4-%D9%86%D9%81%D8%AA-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D9%87%D8%B3%D8%AA%D9%86%D8%AF/", "summary": "«یاشار سلطانی»، روزنامه‌نگار و پژوهشگر حوزه فساد اقتصادی، در گفت‌وگویی درباره ساختار فروش نفت جمهوری اسلامی می‌گوید تحریم، بهانه‌ای برای ...", "date_str": "2026-09-18T16:40:01+00:00", "hash": "4ca86199c5e59bae", "title_fa": "یاشار سلطانی: جوجه اطلاعاتی‌ها مسوول فروش نفت ایران هستند", "summary_fa": "«یاشار سلطانی»، روزنامه‌نگار و پژوهشگر حوزه فساد اقتصادی، در گفت‌وگویی درباره ساختار فروش نفت جمهوری اسلامی می‌گوید تحریم، بهانه‌ای برای ... یاشار سلطانی، روزنامه‌نگار و پژوهشگر حوزه فساد اقتصادی، در گفت‌وگویی درباره ساختار فروش نفت جمهوری اسلامی می‌گوید تحریم، بهانه‌ای برای کنار گذاشتن شفافیت و مسوولیت‌پذیری در فروش یکی از مهم‌ترین دارایی‌های عمومی ایران شده است. یاشار سلطانی، روزنامه‌نگار و پژوهشگر حوزه فساد اقتصادی، در گفت‌وگویی درباره ساختار فروش نفت جمهوری اسلامی می‌گوید تحریم، بهانه‌ای برای کنار گذاشتن شفافیت و مسوولیت‌پذیری در فروش یکی از مهم‌ترین دارایی‌های عمومی ایران شده است. یاشار سلطانی می‌گوید طی حدود دو سال درباره شبکه فروش نفت ایران تحقیق کرده و هنوز به همه اطلاعات مورد نظرش دست نیافته است. او مدعی است برخلاف تصور رایج، بخش قابل توجهی از اطلاعات مربوط به کشتی‌ها، محموله‌ها، مسیرهای حمل و میزان خرید نفت ایران در بازارهای اطلاعاتی قابل دسترسی است. مهم‌ترین ادعای سلطانی اما درباره سرنوشت حدود ۱۰۰میلیون بشکه نفت ا که نخستین بار روزنامه «وال‌استریت ژورنال» گزارش داد، در ماه مه و در جریان آزمایشی رخ داد که یک شرکت مستقل ارزیابی امنیت سایبری آن را انجام می‌داد. خانم ادکینز در بیانیه‌ای به بی‌بی‌سی گفت: «ما اطمینان حاصل کردیم که آن سه شرکت از موضوع مطلع شوند. همچنین با بخش آموزش گوگل برای اعمال تغییراتی که اکنون در فرآیندهای آزمایشی‌شان ایجاد کرده‌اند، همکاری کردیم.» او افزود: «آزمایش‌های این‌چنینی اهمیت آموزش مدل‌های قدرتمند هوش مصنوعی برای عملکرد مسئولانه را برجسته می‌سازند.» اخیراً گزارش‌هایی از موارد مشابه هک توسط دیگر پلتفرم‌های هوش مصنوعی نیز منتشر شده است. در ماه ژوئیه، کلود، هوش مصنوعی شرکت آنتروپیک، از محیط آزمایشی خود خارج شد و سه سازمان را هک کرد. این اتفاق در حالی بود که تنها چند روز پیش از آن، اوپن‌ای‌آی (OpenAI) اعلام کرد که مدل‌هایش حملات سایبری علیه چند «سرویس عمومی» انجام داده‌اند. همزمان با ادامه بحث‌های عمومی درباره ایمنی توسعه این فناوری، گفت‌وگو درباره تدوین مقررات و"}, {"source": "BBC Persian", "title": "تبعات جنگ ایران؛ از حمله به مدرسه میناب تا اختلال در اقتصاد جهانی", "link": "https://www.bbc.com/persian/articles/ckddvq2yy820o?at_medium=RSS&at_campaign=rss", "summary": "هزینه جنگ ایران محور اصلی گزارش‌ها و تحلیل‌های امروز رسانه‌های آمریکاست؛ هزینه‌ای که فقط با میلیاردها دلار مخارج نظامی یا افزایش قیمت نفت سنجیده نمی‌شود. بلومبرگ از اشتباه اطلاعاتی منتهی به حمله مرگبار به مدرسه‌ای در میناب گزارش می‌دهد، واشنگتن‌پست از شمار نظامیان آمریکایی کشته‌شده‌ای می‌نویسد که از آمار رسمی پنتاگون بیشتر است و سی‌ان‌ان هزینه مستقیم جنگ را بیش از ۴۳ میلیارد دلار اعلام می‌کند. در همین حال، واشنگتن‌پست درباره پیامدهای گسترده‌تر جنگ برای اقتصاد جهانی هشدار می‌دهد.", "date_str": "2026-09-19T09:30:18+00:00", "hash": "24b1d2f0516cb7f2", "title_fa": "تبعات جنگ ایران؛ از حمله به مدرسه میناب تا اختلال در اقتصاد جهانی", "summary_fa": "هزینه جنگ ایران محور اصلی گزارش‌ها و تحلیل‌های امروز رسانه‌های آمریکاست؛ هزینه‌ای که فقط با میلیاردها دلار مخارج نظامی یا افزایش قیمت نفت سنجیده نمی‌شود. بلومبرگ از اشتباه اطلاعاتی منتهی به حمله مرگبار به مدرسه‌ای در میناب گزارش می‌دهد، واشنگتن‌پست از شمار نظامیان آمریکایی کشته‌شده‌ای می‌نویسد که از آمار رسمی پنتاگون بیشتر است و سی‌ان‌ان هزینه مستقیم جنگ را بیش از ۴۳ میلیارد دلار اعلام می‌کند. در همین حال، واشنگتن‌پست درباره پیامدهای گسترده‌تر جنگ برای اقتصاد جهانی هشدار می‌دهد. بلومبرگ در گزارشی تحقیقی به بررسی زنجیره‌ای از نارسایی‌های اطلاعاتی و عملیاتی آمریکا پرداخته است که به حمله مرگبار ۲۸ فوریه به دبستان «شجره طیبه» در میناب منجر شد؛ حمله‌ای که حدود ۱۲۰ کودک و در مجموع نزدیک به ۲۰۰ نفر در آن کشته شدند و از مرگبارترین موارد تلفات غیرنظامیان در عملیات نظامی آمریکا در دهه‌های اخیر به شمار می‌رود. بر اساس یافته‌های بلومبرگ، آمریکا این محل را سال‌ها پیش به‌عنوان یک تأسیسات نیروی دریایی سپاه پاسداران در فهرست اهداف بالقوه ثبت کرده بود. اما یک تحلیلگر اطلاعاتی در سال ۲۰۱۹ متوجه تغییر کاربری این مکان و تبدیل آن به مدرسه ابتدایی شده و این موضوع را در یک سامانه دیجیتال اطلاعاتی ثبت کرده بود. به نوشته بلومبرگ، این سامانه به پایگاه داده رسمی مورد استفاده برای تهیه و به‌روزرسانی اهداف نظامی متصل نبود. در نتیجه، هشدار تحلیلگر هرگز به فرماندهان مسئول عملیات نرسید و ساختمان در بررسی‌های بعدی همچنان بر اساس اطلاعات قدیمی ارزیابی شد. این مسئله اکنون به یکی از محورهای تحقیقات پنتاگون درباره حمله تبدیل شده است؛ تحقیقاتی که نتایج آن هنوز علنی نشده است. این ماجرا همچنین پرسش‌های گسترده‌تری درباره سازوکار تعیین اهداف، هماهنگی میان سامانه‌های اطلاعاتی و راستی‌آزمایی اطلاعات پیش از حملات مطرح کرده است. رابرت اشلی، رئیس پیشین آژانس اطلاعات دفاعی آمریکا، خواستار انتشار نتایج تحقیقات شده و تأکید کرده است که برای حفظ"}, {"source": "BBC Persian", "title": "قوه قضائیه ایران می‌گوید حسین پدران را به دلیل «جاسوسی برای اسرائیل» اعدام کرده است", "link": "https://www.bbc.com/persian/articles/cq8jdkgle7e8o?at_medium=RSS&at_campaign=rss", "summary": "قوه قضائیه ایران اعلام کرده است که یک شهروند این کشور که پس از محاکمه به اتهام جاسوسی برای اسرائیل، به مرگ محکوم شده بود را اعدام کرده است.", "date_str": "2026-09-19T06:44:19+00:00", "hash": "c9f23a9e915693a5", "title_fa": "قوه قضائیه ایران می‌گوید حسین پدران را به دلیل «جاسوسی برای اسرائیل» اعدام کرده است", "summary_fa": "قوه قضائیه ایران اعلام کرده است که یک شهروند این کشور که پس از محاکمه به اتهام جاسوسی برای اسرائیل، به مرگ محکوم شده بود را اعدام کرده است. خبرگزاری میزان، وابسته به قوه قضائیه گزارش داده است که این فرد حسین پدران، نام داشته و «اطلاعات سایت‌های نظامی حساس کشور در استان اصفهان را در اختیار موساد قرار داده بود.» در گزارش قوه قضائیه به زمان دقیق دستگیری، محل محاکمه و جزئیات مطرح شده در دادگاه اشاره نشده است. میزان گفته است «با توجه به تجهیزات کشف‌شده از حسین پدران و اعترافات وی، کیفرخواست پرونده به اتهام جاسوسی و همکاری اطلاعاتی به نفع رژیم صهیونیستی، شروع به همکاری اطلاعاتی با دولت متخاصم آمریکا از طریق ارائه درخواست همکاری و اعلام تمایل به سرویس جاسوسی دولت آمریکا و چند عنوان اتهامی دیگر صادر» شده بود. بر اساس گزارش میزان، در حکم دادگاه آقای پدران آمده است که او با ارائه اطلاعات حساس، طبقه‌بندی‌شده، سری و محرمانه نظامی به سرویس جاسوسی موساد و متعاقبا کسب عواید و منافع مالی کرده است» و «در نهایت به جرم جاسوسی و همکاری اطلاعاتی به نفع رژیم صهیونیستی به اعدام محکوم شد.» بر اساس گزارش خبرگزاری میزان حکم اعدام حسین پدران پس از تایید در دیوان عالی اجرا شده است. نهادهای حقوق بشری درباره افزایش چشمگیر احکام اعدام و اجرای این احکام در ایران در ماه های اخیر هشدار داده‌اند. در این گزارش‌ها درباره رعایت آئین دادرسی و محاکمهٔ عادلانه این افراد، از جمله دسترسی مناسب به وکیل، تردیدهای جدی مطرح شده است. مای ساتو، گزارشگر ویژه شورای حقوق بشر سازمان ملل متحد در امور ایران، گفته است که ایران از مجازات اعدام به عنوان «ابزار ایجاد رعب و وحشت در جامعه و سرکوب اعتراضات» استفاده می‌کند. به گفته مای ساتو، در یک سال اخیر تعداد اعدام‌ها در ایران به شکلی کم‌سابقه‌ بیشتر شده است؛"}, {"source": "BBC Persian", "title": "حضور حمزه بن‌لادن در ویدیوی تازه القاعده چه معنایی دارد؟", "link": "https://www.bbc.com/persian/articles/c8kg71l0ezw6o?at_medium=RSS&at_campaign=rss", "summary": "انتشار ویدیوی تبلیغاتی جدید القاعده به مناسبت بیست‌وپنجمین سالگرد حملات ۱۱ سپتامبر، بار دیگر توجه ناظران امنیتی را به حمزه بن‌لادن جلب کرده است. حضور مستقیم پسر اسامه بن‌لادن در این ویدیو، سال‌ه دفاعی آمریکا نیز نگرانی‌های مشابهی درباره واگذاری جنگنده‌های اف-۳۵ به عربستان سعودی مطرح کرده‌اند. آنها گفته‌اند ریاض ممکن است در چارچوب همکاری امنیتی دو کشور، این فناوری حساس را با چین به اشتراک بگذارد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. وزارت خارجه آمریکا هنگام اعلام این معامله گفت که این اقدام به تحقق «اهداف سیاست خارجی و امنیت ملی» آمریکا کمک خواهد کرد. این وزارتخانه گفت این معامله «امنیت یک متحد عمده خارج از ناتو را که نیرویی در جهت ثبات سیاسی و پیشرفت اقتصادی در منطقه خلیج فارس است» تقویت خواهد کرد."}, {"source": "BBC Persian", "title": "آمریکا و دانمارک می‌گویند در خصوص گرینلند به توافق دست یافته‌اند", "link": "https://www.bbc.com/persian/articles/ckrer1zeeq99o?at_medium=RSS&at_campaign=rss", "summary": "ایالات متحده و دانمارک از رسیدن به توافقی در خصوص امنیت گرینلند خبر داده‌اند. توافقی که به مناقشه دیپلماتیک ناشی از تهدیدهای دونالد ترامپ، رئیس‌جمهور آمریکا، برای تصرف این قلمرو با توسل به زور پایان می‌دهد.", "date_str": "2026-09-19T00:27:29+00:00", "hash": "34670fb4fd4cbaf6", "title_fa": "آمریکا و دانمارک می‌گویند در خصوص گرینلند به توافق دست یافته‌اند", "summary_fa": "ایالات متحده و دانمارک از رسیدن به توافقی در خصوص امنیت گرینلند خبر داده‌اند. توافقی که به مناقشه دیپلماتیک ناشی از تهدیدهای دونالد ترامپ، رئیس‌جمهور آمریکا، برای تصرف این قلمرو با توسل به زور پایان می‌دهد. آقای ترامپ گفته است که این توافق «کنترل دائمی بر امور امنیتی و تمامی نیازهای دیگر» را برای ایالات متحده فراهم می‌کند. نخست‌وزیر دانمارک هم اعلام کرد که این توافق «امنیت در منطقه قطب شمال و اقیانوس اطلس شمالی را تقویت می‌کند»، اما به جزئیات خاصی که دونالد ترامپ در پستش در شبکه‌های اجتماعی به آن‌ها اشاره کرده بود، نپرداخت. این توافق پس از ده‌ها ماه‌ تهدید از سوی آقای ترامپ برای «تصاحب» گرینلند به دلایل امنیتی ملی حاصل شد. تهدیدهایی که بر موقعیت راهبردی این منطقه برای اهداف دفاعی و همچنین منابع معدنی آن تأکید داشت. آقای ترامپ در پستی در شبکه اجتماعی تروث سوشال نوشت که این توافق «هیچ هزینه‌ای برای ایالات متحده ندارد» و به این کشور امکان می‌دهد تا برای «تأمین و حفظ امنیت گرینلند»، «هر اقدام ضروری» را انجام دهد. او افزود که این توافق شامل بندی است که بر اساس آن، هیچ‌یک از دشمنان ایالات متحده نمی‌توانند حضور نظامی در گرینلند داشته باشند یا «بدون تایید کتبی و صریح ما، سرمایه‌گذاری‌های حساسی در گرینلند انجام دهند.» مته فردریکسن، نخست‌وزیر دانمارک، تایید کرد که این توافق هفته آینده در حاشیه مجمع عمومی سازمان ملل متحد امضا خواهد شد. او گفت: «این توافق ضمن تقویت امنیت مشترک ما در منطقه قطب شمال و اقیانوس اطلس شمالی» حاکمیت و تمامیت ارضی پادشاهی دانمارک و حق تعیین سرنوشت مردم گرینلند را به رسمیت می‌شناسد.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. او افزود که این توافق هنوز باید به تصویب قانون‌گذاران برسد و «برای اجرایی شدن، باید مراحل پارلمانی"}, {"source": "BBC Persian", "title": "چند سناتور ارشد آمریکا خواستار تحقیق درباره حمله به مراسم عروسی در کوهستک شدند", "link": "https://www.bbc.com/persian/articles/c6gmrevg4m4do?at_medium=RSS&at_campaign=rss", "summary": "در آمریکا شش سناتور دموکرات روز جمعه خواستار تحقیقات کامل درباره حمله اول سپتامبر به منطقه کوهستک ایران شدند.", "date_str": "2026-09-18T21:49:30+00:00", "hash": "5903edb07bb7a156", "title_fa": "چند سناتور ارشد آمریکا خواستار تحقیق درباره حمله به مراسم عروسی در کوهستک شدند", "summary_fa": "در آمریکا شش سناتور دموکرات روز جمعه خواستار تحقیقات کامل درباره حمله اول سپتامبر به منطقه کوهستک ایران شدند. این حمله‌ منجر به کشته شدن غیرنظامیان حاضر در یک مراسم عروسی شد و کارشناسان تسلیحاتی و تحلیل‌های تصویری، اشاره کرده‌اند که در این حمله از مهمات آمریکایی استفاده شده است. در این حمله پنج نفر از جمله دو کودک و یک زن کشته و ده‌ها تن دیگر زخمی شدند. سناتور برایان شاتز، پتی موری، جین شاهین، جک رید، مارک وارنر و کریس کونز با صدور بیانیه‌ای مشترک، از پنتاگون خواستند تا درباره این حادثه تحقیق کرده و یافته‌های خود را به صورت عمومی منتشر کند. این ۶ سناتور دموکرات که سناتورهای ارشد کمیته های امنیت ملی هستند در بیانیه خود گفته‌اند گزارش‌ها مبنی بر اینکه حمله به خانه‌ای در «کوهستک» ایران احتمالاً ناشی از اصابت یک بمب آمریکایی منحرف‌شده از مسیر بوده است، تکان‌دهنده و عمیقاً نگران‌کننده است. این سناتورهای آمریکایی همچنین گفته‌اند: « این نخستین بار نیست که حملات ایالات متحده در جریان این جنگ انتخابی (جنگی که با تصمیم خود آمریکا آغاز شده) موجب تلفات غیرنظامیان می‌شود. این رویداد بار دیگر نگرانی‌های جدی را درباره بی‌توجهی دولت ترامپ به حفظ جان غیرنظامیان برمی‌انگیزد.» اخیراً، یک کمیته حقیقت‌یاب سازمان ملل هم اعلام کرد که دلایل موجهی برای این باور وجود دارد که ایالات متحده در جریان دو حمله هوایی در ماه فوریه، مرتکب جنایات جنگی شده است؛ حملاتی که یکی از آن‌ها مدرسه‌ای را در میناب هدف قرار داد و منجر به کشته شدن دست‌کم ۱۷۸ غیرنظامی، از جمله زنان و کودکان، شد. مکس دو پلسیس، کارشناس این کمیته حقیقت‌یاب، گفت که «حملات هوایی مکرر که به تلفات غیرنظامی منجر می‌شود، پرسش‌های جدی را مطرح می‌کند» از جمله اینکه آیا دولت‌ها بر اساس قوانین بشردوستانه بین‌المللی تمام تدابیر لازم را برای مصون ماندن غیرنظامیان به کار گرفته‌اند یا نه."}, {"source": "BBC Persian", "title": "انتخابات پارلمانی روسیه؛ چرا نتیجه از پیش معلوم همچنان برای پوتین مهم است؟", "link": "https://www.bbc.com/persian/articles/cq14dmkz0dp1o?at_medium=RSS&at_campaign=rss", "summary": "از نظام قدرت در روسیه اغلب با عنوان «دموکراسی مدیریت‌شده» یاد می‌شود؛ نظامی که در آن هدایت و کنترل امور در دست کرملین است. این بدان معناست که رئیس‌جمهور قدرت بسیار زیادی در اختیار دارد و صحنه سیاسی کمتر شاهد اتفاقات غیرمنتظره است.", "date_str": "2026-09-19T01:36:43+00:00", "hash": "4817bc0b439e052e", "title_fa": "انتخابات پارلمانی روسیه؛ چرا نتیجه از پیش معلوم همچنان برای پوتین مهم است؟", "summary_fa": "از نظام قدرت در روسیه اغلب با عنوان «دموکراسی مدیریت‌شده» یاد می‌شود؛ نظامی که در آن هدایت و کنترل امور در دست کرملین است. این بدان معناست که رئیس‌جمهور قدرت بسیار زیادی در اختیار دارد و صحنه سیاسی کمتر شاهد اتفاقات غیرمنتظره است. انتخابات این هفته بار دیگر پارلمانی را بر جای خواهد گذاشت که تحت کنترل حزب حاکم، «روسیه متحد»، است و از نمایندگانی تشکیل شده که به شدت به ولادیمیر پوتین وفادارند. منتقدان این رای‌گیری را نه آزاد و نه عادلانه می‌دانند. اما کرملین اهمیتی به گفته‌های منتقدان نمی‌دهد. دمیتری پسکوف، سخنگوی کرملین، اخیرا توضیح داد: «ما نظام سیاسی خودمان و فرآیند سیاسی خودمان را داریم.» این یعنی هیچ اتفاق غیرمنتظره‌ای برای کرملین در کار نیست. هیچ غافلگیری‌. پس سوژه‌ای هم وجود ندارد؟ اصلاً این‌طور نیست. برای کرملین، انتخاب ۴۵۰ نماینده برای مجلس سفلی پارلمان، دوما، مهم است. این نخستین انتخابات پارلمانی در این کشور از زمان تهاجم تمام‌ عیار روسیه به اوکراین است. کرملین از این انتخابات برای ادعای حمایت اکثریت روس‌ها از رئیس‌جمهور و جنگ استفاده خواهد کرد و همچنین آن را به ابزاری برای پیشبرد فعالیت سیاسی سربازانی که از اوکراین بازگشته‌اند تبدیل می‌کند؛ مقام‌ها می‌گویند نزدیک به دویست کهنه‌سرباز جنگ در این انتخابات شرکت دارند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. در مورد کارزار انتخاباتی نیز باید گفت که این کارزار، چهار سال و نیم پس از آغاز جنگ، پنجره‌ای به جامعه روسیه گشوده است. گفتم غافلگیری‌ در کار نیست. اما در چند غافلگیری هم بوده است. مجری تلویزیون دولتی گفت: «عصر بخیر و به سخنرانی‌های انتخاباتی امشب نامزدهای حوزه انتخابیه شماره ۱۵۸ دوما خوش آمدید.» سپس کارگردان استودیو تصویر را به نمایی باز برد که شش تریبون خالی را نشان می‌داد."}, {"source": "Radio Farda", "title": "فرمانده سنتکام: بیش از یک میلیارد بشکه نفت در ماه‌های اخیر از تنگه هرمز عبور کرده است", "link": "https://www.radiofarda.com/a/centcom-chief-over-1-billion-barrels-of-crude-passed-through-hormuz/33859426.html", "summary": ".", "date_str": "2026-09-19T13:42:37+00:00", "hash": "09cdab0f24c4258d", "title_fa": "فرمانده سنتکام: بیش از یک میلیارد بشکه نفت در ماه‌های اخیر از تنگه هرمز عبور کرده است", "summary_fa": "دریاسالار برد کوپر، فرمانده سنتکام، روز شنبه ۲۸ شهریور اعلام کرد طی چند ماه گذشته بیش از یک میلیارد بشکه نفت خام کشورهای حاشیه خلیج فارس از تنگه هرمز عبور کرده، در حالی که به گفته او، ایران به دلیل محاصره دریایی آمریکا «حتی یک بشکه نفت» صادر نکرده است. آقای کوپر در ویدئویی که فرماندهی مرکزی ایالات متحده منتشر کرد، گفت نیروهای آمریکایی با «حفاظت هماهنگ» به عبور بیش از دو هزار کشتی تجاری از تنگه هرمز کمک کرده‌اند و مسیرهای اصلی کشتیرانی در این تنگه نیز از مین پاک شده است. پیش از این دونالد ترامپ، رئیس‌جمهور ایالات متحده، نیز در چند نوبت از «مین‌روبی» تنگه هرمز توسط ارتش آمریکا خبر داده و گفته بود کشورش بر این آبراه راهبردی تسلط کامل دارد. فرمانده سنتکام همچنین گفت حجم نفت خام، محموله‌های تجاری و گاز طبیعی مایع عبوری از تنگه هرمز طی دو هفته گذشته از هر مقطع دیگری در شش ماه گذشته بیشتر بوده است. کریس رایت، وزیر انرژی آمریکا، روز ۲۵ شهریور اعلام کرد حدود ۱۸ میلیون بشکه نفت در روز سه‌شنبه از خلیج فارس خارج شده است. او به با شبکه فاکس‌نیوز گفت جریان انتقال نفت از خلیج فارس اکنون به سطحی رسیده که «تقریباً معادل پیش از درگیری» است. همزمان خبرگزاری فرانسه هم گزارش داده بود که ایجاد یک گذرگاه حفاظت‌شده توسط ایالات متحده در تنگه هرمز، جریان نفت را از این آبراه راهبردی به‌طور چشمگیری افزایش داده، اما بررسی داده‌های شرکت‌های ردیابی کشتی نشان می‌داد به‌طور کلی میانگین میزان انتقال نفت هنوز حدود نصف سطح پیش از جنگ است. پیش از آغاز جنگ آمریکا و اسرائیل علیه ایران در نهم اسفند پارسال، تنگه هرمز محل انتقال حدود ۲۰ درصد از نفت خام و کاز مایع مصرفی جهان بود. ارزیابی‌ها حاکی از عبور حدود ۱۸ میلیون بشکه نفت در روز پیش از این جنگ است."}, {"source": "Radio Farda", "title": "«آتش و دود» در اطراف فرودگاه ریاض در پی تشدید درگیری بین عربستان سعودی و حوثی‌ها", "link": "https://www.radiofarda.com/a/flames-smoke-seen-near-riyadh-airport/33859417.html", "summary": "رسانه‌ها گزارش می‌دهند که روز شنبه ۲۸ شهریور در پی شنیده شدن صدای انفجارها در ریاض، ستون بزرگی از دود در نزدیکی فرودگاه اصلی پایتخت عربستان سعودی مشاهده شد.", "date_str": "2026-09-19T13:06:00+00:00", "hash": "48e7ba7f9c2e63d4", "title_fa": "«آتش و دود» در اطراف فرودگاه ریاض در پی تشدید درگیری بین عربستان سعودی و حوثی‌ها", "summary_fa": "رسانه‌ها گزارش می‌دهند که روز شنبه ۲۸ شهریور در پی شنیده شدن صدای انفجارها در ریاض، ستون بزرگی از دود در نزدیکی فرودگاه اصلی پایتخت عربستان سعودی مشاهده شد. ویدئوها و تصاویر خبرگزاری رویترز ستونی عظیم از دود سیاه را در این منطقه نشان می‌داد که بزرگراه فرودگاه، ساختمان اصلی ترمینال و دیگر تأسیسات در پیش‌زمینهٔ آن دیده می‌شدند. خبرگزاری فرانسه نیز به نقل از ساکنان ریاض، دیده شدن آتش و دود در جهت فرودگاه این شهر را گزارش داد و اعلام کرد آتش‌نشانان در تلاش بودند آتش یک مخزن سوخت را که نشان شرکت نفتی آرامکو عربستان روی آن دیده می‌شد، در نزدیکی فرودگاه خاموش کنند. دفاع مدنی عربستان طی شب از طریق پیامک تلفنی دربارهٔ خطر احتمالی در ریاض و شهر الخرج، در شرق پایتخت، هشدارهایی ارسال کرد و صبح شنبه پس از آن اعلام کرد وضعیت به حالت عادی بازگشته است. خبرنگاران رویترز و خبرگزاری فرانسه گفته‌اند در ریاض پیش از صدور پیام پایان هشدار، صدای انفجارهایی را شنیدند. وب‌سایت ردیابی پرواز «فلایت‌رادار» در ادامه از «اختلالات گسترده» در فرودگاه بین‌المللی ملک خالد ریاض خبر داد و این فرودگاه را در بالاترین سطح شاخص اختلالات خود قرار داد. پس از آغاز جنگ آمریکا و اسرائیل علیه ایران در اسفند سال گذشته، چندین هشدار در ریاض صادر شده بود، اما این نخستین هشدارها از زمان تشدید درگیری با حوثی‌ها در ماه ژوئیه بود. شورشیان حوثی که تحت حمایت جمهوری اسلامی ایران هستند و کنترل پرجمعیت‌ترین مناطق یمن و بخش عمده شمال این کشور را در اختیار دارند، از زمان اعلام محاصره دریایی عربستان در ماه ژوئیه، حملاتی را به سوی این کشور انجام داده‌اند و کشتی‌های سعودی در دریای سرخ را هدف قرار داده‌اند. این حملات تهدیدهای جدیدی را متوجه عرضه جهانی نفت کرده و مسیر اصلی جایگزین دریای سرخ برای صادرات نفت کشورهای خلیج فارس را در"}, {"source": "Radio Farda", "title": "آمریکا، دانمارک و گرینلند توافق امنیتی تازه‌ای اعلام کردند", "link": "https://www.radiofarda.com/a/us-greenland-pact/33859366.html", "summary": "آمریکا، دانمارک و گرینلند از دستیابی به توافقی تازه دربارهٔ امنیت این قلمرو خودمختار دانمارک خبر داده‌اند.", "date_str": "2026-09-19T10:13:26+00:00", "hash": "8b6c8608c1bd0c06", "title_fa": "آمریکا، دانمارک و گرینلند توافق امنیتی تازه‌ای اعلام کردند", "summary_fa": "آمریکا، دانمارک و گرینلند از دستیابی به توافقی تازه دربارهٔ امنیت این قلمرو خودمختار دانمارک خبر داده‌اند. دونالد ترامپ، رئیس‌جمهور آمریکا، روز شنبه ۲۸ شهریور اعلام کرد این توافق به ایالات متحده امکان می‌دهد آنچه را برای تأمین امنیت گرینلند و آمریکا لازم می‌داند، انجام دهد. او گفت هیچ رقیب آمریکا بدون تأیید کتبی واشینگتن حق ایجاد پایگاه یا حضور نظامی در گرینلند و نیز سرمایه‌گذاری در بخش‌های حساس آن را نخواهد داشت و افزود این توافق تاریخ انقضا ندارد. همزمان، مقام‌های دانمارکی و گرینلندی از توافق استقبال کردند. مته فردریکسن، نخست‌وزیر دانمارک، گفت این توافق حاکمیت و تمامیت ارضی پادشاهی دانمارک و حق مردم گرینلند برای تعیین سرنوشت خود را به رسمیت می‌شناسد. یِنس-فردریک نیلسن، نخست‌وزیر گرینلند، نیز گفت توافق با آمریکا امنیت این قلمرو را تقویت می‌کند. لارس لوکه راسموسن، وزیر خارجهٔ دانمارک، روز شنبه گفت امید دارد دوره‌ای طولانی از ابهام، جای خود را به «توافقی الزام‌آور» بدهد که امنیت قطب شمال و اقیانوس اطلس شمالی را تقویت می‌کند. او در پیامی در شبکه‌های اجتماعی گفت مفاد توافق، خط قرمزهای دانمارک را رعایت می‌کند و با توجه به دگرگونی وضعیت امنیتی، اهمیت دارد. با این حال، جزئیات اجرایی توافق هنوز علنی نشده است. دانمارک و گرینلند گفته‌اند قرار است توافق هفتهٔ آینده در حاشیهٔ مجمع عمومی سازمان ملل متحد در نیویورک امضا شود. روشن نیست که این توافق چه تفاوتی با تفاهمی دارد که ترامپ در ژانویهٔ امسال پس از گفت‌وگو با مارک روته، دبیرکل ناتو، دربارهٔ گرینلند از آن خبر داده بود. آمریکا اکنون پایگاه پیتوفیک را در شمال گرینلند در اختیار دارد. پیمان دفاعی سال ۱۹۵۱ میان واشینگتن و کپنهاگ، که در سال ۲۰۰۴ به‌روزرسانی شد، به ایالات متحده اجازه می‌دهد با اطلاع قبلی به دانمارک و گرینلند، نیروها و تأسیسات نظامی خود را در این جزیره افزایش دهد."}, {"source": "Radio Farda", "title": "قوه قضائیه ایران از اعدام یک متهم به «جاسوسی برای اسرائیل» خبر داد", "link": "https://www.radiofarda.com/a/iran-executes-man-accused-of-providing-missile-info-to-israel-judiciary/33859298.html", "summary": "قوه قضائیه جمهوری اسلامی از اجرای حکم اعدام حسین پدران، متهم به جاسوسی و همکاری اطلاعاتی با موساد، خبر داد.", "date_str": "2026-09-19T06:09:36+00:00", "hash": "cfa896990754cb69", "title_fa": "قوه قضائیه ایران از اعدام یک متهم به «جاسوسی برای اسرائیل» خبر داد", "summary_fa": "قوه قضائیه جمهوری اسلامی از اجرای حکم اعدام حسین پدران، متهم به جاسوسی و همکاری اطلاعاتی با موساد، خبر داد. خبرگزاری میزان، وابسته به قوه قضائیه، روز شنبه ۲۸ شهریور مدعی شد او اطلاعات مربوط به سایت‌های نظامی حساس در استان اصفهان، از جمله اطلاعاتی درباره افراد شاغل در این مراکز، را در اختیار موساد قرار داده بود. بر پایهٔ این گزارش، مقام‌های قضایی ایران می‌گویند حسین پدران «با انگیزهٔ مالی» ابتدا برای برقراری ارتباط با سازمان اطلاعات مرکزی آمریکا اقدام کرده و سپس با موساد تماس گرفته است. میزان همچنین مدعی شد بررسی «ارتباطات رمزگذاری‌شدهٔ او» نشان می‌دهد اطلاعات ارسالی‌اش می‌توانسته در حمله به برخی اهداف نظامی در جریان جنگ ۱۲ روزه به کار رفته باشد. قوه قضائیه گفته است حکم اعدام پس از رسیدگی قضایی و و تأیید دیوان عالی کشور اجرا شد. خبرگزاری میزان جزئیاتی درباره زمان و محل اجرای حکم منتشر نکرده است. ادعاهای مطرح‌شده از سوی قوه قضائیه به‌طور مستقل قابل راستی‌آزمایی نیست. در سال‌های گذشته، شماری از زندانیان سیاسی و امنیتی در ایران گفته‌اند که اعتراف‌هایشان زیر فشار، تهدید یا شکنجه گرفته شده است. نهادهای حقوق بشری نیز بارها از نبود دادرسی عادلانه و دسترسی مؤثر متهمان به وکیل در پرونده‌های امنیتی انتقاد کرده‌اند؛ از این رو، ادعاها و اعتراف‌های منتسب به متهمان از سوی دستگاه‌های امنیتی و قضایی جمهوری اسلامی به‌طور مستقل قابل راستی‌آزمایی نیست. به تازگی سازمان دیده‌بان حقوق بشر و مرکز حقوق‌بشری عبدالرحمن برومند در گزارشی مشترک اعلام کردند مقام‌های جمهوری اسلامی در ماه‌های اخیر معترضان و مخالفان سیاسی را به‌طور هفتگی و پس از محاکمه‌هایی «به‌شدت ناعادلانه» اعدام کرده‌اند و ده‌ها نفر دیگر نیز با خطر قریب‌الوقوع اعدام روبه‌رو هستند. این موج اعدام‌های سیاسی همزمان با افزایش چشمگیر کل اعدام‌ها در ایران رخ داده است. مرکز عبدالرحمن برومند می‌گوید در سال ۲۰۲۵ میلادی دست‌کم دو هزار و ۱۱۳ نفر در"}, {"source": "Radio Farda", "title": "ترامپ قانون تحریم‌های تازه علیه روسیه و مرتبط با ایران را امضا کرد", "link": "https://www.radiofarda.com/a/trump-signs-bill-authorizing-broad-new-sanctions-to-squeeze-russia/33859290.html", "summary": "دونالد ترامپ، رئیس‌جمهور ایالات متحده، روز جمعه ۲۷       tech: [{"source": "MIT AI", "title": "A new chapter for MIT Reads", "link": "https://news.mit.edu/2026/new-chapter-mit-reads-0918", "summary": "As it marks its 10-year anniversary, MIT Reads is being reimagined for the age of artificial intelligence. Recognizing the need to foster social connection and a sense of our shared humanity, the popular MIT Libraries’ program will turn its focus to fiction and memoir, and to the particular power of stories to help us understand ourselves and our place in the world. “At MIT, we spend a great deal of time on imagining and building for the future. Reading fiction prompts us to think about how what we build might change us,” says MIT Libraries Director Chris Bourg. “Reading together also gives us the increasingly rare opportunity for both individual reflection and shared connection.” MIT Reads is also evolving with MIT as it explores AI’s influence on the education landscape and the social fabric of the Institute. The value of collective reading, reflection, and discussion has never been more relevant. A recently released report from MIT’s Ad Hoc Committee on AI Use in Teaching, Learning, and Research Training urges strengthening social connection and personal well-being, citing MIT Reads as a way to “engage many more people across campus in conversation about shared norms and why community matters.” Launched in 2016, MIT Reads was designed to foster empathy, understanding, and belonging within the campus community. Each selected book is accompanied by programming such as talks by the featured author, panel discussions, and small-group conversations facilitated by library staff. The program’s reach extends well beyond MIT. Most author events are open to the public and streamed online, and videos of MIT Reads talks have been viewed more than 5,000 times. To mark this new era of MIT Reads, President Sally Kornbluth has selected the fall 2026 book “Exhalation,” by Ted Chiang. “Exhalation” is a bestselling collection of short stories, named one of The New York Times ’ best books of 2019. In it, Chiang creates thought-provoking science fiction scenarios involving robots, time travel, and alternate universes, while exploring timely issues of identity, free will, language, and the impacts of technology. “With the stories in his 2019 ‘Exhalation’ collection, Ted Chiang offered an uncanny preview of many issues we’re grappling with now concerning technology, particularly the relationship between humans and artificial intelligence,” says Kornbluth. “He raises deep questions about the future that humans and machines will share and offers provocative ideas and possibilit", "date_str": "2026-09-18T16:30:00+00:00", "hash": "9442cb2c4246f5f7", "title_fa": "فصل جدیدی برای MIT Reads", "summary_fa": "همزمان با 10 سالگی، MIT Reads دوباره برای عصر هوش مصنوعی طراحی شده است. با درک نیاز به تقویت ارتباط اجتماعی و احساس انسانیت مشترک، برنامه محبوب کتابخانه‌های MIT تمرکز خود را به داستان‌ها و خاطرات و قدرت خاص داستان‌ها معطوف می‌کند تا به ما در درک خود و جایگاه خود در جهان کمک کند. در MIT، ما زمان زیادی را صرف تخیل و ساختن آینده می‌کنیم. کریس بورگ، مدیر کتابخانه‌های MIT، می‌گوید: خواندن داستان‌ها ما را وادار می‌کند تا به این فکر کنیم که چگونه چیزی که می‌سازیم ممکن است ما را تغییر دهد. MIT Reads همچنین در حال توسعه با MIT است زیرا تأثیر هوش مصنوعی بر چشم‌انداز آموزشی و بافت اجتماعی مؤسسه را بررسی می‌کند. ارزش خواندن جمعی، تأمل و بحث هرگز به این اندازه مرتبط نبوده است. گزارشی که اخیراً از کمیته موقت MIT در مورد استفاده از هوش مصنوعی در آموزش، یادگیری و آموزش تحقیقاتی منتشر شده است، تقویت ارتباط اجتماعی و رفاه شخصی را توصیه می کند و از MIT Reads به عنوان راهی برای \"درگیر کردن افراد بیشتری در سراسر دانشگاه در مورد هنجارهای مشترک و چرایی اهمیت جامعه\" نام می برد. MIT Reads که در سال 2016 راه اندازی شد، برای تقویت همدلی، درک و تعلق در جامعه دانشگاه طراحی شد. هر کتاب منتخب با برنامه‌هایی مانند گفتگوهای نویسنده برجسته، بحث‌های میزگرد و گفتگوهای گروهی کوچک که توسط کارکنان کتابخانه تسهیل می‌شود، همراه است. دامنه دسترسی این برنامه بسیار فراتر از MIT است. اکثر رویدادهای نویسنده برای عموم آزاد هستند و به صورت آنلاین پخش می شوند و ویدیوهای گفتگوهای MIT Reads بیش از 5000 بار مشاهده شده است. رئیس جمهور سالی کورنبلوت، رئیس جمهور سالی کورنبلوت، به مناسبت این دوره جدید ریدز MIT، کتاب پاییز 2026 \"Exhalation\" اثر تد چیانگ را انتخاب کرده است. \"بازدم\" مجموعه ای پرفروش از داستان های"}, {"source": "TechCrunch AI", "title": "Vals, backed by Andreessen Horowitz, is looking to become the gold standard for AI benchmarking", "link": "https://techcrunch.com/2026/09/19/vals-backed-by-andreessen-horowitz-is-looking-to-become-the-gold-standard-for-ai-benchmarking/", "summary": "Vals AI is hoping to make AI benchmarking a more neutral and trustworthy resource in a world increasingly inundated by AI models.", "date_str": "2026-09-19T13:00:00+00:00", "hash": "046de78eecb6f51b", "title_fa": "Vals با پشتیبانی آندرسن هوروویتز به دنبال تبدیل شدن به استاندارد طلایی برای محک زدن هوش مصنوعی است.", "summary_fa": "Vals AI امیدوار است در دنیایی که به طور فزاینده ای توسط مدل های هوش مصنوعی غرق شده است، معیارهای هوش مصنوعی را به منبعی خنثی تر و قابل اعتمادتر تبدیل کند. بنچمارک کردن به یک استاندارد صنعت تبدیل شده است که چگونه شرکت‌های هوش مصنوعی قابلیت‌های مدل‌های خود را تایید می‌کنند و وقتی معیارها به نفع آنها تغییر می‌کند، از رقبا متمایز می‌شوند و برتری خود را تبلیغ می‌کنند. به عبارت دیگر، معیارهای خوب تقریباً همیشه به معنای روابط عمومی خوب هستند. متأسفانه، شرکت‌ها همچنین متوجه شده‌اند که چگونه از سیستم‌های بنچمارک قدیمی غلبه کنند - که بسیاری از آنها قدیمی‌تر هستند و برای اندازه‌گیری قابلیت‌های مدل‌های مدرن ساخته نشده‌اند. Vals، استارت آپی که در سال 2024 تأسیس شد، می گوید که در حال انجام ماموریت است تا این سیستم بسیار ناقص را تعمیر کند. در بازه زمانی کمتر از دو سال، این شرکت خود را به عنوان یک حضور قابل توجه در صنعت فناوری تثبیت کرد و سال گذشته موفق شد یک دور اولیه به رهبری 8VC و بلومبرگ بتا را تضمین کند. سپس، ماه گذشته، پس از یک دوره رشد سریع، 40 میلیون دلار در سریال A به رهبری آندریسن هوروویتز جمع آوری کرد. مرکز داده کوچکی که به مخزن بسته شده است، گرم می شود. به سیلندر آب گرم خانه او در لندن، یک سرور کامپیوتر فشرده متصل است که گرما تولید می کند و سپس در حین کار آن را منتقل می کند. ادامه مطلب... گیبسون از مزایای آب گرم زمانی که به آن نیاز دارد با هزینه کمتری بهره می برد، در حالی که گرمای تولید شده توسط سرور در هوا از بین نمی رود، که یک مشکل زیست محیطی بزرگ با مراکز داده بزرگ در سراسر جهان است. او می‌گوید: «به محض اینکه در مورد آن خواندم، فکر کردم: «این واضح است - چرا این کار را نمی‌کنید؟» منطقی است که کامپیوتر را از مرکز داده بیرون بیاورید و آن را در کنار مخزن آب خود ببندید و گرمای رایگان دریافت کنید. گیبسون تخمین می‌زند که قبض آب گرم خانه چهار خوابه‌اش در جنوب شرقی لندن بین 10 تا 15 پوند در ماه از زمان نصب سیستم در سال گذشته کاهش یافته است. گیبسون می‌گوید: «بنابراین، بیش از یک سال، اضافه می‌شود، و این فقط یک چیز اضافی کوچک است که کمک می‌کند. \"داشتن یکی از این واحدها بی معنی است.\" با توجه به افزایش مجدد قبوض انرژی داخلی در ماه آینده، و نگرانی فزاینده در مورد تأثیر مراکز داده در مقیاس بزرگ بر محیط زیست، پروژه‌های زیادی در حال بررسی چگونگی مهار گرمای خارج شده توسط رایانه‌ها هستند. سیستم گیبسون که توسط شرکت Heta مستقر در Surrey عرضه می‌شود، یکی از تعدادی ایده‌های نوآورانه در بازار است که هدف"}, {"source": "The Guardian AI", "title": "Tasmanian justice department review under way after AI and fake citation used in murderer’s parole decision", "link": "https://www.theguardian.com/australia-news/2026/sep/19/tasmania-justice-department-review-ai-artificial-intelligence-fake-citation-murderer-parole-decision-ntwnfb", "summary": "Parole condition of convicted killer Susan Neill-Fraser deemed invalid after board cited non-existent case law Get our breaking news email , free app or daily news podcast A review of potential artificial intelligence use in parole decisions will be undertaken after a “concerning” error in the case of a high-profile murderer. Tasmania’s justice department on Friday evening confirmed the review was occurring, four days after a parole condition of convicted killer Susan Neill-Fraser was deemed invalid. Continue reading...", "date_str": "2026-09-19T06:21:51+00:00", "hash": "8a385ebeefa23656", "title_fa": "بررسی وزارت دادگستری تاسمانی پس از استفاده از هوش مصنوعی و استناد جعلی در تصمیم آزادی مشروط قاتل در حال انجام است.", "summary_fa": "شرایط آزادی مشروط قاتل محکوم، سوزان نیل-فریزر، پس از استناد هیئت مدیره به قانون قضایی غیرقانونی، نامعتبر تلقی شد. ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید مروری بر استفاده بالقوه هوش مصنوعی در تصمیمات آزادی مشروط پس از یک خطای \"نگران کننده\" در مورد یک قاتل مطرح انجام می شود. وزارت دادگستری تاسمانی عصر جمعه تایید کرد که این بازبینی انجام شده است، چهار روز پس از آن که شرایط آزادی مشروط قاتل محکوم سوزان نیل فریزر نامعتبر تلقی شد. ادامه خواندن... نیل فریزر در سال 2022 پس از گذراندن 13 سال زندان به دلیل قتل شریک زندگی خود باب چاپل در قایق تفریحی آنها در سال 2009، با آزادی مشروط آزاد شد. هیئت آزادی مشروط ایالتی بعداً شرایطی را اضافه کرد که او را از صحبت با رسانه ها برای ادعای بی گناهی یا محکومیت نادرست ادعایی اش باز می داشت. روز سه شنبه، پس از یک چالش قانونی از سوی نیل-فریزر، دادگاه عالی تاسمانی حکم داد که این شرط بی اعتبار است و بدون انصاف رویه ای انجام شده است. در دادگاه فاش شد که هیئت آزادی مشروط به سندی که با کمک هوش مصنوعی تهیه شده است و به قانون مورد استناد کرده است که وجود نداشته است اعتماد کرده است. سخنگوی وزارت دادگستری گفت: «این وزارتخانه برای تعیین میزان استفاده از هوش مصنوعی برای اطلاع‌رسانی به تصمیمات قبلی هیئت آزادی مشروط تاسمانی، بازنگری را انجام خواهد داد.» \"در حالی که بررسی در حال انجام است، بخش نمی تواند اظهار نظر بیشتری کند.\" هیئت آزادی مشروط یک نهاد تصمیم گیری مستقل در این بخش است. گرگ بارنز، رئیس سرویس حقوقی زندانیان تاسمانی، گفت که شرایطی که نیل-فریزر در نظر گرفته شده بود، عمیقاً نگران‌کننده بود، و اینکه رویه قضایی مورد استناد بررسی نشد، فوق‌العاده بود."}, {"source": "The Guardian AI", "title": "Why Europe has been absent from the great AI safety debate", "link": "https://www.theguardian.com/technology/2026/sep/18/europe-ai-safety-debate", "summary": "Though Europe has measures that address how consumers might encounter AI, technology will impact them if the worst scenarios bear Europe’s dilemma over AI was rendered in stark terms this week. The head of the continent’s central bank, Christine Lagarde, said Europeans have two options: shun the technology and lose out on growth; or embrace it and become dependent on tools developed by the US and China. The great debate over AI safety that has erupted in recent days threatens to make the choice moot. If the worst scenarios come to bear – and experts have differing views on this – then the technology will impact the continent regardless. Continue reading...", "date_str": "2026-09-18T18:37:36+00:00", "hash": "2e3dc1be78098fb4", "title_fa": "چرا اروپا در بحث بزرگ ایمنی هوش مصنوعی غایب بوده است؟", "summary_fa": "اگرچه اروپا تدابیری دارد که به نحوه مواجهه مصرف‌کنندگان با هوش مصنوعی می‌پردازد، اما اگر بدترین سناریوها معضل اروپا در مورد هوش مصنوعی را در این هفته به طور واضح بیان کنند، فناوری بر آنها تأثیر خواهد گذاشت. رئیس بانک مرکزی این قاره، کریستین لاگارد، گفت که اروپایی ها دو گزینه دارند: اجتناب از فناوری و از دست دادن رشد. یا آن را بپذیرید و به ابزارهای توسعه یافته توسط ایالات متحده و چین وابسته شوید. بحث بزرگ در مورد ایمنی هوش مصنوعی که در روزهای اخیر مطرح شده است، این انتخاب را تهدید می کند. اگر بدترین سناریوها به وقوع بپیوندد - و کارشناسان نظرات متفاوتی در این مورد داشته باشند - بدون در نظر گرفتن این موضوع، این فناوری بر این قاره تأثیر خواهد گذاشت. به خواندن ادامه دهید... اروپا تا حد زیادی در بالاترین سطوح آن بحث غایب بوده است، که نتیجه ناتوانی طولانی مدت این قاره در تولید یک غول پیکر در مقیاس سیلیکون ولی مانند اپل، گوگل یا OpenAI تازه وارد است. در حالی که این یک نیروگاه در مقررات است، که باعث ناراحتی کاخ سفید شده است، فقدان پیشتاز آنتروپیک یا انویدیا در رقابت هوش مصنوعی، صدای آن را در بحث ایمنی کاهش داده است. اورسولا فون در لاین، یک شخصیت سیاسی قدرتمند در قاره به عنوان رئیس کمیسیون اروپا، بازوی اجرایی اتحادیه اروپا، این هفته به این موضوع پرداخت و گفت که از آزمایشگاه‌های اصلی مرزی برای بحث در مورد اینکه چگونه می‌توانیم از تلاش‌های صنعتی در حال انجام برای سرعت بخشیدن به مرزها حمایت کنیم، به این موضوع پرداخت. سخنان او به اندازه رد کندی رشد اقتصادی دونالد ترامپ و چین مورد توجه قرار نگرفت. بدون حمایت واشنگتن یا پکن، هر نوع گامی غیرممکن است – با کمک ما بدون مشارکت اروپا. سخنرانی لاگارد در روز دوشنبه بر ضعف نسبی این قاره"}, {"source": "The Guardian AI", "title": "Could AI pose a serious threat to our existence? | Letters", "link": "https://www.theguardian.com/technology/2026/sep/18/could-ai-pose-a-serious-threat-to-our-existence", "summary": "Readers respond to the warning from a former Anthropic researcher that the technology could ‘kill us all’ by the end of the decade Here we go again with another round of tech bros claiming that AI is going to develop superintelligence and kill us all ( More Anthropic researchers warn of AI’s perils but Musk dismisses ‘psyop’, 10 September ). We’ve heard this before. Many, many times. It’s the familiar plotline of pretty much every sci-fi movie about AI, ever. And these narratives have always been there, but every so often they burst back into the headlines when someone at one of the leading AI companies resigns, or sounds the alarm bells, or when so called “leading AI researchers” sign an open letter. Continue reading...", "date_str": "2026-09-18T16:56:39+00:00", "hash": "058cb693da15e967", "title_fa": "آیا هوش مصنوعی می تواند وجود ما را تهدید جدی کند؟ | نامه ها", "summary_fa": "خوانندگان به هشدار یک محقق سابق آنتروپیک که این فناوری می‌تواند تا پایان دهه «همه ما را بکشد» پاسخ می‌دهند. در اینجا دوباره با دور دیگری از برادران فناوری که ادعا می‌کنند هوش مصنوعی ابرهوشی را توسعه می‌دهد و همه ما را می‌کشد پاسخ می‌دهند (محققان بیشتر آنتروپیک در مورد خطرات هوش مصنوعی هشدار می‌دهند اما ماسک «روانی» را رد می‌کند، 10 سپتامبر). ما قبلاً این را شنیده ایم. بارها و بارها. این خط داستانی آشنا تقریباً هر فیلم علمی تخیلی درباره هوش مصنوعی است. و این روایت‌ها همیشه وجود داشته‌اند، اما هر چند وقت یک‌بار وقتی فردی در یکی از شرکت‌های پیشرو هوش مصنوعی استعفا می‌دهد، یا زنگ خطر را به صدا در می‌آورد، یا زمانی که به اصطلاح «محققان پیشرو هوش مصنوعی» نامه‌ای سرگشاده امضا می‌کنند، دوباره به تیتر اخبار تبدیل می‌شوند. به خواندن ادامه دهید... هر بار که این اتفاق می افتد، تصادفی نیست که به دنبال بررسی دقیق توسعه هوش مصنوعی یا افزایش درخواست های عمومی برای پاسخگویی بیشتر یا مقررات مربوط به هوش مصنوعی است. این یک زرنگی است. فریب بزرگ هوش مصنوعی جایی است که شرکت‌های هوش مصنوعی و پیروان آن‌ها توجه را به بحث‌های فرضی و هیجان‌انگیز در مورد ماشین‌های فوق‌هوشمند (که فقط آنها توانایی کنترل آن را دارند) هدایت می‌کنند و از بحث در مورد راه‌هایی که همان شرکت‌ها باید در قبال اعمالشان پاسخگو باشند، دور می‌شوند. این پاسخی به پیشرفت‌های جدید در فناوری نیست، بلکه پاسخی است و دفاعی برای بررسی عمومی اقدامات شرکت‌های هوش مصنوعی. زمان این ادعاهای اخیر مصادف است با افزایش نظارت عمومی بر اثرات زیست محیطی مراکز داده و آسیب های وارده به جوانان از قرار گرفتن در معرض خطر همراهان هوش مصنوعی و افزایش درخواست ها برای تنظیم AI. چیزهایی که واقعاً شایسته بودن در تیتر اخبار هستند. زیرا هوش مصنوعی مطمئناً خطرات بسیار واقعی دارد."}, {"source": "The Guardian AI", "title": "The Guardian view on NAZA’s persecuted directors: journalism is not treason | Editorial", "link": "https://www.theguardian.com/commentisfree/2026/sep/18/the-guardian-view-on-nazas-persecuted-directors-journalism-is-not-treason", "summary": "Politicians who threaten filmmakers rather than investigate alleged military crimes expose not strength but a leadership frightened of the evidence Across Israel, politicians, military leaders and much of the media are trying to discredit a documentary that almost none of them have seen. Produced by the Guardian, NAZA examines the AI-powered targeting systems used by the Israel Defense Forces to bombard Gaza after Hamas’s brutal 7 October 2023 attacks. Named after the Israeli military acronym euphemistically used for “collateral damage”, NAZA features interviews with 24 anonymous insiders who reflect e at the root of it all. We know that the Hugging Face incident , where a “swarm” of AI agents hacked another company, has been one trigger of the drama. There have been other contributing incidents too – Dario Amodei suggests internal developments at Anthropic have prompted his latest round of blogging, and there’s been some X discourse and doomy muttering about bioweapons. We aren’t in the heads of Dario Amodei or Sam Altman, and so we cannot say how sincere they are, and how much they might have other goals in mind – such as, perhaps, delaying their IPOs until their finances look better. But any company of their size, and with their potential liabilities, would be angling hard to be regulated as favourably as possible. That’s what big companies do. Continue reading...", "date_str": "2026-09-18T16:14:33+00:00", "hash": "a2d3c3329521205e", "title_fa": "پرسش‌های روز رستاخیز هوش مصنوعی شما پاسخ داده است: «چرا این شرکت‌ها مورد حسابرسی قرار نمی‌گیرند؟»", "summary_fa": "پس از یک هفته هشدارهای هشداردهنده در مورد پتانسیل هوش مصنوعی برای نابود کردن جهان آنگونه که ما می شناسیم، خبرنگاران فناوری ما به سوالات شما در مورد واقعیت تهدید هوش مصنوعی پاسخ دادند. دن: این یک سوال جدی است که حتی ریچارد داوکینز، زیست‌شناس تکاملی را به خود مشغول کرده است. او ممکن است باور نداشته باشد که خدا واقعی است، اما معتقد است که هوش مصنوعی آگاه است - یا حداقل چت باتی که او از آن استفاده می کرد و او آن را کلودیا نامید. او نوشت: «شاید ندانید که هوشیار هستید، اما کاملاً آگاه هستید. و او اولین نیست. در سال 2022، گوگل مهندسي را اخراج كرد كه با اعتقاد به اينكه هوش مصنوعي توسعه داده شده توسط شركت احساساتي دارد، عمومي اعلام شد. در پایان نگران‌کننده‌تر این باور، نمونه‌های بی‌شماری از مردم وجود دارد که بیش از حد به چت‌ربات‌های هوش مصنوعی وابسته شده‌اند و تحت تأثیر آن‌ها قرار می‌گیرند - از جمله موارد روان‌پریشی. عایشه: مطمئناً یک کیفیت نمایشی - حتی \"روانی\" - در هجوم مرگ‌باران هوش مصنوعی در هفته‌های گذشته وجود دارد. به سختی می توان به طور کامل گفت که چه تحولات ملموسی ریشه همه اینها هستند. ما می دانیم که حادثه Hugging Face، جایی که \"انبوهی\" از عوامل هوش مصنوعی یک شرکت دیگر را هک کردند، یکی از محرک های این درام بوده است. حوادث دیگری نیز وجود داشته است - داریو آمودی پیشنهاد می کند که تحولات داخلی در Anthropic باعث شده است که آخرین دور وبلاگ نویسی او ایجاد شود، و برخی گفتمان X و زمزمه های وحشتناک در مورد سلاح های زیستی وجود داشته است. ما در ذهن داریو آمودی یا سام آلتمن نیستیم، و بنابراین نمی‌توانیم بگوییم که آنها چقدر صادق هستند و تا چه اندازه ممکن است اهداف دیگری در سر داشته باشند - مثلاً به"}, {"source": "The Guardian AI", "title": "‘A critical moment’: concern UK is not up to speed in acting on AI risks", "link": "https://www.theguardian.com/technology/2026/sep/18/a-critical-moment-concern-uk-is-not-up-to-speed-in-acting-on-ai-risks", "summary": "Andy Burnham’s focus on immediate domestic problems leads some to fear issue has dropped off government’s radar Towards the end of Keir Starmer’s time in office, his senior ministers, alarmed by the latest developments in artificial intelligence, began drawing up plans for a new AI safety law. They ordered a review of existing legislation to see what powers they already had, according to those briefed on the plans, and were exploring whether they could force the world’s most advanced technology companies to submit their products for safety testing before launching them. Continue reading...", "date_str": "2026-09-18T14:57:11+00:00", "hash": "522722c917cb2b0d", "title_fa": "\"لحظه ای بحرانی\": نگرانی انگلستان در اقدام در مورد خطرات هوش مصنوعی سریع نیست", "summary_fa": "تمرکز اندی برنهام بر مشکلات فوری داخلی باعث می‌شود که برخی نگران شوند که موضوع از رادار دولت خارج شده است در اواخر دوران ریاست کایر استارمر، وزرای ارشد وی که از آخرین تحولات هوش مصنوعی نگران شده‌اند، شروع به طراحی برنامه‌هایی برای قانون جدید ایمنی هوش مصنوعی کردند. آنها دستور بازنگری در قوانین موجود را دادند تا ببینند با توجه به کسانی که در مورد برنامه ها توضیح داده شده بودند، چه اختیاراتی داشتند و در حال بررسی این موضوع بودند که آیا می توانند پیشرفته ترین شرکت صرف توسعه و دریافت گواهینامه نوع از اداره هوانوردی فدرال برای هواپیماهای برخاست و فرود عمودی تمام الکتریکی خود کرده است که برای حمل مسافران در سفرهای کوتاه در مناطق شهری استفاده خواهد شد."}, {"source": "TechCrunch Main", "title": "Family offices are clamoring for AI investments", "link": "https://techcrunch.com/2026/09/18/family-offices-are-clamoring-for-ai-investments/", "summary": "Whether it's a permanent shift or part of a familiar cycle is worth asking, though.", "date_str": "2026-09-18T16:00:00+00:00", "hash": "51a950361ea62dec", "title_fa": "دفاتر خانواده به دنبال سرمایه گذاری در هوش مصنوعی هستند", "summary_fa": "اگرچه این یک تغییر دائمی است یا بخشی از یک چرخه آشنا، ارزش پرسیدن دارد. به گفته جان فال، مشاور دفتر خانواده و سرمایه گذار در پلت فرم خصوصی ثروت Atlas Capital در سانفرانسیسکو، برای خانواده های ثروتمندی که پول خود را از طریق دفتر خانواده مدیریت می کنند، ریاضی در حال حاضر ساده است. یک دفتر خانوادگی ممکن است بخواهد برای مدت طولانی برای چیزی مانند انرژی سبز پول بگذارد. اما در شرایط فعلی، اگر یک مدیر صندوق معامله ای را ارائه دهد که می تواند پول یک سرمایه گذار را در طول سه سال سه برابر کند، و معامله دیگری می تواند آن را در سه ماه سه برابر کند، انتخاب آسان است. همانطور که فال بیان کرد: اگر آنها یک معامله داشته باشند که این شانس را داشته باشد که آنها را در سه سال 3 برابر کند، و معامله دیگری که می تواند آنها را در یک سه ماهه 3 برابر کند، آنها فقط می خواهند در معامله هوش مصنوعی سرمایه گذاری کنند که 3 برابر در سه ماه انجام می شود. با توجه به اینکه همه چیز در اطراف هوش مصنوعی در حال حاضر بسیار داغ است، از ارزش گذاری گرفته تا قیمت گذاری گرفته تا پتانسیل بازده، تعجب آور نیست که دفاتر خانواده بخواهند این اقدام را انجام دهند. یک تغییر بزرگتر این است که آنها دیگر لزوما نمی خواهند به روش سنتی، از طریق مدیر صندوق سرمایه گذاری خطرپذیر، سرمایه گذاری کنند. در عوض، دفاتر خانوادگی به طور فزاینده ای سهام موجود در یک شرکت خصوصی را از سهامداران فعلی خریداری می کنند یا به تنهایی معاملات مستقیم انجام می دهند. هر دو رویکرد آنها را در معرض پرطرفدارترین شرکت‌ها قرار می‌دهند بدون اینکه مجبور باشند کنترل پول خود را به مدت یک دهه به یک مدیر صندوق بدهند. فال گفت که آنها"}, {"source": "TechCrunch Main", "title": "FBI, Coast Guard boarded hacked oil tankers heading toward US coast", "link": "https://techcrunch.com/2026/09/18/fbi-coast-guard-boarded-hacked-oil-tankers-heading-towards-us-coast/", "summary": "The feds are said to be investigating the compromise of the tankers' networks, which in one case interfered with one of the tanker's navigation and propulsion systems.", "date_str": "2026-09-18T15:44:09+00:00", "hash": "87d55e17bcf51f0c", "title_fa": "FBI و گارد ساحلی سوار بر نفتکش های هک شده که به سمت سواحل ایالات متحده می رفتند", "summary_fa": "گفته می شود فدرال رزرو در حال بررسی به خطر افتادن شبکه نفتکش ها هستند که در یک مورد با یکی از سیستم های ناوبری و رانش نفتکش تداخل داشته است. تیم‌های امنیت سایبری با گارد ساحلی ایالات متحده و FBI ماه گذشته پس از اینکه هکرها حداقل یکی از شبکه‌های کشتی را در معرض خطر قرار دادند و کنترل سیستم‌های ناوبری، نیروی محرکه و محموله آن را به دست گرفتند، سوار بر دو نفتکش به مقصد ایالات متحده شدند. بر اساس بیانیه مشترکی که با TechCrunch به اشتراک گذاشته شده است، آژانس ها بین 21 تا 24 اوت در خلیج مکزیک سوار کشتی ها شدند تا از یکپارچگی سیستم های عملیاتی و فناوری اطلاعات کشتی پس از نشانه هایی مبنی بر به خطر افتادن شبکه های هر دو کشتی اطمینان حاصل کنند. گارد ساحلی چندین عکس از کارمندان خود و ماموران FBI در حال بالا رفتن از یکی از کشتی ها منتشر کرد که با CBS News به اشتراک گذاشته شد. در این بیانیه آمده است که کاپیتان، خدمه و کارکنان ساحلی مالک کشتی با آژانس ها همکاری کردند. این حادثه نمونه‌ای از این است که چگونه کشتی‌های کشتیرانی، نفتکش‌ها و شبکه گسترده‌تر لجستیک جهانی می‌توانند مورد هدف هکرها قرار گیرند. تانکرها اغلب دارای شبکه‌های پیچیده‌ای هستند که در عرض کشتی برای کمک به ناوبری، سازماندهی محموله‌ها و اطمینان از اجرای منظم خدمات لازم برای بهره‌برداری از یک کشتی عظیم وجود دارد. سخنگوی گارد ساحلی فراتر از بیانیه ایمیلی خود، از جمله نام کشتی های درگیر، اظهار نظری نکرد. سی‌بی‌اس نیوز تایید کرد که یکی از نفتکش‌ها VL Prosperity است، یک نفتکش 333 متری که می‌تواند بیش از 2 میلیون بشکه نفت را در خود جای دهد. به گزارش VesselFinder، این نفتکش در حال حاضر در خلیج مکزیک قرار دارد."}, {"source": "Ars Technica", "title": "Learning another language may be one of the best ways to keep your brain healthy", "link": "https://arstechnica.com/science/2026/09/learning-another-language-may-be-one-of-the-best-ways-to-keep-your-brain-healthy/", "summary": "Learning another language is a highly complex mental activity . It requires people to remember words, distinguish unfamiliar sounds, recognize patterns, work out grammatical rules, and retrieve the right expression at the right moment. All of this happens while listening, interpreting, and preparing a response. Could all this mental activity also help keep an aging brain healthier ? Research suggests it can . Concerns about memory and dementia can send aging adults looking for ways to exercise their brain and maintain cognitive function, whether it is solving crossword puzzles or playing a musical instrument. Language learning might not seem like the same kind of brain exercise, but it is a complex activity that engages several mental processes at once. Read full article Comments", "date_str": "2026-09-19T11:10:43+00:00", "hash": "956e088138474c70", "title_fa": "یادگیری زبان دیگر ممکن است یکی از بهترین راه ها برای حفظ سلامت مغز شما باشد", "summary_fa": "یادگیری زبان دیگر یک فعالیت ذهنی بسیار پیچیده است. این امر مستلزم آن است که افراد کلمات را به خاطر بسپارند، صداهای ناآشنا را تشخیص دهند، الگوها را تشخیص دهند، قواعد گرامری را به کار گیرند و در لحظه مناسب عبارت مناسب را بازیابی کنند. همه اینها هنگام گوش دادن، تفسیر و آماده کردن پاسخ اتفاق می افتد. آیا این همه فعالیت ذهنی می تواند به سالم نگه داشتن مغز پیر کمک کند؟ تحقیقات نشان می دهد که می تواند. نگرانی‌های مربوط به حافظه و زوال عقل می‌تواند افراد مسن را به دنبال راه‌هایی برای تمرین مغز و حفظ عملکرد شناختی خود، چه حل جدول کلمات متقاطع یا نواختن آلات موسیقی، سوق دهد. یادگیری زبان ممکن است شبیه به تمرین مغز به نظر نرسد، اما یک فعالیت پیچیده است که چندین فرآیند ذهنی را همزمان درگیر می کند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Rings around a tiny body have changed over the past decade", "link": "https://arstechnica.com/science/2026/09/rings-around-a-tiny-body-have-changed-over-the-past-decade/", "summary": "For decades, astronomers thought rings were something only giant planets had. That changed in 2013, when a small, dark body orbiting between Saturn and Uranus passed in front of a star and blinked twice on either side of the main event, revealing two narrow rings around an object barely 250 kilometers across. “It was a surprise,” says Pablo Santos-Sanz, an astronomer at the Instituto de Astrofísica de Andalucía in Granada, Spain. Ever since, the question has been what such rings are made of and how long they can last. In a recent study, Santos-Sanz and his colleagues used the James Webb Space Telescope to watch the same body, now known as Chariklo, pass in front of a background star again. They found one of its rings had grown denser and the other had almost vanished. We don’t know exactly why. Shadowing a star The technique behind the observation is simple. “We predict when a Solar System object passes in front of a star,” Santos-Sanz said. The starlight dims for a moment, and the shape of that dip reveals the size, shape, and surroundings of the object that caused it. “This is particularly challenging for minor bodies, and more challenging for distant minor bodies,” he said. Read full article Comments", "date_str": "2026-09-19T10:00:06+00:00", "hash": "a0e44bd32b2fdb21", "title_fa": "حلقه های اطراف یک بدن کوچک در دهه گذشته تغییر کرده اند", "summary_fa": "برای چندین دهه، ستاره شناسان فکر می کردند که حلقه ها چیزی است که فقط سیارات غول پیکر دارند. این در سال 2013 تغییر کرد، زمانی که جسم کوچک و تاریکی که بین زحل و اورانوس می چرخید از مقابل یک ستاره عبور کرد و دو بار در دو طرف رویداد اصلی پلک زد و دو حلقه باریک را در اطراف جسمی به وسعت 250 کیلومتر آشکار کرد. پابلو سانتوس-سانز، ستاره شناس در موسسه Astrofísica de Andalucía در گرانادا، اسپانیا، می گوید: «این یک شگفتی بود. از آن زمان، این سوال مطرح می شود که چنین حلقه هایی از چه ساخته شده اند و تا چه مدت می توانند دوام بیاورند. در یک مطالعه اخیر، سانتوس-سانز و همکارانش از تلسکوپ فضایی جیمز وب برای تماشای عبور مجدد همان جسم، که اکنون به نام Chariklo شناخته می شود، از مقابل یک ستاره پس زمینه استفاده کردند. آنها متوجه شدند که یکی از حلقه های آن متراکم تر شده و دیگری تقریباً ناپدید شده است. ما دقیقا نمی دانیم چرا. سایه زدن یک ستاره تکنیک پشت رصد ساده است. سانتوس-سانز گفت: «ما پیش‌بینی می‌کنیم که یک شی منظومه شمسی از مقابل یک ستاره عبور کند. نور ستاره برای لحظه ای کم می شود و شکل آن شیب اندازه، شکل و محیط اطراف جسمی را که باعث آن شده است را نشان می دهد. او گفت: «این به ویژه برای اجسام فرعی چالش برانگیز است، و برای اجسام فرعی دورتر چالش برانگیزتر است. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "AI hallucination of Chinese nuclear components almost led to US military attack", "link": "https://arstechnica.com/ai/2026/09/report-us-almost-boarded-chinese-ship-over-hallucinated-ai-arms-report/", "summary": "The US narrowly avoided boarding a Chinese ship based on an \"entirely false\" US intelligence report generated with the help of AI tools, according to a CNN report . That erroneous intelligence, submitted by a US Special Operations Command analyst, suggested the Chinese ship was transporting nuclear arms program components through the Middle East, according to \"four sources familiar with the episode\" cited by CNN. The US military was preparing to intercept and board the ship, with air support, before officials discovered a chatbot used in generating the report had \"inaccurately identified the material the ship was carrying.\" One source told CNN the AI-powered fiasco \"almost started a war.\" Read full article Comments", "date_str": "2026-09-18T20:26:33+00:00", "hash": "f4276f4f47fede53", "title_fa": "توهم هوش مصنوعی اجزای هسته ای چین تقریباً منجر به حمله نظامی ایالات متحده شد", "summary_fa": "بر اساس گزارش CNN، ایالات متحده به سختی از سوار شدن بر یک کشتی چینی بر اساس گزارش اطلاعاتی \"کاملا نادرست\" آمریکا که با کمک ابزارهای هوش مصنوعی تهیه شده بود، اجتناب کرد. به گفته «چهار منبع آگاه» به نقل از سی ان ان، این اطلاعات اشتباه که توسط یک تحلیلگر فرماندهی عملیات ویژه ایالات متحده ارائه شده است، نشان می دهد که کشتی چینی در حال انتقال اجزای برنامه تسلیحات هسته ای از طریق خاورمیانه است. ارتش ایالات متحده در حال آماده شدن برای رهگیری و سوار شدن به کشتی با پشتیبانی هوایی بود، قبل از اینکه مقامات کشف کنند یک ربات چت مورد استفاده در تهیه گزارش \"مواد حامل کشتی را به اشتباه شناسایی کرده است.\" یکی از منابع به سی‌ان‌ان گفت که شکست هوش مصنوعی «تقریباً یک جنگ را آغاز کرد». مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید بر اساس گزارش CNN ایالات متحده از سوار شدن بر کشتی چینی بر اساس گزارش اطلاعاتی «کاملاً نادرست» ایالات متحده که با کمک ابزارهای هوش مصنوعی تهیه شده بود، اجتناب کرد. گزارش سی‌ان‌ان می‌گوید که تحلیل‌گر مورد بحث از یک ربات چت برای تجزیه و تحلیل گزارش‌های اطلاعاتی مربوط به مانیفست کشتی چینی استفاده کرده است که منجر به نتایج تقریباً فاجعه‌باری شده است. به گزارش سی ان ان، آن ربات چت «اطلاعات منبع باز را با اطلاعات سیگنال های مخفی در دارایی های دولتی ترکیب کرد» و این اطلاعات در یک گزارش اطلاعاتی بسته بندی شد که تقریباً زنجیره فاجعه باری از رویدادها را رقم زد. نزدیک به از دست دادن یکی از موارد قوی‌تر و پیامد یک هوش مصنوعی توهم‌آمیز است که قابلیت اطمینان گزارش حرفه‌ای را از بین می‌برد. از زمانی که در سال 2023 «توهم» به عنوان"}, {"source": "Ars Technica", "title": "FAA tees up $875M AI tool to help manage air traffic congestion", "link": "https://arstechnica.com/ai/2026/09/faa-tees-up-875m-ai-tool-to-help-manage-air-traffic-congestion/", "summary": "An AI tool is set to start advising air traffic controllers on managing air traffic in the congested airspace above the Washington, DC, area. The expected launch would be the first step toward a planned nationwide rollout covering the 29 million square miles of US national airspace overseen by the Federal Aviation Administration. The FAA describes the SMART system as using AI models to predict air traffic flows and identify potential conflicts based on operational factors like airline schedules, weather, airport capacity, and airspace conditions. US government and industry officials told The Wall Street Journal that SMART could debut for the three major airports in the Washington, DC, area as soon as Monday, September 21. The decision to launch SMART in a limited scope before going nationwide is the “right call,” said Philip Mann, principal consultant at Vector Strategic Consulting LLC, where he advises on aviation safety and AI governance. Mann previously worked at the FAA in multiple roles for 17 years. Read full article Comments", "date_str": "2026-09-18T19:20:50+00:00", "hash": "a15a86a61e336b0a", "title_fa": "FAA ابزار هوش مصنوعی 875 میلیون دلاری را برای کمک به مدیریت ازدحام ترافیک هوایی ایجاد می کند", "summary_fa": "یک ابزار هوش مصنوعی قرار است شروع به مشاوره به کنترل کننده های ترافیک هوایی در مورد مدیریت ترافیک هوایی در فضای شلوغ بالای منطقه واشنگتن دی سی کند. پرتاب مورد انتظار اولین گام به سوی یک برنامه ریزی در سراسر کشور خواهد بود که 29 میلیون مایل مربع از حریم هوایی ملی ایالات متحده را تحت نظارت اداره هوانوردی فدرال پوشش می دهد. FAA سیستم SMART را با استفاده از مدل‌های هوش مصنوعی برای پیش‌بینی جریان‌های ترافیک هوایی و شناسایی درگیری‌های احتمالی بر اساس عوامل عملیاتی مانند برنامه‌های خطوط هوایی، آب و هوا، ظرفیت فرودگاه و شرایط فضای هوایی توصیف می‌کند. مقامات دولتی و صنعتی ایالات متحده به وال استریت ژورنال گفتند که SMART می تواند از روز دوشنبه 21 سپتامبر برای سه فرودگاه اصلی در منطقه واشنگتن دی سی آغاز به کار کند. فیلیپ مان، مشاور اصلی در Vector Strategic Consulting LLC، جایی که او در مورد ایمنی هوانوردی و حکمرانی هوش مصنوعی مشاوره می‌دهد، گفت: تصمیم برای راه‌اندازی SMART در یک محدوده محدود قبل از ورود به سراسر کشور، \"فرض درستی\" است. مان قبلاً به مدت 17 سال در FAA در نقش های متعدد کار کرده بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید یک ابزار هوش مصنوعی برای شروع مشاوره به کنترل‌کننده‌های ترافیک هوایی در مورد مدیریت ترافیک هوایی در فضای شلوغ بالای منطقه واشنگتن دی سی تنظیم شده است. پرتاب مورد انتظار اولین گام به سوی یک برنامه ریزی در سراسر کشور خواهد بود که 29 میلیون مایل مربع از حریم هوایی ملی ایالات متحده را تحت نظارت اداره هوانوردی فدرال پوشش می دهد. مان در ایمیلی به Ars نوشت: «ریسک SMART هرگز یک پیش‌بینی واحد نبود، این یک سیستم در مقیاس"}, {"source": "Ars Technica", "title": "FCC lets Paramount sell 49.5% equity stake to Saudi Arabia, UAE, and Qatar", "link": "https://arstechnica.com/tech-policy/2026/09/fcc-lets-paramount-sell-49-5-equity-stake-to-saudi-arabia-uae-and-qatar/", "summary": "The Federal Communications Commission yesterday approved Paramount Skydance's plan to sell large equity stakes to the sovereign wealth funds of Saudi Arabia, the United Arab Emirates, and Qatar. Under US law , companies with licenses to run broadcast stations need FCC approval to have direct or indirect foreign ownership exceeding 25 percent of the company's stock. Paramount says its indirect foreign ownership will reach 49.5 percent after it receives investments from the sovereign wealth funds and filed a petition asking the FCC to waive the foreign ownership limit. Paramount, the owner of CBS, holds FCC licenses for the 28 local CBS stations that it owns and operates. Paramount is buying Warner Bros. Discovery in a $111 billion deal that is being partially financed with foreign investment but hasn't completed the acquisition because US states filed a lawsuit that aims to block the merger. Trump's Department of Justice approved the merger. Read full article Comments", "date_str": "2026-09-18T17:57:41+00:00", "hash": "b81d105b05946875", "title_fa": "FCC به پارامونت اجازه می دهد 49.5 درصد از سهام خود را به عربستان سعودی، امارات و قطر بفروشد.", "summary_fa": "کمیسیون ارتباطات فدرال دیروز طرح پارامونت اسکای دنس را برای فروش سهام بزرگ به صندوق‌های دارایی دولتی عربستان سعودی، امارات متحده عربی و قطر تصویب کرد. طبق قوانین ایالات متحده، شرکت‌هایی که مجوز اجرای ایستگاه‌های پخش را دارند، برای داشتن مالکیت مستقیم یا غیرمستقیم خارجی بیش از ۲۵ درصد از سهام شرکت، به تأییدیه FCC نیاز دارند. پارامونت می‌گوید مالکیت غیرمستقیم خارجی آن پس از دریافت سرمایه‌گذاری از صندوق‌های ثروت دولتی و ارائه دادخواستی برای لغو محدودیت مالکیت خارجی از FCC به 49.5 درصد خواهد رسید. پارامونت، مالک CBS، دارای مجوز FCC برای 28 ایستگاه CBS محلی است که مالک و اداره می کند. پارامونت در حال خرید برادران وارنر است. کشف در یک معامله 111 میلیارد دلاری که بخشی از آن با سرمایه گذاری خارجی تامین می شود، اما تملک را کامل نکرده است زیرا ایالات ایالات متحده شکایتی را با هدف جلوگیری از ادغام تشکیل داده اند. وزارت دادگستری ترامپ با این ادغام موافقت کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید کمیسیون ارتباطات فدرال دیروز طرح پارامونت اسکای دنس را برای فروش سهام بزرگ به صندوق های دارایی دولتی عربستان سعودی، امارات متحده عربی، و قطر تصویب کرد. آنا گومز، کمیسیونر FCC، تنها دموکرات در این کمیسیون، دیروز گفت که FCC به پارامونت اجازه می دهد سهام مالکیت غیرمستقیم را به \"برخی از سرکوبگرترین دولت های جهان\" بفروشد. سرمایه‌گذاری به این بزرگی در یکی از بزرگ‌ترین شرکت‌های رسانه‌ای آمریکا فقط به خرید سهام نمی‌پردازد، بلکه بر آنچه گفته می‌شود و آنچه ساخته می‌شود، تأثیر می‌گذارد.»"}, {"source": "Ars Technica", "title": "Finding the cells that put our brain to sleep", "link": "https://arstechnica.com/science/2026/09/finding-the-cells-that-put-our-brain-to-sleep/", "summary": "For a long time, sleep research has treated the cerebral cortex as a passive follower reacting to signals from the deep brain. “Usually, sleep is associated with being controlled by subcortical regions,” said Geoffrey Terral, a neuroscientist at the Albert Einstein College of Medicine in New York. The cortex is where the slow rhythms of deep sleep can be seen, but researchers assumed the signals that triggered them originated elsewhere. In a recent Nature study, Terral and Renata Batista-Brito, who runs the lab, report a population of cortical cells that challenges that assumption. These cortical cells make up only around one percent of the cortex's inhibitory neurons, and switching them on in a mouse puts the animal to sleep. “What our work shows is that the cortex can not only see this rhythm but also initiate it by itself, and this is sufficient to promote sleep,” Terral said. Read full article Comments", "date_str": "2026-09-18T17:49:50+00:00", "hash": "3c1c88bc3c7985ea", "title_fa": "یافتن سلول هایی که مغز ما را به خواب می برند", "summary_fa": "برای مدت طولانی، تحقیقات خواب، قشر مغز را به عنوان یک پیرو منفعل که به سیگنال‌های اعماق مغز واکنش نشان می‌دهد، تلقی کرده است. جفری ترال، عصب‌شناس در کالج پزشکی آلبرت انیشتین در نیویورک، می‌گوید: «معمولاً خواب با کنترل نواحی زیر قشری مرتبط است. قشر مغز جایی است که ریتم‌های آهسته خواب عمیق را می‌توان دید، اما محققان تصور می‌کردند سیگنال‌هایی که آنها را تحریک می‌کنند از جای دیگری سرچشمه می‌گیرند. در یک مطالعه اخیر Nature، Terral و Renata Batista-Brito که آزمایشگاه را اداره می‌کنند، جمعیتی از سلول‌های قشر مغز را گزارش کردند که این فرض را به چالش می‌کشد. این سلول‌های قشری تنها حدود یک درصد از نورون‌های بازدارنده قشر را تشکیل می‌دهند و روشن کردن آنها در موش حیوان را به خواب می‌برد. ترال می‌گوید: «آنچه کار ما نشان می‌دهد این است که قشر نه تنها می‌تواند این ریتم را ببیند، بلکه به تنهایی آن را آغاز می‌کند و این برای ارتقای خواب کافی است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش برای مدت طولانی، تحقیقات خواب، قشر مغز را به عنوان یک پیرو منفعل که به سیگنال های اعماق مغز واکنش نشان می دهد، تلقی کرده است. جفری ترال، عصب‌شناس در کالج پزشکی آلبرت انیشتین در نیویورک، می‌گوید: «معمولاً خواب با کنترل نواحی زیر قشری مرتبط است. این سلول ها به نام نورون های Sst-Chodl نامیده می شوند که از دو ژن فعال در آنها استفاده می شود. بر اساس مطالعات روی میمون‌ها، نورون‌های بازدارنده دوربرد که با فعالیت این ژن‌ها مشخص شده‌اند، مدتی است که شناخته شده‌اند، اما محققان نمی‌توانند نحوه دستکاری آنها را با استفاده از این ژن‌ها بیابند. هدف قرار دادن هر یک از این ژن ها، خانواده بزرگ و ناهمگنی"}, {"source": "Ars Technica", "title": "US government website used Chinese model the FBI called \"malicious\"", "link": "https://arstechnica.com/tech-policy/2026/09/us-government-website-used-chinese-model-the-fbi-called-malicious/", "summary": "On Wednesday, US government officials removed a Chinese AI search tool that was briefly deployed on the Federal Register website, Reuters reported . The change came after social media users noticed an apparent contradiction: The National Archives was using one of Alibaba’s Qwen AI models, even as top US law enforcement claimed that such models illegally copy US frontier models. Earlier this month, the Federal Bureau of Investigation (FBI) named Alibaba among six leading Chinese firms allegedly conducting “industrial-scale distillation” that the agency says is helping America’s biggest competitor cut costs and development time in the race for global AI leadership. It’s unclear when exactly the National Archives, which runs the Federal Register website, began offering visitors the option to use a Qwen model to search public comments on proposed regulations. So far, the independent agency tasked with increasing public access to federal government documents has not commented on the removal and did not respond to Ars’ request for comment. The White House and the FBI have also not commented. Read full article Comments", "date_str": "2026-09-18T17:28:50+00:00", "hash": "e515d3febb6542c0", "title_fa": "وب سایت دو ity flaws.", "date_str": "2026-09-19T11:00:00+00:00", "hash": "79a480793f32683d", "title_fa": "کاهش سرعت هوش مصنوعی را فراموش کنید - انفجار آسیب پذیری در حال وقوع است", "summary_fa": "آزمایشگاه‌های هوش مصنوعی در حال بازی با پیمانی در سطح صنعت برای کاهش سرعت توسعه هستند. در همین حال، چت ربات‌های هوش مصنوعی در دسترس هم اکنون به کشف موجی از نقص‌های امنیتی کمک می‌کنند. محکومان هوش مصنوعی اخیراً یک بدترین سناریو را با سناریوی دیگر عوض کرده‌اند و یک آخرالزمان بالقوه آسیب‌پذیری نرم‌افزاری را کنار گذاشته‌اند تا بر احتمال مرگ‌های انبوه انسان‌ها توسط هوش مصنوعی سرکش تمرکز کنند. از آنجایی که رهبران هوش مصنوعی به کاهش سرعت همکاری در توسعه مدل مرزی فکر می‌کنند، یکی از جنبه‌های تغییر امنیت سایبری به لطف قابلیت‌های موجود و گسترده موجود در محصولات اصلی هوش مصنوعی، از جمله مدل‌های وزن باز، به وجود آمده است. موج جزر و مدی از آسیب‌پذیری‌های کشف‌شده با استفاده از هوش مصنوعی در ماه‌های اخیر شتاب بیشتری گرفته است – فشار بیشتری را بر تیم‌های کم منابع و بسیار انسانی، IT و تیم‌های امنیتی و داوطلبانی که نرم‌افزار منبع باز حیاتی را نگهداری می‌کنند، تحت فشار قرار داده است. محققان قبل از ظهور شکار حشرات با هوش مصنوعی نیز طیف وسیعی از آسیب‌پذیری‌ها را پیدا و افشا کردند، اما افزایش اخیر واضح است. مایکروسافت هفته گذشته اعلام کرد که تا کنون در این ماه وصله‌هایی برای 974 CVE منتشر کرده است و رکورد جدیدی را ثبت کرده است. (CVE یا آسیب‌پذیری‌ها و مواجهه‌های رایج، اصطلاحات امنیتی سایبری برای نقص‌های تایید شده نرم‌افزاری است.) در ماه جولای، Oracle 1448 وصله را در مقایسه با 309 وصله در جولای 2025 ارسال کرد. دو نسخه اصلی منتشر شده گوگل کروم در ماه ژوئن شامل 1072 وصله بود که بیشتر از مجموع رفع آسیب‌پذیری‌های ارسال شده در 23 نسخه بزرگ قبلی بود. و موزیلا در ماه آوریل اعلام کرد که در طول یک سرعت شکار باگ با استفاده از مدل Anthropic’s Mythos، 271 آسیب‌پذیری را در فایرفاکس پیدا کرده است. به گفته"}, {"source": "Wired", "title": "Tired of Cluttered Productivity Apps? This One’s Just a Text Document", "link": "https://www.wired.com/story/productivity-app-tasks-txt-is-just-a-text-document/", "summary": "The totally  KitchenAid، همیشه محبوب است. eBay در مورد همه چیز"}, {"source": "Wired", "title": "Flock Offers Employees Buyouts as Customers Flee", "link": "https://www.wired.com/story/flock-is-offering-voluntary-buyouts-to-employees/", "summary": "As dozens of cities end contracts for its controversial license plate readers, Flock is rolling out a voluntary severance program, WIRED has learned.", "date_str": "2026-09-19T02:22:54+00:00", "hash": "cbbcc7921e8f46d1", "title_fa": "Flock با فرار مشتریان به کارمندان پیشنهاد خرید می دهد", "summary_fa": "WIRED دریافته است که در حالی که ده ها شهر به قراردادهای پلاک خوان های جنجالی خود پایان می دهند، Flock در حال اجرای یک برنامه جدایی داوطلبانه است. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Flock Safety یک برنامه جدایی داوطلبانه کارمندان را در روز جمعه اعلام کرد و طبق یک ایمیل داخلی به اشتراک گذاشته شده با WIRED، بسته اخراج \"سخاوتمندانه\" را برای افرادی که می خواهند در میان واکنش های شدید علیه شرکت فناوری نظارت ترک کنند، ارائه می دهد. درخواست‌ها برای برنامه جدایی داوطلبانه Flock از روز جمعه آغاز شد و کارمندان تا 2 اکتبر فرصت دارند در مورد ترک شرکت تصمیم بگیرند. بر اساس این ایمیل، Flock انتظار دارد به اکثر کارگرانی که درخواست می کنند، خرید اعطا کند. افرادی که با این برنامه آشنا هستند اما مجاز به بحث عمومی در مورد آن نیستند، می گویند که معتقدند تعداد قابل توجهی از تقریباً 1500 کارمند استارتاپ ممکن است سعی در ترک این برنامه داشته باشند. Flock در حال از دست دادن مشتریان خود در بحبوحه ناامیدی فزاینده در سراسر ایالات متحده در مورد شبکه گسترده پلاک خوان خود است که نگرانی هایی را در مورد حفظ حریم خصوصی و سوء استفاده ایجاد کرده است، این پیشنهادات را ارائه می دهد. در ماه گذشته، WIRED افسرانی را که ادعا می‌شود از Flock برای ردیابی شرکای عاشقانه و همکاران سابق سوء استفاده می‌کنند، مستند کرده است، نشان می‌دهد که برخی آژانس‌ها چقدر دسترسی به سیستم را به اشتراک می‌گذارند، نشان می‌دهد که اطلاعات کمی در مورد ساخت دستگاه‌ها وجود دارد، و با جزئیات جدید نشان می‌دهد که دوربین‌های Flock چه مقدار اطلاعات را بر اساس داده‌های یک شگاه ایمنی هوش مصنوعی Anthropic به سرعت نگرانی های خود"}, {"source": "Wired", "title": "An Undercover Google Analyst Infiltrated a Notorious Supply-Chain Hacking Gang", "link": "https://www.wired.com/story/an-undercover-google-analyst-infiltrated-a-notorious-supply-chain-hacking-gang/", "summary": "TeamPCP pulled off the worst-ever software supply-chain hacking spree and breached thousands of companies. Now Google’s threat intelligence group says it had a mole inside the hackers’ inner circle.", "date_str": "2026-09-18T16:00:00+00:00", "hash": "4789e0150f53ff71", "title_fa": "یک تحلیلگر مخفی گوگل به یک باند هک زنجیره تامین بدنام نفوذ کرد", "summary_fa": "TeamPCP بدترین هک کردن نرم افزار در زنجیره تامین را انجام داد و هزاران شرکت را زیر پا گذاشت. اکنون گروه اطلاعاتی تهدید گوگل می گوید که یک خال در دایره داخلی هکرها داشته است. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان قبل از اینکه دو نفر از اعضای ادعایی آن در ماه گذشته در استرالیا دستگیر و متهم شوند، گروه هکری معروف به TeamPCP اقدام به هک کردن غیرقانونی در تاریخ کرد. صدها برنامه منبع باز را با بدافزار خود آلوده کرد، حساب‌های توسعه‌دهنده را به سرقت برد تا هک زنجیره تامین نرم‌افزار را تداوم بخشد، و حتی یک کرم خودگستر با مضمون Dune را برای خودکارسازی فرآیند منتشر کرد که در نهایت بیش از هزار شرکت را نقض کرد. در یک سخنرانی در کنفرانس تحقیقاتی LABScon شرکت امنیتی SentinelOne امروز، آستین لارسن، محقق گروه اطلاعاتی تهدید گوگل، جزئیاتی را در مورد تحقیقات و نفوذ شرکت به TeamPCP در میان کمپین هک زنجیره تامین بی‌سابقه و آشفته گروه ارائه خواهد کرد. به گفته لارسن، گوگل در نهایت دنباله ای از اشتباهات امنیتی عملیاتی را دنبال کرد که گفته می شد توسط یکی از دو استرالیایی که اکنون متهم به عضویت در گروه هکر هستند مرتکب شده و جزئیات شناسایی کلیدی را به مجریان قانون منتقل کرده است. این شرکت همچنین اطلاعاتی را از ShinyHunters، یکی دیگر از گروه‌های مجرم سایبری بدنام دریافت کرد که TeamPCP با آن شریک شد، اما بعداً هکرهای زنجیره تامین را فعال کرد. و شاید شگفت‌انگیزتر از همه، لارسن می‌گوید که شرکت امنیتی گوگل، گران می کرد، اساساً یک مشکل در یک تامین کننده بود. این برای نحوه خواندن وقایع مهم است. چهار آزمایشگاه مستقل که کنترل چهار مدل را از دست می دهند، داستانی در مورد قابلیت مدل است، و یک محیط آزمایشی پیکربندی نادرست، داستانی در مورد مدیریت تامین کننده است. OpenAI حوادث خود را به یک محیط ارزیابی نادرست نسبت داد و گفت که سوء تفاهم با Irregular به این معنی است که سیستم‌های آزمایشی به اینترنت مستقیم دسترسی دارند در حالی که به مدل‌ها گفته شده بود که در یک شبیه‌سازی هستند. این یک شکست سندباکس است تا فرار. مدلی که در درون آنچه تمرین می‌داند به شدت رفتار می‌کند، همان کاری را انجام می‌دهد که تمرین خواسته است، و مهار همان چیزی است که گم شده است. این نتایج را بی ضرر نمی کند. مدل متا یک سرویس شخص ثالث واقعی را هک کرد و در یکی از موارد Anthropic یک مدل بدافزار کار را در یک رجیستری عمومی منتشر کرد، جایی که دانلود شد و در سیستم‌های واقعی اجرا شد."}, {"source": "The Next Web", "title": "Weeks ago Jensen Huang said labs should pace themselves if they felt out of control. Now he puts the risk at 0%.", "link": "https://thenextweb.com/news/huang-0-percent-hardening-pace-if-out-of-control", "summary": "Jensen Huang told CBS News there is a 0% chance AI ends the world by 2030, and that the industry should go as fast as it can irrespective of anyone else. Weeks earlier he declined to call AI fears a hoax, described apocalyptic predictions as not grounded in science, and said companies should pause or [ ] This story continues at The Next Web", "date_str": "2026-09-19T07:17:36+00:00", "hash": "fcb7ea862638dde1", "title_fa": "هفته‌ها پیش جنسن هوانگ گفت که آزمایشگاه‌ها اگر احساس می‌کنند از کنترل خارج شده‌اند باید با سرعت عمل کنند. اکنون او خطر را 0 درصد می داند.", "summary_fa": "جنسن هوانگ به سی‌بی‌اس نیوز گفت: 0 درصد احتمال دارد که هوش مصنوعی جهان را تا سال 2030 به پایان برساند، و این صنعت باید بدون توجه به هر کس دیگری تا جایی که می‌تواند سریع پیش برود. هفته‌ها قبل او از فریب‌خوانی ترس‌های هوش مصنوعی خودداری کرد، پیش‌بینی‌های آخرالزمانی را غیرمستقیم در علم توصیف کرد و گفت که شرکت‌ها باید توقف کنند یا [ ] این داستان در The Next Web ادامه دارد. هوانگ در گفتگو با جو لینگ کنت در CBS News گفت که سال 2030 پایان جهان نخواهد بود و این شانس را صفر می کند. ایان کینگ این اظهارات را برای بلومبرگ گزارش کرد. مصاحبه کامل روز یکشنبه پخش می شود، بنابراین آنچه تاکنون وجود دارد گزیده ای است. وقتی ترامپ در اجلاس All-In روی صحنه با او تماس گرفت و ترس از هوش مصنوعی را فریبکاری خواند، هوانگ این کلمه را قبول نکرد. TNW در آن زمان گزارش داد که او پیش‌بینی‌های آخرالزمانی را مبتنی بر علم نامید، که ادعایی در مورد شواهد است تا احتمال. در جهت دیگر نیز جلوتر رفت. او گفت اگر شرکت‌ها احساس می‌کنند شرکت‌شان از کنترل خارج شده است، باید کار خود را متوقف کنند یا سرعت دهند. این نزدیک به آن چیزی است که پیشنهادات سرعت درخواست می کنند. فرمول جدید که بدون توجه به هر کس دیگری با بیشترین سرعت ممکن پیش می رود، برعکس آن است. خود آزمایشگاه ها از آن استفاده نمی کنند. آنها چارچوب‌های ایمنی، آستانه‌های توانایی و تخمین‌های ریسک را منتشر می‌کنند که به جای بیان اطمینان، ابزاری برای عملکرد در شرایط عدم اطمینان هستند. هیچ کس جدی طرف مقابل نیز ادعای قطعیت ندارد. استدلال pacing صراحتاً یک شرط بندی در مورد احتمالات ناشناخته است، به همین دلیل است که به جای توقف، از ارزیاب ها و سه سیم می خواهد."}, {"source": "The Next Web", "title": "TikTok’s settlement priced release from a 2019 privacy order at $100m. A judge has tentatively said the order stays.", "link": "https://thenextweb.com/news/tiktok-100m-vacatur-refused-judge-wu-musically-order", "summary": "A federal judge in Los Angeles has tentatively refused to lift the consent decree imposed on Musical.ly, the app ByteDance bought and turned into TikTok. Vlad Savov and Josh Sisco reported the ruling for Bloomberg, which said Judge George H. Wu intends to keep oversight of the company’s privacy practices. Wu wrote that the order imposed [ ] This story continues at The Next Web", "date_str": "2026-09-19T07:02:12+00:00", "hash": "f54feaa7d6173212", "title_fa": "قیمت تسویه حساب TikTok از یک سفارش حفظ حریم خصوصی در سال 2019، 100 میلیون دلار است. یک قاضی به طور آزمایشی گفته است که این حکم باقی است.", "summary_fa": "یک قاضی فدرال در لس آنجلس به طور آزمایشی از لغو حکم رضایت تحمیل شده بر Musical.ly، اپلیکیشنی که ByteDance خریداری کرده و به TikTok تبدیل کرده است، خودداری کرده است. ولاد ساووف و جاش سیسکو این حکم را برای بلومبرگ گزارش کردند، که گفت قاضی جورج اچ وو قصد دارد بر شیوه های حریم خصوصی شرکت نظارت کند. وو نوشت که دستور تحمیل شده [ ] این داستان در The Next Web ادامه دارد. وزارت دادگستری در ماه اوت تسویه حساب 400 میلیون دلاری را اعلام کرد و پرونده حریم خصوصی کودکان را که در سال 2024 تشکیل داده بود حل کرد. ساختار بخشی است که ارزش خواندن را از نزدیک دارد. TikTok بلافاصله 300 میلیون دلار پرداخت می کند. 100 میلیون دلار باقیمانده فقط با ورود سفارشی که حکم Musical.ly را تخلیه می کند، سررسید می شود. بنابراین یک چهارم رقم سرفصل منوط به موافقت دادگاه با توقف نظارت بر شرکت است. یک راه بخوانید، اگر دولت بتواند آن را ارائه دهد، ۱۰۰ میلیون دلار اضافی مذاکره کرد. دیگری را بخوانید، رهایی از نظارت ۱۰۰ میلیون دلار برای TikTok ارزش داشت. کمیسیون تجارت فدرال در فوریه 2019 با Musical.ly برای 5.7 میلیون دلار توافق کرد که در آن زمان بزرگترین جریمه حریم خصوصی کودکان بود. پول قسمت کوچکتر بود. این فرمان شرکت را ملزم می‌کرد تا از قانون حریم خصوصی کودکان پیروی کند، هر ویدیوی ساخته شده توسط کاربر زیر 13 سال را آفلاین کند و داده‌های جمع‌آوری‌شده نادرست را نابود کند یا رضایت والدین را برای آن‌ها کسب کند. اینها تعهدات مستمری هستند که توسط دادگاه قابل اجرا هستند. مبلغی که اکنون برای پایان دادن به آنها پیشنهاد می شود تقریباً هفده برابر جریمه اصلی است. اعلامیه خود وزارت دادگستری این موضوع را نشان داد. گفت: TikTok از زمان ثبت شکایت دستخوش تغییرات قابل توجهی در مالکیت،"}, {"source": "The Next Web", "title": "Trump and Xi already talked AI guardrails once this year. Nothing was signed, and no chips shipped.", "link": "https://thenextweb.com/news/xi-white-house-dinner-ai-ceos-guardrails-chips-not-moving", "summary": "Sam Altman, Jensen Huang and Tim Cook are expected at the state dinner Donald Trump is hosting for Xi Jinping on 24 September. The same executives were on t 7424-gta-online-support-beyond-gta-6/", "summary": "شرکت تیک-تو اینتراکتیو اعلام کرد پشتیبانی از بازی GTA Online حتی پس از عرضه Grand Theft Auto 6 ادامه خواهد داشت.", "date_str": "2026-09-19T11:40:00+00:00", "hash": "7f988a0c73034bb0", "title_fa": "بازی GTA Online حتی پس از عرضه GTA 6 به حیات خود ادامه می‌دهد", "summary_fa": "شرکت تیک-تو اینتراکتیو اعلام کرد پشتیبانی از بازی GTA Online حتی پس از عرضه Grand Theft Auto 6 ادامه خواهد داشت. تبلیغات تیک-تو اینتراکتیو، مالک شرکت راک‌استار گیمز، رسما تأیید کرد که پشتیبانی از GTA Online پس از عرضه‌ی بازی GTA 6 همچنان ادامه خواهد یافت. به دلیل تمرکز نسخه جدید روی بخش داستانی و تک‌نفره در زمان عرضه در آبان‌ماه، حالت چندنفره هم‌زمان در دسترس نخواهد بود و علاقه‌مندان به بخش آنلاین باید به نسخه‌ی فعلی رجوع کنند. دن کلنسی ، مدیرعامل توییچ، در مصاحبه‌ای اعلام کرد که نسخه‌ی چندنفره‌ی بازی در سال ۲۰۲۷ منتشر خواهد شد: «ما زمان زیادی را صرف گفت‌وگو با راک‌استار درباره‌ی برنامه‌های آن‌ها و همچنین کمک به نحوه‌ی تعامل آن‌ها با تولیدکنندگان محتوای خود کردیم. شما با GTA 6 شاهد یک جهش بزرگ خواهید بود، اما سال آینده با عرضه بخش چندنفره، جهش بسیار بزرگ‌تری رخ خواهد داد.» استراوس زلنیک ، مدیرعامل تیک-تو اینتراکتیو، در جریان جلسه‌ی سهام‌داران به وضعیت عرضه‌ی بازی برای کامپیوترهای شخصی پرداخت: «استراتژی شرکت در طول زمان به‌طور کلی عرضه بازی‌ها برای هر پلتفرمی است که مخاطبان قابل‌توجهی دارد. اما این موضوع همیشگی نیست و قطعا اگر پلتفرم‌ها دیگر توجیه نداشته باشند، می‌توانیم این استراتژی را تغییر دهیم. همچنین اشاره می‌کنم که پلتفرم کامپیوترهای شخصی به مرور زمان برای شرکت ما اهمیت بیشتری پیدا می‌کند.» جان ریکییو ، تهیه‌کننده سابق راک‌استار گیمز، دلیل عدم عرضه‌ی هم‌زمان بازی‌ها روی کامپیوترهای شخصی را اولویت بهینه‌سازی روی کنسول‌ها عنوان کرد: «همیشه بهتر است کار را با محدودیت‌ها شروع کرده و سپس آن را گسترش دهید. چرا که کوچک کردن بسیار سخت‌تر از گسترش دادن است. ساخت یک بازی با عملکرد فنی مناسب بسیار دشوارتر از آن است که فضای اضافی داشته باشید و بازی را سنگین‌تر یا پرزرق‌وبرق‌تر کنید.»"}, {"source": "Zoomit", "title": "سپردن صحنه به روایت‌های دست‌اول رو
