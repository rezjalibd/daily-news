      media: [{"source": "Billboard", "title": "Charli xcx Books Cameo in Martin Scorsese Thriller Starring Leonardo DiCaprio and Jennifer Lawrence", "link": "https://www.billboard.com/culture/tv-film/charli-xcx-cameo-scorsese-movie-dicaprio-jennifer-lawrence-1236367064/", "summary": "Charli xcx s great Hollywood adventure will reportedly reach a new peak with her next role: a cameo in Martin Scorsese s upcoming psychological thriller What Happens at Night . According to Variety , after landing the legendary director for a cameo on the cover of her recent Music, Fashion, Film album, Charli will reportedly appear in an unspecified role in the Oscar-winner s upcoming movie alongside stars Leonardo DiCaprio and Jennifer Lawrence. The Gothic psychological drama from Apple and StudioCanal reportedly concerns a married American couple who travel to a small European town to adopt a baby, where they realize they may not know each other as well as they thought as they struggle to claim the child. At press time a spokesperson for Charli had not returned Billboard s request to confirm the singer s role in the film that will also feature Mads Mikkelsen ( Another Round ), Patricia Clarkson ( She Said ) and Jared Harris ( Foundation ). The booking would continue Charli s run of big screen projects, which has spanned seven movies over the past two years, including the just-released Netflix eco-terror thriller Sacrifice , in which she plays vapid pop star Mother Nature, who rats out fellow performer Daughter Nature (Ambika Mod) in the midst of a swanky environmental gathering in a cave on a remote Greek island. Following a performance of her sexy environmental anthem Supernature — which was written by Gener8ion — Charli and the rest of the swanks at the event, including vain action movie star Mike Tyler (Chris Evans), the world s richest Man, Ben Bracken (Vincent Cassel) and his glamorous wife, pop star Gloria Bracken (Salma Hayek), are taken hostage by a crazed ecological group that believes the end of the world is coming. Rapper Yung Lean also appears in the film as the brother of lead eco terrorist Joan (Anya Taylor-Joy). That role comes on the heels of her parts in the dramas Erupcja , 100 Nights of Hero , The Gallerist , Faces of Death , I Want Your Sex and The Moment , a tour mockumentary in which she played a heightened version of herself. What Happens at Night is the follow-up to Scorsese s Oscar-nominated 2023 drama Killers of the Flower Moon ; no release date has been announced for the movie. Charli is gearing up for the final 2026 date of her Music, Fashion, Film tour, which is slated to wind-down on Friday night (Oct. 23) at the MGM Grand Garden Arena in Las Vegas. The singer canceled the penultimate show in the tour in Glendale, Ariz. on W", "date_str": "2026-10-23T12:13:42+00:00", "hash": "ed47d3880e64540d", "title_fa": "Charli xcx Books Cameo در فیلم هیجان انگیز مارتین اسکورسیزی با بازی لئوناردو دی کاپریو و جنیفر لارنس", "summary_fa": "طبق گزارش ها، ماجراجویی بزرگ هالیوود چارلی xcx با نقش بعدی خود به اوج جدیدی خواهد رسید: نقشی کوتاه در فیلم هیجانی روانشناختی آینده مارتین اسکورسیزی چه اتفاقی در شب می افتد. به گزارش ورایتی، پس از اینکه کارگردان افسانه ای برای یک نقش کوتاه بر روی جلد آلبوم اخیرش «موسیقی، مد، فیلم» قرار گرفت، ظاهراً چارلی در نقشی نامشخص در فیلم آینده برنده اسکار در کنار ستارگان لئوناردو دی کاپریو و جنیفر لارنس ظاهر خواهد شد. درام روان‌شناختی گوتیک از اپل و استودیو کانال به یک زوج متاهل آمریکایی مربوط می‌شود که برای فرزندخواندگی به یک شهر کوچک اروپایی سفر می‌کنند و در آنجا متوجه می‌شوند که ممکن است همدیگر را آنطور که فکر می‌کردند در تلاش برای گرفتن فرزند نمی‌شناسند. در زمان انتشار، سخنگوی چارلی درخواست بیلبورد را برای تایید نقش خواننده در این فیلم که مدز میکلسن (راند دیگر)، پاتریشیا کلارکسون (او گفت) و جرد هریس (بنیاد) نیز در آن حضور خواهند داشت، پس نداده بود. این رزرو به پروژه‌های چارلی در پرده‌های بزرگ ادامه می‌دهد، که در طول دو سال گذشته هفت فیلم را شامل شده است، از جمله فیلم هیجان‌انگیز محیط‌زیست نتفلیکس که به تازگی اکران شده است، Sacrifice، که در آن او نقش ستاره پاپ بی‌حساب مادر طبیعت را بازی می‌کند، که دختر طبیعت (Ambika Mod) را در یک فیلم یونانی در حال جمع‌آوری مجدد محیط‌زیستی در یک فیلم هیجان‌انگیز می‌کند. جزیره پس از اجرای سرود محیطی سکسی Supernature - که توسط Gener8ion نوشته شده بود - چارلی و بقیه سوانک های حاضر در مراسم از جمله ستاره فیلم های اکشن بیهوده مایک تایلر (کریس ایوانز)، ثروتمندترین مرد جهان، بن براکن (وینسنت کسل) و همسر پر زرق و برق او، ستاره پاپ، گلوریا براکن (Salma Hayek) معتقدند که میزبان گروهی هستند. پایان دنیا در راه است", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۱ آبان • ۱۵:۴۳"}, {"source": "Billboard", "title": "Blink-182, Korn, A Perfect Circle, Turnstile, The Prodigy to Headline 2027 Sonic Temple Festival", "link": "https://www.billboard.com/music/rock/2027-sonic-temple-festival-lineup-blink-182-turnstile-1236367059/", "summary": "The 2027 Sonic Temple Art + Music Festival is headed back to Historic Crew Stadium in Columbus, Ohio from May 13-16 with another packed lineup featuring headliners Blink-182, the Offspring and Turnstile (day one), Iron Maiden, A Perfect Circle and Alice in Chains (day two), Falling in Reverse, A Day to Remember and Beartooth (day three) and Korn, $uicideboy$ and Faith No More (day four). Among the acts joining Blink on day one are: the All-American Rejects, Knocked Loose, Jimmy Eat World, Switchfoot, Bowling for Soup, Meshuggah, Mastodon, Testament, Sleeping with Sirens and Circa Survive, among others. Day two headliners Iron Maiden will also get support from Seether, Skid Row, Dirty Honey, A Bullet For My Valentine, the Pretty Reckless, Sleep Theory and Otep, with day three also featuring sets from Underoath, Of Mice and Men, Highly Suspect, Badflower, The Prodigy, Jutes and more. The final day will also have Korn supported by Hollywood Undead, Insane Clown Posse, Waka Flocka Flame, Ministry, Helmet, Sponge, Primus, Clutch, Soulfly, Snot, Hot Mulligan, 3OH!3 and more. “Sonic Temple has become one of those special weekends where the whole rock community comes together,” said Danny Wimmer Presents GM Chamie McCurry in a statement. “We build each lineup to celebrate the artists who shaped this music, the bands driving it forward, and the next generation that will define it. There’s incredible energy in rock right now, and Sonic Temple reflects that. Columbus has embraced this festival in a way that means a lot to us, and we’re ready to give fans another unforgettable four days.” Tickets are available here now. As always, the fest will feature a number of reunions and special appearances, including metal icons Iron Maiden popping in amid their Run For Your Lives 50th anniversary tour, a rare U.S. Faith No More reunion show, an exclusive Ohio reunion show by Circa Survive, Ghostemane s return to the stage after five years, the U.S. debut of Her Last Sight, and reunion sets from Forever the Sickest Kids, Palisades, Cute Is What We Aim For, The Color Morale, as well as rare sets from Relient K, Otep and Impending Doom. Check out the full lineup poster below. View this post on Instagram", "date_str": "2026-10-23T11:33:24+00:00", "hash": "41b1a9e37ac02395", "title_fa": "Blink-182، Korn، A Perfect Circle، Turnstile، The Prodigy to Headline جشنواره Sonic Temple 2027", "summary_fa": "جشنواره هنر + موسیقی Sonic Temple 2027 از 13 تا 16 مه به استادیوم Historic Crew در کلمبوس، اوهایو بازمی‌گردد، با ترکیبی دیگر که شامل سرفصل‌های Blink-182، The Offspring و Turnstile (روز اول)، Iron Maiden، A Perfect Circle و Alice in Beoth in the Reverse (روز دوم)، Alice in Beoth in Chains (روز دوم) و کورن، $uicideboy$ و Faith No More (روز چهارم). از جمله کارهایی که در روز اول به پلک زدن می‌پیوندند عبارت‌اند از: The All-American Rejects، Knocked Loose، Jimmy Eat World، Switchfoot، Bowling for Soup، Meshuggah، Mastodon، Testament، Sleeping with Sirens و Circa Survive و غیره. تیترهای روز دوم Iron Maiden همچنین از Seether، Skid Row، Dirty Honey، A Bullet For My Valentine، The Pretty Reckless، Sleep Theory و Otep پشتیبانی خواهند کرد و در روز سوم نیز مجموعه هایی از Underoath، Of Mice and Men، Highly Suspect، Badflower، The Prodigy، Jutes و غیره خواهند بود. در روز پایانی نیز Korn توسط هالیوود Undead، Insane Clown Posse، Waka Flocka Flame، وزارت، کلاه ایمنی، اسفنج، Primus، Clutch، Soulfly، Snot، Hot Mulligan، 3OH!3 و غیره پشتیبانی خواهد شد. دنی ویمر GM Chamie McCurry را در بیانیه ای ارائه می کند: \"Sonic Temple به یکی از آن تعطیلات آخر هفته خاص تبدیل شده است که در آن کل جامعه راک گرد هم می آیند.\" ما هر ترکیبی را برای تجلیل از هنرمندانی که این موسیقی را شکل داده‌اند، گروه‌هایی که آن را به جلو می‌برند، و نسل بعدی که آن را تعریف می‌کنند، می‌سازیم. در حال حاضر انرژی باورنکردنی در راک وجود دارد، و Sonic Temple این را منعکس می‌کند. کلمب به گونه ای از این جشنواره استقبال کرده است که برای ما ارزش زیادی دارد و ما آماده هستیم تا چهار روز فراموش نشدنی دیگر را به طرفداران هدیه دهیم.\" بلیط در اینجا در دسترس است. مثل همیشه، این", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۵:۰۳"}, {"source": "Billboard", "title": "‘She’s My Muse’: Adéla Lost It When Nicole Kidman Mentioned Her on Late-Night TV", "link": "https://www.billboard.com/music/pop/adela-nicole-kidman-interview-performance-fallon-1236367047/", "summary": "Never meet your heroes. That is unless you’re Adéla and your hero is Nicole Kidman, then go for gold. With two songs on the Billboard Hot 100 right now, Adéla is having a real moment, and she’s waving the flag for her homeland, Slovakia. If it all feels unreal, bizarre even, Adéla can be forgiven. Ever since she learned to read and write, her mind has been occupied with the American dream . As a youngster, the Disney Channel was constantly switched on at the family home, Adéla hatched a plan and a timeline. “I basically wanted to be famous,” she told Jimmy Fallon, when she stopped by NBC’s The Tonight Show for Thursday night’s episode. Her education included watching Fallon’s interviews with Ariana Grande, Miley Cyrus and others. Dreams, they sometimes come true. Adéla boasts a top 10 hit with the viral song “Nicole Kidman,” lifting 9-6 on the latest Billboard Hot 100 , for a new high. A month ago, when Kidman stopped by The Tonight Show , conversation quickly moved to Adéla and her ode to the Australian actress. “I can’t believe it. She wrote a song called ‘Nicole Kidman, ” the Oscar winner remarked at the time . “She’s so talented.” Deep breath, Adéla. “That’s too much to even think about,” she explained to Fallon. She’s my muse.” Kidman, well “she’s doing charity work by mentioning my name all over town. It’s amazing.” If that was strange, Adéla must’ve felt like she entered Weirdworld when Kidman, Dua Lipa, Pedro Pascal and other a-listers created TikToks to Adéla’s music. “I was like, this is not real. I’m being pranked obviously, I honestly thought it was AI. But it was not,” she recounted in her late-night interview. Adéla’s mom is, of course, on her side, freaking out just like her daughter. “She also loves Nicole,” the rising pop star admitted. “She was beside herself. She was like I don’t know if people are going crazy of if you’re a genius. But it’s working. ” Then, Adéla stepped away from the Tonight Show couch and onto the stage for her TV debut performance, a medley of those two hits “Nicole Kidman” and “Ain t In LA,” both lifted from the album Prima . The rising Slovak star sure made an impression, leading a troupe of dancers for a seductive performance with all the hallmarks of a wild night down at the Moulin Rouge. Watch the interview and performance below.", "date_str": "2026-10-23T09:08:41+00:00", "hash": "54b5a9d93ac65c49", "title_fa": "\"او موز من است\": وقتی نیکول کیدمن در تلویزیون آخر شب از او نام برد، آدلا آن را از دست داد", "summary_fa": "هرگز قهرمانان خود را ملاقات نکنید. مگر اینکه شما آدلا باشید و قهرمان شما نیکول کیدمن باشد، پس به دنبال طلا باشید. با دو آهنگ در بیلبورد Hot 100 در حال حاضر، آدلا لحظات واقعی را سپری می کند و پرچم میهن خود، اسلواکی را به اهتزاز در می آورد. اگر همه چیز غیر واقعی و حتی عجیب به نظر برسد، آدلا را می توان بخشید. از زمانی که خواندن و نوشتن آموخت، ذهنش درگیر رویای آمریکایی بود. در جوانی، کانال دیزنی به طور مداوم در خانه خانواده روشن می شد، آدلا یک برنامه و یک جدول زمانی طراحی کرد. زمانی که برای قسمت پنج شنبه شب به برنامه The Tonight Show NBC رفت، به جیمی فالون گفت: «من اساساً می‌خواستم مشهور باشم. تحصیلات او شامل تماشای مصاحبه های فالون با آریانا گرانده، مایلی سایرس و دیگران بود. رویاها، گاهی اوقات به حقیقت می پیوندند. آدلا با آهنگ ویروسی «نیکول کیدمن» به 10 آهنگ برتر دست پیدا کرده است که امتیاز 9-6 را در آخرین آهنگ بیلبورد هات 100 کسب کرده است و رکورد جدیدی را کسب کرده است. یک ماه پیش، وقتی کیدمن در برنامه The Tonight Show توقف کرد، گفتگو به سرعت به آدلا و قصیده او برای بازیگر استرالیایی منتقل شد. برنده اسکار در آن زمان گفت: \"من نمی توانم آن را باور کنم. او آهنگی به نام \"نیکول کیدمن\" نوشت. \"او بسیار با استعداد است.\" نفس عمیق، آدلا. او به فالون توضیح داد: «این خیلی زیاد است که حتی نمی توان به آن فکر کرد. او موز من است.» کیدمن، خوب «او با ذکر نام من در سراسر شهر کار خیریه انجام می دهد. شگفت انگیز است.» اگر عجیب بود، آدلا باید زمانی که کیدمن، دوآ لیپا، پدرو پاسکال و سایر بازیگران، TikToks را برای موسیقی آدلا ساختند، احساس می کرد وارد دنیای عجیب و غریب", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی", "بورس و طلا"], "datetime_fa": "۱ آبان • ۱۲:۳۸"}, {"source": "Billboard", "title": "Tate McRae Debuts at No. 1 In Australia With ‘Housewife’", "link": "https://www.billboard.com/music/chart-beat/tate-mcrae-debuts-no-1-australia-housewife-1236367034/", "summary": "Tate McRae goes all the way to No. 1 in Australia, as “Housewife” (via RCA/Sony) opens its account at the top. “Housewife” becomes the Canadian pop artist’s first leader and sixth top 10 appearance on the ARIA Singles Chart . Lifted from her forthcoming fourth album, “Housewife” goes one better than McRae’s “Greedy,” which peaked at No. 2 in 2023. Meanwhile, Olivia Rodrigo ’s “Expectations” (Geffen/Universal) blasts 78-2, thanks to the release of a new version featuring Chappell Roan. That’s a new high for “Expectations,” which peaked at No. 14 in June of this year. Rodrigo now has 15 top 10 appearances on the ARIA Chart, while Roan has four. French electronic music duo Justice blooms on the chart with “Flower In A Hurricane” (Ed Banger Records/Universal) featuring fellow Grammy Award-winners Tame Impala and SZA, along with King Gizzard The Lizard Wizard. It’s new at No. 43. The song was composed for Grand Theft Auto VI, and reunites Justice with Kevin Parker’s Tame Impala, which contributed vocals for their Grammy-winning, Billboard No. 1 hit “Neverender.” Parker was the DJ support for Justice on their three-date east coast tour of Australia last year. Over on the ARIA Albums Chart , Irish modern rock act Fontaines D.C. land their first leader with Dopamine Chamber (XL/Remote Control), their fifth studio album. Hailing from Dublin, the group now has four top 40 appearances dating back to 2020’s A Hero’s Death (No. 26), and including 2022’s Skinty Fia (No. 24) and 2024’s Romance (No. 6). U.S. country star Zach Bryan opens his account at No. 4 with the new EP, Young Manhood And Other Donatable Organs (Warner). The lead track from it, “Lies,” featuring Lana Del Ray, debuts at No. 12 on the singles frame, published Friday, Oct. 23. Young Manhood is the fourth top 20 appearance for Bryan, who will play stadiums on his eight-date east coast tour of Australia this December , produced by Frontier Touring. Melbourne electronic music favorites The Avalanches start at No. 5 with No Bad Memories (EMI). It’s the group’s fourth top 10 effort, after their celebrated debut Since I Left You (No. 5 in 2000), Wildflower (No. 1 in 2016) and We Will Always Love You (No. 4 in 2020). Aussie indie-rock outfit The Rubens make it six top 10s in a row with Group Therapy , which starts at No. 6. Group Therapy is the band’s first independently released album . ARIA Hall of Fame inducted singer and songwriter Tina Arena returns to the national tally with Way Of The World (Positive Dre", "date_str": "2026-10-23T07:21:14+00:00", "hash": "2a0a2ce901a9d95b", "title_fa": "تیت مک‌ری با «خانم‌دار» در استرالیا در رتبه اول قرار گرفت", "summary_fa": "Tate McRae تا جایی به شماره 1 استرالیا می رود، زیرا \"Housewife\" (از طریق RCA/Sony) حساب خود را در بالای صفحه باز می کند. «زن خانه دار» اولین رهبر این هنرمند پاپ کانادایی و ششمین حضور 10 نفر برتر در نمودار مجردهای آریا می شود. \"Housewife\" که از چهارمین آلبوم آتی خود بیرون آمد، یکی بهتر از آلبوم \"Greedy\" مک‌ری است که در سال 2023 در رتبه دوم قرار گرفت. در همین حال، \"Expectations\" (Geffen/Universal) اولیویا رودریگو، 78-2 نسخه جدید را منتشر می‌کند. این یک رکورد جدید برای \"انتظارات\" است که در ژوئن سال جاری به رتبه 14 رسید. رودریگو اکنون دارای 15 حضور در 10 بازی برتر در نمودار ARIA است، در حالی که روآن چهار بازی دارد. دوتای موسیقی الکترونیک فرانسوی Justice با «Flower In A Hurricane» (اد بنگر رکوردز/یونیورسال) با حضور Tame Impala و SZA، برنده جایزه گرمی، همراه با King Gizzard The Lizard Wizard، در جدول شکوفا شدند. در شماره 43 جدید است. این آهنگ برای Grand Theft Auto VI ساخته شد و Justice را با Tame Impala از کوین پارکر که آواز برنده جایزه گرمی و آهنگ شماره 1 بیلبورد آنها \"Neverender\" بود، دوباره متحد می کند. پارکر پشتیبان دی جی عدالت در تور سه روزه آنها در ساحل شرقی استرالیا در سال گذشته بود. در جدول آلبوم‌های ARIA، موسیقی راک مدرن ایرلندی Fontaines D.C اولین رهبر خود را با Dopamine Chamber (XL/Remote Control)، پنجمین آلبوم استودیویی خود، به دست آورد. این گروه که اهل دوبلین است، اکنون دارای 4 بازی برتر در 40 بازی است که مربوط به A Hero's Death (شماره 26) در سال 2020 است و شامل Skinty Fia (شماره 24) در سال 2022 و رمانس (شماره 6) در سال 2024 است. زک برایان، ستاره کانتری ایالات متحده، حساب کاربری خود را با EP جدید، جوانمردی و سایر اعضای قابل اهدا (وارنر)", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۰:۵۱"}, {"source": "Billboard", "title": "5 Things You Didn’t See on TV at The 2026 Billboard Latin Music Awards", "link": "https://www.billboard.com/lists/billboard-latin-music-awards-2026-things-you-didnt-see-on-tv/", "summary": "Fuerza Regida was the big winner at the 2026 Billboard Latin Music Awards, sweeping eight awards during the ceremony Thursday night (Oct. 22) at the James L. Knight Center in Miami, FL. The Música Mexicana sensation s big night included Hot Latin Song of the Year; Streaming Song of the Year; Global 200 Latin Song of the Year; Regional Mexican Song of the Year; Hot Latin Songs Artist of the Year, Duo or Group; Top Latin Albums Artist of the Year, Duo or Group; and Regional Mexican Artist of the Year, Duo or Group. The Latin favorites also won the Billboard Vanguard Award for their innovative and creative vision. Other special award recipients this year included Cristian Castro who was honored with the Billboard Lifetime Achievement Award, Rosalía with the Hall of Fame Award, and Rubén Blades with the Billboard Icon Award. “I wouldn’t be able to do what I do if it weren’t for the artists who came before me and paved the way—artists like him, whom I admire so much. Celia Cruz, Rocío, Vicente Fernandez, Daddy Yankee…it is incredible to be receiving this today, Rosalía said during her speech. And last but certainly not least, thank you to Latin America for the place you’ve given me, and for all these years of inspiration and lessons. I hope to keep finding ways to return all that affection and generosity to you. Here’s to many more years — thank you!” Ahead of all the glitz and glamor that beamed out on Telemundo and Peacock, Billboard s Ingrid Fajardo and Jessica Roiz hosted a livestream on the blue carpet, where many exciting and behind-the-scenes moments were captured. Below, check out five things you didn t see on TV:", "date_str": "2026-10-23T05:02:07+00:00", "hash": "75bc8eb6b9a3f9b8", "title_fa": "5 چیز که در جوایز موسیقی لاتین بیلبورد 2026 در تلویزیون ندیدید", "summary_fa": "Fuerza Regida برنده بزرگ جوایز موسیقی لاتین بیلبورد 2026 بود و هشت جایزه را طی مراسم پنجشنبه شب (22 اکتبر) در مرکز جیمز ال نایت در میامی، فلوریدا دریافت کرد. شب بزرگ Música Mexicana شامل آهنگ داغ لاتین سال بود. پخش آهنگ سال; جهانی 200 آهنگ لاتین سال; آهنگ منطقه ای مکزیکی سال; آهنگ های داغ لاتین هنرمند سال، دو یا گروه. برترین آلبوم های لاتین هنرمند سال، دو یا گروه. و هنرمند منطقه ای مکزیکی سال، دو یا گروه. برگزیدگان لاتین همچنین جایزه پیشتاز بیلبورد را به دلیل دیدگاه خلاقانه و خلاقانه خود دریافت کردند. دیگر دریافت کنندگان جوایز ویژه امسال شامل کریستین کاسترو بود که با جایزه یک عمر دستاورد بیلبورد، روزالیا با جایزه تالار مشاهیر، و روبن بلیدز با جایزه نماد بیلبورد تجلیل شد. روزالیا در خلال سخنرانی خود گفت: \"اگر هنرمندانی که قبل از من آمدند و راه را هموار کردند - هنرمندانی مانند او که من آنها را بسیار تحسین می کنم - نمی توانستم کاری را انجام دهم، نمی توانستم کاری را انجام دهم... باورنکردنی است که امروز این را دریافت می کنم.\" و در آخر، اما قطعا نه کم اهمیت، از آمریکای لاتین به خاطر مکانی که در اختیار من قرار دادید، و برای همه این سال‌ها الهام‌بخش و درس‌هایی متشکرم. امیدوارم به یافتن راه هایی برای بازگرداندن این همه محبت و سخاوت به شما ادامه دهم. سال‌های زیادی باقی مانده است - متشکرم!» قبل از تمام زرق و برق و زرق و برقی که در Telemundo و Peacock منتشر شد، اینگرید فاجاردو و جسیکا رویز از بیلبورد میزبان پخش زنده ای بر روی فرش آبی بودند که در آن لحظات هیجان انگیز و پشت صحنه بسیاری ثبت شد. در زیر، پنج چیز را که در تلویزیون ندیده اید، بررسی کنید:", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۰۸:۳۲"}, {"source": "Billboard", "title": "LISA, Miley, Kacey Musgraves & John Mayer: New Music Friday Guide", "link": "https://www.billboard.com/music/music-news/lisa-miley-kacey-musgraves-new-music-friday-guide-1236366499/", "summary": "Billboard’s Friday Music Guide serves as a handy guide to New Music Friday’s most essential releases each week — the key music that everyone will be talking about today, and that will be dominating playlists this weekend and beyond. Last week , we featured Olivia Rodrigo feat. Chappell Roan, Tate McRae, Zach Bryan Angèle. This week, LISA drops her new EP; Miley features two new songs on the Nobody Wants This season three soundtrack; Kacey Musgraves shares a taste of her just-announced Middle of Nowhere Vol. 2: Tex Mex Tapes ; and John Mayer is back with a new single and newly-launched label… plus much more. Check out all of this week’s picks below: LISA, Press Play Led by the hard-hitting pop-rap single SaWaDiKa, released in September, LISA is now sharing her very first solo EP . Focus track Tarantino packs just as hard a punch , while Cobra is an attitude-packed dance-pop song and album closer Sweat is a sultry song that leaves its subject with a simple instruction don t stress me out and its listener wanting more. Press Play follows the 2025 release of LISA S debut solo full-length, Alter Ego , and arrives just in time for the Thai singer s upcoming Vegas residency that kicks off in November. — LYNDSEY HAVENS Miley, Cold Blooded For longtime Miley fans, the release of Cold Blooded has been a long time coming. Written in the late 2010s ahead of her EP She Is Coming , the track never saw the light of day until now. A demo version of the ballad, which showcases Miley s undeniable vocal control and power over simple piano chords, is featured as a bonus track on the season three soundtrack for Nobody Wants This , out today. Its one of two Miley demos that made it on the album, as a stripped-down version of her Endless Summer Vacation track You also features on the soundtrack and in an episode. The soundtrack is out on Atlantic, while all 10 episodes of season three are now streaming on Netflix. — L . H. Kacey Musgraves, “Weekend In Texas” Kacey Musgraves is previewing her upcoming project Middle of Nowhere Vol. 2: Tex Mex Tapes (out Jan. 15 on Lost Highway Records) with the release of new music, including “Weekend In Texas.” “I’ve got the hat and the cattle to back it up / Everything will be great in my favorite state of mind,” she sings. Bright horns, an irresistible groove and Musgraves’ dulcet vocal tones blend luxuriously as she sings of longing for a soul-restoring few days of escape in the Lone Star State. This new release feels both classic and invigor", "date_str": "2026-10-23T04:44:26+00:00", "hash": "061e1e6864ae6a7e", "title_fa": "LISA، Miley، Kacey Musgraves و John Mayer: New Music Friday Guide", "summary_fa": "راهنمای موسیقی جمعه بیلبورد به‌عنوان راهنمای مفیدی برای ضروری‌ترین نسخه‌های New Music Friday در هر هفته عمل می‌کند - موسیقی کلیدی که امروز همه درباره آن صحبت می‌کنند و این آخر هفته و بعد از آن بر فهرست‌های پخش غالب خواهد بود. هفته گذشته، ما شاهکار اولیویا رودریگو را معرفی کردیم. چاپل روآن، تیت مک‌ری، زک برایان آنجل. این هفته، LISA EP جدید خود را رها می کند. مایلی دارای دو آهنگ جدید در موسیقی متن Nobody Wants This فصل سوم است. کیسی ماسگریوز طعم تازه معرفی شده خود را با عنوان Middle of Nowhere Vol. 2: نوارهای Tex Mex ; و جان مایر با یک تک آهنگ جدید و لیبل تازه راه اندازی شده بازگشته است... به علاوه خیلی بیشتر. همه انتخاب‌های این هفته را در زیر ببینید: LISA، Press Play به رهبری تک‌آهنگ پاپ رپ سخت SaWaDiKa که در سپتامبر منتشر شد، لیزا اکنون اولین EP انفرادی خود را به اشتراک می‌گذارد. آهنگ فوکوس تارانتینو به همان سختی مشت می‌شود، در حالی که کبرا یک آهنگ رقص-پاپ و آلبومی پر نگرش است. Press Play پس از انتشار اولین انفرادی LISA S در سال 2025، Alter Ego، و درست به موقع برای اقامت آتی خواننده تایلندی در وگاس که در نوامبر آغاز می شود، می رسد. — LYNDSEY HAVENS مایلی، Cold Blooded برای طرفداران قدیمی مایلی، انتشار Cold Blooded مدت زیادی است که در راه است. آهنگی که در اواخر دهه 2010 قبل از EP او یعنی She Is Coming نوشته شد، تا به حال هرگز نور روز را ندیده بود. نسخه آزمایشی این تصنیف که کنترل صدای غیرقابل انکار و قدرت مایلی را بر روی آکوردهای ساده پیانو نشان می‌دهد، به عنوان یک تراک جایزه در موسیقی متن فصل سوم برای Nobody Wants This که امروز منتشر می‌شود، نمایش داده می‌شود. این یکی از دو دموی مایلی است", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "نتفلیکس"], "datetime_fa": "۱ آبان • ۰۸:۱۴"}, {"source": "Billboard", "title": "Cristian Castro Accepts the Billboard Lifetime Achievement Award ‘In the Name of Romantic Love’", "link": "https://www.billboard.com/music/latin/cristian-castro-billboard-lifetime-achievement-award-2026-2-1236365983/", "summary": "Cristian Castro became emotional on Thursday evening (Oct. 22) as he accepted the Billboard Lifetime Achievement Award at the 2026 Billboard Latin Music Awards, delivering a poetic speech inspired by love. “Romantic love and poetry are the only real things — the truest aspects of our human existence, the firmest thought, the clearest expression that emerges from our spirit and our hearts from the time we are children,” the pop icon remarked upon receiving the award from Mexican actress Jacqueline Bracamontes. “It is like when we first behold the soul — the serene calm of morning dew, the Moon, the majesty of a sunset — and that face, that presence, which fills your entire soul and which you cannot cast out from your being.” Related RAYE Wins 2026 Mercury Prize With This Music May Contain Hope 50 Cent Says He Had a Strong Feeling Suspect Accused of Assaulting Rick Ross Son Was Innocent After Posting Bond Cyndi Lauper, Tones And I CYRIL Team Up for Time After Time Remix: Exclusive “Throughout my life, romantic love has been my focal point and my true ambition — my firmament and my greatest longing,” continued the singer behind No. 1 hits such as “Amor” and “Azul.” “I accept this award in the name of romantic love and in the name of poetry; they are the most beautiful things I have ever possessed — gifts placed within me by God, alongside my voice.” Castro, who received the honor in recognition of a glittering career spanning more than three decades and his enduring influence on Latin music, also took to the stage for a special performance during the ceremony, broadcast live on Telemundo and Peacock from the James L. Knight Center in Miami. Together with the Mexican-American duo Ha*Ash, he performed their new collaboration “Antes Que Te Cases” live for the first time. The Billboard Lifetime Achievement Award honors an artist for an exceptional professional career — someone who has elevated Latin music to a new level on the global stage, remains relevant through their artistic and personal contributions, and whose influence has shaped the development of Latin music worldwide. Previous recipients include Andrea Bocelli, Armando Manzanero, Carlos Santana, José José, Maná, Marco Antonio Solís, Ricardo Arjona and Roberto Carlos, among others. Castro has solidified his place as one of the defining voices of Latin pop and romantic music. His history on the Billboard charts began in 1992 when “No Podrás” became his first entry on Hot Latin Songs, reaching No. 3. His ", "date_str": "2026-10-23T04:40:05+00:00", "hash": "a93ee97a68cfe6d1", "title_fa": "کریستین کاسترو جایزه یک عمر دستاورد بیلبورد \"به نام عشق رمانتیک\" را پذیرفت", "summary_fa": "کریستین کاسترو عصر پنجشنبه (22 اکتبر) با دریافت جایزه یک عمر دستاورد بیلبورد در جوایز موسیقی لاتین بیلبورد 2026 احساساتی شد و سخنرانی شاعرانه ای الهام گرفته از عشق ایراد کرد. این نماد پاپ پس از دریافت جایزه از بازیگر مکزیکی ژاکلین براکامونتس گفت: \"عشق و شعر عاشقانه تنها چیزهای واقعی هستند - واقعی ترین جنبه های وجود انسانی ما، محکم ترین فکر، واضح ترین بیانی که از روح و قلب ما از زمان کودکی ما بیرون می آید.\" \"مثل زمانی است که ما برای اولین بار روح را می بینیم - آرامش آرام شبنم صبح، ماه، عظمت غروب خورشید - و آن چهره، آن حضور را که تمام روح شما را پر می کند و نمی توانید آن را از وجود خود بیرون کنید.\" مرتبط RAYE برنده جایزه مرکوری 2026 با این موسیقی ممکن است حاوی امید باشد. جاه طلبی واقعی - فلک من و بزرگترین آرزوی من. 1 بازدید مانند \"Amor\" و \"Azul.\" من این جایزه را به نام عشق عاشقانه و به نام شعر می پذیرم؛ آنها زیباترین چیزهایی هستند که تا به حال داشته ام - هدایایی که خداوند در کنار صدایم در درون من قرار داده است. کاسترو که به پاس قدردانی از یک حرفه درخشان بیش از سه دهه و تأثیر ماندگارش بر موسیقی لاتین این افتخار را دریافت کرد، همچنین برای اجرای ویژه ای در طول مراسم روی صحنه رفت که به طور زنده از Telemundo و Peacock از جیمز ال. مرکز شوالیه در میامی. او به همراه دو نفر مکزیکی-آمریکایی Ha*Ash، همکاری جدید خود را با نام Antes Que Te Cases برای اولین بار به صورت زنده اجرا کرد. جایزه یک عمر دستاورد بیلبورد به هنرمندی برای یک حرفه حرفه‌ای استثنایی قدردانی می‌کند - کسی که موسیقی لاتین را به سطح جدیدی در صحنه جهانی ارتقا داده است، از طریق مشارکت‌های هنری", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۰۸:۱۰"}, {"source": "Billboard", "title": "LISA Is Dressed to Kill in Action-Packed ‘Tarantino’ Music Video: Watch", "link": "https://www.billboard.com/music/pop/lisa-action-packed-tarantino-music-video-watch-1236366977/", "summary": "Quentin Tarantino, your new action star is here. And her name is LISA . The BLACKPINK icon stars in the music video for “Tarantino,” which arrived at the stroke of midnight along with the release of her new six-track collection, Press Play (via Lloud and RCA Records ). Directed by Grammy Award-winning filmmaker James Mackel, the visual is three-and-a-half minutes of spy stuff, our hero, dressed to impress, making short work of the many villains who lurk in her hotel. LISA is on the watch with a flight to catch, and has a job to complete. She’s dressed for success as she leads a nifty choreographed routine with the hotel’s chambermaids and bellboys, and cooks up a flurry of punches, kicks and more en route to beating the stuffing out of the kitchenhands. “Got my nails really long like the barrel of my gun and my lipstick all over your face,” she sings, over the top of a sneaky beat. “I’m a boss, I’m a don when I’m driving to the sun. It’s a movie, baby, come and press play.” In the end, she gets a message through to her “favorite director,” who just happens to be in the building. Like a good Tarantino device, that red letter slipped under the door doesn’t give away its secrets. LISA teased the song in recent days through her socials and by way of a promo for PlayStation’s limited-edition “LISA” DualSense wireless controller , which she had a hand in designing. The K-pop star shows off the device, briefly, in the “Tarantino” clip when she autographs one for a fan. LISA’s Press Play EP features the lead single “SaWaDiKa,” which debuted at No. 69 on the Billboard Hot 100 and at No. 23 on the Billboard Global 200 in September. He debut solo album, Alter Ego , dropped in 2025, and speaked at No. 7 on the all-genres Billboard 200 . Watch the music video for “Tarantino” below and read Billboard Korea s review of Press Play here .", "date_str": "2026-10-23T04:38:11+00:00", "hash": "5c876628e4c5fb91", "title_fa": "موزیک ویدیو LISA Is Dressed to Kill در اکشن «Tarantino»: تماشا کنید", "summary_fa": "کوئنتین تارانتینو، ستاره اکشن جدید شما اینجاست. و نام او لیزا است. نماد BLACKPINK در موزیک ویدیو \"Tarantino\" ایفای نقش می کند، که در نیمه شب همراه با انتشار مجموعه شش آهنگ جدید او، Press Play (از طریق Lloud و RCA Records) منتشر شد. به کارگردانی جیمز مکل، فیلمساز برنده جایزه گرمی، تصویر بصری سه و نیم دقیقه از چیزهای جاسوسی است، قهرمان ما، لباس پوشیده برای تحت تاثیر قرار دادن، ساختن آثار کوتاه بسیاری از شرورانی که در هتل او کمین کرده اند. LISA مراقب پرواز است و باید کاری را انجام دهد. او برای موفقیت لباس می‌پوشد و یک برنامه رقص زیبا را با خدمتکارها و پسران زنگ هتل هدایت می‌کند، و در مسیر انبوهی از مشت‌ها، لگدها و چیزهای دیگر را برای کوبیدن مواد غذایی از دست آشپزخانه آماده می‌کند. او با صدایی زیرکانه آواز می خواند: «ناخن هایم را واقعاً بلند کردم مثل لوله تفنگم و رژ لبم روی تمام صورتت.» «من یک رئیس هستم، وقتی به سمت خورشید رانندگی می کنم، یک دان هستم. این یک فیلم است، عزیزم، بیا و Play را فشار بده.» در پایان، او پیامی را برای \"کارگردان مورد علاقه\" خود دریافت می کند که اتفاقاً در ساختمان است. مانند یک دستگاه خوب تارانتینو، آن حرف قرمز که زیر در لغزید، اسرار خود را فاش نمی کند. LISA این آهنگ را در روزهای اخیر از طریق شبکه های اجتماعی خود و از طریق تبلیغی برای کنترلر بی سیم DualSense نسخه محدود پلی استیشن به نام \"LISA\" که او در طراحی آن دستی داشت، دست انداخت. ستاره کی‌پاپ در کلیپ «تارانتینو» زمانی که یکی از طرفدارانش را امضا می‌کند، دستگاه را به طور خلاصه نشان می‌دهد. LISA's Press Play EP دارای تک‌آهنگ اصلی \"SaWaDiKa\" است که در ماه سپتامبر در رتبه 69 در Billboard Hot 100 و شماره 23 در Billboard Global", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۰۸:۰۸"}, {"source": "Billboard", "title": "Fuerza Regida Wins Big at Billboard Latin Music Awards 2026: Complete List", "link": "https://www.billboard.com/lists/billboard-latin-music-awards-2026-winners-list/", "summary": "Fuerza Regida was the big winner at the 2026 Billboard Latin Music Awards on Thursday (Oct. 22), taking home eight awards including Top Latin Albums Artist of the Year, Duo or Group; Regional Mexican Artist of the Year, Duo or Group; and Regional Mexican Song of the Year for “Marlboro Rojo.” Additionally, the group received the Billboard Vanguard Award in recognition of a career defined by innovation and an unconventional creative vision that has pushed the boundaries of Mexican music. “We don’t have many words — there aren’t many words — but this represents a 10-year journey, a lot of hard work and a great deal of effort,” said the band s leader, Jesús Ortiz Paz (JOP), upon accepting their special award. “We’re going to keep working, and we’re going to conquer the world, God willing.” Although not present, Bad Bunny followed with seven Billboard Latin Music Awards, while Karol G, Peso Pluma and Romeo Santos won four each. Rosalía, Tito Double P and Prince Royce each took home three. Rosalía, who was in attendance to receive the Billboard Hall of Fame Award, stated that she could not be an artist were it not for those who came before her — such as Celia Cruz, Rocío Dúrcal, Vicente Fernández, Daddy Yankee and Juan Luis Guerra, who presented her with the award. “It’s incredible to be receiving this today,” said the Spanish superstar, also thanking Latin America “for all these years of inspiration and lessons.” She also won awards for Latin Pop Artist of the Year, Solo; and Top Latin Pop Album of the Year for LUX . The Billboard Latin Music Awards, broadcasted live on Telemundo and Peacock, featured 47 categories spanning major Latin music genres such as pop, tropical, Latin rhythm and regional Mexican. Additionally, for the first time fans had a historic opportunity to choose one of the night s winners through a new award, Fan Favorite Artist, which went to Karol G. Among the artists set to perform throughout the evening are Carlos Rivera, Chuyin, Elvis Crespo, Erick Brian, Ha*Ash, Jessi Uribe, Kapo, La Nueva Ola de la Cumbia, Manuel Turizo, Melymel, Nanpa Básico, Nella, Ozuna, Pablo Alborán, Paola Jara, Pututi Nesty, RIZA, SANTOS BRAVOS, Tito Double P, Víctor Manuelle, Xavi and Yahritza y Su Esencia. For a full list of performances, click here . The ceremony also honored Cristian Castro with the Billboard Lifetime Achievement Award for his enduring and exceptional career; and Rubén Blades with the Billboard Icon Award, celebrating his timeless career in Lat", "date_str": "2026-10-23T04:06:36+00:00", "hash": "e4b47fe75504603c", "title_fa": "Fuerza Regida در جوایز موسیقی لاتین بیلبورد 2026 برنده شد: فهرست کامل", "summary_fa": "Fuerza Regida برنده بزرگ جوایز موسیقی لاتین بیلبورد 2026 در روز پنجشنبه (22 اکتبر) بود و هشت جایزه از جمله بهترین هنرمند آلبوم لاتین سال، دو یا گروه را به خانه برد. هنرمند منطقه ای مکزیکی سال، دو یا گروه. و آهنگ منطقه ای مکزیکی سال برای \"Marlboro Rojo\". علاوه بر این، این گروه جایزه بیلبورد پیشتاز را به‌عنوان به رسمیت شناختن شغلی که با نوآوری و دیدگاه خلاقانه غیرمتعارف تعریف شده بود، دریافت کرد که مرزهای موسیقی مکزیکی را جابجا کرده است. خسوس اورتیز پاز (JOP) رهبر گروه پس از دریافت جایزه ویژه آنها گفت: \"ما کلمات زیادی نداریم - کلمات زیادی وجود ندارد - اما این نشان دهنده یک سفر 10 ساله، کار سخت و تلاش زیادی است.\" ما به کار خود ادامه می دهیم و به خواست خدا دنیا را فتح خواهیم کرد.» با وجود اینکه Bad Bunny حضور نداشت، با هفت جایزه موسیقی لاتین بیلبورد دنبال شد، در حالی که Karol G، Peso Pluma و Romeo Santos هر کدام چهار جایزه را بردند. روزالیا، تیتو دابل پی و پرنس رویس هر کدام سه نفر را به خانه بردند. روزالیا، که برای دریافت جایزه تالار مشاهیر بیلبورد حضور داشت، اظهار داشت که اگر کسانی که پیش از او آمده بودند - مانند سلیا کروز، روسیو دورکال، ویسنته فرناندز، بابا یانکی و خوان لوئیس گوئرا که این جایزه را به او دادند، نمی توانست هنرمند باشد. سوپراستار اسپانیایی و همچنین از آمریکای لاتین برای این همه سال الهام گرفتن و درس‌ها تشکر کرد: «این باورنکردنی است که امروز این را دریافت می‌کنم.» او همچنین برنده جوایز برای هنرمند پاپ لاتین سال، Solo; و بهترین آلبوم پاپ لاتین سال برای LUX. جوایز موسیقی لاتین بیلبورد، که به صورت زنده از Telemundo و Peacock پخش می‌شد، دارای 47 دسته بود که شامل ژانرهای اصلی موسیقی لاتین مانند پاپ، استوایی، ریتم", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۰۷:۳۶"}, {"source": "Billboard", "title": "LISA’s ‘Press Play’: All 6 Tracks Ranked", "link": "https://www.billboard.com/lists/lisa-press-play-album-review-tracks-ranked/", "summary": "LISA is back, and she brought a movie. On Sept. 27, LISA took home best pop at the 2026 MTV Video Music Awards for “Dream,” beating a field that included Taylor Swift, Ariana Grande, Sabrina Carpenter and Olivia Rodrigo, and becoming the first K-pop soloist to win the category. It added to a run that already included a No. 7 peak on the Billboard 200 with last year’s Alter Ego . Then in September came pre-release single “SaWaDiKa,” which entered the Billboard Hot 100 at No. 69. Related It s a Movie, Baby : LISA of BLACKPINK Announces Cinematic Press Play Single Tarantino Now, with that momentum behind her, LISA unveils her new EP, Press Play . The title comes from a line on “Tarantino”: “It’s a movie baby, come and press play.” It’s a fitting name for a record that hits the eyes as hard as the ears. Press play and the scenes flash by: a tuk-tuk weaving through the streets of Bangkok, a Ferrari tearing around a circuit, a dance floor after midnight, a motel straight out of a Tarantino film, a yoga studio. LISA holds a songwriting credit on every track, and Kuk Harrell, the vocal producer behind Rihanna’s “Umbrella,” worked on vocal production. Rap and sing-rap dominate much of the record, but each track carries its own texture, so it never drags. The world should get ready for the movie LISA has brought with her. Below, Billboard Korea ranks all six tracks on Press Play .", "date_str": "2026-10-23T04:01:00+00:00", "hash": "01bc2063b8a7dea2", "title_fa": "«Press Play» LISA: همه 6 آهنگ رتبه‌بندی شدند", "summary_fa": "لیزا برگشته و یه فیلم آورد. در 27 سپتامبر، LISA بهترین موسیقی پاپ را در جوایز موسیقی ویدئویی MTV 2026 برای \"Dream\" به خانه برد و توانست میدانی را که شامل تیلور سویفت، آریانا گرانده، سابرینا کارپنتر و اولیویا رودریگو می‌شد، شکست دهد و اولین تک‌نواز کی‌پاپ برنده این دسته شود. این به مجموعه‌ای افزوده شد که قبلاً با Alter Ego سال گذشته، اوج شماره 7 بیلبورد 200 را به خود اختصاص داده بود. سپس در ماه سپتامبر، تک آهنگ پیش از انتشار \"SaWaDiKa\" منتشر شد که در رتبه 69 در 100 بیلبورد داغ قرار گرفت. مرتبط: این یک فیلم است، عزیزم: LISA از BLACKPINK اعلام کرد مطبوعات سینمایی بازی کنید تارانتینو مجرد اکنون، با آن شتاب پشت سر، لیزا از EP جدید خود، Press Play پرده برداری می کند. عنوان برگرفته از جمله ای از «تارانتینو» است: «این یک فیلم است عزیزم، بیا و بازی را فشار بده». این یک نام مناسب برای رکوردی است که به اندازه گوش به چشم می خورد. پخش را فشار دهید و صحنه ها با چشمک می زنند: یک توک توک که در خیابان های بانکوک می بافد، یک فراری در حال پاره شدن یک مدار، یک زمین رقص بعد از نیمه شب، یک متل مستقیماً از یک فیلم تارانتینو، یک استودیوی یوگا. LISA در هر آهنگ دارای اعتبار آهنگسازی است، و Kuk Harrell، تهیه‌کننده خواننده پشت آهنگ \"Umbrella\" ریحانا، روی تولید آواز کار کرد. رپ و خوانندگی رپ بر بسیاری از رکوردها غالب هستند، اما هر آهنگ دارای بافت خاص خود است، بنابراین هرگز نمی کشد. جهان باید برای فیلمی که لیزا با خود آورده است آماده شود. در زیر، Billboard Korea هر view with GQ, the actor previously said of the Israel-Gaza war, “Put me down as thinking it’s a genocide. Put me down as wanting a free Palestine.”", "date_str": "2026-10-23T02:53:34+00:00", "hash": "4cde64befc14b775", "title_fa": "واکنش ارین فاستر، خالق «هیچ‌کس این را نمی‌خواهد» به آدام برودی گفت که از «فلسطین آزاد» حمایت می‌کند: «پیچیده است»", "summary_fa": "در مصاحبه با GQ، این بازیگر قبلاً در مورد جنگ اسرائیل و غزه گفته بود: «من را به این دلیل که فکر می‌کنم یک نسل‌کشی است، سرزنش کنید. من را به عنوان خواهان یک فلسطین آزاد زمین گیر کن.» متن لوگو هیچ‌کس این را نمی‌خواهد، ارین فاستر، خالق، نظر خود را درباره آدام برودی به اشتراک می‌گذارد که اخیراً به GQ گفته است که از «فلسطین آزاد» حمایت می‌کند. در طول حضور آتی در پادکست نه لاغر اما نه چاق، در هر هفته سرگرمی، آماندا هیرش مجری برنامه از فاستر سوال کرد که در مورد نظرات قبلی این بازیگر درباره جنگ اسرائیل و غزه چه احساسی دارد. \"میدونی، این پیچیده است. سازنده سریال گفت: فکر می کنم محیط کار ما، مجموعه ما بسیار شبیه به میزهای شام در سراسر جهان است که در آن افراد در حال بحث و گفتگو و اختلاف نظر هستند. \"در حالی که من آدام را دوست دارم، با او مخالفم، و این اشکالی ندارد.\" داستان‌های مرتبط تلویزیون هیچ‌کس این فصل را نمی‌خواهد نقد و بررسی: کریستن بل و آدام برودی عاشقانه‌های نتفلیکس سطح بالایی دارند، اما نمی‌توانند عادت‌های قدیمی را کنار بگذارند، سبک زندگی کتاب‌های سالی رونی که از بریتانیا بیرون کشیده شده‌اند. فاستر ادامه داد: «من فکر می‌کنم که به‌عنوان خالق نمایش، تنها چیزی که می‌توانم بگویم این است که می‌خواهم طرفداران یهودی ما بدانند که من شما را می‌بینم و شما را می‌شنوم و احساس شما را درک می‌کنم، فاستر ادامه داد. و نمایش همیشه یک نامه عاشقانه به یهودیت بوده و خواهد بود. به همین دلیل این نمایش را ساختم. این به خاطر تجربه زیبایی است که یهودی شدن و یهودی بودنم را تجربه کرده‌ام، و همین الان در این زمان در دنیایی که در آن بازنمایی مثبت از یهودیان وجود ندارد، اینجا نشسته‌ام، فکر می‌کنم داشتن آن بسیار مهم است.»", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۱ آبان • ۰۶:۲۳"}, {"source": "Hollywood Reporter", tags": ["نتفلیکس"], "datetime_fa": "۱ آبان • ۰۴:۳۴"}, {"source": "Hollywood Reporter", "title": "‘Clayface’ Aims to Give DC Studios a Box Office Win as ‘You Can See Everything’ Stays Strong", "link": "https://www.hollywoodreporter.com/movies/movie-news/clayface-box-office-you-can-see-everything-wildwood-klara-1236738669/", "summary": "Also debuting this weekend are 'Wildwood,' 'Klara and the Sun,' 'Wicker' and 'Ali G: Who Iz I?'", "date_str": "2026-10-23T00:52:00+00:00", "hash": "27cec15fb64faa29", "title_fa": "\"Clayface\" قصد دارد به استودیو DC یک پیروزی در باکس آفیس بدهد زیرا \"شما می توانید همه چیز را ببینید\" قوی می ماند", "summary_fa": "همچنین «Wildwood»، «Klara and the Sun»، «Wicker» و «Ali G: Who Iz I؟» این آخر هفته برای اولین بار به نمایش درآمدند. متن لوگوی Clayface به نظر می‌رسد به تیم استودیو دی‌سی دلیلی برای چهره‌ای شاد در آخر هفته افتتاحیه خود در گیشه می‌دهد، اگرچه با رقابت فریم دوم برای A24s You Can See Everything مواجه خواهد شد که همچنان مخاطبان را جذب می‌کند. برادران وارنر پیش‌بینی می‌کند بین 25 تا 30 میلیون دلار برای Clayface از بیش از 3400 سالن سینمای آمریکای شمالی، به همراه 20 تا 25 میلیون دلار دیگر در سطح بین‌المللی، اکران داخلی برای فیلم Clayface داشته باشد. جیمز واتکینز کارگردان فیلم ترسناک بدنی با بودجه 44 میلیون دلاری، تام ریس هریس و نائومی آکی را در داستان مت هاگن (هری) بازی می کند، بازیگری که پس از تغییر شکل چهره اش برای کمک به یک دانشمند (آکی) مراجعه می کند. داستان‌های مرتبط تلویزیونی جنا اورتگا می‌گوید پس از پایان فیلم‌های چهارشنبه، برای مدتی از تلویزیون خارج می‌شود، تراویس نایت، کارگردان Wildwood، ۱۶ سال برای خلق شاهکار استاپ‌موشن خود صرف کرد، این سومین اکران بلند در فهرست برنامه‌ریزی‌شده برای جیمز گان و پیتر سافران، روسای استودیو دی‌سی است. سوپرمن سال گذشته بخش سینمایی دنیای دی سی را با شروعی قدرتمند آغاز کرد، در حالی که سوپرگرل در تابستان با بودجه 170 میلیون دلاری به فروش داخلی 37.1 میلیون دلاری رسید و اکرانش با 126 میلیون دلار در سراسر جهان به پایان رسید. Clayface از مزایای بودجه بسیار کمتری برخوردار است. Clayface نسبت به Supergirl با منتقدان بهتر عمل کرده است و 75 درصد از منتقدان Rotten Tomatoes تایید شده است، در مقابل امتیاز 52 برای اکران تابستانی Milly Alcock. فرانک شِک، منتقد، در دیدگاه خود برای هالیوود ریپورتر، کلیفیس را یک نوسان بزرگ خواند که قطعا نتیجه می دهد.", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۰۴:۲۲"}, {"source": "Hollywood Reporter", "title": "Looksmaxxing Influencer Clavicular Pleads Not Guilty to Rape Charge", "link": "https://www.hollywoodreporter.com/news/general-news/looksmaxxing-clavicular-pleads-not-guilty-rape-charge-1236738752/", "summary": "The manosphere influencer, whose real name is Braden Peters, faces charges related to raping a teenager in Massachusetts.", "date_str": "2026-10-23T00:48:25+00:00", "hash": "b5cb2d26c9602cbc", "title_fa": "Looksmaxxing Influencer Clavicular اقرار به اتهام تجاوز جنسی ندارد", "summary_fa": "اینفلوئنسر مانوسفر، که نام اصلی او برادن پیترز است، با اتهامات مربوط به تجاوز به یک نوجوان در ماساچوست مواجه است. متن لوگوی «Looksmaxxing» اینفلوئنسر Clavicular، اینفلوئنسر در حال ظهور رسانه‌های اجتماعی که به دلیل ترویج یک خرده فرهنگ اینترنتی با تمرکز بر به حداکثر رساندن جذابیت فیزیکی شناخته می‌شود، تجاوز به یک دختر زیر سن قانونی را پس از مصرف الکل در حین حضور در پخش زنده خود در سال 2025 اعتراف کرده است. Clavicular، جوان 20 ساله ای که نام اصلی او برادن پیترز است، روز پنجشنبه در یک دادگاه کوتاه در ماساچوست وارد این ادعا شد. در ماه سپتامبر، او به دو فقره جنایت، یکی تجاوز جنسی و دیگری به دلیل مصرف مواد مخدر به یک فرد برای آمیزش جنسی متهم شد. او همچنین به دلیل ارائه مشروبات الکلی به فردی کمتر از 21 سال با اتهام جنایت روبرو است. داستان‌های مرتبط Business Charli D Amelio، Rob Rausch، Sofia Franklyn و سایر علاقه‌مندان به اینترنت به THR بپیوندند تا از سازندگان جشن بگیرند. او ویدئویی را در شبکه‌های اجتماعی خود منتشر کرده است که تصاویری از یک مکالمه متنی و عکسی از یک نامه دست‌نویس را نشان می‌دهد، که بر روی تصاویری از پیترز، بدون پیراهن و مرتب کردن موهایش در بندرگاه داخلی شهری، قطع شده است. او در زیر پست‌ها نوشته است: «راه‌های بهتری برای پول درآوردن وجود دارد، پس از اینکه از کسی شکایت کنید چون شما را نمی‌خواهد». \"جالب...\" \"طمع گناه است؛\" و \"آره هنوز هم برای من پیامک می‌فرستد تا امروز... نه اینکه بخواهم حریص باشم و چک بگیرم.\"", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۰۴:۱۸"}, {"source": "Hollywood Reporter", "title": "Michael Gray, Former Teen Idol and Star of ‘Shazam!,’ Dies at 75", "link": "https://www.hollywoodreporter.com/tv/tv-news/michael-gray-dead-shazam-1236738709/", "summary": "After dating Marcia on ‘The Brady Bunch,’ he spent three seasons turning into Captain Marvel on Saturday mornings.", "date_str": "2026-10-22T22:59:26+00:00", "hash": "05a7d9b92525d5cd", "title_fa": "مایکل گری، بت نوجوان سابق و ستاره «شزم!» در ۷۵ سالگی درگذشت", "summary_fa": "پس از قرار ملاقات با مارسیا در سریال The Brady Bunch، او سه فصل را صرف تبدیل شدن به کاپیتان مارول در صبح‌های شنبه کرد. مایکل گری، که در دهه 1970 در برنامه بچه های شنبه صبح شنبه Shazam بازی کرد! سخنگوی خانواده اعلام کرد که بیلی باتسون، نوجوانی که در پف دود به ابرقهرمان کاپیتان مارول تبدیل می‌شود، روز جمعه در صحرای پالم به مرگ طبیعی درگذشت. گری اغلب جلدهای تایگر بیت و سایر مجلات محبوب نوجوانان را زیبا می کرد زیرا اولین کنسرت سریال خود را به عنوان دانشجوی دکتر به نام رونی کالینز در فصل اول سریال کمدی مردم کوچولو NBC در سال های 1972-1974 با بازی برایان کیث و شلی فابارس دریافت کرد. Gray’s Billy فقط باید یک کلمه به زبان بیاورد - \"shazam\" - در برنامه زنده CBS که برای سه فصل (1974-1976) پخش شد، به کاپیتان مارول (با بازی جکسون بوستویک و سپس جان دیوی) تبدیل شود. افتتاحیه نمایش را اینجا ببینید. داستان‌های مرتبط فیلم‌ها تام اسکریت، ستاره حصارهای پیکت و بیگانه، در 93 نیوز می‌میرد آن هورنادی، منتقد قدیمی فیلم واشنگتن پست، در 66 سالگی درگذشت «به یاد می‌آورم زمانی که تغییر از بیلی به کاپیتان مارول را تجربه می‌کردیم، با استفاده از نوعی دستگاه فلاش و پوف - دود از بین می‌رفت. آنها به سرعت تغییر کردند. این قطعاً کار نکرد.» پس از آن گری در Shazam نقش آفرینی کرد! Fury of the Gods (2023)، جایی که او با کاپیتان مارول زکری لوی در ارتباط با سریال اصلی تعامل داشت. گری در 2 سپتامبر 1951 در شیکاگو به دنیا آمد و قبل از اینکه به هالیوود برود، در ساحل میامی بزرگ شد، جایی که در خانه نمایش پاسادنا بازیگری خواند.", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۰۲:۲۹"}, {"source": "Hollywood Reporter", "title": "Streaming Ratings: ‘Carrie’ Has a Bloody Good Opening Week", "link": "https://www.hollywoodreporter.com/tv/tv-news/streaming-ratings-oct-5-11-2026-1236738659/", "summary": "The Stephen King adaptation premieres at No. 1 overall.", "date_str": "2026-10-22T22:25:58+00:00", "hash": "55760f8e58b7ff2c", "title_fa": "رتبه‌بندی‌های جریان: «کری» هفته افتتاحیه خوبی دارد", "summary_fa": "متن لوگو اوایل پنجشنبه، Prime Video تمدید فصل دوم برای کری را اعلام کرد. اکنون داده‌هایی در دسترس عموم وجود دارد که از این تصمیم پشتیبانی می‌کند. کری به عنوان اولین عنوان پخش جریانی در ایالات متحده در هفته 5 تا 11 اکتبر به نمایش درآمد. فصل هشت قسمتی، به‌روزرسانی امروزی رمان استیون کینگ از مایک فلانگان، مجری برنامه، 1.26 میلیارد دقیقه در هفته تماشا کرد (این سریال در 7 اکتبر پخش شد). Prime Video اخیراً در یک روند داغ بوده است: در هشت هفته گذشته رتبه‌بندی پخش جریانی Nielsen، شش بار عنوان شماره 1 کلی را کسب کرده است. ریچر چهار بار در ماه آگوست و سپتامبر در رتبه اول قرار گرفت و جای خود را به اسپین آف نیگلی در هفته 14 تا 20 سپتامبر داد. داستان‌های مرتبط TV Carrie برای فصل دوم در تلویزیون پرایم ویدیو تمدید شد، جاش هارتنت در مورد یافتن (و رد کردن) لهجه‌ی زیر خود، و تصادف اتومبیلی که تقریباً تولید را از مسیر خارج کرد، همچنین در ماه اکتبر به خوبی افتتاح شد. فریم 5-11 نتفلیکس زیر بود. فیلم هیجان انگیز با بازی جاش هارتنت 1.19 میلیارد دقیقه زمان تماشا داشت که در مجموع برای رتبه دوم خوب بود. شرق عدن با 49 درصد رشد هفته به هفته به 1.16 میلیارد دقیقه رسید که در جایگاه سوم قرار گرفت. برترین نمایش هفته قبل، Wonkas The Golden Ticket، با افت 44 درصدی به 600 میلیون دقیقه برای نتفلیکس رسید. از بین 10 سریال برتر حذف شد اما در بین سری های اصلی ششم شد. از سوی دیگر، تد لاسو (943 میلیون دقیقه)، در ان می دهد که توسط تروریست های داعش در لیبی به همراه سایر خانواده های قبطی ربوده شده است، و گناه بقای او در زمان رها شدن با آن زندگی می کند. محبوب در ورایتی سامان در شیفت شب به عنوان نگهبان در یک ساختمان آپارتمانی کار می کند که مانند بسیاری از ساختمان های مشابه در قاهره، فضای کوچکی از نابرابری طبقاتی و اقتصادی است - که در آن یک لابی سرد و ناخوشایند نه از آپارتمان های به خوبی نگهداری شده است و نه از ساخت و سازهای غیرقانونی در پشت بامی که مرد جوان در آن زندگی می کند. سامان که به دنبال یک مشاجره برای کمک به برادرش در بازداشت نیاز دارد، با یکی از ساکنان (مگدا منیر) که پسر تروریستش عبدالله (حازم عصام) را در خانه", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "سینما"], "datetime_fa": "۱ آبان • ۱۵:۵۰"}, {"source": "Variety", "title": "Lara Croft’s Inaugural Voice Actor Shelley Blond Recalls First Time She Saw ‘Tomb Raider’ Character: ‘I Thought She Was Very Sexy and Very Ballsy’", "link": "https://variety.com/2026/digital/global/lara-croft-shelley-blond-voice-actor-audition-tomb-raider-1236922413/", "summary": "It’s been thirty years since Lara Croft was unleashed on the world via the hit video game “Tomb Raider.” Released first in Europe, on Oct. 24, 1996, for the Sega Saturn, the title broke the rules in every way: an action-packed video game for adults with a female lead player character. With her double handguns, [ ]", "date_str": "2026-10-23T12:06:42+00:00", "hash": "76f31ece5e524ddd", "title_fa": "شلی بلوند، صداپیشه افتتاحیه لارا کرافت، اولین باری که شخصیت «مهاجم مقبره» را دید، به یاد می آورد: «فکر می کردم او بسیار سکسی و بسیار بالسی است»", "summary_fa": "سی سال از زمانی که لارا کرافت از طریق بازی ویدیویی موفق \"Tomb Raider\" در جهان معرفی شد، می گذرد. این عنوان برای اولین بار در اروپا، در 24 اکتبر 1996، برای سگا ساترن منتشر شد، این عنوان از هر نظر قوانین را زیر پا گذاشت: یک بازی ویدئویی پر اکشن برای بزرگسالان با یک شخصیت اصلی زن. با اسلحه‌های دوتایی خود، سی سال از زمانی که لارا کرافت از طریق بازی ویدیویی موفق «Tomb Raider» در جهان عرضه شد، می‌گذرد. در حالی     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
