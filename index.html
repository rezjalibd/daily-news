      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

rs and business,\" Salesforce Chief Operating Officer Miguel Milano wrote in an email to employees. The budgets reflect a delicate balance for companies adopting AI. They want to control spending for the expensive technology without discouraging employees from using it. A Salesforce spokesperson said the company does not have companywide individual token budgets, leaving it up to team leaders to manage AI usage. \"Our focus is always to ensure that our AI investments deliver the greatest impact for our business and customers,\" the spokesperson added. Salesforce piloted the new AI budgets on one team for a month and found that group \"was operating well under budget by month two with no drop in output,\" the memo stated. The sales organization under President and Chief Revenue Officer Alexa Vignone will have a budget of $1,000 per month for technical roles, and $100 per month for non-technical roles like sellers. Salesforce Customer Success, under Jim Roth, and Salesforce Global Professional Services and Forward Deployed Engineering, under Lori Steele, will have budgets of $500 per month for technical roles and $100 per month for non-technical roles. Other companies have introduced similar spending limits. As Business Insider recently reported , Coinbase has weekly AI spending caps ranging from $500 to $5,000 based on employee roles and seniority. JPMorgan Chase introduced a $2,000 monthly limit for some engineers using Anthropic's Claude Code. In May, Salesforce CEO Marc Benioff said the company expected to spend roughly $300 million on Anthropic tokens this year, largely for coding agents. Read the memo Team, As we scale our AI capabilities, we're getting smarter about how we manage them. Last quarter, some individuals spent thousands of dollars per month on tokens. With AI confidence now high, we're shifting focus from adoption to impact. Starting this month, every role has a monthly token ", "date_str": "2026-11-17T19:07:58+00:00", "hash": "332521f90f1879b8", "t  software company Wayve , and autonomous trucking startup Waabi. The robotics investments are part of a broader push that made Nvidia a financial backer of much of the AI ecosystem. At the end of July, it held $48 billion in stakes across 229 private companies, including OpenAI and Anthropic. Nvidia s interim CEO Colette Kress Nvidia Deepu Talla, an Nvidia robotics vice president who worked on some of the company’s investments, told Business Insider that Nvidia intends to \"continue to aggressively cultivate the ecosystem.” Nvidia's robotics products brought in $11 billion in the first half of this year, 30% more than in all of 2025, Talla said. Some of that revenue comes from companies Nvidia has invested in. The company's robotics strategy has two parts: devel", "date_str": "2026-11-17T19:03:17+00:00", "hash": "d5d89a7aa4e32d7b", "title_fa": "انویدیا به استارت‌آپ‌های روباتیک می‌گوید که از پشتیبانی آن‌ها برخوردار هستند زیرا سؤالاتی در مورد استراتژی سرمایه‌گذاری آن در حال چرخش است", "summary_fa": "دفتر مرکزی انویدیا Benjamin Fanjoy/Getty Images انویدیا به استارت‌آپ‌های روباتیک اطمینان داد که پشتیبانی آن پس از خروج جنسن هوانگ ادامه خواهد داشت. انتظار می رود کولت کرس، مدیرعامل موقت، معاملات را کندتر از هوانگ دنبال کند. انویدیا از بیش از 35 شرکت رباتیک و هوش مصنوعی فیزیکی حمایت کرده است. انویدیا پس از جدایی ناگهانی جنسن هوانگ با پیامی به استارت آپ های روباتیک دسترسی پیدا می کند: سازنده تراشه همچنان پشتیبان خود است. بیزینس اینسایدر دریافته است که از زمان استعفای هوانگ، این شرکت و بازوی سرمایه گذاری آن، NVentures، با حداقل سه استارت آپ روباتیک تماس گرفته اند تا آنها را از حمایت خود مطمئن کنند. تماس‌ها از پنجشنبه گذشته، اندکی پس از استعفای هوانگ آغاز شد، و استارت‌آپ‌ها اطمینان دادند که کسب‌وکار طبق معمول ادامه خواهد داشت. این اطلاع رسانی در بحبوحه عدم قطعیت در مورد استراتژی سرمایه گذاری گسترده تر انویدیا در زمان مدیر عامل موقت کولت کرس انجام می شود، که انتظار نمی رود او به سرعت هوانگ معاملات را دنبال کند و گاهی اوقات سرمایه گذاری هایی را که از او حمایت می کرد عقب نشینی می کند. انویدیا از اظهار نظر در مورد تماس ها خودداری کرد. در زمان هوانگ، انویدیا یکی از حامیان اصلی رباتیک و «هوش مصنوعی فیزیکی» شد، اصطلاحی که او برای هوش مصنوعی که می‌تواند در دنیای واقعی عمل کند، رایج شد. در کنفرانس های شرکت، او اغلب در کنار روبات های انسان نما روی صحنه ظاهر می شد. هوانگ رباتیک را به عنوان \"اولین فرصت صنعت فناوری برای پرداختن به صنعت 50 تریلیون دلاری که تا کنون عمدتاً فاقد فناوری بوده است\" توصیف کرد. طبق داده های PitchBook، این اشتیاق به سرمایه گذاری در بیش از 35 شرکت رباتیک و هوش مصنوعی فیزیکی تبدیل شد. از این تعداد، 29 مورد، دورهای مالی را با مجموع نزدیک به", "image_url": "https://i.insider.com/6afc9cf304834674c81c6c37?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Nvidia"], "datetime_fa": "۲۶ آبان • ۲۲:۳۳"}, {"source": "Business Insider", "title": "What smart people are saying about Jensen Huang's new statement", "link": "https://www.businessinsider.com/jensen-huang-new-statement-nvidia-reaction-2026-11", "summary": "Jensen Huang broke his silence on Tuesday. Jose Sarmento Matos/Bloomberg via Getty Images Jensen Huang said he'd be \"honored\" to return to Nvidia. The ex-CEO broke his silence on Tuesday after resigning in the wake of affair allegations. Here's what business leaders think of his new statement. Ex-Nvidia CEO Jensen Huang finally addressed his resignation publicly — and he'd be happy to undo it if invited back. In his statement, Huang said he owned his \"mistakes completely\" and that he was cooperating with an internal investigation. The statement adds new pressure to Nvidia's board and interim leadership hours before the company reports quarterly earnings after the closing bell. Here's what business and tech leaders and personalities are saying about Huang's statement: Travis Kalanick, Uber founder Travis Kalanick Zak Bennett/Bloomberg via Getty Images Kalanick, who's pushed publicly for Huang to be reinstated, celebrated the statement on X. The Uber cofounder was famously f programs that qualify for higher student-loan borrowing limits. Trump's repayment overhaul would allow 11 programs to qualify for the higher $200,000 borrowing cap. The bill calls for excluded programs, like advanced nursing, to qualify for the higher limit. Democratic lawmakers are pushing to expand access to higher student-loan borrowing limits . On Tuesday, Sens. Kirsten Gillibrand and Jeff Merkley introduced a bill that would expand the number of advanced degrees that qualify for a professional degree designation and thus a higher borrowing cap. President Donald Trump's student-loan repayment overhaul placed a $100,000 lifetime borrowing cap on graduate degrees and a $200,000 cap on professional degrees. The administration also planned to limit professional degrees to 11 programs, such as medicine and law, while excluding other programs like nursing, social work, and education. The limits were met with criticism by both Democratic and Republican lawmakers who argued that limiting borrowing for nurses would exacerbate the healthcare worker shortage. A lawsuit blocked the administration from implementing the new limits on July 1, and the Democratic lawmakers are now seeking to codify professional status for an expanded list of degrees . \"Nurses, teachers, and social workers are dedicated public servants, and Congress must do everything it can to help recruit the next generation of these heroes,\" Merkley said in a statement. \"We're already facing a shortage of these critical workers, and new limits on federal student loans for these professions and others threaten to further jeopardize the future of our workforce.\" The bill would maintain professional status for programs that already qualify while restoring professional status to additional programs, including nursing, public health, and physician assistant programs. It would also give the education secretary the flexibility to add more programs that meet the \"professional degree\" requirements. It follows a s plan to build a super app. The Hulu-Disney+ marriage is happening right on schedule. Disney's plan to fully unify its streamers \"is nearly complete\" and will be finalized in December, the company told investors on Tuesday. It could be the beginning of the end for a stand-alone Hulu app, though Disney hasn't said when the current Hulu app would be discontinued or what will happen to the beloved Hulu brand. This initiative, known internally as \"Project Gemini,\" was scheduled to be finished by the end of 2026, Business Insider reported in May. In the coming weeks, the Disney+ app is getting its last Hulu-specific features, including the ability to watch live TV and add-on streamers for users with qualifying subscriptions. Disney has spent years integrating Hulu's content and features into its namesake streamer in an effort to lift engagement and reduce cancellations. Merging the streamers can create \"a more seamless way to discover and engage with the breadth of content across our brands and franchises,\" Disney said in its shareholder letter as it shared earnings . The decision to move Hulu fully onto Disney+ may make the stand-alone Hulu app obsolete. An internal document obtained by Business Insider in May said that \"the Hulu tech stack and app will be decommissioned after all users have transitioned\" to Disney+, though it didn't specify exactly when that would happen. A Disney streaming town hall presentation in early November said that \"One App Milestones\" are expected to last through the company's fiscal fourth quarter, which spans early July to early October. The slide deck referenced Project Gemini, but didn't list the \"One App Milestones\" or explain the implications of completing them. How Hulu fits into the super app strategy Putting Hulu and Disney+ under one roof is part of CEO Josh D'Amaro's plan of building a super app where streaming subscribers can play games and buy merchandise without leaving the app. Disney's ambition is \"to connect Disney+ more closely with the whole company,\" D'Amaro said on Tuesday's earnings call. \"That means our parks, our cruise ships, merchandise, and games.\" This all-in-one experience will b", "date_str": "2026-11-17T17:12:29+00:00", "hash": "6ea0b6ea1047cd31", "title_fa": "Disney+ و Hulu تا پایان سال کاملاً متحد می شوند", "summary_fa": "Hulu در حال ادغام با دیزنی پلاس تحت مدیریت جاش دی آمارو است. Jeremy Moeller/GC Images; Aurore Marechal/Getty Images ویژگی های Hulu تا پایان سال به طور کامل در Disney+ ادغام خواهند شد. این پروژه که در داخل با نام Project Gemini شناخته می شود، سال هاست که در حال انجام است. تجربه پخش یکپارچه بخشی از برنامه مدیرعامل جاش دامارو برای ساخت یک برنامه فوق العاده است. ازدواج Hulu-Disney+ دقیقاً طبق برنامه انجام می شود. این شرکت روز سه شنبه به سرمایه گذاران گفت که طرح دیزنی برای یکپارچه سازی کامل استریمرهای خود \"تقریباً کامل است\" و در ماه دسامبر نهایی خواهد شد. این می تواند آغاز پایان یک برنامه مستقل Hulu باشد، اگرچه دیزنی نگفته است که برنامه فعلی Hulu چه زمانی متوقف می شود یا چه اتفاقی برای برند محبوب Hulu خواهد افتاد. به گزارش بیزینس اینسایدر در ماه می، این ابتکار که در داخل به عنوان \"پروژه جمینی\" شناخته می شود، قرار بود تا پایان سال 2026 به پایان برسد. در هفته‌های آتی، اپلیکیشن دیزنی پلاس آخرین ویژگی‌های ویژه Hulu خود را دریافت می‌کند، از جمله امکان تماشای تلویزیون زنده و پخش‌کننده‌های الحاقی برای کاربران دارای اشتراک واجد شرایط. دیزنی سال‌ها برای ادغام محتوا و ویژگی‌های Hulu در استریمر همنام خود در تلاش برای افزایش تعامل و کاهش لغو صرف شده است. دیزنی در نامه سهامداران خود هنگام تقسیم درآمد گفت: ادغام پخش‌کننده‌ها می‌تواند \"روشی بی‌نظیرتر برای کشف و تعامل با وسعت محتوا در برندها و امتیازات ما ایجاد کند.\" تصمیم به انتقال کامل Hulu به دیزنی + ممکن است برنامه مستقل Hulu را منسوخ کند. یک سند داخلی که توسط Business Insider در ماه مه به دست آمد، گفت که «پشته فناوری Hulu و برنامه پس از انتقال همه کاربران به دیزنی پلاس از کار می‌افتد، اگرچه دقیقاً مشخص نکرد که چه زمانی این اتفاق", "image_url": "https://i.insider.com/6a90815279f11f0a89f91bb3?width eader بسیاری از ویژگی‌های مشابه را دارد، از جمله 128 گیگابایت فضای ذخیره‌سازی، سازگاری با Google Play و داده‌های تلفن همراه هنگام قرار دادن سیم‌کارت (اگرچه دستگاه Viwoods Boox one را بهتر انجام می‌دهد: همچنین یک تلفن مخفی است.) همچنین دارای ادغام‌های هوش مصنوعی زیادی است، اگر دوست دارید. (اگر فقط می خواهید از آن برای خواندن کتاب های آمازون، بارنز نوبل و هر منبع دیگری که دوست دارید استفاده کنید، می توانید آن را نادیده بگیرید.) این در حال حاضر مقرون به صرفه ترین گزینه شما برای یک کتابخوان الکترونیکی با ضریب فرم گوشی است. اگر یکی از تصمیم‌های سال نو شما این است که زمان زیادی را در رسانه‌های اجتماعی سپری نکنید، یک", "image_url": "https://lifehacker.com/imagery/articles/01M7NDD1KMD3CVRJJWBNDSDCTE/hero-image.fill.size_1200x675.png", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Apple", "امنیت سایبری"], "datetime_fa": "۲۶ آبان • ۲۲:۵۷"}],
      media: [{"source": "Billboard", "title": "Dolly Parton Wrote a Touching Tribute to Her Mother in New Book About Forgotten Albums: Shop It Here", "link": "https://www.billboard.com/culture/product-recommendations/on-the-records-book-dolly-parton-billie-eilish-shop-pricing-1236384144/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Many people know my mama, Avie Lee Owen Parton, from my song Coat of Many Colors , but my mama gave me a gift that was far more valuable than a colorful coat. She gave me the gift of music. That’s how Dolly Parton begins her passage about her mother’s musical legacy in On the Records: 80 Musicians on Beloved and Overlooked Albums . Written before her Aug. 25 death , the country music legend recalled inviting her mother to Fireside Recording Studio in Nashville in 1973 to record some of the Appalachian Mountains songs she cherished. Parton explained that the album was never released at the time, but the tapes were eventually published posthumously in 2024 as Mama Sings (Smoky Mountain DNA Series) , 21 years after her mother’s death. Published Tuesday (Nov. 17), the new music book brings together 80 celebrated musicians including Billie Eilish, Chris Stapleton and Laufey sharing overlooked albums, hidden gems and personal favorites they believe deserve greater recognition. HARDCOVER BOOK On the Records: 80 Musicians on Beloved and Overlooked Albums No. 1 Bestseller $27.96 $30 7% off Buy Now at bookshop.org $29.99 Buy Now at amazon $29.99 Buy Now at target $30 Buy Now at Barnes Noble A quintessential coffee-table book, the $30 hardcover features full-color photography and artwork for each overlooked album, and is already a No. 1 bestseller on Amazon. Alongside Dolly Parton, contributors include Erykah Badu on Prince, Billie Eilish on The Dø, Finneas on Feist, Brian Eno on The Consolers, Chris Stapleton on Tim O Brien and Darrell Scott, Sonny Rollins on Fats Waller, Laufey on Chet Baker, Angélique Kidjo on Bella Bellow and Justin Vernon of Bon Iver on Paul Pena. Written by Brian Beck with Piotr Orlov, the collection offers music fans a chance to discover underrated recordings through the artists who adore them. Sophie Dunne/Billboard The Full List of Contributors Featured in On the Records: 80 Musicians on Beloved and Overlooked Albums Adrian Sherwood Adrianne Lenker (Big Thief) Alynda Segarra (Hurray for the Riff Raff) Angélique Kidjo Anoushka Shankar Anthony Davis Arooj Aftab Béla Fleck Benjamin Gibbard (Death Cab for Cutie, The Postal Service) Bettye LaVette Billie Eilish Brendan Yates (Turnstile) Brian Eno Brittany Howard (A", "date_str": "2026-11-17T19:57:32+00:00", "hash": "12ec3de01e43eb52", "title_fa": "دالی پارتون در کتاب جدیدی درباره آلبوم های فراموش شده ادای احترامی برای مادرش نوشت: از اینجا خرید کنید", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. بسیاری از مردم مادرم، آوی لی اوون پارتون را از آهنگ من به نام Coat of Many Colors می شناسند، اما مادرم به من هدیه ای داد که بسیار ارزشمندتر از یک کت رنگارنگ بود. او به من موسیقی هدیه داد. اینگونه است که دالی پارتون نقل قول خود را در مورد میراث موسیقایی مادرش در On the Records: 80 Musicians on Beloved and Looked Albums آغاز می کند. این اسطوره موسیقی کانتری که قبل از مرگش در 25 اوت نوشته شده بود، به یاد می آورد که در سال 1973 مادرش را به استودیوی ضبط Fireside در نشویل دعوت کرد تا برخی از آهنگ های کوه های آپالاچی را ضبط کند. پارتون توضیح داد که این آلبوم در آن زمان هرگز منتشر نشد، اما نوارها در نهایت پس از مرگ در سال 2024 با عنوان Mama Sings (سریال DNA کوه دودی)، 21 سال پس از مرگ مادرش منتشر شد. این کتاب موسیقی جدید که روز سه‌شنبه (17 نوامبر) منتشر شد، 80 موسیقی‌دان مشهور از جمله بیلی آیلیش، کریس استپلتون و لافی را گرد هم می‌آورد که آلبوم‌های نادیده گرفته شده، جواهرات پنهان و موارد دلخواه شخصی را به اشتراک می‌گذارند که معتقدند سزاوار شناسایی بیشتر هستند. کتاب جلد گالینگور در رکوردها: 80 نوازنده در آلبوم‌های محبوب و نادیده گرفته شده شماره 1 پرفروش 27.96 دلار 30 دلار 7 درصد تخفیف خرید در bookshop.org 29.99 دلار اکنون در آمازون 29.99 دلار بخرید اکنون با هدف 30 دلار بخرید اکنون در بارنز نوبل خرید کنید. آثار هنری برای هر آلبوم نادیده گرفته شده، و در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Buy-On-the-Record-book-online-Dolly-Parton-Billie-Eilish-Finneas.png?w=720", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۳:۲۷"}, {"source": "Billboard", "title": "Lil Baby’s ‘FRESH’ Starts at No. 1 on Top R&B/Hip-Hop Albums Chart", "link": "https://www.billboard.com/music/chart-beat/lil-baby-fresh-number-1-top-rb-hip-hop-rap-albums-chart-1236384155/", "summary": "Lil Baby claims his fifth No. 1 on Billboard ’s Top R B/Hip-Hop Albums chart as FRESH launches atop the list dated Nov. 21. The set, released on Quality Control/Motown/Interscope Capitol, begins with 59,000 equivalent album units earned in the United States for the tracking week of Nov. 6-12, according to Luminate. Related Lil Baby Reunites With Chris Brown for Trap B-Leaning From the Back (Remix) : Listen Lil Baby s FRESH : All 17 Tracks Ranked Lil Baby Is Open to Stepping Out of the Box to Collab With Sabrina Carpenter: I Could Make It Work Plus, the set’s de facto title track, “Dead Fresh,” rises to No. 1 on the Hot Rap Songs chart for the first time, capping a 17-week journey to the penthouse. For FRESH , streaming activity powered nearly all the debut sum, with 55,000 units, representing 56.8 million official on-demand streams of the album’s songs. (Thanks to that figure, it opens at No. 1 on the Top Streaming Albums chart.) Four thousand units derived from traditional album sales, with a negligible number of activity from the final metric, track-equivalent albums. (One unit equals the following levels of consumption: one album sale, 10 individual tracks sold from an album, or 1,000 paid/subscription tier or 2,500 ad-supported tier official on-demand audio and video streams for a song on the album.) With FRESH , Lil Baby scores his fifth leader on Top R B/Hip-Hop Albums. He first reigned via 2020’s My Turn , which posted six weeks in the summit and was later named the chart’s top album of the first 25 years of the century, and followed with the one-week champ The Voice of the Heroes , a 2021 collaboration with Lil Durk, three weeks with 2022’s It’s Only Me and one week with 2025’s WHAM . Elsewhere, FRESH becomes the Atlanta rapper’s sixth No. 1 on Top Rap Albums — all five of the Top R B/Hip-Hop Albums No. 1s, plus 2025’s The Leaks — and arrives at No. 2 on the all-genre Billboard 200 . The triumph continues with the album’s single “Dead Fresh,” which ascends to No. 1 on Hot Rap Songs. The track marks Lil Baby’s fourth chart-topper, following three in 2022 that each ruled for one week: “Do We Have a Problem,” with Nicki Minaj, via his and Drake’s features on DJ Khaled’s “Stayin Alive” and his own “California Breeze.” “Dead Fresh” seemed nearly destined to come tantalizingly close to the summit, tracing to its No. 2 debut on the chart dated Aug. 1, and holding the rank for 14 non-consecutive weeks, all behind Drake’s “Janice STFU.” By toppling its main", "date_str": "2026-11-17T19:47:19+00:00", "hash": "bb5ab6c939c9edcd", "title_fa": "آلبوم «FRESH» از Lil Baby در رتبه اول جدول آلبوم‌های R&B/Hip-Hop برتر قرار دارد.", "summary_fa": "لیل بیبی پنجمین شماره 1 خود را در جدول آلبوم های برتر R B/Hip-Hop بیلبورد به دست می آورد، زیرا FRESH در صدر فهرست تاریخ 21 نوامبر عرضه می شود. این مجموعه که در Quality Control/Motown/Interscope Capitol منتشر شد، با 59000 واحد آلبوم معادل 6-2 دقیقه در ایالات متحده شروع می شود. Lil Baby مرتبط با کریس براون برای Trap B-Leaning From the Back (ریمیکس) : Lil Baby s Fresh گوش کنید: همه 17 آهنگ رتبه‌بندی شده لیل بیبی آماده است تا از جعبه خارج شود و با سابرینا کارپنتر همکاری کند: من می‌توانم آن را به کار ببرم، \"مجموعه این آهنگ، در واقع به‌عنوان یکی از آهنگ‌ها، کاملاً جدید است.\" نمودار آهنگ های رپ برای اولین بار، یک سفر 17 هفته ای به پنت هاوس را پوشش می دهد. برای FRESH، فعالیت استریم تقریباً تمام مجموع اولیه را با 55000 واحد، که نشان دهنده 56.8 میلیون استریم رسمی درخواستی از آهنگ‌های آلبوم است، تامین کرد. (به لطف این رقم، در جدول بهترین آلبوم های جریانی در رتبه اول قرار می گیرد.) چهار هزار واحد حاصل از فروش آلبوم های سنتی، با تعداد ناچیزی از فعالیت های متریک نهایی، آلبوم های معادل آهنگ. (یک واحد برابر است با سطوح مصرف زیر: فروش یک آلبوم، 10 قطعه منفرد فروخته شده از یک آلبوم، یا 1000 ردیف پولی/اشتراک یا 2500 پخش صوتی و تصویری رسمی طبق تقاضای تبلیغاتی برای یک آهنگ در آلبوم.) با FRESH، لیل بیبی پنجمین رهبر خود را در Top Rop RB/H به دست آورد. او ابتدا از طریق نوبت من در سال 2020 سلطنت کرد، آلبومی که شش هفته در اجلاس سران منتشر شد و بعداً به عنوان برترین آلبوم جدول در 25 سال اول قرن انتخاب شد، و سپس با قهرمان یک هفته‌ای The Voice of the Heroes، همکاری 2021 با لیل دورک، سه هفته با آلبوم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/lil-baby-2026-press-photo-kendall-bessent-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۳:۱۷"}, {"source": "Billboard", "title": "RM of BTS Made This Change to His Hair — Now He’s Trending on Social Media", "link": "https://www.billboard.com/music/music-news/bts-rm-changes-hair-trending-x-1236384178/", "summary": "RM of BTS just made the subtlest change to his hair, and ARMY thinks it s absolutely dynamite. Related BTS Plans to Add More ARIRANG Tour Dates Work on New Music Solo Projects in 2027 BTS ‘Swim’ Copyright Lawsuit Dropped by Accusers Just Months After They Sued Over Hit Song Inside the Business of Boy Bands — From One Direction to BTS The boy band s leader shared a carousel of photos on Instagram on Tuesday (Nov. 17), showing off his new look. Keeping the same dark auburn-ish color he had before, RM added fluffy waves to his tresses, possibly through a perm. Hello, he simply wrote in the caption of the post, which included snaps of him on an autumnal walk outdoors and a picture of him wearing his glasses while smiling alongside Korean artist Kim Yun Shin. The performer kept his comments turned off to the public, but over on X, ARMY immediately started freaking out over his distinguished new look. EVERYONE PACK IT UP NAMJOON PERMED HIS HAIR, one fan wrote excitedly, while another person gushed , NAMJOON S HAIR, I M NOT OKAY. Namjoon looks so cute with his fluffy hair, a third fan posted . MY HONEST REACTION WITH NAMJOON S NEW HAIRSTYLE, another person joked alongside a clip of V pretending to give Jin CPR chest compressions. The volume of reactions to his post made it so his real name, Namjoon, was trending on X in the first few hours after he shared it. RM s mild makeover came while on break from BTS ARIRANG World Tour supporting three-week Billboard 200 -topping album ARIRANG . After playing stadiums across the globe since April, the Bangtan Boys paused after their late-October concerts in Brazil. Now, RM, his new hairdo and bandmates Suga, Jin, Jimin, Jung Kook, j-hope and V are gearing up to head back out, with dates scheduled for Nov. 19, 21 and 22 at Kaohsiung National Stadium in Taiwan. BTS will stay on the road through late December before taking another break, after which the band will resume in 2027 with a series of shows in Indonesia, Australia, Hong Kong and the Philippines. And as recently revealed by HYBE the guys have even more tour dates in the works to extend the trek through the first half of next year.", "date_str": "2026-11-17T19:41:35+00:00", "hash": "50e327dc54b047d0", "title_fa": "RM از BTS این تغییر را در موهایش ایجاد کرد - اکنون او در رسانه های اجتماعی پرطرفدار است", "summary_fa": "RM از BTS فقط ظریف ترین تغییر را در موهای خود ایجاد کرد و ARMY فکر می کند که کاملاً دینامیت است. BTS مرتبط قصد دارد تاریخ‌های تور ARIRANG را اضافه کند. کار بر روی پروژه‌های جدید موسیقی انفرادی در سال ۲۰۲۷ BTS 'Swim' شکایت حق نسخه‌برداری BTS توسط متهمان تنها چند ماه پس از شکایت آنها به دلیل هیت آهنگ در کسب و کار گروه‌های پسر - از One Direction به BTS. رهبر گروه پسر یک چرخ و فلک جدید از عکس‌های خود را در اینستاگرام به اشتراک گذاشت. با حفظ همان رنگ مایل به قهوه ای تیره ای که قبلا داشت، RM امواج کرکی را به رگ های خود اضافه کرد، احتمالاً از طریق پرم. سلام، او به سادگی در توضیح پست نوشت، که شامل عکس هایی از او در حال پیاده روی پاییزی در فضای باز و تصویری از او در حالی که عینک خود را به چشم می زند در حالی که در کنار هنرمند کره ای کیم یون شین لبخند می زند، نوشته است. مجری نظرات خود را برای عموم خاموش نگه داشت، اما در X، ARMY بلافاصله از ظاهر متمایز جدید خود عصبانی شد. یکی از طرفداران با هیجان نوشت، در حالی که یک نفر دیگر فوران کرد، نامجون موهایش، من خوب نیستم. یکی از طرفداران سوم پست کرد نامجون با موهای کرکی اش خیلی بامزه به نظر می رسد. واکنش صادقانه من با مدل موی جدید نامجون، شخص دیگری در کنار یک کلیپ از V شوخی کرد و وانمود کرد که به جین CPR سینه می‌زند. حجم واکنش‌ها به پست او باعث شد که نام واقعی او، نامجون، در اولین ساعات پس از اشتراک‌گذاری آن، در X ترند شود. تغییر ملایم RM در زمان استراحت از تور جهانی BTS ARIRANG با پشتیبانی از آلبوم سه هفته ای بیلبورد 200 ARIRANG به وجود آمد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P106J5HQ-e1794938895345.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۳:۱۱"}, {"source": "Billboard", "title": "Ella Langley Breaks Out of a Tie With Carrie Underwood for This Record on Country Airplay Chart", "link": "https://www.billboard.com/music/chart-beat/ella-langley-breaks-tie-carrie-underwood-country-airplay-record-1236384109/", "summary": "Ella Langley ’s “Loving Life Again” claims a third week at No. 1 on Billboard ’s Country Airplay chart, leading the list dated Nov. 21 with 33.8 million audience impressions Nov. 6-12, according to Luminate. Related Ella Langley’s ‘Choosin’ Texas’ Holds for Record-Extending 28th Week Atop Hot 100 Here s How Ella Langley Reacted to Her Seven Grammy Nominations Led By Ella Langley, Women Artists Shine in Grammys Country Categories The latest frame ups Langley’s 2026 total to 12 weeks atop Country Airplay across four songs — “Choosin’ Texas,” “Be Her” and the Morgan Wallen duet “I Can t Love You Anymore” previously led — breaking her out of a tie with Carrie Underwood (2006) for the most by a woman in a single year. Wallen holds the record with 17 weeks on top in 2023. He also logged 16 in 2025 and 13 in 2022, and Luke Combs had 13 in 2019 and 2021, while Kenny Chesney totaled 12 in 2007. In 2026, Langley’s time atop Country Airplay outpaces runner-up Combs’ nine weeks and Wallen’s seven. Combs has led with “Sleepless in a Hotel Room” and “Be by You,” and Wallen with “20 Cigarettes,” “Don’t We,” his Langley collaboration and “Been by Now.” Meanwhile, “Choosin’ Texas” has spent 49 weeks and counting atop Hot Country Songs, two shy of the all-time mark held by Bebe Rexha and Florida Georgia Line’s “Meant to Be” (2017-18). New Top 10s Lainey Wilson pockets her 10th Country Airplay top 10 and John Mayer his first as “Phone Keys Wallet” rises two spots to No. 9 (16.4 million, up 4%). Plus, Russell Dickerson reaches the top 10 (12-10; 15.6 million, up 9%) for the seventh time, with “Worth Your Wild.” Big Debuts Thomas Rhett scores his second-highest Country Airplay debut as “Be There in a Minute” opens at No. 19 (9.3 million). Only “What’s Your Country Song” (No. 18 in 2020), one of his 21 No. 1s, started higher. Meanwhile, U2 makes its Country Airplay debut as “Torn,” featuring Dolly Parton , launches at No. 28 (4.8 million), marking the late Parton’s highest ever entrance on the chart. With “Son of Jolene,” alongside Belles, likewise on the list at No. 56 (1.1 million), two Parton songs place simultaneously for the first time since 2006; “Torn” is also her first top 40 entry on the chart since then.", "date_str": "2026-11-17T19:36:32+00:00", "hash": "531a0ff3e0ba7900", "title_fa": "الا لنگلی با کری آندروود برای این رکورد در چارت پخش کانتری از تساوی خارج شد", "summary_fa": "بر اساس گزارش Luminate، «دوباره عشق به زندگی» اثر الا لنگلی در رتبه اول جدول کانتری بیلبورد قرار گرفت و در تاریخ 21 نوامبر با 33.8 میلیون تماشاگر از 6 تا 12 نوامبر در صدر قرار گرفت. آلبوم مرتبط «Choosin» تگزاس از الا لنگلی برای رکورد طولانی هفته بیست و هشتم در بالای ۱۰۰ هفته رکورددار است. در اینجا نحوه واکنش الا لنگلی به هفت نامزدی جایزه گرمی او به رهبری الا لنگلی، درخشش هنرمندان زن در دسته‌های کشور گرمی آخرین فریم‌ها در مجموع ۲۲ هفته از ایر تاپ کانتری پخش می‌شود. «Choosin’ Texas»، «Be Her» و دوئت مورگان والن «I Can t Love You Anymore» پیش از این رهبری کرده بودند - او را با کری آندروود (2006) بیش از همه توسط یک زن در یک سال شکسته بود. والن با 17 هفته در صدر در سال 2023 رکورددار است. او همچنین 16 در سال 2025 و 13 در سال 2022 ثبت کرد و لوک کامبز 13 در سال 2019 و 2021 ثبت کرد، در حالی که کنی چسنی در سال 2007 مجموعاً 12 هفته ثبت کرد. والن هفت. کامبز با «بی خواب در اتاق هتل» و «کنار تو باش» و والن با «20 سیگار»، «نکن»، همکاری لنگلی و «تا کنون بوده‌ام» پیشتاز بوده است. در همین حال، \"Choosin' Texas\" 49 هفته را سپری کرده و در صدر آهنگ های Hot Country قرار گرفته است، دو آهنگ کمتر از رکوردی که Bebe Rexha و \"Meant to Be\" از فلوریدا جورجیا لاین (2017-2018) دارند. Lainey Wilson دهمین 10 برتر ایرپلی کانتری خود را به جیب می زند و جان مایر اولین بار به عنوان \"کیف پول کلیدهای تلفن\" با دو پله به رتبه 9 (16.4 میلیون، افزایش 4 درصدی) رسید. به علاوه، راسل دیکرسون برای هفتمین بار با «ارزش شما وحشی» به 10 نفر برتر (12-10؛ 15.6 میلیون، افزایش 9", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Ella-Langley-Getty-Images-CMAs-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۳:۰۶"}, {"source": "Billboard", "title": "Suno Moves Into AI Filmmaking With New Product ‘     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
