  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root[data-theme="dark"] {

      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;

      --read-bg: #f1f5f9;

      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;

    body {

      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {

      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;

      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;

    .meta-bar {

      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }

      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

 نفر کشته و بیش از ۱۲۰ نفر زخمی شوند. آن حادثه مرگبارترین سانحه ریلی اسپانیا از سال ۲۰۱۳ نام گرفته بود. مقام‌های اسپانیا در نخستین واکنش به سانحه جدید گفتند در حال تحقیق و بررسی درباره دلیل وقوع آن هستند. وزیر حمل‌و‌نقل اسپانیا در نخستین برآوردها از دلیل وقوع این تصادف بعدازظهر چهارشنبه به خبرنگاران گفت تصادف پس از آن رخ داد که به یک قطار سریع‌السیر با وجود فعال بودن چراغ قرمز ناشی از توقف قطاری دیگر در ریل، اجازه ادامه سفر داده شد. او این موضوع را «نقض پروتکل» عنوان کرد. اسکار پوئنته، گفت چراغ قرمز توقف به دلیل شناسایی اختلال در ارتباطات رایانه‌ای صادر شده بود اما تصمیم اشتباهی برای شروع مجدد قطار گرفته شده بود. او از پاسخ به این سوال که به دلیل وقوع این حادثه از سمتش", "image_url": "https://gdb.rferl.org/8de81e21-0ae5-434a-bc45-9fc65f600b83_w1200_h630.jpg", "category": "سینما و سریال", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آبان • ۱۸:۵۵"}, {"source": "IranWire", "title": "یوسف حسنیان، معترض اهل شوش، تحت شکنجه ماموران سپاه قرار دارد", "link": "https://iranwire.com/fa/news-1/159494-%DB%8C%D9%88%D8%B3%D9%81-%D8%AD%D8%B3%D9%86%DB%8C%D8%A7%D9%86-%D9%85%D8%B9%D8%AA%D8%B1%D8%B6-%D8%A7%D9%87%D9%84-%D8%B4%D9%88%D8%B4-%D8%AA%D8%AD%D8%AA-%D8%B4%DA%A9%D9%86%D8%AC%D9%87-%D9%85%D8%A7%D9%85%D9%88%D8%B1%D8%A7%D9%86-%D8%B3%D9%BE%D8%A7%D9%87-%D9%82%D8%B1%D8%A7%D8%B1-%D8%AF%D8%A7%D8%B1%D8%AF/", "summary": "سازمان حقوق بشر کارون از انتقال یوسف حسنیان (ناصری)، معترض ۲۸ ساله اهل شوش و از بازداشت‌شدگان پرونده امنیتی «قلعه چنعان»، به زندان شیبان ...", "date_str": "2026-10-28T15:30:54+00:00", "hash": "3e43f1ac415a7087", "title_fa": "یوسف حسنیان، معترض اهل شوش، تحت شکنجه ماموران سپاه قرار دارد", "summary_fa": "سازمان حقوق بشر کارون از انتقال یوسف حسنیان (ناصری)، معترض ۲۸ ساله اهل شوش و از بازداشت‌شدگان پرونده امنیتی «قلعه چنعان»، به زندان شیبان ... به گزارش سازمان حقوق بشر کارون، منابع مطلع گفته‌اند که حسنیان در دوران نگهداری در سلول انفرادی برای پذیرش و ضبط اعترافات اجباری ویدیویی تحت فشارهای شدید جسمی و روانی قرار گرفته است. بر اساس این گزارش، بازجویان اطلاعات سپاه او را تهدید کرده‌اند که در صورت خودداری از بیان اعترافات دیکته‌شده مقابل دوربین، در دادگاه به «دو بار اعدام» محکوم خواهد شد. این سازمان حقوق بشری می‌گوید وخامت شدید وضعیت جسمانی حسنیان در پی شکنجه‌ها، به انتقال او به زندان شیبان اهواز منجر شده است. حسنیان یکی از ۱۲ بازداشتی پرونده موسوم به «قلعه چنعان» است که به گفته سازمان حقوق بشر کارون، پس از یورش نیروهای اطلاعاتی در اسفند ۱۴۰۴ تشکیل شد. در روزهای اخیر، اتهاماتی از جمله «محاربه» و «بغی» به کیفرخواست متهمان این پرونده افزوده شده است؛ اتهاماتی که می‌توانند خطر صدور احکام اعدام را برای آنان افزایش دهند. به گزارش این سازمان، حسنیان از زمان بازداشت از حق دسترسی به وکیل انتخابی و مستقل محروم بوده است. سازمان حقوق بشر کارون با ابراز نگرانی درباره سلامت و امنیت جانی این زندانی، خواستار مداخله فوری نهادهای بین‌المللی و مدافع حقوق بشر برای تضمین دسترسی او به خدمات پزشکی و جلوگیری از صدور احکام اعدام بر پایه اعترافات اخذ شده زیر شکنجه شده است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Gemini_Generated_Image_tfaj45tfaj45tfaj_ixUv__v1024x512__box_0%2C666%2C1856%2C1643.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۶ آبان • ۱۹:۰۰"}, {"source": "Euronews Persian", "title": "اسپانیا: نیروهای امدادی در حال جست‌وجوی بقایای قطار در نزدیکی تولدو", "link": "https://parsi.euronews.com/video/2026/10/28/spain-rescuers-search-mangled-train-wreckage-near-toledo", "summary": "روز چهارشنبه ۲۸ اکتبر، در پی برخورد دو قطار تندرو نزدیک اوردا در استان تولدو، دست‌کم ۶۸ نفر کشته و ده‌ها نفر زخمی شدند و مقام‌ها هشدار داده‌اند احتمال افزایش تلفات وجود دارد.", "date_str": "2026-10-28T15:55:10+00:00", "hash": "e1cfa42f4ae60370", "title_fa": "اسپانیا: نیروهای امدادی در حال جست‌وجوی بقایای قطار در نزدیکی تولدو", "summary_fa": "روز چهارشنبه ۲۸ اکتبر، در پی برخورد دو قطار تندرو نزدیک اوردا در استان تولدو، دست‌کم ۶۸ نفر کشته و ده‌ها گزارش خود را منتشر کرد که بازه زمانی بهمن ۱۴۰۴ تا مرداد ۱۴۰۵ را در بر می‌گیرد. در این گزارش آمده است که در این مدت «مخاصمه مسلحانه بین‌المللی میان ایالت متحده آمریکا و اسرائیل از یک سو و جمهوری اسلامی ایران از سوی دیگر مردمی را تحت تأثیر قرار داد که همچنان با پیامدهای سرکوب پس از دی ۱۴۰۴ دست و پنجه نرم می‌کردند. هریک از این دو، آسیب ناشی از دیگری را تشدید کرد و پیامدهای هرکدام از آنها همچنان در زندگی مردم انباشته می‌شود.» این گزارش پس از اشاره به آسیب حکومت و حمله خارجی برای مردم ایران، به موضوع کشته‌شدگان و اعدام‌شدگان، بازداشت‌شدگان و ناپدیدشدگان، نقض دادرسی عادلانه، وخیم‌تر شدن فضای مدنی و معیشت مردم و وضعیت محیط زیست و همچنین شرایط زندان‌های ایران در این هشت ماه پرداخته است. رویدادهای دی ماه ۱۴۰۴ و رخدادهای جنگ هم در گزارش مای ساتو بررسی شده‌اند. با این حال خانم ساتو تاکید کرد که «آنچه در این گزارش آمده است، تنها بخش کوچکی از اتفاقاتی است که افتاده است. قطع ارتباطات مخابراتی هیچ راه ایمن برای ارسال اطلاعات به خارج ازکشور باقی نگذاشت. برخی از افرادی که در ابتدا برای ارائه اطلاعات پیشقدم شده بودند، با سنجیدن دوباره پیامدهای این اقدام برای خود و ًخانواده‌شان، رضایت خود را پس گرفتند.» از این رو، «هیچ بخش این گزارش نباید به عنوان تصویر کامل از آنچه بر مردم در ایران رفته است تلقی شود.» خانم ساتو نوشت: «در بازه این گزارش، هزاران نفر در ایران، هم در اثر حملات ایالت متحده آمریکا", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/0439/live/1b71ede0-d2de-11f1-b677-b762d2f83f6e.jpg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آبان • ۱۸:۱۵"}, {"source": "BBC Persian", "title": "دست‌کم ۶۸ نفر بر اثر برخورد دو قطار در اسپانیا کشته شده‌اند", "link": "https://www.bbc.com/persian/articles/cm70pdw540nwo?at_medium=RSS&at_campaign=rss", "summary": "مقام‌های اسپانیا می‌گویند در پی برخورد دو قطار در جنوب مادرید، پایتخت این کشور، دست‌کم ۶۸ نفر کشته و تعداد زیادی زخمی شده‌اند.", "date_str": "2026-10-28T13:30:36+00:00", "hash": "b6dc4130f8a3527a", "title_fa": "دست‌کم ۶۸ نفر بر اثر برخورد دو قطار در اسپانیا کشته شده‌اند", "summary_fa": "مقام‌های اسپانیا می‌گویند در پی برخورد دو قطار در جنوب مادرید، پایتخت این کشور، دست‌کم ۶۸ نفر کشته و تعداد زیادی زخمی شده‌اند. در این حادثه یک قطار که مادرید را به مقصد سویل ترک کرده بود، با قطاری برخورد کرد که ظاهرا متوقف بوده است. دست‌کم دو واگن از شیب کنار خط آهن از خط خارج و به پایین سقوط کرده‌‌اند. در ماه ژانویه، برخورد قطار در همین مسیر به کشته شدن ۴۶ نفر منجر شد و بحث‌هایی را درباره ایمنی راه‌آهن در اسپانیا برانگیخت. بر اساس گزارش‌ها، دولت اسپانیا معتقد است خطای انسانی مرتبط با سیستم علائم راه‌آهن، یکی از دلایل احتمالی حادثه امروز است. پدرو سانچز، نخست‌وزیر اسپانیا، از این حادثه ابراز ناراحتی کرده است. شهردار یکی از مناطق محلی نیز گفت نیروهای امدادی از او خواسته‌اند یک سالن ورزشی را برای اسکان مجروحان آماده کند. مقامات محلی می‌گویند که بیش از ۵۰۰ مسافر در قطارها بوده‌اند. شرکت مدیریت زیرساخت‌های ریلی اسپانیا، آدیف، اعلام کرده است که این حادثه بین قطاری متعلق به شرکت رنفه و قطاری متعلق به شرکت ایریو رخ داده است. شرکت ایریو در مسیر مادرید به سویل خدمات ارائه می‌کند. یک نوجوان ۱۷ ساله که مسافر یکی از قطارها بود، به یک شبکه تلویزیونی اسپانیا گفت: «فاجعه بود» و افزود که در محل حادثه «هرج‌ومرج» حاکم شده بود. امیلیانو گارسیا پیج، رئیس منطقه کاستیا-لامانچا، به شبکه رادیویی اسپانیایی اس‌ای‌آر گفت بیشتر کشته‌شدگان در قطار سریع‌السیر بوده‌اند و شمار کشته‌شدگان در قطار شرکت ایریو «کمتر» است. او افزود: «بدیهی است که انتظار داریم اجساد بیشتری پیدا شود، چون هنوز نتوانسته‌ایم به بخش‌های داخلی‌تر واگن‌ها دسترسی پیدا کنیم.» تصاویر منتشرشده از محل حادثه همچنین چندین نفر را در حال دریافت کمک‌های درمانی نشان می‌دهد. رسانه‌های اسپانیا گزارش داده‌اند که شمار زیادی از مجروحان به بیمارستان‌های محلی منتقل شده‌اند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/44c9/live/0b9fd250-d2d0-11f1-b677-b762d2f83f6e.png", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آبان • ۱۷:۰۰"}, {"source": "Iran International", "title": "نتانیاهو پیشتاز اما بدون اکثریت، مخالفان در برابر انتخاب دشوار همکاری با احزاب عرب", "link": "https://www.iranintl.c 26-10-28T14:45:03+00:00", "hash": "bd716ae631fc6ebc", "title_fa": "مای ساتو: جنگ نه‌ فقط از سرکوب مردم ایران نکاست بلکه آن را تشدید کرد", "summary_fa": "مای ساتو گزارشگر ویژه سازمان ملل در امور حقوق بشر در جمهوری اسلامی ایران آخرین گزارش خود را منتشر کرد که بازه زمانی بهمن ۱۴۰۴ تا مرداد ۱۴۰۵ را در بر می گیرد. مای ساتو، گزارشگر ویژه سازمان ملل در امور حقوق بشر در جمهوری اسلامی ایران، تازه‎‌ترین گزارش خود را منتشر کرد که بازه زمانی بهمن ۱۴۰۴ تا مرداد ۱۴۰۵ را در بر می‌گیرد. در این گزارش آمده است که در این مدت «مخاصمه مسلحانه بین‌المللی میان ایالت متحده آمریکا و اسرائیل از یک سو و جمهوری اسلامی ایران از سوی دیگر مردمی را تحت تأثیر قرار داد که همچنان با پیامدهای سرکوب پس از دی ۱۴۰۴ دست و پنجه نرم می‌کردند. هریک از این دو، آسیب ناشی از دیگری را تشدید کرد و پیامدهای هرکدام از آنها همچنان در زندگی مردم انباشته می‌شود.» این گزارش پس از اشاره به آسیب حکومت و حمله خارجی برای مردم ایران، به موضوع کشته‌شدگان و اعدام‌شدگان، بازداشت‌شدگان و ناپدیدشدگان، نقض دادرسی عادلانه، وخیم‌تر شدن فضای مدنی و معیشت مردم و وضعیت محیط زیست و همچنین شرایط زندان‌های ایران در این هشت ماه پرداخته است. رویدادهای دی ماه ۱۴۰۴ و رخدادهای جنگ هم در گزارش مای ساتو بررسی شده‌اند. با این حال خانم ساتو تاکید کرد که «آنچه در این گزارش آمده است، تنها بخش کوچکی از اتفاقاتی است که افتاده است. قطع ارتباطات مخابراتی هیچ راه ایمن برای ارسال اطلاعات به خارج ازکشور باقی نگذاشت. برخی از افرادی که در ابتدا برای ارائه اطلاعات پیشقدم شده بودند، با سنجیدن دوباره پیامدهای این اقدام برای خود و ًخانواده‌شان، رضایت خود را پس گرفتند.» از این رو، «هیچ بخش این گزارش نباید به عنوان تصویر کامل از آنچه بر مردم در ایران رفته است تلقی شود.» خانم ساتو نوشت: «در بازه این گزارش، هزاران نفر در ایران، هم در اثر حملات ایالت متحده آمریکا", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/0439/live/1b71ede0-d2de-11f1-b677-b762d2f83f6e.jpg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آبان • ۱۸:۱۵"}, {"source": "Iran International", "title": "علیه فراموشی؛ علیرضا دبیر چرا از محسنی‌اژه‌ای، ام نخست‌وزیر قوت گرفت", "link": "https://www.radiofarda.com/a/netanyahu-bloc-leads-as-israeli-votes-counted/33886053.html", "summary": ".", "date_str": "2026-10-28T14:28:52+00:00", "hash": "4fa18573c26bc4a6", "title_fa": "نتایج انتخابات اسرائیل؛ احتمال باقی ماندن نتانیاهو در مقام نخست‌وزیر قوت گرفت", "summary_fa": "با شمارش بخش عمده آرای انتخابات پارلمانی اسرائیل، ائتلاف بنیامین نتانیاهو، نخست‌وزیر، بیشترین کرسی را به دست آورد و هرچند به اکثریت ۶۱ کرسی نرسید، اما نتایج نشان می‌دهد که نتانیاهو دست‌کم در مقام نخست‌وزیر موقت در قدرت باقی خواهد ماند. بر اساس گزارش سه شبکه اصلی تلویزیونی اسرائیل، با شمارش نزدیک به ۸۶ درصد آرای مأخوذه تا صبح چهارشنبه ششم آبان، ائتلاف نتانیاهو متشکل از احزاب راست‌گرا، راست افراطی و یهودیان فوق‌ارتدوکس در مسیر کسب ۵۳ کرسی پارلمان قرار دارد؛ رقمی که به‌مراتب بیشتر از ۴۸ کرسی پیش‌بینی‌شده برای ائتلاف مخالفان به رهبری گادی آیزنکوت است. احزاب نماینده شهروندان اسرائیلی با تبار عرب نیز، در پی مشارکت گسترده رأی‌دهندگان با انگیزه بالا، در مجموع ۱۹ کرسی به دست خواهند آورد که رقمی بی‌سابقه برای این احزاب است. با ادامه شمارش آرا، نتایج همچنان ممکن است تغییر کند، اما به نظر می‌رسد شانس آیزنکوت برای پیروزی بسیار ضعیف شده است. ائتلاف او که احزاب مخالف نتانیاهو از چپ میانه تا راست تندرو را در بر می‌گیرد، برخلاف نظرسنجی‌های پیش از انتخابات که از رقابتی نزدیک حکایت داشتند، عملکردی ضعیف‌تر از انتظار داشته است. اگرچه ائتلاف نتانیاهو اکثریت شکننده خود را در کنست، پارلمان ۱۲۰ کرسی اسرائیل، از دست داده است، مخالفان او نیز امید چندانی برای برکناری نخست‌وزیر ندارند؛ مگر آنکه به توافقی بعید برای جلب حمایت گسترده احزاب عرب دست یابند، اقدامی که بسیاری از رهبران یهودی با آن مخالف‌اند. حتی در چنین شرایطی نیز نتانیاهو در جریان مذاکرات برای تشکیل ائتلاف جدید، یا تا زمان برگزاری انتخابات بعدی در سال آینده، در مقام نخست‌وزیر موقت باقی خواهد ماند. این در حالی است که رئیس‌جمهور اسرائیل از احزاب این کشور خواست که با رسیدن به تفاهم، مانع از برگزاری انتخابات بعدی شوند. اسحاق هرتزوگ که مسئولیت تعیین نامزد مأمور تشکیل دولت را بر عهده دارد، گفت: «باید هر کاری", "image_url": "https een, you should not try another word ending in ER as your next guess. If you guess a completely different five-letter word, say BENCH, you can find out whether B, N, C, and H are in the solution, while also getting information about whether there s an E in the second position (which helps you know whether words like LEVER and METER might be in play). There is a toggle in the game interface that requires every word to use green squares from your previous guesses. It s called hard mode. If you ask me, this should be called luck mode, because it takes away one of the game s best strategies for smart solvers, as guessing letters you already know is just wasting guesses. I wrote more about this strategy here , and included more examples. Use this tip, and you ll avoid the trap of losing after guessing FOUND, ROUND, POUND, MOUND, SOUND, and WOUND when you could have used MARSH as your second guess and instantly figured out the answer (HOUND). Choose a starter with common consonants There are competing schools of thought on choosing the best starting word for Wordle, an issue I have considered in depth . But to summarize the best advice: Choose a word with five different letters (no repeats) that includes at least two or three of the English language s most common consonants. Those most common consonants include T, N, S, H, R, D, L, and C. That means TRASH is a great starter, and so are CRANE and STEAL and STARE. For best results, use E and/or A as your vowels, since these are some of the most common vowels in English. Play two starters to give you a one-two punch A starting word needs to give you information about what might be in the solution, but you don t gain a ton of information with just five letters. So I recommend having another starting word that doesn t overlap with the first, but expands the amount of informat", "date_str": "2026-10-28T16:30:05+00:00", "hash": "40cfad9084b317a6", "title_fa": "پنج هک که هر بازیکن Wordle باید بداند", "summary_fa": "بزرگترین جذابی نقرض کند و به سود سهام آسیب بزند!", "link": "https://www.zoomit.ir/ai-articles/470021-anthropic-ipo-risk-factors-featured/", "summary": "آنتروپیک در گزارش رسمی ورود به بورس، از خطرات تکان‌دهنده‌ای مثل خودآگاهی کلاد، باج‌گیری هوش مصنوعی و تأثیر انقراض بشر بر سهامش می‌گوید.", "date_str": "2026-10-28T15:30:00+00:00", "hash": "66c892c6ddb472fb", "title_fa": "گزارش آنتروپیک برای بورس: هوش مصنوعی ما شاید نسل بشر را منقرض کند و به سود سهام آسیب بزند!", "summary_fa": "آنتروپیک در گزارش رسمی ورود به بورس، از خطرات تکان‌دهنده‌ای مثل خودآگاهی کلاد، باج‌گیری هوش مصنوعی و تأثیر انقراض بشر بر سهامش می‌گوید. تبلیغات شرکت‌ها معمولاً وقتی می‌خواهند وارد بورس شوند، نگران رقبای تجاری، نوسان بازار یا بالارفتن هزینه‌ها هستند؛ اما آنتروپیک در آستانه عرضه اولیه سهام خود (IPO)، دغدغه بسیار بزرگ‌تری دارد، اینکه هوش مصنوعی خودش نسل بشر را منقرض کند و این اتفاق ناگوار، روی سود سهام شرکت تأثیر منفی بگذارد. انتشار فرم S-1 آنتروپیک توسط کمیسیون بورس و اوراق بهادار آمریکا در روز دوشنبه، در ابتدا بحث‌های داغی درباره این به راه انداخت که آیا درآمدهای روبه‌رشد این شرکت حریف هزینه‌های به‌مراتب سنگین‌ترش خواهد شد یا خیر. اما خالق کلاد لابه‌لای ارقام مالی و خوش‌بینی‌های جسورانه درباره اینکه هوش مصنوعی «به‌سرعت تمام بخش‌های اقتصاد جهانی را عمیق‌تر از انقلاب صنعتی، برق، نیمه‌هادی‌ها و اینترنت متحول خواهد کرد»، حجم غیرمنتظره‌ای از گزارش رسمی‌اش را به ردیف‌کردن خطرات آخرالزمانی و تجاری عجیبی اختصاص داده که می‌توانند کل شرکت را به زمین بزنند. در طول ۹۳ صفحه و بیش از ۷۰ هزار کلمه، بخش عوامل ریسک گزارش آنتروپیک، به معنای واقعی کلمه صدها مشکل بالقوه را کالبدشکافی می‌کند که می‌توانند در سال‌های آینده کسب‌وکار این شرکت را با بحران روبه‌رو کنند. بسیاری از ریسک فاکتورها، همان دغدغه‌های استاندارد و همیشگی درباره رقابت، هزینه‌ها، جذب مشتری و قوانین احتمالی‌اند که تقریباً هر کسب‌وکاری باید نگرانشان باشد. اما برخی از این ریسک‌ها، نقاط شکست کم‌سابقه‌ای را مشخصاً برای خودِ آنتروپیک و به‌طورکلی برای حباب پرهیاهوی هوش مصنوعی پررنگ می‌کنند. مجله Arstechnica پس از بررسی این رساله‌ی کتاب‌مانند درباره بزرگ‌ترین خطرات پیش روی آنتروپیک، فهرست خود را به هفت مشکل غافلگیرکننده، جذاب و تأمل‌برانگیز محدود می‌کند؛ خلاصه‌ای از سناریوهایی که بد نیست سرمایه‌گذاران آنتروپیک پیش از خرید سهام، گوشه ذهنشان داشته باشند.", "image_url": "https://api2.zoomit.ir/media/artificial-intelligence-stock-market-impact-6ae1d31e2b7fe0e7849f7f80?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "بورس و طلا"], "datetime_fa": "۶ آبان • ۱۹:۰۰"}, {"source": "Zoomit", "title": "شرط‌بندی روی پایان جهان؛ ریسک نابودی توسط هوش مصنوعی، فرصتی طلایی برای سرمایه‌گذاران است", "link": "https://www.zoomit.ir/ai-articles/469945-anthropic-ipo-ai-existential-risk/", "summary": "پرونده‌ عرضه‌ی اولیه‌ی سهام آنتروپیک نشان می‌دهد هشدارهای مربوط به خطرات آخرالزمانی هوش مصنوعی پیامدهای اقتصادی عجیبی برای بازار سرمایه به همراه دارد.", "date_str": "2026-10-28T15:15:00+00:00", "hash": "e6f1c433b786bf8b", "title_fa": "شرط‌بندی روی پایان جهان؛ ریسک نابودی توسط هوش مصنوعی، فرصتی طلایی برای سرمایه‌گذاران است", "summary_fa": "پرونده‌ عرضه‌ی اولیه‌ی سهام آنتروپیک نشان می‌دهد هشدارهای مربوط به خطرات آخرالزمانی هوش مصنوعی پیامدهای اقتصادی عجیبی برای بازار سرمایه به همراه دارد. تبلیغات گفتمان عمومی درباره‌ی خطرات وجودی هوش مصنوعی و نابودی احتمالی نسل بشر، پارادوکس جالبی را پیش روی سرمایه‌گذاران وال‌استریت قرار داده است. اگر احتمال نابودی جهان بر اثر سیستم‌های بسیار هوشمند فرضی واقعی باشد، مهار همین توانایی فوق‌العاده برای حل مسائل اقتصادی می‌تواند سودهای نجومی بی‌سابقه‌ای پدید آورد. به روایت وال استریت ژورنال ، ادعای برخی پژوهشگران مبنی‌بر احتمال بیش از ۱۰ درصدی نابودی بشر توسط ماشین‌ها، نشانگر پتانسیل بالای ۹۰ درصدی خلق ثروت توسط همان الگوریتم‌ها در صورت مهار موفق است. در سناریوی وقوع آخرالزمان، ارزش سهام و دارایی‌ها به‌طور کلی بی‌معنی خواهد بود، بنابراین ریسک صفر شدن سرمایه عملا از محاسبات سنتی ریسک‌پذیری خارج می‌شود. با وجود هیجان پیرامون عرضه‌ی عمومی سهام، اسناد رسمی خطرات دیگری را برجسته می‌کنند. در مستندات ۹۴ صفحه‌ای بخش ریسک شرکت آنتروپیک آمده است: «نگرانی‌هایی در درون سازمان ما و از سوی دیگر پژوهشگران، ناظران، سیاست‌گذاران و ف ash": "24055bcef47ecfc1", "title_fa": "هوش مصنوعی صوتی در مد: انویدیا مدل رونویسی باز جدیدی را منتشر کرد", "summary_fa": "انویدیا به تازگی یک مدل گفتار به متن رایگان منتشر کرده است که می‌تواند تا 40 زبان را رونویسی کند، اما فقط روی ضبط‌ها کار می‌کند، نه صدای زنده، بنابراین گام بزرگی برای ابزارهای رونویسی جلسات و پزشکی است و در عین حال استفاده بلادرنگ را به رقبایی مانند ElevenLabs واگذار می‌کند. انویدیا روز چهارشنبه Nemotron 3.5 Transcribe را منتشر کرد، یک مدل رایگان و با وزن باز که صدا را به حداکثر 40 زبان رونویسی می کند. همچنین نسخه 2 Granary، مجموعه داده گفتار منبع باز خود را منتشر کرد. انویدیا به خود می بالد که Nemotron 3.5 می تواند 31 زبان را به انگلیسی و از انگلیسی ترجمه کند، ضبط ها را تا یک ساعت انجام دهد و تا 8 سخنران را از هم تفکیک کند. این شرکت ادعا می کند که در معیارها، از جمله Hugging Face s Open ASR Leaderboard، رقبای خود را شکست می دهد. این ابزارها توسعه‌دهندگانی را هدف قرار می‌دهند که برنامه‌هایی را برای جلسات کاری و رونویسی پزشکی می‌سازند، دو مورد از تثبیت‌ترین پایگاه‌های هوش مصنوعی در محل کار. انویدیا می گوید که توسعه دهندگان می توانند از مدل، مجموعه داده Granary به روز شده و ابزارهایی مانند مدل NeMo Speech برای سفارشی کردن برنامه ها برای تشخیص اصطلاحات تخصصی صنعت در هر زبان استفاده کنند. یک اشکال: رونویسی با صدای ضبط شده کار می کند، نه با پخش جریانی زنده. با این حال، این شرکت قول می‌دهد که Transcribe با 30 میلیارد پارامتر، می‌تواند روی یک تراشه واحد اجرا شود، از کنترل‌کننده روباتیک Jetson AGX Thor و تراشه DGX Spark که لپ‌تاپ‌های جدید را تغذیه می‌کند تا تراشه‌های مرکز داده Blackwell. این مدل به مدل های صدای باز انویدیا، از جمله Parakeet فوق العاده کوچک و در عین حال قدرتمند (1.1 میلیارد پارامتر) می پیوندد. آخرین ورودی صوتی انویدیا در دوره", "image_url": "https://techcrunch.com/wp-content/uploads/2026/10/AI-on-the-tongue.png?resize=1200,600", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه", "عامل‌های هوشمند"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "The Guardian AI", "title": "Social media is full of weird video game mashu  "2026-10-28T14:05:00+00:00", "hash": "d45ebc3a8b4554b9", "title_fa": "دزدی از دیتاسنترهای هوش مصنوعی، سارقان را ثروتمند کرد", "summary_fa": "باندهای تبهکار با حمله به کامیون‌های حامل قطعات دیتاسنترهای هوش مصنوعی، بیش از ۱۰۰ میلیون دلار تجهیزات سرور را سرقت کرده‌اند. تبلیغات باندهای سازمان‌یافته با هدف قرار دادن محموله‌های ارسالی به دیتاسنترهای هوش مصنوعی، خسارت‌هایی چند ده میلیون دلاری به توسعه‌دهندگان فناوری وارد کرده‌اند. تبهکاران با ایجاد تصادف‌های جاده‌ای ساختگی، خودروهای اسکورت را از مسیر خارج می‌کنند و محموله‌های ارزشمند پردازشی را می‌ربایند. طبق یافته‌های NBC ، دزدی تجهیزات در حال انتقال دیتاسنترها از ژوئن ۲۰۲۶ (خرداد و تیر) تاکنون بیش از ۱۰۰ میلیون دلار خسارت به جا گذاشته است. گزارش‌ها نشان می‌دهد ده‌ها سرقت بزرگ در سراسر ایالات متحده ثبت شده و افزایش تقاضا برای زیرساخت‌های رایانشی، آمار دستبردها را بالا برده است. در یک رویداد، تریلی حامل تجهیزات سرور به مقصد فایت‌ویل جورجیا پس از تصادف عمدی یک خودرو با ماشین نامحسوس پلیس ناپدید شد. پلیس تریلی خالی را چند روز بعد در توقفگاهی پیدا کرد، درحالی‌که محموله‌ی ۱۳ میلیون دلاری آن کاملا به سرقت رفته بود. سناریوی مشابهی برای یک محموله‌ی ۱۰ میلیون دلاری عازم تگزاس رخ داد و مهاجمان علاوه بر تصادف با خودروی محافظ، ردیاب ماهواره‌ای را نیز دستکاری کردند. جراردو پاچوکا ، بازرس خصوصی سرقت محموله‌ها، گفت: «تصادف رخ‌داده اتفاقی نبود. تبهکاران خواهان بار بودند و عامدانه خودروهای اسکورت را هدف قرار دادند.» کیث لوئیس ، مدیر عملیات شرکت مدیریت ریسک Verisk CargoNet، گفت: «سرقت چنین محموله‌هایی درست مثل دزدیدن شمش‌های طلای خالص است. ارزش برخی از محموله‌های سرقت‌شده به بیش از ۳۰ میلیون دلار می‌رسد. دزدیدن قطعات بسیار آسان‌تر از سرقت بانک به حساب می‌آید.» لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/cover-6a82b32b7023b9d484304a01?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۶ آبان • ۱۷:۳۵"}, {"source": "Lifehacker", "title": "These Are the Best Arc Browser Alternatives, Now That It's Shutting Down", "link": "https://lifehacker.com/tech/best-arc-browser-alternatives?utm_medium=RSS", "summary": "Well, it happened: The Browser Company has finally announced that it will be sunsetting the Arc browser before the end of 2026 . The writing has been on the wall for well over a year now: Arc had already been put on ice, receiving only maintenance updates after the Browser Company switched its focus to Dia, an AI browser that shares Arc s framework but lacks the wonderful interface features that made Arc such a joy to use . This is sad news for the Arc faithful. If you're one of them, or if you re looking for an alternative to the regular browsers like Safari and Chrome, all hope is not lost. Export your Arc data , and try out one of these Arc-like alternatives. The Zen Browser is the best Arc alternative Credit: Zen Browser Zen has become the de facto option for all users looking to find something that looks and works like Arc. In some ways, it s better than Arc; in some ways it falls short. It has the look and feel down to a T. Zen has the same vertical sidebar, with customizable workspaces and pinned tabs up top. And like Arc, Zen has mods that let you customize the browser's user interface (plus a ton of community-developed mods ready to go). Zen is also free to use, and it s open-source. Cherry on top? There are no AI features. None. No upsells, no VPN, no schemes, nothing. It s built on Firefox, and it has a privacy-first approach. I ve been using Zen for months, and I m quite happy with it. The only downside I can see is the Firefox web engine; while Gecko has come a long way, it can still sometimes fall short of Chromium, mostly because Google Chrome is such a popular browser, most websites are designed to run best on it. When I run into an issue with a website, I tend to switch to Chrome for a while. Zen can also sometimes be a memory hog, but once I got better at tab hygiene (automatically closing older tabs and being vigilant about workspace management), the experience got quite a bit better. And yes, there is extension support: Anything that runs on Firefox will run here too. Firefox has most of the important extensions covered, and it s the only major browser that still supports the full-scale uBlock Origin ad blocker (which works like a treat in Zen, too). Vivaldi takes a maximalist approach to web browsing Credit: Vivaldi Alternatively, you can go to the opposite end of the spectrum and try out a maximalist browsing approac:. For a while, Microsoft Edge was the cleaner, faster, better version of Chrome, but now, that title goes to Vivaldi . ", "date_str": "2026-10-28T14:30:00+00:00", "hash": "ff29aebf5d792a95", "title_fa": "اینها بهترین گزینه های جایگزین مرورگر Arc هستند، اکنون که در حال خاموش شدن است", "summary_fa": "خوب، این اتفاق افتاد: شرکت مرورگر سرانجام اعلام کرد که مرورگر Arc را قبل از پایان سال 2026 غروب می کند. این نوشته بیش از یک سال است که روی دیوار مانده است: Arc قبلاً روی یخ گذاشته شده بود و پس از اینکه شرکت مرورگر تمرکز خود را بر روی Dia تغییر داد، فقط به‌روزرسانی‌های تعمیر و نگهداری را دریافت می‌کرد، یک مرورگر هوش مصنوعی که چارچوب Arc را به اشتراک می‌گذارد اما فاقد ویژگی‌های رابط فوق‌العاده‌ای است که Arc را برای استفاده بسیار لذت‌بخش کرده است. این یک خبر ناراحت کننده برای وفاداران Arc است. اگر شما یکی از آنها هستید، یا اگر به دنبال جایگزینی برای مرورگرهای معمولی مانند سافاری و کروم هستید، تمام امیدتان از بین نمی رود. داده های Arc خود را صادر کنید و یکی از این گزینه های مشابه Arc را امتحان کنید. مرورگر Zen بهترین جایگزین Arc است. از برخی جهات، بهتر از Arc است. از برخی جهات کوتاه می آید. ظاهر و احساسی تا حد T دارد. Zen همان نوار کناری عمودی، با فضاهای کاری قابل تنظیم و برگه‌های سنجاق‌شده در بالا را دارد. و مانند Arc، Zen دارای حالت‌هایی است که به شما امکان می‌دهد رابط کاربری مرورگر را سفارشی کنید (به‌علاوه تعداد زیادی مدهای توسعه‌یافته توسط جامعه آماده کار). استفاده از Zen نیز رایگان است و منبع باز است. گیلاس بالای سر؟ هیچ ویژگی هوش مصنوعی وجود ندارد. هیچ کدام. بدون افزایش فروش، بدون VPN، بدون طرح، هیچ چیز. این بر روی فایرفاکس ساخته شده است، و رویکرد اول حفظ حریم خصوصی دارد. من ماه هاست که از Zen استفاده می کنم و کاملا از آن راضی هستم. تنها نقطه ضعفی که می توانم ببینم موتور وب فایرفاکس است. اگرچه Gecko راه درازی را پیموده است، هنوز هم گاهی اوقات ممکن است از Chromium کوتاه بیاید، بیشتر به این", "image_url": "https://lifehacker.com/imagery/articles/01M619S6VG20JXY66C81C857NA/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Microsoft"], "datetime_fa": "۶ آبان • ۱۸:۰۰"}, {"source": "Lifehacker", "title": "This Pricey New Accessory Gives Your Kindle a Feature That Used to Be Standard", "link": "https://lifehacker.com/tech/the-kindle-page-turn-cover-turns-your-paperwhite-into-an-oasis?utm_medium=RSS", "summary": "We may earn a commission from links on this page. It has been 14 years since Amazon made a Kindle e-reader without a touchscreen, and while I certainly don't miss the days of slowly paging through my e-book library with the arrow keys on my Kindle Keyboard, the move to touch navigation did have one unfortunate result, at least for a small subset of readers: the loss of physical page-turn buttons. Once standard on all Kindles, they eventually became a premium feature available only on the pricey Kindle Oasis, before being dropped from the lineup entirely when that device was retired in 2024. While this fall's overhaul of the Kindle lineup introduced upgrades like a metal enclosure and a flush-front design, Amazon hasn't exactly reintroduced physical buttons, but the company has launched a new accessory to appeal to the roughly 5% of the market (per Kevin Keith, Amazon's vice president in charge of Kindle) that essentially turns your new Kindle Paperwhite Signature Edition into a Kindle Oasis: the Kindle Page-Turn Cover . The Page-Turn Cover builds the buttons into the case Credit: Joel Cunningham Releasing alongside the new flush-front Kindle Paperwhite Signature Edition, the Page-Turn Cover is made of plant-based leather (in one of three colors to match your Kindle Graphite, Fig, or Seaglass Green) with a magnetic front flap, a soft interior, and a right-hand bezel made of lightly textured plastic that houses two thin, elongated buttons. When you slot your compatible Kindle into the case, connecting it magnetically and via the built-in pogo pins, it will automatically pair with the device, allowing you to turn pages with a button press instead of a tap. By default, the top button will advance you forward by one page, and the bottom button will do the reverse, though you can change which does which in your device settings. While the physical buttons on some Boox and Barnes Noble Nook devices allow you to map different functions like skipping an entire chapter or scrubbing through a book quickly to a long-press or double-tap, as of this writing, the Page-Turn Cover will only let you turn one page at a time. The buttons also only work for turning pages; you'll still navigate your library and the device menus using the touchscreen. If you're a lefty, or prefer to swap which hand you use to hold your e-reader, you can change up the orientation by turning off Lock Rotation on your device; when you flip it over to hold in your other hand, the text will automatica", "date_str": "2026-10-28T14:00:10+00:00", "hash": "dd0d822a23fcdec2", "title_fa": "این لوازم جانبی گران قیمت به کیندل شما ویژگی استانداردی می دهد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. ۱۴ سال از زمانی که آمازون یک کتابخوان الکترونیکی Kindle بدون صفحه لمسی ساخت، می‌گذرد، و اگرچه من مطمئناً روزهایی را که به آرامی در کتابخانه کتاب الکترونیکی خود با کلیدهای پیکان روی صفحه‌کلید Kindle خود جستجو می‌کردم را از دست نمی‌دهم، حرکت به سمت ناوبری لمسی حداقل برای زیرمجموعه کوچکی از خوانندگان یک نتیجه ناگوار داشت: از دست دادن دکمه‌های فیزیکی برای چرخاندن صفحه. زمانی که روی همه کیندل‌ها استاندارد بود، در نهایت به یک ویژگی ممتاز تبدیل شدند که فقط در کیندل اوزیس گران‌قیمت در دسترس بود، قبل از اینکه در سال 2024 زمانی که آن دستگاه بازنشسته شد، به‌طور کامل از خط تولید حذف شدند. در حالی که در پاییز امسال تغییرات اساسی در سری Kindle به‌روزرسانی‌هایی مانند یک محفظه فلزی و طراحی هموار در جلو ارائه شد، آمازون دقیقاً دکمه‌های فیزیکی را مجدداً معرفی نکرده است، اما این شرکت لوازم جانبی جدیدی را برای جذب تقریباً 5 درصد از بازار عرضه کرده است (از نظر کوین کیت، معاون آمازون، معاون رئیس‌جمهور جدید آمازون، مسئول Kindle) Kindle Oasis: Kindle Page-Turn Cover . روکش Page-Turn دکمه ها را در قاب قرار می دهد اعتبار: Joel Cunningham در کنار نسخه جدید کیندل Paperwhite Signature Edition در جلو، روکش Page-Turn از چرم گیاهی ساخته شده است (در یکی از سه رنگ برای مطابقت با Kindle Graphite، Figure، یا Seglass Enterprise با لبه جلویی نرم، سبز مگنتی و شیشه ای دریایی) ساخته شده از پلاستیک با بافت سبک که دو دکمه نازک و کشیده را در خود جای داده است. هنگامی که Kindle سازگار خود را در قاب قرار می دهید، آن را به صورت مغناطیسی و از طریق پین های pogo داخلی متصل می کنید، به طور خودکار با دستگاه جفت می شود و به شما امکان می دهد", "image_url": "https://lifehacker.com/imagery/articles/01M5ZEKWQEG8Y4Q7V0VY0TWX8T/hero-image.fill.size_1200x675.png", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۶ آبان • ۱۷:۳۰"}],
      media: [{"source": "Billboard", "title": "Selena Gomez & Demi Lovato Reunite for Nostalgic Beauty Campaign: ‘Still Making Each Other Blush’", "link": "https://www.billboard.com/music/music-news/selena-gomez-demi-lovato-reunite-rare-beauty-campaign-1236369579/", "summary": "The princesses are back. Nearly two decades after costarring in Princess Protection Program , Selena Gomez and Demi Lovato have reclaimed their tiaras for a special collaboration celebrating nearly 25 years of friendship. Related Demi Lovato Explains How Disney Channel Nostalgia Definitely Reconnected Her With Selena Gomez Joe Jonas Demi Lovato Explains How Disney Channel Nostalgia Definitely Reconnected Her With Selena Gomez Joe Jonas Demi Lovato Offers Update After Allergic Reaction Reported Hospitalization As announced Wednesday (Oct. 28), Gomez enlisted Lovato for Rare Beauty s new campaign, Still Making Each Other Blush. It arrives with a packaged set that includes two liquid blushes in different shades. For the team-up, the two former Disney Channel stars posed in fancy gowns and crowns for some regal photos, marking one of the first times fans have seen them together in years. After meeting on Barney Friends in 2002, Gomez and Lovato stayed close while building their careers as actresses and singers, starring on Wizards of Waverly Place and Sonny With a Chance , respectively, as well as costarring in Princess Protection Program (2009). There were a few bumps in the road that played out publicly over the years, but as of earlier this year, the artists are firmly in each other s corners. “I am in tears,” Gomez wrote on Instagram in April after attending one of Lovato s It s Not That Deep Tour concerts. “@ddlovato — this was hands down one of the best shows. Oh and the VOCALS? Psh *blown away.” The Rare Beauty collab also builds on the wave of 2000s throwbacks that Disney stars such as Gomez and Lovato, as well as the Jonas Brothers and Miley Cyrus, have been enjoying this past year. The  بود. لارنس گفت، این همان AD بود که میلیون ها بار با او کار کردم زیرا او را دوست دارم. و با جاش و وودی... خیلی احساسی بود. من و جاش بدون اینکه دستان همدیگر را گرفته بودیم به سمت حمام نرفتیم. خیلی زیبا بود سال گذشته، به طور گسترده گزارش شد که لارنس دوباره نقش خود را برای Sunrise on the Reaping، ششمین فیلم از سری بازی‌های Hunger بازی خواهد کرد که قرار است در 20 نوامبر اکران شود و هاچرسون نیز در نقش Peeta Mellark بازخواهد گشت. با این حال، چیزی که در آن زمان مورد توجه قرار نگرفت، مشارکت هارلسون در این فیلم بود که بر داستان اصلی شخصیت او، هایمیچ آبرناتی تمرکز دارد. لارنس گفت و واضح است که وودی بدون دعوت از پنجره اتاق هتل من وارد شد. اگر او به مرزها گوش می داد یا از در استفاده می کرد، یکسان نمی شد.\" صدای هارلسون در یک تیزر اولیه برای Sunrise on the Reaping ظاهر شد که در آن لوگوی رسمی فیلم فاش شد. او در پیش نمایش گفت، فکر می کنم این بازی ها متفاوت خواهند بود. طرفداران حدس می زدند که این بازیگر ممکن است به عنوان راوی فیلم بازگردد. جوزف زادا بازیگر ۲۱ ساله در نقش آبرناتی در کنار مککنا گریس که نقش میسیلی دانر را بازی می‌کند، Sunrise", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/woody-jlaw.jpg?crop=0px%2C14px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۹:۵۱"}, {"source": "Hollywood Reporter", "title": "‘The Invite’ to Receive Vanguard Award at Palm Springs International Film Festival", "link": "https://www.hollywoodreporter.com/movies/movie-news/invite-vanguard-award-palm-springs-film-festival-1236741160/", "summary": "Confirmed to attend the ceremony are Olivia Wilde, Seth Rogen, Edward Norton and Penélope Cruz.", "date_str": "2026-10-28T17:00:00+00:00", "hash": "cd910f48a9d68195", "title_fa": "«دعوت» برای دریافت جایزه پیشتاز در جشنواره بین‌المللی فیلم پالم اسپرینگز", "summary_fa": "حضور اولیویا وایلد، ست روگن، ادوارد نورتون و پنه لوپه کروز تایید شده است. جوایز بین‌المللی فیلم پالم اسپرینگز روز چهارشنبه اعلام کرد، The Invite ساخته اولیویا وایلد جایزه پیشتاز جشنواره بین‌المللی Golden Eddie Filmmaker of the Year award at the 77th annual ACE Eddie Awards. Editors Bonnie Koehler and Christopher Nelson will also receive ACE Career Achievement awards during the ceremony, which recognizes the best film editing achievements of the year across [ ]", "date_str": "2026-10-28T16:00:00+00:00", "hash": "61b76058723ceea0", "title_fa": "جان کارپنتر بهترین فیلمساز سال در جوایز ACE Eddie را دریافت کرد", "summary_fa": "جان کارپنتر، فیلم‌ساز، فیلم‌نامه‌نویس، تهیه‌کننده و آهنگ‌ساز، جایزه بهترین فیلم‌ساز سال طلایی ادی سردبیران سینمای آمریکا (ACE) را در هفتاد و هفتمین دوره جوایز سالانه ACE Eddie دریافت خواهد کرد. تدوینگران بانی کوهلر و کریستوفر نلسون نیز در طول این مراسم جوایز دستاورد شغلی ACE را دریافت خواهند کرد که بهترین دستاوردهای تدوین فیلم در سال را به رسمیت می‌شناسد [ ] کارپنتر تا حد زیادی در سال 1978 با «هالووین» به مخاطبان معرفی شد و از آن زمان به شکل‌گیری ژانر ترسناک مدرن که شامل «محوطه‌های کارگردانی» می‌شود، ادامه داد. از نیویورک و آنها زندگی می کنند. او \"موضوعات گمشده\" را در سال 2014 و همچنین \"کلیسای جامع\" را در اوایل امسال آهنگسازی کرد. سابرینا پلیسکو، رئیس ACE، گفت: جان کارپنتر فیلم هایی می سازد که زیر پوست شما فرو می روند و در آنجا می مانند. «هالووین»، «چیز»، «فرار از نیویورک» - این فیلم‌ها باعث ترس، هیجان و شکل‌دهی نسل‌های مخاطبان و فیلم‌سازان شده‌اند. تعداد کمی از کارگردانان ریتم، تنش و خویشتن داری را به شیوه او درک می کنند و او همیشه به سردبیرانش اعتماد کرده است تا به او کمک کنند تا آن را پیدا کند. این همکاری دقیقاً همان چیزی است که این افتخار جشن می گیرد. کارپنتر به جمع برندگان سابق می پیوندد که شامل جان ام چو، جان واترز، اسپایک لی، کوئنتین تارانتینو، کریستوفر نولان، لورن شولر دانر، گیرمو دل تورو، استیون اسپیلبرگ، وینس گیلیگان، جی.جی. آبرامز، نانسی مایرز، مارتین اسکورسیزی، جورج لوکاس و موسسه ساندنس. کولر در طول بیش از 40 سال فعالیت حرفه ای خود، 15 فیلم بلند، 9 سریال تلویزیونی پربیننده و هشت فیلم هفته را تدوین کرد. از آثار او می توان به «یک پرواز بر فراز آشیانه فاخته»، «امپراتوری پاسخ می دهد»، «بازگشت جدی»، «پلترگیست»، «نظام قانون: واحد قربانیان ویژه» و «ال. قانون.”", "image_url": "https://variety.com/wp-content/uploads/2023/01/John-Carpenter-Variety-Ferature-Story-16x9-2.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۶ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "NFL Boss Roger Goodell Says ‘It Was Clear’ Jay-Z Wanted Super Bowl Halftime Show: ‘He’s Already Got His Vision’", "link": "https://www.billboard.com/music/rb-hip-hop/roger-goodell-jay-z-wanted-super-bowl-halftime-show-1236369541/", "summary": "Jay-Z was announced as the official Super Bowl LXI Halftime Show headlining performer earlier this week, but NFL commissioner Roger Goodell has long believed that Hov s day on the Super Bowl stage would come. Related The Dream Guest Lineup for Jay-Z s Super Bowl LXI Halftime Show Jay-Z s Super Bowl LXI Halftime Show: Our Dream Setlist Jason Kelce Is Fired Up For Jay-Z s Super Bowl LXI Halftime Show: He is the GOAT Goodell joined Apple Music s The Ebro Show for an interview with Ebro Darden and Eddie Francis on Tuesday (Oct. 27), during which he shed some light on the timing being right for Jay-Z to be the halftime show choice for February 2027 in Los Angeles. We’ve always wanted this to happen at some point. It was something I asked him about at the time when we first started this, and he said, Yeah, we’ll see. Let’s see what happens. But it was clear he wanted it to happen, Goodell explained. We’ve talked about it a couple of times. The commissioner continued: I think the fact that he’s in his 30th anniversary year of his first album, he just finished his tour, it’s L.A., he’s at that point as the GOAT that he’s ready for it. He was pretty clear: I wanna do it this year. I guess I was more excited than anything, maybe a little surprised, because he keeps putting it off a little bit. Hov and Roc Nation have served as the league s live music entertainment strategist since 2019. They re-upped in 2024 to extend their partnership, which has brought the likes of Rihanna , The Weeknd, Kendrick Lamar, Usher , Bad Bunny, Dr. Dre and Snoop Dogg to the Super Bowl stage. But I think he’s already got his vision; he already understands what he wants to do, Goodell added of Jay s plan. He’s been so remarkable in helping us elevate the whole Super Bowl Halftime Show. He’s a genius, and not just a creative genius in a musical sense. His business sense, his sense of timing, his sense of what’s necessary in the world — he’s just got that. I trust him, and I trust his point of view. As part of the NFL s halftime show announcement, Goodell revealed that his one request to Jay when the NFL entered a partnership with Roc Nation was that the Brooklyn rap dignitary take the Super Bowl stage at some point. “When we first reached an agreement with Roc Nation to produce the show, I had just one request: that Jay-Z take the stage himself one day, whenever the moment felt right to him,” Goodell said in a statement in the announcement. There s been plenty of social media chatter in the", "date_str": "2026-10-28T16:00:31+00:00", "hash": "4254e502ea7aa5db", "title_fa": "راجر گودل، رئیس NFL می‌گوید: «واضح بود» Jay-Z می‌خواهد در نیمه‌های نیمه‌بازی Super Bowl: «او از قبل دید خود را پیدا کرده است»", "summary_fa": "Jay-Z به عنوان مجری رسمی Super Bowl LXI Halftime Show در اوایل این هفته اعلام شد، اما راجر گودل، کمیسر NFL مدتهاست که معتقد است روز Hov در استیج Super Bowl فرا خواهد رسید. موارد مرتبط The Dream Guest Lineup برای Jay-Z s Super Bowl LXI Halftime Show Jay-Z s Super Bowl LXI Halftime Show: Jason Kelce Setlist ما برای Jay-Z Super Bowl شروع به کار کرد LXI نیمه تایم نمایش: او GOAT است گودل به اپل موزیک پیوست. 27)، که در طی آن او تا حدودی زمان بندی مناسب برای Jay-Z را برای انتخاب نیمه نیمه برای فوریه 2027 در لس آنجلس روشن کرد. ما همیشه دوست داشتیم این اتفاق در مقطعی بیفتد. این چیزی بود که در زمانی که برای اولین بار این کار را شروع کردیم از او پرسیدم، و او گفت، بله، خواهیم دید. ببینیم چی میشه گودل توضیح داد، اما واضح بود که او می‌خواست این اتفاق بیفتد. ما چند بار در مورد آن صحبت کرده ایم. کمیسر ادامه داد: من فکر می کنم این واقعیت که او در 30 سالگی اولین آلبوم خود است، او به تازگی تور خود را به پایان رسانده است، لس آنجلس است، او در آن نقطه به عنوان GOAT است که برای آن آماده است. او کاملا واضح بود: من می خواهم این کار را امسال انجام دهم. حدس می‌زنم بیشتر از هر چیزی هیجان‌زده بودم، شاید کمی تعجب کردم، زیرا او کمی آن را به تعویق می‌اندازد. Hov و Roc Nation از سال 2019 به‌عنوان استراتژیست سرگرمی موسیقی زنده لیگ فعالیت می‌کنند. آنها در سال 2024 دوباره همکاری خود را گسترش دادند، که باعث شد افرادی مانند ریحانا، ویکند، کندریک لامار، آشر، بد بانی، دکتر دره و اسنوپ داگ به صحنه Super Bowl بروند. اما من فکر می کنم او از قبل دیدگاه خود را دریافت کرده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/1465385202-e1793119164729.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "موسیقی"], "datetime_fa": "۶ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Jennifer Lopez Looking For ‘Proof of Love’ on New Bonus Track From ‘Love?’ Vinyl Reissue", "link": "https://www.billboard.com/music/pop/jennifer-lopez-proof-of-love-single-bonus-track-love-vinyl-1236369580/", "summary": "Jennifer Lopez is gearing up to celebrate the 15th anniversary of her seventh studio album, Love? , with the LP s first-ever vinyl release. The rebooted set, which will come in three different collectible editions, will also feature the new dance song Proof of Love. Lopez told Variety that she was inspired to write and record the new song after her twins, Max and Emme (who recently changed their name to Oskar), left for college this fall. They take up such a big part of your brain for so long, and when they’re gone, which is devastating and sad and scary, you’re facing a life that’s totally different now, and you’re like, ‘What am I going to do with this space and this time?’ For me, I just went back in the studio, she said. I’ve written some of the best songs that I’ve ever written, and I’m really excited. It’s a very happy era album. It’s some of the most joyous, beautiful songs that have just a tad of a tear in them.” The 2011 release, inspired by the birth of the twins with Lopez ex-husband, singer Marc Anthony, featured the global Billboard Hot 100 No. 3 hit On the Floor featuring Pitbull, as well as the fan favorites I m Into You (feat. Lil Wayne) and Papi. Lopez told Variety that the new track is a beautiful song about this kind of duality. It’s this happy dance song, and these are the things that are the proof of love. One of them is pain and grief when someone’s gone. You feel pain and grief. That’s really proof of love. I wanted to make that a happy thing. I wanted to make that a marker instead of this devastating thing. Fans can pre-order the three vinyl editions now, which will include the standard 12-track version featuring Proof of Love, a deluxe 2LP edition with 17 tracks on translucent royal blue vinyl, the new single, new artwork and five additional album tracks: Hypnotico, Everybody s Girl, Charge Me Up, Take Care and On the Floor (Ven a Bailar). The Love? color vinyl BILT exclusive edition comes on cherry red vinyl, with all three due out in November on an as-yet-unannounced date. In the meantime, Lopez is gearing up for The JLo Show: Live in Las Vegas on Thanksgiving night (Nov. 26) which will air at 8 p.m. ET on CBS and stream on Paramount+. Check out Lopez s post announcing the vinyl release below. View this post on Instagram", "date_str": "2026-10-28T15:59:24+00:00", "hash": "f7419430066e09f4", "title_fa": "جنیفر لوپز به دنبال «اثبات عشق» در آهنگ جدید جایزه از «Love?» وینیل انتشار مجدد است", "summary_fa": "جنیفر لوپز در حال آماده شدن برای جشن گرفتن پانزدهمین سالگرد انتشار هفتمین آلبوم استودیویی خود، Love? ، با اولین انتشار وینیل LP. مجموعه ریبوت شده، که در سه نسخه مختلف کلکسیونی عرضه خواهد شد، همچنین دارای آهنگ رقص جدید Proof of Love خواهد بود. لوپز به ورایتی گفت که پس از اینکه دوقلوهایش، مکس و اِم (که اخیراً نام خود را به اسکار تغییر داده
