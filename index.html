's Showgirl: The Encore برش های جایزه برای ما ماندگار است؟ الیویا رودریگو و چاپل روآن در اولین ریمیکسشان چگونه بودند؟ آیا هری استایلز سال را در مکانی قوی تر از آنچه ما انتظار", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/tate-mcrae-calvin-klein-carlijn-jacobs-billboard-1800.jpg?w=1024", "category": "موبایل و گجت‌ها", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "The Best Phone Plans for Frequent Concertgoers That Offer VIP Access, Ticket Discounts & Festival Lounges", "link": "https://www.billboard.com/culture/product-recommendations/compare-best-phone-plans-concerts-festivals-discounts-perks-1236373220/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Concert tickets are expensive enough without paying extra for every upgrade, but you don&#x2019;t have to settle for watching other concertgoers enjoy exclusive lounges, special entrances and premium viewing areas from the general admission crowd. Depending on your wireless carrier, being a customer could unlock discounted concert tickets , VIP experiences and even a better internet connection when thousands of fans are trying to post the same encore. T-Mobile , Verizon and AT T each offer different ways to get more out of live music. The details vary by carrier, with some offers tied to specific phone plans and others available through loyalty programs or event partnerships. Knowing where to find these benefits can help you make the most of your existing wireless service before your next show. T-Mobile Offers Concert Ticket Discounts Festival Lounges T-Mobile makes a strong case for music fans with benefits that extend beyond ticket discounts to exclusive festival experiences. Eligible customers can save 25% on tickets to select shows at more than 120 venues nationwide, including select Las Vegas residencies. Now, for the first time ever, T-Mobile customers can choose what&#x2019;s included in their wireless plan through T-Mix , which offers three tiers: Standard (1&#x2013;4 Picks), More (2&#x2013;12 Picks) and Loaded (3&#x2013;21 Picks). Customers can use Picks to add benefits across entertainment, lifestyle, productivity and device promotions, including ESPN Unlimited, Netflix, Hulu and T-Satellite. Each tier offers different levels of premium data, hotspot access and streaming quality, with plans starting at $55 per month for one Standard line. Additional account lines add more Picks. sign up for t-mobile Separately, all T-Mobile customers receive perks at no additional cost and without using Picks. These include Club Magenta access at major events like Lollapalooza, Stagecoach and the Las Vegas Grand Prix, plus ticket access and experiences at thousands of events. Members also get T-Mobile Tuesdays, which offered more than $900 in freebies per customer last year, hotel and rental car discounts and a complimentary Delta premium in-flight drink on eligible flights. For new customers, switching takes as little as 15 minute", "date_str": "2026-11-05T15:00:00+00:00", "hash": "03cb99be4b82817f", "title_fa": "بهترین برنامه‌های تلفن برای کنسرت‌کنندگان مکرر که دسترسی VIP، تخفیف‌های بلیت و سالن‌های جشنواره ارائه می‌دهند", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. بلیت‌های کنسرت بدون پرداخت هزینه اضافی برای هر ارتقا به اندازه کافی گران هستند، اما مجبور نیستید به تماشای تماشای دیگر کنسرت‌کنندگان از سالن‌های منحصر به فرد، ورودی‌های ویژه و مناطق تماشای ممتاز از جمعیت عمومی بسنده کنید. بسته به شرکت مخابراتی بی‌سیم شما، زمانی که هزاران طرفدار در تلاش برای پست کردن همان صفحه هستند، مشتری بودن می‌تواند قفل بلیط‌های کنسرت تخفیف‌خورده، تجربه‌های VIP و حتی یک اتصال اینترنتی بهتر را باز کند. شر مرتبط با مایکل داگلاس با مهربانی پس از مهتاب اسکار دیس بازیگر، هیلی بیبر جزئیات ترن هوایی عاطفی PMDD تشخیص بعد از تولد پسر جک بلوز: فقط یک سفر واقعا شدید و ویژه عروسک دیوالی باربی دوباره موجود است برای آخرین ویدیوهای جشنواره Expore به آن لایت اینجا را مشاهده کنید: و اخبار T-Mobile، Verizon و AT T هر کدام راه های متفاوتی را برای بهره گیری بیشتر از موسیقی زنده ارائه می دهند. جزئیات بسته به شرکت مخابراتی متفاوت است، برخی از پیشنهادها به برنامه‌های تلفنی خاص مرتبط هستند و برخی دیگر از طریق برنامه‌های وفاداری یا مشارکت رویداد در دسترس هستند. دانستن اینکه کجا می توانید این مزایا را پیدا کنید می تواند به شما کمک کند تا قبل از نمایش بعدی خود از خدمات بی سیم موجود خود حداکثر استفاده را ببرید. T-Mobile با مزایایی که فراتر از تخفیف بلیت و تجربه جشنواره های انحصاری است، یک مورد قوی برای طرفداران موسیقی ایجاد می کند. مشتریان واجد شرایط می توانند 25٪ در بلیط برای نمایش های منتخب در بیش از 120 مکان در سراسر کشور، از", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Best-phone-plans-for-concerts-shop-online.png?w=720", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Hilary Duff: Photos From the Billboard Cover Shoot", "link": "https://www.billboard.com/photos/hilary-duff-photos-billboard-cover-shoot-1236372349/", "summary": "Hilary Duff ’s kids were asleep on the tour bus as it pulled up to Austin’s Germania Insurance Amphitheater. It was 5 a.m., but Duff, high on adrenaline from her show the previous night, was wide-awake — just like she’d been for the seven nights prior. She hoped to finally get some sleep, but unfortunately for her, the amphitheater is next to the Circuit of the Americas racetrack, and a fleet of F1 cars were just starting their day. “It was like, feeoooo , feeoooo , feeeoooo ,” Duff says, approximating the sound of those cars throttling by at 150 miles an hour. Staring down another day of being a mother before getting onstage to be a pop star, Duff was on the verge of malfunction. “I’d only gotten two hours of sleep, and it was like, ‘Help me, please,’” she recalls. “My husband grabbed my pillow, my blanket, blasted sound machines, gave me an eye mask, gave me earplugs, put headphones on top of the earplugs and was like, ‘I will keep the kids away from you. Don’t come out of here for six hours, because you have a show tonight.’ ” Nearly 25 years into her musical career, Duff is no stranger to life on the road. But until her zeitgeist-capturing Lucky Me Tour this past summer, she’d never brought her husband and kids along for the ride. The ongoing run is supporting her February album, Luck … Or Something , a surprise hit after Duff’s 11-year break from music that reached No. 3 on the Billboard 200 . With its tight 37 minutes of catchy, clever and often genuinely deep bops, it proved she still has serious pop cachet to spare. The album currently has 411.4 million on-demand official U.S. streams, according to Luminate. Read Billboard’s full Hilary Duff cover story here . Hilary Duff will sit down for an exclusive conversation at the 2026 Billboard Live Music Summit, where she will receive the Outstanding Pop Tour of the Year Award. Tickets for the Nov. 10 event are available here .", "date_str": "2026-11-05T14:59:35+00:00", "hash": "84217cc87957ff24", "title_fa": "هیلاری داف: عکس‌هایی از عکس روی جلد بیلبورد", "summary_fa": "بچه‌های هیلاری داف در اتوبوس تور در حالی که به آمفی‌تئاتر بیمه آلمانیا آستین می‌رفت، خواب بودند. ساعت 5 صبح بود، اما داف، با آدرنالین زیاد در برنامه شب قبلش، کاملاً بیدار بود - درست مثل هفت شب قبل. او امیدوار بود بالاخره کمی بخوابد، اما متأسفانه برای او، آمفی‌تئاتر در کنار پیست مسابقه‌ای Circuit of the Americas قرار دارد و ناوگانی از اتومبیل‌های F1 تازه روز خود را شروع می‌کردند. داف می گوید: «مثل این بود، feeoooo، feeoooo، feeeoooo،» با تقریبی صدای آن ماشین ها که با سرعت 150 مایل در ساعت حرکت می کردند. داف که یک روز دیگر از مادر شدن را قبل از اینکه به روی صحنه برود تا یک ستاره پاپ شود، خیره شده بود، در آستانه نقص بود. او به یاد می آورد: «من فقط دو ساعت خوابیده بودم، و مثل این بود که «لطفا به من کمک کن». شوهرم بالش، پتوم را گرفت، دستگاه‌های صدا را به صدا درآورد، ماسک چشمی به من داد، گوش‌گیر به من داد، هدفون را روی گوش‌گیر گذاشت و گفت: «بچه‌ها را از شما دور می‌کنم. شش ساعت از اینجا بیرون نرو، چون امشب برنامه‌ای دارید.» «نزدیک به 25 سال زندگی او در مسیر موسیقی عجیب نیست. اما تا زمانی که در تابستان گذشته تور «لاکی من» را جلب کرد، هرگز شوهر و بچه‌هایش را برای این سفر همراه نکرده بود. این برنامه در حال اجرا از آلبوم فوریه او، Luck… or Something پشتیبانی می کند، موفقیتی غافلگیرکننده پس از وقفه 11 ساله داف از موسیقی که به رتبه 3 بیلبورد 200 رسید. با 37 دقیقه بازی‌های جذاب، هوشمندانه و غالباً عمیق، ثابت کرد که او هنوز هم چیزهای جدی پاپ دارد. طبق گفته Luminate، این آلبوم در حال حاضر دارای 411.4 میلیون استریم رسمی ایالات متحده است. داستان کامل جلد بیلبورد هیلاری داف را اینجا بخوانید. هیلاری", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/cover-hilary-duff-billboard-2026-bb12-gleeson-paulino-1-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۸:۲۹"}, {"source": "Billboard", "title": "Guitarricadelafuente on His Acclaimed Acting Debut in ‘La Bola Negra’: ‘It Was an Extension of What I Was Feeling Musically’", "link": "https://www.billboard.com/music/latin/guitarricadelafuente-la-bola-negra-acting-debut-1236374471/", "summary": "Guitarricadelafuente has spent nearly a decade building a career from a place that, at first, served almost as a hiding spot. The artist, whose real name is Álvaro Lafuente, began singing under that pseudonym precisely because he was shy, and wanted to maintain some distance between himself and the person behind the songs. But, over time, music ended up doing the exact opposite, giving him the tools to show himself. Now, his journey has taken on a new dimension with La Bola Negra , the film directed, co-written and produced by Javier Calvo and Javier Ambrossi — known in Spain as “Los Javis” — inspired by Federico García Lorca’s unfinished play, and representing Spain in the race for the 2027 Oscar for best international feature film. For Guitarricadelafuente, this means that many people are discovering him for the first time, through something entirely different from his music. “They should know that I really come from music and making songs,” he tells Billboard Español . “I’ve been fortunate that, in this film, in some way, the character I’ve portrayed is an extension of what I was feeling musically. I think it’s very beautiful that this has been able to happen.” La Bola Negra follows the lives of three gay men at three key moments in Spanish history: 1932, 1937 and 2017. Guitarricadelafuente — who co-stars in the film alongside Milo Quifes and Carlos González — plays Sebastián, a young musician (trumpeter) forcibly recruited by Franco’s forces after surviving an attack during the Spanish Civil War. From this project, the song “La Nieve” was born, an original piece he wrote alongside Raül Refree and Lucas Durán, further intertwining his two worlds within the film. But long before portraying Sebastián, there were the songs he began sharing online, almost anonymously. In 2018, he released his first original composition, “El Conticinio,” recorded with a PlayStation microphone. That same year, he launched “Guantanamera,” which reached No. 69 on PROMUSICAE’s songs chart. Those early steps shaped Guitarricadelafuente, a project that, according to the artist, was born as a way to protect himself from his own shyness. “I’ve always been someone very timid,” he explains. “The reason I call myself Guitarricadelafuente was to create a nickname so that no one would know it was me behind it. From the first time I got on stage, I was always using the guitar as a shield so no one could see me.” Over the years, that relationship with the audience changed, and music ended ", "date_str": "2026-11-05T14:25:12+00:00", "hash": "5c61de6877fb5056", "title_fa": "Guitarricadelafuente در اولین بازی تحسین‌برانگیز خود در «La Bola Negra»: «این بسط چیزی بود که من از نظر موسیقی احساس می‌کردم»", "summary_fa": "Guitarricadelafuente نزدیک به یک دهه را صرف ساختن شغلی از جایی کرده است که در ابتدا تقریباً به عنوان یک مخفیگاه عمل می کرد. این هنرمند که نام اصلی او آلوارو لافونته است، دقیقاً به این دلیل که خجالتی بود شروع به خواندن با این نام مستعار کرد و می‌خواست فاصله‌ای بین خود و شخصی که پشت آهنگ‌ها بود حفظ کند. اما با گذشت زمان، موسیقی دقیقاً برعکس عمل کرد و ابزارهایی را در اختیار او قرار داد تا خودش را نشان دهد. اکنون، سفر او با La Bola Negra، فیلمی به کارگردانی، نویسندگی و تهیه کنندگی مشترک خاویر کالوو و خاویر آمبروسی - که در اسپانیا با نام \"لس جاویس\" شناخته می شود - با الهام از بازی ناتمام فدریکو گارسیا لورکا و نماینده اسپانیا در رقابت برای بهترین فیلم بلند بین المللی اسکار 2027، ابعاد جدیدی به خود گرفته است. برای Guitarricadelafuente، این بدان معنی است که بسیاری از مردم برای اولین بار او را از طریق چیزی کاملاً متفاوت از موسیقی او کشف می کنند. او به Billboard Español می گوید: «آنها باید بدانند که من واقعاً از موسیقی و آهنگسازی آمده ام. \"خوشبخت بودم که در این فیلم، به نوعی، شخصیتی که به تصویر کشیده‌ام، بسط احساسی است که از نظر موسیقی داشتم. فکر می‌کنم بسیار زیباست که این اتفاق می‌افتد.\" La Bola Negra زندگی سه مرد همجنس گرا را در سه لحظه کلیدی در تاریخ اسپانیا دنبال می کند: 1932، 1937 و 2017. Guitarricadelafuente - که در این فیلم در کنار میلو کویفس و کارلوس گونزالس بازی می کند - نقش سباستین، نوازنده جوانی (ترومپت) را بازی می کند که پس از جان سالم به در بردن از یک حمله در طول جنگ داخلی اسپانیا، به زور توسط نیروهای فرانکو به خدمت گرفته شد. از این پروژه، آهنگ \"La Nieve\" متولد شد، قطعه ای اورجینال", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Guitarricadelafuente-2026-credit-wolfgang-tillmans-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۴ آبان • ۱۷:۵۵"}, {"source": "Billboard", "title": "Netflix Rolls Out More Than An Hour of ‘KPop Demon Hunters’ Bonus Material, Including Playlists, Short-Form Stories and Games", "link": "https://www.billboard.com/culture/tv-film/netflix-kpop-demon-hunters-bonus-material-playlists-games-details-1236374696/", "summary": "Netflix dropped a ton of bonus KPop Demon Hunters content on Monday (Nov. 2) as part of a roll-out of 22 new episodes inspired by the wildly popular, Oscar-winning animated film. The 78 minutes of fresh content ranges from stop-motion adventures to games, official dance and choreo videos and kids shorts. The new material includes KPop Demon Hunters PLAYlist , a 13-episode, 49-minute collection of shorts that kicks off with HUNTER/X Backstage Pass , which follows Rumi, Mira and Zoey as they battle with rival idols and demon janitors, confront writer s block, fashion emergencies and face off against rivals the Saja Boys in a promo photo shoot face off. The bonus episodes also include stop-motion animation toy versions of the movie s characters acting out some of the original film s biggest moments and interactive games focused on the character s backstage lives. There is also a nine-episode bundle of dance videos that run just under 30 minutes that includes animated Kpop girl group HUNTR/X going through a dance rehearsal for How It s Done featuring choreo not seen in the movie, as well as a live-action dance performance video of the song. Fans can also watch full, live-action choreo videos for Golden, Takedown, Soda Pop and Your Idol, in which choreographers Leejung Lee, Nail and K-Tigers break down how and why Mira, Rumi and Zoey move the way they do. The massively popular animated movie that launched on Netflix in 2025 has been streamed a record 325 million times, as well as screened in movie theaters across the world, with producers confirming that a sequel to the streamer s most-watched title of all time is on the horizon. While no details are available now, directors Maggie Kang and Chris Applehans are set to return. The original featured the eight-week Billboard Hot 100 chart-topper Golden, which won the best original song award at the 2026 Academy Awards, Critic s Choice Awards, Grammys and the Golden Globes.", "date_str": "2026-11-05T14:00:30+00:00", "hash": "29ba45d9e5c81b9e", "title_fa": "نتفلیکس بیش از یک ساعت مواد جایزه «KPop Demon Hunters» شامل فهرست‌های پخش، داستان‌های کوتاه و بازی‌ها را منتشر می‌کند.", "summary_fa": "نتفلیکس در روز دوشنبه (۲ نوامبر) محتوای جایزه KPop Demon Hunters را به عنوان بخشی از انتشار ۲۲ قسمت جدید با الهام از این فیلم انیمیشن بسیار محبوب و برنده اسکار منتشر کرد. 78 دقیقه محتوای جدید از ماجراجویی های استاپ موشن گرفته تا بازی، رقص رسمی و ویدیوهای رقص و شورت های بچه گانه را شامل می شود. مواد جدید شامل KPop Demon Hunters PLAYlist، مجموعه‌ای 13 قسمتی و 49 دقیقه‌ای از شورت است که با HUNTER/X Backstage Pass شروع می‌شود، که رومی، میرا و زویی را دنبال می‌کند که با بت‌های رقیب و سرایداران شیطان می‌جنگند، با بلوک نویسنده مواجه می‌شوند، در شرایط اضطراری مد عکسبرداری می‌کنند. قسمت‌های جایزه همچنین شامل نسخه‌های اسباب‌بازی انیمیشن استاپ‌موشن از شخصیت‌های فیلم است که برخی از بزرگترین لحظات فیلم اصلی را بازی می‌کنند و بازی‌های تعاملی متمرکز بر زندگی شخصیت‌ها در پشت صحنه. همچنین یک بسته 9 قسمتی از ویدیوهای رقص وجود دارد که کمتر از 30 دقیقه طول می‌کشد که شامل گروه دخترانه Kpop متحرک HUNTR/X می‌شود که در حال تمرین رقص برای How Its Done با رقصی است که در فیلم دیده نمی‌شود، و همچنین یک ویدیو اجرای رقص اکشن زنده از آهنگ. طرفداران همچنین می‌توانند ویدیوهای رقص کامل و زنده برای Golden، Takedown، Soda Pop و Your Idol را تماشا کنند، که در آن طراحان رقص لیجونگ لی، نیل و کی‌تایگرز چگونگی و چرایی حرکت میرا، رومی و زوئی را به شیوه‌ای که انجام می‌دهند توضیح می‌دهند. این انیمیشن پرطرفدار که در سال 2025 در نتفلیکس عرضه شد، رکورد 325 میلیون بار پخش شده و همچنین در سینماهای سراسر جهان به نمایش درآمده است و تهیه کنندگان تایید کرده اند که دنباله ای بر پربیننده ترین عنوان این استریمر در تمام دوران ها در افق است. در حالی که در حال حاضر جزئیاتی در دسترس نیست، کارگردانان مگی کانگ", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2254686935-e1793884937395.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۱۴ آبان • ۱۷:۳۰"}, {"source": "Billboard", "title": "2026 CMA Awards Announce Kacey Musgraves, Ella Langley, Tim McGraw & More Performers, Plus Dolly Parton Tribute", "link": "https://www.billboard.com/music/awards/cma-awards-performers-2026-kacey-musgraves-tim-mcgraw-dolly-1236374456/", "summary": "The upcoming 60th annual CMA Awards performer lineup is set to include a string of hitmakers, fan favorites, and a newly minted Country Music Hall of Famer. The first round of CMA Awards performers includes Kacey Musgraves , Cody Johnson , Miranda Lambert , The Red Clay Strays, Zach Top and Tucker Wetmore, as well as Ella Langley, whose Choosin Texas has dominated the all-genre Billboard Hot 100 this year. The initial performer lineup reveal also features Tim McGraw, who was just inducted into the Country Music Hall of Fame last month. Related Inside the Plans to Celebrate the CMA Awards at 60: We Have to Meet Fans Where They Are As Final-Round Voting Opens Today for the 2026 CMA Awards, Here Are the Races We’re Watching Ella Langley Leads Nominations for 2026 CMA Awards: Full List The CMAs will also pay tribute to late Country Music Hall of Fame member Dolly Parton, who died in August. Reigning CMA entertainer of the year Lainey Wilson will host the CMA Awards for a third consecutive year. The awards show will air live from Nashville s Bridgestone Arena on Wednesday, Nov. 18, on ABC and Disney+ and will be available the following day on Hulu. Langley leads this year s nominees with nine nods, including entertainer, album ( Dandelion ), female vocalist, musical event and music video of the year, as well as two nominations for single and song of the year. Johnson, the reigning CMA male vocalist of the year, is up for four CMA Awards trophies, including entertainer, male vocalist, single and music video of the year. Lambert has seven nominations this year, among them two for single of the year and her 19th nomination for female vocalist of the year (with 70 career nominations, Lambert also holds the record for the most CMA Awards nominations by a female artist). Musgraves has five nominations heading into the awards ceremony, among them album ( Middle of Nowhere ), female vocalist and song of the year. The Red Clay Strays are the reigning vocal group of the year and look to retain their title this year. Zach Top, the reigning new artist of the year, is nominated twice heading into this year s awards ceremony, including male vocalist of the year and album of the year ( Ain t In It for My Health ). Wetmore picks up his second CMA Awards nomination this year in the new artist of the year category. Last year s CMA Awards winners also included Wilson taking home album of the year for Whirlwind , Langley and Riley Green s You Look Like You Love Me earning song and", "date_str": "2026-11-05T14:00:00+00:00", "hash": "9907d996dcf7876e", "title_fa": "جوایز CMA 2026 کیسی ماسگریوز، الا لنگلی، تیم مک‌گرو و هنرمندان دیگر، به علاوه ادای احترام به دالی پارتون را اعلام کرد.", "summary_fa": "شصتمین سالانه نوازندگان جوایز CMA قرار است شامل مجموعه‌ای از هیت‌سازان، علاقه‌مندان به علاقه‌مندان، و تالار مشاهیر موسیقی کانتری باشد. اولین دور از اجراکنندگان جوایز CMA شامل کیسی ماسگریوز، کودی جانسون، میراندا لمبرت، رد رسی استریز، زک تاپ و تاکر وتمور و همچنین الا لنگلی است که Choosin Texas او امسال در همه ژانر Billboard Hot 100 تسلط داشته است. در فاش شدن ترکیب اولیه مجریان، تیم مک گرو نیز حضور دارد که ماه گذشته به تالار مشاهیر موسیقی کانتری راه یافت. مربوط به برنامه های مربوط به جشن گرفتن جوایز CMA در 60 سالگی: ما باید با طرفداران در جایی که هستند ملاقات کنیم، همانطور که رای گیری دور نهایی امروز برای جوایز CMA 2026 باز می شود، در اینجا مسابقه هایی است که در حال تماشای آن هستیم الا لنگلی نامزدهای اصلی جوایز CMA 2026: لیست کامل CMA ها از اعضای کانتری که به عضویت Hall Dollte نیز پرداخت خواهند کرد. در ماه اوت درگذشت. لاینی ویلسون، هنرمند برتر سال CMA، برای سومین سال متوالی میزبان جوایز CMA خواهد بود. نمایش جوایز در روز چهارشنبه، 18 نوامبر، از شبکه ABC و Disney+ به صورت زنده از ورزشگاه بریجستون نشویل پخش خواهد شد و روز بعد در Hulu در دسترس خواهد بود. لنگلی با 9 نوبت، از جمله خواننده، آلبوم (قاصدک)، خواننده زن، رویداد موزیکال و موزیک ویدیوی سال، و همچنین دو نامزدی برای تک آهنگ و آهنگ سال، پیشتاز نامزدهای امسال است. جانسون، خواننده مرد سال CMA، برای چهار جایزه جایزه CMA، از جمله خواننده، خواننده مرد، تک‌آهنگ و موزیک ویدیوی سال رقابت می‌کند. لمبرت امسال هفت نامزدی دارد، از جمله دو نامزدی برای تک آهنگ سال و نوزدهمین نامزدی او برای خواننده زن سال (با 70 نامزدی حرفه ای، لمبرت همچنین رکورد بیشترین نامزدی جوایز CMA توسط یک هنرمند زن را دارد). ماسگریوز پنج نامزدی برای حضور", "image_url": "https://www.billboard.com/wp-content/uploads/2026/04/2271973110-e1777478704457.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۷:۳۰"}, {"source": "Billboard", "title": "Cristian Castro Signs With Enso Music for Management: ‘Chance to Build Something Truly Historic’", "link": "https://www.billboard.com/pro/cristian-castro-management-deal-jorge-juarez-enso-music/", "summary": "Cristian Castro , who was recently honored with a Billboard Lifetime Achievement Award , has signed a management deal with Enso Music, Billboard can exclusively announce on Thursday (Nov. 5). The new partnership opens a new chapter in the celebrated career of the Mexican pop icon, now under the guidance of renowned Latin music executive Jorge Juárez . Related Cristian Castro Accepts the Billboard Lifetime Achievement Award In the Name of Romantic Love Carín León s Manager Jorge Juárez on the Significant Cultural Moment of History-Making Sphere Shows Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 “Cristian is one of the most important and recognizable artists in Latin music, with a voice and a catalog that have transcended generations and borders,” Juárez, CEO of Enso Music, said in a statement. “It’s a privilege to begin this new chapter together and to welcome, here at Enso Music, an artist with such a rich history who is also experiencing an extraordinary moment in his career. We share a vision of continuing to build, to grow, and to take his music to new stages and audiences around the world.” Meanwhile, Castro celebrated his arrival at the company and expressed being “deeply grateful” for the trust that Juárez and his team have placed in him for the next chapter of his career, which includes a new album slated for 2027 and the continuation of his Nada Solo Éxitos Tour, which began on Sept. 11 in Las Vegas and will run through March 2027. Some opportunities go far beyond a signature. They represent hope, excitement, dreams and the chance to build something truly historic, an unrepeatable mark along the way, he said. Thank you for believing in me, opening doors for me and making me feel wanted and cared for. My commitment is to give my very best, work with passion and rise to the occasion. Thank you for making this joy possible today. On the horizon, I see great achievements and many successes we’ll share together.” With more than 12 million albums sold, Castro, who has established himself as one of the defining voices of Latin pop and romantic music, began his Billboard chart journey in 1992 when “No Podrás” became his first entry on Hot Latin Songs, peaking at No. 3. His debut album, Agua Nueva , reached No. 2 on the Top Latin Pop Albums chart in January 1993, and since then, he has earned six No. 1s on Hot Latin Songs, including “Nunca Voy a Olvidarte,” “Amor” and “Azul,” which spent four, 11 and nine weeks at the ", "date_str": "2026-11-05T14:00:00+00:00", "hash": "2d100aef1b449fe7", "title_fa": "کریستین کاسترو با موسیقی Enso برای مدیریت امضا می‌کند: «شانس برای ساختن چیزی واقعاً تاریخی»", "summary_fa": "کریستین کاسترو، که اخیراً با جایزه یک عمر دستاورد بیلبورد مفتخر شد، قرارداد مدیریتی با Enso Music امضا کرده است، بیلبورد می تواند به طور انحصاری در روز پنجشنبه (5 نوامبر) اعلام کند. این همکاری جدید فصل جدیدی را در حرفه مشهور نماد پاپ مکزیکی باز می کند که اکنون تحت هدایت مدیر اجرایی مشهور موسیقی لاتین خورخه خوارز است. مرتبط: کریستین کاسترو جایزه یک عمر دستاورد بیلبورد را به نام عشق رمانتیک می پذیرد. مدیر کارین لئون، خورخه خوارز در لحظه فرهنگی مهم حوزه تاریخ ساز، کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران موسیقی Big Deal، یکی از مهمترین بنیانگذاران موسیقی است. خوارز، مدیرعامل Enso Music، در بیانیه ای گفت: هنرمندان قابل تشخیص در موسیقی لاتین، با صدا و کاتالوگ که از نسل ها و مرزها فراتر رفته است. این یک افتخار است که این فصل جدید را با هم شروع کنیم و در انسو موزیک به هنرمندی با چنین تاریخ غنی که لحظه‌ای خارق‌العاده را در کار خود تجربه می‌کند، خوش آمد بگویم. ما دیدگاهی مشترک برای ادامه ساختن، رشد و بردن موسیقی او به صحنه ها و مخاطبان جدید در سراسر جهان داریم.» در همین حال، کاسترو ورود خود را به این شرکت جشن گرفت و ابراز \"عمقاً سپاسگزار\" کرد به خاطر اعتمادی که خوارز و تیمش به او برای فصل بعدی حرفه‌اش، که شامل آلبوم جدیدی برای سال 2027 و ادامه تور Nada Solo Éxitos است، که از 2 سپتامبر و 10 مارس در لاس وگاس آغاز شد، به او داده اند. برخی فرصت ها بسیار فراتر از یک امضا هستند. او گفت که آنها نشان دهنده امید، هیجان، رویاها و فرصتی برای ساختن چیزی واقعاً تاریخی هستند، علامتی تکرار نشدنی در طول مسیر. ممنونم که به من ایمان داشتی، درها را به روی من باز کردی و باعث شدی احساس کنم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Jorge-Juarez-Cristian-Castro-2026-cr-socios-music-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۴ آبان • ۱۷:۳۰"}, {"source": "Deadline", "title": "Oscar Micheaux Film And Media Institute To Launch Theatrical Roadshow Program For Independent Filmmakers", "link": "https://deadline.com/2026/11/oscar-micheaux-institute-theatrical-roadshow-1237214171/", "summary": "EXCLUSIVE: Noel Braham, founder of the Oscar Micheaux Film and Media Institute, has set plans to launch The Micheaux Roadshow 2027, a touring theatrical program for independent features and short films. The Roadshow will take indie filmmakers across the country for screenings of their work. The Roadshow will begin in Los Angeles in April 2027 [ ]", "date_str": "2026-11-05T14:50:09+00:00", "hash": "fa86f24eafe6a970", "title_fa": "موسسه فیلم و رسانه اسکار میشو برنامه نمایش جاده ای تئاتر را برای فیلمسازان مستقل راه اندازی می کند", "summary_fa": "اختصاصی: نوئل براهام، مؤسس مؤسسه فیلم و رسانه اسکار میشه، برنامه‌هایی را برای راه‌اندازی The Micheaux Roadshow 2027، برنامه‌ای تئاتری برای فیلم‌های بلند مستقل و کوتاه، تنظیم کرده است. Roadshow فیلمسازان مستقل را در سراسر کشور برای نمایش آثارشان خواهد برد. Roadshow در آوریل 2027 در لس آنجلس آغاز خواهد شد [ ] Roadshow طرح خود را از شبکه توزیع مستقل خود Micheaux گرفته است. بین سال‌های 1919 تا 1948، میشو بیش از 40 فیلم را کاملاً خارج از سیستم استودیویی نوشت، تولید، کارگردانی و توزیع کرد، آثارش را با قطار حمل می‌کرد، صاحبان تئاتر را شخصاً به میدان می‌فرستاد و خودش آثارش را در برابر تماشاگران قرار می‌داد. در کشوری هنوز جدا از هم، او صاحبان تئاترهای سفیدپوست را، حتی در جنوب، متقاعد کرد که فیلم‌هایش را اجرا کنند و برای تماشاگران سیاه‌پوست مراسم ویژه و نمایش‌های نیمه‌شبی ترتیب دهند. اخبار مرتبط جفری رایت در مورد اینکه چرا به W.E.B s Rita Coburn پیوست. Du Bois Doc Rebel With A Cause Festivals Travelers Hell تریلر: مهیج زن محور هانا آلومایر با پشتوانه MBC زمینه تازه ای را برای سینمای عربستان سعودی ایجاد می کند «اسکار میشو فقط یک فیلمساز نبود، او بنیانگذار و کارآفرینی بود که مستقیماً قدرت برداشت براهام را به مردم می گفت». «Roadshow چیزی را به فیلمسازان می دهد که الگوریتم نمی تواند آن را انجام دهد: اتاقی پر از مردمی که با هم کارشان را تماشا می کنند.» Watch on Deadline The Roadshow نشان‌دهنده راه‌اندازی نرم موسسه Micheaux است که به طور رسمی در سال 2028 افتتاح می‌شود. این موسسه همچنین خانه جشنواره فیلم Micheaux است که در سال 2018 تأسیس شد.", "image_url": "https://deadline.com/wp-content/upl     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);

      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {

        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {

        return;

      container.innerHTML = sortedItems.map((item, idx) => {

        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
