یک باتری 12 ولتی"}],
      media: [{"source": "Billboard", "title": "The Future of the Country Music Association: Sarah Trahern & Brittany Schaffer Give First Joint Interview in CEO ‘Evolution’", "link": "https://www.billboard.com/pro/cma-ceo-sarah-trahern-brittany-schaffer-interview/", "summary": "Brittany Schaffer formally joins the Country Music Association Tuesday (Sept. 8) as Sarah Trahern ’s successor as CEO, but the two executives have been working on the transition ever since Schaffer was announced in her new role in July. “Sarah and I have had a mentorship and friendship for many years,” Schaffer tells Billboard , in the pair’s first joint interview. “It has been remarkable to watch how she has opened her arms and her mind for me, sharing not just what we re doing or decisions that are coming up, but also being able to help me unpack and understand how we got to this place or what the history of decisions has been. I love the analogy of don’t remove a fence until you know why it was there in the first place.” Now, the two will spend the next three months prior to Trahern’s Dec. 31 exit working side by side before Schaffer, who has been on the CMA board of directors for five-and-a-half years, officially assumes the CEO role Jan. 1, 2027. “When I started in 2014, there was an interim person in the CEO job, so there were some things that I didn t get to experience til they actually happened,” Trahern says. “And so, one of the gifts that I hope Brittany and I are jointly giving the organization is this peaceful transition time.” The pair are now divvying up responsibilities as they go into the next three months. “There are the things that Sarah will continue to take the lead on that I can sit alongside of her and learn,” Schaffer says. And then [there] are the things that are a little more future looking that I will pretty immediately be jumping in on as we think about what does the future of CMA look like.” Trahern continues to take the lead on the 60 th anniversary of the CMA Awards, which will take place Nov. 18 with Lainey Wilson returning as host for the third time. And Schaffer is now the main point person on CMA Fest’s move to the new Nissan Stadium for next June’s event. Trahern has taken the project to this point, but says, “Brittany needs to be making those decisions [going forward], because I want to just be sitting in the stands and cheering it on next June.” Each step of Schaffer’s background provides crucial experience that she will take into different facets of the CEO job. As an attorney at Loeb Loeb for more than a decade, she has experience with contracts and rights flow. “I think it gives me a more complete understanding of how this ecosystem works together,” she says. That includes inheriting a new deal between the CMA and Di", "date_str": "2026-09-08T14:00:00+00:00", "hash": "47598d9c482cf171baed1d0ac796e0ee0630dfd375b098682313372d04a6ea73", "title_fa": "انجمن موسیقی آینده کانتری: سارا تراهرن و بریتنی شفر اولین مصاحبه مشترک خود را با مدیرعامل «Evolution» انجام دادند.", "summary_fa": "بریتنی شفر به طور رسمی سه شنبه (8 سپتامبر) به عنوان جانشین سارا تراهرن به عنوان مدیر عامل به انجمن موسیقی کانتری می پیوندد، اما این دو مدیر اجرایی از زمانی که شفر در نقش جدیدش در جولای معرفی شد، روی این انتقال کار می کنند. شفر در اولین مصاحبه مشترک این زوج به بیلبورد می‌گوید: «من و سارا سال‌ها است که یک مربی و دوستی داشته‌ایم. تماشای این که چگونه او آغوش و ذهنش را برای من باز کرده است و نه تنها کارهایی که ما انجام می‌دهیم یا تصمیماتی که در راه است را به اشتراک می‌گذارد، بلکه می‌تواند به من کمک کند تا چمدان‌ها را باز کنم و بفهمم چگونه به این مکان رسیدیم یا تاریخچه تصمیم‌گیری‌ها چگونه بوده است، بسیار جالب است. اکنون، این دو سه ماه آینده را قبل از دسامبر Trahern سپری خواهند کرد. 31 قبل از اینکه شفر، که پنج سال و نیم در هیئت مدیره CMA بوده، در 1 ژانویه 2027 رسماً نقش مدیر عامل را بر عهده بگیرد، کنار هم از کار خارج شود. و بنابراین، یکی از هدایایی که امیدوارم بریتنی و من به طور مشترک به سازمان بدهیم، این دوران گذار صلح آمیز است. این زوج اکنون در حال تقسیم مسئولیت ها در سه ماه آینده هستند. شفر می‌گوید: «چیزهایی وجود دارد که سارا به رهبری آنها ادامه خواهد داد و من می‌توانم در کنار او بنشینم و یاد بگیرم. و سپس چیزهایی وجود دارند که کمی بیشتر به آینده نگاه می کنند که من بلافاصله به آنها می پردازم زیرا ما به آینده CMA فکر می کنیم. Trahern همچنان در شصتمین سالگرد جوایز CMA که در 18 نوامبر با حضور لینی ویلسون به عنوان میزبان برای سومین بار برگزار می شود، رهبری می کند. و شفر اکنون فرد اصلی در انتقال CMA Fest به ورزشگاه جدید نیسان برای"}, {"source": "Billboard", "title": "Stevie Wonder Hitting the Road for 18-Date ‘Songs in the Key of Life’ 50th Anniversary Tour: See Dates", "link": "https://www.billboard.com/music/rb-hip-hop/stevie-wonder-songs-in-key-of-life-50th-anniversary-tour-dates-1236335566/", "summary": "Stevie Wonder is hitting the road this fall to mark the 50th anniversary of one of his most beloved, critically acclaimed studio albums. The singer announced on Tuesday morning (Sept. 8) that he will celebrate his 1976 Songs in the Key of Life LP on the 18-date outing slated to kick off on Oct. 13 at the Utilita Arena in Birmingham, U.K. The tour will then hit Paris, Copenhagen, Oslo, Stockholm, Hannover, Cologne, Amsterdam, Dublin, London, Manchester and Glasgow before heading back to the U.S. for a run of winter shows at Madison Square Garden in New York on Nov. 19, followed by gigs in Chicago, Washington, D.C. and Detroit before winding down with a show at the Intuit Dome in Los Angeles on Dec. 19. According to an Instagram post announcing the gigs, tickets for the special run of international stops will go on sale with a presale slated to begin on Wednesday (Sept. 9), followed by a general -on sale on Friday (Sept. 11) at 10 a.m. local time. A general on-sale for the U.S. shows (except Detroit), is set for Thursday (Sept. 10) at 10 a.m. local time through Ticketmaster . The Detroit shows will go on sale on Sept. 15 at 10 a.m. local time. Songs in the Key of Life , Wonder s 18th studio LP, was released on Sept. 28, 1976 and as a double-album with a four-track bonus EP and debuted at No. 1 on the Billboard 200 album chart. It spun off two Billboard Hot 100 No. 1 singles in I Wish and Sir Duke and won Album of the Year at the 1977 Grammy Awards. In addition to those two singles, the album features such classics as the opening track, Love s in Need of Love Today, Isn t She Lovely and Pastime Paradise, with the latter the source for Coolio s 1995 hit Gangsta s Paradise. According to a press release, Wonder, 76, will perform the entire album on the tour. At a time when the world continues to search for connection, healing and joy, the messages at the heart of Songs in the Key of Life feel as urgent and necessary today as they did in 1976, read the release. Songs like As, Love s in Need of Love Today, Sir Duke and Isn t She Lovely remain woven into the emotional fabric of generations around the world, reminding audiences not only where they ve been, but who they are. Back in June, Wonder performed a short set at the opening of former President Barack Obama s Presidential Center in Chicago, performing All I Do and Signed, Sealed,Delivered I m Yours with the Roots, as well Higher Ground with an all-star group of fellow performers including Bruce Springsteen, Je", "date_str": "2026-09-08T13:00:32+00:00", "hash": "4e93774ce3506824bbcdb6a9895867fdf8bcf8dbc157128ba2d3a5d519be5c39", "title_fa": "تور پنجاهمین سالگرد «Songs in the Key of Life» 18-Date Stevie Wonder در جاده: دیدن تاریخ ها", "summary_fa": "استیوی واندر در پاییز امسال به مناسبت پنجاهمین سالگرد یکی از محبوب‌ترین آلبوم‌های استودیویی که مورد تحسین منتقدان قرار گرفت، وارد جاده می‌شود. این خواننده صبح روز سه‌شنبه (8 سپتامبر) اعلام کرد که آهنگ‌های 1976 خود را در LP کلیدی زندگی در هجده‌تاریخ خروجی که قرار است در تاریخ 13 اکتبر در Utilita Arena در بیرمنگام بریتانیا آغاز شود جشن خواهد گرفت. تور سپس در پاریس، کپنهاگ، اسلو، آموور، لندن، استکهلم، هان‌بلی، آموور، استکهلم، لندن، کپنهاگ، اسلو، آموور کلم، دولوگ برگزار خواهد شد. گلاسکو قبل از بازگشت به ایالات متحده برای اجرای برنامه‌های زمستانی در مدیسون اسکوئر گاردن در نیویورک در 19 نوامبر، و سپس کنسرت‌هایی در شیکاگو، واشنگتن، دی سی و دیترویت پیش از پایان با نمایشی در Intuit Dome در لس‌آنجلس در 19 دسامبر. طبق پست اینستاگرامی که کنسرت‌ها را اعلام می‌کند، بلیت‌ها برای اجرای ویژه نمایشگاه‌های بین‌المللی با توقف‌های پیش‌فروش از چهارشنبه آغاز می‌شود. به دنبال آن یک فروش عمومی در روز جمعه (11 سپتامبر) در ساعت 10 صبح به وقت محلی. فروش عمومی برای ایالات متحده نمایش‌ها (به جز دیترویت)، برای پنجشنبه (10 سپتامبر) ساعت 10 صبح به وقت محلی از طریق Ticketmaster تنظیم شده است. نمایش های دیترویت از 15 سپتامبر ساعت 10 صبح به وقت محلی به فروش می رسد. Songs in the Key of Life، هجدهمین LP استودیو Wonder، در 28 سپتامبر 1976 و به عنوان یک آلبوم دوتایی با یک EP جایزه چهار تراک منتشر شد و در رتبه اول جدول آلبوم بیلبورد 200 قرار گرفت. دو تک آهنگ بیلبورد داغ 100 شماره 1 در I Wish و Sir Duke و برنده آلبوم سال در جوایز گرمی 1977 شد. علاوه بر این دو تک‌آهنگ، این آلبوم دارای آثار کلاسیکی مانند آهنگ آغازین، Love s in Need of Love Today، Isn t She Lovely و Pastime Paradise است، که دومی منبع آهنگ 1995"}, {"source": "Billboard", "title": "Yuridia Announces Las Cartas Sobre La Mesa Tour 2027 in the U.S.: Here Are the Dates", "link": "https://www.billboard.com/music/latin/yuridia-las-cartas-sobre-la-mesa-tour-2027-us-dates-1236335455/", "summary": "Yuridia , dubbed the queen of regional Mexican music, is bringing her Las Cartas Sobre La Mesa Tour to the United States in early 2027, Billboard can exclusively announce on Tuesday (Sept. 8). Related Yuridia Makes History at Estadio GNP Seguros: Women Sell Tickets Too Macklemore Faces Petition to Leave Ed Sheeran Tour After Free Palestine Plea Second Festivalgoer Death Reported at Burning Man 2026 Promoted by Live Nation, the 18-date tour will begin on Feb. 4 at the Paramount Theatre in Seattle and wrap up on March 28 at The Theater at MGM National Harbor in Washington, D.C. Along the way, the singer will also perform in cities like Las Vegas, Houston, Dallas, Chicago and New York. “What I enjoy most about touring in the U.S. is traveling by bus. I really love spending time with the musicians and dancers. I also bring my family, my kids, and I’m very happy discovering different cities,” Yuridia tells Billboard Español . “The shows are always different, there are always surprises, and it’s so much fun. I’m very excited to experience that again.” The announcement comes after the Sonora-born artist made history as the first Mexican to sell out two consecutive dates at Estadio GNP Seguros in Mexico City on Sept. 3 and 4. Yuridia s Las Cartas Sobre La Mesa Tour follows her Sin Llorar Tour, during which she visited more than 80 cities across Mexico, Central America, the U.S. and Canada between 2024 and 2025. Ticket presales begin today (Sept. 8) at 12 p.m. local time, while general sales kick off on Sept. 11 at 10 a.m. local time via LiveNation.com . Recognized as one of the most prominent female voices in Mexican regional music, the 39-year-old singer — born in Hermosillo, Sonora, and raised in Arizona — rose to fame in 2005 by participating in the second season of Mexico s reality show La Academia before debuting as a solo artist with her album La Voz de un Ángel . Throughout her career, she has released 10 studio albums, achieved multiple diamond, platinum and gold certifications, and sold over three million records in Mexico and Latin America. On the Billboard charts, she has placed hits like “Qué Agonía” with Ángela Aguilar, which entered the top 10 of Latin Airplay , as well as “Mi Eterno Amor Secreto” with Edén Muñoz and “Un Bendito Día” with Alejandro Fernández, both of which reached No. 1 on Regional Mexican Airplay . Her latest single, “Que Se Vaya,” released on Aug. 20, offers a first glimpse of her upcoming studio album and will be included in her s", "date_str": "2026-09-08T13:00:00+00:00", "hash": "bebf450a3103dc33f4d04d20ba2dcf69ac632d830e085813571eb5878c58521b", "title_fa": "یوریدیا تور Las Cartas Sobre La Mesa 2027 در ایالات متحده را اعلام می کند: تاریخ ها اینجا هستند", "summary_fa": "یوریدیا که ملکه موسیقی منطقه ای مکزیک لقب گرفته است، تور Las Cartas Sobre La Mesa خود را در اوایل سال 2027 به ایالات متحده می آورد، بیلبورد می تواند به طور انحصاری در روز سه شنبه (8 سپتامبر) اعلام کند. یوریدیای مرتبط در Estadio GNP Seguros تاریخ می‌سازد: زنان بیش از حد بلیت می‌فروشند، مکلمور با درخواست ترک تور اد شیران پس از اعلام مرگ فلسطینی رایگان دومین فستیوال در Burning Man 2026 که توسط Live Nation تبلیغ می‌شود، تور 18 روزه در فوریه آغاز می‌شود. 4 در تئاتر پارامونت در سیاتل و در 28 مارس در Theater در بندر ملی MGM در واشنگتن دی سی به پایان می رسد. در طول مسیر، خواننده همچنین در شهرهایی مانند لاس وگاس، هیوستون، دالاس، شیکاگو و نیویورک اجرا خواهد کرد. یوریدیا به Billboard Español می گوید: \"چیزی که در مورد تور در ایالات متحده بیشتر از همه لذت می برم، سفر با اتوبوس است. من واقعاً دوست دارم با نوازندگان و رقصنده ها وقت بگذرانم. همچنین خانواده، بچه هایم را نیز آورده ام و از کشف شهرهای مختلف بسیار خوشحالم.\" نمایش‌ها همیشه متفاوت هستند، همیشه شگفتی‌هایی وجود دارد، و این بسیار سرگرم‌کننده است. من بسیار هیجان‌زده هستم که دوباره آن را تجربه کنم.» این اعلامیه پس از آن اعلام شد که این هنرمند متولد سونورا به عنوان اولین مکزیکی که دو تاریخ متوالی را در Estadio GNP Seguros در مکزیکو سیتی در 3 و 4 سپتامبر به فروش رساند، تاریخ را ثبت کرد. تور Las Cartas Sobre La Mesa یوریدیا به دنبال تور Sin Llorar او است که طی آن از بیش از 80 شهر بین آمریکای2 و Candaa در سراسر مکزیک بازدید کرد.20. 2025. پیش فروش بلیت ها از امروز (8 شهریور) ساعت 12 آغاز می شود. به وقت محلی، در حالی که فروش عمومی در 11 سپتامبر در ساعت"}, {"source": "Billboard", "title": "John Legend Announces Pharrell-Produced Album ‘Muse,’ Led by New Song ‘Daylight’", "link": "https://www.billboard.com/music/music-news/john-legend-muse-album-daylight-song-pharrell-1236335492/", "summary": "John Legend and Pharrell Williams made an album in Paris last year that the EGOT artist says is unlike any of his others. Related John Legend to Portray Harry Belafonte in The Road Home Film About Controversy Over Paul Simon s Graceland Album Macklemore Faces Petition to Leave Ed Sheeran Tour After Free Palestine Plea Second Festivalgoer Death Reported at Burning Man 2026 Muse , set for an Oct. 23 release on Republic Records and written and recorded at Pharrell s studio at Louis Vuitton s headquarters, where he s men s creative director had Legend looking beyond evergreen piano standards and into a Black James Bond aesthetic, but with a modern backbeat at its foundation. You can hear traces of me and traces of him, but it sounds like something new for the both of us. The combination of me and Pharrell, on paper, I think, is a good idea. And the execution is even better, he says of Muse in a press statement released Tuesday (Sept. 8). I think my repertoire has always been very diverse, but the piano-driven ballads have gotten the most traction throughout my career. I wanted to shake up the formula and do something fresh and new, Legend notes of the pair s new project, which calls upon influences like Nina Simone, Nat King Cole and Marvin Gaye. Daylight, the first single from Muse , arrives on streaming services today. Legend previewed the song with a performance from Nashville that was broadcast during CBS American Tailgate the night before. Another album track, “Pray for Ya,” soundtracked Louis Vuitton’s Fall-Winter 2026 Men’s show. Pharrell produced the entire album. He s also a co-writer, and he s a featured artist on six tracks. When Pharrell called me, I thought, let s do this, says Legend, whose guest vocal on the Clipse track The Birds Don t Sing inspired Pharrell who d produced Clipse s 2025 set Let God Sort Em Out to team up with Legend on a full album. A lot of people would have imagined we d done something like this already, but we hadn t. It felt past due. John Legend, Muse Republic Records Just as Legend guested on Clipse s album, Clipse features on the Muse track Bodies on the Floor. Muse s title is in part inspired by the nine Muses in ancient Greek mythology. It s also the name of the record s opening track, which chronicles a tumultuous relationship between a man and his muse against the romantic backdrop of Paris and high art, Tuesday s press release says. The muse of that track is just a character the duo came up with, though Legend adds,", "date_str": "2026-09-08T12:45:00+00:00", "hash": "5922cf442d8e0687c0144747dd747f28530a61aacea4523e95eb89630180f728", "title_fa": "جان لجند آلبوم «Muse» ساخته فارل را به رهبری آهنگ جدید «Daylight» معرفی کرد.", "summary_fa": "جان لجند و فارل ویلیامز سال گذشته آلبومی را در پاریس ساختند که به گفته هنرمند EGOT شبیه هیچ یک از آلبوم های دیگر او نیست. جان لجند مرتبط برای به تصویر کشیدن هری بلافونته در فیلم جاده خانه درباره جنجال بر سر آلبوم گریسلند پل سایمون، مککلمور با درخواست ترک تور اد شیران پس از اعلام مرگ فلسطینی رایگان در دومین فستیوال، مرگ در Burning Man 2026 Muse، که برای یک اکتبر تنظیم می شود، مواجه می شود. در 23 انتشار در Republic Records و نوشته و ضبط شده در استودیوی فارل در دفتر مرکزی لویی ویتون، جایی که مدیر خلاق مردانه او Legend را فراتر از استانداردهای پیانوی همیشه سبز و به زیبایی‌شناسی بلک جیمز باند، اما با یک ضرب‌پشت مدرن در پایه‌های خود داشت. شما می توانید رد پای من و او را بشنوید، اما برای هر دوی ما چیز جدیدی به نظر می رسد. به نظرم ترکیب من و فارل روی کاغذ ایده خوبی است. او در بیانیه مطبوعاتی منتشر شده در روز سه شنبه (8 سپتامبر) در مورد میوز می گوید که اعدام حتی بهتر است. فکر می‌کنم کارنامه من همیشه بسیار متنوع بوده است، اما تصنیف‌های پیانو محور بیشترین جذابیت را در طول دوران حرفه‌ای من داشته‌اند. می‌خواستم فرمول را تغییر دهم و کاری تازه و جدید انجام دهم، یادداشت‌های Legend از پروژه جدید جفت، که از تأثیراتی مانند نینا سیمون، نت کینگ کول و ماروین گی استفاده می‌کند. Daylight، اولین تک‌آهنگ از Muse، امروز وارد سرویس‌های پخش می‌شود. Legend پیش نمایش این آهنگ را با اجرای نشویل انجام داد که شب قبل در CBS American Tailgate پخش شد. یکی دیگر از آهنگ‌های آلبوم، «Pray for Ya»، موسیقی متن نمایش مردانه پاییز و زمستان 2026 لویی ویتون را پخش کرد. فارل کل آلبوم را تولید کرد. او همچنین یکی از نویسندگان است، و او"}, {"source": "Billboard", "title": "Rosanne Cash Postpones Trio of Shows Due to ‘Unexpected Medical Emergency’", "link": "https://www.billboard.com/music/country/rosanne-cash-postpones-three-shows-unexpected-medical-emergency-1236335561/", "summary": "Rosanne Cash is postponing a trio of shows on her current U.S. tour due to what her management team said was an unspecified unexpected medical emergency . According to a statement posted on the 71-year-old singer s Instagram on Monday (Sept. 7), Cash has pushed back planned dates in Sheridan, Wyo. on Tuesday (Sept. 8), as well as Billings, Mont. on Wednesday (Sept. 9) and Bozeman, Mont. on Saturday (Sept. 12). The statement noted that the Grammy-winning eldest daughter of late country icon Johnny Cash is recovering under her doctors supervision, who have recommended a temporary restriction on travel and performing. That restriction has resulted in the postponing of the Wyoming and Montana shows. At press time, the dates for the rescheduled gigs had not been announced yet. Cash has one more scheduled show on her U.S. swing — a Sept.19 show at the Riceland Hall inside A-State Fowler Center in Jonesboro, Ark. — before she is slated to take a brief pause in advance of a short run of European shows slated to kick off on Oct. 15 at the Music Hall Worpswede in Worpswede, Germany. The singer s final scheduled 2026 date is a Nov. 9 stop at the Ryman Auditorium in Nashville. Cash s most recent release is a duet with The National singer Matt Berninger on a cover of the Velvet Underground s Who Loves the Sun, released in March as the opening theme for the Will Forte/D Arcy Carden Hulu crime comedy series Sunny Nights . She recently shared the stage with Judy Collins, Mary Chapin Carpenter, Amanda Shires and Madeleine Peyroux at the Tanglewood Music Festival on Aug. 30 as part of the special Sweet Judy Blue Eyes: Farewell Tour marking Collins final Tanglewood performance.", "date_str": "2026-09-08T12:09:34+00:00", "hash": "6300b1f19c06680ec1e39743fe892950e1c3cb2db79b0071d2f6cedacf983d28", "title_fa": "روزان کش سه نمایش خود را به دلیل \"اورژانس پزشکی غیرمنتظره\" به تعویق انداخت", "summary_fa": "روزان کش در حال به تعویق انداختن اجرای سه نمایش در تور فعلی خود در ایالات متحده است، زیرا تیم مدیریتش گفته است که یک اورژانس پزشکی غیرمنتظره نامشخص است. بر اساس بیانیه ای که روز دوشنبه (7 سپتامبر) در اینستاگرام این خواننده 71 ساله منتشر شد، کش تاریخ های برنامه ریزی شده در شریدان، ویو در روز سه شنبه (8 سپتامبر) و همچنین بیلینگز، مونت را به تعویق انداخت. در روز چهارشنبه (9 سپتامبر) و Bozeman، Mont. روز شنبه (12 سپتامبر). در این بیانیه اشاره شده است که دختر بزرگ جانی کش، نماد فقید کشور، برنده جایزه گرمی، تحت نظر پزشکان او که محدودیت موقتی برای سفر و اجرا توصیه کرده‌اند، در حال بهبودی است. این محدودیت منجر به به تعویق افتادن نمایش های وایومینگ و مونتانا شده است. در زمان انتشار، تاریخ برگزاری کنسرت های مجدد اعلام نشده بود. کش یک برنامه برنامه ریزی شده دیگر در ایالات متحده دارد. swing - نمایشی در 19 سپتامبر در سالن رایس لند در مرکز A-State Fowler در جونزبورو، آرک. - قبل از اینکه او قرار است قبل از اجرای برنامه کوتاهی از نمایش های اروپایی که قرار است در 15 اکتبر در تالار موسیقی Worpswede در Worpswede، آلمان آغاز شود، یک مکث کوتاه داشته باشد. آخرین تاریخ برنامه ریزی شده خواننده برای سال 2026، توقف در 9 نوامبر در سالن رایمن در نشویل است. جدیدترین نسخه‌ی Cash یک دونوازی با مت برنینگر، خواننده ملی، روی جلد Velvet Undergrounds Who Loves the Sun است که در ماه مارس به عنوان تم آغازین سریال کمدی جنایی ویل فورته/دی آرسی کاردن هولو، Sunny Nights منتشر شد. او اخیراً با جودی کالینز، مری چاپین کارپنتر، آماندا شایر و مادلین پیرو در جشنواره موسیقی تانگلوود در ماه آگوست روی صحنه رفت. 30 به عنوان بخشی از تور ویژه Sweet Judy Blue Eyes: Farewell Tour که"}, {"source": "Billboard", "title": "BLACKPINK’s JISOO to Star as 4 Different ‘Cinematic Characters’ in Conceptual Fashion Campaign", "link": "https://www.billboard.com/music/music-news/blackpink-jisoo-self-portrait-short-film-series-1236334491/", "summary": "As part of BLACKPINK , JISOO is one of four. Now, the same goes for her latest campaign with fashion house Self-Portrait, in which she s set to star as a quartet of cinematic characters in a series of short films, which Billboard can exclusively announce. Related From BLACKPINK s LISA JISOO to Miley, Beyoncé More, Which New Music Release Is Your Favorite? Vote! JISOO Cuts a Lonely Figure as a Theme Park Cyborg With a Heart In ‘CLICK’ Music Video: Watch Jisoo Is the First Musician to Be the Face of This London Fashion House: See the Photos The campaign begins with JISOO who in 2024 became the first musician to be the face of the London fashion house in The Enigma, the first of the four videos. Shot in the style of an audition tape by Oliver Hadlee Pearch, it shows the performer modeling Self-Portrait s faux leather skirt and checkered knit blazer, appearing bubbly and confident in herself in front of the camera. Maybe we re not supposed to have everything figured out, JISOO muses in the clip. I always liked wandering. For the partnership, JISOO worked closely with the brand s founder and creative director, Han Chong. In a statement, the K-pop star said, I was so excited to star in this new series of short films it allowed me to try something completely new, and each character I played required something different from me. The evolution of the character s wardrobe was how I found the nuance in each performance, and it was a real collaboration with Han and I on finding the subtlety in each role I was going to be playing, she continued. I have worn Self-Portrait for many years, and the pieces make me feel like I can do anything this time, they let me dream that I could be anyone. Chong also praised the global star in a statement. Having worked with JISOO for a few years now, she really has become a big part of our brand s story and fabric. For this latest project together, we wanted to do something that meets JISOO where she is today; an incredible artist with range and a chameleonic edge as a performer, he said. We always talk about the Self-Portrait woman as being multifaceted, and JISOO really brings that to life through her performance in these short films. JISOO s latest fashion campaign comes as she s embarking on a new solo era musically. On Friday (Sept. 4), she released single Click. Watch JISOO s first of four Self-Portrait films below.", "date_str": "2026-09-08T11:45:00+00:00", "hash": "1099ca8baf866c0ea82e39c60a43e91a3eb4745fc4f453896c2f3b9273ba7c0f", "title_fa": "JISOO از BLACKPINK به عنوان 4 شخصیت مختلف سینمایی در کمپین مد مفهومی بازی می کند", "summary_fa": "به عنوان بخشی از BLACKPINK، JISOO یکی از چهار مورد است. در حال حاضر، همین امر در مورد آخرین کمپین او با خانه مد Self-Portrait نیز صدق می کند، که در آن او قرار است در نقش چهارگانه ای از شخصیت های سینمایی در مجموعه ای از فیلم های کوتاه، که بیلبورد می تواند به طور انحصاری اعلام کند، بازی کند. مرتبط از LISA JISOO از BLACKPINK تا Miley, Beyonce More، کدام نسخه جدید موسیقی مورد علاقه شماست؟ رای بده JISOO یک چهره تنها را به عنوان یک پارک موضوعی برش می دهد سایبورگ با قلب در موزیک ویدیو «کلیک کنید»: جیسو اولین موزیسینی است که چهره این خانه مد لندن است را تماشا کنید: عکس ها را ببینید این کمپین با JISOO آغاز می شود که در سال 2024 اولین موزیسینی شد که چهره خانه مد لندن در The Enigma، اولین از چهار ویدیو، شد. این فیلم که به سبک نوار تستی توسط الیور هدلی پیرچ گرفته شده است، نشان می‌دهد که مجری در حال مدل‌سازی دامن چرم مصنوعی Self-Portrait و کت بافتنی شطرنجی است و حباب‌دار و با اعتماد به نفس جلوی دوربین ظاهر می‌شود. JISOO در این کلیپ می‌گوید شاید ما قرار نیست همه چیز را بفهمیم. همیشه سرگردانی را دوست داشتم. برای این همکاری، JISOO از نزدیک با بنیانگذار و مدیر خلاق برند، هان چونگ، کار کرد. در بیانیه ای، ستاره کی پاپ گفت، من برای بازی در این سری جدید از فیلم های کوتاه آنقدر هیجان زده بودم که به من اجازه داد تا چیز کاملا جدیدی را امتحان کنم و هر شخصیتی که بازی می کردم چیز متفاوتی از من می خواست. او ادامه داد: تکامل کمد لباس کاراکتر این بود که چگونه تفاوت‌های ظریف را در هر اجرا پیدا کردم، و این یک همکاری واقعی با من و هان برای یافتن ظرافت در"}, {"source": "Billboard", "title": "Ariana Grande Surprise Releases 12-Track ‘Petal (The Complete Live Album)’", "link": "https://www.billboard.com/music/pop/ariana-grande-surprise-release-petal-complete-live-album-1236335556/", "summary": "Ariana Grande surprise-released a live album on Tuesday morning (Sept. 8) featuring all of the tracks from her most recent petal studio album. petal (The Complete Live Album) was released as an iTunes exclusive and announced in an early morning post from the singer revealing that it features all 12 songs from the studio LP. The album — available here — features live versions of the tracks Kiss Me, Petal, Stay, Oh Well, Big Feelings, Freak and Warning Signs, as well as a version of the LP s lead single, Hate That I Made You Love Me, recorded during a rehearsal for the singer s just-concluded Eternal Sunshine tour. Arianators will also hear live takes on Like I Do, Never Get Over Me, Bad Thing (Bunny Hop) and Nowhere, Nobody. Grande wrapped her Eternal Sunshine tour on Sept. 1 with her final show in London, where she once again made another tweak to her Thank U, Next lyrics in honor of on-again boyfriend Ricky Alvarez. “Wrote some songs about Ricky/ I’m tryna make him my last,” she sang in her latest revamp of the song, adding more fuel to the fiery rumors that she and her ex are potentially rekindling their romance. Ari and Alvarez dated from 2015 to 2016 for about a year, after meeting and working together on Grande’s Honeymoon Tour and it has appeared lately as if they are giving it another shot. Last month, the singer posted several selfies , including ones in which she was cuddling with former backup dancer Alvarez. Grande announced in early August that she s taking a step back from public engagements amid ongoing public scrutiny, including dropping out of her planned co-starring role in the West End revival of Sunday in the Park With George ; her Wicked co-star Jonathan Bailey recently announced that he too is dropping out of the production . Grande released her eighth studio album, petal , in July; the LP debuted atop the Billboard 200 with 295,000 total album-equivalent units earned.", "date_str": "2026-09-08T11:39:18+00:00", "hash": "07c679f07204ff414a49b4288da542fad538e8495d9ad9874fc20e96d6507838", "title_fa": "آریانا گرانده سورپرایز 12 قطعه «گلبرگ (آلبوم زنده کامل)» را منتشر کرد", "summary_fa": "آریانا گرانده صبح روز سه شنبه (8 سپتامبر) یک آلبوم زنده را منتشر کرد که شامل تمام قطعات آخرین آلبوم استودیویی گلبرگ است. petal (آلبوم زنده کامل) به عنوان یک انحصاری آیتونز منتشر شد و در یک پست صبح زود از خواننده اعلام کرد که در آن همه 12 آهنگ استودیو LP وجود دارد. این آلبوم - که در اینجا موجود است - دارای نسخه‌های زنده ترک‌های Kiss Me, Petal, Stay, Oh Well, Big Feelings, Freak و Warning Signs و همچنین نسخه‌ای از تک آهنگ اصلی LP به نام Hate That I Made You Love Me است که در طول تمرین برای تور تازه پایان یافته Eternal Sunshine خواننده ضبط شده است. آریاناتورز همچنین اجرای زنده از Like I Do, Never Get Over Me, Bad Thing (Bunny Hop) و Nowhere, Nobody را خواهد شنید. گرانده تور Eternal Sunshine خود را در سپتامبر به پایان رساند. 1 با آخرین نمایش خود در لندن، جایی که او یک بار دیگر به افتخار دوست پسر دوباره ریکی آلوارز، ترانه‌های تشکر U، Next را تغییر داد. او در جدیدترین بازسازی خود در این آهنگ خواند: «چند آهنگی درباره ریکی نوشت/ سعی می‌کنم او را آخرین بار بسازم»، و به شایعات آتشینی که او و سابقش به طور بالقوه در حال احیای دوباره عاشقانه‌شان هستند، گفت. آری و آلوارز از سال 2015 تا 2016 پس از ملاقات و همکاری در تور ماه عسل گرانده، حدود یک سال با هم قرار داشتند و اخیراً به نظر می رسد که آنها یک بار دیگر به آن سفر می کنند. ماه گذشته، این خواننده چندین سلفی منتشر کرد، از جمله عکس هایی که در آن با رقصنده سابق آلوارز در آغوش گرفته بود. گرانده در اوایل آگوست اعلام کرد که در بحبوحه بررسی‌های مداوم عمومی از مشارکت عمومی عقب‌نشینی می‌کند، از جمله کنار گذاشتن نقش هم‌بازی برنامه‌ریزی‌شده‌اش در"}, {"source": "Billboard", "title": "Billy Joel Mourns Death of Early Bandmate Jon Small", "link": "https://www.billboard.com/music/pop/billy-joel-mourns-death-jon-small-1236335547/", "summary": "Jon Small, the drummer and early Billy Joel bandmate whose musical and personal history with the Piano Man stretched from Long Island rock clubs to one of Joel’s most painful early chapters, has died. Joel announced Small’s death in a tribute shared on social media . Small’s age and cause of death were not known at press time. View this post on Instagram Before Joel became one of pop and rock’s most recognizable singer-songwriters, he and Small played together in the Hassles, a Long Island band that released two albums in the late 1960s. The pair later formed Attila, a hard-rock duo built around drums and organ, releasing a self-titled album in 1970. Their partnership ended abruptly after Joel fell in love with Small’s wife, Elizabeth Weber, while Joel was living with the couple. The episode — long part of Joel’s lore — is revisited in the recent documentary And So It Goes , where both men reflected on the fallout with striking candor. “Elizabeth was very important to me, but I think I was not the guy she hoped I would be,” Small said in the documentary. “I kept seeing that Billy was not the same guy. Something was the matter. And Billy one day came up to me, became a little honest, and said to me, ‘I’m in love with your wife.’ So it was a very devastating thing for me, because these were basically my two best friends.” Joel also addressed the affair in the film, saying, “I felt very, very guilty about it. They had a child. I felt like a homewrecker. I was just in love with a woman, and I got punched in the nose, which I deserved. Jon was very upset. I was very upset.” The affair led to Attila’s breakup and temporarily ended Joel and Small’s friendship. Joel later married Weber in 1973; the couple divorced in 1982. Despite the rupture, Small and Joel eventually reconciled. In And So It Goes , Small said he came to understand the pain Joel carried from hurting him. “He never really said anything to me,” Small said. “The only practical answer I can give as to why Billy took it so hard was because he loved me that much and that it killed him to hurt me that much. Eventually I forgave him.” Small later worked behind the camera on several Joel projects, including the concert films Live From Long Island and Live at Shea Stadium . He also directed Joel’s “Baby Grand” video and went on to direct music videos for Reba McEntire, Enrique Iglesias and Brooks Dunn. Small’s death comes as Joel’s early years have been revisited through And So It Goes , which traces the s", "date_str": "2026-09-08T09:23:28+00:00", "hash": "b02222f61651c18d4c89c7ff69ef18906326ff6bf8dfc7ce02092aeb776635ce", "title_fa": "بیلی جوئل عزادار مرگ همکار اولیه جان اسمال است", "summary_fa": "جان اسمال، درامر و هم گروه اولیه بیلی جوئل که سابقه موسیقی و شخصی او با پیانو من از کلوپ های راک لانگ آیلند تا یکی از دردناک ترین فصل های اولیه جوئل امتداد داشت، درگذشت. جوئل در ادای احترامی که در رسانه های اجتماعی به اشتراک گذاشته شد، مرگ اسمال را اعلام کرد. سن اسمال و علت مرگ او در زمان انتشار مشخص نبود. این پست را در اینستاگرام مشاهده کنید قبل از اینکه جوئل به یکی از شناخته شده ترین خواننده ها و ترانه سرایان پاپ و راک تبدیل شود، او و اسمال با هم در هاسلز، گروهی از لانگ آیلند که در اواخر دهه 1960 دو آلبوم منتشر کرد، بازی کردند. این زوج بعداً آتیلا را تشکیل دادند، یک گروه دوتایی هارد راک که بر پایه درام و ارگ ساخته شده بود، و آلبومی به نام خود را در سال 1970 منتشر کردند. شراکت آنها به طور ناگهانی پس از عاشق شدن جوئل به همسر اسمال، الیزابت وبر، در زمانی که جوئل با این زوج زندگی می کرد، پایان یافت. این اپیزود - بخشی طولانی از افسانه جوئل - در مستند اخیر And So It Goes مورد بازبینی قرار می گیرد، جایی که هر دو مرد با صراحتی چشمگیر در مورد این اتفاق نظر داشتند. اسمال در این مستند گفت: «الیزابت برای من بسیار مهم بود، اما فکر می‌کنم من آن مردی نبودم که او امیدوار بود باشم. من مدام می دیدم که بیلی همان مرد نیست. و بیلی یک روز پیش من آمد، کمی صادق شد و به من گفت: \"من عاشق همسرت هستم.\" بنابراین این برای من بسیار ویران کننده بود، زیرا این دو اساساً دو دوست صمیمی من بودند.\" جوئل همچنین در این فیلم به این ماجرا پرداخت و گفت: «در این مورد احساس گناه کردم. آنها صاحب یک فرزند شدند. احساس می کردم"}, {"source": "Billboard", "title": "Ginger & Baby Spice Reveal Secret Former Spice Girl Who ‘the Others Still Won’t Talk to’ in Ad for This Coffee Brand", "link": "https://www.billboard.com/music/music-news/spice-girls-reveal-secret-member-pumpkin-spice-dunkin-ad-1236334452/", "summary": "The Spice Girls , but make it pumpkin. In a hilarious new commercial for Dunkin , Ginger Spice and Baby Spice reunite to help usher in the brand s fall flavors while revealing that there s a band member fans don t know about, played by Rachel Dratch. Related Spice Girls Melanie C Talks Victoria Beckham s Absence From Wedding, Her Little Chat With Emma Bunton About Wearing White Spice Girls (Mostly) Reunite For Melanie C s Wedding to Chris Dingwall The Spice Girls 1997: Shakey Graves Joins the Greatest Pop Stars Podcast to Talk One of the Best One-Year Takeovers in Pop History Premiering on Tuesday (Sept. 8), the ad finds Geri Halliwell-Horner and Emma Bunton seated for a mock documentary-style interview, during which Baby Spice reveals: A lot of people don t know we originally had a sixth member. That member s stage name? Pumpkin Spice. Dressed in a puffy orange getup, Dratch sips on a pumpkin-flavored iced latte while recalling her fictional favorite songs from her short-lived girl group career. Don t Squash My Love, Walk Through My Pumpkin Patch,' she listed off. My favorite? Bumpin Pumpkins.' I left the band to focus on lattes, Dratch, aka Pumpkin Spice, adds in an exaggerated British accent. We were devastated, Halliwell-Horner says before playfully referencing absent members Victoria Beckham, Mel B and Mel C. The others still won t talk to her. The clip comes as Dunkin welcomes its autumnal offerings back to the menu, including pumpkin spice, pie and patch latte flavors as well as pumpkin bakery treats. In a statement, Dratch said of the campaign, I think Pumpkin Spice was just ahead of her time. Maybe a little too seasonal, but definitely ahead of the curve,” the SNL alum continued jokingly. “She left to focus on lattes, and honestly, I respect that kind of commitment. Getting to bring Pumpkin Spice back with Emma and Geri for Dunkin’ was so much fun. It feels like she’s finally getting the recognition she deserves. As for Bunton, the seasonal flavor reminds her of some special memories shared with loved ones. The first time I tried a pumpkin spice latte was with my family in New York, which is probably why I love it so much, she tells Billboard , noting that it s also her go-to drink. It really is autumn in a cup! When it comes to Halliwell-Horner, she may be starring in a Dunkin ad, but her beverage of choice is a little more British, though the sweet pastries do speak to her. If I m feeling ravenous, I could go for a full dozen, she shares. I alwa", "date_str": "2026-09-08T09:00:00+00:00", "hash": "55b00b3a41dbb6efc2620175983a5bd39b930d0e6cf97507723b578278448bef", "title_fa": "زنجبیل و بچه ادویه راز سابق دختر ادویه ای را که «دیگران هنوز با او صحبت نمی کنند» در تبلیغ این برند قهوه فاش می کنند.", "summary_fa": "Spice Girls، اما آن را کدو تنبل درست کنید. در یک تبلیغ خنده دار جدید برای Dunkin، Ginger Spice و Baby Spice دوباره با هم متحد می شوند تا به معرفی طعم پاییزی این برند کمک کنند و در عین حال فاش کنند که طرفداران یک گروه از آن اطلاعی ندارند، با بازی Rachel Dratch. Spice Girls مرتبط ملانی سی صحبت می کند غیبت ویکتوریا بکهام از عروسی، گفتگوی کوچک او با اما بانتون درباره پوشیدن White Spice Girls (عمدتا) دوباره برای ازدواج ملانی سی با کریس دینگوال. نمایش تاریخ سه شنبه (سپتامبر. 8)، در این آگهی، گری هالیول-هورنر و اما بانتون برای یک مصاحبه ساختگی به سبک مستند نشسته اند، که طی آن بیبی اسپایس نشان می دهد: بسیاری از مردم نمی دانند که ما در ابتدا عضو ششم داشتیم. نام صحنه آن عضو؟ ادویه کدو تنبل. درچ با لباس نارنجی پف کرده، یک لاته سرد با طعم کدو تنبل می خورد و آهنگ های تخیلی مورد علاقه خود را از دوران کوتاه زندگی خود در گروه دخترانه به یاد می آورد. او لیست کرد. مورد علاقه من؟ کدو تنبل بامپین. من گروه را ترک کردم تا روی لاته تمرکز کنم، دراچ، با نام مستعار Pumpkin Spice، با لهجه اغراق آمیز بریتانیایی اضافه می کند. هالیول-هورنر قبل از اشاره بازیگوشانه به اعضای غایب ویکتوریا بکهام، مل بی و مل سی می گوید ما ویران شده بودیم. بقیه هنوز با او صحبت نمی کنند. این کلیپ در حالی منتشر می‌شود که دانکین از پیشنهادات پاییزی خود به منو استقبال می‌کند، از جمله ادویه کدو تنبل، پای و پچ لاته و همچنین خوراکی‌های شیرینی کدو حلوایی. دراچ در بیانیه‌ای درباره این کمپین گفت، فکر می‌کنم Pumpkin Spice از زمان خود جلوتر بود. ممکن است کمی بیش از حد فصلی باشد، اما قطعاً جلوتر از منحنی‌ها.» آلوم SNL به شوخی ادامه داد."}, {"source": "Billboard", "title": "Australian Crawl and Men at Work Expand 2026 Australian Tour", "link": "https://www.billboard.com/music/concerts/australian-crawl-men-at-work-2026-australian-run-1236335544/", "summary": "Australian Crawl and Men at Work have added two new co-headline shows to their 2026 Australian run, following strong demand for their previously announced Red Hot Summer Tour dates. The new concerts are set for Friday, Nov. 20, at Brisbane’s Riverstage and Sunday, Nov. 22, at Melbourne’s Sidney Myer Music Bowl. The two bands will be joined at the newly announced shows by Vika Linda and Boom Crash Opera. The additions follow a run of sold-out dates across the Red Hot Summer Tour, including stops at Sandstone Point, Berry, Manly, the Hunter Valley, Coolangatta, Mornington and Swan Valley. Shows in Toowoomba, Ballarat and Glenelg are also selling fast, according to the announcement. Presales for the newly announced Brisbane and Melbourne concerts begin Wednesday, Sept. 9, at 10 a.m. local time via Red Hot Summer Tour and Face to Face Touring. General onsale begins Thursday, Sept. 10, at ury کانادا در حال تقویت تیم خلاق خود است. سازنده اسرار مرداک، ناتالین رودریگز، مدیر سابق محتوای راجرز را برای نقش معاون استخدام کرده و سوزان الکساندر را به همان سطح ارتقا داده است. هر دو مدیر، معاون، محتوای خلاق هستند، که دومی از سمت مدیر ارشد خود ارتقا یافته است. رودریگز در برنامه های پربیننده شفتسبری در [ ] کار خواهد کرد."}, {"source": "Deadline", "title": "John Turturro To Receive Zurich Film Festival’s Golden Eye Award", "link": "https://deadline.com/2026/09/john-turturro-zurich-film-festival-golden-eye-award-1237070723/", "summary": "John Turturro is set to receive the Golden Eye Award at the Zurich Film Festival, which kicks off later this month. The Emmy award-winning actor-writer-director will be feted for his performance in The Only Living Pickpocket in New York, written and directed by Noah Segan. Turturro will touch down in Zurich to accept the award in [ ]", "date_str": "2026-09-08T13:00:00+00:00", "hash": "40af8f23205579f1b24da5a5c93d9a983609cd3755493eccd7efe3d5bb99f3b3", "title_fa": "جان تورتورو جایزه چشم طلایی جشنواره فیلم زوریخ را دریافت کرد", "summary_fa": "جان تورتورو قرار است جایزه چشم طلایی جشنواره فیلم زوریخ را که اواخر این ماه آغاز می شود، دریافت کند. بازیگر-نویسنده-کارگردان برنده جایزه امی برای بازی در فیلم The Only Living Pick Pocket در نیویورک به نویسندگی و کارگردانی نوآ سیگان تقدیر خواهد شد. تورتورو در زوریخ پایین می آید تا جایزه را در [ ] بپذیرد."}, {"source": "Deadline", "title": "Casey Affleck On ‘Company’: “I Was Responding In Part To Raging Conflicts In The World, And To Things Inside Myself” — Venice", "link": "https://deadline.com/2026/09/casey-affleck-company-response-conflicts-inside-myself-1237070694/", "summary": "Casey Affleck‘s Venice Film Festival Competition drama Company is launching on the Lido today. Affleck was flanked at the film s press conference by Adelaide Clemens, Scoot McNairy, Emily Alyn Lind, actress-producer Caylee Cowan Affleck s partner and 85 year-old screen legend Nick Nolte. Affleck told the assembled journalists that actor Ben Mendelsohn, who also stars in the [ ]", "date_str": "2026-09-08T12:41:03+00:00", "hash": "1286715b36bcc7db5e52315f3ae7cbe90353e1de83f06f208501a145f713c78d", "title_fa": "کیسی افلک در \"شرکت\": \"من تا حدی به درگیری های شدید در جهان و چیزهای درون خودم پاسخ می دادم\" - ونیز", "summary_fa": "شرکت درام مسابقه ای جشنواره فیلم ونیز به کارگردانی کیسی افلک امروز در لیدو راه اندازی می شود. افلک در کنفرانس مطبوعاتی فیلم توسط آدلاید کلمنز، اسکوت مک‌نیری، امیلی آلین لیند، شریک بازیگر و تهیه کننده کیلی کوان افلک و اسطوره 85 ساله سینما، نیک نولته، همراهی شد. افلک به خبرنگاران جمع آوری شده گفت که بن مندلسون بازیگر، که در []"}, {"source": "Deadline", "title": "Tom Jones Claims He Has Been Fired From ‘The Voice UK’ Because Of “Financial Difficulty”", "link": "https://deadline.com/2026/09/tom-jones-fired-the-voice-uk-itv-financial-difficulty-1237070725/", "summary": "Sir Tom Jones is known for his booming baritone voice — and he has certainly used it to call out ITV s decision to fire him from The Voice UK. In a statement posted on Instagram, the Welsh singer alleged that he was removed from his coaching role on The Voice because of a financial difficulty [ ]", "date_str": "2026-09-08T12:30:04+00:00", "hash": "8d88a8866ecf32402ec9102e72cbba925469d34445d7cf361feb7a7ab640777c", "title_fa": "تام جونز مدعی است که به دلیل «مشکلات مالی» از «The Voice UK» اخراج شده است.", "summary_fa": "سر تام جونز به خاطر صدای باریتون پررونق خود شناخته شده است - و او مطمئناً از آن برای فراخوانی تصمیم ITV برای اخراج او از The Voice UK استفاده کرده است. در بیانیه ای که در اینستاگرام منتشر شد، خواننده ولزی ادعا کرد که به دلیل مشکلات مالی از نقش مربیگری خود در The Voice حذف شده است [ ]"}, {"source": "Deadline", "title": "‘Musk’ Review: World’s Richest Man, And His Digital Avatar, Thrashed In Damning Alex Gibney Doc – Venice Film Festival", "link": "https://deadline.com/2026/09/musk-review-venice-film-festival-1237070698/", "summary": "What sort of billionaire criticizes another billionaire for giving tons of money to charity? The same kind of billionaire who would gleefully gut USAID, calling it a “criminal organization,” a move that has cost hundreds of thousands of lives, according to multiple estimates. What kind of entrepreneur falsely claims to have founded Tesla, when it [ ]", "date_str": "2026-09-08T12:05:00+00:00", "hash": "c965e57eb265bfc7ca0826a42763fc724f0d0f9d5bbc4dcb37944f4d29145cda", "title_fa": "نقد و بررسی «ماسک»: ثروتمندترین مرد جهان و آواتار دیجیتالی او، فیلم لعنتی الکس گیبنی - جشنواره فیلم ونیز", "summary_fa": "چه نوع میلیاردی از میلیاردر دیگر به خاطر دادن هزاران پول به خیریه انتقاد می کند؟ همان نوع میلیاردری که با خوشحالی USAID را از بین می برد و آن را \"سازمان جنایتکار\" می خواند، حرکتی که بر اساس تخمین های متعدد، جان صدها هزار نفر را به همراه داشته است. چه نوع کارآفرینی به دروغ ادعا می کند که تسلا را تاسیس کرده است، در حالی که [ ]"}, {"source": "Netflix NL", "title": "Makers Harlan Coben-serie vieren feest na Netflix-onthulling", "link": "https://www.netflix-nederland.nl/makers-harlan-coben-serie-vieren-feest-na-netflix-onthulling/", "summary": "Ha, we hebben er weer eentje! Een nieuwtje over I Will Find You van Harlan Coben. Want tromgeroffel jawel, die thrillerserie heeft opnieuw (alwéér) een record gebroken. Het houdt maar niet op! I Will Find You Op 18 juni 2026 kwam I Will Find You uit op Netflix en sindsdien heeft de Harlan Coben maar liefst 117,5 miljoen weergaven ( views ) verzameld, waarmee de serie momenteel de nummer zes is in de lijst met bestbekeken Netflix-shows óóit. Sterker nog: I Will Find You is minder dan twee miljoen weergaven verwijderd van seizoen 2 van Wednesday. De nieuwste serie van Harlan Coben stond tien weken in de (wereldwijde) top 10 met meest bekeken sseries. De laatste week van augustus was de eerste keer dat I Will Find You buiten die toplijst viel. Als de komende weken genoeg Netflix-kijkers inschakelen, zou I Will Find You seizoen 2 van Wednesday moeten kunnen passeren op de Netflix Top 10. Momenteel staat I Will Find You dus op de zesde plaats in de Netflix-top 10 aller tijden, achter seizoen 1 en 2 van Wednesday, Adolescence en de laatste twee seizoenen van Stranger Things. Squid Game, dat de eerste drie plaatsen bezet op de Netflix-top 10 met niet-Engelstalige series, is officieel de grootste Netflix-release aller tijden. Toch een tweede seizoen? Nu (door de populariteit) rijst natuurlijk de vraag: komt er niet tóch een tweede seizoen van I Will Find You. Het antwoord is helaas (waarschijnlijk) nee . De serie is immers gebaseerd op de gelijknamige thriller van Harlan Coben, en die is door de schrijver geschreven als een zelfstandige thriller en niet als het begin van een reeks. Op zijn officiële website wordt het boek ook expliciet omschreven als een stand-alone novel . Coben kreeg onlangs wél de vraag of hoofdpersonage David Burroughs ooit nog terugkeert, maar zijn antwoord was probably not (hoogstwaarschijnlijk niet). De schrijver legde uit dat hij zijn verhalen (voor Netflix-series of gewoon boeken) inricht met het idee dat het verhaal in één keer wordt afgerond. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Makers Harlan Coben-serie vieren feest na Netflix-onthulling appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-08T11:23:04+00:00", "hash": "2e057cf7aede117a96503656f604cd0821d040a57526fb6a75c15ff54f46b426", "title_fa": "سازندگان سریال هارلان کوبن پس از افشای نتفلیکس جشن گرفتند", "summary_fa": "ها، ما یکی دیگر داریم! کمی از اخبار در مورد من تو را پیدا خواهم کرد توسط هارلان کوبن. از آنجا که درام رول بله، آن سریال هیجان انگیز رکوردی را شکست (باز هم). فقط تمام نمی شود! I Will Find You در 18 ژوئن 2026، I Will Find You در نتفلیکس منتشر شد و از آن زمان هارلان کوبن کمتر از 117.5 میلیون بازدید جمع آوری کرده است، و این سریال در حال حاضر رتبه ششم را در لیست پربیننده ترین نمایش های نتفلیکس تا به حال ساخته است. در واقع، I Will Find You کمتر از دو میلیون بازدید از فصل دوم چهارشنبه دارد. آخرین سریال هارلان کوبن ده هفته را در لیست 10 سریال برتر (در سراسر جهان) گذراند. هفته آخر آگوست اولین باری بود که I Will Find You از آن لیست برتر خارج شد. اگر تعداد زیادی بیننده نتفلیکس در هفته‌های آتی به آن توجه کنند، فصل دوم I Will Find You می‌تواند از روز چهارشنبه در 10 تاپ برتر نتفلیکس پیشی بگیرد. بنابراین من شما را پیدا خواهم کرد در حال حاضر در رده ششم 10 برتر نتفلیکس پس از فصل های 1 و 2 چهارشنبه، نوجوانی و دو فصل آخر Stranger Things قرار دارد. Squid Game که سه جایگاه اول را در 10 سریال برتر غیرانگلیسی نتفلیکس به خود اختصاص داده است، رسما بزرگترین نسخه نتفلیکس در تمام دوران است. بالاخره فصل دوم؟ حالا (به دلیل محبوبیتش) طبیعتا این سوال پیش می آید که آیا بالاخره فصل دوم سریال I Will Find You وجود نخواهد داشت؟ پاسخ متأسفانه (احتمالا) خیر است. به هر حال، این سریال بر اساس فیلم هیجان انگیزی به همین نام اثر هارلان کوبن ساخته شده است که توسط نویسنده به عنوان یک تریلر مستقل نوشته شده است و نه به عنوان شروع یک سریال. در وب سایت رسمی آن،"}, {"source": "Netflix NL", "title": "Verliefd op irritante buurjongen in nieuwe romcom", "link": "https://www.netflix-nederland.nl/verliefd-op-irritante-buurjongen-in-nieuwe-romcom/", "summary": "Zwijmelen geblazen! Op Netflix! Binnenkort! De streamingdienst werkt op dit moment aan een nieuw zwijmelfestijn , een romantische tienerfilm gebaseerd op een populair boek (Better Than the Movies van Lynn Painter). Nieuw zwijmelfestijn op Netflix Better Than the Movies is een romantische coming-of-agefilm, gebaseerd op de gelijknamige bestseller van Lynn Painter. Het verhaal draait om Liz Buxbaum, een tiener die is opgegroeid met romantische komedies en ervan overtuigd is dat haar eigen liefdesleven uiteindelijk net zo magisch zal worden als in haar favoriete films. Liz heeft al jarenlang een crush op Michael, de jongen die vroeger bij haar in de buurt woonde. Wanneer hij terugkeert naar de stad, ziet ze dat als haar kans om eindelijk haar droomromance werkelijkheid te laten worden. Alleen is het niet zo eenvoudig om zijn aandacht te trekken. Daarom besluit ze samen te werken met Wes Bennett, haar irritante buurjongen met wie ze al sinds hun jeugd een soort haat-liefdeverhouding heeft. Wes kent Michael goed en kan haar helpen om dichter bij hem te komen. Terwijl Liz en Wes allerlei plannen bedenken om Michael voor haar te winnen, brengen ze steeds meer tijd met elkaar door. Hun gekibbel en plagerijen samen zorgen ervoor dat Liz langzaam anders naar Wes begint te kijken. Ze moet ontdekken of de perfecte liefde waar ze altijd van droomde wel hetzelfde is als de liefde die daadwerkelijk bij haar past. Better Than the Movies Better Than the Movies is gebaseerd op het gelijknamige boek van de Amerikaanse schrijfster Lynn Painter. De roman verscheen in 2021 en werd héél snel een populaire youngadult-romcom, vooral dankzij BookTok. Er is ook een vervolg op het boek verschenen, getiteld Nothing Like the Movies (2024), dus er is ruimte voor een tweede film. Beatrice Kitsos speelt Liz en David Iacono vertolkt de rol van Wes. Het slechte nieuws: er wordt op dit moment gefilmd, maar dat betekent óók dat we nog wel even geduld moeten hebben. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Verliefd op irritante buurjongen in nieuwe romcom appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-08T11:03:42+00:00", "hash": "b2d091443fd0b409a64f6213c2defd58ee918acf174a5a9498872f63c9fb13e2", "title_fa": "عاشق پسر مزاحم همسایه در رامکام جدید", "summary_fa": "غمگینی! در نتفلیکس! به زودی! سرویس استریم در حال حاضر در حال کار بر روی یک فستیوال جدید، یک فیلم عاشقانه نوجوانان است که بر اساس یک کتاب محبوب (بهتر از فیلم‌های لین پینتر) ساخته شده است. فستیوال جدید در نتفلیکس، بهتر از فیلم‌ها، فیلمی عاشقانه در دوران بلوغ است که بر اساس پرفروش‌ترین اثر لین پینتر به همین نام ساخته شده است. داستان در مورد لیز باکسبام، نوجوانی است که در کمدی های رمانتیک بزرگ شده است و متقاعد شده است که زندگی عاشقانه خود در نهایت مانند فیلم های مورد علاقه اش     let currentTab = 'persian';
    let searchQuery = '';

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const items = data[currentTab] || [];
      const filtered = items.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = filtered.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card">
            <div class="news-header">
              <span class="news-num">${num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
