-training beats Claude Opus 5, GPT-6.1 Sol on specialized task benchmarks", "link": "https://venturebeat.com/technology/nvidias-new-open-nemotron-3-5-super-vl-with-post-training-beats-claude-opus-5-gpt-6-1-sol-on-specialized-task-benchmarks", "summary": "An enterprise agent reviewing a credit agreement may need to extract figures from tables, interpret a chart, check a related webpage and apply the company’s own rules before it can produce a useful answer. Read more", "date_str": "2026-10-15T15:00:00+00:00", "hash": "a5080105c0228a22", "title_fa": "Nemotron 3.5 Super VL جدید و باز NVIDIA با پس از آموزش، Claude Opus 5، GPT-6.1 Sol را در معیارهای وظایف تخصصی شکست می دهد.", "summary_fa": "یک نماینده سازمانی که یک قرارداد اعتباری را بررسی می‌کند، ممکن است نیاز به استخراج ارقام از جداول، تفسیر یک نمودار، بررسی یک صفحه وب مرتبط و اعمال قوانین خود شرکت قبل از اینکه بتواند پاسخ مفیدی بدهد، داشته باشد. ادامه مطلب"}, {"source": "Ars Technica", "title": "The Surface Laptop Ultra delivers on most of Microsoft's promises", "link": "https://arstechnica.com/reviews/2026/10/the-surface-laptop-ultra-delivers-on-most-of-microsofts-promises/", "summary": "Over the past week, the laptop Microsoft sent me has been summarizing books and movies, generating images from my imagination, and running a 70-billion-parameter AI model that would be a stretch to fit on most laptops. It also played AAA games at a speed and fidelity I would have thought impossible on an ARM system just a year ago. Microsoft wants to sell you one computer for all of your needs, and for once that doesn't feel like total marketing fluff. Mostly. Microsoft is throwing both arms around the new Nvidia RTX Spark platform with the Surface Laptop Ultra—and setting its sights on the would-be MacBook Pro buyer, or as the company called it, \"a high performance audience.\" The bet is that rather than a gaming desktop for fun and a development laptop for work, buyers will pay more for one machine that does both. The Surface Laptop Ultra arrives at a strange time in personal computing. Recent industry numbers showed a 20 percent drop in total PC shipments year over year in the third quarter of 2026. That's not just consumer purchasing either—that's across the board. Between the RAMpocalypse that has exploded consumer prices and an industry fixated on enterprise money, there hasn't been much new hardware to excite PC enthusiasts. Read full article Comments", "date_str": "2026-10-16T12:00:05+00:00", "hash": "e74373a43f96dfb2", "title_fa": "Surface Laptop Ultra به بسیاری از وعده های مایکروسافت عمل می کند", "summary_fa": "در طول هفته گذشته، لپ‌تاپی که مایکروسافت برای من فرستاده بود، کتاب‌ها و فیلم‌ها را خلاصه می‌کرد، تصاویری از تخیل من تولید می‌کرد و یک مدل هوش مصنوعی با پارامتر 70 میلیاردی را اجرا می‌کرد که می‌توان آن را در اکثر لپ‌تاپ‌ها جای داد. همچنین بازی‌های AAA را با سرعت و وفاداری اجرا می‌کرد که من فکر می‌کردم همین یک سال پیش غیرممکن است. مایکروسافت می‌خواهد برای تمام نیازهای شما یک کامپیوتر به شما بفروشد و برای یک بار هم که شده به نظر می‌رسد که کاملاً پرزهای بازاریابی نیست. بیشتر. مایکروسافت با Surface Laptop Ultra، هر دو دست خود را در اطراف پلتفرم جدید Nvidia RTX Spark قرار داده و به خریدار احتمالی مک بوک پرو، یا به قول این شرکت، «مخاطبان با عملکرد بالا» می‌اندیشد. شرط این است که به جای یک دسکتاپ بازی برای سرگرمی و یک لپ‌تاپ توسعه‌دهنده برای کار، خریداران برای دستگاهی که هر دو را انجام می‌دهد، بیشتر هزینه می‌کنند. Surface Laptop Ultra در زمان عجیبی در محاسبات شخصی وارد می شود. ارقام اخیر صنعت، کاهش 20 درصدی در کل محموله های رایانه های شخصی را در سه ماهه سوم سال 2026 نشان می دهد. بین RAMpocalypse که قیمت‌های مصرف‌کننده را منفجر کرده است و صنعتی که بر پول سازمانی متمرکز شده است، سخت‌افزار جدیدی برای هیجان‌انگیز کردن علاقه‌مندان به رایانه‌های شخصی وجود ندارد. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش در هفته گذشته، لپ تاپی که مایکروسافت برای من فرستاده بود، خلاصه کتاب ها و فیلم ها، تولید تصاویر از تخیل من، و اجرای یک مدل هوش مصنوعی با پارامتر 70 میلیاردی را برای مدل های کششی AI در اکثر لپ تاپ ها اجرا می کرد. همچنین بازی‌های AAA را"}, {"source": "Ars Technica", "title": "Rocket Report: FAA eyes more Starbase traffic; India's Skyroot snares US customer", "link": "https://arstechnica.com/space/2026/10/rocket-report-faa-eyes-more-starbase-traffic-indias-skyroot-snares-us-customer/", "summary": "Welcome to Edition 9.15 of the Rocket Report! The launch I'm most looking forward to in the next few weeks is that of Japan's Martian Moons Exploration (MMX) mission. MMX is one of the marquee space science missions launching this year, and it's set to leave Earth as soon as Monday (US time) aboard a Japanese H3 rocket. The spacecraft will visit Phobos and Deimos, the two asteroid-like moons of Mars, deploying a rover and collecting specimens for return to Earth in 2031. Exploration at its finest. As always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar. Reflect Orbital looks to India for launch capacity . California-based Reflect Orbital, the startup attempting to offer sunlight on-demand with in-space mirrors, announced the purchase of two launches Wednesday from Indian launcher Skyroot Aerospace, Payload Space reports . One of the launches will use Skyroot's Vikram-1 rocket, which became the first privately developed Indian rocket to reach orbit in July. The other will fly on an upgraded rocket called the Vikram-1U. Read full article Comments", "date_str": "2026-10-16T11:00:53+00:00", "hash": "9b7a296e361d9183", "title_fa": "گزارش موشک: FAA به ترافیک Starbase بیشتر توجه می کند. Skyroot هند مشتری آمریکایی را به دام انداخت", "summary_fa": "به نسخه 9.15 گزارش موشک خوش آمدید! پرتابی که من بیش از همه منتظر آن در چند هفته آینده هستم، ماموریت کاوش قمرهای مریخی ژاپن (MMX) است. MMX یکی از مأموریت‌های علمی فضایی است که امسال پرتاب می‌شود و قرار است به محض روز دوشنبه (به وقت ایالات متحده) با یک موشک ژاپنی H3 زمین را ترک کند. این فضاپیما از فوبوس و دیموس، دو قمر سیارک مانند مریخ بازدید خواهد کرد و یک مریخ نورد را مستقر کرده و نمونه هایی را برای بازگشت به زمین در سال 2031 جمع آوری خواهد کرد. کاوش در بهترین حالت مثل همیشه، از ارسال‌های خوانندگان استقبال می‌کنیم، و اگر نمی‌خواهید مشکلی را از دست بدهید، لطفاً با استفاده از کادر زیر مشترک شوید (فرم در نسخه‌های دارای AMP سایت ظاهر نمی‌شود). هر گزارش شامل اطلاعاتی در مورد موشک های کوچک، متوسط ​​و سنگین و همچنین نگاهی سریع به سه پرتاب بعدی در تقویم خواهد بود. Reflect Orbital برای ظرفیت پرتاب به هند نگاه می کند. به گزارش پیلود اسپیس، استارت‌آپ Reflect Orbital مستقر در کالیفرنیا، استارت‌آپی که تلاش می‌کند نور خورشید را بر حسب تقاضا با آینه‌های درون فضا ارائه دهد، روز چهارشنبه از خرید دو پرتاب از پرتابگر هندی Skyroot Aerospace خبر داد. یکی از پرتاب‌ها از موشک Vikram-1 Skyroot استفاده می‌کند که اولین موشک هندی توسعه‌یافته خصوصی بود که در ماه جولای به مدار زمین رسید. دیگری با یک موشک ارتقا یافته به نام Vikram-1U پرواز خواهد کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری به نسخه 9.15 گزارش موشک خوش آمدید! پرتابی که من بیش از همه منتظر آن در چند هفته آینده هستم، مأموریت کاوش قمرهای مریخی ژاپن (MMX) است. MMX یکی از مأموریت‌های علمی"}, {"source": "Ars Technica", "title": "Blue Origin is going all in on the New Glenn rocket", "link": "https://arstechnica.com/space/2026/10/blue-origin-is-going-all-in-on-the-new-glenn-rocket/", "summary": "Blue Origin announced a major expansion of its already considerable Florida launch facilities on Friday morning with the intent of eventually flying more than 100 rockets a year from there. The company said it would add two launch pads for the New Glenn rocket, in addition to two already under construction at Cape Canaveral. The company is also investing heavily in a new manufacturing facility that will produce up to 150 upper stages for a larger variant of the New Glenn rocket. The company also plans to procure two additional landing ships to catch and return the first stage of the New Glenn rocket (it currently has one, named Jacklyn ). Finally, Blue Origin said it would add a new customer integration facility, built in conjunction with the US Space Force, that will feature four payload bays to process multiple missions at the same time. Read full article Comments", "date_str": "2026-10-16T10:00:54+00:00", "hash": "db0a93c8271a142a", "title_fa": "Blue Origin در حال ورود به موشک نیو گلن است", "summary_fa": "بلو اوریجین صبح روز جمعه از گسترش گسترده تأسیسات پرتاب قابل توجه خود در فلوریدا خبر داد تا در نهایت بیش از 100 موشک در سال از آنجا به پرواز درآید. این شرکت اعلام کرد که دو سکوی پرتاب را برای موشک نیو گلن اضافه خواهد کرد، علاوه بر این دو سکوی پرتاب در حال ساخت در کیپ کاناورال است. این شرکت همچنین در حال سرمایه گذاری هنگفتی در یک مرکز تولید جدید است که تا 150 مرحله بالایی را برای یک نوع بزرگتر از موشک نیو گلن تولید خواهد کرد. این شرکت همچنین قصد دارد دو کشتی فرود اضافی را برای گرفتن و بازگرداندن مرحله اول موشک نیو گلن (که در حال حاضر یک فروند به نام جکلین دارد) تهیه کند. در نهایت، Blue Origin گفت که یک مرکز ادغام مشتری جدید را اضافه خواهد کرد، که در ارتباط با نیروی فضایی ایالات متحده ساخته شده است، که دارای چهار محفظه بار برای انجام چندین ماموریت به طور همزمان خواهد بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن جهت پیمایش Blue Origin در صبح روز جمعه اعلام کرد که امکانات پرتاب قابل توجه خود در فلوریدا را در صبح جمعه با هدف پرواز بیش از 100 موشک در سال از آنجا گسترش داده است. ایان ریچاردسون، معاون ارشد عملیات بلو اوریجین در به روز رسانی در وب‌سایت این شرکت، امروز صبح نوشت: «این سرمایه‌گذاری‌ها بر یک هدف متمرکز هستند: ایجاد ظرفیت برای پشتیبانی از مأموریت‌های بیشتر، مطمئن‌تر و کارآمدتر». همانطور که به آینده نگاه می کنیم، این زیرساخت برای پشتیبانی از پروازهای متعدد در هفته تا پایان دهه طراحی شده است. تا به امروز، بلو اوریجین حدود 3 میلیارد دلار در تأسیسات و زیرساخت‌های فلوریدا سرمایه‌گذاری کرده است"}, {"source": "Ars Technica", "title": "Googlebook review: Android on a laptop is still Android", "link": "https://arstechnica.com/reviews/2026/10/googlebook-review-android-on-a-laptop-is-still-android/", "summary": "Android was designed for phones, but that hasn't stopped Google from trying to adapt the OS and its apps to larger machines over the years. Googlebooks are just the latest attempt after tablets, Chromebooks, and foldables induced little change in how people interact with Android software. These new Android-powered laptops are designed to pick up where the web-focused ChromeOS left off, offering premium hardware and native support for Android apps. Google sees Googlebooks as an alternative to Windows and macOS, but these platforms are entrenched with decades of software and UI conventions that keep users locked in. Googlebooks have to offer something very special to steal users away from either of the dominant operating systems. For devoted Android phone users, there are some cool things in Googlebook OS, but the Android roots of these machines are impossible to miss. Sometimes it feels like using a Chromebook, and sometimes it feels like using a giant phone. It almost never feels like using a premium laptop, and that's the problem. Read full article Comments", "date_str": "2026-10-16T10:00:32+00:00", "hash": "1fea5257fa2b7a83", "title_fa": "بررسی گوگل بوک: اندروید روی لپ تاپ هنوز اندروید است", "summary_fa": "اندروید برای گوشی‌ها طراحی شده است، اما این امر گوگل را از تلاش برای تطبیق سیستم‌عامل و برنامه‌های آن با ماشین‌های بزرگ‌تر در طول سال‌ها متوقف نکرده است. پس از اینکه تبلت‌ها، کروم‌بوک‌ها و تاشوها تغییرات کمی در نحوه تعامل افراد با نرم‌افزار Android ایجاد کردند، Googlebook‌ها آخرین تلاش هستند. این لپ‌تاپ‌های جدید مجهز به Android طراحی شده‌اند تا از جایی که ChromeOS متمرکز بر وب متوقف شد، ادامه دهند و سخت‌افزار ممتاز و پشتیبانی بومی را برای برنامه‌های Android ارائه دهند. Google Googlebooks را جایگزینی برای Windows و macOS می‌داند، اما این پلتفرم‌ها دارای چندین دهه نرم‌افزار و قراردادهای رابط کاربری هستند که کاربران را در آن قفل نگه می‌دارد. Googlebooks باید چیز بسیار ویژه‌ای را برای ربودن کاربران از هر یک از سیستم‌عامل‌های غالب ارائه دهد. برای کاربران متعهد تلفن های اندرویدی، چیزهای جالبی در سیستم عامل Googlebook وجود دارد، اما ریشه های اندروید این دستگاه ها غیرممکن است که از دست بدهند. گاهی اوقات احساس استفاده از یک کروم بوک و گاهی اوقات شبیه استفاده از یک تلفن غول پیکر است. تقریباً هرگز احساس استفاده از یک لپ‌تاپ پریمیوم را نمی‌دهد و مشکل همین است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید Minimize to nav Android برای تلفن‌ها طراحی شده است، اما این مانع از تلاش Google برای تطبیق سیستم‌عامل و برنامه‌های آن با ماشین‌های بزرگ‌تر در طول سال‌ها نشده است. پس از اینکه تبلت‌ها، کروم‌بوک‌ها و تاشوها تغییرات کمی در نحوه تعامل افراد با نرم‌افزار Android ایجاد کردند، Googlebook‌ها آخرین تلاش هستند. این لپ‌تاپ‌های جدید مجهز به Android طراحی شده‌اند تا از جایی که ChromeOS متمرکز بر وب متوقف شد، ادامه دهند و سخت‌افزار ممتاز و پشتیبانی بومی را برای برنامه‌های Android ارائه دهند."}, {"source": "Ars Technica", "title": "KDE turns 30 with Plasma 6.8, remote upgrades, and an X11 farewell", "link": "https://arstechnica.com/gadgets/2026/10/kde-turns-30-with-plasma-6-8-remote-upgrades-and-an-x11-farewell/", "summary": "Marking the 30th anniversary of software developer KDE on October 14, the company released Plasma 6.8, debuted a movie, and retired Plasma's native X11 session support. The announcement from KDE dubs the new Plasma 6.8 as the \"30th Anniversary Edition\" and describes the update as preparing Plasma for the future. Legacy X11 applications will still function via the XWayland compatibility layer , and KDE applications will also continue supporting X11 under other desktop environments. After 42 years in service, the X11 protocol is losing another major desktop environment. Plasma will fully adopt the Wayland system and put support for starting new X11 sessions in Plasma to bed. Users opting to stay on Plasma 6.7 will keep their existing sessions for now. The move was expected, with GNOME officially dropping X11 sessions by default in 2025 . The new Plasma 6.8 brings many improvements, including increased support for adding window decorations (like shadows and rounded corners) to third-party apps, and a more streamlined Union theming system . Other notable additions include Nvidia triple buffering being enabled by default, Kup backup integration (KDE's backup utility—now integrated into Plasma), and kscreenctl , a command-line utility that allows power users to adjust display configurations. Read full article Comments", "date_str": "2026-10-15T22:21:06+00:00", "hash": "d5477da36ae6dca9", "title_fa": "KDE با پلاسما 6.8، ارتقاء از راه دور و خداحافظی X11 30 ساله شد", "summary_fa": "به مناسبت سی‌امین سالگرد توسعه‌دهنده نرم‌افزار KDE در 14 اکتبر، این شرکت پلاسما 6.8 را منتشر کرد، یک فیلم را عرضه کرد و پشتیبانی جلسه X11 پلاسما را بازنشسته کرد. اعلامیه KDE، پلاسما 6.8 جدید را «نسخه 30 ساله» نامیده و این به‌روزرسانی را به‌عنوان آماده‌سازی پلاسما برای آینده توصیف می‌کند. برنامه‌های قدیمی X11 همچنان از طریق لایه سازگاری XWayland کار می‌کنند، و برنامه‌های KDE همچنین به پشتیبانی از X11 در سایر محیط‌های دسکتاپ ادامه خواهند داد. پس از 42 سال خدمت، پروتکل X11 یکی دیگر از محیط های دسکتاپ اصلی را از دست می دهد. پلاسما به طور کامل سیستم Wayland را پذیرفته و پشتیبانی برای شروع جلسات X11 جدید در پلاسما را در بستر قرار می دهد. کاربرانی که ترجیح می دهند در Plasma 6.7 باقی بمانند، فعلاً جلسات موجود خود را حفظ خواهند کرد. این حرکت مورد انتظار بود و گنوم رسماً جلسات X11 را در سال 2025 به طور پیش فرض حذف کرد. پلاسما 6.8 جدید پیشرفت‌های زیادی را به همراه دارد، از جمله افزایش پشتیبانی برای افزودن تزئینات پنجره (مانند سایه‌ها و گوشه‌های گرد) به برنامه‌های شخص ثالث، و یک سیستم موضوعی اتحادیه کارآمدتر. سایر موارد قابل توجه شامل بافر سه گانه انویدیا است که به طور پیش فرض فعال شده است، یکپارچه سازی پشتیبان گیری Kup (ابزار پشتیبان گیری KDE – اکنون در پلاسما ادغام شده است)، و kscreenctl، یک ابزار خط فرمان که به کاربران قدرتمند امکان می دهد تنظیمات نمایش را تنظیم کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به ناوبری به حداقل برسانید پروژه پلاسما 6.8 را در 14 اکتبر منتشر کرد، یک فیلم را معرفی کرد و پشتیبانی از جلسه X11 مادری پلاسما را بازنشسته کرد. اعلامیه KDE، Plasma 6.8 جدید"}, {"source": "Ars Technica", "title": "Plex now helps sell movie theater tickets", "link": "https://arstechnica.com/gadgets/2026/10/plex-now-helps-sell-movie-theater-tickets/", "summary": "Plex, which made a name for itself by letting users share movies they own, is now helping sell movie theater tickets. The company is looking to monetize its content-discovery capabilities and expand its business beyond its media server software. Plex partnered with Fandango, which has sold movie tickets since 2000, to drive ticket sales from people searching for movies to stream. Per the announcement: Starting today, Plex users in the US will see a Fandango ticketing option on title pages for movies currently playing in theaters, allowing them to click through to Fandango to find showtimes and purchase tickets. The integration also enables direct attribution through Kochava, giving studios and advertisers greater visibility into how campaigns and audience engagement translate into ticket sales. Fandango says it sells tickets for 31,000 movie theater screens in the US. The Plex deal allows it to leverage data from Plex’s streaming service (Plex claims users of the service “make more than 100 million streaming decisions each month”), including \"ratings and cross-platform viewing\" to gain “insight into audience intent,\" the announcement said. Read full article Comments", "date_str": "2026-10-15T21:22:15+00:00", "hash": "61757d44016c1da2", "title_fa": "Plex اکنون به فروش بلیط های سینما کمک می کند", "summary_fa": "Plex که با اجازه دادن به کاربران به اشتراک گذاری فیلم های خود نامی برای خود دست و پا کرد، اکنون به فروش بلیط های سینما کمک می کند. این شرکت به دنبال کسب درآمد از قابلیت های کشف محتوا و گسترش تجارت خود فراتر از نرم افزار سرور رسانه خود است. Plex با Fandango، که از سال 2000 بلیت فیلم فروخته است، شریک شد تا فروش بلیت را از افرادی که در جستجوی فیلم هستند به جریان بیاندازد. طبق اعلامیه: از امروز، کاربران Plex در ایالات متحده یک گزینه خرید بلیت Fandango را در صفحات عنوان فیلم‌هایی که در حال حاضر در سینماها پخش می‌شوند، مشاهده می‌کنند که به آنها امکان می‌دهد برای یافتن زمان نمایش و خرید بلیت به Fandango مراجعه کنند. این ادغام همچنین اسناد مستقیم از طریق Kochava را امکان پذیر می کند و به استودیوها و تبلیغ کنندگان دید بیشتری نسبت به نحوه تبدیل کمپین ها و تعامل مخاطبان به فروش بلیط می دهد. Fandango می گوید برای 31000 سینما در ایالات متحده بلیط می فروشد. در این اطلاعیه آمده است که قرارداد Plex به آن اجازه می دهد تا از داده های سرویس استریم Plex استفاده کند (Plex ادعا می کند کاربران این سرویس «بیش از 100 میلیون تصمیم در مورد پخش جریانی در ماه می گیرند»)، از جمله «رتبه بندی و مشاهده بین پلتفرم» برای به دست آوردن «بینش در مورد هدف مخاطبان». مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید Plex که با اجازه دادن به کاربران به اشتراک گذاری فیلم های خود نامی برای خود ایجاد کرد، اکنون به فروش بلیت های سینما کمک می کند. این شرکت به دنبال کسب درآمد از قابلیت های کشف محتوا و گسترش تجارت خود فراتر از نرم"}, {"source": "Ars Technica", "title": "Hegseth’s dubious low-T screening may flag up to 25 percent of the Army", "link": "https://arstechnica.com/health/2026/10/hegseths-dubious-low-t-screening-may-flag-up-to-25-percent-of-the-army/", "summary": "Up to a quarter of active-duty Army members could receive a low testosterone result from mandatory military screening, despite the true prevalence of the condition likely being a tiny fraction of that figure, according to a study published Thursday in JAMA . The finding adds to concerns that the mandatory screening announced by Defense Secretary Pete Hegseth in July will lead to a cascade of unnecessary medical evaluations for military members. Those evaluations could result in inappropriate testing, inaccurate results and diagnoses, and overtreatment that could cause harm, including infertility. Medical experts, including the Endocrine Society and the American Urological Association (AUA), have recommended against blanket screenings for these reasons. Still, the Pentagon has moved forward with the plans, releasing clinical guidance in September . The JAMA study highlights the reasons why testosterone levels are not measured in men without symptoms—and also offers a glimpse of how many Army members could become ensnared in the clinically dubious screenings. Read full article Comments", "date_str": "2026-10-15T21:09:57+00:00", "hash": "9aabee55dc32498d", "title_fa": "غربالگری کم T مشکوک Hegseth ممکن است تا 25 درصد از ارتش را نشان دهد", "summary_fa": "بر اساس مطالعه‌ای که روز پنجشنبه در JAMA منتشر شد، تا یک چهارم از اعضای فعال ارتش می‌توانند نتیجه تستوسترون پایینی را از غربالگری اجباری نظامی دریافت کنند، علی‌رغم اینکه شیوع واقعی این وضعیت احتمالاً بخش کوچکی از این رقم است. این یافته به نگرانی‌ها اضافه می‌کند که غربالگری اجباری اعلام شده توسط وزیر دفاع پیت هگزت در ماه ژوئیه منجر به مجموعه‌ای از ارزیابی‌های پزشکی غیرضروری برای اعضای ارتش شود. این ارزیابی‌ها می‌تواند منجر به آزمایش‌های نامناسب، نتایج و تشخیص‌های نادرست و درمان بیش از حدی شود که می‌تواند باعث آسیب از جمله ناباروری شود. متخصصان پزشکی، از جمله انجمن غدد درون ریز و انجمن اورولوژی آمریکا (AUA)، به این دلایل توصیه کرده اند که غربالگری های پتو را ممنوع کنید. با این حال، پنتاگون با انتشار دستورالعمل‌های بالینی در ماه سپتامبر، برنامه‌های خود را پیش برده است. مطالعه JAMA دلایلی را نشان می‌دهد که چرا سطح تستوسترون در مردان بدون علائم اندازه‌گیری نمی‌شود - و همچنین نشان می‌دهد که چه تعداد از اعضای ارتش ممکن است در غربالگری‌های مشکوک بالینی گرفتار شوند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید بر اساس مطالعه منتشر شده در JAMA، علیرغم شیوع واقعی این وضعیت احتمالاً کسری ناچیز از این رقم در مطالعه منتشر شده در JAMA، تا یک چهارم اعضای ارتش فعال می توانند نتیجه تستوسترون پایینی را از غربالگری اجباری ارتش دریافت کنند. محققان مرکز تحقیقات زیست پزشکی پنینگتون در لوئیزیانا و موسسه تحقیقاتی ارتش ایالات متحده در پزشکی محیطی در ماساچوست این مطالعه را انجام دادند. محققان داده‌هایی را از یک بررسی بهداشتی بزرگ نظامی که شامل اعضای پنج تأسیسات ارتش ایالات متحده بود، به دست آوردند. داده های نظرسنجی شامل خونگیری صبحگاهی از اعضای نظامی روزه دار بود. نمونه ها"}, {"source": "Ars Technica", "title": "Targeted ads delivered 0-click exploits to install mercenary malware", "link": "https://arstechnica.com/security/2026/10/targeted-ads-delivered-0-click-exploits-to-install-mercenary-malware/", "summary": "Researchers say that mercenary hackers laced ads with zero-click exploits that installed sophisticated malware on the devices of targeted individuals when they did nothing other than load a website or open an installed app. The finding, published Thursday by the University of Toronto’s Citizen Lab, said the incident is likely to be the first confirmation of zero-click mercenary spyware delivered through targeted ads. The attacks, which worked on iOS and Android devices, are particularly pernicious because they work without requiring any interaction from the target and are invisible unless users run special forensic hardware or software. Citizen Lab said it confirmed that AdFection, as it named the campaign, infected 45 devices at international media organization Al Jazeera in 2024 and 2025. A clear warning signal “This investigation should … serve as a clear warning signal to news organizations around the world that they may be being actively targeted via this new threat,” Citizen Lab researchers wrote. “This targeting may happen both in newsrooms and to individual journalists, editors, and other staff members.” Their report went on to say: “The distribution of spyware via targeted ads represents a security risk not only for potential victims but also for states and civil society at large.” Read full article Comments", "date_str": "2026-10-15T20:32:41+00:00", "hash": "a6045de84f216b4d", "title_fa": "تبلیغات هدفمند برای نصب بدافزار مزدور، سوء استفاده‌های 0 کلیکی را ارائه می‌کنند", "summary_fa": "محققان می گویند که هکرهای مزدور تبلیغات را با اکسپلویت های صفر کلیک می کنند که بدافزار پیچیده ای را روی دستگاه های افراد مورد نظر نصب می کنند، زمانی که آنها هیچ کاری جز بارگذاری یک وب سایت یا باز کردن یک برنامه نصب شده انجام نمی دهند. این یافته که روز پنجشنبه توسط آزمایشگاه شهروندی دانشگاه تورنتو منتشر شد، گفت که این حادثه احتمالا اولین تاییدیه جاسوس افزار مزدور با کلیک صفر است که از طریق تبلیغات هدفمند ارائه می شود. حملاتی که بر روی دستگاه‌های iOS و Android کار می‌کردند، به‌ویژه خطرناک هستند، زیرا بدون نیاز به تعامل با هدف کار می‌کنند و نامرئی هستند، مگر اینکه کاربران سخت‌افزار یا نرم‌افزار پزشکی قانونی خاصی را اجرا کنند. Citizen Lab گفت تأیید کرده است که AdFection، همانطور که این کمپین را نامگذاری کرده است، 45 دستگاه را در سازمان رسانه ای بین المللی الجزیره در سال های 2024 و 2025 آلوده کرده است. یک سیگنال هشدار واضح محققان Citizen Lab نوشتند: «این تحقیق باید به عنوان یک سیگنال هشدار روشن برای سازمان‌های خبری در سراسر جهان باشد که ممکن است به طور فعال از طریق این تهدید جدید مورد هدف قرار گیرند». این هدف‌گیری ممکن است هم در اتاق‌های خبر و هم برای روزنامه‌نگاران، سردبیران و سایر کارکنان رخ دهد.» گزارش آنها ادامه داد: \"توزیع نرم افزارهای جاسوسی از طریق تبلیغات هدفمند نشان دهنده یک خطر امنیتی نه تنها برای قربانیان احتمالی بلکه برای ایالت ها و جامعه مدنی به طور کلی است.\" مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید به حداقل رساندن برای پیمایش محققان می گویند که هکرهای مزدور تبلیغات را با سوء استفاده های صفر کلیکی که بدافزار پیچیده را روی دستگاه های افراد مورد نظر نصب"}, {"source": "Ars Technica", "title": "Above the 911? Porsche previews a new mid-engined supercar.", "link": "https://arstechnica.com/cars/2026/10/porsche-previews-its-future-with-mission-s-supercar-concept/", "summary": "Porsche showed us a preview of a new model this afternoon as it unveiled the Mission S concept in New York. It’s a mid-engined sports car that will slot into the Porsche range above the 911 . But this won’t be a limited-run car like the Carrera GT or 918 Spyder—instead it will be a regular production model, part of Porsche’s plan to dig itself out of a financial hole by 2035. Things have been tough for the German automaker of late. Just three years ago its profit margin was the envy of the industry at 18 percent; last year it collapsed to just 1 percent. It has recovered a little since then, and Porsche’s board has a plan to get back to double-digit margins by 2035, called “Sportwagenschmiede '35,” which involves prioritizing “value over volume,” with greater individualization for customers—and the associated higher selling prices that come with it. Note the quad exhausts—will this be powered by a flat-8? Credit: Porsche “We are pursuing a clear plan with our strategy Sportwagenschmiede '35. The ultimate goal is to further strengthen our unique sports car brand–across all model lines and with new, highly desirable models in particularly high-margin segments,” said Porsche Chairman Michael Leiters. Read full article Comments", "date_str": "2026-10-15T20:30:02+00:00", "hash": "84b4cb7697d8edf9", "title_fa": "بالاتر از 911؟ پورشه یک ابرخودروی جدید با موتور وسط را پیش‌نمایش می‌کند.", "summary_fa": "پورشه امروز بعدازظهر هنگام رونمایی از کانسپت Mission S در نیویورک، پیش نمایشی از یک مدل جدید را به ما نشان داد. این یک خودروی اسپرت موتور وسط است که در محدوده پورشه بالاتر از 911 جای می گیرد. اما این یک خودروی محدود مانند Carrera GT یا 918 Spyder نخواهد بود، بلکه یک مدل تولیدی معمولی خواهد بود، بخشی از برنامه پورشه برای بیرون آوردن خود از حفره مالی تا سال 2035. اخیراً اوضاع برای این خودروساز آلمانی سخت بوده است. همین سه سال پیش حاشیه سود آن 18 درصد بود. سال گذشته به تنها 1 درصد سقوط کرد. از آن زمان تا کنون کمی بهبود یافته است و هیئت مدیره پورشه برنامه ای برای بازگشت به حاشیه دو رقمی تا سال 2035 دارد که «Sportwagenschmiede '35» نامیده می شود، که شامل اولویت دادن به «ارزش بر حجم» با شخصی سازی بیشتر برای مشتریان و قیمت های فروش بالاتر مرتبط با آن است. به اگزوزهای چهارگانه توجه کنید - آیا این اگزوز با یک فلت 8 تغذیه می شود؟ اعتبار: پورشه مایکل لیترز، رئیس پورشه، گفت: \"ما در حال دنبال کردن یک برنامه روشن با استراتژی Sportwagenschmiede '35 هستیم. هدف نهایی تقویت بیشتر برند منحصر به فرد خودروهای اسپورت خود در تمام خطوط مدل و با مدل های جدید و بسیار مطلوب در بخش های به خصوص پر حاشیه است.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش پورشه امروز بعدازظهر هنگام رونمایی از مفهوم Mission S در نیویورک پیش نمایشی از یک مدل جدید را به ما نشان داد. این یک خودروی اسپرت موتور وسط است که در محدوده پورشه بالاتر از 911 جای می گیرد. اما این یک خودروی محدود مانند Carrera GT یا 918"}, {"source": "Ars Technica", "title": "What did the Liberty Bell sound like? Science is on the case.", "link": "https://arstechnica.com/science/2026/10/what-did-the-liberty-bell-sound-like-science-is-on-the-case/", "summary": "The Liberty Bell , with its famous crack, hasn't been rung in 180 years, but that hasn't stopped scientists from pondering what the bell might have sounded like when tolling. In honor of the nation's 250th anniversary, researchers at Penn State University have modeled its acoustic properties, drawing on data collected from one of the bell's replicas. The work was first presented at a meeting of the Acoustical Society of America in Philadelphia earlier this year, followed by an article in Physics Today. Historians aren't sure exactly when the Liberty Bell acquired its distinctive crack, just that it occurred sometime between 1817 and 1846. An 1846 account in the Public Ledger described the ringing of the bell on February 23 that year and mentioned that the bell had developed a crack, which someone had attempted to fix by filing the sides down. But it didn't work: The February 23 ringing extended the crack even more, so much so that \"the old Independence Bell ... now hangs in the great steeple irreparably cracked and forever dumb.\" Nobody has heard it ring since. This wasn't the first time the bell had cracked; the rim cracked shortly after it arrived in Philadelphia in 1752, the first time the clapper struck while testing the sound. It was recast by two local foundry workers, John Pass and John Stow, not once but twice, because the first recast produced a sound that one bystander likened to coal scuttles banging together. Read full article Comments", "date_str": "2026-10-15T19:10:03+00:00", "hash": "fb9021f9404df5ae", "title_fa": "صدای زنگ آزادی چگونه بود؟ علم در این مورد است.", "summary_fa": "زنگ آزادی، با ترک معروفش، 180 سال است که نواخته نشده است، اما این امر دانشمندان را از تفکر در مورد صدای زنگ در هنگام نواختن بازنداشته است. به افتخار دویست و پنجاهمین سالگرد این کشور، محققان دانشگاه ایالتی پن، ویژگی‌های صوتی آن را با استفاده از داده‌های جمع‌آوری‌شده از یکی از کپی‌های زنگ، مدل‌سازی کرده‌اند. این کار برای اولین بار در اوایل سال جاری در نشست انجمن آکوستیک آمریکا در فیلادلفیا ارائه شد و پس از آن مقاله ای در Physics Today ارائه شد. مورخان دقیقاً مطمئن نیستند که زنگ آزادی چه زمانی شکاف متمایز خود را به دست آورد، فقط بین سال‌های 1817 و 1846 رخ داده است. گزارشی در سال 1846 در دفتر کل، به صدا در آمدن زنگ در 23 فوریه همان سال اشاره کرد و اشاره کرد که این زنگ یک ترک ایجاد کرده بود، که شخصی سعی کرده بود آن را با پر کردن دو طرف آن برطرف کند. اما کار نکرد: زنگ 23 فوریه این شکاف را بیش از پیش گسترش داد، به طوری که \"زنگ قدیمی استقلال ... اکنون در برج بزرگ آویزان است که به طور جبران ناپذیری ترک خورده و برای همیشه گنگ است.\" از آن زمان هیچکس صدای زنگ آن را نشنیده است. این اولین باری نبود که زنگ می خورد. لبه آن اندکی پس از ورود به فیلادلفیا در سال 1752 ترک خورد، اولین باری که کلاپر هنگام آزمایش صدا ضربه زد. این توسط دو کارگر ریخته‌گری محلی به نام‌های جان پاس و جان استو، نه یک‌بار بلکه دو بار بازسازی شد، زیرا اولین بازنگری صدایی تولید کرد که یکی از تماشاگران آن را به کوبیدن سنگ‌های زغال سنگ تشبیه کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش"}, {"source": "Ars Technica", "title": "Black Sea drone attacks enter NATO country's territorial waters for first time", "link": "https://arstechnica.com/gadgets/2026/10/black-sea-drone-attacks-enter-nato-countrys-territorial-waters-for-first-time/", "summary": "Russian drones are suspected of sinking a cargo ship and leaving chemical tankers ablaze near the Black Sea coasts of Bulgaria and Romania, respectively. The latest attacks mean that at least seven ships have been attacked in the exclusive economic zones of NATO member countries—and even within Romania's territorial waters if Russian involvement is confirmed in the case of the chemical tankers. Such attacks have spurred requests for NATO to redeploy counter-drone systems to provide more protection. In a social media post on October 15, NATO Secretary General Mark Rutte stated that NATO had increased \"counter-drone capabilities\" along the alliance's eastern flank after meeting with the leaders of Bulgaria and Romania. The latest attacks this week occurred within 24 hours between October 14 and October 15, when the two chemical tankers were set afire after Russian drones were detected in Romanian airspace, according to Deutsche Welle . Both ships were sitting at anchor near the mouth of the Sulina canal that connects the Black Sea to the Danube River, which has become a crucial shipping export route for Ukraine, Reuters reported . Read full article Comments", "date_str": "2026-10-15T18:48:11+00:00", "hash": "514793b2f18553aa", "title_fa": "حملات پهپادی دریای سیاه برای اولین بار وارد آب های سرزمینی کشور ناتو شد", "summary_fa": "پهپادهای روسیه مظنون به غرق کردن یک کشتی باری و آتش زدن تانکرهای شیمیایی در نزدیکی سواحل دریای سیاه بلغارستان و رومانی هستند. آخرین حملات به این معنی است که حداقل هفت کشتی در مناطق انحصاری اقتصادی کشورهای عضو ناتو مورد حمله قرار گرفته‌اند - و حتی در داخل آب‌های سرزمینی رومانی در صورتی که دخالت روسیه در مورد نفتکش‌های شیمیایی تایید شود. چنین حملاتی درخواست‌هایی را از ناتو برای استقرار مجدد سامانه‌های ضد پهپاد برای ارائه حفاظت بیشتر تحریک کرده است. مارک روته، دبیرکل ناتو، در پستی در رسانه‌های اجتماعی در 15 اکتبر اعلام کرد که ناتو پس از دیدار با رهبران بلغارستان و رومانی، «قابلیت‌های ضد هواپیماهای بدون سرنشین» را در امتداد جناح شرقی ائتلاف افزایش داده است. به گزارش دویچه وله، آخرین حملات این هفته طی 24 ساعت بین 14 تا 15 اکتبر رخ داد، زمانی که دو نفتکش شیمیایی پس از شناسایی پهپادهای روسی در حریم هوایی رومانی به آتش کشیده شدند. رویترز گزارش داد که هر دو کشتی در نزدیکی دهانه کانال سولینا که دریای سیاه را به رودخانه دانوب متصل می کند، لنگر نشسته بودند، که به یک مسیر صادراتی مهم کشتیرانی برای اوکراین تبدیل شده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید پهپادهای روسی مظنون به غرق کردن یک کشتی باری و سوختن تانکرهای شیمیایی در نزدیکی سواحل دریای سیاه بلغارستان و رومانی هستند. حملات اخیر به این معنی است که حداقل هفت کشتی در مناطق انحصاری اقتصادی کشورهای عضو ناتو مورد حمله قرار گرفته‌اند - و حتی در داخل آب‌های سرزمینی رومانی در صورتی که دخالت روسیه در مورد نفتکش‌های شیمیایی تایید شود."}, {"source": "Ars Technica", "title": "Microplastics in water aren’t inert and make damaging chemicals on their own", "link": "https://arstechnica.com/science/2026/10/microplastics-in-water-arent-inert-and-make-damaging-chemicals-on-their-own/", "summary": "One reason plastics are used so often is that they’re chemically inert, meaning bags, food containers, and cups don't react with what we put in them. Yet they can still break down into microplastics, which turn up in drinking water, human blood, arteries, and brains. The consequences of that are uncertain. “Whether microplastics can directly cause human disease is still being researched,” said Wei Min, a chemist at Columbia University. In a new Nature study, Min's team took a step toward answering this question by demonstrating that microplastics are likely not as chemically inert as we might expect. Microdroplet chemistry Min's lab has spent years working on microdroplet chemistry, studying how water broken into tiny droplets behaves at its boundary with air. These droplets have been reported to generate reactive oxygen species, or ROS, a family of harmful, oxygen-containing molecules. “ROS will essentially bump into proteins, lipids, DNA, and cause damage,” Min said. “You could break a DNA strand into segments. You could mutate DNA; you could misfold proteins.” Read full article Comments", "date_str": "2026-10-15T18:39:17+00:00", "hash": "9b43c27a27abb7be", "title_fa": "میکروپلاستیک های موجود در آب بی اثر نیستند و به خودی خود مواد شیمیایی مضر ایجاد می کنند", "summary_fa": "یکی از دلایلی که پلاستیک‌ها اغلب استفاده می‌شوند این است که از نظر شیمیایی بی‌اثر هستند، به این معنی که کیسه‌ها، ظروف غذا و فنجان‌ها با چیزی که ما در آنها می‌گذاریم واکنش نشان نمی‌دهند. با این حال، آنها هنوز هم می توانند به میکروپلاستیک ها تجزیه شوند که در آب آشامیدنی، خون انسان، عروق و مغز ظاهر می شوند. عواقب آن نامشخص است. وی مین، شیمیدان دانشگاه کلمبیا، می گوید: «اینکه میکروپلاستیک ها می توانند مستقیماً باعث بیماری های انسانی شوند، هنوز در حال تحقیق است. در یک مطالعه جدید در طبیعت، تیم مین گامی در جهت پاسخ به این سوال برداشت و نشان داد که میکروپلاستیک‌ها احتمالاً آنطور که ما انتظار داریم از نظر شیمیایی بی‌اثر نیستند. شیمی ریز قطره آزمایشگاه مین سال‌ها روی شیمی ریز قطره‌ها کار کرده است، و بررسی می‌کند که چگونه آب شکسته شده به قطرات کوچک در مرز خود با هوا رفتار می‌کند. گزارش شده است که این قطرات گونه‌های فعال اکسیژن یا ROS، خانواده‌ای از مولکول‌های مضر و حاوی اکسیژن را تولید می‌کنند. مین گفت: «ROS اساساً به پروتئین ها، لیپیدها، DNA برخورد می کند و باعث آسیب می شود. \"شما می توانید یک رشته DNA را به قطعات تقسیم کنید. می توانید DNA را جهش دهید، می توانید پروتئین ها را به اشتباه تا کنید.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری یکی از دلایلی که پلاستیک ها اغلب استفاده می شوند این است که از نظر شیمیایی بی اثر هستند، به این معنی که کیسه ها، ظروف غذا و فنجان ها با چیزی که ما در آنها قرار می دهیم واکنش نشان نمی دهند. با این حال، آنها هنوز هم می توانند به میکروپلاستیک ها تجزیه شوند"}, {"source": "Ars Technica", "title": "Trump cancels Pentagon plans to livestream firing squad execution", "link": "https://arstechnica.com/tech-policy/2026/10/trump-cancels-pentagon-plans-to-livestream-firing-squad-execution/", "summary": "On Thursday, Donald Trump called off the Pentagon’s highly controversial plans to livestream a firing squad execution that is still on schedule for December 3. Trump supports the execution of Nidal Hasan, who was convicted of killing 13 people and wounding more than 30 others in the 2009 mass shooting at Fort Hood. But sources close to Trump told CNN that the president was blindsided last week when Secretary of Defense Pete Hegseth announced that the event—which is the first US execution of a soldier since World War II—would be livestreamed. Backlash to the livestream was immediate and crossed political divides. On the morning Trump canceled the plans, an ABC News poll found 8 in 10 Americans were against the livestream, including a 55 percent majority of MAGA Republicans. Read full article Comments", "date_str": "2026-10-15T18:16:36+00:00", "hash": "76009ab30e86e528", "title_fa": "ترامپ برنامه های پنتاگون برای پخش زنده اجرای جوخه تیراندازی را لغو کرد", "summary_fa": "روز پنجشنبه، دونالد ترامپ برنامه های بسیار بحث برانگیز پنتاگون برای پخش زنده اجرای جوخه تیراندازی را که هنوز در برنامه 3 دسامبر است، لغو کرد. ترامپ از اعدام نیدال حسن که به کشتن 13 نفر و زخمی کردن بیش از 30 نفر دیگر در تیراندازی دسته جمعی در فورت هود در سال 2009 محکوم شد، حمایت می کند. اما منابع نزدیک به ترامپ به سی‌ان‌ان گفتند که رئیس‌جمهور هفته گذشته وقتی پیت هگزت، وزیر دفاع آمریکا اعلام کرد که این مراسم - که اولین اعدام یک سرباز آمریکایی از زمان جنگ جهانی دوم است - به صورت زنده پخش می‌شود، چشم‌پوشی کرد. واکنش به پخش زنده فوری بود و از شکاف های سیاسی عبور کرد. صبح روزی که ترامپ برنامه ها را لغو کرد، یک نظرسنجی ABC News نشان داد که از هر 10 آمریکایی، 8 نفر مخالف پخش زنده بودند، از جمله 55 درصد اکثریت جمهوری خواهان MAGA. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش در روز پنجشنبه، دونالد ترامپ برنامه های بسیار بحث برانگیز پنتاگون برای پخش زنده اجرای جوخه شلیک را که هنوز برای 3 دسامبر برنامه ریزی شده است، لغو کرد. خودی ها به ای بی سی نیوز گفتند که ترامپ می ترسد که «پخش این اعدام می تواند تبلیغات ضد آمریکایی را به شدت بالا ببرد یا بر آمریکا منعکس کند». به گزارش سی ان ان، ترامپ به طور خصوصی گفته بود که «او ابتدا نمی دانست که حسن از کمر به پایین فلج است». همانطور که یکی از افسران ارتش که از اعلان هگزت وحشت زده شده بود در گزارش جداگانه ای سی ان ان توضیح داد، پخش زنده این اعدام \"هر چیزی را که آمریکا برای آن ایستاده است"}, {"source": "Ars Technica", "title": "Neutron's first launch slips again amid trouble with carbon composites", "link": "https://arstechnica.com/space/2026/10/rocket-lab-announces-another-delay-for-its-medium-lift-neutron-rocket/", "summary": "Rocket Lab announced Wednesday that its Neutron launch vehicle won't fly until 2027, citing an issue discovered during manufacturing of the rocket's carbon composite structures. The announcement was public confirmation of what nearly everyone inside Rocket Lab and the wider space industry already knew. The most recent official update from Rocket Lab in August suggested the company still held hope of delivering the first Neutron rocket to its launch pad at Wallops Island, Virginia, before the end of this year, a schedule that would have almost certainly pushed the first flight into 2027. But Rocket Lab's statement Wednesday about Neutron's schedule suggests the company is still struggling with manufacturing the rocket's large booster stage. Neutron's reusable first stage is made of carbon composite structures, which offer low weight, high strength, and corrosion resistance. But carbon composites in aerospace are generally harder to manufacture than metallic structures. Read full article Comments", "date_str": "2026-10-15T16:57:24+00:00", "hash": "e810172abd762946", "title_fa": "اولین پرتاب نوترون در بحبوحه مشکل با کامپوزیت های کربنی دوباره لغزید", "summary_fa": "Rocket Lab روز چهارشنبه اعلام کرد که پرتابگر نوترونی آن تا سال 2027 پرواز نخواهد کرد و به مشکلی اشاره کرد که در ساخت ساختارهای کامپوزیت کربنی موشک کشف شد. این اعلامیه تأیید عمومی چیزی بود که تقریباً همه در آزمایشگاه راکت و صنعت فضایی گسترده‌تر قبلاً می‌دانستند. آخرین به‌روزرسانی رسمی آزمایشگاه راکت در ماه آگوست نشان می‌دهد که این شرکت هنوز امیدوار است که اولین موشک نوترون را به سکوی پرتاب خود در جزیره والوپس، ویرجینیا، قبل از پایان سال جاری تحویل دهد، برنامه‌ای که تقریباً به طور قطع اولین پرواز را تا سال 2027 پیش می‌برد. اما بیانیه روز چهارشنبه راکت در مورد برنامه نوترون نشان می‌دهد که این شرکت همچنان در حال مبارزه با موشک بزرگ است. مرحله اول قابل استفاده مجدد نوترون از ساختارهای کامپوزیت کربنی ساخته شده است که وزن کم، استحکام بالا و مقاومت در برابر خوردگی را ارائه می دهد. اما کامپوزیت های کربن در هوافضا به طور کلی سخت تر از سازه های فلزی ساخته می شوند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید Lab راکت روز چهارشنبه اعلام کرد که وسیله پرتاب نوترونی خود تا سال 2027 پرواز نخواهد کرد، با استناد به مشکلی که در طول ساخت ساختارهای کامپوزیت کربنی موشک کشف شد. اما بیانیه روز چهارشنبه Rocket Lab در مورد برنامه نوترون نشان می دهد که این شرکت هنوز در حال تلاش برای ساخت مرحله تقویت کننده بزرگ موشک است. مرحله اول قابل استفاده مجدد نوترون از ساختارهای کامپوزیت کربنی ساخته شده است که وزن کم، استحکام بالا و مقاومت در برابر خوردگی را ارائه می دهد. اما کامپوزیت های کربن در هوافضا به طور کلی سخت تر از سازه های فلزی ساخته می شوند."}, {"source": "Ars Technica", "title": "Report: FTC probes Anthropic, OpenAI after Trump dismissed AI fears as “hoax”", "link": "https://arstechnica.com/tech-policy/2026/10/ftc-probes-if-openai-anthropic-security-incidents-harmed-americans-report-says/", "summary": "Following a string of incidents where AI models hacked websites and breached government systems during testing phases, the Federal Trade Commission is officially probing Anthropic and OpenAI over consumer harms, an insider told Axios . On Wednesday, the FTC sent out civil investigative demands seeking a wide range of information from the AI firms on recent safety incidents. The FTC did not respond to Ars’ request to review the subpoena demands. However, Axios’ source said the requests spanned more than 50 pages of questions and sought documents related to the incidents, internal security measures taken, and marketing materials that may suggest consumers were misled. Read full article Comments", "date_str": "2026-10-15T15:43:24+00:00", "hash": "cfb115f5f593a53d", "title_fa": "گزارش: FTC پس از آن که ترامپ ترس از هوش مصنوعی را \"فریب\" رد کرد، Anthropic، OpenAI را بررسی می کند.", "summary_fa": "یکی از منابع آگاه به Axios گفت، پس از یک رشته حوادث که در آن مدل‌های هوش مصنوعی در مراحل آزمایش، وب‌سایت‌ها را هک کردند و سیستم‌های دولتی را نقض کردند، کمیسیون تجارت فدرال رسماً در حال بررسی Anthropic و OpenAI در مورد آسیب‌های مصرف‌کننده است. روز چهارشنبه، FTC درخواست های تحقیقاتی مدنی را برای جستجوی طیف گسترده ای از اطلاعات از شرکت های هوش مصنوعی در مورد حوادث اخیر ایمنی ارسال کرد. FTC به درخواست Ars برای بررسی درخواست‌های احضاریه پاسخ نداد. با این حال، منبع Axios گفت که این درخواست‌ها شامل بیش از 50 صفحه سؤال بوده و به دنبال اسناد مربوط به حوادث، اقدامات امنیتی داخلی اتخاذ شده و مواد بازاریابی است که ممکن است نشان دهد مصرف‌کنندگان گمراه شده‌اند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید به حداقل رساندن برای ناوبری پس از یک رشته حوادثی که در آن مدل‌های هوش مصنوعی وب‌سایت‌ها را هک کردند و سیستم‌های دولتی را در طول مراحل آزمایش نقض کردند، کمیسیون تجارت فدرال رسماً به Anthropic و OpenAI در مورد آسیب‌های مصرف‌کننده گفت. منبع Axios گفت به زودی، اشخاص ثالثی که توسط ماموران OpenAI و Anthropic مورد هدف قرار گرفته اند نیز احضار خواهند شد. در صورتی که FTC تصمیم به شکایت از هر یک یا هر دو شرکت به دلیل انتشار محصولات ناامن کند، ممکن است شواهد مربوط به جمع‌آوری‌شده از دعوای FTC پشتیبانی کند. OpenAI در حال حاضر با شکایت هایی مبنی بر آسیب رساندن به مصرف کننده مواجه است، از جمله شکایت هایی که ربات چت خود را به مادرکشی، خودکشی کودکان، تیراندازی در مدرسه و سایر خشونت ها مرتبط می کند. رویترز گزارش داد و این هفته، گروهی متشکل از هشت ایالت به طور خاص از OpenAI به"}, {"source": "Ars Technica", "title": "Singer or clanker? YouTube Music will tell you with new gen AI labeling.", "link": "https://arstechnica.com/ai/2026/10/youtube-music-begins-labeling-ai-songs/", "summary": "Genuine human creativity takes time, but you know what doesn't? AI slop. There are countless AI models out there that can make something that passes for music, and you might come across those tracks on streaming services without realizing it. Google says it will begin labeling that content in YouTube Music, building on similar disclosures in the main YouTube app. Google is not outright banning AI music or even speaking ill of it. \"Generative AI is opening up new ways for artists to create, experiment, and share music,\" the company says in a blog post. However, the company also acknowledges that people want to know if a song was created with generative AI tools. A new label for AI content on YouTube Music is now rolling out in the app and on the website, which looks a lot like a label Google began adding to AI-generated videos on YouTube earlier this year. Read full article Comments", "date_str": "2026-10-15T15:12:58+00:00", "hash": "8d711ee10f7423ed", "title_fa": "خواننده یا کلانکر؟ YouTube Music با برچسب‌گذاری نسل جدید هوش مصنوعی به شما اطلاع می‌دهد.", "summary_fa": "خلاقیت واقعی انسان زمان می برد، اما می دانید چه چیزی اینطور نیست؟ شیب هوش مصنوعی. مدل‌های بی‌شماری هوش مصنوعی وجود دارند که می‌توانند چیزی را برای موسیقی بسازند، و ممکن است بدون اینکه متوجه شوید با آن آهنگ‌ها در سرویس‌های استریم مواجه شوید. گوگل می گوید که برچسب گذاری آن محتوا را در YouTube Music، بر اساس افشای مشابه در برنامه اصلی YouTube آغاز خواهد کرد. گوگل صراحتاً موسیقی هوش مصنوعی را ممنوع نمی کند یا حتی درباره آن بد صحبت نمی کند. این شرکت در یک پست وبلاگی می گوید: \"هوش مصنوعی مولد راه های جدیدی را برای هنرمندان برای ایجاد، آزمایش و به اشتراک گذاری موسیقی باز می کند.\" با این حال، این شرکت همچنین اذعان می‌کند که مردم می‌خواهند بدانند آیا آهنگی با ابزارهای هوش مصنوعی تولید شده است یا خیر. برچسب جدیدی برای محتوای هوش مصنوعی در YouTube Music اکنون در برنامه و وب سایت منتشر شده است، که به نظر می رسد بسیار شبیه برچسبی است که گوگل در اوایل امسال شروع به اضافه کردن به ویدیوهای تولید شده توسط هوش مصنوعی در YouTube کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حد
