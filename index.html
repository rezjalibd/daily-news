tige-pictures-boards-sxsw-teen-body-horror-fifteen-afm-1237208181/", "summary": "EXCLUSIVE: Prestige International Pictures (PIP) has acquired all sales rights to SXSW Midnighters title Fifteen (Quince), outside of Latin America, ahead of the AFM in November. Taking its cue from the Latin American tradition of quinceañera, a coming-of-age celebration when a girl turns 15, the film was directed by Mexican brothers Jack Zagha and Yossy [ ]", "date_str": "2026-10-29T15:12:17+00:00", "hash": "9eae942b4a2e0c2a", "title_fa": "تابلوهای پرستیژ بین المللی تصاویر SXSW Mexican Teen Body Horror ‘Fifteen’ – AFM", "summary_fa": "انحصاری: پرستیژ اینترنشنال پیکچرز (PIP) تمامی حقوق فروش عنوان SXSW Midnighters Fifteen (کوئینس) را در خارج از آمریکای لاتین، قبل از AFM در نوامبر به دست آورده است. این فیلم برگرفته از سنت آمریکای لاتین quinceañera، جشنی است که وقتی دختری 15 ساله می شود، به بلوغ رسیده است، این فیلم توسط برادران مکزیکی جک زاگا و یوسی کارگردانی شده است. از زمان نمایش خود در SXSW، مجموعه ای از جشنواره های بین المللی ژانر و فیلم از جمله سیاتل، فانتاسپوآ و نوشاتل را اجرا کرده است. ترسناک بدن یک دختر مکزیکی را دنبال می کند که با بهترین دوستش در حال برنامه ریزی یک کوینسینرای عالی است تا زمانی که شروع به تبدیل شدن به یک هیولا می کند و باعث ایجاد شکاف در دوستی آنها می شود زیرا جشن تولد او به هرج و مرج تبدیل می شود. در ددلاین تماشا کنید گرتا مارتی در کنار ماکارنا اوز (هیچ‌کس دلش برای ما تنگ نمی‌شود)، آمینتا ایرتا، کلو فورلونگ و مرسدس هرناندز که اخیراً در فیلم حفار آلخاندرو گونزالس اینیاریتو حضور داشتند، بازی می‌کنند. این فیلم توسط Zagha ​​bothers برای Avanti Pictures در کنار Elsa Reyes و Valentín Javier Diment و Vanesa Pagani از Cines V تهیه شده است. این محصول مشترک مکزیک و آرژانتین با حمایت و مشارکت موسسه فیلم مکزیکی (IMCINE) از طریق FIDECINE، FOCINE و EFICINE ساخته شده است. یوسی زاگا گفت: «مردم مدام به دختران نوجوان می گویند: «شما در حال تبدیل شدن به یک زن هستید»، گویی این به اندازه کافی وحشتناک نیست. ما این ترس را گرفتیم و در بزرگترین مهمانی زندگی او قرار دادیم.", "image_url": "https://deadline.com/wp-content/uploads/2026/10/fifteen.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۸:۴۲"}, {"source": "Deadline", "title": "Elke Sommer Dies: ‘A Shot In The Dark’, ‘The Wrecking Crew’ Actor Was 85", "link": "https://deadline.com/2026/10/elke-sommer-dead-1237208109/", "summary": "Elke Sommer, the cool blond star whose distinctive German accent and regal bearing lent her a certain exotic quality that she brought to such 1960s films as the Pink Panther sequel A Shot in the Dark, Bob Hope s comedy Boy, Did I Get a Wrong Number!, The Oscar starring Stephen Boyd and spy entry The [ ]", "date_str": "2026-10-29T15:09:43+00:00", "hash": "dd31a51c9694b5c1", "title_fa": "الکه سامر درگذشت: بازیگر فیلم های A Shot In The Dark، The Wrecking Crew 85 ساله بود.", "summary_fa": "الکه سامر، ستاره بلوند باحالی که لهجه و لهجه‌ی متمایز آلمانی‌اش به او کیفیت عجیب و غریب خاصی داد که در فیلم‌های دهه 1960 مانند دنباله پلنگ صورتی، شلیک در تاریکی، پسر کمدی باب هوپ، آیا عدد اشتباهی گرفتم! ستاره‌ای که لهجه‌ی متمایز آلمانی و رفتار سلطنتی‌اش به او کیفیت عجیب و غریب خاصی داد که او در فیلم‌های دهه 1960 مانند دنباله پلنگ صورتی، شلیک در تاریکی، پسر کمدی باب هوپ، آیا شماره اشتباه گرفتم، آورد! اسکار با بازی استیون بوید و جاسوس خدمه ویرانگر، چهارشنبه، 28 اکتبر، بر اثر نارسایی قلبی در خانه اش در بل-ایر، کالیفرنیا درگذشت. او 85 سال داشت. مرگ او توسط پسرخوانده‌اش سباستین والتر، از طریق سخنگویی، به روزنامه آلمانی بیلد اعلام شد. در این بیانیه آمده است: الکه حوالی ساعت 10 شب با آرامش درگذشت. حالا بالاخره می تواند دوباره در کنار همسر محبوبش باشد. شوهر سامرز، هتلدار آلمانی ولف والتر، سه ماه پیش، در 22 ژوئیه درگذشت. سامر که در 5 نوامبر 1940 در برلین در خانواده‌ای به سرپرستی پدر وزیر لوتری‌اش به دنیا آمد، برای مدت کوتاهی به لندن نقل مکان کرد. سال بعد در حالی که در ایتالیا تعطیلات خود را سپری می‌کرد، مورد توجه کارگردان فیلم ویتوریو دی سیکا قرار گرفت و او شروع به انتخاب او در فیلم‌های سینمایی کرد. او در آن زمان نام خانوادگی خود را به سامر تغییر داد. در ددلاین تماشا کنید موفقیت او با The Prize در سال 1963، یک فیلم جاسوسی و کمدی رمانتیک با بازی پل نیومن (سامر به خاطر بازی خود در گلدن گلوب به عنوان امیدوارکننده‌ترین بازیگر تازه‌وارد شناخته شد.) سال بعد فیلم A Shot in the Dark را به ارمغان آورد.", "image_url": "https://deadline.com/wp-content/uploads/2026/10/GettyImages-979990612.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۸:۳۹"}, {"source": "Pitchfork", "title": "Junior Boys Return With New Album The Gore", "link": "https://pitchfork.com/story/junior-boys-return-with-new-album-the-gore/", "summary": "“Underneath the Moon” leads the Canadian duo’s follow-up to Waiting Game", "date_str": "2026-10-29T15:16:52+00:00", "hash": "ec6b058458fa9d0b", "title_fa": "بازگشت پسران جوان با آلبوم جدید The Gore", "summary_fa": "«زیر ماه» دنباله‌روی دو نفره کانادایی را به Waiting Game Loader Save Story می‌برد ذخیره این داستان Comment Loader Save Story Save this Story Jeremy Greenspan و Matt Didemus به عنوان پسران جوان برای آلبوم جدیدی به نام The Gore که مضامین غم و اندوه و نوستالژی سینما را با هم ترکیب می‌کند، بازگشته‌اند. این آلبوم در 12 فوریه 2027 از طریق City Slang منتشر شد، این آلبوم توسط تکنو تکنو لیسرژیک \"Underneath the Moon\" و ویدئویی به کارگردانی هنرمند جان اسمیت هدایت می شود که طرفداران تلویزیون استاتیک را خوشحال می کند. آن را در زیر بررسی کنید. گرینسپن در یک بیانیه مطبوعاتی گفت: «این آهنگ عمیقاً از فیلم ترسناک 2022 Skinamarink الهام گرفته شده است. من از تکنیک‌های حلقه نوار قدیمی با استفاده از یک دستگاه نوار قدیمی Tascam برای دستیابی به تعدادی از جلوه‌های فیلم استفاده کردم تا به نوعی ادای احترام به کیفیت زودگذر فناوری ضبط آنالوگ باشد. او اضافه کرد که The Gore - که در طی چندین سال و در پی مرگ پدر و دوست نزدیکش نوشته شده است - به نوعی دوقلو با نسخه قبلی خود یعنی بازی انتظار است: «تلفیق قطبی شده همان چیز، چیزی در مورد سکوت، آرامش، وحشت و زمان، هم دایره ای و هم بی پایان». در حالی که هنوز تاریخ برگزاری تور مشخص نشده است، Junior Boys پخش آلبوم را در اوایل سال آینده در بروکلین، سیاتل و تورن وفقیت آمیز خود را در سال 1968 به مک داول داد. ، به دایرکت پیوست شد. اما اندرسون در سال 1994 درگذشت. در سال 2017، مک داول متحمل فقدان تکان دهنده دیگری شد که پکستون پس از جراحی قلب درگذشت. مک داول آخرین مکالمه خود با پکستون را به یاد می آورد: \"دو روز قبل از ورودش با او صحبت کردم و او گفت: \"اوه، این یک چیز معمولی است.\" \"یعنی وحشتناک بود. فقط وحشتناک بود.\"", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/last-train-to-fortune-movie-still-18-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۸:۳۴"}, {"source": "Hollywood Reporter", "title": "Paula Reid Joins MS NOW as Chief White House Reporter", "link": "https://www.hollywoodreporter.com/business/business-news/paula-reid-joins-ms-now-white-house-reporter-leaves-cnn-1236742555/", "summary": "Reid left CNN earlier this year, where she had been chief legal affairs correspondent.", "date_str": "2026-10-29T14:05:08+00:00", "hash": "c5f72b8fde8700c0", "title_fa": "پائولا رید اکنون به عنوان گزارشگر ارشد کاخ سفید به MS می پیوندد", "summary_fa": "رید اوایل سال جاری CNN را ترک کرد، جایی که او خبرنگار ارشد امور حقوقی بود. MS NOW رسما نام بزرگی از CNN را به تیم خود در کاخ سفید اضافه می کند. این کانال خبری کابلی می‌گوید که پائولا رید به‌عنوان گزارش‌گر ارشد کاخ سفید می‌پیوندد، جایی که او تجربیات عمیق خود را در پوشش دولت به ارمغان می‌آورد، به عنوان صدای گزارشگر کلیدی در دفتر واشنگتن MS NOW عمل می‌کند و طبق یادداشتی به کارکنان MS NOW از دفتر Redchief D.C. Sudeepau D.C. رید یکی از برجسته‌ترین خبرنگاران سی‌ان‌ان بود که وزارت دادگستری، دادگاه عالی و سایر موضوعات حقوقی را پوشش می‌داد. او همچنین در بسیاری از برنامه ها مجری جایگزین بود. او قبلاً در CBS News کار می کرد، جایی که وزارت دادگستری و کاخ سفید را پوشش می داد. رید در MS NOW به تیم کاخ سفید می‌پیوندد که شامل کارگردان، اسکات فاستر، گزارشگر ارشد کاخ سفید وان هیلیارد، و خبرنگاران کاخ سفید، لورا بارون-لوپز، آکایلا گاردنر و جیک تریلر است. و او در حالی به آن می‌پیوندد که کاخ سفید در بحبوحه ن  آن را ببینند.\"", "image_url": "https://variety.com/wp-content/uploads/2026/10/Airbnb.org-Gala-Arrivals-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۷ آبان • ۱۹:۰۱"}, {"source": "Variety", "title": "Juliana Stock Exiting as A+E’s Marketing and Digital Chief to Become Hearst Magazines President", "link": "https://variety.com/2026/tv/news/juliana-stock-hearst-magazines-president-1236934202/", "summary": "Juliana Stock is leaving her post as president of marketing and digital at A+E Global Media, after more than a decade at the company, to become president of Hearst Magazines. Stock s appointment at Hearst Magazines will be effective Jan. 1, 2027. Debi Chirichella, who has served as president of Hearst Magazines since 2020, will become [ ]", "date_str": "2026-10-29T15:15:00+00:00", "hash": "886f361908699055", "title_fa": "جولیانا استوک به عنوان مدیر بازاریابی و دیجیتال A+E خارج می شود تا رئیس مجلات Hearst شود.", "summary_fa": "جولیانا استاک پست خود را به عنوان رئیس بازاریابی و دیجیتال در A+E Global Media پس از بیش از یک دهه حضور در این شرکت ترک می کند تا رئیس مجله Hearst شود. قرار ملاقات سهام در مجلات Hearst از 1 ژانویه 2027 اجرایی خواهد شد. دبی چیریچلا، که از سال 2020 به عنوان رئیس مجلات Hearst خدمت کرده است، تبدیل خواهد شد [ ] مجلات Hearst دارای مجموعه ای از بیش از 30 مارک در ایالات متحده است. از جمله Cosmopolitan، Elle، Esquire، Harper’s Bazaar و Good Housekeeping 175 وب سایت و بیش از 200 نسخه مجله در سراسر جهان. برای Stock، این بازگشت به دنیای مجله است: قبل از A+E، او به مدت 11 سال در Condé Nast کار می کرد که اخیراً به عنوان مدیر ارشد تجارت و توسعه محصول بود. استخدام سهام توسط هرست پس از آن صورت می گیرد که اخیراً یکی دیگر از کهنه سربازان تلویزیونی را برای یک موقعیت کلیدی انتخاب کرده است: کریس برند، مدیر ارشد دیجیتال گروه خبری NBCUniversal که در تابستان امسال به عنوان مدیر ارشد محتوا و تجربه به مجله Hearst پیوست. سوارتز در بیانیه‌ای گفت: «ما پس از بیش از یک دهه موقعیت‌های رهبری در ویدئوهای دیج han a year. The Courage World Tour kicked off in September 2019 and generated more than $100 million before hitting pause in March 2020. On the other side of the COVID-19 shutdown, Dion delayed her return several times before officially canceling the remainder of the tour in 2023 due to her diagnosis with stiff-person syndrome. But don’t fret: Three years later, Dion is back and bigger than ever with record-breaking Boxscore figures. Related Céline Dion s Paris 2026 Setlist: Every Song Played at the First Show Céline Dion Cries Happy Tears in Paris: 9 Best Moments From Opening Night of Her Return to Stage Céline Dion s Comeback: 5 Takeaways From Night Two Of Her Paris Residency According to figures reported to Billboard Boxscore, the first leg of her residency, titled Celine Dion Paris, wrapped with $125.5 million and 539,000 tickets sold across 16 shows in September and October. Her comeback residency is anchored at Plenitude Arena in Paris (fka La Defense Arena). A single-venue residency is known territory for Dion. A New Day… (2003-07) and Celine (2011-19), both staged at The Colosseum at Caesars Palace in Las Vegas, are the two highest grossing residencies in Boxscore history. The former grossed $385.1 million in 714 shows, and the latter brought in $296.2 million in 427 dates. While Celine Dion Paris has yet to crack the top 10 of the highest grossing residencies, its 16 shows highlight how impressive the nine-figure gross is. On a per-night basis, her 2026 dates averaged $7.8 million — more than 10 times the nightly take from either of her Vegas stints. That surpasses U2 ’s Sphere residency, which grossed $6.1 million per show to become the fastest grossing residency ever. (Residencies are defined as 10 or more shows at a single venue. Extended stays within a larger tour such as Harry Styles at Madison Square Garden during Together Together or Shakira in Madrid during the Las Mujeres Ya No Lloran World Tour do not count). Further, Dion’s average crowd of 33,700 is close to double the next best per-show attendance for any residency in the Boxscore archives. ( Billy Joel paced 18,600 tickets during his tenure at Madison Square Garden.) When she claimed her throne in Vegas in the 2000s and 2010s, the most competitive residency venues were The Colosseum at Caesars Palace and MGM’s Dolby Live, ", "date_str": "2026-10-29T14:25:57+00:00", "hash": "498cf5343f2fbbc7", "title_fa": "بازگشت سلین دیون به رکورد 125 میلیون دلاری در پاریس", "summary_fa": "آخرین باری که سلین دیون در تور بود، او و طرفدارانش به طور یکسان از اینکه مکان‌های کنسرت (و سایر نقاط جهان) برای بیش از یک سال در شرف تعطیلی کامل بودند، بی‌اطلاع بودند. تور جهانی شجاعت در سپتامبر 2019 آغاز شد و قبل از توقف در مارس 2020 بیش از 100 میلیون دلار درآمد داشت. در طرف دیگر تعطیلی COVID-19، دیون چندین بار بازگشت خود را به تعویق انداخت تا اینکه در سال 2023 باقیمانده تور را به دلیل تشخیص سندرم فرد سفت به طور رسمی لغو کرد. اما نگران نباشید: سه سال بعد، دیون بازگشته و بزرگتر از همیشه با ارقام رکوردشکنی Boxscore. مجموعه‌های مرتبط Céline Dion s Paris 2026: هر آهنگی که در اولین نمایش پخش شده است Céline Dion Cryes Happy Tears in Paris: 9 بهترین لحظه از شب افتتاحیه بازگشت او به صحنه بازگشت سلین دیون: 5 غذای مهم از شب دوم از اقامتگاهش در پاریس بر اساس ارقامی که برای اولین بار از Celine Dion به بیلبورد گزارش شده است. دیون پاریس با 125.5 میلیون دلار و فروش 539000 بلیت در 16 نمایش در ماه های سپتامبر و اکتبر به پایان رسید. محل اقامت بازگشت او در Plenitude Arena در پاریس (fka La Defense Arena) لنگر انداخته است. اقامتگاه تک محله ای منطقه شناخته شده برای دیون است. یک روز جدید… (2003-07) و سلین (2011-19) که هر دو در کولوسئوم در کاخ سزار در لاس وگاس به روی صحنه رفتند، دو اقامتگاه پردرآمد در تاریخ Boxscore هستند. اولی در 714 نمایش 385.1 میلیون دلار فروش داشت و دومی در 427 تاریخ 296.2 میلیون دلار به دست آورد. در حالی که سلین دیون پاریس هنوز نتوانسته است در بین 10 اقامتگاه پردرآمد قرار گیرد، 16 نمایش آن نشان می دهد که درآمد 9 رقمی چقدر چشمگیر است. بر اساس هر شب، قرارهای او در سال", "image_url": "http  سال ۲۰۰۰ با بازی جرد لتو، جنیفر کانلی، مارلون وینز و الن برستین دنبال کرد که برای بازی خود نامزدی اسکار را دریافت کرد. درام او در سال 2008 \"کشتی گیر\" با بازی میکی رورک برنده شیر طلایی جشنواره فیلم ونیز شد، در حالی که \"قوی سیاه\" در سال 2010 با بازی ناتالی پورتمن پنج نامزدی جایزه اسکار از جمله بهترین فیلم و بهترین کارگردانی را به خود اختصاص داد. پورتمن برای بازی خود برنده اسکار بهترین بازیگر زن شد. از دیگر فیلم‌های کارگردانی آرونوفسکی می‌توان به «چشمه»، «نوح» و «مادر» اشاره کرد. درام او در سال 2022 به نام \"نهنگ\" بازگشت برندان فریزر به نقش اصلی فیلم را رقم زد و اولین جایزه اسکار را برای این بازیگر به ارمغان آورد. اخیراً، آرونوفسکی فیلم جنایی «دزدی گرفتار» را در سال 2025 با بازی آستین باتلر، زوئه کراویتز و رجینا کینگ کارگردانی کرد.", "image_url": "https://variety.com/wp-content/uploads/2025/12/VARIETY-SIZING-52.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۸:۰۵"}, {"source": "Variety", "title": "Joey King, LaKeith Stanfield to Star in Provocative Alien Romance Comedy ‘Safe Space,’ Lucky Number, CAA Media Finance and WME Independent Launching Sales at AFM (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/joey-king-lakeith-stanfield-alien-romance-comedy-safe-space-1236934141/", "summary": "Joey King (“Bullet Train,” “The Act”) and Oscar-nominated LaKeith Stanfield (“Judas and the Black Messiah”) are set to star in “Safe Space,” a provocative sci-fi comedy about toxic relationships from Independent Spirit Award-nominated filmmaker Gillian Wallace Horvat (“I Blame Society”). French sales outfit Lucky Number is launching sales on the project at the American Film [ ]", "date_str": "2026-10-29T14:35:20+00:00", "hash": "dae0c9e84f2a3d02", "title_fa": "جوی کینگ، لیکیت استنفیلد برای ایفای نقش در کمدی عاشقانه بیگانه تحریک آمیز «فضای امن»، شماره خوش شانس، CAA Media Finance و فروش مستقل WME در AFM (اختصاصی)", "summary_fa": "جوی کینگ («قطار گلوله»، «قطع») و لاکیث استنفیلد («یهودا و مسیح سیاه») نامزد اسکار قرار است در «فضای امن»، یک کمدی علمی تخیلی تحریک‌آمیز درباره روابط سمی از فیلمساز نامزد جایزه Independent Spirit، Gillian Blaace Horvat Society (»») بازی کنند. شرکت فرانسوی Lucky Number فروش پروژه را در American Film راه اندازی می کند [ ] Lucky Number بخشی از پروژه داغ را برای خریداران در بازار فیلم آمریکایی در لس آنجلس نشان می دهد. جوی کینگ («قطار گلوله»، «قطع») و لاکیث استنفیلد («یهودا و مسیح سیاه») نامزد اسکار قرار است در «فضای امن»، یک کمدی علمی تخیلی تحریک‌آمیز درباره روابط سمی از فیلمساز نامزد جایزه Independent Spirit، Gillian Blaace Horvat Society (»») بازی کنند. «فضای امن» که به عنوان یک شیرجه طنزآمیز به معنای رابطه جنسی و عشق توصیف می‌شود، کینگ را در نقش شری بازی می‌کند، دانشمندی باهوش اما نامطمئن که از رابطه سمی با همکارش خارج می‌شود تا به سمی‌ترین رابطه در کهکشان با یک موجود بیگانه با بازی استنفیلد بازگردد. هوروات می‌گوید: «کار با جوی و لیکیت یک تحقق خلاقانه باورنکردنی برای فیلمنامه بوده است. \"شیمی آنها چشم نواز است. این دو در کنار هم قرار است یک مکاشفه برای مخاطبان باشد.» این فیلم با ترکیبی از داستان های علمی تخیلی، عاشقانه و کمدی، به بررسی راه هایی می پردازد که از طریق آن مردم در جامعه ای که به طور فزاینده ای پرمخاطب است، پیوند می یابند و ارتباط برقرار می کنند. این پروژه نشان‌دهنده اولین حضور هوروات در کارگردانی او با نام «من جامعه را سرزنش می‌کنم» در سال 2020 در روتردام اکران شد و متعاقباً توسط مجله نیویورک به عنوان یکی از بهترین فیلم‌های سال 2021 معرفی شد.", "image_url": "https://variety.com/wp-content/uploads/2026/10/split-image-1000-2.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۸:۰۵"}, {"source": "Variety", "title": "‘Christmas at the Kringles’ Review: Seasonal Caper Mixes Comedy and Horror, Missing the Mark on Both", "link": "https://variety.com/2026/film/reviews/christmas-at-the-kringles-review-1236934105/", "summary": "The only thing rarer in the horror canon than a good holiday film is a good comedy. “Christmas at the Kringles” manages to miss the overlap in that Venn diagr ince Estate to Release ‘3121’ Expanded Edition, With Concert Video and Multiple Unreleased Tracks", "link": "https://variety.com/2026/music/news/prince-3121-expanded-edition-1236934181/", "summary": "Prince’s NPG Records and the Prince Estate have announced an expanded edition of the artist’s 2007 album “3121,” arguably the best of his post 1990s albums. The set arrives December 11 digitally and in 3LP + Blu-ray and 2CD + Blu-ray sets. Following the success of the “Sign O’ the Times” restored concert film, “Prince: [ ]", "date_str": "2026-10-29T14:34:00+00:00", "hash": "648f7e0177ec1e53", "title_fa": "Prince Estate نسخه توسعه یافته «3121» را با ویدیوی کنسرت و چندین آهنگ منتشر نشده منتشر می کند", "summary_fa": "پرینس NPG Records و Prince Estate نسخه گسترده‌ای از آلبوم سال 2007 این هنرمند به نام «3121» را اعلام کرده‌اند که مسلماً بهترین آلبوم پس از دهه 1990 او بود. این مجموعه در 11 دسامبر به صورت دیجیتال و در مجموعه های 3LP + Blu-ray و 2CD + Blu-ray وارد بازار می شود. پس از موفقیت فیلم کنسرت بازسازی شده \"Sign O' the Times\"، \"Prince: [ ] Prince's NPG Records و Prince Estate نسخه گسترده ای از آلبوم \"3121\" این هنرمند در سال 2007 را اعلام کردند که مسلماً بهترین آلبوم پس از دهه 1990 او بود. مجموعه به صورت دیجیتالی و B2-3P +11 دسامبر عرضه می شود. مجموعه های بلوری نسخه دیجیتال گسترش یافته آلبوم اصلی 12 آهنگی را با 10 ضبط خام اضافی، از جمله نسخه های آکوستیک «کلمه»، «عشق» و «ته آمو کورازون»، در کنار «زمان زندگی»، «خیابان های پاناما»، «دختری دیگر»، «کاتر شیشه» و موارد دیگر جفت می کند. نسخه‌های فیزیکی «3121» را با بلوری جفت می‌کند که شامل تصاویر زنده کنسرت فیلم‌برداری شده در لاس وگاس در سال 2007 است. «3121» که در ابتدا در 21 مارس 2006 از طریق NPG Records و Universal Music منتشر شد، اولین آلبوم پرینس بود که در رتبه اول بیلبورد 200 قرار گرفت و چهارمین آلبوم او در صدر جدول قرار گرفت. \"3121 Las Vegas Live\" این موسیقی را به صحنه می آورد و بیش از دو ساعت از اجرای پرنس در 20 ژانویه 2007 در لاس وگاس را به تصویر می کشد. مجموعه شامل کاتالوگ او می شود و بین «باران بنفش»، «بوسه»، «اگ ": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
