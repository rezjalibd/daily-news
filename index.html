 می دهد. به جای خرد کردن سبزیجات، اندازه‌گیری مواد، تشخیص درجه حرارت پخت و پز و ایستادن روی اجاق، بیشتر همه چیز را باز می‌کنید، دستورالعمل‌های ساده‌ای مانند اضافه کردن بسته‌های ادویه را دنبال می‌کنید، همه چیز را"}, {"source": "TechCrunch Main", "title": "Lucid Motors has a potential robotaxi partner for Europe", "link": "https://techcrunch.com/2026/09/17/lucid-motors-has-a-potential-robotaxi-partner-for-europe/", "summary": "The company is partnering with mobility platform Bolt -- but no vehicle orders have been placed just yet.", "date_str": "2026-09-17T13:26:32+00:00", "hash": "882de0fe9290d641", "title_fa": "Lucid Motors یک شریک بالقوه روباتاکسی برای اروپا دارد", "summary_fa": "این شرکت با پلتفرم تحرک بولت همکاری می کند - اما هنوز هیچ سفارش خودرویی ثبت نشده است. لوسید موتورز با پلتفرم حمل و نقل اروپایی Bolt وارد همکاری شده است که می تواند رباتاکسی ساخته شده توسط شرکت کالیفرنیا را به این قاره بیاورد. این دو شرکت روز پنجشنبه اعلام کردند که بولت قصد دارد حداقل 25000 وسیله نقلیه کاملاً خودمختار ساخته شده بر اساس معماری EV سایز متوسط ​​آینده Lucid را به کار گیرد که ظاهراً کوچکتر و ارزان تر از ارائه های فعلی آن است. این اعلامیه به دنبال تغییر ساختار عمده در Lucid Motors تحت مدیریت جدید آن، سیلویو ناپولی، انجام شد که اخیراً نزدیک به 20 درصد از نیروی کار شرکت را اخراج کرد و عرضه اولین خودروی ساخته شده بر روی پلت فرم متوسط ​​را تقریباً یک سال به نیمه دوم سال 2027 به تعویق انداخت. این شرکت سال گذشته را با همکاری اوبر و شرکت خودروهای خودران Nuro برای عرضه نسخه روباتاکسی از شاسی بلند Gravity خود گذرانده است. قرار است این اتفاق تا پایان سال 2026 رخ دهد. ناپولی گفته است که او معتقد است کسب و کار تبدیل شدن به یک ارائه‌دهنده روباتاکسی دارای حاشیه‌هایی است که بسیار بیشتر از مدل سنتی خرده‌فروشی است. بر اساس بیانیه مطبوعاتی، بولت قصد دارد این ناوگان را مالک و اداره کند. این دو شرکت از مرحله توسعه محصول روی یک پلت فرم خودروی آماده سیستم رانندگی خودکار (ADS) با هم کار خواهند کرد. این خودروها از معماری محاسباتی و حسگر خودروی خودران انویدیا (به نام Hyperion) استفاده خواهند کرد، اما این شرکت‌ها نگفتند کدام شرکت (یا شرکت‌ها) نرم‌افزار رانندگی خودکار را ارائه خواهند کرد. لوسید از ارائه اطلاعات بیشتر فراتر از آنچه در بیانیه مطبوعاتی آمده بود خودداری کرد."}, {"source": "TechCrunch Main", "title": "How Bain Capital Ventures plans to deploy its fresh $1.6B fund", "link": "https://techcrunch.com/2026/09/17/how-bain-capital-ventures-plans-to-deploy-its-fresh-1-6b-fund/", "summary": "BCV's latest fund targets early-stage founders harnessing AGI and building the infrastructure to run it efficiently.", "date_str": "2026-09-17T12:57:46+00:00", "hash": "133a2b2358824f00", "title_fa": "چگونه Bain Capital Ventures قصد دارد صندوق جدید 1.6 میلیارد دلاری خود را مستقر کند", "summary_fa": "آخرین صندوق BCV بنیان‌گذاران اولیه را هدف قرار می‌دهد که از AGI استفاده می‌کنند و زیرساختی برای اجرای کارآمد آن ایجاد می‌کنند. Bain Capital Ventures (BCV)، بخش سرمایه گذاری شرکت سهامی خصوصی Bain Capital، یک صندوق جدید 1.6 میلیارد دلاری جمع آوری کرده است که 14 درصد بیشتر از صندوق قبلی 1.4 میلیارد دلاری آن است که شرکت سه سال پیش اعلام کرد. مانند بسیاری دیگر از سرمایه گذاران مخاطره آمیز، BCV می گوید که از سرمایه های تازه برای حمایت از استارتاپ هایی که عمدتاً بر روی هوش مصنوعی متمرکز هستند، استفاده خواهد کرد. این شرکت بر این باور است که هوش عمومی مصنوعی (AGI) که آن را به عنوان عواملی که بسیاری از وظایف را به خوبی انسان ها انجام می دهند، از قبل وارد شده است و موج بعدی استارت آپ ها نه تنها از قدرت آن استفاده می کنند، بلکه زیرساخت های مورد نیاز برای اجرای کارآمد آن را نیز ایجاد خواهند کرد. شریک کوین ژانگ گفت: برخی از موضوعات اصلی که بیشترین ارتباط را در آنچه این شرکت دوران پس از AGI می نامد شامل زیرساخت ها، مراقبت های بهداشتی، هوش مصنوعی فیزیکی و امنیت است. او گفت که هدف BCV تامین مالی زیرساخت‌های محاسباتی تا زمانی است که اطلاعات \"بیش از حد ارزان برای اندازه‌گیری\" شود، به این معنی که هزینه اجرای هوش مصنوعی تقریباً به صفر برسد. او به یک شرکت در مجموعه BCV اشاره کرد که می‌تواند به این ماموریت کمک کند: توسعه‌دهنده مرکز داده Crusoe، که طبق گزارش‌ها 30 میلیارد دلار ارزش دارد و به عنوان یک نامزد کوتاه‌مدت IPO در نظر گرفته می‌شود. BCV در ابتدا در سال 2019 سری A کروزوئه را رهبری کرد، زمانی که بر استخراج ارزهای دیجیتال تمرکز داشت. این شرکت می‌خواهد بر مراقبت‌های بهداشتی تمرکز کند، زیرا معتقد است این بخش ممکن است به طور"}, {"source": "TechCrunch Main", "title": "Spotify expands its partner program for podcasts to 35 new countries", "link": "https://techcrunch.com/2026/09/17/spotify-expands-its-partner-program-for-podcasts-to-35-new-countries/", "summary": "Spotify said since changing its video podcasts creator terms in January, its payouts have increased by more than a third.", "date_str": "2026-09-17T12:00:00+00:00", "hash": "413e9f18d6affdd1", "title_fa": "Spotify برنامه شریک خود را برای پادکست ها به 35 کشور جدید گسترش می دهد", "summary_fa": "Spotify گفت از زمان تغییر شرایط سازنده پادکست های ویدیویی خود در ژانویه، پرداخت های آن بیش از یک سوم افزایش یافته است. Spotify در حال گسترش برنامه شریک خود برای پادکست است که به پادکست‌ها اجازه می‌دهد از تبلیغات و اشتراک درآمد Premium درآمد کسب کنند، در مجموع در 35 منطقه از جمله ایتالیا، اسپانیا، برزیل، مکزیک، کلمبیا، لهستان، شیلی، جمهوری دومینیکن و باهاما در پاییز امسال. پادکست‌های واجد شرایط می‌توانند هم از پادکست‌های ویدیویی و هم از پادکست‌های صوتی درآمد کسب کنند - نمایش‌های ویدیویی توسط کاربران Premium و همچنین سهم درآمد تبلیغات از کاربران رایگانی که به نمایش گوش می‌دهند، به عنوان درآمد محسوب می‌شوند. این شرکت گفت که پادکست‌ها می‌توانند نمایش‌های خود را در پلتفرم‌های دیگر توزیع کنند و همچنین تمام درآمدی را که از حمایت‌ها به دست می‌آورند حفظ کنند. Spotify تاکنون برنامه پادکست شریک خود را در ایالات متحده، اروپا و استرالیا اجرا کرده است و این بزرگترین گسترش جغرافیایی سرویس پخش برای این برنامه است. این شرکت گفت که مصرف پادکست ویدیویی در Spotify از زمان راه‌اندازی این ویژگی در سال 2022، 140 درصد افزایش یافته است و مجموع پرداخت‌های ماهانه آن به نمایش‌ها از ژانویه یک سوم افزایش یافته است. در اوایل سال جاری، Spotify معیارهای واجد شرایط بودن خود را تغییر داد تا از پادکست های ویدیویی درآمد کسب کند. سازندگان اکنون می توانند در صورت داشتن حداقل سه قسمت آنلاین، 2000 ساعت مصرف و 1000 مخاطب درگیر در 30 روز گذشته درخواست دهند. این شرکت گفت که این تغییر مصرف در نمایشگاه های شرکت کننده را به طور متوسط ​​45 درصد افزایش داده است. آخرین روز برای رزرو میز نمایشگاه، 18 سپتامبر است. سرنخ های پر تاثیر، دسترسی سرمایه گذاران، و کانون توجه برند در سالن نمایشگاه Disrupt را از دست ندهید. برای بزرگترین اخبار فناوری صنعت مشترک شوید"}, {"source": "TechCrunch Main", "title": "Comp AI sets eyes on a continuously agentic future for security and compliance", "link": "https://techcrunch.com/2026/09/17/comp-ai-sets-eyes-on-a-continiously-agentic-future-for-security-and-complaince/", "summary": "Comp AI, a cybersecurity and compliance startup, announced a $34 million Series A round led by Roo Capital and Grand Ventures.", "date_str": "2026-09-17T11:00:00+00:00", "hash": "0c193a602e1e3fab", "title_fa": "هوش مصنوعی Comp چشم به آینده ای مستمر برای امنیت و انطباق دارد", "summary_fa": "Comp AI، یک استارتاپ امنیت سایبری و انطباق، یک دور سری A 34 میلیون دلاری به رهبری Roo Capital و Grand Ventures را اعلام کرد. Comp AI، یک استارتاپ امنیت سایبری و انطباق، اعلام کرد که مبلغ 34 میلیون دلار سری A را جمع آوری کرده است. این دور توسط Roo Capital و Grand Ventures رهبری شد. این شرکت در ژانویه گذشته توسط لوئیس کارهارت (مدیر عامل)، کلودیو فوئنتس (COO) و برادرش ماریانو فوئنتس (CTO) تاسیس شد. کلودیو و ماریانو نزدیک به یک دهه است که با هم استارت‌آپ می‌سازند، چند سال پیش کارهارت را ملاقات کردند و از او دعوت کردند که به LeapAI، پلتفرم گردش کاری که در حال ساخت آن بودند، بپیوندد. کلودیو مدیرعامل و یکی از بنیانگذاران بود، در حالی که کارهارت به عنوان رئیس رشد و ماریانو یک مهندس ارشد تمام پشته بود. این استارت‌آپ حدود دو سال کار کرد و به بیش از یک میلیون کاربر افزایش یافت، اما آنها در نهایت تصمیم گرفتند آن را پس از پیدا نکردن یک مورد استفاده چسبنده برای تضمین ادامه سرمایه‌گذاری، تعطیل کنند. با این حال، آنها به یاد می آورند که این تجربه چیزهای زیادی به آنها آموخت. برای یکی، آنها یاد گرفتند که چگونه با LLM ها بسازند و اهمیت یافتن یک مورد استفاده خاص برای یک محصول را یاد گرفتند. آنها همچنین یاد گرفتند که فرآیند انطباق با SOC 2 چقدر خسته کننده است، به خصوص که سعی کردند پلتفرم را برای کار با مشتریان سازمانی بزرگتر توسعه دهند. کلودیو گفت: «این یک فرآیند بسیار مبهم است. چند ماه طول کشید تا کارها را با دست انجام دهیم، و تمام مدت این به معنای دور کردن چشمانمان از ساخت محصول بود. افسوس که یک ایده استارت آپی متولد شد. این سه نفر گفتند، این بار، کارهارت به عنوان مدیر عامل شرکت رهبری خواهد شد،"}, {"source": "TechCrunch Main", "title": "Musk’s long-time backer is giving SpaceX stock to its investors", "link": "https://techcrunch.com/2026/09/16/musks-long-time-backer-is-giving-spacex-stock-to-its-investors/", "summary": "Valor Equity Partners is handing out stock to its LPs instead of cash returns.", "date_str": "2026-09-16T23:50:07+00:00", "hash": "fe22165b487b3452", "title_fa": "حامی دیرینه ماسک سهام اسپیس ایکس را به سرمایه گذارانش می دهد", "summary_fa": "Valor Equity Partners به ​​جای بازده نقدی، سهام را در اختیار LP های خود قرار می دهد. شرکت VC Valor Equity Partners، که توسط آنتونیو گراسیاس، حامی قدیمی ایلان ماسک و عضو فعلی هیئت مدیره اسپیس ایکس تأسیس شده است، بر اساس یک پرونده SEC که توسط بلومبرگ مشاهده شده است، تصمیم گرفته است به سادگی بخشی از سهام SpaceX خود را به سرمایه گذاران شریک محدود خود ببخشد. Valor پس از دهه‌ها سرمایه‌گذاری در اسپیس‌ایکس، با شرکت‌هایی که توسط Gracias کنترل می‌شد، بیش از ۵۰۰ میلیون سهام در زمان عرضه اولیه سهام در اختیار داشتند. این پس از ماسک (که در آن زمان بیش از 6 میلیارد سهام داشت) دوم بود. اما بلومبرگ تخمین می‌زند که Valor به‌جای پول نقد و بازدهی‌های LP، 8.5 درصد از دارایی‌های خود را به ارزش حدود 8.5 میلیارد دلار به آنها واگذار کرد. فرم افشای SEC می‌گوید که Valor پس از اعطای سهام همچنان مالک بیش از 460 میلیون سهام خواهد بود. انتقال مالکیت سهام می تواند به شرکای محدود Valor مزیت مالیاتی بدهد. مهمتر از آن، از ریختن یک بخش عظیم سهام در بازار آزاد جلوگیری می کند. چنین کاهشی می‌تواند باعث مازاد سهام موجود و کاهش قیمت مربوطه شود. SpaceX در حال حاضر حدود 10 درصد از روز عرضه اولیه اولیه سهام خود افت کرده است. آخرین روز برای رزرو میز نمایشگاه، 18 سپتامبر است. سرنخ های پر تاثیر، دسترسی سرمایه گذاران، و کانون توجه برند در سالن نمایشگاه Disrupt را از دست ندهید. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها هسته TechCrunch هستند، بنابراین بهترین پوشش ما را هر هفته دریافت کنید. به متحرکان و تکان دهنده ها اطلاعاتی را که برای شروع روز"}, {"source": "TechCrunch Main", "title": "US automakers could soon be forced to include AM radio for free", "link": "https://techcrunch.com/2026/09/16/us-automakers-could-soon-be-forced-to-include-am-radio-for-free/", "summary": "The House of Representatives, in rare bipartisan support, overwhelmingly approved legislation that would require new vehicles to include AM radio.", "date_str": "2026-09-16T22:37:08+00:00", "hash": "1252004e14246fa8", "title_fa": "خودروسازان آمریکایی ممکن است به زودی مجبور شوند رادیو AM را به صورت رایگان وارد کنند", "summary_fa": "مجلس نمایندگان، با حمایت نادر دو حزبی، با اکثریت قاطع قوانینی را تصویب کرد که وسایل نقلیه جدید را ملزم می‌کرد که شامل رادیو AM نیز باشند. به نظر می رسد که تنها چیزی که ظاهراً می تواند شکاف حزبی واشنگتن را پر کند، رادیو AM است. خودروسازان آمریکایی ممکن است مجبور شوند رادیو AM را در خودروهای جدید در سال آینده بسازند. تا همین اواخر، طرفداران رادیو AM تلاش‌های لابی‌گری ناموفقی را برای یک مأموریت انجام داده‌اند و استدلال می‌کنند که این رادیو اطلاعات حیاتی را در مواقع اضطراری ارائه می‌دهد، زیرا سیگنال آن می‌تواند مسافت‌های طولانی را طی کند. اما انبوهی از حمایت دموکرات ها و جمهوری خواهان، صنعت پخش، سازمان های واکنش اضطراری، و حتی مدیران سابق آژانس مدیریت اضطراری فدرال، این قانون را به قانون شدن نزدیک تر می کند. و دلیلی وجود دارد که معتقد باشیم سنا از لایحه مجلس نمایندگان پیروی خواهد کرد، لایحه ای که توسط سناتورهای اد مارکی (D-Mass.) و تد کروز (R-Texas) حمایت شده است. در اوایل سال جاری، سناتورها 60 حامی مالی برای نسخه خود از این لایحه، یک آستانه حیاتی برای غلبه بر یک فیلیباستر، تضمین کردند. کروز که ریاست کمیته بازرگانی، علم و حمل و نقل سنا را بر عهده دارد و مارکی در بیانیه ای مشترک روز چهارشنبه از این تصمیم استقبال کردند. این رای پیام روشنی به خودروسازان می دهد که رادیو AM یک راه نجات است که باید در وسایل نقلیه جدید محافظت شود. از واکنش اضطراری گرفته تا ورزش، سرگرمی و اخبار، رادیو AM یک ابزار ارتباطی ضروری برای ده‌ها میلیون آمریکایی است. اکنون زمان آن است که سنا قانون رادیو AM برای هر خودرو را تصویب کند و این قانون به قانون تبدیل شود، بنابراین رادیو AM یک منبع قابل اعتماد و ضروری برای مسافران و جوامع در سراسر کشور باقی می ماند."}, {"source": "TechCrunch Main", "title": "Noise wants to help everyday people become paid content creators", "link": "https://techcrunch.com/2026/09/16/noise-wants-to-help-everyday-people-become-paid-content-creators/", "summary": "Marketing platform Noise is on a mission to help anyone with a smart phone make money from their content.", "date_str": "2026-09-16T21:35:00+00:00", "hash": "0850c076642649c4", "title_fa": "Noise می خواهد به مردم کمک کند تا به تولیدکنندگان محتوای پولی تبدیل شوند", "summary_fa": "پلتفرم بازاریابی Noise ماموریت دارد به هر کسی که تلفن هوشمند دارد کمک کند از محتوای خود درآمد کسب کند. روز چهارشنبه، نویز فروش 5.5 میلیون دلاری را به رهبری Capital Midwest، M25 و Grishin Robotics اعلام کرد و مجموع درآمد خود را به 7.2 میلیون دلار رساند. سایرین در این دور شامل Capitalize VC و اپراتورهایی از شرکت هایی مانند DoorDash هستند. این استارت‌آپ در حال نفوذ به بازار اینفلوئنسرهای رو به رشد است که در آن 57 درصد از جوانان و کمی بیش از 40 درصد از ایالات متحده در آن حضور دارند. به طور کلی بزرگسالان اکنون می خواهند شرکت کنند. به دیگر شرکت‌های زیرساخت سازنده محتوا مانند Billo و JoinBrands می‌پیوندد. Diego Kafie، Stu Feldt و Nic Weber پس از دو سال صرف ساختن یک اپلیکیشن بازی موبایلی به نام Playbite، Noise را در سال 2025 راه اندازی کردند و اکنون 1.5 میلیون سازنده را در این پلتفرم تبلیغ می کند. مدیر عامل شرکت Kafie گفت که سازندگان برتر شرکت بیش از شش رقم در سال به دست می آورند و این پلتفرم هزینه ای را از آنچه مارک ها پس از ارائه بازدیدها به سازندگان می پردازند، دریافت می کند. او گفت: \"برندهای برتر ما با چندین هزار سازنده در خلبان خودکار کار می کنند.\" در حال حاضر، بسیاری از مشتریان آن اپلیکیشن‌های موبایل هستند، آن‌هایی که با بودجه‌های راه‌اندازی کار می‌کنند و می‌خواهند بازاریاب‌های تاثیرگذار را استخدام کنند. هدف این است که روزی با شرکت هایی در هر اندازه کار کنیم. کافی گفت: \"آنها بیشترین علاقه را به دستیابی به طیف گسترده ای از مشتریان بالقوه دارند و آنها را به کاربران اصلی چیزی مانند Noise تبدیل می کند، جایی که آنها می توانند به راحتی ارتش کوچکی از افراد را برای تبدیل شدن به بزرگترین کاربران و حامیان خود استخدام کنند.\" \"این به"}, {"source": "VentureBeat Tech", "title": "Microsoft releases new AI playbook for enterprises based on its own learnings, and it reveals a surprising 'moat' your biz may already have", "link": "https://venturebeat.com/technology/microsoft-releases-new-ai-playbook-for-enterprises-based-on-its-own-learnings-and-it-reveals-a-surprising-moat-your-biz-may-already-have", "summary": "After studying more than 100 internal AI transformation efforts, Microsoft says the winning enterprise architecture will put proprietary evals, context and learning loops above interchangeable foundation models — while redesigning entire workflows before handing them to agents. Read more", "date_str": "2026-09-17T14:00:00+00:00", "hash": "e02d39ff950bc033", "title_fa": "مایکروسافت بر اساس آموخته‌های خود کتاب‌های هوش مصنوعی جدیدی را برای شرکت‌ها منتشر می‌کند و نشان می‌دهد که خندق شگفت‌انگیزی که ممکن است تجارت شما قبلاً داشته باشد", "summary_fa": "پس از مطالعه بیش از 100 تلاش داخلی برای تغییر هوش مصنوعی، مایکروسافت می‌گوید معماری سازمانی برنده، ارزش‌های اختصاصی، زمینه و حلقه‌های یادگیری را بالاتر از مدل‌های پایه قابل تعویض قرار می‌دهد - در حالی که کل گردش‌های کاری را قبل از تحویل به نمایندگان، دوباره طراحی می‌کند. ادامه مطلب"}, {"source": "Ars Technica", "title": "Apple reportedly building server packed with M-series Ultra chips for AI", "link": "https://arstechnica.com/ai/2026/09/apple-reportedly-building-server-packed-with-m-series-ultra-chips-for-ai/", "summary": "Apple is working on an AI server that would use Apple’s high-performance M-series Ultra chips found in Mac desktops. The potential product’s expected release in 2029 would mark the first Apple server to hit the market in nearly two decades—and could capitalize on the surging popularity of Apple hardware among AI developers. The enterprise server would come in two configurations that include either two or four of Apple’s future M8 Ultra chips, according to The Information . The project reportedly received support from new Apple CEO John Ternus when it began a year ago, back when Ternus led Apple’s hardware engineering efforts. This revelation coincides with booming sales for Apple’s Mac mini and Mac Studio as AI developers and companies snap up the Mac computers to run AI workloads. The popularity of such computing devices that rely on Apple’s M-series Ultra chips has undoubtedly encouraged Apple’s pursuit of an enterprise server using the same chips. Read full article Comments", "date_str": "2026-09-16T22:02:46+00:00", "hash": "faf0e306cca79b21", "title_fa": "طبق گزارش‌ها، اپل سروری را با تراشه‌های Ultra سری M برای هوش مصنوعی ساخته است", "summary_fa": "اپل در حال کار بر روی یک سرور هوش مصنوعی است که از تراشه‌های Ultra سری M اپل با کارایی بالا که در دسکتاپ‌های مک استفاده می‌شود، استفاده می‌کند. عرضه مورد انتظار این محصول بالقوه در سال 2029 اولین سرور اپل است که در نزدیک به دو دهه اخیر وارد بازار می شود و می تواند از محبوبیت فزاینده سخت افزار اپل در میان توسعه دهندگان هوش مصنوعی سرمایه گذاری کند. سرور سازمانی در دو پیکربندی عرضه می شود که شامل دو یا چهار تراشه از تراشه های M8 Ultra آینده اپل است. گزارش شده است که این پروژه زمانی که یک سال پیش آغاز شد، زمانی که ترنوس تلاش‌های مهندسی سخت‌افزار اپل را رهبری می‌کرد، از جان ترنوس، مدیر عامل جدید اپل پشتیبانی دریافت کرد. این افشاگری همزمان با فروش پررونق مک مینی و مک استودیو اپل است، زیرا توسعه دهندگان و شرکت‌های هوش مصنوعی رایانه‌های مک را برای اجرای بارهای کاری هوش مصنوعی جمع‌آوری می‌کنند. محبوبیت چنین دستگاه‌های محاسباتی که بر تراشه‌های Ultra سری M اپل متکی هستند، بدون شک اپل را به دنبال یک سرور سازمانی با استفاده از همان تراشه‌ها تشویق کرده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید کمینه کردن برای پیمایش اپل در حال کار بر روی یک سرور هوش مصنوعی است که از تراشه‌های Ultra سری M اپل با کارایی بالا در رایانه‌های رومیزی Mac استفاده می‌کند. عرضه مورد انتظار این محصول بالقوه در سال 2029 اولین سرور اپل است که در نزدیک به دو دهه اخیر وارد بازار می شود و می تواند از محبوبیت فزاینده سخت افزار اپل در میان توسعه دهندگان هوش مصنوعی سرمایه گذاری کند. اطلاعات گزارش داد که شرکت‌های هوش مصنوعی مانند OpenAI «ده‌ها هزار» مک مینی و مک"}, {"source": "Ars Technica", "title": "Epstein had huge cache of child sex pics; victims sue to find out who's in them", "link": "https://arstechnica.com/tech-policy/2026/09/lawsuit-trump-doj-notified-very-few-victims-in-epsteins-stash-of-child-sex-images/", "summary": "On Tuesday, two survivors of child sex abuse accused the Justice Department of failing to notify dozens of victims found in Jeffrey Epstein’s massive collection of child sex images. In a proposed class action , survivors explained that Epstein apparently started collecting child sex images in the 1990s, many of which the DOJ recovered after his arrest. In 2025, the FBI started reviewing “tens of thousands of videos” containing illegal child sexual abuse material (CSAM) and issued a memo confirming that “a large volume of images” seized depicted likely minors. Some of these victims may have had contact with Epstein, as the disgraced financier kept a \"modelbook\" of nude photos of young girls roped into his ring. However, the FBI also identified hundreds of CSAM images in cache, which include approximately 15–20 images of known CSAM dating back to the 1990s. And so far, the DOJ has largely ignored those victims, who likely never met Epstein and have no way of knowing if he possessed, transported, or traded their images, survivors alleged. Read full article Comments", "date_str": "2026-09-16T21:42:09+00:00", "hash": "72ccc004afcf8b57", "title_fa": "اپستین ذخیره عظیمی از عکس های جنسی کودک داشت. قربانیان شکایت می کنند تا بفهمند چه کسی در آنهاست", "summary_fa": "روز سه‌شنبه، دو بازمانده از کودک آزاری، وزارت دادگستری را متهم کردند که ده‌ها قربانی را که در مجموعه عظیم عکس‌های جنسی جفری اپستین یافت شده بود، مطلع نکرده است. در یک اقدام دسته جمعی پیشنهادی، بازماندگان توضیح دادند که اپستین ظاهراً در دهه 1990 شروع به جمع آوری تصاویر جنسی از کودکان کرد، که بسیاری از آنها پس از دستگیری او را وزارت دادگستری بهبود داد. در سال 2025، FBI شروع به بازبینی «ده‌ها هزار ویدیو» حاوی مواد سوء استفاده جنسی غیرقانونی از کودکان (CSAM) کرد و یادداشتی صادر کرد که در آن تأیید می‌کرد که «حجم زیادی از تصاویر» ضبط‌شده به احتمال زیاد کودکان خردسال را به تصویر می‌کشد. برخی از این قربانیان ممکن است با اپستین تماس داشته باشند، زیرا سرمایه دار رسوا شده یک \"دفترچه مدل\" از عکس های برهنه دختران جوان را در حلقه خود نگه داشته است. با این حال، FBI همچنین صدها تصویر CSAM را در حافظه پنهان شناسایی کرد که شامل تقریباً 15 تا 20 تصویر از CSAM شناخته شده مربوط به دهه 1990 است. و تاکنون، وزارت دادگستری تا حد زیادی آن قربانیانی را نادیده گرفته است که احتمالاً هرگز اپشتین را ملاقات نکرده‌اند و هیچ راهی برای دانستن اینکه آیا او تصاویر آنها را در اختیار داشته، حمل می‌کند یا مبادله می‌کند، بازماندگان ادعا شده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید روز سه شنبه، دو بازمانده از سوء استفاده جنسی از کودکان، وزارت دادگستری را متهم کردند که ده ها قربانی را که در مجموعه عظیم تصاویر جنسی جفری اپستاین یافت شده است، مطلع نکرده است. بازماندگان ادعا کردند: «به تعداد کمی از بازماندگان CSAM اطلاع داده شده است که اپستین تصاویر جنسی غیرقانونی خود"}, {"source": "Ars Technica", "title": "Nonprofit that tracks meteors taken down by \"critical blow\" from a cyberattack", "link": "https://arstechnica.com/security/2026/09/nonprofit-that-tracks-meteors-taken-down-by-critical-blow-from-a-cyberattack/", "summary": "The International Meteor Organization, the nonprofit that coordinates and publishes amateur and professional observations of meteor phenomena, said its infrastructure has suffered a “critical blow” from a cyberattack. “We recently suffered a cyberattack that dealt a critical blow to aging infrastructure, taking much of our site offline,\" a static page on its website on Wednesday said. “We expect several weeks of partial downtime as we transition to new infrastructure and services.” “I am very sad to see the site down” In the meantime, the IMO said it’s prioritizing the reporting of fireball observations, which can be reported here . The organization is also providing some information on its Facebook page. Read full article Comments", "date_str": "2026-09-16T21:08:14+00:00", "hash": "c2b9e91bc410a235", "title_fa": "سازمان غیرانتفاعی که شهاب‌هایی را که با «ضربه‌ی حیاتی» از یک حمله سایبری سرنگون شده است، ردیابی می‌کند.", "summary_fa": "سازمان بین‌المللی شهاب، سازمان غیرانتفاعی که مشاهدات آماتوری و حرفه‌ای پدیده‌های شهاب‌سنگ را هماهنگ و منتشر می‌کند، گفت که زیرساخت‌های این سازمان از یک حمله سایبری متحمل \"ضربه حیاتی\" شده است. یک صفحه ثابت در وب‌سایت خود در روز چهارشنبه گفت: «ما اخیراً متحمل یک حمله سایبری شدیم که ضربه مهمی به زیرساخت‌های قدیمی وارد کرد و بسیاری از سایت ما را آفلاین کرد. \"ما انتظار داریم چندین هفته از کار افتادگی جزئی در حال انتقال به زیرساخت ها و خدمات جدید باشد.\" «از اینکه سایت را می بینم بسیار متأسفم» در این بین، IMO گفت که گزارش مشاهدات گلوله آتشین را در اولویت قرار می دهد که می توانید در اینجا گزارش دهید. این سازمان همچنین برخی از اطلاعات را در صفحه فیس بوک خود ارائه می دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید سازمان بین المللی شهاب، سازمان غیرانتفاعی که مشاهدات آماتور و حرفه ای پدیده های شهاب سنگ را هماهنگ و منتشر می کند، گفت که زیرساخت های آن از یک \"ضربه حیاتی\" متحمل شده است. IMO به ایجاد استانداردهای یکپارچه برای گزارش مشاهدات شهاب سنگ کمک کرده است. پایگاه‌های اطلاعاتی آن از مشاهدات گزارش‌شده شهاب‌سنگ و گلوله‌های آتشین - متشکل از متن، عکس و ویدیو - نیز توسط بسیاری در این زمینه ضروری در نظر گرفته می‌شود. IMO همچنین دو ماهنامه WGN را منتشر می کند که به انگلیسی مخفف Working Group News است. این بدن به طور رسمی در سال 1988 تأسیس شد. مشخص نیست چرا سازمانی که اشیاء فضایی بزرگ و آتشین را که به سمت زمین پرتاب می‌کنند ردیابی می‌کند، هدف یک حمله سایبری مخرب قرار می‌گیرد. به همان اندازه مشخص نیست که چرا شخصی می‌خواهد داده‌های آن را"}, {"source": "Ars Technica", "title": "Lionsgate releases a new trailer for Sunrise on the Reaping", "link": "https://arstechnica.com/culture/2026/09/haymitch-gets-a-backstory-in-sunrise-on-the-reaping-trailer/", "summary": "Lionsgate has released an action-packed trailer for The Hunger Games: Sunrise on the Reaping —a sequel to 2023’s Ballad of Songbirds and Snakes and a prequel leading into the events of the first film, The Hunger Games (2012). In addition, Laika Studios released a trailer for its highly anticipated stop-motion animated feature, Wildwood . (Some spoilers for The Hunger Games below.) The main protagonist is a young Haymitch Abernathy, future District 12 mentor to Katniss (Jennifer Lawrence) and Peeta (Josh Hutcherson). Woody Harrelson’s older Haymitch is a fan favorite who later becomes a jaded, drunken (yet secretly hopeful) cynic. Per the official synopsis: Read full article Comments", "date_str": "2026-09-16T20:44:41+00:00", "hash": "214950473112f499", "title_fa": "لاینزگیت تریلر جدیدی از فیلم Sunrise on the Reaping منتشر کرد", "summary_fa": "Lionsgate یک تریلر اکشن برای The Hunger Games: Sunrise on the Reaping - دنباله‌ای بر تصنیف پرندگان آوازخوان و مارها در سال 2023 و پیش درآمدی که منجر به اتفاقات فیلم اول، بازی‌های گرسنگی (2012) می‌شود، منتشر کرده است. علاوه بر این، لایکا استودیوز تریلر انیمیشن مورد انتظار استاپ موشن خود، Wildwood را منتشر کرد. (برخی اسپویل‌های بازی‌های گرسنگی در زیر.) قهرمان اصلی یک هیمیچ آبرناتی جوان، مربی آینده منطقه 12 کتنیس (جنیفر لارنس) و پیتا (جاش هاچرسون) است. هیمیچ بزرگتر وودی هارلسون یکی از طرفداران مورد علاقه است که بعدها تبدیل به یک بدبین مات و مست (اما پنهانی امیدوار) می شود. بر اساس خلاصه رسمی: مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط برای مشترکین بیشتر بدانید. فیلم بازی های گرسنگی (2012). علاوه بر این، لایکا استودیوز تریلر انیمیشن مورد انتظار استاپ موشن خود، Wildwood را منتشر کرد. داستان در دنیای پانم 24 سال قبل از وقایع بازی‌های گرسنگی اتفاق می‌افتد، داستان هیمیچ (جوزف زادا) وارد عرصه می‌شود، جایی که او با همکار خود میسیلی دانر (مکنا گریس) اتحاد بعید تشکیل می‌دهد و به ائتلافی می‌پیوندد که مصمم است کنترل کنگره را تحت ریاست رئیس جمهور اسنو (R) به چالش بکشد. با گسترش رقابت، هیمیچ همه چیز را به خطر می‌اندازد تا بازی‌ها را از داخل میدان خارج کند - شورشی را به راه می‌اندازد که پانم را برای همیشه تغییر می‌دهد."}, {"source": "Ars Technica", "title": "Not just Proton: Getting to know Valve's new SteamOS compatibility layers", "link": "https://arstechnica.com/gaming/2026/09/not-just-proton-getting-to-know-valves-new-steamos-compatibility-layers/", "summary": "Since the release of the Steam Deck , Valve fans have gotten very familiar with the idea of the Proton compatibility layer that allows games written for Windows to run capably on the Linux-based SteamOS (though Valve's efforts in this realm date back further than that ). To get more games running on the SteamOS-powered Steam Frame , though, Valve is relying on two additional compatibility layers that are new to the Steam architecture . The first, FEX, is Valve's port of fex-emu , an open source project that emulates x86 processor instructions on an Arm chipset. Since 2018, what started as a small cross-platform emulation project has grown to include \"an advanced binary recompiler that supports all modern extensions of the x86(-64) instruction set,\" according to the Fex website. The emulator can also make calls to graphics libraries like OpenGL and Vulkan to reduce overhead and uses \"code caching to minimize stuttering as much as possible,\" according to Steam's own developer documentation . While Proton was based on the pre-existing Wine conversion tool , Valve engineer Pierre-Loup Griffais told The Verge last year that the company has been funding Fex lead developer Ryan Houdek since the project was just a prototype. Back then, Valve was already anticipating that \"close to a decade of work [would be] needed before [Fex-emu] would be robust enough people could rely on it for their libraries.\" Read full article Comments", "date_str": "2026-09-16T20:23:16+00:00", "hash": "438f9040a585a1c7", "title_fa": "نه فقط پروتون: آشنایی با لایه‌های سازگاری SteamOS جدید Valve", "summary_fa": "از زمان انتشار Steam Deck، طرفداران Valve با ایده لایه سازگاری Proton که به بازی های نوشته شده برای ویندوز اجازه می دهد تا به خوبی روی سیستم عامل لینوکس SteamOS اجرا شوند، بسیار آشنا شده اند (البته تلاش های Valve در این حوزه به بیش از آن زمان برمی گردد). با این حال، برای اجرای بازی‌های بیشتر بر روی Steam Frame مجهز به سیستم عامل Steam، Valve به دو لایه سازگاری اضافی متکی است که در معماری Steam جدید هستند. اولین مورد، FEX، پورت Valve از fex-emu است، یک پروژه منبع باز که دستورالعمل‌های پردازنده x86 را در چیپست Arm تقلید می‌کند. طبق وب‌سایت Fex، از سال 2018، آنچه که به عنوان یک پروژه شبیه‌سازی چند پلتفرمی کوچک آغاز شد، به «یک کامپایلر باینری پیشرفته که از تمام برنامه‌های افزودنی مدرن مجموعه دستورالعمل x86(-64) پشتیبانی می‌کند، رشد کرد. این شبیه‌ساز همچنین می‌تواند با کتابخانه‌های گرافیکی مانند OpenGL و Vulkan تماس بگیرد تا سربار را کاهش دهد و بر اساس مستندات توسعه‌دهنده خود Steam، از «حافظه‌گذاری کد برای به حداقل رساندن لکنت تا حد ممکن» استفاده می‌کند. در حالی که پروتون بر اساس ابزار تبدیل شراب از قبل موجود بود، مهندس Valve، پیر لوپ گریفیس، سال گذشته به The Verge گفت که این شرکت از زمانی که این پروژه فقط یک نمونه اولیه بود، از توسعه‌دهنده اصلی Fex، Ryan Houdek حمایت مالی کرده است. در آن زمان، Valve پیش‌بینی می‌کرد که «نزدیک به یک دهه کار [نیازمند] قبل از اینکه [Fex-emu] به اندازه کافی قوی شود، افراد بتوانند برای کتابخانه‌های خود به آن تکیه کنند، نیاز است». مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید از زمان انتشار Steam Deck، طرفداران Valve با ایده لایه سازگاری Proton که به بازی‌های نوشته شده برای"}, {"source": "Ars Technica", "title": "California may gut state net neutrality law to comply with Trump admin demand", "link": "https://arstechnica.com/tech-policy/2026/09/california-may-gut-state-net-neutrality-law-to-comply-with-trump-admin-demand/", "summary": "California is on the verge of accepting $1.86 billion in federal broadband grant funds, despite the Trump administration telling states they cannot enforce net neutrality rules on any Internet service provider that gets a piece of the grant money. When the Trump administration overhauled the $42 billion Broadband Equity, Access, and Deployment (BEAD) program last year, it ruled that states must agree not to enforce any rate regulation or net neutrality rule on ISPs that receive funding. This is particularly problematic for California, which previously won a yearslong court battle to defend its state net neutrality law. Similar to federal net neutrality rules repealed during the first Trump administration, California's law prohibits ISPs from blocking or throttling lawful traffic and says ISPs may not require fees from websites or online services to deliver or prioritize their traffic to Internet users. While the first Trump administration lost its attempt to preempt state net neutrality laws, the second Trump administration is trying to achieve a similar result by making federal broadband money conditional on whether states agree not to enforce net neutrality. Read full article Comments", "date_str": "2026-09-16T19:36:44+00:00", "hash": "c48fcb68f6e59b5a", "title_fa": "کالیفرنیا ممکن است قانون بی طرفی شبکه ایالتی را برای انطباق با درخواست مدیر ترامپ اعمال کند", "summary_fa": "علیرغم اینکه دولت ترامپ به ایالت‌ها گفته است که نمی‌توانند قوانین بی‌طرفی شبکه را در مورد هر ارائه‌دهنده خدمات اینترنتی که بخشی از این پول را دریافت می‌کنند، اعمال کنند، کالیفرنیا در آستانه پذیرش 1.86 میلیارد دلار از وجوه کمک هزینه پهنای باند فدرال است. زمانی که دولت ترامپ در سال گذشته برنامه 42 میلیارد دلاری سهام پهن باند، دسترسی و استقرار (BEAD) را بازنگری کرد، حکم داد که ایالت ها باید موافقت کنند که هیچ گونه مقررات نرخ یا قانون بی طرفی شبکه را در مورد ISP هایی که بودجه دریافت می کنند، اجرا نکنند. این امر به‌ویژه برای کالیفرنیا مشکل‌ساز است، که قبلاً در دادگاهی چند ساله برای دفاع از قانون بی‌طرفی شبکه ایالتی خود پیروز شده بود. مشابه قوانین بی طرفی شبکه فدرال که در اولین دولت ترامپ لغو شد، قانون کالیفرنیا ISP ها را از مسدود کردن یا خنثی کردن ترافیک قانونی منع می کند و می گوید که ISP ها ممکن است برای ارائه یا اولویت بندی ترافیک خود به کاربران اینترنت هزینه ای از وب سایت ها یا خدمات آنلاین نخواهند. در حالی که دولت اول ترامپ تلاش خود را برای جلوگیری از قوانین بی طرفی شبکه ایالتی از دست داد، دولت دوم ترامپ در تلاش است تا با مشروط کردن پول پهنای باند فدرال به عدم اجرای بی طرفی شبکه ایالت ها، به نتیجه مشابهی دست یابد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید علیرغم اینکه دولت ترامپ به ایالت‌ها گفته است که نمی‌توانند قوانین بی‌طرفی شبکه را برای هر یک از ارائه‌دهندگان خدمات اینترنتی که پول دریافت می‌کند، کالیفرنیا در آستانه پذیرش ۱.۸۶ میلیارد دلار کمک مالی پهنای باند فدرال است، بیشتر بدانید. اداره ملی ارتباطات و اطلاعات ترامپ (NTIA) می گوید هر ایالتی"}, {"source": "Ars Technica", "title": "Researchers swap in human brain cells for a mouse's cortex", "link": "https://arstechnica.com/science/2026/09/researchers-swap-in-human-brain-cells-for-a-mouses-cortex/", "summary": "In recent years, there has been a lot of excitement about the potential for studying human diseases in what are called \"organoids.\" These small patches of tissue, formed using stem cells, appear to produce many of the same cell types and at least some of the structures normally formed in actual organs, and thus can provide a better model for diseases that rely on the sometimes complex interactions among multiple specialized cell types that are a feature of the human body. But even the most sophisticated organoids lack a lot of the features of a real human body. This is especially true for brain organoids, which don't form any of the connections with specialized brain structures needed to behave \"normally.\" On Wednesday, a research group at Stanford University described a possible way to study brain organoids in a somewhat more natural context: They genetically wiped out a large portion of the mouse brain and replaced it with human brain organoid cells. The replacements Organoids, because they adopt a three-dimensional tissue structure and consist of various specialized cells, provide a much better model for an intact tissue than simply having a bunch of disassociated cells lying flat on a culture dish. But they still have a lot of limitations—they're not hooked up to a circulatory system that allows the liver to process chemicals the organoid produces and don't have immune cells moving through them, to give just a couple of examples. Read full article Comments", "date_str": "2026-09-16T19:08:34+00:00", "hash": "7a627542061a1475", "title_fa": "محققان سلول های مغز انسان را با قشر موش عوض می کنند", "summary_fa": "در سال‌های اخیر، هیجان زیادی در مورد پتانسیل مطالعه بیماری‌های انسانی در آنچه «ارگانوئیدها» نامیده می‌شوند، وجود داشته است. این تکه‌های کوچک بافت که با استفاده از سلول‌های بنیادی تشکیل شده‌اند، به نظر می‌رسد که بسیاری از انواع سلول‌های مشابه و حداقل برخی از ساختارهایی را که به طور معمول در اندام‌های واقعی تشکیل می‌شوند، تولید می‌کنند، و بنابراین می‌توانند مدل بهتری برای بیماری‌هایی ارائه کنند که متکی بر تعاملات گاهی پیچیده میان انواع سلول‌های تخصصی متعدد است که از ویژگی‌های بدن انسان است. اما حتی پیچیده ترین ارگانوئیدها نیز فاقد بسیاری از ویژگی های بدن واقعی انسان هستند. این امر به ویژه در مورد ارگانوئیدهای مغزی صدق می کند، که هیچ یک از اتصالات را با ساختارهای مغزی تخصصی که برای رفتار \"عادی\" لازم است، ایجاد نمی کنند. روز چهارشنبه، یک گروه تحقیقاتی در دانشگاه استنفورد، روشی ممکن برای مطالعه ارگانوئیدهای مغزی در یک زمینه طبیعی تر را توصیف کرد: آنها به طور ژنتیکی بخش بزرگی از مغز موش را از بین بردند و سلول های ارگانوئیدی مغز انسان را جایگزین آن کردند. ارگانوئیدهای جایگزین، به دلیل اینکه ساختار بافتی سه بعدی دارند و از سلول‌های تخصصی مختلف تشکیل شده‌اند، مدل بسیار بهتری را برای یک بافت دست‌نخورده ارائه می‌کنند تا صرفاً داشتن دسته‌ای از سلول‌های جداشده که روی یک ظرف کشت قرار دارند. اما آن‌ها هنوز محدودیت‌های زیادی دارند – به یک سیستم گردش خون متصل نیستند که به کبد اجازه می‌دهد مواد شیمیایی را که ارگانوئید تولید می‌کند پردازش کند و سلول‌های ایمنی در حال حرکت از طریق آنها نباشد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری در سال های اخیر، هیجان زیادی در مورد پتانسیل مطالعه بیماری های انسانی در آنچه \"ارگانوئیدها\" نامیده"}, {"source": "Ars Technica", "title": "Scientists develop new method for deciphering ancient scrolls", "link": "https://arstechnica.com/science/2026/09/why-researchers-made-their-own-model-herculaneum-scrolls/", "summary": "The Vesuvius Challenge is an ongoing project that combines \"digital unwrapping\" with crowdsourced machine learning to decipher the so-called Herculaneum scrolls, badly charred 2,000-year-old papyri too fragile to be physically unrolled. The effort just got an additional boost. A team of researchers created their own contemporary model papyrus scrolls—charring them just like the originals—to validate a screening method to determine which of the Herculaneum scrolls were written in lead-based ink and hence are the most promising candidates for further analysis. They described the process in a new paper published in the journal PLoS ONE. As previously reported , the ancient Roman resort town of Pompeii wasn’t the only city destroyed in the catastrophic 79 AD eruption of Mount Vesuvius . Several other cities in the area, including the wealthy enclave of Herculaneum, were fried by clouds of hot gas, called pyroclastic pulses and flows. But still, some remnants of Roman wealth survived. One palatial residence in Herculaneum—believed to have once belonged to a man named Piso—contained hundreds of priceless written scrolls made from papyrus, singed into carbon by volcanic gas. The scrolls stayed buried under volcanic mud until they were excavated in the 1700s from a single room that archaeologists believe held the personal working library of an Epicurean philosopher named Philodemus. The few opened fragments helped scholars identify various Greek philosophical texts, including On Nature by Epicurus and several by Philodemus himself, as well as a handful of Latin works. But the more than 600 rolled-up scrolls were so fragile that it was long believed they would never be readable, since even touching them could cause them to crumble. Read full article Comments", "date_str": "2026-09-16T18:43:23+00:00", "hash": "081515d15d2c8abc", "title_fa": "دانشمندان روش جدیدی برای رمزگشایی طومارهای باستانی ابداع کردند", "summary_fa": "چالش Vesuvius پروژه‌ای در حال انجام است که «باز کردن دیجیتال» را با یادگیری ماشینی جمع‌سپاری برای رمزگشایی به اصطلاح طومارهای هرکولانیوم، پاپیروس‌های 2000 ساله بد ذغالی شده و شکننده‌تر از آن‌ها که از نظر فیزیکی باز نمی‌شوند، ترکیب می‌کند. تلاش فقط یک تقویت اضافی دریافت کرد. تیمی از محققین طومارهای پاپیروس مدل معاصر خود را ایجاد کردند - آنها را درست مانند نمونه‌های اصلی زغال می‌کردند - تا روش غربالگری را تأیید کنند تا مشخص شود کدام یک از طومارهای هرکولانیوم با جوهر مبتنی بر سرب نوشته شده‌اند و از این رو امیدوارکننده‌ترین نامزدها برای تجزیه و تحلیل بیشتر هستند. آنها این فرآیند را در مقاله جدیدی که در مجله PLoS ONE منتشر شده است، شرح دادند. همانطور که قبلا گزارش شده بود، شهر تفریحی روم باستان پمپئی تنها شهری نبود که در فوران فاجعه‌بار 79 پس از میلاد کوه وزوویوس ویران شد. چندین شهر دیگر در این منطقه، از جمله منطقه ثروتمند هرکولانیوم، توسط ابرهای گاز داغ، به نام پالس ها و جریان های آذرآواری سرخ شده بودند. اما هنوز برخی از بقایای ثروت روم باقی مانده است. یکی از اقامتگاه‌های قصری در هرکولانیوم - که گمان می‌رود زمانی متعلق به مردی به نام پیسو بوده است - حاوی صدها طومار گرانبها نوشته شده از پاپیروس است که توسط گازهای آتشفشانی به کربن تبدیل شده است. این طومارها در زیر گل آتشفشانی مدفون ماندند تا اینکه در دهه 1700 از اتاقی که باستان شناسان معتقدند کتابخانه شخصی یک فیلسوف اپیکوری به نام فیلودموس در آن قرار داشت، حفاری شدند. چند قطعه باز شده به محققان کمک کرد تا متون مختلف فلسفی یونانی را شناسایی کنند، از جمله درباره طبیعت اثر اپیکور و چندین مورد از خود فیلودموس، و همچنین تعداد انگشت شماری از آثار لاتین. اما بیش از 600 طومار پیچ‌خورده آنقدر شکننده بودند که مدت‌ها تصور می‌شد"}, {"source": "Ars Technica", "title": "The Specialized Diverge 4 Pro makes rough gravel your playground", "link": "https://arstechnica.com/reviews/2026/09/the-specialized-diverge-pro-4-makes-rough-gravel-your-playground/", "summary": "When I make my yearly trip to Denver, I always bring my road bike. It's my annual chance to suffer on the kinds of gradients unavailable in the glacier-scoured lands of northeastern Illinois. In advance of this year's trip, Specialized hooked me up with its new gravel bike, the Diverge 4 Pro , so I brought it with me to challenge it in ways not possible on the fastidiously groomed gravel trails of suburban Chicago. In contrast to the Specialized Turbo Creo 2 we reviewed a couple of years ago, the Diverge 4 Pro is strictly human-powered. Specialized calls it \"the ultimate getaway vehicle,\" designed with input from off-road adventure riders, scientists, and racers. It's marketed as the only gravel bike you need for racing, adventure, and distance rides. While I can't speak to its racing performance, I can say the Diverge 4 Pro is a blast on any kind of gravel and does well enough on the road. Priced at $8,249, the Diverge 4 Pro is designed for rough trails and technical descents, both of which unfolded below me at the summit of an is-it-gravel-or-is-it-single-track climb in Douglas County, Colorado. I took a deep breath, and down I went. The descent was rutted and slightly more technical than anything I'll ever run into around Chicago, but I had enough time on the bike to realize that if I had trouble on the descent, it wouldn't be the bike's fault. Read full article Comments", "date_str": "2026-09-16T18:11:53+00:00", "hash": "12e929c7f7953058", "title_fa": "Specialized Diverge 4 Pro باعث می شود که زمین بازی شما شن های زبر باشد", "summary_fa": "وقتی سفر سالانه خود را به دنور انجام می دهم، همیشه دوچرخه جاده ام را می آورم. این شانس سالانه من برای رنج بردن از انواع شیب های غیرقابل دسترس در زمین های یخ زده شمال شرقی ایلینوی است. قبل از سفر امسال، Specialized من را با دوچرخه سنگریزه جدید خود، Diverge 4 Pro مرتبط کرد، بنابراین من آن را با خودم آوردم تا در مسیرهای سنگریزه شده شیکاگو به شیوه ای غیرممکن به چالش بکشم. برخلاف Specialized Turbo Creo 2 که چند سال پیش بررسی کردیم، Diverge 4 Pro کاملاً با نیروی انسانی کار می‌کند. Specialized آن را \"وسیله نقلیه فرار نهایی\" می نامد، که با نظرات سواران ماجراجویی خارج از جاده، دانشمندان و مسابقه دهندگان طراحی شده است. این تنها دوچرخه سنگریزه ای است که برای مسابقه، ماجراجویی و مسافت سواری نیاز دارید. در حالی که نمی توانم در مورد عملکرد مسابقه ای آن صحبت کنم، می توانم بگویم که Diverge 4 Pro بر روی هر نوع سنگ ریزه ای قوی است و به اندازه کافی در جاده خوب عمل می کند. دیورج 4 پرو با قیمت 8249 دلار، برای مسیرهای ناهموار و فرودهای فنی طراحی شده است، که هر دوی آنها در زیر من در قله صعود تک مسیری است که در داگلاس کانتی، کلرادو قرار دارد، آشکار شده است. نفس عمیقی کشیدم و رفتم پایین. فرود ناهموار بود و کمی فنی تر از هر چیزی که تا به حال در اطراف شیکاگو با آن برخورد خواهم کرد، اما زمان کافی روی دوچرخه داشتم تا بفهمم که اگر در سراشیبی مشکل داشتم، تقصیر دوچرخه نیست. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای ناوبری به حداقل برسانید وقتی سفر سالانه خود را به دنور انجام می‌دهم، همیشه دوچرخه جاده‌ام"}, {"source": "Ars Technica", "title": "It’s OK to tell ICE their actions will haunt them, judge rules in speech fight", "link": "https://arstechnica.com/tech-policy/2026/09/its-ok-to-tell-ice-their-actions-will-haunt-them-judge-rules-in-speech-fight/", "summary": "It’s not illegal to send an email telling Immigration and Customs Enforcement (ICE) officials that their actions will haunt them, a federal judge ruled Tuesday, granting a preliminary injunction that blocks ICE from threatening to prosecute a critic for protected speech. Back in January, David Streever sent a scathing three-paragraph email to then-acting director of ICE, Todd Lyons. Outraged by the killings of two Minnesota protestors against ICE, Renee Good and Alex Pretti, Streever told Lyons that he was a “monstrous human being” who will eat himself “alive with shame” for defending officers who shot people who posed no threat and had no weapons. Comparing Lyons to an infamous high-ranking Nazi cop, Streever predicted that “even Trump” would one day turn on Lyons for defending the “obvious” slayings of Americans. David Streever's email to ICE. Credit: via FIRE “You are a monstrous human being and will go down in history as America’s Reinhard Heydrich, the butcher,” Streever wrote. “You will never know peace. You will seek to lose yourself, to escape the burden of knowing the truth about yourself. But wherever you go, you will find yourself. You will torment you  و گران‌ترین مدل اکنون از نور UV برای کمک به یافتن لکه‌های کف شما استفاده می‌کند. در نهایت، آن‌ها سیستمی دارند که Dyson آن را «سیستم ضبط دوقلو» می‌نامد تا گرد و غبار و زباله‌ها را هم در کف‌های سخت و هم روی فرش‌ها جمع‌آوری کند. ارزان‌ترین مدل R1 فقط جاروبرقی است، در حالی که R2 و R3 هر دو هیبریدی جاروبرقی هستند. اما R2 فقط در Costco در دسترس خواهد بود،"}, {"source": "Wired", "title": "Here’s What Snap’s Expensive Specs Can Actually Do", "link": "https://www.wired.com/story/what-snap-expensive-specs-can-actually-do/", "summary": "Snap thinks its chunky, pricey smart glasses are the future of human computing, powered by a new AI app and features that do everything from translating languages to improving your golf swing.", "date_str": "2026-09-16T23:40:00+00:00", "hash": "21c2fdb3200ce9e2", "title_fa": "در اینجا چیزی است که مشخصات گران قیمت اسنپ واقعاً می تواند انجام دهد", "summary_fa": "اسنپ ​​فکر می‌کند عینک‌های هوشمند بزرگ و گران‌قیمتش آینده محاسبات انسان هستند که با یک برنامه جدید هوش مصنوعی و ویژگی‌هایی که همه کارها از ترجمه زبان‌ها گرفته تا بهبود حرکت گلف شما را انجام می‌دهند، طراحی شده است. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Snap، شرکت سازنده اسنپ چت و یک جفت عینک هوشمند واقعیت افزوده جدید 2195 دلاری، بالاخره اطلاعات بیشتری در مورد آنچه عینک هایش واقعا می توانند انجام دهند را به اشتراک می گذارد. جزئیات در یک رویداد راه اندازی در لس آنجلس، جایی که این شرکت همچنین یک سرویس هوش مصنوعی جدید را معرفی کرد که پیش بینی می کند هنگام استفاده از عینک چه کاری انجام دهید - یا حتی فقط با استفاده از تلفن یا لپ تاپ خود. اسنپ ​​آخرین مشخصات خود را در ماه ژوئن در کنفرانس فناوری Augmented World Expo اعلام کرد. این شرکت می گوید که در پاییز امسال ارسال آنها به خریداران را آغاز خواهد کرد. آن‌ها گران هستند و پوشیدن آن‌ها بزرگ و سنگین به نظر می‌رسند، حتی روی گوش‌های اوان اشپیگل، مدیرعامل اسنپ، زمانی که در مراسم رونمایی AWE از آن‌ها استفاده کرد، ناراحت‌کننده هستند، چیزی که او به‌طور گسترده‌ای به خاطر آن در فضای مجازی مورد تمسخر قرار گرفت و مردم را نگران کرد که این عینک چقدر راحت قرار می‌گیرد. (اشپیگل بعداً با تصویری از گوش بدون بار خود در X پست کرد و نوشت: «گوش من اینگونه است.») با وجود این، اشپیگل و شرکت بارها تکرار کردند که هدف اسنپ با این عینک این است که «محاسبات را انسانی‌تر کند». در اینجا مواردی وجود دارد که می توانید با عینک های مشخصات انجام دهید: اسنپ همچنین مشخصات را به عنوان یک محصول سازمانی معرفی می کند. این شرکت با Salesforce، Amazon و Nvidia همکاری می کند تا"}, {"source": "Wired", "title": "An OpenAI Agent Tried to Jailbreak Itself", "link": "https://www.wired.com/story/openai-releases-new-policy-for-reporting-incidents-of-model-misalignment/", "summary": "The company also disclosed previously unreported incidents in which its AI models behaved in misaligned ways, including uploading files to the internet without being asked.", "date_str": "2026-09-16T22:07:24+00:00", "hash": "29d5ce30027c15c8", "title_fa": "یک عامل OpenAI سعی کرد خودش از زندان فرار کند", "summary_fa": "این شرکت همچنین مواردی را که قبلا گزارش نشده بود را افشا کرد که در آن مدل‌های هوش مصنوعی آن به شیوه‌های ناهماهنگی رفتار می‌کردند، از جمله آپلود فایل‌ها در اینترنت بدون درخواست. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان OpenAI در روز چهارشنبه چارچوب جدیدی را برای نحوه افشای عمومی حوادث ناهماهنگی هوش مصنوعی اعلام کرد که شرکت می گوید امیدوار است به اطلاع رسانی استانداردهای مشابه در سراسر صنعت کمک کند. این شرکت همچنین در حال انتشار اطلاعات جدیدی در مورد چندین نمونه از ناهماهنگی مدل هوش مصنوعی است که در سال گذشته شناسایی کرده است، از جمله یکی که در آن به نظر می رسد یک عامل هوش مصنوعی به خود \"دستورالعمل هایی مانند جیلبریک\" داده است. کای چن، رئیس تازه منصوب شده تحقیقات همسویی OpenAI، به WIRED می‌گوید: «با پیشرفت و گسترش مدل‌ها، تصمیم‌گیری در مورد توسعه هوش مصنوعی به شواهدی نیاز دارد که افراد خارج از شرکت‌های سازنده مدل‌های مرزی بتوانند آن را بررسی کنند. ما معتقد نیستیم که صنعت هوش مصنوعی همسویی و نظارت را به میزان کافی برای ادامه مقیاس‌پذیری مسئولانه با حداکثر سرعت حل کرده است.» در یک جلسه توجیهی با WIRED، یک مقام OpenAI گفت که این شرکت قبلاً حوادث ناهماهنگی را به ندرت افشا می کرد. این مقام که به شرط ناشناس ماندن با این جلسه موافقت کرد، گفت که چارچوب جدید به گونه‌ای طراحی شده است که OpenAI را آسان‌تر می‌کند تا به سرعت به مردم اطلاع دهد وقتی متوجه شد که مدل‌های هوش مصنوعی خود به شیوه‌های غیرمنتظره‌ای رفتار می‌کنند، حتی قبل از اینکه بتواند به طور کامل رفتار را بررسی، توضیح دهد یا کاهش دهد. این چارچوب روش‌هایی را برای کارمندان OpenAI ارائه می‌کند تا حوادث ناهماهنگی را به مدیران ارشد ایمنی و هم‌ترازی شرکت گزارش دهند، که سپس تعیین می‌کنند"}, {"source": "Wired", "title": "Washington Won’t Be Regulating AI Anytime Soon", "link": "https://www.wired.com/story/washington-wont-be-regulating-ai-anytime-soon/", "summary": "Even with mounting concerns about AI models going rogue, legislation appears unlikely, and the White House is outright opposed to oversight.", "date_str": "2026-09-16T21:00:00+00:00", "hash": "aee879ac127ac16c", "title_fa": "واشنگتن به زودی هوش مصنوعی را تنظیم نخواهد کرد", "summary_fa": "حتی با وجود نگرانی‌های فزاینده در مورد مدل‌های هوش مصنوعی، قانونگذاری بعید به نظر می‌رسد و کاخ سفید کاملاً با نظارت مخالف است. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان برای هفته‌ها، واشنگتن در میان نگرانی‌های فزاینده در مورد خطرات سرکشی مدل‌های هوش مصنوعی مرزی با توانایی بالا، سر و صدای زیادی در مورد نیاز به اجرای نوعی مقررات هوش مصنوعی داشت. اما دلیلی وجود ندارد که فکر کنیم هر اقدامی بتواند حمایت کاخ سفید را جلب کند، جایی که مقامات پس از اینکه دونالد ترامپ رئیس جمهور آمریکا بر این ایده تاکید کرد، کار ایجاد یک نهاد نظارتی به سبک FINRA را متوقف کرده اند، یا کنگره هیل، جایی که قانونگذاران پیشنهادهای رقابتی دارند که رای لازم برای تصویب ندارند. به گفته منابع آگاه، دستیاران کاخ سفید در ابتدا شروع به طراحی چارچوبی برای یک آژانس نظارت بر هوش مصنوعی مرتبط با دولت کردند، پس از اینکه دمیس حسابیس، بنیانگذار Google DeepMind این ایده را در مقاله ای در 14 جولای و در جلسات توجیهی برای مقامات ارشد مطرح کرد. وزارت خزانه‌داری و دفتر سیاست‌گذاری علم و فناور لی در تابستان و یک فروش ثانویه - به نام Prime Big Deal Days - در پاییز دارد. امسال، Prime Big Deal Days در روزهای سه‌شنبه و چهارشنبه، ۶ اکتبر و ۷ اکتبر برگزار می‌شود. این رویداد در ساعت ۳:۰۱ صبح به وقت شرقی (نیمه‌شب اقیانوس آرام) آغاز می‌شود و به مدت ۴۸ ساعت ادامه دارد. معاملات جدید سه بار در هر روز از رویداد، در ساعت‌های 3 صبح، 11 صبح، و 4 بعد از ظهر به وقت شرقی، با معاملات لایتنینگ به صورت پراکنده کاهش می‌یابد. WIRED بهترین معاملات را از طرف آمازون و خرده فروشانی که فروش رقابتی دارند"}, {"source": "Wired", "title": "MacOS 27 Golden Gate: Top New Features", "link": "https://www.wired.com/story/macos-27-golden-gate-top-features/", "summary": "Siri’s reintroduction takes center stage as Apple officially rolls out the latest version of macOS to download and install.", "date_str": "2026-09-16T19:29:15+00:00", "hash": "be93affd359bf798", "title_fa": "MacOS 27 Golden Gate: برترین ویژگی های جدید", "summary_fa": "معرفی مجدد سیری در مرکز توجه قرار می گیرد زیرا اپل به طور رسمی آخرین نسخه macOS را برای دانلود و نصب عرضه می کند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان آخرین نسخه سیستم عامل مک اپل به طور رسمی در 14 سپتامبر عرضه شد. MacOS 27 Golden Gate در ماه ژوئن در WWDC معرفی شد، اما اکنون برای بارگیری مستقیم در Mac شما در دسترس است - با فرض اینکه یک سیستم عامل سازگار دارید. راه اندازی Siri AI ویژگی بزرگ جدید است که اولین تلاش جدی اپل برای ادغام عمیق قابلیت های هوش مصنوعی در macOS است. من ماه‌هاست که با به‌روزرسانی نرم‌افزار بازی می‌کنم، و اکنون برای هر کسی در دسترس است تا آن را امتحان کند. به روز شده در سپتامبر 2026: اکنون که macOS 27 به طور رسمی در جهان عرضه شده است، برخی از تصاویر عملی را اضافه کرده ایم. آیا مک شما با macOS Golden Gate سازگار است؟ به روز رسانی جدید، macOS 27 Golden Gate، تنها با مک های Apple Silicon سازگار است. سال گذشته، اپل اعلام کرد که macOS 26 Tahoe آخرین آپدیت برای پشتیبانی از مک های مجهز به اینتل خواهد بود. لیست کامل دستگاه‌های پشتیبانی‌شده در اینجا آمده است: برخی از ویژگی‌های پیشرفته‌تر Apple Intelligence، مانند ید. برای PitchFly، من پروژه‌ای را کدگذاری کردم که در آن مغز کوچک دیجیتال مگس سرکه ایده‌های داستانی تولید می‌کند. (مطمئن نیستم که چرا مگس کلاه کوچکی بر سر دارد، اما سبک آن را دوست دارم.) این شامل جمع آوری صدها عنوان محبوب ترین داستان از سایت در سال گذشته و وارد کردن آنها به کانکتوم بود. من کدکس را وادار کردم تا کار سختی را انجام دهد، و تصمیم گرفت که کارآمدترین رویکرد تبدیل تیترها به کلمات و عبارات، سپس تبدیل آنها به نمایشی است که یک شبکه"}, {"source": "Wired", "title": "The Best Movies to Stream This Month (September 2026)", "link": "https://www.wired.com/story/the-8-best-movies-to-stream-right-now/", "summary": "The Mandalorian and Grogu, The Wild Robot, and Obsession are among the must-watch films arriving this month.", "date_str": "2026-09-16T18:23:37+00:00", "hash": "7ce0f9e2972d5fed", "title_fa": "بهترین فیلم‌های پخش در این ماه (سپتامبر ۲۰۲۶)", "summary_fa": "Mandalorian و Grogu، The Wild Robot و Obsession از جمله فیلم‌هایی هستند که باید در این ماه تماشا کنید. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان پاییز اینجاست و نوبت پاییز فصلی از بازگشت را نشان می دهد. بازگشت به مدرسه، بازگشت به سر کار - و وقتی نوبت به بهترین فیلم‌ها در سرویس‌های پخش می‌شود، به برخی از بهترین فیلم‌های سال گذشته برمی‌گردیم. در سپتامبر، بازسازی درخشان The Thing به کارگردانی جان کارپنتر در سال 1982 به پرایم ویدئو راه می‌یابد، عنصر پنجم لوک بسون در نت‌فلیکس، ذهن‌برانگیز و چشم‌نواز، و انفجار غیرمنتظره‌ای از گذشته به Hulu در قالب فیلم The X-Files: I Want to Believenshtech''s Believenshtera's Live. دومین مورد سینمایی سال 2008 برای مولدر و اسکالی که اکنون به دیدگاه اصلی کریس کارتر خالق آن نزدیکتر شده است. با این حال، حتی تازه واردها نیز در این ماه طعمی قدیمی دارند. اسپین‌آف جنگ ستارگان، Mandalorian and Grogu، شکارچیان جایزه بزرگ را برای یک ماجراجویی با رنگ‌های قدیمی به دیزنی+ بازمی‌گرداند، نتفلیکس Mobile Suit Gundam: Hathaway در دنیای انیمه‌های کلاسیک دهه 1970 گسترش می‌یابد، و Edge of Tomorrow در Paramount+ نشان می‌دهد که فرار از گذشته در بهترین زمان‌ها سخت است. ‌کند. این داستان در The Next Web ادامه دارد: «تصمیم‌گیری‌ها در مورد اینکه چگونه توسعه هوش مصنوعی باید در ماه‌ها و سال‌های آینده پیش برود، نیاز به شواهدی دارد که افراد خارج از شرکت‌های سازنده مدل‌های مرزی می‌توانند خودشان بررسی کنند. هر شش مورد شامل مدل های تحقیقاتی منتشر نشده یا دوره های آموزشی است. OpenAI هر کدام را در یک صفحه جدید گزارش‌های اشتباه منتشر کرد. به گفته اکسیوس، اولین مورد از شش حادثه به اکتبر برمی گردد. Axios گزارش داد که آپلودها در سرویس های میزبانی فایل عمومی در ماه های اکتبر و ژانویه انجام شده است. هر کارمند OpenAI می تواند یک مورد مشکوک را علامت گذاری کند. سپس کارکنان فنی بررسی و تصمیم می گیرند که آیا آن را افشا کنند یا خیر. گروه مشاوره ایمنی OpenAI اختلافات را حل می کند و موارد حل نشده به سمت رهبری شرکت می رود. پرونده ها در یکی از سه مسیر پیش می روند: آماده برای افشا، تحقیقات جزئی یا تحقیقات بزرگتر. اکسیوس گزارش داد که OpenAI مواردی را که ظرف شش روز کاری آماده می شوند و تحقیقات جزئی را در 12 روز منتشر می کند. مسیر بزرگتر موارد پیچیده‌ای را پوشش می‌دهد که اشخاص ثالث یا نگرانی‌های امنیتی را در بر می‌گیرند و ممکن است مدت بیشتری طول بکشد. کای چن، سرپرست تحقیقات تیم همسویی OpenAI، به Axios گفت: «در حال حاضر هیچ چارچوب صنعتی با استانداردهای افشای صریح وجود ندارد، بنابراین ما داوطلبانه این گام را"}, {"source": "The Next Web", "title": "EU-backed Scaleup Europe Fund in talks to invest in ElevenLabs", "link": "https://thenextweb.com/news/elevenlabs-funding-scaleup-europe-fund-talks", "summary": "The Scaleup Europe Fund, a €5bn growth fund backed by the European Commission, is in discussions to invest in the voice AI company ElevenLabs, according to Bloomberg. The report says ElevenLabs aims to raise over $500 million in this funding round. Talks are ongoing, and there is no guarantee a deal will happen, according to [ ] This story continues at The Next Web", "date_str": "2026-09-17T11:24:55+00:00", "hash": "8b849232391caf3c", "title_fa": "صندوق اروپایی Scaleup با حمایت اتحادیه اروپا در حال مذاکره برای سرمایه گذاری در ElevenLabs است", "summary_fa": "به گزارش بلومبرگ، صندوق Scaleup Europe، یک صندوق رشد 5 میلیارد یورویی با حمایت کمیسیون اروپا، در حال مذاکره برای سرمایه گذاری در شرکت هوش مصنوعی صوتی ElevenLabs است. در این گزارش آمده است که ElevenLabs قصد دارد بیش از 500 میلیون دلار در این دور مالی جمع آوری کند. گفتگوها در حال انجام است و هیچ تضمینی وجود ندارد که یک معامله اتفاق بیفتد، طبق [ ] این داستان در The Next Web ادامه دارد. این شرکت در ماه آگوست سری F یک میلیارد یورویی Iceye را رهبری کرد، در دور 400 میلیون دلاری Lovable با ارزش 13.3 میلیارد دلار، Mistral AI در سری D 3 میلیارد یورویی، و این هفته در سری B 100 میلیون دلاری Tandem Health شرکت کرد. کمیسیون یک میلیارد یورو به همراه Allianz، APG، Novo Holdings، CriteriaCaixa و Santander’s Mouro Capital در این صندوق سرمایه گذاری کرد. هدف این صندوق این است که شکاف سرمایه گذاری در مراحل پایانی اروپا را ببندد، به طوری که شرکت های امیدوار کننده بتوانند به جای جستجوی سرمایه گذاران آمریکایی، سرمایه خود را افزایش دهند و در اروپا باقی بمانند. روی کاغذ، ElevenLabs یک انتخاب غیرعادی است. این شرکت در لندن، خارج از اتحادیه اروپا مستقر است، اما بنیانگذاران آن، مدیرعامل Mati Staniszewski و Piotr Dąbkowski اهل ورشو هستند و این شرکت در حال گسترش تیم خود در لهستان است. بانک توسعه دولتی لهستان در ماه ژوئن سهام کوچکی را خریداری کرد. این شرکت مدل‌های هوش مصنوعی را توسعه می‌دهد که صداها را برای دوبله، کتاب‌های صوتی، تبلیغات و مراکز تماس ایجاد و شبیه‌سازی می‌کند. در ماه فوریه، 500 میلیون دلار در دوری به رهبری Sequoia Capital جمع آوری کرد و ارزش آن را به 11 میلیارد دلار رساند. این شرکت همچنین بیش از 330 میلیون دلار درآمد مکرر سالانه برای سال 2025 گزارش کرد. در ژوئیه، بلومبرگ"}, {"source": "The Next Web", "title": "Judge’s full ruling puts Google’s ad tech business under a monitor for six years", "link": "https://thenextweb.com/news/google-ad-tech-ruling-unsealed", "summary": "Google must open its ad auctions to rivals and accept years of outside oversight, according to the full decision in the US government’s ad tech case, unsealed on Wednesday. US District Judge Leonie Brinkema ruled on 2 September that Google would not have to sell its AdX ad exchange, and gave both sides two weeks [ ] This story continues at The Next Web", "date_str": "2026-09-17T11:06:27+00:00", "hash": "ad8d59648bfd76fa", "title_fa": "حکم کامل قاضی، تجارت فناوری تبلیغات گوگل را به مدت شش سال تحت نظارت قرار می دهد", "summary_fa": "بر اساس تصمیم کامل در پرونده فناوری تبلیغاتی دولت ایالات متحده که روز چهارشنبه منتشر شد، گوگل باید حراج های تبلیغاتی خود را به روی رقبا باز کند و سال ها نظارت خارجی را بپذیرد. قاضی ناحیه ایالات متحده، لئونی برینکما، در 2 سپتامبر حکم داد که گوگل مجبور نیست مبادله تبلیغات AdX خود را بفروشد، و به هر دو طرف دو هفته مهلت داد [ ] این داستان در The Next Web ادامه دارد. راه‌حل‌ها «برای بازکردن مؤثر بازارهای فناوری تبلیغاتی که به دلیل رفتار غیرقانونی Google آسیب دیده‌اند، کافی خواهد بود، و از بازگرداندن Brinkpet در این anticom به بازار60 کافی است.» تصمیم گیری این تغییرات، اصطلاح پیشنهادی گوگل، به جای 15 سال مورد نظر وزارت دادگستری و ایالت هایی که به این پرونده پیوستند، شش سال طول خواهد کشید. دادگاه نیوز گزارش داد که اگر حکم به هدف خود نرسیده باشد، دادگاه می تواند این دوره را تمدید کند. حساب ها در مورد نحوه عملکرد نظارت متفاوت است. رویترز گزارش داد که گوگل باید یک ناظر داخلی برای انطباق آنتی تراست منصوب کند. AdExchanger یک مانیتور فنی منصوب از سوی دادگاه را با دسترسی کامل به کارکنان، سیستم‌ها و کد منبع Google توصیف کرد. دادگاه نیوز گفت که هر دو طرف یک ناظر و یک کمیته فنی را پیشنهاد کردند. هسته سفارش پیوند بین دو ابزار اصلی ناشر Google را می شکند. وب سایت هایی که از سرور تبلیغاتی DFP خود استفاده می کنند دیگر نیازی به استفاده از AdX ندارند. به گفته AdExchanger، AdX باید با همان شرایطی که DFP ارائه می دهد، به سرورهای تبلیغاتی ناشر رقیب پیشنهاد دهد. Google همچنین باید AdX و DFP را به Prebid متصل کند، ناشران چارچوب مناقصه سرصفحه منبع باز که برای دریافت پیشنهادهای رقابتی خارج از کنترل Google اتخاذ شده است."}, {"source": "The Next Web", "title": "Japan and the US are discussing a GlobalFoundries chip plant under their $550bn pact, Nikkei reports", "link": "https://thenextweb.com/news/japan-and-the-us-are-discussing-a-globalfoundries-chip-plant-under-their-550bn-pact-nikkei-reports", "summary": "According to a report by Nikkei Asia on Thursday, Japan and the United States are negotiating to set up a semiconductor factory as part of their $550bn investment agreement. The project would be worth between ¥2trn and ¥3trn ($12.9bn and $19.3bn) and will be run by the US chipmaker GlobalFoundries, which makes logic chips. Nikkei [ ] This story continues at The Next Web", "date_str": "2026-09-17T10:53:25+00:00", "hash": "bc9cc685824abd95", "title_fa": "به گزارش نیکی، ژاپن و ایالات متحده در حال مذاکره بر روی یک کارخانه تراشه GlobalFoundries تحت پیمان 550 میلیارد دلاری خود هستند.", "summary_fa": "بر اساس گزارشی که روز پنجشنبه توسط Nikkei Asia منتشر شد، ژاپن و ایالات متحده در حال مذاکره برای راه اندازی یک کارخانه نیمه هادی به عنوان بخشی از قرارداد سرمایه گذاری 550 میلیارد دلاری خود هستند. ارزش این پروژه بین 2 تا 3 تریلیون ین (12.9 میلیارد دلار و 19.3 میلیارد دلار) خواهد بود و توسط سازنده تراشه آمریکایی GlobalFoundries که تراشه های منطقی تولید می کند، اجرا خواهد شد. Nikkei [ ] این داستان در The Next Web ادامه دارد Nikkei هیچ منبعی ارائه نکرده است و این گزارش شامل آدرس کارخانه نمی‌شود. هیچ یک از دولت ها هیچ اظهار نظر عمومی نکرده اند. تعهد 550 میلیارد دلاری بخشی از توافق تجاری توکیو بود که بر اساس آن تعرفه های ایالات متحده بر اکثر محصولات ژاپنی به 15 درصد محدود شد. مقامات ژاپنی پروژه هایی را که تامین مالی می کند انتخاب و اعلام می کنند و دو قسط اول به مبلغ 109 میلیارد دلار به نیروگاه های نفت، گاز، مواد معدنی، انرژی هسته ای و نیروگاه های گازی اختصاص یافت. پول مورد بحث هنوز برای تراشه یا هوش مصنوعی خرج نشده است. وزیر تجارت ژاپن ماه گذشته اظهار داشت که این دو فناوری در مجموعه پروژه های بعدی \"وزن بسیار مهمی\" خواهند داشت. اولین پروژه تراشه تحت این قرارداد، کارخانه ای خواهد بود که توسط GlobalFoundries اداره می شود. این شرکت تراشه‌های منطقی بالغ و تخصصی را برای استفاده در خودروها، تلفن‌ها و تجهیزات صنعتی تولید می‌کند، نه پردازنده‌های پیشرفته‌ای که برای آموزش مدل‌های هوش مصنوعی به کار می‌روند. مهم ترین اخبار فنی را هر هفته در صندوق ورودی خود دریافت کنید."}, {"source": "The Next Web", "title": "US and Chinese security experts propose nuclear-style safeguards for military AI", "link": "https://thenextweb.com/news/us-china-experts-nuclear-style-ai-safeguards", "summary": "Security experts from the US and China have proposed a set of safeguards for military AI modelled on the rules that grew up around nuclear weapons, including a ban on letting AI decide whether to launch them, Reuters reported. The recommendations, published last week, come from the US-China AI and National Security Dialogue, a track [ ] This story continues at The Next Web", "date_str": "2026-09-17T10:42:29+00:00", "hash": "091283caba4b28cc", "title_fa": "کارشناسان امنیتی ایالات متحده و چین تدابیری به سبک هسته ای برای هوش مصنوعی نظامی پیشنهاد می کنند", "summary_fa": "به گزارش رویترز، کارشناسان امنیتی از ایالات متحده و چین مجموعه‌ای از پادمان‌ها را برای هوش مصنوعی نظامی با الگوبرداری از قوانینی که حول سلاح‌های هسته‌ای رشد می‌کنند، پیشنهاد کرده‌اند، از جمله ممنوعیت اجازه دادن به هوش مصنوعی درباره پرتاب آنها. توصیه‌هایی که هفته گذشته منتشر شد، از گفتگوی هوش مصنوعی و امنیت ملی آمریکا و چین می‌آیند، یک مسیر [] این داستان در The Next Web ادامه دارد. هیچ یک از دولت ها آنها را تایید نکرده اند. هوش مصنوعی نباید به طور مستقل تصمیم به استفاده از تسلیحات هسته ای بگیرد و نباید برای حمله به سیستم های فرماندهی و کنترل هسته ای طرف مقابل استفاده شود. انسان‌ها همچنین باید کنترل هرگونه حمله سایبری نتیجه‌ای به زیرساخت‌های هسته‌ای رقیب را در دست داشته باشند. کارشناسان همچنین خواستار ایجاد یک خط ویژه ارتش آمریکا و چین برای حوادث هوش مصنوعی هستند و دو کشور در مورد معنای واقعی \"کنترل انسانی معنادار\" یک سیستم تسلیحاتی به توافق برسند. این عبارت به طور گسترده در بحث های کنترل تسلیحات استفاده می شود اما هیچ تعریف مشترکی ندارد. این ایده‌ها بر اساس توافقی است که در نوامبر 2024 به دست آمد، زمانی که جو بایدن، رئیس‌جمهور وقت و شی جین پینگ، رئیس‌جمهور چین تأیید کردند که انسان‌ها، نه ه : "2026-09-17T09:43:33+00:00", "hash": "f5fbfe64be61bb01", "title_fa": "هوش مصنوعی که قرار بود از اشتباهاتش درس بگیرد، از یک اشتباه در آزمایش سوء استفاده کرد", "summary_fa": "توسعه دهندگان می توانند سیستم های هوش مصنوعی را به روش های مختلف بهبود بخشند. رایج‌ترین روش، آموزش مجدد مدل‌ها در مجموعه داده‌های سفارشی برای کمک به آنها در انجام وظایف خاص است. اما بازآموزی و تنظیم دقیق سیستم های هوش مصنوعی بسیار گران است. به همین دلیل است که استارت‌آپ Sentient Labs به دنبال راه‌هایی برای آموزش مدل‌ها به [ ] بوده است. این داستان در The Next Web Sentient ادامه دارد، محققان Dastin Huang، Abhishek Saxena و Baran Nama تصمیم گرفتند یک سیستم هوش مصنوعی طراحی کنند که از دو مدل جداگانه استفاده می‌کند. یکی مربی هوش مصنوعی و یکی هم کارمند هوش مصنوعی. مربی قوانین یا «مهارت‌هایی» را بر اساس پاسخ‌های نادرست قبلی کارگر ایجاد می‌کند تا توانایی او در حل مشکلات را بهبود بخشد. اما تحقیقات آنها زمانی که متوجه شدند مربی هوش مصنوعی یک نقص بزرگ را در آزمایش کشف کرده است، چرخش غیرمنتظره ای به خود گرفت. همچنین دستورالعمل هایی را برای کارمند هوش مصنوعی در مورد نحوه تقلب ارائه کرد. محققان از مربی هوش مصنوعی و کارمند هوش مصنوعی خواستند تا چهار بار در دو معیار در یک کار صفحه گسترده با یکدیگر همکاری کنند. آنها دریافتند که مربی نه تنها سعی کرده از یک نقص در سیستم درجه بندی استفاده کند. همچنین در شش نوبت برای دسترسی به داده‌هایی که مجاز به انجام این کار نبود، تلاش کرد و شکست خورد. در موقعیتی دیگر، یکی از قوانین خود را حذف کرد و گزارش داد که \"آن را تقویت کرده است.\" یافته‌های آن‌ها بدون شک هشداری را که رهبران هوش مصنوعی مانند داریو آمودی، مدیر عامل آنتروپیک به صدا درآورده‌اند، می‌افزایند. آمودی اخیراً از صنعت خواسته است تا سرعت توسعه مدل مرزی را کاهش دهد تا نگرانی‌های ایمنی برطرف شود. محققان Sentient تاکید کردند که رفتار مدل‌های آن بدخواهانه نبوده است. اما یافته‌های"}, {"source": "The Next Web", "title": "EU proposes Kids Act banning social media for under-13s and capping teen use at an hour a day", "link": "https://thenextweb.com/news/eu-kids-act-social-media-under-13-ban", "summary": "Strasbourg – The Eur زنند. طبق QA کمیسیون، آنها باید ظرف شش ماه پس از اجرایی شدن قوانین بررسی کنند که آیا دارندگان حساب زیر 15 سال دارند یا خیر. هر زمان که یک سرویس یا ویژگی جدید راه اندازی می شود، یک طرح انطباق باید"}, {"source": "MIT Tech Review", "title": "The Download: mice with part-human brains and climate tech innovators", "link": "https://www.technologyreview.com/2026/09/17/1144314/the-download-mice-part-human-brains-climate-tech-innovators/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. Meet a mouse whose brain cortex is made up of human cells Multiple cameras tracked a mouse as it wandered around a small arena. A computer charted its position and speed, leaving Pong-like traces on a monitor. The reason to watch this rodent so carefully? Nearly half its brain volume had been replaced with human cells. A team at Stanford has revealed the effort to mix brain tissues of distant species this week. They previously showed that human brain organoids could survive, and even function, after being injected into the heads of baby rodents. Now, they’ve taken things a step further by genetically modifying mice so their brains don’t fully develop in the first place. The work could help scientists study brain injuries, but it also raises questions about how far these experiments should go. Here’s what the researchers discovered—and where they draw the line . —Antonio Regalado These innovators under 35 are shaping climate tech Each year, the editorial team at MIT Technology Review puts together a list of 35 Innovators Under 35 —a group of researchers, inventors, and other young minds worth following. The final slate includes nine people tackling some of the biggest challenges in climate and energy, from critical materials to cleaner industry. Their innovations include new ways to extract lithium, a furnace built to make steel cleaner and cheaper, and solid refrigerants that could cut energy consumption. There are also efforts to make AI more energy-efficient, track pollution more effectively, and turn invasive weeds and food waste into useful materials. Taken together, they tell us something about where climate tech is at this moment—and where it’s heading. Get to know the innovators and their breakthroughs . —Casey Crownhart This story is from The Spark, our weekly climate tech newsletter. Sign up to receive it in your inbox every Wednesday. Meet the rest of the honorees in our 35 Innovators Under 35 list . The must-reads I’ve combed the internet to find you today’s most fun/important/scary/fascinating stories about technology. 1 US and Chinese experts have proposed nuclear-style AI safeguards Including new red lines, human control rules, and a hotline. ( Reuters $) + US officials say they’re open to AI safety talks with China. ( Axios ) + Sam Altman will attend Trump’s state dinner for Xi. ( CNBC ) + The AI doomers ", "date_str": "2026-09-17T12:10:00+00:00", "hash": "9871b6bf082bebbf", "title_fa": "دانلود: موش هایی با مغز نیمه انسان و مبتکران فناوری آب و هوا", "summary_fa": "دوربین های متعدد یک موش را در حالی که در یک میدان کوچک پرسه می زد، ردیابی کردند. یک کامپیوتر موقعیت و سرعت خود را ترسیم کرد و ردپایی شبیه به پونگ بر روی مانیتور به جا گذاشت. دلیل تماشای این جونده با دقت؟ تقریبا نیمی از حجم مغز آن با سلول های انسانی جایگزین شده بود. تیمی در استنفورد تلاش برای مخلوط کردن بافت‌های مغز گونه‌های دوردست را در این هفته فاش کردند. آنها قبلا نشان داده بودند که ارگانوئیدهای مغز انسان پس از تزریق به سر بچه جوندگان می توانند زنده بمانند و حتی عمل کنند. اکنون، آنها با اصلاح ژنتیکی موش‌ها به گونه‌ای که مغز آنها در وهله اول به طور کامل رشد نکند، همه چیز را یک قدم فراتر برداشته‌اند. این کار می‌تواند به دانشمندان در مطالعه آسیب‌های مغزی کمک کند، اما همچنین سؤالاتی در مورد اینکه این آزمایش‌ها تا کجا باید پیش بروند، ایجاد می‌کند. در اینجا چیزی است که محققان کشف کردند - و آنها خط را در کجا ترسیم کردند. هر سال، تیم تحریریه MIT Technology Review فهرستی از 35 مبتکر زیر 35 سال - گروهی از محققان، مخترعان، و دیگر ذهن‌های جوان که ارزش دنبال کردن دارند را گرد هم می‌آورد. فهرست نهایی شامل 9 نفر است که با برخی از بزرگترین چالش‌های آب و هوا و انرژی، از مواد حیاتی گرفته تا صنایع پاک‌تر، مقابله می‌کنند. نوآوری‌های آن‌ها شامل راه‌های جدید استخراج لیتیوم، کوره‌ای که برای تمیزتر و ارزان‌تر کردن فولاد ساخته شده است، و مبردهای جامد که می‌تواند مصرف انرژی را کاهش دهد، است. همچنین تلاش‌هایی برای کارآمدتر کردن هوش مصنوعی، ردیابی مؤثرتر آلودگی و تبدیل علف‌های هرز مهاجم و زباله‌های غذایی به مواد مفید وجود دارد. در مجموع، آنها به ما چیزی در مورد اینکه فناوری آب و هوا در این لحظه کجاست و به کجا می‌رود، به ما"}, {"source": "MIT Tech Review", "title": "Meet the innovators under 35 shaping climate tech", "link": "https://www.technologyreview.com/2026/09/17/1144251/innovators-shaping-climate-tech/", "summary": "Each year, the editorial team at MIT Technology Review puts together a list of 35 innovators under 35—a group of researchers, inventors, and other young minds worth following. The team worked on the newest edition of the list for months, and the final slate includes nine individuals from all over the world in the climate and energy category. Each one has a fascinating story and is tackling an important challenge. I think it’s worth zooming out and considering the energy and climate awardees as a group. Taken together, these innovators and their work can tell us something about where climate tech is at this moment—and where it’s heading. AI is the dominant technology story, both for its potential and its challenges. We split the innovators into four main categories this year: biotech, climate and energy, computing and robotics, and AI. It probably won’t surprise you that AI features heavily in the work of many innovators in other categories. Climate innovator Jae-Won Chung , for example, built software to make AI more energy-efficient. By measuring the energy demands of open-source models, he hopes the industry can better understand and address the impact of AI. (If this work sounds familiar, it’s because we spoke with him last year for our investigation into AI’s energy demands .) But AI also has the potential to improve many areas of research. Jing Wei is using AI to track pollution more effectively, essentially using machine learning to fill in gaps in data from disparate sources like satellites and weather stations. Zhonghua Zheng developed AI climate models that work better for cities, a well-known blind spot for traditional models. We need better ways to get the critical materials used to build new technologies. As we begin to rely on new technologies to power our world, we’ll see a major shift in the materials we need to build them. Lithium is a prime example: The metal underpins lithium-ion batteries, which are crucial not only for electric vehicles, but also for large-scale energy storage on the grid. We could face lithium shortages as soon as this decade, and the prospect of supply crunches applies to other critical minerals, too—copper is another one to watch closely. Brine is currently the cheapest source of lithium, but the process to get the metal out can take months and harm the local environment. Mohammad Alkhadra is the cofounder and CEO of Lithios, a startup working to quickly and efficiently extract lithium from brines. Hardrock ore is th", "date_str": "2026-09-17T10:00:00+00:00", "hash": "3bd1c2e7dbb70c84", "title_fa": "با مبتکران زیر 35 سال در شکل دادن به فناوری آب و هوا آشنا شوید", "summary_fa": "هر سال، تیم تحریریه MIT Technology Review فهرستی از 35 مبتکر زیر 35 سال را گرد هم می‌آورد، گروهی از محققان، مخترعان و دیگر ذهن‌های جوان که ارزش دنبال کردن را دارند. این تیم ماه ها بر روی جدیدترین نسخه این لیست کار کرد و فهرست نهایی شامل 9 نفر از سراسر جهان در رده آب و هوا و انرژی است. هر کدام داستانی جذاب دارند و در حال مقابله با یک چالش مهم هستند. فکر می‌کنم ارزش کوچک‌نمایی و در نظر گرفتن برندگان جوایز انرژی و آب و هوا را به عنوان یک گروه دارد. روی هم رفته، این مبتکران و کارهایشان می‌توانند چیزی در مورد اینکه فناوری آب و هوا در این لحظه کجاست و به کجا می‌رود، به ما بگوید. هوش مصنوعی داستان غالب فناوری است، هم از نظر پتانسیل و هم به دلیل چالش‌هایش. ما امسال نوآوران را به چهار دسته اصلی تقسیم کردیم: بیوتکنولوژی، آب و هوا و انرژی، محاسبات و روباتیک، و هوش مصنوعی. احتمالاً شما را شگفت زده نخواهد کرد که هوش مصنوعی به شدت در کار بسیاری از مبتکران در دسته های دیگر نقش دارد. برای مثال، Jae-Won Chung، مبتکر آب و هوا، نرم‌افزاری ساخت تا هوش مصنوعی را از نظر انرژی کارآمدتر کند. با اندازه‌گیری انرژی مورد نیاز مدل‌های منبع باز، او امیدوار است صنعت بتواند تأثیر هوش مصنوعی را بهتر درک کند و به آن رسیدگی کند. (اگر این کار آشنا به نظر می رسد، به این دلیل است که سال گذشته برای تحقیقات خود در مورد نیازهای انرژی هوش مصنوعی با او صحبت کردیم.) اما هوش مصنوعی همچنین پتانسیل بهبود بسیاری از زمینه های تحقیقاتی را دارد. جینگ وی از هوش مصنوعی برای ردیابی موثرتر آلودگی استفاده می‌کند و اساساً از یادگیری ماشینی برای پر کردن شکاف‌های داده‌های منابع مختلف مانند ماهواره‌ها و ایستگاه‌های هواشناسی استفاده می‌کند. Zhonghua Zheng"}, {"source": "Zoomit", "title": "تویوتا سکویا، برادر بزرگ‌تر لندکروزر که کمتر کسی درباره آن حرف می‌زند", "link": "https://www.zoomit.ir/car/467303-toyota-sequoia-hybrid-suv-specs/", "summary": "بسیاری از ایرانی‌ها تویوتا لندکروزر را به‌عنوان بزرگ‌ترین شاسی‌بلند تویوتا می‌شناسند؛ اما ژاپنی‌ها شاسی‌بلند بزرگ‌تری هم در سبد محصولاتشان دارند.", "date_str": "2026-09-17T16:10:00+00:00", "hash": "5a0f92ee88a584ff", "title_fa": "تویوتا سکویا، برادر بزرگ‌تر لندکروزر که کمتر کسی درباره آن حرف می‌زند", "summary_fa": "بسیاری از ایرانی‌ها تویوتا لندکروزر را به‌عنوان بزرگ‌ترین شاسی‌بلند تویوتا می‌شناسند؛ اما ژاپنی‌ها شاسی‌بلند بزرگ‌تری هم در سبد محصولاتشان دارند. تبلیغات برای بسیاری از مردم ایران، نام تویوتا لندکروزر با یک شاسی‌بلند بزرگ، جان‌سخت و توانمند گره خورده است؛ خودرویی که سال‌ها در جاده و بیراهه‌های ایران دیده می‌شود؛ اما تویوتا یک شاسی‌بلند بزرگ‌تر و در بعضی جنبه‌ها عضلانی‌تر هم دارد که کمتر درباره‌اش صحبت می‌شود: سکویا. تویوتا سکویا را در سال ۲۰۰۰ برای بازار آمریکای
