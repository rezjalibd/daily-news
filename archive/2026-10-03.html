0+00:00", "hash": "7565cc1c60531759", "title_fa": "برنامه جدید Laytr به شما امکان می دهد هر چیزی را که آنلاین می یابید ذخیره کنید، نه فقط مقاله هایی برای خواندن", "summary_fa": "Laytr به شما امکان می دهد مقالات، دستور العمل ها، اسکرین شات ها، ویدیوها، فایل های PDF و موارد دیگر را برای بعد ذخیره کنید، در حالی که آرشیو خود را خصوصی نگه می دارید و در دستگاه های Apple خود همگام سازی می کنید. پس از بسته شدن برنامه Read-it-After Mozilla Pocket در ماه آگوست، تعدادی جایگزین ظاهر شد تا جای آن را بگیرد. اما یک تازه وارد، لایتر، همه چیز را فراتر از ارائه راهی برای ذخیره مطالب برای خواندن پیش می برد. این برنامه به شما امکان می دهد هر چیزی را در وب برای مصرف بعدی ذخیره کنید، خواه مقاله، دستور غذا، اسکرین شات، ویدیو، PDF، نشانک یا برگه باشد. این برنامه همچنین به طور خودکار انواع مختلف فایل‌ها را مرتب می‌کند و به شما امکان می‌دهد آنها را در مجموعه‌هایی سازماندهی کنید که آن را Case می‌نامد. همچنین می‌تواند در تاریخی که انتخاب می‌کنید، یک مورد ذخیره‌شده را به شما یادآوری کند، که می‌تواند به شما کمک کند رویدادهای محلی یا مکان‌هایی را که می‌خواهید در روزهای خاصی بازدید کنید را به خاطر بسپارید. (یا شاید به عنوان راهی برای مجبور کردن شما به فهرست خواندن خود!) نکته جالب در مورد نحوه عملکرد برنامه این است که هر چیزی که ذخیره می کنید تبدیل به یک بایگانی خصوصی می شود که فقط در دستگاه شما قابل دسترسی است. این بدان معناست که برای استفاده از Laytr نیازی به ایجاد حساب کاربری ندارید و توسعه دهنده نیز نمی تواند هر چیزی را که ذخیره کرده اید ببیند. با این وجود، می‌توانید به محتوای خود در چندین دستگاه اپل، از جمله iPhone، iPad و Mac دسترسی داشته باشید، زیرا محتوا از طریق iCloud همگام‌سازی می‌شود. ایده Laytr از مصطفی طلعت، توسعه‌دهنده مستقل منطقه انتاریو گرفته شده است و با نام شرکت وی منتشر شده است. طلعت به"}, {"source": "TechCrunch Main", "title": "Slovenia’s .si domain sees a surge in registrations after Trump’s ‘super intelligence’ order", "link": "https://techcrunch.com/2026/10/02/slovenias-si-domain-sees-a-surge-in-registrations-after-trumps-super-intelligence-order/", "summary": "The .si domain name is seeing unprecedented demand after President Trump's super intelligence executive order.", "date_str": "2026-10-02T14:47:46+00:00", "hash": "d677db40f8c13681", "title_fa": "دامنه .si اسلوونی پس از دستور \"فوق اطلاعاتی\" ترامپ شاهد افزایش ثبت نام ها بود", "summary_fa": "نام دامنه .si پس از دستور اجرایی فوق اطلاعاتی پرزیدنت ترامپ شاهد تقاضای بی سابقه ای است. در اخبار نه چندان غافلگیرکننده، نام دامنه .si پس از امضای فرمان اجرایی پرزیدنت ترامپ که تمامی سازمان‌های دولتی را موظف می‌کند تا «هوش مصنوعی» و «هوش مصنوعی» را به‌عنوان «SI» و «فوق هوش» بخوانند، شاهد تقاضای بی‌سابقه‌ای است. این بازتاب اتفاقی است که در آغاز رونق هوش مصنوعی رخ داد، زمانی که علاقه به نام دامنه .ai - مرتبط با کشور آنگویلا - افزایش یافت و میلیون ها نفر را برای قلمرو جزیره به ارمغان آورد. اکنون نوبت .si در کانون توجه است. نام دامنه معمولاً با اسلوونی مرتبط بود، جایی که از قضا ملانیا ترامپ بانوی اول اهل آن کشور است. کلارا هرمان، سخنگوی Registry SI، سازمان رسمی که دامنه‌های اسلوونی را مدیریت می‌کند، در اوایل این هفته به بی‌بی‌سی گفت که خرید نام دامنه .si در ماه سپتامبر 2199 درصد افزایش داشته است. با این حال، او محتاط بود که این افزایش را فقط به رئیس جمهور ترامپ مرتبط کند. با این حال، رجیستری به 11000 آدرس جدید ثبت شده در 30 سپتامبر، یک روز پس از امضای فرمان اجرایی پرزیدنت ترامپ اشاره کرد و تقریباً 13000 نام دامنه جدید .si در 24 ساعت گذشته ثبت شد. ما با چند سایت میزبانی وب دیگر تماس گرفتیم تا ببینیم آیا آنها روندهای مشابهی را دیده اند یا خیر. GoDaddy گفت که آنها هنوز دامنه .si را میزبانی نکرده اند و Squarespace هنوز تا زمان انتشار پاسخی نداده است. Wix، به اندازه کافی جالب، گفت که آنها هیچ \"افزایش معنی‌داری\" در پایان خود نمی‌بینند و از 29 سپتامبر در سایت بسیار کم بوده است. سخنگوی Wix گفت: \"هنوز زود است تا ممکن است تغییر کند.\""}, {"source": "Ars Technica", "title": "The dawn of the age of the exoskeleton", "link": "https://arstechnica.com/science/2026/10/the-dawn-of-the-age-of-the-exoskeleton/", "summary": "This year, members of Seattle Mountain Rescue have been setting off into the wilds of the US Pacific Northwest wearing an unusual piece of kit . They’ve been hiking into the wilderness with powered assistive devices attached to their hips and legs. Designed to increase lower-body strength when climbing or carrying heavy loads, these pieces of equipment are being tested to see if they can boost rescuers’ speed and endurance when it matters most—during searches for stranded people. Devices like these are called human exoskeletons . They attach to parts of the body to create an external—or “exo”—mechanical structure. This powered frame enhances the wearer’s physical capabilities. Read full article Comments", "date_str": "2026-10-03T11:15:33+00:00", "hash": "f055d4fad1f8d34a", "title_fa": "طلوع عصر اسکلت بیرونی", "summary_fa": "امسال، اعضای سازمان نجات کوه سیاتل با پوشیدن یک کیت غیرمعمول به سمت مناطق وحشی شمال غربی اقیانوس آرام آمریکا حرکت کرده اند. آن‌ها با وسایل کمکی برقی که به باسن و پاهایشان وصل شده‌اند به بیابان می‌روند. این قطعات تجهیزات که برای افزایش قدرت پایین تنه هنگام بالا رفتن یا حمل بارهای سنگین طراحی شده اند، در حال آزمایش هستند تا ببینند آیا می توانند سرعت و استقامت امدادگران را در زمانی که بیشترین اهمیت را دارد - در طول جست و جو برای افراد سرگردان، افزایش دهند. وسایلی از این دست را اسکلت بیرونی انسان می نامند. آنها به قسمت هایی از بدن متصل می شوند تا یک ساختار مکانیکی خارجی یا \"exo\" ایجاد کنند. این قاب برقی قابلیت های فیزیکی پوشنده را افزایش می دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید امسال، اعضای سازمان نجات کوه سیاتل با پوشیدن یک کیت غیرمعمول به مناطق وحشی شمال غرب اقیانوس آرام ایالات متحده حرکت کرده اند. در زمینه هایی که از نظر فیزیکی نیاز دارند، کارگران به طور فزاینده ای از این دستگاه ها در طول کارهای سخت استفاده می کنند. IKEA چندین سال است که از اسکلت بیرونی SuitX استفاده می کند. اینها به کارگران انبار در حمل و نقل مواد سنگین کمک می کنند. فورد، بوئینگ و مزدا تویوتا نیز همگی این فناوری را در برخی از خطوط مونتاژ خود به کار گرفته‌اند. در فنلاند، یک پروژه اخیر به نام ExoPELA ارزیابی کرد که آیا اسکلت های بیرونی می توانند بار و فشار عضلانی را در کار نجات و آتش نشانی کاهش دهند یا خیر. مزایای قابل توجهی برای کاربران در برخی از وظایف دنیای واقعی پیدا کرد. و در اوایل سال 2026،"}, {"source": "Ars Technica", "title": "Apple changes full-disk access permissions to curb abuse from AI agents", "link": "https://arstechnica.com/security/2026/10/apple-changes-full-disk-access-permissions-to-curb-abuse-from-ai-agents/", "summary": "Apple says it is changing its macOS privacy settings to stop third-party app developers from misusing them to access message histories. Friday's announcement comes two weeks after tech columnist Jason Aten said that Meta’s new general-purpose AI agent Muse sent him an unsolicited notification referencing a thread between him and a co-worker over Apple Messages. Aten said he never granted Muse permissions to read his messages and had assumed they were off-limits. Social media last week blew up with masses of people who agreed and said the incident showed that AI assistants given access to calendars, emails, messages, shopping accounts, and other resources are akin to a skill saw or other power tool. While potentially useful, they can do real damage if not used carefully. He said/she said Meta CTO David Singleton joined the fray with a rebuttal that appeared solid. For Muse to access Apple Messages, a user must manually give it two privileges. One is full-disk access, a macOS system-level permission. The other is to enable a Messages connector setting in Muse. Read full article Comments", "date_str": "2026-10-02T23:03:16+00:00", "hash": "026bcc2bdc71c472", "title_fa": "اپل مجوزهای دسترسی فول دیسک را برای جلوگیری از سوء استفاده از عوامل هوش مصنوعی تغییر می دهد", "summary_fa": "اپل می گوید تنظیمات حریم خصوصی macOS خود را تغییر می دهد تا مانع از سوء استفاده توسعه دهندگان برنامه های شخص ثالث برای دسترسی به تاریخچه پیام ها شود. اطلاعیه روز جمعه دو هفته پس از آن صورت گرفت که جیسون آتن، مقاله نویس فناوری، گفت که مامور هوش مصنوعی همه منظوره جدید متا، Muse، یک اعلان ناخواسته برای او ارسال کرده است که در آن به موضوعی بین او و یکی از همکارانش از طریق پیام های اپل اشاره می کند. آتن گفت که او هرگز به Muse اجازه نداده است که پیام‌هایش را بخواند و تصور می‌کرد که این پیام‌ها غیرمجاز هستند. رسانه‌های اجتماعی هفته گذشته با انبوهی از مردم منفجر شدند که موافقت کردند و گفتند که این حادثه نشان می‌دهد که دستیاران هوش مصنوعی که به تقویم‌ها، ایمیل‌ها، پیام‌ها، حساب‌های خرید و سایر منابع دسترسی دارند، شبیه یک اره مهارتی یا سایر ابزارهای برقی هستند. در حالی که به طور بالقوه مفید هستند، اگر با دقت مورد استفاده قرار نگیرند، می توانند آسیب واقعی وارد کنند. او گفت/او گفت که دیوید سینگلتون، مدیر ارشد فناوری متا، با ردی که محکم به نظر می‌رسید، به مبارزه پیوست. برای دسترسی Muse به Apple Messages، کاربر باید به صورت دستی به آن دو امتیاز بدهد. یکی دسترسی کامل به دیسک، یک مجوز در سطح سیستم macOS است. مورد دیگر فعال کردن تنظیمات رابط Messages در Muse است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش اپل می گوید در حال تغییر تنظیمات حریم خصوصی macOS خود است تا از سوء استفاده توسعه دهندگان برنامه های شخص ثالث برای دسترسی به تاریخچه پیام ها جلوگیری کند. اطلاعیه روز جمعه دو هفته پس از آن صورت می گیرد"}, {"source": "Ars Technica", "title": "Someone got Doom in an SQL database", "link": "https://arstechnica.com/gaming/2026/10/can-it-run-doom-sql-database-edition/", "summary": "\"Rendering Doom in a database is obviously a bad idea,\" Lukas Vogel writes in a lengthy blog post explaining how exactly he managed to render Doom using an SQL database. OK, that's not entirely accurate. The SQLDoom project uses a small Python client to handle input and output, drive the game's timing, and display each frame to the screen. Behind that, a series of CedarDB tables tracks the game geometry and state, while about 1,300 lines of SQL queries spread across 89 common table expressions implement the game logic and generate 35 bitmap framebuffers per second. In this, SQLDoom is a major improvement over Vogel's previous DoomQL project , which last year set out to build \"a multiplayer Doom-like shooter entirely in SQL.\" Unfortunately, that effort ended up with raycasting-based, grayscale ASCII graphics that were more akin to the simplistic 90-degree-angled maps of Wolfenstein 3D . The newer SQLDoom, on the other hand, generates full-color 640x480 frames that look like they could have come from the original Doom executable. Read full article Comments", "date_str": "2026-10-02T21:19:05+00:00", "hash": "ef723dd0cc5763fc", "title_fa": "شخصی Doom را در پایگاه داده SQL دریافت کرد", "summary_fa": "لوکاس ووگل در یک پست وبلاگ طولانی می نویسد: «رندر کردن Doom در یک پایگاه داده بدیهی است که ایده بدی است. خوب، این کاملاً دقیق نیست. پروژه SQLDoom از یک کلاینت کوچک پایتون برای مدیریت ورودی و خروجی، هدایت زمان بندی بازی و نمایش هر فریم روی صفحه استفاده می کند. در پشت آن، یک سری جداول CedarDB هندسه و وضعیت بازی را ردیابی می کند، در حالی که حدود 1300 خط پرس و جوی SQL که در 89 عبارت جدول رایج پخش شده است، منطق بازی را پیاده سازی کرده و 35 فریم بافر بیت مپ در هر ثانیه تولید می کند. در این مورد، SQLDoom یک پیشرفت بزرگ نسبت به پروژه قبلی DoomQL Vogel است که در سال گذشته قصد ساخت \"یک تیرانداز چند نفره مانند Doom به طور کامل در SQL را داشت.\" متأسفانه، این تلاش با گرافیک‌های ASCII در مقیاس خاکستری مبتنی بر امواج رادیواکتیو به پایان رسید که بیشتر شبیه نقشه‌های ساده ۹۰ درجه Wolfenstein 3D بود. از سوی دیگر، SQLDoom جدیدتر، فریم‌های تمام رنگی 640x480 را تولید می‌کند که به نظر می‌رسد می‌توانستند از فایل اجرایی اصلی Doom آمده باشند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید «به‌طور واضح ارائه Doom در پایگاه داده ایده بدی است»، لوکاس ووگل در یک پست وبلاگ طولانی توضیح می‌دهد که دقیقاً چگونه توانسته است Doom را با استفاده از پایگاه داده SQL ارائه کند. خوب، این کاملاً دقیق نیست. پروژه SQLDoom از یک کلاینت کوچک پایتون برای مدیریت ورودی و خروجی، هدایت زمان‌بندی بازی و نمایش هر فریم روی صفحه استفاده می‌کند. در پشت آن، یک سری جداول CedarDB هندسه و وضعیت بازی را ردیابی می کند، در حالی که حدود 1300 خط پرس و جوی SQL که"}, {"source": "Ars Technica", "title": "Amazon’s $1B plan to combat data center backlash draws more backlash", "link": "https://arstechnica.com/tech-policy/2026/10/amazons-1b-plan-to-combat-data-center-backlash-draws-more-backlash/", "summary": "On Friday, Amazon committed to donating more than $1 billion over the next five years to communities neighboring data centers. In a press release , Amazon Web Services’ CEO Matt Garman said that communities would decide how to prioritize funds across “education, job training, energy affordability, water, and energy preservation, and local priorities.” Laying out other community commitments, Amazon also promised to ensure data centers wouldn’t increase power bills or wipe out local water supplies. Regarding the latter, Amazon promised to be “water positive” by 2030, while claiming that 75 percent of projects have already met this goal. Read full article Comments", "date_str": "2026-10-02T20:30:27+00:00", "hash": "cbe1bbe511e41ede", "title_fa": "طرح یک میلیارد دلاری آمازون برای مقابله با واکنش‌های منفی مراکز داده، واکنش‌های بیشتری را به دنبال دارد", "summary_fa": "در روز جمعه، آمازون متعهد شد که بیش از یک میلیارد دلار طی پنج سال آینده به جوامع همسایه مراکز داده اهدا کند. در یک بیانیه مطبوعاتی، مت گارمن، مدیرعامل خدمات وب آمازون گفت که جوامع در مورد نحوه اولویت بندی بودجه در زمینه «آموزش، آموزش شغل، مقرون به صرفه بودن انرژی، حفظ آب و انرژی، و اولویت های محلی» تصمیم خواهند گرفت. آمازون همچنین با تعیین سایر تعهدات جامعه، متعهد شد که اطمینان حاصل کند که مراکز داده قبض برق را افزایش نمی دهند یا منابع آب محلی را از بین نمی برند. در مورد دومی، آمازون قول داد تا سال 2030 \"مثبت آب\" باشد، در حالی که ادعا می کند که 75 درصد از پروژه ها قبلاً به این هدف رسیده اند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری در روز جمعه، آمازون متعهد شد که بیش از 1 میلیارد دلار طی پنج سال آینده به جوامع همسایه مراکز داده اهدا کند. آمازون با اجرای این تعهدات، به نظر می‌رسید آمریکایی‌ها را متقاعد کند که واکنش‌های شدید مرکز داده بر اساس دروغ است. گارمان با تکرار ادعاهای دونالد ترامپ مبنی بر اینکه کمپین های اطلاعات نادرست خارجی به اعتراضات گسترده دامن می زند، تاکید کرد که درخواست ها برای توقف داده ها باید پایان یابد وگرنه ممکن است هوش مصنوعی مرزی آمریکا از چین عقب بیفتد. به گفته گارمن، رقبای ایالات متحده در تلاش هستند «ما را فریب دهند تا سرعت خود را کاهش دهیم» و تعهدات آمازون به این منظور است که به آمریکایی ها اطمینان دهد که همه چیز خوب است و ما باید در عوض، همانطور که ترامپ بی وقفه از آن حمایت می کند، جلو برویم."}, {"source": "Ars Technica", "title": "Patient-zero drill put health facilities to the test—40% of them failed", "link": "https://arstechnica.com/health/2026/10/patient-zero-drill-put-health-facilities-to-the-test-40-of-them-failed/", "summary": "COVID-19 made the weaknesses in our pandemic preparedness at national and global levels painfully clear. But a new study highlights that even at the first, local steps of an outbreak with pandemic-potential, we are worryingly underprepared. Health officials in New York set up a regional test of healthcare facilities to identify and respond to a patient with a mystery infection that could pose a pandemic-level threat. But things didn't go well. Overall, responses were slow, appropriate use of personal protective equipment was spotty, and only 60 percent of facilities passed the basics of the test—an overall failing grade. \"These drills identified needs for health care workers and health care facility staff member training to achieve earlier identification, masking, and isolation of potentially infectious febrile patients,\" the officials wrote in the study, which was published in the Morbidity and Mortality Weekly Report . Read full article Comments", "date_str": "2026-10-02T20:07:59+00:00", "hash": "eba34fe39baf0b0e", "title_fa": "مته بیمار صفر، مراکز بهداشتی را مورد آزمایش قرار داد - 40 درصد از آنها شکست خوردند", "summary_fa": "کووید-19 ضعف های آمادگی همه گیری ما را در سطوح ملی و جهانی به طرز دردناکی آشکار کرد. اما یک مطالعه جدید نشان می‌دهد که حتی در اولین گام‌های محلی شیوع یک بیماری همه‌گیر با پتانسیل همه‌گیری، به طرز نگران‌کننده‌ای آمادگی لازم را نداریم. مقامات بهداشتی در نیویورک یک آزمایش منطقه‌ای از امکانات مراقبت‌های بهداشتی را برای شناسایی و پاسخگویی به یک بیمار مبتلا به عفونت مرموز که می‌تواند تهدیدی در سطح همه‌گیری باشد، راه‌اندازی کردند. اما اوضاع خوب پیش نرفت. به طور کلی، پاسخ‌ها آهسته بود، استفاده مناسب از تجهیزات حفاظت فردی لکه‌دار بود، و تنها 60 درصد از امکانات پایه آزمون را گذراندند - یک نمره کلی مردود. مقامات در این مطالعه که در گزارش هفتگی موربیدیتی و مرگ و میر منتشر شد، نوشتند: «این تمرین‌ها نیاز به آموزش کارکنان مراقبت‌های بهداشتی و کارکنان مراکز بهداشتی را برای دستیابی به شناسایی، پوشاندن و جداسازی زودهنگام بیماران تب دار بالقوه عفونی شناسایی کردند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش COVID-19 ضعف های آمادگی بیماری همه گیر ما را در سطوح ملی و جهانی به طرز دردناکی روشن کرد. اما یک مطالعه جدید نشان می‌دهد که حتی در اولین گام‌های محلی شیوع یک بیماری همه‌گیر با پتانسیل همه‌گیری، به طرز نگران‌کننده‌ای آمادگی لازم را نداریم. مقامات در این مطالعه که در گزارش هفتگی موربیدیتی و مرگ و میر منتشر شد، نوشتند: «این تمرین‌ها نیاز به آموزش کارکنان مراقبت‌های بهداشتی و کارکنان مراکز بهداشتی برای دستیابی به شناسایی، پوشاندن و جداسازی زودهنگام بیماران تب دار بالقوه عفونی را مشخص کردند."}, {"source": "Ars Technica", "title": "Lyft settles landmark driver misclassification lawsuit for $272.5M", "link": "https://arstechnica.com/tech-policy/2026/10/lyft-settles-landmark-driver-misclassification-lawsuit-for-272-5m/", "summary": "California’s attorney general and three city attorneys announced a $272.5 million settlement with Lyft after allegations that the company “committed wage theft by misclassifying drivers as independent contractors rather than employees” between 2016 and 2020, according to a Thursday statement . The case dates back to May 2020, when then-Attorney General Xavier Becerra, who is now the Democratic candidate for governor, sued both Uber and Lyft . That lawsuit said the ridehailing companies evaded state law when they declared that their drivers were not employees. Thursday’s settlement affects only Lyft, while the case against Uber continues. Read full article Comments", "date_str": "2026-10-02T19:09:49+00:00", "hash": "10dc759b44ffb679", "title_fa": "Lyft به شکایت 272.5 میلیون دلاری در خصوص طبقه بندی اشتباه راننده رسیدگی می کند", "summary_fa": "بر اساس بیانیه روز پنجشنبه، دادستان کل کالیفرنیا و سه دادستان شهر پس از ادعاهایی مبنی بر اینکه این شرکت بین سال‌های 2016 تا 2020 \"مرتکب سرقت دستمزد با طبقه‌بندی اشتباه رانندگان به‌عنوان پیمانکاران مستقل به جای کارمندان\"، 272.5 میلیون دلار با Lyft تسویه حساب کردند. این پرونده به می 2020 برمی گردد، زمانی که دادستان کل وقت خاویر بسرا، که اکنون نامزد دموکرات ها برای فرمانداری است، از اوبر و لیفت شکایت کرد. در این دادخواست آمده بود که شرکت‌های سوارکار وقتی اعلام کردند که رانندگان آنها کارمند نیستند، از قانون ایالتی فرار کردند. تسویه حساب روز پنجشنبه فقط لیفت را تحت تأثیر قرار می دهد، در حالی که پرونده علیه اوبر ادامه دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید. بر اساس بیانیه روز پنجشنبه 2020. راب بونتا، دادستان کل آمریکا در بیانیه ای گفت: \"ما مفتخریم که این پیروزی برجسته برای کارگران را اعلام کنیم، بزرگترین حل و فصل طبقه بندی اشتباه در تاریخ کالیفرنیا.\" شرکت‌های رایدشیر مانند Lyft در دهه گذشته از رشد و سود انبوهی بر پشت رانندگان برخوردار بوده‌اند که بسیاری از آنها از جوامع مهاجر و جوامع رنگین پوست هستند. هایدی فلدشتاین سوتو، دادستان شهر لس آنجلس، در همین بیانیه گفت: «لس آنجلس و شرکای ما در سراسر ایالت اجازه نخواهند داد که مشاغل از کارگران خود استثمار کنند و از تعهدات خود طبق قانون فرار کنند."}, {"source": "Ars Technica", "title": "The 2008 economic crisis changed the US's relationship with energy", "link": "https://arstechnica.com/science/2026/10/the-2008-economic-crisis-changed-the-uss-relationship-to-energy/", "summary": "One argument that often comes up about climate change is that fossil fuels are good because they powered economic growth that has left most people better off overall. And, to an extent, that has been true, but it's also an extremely limited perspective. It's pretty obvious now that the growth they powered has come with very high costs that we've only recently started to pay, in the form of damages and disruptions from extreme weather events. With things like sea level rise expected to continue for centuries even if we hit net zero, it's difficult to estimate how expensive that growth will eventually be. But that perspective is also limited: We now have better ways to power our growth—ways that are less environmentally damaging now and won't leave our descendants with a carbon debt that will be difficult to manage. Read full article Comments", "date_str": "2026-10-02T18:56:21+00:00", "hash": "ca55e72ab426f32c", "title_fa": "بحران اقتصادی 2008 رابطه ایالات متحده با انرژی را تغییر داد", "summary_fa": "یکی از بحث‌هایی که اغلب در مورد تغییرات آب و هوایی مطرح می‌شود این است که سوخت‌های فسیلی خوب هستند، زیرا باعث رشد اقتصادی می‌شوند که به طور کلی وضعیت اکثر مردم را بهتر کرده است. و، تا حدی، این درست بوده است، اما همچنین یک دیدگاه بسیار محدود است. اکنون کاملاً واضح است که رشد آنها با هزینه‌های بسیار بالایی همراه بوده است که ما اخیراً شروع به پرداخت آن کرده‌ایم، به شکل خسارات و اختلالات ناشی از رویدادهای شدید آب و هوایی. با توجه به مواردی مانند افزایش سطح دریا که انتظار می رود برای قرن ها ادامه یابد، حتی اگر به صفر خالص برسیم، تخمین اینکه این رشد در نهایت چقدر گران خواهد بود، دشوار است. اما این دیدگاه نیز محدود است: ما اکنون راه‌های بهتری برای تقویت رشد خود داریم – راه‌هایی که اکنون کمتر به محیط زیست آسیب می‌رسانند و فرزندانمان را با بدهی کربنی که مدیریت آن دشوار خواهد بود، باقی نمی‌گذارند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش یکی از استدلال‌هایی که اغلب در مورد تغییرات آب و هوایی مطرح می‌شود این است که سوخت‌های فسیلی خوب هستند زیرا باعث رشد اقتصادی می‌شوند که به طور کلی باعث بهبود بیشتر مردم شده است. و، تا حدی، این درست بوده است، اما همچنین یک دیدگاه بسیار محدود است. اکنون کاملاً واضح است که رشد آنها با هزینه های بسیار بالایی همراه بوده است که ما اخیراً شروع به پرداخت آن کرده ایم، به شکل خسارات و اختلالات ناشی از رویدادهای شدید آب و هوایی. با توجه به مواردی مانند افزایش سطح دریا که انتظار می رود برای قرن ها ادامه یابد، حتی اگر به صفر خالص برسیم، تخمین اینکه این رشد"}, {"source": "Ars Technica", "title": "US arrests tech CEO accused of smuggling $300M in Nvidia chips into China", "link": "https://arstechnica.com/tech-policy/2026/10/us-arrests-tech-ceo-accused-of-smuggling-300m-in-nvidia-chips-into-china/", "summary": "The US has arrested another suspect accused of smuggling high-end computer servers containing export-controlled Nvidia chips into China. In a press release on Thursday, the Department of Justice accused 38-year-old Greg Lui of using false paperwork to mask shipments of servers worth more than $300 million that he allegedly knew were ultimately destined for China. As the CEO of Earthmade Computer, Lui allegedly conspired with freight-forwarding firms in South Asian countries like Malaysia and Singapore to illegally divert chip shipments into China, including Nvidia’s A100 GPUs and H100 GPUs, the FBI’s indictment alleged. These are not Nvidia’s most advanced chips. However, the chips can process large amounts of data and train large language models, which the US fears could pose national security risks if China suddenly gets access to enough chips to drastically advance its AI or strengthen its military. Read full article Comments", "date_str": "2026-10-02T18:39:36+00:00", "hash": "0283ca97594654e8", "title_fa": "آمریکا مدیر عامل فناوری را متهم به قاچاق 300 میلیون دلار تراشه های انویدیا به چین دستگیر کرد.", "summary_fa": "ایالات متحده مظنون دیگری را متهم به قاچاق سرورهای کامپیوتری پیشرفته حاوی تراشه های Nvidia کنترل شده صادراتی به چین دستگیر کرده است. در یک بیانیه مطبوعاتی در روز پنجشنبه، وزارت دادگستری، گرگ لوی 38 ساله را متهم کرد که از اسناد جعلی برای پنهان کردن محموله های سرورهایی به ارزش بیش از 300 میلیون دلار استفاده می کند که ظاهراً می دانست در نهایت به مقصد چین است. در کیفرخواست FBI ادعا شده است که لوی به عنوان مدیرعامل Earthmade Computer، با شرکت‌های حمل و نقل بار در کشورهای آسیای جنوبی مانند مالزی و سنگاپور برای هدایت غیرقانونی محموله‌های تراشه‌ها به چین، از جمله پردازنده‌های گرافیکی A100 و H100 انویدیا، توطئه کرده است. اینها پیشرفته ترین تراشه های انویدیا نیستند. با این حال، این تراشه‌ها می‌توانند حجم زیادی از داده‌ها را پردازش کرده و مدل‌های زبانی بزرگی را آموزش دهند، که ایالات متحده نگران است اگر چین به طور ناگهانی به تراشه‌های کافی برای پیشرفت چشمگیر هوش مصنوعی یا تقویت ارتش خود دسترسی پیدا کند، خطرات امنیت ملی را به همراه داشته باشد. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید ایالات متحده مظنون دیگری را متهم به قاچاق سرورهای کامپیوتری پیشرفته حاوی تراشه های Nvidia کنترل شده صادراتی به چین دستگیر کرده است. به گفته وزارت دادگستری، ایمیل‌ها و سوابق بانکی طرح قاچاق را فاش می‌کنند که از اکتبر 2023 آغاز شد و تا اوت 2026 ادامه داشت. یکی از شواهد کلیدی، ایمیلی در سال 2024 است که در آن درباره سفارش 70 سرور با پردازنده‌های گرافیکی محدود شده صادراتی صحبت می‌شود که به‌طور متقلبانه ادعا شده بود که مقصدشان مالزی است. پس از اینکه \"Lui یک سفارش خرید برای 27 سرور از این سرورها به قیمت"}, {"source": "Ars Technica", "title": "Research roundup: 6 cool science stories we almost missed", "link": "https://arstechnica.com/science/2026/10/research-roundup-6-cool-science-stories-we-almost-missed-6/", "summary": "It’s a regrettable reality that there is never enough time to cover all the interesting scientific stories we come across. So every month, we highlight a handful of the best stories that nearly slipped through the cracks. September’s list includes a tantalizing hint of the elusive dark matter at the LUX-ZEPLIN detector; entangled Z bosons at the Large Hadron Collider; possible use of psychoactive substances in the Late Pleistocene; and an intriguing technical description of a telescope attributed to Galileo. A hint of dark matter? Physicists believe dark matter makes up roughly 85 percent of matter in our universe, with the strongest (but not only) candidate being so-called weakly interacting massive particles (WIMPs). But directly detecting WIMPs, or other alternative hypothetical dark matter particles, has eluded physicists for decades. We might have our first glimpse, however, courtesy of the LUX-ZEPLIN detector buried deep in a gold mine in South Dakota. Those potentially exciting results were presented in a scientific talk at the 2026 TeV Particle Astrophysics conference in Japan, with a preprint available on the arXiv. (It has been submitted to Physical Review Letters for peer review.) The announcement came with strong caveats: the signal is just a hint, well below the threshold needed to confirm discovery, and might just be a statistical fluke. Anyone who regularly follows dark matter news knows that past tantalizing anomalies evaporated as more data came in. But the LUX-ZEPLIN team was unable to account for this event and decided to report their result to the broader physics community. They are still collecting data, as is the XENONnT at the Gran Sasso National Laboratory in Italy. And China's PandaX detector is currently being built. Read full article Comments", "date_str": "2026-10-02T18:17:27+00:00", "hash": "53396bfdecae0e34", "title_fa": "جمع بندی تحقیق: 6 داستان علمی جالب که تقریباً از دست دادیم", "summary_fa": "این یک واقعیت تاسف بار است که هرگز زمان کافی برای پوشش تمام داستان های علمی جالبی که با آنها مواجه می شویم وجود ندارد. بنابراین هر ماه، تعدادی از بهترین داستان‌هایی را که تقریباً از بین رفته‌اند، برجسته می‌کنیم. فهرست سپتامبر شامل اشاره ای وسوسه انگیز از ماده تاریک گریزان در آشکارساز LUX-ZEPLIN است. بوزون های Z در برخورد دهنده بزرگ هادرون. استفاده احتمالی از مواد روانگردان در پلیستوسن پسین. و یک توصیف فنی جالب از تلسکوپ منسوب به گالیله. اشاره ای به ماده تاریک؟ فیزیکدانان بر این باورند که ماده تاریک تقریباً 85 درصد از ماده جهان ما را تشکیل می‌دهد و قوی‌ترین (اما نه تنها) نامزد به اصطلاح ذرات سنگین با تعامل ضعیف (WIMP) است. اما کشف مستقیم WIMP ها یا دیگر ذرات ماده تاریک فرضی جایگزین، برای دهه ها از فیزیکدانان فرار کرده است. با این حال، ممکن است اولین نگاه خود را به لطف آشکارساز LUX-ZEPLIN که در اعماق معدن طلا در داکوتای جنوبی مدفون شده است، داشته باشیم. این نتایج بالقوه هیجان‌انگیز در یک سخنرانی علمی در کنفرانس اخترفیزیک ذرات 2026 TeV در ژاپن ارائه شد که پیش‌چاپ آن در arXiv موجود است. (برای بررسی همتایان به Physical Review Letters ارسال شده است.) این اعلامیه با هشدارهای قوی همراه بود: سیگنال فقط یک اشاره است، بسیار پایین تر از آستانه مورد نیاز برای تأیید کشف، و ممکن است فقط یک تصادف آماری باشد. هر کسی که به طور منظم اخبار ماده تاریک را دنبال می کند می داند که ناهنجاری های وسوسه انگیز گذشته با ورود داده های بیشتر تبخیر شده است. اما تیم LUX-ZEPLIN نتوانست این رویداد را توضیح دهد و تصمیم گرفت نتیجه خود را به جامعه فیزیک گسترده تر گزارش کند. آنها همچنان در حال جمع‌آوری داده‌ها هستند، مانند XENONnT در آزمایشگاه ملی Gran Sasso در ایتالیا. و آشکارساز PandaX چین"}, {"source": "Ars Technica", "title": "US military ends long-running program to spot nuclear missile launches", "link": "https://arstechnica.com/space/2026/10/us-military-ends-long-running-program-to-spot-nuclear-missile-launches/", "summary": "In late 1970, a Titan IIIC rocket launched from Space Launch Complex 40 at what was then called Cape Canaveral Air Force Station. It carried a top-secret payload for the US military. Much has changed in spaceflight since then. The Titan IIIC would bow out in 1982 after dozens of launches. Various Titans continued launching from Space Launch Complex 40 until 2005, at which point the US Air Force—in a competitive process hotly opposed by United Launch Alliance—turned the pad over to a small, largely unknown startup called SpaceX. And Cape Canaveral is now a \"Space Force\" station. But those unspecified payloads? Until last month, some of them were still flying operationally. Read full article Comments", "date_str": "2026-10-02T17:32:14+00:00", "hash": "d1c7f750412f139f", "title_fa": "ارتش آمریکا به برنامه طولانی مدت خود برای شناسایی پرتاب موشک های هسته ای پایان می دهد", "summary_fa": "در اواخر سال 1970، یک موشک Titan IIIC از مجموعه پرتاب فضایی 40 در ایستگاه نیروی هوایی کیپ کاناورال پرتاب شد. این یک محموله فوق محرمانه برای ارتش ایالات متحده حمل می کرد. از آن زمان تاکنون چیزهای زیادی در پروازهای فضایی تغییر کرده است. تایتان IIIC در سال 1982 پس از ده ها پرتاب، خم شد. تایتان‌های مختلف به پرتاب از مجتمع پرتاب فضایی 40 تا سال 2005 ادامه دادند، در آن زمان نیروی هوایی ایالات متحده - در یک فرآیند رقابتی که با مخالفت شدید اتحاد پرتاب یونایتد مواجه شد - سکو را به یک استارت‌آپ کوچک و عمدتاً ناشناخته به نام SpaceX سپرد. و کیپ کاناورال اکنون یک ایستگاه \"نیروی فضایی\" است. اما آن محموله های نامشخص؟ تا ماه گذشته برخی از آنها همچنان به صورت عملیاتی پرواز می کردند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید در اواخر سال 1970، یک موشک Titan IIIC از مجتمع پرتاب فضایی 40 در ایستگاه نیروی هوایی کیپ کاناورال به فضا پرتاب شد. این یک محموله فوق محرمانه برای ارتش ایالات متحده حمل می کرد. دولت ایالات متحده بعداً فاش کرد که محموله محرمانه ای که در نوامبر 1970 پرتاب شد، یک ماهواره \"برنامه پشتیبانی دفاعی\" بود. بلوک اولیه این ماهواره ها که از سال 1970 تا 1973 پرتاب شد، جرمی در حدود 1 تن داشت و هر کدام حدود 2000 آشکارساز فروسرخ را حمل می کردند. آنها اساسا تلسکوپ های بسیار حساسی بودند و هر ماهواره به مدار زمین سنکرون پرتاب می شد. برای مدتی، این ماهواره‌ها جزو مهم‌ترین ماهواره‌هایی بودند که توسط ایالات متحده پرواز می‌کردند، زیرا برای شناسایی پرتاب کلاهک هسته‌ای به این کشور خدمت می‌کردند. در نتیجه، برنامه پشتیبانی دفاعی به یکی از"}, {"source": "Ars Technica", "title": "How I kept cool with NYC's free battery program for window AC units", "link": "https://arstechnica.com/gadgets/2026/10/how-i-kept-cool-with-nycs-free-battery-program-for-window-ac-units/", "summary": "My family has spent four summers participating in demand response programs whereby utility companies pay customers to reduce energy use on the hottest summer days. Most summers have involved carefully precooling our New York City apartment before switching off the air conditioners and sweating it out during the designated demand response periods. But this year, we kept our window air conditioners running throughout a heat dome event that drove daytime temperatures into the triple digits and made the nights oppressively hot. The difference was that we powered the air conditioners through two household batteries tucked away unobtrusively in the corners of our living room and bedroom. We were among about 1,000 New York City households that took part in a free and growing program offered by the local startup Every Electric. The company’s proposition is simple: Get one or more batteries delivered to your home, plug the batteries into a standard wall electrical outlet, and then plug your window air conditioners into the batteries. Households can keep running air conditioners as usual during peak demand periods while also earning money through the local demand response program with the utility company Con Edison. Read full article Comments", "date_str": "2026-10-02T17:20:21+00:00", "hash": "c58b766e6d7e09e9", "title_fa": "چگونه با برنامه باتری رایگان نیویورک برای واحدهای AC پنجره خنک ماندم", "summary_fa": "خانواده من چهار تابستان را صرف شرکت در برنامه‌های پاسخگویی به تقاضا کرده‌اند که به موجب آن شرکت‌های خدمات شهری به مشتریان برای کاهش مصرف انرژی در گرم‌ترین روزهای تابستان پرداخت می‌کنند. بیشتر تابستان‌ها قبل از خاموش کردن سیستم تهویه مطبوع و عرق کردن آن در طول دوره‌های پاسخگویی به تقاضای تعیین‌شده، با دقت قبل از خنک کردن آپارتمان در شهر نیویورک انجام می‌شود. اما امسال، ما سیستم های تهویه مطبوع پنجره ای خود را در طول یک رویداد گنبد گرمایی که دمای روز را به سه رقم می رساند و شب ها را به شدت گرم می کرد، روشن نگه داشتیم. تفاوت این بود که ما کولرها را از طریق دو باتری خانگی که به طور محجوب در گوشه های اتاق نشیمن و اتاق خوابمان جاسازی شده بودند، تامین می کردیم. ما در میان حدود 1000 خانوار شهر نیویورک بودیم که در یک برنامه رایگان و رو به رشد ارائه شده توسط استارتاپ محلی Every Electric شرکت کردیم. پیشنهاد این شرکت ساده است: یک یا چند باتری را به خانه خود تحویل دهید، باتری ها را به یک پریز برق دیواری استاندارد وصل کنید و سپس کولرهای پنجره ای خود را به باتری ها وصل کنید. خانوارها می‌توانند به طور معمول در طول دوره‌های اوج تقاضا، تهویه مطبوع را به کار ببندند و همچنین از طریق برنامه پاسخگویی به تقاضای محلی با شرکت آب و برق Con Edison درآمد کسب کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید خانواده من چهار تابستان را صرف شرکت در برنامه های پاسخگویی به تقاضا کرده است که به موجب آن شرکت های خدمات شهری به مشتریان پرداخت می کنند تا مصرف انرژی را در گرم ترین روزهای تابستان کاهش دهند. بیشتر تابستان‌ها قبل از"}, {"source": "Ars Technica", "title": "Cybertruck sales in free fall as Tesla reports mediocre sales for Q3", "link": "https://arstechnica.com/cars/2026/10/tesla-sales-drop-2-percent-in-underwhelming-q3-2026/", "summary": "Tesla sold 486,532 electric vehicles during the third quarter of 2026. That’s a 2.1 percent decrease on the same quarter in 2025, when the company found homes for 497,099 EVs, and one might think that would be bad news for a company valued on the premise of near-constant growth. But Tesla stock is up this morning; the year-over-year numbers might look bad, but the company still exceeded analysts’ expectations of 456,600 cars, which would have been a larger 8 percent year-on-year decline Total production at Tesla actually increased year over year; it built 464,391 vehicles—a 3.7 percent increase—457,387 of which were Models 3 and Y (a 4.9 percent increase year over year). The remaining 7,004 were other models, mostly Cybertrucks, with presumably some Semis and Cybercabs, as the Models S and X are now retired; this category saw a 39.8 percent decrease year over year. Read full article Comments", "date_str": "2026-10-02T16:05:26+00:00", "hash": "dca27d84a0019aa2", "title_fa": "فروش Cybertruck در سقوط آزاد در حالی که تسلا فروش متوسطی را برای سه ماهه سوم گزارش کرده است", "summary_fa": "تسلا در سه ماهه سوم سال 2026، 486,532 خودروی الکتریکی فروخت. این کاهش 2.1 درصدی نسبت به فصل مشابه در سال 2025 است، زمانی که این شرکت خانه هایی برای 497,099 خودروی برقی پیدا کرد، و ممکن است فکر کنیم که این خبر بدی برای شرکتی است که با فرض رشد تقریباً ثابت ارزش گذاری شده است. اما سهام تسلا امروز صبح افزایش یافته است. اعداد سال به سال ممکن است بد به نظر برسند، اما این شرکت همچنان از انتظارات تحلیلگران در مورد تولید 456600 خودرو فراتر رفته است، که نسبت به سال گذشته کاهش 8 درصدی بیشتری را نشان می دهد. 464,391 وسیله نقلیه - 3.7 درصد افزایش - 457,387 خودرو مدل 3 و Y ساخت (افزایش 4.9 درصدی نسبت به سال). 7004 باقیمانده مدل‌های دیگر بودند، عمدتاً Cybertrucks، با احتمالاً برخی از Semis و Cybercabs، زیرا مدل‌های S و X اکنون بازنشسته شده‌اند. این دسته نسبت به سال گذشته 39.8 درصد کاهش داشته است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید تسلا در سه ماهه سوم سال 2026 486532 وسیله نقلیه الکتریکی فروخته است. این کاهش 2.1 درصدی نسبت به سه ماهه مشابه در سال 2025 است، زمانی که این شرکت خانه هایی برای 497099 خودروی برقی پیدا کرد، و ممکن است فکر کنیم که این خبر بدی برای شرکتی است که با فرض رشد تقریباً ثابت ارزش گذاری شده است. اما این شرکت نتوانست تمام خودروهایی را که در سه ماهه سوم ساخته بود بفروشد. این خودرو توانست 478237 مدل 3 و Y بفروشد که 0.6 درصد کاهش نسبت به سه ماهه سوم 2025 نشان می دهد. کاهش در سایر مدل ها شدید بود و در مجموع با افت 48 درصدی به 8295 دستگاه رسید. با این حال،"}, {"source": "Ars Technica", "title": "The 7-year-old Nvidia Shield TV is now $100 more expensive due to AI", "link": "https://arstechnica.com/gadgets/2026/10/the-7-year-old-nvidia-shield-tv-is-now-100-more-expensive-thanks-to-ai/", "summary": "The era of generative AI has upended technology supply chains, and there is one ironclad rule in 2026: If it has memory or storage, it's getting more expensive. Even devices with years-old tech inside are still apparently subject to that unwritten rule. Nvidia has just announced that the Shield TV Pro is getting $100 more expensive, effective immediately. The most recent version of the Shield streaming box debuted in 2019, running Android TV with AI upscaling and hardware decoding for almost any type of media. While it ran an aging Tegra X1+ processor, that was (and still is) fast for a TV media streamer. The device launched at $199.99, with a non-Pro variant at $149.99. The non-Pro Shield has since been discontinued, but the Shield TV Pro lives on at the new $299.99 price. Nvidia has confirmed that you can blame AI for the higher Shield TV pricing. \"Starting October 2, SHIELD Pro will be priced at $299. The cost of components, including memory, has increased substantially across the industry,\" a spokesperson told Ars. Read full article Comments", "date_str": "2026-10-02T14:52:16+00:00", "hash": "8026840877397c0c", "title_fa": "تلویزیون ۷ ساله Nvidia Shield اکنون به دلیل هوش مصنوعی ۱۰۰ دلار گران شده است", "summary_fa": "عصر هوش مصنوعی مولد زنجیره‌های تامین فناوری را تغییر داده است، و یک قانون آهنین در سال 2026 وجود دارد: اگر حافظه یا ذخیره‌سازی داشته باشد، گران‌تر می‌شود. حتی دستگاه‌هایی که دارای فناوری قدیمی در داخل هستند، هنوز مشمول این قانون نانوشته هستند. انویدیا به تازگی اعلام کرده است که Shield TV Pro ۱۰۰ دلار گران‌تر می‌شود و بلافاصله اعمال می‌شود. جدیدترین نسخه از جعبه استریم Shield در سال 2019 عرضه شد که دارای Android TV با ارتقاء مقیاس هوش مصنوعی و رمزگشایی سخت افزاری برای تقریباً هر نوع رسانه ای است. در حالی که یک پردازنده قدیمی Tegra X1+ را اجرا می کرد، برای پخش کننده رسانه تلویزیونی سریع بود (و هنوز هم هست). این دستگاه با قیمت 199.99 دلار و نسخه غیر پرو با قیمت 149.99 دلار به بازار عرضه شد. Shield غیر Pro Shield از آن زمان متوقف شده است، اما Shield TV Pro با قیمت جدید 299.99 دلار باقی می ماند. انویدیا تایید کرده است که می‌توانید هوش مصنوعی را به خاطر قیمت بالاتر Shield TV سرزنش کنید. یک سخنگوی به Ars گفت: \"از 2 اکتبر، SHIELD Pro 299 دلار قیمت خواهد داشت. هزینه قطعات، از جمله حافظه، به طور قابل توجهی در سراسر صنعت افزایش یافته است.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید عصر هوش مصنوعی مولد زنجیره های تامین فناوری را تغییر داده است و یک قانون آهنین در سال 2026 وجود دارد: اگر حافظه یا فضای ذخیره سازی داشته باشد، گران تر می شود. حتی دستگاه‌هایی که دارای فناوری قدیمی در داخل هستند، هنوز مشمول این قانون نانوشته هستند. انویدیا به تازگی اعلام کرده است که Shield TV Pro ۱۰۰ دلار گران‌تر می‌شود و بلافاصله اعمال می‌شود. وقتی در"}, {"source": "Wired", "title": "Muse Creates Detailed Profiles of All Your Friends and Family", "link": "https://www.wired.com/story/muse-creates-detailed-profiles-of-all-your-friends-and-family/", "summary": "Millions have downloaded Meta’s AI agent Muse. But getting it to do your bidding comes with privacy costs.", "date_str": "2026-10-03T12:00:00 gue is releasing romance-style audio stories to promote games. Critics say it’s cheap pandering that doesn’t address toxic masculinity in the sport.", "date_str": "2026-10-02T16:37:32+00:00", "hash": "5d16dd9d558a477c", "title_fa": "NHL در حال انتشار Fanfic «داغ» خود است. عاشقان عاشقانه از آن متنفرند", "summary_fa": "لیگ داستان های صوتی به سبک عاشقانه را برای تبلیغ بازی ها منتشر می کند. منتقدان می گویند که این کار ارزانی است که به مردانگی سمی در این ورزش نمی پردازد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان خوب یا بد، عاشقان عاشقانه هرگز برای هاکی بدشانسی نبوده اند. اکنون، لیگ ملی هاکی می خواهد پول نقد کند. NHL به عنوان بخشی از کمپین جدید خود «Hot for Hockey»، داستان‌های کوتاه الهام‌گرفته از رمان‌های عاشقانه را با بازی بازیکنان لیگ روی پلتفرم‌های کتاب صوتی منتشر می‌کند. به گزارش اسپورت بیزینس ژورنال، لیگ برای نوشتن و روایت داستان های 60 تا 90 ثانیه ای با نویسندگان عاشقانه هاکی محبوب تماس گرفت و از سازندگان در BookTok، خرده فرهنگ ادبی عاشقانه در TikTok، برای تبلیغ محتوا استفاده خواهد کرد. اولین دسته از داستان‌های کوتاه که این هفته پخش شد، شامل بازیگرانی از جمله ترور زگراس از فیلادلفیا فلایرز، سباستین آهو از کارولینا هوریکنز و جک ایکل از شوالیه‌های طلایی لاس وگاس است. آنها توسط نویسنده Pucking Wrong C.R. Jane نوشته شده اند و بیشتر شبیه خلاصه های پشت جلدی هستند تا رمان های عاشقانه واقعی. و، علی‌رغم توجه به سبک‌های ژانر، بازیکنان با شرکای رمانتیک جفت نمی‌شوند. خیلی خسته کننده تر، به نظر می رسد داستان ها تلاشی برای ترغیب مردم به تماشای بازی های واقعی است. کل کتاب The Summer I Turned Gritty with Trevor Zegras به شرح زیر است: \"Trevor Zegras به دنبال شروعی تازه به فیلی آمد. اما پس از نبرد با پیتسبورگ در پلی آف سال گذشته، متوجه شد که اوضاع تا چه حد می تواند سخت شود. یک تابستان داغ بعد، پسر زیبای فیلی بسیار زیباتر به نظر می رسد.\""}, {"source": "Wired", "title": "These AI Experts Want to Do High-Stakes Research Out in the Open", "link": "https://www.wired.com/story/trillium-labs-wants-to-do-high-risk-ai-research-in-the-open/", "summary": "Many  "summary_fa": "نقص فنی آیفون ۱۸ پرو مکس باعث قطع دائمی سیگنال در شبکه‌ی AT T شده است و اپل اعلام کرد گوشی‌های آسیب‌دیده باید به‌طور کامل تعویض شوند. تبلیغات خریداران جدیدترین گوشی آیفون با چالشی غیرمنتظره روبه‌رو شده‌اند که امکان برقراری تماس، ارسال پیامک و اتصال به اینترنت همراه را به‌طور کامل از کار می‌اندازد. هزاران کاربر در انجمن پشتیبانی اپل و شبکه‌های اجتماعی از قطع ناگهانی و برگشت‌ناپذیر آنتن‌دهی گوشی خود خبر داده‌اند. بر اساس گزارش مک‌رومرز ، اپل با تأیید وقوع اختلال در شمار محدودی از مدل‌های آیفون ۱۸ پرو مکس متصل به شبکه‌ی AT T، اعلام کرد که دستگاه‌های آسیب‌دیده با به‌روزرسانی نرم‌افزاری تعمیر نخواهند شد و مالکان باید برای دریافت یک دستگاه جایگزین اقدام کنند. اپل برای مهار بحران و جلوگیری از درگیر شدن دستگاه‌های بیشتر، به‌روزرسانی iOS 27.0.1 و تنظیمات اختصاصی اپراتور AT T را منتشر کرد. بسته‌ی تنظیمات اپراتور طی ۱۴ روز آینده به‌صورت خودکار روی گوشی‌ها اعمال می‌شود، هرچند کاربران می‌توانند با مراجعه به مسیر تنظیمات، بخش عمومی و سپس گزینه‌ی درباره‌ی دستگاه، فرایند بارگذاری را به‌صورت دستی فعال کنند. توصیه‌ی اکید اپل به تمامی دارندگان آیفون ۱۸ پرو مکس، نصب فوری نسخه‌ی iOS 27.0.1 است. با وجود اثربخشی تمهیدات نرم‌افزاری در پیشگیری، گوشی‌هایی که پیش‌تر دچار قطعی سیگنال شده‌اند دیگر به شبکه‌ی مخابراتی بازنمی‌گردند و تعویض کامل گوشی تنها راهکار پیشِ روی خریداران خواهد بود. اپل تاکنون دلیل فنی ریشه‌ای این اختلال را فاش نکرده است. گوشی‌هایآیفون ۱۸ پرو مکس عرضه‌شده در بازار آمریکا از مودم ارتباطی Snapdragon X80 بهره می‌برند، درحالی‌که نسخه‌های بین‌المللی با مودم اختصاصی C2 به دست مشتریان می‌رسند. هنوز مشخص نیست که آیا تفاوت تراشه‌ی ارتباطی عامل اصلی این رخداد بوده یا ناهماهنگی عمیق‌تری در لایه‌های شبکه رخ داده است."}, {"source": "Zoomit", "title": "آیا این ابرخودرو تسلا رودستر است؟", "link": "https://www.zoomit.ir/car/468316-tesla-active-rear-wing-patent/", "summary": "تسلا پتنتی از سیستم بال عقب فعال با توانایی تولید ۷۰۰ کیلوگرم داون‌فورس و طراحی احتمالی خودروی رودستر جدید ثبت کرد.", "date_str": "2026-10-03T04:15:00+00:00", "hash": "9963cb49a9ea9817", "title_fa": "آیا این ابرخودرو تسلا رودستر است؟", "summary_fa": "تسلا پتنتی از سیستم بال عقب فعال با توانایی تولید ۷۰۰ کیلوگرم داون‌فورس و طراحی احتمالی خودروی رودستر جدید ثبت کرد. تبلیغات پتنت جدید تسلا از بال عقب فعال با توانایی تولید نیروی روبه‌پایین خارق‌العاده، احتمالا نخستین نشانه‌ها از طراحی نهایی نسل جدید تسلا رودستر را فاش می‌کند. تصاویری با جزئیات بالا درون اسناد فنی منتشر شده‌اند که یک خودروی اسپرت دو‌در با سقف ثابت را نشان می‌دهند. پرونده‌ی ثبت اختراع منتشرشده سامانه‌ی آیرودینامیکی پیشرفته‌ای را توصیف می‌کند که در حالت‌های مختلف عمل خواهد کرد. بال عقب بازشونده توانایی ایجاد نیروی روبه‌پایین صفر در حالت DRS و همچنین تولید ۷۰۰ کیلوگرم نیروی روبه‌پایین در تهاجمی‌ترین حالت عملکردی و در سرعت‌های بیش از ۱۶۱ کیلومتربرساعت دارد. دستیابی به ۷۰۰ کیلوگرم داون‌فورس تنها از طریق یک بال عقب، رکوردی چشمگیر برای خودرویی جاده‌ای به‌شمار می‌رود. جهت مقایسه، کل بدنه‌ی ابرخودروی مک‌لارن سنا در سرعت ۲۵۰ کیلومتربرساعت حدود ۸۰۰ کیلوگرم نیروی روبه‌پایین تولید می‌کند و نسخه‌ی پیست مک‌لارن سنا GTR به عدد ۱٬۰۰۰ کیلوگرم می‌رسد. طرح‌های ارائه‌شده تفاوت‌های مشخصی با نمونه‌ی اولیه‌ی سال ۲۰۱۷ دارند و ساختار بدنه را به شکل کوپه‌ی سقف‌ثابت با دیفیوزر بزرگ، چراغ‌های پیوسته و گلگیرهای برجسته نمایش می‌دهند. تسلا نام رودستر را مستقیما در پرونده ذکر نکرده است، اما جزئیات دقیق طرح بدنه نشان‌دهنده‌ی ارتباط مستقیم آن با خودروی تولیدی آینده خواهد بود. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "کفش هوشمندی که راه‌رفتن شما را یاد می‌گیرد", "link": "https://www.zoomit.ir/gadget/468315-shift-robotics-moonwalkers-dusk-shoes/", "summary": "شیفت رباتیکس با معرفی Moonwalkers Dusk، نسل سبک‌تر و هوشمندتر کفش‌های هوشمند خود را روانه‌ی بازار کرد.", "date_str": "2026-10-03T02:30:00+00:00", "hash": "df9be726ca84e282", "title_fa": "کفش هوشمندی که راه‌رفتن شما را یاد می‌گیرد", "summary_fa": "شیفت رباتیکس با معرفی Moonwalkers Dusk، نسل سبک‌تر و هوشمندتر کفش‌های هوشمند خود را ite as soft or luxe as real leather, but darker colors tend to look more convincing, and the bags may be a good value for anyone who wants a leather-free everyday option. During this year's New York Fashion Week, it was absolutely clear that the East-West silhouette — epitomized by the Freja's Caroline Bag and Mini Chrystie Bag — was the hottest handbag type. The long, pencil-case-looking purses were everywhere. You can get versions that cost over a thousand dollars from Miu Miu or Khaite , but our favorites are from Freja. Freja's vegan leather quality It's fair to be skeptical of vegan leather. After all, this is essentially the material we used to call pleather, and a more appealing name doesn't automatically solve the peeling, cracking, and plasticky feel that cheaper faux leather can develop. Freja's material is better than most I've tried, but I wouldn't say it feels exactly like the real thing. It's noticeably stiffer, doesn't have quite the same buttery feel, and won't develop the rich patina that makes a full-grain leather bag look even better with age. The illusion also seems more convincing in darker shades. My most-used bag is the Mini Chrystie in Espresso, and I'd personally recommend one of Freja's deeper colors; I've seen complaints about color transfer on the white bags, and the lighter material tends to look a little less leather-like. Here are my thoughts on three of Freja's most popular styles. And if you're interested in more of our bag coverage, check out our articles on the best purse brands , the best work bags for women , and the best tote bags . Two-year testing update ", "date_str": "2026-10-03T14:02:01+00:00", "hash": "bd903a76aa9c60e7", "title_fa": "من کیف‌های محبوب Freja را برای بیش از 2 سال آزمایش کردم تا ببینم آیا چرم گیاهی واقعاً مقاوم است یا خیر.", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید Samantha Crozier/Business Insider اگر فید اینستاگرام شما چیزی شبیه من است، پس این کیف‌های Freja را همه جا دیده‌اید. افراد مشهوری مانند سارا جسیکا پارکر، کیتی هلمز و هیلی بیبر همگی با کیف‌هایی از این برند دیده شده‌اند. و تبلیغات وسوسه انگیز در سراسر اینستاگرام است. این کیف‌ها با قدرت ماندگاری بر تمامی گرایش‌های کنونی تاثیر می‌گذارند - لباس‌های کاری آن‌ها در همه جا به عنوان مظهر زیبایی‌شناسی «لوکس آرام» که اغلب بیش از حد استفاده می‌شود، توصیف می‌شود. و کیف‌های دستی آن‌ها از سیلوئت‌های دهه 90 با شکل‌های کشیده و خطوط تمیز باگت‌مانندشان وام گرفته‌اند. به اصل مطلب برسید: فرجا کیف‌های چرم وگان شیکی می‌سازد که طبق تجربه من، طی دو سال استفاده منظم، بدون پوسته شدن، تغییر رنگ یا خرابی عمده، به خوبی دوام می‌آورند. جنس آن به نرمی یا لوکس بودن چرم واقعی نیست، اما رنگ‌های تیره‌تر متقاعدکننده‌تر به نظر می‌رسند و کیف‌ها ممکن است برای هر کسی که می‌خواهد یک گزینه روزمره بدون چرم باشد، ارزش خوبی داشته باشد. در طول هفته مد نیویورک امسال، کاملاً واضح بود که شبح شرق-غرب - که مظهر کیف Caroline Freja و کیف Mini Chrystie است - داغ ترین نوع کیف دستی است. کیف های بلند و مدادی مانند همه جا بود. می‌توانید نسخه‌هایی که بیش از هزار دلار قیمت دارند را از Miu Miu یا Khaite دریافت کنید، اما موارد دلخواه ما از Freja هستند. کیفیت چرم وگان Freja منصفانه است که نسبت به چرم گیاهی شک داشته باشیم. به هر حال، این اساساً ماده‌ای است که ما برای نامیدن آن استفاده می‌کردیم، و نام جذاب‌تر به‌طور خودکار پوسته شدن، ترک خوردن و احساس پلاستیکی را که چرم مصنوعی ارزان‌تر می‌تواند ایجاد کند، برطرف نمی‌کند. مواد Freja بهتر از بسیاری"}, {"source": "Business Insider", "title": "I'm raising my 4 kids in Spain. I've become a less controlling parent here.", "link": "https://www.businessinsider.com/raising-kids-spain-parenting-independence-freedom-2026-10", "summary": "The author is raising for four kids in Spain. Courtesy of the author I'm raising four young children in Barcelona, where kids are part of public life. I've become more comfortable letting them explore while I supervise from nearby. That freedom is helping them become more confident and capable. When I found out I was pregnant with twins , I couldn't imagine how completely my life was about to turn upside down. Not just because those two little hearts beating on the ultrasound would soon become two babies crying at exactly the same time, but because of the whirlwind my life was about to become. Two more babies would follow, all in four years. Very quickly, our home in Barcelona became a noisy, messy children's playground. Luckily, before the twins arrived, I had still had enough time to read tons of parenting books that promised to teach me how to do everything right. Most of that parenting literature quickly went out the window. What remained was survival. I took parenting very seriously At the beginning, I was determined to help my twins discover the world in the best possible way. I followed the latest baby-led feeding trends, bought almost everything you could imagine to encourage their development, and watched them constantly. I took parenting very seriously. Then two little girls arrived, one after the other, and family life became even harder to control. At times, I felt — and still do — like a juggler who had already dropped all the balls but was somehow still trying to keep the show going. The author took parenting very seriously. Courtesy of the author I tried hard to watch everything that all four of them did and step in before anyone became frustrated. Spoiler: It was physically and mentally impossible. No plan ever worked perfectly. Whenever we decided to take a lovely family walk , one of the kids would suddenly have a meltdown or have a massive diaper blowout. If I solved one disagreement, another would start somewhere else. Once, we even managed to go out for a coffee while one of the boys was in the middle of a tantrum. In all the chaos, we left the keys inside the house and had to break a window to get back in. At that point, tired of fighting against the elements, I gave up on perfectionism and control and decided — or perhaps was forced — to let life flow a little more. A little more Mediterranean. Surprisingly, that was what worked for me. Children in Spain are part of public life I've loosened my grip, helped by the fact that I'm raisi", "date_str": "2026-10-03T13:57:01+00:00", "hash": "9d8dc126ee624cfa", "title_fa": "من 4 بچه ام را در اسپانیا بزرگ می کنم. من در اینجا به پدر و مادری کمتر کنترل کننده تبدیل شده ام.", "summary_fa": "نویسنده در حال بزرگ کردن چهار کودک در اسپانیا است. با حسن نیت نویسنده من چهار کودک خردسال را در بارسلون بزرگ می کنم، جایی که بچه ها بخشی از زندگی عمومی هستند. وقتی از نزدیک نظارت می‌کنم، راحت‌تر به آنها اجازه می‌دهم کاوش کنند. این آزادی به آنها کمک می کند تا اعتماد به نفس و توانایی بیشتری داشته باشند. وقتی فهمیدم دوقلو باردارم، نمی‌توانستم تصور کنم که زندگی من چقدر در شرف وارونه شدن است. نه فقط به این دلیل که آن دو قلب کوچک که در سونوگرافی می تپند به زودی تبدیل به دو نوزادی می شوند که دقیقاً همزمان گریه می کنند، بلکه به دلیل گردبادی که زندگی من در شرف تبدیل شدن بود. دو نوزاد دیگر هم به دنبال آن خواهند آمد، همه در چهار سال. خیلی زود، خانه ما در بارسلونا به یک زمین بازی کودکان پر سر و صدا و نامرتب تبدیل شد. خوشبختانه، قبل از آمدن دوقلوها، هنوز زمان کافی برای خواندن هزاران کتاب والدین داشتم که به من قول می‌دادند چگونه همه چیز را درست انجام دهم. بیشتر آن ادبیات والدین به سرعت از پنجره بیرون رفت. آنچه باقی ماند بقا بود. من فرزندپروری را بسیار جدی گرفتم در ابتدا مصمم بودم به دوقلوهایم کمک کنم تا دنیا را به بهترین شکل ممکن کشف کنند. من آخرین روندهای تغذیه توسط نوزاد را دنبال کردم، تقریباً هر چیزی را که برای تشویق رشد آنها تصور می کردید خریدم و دائماً آنها را تماشا کردم. فرزندپروری را خیلی جدی گرفتم. سپس دو دختر کوچک یکی پس از دیگری از راه رسیدند و کنترل زندگی خانوادگی حتی سخت تر شد. گاهی اوقات، احساس می‌کردم - و هنوز هم دارم - مانند شعبده‌بازی که قبلاً همه توپ‌ها را رها کرده بود، اما به نوعی هنوز در تلاش بود تا نمایش را ادامه دهد. نویسنده تربیت"}, {"source": "Business Insider", "title": "Inside America's $66 billion bet to beat China's shipbuilding empire", "link": "https://www.businessinsider.com/inside-a h three researchers, saying they had violated its policies for sharing sensitive information. Johannes Heidecke, the company's safety head, also left earlier this year. In the essay, Robinson framed the issue as a matter of culture, writing, \"This moment needs a degree of humility that isn't natural for people who have succeeded through their extreme confidence.\" \"The safety approach that emerges from such a culture starts with unimpeded optimism about being able to solve problems as they arise,\" he added. In the aftermath of the high-profile Hugging Face security breach , OpenAI is grappling with a series of other safety incidents in which it said its AI models have misbehaved. \"An environment where things like this can happen is no place to grow artificial minds that could be smarter than we are and that might not do what we want them to,\" Robinson wrote. Progress in model capabilities has led researchers and company executives to call for a slowdown in AI development. OpenAI CEO Sam Altma", "date_str": "2026-10-03T12:43:14+00:00", "hash": "a19bd4d0c8cb612b", "title_fa": "دیوید رابینسون، رهبر ایمنی OpenAI استعفا می دهد - و می گوید فرهنگ شرکت خطرناک است", "summary_fa": "دیوید رابینسون شفافیت ایمنی را در OpenAI رهبری کرد. حالا او علیه شرکت صحبت می کند. رویترز دیوید رابینسون، رهبر تیم سیستم های ایمنی OpenAI، هفته گذشته استعفا داد. در مقاله ای منتشر شده، او پیشنهاد کرد که این شرکت فروتنی کافی برای مدیریت مسئولانه هوش مصنوعی را ندارد. این خروج تحولات بیشتری را به رتبه های ایمنی شرکت هوش مصنوعی اضافه می کند. دیوید رابینسون، یکی از رهبران تیم سیستم‌های ایمنی OpenAI، شرکت را ترک کرد - و در ادامه مقاله‌ای تاول‌ناک نوشت که «خوش‌بینی بلامانع» غول هوش مصنوعی محیط خطرناکی را برای این فناوری قدرتمند ایجاد کرده است. Business Insider به طور انحصاری در روز جمعه گزارش داد که رابینسون هفته گذشته را ترک کرد و این یک لحظه دیگر از تحول در رده های ایمنی شرکت بود. رابینسون روی شفافیت ایمنی در شرکت کار کرد، از جمله کمک به توسعه و اشتراک کارت‌های سیستمی که اطلاعاتی در مورد مدل‌های آن ارائه می‌دهند. او بلافاصله به درخواست‌ها برای اظهار نظر پاسخ نداد، اما در مقاله‌ای برای آتلانتیک که در روز شنبه منتشر شد، نوشت: «من با دیگر کارکنان اخیراً جدا شده موافقم که شرکت‌های سازنده این فناوری تقریباً به اندازه کافی مراقب نیستند.» OpenAI فوراً به این مقاله پاسخ نداد، اما دیگران هشدار داده‌اند که اگر سیلیکون ولی مجبور به ترمز توسعه هوش مصنوعی باشد، می‌تواند به رقبای بین‌المللی و بازیگران بد اجازه دهد که از ایالات متحده پیشی بگیرند. خروج رابینسون همراه با موجی از توجه به اقدامات ایمنی و کارکنان OpenAI است. این شرکت روز پنجشنبه به اشتراک گذاشت که راه خود را با سه محقق \"جدا کرده\" و گفت که آنها سیاست های خود را برای به اشتراک گذاری اطلاعات حساس نقض کرده اند. یوهانس هایدکه، رئیس ایمنی این شرکت نیز اوایل سال جاری این شرکت را ترک کرد."}, {"source": "Business Insider", "title": "What to remember from Sarah J. Maas' books before the next 'A Court of Thorns and Roses' novel comes out", "link": "https://www.businessinsider.com/acotar-book-6-details-to-remember-before-reading-2026-10", "summary": "Sarah J. Maas next ACOTAR book is on the way. Bloomsbury Warning: This article contains major spoilers for Sarah J. Maas' \"ACOTAR\" and \"Crescent City\" series. The author's sixth book in the \"A Court of Thorns and Roses\" series will be published on October 27. Here's a guide to what you need to know from Maas' latest works to make sure you're prepped. SJM fans, we're going back to Prythian. On October 27, Bloomsbury will finally publish Sarah J. Maas' sixth book in the \"A Court of Thorns and Roses\" series, \"A Court of Splintered Harmony. \" The seventh book, \"A Court of Forgotten Melody,\" will follow on January 12, 2027. The October release marks Maas' first \"ACOTAR\" book since \"A Court of Silver Flames,\" published in 2021. Sarah J. Maas is a prolific romantasy writer. Alexandra Genova / SAINT LUCY Represents However, a portion of the 2024 \"Crescent City\" book, \"House of Flame and Shadow, \" took place in Prythian. Maas blended the worlds of \"Crescent City,\" \"ACOTAR,\" and \"Throne of Glass,\" creating an interconnected literary universe. Plus, the book had lasting implications for \"ACOTAR,\" so if you plan to keep reading the series, you should probably read all 16 of Maas' books . With all that in mind, it can be hard to keep track of the details in the bestsellers' works . To prep for the release, here's a look back at everything you need to know before reading \"A Court of Splintered Harmony.\" Warning: major spoilers ahead for \"ACOTAR\" and \"Crescent City.\" Nesta and the Valkyrie take center stage in 'A Court of Silver Flames' \"A Court of Silver Flames\" marks a turning point in the \"ACOTAR\" series, as Nesta Archeron becomes the protagonist , alongside General of the Night Court's armies and Inner Circle member Cassian. Nesta is in a dark place after she was Made fae by the Cauldron, the King of Hybern killed her father, and she killed him in revenge during the war in \"A Court of Wings and Ruin.\" High Lord and Lady Rhysand and Feyre instruct Cassian to train Nesta, Feyre's sister, in the ways of an Illyrian warrior to help her heal. Nesta strikes a bargain with Cassian to train in exchange for a favor of her choosing, resulting in an eight-pointed star tattoo appearing on their spines. Once she commits to training, Nesta falls in love with it. She recruits priestesses from the library below the House of Wind to join her, including Gwyneth (Gwyn) Berdara. Emerie, an Illyrian, also joins them. Together, Nesta, Gwyn, and Emerie revive an ancient legion of all-femal", "date_str": "2026-10-03T12:24:01+00:00", "hash": "4c9811aaace8b6ea", "title_fa": "قبل از انتشار رمان بعدی «یک دادگاه خار و گل سرخ» چه چیزهایی را باید از کتاب‌های سارا جی ماس به خاطر بسپارید.", "summary_fa": "سارا جی ماس کتاب بعدی ACOTAR در راه است. اخطار بلومزبری: این مقاله حاوی اسپویل های اصلی سریال های \"ACOTAR\" و \"Crescent City\" سارا جی ماس است. ششمین کتاب این نویسنده از مجموعه \"یک دادگاه خار و گل سرخ\" در تاریخ 27 اکتبر منتشر می شود. در اینجا راهنمای آنچه باید از آخرین آثار ماس بدانید برای اطمینان از آمادگی شما آورده شده است. طرفداران SJM، ما به Prythian برمی گردیم. در 27 اکتبر، بلومزبری سرانجام سارا جی. ششمین کتاب ماس از مجموعه \"یک دادگاه از خارها و گل های رز\"، \"یک دادگاه از هارمونی خرد شده\". هفتمین کتاب، \"یک دادگاه ملودی فراموش شده\" در 12 ژانویه 2027 دنبال می شود. انتشار اکتبر اولین کتاب \"ACOTAR\" ماس از زمان \"یک دادگاه شعله های نقره ای\" است که در سال 2021 منتشر شده است. الکساندرا ژنووا / سنت لوسی نمایندگی می کند با این حال، بخشی از کتاب \"شهر هلال\" در سال 2024، \"خانه شعله و سایه\" در پریتیان اتفاق افتاد. ماس جهان‌های «شهر هلال»، «ACOTAR» و «تاج شیشه‌ای» را در هم آمیخت و یک جهان ادبی به هم پیوسته را خلق کرد. به علاوه، این کتاب پیامدهای ماندگاری برای \"ACOTAR\" داشت، بنابراین اگر قصد دارید به خواندن این مجموعه ادامه دهید، احتمالاً باید همه 16 کتاب ماس را بخوانید. با در نظر گرفتن همه این موارد، پیگیری جزئیات در آثار پرفروش‌ها می‌تواند دشوار باشد. برای آماده شدن برای انتشار، در اینجا نگاهی به همه چیزهایی که باید قبل از خواندن \"یک دادگاه هارمونی متلاشی شده\" بدانید، آورده شده است. هشدار: اسپویلرهای بزرگی برای «ACOTAR» و «Cresent City» در راه است. نستا و والکری در «یک دادگاه شعله‌های نقره‌ای» در مرکز صحنه قرار می‌گیرند «یک دادگاه شعله‌های نقره‌ای» نقطه عطفی در مجموعه «ACOTAR» است، زیرا نستا آرچرون در کنار ژنرال ارتش‌های دادگاه شب و کاسیان، عضو دایره داخلی، قهرمان می‌شود. نستا"}, {"source": "Business Insider", "title": "12 cities around the world where you can live comparably cheaply, from $400-a-month rents to $1 cappuccinos", "link": "https://www.businessinsider.com/cheap-global-cities-for-digital-nomad-remote-work-move-live-abroad", "summary": "Tirana, Albania. Arpan Chakraborty/Getty Images Many Americans are moving abroad in search of cheaper housing, food, and a more laid-back lifestyle. In these 12 international cities, the cost of living is relatively low compared to the US. It includes a city that sits among the Andes and a Thai paradise with ancient temples. More and more Americans are looking overseas to reinvent their lives, whether in search of a lower cost of living , better healthcare , or a more affordable retirement . But with so many countries offering different lifestyles and costs, deciding where to put down roots can be difficult. Business Insider compiled a list of 12 cities with relatively low living costs compared with the US, using data from Numbeo , a crowdsourced cost-of-living comparison website. Numbeo's estimates include monthly costs for a single person and a family of four, as well as city-center rent and home prices. It also tracks typical spending on coffee, a meal for two, and a gym membership. Because its methodology relies in part on user-submitted data, the figures should be treated as a guide rather than definitive costs. Many of these cities also rank well on quality-of-life measures, but each comes with its own challenges. Lower costs can sometimes mean concerns about safety, healthcare access , or air quality, and, as such, people looking to relocate should research the latest travel advisories from the US State Department before moving. And even where dining and entertainment are inexpensive, buying a home may still be costly. All prices have been converted to US dollars, and city populations are sourced from United Nations data, unless otherwise noted. Because the UN uses a standardized definition of city boundaries, its 2025 estimates may differ from official city or metro-area population figures. Read on to learn more about these places, including India's \"Pink City\" and a Colombian city set against the dramatic landscape of the Andes. Accra, Ghana Accra Skyline. Cyrus Wireko Wiredu/Getty Images Population: 5.6 million (2025) Known for: Ghana is one of West Africa's fastest-growing countries, and its capital, Accra, has become a lively landing spot for expats from around the world. Many make their homes in central neighborhoods like East Legon, drawn by the city's coastal setting, beach culture, and growing business and creative scenes. Average monthly rent for a one-bedroom home in the city center: $679.15 Average cost to buy a 1,000-square-foot home in", "date_str": "2026-10-03T12:22:02+00:00", "hash": "9a42b71af0c950d3", "title_fa": "12 شهر در سراسر جهان که می توانید نسبتاً ارزان در آنها زندگی کنید، از اجاره ماهانه 400 دلار تا کاپوچینو 1 دلاری", "summary_fa": "تیرانا، آلبانی آرپان چاکرابورتی/ گتی ایماژ بسیاری از آمریکایی ها به دنبال مسکن ارزان تر، غذا و سبک زندگی آرام تر به خارج از کشور می روند. در این 12 شهر بین المللی، هزینه زندگی در مقایسه با ایالات متحده نسبتاً پایین است. این شامل شهری است که در میان رشته کوه های آند قرار دارد و بهشت ​​تایلندی با معابد باستانی. بیشتر و بیشتر آمریکایی ها به دنبال اختراع مجدد زندگی خود در خارج از کشور هستند، چه در جستجوی هزینه های زندگی کمتر، مراقبت های بهداشتی بهتر، یا بازنشستگی مقرون به صرفه تر. اما با توجه به بسیاری از کشورها که سبک های زندگی و هزینه های متفاوتی را ارائه می دهند، تصمیم گیری در مورد اینکه در کجا ریشه کن شود می تواند دشوار باشد. Business Insider با استفاده از داده‌های Numbeo، یک وب‌سایت مقایسه هزینه زندگی جمع‌سپاری شده، فهرستی از 12 شهر با هزینه‌های زندگی نسبتاً پایین در مقایسه با ایالات متحده تهیه کرد. تخمین های Numbeo شامل هزینه های ماهانه برای یک فرد مجرد و یک خانواده چهار نفره و همچنین اجاره مرکز شهر و قیمت خانه است. همچنین هزینه های معمول برای قهوه، یک وعده غذایی دو نفره و عضویت در باشگاه را ردیابی می کند. از آنجایی که روش آن تا حدی به داده های ارسالی توسط کاربر متکی است، ارقام باید به عنوان یک راهنما در نظر گرفته شوند تا هزینه های قطعی. بسیاری از این شهرها از نظر معیارهای کیفیت زندگی نیز رتبه خوبی دارند، اما هر کدام چالش‌های خاص خود را دارند. هزینه‌های پایین‌تر گاهی اوقات می‌تواند به معنای نگرانی در مورد ایمنی، دسترسی به مراقبت‌های بهداشتی یا کیفیت هوا باشد، و به همین دلیل، افرادی که به دنبال جابه‌جایی هستند باید قبل از نقل مکان درباره آخرین توصیه‌های سفر وزارت خارجه ایالات متحده تحقیق کنند. و حتی در جایی"}, {"source": "Business Insider", "title": "I left my husband and 3 kids for the first time for a work conference. I added 2 days at the end for some solo travel.", "link": "https://www.businessinsider.com/solo-travel-without-family-work-conference-2026-10", "summary": "The author got to do some exploring after her work conference. Courtesy of Kris Ann Valdez At almost 38, I took my first solo trip and worried about navigating everything on my own. I learned that traveling alone made me more responsible, and I relished the time to myself. After years of planning family trips, following only my own interests felt freeing. I'm almost 38 years old, and I just took my first solo trip for a work conference in Dover, Delaware, this September. For a few months leading up to the trip, every time I thought about the logistics and emotions of leaving my kids , I felt a tight knot of anxiety. I was also nervous about traveling by myself to a large conference where the only person I knew was a work connection I'd only ever met via email. When I visualized taking this trip, it was odd how much less anxious I felt when I inserted one or more of my kids, my husband, or a friend into the narrative. The idea of taking care of another person, or simply having company, seemed easier and less intimidating than spending that time alone, thinking only about myself. I also thought about all the times I'd forgotten a phone charger or toothbrush and how often I'd relied on others when traveling. I feared I was just too codependent to take a trip by myself and enjoy it. While solo traveling, the author was able to think only about her own interests. Courtesy of Kris Ann Valdez Navigating without anyone else was better than I expected I flew a red-eye from Phoenix to Philadelphia, then summoned an Uber for the 1.5-hour drive to Dover. Before I left, I messaged two girlfriends and asked whether they always chose female Uber drivers to feel safer when traveling alone. They told me no, but they used some of Uber's other safety precautions, like sharing their location with someone. Before I left, I turned these features on. Thankfully, I felt comfortable in all of my rideshare scenarios and navigated to each place with relative ease. I will admit I'm often forgetful, prone to losing my room key, and I struggle with running late . I was especially concerned about keeping my electronics charged, as my husband or teen son often handles that. But I found I was surprisingly more responsible when it was all on me. Over the course of six days, I was never late to meetings, never lost anything important, and never let my phone die. She stayed in Wilmington, Delaware, called chateau country, and got to explore several beautiful estates and gardens. Courtesy of ", "date_str": "2026-10-03T12:11:01+00:00", "hash": "932980d60f2a760c", "title_fa": "من برای اولین بار شوهر و 3 بچه ام را برای یک کنفرانس کاری ترک کردم. در پایان 2 روز برای سفرهای انفرادی اضافه کردم.", "summary_fa": "نویسنده مجبور شد پس از کنفرانس کاری خود کمی کاوش کند. با حسن نیت از کریس آن والدز تقریباً در 38 سالگی، اولین سفر انفرادی خود را انجام دادم و نگران این بودم که همه چیز را به تنهایی طی کنم. یاد گرفتم که تنها سفر کردن، مسئولیت پذیری من را بیشتر می کند، و از زمان برای خودم لذت بردم. پس از سال‌ها برنامه‌ریزی برای سفرهای خانوادگی، دنبال کردن تنها علایق خودم احساس آزادی می‌کردم. من تقریباً 38 سال سن دارم و اولین سفر انفرادی خود را برای یک کنفرانس کاری در دوور، دلاور، در سپتامبر امسال انجام دادم. برای چند ماه منتهی به سفر، هر بار که به تدارکات و احساسات ترک فرزندانم فکر می کردم، یک گره محکم از اضطراب را احساس می کردم. من همچنین از اینکه خودم به یک کنفرانس بزرگ سفر کنم که در آن تنها کسی که می‌شناختم یک ارتباط کاری بود که فقط از طریق ایمیل ملاقات کرده بودم، عصبی بودم. وقتی این سفر را تجسم کردم، عجیب بود که وقتی یک یا چند نفر از بچه‌هایم، شوهرم یا یکی از دوستانم را وارد روایت کردم چقدر کمتر احساس اضطراب می‌کردم. ایده مراقبت از شخص دیگری، یا صرفاً داشتن شرکت، آسان تر و کمتر ترسناک به نظر می رسید تا اینکه آن زمان را تنها بگذرانم و فقط به خودم فکر کنم. همچنین به تمام مواقعی که شارژر تلفن یا مسواک را فراموش کرده‌ام و اینکه چقدر در سفر به دیگران اعتماد کرده‌ام فکر می‌کنم. می ترسیدم آنقدر وابسته باشم که نمی توانم به تنهایی سفر کنم و از آن لذت ببرم. نویسنده در حین سفر انفرادی فقط به علایق خود فکر می کرد. با حسن نیت کریس آن والدز پیمایش بدون هیچ کس دیگری بهتر از چیزی بود که انتظار داشتم، از فونیکس به فیلادلفیا پرواز کردم، سپس یک Uber را"}, {"source": "Business Insider", "title": "'Bond King' Bill Gross shares his best investment ever — and the brutal bet that lost him 50% in a month", "link": "https://www.businessinsider.com/bill-gross-best-worst-investment-mlp-energy-oil-stocks-bonds-2026-10", "summary": "Bill Gross founded bond giant Pimco. Mary Hurlbut/Stu News Laguna Bill Gross shared his best investment and worst investing error with Business Insider. The billionaire \"Bond King\" said his bet on pipeline stocks has paid off handsomely. The Pimco cofounder said he lost 50% of his savings in a month when he bet on Treasurys in 1969. Bill Gross says he made the best investment of his career only a few years ago, while his worst investing error dates back nearly six decades. The billionaire cofounder of bond giant Pimco told Business Insider by email this week that his shrewdest wager to date was the purchase of a portfolio of master limited partnership (MLP) pipeline stocks around three years ago. Pointing to Western Midstream Partners as an example, he trumpeted the \"enormous\" tax benefits of these types of stocks. Specifically, Gross said their distributions are largely treated as return of capital instead of dividends, so they're only taxed upon sale, and those deferred tax liabilities can be erased if the returns are passed down at death on a stepped-up basis . \"Yields are twice similar corporate pipelines,\" Gross said. Western pays a dividend yield of over 8%, whereas Kinder Morgan pays around 4%. \"Higher oil prices have been an extra boost,\" Gross added. The US-Iran conflict has fueled a roughly 60% rise in crude prices since the start of this year, generating higher storage and distribution fees for energy infrastructure companies. Biggest misfire As for his gravest investing mistake, Gross told Business Insider it was buying 30-year Treasurys after opening his personal account in 1969. \"Lost 50% in 1 month,\" he wrote. Gross — whose nickname is the \"Bond King\" because he grew Pimco's flagship Total Return Fund from scratch to $270 billion over nearly 30 years — previously described the episode to Financial Advisor as an \"expensive lesson about the dangers of leverage.\" He told the magazine that he bought Treasury bonds with 10-to-1 leverage just months before starting at Pimco, using $10,000 he'd made playing blackjack. Treasurys promptly tanked and \"wiped out half of my savings,\" Gross said. He added that it was the biggest mistake in percentage terms of his career, and it taught him that \"gambling belongs at the casino.\" A pipeline of returns Gross has been touting MLP pipeline stocks for several years . In October 2024, he underscored on his blog that deferred taxes on their dividends allow investors to fully reinvest them and juice their compound", "date_str": "2026-10-03T12:00:01+00:00", "hash": "727cdee4b6d131cc", "title_fa": "بیل گراس «پادشاه باند» بهترین سرمایه گذاری خود را به اشتراک می گذارد - و شرط وحشیانه ای که او را در یک ماه 50 درصد از دست داد.", "summary_fa": "بیل گراس غول اوراق قرضه پیمکو را تأسیس کرد. Mary Hurlbut/Stu News Laguna Bill Gross بهترین سرمایه گذاری و بدترین اشتباه سرمایه گذاری خود را با Business Insider به اشتراک گذاشت. میلیاردر \"باند کینگ\" گفت شرط بندی او بر روی سهام خط لوله به خوبی جواب داده است. بنیانگذار Pimco گفت که در سال 1969 هنگام شرط بندی روی خزانه داری 50 درصد پس انداز خود را در یک ماه از دست داده است. بیل گراس می گوید که او بهترین سرمایه گذاری دوران حرفه ای خود را تنها چند سال پیش انجام داده است، در حالی که بدترین اشتباه سرمایه گذاری او به نزدیک به شش دهه باز می گردد. میلیاردر یکی از بنیانگذاران غول اوراق قرضه پیمکو این هفته از طریق ایمیل به Business Insider گفت که زیرکانه ترین شرط او تا به امروز، خرید مجموعه ای از سهام خط لوله با مشارکت محدود اصلی (MLP) حدود سه سال پیش است. او با اشاره به شرکای وسترن میدستریم به عنوان مثال، مزایای مالیاتی «عظیم» این نوع سهام را در بوق و کرنا کرد. به طور خاص، ناخالص گفت که توزیع‌های آن‌ها عمدتاً به‌عنوان بازگشت سرمایه به جای سود سهام تلقی می‌شود، بنابراین فقط در هنگام فروش مشمول مالیات می‌شوند، و اگر بازده‌ها در زمان مرگ به‌صورت افزایش‌یافته منتقل شوند، می‌توان آن بدهی‌های مالیاتی معوق را پاک کرد. گراس گفت: \"بازده دو برابر خطوط لوله شرکتی مشابه است.\" وسترن سود سهام بیش از 8 درصد را پرداخت می کند، در حالی که کیندر مورگان حدود 4 درصد را پرداخت می کند. گروس افزود: \"قیمت های بالای نفت یک تقویت اضافی بوده است.\" مناقشه ایران و آمریکا از ابتدای سال جاری به افزایش تقریبا 60 درصدی قیمت نفت خام دامن زده است و هزینه های ذخیره سازی و توزیع بالاتری را برای شرکت های زیرساخت انرژی ایجاد کرده است. بزرگ‌ترین"}, {"source": "Business Insider", "title": "I thought I was raising my daughter. Looking back, I think we raised each other.", "link": "https://www.businessinsider.com/young-mom-lost-college-scholarship-earned-degree-2026-10", "summary": "The author was 20 when she had her daughter, who is now 21. Courtesy of the author I became pregnant at 20 and had to leave college and give up my full scholarship. I returned to school while working and raising my daughter, graduating seven years later. My daughter is now 21, and I realize we grew into adulthood together. Growing up as a first-generation immigrant , I understood early how much my parents sacrificed to build a better future for our family. They left everything they knew behind so their children could have opportunities they never had. For me, that meant becoming the first in my family to graduate from college. I graduated from high school with a full college scholarship, and for a while, my life seemed to be unfolding exactly as my parents and I had imagined: college, a degree, a career, marriage, and children — the American dream as we understood it. Then, a month after my 20th birthday, everything changed. I found out I was pregnant. I lost my scholarship My second trimester was difficult, and I ultimately had to leave college in the middle of the semester, which meant losing my full scholarship. Not knowing if, or when, I would be able to return was heartbreaking. But what hurt most was seeing my parents' disappointment. I'll never forget telling my dad I was pregnant and would have to drop out of school . We didn't speak for months. He reminded me how unprepared I was and how quickly the future I had worked so hard to build seemed to be slipping away. My mom was disappointed, too, but remained supportive. The author felt bad about losing her scholarship after everything her parents had done. Courtesy of the author My parents had sacrificed so much to give me an education, and I had always seen graduating from college as a way to honor those sacrifices. I felt I had let them down — and was facing a future I wasn't ready for. I was technically an adult, but I was still learning how to become one. While my peers were navigating college and discovering themselves, I was learning to care for someone who depended on me completely. I was becoming a mother while still becoming myself, and every decision about my future now had to take Samantha into account. People asked if my daughter was my little sister I remember dropping her off at day care and having her classmates ask if I was her sister. The question reminded me just how young I was — and sometimes felt more embarrassing than flattering. I couldn't help but compare our lives to those of", "date_str": "2026-10-03T11:37:01+00:00", "hash": "e4faf9ec5683cfe0", "title_fa": "فکر می کردم دارم دخترم را بزرگ می کنم. با نگاهی به گذشته، فکر می کنم ما یکدیگر را بزرگ کردیم.", "summary_fa": "نویسنده 20 ساله بود که دخترش را به دنیا آورد که اکنون 21 ساله است. با حسن نیت نویسنده من در 20 سالگی باردار شدم و مجبور شدم کالج را ترک کنم و بورس تحصیلی ام را کامل رها کنم. من در حین ک
