 در سال 2028 و یک Ascend 980 را در سال 2029 قرار داد. او قانون مقیاس Tau را برای آهنگ اعتباری عنوان کرد. تاریخ های تراشه یکی از موارد در یک لیست طولانی بود. هواوی همچنین یک موتور نوری و دو SuperPoD ارتقا یافته را راه اندازی کرد. یک خوشه ذخیره سازی حافظه، یک سری سوئیچ و یک پلتفرم ابری به دنبال داشت. نگه داشتن همه آن در کنار هم یک معماری جدید اتصال است. قطعه اصلی Atlas 960E SuperPoD است. هوآوی آن را برای اولین بار در صنعت می نامد که از اپتیک نزدیک به بسته بندی استفاده می کند. یک پاد دارای 4096 NPU است و 8 EFLOPS را با دقت FP8 ارائه می دهد. حافظه تا یک پتابایت HBM در هر غلاف اجرا می شود. اپتیک نقطه اصلی است. هواوی موتور نوری نزدیک به بسته بندی خود را به نام Hi-ONE ساخته است. هر واحد 7.2 ترابیت بر ثانیه حرکت می کند و یک منبع نور داخلی را حمل می کند. نصب 5500 عدد از آنها 48000 ماژول نوری قابل اتصال 800G را"}, {"source": "MIT Tech Review", "title": "The Download: AI’s extinction risk and bioweapons threat", "link": "https://www.technologyreview.com/2026/09/18/1142577/the-download-ai-extinction-threat-bioweapons/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. Could AI really kill us all? Your questions, answered On Wednesday, MIT Technology Review hosted a live Roundtables event that asked the question many seem to be asking right now: could AI really kill us all? But attendees had more questions than we had time to answer, so we asked senior AI editor Will Douglas Heaven and AI reporter Grace Huckins to tackle some of the best ones. The questions they tried to answer include: am I going to die? Why should AI kill us, if at all? Is AI really dangerous, or is it just tech companies drumming up PR? And what steps can be taken to make sure AI is controlled, monitored and regulated effectively? Here are their responses . —Will Douglas Heaven and Grace Huckins The specter of AI-enabled bioweapons is a wake-up call for biotech One of the ways AI could potentially cause catastrophic harm is by aiding the design and creation of bioweapons. In 2022, researchers found that it was remarkably easy to do this with an AI “molecule generator” built to develop drugs. In less than six hours, the model generated 40,000 molecules that could serve as chemical warfare agents. Today, AI tools can answer questions on almost every area of science, while advances in gene editing and synthetic biology have made biotech tools more accessible. There are safeguards, but none are ironclad. However, scientists disagree about how serious the risk is anyway. Find out why it’s easier than ever to design killer pathogens . —Jessica Hamzelou This story is from The Checkup, our weekly biotech newsletter. Sign up to receive it in your inbox every Thursday. The role of the astronaut is in flux We go to space for geopolitical prestige, manifest destiny, spiritual fulfillment, scientific curiosity, and, increasingly, business opportunities. In the wake of Artemis II, a slew of new books suggest that these justifications are subsumed by one unifying fact: humans have itchy feet, and we are simply wired to roam. In The Ultraview Effect , space anthropologist Deana L. Weibel frames human space exploration as part of our need to embark on pilgrimages. In A Heart for Space , civilian astronaut Eiman Jahangir recounts one such voyage with Blue Origin. And in Dinner with an Astronaut , former NASA astronaut Leroy Chiao argues that people simply “need to know what’s on the other side.” See what these three new books have t", "date_str": "2026-09-18T12:10:00+00:00", "hash": "f1c450a6a464c2d1", "title_fa": "دانلود: خطر انقراض هوش مصنوعی و تهدید سلاح های زیستی", "summary_fa": "روز چهارشنبه، MIT Technology Review میزبان یک رویداد میزگرد زنده بود که این سوال را پرسید که به نظر می رسد بسیاری در حال حاضر می پرسند: آیا هوش مصنوعی واقعا می تواند همه ما را بکشد؟ اما شرکت‌کنندگان سوالات بیشتری نسبت به زمان ما برای پاسخ دادن داشتند، بنابراین از ویل داگلاس هیون، سردبیر ارشد هوش مصنوعی و گریس هاکینز، خبرنگار هوش مصنوعی خواستیم تا به برخی از بهترین‌ها بپردازند. سؤالاتی که آنها سعی کردند به آنها پاسخ دهند عبارتند از: آیا من خواهم مرد؟ چرا هوش مصنوعی باید ما را بکشد، اگر اصلا؟ آیا هوش مصنوعی واقعا خطرناک است یا فقط شرکت های فناوری در حال ایجاد روابط عمومی هستند؟ و چه اقداماتی را می توان برای اطمینان از کنترل، نظارت و تنظیم موثر هوش مصنوعی انجام داد؟ یکی از راه هایی که هوش مصنوعی می تواند به طور بالقوه آسیب فاجعه بار ایجاد کند، کمک به طراحی و ایجاد سلاح های زیستی است. در سال 2022، محققان دریافتند که انجام این کار با یک \"مولکول ژنراتور\" هوش مصنوعی که برای تولید دارو ساخته شده است، بسیار آسان است. در کمتر از شش ساعت، این مدل 40000 مولکول تولید کرد که می‌توانستند به عنوان عوامل جنگ شیمیایی عمل کنند. امروزه ابزارهای هوش مصنوعی می توانند تقریباً در هر زمینه ای از علم به سؤالات پاسخ دهند، در حالی که پیشرفت در ویرایش ژن و زیست شناسی مصنوعی ابزارهای بیوتکنولوژی را در دسترس تر کرده است. پادمان‌هایی وجود دارد، اما هیچکدام آهنین نیستند. با این حال، دانشمندان در مورد جدی بودن این خطر به هر حال اختلاف نظر دارند. دریابید که چرا طراحی پاتوژن های کشنده آسان تر از همیشه است. ما برای اعتبار ژئوپلیتیک، سرنوشت آشکار، تحقق معنوی، کنجکاوی علمی، و به طور فزاینده فرصت های تجاری به فضا می رویم. پس از آرتمیس دوم، مجموعه‌ای از کتاب‌های"}, {"source": "MIT Tech Review", "title": "Could AI really kill us all? Your questions, answered.", "link": "https://www.technologyreview.com/2026/09/18/1144435/could-ai-really-kill-us-all-your-questions-answered/", "summary": "On Wednesday, MIT Technology Review hosted a live Roundtables event for subscribers that asked the question everyone’s asking right now: Could AI really kill us all? But attendees had so many more questions than we had time to answer in the 30 minute session. So we asked our senior AI editor Will Douglas Heaven and AI reporter Grace Huckins to round up some of the best questions attendees submitted and try their best to answer them. Thanks to all who submitted questions! Am I gonna die? Yes, eventually. Unfortunately, my journalistic powers of prognostication aren’t powerful enough for me to tell you how. But it certainly could be because of AI. AI-powered drones have already killed people in Ukraine, and AI-driven cyberattacks on hospitals will surely claim victims before long. Could AI go even further, and kill all of us? Less likely. But some people—quirky people, but undeniably knowledgeable about AI—have been warning for years that this could happen. And while I’m not yet stockpiling canned food or trying to get in good with a bunker-owning megabillionaire, I have noticed that the doomers’ predictions about AI capabilities and alignment have, over the past couple of years, proved disconcertingly accurate. That certainly doesn’t mean that their more dire forecasts will come true, but it’s enough for me to sit up and take notice. — Grace Huckins Are you going to die because of AI? I’d say there’s a non-zero chance. Let’s say you’re unlucky enough to be the victim of a freakish near-future event or accident. Maybe it’s a cyberattack carried out by a swarm of AI agents on critical infrastructure. Sadly, a scenario like that now no longer feels as far-fetched as it once did. Or maybe a novel AI-designed pathogen cuts through the population. Or the world economy crashes, causing conflicts and famine. Both plausible, but I think less likely. Are we all going to die because of AI? Nope. There are no circumstances outside of apocalyptic science fiction in which AI could kill us all. You can spin up any number of scare stories, but they’re not grounded in present-day realities about what the tech can do or where it’s headed. Some people argue that there’s no harm in preparing for the worst, however wacky it might seem. Maybe. But I think such catastrophizing can make people excuse or overlook many of the more immediate problems with the existing technology and the companies building it. — Will Douglas Heaven Why would AI kill us? Someone might tell it to, and i", "date_str": "2026-09-18T11:29:22+00:00", "hash": "c03a541d49a86e69", "title_fa": "آیا هوش مصنوعی واقعا می تواند همه ما را بکشد؟ سوالات شما پاسخ داده شد", "summary_fa": "روز چهارشنبه، MIT Technology Review میزبان یک رویداد میزگرد زنده برای مشترکین بود که این سوال را پرسید که همه در حال حاضر می پرسند: آیا هوش مصنوعی واقعا می تواند همه ما را بکشد؟ اما شرکت کنندگان خیلی بیشتر از زمانی که ما وقت داشتیم در جلسه 30 دقیقه ای به آنها پاسخ دهیم، سوال داشتند. بنابراین، از ویل داگلاس هیون، ویراستار ارشد هوش مصنوعی و گریس هاکینز، خبرنگار هوش مصنوعی خواستیم تا تعدادی از بهترین سوالاتی را که شرکت کنندگان ارسال کرده اند جمع آوری کنند و تمام تلاش خود را برای پاسخ به آنها بکنند. با تشکر از همه کسانی که سوالات را ارسال کردند! من قراره بمیرم؟ بله، در نهایت. متأسفانه، قدرت پیش بینی روزنامه نگاری من به اندازه کافی قدرتمند نیست که بتوانم به شما بگویم چگونه. اما مطمئناً می تواند به دلیل هوش مصنوعی باشد. پهپادهای مجهز به هوش مصنوعی قبلاً مردم را در اوکراین کشته‌اند و حملات سایبری مبتنی بر هوش مصنوعی به بیمارستان‌ها مطمئناً زودتر قربانی خواهند گرفت. آیا هوش مصنوعی می تواند حتی فراتر رفته و همه ما را بکشد؟ احتمال کمتری دارد. اما برخی از افراد - افراد دمدمی مزاج، اما غیرقابل انکار آگاه در مورد هوش مصنوعی - برای سال ها هشدار می دهند که ممکن است این اتفاق بیفتد. و در حالی که من هنوز مواد غذایی کنسرو انباشته نمی‌کنم یا سعی نمی‌کنم با یک مگابیلیاردر صاحب پناهگاه به خوبی برسم، متوجه شده‌ام که پیش‌بینی‌های محکومان درباره قابلیت‌ها و همسویی هوش مصنوعی، طی دو سال گذشته، به طرز نگران‌کننده‌ای دقیق بوده است. مطمئناً این بدان معنا نیست که پیش‌بینی‌های وحشتناک‌تر آنها محقق می‌شود، اما برای من کافی است که بنشینم و توجه کنم. - گریس هاکینز آیا قرار است به خاطر هوش مصنوعی بمیرید؟ من می گویم یک شانس غیر صفر وجود دارد. فرض کنید به اندازه کافی"}, {"source": "MIT Tech Review", "title": "The specter of AI-enabled bioweapons is a wake-up call for biotech", "link": "https://www.technologyreview.com/2026/09/18/1144329/the-specter-of-ai-enabled-bioweapons-is-a-wake-up-call-for-biotech/", "summary": "In recent weeks, leaders of some of the bigges باطی آن از طریق ماهواره‌های استارلینک در ارتفاع حدود ۳۶۰ کیلومتری زمین برقرار شد. این آزمایش با فناوری Direct to Cell انجام شده است. در فناوری Direct to Cell، ماهواره‌های مجهز به تجهیزات ارتباطی می‌توانند مانند دکل‌های مخابراتی در فضا با گوشی‌های معمولی ارتباط برقرار کنند. به این ترتیب، زمانی که کاربر خارج از پوشش 4G یا 5G زمینی باشد و در فضای باز دید مناسبی به آسمان داشته باشد، گوشی می‌تواند به شبکه‌ی ماهواره‌ای متصل شود؛ بدون این‌که به دیش یا تجهیزات اختصاصی نیاز باشد. زومیت لایک آزمایش جدید بخشی از همکاری فست‌وب و استارلینک برای توسعه‌ی سرویس Starlink Mobile در ایتالیا است. هدف این پروژه، ایجاد پوشش ارتباطی در مناطقی است که شبکه‌های زمینی به آن‌ها دسترسی ندارند؛ از مناطق کوهستانی و روستایی گرفته تا نقاط دورافتاده‌ای که ایجاد دکل مخابراتی در آن‌ها دشوار یا پرهزینه است. سرویس فعلاً تجاری نشده و فست‌وب آن را هنوز تست می‌کند. در شرایط فعلی امکان ارسال و دریافت پیامک و استفاده از برخی اپلیکیشن‌ها وجود دارد و اپلیکیشن‌های سازگار می‌توانند قابلیت‌های صوتی و تصویری را ارائه دهند. واتساپ، گوگل مپس، Messenger و X از جمله اپلیکیشن‌هایی هستند که فست‌وب در فهرست سازگاری خود به آن‌ها اشاره کرده است. تماس تلفنی عادی از طریق شبکه‌ی موبایل ماهواره‌ای فعلاً پشتیبانی نمی‌شود و تماس‌های اضطراری نیز در حال حاضر جزو قابلیت‌های ارائه‌شده نیستند. همچنین برای اتصال، گوشی باید در فضای باز و با دید مستقیم به آسمان قرار داشته باشد."}, {"source": "Zoomit", "title": "قیمت لپ‌تاپ‌های شیائومی بی‌سروصدا افزایش یافت", "link": "https://www.zoomit.ir/laptop/467369-xiaomi-hikes-redmi-laptop-prices/", "summary": "شیائومی قیمت لپ‌تاپ‌های سری ردمی بوک پرو و شیائومی بوک پرو را در بازار چین بین ۴۰۰ تا ۷۰۰ یوان افزایش داد.", "date_str": "2026-09-18T08:00:00+00:00", "hash": "03f4a03e04f2c3b6", "title_fa": "قیمت لپ‌تاپ‌های شیائومی بی‌سروصدا افزایش یافت", "summary_fa": "شیائومی قیمت لپ‌تاپ‌های سری ردمی بوک پرو و شیائومی بوک پرو را در بازار چین بین ۴۰۰ تا ۷۰۰ یوان افزایش داد. تبلیغات شیائومی بی‌سروصدا، قیمت لپ تاپ را در بازار چین افزایش داد. قیمت مدل‌های مختلف Redmi Book Pro و Xiaomi Book Pro بین ۴۰۰ تا ۷۰۰ ی
