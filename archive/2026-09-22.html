t how special it really is. Oktoberfest was first held in 1810 to celebrate the marriage of Louis I (the crown prince of Bavaria) and Princess Therese von Sachsen-Hildburghausen, and is now celebrated every year in September and October. Today, people from around the world travel to the festival to celebrate German culture and, of course, beer. In fact, last year's festival approximately 6.5 million people. Here are the five things that surprised me most when I attended Oktoberfest for the first time. The locals wear vests with their lederhosen, not suspenders Nearly everyone at Oktoberfest dresses the part — wearing traditional Bavarian lederhosen outfits for men and dirndls for women. My husband was sporting the lederhosen we'd always seen with leather suspenders. However, we quickly noticed that many of the men were wearing vests with their leather shorts instead. A friendly German local later told us that while suspenders are fine to wear, they tend to signal that you're not local. The tents are actually temporary wooden structures Each Oktoberfest tent has its own theme. Emily Pogue When I hear the word \"tent,\" I tend to think of the big tops at the circus. However, the ones I saw at Oktoberfest put those to shame. In reality, the huge tents at the festival are temporary wooden structures, some of which have two floors. In total, there are 17 \"large\" tents and 21 \"small\" ones throughout the festival, each with its own unique theme. Each tent also serves the beer of the affiliated brewery. Chugging and standing on tables will get you kicked out There's a misconception that chugging is a common thing at Oktoberfest. However, this couldn't be further from the truth. Locals warned us early on that chugging is a surefire way to get kicked out of a tent. And before long, we saw a ", "date_str": "2026-09-21T18:41:02+00:00", "hash": "2a8ce5bffeffd7b4", "title_fa": "من یک آمریکایی هستم که برای اولین بار به Oktoberfest رفتم. در اینجا 5 موردی است که من را در مورد جشنواره آلمان شگفت زده کرد.", "summary_fa": "بعد از حضور در جشنواره اکتبر برای اولین بار با شگفتی های زیادی روبرو شدم. امیلی پوگ به عنوان یک آمریکایی که برای اولین بار به جشنواره اکتبر رفتم، با شگفتی های زیادی روبرو شدم. خوردن آبجو و ایستادن روی میز شما را بیرون می‌اندازد، اما رقصیدن روی نیمکت‌ها اشکالی ندارد. با تعجب متوجه شدم که یک کارناوال کامل بیرون از چادرها برگزار می شود. من به‌عنوان یک علاقه‌مند به آبجو، در جشنواره‌های آبجو در سرتاسر ایالات متحده حضور داشته‌ام، که چند مورد از آن‌ها با موضوع «Oktoberfest» بودند. بنابراین، وقتی چند سال پیش سفری را برای بازدید از Oktoberfest در مونیخ رزرو کردم، فکر کردم که ایده بسیار خوبی از آنچه باید انتظار داشته باشم، دارم. با این حال، پس از چند قدم به جشنواره تقریباً 100 هکتاری، متوجه شدم که واقعاً چقدر خاص است. Oktoberfest اولین بار در سال 1810 برای جشن ازدواج لویی یکم (ولیعهد بایرن) و پرنسس ترز فون زاکسن-هیلدبورگهاوزن برگزار شد و اکنون هر سال در سپتامبر و اکتبر جشن گرفته می شود. امروزه مردم از سراسر جهان برای جشن گرفتن فرهنگ آلمانی و البته آبجو به این جشنواره سفر می کنند. در واقع، جشنواره سال گذشته حدود 6.5 میلیون نفر. در اینجا پنج موردی است که وقتی برای اولین بار در جشنواره Oktoberfest شرکت کردم، من را شگفت زده کرد. مردم محلی با لدرهوسن خود جلیقه می‌پوشند، نه ساسپندری تقریباً همه در Oktoberfest لباس می‌پوشند - لباس‌های سنتی باواریایی lederhosen برای مردان و dirndls برای زنان. شوهرم لدرهوسنی را که همیشه دیده بودیم با آویزهای چرمی می پوشاند. با این حال، ما به سرعت متوجه شدیم که بسیاری از مردان با شورت چرمی خود جلیقه پوشیده بودند. بعداً یکی از دوستان محلی آلمانی به ما گفت که اگرچه پوشیدن بند بند خوب است، اما نشان می دهد که شما محلی نیستید. چادرها در واقع"}, {"source": "Business Insider", "title": "Read the memo that Paramount CEO David Ellison sent to staffers after 2 settlements cleared the way for his WBD deal", "link": "https://www.businessinsider.com/read-paramount-ceo-david-ellisons-memo-after-settling-wbd-lawsuit-2026-9", "summary": "David Ellison s Paramount Skydance has a clear path to buy Warner Bros. Discovery. Aleksa fees if it hadn't settled the lawsuits. The uncertainty surrounding the deal had some Paramount staffers wondering about their jobs, employees previously told Business Insider. \"I know it's created real uncertainty, and for some of you, real anxiety — that's not lost on me,\" Ellison said in his memo to employees. Read Ellison's full memo here: Team, Just a few moments ago, California Attorney General Rob Bonta, on b", "date_str": "2026-09-21T18:19:46+00:00", "hash": "5cac49cbace8c325", "title_fa": "یادداشتی را که دیوید الیسون، مدیرعامل پارامونت برای کارکنان ارسال کرد، پس از اینکه دو تسویه حساب راه را برای قرارداد WBD او باز کرد، بخوانید.", "summary_fa": "پارامونت اسکای دنس دیوید الیسون راه روشنی برای خرید برادران وارنر دیسکاوری دارد. الکساندر کالکا/نور عکس از طریق گتی ایماژ. کریستینا بامفری/Variety از طریق Getty Images Paramount Skydance چراغ سبز خرید Warner Bros. Discovery را دریافت کرده است. شاکیانی که برای جلوگیری از ادغام مگا WBD پارامونت شکایت کرده بودند، موافقت کردند که پرونده های خود را حل و فصل کنند. یادداشت کامل دیوید الیسون، مدیرعامل پارامونت را در زیر بخوانید. دیوید الیسون، مدیرعامل پارامونت اسکای‌دنس، به تازگی به کارمندانش تأیید کرد که این شرکت با دعوی‌هایی که قراردادش برای خرید برادران وارنر دیسکاوری را متوقف کرده بود، حل و فصل کرده است. الیسون در یادداشتی روز دوشنبه که توسط Business Insider بدست آمده است، گفت: \"ما مجوز کامل برای این ادغام داریم و می توانیم به سمت بسته شدن حرکت کنیم.\" الیسون گفت که پارامونت \"به طور آزمایشی\" در حال برنامه ریزی برای تکمیل خرید 110 میلیارد دلاری WBD در \"تقریبا دو هفته\" است. پس از تکمیل این قرارداد، پارامونت یک غول هالیوود خواهد بود که مالک پارامونت پیکچرز، استودیوی برادران وارنر، CBS، HBO، HBO Max، Paramount+، Pluto TV و شبکه‌های تلویزیونی مانند CNN، TNT، TruTV و MTV است. قرارداد WBD پارامونت در ماه ژوئیه پس از طرح دعوی قضایی توسط 12 ایالت و انجمن نویسندگان آمریکا که استدلال می‌کردند ادغام رقابت را کاهش می‌دهد و به مصرف‌کنندگان آسیب می‌رساند، متوقف شد. روز دوشنبه شاکیان اعلام کردند که این دعاوی را حل و فصل کرده اند ns that previously existed. But there are different rules now.\" America's V8 obsession Ram is bringing back its TRX model sports truck, which boasts 777 horsepower. Stellantis/© 2025 Stellantis Detroit's Big Three are leading the way. On Thursday, GM announced two new V8s for the 2027 Chevrolet Silverado and GMC Sierra. That's after the company invested roughly $830 million in US propulsion plants . Ram Trucks brought back its Hemi V8 engine in August after discontinuing the motor just last year. This month, it relaunched the TRX, a V8-powered sport-oriented pickup the company markets as an automotive \"apex predator.\" Last May, General Motors stopped producing electric-vehicle batteries at its Western New York propulsion plant and restarted V8 engine production for trucks instead — a shift that required an $888 million investment. Ford is making a different sort of V8 bet. The company's updated 2027 F-150 still offers the 5.0-liter V8, even as a turbocharged V6 replaces the outgoing four-cylinder as its base engine. The company al", "date_str": "2026-09-21T18:15:40+00:00", "hash": "f1ec7978ae80be47", "title_fa": "رم، جنرال موتورز و فورد V8 را زنده نگه می دارند", "summary_fa": "خودروسازان آمریکایی در حال بازگرداندن موتورهای V8 گازسوز خود هستند زیرا تنظیم کننده های فدرال قوانین آب و هوا را کاهش می دهند. Brandon Bell/Getty Images Big Three دیترویت به ریشه های V8 خروشان خود بازمی گردد. V8 ها در آستانه مرگ بودند زیرا مقررات فدرال آلایندگی خودروسازان را تحت فشار قرار داده بود. اکنون که واشنگتن از قوانین آب و هوایی عقب نشینی می کند، کامیون های V8 و خودروهای عضلانی در حال بازگشت هستند. برای سال‌ها، صدای غرغر یک موتور V8 بزرگ و مردانه از کف‌های مونتاژ خودرو ایالات متحده محو می‌شد. دیگر نه. V8 یک موتور گازی با هشت سیلندر است که به شکل V چیده شده اند. این مدت‌ها برای آمریکایی‌هایی که می‌خواهند قدرت یدک‌کشی، حمل و نقل یا حرکت بسیار سریع را داشته باشند، انتخاب مناسبی بوده است – اگرچه معمولاً سوخت بیشتری نسبت به موتورهای کوچک‌تر مصرف می‌کند. در حال حاضر، حتی با افزایش قیمت بنزین، V8 زندگی جدیدی پیدا کرده است. واشنگتن قوانین انتشار گازهای گلخانه ای را کاهش داده، جریمه های مربوط به کارآیی سوخت در سراسر شرکت را حذف کرده و به اعتبار مالیاتی فدرال خودروهای برقی پایان داده است. خودروسازان با کامیون‌های جدید و احیا شده با موتور V8 و خودروهای پرفورمنس پاسخ می‌دهند و شرط می‌بندند که اشتهای آمریکایی‌ها برای وسایل نقلیه بزرگ هنوز باند زیادی دارد. داده ها نشان می دهد که تقاضا برای وسایل نقلیه بزرگ و گازسوز - به ویژه کامیون ها - همچنان قوی است. طبق گزارش Cox Automotive، مصرف کنندگان ایالات متحده تنها در ماه دسامبر حدود 15 میلیارد دلار برای پیکاپ های سایز کامل هزینه کردند. کوین رابرتز، مدیر اطلاعات بازار در CarGurus به Business Insider گفت: «مصرف‌کنندگان این خودروها را می‌خواستند. این فقط یک انتخاب اقتصادی چالش برانگیز بود، زیرا قوانینی که قبلا وجود داشت. اما اکنون قوانین متفاوتی وجود دارد.\" رم"}, {"source": "Business Insider", "title": "Trump says there are ways to 'rein' in AI 'if we have to'", "link": "https://www.businessinsider.com/trump-ai-justice-department-regulations-2026-9", "summary": "President Donald Trump suggested that AI companies could be reined in but that he would continue to promote the technology. Bloomberg/Getty Images President Donald Trump suggested there are existing ways to \"rein\" in AI. \"That's why we have the Department of Justice, and other Law Enforcement bodies,\" Trump wrote. Trump has repeatedly expressed a preference to use a light touch when it comes to AI regulation. President Donald Trump said the Justice Department has the ability to \"rein\" AI if need be. \"We will be careful, and that's why we have the Department of Justice, and other Law Enforcement bodies, that will rein things in if we have to,\" Trump wrote on Truth Social on Monday. While Trump mentioned the possibility of federal intervention in AI, he reiterated his long held-belief that it's best to have a light touch. \"I will only encourage AI or, SI (SUPER INTELLIGENCE)!\" he said. One potential regulatory area could center around liability. Earlier Monday, Treasury Secretary Scott Bessent said the Trump administration would not grant frontier AI labs protection from such risks. \"These labs need to take responsibility for themselves,\" Bessent said during an interview on CNBC's \"Squawk Box.\" \"They can slow down any time they want to.\" Trump and his administration are being closely watched to see how they respond to Anthropic CEO Dario Amodei's renewed push for federal regulation. Amodei already has some buy-in from OpenAI CEO Sam Altman and SpaceX CEO Elon Musk for his broader point that frontier AI labs should \"pace\" their development and use the time they buy to ensure the safety of their most cutting-edge models. In the US, states including California and Illinois have led AI regulation efforts as Congress has struggled to reach consensus. Trump has issued multiple AI-related executive actions, but there are limits to what he can do. After Amodei renewed his request, Trump and Vice President JD Vance both expressed skepticism that AI companies would ask the government to impose regulations that would slow parts of the industry. In his post on Monday, Trump reiterated his view that the current conversation around AI safety is a \"hoax\" akin to his stated opinions on climate change, questions about his 2016 campaign's relationship with Russia, and the circumstances of his first impeachment. \"This is more of a Hoax than even that of RUSSIA, RUSSIA, RUSSIA, UKRAINE, UKRAINE, UKRAINE, UKRAINE, and Climate Change!\" Trump wrote. Previously, Trump suggested tha", "date_str": "2026-09-21T17:59:33+00:00", "hash": "c776f76217eb0158", "title_fa": "ترامپ می‌گوید راه‌هایی وجود دارد که «اگر مجبور باشیم» هوش مصنوعی را مهار کنیم.", "summary_fa": "رئیس جمهور دونالد ترامپ پیشنهاد کرد که شرکت های هوش مصنوعی می توانند مهار شوند اما او به ترویج این فناوری ادامه خواهد داد. دونالد ترامپ، رئیس جمهور بلومبرگ/ گتی ایماژ، پیشنهاد کرد که راه های موجود برای مهار هوش مصنوعی وجود دارد. ترامپ نوشت: به همین دلیل است که ما وزارت دادگستری و سایر نهادهای مجری قانون را داریم. ترامپ بارها ترجیح داده است که هنگام تنظیم مقررات هوش مصنوعی از لمس سبک استفاده کند. دونالد ترامپ، رئیس جمهور آمریکا گفت که وزارت دادگستری این توانایی را دارد که در صورت نیاز، هوش مصنوعی را مهار کند. ترامپ روز دوشنبه در شبکه Truth Social نوشت: ما مراقب خواهیم بود و به همین دلیل است که ما وزارت دادگستری و سایر نهادهای مجری قانون را داریم که اگر مجبور باشیم همه چیز را مهار می کنند. در حالی که ترامپ به احتمال مداخله فدرال در هوش مصنوعی اشاره کرد، او بر اعتقاد دیرینه خود تاکید کرد که بهتر است یک لمس سبک داشته باشیم. \"من فقط هوش مصنوعی یا SI (هوش فوق العاده) را تشویق خواهم کرد!\" او گفت. یک حوزه نظارتی بالقوه می تواند حول مسئولیت متمرکز شود. اوایل دوشنبه، وزیر خزانه داری اسکات بسنت گفت که دولت ترامپ به آزمایشگاه های مرزی هوش مصنوعی در برابر چنین خطراتی محافظت نمی کند. بسنت طی مصاحبه ای در CNBC با عنوان Squawk Box گفت: «این آزمایشگاه ها باید مسئولیت خود را بر عهده بگیرند. آنها می توانند هر زمان که بخواهند سرعت خود را کاهش دهند. ترامپ و دولت او از نزدیک تحت نظر هستند تا ببینند چگونه به فشار مجدد داریو آمودی، مدیر عامل آنتروپیک برای تنظیم مقررات فدرال پاسخ خواهند داد. آمودی قبلاً از سم آلتمن، مدیر عامل OpenAI و ایلان ماسک، مدیر عامل اسپیس ایکس، برای این موضوع که آزمایشگاه‌های هوش مصنوعی مرزی باید توسعه خود را"}, {"source": "Business Insider", "title": "The 20 richest women in the world, ranked", "link": "https://www.businessinsider.com/richest-women-in-the-world-ranked-2026-9", "summary": "Alice Walton, Julia Koch, and Françoise Bettencourt Meyers are among the richest women in the world. Stefanie Keenan/Getty Images for The J. Paul Getty Trust; Sylvain Gaboury/Patrick McMullan via Getty Images; Bertrand Rindoff Petroff/Getty Images For Institut de l Audition Billionaires are getting richer — and it's no different for the women. The richest among them are heiresses and own stakes in some of the world's biggest companies. Here is a ranking of the 20 richest women in the world, according to Forbes. Whether they're founders or heiresses to some of the world's biggest companies, most of the world's richest women saw their wealth grow over the past year. The sources of their fortunes span a range of industries, from cosmetics to building supplies, and most of the top 20 hail from the US. This ranking and additional information were compiled from Forbes' World's Billionaires List . It shows a snapshot of wealth from March 1, 2026. Women comprised 14% of the Forbes' World's Billionaires List. Forbes estimates net worth using assets such as stakes in public and private companies, real estate, and other holdings; it also accounts for factors including debt and charitable giving . In some cases, Forbes also counts wealth held by a founder or heir's immediate family, identifying those entries with \" family.\" \"Source\" refers to the main source of the individual's wealth. \"World rank\" refers to each woman's placement on the 2026 World's Billionaires List. With a combined wealth of $886 billion, including that of some immediate family members, here are the 20 richest women in the world: 20. Diane Hendricks — $22.3 billion Diane Hendricks. PATRICK T. FALLON/AFP via Getty Images Source: Building supplies Country: US World rank: 113 Diane Hendricks, 79, cofounded ABC Supply in 1982 with her husband. After the death of Ken Hendricks in 2007, she has been the chair of ABC Supply and has led the company on its two biggest acquisitions. 19. Christy Walton — $24.3 billion Christy Walton Alberto E. Rodriguez/Getty Images Source: Walmart Country: US World rank: 106 Christy Walton, 77, inherited a stake in Walmart after her husband, John Walton, died in 2005. She also inherited about one-sixth of his estate. 18. Gina Rinehart — $25.5 billion Gina Rinehart Quinn Rooney/Getty Images Source: Mining Country: Australia World rank: 101 Gina Rinehart, 72, rebuilt her father's financially distressed company, Hancock Prospecting, following his death. Since 1992, she has been", "date_str": "2026-09-21T17:54:55+00:00", "hash": "1d6f46c858e19265", "title_fa": "20 زن ثروتمند جهان، رتبه بندی شده است", "summary_fa": "آلیس والتون، جولیا کخ و فرانسوا بتنکورت مایرز از جمله ثروتمندترین زنان جهان هستند. استفانی کینان/گتی ایماژ برای The J. Paul Getty Trust. سیلوین گابوری/پاتریک مک مولان از طریق گتی ایماژ. برتراند رینداف پتروف/گتی ایماژ برای موسسه د l Audition میلیاردرها در حال ثروتمندتر شدن هستند - و این برای زنان تفاوتی ندارد. ثروتمندترین آنها وارثان و دارای سهام در برخی از بزرگترین شرکت های جهان هستند. در اینجا فهرستی از 20 زن ثروتمند جهان بر اساس فوربس آورده شده است. اکثر ثروتمندترین زنان جهان چه بنیانگذار یا وارث برخی از بزرگترین شرکت های جهان باشند، ثروت خود را در سال گذشته افزایش داده اند. منابع ثروت آنها طیف وسیعی از صنایع، از لوازم آرایشی و بهداشتی گرفته تا تجهیزات ساختمانی را در بر می گیرد و بیشتر 20 صنعت برتر از ایالات متحده می آیند. این رتبه بندی و اطلاعات اضافی از فهرست میلیاردرهای جهان فوربس جمع آوری شده است. تصویری از ثروت از 1 مارس 2026 نشان می دهد. زنان 14 درصد از فهرست میلیاردرهای جهان فوربس را تشکیل می دهند. فوربس ارزش خالص را با استفاده از دارایی هایی مانند سهام در شرکت های دولتی و خصوصی، املاک و مستغلات و سایر دارایی ها تخمین می زند. همچنین عواملی از جمله بدهی و اعطای خیریه را در بر می گیرد. در برخی موارد، فوربس ثروتی را که توسط بنیانگذار یا خانواده نزدیک وارث نگهداری می‌شود، حساب می‌کند و آن ورودی‌ها را با «خانواده» شناسایی می‌کند. «منبع» به منبع اصلی ثروت فرد اشاره دارد. \"رتبه جهانی\" به جایگاه هر زن در فهرست میلیاردرهای جهان در سال 2026 اشاره دارد. با مجموع ثروت 886 میلیارد دلار، از جمله ثروت برخی از اعضای نزدیک خانواده، در اینجا 20 زن ثروتمند در جهان آمده است: 20. دایان هندریکس — 22.3 میلیارد دلار دایان هندریکس. PATRICK T. FALLON/AFP via Getty Images منبع:"}, {"source": "Business Insider", "title": "I was awarded $1 million in scholarships to NYU. I also sacrificed a lot of my teenage life to get there.", "link": "https://www.businessinsider.com/college-scholarships-financial-aid-first-generation-student-2026-9", "summary": "The author received more than $1 million in combined scholarship offers from over 20 colleges before attending NYU. Courtesy of Omarion Calloway I was offered more than $1 million in scholarships from over 20 colleges. I spent hours every night searching for scholarships and financial aid. I ultimately earned a full ride to NYU, but getting there was a job in itself. When I was 18, local headlines and social media posts about me all focused on the exact same number: I was accepted into more than 20 colleges and offered over $1 million in combined scholarship funding. I'm sure that to people reading the news, that seven-figure total sounded like a lottery win . What the headlines missed was the invisible labor it took to get there. People saw the final funding amount. They didn't see the unpaid late-night hours I worked every single night, completely on my own, just to afford my future. No manual, no guidance counselor, and no road map I grew up in Montgomery, Alabama, determined to become the first person in my family to graduate from college. My goal was to study film and television at New York University. Getting accepted was one hurdle, but figuring out how to pay for it was the real wall. My family did not have extra money for tuition , and my mom had never navigated higher education. When I asked for help at school, my guidance counselor had no answers for an out-of-state dream. On top of that, I was trying to figure this out during the COVID-19 pandemic, isolated at home and staring at confusing college portals, financial aid pages, and scholarship search engines I had never seen before. The author with his mother during the COVID-19 pandemic. Courtesy of Omarion Calloway Nobody explained how to navigate the Common App, the single online application platform that allows students to apply to hundreds of different colleges at once. Nobody showed me how to find legitimate scholarship databases or how to request application fee waivers, so I wouldn't go broke just applying. Having internet access gave me a starting point, but it didn't give me a map. I realized early on that if I didn't hunt down the answers myself, nobody was going to hand them to me. Working the late shift at home High school schedules are already full. My days consisted of seven hours of school followed by homework. After that came my responsibilities at home: since age 10, I had been helping care for my grandmother and my disabled uncle while my mom worked two jobs to pay our bills. ", "date_str": "2026-09-21T17:52:01+00:00", "hash": "f5bfe94eeaa64e7d", "title_fa": "من یک میلیون دلار بورسیه تحصیلی به دانشگاه نیویورک دریافت کردم. من همچنین بسیاری از زندگی نوجوانی ام را فدا کردم تا به آنجا برسم.", "summary_fa": "نویسنده قبل از حضور در دانشگاه نیویورک بیش از 1 میلیون دلار پیشنهاد بورس تحصیلی از بیش از 20 کالج دریافت کرد. با حسن نیت از Omarion Calloway بیش از 1 میلیون دلار بورسیه تحصیلی از بیش از 20 کالج به من پیشنهاد شد. هر شب ساعت‌ها به دنبال بورسیه و کمک‌های مالی می‌گشتم. من در نهایت یک سواری کامل به دانشگاه نیویورک کسب کردم، اما رسیدن به آنجا به خودی خود یک شغل بود. زمانی که 18 ساله بودم، سرفصل‌های محلی و پست‌های رسانه‌های اجتماعی درباره من، همگی بر روی همان تعداد متمرکز بودند: من در بیش از 20 کالج پذیرفته شدم و بیش از 1 میلیون دلار کمک هزینه تحصیلی ترکیبی به من پیشنهاد شد. من مطمئن هستم که برای افرادی که اخبار را می خوانند، این مجموع هفت رقمی مانند یک برد قرعه کشی به نظر می رسد. چیزی که سرفصل ها از دست داده بودند، زحمت نامرئی بود که برای رسیدن به آنجا انجام شد. مردم مبلغ نهایی بودجه را دیدند. آن‌ها ساعت‌های آخر شب بدون حقوق را که من هر شب کار می‌کردم، کاملاً به تنهایی، فقط برای تأمین مالی آینده‌ام، ندیدند. بدون راهنما، بدون مشاور راهنمایی و بدون نقشه راه من در مونتگومری، آلاباما بزرگ شدم و مصمم بودم که اولین فردی در خانواده ام باشم که از کالج فارغ التحصیل می شود. هدف من تحصیل در رشته سینما و تلویزیون در دانشگاه نیویورک بود. گرفتن پذیرش یک مانع بود، اما فهمیدن نحوه پرداخت هزینه آن دیوار واقعی بود. خانواده من پول اضافی برای شهریه نداشتند و مادرم هرگز تحصیلات عالی را گذرانده بود. وقتی در مدرسه د dios New York last week. Here's what I learned about Peloton's newest lineup of treadmills. Tread Flex ($2,195) For most people, the Flex is the main headline here. It folds down to save roughly 50% of floor space, and folded, Peloton reps told me it's shorter than a Peloton Bike. A two-step cylinder release lowers the deck gradually, and a safety locking pin keeps it secure when upright. Caster wheels make it easy to reposition, and the swivel screen lets you move from the belt to floor workouts like strength, yoga, and stretching. It's also quiet: Peloton says it runs at 70 dB at 12.5 mph, its top speed, with no one on the belt. It's best suited to walkers, hikers, and low-impact cardio fans. Tread Vision ($3,495) This is a top-to-bottom upgrade of Peloton's tread, with improvements at nearly every touchpoint: A 23.8\" swivel screen with Sonos-tuned speakers and an integrated cooling fan A movement-tracking camera that powers Run Analysis and connected strength workouts New deck cushioning with internal dampeners to reduce joint impact A redesigned tray for your phone, tablet, and water bottle New Jump Buttons that take you to the next or previous whole-number speed or incline in a single tap Peloton pitches it at mixed households with varied goals: walkers, joggers, runners, and strength trainers. Tread+ Vision ($6,695) The Tread+ Vision is Peloton's premium performance treadmill, built for high-mileage training and elite athletes. Its rubberized slat-belt deck rides on a ball-bearing system designed to return energy to your stride. It includes everything on the Tread Vision, including the movement-tracking camera for Run Analysis and connected strength workouts, plus the Jump Bu", "date_str": "2026-09-22T12:00:00+00:00", "hash": "01fb3313f978e89d", "title_fa": "پلوتن اولین تردمیل تاشو و مقرون به صرفه خود را تا به امروز عرضه کرد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. پلوتن به تازگی سه تردمیل جدید راه اندازی کرده است: Tread Flex، اولین تردمیل تاشو، به علاوه Tread Vision و Tread+ Vision. آنها با هم طیف گسترده‌ای را شامل می‌شوند، از یک دستگاه 2195 دلاری صرفه‌جویی در فضا برای واکرها تا یک نیروگاه کمربند 6695 دلاری که برای ورزشکاران نخبه و رقبای Hyrox ساخته شده است. مانند تقریباً هر بازار دیگری در حال حاضر، تمرکز زیادی روی هوشمندی و شخصی سازی وجود دارد. Peloton ادعا می کند که سخت افزار جدید \"هوشمندتر\" است و دارای ویژگی هایی مانند دوربین ردیابی حرکت است که می تواند فرم دویدن شما را تجزیه و تحلیل کند. این نرم‌افزار فراتر می‌رود، با ویژگی‌هایی که با نحوه تمرین شما سازگار است، و آنچه واقعاً هیجان‌انگیز است این است که بسیاری از آنها به آج‌های موجود Peloton نیز می‌آیند. هفته گذشته در استودیوی Peloton نیویورک نگاهی دزدکی به ترکیب بازی کردم. در اینجا چیزی است که در مورد جدیدترین ترکیب تردمیل های Peloton یاد گرفتم. Tread Flex (2,195 دلار) برای اکثر مردم، Flex عنوان اصلی در اینجا است. تا می شود تا تقریباً 50 درصد از فضای زمین صرفه جویی شود، و تا شده، نمایندگان Peloton به من گفتند که از دوچرخه Peloton کوتاه تر است. رها کردن سیلندر دو مرحله ای عرشه را به تدریج پایین می آورد و یک پین قفل ایمنی آن را در حالت ایستاده ایمن نگه می دارد. چرخ‌های چرخ‌دار، جابه‌جایی آن را آسان می‌کنند، و صفحه چرخان به شما امکان می‌دهد از کمربند به تمرینات روی زمین مانند قدرت، یوگا و کشش حرکت کنید. همچنین ساکت است: پلوتن می گوید با سرعت 70 دسی بل در 12.5 مایل در ساعت کار می کند، حداکثر سرعت آن بدون هیچ کس روی کمربند. این برای پیاده‌روی‌ها، کوهنوردان و هواداران کم‌تصادف کاردیو"}, {"source": "Lifehacker", "title": "Even a VPN Can't Protect You From This Browser Security Flaw", "link": "https://lifehacker.com/tech/even-a-vpn-cant-protect-your-from-this-browser-security-flaw?utm_medium=RSS", "summary": "A VPN conceals your IP address by routing your internet traffic through a remote server, preventing anyone surveilling the network from tracking your online activity. Theoretically, that means no one should be able to identify you when you connect to a network and browse the internet, even your ISP. In practice, though, there are plenty of gaps that hackers can exploit. A while back, Lifehacker covered browser fingerprinting , which uses hundreds of data points, like your hardware specs, operating system version, web browser, and GPU signature, to establish a shadow profile that follows you around even when your VPN is enabled. There's another way cyberattackers can intercept your data, and it involves exploiting a communication leak right inside your browser. Major browsers like Chrome, Firefox, and Edge have a feature called WebRTC that lets them bypass the encrypted Transmission Control Protocol (TCP) tunnel created by your VPN to establish high-speed connections for demanding tasks like video streaming, voice calls, and screen sharing. This leaves your real IP address exposed throughout the transmission, offering plenty of time for attackers to capture the identifying information you are trying to hide. Luckily, VPN providers are getting better at preventing WebRTC leaks through additional security features, but these protections often need to be configured manually in your VPN settings or, if your VPN does not offer WebRTC leak prevention, directly in your web browser. I ll show you how to set it up step by step, so you don t get blindsided by an unintended IP address leak. How WebRTC leaks bypass your VPN VPN providers are getting better at addressing WebRTC leaks Credit: Surfshark WebRTC is short for Web Real-Time Communication, a technology that lets your browser find the shortest route to connect to another device for high-bandwidth data transfer. It establishes a direct peer-to-peer connection with another device using your public IP address, improving your data transfer speeds during video and voice calls, live streaming, and screen shares. Everybody on the internet has probably been exposed to WebRTC connections at one point or another for example, when you make a video call through Google Meet. Because the technology requires your public IP address to establish a faster connection, it bypasses your VPN s default TCP encryption tunnel using a separate communication protocol called User Datagram Protocol (UDP), which foregoes safety for speed. W", "date_str": "2026-09-21T21:30:00+00:00", "hash": "fd1eb1591b2a20af", "title_fa": "حتی یک VPN نمی تواند شما را از این نقص امنیتی مرورگر محافظت کند", "summary_fa": "VPN آدرس IP شما را با مسیریابی ترافیک اینترنت شما از طریق یک سرور راه دور پنهان می کند و از ردیابی فعالیت آنلاین شما توسط هر کسی که بر شبکه نظارت می کند جلوگیری می کند. از نظر تئوری، این بدان معناست که وقتی به شبکه وصل می‌شوید و اینترنت را مرور می‌کنید، هیچ‌کس نباید بتواند شما را شناسایی کند، حتی ISP شما. اگرچه در عمل، شکاف های زیادی وجود دارد که هکرها می توانند از آنها سوء استفاده کنند. مدتی قبل، Lifehacker اثر انگشت مرورگر را پوشش داد، که از صدها نقطه داده مانند مشخصات سخت افزاری، نسخه سیستم عامل، مرورگر وب و امضای GPU استفاده می کند تا یک نمایه سایه ایجاد کند که حتی زمانی که VPN شما فعال است، شما را دنبال می کند. راه دیگری نیز وجود دارد که مهاجمان سایبری می توانند داده های شما را رهگیری کنند، و این شامل سوء استفاده از نشت ارتباطی درست در داخل مرورگر شما است. مرورگرهای بزرگی مانند کروم، فایرفاکس و اج دارای قابلیتی به نام WebRTC هستند که به آنها اجازه می دهد تا تونل رمزگذاری شده پروتکل کنترل انتقال (TCP) ایجاد شده توسط VPN شما را دور بزنند تا اتصالات پرسرعتی را برای کارهای سخت مانند پخش ویدئو، تماس های صوتی و اشتراک صفحه ایجاد کنند. این باعث می‌شود آدرس IP واقعی شما در طول انتقال نمایش داده شود، و زمان زیادی برای مهاجمان فراهم می‌کند تا اطلاعات شناسایی‌ای را که می‌خواهید پنهان کنید، ضبط کنند. خوشبختانه، ارائه‌دهندگان VPN در جلوگیری از نشت WebRTC از طریق ویژگی‌های امنیتی اضافی بهتر می‌شوند، اما این حفاظت‌ها اغلب باید به صورت دستی در تنظیمات VPN شما پیکربندی شوند یا، اگر VPN شما پیشگیری از نشت WebRTC را ارائه نمی‌دهد، مستقیماً در مرورگر وب شما پیکربندی شوند. من به شما نشان خواهم داد که چگونه آن را گام"}, {"source": "Lifehacker", "title": "10 Hacks Every Proton VPN User Should Know", "link": "https://lifehacker.com/tech/10-hacks-every-proton-vpn-user-should-know?utm_medium=RSS", "summary": "A VPN or Virtual Private Network is a useful tool for protecting your data when browsing the internet, and Proton has one of the best VPNs on the market. Whether you're using Proton VPN to maintain your privacy or access geo-restricted content, these are the tricks you need to know. Use split tunneling to include only the most sensitive apps in your VPN Split tunneling allows you to route some of your internet traffic through the VPN while excluding other low-risk connections. The trade-off is a little less privacy for better speeds. With the Proton VPN app, split tunneling operates at the device level, so you can choose to include or exclude apps and IP addresses from the VPN tunnel. For example, you could opt for Exclude mode to exempt a specific browser that you use for online gaming, which would preserve speeds and protect all other traffic from your device. Or you could go with Include mode and add a browser you use only for sensitive connections, such as banking, and leave all other connections out of the tunnel. Install Proton VPN's browser extension for domain-level split tunneling Proton VPN has a browser extension for Chrome and Firefox , and all you need to use it is a free Proton account. Unlike the VPN app, which applies to all traffic on your device, the extension only protects traffic inside your browser. If you enable split tunneling in your browser, the VPN protects all websites by default except domains (and subdomains) you specifically add for exclusion. Alternatively, you can select Include mode , which will use the VPN on those websites only. This domain-level option means that you can reserve the VPN for sensitive sites and leave others out when you don't want any added latency. Create one-click profiles to bypass specific streaming limits Proton allows you to set up and save connection profiles with settings you use often so you don't have to manually select your location, protocol, and customized settings each time you want to use the VPN for a specific purpose (such as accessing restricted streaming content). Once you have a profile in place, you can simply go to the Profiles tab and select the one you want to use to connect. Recently used profiles will appear under Recents on the Home tab. Combine preset profiles with incognito browsing to beat dynamic pricing Another potential use for VPN profiles: getting around geo-targeted fare hikes on flights and hotels. Travel can be priced differently depending on where the purchase origin", "date_str": "2026-09-21T20:30:00+00:00", "hash": "8eb1a188122c5bbf", "title_fa": "10 هک که هر کاربر Proton VPN باید بداند", "summary_fa": "VPN یا Virtual Private Network ابزاری مفید برای محافظت از داده های شما هنگام مرور اینترنت است و Proton یکی از بهترین VPN های موجود در بازار را دارد. چه از Proton VPN برای حفظ حریم خصوصی خود استفاده کنید و چه برای دسترسی به محتوای محدود جغرافیایی، اینها ترفندهایی هستند که باید بدانید. از تونل تقسیم استفاده کنید تا فقط حساس ترین برنامه ها را در VPN خود بگنجانید. مبادله حریم خصوصی کمی کمتر برای سرعت بهتر است. با برنامه Proton VPN، تقسیم تونل در سطح دستگاه عمل می کند، بنابراین می توانید انتخاب کنید که برنامه ها و آدرس های IP را از تونل VPN اضافه یا حذف کنید. برای مثال، می‌توانید حالت Exclude را انتخاب کنید تا مرورگر خاصی را که برای بازی‌های آنلاین استفاده می‌کنید معاف کنید، که سرعت را حفظ می‌کند و از سایر ترافیک‌ها از دستگاه شما محافظت می‌کند. یا می توانید با حالت Include بروید و مرورگری را که فقط برای اتصالات حساس مانند بانکداری استفاده می کنید اضافه کنید و همه اتصالات دیگر را خارج از تونل بگذارید. افزونه مرورگر Proton VPN را برای تونل زنی تقسیم در سطح دامنه نصب کنید Proton VPN یک پسوند مرورگر برای Chrome و Firefox دارد و تنها چیزی که برای استفاده از آن نیاز دارید یک حساب رایگان Proton است. بر خلاف برنامه VPN، که برای تمام ترافیک دستگاه شما اعمال می شود، برنامه افزودنی فقط از ترافیک داخل مرورگر شما محافظت می کند. اگر تونل تقسیم را در مرورگر خود فعال کنید، VPN به طور پیش‌فرض از همه وب‌سایت‌ها به جز دامنه‌ها (و زیر دامنه‌هایی) که به‌طور خاص برای حذف اضافه می‌کنید محافظت می‌کند. همچنین، می‌توانید حالت Include را انتخاب کنید، که از VPN فقط در آن وب‌سایت‌ها استفاده می‌کند. این گزینه در سطح دامنه به این معنی است که می‌توانید VPN را برای"}, {"source": "Lifehacker", "title": "Meta May Try to Repair Its Poor Privacy Reputation at 'Connect 2026'", "link": "https://lifehacker.com/tech/meta-connect-2026-what-to-expect?utm_medium=RSS", "summary": "Meta Connect 2026 is right around the corner. Like other annual tech events, such as Made by Google or Apple's fall event , Connect is Meta's chance to showcase the hardware and AI tools it plans to launch over the next year. The company may have started as a single social media platform, but it now dominates or competes in multiple tech fields, including virtual reality headsets, LLMs, and, as of late, personal AI agents, thanks to the introduction of Muse AI . Here's what I'm expecting to see at Meta Connect 2026. Could Meta's new smart glasses be more privacy-friendly? While the company will undoubtedly announce new AI developments this week, Meta Connect 2026 will likely also make headlines for its hardware division. Meta is well known (perhaps infamous) for its smart glasses , so it only makes sense that the company would make relevant announcements during a major tech event. But the most newsworthy moment of all might not be an \"advancement,\" so much as a refinement. As PCMag reports , Meta is planning to announce camera-free smart glasses at Connect 2026. These glasses, codenamed \"Luna,\" would rely on an array of six microphones rather than cameras to power AI features. That way, you could still ask Meta AI questions or give commands to Muse AI, without the need for cameras to tap into the world around you. Meta's most popular smart glasses currently come with embedded cameras, so why the change? It's probably not to offer users a \"budget\" smart glasses option. Instead, it's more likely that Meta is responding to growing backlash over its current camera-enabled smart glasses . It turns out that, as popular as these glasses are, a lot of people don't like the idea of being stealthily recorded anywhere they go. The problem was made worse by an underground industry of hackers aiming to disable the recording light on Meta smart glasses, making it even harder to know whether someone was sneakily filming you. To its credit, Meta has already responded to these \"critiques.\" The company reportedly patched the exploit hackers were taking advantage of, so users shouldn't be able to bypass the recording light any longer: If the LED is blocked, Meta smart glasses are now supposed to disable video recording. Introducing camera-free smart glasses may be another step in that direction, but that won't change the fact that camera-embedded smart glasses are still readily accessible and easy to miss in passing. While there are steps individuals can take to protect thei", "date_str": "2026-09-21T20:00:00+00:00", "hash": "d2439257853e22fc", "title_fa": "متا ممکن است سعی کند اعتبار ضعیف حریم خصوصی خود را در 'Connect 2026' ترمیم کند", "summary_fa": "Meta Connect 2026 درست در گوشه و کنار است. مانند سایر رویدادهای فناوری سالانه، مانند Made by Google یا رویداد پاییزی اپل، Connect فرصتی برای متا است تا سخت افزار و ابزارهای هوش مصنوعی را که قصد دارد در سال آینده راه اندازی کند، به نمایش بگذارد. این شرکت ممکن است به عنوان یک پلتفرم رسانه اجتماعی کار خود را آغاز کرده باشد، اما اکنون به لطف معرفی Muse AI، در زمینه‌های فناوری متعدد، از جمله هدست‌های واقعیت مجازی، LLM، و تا به امروز، عوامل هوش مصنوعی شخصی تسلط دارد یا رقابت می‌کند. این چیزی است که من انتظار دارم در Meta Connect 2026 ببینم. در حالی که این شرکت بدون شک پیشرفت‌های جدید هوش مصنوعی را در این هفته اعلام می‌کند، Meta Connect 2026 نیز احتمالاً سرفصل بخش سخت‌افزار آن خواهد بود. متا به خاطر عینک های هوشمندش به خوبی شناخته شده است (شاید بدنام است)، بنابراین منطقی است که این شرکت اعلامیه های مربوطه را در طول یک رویداد بزرگ فناوری اعلام کند. اما خبرسازترین لحظه ممکن است یک «پیشرفت» نباشد، بلکه یک اصلاح باشد. همانطور که PCMag گزارش می دهد، متا در حال برنامه ریزی برای معرفی عینک های هوشمند بدون دوربین در Connect 2026 است. این عینک با نام رمز \"Luna\" به جای دوربین برای تقویت ویژگی های هوش مصنوعی به مجموعه ای از شش میکروفون متکی است. به این ترتیب، همچنان می‌توانید سؤالات هوش مصنوعی متا را بپرسید یا به Muse AI دستور دهید، بدون اینکه نیازی به دوربین‌ها برای ضربه زدن به دنیای اطراف شما باشد. محبوب ترین عینک های هوشمند متا در حال حاضر با دوربین های تعبیه شده عرضه می شوند، پس چرا این تغییر؟ احتمالاً قرار نیست به کاربران گزینه عینک هوشمند «بودجه» ارائه شود. در عوض، به احتمال زیاد متا به واکنش فزاینده نسبت به عینک هوشمند مجهز به دوربین"}, {"source": "Lifehacker", "title": "Five Hacks Every Garmin Fenix 9 Pro User Should Know", "link": "https://lifehacker.com/health/garmin-fenix-9-pro-hacks?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Garmin s new Fenix 9 Pro is a damn good watch . Mapping is fast and clear, the titanium case feels durable yet lightweight, and the built-in flashlight is a must-have although this all comes at a steep price of $1,099.99 . Whether you were first in line to order this latest Fenix, or you re still considering if it s right for you, here are five tips to get even more out of one of the best adventure watches money can buy. Garmin Fenix 9 Pro Solar 47mm Titanium GPS Smartwatch Pebble Gray Band $1,121.99 at Amazon Shop Now Shop Now $1,121.99 at Amazon Display your live stats over your map The Fenix 9 Pro is Garmin s most advanced mapping watch yet, so it s fitting that there s a lot of ground to cover here. One of my favorite small-but-mighty upgrades has been to add my route map as a dedicated data screen, and then overlay live stats, such as pace, heart rate, and distance, along the top. The payoff is that you can see where you are on the route and how hard you're working in one glance, with no flipping between screens mid-climb or mid-intersection. First, make sure you have your map as its own dedicated data screen. Press the START/STOP button (top right) from the watch face and select your preferred GPS activity (e.g., Run or Trail Run). Scroll down and select Activity Settings . Select Data Screens . Scroll all the way down and select Add New . Select Map . Next, here s how to overlay your live stats. While still in the Data Screens menu, scroll to your newly added Map screen and select it (press START/STOP). Select Layout to change how many data fields overlay on the map. Scroll or use the UP and DOWN buttons to cycle through options (typically allowing one to two data fields overlaid at the top or bottom). Select your preferred layout. Select Edit Data Fields . Click on a specific flashing field, browse through the data categories (e.g., Pace , Heart Rate Fields , or Distance ), and assign your desired metric to that slot. Experimenting with different display options. Credit: Meredith Dietz While messing around with maps, here are few more tricks worth mentioning: Use \"Record Only\" mode as a breadcrumb trail. On an unfamiliar route, the watch quietly lays down your path without following a preloaded course. If you get turned around, you can use that trail to retrace your steps back to the start. Try a round-trip course. Tell the watch how far you want to go, and it generates a loop that starts and ends w", "date_str": "2026-09-21T19:00:00+00:00", "hash": "5f8063081faf5b93", "title_fa": "پنج هک که هر کاربر Garmin Fenix ​​9 Pro باید بداند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. Fenix ​​9 Pro جدید گارمین یک ساعت لعنتی خوب است. نقشه برداری سریع و واضح است، بدنه تیتانیومی بادوام و در عین حال سبک وزن به نظر می رسد، و چراغ قوه داخلی یکی از ضروریات است، اگرچه همه اینها با قیمت گزاف 1099.99 دلار عرضه می شوند. چه برای اولین بار در صف سفارش این جدیدترین Fenix ​​باشید، چه هنوز به این فکر می‌کنید که برای شما مناسب است، در اینجا پنج نکته وجود دارد که می‌توانید از یکی از بهترین ساعت‌های ماجراجویی که می‌توانید با پول خریداری کنید، بیشتر بهره ببرید. ساعت هوشمند گارمین Fenix ​​9 Pro Solar 47mm Titanium GPS Pebble Grey Band 1121.99 دلار در آمازون همین حالا خرید کنید 1121.99 دلار در آمازون آمار زنده خود را بر روی نقشه خود نمایش دهید Fenix ​​9 Pro پیشرفته ترین ساعت نقشه برداری گارمین است که تاکنون وجود دارد، بنابراین مناسب است که زمین های زیادی را پوشش دهد. یکی از ارتقاهای کوچک اما قدرتمند مورد علاقه من این است که نقشه مسیر خود را به عنوان یک صفحه داده اختصاصی اضافه کنم و سپس آمارهای زنده مانند سرعت، ضربان قلب و مسافت را در بالای صفحه قرار دهم. نتیجه این است که می‌توانید با یک نگاه متوجه شوید که در مسیر کجا هستید و چقدر سخت کار می‌کنید، بدون اینکه بین صفحه‌ها وسط صعود یا وسط تقاطع حرکت کنید. ابتدا، مطمئن شوید که نقشه خود را به عنوان صفحه داده اختصاصی خود دارید. دکمه START/STOP (بالا سمت راست) را از صفحه ساعت فشار دهید و فعالیت GPS مورد نظر خود را انتخاب کنید (مانند Run یا Trail Run). به پایین بروید و تنظیمات فعالیت را انتخاب کنید. Data Screens را انتخاب کنید. تا آخر اسکرول کنید و افزودن جدید را انتخاب کنید. نقشه را انتخاب"}, {"source": "Lifehacker", "title": "Why Your 'HIIT' Workouts Are Full of Empty Promises", "link": "https://lifehacker.com/why-your-hiit-workouts-are-full-of-empty-promises?utm_medium=RSS", "summary": "High-intensity interval training, or HIIT, made headlines in the 2010s with one specific claim: that short bursts of hard work can give the same aerobic benefits as longer sessions of jogging or cycling. But the HIIT videos you can stream today have very little to do with the original model, and many of them aren t worth your time. Before we break down the difference, I want to make something clear: If you love doing videos labeled HIIT, and they re part of an exercise routine that makes you genuinely happy, keep on doing them . I m not trying to take away a thing that you love. But if you re doing them because you feel they re the best way to achieve your goals, or because a trainer or influencer tells you that they ll burn a ton of calories or build your booty, we need to sit down for a little intervention. What is \"real\" HIIT? High-intensity interval training was born as a buzzword after exercise scientists noticed that people got better at the Wingate test every time they took it. The Wingate protocol calls for people to pedal a stationary bike all-out, at a high resistance, for a pukeworthy 30 seconds. Then you get to rest for four minutes, and do it again. After further experiments, researchers figured out that the benefits they saw, including increased aerobic fitness, could be triggered by other rest/work combinations. The Tabata protocol, again done on a research-grade exercise bike ( cycle ergometer, they call it) is 20 seconds of work and 10 seconds of rest, repeated \"seven to eight times\" to achieve exhaustion in the original study or about four minutes in total. These are not workouts that people do for fun. Everyone I ve seen recount the experience has said that it was complete agony . The scientists often note that people can rarely push themselves hard enough to replicate these protocols on their own. Workout classes and videos don't push you that hard, either. Peloton offers \"Tabata\" classes that ask you to do those four-minute blocks several times in the same workout, meaning you definitely didn't push yourself to exhaustion on the first one. To create a more accessible version of HIIT, Martin Gibala, one of the researchers who popularized the concept of HIIT, worked to find a version of the protocol that normal humans could do on their own, and that wouldn t leave them so pooped they were scared to come back. His conclusion: one minute work/one minute rest was the sweet spot , and you could do it while cycling, jogging, or doing other ae", "date_str": "2026-09-21T18:30:00+00:00", "hash": "f921b5490604a8f3", "title_fa": "چرا تمرینات \"HIIT\" شما مملو از وعده های خالی است؟", "summary_fa": "تمرینات تناوبی با شدت بالا یا HIIT با یک ادعای خاص در دهه 2010 به تیتر خبرها تبدیل شد: این که دوره‌های کوتاه کار سخت می‌تواند فواید هوازی را با جلسات طولانی‌تر دویدن یا دوچرخه‌سواری داشته باشد. اما ویدیوهای HIIT که امروز می‌توانید پخش کنید ارتباط بسیار کمی با مدل اصلی دارند و بسیاری از آنها ارزش وقت شما را ندارند. قبل از اینکه تفاوت را بشکنیم، می‌خواهم چیزی را روشن کنم: اگر دوست دارید ویدیوهایی با برچسب HIIT انجام دهید، و آنها بخشی از یک برنامه تمرینی هستند که واقعاً شما را خوشحال می‌کند، به انجام آن‌ها ادامه دهید. من سعی نمی کنم چیزی را که شما دوست دارید از بین ببرم. اما اگر آنها را به این دلیل انجام می‌دهید که فکر می‌کنید بهترین راه برای رسیدن به اهداف شما هستند، یا به این دلیل که یک مربی یا تأثیرگذار به شما می‌گوید که کالری زیادی می‌سوزانند یا غنیمت شما را می‌سازند، باید برای مداخله کوچک بنشینیم. HIIT \"واقعی\" چیست؟ تمرینات تناوبی با شدت بالا پس از آن که دانشمندان ورزش متوجه شدند که افراد در آزمون وینگیت هر بار که آن را انجام می‌دهند بهتر می‌شوند، به عنوان یک کلمه کلیدی متولد شد. پروتکل Wingate از مردم می‌خواهد که یک دوچرخه ثابت را با مقاومت بالا به مدت 30 ثانیه پدال بزنند. سپس باید چهار دقیقه استراحت کنید و دوباره این کار را انجام دهید. پس از آزمایش‌های بیشتر، محققان دریافتند که مزایایی که مشاهده کردند، از جمله افزایش تناسب اندام هوازی، می‌تواند توسط سایر ترکیب‌های استراحت و کار ایجاد شود. پروتکل تاباتا، که مجدداً روی دوچرخه‌های ورزشی با درجه تحقیقاتی انجام می‌شود (کارسنج چرخه‌ای که آن را می‌گویند) ۲۰ ثانیه کار و ۱۰ ثانیه استراحت است که «هفت تا هشت بار» برای رسیدن به خستگی در مطالعه اصلی یا در مجموع حدود چهار دقیقه تکرار می‌شود."}, {"source": "Lifehacker", "title": "Do This If You Want Another Year of Windows 10 Security Updates", "link": "https://lifehacker.com/tech/windows-10-security-updates-extended-to-2027?utm_medium=RSS", "summary": "If you are still holding on to Windows 10, there's good news: Microsoft is offering another year of security updates , pushing the Windows 11 upgrade deadline back to Oct. 12, 2027. Microsoft officially ended support for the older OS last year but allowed users to join the Extended Security Updates (ESU) program in order to maintain protection against viruses and hackers. ESU coverage was supposed to expire on Oct. 13, 2026, but the company is allowing enrolled Windows 10 users to receive monthly patches for another year and it's not too late to sign up if you haven't already. You can stay on Windows 10 through Oct. 2027 If you're already in Microsoft's ESU program, your coverage will automatically continue through Oct. 12, 2027 without any additional action on your part. If you haven't, though, you can enroll in ESU at any time until the program ends next year. To be eligible, your device must be running Windows 10 version 22H2 Home, Professional, Pro Education, or Workstations editions and have the latest Windows update installed. You must also be signed into a Microsoft account with administrator status. Windows users were originally able to purchase ESU coverage for $30, and Microsoft later added the option to either redeem 1,000 Microsoft Rewards points or opt into Windows Backup to get protection for free. To check your coverage or sign up, go to Settings Update Security Windows Update and look for an ESU enrollment link (visible if your device is eligible). Follow the prompts to sign into your Microsoft account and choose your enrollment option. If you've already purchased an ESU license, you can apply it to up to 10 devices running Windows 10 as long as they are linked to your Microsoft account. The ESU program does not include any new features or non-security updates, but if you want to stay on Windows 10, it's highly recommended that you enroll in the program. Microsoft has started pushing hundreds of critical security fixes each month a handful of which have been actively exploited zero-days so you should ensure your device stays protected for as long as possible.", "date_str": "2026-09-21T17:30:00+00:00", "hash": "98b693049b978ef4", "title_fa": "اگر می خواهید یک سال دیگر از به روزرسانی های امنیتی ویندوز 10 استفاده کنید، این کار را انجام دهید", "summary_fa": "اگر هنوز ویندوز 10 را حفظ کرده‌اید، یک خبر خوب وجود دارد: مایکروسافت یک سال دیگر به‌روزرسانی‌های امنیتی ارائه می‌کند و مهلت به‌روزرسانی ویندوز 11 را تا 12 اکتبر 2027 به عقب می‌اندازد. مایکروسافت سال گذشته به طور رسمی پشتیبانی از سیستم‌عامل قدیمی‌تر را پایان داد، اما به کاربران اجازه داد به برنامه به‌روزرسانی‌های امنیتی توسعه‌یافته (ESU) در برابر ویروس‌ها و محافظت از هکرها بپیوندند. قرار بود پوشش ESU در اکتبر به پایان برسد. 13، 2026، اما این شرکت به کاربران ثبت نام شده ویندوز 10 اجازه می دهد تا یک سال دیگر وصله های ماهانه دریافت کنند و اگر قبلاً ثبت نام نکرده اید، برای ثبت نام دیر نیست. می توانید تا اکتبر 2027 در ویندوز 10 بمانید اگر قبلاً در برنامه ESU مایکروسافت هستید، پوشش شما به طور خودکار تا 12 اکتبر 2027 بدون هیچ اقدام اضافی از سوی شما ادامه خواهد یافت. با این حال، اگر این کار را نکرده‌اید، می‌توانید در هر زمانی تا پایان برنامه در سال آینده در ESU ثبت نام کنید. برای واجد شرایط بودن، دستگاه شما باید نسخه‌های Windows 10 نسخه 22H2 Home، Professional، Pro Education یا Workstations را اجرا کند و آخرین به‌روزرسانی ویندوز را نصب کرده باشد. همچنین باید به یک حساب مایکروسافت با وضعیت سرپرست وارد شوید. کاربران ویندوز در ابتدا می‌توانستند پوشش ESU را به قیمت 30 دلار خریداری کنند، و مایکروسافت بعداً این گزینه را اضافه کرد که یا 1000 امتیاز Microsoft Rewards را پس‌خرید کند یا برای دریافت محافظت رایگان از Windows Backup استفاده کند. برای بررسی پوشش خود یا ثبت نام، به تنظیمات به‌روزرسانی امنیتی Windows Update بروید و به دنبال پیوند ثبت نام ESU بگردید (در صورتی که دستگاه شما واجد شرایط باشد قابل مشاهده است). دستورات را دنبال کنید تا وارد حساب مایکروسافت خود شوید و گزینه ثبت نام خود را انتخاب کنید."}, {"source": "Lifehacker", "title": "This 2020 MacBook Air Is on Sale for Just $280 Right Now", "link": "https://lifehacker.com/tech/macbook-air-stacksocial-sale-september-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Buying a six-year-old refurbished MacBook in 2026 obviously isn't the right choice for some, but for this sale price of $279.99 at StackSocial , it can make sense for a student, casual home user, or anyone who needs an inexpensive secondary Mac for browsing, documents, email, streaming, and video calls. This is the Intel version rather than the better-known M1 model from later in 2020, so expectations should remain reasonable. It uses a 10th-generation Intel Core i3 processor with 8GB of RAM and Intel Iris Plus graphics, which is fine for writing in Google Docs, keeping a handful of browser tabs open, joining video calls, or watching Netflix, but it's not something I would buy for video editing, modern games, or heavier creative work. Still, the hardware has the sharp 13.3-inch Retina display, the Magic Keyboard is comfortable to type on, and Touch ID makes logging in and approving purchases easier. You also get two Thunderbolt 3 ports, USB-C charging, and a 720p webcam. Apple originally rated this model for up to 11 hours of wireless web use, although a refurbished battery that is six years old may not come close to that figure. StackSocial lists this particular machine as Grade B, so light to moderate scuffs are possible, and the included warranty lasts 30 days. The bigger concern is how long it will stay useful. This MacBook Air can run macOS Sequoia, but it doesn't support macOS Tahoe 26, so it's already missing out on Apple s latest major operating system update. That doesn't make it unusable, but it does limit how much life you should expect from it going forward. At $279.99 , I would consider it a short-term option for a student, someone who needs a secondary laptop, or a casual user who mostly browses the web, streams video, and works with documents. It makes much less sense for anyone who wants a MacBook to keep for several more years, especially when newer Apple silicon models offer better performance and longer software support. Our Best Editor-Vetted Tech Deals Right Now Apple AirPods Pro 3 Noise Cancelling ر"}, {"source": "Lifehacker", "title": "The Best Gift Subscriptions for Every Type of Person", "link": "https://lifehacker.com/entertainment/best-subscriptions-for-every-kind-of-person?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The right subscription service for the right person is the ultimate \"I see you\" present, the kind of gift they'll appreciate every time they log into the news service you gave them, or every time the box with a tasty meal or cool gadget arrives on their porch. Below are the best gift subscriptions for every type of person, from the snobby cinephile to the terminally online. The best overall gift subscription: Custom monthly boxes from Bespoke Post Bespoke Post is my pick for the best overall because it solves that perpetual holiday problem of what to get the person who's impossible to shop for. Most gift box services are aimed at specific niches, but Bespoke Post casts a wider net by letting users choose exactly what comes in their box every month. One month they can get high-end coffee supplies. The next, outdoor gear. If nothing catches their eye, they can just skip a month. If you want to give someone a present they will truly never tire of, a subscription to Bespoke Post is for you. The best gift subscription for a doomscroller: A digital subscription to The New York Times If you're looking for a gift for someone who is constantly doomscrolling, get them a subscription to the New York Times . Its old-school, objective reporting is the antidote to social media alarmism, and it also has good recipes and the best puzzles. An all-access subscription opens up the full New York Times archive going back to 1851, NYT Cooking, daily crosswords, and the 10,000-puzzle archive (including Wordle, Connections, Spelling Bee, and all of your other favorite time-wasters). The best gift subscription for the lifetime learner: Lessons with the greats from MasterClass If that person on your list is always trying to exercise their brain, a subscription to MasterClass is a lot cheaper than grad school. This educational streaming service covers a wide range of subjects, from science to acting to business, and includes extensive lectures from heavyweights in each field. They can take a deep dive into filmmaking with Martin Scorsese, take music lessons from Timbaland, or learn cooking from Gordon Ramsay. A subscription unlocks the entire library, so they can learn as much or as little as they choose. The best gift subscription for a bookworm: Audiobooks from Libro.fm Libro.fm lets users listen to audiobooks while supporting their local independent bookstore, instead of supporting a huge corporation that shall go unnamed. Libro's", "date_str": "2026-09-21T15:00:00+00:00", "hash": "d486767df36708de", "title_fa": "بهترین اشتراک های هدیه برای هر نوع شخصی", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. سرویس اشتراک مناسب برای شخص مناسب، هدیه نهایی \"من تو را می بینم\" است، از نوع هدیه ای است که هر بار که وارد سرویس خبری که به آنها دادی، یا هر بار که جعبه ای با یک غذای خوشمزه یا وسیله ای خنک به ایوانشان می رسد، قدردانش خواهند بود. در زیر بهترین اشتراک‌های هدیه برای هر نوع شخصی، از سینماگرهای اسنوب گرفته تا افراد آنلاین پایانه، آورده شده است. بهترین اشتراک کلی هدیه: جعبه‌های ماهانه سفارشی از پست سفارشی پست انتخاب من برای بهترین اشتراک است زیرا این مشکل دائمی تعطیلات را حل می‌کند که کسی را که خرید برایش غیرممکن است به دست آورد. بیشتر سرویس‌های جعبه هدیه در سمت‌های خاص قرار می‌گیرند، اما Bespoke Post شبکه گسترده‌تری ایجاد می‌کند و به کاربران اجازه می‌دهد دقیقاً آنچه را که هر ماه در جعبه آنها ارائه می‌شود انتخاب کنند. یک ماه آنها می توانند منابع قهوه با کیفیت بالا را تهیه کنند. بعدی، تجهیزات در فضای باز. اگر چیزی توجه آنها را جلب نکرد، آنها فقط می توانند یک ماه را رد کنند. اگر می خواهید به کسی هدیه ای بدهید که واقعاً از آن خسته نمی شود، اشتراک پست سفارشی برای شما مناسب است. بهترین اشتراک هدیه برای Doomscroller: اشتراک دیجیتالی در نیویورک تایمز اگر به دنبال هدیه ای برای کسی هستید که دائماً در حال پیمایش است، برای او اشتراک نیویورک تایمز بگیرید. گزارش‌های قدیمی و عینی آن پادزهر هشداردهنده رسانه‌های اجتماعی است و همچنین دستور العمل‌های خوب و بهترین پازل‌ها را دارد. یک اشتراک بدون دسترسی، آرشیو کامل نیویورک تایمز را باز می کند که به سال 1851 باز می گردد، آشپزی نیویورک، جدول کلمات متقاطع روزانه، و آرشیو 10000 پازلی (شامل Wordle، Connections، Spelling Bee، و سایر موارد مورد علاقه شما که زمان"}],
