ال ۱۹۷۹ (سال وقوع انقلاب ۵۷) علیه آمریکا در حال جنگ بوده و این ایالات متحده نبوده که جنگ با تهران را آغاز کرده است. این اظهارات در حالی مطرح می‌شود که رئیس‌جمهور آمریکا طی روزهای اخیر گفته بود ترجیح می‌دهد به جای ازسرگیری حملات گسترده نظامی علیه ایران، محاصره دریایی و فشارهای اقتصادی بر جمهوری اسلامی ادامه یابد. قالیباف: توپ در زمین آمریکاست؛ واشینگتن هنوز به شروط ایران پاسخ رسمی نداده است او روز دوشنبه اعلام کرد که کشورهای عرب حاشیه خلیج فارس نیز ادامه این فشارها را به حملات نظامی تازه ترجیح می‌دهند. مارکو روبیو، وزیر خارجهٔ آمریکا، نیز روز سه‌شنبه در حاشیهٔ نشست وزیران خارجهٔ گروه هفت در پاریس، فشار اقتصادی واردشده بر ایران را «فوق‌العاده» توصیف کرد و گفت تحریم‌های اقتصادی و محاصرهٔ دریایی آمریکا چنان مؤثر عمل می‌کنند که دونالد ترامپ، رئیس‌جمهور آمریکا، در شرایط کنونی نیازی به انجام عملیات نظامی گسترده علیه ایران ندارد. با این حال، ارتش آمریکا همچنان به تقویت حضور نظامی خود در خاورمیانه ادامه می‌دهد و تلاش‌های میانجیگرانه قطر و پاکستان برای پایان دادن به جنگ نیز جریان دارد. خبرگزاری رویترز روز چهارشنبه از قول کارشناسان انرژی نوشت که حتی بدون ازسرگیری حملات گسترده آمریکا به ایران، ادامه وضعیت «نه جنگ، نه صلح» هزینه‌های سنگینی بر تولیدکنندگان انرژی در خلیج", "image_url": "https://gdb.rferl.org/e7f03622-7fab-4083-bb5f-889697e0a1d2_w1200_h630.jpg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۲۰ آبان • ۲۱:۱۸"}, {"source": "IranWire", "title": "کشته شدن سه شهروند بلوچ با تیراندازی نیروهای جمهوری اسلامی در زاهدان", "link": "https://iranwire.com/fa/news-1/160114-%DA%A9%D8%B4%D8%AA%D9%87-%D8%B4%D8%AF%D9%86-%D8%B3%D9%87-%D8%B4%D9%87%D8%B1%D9%88%D9%86%D8%AF-%D8%A8%D9%84%D9%88%DA%86-%D8%A8%D8%A7-%D8%AA%DB%8C%D8%B1%D8%A7%D9%86%D8%AF%D8%A7%D8%B2%DB%8C-%D9%86%DB%8C%D8%B1%D9%88%D9%87%D8%A7%DB%8C-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D8%AF%D8%B1-%D8%B2%D8%A7%D9%87%D8%AF%D8%A7%D9%86/", "summary": "پایگاه خبری حال‌وش گزارش داد، بامداد چهارشنبه ۲۰ آبان ۱۴۰۵، سه شهروند بلوچ با تیراندازی نیروهای نظامی و امنیتی به خودروی آن‌ها در مسیر ل ...", "date_str": "2026-11-11T16:12:41+00:00", "hash": "f4ad5ed783fc09e7", "title_fa": "کشته شدن سه شهروند بلوچ با تیراندازی نیروهای جمهوری اسلامی در زاهدان", "summary_fa": "پایگاه خبری حال‌وش گزارش داد، بامداد چهارشنبه ۲۰ آبان ۱۴۰۵، سه شهروند بلوچ با تیراندازی نیروهای نظامی و امنیتی به خودروی آن‌ها در مسیر ل ... حال‌وش هویت کشته‌شدگان را حنظله جمالزهی، ۳۰ ساله، امید جمالزهی، ۳۰ ساله و مبین گنگوزهی (ریگی)، ۳۴ ساله اعلام کرده است. هر سه نفر اهل میرجاوه و ساکن زاهدان بودند. بر اساس اطلاعاتی که منابع حال‌وش در اختیار این رسانه قرار داده‌اند، این سه شهروند هنگام بازگشت از تهران به زاهدان، حوالی ساعت سه بامداد در مسیر لخشک هدف تیراندازی نیروهای نظامی و امنیتی قرار گرفتند. به گفته این منابع، نیروهای مستقر در محل لباس شخصی بر تن داشتند و بدون اعلام ایست به سوی خودروی آن‌ها شلیک کردند. منابع حال‌وش گفته‌اند پس از اصابت گلوله و توقف خودرو، نیروهای حاضر در محل به حنظله جمالزهی و مبین گنگوزهی تیر خلاص شلیک کردند و سپس محل را ترک کردند. به گفته شاهدان عینی، شهروندان محلی پس از این حادثه با اورژانس تماس گرفتند و پیکر هر سه نفر با آمبولانس به پزشکی قانونی زاهدان منتقل شد. خانواده‌ها و نزدیکان کشته‌شدگان نیز پس از اطلاع از حادثه در مقابل پزشکی قانونی حضور یافتند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/NC3Cq_ltcG__v1024x512__box_0%2C0%2C912%2C480.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۰ آبان • ۱۹:۴۲"}, {"source": "IranWire", "title": "بلومبرگ: جمهوری اسلامی ماهانه حدود ۵۰ موشک بالستیک تولید می‌کند", "link": "https://iranwire.com/fa/news-1/160115-%D8%A8%D9%84%D9%88%D9%85%D8%A8%D8%B1%DA%AF-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D9%85%D8%A7%D9%87%D8%A7%D9%86%D9%87-%D8%AD%D8%AF%D9%88%D8%AF-%DB%B5%DB%B0-%D9%85%D9%88%D8%B4%DA%A9-%D8%A8%D8%A7%D9%84%D8%B3%D8%AA%DB%8C%DA%A9-%D8%AA%D گروه هفت هشدار دادند که در صورت شکست تلاش‌های دیپلماتیک، کشورهای عضو به هماهنگی برای اعمال فشارهای اقتصادی و سیاسی بر جمهوری اسلامی ادامه خواهند داد تا توانایی آن برای ایجاد بی‌ثباتی در منطقه و جهان محدود شود. گروه هفت همچنین بر اجرای کامل تحریم‌های سازمان ملل علیه ایران که در سپتامبر ۲۰۲۵ از طریق سازوکار ماشه بازگردانده شدند، تاکید کرد و از همه کشورهای عضو سازمان ملل خواست این تحریم‌ها را به‌طور کامل اجرا کنند. بخش دیگری از این بیانیه به نقش جمهوری اسلامی در اقدامات خشونت‌آمیز در کشورهای عضو گروه هفت اختصاص دارد. وزیران خارجه این کشورها با ابراز نگرانی شدید از آنچه توطئه‌های خشونت‌آمیز ایران علیه شهروندان و در خاک کشورهای عضو خواندند، از ارزیابی دولت بریتانیا درباره دخالت تهران در حادثه ۲۷ سپتامبر در پایگاه هوایی سلطنتی فرفورد حمایت کردند. در این بیانیه آمده است: «ما ارزیابی بریتانیا درباره دخالت ایران در حادثه ۲۷ سپتامبر در پایگاه نیروی هوایی سلطنتی فرفورد را به رسمیت می‌شناسیم.» وزیران خارجه گروه هفت همچنین با اشاره به کمک‌های نظامی جمهوری اسلامی به روسیه، این حمایت‌ها را محکوم کردند و از تهران خواستند پشتیبانی خود از گروه‌های مسلح غیردولتی در منطقه را متوقف کند. در بیانیه مشترک این کشورها آمده است: «ایران نباید هیچ تردیدی داشته باشد که ما متحد هستیم و همچنان به حفاظت از حاکمیت ملی خود متعهد خواهیم ماند.» وزیران خارجه گروه هفت در بخش دیگری از بیانیه، حملات جمهوری اسلامی به کشورهای همسایه و پیامدهای محدودیت تردد در تنگه هرمز بر تجارت بین‌المللی، امنیت انرژی و اقتصاد جهانی را به‌شدت محکوم کردند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/888_GbEq__v1024x512__box_0%2C288%2C2048%2C1365.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۲۰ آبان • ۱۸:۳۳"}, {"source": "IranWire", "title": "محسن رضایی: پایگاه‌های آمریکا در اروپا را هدف قرار می‌دهیم", "link": "https://iranwire.com/fa/news-1/160113-%D9%85%D8%AD%D8%B3%D9%86-%D8%B1%D8%B6%D8%A7%DB%8C%DB%8C-%D9%BE%D8%A7%DB%8C%DA%AF%D8%A7%D9%87%D9%87%D8%A7%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D8%AF%D8%B1-%D8%A7%D8%B1%D9%88%D9%BE%D8%A7-%  برای پرداخت بدهی، تأمین پول رهن خانه یا جبران هزینه‌های زندگی حاضر شده‌اند بخشی از بدنشان را بفروشند. این گزارش در شرایطی منتشر می‌شود که طی سال‌های گذشته، همزمان با افزایش تورم، گرانی مسکن، کاهش ارزش ریال و سقوط دستمزدها، آگهی‌های فروش اعضای بدن به یکی از نشانه‌های بحران فقر در ایران تبدیل شده‌ است. اکنون روایت‌های تازه نشان می‌دهد که فشار اقتصادی حتی برخی افراد شاغل و دارای درآمد را نیز به چنین نقطه‌ای رسانده است. عابران پیاده در خیابان فرهنگ حسینی و خیابان مجاور آن، والی‌نژاد، با انبوه آگهی‌های فروش اعضای بدن مواجه می‌شوند. نزدیکی این خیابان‌ها به انجمن خیریه حمایت از بیماران کلیوی و مراکز درمانی، باعث شده است افرادی که به دنبال عضو پیوندی‌اند و کسانی که قصد فروش عضو دارند، در این محدوده به یکدیگر نزدیک شوند. یکی از کارکنان بیمارستان صدرا، واقع در انتهای خیابان فرهنگ حسینی، می‌گوید انتظار برای دریافت کلیه از مسیر رسمی ممکن است تا چهار سال طول بکشد، به همین دلیل برخی خانواده‌ها خود مستقیم درصدد جست‌وجوی فروشنده برمی‌آیند. به گفتهٔ این فرد، قیمت‌های پیشنهادی برای کلیه معمولاً به چند میلیارد تومان می‌رسد. او از امکان یافتن کلیه با گروه خونی او مثبت در حدود ۸۰۰ میلیون تومان و درخواست چهار تا پنج میلیارد تومان برای برخی گروه‌های خونی کمیاب خبر داد. فروش کلیه برای تسویه بدهی پیک موتوری ۳۰ ساله در این گزارش آمده که یکی از فروشندگان، پیک موتوری ۳۰ ساله‌ای در تهران است که برای پرداخت بدهی‌هایش، قصد فروش کلیه دارد. این مرد گفت یک خریدار حاضر شده بود یک میلیارد و ۵۰۰ میلیون تومان برای کلیه او بپردازد و قرار بود ۲۰۰ میلیون تومان نیز از محل بیمه پرداخت شود، اما مجموع یک میلیارد و ۷۰۰ میلیون تومان برای حل مشکلات مالی‌ او کافی نبود و تأکید کرد که حاضر نیست کلیه خود را به کمتر از سه میلیارد و ۵۰۰ میلیون تومان بفروشد. این پیک موتوری که درآمدش به کار روزانه و توان جسمی او وابسته است، اکنون برای رهایی از بدهی ناچار شده است یکی از اعضای بدنش را به فروش بگذارد. فروش اعضای بدن برای تأمین هزینهٔ رهن خانه یکی دیگر از روایت‌های گزارش ایلنا مربوط به مردی ۴۵ ساله است که پیش‌تر در حوالی خ", "date_str": "2026-11-11T13:18:09+00:00", "hash": "b444b7155b2f296c", "title_fa": "کلیه سه‌ونیم میلیا توانید از امروز با دسترسی به کلید API خود در Google AI Studio و بررسی مستندات ما برای راهنمای Python، JavaScript و REST شروع به ساخت کنید. امروز، Gemini Decisions API را معرفی می‌کنیم، یک نقطه پایانی جدید برای تصمیم‌گیری‌های سریع و بسته که توسط مدل جدید Gemini Decision 1 (gemini-decision-1) ارائه می‌شود، که از طریق Gemini API در استودیوی هوش مصنوعی Google در دسترس است. Decisions API برای انتخاب‌های محدود مانند انتخاب ابزار، بررسی خط‌مشی، مسیریابی مدل و درجه‌بندی زمینه به شما اصول اولیه هدفمند می‌دهد. شما می توانید یک ورودی چندوجهی را در متن، تصاویر، صدا، ویدئو و PDF (حداکثر 256 هزار توکن) به همراه حداکثر 1000 سوال مستقل ارسال کنید. Gemini Decision 1 به جای ایجاد پاسخ نوشتاری به صورت رمز، گزینه‌های نامزد شما را در یک پاس رو به جلو امتیاز می‌دهد، احتمالات و امتیازات اطمینان را در 150 تا 250 میلی‌ثانیه تأخیر انتها به انتها با 0.10 دلار به ازای هر 1 میلیون توکن ورودی با توکن‌های خروجی صفر محاسبه می‌کند.", "image_url": "https://storage.googleapis.com/gweb-uniblog-publish-prod/images/gemini__decisions__blog-header_2784x1566.width-1300.png", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۲۰ آبان • ۲۱:۳۰"}, {"source": "Business Insider", "title": "Dario Amodei says AI will cure cancer and Alzheimer's in a decade. Doctors aren't buying it.", "link": "https://www.businessinsider.com/dario-amodei-anthropic-cancer-cure-ipo-roadshow-backlash-doctors-2026-11", "summary": "Not everyone is bullish on Anthropic finding a cure for cancer within the decade. Finn Gomez/Getty Images Anthropic's CEO said AI will solve cancer and Alzheimers in less than 10 years. That prediction riled people in the medical community, who said it was unrealistic. What's not up for debate is Anthropic's IPO, which is only weeks away. A cure for cancer is less than a decade away, if you ask Anthropic CEO Dario Amodei. If you ask some in the medical community, though, that timeline is a bit ambitious, if not altogether unrealistic. In a 42-minute IPO roadshow video the company released on Tuesday, Amodei made the audacious prediction that \"cancer, Alzheimer's, heart disease, mental illness — these will be relics of the past in, I think, less than a decade.\" The claim that all those diseases, which have bedeviled medicine's best minds for centuries, will be suddenly cured by AI riled some AI naysayers and physicians, who took to X to voice their disbelief. \"Curing cancer, Alzheimer's and mental illnesses can definitely benefit from AI. But that is impossible in just 10 years,\" Karl Lauterbach, Germany's former health minister, said on X. \"Unclear whether people like @DarioAmodei know so little about medicine or are deliberately misleading the public,\" he added. Unklar, ob Leute wie @DarioAmodei so wenig über Medizin wissen oder die Öffentlichkeit bewusst täuschen. Heilung von Krebs, Alzheimer und psychischen Erkrankungen kann definitiv von KI profitieren. Aber das geschieht unmöglich in nur 10 Jahren. Wir sollten auf Prävention setzen https://t.co/FzELuSx7VC — Prof. Karl Lauterbach (@Karl_Lauterbach) November 11, 2026 Melinda B. Chu, an AI medical researcher with an MD from Saint Louis University, said Amodei made those predictions just to stoke hype for the company's IPO. \"Anthropic has done nothing to suggest they themselves will contribute meaningfully to these goals,\" Chu said. Rami Elghandour, a biotech executive, said Amodei's prediction reeks of desperation. \"I've taken two companies public. These are insane things to say in an IPO pitch,\" he said. I’ve taken two companies public. These are insane things to say in an IPO pitch and wreaks of desperation. https://t.co/AZ5J9Df5ov — Rami Elghandour (@RamiElghandour) November 11, 2026 Amodei, long prone to waxing poetic about how AI could be misused by bad actors, has sought to soften his doomer reputation by, in part, highlighting AI's potential benefit to medicine. Anthropic has moved to expand its r", "date_str": "2026-11-11T17:28:53+00:00", "hash": "895577ffefc21b33", "title_fa": "داریو آمودی می گوید هوش مصنوعی سرطان و آلزایمر را در یک دهه درمان می کند. پزشکان آن را نمی خرند.", "summary_fa": "همه نسبت به یافتن درمانی برای سرطان در این دهه از آنتروپیک خوشبین نیستند. فین گومز/ مدیرعامل گتی ایماژ آنتروپیک گفت هوش مصنوعی سرطان و آلزایمر را در کمتر از 10 سال حل خواهد کرد. این پیش‌بینی مردم جامعه پزشکی را عصبانی کرد و آن‌ها گفتند که غیرواقعی است. چیزی که مورد بحث نیست، عرضه اولیه سهام آنتروپیک است که تنها چند هفته دیگر باقی مانده است. اگر از داریو آمودی، مدیر عامل آنتروپیک بپرسید، درمان سرطان کمتر از یک دهه باقی مانده است. اگر از برخی در جامعه پزشکی بپرسید، این جدول زمانی کمی جاه طلبانه است، اگر نه کاملاً غیر واقعی. در یک ویدیوی 42 دقیقه‌ای نمایش عمومی IPO که این شرکت در روز سه‌شنبه منتشر کرد، آمودی پیش‌بینی جسورانه‌ای کرد که \"سرطان، آلزایمر، بیماری قلبی، بیماری روانی - فکر می‌کنم در کمتر از یک دهه، اینها یادگارهای گذشته خواهند بود.\" این ادعا که همه آن بیماری‌ها که قرن‌ها بهترین ذهن‌های پزشکی را به ستوه آورده‌اند، ناگهان توسط هوش مصنوعی درمان خواهند شد، برخی از مخالفان و پزشکان هوش مصنوعی را عصبانی کرد و به X مراجعه کردند تا ناباوری خود را اعلام کنند. کارل لاوترباخ، وزیر بهداشت سابق آلمان در X می گوید: \"درمان سرطان، آلزایمر و بیماری های روانی قطعاً می تواند از هوش مصنوعی بهره مند شود. اما این کار در عرض 10 سال غیرممکن است.\" معلوم نیست افرادی مانند DarioAmodei در مورد پزشکی اطلاعات کمی دارند یا عمداً مردم را گمراه می کنند. درمان سرطان، آلزایمر و بیماری های روانی قطعاً می تواند از هوش مصنوعی بهره مند شود. اما هیچ راهی وجود ندارد که این اتفاق در 10 سال آینده رخ دهد. ما باید روی پیشگیری تمرکز کنیم https://t.co/FzELuSx7VC — پروفسور کارل لاوترباخ (@Karl_Lauterbach) 11 نوامبر 2026 ملیندا بی. چو، محقق پزشکی هوش مصنوعی با پزشكی از دانشگاه سنت لوئیس، گفت که آمودی", "image_url": "https://i.insider.com/6af486880cc3ffba8779beeb?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "بورس و طلا"], "datetime_fa": "۲۰ آبان • ۲۰:۵۸"}, {"source": "Lifehacker", "title": "Garmin Cyclists Can Now Make Themselves Appear on Waze in Real Time", "link": "https://lifehacker.com/health/garmin-cyclists-can-now-show-up-on-waze?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Cyclists who ride with Garmin gear can now appear as live, moving icons on the Waze driving app, and nearby drivers will receive an alert to slow down and watch for them on the road. For riders already using Garmin devices, opting in costs nothing and adds a new layer of safety, particularly on roads where drivers may not expect cyclists. The feature is rolling out now, but you should be aware of its limitations. Garmin Edge 1060, Premium GPS Cycling Computer | Built for Performance-Driven Cyclists, Hands-Free Voice Control, Superior Navigation, Performance Insights $799.99 at Amazon Get Deal Get Deal $799.99 at Amazon How Garmin cyclists can show up for Waze drivers Riders can simply opt in once through Garmin Connect . After that, sharing starts automatically when an outdoor cycling activity begins and stops when the ride ends. While a ride is underway, Waze users near the cyclist see a cyclist icon move along the road and receive a Live Cycling Alert reminding them to slow down and stay aware. The feature runs on LiveTrack, Garmin's existing live location-sharing tool, which lets friends and family follow a rider's real-time location, speed, course, and more. Garmin says this collaboration extends that peace of mind to motorists, giving them greater awareness of their surroundings. Garmin notes its location sharing is temporary and session-based. The rider's name, identity, and route are hidden, and no personal information is shared or displayed in Waze. Drivers see only an anonymous icon and the alert. How to use Garmin Connect's Waze feature You'll need a few things to get this feature up and running: A compatible Garmin Edge bike computer or Garmin watch A phone running Garmin Connect with a data connection An outdoor cycling activity (the feature doesn't apply to indoor rides) The good news is using the feature is free: LiveTrack costs nothing on compatible Garmin bike computers and watches, and Waze is free for drivers. The limits of this new safety feature This new feature is a great safety perk, but there are real-world caveats worth considering: This feature is for Waze only. Alerts reach drivers only when Waze is open on their phone. Google Maps, which has far more users, is excluded, so a large portion of the drivers you share the road with won't see you this way. It depends on your phone's signal. Your position travels from the Garmin to your phone, then to Garmin's servers, then to Waze, and ", "date_str": "2026-11-11T18:30:00+00:00", "hash": "1667fb5d5bc4637c", "title_fa": "دوچرخه سواران گارمین اکنون می توانند خود را در Waze در زمان واقعی نشان دهند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. دوچرخه‌سوارانی که با دنده گارمین سوار می‌شوند، اکنون می‌توانند به‌عنوان نمادهای زنده و متحرک در برنامه رانندگی Waze ظاهر شوند، و رانندگان اطراف هشداری برای کاهش سرعت و تماشای آنها در جاده دریافت می‌کنند. برای سوارانی که قبلاً از دستگاه‌های گارمین استفاده می‌کردند، انتخاب کردن هیچ هزینه‌ای ندارد و لایه جدیدی از ایمنی را اضافه می‌کند، به ویژه در جاده‌هایی که رانندگان ممکن است از دوچرخه‌سواران انتظار نداشته باشند. این ویژگی در حال حاضر در دسترس است، اما باید از محدودیت های آن آگاه باشید. Garmin Edge 1060، کامپیوتر دوچرخه سواری GPS ممتاز | ساخته شده برای دوچرخه سواران عملکرد محور، کنترل صوتی بدون دست، ناوبری برتر، بینش عملکرد 799.99 دلار در آمازون دریافت معامله دریافت تخفیف 799.99 دلار در آمازون چگونه دوچرخه سواران گارمین می توانند برای رانندگان Waze ظاهر شوند سواران به سادگی می توانند یک بار از طریق Garmin Connect شرکت کنند. پس از آن، با شروع یک فعالیت دوچرخه‌سواری در فضای باز، اشتراک‌گذاری به‌طور خودکار شروع می‌شود و پس از پایان دوچرخه‌سواری متوقف می‌شود. در حالی که سواری در حال انجام است، کاربران Waze در نزدیکی دوچرخه‌سوار، نماد دوچرخه‌سوار را می‌بینند که در امتداد جاده حرکت می‌کند و یک هشدار دوچرخه‌سواری زنده دریافت می‌کنند که به آنها یادآوری می‌کند که سرعت خود را کم کنند و آگاه باشند. این ویژگی روی LiveTrack، ابزار اشتراک‌گذاری مکان زنده موجود گارمین اجرا می‌شود، که به دوستان و خانواده اجازه می‌دهد موقعیت مکانی، سرعت، مسیر و موارد دیگر را در زمان واقعی سوارکار دنبال کنند. گارمین می‌گوید این همکاری آرامش خاطر را به رانندگان می‌دهد و به آنها آگاهی بیشتری از محیط اطرافشان می‌دهد. Garmin خاطرنشان می کند که اشتراک گذاری موقعیت مکانی آن موقتی و مبتنی بر جلسه است. نام، هویت و مسیر سوار پنهان است و هیچ", "image_url": "https://lifehacker.com/imagery/articles/01M75S7JCVZC5HQPA3FSFVNFSJ/hero-image.fill.size_1200x675.png", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲۰ آبان • ۲۲:۰۰"}, {"source": "Lifehacker", "title": "10 Google Privacy Hacks Everyone Should Know", "link": "https://lifehacker.com/tech/google-privacy-hacks-everyone-should-know?utm_medium=RSS", "summary": "From managing your Gmail inbox to downloading apps on your Android phone, pretty much every aspect of your digital life has a little bit of Google in it. That is a lot of power in the hands of a company that makes money by selling your data to advertisers. While you can't fully escape Google's tracking without quitting a whole bunch of essential online services, you can use these privacy hacks to reduce how the company tracks you, as well as protect the information in your Google account. Use Gmail aliases to keep your account anonymous Your Gmail account doesn't just have one email address. In fact, it has unlimited addresses, but you need a hack to utilize them. When you're signing up for a new service, you can add another word to your email address, as well as the \"+\" symbol, to create an alias. For example, if your email is \"lifehacker@gmail.com,\" and you're signing up for an Amazon account, you can use \"lifehacker+amazon@gmail.com\" as your email address. The email will still end up in your main inbox, as if you simply used lifehacker@gmail.com. Not only can this trick turn one Gmail address into an unlimited number of addresses, but it also helps you identify who sold your email address to spammers, because those emails will have the alias in the \"To\" field. If you wish to make your emails more private, you can also link your Proton Mail account to Gmail . This lets you send and receive emails via your Gmail address, while using Proton Mail's privacy protections such as blocking email trackers. Check session logs and disable unauthorized apps to secure your account Credit: Pranay Parab Gmail's web view has a crucial security feature that lets you view session logs . This feature is inexplicably buried at the bottom of the inbox, and the font size is tiny, so it's easy to miss. To find it, log in to Gmail on the web, and scroll to the bottom of your inbox. Click the Details button in the bottom-right corner, below \"Last account activity.\" This will show you a pop-up that lists the devices, apps, and locations you've recently logged in from. This makes it easy to see if there's been any suspicious activity in your Google account, and you can click the Security Checkup link in the pop-up to review this data. Just note that if you use a VPN or a service like iCloud Private Relay, you might not recognize your own device's location. To check if unwanted apps have access to your Google account, you can visit this settings page . Turn off personalized recomme", "date_str": "2026-11-11T18:00:00+00:00", "hash": "2a867d1ef40068f3", "title_fa": "10 هک حریم خصوصی گوگل که همه باید بدانند", "summary_fa": "از مدیریت صندوق ورودی جیمیل تا دانلود برنامه‌ها در تلفن اندرویدی، تقریباً همه جنبه‌های زندگی دیجیتالی شما مقدار کمی از Google را در خود جای داده است. این قدرت زیادی در دست شرکتی است که با فروش داده های شما به تبلیغ کنندگان پول در می آورد. در حالی که نمی‌توانید به طور کامل از ردیابی Google بدون خروج از یک سری خدمات ضروری آنلاین فرار کنید، می‌توانید از این هک‌های حریم خصوصی برای کاهش نحوه ردیابی شرکت و همچنین محافظت از اطلاعات حساب Google خود استفاده کنید. از نام مستعار Gmail برای ناشناس نگه داشتن حساب خود استفاده کنید حساب Gmail شما فقط یک آدرس ایمیل ندارد. در واقع، آدرس های نامحدودی دارد، اما برای استفاده از آنها به هک نیاز دارید. هنگامی که در حال ثبت نام برای یک سرویس جدید هستید، می توانید کلمه دیگری را به آدرس ایمیل خود و همچنین نماد \"+\" اضافه کنید تا یک نام مستعار ایجاد کنید. برای مثال، اگر ایمیل شما \"lifehacker@gmail.com\" است و در حال ثبت نام برای یک حساب کاربری آمازون هستید، می توانید از \"lifehacker+amazon@gmail.com\" به عنوان آدرس ایمیل خود استفاده کنید. ایمیل همچنان در صندوق ورودی اصلی شما قرار می گیرد، گویی که از lifehacker@gmail.com استفاده کرده اید. این ترفند نه تنها می‌تواند یک آدرس جیمیل را به تعداد نامحدودی آدرس تبدیل کند، بلکه به شما کمک می‌کند تا شناسایی کنید چه کسی آدرس ایمیل شما را به ارسال‌کنندگان هرزنامه فروخته است، زیرا آن ایمیل‌ها نام مستعار را در قسمت \"To\" خواهند داشت. اگر می‌خواهید ایمیل‌های خود را خصوصی‌تر کنید، می‌توانید حساب Proton Mail خود را نیز به Gmail مرتبط کنید. این به شما امکان می‌دهد ایمیل‌ها را از طریق آدرس Gmail خود ارسال و دریافت کنید، در حالی که از محافظت‌های حریم خصوصی Proton Mail مانند مسدود کردن ردیاب‌های ایمیل استفاده می‌کنید. گزارش‌های جلسه را بررسی", "image_url": "https://lifehacker.com/imagery/articles/01M75NNT2V4BWQDMFE4MPKMAY7/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۲۰ آبان • ۲۱:۳۰"}, {"source": "The Guardian AI", "title": "Hacked fridges and other dangers lurking in the ‘internet of shit’ | Letters", "link": "https://www.theguardian.com/technology/2026/nov/11/hacked-fridges-and-other-dangers-lurking-in-the-internet-of-shit", "summary": "One reader sounds a warning about all our devices that are connected to the internet, following a series of cyber-attacks on supermarket fridges Well done to Alex Pearce for unplugging his fridge from the internet ( Hot fridges, a fake nuclear alert and a $6bn heist: are we in the foothills of a hacking epidemic?, 8 November ). My only question is why he didn’t do it a few weeks earlier, when the first round of hacked fridges were headline news for several days. Your article notes that there are millions of devices connected to the internet. This sea of domestic and industrial controllers, known as the “internet of things” in marketing literature and the “internet of shit” by engineers, all have several things in common: their firmware is almost never upgraded, software security features are a fig leaf and the vast majority can run without an internet connection. Continue reading...", "date_str": "2026-11-11T17:26:27+00:00", "hash": "15477d12b921e4f6", "title_fa": "یخچال های هک شده و سایر خطرات در کمین \"اینترنت گنده\" | نامه ها", "summary_fa": "پس از یک سری حملات سایبری به یخچال‌های سوپرمارکت، یکی از خوانندگان هشداری درباره همه دستگاه‌های ما که به اینترنت متصل هستند به صدا در می‌آورد. آفرین به الکس پیرس که یخچالش را از اینترنت جدا کرد (یخچال‌های داغ، هشدار هسته‌ای جعلی و دزدی ۶ میلیارد دلاری: آیا ما در دامنه یک اپیدمی هک هستیم؟، ۸ نوامبر). تنها سوال من این است که چرا او این کار را چند هفته زودتر انجام نداد، زمانی که اولین دور یخچال های هک شده برای چندین روز خبر اصلی بود. مقاله شما اشاره می کند که میلیون ها دستگاه به اینترنت متصل هستند. این دریایی از کنترل‌کننده‌های خانگی و صنعتی که در ادبیات بازاریابی به‌عنوان «اینترنت اشیا» و مهندسان «اینترنت شیطنت» شناخته می‌شوند، همگی چندین ویژگی مشترک دارند: سیستم‌افزار آنها تقریباً هرگز ارتقا نمی‌یابد، ویژگی‌های امنیتی نرم‌افزار یک برگ انجیر هستند و اکثریت قریب به اتفاق می‌توانند بدون اتصال به اینترنت کار کنند. به خواندن ادامه دهید... برای بسیاری از این دستگاه‌ها، دیگر خیلی دیر شده است - آنها در حال حاضر بخشی از یک بات‌نت هستند که برای حمله به دستگاه‌های دیگر در اینترنت استفاده می‌شود. هوش مصنوعی چیز جدیدی به ارمغان نمی آورد، اما زمان مورد نیاز برای یافتن سوء استفاده هایی را که اسباب بازی جدید براق شما را به بخشی از مشکل تبدیل می کند، به شدت کاهش داده است. خواه دوربین امنیتی خانگی، یخچال صنعتی یا کوره بلند باشد، توصیه این متخصص امنیت نرم افزار با کنترلرهای صنعتی یکسان است: اگر مطمئن هستید ارتقا دهید، اگر مطمئن نیستید آن را از برق بکشید. رمز وای فای فر خود را ندهید. نام و آدرس ارائه شده است", "image_url": "https://i.guim.co.uk/img/media/bafa8d12a10f9e36c23d55af0f9834cd83053640/503_0_1875_1500/master/1875.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=6145989f3890fadbbcaaf79b821107b8", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۲۰ آبان • ۲۰:۵۶"}, {"source": "The Verge", "title": "Toyota’s Scion is back, starting with an American-made, 25-mph kei truck", "link": "https://www.theverge.com/transportation/1031554/oyota-scion-kei-01-truck-revival", "summary": "Toyota is dusting off the Scion badge for a radically different mission. Rather than targeting youth-market hatchbacks, \"Scion by Toyota\" is being positioned as an experimental mobility incubator - and its first vehicle is an authentic Japanese-style kei truck built in Indiana. Kei vehicles, which are built to satisfy Japan's light vehicle regulations, are enjoying surging popularity around the world, including here in the US. More than 30,000 used kei trucks have been imported into the US since 2020, with roughly 7,500 units entering the country each year. Even President Trump is a fan , telling reporters last year that he authorized the De … Read the full story at The Verge.", "date_str": "2026-11-11T17:09:58+00:00", "hash": "f704bbb024001dfd", "title_fa": "تویوتا Scion بازگشته است، با یک کامیون Kei ساخت آمریکا با سرعت 25 مایل در ساعت شروع می شود.", "summary_fa": "تویوتا برای ماموریتی کاملاً متفاوت، نشان Scion را پاک می کند. به‌جای هدف قرار دادن هاچ‌بک‌های بازار جوانان، «Scion by Toyota» به‌عنوان یک دستگاه جوجه‌کشی آزمایشی برای تحرک در نظر گرفته می‌شود - و اولین وسیله نقلیه آن یک کامیون Kei به سبک ژاپنی معتبر است که در ایندیانا ساخته شده است. خودروهای Kei که برای رعایت مقررات خودروهای سبک ژاپن ساخته شده‌اند، از محبوبیت فزاینده‌ای در سراسر جهان، از جمله اینجا در ایالات متحده، برخوردار هستند. از سال 2020 تاکنون بیش از 30000 کامیون استفاده شده به ایالات متحده وارد شده است که هر ساله حدود 7500 دستگاه وارد این کشور می شود. حتی پرزیدنت ترامپ هم طرفدار اوست و سال گذشته به خبرنگاران گفت که مجوز De… داستان کامل را در The Verge بخوانید. اخبار حمل‌ونقل خودروهای تویوتا Scion بازگشته است، با یک کامیون Kei ساخت آمریکا شروع می‌کند تویوتا در حال احیای نشان Scion به‌عنوان یک دستگاه جوجه‌کشی آزمایشی برای تحرک است - با یک کامیون kei ساخت ایندیانا با سرعت 25 مایل در ساعت که برای ناوگان آمریکایی مهندسی شده است. پیوند PM UTC اشتراک گذاری تصویر هدیه: تویوتا اندرو جی. هاوکینز ویرایشگر حمل و نقل با بیش از 10 سال تجربه است که خودروهای برقی، حمل و نقل عمومی و هوانوردی را پوشش می دهد. آثار او در نیویورک دیلی نیوز و سیتی استیت ظاهر شده است. تویوتا برای ماموریتی کاملاً متفاوت، نشان Scion را پاک می کند. به جای هدف قرار دادن هاچ بک های بازار جوانان، \"Scion by Toyota\" به عنوان یک ماشین جوجه کشی آزمایشی جابجا می شود - و اولین وسیله نقلیه آن یک کامیون Kei به سبک ژاپنی معتبر است که در ایندیانا ساخته شده است. به نظر می رسد تویوتا اولین کسی باشد که اشتهای بازار آمریکا را برای کامیون های کوچک آزمایش می کند. به نظر می رسد", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Scion_Kei_Truck_2027-2.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۲۰:۳۹"}, {"source": "Ars Technica", "title": "Big Walk used AI to fix a bug. Now the indie gaming world is having a reckoning.", "link": "https://arstechnica.com/gaming/2026/11/big-walk-used-ai-to-fix-a-bug-now-the-indie-gaming-world-is-having-a-reckoning/", "summary": "The last few years have seen significant debate over the widespread use of AI-powered tools in game development and the responsible disclosure of that usage to players. That debate has exploded into a full-blown controversy in the indie game development space this week, as Big Walk developer House House has publicly and belatedly disclosed minimal AI use in its popular co-operative puzzle exploration game. This particular controversy has been brewing behind the scenes for months, as judges and jury members for the prestigious Independent Games Festival Awards discussed the issue in private discussion groups. But the debate started to break into public view on Monday when 19 members of the 50-plus-member jury released a signed statement outlining a stance \"declining to vote for any game that uses generative AI in any capacity.\" Noting \"a significant increase in the number of submitted games developer with generative AI tools,\" the group of jurors called out AI's ecological, economic, psychological, and labor harms in rejecting tools whose use, they said, is still \"not a foregone conclusion in our industry.\" Read full article Comments", "date_str": "2026-11-11T17:37:32+00:00", "hash": "b2808a7870c38a14", "title_fa": "Big Walk از هوش مصنوعی برای رفع یک باگ استفاده کرد. اکنون دنیای بازی های مستقل در حال حسابرسی است.", "summary_fa": "در چند سال گذشته بحث های قابل توجهی در مورد استفاده گسترده از ابزارهای مبتنی بر هوش مصنوعی در توسعه بازی و افشای مسئولانه استفاده از آن برای بازیکنان وجود داشته است. این بحث این هفته در فضای توسعه بازی‌های مستقل به بحثی تمام‌عیار تبدیل شد، زیرا هاوس هاوس، توسعه‌دهنده Big Walk، علناً و با تأخیر حداقل میزان استفاده از هوش مصنوعی را در بازی محبوب اکتشاف پازل مشارکتی خود فاش کرد. این جنجال خاص ماه‌هاست که در پشت صحنه شکل گرفته است، زیرا داوران و اعضای هیئت داوران جوایز جشنواره معتبر بازی‌های مستقل درباره این موضوع در گروه‌های گفتگوی خصوصی بحث کردند. اما این مناظره روز دوشنبه زمانی که 19 عضو هیئت منصفه متشکل از 50 نفر بیانیه امضا شده ای را منتشر کردند که در آن موضع \"متنع از رای دادن به بازی هایی که از هوش مصنوعی مولد در هر ظرفیتی استفاده می کنند\" منتشر کردند. این گروه از هیئت منصفه با اشاره به \"افزایش قابل توجهی در تعداد بازی‌های ارائه‌شده توسط توسعه‌دهندگان با ابزارهای مولد هوش مصنوعی\"، از آسیب‌های زیست‌محیطی، اقتصادی، روان‌شناختی و کارگری هوش مصنوعی در رد ابزارهایی که استفاده از آن‌ها، به گفته آنها، \"هنوز یک نتیجه قطعی در صنعت ما نیست\" نام بردند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش در چند سال اخیر بحث های مهمی در مورد استفاده گسترده از ابزارهای مبتنی بر هوش مصنوعی در توسعه بازی و افشای مسئولانه استفاده از آن برای بازیکنان صورت گرفته است. این بحث این هفته در فضای توسعه بازی‌های مستقل به بحثی تمام‌عیار تبدیل شد، زیرا هاوس هاوس، توسعه‌دهنده Big Walk، علناً و با تأخیر حداقل میزان استفاده از هوش مصنوعی را در بازی محبوب اکتشاف پازل مشارکتی خود فاش", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/bigwalkdebate-1152x648.png", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۲۰ آبان • ۲۱:۰۷"}, {"source": "Ars Technica", "title": "Apple is shuttering its 28-year-old online community forum", "link": "https://arstechnica.com/gadgets/2026/11/apple-is-shuttering-its-28-year-old-online-community-forum/", "summary": "Apple’s online community forum will close on November 20. On Tuesday night, Apple posted a message to the Apple Support Community announcing the forum's closure: The Apple Support Community will permanently close on November 20, 2026. Starting today, the site will no longer accept new posts and is available in a read-only state. You can continue to find trusted guidance and support on the official Apple Support site . We want to thank the community members who have contributed their time and expertise to help others with their Apple products. For 28 years, the forum has provided Apple users with a way to get quick technical advice about their products. That advice usually came from fellow users, though Apple employees occasionally chimed in. As with any community forum, the helpfulness and accuracy of the advice varied. Read full article Comments", "date_str": "2026-11-11T17:04:26+00:00", "hash": "e191b0af5a7f0e4d", "title_fa": "اپل انجمن آنلاین 28 ساله خود را تعطیل می کند", "summary_fa": "انجمن آنلاین انجمن اپل در 20 نوامبر بسته می شود. سه شنبه شب، اپل پیامی را به انجمن پشتیبانی اپل ارسال کرد که بسته شدن انجمن را اعلام کرد: انجمن پشتیبانی اپل در 20 نوامبر 2026 برای همیشه بسته می شود. از امروز، سایت دیگر پست های جدید را نمی پذیرد و در حالت فقط خواندنی در دسترس است. می‌توانید به یافتن راهنمایی و پشتیبانی قابل اعتماد در سایت رسمی پشتیبانی اپل ادامه دهید. می‌خواهیم از اعضای انجمن که وقت و تخصص خود را برای کمک به دیگران در محصولات اپل خود صرف کرده‌اند، تشکر کنیم. به مدت 28 سال، این انجمن راهی را برای کاربران اپل فراهم کرده است تا بتوانند مشاوره فنی سریع در مورد محصولات خود دریافت کنند. این توصیه‌ها معمولاً از سوی کاربران دیگر ارائه می‌شد، اگرچه کارمندان اپل گهگاه به آن‌ها سر می‌زدند. مانند هر انجمن اجتماعی، مفید بودن و دقت توصیه‌ها متفاوت بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید تالار گفتمان انجمن آنلاین اپل در تاریخ 20 نوامبر بسته می شود. طبق گزارش ها، اپل به MacRumors گفته است که پس از ارزیابی استراتژی پشتیبانی خود و نیازهای مشتری، انجمن را تعطیل می کند. بر اساس اعلام دیروز، به نظر می رسد اپل اکنون ترجیح می دهد که مشتریانش برای پشتیبانی فنی به کارمندان رسمی اپل اعتماد کنند. همچنین ممکن است با رشد انجمن‌های رقیب، از جمله Reddit و انجمن‌های پشتیبانی فنی در MacRumors و AppleInsider، این انجمن محبوبیت کمتری داشته باشد.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/GettyImages-1560398364-966x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۲۰ آبان • ۲۰:۳۴"}, {"source": "Ars Technica", "title": "IBM to offer access to a dual-processor quantum system in 2027", "link": "https://arstechnica.com/science/2026/11/ibm-to-offer-access-to-a-dual-processor-quantum-system-in-2027/", "summary": "IBM's Quantum Developer's Conference is being held this week, and the company is using the gathering to provide an update to its roadmap: It is aiming to make error-corrected quantum computers before the decade is out. The changes greatly expand the scope of its next-generation Nighthawk general-use processors by adding a version with over 500 programmable qubits. At the same time, it's stepping back a bit on its plan to link multiple Nighthawk processors together, dropping the intended number of linked systems from nine to two. The total number of qubits planned for next year will remain the same; how the company is getting there, however, will be different. Read full article Comments", "date_str": "2026-11-11T16:33:08+00:00", "hash": "c172837bb55b1dca", "title_fa": "IBM دسترسی به یک سیستم کوانتومی دو پردازنده را در سال 2027 ارائه می دهد", "summary_fa": "کنفرانس توسعه دهندگان کوانتومی آی‌بی‌ام این هفته برگزار می‌شود و این شرکت از این گردهمایی برای ارائه به‌روزرسانی نقشه راه خود استفاده می‌کند: هدف آن ساخت رایانه‌های کوانتومی اصلاح‌شده قبل از پایان دهه است. این تغییرات با افزودن نسخه ای با بیش از 500 کیوبیت قابل برنامه ریزی، دامنه نسل بعدی پردازنده های عمومی Nighthawk را به شدت گسترش می دهد. در عین حال، از برنامه خود برای اتصال چندین پردازنده Nighthawk به یکدیگر کمی عقب نشینی می کند و تعداد سیستم های مرتبط مورد نظر را از 9 به دو کاهش می دهد. تعداد کل کیوبیت های برنامه ریزی شده برای سال آینده ثابت باقی می ماند. با این حال، نحوه رسیدن شرکت به آنجا متفاوت خواهد بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید کنفرانس توسعه دهندگان کوانتومی IBM در این هفته برگزار می شود و این شرکت از این گردهمایی برای ارائه به روز رسانی به نقشه راه خود استفاده می کند: هدف آن این است که خطاهای رایانه ای را قبل از رفع خطا اصلاح کند. در همین حال، این شرکت از افزایش عملکرد به دست آمده از طریق یک تغییر عمده که در نسل پردازنده های Nighthawk منتشر شده در ماه سپتامبر ایجاد شد، تبلیغ می کند: بازنشانی کیوبیت مبتنی بر سخت mber 20. This annual gathering can often serve as an indicator of where the world stands on addressing and adapting to the climate crisis. And this year’s talks are sure to be a doozy—expect a lot of back and forth on fossil fuels and climate finance in particular. Here’s what you should know about COP31. In recent years, the tension always feels high when COP rolls around. (COP stands for “Conference of the Parties.”) But this year feels especially charged: The world is still grappling with the ongoing war in Iran, which has disrupted the Middle East and sent economic shock waves around the world as energy prices have spiked. This year’s COP will be the second without a formal delegation from the US. President Trump formally withdrew the country from the Paris Agreement earlier this year and is in the process of withdrawing from the UN Framework Committee on Climate Change. That’s the treaty that allows formal participation in negotiations. Meanwhile, things aren’t looking good for the Paris Agreement, which was established at UN climate talks 11 years ago, setting a goal of limiting warming to 1.5 °C over preindustrial levels. In a report published in September, the UN Environment Program acknowledged that global warming is set to exceed that 1.5 °C goal, “likely within the next few years.” So as climate talks kick off, there’s an obvious, urgent question looming about how to quickly cut emissions to limit warming. There’s also the major issue of how to pay for efforts to address emissions and to help a warming world endure the inevitable damage. Two years ago, talks ended in a goal of mobilizing $300 billion per year by 2035 to help pay to reduce emissions and adapt to climate change. (Rich nations provided $136.7 billion in 2024, according to the Organization for Economic Cooperation and Development. ) And last year, the COP30 agreement included a goal of tripling the money for adaptation over that period. (Such funding has been quite flat over the past few year 11T17:20:00+00:00", "hash": "507cca327b611801", "title_fa": "ماه، میدان نبرد آینده؛ پنتاگون به دنبال استقرار ماهواره‌های نظامی در اطراف قمر زمین است", "summary_fa": "پنتاگون با بررسی طرح استقرار منظومه‌ای از ماهواره‌های نظامی در اطراف ماه، به‌دنبال گسترش توان نظارتی آمریکا در فضای سیس‌لونار است. تبلیغات ارتش آمریکا با انتشار یک فراخوان درخواست اطلاعات ، گام مقدماتی برای توسعه منظومه‌ای از ماهواره‌های نظامی در اطراف ماه را برداشته است؛ طرحی که در مرحله نخست شامل حداکثر پنج فضاپیما می‌شود، اما می‌تواند زمینه‌ساز استقرار شبکه‌ای گسترده‌تر برای نظارت، ردیابی اجرام و حفاظت از منافع فضایی آمریکا باشد. وزارت نیروی هوایی آمریکا در اطلاعیه‌ای که دوم نوامبر منتشر شد، از شرکت‌های فعال در صنعت فضایی خواست که توانایی خود را برای ارائه راهکارهایی سریع و کم‌ریسک در راستای ساخت منظومه‌ای به نام «سامانه فضایی میان زمین و ماه» اعلام کنند. براساس فراخوان، مرحله نخست پروژه می‌تواند شامل حداکثر پنج فضاپیما باشد که هرکدام محموله‌ای متعلق به دولت آمریکا را حمل می‌کنند. هدف، آماده‌سازی این سامانه برای پاسخ‌گویی به نیازهای عملیاتی ارتش در اواخر سال ۲۰۲۹ است. بااین‌حال، چشم‌انداز پنتاگون به همین پنج ماهواره محدود نمی‌شود . در متن فراخوان آمده است که فضاپیماهای اولیه ممکن است به‌عنوان هسته اولیه منظومه‌ای بزرگ‌تر از ماهواره‌ها در فضای میان زمین و ماه (سیس‌لونار) عمل کنند. به بیان دیگر، ارتش آمریکا احتمالاً به‌دنبال ایجاد شبکه‌ای پایدار از ماهواره‌ها در اطراف ماه است. فراخوان پنتاگون به‌معنای تصویب نهایی پروژه یا تعهد قطعی ارتش به اجرای آن نیست. مقام‌های نظامی قصد دارند پس از بررسی پیشنهادها و اطلاعات بازار، حداکثر پنج قرارداد مطالعات طراحی مقدماتی با قیمت ثابت منعقد کنند. شرکت‌های علاقه‌مند تا ۲۴ نوامبر فرصت دارند پاسخ خود را ارسال کنند. با توجه به اینکه ساخت ماهواره‌های تجاری معمولاً دو تا سه سال زمان می‌برد، احتمالاً پنتاگون برای دستیابی به هدف سال ۲۰۲۹ باید قراردادهای اصلی را در سال ۲۰۲۷ منعقد کند.", "image_url": "https://api2.zoomit.ir/media/pentagon-cislunar-space-6af4a1d41e22a6ae5bd3ed55?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۲۰:۵۰"}, {"source": "Zoomit", "title": "بنزین سوپر داخلی در کدام جایگاه‌ها عرضه می‌شود؟ قیمت و فهرست کامل", "link": "https://www.zoomit.ir/iran-news/470959-domestic-premium-gasoline-prices-station-list/", "summary": "عرضه بنزین سوپر داخلی در ۸۴ جایگاه ۱۷ استان کشور آغاز شد و قیمت هر لیتر آن با توجه به محل تامین، بین ۱۰۳ تا ۱۱۰ هزار تومان تعیین شده است.", "date_str": "2026-11-11T17:00:00+00:00", "hash": "f95f3a935cbb3a60", "title_fa": "بنزین سوپر داخلی در کدام جایگاه‌ها عرضه می‌شود؟ قیمت و فهرست کامل", "summary_fa": "عرضه بنزین سوپر داخلی در ۸۴ جایگاه ۱۷ استان کشور آغاز شد و قیمت هر لیتر آن با توجه به محل تامین، بین ۱۰۳ تا ۱۱۰ هزار تومان تعیین شده است. تبلیغات هم‌زمان با انتشار فهرست جایگاه‌های عرضه‌کننده بنزین سوپر داخلی، اعلام شد که تاکنون ۲۲۸ جایگاه در کشور مجوز عرضه این فرآورده را دریافت کرده‌اند. از این تعداد، ۱۵۲ جایگاه قرارداد تأمین و عرضه امضا کرده‌اند و ۸۴ جایگاه نیز عرضه را آغاز کرده‌اند. قیمت هر لیتر بنزین سوپر داخلی، بر اساس توافق میان جایگاه عرضه‌کننده و پالایشگاه تأمین‌کننده، حدود ۱۱۰ هزار تومان تعیین شده است. بنزین سوپر در برخی مناطق نزدیک به پالایشگاه‌های جنوب کشور با قیمت هر لیتر ۱۰۳ هزار تومان نیز عرضه می‌شود. بنابراین، نرخ فروش در همه جایگاه‌ها یکسان نیست و به محل عرضه و شرایط تأمین بستگی دارد. در استان تهران دو جایگاه ثابت و هشت جایگاه سیار بنزین سوپر داخلی عرضه می‌کنند؛ به این ترتیب، شمار مراکز ثابت و سیار عرضه این سوخت در تهران به ۱۰ مورد می‌رسد. بلوار خلیج فارس، قبل از انبار نفت شهید سلیمانی انتهای بلوار شهید طباطبایی، نرسیده به میدان امام میدان کوثر، بلوار قاسم سلیمانی، بعد از چهارراه عطااحمدی سنندج، بلوار شهید سلیمانی، روبه‌روی استخر انتظام کمربندی غربی، سه‌راه جویبار، روبه‌روی دانشگاه علوم پزشکی سه‌راه خرمشهر، جاده قدیم اهواز–خرمشهر، روبه‌روی پمپ‌بنزین ۶۰ متری کیان خیابان کارگر، میدان وحدت، به طرف میدان مبارزان خیابان مفتح، چهارراه باغ‌میشه، نرسیده به میدان معجز کازرون، ابتدای جاده فراشبند، بلوار فردوسی جنوبی اتوبان جلال آل‌احمد، بعد از پل یادگار امام، جنب مجتمع تجاری پاسارگاد خیابان دماوند، بالاتر از سه‌راه تهرانپارس، نبش بن‌بست خانزیران لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری دلارام سلطانیان دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/fuel-6a9dbce7420fe43083953aed?w=1920&q=75", "category": "موسیقی و هنر", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۲۰:۳۰"}, {"source": "Business Insider", "title": "I raised 4 kids and thought I remembered how hard parenting was. A week with my grandkids proved me wrong.", "link": "https://www.businessinsider.com/grandmother-week-caring-grandkids-parenting-lessons-2026-11", "summary": "The author took care of her grandkids and remembered how hard it is to be a parent. Courtesy of the author I spent a week helping care for my 6-year-old grandson and 3-year-old granddaughter. School pickups, homework, and toddler tantrums reminded me how exhausting parenting can be. I loved every moment but appreciated being able to enjoy the kids without all the responsibility. Never underestimate the resoluteness of a 3-year-old. I was reminded of this — and several other things I'd forgotten about toddlers and parenting — when I spent a week with my son and his beautifully busy family, which includes a new rescue pup named Peaches. Because my kids span two generations — my son is about to be 41, and my youngest daughter just turned 21 — I'm a grandmother with two college-aged daughters. Fresh off an early morning flight , my son picked me up, and it was go-time for Grammy. He and his wife both work full-time and are fortunate to have grandparents nearby who provide afternoon day care for 6-year-old Landon and 3-year-old Sloan. When I visit, it gives them a break. I have to think about things I haven't thought of for decades Weekday afternoons mean pick-up from two different schools , and then, because Grammy can do whatever she wants, we stop for ice cream. The author remembered the stress of being a mom. Courtesy of the author Running around with little ones was a test for my middle-aged zen. The subconscious maternal checklists spark back to life. Is everyone buckled correctly? Do they have a snack? And then, because I like to have something to worry about at all times, I reviewed what I'd do if one of the kids were to choke while I'm driving. Things I haven't thought about in decades come into hyper focus . The specific patience required for dealing with young kids is a muscle I haven't exercised in months. When the newly potty-trained 3-year-old announces she has to go to the bathroom — and we're somewhere with no bathroom, it's back to the car to find one fast. We did. At Scoops, I threw caution to the wind and let them order \"Superman\" and \"Cotton Candy\" ice cream, which probably contained some kind of problematic food dye based on the bright colors. Back at home, I attempted to get a head start on Landon's first-grade homework before jiujitsu. I was happy to see that this involved 10 minutes of daily reading. \"Readers are leaders,\" I said to him half-seriously, secretly hoping the words would stick. He wanted to do anything but sit down, and he i", "date_str": "2026-11-11T17:10:01+00:00", "hash": "c8c77e49e4984985", "title_fa": "من 4 بچه بزرگ کردم و فکر می کردم یادم می آید که والدین چقدر سخت بود. یک هفته با نوه هایم ثابت کرد که اشتباه می کنم.", "summary_fa": "نویسنده از نوه هایش مراقبت کرد و به یاد آورد که پدر و مادر بودن چقدر سخت است. با حسن نیت نویسنده من یک هفته را صرف مراقبت از نوه 6 ساله و نوه 3 ساله خود کردم. پیکاپ های مدرسه، تکالیف و عصبانیت کودکان نوپا به من یادآوری کردند که والدین چقدر می تواند طاقت فرسا باشد. من هر لحظه را دوست داشتم، اما از اینکه می‌توانم بدون هیچ مسئولیتی از بچه‌ها لذت ببرم قدردانی می‌کردم. هرگز قاطعیت یک کودک 3 ساله را دست کم نگیرید. وقتی یک هفته را با پسرم و خانواده پرمشغله‌اش، که شامل یک توله نجات جدید به نام هلو می‌شود، گذراندم - و چندین چیز دیگر که در مورد کودکان نوپا و والدین فراموش کرده بودم - به یاد من افتاد. از آنجایی که فرزندان من دو نسل هستند - پسرم در آستانه 41 سالگی است و کوچکترین دخترم به تازگی 21 ساله شده است - من یک مادربزرگ با دو دختر دانشگاهی هستم. تازه از یک پرواز صبح زود، پسرم مرا سوار کرد و زمان گرمی فرا رسیده بود. او و همسرش هر دو به طور تمام وقت کار می کنند و خوش شانس هستند که پدربزرگ و مادربزرگی در نزدیکی خود دارند که مراقبت روزانه بعد از ظهر را برای لاندون 6 ساله و اسلون 3 ساله فراهم می کنند. وقتی بازدید می کنم، به آنها استراحت می دهد. من باید به چیزهایی فکر کنم که دهه‌ها به آن فکر نکرده‌ام بعدازظهرهای روزهای هفته به معنای بردن از دو مدرسه متفاوت است، و سپس، چون گرمی می‌تواند هر کاری که می‌خواهد انجام دهد، ما برای بستنی توقف می‌کنیم. نویسنده استرس مادر بودن را به یاد آورد. با حسن نیت نویسنده دویدن با بچه های کوچک آزمایشی برای ذن میانسال من بود. چک‌لیست‌های ناخودآگاه مادرانه به زندگی بازمی‌گردند. آیا همه به درستی کمانده", "image_url": "https://i.insider.com/6aea104b4b5ca383fe7cf1c7?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۲۰:۴۰"}, {"source": "Business Insider", "title": "Elon Musk's need for speed in everything he does is what sets him apart, a former Tesla exec says", "link": "https://www.businessinsider.com/elon-musk-tesla-move-fast-drove-success-says-ex-president-2026-11", "summary": "Elon Musk in 2016. Nora Tam/South China Morning Post via Getty Images A former Tesla president told \"The Knowledge Project\" how Elon Musk drove the carmaker's success. Jon McNeill said Musk wanted everything done as quickly as possible. This also showed in Musk's communication style, preferring 3-sentence emails. Elon Musk 's need for speed was key to Tesla's push toward the mass market, and what sets him apart from other CEOs, one of the company's former presidents said. \"The thing with Elon that separates him from other people is that a lot of people would be like, 'Oh, we'll do that next week.' No. It's like the timing is as fast as you can,\" Jon McNeill told \"The Knowledge Project\" podcast in Monday's episode. \"He believes that speed of all types — speed of decision-making , speed of cash through the business, speed of response time — creates competitive advantage, because your competitors are probably moving slower,\" he added. McNeill was Tesla's president of global sales, marketing, policy, and services from 2015 to 2018, before leaving to join rideshare platform Lyft as COO. He joined when the company was unprofitable, expanding its stores and charging network while preparing to launch the Model 3 — the more affordable EV that proved pivotal to Tesla's success. Musk's fixation on speed also showed through in his communication style. \"It has to be concise,\" McNeill said. The former Tesla exec recounted how Musk once came up with the idea of running the EV maker on three-sentence emails. For example, outline the problem in your first sentence, then suggest a solution, and then outline the next steps, such as requesting resources. \"It was really the key to communicating with him,\" McNeill said, adding that it showed he'd really thought about the solution and next steps before asking Musk. A second key was to give Musk bad news as quickly as possible so it could be addressed before it worsened. \"He said this to everybody, because bad news only gets worse with time,\" McNeill said. \"The way that you could get on his bad side was saving bad news.\" Read the original article on Business Insider", "date_str": "2026-11-11T17:09:20+00:00", "hash": "202dbe63bbe00ef9", "title_fa": "یکی از مدیران سابق تسلا می گوید: نیاز ایلان ماسک به سرعت در هر کاری که انجام می دهد همان چیزی است که او را متمایز می کند.", "summary_fa": "ایلان ماسک در سال 2016. نورا تام/مورنینگ پست چین جنوبی از طریق گتی ایماژ یک رئیس سابق تسلا به «پروژه دانش» گفت که ایلان ماسک چگونه موفقیت این خودروساز را به ارمغان آورد. جان مک نیل گفت ماسک می خواست همه چیز در اسرع وقت انجام شود. این در سبک ارتباطی ماسک نیز نشان داده شد و ایمیل‌های 3 جمله‌ای را ترجیح می‌داد. یکی از روسای سابق این شرکت گفت: نیاز ایلان ماسک به سرعت کلیدی برای حرکت تسلا به سمت بازار انبوه بود و چیزی که او را از سایر مدیران عامل متمایز می کند. چیزی که ایلان را از دیگران جدا می‌کند این است که بسیاری از مردم می‌گویند اوه، هفته آینده این کار را انجام خواهیم داد. جان مک نیل به پادکست «پروژه دانش» در قسمت دوشنبه گفت: نه. او افزود: \"او معتقد است که سرعت همه انواع - سرعت تصمیم گیری، سرعت نقدینگی از طریق کسب و کار، سرعت زمان پاسخگویی - مزیت رقابتی ایجاد می کند، زیرا رقبای شما احتمالا کندتر حرکت می کنند.\" مک نیل از سال 2015 تا 2018 رئیس بخش فروش، بازاریابی، سیاست و خدمات تسلا بود، قبل از اینکه به عنوان مدیر ارشد اجرایی به پلتفرم اشتراک سواری Lyft بپیوندد. او زمانی که شرکت بی‌سود بود، به آن ملحق شد و فروشگاه‌ها و شبکه شارژ خود را گسترش داد و در حین آماده‌سازی برای راه‌اندازی مدل 3 - خودروی برقی مقرون‌به‌صرفه‌تر که برای موفقیت تسلا مهم بود. توجه ماسک به سرعت در سبک ارتباطی او نیز آشکار شد. مک نیل گفت: «باید مختصر باشد. مدیر سابق تسلا توضیح داد که چگونه ماسک زمانی به ایده راه اندازی سازنده خودروهای الکتریکی روی ایمیل های سه جمله ای رسید. به عنوان مثال، در اولین جمله خود مشکل را مشخص کنید، سپس راه حلی پیشنهاد کنید و سپس مراحل بعدی مانند درخواست منابع را", "image_url": "https://i.insider.com/6af4895dcbe2120470734496?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۲۰:۳۹"}, {"source": "Business Insider", "title": "Nostalgia is paying off big for video game makers", "link": "https://www.businessinsider.com/gta-vi-legend-zelda-ocarina-time-world-warcraft-forever-sales-2026-11", "summary": "US gamers can start playing Grand Theft Auto VI on November 19. Vernon Yuen/Nexpher Images via Getty Images Nostalgia is proving lucrative for video game makers. \"The Legend of Zelda: Ocarina of Time\" and \"World of Warcraft: Forever\" debuted this month. Take-Two's CEO said preorder sales of \"Grand Theft Auto VI\" have exceeded his expectations. Gen X and millennial gamers might be feeling a heavy dose of deja vú right now. Major developers are leaning into nostalgia, releasing new video games this month from beloved, decades-old franchises. So far, it seems to be paying off. Blizzard Entertainment, owned by Microsoft, kicked it off on November 4 when it debuted \"World of Warcraft: Forever.\" The original \"World of Warcraft\" came out 22 years ago. Two days later, the company said the \"World of Warcraft: Forever\" launch made franchise history. Blizzard said the video game has been the largest launch in \"World of Warcraft\" history in terms of peak concurrent players and the highest number of returning players. Nintendo then released \"The Legend of Zelda: Ocarina of Time\" for Nintendo Switch 2 on November 5. This game is a full remake of the company's original 1998 version developed for the Nintendo 64. On Wednesday, Nintendo said the game set a record by selling more than 5.2 million units worldwide in the first four days. And who could forget \"Grand Theft Auto VI,\" the highly anticipated game by Rockstar Games, a subsidiary of Take-Two Interactive? Although the latest \"Grand Theft Auto VI\" doesn't hit shelves until November 19, fans have been clamoring for a copy since at least 2022, when a hacker leaked footage of the game, which was still in development at the time. Rockstar Games formally announced \"Grand Theft Auto VI\" in 2023. The last iteration of \"GTA\" was released in 2013, and the original came out in 1997. Despite the production delays , Take-Two Interactive CEO Strauss Zelnick told CNBC on Tuesday that preorder sales have \"vastly exceeded\" their expectations. \"The good news is it's our second biggest release in the history of the franchise,\" Zelnick said. \"And we expect it's going to be immensely successful and profitable.\" The success around the three games comes at a time when the video game industry is trying to win over customers even as rising hardware costs and semiconductor competition drive up prices. Read the original article on Business Insider", "date_str": "2026-11-11T17:05:46+00:00", "hash": "abc6c0c1ef34d5f6", "title_fa": "نوستالژی برای سازندگان بازی های ویدیویی سود زیادی دارد", "summary_fa": "گیمرهای آمریکایی می توانند بازی Grand Theft Auto VI را از 19 نوامبر شروع کنند. تصاویر Vernon Yuen/Nexpher از طریق Getty Images نوستالژی برای سازندگان بازی های ویدیویی سودآور است. «افسانه زلدا: اوکارینا زمان» و «جهان وارکرافت: برای همیشه» این ماه برای اولین بار به نمایش درآمد. مدیرعامل Take-Two گفت پیش‌فروش «Grand Theft Auto VI» فراتر از انتظارات او بوده است. Gen X و گیمرهای نسل هزاره ممکن است در حال حاضر دوز سنگینی از deja vú را احساس کنند. توسعه‌دهندگان بزرگ به نوستالژی متمایل شده‌اند و بازی‌های ویدیویی جدیدی را در این ماه از فرنچایزهای محبوب دهه‌ها عرضه می‌کنند. تا اینجای کار به نظر می رسد که نتیجه داده است. بلیزارد اینترتینمنت، متعلق به مایکروسافت، آن را در 4 نوامبر و با اولین نمایش \"World of Warcraft: Forever\" آغاز کرد. نسخه اصلی \"World of Warcraft\" 22 سال پیش منتشر شد. دو روز بعد، این شرکت گفت که راه اندازی \"World of Warcraft: Forever\" تاریخچه فرنچایز را ثبت کرد. بلیزارد گفت که این بازی ویدیویی از نظر تعداد بازیکنان همزمان و بیشترین تعداد بازیکنان بازگشته، بزرگترین عرضه در تاریخ \"World of Warcraft\" بوده است. نینتندو سپس \"افسانه زلدا: Ocarina of Time\" را برای نینتندو سوییچ 2 در 5 نوامبر منتشر کرد. این بازی یک بازسازی کامل از نسخه اصلی این شرکت در سال 1998 است که برای Nintendo 64 توسعه یافته بود. روز چهارشنبه، نینتندو گفت که این بازی با فروش بیش از 5.2 میلیون واحد در سراسر جهان در چهار روز اول رکوردی را به نام خود ثبت کرد. و چه کسی می‌تواند «Grand Theft Auto VI» را فراموش کند، بازی موردانتظار Rockstar Games، یکی از شرکت‌های تابعه Take-Two Interactive؟ اگرچه جدیدترین «Grand Theft Auto VI» تا 19 نوامبر وارد قفسه‌ها نمی‌شود، اما طرفداران حداقل از سال 2022 که یک هکر فیلمی از بازی را که هنوز در حال", "image_url": "https://i.insider.com/6af49800cbe21204707344e7?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Microsoft", "تراشه"], "datetime_fa": "۲۰ آبان • ۲۰:۳۵"}, {"source": "Business Insider", "title": "Nvidia slapped with rare Wall Street downgrade after Jensen Huang's affair", "link": "https://www.businessinsider.com/nvidia-stock-downgrade-wall-street-jensen-huang-affair-nvda-2026-11", "summary": "Sean Gallup/Getty Images Jensen Huang's affair with a suspected Chinese spy has roiled Nvidia's stock in recent days. Baird issued a rare downgrade for Nvidia on Wednesday, citing Huang as a key factor. Morgan Stanley removed Nvidia from its list of top stock picks, though its analysts remain bullish. Jensen Huang's affair has roiled Nvidia stock in recent days, and some analysts on Wall Street are starting to recalibrate their views in light of the scandal. Nvidia shares rallied on Wednesday after two days of losses stemming from news of Huang's relationship with a Chinese national suspected of being a spy. Analysts at Baird published a note issuing a rare downgrade, citing Huang's affair as a reason to doubt the outlook for the company and the stock. The firm downgraded Nvidia to Neutral from Buy, highlighting the controversy surrounding Huang's relationship with Alice Huang, an executive who has been employed by Singaporean data center firm Megaspeed. \"Downgrading to Neutral until uncertainties regarding U.S. government action likely resulting from the upcoming congressional hearing are lifted, U.S. government investigations reach their conclusions, revenue impact from risk channel near-term adjustments along with potential charges is quantified, and uncertainties around CEO tenure clear,\" Baird's Tristan Gerra wrote. The analyst slashed his price target for the stock from $500 to $200. Nvidia shares were trading as high as $176.27 on Wednesday. In Baird's view, the US government could respond by tightening export controls on advanced AI chips due to concerns about the \"Southeast Asia data center loophole,\" the idea that tech companies in China are able to access restricted Nvidia GPUs through business with companies in places like Singapore and Malaysia. \"We believe low-level shipping is taking place into Asia-based warehouses wit at West Point \"is one of the reasons we are a country.\" \"We were here for all four years of the Revolutionary War fighting for our independence, so we have great honor in that aspect,\" Bundt said. West Point is an active military post and college, but some parts of the campus are open to the public through guided tours. I visited West Point in April to learn more about its Revolutionary War history and its modern curriculum that equips soldiers for war. Take a look. West Point, located about 50 miles north of New York City, played a key role in keeping the British at bay during the Revolutionary War. A military map showing West Point in 1780. MPI/Getty Images West Point overlooks the Hudson River, which was the fastest and most reliable means of transporting troops, weapons, food, and other crucial supplies during the war. George Washington knew that controlling the river was key to America's survival in the fight against the British. He established his headquarters there, calling West Point \"the most important Post in America.\" In 1802, Congress authorized the establishment of the United States Military Academy at West Point. Sylvanus Thayer, known as the \"Father of the Military Academy,\" became the school's superintendent in 1817 and established a strict code of conduct, rigorous fitness standards, and a standardized curriculum. Famous graduates include Presidents Ulysses S. Grant and Dwight D. Eisenhower, former Chief of Staff of the US Army Douglas MacArthur, and former CIA directors David Petraeus and Mike Pompeo. Tours of the military academy begin at the Frederic V. M", "date_str": "2026-11-11T16:22:33+00:00", "hash": "297859892958f0e1", "title_fa": "من از وست پوینت بازدید کردم تا ببینم چگونه آکادمی نظامی نخبگان تاریخ را با آموزش مدرن ارتش ترکیب می کند. نگاهی به داخل بیندازید.", "summary_fa": "داخل کلیسای کادت در وست پوینت. Talia Lakritz/Business Insider West Point طولانی ترین تاسیسات نظامی مستقر در ایالات متحده است. همچنین آکادمی نظامی بسیار گزینشی ا مواره نیازمند صرف هزینه‌های چندهزار دلاری برای اجاره بالگرد و خدمه پرواز بوده است. پهپاد مورد بحث یک هواگرد عمودپرواز هیبریدی مجهز به هشت موتور برقی برای برخاست و فرود عمودی و یک موتور دو زمانه با سوخت سنگین برای حرکت افقی است. موتور دوم همان سوخت جت رایج در فرودگاه‌ها و پایگاه‌های نظامی را مصرف می‌کند و یک ژنراتور داخلی مداوم باتری‌ها را حین پرواز شارژ نگه می‌دارد؛ بنابراین نیازی به تعویض یا شارژ باتری بین مأموریت‌ها نیست. ۰:۰۰ / ۰:۰۰ لایک پهپاد اسکای‌ریچ با طول بال ۶٫۷ متر و محفظه‌ی بار ۱۹۸ لیتری، از بالا بارگیری می‌شود و دریچه‌ی زیرین آن امکان رهاسازی هوایی یا انتقال بار با کابل را بدون نیاز به نشستن فراهم می‌کند. اسکای‌ویز می‌گوید محصول جدیدش در بادهایی با سرعت ۴۰ نات (معادل ۷۴ کیلومتربرساعت) و بازه‌ی دمایی ۲۱- تا ۴۹ درجه‌ی سانتی‌گراد پایداری کامل دارد و با سبک‌ترین بار می‌تواند بیش از ۱۸ ساعت مداومت پروازی ثبت کند. حداکثر وزن برخاست هواگرد به ۱۶۳ کیلوگرم می‌رسد که شامل ظرفیت ترکیبی ۴۵ کیلوگرم برای سوخت و بار است. اگر محموله ۴٫۵ کیلوگرم باشد، برد به ۲٬۰۹۲ کیلومتر می‌رسد؛ اما حمل بار ۲۳ کیلوگرمی برد را به ۱٬۲۵۵ کیلومتر و بار ۳۶ کیلوگرمی برد پروازی را به ۴۵۰ کیلومتر با سرعت کروز ۱۳۰ کیلومتر بر ساعت کاهش می‌دهد. چارلز آکنین ، مدیرعامل اسکای‌ویز، گفت: «بلندپروازی ما استقرار شبکه‌ای متشکل از بیش از ۱٬۰۰۰ هواگرد خودران برای مشتریان دفاعی و تجاری ظرف پنج", "image_url": "https://api2.zoomit.ir/media/american-new-drone-flying-6af440ef1e22a6ae5bd3ec26?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۱۹:۳۰"}, {"source": "Google AI Blog", "title": "Try Tabletop: Customizable, collaborative spaces for groups to plan, play and do more together.", "link": "https://blog.google/innovation-and-ai/models-and-research/google-labs/tabletop/", "summary": "Tabletop is a new Google Labs experiment for group collaboration. Build interactive itineraries, polls, and brackets with your team. Join the waitlist.", "date_str": "2026-11-11T16:00:00+00:00", "hash": "e69b990f0917f7d7", "title_fa": "Tabletop را امتحان کنید: فضاهای قابل تنظیم و مشترک برای گروه ها برای برنامه ریزی، بازی و انجام کارهای بیشتر با هم.", "summary_fa": "Tabletop یک آزمایش جدید Google Labs برای همکاری گروهی است. با تیم خود برنامه های سفر، نظرسنجی و براکت های تعاملی بسازید. به لیست انتظار بپیوندید چه در حال برنامه‌ریزی یک سفر خانوادگی، برگزاری یک لیگ قهرمانان یا میزبانی از یک تیم بزرگ باشید، زمانی که همه می‌توانند در یک مکان شرکت کنند، بسازند و تصمیم بگیرند، هماهنگی به‌عنوان یک گروه آسان‌تر است. امروز، Tabletop را معرفی می‌کنیم، یک آزمایش جدید Google Labs که برای همکاری هم‌زمان ساخته شده است. فقط پیوندها، فایل‌ها و ایده‌های خود را اضافه کنید، سپس @tabletop را درخواست کنید - یا یک الگوی شروع انتخاب کنید - تا برنامه‌های سفر تعاملی سفارشی، نظرسنجی‌های شام، تقسیم‌کننده هزینه‌ها و براکت‌های مسابقات را ایجاد کنید. هنگامی که فضای شما آماده شد، پیوند دعوت را در چت گروهی خود رها کنید تا به همه اجازه دهید به طور همزمان وارد شوند و از آن استفاده کنند، مانند Google Doc. Tabletop در ایالات متحده (18+) از طریق لیست انتظار عرضه می شود. یک صندلی بکشید و در labs.google/tabletop ثبت نام کنید.", "image_url": "https://storage.googleapis.com/gweb-uniblog-publish-prod/images/labs_tabletop_blog_image_2784x1566.max-1440x810.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲۰ آبان • ۱۹:۳۰"}, {"source": "Business Insider", "title": "Google is letting staff test a 'fast' new Gemini AI model named Hydrogen", "link": "https://www.businessinsider.com/google-hydrogen-test-new-gemini-4-flash-model-ai-2026-11", "summary": "Google CEO Sundar Pichai. Finn Gomez/Getty Images Google has been testing what it calls a \"fast\" Gemini 4 Flash model internally, named Hydrogen. The company just launched Carbon, which it says is its most capable model yet. Google offers other Flash models for free in its Gemini app. Google's Gemini 4 era is fully in its element. Following the release of its Gemini 4 Argon and Carbon models, Google has been internally testing a new model that is designed for speed and efficiency. The new model is known internally as Hydrogen, according to an internal message seen by Business Insider. In a message to staff this week, a Google engineer described Hydrogen as \"very capable, fast and efficient.\" Staff were given access to Hydrogen in Google's internal development platform, known as Jetski, which often pre-empts a public launch. An employee who has used Hydrogen described it to Business Insider as akin to Google's previous Flash models , which are positioned as workhorse models designed to be faster and more cost-effective than models like Argon. As the lightest element in the periodic table, Hydrogen would be a fitting name. After Google delayed and then ultimately canceled the release of Gemini 3.5 Pro earlier this year, many considered the company to have fallen behind in the race for the most advanced AI models, known as the frontier. Google has since roared back to life with the launch of its Gemini 4 family. On Tuesday, it announced the rollout of its latest frontier model, Gemini 4 Carbon, which it says is strongest for cybersecurity and long-horizon tasks that require multiple steps. However, both Carbon and Argon are currently limited to paying users. It's not immediately clear whether Hydrogen, if released, would be a paid or free offering. Google offers other Flash models for free in its Gemini app. It also comes as competition between the top AI companies continues heating up. On Monday, Anthropic announced new models in its Fable and Mythos lines that it said were more capable at finding cybersecurity flaws and designing physical hardware. Google declined to comment on the record. Have something to share? Contact this reporter via email at hlangley@businessinsider.com or Signal at hughlangley.01. Use a personal email address and a non-work device; here's our guide to sharing information securely . Read the original article on Business Insider", "date_str": "2026-11-11T16:08:13+00:00", "hash": "b31d4d4cc2c0abec", "title_fa": "گوگل به کارکنان اجازه می‌دهد تا یک مدل جدید هوش سیاه در حال حاضر به پایین‌ترین قیمت‌های سال رسیده است، که منجر به کاهش 43 درصدی روی تخت‌خواب‌های جایگزین Bedsur Down می‌شود - یک کالای اصلی مقرون به صرفه که من شخصاً روی هر تخت در خانه‌ام نگه می‌دارم. خواه برای زمستان به یک روتختی شیک و سنگین نیاز داشته باشید یا برای جلوگیری از تعریق شبانه به یک لحاف قابل تنفس", "image_url": "https://i.insider.com/6af37470a96052a81c3499b6?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۱۹:۳۲"}, {"source": "Business Insider", "title": "We've spent 10 years living between a sailboat and campervan. People ask us a lot of questions about hygiene and space.", "link": "https://www.businessinsider.com/common-questions-living-between-van-and-boat-hygeine-relationships-answers-2026-11", "summary": "By splitting our time living between a campervan and a sailboat, we ve been able to go on a lot of adventures over the past several years. Courtesy of Kristin Hanes My partner and I have spent the past decade living between a sailboat and a campervan. People ask us a lot of questions about our nomadic lifestyle . No, we don't get sick of each other. I shower every day, either at my gym or with a portable unit. And I do often miss living in a house. My partner and I have lived on sailboats and in vehicles for 10 years, an idea that's unfathomable to many people. They worry about things like getting along with their partner in such a small space, where to go to the bathroom, and the complexity of a life without structure or plans. And I get it. While there are more stories in the media of people choosing an untraditional path over a 9-to-5 and a mortgage, people like us are still the minority. Our first foray into vehicle living was a Toyota Prius in 2015 to avoid steep rent in the San Francisco Bay Area, and we now split our time between a Sprinter campervan in the US during the summer months and a sailboat in Mexico all winter. Here are the most common questions we get about our lifestyle, answered. How do you shower? To shower on our sailboat, we boil seawater. Courtesy of Kristin Hanes One misconception about van lifers is that we're dirty and don't shower often. Maybe that's true of some of us, but not me. I take a shower every day, either by heating water on my camp stove and pouring it into a solar shower (a portable system that heats water with sunlight) or by stopping at my gym, Planet Fitness. Our van carries 27 gallons of water, so plenty for brief military-style showers, where you conserve water by keeping it off while you apply soap and shampoo. If I absolutely can't have a shower for whatever reason, I will do a washcloth bath inside the van to get the dirt off before bed. Our sailboat has an entire bathroom where we shower, typically using a solar shower that we hang up on a hook. We boil seawater and take saltwater showers, and my hair has never felt better! Where do you go to the bathroom? Our campervan doesn t have its own bathroom. Courtesy of Kristin Hanes If I could get a penny for every time I've heard this question, I'd be rich. Strangers have even walked up to us in parking lots asking us about our bathroom situation, which is awkward to say the least. Here's the truth: We don't have a bathroom in our campervan. It grosses me out too ", "date_str": "2026-11-11T15:40:01+00:00", "hash": "ec72ecc016a84b2d", "title_fa": "ما 10 سال را بین یک قایق بادبانی و یک کمپرون زندگی کرده ایم. مردم از ما سوالات زیادی در مورد بهداشت و فضا می پرسند.", "summary_fa": "با تقسیم زمان زندگی‌مان بین یک کمپرون و یک قایق بادبانی، ما توانسته‌ایم در چند سال گذشته به ماجراجویی‌های زیادی بپردازیم. با حسن نیت از کریستین هانس، من و شریک زندگیم دهه گذشته را بین یک قایق بادبانی و یک کمپرون زندگی کرده ایم. مردم از ما سوالات زیادی در مورد سبک زندگی عشایری ما می پرسند. نه، ما از همدیگر بد نمی شویم. من هر روز دوش می‌گیرم، یا در باشگاه ورزشی خود یا با یک واحد قابل حمل. و من اغلب دلم برای زندگی در یک خانه تنگ می شود. من و شریکم به مدت 10 سال در قایق های بادبانی و وسایل نقلیه زندگی کرده ایم، ایده ای که برای بسیاری از مردم غیرقابل درک است. آنها نگران چیزهایی مانند کنار آمدن با شریک زندگی خود در چنین فضای کوچکی، محل دستشویی رفتن و پیچیدگی یک زندگی بدون ساختار یا برنامه هستند. و من آن را دریافت می کنم. در حالی که داستان های بیشتری در رسانه ها وجود دارد که مردم یک مسیر غیر سنتی را به جای 9 به 5 و وام مسکن انتخاب می کنند، افرادی مانند ما هنوز در اقلیت هستند. اولین تلاش ما برای زندگی با وسایل نقلیه، تویوتا پریوس در سال 2015 بود تا از اجاره شدید در منطقه خلیج سانفرانسیسکو اجتناب کنیم، و اکنون زمان خود را بین یک کمپرون اسپرینتر در ایالات متحده در طول ماه های تابستان و یک قایق بادبانی در مکزیک در تمام زمستان تقسیم می کنیم. در اینجا متداول ترین سؤالاتی است که در مورد سبک زندگی خود دریافت می کنیم و به آنها پاسخ داده شده است. چطوری دوش میگیری؟ برای دوش گرفتن روی قایق بادبانی خود، آب دریا را می جوشانیم. با حسن نیت از کریستین هانس یک تصور غلط در مورد محکومان ون این است که ما کثیف هستیم و اغلب دوش", "image_url": "https://i.insider.com/6ae8e4288bd5d6547af34c3b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۱۹:۱۰"}, {"source": "Business Insider", "title": "Amanda Seyfried made my words about divorce go viral. Here's why I want divorce to be boring.", "link": "https://www.businessinsider.com/divorce-quote-went-viral-amanda-seyfried-normalize-make-boring-2026-11", "summary": "The author said she s been working to normalize divorce in the years since she separated from her husband. Courtesy of Alexandria Mooney Photography via Olivia Howell. Over the weekend, actor Amanda Seyfried shared something I wrote on her Instagram Stories. It was about normalizing divorce, which is something I've been working on for years. As a parent, I want my kids to know that adults can change their mind and their lives, and that's OK. Whenever divorce comes up in conversation, everybody seems to raise their eyebrows. People want to know what happened, who did what, and whose fault it was. We treat a marriage ending like a mystery to solve. Interestingly enough, this does not happen just for celebrities; ordinary people get the side-eye, too. On Sunday, actor Amanda Seyfried shared something that I wrote last year on her Instagram Stories. I was thrilled she shared my work, of course. But it was the words she chose to share that caught people's attention, and one word in particular: boring . I'd written those words while reflecting on my own divorce and my family's history. My parents are divorced. Both sets of my grandparents were divorced. I grew up in a family where divorce was absolutely normal, yet society still treated it like a scandal or a failure. I think it's high time we reframe divorce as just another life transition. As I wrote in the post she shared, \"The most radical thing we can do is make divorce boring. Make it normal. Make it accessible.\" View this post on Instagram A post shared by Olivia March Howell (@oliviahowell) Seyfried then shared a photograph of herself embracing Thomas Sadoski, the father of her children, from whom she announced her separation in September. She tagged him, too. By Monday morning, my words were appearing across celebrity news outlets . Seyfried was making headlines for normalizing divorce , something I've championed for five years through Fresh Starts Registry, which I co-founded with my sister. Yet amid the excitement, I kept thinking about the two people I most want to understand why this matters: my sons. Divorce allowed a different kind of childhood When my divorce was finalized in 2020, my boys were 4 and 7. I worried that the end of my marriage would become the defining tragedy of their childhood. Despite growing up around divorce, I'd still absorbed the cultural message that a family became \"broken\" when a marriage ended. My sons are now 10 and 13. We live upstairs in my childhood home, with my moth", "date_str": "2026-11-11T15:28:38+00:00", "hash": "27a95fcfe5dfa46f", "title_fa": "آماندا سیفرید باعث شد حرف ه be the most anticipated game of all time. It's been 13 years since Rockstar dropped GTA 5 , and after years of rumors, leaks, and official announcements, the sixth mainstream installment in the series is nearly here. In fact, anyone who pre-ordered the game digitally can now pre-load it onto their console, if you want to ensure you're ready to play the second the game comes out. Now, few of us will buy a game console specifically for GTA 6 unless you don't already have a current-generation PlayStation or Xbox. (The PC version of the game isn't expected until at least early 2027.) But, as it turns out, there's one specific console that can run GTA 6 better than the rest. The PS5 Pro is apparently the best way to experience \"GTA 6\" Rockstar confirmed as much in a post on Tuesday , which was meant to spread the news about pre-loading the game. But, interestingly, it spurred a discussion about the performance of the game itself, as well as which consoles are best to run it. No matter which console you play GTA 6 on, Rockstar says that the game will only target 30 fps (frames per second). That's decided slow for a mainstream game in 2026. GTA 5 also shipped at 30 fps in 2013, but newer consoles can run it at higher frame rates. In fact, most games that launch on the latest generation of consoles can run at 60 fps, if not higher. While it's certainly not a dealbreaker, it is interesting that Rockstar's latest game can't run at a faster frame rate even on the PS5 Pro or the Xbox Series X. To that point, Rockstar called out the PS5 Pro specifically in its post, announcing, \"The PlayStation 5 Pro offers breathtaking visuals, with improved clarity through PlayStation Spectral Super Resolution (PSSR) and ray-traced shadows only available on PlayStation 5 Pro.\" PSSR is Sony's AI upscaler, similar to options like DLSS from Nvidia, which uses AI to add extra graphical information to games in real time. That allows developers like Rockstar to run the game at a lower resolution and two nights at the senior-living facility , sleeping in the guest suite and meeting some of the residents. The campus, which is about an hour outside of Seattle, is made up of 228 units, which range from independent and assisted living arrangements to a secure memory-care section. Jody and I toured the first-floor independent-living apartments, which had tall ceilings and large windows. The natural light streamed in, and the view of the surrounding area was impressive. Each apartment had its own laundry room and a large kitchen with an island. In fact, the space was even better than my apartment back in California. Plus, I was impressed by the amenities, like a fitness room, a theater, a beauty salon, two dining rooms, and general activities. What really sold me, though, was getting to meet some of the other residents. While relaxing in the library, I actually met a woman from my hometown in Iowa who was 12 years older than me. We were mutua", "date_str": "2026-11-11T14:57:01+00:00", "hash": "01b77341f89e09b1", "title_fa": "من قسم خوردم که هرگز در یک جامعه سالمندان زندگی نخواهم کرد. من در 83 سالگی وارد این دانشگاه شدم و زندگی من پر جنب و جوش تر از همیشه است.", "summary_fa": "من هرگز نمی خواستم به یک مرکز زندگی مستقل نقل مکان کنم، اما پس از چهار سال اینجا، آن را دوست دارم. Rochelle Linick من هرگز نمی خواستم به یک جامعه سالمندان نقل مکان کنم، اما اکنون که اینجا هستم، در حال پیشرفت هستم. این روزها، من یک آپارتمان عالی، یک زندگی اجتماعی فعال و دوستان زیادی دارم. اکنون چهار سال از مهاجرتم می گذرد و زندگی من پر جنب و جوش تر از همیشه به نظر می رسد. در 83 سالگی، هرگز فکر نمی کردم که دوباره نقل مکان کنم. من قبلاً کوچک شده بودم، خانه ام را در لس آنجلس فروختم تا نزدیک دختر کوچکترم جودی باشم و زندگی جدیدی را در آپارتمانی در منطقه شرقی خلیج شروع کردم. زندگی خوب بود اما وقتی جودی به من گفت که او و همسرش قصد دارند خانه خود را بفروشند و به واشنگتن نقل مکان کنند، شگفت زده شدم. او توضیح داد که آنها در حال ساختن خانه ای در یک جامعه بالای 55 نفر خواهند بود - و این خانه فقط یک مایل ا
