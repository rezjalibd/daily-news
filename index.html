_fa": "مایکروسافت دو مدل جدید را به گیت‌هاب کوپایلت اضافه کرد؛ مدل‌هایی که با هزینه‌ی نسبتا کم، عملکردی خیره‌کننده ارائه می‌دهند. تبلیغات مایکروسافت با معرفی دو مدل جدید هوش مصنوعی ، رقابت خود با اوپن‌ای‌آی و آنتروپیک را در حوزه‌ی برنامه‌نویسی جدی‌تر کرد. مدل‌های MAI Code 2 و MAI Code 2 Flash برای انجام وظایف مختلف توسعه‌ی نرم‌افزار طراحی شده‌اند و از امروز در گیت‌هاب کوپایلت (GitHub Copilot) در دسترس کاربران واجد شرایط قرار دارند. مدل MAI Code 2 برای پروژه‌های پیچیده‌تر، از رفع خطاهای دشوار گرفته تا اعمال تغییرات در فایل‌های متعدد، توسعه یافته است. در مقابل، MAI Code 2 Flash روی وظایف روزمره با حجم بالا و هزینه‌ی کمتر تمرکز دارد. مایکروسافت می‌گوید مدل‌های جدید می‌توانند به‌جای تولید صرف کد، در فرایندهای چندمرحله‌ای توسعه‌ی نرم‌افزار مشارکت کنند؛ برای مثال، بخش‌های مرتبط یک پروژه را پیدا کنند، تغییرات لازم را اعمال کنند و نتیجه را بررسی کنند. یکی از مهم‌ترین ویژگی‌های این نسل، هزینه‌ی پایین آن در مقایسه با مدل‌های رقیب است. کپی لینک تفاوت MAI Code 2 و MAI Code 2 Flash چیست؟ مایکروسافت دو مدل جدید را برای نیازهای متفاوت برنامه‌نویسان طراحی کرده است. مدل MAI Code 2 گزینه‌ی قدرتمندتر خانواده محسوب می‌شود و برای وظایفی مناسب است که به بررسی بخش‌های متعدد یک پروژه یا انجام تغییرات پیچیده نیاز دارند. این مدل می‌تواند در شناسایی و برطرف‌کردن خطاهای عمیق، بازنویسی ساختار کد، توسعه‌ی قابلیت‌های جدید و تحلیل ارتباط میان فایل‌های یک مخزن نرم‌افزاری به برنامه‌نویسان کمک کند. همچنین مایکروسافت تأکید می‌کند که MAI Code 2 برای تولید کد قابل‌استفاده در محصولات نهایی بهینه شده است؛ یعنی هدف، پیشنهاد تغییراتی است که توسعه‌دهندگان بتوانند پس از بررسی، آن‌ها را وارد پروژه‌ی اصلی کنند. درنتیجه، برنامه‌نویسان می‌توانند بسته به پیچیدگی کار و محدودیت هزینه، یکی از دو مدل را انتخاب کنند.", "image_url": "https://api2.zoomit.ir/media/microsoft-ai-programming-code-6afcaf612314debea39c0e71?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Microsoft"], "datetime_fa": "۲۶ آبان • ۲۳:۲۵"}, {"source": "Zoomit", "title": "مدل‌های GPT-6.2 Astra و Sol معرفی شدند؛ هوش مصنوعی قوی‌تر با هزینه کمتر", "link": "https://www.zoomit.ir/ai-articles/471370-openai-gpt-6-2-astra-sol-launch-pricing-benchmarks/", "summary": "اوپن‌ای‌‌آی مدل‌های GPT-6.2 Astra و Sol را معرفی کرد؛ دو هوش مصنوعی قدرتمندتر و کم‌هزینه‌تر که برای پروژه‌های حرفه‌ای و کارهای روزمره طراحی شده‌اند.", "date_str": "2026-11-17T19:35:41+00:00", "hash": "c812d79a30bcfb47", "title_fa": "مدل‌های GPT-6.2 Astra و Sol معرفی شدند؛ هوش مصنوعی قوی‌تر با هزینه کمتر", "summary_fa": "اوپن‌ای‌‌آی مدل‌های GPT-6.2 Astra و Sol را معرفی کرد؛ دو هوش مصنوعی قدرتمندتر و کم‌هزینه‌تر که برای پروژه‌های حرفه‌ای و کارهای روزمره طراحی شده‌اند. تبلیغات شرکت OpenAI در بیانیه‌ای مطبوعاتی ، دو مدل هوش مصنوعی GPT-6.2 Astra و GPT-6.2 Sol را معرفی کرد. مدل نخست، پرچم‌دار جدید این شرکت برای انجام وظایف پیچیده و تخصصی است؛ درحالی‌که مدل دوم برای کارهای عمومی‌تر طراحی شده و تلاش می‌کند عملکردی نزدیک به مدل‌های قدرتمند را با هزینه‌ی بسیار کمتر ارائه دهد. براساس اطلاعیه‌ی رسمی OpenAI، نسل جدید مدل‌های GPT-6.2 در ساخت اسناد حرفه‌ای، برنامه‌نویسی، تحلیل داده‌های علمی، طراحی وب‌سایت و انجام فرایندهای چندمرحله‌ای پیشرفت کرده‌اند. یکی از تفاوت‌های مهم نسل جدید با مدل‌های قبلی، افزایش بهره‌وری در تولید پاسخ است. اوپن‌ای‌آی می‌گوید مدل‌های تازه برای انجام بسیاری از وظایف به توکن‌های خروجی کمتری نیاز دارند؛ موضوعی که می‌تواند هزینه‌ی استفاده از API را کاهش دهد و به کاربران اشتراکی اجازه دهد با سقف مصرف خود، کارهای بیشتری انجام دهند. هم‌زمان، هزینه‌ی استفاده از GPT-6.2 Astra در API نیز کاهش یافته است. قیمت توکن‌های ورودی و خروجی این مدل ۲۰ درصد کمتر از GPT-6 Astra است و ورودی‌های ذخیره‌شده در حافظه‌ی موقت با تخفیف بیشتری محاسبه می‌شوند. کپی لینک تفاوت GPT-6.2 Astra و GPT-6.2 Sol چیست؟ شرکت OpenAI دو مدل جدید را برای نیازهای متفاوتی توسعه داده است. GPT-6.2 Astra قدرتمندترین مدل جدید این شرکت برای انجام پروژه‌های حرفه‌ای و پیچیده محسوب می‌شود. این مدل برای کارهایی طراحی شده است که به استدلال چندمرحله‌ای، استفاده از ابزارهای مختلف و تولید خروجی‌های دقیق نیاز دارند. برای مثال، Astra می‌تواند اطلاعات چندین سند را بررسی کند، یک فایل اکسل مال ع در شهر کرول فرانسه تولید می‌شود. راه‌اندازی خطوط تولید جدید در آستین، نخستین گام جدی برای بومی‌سازی ساخت یکی از کلیدی‌ترین قطعات شبکه‌ی ماهواره‌ای استارلینک در خاک ایالات متحده به‌شمار می‌رود. تراشه‌ی STM32V8 با همکاری مشترک مهندسان سامسونگ و اس‌تی‌مایکروالکترونیکس توسعه یافته است و نقشی اساسی در برقراری پیوندهای لیزری بین ماهواره‌ها ایفا می‌کند. مایکل نیکولز ، نایب‌رئیس بخش مهندسی استارلینک در اسپیس‌ایکس، گفت: «قدرت پردازشی و حافظه‌ی تعبیه‌شده در این تراشه برای پاسخ‌گویی به الزامات سنگین پردازش بلادرنگ اهمیت فراوانی دارند.» مدیران سامسونگ در واکنش به گزارش‌ها اعلام کرده‌اند که امکان تأیید رسمی قراردادهای منعقدشده با مشتریان انفرادی وجود ندارد، با این حال داده‌های منابع آگاه از نهایی‌شدن برنامه‌های توسعه حکایت دارند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/samsung-store-front-sign-6a7ec18af25fc38542d6214a?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["تراشه", "سرمایه‌گذاری"], "datetime_fa": "۲۶ آبان • ۲۲:۳۰"}, {"source": "Business Insider", "title": "Salesforce sets AI budgets after employees spent 'thousands of dollars per month on tokens,' memo says", "link": "https://www.businessinsider.com/salesforce-sets-monthly-ai-token-budgets-up-to-1-000-2026-11", "summary": "Salesforce CEO Marc Benioff. Benjamin Fanjoy/Getty Images Salesforce is setting AI budgets for employees. Some spent thousands per month on tokens last quarter, according to an internal memo. Other companies have introduced similar spending limits to rein in climbing AI costs. Salesforce is setting AI budgets for employees after some spent thousands per month on tokens last quarter, according to an internal memo viewed by Business Insider. \"Starting this month, every role has a monthly token budget, so we can focus our AI spend on the work that matters most for our customers and business,\" Salesforce Chief Operating Officer wing limits. Trump's repayment overhaul would allow 11 programs to qualify for the higher $200,000 borrowing cap. The bill calls for excluded programs, like advanced nursing, to qualify for the higher limit. Democratic lawmakers are pushing to expand access to higher student-loan borrowing limits . On Tuesday, Sens. Kirsten Gillibrand and Jeff Merkley introduced a bill that would expand the number of advanced degrees that qualify for a professional degree designation and thus a higher borrowing cap. President Donald Trump's student-loan repayment overhaul placed a $100,000 lifetime borrowing cap on graduate degrees and a $200,000 cap on professional degrees. The administration also planned to limit professional degrees to 11 programs, such as medicine and law, while excluding other programs like nursing, social work, and education. The limits were met with criticism by both Democratic and Republican lawmakers who argued that limiting borrowing for nurses would exacerbate the healthcare worker shortage. A lawsuit blocked the administration from implementing the new limits on July 1, and the Democratic lawmakers are now seeking to codify professional status for an expanded list of degrees . \"Nurses, teachers, and social workers are dedicated public servants, and Congress must do everything it can to help recruit the next generation of these heroes,\" Merkley said in a statement. \"We're already facing a shortage of these critical workers, and new limits on federal student loans for these professions and others threaten to further jeopardize the future of our workforce.\" The bill would maintain professional status for programs that already qualify while restoring professional status to additional programs, including nursing, public health, and physician assistant programs. It would also give the education secretary the flexibility to add more programs that meet the \"professional degree\" requirements. It follows a bipartisan bill earlier this year that called for th لاقه ما را می‌سازد و چندین مدل قبل از جمعه سیاه تخفیف‌های اولیه دریافت می‌کنند. اگرچه فروش به طور رسمی تا 27 نوامبر آغاز نمی شود، اما می توانید در حال حاضر صرفه جویی زیادی در اپل واچ ها، از جمله سری 12 کاملاً جدید، که به تازگی در ماه سپتامبر وارد فروشگاه ها شده است، داشته باشید. در حال حاضر، اپل واچ سری 12 با 70 دلار تخفیف برای مدل های 42 میلی متری و 46 میلی متری به پایین ترین سطح خود رسیده است. گزینه 42 میلی متری به 329 دلار و اندازه 46 میلی متر به 379 دلار کاهش می یابد. سری 12 جدیدترین ساعت هوشمند میان رده اپل است که دارای حسگر ضربان قلب بهبودیافته، تراشه سریعتر و ویژگی های جدید هوش صوتی است که در سری 11 قدیمی وجود ندارد. می توانید در بررسی کامل اپل واچ سری 12 بیشتر بدانید. اپل واچ SE 3 مقرون به صرفه تر نیز به فروش می رسد. این مدل پایه فاقد برخی از ویژگی‌های پیشرفته‌تر سلامت و هوش مصنوعی سری 12 است، اما اصول اولیه را با قیمت مقرون‌به‌صرفه‌تری پوشش می‌دهد. اندازه 40 میلی متری با قیمت 199 دلار به فروش می رسد و اندازه 44 میلی متری به 229 دلار کاهش می یابد. هر دو با کمترین قیمت هایی که تا به حال به دست آورده اند مطابقت دارند. برای جزئیات بیشتر، بررسی کامل Apple Watch SE 3 ما را بخوانید. ما همه آخرین معاملات جمعه سیاه اپل واچ را از طریق رویداد اصلی در 27 نوامبر دنبال خواهیم کرد، بنابراین مطمئن", "image_url": "https://i.insider.com/6afc6b725aab055bb64428ad?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple", "تراشه"], "datetime_fa": "۲۶ آبان • ۲۰:۴۵"}, {"source": "Business Insider", "title": "Disney+ and Hulu are fully unifying by the end of the year", "link": "https://www.businessinsider.com/disney-hulu-app-streaming-strategy-josh-damaro-2026-8", "summary": "Hulu is merging with Disney+ under CEO Josh D Amaro. Jeremy Moeller/GC Images; Aurore Marechal/Getty Images Hulu's features will be fully integrated into Disney+ by the end of the year. This project, known internally as Project Gemini, has been in the works for years. The unified streaming experience is part of CEO Josh D'Amaro's plan to build a super app. The Hulu-Disney+ marriage is happening right on schedule. Disney's plan to fully unify its streamers \"is nearly complete\" and will be finalized in December, the company told investors on Tuesday. It could be the beginning of the end for a stand-alone Hulu app, though Disney hasn't said when the current Hulu app would be discontinued or what will happen to the beloved Hulu brand. This initiative, known internally as \"Project Gemini,\" was scheduled to be finished by the end of 2026, Business Insider reported in May. In the coming weeks, the Disney+ app is getting its last Hulu-specific features, including the ability to watch live TV and add-on streamers for users with qualifying subscriptions. Disney has spent years integrating Hulu's content and features into its namesake streamer in an effort to lift engagement and reduce cancellations. Merging the streamers can create \"a more seamless way to discover and engage with the breadth of content across our brands and franchises,\" Disney said in its shareholder letter as it shared earnings . The decision to move Hulu fully onto Disney+ may make the stand-alone Hulu app obsolete. An internal document obtained by Business Insider in May said that \"the Hulu tech stack and app will be decommissioned after all users have transitioned\" to Disney+, though it didn't specify exactly when that would happen. A Disney streaming town hall presentation in early November said that \"One App Milestones\" are expected to last through the company's fiscal fourth quarter, which spans early July to early October. The slide deck referenced Project Gemini, but didn't list the \"One App Milestones\" or explain the implications of completing them. How Hulu fits into the super app strategy Putting Hulu and Disney+ under one roof is part of CEO Josh D'Amaro's plan of building a super app where streaming subscribers can play games and buy merchandise without leaving the app. Disney's ambition is \"to connect Disney+ more closely with the whole company,\" D'Amaro said on Tuesday's earnings call. \"That means our parks, our cruise ships, merchandise, and games.\" This all-in-one experience will b", "date_str": "2026-11-17T17:12:29+00:00", "hash": "6ea0b6ea1047cd31", "title_fa": "Disney+ و Hulu تا پایان سال کاملاً متحد می شوند", "summary_fa": "Hulu در حال ادغام با دیزنی پلاس تحت مدیریت جاش دی آمارو است. Jeremy Moeller/GC Images; Aurore Marechal/Getty Images ویژگی های Hulu تا پایان سال به طور کامل در Disney+ ادغام خواهند شد. این پروژه که در داخل با نام Project Gemini شناخته می شود، سال هاست که در حال انجام است. تجربه پخش یکپارچه بخشی از برنامه مدیرعامل جاش دامارو برای ساخت یک برنامه فوق العاده است. ازدواج Hulu-Disney+ دقیقاً طبق برنامه انجام می شود. این شرکت روز سه شنبه به سرمایه گذاران گفت که طرح دیزنی برای یکپارچه سازی کامل استریمرهای خود \"تقریباً کامل است\" و در ماه دسامبر نهایی خواهد شد. این می تواند آغاز پایان یک برنامه مستقل Hulu باشد، اگرچه دیزنی نگفته است که برنامه فعلی Hulu چه زمانی متوقف می شود یا چه اتفاقی برای برند محبوب Hulu خواهد افتاد. به گزارش بیزینس اینسایدر در ماه می، این ابتکار که در داخل به عنوان \"پروژه جمینی\" شناخته می شود، قرار بود تا پایان سال 2026 به پایان برسد. در هفته‌های آتی، اپلیکیشن دیزنی پلاس آخرین ویژگی‌های ویژه Hulu خود را دریافت می‌کند، از جمله امکان تماشای تلویزیون زنده و پخش‌کننده‌های الحاقی برای کاربران دارای اشتراک واجد شرایط. دیزنی سال‌ها برای ادغام محتوا و ویژگی‌های Hulu در استریمر همنام خود در تلاش برای افزایش تعامل و کاهش لغو صرف شده است. دیزنی در نامه سهامداران خود هنگام تقسیم درآمد گفت: ادغام پخش‌کننده‌ها می‌تواند \"روشی بی‌نظیرتر برای کشف و تعامل با وسعت محتوا در برندها و امتیازات ما ایجاد کند.\" تصمیم به انتقال کامل Hulu به دیزنی + ممکن است برنامه مستقل Hulu را منسوخ کند. یک سند داخلی که توسط Business Insider در ماه مه به دست آمد، گفت که «پشته فناوری Hulu و برنامه پس از انتقال همه کاربران به دیزنی پلاس از کار می‌افتد، اگرچه دقیقاً مشخص نکرد که چه زمانی این اتفاق", "image_url": "https://i.insider.com/6a90815279f11f0a89f91bb3?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "t گیگابایت فضای ذخیره‌سازی، سازگاری با Google Play و داده‌های تلفن همراه هنگام قرار دادن سیم‌کارت (اگرچه دستگاه Viwoods Boox one را بهتر انجام می‌دهد: همچنین یک تلفن مخفی است.) همچنین دارای ادغام‌های هوش مصنوعی زیادی است، اگر دوست دارید. (اگر فقط می خواهید از آن برای خواندن کتاب های آمازون، بارنز نوبل و هر منبع دیگری که دوست دارید استفاده کنید، می توانید آن را نادیده بگیرید.) این در حال حاضر مقرون به صرفه ترین گزینه شما برای یک کتابخوان الکترونیکی با ضریب فرم گوشی است. اگر یکی از تصمیم‌های سال نو شما این است که زمان زیادی را در رسانه‌های اجتماعی سپری نکنید، یک", "image_url": "https://lifehacker.com/imagery/articles/01M7NDD1KMD3CVRJJWBNDSDCTE/hero-image.fill.size_1200x675.png", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Apple", "امنیت سایبری"], "datetime_fa": "۲۶ آبان • ۲۲:۵۷"}],
      media: [{"source": "Billboard", "title": "U.K. Labels Veteran Ferdy Unger-Hamilton Joins Gotobeat Advisory Board", "link": "https://www.billboard.com/pro/ferdy-unger-hamilton-joins-gotobeat-advisory-board/", "summary": "Ex-Columbia Records U.K. president Ferdy Unger-Hamilton joins the advisory board of Gotobeat, a business that describes its mission as “building a new model for live entertainment.” With Unger-Hamilton on board, enthuses Max Busin , CEO and founder of Gotobeat, the company enjoys a “significant step” forward. “What a moment this is for Gotobeat,” he remarks. “We’re building a company that combines the experience and relationships that have always driven the music industry with technology that allows us to operate in a completely different way. Ferdy understands that vision, and I’m really looking forward to building the next chapter of Gotobeat with him.” A decade ago, in 2016 , Unger-Hamilton was promoted to lead Columbia Records’ U.K., following senior leadership roles at Virgin and Polydor Records, where he helped launch Ellie Goulding, The 1975, Lana Del Rey, Haim, Years Years and Michael Kiwanuka. Earlier, in 2014, he founded Promised Land Music, where he helped launch the career of Fred again… Based in London, Gotobeat presents itself as a “next-generation” live music promoter and ticketing platform that uses proprietary data and artificial intelligence to design, price, and launch tours and festivals across the United Kingdom and Europe. Unger-Hamilton takes his seat as the company prepares for its next phase of growth in markets, including projects focused on Latin music events. “What excites me about Gotobeat is that it understands both sides of the music industry: the importance of relationships, instinct and experience, and the opportunity to use data and technology to make better decisions,” he remarks in a statement. “Live music is constantly evolving, and there is real potential to rethink how artists reach audiences and how touring businesses grow. Gotobeat has an ambitious vision for what a modern live entertainment company can be, and I’m excited to bring my experience to the team as it enters this next stage of accelerated growth.” Read more at gotobeat.com.", "date_str": "2026-11-18T03:55:00+00:00", "hash": "5b47c78e64e32903", "title_fa": "فردی اونگر-همیلتون، کهنه سرباز لیبلز U.K. به هیئت مشاوران Gotobeat پیوست", "summary_fa": "فردی آنگر-همیلتون، رئیس سابق کلمبیا رکوردز در بریتانیا به هیئت مشاوران Gotobeat می‌پیوندد، کسب‌وکاری که مأموریت خود را «ساخت یک مدل جدید برای سرگرمی زنده» توصیف می‌کند. با حضور Unger-Hamilton، مشتاق Max Busin، مدیرعامل و بنیانگذار Gotobeat، این شرکت از یک \"گام مهم\" رو به جلو برخوردار است. او می گوید: «این چه لحظه ای برای Gotobeat است. ما در حال ساختن شرکتی هستیم که تجربه و روابطی را که همیشه صنعت موسیقی را پیش می‌برد با فناوری ترکیب می‌کند که به ما امکان می‌دهد به روشی کاملاً متفاوت عمل کنیم. فردی این چشم انداز را درک می کند و من واقعا مشتاقانه منتظر ساختن فصل بعدی Gotobeat با او هستم.\" یک دهه پیش، در سال 2016، آنگر-همیلتون به رهبری کلمبیا رکوردز بریتانیا ارتقا یافت، پس از نقش‌های رهبری ارشد در ویرجین و پولیدور رکوردز، جایی که به راه‌اندازی الی گولدینگ، The 1975، لانا دل ری، هایم، سال‌ها و مایکل کیوانوکا کمک کرد. پیش از این، در سال 2014، او Promised Land Music را تأسیس کرد، جایی که او به راه اندازی مجدد حرفه فرد کمک کرد... Gotobeat مستقر در لندن، خود را به عنوان یک \"نسل بعدی\" تبلیغ کننده موسیقی زنده و پلت فرم فروش بلیط معرفی می کند که از داده های اختصاصی و هوش مصنوعی برای طراحی، قیمت گذاری و راه اندازی تورها و جشنواره ها در سراسر بریتانیا و اروپا استفاده می کند. Unger-Hamilton در حالی که شرکت برای مرحله بعدی رشد خود در بازارها، از جمله پروژه های متمرکز بر رویدادهای موسیقی لاتین، آماده می شود، صندلی خود را می گیرد. او در بیانیه‌ای می‌گوید: «آنچه مرا در مورد Gotobeat هیجان‌زده می‌کند این است که هر دو طرف صنعت موسیقی را درک می‌کند: اهمیت روابط، غریزه و تجربه، و فرصت استفاده از داده‌ها و فناوری برای تصمیم‌گیری بهتر». «موسیقی زنده به طور مداوم در حال", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/ferdy-unger-hamilton-2026-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۲۷ آبان • ۰۷:۲۵"}, {"source": "Billboard", "title": "Live Nation’s 17,000 Gather Brisbane Project Is Approved", "link": "https://www.billboard.com/pro/live-nation-17000-gather-brisbane-project-approved/", "summary": "BRISBANE, Australia – The capital of the Sunshine State, Brisbane, will become a two-arena city when a new 17,000-capacity venue is completed ahead of the 2032 Summer Olympic and Paralympic Games. A years-long wait for approval came to end this week when Gather Brisbane was rubber stamped, a major new live music and entertainment project for the inner-city suburb of Woolloongabba. Live Nation, OVG and Plenary will build the arena, which will have an 18,700 capacity in concert mode and which, the team behind it say, should bring more major live events to Brisbane. According to forecasts presented by Live Nation, the arena is expected to welcome more than 1.2 million people each year, support upwards of 1,500 ongoing jobs and generate almost A$844 million ($568 million) annually for the city’s visitor economy. “Brisbane has the audience and the ambition to welcome more of the world’s biggest tours, but it needs the venues to match,” comments Michael Coppel, chairman of Live Nation Australia and New Zealand. “This arena will help bring more shows to Queensland, strengthen Australia’s appeal as a touring destination and give artists and fans an arena they can be proud of for decades to come.” Brisbane won the rights to host the Olympics in 2021 when the IOC declared the city as the “preferred candidate,” thanks to its proven track record for organizing international events, with the Commonwealth Games (two, including the Gold Coast), an Expo and the Goodwill Games in its good books. And critically, the region already had up to 90% of the essential pieces of infrastructure in place although a cornerstone stadium, bettering the aging Brisbane Cricket Ground (The Gabba) at Woolloongabba, and the Queensland Sport and Athletics Centre at Mount Gravatt, has been both a sore point and a political football. The creation of a new, world-class arena, one to complement, and outlive, the Brisbane Entertainment Centre, which opened its doors in 1986, was part of the bargain. View this post on Instagram Gather Brisbane beats several rival bids, including the so-called Brisbane Live Arena, a proposed 18,000-capacity venue at a derelict spot on Roma Street, a short stroll from King George Square in the heart of the CBD. On completion, the new space “will be transformational for the area and generational for millions of people who’ll come to live, visit and enjoy this new precinct,” comments Jarrod Bleijie, deputy premier and minister for state development, infrastructure and ", "date_str": "2026-11-18T03:15:00+00:00", "hash": "9dabe5217e585fa4", "title_fa": "پروژه Live Nation's 17,000 Gather Brisbane تایید شد", "summary_fa": "بریزبن، استرالیا – پایتخت ایالت سان شاین، بریزبن، زمانی که یک مکان جدید با ظرفیت 17000 نفر قبل از بازی های المپیک و پارالمپیک تابستانی 2032 تکمیل شود، به یک شهر دو عرصه تبدیل خواهد شد. انتظار سالها برای تایید این هفته زمانی که Gather Brisbane مهر و موم لاستیک شد، یک پروژه جدید موسیقی زنده و سرگرمی جدید برای حومه شهر Woolloongabba به پایان رسید. Live Nation، OVG و Plenary این عرصه را خواهند ساخت که دارای ظرفیت 18700 نفر در حالت کنسرت است و تیم پشت آن می گوید که باید رویدادهای زنده مهم بیشتری را به بریزبن بیاورد. بر اساس پیش‌بینی‌های ارائه شده توسط Live Nation، انتظار می‌رود این عرصه هر سال پذیرای بیش از 1.2 میلیون نفر باشد، از بیش از 1500 شغل در حال انجام پشتیبانی کند و سالانه تقریباً 844 میلیون دلار استرالیا (568 میلیون دلار) برای اقتصاد بازدیدکنندگان شهر ایجاد کند. مایکل کاپل، رئیس Live Nation استرالیا و نیوزلند می‌گوید: «بریزبن تماشاگران و جاه‌طلبی برای استقبال بیشتر از بزرگ‌ترین تورهای جهان را دارد، اما به مکان‌هایی برای مطابقت نی  دارم تا آخر عمرم با سو سیلوستر کار کنم. می‌دانی، من تعجب می‌کنم که حالا تا کجا می‌توانیم او را ببریم. زیرا اگر به دنیا نگاه کنید، سو سیلوسترهای زیادی در آنجا وجود دارند. در ۲۱ اکتبر، ددلاین گزارش داد که دیزنی پلاس و هولو دستور راه‌اندازی مجدد Glee را داده‌اند، اما اشاره‌ای به اینکه کدام بازیگران نقش‌هایشان را دوباره ایفا می‌کنند، نکردند. Watch on Deadline Deadline اخیراً گزارش داد که ستاره‌های OG Glee هدر موریس و Chord Overstreet در حال مذاکره برای بازگشت به راه‌اندازی مجدد Glee هستند، پس از اینکه قبلاً گزارش داده بود که لی میشل نیز در حال مذاکره برای ایفای نقش خود در نقش ریچل بری است. کریس کولفر، بازیگر نقش کرت هومل، اخیراً به طعنه گفت که او گفتگوی خوبی در مورد بازی مجدد نقش خود در احیاء داشته است. \"راستش، در این مرحله، من فقط کنجکاو هستم. من اطلاعات زیادی در مورد آن ندارم.» او در پادکست Obsessed Daily Beast گفت: «بنابراین، من فرصتی نداشتم که با کسی در مورد آن صحبت کنم، اما اخیراً با کسی صحبت خوبی داشتم و به زودی گفتگوهای بیشتری خواهم داشت.» کولفر ادامه داد: «اما از آنچه من شنیدم، بسیار خنده دار به نظر می رسید و ایده خوبی به نظر می رسید. بنابراین، خواهیم دید.»", "image_url": "https://deadline.com/wp-content/uploads/2026/11/jane-lynch-glee-revival.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۷ آبان • ۰۷:۰۰"}, {"source": "Rolling Stone", "title": "Noah Kahan Addresses Grammy Snub in the Most Noah Kahan Way: ‘Let’s Move on Together’", "link": "https://www.rollingstone.com/music/music-news/noah-kahan-grammys-snub-addresses-1235660017/", "summary": "\"I'm happy that I feel shitty because it means that I cared about something,\" said Kahan during his London stop", "date_str": "2026-11-18T01:05:12+00:00", "hash": "48b7d88a433d9ffb", "title_fa": "نوح کاهان به انحراف گرمی به بهترین شکل نوح کاهان خطاب می کند: \"بیایید با هم حرکت کنیم\"", "summary_fa": "کاهان در طول توقف خود در لندن گفت: «خوشحالم که احساس بدی می کنم، زیرا این بدان معناست که من به چیزی اهمیت می دهم. آلبوم عامیانه معاصر برای نسخه لوکس آن. کاهان در طول نمایش خود در لند : "https://www.rollingstone.com/music/music-news/noah-kahan-grammys-snub-addresses-1235660017/", "summary": "\"I'm happy that I feel shitty because it means that I cared about something,\" said Kahan during his London stop", "date_str": "2026-11-18T01:05:12+00:00", "hash": "ac9a36f7eba7a83c", "title_fa": "نوح کاهان به بهترین شکل نوح کاهان به گرمی اشاره کرد: \"بیایید با هم حرکت کنیم\"", "summary_fa": "کاهان در طول توقف خود در لندن گفت: «خوشحالم که احساس بدی می کنم، زیرا این بدان معناست که من به چیزی اهمیت می دهم. آلبوم عامیانه معاصر برای نسخه لوکس آن. کاهان در طول نمایش خود در لندن در O2 در روز سه‌شنبه روی صحنه رفت تا با کمی شوخ طبعی و صداقت، غم‌انگیز بودن جایزه گرمی را تصدیق کند. قبل از پرتاب به مدار، کاهان به جمعیت فروخته شده سخنرانی کرد. من شروع به اهمیت دادن به چیزی خارج از کنترل خودم کردم و فکر می کنم همه ما نسخه ای از آن را در زندگی خود داریم. چیزی که واقعاً بی دلیل می خواهید، فقط به این دلیل که آن را می خواهید. این خواننده گفت و من احساس بدی داشتم و خوشحالم که احساس بدی دارم زیرا این بدان معنی است که من به چیزی اهمیت می دهم و به خودم اجازه می دهم به چیزهایی اعتقاد داشته باشم. کاهان گفت که در حالی که او آن را می‌خواهد، زیرا هرگز احساس نکرده است که من لیاقتش را دارم که در آن هستم، اما این راهی برای زندگی کردن شما نیست. او این باخت را مثبت ارزیابی کرد و گفت: من خوشحالم که دقیقاً به چیزی که فکر می‌کردم می‌خواهم نرسیده‌ام، زیرا باید به یاد بیاورم که ارزش شخصی من از کجا می‌آید، و باید در جایی از درون من باشد. او سپس از طرفدارانش قدردانی کرد و گفت که تا لحظه ای که وارد سالن شد و آنها را دید، برای خودش متاسف بود. او به تماشاگران گفت: من برای همیشه برای شما اینجا خواهم بود، تا زمانی که به من اجازه دهید برای شما بازی کنم. الان فقط ما هستیم و ما این کار را با هم انجام دادیم، و با هم به اینجا رسیدیم، و من فقط می‌خواهم بگویم که برای همه چیزهایی", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/noah-kahan-grammys-snub.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۰۴:۳۵"}, {"source": "Hollywood Reporter", "title": "Ron Howard Cautions ‘Grinch’ Sequel With Jim Carrey Will Only Move Forward If “One Thing” Happens", "link": "https://www.hollywoodreporter.com/movies/movie-news/ron-howard-grinch-sequel-only-move-forward-perfect-script-1236758080/", "summary": "The actor is open to reprising his titular role in the follow-up to the beloved 2000 Christmas film.", "date_str": "2026-11-18T01:21:19+00:00", "hash": "a015ffd2b8eaf40f", "title_fa": "ران هاوارد هشدار داد دنباله «گرینچ» با جیم کری تنها در صورتی جلو می‌رود که «یک چیز» اتفاق بیفتد", "summary_fa": "این بازیگر آماده است تا نقش اصلی خود را در ادامه فیلم محبوب کریسمس سال 2000 بازی کند. ران هاوارد در حال صحبت کردن درباره یک چیز است که باید برای ادامه فیلم چگونه گرینچ کریسمس را دزدید تا با جیم کری به جلو برود. هالیوود ریپورتر به طور انحصاری در اوایل سال جاری فاش کرد که فیلم بعدی با یونیورسال و ایجین اینترتینمنت در حال ساخت است. اما این فیلمساز برنده اسکار اخیراً به People گفته است که او و کری جلو نمی روند مگر اینکه فکر کنیم فیلمنامه عالی داریم و حتی در حال حاضر فیلمنامه هم نداریم. هاوارد فیلم محبوب کریسمس سال 2000 را بر اساس کتاب کلاسیک کودکان دکتر سوس در سال 1957 کارگردانی کرد که کری در نقش گرینچ و تیلور مامسن در نقش سیندی لو هو بازی کردند. داستان‌های مرتبط برنامه تلویزیونی Robopocalypse در دست ساخت با فیلم‌های ران هوارد، آکیوا گلدزمن، ران هاوارد در جوایز مستند منتخب منتقدان 2026 مورد تجلیل قرار می‌گیرد کارگردان به دنباله اضافه کرد، ما نویسندگان واقعاً خوبی داریم و ایده‌ای داریم که من از آن هیجان‌زده هستم که فکر می‌کنم بسیار با روحیه و روحیه دکتر او مطابقت دارد. بنابراین من از کاری که باید با آن کار کنیم بسیار راضی هستم، اما نمی‌خواهم قولی بدهم که این اتفاق می‌افتد، زیرا من و جیم در یک چیز همسو هستیم - ما جلوتر نمی‌رویم مگر اینکه باور داشته باشیم که این فرصت عالی است. هاوارد اعتراف کرد که میراث فیلم اول در تردید او نقش دارد و می‌خواهد منتظر بماند تا فیلمنامه به استانداردهای او برسد. THR قبلا گزارش داده بود که الک برگ، جف شفر و دیوید مندل مشغول کار بر روی فیلمنامه هستند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2025/11/MSDDRSE_UV005.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۷ آبان • ۰۴:۵۱"}, {"source": "Billboard", "title": "DistroKid Gives AI Upload Data to UMG and Sony for Suno Copyright Lawsuit After Initial Refusal", "link": "https://www.billboard.com/pro/distrokid-ai-data-umg-sony-lawsuit-suno/", "summary": "Amid legal pressure from Universal Music Group (UMG) and Sony Music, DistroKid has provided data about the prevalence of AI-generated music moving through its pipes. A Monday (Nov. 16) court filing, obtained by Billboard , says DistroKid has complied with the third-party subpoena served by UMG and Sony as part of their copyright infringement lawsuit against AI music service Suno. The subpoena sought numbers regarding how much of the music that passes through the leading DIY digital distributor is thought to be made with Suno and other AI generators. Related AI-Generated Slop : UMG Sues DistroKid for Flooding Streaming Platforms With Junk Music CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive UMG and Sony say this data is key to proving that Suno-generated music is eating into their market share and royalty distributions. Competition between AI songs and human music is a key part of the “fair use” inquiry — that is, the test a judge will use to decide the seismic question of whether Suno infringed the majors’ copyrights by training on millions of unlicensed tracks. DistroKid is not a party to the Suno suit. DistroKid initially refused to provide AI data to UMG and Sony, leading the labels to initiate a legal action last month seeking to force compliance with the subpoena. The distributor has since changed its tune and produced responsive documents, according to Monday’s court filing, which withdrew the subpoena petition. Reps for DistroKid and Sony declined to comment on the matter on Tuesday (Nov. 17). Reps for UMG did not return a request for comment. While the subpoena dispute is now over, UMG still has an ongoing lawsuit that alleges DistroKid is to blame for a surge in AI music on streaming services like Spotify. That case, filed in September, alleges that the distributor has engaged in deceptive business practices and violated copyright law by flooding streamers with “mass AI-generated, SEO-optimized, and copyright-infringing slop.” In a statement when that lawsuit was filed, DistroKid’s rep said, “We take copyright protection, fraud prevention and the integrity of the music ecosystem seriously, and work closely with digital streaming platforms, rightsholders and other industry partners on these efforts.” “We strongly disagree with UMG’s allegations and are disappointed that it chose l", "date_str": "2026-11-18T00:49:19+00:00", "hash": "e25659b354afec56", "title_fa": "DistroKid پس از امتناع اولیه، داده‌های آپلود هوش مصنوعی را به UMG و Sony برای شکایت Suno حق نسخه‌برداری می‌دهد.", "summary_fa": "در میان فشار قانونی گروه موسیقی یونیورسال (UMG) و سونی موزیک، DistroKid داده‌هایی درباره شیوع موسیقی تولید شده توسط هوش مصنوعی ارائه کرده است. یک پرونده قضایی دوشنبه (16 نوامبر) که توسط Billboard به دست آمده است، می گوید که DistroKid از احضاریه شخص ثالث ارائه شده توسط UMG و Sony به عنوان بخشی از شکایت آنها برای نقض حق چاپ علیه سرویس موسیقی هوش مصنوعی Suno پیروی کرده است. در این احضاریه به دنبال اعدادی بود که تصور می‌شود چه مقدار از موسیقی که از توزیع‌کننده پیشرو دیجیتال DIY عبور می‌کند با Suno و سایر تولیدکنندگان هوش مصنوعی ساخته شده است. Slop مرتبط با هوش مصنوعی: UMG از DistroKid به دلیل سیل‌آمیز بودن پلتفرم‌های استریم با موسیقی ناخواسته CL Signs با THEBLACKLABEL، اتحاد مجدد با تهیه‌کننده قدیمی تدی برای لحظات کامل در شرایط جوی شدید، بندهای شعاع و یافتن نسل بعدی از Aliby-Hadlinerهای یک ساله جشنواره: UMG و Sony می‌گویند این داده‌ها برای اثبات اینکه موسیقی تولید شده توسط us\" را اعلام می کند که ماه آینده منتشر می شود", "summary_fa": "دان تولیور که به تازگی پنج نامزدی جایزه گرمی را دریافت کرده، اعلام کرده است که ششمین آلبوم او نیتروس در 4 دسامبر از طریق کاکتوس جک/دانوی کو/آتلانتیک رکوردز منتشر خواهد شد. Nitrous که تولیور مدتی است در حال تمسخر آن است، کاملاً توسط خودش ضبط، تولید و مهندسی شده است. تولیور این آلبوم را در رسانه های اجتماعی با کلیپی اعلام کرد که [ ] همزمان با انتشار آلبوم، تولیور اولین پخش زنده شنبه شب خود را در 5 دسامبر انجام خواهد داد. Nitrous دارای تک آهنگ جدید Party With the Boys است که جمعه گذشته همراه با ویدیویی به کارگردانی تایلر راس با حضور بام مارگرا منتشر شد. تولیور در پی پنجمین آلبوم خود به نام Octane که در ژانویه گذشته منتشر شد و در صدر بیلبورد 200 قرار گرفت، از یک سال داغ خارج می شود. این پروژه دارای تک آهنگ موفق E85 بود که به رتبه 3 جدول آهنگ های Hot R B/Hip-Hop بیلبورد و شماره 15 در Hot 10 رسید. رپر هوستون بخش زیادی از سال را به عنوان بخشی از تور جهانی اکتان خود در جاده سپری کرد، که اولین اجرای نمایش‌های عرصه را از ماه می تا جولای داشت، قبل از اینکه دوباره برای یک تور جهانی Nitrous: New World Tour از آگوست تا پایان نوامبر، زمانی که نمایش‌ها را در O2 Arena لندن به پایان می‌رساند، برود. دیروز، تولیور با پنج نامزدی قابل توجهی برای جوایز گرمی 2027 موجی به راه انداخت. علاوه بر بهترین هنرمند جدید، Toliver نامزد بهترین آلبوم رپ با Octane شد. بهترین اجرای رپ با بادی ; و بهترین آهنگ رپ و بهترین اجرای ملودیک رپ با E85.", "image_url": "https://variety.com/wp-content/uploads/2026/11/DON-TOLIVER-LEAD-PRESS-IMG.png?w=1000&#038;h=563&#038;crop=1", "category": "سینما و سریال", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۰۴:۰۸"}, {"source": "Variety", "title": "Thom Velde, Former AMC Theatres Executive, Dies at 83", "link": "https://variety.com/2026/film/people-news/thom-velde-dead-amc-theatres-1236951046/", "summary": "Thomas Velde, who served as head film buyer at AMC Theatres during his 27 years at the exhibitor, died Oct. 31. He was 83. Velde died of cancer at his home in Rancho Mirage, Calif.. For 27 years, he worked uit over their 2019 track “What To Do?”. The JACKBOYS team was sued on Tuesday (Nov. 17) by Niv Kalisky, an Israeli music producer who goes by “Early Yellow.” The lawsuit, obtained and first reported by Billboard , alleges that Kalisky hasn’t gotten the master points he deserves for creating a sample used by the Scott-led collective of artists from his label, Cactus Jack Records. Related Travis Scott No Longer Facing Lawsuit Over ‘Alright’ Sample on ‘Astroworld’ and ‘Utopia’ CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive “What To Do?” was one of seven tracks on the group s self-titled 2019 album JACKBOYS , which debuted at No. 1 on the Billboard 200 and was followed up last summer by another chart-topping set , JACKBOYS 2 . The song itself charted at No. 56 on the Billboard Hot 100 and No. 20 on Billboard s Hot Rap Songs chart. Kalisky is credited as a songwriter and additional producer on “What To Do?”, meaning he has received publishing income for the composition. But the lawsuit claims he’s also entitled to master royalties for providing the track’s producers with a sample beat that was later mixed into the final sound recording. According to the complaint, Kalisky’s lawyers sent multiple royalty requests over the years to both Cactus Jack and its distribution partner, Sony’s Epic Records, but without any success. Kalisky’s team also submitted takedown requests for the song to Spotify, Apple Music and other digital streaming services, but Sony allegedly canceled them out with counter-notices to the streamers. Related How Many Times Has Ye Been Sued Over Samples? Here s Every Single Lawsuit He s Faced. “It is clear that the Defendants had actual knowledge that the Plaintiff had received zero compensation for the usage of the sound recording contained in the registered sample,” reads the lawsuit. ت به انتخاب پتینسون تعصب داشتند زیرا [ ] ما روند بسیار سختی را انجام دادیم و تصمیم نهایی را روز جمعه گرفتیم. در ابتدا یک گروه بزرگ وجود داشت و ما به پنج فینالیست انتخاب شدیم. ما تست های واقعی و قدیمی صفحه نمایش آن پنج فینالیست را انجام دادیم. جالب بود لباس های کامل و دکورهای واقعی و سایر بازیگران با آنها. ما سه صحنه مختلف را با هر یک از پنج فینالیست انجام دادیم و سپس در روز جمعه دور هم جمع شدیم تا چند ساعتی را به تماشای تمام تست‌ها و مرور همه آن‌ها بگذرانیم. او ادامه داد، زمانی که به این لیست پنج نفره رسیدیم، همه آنها شگفت انگیز بودند. اما چیز خاصی در مورد راب و عملکرد او وجود داشت. بلافاصله مورد بحث قرار نگرفت. دنیس [ویلنوو]، کارگردان... همه ما به سمت راب جذب شدیم. در ابتدا، ما کمی نسبت به او تعصب داشتیم، فقط به این دلیل که او قبلاً بسیار مشهور است، مثلاً شاید باید فرد ناشناخته‌تری داشته باشیم، اما در آزمایش‌های صفحه نمایش، بسیار واضح بود که او جیمز باند است. آمازون ام جی ام روز دوشنبه پتینسون را به عنوان جیمز باند بعدی معرفی کرد و به هفته ها گمانه زنی های رسانه ای خشن پایان داد. پس از انتشار این خبر، ستاره بتمن و پرایم تایم در بیانیه‌ای گفت: «جیمز باند یکی از افسانه‌ای‌ترین شخصیت‌های سینماست و 007 به او اعتماد کردن، افتخار یک عمر است». \"از دنیس، امی، دیوید، تانیا", "image_url": "https://variety.com/wp-content/uploads/2026/11/jeff-bezos-robert-pattinson-1.jpg?crop=0px%2C0px%2C1000px%2C562px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۷ آبان • ۰۲:۳۳"}, {"source": "Billboard", "title": "These 12 Follow-Ups to Grammy Album of the Year Winners Didn’t Receive a Single Nomination: Full List", "link": "https://www.billboard.com/lists/grammy-album-of-the-year-winners-followups-not-nominated/", "summary": "Harry Styles was doubtless disappointed on Monday (Nov. 16), when Kiss All the Time. Disco, Occasionally. , his follow-up to the Grammy album of the year winner Harry’s House , didn’t receive a single Grammy nomination. Styles may take some small comfort in knowing that he’s in good company. Such music legends as Carole King , George Harrison and Lionel Richie experienced the same fate with their follow-ups to Grammy album of the year winners. Since 1970, 12 follow-ups to Grammy-winning albums have failed to receive a single Grammy nomination. (Before 1970, album release patterns were much different, with artists frequently releasing multiple albums in a year.) Related From Noah Kahan to Harry Styles, Which Snubbed Artist Should ve Gotten a 2027 Grammy Nod? Vote! Many of these follow-ups to Grammy-winning albums did well on the Billboard charts. Seven of the 12 (including Styles’ album) topped the Billboard 200. Four of them (again including Styles’ album) both topped the Billboard 200 and spawned at least one single that topped the Billboard Hot 100. One of them – Bee Gees ’ Spirits Having Flown topped the Billboard 200 for six weeks and spawned three No. 1 hits. By definition, Grammy album of the year winners are hard acts to follow. King’s Tapestry, Fleetwood Mac ’s Rumours and the Bee Gees-led Saturday Night Fever soundtrack are three of the most iconic and era-defining albums of the 1970s. Any follow-up was probably going to suffer by comparison. Some of these overlooked follow-ups, notably ’s Fleetwood Mac s Tusk , have risen in esteem over the years. Here are follow-ups to Grammy-winning albums since 1970 that failed to receive a single Grammy nomination – not for the album or any of its tracks.", "date_str": "2026-11-17T22:43:55+00:00", "hash": "daf2b657d2fae411", "title_fa": "این 12 برنده آلبوم سال گرمی پس از آن، حتی یک نامزدی دریافت نکردند: فهرست کامل", "summary_fa": "هری استایلز بدون شک در روز دوشنبه (16 نوامبر)، زمانی که همیشه بوسید، ناامید شد. دیسکو، گاهی اوقات پس از او برنده آلبوم گرمی سال هری هاوس، حتی یک نامزدی گرمی دریافت نکرد. استایلز ممکن است با دانستن اینکه او در یک شرکت خوب است کمی احساس راحتی کند. اسطوره های موسیقی مانند کارول کینگ، جورج هریسون و لیونل ریچی با دنبال کردن برندگان آلبوم سال گرمی، سرنوشت مشابهی را تجربه کردند. از سال 1970، 12 آلبوم برنده گرمی، موفق به دریافت یک نامزدی گرمی نشدند. (قبل از سال 1970، الگوهای انتشار آلبوم بسیار متفاوت بود، به طوری که هنرمندان اغلب چندین آلبوم را در یک سال منتشر می کردند.) از نوح کاهان تا هری استایلز، کدام هنرمند نادیده باید جایزه گرمی 2027 را دریافت کند؟ رای بده بسیاری از این پیگیری‌ها برای آلبوم‌های برنده گرمی به خوبی در جدول بیلبورد قرار گرفتند. هفت نفر از 12 (از جمله آلبوم استایلز) در صدر بیلبورد 200 قرار گرفتند. چهار نفر از آنها (دوباره از جمله آلبوم استایلز) هر دو در صدر بیلبورد 200 قرار گرفتند و حداقل یک تک آهنگ را تولید کردند که در صدر 100 آهنگ داغ بیلبورد قرار گرفت. یکی از آنها - Bee Gees' Spirits Having Flown به مدت شش هفته در صدر بیلبورد 200 قرار گرفت و سه آهنگ شماره 1 را از آن خود کرد. طبق تعریف، دنبال کردن برندگان آلبوم گرمی سخت است. King’s Tapestry، Fleetwood Mac’s Rumors و موسیقی متن فیلم Saturday Night Fever به رهبری Bee Gees سه تا از نمادین ترین و تعیین کننده ترین آلبوم های دهه 1970 هستند. هر گونه پیگیری احتمالاً در مقایسه با آن آسیب خواهد دید. برخی از این پیگیری های نادیده گرفته شده، به ویژه Fleetwood Mac s Tusk، در طول سال ها مورد توجه قرار گرفته اند. در اینجا دنباله‌ای از آلبوم‌های برنده گرمی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/1463320298-e1794950757460.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۷ آبان • ۰۲:۱۳"}, {"source": "Billboard", "title": "Madonna Calls Dance ‘The Hidden Language of the Soul’ in 2027 Grammy Nomination ‘Love Letter’", "link": "https://www.billboard.com/music/pop/madonna-grammy-nominations-letter-confession-ii-dance-1236384431/", "summary": "Following her nominations in all four of the Grammys dance categories, Madonna has released a message about what this acknowledgment means to her. Dance is the hidden language of the soul, Madonna wrote in a social media post tagging @Grammys, captioned Incoming love letter. When I made C onfessions II with Stuart Price, our goal was not just to make people dance, but to find connection with other humans. If Storytelling is how we find our way back to ourselves then dancing is how we get there. Related Madonna Slayyyter Lead 2027 Dance/Electronic Grammy Nominations Wale on Triumphant Pair of 2027 Grammy Nominations for Everything Is a Lot : I Hope It Teaches a Lot of People About Resilience Miley Cyrus Reacts to Shared Grammy Nod With Dolly Parton: A Beautiful Way to Honor Her Enormous Heart Thanks to everyone that worked on this record! the letter continues. The producers, the writers, the artists and most of all my fans who have been so encouraging and supportive since the beginning of this project. Thank you for sharing this sacred space with me. I m so grateful to all of you. Love, Madonna. View this post on Instagram The Queen of Pop s July club album Confessions II received a nomination for best dance/electronic album, best dance/electronic recording for the song “I Feel So Free,” best dance pop recording for Danceteria and best remixed recording for the Stuart Price remix of her Kylie Minogue collab Love Sensation. These nominations bring Madonna s total nominations to 32, with her first coming in 1988. Her seven wins include a few in the dance genre; she got the 1999 best dance recording award for her electronica masterpiece Ray of Light and the best dance/electronic album award for her 2007 LP Confessions on a Dancefloor . Given the warm reception Confessions II has received, there s reason to believe Madonna could sweep the dance categories at the 2027 ceremony. While the dance categories are typically not televised, the Grammys put one in prime time in 2023, when Beyoncé s Renaissance was nominated for (and won) best dance/electronic album. Presumably, the Recording Academy may consider this move again given Madonna s star power. The 2027 Grammy Awards happen Feb. 7 at the Crypto.com Arena in Los Angeles.", "date_str": "2026-11-17T22:37:46+00:00", "hash": "86ff8a6b51efe990", "title_fa": "مدونا رقص را \"زبان پنهان روح\" در نامزدی گرمی 2027 \"نامه عاشقانه\" می نامد.", " reasured traditions, dating back to the Great Depression. This year s tree a Norway spruce cut from West Edmeston, N.Y. measures at 76 feet tall and 50 feet wide, weighing approximately 11 tons. It will soon be decked out in tens of thousands of lights and its 900-pound Swarovski star topper.", "date_str": "2026-11-17T22:29:09+00:00", "hash": "7480a40c750fa76d", "title_fa": "سینتیا اریوو میزبان نورپردازی درخت مرکز راکفلر با بازی کلی کلارکسون، آلانیس موریست و غیره است.", "summary_fa": "سینتیا اریوو برای نورافشانی درخت کریسمس در مرکز راکفلر برگزار می‌شود و NBC روز سه‌شنبه (17 نوامبر) اعلام کرد که برنده تونی میزبان برنامه ویژه تلویزیونی سالانه آن خواهد بود. این برنامه دو ساعته که به طور زنده از ساختمان پرچمدار شبکه در شهر نیویورک پخش می شود، همچنین اجراهایی از لیست ستاره ای از نوازندگان، از جمله کلی کلارکسون، کرک فرانکلین، وینونا جاد، JYT، براد پیزلی و الکس وارن را اجرا خواهد کرد. علاوه بر این، آلانیس موریست در میان انتشار آلبوم جدید کریسمس خود، Good Weather for Immaculate Conception، و همچنین ستاره Kpop Demon Hunters EJAE، که برنامه کنسرت های فصلی او همچنین شامل رژه شکرگزاری میسی در سال جاری است، آواز خواهد خواند. سینتیا اریوو مرتبط برای تم جیمز باند در طول کنسرت مزایای مرکز لینکلن فیلمبرداری می‌کند: «این رویای من است» EJAE، مگان مورونی، کوئین لطیفه بیشتر برای اجرا در صدمین رژه شکرگزاری میسی: فهرست نامزدهای گرمی را در فهرست نامزدهای مرکز موسیقی 2027 مشاهده کنید، می‌توانید با راک ریوو منتظر باشید تا Complete را ببینید. با هیجان در استوری اینستاگرامش نوشت. کارسون دالی، کریگ ملوین و آل راکر نیز همراه با راکتز ظاهر خواهند شد. بینندگان می توانند ساعت 20 به تماشای این برنامه بپردازند. ET در 2 دسامبر در NBC و Peacock برای تماشای درخشش همیشه سبز نمادین نیویورک برای اولین بار در فصل کریسمس. این اولین باری است که Erivo میزبان کریسمس در مرکز راکفلر است. این خبر درست پس از دریافت یک هدیه اولیه کریسمس منتشر شد و او در کنار آریانا گرانده برای دوئت For Good در Wicked: For Good نامزد دریافت جایزه گرمی شد. اریوو همچنین پس از اجرای شگفت‌انگیزش در مراسم معرفی تالار مشاهیر راک رول 2026 و ن برنده خواهد شد: الا لنگلی می‌تواند برنده شود: کودی جانسون این افتخار برتر قبلاً به عنوان چیزی نزدیک‌تر به جایزه یک عمر دستاورد مداوم برای یک سوپراستار داغ در نظر گرفته می‌شد تا به رسمیت شناختن دستاورد هنری ناب و اخیری که می‌توانست به کسی در مراحل اولیه قدیمی برسد. اما زمانی که لینی ویلسون آن را در سال 2023 بدون ایجاد چین و چروک شدید در جاده به دست آورد، احساس می‌شد که شروع به تغییر کرد. (او همچنین در سال 2025 دوباره آن را دریافت کرد.) همه اینها به این معنی است که یک سوال وجود دارد که می توان از لینی و این افتخار پرسید: خیلی زود؟ و پاسخ محتمل به آن این است: نه، اما ممنون که پرسیدید. با این حال، اگر رأی دهندگان تصمیم بگیرند که تعداد زیادی جوایز کمتر برای لنگلی در سال جاری به اندازه کافی خوب", "image_url": "https://variety.com/wp-content/uploads/2026/09/GettyImages-2247560030.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۷ آبان • ۰۲:۱۱"}, {"source": "Variety", "title": "Marvel Started Planning for Robert Downey Jr.’s Doctor Doom Before Jonathan Majors Was Fired and ‘Avengers: The Kang Dynasty’ Fell Apart, Says Kevin Feige", "link": "https://variety.com/2026/film/news/doctor-doom-avengers-kang-dynasty-jonathan-majors-fired-1236950563/", "summary": "Before Avengers: Doomsday, there was Avengers: The Kang Dynasty. Marvel Studios boss Kevin Feige announced the latter title at Comic-Con in July 2022, with Jonathan Majors Kang the Conqueror poised to become the Marvel Cinematic Universe s next Thanos-sized villain starting with 2023 s Ant-Man and the Wasp: Quantumania. Those plans, however, were upended a few weeks [ ]", "date_str": "2026-11-17T22:20:09+00:00", "hash": "120d602964dd149b", "title_fa": "کوین فایگی می گوید مارول برنامه ریزی برای Doctor Doom ساخته رابرت داونی جونیور را قبل از اخراج جاناتان میجرز و فروپاشی «انتقام جویان: سلسله کانگ» آغاز کرد.", "summary_fa": "قبل از Avengers: Doomsday، Avengers: The Kang Dynasty وجود داشت. رئیس استودیوی مارول، کوین فایگی، عنوان دوم را در ژوئیه 2022 در Comic-Con اعلام کرد و جاناتان میجرز کانگ فاتح آماده تبدیل شدن به شخصیت منفی بعدی در اندازه تانوس در دنیای سینمایی مارول است که با فیلم Ant-Man and the Wasp: Quantumania در سال 2023 شروع می شود. با این حال، این برنامه‌ها چند هفته به پایان رسید [ ] با اخراج Majors، دنیای سینمایی مارول بازنگری شد و Avengers: The Kang Dynasty با Avengers: Doomsday جایگزین شد. اکنون این طرح به بازگرداندن رابرت داونی جونیور به MCU کشیده شد، اما این بار نه در نقش مرد آهنی (که در سال 2019 در فیلم Avengers: Doomsday درگذشت) بلکه در نقش دکتر رستاخیز شرور. با این حال، رئیس استودیو مارول در آخرین شماره مجله Empire (از طریق The Playlist) فاش کرد که Doom در حال گفتگو بود تا به MCU اضافه شود، قبل از اینکه سلسله Kang در میان مشکلات حقوقی عمده‌ها از هم بپاشد. فایگی گفت: «احتمالاً هنوز «سلسله کانگ» نامیده می‌شد، اما می‌توانست یک صحنه برای Doom در اواسط آن فیلم باشد. طبق گفته Feige، مارول برای اولین بار با نماینده رابرت داونی جونیور (به او گفت: ما یک ایده داریم، وقت آن است) تقریباً همزمان با اولین نمایش Quantumania در فوریه 2023، هفته‌ها قبل از دستگیری سرگرد در شهر نیویورک، تماس گرفت. فایگه در مورد وضعیت ماژورز اضافه کرد: «بسیار ظریف بود. ما نمی‌خواستیم در تصمیم‌گیری عجولانه در زمینه استخدام عجله کنیم.", "image_url": "https://variety.com/wp-content/uploads/2026/11/MCDAVDO-WD017-MCDANMA-WD029-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۲۷ آبان • ۰۱:۵۰"}, {"source": "Variety", "title": "The Next Bond Villain: From Idris Elba to Kristen Stewart, 22 Actors Who Should Face Off Against Robert Pattinson", "link": "https://variety.com/lists/robert-pattinson-james-bond-villains-actors-picks/", "summary": "Every James Bond is only as good as the person who’s trying to kill him. Throughout the franchise’s history, we’ve seen Sean Connery take on Gert Fröbe’s Goldfinger, Roger Moore tackle Christopher Walken’s Max Zorin and, in the Daniel Craig era, Mads Mikkelsen’s Le Chiffre in “Casino Royale” and Javier Bardem’s notorious Raoul Silva in [ ]", "date_str": "2026-11-17T22:15:00+00:00", "hash": "ca0cfecea0d34997", "title_fa": "شرور باند بعدی: از ادریس البا تا کریستن استوارت، 22 بازیگری که باید در مقابل رابرت پتینسون قرار بگیرند", "summary_fa": "هر جیمز باند فقط به اندازه کسی است که می خواهد او را بکشد. در طول تاریخ این فرنچایز، شاهد بوده ایم که شان کانری با فیلم گلدفینگر گرت فروبه، راجر مور با مکس زورین ساخته کریستوفر واکن و در دوران دنیل کریگ، لو شیفر از مدز میکلسن در «کازینو رویال» و خاویر باردم با بازی خاویر باردم در فیلم بدنام رابرتسون در فیلم «رائول» (Casino Royale) بازی کرده است. قهرمان بدنام را در فیلمی از دنیس ویلنوو به تصویر بکشید، جست‌وجو برای یافتن «دختر باند» بعدی و اکنون دشمن مورد انتظاری که مأموریت او برای ایمن نگه داشتن جهان را تهدید می‌کند، ادامه دارد. لیست آرزوها شامل بسیاری از چهره‌های آشنا از گذشته پتینسون، چه در جلو و چه در پشت دوربین و برخی از انتخاب‌های لانگ شات است که ممکن است به اندازه کافی دیوانه کننده باشند. خواه یک مسیحی فناوری، یک جاسوس سرکش یا یک وارث با دستگاه روز قیامت باشد، ما هیجان زده هستیم. در اینجا 22 بازیگری هستند که ورایتی دوست دارد با 007 جدید پای به پا شود. جوایز افتخاری: ماهرشالا علی، آستین باتلر، کیت بلانشت، ویلم دفو، میا گوث، نیکلاس هولت، آرون تیلور جانسون، واگنر مورا، دو پاتل، متیو ریس، کالوم ترنر ریز احمد در نقش‌های دراماتیک مهارت دارد، مانند نقش‌های دراماتیکی که در نقش‌های دراماتیک «من درام» نقش‌آفرینی کرد. اما او همچنین استاد صدا و بازیگری موشن کپچر است، از سوروس اسنیپ در کتاب‌های صوتی «هری پاتر» تا رهبر بی‌رحم سیمبیوت ریوت در «ونوم». بنابراین، چه او آن را مستقیماً بازی کند یا شاید به شکل یک تهدید وحشتناک برای باند رابرت پتینسون باشد، احمد این قدرت ظریف و پولادین را دارد که در هر صورت یک بدجنس باشد. پیرس برازنان چهار فیلم جیمز باند را به عنوان ابرجاسوس اصلی در اواخر دهه 90 رهبری کرد، پس چرا او را برای آخرین", "image_url": "https://variety.com/wp-content/uploads/2026/11/Bond-Villains.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۷ آبان • ۰۱:۴۵"}, {"source": "Variety", "title": "‘Concrete Land’ Leads IDA Documentary Award Nominations With Six; ‘To Hold a Mountain,’ ‘You Can See Everything’ Also Score", "link": "https://variety.com/2026/film/awards/ida-documentary-awards-2026-nominations-full-list-1236950889/", "summary": "This year’s International Documentary Association Documentary Awards nominations have been announced. Asmahan Bkerat’s “Concrete Land” leads the field with six nominations, followed by Biljana Tutorov and Petar Glomazić’s “To Hold a Mountain” with five. Mehrdad Oskouei and Soraya Akhlaghi’s “A Fox Under a Pink Moon” and Pegah Ahangarani’s “Rehearsals for a Revolution” also scored strong [ ]", "date_str": "2026-11-17T22:00:06+00:00", "hash": "ca78c6dff6cc0d62", "title_fa": "«زمین بتنی» با شش نامزدی جایزه مستند IDA پیشتاز است. \"To Hold a Mountain\"، \"You Can See Everything\" نیز امتیاز دارند", "summary_fa": "نامزدهای جوایز مستند انجمن بین المللی مستند امسال اعلام شد. «سرزمین بتنی» اسماهان بکرات با 6 نامزدی در صدر جدول قرار دارد و پس از آن بیلیانا توتوروف و پتار گلومازیچ با نامزدی با 5 نامزدی در رتبه های بعدی قرار دارند. فیلم های «روباه زیر ماه صورتی» ساخته مهرداد اسکویی و ثریا اخلاقی و «تمرینات یک انقلاب» پگاه آهنگرانی نیز امتیاز بالایی کسب کردند [ ] نامزدهای جوایز مستند انجمن بین المللی مستند امسال اعلام شد. «سرزمین بتنی» اسماهان بکرات با شش نامزدی پیشتاز این عرصه است و پس از آن بیلیانا توتوروف و پتار گلومازیچ با نامزدی با پنج نامزدی در جایگاه دوم قرار دارند. فیلم باکس آفیس ناتان فیلدر و لنس اوپنهایم به نام «شما می توانید همه چیز را ببینید» سه نامزدی از جمله بهترین فیلم مستند بلند، بهترین کارگردانی و بهترین موسیقی اورجینال را به دست آورد، اما در بخش فیلمبرداری و تدوین کنار گذاشته شد. IDA رکورد 650 ارسال را از 95 کشور دریافت کرد که 32 کشور در بین نامزدهای امسال حضور داشتند. من نمی‌توانستم بیشتر از این برای جشن گرفتن این مستندهای معنادار و خلاقانه هیجان‌زده باشم. اینا فیچمن، رئیس هیئت مدیره IDA، می‌گوید: «امسال شاهد نامزدهایی هستیم که داستان‌های عمیقا شخصی‌شان روایت‌های مقاومت و تبعید را به اشتراک می‌گذارد، و فیلم‌سازی هنرمندانه و خلاقانه‌ای را می‌بین ow past album of the year winners Harry Styles and Kacey Musgraves for a nomination in the category. An added bonus: for the first time in a long time (maybe ever?) Swift will enter these Grammys as an underdog, the role she has always relished. Hannah Dailey : RAYE. That might be the obvious answer given that she’s the most-nominated artist this year, but it’s so hard not to be ecstatic for her when you know how much she went through – including years of being told “no” and struggling for the chance to even release music in her first record deal – to get to this very well-deserved moment. It’s also such a huge win for indie artists in general! Lyndsey Havens : To be more specific than all the women nominated, I think RAYE has the most reason to be excited, for sure. And not only because she leads the pack with the most 2027 Grammy nominations (11 total) and not only because she ties a record set by Beyoncé’s two years ago for the most nods by a woman in one ", "date_str": "2026-11-17T20:11:42+00:00", "hash": "0b028fb2b727d91d", "title_fa": "چه کسی بزرگترین برنده (و چه کسی بزرگترین نادیده گرفته شده) از نامزدهای گرمی 2027 است؟", "summary_fa": "نامزدهای شصت و نهمین دوره جوایز سالانه گرمی روز دوشنبه صبح اعلام شدند و در مهم‌ترین دسته‌ها نام بسیاری از بزرگترین هنرمندان موسیقی محبوب سال گذشته از جمله تیلور سوئیفت، اولیویا رودریگو، برونو مارس، الا لنگلی، اولیویا دین، ری و روزالیا دیده می‌شود. همه هفتمین ستاره برای هر یک از رکوردها، آهنگ‌ها و آلبوم‌های سال نامزد شدند - لنگلی همچنین چهارمین نامزدی در رشته عمومی را برای بهترین هنرمند جدید اضافه کرد و RAYE یک نامزدی را برای ترانه‌سرای سال به دست آورد - در حالی که فیبی بریجرز، Tame Impala JENNIE و Ariana Grande نیز در آن دسته‌ها ظاهر می‌شوند. با این حال، برخی از نام‌های بزرگی که تصور می‌شود به طور بالقوه در این ترکیب حضور داشته باشند، در زمینه عمومی ظاهر نشدند، از جمله نوح کاهان، چارلی xcx، هری استایلز و مدونا. کدام هنرمند بزرگترین برنده نامزدهای سال بود؟ و کدامیک بیشترین علت شکایت را دارد؟ کارکنان بیلبورد به این سوالات و موارد اجرا، کارگردانی، آهنگسازی و فیلمبرداری می‌شود. نام‌ها شامل سلست هیو خالق The Burbs، گابی آکوستا طراح لباس ۱۹۲۳، کارگردان خرس مزاحم گابریلا اوسیو واندن، نویسنده و کارگردان پرستار شب جورجیا برنشتاین و کلیر ابسکور: اکسپدیشن 33، نویسنده اصلی جنیفر سودبرگ ین است. کورتنی لابارج بل، مدیر اجرایی بفتا آمریکای شمالی، گفت: «برنامه پیشرفت بفتا در ایالات متحده سرمایه‌گذاری بر صداهای خارق‌العاده‌ای است که در آینده در فیلم، تلویزیون و بازی‌ها شکل می‌دهند. گروه امسال منعکس کننده تخیل، جاه طلبی و چشم اندازهای متمایز است که همچنان صنایع ما را به جلو می برد. در زمانی که خلاقان نوظهور با چالش‌های فزاینده‌ای در یافتن فرصت، راهنمایی و مسیری روبه‌رو هستند، بافتا مفتخر است که فضایی را ایجاد می‌کند که در آن استعدادها قابل شناسایی، حمایت و اتصال به جامعه خلاق گسترده‌تر باشد. برای لیست و بایوس در BAFTA آمریکای شمالی به پایین بروید. آدام میکس نویسنده، کارگردان – آدام میکس فیلمساز ساکن بروکلین «Union County» به عنوان یک صدای جدید متمایز در سینمای مستقل ظاهر می شود. اولین کارگردانی بلند او، \"Union County\" با بازی ویل پولتر و نوآ سنتینیو در جشنواره فیلم ساندنس 2026 در مسابقه دراماتیک ایالات متحده به نمایش درآمد و نقطه عطفی در کارنامه کاری او رقم زد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/connor-storrie-inde-navarrette-kane-parsons.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۲۶ آبان • ۲۳:۲۸"}, {"source": "Pitchfork", "title": "Matthew Dear, Armand Hammer, and More: This Week’s Pitchfork Selects Playlist", "link": "https://pitchfork.com/story/matthew-dear-armand-hammer-and-more-this-weeks-pitchfork-selects-playlist/", "summary": "Our weekly playlist highlights songs that our writers, editors, and contributors are listening to on repeat", "date_str": "2026-11-17T20:55:47+00:00", "hash": "8c92aa8839890788", "title_fa": "Matthew Dear، Armand Hammer، و بیشتر: این هفته Pitchfork لیست پخش را انتخاب می کند", "summary_fa": "Our weekly playlist highlights songs that our writers, editors, and contributors are listening to on repeat Loader Save Story Save this story Comment Loader Save Story Save this story The staff of Pitchfork listens to a lot of new music. مقدار زیادی از آن. On any given day our writers, editors, and contributors go through an imposing number of new releases, giving recommendations to each other and discovering new favorites along the way. هر دوشنبه، با لیست پخش Pitchfork Selects، آنچه نویسندگانمان با وسواس می‌نوازند را به اشتراک می‌گذاریم و برخی از موسیقی‌های جدید مورد علاقه کارکنان Pitchfork را برجسته می‌کنیم. لیست پخش مجموعه ای از آهنگ هاست: تنها اصل راهنمای آن این است که این ها آهنگ هایی هستند که با کمال میل برای یک دوست ارسال می کنید. لیست پخش Pitchfork Selects این هفته شامل آرماند همر، استر رز، متیو دیار و غیره است. به زیر گوش دهید و لیست های پخش ما را در Apple Music و Spotify دنبال کنید. (Pitchfork از خریدهای انجام شده از طریق پیوندهای وابسته در سایت ما پورسانت دریافت می کند.) توجه: به دلیل قطعی اپل، ما نتوانستیم نسخه Apple Music لیست پخش Selects خود را در این هفته به روز کنیم. پس از آنلاین شدن دوباره این کار را انجام خواهیم داد. آرماند همر: \"جاذبه\" - لیلی گلدبرگ اکو2k: \"حیوان بی عشق، جنایتکار بی قانون\" - اولیویه لافونتانت مسابقه کوه دلپذیر: \"ویرانگر بزرگ\" - نینا کورکوران استر رز: \"بی حس\" [ft. آنجلا پاییز] - سام سدومسکی جورا: «به رانندگی ادامه بده، پسر» [ft. ML Buch، Helene Norup Due، Clarissa Connelly، Ydegirl]- LG Beach Bunny: \"Vinegar\" - NC Palehound: \"Natural Disasters\" - NC Alba Akvama: \"Pass Me By\" - Anna Gaca Matthew Dear: \"Dizzy\" - Philip Sherburne Astrøn: \"12\"", "image_url": "https://media.pitchfork.com/photos/6afcbebe316673d379b85295/16:9/w_1280,c_limit/P4K26-1117_Selects_2x1.png", "category": "موبایل و گجت‌ها", "tags": ["Apple", "موسیقی"], "datetime_fa": "۲۷ آبان • ۰۰:۲۵"}, {"source": "Hollywood Reporter", "title": "Bat, Bond and Beyond: How Robert Pattinson Landed 007 (and What Comes Next)", "link": "https://www.hollywoodreporter.com/movies/movie-news/robert-pattinson-landed-007-what-next-1236757722/", "summary": "The star's popularity comes with its own set of consequences, from existing brand endorsement deals to his commitment to his arthouse projects and his status as the Dark Knight.", "date_str": "2026-11-17T21:00:15+00:00", "hash": "29e821fb0192a251", "title_fa": "خفاش، باند و فراتر از آن: چگونه رابرت پتینسون به 007 فرود آمد (و بعد چه می‌شود)", "summary_fa": "محبوبیت این ستاره پیامدهای خاص خود را دارد، از قراردادهای تایید برند موجود گرفته تا تعهد او به پروژه های خانه هنری اش و جایگاهش به عنوان شوالیه تاریکی. متن لوگو شش ماه جست‌وجوی جیمز باند بعدی، تعداد زیادی از بازیگران برجسته در حال تست بازیگری، گمانه‌زنی‌های بی‌پایان رسانه‌ای و انتخاب بازیگران از طرفداران، و برنده… آن مردی است که در همه چیز حضور دارد. رابرت پتینسون هفتمین 007 ما است، و انتقاد از آمازون MGM، تهیه‌کنندگان و کارگردان دنیس ویلنوو به دلیل انتخاب بازیگری که فوق‌العاده با استعداد است و جذابیت‌های اخیر باکس آفیس را نشان داده، بسیار سخت است. ویلنوو به عنوان عاشق اجرای جذاب پتینسون در پرایم تایم ثبت شده است، و مطمئناً مدیران استودیو باید دوست داشته باشند که بیش از 75 درصد از تماشاگران آخر هفته فیلم A24 از پتینسون به عنوان دلیل اصلی خود برای خرید بلیت یاد می کنند و اینکه Primetime درصد شگفت انگیزی از مخاطبان Gen Z را ارائه می دهد (69 درصد تماشاگران آخر هفته فیلم افتتاحیه). همه این‌ها مطمئناً به پتینسون کمک کردند تا از گروه‌های متنوع نامزدهای رقیب شکست بخورد (و منظور ما از «متنوع»، مردان سفیدپوست 36 ساله ورزشکار در بریتانیا است که محبوب هم هستند... نه به اندازه‌ای محبوب). بسیاری از ناظران به روش‌هایی توجه می‌کنند که پتینسون زاویه‌دار و متفکر، حال و هوای متفاوتی نسبت به باندهای قبلی دارد، که بیشتر شبیه نامزدی برای شرور فرنچایز است تا قهرمان آن. اما این وضعیت بازیگر در لیست A است که بیشتر او را از تهیه‌کنندگان باند متمایز می‌کند که به‌طور سنتی یک بازیگر تازه‌کار را انتخاب می‌کنند که فقط برای تماشاگران آشنا بود قبل از اینکه او را در لباس پوشانده و والتر PPK را به او هدیه دهند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/GettyImages-2293702578.jpg?w=1440&#038;h=810&#038;crop=1", "category" nion (minus one key character) means for their futures in the MCU. \"As long as there are interesting and fun stories for Vision, I’ll be putting on my tights,\" quips Bettany.", "date_str": "2026-11-17T20:18:37+00:00", "hash": "ae45700053c16103", "title_fa": "پل بتانی و روآید مولیکا بالاخره می‌توانند درباره اسپویلرهای VisionQuest صحبت کنند.", "summary_fa": "یک هفته بعد از آن فینال پرهیاهو، همبازیانی که نقش سینتزوئید ویژن و پسر فوق‌العاده‌اش تامی ماکسیموف را بازی می‌کنند، به THR درباره فیلمبرداری فصل آخر سه‌گانه «WandaVision» می‌گویند و این دیدار صمیمانه خانوادگی (منهای یک شخصیت کلیدی) برای آینده‌شان در MCU چه معنایی دارد. بتانی با کنایه می گوید: «تا زمانی که داستان های جالب و سرگرم کننده ای برای ویژن وجود داشته باشد، من جوراب شلواری ام را خواهم پوشید. متن لوگو [این داستان حاوی اسپویلرهای اصلی از فینال VisionQuest، Forever است. ] با تمام جنبه‌های تئاتری وجودی‌اش، VisionQuest مارول همیشه قرار بود داستان عشقی عمیقاً انسانی را بین یک پدر سنتزوئید، ویژن (پل بتانی) و پسر گمشده‌ای که او در نهایت ادعا می‌کند فرزند خودش است، تامی ماکسیموف (روآرید مولیکا) روایت کند. مجموعه جدید دیزنی پلاس که توسط تری ماتالاس خلق شده است، رشته‌هایی را که پس از WandaVision و Agatha All Along باقی مانده بود، انتخاب می‌کند، جایی که White Vision با خاطرات بازسازی‌شده‌اش در آسمان ناپدید شد و روح تامی در بدن نوجوان توماس شپرد تجسم یافت. در طول هشت اپیزود، VisionQuest هر دو شخصیت را می‌یابد که با حس شکسته هویت خود دست و پنجه نرم می‌کنند. ویژن تلاش می‌کند تا انسانیت خود را جمع کند و در عین حال غرایز پدرانه‌اش را در کنار هم نگه می‌دارد - ترس از این که تصدیق تامی به معنای پذیرش از دست دادن واندا ماکسیموف (الیزابت اولسن) است - حتی وقتی تامی تلاش می‌کند تا زندگی جدید خود را با سرعت فوق‌العاده نهفته‌اش و اشتیاق عمیق برای خانواده‌ای که به سختی به یاد می‌آورد آشتی دهد. داستان‌های مرتبط فیلم‌های Vision Quest در 40 سالگی: متیو مودین توضیح می‌دهد که چگونه کلاسیک روی سن او را به ارمغان آورد تلویزیون ژاکت تمام فلزی جیمز اسپیدر در حال بازگشت به عنوان اولترون برای سریال Vision مارول", "image_url": "https://www.hol ah Jessica Parker and Rachel McAdams. Despite their increasingly busy schedules, Mulroney tells Variety that the actors agreed [ ]", "date_str": "2026-11-17T20:48:43+00:00", "hash": "46cd334a010440ad", "title_fa": "ستاره درموت مولرونی می‌گوید: «خاطره در همه چیز محترم است» دایان کیتون در دنباله «سنگ خانواده»", "summary_fa": "خانواده استون بیش از دو دهه بعد دوباره گرد هم می آیند تا از دایان کیتون در ادامه فیلم The Family Stone تقدیر کنند. درموت مولرونی که در فیلم تعطیلات سال 2005 در نقش اورت استون بازی کرد، در کنار ستاره های اصلی سارا جسیکا پارکر و ریچل مک آدامز بازگشته است. علیرغم برنامه‌های شلوغ فزاینده‌شان، مولرونی به ورایتی می‌گوید که بازیگران موافقت کردند [] درموت مولرونی، که در فیلم تعطیلات سال 2005 در نقش اورت استون بازی کرد، در کنار ستاره‌های اصلی سارا جسیکا پارکر و ریچل مک‌آدامز بازمی‌گردد. علیرغم مشغله‌های روزافزون، مولرونی به ورایتی می‌گوید که بازیگران پذیرفتند که به جای شخصیت‌هایشان قدم بگذارند تا یاد و خاطره کیتون را که در نقش سیبل مادرسالار خانواده بازی می‌کرد، گرامی بدارند. داستان های مرتبط کسب و کار مدیریت کسب و کار. کلوپ راز خوانی مدیران کابل در مورد یافتن الهام و شجاعت از World of Warcraft Forever Surprise گرفته تا Le Sserafim، Simu Liu و T-Pain Appearances، چگونه BlizzCon 2026 صحنه ای را برای دوره بعدی بلیزارد اینترتینمنت تنظیم کرد. 2. \"پیشنهاد می کنم که کیفیت متفاوتی نسبت به دنباله تنوع باغی شما داشته باشد. شاید فقط این است که خانواده ای در کنار هم هستند که به آن طنین می بخشد. اما چیزی جادویی در مورد این فیلم وجود دارد.\" دنباله فیلم با عنوان «سنگ‌های خانواده»، خانواده استون را 20 سال پس از مرگ مادرشان دنبال می‌کند. وقتی دوباره برای کریسمس دور هم جمع می شوند، وقتی پدرشان زنی را که از آن زمان عاشقش شده بود به خانه می آورد، با یک غافلگیری غیرمنتظره مواجه می شوند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/THE-FAMILY-STONE-Sarah-Jessica-Parker-Dermot-Mulroney-Diane-Keaton-2005-TM-Copyright-c-20th-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۷ آبان • ۰۰:۱۸"}, {"source": "Variety", "title": "The War on Drugs Wake Up a 97-Year-Old New Jersey Theater With Spellbinding, Two-Hour Set Featuring New Songs", "link": "https://variety.com/2026/music/news/the-war-on-drugs-new-songs-loews-jersey-theatre-1236949930/", "summary": "How do you wake up a 97-year-old theater? A spellbinding two-hour set from the War on Drugs. The Philadelphia rock band headlined the Loew s Jersey Theatre on Saturday night, welcoming music fans back into the historic venue after a five-year, $130 million renovation. The grand reopening featured two sold-out concerts; the Trey Anastasio Band played [ ]", "date_str": "2026-11-17T20:41:22+00:00", "hash": "2227f0ec4e213359", "title_fa": "جنگ علیه مواد مخدر یک تئاتر 97 ساله نیوجرسی را با مجموعه ای طلسم کننده و دو ساعته با آهنگ های جدید بیدار می کند", "summary_fa": "چگونه یک تئاتر 97 ساله را بیدار می کنید؟ مجموعه دو ساعته جذاب از جنگ علیه مواد مخدر. گروه راک فیلادلفیا شنبه شب تیتر یک تئاتر لو s Jersey شد و از طرفداران موسیقی پس از بازسازی 130 میلیون دلاری به مدت پنج سال به مکان تاریخی بازگشت. بازگشایی بزرگ شامل دو کنسرت فروخته شده بود. تری آناستازیو بند بازی کرد [ ] طرفداران در یک شب سرد به سالن تئاتر رفتند و از سقف های پرآذین آن و ویژگی های سرگرم کننده و قدیمی که از بازسازی باقی مانده بودند شگفت زده شدند - باجه های تلفن بدون تلفن، یک اتاق بزرگ با شومینه که به دستشویی منتهی می شود. در سالن، نور نارنجی طاق باروک را می پوشاند و پرده های قرمز بالای سرش آویزان بود. یکی از بهترین جنبه‌های محل برگزاری: کف طبقاتی و کمی شیبدار است که یافتن موقعیت برتر در قسمت پذیرش عمومی را آسان‌تر می‌کند. داستان های مرتبط کسب و کار مدیریت کسب و کار. کلوپ راز خوانی مدیران کابل در مورد یافتن الهام و شجاعت استراق سمع آینده فیلمنامه اجتماعی را آزمایش می کند. و گروه به \"Harmonia's Dream\" نشستند، یک ساخت کند که به یک رفرن پایانی تبدیل می شود - \"تو خودت هستی!\" - قبل از فوران به سولوی گیتار، همانطور که همه بهترین آهنگ‌های War on Drugs انجام می‌دهند. آکوردهای قاطع پیانو، اولین تک آهنگ گروه در پنج سال اخیر، \"Who's That\" را آغاز کرد. تماشاگران به وضوح از آهنگ جدید لذت برده بودند و همراه با آدام گراندوسیل، آهنگساز، «این فقط افسردگی من است، عزیزم!» می خواندند، قلابی که روی کالاهای تازه چاپ شده است.", "image_url": "https://variety.com/wp-content/uploads/2026/11/TheWaronDrugs5-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۰۰:۱۱"}, {"source": "Variety", "title": "Elliot Page and Chris Columbus Board Queer Dark Comedy ‘Callback’ as Executive Producers (EXCLUSIVE)", "link": "https://variety.com/2026/film/columns/elliot-page-chris-columbus-queer-callback-matthew-puccini-1236950262/", "summary": "“The Odyssey” actor Elliot Page and “Harry Potter” filmmaker Chris Columbus have signed on as executive producers of writer and director Matthew Puccini’s award-winning short, “Callback.” The film is a dark comedy about a gay couple, played by Justin H. Min (“After Yang,” “Beef”) and Michael Hsu Rosen (“Presumed Innocent,” “The Only Living Pickpocket in [ ]", "date_str": "2026-11-17T20:06:36+00:00", "hash": "a087aac37b1582b7", "title_fa": "الیوت پیج و کریس کلمبوس هیئت مدیره کمدی عجیب و غریب تاریک \"Callback\" به عنوان تهیه کنندگان اجرایی (انحصاری)", "summary_fa": "الیوت پیج، بازیگر «اودیسه» و کریس کلمبوس، فیلمساز «هری پاتر» به عنوان تهیه‌کننده اجرایی فیلم کوتاه برنده جایزه متیو پوچینی، نویسنده و کارگردان، «کال بک» قرارداد امضا کردند. این فیلم یک کمدی تاریک درباره یک زوج همجنس گرا است که توسط جاستین اچ. مین («پس از یانگ»، «بیف») و مایکل هسو روزن («بی گناه فرض می شود»، «تنها جیب بر زنده در [ ] فیلم کوتاه برنده جایزه، با بازی جاستین اچ. مین و مایکل هسو روزن، از فیلمساز متیو پوک، ساخته شده است. الیوت پیج، بازیگر «اودیسه» و کریس کلمبوس، فیلمساز «هری پاتر» به عنوان تهیه‌کننده اجرایی فیلم کوتاه برنده جایزه متیو پوچینی، نویسنده و کارگردان، «کال بک» قرارداد امضا کردند. پیج در بیانیه‌ای در روز سه‌شنبه گفت: «از لحظه‌ای که شروع می‌شود، «بازگشت به تماس» از روی صفحه می‌لرزد. \"این فیلم آرام و محدود، در عین حال سرشار از شدت احشایی، پرتره ای دردناک و خنده دار از حسادت حرفه ای و پویایی پیچیده قدرت در یک رابطه است. این افتخار است که درگیر فیلمی با چنین ساخته شده باشکوهی با دو بازی خارق العاده از جاستین اچ مین و مایکل سو باشد.\" کلمب گفت: «متیو فیلمی هوشمندانه، مطمئن و اغلب خنده دار را کارگردانی کرده است. چیزی که به عنوان یک مقدمه ساده شروع می شود، تبدیل به یک بازی لذت بخش خطرناک می شود که من را تا انتها حدس می زد. بلافاصله دوباره آن را تماشا کردم تا از تیغ نویسی و اجرای عالی لذت ببرم. من بسیار خوشحالم که کار متیو را کشف کردم و نقشی در انتشار اخبار در مورد تصویر فوق‌العاده او داشتم.»", "image_url": "https://variety.com/wp-content/uploads/2026/11/The-Odyssey-New-York-Premiere-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۶ آبان • ۲۳:۳۶"}, {"source": "Billboard", "title": "Dolly Parton Wrote a Touching Tribute to Her Mother in New Book About Forgotten Albums: Shop It Here", "link": "https://www.billboard.com/culture/product-recommendations/on-the-records-book-dolly-parton-billie-eilish-shop-pricing-1236384144/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Many people know my mama, Avie Lee Owen Parton, from my song Coat of Many Colors , but my mama gave me a gift that was far more valuable than a colorful coat. She gave me the gift of music. That’s how Dolly Parton begins her passage about her mother’s musical legacy in On the Records: 80 Musicians on Beloved and Overlooked Albums . Written before her Aug. 25 death , the country music legend recalled inviting her mother to Fireside Recording Studio in Nashville in 1973 to record some of the Appalachian Mountains songs she cherished. Parton explained that the album was never released at the time, but the tapes were eventually published posthumously in 2024 as Mama Sings (Smoky Mountain DNA Series) , 21 years after her mother’s death. Published Tuesday (Nov. 17), the new music book brings together 80 celebrated musicians including Billie Eilish, Chris Stapleton and Laufey sharing overlooked albums, hidden gems and personal favorites they believe deserve greater recognition. HARDCOVER BOOK On the Records: 80 Musicians on Beloved and Overlooked Albums No. 1 Bestseller $27.96 $30 7% off Buy Now at bookshop.org $29.99 Buy Now at amazon $29.99 Buy Now at target $30 Buy Now at Barnes Noble A quintessential coffee-table book, the $30 hardcover features full-color photography and artwork for each overlooked album, and is already a No. 1 bestseller on Amazon. Alongside Dolly Parton, contributors include Erykah Badu on Prince, Billie Eilish on The Dø, Finneas on Feist, Brian Eno on The Consolers, Chris Stapleton on Tim O Brien and Darrell Scott, Sonny Rollins on Fats Waller, Laufey on Chet Baker, Angélique Kidjo on Bella Bellow and Justin Vernon of Bon Iver on Paul Pena. Written by Brian Beck with Piotr Orlov, the collection offers music fans a chance to discover underrated recordings through the artists who adore them. Sophie Dunne/Billboard The Full List of Contributors Featured in On the Records: 80 Musicians on Beloved and Overlooked Albums Adrian Sherwood Adrianne Lenker (Big Thief) Alynda Segarra (Hurray for the Riff Raff) Angélique Kidjo Anoushka Shankar Anthony Davis Arooj Aftab Béla Fleck Benjamin Gibbard (Death Cab for Cutie, The Postal Service) Bettye LaVette Billie Eilish Brendan Yates (Turnstile) Brian Eno Brittany Howard (A", "date_str": "2026-11-17T19:57:32+00:00", "hash": "12ec3de01e43eb52", "title_fa": "دالی پارتون در کتاب جدیدی درباره آلبوم های فراموش شده ادای احترامی برای مادرش نوشت: از اینجا خرید کنید", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند.
