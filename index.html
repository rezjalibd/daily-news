<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۱۸ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۱۸ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۹ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۰۲:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۴۵</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۰۸</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۵۵</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

اب این شهر به اتهام «محاربه» به اعدام و بابت ... به گزارش خبرگزاری هرانا، ارگان خبری مجموعه فعالان حقوق بشر در ایران، این حکم ۱۱ آبان ۱۴۰۵ از سوی شعبه اول دادگاه انقلاب اهواز به ریاست قاضی احسان ادیبی‌مهر صادر شده است. بر اساس حکم دادگاه، پارسا به اتهام محاربه از طریق مشارکت در تخریب یک بانک دولتی در اهواز به اعدام محکوم شده است. دادگاه همچنین او را به اتهام شرکت در تجمعات غیرقانونی به ۱۰ سال حبس و به اتهام همکاری با دول متخاصم به ۱۰ سال حبس دیگر محکوم کرده است. یک منبع مطلع نزدیک به این شهروند به هرانا گفته است که پارسا در جریان رسیدگی قضایی به پرونده‌اش از حق دسترسی به وکیل تعیینی محروم بوده است. به گفته این منبع، شامگاه ۱۸ دی ۱۴۰۴ و هم‌زمان با اعتراضات در اهواز، یک بانک دولتی تخریب شد و پس از آن برای شماری از معترضان پرونده قضایی تشکیل شد. محمدمهدی پارسا، اهل قلعه‌تل در استان خوزستان، ۲۱ دی ۱۴۰۴ در اهواز بازداشت و سپس به زندان شیبان منتقل شد. او همچنان در این زندان محبوس است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Poonak_Tehran_2026_gYKR__v1024x512__box_0%2C288%2C1279%2C960.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۸ آبان • ۰۰:۱۲"}, {"source": "Iran International", "title": "هرتزوگ با هشدار درباره تهدیدهای جمهوری اسلامی، آیزنکوت را مامور تشکیل دولت کرد", "link": "https://www.iranintl.com/202611087398", "summary": "اسحاق هرتزوگ، رییس‌جمهوری اسرائیل، با هشدار درباره ادامه تهدیدهای جمهوری اسلامی، ماموریت تشکیل دولت را به گادی آیزنکوت واگذار کرد. آیزنکوت نیز با تاکید بر باز بودن جبهه‌های جنگ و محقق نشدن اهداف آن، خواستار تشکیل فوری دولت اضطراری ملی شد.", "date_str": "2026-11-08T19:57:43+00:00", "hash": "7763b7bdd1f65233", "title_fa": "هرتزوگ با هشدار درباره تهدیدهای جمهوری اسلامی، آیزنکوت را مامور تشکیل دولت کرد", "summary_fa": "اسحاق هرتزوگ، رییس‌جمهوری اسرائیل، با هشدار درباره ادامه تهدیدهای جمهوری اسلامی، ماموریت تشکیل دولت را به گادی آیزنکوت واگذار کرد. آیزنکوت نیز با تاکید بر باز بودن جبهه‌های جنگ و محقق نشدن اهداف آن، خواستار تشکیل فوری دولت اضطراری ملی شد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/e8ad436db16c356d4b121c4e76ebe54451b9bdc3-3822x2548.jpg?rect=0,271,3822,2007&w=1200&h=630&q=66&fit=max&auto=format", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۷ آبان • ۲۳:۲۷"}, {"source": "Radio Farda", "title": "وزیر خارجه عراق: آمریکا از ما خواسته بیشتر گذرگاه‌های مرزی با ایران را مسدود کنیم", "link": "https://www.radiofarda.com/a/fuad-hussein-us-asks-iraq-to-shut-most-iran-border-crossings/33893352.html", "summary": ".", "date_str": "2026-11-08T20:18:04+00:00", "hash": "6895fb1892265993", "title_fa": "وزیر خارجه عراق: آمریکا از ما خواسته بیشتر گذرگاه‌های مرزی با ایران را مسدود کنیم", "summary_fa": "فؤاد حسین، وزیر امور خارجه عراق، روز یکشنبه ۱۷ آبان در گفت‌وگو با شبکه الجزیره اعلام کرد وزارت خزانه‌داری آمریکا از بغداد خواسته در چارچوب سیاست واشینگتن برای افزایش فشار اقتصادی بر تهران، تمامی گذرگاه‌های مرزی با ایران به‌جز دو گذرگاه را ببندد. یکی از این دو گذرگاه مستثناشده در منطقه اقلیم کردستان قرار دارد. حسین گفت: «گذرگاه‌های مرزی رسمی و غیررسمی زیادی میان عراق و ایران وجود دارد و بستن همه آن‌ها دشوار خواهد بود و بر اقتصاد ما تأثیر می‌گذارد. آمریکایی‌ها همچنان خواستار بسته شدن این گذرگاه‌ها هستند و ما در حال حاضر در حال مذاکره با آن‌ها هستیم.» عراق اواخر مهرماه گذرگاه مرزی شِیب، چذابه در ایران، را که یکی از گذرگاه‌های پرتردد میان دو کشور است، به‌منظور بازبینی تدابیر امنیتی و نصب تجهیزات بازرسی برای جلوگیری از قاچاق، به‌طور موقت بست و شبکه الجزیره به نقل از یک مقام عراقی اعلام کرد که این اقدام به دستور مستقیم علی الزیدی، نخست‌وزیر عراق، انجام شده است. اظهارات وزیر خارجه عراق درباره فشار دولت دونالد ترامپ یک روز بعد از آن است که فرماندهی مرکزی ارتش آمریکا، سنتکام، اعلام کرد کارگروه جدید برای جلوگیری از انتقال تسلیحات پیشرفته، فناوری‌های دارای کاربرد دوگانه و دیگر اقلام مشمول تحریم از طریق مرزهای زمینی ایران و دریای خزر تشکیل می‌دهد. سنتکام اعلام کرد که این کارگروه نظامی ـ غیرنظامی با عنوان «دروازه آهنین» به دستور دریاسالار برد کوپر، فرمانده این نهاد، تشکیل می‌شود، حدود ۲۰ عضو نظامی و غیرنظامی خواهد داشت و در شهر تامپا در ایالت فلوریدا مستقر خواهد شد. این تصمیم در ادامهٔ محاصرهٔ دریایی بنادر جنوب ایران از سوی آمریکا است که پس از آغاز جنگ میان دو کشور، در دو مرحله به اجرا درآمده و واشینگتن می‌گوید صادرات نفت و منابع درآمدی جمهوری اسلامی را به‌شدت محدود کرده است. نخستین مرحلهٔ محاصرهٔ دریایی بنادر ایران روز ۲۴", "image_url": "https://gdb.rferl.org/035c0000-0aff-0242-0005-08da1ed6d966_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۷ آبان • ۲۳:۴۸"}, {"source": "IranWire", "title": "خبرگزاری ایرنا از شنیده شدن صدای چهار انفجار در قشم خبر داد", "link": "https://iranwire.com/fa/news-1/159956-%D8%AE%D8%A8%D8%B1%DA%AF%D8%B2%D8%A7%D8%B1%DB%8C-%D8%A7%DB%8C%D8%B1%D9%86%D8%A7-%D8%A7%D8%B2-%D8%B4%D9%86%DB%8C%D8%AF%D9%87-%D8%B4%D8%AF%D9%86-%D8%B5%D8%AF%D8%A7%DB%8C-%DA%86%D9%87%D8%A7%D8%B1-%D8%A7%D9%86%D9%81%D8%AC%D8%A7%D8%B1-%D8%AF%D8%B1-%D9%82%D8%B4%D9%85-%D8%AE%D8%A8%D8%B1-%D8%AF%D8%A7%D8%AF/", "summary": "خبرگزاری ایرنا شامگاه یکشنبه ۱۷ آبان ۱۴۰۵ از شنیده‌شدن صدای چهار انفجار در جزیره قشم خبر داد و نوشت به نظر می‌رسد نقاطی در این جزیره هدف ...", "date_str": "2026-11-08T19:37:18+00:00", "hash": "11b42b8def5153b6", "title_fa": "خبرگزاری ایرنا از شنیده شدن صدای چهار انفجار در قشم خبر داد", "summary_fa": "خبرگزاری ایرنا شامگاه یکشنبه ۱۷ آبان ۱۴۰۵ از شنیده‌شدن صدای چهار انفجار در جزیره قشم خبر داد و نوشت به نظر می‌رسد نقاطی در این جزیره هدف ... ایرنا به نقل از خبرنگار خود در قشم گزارش داد که دقایقی پیش صدای چهار انفجار در این جزیره شنیده شده است. به نوشته این خبرگزاری، منابع محلی و استانی تا زمان انتشار گزارش درباره این حادثه اظهارنظری نکرده‌اند. در همین حال، حساب کاربری وحید آنلاین با انتشار پیام‌های دریافتی مخاطبان خود، از شنیده‌شدن چهار تا پنج صدای انفجار در ساعت ۲۲:۴۵ یکشنبه خبر داد. بر اساس این پیام‌ها، صدای انفجارها در نقاطی از قشم و بندرعباس شن یکا، روز یکشنبه گفت در صورتی که مذاکرات درباره برنامه هسته‌ای جمهوری اسلامی و بازگشایی تنگه هرمز پیشرفت کند ...", "date_str": "2026-11-08T18:11:47+00:00", "hash": "0c4fe321ea66adde", "title_fa": "ترامپ: احتمال بازگشت به جنگ با ایران بسیار کم است", "summary_fa": "دونالد ترامپ، رییس‌جمهوری آمریکا، روز یکشنبه گفت در صورتی که مذاکرات درباره برنامه هسته‌ای جمهوری اسلامی و بازگشایی تنگه هرمز پیشرفت کند ... ترامپ در گفت‌وگوی تلفنی ۲۰ دقیقه‌ای با جیم شوتو، خبرنگار سی‌ان‌ان، گفت تصمیم درباره بازگشت به جنگ به این بستگی دارد که جمهوری اسلامی یک توافق «بسیار محکم» را امضا کند یا نه. او چندین بار احتمال از سرگیری حملات را بسیار کم توصیف کرد، اما افزود: «اگر لازم باشد این کار را انجام می‌دهم، اما ما ضربات بسیار سختی به آن‌ها وارد کردیم.» ترامپ همچنین گفت جمهوری اسلامی از نظر اقتصادی در حال فرسایش است و آمریکا از نظر نظامی به این کشور ضربه زده است. او افزود واشینگتن توانایی آن را دارد که کار ایران را تمام کند. رییس‌جمهوری آمریکا در این مصاحبه گفت سه ناو هواپیمابر آمریکایی در منطقه مستقر هستند و یکی از آن‌ها به‌ تازگی به منطقه رسیده است. او تاکید کرد نیروهای آمریکایی برای عملیات نظامی آماده‌اند. ترامپ همچنین از شناسایی اهداف زیرساختی در ایران برای حملات احتمالی خبر داد و گفت آمریکا ۳۸ پل را شناسایی کرده که می‌تواند ظرف یک ساعت منهدم کند. او با این حال گفت تمایلی به تخریب زیرساخت‌های ایران ندارد، زیرا بازسازی آن‌ها ممکن است ۱۰ سال طول بکشد. ترامپ افزود ساخت پل از دشوارترین کارهاست و گفت علاقه‌ای به ویران کردن آن‌ها ندارد. ترامپ در بخش دیگری از این مصاحبه گفت پدافند هوایی جمهوری اسلامی به‌طور کامل از بین رفته و ایران دیگر سامانه‌های ضدهوایی در اختیار ندارد. او همچنین گفت توان موشکی جمهوری اسلامی به حدود ۱۰ درصد و ظرفیت پهپادی آن به حدود ۱۵ درصد کاهش یافته است. به گفته ترامپ، بخش بزرگی از کارخانه‌های تولیدی ایران در حملات نظامی از بین رفته‌اند. این اظهارات در حالی مطرح می‌شود که هشت ماه پس از آغاز جنگ، درگیری میان آمریکا و جمهوری اسلامی", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/donald-trump-who-is-he-after-next-2026_mSii__v1024x512__box_0%2C143%2C200 ه نهادهای دولتی هشدار داد. رهبر حزب یاشار اعلام کرد با استفاده از ماموریتی که به او سپرده شده، برای تشکیل یک دولت اضطراری ملی اقدام خواهد کرد و این هدف به ابتکارهای سیاسی خلاقانه و خارج از چارچوب‌های معمول نیاز دارد. آیزنکوت همچنین از همه فراکسیون‌های پارلمانی، از جمله نمایندگان احزاب حامی نتانیاهو، دعوت کرد در صورت پذیرش اصول چهارگانه پیشنهادی او، از دولت آینده حمایت کنند. او تاکید کرد اتحاد ملی نباید به ابزاری برای چانه‌زنی سیاسی تبدیل شود و همه احزاب باید برای تشکیل دولت آماده مصالحه باشند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B8%DB%B8%DB%B8%DB%B8%DB%B8_nKCr__v1024x512__box_0%2C147%2C2048%2C1223.jpeg", "category": "موسیقی و هنر", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۷ آبان • ۱۹:۳۰"}, {"source": "Euronews Persian", "title": "تصادف قطار در مصر؛ ۴ کشته و حدود ۹۰ زخمی در جنوب قاهره", "link": "https://parsi.euronews.com/2026/11/08/train-accident-in-egypt-4-dead-and-about-90-injured-south-of-cairo", "summary": "مقام‌های مصر می‌گویند روز یکشنبه در پی برخورد دو قطار در جنوب قاهره، پایتخت این کشور دستکم چهار نفر کشته و دست‌کم ۸۸ نفر دیگر مجروح شدند.", "date_str": "2026-11-08T16:49:34+00:00", "hash": "b994ddee6af3070e", "title_fa": "تصادف قطار در مصر؛ ۴ کشته و حدود ۹۰ زخمی در جنوب قاهره", "summary_fa": "مقام‌های مصر می‌گویند روز یکشنبه در پی برخورد دو قطار در جنوب قاهره، پایتخت این کشور دستکم چهار نفر کشته و دست‌کم ۸۸ نفر دیگر مجروح شدند.", "image_url": "https://images.euronews.com/articles/stories/09/98/46/87/1200x675_cmsv2_52ff1a40-6443-565e-803b-c7f98a0a526b-9984687.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۷ آبان • ۲۰:۱۹"}, {"source": "Euronews Persian", "title": "وزیر خارجه فرانسه: اروپایی‌ها پای میز مذاکره ابوظبی درباره اوکراین حاضر خواهند بود؛ ملانشون سخنگوی کرملین است", "link": "https://parsi.euronews.com/2026/11/08/french-foreign-minister-says-europeans-will-be-present-at-abu-dhabi-ukraine-negotiating", "summary": "ژان‌نوئل بارو، وزیر خارجه فرانسه اعلام کرد که کشورهای ار ملیات نظامی سال ۱۹۵۶ در منطقه سینا، در کوه هرتزل، گفت ایران در تلاش است برنامه دستیابی به سلاح هسته‌ای را از سر بگیرد و هم‌زمان اقدامات دیگری انجام می‌دهد که به گفته او، تهدیدی جدی و واقعی برای اسراییل محسوب می‌شوند. وزیر دفاع اسراییل با تاکید بر این‌که کشورش نمی‌تواند چنین تهدیدهایی را بپذیرد، گفت: «وظیفه ما این است که برای هر سناریویی آماده باشیم و برای حفاظت از شهروندان اسراییل، در صورت لزوم اقدام کنیم.» او با اشاره به ماموریت‌های پیش‌روی اسراییل، خواستار اتحاد داخلی شد و افزود دشمنان این کشور باید بدانند که اختلاف‌نظرهای داخلی مانع ایستادگی متحد اسراییلی‌ها در برابر تهدیدهای خارجی نخواهد شد. کاتس گفت: «این زمان، زمان اتحاد، مسوولیت‌پذیری و همبستگی متقابل است.» این اظهارات در شرایطی مطرح می‌شود که بنیامین نتانیاهو، نخست‌وزیر اسراییل، شنبه‌شب از احزاب موسوم به «بلوک تغییر» به رهبری گادی آیزنکوت، رییس حزب یاشار، خواست برای تشکیل یک دولت وحدت ملی با او همکاری کنند. نتانیاهو در عین حال تاکید کرده است که چنین دولتی باید شامل متحدان راست افراطی و احزاب یهودی افراطی ارتدوکس او نیز باشد. اسحاق هرتزوگ، رییس‌جمهوری اسراییل، اعلام کرده است که قرار است روز یکشنبه در مراسمی رسمی، ماموریت تشکیل دولت جدید را به آیزنکوت واگذار کند. یسرائیل کاتس از اعضای حزب لیکود به رهبری نتانیاهو است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B2_iZEJ__v1024x512__box_0%2C0%2C1200%2C631.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۷ آبان • ۱۸:۳۸"}, {"source": "IranWire", "title": "هفت شهروند عرب توسط نیروهای امنیتی در ماهشهر بازداشت شدند", "link": "https://iranwire.com/fa/news-1/159950-%D9%87%D9%81%D8%AA-%D8%B4%D9%87%D8%B1%D9%88%D9%86%D8%AF-%D8%B9%D8%B1%D8%A8-%D8%AA%D9%88%D8%B3%D8%B7-%D9%86%DB%8C%D8%B1%D9%88%D9%87%D8%A7%DB%8C-%D8%A7%D9%85%D9%86%DB%8C%D8%AA%DB%8C-%D8%AF%D8%B1-%D9%85%D8%A7%D9%87%D8%B4%D9%87%D8%B1-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B4%D8% عامل استخدام شده است. فایننشال تایمز بعداً گزارش داد که مقامات آمریکایی معتقدند جنسن هوانگ رابطه عاشقانه ای با جاسوس ادعایی داشته است.", "image_url": "https://www.engadget.com/img/gallery/nvidia-is-investigating-reports-that-ceo-jensen-huang-was-the-target-of-chinese-spy-efforts/l-intro-1794172304.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۱۸ آبان • ۰۰:۴۷"}, {"source": "Engadget", "title": "Don't like Google Health's AI Coach? Here's how to turn it off", "link": "https://www.engadget.com/2309626/dont-like-google-health-ai-coach-how-turn-off/", "summary": "If this Premium feature is bugging you, there s good news: you aren t stuck with it.", "date_str": "2026-11-08T21:15:00+00:00", "hash": "007bde4e1f4bb171", "title_fa": "مربی هوش مصنوعی Google Health را دوست ندارید؟ در اینجا نحوه خاموش کردن آن آورده شده است", "summary_fa": "اگر این ویژگی Premium شما را آزار می دهد، یک خبر خوب وجود دارد: شما به آن گیر نکرده اید. Christine Persaud برای Engadget افزودن Engadget در Google: منبع ترجیحی Google Discover اگر مربی هوش مصنوعی Google Health را دوست ندارید یا به توصیه‌های همیشگی آن نیاز دارید، ساده‌ترین راه برای خلاص شدن از شر آن لغو اشتراک Google Health Premium خود است، زیرا مربی هوش مصنوعی با ردیف Google Health رایگان ارائه نمی‌شود. اما اگر بخواهید کمی آن را پنهان کنید و همچنان از مزایای دیگر Google Health Premium لذت ببرید، چه؟ اینها شامل خلاصه‌های خواب شخصی، الگوریتم‌های پیشرفته ردیابی خواب، امتیاز خواب، نگهبان سلامت است که تغییرات قابل‌توجه در سلامت و تندرستی را ردیابی می‌کند، پیش‌بینی چرخه، ردیابی تغذیه و موارد دیگر. نگران نباشید، زیرا راهی برای حفظ Google Health Premium وجود دارد، اما به‌دلیل به‌روزرسانی‌ای که در آگوست 2026 منتشر شد، به‌طور موقت (یا به‌طور دائم) مربی هوش مصنوعی مبتنی بر Gemini را در تنظیمات برنامه کنار بگذارید. این کار ساده‌ای است که به کنترل‌های حریم خصوصی خود بروید و ویژگی را خاموش کنید. و هر زمان که بخواهید می توانید دوباره آن را روشن کنید. بدون این ویژگی، راهنمایی، توصیه‌ها یا خلاصه‌های شخصی را دریافت نخواهید کرد، که یکی از ویژگی‌های کلیدی Premium در صورت استفاده در کنار ردیاب‌هایی مانند Fitbit Edge جدید است (به بررسی Fitbit Edge ما مراجعه کنید). همچنین نمی‌توانید برای پرسیدن سؤالات و گپ زدن با مربی در مورد سلامتی و تندرستی خود، روی دکمه سؤال از مربی ضربه بزنید. این همچنین به این معنی است که نمی‌توانید از این عملکرد برای ثبت وعده‌های غذایی خود استفاده کنید، اگرچه می‌توانید این کار را از طریق ثبت دستی انجام دهید. هیچ یک از داده های قبلی شما حذف نمی شود و همانطور که گفته شد، می توانید AI Coach را در هر زمانی", "image_url": "https://www.engadget.com/img/gallery/dont-like-google-healths-ai-coach-heres-how-to-turn-it-off/l-intro-1793989213.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۱۸ آبان • ۰۰:۴۵"}, {"source": "Engadget", "title": "At what length do DisplayPort cables start giving you trouble?", "link": "https://www.engadget.com/2309296/what-length-displayport-cable-start-giving-trouble/", "summary": "If you re on the market for a new DisplayPort cable, it s worth keeping in mind that longer doesn t always mean better. This length is when trouble begins.", "date_str": "2026-11-08T21:00:00+00:00", "hash": "7dce2d70829c5046", "title_fa": "کابل های DisplayPort از چه طولی شروع به ایجاد مشکل می کنند؟", "summary_fa": "اگر به دنبال کابل DisplayPort جدید هستید، باید به خاطر داشته باشید که طولانی‌تر شدن همیشه به معنای بهتر نیست. این طول زمانی است که مشکل شروع می شود. هرچه کابل DisplayPort طولانی‌تر شود، کیفیت بصری پایین‌تر خواهد بود Alina Vytiuk/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover اگرچه اتصالات ویدیویی USB-C و Thunderbolt خالص در حال افزایش هستند، DisplayPort همچنان برای بسیاری از رایانه‌های Mac و Windows حکمرانی می‌کند و احتمالاً به اندازه هزینه تولید، سازگاری با آن را تضمین می‌کند. برای برابری با پهنای باند بهترین فناوری DisplayPort، شرکت ها باید از USB 4 v2 یا Thunderbolt 5 استفاده کنند. صرف نظر از اینکه تولید آن ذاتاً گران‌تر است یا خیر، مردم همچنین تمایل دارند که از طریق USB-C و Thunderbolt تحویل برق داشته باشند، در حالی که DisplayPort می‌تواند منحصراً در مورد ویدیو باشد. نگرانی اصلی در مورد هر فرمت ویدیویی این است که یک سیگنال تمیز تا چه اندازه می تواند ارائه شود. برای مثال، با HDMI، اتصالات می توانند از 25 فوت (اگر نه خیلی زودتر) فراتر بروند. هنگامی که کابل مناسب کار نیست، نتیجه می تواند مشکلاتی مانند مصنوعات، سوسو زدن یا قطع کامل اتصالات باشد. متناوبا، نمایشگر ممکن است به طور خودکار وضوح و نرخ تازه‌سازی را کاهش دهد. با DisplayPort، اگر می‌خواهید حداکثر کیفیت را حفظ کنید، محدودیت‌ها می‌توانند بسیار واضح باشند. راه‌هایی برای دور زدن آنها وجود دارد، اما احتمالاً برای اکثر تنظیمات محاسباتی ارزش پولی ندارند. Adam Berry/Getty Images کابل استاندارد DisplayPort مبتنی بر مس باید تا 6 فوت جامد باشد. منظور ما از جامد، توانایی نمایش هر رزولوشن، رنگ یا ترکیبی با نرخ تازه‌سازی است که می‌توانید به طور واقعی درخواست کنید، مانند 4K HDR در 144 هرتز. شما نباید در این راه‌اندازی با مصنوعات یا مشکلات دیگری مواجه شوید، از آسیب فیزیکی یا تداخل شدیدی که", "image_url": "https://www.engadget.com/img/gallery/at-what-length-do-displayport-cables-start-giving-you-trouble/l-intro-1793908349.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۸ آبان • ۰۰:۳۰"}, {"source": "Zoomit", "title": "جایگزین متن‌باز و خصوصی برای دیسکورد؛ تمام پیام‌ها در سرور خودتان ذخیره می‌شوند", "link": "https://www.zoomit.ir/software-news/470700-haven-open-source-discord-alternative/", "summary": "Haven ابزار ارتباطی متن‌باز و خودمیزبانی است که قابلیت‌های دیسکورد را با کنترل کامل داده‌ها و بدون ردیابی در اختیار کاربران می‌گذارد.", "date_str": "2026-11-08T21:40:00+00:00", "hash": "4c619832720157e2", "title_fa": "جایگزین متن‌باز و خصوصی برای دیسکورد؛ تمام پیام‌ها در سرور خودتان ذخیره می‌شوند", "summary_fa": "Haven ابزار ارتباطی متن‌باز و خودمیزبانی است که قابلیت‌های دیسکورد را با کنترل کامل داده‌ها و بدون ردیابی در اختیار کاربران می‌گذارد. تبلیغات ابزار متن‌باز جدیدی به نام Haven معرفی شده است که امکاناتی شبیه دیسکورد، ازجمله چت گروهی، تماس صوتی و اشتراک‌گذاری صفحه‌نمایش ر -essentials-packing-list-2026-11", "summary": "The author shares her packing essentials for overnight Amtrak trips. Joey Hadden/Business Insider I've never been without a camera on an overnight Amtrak train. I've never gone to bed without doing my whole skincare routine. I've never packed a pair of binoculars, but I will next time. Comfort, ease, and enjoyment. I pack for every overnight Amtrak trip with these three things in mind. And after 128 hours of experience, I've figured out the essentials for a fantastic experience. I've traveled through 15 states, from the East Coast to the West, in Amtrak sleeper cars. I've stayed in roomettes — roughly 20-square-foot private cabins with two seats, two beds, a table, and a sink and vanity — and bedrooms, which are double the size and also include a full bathroom. My packing list has evolved over the years. Some items have been with me since the beginning. Others come from lessons learned along the way. I ve been packing a comfy outfit separately from the rest of my clothes since my first overnight train ride. Joey Hadden/Business Insider You won't catch me dressed to impress on an overnight train . I prefer to spend long days on the rails in my coziest garments. But I don't want to fish through my luggage to find them once on board. I make it easier on myself by putting a pair of sweatpants, a pair of basketball shorts, a soft T-shirt, and undergarments in a small packing cube at the top of my suitcase. I ve never boarded an overnight Amtrak train without video games. Joey Hadden/Business Insider Entertainment is everything when you're stuck in place for dozens of hours. One thing that makes my cabin feel more like home is packing activities I often enjoy in my own living room. So I always pack my Nintendo Switch. The portable console is thin enough to slide easily into a tight crevice in my bag. It's loaded with all types of games to satisfy every mood, from \"Animal Crossing\" and various Pokémon titles to the \"BioShock\" series and \"Red Dead Redemption,\" to name a few. I always have a journal on me. Joey Hadden/Business Insider I've only traveled solo on overnight trains, so I spend a lot of time thinking. I rarely make time for journaling in my daily life, but on trains I indulge in the opportunity to write out my thoughts uninterrupted. And the ever-changing view out the window is a constant source of inspiration. My camera has been my sidekick since the beginning. Joey Hadden/Business Insider On overnight trains, I spend more time with my camera in hand t", "date_str": "2026-11-08T18:14:01+00:00", "hash": "bc62018de6acc5b8", "title_fa": "من 128 ساعت را در قطارهای خواب آمتراک گذرانده ام. در اینجا 6 مورد ضروری که من همیشه بسته بندی کرده ام و 4 موردی که در طول راه کشف کرده ام وجود دارد.", "summary_fa": "نویسنده وسایل ضروری بسته بندی خود را برای سفرهای شبانه Amtrak به اشتراک می گذارد. Joey Hadden/Business Insider من هرگز در قطار شبانه Amtrak بدون دوربین نبودم. من هرگز بدون انجام تمام روال مراقبت از پوستم به رختخواب نرفتم. من هرگز یک جفت دوربین دوچشمی بسته بندی نکرده ام، اما دفعه بعد این کار را خواهم کرد. آسایش، راحتی و لذت. من برای هر سفر یک شبه آمتراک با در نظر گرفتن این سه چیز، بسته بندی می کنم. و پس از 128 ساعت تجربه، به نکات ضروری برای یک تجربه فوق العاده پی بردم. من از طریق 15 ایالت، از ساحل شرقی تا غرب، با ماشین های خواب آمتراک سفر کرده ام. من در اتاق‌های کوچک - کابین‌های خصوصی تقریباً 20 فوت مربعی با دو صندلی، دو تخت، یک میز، و یک سینک و روشویی - و اتاق‌خواب‌هایی که اندازه آنها دو برابر است و همچنین شامل یک حمام کامل است، اقامت کرده‌ام. لیست بسته بندی من در طول سال ها تکامل یافته است. برخی از موارد از ابتدا همراه من بوده است. برخی دیگر از درس هایی می آیند که در طول مسیر آموخته اند. من از اولین سفر شبانه‌ام با قطار، یک لباس راحت جدا از بقیه لباس‌هایم بسته‌بندی کردم. جوی هادن/بیزینس اینسایدر شما مرا با لباس پوشیدن نمی‌گیرید تا در قطار شبانه تحت تأثیر قرار بگیرم. من ترجیح می دهم روزهای طولانی را با دنج ترین لباس هایم روی ریل بگذرانم. اما من نمی خواهم از طریق چمدانم ماهی بگی ares of Tesla and SpaceX tumbled . Read the original article on Business Insider", "date_str": "2026-11-08T16:47:53+00:00", "hash": "9f2fa72ac3f26c6b", "title_fa": "'Saturday Night Live' ایلان ماسک را پس از شکست میان ترم کباب کرد: 'ماشین من یک تلنگر زد!'", "summary_fa": "شنبه نایت لایو، ایلان ماسک، با بازی جرمی کولهان، را در بخش به‌روزرسانی آخر هفته‌اش برشته کرد. Win McNamee/Getty Images \"Saturday Night Live\" ایلان ماسک را برشته کرد، با بازی جرمی کولهین، در جریان \"به روز رسانی آخر هفته\". ماسک کولهن سعی کرد حواس مخاطبان را از دستپاچگی گران قیمت انتخابات میان دوره ای آمریکا منحرف کند. این بازیگر گفت: من در اخبار هستم زیرا ماشین من یک تلنگر انجام داد. ایلان ماسک یک هفته وحشتناک، وحشتناک، نه خوب و بسیار بد را پس از انتخابات میان دوره ای آمریکا پشت سر گذاشت. و «Saturday Night Live» از این فرصت استفاده کرد. خدمه «SNL» در طول بخش «به‌روزرسانی آخر هفته» خودداری نکردند، زمانی که جرمی کولهن کمدین میلیاردر فناوری را در حال بحث در مورد شکست انتخاباتی میان‌دوره‌ای آمریکا نشان داد. ماسک واقعی حداقل 446 میلیون دلار پیش از انتخابات میان دوره ای به کمیته های اقدام سیاسی محافظه کار کمک کرد، از جمله بخش بزرگی از نامزدهای محافظه کار در تگزاس. در نهایت، مهم نبود. تگزاس، در کنار چندین ایالت دیگر که به طور سنتی قرمز بودند، در این دوره از انتخابات آبی رنگ شدند. در طول این بخش، کالین جوست مجری برنامه گفت که ماسک به دلیل \"هدر دادن\" پول در انتخابات میان دوره ای در اخبار است. تقلید کننده گفت: \"اوه، نه، من در اخبار هستم زیرا ماشین من یک چرخش انجام داد. ماشین من یک چرخش را انجام داد، یادت هست؟ مثل یک چرخ داغ بود.\" \"مثل پوف بود! و سپس باه! اما من کاملاً خنک بودم. من مثل \"زندگی اراذل و اوباش!\" تصور کنید.\" تسلا در ماه اکتبر با تکان دادن آن در هوا در جریان تظاهرات، نسل بعدی رودستر خود را به رخ کشید. ماسک کولهین زمانی که از تصمیمش برای توقف تولید سایبرتراک تسلا پرسیده شد، پاسخ مشابهی داشت. ماسک دو روز پس", "image_url": "https://i.insider.com/6af084108f37e8e0b5bab1be?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۷ آبان • ۲۰:۱۷"}, {"source": "Business Insider", "title": "I was an international flight attendant. At 36, I'm a part-time receptionist, and I'm happier than ever.", "link": "https://www.businessinsider.com/flight-attendant-receptionist-career-change-happier-2026-11", "summary": "The author retired from her flight attendant career and is now happier. Courtesy of the author I spent years working as an international flight attendant, constantly traveling and chasing success. I traded my demanding career for a part-time receptionist job with a much calmer routine. At 36, I'm happier prioritizing my mental health, marriage, and the small joys of everyday life. I was born in a small town in Ukraine , raised with the quiet, persistent belief that to succeed, I had to work three times harder than anyone born in a big city. In my early adulthood, my biggest mistake was assuming that only major cities could offer real opportunities — and that I could simply squeeze my mental health into my schedule whenever I happened to have time for it. Moving to Kyiv in my early 20s felt like the ultimate dream: a chance to prove I belonged. But to survive there, I felt I had to fit a precise, demanding system. It wasn't enough to simply stay healthy; you were expected to hold a premium membership at a high-end fitness center just to prove your worth to others. You had to maintain an active, highly visible social life, eat at the right places, and project total composure. Everything was about trying to impress others. I chased corporate beauty standards, ignoring every warning sign of burnout After I graduated from college , I set my sights on becoming an international flight attendant for Ukraine's national carrier. When I landed the job, I thought I had made it. Instead, impostor syndrome hit me on day one. I felt like I was constantly falling behind my peers, so I ran as fast as I could to outrun the feeling. The author trained to be a flight attendant in her home country. Courtesy of the author I improved my English, started learning Spanish , and took on a summer schedule so punishing I was barely ever home. I spent years living out of a suitcase, navigating time zone changes, early-morning wake-up calls, and strict corporate beauty standards . I measured my worth entirely by my exhaustion, treating a packed calendar as proof that I mattered. Saying \"no\" to friends because of work became a badge of honor. Looking back, I knew I was burning out, but I was too overwhelmed to stop. I believed that as long as I was busy, I was safe from failure. I had my first panic attack Then, life shifted violently. After having my son, the pandemic grounded the aviation industry. Not long after, war broke out in Ukraine . We didn't choose to leave our home or plan t", "date_str": "2026-11-08T16:40:01+00:00", "hash": "dff07d66e4ca3f23", "title_fa": "من یک مهماندار بین المللی بودم. در 36 سالگی، من یک پذیرش نیمه وقت هستم و خوشحال تر از همیشه هستم.", "summary_fa": "این نویسنده از حرفه مهمانداری خود بازنشسته شد و اکنون شادتر است. با حسن نیت نویسنده من سالها به عنوان مهماندار بین المللی کار کردم و دائماً در سفر بودم و به دنبال موفقیت بودم. من شغل سخت خود را با یک شغل نیمه وقت پذیرش با یک روال بسیار آرام تر عوض کردم. در 36 سالگی، از اولویت دادن به سلامت روان، ازدواج، و شادی های کوچک زندگی روزمره خوشحال تر هستم. من در شهر کوچکی در اوکراین به دنیا آمدم و با این باور آرام و مداوم بزرگ شدم که برای موفقیت باید سه برابر بیشتر از هر کسی که در یک شهر بزرگ متولد شده است کار کنم. در اوایل بزرگسالی، بزرگ‌ترین اشتباه من این بود که تصور می‌کردم فقط شهرهای بزرگ می‌توانند فرصت‌های واقعی را ارائه دهند - و اینکه من به سادگی می‌توانم سلامت روانم را در برنامه‌ام قرار دهم هر زمان که برای آن وقت داشتم. نقل مکان به کیف در اوایل دهه 20 زندگی‌ام مانند آرزوی نهایی بود: فرصتی برای اثبات تعلقم. اما برای زنده ماندن در آنجا، احساس می‌کردم باید یک سیستم دقیق و سخت را بسازم. فقط سالم ماندن کافی نبود. از شما انتظار می رفت که یک عضویت ممتاز در یک مرکز تناسب اندام سطح بالا داشته باشید تا ارزش خود را به دیگران ثابت کنید. sing, and I regret not encouraging them to try club sports, too. Do you have a parenting regret? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. I reluctantly signed my son up for a club team My son started playing soccer during recess at school. Before long, he was taking a skills class and playing soccer after school, too. Then came a rec team. He had fun, but I didn't feel like the parent leading the team had enough coaching experience to help him improve. My son trained hard in our backyard and at school, and his skills soon surpassed his teammates. In fourth grade, he asked to try out for a club with an advanced travel team. He already had a passion for the sport and showed talent, but I still hesitated before saying yes. The cost and grueling schedule gave me pause, and I wasn't sure I wanted him to focus heavily on one activity while he was s", "date_str": "2026-11-08T14:51:01+00:00", "hash": "226d357911e5b324", "title_fa": "از ورزش های باشگاهی به دلیل هزینه و زمان صرف اجتناب کردم. حالا کاش زودتر شروع میکردم", "summary_fa": "نویسنده ورزش های باشگاهی را برای سه فرزند اول خود در اولویت قرار نداده است. اکنون چهارمین تیم او در یک تیم فوتبال پیشرفت می کند، و او گفت که پشیمان است که در گذشته آنها را جدی تر در نظر نگرفته است. با حسن نیت از جیمی دیویس اسمیت. هزینه زیاد و تعهدات زمانی باعث شد که از ورزش های باشگاهی و تیم های مسافرتی با بچه های بزرگتر خودداری کنم. وقتی کوچکترین من شروع به پیشی گرفتن از هم تیمی هایش در لیگ قهرمانان کرد، تصمیم گرفتم به ورزش باشگاهی بپردازم. او خیلی بیشتر از بازی یاد می‌گیرد و هزینه و تعهد زمانی جدی را ارزشش را دارد. وقتی بزرگ شدم، به ژیمناستیک و اسکیت روی یخ علاقه داشتم، اما هرگز به تیمی نپیوستم یا تمرین رسمی نداشتم. وقتی بچه دار شدم مخالف نبودم که هر چهار نفری اگر می خواستند ورزش کنند اما در اولویت نبود. سه بزرگ‌ترین من به ورزش دو و میدانی علاقه‌ای زودگذر نشان دادند، اما هیچ‌وقت چیزی گیر نکرد. ما فوتبال برای بچه های کوچک، تنیس در اوایل دبستان، یک تیم بسکتبال rec که هرکسی می توانست در آن راه برود، و Girls on the Run، یک برنامه غیر رقابتی برای دختران جوان را امتحان کردیم. با این حال، هیچ یک از بچه های کوچکتر من علاقه زیادی به بازی در سطح بالاتر در یک باشگاه نشان ندادند. من به طور خلاصه به ورزش های باشگاهی نگاه کردم، اما زمانی که متوجه شدم آنها هزاران دلار هزینه دارند و در شب ها و آخر هفته ها به تعهد زمانی گسترده از طرف کل خانواده نیاز دارند، علاقه خود را از دست دادم. این امر به ویژه در مورد تیم های مسافرتی که شامل مربیگری و بازی جدی تری نسبت به تیم های rec هستند صادق است. هرگز پشیمان نشدم که بچه‌هایم را برای", "image_url": "https://i.insider.com/6aeb726d308912814ed70e0a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۷ آبان • ۱۸:۲۱"}, {"source": "Business Insider", "title": "I went from owning a home in a small town to renting in a big city. Life costs more, but it feels richer.", "link": "https://www.businessinsider.com/owned-home-small-town-now-renting-big-city-washington-dc-2026-11", "summary": "Years ago, I never would have imagined myself living in a city or happily raising a child here. Renate Flanagan I went from owning a house in a small town in Virginia to renting an apartment in Washington, DC . Living in an apartment and in a big city has been better than I expected, with some nice perks. I love having easy access to nature, a diverse mix of restaurants, and public transportation in DC. I grew up in a fairly small, somewhat rural community in central Virginia, about two hours from Washington, DC. And, in my early 20s, I got married and bought a house there. But when I got divorced at 30, I wanted to start over somewhere new. Stars seemed to align when I got a new position at my company that required me to relocate to Washington, DC . I was happy to do it and officially moved to DC in 2021. Although my hometown wasn't that far from the nation's capital, the two places felt like night and day — and a lot of my worries about living in a big city turned out to be unfounded. City livi  جیجی حدید، داکوتا جانسون، ایتان هاوک، ام‌جی‌کی، جیسون گرافلو، کاملاو، کامیل و سایرین بود. A-listers. سوئیفت و کلوس اولین بار در اوایل دهه 2010 با هم آشنا شدند و به سرعت با هم دوست شدند (رابطه آنها حتی الهام بخش جلد 2015 Vogue با عنوان \"در جاده با بهترین دوستان تیلور سویفت و کارلی کلوس\" شد). کلوس در همان سال در موزیک ویدیوی \"Bad Blood\" سوئیفت ظاهر شد و یکی از اعضای اصلی \"گروه دختران\" \"1989\" نوازنده بود که به طور مرتب در کنسرت ها و رویدادها با هم شرکت می کردند. در سپتامبر، سوئیفت در اولین بازی فصل چیفز شرکت کرد، که طی آن به دلیل نشستن در کنار تام کروز، تیتر خبرها شد. کروز در حین حضور در برنامه \"The Tonight Show\" پس از بازی به جیمی فالون گفت: \"او به من در مورد فوتبال آموزش می داد. در واقع.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/New-York-Jets-v-Kansas-City-Chiefs-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۰۰:۰۹"}, {"source": "Billboard", "title": "Taylor Swift and Karlie Kloss Attend Travis Kelce’s Chiefs Game in Kansas City", "link": "https://www.billboard.com/music/music-news/taylor-swift-karlie-kloss-travis-kelce-chiefs-game-1236377058/", "summary": "Taylor Swift had some familiar company as she cheered on husband Travis Kelce and the Kansas City Chiefs. The 36-year-old pop superstar watched the Chiefs take on the New York Jets at Arrowhead Stadium in Kansas City on Sunday (Nov. 8), joined by longtime friend Karlie Kloss. The supermodel, 34, was also among the guests at Swift and Kelce’s July 3 wedding at Madison Square Garden in New York City. Swift and Kloss appeared in good spirits as they watched the Chiefs take the field for their ninth game of the season. The “Shake It Off” singer wore a red Chiefs sweater as she cheered on Kelce alongside her parents, Andrea and Scott Swift. Sunday’s matchup also marked a career milestone for Kelce, who made his 200th NFL appearance. Swift and Kloss first struck up a friendship in 2013, eventually becoming close enough to share the cover of Vogue in 2015. Their relationship later became the subject of speculation when they were seen together less frequently. Kloss attended one of Swift’s Eras Tour shows in 2023. “Listen, I try to protect the privacy of my friends’ personal lives,” Kloss said during a July appearance on the Today show. “But what I will say is that they’re an amazing couple and I’m so happy for them.” Sunday marked Swift’s fourth appearance at a Chiefs game this season. She previously attended the team’s Oct. 18 home game against the Los Angeles Chargers. She watched that matchup from a suite alongside musician Este Haim and basketball star Caitlin Clark. Earlier in the season, Swift attended the Chiefs’ Sept. 14 game against the Denver Broncos, where she was spotted with actor Tom Cruise. She returned to Arrowhead Stadium on Sept. 20 for the team’s matchup against the Indianapolis Colts. Swift’s Oct. 18 appearance at Arrowhead Stadium came just one day after a surprise appearance at the 2026 Academy Museum Gala in Los Angeles. There, she delivered the live debut of “The Fate of Ophelia” during a short set. The Oct. 17 event honored filmmaker John Carpenter, Colman Domingo and Charlize Theron.", "date_str": "2026-11-08T20:58:07+00:00", "hash": "ce082904c8b438c8", "title_fa": "تیلور سویفت و کارلی کلوس در بازی تراویس کلس در کانزاس سیتی شرکت کردند.", "summary_fa": "تیلور سوئیفت با تشویق شوهرش تراویس کلس و سران شهر کانزاس، شرکتی آشنا داشت. سوپراستار 36 ساله پاپ روز یکشنبه (8 نوامبر) در ورزشگاه اروهد در کانزاس سیتی، چیفز را با نیویورک جتس تماشا کرد که دوست دیرینه کارلی کلوس به آنها پیوست. این سوپرمدل 34 ساله همچنین در میان مهمانان عروسی سوئیفت و کلسه در 3 جولای در مدیسون اسکوئر گاردن در شهر نیویورک حضور داشت. سوئیفت و کلوس در حالی که شاهد حضور چیفز در زمین بازی برای نهمین بازی فصل خود بودند، با روحیه خوبی ظاهر شدند. خواننده \"Shake It Off\" در حالی که در کنار پدر و مادرش، آندریا و اسکات سویفت، کلسه را تشویق می کرد، یک ژاکت چیفز قرمز پوشید. مسابقه روز یکشنبه همچنین نقطه عطفی در حرفه ای برای کلسه بود که دویستمین بازی NFL خود را انجام داد. سوئیفت و کلوس برای اولین بار در سال 2013 با هم دوست شدند و در نهایت به قدری صمیمی شدند که در سال 2015 جلد Vogue را به اشتراک گذاشتند. رابطه آنها بعدها به موضوع حدس و گمان تبدیل شد که کمتر با هم دیده می شدند. کلوس در سال 2023 در یکی از برنامه‌های تور Eras Swift شرکت کرد. کلوس در جریان حضور در برنامه تودی در ماه ژوئیه گفت: «گوش کن، من سعی می‌کنم از حریم خصوصی زندگی شخصی دوستانم محافظت کنم. اما چیزی که من می گویم این است که آنها زوج شگفت انگیزی هستند و من برای آنها بسیار خوشحالم. یکشنبه چهارمین حضور سوئیفت در بازی چیفز در این فصل بود. او قبلاً در اکتبر این تیم شرکت کرده بود. 18 بازی خانگی مقابل لس آنجلس چارجرز. او آن مسابقه را از یک سوئیت در کنار موسیقیدان استه هایم و ستاره بسکتبال کیتلین کلارک تماشا کرد. در اوایل فصل، سوئیفت در بازی چیفز در 14 سپتامبر در مقابل دنور برونکوس", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/taylor-swift-karlie-kloss-chiefs-game-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۰۰:۲۸"}, {"source": "Billboard", "title": "Michael Jackson’s ‘Thriller’ Scares Up Highest Rank on Billboard 200 Albums Chart in More Than 40 Years", "link": "https://www.billboard.com/music/chart-beat/michael-jackson-thriller-surges-billboard-200-halloween-1236377051/", "summary": "Michael Jackson ’s Thriller vaults 13-2 on the Billboard 200 (dated Nov. 14), scoring its highest rank on the list since the spring of 1984, when it logged its 37th and final week at No. 1 on the April 14-dated list. Thriller continues to hold the record for the most weeks atop the list for an album by a singular artist. (Only the film soundtrack to West Side Story spent more weeks at No. 1: 54, in 1962-63.) Related Olivia Rodrigo’s ‘you seem pretty sad for a girl so in love’ Notches Fourth Week Atop Billboard 200 Simple Plan Are Meeting a Whole New Generation of Fans, 25 Years In Deep Purple s Ian Gillan Shares Encouraging News After Undergoing Surgery The Billboard 200 chart ranks the most popular albums of the week in the U.S. based on multi-metric consumption as measured in equivalent album units, compiled by Luminate. Units comprise album sales, track equivalent albums (TEA) and streaming equivalent albums (SEA). Each unit equals one album sale, or 10 individual tracks sold from an album, or 2,500 ad-supported or 1,000 paid/subscription on-demand official audio and video streams generated by songs from an album. The new Nov. 14, 2026-dated chart will be posted in full on Billboard s website on Nov. 10. For all chart news, follow @billboard and @billboardcharts on both X and Instagram. In the tracking week of Oct. 30 through Nov. 5 — thus, including Halloween — Thriller earned 55,000 equivalent album units (up 89%), boosted by seasonal spooky streams of the set’s title track, as well as new physical versions of the album that were released. Of that unit total, SEA units comprise 32,000 (up 37%, equaling 34.34 million on-demand official streams of the set’s songs; it moves 14-5 on Top Streaming Albums), album sales comprise 22,000 (up 335%; it rises 14-3 on Top Album Sales) and TEA units comprise 1,000 (up 30%). On Oct. 30, Thriller was reissued across three new vinyl variants (two color editions and a liquid-filled version) and a cassette tape. The album’s 22,000 sales for the week mark its largest single-week sales sum in nearly four years, since it shifted 23,000 (Dec. 31, 2022-dated list). Notably, of Thriller ’s 22,000 sold in the latest tracking week, vinyl purchases account for 19,000 — the album’s largest sales week on vinyl since Luminate began electronically tracking sales in 1991. With Thriller ’s jump to No. 2, Jackson has his highest rank on the Billboard 200 in more than a decade, since the posthumous album Xscape debuted and peaked at No.", "date_str": "2026-11-08T20:02:24+00:00", "hash": "a9f27f7d4d919ff9", "title_fa": "«هیجان‌انگیز» مایکل جکسون بالاترین رتبه را در بیلبورد 2  از تماشاگران جشنواره را به یاد آخرین فیلم للیو، موزیکال «موج» («لا اولا») انداخت، که به اعتراضات خشونت‌آمیز دانشجویان شیلی در سال 2018 می‌پردازد، زمانی که گاز اشک‌آور با برخی از شرکت‌کنندگان پانل در حالی که از دانشگاه خارج می‌شدند برخورد کرد. دانشجویان به اقدام اخیر دولت جناح راست پرزیدنت کاست، که کاهش بودجه در کل سیستم شامل آموزش و پرورش می شود، اعتراض داشتند. آنها همچنین خواستار استعفای فرناندو رباط وزیر دادگستری به دلیل کاهش مجازات وی برای مجرمان جنسی کودکان و ناقضان حقوق بشر شدند. در میان 9 عکس شیلیایی حاضر در رقابت، جایزه بهترین فیلم به مستند \"مونگوئن\" ساخته مرحوم آنتونیو کارو تعلق گرفت که او نیز در حین کار بر روی فیلمش به طور ناگهانی درگذشت که باعث شد تهیه کننده او مسئولیت را بر عهده بگیرد. للیو در حال فیلمبرداری اقتباسی از رمان «شاعر شیلیایی» الخاندرو زامبرا برای Fabula بود و همچنین در مرحله پیش تولید فیلم «Voyagers» با حضور اندرو گارفیلد و دیزی ادگار جونز بود. \"فکر می‌کنم این یک قدردانی شایسته برای \"Monguen\" است، فیلمی که داستان‌ها را از حاشیه بررسی می‌کند. این فیلم به موضوعی می‌پردازد که در سینمای شیلی به ندرت به آن پرداخته می‌شود: فرهنگ ماپوچه، فرهنگ جنوب و شخصیت‌هایی که اغلب در صفحه نمایش نمایش داده نمی‌شوند. در این فیلم، آنتونیو کارو آن دنیاها را زنده می‌کند و به ما اجازه می‌دهد تا به مردم جنوب، فرهنگ عمیق‌تری را به دست آوریم.\" تنوع.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Monguen_Still-3-Mariella-Chavez.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۷ آبان • ۲۱:۵۷"}, {"source": "Billboard", "title": "Celine Dion Shares Metallica Backstage Photos After Rocking Out at Sphere: ‘Loved the Show’", "link": "https://www.billboard.com/music/music-news/celine-dion-metallica-backstage-photos-sphere-1236377038/", "summary": "Celine Dion embraced her inner metalhead at Metallica s Sphere show in Las Vegas. After going viral for playing air bass during the band s Nov. 5 performance at Sphere in Las Vegas, the superstar singer returned for Metallica s Life Burns Faster residency show on Saturday (Nov. 7), where she was spotted enjoying the concert alongside Jack Black before meeting the heavy metal legends backstage. In video obtained by TMZ from Saturday s show, Dion threw her arms in the air and headbanged along as Metallica performed its iconic 1991 hit “Enter Sandman” while also showing off her air-guitar skills. Black stood alongside Dion, clapping over his head during a guitar solo and enthusiastically taking in the show. Following the concert, Dion went backstage to meet Metallica members James Hetfield, Lars Ulrich, Kirk Hammett and Robert Trujillo. She shared a series of behind-the-scenes photos from the encounter on Instagram , including moments with her sons Eddy and Nelson Angélil, whom she shares with her late husband, René Angélil. Thank you James, Lars, Kirk and Rob and everyone from the @Metallica organization for the warm welcome! Dion captioned the gallery. We had such a wonderful time seeing you at the Sphere. We absolutely loved the show.🤘 The carousel features a group photo of Dion posing with her sons and the band, along with playful shots of the singer alongside bassist Trujillo and a black-and-white snapshot of her chatting with frontman Hetfield. While Dion s enthusiasm might come as a surprise to fans more familiar with her soaring ballads, her appreciation for Metallica is hardly new. Earlier this year, she shared a selection of songs from her personal playlist that included the band s 1996 single “Until It Sleeps.” Dion is also no stranger to Las Vegas residencies. The Grammy-winning singer headlined two celebrated runs at the Colosseum at Caesars Palace from 2011 to 2019. The two residencies grossed a combined $681.3 million , according to Billboard Boxscore. Her recent Metallica appearances come during a milestone year for the singer. On Sept. 12, Dion returned to the stage for her first full-length concert in more than six years, opening a 26-show residency in Paris. The performances marked a significant step in her return to live music after she revealed in December 2022 that she had been diagnosed with stiff-person syndrome, a rare neurological disorder that causes muscle stiffness and spasms and forced her to step away from touring. Metallica lau", "date_str": "2026-11-08T18:58:39+00:00", "hash": "6284bd6239d43862", "title_fa": "سلین دیون عکس‌های بک استیج متالیکا را پس از بازی در Sphere به اشتراک گذاشت: «عاشق نمایش»", "summary_fa": "سلین دیون در نمایشگاه Metallica s Sphere در لاس وگاس، متالد درونی خود را در آغوش گرفت. این خواننده فوق ستاره پس از پخش شدن به خاطر نواختن ایرباس در حین اجرای گروه در 5 نوامبر در Sphere در لاس وگاس، برای نمایش اقامتی متالیکا زندگی می سوزد سریعتر در روز شنبه (7 نوامبر) بازگشت، جایی که او در حال لذت بردن از کنسرت در کنار جک بلک قبل از ملاقات با اسطوره های هوی متال در پشت صحنه دیده شد. در ویدئویی که توسط TMZ از برنامه شنبه به دست آمده است، دیون در حالی که متالیکا آهنگ نمادین خود را در سال 1991 \"Enter Sandman\" را اجرا می کند، در حالی که مهارت های گیتار هوایی خود را نیز به نمایش می گذارد، دیون دست های خود را به هوا پرتاب کرد و سرش را کوبید. بلک در کنار دیون ایستاده بود و در حین تکنوازی گیتار بالای سرش کف می زد و با اشتیاق در برنامه شرکت می کرد. پس از کنسرت، دیون به پشت صحنه رفت تا با جیمز هتفیلد، لارس اولریش، کرک همت و رابرت تروجیلو، اعضای متالیکا را ملاقات کند. او مجموعه‌ای از عکس‌های پشت صحنه این برخورد را در اینستاگرام به اشتراک گذاشت، از جمله لحظاتی با پسرانش ادی و نلسون آنجلیل، که آنها را با همسر فقیدش، رنه آنجلیل به اشتراک می‌گذارد. از جیمز، لارس، کرک و راب و همه اعضای سازمان @Metallica برای استقبال گرم متشکریم! دیون برای گالری توضیح داد. با دیدن شما در Sphere لحظات فوق العاده ای داشتیم. ما کاملاً برنامه را دوست داشتیم.🤘 چرخ فلک دارای یک عکس دسته جمعی از دیون است که با پسرانش و گروه ژست گرفته است، به همراه عکس های بازیگوشی از خواننده در کنار تروخیلو نوازنده بیس و یک عکس سیاه و سفید از گپ زدن او با آهنگساز هتفیلد. در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/celine-dion-plentitude-arena-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۷ آبان • ۲۲:۲۸"}, {"source": "Deadline", "title": "Benito Skinner Teases “2016 Millennial Hopecore” For ‘Overcompensating’ Season 2: “Sorry For The Wait”", "link": "https://deadline.com/2026/11/benito-skinner-2016-millennial-hopecore-overcompensating-season-2-1237216771/", "summary": "While taking audiences back to the 2010s for Overcompensating, Benito Skinner wants to embrace a simpler time. The series creator and star explained that with Season 2, which Prime Video ordered last September, the show is really going like 2016 millennial hopecore with its approach to the decade. I hope people like Season 2. We ve [ ]", "date_str": "2026-11-08T18:19:30+00:00", "hash": "65148a5f15797386", "title_fa": "بنیتو اسکینر «Hopecore هزاره 2016» را برای فصل 2 «غراق‌پرداخت» تیز می‌کند: «متاسفم برای انتظار»", "summary_fa": "بنیتو اسکینر در حالی که مخاطبان را برای جبران بیش از حد به دهه 2010 بازمی گرداند، می خواهد زمان ساده تری را در پیش بگیرد. خالق و ستاره سریال توضیح داد که با فصل 2، که Prime Video در سپتامبر گذشته سفارش داد، سریال واقعاً مانند امید هزاره 2016 با رویکرد آن به دهه پیش می رود. امیدوارم مردم از فصل 2 خوششان بیاید. من در این فصل دو شخصیت را بازی می کنم. او در ژوئن گفت: آره، چیزی در راه است، چیزی شوم. سریال نیمه اتوبیوگرافی اسکینر رو با الهام از سفر خود به بیرون آمدن از گنجه به عنوان یک جوک دانشگاهی، برای فصل دوم در Prime Video در سپتامبر 2025 تمدید شد. با حضور هولمز در سریال به طور منظم در نقش دختر مهمانی خنده دار Hailee، مهمانان فصل 2 شامل Tom Francis در نقش Declan و Aishopi An Biophnae در نقش Declan هستند. چلس. کانی بریتون، کایل مک‌لاکلان، لوکاس گیج، ریش شاه، آندریا مارتین، جولیا شیپلت، نل ورلاک، دانیل پرز، یاسمین ساهید، بومان مارتینز-رید، توماسو سانلی و آستین لیندزی نیز در فصل اول نقش‌های تکراری آن‌ها را بازی می‌کنند. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/TCDOVER_ZU013.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۷ آبان • ۲۱:۴۹"}, {"source": "Variety", "title": "Andy Serkis Says He Was ‘Evangelical’ About Performance Capture After Playing Gollum in ‘Lord of the Rings’ but Now Accepts It’s ‘Misunderstood’: ‘If You Get It? Great’", "link": "https://variety.com/2026/film/news/andy-serkis-motion-capture-gollum-1236942445/", "summary": "Andy Serkis, who played an instrumental role in bringing the on-screen version of Gollum (also known as Sméagol) to life in “The Lord of the Rings” franchise, is reflecting on the technology that helped him do so. Gollum, a central character in the films, is the result of both Serkis performance and computer-generated elements through [ ]", "date_str": "2026-11-08T18:58:21+00:00", "hash": "56a2975360c0624c", "title_fa": "اندی سرکیس می‌گوید پس از بازی در نقش گولوم در «ارباب حلقه‌ها» درباره پرفورمنس کپچر «انجیلی» بود، اما اکنون می‌پذیرد که «سوءتفاهم شده است»: «اگر آن را دریافت کنی؟ عالی", "summary_fa": "اندی سرکیس، که نقش مهمی در زنده کردن نسخه روی صفحه گولوم (همچنین با نام اسماگول) در فرنچایز «ارباب حلقه‌ها» ایفا کرد، در حال انعکاس فناوری است که به او کمک کرده است. گولوم، یکی از شخصیت‌های اصلی فیلم‌ها، نتیجه عملکرد سرکیس و عناصر تولید شده توسط کامپیوتر از طریق [] اندی سرکیس است که نقش مهمی در زنده کردن نسخه روی پرده گولوم (همچنین با نام اسماگل) در فرنچایز «ارباب حلقه‌ها» ایفا کرد، در حال انعکاس فناوری است که به او در انجام این کار کمک کرد. \"چون این فناوری خیلی اشتباه فهمیده شده است. من قبلا انجیلی بودم. من ساعت ها در مورد نحوه بازیگری فیلمبرداری از پرفورمنس صحبت کرده ام و تماشای چشمانی که خیره می شوند، اما زندگی خیلی کوتاه است. آرام شدم. حالا من فقط فکر می کنم، \"اگر آن را دریافت کنید؟ عالی،» او گفت. نمایش‌هایی مانند گولوم توسط بازیگری نوشته می‌شود، همان‌طور که یک تیم پروتز جان هرت را در «مرد فیل‌مرد» مهندسی کرد. اما بنا به دلایلی، اجرای زیر یک ماسک فیزیکی برای برخی قابل درک‌تر از این است که یک ماسک دیجیتال است.» در ماه مه، پیتر جکسون، فیلمساز «ارباب حلقه‌ها» به گفت‌وگوی موشن کپچر اشاره کرد و گفت که بحث‌های فزاینده درباره هوش مصنوعی در فیلم یکی از دلایلی است که سرکیس برای بازی در نقش گولوم جوایزی را کسب نکرده - و احتمالاً هرگز نخواهد گرفت. او در آن زمان گفت: «بسیاری از محیط کنونی، همه نگران هوش مصنوعی هستند... من فکر نمی‌کنم یک شخصیت از نوع گولوم یا یک شخصیت ساخته شده امیدی به برنده شدن جوایزی داشته باشد.» \"که کمی ناعادلانه است، به خصوص در مورد اندی سرکیس که در آن یک عملکرد تولید شده توسط هوش مصنوعی نیست. این یک عملکرد تولید شده توسط انسان 100٪ است.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/GettyImages-1247589803.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما"], "datetime_fa": "۱۷ آبان • ۲۲:۲۸"}, {"source": "Variety", "title": "Sanfic Prizes: ‘Monguen’ and ‘Narciso” Win at Pared-Back Ceremony Due to Sudden Demise of ‘A Fantastic Woman’ Director Sebastian Lelio", "link": "https://variety.com/2026/film/global/sanfic-prizes-monguen-narciso-sebastian-lelio-remembered-1236942162/", "summary": "The unexpected demise Nov. 6 of Chile’s Oscar-winning Sebastián Lelio (“A Fantastic Woman”) cast a pall over the closing ceremonies of both the festival and industry section of the Santiago Film Festival (Sanfic), which wraps Nov. 8. The red carpet portions of the industry and festival ceremonies held Nov. 6 and 7, respectively, were cancelled. [ ]", "date_str": "2026-11-08T18:27:06+00:00", "hash": "8db14588321999dd", "title_fa": "جوایز سانفیک: «Monguen» و «Narciso» به دلیل درگذشت ناگهانی کارگردان «یک زن شگفت‌انگیز»، سباستین للیو، در مراسم رقص برنده شدند.", "summary_fa": "درگذشت غیرمنتظره 6 نوامبر برنده اسکار شیلیایی سباستین للیو («یک زن شگفت‌انگیز») مراسم اختتامیه جشنواره و بخش صنعتی جشنواره فیلم سانتیاگو (سانفیک) را که در 8 نوامبر به پایان می‌رسد، تحت تأثیر قرار داد. [ ] خانواده للیو اعلام کردند که Cineteca Nacional (کتابخانه ملی فیلم) برای همه کسانی که مایل به ادای احترام در این آخر هفته هستند باز خواهد بود. زندگی واقعی برخی از تماشاگران جشنواره را به یاد آخرین فیلم للیو، موزیکال «موج» («لا اولا») انداخت، که به اعتراضات خشونت‌آمیز دانشجویان شیلی در سال 2018 می‌پردازد، زمانی که گاز اشک‌آور با برخی از شرکت‌کنندگان پانل در حالی که از دانشگاه خارج می‌شدند برخورد کرد. دانشجویان به اقدام اخیر دولت جناح راست پرزیدنت کاست، که کاهش بودجه در کل سیستم شامل آموزش و پرورش می شود، اعتراض داشتند. آنها همچنین خواستار استعفای فرناندو رباط وزیر دادگستری به دلیل کاهش مجازات وی برای مجرمان جنسی کودکان و ناقضان حقوق بشر شدند. در میان 9 عکس شیلیایی حاضر در رقابت، جایزه بهترین فیلم به مستند \"مونگوئن\" ساخته مرحوم آنتونیو کارو تعلق گرفت که او نیز در حین کار بر روی فیلمش به طور ناگهانی درگذشت که باعث شد تهیه کننده او مسئولیت را بر عهده بگیرد. للیو در حال فیلمبرداری اقتباسی از رمان «شاعر شیلیایی» الخاندرو زامبرا برای Fabula بود و همچنین در مرحله پیش تولید فیلم «Voyagers» با حضور اندرو گارفیلد و دیزی ادگار جونز بود. \"فکر می‌کنم این یک قدردانی شایسته برای \"Monguen\" است، فیلمی که داستان‌ها را از حاشیه بررسی می‌کند. این فیلم به موضوعی می‌پردازد که در سینمای شیلی به ندرت به آن پرداخته می‌شود: فرهنگ ماپوچه، فرهنگ جنوب و شخصیت‌هایی که اغلب در صفحه نمایش نمایش داده نمی‌شوند. در این فیلم، آنتونیو کارو آن دنیاها را زنده می‌کند و به ما اجازه می‌دهد تا به مردم جنوب، فرهنگ عمیق‌تری را به دست آوریم.\" تنوع.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Monguen_Still-3-Mariella-Chavez.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۷ آبان • ۲۱:۵۷"}, {"source": "Variety", "title": "Judi Dench Says Vin Diesel Sent Her Flowers ‘the Length of a Kayak’ to Persuade Her to Join ‘The Chronicles of Riddick’: I’m ‘Far Too Easily Wooed’", "link": "https://variety.com/2026/film/news/judi-dench-reveals-she-was-wooed-1236942417/", "summary": "Judi Dench can’t say no to a big bouquet of flowers, especially if they’re kayak-sized and come from Vin Diesel. “He came to see me at the Haymarket Theatre to ask if I’d be in ‘The Chronicles of Riddick,’” Dench wrote in her new memoir, “Is It Too Late to Make a Run for It?” [ ]", "date_str": "2026-11-08T18:08:07+00:00", "hash": "99525193377b01b6", "title_fa": "جودی دنچ می‌گوید وین دیزل گل‌هایش را «طول یک کایاک» فرستاد تا او را متقاعد کند که به «تواریخ‌های ریدیک» بپیوندد: من «خیلی راحت دلخورم»", "summary_fa": "جودی دنچ نمی تواند به یک دسته گل بزرگ نه بگوید، به خصوص اگر اندازه کایاک باشد و از وین دیزل آمده باشد. دنچ در کتاب خاطرات جدید خود با عنوان «آیا برای دویدن خیلی دیر است؟» می‌نویسد: «او به تماشای من در تئاتر های مارکت آمد تا از من بپرسد که آیا در «سرگذشت ریدیک» حضور دارم یا خیر. [ ] جودی دنچ نمی تواند به یک دسته گل بزرگ نه بگوید، به خصوص اگر اندازه کایاک باشد و از وین دیزل آمده باشد. دنچ در کتاب خاطرات جدید خود با عنوان «آیا برای دویدن خیلی دیر است؟» می‌نویسد: «او به تماشای من در تئاتر های مارکت آمد تا از من بپرسد که آیا در «سرگذشت ریدیک» حضور دارم یا خیر. \"قبل از رسیدن او، او چنین دسته گل عظیمی را برای من فرستاد. آنها نتوانستند آنها را از پله ها به اتاق رختکن من ببرند، بنابراین مجبور شدند آنها را در درب صحنه بگذارند. آنها به راحتی به اندازه یک کایاک بودند. و به اندازه عرض.» داستان های مرتبط مطالعه مخاطبان تایوان فرصت های IP بین پلتفرمی را برجسته می کند زیرا هوش مصنوعی خطرات جدیدی را برای صنعت محتوا ایجاد می کند. او به شوخی گفت: «من مثل چیپس ارزان هستم. خیلی راحت وسوسه می شود.» دنچ که از این ژست متقاعد شد، در فیلم سال 2004 نقش ایرئون را بازی کرد، سفیر اصلی که ریدیک (دیزل) را در سفرهای پر فراز و نشیب خود راهنمایی می کند تا متحدان قدیمی خود را نجات دهد و با رئیس امپراتوری نکرومونگر مقابله کند. این اولین باری نبود که هدایایی این بازیگر 91 ساله را جذب یک نقش می کرد. او همچنین فاش کرد که کنت برانا وقتی از من خواست در [قتل در قطار سریع السیر شرق] حضور داشته باشم، شگفت‌انگیزترین دستمال گلدوزی شده را به او داد", "image_url": "https://variety.com/wp-content/uploads/2026/11/MCDCHOF_EC042.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما"], "datetime_fa": "۱۷ آبان • ۲۱:۳۸"}, {"source": "Billboard", "title": "The Strokes Get a Surprise Visit From Walton Goggins During ‘SNL’ Performance: Watch", "link": "https://www.billboard.com/music/rock/the-strokes-snl-walton-goggins-cameo-performance-video-1236377034/", "summary": "The Strokes rocked Saturday Night Live with two new songs and a surprise appearance by Walton Goggins. The New York City rock band appeared during the Druski-hosted episode on Nov. 7, performing “Lonely in the Future” and “Going Shopping,” both featured on its seventh studio album, Reality Awaits , which arrived in July. Related The Strokes Better Look Out: Druski Is Coming for Their Musical Guest Gig in New SNL Promos Simple Plan Are Meeting a Whole New Generation of Fans, 25 Years In Deep Purple s Ian Gillan Shares Encouraging News After Undergoing Surgery For their first performance, the Julian Casablancas -led quintet delivered “Lonely in the Future” against a backdrop of psychedelic visuals and elaborate lighting. Following the performance, the band released the song’s official music video , which features a cast of handcrafted puppets created in collaboration with the team behind the British satirical series Spitting Image . The group closed its SNL musical guest appearance with “Going Shopping,” which featured a surprise appearance by actor Goggins. Dressed in an all-black suit and sunglasses, the Fallout star joined the band on bongos, reprising his role in the song’s music video. Saturday s appearance marked The Strokes’ fourth time as musical guests on SNL . The band made its debut on the NBC sketch comedy show in January 2002, followed by performances in 2006 and 2011. The Strokes are currently promoting Reality Awaits , which debuted at No. 13 on the all-genre Billboard 200 and No. 5 on the Top Rock Alternative Albums chart. The nine-track set was recorded in Costa Rica with legendary producer Rick Rubin, who previously worked with the act on its 2020 album, The New Abnormal . SNL is back Nov. 14 with fan favorite John Mulaney returning to host and Phoebe Bridgers taking the stage as musical guest. Watch The Strokes perform “Lonely in the Future” and “Going Shopping” on SNL below.", "date_str": "2026-11-08T17:20:03+00:00", "hash": "ad00bbdc2655e5d9", "title_fa": "بازدید غافلگیر کننده والتون گوگینز در حین اجرای SNL: تماشا کنید.", "summary_fa": "گروه Strokes با دو آهنگ جدید و حضور غافلگیرکننده والتون گوگینز، شنبه شب زنده را تکان داد. گروه راک شهر نیویورک در اپیزودی که در 7 نوامبر به میزبانی دروسکی برگزار شد، با اجرای \"Lonely in the Future\" و \"Going Shopping\" ظاهر شد که هر دو در هفتمین آلبوم استودیویی خود، Reality Awaits که در ژوئیه منتشر شد، حضور داشتند. Strokes بهتر است مراقب باشید: Druski برای کنسرت مهمان موزیکال خود در تبلیغات جدید SNL می آید طرح ساده با نسل جدیدی از طرفداران ملاقات می کند، 25 سال حضور ایان گیلان از Deep Purple اخبار دلگرم کننده پس از انجام عمل جراحی را به اشتراک می گذارد. پس زمینه ای از تصاویر روانگردان و نورپردازی استادانه. پس از اجرا، گروه موزیک ویدیوی رسمی این آهنگ را منتشر کرد که شامل گروهی از عروسک های دست ساز است که با همکاری گروه سازنده سریال طنز بریتانیایی Spitting Image ساخته شده اند. این گروه حضور مهمان موزیکال SNL خود را با \"Going Shopping\" که با حضور غافلگیرکننده بازیگر گوگینز همراه بود، به پایان رساند. ستاره Fallout با پوشیدن کت و شلوار مشکی و عینک آفتابی، به گروه ملحق شد و در موزیک ویدیو این آهنگ را بازی کرد. حضور شنبه چهارمین بار استروکس به عنوان مهمان موسیقی در SNL بود. گروه اولین حضور خود را در برنامه کمدی طرح NBC در ژانویه 2002 انجام داد و به دنبال آن اجراهایی در سال های 2006 و 2011 اجرا شد. گروه Strokes در حال حاضر در حال تبلیغ Reality Awaits هستند که در رتبه 13 در بیلبورد 200 همه ژانر و شماره 5 در آلبوم آلبوم جایگزین راک برتر قرار گرفت. این مجموعه 9 آهنگی در کاستاریکا با تهیه کننده افسانه ای ریک روبین ضبط شد که قبلاً با این بازیگر در آلبوم 2020 آن به نام The New Abnormal کار کرده بود.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/the-strokes-snl-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags     function toggleRead(hash) {
      if (readArticles.has(hash)) {

                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
