      .footer-right { width: 100%; justify-content: space-between; }
    }

سرائیل، دانشجویان کنار خیابان بروشورهایی توزیع می‌کنند و از رانندگان می‌خواهند در انتخابات سراسری و رقابتی شرکت کنند. نظرسنجی‌ها نشان می‌دهد که احزاب عرب ممکن است در موقعیتی قرار گیرند که نقشی تعیین‌کننده در موازنه قدرت ایفا کنند. سرخوردگی سیاسی در گذشته اغلب باعث کاهش مشارکت عرب‌های اسرائیل در انتخابات شده است؛ گروهی که حدود یک‌پنجم جمعیت کشور را تشکیل می‌دهند و بسیاری از آنها خود را شهروندان فلسطینی اسرائیل می‌دانند. اما در این انتخابات، تلاش گسترده‌ای برای کنار زدن راست‌گراترین ائتلاف حاکم در تاریخ اسرائیل در جریان است؛ ائتلافی متشکل از بنیامین نتانیاهو، نخست‌وزیر کهنه‌کار اسرائیل، و احزاب راست افراطی و فوق‌ارتدکس. آرکان بدران، ۲۳ ساله، که همراه دانشجویان در حال توزیع بروشور است، می‌گوید:«من وظیفه خود می‌دانم که به سرنگونی این دولت افراطی کمک کنیم. آنها با ما مانند شهروندان درجه دو رفتار می‌کنند.» او می‌افزاید:«از همه زنان و مردان جوان می‌خواهم به فهرست‌های عربی رای بدهند؛ فهرست‌هایی که نماینده ما هستند، چون این به آینده ما مربوط می‌شود.» بیشتر نظرسنجی‌ها نشان می‌دهند که نه بنیامین نتانیاهو و متحدانش و نه «ائتلاف تغییر» به رهبری گادی آیزنکوت، رئیس پیشین ستاد ارتش اسرائیل، مسیر روشنی برای دستیابی به اکثریت پارلمانی ندارند. اگر این نظرسنجی‌ها درست باشند، احزاب مخالف نتانیاهو که پس از انتخابات خواهان تشکیل دولت ائتلافی هستند، یا باید از وعده خود مبنی بر همکاری نکردن با نخست‌وزیر عقب‌نشینی کنند یا با احزاب عمدتا عرب اسرائیل به توافق برسند. یکی از موانع اصلی این است که آیزنکوت تاکنون تشکیل دولت با حمایت احزاب عرب را رد کرده و دلیل آن را نبود ارزش‌های مشترک عنوان کرده است.", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱ آبان • ۰۴:۳۸"}, {"source": "BBC Persian", "title": "چرا خشونت در مدارس ترکیه رو به افزایش است؟", "link": "https://www.bbc.com/persian/articles/cxp8gmp3lnldo?at_medium=RSS&at_campaign=rss", "summary": "رونمایی از یک کیف ضدگلوله برای دانش‌آموزان در ترکیه بار دیگر توجه‌ها را به موضوعی جلب کرده که تا چندی پیش بیشتر با آمریکا گره خورده بود: خشونت و تیراندازی در مدارس. هم‌زمان با افزایش شمار حملات در مدارس و رشد جرائم خشونت‌آ تا بیش از دو سال آینده در حالی مطرح می‌شود که گزارش‌های متعددی از کاهش تجارت خارجی و دشواری واردات کالا به ایران در نتیجهٔ محاصره دریایی آمریکا و تشدید تحریم‌ها منتشر شده است. مسعود پزشکیان، رئیس‌جمهور ایران، پیشتر گفته بود حجم تجارت خارجی کشور در پی این محدودیت‌ها حدود ۳۵ درصد کاهش یافته و واردات ایران بیش از صادرات آسیب دیده است. تلاش برای انتقال واردات به مسیرهای زمینی به دلیل محدودیت ظرفیت گذرگاه‌های مرزی و افزایش هزینه حمل‌ونقل و اخیراً فشار بیشتر آمریکا به شبکه‌های بانکی کشورهای مبدأ نتوانسته است به‌طور کامل جایگزین مسیرهای دریایی شود. همتی در بخش دیگری از اظهارات خود دربارهٔ برنامهٔ دولت برای مقابله با کاهش درآمدهای نفتی توضیح داد", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱ آبان • ۱۳:۵۰"}, {"source": "Radio Farda", "title": "نقص امنیتی در اینترنت، خدمات بانکی و دولتی ژاپن را هم پس از اروپا با اختلال مواجه کرد", "link": "https://www.radiofarda.com/a/php-security-flaws-japan-global-cyber-disruptions/33882773.html", "summary": "این اختلال‌ها به دنبال شناسایی دو آسیب‌پذیری بسیار خطرناک در زبان برنامه‌نویسی «پی‌اچ‌پی» (PHP) رخ داده است که در بخش بزرگی از وب‌سایت‌های جهان به کار می‌رود.", "date_str": "2026-10-23T07:39:29+00:00", "hash": "103efc7a717620e2", "title_fa": "نقص امنیتی در اینترنت، خدمات بانکی و دولتی ژاپن را هم پس از اروپا با اختلال مواجه کرد", "summary_fa": "این اختلال‌ها به دنبال شناسایی دو آسیب‌پذیری بسیار خطرناک در زبان برنامه‌نویسی «پی‌اچ‌پی» (PHP) رخ داده است که در بخش بزرگی از وب‌سایت‌های جهان به کار می‌رود. اختلال‌های گستردهٔ اینترنتی ناشی از کشف دو نقص امنیتی خطرناک در یکی از زبان‌های برنامه‌نویسی پرکاربرد جهان، پس از چند کشور اروپایی به ژاپن نیز رسید و باعث توقف بخشی از خدمات بانک‌ها، شرکت‌های هواپیمایی، راه‌آهن و نهادهای دولتی این کشور شد. خبرگزاری رویترز روز جمعه اول آبان گزارش داد که شرکت مخابراتی سافت‌بانک ژاپن، یکی از بزرگ‌ترین اپراتورهای تلفن همراه این کشور، سامانهٔ ارسال هشدارهای اضطراری به مشترکان خود را برای برطرف کردن این آسیب‌پذیری‌ها موقتاً غیرفعال کرده است. افشای این نقص‌ها میلیون‌ها تلاش برای نفوذ به سامانه‌های اینترنتی را در پی داشته و شرکت‌ها و سازمان‌های بسیاری را در کشورهای مختلف وادار کرده است برای جلوگیری از حملات احتمالی، خدمات آنلاین خود را موقتاً متوقف کنند یا اصلاحیه‌های امنیتی را با فوریت نصب کنند. در ژاپن، شرکت‌های بزرگی از جمله گروه مالی میتسوبیشی یو‌اف‌جی، شرکت خدمات مالی نومورا، شرکت هواپیمایی آل نیپون ایرویز و شرکت راه‌آهن شرق ژاپن، بخشی از خدمات اینترنتی خود را به‌عنوان اقدام احتیاطی متوقف کرده‌اند. وزارت دارایی، سازمان ملی مالیات و سازمان هواشناسی ژاپن نیز برخی از خدمات آنلاین خود را به‌طور موقت از دسترس خارج کرده‌اند. گستردگی این اختلال‌ها دولت ژاپن را به اتخاذ تدابیر تازه‌ای برای مقابله با تهدیدهای سایبری واداشته است. دولت این کشور روز جمعه اعلام کرد تیمی ویژه تشکیل می‌دهد که با استفاده از هوش مصنوعی، حملات سایبری را شبیه‌سازی کند تا نقاط ضعف سامانه‌های رایانه‌ای پیش از سوءاستفاده مهاجمان شناسایی شوند. ریوسی آکازاوا، وزیر صنعت ژاپن، با اشاره به اینکه برای موفقیت یک حمله سایبری کافی است مهاجمان تنها یک راه نفوذ پیدا کنند، گفت نهادهای مسئول امنیت اینترنت باید از دیدگاه مهاجمان به سامانه‌های خود نگاه کنند.", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۱ آبان • ۱۱:۰۹"}, {"source": "Radio Farda", "title": "رسانه‌های آمریکا: ترامپ در حال بررسی حملات چندروزه به ایران پس از انتخابات است", "link": "https://www.radiofarda.com/a/trump-weighs-new-iran-strikes-after-us-midterms/33882704.html", "summary": "رئیس‌جمهور آمریکا دو پیشنهاد متفاوت را از سوی اسکات بسنت، وزیر خزانه‌داری ایالات متحده، و بنیامین نتانیاهو، نخست‌وزیر اسرائیل، برای پایان دادن سریع به جنگ با ایران دریافت کرده است.", "date_str": "2026-10-23T06:09:41+00:00", "hash": "dcccb04d72bc480f", "title_fa": "رسانه‌های آمریکا: ترامپ در حال بررسی حملات چندروزه به ایران پس از انتخابات است", "summary_fa": "رئیس‌جمهور آمریکا دو پیشنهاد متفاوت را از سوی اسکات بسنت، وزیر خزانه‌داری ایالات متحده، و بنیامین نتانیاهو، نخست‌وزیر اسرائیل، برای پایان دادن سریع به جنگ با ایران دریافت کرده است. در ادامه انتشار گزارش‌های مختلف از احتمال دوره تازه‌ای از حملات آمریکا به ایران، نشریه آتلانتیک هم گزارش داد که دونالد ترامپ در حال بررسی ازسرگیری حملات در قالب عملیاتی چندروزه احتمالاً بلافاصله پس از انتخابات میان‌دوره‌ای کنگره آمریکا است. این نشریه آمریکایی در گزارشی که شامگاه پنج‌شنبه ۳۰ مهر منتشر شد، به نقل از مقام‌های دولت آمریکا نوشت که زرادخانه موشکی و پهپادی ایران، زیرساخت‌های انرژی و تأسیسات هسته‌ای از اهداف احتمالی دور تازهٔ حملات خواهند بود. به نوشتهٔ آتلانتیک، رئیس‌جمهور آمریکا در هفته‌های اخیر دو پیشنهاد متفاوت را از سوی اسکات بسنت، وزیر خزانه‌داری ایالات متحده، و بنیامین نتانیاهو، نخست‌وزیر اسرائیل، برای پایان دادن سریع به جنگ با ایران دریافت کرده است. بر اساس این گزارش، اسکات بسنت با این استدلال که اقتصاد ایران در آستانهٔ فروپاشی قرار دارد، پیشنهاد کرده است که آمریکا با اعمال محاصره دریایی در تنگه هرمز و تشدید تحریم‌ها، جمهوری اسلامی را به پذیرش خواسته‌های واشینگتن در مذاکرات وادار کند. در مقابل، بنیامین نتانیاهو در چندین گفت‌وگوی تلفنی با ترامپ خواستار انجام دور دیگری از حملات گسترده و ویرانگر آمریکا و اسرائیل با هدف سرنگونی حکومت ایران شده است. آتلانتیک می‌نویسد که دولت ترامپ اکنون ظاهراً در حال بررسی تلفیقی از این دو رویکرد است؛ بر پایه این ارزیابی که اقتصاد ایران به مرز فروپاشی رسیده و چند حمله نظامی سنگین دیگر می‌تواند به تغییر حکومت منجر شود. یکی از مشاوران دولت آمریکا به این نشریه گفته است که به باور او فشارهای اقتصادی مؤثر بوده و ایران به آستانه فروپاشی نزدیک شده است. به گفته این مشاور، حملات تازه می‌تواند جمهوری اسلامی را از این آستانه عبور دهد.", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱ آبان • ۰۹:۳۹"}, {"source": "Radio Farda", "title": "ترامپ: ایران با حملات ساختگی به دنبال افزایش قیمت نفت در آستانه انتخابات آمریکاست", "link": "https://www.radiofarda.com/a/trump-iran-fake-strait-hormuz-attacks-oil-prices-protesters/33881798.html", "summary": "دونالد ترامپ جمهوری اسلامی را به تلاش برای افزایش قیمت نفت با انتشار اخبار ساختگی از حملات دریایی متهم کرد و بار دیگر گفت ۷۵ هزار معترض در ایران کشته شده‌اند.", "date_str": "2026-10-22T16:24:42+00:00", "hash": "a52d3f42fcbdfad7", "       tech: [{"source": "MIT AI", "title": "Q&A: How AI came to model the “messy” human mind", "link": "https://news.mit.edu/2026/qa-how-ai-came-to-model-messy-human-mind-1023", "summary": "Generative artificial intelligence models are rooted in ideas of mid-20th century engineers who thought some amount of irrationality was essential for a machine that could think like a human, contends Benjamin Lindquist, an assistant professor in the MIT History Section, who holds an MIT Schwarzman College of Computing shared position with the Department of Electrical Engineering and Computer Science (EECS) and is a principal investigator in the Laboratory for Information and Decision Systems. To mimic creative thinking, these AI pioneers intentionally injected randomness into algorithms designed to deterministically solve problems, Lindquist writes in a new paper that appears in the journal Past and Present. In the paper, he traces the origins of AI hallucinations back to this early research and suggests there will be inevitable tradeoffs between creativity and predictability when trying to build machines that mimic human behavior. MIT News spoke with Lindquist about these ideas. Q: Why did early computer engineers believe they needed to inject randomness and irrationality into AI systems designed for logic and calculation? A: There is a long history of many figures in the world of science and art theorizing that chance plays an important part in discovery and creativity — in the ability to originate ideas. They equated creativity with unexpected leaps of logic, or even a dream-like state that allows you to think about things from a new perspective. In the early 1950s, one popular idea from John Pierce, who was a prominent electrical engineer at Bell Labs, was about math being valuable in the world of art. The idea was shared by a lot of people working in early computing. When we think of artwork that includes math, we may think of something very orderly and precise, but Pierce matically embed two different materials: a filament for the sensors designed to send the strongest signal possible, and another for the wire-like elements that don’t interfere. Interactions won’t get lost in translation, meaning users can fabricate objects that respond in real-time, such as small robots, household decor, object-detection systems, and toys. With X-Hinges, users can put together an item by selecting and connecting different shapes, then choosing how certain parts move. The item won’t be limited to moving in just one way like previous approaches; instead, users can select up to three “axes:” compressing, up and down, or to the sides. Building a robotic hand, for example, you’d likely want its fingertips to move vertically and laterally. The new tool would then embed sensors where the object bends (in this case, its joints) to capture motion data from both angles. That way, the device can understand and respond to your interactions more dynamically once it’s 3D-printed. “It’s kind of like adding a conscious element to everyday objects,” says Jiaji Li, MIT electrical engineering and computer science (EECS) postdoc and CSAIL researcher, who is a senior author on a paper introducing the work. “What you get is objects that better understand how they’re being ", "date_str": "2026-10-22T20:45:00+00:00", "hash": "45e0e51ef66d4255", "title_fa": "این نرم افزار طراحی، اشیاء روزمره را به عنوان دستگاه های خودآگاه دوباره تصور می کند", "summary_fa": "در کودکی، احتمالاً چند فیلم دیزنی را دیدید که اشیای بی‌جان مانند ساعت، فنجان و اسباب‌بازی‌ها را به‌عنوان همراهان تعاملی برای انسان‌ها به تصویر می‌کشیدند - ظاهراً یک عمل جادویی خالص. اما دانشمندان آزمایشگاه علوم کامپیوتر و هوش مصنوعی MIT (CSAIL) اکنون کاری مشابه انجام می دهند: تبدیل وسایل ثابت به ابزارهای خودآگاهی که حرکت انسان را برای تکمیل یک کار درک کرده و به آن پاسخ می دهند. مهندسان با استفاده از مواد رسانا برای حسگرها و ردیابی‌ها (مثلا سیم‌ها) در داخل، این آیتم‌های پویا را با حسگر داخلی چاپ سه بعدی کرده‌اند. مشکل: هر دو جزء معمولاً با استفاده از یک ماده ساخته می‌شوند، بنابراین سیگنال‌های مشابهی منتشر می‌کنند. به نوعی مانند شنیدن همزمان دو ایستگاه رادیویی است، ترکیبی که تفسیر آن سخت است. مثلاً دستکشی که دستورالعمل‌های مربوط به نحوه کار با یک شی خاص را به دست رباتیک می‌فرستد، اشتباه می‌کند. این دستگاه نمی‌توانست نویز را فیلتر کند یا زاویه حرکات کاربر را تأیید کند، که باعث می‌شود یک دانش‌آموز انسان‌نما مرتکب خطا شود. محققان در CSAIL و دانشگاه تیانجین (TJU) در چین ممکن است راهی برای چاپ سه بعدی آیتم های تعاملی دقیق تر پیدا کرده باشند. با نرم افزار X-Hinges خود، کاربران می توانند طرحی را سفارشی کنند و ابزار به طور خودکار دو ماده مختلف را تعبیه می کند: رشته ای برای حسگرهایی که برای ارسال قوی ترین سیگنال ممکن طراحی شده اند و دیگری برای عناصر سیم مانند که تداخلی ندارند. تعاملات در ترجمه از بین نمی روند، به این معنی که کاربران می توانند اشیایی بسازند که در زمان واقعی پاسخ دهند، مانند ربات های کوچک، دکوراسیون خانه، سیستم های تشخیص اشیا و اسباب بازی ها. با X-Hinges، کاربران می توانند با انتخاب و اتصال اشکال مختلف، یک آیتم را کنار هم قرار دهند و سپس نحوه حرکت قسمت های خاص", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "سینما"], "datetime_fa": "۱ آبان • ۰۰:۱۵"}, {"source": "TechCrunch AI", "title": "Uber rival inDrive eyes 2027 robotaxi tests in Central Asia with Pony.ai and Nvidia", "link": "https://techcrunch.com/2026/10/22/uber-rival-indrive-eyes-2027-robotaxi-tests-in-central-asia-with-pony-ai-and-nvidia/", "summary": "inDrive plans to begin testing Pony.ai's robotaxis in Kazakhstan's capital in the first half of 2027.", "date_str": "2026-10-23T04:00:00+00:00", "hash": "a7ea52b47e15829a", "title_fa": "رقیب اوبر در درایو به آزمایش روباتاکسی 2027 در آسیای مرکزی با Pony.ai و Nvidia چشم دوخته است.", "summary_fa": "inDrive در نظر دارد آزمایش رباتاکسی Pony.ai را در پایتخت قزاقستان در نیمه اول سال 2027 آغاز کند. شرکت سوارکاری inDrive که به مسافران و رانندگان اجازه می دهد در مورد کرایه ها مذاکره کنند، در حال همکاری با شرکت رانندگی خودکار چینی Pony.ai و انویدیا است تا اصره کردند و آنها با اختراع بازی‌ها، عزاداری برای حلقه گمشده و در نهایت بهتر شدن در شغل خود پاسخ دادند. عوامل هوش مصنوعی که برای کاوش در یک جزیره مجازی بدون کار خاصی رها شده بودند، شروع به اختراع چالش های خود کردند. محققان MIT می گویند این رفتار دارای ویژگی های بازی است. محققان 13 عامل هوش مصنوعی به نام Eko را که هر کدام بر روی Claude Opus 4.7 به تنهایی در یک جزیره بیابانی شبیه سازی شده به مدت 30 ساعت کار می کردند، قرار دادند. آنها این آزمایش را در مقاله ای که در arXiv ارسال شده است، توصیف می کنند، سایتی که محققان قبل از بررسی همتایان، مطالعات خود را به اشتراک می گذارند. پس از آن، آنها چالش‌های خاصی را به ماموران دادند، مانند قرار دادن هر چه بیشتر اشیاء ممکن بر روی بلندترین مناره سنگی جزیره. ماموران اکو که آن 30 ساعت را صرف بازی کرده بودند، عموماً ماموران مشابهی را که هرگز پا به جزیره نگذاشته بودند، شکست دادند. امروزه، توسعه‌دهندگان از قبل تصمیم می‌گیرند که چه هوش مصنوعی باید تمرین کنند و چه چیزی موفقیت محسوب می‌شود. محققان این تکنیک - کاوش بدون هدف - را راهی متفاوت برای عوامل هوش مصنوعی برای یادگیری مهارت‌ها، به ویژه مهارت‌هایی می‌دانند که روزی می‌تواند برای کنترل ربات‌ها استفاده شود. محققان در گزارش خود می نویسند: «ما معمولاً عوامل مصنوعی را با تصمیم گیری از قبل برای تمرین، بهینه سازی و پیشرفت به حساب می آوریم. «بازی رژیم دیگری را پیشنهاد می‌کند: به یک مامور دنیایی به اندازه کافی غنی و امن بدهید، اجازه دهید آنچه را که جالب است انتخاب کند، و اجازه دهید دانش مفید از تاریخ پس از آن انباشته شود.» یکی از اکو در اولین ساعت حضور خود در", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "عامل‌های هوشمند"], "datetime_fa": "۱ آبان • ۰۴:۱۵"}, {"source": "TechCrunch AI", "title": "OpenAI working on new $30B raise at $1.25T valuation ahead of IPO", "link": "https://techcrunch.com/2026/10/22/openai-working-on-new-30b-raise-at-1-25t-valuation-ahead-of-ipo/", "summary": "Should OpenAI command an over $1 trillion valuation with this round, it would break records as the most highly valued private company ever.", "date_str": "2026-10-22T22:08:24+00:00", "hash": "b5 "2026-10-22T16:01:36+00:00", "hash": "19245079acffa32b", "title_fa": "نقص امنیتی PHP باعث می شود تا وب سایت ها آفلاین شوند", "summary_fa": "دولت‌ها و کسب‌وکارها در سراسر جهان تلاش کردند تا از سوء استفاده هکرها از یک آسیب‌پذیری در PHP، یک زبان برنامه‌نویسی محبوب، جلوگیری کنند.", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۳۰ مهر • ۱۹:۳۱"}, {"source": "The Guardian AI", "title": "Is a job guarantee the solution to mass AI unemployment?", "link": "https://www.theguardian.com/technology/2026/oct/23/job-guarantee-ai-mass-unemployment", "summary": "An old idea springs anew as a chorus of influential voices predicts that AI may trigger crises of vast magnitude In a preface to his book Capitalism and Freedom, the American economist Milton Friedman famously observed that a crisis can propel once-fringe ideas into the political mainstream. “Only a crisis – actual or perceived – produces real change. When that crisis occurs, the actions that are taken depend on the ideas that are lying around,” he wrote. The job of intellectuals, thinktanks and economists, he argued, is to refine the quality of these ambient ideas, so that good ones are ready when disaster strikes. Continue reading...", "date_str": "2026-10-23T10:00:30+00:00", "hash": "7651bf9a468e2693", "title_fa": "آیا تضمین شغل راه حلی برای بیکاری انبوه هوش مصنوعی است؟", "summary_fa": "زمانی که گروهی از صداهای تاثیرگذار پیش‌بینی می‌کنند که هوش مصنوعی ممکن است بحران‌های بزرگی را به وجود بیاورد، یک ایده قدیمی دوباره سر می‌زند. او نوشت: \"تنها یک بحران - واقعی یا درک شده - باعث ایجاد تغییر واقعی می شود. وقتی آن بحران رخ می دهد، اقداماتی که انجام می شود به ایده هایی بستگی دارد که در اطراف وجود دارد.\" او استدلال کرد که کار روشنفکران، اندیشکده‌ها و اقتصاددانان این است که کیفیت این ایده‌های محیطی را اصلاح کنند تا ایده‌های خوب در هنگام وقوع فاجعه آماده باشند. به خواندن ادامه دهید... چه بحران از دست دادن شغل انبوه مرتبط با هوش مصنوعی واقعی باشد یا قابل درک باشد، یک ایده سیاستی که توجه و حمایت فزاینده ای را به خود جلب می کند می تواند مستقیماً این مشکل را کاهش دهد: تضمین شغل. در بلندپروازانه‌ترین شکل، چنین برنامه‌ای تضمین می‌کند که هر کسی که می‌خواهد کار کند، شغلی معنادار و با دستمزد مناسب را تضمین می‌کند. حامیان آن استدلال می کنند که با ایجاد یک گزینه عمومی برای اشتغال، تضمین شغل می تواند میلیون ها نفر را از آسیب مالی و روانی بیکاری محافظت کند و نیروی کار گسترده ای را برای مقابله با مشکلات فوری اجتماعی، از زیرساخت ها و سازگاری آب و هوا گرفته تا مراقبت از سالمندان و مراقبت از کودکان، بسیج کند. مفهوم ضمانت شغلی هم به عنوان یک سیاست ایده آل و هم به عنوان یک سیاست واقعی سابقه طولانی دارد. ماده 23 اعلامیه جهانی حقوق بشر 1948 می گوید: «هر کس حق دارد کار کند، شغل خود را آزادانه انتخاب کند، از شرایط عادلانه و مساعد کار و حمایت در برابر بیکاری برخوردار باشد». در طول رکود بزرگ در دهه 1930، فرانکلین دی روزولت اداره پیشرفت کار (WPA) را تأسیس کرد که میلیون‌ها آمریکایی را در پروژه‌های جاه‌طلبانه کارهای عمومی", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱ آبان • ۱۳:۳۰"}, {"source": "The Guardian AI", "title": "Can AI really predict cancer survival better than a doctor? I have my doubts | Devi Sridhar", "link": "https://www.theguardian.com/commentisfree/2026/oct/23/ai-cancer-survival-doctor-selfie-health-research", "summary": "Take a selfie to see how healthy you are: the idea is enticing and this new research is promising. But so many factors have been ignored The idea that a single selfie could predict how long someone with cancer may live sounds like an incredible breakthrough. AI is getting better at spotting patterns in medical data, but can it be used to reliably predict what will happen to an individual patient? I asked a clinical colleague what she thought about the recent headlines . She found it an interesting development given that doctors have long used facial appearance to assess patient health. For example, she noted that they may write “appears stated age” or “appears older than stated age” as a proxy for general health. Now, researchers from Mass General Brigham, a healthcare institution in Massachusetts, have taken this idea a step further. They have developed an AI model trained on more than 40 million facial images – called FAHR-Face – to assess biological age and predict survival in cancer patients. For biological age, they developed FAHR-FaceAge, which estimates age from certain facial features such as the forehead, the wrinkles between the nose and mouth and the temples. For cancer survival, they developed FAHR-FaceSurvival, trained using almost 35,000 photos of cancer patients. This model focused more closely on the area below the eyes and the bridge of the nose – regions of the face “ linked with dying ”. Dr Raymond Mak , one of the study’s authors, noted that these parts of the face are the same as those referenced by Hippocrates in 400BC as signs of muscle wasting and mortality risk: “the nose sharp, the eyes sunken, the temples fallen in”. Prof Devi Sridhar is chair of global public health at the University of Edinburgh Continue reading...", "date_str": "2026-10-23T07:00:03+00:00", "hash": "191e3c9b22d8071a", "title_fa": "آیا هوش مصنوعی واقعا می تواند بقای سرطان را بهتر از یک پزشک پیش بینی کند؟ من شک دارم | دوی سریدار", "summary_fa": "یک سلفی بگیرید تا ببینید چقدر سالم هستید: این ایده فریبنده است و این تحقیق جدید امیدوارکننده است. اما عوامل زیادی نادیده گرفته شده اند. این ایده که یک سلفی می تواند پیش بینی کند که یک فرد مبتلا به سرطان چه مدت ممکن است زنده بماند، پیشرفتی باورنکردنی به نظر می رسد. هوش مصنوعی در تشخیص الگوها در داده‌های پزشکی بهتر می‌شود، اما آیا می‌توان از آن برای پیش‌بینی قابل اعتماد آنچه برای یک بیمار اتفاق می‌افتد استفاده کرد؟ از یکی از همکاران بالینی پرسیدم نظر او در مورد سرفصل های اخیر چیست. او با توجه به اینکه پزشکان مدت‌هاست از ظاهر چهره برای ارزیابی سلامت بیمار استفاده می‌کنند، این اتفاق جالبی بود. به عنوان مثال، او خاطرنشان کرد که آنها ممکن است بنویسند \"به نظر می رسد سن اعلام شده\" یا \"به نظر می رسد بزرگتر از سن اعلام شده\" به عنوان یک نماینده برای سلامت عمومی. در حال حاضر، محققان از Mass General Brigham، یک موسسه مراقبت های بهداشتی در ماساچوست، این ایده را یک گام فراتر برده اند. آنها یک مدل هوش مصنوعی آموزش‌دیده بر روی بیش از 40 میلیون تصویر صورت - به نام FAHR-Face - برای ارزیابی سن بیولوژیکی و پیش‌بینی بقای بیماران سرطانی ایجاد کرده‌اند. برای سن بیولوژیکی، آنها FAHR-FaceAge را توسعه دادند که سن را از روی برخی از ویژگی های صورت مانند پیشانی، چین و چروک بین بینی و دهان و شقیقه ها تخمین می زند. برای بقای سرطان، آنها FAHR-FaceSurvival را با استفاده از تقریباً 35000 عکس از بیماران سرطانی آموزش دیدند. این مدل با تمرکز بیشتری روی ناحیه زیر چشم و پل بینی – نواحی از صورت «مرتبط با مردن» متمرکز بود. دکتر ریموند مک، یکی از نویسندگان این مطالعه، خاطرنشان کرد که این قسمت‌های صورت همان قسمت‌هایی است که بقراط در 400 سال قبل از میلاد به عنوان", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱ آبان • ۱۰:۳۰"}, {"source": "The Guardian AI", "title": "Sharp drops for AI stocks overwhelm markets worldwide as oil prices jump", "link": "https://www.theguardian.com/business/2026/oct/22/stock-markets-drop-ai-oil", "summary": "Datacenter and chip costs fueled sharp decrease in AI sector although non-AI stocks still had a strong showing The latest shudder for stocks in the AI industry pulled markets lower worldwide on Thursday, while oil prices hit their highest levels since May on worries about the war with Iran . The S P 500 fell 1.2% for its worst day since July, while the Nasdaq composite tumbled 2.6%. The weakness for tech stocks was so overwhelming that it masked strength for the rest of the US market, in which the majority of stocks actually rose. The Dow Jones Industrial Average added 11 points, or less than 0.1%. Continue reading...", "date_str": "2026-10-22T21:50:13+00:00", "hash": "13760e5746a82cd4", "title_fa": "با جهش قیمت نفت، افت شدید سهام هوش مصنوعی بازارهای سراسر جهان را تحت تأثیر قرار داد", "summary_fa": "هزینه‌های مرکز داده و تراشه‌ها به کاهش شدید بخش هوش مصنوعی دامن زد، اگرچه سهام‌های غیر AI هنوز هم نمایش قوی داشتند. آخرین لرزش سهام در صنعت هوش مصنوعی باعث کاهش بازارها در سراسر جهان در روز پنجشنبه شد، در حالی که قیمت نفت به دلیل نگرانی از جنگ با ایران به بالاترین سطح خود از ماه می رسید. S P 500 برای بدترین روز خود از جولای 1.2% سقوط کرد، در حالی که Nasdaq Composite 2.6% سقوط کرد. ضعف سهام های فناوری به حدی بود که قدرت را برای بقیه بازار ایالات متحده پنهان کرد، که در آن اکثر سهام در واقع رشد کردند. میانگین صنعتی داوجونز 11 واحد یا کمتر از 0.1 درصد افزایش یافت. به خواندن ادامه دهید... سهام‌های مرتبط با هوش مصنوعی نگران این هستند که رونق آنها ممکن است در معرض تهدید قرار گیرد زیرا وام گرفتن برای ساخت مراکز داده و خرید تراشه‌های بیشتر هوش مصنوعی چقدر گران شده است. همچنین نگرانی‌ها مبنی بر افزایش بیش از حد قیمت‌های آن‌ها پس از یک جنون چند ساله، وجود دارد، حتی اگر شرکت‌های فعال در این صنعت همچنان رشد خود را گزارش کنند. به عنوان مثال، Lam Research که تجهیزات و خدمات آن به تولید نیمه هادی ها کمک می کند، سود و درآمد تابستان را گزارش کرد که اندکی قوی تر از انتظار تحلیلگران بود. معمولاً این به افزایش قیمت سهام کمک می کند، اما Lam Research 11.8 درصد سقوط کرد. سایر سهام‌های بزرگ فناوری نیز به دنبال گزارش‌های فصلی که شامل حداقل برخی از قطعات دلگرم‌کننده بود، سقوط کردند. متا پلتفرم که عامل هوش مصنوعی Muse خود را تحت فشار قرار می دهد، پس از گزارش درآمد قوی تر از انتظار تحلیلگران در سه ماهه اخیر، 7 درصد از دست داد و ده ها میلیارد از ارزش بازار خود را کاهش داد، اگرچه سود", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "تراشه", "عامل‌های هوشمند"], "datetime_fa": "۱ آبان • ۰۱:۲۰"}, {"source": "The Guardian AI", "title": "The Guardian view on AI safety: the push for global regulation must advance | Editorial", "link": "https://www.theguardian.com/commentisfree/2026/oct/22/the-guardian-view-on-ai-safety-the-push-for-global-regulation-must-advance", "summary": "The current US administration is an obstacle, but public demand for protection will ultimately prevail Organisations around the world scrambled on Thursday to fix critical flaws in PHP, the software that powers m ogue, a16z Crypto rebrands as a16z Frontier", "link": "https://techcrunch.com/2026/10/22/as-blockchain-investing-falls-out-of-vogue-a16z-crypto-rebrands-as-a16z-frontier/", "summary": "The digital asset unit, helmed by Chris Dixon, broadens its scope.", "date_str": "2026-10-22T22:34:54+00:00", "hash": "026c861d29fe5626", "title_fa": "از آنجایی که سرمایه گذاری در بلاک چین از مد افتاده است، a16z Crypto به a16z Frontier تغییر نام داد.", "summary_fa": "واحد دارایی دیجیتال که توسط کریس دیکسون اداره می شود، دامنه خود را گسترش می دهد. در نشانه ای از کاهش اهمیت سرمایه گذاری متمرکز بر کریپتو و بلاک چین، آندرسن هوروویتز روز پنجشنبه اعلام کرد که نام واحد دارایی دیجیتال خود را از a16z Crypto به a16z Frontier تغییر می دهد. این عمل که توسط کریس دیکسون هدایت می شود، از زمان راه اندازی در سال 2018، نزدیک به 10 میلیارد دلار از پنج صندوق جمع آوری کرده است و از برخی از بزرگترین بردهای این بخش، از جمله Coinbase حمایت می کند. با این حال، برای سال‌ها، a16z و شرکت‌های ریسک‌پذیر رقیب تلاش می‌کردند تا ابزارهای ارز دیجیتال را فراتر از ریل‌های مالی، برنامه‌های کاربردی تجاری و دارایی‌های سفته‌بازانه سوق دهند. تحت نام جدید، این تیم وظایف خود را برای تمرکز بر فناوری‌های نوظهور، چه هوش مصنوعی، رباتیک، یا «انواع جدید شبکه‌هایی» که انسان‌ها و ماشین‌ها را به هم متصل می‌کنند، گسترش می‌دهد. با این حال، این گروه رمزارز را کنار نمی‌گذارد. دیکسون در یک پست وبلاگی نوشت که فناوری بلاک چین می‌تواند به شبکه‌های جدید قابلیت‌های اقتصادی بومی بدهد. در کنار Dixon، شرکای عمومی a16z Frontier شامل Eddy Lazzarin و Guy Wuollet هستند. در همین حال، علی یحیی که در سال 2017 به عنوان اولین سرمایه گذار به استراتژی کریپتو پیوست، این شرکت را ترک کرد. یک پاس بخرید، دومین جلد رایگان را در بوت کمپ موسس نهایی سال TechCrunch با آوردن هم بنیانگذار یا شریک خود به صورت رایگان کتاب قبل از انقضای قرارداد BOGO دریافت کنید مشترک شدن برای بزرگترین اخبار فناوری صنعت هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها هسته TechCrunch هستند، بنابرا /2026/10/ukraine-learns-to-fight-without-starlink-as-musk-plays-politics-with-satellites/", "summary": "Elon Musk’s Starlink satellite service has played a pivotal role in supporting Ukraine’s successful resistance to Russia’s full-scale invasion for years. But with Starlink having become increasingly unreliable due to Musk’s political inclinations and the latest surprise disruptions to service in Ukraine, the Ukrainians and Europe as a whole are now facing urgent questions about how to move forward without it. As the world’s largest communications satellite network, Starlink can typically support high-speed Internet and data streams for any user or vehicle equipped with a relatively compact Starlink terminal. This has enabled Ukraine to maintain vital communications for both civilian purposes and military operations—and has also expanded the Ukrainian military’s capability to remotely control or provide guidance to drones used in both air defense against Russian attacks and for striking back at Russian targets. “Starlink currently offers some of the best satellite coverage available, with virtually no competitors when you consider the combination of cost, availability, and ease of use,” according to the head of hardware R D at the Ukrainian defense company BlueBird Tech , who provided comments to Ars anonymously for security reasons. “In practical terms, the main limitation is the need to position the antenna so it can receive signals from the satellites.” Read full article Comments", "date_str": "2026-10-23T11:30:22+00:00", "hash": "ec2e9afbf274e5a1", "title_fa": "اوکراین یاد می گیرد که بدون استارلینک بجنگد، همانطور که ماسک با ماهواره ها سیاست بازی می کند", "summary_fa": "سرویس ماهواره ای استارلینک ایلان ماسک برای سال ها نقش اساسی در حمایت از مقاومت موفق اوکراین در برابر تهاجم تمام عیار روسیه ایفا کرده است. اما با توجه به تمایلات سیاسی ماسک و آخرین اختلالات غافلگیرکننده خدمات در اوکراین، استارلینک به طور فزاینده ای غیرقابل اعتماد شده است، اوکراینی ها و اروپا به طور کلی اکنون با سؤالات فوری در مورد چگونگی پیشروی بدون آن روبرو هستند. به عنوان بزرگترین شبکه ماهواره ای ارتباطی جهان، استارلینک معمولاً می تواند از اینترنت پرسرعت و جریان داده برای هر کاربر یا وسیله نقلیه ای مجهز به ترمینال نسبتاً فشرده Starlink پشتیبانی کند. این امر اوکراین را قادر می سازد تا ارتباطات حیاتی را هم برای اهداف غیرنظامی و هم برای عملیات نظامی حفظ کند - و همچنین توانایی ارتش اوکراین برای کنترل از راه دور یا ارائه راهنمایی برای پهپادهای مورد استفاده در دفاع هوایی در برابر حملات روسیه و برای حمله به اهداف روسیه را افزایش داده است. به گفته رئیس بخش سخت‌افزار شرکت دفاع اوکراینی BlueBird Tech، که به دلایل امنیتی به‌طور ناشناس نظراتی را در اختیار Ars قرار می‌دهد، «استارلینک در حال حاضر برخی از بهترین پوشش‌های ماهواره‌ای موجود را ارائه می‌کند، با توجه به ترکیب هزینه، در دسترس بودن و سهولت استفاده، تقریباً هیچ رقیبی ندارد. از نظر عملی، محدودیت اصلی نیاز به موقعیت آنتن است تا بتواند سیگنال های ماهواره ها را دریافت کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید سرویس ماهواره ای Starlink ایلان ماسک برای سال ها نقشی اساسی در حمایت از مقاومت موفقیت آمیز اوکراین در برابر تهاجم تمام عیار روسیه ایفا کرده است.", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱ آبان • ۱۵:۰۰"}, {"source": "Ars Technica", "title": "Review: Crystal Lake suffers a bit from its obsession with Pam Voorhees", "link": "https://arstechnica.com/culture/2026/10/review-crystal-lake-suffers-a-bit-from-its-obsession-with-pam-voorhees/", "summary": "Peacock’s series, Crystal Lake , doesn’t feel like a Friday the 13th movie when you first press play, even though it’s set up to be a prequel to the original film. (This review includes spoilers of the original Friday the 13th movie but avoids major Crystal Lake spoilers.) Instead, Crystal Lake strives to build a drama that’s half homage, half uncharted territory while giving a long-awaited backstory to Pamela Voorhees. The original villain in the first film, Pam Voorhees, shocked audiences in 1980 by popping up out of nowhere in the midst of a brutal camp counselor killing spree, then confronting the final girl with a Norman Bates-like delivery of the movie’s chilling tagline, “Kill her, mommy,” using the voice of her drowned son Jason. Betsy Palmer as Pam Voorhees in Friday the 13th . Credit: via Paramount Pictures Linda Cardellini as Pam Voorhees in Crystal Lake. Credit: via Peacock Although the hockey-masked killer, Jason Voorhees, became the horror icon at the center of the franchise, his mom, Pam, continued to fascinate fans who knew very little about her. Beheaded in the first film after just 13 minutes onscreen, her spirit would occasionally appear in later films, but the original actor, Betsy Palmer, who portrayed Pam refused to return, largely because the character has no depth. Read full article Comments", "date_str": "2026-10-23T11:15:03+00:00", "hash": "afe6ff0d033f3cc4", "title_fa": "نقد و بررسی: دریاچه کریستال کمی از وسواس خود به Pam Voorhees رنج می برد", "summary_fa": "سریال Peacock، Crystal Lake، وقتی برای اولین بار بازی را فشار می‌دهید، شبیه یک فیلم جمعه سیزدهم نیست، حتی اگر قرار است پیش درآمدی برای فیلم اصلی باشد. (این بررسی شامل اسپویلرهای فیلم اصلی جمعه سیزدهم است، اما از اسپویلرهای اصلی دریاچه کریستال پرهیز می کند.) در عوض، کریستال لیک تلاش می کند تا درامی را بسازد که نیمی از ادای احترام است، نیمی از قلمروی ناشناخته و در عین حال داستانی را برای پاملا وورهیس ارائه می دهد که مدت ها مورد انتظار بود. شرور اصلی فیلم اول، Pam Voorhees، در سال 1980 با ظاهر شدن از جایی در میان ولگردی و ولگردی وحشیانه مشاور اردوگاه، تماشاگران را شوکه کرد، سپس دختر آخر را با تگ فیلم هیجان‌انگیز «کشت کن، مامانش را غرق کن»، شبیه به نورمن بیتس، مواجه کرد. بتسی پالمر در نقش پم وورهیس در جمعه سیزدهم. اعتبار: از طریق پارامونت پیکچرز لیندا کاردلینی در نقش پم وورهیس در کریستال لیک. اعتبار: via Peacock اگرچه قاتل نقابدار هاکی، جیسون وورهیز، به نماد ترسناک در مرکز فرنچایز تبدیل شد، مادرش، پم، همچنان طرفدارانی را که اطلاعات کمی درباره او داشتند، مجذوب خود می کرد. در فیلم اول تنها پس از 13 دقیقه روی اکران سر بریده شد، روح او گهگاه در فیلم‌های بعدی ظاهر می‌شد، اما بازیگر اصلی، بتسی پالمر، که نقش پم را بازی می‌کرد، از بازگشت امتناع کرد، عمدتاً به این دلیل که این شخصیت عمقی نداشت. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید سری طاووس، دریاچه کریستال، را به حداقل برسانید، وقتی برای اولین بار پخش را فشار می‌دهید، مانند فیلم جمعه سیزدهم به نظر نمی‌رسد، حتی اگر به عنوان پیش درآمدی برای فیلم اصلی تنظیم شده باشد. (این بررسی شامل اسپویلرهای فیلم اصلی جمعه سیزدهم است", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۱۴:۴۵"}, {"source": "Ars Technica", "title": "Rocket Report: SpaceX says no thanks to military launches; Spanish rocket nearly ready", "link": "https://arstechnica.com/space/2026/10/rocket-report-spacex-says-no-thanks-to-military-launches-spanish-rocket-nearly-ready/", "summary": "Welcome to Edition 9.16 of the Rocket Report! Lots of SpaceX-related news this week including a couple of Thursday shockers. In one story, the company told the US Space Force thanks, but no thanks after being offered three military launch contracts. Then, on the civil space side of things, SpaceX's Starship may required up to 22 refuelings to support a lunar landing, a NASA safety panel said. As always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar. Miura 5 getting closer to launch . PLD Space says its Miura 5 rocket, due to undertake its inaugural launch next year, is nearing final integration, Aviation Week reports . The rocket is one of t "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۴:۳۰"}, {"source": "Ars Technica", "title": "Switch 2 security takes a hit as hackers unlock homebrew access", "link": "https://arstechnica.com/gaming/2026/10/switch-2-jailbreak-gives-hackers-new-ways-to-run-homebrew-and-mod-games/", "summary": "A security researcher has demonstrated a software-only partial jailbreak of the Switch 2, gaining \"userland\" access that he says \"lets us run homebrew, reverse engineer and mod Switch 2 games, back up save files off the Switch, and access most of the Switch 2’s peripherals through MMIO.\" The hack relies on the original Switch version of SmileBasic 4 , the latest in a long-running series of programming environments and interpreters that run on Nintendo hardware. The so-called \"tethered\" hack also requires access to a macOS or Linux PC on the same network to run a node.js package that helps enable privileged system access. Researcher Sammy Hajhamid writes that he used OpenAI's Codex to poke at SmileBasic's language interpreter, using a custom harness that could send USB commands to the system and view results via HDMI (as well as power cycling via a Bluetooth light switch flipping device). After \"substantial effort for ~2 weeks,\" that harness discovered a 32-bit integer overflow that occurs when removing items from an array in SmileBasic. That error gives access to an array pointer, which in turn allows read and write access to portions of system memory. Read full article Comments", "date_str": "2026-10-22T22:25:33+00:00", "hash": "7c7ba5902dae54cf", "title_fa": "هنگامی که هکرها قفل دسترسی Homebrew را باز می کنند، امنیت سوئیچ 2 ضربه می زند", "summary_fa": "یک محقق امنیتی یک جیلبریک جزئی از سوییچ 2 را فقط نرم‌افزاری نشان داده است که دسترسی «سرزمین کاربری» را به دست می‌آورد که به گفته او «به ما امکان می‌دهد بازی‌های Homebrew، مهندسی معکوس و mod Switch 2 را اجرا کنیم، از فایل‌های ذخیره شده از سوییچ نسخه پشتیبان تهیه کنیم و از طریق MMIO به اکثر لوازم جانبی سوییچ 2 دسترسی داشته باشیم». این هک متکی بر نسخه اصلی Switch SmileBasic 4 است، که آخرین نسخه از یک سری طولانی مدت از محیط‌های برنامه‌نویسی و مفسرهایی است که روی سخت‌افزار نینتندو اجرا می‌شوند. هک موسوم به \"tethered\" همچنین نیاز به دسترسی به MacOS یا PC Linux در همان شبکه برای اجرای بسته node.js دارد که به فعال کردن دسترسی به سیستم ممتاز کمک می کند. محقق Sammy Hajhamid می نویسد که او از Codex OpenAI برای ضربه زدن به مترجم زبان SmileBasic استفاده کرده است، با استفاده از یک مهار سفارشی که می تواند دستورات USB را به سیستم ارسال کند و نتایج را از طریق HDMI (و همچنین چرخه برق از طریق یک دستگاه چرخاننده سوئیچ چراغ بلوتوث) مشاهده کند. پس از \"تلاش قابل توجه به مدت 2 هفته\"، آن مهار یک سرریز عدد صحیح 32 بیتی را کشف کرد که هنگام حذف موارد از یک آرایه در SmileBasic رخ می دهد. این خطا به یک نشانگر آرایه دسترسی پیدا می کند که به نوبه خود امکان دسترسی خواندن و نوشتن به بخش هایی از حافظه سیستم را فراهم می کند. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش یک محقق امنیتی یک جیلبریک جزئی از سوییچ 2 را فقط نرم افزاری نشان داده است که به \"سرزمین کاربر\" دسترسی پیدا می کند که می گوید", "category": "هوش مصنوعی مولد", "tags": ["OpenAI", "امنیت سایبری"], "datetime_fa": "۱ آبان • ۰۱:۵۵"}, {"source": "Ars Technica", "title": "Moderna and Merck say their mRNA cancer vaccine cut death, recurrence by 42%", "link": "https://arstechnica.com/health/2026/10/personalized-mrna-cancer-vaccine-cut-melanoma-death-recurrence-by-42/", "summary": "Personalized mRNA vaccines against melanoma—the deadliest form of skin cancer—reduced the risk of death or recurrence by 42 percent compared to standard treatment in a late-stage trial, pharmaceutical partners Merck and Moderna announced Thursday . The results are a significant advance in melanoma treatment; Merck and Moderna are already engaging with regulatory authorities to get the vaccine approved. More حافظت می‌کند، مثل اینکه آنها سعی می‌کنند از شکستن کدهای هسته‌ای توسط خارجی‌ها جلوگیری کنند. من در مورد تعداد پرتاب های Starship مورد نیاز برای سوخت رسانی به یک فرودگر ماه مبتنی بر Starship در مدار پایین زمین صحبت می کنم به طوری که بتواند به ماه پرواز کند، در آنجا فرود بیاید و به مدار ماه بازگردد. این عدد در طول سال ها هدف متحرکی بوده است. پاسخ کلی ناسا معمولاً این بوده است: \"ما مطمئناً نمی دانیم، بنابراین نمی خواهیم بگوییم.\" به عنوان مثال، در سال 2023، مدیر وقت سیستم فرود انسانی ناسا، لیزا واتسون-مورگان، به Ars گفت: \"ما یک ایده کلی داریم، اما من تمایلی ندارم دقیقاً بگویم که چیست.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید ناسا سلاح هسته ای ندارد و نمی خواهد. اما وقتی نوبت به معیار خاصی می‌رسد که بخشی از برنامه آرتمیس برای فرود افراد در ماه است، ناسا از تعداد خاصی محافظت می‌کند، مثل اینکه آنها سعی می‌کنند از شکستن کدهای هسته‌ای توسط خارجی‌ها جلوگیری کنند. بعداً، او گفت که این عدد از \"تک رقم بالا تا دو رقم پایین\" است. این نشان می دهد که حدود 12 راه اندازی، که بسیار است. اسپیس ایکس برای سفر به ماه باید یک استارشیپ «ذخیره‌ای» و سپس ۱۱ کشتی «تانکر» را به فضا پرتاب کند تا به طور کامل آن را با اکسیژن مایع و پیشرانه متان پر کند. مقامات دیگر گفته اند \"نوجوانان بالا\". همیشه این امید وجود داشت که اسپیس ایکس به طور چشمگیری ظرفیت بالابر استارشیپ را بهبود بخشد تا", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۰۱:۲۲"}, {"source": "Ars Technica", "title": "Comcast loses more customers, claims other ISPs' cheap prices are \"irrational\"", "link": "https://arstechnica.com/tech-policy/2026/10/comcast-loses-more-customers-claims-other-isps-cheap-prices-are-irrational/", "summary": "Comcast reportedly plans significant job cuts in its cable division as the firm continues to lose residential broadband and TV customers. Comcast lost 144,000 residential broadband customers in Q3 2026, up from a 91,000-customer loss in the same  and then take the image in a dark room, using a flash to serve as the shutter, thereby freezing the ink drops mid-air. There was no need for pricey equipment. Bielfeldt does not use AI in his images, preferring to rely on traditional techniques. Read full article Comments", "date_str": "2026-10-22T19:34:40+00:00", "hash": "b754774dfb72a1af", "title_fa": "قطرات جوهر در حرکت، جایزه برتر مسابقه دنیای کوچک نیکون را به خود اختصاص دادند", "summary_fa": "یک عکاس تجربی 25 ساله آلمانی با تصویری چشمگیر از ریختن قطرات جوهر بر روی کاغذ توسط یک چاپگر جوهرافشان، برنده مسابقه میکروکروگرافی عکاسی نیکون Small World 2026 شد. اوله بیلفلد 1802 شرکت کننده دیگر از 69 کشور مختلف را شکست داد. بیلفلد پس از کشف یک میکروسکوپ قدیمی در اتاق زیر شیروانی والدینش، در دوران قرنطینه COVID-19 به فتومیکرووگرافی علاقه مند شد. او متوجه شد که چگونه از یک لوله و مقداری چوب یک آداپتور بسازد تا میکروسکوپ را به دوربین پدرش متصل کند و از طریق آزمون و خطا به خود این هنر را آموخت و در صورت نیاز ابزارهای سفارشی ساخت. او نحوه ثبت تصاویر متحول کننده از اشیاء روزمره را با ویدئوهای پشت صحنه ارسال شده به ماکروفیینگ، برند عکاسی و فیلمبرداری خود ثبت می کند. کنجکاوی بیلفلد در مورد عملکرد درونی چاپگرهای جوهرافشان بود که الهام بخش موفقیت او شد، اما با توجه به اینکه این فرآیند خیلی سریع اتفاق می‌افتد، ثبت عمل قطرات جوهر بر روی کاغذ یک چالش بود. به عنوان مثال، قطرات سریعتر از سرعت شاتر دوربین حرکت می کردند. راه‌حل بیلفلد این بود که چاپگر را به‌طوری که کاغذ زیر یک سر چاپ ثابت حرکت کند (به جای متحرک)، و سپس تصویر را در یک اتاق تاریک، با استفاده از فلاش به عنوان شاتر می‌گرفت و در نتیجه جوهر را در هوا منجمد می‌کرد. نیازی به تجهیزات گران قیمت نبود. بیلفلد در تصاویر خود از هوش مصنوعی استفاده نمی کند و ترجیح می دهد بر تکنیک های سنتی تکیه کند. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید یک عکاس تجربی 25 ساله آلمانی برنده مسابقه فتومیکروگرافی نیکون Small World 2026 با تصویری چشمگیر از قطرات جوهر در", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۳۰ مهر • ۲۳:۰۴"}, {"source": "Ars Technica", "title": "\"Disillusioned\" MAHA leader quits as Trump admin's food agenda spoils: Report", "link": "https://arstechnica.com/health/2026/10/disillusioned-maha-leader-quits-as-trump-admins-food-agenda-spoils-report/", "summary": "Calley Means—a top ally to anti-vaccine Health Secretary Robert F. Kennedy Jr. and a co-author of the so-called \"MAHA bible\"—resigned from his role in the Trump administration Thursday, reportedly in frustration over delays to food policy changes sought by the Make America Healthy Again movement. \"I am resigning from the White House with tremendous respect for President Trump and Bobby Kennedy,\" Means wrote in a social media post this afternoon . \"It was an honor to advocate for MAHA moms in the administration and steer policies like Dietary Guidelines reform, psychedelic reform, removing soda from SNAP, removing food dyes, GRAS reform, and overhauling government food procurement.\" His post did not provide a reason for his departure. Means served as a senior advisor to Kennedy. Read full article Comments", "date_str": "2026-10-22T19:04:06+00:00", "hash": "6031d68f1b69dafa", "title_fa": "گزارش: رهبر \"سرخورده\" MAHA استعفا می دهد زیرا دستور کار غذایی مدیر ترامپ خراب می شود", "summary_fa": "Calley Means - یکی از متحدان ارشد وزیر بهداشت ضد واکسن رابرت اف کندی جونیور و یکی از نویسندگان به اصطلاح \"انجیل MAHA\" - روز پنجشنبه از نقش خود در دولت ترامپ استعفا داد، بنا بر گزارش ها به دلیل ناامیدی به دلیل تاخیر در تغییرات سیاست غذایی که به دنبال جنبش \"آمریکا دوباره سالم است\". مینز بعدازظهر امروز در پستی در شبکه‌های اجتماعی نوشت: من با احترام فوق‌العاده برای پرزیدنت ترامپ و بابی کندی از کاخ سفید استعفا می‌دهم. حمایت از مادران MAHA در دولت و هدایت سیاست‌هایی مانند اصلاح دستورالعمل‌های رژیم غذایی، اصلاح روانگردان، حذف نوشابه از اسنپ، حذف رنگ‌های غذایی، اصلاح GRAS و بازنگری اساسی در تهیه غذای دولتی باعث افتخار بود. پست او دلیلی برای خروج او ارائه نکرد. مینز به عنوان مشاور ارشد کندی خدمت کرد. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش Calley Means—یکی از متحدان اصلی وزیر بهداشت ضد واکسن رابرت اف کندی جونیور و یکی از نویسندگان به اصطلاح «انجیل MAHA» در دولت ترامپ به دلیل نقشی که پنجشنبه در غذای خود منتشر کرد، استعفا داد. تغییرات سیاستی که جنبش «آمریکا را دوباره سالم بساز» به دنبال آن است. مینز بعدازظهر امروز در پستی در شبکه‌های اجتماعی نوشت: من با احترام فوق‌العاده برای پرزیدنت ترامپ و بابی کندی از کاخ سفید استعفا می‌دهم. حمایت از مادران MAHA در مدیریت و هدایت سیاست‌هایی مانند اصلاح دستورالعمل‌های رژیم غذایی، اصلاح روانگردان، حذف نوشابه از اسنپ، حذف رنگ‌های غذایی، اصلاح GRAS و بازنگری اساسی در تهیه مواد غذایی دولتی باعث افتخار بود.", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳۰ مهر • ۲۲:۳۴"}, {"source": "Ars Technica", "title": "Electric or gas? BMW goes both ways with new 2027 X5 and iX5.", "link": "https://arstechnica.com/cars/2026/10/electric-or-gas-bmw-goes-both-ways-with-new-2027-x5-and-ix5/", "summary": "BMW provided flights from Washington, DC, to Los Angeles and accommodation so Ars could drive the new X5 and iX5, as well as a refreshed i7 (which you can read about soon). Ars does not accept paid editorial content. When we first drove BMW’s first Neue Klasse model, the iX3 , it quickly revealed that BMW knows how to make a good electric vehicle. A clean-sheet design, it featured the automaker’s sixth-generation electric powertrain , a completely reimagined dashboard, and powerful computers to run the whole show. Now, much of that technology is being ported over to the larger X5 line. But BMW knows not all its customers are ready to go electric, especially in the US, so it’s sticking with its powertrain-agnostic CLAR platform, as used in cars as diverse as the large 7 Series and the new gasoline 3 Series. Which means in addition to the all-electric iX5, there are also mild hybrid and plug-in hybrid X5s available, and in time, even a hydrogen-powered option. For now, as I’ll explain, I think the EV is the pick of the bunch. Get used to it, because this is what BMW SUV kidney grilles look like from now on. Credit: BMW If you looked very carefully you'd see this was an iX5 because there's no exhausts. Of course, reading the badge is probably easier. Credit: BMW Pick your power The most conventional option is the X5 40 xDrive, powered by a 3.0 L turbocharged inline six-cylinder engine that generates 394 hp (294 kW) and 428 lb-ft (580 Nm). The 48 V mild hybrid system can contribute a decent slug of torque (148 lb-ft/200 Nm) if necessary, and the engine operates under the Miller cycle for better efficiency, as well as featuring the usual BMW engine technology, like variable valve timing. Expect around 26 mpg (9 L/100 km) from this powertrain and a full-to-empty range of 569 miles (915 km). Read full article Comments", "date_str": "2026-10-22T19:01:23+00:00", "hash": "7640de0bea240f54", "title_fa": "برقی یا گازی؟ ب ام و با X5 و iX5 2027 جدید هر دو راه را پیش می برد.", "summary_fa": "BMW پروازهایی از واشنگتن دی سی به لس آنجلس و محل اقامت ارائه کرد تا Ars بتواند با X5 و iX5 جدید و همچنین i7 تازه شده (که به زودی می توانید در مورد آن بخوانید) رانندگی کند. Ars محتوای تحریریه پولی را نمی پذیرد. وقتی برای اولین بار با اولین مدل Neue Klasse BMW، iX3 راندیم، به سرعت نشان داد که BMW می داند چگونه یک وسیله نقلیه الکتریکی خوب بسازد. این خودرو با طراحی تمیز، دارای پیشرانه الکتریکی نسل ششم خودروساز، داشبورد کاملاً بازسازی‌شده و رایانه‌های قدرتمند برای اجرای کل نمایشگاه بود. اکنون، بسیاری از این فناوری به خط بزرگتر X5 منتقل می شود. اما ب‌ام‌و می‌داند که همه مشتریانش به‌ویژه در ایالات متحده آماده نیستند که به سمت برق حرکت کنند، بنابراین به پلتفرم CLAR خود که در خودروهای مختلف مانند سری ۷ بزرگ و سری ۳ بنزینی جدید استفاده می‌شود، پایبند است. این بدان معناست که علاوه بر iX5 تمام الکتریکی، X5 های هیبریدی ملایم و پلاگین هیبریدی نیز در دسترس هستند و به مرور زمان، حتی یک گزینه هیدروژنی نیز وجود دارد. در حال حاضر، همانطور که توضیح خواهم داد، فکر می کنم EV انتخاب دسته است. به آن عادت کنید، زیرا از این به بعد جلوپنجره کلیه SUV BMW اینگونه است. اعتبار: BMW اگر خیلی با دقت نگاه می‌کردید، می‌بینید که این یک iX5 است زیرا هیچ اگزوز وجود ندارد. البته خواندن نشان احتمالا راحت تر است. اعتبار: BMW قدرت خود را انتخاب کنید مرسوم‌ترین گزینه X5 40 xDrive است که از یک موتور شش سیلندر خطی 3.0 لیتری توربو شارژ می‌شود که 394 اسب بخار (294 کیلووات) و 428 پوند فوت (580 نیوتن متر) تولید می‌کند. سیستم هیبریدی ملایم 48 ولتی در صورت لزوم می تواند گشتاور مناسبی (148 پوند فوت/200 نیوتن متر) داشته باشد و موتور برای کارایی بهتر و همچنین دارای", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳۰ مهر • ۲۲:۳۱"}, {"source": "Ars Technica", "title": "Samsung all but confirms iPhone Duo is goosing Galaxy Z8 sales", "link": "https://arstechnica.com/gadgets/2026/10/samsung-all-but-confirms-iphone-duo-is-goosing-galaxy-z8-sales/", "summary": "Android-powered foldable phones have been available for years, but most people never paid attention to them. As predicted, that could be changing now that Apple has entered the folding phone market with the iPhone Duo . Analysts have speculated that Samsung's Z8 foldables were seeing a boost from the iPhone announcement, and now Samsung has seemingly confirmed that. In a new blog post , Samsung UK crows that the company's 2026 foldable lineup is moving much faster than last year's models. Compared to the Galaxy Z Fold 7, combined European sales for the Galaxy Z Fold 8 and Galaxy Z Fold 8 Ultra are up 45 percent. Samsung isn't talking about Z Flip 8 sales, but it previously noted that its larger foldables made up about 80 percent of foldable purchases. We can assume any increase there is not impressive enough to mention. The reason for flat Z Flip sales may simply be that Apple didn't release a flip phone. Unsurprisingly, Samsung doesn't menti ز به اندروید سال هاست که در", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۳۰ مهر • ۲۲:۱۹"}, {"source": "Ars Technica", "title": "US official: Russia's stalker satellite sure looks like an orbital weapon", "link": "https://arstechnica.com/space/2026/10/russia-claims-its-stalker-satellite-is-purely-peaceful-in-character/", "summary": "Four years ago, a senior official in Russia's foreign ministry painted a bullseye on commercial satellite networks that assist Ukraine in its fight against invading Russian military forces. On Wednesday, several days after a Russian military spacecraft moved within striking distance of one of those commercial satellites, the same Russian diplomat assured the world there's no reason to worry. There's a sharp incongruity in those statements from Konstantin Vorontsov, deputy head of Russia's delegation to the United Nations. Vorontsov's comments Wednesday in the UN General Assembly's First Committee came moments after a US official called attention to recent maneuvers by Kosmos 2612 , a Russian military craft that approached a US-registered commercial satellite some 340 miles (550 kilometers) above Earth. Read full article Comments", "date_str": "2026-10-22T18:29:39+00:00", "hash": "4d7845593defa3aa", "title_fa": "مقام آمریکایی: ماهواره استالکر روسیه مطمئناً شبیه یک سلاح مداری است", "summary_fa": "چهار سال پیش، یکی از مقامات ارشد وزارت خارجه روسیه در شبکه‌های ماهواره‌ای تجاری که به اوکراین در نبرد با نیروهای نظامی متجاوز روسیه کمک می‌کنند، تصویری را ترسیم کرد. روز چهارشنبه، چند روز پس از حرکت یک فضاپیمای نظامی روسیه در فاصله نزدیک یکی از آن ماهواره‌های تجاری، همان دیپلمات روسی به جهان اطمینان داد که دلیلی برای نگرانی وجود ندارد. یک تناقض شدید در این اظهارات کنستانتین ورونتسوف، معاون رئیس هیئت روسیه در سازمان ملل وجود دارد. اظهارات ورونتسوف در روز چهارشنبه در اولین کمیته مجمع عمومی سازمان ملل متحد لحظاتی پس از آن بیان شد که یک مقام آمریکایی توجه خود را به مانورهای اخیر Kosmos 2612، یک فروند هواپیمای نظامی روسیه که به یک ماهواره تجاری ثبت شده در ایالات متحده در حدود 340 مایل (550 کیلومتر) بالاتر از زمین نزدیک شد، بیان کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید چهار سال پیش، یکی از مقامات ارشد وزارت خارجه روسیه در شبکه‌های ماهواره‌ای تجاری که به اوکراین در نبرد با نیروهای نظامی متجاوز روسیه کمک می‌کند، تصویری را ترسیم کرد. در این اظهارات کنستانتین ورونتسوف، معاون رئیس هیئت روسیه در سازمان ملل، ناسازگاری شدیدی وجود دارد. اظهارات ورونتسوف در روز چهارشنبه در اولین کمیته مجمع عمومی سازمان ملل چند لحظه پس از آن بیان شد که یک مقام آمریکایی توجه خود را به مانورهای اخیر Kosmos 2612، یک فروند هواپیمای نظامی روسیه که به یک ماهواره تجاری ثبت شده در ایالات متحده در حدود 340 مایلی (550 کیلومتری) بالای زمین نزدیک شد، بیان کرد. برایان هاردستی، یکی از مقامات وزارت امور خارجه ایالات متحده، به کمیته سازمان ملل گفت: «تا آخر هفته گذشته، وزارت دفاع روسیه کوسموس 2612 با مانور عمدی خطرناک نزدیک به یک ماهواره تجاری،", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳۰ مهر • ۲۱:۵۹"}, {"source": "Ars Technica", "title": "Meta shocked by $25B fine after N.M. refused to join multistate settlement", "link": "https://arstechnica.com/tech-policy/2026/10/meta-whines-new-mexico-is-impossible-to-please-after-historic-25-billion-fine/", "summary": "Meta must pay $25 billion to New Mexico after a jury found the tech giant guilty of nearly 44 million violations of state consumer protection laws. The largest fine to ever hit Meta came after New Mexico Attorney General Raúl Torrez declined to join an $18 billion settlement Meta reached earlier this year with attorneys general in nearly all states. In his opinion Wednesday, US district court judge Francis J. Mathew said there was no “bright line rule” for determining the appropriate penalty for Meta's repeated and willful deception of users since 2010 about their “control of data, third-party data misuse, misinformation, hate speech, and equal enforcement.” Read full article Comments", "date_str": "2026-10-22T17:04:31+00:00", "hash": "d91f53f8263cc074", "title_fa": "متا از جریمه 25 میلیارد دلاری پس از اینکه N.M از پیوستن به شهرک چند ایالتی خودداری کرد، شوکه شد", "summary_fa": "متا باید ۲۵ میلیارد دلار به نیومکزیکو بپردازد، پس از اینکه هیئت منصفه غول فناوری را در حدود ۴۴ میلیون نقض قوانین حمایت از مصرف کننده مقصر تشخیص داد. بزرگ‌ترین جریمه‌ای که تا به حال به متا وارد شده، پس از آن صورت گرفت که رائول تورز، دادستان کل نیومکزیکو، از پیوستن به توافقی ۱۸ میلیارد دلاری که متا در اوایل سال جاری با دادستان‌های کل تقریباً در همه ایالت‌ها به آن دست یافت، خودداری کرد. به عقیده خود در روز چهارشنبه، قاضی دادگاه منطقه ای ایالات متحده، فرانسیس جی. متیو گفت هیچ «قانون خط روشنی» برای تعیین مجازات مناسب برای فریب مکرر و عمدی متا از کاربران از سال 2010 در مورد «کنترل داده‌ها، سوءاستفاده از داده‌های شخص ثالث، اطلاعات نادرست، سخنان نفرت‌انگیز، و اجرای برابر» وجود ندارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید پس از اینکه هیئت منصفه غول فناوری را در حدود 44 میلیون نقض قوانین حمایت از مصرف کننده ایالتی مقصر تشخیص داد، متا باید 25 میلیارد دلار به نیومکزیکو بپردازد. نیومکزیکو از دادگاه خواسته بود که جریمه های بیشتری را تا سقف 40 میلیارد دلار اعمال کند. تورز استدلال کرد که کل ایالت 2 میلیون نفری از رفتار متا آسیب دیده است، و مشکوک به نظر می رسید که متا تغییرات معنی داری ایجاد کند مگر اینکه این جریمه بر قیمت سهام متا تأثیر بگذارد. متیو دریافت که پرونده آزمایشی - که نشان می‌داد رهبری ارشد، از جمله مارک زاکربرگ، از این موضوع آگاه بودند که شرکتی که در آن زمان با نام فیس‌بوک شناخته می‌شد، نمایندگی‌های عمومی گمراه‌کننده را ارائه می‌کرد - از \"بالاترین سطح مجازات مجاز توسط قانون اعمال ناعادلانه NW\" پشتیبانی می‌کرد. متیو نوشت: «هیئت منصفه صریح بود: فیس بوک به طور سیستماتیک", "category": "هوش مصنوعی مولد", "tags": ["Meta", "بورس و طلا"], "datetime_fa": "۳۰ مهر • ۲۰:۳۴"}, {"source": "Ars Technica", "title": "US-backed vaccine trial on babies canceled after international outcry", "link": "https://arstechnica.com/health/2026/10/unethical-vaccine-trial-on-babies-backed-by-rfk-jr-is-formally-canceled/", "summary": "Government officials in Guinea-Bissau have formally rejected a clinical trial that would be run by Danish researchers and funded by the US to look for alleged nonspecific harms from the newborn dose of the hepatitis B vaccine. The vaccine dose is currently recommended globally for all newborns and has been used safely and effectively for decades. In an email to Ars Technica, one of the trial's lead researchers, Christine Stabell Benn of Bandim Health Project and the University of Southern Denmark, said that Guinea-Bissau's Council of Ministers \"formally reaffirmed its non-acceptance of the study on 16 October.\" The revelation that the study was formally rejected last week comes after news on Monday that judicial police in Guinea-Bissau raided Bandim Health's offices and seized vaccines . Stabell Benn highlighted that the police search came after the trial was rejected. Read full article Comments", "date_str": "2026-10-22T16:37:00+00:00", "hash": "d6e9bca1c5bed45d", "title_fa": "آزمایش واکسن تحت حمایت ایالات متحده بر روی نوزادان پس از اعتراض بین المللی لغو شد", "summary_fa": "مقامات دولتی در گینه بیسائو به طور رسمی آزمایش بالینی را که توسط محققان دانمارکی و با بودجه ایالات متحده برای بررسی مضرات غیراختصاصی ادعا شده ناشی از دوز نوزادی واکسن هپاتیت B انجام می شود، رد کرده اند. دوز واکسن در حال حاضر در سطح جهانی برای همه نوزادان توصیه می شود و برای چندین دهه به طور ایمن و موثر استفاده شده است. در ایمیلی به Ars Technica، یکی از محققین اصلی این کارآزمایی، کریستین استابل بن از پروژه سلامت باندیم و دانشگاه جنوب دانمارک، گفت که شورای وزیران گینه بیسائو \"در 16 اکتبر رسماً عدم پذیرش این مطالعه را تایید کرد.\" افشای این که این مطالعه هفته گذشته رسماً رد شد، پس از اخبار روز دوشنبه منتشر شد که پلیس قضایی در گینه بیسائو به دفاتر باندیم هلث یورش برد و واکسن‌هایی را توقیف کرد. استابل بنن تاکید کرد که جستجوی پلیس پس از رد دادگاه انجام شد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید مقامات دولتی در گینه بیسائو به طور رسمی آزمایش بالینی را که توسط محققان دانمارکی اجرا می شد و توسط ایالات متحده تأمین مالی می شد برای بررسی مضرات غیراختصاصی ناشی از ورم هپاتیت تازه متولد شده رد کردند. دوز واکسن در حال حاضر در سطح جهانی برای همه نوزادان توصیه می شود و برای چندین دهه به طور ایمن و موثر استفاده شده است. استابل بن در مورد رد این محاکمه نوشت: «ما از این تصمیم متأسفیم زیرا مطالعه را از نظر علمی و اخلاقی موجه می‌دانستیم، اما به اختیار دولت برای تصمیم‌گیری درباره ادامه تحقیقات در کشور احترام می‌گذاریم.»", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳۰ مهر • ۲۰:۰۷"}, {"source": "Ars Technica", "title": "This emulator reimagines Nintendo’s Virtual Boy with a full color display", "link": "https://arstechnica.com/gaming/2026/10/this-emulator-reimagines-nintendos-virtual-boy-with-a-full-color-display/", "summary": "Last year, we reported on Red Viper , a Virtual Boy emulator that added a splash of Super Game Boy-style color to Nintendo's famously failed red-on-black \"portable\" 3D headset from the '90s. Now, a new emulation experiment, VBoy Color , has taken the concept to a higher level, using a tile-based palette system that allows for many more distinct colors in each individual Virtual Boy frame. Rather than simply replacing the Virtual Boy's four shades of red with four different colors, VBoy Color's readme files explain how the emulator's game-specific Color Packs can assign a distinct four-color palette to each 8x8 tile in a Virtual Boy scene. That means the emulator can differentiate between green pipes, grey platforms, and red brick wall in Mario Clash , for instance, even though all those in-game objects share the same overlapping red hues in the original game. The Game Boy Color-esque results feel like being transported into an alternate history where Nintendo invested in a full-color display rather than cheaper red LEDs for the Virtual Boy hardware. The increased contrast between differently colored elements is particularly welcome in games like Jack Bros. or Vertical Force , where the original red-on-red display often makes it hard to differentiate the player-character from busy red background elements. Read full article Comments", "date_str": "2026-10-22T15:59:40+00:00", "hash": "1b3d2102c792e7c3", "title_fa": "این شبیه ساز Virtual Boy نینتندو را با نمایشگر تمام رنگی دوباره تصویر می کند", "summary_fa": "سال گذشته، ما در مورد Red Viper، شبیه‌ساز Virtual Boy گزارش دادیم که رنگ‌هایی به سبک Super Game Boy را به هدست سه‌بعدی «قابل‌حمل» معروف و ناموفق نینتندو در دهه 90 اضافه کرد. اکنون، یک آزمایش شبیه‌سازی جدید، VBoy Color، این مفهوم را به سطح بالاتری رسانده است، با استفاده از یک سیستم پالت مبتنی بر کاشی که اجازه می‌دهد تا رنگ‌های متمایز بیشتری را در هر فریم Virtual Boy جداگانه انتخاب کنید. به جای جایگزینی ساده چهار سایه قرمز Virtual Boy با چهار رنگ مختلف، فایل‌های readme VBoy Color توضیح می‌دهند که چگونه بسته‌های رنگی مخصوص بازی شبیه‌ساز می‌توانند یک پالت چهار رنگ متمایز را به هر کاشی 8x8 در صحنه Virtual Boy اختصاص دهند. این بدان معناست که شبیه‌ساز می‌تواند بین لوله‌های سبز، پلتفرم‌های خاکستری و دیوار آجری قرمز در بازی Mario Clash تمایز قائل شود، حتی اگر همه آن اشیاء درون بازی دارای رنگ‌های قرمز روی هم‌پوشانی مشابهی در بازی اصلی هستند. نتایج شبیه به رنگ Game Boy مانند انتقال به تاریخ دیگری است که در آن نینتندو روی یک نمایشگر تمام رنگی به جای LEDهای قرمز ارزان‌تر برای سخت‌افزار Virtual Boy سرمایه‌گذاری کرده است. کنتراست افزایش یافته بین عناصر با رنگ های متفاوت به ویژه در بازی هایی مانند Jack Bros. یا Vertical Force مورد استقبال قرار می گیرد، جایی که نمایشگر اصلی قرمز روی قرمز اغلب تمایز کاراکتر بازیکن را از عناصر پس زمینه قرمز شلوغ دشوار می کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای  billion in 2014. Forbes named her the youngest self-made female billionaire—she was worth $4.5 billion when she was just 30 years old. Things started to unravel in 2015, when an investigation by the Wall Street Journal raised concerns by former Theranos employees that the tests didn’t work. Some also said that the company’s device had not been tested properly, and that blood samples had been analyzed on machines from other companies instead. MIT Technology Review named it one of the biggest technology failures of 2015 . Forbes had revised Holmes’s worth to $0 by 2016. That year, a damning government report said that the company’s lab was struggling with basic procedures and gave patients results even when they knew they could be wrong. In 2018, Theranos, Holmes, and former company president Ramesh Balwani were charged with “massive fraud.” In 2022, she was sentenced to a little over 11 years in prison for defrauding investors. She began serving her sentence in May 2023. It was around a month before this that filmmakers Nathan Fielder, Lance Oppenheim, and their colleagues began documenting Holmes and her partner, Billy Evans, at home with their two young children. I’m not giving anything away when I say it’s an extremely intimate portrayal—at least of how the two adults", "date_str": "2026-10-23T09:00:00+00:00", "hash": "691f8a267ceb9741", "title_fa": "در دنیای بیوتکنولوژی، شما نمی توانید همه چیز را ببینید", "summary_fa": "اوایل این هفته، من در نمایش فیلم «شما می توانید همه چیز را ببینید» شرکت کردم، مستند جدید پر سر و صدا درباره الیزابت هولمز، مدیرعامل سابق بیوتکنولوژی. من واقعاً نمی دانستم چه انتظاری دارم وارد شدم. من از اسپویل اجتناب کرده ام (و در اینجا هم چیزی تقدیم نمی کنم!). با توجه به اینکه بسیاری از ما به لطف سال ها پوشش رسانه ای، کتاب پرفروش Bad Blood و سریال Hulu The Dropout با بازی آماندا سایفرید چقدر با داستان Theranos آشنا هستیم، فکر می کردم که این فیلم چه اطلاعات جدیدی را می تواند فاش کند. مانند بسیاری دیگر که فیلم را دیده اند، من هم با احساس ناآرامی ب ement , scheduling, and optimization decisions that determine how efficiently model intelligence becomes a production capability. For technical executives, that changes where AI investment should go—and what they should demand from the architecture supporting it. Start with the workload, not the model There is no universally “best” model or AI architecture. There is only the right solution for the business problem. A customer-facing assistant optimized for fast responses has fundamentally different requirements from a document-processing pipeline that can run overnight. An internal knowledge application and a high-volume customer service platform may use the same foundation model but require very different serving architectures. The workload defines the constraints. The constraints should determine the architecture. That sounds simple, but it runs counter to the way many organizations have approached early AI deployments. During a proof of concept, model accuracy naturally dominates the discussion. Production introduces constraints that are much easier to ignore when only a handful of users are involved: latency, concurrency, memory pressure, GPU utilization, infrastructure cost, and unpredictable traffic. A model that produces marginally better answers is not necessarily the better production choice if it doubles inference costs or cannot meet the application s latency requirements. Not every workload needs a Ferrari. Sometimes the smarter engineering decision is the model that delivers exactly the performance the business needs without paying for capability it doesn t. The objective should be to deploy the right intelligence at the right cost for the workload. That makes serving architecture more than an engineering concern. It becom", "date_str": "2026-10-22T21:17:29+00:00", "hash": "7d4fee361441993c", "title_fa": "طراحی یک مهار سرویس هوش مصنوعی که برای دوام ساخته شده است", "summary_fa": "مزیت رقابتی بعدی در هوش مصنوعی سازمانی کمتر به مدلی که انتخاب می‌کنید نسبت cal-php-vulnerabilities/", "summary": "اوبونتو با انتشار وصله‌هایی، دو آسیب‌پذیری بحرانی PHP را برطرف کرد که به نفوذگران اجازه می‌داد بدون احراز هویت، از راه دور روی سرور کد اجرا کنند.", "date_str": "2026-10-23T09:39:06+00:00", "hash": "522b28130bf21741", "title_fa": "آپدیت‌های امنیتی اوبونتو برای رفع بحران امنیتی PHP از راه رسیدند", "summary_fa": "اوبونتو با انتشار وصله‌هایی، دو آسیب‌پذیری بحرانی PHP را برطرف کرد که به نفوذگران اجازه می‌داد بدون احراز هویت، از راه دور روی سرور کد اجرا کنند. تبلیغات اوبونتو برای دو آسیب‌پذیری امنیتی بسیار جدی در PHP وصله منتشر کرد ؛ نقص‌هایی که می‌توانند به مهاجم اجازه دهند بدون واردکردن نام کاربری و رمز عبور، از راه دور روی سرور قربانی کد اجرا کند. این دو حفره با شناسه‌های CVE-2026-109618 و CVE-2026-109619 ثبت شده‌اند و با نام php2shell نیز شناخته می‌شوند. هر دو آسیب‌پذیری امتیاز ۹٫۲ از ۱۰ را در معیار CVSS 4.0 دریافت کرده‌اند و در رده‌ی «بحرانی» قرار می‌گیرند. اهمیت این حفره‌ها از آنجا ناشی می‌شود که مهاجم برای سوءاستفاده از آن‌ها به احراز هویت نیاز ندارد و در صورت دسترسی شبکه‌ای به یک برنامه‌ی PHP، می‌تواند کد دلخواه خود را با سطح دسترسی برنامه روی سیستم اجرا کند. آسیب‌پذیری‌ها قرار بود دیروز به‌صورت عمومی اعلام شوند؛ اما پس از انتشار زودهنگام بخشی از اطلاعات در اینترنت، زمان افشای عمومی به ۲۱ اکتبر (۲۹ مهر) منتقل شد. اوبونتو اکنون اصلاحیه‌های لازم را برای نسخه‌های پشتیبانی‌شده منتشر کرده است. کپی لینک کدام نسخه‌های اوبونتو باید به‌روزرسانی شوند؟ اصلاحیه برای طیف گسترده‌ای از نسخه‌های اوبونتو منتشر شده است؛ از نسخه‌های قدیمی مانند Ubuntu 14.04 و 16.04 گرفته تا نسخه‌های جدید Ubuntu 22.04، 24.04، 26.04 و 26.10. نسخه‌ی PHP درگیر بسته به نسخه‌ی اوبونتو متفاوت است و از PHP 5 در نسخه‌های بسیار قدیمی تا PHP 8.5 در نسخه‌های جدید را شامل می‌شود. پس از نصب وصله، برنامه‌هایی که از PHP استفاده می‌کنند نیز ممکن است نیاز به راه‌اندازی مجدد داشته باشند. برای نمونه، در سامانه‌ای که PHP را از طریق Apache اجرا می‌کند، باید سرویس Apache دوباره راه‌اندازی شود. راه دیگر راه‌اندازی مجدد کامل سیستم است. اوبونتو می‌گوید قابلیت unattended-upgrades در نسخه سسه کانترپوینت، می‌گوید: «اولویت برخی شرکت‌ها به سمت چینش‌هایی تغییر یافته است که توانایی بهتری برای مهار تورم قطعات دارند، رویکردی که گزینه‌های مقرون‌به‌صرفه را برای خریداران حساس به قیمت کاهش می‌دهد.» برخی تولیدکنندگان سخت‌افزار برای مدیریت هزینه‌ها به احیای فناوری‌های قدیمی‌تر روی آورده‌اند و استفاده از رم‌های DDR4 و پردازنده‌های گرافیکی ۴ گیگابایتی را دوباره در دستور کار قرار داده‌اند. در سوی دیگر، خریدهای عمده پیش از پایان مهلت پشتیبانی ویندوز ۱۰ و تنظیم موجودی انبارها به‌دلیل تعرفه‌ها در سه‌ماهه سوم سال ۲۰۲۵، عامل مقایسه‌ای دیگری است که بر افت سنگین آمار سه‌ماهه اخیر تاثیر گذاشت. دیوید نارانخو ، مدیر ارشد مؤسسه کانترپوینت، می‌گوید: «با توجه به پیش‌بینی افت ۲۷ درصدی عرضه‌ی جهانی در سه‌ماهه چهارم ۲۰۲۶ و تداوم ثبات نسبی در سال ۲۰۲۷، نباید تثبیت وضعیت را با بهبود بازار اشتباه گرفت.» لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟", "category": "هوش مصنوعی مولد", "tags": ["Apple", "تراشه"], "datetime_fa": "۱ آبان • ۱۰:۳۰"}, {"source": "Zoomit", "title": "گوشی اقتصادی جدید سامسونگ حالا در آستانه رونمایی است", "link": "https://www.zoomit.ir/mobile/469614-galaxy-a08-5g-imei-appearance/", "summary": "گوشی اقتصادی Galaxy A08 5G با حضور در پایگاه داده IMEI، یک گام دیگر به رونمایی رسمی نزدیک‌تر شد.", "date_str": "2026-10-23T06:40:00+00:00", "hash": "6adf3b94968853ed", "title_fa": "گوشی اقتصادی جدید سامسونگ حالا در آستانه رونمایی است", "summary_fa": "گوشی اقتصادی Galaxy A08 5G با حضور در پایگاه داده IMEI، یک گام دیگر به رونمایی رسمی نزدیک‌تر شد. تبلیغات سامسونگ فرایند توسعه‌ی ارزان‌ترین گوشی نسل جدید خود را پیش می‌برد. گلکسی A08 5G در دیتابیس IMEI رؤیت شد ؛ اتفاقی که مهر تاییدی بر تولید دستگاه می‌زند و نشان می‌دهد فاصله‌ی چندانی تا عرضه‌ی نهایی باقی نمانده است. غول کره‌ای ماه گذشته مدل پایه‌ی گلکسی A08 4G را به بازار فرستاد و گزارش‌های پیشین نیز از برنامه‌ریزی برای ساخت نسخه‌ی 5G حکایت داشتند. بر اساس اطلاعات فاش‌شده، احتمال دارد رونمایی رسمی در فوریه‌ی ۲۰۲۷ (بهمن و اسفند) رقم بخورد که فاصله‌ای حدود سه‌ماهه با زما  have recently lived through instability that made me really appreciate the kinds of standard comforts that are currently easily accessible. Our family experienced the impact of a major hurricane only two years ago (Hurricane Helene), and when water, electricity, and telecommunications were interrupted for days and then weeks, I realized that a relatively modest amount of money and supplies would have made weathering a period of instability easier. This is the place where my husband and I diverge: I tend to see things somewhat pessimistically, believing there's a good chance supply chains will be interrupted more than a few times during our lifetimes due to a variety of factors. My husband has a generally optimistic, risk-tolerant approach to life. He knows we've made a solid plan for retirement, so he sees that a brokerage account offers promising returns (not guaranteed, but based on historical data) on funds that we've worked hard to earn. I'm sometimes fearful of the possibility of losing everything in a stock market crash. I don't think either of us is truly at odds with the other person: my husband witnessed Helene and set to work setting up a battery backup system for", "date_str": "2026-10-23T10:51:01+00:00", "hash": "468a452f64d3fbbf", "title_fa": "من و همسرم تحمل ریسک و رویکردهای متفاوتی برای سرمایه گذاری داریم. در اینجا نحوه برخورد ما با آن است.", "summary_fa": "نویسنده و همسرش رویکرد متفاوتی به سرمایه گذاری دارند، اما متوجه شده اند که چگونه یک زمینه مشترک پیدا کنند. با حسن نیت از لورا لیویت من و همسرم رویکردهای متفاوتی برای سرمایه گذاری داریم. او ریسک پذیر است و من کمی ریسک گریزتر هستم. با این حال، ما موفق شده ایم از طریق تصمیمات مالی صحبت کنیم و نقطه مشترکی پیدا کنیم. صحبت به خاطر یک پول بادآورده شروع شد: اولین ماه بود که شهریه پیش دبستانی را نداشتیم، زیرا پسرم در حال شروع مهدکودک بود. به شوهرم گفتم: \"دوست دارم این پول فقط در بودجه ماهانه محو نشود.\" سرش را تکان داد و بلافاصله پیشنهادی داشت. \"اگر از آن برای راه اندازی یک حساب کارگزاری استفاده کنیم، چه
