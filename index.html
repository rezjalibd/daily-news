 خیلی وقته! ماریا کری یک بار دیگر درمان باربی را انجام می دهد، درست به موقع برای فصل تعطیلات. متل عروسک کلکسیونی جدیدی را با الهام از موزیک ویدیوی \"All I Want for Christmas Is You\" خواننده منتشر می کند و ظاهر جشن او را با الهام از بابانوئل بازسازی می کند. این عروسک در تاریخ 18 نوامبر به سایت Mattel Creations می رسد، با علامت [ ] اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. کری که سرود تعطیلاتش در سال 1994 تبدیل به یکی از بهترین ها در چارت ها شده است، در حال حاضر اجراهای کریسمس خود را به خارج از کشور می آورد و در اواخر این ماه در بیرمنگام، لندن و منچستر برنامه ریزی شده است. او همچنین شانزدهمین آلبوم استودیویی خود را با نام \"Here for It All\" در سال 2025 منتشر کرد. کری در بیانیه ای گفت: \"کریسمس همیشه برای من زمان جادویی بوده است، بنابراین اینکه باربی دوباره این فصل را با من جشن بگیرد فوق العاده خاص است. دیدن این ظاهر جشن که دوباره به عنوان یک عروسک باربی تجسم شده است، یک لحظه دایره کامل سرگرم کننده است. امیدوارم او شادی، زرق و برق و شادی تعطیلات را در جشن های امسال به ارمغان آورد!» کری به فهرست رو به رشدی از اسطوره های موسیقی می پیوندد که در مجموعه امضای باربی ماتل جاودانه شده اند. اوایل سال جاری، این شرکت از عروسک ویتنی هیوستون که برگرفته از موزیک ویدیوی «I Wanna Dance With Somebody» بود، همراه با عروسک سلین دیون که اجرای «قلب من ادامه خواهد داد» خواننده در اسکار 1998 را بازسازی کرد، رونمایی کرد. سایر نوازندگانی که تحت درمان باربی قرار می گیرند عبارتند از تینا", "image_url": "https://variety.com/wp-content/uploads/2026/11/2-Split-3x2-1.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۹:۳۰"}, {"source": "Variety", "title": "Box Office: ‘Hunger Games: Sunrise on the Reaping’ Targets Huge Debut Above $100 Million", "link": "https://variety.com/2026/film/box-office/sunrise-on-reaping-box-office-hunger-games-opening-weekend-1236950225/", "summary": "The box office odds will certainly be in favor of The Hunger Games: Sunrise on the Reaping. The latest installment in Lionsgate s dystopian franchise is targeting a stellar debut above $100 million from 3,900 North American theaters. Exhibitors are bullish that goodwill toward the property, as well as excitement for the return of some fan-favorite [ ]", "date_str": "2026-11-18T15:47:58+00:00", "hash": "4a61cb9763f507a0", "title_fa": "باکس آفیس: «بازی‌های گرسنگی: طلوع آفتاب در درو» با هدف فروش هنگفتی بالای 100 میلیون دلار", "summary_fa": "شانس باکس آفیس مطمئناً به نفع The Hunger Games: Sunrise on the Reaping خواهد بود. آخرین قسمت از فرنچایز دیستوپیایی لاینزگیت با هدف اکران فوق‌العاده بالای 100 میلیون دلار از 3900 سینمای آمریکای شمالی ساخته شده است. غرفه داران از حسن نیت نسبت به این ملک خوش بین هستند، و همچنین هیجان برای بازگشت برخی مورد علاقه طرفداران [ ] Sunrise on the Reaping ششمین ورودی از سری بازی های گرسنگی است و دقیقاً سه سال پس از فصل قبلی، یعنی تصنیف پرندگان آوازخوان و مارها در سال 2023 فرود می آید. این فیلم، یک پیش‌درآمد با بازی ریچل زگلر در نقش لوسی گری بیرد و تام بلیت در نقش کورولانیوس اسنو جوان، دیکتاتور آینده پانم، بود که تنها 44 میلیون دلار فروش داشت اما توانست در سطح جهانی به 363 میلیون دلار برسد و با توجه به بودجه 100 میلیون دلاری‌اش، به یک موفقیت تجاری تبدیل شود. شروع فیلم «طلوع در زمان برداشت» باید شبیه به حماسه‌ی اصلی باشد، که برای استودیو مایهٔ دلگرمی است، زیرا این قسمت بیش از 150 میلیون دلار هزینه دارد. برای مرجع، بازی‌های گرسنگی در سال 2012 با سه قسمت بعدی، «Catching Fire» (158 میلیون دلار) در سال 2013، «Mockingjay Part 1» در سال 2014 (121 میلیون دلار) و «Mockingjay» در سال 2015، «هفته افتتاحیه هفته آخر هفته دوم» (High-end weekend 2) در سال 2015، به فروش 152 میلیون دلاری دست یافتند. به عنوان یک فرنچایز، «بازی‌های گرسنگی» بیش از 3.3 میلیارد دلار در باکس آفیس جهانی فروش داشته است و «آتش گرفتن» با 865 میلیون دلار پرفروش‌ترین فیلم است. فیلم Sunrise on the Reaping بر اساس رمان سوزان کالینز 25 سال قبل از سریال اصلی اتفاق می افتد. در صبح روز درو پنجاهمین بازی گرسنگی، معروف به کوارتر دوم، شروع می‌شود و هیمیچ آبرناتی (جوزف زادا) را دنبال می‌کند که مجبور می‌شود وارد", "image_url": "https://variety.com/wp-content/uploads/2026/11/MCDHUGA_LG071.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۷ آبان • ۱۹:۱۷"}, {"source": "Variety", "title": "Bruce Springsteen Concert Doc ‘When the Walls Came Down’ in the Works from Legendary Entertainment, Passion Pictures and Sony Music Vision", "link": "https://variety.com/2026/film/news/bruce-springsteen-concert-doc-when-the-walls-came-down-1236950655/", "summary": "When the Walls Came Down, a documentary about Bruce Springsteen and The E Street Band s 1988 East Berlin concert, is in the works from Legendary Entertainment, Passion Pictures and Sony Music Vision. Nicholas de Taranto and Danielle Peck serve as co-directors and produce alongside Passion Pictures. James Marsh, the Oscar-winning director of 2008 s Man on [ ]", "date_str": "2026-11-18T15:30:00+00:00", "hash": "4c4ca12c4331a2a1", "title_fa": "مستند کنسرت بروس اسپرینگستین با نام «When the Walls Came Down» از کمپانی Legendary Entertainment، Passion Pictures و Sony Music Vision ساخته شده است.", "summary_fa": "هنگامی که دیوارها فرو ریختند، مستندی درباره کنسرت بروس اسپرینگستین و گروه ای استریت بند در سال 1988 در برلین شرقی، توسط کمپانی Legendary Entertainment، Passion Pictures و Sony Music Vision در دست ساخت است. نیکلاس دی تارانتو و دانیل پک به عنوان کارگردان و تهیه کننده در کنار Passion Pictures فعالیت می کنند. جیمز مارش، کارگردان برنده اسکار سال 2008 مرد در [ ] وقتی دیوارها فرو ریختند، اسپرینگستین را از اولین دیدارش از برلین شرقی در سال 1981 تا اجرای سال 1988 دنبال می کند و شامل مصاحبه هایی با اسپرینگستین، جان لاندو و اعضای گروه ای استریت، از جمله روی بیتان، پتی اسکیالبرگ، استوی وان زانین است. طبق توضیحات رسمی، نمایش برلین بزرگترین کنسرتی است که اسپرینگستین و گروه ای استریت در کارنامه خود اجرا کرده اند. برای نسلی که تحت یک رژیم کمونیستی به شدت سرکوبگر به بلوغ رسیدند، کنسرت به یک کاتالیزور برای تغییر تبدیل شد. سال بعد، بسیاری از همین جوانان به فرو ریختن خود دیوار کمک کردند. اسپرینگستین گفت: \"به یاد دارم که دیوار را دیدم و گفتم: \"این درست نیست. این یک توهین علیه بشریت است.\" آن روز سعی می کردیم با کل کشور برقصیم. مارش افزود: \"این فیلم لحظه ای منحصر به فرد و پرمخاطب در فرهنگ پاپ و قدرت باورنکردنی آن بر ژئوپلیتیک را بررسی می کند. سخنان بروس از آن شب اکنون بیش از هر زمان دیگری طنین انداز شده است و ما را به یاد قدرت پایدار و متحد کننده موسیقی می اندازد.\" اسپرینگستین، رویاپرداز راک اند رول پشت متولد شدن برای دویدن و متولد شدن در ایالات متحده، اخیراً تجدید حیات در فرهنگ موسیقی پاپ را تجربه کرده است. داستان پشت ششمین آلبوم استودیویی او نبراسکا در آلبوم اسکات کوپر مرا از ناکجاآباد تحویل بده، که جرمی آلن وایت در نقش رئیس نقش اصلی را ایفا کرد،", "image_url": "https://variety.com/wp-content/uploads/2026/11/Unknown_633f86.jpeg?crop=0px%2C33px%2C947px%2C532px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۷ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "‘Bad Boys for Life’ Directors Adil El Arbi and Bilall Fallah Invest in ‘Sound of Metal’ Producer Caviar (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/bad-boys-for-life-adil-el-arbi-bilall-fallah-invest-caviar-1236951660/", "summary": "Adil El Arbi and Bilall Fallah, the Belgian directing duo behind 2020 s smash hit sequel Bad Boys for Life starring Will Smith and Martin Lawrence, have invested in award-winning production company Caviar. The two have taken a minority stake in the fellow Belgian outfit, joining as shareholders through their banner Los Morros. Over the last [ ]", "date_str": "2026-11-18T15:15:00+00:00", "hash": "636db88c284bbc1e", "title_fa": "کارگردانان «پسران بد برای همیشه» عادل العربی و بلال فلاح در شرکت تهیه‌کننده «صدای فلز» یعنی Caviar سرمایه‌گذاری می‌کنند (اختصاصی)", "summary_fa": "عادل الاربی و بلال فلاح، دو کارگردان بلژیکی که دنباله فیلم موفق فیلم پسران بد برای زندگی در سال 2020 با بازی ویل اسمیت و مارتین لارنس در آن نقش آفرینی کرده اند، در شرکت تولید برنده جایزه Caviar سرمایه گذاری کرده اند. این دو سهام اقلیت در لباس بلژیکی دیگر را به خود اختصاص داده اند و به عنوان سهامدار از طریق بنر خود Los Morros به آن ملحق شده اند. در طول 20 سال گذشته، خاویار، همچنین مستقر در بلژیک، در هر دو فضای فیلمنامه، بدون فیلمنامه و برند کار کرده است و بیشتر برای Sound of Metal که نامزد شش جایزه اسکار در سال 2020 بود، از جمله بهترین فیلم، برنده بهترین صدا و بهترین تدوین فیلم شناخته شده است. پروژه‌های دیگر عبارتند از زک وودز، فیلم The Accompanist که برای اولین بار در Tribeca نمایش داده شد، و The Best Immigrant که توسط Arbi و Fallah تهیه شده است. این شرکت در حال حاضر حدود 200 میلیون یورو (219 میلیون دلار) درآمد سالانه دارد و قصد دارد این میزان را در سال های آینده دو برابر کند. داستان‌های مرتبط پیش‌بینی‌های اسکار: تدوین فیلم - «شما می‌توانید همه چیز را ببینید» به نظر می‌رسد در مسابقه برندگان گذشته شکست بخورد و به سومین مستندی تبدیل شود که تا به حال نامزد دریافت جایزه اسکار شده است. مشکی. از آن زمان، این زوج کارگردان فیلم «پسران بد برای زندگی» (426 میلیون دلار در سراسر جهان) و دنباله آن «پسران بد سوار یا بمیرند» (405 میلیون دلار)، به‌علاوه «خانم مارول» برای دیزنی پلاس، «بارش برف» برای FX و Rebel که در کن نمایش داده شد. آنها همچنین Batgirl را کارگردانی کردند، که در زمان پس از تولید در برادران وارنر و به عنوان بخشی از کاهش هزینه های دیوید زاسلاو، به طور بحث انگیزی کنار گذاشته شد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Copyright-Maureen-De-Wit-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "سرمایه‌گذاری", "بورس و طلا"], "datetime_fa": "۲۷ آبان • ۱۸:۴۵"}, {"source": "Variety", "title": "Florence Pugh Fires Back at Video Claiming She Used Plastic Surgery to Change Her Face: ‘Disturbing’ How ‘People Can’t Tell the Difference Between Aging and Surgery’", "link": "https://variety.com/2026/film/news/florence-pugh-plastic-surgery-claims-face-shape-change-1236951789/", "summary": "Florence Pugh is shutting down speculation over whether or not she s had plastic surgery done to her face. The Oscar nominee left a comment on an Instagram video posted by Evie magazine in which she called it disturbing how people can no longer tell the difference between natural aging and plastic surgery. The video called [ ]", "date_str": "2026-11-18T15:10:38+00:00", "hash": "9d822fa59c4a50fa", "title_fa": "فلورانس پیو با ادعای اینکه از جراحی پلاستیک برای تغییر چهره خود استفاده کرده است، واکنش نشان داد: چگونه «آدم ها نمی توانند تفاوت بین پیری و جراحی را تشخیص دهند»", "summary_fa": "فلورانس پوگ گمانه زنی ها در مورد اینکه آیا او جراحی پلاستیک روی صورتش انجام داده است یا خیر را متوقف می کند. نامزد اسکار در یک ویدیوی اینستاگرامی که توسط مجله Evie منتشر شده بود، کامنتی گذاشت و در آن آن را نگران‌کننده خواند که مردم دیگر نمی‌توانند تفاوت بین پیری طبیعی و جراحی پلاستیک را تشخیص دهند. این ویدیو به نام [ ] بچه ها. من 30 ساله شدم. من یک زن هستم. بدن و چهره تغییر می کند پوگ نوشت، آنقدرها هم عمیق نیست. این واقعیت که مردم حتی نمی توانند بین پیری و عمل جراحی تشخیص دهند، آزاردهنده است. Sadly puppy fluff doesn’t last forever. داستان‌های مرتبط اسکار: بهترین موسیقی متن - آیا یکی از نادیده گرفته‌ترین آهنگسازان هالیوود بالاخره می‌تواند لحظه‌ای را به دست آورد؟ پیش‌بینی‌های اسکار: تدوین فیلم - «شما می‌توانید همه چیز را ببینید» به نظر می‌رسد که مسابقه برندگان گذشته را شکست دهد و به سومین مستندی تبدیل شود که تاکنون نامزد شده است. آیا اینجا فضای امنی است؟ مفسر Evie می گوید مردم می گویند فلورانس پیو با چهره های گرد قربانی جنگ هالیوود شده است. اشتباه نکنید، فلورانس پیو هنوز زیبا به نظر می رسد، اما فکر می کنم همه ما می توانیم در مجموع موافق باشیم که به نظر می رسد هالیوود این ویژگی را در مقابل ویژگی های نرم تر دارد. چیزی که در حال حاضر در صنعت سرگرمی و صنعت مدلینگ مطلوب است، این ظاهر حجاری شده و ربوده شده است. بسیاری از مردم به این نکته اشاره می کنند که فلورانس چگونه گونه های پر و زیبایی داشت که چهره او را فوق العاده تشخیص می داد. اکنون که فک او مشخص تر است، چانه او تیزتر و فک او تیزتر است، منطقی است که چرا مردم از خود می پرسند که آیا او کار انجام", "image_url": "https://variety.com/wp-content/uploads/2026/11/P108WTFP.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۷ آبان • ۱۸:۴۰"}, {"source": "Variety", "title": "India’s ‘How Love Moves’ Among Top Winners at IDFA Industry Section Awards", "link": "https://variety.com/2026/film/asia/india-how-love-moves-idfa-industry-section-awards-1236951872/", "summary": "India’s “How Love Moves” won the Al Jazeera Documentary Co-Production Award Wednesday at the prizegiving ceremony of Forum, the co-production and co-financing market of leading documentary festival IDFA. Pallavi Paul’s film centers on a century-old graveyard in New Delhi, where the “slow seeping poison of communal hatred and the everyday beauty and brutality of the [ ]", "date_str": "2026-11-18T15:05:17+00:00", "hash": "ff9adce68fb1682d", "title_fa": "«عشق چگونه حرکت می‌کند» هند در میان برندگان برتر جوایز بخش صنعت IDFA", "summary_fa": "فیلم هندی «عشق چگونه حرکت می‌کند» برنده جایزه مستند الجزیره در مراسم اهدای جوایز فروم، بازار تولید مشترک و تامین مالی جشنواره پیشرو مستند IDFA شد. فیلم پالاوی پل بر یک گورستان صد ساله در دهلی نو متمرکز است، جایی که «زهر آهسته نفرت جمعی و زیبایی و وحشیگری روزمره [ ] هندی «چگونه عشق حرکت می کند» برنده جایزه تولید مشترک الجزیره در مراسم اهدای جوایز انجمن و بازار مشترک فیلم مشترک IDFA شد. تمرکز فیلم پالاوی پل در قبرستانی صد ساله در دهلی نو است، جایی که «زهر آهسته نفرت جمعی و زیبایی و وحشیگری روزمره شهر به اوج خود می رسد، در حالی که یک گورستان بی ادعا برای حفظ قداست مردگان مبارزه ای تنها به راه می اندازد». داستان‌های مرتبط Avengers: Doomsday رایان رینولدز و هیو جکمن را در میان 10 نویسنده فهرست می‌کند. پیش‌بینی‌های اسکار: تدوین فیلم - «شما می‌توانید همه چیز را ببینید» به نظر می‌رسد در مسابقه برندگان گذشته شکست بخورد و به سومین مستندی تبدیل شود که تا به حال نامزد شده است توسط Amann Mann و Kirabbit Senaks تهیه شده است. این جایزه، که «پروژه‌هایی را که به یک مسئله فوری زمان ما می‌پردازند» که در دسته‌های Pitch یا Roundtable ارائه می‌شوند به رسمیت می‌شناسد، با یک جایزه 25000 دلاری همراه است. اعضای هیئت منصفه محمد المانگی و بریجید او شیا گفتند این پروژه که آنها آن را \"از لحاظ سیاسی و خلاقانه پیچیده\" توصیف کردند، \"آسیب پذیری جوامعی را که از طریق خشونت های دولتی خطرناک و اشتباه تلقی می شوند\" بررسی می کند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/How-Love-Moves.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۷ آبان • ۱۸:۳۵"}, {"source": "Billboard", "title": "Ella Langley Is Already a Winner at 2026 CMA Awards; Tim McGraw Sets a Record in Musical Event Category", "link": "https://www.billboard.com/music/awards/cma-awards-2026-ella-langley-tim-mcgraw-win-early-awards-1236384751/", "summary": "Ella Langley ’s expected sweep of the 2026 CMA Awards began early, with the announcement of her win for music video of the year for her megahit “Choosin’ Texas.” And Tim McGraw made CMA history, becoming the first five-time winner of musical event of the year for “McArthur,” a collab with HARDY , Eric Church and Morgan Wallen . Related Here Are the Performers Presenters for the 2026 CMA Awards 2026 CMA Awards Predictions: Who Will Win? How to Watch Billboard s 2026 CMA Awards Red Carpet Livestream The awards were announced live on ABC’s Good Morning America on Wednesday (Nov. 18), with Lara Spencer sharing the news from Honky Tonk Central in downtown Nashville. GMA also took a look inside Bridgestone Arena with Lainey Wilson, who is hosting the show for the third year in a row. Langley won music video of the year as both artist and director. She shares the award with co-directors Caylee Robillard and Wales Toney. Langley also won in this category last year (again as both artist and co-director) for “You Look Like You Love Me,” her sexy duet with Riley Green. HARDY, Church, Wallen and McGraw share the award for musical event of the year with producer Jay Joyce. McGraw’s previous wins in the category are for “It’s Your Love” (with Faith Hill); “Find Out Who Your Friends Are (with Tracy Lawrence and Kenny Chesney); “Feel Like a Rock Star” (with Chesney); and “Highway Don’t Care” (with Taylor Swift and Keith Urban). McGraw’s fifth win in the category allows him to break out of a tie with Brad Paisley, Urban, Chesney and Vince Gill, who have won four times each. The 60th Annual CMA Awards is a production of the Country Music Association. Robert Deaton serves as executive producer, Alan Carter is director, and Jon Macks is head writer. The awards show will take place in Bridgestone Arena in Nashville on Wednesday night.", "date_str": "2026-11-18T14:36:22+00:00", "hash": "e8d6f94e30d7554a", "title_fa": "الا لنگلی در حال حاضر برنده جوایز CMA 2026 است. تیم مک‌گرو رکوردی را در رده رویدادهای موسیقی ثبت کرد", "summary_fa": "حرکت مورد انتظار الا لنگلی در جوایز CMA 2026 با اعلام برنده شدن وی برای موزیک ویدیوی سال برای مگاهیتش \"Choosin' Texas\" زود آغاز شد. و تیم مک‌گرا تاریخ CMA را ثبت کرد و اولین برنده پنج رویداد موسیقی سال برای «مک آرتور» شد، همکاری با هاردی، اریک چرچ و مورگان والن. موارد مرتبط در اینجا مجریان ارائه کننده جوایز 2026 جوایز CMA 2026 پیش بینی جوایز CMA هستند: چه کسی برنده خواهد شد؟ نحوه تماشای بیلبورد 2026 CMA Awards Red Carpet Livestream جوایز به صورت زنده در صبح بخیر آمریکا در شبکه ABC در روز چهارشنبه (18 نوامبر) اعلام شد و لارا اسپنسر اخبار را از Honky Tonk Central در مرکز شهر نشویل به اشتراک گذاشت. GMA همچنین با Lainey Wilson که برای سومین سال متوالی میزبان این برنامه است، به داخل بریجستون آرنا نگاهی انداخت. لنگلی هم به عنوان هنرمند و هم کارگردان برنده موزیک ویدیوی سال شد. او این جایزه را با کارگردانان دیگر کیلی روبیلارد و ولز تونی به اشتراک می گذارد. لنگلی همچنین سال گذشته در این بخش (دوباره به عنوان هنرمند و کارگردان) برای «تو به نظر می‌رسی که عاشق من هستی»، دوئت سکسی او با رایلی گرین، برنده شد. هاردی، چرچ، والن و مک گراو جایزه رویداد موسیقی سال را با تهیه کننده جی جویس به اشتراک می گذارند. برنده های قبلی مک گرو در این رده برای «این عشق توست» (با Faith Hill) است. «پیدا کن که دوستانت چه کسانی هستند (با تریسی لارنس و کنی چسنی)؛ «احساس مثل س ortnight video set from The Tortured Poets Department era featuring Swift s Victorian-inspired dress and typewriter. The Boston museum will be the only venue for the exhibit, which will also include a number of Swift s signature instruments, including a Deering banjo from the Speak Now tour, a mandolin from the Willow video and the shell of a pink-and-gold piano from Swift s Lover performance at the 2019 American Music Awards. “This is the first exhibition in the MFA’s history devoted to a musician, and we’re thrilled to invite visitors for an up-close look at the fashion and instruments of one of the most influential cultural figures of our time,” MFA director of public programs Kristen Hoskins said in a statement about the show that opens on April 10 and is slated to run through Aug. 15. “I’m excited to welcome audiences across generations to this unique experience at the Museum.” Tickets for the exhibition ($40) will go on sale to the general public on Swift s birthday, Dec. 13, at 6 p.m. ET; click here for ticketing details. On Monday, Swift made Grammy history when the nominations for next year s ceremony were announced and she once again got nods for album, record and song of the year , marking the fifth tim", "date_str": "2026-11-18T14:20:03+00:00", "hash": "9bef524b1532ed86", "title_fa": "موزه هنرهای زیبای بوستون نمایشگاه گسترده «تیلور سویفت: مجموعه دوره‌ها» را اعلام کرد.", "summary_fa": "برای گذراندن یک شب در موزه با تیلور سویفت آماده شوید. موزه هنرهای زیبای بوستون روز سه شنبه (17 نوامبر) اعلام کرد که نمایشگاه تیلور سویفت: مجموعه ایراس را در بهار برگزار خواهد کرد. این نمایش حرفه ای وعده می دهد که بیش از 50 لباس، ابزار و اشیاء نمادین را از آرشیو سوئیفت به نمایش بگذارد و دو دهه هنر او را جشن بگیرد. واکنش‌های مرتبط نوح کاهان به نامزدهای گرمی 2027 اسنوب: من در احساساتم برای یک ثانیه بودم آهنگ سال تیلور سویفت احتمالاً بدون تصادف بود 12 دوره تا به امروز، توسط ویدئوهای تک آهنگ تیم مک گرو از اولین آلبوم او در سال 2006 از طریق The Fate of Ophelia از سال گذشته The Life of a Showgirl رزرو شده است. همچنین شامل اشیایی از تور Eras Swift (2023-2024) خواهد بود که رکورد ثبت کرده است، از جمله لباس قرمز سفارشی آلبرتا فرتی که در طول مراسم فولکلور پوشیده شده است و ست های همیشه در ورزشگاه جهانی. در میان دیگر اشیاء به نمایش گذاشته شده، لباس بدن نیم‌نیت‌های نگین‌دار طراحی شده توسط زهیر مراد، و همچنین ژاکت لبه‌دار از فینال نمایش کارما و بازسازی مجموعه ویدئویی فورتنایت از دوره انجمن شاعران شکنجه‌شده با لباس و ماشین تحریر ویکتوریایی سوئیفت است. موزه بوستون تنها محل برگزاری این نمایشگاه خواهد بود که شامل تعدادی از سازهای سوئیفت از جمله بانجو Deering از تور Speak Now، ماندولین از ویدیوی Willow و پوسته پیانوی صورتی و طلایی از اجرای Swifts Lover در جوایز موسیقی آمریکا 2019 خواهد بود.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2297459109-e1795009744688.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۷:۵۰"}, {"source": "Deadline", "title": "Ella Langley, Morgan Wallen & Tim McGraw Among Early CMA Award Winners", "link": "https://deadline.com/2026/11/cma-awards-winners-ella-langley-1237227915/", "summary": "Ella Langley and her “Choosin Texas took the CMA Music Video of the Year honor this morning as the Country Music Association revealed early winners in two categories ahead of the full ceremony tonight. The other winner for CMA Musical Event of the Year went to McArthur, the song by Hardy, Eric Church, [ ]", "date_str": "2026-11-18T14:32:24+00:00", "hash": "017022342af01a0b", "title_fa": "الا لنگلی، مورگان والن و تیم مک گراو در میان برندگان اولیه جایزه CMA", "summary_fa": "الا لنگلی و او «چوسین تگزاس» صبح امروز جایزه بهترین موزیک ویدیوی سال CMA را از آن خود کردند، زیرا انجمن موسیقی کانتری برندگان اولیه را در دو دسته قبل از مراسم کامل امشب معرفی کرد. برنده دیگر رویداد موزیکال سال CMA به مک آرتور، ترانه ای از هاردی، اریک چرچ، [] الا لنگلی و او تعلق گرفت: «چوسین تگزاس جایزه بهترین موزیک ویدیوی سال CMA را امروز صبح گرفت، زیرا انجمن موسیقی کانتری برندگان اولیه را در دو دسته قبل از مراسم     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
