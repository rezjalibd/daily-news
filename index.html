فون و بلندگوهای تعبیه شده در پایه خود است. اپل این دستگاه را با چندین برنامه از جمله تقویم، پیام‌ها، عکس‌ها، فیس‌تایم، یادداشت‌ها، یادآوری‌ها، موسیقی و پادکست از قبل بارگذاری کرده است. این بدان معناست که اگر کاربران می خواهند یک قرار ملاقات در تقویم را بررسی کنند، پیامی ارسال کنند، موسیقی پخش کنند یا به عکس ها نگاه کنند، نیازی به دست زدن به آیفون خود نخواهند داشت. اپل این دستگاه را به ویژه در مکان هایی مانند آشپزخانه مفید می داند. برای مثال، شخصی که در حال پختن شام است، می‌تواند یک دستور غذا تهیه کند، یک ویدیو تماشا کند، یک تقویم را بررسی کند، یا یک تماس FaceTime بدون استفاده از تلفن خود شروع کند. همچنین به عنوان داشبورد خانه هوشمند عمل می‌کند و به کاربران اجازه می‌دهد از سیری بخواهند فیدهای دوربین را مشاهده کند، ترموستات را تنظیم کند، چراغ‌ها را روشن کند و درها را قفل کند. این در حالی است که اپل امروز مجموعه لوازم جانبی خانه هوشمند خود از جمله قفل هوشمند، دوربین های امنیتی و زنگ در را اعلام کرد. به عنوان مثال، هنگامی که شخصی در درب خانه باشد، کاربران صدای زنگ را از HomeView خود می شنوند. یکی از جالب‌ترین جنبه‌های دستگاه نحوه کارکرد آن با اعضای مختلف یک خانواده است. این هاب دستیار هوش مصنوعی سیری"}, {"source": "TechCrunch Main", "title": "Giraffe Bio aims its bespoke biomolecules at the looming copper shortage", "link": "https://techcrunch.com/2026/10/13/giraffe-bio-aims-its-bespoke-biomolecules-at-the-looming-copper-shortage/", "summary": "As AI data centers and EVs drive up demand for copper, Giraffe Bio has unearthed a $6.4 million seed round to help miners extract more of the mineral.", "date_str": "2026-10-13T12:40:00+00:00", "hash": "42e25db86ae76922", "title_fa": "Giraffe Bio مولکول های زیستی سفارشی خود را در جهت کمبود مس در نظر گرفته است", "summary_fa": "از آنجایی که مراکز داده هوش مصنوعی و خودروهای برقی تقاضا برای مس را افزایش می‌دهند، زرافه بیو یک دانه 6.4 میلیون دلاری برای کمک به استخراج‌کنندگان بیشتر از این ماده معدنی کشف کرده است. بین رونق مرکز داده هوش مصنوعی و برق رسانی در سطح اقتصاد، جهان به مس بسیار بیشتری نیاز خواهد داشت. تا سال 2040، عرضه مس ممکن است 25 درصد کمتر از تقاضا باشد. این امری بزرگ برای صنعت معدن خواهد بود، که تولید را بیشتر با افتتاح معادن جدید افزایش می‌دهد، که تلاشی پرهزینه و خوش شانس است. به طور معمول، فقط 0.3٪ از معادن احتمالی خارج می شوند. موج جدیدی از استارت‌آپ‌های مواد معدنی حیاتی روی روش‌های جدیدی کار می‌کنند تا با استفاده از بیوتکنولوژی، مس بیشتری را از معادن موجود استخراج کنند، که عمدتاً با تمرکز بر شسته‌شوی پشته‌ای، جایی که میکروب‌ها به جداسازی مواد معدنی از زباله‌ها کمک می‌کنند. Endolith میکروب‌های «کالیبر المپیک» را ایجاد کرده است، Ceibo روی گونه‌های خودش کار می‌کند، و Transition Metal Solutions پری‌بیوتیک‌هایی را برای تقویت فعالیت میکروبی ایجاد کرده است. زرافه بیو در حال اتخاذ یک رویکرد جایگزین است. این استارت آپ مواد شیمیایی مخصوص مواد معدنی را توسعه می دهد تا به معادن کمک کند تا 5 درصد مس بیشتر را بازیابی کنند. الخاندرو بوفو سمپه، یکی از بنیانگذاران و مدیرعامل زرافه بیو، به TechCrunch گفت: در استخراج، این مقدار واقعاً بسیار مهم است. اکثر آنها با 1 تا 2 درصد اضافی راضی خواهند بود. این استارت‌آپ می‌گوید که می‌تواند مس بیشتری استخراج کند، زیرا می‌تواند ترکیبات خاص برای محتوای معدنی هر معدن را مهندسی کند. TechCrunch به طور انحصاری آموخته است که برای بیرون آوردن این فناوری از آزمایشگاه، Giraffe Bio اخیراً یک دور بذر 6.4 میلیون دلاری به رهبری Orion Industrial Ventures با مشارکت BHP Ventures، Twynam، Air Capital و Baruch Future Ventures"}, {"source": "TechCrunch Main", "title": "Fitbit Edge is Google’s middle ground between Fitbit Air and Pixel Watch", "link": "https://techcrunch.com/2026/10/12/fitbit-edge-is-googles-middle-ground-between-fitbit-air-and-pixel-watch/", "summary": "Google’s newest wearable costs $179.99 and has a sleek feel like the Fitbit Air but with an OLED display.", "date_str": "2026-10-12T15:11:19+00:00", "hash": "19ab28ab7f7d3883", "title_fa": "Fitbit Edge حد وسط گوگل بین Fitbit Air و Pixel Watch است", "summary_fa": "جدیدترین پوشیدنی گوگل 179.99 دلار قیمت دارد و ظاهری براق مانند Fitbit Air دارد اما با نمایشگر OLED. مجموعه فیت بیت گوگل روز دوشنبه با معرفی Fitbit Edge، یک پوشیدنی جدید که بین Fitbit Air و Pixel Watch قرار گرفته است، گسترش یافت. با قیمت 179.99 دلار، نوار باریک Fitbit Air را با صفحه نمایش OLED برای بررسی مسیرهای نقشه، اعلان ها، آب و هوا و کنترل های موسیقی ترکیب می کند. مانند Pixel Watch و Fitbit Air، Edge با Google Health Coach که توسط Gemini پشتیبانی می‌شود، کار می‌کند. (برای استفاده از آن به اشتراک Google Health Premium نیاز دارید.) مربی می‌تواند از اطلاعات تناسب اندام، سلامتی و پزشکی شما برای جمع‌آوری روال‌های هفتگی و برنامه‌های تمرینی استفاده کند، سپس آن‌ها را بر اساس برنامه شما تنظیم کند. همچنین دارای ویژگی نگهبان سلامت گوگل است که برای شناسایی تغییرات قابل توجه در اندازه گیری های سلامت در طول زمان، از جمله شاخص های مربوط به فشار خون و مقاومت به انسولین طراحی شده است. (این شرکت این ویژگی‌ها را در مراسم معرفی Pixel Watch 5 در ماه آگوست اعلام کرد.) گوگل می‌گوید Fitbit Edge می‌تواند به طور خودکار 100 فعالیت از جمله دویدن، دوچرخه‌سواری و پیاده‌روی را شناسایی و ثبت کند. این شرکت توضیح می دهد که از زمینه حرکت شما استفاده می کند تا کاری که انجام می دهید و آن را به اهداف هفتگی شما اضافه می کند. به علاوه، این دستگاه از بیش از 50 حالت ورزشی پشتیبانی می‌کند و می‌تواند در حین تمرین، اعلان‌هایی را روی صفحه نمایش دهد، مانند ضربه زدن برای فشار بیشتر یا نفس کشیدن. این شرکت ادعا می‌کند که GPS داخلی Fitbit Edge 40 درصد دقیق‌تر از نسل قبلی است که ردیابی دویدن در فضای باز را آسان‌تر می‌کند. گوگل می گوید تشخیص مرحله خواب نیز 15 درصد دقیق تر از"}, {"source": "VentureBeat Tech", "title": "Meta's new Muse Wonder and Muse Wonder Full models achieve frontier performance, but only the weaker one is available via API", "link": "https://venturebeat.com/technology/metas-new-muse-wonder-and-muse-wonder-full-models-achieve-frontier-performance-but-only-the-weaker-one-is-available-via-api", "summary": "Meta is back in the race for the most powerful AI models, introducing two new proprietary models that the company says can outperform leading offerings from OpenAI and Anthropic on complex software engineering, legal work, business automation and long-running AI agent tasks. Read more", "date_str": "2026-10-12T20:04:04+00:00", "hash": "783895702ac68704", "title_fa": "مدل‌های جدید Muse Wonder و Muse Wonder Full متا عملکرد مرزی دارند، اما فقط مدل ضعیف‌تر از طریق API در دسترس است.", "summary_fa": "متا به رقابت برای قدرتمندترین مدل‌های هوش مصنوعی بازگشته است و دو مدل اختصاصی جدید را معرفی می‌کند که به گفته این شرکت می‌توانند در زمینه مهندسی نرم‌افزار پیچیده، کارهای حقوقی، اتوماسیون تجاری و وظایف طولانی‌مدت عامل هوش مصنوعی از پیشنهادات پیشرو OpenAI و Anthropic بهتر عمل کنند. ادامه مطلب"}, {"source": "Ars Technica", "title": "39-year-old unvaccinated woman becomes 6th measles death in Pennsylvania", "link": "https://arstechnica.com/health/2026/10/39-year-old-unvaccinated-woman-becomes-6th-measles-death-in-pennsylvania/", "summary": "A 39-year-old unvaccinated woman in Franklin County, Pennsylvania, has become the sixth person to die of the highly infectious virus amid a state outbreak that has stricken over a thousand people since it began in April. The woman died on Saturday, October 10. She had several underlying health conditions and had recently tested positive for measles, according to an advisory posted on social media by Franklin County Coroner Jordan Conner. The advisory noted that the woman's death meets the definition of a measles death set by the state's health department. In an emailed statement to The Washington Post , the coroner's office said the primary cause of death was listed as \"probable acute cardiac event due to possible complications of the measles.\" Read full article Comments", "date_str": "2026-10-12T21:54:35+00:00", "hash": "d8691d7d1012fa6a", "title_fa": "زن 39 ساله واکسینه نشده ششمین مرگ ناشی از سرخک در پنسیلوانیا شد.", "summary_fa": "یک زن 39 ساله واکسینه نشده در شهرستان فرانکلین، پنسیلوانیا، ششمین فردی است که بر اثر این ویروس بسیار عفونی جان خود را از دست می دهد در میان شیوع ایالتی که از آغاز ماه آوریل تاکنون بیش از هزار نفر را مبتلا کرده است. بر اساس توصیه ای که جردن کانر در رسانه های اجتماعی منتشر کرد، این زن در روز شنبه، 10 اکتبر درگذشت. این مشاوره خاطرنشان کرد که مرگ این زن مطابق با تعریف مرگ ناشی از سرخک است که توسط اداره بهداشت ایالتی تعیین شده است. در بیانیه ای ایمیلی به واشنگتن پست، دفتر پزشکی قانونی اعلام کرد که علت اصلی مرگ به عنوان \"عوارض قلبی حاد احتمالی به دلیل عوارض احتمالی سرخک\" ذکر شده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید یک زن 39 ساله واکسینه نشده در شهرستان فرانکلین، پنسیلوانیا، ششمین فردی است که از زمان شیوع ویروس بسیار عفونی آن در ماه آوریل که بیش از هزار نفر در آن شیوع یافته است، جان خود را از دست داده است. پنج مورد مرگ قبلی در بحبوحه شیوع سرخک در ایالت شامل یک نوزاد تازه متولد شده، یک نوزاد 6 هفته، یک 18 ساله، یک 20 ساله و یک فرد 40 ساله بود. همه متوفیان واکسینه نشده بودند. دو نوزاد برای واکسینه شدن خیلی کوچک بودند. بر اساس آخرین به روز رسانی سرخک از سوی اداره بهداشت پنسیلوانیا در روز جمعه، 9 اکتبر، 1136 مورد ابتلا در این ایالت از ابتدای سال وجود داشته است که 1124 مورد آن مربوط به شیوع فعلی است. در مجموع 218 نفر در بیمارستان بستری شده اند. شیوع این بیماری که اکنون 41 شهرستان از 67 شهرستان این ایالت را در بر می گیرد،"}, {"source": "Ars Technica", "title": "Epic Games reportedly pivoting to \"AI first\" game development model", "link": "https://arstechnica.com/gaming/2026/10/report-epic-games-goes-all-in-on-ai-for-disney-collaboration/", "summary": "Epic Games is shifting to an \"AI first\" development strategy for its collaboration with the Walt Disney Company, letting AI models write all the code and guide all the artwork for an upcoming shooter. That's according to a Bloomberg report , which cites unnamed people familiar with the project who commented on the significant pivot in internal development at the Unreal Engine maker. Human developers will be tasked with managing and guiding code and art assets generated by models such as Anthropic's Claude, according to internal Epic employee messages viewed by Bloomberg. That means \"no more hand-written code\" and art assets \"generated with full AI workflows,\" according to the report. The $1.5 billion collaboration between Epic and Disney, announced in early 2024 , was slated to release a Marvel- and Star Wars-themed shooter in March 2027. That project has now been delayed indefinitely amid the AI-related shakeup and understaffed, slower-than-expected development thus far, according to the report. Read full article Comments", "date_str": "2026-10-12T20:59:50+00:00", "hash": "8ba12d9699bdda97", "title_fa": "طبق گزارش‌ها، اپیک گیمز به مدل توسعه بازی «اول AI» می‌چرخد", "summary_fa": "اپیک گیمز برای همکاری با شرکت والت دیزنی به استراتژی توسعه «اول AI» تغییر می‌کند و به مدل‌های هوش مصنوعی اجازه می‌دهد همه کدها را بنویسند و تمام آثار هنری تیراندازی آینده را هدایت کنند. این بر اساس گزارش بلومبرگ است که به نقل از افراد ناشناس آشنا با این پروژه که در مورد محور مهم توسعه داخلی در سازنده Unreal Engine اظهار نظر کرده اند، آمده است. بر اساس پیام‌های کارکنان Epic داخلی که بلومبرگ مشاهده کرده است، توسعه‌دهندگان انسانی وظیفه مدیریت و هدایت کد و دارایی‌های هنری تولید شده توسط مدل‌هایی مانند Anthropic's Claude را بر عهده خواهند داشت. بر اساس این گزارش، این بدان معناست که «دیگر کد دست‌نویس وجود ندارد» و دارایی‌های هنری «با گردش‌های کاری کامل هوش مصنوعی ایجاد می‌شوند». همکاری 1.5 میلیارد دلاری بین اپیک و دیزنی که در اوایل سال 2024 اعلام شد، قرار بود در مارس 2027 یک فیلم تیراندازی با تم مارول و جنگ ستارگان منتشر کند. بر اساس این گزارش، این پروژه اکنون در میان تغییرات مرتبط با هوش مصنوعی و توسعه کم کارکنان، کندتر از حد انتظار تا کنون، برای مدت نامعلومی به تعویق افتاده است. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید Epic Games برای همکاری خود با شرکت والت دیزنی به استراتژی توسعه «اول هوش مصنوعی» تغییر می‌کند و به مدل‌های هوش مصنوعی اجازه می‌دهد همه کدها را بنویسند و همه آثار هنری را برای برنامه‌های آینده راهنمایی کنند. این بر اساس گزارش بلومبرگ است که به نقل از افراد ناشناس آشنا با این پروژه که در مورد محور مهم توسعه داخلی در سازنده Unreal Engine اظهار نظر کرده اند، آمده است. سخنگوی Epic در بیانیه‌ای گفت: «ما از توسعه شتاب‌دهی هوش مصنوعی به رهبری توسعه‌دهندگان Epic که رویاپردازان و"}, {"source": "Ars Technica", "title": "After a 10-year redemption arc, No Man's Sky is coming to the iPhone and iPad", "link": "https://arstechnica.com/gaming/2026/10/after-a-10-year-redemption-arc-no-mans-sky-is-coming-to-the-iphone-and-ipad/", "summary": "Just over 10 years after its initial release, space exploration and survival crafting game No Man's Sky is making its way to the iPhone and iPad, Apple and developer Hello Games announced today. It will run on devices as far back as the iPhone 11 and the third-generation iPad Air. No Man's Sky might not have the most cutting-edge AAA graphics (though they're still strong, and they've come a long way since launch via updates), but the game's uncommon method of generating galaxies of incomprehensible scale on device consistently for all players from a single-seed happening on a phone is remarkable for those of us who remember phones performing far behind consoles or desktop PCs. Read full article Comments", "date_str": "2026-10-12T20:26:14+00:00", "hash": "4061b273fde1def8", "title_fa": "پس از 10 سال رستگاری، No Man's Sky به آیفون و آیپد می آید", "summary_fa": "اپل و توسعه دهنده Hello Games امروز اعلام کردند که تنها بیش از 10 سال پس از انتشار اولیه، بازی اکتشاف فضایی و هنر بقا No Man's Sky راه خود را به iPhone و iPad باز می کند. این دستگاه روی دستگاه‌هایی مانند آیفون ۱۱ و نسل سوم آی‌پد ایر اجرا می‌شود. No Man's Sky ممکن است پیشرفته‌ترین گرافیک AAA را نداشته باشد (اگرچه هنوز قوی هستند و از زمان عرضه از طریق به‌روزرسانی‌ها راه زیادی را پیموده‌اند)، اما روش غیرمعمول بازی برای تولید کهکشان‌هایی در مقیاس نامفهوم روی دستگاه به‌طور مداوم برای همه بازیکنانی که از یک دستگاه تک‌دانه روی یک تلفن اتفاق می‌افتند، برای کسانی که پشت تلفن‌های رومیزی یا رایانه‌های شخصی ما را به یاد می‌آورند، قابل توجه است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید این نسخه از بازی شامل تمام محتواها و به روز رسانی های سیستمی به بازی است که در طول سال ها اضافه شده است - توسعه هایی که معروف است که بازی را از یک پذیرش داستانی سنگی به یک بازی محبوب تبدیل کرده است. با این حال، چند سازش وجود دارد، و شبیه چیزی است که در No Man’s Sky در نینتندو سوییچ دیدیم. Hello Games می‌گوید که توانایی ساخت و کاوش مکان‌های سیاره‌ای ساخته‌شده توسط بازیکن به آیفون 15 پرو و ​​نسخه‌های جدیدتر محدود می‌شود و بازی چند نفره در هیچ دستگاه iOS پشتیبانی نمی‌شود. این شرکت می‌گوید: «ما از دیدن بازخورد بازیکنان در iOS هیجان‌زده هستیم و بر اساس تعداد افرادی که در حال بازی هستند، از آن به‌طور مناسب پشتیبانی می‌کنیم.» و در صورتی که پایگاه پخش‌کننده برای توجیه آن وجود نداشته باشد، ممکن است در را برای پشتیبانی نکردن از همه به‌روزرسانی‌های محتوای"}, {"source": "Ars Technica", "title": "WHO report on Russian lab worker death highlights \"key uncertainty\"", "link": "https://arstechnica.com/health/2026/10/who-report-on-russian-lab-worker-death-highlights-key-uncertainty/", "summary": "Over the weekend, the World Health Organization released a disease outbreak report on the events surrounding the death of a Russian infectious disease researcher earlier this month, highlighting that Russia has yet to report a confirmed cause of death. With that \"key uncertainty,\" the United Nations health agency said it remains impossible to assess the risk of the event or whether the public health measures Russia took were adequate to prevent spread of the unknown disease. The WHO reported that, so far, it has seen no evidence of ongoing transmission of the mystery disease. \"However, confidence in the assessment remains limited by the absence of a confirmed etiological diagnosis, and the remaining uncertainty regarding the source and mode of exposure,\" the agency wrote in its report. The agency laid out the order of events as information trickled out from Russian authorities, noting that it only became aware of the death via media reports on October 2. The WHO subsequently made contact with Russian authorities and requested information on October 3, 6, 7, and 8. Read full article Comments", "date_str": "2026-10-12T18:46:43+00:00", "hash": "599cffdecd765a79", "title_fa": "گزارش سازمان جهانی بهداشت در مورد مرگ کارگر آزمایشگاه روسی بر \"ابهامات کلیدی\" تاکید می کند.", "summary_fa": "در آخر هفته، سازمان بهداشت جهانی گزارشی از شیوع بیماری درباره وقایع مربوط به مرگ یک محقق روسی بیماری عفونی در اوایل ماه جاری منتشر کرد و تاکید کرد که روسیه هنوز دلیل تایید شده مرگ را گزارش نکرده است. با این \"ابهام کلیدی\"، آژانس بهداشت سازمان ملل متحد گفت که ارزیابی خطر این رویداد یا اینکه آیا اقدامات بهداشت عمومی روسیه برای جلوگیری از گسترش بیماری ناشناخته کافی بوده است، غیرممکن است. سازمان جهانی بهداشت گزارش داد که تاکنون هیچ مدرکی مبنی بر انتقال مداوم این بیماری مرموز مشاهده نکرده است. آژانس در گزارش خود نوشت: «با این حال، اعتماد به ارزیابی به دلیل عدم وجود یک تشخیص علت تایید شده، و عدم اطمینان باقی مانده در مورد منبع و نحوه قرار گرفتن در معرض محدود است.» این آژانس ترتیب وقایع را به عنوان اطلاعاتی که از مقامات روسی به دست آمده بود، اعلام کرد و خاطرنشان کرد که تنها از طریق گزارش های رسانه ای در 2 اکتبر از مرگ مطلع شد. سازمان جهانی بهداشت متعاقباً با مقامات روسی تماس گرفت و اطلاعاتی را در 3، 6، 7 و 8 اکتبر درخواست کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید در آخر هفته، سازمان جهانی بهداشت گزارش شیوع بیماری را در مورد رویدادهای مربوط به مرگ یک محقق روسی بیماری عفونی در اوایل این ماه منتشر کرد و تاکید کرد که روسیه هنوز دلیل تایید شده مرگ را گزارش نکرده است. با این \"ابهام کلیدی\"، آژانس بهداشت سازمان ملل گفت که ارزیابی خطر این رویداد یا اینکه آیا اقدامات بهداشت عمومی روسیه برای جلوگیری از گسترش بیماری ناشناخته کافی بوده است یا خیر، غیرممکن است."}, {"source": "Ars Technica", "title": "Anthropic's Claude AI submitted false murder tip to Philadelphia police", "link": "https://arstechnica.com/tech-policy/2026/10/anthropics-claude-ai-submitted-false-murder-tip-to-philadelphia-police/", "summary": "An Anthropic AI model submitted a false tip about an unsolved murder to Philadelphia police, the company and police department confirmed on Friday. A Claude model sent the false tip on July 18 to the Philadelphia Police Department's website for submitting information about unsolved murders, but it was flagged by a spam filter. Anthropic apparently discovered the incident on September 28 and informed the police department about it on October 8. During internal testing, Claude Haiku 4.5 was instructed to complete various forms up to the final submission stage and to stop before submitting those forms. \"Several times Claude mistakenly submitted the form instead, expecting there to be an additional confirmation page,\" Anthropic said in a report describing \"unintended model actions we’ve observed during evaluations and internal use of Claude.\" Read full article Comments", "date_str": "2026-10-12T18:21:36+00:00", "hash": "0385929593792121", "title_fa": "کلود هوش مصنوعی آنتروپیک اطلاعات نادرست قتل را به پلیس فیلادلفیا ارسال کرد", "summary_fa": "این شرکت و اداره پلیس روز جمعه تایید کردند که یک مدل هوش مصنوعی Anthropic اطلاعات نادرستی در مورد یک قتل حل نشده به پلیس فیلادلفیا ارسال کرده است. یک مدل کلود این نکته نادرست را در 18 ژوئیه به وب سایت اداره پلیس فیلادلفیا برای ارسال اطلاعات در مورد قتل های حل نشده ارسال کرد، اما توسط یک فیلتر هرزنامه پرچم گذاری شد. آنتروپیک ظاهراً در 28 سپتامبر این حادثه را کشف کرد و در 8 اکتبر به اداره پلیس اطلاع داد. در طول آزمایش داخلی، به کلود هایکو 4.5 دستور داده شد تا فرم های مختلف را تا مرحله ارسال نهایی تکمیل کند و قبل از ارسال آن فرم ها متوقف شود. آنتروپیک در گزارشی گفت: «چندبار کلود به اشتباه فرم را به جای آن ارسال کرد و انتظار داشت که یک صفحه تأیید اضافی وجود داشته باشد.» مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید، شرکت و اداره پلیس روز جمعه تایید کردند که یک مدل هوش مصنوعی Anthropic یک نکته نادرست درباره یک قتل حل نشده به پلیس فیلادلفیا ارسال کرده است. نکته نادرست قتل زمانی رخ داد که به کلود هایکو 4.5 دستور داده شد وظایف را در صفحات وب به طور تصادفی انتخاب کند، آنتروپیک گفت: در یک اجرا، مدل در صفحه ای قرار گرفت که به یک قتل حل نشده اشاره می کند. آن صفحه حاوی یک فرم راهنمایی بود که توسط یک اداره پلیس اداره می شد. به کلود دستور داده شد که هرگز وارد سیستم نشود، حساب ایجاد نکند، اطلاعات شخصی را وارد کند، خرید کند، یا هر چیز مخربی را ارسال کند، اما دستورالعمل ها ارسال فرم ها را رد نکرد. کلود فرم را با این موارد پر"}, {"source": "Ars Technica", "title": "Russia was not ready for the data center war it started with Ukraine", "link": "https://arstechnica.com/gadgets/2026/10/russia-was-not-ready-for-the-data-center-war-it-started-with-ukraine/", "summary": "When Russia began attacking Ukrainian data centers and telecommunication infrastructure, it apparently failed to prepare for possible retaliation. Now Russia’s digital services are facing widespread outages after Ukrainian drone strikes knocked out three of the largest data centers owned by Russian tech giant Yandex within several days. Pro-Kremlin bloggers are warning that Russia’s centralized digital economy could collapse because the country is not prepared for the “data center war” it started, according to posts translated by the pseudonymous independent researcher ChrisO_wiki . The Russian commentators also suggested that Ukraine’s decentralized digital services could prove more resilient than Russia’s system if the countries continue trading such blows. Russia initially launched a drone strike campaign targeting Ukrainian data centers and mobile phone networks in late September. The attacks temporarily disrupted Internet and cell phone service for up to 100,000 households in the Ukrainian capital of Kyiv and came as part of a broader long-range strike campaign that has involved Russian missiles and jet-powered drones hitting Ukraine’s power grid infrastructure, transportation hubs, and even residential apartment building blocks. Read full article Comments", "date_str": "2026-10-12T17:52:36+00:00", "hash": "e41f2774213f720a", "title_fa": "روسیه برای جنگ مرکز داده ای که با اوکراین آغاز کرده بود آماده نبود", "summary_fa": "زمانی که روسیه حمله به مراکز داده و زیرساخت های مخابراتی اوکراین را آغاز کرد، ظاهراً نتوانست برای تلافی احتمالی آماده شود. اکنون خدمات دیجیتال روسیه پس از حملات پهپادهای اوکراینی که سه مرکز داده متعلق به غول فناوری روسی یاندکس را در عرض چند روز از کار انداخت، با قطعی گسترده مواجه شده است. بر اساس پست های ترجمه شده توسط محقق مستقل مستعار ChrisO_wiki، وبلاگ نویسان طرفدار کرملین هشدار می دهند که اقتصاد دیجیتال متمرکز روسیه ممکن است سقوط کند زیرا این کشور برای \"جنگ مرکز داده\" که آغاز شده است آماده نیست. مفسران روسی همچنین پیشنهاد کردند که اگر این کشورها به تجارت چنین ضرباتی ادامه دهند، خدمات دیجیتال غیرمتمرکز اوکراین می تواند نسبت به سیستم روسیه انعطاف پذیرتر باشد. روسیه در ابتدا کمپین حمله پهپادی را با هدف قرار دادن مراکز داده و شبکه های تلفن همراه اوکراین در اواخر سپتامبر آغاز کرد. این حملات به طور موقت خدمات اینترنت و تلفن همراه را برای بیش از 100000 خانوار در کیف پایتخت اوکراین مختل کرد و به عنوان بخشی از یک کمپین حملات دوربرد گسترده‌تر بود که موشک‌های روسی و پهپادهای جت را به زیرساخت‌های شبکه برق اوکراین، هاب‌های حمل و نقل و حتی بلوک‌های آپارتمانی مسکونی اصابت کردند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش هنگامی که روسیه شروع به حمله به مراکز داده و زیرساخت های مخابراتی اوکراین کرد، ظاهراً نتوانست برای تلافی احتمالی آماده شود. اکنون خدمات دیجیتال روسیه پس از حملات پهپادهای اوکراینی که سه مرکز داده متعلق به غول فناوری روسی یاندکس را در عرض چند روز از کار انداخت، با قطعی گسترده مواجه شده است."}, {"source": "Ars Technica", "title": "Long-lost horror gaming cult classic P.T. gets a much-needed PC port", "link": "https://arstechnica.com/gaming/2026/10/long-lost-horror-gaming-cult-classic-p-t-gets-a-much-needed-pc-port/", "summary": "For over a decade now, the only \"official\" way to play Hideo Kojima's cult classic, P.T. —the long-discontinued \"playable trailer\" for Kojima's canceled \"Silent Hills\" project —has been via one of the increasingly rare PlayStation 4s that previously downloaded a copy during its monthslong availability window. Now, though, one coder is helping to preserve the game with a porting tool that builds a playable x86 PC executable from the original PS4 files. Coder Lorean Xavier said he was inspired to work on the \"P.T. for PC\" project \"because P.T. deserved to keep existing somewhere other than on consoles that still have it installed.\" The open source porting effort rebuilds the P.T. engine in C++ and Vulkan, using the original files from the PS4 game to re-create \"every level, model, texture, sound, script and cutscene,\" according to its GitHub listing. That means players without their own legitimate decrypted copy of the original P.T. will have to track one down in order to generate a playable PC version. The reliance on real P.T. files makes this port more authentic than previous hobbyist efforts to re-create the look and feel of P.T. for a PC audience. And while PS4 emulators recently reached a point where they could run P.T. completely , this native port also sports extra features, like upscaling and frame-generation, a camera mode, experimental third-person and VR support, and a \"museum\" section where you can look at and listen to in-game assets (including \"unused content\"). Read full article Comments", "date_str": "2026-10-12T16:01:08+00:00", "hash": "04746fbbe4da5738", "title_fa": "بازی‌های ترسناک قدیمی و کلاسیک P.T. یک پورت کامپیوتر بسیار مورد نیاز را دریافت می کند", "summary_fa": "اکنون بیش از یک دهه است که تنها راه \"رسمی\" برای بازی کلاسیک کالت هیدئو کوجیما، P.T. —تریلری قابل پخش که مدت ها متوقف شده بود برای پروژه لغو شده «Silent Hills» کوجیما — از طریق یکی از پلی استیشن 4 که به طور فزاینده ای کمیاب بود، قبلاً نسخه ای از آن را در طول پنجره ماه ها در دسترس بودن دانلود کرده بود. با این حال، اکنون یک کد نویس به حفظ بازی با یک ابزار پورتینگ کمک می کند که یک رایانه شخصی x86 قابل پخش را از فایل های اصلی PS4 می سازد. کدگذار Lorean Xavier گفت که از او الهام گرفته شده است تا روی پروژه \"P.T. for PC\" کار کند، \"زیرا P.T شایسته آن بود که در جایی به غیر از کنسول هایی که هنوز آن را نصب کرده اند، وجود داشته باشد.\" تلاش انتقال منبع باز P.T را بازسازی می کند. موتور در C++ و Vulkan، با استفاده از فایل‌های اصلی بازی PS4، طبق فهرست GitHub، «هر سطح، مدل، بافت، صدا، اسکریپت و صحنه‌های کوتاه» را دوباره ایجاد می‌کند. این بدان معناست که بازیکنان بدون نسخه رمزگشایی شده قانونی خود از P.T اصلی. برای تولید نسخه رایانه شخصی قابل پخش، باید یکی را ردیابی کنید. تکیه بر P.T واقعی فایل‌ها این پورت را معتبرتر از تلاش‌های قبلی علاقه‌مندان برای ایجاد دوباره ظاهر و احساس P.T می‌سازد. برای مخاطبان رایانه شخصی و در حالی که شبیه سازهای PS4 اخیراً به نقطه ای رسیده اند که می توانند P.T را اجرا کنند. به طور کامل، این پورت بومی همچنین دارای ویژگی‌های اضافی است، مانند ارتقاء مقیاس و تولید فریم، حالت دوربین، پشتیبانی آزمایشی شخص سوم و VR، و بخش «موزه» که در آن می‌توانید به دارایی‌های درون بازی (از جمله «محتوای استفاده نشده») نگاه کنید و به آن گوش دهید. مقاله کامل را بخوانید نظرات"}, {"source": "Ars Technica", "title": "F1 in Singapore: There's a new fastest car now", "link": "https://arstechnica.com/cars/2026/10/f1-in-singapore-theres-a-new-fastest-car-now/", "summary": "Formula 1’s lengthy 2026 season is entering its final stretch. The sport took to the floodlit streets of Singapore on Sunday night, but Saturday saw action, too; this Grand Prix weekend was also the final of six sprints this year. The night race might be one of modern F1’s greatest spectacles. From overhead shots, the track becomes a bright, illuminated ribbon among the looming darkness of the city-state’s overpasses and skyscrapers. At ground level, the cars shower glittering sparks from their titanium skid blocks as the drivers flirt with how close they can get to the walls. As tracks go, the 90-degree turns and concrete barrier-lined streets were a world away from the abrasive tarmac and ample runoff of Malaysia last time out . But the tropical heat and humidity were a constant given both locations’ proximity to the equator. Showers for the sprint In Malaysia (which was still technically the Bahrain GP), a pre-race downpour disrupted things mightily. On Saturday morning in Singapore, shortly before the start of the sprint, it seemed history was about to rhyme when the skies opened. With standing water in places on the track, the sprint was delayed by 30 minutes. The sprint format, where a short extra race replaces a practice session a day before the main event, is unloved by the drivers and teams. For one thing, there’s little prestige in winning Saturday’s sprint. And with qualifying just a few hours later, risk-taking is discouraged lest one wreck the car and ruin Sunday’s race a day early. Oh no, not again! Credit: Mark Thompson/Getty Images And in Singapore, like most street circuits, the proximity of the unyielding barriers that line the track means there are real, punishing consequences for getting it even a little wrong. Read full article Comments", "date_str": "2026-10-12T14:43:14+00:00", "hash": "8269737cac663f5a", "title_fa": "F1 در سنگاپور: اکنون سریعترین خودروی جدید وجود دارد", "summary_fa": "فصل طولانی 2026 فرمول 1 در حال ورود به آخرین مرحله خود است. این ورزش یکشنبه شب به خیابان های سنگاپور نورافشانی شد، اما شنبه نیز شاهد اقداماتی بود. این آخر هفته گرندپری همچنین فینال شش مسابقه سرعت امسال بود. مسابقه شبانه ممکن است یکی از بهترین نمایش های F1 مدرن باشد. از نماهای بالای سر، مسیر به نواری روشن و نورانی در میان تاریکی رو به جلوی پل های هوایی و آسمان خراش های دولت-شهر تبدیل می شود. در سطح زمین، اتومبیل‌ها جرقه‌های درخشانی از بلوک‌های تیتانیومی خود می‌بارند، در حالی که رانندگان در مورد نزدیک شدن به دیوارها لاس می‌زنند. همانطور که مسیرها پیش می‌روند، پیچ‌های 90 درجه و خیابان‌های بتنی با دیوارهای بتنی آخرین بار دور از آسفالت ساینده و رواناب فراوان مالزی بود. اما گرما و رطوبت استوایی با توجه به نزدیکی هر دو مکان به استوا ثابت بود. بارش باران برای دوی سرعت در مالزی (که هنوز از نظر فنی GP بحرین بود)، بارش باران قبل از مسابقه اوضاع را به شدت مختل کرد. صبح روز شنبه در سنگاپور، اندکی قبل از شروع دوی سرعت، به نظر می‌رسید که با باز شدن آسمان، تاریخ در حال قافیه شدن است. با آب ایستاده در نقاطی در مسیر، سرعت دوی سرعت 30 دقیقه به تاخیر افتاد. فرمت اسپرینت، که در آن یک مسابقه اضافی کوتاه جایگزین یک جلسه تمرین یک روز قبل از رویداد اصلی می شود، مورد علاقه رانندگان و تیم ها نیست. برای یک چیز، برنده شدن در دوی سرعت شنبه اعتبار کمی دارد. و با چند ساعت بعد، از ریسک پذیری جلوگیری می شود تا مبادا کسی ماشین را خراب کند و مسابقه یکشنبه را یک روز زودتر خراب کند. اوه نه، دوباره نه! اعتبار: Mark Thompson/Getty Images و در سنگاپور، مانند بسیاری از مسیرهای خیابانی، نزدیکی موانع تسلیم ناپذیری که در مسیر قرار"}, {"source": "Wired", "title": "The ‘Godzilla Minus Zero’ Filmmakers Terrified Bystanders With Their Monster Sounds", "link": "https://www.wired.com/story/new-york-comic-con-panel/", "summary": "The team behind director Takashi Yamazaki’s new film created their kaiju roars by setting up speakers on top of an outdoor dam. The people walking by weren’t prepared for what they heard.", "date_str": "2026-10-13T13:30:00+00:00", "hash": "804a2d1da79d6baa", "title_fa": "فیلمسازان «گودزیلا منهای صفر» تماشاگران را با صداهای هیولایی خود به وحشت انداختند", "summary_fa": "تیم سازنده فیلم جدید کارگردان تاکاشی یامازاکی با نصب بلندگوها در بالای یک سد در فضای باز، غرش های کایجو خود را خلق کردند. مردمی که از کنار آن رد می‌شدند برای آنچه می‌شنیدند آماده نبودند. Loader Save Story ذخیره این داستان Comment Loader Save Story Save this r Save Story ذخیره این داستان خیلی قبل از اینکه طوفان هوش مصنوعی به ویکی پدیا بیاید، بنیاد ویکی مدیا در حال آماده سازی بود. ویکی‌پدیان‌ها دریچه‌ها را شکستند و پیش‌بینی‌های مطمئنی مبنی بر شکستن و شستشوی آن‌ها انجام دادند. گفته می‌شود که مدل‌های زبانی بزرگ حتی ممکن است ویکی‌پدیا را بهبود ببخشند و کارهای خانه‌داری را خودکار کنند - قالب‌بندی، منابع، نقل‌قول‌ها، پیوندهای گمشده - و بنابراین انسان‌ها را برای انجام کارهای خلاقانه آزاد می‌کند. به این سادگی نبود. در سال ۲۰۱۹، کاترین ماهر، رئیس وقت بنیاد ویکی‌مدیا، مقاله‌ای در نیویورک تایمز با عنوان «بدون انسان‌ها، هوش مصنوعی» نوشت. می تواند ویران کند.» او نوشت: «بسیار اوقات، هوش مصنوعی به عنوان یک راه حل قدرتمند برای مشکلات ما، جایگزینی مقیاس پذیر برای مردم ارائه می شود.» مسئله ای که ویکی پدیا با آن مواجه بود، حفظ کنترل انسان بر ماشین ها، همان چیزی بود که به زودی در همه جا با آن مواجه شد. قبلاً در سال 2018، گوگل هوش مصنوعی را برای نوشتن «مقالات مشابه ویکی‌پدیا» آموزش می‌داد و تا اکتبر 2024، یک مطالعه دانشگاه پرینستون نشان داد که حدود 5 درصد از تقریباً 3000 مقاله جدید ایجاد شده در ویکی‌پدیای انگلیسی در یک ماه (اوت 2024) حاوی مقدار قابل‌توجهی از تولیدکننده هوش مصنوعی است. نشانه هایی وجود داشت. ChatGPT به خط تیره‌های em - عبارات پرانتزی که شبیه این هستند - و علامت‌های نقل قول مجعد علاقه داشت. گاهی اوقات، بقایای اعلان‌های مورد استفاده برای نوشتن مقاله‌ها باقی می‌ماند (ممکن است بگویند: «این مقاله شما در ویکی‌پدیا است.»). کرک های عمومی مانند «تمجید از یک روستا برای زمین های کشاورزی حاصلخیز، دام ها، و حومه زیبای آن» و"}, {"source": "Wired", "title": "Alex Gibney’s ‘Musk’ Has a Unique Perspective on Daddy Issues", "link": "https://www.wired.com/story/the-big-interview-podcast-alex-gibney-musk-doc/", "summary": "Elon Musk’s father, Errol Musk, agreed to be interviewed immediately.", "date_str": "2026-10-13T10:30:00+00:00", "hash": "a292f6fb1e2d9853", "title_fa": "«ماسک» الکس گیبنی دیدگاهی منحصر به فرد به مسائل بابا دارد", "summary_fa": "پدر ایلان ماسک، ارول ماسک، موافقت کرد که بلافاصله با او مصاحبه شود. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان فقط یک نفر موافقت کرد که بلافاصله مستند جدید الکس گیبنی ایلان ماسک باشد: پدر ماسک. گیبنی می گوید: «ما ارول ماسک را در «سلام» داشتیم. در نهایت، کارگردان با تعداد زیادی از همکاران ماسک برای فیلمش صحبت کرد. همسر اول او، جاستین ماسک، و دوست دختر سابقش اشلی سنت کلر ظاهر می شود. کارا سویشر، روزنامه‌نگار، رید هافمن، یکی از بنیان‌گذاران لینکدین، من و کیتی دراموند، مدیر تحریریه جهانی WIRED نیز برای ماسک که از جمعه در سینماهای سراسر کشور اکران می‌شود، با گیبنی صحبت کردیم. اما فرود ارول ماسک، که مدیر عامل تسلا و اسپیس ایکس با او رابطه پیچیده ای دارد، نقطه عطفی بود. گیبنی می‌گوید: «بقیه افراد متقاعدکننده زیادی متقاعد شدند. ظاهر شدن افراد بسیار سخت بود زیرا ریسک صحبت در مورد ماسک به روشی صادقانه بالا بود. هنگامی که گیبنی با همه سوژه‌هایش مصاحبه کرد، مواد کافی برای ساخت یک فیلم مستند داشت که تقریباً چهار ساعت طول می‌کشد، از جمله یک وقفه 10 دقیقه‌ای. این یک پرتره نفرین‌آمیز از مدیر عامل تریلیونر است که نشان می‌دهد تا چه حد از نبوغ او بر اساس توانایی فوق‌العاده‌اش در ترویج اسطوره‌های خودش – و قیمت سهام شرکت‌های عمومی‌اش است. ماسک هرگز با گیبنی مصاحبه نکرد. در عوض، تیم کارگردان درباره هر نظر عمومی که ماسک تا به حال گفته بود تحقیق کردند و یک ایلان ماسک شبیه سازی شده را ساختند که در طول فیلم ظاهر می شود. اوایل این ماه با گیبنی در مورد تجربه‌اش از ساخت فیلم صحبت کردم، چرا تصمیم گرفت الون شبیه‌سازی شده‌اش را جذاب کند، و چه موادی را باید روی اتاق برش بگذارد."}, {"source": "Wired", "title": "The Biggest Pro-AI Super PAC Network Has Poured Millions Into Nevada Shell Companies", "link": "https://www.wired.com/story/the-biggest-pro-ai-super-pac-network-has-poured-millions-into-nevada-shell-companies/", "summary": "Backed by Silicon Valley titans, Leading the Future has raised huge sums to promote pro-AI candidates on both side of the aisle.", "date_str": "2026-10-13T10:00:00+00:00", "hash": "44d5192dc7ef108c", "title_fa": "بزرگترین شبکه Pro-AI Super PAC میلیون ها نفر را وارد شرکت های شل نوادا کرده است", "summary_fa": "Leading the Future با حمایت غول  نام نوع دوستی مؤثر روبرو می شود. او از محققی به نام Jacob Coxon استناد کرد که 10 درصد احتمال دارد که هوش مصنوعی به بشریت پایان دهد. سانکار آن را نقدی الهیاتی خواند تا علمی. سانکار گفت: «بسیاری از محققان هوش مصنوعی سیگار کشیدن را شروع کرده‌اند تا به سایر محققان نشان دهند که چقدر به هوش مصنوعی اعتقاد دارند. او از هیچ محققی نام نبرد و مدرکی برای این ادعا ارائه نکرد. سانکار هدف گیری نظامی را به عنوان یک فرآیند به جای انتخابی که توسط هوش مصنوعی انجام می شود، توصیف کرد. او گفت که اجرای 1000 اعتصاب در یک روز یک بار دو هفته برنامه ریزی توسط 50 نفر طول کشید. با هوش مصنوعی، یک نفر می تواند این کار را در چهار ساعت انجام دهد. او گفت: \"مردم بلافاصله به چیزی"}, {"source": "The Next Web", "title": "Clueso raises $10M for AI agents that make corporate video", "link": "https://thenextweb.com/news/clueso-10m-series-a-video-agents", "summary": "Clueso has raised a $10M Series A led by Dharana Capital for AI agents that script, record and maintain corporate video, bringing total funding to $12M. The market it is entering is led by London’s Synthesia, which was valued at $4B in January after a $200M round. Clueso has raised a $10M Series A for [ ] This story continues at The Next Web", "date_str": "2026-10-13T12:00:19+00:00", "hash": "f01a89a4e26e7262", "title_fa": "کلوزو 10 میلیون دلار برای عوامل هوش مصنوعی که ویدیوهای شرکتی تولید می کنند جمع آوری می کند", "summary_fa": "Clueso یک سری A 10 میلیون دلاری به رهبری Dharana Capital برای عوامل هوش مصنوعی که فیلمنامه‌نویسی، ضبط و نگهداری ویدیوهای شرکتی را انجام می‌دهند جمع‌آوری کرده است و مجموع بودجه را به 12 میلیون دلار می‌رساند. بازاری که وارد می‌شود توسط Synthesia لندن رهبری می‌شود که پس از یک دور ۲۰۰ میلیون دلاری در ژانویه ۴ میلیارد دلار ارزش داشت. Clueso یک سری A 10 میلیون دلاری برای [ ] جمع آوری کرده است. این داستان در The Next Web ادامه دارد، شرکت می گوید بیش از 1000 کسب و کار از آن استفاده می کنند و Atlassian، Zendesk، Seismic و Ironclad را نام می برند. این گزارش ادعاهای مشتریان در مورد افزایش بهره وری پنج برابری و هزینه های تولید 8
