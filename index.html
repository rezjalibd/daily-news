 هشدار داد جمهوری اسلامی بار دیگر در تلاش است برنامه هسته‌ای خود را احیا کند و با ا ... نتانیاهو در پیامی تصویری گفت حکومت ایران که به‌دنبال نابودی اسراییل است، در صورت دستیابی دوباره به امکان غنی‌سازی اورانیوم و توسعه تسلیحات هسته‌ای، از به‌کارگیری سلاح هسته‌ای علیه اسراییل نیز دریغ نخواهد کرد. او با اشاره به کشته‌شدن هزاران نفر از شهروندان ایران به دست حکومت جمهوری اسلامی گفت این حکومت از کشتن شمار زیادی از مردم خود نیز دریغ نکرده و در صورت دستیابی به سلاح هسته‌ای، از استفاده از آن علیه اسراییل خودداری نخواهد کرد. نخست‌وزیر اسراییل تاکید کرد باید با تمام توان مانع احیای برنامه هسته‌ای جمهوری اسلامی شد؛ همان‌طور که به گفته او، در عملیات‌های «عام کلاوی» و «شعاع هاری» تهدید فوری نابودی اسراییل برطرف شد. نتانیاهو گفت باید این تهدید موجودیتی را یک‌بار برای همیشه از میان برداشت. او در ادامه با اشاره به گفت‌وگوی خود با گادی آیزنکوت، رییس پیشین ستاد ارتش اسراییل، خواستار تشکیل دولت وحدت ملی شد و گفت دولت محدود یا دولتی که به حمایت گروه‌های حامی تروریسم متکی باشد، توانایی مقابله با چالش‌های عظیم امنیتی پیش روی اسراییل را نخواهد داشت. نتانیاهو افزود تشکیل دولت وحدت ملی می‌تواند امنیت اسراییل را برای سال‌های طولانی تضمین کند و به آشتی ملی و کاهش اختلافات داخلی نیز کمک کند. او از آیزنکوت خواست بدون پیش‌شرط وارد مذاکره شود، اختلافات و تحریم‌های سیاسی متقابل را کنار بگذارند و برای توافق درباره امنیت و آینده اسراییل، از جمله موضوع سربازی اجباری، تلاش کنند. نتانیاهو همچنین گفت مساله سربازی اجباری را می‌توان با مشارکت نمایندگان جامعه یهودیان حریدی حل‌وفصل کرد. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B5%DB%B5%DB%B5%DB%B5_olXJ__v1024x512__box_0%2C96%2C2048%2C1172.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "عامل‌های هوشمند", "روابط بین‌الملل"], "datetime_fa": "۲۳ آبان • ۲۱:۰۴"}, {"source": "IranWire", "title": "آخرین مستند بکتاش آبتین، برنده جایزه هیات داوران جشنواره سینمای مراکش شد", "link": "https://iranwire.com/fa/news-1/160244-%D8%A2%D8%AE%D8%B1%DB%8C%D9%86-%D9%85%D8%B3%D8%AA%D9%86%D8%AF-%D8%A8%DA%A9%D8%AA%D8%A7%D8%B4-%D8%A2%D8%A8%D8%AA%DB%8C%D9%86-%D8%A8%D8%B1%D9%86%D8%AF%D9%87-%D8%AC%D8%A7%DB%8C%D8%B2%D9%87-%D9%87%DB%8C%D8%A7%D8%AA-%D8%AF%D8%A7%D9%88%D8%B1%D8%A7%D9%86-%D8%AC%D8%B4%D9%86%D9%88%D8%A7%D8%B1%D9%87-%D8%B3%DB%8C%D9%86%D9%85%D8%A7%DB%8C-%D9%85%D8%B1%D8%A7%DA%A9%D8%B4-%D8%B4%D8%AF/", "summary": "مستند «تو مصطفایی؟»، آخرین فیلم بکتاش آبتین، شاعر و فیلمساز زندانی جان‌باخته در ایران، جایزه هیات داوران بخش مسابقه مستند سی‌ویکمین جشنو ...", "date_str": "2026-11-14T17:57:54+00:00", "hash": "074f4757364e5d64", "title_fa": "آخرین مستند بکتاش آبتین، برنده جایزه هیات داوران جشنواره سینمای مراکش شد", "summary_fa": "مستند «تو مصطفایی؟»، آخرین فیلم بکتاش آبتین، شاعر و فیلمساز زندانی جان‌باخته در ایران، جایزه هیات داوران بخش مسابقه مستند سی‌ویکمین جشنو ... دری رضایی، مستندساز و تهیه‌کننده ایرانی، روز شنبه ۲۳ آبان با انتشار پیامی در اینستاگرام خود از دریافت این جایزه خبر داد. بکتاش آبتین، شاعر، فیلمساز و عضو کانون نویسندگان ایران، دی‌ماه ۱۴۰۰، پس از ابتلا به کرونا در زندان و در پی تاخیر مسوولان در رسیدگی پزشکی، جان باخت. آبتین پیش از مرگ فرصت نکرد آخرین فیلم خود را به پایان برساند. مستند «تو مصطفایی؟» پس از درگذشت او با تلاش دوستان و همکارانش تکمیل شد. این فیلم محصول بنیاد بکتاش آبتین و با حمایت مدیانست (Medianest) ساخته شده و پخش بین‌المللی آن بر عهده دری رضایی است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Untitled_WGRR__v1024x512__box_44%2C0%2C1853%2C950.jpeg", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۲۳ آبان • ۲۱:۲۷"}, {"source": "BBC Persian", "title": "بازگشت ناوشکن آمریکایی پس از ۳۵۷ روز ماموریت و شلیک ده‌ها موشک به ایران", "link": "https://www.bbc.com/persian/articles/c39w9rpn0wyno?at_medium=RSS&at_campaign=rss", "summary": "ناوشکن آمریکایی «یو‌اس‌اس اسپروئنس» که در جریان جنگ آمریکا و اسرائیل علیه ایران ده‌ها موشک کروز تاماهاک شلیک کرده بود، پس از ۳۵۷ روز ماموریت به پایگاه خود در سن‌دیگو در ایالت کالیفرنیا بازگشت. به گفته نیروی دریایی آمریکا، این طولانی‌ترین ماموریت یک ناوشکن این کشور از زمان جنگ جهانی دوم بوده است.", "date_str": "2026-11-14T17:18:52+00:00", "hash": "93cd03f1982baa7c", "title_fa": "بازگشت ناوشکن آمریکایی پس از ۳۵۷ روز ماموریت و شلیک ده‌ها موشک به ایران", "summary_fa": "ناوشکن آمریکایی «یو‌اس‌اس اسپروئنس» که در جریان جنگ آمریکا و اسرائیل علیه ایران ده‌ها موشک کروز تاماهاک شلیک کرده بود، پس از ۳۵۷ روز ماموریت به پایگاه خود در سن‌دیگو در ایالت کالیفرنیا بازگشت. به گفته نیروی دریایی آمریکا، این طولانی‌ترین ماموریت یک ناوشکن این کشور از زمان جنگ جهانی دوم بوده است. نیروی دریایی آمریکا روز جمعه ۱۳ نوامبر اعلام کرد که ناوشکن اسپروئنس پس از نزدیک به یک سال حضور در ماموریت‌های دریایی و نظامی، به پایگاه خود بازگشته است. این ناوشکن ۲۱ نوامبر ۲۰۲۵، در قالب گروه رزمی ناو هواپیمابر «آبراهام لینکلن»، سن‌دیگو را ترک کرد. ماموریت آن ابتدا برای حدود هفت ماه برنامه‌ریزی شده بود، اما با آغاز جنگ علیه ایران تمدید شد و حتی پس از بازگشت ناو هواپیمابر آبراهام لینکلن، اسپروئنس در خاورمیانه باقی ماند. مقام‌های آمریکایی همچنین می‌گویند که اسپروئنس در جریان عملیات نظامی، ۱۲ پهپاد و چهار موشک کروز ضدکشتی را سرنگون کرده است. ناوشکن اسپروئنس از جمله شناورهای آمریکایی بود که در نخستین روز جنگ، ۲۸ فوریه، در حملات موشکی به ایران مشارکت داشت. در همان روز، مدرسه ابتدایی شجره طیبه در شهر میناب در استان هرمزگان هدف حمله قرار گرفت. به گفته مقام‌های ایرانی، بیش از ۱۷۵ نفر، از جمله شمار زیادی کودک، در این حمله کشته شدند. خبرگزاری آسوشیتدپرس در ماه مارس گزارش داد که ناوشکن اسپروئنس در محدوده برد موشکی مدرسه میناب قرار داشت و فرماندهی مرکزی ارتش آمریکا، سنتکام، تصویری از شلیک موشک تاماهاک از این ناوشکن در روز ۲۸ فوریه منتشر کرده بود. با این حال، هنوز مشخص نشده است که آیا موشک اصابت‌کرده به مدرسه میناب از همین ناوشکن شلیک شده بود یا نه. بخش راستی‌آزمایی بی‌بی‌سی با بررسی تصاویر ویدئویی تایید کرد که یک موشک تاماهاک آمریکایی به مجموعه پ، رئیس‌جمهوری آمریکا، روز ۱۲ نوامبر اعلام کرد که کشورش «نیازی به توافق» با تهران ندارد و اگر رهبران کنونی جمهوری اسلامی تا پایان دورهٔ ریاست‌جمهوری او در قدرت بمانند، این برای او به معنای «شکست» خواهد بود. اظهارات اخیر ترامپ به این معنا نیست که او رسماً سیاست تغییر رژیم در ایران را در پیش گرفته است؛ سیاستی که بنیامین نتانیاهو، نخست‌وزیر در آستانهٔ کناره‌گیری اسرائیل، از آن حمایت می‌کند. با این حال، چنین موضعی می‌تواند تردید تهران را دربارهٔ فایدهٔ امتیاز دادن عمیق‌تر کند، آن هم در ازای توافقی که پایان تهدید نظامی را تضمین نمی‌کند که تهران تهدیدی برای موجودیت خود می‌داند. این مسئله یکی از معضلات پیش روی تلاش‌های میانجی‌گرانه است، به‌ویژه با توجه به بی‌اعتمادی موجود و اعتقاد بخش گسترده‌ای از مقام‌های ایران به اینکه هرگونه مذاکرهٔ جدید با واشنگتن، ناگزیر به سومین حملهٔ نظامی منتهی خواهد شد. از نگاه این گروه، مذاکرات صرفاً پوششی برای یک اقدام نظامی غافلگیرکننده است. Read More This section contains relevant reference points, placed in (Inner related node field) این وضعیت بن‌بست سیاسی کنونی و تداوم محاصرهٔ دریایی و تحریم‌هایی را توضیح می‌دهد که اقتصاد ایران را فلج کرده‌اند. ترامپ اعلام کرده که آماده است این سیاست را مدتی طولانی ادامه دهد. این موضع نشان می‌دهد که واشنگتن در شرایط کنونی عجله‌ای برای دادن امتیازهایی ندارد که آنها را بی‌مورد می‌داند. این در حالی است که نیروهای سپاه پاسداران انقلاب اسلامی همچنان کشتی‌هایی را هدف قرار می‌دهند که از مسیر تعیین‌شده از سوی سپاه عبور نمی‌کنند. در نتیجهٔ این اقدامات، چندین نفتکش آسیب دیده‌اند؛ برخی از آنها با مین‌های دریایی برخورد کرده‌اند و برخی دیگر هدف حملات موشکی و پهپادی ایران قرار گرفته‌اند. در طرف ایرانی، محمدباقر قالیباف، رئیس مجلس شورای اسلامی، بر هفت شرطی که تهران اعلام کرده است پافشاری و تأکید کرد که تصمیم‌گیری‌های راهبردی در حوزه‌های حساس، تابع تصمیمات شورای عالی امنیت ملی و تأیید مجتبی خامنه‌ای، رهبر جمهوری اسلامی ایران، است. موضع قالیباف، که ریاست تیم مذاکره‌کنندهٔ ایران را بر عهده دارد، با دیدگاه محسن رضایی، دبیر شورای عالی امنیت ملی، همسوست. این همسویی از وجود جبهه‌ای متحد در میان رهبران حکومت ایران حکایت دارد. بی‌ت اس عقب‌نشینی خواهد کرد؟&#x27; این نخستین باری بود که چنین موضوعی مطرح می‌شد.» او در ادامه گفت که اگر پیشنهادی دریافت کند که شامل تضمین‌های امنیتی، اعمال نشدن محدودیت بر ارتش اوکراین و اختصاص بودجه برای بازسازی کشورش باشد، آن را به همه‌پرسی خواهد گذاشت. جرد کوشنر و استیو ویتکاف، فرستادگان ایالات متحده، پس از یک دور گفت‌وگو با ولادیمیر پوتین، رئیس‌جمهور روسیه در مسکو، روز پنجشنبه برای دیدار با آقای زلنسکی به پایتخت جمهوری ایرلند سفر کردند. اظهارات ولادیمیر پوتین و مقامات روسیه نشان می‌دهد که موضع روسیه در قبال جنگ تغییری نکرده است و خواسته‌های مسکو درباره تصاحب اراضی و بی‌طرفی، همچنان بسیار فراتر از آن چیزی است که اوکراین حاضر است آن را مدنظر قرار دهد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/3fe4/live/9d4d2ea0-e02c-11f1-9ca9-b3b288fceb81.jpg", "category": "امنیت سایبری و شبکه", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲۳ آبان • ۱۸:۰۸"}, {"source": "Iran International", "title": "استقلال خوزستان از پرسپولیس و بیفوما به فیفا شکایت می‌کند", "link": "https://www.iranintl.com/202611146545", "summary": "شهرام هزاریان، رییس هیات مدیره استقلال خوزستان، از ثبت شکایت این باشگاه از پرسپولیس و تیوی بیفوما در اتاق حل اختلاف فیفا خبر داد.", "date_str": "2026-11-14T14:34:25+00:00", "hash": "af12534475251564", "title_fa": "استقلال خوزستان از پرسپولیس و بیفوما به فیفا شکایت می‌کند", "summary_fa": "شهرام هزاریان، رییس هیات مدیره استقلال خوزستان، از ثبت شکایت این باشگاه از پرسپولیس و تیوی بیفوما در اتاق حل اختلاف فیفا خبر داد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/4a7f57ad48a50d265fadd830edfcba0cc0c8fcd0-800x534.jpg?rect=0,35,800,420&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۳ آبان • ۱۸:۰۴"}, {"source": "Iran International", "title": "رویترز: اگر تهران دست به اقدام تحریک‌آمیز نزند، ترامپ ممکن است حمله را به تعویق بیندازد", "link": . این سفر در شرایطی انجام شده که به نوشتهٔ اکسیوس، نتانیاهو در تلاش است رئیس‌جمهور آمریکا را به ازسرگیری عملیات نظامی گسترده علیه ایران متقاعد کند؛ درخواستی که ترامپ تاکنون در برابر آن مقاومت کرده است. بر اساس این گزارش، گوفمن با جان رتکلیف، رئیس سی‌آی‌ای، دیدار می‌کند و انتظار می‌رود در میامی نیز با استیو ویتکاف، فرستادهٔ ویژهٔ ترامپ، گفت‌وگو کند. موساد، سی‌آی‌ای و کاخ سفید از اظهارنظر دربارهٔ این گزارش خودداری کرده‌اند. در ادامهٔ انتشار این خبر، رسانه‌های اسرائیلی در روزهای جمعه و شنبه جزئیات بیشتری از اختلاف‌نظر مقام‌های سیاسی و امنیتی این کشور بر سر احتمال حملهٔ دوباره به ایران منتشر کردند. به گزارش این رسانه‌ها، نتانیاهو برخلاف دولت آمریکا چندان متقاعد نشده است که ادامهٔ تحریم‌های گسترده و محاصرهٔ دریایی بتواند به‌تنهایی مانع احیای توانایی‌های نظامی و هسته‌ای جمهوری اسلامی شود. نخست‌وزیر اسرائیل به‌ویژه نگران گزارش‌ها دربارهٔ تلاش تهران برای بازسازی برنامهٔ هسته‌ای و ازسرگیری تولید موشک‌های بالستیک است و معتقد است اسرائیل نباید اجازه دهد این توانایی‌ها بار دیگر گسترش یابد. شبکهٔ ۱۴ اسرائیل که از نتانیاهو حمایت می‌کند نیز در گزارشی به تلاش جمهوری اسلامی برای بازسازی توانایی‌های هسته‌ای و موشکی خود اشاره کرده و احتمال داده است که اسرائیل ناچار شود بدون مشارکت آمریکا به ایران حمله کند. نتانیاهو در سخنرانی‌های اخیر خود بارها بر ضرورت برطرف کردن آنچه «تهدید موجودیتی جمهوری اسلامی علیه اسرائیل» می‌نامد تأکید کرده و از تغییر حکومت ایران به‌عنوان یکی از اهداف", "image_url": "https://gdb.rferl.org/F1881922-FDD6-4C6A-AA40-87C6F329AB36.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۲۳ آبان • ۱۸:۱۴"}, {"source": "Radio Farda", "title": "رسانه‌های آمریکایی: ترامپ فعلاً تمایلی به حمله دوباره به ایران یا توافق فوری ندارد", "link": "https://www.radiofarda.com/a/trump-iran-military-strikes-economic-pressure-/33898629.html", "summary": "ترامپ در روزهای اخیر به مشاوران ارشد خود گفته است، در صورت نبود اقدامات تحریک‌آمیز تازه از سوی حکومت ایران یا حوثی‌ها در یمن، ممکن است از حملهٔ دوباره به ایران خودداری کند.", "date_str": "2026-11-14T14:07:39       tech: [{"source": "NYT Tech", "title": "Tech Leaders Rally Behind Jensen Huang", "link": "https://www.nytimes.com/2026/11/14/technology/silicon-valley-nvidia-jensen-huang.html", "summary": "In social media posts and letters to Nvidia’s board, Mr. Huang’s billionaire peers described him as a singular leader who could not be replaced at Nvidia.", "date_str": "2026-11-14T18:29:55+00:00", "hash": "270b1e4cbb0a19a8", "title_fa": "رهبران فناوری پشت سر جنسن هوانگ جمع می‌شوند", "summary_fa": "در پست‌های رسانه‌های اجتماعی و نامه‌هایی به هیئت مدیره انویدیا، همتایان میلیاردر آقای هوانگ او را به عنوان یک رهبر منحصر به فرد توصیف کردند که نمی‌توان آن را در انویدیا جایگزین کرد. بسیاری از مدیران و سرمایه گذاران سیلیکون ولی در حال حمایت از جنسن هوانگ هستند که روز پنجشنبه پس از افشای روابط با یک کارمند و زنی که به عقیده مقامات آمریکایی جاسوس چین است، از سمت مدیر اجرایی انویدیا استعفا داد. ایلان ماسک، مدیر اجرایی اسپیس ایکس و ثروتمندترین فرد جهان، روز شنبه در پستی در شبکه‌های اجتماعی گفت: «جنسن زنجیره تأمین را به‌خوبی در انویدیا هدایت کرد، اما بسیاری از این معاملات یک دست دادن با جنسن بود، نه یک قرارداد مکتوب». بدون جنسن، حداقل برخی از این قراردادهای حیاتی از بین خواهند رفت.» این پشتیبانی نقش انویدیا را به عنوان محور اصلی A.I مورد توجه قرار داد. رونق و رهبری آقای هوانگ به عنوان شرکت به یکی از با ارزش ترین در جهان تبدیل شد. انویدیا که شروع به ساخت تراشه‌های کامپیوتری برای بازی‌های ویدیویی کرد، اکنون حدود 90 درصد بازار تراشه‌های پیشرفته مورد استفاده در هوش مصنوعی بزرگ را در اختیار دارد. پروژه هایی که اقتصاد ایالات متحده را پیش می برند. در طول مسیر، آقای هوانگ به معامله‌گر کامل سیلیکون ولی تبدیل شد و انویدیا را به بانک مرکزی برای استارت‌آپ‌هایی تبدیل کرد که به تراشه‌ها و بودجه نیاز داشتند. برد گرستنر، مدیر اجرایی Altimeter Capital Management و گاوین بیکر، مدیر ارشد سرمایه گذاری Atreides Management در نامه ای که روز جمعه ارسال شد، نوشتند: \"ما معتقدیم که هیئت مدیره باید از عجله برای جایگزینی Jensen که منافع سهامداران را تضعیف و خنثی می کند، اجتناب کند.\" سرمایه گذاران که شرکت های آن s after all flights in the country were grounded on Friday afternoon. The FAA halted flights nationwide for about four-and-a-half hours after an issue with air traffic control systems, stranding travelers in airports and canceling about 12,500 flights on Friday and Saturday. Still, Friday's closure will snarl air travel into the weekend as airlines scramble to get airplanes and crew back in place — and thousands of delayed or canceled passengers back on their way. Department of Transportation Secretary Sean Duffy and Homeland Security Secretary Markwayne Mullin, during press conferences on Friday and Saturday, blamed the outage on outdated ATC infrastructure . Duffy also floated the possibility of an error by longtime FAA contractor L3Harris Technologies, or a faulty router. They also called for Congress to cough up $50 billion for ATC modernization — up from the $30 billion previously pitched in September. The FAA tapped AT T in August 2026 to lead the infrastructure overhaul of L3Harris' decades-old network. Here's what we know so far about the cause of the FAA outage. L3Harris did not immediately respond to a request for comment from Business Insider. Duffy floated a contractor mistake or a faulty router Duffy said on Saturday that the issue began when L3Harris, an FAA contractor for over 20 years, was upgrading copper wiring to fiber at \"at least one\" remote FAA site on Friday; the fiber work has been ongoing for months across the US. One of the routers in the project \"started flooding other routers\" in the network with data, so the FAA shut it down. That affected radar and communication with pilots at Air Route Traffic Control Centers, which manage and guide traffic at higher altitudes between airports. \"What we did yesterday was routine; this has happened thousands and thousands of times over the course of decades in America,\" Duffy said. \"These issues don't happen, which begs the ", "date_str": "2026-11-14T18:18:27+00:00", "hash": "fae76db2a9ff1426", " m/let-career-credentials-teaching-license-expire-found-unexpected-freedom-2026-11", "summary": "The author said she spent years earning her teaching license, and letting it expire didn t come easily to her. Courtesy of Ashley Archambault. A chronic illness forced me to leave my teaching job. It took years for me to earn my credentials, and allowing them to expire weighed heavily on me. Letting my license expire has been surprisingly freeing. Now I can fully focus on my next move. I left the classroom a couple of years ago. I told myself it was for good, but my husband made me promise him that I was really done. In return, I asked him not to let me go back if I ever tried to again. Deep down, I can still sense my love of teaching , and since my husband knows me well, these are promises I know we'll both keep. I knew my professional teaching certificate was going to expire this summer, and I went back and forth about whether or not I should go to the trouble of renewing it. In an extreme act of setting boundaries, I decided to let it go — on purpose. I was worried I would regret it, but now I'm glad I let it expire. I felt a huge sigh of relief when my teaching certificate was no longer active I had no realistic intentions of returning to the classroom, but it was difficult to think about how much work I had put into obtaining my professional teaching certificate. But every time I considered going through the steps to keep my license up to date, it didn't make sense. I have no intention of teaching again, so spending my time and money to keep my license felt like holding onto something that wasn't right for me anymore. The author said she tried to return to the classroom, but her health issues made it impossible. Courtesy of Ashley Archambault. My push out of the classroom came unwillingly, as my health was deteriorating, making it increasingly difficult for me to do my job. I even took a few months off toward the end to focus on my health before returning to the classroom, but it ended up the same way. As soon as I went back to work, my symptoms flared back up, and I couldn't finish the school year again. I had to accept that I couldn't physically do my job Shortly after I left teaching for good, I finally got my endometriosis diagnosis . I had an answer as to why I had been getting increasingly sick over the last five years. Unfortunately, I didn't receive care before the disease changed my career route. The majority of my time now is spent managing my symptoms and doing my best to regain a lot of physical function after two major surgeries in the la", "date_str": "2026-11-14T17:49:01+00:00", "hash": "f09ee877376de169", "title_fa": "اجازه دادم مجوز تدریسم بعد از سال ها تلاش تمام شود. انتظار نداشتم اینقدر احساس آزادی کنم.", "summary_fa": "نویسنده می‌گوید که سال‌ها برای گرفتن مجوز تدریس خود وقت صرف کرده است و اجازه نداده است که این مجوز منقضی شود. با حسن نیت از اشلی آرچمبل. یک بیماری مزمن مرا مجبور کرد شغل معلمی ام را ترک کنم. سالها طول کشید تا من مدارکم را به دست بیاورم و اجازه دادن به آنها برای منقضی شدن آنها بر من سنگینی می کرد. اجازه دادن به منقضی شدن مجوز من به طور شگفت انگیزی آزاد کننده بوده است. اکنون می توانم به طور کامل روی حرکت بعدی خود تمرکز کنم. من یکی دو سال پیش کلاس را ترک کردم. به خودم گفتم خوب است، اما شوهرم به او قول داد که واقعاً کارم تمام شده است. متقابلاً از او خواستم که اگر دوباره تلاش کردم اجازه ندهد برگردم. در اعماق وجودم، هنوز می‌توانم عشقم به تدریس را حس کنم، و از آنجایی که شوهرم مرا به خوبی می‌شناسد، این وعده‌هایی است که می‌دانم هر دو به آن عمل خواهیم کرد. می‌دانستم که گواهینامه تدریس حرفه‌ای‌ام تابستان امسال به پایان می‌رسد، و در مورد اینکه آیا باید برای تمدید آن به زحمت بیفتم یا نه، رفت و آمد کردم. در یک اقدام افراطی برای تعیین مرزها، تصمیم گرفتم آن را رها کنم - عمدا. نگران بودم که پشیمان شوم، اما اکنون خوشحالم که اجازه دادم منقضی شود. وقتی گواهینامه تدریسم دیگر فعال نبود، نفس راحتی کشیدم، قصد واقع بینانه ای برای بازگشت به کلاس نداشتم، اما فکر کردن به اینکه چقدر برای دریافت گواهینامه تدریس حرفه ای خود irectors said it opened an investigation into whether Huang was the \"target of a foreign intelligence effort\" after he admitted to having an affair in a letter to staffers. Days later, Huang resigned after reports he had another affair with an Nvidia executive, and the board appointed Colette Kress , executive vice president and chief financial officer, as interim CEO until they find a permanent successor. An October report by The New York Times said Huang had developed a \"close relationship\" with Alice Huang , a tech executive at Megaspeed in Singapore. The Times reported that US intelligence officials said she may be a spy for the Chinese government. China has since denied that claim. On Thursday, Attorney General Todd Blanche said the Department of Justice had not concluded whether Alice Huang was a spy. The \"Stand with Jensen\" organizers said in an open letter to Nvidia's board posted to its website that they believe the board removed Huang without an investigation and \"meaningful due process.\" \"We have not been shown evidence substantiating the espionage allegation. After thirty-three years pouring his heart and soul into NVIDIA, Jensen deserves due process, not mob justice,\" they said", "date_str": "2026-11-14T17:28:05+00:00", "hash": "1e1a5f25f1920709", "title_fa": "طوماری برای بازگرداندن جنسن هوانگ به عنوان مدیرعامل انویدیا بیش از 100000 امضا دارد، از جمله برخی از نام‌های بزرگ.", "summary_fa": "طوماری برای بازگرداندن جنسن هوانگ به عنوان مدیر عامل انویدیا در حال پخش آنلاین است. اریک فلایگ/ بلومبرگ از طریق گتی ایماژ، جنسن هوانگ، مدیرعامل انویدیا، روز پنجشنبه پس از اعتراف به رابطه نامشروع، استعفا داد. Nvidia در حال بررسی است که آیا این امور یک \"تلاش اطلاعات خارجی\" بوده است یا خیر. اکنون نزدیک به 100000 نفر از جمله ایلان ماسک و دیگران طوماری را برای بازگرداندن هوانگ امضا کرده اند. برخی از مردم حاضر نیستند که جنسن هوانگ، مدیرعامل سابق را کنار بگذارند. طوماری برای بازگرداندن هوانگ به عنوان مدیر عامل انویدیا تا صبح روز شنبه حدود 97000 امضا داشت، از جمله ج سال پس از راه اندازی، اعلام ورشکستگی کرد. اخیراً، Ollie دستیار هوش مصنوعی متمرکز بر حریم خصوصی، چند هفته پیش تعطیلی خود را اعلام کرد. جدای از Character.ai و Ollie، بسیاری از شرط‌بندی‌های هوش مصنوعی حتی در شرکت‌هایی که آنها را می‌سازند نیز زنده نمی‌مانند. طبق اطلاعات S P Global Market Intelligence، حدود 42 درصد از ابتکارات هوش مصنوعی در نهایت توسط والدین شرکتی خود رها می شوند. دلایل متفاوت است: بودجه ناکافی، چالش های فنی، رقابت، مقیاس سختی، یا فقط تقاضای ضعیف کاربر. نتیجه یک قبرستان در حال رشد هوش مصنوعی است. در زیر نگاهی به برخی از برجسته‌ترین محصولات هوش مصنوعی، استارت‌آپ‌ها، راه‌اندازی‌ها و شرط‌بندی‌هایی که انتظارات را تعطیل کرده‌اند، تغییر داده‌اند یا به‌طور قابل‌توجهی از دست داده‌اند، می‌بینید. آن را کمتر به عنوان یک کارت امتیازی از فلاپ ها در نظر بگیرید تا به عنوان رکوردی از آنچه این تلاش ها می توانند (امیدوارم) به بقیه صنعت بیاموزند. حتی بزرگ‌ترین بازیکنان هم مصون نیستند. OpenAI، یکی از با ارزش ترین شرکت های خصوصی در جهان، سهم خود را از تلفات و اشتباهات داشته است. یکی از نمونه‌های جدیدتر، تلاش آن برای تبدیل ChatGPT به یک «برنامه فوق‌العاده» گسترده‌تر بود. در 9 ژوئیه، OpenAI برنامه را به‌روزرسانی کرد تا چندین تجربه از جمله حالت‌های Chat، Codex، و Work جداگانه را ترکیب کند، در حالی که نام نسخه سنتی و آشنا ChatGPT Classic را تغییر داد. این طراحی مجدد به سرعت مورد انتقاد کاربرانی قرار گرفت که رابط جدید را گیج کننده و به هم ریخته می دانستند و OpenAI این تغییر را به زودی", "image_url": "https://techcrunch.com/wp-content/uploads/2019/12/GettyImages-95927766-1.jpg?resize=1200,797", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Apple", "سرمایه‌گذاری"], "datetime_fa": "۲۳ آبان • ۲۱:۰۰"}, {"source": "The Verge", "title": "Work to replace old copper wire led to the FAA’s ground stop", "link": "https://www.theverge.com/transportation/1033898/faa-ground-stop-sean-duffy-faa-copper-wire", "summary": "CHICAGO, US - NOVEMBER 13: A view of an information board at the Chicago O'Hare International Airport, filled with waiting passengers on November 13, 2026, a fortunately, it wasn't a match for me, but it had so much going for it that I decided to try its charming sister island, Gozo. Gozo lies a few miles northwest of Malta and belongs to the same archipelago. It's just 26 square miles (roughly the size of Manhattan) and home to around 40,000 people. I first visited Gozo in 2012 and have returned a handful of times since then. On my most recent trip this September, I stayed in a gorgeous little villa in Xagħra, a small, historic town with a population of about 5,400. As much as I adore the Maltese island , my most recent trip there made me realize it might not be the perfect spot for me to retire. Gozo has great Mediterranean vibes and feels ideal for slow exploring Gozo has some incredible options for outdoor dining. Louise Slyth Gozo seemed to have many of the same draws as Malta, but with slightly fewer crowds and a slower pace of life. For one, English is widely spoken in both Malta and Gozo, which I appreciate. Gozo has lovely weather with about 300 days of sunshine a year and mostly mild temperatures. The island really does feel Mediterranean, with limestone buildings, beautiful churches, and endless sea views. It had a nice balance of rural beauty and bustling shops and eateries. People were friendly, the villages I've explored so far have all felt safe, and life seemed to move at an unhurried pace. The Visit Gozo website describes the island as \"developed just enough but not too much,\" which I think defines its charm. There are many things to see and do in Gozo, but the island didn't feel super aimed at tourists with a massive list of must-see attractions. Gozo has world-class diving, swimming at Ramla Bay, and leisurely boat rides along the coastline. T", "date_str": "2026-11-14T14:28:01+00:00", "hash": "c0e4dc467bf03e8a", "title_fa": "پس از رد کردن مالتا به عنوان مکانی برای بازنشستگی، زندگی در جزیره خواهر کوچکتر آن، گوزو را آزمایش کردم.", "summary_fa": "من واقعاً می‌خواستم مالتا کار کند، بنابراین Gozo را امتحان کردم - و در حالی که این یک مکان عالی برای تعطیلات بود، متوجه شدم که جایی نیست که بخواهم تمام وقت زندگی کنم. لوئیز اسلیث هنگام آزمایش مکان‌هایی برای بازنشستگی، من مالتا را رد کردم اما می‌خواستم جزیره خواهرش، گوزو را امتحان کنم. من عاشق آفتاب، آب و هوا و حال و هوای گوزو هستم، اما فکر نمی‌کنم بتوانم درازمدت در آنجا پیشرفت کنم. شیوع برخی اشکالات، نبود فرودگاه بین المللی و سرعت آهسته برای من ایده آل نیست. اگرچه از زندگی در ایرلند خوشحالم، اما گاهی اوقات آرزوی هوای گرمتر و سرعت پایین تر زندگی را دارم. بنابراین وقتی سفر می‌کنم، همیشه به این فکر می‌کنم که آیا مقصد من می‌تواند چیزی بیش از یک مکان تعطیلات باشد - شاید جایی برای بازنشستگی روزی. در سال 2023، یک ماه وقت گذاشتم تا ببینم آیا مالت می‌تواند یک خانه بالقوه برای همیشه باشد. متأسفانه، برای من مناسب نبود، اما آنقدر برایم جذاب بود که تصمیم گرفتم جزیره خواهر جذابش، گوزو را امتحان کنم. گوزو در چند مایلی شمال غربی مالت قرار دارد و متعلق به همان مجمع الجزایر است. این تنها 26 مایل مربع (تقریبا به اندازه منهتن) است و حدود 40000 نفر را در خود جای داده است. من اولین بار در سال 2012 از گوزو بازدید کردم و از آن زمان تاکنون چندین بار به این کشور بازگشته ام. در آخرین سفرم در سپتامبر امسال، در یک ویلای کوچک و زیبا در Xagħra، یک شهر کوچک و تاریخی با جمعیتی حدود 5400 نفر اقامت کردم. به همان اندازه که من جزیره مالت را دوست دارم، سفر اخیرم به آنجا باعث شد متوجه شوم که ممکن است مکان مناسبی برای بازنشستگی من نباشد. گوزو حال و هوای مدیترانه ای عالی دارد و برای کاوش آهسته احساس ایده آلی", "image_url": "https://i.insider.com/6aee299d8f37e8e0b5baad78?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۳ آبان • ۱۷:۵۸"}, {"source": "Business Insider", "title": "My parents raised 5 kids without losing their minds. They had a system for everything, from dinner to Christmas presents.", "link": "https://www.businessinsider.com/parents-five-kids-unusual-household-rules-schedules-2026-11", "summary": "The author (not pictured) was the youngest of five siblings Liderina/Getty Images I grew up as the ared upstairs. In hushed tones, resentful about the gifts we weren't getting, a parent would hand each of us a present to carry. We'd then queue up in age order and slowly descend the stairs singing happy birthday in different pitches, the person in the lounge overacting their surprise as we finally came into view. Christmas was another meticulous affair. We'd watch as a parent burrowed through piles", "date_str": "2026-11-14T14:25:01+00:00", "hash": "f8a592b0c7faf81b", "title_fa": "پدر و مادر من 5 بچه را بدون اینکه عقلشان را از دست بدهند بزرگ کردند. آنها یک سیستم برای همه چیز داشتند، از شام گرفته تا هدایای کریسمس.", "summary_fa": "نویسنده (در تصویر نیست) کوچکترین از پنج خواهر و برادر لیدرینا/گتی ایماژ بود. هر کدام از ما روزهایی را برای کارهای روزمره، آشپزی، راه رفتن با سگ و حتی نشستن روی صندلی جلو تعیین کرده بودیم. قبلاً از همه قوانین ناراحت بودم، اما اکنون از کار گروهی و صبری که به من آموختند قدردانی می کنم. صدای زنگ همان تاثیر بوق شکستن در یک کارخانه صنعتی را داشت. درها به آرامی در امتداد راهرو باز می‌شدند و بدن‌های ژولیده بیرون می‌آمدند. در خانه ما، ساعت 18:30. وقت شام بود نمی‌توانم به یاد بیاورم که زنگ چه زمانی معرفی شد، اما ثابت کرد که مؤثرترین راه برای فراخوانی پنج نوجوان جوان به آشپزخانه برای صرف غذا بود. علیرغم اینکه معمولاً هنگام بیرون رفتن در انظار عمومی (مخصوصاً هنگامی که در یک صف در پله‌های برقی متحرک قرار می‌گیرید)، پنج بچه در واقع عدد بسیار مناسبی است. پنج روز هفته برای هر فرد مناسب بود تا یک روز اختصاص داده شده برای وظایف داشته باشد: آشپزی، راه رفتن با سگ، حتی نشستن در صندلی جلوی ماشین (افتخاری که هر نوجوان در اوایل دهه 00 برای آن می جنگید). من کوچکترین هستم، و بنابراین روز من جمعه بود، که یک بی عدالتی آشکار بود زیرا متقاعد شده بودم که باید بیشتر از بقیه منتظر بمانم. همه ما کاری داشتیم که باید انجام دهیم، به گفته پدرم، پنج کودک و دو بزرگسال به این معنی بود که خوردن شام «زمان غذا دادن در باغ وحش» بود. بله، یک خط مشی فقط یک وعده وجود داشت، و بشقاب های آشفته اجتناب ناپذیر بود، اما وقتی غذا را تمام کردیم، تبدیل به ماشینی شدیم که به خوبی روغن کاری شده بود. یکی ظرف های کثیف را جمع کرد، یکی شست، یکی خشک کرد، یکی وسایل را کنار گذاشت و دیگری میز را تمیز کرد. به یاد", "image_url": "https://i.insider.com/6ae8a386f3bee449b3d2a2bf?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۳ آبان • ۱۷:۵۵"}, {"source": "Business Insider", "title": "A woman on the cruise ship struck by a tanker said the riverboat started filling with water like the 'Titanic'", "link": "https://www.businessinsider.com/new-orleans-cruise-ship-riverboat-tanker-collision-passengers-2026-11", "summary": "Tamara Carrasco, a retired elementary school teacher from Atlanta, was on the ship when it was struck. Blake Paterson A riverboat was struck by a tanker in New Orleans on Friday, causing the ship to tip over and sink. Tamara Carrasco said the collision knocked her to the floor and water gushed into the ship. \"What was going through my mind was: we're going to die,\" she said. Tamara Carrasco was in the dining room of the American Heritage cruise ship , docked in the Port of New Orleans, when she spotted a tanker heading straight toward them. Carrasco, a retired elementary school teacher from Atlanta, was seated at a table by the windows so she could look out at the Mississippi River . She saw the tanker crossing under the bridge nearby and noticed it was lowering its anchor. \"I thought, 'Why would they be anchoring here?'\" she said. Her friend turned to her: \"It's not stopping. It's going to hit us.\" Carrasco was skeptical, until she saw the crew running across the tanker's deck \"like ants.\" \"What was going through my mind was: We're going to die,\" she said. The tanker, Atlantic Asphalt, crashed directly into the American Cruise Lines riverboat on Friday, causing the ship to topple over and sink as passengers rushed to evacuate. Several people ended up in the river and had to be pulled out by first responders. Of the nearly 200 people on board, 32 were transported to hospitals. None were critically injured, officials said. \"We have zero people unaccounted for, which truly is a miracle on the Mississippi,\" New Orleans Mayor Helena Moreno said at a press conference. Carrasco, 65, said when the tanker approached the riverboat , she ran to the opposite end to get as far away from the glass windows as possible. She found a nook on the other end of the ship where she braced herself. \"It hit so hard I flew to the ground,\" she said. The American Heritage riverboat toppled over after being struck by the Atlantic Asphalt tanker in New Orleans. Gerald Herbert/AP After the collision, she ran to the stairwell in the middle of the boat and could see into the dining room. The tanker, she said, had broken through the glass windows and water was pouring in. \"Seen the movie 'Titanic'? There was a big gash and water is flying in, and I said, 'Oh, this is going down,'\" she said. She ran up to the next floor and exited the cruise ship usinga gangplank. The crowd gathering on dry land was in shock. Carrasco said it was like after 9/11. \"We're all just kind of wandering in a daze", "date_str": "2026-11-14T14:18:21+00:00", "hash": "b8c225d85cc562ae", "title_fa": "یک زن در کشتی تفریحی که توسط یک تانکر مورد اصابت قرار گرفته است، گفت: قایق رودخانه مانند تایتانیک شروع به پر شدن از آب کرد.", "summary_fa": "تامارا کاراسکو، معلم بازنشسته مدرسه ابتدایی از آتلانتا، در کشتی بود که تصادف کرد. بلیک پترسون روز جمعه یک قایق رودخانه ای در نیواورلئان مورد اصابت یک تانکر قرار گرفت که باعث واژگونی و غرق شدن کشتی شد. تامارا کاراسکو گفت که برخورد او را به زمین زد و آب به داخل کشتی ریخت. او گفت: \"آنچه در ذهن من می گذشت این بود: ما خواهیم مرد.\" تامارا کاراسکو در اتاق ناهار خوری کشتی کروز هریتیج آمریکایی که در بندر نیواورلئان لنگر انداخته بود، یک نفتکش را دید که مستقیماً به سمت آنها می رفت. کاراسکو، معلم بازنشسته مدرسه ابتدایی از آتلانتا، پشت میزی کنار پنجره ها نشسته بود تا بتواند به رودخانه می سی سی پی نگاه کند. او تانکری را دید که از زیر پل در همان نزدیکی عبور می کرد و متوجه شد که لنگر خود را پایین می آورد. او گفت: \"من فکر کردم، \"چرا آنها باید اینجا لنگر بیاندازند؟\" دوستش رو به او کرد: \"قطع نمی شود. به ما ضربه می زند.\" کاراسکو مشکوک بود، تا اینکه دید خدمه از روی عرشه نفتکش «مثل مورچه» می دویدند. او گفت: \"آنچه در ذهن من می گذشت این بود: ما خواهیم مرد.\" نفتکش آتلانتیک آسفالت روز جمعه مستقیماً با قایق رودخانه آمریکن کروز لاین سقوط کرد و باعث شد کشتی واژگون شود و در حالی که مسافران برای تخلیه عجله داشتند کشتی غرق شود. چند نفر به رودخانه ختم شدند و نیروهای امدادی مجبور شدند آنها را بیرون بکشند. از حدود 200 سرنشین هواپیما، 32 نفر به بیمارستان منتقل شدند. به گفته مقامات، هیچ یک به شدت آسیب ندیده است. هلنا مورنو، شهردار نیواورلئان در یک کنفرانس مطبوعاتی گفت: \"ما هیچ نفری داریم که از آنها خبری نیست، که واقعاً یک معجزه در می سی سی پی است.\" کاراسکو 65 ساله گفت وقتی تانکر به قایق رودخانه", "image_url": "https://i.insider.com/6af7cf770cc3ffba8779d27f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۳ آبان • ۱۷:۴۸"}, {"source": "Business Insider", "title": "I watched Jensen Huang speak 9 days before his resignation. Two things stand out now.", "link": "https://www.businessinsider.com/jensen-huang-nvidia-management-succession-conference-talk-2026-11", "summary": "Jensen Huang in San Francisco on Nov. 3 without his famous leather jacket. Alistair Barr/Business Insider A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . Nine days before Jensen Huang resigned as Nvidia CEO, I sat near the front row at a San Francisco conference and watched him discuss the future of AI. Two things struck me that day. Both seem more significant now. First, Huang wasn't wearing his famous black leather jacket . Instead, as you can see in the photo I took, he wore a dark fabric zip-up. At the time, I thought it was funny. His jacket had become such a recognizable part of his image that seeing him without it was a bit jarring. Now, with revelations about his extramarital affairs and allegations involving a possible Chinese spy , I wonder whether the wardrobe change meant something. The initial allegations were already public by November 3. Of course, that's hindsight talking. Maybe a jacket is just a jacket. The second thing was more consequential. Fireworks AI CEO Lin Qiao (left) interviewing Jensen Huang at the startup s conference in San Francisco on Nov. 3, 2026. Alistair Barr/Business Insider Near the end of the conversation, Fireworks AI CEO Lin Qiao asked Huang about his unusual management style. He had 60 executives reporting directly to him . Huang explained that he'd designed this structure more than 30 years ago, when personal computers and email were transforming business. Rather than a traditional hierarchy, he wanted information flowing freely among executives empowered to make decisions. Then came the obvious question: What should a company's leadership structure look like in the AI age? \"I don't know the answer to that,\" Huang replied. At the time, I thought that was a bit odd. Nvidia is leading the AI revolution and Jensen leads Nvidia. Wouldn't he be thinking of how best to run this company in the future? Today, that exchange seems especially relevant. With Huang gone, Nvidia faces an extraordinary succession challenge . Sixty direct reports may have worked brilliantly under its founder. But it also means there isn't an obvious deputy to take the reins. If he'd had two or three direct reports, those people would have had more experience with more responsibility. But 60 direct reports, by definition, means that each one of those execs only had a small piece of Nvidia to oversee. Does this mean Nvidia is doomed? I'm not sure. The way Je", "date_str": "2026-11-14T14:00:01+00:00", "hash": "26b42fd391ba603e", "title_fa": "من سخنرانی جنسن هوانگ را 9 روز قبل از استعفا تماشا کردم. دو چیز در حال حاضر برجسته است.", "summary_fa": "", "image_url": "https://i.insider.com/6af67723cbe2120470735066?width=1200&f st kind of therapy. An influencer s video also showed some of the activities passengers enjoyed before boarding, including airport photo opportunities, karaoke and meet-and-greets at the gate. Warped Tour-branded goodie bags were waiting on passengers seats before the surprise performances began. Since launching in 2011, Southwest’s Live at 35 series has featured notable acts including Imagine Dragons, Barenaked Ladies, Plain White T’s, NEEDTOBREATHE, O.A.R. and Better Than Ezra. The FAA issued a nationwide ground stop Friday, grounding flights for more than four hours and contributing to more than 12,500 cancellations across Friday and Saturday. Transportation Secretary Sean Duffy attributed the disruption to outdated air traffic control technology ", "date_str": "2026-11-14T18:28:41+00:00", "hash": "8aa30ecad9a4dac6", "title_fa": "طرح ساده، هوباستانک، و موارد دیگر، در میانه پرواز در میان توقف زمینی FAA با تور تاب خورده همراه شوید", "summary_fa": "چندین هنرمند از مجموعه تور Vans Warped امسال یک کنسرت غیرمنتظره در طول پرواز در مسیر اورلاندو، فلوریدا به مسافران دادند. در روز جمعه (13 نوامبر)، Simple Plan، Hoobastank، The Used و LØLØ در یک پرواز خطوط هوایی Southwest از لس آنجلس به اورلاندو اجرا کردند زیرا توقف زمینی FAA پروازها را در سراسر کشور متوقف کرد. نوازندگان برای تاریخ شنبه (14 نوامبر) در ورزشگاه کمپینگ ورلد برای تور Warped Tour به شهر رفتند. مطالب مرتبط درباره این است: کوین لیمن در تور 30 ساله Vans Warped و What Comes Next Tour Vans Warped اولین هنرمندان برای 2026 Vans Warped را نشان می دهد که ترکیب کامل مونترال شامل طرح ساده، بولینگ برای سوپ، بازگشت به عقب یکشنبه توسط Jutes Mores Videos Hopped به اشتراک گذاشته شده توسط Jutes Mores Dougstan. اجرای یک نسخه آکوستیک از آهنگ «دلیل» گروه، که در سال 2004 در رده 2 بیلبورد هات 100 قرار گرفت. من همیشه گفته‌ام @hoobastank یکی از بهترین اجراهای زنده روی کره زمین است، یک نفر روی یک کلیپ در اینستاگرام نوشت. صدای آنها از بلندگوهای هواپیما اینگونه است. مجنون! پیر بوویه، خواننده Simple Plan نیز نسخه های آکوستیک \"Perfect\" و ": ["سینما"], "datetime_fa": "۲۳ آبان • ۲۰:۴۵"}, {"source": "Rolling Stone", "title": "Looze Cannon Was Rapping Before You Met ‘Big Michael’", "link": "https://www.rollingstone.com/music/music-features/looze-cannon-big-michael-michael-tiktok-interview-1235658356/", "summary": "His viral Michael Jackson character landed him onstage with G Herbo. Now he wants listeners to hear the rest of his music", "date_str": "2026-11-14T18:00:22+00:00", "hash": "f5e07b8030c8b122", "title_fa": "لوز کانن قبل از ملاقات با \"بیگ مایکل\" در حال رپ بود", "summary_fa": "شخصیت ویروسی مایکل جکسون او را با جی هربو روی صحنه برد. حالا او می خواهد شنوندگان بقیه موسیقی او را بشنوند. جدیدترین کرم گوش ویروسی در رسانه های اجتماعی شباهت عجیبی به پادشاه پاپ دارد. «بیگ مایکل مایکل» که برای اولین بار به صورت آزاد در جریان زنده موسیقی‌دان و خالق محتوا لوز کانن متولد شد، طوفانی در اینترنت به دست آورده است. این آهنگ که در یک رجیستر نرم و پنبه ای ارائه شده است که بی شباهت به آهنگ جکسون نیست، در صدر جدول هیپ هاپ/رپ آیتونز قرار گرفته و الهام بخش یک ویدیوی همگام سازی لب از لیل بیبی است. اوایل این ماه، لوز کانن شخصیت «مایکل بزرگ» خود را به نمایش جی هربو در مرکز شیکاگو آورد و در مقابل جمعیت تقریباً فروخته شده اجرا کرد. کانن به رولینگ استون می‌گوید: «جی هربو، فکر می‌کنم او پستی گذاشته بود که در آن آهنگی می‌خواند، و نکته بعدی که می‌دانم، مدیریت من فقط به من گفت: «هی، هربو از تو می‌خواهد که در مرکز متحد در شیکاگو بیای و اجرا کنی.» من فکر می‌کردم «چی؟» فکر می‌کردم همه دارند بازی می‌کنند، اما واقعی بود. سوار اسپرینتر شدیم و مستقیماً از دیترویت به شیکاگو رفتیم. و نکته بعدی که می دانم، من روی صحنه بودم، مرد، بزرگترین لحظه زندگی ام را سپری کردم.» تعداد جمعیت، بزرگ‌ترین لوز کانن بود که از دهه 2010 در دیترویت رپ می‌کرد و تا به حال در مقابل آن اجرا کرده بود. او می‌گوید: «من در میان جمعیت‌های زیادی بوده‌ام، زیرا همیشه روی صحنه‌ها و مواردی از این دست بوده‌ام، اما این بزرگترین نمایش تا کنون، نمایش G Herbo بود. \"این بیشترین اجرا بود که تا به حال در مقابل همگان اجرا کردم.\"", "image_url": "https://www.rollingstone.com/wp-con     let currentTab = 'persian';

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;

        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;

      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {

          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
