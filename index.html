 Nothing Ear (Open) Open Ear Headphones, Ultra-Light with Adjustable Earhooks, Multipoint Connection Bluetooth Earbuds, Clear Vo", "date_str": "2026-09-10T21:00:00+00:00", "hash": "e6167faef26aa269", "title_fa": "بهترین فروش در هدفون و هدفون در حال حاضر", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. پیدا کردن یک جفت هدفون یا هدفون که دقیقاً نیازهای شما را برآورده کند، چه در باشگاه استفاده کنید، چه در حین کار از خانه، یا حتی در هنگام دوش گرفتن، به معنای صرف هزینه زیادی نیست. بهترین آنها ممکن است واقعاً گران باشند، بله، اما اگر خریدار صبور هستید، معمولاً می‌توانید قیمت مناسبی برای هر جفت هدفون پیدا کنید. با این اوصاف، در اینجا بهترین معاملات، تخفیف‌ها و فروش‌هایی است که می‌توانید در حال حاضر روی هدفون‌ها و هدفون‌ها پیدا کنید. من مرتباً این لیست را به‌روزرسانی می‌کنم زیرا پیشنهادها می‌آیند و می‌روند، بنابراین در صورت نیاز دوباره مراجعه کنید، اما با توجه به اینکه این قیمت‌ها می‌توانند در هر زمان تغییر کنند، به شما توصیه می‌کنم اگر جفتی را که متناسب با نیاز و بودجه شما است، منتظر نمانید. هدفون بلوتوث بی‌سیم ANC (گرید A مرمت شده) Beats Studio Pro (بازسازی شده در کارخانه) 139.99 دلار در Woot 349.99 دلار صرفه جویی در 210.00 دلار دریافت معامله دریافت معامله 139.99 دلار در Woot 349.99 دلار صرفه جویی 210.00 دلاری C - Apple Heeds, Apple Chireless سازگار با اندروید اپل، بلوتوث کلاس 1، میکروفون داخلی، 6 ساعت زمان گوش دادن Beats Fit Pro Earbuds 124.99 دلار در آمازون 199.95 دلار صرفه جویی 74.96 دلار دریافت معامله دریافت معامله 124.99 دلار در آمازون 199.95 دلار صرفه جویی 74.96 دلار NC Prophone یا Microphone 74.96 NC Optimizer، تسلط بر مهندسین Sony WH-1000XM6 بهترین هدفون های بی سیم حذف کننده نویز 398 دلار در آمازون 459.99 دلار صرفه جویی در 61.99 دلار دریافت معامله دریافت معامله 398.00 دلار در آمازون 459.99 دلار صرفه جویی 61.99 دلاری LeReading Noisephone Industry WH-1000XM5 (Refurbished) 159.99 دلار در آمازون 248.00 دلار"}, {"source": "Lifehacker", "title": "You Don't Need the Apple Watch 12 to Get All the New Health Features", "link": "https://lifehacker.com/tech/you-dont-need-the-apple-watch-12-to-get-all-the-new-health-features?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Apple recently announced some big changes to the Health app , as well as new sensors in the upcoming Apple Watch Series 12 and Ultra 4 . The company bundled these and other health-related announcements together, but that doesn't mean you need an Apple Watch 12 to take advantage of all the new features. Here's the breakdown of which Apple Watches will get the new features and which ones don't need an Apple Watch at all. Apple Watch Series 12 (GPS, 42mm) $399.00 at Amazon Shop Now Shop Now $399.00 at Amazon Readiness and more accurate heart rate require the Apple Watch Series 12 or Ultra 4 You'll need the new Series 12 or the Ultra 4 to get Apple's new heart rate sensor the one it's billing as the most accurate in any wearable. (Huge if true.) These two watches also have the new S11 processing chip. The sensor and the chip are required for what Apple is calling its \"health sensing system,\" which gives you more frequent heart rate and HRV readings throughout the day. According to Apple, the new systems measure heart rate every five seconds instead of every five minutes , and HRV every five minutes instead of every few hours. Overnight vitals will now include a Recovery HRV score that's compared to your baseline (so you know when your body is under more or less stress than usual). The Readiness score seems to rely on these readings, so you'll need one of the new watches to get that score. The upgraded Health app needs an iPhone 15 Pro or newer I recently wrote about the changes Apple has planned for the new Health app and noted that those are likely to be software changes that don't require a new phone or watch. Apple writes in a footnote on the Apple Watch page that the redesigned Health app requires an Apple Intelligence-enabled iPhone (or iPad). The full list of Apple Intelligence-enabled devices is here , and they include the iPhone 15 Pro and all iPhones 16 and newer. The new app includes \"insights,\" which seem to be similar to the trends you'll see in the current Apple Health app. If you've ever noticed the little cards that say things like \"your cardio fitness has been trending up for 8 weeks,\" it seems we'll get more of those, and they'll be collected together into their own area of the app. There will also be text summaries of your data and recommendations for what to do next, apparently written by Apple Intelligence based on your data. The VO2max test requires some kind of heart rate sensor (but not n", "date_str": "2026-09-10T20:00:31+00:00", "hash": "06bde68d27afb276", "title_fa": "برای دریافت تمام ویژگی های جدید سلامتی، به Apple Watch 12 نیاز ندارید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اپل اخیراً تغییرات بزرگی را در برنامه Health و همچنین حسگرهای جدید در اپل واچ سری 12 و اولترا 4 آینده اعلام کرده است. این شرکت این و سایر اعلامیه های مرتبط با سلامت را با هم جمع کرده است، اما این بدان معنا نیست که برای استفاده از تمام ویژگی های جدید به اپل واچ 12 نیاز دارید. در اینجا به تفکیک این دسته از اپل واچ ها می پردازیم که ویژگی های جدید را دریافت خواهند کرد و کدام ساعت ها اصلاً به اپل واچ نیاز ندارند. Apple Watch Series 12 (GPS, 42mm) 399.00 دلار در آمازون همین حالا خرید کنید 399.00 دلار در آمازون آماده باشید و ضربان قلب دقیق تر به اپل واچ سری 12 یا اولترا 4 نیاز دارید. (اگر درست باشد بزرگ است.) این دو ساعت دارای تراشه پردازشی جدید S11 هستند. سنسور و تراشه برای چیزی که اپل آن را «سیستم سنجش سلامت» می‌نامد، مورد نیاز است که ضربان قلب و HRV را در طول روز بیشتر می‌خواند. به گفته اپل، سیستم های جدید ضربان قلب را به جای هر پنج دقیقه، هر پنج ثانیه و به جای هر چند ساعت، هر پنج دقیقه یک بار HRV را اندازه گیری می کنند. موارد حیاتی یک شبه اکنون شامل یک نمره Recovery HRV است که با سطح پایه شما مقایسه می شود (بنابراین می دانید چه زمانی بدن شما تحت استرس بیشتر یا کمتر از حد معمول است). به نظر می رسد که امتیاز آمادگی به این خوانش ها بستگی دارد، بنابراین برای دریافت این امتیاز به یکی از ساعت های جدید نیاز خواهید داشت. برنامه Health ارتقا یافته به آیفون 15 پرو یا جدیدتر نیاز دارد. اخیراً در مورد تغییراتی که اپل برای برنامه جدید Health در نظر گرفته است نوشتم و"}, {"source": "Lifehacker", "title": "This Bissell Pet Carpet Cleaner Is $50 Off Right Now", "link": "https://lifehacker.com/ad/home/this-bissell-pet-carpet-cleaner-deal-september-2026?utm_medium=RSS", "summary": "Deal pricing and availability subject to change after time of publication. One of my biggest issues since adopting my dog has been dealing with carpet messes (bad dog!). A pet carpet cleaner like the Bissell Revolution Hydrosteam would've saved me a lot of stress. Right now, you can get this steam vapor cleaner for $349.99 (originally $399.99) directly from the Bissell website. You also get an additional 10% off if you provide your email on the product page. This wired carpet cleaner is designed for pet owners, but it also removes most common human stains on carpets, like food or outdoor debris. If you have a lot of rugs or a home with carpet, it can be a useful tool to have at your disposal. This carpet cleaner uses Bissell's \"HydroSteam Technology,\" a heater and fluid delivery system that combines steam vapor, water, and soap. It penetrates deep into carpet fibers to remove stains, debris, and dander allergens. There is a Quick Dry Mode that dries your carpets and upholstery in 30 minutes. The cleaner comes with attachments for more precise cleaning, including the pet upholstery tool, designed for wet and dry messes, and a six-inch tool designed for furniture and stairs. The cord is 25 feet long, and the hose is eight feet long. You can fit up to a gallon of water in the tank at a time, and the cleaner weighs a bit over 22 pounds, so it's still not too heavy to cart up and down stairs or wherever your pet's mess may be. You don't strictly need pets to make good use of this carpet steamer I've heard kids can be incredibly messy, too and it's definitely a lot more cost-effective than paying for professional carpet cleaning, especially at the current $50 plus 10% off discount.", "date_str": "2026-09-10T19:30:00+00:00", "hash": "36a3c6c857a37a35", "title_fa": "این فرش شوی حیوانات خانگی بیسل در حال حاضر 50 دلار تخفیف دارد", "summary_fa": "قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. یکی از بزرگترین مشکلات من از زمان به فرزندخواندگی سگم، برخورد با قالیشویی (سگ بد!) است. یک فرش‌شوی حیوانات خانگی مانند هیدرواستیم Bissell Revolution می‌تواند استرس زیادی را از من دور کند. در حال حاضر، می توانید این بخارشوی بخار را با قیمت 349.99 دلار (در اصل 399.99 دلار) مستقیماً از وب سایت Bissell تهیه کنید. همچنین در صورت ارائه ایمیل خود در صفحه محصول، 10٪ تخفیف اضافی دریافت خواهید کرد. این قالیشویی سیمی برای صاحبان حیوانات خانگی طراحی شده است، اما لکه های معمولی انسان روی فرش ها مانند غذا یا زباله های بیرون را نیز از بین می برد. اگر تعداد زیادی فرش یا خانه ای با فرش دارید، می تواند ابزار مفیدی باشد که در اختیار دارید. این قالیشویی از فناوری «هیدرو استیم» بیسل استفاده می‌کند، یک بخاری و سیستم انتقال مایع که بخار بخار، آب و صابون را با هم ترکیب می‌کند. به اعماق الیاف فرش نفوذ می‌کند تا لکه‌ها، زباله‌ها و مواد حساسیت‌زای شوره را از بین ببرد. یک حالت خشک کردن سریع وجود دارد که فرش و اثاثه داخلی شما را در 30 دقیقه خشک می کند. این پاک کننده دارای ضمیمه هایی برای تمیز کردن دقیق تر است، از جمله ابزار اثاثه یا لوازم داخلی حیوانات خانگی، طراحی شده برای آشفتگی های مرطوب و خشک، و یک ابزار شش اینچی طراحی شده برای مبلمان و پله ها. طول سیم 25 فوت و طول شلنگ هشت فوت است. می‌توانید هر بار تا یک گالن آب را در مخزن قرار دهید، و وزن پاک‌کننده کمی بیش از 22 پوند است، بنابراین برای بالا و پایین رفتن از پله‌ها یا هر کجا که حیوان خانگی شما ممکن است مشکلش باشد، هنوز خیلی سنگین نیست. برای استفاده خوب از این بخارشوی فرش نیازی"}, {"source": "Lifehacker", "title": "Six Ways the iPhone Duo Has an Edge Over Android Foldables", "link": "https://lifehacker.com/tech/six-ways-the-iphone-duo-edges-out-android-foldables?utm_medium=RSS", "summary": "I've followed the foldable smartphone space for seven years now, but I ve still never wanted to buy one. But the iPhone Duo is making me doubt my convictions, and not just because I m an iPhone user. Until now, foldable smartphones felt like a work in progress to me, requiring a sacrifice or two (or three) with either the hardware or the software. But with the launch of the iPhone Duo, it feels like this everything is finally coming together. Apple's hardware and the software appear to be working hand in hand to provide a seamless, and even fun, foldable experience. It still feels like choosing the Duo instead carries its own share of compromises missing Face ID, no telephoto lens, and the lack of an Action button) but what the new device brings to the table might make up for all of that. The screen opening animation is peak Apple design Credit: Apple It s a trick, but it s surprising no one thought of this before. When you open the iPhone Duo, the cover screen performs a blurred animation that seamlessly continues to the inner screen. What s on the cover screen appears on the right side of the inner screen. The interface also adapts to the hinge and the degree of folding. Make it a tent, and it shows the Stand By widgets. When watching media, you can prop it up like a laptop, and the interface splits in two as well, with the top half showing the media, and controls on the bottom half (assuming the app has been optimized to do so, anyway). If you re playing a game or watching a movie on the inner screen, closing the Duo will switch the content to the cover screen, with the animation, and without skipping a beat . This is the kind of seamless device/software integration that's tough for Android devices to compete with. A matte inner screen that appears to be creaseless (almost) Credit: Apple Apple is late to the foldable party, but at least it has caught up in the screen and hinge tech. Of course, we won t know exactly how creaseless it is until we can all get our hands on the iPhone Duo, but based on the coverage so far, it is at least fairly creaseless. In day-to-day use, you might not even notice it. More interesting is the inner display tech: Apple is bringing a version of the nano-texture display from the MacBook Pro line to this device. The matte display fights reflections, but it also hides the crease something that s harder to do with the glossy panels sported by Android foldables. The iOS 27 adapts like Android doesn t Credit: Apple As noted, the r", "date_str": "2026-09-10T19:00:00+00:00", "hash": "ede24d196e6add4e", "title_fa": "شش راه که iPhone Duo نسبت به تاشوهای اندرویدی برتری دارد", "summary_fa": "اکنون هفت سال است که فضای گوشی‌های هوشمند تاشو را دنبال می‌کنم، اما هنوز نمی‌خواهم یکی از آن‌ها را بخرم. اما iPhone Duo باعث می‌شود من به اعتقاداتم شک کنم، و نه فقط به این دلیل که کاربر آیفون هستم. تا پیش از این، گوشی‌های هوشمند تاشو برای من مانند یک کار در حال پیشرفت به نظر می‌رسیدند و نیاز به یک یا دو (یا سه) فداکاری با سخت‌افزار یا نرم‌افزار داشتند. اما با عرضه آیفون Duo، به نظر می رسد که بالاخره همه چیز در حال جمع شدن است. به نظر می رسد سخت افزار و نرم افزار اپل دست به دست هم داده اند تا تجربه ای یکپارچه و حتی سرگرم کننده تاشو ارائه دهند. هنوز هم به نظر می‌رسد که انتخاب Duo به‌جای آن سهم خود را در مواردی دارد که Face ID، لنز تله فوتو و فقدان دکمه Action وجود ندارد) اما آنچه که دستگاه جدید روی میز ارائه می‌کند ممکن است همه این موارد را جبران کند. انیمیشن باز شدن صفحه نمایش اوج طراحی اپل است اعتبار: اپل این یک ترفند است، اما تعجب آور است که هیچکس قبلاً به این موضوع فکر نکرده بود. هنگامی که iPhone Duo را باز می‌کنید، صفحه روی جلد یک انیمیشن تار ایجاد می‌کند که یکپارچه به صفحه داخلی ادامه می‌یابد. آنچه روی صفحه جلد است در سمت راست صفحه داخلی ظاهر می شود. رابط همچنین با لولا و درجه تا شدن سازگار است. آن را چادر کنید و ویجت های Stand By را نشان می دهد. هنگام تماشای رسانه، می‌توانید آن را مانند یک لپ‌تاپ نگه دارید، و رابط نیز به دو قسمت تقسیم می‌شود، و نیمه بالایی رسانه را نشان می‌دهد و کنترل‌ها در نیمه پایینی (با فرض اینکه برنامه برای این کار بهینه‌سازی شده باشد، به هر حال). اگر در حال انجام یک بازی یا تماشای"}, {"source": "Lifehacker", "title": "12 of the Best iPhone 18 Pro Features That Are Missing From the Foldable Duo", "link": "https://lifehacker.com/tech/iphone-18-pro-features-missing-from-iphone-duo?utm_medium=RSS", "summary": "The iPhone Duo is both the most exciting (and expensive ) product from Apple's September hardware event . The Duo is Apple's first foldable, equipped with new features not present in the company's other iPhones. On the flip side, designing a foldable smartphone comes with a bunch of compromises, which means that the iPhone Duo misses out on a lot of features when compared with the iPhone 18 Pro and the 18 Pro Max . Yes, even if you pay $1,999 (going all the way up to $3,199 for the 2TB variant) for an iPhone Duo, you won't be getting all the best new iPhone features this year. Here's every feature that the iPhone Duo misses out on. The iPhone Duo doesn't have an Action button Unlike the iPhone 18 Pro series (or any iPhone since the 15), the foldable iPhone doesn't get a programmable Action button. It doesn't even have a mute switch, which means that its only buttons are for volume control and power. The Action button can be mapped to simple tasks such as taking screenshots, or more complex automations of your choice , and it'll be missed on the foldable iPhone. The iPhone Duo's selfie camera isn't as good as the iPhone 18 Pro The iPhone Duo ships with a 12-megapixel Center Stage camera on the outer display, which is a lower-resolution sensor than the one on the iPhone 18 Pro and 18 Pro Max. The two 18 Pro series phones ship with an 18-megapixel Center Stage camera for selfies. The iPhone Duo also has an under-display front camera, and since Apple hasn't disclosed its megapixel count, it's safe to say it's also less than the 18 Pros. However, by its nature, the Duo has an interesting advantage here: If you're taking selfies with the device unfolded, you get to use the far superior \"rear\" camera sensor, as the front display becomes your viewfinder. Anyone using the Duo for selfies this way will shoot better pictures than those using the front camera on an iPhone 18 Pro. The iPhone Duo's rear cameras have fixed apertures Variable aperture is one of the best new camera features of the iPhone 18 Pro series . The primary rear camera lets you control aperture, which opens up the possibility for better quality photos, enhanced depth of field effects, and more creative control over your photography. Unfortunately, the iPhone Duo misses out on this feature. Pro Controls aren't coming to the iPhone Duo By now the trend is pretty clear: iPhone Duo misses out on a slew of camera features. For the iPhone 18 Pro series, Apple announced \"Pro Controls\" for the Camera app, ", "date_str": "2026-09-10T18:00:00+00:00", "hash": "b3f0ab4d19d7d97e", "title_fa": "12 مورد از بهترین ویژگی های آیفون 18 پرو که در دو تاشو وجود ندارد", "summary_fa": "iPhone Duo هم هیجان‌انگیزترین (و هم گران‌ترین) محصول رویداد سخت‌افزاری اپل در سپتامبر است. Duo اولین گوشی تاشو اپل است که به ویژگی های جدیدی مجهز شده است که در سایر آیفون های این شرکت وجود ندارد. از طرف دیگر، طراحی یک گوشی هوشمند تاشو با مجموعه ای از مصالحه همراه است، به این معنی که iPhone Duo در مقایسه با iPhone 18 Pro و 18 Pro Max، بسیاری از ویژگی ها را از دست می دهد. بله، حتی اگر 1999 دلار (تا 3199 دلار برای نوع 2 ترابایتی) برای iPhone Duo بپردازید، امسال بهترین ویژگی های جدید آیفون را دریافت نخواهید کرد. در اینجا همه ویژگی هایی که iPhone Duo از دست می دهد وجود دارد. آیفون Duo دکمه Action ندارد برخلاف سری آیفون 18 پرو (یا هر آیفونی از سال 15)، آیفون تاشو دکمه اکشن قابل برنامه ریزی را دریافت نمی کند. حتی سوئیچ قطع صدا ندارد، یعنی تنها دکمه های آن برای کنترل صدا و پاور است. دکمه Action را می توان به کارهای ساده ای مانند گرفتن اسکرین شات، یا اتوماسیون های پیچیده تر انتخابی شما نگاشت و در آیفون تاشو از قلم افتاد. دوربین سلفی iPhone Duo به خوبی iPhone 18 Pro نیست iPhone Duo با یک دوربین 12 مگاپیکسلی مرکز استیج بر روی صفحه نمایش بیرونی عرضه می شود که نسبت به آیفون 18 پرو و ​​18 پرو مکس، حسگر وضوح پایین تری دارد. دو گوشی سری 18 پرو با دوربین 18 مگاپیکسلی مرکز استیج برای سلفی عرضه می شوند. iPhone Duo همچنین دارای یک دوربین جلوی زیر نمایشگر است و از آنجایی که اپل تعداد مگاپیکسل آن را فاش نکرده است، می توان گفت که از 18 Pro نیز کمتر است. با این حال، به دلیل ماهیت خود، Duo در اینجا یک مزیت جالب دارد: اگر با دستگاه باز شده سلفی می گیرید،"}, {"source": "Lifehacker", "title": "10 Shows Like 'My Brilliant Career' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-my-brilliant-career?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Are we in a golden age for TV historical dramas? Once mostly limited to Sunday-night BBC imports on PBS, streaming has opened the doors for these journeys into the past, recent or otherwise. They're not all particularly faithful to historical fact (not a requirement), but each has the virtue of offering a brief escape from an increasingly obnoxious present. One of the most recent successes is Netflix's My Brilliant Career , an adaptation of the seminal 1901 coming-of-age novel by author Miles Franklin. And once you've visited early 19th-century Australia with Sybylla Melvyn, you may well enjoy these 10 other stories of young women who'd just as soon you didn't try to tell them how to live their lives. The Other Bennet Sister (2026 ) A bit of a ratings blockbuster on the BBC, this miniseries revisits the events of Pride and Prejudice from the perspective of Lizzy Bennet's bookish, altogether dorkier sister Mary. Her ruddy complexion, penchant for grammatical correctness, and (gasp!) spectacles seem to make Mary entirely unsuitable for marriage and unfit for much other than genteel spinsterhood. That begins to change when Mary sets off to become a governess for the Gardiner family in London and manages to forge a life and a future for herself away from the parents and siblings who see her as not much more than a piece of furniture. Though in a different time and on a different continent, Sybella and Mary are similarly clever and forthright young women doing their best to find their place, expectations be damned. Stream The Other Bennet Sister on Britbox . The Other Bennet Sister (2026 ) at Apple TV Learn More Learn More at Apple TV Little Women (2017) Jo March is a young woman from a poor family who harbors both writerly ambitions and the talent to make her dreams come true if only people can tolerate the independence of a young woman. She's also possessed of an elderly relative with the money to either help or hinder her. Any of this sounding familiar? Though overshadowed by the (excellent) Greta Gerwig film version's arrival two years later, this BBC adaptation is a bit more faithful to the text without ever feeling stuffy. Set in a Civil War-era New England in which women have largely been left behind by the men in their lives, the miniseries format does a fine job of capturing the passage of time that is so critical to the story. Maya Hawke ( Stranger Things ) is Jo, Emily Watson plays the stolid Marmee w", "date_str": "2026-09-10T16:30:00+00:00", "hash": "5df44492dfca797c", "title_fa": "10 نمایشی مانند «حرفه درخشان من» که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. آیا ما در دوران طلایی درام های تاریخی تلویزیونی هستیم؟ زمانی که عمدتاً به واردات یکشنبه شب بی بی سی در PBS محدود می شد، پخش جریانی درهای این سفرها را به گذشته، اخیراً یا موارد دیگر، باز کرده است. همه آنها به طور خاص به واقعیت تاریخی وفادار نیستند (نه یک الزام)، اما هر کدام از این فضیلت برخوردارند که یک فرار کوتاه از یک زمان فزاینده نفرت انگیز ارائه می دهند. یکی از جدیدترین موفقیت‌ها، کارنامه درخشان من نتفلیکس است که اقتباسی از رمان مهم سال ۱۹۰۱ نوشته مایلز فرانکلین نویسنده است. و هنگامی که با Sybylla Melvyn از استرالیا اوایل قرن نوزدهم بازدید کردید، ممکن است از این 10 داستان دیگر از زنان جوانی لذت ببرید که به محض اینکه سعی نکردید به آنها بگویید چگونه زندگی کنند. The Other Bennet Sister (2026) این مینی سریال که کمی پرفروش در بی‌بی‌سی است، وقایع غرور و تعصب را از منظر خواهر کتاب‌خواه و کاملاً پرخاشگر لیزی بنت، مری، مرور می‌کند. به نظر می رسد که رنگ قرمز، میل به درستی دستوری و (نفس!) عینک، مری را برای ازدواج کاملاً نامناسب و برای چیزهای دیگری غیر از جنون نجیبانه نامناسب می کند. زمانی که مری تصمیم می گیرد تا یک فرماندار خانواده گاردینر در لندن شود، شروع به تغییر می کند و موفق می شود زندگی و آینده ای را به دور از والدین و خواهر و برادرهایی که او را چیزی بیش از یک اثاثیه نمی بینند، برای خود رقم بزند. اگرچه در زمانی متفاوت و در قاره ای متفاوت، سیبلا و مری به طور مشابه زنان جوان باهوش و صریحی هستند که تمام تلاش خود را می کنند تا جایگاه خود را پیدا کنند، اما انتظارات از بین می رود. The Other Bennet Sister را در"}, {"source": "Lifehacker", "title": "Here's Why You Should Care About the iPhone 18 Pro's 'Vapor Chambers'", "link": "https://lifehacker.com/tech/what-are-vapor-chambers-and-why-you-should-care-if-your-phone-has-one?utm_medium=RSS", "summary": "During Apple s big hardware announcement on Wednesday , the company placed a particular emphasis on the vapor chamber in the new iPhone 18 Pro and Pro Max . The glossed-over explanation is that these new vapor chambers can improve performance and reduce heat generation. But how exactly? And what does that mean for the phones you re planning to buy? How vapor chambers work On a very simple level, vapor chambers work similarly to liquid cooling in other electronics systems like some desktop PCs or server racks. The goal is to carry heat away from the processor to keep it cool, so it can do more work without overheating. A cooler processor is a more efficient processor, which means it runs better. Except, unlike a PC or server rack, a phone is a tight, compact system. There s not enough space to heat water and then pump it away to a different location to cool it down. Instead, a vapor chamber is a thin, hollow chamber, typically made of either copper or stainless steel, with a small amount of liquid inside. When the liquid inside heats up, it becomes a gas, which then expands outwards, dispersing the heat throughout the body of your phone, rather than keeping it all close to the processor. As it gets further away from the source of heat, the vapor cools back down and becomes a liquid again. Since the chamber is sealed, the liquid can t evaporate and escape, meaning that the fluid can theoretically keep cycling through the chamber indefinitely for the life of the phone. Most manufacturers also pair this with some form of heat sink, like thin sheets of graphite or copper. Or, in the case of the new iPhone 18 Pro, both. Why vapor chambers matter for smartphones Keeping your phone cool is a massive problem compared to other electronic devices you might have, simply because they re so small, yet so powerful. A moderately powered laptop like a MacBook Air can get away with a combination of conductive heat sinks, a metal frame, and low heat-generating processors to stay functional, while high-powered gaming laptops have space to stuff in large, laborious fans. Your phone, however, needs to fit in your pocket, and a huge chunk of the space inside needs to be devoted to the battery to make sure it lasts long enough to get through the day. Once you account for all the processors, sensors, and antennas that a phone needs, there s scarcely any space left for heat dissipation. That s a huge part of why phones generally don t have as powerful processors as tablets or lapto", "date_str": "2026-09-10T15:00:00+00:00", "hash": "c30b7bba7581273a", "title_fa": "چرا باید به اتاق بخار آیفون 18 پرو اهمیت دهید", "summary_fa": "در طی اعلامیه سخت افزاری بزرگ اپل در روز چهارشنبه، این شرکت تاکید خاصی بر اتاق بخار در آیفون 18 پرو و ​​پرو مکس جدید داشت. توضیح واضح این است که این اتاقک های بخار جدید می توانند عملکرد را بهبود بخشند و تولید گرما را کاهش دهند. اما دقیقا چگونه؟ و این برای تلفن هایی که قصد خرید آن را دارید چه معنایی دارد؟ نحوه کار محفظه های بخار در یک سطح بسیار ساده، اتاق های بخار مشابه خنک کننده مایع در سایر سیستم های الکترونیکی مانند برخی از رایانه های شخصی رومیزی یا قفسه های سرور کار می کنند. هدف این است که گرما را از پردازنده دور کند تا خنک بماند تا بتواند کارهای بیشتری را بدون گرم شدن بیش از حد انجام دهد. یک پردازنده سردتر پردازنده کارآمدتری است، به این معنی که عملکرد بهتری دارد. به جز، برخلاف رایانه شخصی یا رک سرور، تلفن یک سیستم فشرده و فشرده است. فضای کافی برای گرم کردن آب و سپس پمپ کردن آن به مکان دیگری برای خنک کردن آن وجود ندارد. در عوض، یک محفظه بخار یک محفظه نازک و توخالی است که معمولاً از مس یا فولاد ضد زنگ ساخته می شود و مقدار کمی مایع درون آن قرار دارد. هنگامی که مایع داخل آن گرم می شود، تبدیل به گاز می شود که سپس به سمت بیرون منبسط می شود و گرما را در سراسر بدنه گوشی شما پخش می کند، نه اینکه همه آن را نزدیک پردازنده نگه دارد. وقتی از منبع گرما دورتر می شود، بخار دوباره خنک می شود و دوباره به مایع تبدیل می شود. از آنجایی که محفظه مهر و موم شده است، مایع نمی تواند تبخیر شود و از آن خارج شود، به این معنی که از نظر تئوری، مایع می تواند به طور نامحدود در داخل محفظه"}],
      media: [{"source": "Billboard", "title": "Kehlani & Monaleo Speak on Balancing Music and Motherhood at Billboard House", "link": "https://www.billboard.com/music/rb-hip-hop/kehlani-monaleo-speak-balancing-music-motherhood-1236338165/", "summary": "Closing the Billboard House summit during Billboard ’s 2026 R B/Hip-Hop Power Players celebration was the Like Minded panel on Wednesday (Sept. 9) presented by BetterHelp. Featuring Grammy-winning singer Kehlani and rising rapper Monaleo — also both mothers — the conversation focused on motherhood, identity and caring for yourself while caring for others. Moderating on behalf of BetterHelp were Sonni Williams, a licensed professional counselor specializing in perinatal mental health, and Gail Mitchell, Billboard ’s Editor at Large, R B/Hip-Hop. Kehlani and Monaleo insightfully answered five questions about balancing their professional and family lives. Here are some soundbites: What truth about motherhood do you wish women were given permission to admit — without having their love for their children questioned? Kehlani: Being able to admit that it s hard … a nuanced hard in having to find the time and space to have your own identity, especially when you re a young mom and like go out with your homegirls and wild out sometimes — and not make you question if you re the kind of mom you should be. Obviously, we re working moms so we already deal with that battle internally. We want to spend more time; want things to be ideal, but they just aren t. Monaleo: Also, it’s about just coming to the realization that you re going to make mistakes. Everybody wants to feel like they re the perfect mother. [But] it’s okay to admit that you re going to drop the ball sometimes. That humanizes our experience because there s a lot of pressure put on moms to be superwomen. I try to live up to that as much as I can, and I find myself really stretched. But I have the opportunity to do better moving forward and just continue showing up for my child the best way that I can. How has motherhood impacted your craft? Monaleo: It’s made me way more intentional. You should be intentional in general, not just because you have a child that will grow up to listen to your music. Before you have children, there s this sense of nonchalantness about life that’s beautiful to have. But when you have a child, the s t gets real serious real quick: What s he listening to? I m not everybody s parent. But I understand that we have people who tune into our music. So I try to sneak the medicine into the candy sometimes. Yes, it’s a bop, but from time to time you re going to get a little education about Black history or whatever it is that I put in my music. I’m going to walk you through something, and ", "date_str": "2026-09-11T13:54:03+00:00", "hash": "7c31409c21467138", "title_fa": "کهلانی و مونالئو درباره تعادل موسیقی و مادری در خانه بیلبورد صحبت می کنند", "summary_fa": "اختتامیه نشست Billboard House در جشن بیلبورد 2026 R B/Hip-Hop Power Players پانل Like Minded در چهارشنبه (9 سپتامبر) بود که توسط BetterHelp ارائه شد. با حضور خواننده برنده گرمی کهلانی و خواننده رپ در حال ظهور Monaleo - که هر دو هم مادر بودند - این گفتگو بر مادری، هویت و مراقبت از خود و در عین حال مراقبت از دیگران متمرکز بود. از طرف BetterHelp، Sonni Williams، یک مشاور حرفه‌ای دارای مجوز متخصص در سلامت روان پری ناتال، و Gail Mitchell، ویرایشگر Billboard در Large، R B/Hip-Hop، تعدیل شدند. کهلانی و مونالئو به پنج سوال درباره ایجاد تعادل بین زندگی حرفه ای و خانوادگی خود پاسخ دادند. در اینجا برخی از صداها وجود دارد: دوست دارید به زنان اجازه اعتراف به چه حقیقتی در مورد مادری داده شود - بدون اینکه عشق آنها به فرزندانشان زیر سوال رود؟ کهلانی: اینکه بتوانید اعتراف کنید که سخت است ... در یافتن زمان و مکان برای داشتن هویت خود سخت است، به خصوص زمانی که شما یک مادر جوان هستید و دوست دارید با دختران خانه خود بیرون بروید و گاهی اوقات بیرون بروید - و باعث نمی شود شما بپرسید که آیا آن نوع مادری هستید که باید باشید. بدیهی است که ما مادران شاغل هستیم، بنابراین از قبل با آن نبرد در داخل سروکار داریم. ما می خواهیم زمان بیشتری را صرف کنیم. می‌خواهند همه چیز ایده‌آل باشد، اما آن‌ها اینطور نیستند. مونالئو: همچنین، این فقط به این است که متوجه شوید که اشتباه خواهید کرد. همه می خواهند احساس کنند که مادر کاملی هستند. [اما] بد نیست اعتراف کنید که گاهی توپ را رها می کنید. این تجربه ما را انسانی می کند زیرا فشار زیادی بر مادران وارد می شود تا ابرزن باشند. من سعی می‌کنم تا جایی که می‌توانم به آن عمل کنم، و خودم را"}, {"source": "Billboard", "title": "B2K’s Raz-B and Wife Mourn Passing of Infant Son Astro Monte Thornton: ‘They Truly Appreciate Your Love and Support’", "link": "https://www.billboard.com/music/rb-hip-hop/b2k-raz-b-wife-mourn-passing-infant-son-astro-monte-thornton-1236338150/", "summary": "B2K singer De Mario Raz-B Thornton and wife Mona Li Thornton announced the unexpected passing of their three-month-old son on Thursday (Sept. 10). In a statement to USA Today , a spokesperson for the 41-year-old singer confirmed that son Astro Monte Thornton died of undisclosed causes. It is with heavy hearts that we announce the unexpected passing of Astro Monte Thornton, beloved son of Mona and De’Mario Raz B Thornton of the R B supergroup B2K, read the statement. The family asks for privacy as they navigate this difficult time. They truly appreciate your love and support. The couple share an older child, son Versai Carter Thornton, who was born in October 2024. Raz-B celebrated the birth of Astro in an Instagram post on May 18 just before the baby s birth in which the Thornton s posed in white shirts and jeans with Versai and Mona s older daughter from a previous relationship. I always wanted to take a real family picture with my own family… and finally, God made a way 🙏🏾❤️, wrote Raz at the time. Right now we’re at the hospital getting ready to welcome our newest addition, Astro 🚀👶🏾 another baby boy to the Thornton family. Big congratulations to my beautiful wife for being so strong through this journey. Watching you become a mother again is one of the greatest blessings I could ever witness. The Thornton family continues to grow… and our legacy does too. The post also featured a pic of the singer standing next to his wife as he cradled her pregnant belly. A week later, a post shared to son Versai s Insta confirmed the baby s birth in an Instagram post, with the message, Best week ever 🥹💙✨ We welcomed my new baby brother Astro into the family, and it already feels amazing being a big brother 🫶🏽👶🏽. The Bump, Bump, Bump boy band made up of Omarion, Raz, J-Boog and Lil Fizz released their fourth studio album, Eclipse , earlier this year and they are in the midst of their Boys 4 Life tour, which is slated to go overseas for a trio of shows in England in December in Birmingham (Dec. 10), Manchester (Dec. 12) and London (Dec. 13).", "date_str": "2026-09-11T13:19:24+00:00", "hash": "4308e65ac247c7ed", "title_fa": "Raz-B و همسر B2K در سوگ درگذشت پسر شیرخوار Astro Monte Thornton: \"آنها واقعاً از عشق و حمایت شما قدردانی می کنند\"", "summary_fa": "De Mario Raz-B Thornton خواننده B2K و همسرش Mona Li Thornton در روز پنجشنبه (10 سپتامبر) خبر درگذشت غیرمنتظره پسر سه ماهه خود را دادند. سخنگوی این خواننده 41 ساله در بیانیه ای به USA Today تایید کرد که پسرش آسترو مونته تورنتون به دلایل نامعلومی درگذشت. با دلی سنگین است که خبر درگذشت غیرمنتظره Astro Monte Thornton، پسر محبوب مونا و De’Mario Raz B Thornton از سوپرگروه R B B2K را می دهیم. خانواده در حین عبور از این زمان دشوار از حریم خصوصی درخواست می کنند. آنها واقعاً از محبت و حمایت شما قدردانی می کنند. این زوج یک فرزند بزرگتر به نام ورسای کارتر تورنتون دارند که در اکتبر 2024 به دنیا آمد. Raz-B در 18 مه در پستی اینستاگرامی درست قبل از تولد نوزاد تولد Astro را جشن گرفت که در آن تورنتون با پیراهن و شلوار جین سفید با دختر بزرگتر ورسای و مونا از رابطه قبلی ژست گرفت. من همیشه دوست داشتم با خانواده خودم یک عکس خانوادگی واقعی بگیرم... و بالاخره خدا راهی درست کرد 🙏🏾❤️ راز آن زمان نوشت. در حال حاضر در بیمارستان هستیم و آماده استقبال از جدیدترین اضافه خود، Astro 🚀👶🏾 پسر دیگری به خانواده تورنتون هستیم. تبریک بزرگ به همسر زیبایم که در این سفر بسیار قوی بود. تماشای دوباره مادر شدنت یکی از بزرگترین موهبت هایی است که می توانم شاهد آن باشم. خانواده تورنتون همچنان در حال رشد است... و میراث ما نیز رشد می کند. در این پست همچنین عکسی از این خواننده منتشر شد که در کنار همسرش ایستاده بود و شکم باردار او را در آغوش می گرفت. یک هفته بعد، پستی به اشتراک گذاشته شده در پسرش ورسای اینستا، تولد نوزاد را در یک پست اینستاگرامی تایید کرد، با این پیام، بهترین هفته تا به حال گروه پسر Bump, Bump, Bump متشکل"}, {"source": "Billboard", "title": "A-Listers In Paris: Jay-Z Joined By Justin Timberlake and Pharrell at Stade de France Show: Watch", "link": "https://www.billboard.com/music/music-news/jay-z-joined-justin-timberlake-pharrell-paris-show-1236338133/", "summary": "Surely you didn t think Jay-Z was going to come empty-handed to his sold-out show at Stade de France in Paris on Thursday night (Sept. 10)? The latest show in the Jay-Z30 run of gigs celebrating the 30th anniversary of the rapper s Reasonable Doubt debut LP was cranked up several notches when Jigga was joined by his Magna Carta Holy Grail collaborator Justin Timberlake . JT popped out to raucous applause for a run through that album s Billboard Hot 100 No. 4 hit Holy Grail, with Roc Nation posting a video featuring the duo s dramatic backlit entrance to the stage, as well as a series of snaps from the performance, which found Timberlake dressed in jeans with a checkerboard bandana hanging from a back pocket, a black shirt under a black leather jacket, ball cap and dark shades. Timberlake also posted some snaps from the surprise cameo, as well as video of him crooning the keening chorus to Holy Grail, before the beat drops and the two men begin bouncing around in unison; check out some fan video of the moment here . Timberlake also stuck around to perform his own FutureSex/LoveSounds ballad Until the End of Time , a duet with Beyoncé that was featured on that 2006 album s deluxe edition and which turned into a full stadium sing-along. Another one of Jay s frequent collaborators, Pharrell Williams , also made the trip, hitting the stage to perform Just Wanna Love U (Give It 2 Me), Frontin and Excuse Me Miss . Pharrell, dressed in a light wash jean , a red bomber jacket and a backward leather baseball cap, also stuck around for a run through Allure from 2003 s The Black Album , which ended with Skateboard P singing a bit of the French national anthem a cappella. It s been a summer of celebration for Jay, who earlier honored the anniversary of his debut and the 25th anniversary of The Blueprint album with a legendary three-night July run at Yankee Stadium in New York that featured an embarrassment of riches , including cameos from wife Beyoncé and daughter Blue Ivy, Nas, Memphis Bleek, early inspiration Jaz-O, Alicia Keys, Eminem, Pharrell, Slick Rick, Teyana Taylor, Jermaine Dupri, Jeezy, Usher, The-Dream, Rihanna, Swizz Beatz, Clipse and Fat Joe Jadakiss. Earlier this month, Jay touched down at London s Tottenham Hotspur Stadium for a double-down that featured guests actor Idris Elba, as well as the Fugees Lauryn Hill and Wyclef, Sampha and Dave. The party will roll on at SoFi Stadium in Los Angeles on Oct. 23 and 24. rel= noopener noreferrer", "date_str": "2026-09-11T12:47:12+00:00", "hash": "31b360afa1e09469", "title_fa": "A-Listers In Paris: Jay-Z به همراه جاستین تیمبرلیک و فارل در نمایشگاه Stade de France: تماشا کنید", "summary_fa": "مطمئناً فکر نمی کردید که جی زی قرار است پنج شنبه شب (10 سپتامبر) با دست خالی به نمایش فروخته شده اش در استاددو فرانس پاریس بیاید؟ آخرین نمایش از کنسرت‌های Jay-Z30 که سی‌امین سالگرد اولین آلبوم رپر با نام Reasonable Doubt را جشن می‌گرفت، زمانی که جیگا توسط جاستین تیمبرلیک، همکار جام مقدس مگنا کارتا به او ملحق شد، چندین درجه افزایش یافت. JT با تشویق شدید برای اجرای آلبوم بیلبورد Hot 100 No. 4 ضربه جام مقدس، با Roc Nation ویدیویی را منتشر کرد که شامل ورودی دراماتیک این دو به صحنه است، و همچنین یک سری عکس از اجرا، که تیمبرلیک را با شلوار جین پوشیده با یک نوار شطرنجی آویزان از جیب عقب، یک پیراهن مشکی زیر یک ژاکت چرمی مشکی، کلاه توپی و ژاکت تیره مشاهده کرد. تیمبرلیک همچنین چند عکس از صحنه غافلگیرکننده و همچنین ویدیویی از او در حال زمزمه کردن گروه کر مشتاقانه به جام مقدس، قبل از اینکه ضربات آن پایین بیاید و دو مرد به صورت هماهنگ به اطراف بپرند، منتشر کرد. چند ویدیوی طرفداران از لحظه را اینجا ببینید. تیمبرلیک همچنین برای اجرای تصنیف FutureSex/LoveSounds خودش، Until the End of Time، دونوازی با بیانسه که در نسخه لوکس آلبوم سال 2006 به نمایش درآمد و تبدیل به یک استادیوم کامل آواز خواندن شد، ادامه داد. یکی دیگر از همکاران مکرر جی، فارل ویلیامز، نیز این سفر را انجام داد و برای اجرای Just Wanna Love U (Give It 2 ​​Me)، Frontin و Excuse Me Miss روی صحنه رفت. فارل، با پوشیدن یک شلوار جین روشن، یک ژاکت بمب افکن قرمز و یک کلاه بیسبال چرمی عقب مانده، برای دویدن در Allure از آلبوم Black در سال 2003، که با اسکیت بورد P با خواندن سرود ملی فرانسه a cappella به پایان رسید، گیر کرد. این تابستان جشنی برای جی"}, {"source": "Billboard", "title": "Remembering 9/11, 25 Years Later: Songs From Alan Jackson, Toby Keith & Others That Helped Us Grieve", "link": "https://www.billboard.com/lists/9-11-songs-list-september-11-music/", "summary": "Twenty-five years ago, hijacked planes crashed into New York’s World Trade Center Towers, the Pentagon outside Washington, D.C., and a Pennsylvania field on Sept. 11, 2001, leaving 2,977 people murdered and nearly 6,000 more wounded in the worst terrorist attack on American soil in history. Americans reacted with a myriad of emotions — shock, horror, anger, sorrow and fear — but many also rallied together in unity and a show of support for the American military and each other. Related Lainey Wilson and Five For Fighting s John Ondrasik to Perform on 9/11 Tribute in Light: Live From Lower Manhattan Special Country music artists were among the first to put that range of complex emotions into song. Two country releases in particular seemed to capture the yin and yang of American reactions to the tragedy: While Toby Keith ‘s “Courtesy of the Red, White Blue (The Angry American)” seethed with righteous anger and intense patriotism with lines like “We’ll put a boot in your a–- it’s the American way,” Alan Jackson’ s “Where Were You (When the World Stopped Turning)” focused on those who reacted in quieter ways, with lines such as “Did you go to a church and hold hands with some strangers/ Stand in line and give your own blood?/ Did you just stay home and cling tight to your family/ Thank God you had somebody to love?” Furthermore, songs like Where the Stars and Stripes and the Eagle Fly by Aaron Tippin rendered a new meaning following the tragedy, having written the song more than two years beforehand. Here, Billboard looks back at some of the country songs inspired by “that September day,” as Alan Jackson sang.", "date_str": "2026-09-11T12:00:00+00:00", "hash": "8b86f5e56269bbf9", "title_fa": "یادآوری 11 سپتامبر، 25 سال بعد: آهنگ هایی از آلن جکسون، توبی کیث و دیگران که به ما کمک کردند تا غمگین شویم", "summary_fa": "بیست و پنج سال پیش، هواپیماهای ربوده شده در 11 سپتامبر 2001 به برج های مرکز تجارت جهانی نیویورک، پنتاگون در خارج از واشنگتن دی سی و میدانی در پنسیلوانیا سقوط کردند و در بدترین حمله تروریستی تاریخ آمریکا در خاک آمریکا، 2977 نفر کشته و نزدیک به 6000 نفر زخمی شدند. آمریکایی‌ها با احساسات بی‌شماری واکنش نشان دادند - شوک، وحشت، خشم، اندوه و ترس - اما بسیاری نیز در اتحاد و حمایت از ارتش آمریکا و یکدیگر گرد هم آمدند. Lainey Wilson مرتبط و John Ondrasik از Five For Fighting برای اجرای 9/11 Tribute in Light: Live From Lower Manhattan Special Music هنرمندان از اولین کسانی بودند که این طیف از احساسات پیچیده را در آهنگ به کار بردند. به نظر می‌رسید که به‌ویژه دو نسخه کانتری واکنش‌های یین و یانگ آمریکایی‌ها را به این تراژدی نشان می‌دهند: در حالی که فیلم توبی کیت «با احترام از قرمز، آبی سفید (آمریکایی خشمگین)» غرق در خشم واقعی و میهن‌پرستی شدید با جملاتی مانند «ما چکمه‌ای را در تو می‌گذاریم – این به روش آمریکایی است.» چرخش)» روی کسانی که به شیوه‌های آرام‌تری واکنش نشان می‌دادند، با جملاتی مانند «به کلیسا رفتی و دست در دست چند غریبه گرفتی/ در صف ایستادی و خون خودت را دادی؟/ فقط در خانه ماندی و محکم به خانواده‌ات چسبیدی/ خدا را شکر کسی را داشتی که دوستش داشته باشی؟» علاوه بر این، آهنگ هایی مانند Where the Stars and Stripes and the Eagle Fly اثر آرون تیپین پس از این تراژدی، با نوشتن ترانه بیش از دو سال قبل، معنای جدیدی را ارائه کردند. در اینجا، بیلبورد به برخی از آهنگ‌های کانتری الهام‌گرفته از «آن روز سپتامبر» که آلن جکسون خوانده بود، نگاه می‌کند."}, {"source": "Billboard", "title": "Carín León Apologizes to Fans After Missing Sphere Show Due To Unexpected Travel ‘Mishap’", "link": "https://www.billboard.com/music/latin/carin-leon-apologizes-missing-sphere-show-travel-mishap-1236338128/", "summary": "Carín León told his fans he tried everything he could to make it to his fourth residency show at the Sphere in Las Vegas on Thursday night (Sept. 10), but a series of aircraft malfunctions left him far away from the venue at showtime. In an Instagram Story (translated into English), the singer wrote , Due to an unexpected mishap during my move, and always putting everyone s safety first, we unfortunately have to reschedule tonight s show at Sphere. León assured disappointed fans — who were reportedly in their seats awaiting the start of the show when the news was announced over the arena s sound system — that their tickets will be valid for a new date — Sept. 15, 2027 — and if they can t make it then they can get a refund at the point of purchase in the next 30 days. I know all the effort, excitement, and desire that many brought to be here tonight, and I sincerely apologize for any inconvenience this may cause, he wrote. Thank you for your patience, for understanding and for all the affection you always make me reach. See you the soonest my people. In an accompanying video, he explained that he and his band could not make it to the show due to aircraft malfunctions, describing trying to board two different planes Thursday afternoon, both of which he said had issues that prevented them from taking off, including one with a brake failure and another with a steering issue. “We had to prioritize the safety of the people and the pilots, so we weren’t allowed to fly. The authorities wouldn’t let us,” León said in the video. “I sincerely apologize from the bottom of my heart and want to reaffirm our love for you. This isn’t a lack of commitment on our part. Things simply didn’t go as we had hoped, and I stand here feeling deeply embarrassed.” The venue also posted a statement that read : Due to an unexpected transportation issue, tonight s Carín show at Sphere is postponed. At press time, a spokesperson for León had not returned Billboard s request for further comment on the last-minute show cancellation. A video posted by record_mexico featured what appeared to be footage of disgruntled fans marching and chanting in the lobby and an announcer breaking the bad news to a packed house in both Spanish and English to a round of boos. León, 37, became the first Latin artist to book a residency at the Sphere, kicking off his planned seven-show run last week and announcing earlier in the day on Thursday that he is planning a return in 2027. The next run of shows produc", "date_str": "2026-09-11T11:56:10+00:00", "hash": "681a5e8a6ac30793", "title_fa": "کارین لئون پس از از دست دادن نمایش Sphere به دلیل سفر غیرمنتظره \"مشکل\" از طرفداران عذرخواهی کرد", "summary_fa": "کارین لئون به طرفدارانش گفت که تمام تلاشش را کرده است تا به چهارمین نمایش اقامتی خود در Sphere در لاس وگاس در پنجشنبه شب (10 سپتامبر) برود، اما یک سری نقص هواپیما باعث شد که او در زمان نمایش از محل برگزاری دور باشد. در یک استوری اینستاگرام (ترجمه شده به انگلیسی)، خواننده نوشت: به دلیل یک اتفاق غیرمنتظره در حین جابجایی من، و همیشه امنیت همه را در اولویت قرار می دهم، متأسفانه مجبوریم برنامه امشب را در Sphere برنامه ریزی کنیم. لئون به طرفداران ناامید - که بنا بر گزارش‌ها روی صندلی‌های خود منتظر شروع نمایش بودند، هنگام اعلام این خبر از طریق سیستم صوتی صحنه، اطمینان داد که بلیط‌های آنها برای تاریخ جدید - 15 سپتامبر 2027 - معتبر خواهند بود و اگر نتوانند آن را انجام دهند، می‌توانند در 30 روز آینده در محل خرید بازپرداخت کنند. او نوشت: من تمام تلاش، هیجان و آرزویی که بسیاری برای حضور در این شب به ارمغان آوردند را می‌دانم و صمیمانه برای هر گونه ناراحتی که ممکن است باعث شود عذرخواهی می‌کنم. از صبر شما، برای درک و این همه محبتی که همیشه باعث می‌شوید به من برسم سپاسگزارم. مردم من هرچه زودتر ببینمت در یک ویدیوی همراه، او توضیح داد که او و گروهش به دلیل نقص در عملکرد هواپیما نتوانستند به نمایشگاه برسند، و تلاش برای سوار شدن به دو هواپیمای مختلف بعد از ظهر پنجشنبه را توصیف کرد که به گفته او هر دوی آنها مشکلاتی داشتند که مانع از بلند شدن آنها شد، از جمله یکی با خرابی ترمز و دیگری با مشکل فرمان. لئون در این ویدئو گفت: \"ما باید ایمنی مردم و خلبانان را در اولویت قرار می دادیم، بنابراین اجازه پرواز نداشتیم. مقامات به ما اجازه نمی دادند.\" من صمیمانه از ته قلبم عذرخواهی می‌کنم و می‌خواهم دوباره بر عشق"}, {"source": "Billboard", "title": "How the Music for ‘Dancing With the Stars’ Comes Together Every Week", "link": "https://www.billboard.com/music/features/how-music-dancing-with-the-stars-comes-together-1236337640/", "summary": "One of America s most beloved and long-running competition shows, Dancing With the Stars , begins its 35th season on Sept. 15 and 16 on ABC and Disney +. Though every season brings a new slate of stars including Ciara Miller, Julia Stiles, Amber Glenn and Jenna Dewan for this fall s cast Dancing With the Stars has had one constant over the last 17 seasons: music director Ray Chew . Chew, leading a 14 piece band, has played an instrumental role in modernizing the music of the show, taking it from a classic ballroom feel to one that reacts in real time to pop culture trends. He s led his crew of musicians through a recreation of hit Broadway musical Wicked , a night of TikTok viral hits and just about every genre, tempo and style. To pull it off is no easy feat. DWTS is shot in real time, and the music director tells Billboard his average show day begins at 3:30 AM, and doesn t end until the show wraps that evening. Throughout the week, his team is also racing against the clock to create arrangements for songs the choreographers are picking in real time, a process he lovingly refers to as unbaking the cake, or trying to sleuth out each element of the song so that his musicians can rework it in a matter of days. Meanwhile, the show s music supervisor, Nancy Severinsen, is working to clear the rights for the songs, which, as Chew explains, doesn t always work. To clear one song, it could have two writers, [or] it could even have seven publishers, Chew explains. You got to contact everybody, and everybody s not waiting around on their phone to be contacted. Some of the music clearance happen right up until the last minute. He notes that even on the Wicked night they have to rework their original plans to satisfy the vision of the original rights holders of the music. Still, Chew takes it all stride he knows how to work under the pressure of live TV. He got his start in the band for Saturday Night Live back in the 1980s, and then has gone on to music direct everything from the Grammy Awards, Macy s Thanksgiving Day Parade, Miss Universe, the Emmys, the BET Awards, American Idol , Showtime at the Apollo and more. Dancing With the Stars, however, he says is like a unicorn for live TV. As using live musicians becomes increasingly less common, the dance competition is a bright spot, which one of the largest, if not the largest, live bands on screen today. It s a blessing, Chew says. It s a blessing. To discuss how the show comes together every week, and the importan", "date_str": "2026-09-11T11:00:00+00:00", "hash": "e4516ae5989d78e6", "title_fa": "چگونه موسیقی \"Dancing With the Stars\" هر هفته با هم می آید", "summary_fa": "یکی از محبوب‌ترین و طولانی‌ترین برنامه‌های رقابتی آمریکا، Dancing With the Stars، سی و پنجمین فصل خود را در 15 و 16 سپتامبر در ABC و Disney + آغاز می‌کند. اگرچه هر فصل مجموعه‌ای از ستارگان جدید از جمله سیارا میلر، جولیا استایلز، امبر گلن و جنا دوان را برای بازیگران پاییز امسال به ارمغان می‌آورد. چو، رهبری یک گروه 14 نفره، نقش مهمی در مدرن کردن موسیقی نمایش ایفا کرده است و آن را از یک حس کلاسیک تالار به حالتی تبدیل می کند که در زمان واقعی به روند فرهنگ پاپ واکنش نشان می دهد. او گروه نوازندگان خود را از طریق بازآفرینی موزیکال موفق برادوی Wicked، شبی پر از موفقیت‌های ویروسی TikTok و تقریباً در هر سبک، سرعت و سبکی رهبری کرد. از بین بردن آن کار آسانی نیست. DWTS در زمان واقعی فیلم‌برداری می‌شود، و مدیر موسیقی به بیلبورد می‌گوید که میانگین روز نمایش او از ساعت 3:30 صبح شروع می‌شود و تا پایان نمایش آن شب به پایان نمی‌رسد. در طول هفته، تیم او همچنین با ساعت مسابقه می‌دهند تا ترتیباتی را برای آهنگ‌هایی که طراحان رقص در زمان واقعی انتخاب می‌کنند، ایجاد کند، فرآیندی که او عاشقانه از آن به عنوان پختن کیک یاد می‌کند، یا سعی می‌کند هر عنصر آهنگ را به‌خوبی شناسایی کند تا نوازندگانش بتوانند آن را در عرض چند روز دوباره کار کنند. در همین حال، ناظر موسیقی برنامه، نانسی سورینسن، در تلاش است تا حقوق آهنگ ها را پاک کند، که همانطور که Chew توضیح می دهد، همیشه کار نمی کند. Chew توضیح می دهد که برای پاک کردن یک آهنگ، می تواند دو نویسنده داشته باشد [یا] حتی می تواند هفت ناشر داشته باشد. شما باید با همه تماس بگیرید، و همه منتظر تلفن خود نیستند تا با آنها تماس گرفته شود. برخی از موزیک ها تا آخرین"}, {"source": "Billboard", "title": "The Black Eyed Peas’ ‘Pump It’ Pushes Past 1 Billion Views on YouTube", "link": "https://www.billboard.com/music/rb-hip-hop/the-black-eyed-peas-pump-1-billion-views-youtube-1236338125/", "summary": "More than 20 years after its release, The Black Eyed Peas ’ “Pump It” has been welcomed into YouTube s Billion Views Club. The music video for the 2005 release becomes the group’s fourth to hit the milestone, the streaming giant reports, following “Where Is the Love?;” “RITMO,” their collaboration with J Balvin for the Bad Boys for Life soundtrack; and “My Humps,” which crossed the threshold in July. The party-starter samples Dick Dale s 1962 version of Misirlou and was housed on the Monkey Business (via A M/Interscope) album, which debuted at No. 2 on the Billboard 200, and would’ve hit the summit were it not for Coldplay’s X Y . “Pump It” became the group’s fourth consecutive top 20 single on the Billboard Hot 100, peaking at No. 18. The hip-hop outfit pumped it up in 2011 when they performed the track and others during their Super Bowl halftime show . Shot in Los Angeles, the music video features a customized Honda Civic Hybrid with Black Eyed Peas graphics, a car that was later presented as a prize during the 2006 Honda Civic Tour. The song has had several lives, including a remix, Pump It Harder, for the deluxe edition of the act s fifth studio album, the Billboard 200 leader The E.N.D. (from 2009). Also, Dutch DJ and producer Tiësto made a high-energy EDM cut, Pump It Louder, which dropped in 2022 and was released on his studio album Drive . Black Eyed Peas had a new look, new sound when Fergie exited in 2018, shifting her focus toward solo projects and motherhood. Ever since, the Black Eyed Peas continued to release music and tour as a trio, all the while maintaining that the split was amicable. The group’s most recent album, Elevation , was released in 2022. Then, in December 2025 , Fergie hinted at a happy reunion when she shared photos on Instagram showing herself alongside will.i.am, Taboo and Apl.de.Ap as they gathered to celebrate their milestone birthdays. In May of this year, it happened when the classic lineup reunited publicly onstage for a surprise appearance at the American Music Awards at MGM Grand Garden Arena while accepting the best throwback song award for “Rock That Body.” Watch The Black Eyed Peas Pump It below.", "date_str": "2026-09-11T09:49:10+00:00", "hash": "1475befb28168940", "title_fa": "«Pump It» از Black Eyed Peas بیش از یک میلیارد بازدید در یوتیوب داشته است", "summary_fa": "بیش از 20 سال پس از انتشار، «Pump It» ساخته The Black Eyed Peas در کلوب میلیاردها بازدید YouTube مورد استقبال قرار گرفت. غول استریم گزارش می دهد که موزیک ویدیوی منتشر شده در سال 2005، چهارمین ویدیوی گروه است که به نقطه عطفی دست یافته است، پس از «Where Is the Love?»؛ RITMO، همکاری آنها با جی بالوین برای موسیقی متن فیلم Bad Boys for Life. و \"My Humps\" که در ماه جولای از آستانه عبور کرد. این مهمانی از نسخه 1962 دیک دیل از Misirlou نمونه برداری می کند و در آلبوم Monkey Business (از طریق A M/Interscope) قرار داشت که در رتبه دوم بیلبورد 200 قرار گرفت و اگر X Y کلدپلی نبود به اوج می رسید. \"Pump It\" چهارمین تک آهنگ برتر متوالی گروه در بیلبورد Hot 100 شد و در رتبه 18 قرار گرفت. لباس هیپ هاپ آن را در سال 2011 هنگامی که آنها آهنگ و سایر آهنگ ها را در طول نمایش نیمه وقت Super Bowl خود اجرا کردند، افزایش یافت. این موزیک ویدئو که در لس آنجلس گرفته شده است، یک هوندا سیویک هیبرید سفارشی شده با گرافیک Black Eyed Peas را نشان می دهد، خودرویی که بعداً در طول تور هوندا سیویک در سال 2006 به عنوان جایزه اهدا شد. این آهنگ چندین زندگی داشته است، از جمله ریمیکس، Pump It Harder، برای نسخه لوکس پنجمین آلبوم استودیویی اکت، رهبر Billboard 200 The E.N.D. (از سال 2009). همچنین، دی‌جی هلندی و تهیه‌کننده Tiësto یک برش EDM با انرژی بالا به نام Pump It Louder ساخت که در سال 2022 کاهش یافت و در آلبوم استودیویی او Drive منتشر شد. Black Eyed Peas در زمان خروج فرگی در سال 2018 ظاهری جدید، صدایی جدید داشت و تمرکز او را به سمت پروژه های انفرادی و مادر شدن تغییر داد. از آن زمان،"}, {"source": "Billboard", "title": "Charli xcx Announces 2027 U.K. & Europe Arena Tour With Audrey Hobert", "link": "https://www.billboard.com/music/music-news/charli-xcx-2027-uk-europe-arena-tour-audrey-hobert-1236338114/", "summary": "Charli xcx is bringing her Music, Fashion, Film era to the United Kingdom and Europe in February, announcing a new run of arena dates in support of her latest album. The trek kicks off Feb. 13 in Dublin, followed by stops in Glasgow, Manchester , London and Amsterdam, before wrapping Feb. 24 in Paris. Support will come from fast-rising pop act Audrey Hobert . See the full dates below. Fans can access presale registration through Sept. 15 at Charli’s official website where further ticketing information can also be found with the presale running Sept. 16 – 17. “I’m so ready to bring you this show that I love so much,” she wrote on X . The announcement follows a landmark summer for Charli, who topped the bill at Reading Festival on Aug. 28. The appearance marked Charli’s first headline performance at the event, and along with a slot at sister site Leeds, her only U.K. festival dates of the summer. Related Charli xcx s Music, Fashion, Film : All 11 Tracks Ranked Reporting from the field, Billboard U.K. editor Thomas Smith wrote that Charli “commanded the stage with a singular focus and was bolstered by a live band in places and a group of dancers; the result was a statement of epic proportions,” add that “striking” stage production brought a “thrilling edge” to the 34-year-old’s performance. The Reading set arrived just weeks after Music, Fashion, Film (July 24), Charli’s seventh studio album and the follow-up to 2024’s culture-dominating Brat. The album represents another sharp turn in the Essex-raised artist’s constantly evolving career, leaning into darkier, grittier rock sounds while continuing her fascination with celebrity and pop culture. Music, Fashion, Film debuted at No. 1 on the Official U.K. Albums Chart , giving Charli her fourth U.K. chart-topper and making her the first British female artist to score two new No. 1 albums in the same calendar year (following February’s Wuthering Heights soundtrack). The new record opened at No. 3 on the Billboard 200 while also giving Charli her first No. 1 on Billboard’s Top Album Sales chart . The North American leg of the Music, Fashion, Film tour will commence on Friday (Sept. 11) in Philadelphia. The 12-date arena trek includes stops in New York, Toronto, Boston, Atlanta and Los Angeles before wrapping in Las Vegas on Oct. 23. Electronic artist Underscores will join Charli on the road. Charli xcx 2027 Tour of U.K. Europe : Feb. 13 Dublin, IE Feb. 15 Glasgow, U.K. Feb. 17 Manchester, U.K. Feb. 19 London, U.K.", "date_str": "2026-09-11T09:29:50+00:00", "hash": "1444f6587d9e3fd5", "title_fa": "Charli xcx تور 2027 انگلستان و اروپا را با آدری هوبرت اعلام کرد", "summary_fa": "چارلی xcx دوره موسیقی، مد، فیلم خود را در ماه فوریه به بریتانیا و اروپا می‌آورد و تاریخ جدیدی را برای حمایت از آخرین آلبوم خود اعلام می‌کند. این راهپیمایی در 13 فوریه در دوبلین آغاز می‌شود، سپس در گلاسکو، منچستر، لندن و آمستردام توقف می‌کند و در 24 فوریه در پاریس به پایان می‌رسد. از آدری هوبرت بازیگر پاپ به سرعت در حال رشد حمایت خواهد شد. تاریخ های کامل را در زیر مشاهده کنید. علاقه مندان می توانند تا پایان سپتامبر به ثبت نام پیش فروش دسترسی داشته باشند. 15 در وب‌سایت رسمی چارلی، جایی که اطلاعات بیشتر درباره بلیت‌ها را می‌توانید با پیش‌فروشی که از 16 تا 17 سپتامبر اجرا می‌شود، پیدا کنید. او در X نوشت: «خیلی آماده‌ام این نمایش را که خیلی دوستش دارم برایتان بیاورم.» این اعلامیه پس از یک تابستان برجسته برای چارلی است که در جشنواره ریدینگ در 28 اوت در صدر جدول بود. این ظاهر اولین اجرای تیتر اصلی چارلی در این رویداد و همراه با یک بازی در سایت خواهر لیدز، تنها تاریخ جشنواره تابستانی او در بریتانیا بود. مرتبط با موسیقی، مد، فیلم Charli xcx: همه 11 آهنگ رتبه‌بندی شده گزارش از میدان، سردبیر بیلبورد بریتانیا، توماس اسمیت، نوشت که چارلی \"صحنه را با تمرکزی منحصربفرد فرماندهی می‌کرد و توسط یک گروه زنده در مکان‌ها و گروهی از رقصنده‌ها تقویت می‌شد؛ نتیجه بیانیه‌ای با ابعاد حماسی بود.\" عملکرد 34 ساله مجموعه Reading تنها چند هفته پس از موسیقی، مد، فیلم (24 ژوئیه)، هفتمین آلبوم استودیویی چارلی و دنباله برات فرهنگی مسلط در سال 2024 وارد شد. این آلبوم نشان‌دهنده چرخش شدید دیگری در زندگی حرفه‌ای این هنرمند بزرگ‌شده در اسکس است که به صداهای تیره‌تر و تلخ‌تر راک متمایل شده و در عین حال به شیفتگی او به سلبریتی و فرهنگ پاپ ادامه می‌دهد. موسیقی، مد، فیلم در رتبه"}, {"source": "Billboard", "title": "Official Charts Company Launches New Homegrown Albums Chart Celebrating British Artists", "link": "https://www.billboard.com/music/music-news/official-charts-company-new-homegrown-albums-chart-1236338105/", "summary": "The Official Charts Company is putting the spotlight on British talent with the launch of the Official Homegrown Albums Chart, a new weekly ranking designed to celebrate the U.K. artists making the biggest impact across the domestic albums market. The chart launches Friday (Sept. 11) on the OCC website, with its first broadcast highlights set for Sunday (Sept. 13) on the BBC Radio 1 Official Chart First Look Show . It will showcase the biggest albums from U.K. artists released within the previous 12 months, ranked using OCC music consumption data. Eligibility for the new chart will follow the BRIT Awards’ definition of a British artist. Under the BRITs’ criteria, an artist qualifies if they were born in the U.K., hold a U.K. passport (including another nationality) or have been a permanent resident in the U.K. for more than five years. For groups, at least 50% of members must meet those criteria. The chart has been developed with support from across the U.K. music industry, including major and independent labels, and has been championed by the Association of Independent Music (AIM) and the Music Managers Forum (MMF). It arrives as British music continues to make a major impact at home and abroad, with the likes of Olivia Dean , RAYE , PinkPantheress , Lola Young and Sam Fender all enjoying major commercial success within the past year. In a statement, Chris Austin and Becca Monahan , co-managing directors of the Official Charts Company, say: “The U.K. remains one of the world’s leading music markets and is home to an extraordinary pipeline of creative talent. The Official Homegrown Albums Chart has been developed to highlight the strength and breadth of British artists making a real impact with fans across the albums market. “We hope the chart will become an important new measure of success for UK artists, from exciting emerging talent through to some of our biggest established names. We’re grateful to AIM, the MMF, stakeholders from across both the independent and major label communities, and BBC Radio 1 for their support in bringing the chart to life.” Annabella Coldrick , chief executive, Music Managers Forum, added: This is really great news for British artists. For the past two years, the MMF’s members have advocated for a homegrown chart which would spotlight U.K. artists and help accelerate fan engagement with a domestic audience. We are delighted to see the OCC respond so positively, and that the Official Homegrown Albums Chart will receive promine", "date_str": "2026-09-11T08:56:20+00:00", "hash": "0f6dda5b2f6dec96", "title_fa": "شرکت نمودارهای رسمی، نمودار آلبوم های داخلی جدید را برای تجلیل از هنرمندان بریتانیایی راه اندازی کرد", "summary_fa": "شرکت نمودارهای رسمی با راه‌اندازی نمودار رسمی آلبوم‌های خانگی، یک رتبه‌بندی هفتگی جدید که برای تجلیل از هنرمندان بریتانیایی که بیشترین تأثیر را در بازار آلبوم‌های داخلی دارند، طراحی شده است، استعدادهای بریتانیایی را مورد توجه قرار داده است. این نمودار روز جمعه (11 سپتامبر) در وب‌سایت OCC راه‌اندازی می‌شود، با اولین پخش‌های برجسته آن برای یکشنبه (13 سپتامبر) در نمایش نگاه اول نمودار رسمی رادیو بی‌بی‌سی 1. بزرگترین آلبوم های بریتانیا را به نمایش خواهد گذاشت. هنرمندانی که در 12 ماه گذشته منتشر شدند، با استفاده از داده‌های مصرف موسیقی OCC رتبه‌بندی شدند. واجد شرایط بودن برای چارت جدید از تعریف BRIT Awards از یک هنرمند بریتانیایی پیروی می کند. بر اساس معیارهای BRIT، هنرمندی واجد شرایط است که در بریتانیا متولد شده باشد، دارای پاسپورت بریتانیا (شامل ملیت دیگر) باشد یا بیش از پنج سال اقامت دائم در بریتانیا داشته باشد. برای گروه ها، حداقل 50 درصد اعضا باید آن معیارها را داشته باشند. این نمودار با پشتیبانی از سراسر صنعت موسیقی بریتانیا، از جمله لیبل های اصلی و مستقل، ایجاد شده است و توسط انجمن موسیقی مستقل (AIM) و انجمن مدیران موسیقی (MMF) حمایت شده است. در حالی که موسیقی بریتانیایی همچنان به تأثیرگذاری عمده در داخل و خارج از کشور ادامه می دهد، با افرادی مانند Olivia Dean، RAYE، PinkPantheress، Lola Young و Sam Fender همگی در سال گذشته از موفقیت تجاری بزرگی برخوردار شدند. در بیانیه‌ای، کریس آستین و بکا موناهان، مدیران مشترک شرکت نمودارهای رسمی، می‌گویند: \"بریتانیا یکی از بازارهای موسیقی پیشرو در جهان باقی مانده است و میزبان استعدادهای خلاق خارق‌العاده‌ای است. نمودار رسمی آلبوم‌های خانگی برای برجسته کردن قدرت و وسعت اثرگذاری واقعی آلبوم‌ها با هنرمندان بریتانیایی ایجاد شده است. \"ما امیدواریم که نمودار به معیار جدیدی برای موفقیت هنرمندان بریتانیا تبدیل شود، از استعدادهای نوظهور هیجان انگیز گرفته تا برخی از"}, {"source": "Billboard", "title": "Oasis Confirm Major Announcement Date With Drone Light Show in Manchester: Here’s When It’ll Land", "link": "https://www.billboard.com/music/rock/oasis-manchester-announcement-1236338101/", "summary": "Oasis teased an upcoming major announcement with a special drone light show above Manchester’s Etihad Stadium on Thursday evening (Sept. 10). Related Oasis Documentary Directors Didn t Want to Be the People That Messed Up Capturing Band s Reunion Oasis: Don t Look Back In Anger Captures the Gallagher Brothers Like Never Before: 5 Best Moments Noel Gallagher Reacts to Latest Oasis 2027 Tour Rumors With a Definitely, Maybe The band uploaded footage of the stunt on their Instagram account on Friday morning (Sept. 11), which shows a formation of drone lights that created the band’s iconic logo, before showing the time and date of a forthcoming announcement due on Sept. 14 at 4 p.m. BST (11 a.m. ET). The teaser comes as the latest suggestion that a tour announcement for 2027 could be on the cards after a number of clues shared by the band. Over the last week, its official Instagram account has hosted a series of vignette teasers hinting to potential locations of the next stretch. Each has featured references to the tour’s rumored locations, with fans seemingly identifying the locations through easter eggs in the clips: Glasgow, Scotland; Manchester, England; Munich, Germany; Barcelona, Spain; Amsterdam, Netherlands; Paris, France; Rome, Italy; and Boston, Mass. have all featured in the run so far. The band’s Live ‘25 reunion run took in shows across the United Kingdom and Ireland, Latin America, Asia and North America. Reports of a second batch of shows has been rampant ever since, spurred on by frontman Liam Gallagher who has hinted at the return on his X profile. The announcement teaser comes following the release of new documentary film Oasis: Don’t Look Back in Anger which opened in theatres in the U.K. on Wednesday (Sept. 9) and globally on Friday (Sept. 11). The film, helmed by Peaky Blinders creator Steven Knight, provides a behind-the-scenes look at the Live ‘25 dates and features live performance footage and the first joint interview between Noel and Liam in decades. Speaking to Billboard U.K. earlier this week, directors Will Lovelace and Dylan Southern discussed the pressure of being in the rehearsal room while filming. “We were very conscious that we didn’t want to be the people that messed up the Oasis reunion,” Southern said. “We didn’t want to be the film crew that got in the way, or interfered, or frustrated them or pissed them off!”", "date_str": "2026-09-11T07:56:53+00:00", "hash": "0827e86e446f36fd", "title_fa": "Oasis تاریخ اعلان اصلی را با نمایش نور پهپاد در منچستر تأیید کرد: این لحظه زمانی خواهد بود که فرود بیاید", "summary_fa": "Oasis در عصر پنجشنبه (10 سپتامبر) با نمایش نور پهپاد ویژه بر فراز استادیوم اتحاد منچستر، یک اطلاعیه مهم آینده را به اشتراک گذاشت. کارگردان‌های مستند مرتبط Oasis نمی‌خواستند افرادی باشند که ضبط مجدد گروه را به هم ریختند. حساب در صبح جمعه (سپتامبر. 11)، که شکلی از چراغ‌های هواپیمای بدون سرنشین را نشان می‌دهد که لوگوی نمادین گروه را ایجاد کرده است، قبل از نشان دادن زمان و تاریخ اعلامیه آتی در 14 سپتامبر در ساعت 4 بعد از ظهر. BST (11 صبح به وقت شرقی). این تیزر به عنوان آخرین پیشنهاد مبنی بر اینکه اعلامیه تور برای سال 2027 ممکن است پس از تعدادی سرنخ به اشتراک گذاشته شده توسط گروه در کارت باشد، منتشر شده است. در طول هفته گذشته، حساب رسمی اینستاگرام آن میزبان مجموعه‌ای از تیزرهای تصویری بود که به مکان‌های احتمالی آینده اشاره می‌کردند. هر کدام ارجاعاتی به مکان‌های شایعه شده تور دارند، و طرفداران ظاهراً مکان‌ها را از طریق تخم‌مرغ‌های عید پاک در کلیپ‌ها شناسایی می‌کنند: گلاسکو، اسکاتلند؛ منچستر، انگلستان؛ مونیخ، آلمان؛ بارسلونا، اسپانیا؛ آمستردام، هلند؛ پاریس، فرانسه؛ رم، ایتالیا؛ و بوستون، ماساچوست، همگی تاکنون در این رقابت حضور داشته اند. اجرای مجدد Live '25 گروه در سراسر بریتانیا و ایرلند، آمریکای لاتین، آسیا و آمریکای شمالی نمایش هایی را به نمایش گذاشت. گزارش‌های مربوط به دومین دسته از برنامه‌ها از آن زمان تاکنون بسیار زیاد بوده است، که توسط لیام گالاگر، رهبر خواننده، که به بازگشت در پروفایل X خود اشاره کرده است، تحریک شده است. این تیزر اعلامی پس از اکران فیلم مستند جدید Oasis: Don't Look Back in Anger منتشر شد که از چهارشنبه (9 سپتامبر) در سینماهای بریتانیا و جمعه (11 سپتامبر) در سراسر جهان اکران شد."}, {"source": "Deadline", "title": "‘Black Sunflowers’ First Look: Ukraine’s Youth Live Life On The Edge In Propulsive Doc From E.P. Sean Penn – Toronto Film Festival", "link": "https://deadline.com/2026/09/black-sunflowers-teaser-toronto-film-festival-1237098532/", "summary": "EXCLUSIVE: The Toronto Film Festival hosts the world premiere of Black Sunflowers Friday evening, one of the most dynamic and explosive documentaries of the year. The film set in Ukraine is punctuated by ragers, “Tokyo drift”-style street racing, machine gun fire, and in interludes, moments of tenderness between young lovers. Director James Marcus Haney crafts [ ]", "date_str": "2026-09-11T14:30:51+00:00", "hash": "7ddc4a9220f81630", "title_fa": "نگاه اول \"آفتابگردان سیاه\": جوانان اوکراین زندگی در لبه را در Doc Propulsive از E.P. شان پن - جشنواره فیلم تورنتو", "summary_fa": "اختصاصی: جشنواره فیلم تورنتو میزبان اولین نمایش جهانی Black Sunflowers در عصر جمعه است که یکی از پویاترین و انفجاری ترین مستندهای سال است. داستان فیلم در اوکراین با خشمگین‌ها، مسابقه خیابانی به سبک «دریفت توکیو»، شلیک مسلسل، و در فو احیه خود در مقایسه با تماشاگران فصل اول با کاهش تقریبا 50 درصدی مخاطبان مواجه است."}, {"source": "Netflix NL", "title": "Nederlandse serie neemt al na één dag Netflix over", "link": "https://www.netflix-nederland.nl/nederlandse-serie-neemt-al-na-een-dag-netflix-over/", "summary": "Netflix wordt veroverd. Gekolonialiseerd! Door een Nederlandse serie. Oké, dit is misschien wat overdreven, maar dat De Eetclub een hit is (of wórdt) kunnen we toch wel met zekerheid zeggen. De Eetclub Voor wie onder een steen leeft (en dat is niet bedoeld als een belediging): De Eetclub is een Nederlandse psychologische thrillerserie, gebaseerd op de welbekende bestseller van Saskia Noort. Het verhaal draait om Karen, die met haar gezin verhuist naar het welvarende Bergen. Ze heeft moeite om haar plek te vinden, totdat ze wordt opgenomen in een hechte vriendengroep die zichzelf De Eetclub noemt. De leden leiden op het eerste gezicht een zorgeloos bestaan: luxe huizen, etentjes, feestjes, nou, je kent het wel. Nu al mega succes Achter die perfecte buitenkant blijkt echter van alles mis te zijn. Wanneer de villa van een van de stellen in brand vliegt en Evert om het leven komt, verandert de sfeer binnen de groep natuurlijk volledig. Karen krijgt steeds meer het gevoel dat zijn dood geen eenvoudig ongeluk was. Terwijl ze probeert te achterhalen wat er werkelijk is gebeurd, ontdekt ze dat haar nieuwe vrienden geheimen voor elkaar hebben en dat relaties binnen de groep veel ingewikkelder zijn dan ze aanvankelijk dacht. Hoe meer Karen ontdekt, hoe moeilijker het wordt om te bepalen wie ze nog kan vertrouwen Niet onopgemerkt Loes Haverkort, Remko Vrijdag, Noortje Herlaar, Edwin Jonker, Rifka Lodeizen, Matthijs van de Sande Bakhuyzen, Charlie-Chan Dagelet en Teun Luijkx spelen de hoofdrollen in De Eetclub, dat nu dus op Netflix staat. En dat is niet onopgemerkt voorbijgegaan, want de serie bestormt de top 10 met meest bekeken series al. En vermoedelijk zal De Eetclub alleen nog maar verder gaan s x", "link": "https://www.netflix-nederland.nl/op-zoek-naar-ontvoerde-baby-in-nieuwe-thrillerserie-op-netflix/", "summary": "Stel: jouw kind wordt ontvoerd? Jouw baby? Wat doe je dan? Nou: je zet de boel natuurlijk helemáál op stelten! Dat is precies het plot van de nieuwe Netflix-thrillerserie Shaque: Trust No One. Tthrillerserie Shaque: Trust No One Shaque: Trust No One is een psychologische thrillerserie uit India waarin een moeder al negen jaar op zoek is naar haar kind, dat als baby werd ontvoerd. Haar zoektocht heeft haar leven volledig bepaald, maar wanneer er eindelijk nieuwe aanwijzingen opduiken, krijgt ze voor het eerst het gevoel dat ze dichter bij de waarheid komt. De hoofdrol wordt gespeeld door Parineeti Chopra, die met deze productie haar debuut in een televisieserie maakt. Haar personage weigert de hoop op te geven, ondanks het feit dat haar kind al bijna een decennium verdwenen is. De zoektocht is daardoor niet alleen een onderzoek naar een ontvoering, maar ook een emotionele strijd van een moeder die haar leven niet kan voortzetten zolang ze niet weet wat er is gebeurd. Logisch, toch? Nieuwe informatie Wanneer de nieuwe informatie naar boven komt, blijkt de waarheid mogelijk veel dichterbij te liggen dan ze ooit had gedacht. De aanwijzingen brengen haar in de richting van mensen uit haar eigen vertrouwde omgeving. Daardoor begint ze te twijfelen aan familieleden en vrienden, aan de mensen op wie ze jarenlang heeft gerekend. Iedereen lijkt zijn eigen geheimen en motieven te hebben, waardoor het steeds lastiger wordt om te bepalen wie eerlijk is en wie iets verbergt. Naast Chopra bestaat de cast onder meer uit Jennifer Winget, Tahir Raj Bhasin, Soni Razdan en Harleen Sethi. De makers beloven een verhaal waarin de kijker voortdurend moet blijven twijfelen aan wat hij ziet en aan wie hij kan vertrouwen. Trust no one! Shaque: Trust No One verschijnt op 24 september 2026 op Netflix. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Op zoek naar ontvoerde baby in nieuwe thrillerserie op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-10T18:36:54+00:00", "hash": "f222017e1658f79e", "title_fa": "به دنبال کودک ربوده شده در سریال های هیجان انگیز جدید در نتفلیکس", "summary_fa": "فرض کنید فرزند شما ربوده شده است؟ بچه شما؟ اونوقت چیکار میکنی؟ خب، البته شما واقعاً همه چیز را وارونه می کنید! این دقیقاً طرح داستان سریال هیجان انگیز جدید نتفلیکس Shaque: Trust No One است. سریال هیجان انگیز Shaque: Trust No One Shaque: Trust No One یک سریال هیجان انگیز روانشناختی از هند است که در آن مادری به مدت 9 سال در جستجوی فرزندش که در کودکی ربوده شده است، بوده است. جستجوی او زندگی او را به طور کامل مشخص کرده است، اما وقتی سرنخ های جدیدی در نهایت پیدا می شود، برای اولین بار احساس می کند که به حقیقت نزدیک تر می شود. نقش اصلی را پارینتی چوپرا ایفا می کند که اولین حضور خود را در یک سریال تلویزیونی با این تولید انجام می دهد. شخصیت او با وجود اینکه فرزندش تقریباً یک دهه ناپدید شده است، امید خود را از دست نمی دهد. بنابراین جستجو نه تنها یک تحقیق در مورد یک آدم ربایی، بلکه یک مبارزه عاطفی مادری است که تا زمانی که نمی داند چه اتفاقی افتاده است، نمی تواند به زندگی خود ادامه دهد. منطقی است، درست است؟ اطلاعات جدید هنگامی که اطلاعات جدید ظاهر می شود، حقیقت ممکن است بسیار نزدیکتر از آن چیزی باشد که او فکر می کرد. سرنخ ها او را به سمت افرادی از محیط آشنای خود هدایت می کند. در نتیجه، او شروع به شک به اعضای خانواده و دوستان می کند، افرادی که سال ها روی آنها حساب کرده است. به نظر می رسد هرکسی اسرار و انگیزه های خاص خود را دارد و تشخیص اینکه چه کسی صادق است و چه کسی چیزی را پنهان می کند به طور فزاینده ای دشوار می شود. علاوه بر چوپرا، جنیفر وینگت، طاهر راج باسین، سونی رازدان و هارلین ستی از بازیگران آن می‌باشند. سازندگان"}, {"source": "Pitchfork", "title": "Modest Mouse and My Morning Jacket Share Neil Young Covers", "link": "https://pitchfork.com/story/modest-mouse-and-my-morning-jacket-share-neil-young-covers/", "summary": "Listen to the indie rock titans’ respec ، سوء رفتار جنسی، و نقض حقوق مدنی او\" است. سانتیاگو گفته است که برایان را نمی‌شناسد. هدر پالمور، وکیل برایان، در بیانیه‌ای به Pitchfork نوشت: «هیچ زنی برای تجاوز ثبت نام نمی‌کند. \"این ادعا که تجاوز قابل بخشش است - یا"}, {"source": "Pitchfork", "title": "Bradford Cox Books First Show in Seven Years", "link": "https://pitchfork.com/story/bradford-cox-books-first-show-in-seven-years/", "summary": "The Deerhunter maestro’s Atlas Sound project returns next weekend at Making Time ∞ festival", "date_str": "2026-09-10T18:30:37+00:00", "hash": "21b3181b70db21ad", "title_fa": "اولین نمایش کتاب های برادفورد کاکس پس از هفت سال", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Bradford Cox، مغز متفکر Deerhunter جیوه‌دار، قرار است برای اولین بار پس از سال‌ها در جشنواره Making Time ∞ به صحنه بازگردد. پس از یک دوری طولانی از انظار عمومی - که تنها با یک نمایش نویز ظاهراً خاص در یک بازار قدیمی در جورجیا در سال 2023 قطع شد - کاکس اطلس ساوند را برای یک مجموعه زنده در هفته فیلادلفیا، که از 18 تا 20 سپتامبر در فورت میفلین اجرا می‌شود، دوباره زنده کرد. می توانید اجرای Atlas Sound را در ساعت 4:30 بعد از ظهر تماشا کنید. آن یکشنبه به نظر می رسد Deerhunter و Atlas Sound از سال 2019، یعنی سالی که گروه قبلی «Why Hasn’t Everything Already Disappeared» را منتشر کرد، وقفه های اعلام نشده ای داشته اند؟ ، دومی یک ست یکباره در Desert Daze انجام داد، و آخرین اما نه کم اهمیت، کاکس در باند فرودگاه گوچی قدم زد. جزئیات بیشتری در مورد فعالیت اخیر یا برنامه های آتی وی منتشر نشده است."}, {"source": "Pitchfork", "title": "Shygirl Reveals New Album Swallow!, Shares Song", "link": "https://pitchfork.com/story/shygirl-reveals-new-album-swallow-shares-song/", "summary": "Her first studio LP in four years is led by “Lucky (Hymn)”", "date_str": "2026-09-10T17:30:30+00:00", "hash": "a898e06c5747bdb2", "title_fa": "Shygirl آلبوم جدید Swallow! را به اشتراک می‌گذارد", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Shygirl با آلبوم دوم س
