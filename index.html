      backdrop-filter: blur(4px);

      align-items: center;
      justify-content: center;

": "ائتلاف سعودی اعلام کرد بندر حدیده یمن را هدف حمله قرار داده است. حوثی‌ها نیز با تهدید به حملات تازه علیه بنادر و تأسیسات عربستان، به شرکت‌های هواپیمایی هشدار دادند. ائتلاف نظامی به رهبری عربستان سعودی روز جمعه ۲۹ آبان اعلام کرد که تأسیسات مورد استفاده حوثی‌ها در بندر حدیده یمن را هدف قرار داده است؛ هم‌زمان حوثی‌های مورد حمایت جمهوری اسلامی به شرکت‌های هواپیمایی هشدار دادند از ورود به حریم هوایی عربستان خودداری کنند. ترکی المالکی، سخنگوی ائتلاف نظامی به رهبری عربستان سعودی، گفت نیروهای این ائتلاف تأسیساتی در بندر حدیده یمن را هدف قرار داده‌اند که به‌گفتۀ او حوثی‌ها از آن‌ها برای قاچاق سلاح و انتقال موشک‌های بالستیک استفاده می‌کردند. ائتلاف سعودی همچنین از حمله به تأسیسات موشکی و پهپادی حوثی‌ها و یک انبار تدارکاتی در صنعا، پایتخت یمن، خبر داد و اعلام کرد عملیات نظامی در استان‌های صعده و تعز نیز ادامه دارد. بندر حدیده در ساحل دریای سرخ، مهم‌ترین مسیر ورود مواد غذایی و دیگر کالاهای ضروری به مناطق شمالی یمن تحت کنترل حوثی‌هاست. ائتلاف سعودی پیش از آغاز حملات از غیرنظامیان خواسته بود برای حفظ جان خود این بندر را ترک کنند. وزیر اطلاع‌رسانی دولت مورد حمایت عربستان در یمن گفته است بندر حدیده همچنان به فعالیت خود ادامه می‌دهد و جریان ورود کالاها متوقف نشده است. تاکنون گزارشی از میزان خسارت‌ها یا تلفات احتمالی حملات روز جمعه به بندر حدیده منتشر نشده است. پیش از حملۀ ائتلاف سعودی به بندر حدیده، یحیی سریع، سخنگوی نظامی حوثی‌ها، هشدار داده بود که در صورت حمله به این بندر، جده و دیگر بنادر عربستان در ساحل دریای سرخ هدف حملات تلافی‌جویانه قرار خواهند گرفت. او در بیانیه‌ای از کارکنان و افراد حاضر در اطراف این بنادر خواست فوراً محل را ترک کنند و به شرکت‌های کشتیرانی نیز هشدار داد کشتی‌های خود را از بنادر عربستان خارج کنند.", "image_url": "https://gdb.rferl.org/0f17256c-3617-47ec-8073-b372b3b100ca_w1200_h630.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۹ آبان • ۱۹:۰۴"}, {"source": "IranWire", "title": "افزایش دوبرابری قیمت‌ها در ۸استان؛ هرمزگان رکورددار تورم مهرماه", "link": "https://iranwire.com/fa/news-1/160526-%D8%A7%D9%81%D8%B2%D8%A7%DB% rticles/c6jreyzjw5jno?at_medium=RSS&at_campaign=rss", "summary": "بی‌بی‌سی دریافته که یک عملیات امنیت سایبری مخفیانه برای ایمن‌سازی ده‌ها هزار یخچال و فریزر فروشگاهی و سردخانه‌ای در بریتانیا در برابر حمله احتمالی هکرها انجام شده است.", "date_str": "2026-11-20T14:23:42+00:00", "hash": "dfd254f52c58a153", "title_fa": "ده‌ها هزار یخچال در بریتانیا در عملیاتی محرمانه در برابر حمله سایبری ایمن شد", "summary_fa": "بی‌بی‌سی دریافته که یک عملیات امنیت سایبری مخفیانه برای ایمن‌سازی ده‌ها هزار یخچال و فریزر فروشگاهی و سردخانه‌ای در بریتانیا در برابر حمله احتمالی هکرها انجام شده است. این عملیات پس از حمله سایبری در چند کشور اروپایی، برای ایمن‌سازی یخچال‌های سوپرمارکت‌ها، انبارها، رستوران‌ها، پمپ بنزین‌ها و استادیوم‌های بزرگ در بریتانیا صورت گرفته است. موج‌ اخیر حملات سایبری در اروپا موجب نابودی ده‌ها تن مواد غذایی در صدها فروشگاه شد و میلیون‌ها دلار خسارت به بار آورد. فرانسه ایران را مسئول حمله به سوپرمارکت‌های این کشور دانسته است؛ ادعایی که تهران آن را رد می‌کند. پس از هک یخچال‌ها در اروپا، گمان می‌رفت که بریتانیا به این دلیل تا حد زیادی از چنین حملات سایبری در امان مانده باشد که صنعت سرمایش این کشور از تجهیزاتی متفاوت با اروپا استفاده می‌کند. اما بررسی‌ها از وجود یک آسیب‌پذیری بالقوه در این زیرساخت‌ها حکایت داشت؛ حفره‌ای امنیتی که پیش از آنکه مورد سوءاستفاده هکرها قرار گیرد، به‌سرعت شناسایی و برطرف شد. در اواخر ماه اکتبر، پژوهشگران امنیت سایبری یک نقص جدی را شناسایی کردند که اگر پیشتر هکرها آن را کشف می‌کردند، می‌توانست خسارات گسترده‌ای به بریتانیا وارد کند. از آن زمان تاکنون، پژوهشگران امنیتی، تیم‌های فناوری اطلاعات و مرکز ملی امنیت سایبری بریتانیا بی‌وقفه مشغول کار بوده‌اند تا به ده‌ها شرکت درباره این آسیب‌پذیری هشدار بدهند و برای رفع آن اقدامات پیشگیرانه‌ای انجام داده‌اند. بی‌بی‌سی تا کنون درباره این عملیات گسترده و محرمانه گزارش نداده بود تا احتمال سوءاستفاده هکرها از این آسیب‌پذیری و وارد کردن خسارت در صورت اطلاع از آن، کاهش یابد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. ابتدا کارکنان شرکت مشاوره سامانه‌های سرمایشی «اومگا سولوشن» این تهدید امنیتی را کشف کردند. سپس کارشناسان شرکت «پن تست پارتنرز» این یافته را تأیید و ابعاد تهدید", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/d3db/live/57d6aa20-d769-11f1-a956-ff083523ef77.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۲۹ آبان • ۱۷:۵۳"}, {"source": "Iran International", "title": "پرسپولیس ۳-۰ پیکان؛ تارتار هم از بحران خارج شد، هم موقتا به صدر رسید", "link": "https://www.iranintl.com/202611208743", "summary": "تیم فوتبال پرسپولیس در هفته سیزدهم لیگ برتر، در ورزشگاه قلعه‌حسن‌خان، پیکان را با نتیجه سه بر صفر شکست داد. تیوی بیفوما در دقیقه ۳۹ روی پاس محمد عمری، محمدمهدی محبی در دقیقه ۵۳ روی پاس بیفوما و علی علیپور در دقیقه ۷۲ روی پاس پوریا شهرآبادی، گل‌های سرخ‌پوشان را به ثمر رساندند.", "date_str": "2026-11-20T14:23:10+00:00", "hash": "2c9644f8c52c56cc", "title_fa": "پرسپولیس ۳-۰ پیکان؛ تارتار هم از بحران خارج شد، هم موقتا به صدر رسید", "summary_fa": "تیم فوتبال پرسپولیس در هفته سیزدهم لیگ برتر، در ورزشگاه قلعه‌حسن‌خان، پیکان را با نتیجه سه بر صفر شکست داد. تیوی بیفوما در دقیقه ۳۹ روی پاس محمد عمری، محمدمهدی محبی در دقیقه ۵۳ روی پاس بیفوما و علی علیپور در دقیقه ۷۲ روی پاس پوریا شهرآبادی، گل‌های سرخ‌پوشان را به ثمر رساندند.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/063fbb4ac11903db8789cebb1a8470f76b116dc6-1280x838.jpg?rect=341,107,939,493&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۹ آبان • ۱۷:۵۳"}, {"source": "Iran International", "title": "فروش تفنگ‌های کهنه در کنار سلاح‌های چاپ سه‌بعدی در بازار داغ اسلحه در ایران", "link": "https://www.iranintl.com/202611204653", "summary": "در بازار اسلحه ایران، چند عکس و یک پیام برای شروع معامله کافی است. در این بازار از کلت و کلاشنیکف تا سلاح‌های ساخته‌شده با چاپگر سه‌بعدی، خرید و فروش می‌شوند.", "date_str": "2026-11-20T14:14:10+00:00", "hash": "ae432123f247f2c1", "title_fa": "فروش تفنگ‌های کهنه در کنار سلاح‌های چا       tech: [{"source": "MIT AI", "title": "Following the “mathocalypse,” mathematicians consider the future", "link": "https://news.mit.edu/2026/following-mathocalypse-mathematicians-consider-future-1120", "summary": "It’s been a tumultuous year for math. Big open questions that have occupied mathematicians for decades are now being solved in a matter of hours by artificial intelligence agents that companies deploy by the thousands to work on a single problem in tireless lockstep. AI’s relentless rise is raising existential questions for the field: How will the tools affect humans’ understanding of mathematical concepts? In the face of AI’s brute-force productivity, will mathematicians still have jobs? And what will all this mean for mathematics as an intellectual pursuit? At MIT, mathematicians grappled with these and other questions at a panel discussion on Monday titled “AI and Society: The Future of Math.” Leading mathematicians from MIT, Harvard University, Northwestern University, and New York University — each experts in their respective fields — sat down for a conversation that touched on the quality of AI math, how AI is challenging long-established research norms, and the evolving opportunities for mathematicians, whether they embrace the machines or remain “AI vegans.” The wide-ranging discussion, which took place in a packed lecture hall in MIT’s Building 3, was moderated by science writer Kevin Hartnett, author of “The Proof in the Code,” and featured Jacopo Borga, the Cecil and Ida Green Career Development Assistant Professor of Mathematics at MIT; Michael Hopkins, the George Putnam Professor of Pure and Applied Mathematics at Harvard University; Bryna Kra, the Sarah Rebecca Roland Professor of Mathematics at Northwestern University; and Tristan Buckmaster, professor of mathematics at New York University's Courant Institute of Mathematical Sciences. As the panelists shared their various and at times conflicting perspectives on AI’s impact, one thing was clear: “Math has changed more in the last two months than in the last 100 years,” said Kra, who cautioned that AI’s power will change what it is to be a mathematician and what it will take to advance human knowledge in meaningful ways. “It’s like the first sentence in ‘A Tale of Two Cities’: ‘It was the best of times, it was the worst of times.’ It’s a really exciting moment … and also scary.” AI’s sprint Artificial intelligence has made steady strides over the last decade thanks in large part to mathematicians themselves, who out of curiosity have been honing AI models to solve problems with known solutions. These early exercises proved successful, most notably in 2025. That summer, at the International Ma", "date_str": "2026-11-20T15:20:00+00:00", "hash": "59f387769c5e49c6", "title_fa": "ریاضیدانان به دنبال \"متوکاالیپس\" آینده را در نظر می گیرند", "summary_fa": "سال پرفراز و نشیبی برای ریاضیات بود. پرسش‌های باز بزرگی که دهه‌ها ریاضیدانان را به خود مشغول کرده بود، اکنون در عرض چند ساعت توسط عوامل هوش مصنوعی حل می‌شوند که شرکت‌ها هزاران نفر را برای کار بر روی یک مسئله در یک قدمی خستگی ناپذیر به کار می‌گیرند. رشد بی‌امان هوش مصنوعی سؤالات وجودی را برای این رشته ایجاد می‌کند: ابزارها چگونه بر درک انسان از مفاهیم ریاضی تأثیر می‌گذارند؟ در مواجهه با بهره وری بی رحمانه هوش مصنوعی، آیا ریاضیدانان همچنان شغل خواهند داشت؟ و همه اینها برای ریاضیات به عنوان یک پیگیری فکری چه معنایی خواهد داشت؟ در MIT، ریاضیدانان با این سؤالات و سؤالات دیگر در میزگردی در روز دوشنبه با عنوان \"هوش مصنوعی و جامعه: آینده ریاضیات\" دست و پنجه نرم کردند. ریاضیدانان برجسته از MIT، دانشگاه هاروارد، دانشگاه نورث وسترن و دانشگاه نیویورک - که هر کدام در زمینه های مربوط به خود متخصص هستند - در مورد کیفیت ریاضیات هوش مصنوعی، اینکه چگونه هوش مصنوعی هنجارهای تحقیقاتی طولانی مدت را به چالش می کشد، و فرصت های در حال تکامل برای ریاضیدانان، چه آنها ماشین ها را بپذیرند یا \"هوش مصنوعی\" باقی بمانند، به گفتگو نشستند. این بحث گسترده، که در یک سالن سخنرانی مملو در ساختمان 3 MIT برگزار شد، توسط نویسنده علمی، کوی ing for three people, so I scooped my refrigerated potatoes into a small saucepan. I let my mashed potatoes heat up for 20 minutes. Anneta Konstantinides/Business Insider Per Garten's instructions, I stirred the potatoes occasionally while I waited for them to get hot. Then I added the Parmesan cheese and sour cream. Anneta Konstantinides/Business Insider Just as with her original Parmesan potatoes, Garten doesn't skimp on", "date_str": "2026-11-20T14:41:02+00:00", "hash": "a1d7b73590f1e9fb", "title_fa": "من ترفند Ina Garten را برای بالا بردن پوره سیب زمینی خریداری شده در فروشگاه امتحان کردم. خانواده من باور نمی کردند که آنها خانگی نیستند.", "summary_fa": "من هک Ina Garten را برای بالا بردن پوره سیب زمینی سوپرمارکت امتحان کردم و طعم خانگی آنها را می‌دادند. Anneta Konstantinides/Business Insider من نکته Ina Garten را برای بالا بردن پوره سیب زمینی بسته بندی شده از سوپرمارکت امتحان کردم. دستور گارتن شامل پوره سیب زمینی یخچالی، خامه ترش، کره و پنیر پارمزان بود. دستور پخت او بسیار ارزان، ساده و سریع بود. برای غذایی که خیلی ساده به نظر می رسد، پوره سیب زمینی نیاز به کار زیادی دارد. فقط لایه برداری به تنهایی می تواند خسته کننده باشد. به همین دلیل است که اینا گارتن با الهام از نوشتن دستور العمل شکرگزاری با استفاده از پوره سیب زمینی خریداری شده در فروشگاه، آن را در ابتدا با نیویورک تایمز در سال 2022 به اشتراک گذاشت. من می‌خواهم طعمی را که در فروشگاه خریداری می‌کنم را به صورت خانگی درست کنم.» گارتن همه بسته‌های پوره سیب‌زمینی یخچالی و یخ‌زده را آزمایش کرد تا غذای خود را بسازد، فرآیندی که او برای دستور العمل‌های سیب‌زمینی در جدیدترین کتاب آشپزی خود، «به سادگی اینا» تکرار می‌کرد. من سیب زمینی های له شده پارمزان Garten's را از ابتدا درست کردم و آنها را دوست داشتم، بنابراین برایم جالب بود. آیا سیب‌زمینی‌های سوپرمارکت‌های یخچالی می‌توانند طعم واقعی آن را داشته باشند؟ پوره سیب زمینی خریداری شده در فروشگاه Ina Garten فقط به چند ماده نیاز دارد. Anneta Konstantinides/Insider برای تهیه پوره سیب زمینی پارمزان گارتن برای شش نفر، به این موارد نیاز دارید: 1 بسته 32 اونسی پوره سیب زمینی یخچ ural match for a larger TV. Despite all that width, it keeps a low profile at just under three inches tall, so it can sit beneath most screens without blocking the picture, or you can wall-mount it if you would rather keep your TV stand clear. All that size makes room for a 9.1.4-channel layout (a big step up from the original Arc) that gives Dolby Atmos effects more space to spread around and above you. Sonos also added a new Sound Motion driver that it says doubles the original Arc's bass, giving action scenes real weight without a separate subwoofer, though you can still add a Sub 4 later for more rumble. At the other end of the sound spectrum, voices and dialogue come through clearly even at low volumes, and a Speech Enhancement mode lifts them further. Trueplay tuning then adjusts the sound to your room, with a quick version on Android and iOS and a more detailed one for iPhone owners. The biggest drawback is connectivity, since the Arc Ultra has a single HDMI eARC port with no passthrough, which can leave you short on inputs for a console or streaming box, and no optical port. It also lacks DTS:X support, a letdown for some Blu-ray collectors, and voice control is limited to Alexa or Sonos' own assistant, though Wi-Fi, Bluetooth, and AirPlay 2 make streaming music from your phone easy. Black Friday FAQs Are Black Friday deals worth it? In short, yes, Black Friday still offers discounts that can be rare throughout the rest of the year. If there s something you want to buy, or you re shopping for gifts, it s a good time to look for discounts on what you need", "date_str": "2026-11-20T14:30:00+00:00", "hash": "e0c46e4aabba1249", "title_fa": "Soundbar Sonos Arc Ultra قبل از جمعه سیاه 250 دلار تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. فروش جمعه سیاه آمازون در سال 2026، Sonos Arc Ultra را از 1099 دلار معمول خود به 849 دلار کاهش داد، یک تخفیف 250 دلاری که پ       media: [{"source": "Billboard", "title": "Billie Eilish to Headline BST Hyde Park for First Time: ‘She Inspires Fans, Challenges Our Industry to Be Better’", "link": "https://www.billboard.com/music/pop/billie-eilish-bst-hyde-park-2027-headliner-1236386423/", "summary": "Billie Eilish will headline BST’s Hyde Park festival in 2027, joining the London festival’s stacked slate for next summer. Related Harry Styles, Sam Fender Billie Eilish to Headline Glastonbury Festival 2027: See The Lineup Billie Eilish FINNEAS Follow Lucy Dickins to CAA for Global Touring, WME to Share in North America Harry Styles Hits Festivals Billie Eilish is Back: The Biggest Talking Points From Glastonbury’s 2027 Lineup Reveal Eilish will headline the iconic venue on July 3, 2027, her first time performing at the festival. The announcement comes just days after she was revealed as one of Glastonbury’s headline artists in 2027. She first topped the festival bill in 2022, becoming the youngest solo act to ever do so. She now joins Bon Jovi , Muse and RAYE as performers on the BST Hyde Park lineup for 2027, with more due to be announced in the coming weeks. Support acts for Eilish’s performance have not yet been shared. Tickets for the performance go on presale from 3 p.m. GMT on Friday (Nov. 20) from the festival s website , with a general sale commencing on Thursday, Nov. 26, at 10 a.m. local. Speaking on the booking, Jim King, chief executive of AEG Presents U.K. and European Festival said she d long been sought after for the festival. Every event has their list of a handful of artists you dream of seeing on its stage, and for BST Hyde Park, Billie Eilish has been at the top of that list for years,” King said in a statement. He added, “Whether it’s her commitment to community and sustainability or her incredible live performances, Billie continues to show what’s possible when artists lead from the front. She inspires fans, challenges our industry to be better and delivers one of the most remarkable live shows anywhere in the world. Eilish last performed in the U.K. on her tour supporting third studio album Hit Me Hard and Soft , including six nights at London’s 20,000 capacity O2 Arena. The tour wrapped in November 2025 in San Francisco.", "date_str": "2026-11-20T15:45:17+00:00", "hash": "d0b72480916da362", "title_fa": "بیلی آیلیش برای اولین بار تیتر BST هاید پارک می شود: \"او الهام بخش طرفداران است، صنعت ما را به چالش می کشد تا بهتر شود\"", "summary_fa": "بیلی آیلیش در سال 2027 به عنوان تیتر جشنواره هاید پارک BST خواهد بود و در تابستان آینده به برنامه های انباشته جشنواره لندن می پیوندد. مرتبط با هری استایلز، سم فندر بیلی آیلیش به عنوان جشنواره گلستونبری 2027: لیست را ببینید بیلی آیلیش فینیاس لوسی دیکینز را به CAA برای تورهای جهانی دنبال کنید، WME برای اشتراک در جشنواره های بازدید از هری استایلز در آمریکای شمالی بیلی آیلیش بازگشت: The Biggest From Talkings Li20veyint آیلیش در تاریخ 3 ژوئیه 2027 که برای اولین بار در این جشنواره اجرا می کند، تیتر این مکان نمادین خواهد بود. این اعلامیه تنها چند روز پس از اینکه او به عنوان یکی از هنرمندان سرفصل گلستونبری در سال 2027 معرفی شد، منتشر شد. او برای اولین بار در سال 2022 در صدر فهرست جشنواره قرار گرفت و تبدیل به جوانترین بازیگر انفرادی شد که تا به حال این کار را انجام داده است. او اکنون به Bon Jovi، Muse و RAYE به‌عنوان نوازنده‌های BST Hyde Park برای سال 2027 می‌پیوندد که قرار است در هفته‌های آینده بیشتر اعلام شود. اقدامات حمایتی برای اجرای ایلیش هنوز به اشتراک گذاشته نشده است. پیش فروش بلیت این اجرا از ساعت 15 آغاز می شود. GMT روز جمعه (نوامبر 20) از وب سایت جشنواره، با فروش عمومی از پنجشنبه، 26 نوامبر، ساعت 10 صبح محلی آغاز می شود. جیم کینگ، مدیر اجرایی AEG Presents U.K and European Festival در صحبت‌های خود در مورد رزرو این جشنواره گفت که او مدت‌هاست که به دنبال این جشنواره بوده است. کینگ در بیانیه‌ای گفت: هر رویدادی لیست خود را از تعداد انگشت شماری از هنرمندان دارد که آرزوی دیدن آنها را روی صحنه دارید، و برای BST Hyde Park، بیلی آیلیش سال‌ها در صدر این فهرست قرار داشته است. او اضافه کرد: \"بیلی چه تعهدش به جامعه و پایداری", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P1064I15-e1795188195438.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۹ آبان • ۱۹:۱۵"}, {"source": "Billboard", "title": "Trump, Putin & Xi’s New Photo Op Looks Like This Classic ’90s Album: Here’s How the Internet Is Reacting", "link": "https://www.billboard.com/music/music-news/trump-putin-xi-photo-weezer-blue-album-internet-reacts-1236386400/", "summary": "Ever since its 1994 release, the album art for Weezer s self-titled debut, commonly known as The Blue Album, has been meme fodder. Whenever a group of people stands before a blue background, observers note the resemblance to the famous record s cover. Related How Is Weezer Killing It in Arenas, 30 Years In? (Hint: Gen Z Loves Them, Too) Weezer Honored as Billboard Legends of Live as Rivers Cuomo Reflects on the Road Life: ‘A Mission I Want to Take On’ Weezer’s Biggest Billboard Chart Hits: ‘Buddy Holly,’ ‘Beverly Hills’ More Now, three major world leaders have (almost certainly inadvertently) recreated the album cover. At the Thursday (Nov. 19) trilateral summit between the United States, Russia and China, respective leaders Donald Trump, Vladimir Putin and Xi Jinping posed for photos in front of a blue backdrop; naturally, the internet quickly took notice. The Orange Album read one trending post on the Weezer subreddit, with comments including geezer, My name is POTUS and Everything Won t Be Alright in the End (the latter two referring to Blue s opening track, My Name Is Jonas, and the band s 2014 album Everything Will Be Alright in the End ). Of the historically nonpartisan band, one commenter noted, Low-key they should make a political album and have this as the cover. Another enterprising Redditor posted An Equation for the Nerds presenting the addition of a picture of the power-pop band Tally Hall in neckties and the Blue artwork presented as equaling the photo of the three politicians. Other comments on Reddit posts of the image: Album cover for the Everybody Wants to Rule the World single (the band covered the Tears For Fears classic on its 2019 self-titled Teal Album), Nightmare blunt rotation and What s with these homies ruining the world? (playing off the What s with these homies dissing my girl? lyric from another Blue album classic, Buddy Holly ). On X, one user went viral with a post of the image and the joke , Weezer undergoing some pretty dramatic lineup changes. But one Redditor s comment summed up how many of the band s fans likely feel about the image: Right because I want to associate some of the worst people in the world with my favorite band. Weezer s Blue Album Courtesy of DGC The Blue Album arrived via DGC in May 1994 and peaked at No. 16 on the Billboard 200 the following February. Debut single Undone The Sweater Song reached a high of No. 57 on the Billboard Hot 100 and No. 6 on the Alternative Airplay chart, while subsequent singl", "date_str": "2026-11-20T15:26:29+00:00", "hash": "f3e1f45a5491534b", "title_fa": "عکس جدید ترامپ، پوتین و شی شبیه این آلبوم کلاسیک دهه 90 است: واکنش اینترنت به این صورت است", "summary_fa": "از زمان انتشار آن در سال 1994، هنر آلبوم اولین آلبوم ویزر، که معمولاً به عنوان آلبوم آبی شناخته می‌شود، خوراک میم بوده است. هر زمان که گروهی از افراد در مقابل پس زمینه آبی قرار می گیرند، ناظران به شباهت آن با جلد رکورد معروف توجه می کنند. مرتبط چگونه ویزر آن را در آرنا می کشد، 30 سال بعد؟ (نکته: ژنرال Z نیز آنها را دوست دارد) ویزر به عنوان بیلبورد Legends of Live به عنوان ریورز تجلیل شد. در پنجشنبه (نوامبر 19) نشست سه جانبه بین ایالات متحده، روسیه و چین، رهبران مربوطه دونالد ترامپ، ولادیمیر پوتین و شی جین پینگ در مقابل پس زمینه آبی عکس گرفتند. طبیعتاً اینترنت به سرعت مورد توجه قرار گرفت. آلبوم نارنجی یک پست پرطرفدار را در زیر ردیت Weezer خواند، با نظراتی از جمله geezer، My name is POTUS و Everything Won t Be Alright in the End (دو مورد آخر به آهنگ آغازین بلو، My Name Is Jonas و آلبوم گروه در سال 2014، Everything Will Be Alright in the End اشاره دارد). یکی از کامنت‌گذاران از گروه غیرحزبی که از لحاظ تاریخی غیرحزبی هستند، خاطرنشان کرد، آنها باید یک آلبوم سیاسی بسازند و آن را به عنوان جلد داشته باشند. یکی دیگر از Redditor مبتکر، معادله ای برای Nerds را پست کرد و تصویری از گروه پاور پاپ تالی هال با کراوات و اثر هنری آبی را که با عکس سه سیاستمدار برابری می کند، ارائه کرد. نظرات دیگر در مورد پست‌های ردیت این تصویر: جلد آلبوم تک‌آهنگ Everybody Wants to Rule the World (گروه موسیقی کلاسیک Tears For Fears را در آلبوم خود با نام Teal 2019 پوشش داد)، چرخش بی‌پرده Nightmare و این که این خانواده‌ها دنیا را خراب می‌کنند چیست؟", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/putin-xi-trump-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۹ آبان • ۱۸:۵۶"}, {"source": "Billboard", "title": "‘Choosin’ Texas’ Is the 7th CMA Single of the Year Winner to Be Nominated for the Equivalent Grammy: Full List", "link": "https://www.billboard.com/lists/cma-single-of-the-year-winners-nominated-equivalent-grammy/", "summary": "Ella Langley is winding up the biggest week of her career to date. On Monday (Nov. 16), she became the first country artist since Bobbie Gentry in 1968 to pick up Grammy nominations in each of the Big Four categories – album, record and song of the year plus best new artist. Hours later, Billboard revealed that her smash “Choosin’ Texas” logged a record-setting (and mind-boggling) 28th week at No. 1 on the Billboard Hot 100. On Wednesday (Nov. 18), Langley became the first artist to ever win six CMA Awards in one night – entertainer of the year; female vocalist of the year; album of the year for Dandelion ; and single, song and video of the year for “Choosin’ Texas.” By the end of the night, out of things to say, she winningly said, “At this point, I’m sick of me.” Related Ella Langley More Record-Setters at the 2026 CMA Awards “Choosin’ Texas” is the seventh winner of the CMA Award for single of the year to also receive a Grammy nomination for record of the year. The CMA Awards date to 1967, so we can never know if four earlier country hits that received record of the year Grammy nods would have won single of the year at the CMAs: The Browns ’ “The Three Bells” (1959), Jimmy Dean ’s “Big Bad John” (1961), Roger Miller ’s “King of the Road” (1965) and David Houston ’s “Almost Persuaded” (1966). The Fine Print: Elvis Presley ’s “Are You Lonesome To-night?” (1960) was a record of the year nominee and a Hot Country Songs hit (No. 22) but it was primarily a pop record. And Ray Charles ’ exquisite “I Can’t Stop Loving You” (1962) was a record of the year nominee and a country record at its core, but it didn’t chart on Hot Country Songs at the time, a shame. Here are the seven singles that won the CMA Award for single of the year and also received a Grammy nod for record of the year. The year shown is the year of the CMA Awards ceremony.", "date_str": "2026-11-20T15:26:06+00:00", "hash": "47c518f5f6377ebe", "title_fa": "«Choosin» Texas هفتمین برنده CMA سال است که نامزد دریافت جایزه گرمی معادل: فهرست کامل شده است.", "summary_fa": "الا لنگلی در حال پایان دادن به بزرگترین هفته زندگی حرفه ای خود است. در روز دوشنبه (16 نوامبر)، او اولین هنرمند کانتری پس از بابی جنتری در سال 1968 بود که نامزد گرمی در هر یک از چهار دسته بزرگ - آلبوم، آلبوم و آهنگ سال به علاوه بهترین هنرمند جدید شد. ساعاتی بعد، بیلبورد فاش کرد که او با نام Choosin’ Texas رکوردی را ثبت کرد (و حیرت‌انگیز) در هفته بیست و هشتم در رتبه 1 در بیلبورد Hot 100 قرار گرفت. 18)، لنگلی اولین هنرمندی شد که تا به حال شش جایزه CMA را در یک شب برنده شد - سرگرم کننده سال. خواننده زن سال؛ آلبوم سال برای قاصدک ; و تک‌آهنگ، آهنگ و ویدیوی سال برای Choosin’ Texas. در پایان شب، بدون هیچ حرفی، او با پیروزی گفت: \"در این مرحله، من از خودم خسته شده ام.\" مرتبط الا لنگلی رکوردداران بیشتر در جوایز CMA 2026 \"Choosin' Texas\" هفتمین برنده جایزه CMA برای تک آهنگ سال است که همچنین نامزد جایزه گرمی برای رکورد سال شده است. جوایز CMA مربوط به سال 196     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
