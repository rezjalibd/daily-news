<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۱۹ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۱۹ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۱۰ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۷</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۱</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۷</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>
    const data = {
      persian: [{"source": "Independent Persian", "title": "بارش سیل‌آسای آبان؛ قطع راه ۱۹۰ روستای لرستان", "link": "https://www.independentpersian.com/node/423116/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D8%A8%D8%A7%D8%B1%D8%B4-%D8%B3%DB%8C%D9%84%E2%80%8C%D8%A2%D8%B3%D8%A7%DB%8C-%D8%A2%D8%A8%D8%A7%D9%86%D8%9B-%D9%82%D8%B7%D8%B9-%D8%B1%D8%A7%D9%87-%DB%B1%DB%B9%DB%B0-%D8%B1%D9%88%D8%B3%D8%AA%D8%A7%DB%8C-%D9%84%D8%B1%D8%B3%D8%AA%D8%A7%D9%86", "summary": "بارندگی‌های شدید چند روز گذشته در ایران، خیابان‌ها، خانه‌ها و مغازه‌ها را در چندین استان دچار آب‌گرفتگی کرد و به قطع راه‌های روستایی و اختلال در رفت‌وآمد جاده‌ای و ریلی انجامید. در برخی شهرهای مازندران، مردم با قایق و جت‌اسکی وارد خیابان‌های آب‌گرفته شدند. در تهران هم شماری از رانندگان گفتند در بارندگی‌های شنبه و یکشنبه، ۱۶ و ۱۷ آبان، آب از سطح خیابان به داخل خودروهایشان راه پیدا کرده است. همچنین در تهران، مازندران، خوزستان، بوشهر و چند استان دیگر، آب به خانه‌ها و مغازه‌ها نیز وارد شد. سخنگوی سازمان اورژانس ایران اعلام کرد که در سه روز گذشته ۲۵ نفر در حوادث جوی و تصادف‌های جاده‌ای جان باخته‌اند. مجتبی لشگری شمار جان‌باختگان حوادث مرتبط با شرایط جوی را چهار نفر و شمار مصدومان را ۱۱ نفر اعلام کرد. دو نفر از این جان‌باختگان بر اثر اصابت صاعقه در خوزستان کشته شدند. در همین بازه، ۲۱ نفر در تصادف‌های جاده‌ای جان باختند و ۵۳۴ نفر مصدوم شدند. هلال‌احمر روز یکشنبه از درگیری ۱۴ استان خبر داده بود و روز دوشنبه ۱۸ آبان نیز شمار استان‌های متاثر از سیلاب و آب‌گرفتگی در ۷۲ ساعت گذشته را ۱۷ استان اعلام کرد. به گفته حسین ساجدی‌نیا، رئیس سازمان مدیریت بحران کشور، دست‌کم ۲۵ استان تحت تاثیر این بارش‌ها قرار گرفته‌اند. ورود آب به خانه‌ها و مغازه‌ها در تهران، گزارش‌های شهروندی از بسته‌شدن شماری از مسیرها و ورود آب به خودروها حکایت دارد. برخی شهروندان از نحوه رسیدگی شهرداری به آب‌گرفتگی معابر انتقاد کردند. در شمال و غرب پایتخت هم بارش‌ها سطح آب رودخانه‌ها را بالا برد و در بستر رودخانه کن سیلاب جاری شد. در البرز، محور کندوان در ۴۸ ساعت شش بار گرفتار سیلاب شد و راهداران سه نقطه از جاده کرج به کندوان را  "summary": "کیا مجسمه‌ای در ابعاد واقعی از هاچ‌بک الکتریکی EV4 GT را با خاک زمین‌های مسابقات رافائل نادال ساخت.", "date_str": "2026-11-09T14:10:00+00:00", "hash": "2e62908dcb2f494f", "title_fa": "خودرویی «خاکی» که نمونه‌اش در دنیا وجود ندارد؛ هدیه شگفت‌انگیز کیا به اسطوره تنیس", "summary_fa": "کیا مجسمه‌ای در ابعاد واقعی از هاچ‌بک الکتریکی EV4 GT را با خاک زمین‌های مسابقات رافائل نادال ساخت. تبلیغات کیا مجسمه‌ای با ابعاد واقعی و غیرقابل رانندگی از هاچ‌بک الکتریکی EV4 GT تولید کرد که در ساخت آن از خاک زمین‌های تنیس محل قهرمانی‌های رافائل نادال بهره برده است. ماکت در آکادمی رافا نادال واقع در مایورکا به این اسطوره‌ی اسپانیایی اهدا شد تا همکاری دیرینه‌ی دو طرف گرامی داشته شود. سازندگان به جای رنگ و فلز، خاک زمین‌های تنیس مونت‌کارلو، پاریس، رم و مادرید را با خاک مدل‌سازی ترکیب کرده‌اند. نوارهای سفید طراحی خودرو نیز خطوط زمین تنیس را روی بدنه‌ی نارنجی‌رنگ بازسازی می‌کنند. سو هانگ چانگ ، مدیرعامل کیا در اروپا، گفت: «عزم و انعطاف‌پذیری رافائل الهام‌بخش بازیکنان و هواداران تنیس در سراسر جهان بوده است و همان ارزش‌ها از سال ۲۰۰۴ هسته‌ی اصلی همکاری ما به‌شمار می‌روند.» روی بدنه‌ی ماکت، ۶۳ عنوان قهرمانی انفرادی نادال در زمین خاکی، رکورد برد ۵۰ ست پیاپی و ۵ فصل پایان‌یافته با رتبه‌ی یک جهان حک شده است. نادال درباره‌ی این هدیه گفت: «بیش از ۲۰ سال، کیا در تمام دوران حرفه‌ای، فرازها و چالش‌ها کنار من بوده است. دریافت این ادای احترام، ساخته‌شده از موادی که بخش اعظم مسیر من را تعریف کرد، فوق‌العاده معنادار محسوب می‌شود.» نسخه‌ی جاده‌ای EV4 GT مجهز به دو موتور با سامانه چهارچرخ محرک و قدرت ۲۸۸ اسب‌بخار است که شتاب صفر تا صد آن به ۵٫۶ ثانیه می‌رسد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/kia-ev4-clay-edition-rafael-nadal-6af193e3354e588119e487ba?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۷:۴۰"}, {"source": "Zoomit", "title": "بانک مرکزی به‌زودی اعطای مجوز به mbat training center, that critical link can disappear on the far side of the rolling hills and thick forests that make the terrain particularly useful for war games. The Army is looking to the sky for answers to the problem. The service wants to use drones as airborne communications relays that can help pilots maintain control of uncrewed aircraft operating beyond the reach of a direct line-of-sight signal. Locked in a drone war with Russia, Ukraine has already turned to this approach on the battlefield, using relay drones to extend the connection between a pilot and a mission drone. Similar to how WiFi extenders work, these airborne signal repeaters are typically small quadcopters that can fly higher than ground-based antennas, allowing the mission drone to fly farther. Roughly 50 Ukrainian soldiers participated in Combined Resolve, a recurring large-scale US Army exercise held last month at the Joint Multinational Readiness Center in Bavaria, north of Munich. Business Insider spent two days observing the training exercise, a kind of stress test for the Army as the service integrates drones, electronic warfare, and other emerging technologies into its armor operations to make tanks and infantry fighting vehicles more survivable on modern battlefields. Army officers said that the US is learning many lessons from Ukraine and from its visiting soldiers, who participated in the exercise alongside the 1st Armored Division's 1st Armored Brigade Combat Team (1/1 ABCT) as it fought an opposition force simulating an enemy. One of these lessons is how to use relay drones for extended range, said Capt. Kevin Rincon, the troop commander of the multifunctional reconnaissance company, 1/1 ABCT's action arm. Ukraine uses relay drones to extend the range of other drones on strike and surveillance missions. Jake Epstein/Business Insider Speaking in the dense forest surrounded by armored vehicles, Rincon said fine-tuning the ability to operate relay drones and extend the range of mi", "date_str": "2026-11-09T14:14:26+00:00", "hash": "625ef55bfb36cd00", "title_fa": "سربازان ارتش ایالات متحده در حال گرفتن صفحه ای از کتاب بازی اوکراین برای پرواز پهپادهای دورتر هستند", "summary_fa": "یک سرباز آمریکایی در حال شبیه سازی یک دشمن یک پهپاد را در جریان تمرین اخیر برمی دارد. جیک اپستاین/Business Insider سربازان ارتش ایالات متحده که در آلمان آموزش می بینند از پهپادهای رله برای گسترش دامنه عملیات خود استفاده می کنند. رله‌ها سیگنال بین خلبان و هواپیمای بدون سرنشین مأموریت خود را گسترش می‌دهند و به آنها اجازه می‌دهند دورتر پرواز کنند. این تاکتیکی است که در اوکراین اهمیت فزاینده ای پیدا کرده است. هوهنفلز، آلمان - یک پهپاد فقط تا جایی می تواند پرواز کند که خلبانش بتواند ارتباط را حفظ کند. در مرکز اصلی آموزش رزمی خارج از کشور ارتش ایالات متحده، این پیوند حیاتی می تواند در سمت دور تپه های غلتان و جنگل های انبوه ناپدید شود که زمین را به ویژه برای بازی های جنگی مفید می کند. ارتش به دنبال پاسخ به این مشکل به آسمان است. این سرویس می‌خواهد از هواپیماهای بدون سرنشین به عنوان رله‌های ارتباطی هوابرد استفاده کند که می‌تواند به خلبانان کمک کند تا کنترل هواپیمای بدون خدمه را که خارج از دسترس سیگنال مستقیم خط دید هستند، حفظ کنند. اوکراین که در جنگ هواپیماهای بدون سرنشین با روسیه قفل شده است، قبلاً در میدان نبرد به این رویکرد روی آورده است و از پهپادهای رله برای گسترش ارتباط بین خلبان و پهپاد مأموریتی استفاده می کند. مشابه نحوه کار اکستندرهای وای‌فای، این تکرارکننده‌های سیگنال هوابرد معمولاً کوادکوپترهای کوچکی هستند که می‌توانند بالاتر از آنتن‌های زمینی پرواز کنند و به پهپاد مأموریت اجازه پرواز دورتر را می‌دهند. تقریباً 50 سرباز اوکراینی در Combined Resolve، یک رزمایش مکرر در مقیاس بزرگ ارتش ایالات متحده که ماه گذشته در مرکز مشترک آمادگی چندملیتی در باواریا، در شمال مونیخ برگزار شد، شرکت کردند. Business Insider دو روز را صرف مشاهده تمرینات آموزشی کرد، نوعی تست استرس برای ارتش زیرا این سرویس پهپادها،", "image_url": "https://i.insider.com/6aec6f17308912814ed71263?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۷:۴۴"}, {"source": "Business Insider", "title": "They quit Cohere to go into law. They say their new firm can avoid Weil's fate.", "link": "https://www.businessinsider.com/startup-law-firm-blackletter-raises-6-million-from-lerer-hippeau-2026-11", "summary": "Blackletter founders Avi Brudner, David Stewart, and Jonathan Rosenbluth. Blackletter Blackletter is the latest startup law firm trying to take clients away from Big Law. The Canadian neofirm has raised a $6 million seed round led by Lerer Hippeau. The founders think it can avoid Weil's fate by building a system that learns from past work. Artificial intelligence has forced Big Law to rethink how legal work gets done and how clients pay for it. The collapse of law firm Weil Gotshal shows how quickly the traditional model can come apart. The founders of Blackletter, a new Canadian neofirm, say artificial intelligence offers a way to build something sturdier. Blackletter has raised a $6 million seed round led by Lerer Hippeau, its cofounder and chief executive, Jonathan Rosenbluth, told Business Insider. The firm combines technology and lawyers to offer businesses legal services for flat fees. The investment marks Lerer Hippeau's first check in legal, a firm spokesperson said. Other Blackletter backers include Seven Stars, Maple VC, Garage Ventures, and Ripple Ventures, as well as Cohere's founders, Aidan Gomez, Nick Frosst, and Ivan Zhang. Rosenbluth saw Weil as a reminder of the existential risk facing legacy firms. Rainmakers can walk at any time. Clients can follow. And a partnership can collapse with the speed of a bank run. Blackletter is betting its clients will come back not because of the relationship with one partner, but because Blackletter understands their business and does the work well. Its lawyers use software built on large language models to draft and negotiate routine corporate contracts and guide transactions from term sheet through diligence and signing. The firm says it has more than 75 clients, including Fanatics, TwelveLabs, and Ada, which has just agreed to merge with fellow customer service agent company Dialpad in a $600 million deal. The lessons from each matter Blackletter works on are meant to inform the next, Rosenbluth said. Lawyers refine how they use the tools, while engineers adapt the technology to help them get better results. Rosenbluth spent a summer during law school at Skadden , where he watched associates a decade his senior grind through menial work. He felt drawn to the legal industry, he said, but the experience convinced him that traditional practice was not the career for him. Before starting Blackletter, he rose through the ranks at Cohere , the fast-growing artificial intelligence model maker, where he led par", "date_str": "2026-11-09T14:00:01+00:00", "hash": "ded9a384c0211f91", "title_fa": "آنها از Cohere خارج شدند تا وارد قانون شوند. آنها می گویند که شرکت جدیدشان می تواند از سرنوشت ویل جلوگیری کند.", "summary_fa": "بنیانگذاران Blackletter، آوی برودنر، دیوید استوارت و جاناتان روزنبلوت. Blackletter Blackletter جدیدترین شرکت حقوقی استارتاپی است که سعی دارد مشتریان را از قانون بزرگ دور کند. شرکت نئوفیرمای کانادایی مبلغ 6 میلیون دلاری را به رهبری لرر هیپو جمع آوری کرده است. بنیانگذاران فکر می کنند که می تواند با ساختن سیستمی که از کارهای گذشته درس می گیرد، از سرنوشت ویل جلوگیری کند. هوش مصنوعی بیگ لاو را وادار کرده است تا درباره نحوه انجام کارهای قانونی و نحوه پرداخت هزینه های مشتریان تجدیدنظر کند. فروپاشی شرکت حقوقی ویل گوتشال نشان می دهد که مدل سنتی چقدر سریع می تواند از هم پاشیده شود. بنیان‌گذاران Blackletter، یک شرکت جدید کانادایی، می‌گویند هوش مصنوعی راهی برای ساختن چیزی قوی‌تر ارائه می‌کند. جاناتان روزن‌بلوت، بنیانگذار و مدیر اجرایی بلک‌لتتر، سرمایه‌گذاری 6 میلیون دلاری به رهبری لرر هیپو، به بیزینس اینسایدر گفت. این شرکت فناوری و وکلا را برای ارائه خدمات حقوقی به مشاغل با هزینه های ثابت ترکیب می کند. سخنگوی این شرکت گفت که این سرمایه گذاری اولین بررسی قانونی لرر هیپو است. سایر حامیان Blackletter عبارتند از Seven Stars، Maple VC، Garage Ventures و Ripple Ventures و همچنین بنیانگذاران Cohere، آیدان گومز، نیک فراست و ایوان ژانگ. روزن بلوث ویل را یادآور خطر وجودی پیش روی شرکت های قدیمی می دانست. باران‌سازان می‌توانند در هر زمانی راه بروند. مشتریان می توانند دنبال کنند. و یک مشارکت می تواند با سرعت یک بانک از بین برود. بلک‌لتتر شرط می‌بندد که مشتریانش نه به خاطر رابطه با یک شریک، بلکه به این دلیل که بلک‌لت کسب‌وکار آنها را درک می‌کند و کار را به خوبی انجام می‌دهد. وکلای آن از نرم‌افزار ساخته شده بر روی مدل‌های زبان بزرگ برای پیش‌نویس و مذاکره قراردادهای معمول شرکتی و هدایت معاملات از برگه‌های مدت از طریق دقت و امضا استفاده می‌کنند. این شرکت می‌گوید", "image_url": "https://i.insider.com/6aecdba5c54bfafa65abf6d1?width=1024&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I spent 6 months visiting friends all over the country. It was a good reminder not to let distance get in the way.", "link": "https://www.businessinsider.com/traveled-country-visit-friends-distance-friendship-2026-11", "summary": "The author, right, visited friends in NYC. Courtesy of Asha Dore I spent months traveling the country to see friends just as I was turning 40. I enjoyed my time alone while traveling, as well as time with friends. Even a short visit made me feel closer to friends. For the last 10 years, I've celebrated my birthday with small family meals, but as I was turning 40, I changed it up. After getting a taste of solo travel last year during the holidays, I wanted more. My closest friends were spread out across the country, so I decided to visit as many as I could, and spent about six months traveling. What I had imagined as a fun, sweet time became so much more. I deepened friendships I'd made through writing I started my travels a few months before my birthday when two fellow journalists invited me to a girls' weekend at one of their homes in Chicago in the middle of winter. There, I fell in love with deep-dish pizza and glazed duck wings, and felt a somewhat professional relationship deepen into true friendship. It only took minutes of hanging out in real life for me to realize how much I trusted these two women — and how easy it would be for me to help them with whatever they needed, whenever they asked. A few weeks later, we teamed up again with three more friends in New York City to attend a book launch party at our teacher's house. This group is intergenerational — from mid-20s to 60s. We all met in an online writing class two years ago, and we've been meeting weekly on Zoom to talk about our work ever since. Our NYC trip marked the first chance we'd had to meet in person, and it felt like we'd known each other far longer than we had. We are all from different regions of the country, working day jobs in totally different fields, but we share a profound creative optimism. Online, those vibes helped us become friends. In real life, the energy was electric. The author visited a friend in Florida. Courtesy of Asha Dore I saw my high school BFF twice On my actual birthday in March, I met my high school BFF in Sonoma for a long weekend. She came from Florida, and I flew in from my home in Seattle. Since 2021, we have been meeting in different cities once a year to explore the town, chill, and talk about our lives. Complete with a wine tour , a lot of walks through the quiet streets, and evenings at the hotel hot tub, our trip was a vacation in the truest sense — and a necessary annual recharge of our 25-year friendship. I saw her again a few weeks later in Central", "date_str": "2026-11-09T13:15:01+00:00", "hash": "820cea1dfe8335bc", "title_fa": "من 6 ماه را صرف دیدار دوستان در سراسر کشور کردم. یادآوری خوبی بود که نگذارید فاصله مانع شود.", "summary_fa": "درست است که نویسنده از دوستانش در نیویورک دیدن کرده است. با حسن نیت از Asha Dore من ماه ها را صرف سفر به کشور کردم تا دوستانم را ببینم درست زمانی که 40 ساله شدم. از زمان تنهایی خود در سفر       media: [{"source": "Billboard", "title": "Publishers Quarterly: Sony Music Publishing Makes History Again in Q3", "link": "https://www.billboard.com/pro/ella-langley-sony-top-music-publisher-rankings-q3/", "summary": "This year, Sony Music Publishing keeps topping its own record-breaking performances as measured by Billboard ’s 20-year-long history of ranking music publishers by market share for hit songs. After scoring the highest-ever market share for the Hot 100 in the second quarter with 37.32%, Sony has now become the first publisher ever to surpass the 40% market share milestone with 42.86% in the just-completed third quarter, setting a new record for that chart. Related 2026 Q3 Record Label Market Share: UMG Rebounds, Columbia Climbs Michael Sanft, Attorney Who Represented Keffe D in 2Pac Murder Trial, Dies at 54 Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 That performance makes Sony the top-ranked publisher for the Hot 100 chart, while it was also the No. 1 publisher on the Top Radio Airplay chart, with a 36.02% tally, thus keeping its No. 1 streak going on both charts for the sixth consecutive quarter. To accomplish that feat, Sony claimed 76 songs on the Hot 100 chart and 74 songs on the Radio Airplay Songs list, including Ella Langley ’s “Choosin’ Texas,” which finished at No. 1 and No. 2, respectively. Also helping Sony maintain its No. 1 ranking was its role as the administrator for the top songwriter on the Radio Airplay chart, Shane “ sombr ” Boose, who placed three songs on that chart, including the No. 30 tune “Back To Friends.” Perhaps the most astounding part of Sony’s performance on the Hot 100 publisher rankings this quarter is that it beat out the No. 2 publisher by 25 percentage points. Coming in second place this quarter was Warner Chappell Music, which turned in a 17.86% market share on the Hot 100 rankings. On the Top Radio Airplay rankings, Warner Chappell was also the No. 2-ranked publisher with a stronger showing, where it tallied a 23.07% market share. On the Top Radio Airplay song list, Warner Chappell snared a stake in 55 songs, with its top song being the No. 3 tune, Bruno Mars ’ “Risk It All.” It also had 44 songs on the Hot 100 chart, with its top song, Ariana Grande ’s “hate that I made you love me,” landing at No. 4. This marks the third consecutive quarter that Warner Chappell ranked at No. 2 on both charts. For the 12th consecutive quarter, Warner Chappell was also the top-ranked publisher on the Country Radio Airplay chart with a 33.12% share. Similarly, for the third consecutive quarter, Universal Music Publishing Group, Kobalt and BMG ranked, respectively, No. 3, No. 4 and No. 5 on both ch", "date_str": "2026-11-09T15:00:00+00:00", "hash": "b481cc1351af6eb7", "title_fa": "فصلنامه ناشران: انتشارات موسیقی سونی دوباره در سه ماهه سوم تاریخ می‌سازد", "summary_fa": "امسال، Sony Music Publishing همچنان در صدر اجراهای رکوردشکن خود قرار دارد که با سابقه بیست ساله بیلبورد در رتبه‌بندی ناشران موسیقی بر اساس سهم بازار برای آهنگ‌های موفق اندازه‌گیری شده است. پس از کسب بالاترین سهم بازار برای Hot 100 در سه ماهه دوم با 37.32 درصد، سونی اکنون به اولین ناشر تبدیل شده است که از 40 درصد سهم بازار با 42.86 درصد در سه ماهه سوم که به تازگی تکمیل شده است، پیشی گرفته و رکورد جدیدی را برای این نمودار ثبت کرده است. سه‌ماهه سوم سال 2026 سهم بازار مرتبط: UMG Rebounds، Columbia Climbs Michael Sanft، وکیل مدافع Keffe D در دادگاه قتل 2Pac، فوت در 54 سالگی Kenny MacPherson، ناشر کهنه کار موسیقی و بنیانگذار Big Deal Music، سونی را در رتبه 70 منتشر کرد. نمودار، در حالی که با 36.02 درصد در رتبه اول ناشر در چارت Top Radio Airplay قرار داشت، بنابراین ردیف شماره 1 خود را برای ششمین سه ماهه متوالی در هر دو نمودار حفظ کرد. برای انجام این موفقیت، سونی 76 آهنگ را در جدول Hot 100 و 74 آهنگ را در لیست آهنگ های Radio Airplay Songs از جمله \"Choosin' Texas\" از الا لنگلی، که به ترتیب در رتبه های 1 و 2 قرار گرفت، به دست آورد. همچنین به سونی کمک کرد تا رتبه 1 خود را حفظ کند، نقشش به عنوان مدیر آهنگساز برتر نمودار Radio Airplay، Shane “sombr” Boose، که سه آهنگ از جمله شماره شماره را در آن نمودار قرار داد. 30 آهنگ \"بازگشت به دوستان.\" شاید شگفت‌انگیزترین بخش عملکرد سونی در رتبه‌بندی ناشر Hot 100 در این سه‌ماهه این باشد که با 25 درصد برتری از ناشر شماره 2 پیشی گرفت. در رتبه دوم در این سه ماهه Warner Chappell Music بود که 17.86 درصد از سهم بازار را در رتبه بندی Hot 100", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Ella-Langley-Getty-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "2027 Grammy Nominations Final Predictions: Album of the Year", "link": "https://www.billboard.com/lists/2027-grammy-nominations-album-of-the-year-predictions/", "summary": "Ella Langley ’s dream year is likely to culminate in a sweep when the nominations for the 69th annual Grammy Awards are announced on Monday (Nov. 16). Thanks to a rule change in the best new artist category that was announced in June, which allows an artist to be entered four times instead of three, Langley could be nominated in four of the six general field categories — album, record and song of the year plus best new artist. If that happens, Langley will become the first country crossover artist to achieve the feat since Bobbie Gentry in 1968. We first previewed the Grammy nominations in these marquee categories back in July. Starting today, we’re going to update those predictions, as needed. First up, album of the year, probably the most prestigious and coveted of the 100 Grammy Awards. On Tuesday, we’ll look at record and song of the year. On Wednesday, we’ll take on best new artist. Related Here’s Where Genre-Bending Albums From Rosalía, Noah Kahan, Charli xcx More Landed on 2027 Grammy Ballot For the fourth year in a row, there will be eight nominees in each of these categories. The eligibility period for the 69th annual Grammy Awards ran from Aug. 31, 2025, through Aug. 28, 2026. The field of likely album of the year contenders hasn’t changed much since we first previewed them in July . I bumped Don Toliver ’s Octane up from “Within Reach” to the top tier, taking the place of RAYE ’s This Music May Contain Hope., which is competing with a more commercially successful album by another classy English pop-soul singer, Olivia Dean . Both albums could make it, of course, but with many strong albums vying for just eight slots on the final ballot, something’s gotta give. Related Categories With the Most Fewest Entries for 2027 Grammys Paul McCartney and Taylor Swift are both going for history. If McCartney is nominated for The Boys of Dungeon Lane , it will be his record-extending 10th career nomination in this category. If Swift is nominated for The Life of a Showgirl , it will be her eighth nod in this category — more than anyone else in Grammy history for strictly solo albums. Swift is a better bet: She has been nominated in this category with each of her last four regular studio albums. McCartney was last nominated here in 2006. We show the deluxe editions of hit albums by Noah Kahan and Rosalía because those are the ones that were entered in the Grammy competition. A total of 683 albums were on the eligibility list in this category. Here are our best ", "date_str": "2026-11-09T15:00:00+00:00", "hash": "fc9b46bdc978d0e1", "title_fa": "پیش بینی های نهایی نامزدهای گرمی 2027: آلبوم سال", "summary_fa": "زمانی که نامزدهای شصت و نهمین جوایز سالانه گرمی در روز دوشنبه (16 نوامبر) اعلام شود، احتمالاً سال رویایی الا لنگلی به اوج خود می رسد. به لطف تغییر قانون در رده بهترین هنرمند جدید که در ماه ژوئن اعلام شد، که به یک هنرمند اجازه می‌دهد به جای سه بار، چهار بار وارد شود، لنگلی می‌تواند در چهار مورد از شش دسته کلی رشته - آلبوم، ضبط و آهنگ سال به علاوه بهترین هنرمند جدید نامزد شود. اگر این اتفاق بیفتد، لنگلی اولین هنرمند متقاطع کانتری خواهد بود که پس از بابی جنتری در سال 1968 به این شاهکار دست یافته است. ما برای اولین بار در ماه جولای پیش نمایش نامزدهای گرمی را در این دسته های خیمه شب بازی مشاهده کردیم. از امروز، در صورت لزوم، آن پیش‌بینی‌ها را به‌روزرسانی می‌کنیم. اول، آلبوم سال، احتمالاً معتبرترین و مورد علاقه‌ترین آلبوم در بین 100 جایزه گرمی. روز سه‌شنبه، آهنگ و آهنگ سال را بررسی خواهیم کرد. روز چهارشنبه، بهترین هنرمند جدید را بازی خواهیم کرد. موارد مرتبط اینجاست که آلبوم‌های ژانرآمیز از Rosalía، Noah Kahan، Charli xcx بیشتر در رای گیری گرمی 2027 فرود آمدند برای چهارمین سال متوالی، هشت نامزد در هر یک از این دسته‌ها وجود خواهد داشت. دوره صلاحیت برای شصت و نهمین دوره جوایز سالانه گرمی از 31 اوت 2025 تا 28 اوت 2026 ادامه داشت. زمینه رقبای احتمالی آلبوم سال از زمانی که برای اولین بار در جولای پیش نمایش آنها را مشاهده کردیم، تغییر چندانی نکرده است. من اکتان Don Toliver را از \"Within Reach\" به بالاترین سطح رساندم و جای آلبوم RAYE's This Music May Contain Hope را گرفتم، که با آلبوم موفق‌تر تجاری‌تر از خواننده باکلاس پاپ سول انگلیسی، اولیویا دین رقابت می‌کند. البته هر دو آلبوم می‌توانند به آن برسند، اما با وجود بسیاری از آلبوم‌های قوی که فقط", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2293220773-e1793989817474.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Justin Timberlake Makes Rare Public Appearance With Sons and Niece on Runway at Down Syndrome Foundation Fashion Show", "link": "https://www.billboard.com/music/pop/justin-timberlake-sons-niece-down-syndrome-foundation-show-1236377886/", "summary": "Justin Timberlake made a rare public appearance with his two young sons, 11-year-old Silas and 6-year-old Phineas, as the family gathered in Denver on Saturday (Nov.7) to help celebrate the Global Down Syndrome Foundation s 19th annual fashion show. Related Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City Justin Timberlake Crowns This FutureSex/LoveSounds Hit as the Best Song He s Ever Made: Written in Damn Near 20 Minutes Michael Jackson s Thriller Scares Up Highest Rank on Billboard 200 Albums Chart in More Than 40 Years According to People magazine, Timberlake walked the runway with his 7-year-old niece, Zaya, while attending the nonprofit s Be Beautiful Be Yourself fashion show in the Mile High city in support of brother-in-law Justin Biel and his wife Rose s daughter, who has Down syndrome. “Jessica and I adore Zaya, and we couldn’t be prouder of the remarkable difference she is making in the world,” Timberlake said in a statement shared with the organization, the magazine reported. “Every person with Down syndrome deserves the opportunity to reach their full potential, and that’s why GLOBAL’s work means so much to our family.” In an Instagram Story featuring a picture of the singer, his sons and Zaya, he wrote , We walked my beautiful niece Zaya down the @globaldownsyndrome runway last night ❤️. He followed that with a slide in which he held a smiling Zaya in his arms on the red carpet, with the caption Proud uncle! In photos from the night, Zaya held her uncle and cousin Silas hands as she walked down the catwalk with a big smile. The Timberlake men came dressed to impress, with Justin rocking a roomy black suit, while Phineas matched his dad s energy in all black and Silas opted for black pants with a black leather jacket over a white shirt and black tie, accented by sunglasses. Zaya made her own statement in a black-and-white polka dot cress and fringe boots. In a video from the event , JT and Silas bust some moves as Zaya gets a boost up onto the singer s hip as they wave to the crowd. She has some moves. Maybe her uncle Justin has taught her some moves and her auntie Jessica, says the show s announcer to cheers from the audience. The organization teased the appearance last week, posting a pic of Timberlake and wife Jessica Biel with her brother and his wife, writing, 🎉 BIG NEWS! Grammy and Emmy Award-winning superstar @justintimberlake will rock the runway with his beautiful niece, #GLOBALAmbassador alum Zaya Biel @", "date_str": "2026-11-09T14:21:20+00:00", "hash": "b5c07c1ca0a26513", "title_fa": "حضور نادر جاستین تیمبرلیک با پسران و خواهرزاده‌اش در ران وی در فشن شوی بنیاد سندروم داون", "summary_fa": "جاستین تیمبرلیک با دو پسر خردسال خود، سیلاس 11 ساله و فینیاس 6 ساله، در حالی که خانواده در روز شنبه (7 نوامبر) در دنور گرد هم آمدند تا نوزدهمین نمایشگاه مد سالانه بنیاد جهانی سندروم داون را جشن بگیرند، حضور نادری در عموم داشت. تیلور سوئیفت و کارلی کلوس مرتبط در بازی تراویس کلس در کانزاس سیتی حضور دارند. بیش از 40 سال به نقل از مجله People، تیمبرلیک در حالی که برای حمایت از برادر شوهر جاستین بیل و همسرش دخترش رز مبتلا به سندروم داون در نمایشگاه مد غیرانتفاعی Beautiful Be Yourself در شهر مایل بالا شرکت می کرد، همراه با خواهرزاده 7 ساله خود، زایا، روی باند فرودگاه رفت. تیمبرلیک در بیانیه‌ای که با این سازمان به اشتراک گذاشته شد، گفت: من و جسیکا زایا را می‌پرستیم و نمی‌توانیم به تفاوت قابل توجهی که او در جهان ایجاد می‌کند افتخار کنیم. هر فرد مبتلا به سندرم داون سزاوار این فرصت است که به پتانسیل کامل خود دست یابد و به همین دلیل است که کار GLOBAL برای خانواده ما بسیار مهم است. او در استوری اینستاگرامی با تصویری از این خواننده، پسرانش و زایا، نوشت: دیشب خواهرزاده زیبایم زایا را در باند فرودگاه @globaldownsyndrome پیاده کردیم. او آن را با یک اسلاید دنبال کرد که در آن زایا خندان را روی فرش قرمز در آغوش گرفته بود، با نوشته عموی مغرور! در عکس‌هایی از شب، زایا در حالی که با لبخندی بزرگ از سکوی راه می‌رفت، دست عمو و پسر عمویش سیلاس را گرفته بود. مردان تیمبرلیک با لباس پوشیدن آمدند تا تحت تأثیر قرار بگیرند، جاستین یک کت و شلوار مشکی جادار را تکان می داد، در حالی که فینیاس با انرژی پدرش به رنگ مشکی کاملاً هماهنگ می شد و سیلاس شلوار مشکی را با کت چرمی مشکی روی پیراهن سفید و کراوات مشکی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2304072901-e1794234332591.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۱۷:۵۱"}, {"source": "Billboard", "title": "NCT DREAM Takes a Nostalgic Trip With ‘Boogie Woogie’ Video: Exclusive Behind-the-Scenes Photos", "link": "https://www.billboard.com/photos/nct-dream-boogie-woogie-video-behind-the-scenes-photos-1236375284/", "summary": "RENJUN, JENO, HAECHAN, JAEMIN, CHENLE and JISUNG were first introduced as NCT DREAM , the colorful and bright teenage unit within NCT 10 years ago, and have since grown into one of K-pop’s leading acts while maintaining their roots musically with themes of youth and self-discovery. The group’s music has continued to evolve alongside the members and their fans, with everything they experienced together over the past decade. Now, following the six members’ contract renewal with label SM Entertainment, NCT DREAM enters a new chapter and celebrates this milestone with its sixth studio album, DREAM AFTER DREAM , which arrived Nov. 9. Related A Release Calendar of Upcoming Albums in 2026 The album features lead track “Boogie Woogie,” a song that JENO describes to Billboard as “a celebration of the past 10 years we’ve shared with our fans, and a way for us to all have fun together.” That celebratory spirit and the brotherhood the members have built together come to life in exclusive photos shared with Billboard from the set of the “Boogie Woogie” music video, which was released the same day as the album. “Boogie Woogie” blends ’70s disco-funk influences with modern synths, capturing the joy of looking back on the past while embracing everything still to come, and its music video reflects that same celebratory spirit. Cowritten by JAEMIN, the track features lyrics that commemorate NCT DREAM’s decade together, expressing gratitude for the memories they’ve shared and how even the simplest moments become meaningful when spent together. The group’s brotherhood is a recurring theme throughout DREAM AFTER DREAM , as shown in the music video for the album’s opening track, “The Sun,” just a few weeks before the album s arrival. JENO sums up the “Boogie Woogie” music video in three words: retro, quirky and celebration. “The music video features nostalgic spots for us, like a neighborhood stationery store, a Korean snack bar, a shopping mall and a bowling alley, which really give it that retro feel, he tells Billboard . It s also packed with unexpected, funny moments, like a swing spinning 360 degrees or someone suddenly popping out of a fridge!” See Billboard s exclusive photos from the music video s set below.", "date_str": "2026-11-09T14:03:23+00:00", "hash": "9c4341d706e87f89", "title_fa": "NCT DREAM با ویدیوی «Boogie Woogie» سفری نوستالژیک می‌کند: عکس‌های اختصاصی از پشت صحنه", "summary_fa": "RENJUN، JENO، HAECHAN، JAEMIN، CHENLE و JISUNG برای اولین بار به عنوان NCT DREAM، واحد نوجوانان رنگارنگ و روشن در NCT 10 سال پیش معرفی شدند و از آن زمان به یکی از کنش های برجسته کی پاپ تبدیل شدند و در عین حال ریشه های خود را از نظر موسیقی با مضامین جوانی و خودشناسی حفظ کردند. موسیقی این گروه در کنار اعضا و طرفدارانشان، با هر آنچه که در دهه گذشته با هم تجربه کردند، به تکامل خود ادامه داده است. اکنون، پس از تمدید قرارداد شش عضو با لیبل SM Entertainment، NCT DREAM وارد فصل جدیدی شده و این نقطه عطف را با ششمین آلبوم استودیویی خود، DREAM AFTER DREAM، که در 9 نوامبر عرضه شد، جشن می گیرد. مربوط به تقویم انتشار آلبوم‌های آینده در سال 2026 این آلبوم دارای آهنگ اصلی «Boogie Woogie» است، آهنگی که JENO آن را به بیلبورد به عنوان «جشن 10 سال گذشته که با طرفداران خود به اشتراک گذاشته‌ایم، و راهی برای همه ما برای خوشگذرانی با هم» توصیف می‌کند. این روحیه جشن و برادری که اعضا با هم ایجاد کرده‌اند در عکس‌های اختصاصی به اشتراک گذاشته شده با بیلبورد از مجموعه موزیک ویدیوی «Boogie Woogie» که در همان روز آلبوم منتشر شد، زنده می‌شوند. \"Boogie Woogie\" تأثیرات دیسکو-فانک دهه 70 را با ترکیبات مدرن ترکیب می کند و لذت نگاه کردن به گذشته را در حالی که همه چیزهای آینده را در آغوش می کشد به تصویر می کشد و موزیک ویدیوی آن همان روحیه جشن را منعکس می کند. این آهنگ که توسط JAEMIN نوشته شده است، دارای اشعاری است که به یاد دهه NCT DREAM با هم هستند، و از خاطراتی که آنها به اشتراک گذاشته‌اند و اینکه چگونه ساده‌ترین لحظات در کنار هم بودن معنادار می‌شوند، ابراز قدردانی     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
