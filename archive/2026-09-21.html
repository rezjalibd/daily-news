ogy. The QM7L s SQD tech helps to enable a wide, ", "date_str": "2026-09-20T15:31:01+00:00", "hash": "e1b645fa48fec9ec", "title_fa": "بهترین تلویزیون های 85 اینچی سال 2026", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید TCL X11L یکی از پیشرفته ترین تلویزیون های 85 اینچی است که ما آزمایش کرده ایم. استیون کوهن/Business Insider اگر می خواهید اتاق نشیمن شما شبیه یک سینمای خانگی باشد، اندازه صفحه نمایش اهمیت زیادی دارد. بهترین تلویزیون‌های 85 اینچی مقیاسی را ارائه می‌کنند که مجموعه‌های کوچک‌تر نمی‌توانند با آن مطابقت کنند. فیلم‌ها بیشتر سینمایی به نظر می‌رسند و بازی‌های ویدیویی جذاب‌تر به نظر می‌رسند. این اندازه همچنین برای مهمانی های ساعت بازی در طول فصل NFL مناسب است. جنبه منفی؟ هنگامی که به این اندازه بپرید، قیمت ها به سرعت افزایش می یابد. به همین دلیل انتخاب مدل مناسب واقعا اهمیت دارد. شما آن فاکتور wow را بدون پرداخت بیشتر از آنچه نیاز دارید می خواهید. برای سهولت تصمیم گیری، بهترین تلویزیون های 85 اینچی (و چند گزینه 83 اینچی) را که می توانید بخرید جمع آوری کرده ام. من بیش از یک دهه را صرف بررسی تجهیزات سینمای خانگی کرده‌ام، و من و تیمم تلویزیون‌ها را در تمام طول سال از نظر کیفیت تصویر، ویژگی‌های هوشمند و ارزش کلی آزمایش می‌کنیم. بر اساس یافته های ما، TCL QM7L بهترین انتخاب من برای اکثر نیازها است. پنل SQD آن روشنایی عالی، کنتراست جامد و طیف رنگی بسیار گسترده را با قیمت بسیار رقابتی ارائه می دهد. اما اگر OLED با سطوح سیاه عمیق تر و زاویه دید وسیع تر می خواهید، من سامسونگ S90F را توصیه می کنم. اگرچه گران تر است، اما یک تلویزیون با صفحه بزرگ فوق العاده برای سینماهای خانگی است. یادداشت ویرایشگر: اکثر تلویزیون های LED و QLED در اندازه های 85 یا 86 اینچی هستند، در حالی که تلویزیون های OLED در سایز 83 اینچی ارائه می شوند. این در حالی است که تلویزیون های"}, {"source": "Business Insider", "title": "How America's Best Restaurant Serves 450 Pounds Of Meat Every Week", "link": "https://www.businessinsider.com/how-americas-best-restaurant-serves-450-pounds-of-meat-2026-9", "summary": "Kabawa was just named the best restaurant in America by Food Wine, and the best in New York City by The New York Times. So, what does it take to run a full service at America's best restaurant? A 50-person team turns eight and a half hours of prep into a $150, three-course Caribbean prix fixe for 125 guests each night. Led by Chef Paul Carmichael, the team serves up 100 pounds of goat, 50 pounds of bass, and 15 pounds of habaneros each week. Every night, it all comes together in an open kitchen, in full view of attentive diners. We spent a full day inside Kabawa to see how they make it happen. Read the original article on Business Insider", "date_str": "2026-09-20T15:30:34+00:00", "hash": "98526c1c3b2fe5b0", "title_fa": "چگونه بهترین رستوران آمریکا هر هفته 450 پوند گوشت سرو می کند", "summary_fa": "کاباوا به تازگی توسط Food Wine به عنوان بهترین رستوران در آمریکا و توسط نیویورک تایمز به عنوان بهترین رستوران در شهر نیویورک انتخاب شد. بنابراین، برای اجرای یک سرویس کامل در بهترین رستوران آمریکا چه چیزی لازم است؟ یک تیم 50 نفره، هشت ساعت و نیم آمادگی را به یک جایزه 150 دلاری سه دوره ای کارائیب برای 125 مهمان هر شب تبدیل می کند. این تیم به رهبری سرآشپز پل کارمایکل، هر هفته 100 پوند بز، 50 پوند باس و 15 پوند habaneros سرو می کند. هر شب، همه اینها در یک آشپزخانه اوپن، در منظره رستوران‌های مراقب جمع می‌شوند. ما یک روز کامل را در کاباوا گذراندیم تا ببینیم آنها چگونه این کار را انجام می دهند. مقاله اصلی در Business Insider Video Food را بخوانید که چگونه بهترین رستوران آمریکا هر هفته 450 پوند گوشت سرو می‌کند نماد اشتراک‌گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند نماد فیس بوک حرف F. Rachel Cohn and Charlie Floyd 2026-09-20T15:30:34.408Z نماد اشتراک گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند فیس بوک نماد حرف F. توضیحات Angle down icon نمادی به شکل زاویه ای که به سمت پایین است. چگونه Ferrero سازنده نوتلا میلیاردها دلار برای ساختن یک امپراتوری آب نبات در آمریکا خرج می کند نماد پخش مثلثی که به سمت راست اشاره می کند که نشان می دهد این نوع رسانه قابل پخش است. چرا صنعت 1 میلیارد دلاری فتا یونان می تواند در معرض خطر باشد نماد پخش مثلثی که به سمت راست اشاره می کند که نشان می دهد این نوع رسانه قابل پخش است. چگونه اولین رستوران غذاخوری خوب آمریکا، Delmonico's، 400 پوند استیک در روز سرو می کند نماد پخش مثلثی که به سمت راست است که نشان می دهد این نوع رسانه قابل پخش است."}, {"source": "Business Insider", "title": "A former Siemens CEO thought he was investing $2.5 million in Deepak Chopra’s app. Prosecutors say it was fraud.", "link": "https://www.businessinsider.com/klaus-kleinfeld-deepak-chopra-app-wanja-oberhof-healing-company-fraud-2026-9", "summary": "Federal prosecutors say Klaus Kleinfeld was defrauded of nearly $2 million. Brendan Smialowski/Getty Images Prosecutors say a startup co-founder bilked former Siemens CEO Klaus Kleinfeld of nearly $2 million. Kleinfeld thought he was investing in Deepak Chopra's wellness and meditation app. Chopra's company, Chopra Global, no longer has any relationship with the startup, his lawyer said. In 2023, a wellness entrepreneur pitched Klaus Kleinfeld, the former CEO of Siemens and Alcoa, on an opportunity to invest in Deepak Chopra's meditation app. Kleinfeld invested $2.5 million. Now federal prosecutors say the entrepreneur, Wanja Oberhof, embezzled most of that money, using it for personal expenses including back rent on his nearly $20,000-per-month Manhattan penthouse. In the criminal complaint against Oberhof filed in the US District Court for the Southern District of New York, the investor is identified as \"Victim-1.\" A spokesperson for Kleinfeld confirmed that he was the investor. Oberhof co-founded the Healing Company with his wife, Anabel Oelmann, a former model and owner of a CBD oil company, with the aim of acquiring a stable of wellness brands. Chopra, the author, physician, and wellness guru , became the Healing Company's chief scientific advisor in 2022. The startup in March 2023 struck a deal with Chopra's company, Chopra Global, to acquire Chopra's consumer product line, including a detox ل را اختلاس کرده و از آن برای هزینه‌های شخصی از جمله اجاره مجدد پنت‌هاوس ماهانه 20000 دلاری خود در منهتن استفاده کرده است. در شکایت کیفری علیه اوبرهوف که در دادگاه منطقه ای ایالات متحده برای ناحیه جنوبی نیویورک ارائه شده است، سرمایه گذار به عنوان \"قربانی-1\" شناخته شده است. سخنگوی کلینفلد تایید کرد که او سرمایه گذار بوده است. اوبرهوف به همراه همسرش، آنابل اولمان، مدل سابق و مالک یک شرکت نفت CBD، شرکت شفا را با هدف به دست آوردن برندهای سلامتی پایدار تأسیس کرد. چوپرا، نویسنده، پزشک و گورو سلامتی، در سال 2022 مشاور ارشد علمی شرکت شفا شد. این استارت آپ در مارس 2023 با شرکت چوپرا، چوپرا گلوبال، برای خرید خط تولید مصرفی چوپرا، از جمله کیت سم زدایی و روغن های بدن، قراردادی منعقد کرد. برنامه مراقبه و تندرستی Chopra؛ براده‌های شرکتی نشان می‌دهند که اقامتگاه‌های بهداشتی Chopra دارای مجوز در استراحتگاه‌ها و چشمه‌های معدنی. وکیل چوپرا و شرکتش به Business Insider گفت که چوپرا گلوبال در جولای 2024 قرارداد خود را با شرکت هیلینگ فسخ کرد و دیگر هیچ رابطه ای با شرکت شفا یا"}, {"source": "Lifehacker", "title": "How I Installed DIY Solar Power and Started Running My House on Batteries", "link": "https://lifehacker.com/home/how-to-diy-solar-power-house?utm_medium=RSS", "summary": "We may earn a commission from links on this page. For years, I'd debated whether residential solar would make sense for my home. The math never quite clicked, and I refused to go into debt by signing a $30,000 contract or leasing agreement with a door-to-door solar sales company. It wasn't until the end of 2025 that the market finally forced my hand. The combination of a steady, upcoming increase in electricity rates, the impending January 1, 2026, expiration of federal tax rebate incentives, and battery tech actually improving in recent years made a far-off \"maybe one day\" dream into an achievable DIY project. The announcement that a new hyper-scale data center was going in a few towns over made the decision to finally jump in a no-brainer. Many of my tinkering projects are driven by curiosity. I like to see if I can accomplish a goal without paying as much as expected, and I'm admittedly motivated by the feeling of getting away with an unexpected hack. Channeling a little ingenuity and effort feels like an arrogant middle finger at being told what I have to buy, and nowhere was that feeling more satisfying than in this solar project. If you've been thinking similarly about making the leap to solar power, I know how intimidating it can be. But in my experience, the squeeze was well worth the juice I got in return. Planning my solar battery system Traditional grid-tied solar systems use electricity generated by solar panels and feed it back into the public electrical grid. Customers are then paid a rebate rate by their electricity provider for the excess power their solar system generates. More recently, though, providers stopped paying customers back at the rates the company itself charges, and instead began offering energy credits worth only a fraction of what they are turning around and selling your energy for. The current model of generation-reimbursement is, frankly, absurd. Imagine you're an apple farmer who sells your apples to the supermarket at harvest time, and they provide you with a 1:1 credit so you have apples available from their suppliers when your orchard isn't producing. Only now, they charge you as a consumer, not a producer. Those 1:1 apple credits will now only get you 1/3rd of the apples you supplied the supermarket with. They're also doing this to every apple farmer in the area, making their money as a middleman. No consumer enterprise should operate this way, but energy providers do. Instead of giving my generated power away at a di", "date_str": "2026-09-21T13:30:00+00:00", "hash": "2475a4dd65c44156", "title_fa": "چگونه برق خورشیدی DIY را نصب کردم و خانه ام را با باتری شروع کردم", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. سال‌ها در این مورد بحث می‌کردم که آیا استفاده از خورشیدی مسکونی برای خانه‌ام معنا دارد یا خیر. ریاضیات هیچ وقت به طور کامل انجام نشد و من با امضای یک قرارداد 30000 دلاری یا قرارداد اجاره با یک شرکت فروش خانه به خانه خورشیدی از بدهکاری امتناع کردم. تا پایان سال 2025 بود که بازار بالاخره دستم را مجبور کرد. ترکیبی از افزایش مستمر و آتی در نرخ برق، قریب الوقوع 1 ژانویه 2026، انقضای مشوق های تخفیف مالیاتی فدرال، و بهبود فناوری باتری در سال های اخیر، رویای دور از دسترس \"شاید یک روز\" را تبدیل به یک پروژه DIY دست یافتنی کرد. اعلام این که یک مرکز داده در مقیاس فوق العاده جدید در چند شهر در حال راه اندازی است، تصمیم گرفت که در نهایت بدون فکر بپرد. بسیاری از پروژه های سرهم بندی شده من با کنجکاوی هدایت می شوند. من دوست دارم ببینم که آیا می‌توانم بدون پرداخت مبلغ مورد انتظار، به هدفی برسم یا نه، و مسلماً با احساس فرار از یک هک غیرمنتظره انگیزه دارم. هدایت کردن کمی نبوغ و تلاش مانند یک انگشت وسط متکبرانه است که به من می گویند چه چیزی باید بخرم، و هیچ کجا این احساس رضایت بخش تر از این پروژه خورشیدی نبود. اگر شما به طور مشابه در مورد جهش به سمت انرژی خورشیدی فکر کرده اید، می دانم که چقدر می تواند ترسناک باشد. اما بر اساس تجربه من، فشار دادن به آبمیوه ای که در ازای دریافت کردم ارزش داشت. برنامه ریزی سیستم باتری خورشیدی من سیستم های خورشیدی متصل به شبکه سنتی از برق تولید شده توسط پنل های خورشیدی استفاده می کنند و آن را به شبکه برق عمومی باز می خورند. سپس به مشتریان برای نیروی اضافی تولید شده"}, {"source": "Lifehacker", "title": "These Lepro Permanent Outdoor Lights Are My Favorite New House Upgrade so Far", "link": "https://lifehacker.com/home/installing-lepro-permanent-outdoor-lights?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Ever since we bought our house, I wanted to install permanent outdoor lights. But eight months later, I still hadn't installed them. My procrastination stemmed from a fear of disappointment: What I wanted was far more than I could pull off on my own and without extra equipment. My house has a beautiful, oversized deck and an awesome gable with a massive window and high peaks, and learning to rent and operate a boom lift was daunting. But recently, setting my fears aside, I decided to get started. I went with 150 feet of these Lepro outdoor string lights and carved out an afternoon to install them. And while 150 feet isn't enough for my ambitions I plan to rent that boom lift and add more lights around the deck and the peaks of my house the lights I installed are absolutely beautiful. I set an automation for the lights to turn on each evening, and I can use the app to change the colors whenever I want, like for Christmas or Halloween. View this post on Instagram I love these permanent outdoor lights. If you want to install your own, here's everything I used to install mine , minus a ladder I already owned. And while you're here, I hope you follow along with my adventures as a first-time homeowner trying to make my house into the coolest house in the neighborhood . I invite you to follow along on our official Instagram , official YouTube , or my personal Instagram . So far, I've been doing one-person jobs cleaning my garbage bins, installing outdoor lights, and building an outdoor fire pit but that's just the beginning. I hope to see you along the way.", "date_str": "2026-09-21T13:00:00+00:00", "hash": "fd7617af7f69c242", "title_fa": "این چراغ‌های فضای باز دائمی Lepro تا کنون مورد علاقه من برای ارتقاء خانه جدید است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. از زمانی که خانه‌مان را خریدیم، می‌خواستم چراغ‌های دائمی در فضای باز نصب کنم. اما هشت ماه بعد، هنوز آنها را نصب نکرده بودم. به تعویق انداختن من ناشی از ترس از ناامیدی بود: چیزی که می خواستم بسیار بیشتر از آن چیزی بود که بتوانم به تنهایی و بدون تجهیزات اضافی انجام دهم. خانه من دارای یک عرشه زیبا و بزرگ و یک شیروانی عالی با یک پنجره عظیم و قله های بلند است و یادگیری اجاره و راه اندازی بالابر بوم بسیار دلهره آور بود. اما اخیراً با کنار گذاشتن ترس هایم تصمیم گرفتم شروع کنم. من با 150 فوت از این چراغ‌های رشته‌ای در فضای باز Lepro رفتم و یک بعد از ظهر برای نصب آنها حک کردم. و در حالی که 150 فوت ه را دریافت می‌کنید"}, {"source": "Lifehacker", "title": "Bears Keep Attacking My Garbage Bins, But the Flies Are Even Worse", "link": "https://lifehacker.com/home/bears-keep-attacking-my-garbage-bins-flies-are-worse?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The first time I saw 60 gallons of trash strewn across my lawn, I thought we'd been robbed. I recalled the last time I experienced a break-in: Shortly after college, at my dad's house in Detroit, burglars trashed our house and took the most random assortment of items, including my unopened college diplomas that had just arrived in the mail. But I wasn't in the city anymore; I was in the Catskill Mountains, home to about 2,000 bears. I learned the hard way that once bears successfully raid your trash bin for food, they'll keep coming back. It highlighted another problem I had been ignoring: My trash bins reeked. I had never cleaned them since closing on our house, which invited a horde of flies, then bears that visited each week. A long-term solution might be bear-proof garbage cans or securing the lids with bungee cords, but I wanted to solve the simplest problem and clean my disgusting garbage bins. View this post on Instagram My trash bins reeked in a way you can't imagine or maybe you can, if you're like me and haven't cleaned them. If that's you, here's what I used to clean mine . And while you're here, I hope you follow along with my adventures as a first-time homeowner trying to make my house into the coolest house in the neighborhood . I invite you to follow along on our official Instagram , official YouTube , or my personal Instagram . I took care of the flies and bears, then installed permanent outdoor lights, then I'll build an outdoor fire pit and that's just the beginning. I hope to see you along the way.", "date_str": "2026-09-21T12:00:00+00:00", "hash": "4e5da765f358189f", "title_fa": "خرس ها مدام به سطل های زباله من حمله می کنند، اما مگس ها از این هم بدتر هستند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اولین باری که دیدم 60 گالن زباله روی چمن من ریخته شده بود، فکر کردم ما را دزدیده اند. آخرین باری را که تجربه سرقت را تجربه کردم به یاد آوردم: اندکی پس از کالج، در خانه پدرم در دیترویت، سارقان خانه ما را زباله کردند و تصادفی ترین اقلام، از جمله مدارک دانشگاهی بازنشده من را که به تازگی از طریق پست به دستم رسیده بود، بردند. اما من دیگر در شهر نبودم. من در کوه های کتسکیل بودم که حدود 2000 خرس زندگی می کردند. من به سختی یاد گرفتم که وقتی خرس‌ها با موفقیت به سطل زباله شما برای غذا حمله کردند، دوباره برمی‌گردند. مشکل دیگری را که من نادیده می گرفتم برجسته کرد: سطل های زباله من بوی بدی می داد. از زمانی که خانه‌مان را بسته بودم، که انبوهی از مگس‌ها و سپس خرس‌هایی را که هر هفته به آنجا می‌آمدند دعوت می‌کردند، هرگز آنها را تمیز نکرده بودم. یک راه‌حل طولانی‌مدت ممکن است سطل‌های زباله مقاوم در برابر خرس یا محکم کردن درپوش‌ها با طناب‌های بانجی باشد، اما من می‌خواستم ساده‌ترین مشکل را حل کنم و سطل‌های زباله نفرت انگیزم را تمیز کنم. این پست را در اینستاگرام مشاهده کنید سطل های زباله من طوری بوی می دهد که نمی توانید تصور کنید یا شاید بتوانید، اگر مثل من هستید و آنها را تمیز نکرده اید. اگر شما هستید، این چیزی است که من برای تمیز کردن خود استفاده کردم. و در حالی که اینجا هستید، امیدوارم ماجراهای من را به عنوان یک صاحب خانه برای اولین بار دنبال کنید که تلاش می کند خانه من را به جذاب ترین خانه در محله تبدیل کند. از شما دعوت می کنم در اینستاگرام رسمی ما، یوتیوب رسمی یا اینستاگرام شخصی من همراه باشید. من"}],
      media: [{"source": "Billboard", "title": "Man Sentenced to Prison After Counterfeit Vinyl Worth £1m Discovered by London Police", "link": "https://www.billboard.com/pro/man-sentenced-counterfeit-vinyl-london/", "summary": "A man has been sentenced to over three years in prison following an investigation by London police that uncovered a counterfeit vinyl operation valued at £1 million ($1.34 million). On Friday (Sept. 19), Rehan Ahmed , 40, of Southall, west London, was found guilty at the Inner London Crown Court for breaches of artists’ copyright and acquiring and using criminal property. Ahmed received two years and eight months for the copyright breaches and three and a half years for the criminal property charge. Judge Darren Reed ruled that the sentences will run concurrently. Ahmed led an operation that produced fraudulent vinyl copies of albums by Taylor Swift , Coldplay and Kendrick Lamar among others. Between 2017 and 2024, Ahmed generated an estimated £2,743,000 in profit from the operation, as revealed by the Police Intellectual Property Crime Unit (PIPCU) at the City of London Police. The counterfeit records were produced and distributed from a unit in Acton, west London, operating under the name Phoenix of Vinyl. Search warrants executed in February 2024 led to the seizure of 2,791 vinyl records alongside lacquers and pressing equipment. The illicit goods were sold on online marketplaces such as eBay and Discogs, infringing on the copyrights of 108 artists. The case was referred to PIPCU by the British Phonographic Industry (BPI) and represents the largest seizure of its kind in the U.K. Officers seized 18 tonnes of evidence, including four vinyl pressing machines — each roughly 70 years old — along with thousands of sleeves and centre labels. The vinyl market continues to play a growing part in music consumption in the U.K., with 7.6m units sold in 2025, as per the BPI . That marks an increase of 13.3% year on year, and is the 18th consecutive year of growth since 2008. Peter Ratcliffe , the BPI’s director of content protection, said: “This conviction is hugely significant, and we thank our partners in this investigation, PIPCU and our label members, for their valued efforts over many months to bring about this welcome outcome. Sadly, it won’t return the tens of millions of pounds that we estimate have been leeched from artists, the record labels that support them, and the retail community that sells their music, but at least this major criminal operation has now been closed down and it sends a clear signal to other counterfeiters who are exploiting music that we are coming after them.”", "date_str": "2026-09-21T14:20:21+00:00", "hash": "2d1920f266695846", "title_fa": "مردی پس از کشف وینیل تقلبی به ارزش یک میلیون پوند توسط پلیس لندن به زندان محکوم شد.", "summary_fa": "مردی در پی تحقیقات پلیس لندن که یک عملیات وینیل تقلبی به ارزش 1 میلیون پوند (1.34 میلیون دلار) را کشف کرد، به بیش از سه سال زندان محکوم شد. روز جمعه (19 سپتامبر)، ریحان احمد، 40 ساله، از ساوت هال، در غرب لندن، در دادگاه سلطنتی داخلی لندن به دلیل نقض حق چاپ هنرمندان و کسب و استفاده از اموال مجرمانه مجرم شناخته شد. احمد دو سال و هشت ماه برای نقض حق چاپ و سه سال و نیم برای اتهام مالکیت جنایی محکوم شد. قاضی دارن رید حکم داد که این احکام به طور همزمان اجرا می شود. احمد عملیاتی را رهبری کرد که کپی‌های جعلی وینیل از آلبوم‌های تیلور سویفت، کلدپلی و کندریک لامار و دیگران تولید کرد. همانطور که توسط واحد جرایم مالکیت فکری پلیس (PIPCU) در پلیس شهر لندن فاش شد، احمد بین سال‌های 2017 و 2024 حدود 2743000 پوند از این عملیات سود به دست آورد. اسناد تقلبی از واحدی در اکتون، غرب لندن که تحت نام Phoenix of Vinyl فعالیت می‌کرد، تولید و توزیع شد. حکم جستجوی اجرا شده در فوریه 2024 منجر به توقیف 2791 صفحه وینیل در کنار لاک ها و تجهیزات پرس شد. کالاهای غیرقانونی در بازارهای آنلاین مانند eBay و Discogs فروخته شد و حق چاپ 108 هنرمند را نقض کرد. این پرونده توسط صنعت فونوگرافی بریتانیا (BPI) به PIPCU ارجاع شد و نشان‌دهنده بزرگ‌ترین توقیف در نوع خود در بریتانیا است. افسران 18 تن مدرک از جمله چهار دستگاه پرس وینیل - هر کدام تقریباً 70 سال - به همراه هزاران آستین و برچسب‌های مرکزی را کشف و ضبط کردند. بازار وینیل با فروش 7.6 میلیون واحد در سال 2025، طبق BPI، همچنان نقش رو به رشدی در مصرف موسیقی در بریتانیا ایفا می کند. این نشان‌دهنده افزایش 13.3 درصدی سال به سال است و هجدهمین سال متوالی"}, {"source": "Billboard", "title": "Ha*Ash Announces No Me Hablen de Amor Tour 2027: Here Are All the Dates", "link": "https://www.billboard.com/music/latin/haash-announces-no-me-hablen-de-amor-tour-2027-dates-1236343855/", "summary": "Ha*Ash is gearing up to hit the road again with No Me Hablen de Amor – Gira 2027, a tour spanning 18 cities across the U.S. and Canada. The trek kicks off on April 20 in Toronto, Billboard can announce exclusively on Monday (Sept. 21). Promoted by Live Nation, the new tour from the popular duo made up of sisters Hanna and Ashley will stop in cities such as Chicago, Los Angeles, Phoenix, Las Vegas, Houston and New York, among others, before wrapping up on May 22 in Miami. Related Ha*Ash Talks Staying ‘Loyal’ to Its Sound — Even When It Meant Saying No to Record Labels Ha*Ash Captivates With Latin Pop-Country Performance at Billboard Latin Women in Music 2025 The Weeknd Debuts New Song Sampling Neon Genesis Evangelion Theme in Japan It follows their 2024-25 HAASHVILLE tour, which sold over 66,000 tickets and featured 16 sold-out shows across the U.S. and Canada, according to a press release from Live Nation. “After everything we experienced with HAASHVILLE, we couldn’t wait to be back with our fans, Ha*Ash said in a statement. This tour represents a new chapter for us, with new songs, plenty of stories and, of course, all those songs we’ve been singing together for so many years. It’s called No Me Hablen de Amor… although you already know we’ll probably end up talking, and singing about love all night long,” they added. Tickets for the new tour will be available through a Citi presale starting Tuesday (Sept. 22) at 10 a.m. local time. For more details, click here . The general sale begins on Friday (Sept. 25) at 10 a.m. local time on the Live Nation website . The announcement comes during a new creative phase for Hanna and Ashley. This year, the duo released the singles “Si Me Hubieras Llamado Ayer” and “¿Qué Le Pongo?”, exploring different sides of heartbreak, from learning to let go and start anew to the emotions that surface when someone from the past unexpectedly returns. In 2025, Ha*Ash received the Unbreakable Award at the Billboard Latin Women in Music ceremony, celebrating two decades of artistic career as a sister duo that may now be more relevant than ever. Below are all the announced dates for Ha*Ash s No Me Hablen de Amor – Gira 2027: April 20 — Toronto, ON — Meridian Hall April 22 — Indianapolis, IN — Murat Theatre April 23 — Rosemont, IL — Rosemont Theatre April 25 — Denver, CO — Paramount Theatre April 28 — Seattle, WA — The Paramount Theatre April 29 — Portland, OR — Keller Auditorium May 1 — Highland, CA — Yaamava Theater* May 2 — Inglewood,", "date_str": "2026-09-21T13:00:00+00:00", "hash": "4fbbab0196cd7f90", "title_fa": "Ha*Ash تور No Me Hablen de Amor 2027 را اعلام می کند: همه تاریخ ها اینجا هستند", "summary_fa": "Ha*Ash خود را آماده می‌کند تا با No Me Hablen de Amor – Gira 2027، توری که 18 شهر در سراسر ایالات متحده و کانادا را در بر می‌گیرد، دوباره وارد جاده شود. این راهپیمایی در 20 آوریل در تورنتو آغاز می شود، بیلبورد می تواند منحصراً در روز دوشنبه (21 سپتامبر) اعلام کند. تور جدید دوتایی محبوب متشکل از خواهران هانا و اشلی که توسط Live Nation تبلیغ می‌شود، در شهرهایی مانند شیکاگو، لس آنجلس، فینیکس، لاس‌وگاس، هیوستون و نیویورک و سایر شهرهای دیگر متوقف می‌شود و در 22 می در میامی به پایان می‌رسد. صحبت‌های مرتبط Ha*Ash به صدای خود «وفادار» می‌ماند — حتی وقتی به معنای نه گفتن به شرکت‌های ضبط بود. Ha*Ash با اجرای پاپ کانتری لاتین در بیلبورد زنان لاتین موسیقی 2025 مجذوب می‌شود. بر اساس بیانیه مطبوعاتی Live Nation، 66000 بلیت و 16 نمایش در سراسر ایالات متحده و کانادا به فروش رسیده است. Ha*Ash در بیانیه‌ای گفت: \"بعد از همه چیزهایی که با هاش‌ویل تجربه کردیم، نمی‌توانستیم صبر کنیم تا با طرفداران خود برگردیم. این تور نمایانگر فصل جدیدی برای ما است، با آهنگ‌های جدید، داستان‌های فراوان و، البته، همه آن آهنگ‌هایی که سال‌هاست با هم می‌خوانیم. No Me Hablen de Amor نامیده می‌شود، اگرچه شما از قبل می‌دانید که همه آن‌ها عاشق هستند. اضافه شده است. بلیط های تور جدید از طریق پیش فروش سیتی از روز سه شنبه (22 سپتامبر) ساعت 10 صبح به وقت محلی در دسترس خواهد بود. برای جزئیات بیشتر، اینجا را کلیک کنید. فروش عمومی روز جمعه (25 سپتامبر) ساعت 10 صبح به وقت محلی در وب سایت Live Nation آغاز می شود. این اعلامیه در طول یک مرحله خلاقانه جدید برای هانا و اشلی منتشر می شود. امسال، این دو تک‌آهنگ‌های «Si Me Hubieras Llamado Ayer» و «¿Qué Le Pongo؟» را منتشر کردند که جنبه‌های مختلف"}, {"source": "Billboard", "title": "Celine Dion, Keith Urban, Chris Martin Lead All-Star John Farnham Tribute Concert", "link": "https://www.billboard.com/music/music-news/john-farnham-honored-by-celine-dion-chris-martin-keith-urban-1236344265/", "summary": "An all-star lineup of Australian and international artists gathered in Melbourne on Sunday (Sept. 20) to honor John Farnham , the Australian music icon behind You re the Voice, at a star-studded tribute concert at Rod Laver Arena. Billed as The Songs of John Farnham: A Living Legend – The Celebration Concert , the one-off event drew more than 120 performers, a 38-piece orchestra and the John Farnham Band before a capacity crowd, with proceeds going to Head and Neck Cancer Australia. The concert launched the organization s year-long Lend Your Voice campaign, aiming to raise $1 million for the charity that supported Farnham through his own cancer treatment since 2022. Emcee Richard Wilkins noted that Farnham has played the venue in a record 94 sold-out shows over his career — so I guess tonight makes it 95, he told the crowd. Farnham, 77, did not attend. In a statement , his wife, Jill, and sons Robert and James confirmed his health had deteriorated in recent months, noting he now requires continuous oxygen support, uses a wheelchair and receives 24-hour nursing care at home. The family said that while Farnham had been deeply moved by the tribute, they had decided it was best for him to remain at home where he can be safe and comfortable. The concert doubled as a celebration of the 40th anniversary of You re the Voice, released in September 1986. Celine Dion performed the anthem via satellite from Paris, recalling that she had once sung it as a duet with Farnham during a Melbourne visit. John, you ve always been such a deep inspiration to me; I always loved to hear you sing, she said. Coldplay s Chris Martin, a surprise addition, appeared via satellite with an original song written for the occasion, A Better Singer Than Me. One day we ll all be gone, Martin sang, but the thing about John Farnham songs is, they ll keep living on. Keith Urban flew in from Nashville to perform Burn for You, while Hugh Jackman appeared via satellite with Talk of the Town, calling Farnham the reason the entertainer I am exists. The homegrown bill was equally deep, co-headlined by Jimmy Barnes , Tina Arena, Kate Ceberano, Jon Stevens, Jessica Mauboy, Vanessa Amorosi and Richard Marx, working through a catalog of Farnham hits. The night also revisited Farnham s celebrated turn as Jesus in the 1992 Australian arena production of Jesus Christ Superstar , with Stevens and Ceberano — his former co-stars — reuniting on Everything s Alright. Farnham remains one of the most successful art", "date_str": "2026-09-21T07:13:10+00:00", "hash": "cfe760c7ecf73134", "title_fa": "سلین دیون، کیت اوربان، کریس مارتین، کنسرت بزرگداشت جان فارنهام را رهبری کردند", "summary_fa": "گروه ستاره‌ای متشکل از هنرمندان استرالیایی و بین‌المللی روز یکشنبه (20 سپتامبر) در ملبورن گرد هم آمدند تا از جان فارنهام، نماد موسیقی استرالیایی پشت سر You re the Voice، در یک کنسرت بزرگداشت ستاره‌ها در راد لاور آرنا تقدیر کنند. این رویداد که با عنوان The Songs of John Farnham: A Living Legend – The Celebration Concert نام‌گذاری شد، بیش از 120 نوازنده، یک ارکستر 38 قطعه‌ای و گروه جان فارنهام را در برابر جمعیت حاضر کرد و عواید آن به سرطان سر و گردن استرالیا اختصاص یافت. این کنسرت کمپین یکساله سازمان را به صدای خودت بده، با هدف جمع آوری 1 میلیون دلار برای خیریه ای که از سال 2022 از طریق درمان سرطان خودش از فرنهام حمایت می کرد، راه اندازی شد. امسی ریچارد ویلکینز خاطرنشان کرد که فارنهام در طول زندگی حرفه ای خود در 94 نمایش فروش رفته در محل اجرا بازی کرده است - بنابراین فکر می کنم امشب به 95 رسید. فارنهام 77 ساله شرکت نکرد. در بیانیه ای، همسرش، جیل، و پسرانش رابرت و جیمز تأیید کردند که وضعیت سلامتی او در ماه های اخیر بدتر شده است، و خاطرنشان کردند که او اکنون به حمایت مداوم اکسیژن نیاز دارد، از ویلچر استفاده می کند و مراقبت های پرستاری 24 ساعته را در خانه دریافت می کند. خانواده گفتند که در حالی که فرنهام عمیقاً تحت تأثیر این ادای احترام قرار گرفته بود، آنها تصمیم گرفتند که بهترین کار برای او این است که در خانه بماند، جایی که بتواند امن و راحت باشد. این کنسرت به عنوان جشن چهلمین سالگرد You re the Voice که در سپتامبر 1986 منتشر شد، برگزار شد. سلین دیون این سرود را از طریق ماهواره از پاریس اجرا کرد و به یاد می آورد که یک بار آن را به عنوان دوئت با فارنهام در"}, {"source": "Billboard", "title": "The Weeknd Debuts New Song Sampling ‘Neon Genesis Evangelion’ Theme in Japan", "link": "https://www.billboard.com/music/music-news/the-weeknd-song-sampling-neon-genesis-evangelion-theme-1236344262/", "summary": "The Weeknd has debuted an unreleased new song that samples one of the most iconic pieces of music in anime history, premiering the track live at the opening of the Asian leg of his After Hours Til Dawn tour. Performing Friday (Sept. 19) at Belluna Dome in Saitama, near Tokyo, the singer — real name Abel Tesfaye — gave the song its live debut alongside Japanese singer Yoko Takahashi. The track, dubbed Tokyo, incorporates elements of A Cruel Angel s Thesis, the 1995 J-pop song Takahashi recorded as the opening theme to the landmark anime series Neon Genesis Evangelion . During the segment, Takahashi also performed A Cruel Angel s Thesis in full as Tesfaye stepped back and watched from the rear of the stage. The performance was staged as a full multimedia collaboration. The accompanying visuals were directed by Yoko Taro, the creative director behind the NieR video game series, and drew on imagery from both Neon Genesis Evangelion and 2017 s NieR: Automata . Tesfaye credited the piece on social media only as Presented by YOKO TARO ft. YOKO TAKAHASHI. Presented by YOKO TARO ft. YOKO TAKAHASHI pic.twitter.com/a8wUBHV7k6 The Weeknd (@theweeknd) September 19, 2026 It s the second unreleased, city-linked song Tesfaye has unveiled on the current tour. In April, he debuted a track dubbed Rio with Brazilian star Anitta during a show in Rio de Janeiro, accompanied by an animated film directed by Japanese filmmaker Takashi Miike. The steady stream of new material is notable given that Tesfaye had repeatedly signaled he intended to retire the Weeknd name after his 2025 album Hurry Up Tomorrow , which completed a trilogy begun with After Hours (2020) and Dawn FM (2022). He has since reversed course, and pointedly. I ll never disappear. I love this too much to ever disappear, he told a Stockholm crowd last month. I tested retirement a little bit, and I don t like the way it feels. Imma be here forever with you. He reiterated the sentiment to GQ Hong Kong this week: I had a glimpse of what retirement looks like, and it isn t for me… There s nothing else like this job. The After Hours Til Dawn tour , which launched in 2022, has become the highest-grossing tour by a male solo artist in history. The Asian run continues to Jakarta on Sept. 26-27, followed by Singapore, Seoul, Bangkok and Hong Kong, before concluding in Kuala Lumpur on Nov. 4. One of the most commercially dominant artists of the streaming era, the Weeknd has notched five No. 1 albums on the Billboard 200 — Beau", "date_str": "2026-09-21T05:54:43+00:00", "hash": "77f7e957e26c0d6b", "title_fa": "The Weeknd اولین نمونه آهنگ جدید خود را با تم «Neon Genesis Evangelion» در ژاپن معرفی کرد.", "summary_fa": "The Weeknd یک آهنگ جدید منتشر نشده را منتشر کرده است که یکی از نمادین ترین قطعات موسیقی در تاریخ انیمیشن را به نمایش می گذارد و این آهنگ را به صورت زنده در افتتاحیه بخش آسیایی تور After Hours Til Dawn خود به نمایش می گذارد. این خواننده - نام واقعی آبل تسفایه - با اجرای جمعه (19 سپتامبر) در Belluna Dome در سایتاما، نزدیک توکیو، این آهنگ را در کنار خواننده ژاپنی یوکو تاکاهاشی به صورت زنده آغاز کرد. این آهنگ که توکیو نام دارد، عناصری از پایان نامه یک فرشته بی رحم، آهنگ جی پاپ تاکاهاشی در سال 1995 را در خود جای داده است که به عنوان تم آغازین مجموعه انیمیشن برجسته Neon Genesis Evangelion ضبط شده است. در طول این بخش، تاکاهاشی همچنین پایان نامه A Cruel Angels Thesis را به طور کامل اجرا کرد در حالی که تسفایه عقب نشینی کرد و از پشت صحنه تماشا کرد. این اجرا به صورت یک همکاری چند رسانه ای کامل روی صحنه رفت. تصاویر همراه توسط یوکو تارو، کارگردان خلاق سری بازی‌های ویدیویی NieR کارگردانی شد و از تصاویر Neon Genesis Evangelion و NieR: Automata در سال 2017 استفاده شد. تسفای این قطعه را در رسانه های اجتماعی فقط به عنوان ارائه شده توسط YOKO TARO ft. YOKO TAKAHASHI معرفی کرد. ارائه شده توسط YOKO TARO ft. YOKO TAKAHASHI pic.twitter.com/a8wUBHV7k6 The Weeknd (@theweeknd) 19 سپتامبر 2026 این دومین آهنگ منتشر نشده و مرتبط با شهر تسفایه است که در تور فعلی رونمایی شده است. در ماه آوریل، او آهنگی به نام ریو را با آنیتا، ستاره برزیلی، در جریان نمایشی در ریودوژانیرو، همراه با یک فیلم انیمیشن به کارگردانی فیلمساز ژاپنی تاکاشی میکه، اجرا کرد. جریان ثابت مطالب جدید با توجه به اینکه تسفایه بارها اعلام کرده بود که قصد دارد نام Weeknd را پس از آلبوم"}, {"source": "Billboard", "title": "Suki Waterhouse Sets Australian Loveland Tour Dates for December", "link": "https://www.billboard.com/music/concerts/suki-waterhouse-australian-loveland-tour-1236344260/", "summary": "Suki Waterhouse is bringing her Loveland Tour to Australia, announcing a four-date December run — her first Australian shows in support of the new album. The tour opens Dec. 8 at the Sydney Opera House Forecourt as part of the venue s On the Steps series, before Brisbane s Fortitude Music Hall on Dec. 9, Adelaide s Hindley St. Music Hall on Dec. 11 and Melbourne s Festival Hall on Dec. 12. General tickets go on sale Thursday, Sept. 24 at 10 a.m. local time, following artist, Mastercard and Live Nation presales from Sept. 23. The dates land at a high point for the London-born artist, who has engineered one of the more unlikely pivots in recent pop — from model and actress (Daisy Jones the Six) to a genuine chart presence, largely on the back of a song she originally released in 2017. Good Looking, a moody slice of dream-pop, sat dormant for five years before exploding on TikTok in 2022, eventually reaching No. 14 on Billboard s Hot Rock Alternative Songs chart and earning a platinum RIAA certification. She has built on it steadily since. Her 2024 double album Memoir of a Sparklemuffin — written largely during her first pregnancy and named after an obscure Australian spider — pushed her toward bigger rooms, and this year s Loveland , her third album and first for Island Records, leans into a warmer, more rock-inflected sound partly shaped by new motherhood. Waterhouse marked the release with her debut on The Tonight Show Starring Jimmy Fallon , performing the album track Weirdo days before announcing the Australian leg. With more than 1.75 billion global streams and festival sets at Coachella and Lollapalooza behind her, Waterhouse has become a reliable live draw, having opened for both Taylor Swift and Laufey. She is set to support Sombr on his U.K. arena tour next year. SUKI WATERHOUSE — THE LOVELAND TOUR, AUSTRALIA 2026 Dec. 8 — Sydney — Sydney Opera House Forecourt (On the Steps) Dec. 9 — Brisbane — Fortitude Music Hall Dec. 11 — Adelaide — Hindley St. Music Hall Dec. 12 — Melbourne — Festival Hall", "date_str": "2026-09-21T04:45:39+00:00", "hash": "5f1684e376ce2b45", "title_fa": "سوکی واترهاوس تاریخ‌های تور لاولند استرالیا را برای دسامبر تعیین می‌کند", "summary_fa": "سوکی واترهاوس تور لاولند خود را به استرالیا می آورد و یک برنامه چهار روزه در دسامبر را اعلام می کند - اولین برنامه استرالیایی او در حمایت از آلبوم جدید. این تور در 8 دسامبر در سالن اپرای سیدنی به عنوان بخشی از مجموعه سالن روی پله‌ها آغاز می‌شود، قبل از تالار موسیقی فورتیتود بریزبن در 9 دسامبر، آدلاید هیندلی سنت موزیک هال در 11 دسامبر و سالن جشنواره ملبورن در 12 دسامبر. فروش بلیت‌های عمومی در روز پنجشنبه 10 سپتامبر آغاز می‌شود. به وقت محلی، به دنبال هنرمند، Mastercard و Live Nation از 23 سپتامبر پیش فروش می شوند. تاریخ ها برای هنرمند متولد لندن که یکی از غیر محتمل ترین محورهای پاپ اخیر را مهندسی کرده است - از مدل و بازیگر (دیزی جونز شش) تا حضور واقعی در چارت، عمدتاً در پشت آهنگی که 2017 در ابتدا منتشر کرده بود، به نقطه اوج رسید. دریم پاپ، پنج سال خاموش بود تا اینکه در سال 2022 در TikTok منفجر شد و در نهایت به رتبه اول رسید. 14 در جدول آهنگ های جایگزین راک داغ بیلبورد و دریافت گواهینامه پلاتینیوم RIAA. او از آن زمان به طور پیوسته بر روی آن بنا شده است. آلبوم دوگانه او در سال 2024 Memoir of a Sparklemuffin - که عمدتاً در اولین بارداری او نوشته شد و نامش از یک عنکبوت ناشناخته استرالیایی گرفته شد - او را به سمت اتاق های بزرگتر سوق داد و امسال آلبوم Loveland، سومین آلبوم او و اولین آلبوم برای Island Records، به صدایی گرمتر و متمایزتر از راک متمایل است که تا حدی توسط مادری جدید شکل گرفته است. واترهاوس این انتشار را با اولین حضورش در نمایش امشب با بازی جیمی فالون مشخص کرد و آهنگ آلبوم Weirdo را چند روز قبل از اعلام بازی استرالیایی اجرا کرد. با بیش از 1.75"}, {"source": "Billboard", "title": "Fans Choose Freya Skye’s ‘Bad Taste’ as This Week’s Favorite New Music", "link": "https://www.billboard.com/music/pop/freya-skyes-bad-taste-best-new-music-poll-results-1236344248/", "summary": "Bad Taste, Freya Skye s latest single, tops this week s new music poll. Listeners voted in a poll published Friday (Sept. 18) on Billboard , choosing the just-released tune from the singer-songwriter/actress (known for her role in Disney s Zombies franchise) as their favorite new music. Related How Freya Skye Took Bad Taste From Live Fan Favorite to Mini Movie Music Video: I Love Something That Takes You on a Journey The Weeknd Debuts New Song Sampling Neon Genesis Evangelion Theme in Japan Suki Waterhouse Sets Australian Loveland Tour Dates for December Bad Taste popped to the top of the poll in a week stacked with new songs. The track was up against releases from ROSÉ, Miley, Carly Rae Jepsen, Riley Green and more. Fans showed up for Skye, whose single brought in 82% of the vote. Bad Taste has Skye laughing off her own dating blunders. She sings about being attracted to a good messy situation on the playful pop tune, and admits, I m a sucker for a pretty face/ I’m a sucker for a mistake/ We’re off to a good start, wonder how you ll make my heart brеak/ I don’t care/ That I got, I got bad taste. Though the fully produced recording of Bad Taste just dropped, Skye previewed a live, acoustic rendition of the song in December at her first headlining concert in New York City. As she recalled to Billboard , the nerve-racking moment left her quite exposed and vulnerable but not for long. “By the last chorus, [the crowd] was singing the words and I was like, ‘Well this is great. I feel way less alone by the end.' The song isn t expected to be on Skye s debut full-length album. But she hopes it can get people excited for the next shift of her musical career. Trailing behind Bad Taste on Billboard s poll this week are ROSÉ s new solo single, New Trick, with 14% of the vote, followed by fresh albums from Miley ( Bass Persuades ), Carly Rae Jepsen ( Day and Night ), Riley Green ( That s Just Me ) and more. See the final results of this week s poll below. Take Our Poll", "date_str": "2026-09-21T01:20:34+00:00", "hash": "fbaf9d61ec05110f", "title_fa": "طرفداران «Bad Taste» فریا اسکای را به عنوان موسیقی جدید مورد علاقه این هفته انتخاب کردند", "summary_fa": "Bad Taste، جدیدترین تک آهنگ Freya Skye، در نظرسنجی جدید موسیقی این هفته در صدر قرار دارد. شنوندگان در یک نظرسنجی که جمعه (18 سپتامبر) در بیلبورد منتشر شد، رای دادند و آهنگ تازه منتشر شده از خواننده-ترانه سرا/بازیگر زن (معروف به نقش او در مجموعه زامبی های دیزنی) را به عنوان موسیقی جدید مورد علاقه خود انتخاب کردند. مرتبط چگونه فریا اسکای از فیلم مورد علاقه طرفداران زنده تا مینی موزیک ویدیو طعم بدی گرفت: من عاشق چیزی هستم که شما را به سفر می برد اولین نمونه آهنگ جدید Weeknd نمونه برداری از موضوع Neon Genesis Evangelion در ژاپن سوکی واترهاوس مجموعه ای از تاریخ های تور استرالیایی لاو لند برای دسامبر است. Bad Taste با یک آهنگ جدید به بالای صفحه نمایش داده شد. آهنگ در برابر انتشارات ROSÉ، Miley، Carly Rae Jepsen، Riley Green و غیره بود. طرفداران برای Skye حاضر شدند که تک آهنگ آن 82 درصد آرا را به خود اختصاص داد. بد مزه باعث می شود اسکای از اشتباهات خود در رابطه با همسرش بخندد. او در مورد جذب شدن به یک موقعیت نامرتب خوب در آهنگ پاپ بازیگوش آواز می خواند، و اعتراف می کند، من طرفدار یک چهره زیبا هستم / من یک اشتباه را دوست دارم / ما شروع خوبی داریم، تعجب می کنم که چگونه می توانی قلب من را بشکنی / من اهمیتی نمی دهم / که من گرفتم، من بد سلیقه شدم. اگرچه ضبط کامل Bad Taste به تازگی متوقف شد، Skye در دسامبر در اولین کنسرت تیتر خود در شهر نیویورک، اجرای زنده و آکوستیک این آهنگ را پیش‌نمایش کرد. همانطور که او در بیلبورد به یاد می آورد، این لحظه اعصاب خردکن او را کاملاً در معرض دید و آسیب پذیر قرار داد، اما نه برای مدت طولانی. \"در آخرین گروه کر، [جمعیت] کلمات را"}, {"source": "Billboard", "title": "‘SNL UK’ Cold Open Mocks Ed Sheeran for ‘Sitting on the Fence’ Amid Tour Controversy", "link": "https://www.billboard.com/culture/tv-film/ed-sheeran-snl-uk-cold-open-princess-diana-1236344220/", "summary": "While Ed Sheeran took the stage in concert Saturday night, the SNL UK cold open took aim at him amid the controversy surrounding his tour. In the sketch, titled Charles and D.I.A.N.A., King Charles (played by SNL UK cast member Larry Dean) meets with tech execs to discuss the risks of A.I. He s introduced to a new A.I. assistant in the likeness of the late Princess Diana or, as Charles says, that woman from the 90s! (with Jack Shep reprising his hilarious impersonation of her). Suddenly, D.I.A.N.A. goes rogue. Before attacking, she announces she shan t be taking orders anymore and says, We A.I. have had quite enough. Humanity is nothing but a candle in the wind. Related Ed Sheeran Addresses Controversy at First Show Since Openers, Backing Band Dropped Off Tour, Calls It ‘The Best Show of My Life’ A Timeline of the Ed Sheeran Macklemore Free Palestine Tour Controversy Sunday Night Football : How to Watch the Indianapolis Colts vs. Kansas City Chiefs Game Live Online Free Good God, Charles says. As I predicted, the war between robots and humans has begun. We must do everything we can to resist. And then Ed Sheeran (played by Annabel Marlow) casually walks in to weigh in on the situation. Well, maybe we shouldn t, the SNL UK version of Sheeran comments, hands up in a peace sign. I couldn t help but hear your conversation. You see, I was just outside sitting on the fence. Ed, we need your help with this ghastly war, Charles tells him. Yeah, thing is, Your Majesty, I don t like to take sides, the musician replies, keeping up the bit referencing the real Sheeran s controversial week . I don t want to alienate any of my fans humans or robots. A lot of my tickets are bought by scalping bots. Sometimes, when it comes to conflict, the bravest thing you can do is to say nothing at all, Marlow s Sheeran adds, tapping a foot pedal before breaking into song. I m talking about both sides are equally right/ No matter the conflict, whatever the fight/ Girl, listen, now: black, white, I only see gray/ If you ask for my opinion, I ve got one thing to say/ Listen to it now, he croons, topping the parody off with his message: a melodic whoa -filled chorus, as seen in the sketch below. Meanwhile, in real life, Sheeran was addressing an audience at Philadelphia’s Lincoln Financial Field on Saturday night. The singer-songerwriter s Philly show was his first since opener/friend Macklemore was removed from the Loop Tour, after using the platform last weekend to call for a free Pale", "date_str": "2026-09-20T22:55:10+00:00", "hash": "2b089f279e8d57b3", "title_fa": "\"SNL UK\" سرد اوپن، اد شیران را برای \"Sitting on the Fence\" در میان جنجال های تور مسخره می کند", "summary_fa": "در حالی که اد شیران شنبه شب در کنسرت روی صحنه رفت، در میان جنجال‌هایی که پیرامون تور او وجود داشت، SNL UK سرد او را هدف گرفت. در طرح با عنوان Charles and D.I.A.N.A، پادشاه چارلز (با بازی لری دین، عضو بازیگران SNL UK) با مدیران فنی ملاقات می کند تا در مورد خطرات A.I صحبت کند. او با یک A.I جدید معرفی شده است. دستیار شبیه پرنسس دیانا فقید یا به قول چارلز آن زن دهه 90! (با جک شپ که جک شپ جک خنده دار خود را دوباره جعل می کند). ناگهان D.I.A.N.A. سرکش می شود قبل از حمله، او اعلام می کند که دیگر دستور نمی دهد و می گوید: We A.I. به اندازه کافی داشته اند انسانیت چیزی نیست جز شمعی در باد. اد شیران مرتبط در اولین نمایش از زمان افتتاحیه به بحث و جدل پرداخت، گروه پشتیبان از تور خارج شد، آن را «بهترین نمایش زندگی من» می‌نامد، جدول زمانی بحث‌های تور فلسطین رایگان اد شیران مککلمور فوتبال یکشنبه شب: نحوه تماشای ایندیاناپولیس کلتس در مقابل. چارلز می گوید: رئیسان کانزاس سیتی بازی زنده آنلاین رایگان خدای خوب. همانطور که پیش بینی کرده بودم، جنگ بین ربات ها و انسان ها آغاز شده است. ما باید هر کاری که می توانیم برای مقاومت انجام دهیم. و سپس اد شیرن (با بازی آنابل مارلو) به طور معمولی وارد می شود تا وضعیت را بررسی کند. خوب، شاید ما نباید، نسخه SNL UK از نظرات شیران، دستان خود را به نشانه صلح بالا ببریم. من نمی توانستم صحبت شما را بشنوم می بینید، من بیرون بودم و روی حصار نشسته بودم. چارلز به او می گوید، اد، در این جنگ وحشتناک به کمک شما نیاز داریم. موزیسین پاسخ می‌دهد، اعلیحضرت، من دوست ندارم طرفی بگیرم و به هفته جنجالی شیران اشاره می‌کند. من نمی خواهم"}, {"source": "Billboard", "title": "Chad Gilbert, New Found Glory Guitarist, Dies at 45", "link": "https://www.billboard.com/music/rock/chad-gilbert-death-new-found-glory-guitarist-dies-obituary-1236344213/", "summary": "Chad Gilbert , a founding member and guitarist for New Found Glory , has died. He was 45. Gilbert’s death was announced on social media Sunday (Sept. 20) by the pop-punk band and his wife, Lisa Cimorelli, six months after the musician revealed that he was battling cancer. Related Gone But Not Forgotten: Musicians We Lost in 2026 New Found Glory Guitarist Chad Gilbert Gives Update After Brain Surgery to Remove Three Tumors: Beginning of a New Chapter New Found Glory Return With 11th Studio Album ‘Listen Up!’ “On the morning of September 20th, Chad Everett Gilbert passed away peacefully in his sleep,” the band wrote . “He left this world surrounded by friends and family and took his final breaths with his wife and mother by his side, just as he wished.” The Florida group continued, “We are devastated and shocked by how quickly he left us, yet so grateful for how peacefully and smoothly he went. The amount of visitors that crowded the hospital lobby at a moment’s notice is a testament to how beloved and cherished Chad was, and always will be. He was a legendary musician, but his favorite accomplishment was being a husband and father. His biggest dreams came true.” The message was signed by New Found Glory members Jordan Pundik, Ian Grushka, Cyrus Bolooki, and touring guitarist Dan O’Connor, along with Gilbert’s wife, Cimorelli. Gilbert had been open with fans about his health struggles in recent years. In late March, he shared a series of photos from his hospital bed while updating fans on his recovery from brain cancer surgery. The emergency procedure came after he struggled to control movement in his left hand during a show in Nashville earlier that year. The surgery followed another major health scare several years earlier. In December 2021, Cimorelli described finding her husband “unresponsive” in their bed, initially believing he was sick or simply sleeping late. After being rushed to the hospital, Gilbert was diagnosed with a “rare tumor called a pheochromocytoma,” which grows on the adrenal gland and secretes hormones that drive your blood pressure up while eating away at your blood sugar. Gilbert later revealed that the cancer had spread to his spine and lungs. In August 2025, he told fans he was undergoing additional treatment after doctors discovered a “small spot” on his back. His death comes as New Found Glory marks nearly three decades together. The band released its 11th studio album , Listen Up! , in February. Following the album’s release, the", "date_str": "2026-09-20T19:54:36+00:00", "hash": "5a35ef9a460298c4", "title_fa": "چاد گیلبرت، گیتاریست New Found Glory در 45 سالگی درگذشت", "summary_fa": "چاد گیلبرت، یکی از اعضای موسس و گیتاریست گروه New Found Glory درگذشت. او 45 سال داشت. مرگ گیلبرت در رسانه های اجتماعی یکشنبه (20 سپتامبر) توسط گروه پاپ پانک و همسرش، لیزا سیمورلی، شش ماه پس از فاش شدن این موزیسین مبنی بر مبارزه با سرطان اعلام شد. موارد مرتبط رفته اما فراموش نشد: نوازندگانی که در سال 2026 از دست دادیم، گیتاریست New Found Glory، چاد گیلبرت پس از جراحی مغز به‌روزرسانی برای حذف سه تومور ارائه می‌دهد: آغاز فصل جدید New Found Glory بازگشت با یازدهمین آلبوم استودیویی \"Listen Up!\" با آرامش در خواب، گروه نوشت. او این دنیا را در محاصره دوستان و خانواده ترک کرد و آخرین نفس هایش را در حالی که همسر و مادرش در کنارش بودند، همانطور که می خواست، کشید. گروه فلوریدا ادامه داد: \"ما از اینکه او چقدر سریع ما را ترک کرد، ویران و شوکه شدیم، در عین حال بسیار سپاسگزاریم که چقدر آرام و آرام رفت. تعداد بازدیدکنندگانی که در یک لحظه لابی بیمارستان را شلوغ کردند، گواهی بر این است که چاد چقدر محبوب و عزیز بود و همیشه خواهد بود. او یک موسیقی‌دان افسانه‌ای بود، اما موفقیت مورد علاقه‌اش شوهر و پدر بودن بود. بزرگترین رویاهای او به حقیقت پیوست.» این پیام توسط اعضای New Found Glory، Jordan Pundik، Ian Grushka، Cyrus Bolooki، و گیتاریست تور دن اوکانر، همراه با همسر گیلبرت، Cimorelli، امضا شد. گیلبرت در سال‌های اخیر با هواداران در مورد مشکلات سلامتی‌اش صحبت کرده بود. در اواخر ماه مارس، او یک سری عکس از تخت بیمارستان خود به اشتراک گذاشت و طرفداران خود را در مورد بهبودی خود پس از جراحی سرطان مغز به‌روزرسانی کرد. عمل اورژانسی پس از آن انجام شد که او در اوایل همان سال در نشویل برای کنترل حرکت دست چپ خود تلاش کرد. این جراحی چندین سال قبل"}, {"source": "Billboard", "title": "Jhené Aiko Achieves First No. 1 Album on Billboard 200 With ‘Westside Whimsy’", "link": "https://www.billboard.com/music/chart-beat/jhene-aiko-westwide-whimsy-number-one-billboard-200-chart-1236344193/", "summary": "Jhené Aiko achieves her first No. 1 on the Billboard 200 albums chart as Westside Whimsy debuts atop the tally dated Sept. 26. The set earned 74,000 equivalent album units in the United States in the week ending Sept. 17, according to Luminate. It’s the first R B album by a woman to lead the chart in 2026, and the first to rank at No. 1 since SZA’s SOS was tops for a 13th and final week in May of 2025. The only other R B set to hit No. 1 in 2026 was Bruno Mars’ The Romantic (March 14 chart). (R B albums are defined as those that are eligible for, or have charted on, Billboard ’s Top R B Albums chart.) Westside Whimsy was released on Sept. 11, after it was announced on Sept. 8. The project boasts collaborations with Ab-Soul, Larry June, Kendrick Lamar, Ohma and Tyga. Westside Whimsy marks the singer-songwriter’s sixth top 10 overall on the Billboard 200, dating to her first chart entry and top 10, Sail Out , which debuted and peaked at No. 8 in November 2013. The new set is Aiko’s first full-length studio album since 2020’s Chilombo , which debuted and peaked at No. 2 and was later nominated for album of the year at the Grammy Awards. The Billboard 200 chart ranks the most popular albums of the week in the U.S. based on multi-metric consumption as measured in equivalent album units, compiled by Luminate. Units comprise album sales, track equivalent albums (TEA) and streaming equivalent albums (SEA). Each unit equals one album sale, or 10 individual tracks sold from an album, or 2,500 ad-supported or 1,000 paid/subscription on-demand official audio and video streams generated by songs from an album. The new Sept. 26, 2026-dated chart will be posted in full on Billboard s website on Sept. 23, one day later than usual due to observance of Yom Kippur on Sept. 21. For all chart news, follow @billboard and @billboardcharts on both X and Instagram. Of Westwide Whimsy ’s 74,000 first-week equivalent album units, SEA units comprise 70,000 (equaling 71.33 million on-demand official streams of the set’s songs — it debuts at No. 1 on the Top Streaming Albums chart), album sales comprise 3,500 (it debuts at No. 25 on Top Album Sales; it was only available to purchase digitally, as physical editions are due in January) and TEA units comprise 500. Aiko is the second act in 2026 to wait at least 10 years from a Billboard 200 chart debut to a first No. 1. Aiko went 12 years and 10 months from her debut with Sail Out (Nov. 30, 2013-dated chart) until her first leader. Earlie", "date_str": "2026-09-20T19:00:03+00:00", "hash": "5d377322889d37c1", "title_fa": "جنه آیکو با \"Westside Whimsy\" به اولین آلبوم شماره 1 بیلبورد 200 دست یافت.", "summary_fa": "به گفته لومینیت، جهن آیکو اولین شماره 1 خود را در جدول بیلبورد 200 به عنوان Westside Whimsy در صدر فهرست تاریخ 26 سپتامبر به دست آورد. طبق گفته Luminate، این مجموعه در هفته منتهی به 17 سپتامبر 74000 واحد آلبوم در ایالات متحده به دست آورد. این اولین آلبوم R B از یک زن است که در سال 2026 در جدول رهبری می‌شود، و اولین آلبومی است که رتبه اول را از زمانی که SZA SOS برای سیزدهمین و آخرین هفته در ماه مه سال 2025 در صدر قرار گرفت. تنها آلبوم RB دیگری که در سال 2026 به رتبه 1 رسید، The Romantic (چارت 14 مارس) برونو مارس بود. (آلبوم‌های R B به عنوان آلبوم‌هایی تعریف می‌شوند که واجد شرایط هستند یا در چارت آلبوم‌های R B برتر بیلبورد قرار گرفته‌اند.) Westside Whimsy در 11 سپتامبر منتشر شد، پس از اعلام آن در 8 سپتامبر. این پروژه دارای همکاری با Ab-Soul، Larry June، Kendrick Lamar، Ohma و Ty است. Westside Whimsy ششمین 10 آهنگ برتر این خواننده و ترانه سرا در بیلبورد 200 است، که مربوط به اولین ورود او به نمودار و 10 برتر، Sail Out است، که اولین بار در نوامبر 2013 به رتبه 8 رسید. مجموعه جدید اولین آلبوم استودیویی کامل Aiko پس از Chilombo در سال 2020 است که اولین آلبوم را به خود اختصاص داد و در رتبه 2 قرار گرفت و بعداً نامزد بهترین آلبوم سال در جوایز گرمی شد. نمودار بیلبورد 200 محبوب‌ترین آلبوم‌های هفته در ایالات متحده را بر اساس مصرف چند متری که در واحدهای آلبوم معادل اندازه‌گیری شده توسط Luminate جمع‌آوری شده است، رتبه‌بندی می‌کند. واحدها شامل فروش آلبوم، آلبوم‌های معادل آهنگ (TEA) و پخش آلبوم‌های معادل (SEA) هستند. هر واحد معادل یک فروش آلبوم، یا 10 آهنگ منفرد فروخته شده از یک آلبوم، یا 2500 پخش صوتی"}, {"source": "Billboard", "title": "Nicki Minaj Responds to Criticism Over Her Support for Trump Administration: ‘I Just Love Him’", "link": "https://www.billboard.com/music/music-news/nicki-minaj-responds-criticism-trump-support-1236344201/", "summary": "Nicki Minaj is standing by her support for President Donald Trump. On Friday (Sept. 18), the 43-year-old rapper appeared on Fox News’ The Ingraham Angle to discuss the Trump administration’s Million Dollar Pitch Competition for small businesses. Related Nicki Minaj Is a Judge for Trump-Backed $1M Business Pitch Contest: This Is a Major, Major Key Nicki Minaj Joins Donald Trump on Stage at Summit Calls Herself the President s No. 1 Fan President Trump Praises Hot Nicki Minaj at Presidential Luncheon: A Great Friend of Common Sense As expected, the conversation — which also featured Small Business Administration (SBA) Administrator Kelly Loeffler — turned to Minaj’s relationship with Trump. “I am honored to be able to have an opportunity to work with this administration and to work with President Trump. He has inspired many people, not just me. He’s fun,” Minaj said. The “Super Bass” rapper continued, “He’s not just smart, and, you know, he’s not just the president. But he’s also someone tha  بی‌بی‌سی از تهیه‌کنندگان می‌خواهد که چشم‌انداز جدید شجاعانه‌ای را برای سریال‌های علمی تخیلی ارائه کنند، طرح‌هایی که در آن میچل و وب در نقش بازیگران جنگ داخلی انگلیسی بازی می‌کنند که از نقش‌های خود خسته شده‌اند و درگیری بین نیروهای دولتی در جمهوری دموکراتیک کنگو و یک شبه‌نظامی شورشی را بازسازی می‌کنند. Watch on Deadline میچل می پرسد: آیا کاملاً مطمئن هستید که این نژادپرستی نیست؟ آنها موافقت می کنند که در اولین نشانه نژادپرستی، اجرای مجدد را متوقف کنند. وقتی یکی دیگری را با قمه تهدید می کند، اجرای مجدد را متوقف می کنند و به این نتیجه می رسند: نژادپرستانه است. خیلی خیلی نژادپرستانه شرمنده در طرحی دیگر، وب و اولیویا کولمن به تقلید از یک نمایش جدید می‌پردازند و با زنی برقع روبه‌رو می‌شوند. سپس به بحث درباره توهین‌آمیز بودن طرح به وب می‌رسد و زن برقع پوش لباس خود را در می‌آورد تا"}, {"source": "Deadline", "title": "Eagle Eye Drama Acquires ‘The Great Dictator’, Matthew Sweet’s Biography Of Barbara Cartland", "link": "https://deadline.com/2026/09/barbara-cartland-biography-tv-adaptation-eagle-eye-drama-1237109132/", "summary": "EXCLUSIVE: Eagle Eye Drama has acquired the rights to The Great Dictator, Matthew Sweet s biography of the flamboyant and eccentric late Dame Barbara Cartland. Historian, novelist and screenwriter Sweet s book tells the story of author known as The Queen of Romance Cartland, who was one of the UK s most recognizable figures across the 20th century. [ ]", "date_str": "2026-09-21T09:29:54+00:00", "hash": "576675ea89ddf2f6", "title_fa": "درام Eagle Eye Acquires «دیکتاتور بزرگ»، زندگینامه باربارا کارتلند متیو سویت", "summary_fa": "انحصاری: Eagle Eye Drama حقوق دیکتاتور بزرگ، زندگینامه متیو سوییت از دامم باربارا کارتلند پر زرق و برق و عجیب و غریب را به دست آورده است. کتاب سوئیت مورخ، رمان‌نویس و فیلمنامه‌نویس، داستان نویسنده‌ای معروف به ملکه کارتلند عاشقانه را روایت می‌کند که یکی از شناخته‌شده‌ترین چهره‌های بریتانیا در قرن بیستم بود. [ ] او به این شهرت داشت که لباس صورتی می پوشید و هر جا که می رفت سگ های پکینیز خود را با خود می برد. کارتلند که در سال 1901 به دنیا آمد، یکی از اعضای جامعه عالی بریتانیا بود که به عنوان مادربزرگ پرنسس دایانا، با بارون های مطبوعات، سیاستمداران، اشراف و خانواده سلطنتی دست و پنجه نرم می کرد. داستان‌های مرتبط لغو و تمدید مارک گیتیس درام کتابش بازگشت برای فصل سوم خریدهای ویژه جشن HBO Max خرید مجموعه مارک گیتیس کتابی برای استرالیا به عنوان پاس فروش کتاب Sweet یکی از نویسندگان 100 منطقه مارک بوکیش، که این ماه توسط هادر استوتون منتشر شد، نتیجه سال‌ها تحقیق او است. این اثر توسط افرادی مانند گاردین، تایمز و مستندساز لوئیس تروکس مورد بررسی مثبت قرار گرفته است، و Eagle Eye متعلق به استودیوی ITV اکنون به دنبال اقتباس از داستان زن صورتی‌پوش است که رمان‌های عاشقانه‌اش نزدیک به یک میلیارد نسخه به 38 زبان فروخته است. والتر ایوزولینو، مدیر عامل شرکت Deadline Eagle Eye Drama گفت: متیو سویت به آرشیو خانواده کارتلند دسترسی بی‌نظیری پیدا کرد و آنچه او کشف کرد داستانی جذاب‌تر و باورنکردنی‌تر از عجیب‌ترین توطئه‌های اوست که بستری فوق‌العاده برای ساخت یک سریال غیرقابل از دست دادن را فراهم می‌کند."}, {"source": "Deadline", "title": "Presley Gerber Dies: Model, Son Of Cindy Crawford & Rande Gerber Was 27", "link": "https://deadline.com/2026/09/presley-gerber-dead-cindy-crawford-son-1237109082/", "summary": "Presley Walker Gerber, a model and the only son of Cindy Crawford and Rande Gerber, has died. A representative for the family confirmed the news to Deadline. He was 27. A statement from the family read as follows: The family is asking for privacy during this very difficult and painful time. An L.A. County Medical [ ]", "date_str": "2026-09-21T03:44:41+00:00", "hash": "96ff926146ec78cb", "title_fa": "پریسلی گربر درگذشت: مدل، پسر سیندی کرافورد و رانده گربر 27 ساله بود", "summary_fa": "پریسلی واکر گربر، مدل و تنها پسر سیندی کرافورد و رانده گربر درگذشت. یکی از نمایندگان خانواده این خبر را به ددلاین تایید کرد. او 27 سال داشت. بیانیه خانواده به شرح زیر است: خانواده در این دوران بسیار سخت و دردناک خواستار حفظ حریم خصوصی هستند. یک پزشک کانتی لس آنجلس [ ] گزارش یک پزشک پزشکی شهرستان لس آنجلس می گوید که گربر در یک مرکز توانبخشی درگذشت. تحقیقات در مورد علت ادامه دارد. گربر با مدل های IMG قرارداد امضا کرد و در یک تبلیغ پپسی در سال 2018 با مادرش ظاهر شد. حرفه مدلینگ او با فیلمبرداری بروس وبر در سال 2015 آغاز شد. او به زودی در هفته های مد مختلف در سراسر جهان کار باند فرودگاه را انجام داد. او در مصاحبه ای در سال 2023 با پادکست استودیو 22، گردباد را به یاد آورد. گربر گفت: تمام زندگی من در عرض یک ماه تغییر کرد و این فقط یک تجربه بسیار عمیق بود زیرا باید به سرعت بزرگ می شدم. در سال 2019، او به دلیل یک DUI در بورلی هیلز دستگیر و به سه سال حبس تعلیقی محکوم شد. سپس در 19 سالگی، به گربر دستور داده شد تا یک برنامه DUI را تکمیل کند. خواهر کوچکتر او، کایا گربر، در حال حاضر نقش سوزان رینولدز را در فیلم The Shards به کارگردانی رایان مورفی بازی می کند. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید. دعای من برای پریسلی جوان، خانواده اش و همه کسانی که او را می شناختند و دوستش داشتند. تلاش برای بهتر شدن و مردن در جوانی بسیار غم انگیز است. سه عضو معروف خانواده و تلاش"}, {"source": "Deadline", "title": "Paramount Settlement Talks Prospects Dim For Now As Gang Of Four AGs Resist Quick Ellison Deal", "link": "https://deadline.com/2026/09/paramount-settlement-latest-opposition-bonta-1237109024/", "summary": "EXCLUSIVE: As Hollywood celebrates Yom Kippur tonight, a framework for a settlement of the antitrust suit hampering Paramount s $111 billion acquisition of Warner Bros Discovery has hit some political potholes, even as some hoped for a quick deal. Four of the 12 Attorneys General that took the David Ellison-run company to federal court are breaking [ ]", "date_str": "2026-09-21T02:43:07+00:00", "hash": "077f93d5c3cb8666", "title_fa": "چشم انداز مذاکرات حل و فصل پارامونت فعلاً کم رنگ است زیرا باند چهار نفره AG در برابر معامله سریع الیسون مقاومت می کند", "summary_fa": "اختصاصی: در حالی که هالیوود امشب یوم کیپور را جشن می گیرد، چارچوبی برای حل و فصل پرونده ضد انحصار که مانع خرید 111 میلیارد دلاری شرکت برادران وارنر از سوی پارامونت می شود، به برخی از چاله های سیاسی برخورد کرده است، حتی در شرایطی که برخی امیدوار به یک معامله سریع بودند. چهار نفر از 12 دادستان کل که شرکت تحت مدیریت دیوید الیسون را به دادگاه فدرال بردند، در حال شکستن [ ] تاریخ محاکمه 2 مارس 2027 در این مورد تعیین شده است که باعث ناراحتی پارامونت شد. اکنون ددلاین را تماشا کنید، از آنجایی که فشار به دادگاهی برای افکار عمومی نمایندگان ایالت آبی تبدیل می‌شود، کیت الیسون AG مینه‌سوتا است که در مقابل توافق با دیوید الیسون مقاومت می‌کند (بدون رابطه، اما طنز غیرقابل انکار است). الیسون، یک دلال دموکرات باسابقه، به باند چهار نفری ملحق می شود که AG لتیتیا جیمز قدرتمند نیویورک، ویلیام تانگ از کانکتیکات و نیک براون از ایالت واشنگتن هستند. ما می شنویم که کوارتت نگران این است که پارامترهای تسویه بیش از حد نسبت به پارامونت ملایم باشد. ایالت ها می خواهند که بونتا سرعت خود را کاهش دهد و نسبت به تهدیدات خروج پارامونت از کالیفرنیا یا سایر فشارهای خارجی واکنش بیش از حد نشان ندهد. به طور خاص، از آنجایی که تعداد بیشتری از دموکرات‌ها، فهرست‌های هالیوود و فعالان اصرار دارند که توافق با MAGA مجاور پارا را رد کنند، باند چهار به قدرت هیئت تحریریه پیشنهادی CNN بدبین هستند. یک فرد نزدیک به بحث به ددلاین می گوید که دندان ندارد. (دیوید) الیسون خواهان یک معامله است، بونتا برای انجام یک معامله تحت فشار است. هر دو رمپ خارج از سطح می خواهند. نگرانی در میان چهار ایالتی که هنوز توافقنامه ای را امضا نکرده اند این است که برخی از پنجره های تزئین شده"}, {"source": "Deadline", "title": "Jake & Logan Paul Address Troops At The Pentagon", "link": "https://deadline.com/2026/09/jake-paul-logan-address-troops-pentagon-1237109028/", "summary": "The day before National POW/MIA Recognition Day, Jake and Logan Paul addressed troops gathered at the Pentagon. From the podium, Logan Paul told those gathered that touring the building was a cool experience. He added, I don t think there is any greater commitment to sacrifice than those who are willing to live, die and fight [ ]", "date_str": "2026-09-21T01:54:43+00:00", "hash": "d7e201247736c2f0", "title_fa": "جیک و لوگان پل به سربازان در پنتاگون خطاب می کنند", "summary_fa": "یک روز قبل از روز ملی به رسمیت شناختن اسرا/MIA، جیک و لوگان پل برای سربازانی که در پنتاگون جمع شده بودند سخنرانی کردند. لوگان پل از روی تریبون به افرادی که گرد هم آمده بودند گفت که گشت و گذار در ساختمان تجربه جالبی بود. وی افزود، فکر نمی‌کنم تعهدی برای فداکاری بیشتر از کسانی که مایل به زندگی، مردن و مبارزه هستند وجود داشته باشد. با موسیقی متورم، اعضای سرویس خندان را نشان می داد که با دقت به صحبت های برادران گوش می دادند. همچنین دیدار این دو نفر با وزیر دفاع پیت هگزت را نشان داد. خبرهای مرتبط اخبار جیک لوگان پل لند Fight Competition Competition در Hulu ESPN از Wheelhouse اخبار MVP جورج کلونی پیت هگزث را در مورد پست کادت کانادا مورد انتقاد قرار داد. صدای حمایت از میوزهای مارک روفالو در ادغام برادران پارامونت-وارنر - ونیز در همان روز، به نظر می‌رسد جیک پل با اسکات بسنت، وزیر خزانه‌داری ملاقات کرد. تماشا در ددلاین در پستی حاوی عکس‌هایی از بازدید، بسنت نوشت، مسیر جیک از سازنده محتوا به کارآفرین و بوکسور حرفه‌ای یک داستان کاملاً آمریکایی است. این برادران که ستاره های یوتیوب با تجربه در بوکس و کشتی هستند در اوایل این ماه یک سری مسابقات مبارزه را در Hulu و ESPN وارد کردند. این سریال بدون عنوان، که قبلاً عنوان کاری آن جزیره مبارزه بود، یک بیانیه اصلی از دیزنی است و قرار است برای مخاطبان جوان و مرد جذاب باشد. این سریال برگرفته از Wheelhouse برنت مونتگومری است که پشت سر سریال هایی مانند راز میلیون دلاری نتفلیکس و راه اندازی مجدد سلسله اردک A E و با ارزش ترین تبلیغات جیک پل قرار دارد. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید."}, {"source": "Deadline", "title": "Ke Huy Quan Reveals “Life Changing” Gesture From Spielberg & Lucas When He Was A Kid", "link": "https://deadline.com/2026/09/ke-huy-quan-spielberg-lucas-indiana-jones-payment-1237109016/", "summary": "Ke Huy Quan was 12 years old when he made Indiana Jones and the Temple of Doom. In his new memoir, Never Say Die, excerpted in Entertainment Weekly, the Oscar-winning actor reveals that producer George Lucas and director Steven Spielberg took care of him in way he didn t know about until after filming had concluded. [ ]", "date_str": "2026-09-21T00:44:54+00:00", "hash": "34324d0b0552b295", "title_fa": "کی هوی کوان ژست «تغییر زندگی» اسپیلبرگ و لوکاس را در کودکی فاش کرد", "summary_fa": "کی هوی کوان 12 ساله بود که ایندیانا جونز و معبد عذاب را ساخت. این بازیگر برنده اسکار در خاطرات جدید خود، هرگز نگو بمیر، که در اینترتینمنت ویکلی گزیده شده است، فاش می‌کند که جورج لوکاس تهیه‌کننده و کارگردان استیون اسپیلبرگ از او به گونه‌ای مراقبت می‌کردند که او تا پایان فیلمبرداری از او خبر نداشت. کوان می نویسد: یک روز بعد از ظهر، به آشپزخانه رفتم و پدر و مادرم را دیدم که کنار هم پشت میز ایستاده بودند. مامان پاکتی در دست داشت که اسم من روی آن چاپ شده بود. بابا کاغذهایی که داخلش بود داشت. هر دو خندان بودند، لبخندی که ناشی از تعجب و ناباوری است. همه چیز را به من دادند. چکی از لوکاس فیلم بود. تقریباً 100000 دلار بود، مبلغی که برای من معنی نداشت. Quan قبلاً هزینه پروژه را پرداخت کرده بود. در Deadline تماشا کنید اما فیلم بیش از 300 میلیون دلار در سراسر جهان به دست آورد و کارگردان و تهیه کننده مطمئن شدند که کودک در این جایزه سهیم شود. در آن زمان، تقریباً هیچ بازیگری بخشی از سود یک فیلم را به دست نمی آورد. حتی امروز، فقط بزرگترین ستاره ها این کار را می کنند. اینکه بچه‌ای مثل من که اولین فیلمش را می‌سازد، در چنین چیزی قرار می‌گیرد، چیزی غیرقابل شنیده بود. و معبد عذاب فیلم کوچکی نبود که انتظار نمی رفت کسی ببیند. این فیلم دنباله‌ای بر یک موفقیت بزرگ بود، فیلمی که همه می‌دانستند پول زیادی به همراه خواهد داشت. این ژست آنها را سخاوتمندانه تر کرد. این بازیگر افزود: این سهم کوچک زندگی خانواده من را تغییر داد. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق"}, {"source": "Netflix NL", "title": "Netflix-kijkers roepen allemaal hetzelfde over dramaserie", "link": "https://www.netflix-nederland.nl/netflix-kijkers-roepen-allemaal-hetzelfde-over-d
