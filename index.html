<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <title>مجله خبری روزانه — ۲ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {

      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

غییر شکل بوده است. عامل اصلی این پدیده، کاهش جرم صفحات یخی قطبی و جابه‌جایی حجم عظیمی از آب حاصل از ذوب آن‌ها عنوان می‌شود. کریستوفر کوتساکیس، استاد زمین‌سنجی در دانشگاه ارسطوی تسالونیکی یونان و نویسنده‌ی پژوهش، برای بررسی این تغییرات از داده‌های سامانه‌ی جهانی ناوبری ماهواره‌ای (GNSS) استفاده کرد. این سامانه امکان اندازه‌گیری جابه‌جایی‌های بسیار کوچک سطح زمین را فراهم می‌کند. ذوب یخ‌های قطبی فشار واردشده بر پوسته‌ی زمین را کاهش می‌دهد و باعث بالاآمدن تدریجی سطح زمین در قطب‌ها می‌شود نتایج بررسی‌ها نشان داد که بین سال‌های ۲۰۱۱ تا ۲۰۱۵، سطح زمین در نواحی قطبی سالانه حدود ۰٫۵ تا یک میلی‌متر بالا آمده است. در همین دوره، برآمدگی سطح جامد زمین در ناحیه‌ی استوا نیز تقریباً با سرعت مشابهی کاهش یافته است. مقایسه‌ی داده‌ها نشان می‌دهد که سرعت تغییر شکل زمین در دوره‌ی ۲۰۱۱ تا ۲۰۱۵ بیشتر از دوره‌ی ۱۹۹۷ تا ۲۰۰۰ بوده است. براساس محاسبات پژوهشگر، سرعت بالاآمدن قطب‌ها در هر دهه حدود ۰٫۲۵ میلی‌متر در سال افزایش می‌یابد و سرعت فرونشست ناحیه‌ی استوا نیز در هر دهه حدود ۰٫۴ میلی‌متر در سال بیشتر می‌شود. شاید این اعداد در مقایسه با قطر تقریباً ۱۲٬۸۰۰ کیلومتری زمین ناچیز به نظر برسند، اما نشان می‌دهند که حتی تغییرات اقلیمی می‌توانند", "image_url": "https://api2.zoomit.ir/media/earth-planet-from-space-6adb02211d07f08d25c659ed?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۷:۵۵"}, {"source": "Zoomit", "title": "قوانین چین، مانع احتمالی بر سر ادغام اسپیس‌ایکس و تسلا", "link": "https://www.zoomit.ir/business/469624-musk-tesla-spacex-merger-china/", "summary": "ایلان ماسک از تشکیل کارگروه‌های ویژه برای بررسی ادغام تسلا و اسپیس‌ایکس خبر داد؛ اما نظارت‌های امنیتی چین و آمریکا چالش‌ساز خواهند بود.", "date_str": "2026-10-23T14:00:00+00:00", "hash": "7016fd9227d0e3b3", "title_fa": "قوانین چین، مانع احتمالی بر سر ادغام اسپیس‌ایکس و تسلا", "summary_fa": "ایلان ماسک از تشکیل کارگروه‌های ویژه برای بررسی ادغام تسلا و اسپیس‌ایکس خبر داد؛ اما نظارت‌های امنیتی چین و آمریکا چالش‌ساز خواهند بود. تبلیغات برنامه‌ی احتمالی ایلان ماسک برای ادغام تسلا و اسپیس‌ایکس به دلیل نگرانی‌های امنیتی فزاینده پیرامون اشتراک‌گذاری داده‌ها و فناوری‌های محرمانه، با سد نظارتی پکن و واشینگتن روبه‌رو خواهد شد. ثروتمندترین فرد جهان اعلام کرد که این دو شرکت کمیته‌های ویژه‌ای برای بررسی امکان پیوستن به یکدیگر تشکیل داده‌اند و چنین اقدامی را ایده‌ای خوب دانست، هرچند تحقق آن نیازمند حل تعارض میان وابستگی شدید تسلا به تولید در چین و قراردادهای نظامی اسپیس‌ایکس است. به‌گزارش خبرگزاری رویترز ، اسپیس‌ایکس به‌طور روزافزون به قراردادهای حساس وزارت دفاع ایالات متحده تکیه دارد و بخش‌هایی مانند Starshield سامانه‌های ماهواره‌ای نظامی و اطلاعاتی برای پنتاگون می‌سازند. هم‌زمان، رگولاتورهای چینی تسلا را موظف کرده‌اند اطلاعات گردآوری‌شده به‌وسیله‌ی سامانه‌های رانندگی خودکار را در خاک چین نگه دارد، بنابراین هرگونه ادغام نیازمند ایجاد دیواره‌های آتش بسیار مستحکم خواهد بود تا مانع از تبادل داده‌ها در هر دو جهت شود. کریستوفر تانگ، استاد دانشکده‌ی مدیریت اندرسون در دانشگاه یوسی‌ال‌ای، گفت: «چین از این وضعیت به‌عنوان اهرم فشار استفاده خواهد کرد. آن‌ها در حال حاضر قدرت چانه‌زنی بالایی دارند.» کارشناسان گزینه‌هایی نظیر واگذاری کامل یا محدود فعالیت‌های تسلا در چین را مطرح کرده‌اند؛ اما با توجه به اینکه کارخانه‌ی شانگهای بیش از ۵۰ درصد خروجی جهانی تسلا را تامین می‌کند، جدایی کامل دشوار خواهد بود. تانگ می‌گوید: «دقیقا به همین دلیل است که چین از این موقعیت بهره‌برداری خواهد کرد؛ چراکه شما همچنان به آن‌ها نیاز دارید.» لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟", "image_url": "https://api2.zoomit.ir/media/spacex-68f330fca358db02e0905de8?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I swapped houses with a stranger to see if I liked living in Seattle. One month in, I got my answer.", "link": "https://www.businessinsider.com/tested-living-in-seattle-for-month-home-exchange-2026-10", "summary": "I lived in Seattle for a month to see if i wanted to move there permanently. Heather Snow I swapped homes with a stranger and traded my San Francisco condo for a house in Seattle. For a month, I lived in Seattle to figure out if I would want to move there permanently. Although Seattle isn't the right city for me, the experience taught me what I want in my next home. After 18 years of living in San Francisco , I was seriously starting to consider moving. I loved the life I had built there, but taking the next step — like buying my own house with a yard — felt out of reach for me. However, I was afraid I would regret leaving the place I had called home for so many years. When thinking of places I'd like to live, Seattle immediately came to mind. I figured the city would offer similar energy and career opportunities as San Francisco , and I loved its proximity to striking natural beauty. Plus, I'd visited the West Coast city many times and had a good friend who lived there, so it seemed like a logical move. But instead of taking the leap immediately, I decided to test out living in the city for a month to make sure it was the right fit for me. Through HomeExchange, a platform that allows users to swap homes with people from around the world, I traded my Noe Valley condo for a house with a yard in the Ballard neighborhood of Seattle for the month of July. I got to experience Seattle as a local instead of a tourist It was interesting being able to experience the city as a local would. Heather Snow Although I'd visited Seattle many times over the years, this was my first chance to test everyday life there with my dog, Pepper — not just experience the city as a tourist. I worked remotely, went grocery shopping , and checked out the Ballard Farmers Market on Sundays. Pepper and I explored different parks on morning walks and went to local breweries in the evenings. I really prioritized spending time in Ballard, since that was the neighborhood I was most interested in possibly calling home. I loved that the residential parts were filled with single-family homes on tree-lined street  محلی تجربه کنم. هدر اسنو", "image_url": "https://i.insider.com/6adb68c6dc67b5b4d01f6d32?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۷:۵۶"}, {"source": "Business Insider", "title": "A pair of big-name, macro portfolio managers are out at ExodusPoint less than a year after joining", "link": "https://www.businessinsider.com/exoduspoint-macro-traders-out-2026-10", "summary": "ExodusPoint is one of several hedge funds that have expanded in Dubai in recent years. FADEL SENNA / AFP via Getty Images Chris Wheeler and Daniel Dangoor have both left $15.5 billion hedge fund ExodusPoint Capital. The two Dubai-based PMs were at the firm for less than a year. The pair were macro investors, a subset of the industry that's been hit hard by interest-rate increases. A pair of pedigreed traders have left Michael Gelband's ExodusPoint Capital, two people familiar with the matter told Business Insider. Chris Wheeler and Daniel Dangoor, each of whom ran their own macro investing team for the $15.5 billion hedge fund, are no longer at the firm. The pair were based in ExodusPoint's Dubai offices and had joined the manager less than a year ago in separate moves. ExodusPoint declined to comment. Wheeler and Dangoor did not immediately respond to requests for comment. Wheeler started at the firm last December after stints managing money for Michael Platt's BlueCrest Capital and Ken Griffin's Citadel. Dangoor, meanwhile, only started in June as a senior portfolio manager after a one-year stint at Goldman Sachs' London office, where he was the firm's head of macro thematic trading. He's also previously traded for SPX Capital and Brevan Howard. It's unclear what the two PMs focused on within the broader macro world, but there's been plenty of pain across many British, Swiss, and Emirati trading desks recently. Macro firms, including Diego Megia's Taula Capital , have been caught off guard by interest-rate increases and broader  was open from 9 a.m. to 2 p.m. and then again from 5 to 8 p.m. I was so angry — I had wasted my lunch break and didn't even accomplish what I set out to do. At first, I thought Spain was making me less productive On Sunday, the streets often feel pretty quiet. Jordan Mautner Growing up in Los Angeles , I was used to being able to get pretty much anything done at almost any time of day. Between 24-hour supermarkets and medical offices with evening and weekend hours, everything there seemed built around convenience. In Barcelona, though, rest seems to take priority. Many stores close during midday for a \"siesta\" or \"nap\" break, and a lot of businesses are not open on Sundays. At first, I found it tough to adjust to the usual hours for many businesses in Barcelona. Jordan Mautner This new way of life meant I had to plan a lot more before trying to complete my to-do list . I couldn't simply squeeze in errands when they were convenient for me; I had to work around the schedules of those around me. While living in LA , my favorite time to do grocery shopping was on Sunday. I could fill up my fridge and prepare for the week ahead, but that was no longer possible in Barcelona, as many big supermarkets are closed on Sundays. During my first year in Spa", "date_str": "2026-10-23T13:55:01+00:00", "hash": "ec43e08830bfd3d5", "title_fa": "بعد از 6 سال حضور در بارسلونا، متوجه شدم یکی از \"بدترین\" قسمت های زندگی در اینجا واقعاً باعث خوشحالی من است.", "summary_fa": "به عنوان یک آمریکایی که در اسپانیا زندگی می کنم، در ابتدا تلاش کردم تا خود را با فرهنگ و برنامه های این کشور وفق دهم. جردن ماوتنر شش سال پیش از لس آنجلس به بارسلونا نقل مکان کرد با چند شوک فرهنگی همراه بود. در ابتدا، من با مشاغلی که در تعطیلات ظهر استفاده می‌کردند و اکثر مغازه‌ها یکشنبه‌ها تعطیل بودند، مشکل داشتم. در نهایت سازگار شدم. اکنون از استراحت ها قدردانی می کنم و فشار کمتری برای بهینه سازی تمام وقتم احساس می کنم. 30 دقیقه از استراحت ناهارم باقی مانده بود - فقط زمان کافی برای انجام یک کار جدید قبل از اینکه e you can put money on everything from sports to elections to Labubu prices . But niche data points can provide valuable insights, with implications for companies and assets across a variety of markets and sectors. Hedge funds have known this for a long time. Firms use satellite imagery of Walmart parking lots to gauge customer flow, and have staff dedicated to predicting weather patterns that could impact commodities trades. Kalshi and alternative data platform Carbon Arc are aiming to allow users to make similar bets via sector KPI contracts that track things like point-of-sale data and app downloads. For example, instead of taking a view on ChatGPT downloads specifically, traders can predict AI downloads broadly with the new contracts. \"If you have a thesis about something that's going to happen in the world, and you try to use a stock as a proxy for that, it often doesn't really work because you might be right about your view, but the stock will move a different direction for any number of reasons,\" Kalshi's Jack Such told Business Insider. Such acknowledged that other investment vehicles such as exchange-traded funds ETFs can provide a similar type of protected exposure for investors who want to minimize the risk that comes from owning single stocks. But he added that Kalshi views the KPI contracts differently. When someone buys an ETF, for instance, their return depends on a basket of stocks, whereas KPI markets can help express a view on a type of business metric that might not be reflected in a single company's fundamentals. \"We already have a Tesla production by quarter, for example, and ChatGPT downloads, Claude downloads, and Cava foot traffic,\" Such noted. \"We wanted to kind of 'ETF-ify' these corporate KPI markets that we have, and that's why we're launching these.\" S", "date_str": "2026-10-23T13:06:30+00:00", "hash": "30621ec441e35a44", "title_fa": "کالشی می‌خواهد قراردادهای جدیدش راهی برای پیش‌بینی حرکت بازارها بدون خرید سهام باشد", "summary_fa": "Samuel Boivin/NurPhoto از طریق Getty Images قراردادهای جدید Kalshi راهی برای پیش‌بینی مسیر بازارها است. قراردادهای جدید آن به مردم این امکان را می‌دهد تا به مواردی مانند ترافیک پیاده‌روی و دانلود برنامه‌ها نگاه کنند. کالشی به Business Insider گفت: «ما می‌خواستیم این بازارهای KPI شرکتی را «ETF-ify» کنیم. اگر سهام والمارت صعودی یا نزولی هستید، احتمالاً فقط سهام می‌خرید و نگه می‌دارید یا گزینه‌هایی را می‌خرید که شرط می‌بندند سهام سقوط کند. با این حال، به زودی، Kalshi از کاربران می‌خواهد که از پلتفرم پیش‌بینی برای راه دیگری برای شرط‌بندی در مورد اینکه بازارها و اقتصاد به کجا می‌روند، استفاده کنند. پیش‌بینی مواردی مانند ترافیک خرده‌فروشی یا دانلود برنامه‌ها به نظر یک شرط‌بندی دنیوی است، به‌ویژه در پلتفرمی که می‌توانید در آن از ورزش گرفته تا انتخابات و قیمت‌های Labubu پول بگذارید. اما نقاط داده‌ای خاص می‌توانند بینش‌های ارزشمندی را با پیامدهایی برای شرکت‌ها و دارایی‌ها در بازارها و بخش‌های مختلف ارائه دهند. صندوق های سرمایه گذاری از مدت ها قبل این را می دانستند. شرکت‌ها از تصاویر ماهواره‌ای پارکینگ‌های Walmart برای اندازه‌گیری جریان مشتری استفاده می‌کنند و کارکنان خود را به پیش‌بینی الگوهای آب‌وهوا که می‌تواند بر معاملات کالاها تأثیر بگذارد اختصاص داده است. Kalshi و پلتفرم داده جایگزین Carbon Arc قصد دارند به کاربران اجازه دهند تا از طریق قراردادهای بخش KPI که مواردی مانند داده های نقطه فروش و بارگیری برنامه ها را ردیابی می کنند، شرط بندی های مشابه انجام دهند. به عنوان مثال، معامله‌گران به‌جای نگاهی خاص به دانلودهای ChatGPT، می‌توانند بارگیری‌های هوش مصنوعی را به طور گسترده با قراردادهای جدید پیش‌بینی کنند. جک سوچ از Kalshi به Business Insider گفت: \"اگر شما یک پایان نامه در مورد چیزی که قرار است در جهان اتفاق بیفتد دارید، و سعی می کنید از یک سهام به عنوان پروکسی برای آن استفاده کنید، اغلب واقعاً کار", "image_url": "https://i.insider.com/6ada4116510d67c758d85d5e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "بورس و طلا"], "datetime_fa": "۱ آبان • ۱۶:۳۶"}, {"source": "Business Insider", "title": "I'm a professional declutterer. Here's why I tell people to get rid of 5 things every single day.", "link": "https://www.businessinsider.com/decluttering-home-without-feeling-overwhelmed-2026-10", "summary": "The author suggests getting rid of 5 things a day. Natalia Lebedinskaia/Getty Images Getting rid of just five things a day can make decluttering feel much more manageable. Small daily efforts add up, helping clear crowded drawers and surfaces over time. The key is consistency, not trying to organize your entire home in one weekend. The holidays are around the corner, and soon the chaos of hosting and travel will start. If tidying the house and reducing your clutter are things you thought you'd get to this year, let's take the pressure off and do it as gently as possible, before it ends. I help my clients get rid of clutter year-round . Here are a few strategies to make a tough task easier. Be realistic One thing that can derail your decluttering project is false optimism. Have you ever said, \"We'll clear out the garage on Saturday and w'll do something fun Sunday!\"? Taking care of stuff that has resisted management for years won't be done in an afternoon. There are so many choices to make when you're trying to get rid of things, and that's where confusion and exhaustion make a seemingly simple process into one that's hard to face. But don't despair — you can make progress and get things tidied up before next year. Imagine not having this task on your list when spring's optimism returns. Slow and steady is key You remember the tortoise and the hare? Slow and steady wins the race, and it will also get your home feeling more spacious and tidy. Try the five-a-day (or three-a-day, or two-a-day) method. Put a cardboard box in your back hall, garage, or other staging area. Choose five (or three or two) things every day and toss them in the box — or the trash. These items can be anything; on a challenging day, you might get rid of an old dried-up glue stick, a charging cord that doesn     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
