خت کمک‌های داوطلبانه در ازای هدایت کشتی‌ها هنگام عبور از تنگه آمادگی وجود دارد. به گفته سه منبع آگاه از این طرح‌ها، چارچوب حقوقی پیشنهادی عمان شامل پرداخت داوطلبانه"}, {"source": "Euronews Persian", "title": "دونالد ترامپ وعده می‌دهد تعرفه ۱۵ درصدی ویسکی ایرلندی را حذف کند", "link": "https://parsi.euronews.com/business/2026/09/14/donald-trump-pledges-to-remove-a-15-tariff-on-irish-whiskey", "summary": "دونالد ترامپ، رئیس‌جمهور آمریکا، روز یکشنبه در پایان یک مسابقه گلف در ایرلند اعلام کرد که قصد دارد تعرفه ۱۵ درصدی واردات ویسکی ایرلندی را حذف کند.", "date_str": "2026-09-14T03:06:19+00:00", "hash": "43976e7de979db85", "title_fa": "دونالد ترامپ وعده می‌دهد تعرفه ۱۵ درصدی ویسکی ایرلندی را حذف کند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp دونالد ترامپ، رئیس‌جمهور آمریکا، روز یکشنبه در پایان یک مسابقه گلف در ایرلند اعلام کرد که قصد دارد تعرفه ۱۵ درصدی واردات ویسکی ایرلندی را حذف کند. ترامپ در مراسم اهدای جام مسابقات ایرش اوپن گفت که همه، حتی بعضی از گلف‌بازان، از او درباره این موضوع پرسیده‌اند. ترامپ، رئیس‌جمهوری جمهوری‌خواه، گفت: «همه مدام از من می‌خواهند این کار را انجام بدهم. و من گفتم: به نمایندگی از ایالات متحده آمریکا، تعرفه‌ها را از ویسکی ایرلندی برمی‌دارم». در حال حاضر ویسکی ایرلندی مشمول تعرفه ۱۵ درصدی‌ای است که ترامپ بر واردات از اتحادیه اروپا اعمال کرده است. ترامپ در ماه مه اعلام کرد برخی از تعرفه‌ها بر ویسکی بریتانیا را لغو می‌کند؛ تعرفه‌هایی که شامل اسکاتچ و نوشیدنی‌های الکلی تولیدشده در ایرلند شمالی می‌شود. این اعلام غیرمنتظره ترامپ در پایان مسابقات با سوت‌ها و تشویق‌های بلند تماشاگران روبه‌رو شد. انجمن ویسکی ایرلند در ماه مه خواستار لغو این تعرفه‌ها شد و استدلال کرد چنین تصمیمی به بسیاری از شرکت‌های آمریکایی که محصولات ایرلندی در سبدشان دارند کمک می‌کند و از بی‌ثباتی برای مصرف‌کنندگان جلوگیری می‌کند. جزئیات مربوط به این که تعرفه‌ها دقیقا چه زمانی برداشته می‌شود، بلافاصله در دسترس نبود."}, {"source": "Euronews Persian", "title": "شی جین پینگ چین ایجاد «منطقه هوش مصنوعی متن‌باز» برای بریکس را پیشنهاد داد", "link": "https://parsi.euronews.com/next/2026/09/14/chinas-xi-jinping-proposes-brics-open-source-ai-zone", "summary": "شی جین پینگ، رئیس‌جمهور چین، روز یکشنبه در نشست گروه ۱۱ عضوی بریکس در دهلی نو اعلام کرد چین رهبری ایجاد «منطقه متن‌باز هوش مصنوعی» برای کشورهای بریکس را بر عهده می‌گیرد.", "date_str": "2026-09-14T03:01:21+00:00", "hash": "159f1381939f0552", "title_fa": "شی جین پینگ چین ایجاد «منطقه هوش مصنوعی متن‌باز» برای بریکس را پیشنهاد داد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp شی جین پینگ، رئیس‌جمهور چین، روز یکشنبه در نشست گروه ۱۱ عضوی بریکس در دهلی نو اعلام کرد چین رهبری ایجاد «منطقه متن‌باز هوش مصنوعی» برای کشورهای بریکس را بر عهده می‌گیرد. شرکت‌های چینی فعال در حوزه هوش مصنوعی مدل‌های متن‌باز پیشروی جهانی تولید می‌کنند؛ مدل‌هایی که کد زیربنایی آنها برای انطباق توسط کاربران در دسترس است، در حالی که توسعه‌دهندگان آمریکایی بیشتر رویکردهای بسته را ترجیح داده‌اند. به گزارش متن سخنرانی شی جینپینگ که از سوی شبکه دولتی سی‌سی‌تی‌وی منتشر شد، این پیشنهاد که بخشی از «ابتکار هوش مصنوعی متن‌باز و فراگیر» رهبر چین است، شامل وعده «حمایت از همکاری در توسعه و کاربرد مدل‌های زبانی بزرگ» می‌شود. شی جینپینگ گفت این ابتکار همچنین ایجاد «پژوهش و آموزش تخصصی در حوزه هوش مصنوعی» برای کشورهای عضو بریکس را با هدف «ایجاد یک اکوسیستم باز برای هوش مصنوعی» در بر می‌گیرد. گروه بریکس که چین، روسیه و هند را نیز در بر می‌گیرد، در سال ۲۰۰۹ به عنوان مجمعی برای اقتصادهای بزرگ نوظهور ایجاد شد تا در نهادهای تحت سلطه قدرت‌های غربی نفوذ بیشتری به دست آورند. شی جینپینگ همچنین خواستار ایجاد یک «چارچوب گسترده و مبتنی بر اجماع برای حکمرانی جهانی بر هوش مصنوعی» شد. انتظار می‌رود شی جینپینگ ماه جاری برای گفت‌وگو با دونالد ترامپ، رئیس‌جمهور آمریکا، به این کشور سفر کند؛ حکمرانی بر هوش مصنوعی احتمالا بخشی از مذاکرات دو طرف خواهد بود، زیرا نگرانی‌ها از آنکه جهان کنترل خود را بر این فناوری به‌سرعت در حال توسعه از دست بدهد رو به افزایش است."}, {"source": "Euronews Persian", "title": "۹۲ کماندوی آمریکایی در خاک ایران؛ سرنشین جنگنده سرنگون‌شده از عملیات نجاتش می‌گوید", "link": "https://parsi.euronews.com/2026/09/14/us-commandos-iran-rescue-operation-shot-down-f18e-sep-2026", "summary": "سرنشین جنگنده آمریکایی که در ماه آوریل و در بحبوحه حملات آمریکا در مرکز ایران سقوط کرد، برای نخستین بار در گفتگوی ویدیویی از وضعیت خود پس از سقوط در خاک ایران و عملیات نجات خود گفت. به گفته او، در پی اصابت موشک ایرانی، چتر نجاتش آسیب دید و او با سرعت حدود ۱۶۰ کیلومتر بر ساعت به سوی زمین سقوط کرد.", "date_str": "2026-09-14T02:46:37+00:00", "hash": "5238f4db8a4f9009", "title_fa": "۹۲ کماندوی آمریکایی در خاک ایران؛ سرنشین جنگنده سرنگون‌شده از عملیات نجاتش می‌گوید", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp سرنشین جنگنده آمریکایی که در ماه آوریل و در بحبوحه حملات آمریکا در مرکز ایران سقوط کرد، برای نخستین بار در گفتگوی ویدیویی از وضعیت خود پس از سقوط در خاک ایران و عملیات نجات خود گفت. به گفته او، در پی اصابت موشک ایرانی، چتر نجاتش آسیب دید و او با سرعت حدود ۱۶۰ کیلومتر بر ساعت به سوی زمین سقوط کرد. برنامه «۶۰ دقیقه» سی‌بی‌اس نیوز برای نخستین بار با این سرهنگ نیروی هوایی آمریکا گفتگو کرده است. این برنامه همچنین در گفتگو با برد کوپر، فرمانده فرماندهی مرکزی آمریکا «سنتکام» و پیت هگست، وزیر دفاع این کشور، پرده از جزئیات جدیدی درباره عملیات نجات خلبان و سرنشین جنگنده آمریکایی سرنگون‌شده در ایران برداشته است. در این گفتگو به دلیل مسائل امنیتی نام خلبان و این سرهنگ نیروی هوایی محفوظ مانده است و از آن‌ها به ترتیب با عنوان «آلفا» و «براوو» یاد می‌شود. براوو افسر سامانه‌های تسلیحاتی و سرنشین عقب این جنگنده بود و کد عملیاتی جنگنده آن‌ها «رفیق ۴۴» (Dude 44) بود. به گفته براوو، در پی اصابت موشک دوش‌پرتاب ایران به جنگنده آن‌ها، چتر نجات او آسیب دید و پس از استفاده از صندلی پران و خروج از هواپیما، با سرعتی حدود ۱۱۰ تا ۱۶۰ کیلومتر بر ساعت به سوی زمین سقوط کرد. براوو گفت: «لحظه‌ای که به بالا نگاه کردم و دیدم هیچ چتری وجود ندارد، وحشتناک‌ترین چیزی بود که در تمام عمرم دیده‌ام. همان لحظه مکث کردم و دعا کردم: خدایا، هرچه تو بخواهی اتفاق می‌افتد. اما اگر قرار است از این وضعیت جان سالم به در ببرم، به کمک نیاز دارم.» دو روز طول کشید تا کمک رسید. براوو بر اثر برخورد شدید با زمین دچار شکستگی ستون فقرات، بازو و شانه شده"}, {"source": "Euronews Persian", "title": "پشت‌پرده فروپاشی تفاهم‌نامه ایران و آمریکا؛ نقش حسین طائب در حمله ناگهانی به کشتی‌ها در تنگه هرمز چه بود؟", "link": "https://parsi.euronews.com/2026/09/14/hossein-taeb-role-iran-us-deal-collapse-hormuz-tanker-attacks-sep-2026", "summary": "ایران و آمریکا در ژوئن به تفاهم‌نامه‌ای دست یافتند که به‌نظر می‌رسید می‌تواند جنگ را به پایان رساند، اما نیروهای ایرانی اوایل ژوئیه ناگهان به روی چند کشتی در تنگه هرمز آتش گشودند. این اقدام با پاسخ آمریکا روبرو شد و توافق به‌دست‌آمده عملا فرو ریخت. مقصر که بود؟", "date_str": "2026-09-13T23:32:26+00:00", "hash": "9ff52c9809b186bd", "title_fa": "پشت‌پرده فروپاشی تفاهم‌نامه ایران و آمریکا؛ نقش حسین طائب در حمله ناگهانی به کشتی‌ها در تنگه هرمز چه بود؟", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp ایران و آمریکا در ژوئن به تفاهم‌نامه‌ای دست یافتند که به‌نظر می‌رسید می‌تواند جنگ را به پایان رساند، اما نیروهای ایرانی اوایل ژوئیه ناگهان به روی چند کشتی در تنگه هرمز آتش گشودند. این اقدام با پاسخ آمریکا روبرو شد و توافق به‌دست‌آمده عملا فرو ریخت. مقصر که بود؟ نیویورک‌تایمز در گزارشی به قلم فرناز فصیحی که بر اساس گفتگو با هشت مقام ایرانی، سه عضو سپاه پاسداران، چهار مقام پیشین و بررسی ده‌ها سخنرانی و اظهارات مقامات دولتی و فرماندهان نظامی تنظیم شده، تلاش کرده است که تصویری از چگونگی غلبه تندروها بر مقامات میانه‌روی رژیم ایران و در نهایت فروریختن تفاهم‌نامه ارائه کند. مسعود پزشکیان، رئیس‌جمهوری ایران، اوایل ژوئیه پس از حصول تفاهم‌نامه با آمریکا در اوج رضایت و اعتمادبه‌نفس بود و برای شرکت در بخشی از مراسم تشییع علی خامنه‌ای، رهبر پیشین جمهوری اسلامی ایران، به نجف و کربلا در عراق سفر کرده بود که ناگهان خبر حیرت‌آور از راه رسید. نیروهای ایرانی در تنگه هرمز به سوی سه کشتی تجاری آتش گشودند. در جریان این حمله یک نفتکش حامل گاز طبیعی مایع قطر به آتش کشیده شد و به چند شناور دیگر آسیب رسید. به گفته پنج مقام ایرانی و دو عضو سپاه پاسداران که از این رویدادها اطلاع داشتند، مسعود پزشکیان که به‌شدت خشمگین شده بود، با احمد وحیدی، فرمانده کل سپاه پاسداران تماس گرفت و این اقدام را بی‌ملاحظه خواند و خواستار توضیح شد. به گفته این پنج مقام، آقای وحیدی به رئیس‌جمهوری ایران گفت که نه مجوز این حمله را صادر کرده و نه از پیش از آن اطلاع داشته است. به گفته او، شورای عالی امنیت ملی نیز از این عملیات بی‌خبر بوده است. در واقع، بخش بزرگی از رهبران کشور نمی‌دانستند که"}, {"source": "Euronews Persian", "title": "اکتبرفست ۲۰۲۶؛ آنچه باید درباره بزرگ‌ترین جشن آبجوخوری بدانید", "link": "https://parsi.euronews.com/my-europe/2026/09/13/oktoberfest-2026-rules-cannabis-children-cocaine-drinking", "summary": "شنبه آینده، زمانی که دومینیک کروز، شهردار مونیخ، نخستین بشکه آبجو را در محوطه ترِزین‌ویزه باز کند، فریاد معروف «O'zapft is» بار دیگر در این شهر طنین‌انداز خواهد شد و جشنواره اکتبرفست ۲۰۲۶ رسما آغاز می‌شود.", "date_str": "2026-09-13T18:53:23+00:00", "hash": "a16921df7d1be0a2", "title_fa": "اکتبرفست ۲۰۲۶؛ آنچه باید درباره بزرگ‌ترین جشن آبجوخوری بدانید", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp شنبه آینده، زمانی که دومینیک کروز، شهردار مونیخ، نخستین بشکه آبجو را در محوطه ترِزین‌ویزه باز کند، فریاد معروف «O zapft is» بار دیگر در این شهر طنین‌انداز خواهد شد و جشنواره اکتبرفست ۲۰۲۶ رسما آغاز می‌شود. این جشنواره از شنبه ۱۹ سپتامبر تا یکشنبه ۴ اکتبر ادامه خواهد داشت و انتظار می‌رود بیش از شش میلیون نفر در این جشنواره مشهور مردمی و آبجوی آلمان شرکت کنند. با این حال، بازدیدکنندگان باید چند قانون مهم را در طول حضور خود در اکتبرفست رعایت کنند. محوطه اکتبرفست مونیخ منطقه‌ای عاری از کانابیس است. پارلمان ایالت بایرن در ژوئیه ۲۰۲۴ قانونی را تصویب کرد که مصرف کانابیس را در برخی مکان‌ها ممنوع می‌کند. افرادی که در محوطه جشنواره هنگام کشیدن کانابیس شناسایی شوند، ممکن است تا هزار و ۵۰۰ یورو جریمه شوند و برای متخلفان تکراری، جریمه می‌تواند به بیش از پنج هزار یورو برسد. در گزارش رسمی پلیس مونیخ درباره اکتبرفست سال گذشته، ۲۷ مورد نقض ممنوعیت مصرف کانابیس ثبت شده بود. با این حال، نگهداری کانابیس برای بزرگسالان، تا سقف قانونی ۲۵ گرم در سراسر آلمان، همچنان مجاز است."}, {"source": "Euronews Persian", "title": "دیدار سران امارات و ایران در نشست بریکس برای نخستین بار از زمان جنگ", "link": "https://parsi.euronews.com/2026/09/13/uae-and-iran-leaders-meet-at-the-brics-summit-for-the-first-time-since-the-war", "summary": "این گفتگوها در پی آن صورت می‌گیرد که امارات در ماه اوت مبادلات مالی و تجاری خود با ایران را به حالت تعلیق درآورد و بر موضع سرسختانه خود تأکید کرد؛ موضعی که بر اساس آن، پس از حملات ایران به کشورهای حاشیه خلیج فارس، جلب اعتماد ایران مسیری بس دشوار و پرشیب و به‌مثابه عبور از یک مسیر سعب العبور شده است.", "date_str": "2026-09-13T18:28:58+00:00", "hash": "9cdd6f19bc35314e", "title_fa": "دیدار سران امارات و ایران در نشست بریکس برای نخستین بار از زمان جنگ", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp این گفتگوها در پی آن صورت می‌گیرد که امارات در ماه اوت مبادلات مالی و تجاری خود با ایران را به حالت تعلیق درآورد و بر موضع سرسختانه خود تأکید کرد؛ موضعی که بر اساس آن، پس از حملات ایران به کشورهای حاشیه خلیج فارس، جلب اعتماد ایران مسیری بس دشوار و پرشیب و به‌مثابه عبور از یک مسیر سعب العبور شده است. شیخ خالد بن محمد بن زاید آل نهیان، ولیعهد ابوظبی، روز یکشنبه در حاشیه نشست سران بریکس در هند با مسعود پزشکیان، رئیس‌جمهور ایران دیدار کرد؛ چند هفته پس از آن که امارات متحده عربی از تعلیق مبادلات تجاری و مالی با تهران خبر داده بود. این گفت‌وگوها بالاترین سطح تماس میان دو کشور از زمان آغاز جنگ آمریکا و اسرائیل با ایران به شمار می‌رود. در این مدت، امارات از طریق انور قرقاش، مشاور دیپلماتیک رئیس امارات، پیام خود را روشن کرده است؛ به گفته او «اعتماد کوهی است که باید از آن بالا برویم» و «جغرافیا برای ما هیچ گزینه‌ای جز تعامل باقی نمی‌گذارد»، اما بازسازی اعتماد از دست‌رفته مستلزم آن است که این روابط بر اساس عملکرد سنجیده شوند نه بر پایه حرف. دفتر رسانه‌ای ابوظبی اعلام کرد دو طرف در این دیدار بر اهمیت حمایت از تلاش‌ها برای کاهش تنش‌ها و تقویت ثبات منطقه‌ای تاکید کردند. وزارت خارجه امارات متحده عربی ۱۹ اوت اعلام کرد که به دلیل تشدید تنش‌های منطقه‌ای، همه مبادلات تجاری و مالی خود با ایران را تا اطلاع ثانوی متوقف کرده است . در همان بیانیه بر پایبندی امارات به گفت‌وگو و همکاری منطقه‌ای نیز تاکید شده بود. گزارش منتشر شده از دیدار روز شنبه هیچ تغییری در محدودیت‌های تجاری یا توافق مشخصی میان دو کشور را اعلام نکرد. دنی"}, {"source": "Euronews Persian", "title": "رسانه‌ انصار الله از حمله عربستان به مواضع حوثی‌ها در استان صعده یمن خبر داد", "link": "https://parsi.euronews.com/2026/09/13/saudi-arabia-strikes-houthi-stronghold-saada-yemen", "summary": "رسانه‌های وابسته به حوثی‌ها روز یکشنبه گزارش دادند که عربستان سعودی دو حمله به استان صعده در شمال یمن، از پایگاه‌های اصلی این گروه انجام داده است.", "date_str": "2026-09-13T17:40:28+00:00", "hash": "1eaced858129f86e", "title_fa": "رسانه‌ انصار الله از حمله عربستان به مواضع حوثی‌ها در استان صعده یمن خبر داد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp رسانه‌های وابسته به حوثی‌ها روز یکشنبه گزارش دادند که عربستان سعودی دو حمله به استان صعده در شمال یمن، از پایگاه‌های اصلی این گروه انجام داده است. شبکه تلویزیونی المسیره، وابسته به حوثی‌ها، همچنین از حملات توپخانه‌ای در منطقه مرزی منبه در استان صعده خبر داد. اندکی پس از انتشار این گزارش‌ها، سازمان دفاع مدنی عربستان سعودی درباره احتمال وقوع حمله در دو منطقه این کشور در نزدیکی مرز یمن هشدار صادر کرد. این هشدارها برای شهر ابها و مناطق اطراف خمیس مشیط صادر شدند، اما مدت کوتاهی بعد لغو شدند. حوثی‌ها از زمان شعله‌ور شدن دوباره جنگ داخلی یمن در ماه ژوئیه، بار دیگر وارد درگیری‌های گسترده با نیروهای دولتی مورد حمایت عربستان سعودی شده‌اند. این درگیری‌ها تاکنون ده‌ها هزار نفر را آواره کرده است. حوثی‌ها پیش‌تر در روز یکشنبه اعلام کردند با استفاده از پهپاد و موشک یک پایگاه نظامی در جنوب عربستان سعودی را هدف قرار داده‌اند. یحیی سریع، سخنگوی نظامی حوثی‌ها، در شبکه اجتماعی ایکس اعلام کرد حمله به پایگاه شروره، «انبارهای تسلیحات و مراکز فرماندهی و کنترل که تجاوز علیه کشور و مردم ما را مدیریت می‌کنند» هدف قرار داده است."}, {"source": "Euronews Persian", "title": "یافته‌های پژوهش جدید: دو عدد در آزمایش خون که می‌توانند نشانه ابتلا به سرطان روده باشند", "link": "https://parsi.euronews.com/2026/09/13/routine-blood-testing-may-hold-hidden-clues-to-colorectal-cancer", "summary": "پژوهش تازه‌ای نشان می‌دهد پایین بودن سطح دو آنزیم کبدی که معمولا در آزمایش‌های خون روتین اندازه‌گیری می‌شوند، ممکن است با احتمال بیشتر ابتلا به سرطان روده بزرگ در سنین پایین ارتباط داشته باشد.", "date_str": "2026-09-13T17:35:39+00:00", "hash": "206cd5daa3744088", "title_fa": "یافته‌های پژوهش جدید: دو عدد در آزمایش خون که می‌توانند نشانه ابتلا به سرطان روده باشند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp پژوهش تازه‌ای نشان می‌دهد پایین بودن سطح دو آنزیم کبدی که معمولا در آزمایش‌های خون روتین اندازه‌گیری می‌شوند، ممکن است با احتمال بیشتر ابتلا به سرطان روده بزرگ در سنین پایین ارتباط داشته باشد. یافته‌ای که پژوهشگران می‌گویند می‌تواند سرنخ تازه‌ای برای بررسی علت افزایش این سرطان در میان جوانان باشد. بر اساس تحلیلی که موسسه Epic Research منتشر کرده، افراد زیر ۴۵ سالی که سطح دو آنزیم AST و ALT در خونشان پایین‌تر بود، بیشتر از دیگران در معرض تشخیص سرطان زودرس روده بزرگ قرار داشتند. این دو آنزیم بیشتر برای بررسی سلامت کبد استفاده می‌شوند و پزشکان معمولا به بالا بودن آنها توجه می‌کنند، نه پایین بودنشان. پژوهشگران تاکید کرده‌اند این یافته به این معنا نیست که پایین بودن AST یا ALT باعث سرطان می‌شود و افرادی که در آزمایش خون خود عدد پایینی برای این دو شاخص می‌بینند، نباید نتیجه بگیرند که سرطان دارند یا بلافاصله برای کولونوسکوپی اقدام کنند. این تحقیق هنوز در یک مجله علمی داوری‌شده منتشر نشده و هدف آن بیشتر پیدا کردن سرنخ‌هایی برای تحقیقات بعدی بوده است. محققان اطلاعات پزشکی بیش از ۱۱ هزار نفر ۱۸ تا ۴۴ ساله در آمریکا را بررسی کردند که بین سال‌های ۲۰۱۷ تا ۲۰۲۵ آزمایش غربالگری یا بررسی سرطان روده انجام داده بودند و در سه سال قبل از آن نیز دست‌کم یک بار سطح AST یا ALT آنها اندازه‌گیری شده بود. نتایج نشان داد افرادی که سطح AST آنها کمتر از ۱۴ واحد در هر لیتر بود، نسبت به کسانی که این عدد در محدوده ۱۴ تا ۲۹ قرار داشت، ۶۵ درصد احتمال بیشتری برای تشخیص سرطان زودرس روده بزرگ داشتند."}, {"source": "Euronews Persian", "title": "وال‌استریت ژورنال: کانادا به‌دنبال جایگاه «عضو وابسته» در اتحادیه اروپا است", "link": "https://parsi.euronews.com/my-europe/2026/09/13/canada-considers-gaining-associate-member-status-with-the-eu-amid-tensions-with-the-us-rep", "summary": "گزارش‌ها حاکی است کارنی به‌دنبال عضویت «همکار» در اتحادیه اروپا است در حالی که روابط اتاوا و واشنگتن به پایین‌ترین سطح رسیده است. او هفته آینده در پارلمان اروپا سخنرانی می‌کند.", "date_str": "2026-09-13T16:06:13+00:00", "hash": "652a83db588aa376", "title_fa": "وال‌استریت ژورنال: کانادا به‌دنبال جایگاه «عضو وابسته» در اتحادیه اروپا است", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp گزارش‌ها حاکی است کارنی به‌دنبال عضویت «همکار» در اتحادیه اروپا است در حالی که روابط اتاوا و واشنگتن به پایین‌ترین سطح رسیده است. او هفته آینده در پارلمان اروپا سخنرانی می‌کند. روزنامه وال‌استریت ژورنال روز یکشنبه گزارش داد که نخست‌وزیر کانادا مارک کارنی در حال بررسی تقویت روابط با اتحادیه اروپا است، از جمله ایده تبدیل شدن به یک «عضو همکار» این بلوک. روزنامه با استناد به مقام‌های بدون نام اتحادیه اروپا و کانادا نوشت که چنین وضعیتی در حال حاضر وجود ندارد اما اتحادیه اروپا می‌تواند برای ایجاد ترتیبات ویژه عضویت باز باشد. کمیسیون اروپا به درخواست برای اظهارنظر پاسخ نداد. این گزارش در آستانه سخنرانی کارنی در پارلمان اروپا در استراسبورگ در روز پنجشنبه منتشر شده؛ جایی که انتظار می‌رود او دیدگاه خود درباره روابط کانادا و اتحادیه اروپا را در شرایط دشوار ژئوپولیتیک تشریح کند. اوتاوا درگیر یک جنگ تجاری تاریخی با ایالات متحده است؛ تعرفه‌های سنگین برقرار است و نشانه‌ای از کاهش تنش دیده نمی‌شود. براساس این گزارش، اتحادیه اروپا و کانادا می‌خواهند روابط تجاری در حوزه کالا، خدمات و نیروی کار را تقویت کنند، به‌ویژه در بخش‌های انرژی، هوش مصنوعی، دفاع و مواد معدنی راهبردی. در گزارش آمده که دو طرف همچنین درباره پروژه‌های مشترک بزرگ از جمله کابل‌های زیردریایی، مراکز داده، زیرساخت‌های ابری و شبکه‌های ماهواره‌ای گفت‌وگو می‌کنند. روزنامه وال‌استریت ژورنال نوشت که کانادا همچنین قصد دارد صادرات انرژی خود به اروپا را افزایش دهد."}, {"source": "BBC Persian", "title": "اتریش به اسلامی برای شرکت در نشست آژانس انرژی اتمی اجازه ورود نداد", "link": "https://www.bbc.com/persian/articles/c63eq0p4qn28o?at_medium=RSS&at_campaign=rss", "summary": "خبرگزاری صداوسیما می‌گوید که «فشار آمریکا» مانع حضور رئیس سازمان انرژی اتمی ایران در کنفرانس سالانه آژانس بین‌المللی انرژی اتمی شده است. بنابر این گزارش، محمد اسلامی و «هیئت همراه روز شنبه با یک پرواز عادی به مقصد وین عزیمت کرد اما به نظر می‌آید در مسیر با کارشکنی‌های آمریکا و البته همراهی برخی کشورها و در حالی که مقصدش وین پایتخت اتریش بود متوقف شده است.»", "date_str": "2026-09-14T12:01:49+00:00", "hash": "4f8e6f431054596b", "title_fa": "اتریش به اسلامی برای شرکت در نشست آژانس انرژی اتمی اجازه ورود نداد", "summary_fa": "خبرگزاری صداوسیما می‌گوید که «فشار آمریکا» مانع حضور رئیس سازمان انرژی اتمی ایران در کنفرانس سالانه آژانس بین‌المللی انرژی اتمی شده است. بنابر این گزارش، محمد اسلامی و «هیئت همراه روز شنبه با یک پرواز عادی به مقصد وین عزیمت کرد اما به نظر می‌آید در مسیر با کارشکنی‌های آمریکا و البته همراهی برخی کشورها و در حالی که مقصدش وین پایتخت اتریش بود متوقف شده است.»"}, {"source": "BBC Persian", "title": "آیا روسیه از پهپادهای مجهز به اورانیوم ضعیف‌شده در اوکراین استفاده می‌کند؟", "link": "https://www.bbc.com/persian/articles/cp8495ne33ro?at_medium=RSS&at_campaign=rss", "summary": "اوکراین می‌گوید روسیه در برخی حملات خود از پهپادهای شاهد مجهز به موشک‌های حاوی اورانیوم ضعیف‌شده استفاده کرده است. به گفته مقام‌های اوکراینی، دست‌کم ۱۰ مورد از این پهپادها پس از سقوط در خاک این کشور شناسایی شده‌اند. اما اورانیوم ضعیف‌شده چیست، این موشک‌ها چه کاربردی دارند و آیا خطر رادیواکتیوی برای مردم ایجاد می‌کنند؟", "date_str": "2026-09-14T08:48:21+00:00", "hash": "fa5404bbd249e5a1", "title_fa": "آیا روسیه از پهپادهای مجهز به اورانیوم ضعیف‌شده در اوکراین استفاده می‌کند؟", "summary_fa": "گزارش‌ها حاکی از آن است که روسیه در حملات خود به اوکراین از پهپادهایی استفاده کرده که حامل اورانیوم ضعیف‌شده هستند. دست‌کم ۱۰ مورد شناخته‌شده از این پهپادها ثبت شده که همگی به پهپادهای شاهد روسی مربوط می‌شوند که پس از سقوط در اوکراین پیدا شده‌اند. هر یک از این پهپادها یک موشک هوا به هوای آر-۶۰ حمل می‌کرد که به میله‌های اورانیوم ضعیف‌شده مجهز بود. این ماده در مقایسه با اورانیوم طبیعی رادیواکتیویته بسیار کمتری دارد و تسلیحات حاوی آن در رده سلاح‌های متعارف، نه هسته‌ای، طبقه‌بندی می‌شوند. به‌طور کلی، خطرات ناشی از تشعشعات اورانیوم ضعیف‌شده اندک ارزیابی می‌شود. سرویس امنیتی اوکراین (اس‌بی‌یو) می‌گوید این موشک‌ها برای هدف قرار دادن هواپیماهای رهگیر اوکراینی طراحی شده بودند که هنگام حملات هوایی روسیه به پرواز درمی‌آیند. این نهاد اعلام کرده است که تاکنون ۹ پهپاد شاهد مجهز به موشک‌های حاوی مواد رادیواکتیو را شناسایی کرده است. همه این پهپادها بین آوریل تا ژوئیه ۲۰۲۶ در شمال اوکراین پیدا شده‌اند؛ هفت فروند در استان چرنیهیف و دو فروند در استان سومی."}, {"source": "BBC Persian", "title": "قهرمانی ساشا زورف در اوپن آمریکا؛ از اتهام کتک زدن دوست‌دخترهای سابق تا «خلسه» در نیویورک", "link": "https://www.bbc.com/persian/articles/c0j3eq3z9p0o?at_medium=RSS&at_campaign=rss", "summary": "وقتی ساشا زورف برای زدن سرویس در خط پایانی ایستاد، شاید به او حق می‌دادیم که ذهنش به سمت آخرین باری برود که برای کسب عنوان قهرمانی اوپن آمریکا سرویس می‌زد.", "date_str": "2026-09-14T11:03:55+00:00", "hash": "665f232d3fef3475", "title_fa": "قهرمانی ساشا زورف در اوپن آمریکا؛ از اتهام کتک زدن دوست‌دخترهای سابق تا «خلسه» در نیویورک", "summary_fa": "وقتی ساشا زورف برای زدن سرویس در خط پایانی ایستاد، شاید به او حق می‌دادیم که ذهنش به سمت آخرین باری برود که برای کسب عنوان قهرمانی اوپن آمریکا سرویس می‌زد. شش سال پیش، این بازیکن آلمانی و بخت اول مسابقات، در دیداری دردناک، برتری دو ستی خود را از دست داد و به دوستش دومینیک تیم باخت؛ او در ست پنجم برای پیروزی سرویس زده بود. این بار، نه اضطراب خودش، بلکه بن شلتون آمریکایی و بخش بزرگی از جمعیت ۲۴ هزار نفری تماشاگران مانع زورف بودند. این زورف اما بازیکن دیگری بود و حالا پس از قهرمانی اوپن فرانسه در ماه ژوئن، به عنوان قهرمان یک گرند اسلم با اعتماد به نفسی بالا بازی می‌کرد. تمرکز او آن‌قدر زیاد بود که در ابتدا متوجه نشد با نتیجه ۶-۳، ۷-۶ (۷-۲)، ۵-۷، ۶-۲ پیروز شده است. زورف پس از زدن یک سرویس دیگر که بازگرداندنش ناممکن بود و با آن مسابقه را برد، به خط انتهایی زمین برگشت و آماده شد امتیاز بعدی را آغاز کند؛ اعضای تیمش اما به او گفتند که مسابقه تمام شده است. زورف گفت: «در آن لحظه با تمام وجود تمرکز کرده بودم. اصلا صدای تماشاگران را نمی‌شنیدم. جالب است؛ مربیان تنیس همیشه به شما می‌گویند فقط امتیاز بعدی را بازی کنید و نتیجه را فراموش کنید. در آن لحظه نتیجه را فراموش کردم و همین به من کمک کرد.»"}, {"source": "BBC Persian", "title": "سلاحی که دور تازه درگیری‌ها را آغاز کرد؛ آیا راکت‌های ایران می‌توانند تنگه هرمز را مین‌گذاری کنند؟", "link": "https://www.bbc.com/persian/articles/cx2z7vjxly4o?at_medium=RSS&at_campaign=rss", "summary": "دور تازه حملات متقابل ایران و آمریکا با هدف قرار گرفتن پرتابگرهای سپاه در جزیره لارک آغاز شد؛ تجهیزاتی که واشنگتن می‌گوید برای شلیک «راکت‌های حامل مین دریایی» آماده می‌شدند. آیا چنین سامانه‌ای در عمل کار می‌کند؟", "date_str": "2026-09-14T06:10:34+00:00", "hash": "4a474183b2ee99ca", "title_fa": "سلاحی که دور تازه درگیری‌ها را آغاز کرد؛ آیا راکت‌های ایران می‌توانند تنگه هرمز را مین‌گذاری کنند؟", "summary_fa": "دور تازه تنش نظامی میان ایران و آمریکا پس از نزدیک به یک ماه وقفه، با حمله به پرتابگرهایی آغاز شد که به گفته آمریکا برای مین‌گذاری به شیوه‌ای نامتعارف آماده می‌شدند: شلیک راکت‌های حامل مین دریایی به سوی تنگه هرمز. سنتکام، فرماندهی مرکزی ایالات متحده، روز ۳۰ اوت (۸ شهریور)اعلام کرد که دو پرتابگر سپاه پاسداران را در جزیره لارک، در نزدیکی مسیرهای کشتیرانی تنگه هرمز، هدف قرار داده است. تیم هاوکینز، سخنگوی سنتکام، گفت نیروهای سپاه در حال آماده شدن برای شلیک «راکت‌های حامل مین دریایی» به سوی تنگه دیده شده بودند. ایران در واکنش، پایگاه نیروهای آمریکایی در اردن را با موشک هدف گرفت و به این ترتیب حملات متقابل دو طرف دوباره آغاز شد. در روایت آمریکا، پرتابگرهای لارک قرار بود مین‌ها را از خشکی و بدون نیاز به قایق یا کشتی‌های مین‌گذار به داخل تنگه برسانند. سپاه پاسداران پیش‌تر نمونه‌ای از چنین سامانه‌ای را در یک رزمایش به نمایش گذاشته بود، اما حمله به لارک برای نخستین بار مین‌گذاری با راکت را به یکی از محورهای درگیری مستقیم دو کشور تبدیل کرد. این حمله تنها دو روز پس از آن انجام شد که فرماندهی مرکزی آمریکا اعلام کرد مین‌های کارگذاشته‌شده در مسیرهای بین‌المللی تنگه هرمز پاک‌سازی شده‌اند. روزنامه فایننشال تایمز اخیرا گزارش داد که این عملیات چهار ماه طول کشید و عمدتا شبانه، با حضور غواصان نیروی دریایی آمریکا و استفاده از قایق‌های رباتیک و تجهیزات بدون سرنشین زیرسطحی انجام شد. به نوشته این روزنامه، سازمان بین‌المللی دریانوردی در ماه ژوئن شمار مین‌های کارگذاشته‌شده در مسیرهای حیاتی کشتیرانی را حدود ۸۰ فروند برآورد کرده بود. دونالد ترامپ، رئیس‌جمهور آمریکا در اواخر ماه اوت گفت همه مین‌های موجود در آبراه‌های بین‌المللی پاک یا منفجر شده‌اند؛ هرچند نهادهای اطلاع‌رسانی دریایی همچنان درباره احتمال وجود مین‌های شناور یا ثبت‌نشده هشدار می‌دادند."}, {"source": "BBC Persian", "title": "روایت سرنشین جنگنده اف-۱۵ آمریکایی از ۵۰ ساعت سرگردانی در کوه‌های ایران", "link": "https://www.bbc.com/persian/articles/c5ym9lkmgmgo?at_medium=RSS&at_campaign=rss", "summary": "یکی از دو افسر نیروی هوایی آمریکا که جنگنده اف-۱۵ئی آنها در ماه آوریل بر فراز ایران سرنگون شد، برای نخستین بار روایت خود از سقوط با چتر آسیب‌دیده، جراحات متعدد، تلاش برای فرار از نیروهای ایرانی و لحظه رسیدن گروه نجات سخن گفته است. این سرهنگ نیروی هوایی آمریکا که هویتش به دلایل امنیتی فاش نشده، با علامت فراخوان «Dude 44 Bravo» یا «براوو» معرفی شده است. او افسر سامانه‌های تسلیحاتی و سرنشین کابین عقب یک جنگنده دو نفره اف-۱۵ئی استرایک ایگل بود.", "date_str": "2026-09-14T01:51:28+00:00", "hash": "f8bc0d6b0bd77cad", "title_fa": "روایت سرنشین جنگنده اف-۱۵ آمریکایی از ۵۰ ساعت سرگردانی در کوه‌های ایران", "summary_fa": "یکی از دو افسر نیروی هوایی آمریکا که جنگنده اف-۱۵ئی آنها در ماه آوریل بر فراز ایران سرنگون شد، برای نخستین بار روایت خود از سقوط با چتر آسیب‌دیده، جراحات متعدد، تلاش برای فرار از نیروهای ایرانی و لحظه رسیدن گروه نجات سخن گفته است. این سرهنگ نیروی هوایی آمریکا که هویتش به دلایل امنیتی فاش نشده، با علامت فراخوان «Dude 44 Bravo» یا «براوو» معرفی شده است. او افسر سامانه‌های تسلیحاتی و سرنشین کابین عقب یک جنگنده دو نفره اف-۱۵ئی استرایک ایگل بود."}, {"source": "BBC Persian", "title": "چه کسی جانشین ترامپ خواهد شد؟ دغدغه پنهان برخی جمهوری‌خواهان", "link": "https://www.bbc.com/persian/articles/cm2rle803mvo?at_medium=RSS&at_campaign=rss", "summary": "در همایش جمهوری‌خواهان در دالاس، همه‌چیز حول دونالد ترامپ می‌چرخید؛ از سخنرانی‌ها و شعارها گرفته تا وعده‌های انتخاباتی. اما در پسِ نمایش وفاداری به رئیس‌جمهور، پرسشی دیگر نیز در میان بخشی از فعالان حزب مطرح بود: جمهوری‌خواهان پس از ترامپ چگونه خواهند بود و چه کسی رهبری آنها را بر عهده خواهد گرفت؟", "date_str": "2026-09-14T04:46:49+00:00", "hash": "77b53e7f63e5770a", "title_fa": "چه کسی جانشین ترامپ خواهد شد؟ دغدغه پنهان برخی جمهوری‌خواهان", "summary_fa": "جمهوری‌خواهان در دالاس گرد هم آمدند تا به کارزار خود برای انتخابات میان‌دوره‌ای رونق تازه‌ای ببخشند؛ آنها امیدوار بودند نشستی بی‌سابقه که تحت‌الشعاع حضور دونالد ترامپ قرار داشت، بتواند پیش از انتخابات نوامبر به هوادارانشان انرژی تازه‌ای بدهد. بسیاری از شرکت‌کنندگان در این گردهمایی، با همان نگرانی‌هایی که هنگام ورود داشتند دالاس را ترک کردند؛ نگرانی درباره چشم‌انداز جمهوری‌خواهان در انتخابات ۲۰۲۶ و این‌که حزب پس از دوران ترامپ چه مسیری را در پیش خواهد گرفت. جی‌دی ونس، معاون رئیس‌جمهور، که بسیاری او را از مدعیان اصلی جانشینی ترامپ می‌دانند، در سخنرانی خود تصویری از آینده احتمالی حزب پیش روی هم‌ حزبی‌هایش گذاشت. ونس، در سخنرانی خود به حاضران گفت:«باید اول کار را در نوامبر تمام کنیم.» سپس افزود:«بعد از آن، نگران این خواهیم شد که چه اتفاقی می‌افتد و گام بعدی چیست.» در بخشی از سخنرانی ونس، حاضران شعار «۴۸» سر دادند؛ اشاره‌ای به جانشین احتمالی ترامپ که در صورت پیروزی جمهوری‌خواهان در انتخابات ۲۰۲۸، چهل‌وهشتمین رئیس‌جمهور آمریکا خواهد شد. ونس برای لحظه‌ای اجازه داد این شعار ادامه پیدا کند، اما سپس به سخنانش ادامه داد."}, {"source": "BBC Persian", "title": "پلیس ترکیه با یورش به میکده‌های پاتوق همجنس‌گرایان و خانه فعالان ال‌جی‌بی‌تی ده‌ها نفر را بازداشت کرد", "link": "https://www.bbc.com/persian/articles/cx2z5g43wkdo?at_medium=RSS&at_campaign=rss", "summary": "مقام‌های ترکیه اعلام کردند پلیس این کشور در مجموعه‌ای از یورش‌ها به میکده‌های همجنس‌گرایان و خانه‌های فعالان حقوق افراد ال‌جی‌بی‌تی، ۴۷ نفر را بازداشت کرده است.", "date_str": "2026-09-14T00:26:19+00:00", "hash": "eaf316bf15450352", "title_fa": "پلیس ترکیه با یورش به میکده‌های پاتوق همجنس‌گرایان و خانه فعالان ال‌جی‌بی‌تی ده‌ها نفر را بازداشت کرد", "summary_fa": "مقام‌های ترکیه اعلام کردند پلیس این کشور در مجموعه‌ای از یورش‌ها به میکده‌های همجنس‌گرایان و خانه‌های فعالان حقوق افراد ال‌جی‌بی‌تی، ۴۷ نفر را بازداشت کرده است. این عملیات پلیس در روزهای آخر هفته و در ۱۲ استان ترکیه، در چارچوب کارزاری تحت عنوان «خانواده من در امان است» انجام شد؛ کارزاری که دولت ترکیه می‌گوید با هدف حفاظت از ارزش‌های خانوادگی طراحی شده است. یکی از اهداف این عملیات، انجمن حقوق افراد ال‌جی‌بی‌تی با نام کائوس جی‌ال بود. ازدواج همجنس‌گرایان در ترکیه به رسمیت شناخته نمی‌شود و فشار بر زوج‌های همجنس‌گرا افزایش یافته است. گروه‌های حقوق بشری در ترکیه دولت را متهم کرده‌اند که از این کارزار برای هدف قرار دادن جامعه ال‌جی‌بی‌تی استفاده می‌کند. به گفته دادستانی استانبول، ماموران در جریان این یورش‌ها ۲۶ نفر را بازداشت کردند و مواد مخدر، تجهیزات دیجیتال، مشروبات الکلی قاچاق و یک قبضه سلاح گرم را ضبط کردند. دادستانی آنکارا نیز در بیانیه‌ای جداگانه اعلام کرد که ۲۱ نفر دیگر در چارچوب تحقیق درباره انجمن کائوس جی‌ال بازداشت شده‌اند."}, {"source": "BBC Persian", "title": "یک زن افغان دارای اقامت دائم آمریکا در نخستین استفاده از یک دادگاه  حضور داشتند؛ از جمله شی جین‌پینگ، رئیس‌جمهور چین، ولادیمیر پوتین، رئیس‌جمهور روسیه، مسعود پزشکیان، رئیس‌جمهور ایران، شیخ خالد بن محمد بن زاید آل نهیان، ولیعهد ابوظبی، و سیریل رامافوسا، رئیس‌جمهور آفریقای جنوبی. این کشورها متحدان طبیعی یکدیگر به شمار نمی‌روند. آنها سابقه اختلافات مرزی و حتی رویارویی‌های نظامی دارند. هند و چین در سال ۲۰۲۰ در امتداد مرز مورد مناقشه خود وارد درگیری مرگباری شدند. ایران و امارات متحده عربی نیز در دو سوی جنگ خاورمیانه قرار داشته‌اند و ایران در جریان این درگیری که اقتصادهای جهان را تحت تاثیر قرار داد، به یکی دیگر از اعضای بریکس، یعنی امارات، موشک و پهپاد شلیک کرد. این‌که هند توانست این رهبران را به‌صورت حضوری گرد هم آورد، به‌خودی‌خود دستاوردی مهم و نشانه‌ای از نفوذ دیپلماتیک این کشور است. این نشست همچنین فرصتی فراهم کرد تا کشورها در پرتو جنگ ایران، روابط خود را بازنگری کنند."}, {"source": "BBC Persian", "title": "از ساختار ثابت تا بازی سیال؛ آبی‌ها و قرمزهای منچستر چه تفاوتی دارند؟", "link": "https://www.bbc.com/persian/articles/cy8zj4zdmr3o?at_medium=RSS&at_campaign=rss", "summary": "منچسترسیتی و منچستریونایتد اشتراکات فراوانی دارند اما یک چیز قاطعانه آن‌ها را در این فصل از یکدیگر جدا می‌کند.", "date_str": "2026-09-13T19:13:00+00:00", "hash": "1b5eda7153f63b1c", "title_fa": "از ساختار ثابت تا بازی سیال؛ آبی‌ها و قرمزهای منچستر چه تفاوتی دارند؟", "summary_fa": "این دو تیم که خانه‌هایشان تنها ۸ کیلومتر با یکدیگر فاصله دارد و تمایل مشترک برای بازگشت به صدر لیگ برتر آرزوی مشترکشان است، الگوهای بازی‌شان تقریبا ۱۸۰ درجه با یکدیگر متفاوت است. بهترین تیم‌های دنیا اغلب به شیوه‌های مشابه‌ بازی می‌کنند؛ نمونه‌اش فینال فصل گذشته لیگ قهرمانان اروپا میان پاریس سن‌ژرمن و آرسنال که از آرایش‌های مشابهی استفاده کردند، به دنبال تسلط بر توپ بودند و چرخش بازیکنان به موقعیت‌های ثابت را تشویق می‌کردند. اما با نگاهی به بازی‌های این فصل دو تیم شهر منچستر متوجه می‌شویم که انزو مارسکا، سرمربی سیتی، و مایکل کریک، همتای او در یونایتد، دو تاکتیک کاملا متفاوت دارند. به بیان کوتاه، سیتی ساختاری سفت‌وسخت با جایگیری دقیق بازیکنان دارد، در حالی که یونایتد رویکردی سیال‌تر با اصول موقعیتی مشخص دارد که به بازیکنان آزادی عمل می‌دهد؛ در ادامه جزئیات کارکرد این روش را می‌بینیم. مارسکا تحت تاثیر پپ گواردیولا، مربی پیشین سیتی، به دنبال ساختن تیمی کنترل‌گر است که با حداکثر مالکیت توپ، ضریب ریسک و غیرقابل‌پیش‌بینی بودنِ جریان بازی را پایین بیاورد. این مربی ایتالیایی بارها ماهیت حرکت‌محور شطرنج را با فوتبال مقایسه کرده است، بنابراین تعجبی ندارد که بازی موقعیتی، پایه و اساس تیم‌های اوست."}, {"source": "Radio Farda", "title": "وزیر فرهنگ اسرائیل خواستار «سلب تابعیت» برندگان جایزۀ جشنوارۀ ونیز شد", "link": "https://www.radiofarda.com/a/israeli-minister-remove-nationality-documentary-venice/33853890.html", "summary": "وزیر فرهنگ دولت اسرائیل در واکنش به ساخت فیلم مستند «نازا» تهدید کرد که برای سلب تابعیت دو کارگردان اسرائیلی این فیلم اقدام خواهد کرد. این فیلم شامگاه ۲۱ شهریور در مراسم اختتامیهٔ دوره اخیر جشنواره فیلم ونیز در ایتالیا برنده جایزه ویژه هیئت داوران این رویداد معتبر هنری شد. همزمان، ارتش اسرائیل درباره این فیلم که موضوع آن مربوط به عملیات ارتش در غزه است، نشست عالی در سطح فرماندهان ارشد خود برگزار کرد. نمایش مستند «نازا» در جشنواره فیلم ونیز با استقبال بسیار زیاد حاضران روبرو شد به‌گونه‌ای...", "date_str": "2026-09-14T13:24:55+00:00", "hash": "26882332ac90690f", "title_fa": "وزیر فرهنگ اسرائیل خواستار «سلب تابعیت» برندگان جایزۀ جشنوارۀ ونیز شد", "summary_fa": "وزیر فرهنگ دولت اسرائیل در واکنش به ساخت فیلم مستند «نازا» تهدید کرد که برای سلب تابعیت دو کارگردان اسرائیلی این فیلم اقدام خواهد کرد. این فیلم شامگاه ۲۱ شهریور در مراسم اختتامیهٔ دوره اخیر جشنواره فیلم ونیز در ایتالیا برنده جایزه ویژه هیئت داوران این رویداد معتبر هنری شد. همزمان، ارتش اسرائیل درباره این فیلم که موضوع آن مربوط به عملیات ارتش در غزه است، نشست عالی در سطح فرماندهان ارشد خود برگزار کرد. نمایش مستند «نازا» در جشنواره فیلم ونیز با استقبال بسیار زیاد حاضران روبرو شد به‌گونه‌ای..."}, {"source": "Radio Farda", "title": "ایران دخالت در حمله به خط لوله عربستان را تکذیب کرد", "link": "https://www.radiofarda.com/a/baghaei-news-conference/33853784.html", "summary": "سخنگوی وزارت خارجه جمهوری اسلامی موضوع اطلاع قبلی یا نقش ایران در حمله به خط لوله راهبردی نفت عربستان سعودی را «دروغ» خواند.", "date_str": "2026-09-14T10:03:28+00:00", "hash": "c7c0531e2bfe166b", "title_fa": "ایران دخالت در حمله به خط لوله عربستان را تکذیب کرد", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند سخنگوی وزارت خارجه جمهوری اسلامی موضوع اطلاع قبلی یا نقش ایران در حمله به خط لوله راهبردی نفت عربستان سعودی را «دروغ» خواند. او همچنین تأیید کرد که تعویق افتادن نشست منطقه‌ای عمان درباره امنیت تنگه هرمز به خواست ریاض بوده است. اسماعیل بقائی روز دوشنبه ۲۳ شهریور در نشست هفتگی خود با خبرنگاران، در واکنش به اظهارات مقام‌های آمریکایی درباره حمله به خط لوله شرق به غرب عربستان گفت: «آمریکایی‌ها بدون هیچ هزینه‌ای در حال تولید خبرهای دروغ هستند.» او افزود که به باور وزارت خارجه جمهوری اسلامی، بازیگران خارج از منطقه از طریق انتشار این نوع خبرها «در پی افزایش تنش» میان کشورهای منطقه‌اند و گفت تهران این ادعاها را «قاطعانه» تکذیب می‌کند. دونالد ترامپ، رئیس‌جمهوری آمریکا، روز ۲۱ شهریور ایران را مسئول احتمالی حمله‌ای دانست که به تعطیلی موقت خط لوله شرق به غرب عربستان انجامید و گفت: «فکر می‌کنم مسئول بوده‌اند؛ احتمالاً خودشان بوده‌اند.» عربستان سعودی اعلام کرده است این حمله با پهپادی انجام شده که از خاک عراق به پرواز درآمده بود. هنوز هیچ گروهی مسئولیت آن را بر عهده نگرفته است."}, {"source": "Radio Farda", "title": "سخنگوی حوثی‌ها از حمله‌ای تازه به یک پایگاه هوایی عربستان سعودی خبر داد", "link": "https://www.radiofarda.com/a/yemen-s-houthis-say-targeted-military-facilities-in-saudi-arabia/33853789.html", "summary": "در ادامه حملات نظامی اخیر نیروهای حوثی‌ یمن به خاک عربستان سعودی، سخنگوی این نیروها روز دوشنبه، ۲۳ شهریور، از حمله‌ای «گسترده» به پایگاه هوایی سلطان خالد در عربستان خبر داد.", "date_str": "2026-09-14T09:41:35+00:00", "hash": "3ef4cdace71b2526", "title_fa": "سخنگوی حوثی‌ها از حمله‌ای تازه به یک پایگاه هوایی عربستان سعودی خبر داد", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند در ادامه حملات نظامی اخیر نیروهای حوثی‌ یمن به خاک عربستان سعودی، سخنگوی این نیروها روز دوشنبه، ۲۳ شهریور، از حمله‌ای «گسترده» به پایگاه هوایی سلطان خالد در عربستان خبر داد. این پایگاه در نزدیکی شهر خَمیس مُشَیط در جنوب غربی عربستان سعودی قرار دارد. یحیی سریع، سخنگوی ارتش حوثی‌های شیعه یمن، این حمله جدید را پاسخی متقابل به حملات هوایی ریاض به مواضع این ارتش در خاک یمن توصیف کرده است. او مدعی است که ارتش عربستان «در پنج روز گذشته بیش از ۳۰۰ حمله هوایی» به خاک یمن داشته که تمامی آنها از پایگاه‌های خمیس مشیط و طیف انجام شده است. به گفته سریع، روز دوشنبه ده‌ها پهپاد و موشک بالیستیک به سوی «اهدافی نظامی از جمله آشیانه جت‌های جنگنده، انبار مهمات و رادارها» در نزدیکی خمیس مشیط شلیک شده است."}, {"source": "Radio Farda", "title": "گزارش تازۀ شبکه سی‌بی‌اس از جزئیات عملیات نجات یک خلبان آمریکایی در خاک ایران", "link": "https://www.radiofarda.com/a/u-s-air-force-officer-who-was-rescued-from-iran--cbs-60-minutes-report/33853672.html", "summary": "شبکهٔ سی‌بی‌اس در گزارشی از عملیات نجات افسر جنگندهٔ آمریکایی، اعلام کرد بمب‌افکن‌های آمریکا برای باز کردن مسیر نجات، نیروهای سپاه را در نزدیکی مخفیگاه او هدف قرار دادند.", "date_str": "2026-09-14T07:03:17+00:00", "hash": "dddf6debdf4a7c2e", "title_fa": "گزارش تازۀ شبکه سی‌بی‌اس از جزئیات عملیات نجات یک خلبان آمریکایی در خاک ایران", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند شبکهٔ خبری آمریکایی سی‌بی‌اس در گزارشی تازه که روز یک‌شنبه، ۲۲ شهریورماه، پخش شد از جزئیات عملیات شناسایی محل و نجات یک خلبان آمریکایی در قلب خاک ایران پرده برداشت. در این گزارش با خود این خلبان نیز مصاحبه شده است. سی‌بی‌اس در گزارش خود از عملیات نجات افسر تسلیحات یک فروند جنگندهٔ اف ۱۵ آمریکایی در فروردین‌ماه سال جاری، در بحبوحه جنگ اسرائیل و آمریکا با ایران، می‌گوید که بمب‌افکن‌ها و پهپادهای ارتش آمریکا برای باز کردن مسیر نجات، نیروهای سپاه پاسداران را در نزدیکی مخفیگاه او هدف قرار داده‌اند. این گزارش که روز یک‌شنبه در برنامهٔ معروف «۶۰ دقیقه» پخش شد، به تصاویر تازه از طبقه‌بندی خارج‌شده و گفت‌وگو با فرماندهان ارشد ارتش آمریکا و افسر نجات‌یافته استناد دارد. به گفتهٔ منابع نظامی، در ساعات منتهی به نجات این نیروی آمریکایی، نیروهای ایرانی حتی تا چندصد متری محل اختفای این افسر نیز پیش رفته بودند. برَد کوپر، فرمانده سنتکام، گفت بیش از ۹۰ نظامی آمریکایی در خاک ایران، چندصد نفر در هوا و چندهزار نفر در بخش پشتیبانی در عملیات نجات مشارکت داشتند. به گفتهٔ او، مأموریت جنگندهٔ اف‌ـ۱۵ئی پیش از سرنگونی، حمله به تأسیسات صنعتی مرتبط با برنامهٔ موشکی و پهپادی ایران در جنوب اصفهان بود. افسر تسلیحات این جنگنده، با نام مأموریتی «براوو»، در نخستین روایت علنی خود گفت موشک دوش‌پرتاب ایرانی به چتر نجاتش نیز آسیب زده بود و هنگام برخورد با زمین، کمر، بازو و شانه‌اش شکسته است. او با وجود این جراحات خود را به خط‌الرأسی در ارتفاع حدود ۲۱۰۰ متری رساند و سرانجام حدود ۵۰ ساعت پس از سرنگونی نجات یافت."}],
      tech: [{"source": "MIT AI", "title": "New method enables AI for safety-critical situations", "link": "https://news.mit.edu/2026/new-method-enables-ai-safety-critical-situations-0914", "summary": "MIT researchers have developed a new technique that helps generative artificial intelligence models find solutions to high-stakes problems. In these settings, a plausible answer is not enough: The output often must also satisfy nonnegotiable safety, physical, or task-specific requirements, known as hard constraints. The researchers developed a method that helps generative models meet these strict requirements without sacrificing the quality of their outputs. The key to their technique is to give the model more freedom during the generation process and enforce hard constraints on the final output, rather than at every intermediate step. In experiments spanning robotics, control of physical processes, and computer vision, the new method consistently satisfied the required constraints while identifying better solutions than existing techniques. This adaptable, plug-and-play technique works at deployment time, so it can be applied to pretrained generative models without retraining them. It can make such models more useful in applications where safety rules, physical laws, or other strict requirements cannot be violated. “The promise of generative AI is its ability to explore a rich space of possibilities, but the real world places boundaries on which possibilities are acceptable. Our approach lets us preserve that generative power while enforcing the nonnegotiable requirements of high-stakes or safety-critical applications,” says Navid Azizan, the Alfred H. and Jean M. Hayes Career Development Associate Professor in the Department of Mechanical Engineering and the Institute for Data, Systems, and Society (IDSS), a principal investigator of the Laboratory for Information and Decision Systems (LIDS), and the senior author of a paper on this technique. Azizan is joined on the paper by lead author Zeyang Li, a graduate student in mechanical engineering and LIDS; and Kaveh Alim, a graduate student in IDSS and LIDS. The research appears this week in the IEEE Transactions on Pattern Analysis and Machine Intelligence . Freedom to explore Pretrained generative AI models, such as diffusion models like Stable Diffusion and flow-matching models like FLUX, are now widely available. These powerful models learn to create new data by transforming random noise. Their availability has enabled people to adapt them to a wide range of applications. These highly capable models excel at providing answers that come close to satisfying most queries, but in safety-critical applications", "date_str": "2026-09-14T04:00:00+00:00", "hash": "e4cd91d383e477b4", "title_fa": "روش جدید هوش مصنوعی را برای موقعیت های بحرانی ایمنی فعال می کند", "summary_fa": "محققان MIT تکنیک جدیدی را توسعه داده‌اند که به مدل‌های هوش مصنوعی مولد کمک می‌کند تا راه‌حل‌هایی برای مشکلات پرمخاطره بیابند. در این تنظیمات، یک پاسخ قابل قبول کافی نیست: خروجی اغلب باید الزامات ایمنی غیرقابل مذاکره، فیزیکی یا وظایف خاص را که به عنوان محدودیت‌های سخت شناخته می‌شوند، برآورده کند. محققان روشی ابداع کردند که به مدل‌های مولد کمک می‌کند تا این الزامات سخت‌گیرانه را برآورده کنند، بدون اینکه کیفیت خروجی‌هایشان را به خطر بیندازند. کلید تکنیک آنها این است که به مدل آزادی بیشتری در طول فرآیند تولید بدهند و محدودیت‌های سخت را در خروجی نهایی به جای هر مرحله میانی اعمال کنند. در آزمایش‌هایی که شامل رباتیک، کنترل فرآیندهای فیزیکی و بینایی کامپیوتری می‌شد، روش جدید به طور مداوم محدودیت‌های مورد نیاز را برآورده می‌کرد و در عین حال راه‌حل‌های بهتری را نسبت به تکنیک‌های موجود شناسایی می‌کرد. این تکنیک تطبیق‌پذیر و plug-and-play در زمان استقرار کار می‌کند، بنابراین می‌توان آن را روی مدل‌های مولد از پیش آموزش‌دیده بدون آموزش مجدد اعمال کرد. می‌تواند چنین مدل‌هایی را در کاربردهایی که قوانین ایمنی، قوانین فیزیکی یا سایر الزامات سخت‌گیرانه قابل نقض نیستند، مفیدتر کند. وعده هوش مصنوعی مولد توانایی آن در کشف فضای غنی از امکانات است، اما دنیای واقعی مرزهایی را قرار می دهد که احتمالات در آن قابل قبول هستند. نوید عزیزان، دانشیار توسعه شغلی آلفرد اچ و ژان ام هیز در گروه مهندسی مکانیک و موسسه داده‌ها، سیستم‌ها و جامعه سرمایه‌گذار سیستم اطلاعاتی و جامعه (IDSS)، می‌گوید: رویکرد ما به ما اجازه می‌دهد تا این قدرت مولد را حفظ کنیم و در عین حال الزامات غیرقابل مذاکره برنامه‌های کاربردی با ریسک بالا یا ایمنی را اجرا کنیم. (LIDS)، و نویسنده ارشد مقاله در مورد این تکنیک. نویسنده اصلی، زیانگ لی، دانشجوی کارشناسی ارشد مهندسی مکانیک و LIDS، به عزیزان در مقاله پیوسته است. و کاوه"}, {"source": "MIT AI", "title": "MIT spinout turns plastic waste into resilient building materials", "link": "https://news.mit.edu/2026/mit-spinout-turns-plastic-waste-into-resilient-building-materials-0914", "summary": "The world needs more homes. The world also has too much plastic. Perhaps the only thing those two problems have in common is that they’re hard to solve. Atlas Building Composites, a spinout of MIT, is on a mission to address both problems with a single solution. The company has developed an AI-powered robotic manufacturing platform capable of turning single-use plastics into durable building materials. The company emerged from MIT HAUS, a research effort in the MIT Department of Mechanical Engineering that’s short for “Home Architecture for Universal Sustainability.” Atlas uses waterless plastic recycling and large-scale composite additive manufacturing technology to make parts like home foundations, decks, and trusses for walls, floors, and roofs. “Our mission is to convert waste plastic pollution into durable composites to build 1 billion homes,” says Atlas chair and co-founder A.J. Perez ’13, MNG ’14, PhD ’23, who is also an MIT research scientist. “You can’t divorce these things from each other. We’re not here just to build homes, and we’re not here just to recycle plastic. The conventional way of building homes involves cutting down trees, mining, refining, and a bunch of other dirty activities. We want to avoid all that and address all the plastic bound for our oceans and landfills. We’re turning bottles into buildings.” Atlas’ parts are already being used to support barns, sheds, decks, and docks. Most recently, the company supplied the U.S. Army Corps of Engineers with American-made recycled composite trusses to construct a 40-foot bridge in a Massachusetts wetland. Perez and Atlas co-founder Matt Pouliot envision deploying thousands of their AI robotic production systems around the world. A key enabler for that scale is the company’s ability to recycle low-grade plastic into building components without water. “This is key to democratizing recycling,” Perez says. “Now, every country around the world, regardless of their water access, will be able to do something about their plastic. We strive to study these issues in the real world, not just a lab. When you talk to government officials about creating a new recycling facility, they have to get the local water agency involved, there’s permitting, etc. A lot of that work disappears with the waterless recycling process.” Research for impact Since earning his PhD at MIT, Perez has been developing advanced fabrication techniques for homes and new techniques for plastic recycling. In 2019, he started MIT ", "date_str": "2026-09-14T04:00:00+00:00", "hash": "11d70b28915e2562", "title_fa": "MIT spinout زباله های پلاستیکی را به مصالح ساختمانی مقاوم تبدیل می کند", "summary_fa": "دنیا به خانه های بیشتری نیاز دارد. جهان همچنین پلاستیک زیادی دارد. شاید تنها وجه اشتراک این دو مشکل این است که حل آنها سخت است. Atlas Building Composites، که از MIT است، ماموریت دارد تا هر دو مشکل را با یک راه حل واحد حل کند. این شرکت یک پلت فرم تولید رباتیک مبتنی بر هوش مصنوعی ایجاد کرده است که می تواند پلاستیک های یکبار مصرف را به مصالح ساختمانی بادوام تبدیل کند. این شرکت از MIT HAUS، یک تلاش تحقیقاتی در بخش مهندسی مکانیک MIT که مخفف \"معماری خانه برای پایداری جهانی\" است، پدید آمد. اطلس از بازیافت پلاستیک بدون آب و فناوری ساخت افزودنی کامپوزیت در مقیاس بزرگ برای ساخت قطعاتی مانند پایه های خانه، عرشه ها و خرپاها برای دیوارها، کف ها و سقف ها استفاده می کند. رئیس و یکی از بنیانگذاران اطلس A.J می گوید: \"مأموریت ما تبدیل آلودگی پلاستیک زباله به کامپوزیت های بادوام برای ساخت 1 میلیارد خانه است.\" Perez '13, MNG '14, PhD '23 که همچنین یک دانشمند تحقیقاتی MIT است. \"شما نمی توانید این چیزها را از یکدیگر جدا کنید. ما فقط برای ساختن خانه ها اینجا نیستیم و فقط برای بازیافت پلاستیک اینجا نیستیم. روش مرسوم ساخت خانه ها شامل قطع درختان، استخراج معادن، پالایش و یکسری فعالیت های کثیف دیگر است. ما می خواهیم از همه اینها اجتناب کنیم و به همه پلاستیک های محدود شده برای اقیانوس ها و محل های دفن زباله بپردازیم. ما بطری ها را به ساختمان تبدیل می کنیم.» قطعات اطلس در حال حاضر برای پشتیبانی از انبارها، سوله ها، عرشه ها و اسکله ها استفاده می شود. اخیراً، این شرکت برای ساخت یک پل 40 فوتی در تالاب ماساچوست، خرپاهای کامپوزیت بازیافتی ساخت آمریکا را در اختیار سپاه مهندسین ارتش ایالات متحده قرار داد. مت پولیوت، بنیانگذار پرز و اطلس، هزاران"}, {"source": "TechCrunch AI", "title": "5 days left to exhibit at TechCrunch Disrupt 2026", "link": "https://techcrunch.com/2026/09/14/techcrunch-disrupt-2026-exhibit-table-deadline-5-days/", "summary": "The last day to apply for an exhibit table at TechCrunch Disrupt 2026 on Sept 18. Just 5 days left. Secure your spot on the Expo Hall floor and put your business in front of 10,000+ founders, investors, and tech leaders.", "date_str": "2026-09-14T14:00:00+00:00", "hash": "a1996202ab2efc5f", "title_fa": "5 روز تا نمایشگاه در TechCrunch Disrupt 2026 باقی مانده است", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار در اعتبارات تصویر مختل کننده صرفه جویی کنید: استارتاپ های TechCrunch 5 روز باقی مانده تا نمایشگاه در رویدادهای TechCrunch 2026 TechCrunch 7:00 PMT · 14 سپتامبر 2026 ساعت در حال افزایش است. میز نمایشگاه خود را برای TechCrunch Disrupt 2026 تا 18 سپتامبر ساعت 23:59 رزرو کنید. PT. TechCrunch Disrupt 2026 از 13 تا 15 اکتبر در Moscone West در سانفرانسیسکو برگزار می‌شود و بیش از 10000 بنیان‌گذار، سرمایه‌گذار، اپراتور و رهبر فناوری را برای سه روز راه‌اندازی، جمع‌آوری سرمایه، شبکه‌سازی، کشف محصول و انجام معامله گرد هم می‌آورد. شرکت‌کنندگان می‌آیند تا مشتریان، سرمایه‌گذاران، شرکا، استعدادها و فناوری‌هایی را بیابند که آینده را شکل می‌دهند. اگر می‌خواهید استارت‌آپ خود را در میانه این گفتگوها قرار دهید، در طبقه سالن اکسپو به نمایش بگذارید. نمایشگاه تیم شما را در یک محیط پرترافیک برای تمام سه روز با یک میز نمایشگاهی با مارک 6 × 30 قرار می دهد که در آن می توانید محصول خود را به نمایش بگذارید، با مشتریان احتمالی رو در رو ملاقات کنید و گفتگوها را به سرنخ تبدیل کنید."}, {"source": "TechCrunch AI", "title": "A Vinyl Bar in Shibuya is a startup offering fun music apps without any AI prompting", "link": "https://techcrunch.com/2026/09/14/a-vinyl-bar-in-shibuya-is-a-startup-offering-fun-music-apps-without-any-ai-prompting/", "summary": "Former Spotify exec's company releases experimental \"singles\" that involves users in music making.", "date_str": "2026-09-14T13:55:00+00:00", "hash": "5cadabe8bfad60ba", "title_fa": "نوار وینیل در شیبویا یک استارت‌آپ است که برنامه‌های موسیقی سرگرم‌کننده را بدون هیچ گونه درخواست هوش مصنوعی ارائه می‌کند", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در اعتبارات تصویر مختل: نوار وینیل در برنامه های شیبویا یک نوار وینیل در Shibuya یک استارت آپ است که برنامه های موسیقی سرگرم کننده را بدون هیچ گونه هوش مصنوعی ایوان مهتا ارائه می دهد · 14 سپتامبر 2026، با استفاده از ابزارهای جدید هوش مصنوعی برای ایجاد ابزارهای جدید هوش مصنوعی برای افراد جدید AI r استفاده می کنند. هوش مصنوعی به سبک هر هنرمندی که بخواهد دستور می دهد. A Vinly Bar in Shibuya، استارت‌آپی که بیشتر شبیه نام یک گروه مستقل به نظر می‌رسد، بر انتشار یک سری برنامه‌های کوچک تمرکز دارد که به شما امکان می‌دهند با صداها و آوازها بازی کنید. این شرکت مبلغ 5.5 میلیون دلاری را از Mantis VC، SV Angel، Boxgroup، Quiet Capital، ERA، Common Metal، Gold House، Liquid 2 Ventures، Breakers VC، Systemic Ventures، و داون اوستروف، مدیر ارشد تجارت محتوا و تبلیغات Spotify، که به عنوان مشاور به شرکت پیوست، جمع آوری کرده است. این استارت آپ توسط Máuhan M Zonoozy، که رئیس سابق نوآوری Spotify بود، ساخته شده است. قبل از آن، او یک استارتاپ کلیپ ویدیویی و ریمیکس به نام Bubbl را تاسیس کرد که توسط کریکت مدیا خریداری شد. Zonoozy که در سال 2024 اسپاتیفای را ترک کرد، گفت که همیشه می‌خواسته به ساختن چیزی برای خودش بازگردد. او فکر می کرد که در حالی که استریم مشکل دسترسی را حل می کند، بیشتر تعامل با موسیقی همچنان حول محور مصرف است."}, {"source": "TechCrunch AI", "title": "What’s behind the AI industry’s latest warnings of doom?", "link": "https://techcrunch.com/2026/09/13/whats-behind-the-ai-industrys-latest-warnings-of-doom/", "summary": "On Equity, we discussed the AI industry's latest debate about whether it poses an existential threat to humanity.", "date_str": "2026-09-13T19:40:15+00:00", "hash": "3d8708db65b8e02e", "title_fa": "پشت آخرین هشدارهای صنعت هوش مصنوعی در مورد عذاب چیست؟", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار صرفه جویی کنید اعتبارات تصویر مختل: erhui1979 / هوش مصنوعی Getty Images پشت آخرین هشدارهای صنعت هوش مصنوعی در مورد عذاب چیست؟ Anthony Ha 12:40 PM PDT · 13 سپتامبر 2026 گوش دادن به پادکست های اپل گوش دادن در Spotify به نظر می رسد صنعت هوش مصنوعی بلندترین بحث خود را در مورد اینکه آیا فناوری آن تهدیدی وجودی برای بشریت به شمار می رود، دارد. بحث کنونی پس از آن آغاز شد که محقق هوش مصنوعی Jacob Coxon گفت که او از Anthropic استعفا داده است زیرا نگران است که شرکت های پیشرو هوش مصنوعی \"با زندگی ما قمار می کنند\". سپس سرنخ هم‌ترازی Anthropic با پستی همراه شد که اعلام می‌کرد: «ما واقعاً عمیقاً معتقدیم که هوش مصنوعی می‌تواند همه انسان‌ها را بکشد!» وی افزود که او شخصا فکر می کند که این شانس \"بیش از 10٪ در دهه آینده\" است. در آخرین قسمت از پادکست سهام TechCrunch، کریستن کوروسک، شان اوکین و من درباره آخرین هشدارهای آخرالزمانی بحث کردیم. من سعی کردم توضیح دهم که چرا به بسیاری از روایات مربوط به نابودی هوش مصنوعی بدبین هستم، در حالی که کرستن پرسید که آیا این \"فقط یک روش عجیب و غریب برای نشان دادن پیشرفت مدل هوش مصنوعی شرکت آنها\" است، به ویژه در شرایطی که این شرکت ها آماده عرضه عمومی می شوند. و شان تعجب کرد که چگونه ممکن است این نگرانی‌ها در پرونده S-1 آنتروپیک برای عرضه اولیه سهام آن نشان داده شود: «آیا در حال حاضر وکلای جوانی وجود دارند که در حال گذراندن و بازنویسی کل بخش پرونده S-1 هستند تا بگویند، «این موضع رسمی Anthropic است که بیش از 10٪ احتمال دارد که"}, {"source": "TechCrunch AI", "title": "Obama urges Democrats to have a ‘clear plan’ for AI safeguards", "link": "https://techcrunch.com/2026/09/13/obama-urges-democrats-to-have-a-clear-plan-for-ai-safeguards/", "summary": "Obama recently said that Democrats need to make artificial intelligence one of their “central agendas” and “have a very clear plan” to address concerns around the technology’s economic impact and safety.", "date_str": "2026-09-13T16:30:00+00:00", "hash": "4a57bac46855d404", "title_fa": "اوباما از دموکرات‌ها می‌خواهد که «برنامه‌ای واضح» برای پادمان‌های هوش مصنوعی داشته باشند", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در اعتبارات تصویر مختل کنید: برنده مک نامی / گتی ایماژ هوش مصنوعی اوباما از دموکرات ها می خواهد که \"برنامه ای واضح\" برای پادمان های هوش مصنوعی داشته باشند آنتونی ها 9:30 صبح PDT · 13 سپتامبر 2026، رئیس جمهور سابق، باراکا اوباما، اخیراً گفته است که دموکرات های هوش مصنوعی از اوباما باید یک نفر باشند. به گفته نیویورک تایمز، و \"یک برنامه بسیار روشن\" برای رفع نگرانی ها در مورد تأثیر اقتصادی و ایمنی فناوری داشته باشید. اوباما این اظهارات را روز پنجشنبه در مراسم جمع آوری کمک های مالی حزب دموکرات، جایی که با حکیم جفریس، رهبر اقلیت مجلس نمایندگان آمریکا مصاحبه کرد، بیا وانید."}, {"source": "The Verge", "title": "Trump and Mike Johnson think the AI industry is overreacting", "link": "https://www.theverge.com/ai-artificial-intelligence/994441/trump-mike-johnson-ai-industry-overreacting", "summary": "Yesterday, Anthropic CEO Dario Amodei published a lengthy open letter saying it was time to \"pace the frontier\" and slow down AI development. OpenAI's Sam Altman and Elon Musk both agreed, publicly voicing their support on X. Even Alphabet's Demis Hassabis offered tentative support for Amodei's proposal. Donald Trump and House Speaker Mike Johnson, however, seem to think the AI executives are being overreactive and fear that a pause could lead to China outpacing the US in the AI race. According to the Financial Times , Trump said \"Look, we're leading China in AI … and, frankly, I want to keep it that way, because whoever wins AI, wins.\" Jo … Read the full story at The Verge.", "date_str": "2026-09-13T19:41:48+00:00", "hash": "5d7c3373be66a9e8", "title_fa": "ترامپ و مایک جانسون فکر می کنند صنعت هوش مصنوعی بیش از حد واکنش نشان می دهد", "summary_fa": "دیروز، داریو آمودی، مدیر عامل آنتروپیک، نامه سرگشاده طولانی‌ای منتشر کرد و گفت که زمان آن فرا رسیده است که به سرعت در حال پیشرفت باشیم و توسعه هوش مصنوعی را کاهش دهیم. سم آلتمن و ایلان ماسک از OpenAI هر دو موافقت کردند و علناً حمایت خود را از X ابراز کردند. با این حال، به نظر می‌رسد دونالد ترامپ و مایک جانسون، رئیس مجلس نمایندگان، فکر می‌کنند که مدیران هوش مصنوعی بیش از حد واکنش نشان می‌دهند و از این می‌ترسند که مکث می‌تواند منجر به پیشی گرفتن چین از آمریکا در رقابت هوش مصنوعی شود. بر اساس گزارش فایننشال تایمز، ترامپ گفت: \"ببینید، ما در زمینه هوش مصنوعی چین را رهبری می کنیم ... و صادقانه بگویم، من می خواهم این وضعیت را حفظ کنم، زیرا هر کسی برنده هوش مصنوعی باشد، برنده است.\" جو … داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "Apple is reportedly working on iPhone game controllers", "link": "https://www.theverge.com/tech/994426/apple-iphone-game-controllers", "summary": "Bloomberg's Mark Gurman says Apple is developing two game controllers for the iPhone and will likely sell them under the Beats brand. Rumors that Apple might enter the game controller business have circulated for some time. But last week, MacRumors reported finding two references in macOS 26.7's code to two game controllers identified as first-party devices. Despite the code being found in macOS, not iOS, Gurman says the controllers are designed for iPhones. Additionally, he says that it is Beats executives leading the charge on this product. Apple sometimes uses its subsidiary brand to experiment with new product categories and compete at … Read the full story at The Verge.", "date_str": "2026-09-13T18:30:16+00:00", "hash": "cdda7dbd073dac5b", "title_fa": "ظاهرا اپل در حال کار بر روی کنترلرهای بازی آیفون است", "summary_fa": "مارک گورمن از بلومبرگ می گوید اپل در حال توسعه دو کنترلر بازی برای آیفون است و احتمالاً آنها را با نام تجاری Beats به فروش خواهد رساند. مدتی است که شایعاتی مبنی بر ورود اپل به تجارت کنترلرهای بازی منتشر شده است. اما هفته گذشته، MacRumors گزارش داد که دو مرجع در کد macOS 26.7 به دو کنترلر بازی که به عنوان دستگاه های شخص اول شناسایی شده اند، پیدا کرده است. با وجود کدهایی که در macOS یافت می‌شوند نه iOS، Gurman می‌گوید این کنترل‌کننده‌ها برای آیفون‌ها طراحی شده‌اند. علاوه بر این، او می گوید که این مدیران بیتز هستند که مسئولیت این محصول را بر عهده دارند. اپل گاهی اوقات از برند تابعه خود برای آزمایش با دسته بندی محصولات جدید و رقابت در ... داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "The Units’ Digital Stimulation is synthpunk perfection", "link": "https://www.theverge.com/entertainment/994415/the-units-digital-stimulation-synthpunk-review", "summary": "The Units are a band I discovered in part thanks to No Dogs in Space . During their miniseries on The Screamers (another incredible band worth checking out), they mention synthpunk.org as one of their sources. And there's no better way to get my attention than to combine two of my favorite things - punk rock and synthesizers . The site was down that day (it appears to be back up now), but I was able to access a version from July through the Wayback Machine. What greeted me was a bare-bones site with links for six bands, including The Screamers. But at the top was The Units, a band I'd never heard of and, after tracking down their 1980 record D … Read the full story at The Verge.", "date_str": "2026-09-13T17:36:10+00:00", "hash": "6c3ea2f5894b9ce2", "title_fa": "Units’ Digital Stimulation یک کمال synthpunk است", "summary_fa": "The Units گروهی هستند که تا حدی به لطف No Dogs in Space کشف کردم. در طول مینی سریال خود در The Screamers (گروه باورنکردنی دیگری که ارزش دیدن دارد)، آنها synthpunk.org را به عنوان یکی از منابع خود ذکر می کنند. و هیچ راهی برای جلب توجه من بهتر از ترکیب دو مورد مورد علاقه ام - پانک راک و سینت سایزرها وجود ندارد. آن روز سایت از کار افتاده بود (به نظر می رسد اکنون پشتیبان گیری شده است)، اما من توانستم از طریق Wayback Machine به نسخه ای از ماه جولای دسترسی داشته باشم. چیزی که به من خوشامد گفت یک سایت بی بضاعت با پیوندهایی برای شش گروه از جمله The Screamers بود. اما در صدر گروه The Units قرار داشت، گروهی که من هرگز نامش را نشنیده بودم و پس از ردیابی رکورد 1980 آنها D… داستان کامل را در The Verge بخوانید."}, {"source": "TechCrunch Main", "title": "Insight Partners’ Deven Parekh on why the firm is diversifying while everyone else bets the farm on OpenAI and Anthropic", "link": "https://techcrunch.com/2026/09/13/insight-partners-devin-parekh-on-why-the-firm-is-diversifying-while-everyone-else-bets-the-farm-on-openai-and-anthropic/", "summary": "Insight Partners' Devin Parekh opens up about losing Legora to General Catalyst, why he's fine holding stakes in rival AI labs, and why — even as everyone else piles into OpenAI and Anthropic — his $90 billion firm is deliberately staying diversified.", "date_str": "2026-09-13T21:30:00+00:00", "hash": "50c78e4936dcaed3", "title_fa": "Deven Parekh از Insight Partners در مورد اینکه چرا شرکت در حال تنوع است در حالی که دیگران روی مزرعه OpenAI و Anthropic شرط بندی می کنند", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبارات: TechCrunch/StrictlyVC Deven Parekh Venture Insight Partners Deven Parekh در مورد اینکه چرا شرکت در حال تنوع است در حالی که دیگران روی مزرعه OpenAI و Anthropic Connie Loizos شرط بندی می کنند 2:30 PM 13-20 سپتامبر شرکت سرمایه گذاری سنگین وزن Insight Partners به مدت 26 سال. برخلاف بسیاری از VCهایی که در X صدای بلندی دارند و به نظر می‌رسد در پادکست‌ها زندگی می‌کنند، Parekh و Insight Partners تمایل دارند پایین‌تر باشند. در این نشست با TechCrunch در رویداد StrictlyVC آن در پنجشنبه شب در نیویورک، Parekh به طرز تازه‌ای در مورد برخی از برنده‌های این شرکت صریح بود (برای مثال، او دورهای متعددی را در Databricks رهبری و رهبری کرده است و سهامی در OpenAI و Anthropic دارد). معاملاتی که برنده نشده است، از جمله شرکت حقوقی فناوری هوش مصنوعی Legora. تضاد منافع در سرمایه گذاری خطرپذیر؛ و چرا اینسایت به یک استراتژی متنوع پایبند است، حتی زمانی که VC ها در آزمایشگاه های هوش مصنوعی مرزی انباشته شده اند. این مصاحبه برای طولانی بودن و وضوح ویرایش شده است. محققی وجود دارد که به داستان بزرگ هفته تبدیل شده است - من همین اوایل امشب از کیت رابویس در مورد این موضوع پرسیدم [و او پژوهشگر را رد کرد]. آیا فکر می کنید که نگرانی در مورد خطر هوش مصنوعی به هیستری تبدیل می شود یا نگرانی های واقعی دارید؟"}, {"source": "TechCrunch Main", "title": "Larry Ellison cancels $7.5 billion sale of Oracle stock", "link": "https://techcrunch.com/2026/09/13/larry-ellison-cancels-7-5-billion-sale-of-oracle-stock/", "summary": "Oracle had previously disclosed that Ellison planned to sell 50 million shares worth around $7.5 billion.", "date_str": "2026-09-13T20:49:38+00:00", "hash": "73e259a36d47cdc2", "title_fa": "لری الیسون فروش ۷.۵ میلیارد دلاری سهام اوراکل را لغو کرد", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار صرفه جویی در مورد Disrupt، بنیانگذار و رئیس اجرایی اوراکل، لری الیسون، فروش برنامه ریزی شده سهام اوراکل خود را لغو کرده است. به گزارش رویترز، اوراکل قبلاً در یک پرونده نظارتی فاش کرده بود که الیسون قصد دارد 50 میلیون سهم به ارزش حدود 7.5 میلیارد دلار بفروشد. این شرکت دلیلی برای تغییر برنامه ها ارائه نکرد. این شرکت گفت: \"هیچ سهام اوراکل تحت این طرح فروخته نشد و او هیچ برنامه دیگری برای فروش سهام اوراکل خود ندارد.\" سهام اوراکل در حال حاضر از ابتدای سال 22 درصد کاهش یافته است. این شرکت هزینه های زیادی را برای مراکز داده هزینه کرده است و اخیراً به یکی از مالکان و شرکای امنیتی اصلی عملیات TikTok در ایالات متحده تبدیل شده است."}, {"source": "TechCrunch Main", "title": "The 9 buzziest startups from Y Combinator’s latest Demo Day, according to VCs", "link": "https://techcrunch.com/2026/09/13/the-9-buzziest-startups-from-y-combinators-latest-demo-day-according-to-vcs/", "summary": "From floating reactors to brain chips: VCs picked their favorite YC startups from the summer batch.", "date_str": "2026-09-13T20:28:00+00:00", "hash": "f2d7fc15e7a3d515", "title_fa": "بر اساس VCs، 9 استارتاپ پرطرفدار از آخرین روز نمایشی Y Combinator", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبارات: Bryce Durbin / TechCrunch Venture 9 استارت آپ پر جنب و جوش از آخرین روز نمایشی Y Combinator، به گفته VCs Marina Temkin Dominic-Madori Davis 1:28 PM روز 13:28 بعد از ظهر، روز پنجشنبه، 2 سپتامبر 2017، یک روز دیگر Combin روز PDT برگزار شد. اما این دسته کمی متفاوت به نظر می رسید. در حالی که هر گروه موج جدیدی از بنیان‌گذاران را به همراه دارد، استارت‌آپ‌هایی که این هفته ارائه کردند، بسیار بیشتر از سال‌های گذشته به سمت فناوری عمیق گرایش پیدا کردند. همانطور که هر سه ماه انجام می دهیم، TechCrunch از VCهای مرحله اولیه خواست تا داغ ترین استارت آپ ها را در این دسته نام ببرند – هم برترین ها و هم معاملاتی که همه درباره آن صحبت می کردند. و طبق معمول، فهرستی از استارت‌آپ‌هایی را که حداقل دو سرمایه‌گذار آن‌ها را به‌عنوان پرهیاهوترین شرکت‌ها معرفی کرده‌اند، گردآوری کردیم. همانطور که یکی از سرمایه گذاران بیان کرد، فناوری در این دسته مانند یک داستان علمی تخیلی بود. اما فراتر از ایده‌های وحشی، اتفاق نظر این بود که ارزش‌گذاری‌ها به مراتب بیشتر از گروه‌های اخیر پایه‌گذاری شده‌اند. ما برترین ها را به ترتیب حروف الفبا در زیر فهرست کرده ایم:"}, {"source": "TechCrunch Main", "title": "TechCrunch Mobility: Lyft has entered the robotaxi chat", "link": "https://techcrunch.com/2026/09/13/techcrunch-mobility-lyft-has-entered-the-robotaxi-chat/", "summary": "Welcome back to TechCrunch Mobility, your hub for the future of transportation, and now, more than ever, the role AI is playing in it.", "date_str": "2026-09-13T16:04:00+00:00", "hash": "66217f213d54283f", "title_fa": "TechCrunch Mobility: Lyft وارد چت robotaxi شده است", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف برای بلیت‌ها اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار در Disrupt Lyft پس انداز کنید این هفته زمانی که Waymo robotaxis روی برنامه خود در نشویل قرار گرفت، به نقطه عطف جدیدی رسید. تحت این مشارکت، Lyft خدمات ناوگان، مانند آماده‌سازی و نگهداری خودرو، و همچنین عملیات زیرساختی و انبار را از طریق شرکت تابعه کاملاً متعلق به خود Flexdrive انجام می‌دهد. در نشویل، مشتریان می‌توانند مستقیماً از برنامه Waymo یک روباتاکسی Waymo استفاده کنند، یا شانس خود را در برنامه Lyft امتحان کنند، که بسته به در دسترس بودن، سواران را با Waymo مطابقت می‌دهد. Lyft در طول سال‌ها در زمینه فناوری خودروهای خودران، از جمله از طریق مشارکت با Aptiv (اکنون Motional) در لاس‌وگاس، می موبیلیتی در آتلانتا، بایدو در لندن، و Waymo در فینیکس فعالیت کرده است. اما این هفته قابل توجه است زیرا اولین ورود واقعی Lyft به خدمات روباتاکسی تجاری با استفاده از وسایل نقلیه بدون راننده بدون اپراتور انسانی پشت فرمان است. مبادا فراموش کنید، این شرکت چهار س ltra در سال 2024 راه اندازی شد، اما همچنان قهرمان ساندبار من است، با بکرترین صدا برای فیلم، بازی و موسیقی. از آنجایی که برخی از دیگر انتخاب‌های برتر من از آن در زمینه‌های خاص مانند صدای فراگیر یا باس برتری دارند، عملکرد همه جانبه عالی Arc Ultra توصیه آن را آسان می‌کند."}, {"source": "Wired", "title": "Sexually Explicit Deepfake Sites Target 100-Plus Politicians in Europe", "link": "https://www.wired.com/story/sexually-explicit-deepfake-sites-target-100-plus-politicians-in-europe/", "summary": "An analysis of 160 deepfake websites reveals politicians in 22 countries appear on them. Nearly all of them are women.", "date_str": "2026-09-14T11:00:00+00:00", "hash": "32a673ea8ede353b", "title_fa": "سایت های Deepfake جنسی صریح 100 سیاستمدار در اروپا را هدف قرار می دهند", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان طبق تحقیقات جدیدی که توسط WIRED مشاهده شده است، تقریباً 150 سیاستمدار در سراسر اروپا در چند سال گذشته در وب سایت های پورنوگرافی عمیق جعلی مضر گنجانده شده اند. برخی از سیاستمداران، که اکثراً زنان هستند، شبیه به آنها در ویدیوهای صریح گنجانده شده است، در حالی که برخی دیگر اسامی و عکس‌ها را در ورودی‌های آزاردهنده شبیه به پایگاه داده فهرست کرده‌اند که می‌توانند به ابزارهای ایجاد دیپ‌فیک پیوند دهند. تجزیه و تحلیل حدود 160 دامنه که میزبان سوء استفاده عمیق و سایر محتوای جنسی غیر توافقی است، توسط محقق بنجامین شولتز، نشان می دهد که حداقل 138 نماینده زن پارلمان (نماینده پارلمان) از 22 کشور اتحادیه اروپا در این سایت ها ظاهر شده یا نام برده شده است. در مقابل، تنها به 9 نماینده مرد به هر نحوی ارجاع داده شد. بر اساس محاسبات شولتز، 33 برابر بیشتر احتمال دارد که نمایندگان زن توسط اکوسیستم‌های دروغین هدف قرار بگیرند. سوزان کروگر، نماینده هلندی در پارلمان هلند با گروه هلند مترقی که تحت تاثیر قرار گرفت، می‌گوید: «پورن‌های جعلی بخشی از روند بسیار بزرگ‌تر نفرت آنلاین و ارعاب علیه زنان و سیاستمداران زن است. کروگر، که از آنچه در این تحقیق کشف شد ابراز خشم کرد، می‌گوید این یافته‌ها «واقعاً عمیقاً ناراحت‌کننده» هستند و به آشکار شدن مقیاس سوء استفاده کمک می‌کنند. کروگر می گوید: «ما سیاستمدار هستیم، ما یک سکو داریم و صحبت می کنیم. اما در همین حال، میلیون‌ها زن قربانی این اعمال جنایتکارانه هستند.» این تحقیق که توسط اندیشکده دموکراسی دیجیتال آلمانی Agora Digitale Transformation منتشر شده است، بر نمایندگان ملی پارلمان از تمامی 27 کشور اتحادیه اروپا متمرکز است. شولتز، یکی از همکاران آگورا و محقق اصلی در پروژه نور خورشید آمریکا، جزئیات بیش از 5800 نماینده پارلمان در سراسر اروپا"}, {"source": "Wired", "title": "Roborock Qrevo 2 Review (2026): A New Budget Vacuum King?", "link": "https://www.wired.com/review/roborock-qrevo-2-pro/", "summary": "Roborock's more affordable vacuum did well on corners and navigating my home, but thresholds and small objects remain a challenge. Still, it's a good vacuum for the price, especially when it's on sale.", "date_str": "2026-09-14T10:30:00+00:00", "hash": "284b4b3cdf83d944", "title_fa": "بررسی Roborock Qrevo 2 (2026): یک پادشاه خلاء بودجه جدید؟", "summary_fa": "اکنون بخرید چندین گزینه خرید 800 دلاری در آمازون 800 دلاری در Roborock در دسترس است. آسان برای کنترل. جاروبرقی و تمیز کردن عالی. پوشش خوب گوشه که در یکی از تست‌های پیچیده‌تر من قرار گرفت. مکش زیاد با قدرت بالا. خسته برای شناسایی وسایل کوچک مانند اسباب بازی های گربه یا پاهای تخت میز مبارزه می کند. نتایج متوسطی با تمیز کردن آزمایشات نشت من. Roborock برای مدتی مورد علاقه بازی ربات خلاء بود. در اینجا در WIRED، بازبینان ما طرفداران قدیمی خط مقرون به صرفه Qrevo هستند، اما برای سال‌ها بدون به‌روزرسانی باقی ماند. این شرکت بیشتر بر روی طرح‌های منحصربه‌فرد تمرکز کرده است، مانند ساروس Z70، که یک بازوی کامل به آن متصل است تا جوراب‌های شما را بگیرد. اینها قبل از اینکه واقعاً مفید باشند راهی برای رفتن دارند. اما امسال، خط Qrevo بالاخره دوباره عشق می ورزد. خط Qrevo Curv مدل جدیدی را دریافت کرد که ما در ژانویه آن را بررسی کردیم و اکنون Qrevo 2 Pro وجود دارد که به تازگی در پایان ماه اوت عرضه شده است. پس از دو هفته زندگی با آن، به راحتی یکی از جاروبرقی های ربات زیر 1000 دلاری مورد علاقه من است، به خصوص برای تمیز کردن گوشه های آن، و این قدرت را دارد که با انتخاب بودجه فعلی من، Eufy Omni C28 رقابت کند. تنها شکایت من چیزهای کوچک است. منظورم به معنای واقعی کلمه این است: این ربات در تشخیص اثاثیه و عبور از موانع بزرگ عالی است، اما طناب‌ها یا اسباب‌بازی‌های گربه شما را که روی زمین افتاده‌اند را تشخیص نمی‌دهد. عکس: Nena Farrell Roborock Qrevo 2 Pro دارای طیف خوبی از مشخصات است. این دستگاه دارای یک موتور دیجیتال 20000 Pa، سرعت چرخش 200 دور در دقیقه برای پدهای دستشویی، ناوبری LiDar برای نقشه‌برداری از خانه شما، یک ماپ FlexiArm است"}, {"source": "Wired", "title": "Best Noise-Canceling Earbuds (2026): Bose, Apple, Samsung, Beats, and More", "link": "https://www.wired.com/story/best-noise-canceling-earbuds/", "summary": "I’ve tested dozens of wireless earbuds. These are the best for when you want to tune out the world, wherever you are.", "date_str": "2026-09-14T10:00:00+00:00", "hash": "e4cf8c792da9f452", "title_fa": "بهترین هدفون حذف نویز (2026): Bose، Apple، Samsung، Beats و بیشتر", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان بهترین هدفون های حذف نویز فناوری ضروری هستند که همه ما روزانه برای گوش دادن به همه چیز از تماس های تلفنی، پادکست ها و برنامه های تلویزیونی گرفته تا تمرینات، رفت و آمد و سفر هوایی استفاده می کنیم. لیست بی پایان است. اگر فقط یک جفت هدفون خریداری می کنید، باید آن را به یک جفت هدفون خوب برای حذف نویز تبدیل کنید. اکثر هدفون های بی سیم دارای قابلیت حذف نویز داخلی هستند، اما تفاوت بین یک جفت خوب و یک جفت عالی بسیار زیاد است. به من اعتماد کنید، من همه انتخاب‌های برترمان را در دنیای واقعی آزمایش کرده‌ام - فکر کنید خیابان‌های شلوغ شهر نیویورک، کافه‌های پر سر و صدا، سالن‌های ورزشی شلوغ، و سکوهای مترو در ساعات شلوغی - و گاهی اوقات، حذف نویز در انجام یک وظیفه‌اش کمتر موثر است. انتخاب‌های برتر من از برندهایی مانند Bose، Anker، Apple و Beats می‌آیند، و در حالی که هیچ کدام به طور کلی بهترین نیستند، چند گزینه عالی متناسب با نیازهای مختلف هستند. برای انتخاب‌های بیشتر، راهنمای بهترین هدفون‌های حذف نویز (که شامل هدفون‌های غیر هدفون است)، بهترین هدفون ارزان، و بهترین هدفون تمرینی ما را بررسی کنید. WIRED را دوست دارید؟ ما را به عنوان منبع ترجیحی در Google اضافه کنید تا تعداد بیشتری از ما را ببینید. بهترین Earbuds ANC Bose QuietComfort Ultra Earbuds (نسل دوم) بیشتر بخوانید 299$249$ (17% تخفیف) Amazon Best Budget Earbuds ANC Soundcore توسط Anker Liberty 5 Pro اطلاعات بیشتر 170$150$ (12% تخفیف) Amazon"}, {"source": "Wired", "title": "A College Girl Was Exploited on Camera. A Network of Anonymous Men Got to Work", "link": "https://www.wired.com/story/burnerverse-maddie-kowalski/", "summary": "Maddie Kowalski is one of countless young women who’ve had their lives destroyed by the burnerverse, a loosely connected online community of sports fans. Now she’s fighting back.", "date_str": "2026-09-14T10:00:00+00:00", "hash": "a7cf0d333ebee3a8", "title_fa": "یک دختر دانشگاهی مورد سوء استفاده دوربین قرار گرفت. شبکه ای از مردان گمنام دست به کار شدند", "summary_fa": "ذخیره این داستان ذخیره داستان ذخیره این داستان اخطار محتوا: این قسمت شامل توضیحاتی در مورد رابطه جنسی بدون توافق و سوء استفاده از تصویر صمیمی است. بعدازظهر یکشنبه 2 نوامبر 2025، مدی کوالسکی در خانه ای در گینزویل توقف کرد تا یک هدیه تحویل دهد. دانشجوی سال دوم دانشگاه فلوریدا در آن تابستان به ژاپن سفر کرده بود، جایی که او یک اکشن فیگور از مانگای One Piece را به عنوان هدیه انتخاب کرده بود. دانش‌آموزان به این ساختمان نزدیک پردیس اصلی، که مدت‌ها با بخش UF فی دلتا تتا مرتبط بوده، به عنوان «قلعه» یاد می‌کنند. خانه‌ای چندخانواری آجری به سبک استعماری، خانه‌ای معمولی برای پسر بچه‌ها با کف‌های چوبی فرسوده، کابل‌های در معرض دید، و «THIS IS FORT» با اسپری رنگ‌های نارنجی و آبی UF روی حصار اطراف آن بود. فی دلتا تتا شهرت زیادی در محوطه دانشگاه نداشت. در آن زمان، آنها به اتهام هزینگ تحت بازجویی قرار گرفتند. اما پسرانی که در آنجا زندگی می کردند بهترین دوستان کوالسکی بودند: \"فکر کردم فضای امنی بود.\" چند ساعت بعد، کوالسکی 19 ساله در آپارتمانی در حال نوشیدن بود که یکی از دوستانش چیزی به او گفت که مسیر زندگی او را تغییر می‌دهد: آیا می‌دانست که تصویر برهنه‌ای از او در FSU، دانشگاهی که چند ساعت  منفی می خواند", "summary_fa": "سخنرانی رئیس جمهور دونالد ترامپ در مورد وضعیت اتحادیه، سه شنبه، 24 فوریه 2026، در ساختمان کنگره ایالات متحده در واشنگتن دی سی، دونالد ترامپ روز یکشنبه در حال تماشای گلف در استراحتگاه دونبگ خود در ایرلند بود که خبرنگاران از او در مورد اشتهای ناگهانی صنعت هوش مصنوعی برای کاهش سرعت خود پرسیدند. او گفت که ایالات متحده چین را رهبری می‌کند، که می‌خواهد آن را به همین شکل حفظ کند و «هرکس با هوش مصنوعی برنده شود، برنده است». ترامپ به خبرنگاران گفت: «ما می‌توانیم نرده‌های محافظ بگذاریم، می‌توانیم این و آن را انجام دهیم، اما من فکر می‌کنم شما نیروهای منفی زیادی دارید که آن را مطرح می‌کنند که ... نباید آن را مطرح می‌کنند، و آنها چیزهایی را مطرح می‌کنند که اتفاق نمی‌افتد». آسوشیتدپرس این اظهارات را از دوبلین گزارش کرد. دو روز قبل، داریو آمودی گفته بود که آنتروپیک و رقبای آن باید سرعت خود را کاهش دهند، و شرکت خود را به ارزیاب های شخص ثالث با دسترسی داخلی متعهد کرد و از واشنگتن خواستار معافیت ضد انحصار شد تا رقبا بتوانند در مورد ایمنی هماهنگ شوند."}, {"source": "The Next Web", "title": "A Nobel laureate and a former EU commissioner say Europe has one year to act on AI", "link": "https://thenextweb.com/news/transformative-ai-strategy-europe-aghion-vestager-15-percent-compute", "summary": "Europe runs about five percent of the world’s AI data centre capacity. A group of senior European economists, policymakers and computer scientists has now put a figure on where it should be by 2030. Fifteen percent, which means building three times what exists today while the global total keeps climbing underneath. Philippe Aghion won the [ ] This story continues at The Next Web", "date_str": "2026-09-14T00:00:26+00:00", "hash": "3b04ecbf5032eb12", "title_fa": "یک برنده جایزه نوبل و یک کمیسر سابق اتحادیه اروپا می گویند اروپا یک سال فرصت دارد تا در زمینه هوش مصنوعی اقدام کند", "summary_fa": "اروپا حدود پنج درصد از ظرفیت مراکز داده هوش مصنوعی جهان را در اختیار دارد. گروهی از اقتصاددانان ارشد اروپایی، سیاست گذاران و دانشمندان کامپیوتر اکنون رقمی را در مورد جایی که باید 0:38+00:00", "hash": "8216f08e2705d011", "title_fa": "اوباما هشدار می دهد که هوش مصنوعی در دستان شخصی می تواند خطرناک باشد و از دموکرات ها می خواهد که وارد عمل شوند", "summary_fa": "باراک اوباما پنج شنبه گذشته در یک گردهمایی بسته جمع آوری کمک های مالی دموکرات ها گفت که هوش مصنوعی \"به سرعت در دستان خصوصی حرکت می کند و اگر ما از آن عبور نکنیم، فکر می کنم می تواند خطرناک باشد.\" نیویورک تایمز متنی جزئی از دفتر وی دریافت کرد و این اظهارات را روز شنبه گزارش داد. توصیه او مورد توجه قرار گرفت [ ] این داستان در وب بعدی ادامه دارد"}, {"source": "MIT Tech Review", "title": "The Download: AI’s real extinction threat and age-reversal tech for eyes", "link": "https://www.technologyreview.com/2026/09/14/1144012/the-download-ai-extinction-threat-age-reversal-vision/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. Roundtables: could AI really kill us all? Employees at the world s leading AI labs are saying there s a real possibility that advanced AI could destroy humanity. Are they right? Or is this more scaremongering and hype? Join MIT Technology Review executive editor Niall Firth, senior AI editor Will Douglas Heaven, and AI reporter Grace Huckins for a subscriber-only conversation unpacking the debate around AI extinction. They’ll explore where the fears come from, whether they hold any water and, if they do, what we should do about them. Register now to attend on Tuesday, September 15 at 16:00 BST / 11:00am EST / 8:00am PST . Want to join the conversation? Subscribe to MIT Technology Review for exclusive access to all our Roundtables. This geneticist’s age-reversal tech could help restore sight Yuancheng (Ryan) Lu is obsessed with aging. And with eyes. As he steps outside the Whitehead Institute in Cambridge, Massachusetts, his aviator glasses darken automatically in the sun. Age-related blindness runs in his family, and his own 23andMe test came back with a mutation for
