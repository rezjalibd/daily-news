<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {

      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

  <script>

وز اعلام کرد که ایالات متحده شب گذشته حملاتی را علیه ایران انجام داده است. از سوی دیگر دبیر شورای عالی امنیت ملی جمهوری اسلامی اعلام کرد پاسخ آمریکا به طرح پیشنهادی ایران «قانع‌کننده» نیست. دونالد ترامپ در برنامه «فاکس اند فرندز» گفت: «آن‌ها یک تأسیسات ضدهوایی ساخته بودند... به‌محض اینکه ساخت آن به پایان رسید، دیشب به‌خوبی آن را هدف قرار دادیم.» ساعاتی پیش رسانه‌های آمریکایی از جمله روزنامه وال‌استریت جورنال و شبکه خبری سی‌ان‌ان از حملات محدود دوشنبه‌شب به جزیره قشم و پدافند هوایی آن با هدف «حفاظت از نیروها و تجهیزات نظامی آمریکا در منطقه» بوده است. رئیس‌جمهور آمریکا در بخش دیگری از گفت‌وگو با فاکس نیوز بار دیگر تهدیدهای خود درباره احتمال اقدام نظامی را تکرار کرد و به شبکه فاکس‌نیوز گفت: «من به دنبال کشتن شمار زیادی از مردم نیستم؛ اما اگر مجبور شویم، این کار را خواهیم کرد.» این اظهارات در حالی مطرح می‌شود که کشورهای منطقه خود را برای احتمال ازسرگیری حملات آمریکا پس از انتخابات میان‌دوره‌ای این کشور آماده می‌کنند. با این حال، ترامپ روز دوشنبه درباره عملی کردن تهدیدهایش برای ازسرگیری حملات نظامی پس از انتخابات ابراز تردید کرده بود. او گفت معتقد است تهران در پی دستیابی هرچه سریع‌تر به توافق است و چنین توافقی «ممکن است حاصل شود». محسن رضایی، دبیر شورای عالی امنیت ملی ایران، روز سه‌شنبه با انتشار متنی در شبکه ایکس گفت که پاسخ آمریکا به مطالبات ایران قانع‌کننده نبوده است. او خواستار تحقق «کامل و صریح» هفت شرط ایران توسط آمریکا شد و افزود: «تنها در این صورت تنگه هرمز باز خواهد شد.» ساعاتی پیش‌تر نیز محمدباقر قالیباف، رئیس مجلس شورای اسلامی و مذاکره‌کننده ارشد ایران، کشورهای منطقه خاورمیانه را تهدید کرد و گفت «توپ در زمین آمریکاست که از جنگ جلوگیری", "image_url": "https://gdb.rferl.org/9938205d-a094-4242-9193-b0f78e7c0253_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۱۲ آبان • ۱۸:۲۱"}],

nk": "https://www.zoomit.ir/iran-news/470435-ai-neglect-disaster-farzin-fardis/", "summary": "فرزین فردیس در رویداد «جنگ و صلح اقتصاد آنلاین» گفت: مهمانی ارز و انرژی ارزان تمام شده و غفلت از هوش مصنوعی برای سازمان‌ها مصیبت‌زاست.", "date_str": "2026-11-03T15:00:00+00:00", "hash": "d74ca44a6e463a84", "title_fa": "عضو هیئت رئیسه اتاق تهران: غفلت از هوش مصنوعی مصیبت‌زا است", "summary_fa": "فرزین فردیس در رویداد «جنگ و صلح اقتصاد آنلاین» گفت: مهمانی ارز و انرژی ارزان تمام شده و غفلت از هوش مصنوعی برای سازمان‌ها مصیبت‌زاست. تبلیغات این عضو هیئت رئیسه اتاق بازرگانی تهران باور دارد دو تغییر بزرگ پیرامون اقتصاد ایران در حال رخ دادن است و غفلت از آن‌ها بزرگ‌ترین مشکل سازمان‌ها است. او در این رویداد توضیح داد چرا سازمان‌های بزرگ در برابر نوآوری مقاومت می‌کنند و چگونه می‌توان سرنوشت نوکیا را تکرار نکرد. فردیس سخنرانی‌اش را با یک پرسش آغاز کرد: «آیا نوکیا نمی‌دانست گوشی‌ها هوشمندتر می‌شوند، یا نمی‌دانست فناوری سریع پیشرفت می‌کند و رقبایش سرسخت‌اند؟» به گفته او، پرسش اصلی این است که سازمانی که در اوج است، چگونه می‌تواند با تغییر محیط، قوانین، فناوری و انتظارات مشتری خود را تغییر دهد تا ناگهان شکست نخورد. کپی لینک چرا سازمان‌های بزرگ مقاومت می‌کنند؟ فردیس با اشاره به نظریه پذیرش نوآوری گفت افراد و سازمان‌ها زمانی فناوری تازه را می‌پذیرند که دو چیز را باور کنند: اول اینکه واقعا مفید است و «خالی‌بندی» نیست، و دوم این که یادگیری آن آسان و در دسترس است. اما سازمان‌های بزرگ چند مانع دارند. به گفته او، این سازمان‌ها دچار سوگیری وضعیت موجودند و ترجیح می‌دهند آرام‌تر حرکت کنند، چون تغییر پرهزینه است. زیان‌گریزند و دست‌داشته‌ها را فدای دستاورد تازه نمی‌کنند؛ و هویت سازمانی‌شان به امور زیادی گره خورده و تغییر آن دشوار است. نوکیا، «امپراتور گوشی‌های کلیدی»، نمونه همین وضعیت بود که حاضر نشد وارد دنیای صفحه‌لمسی شود. او تاکید کرد پذیرش نوآوری فقط به خواستن بستگی ندارد، بلکه به توانایی سازمان در تشخیص ارزش اطلاعات جدید، هضم و درونی‌کردن آن و به‌کارگیری‌اش در اهداف تجاری برمی‌گردد. کپی لینک پایان مهمانی ارز و انرژی عضو هیئت رئیسه اتاق تهران از دو تغییر مهم نام برد. نخست، پایان «مهمانی ارز و انرژی»: دیگر یارانه‌ای برای انرژی نمانده و رانتی هم", "image_url": "https://api2.zoomit.ir/media/tehran-chamber-member-speech-6ae9e186b001528ef859d3fa?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "بورس و طلا"], "datetime_fa": "۱۲ آبان • ۱۸:۳۰"}, {"source": "Business Insider", "title": "As a flight attendant, I wish passengers would leave the window shades open. I've got great reasons, but it's not up to me.", "link": "https://www.businessinsider.com/should-i-open-windows-in-air-flight-attendant-explains-why-2026-10", "summary": "Regardless of whether you feel the window shade should be open or shut during flight, I (not pictured) say the passenger in the window seat should get to control it. Dobrila Vignjevic/Getty Images As a flight attendant , I prefer open window shades — but the choice is up to those in window seats. I love watching the scenery and feel safer, as we all get more visibility into our surroundings. Unless we're stopped at a warm destination or the cabin is rowdy, I am team window shades up. When it comes to whether window shades should be open or shut during a flight, my answer is simple: Generally, it's up to the passenger in the window seat . The choice is theirs to make, unless there's an onboard issue or the crew has instructed otherwise. If I'm in the aisle, and the person in the window seat has the shade down during my flight, I'll be disappointed, but I'll respect their decision. When I'm on the job as a flight attendant, I typically prefer it when my passengers keep the window shades open, too. Generally, I feel safer leaving the shades open When the window shades are open, we can all have a better view of our surroundings. Leanna Coy; Ignatiev/Getty Images Since becoming a flight attendant four years ago, I appreciate having the window shades up even more, especially during takeoff and landing. It gives passengers and crew members more visibility and can improve their situational awareness, which is crucial in the unlikely event of an emergency or evacuation. A passenger might even be able to spot a potential issue before the crew does. If there were a fire on the aircraft's wing, for example, someone in the window seat might be the first person to notice. Many international airlines actually require window shades to remain open during takeoff and landing, and some US airlines encourage the practice, even though it is not mandated by the Federal Aviation Administration. It also gives all of us the chance to catch incredible views I ve seen national parks from above and caught glimpses of the northern lights outside of plane windows. Leanna Coy On a less serious note, it makes me kind of sad when passengers don't care about seeing the view out of the window. Even just a few decades ago, being able to look at the world from the sky was a much rarer experience. Many people never get the opportunity to do so, either. I've been on more than 800 flights, but taking in the scenery and sights never gets old. I've gotten aerial views of Canyonlands, Capitol Reef,", "date_str": "2026-11-03T15:39:51+00:00", "hash": "e1cd0529a3e5d256", "title_fa": "به عنوان مهماندار هواپیما، ای کاش مسافران پنجره ها را باز می گذاشتند. من دلایل بزرگی دارم، اما این به من بستگی ندارد.", "summary_fa": "صرف نظر از اینکه احساس می کنید سایه پنجره باید در طول پرواز باز باشد یا بسته، من (در تصویر نیست) می گویم مسافر روی صندلی پنجره باید آن را کنترل کند. Dobrila Vignjevic/Getty Images به‌عنوان مهماندار هواپیما، من سایه‌های پنجره باز را ترجیح می‌دهم – اما انتخاب با کسانی است که روی صندلی‌های پنجره نشسته‌اند. من عاشق تماشای مناظر هستم و احساس امنیت بیشتری می کنم، زیرا همه ما دید بیشتری نسبت به محیط اطراف خود داریم. مگر اینکه در یک مقصد گرم متوقف شده باشیم یا کابین شلوغ باشد، من پنجره های تیم را بالا می برم. وقتی صحبت از باز یا بسته بودن سایه‌بان‌های پنجره در طول پرواز به میان می‌آید، پاسخ من ساده است: به طور کلی، این به مسافر در صندلی پنجره بستگی دارد. انتخاب با آنهاست، مگر اینکه مشکلی در کشتی وجود داشته باشد یا خدمه دستور etty Images Palantir stock dropped Tuesday even after it delivered strong Q3 results. Shares of the data softare firm are struggling against wider tech jitters and shifting investor sentiment. Views on its results are mixed on Wall Street, even as the company continues to grow. Investors are hammering Palantir stock on Tuesday, dumping shares even after the AI-powered data software firm delivered strong third-quarter earnings. Shares of the company fell as much as 7% to $165.25. Palantir beat Wall Street's estimates on key metrics in the quarter, and reported that commercial revenue exceeded revenue from government contracts for the first time. Total revenue of $2.31 billion blew past analysts' expectations. However, a sharp slowdown in commercial bookings compared to the second quarter rattled investors' view of the stock. The firm reported year over year commercial bookings growth of 11%, compared to 153% booking growth in the prior quarter. \"Analysts blamed a deceleration in US commercial bookings for the selloff, which has taken the stock down to support around $165,\" David Morrison, senior market analyst at Trade Nation, said. \"These are all indications that there's some fragility spreading across the AI-adjacent trade.\" It's the latest example of a hiccup in an otherwise rosy earnings report derailing a high-flying tech stock. Palantir's move is emblematic of just how high investors' expectations have risen, to the point where shares sell off at the first sign of trouble. Other tech giants know well already, with hyperscalers and other AI builders under intense scrutiny when it comes to things like capex spending , which can overshadow other bright spots in earnings reports. The tech trade has also weakened broadly in recent weeks. Volatility throughout Asian markets , spanning China, Japan, and South Korea, has led to heightened concern that the AI bubble may be about to pop . Luke Lango, chief technology analyst at InvestorPlace noted that while his team is still bullish on Palantir, the company doesn't just have to prove its doing well — it has to continuously justify its premium valuation. \"Palantir's rearview looks spectacular, while the view through the windshield got a little foggier after bookings cooled sharply from last quarter's record,\" Lango said. \"For most stocks, that's a footnote. For a stock priced for per", "date_str": "2026-11-03T15:31:38+00:00", "hash": "ee588066b5410d32", "title_fa": "Palantir آخرین قربانی انتظارات بالای درآمدی سرمایه گذاران است", "summary_fa": "الکس کارپ، مدیر عامل پالانتیر، در کنفرانس زتا لایو 2026 در 8 اکتبر 2026 در شهر نیویورک سخنرانی می کند. سهام آستریدا ولیگورسکی/گتی ایماژ پالانتیر روز سه شنبه حتی پس از ارائه نتایج قوی در سه ماهه سوم کاهش یافت. سهام این شرکت نرم‌افزار داده‌ای در حال مبارزه با اختلالات گسترده‌تر فناوری و تغییر احساسات سرمایه‌گذاران هستند. حتی با وجود ادامه رشد شرکت، نظرات در مورد نتایج آن در وال استریت متفاوت است. سرمایه‌گذاران سهام Palantir را در روز سه‌شنبه چکش می‌کنند و سهام خود را حتی پس از اینکه شرکت نرم‌افزار داده‌های مبتنی بر هوش مصنوعی سودهای سه‌ماهه سوم را به دست آورد، کاهش می‌دهند. سهام این شرکت تا 7 درصد کاهش یافت و به 165.25 دلار رسید. Palantir برآوردهای وال استریت در مورد معیارهای کلیدی را در سه ماهه شکست داد و گزارش داد که درآمد تجاری برای اولین بار از درآمدهای حاصل از قراردادهای دولتی فراتر رفته است. مجموع درآمد 2.31 میلیارد دلاری انتظارات تحلیلگران گذشته را زیر پا گذاشت. با این حال، کاهش شدید رزروهای تجاری در مقایسه با سه ماهه دوم دیدگاه سرمایه گذاران را نسبت به سهام تحت تأثیر قرار داد. این شرکت رشد سالانه رزروهای تجاری را 11 درصد گزارش کرده است، در مقایسه با رشد 153 درصدی رزرو در سه ماهه قبل. دیوید موریسون، تحلیلگر ارشد بازار در Trade Nation، گفت: «تحلیلگران کاهش رزروهای تجاری ایالات متحده را عامل این فروش می دانند که باعث کاهش ارزش سهام تا حدود 165 دلار شده است. \"اینها همه نشانه هایی هستند که نشان می دهد شکنندگی در تجارت مجاور هوش مصنوعی گسترش یافته است.\" این آخرین نمونه از یک سکسکه در گزارش درآمدی است که باعث از بین رفتن یک سهام فناور com/6ae8f9ae426e175d4818d849?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۲ آبان • ۱۷:۵۲"}, {"source": "Business Insider", "title": "As a flight attendant, I wish passengers would leave the window shades open. I've got my reasons, but it's not up to me.", "link": "https://www.businessinsider.com/should-i-open-windows-in-air-flight-attendant-explains-why-2026-10", "summary": "Regardless of whether you feel the window shade should be open or shut during flight, I (not pictured) say the passenger in the window seat should get to control it. Dobrila Vignjevic/Getty Images As a flight attendant , I prefer open window shades — but the choice is up to those in window seats. I love watching the scenery and feel safer, as we all get more visibility into our surroundings. Unless we're stopped at a warm destination or the cabin is rowdy, I am team window shades up. When it comes to whether window shades should be open or shut during a flight, my answer is simple: Generally, it's up to the passenger in the window seat . The choice is theirs to make, unless there's an onboard issue or the crew has instructed otherwise. If I'm in the aisle, and the person in the window seat has the shade down during my flight, I'll be disappointed, but I'll respect their decision. When I'm on the job as a flight attendant, I typically prefer it when my passengers keep the window shades open, too. Generally, I feel safer leaving the shades open When the window shades are open, we can all have a better view of our surroundings. Leanna Coy; Ignatiev/Getty Images Since becoming a flight attendant four years ago, I appreciate having the window shades up even more, especially during takeoff and landing. It gives passengers and crew members more visibility and can improve their situational awareness, which is crucial in the unlikely event of an emergency or evacuation. A passenger might even be able to spot a potential issue before the crew does. If there were a fire on the aircraft's wing, for example, someone in the window seat might be the first person to notice. Many international airlines actually require window shades to remain open during takeoff and landing, and some US airlines encourage the practice, even though it is not mandated by the Federal Aviation Administration. It also gives all of us the chance to catch incredible views I ve seen national parks from above and caught glimpses of the northern lights outside of plane windows. Leanna Coy On a less serious note, it makes me kind of sad when passengers don't care about seeing the view out of the window. Even just a few decades ago, being able to look at the world from the sky was a much rarer experience. Many people never get the opportunity to do so, either. I've been on more than 800 flights, but taking in the scenery and sights never gets old. I've gotten aerial views of Canyonlands, Capitol Reef,", "date_str": "2026-11-03T12:54:01+00:00", "hash": "09c8d4e7bf656ab1", "title_fa": "به عنوان مهماندار هواپیما، ای کاش مسافران پنجره ها را باز می گذاشتند. من دلایلم را دارم، اما این به من بستگی ندارد.", "summary_fa": "صرف نظر از اینکه احساس می کنید سایه پنجره باید در طول پرواز باز باشد یا بسته، من (در تصویر نیست) می گویم مسافر روی صندلی پنجره باید آن را کنترل کند. Dobrila Vignjevic/Getty Images به‌عنوان مهماندار هواپیما، من سایه‌های پنجره باز را ترجیح می‌دهم – اما انتخاب با کسانی است که روی صندلی‌های پنجره نشسته‌اند. من عاشق تماشای مناظر هستم و احساس امنیت بیشتری می کنم، زیرا همه ما دید بیشتری نسبت به محیط اطراف خود داریم. مگر اینکه در یک مقصد گرم متوقف شده باشیم یا کابین شلوغ باشد، من پنجره های تیم را بالا می برم. وقتی صحبت از باز یا بسته بودن سایه‌بان‌های پنجره در طول پرواز به میان می‌آید، پاسخ من ساده است: به طور کلی، این به مسافر در صندلی پنجره بستگی دارد. انتخاب با آنهاست، مگر اینکه مشکلی در کشتی وجود داشته باشد یا خدمه دستور دیگری داده باشند. اگر من در راهرو باشم و شخصی که روی صندلی پنجره در طول پروازم سایه داشته باشد، ناامید خواهم شد، اما به gly asked when the massive sums that Big Tech is pouring into AI might pay off . There were signs of recovery on Tuesday with Nasdaq 100 futures up about 0.7% as of 9 a.m. ET. Here's what smart people are saying about the correction. David Rosenberg, president of Rosenberg Research A correction was \" probably inevitable \" given the huge volume of capital pouring into \"any company claiming to have an AI angle,\" David Rosenberg, the president of Rosenberg Research, said in a morning note on Tuesday. The former chief North American economist at Merrill Lynch said that \"both sides of the AI trade are faltering at once.\" The likes of Microsoft and Alphabet have sold off because they're spending too much and eroding their cash flows, he continued, while their suppliers have sold off because \"spending isn't speeding up.\" \"The overriding theme is that investors stopped rewarding the AI buildout and started asking when it pays back,\" Rosenberg added. Jim Reid, head of macro research at Deutsche Bank There isn't an \"overt catalyst\" for the Nasdaq correction, but \"emerging expectations of a blue wave in the midterms\" appear to be weighing on tech stocks , Jim Reid, the global head of macro research at Deutsche Bank, and his team said in a morning note. Investors are pricing in the prospect of a Democratic victory resulting in \"greater hurdles for data center buildout and a push for more AI regulation,\" Reid and his team added. Neil Wilson, investor strategist at Saxo UK Fund managers are \"just reducing overall exposure\" to the AI trade as it's turned \"ugly,\" Neil Wilson, investor strategist at Saxo UK, told Business Ins", "date_str": "2026-11-03T12:43:38+00:00", "hash": "1e01e851119d3ca0", "title_fa": "آنچه افراد باهوش پس از سقوط نزدک در قلمرو اصلاحی، 10 درصد نسبت به رکوردهای اخیر کاهش یافته است، می گویند.", "summary_fa": "نزدک 100 بیش از 10 درصد نسبت به بالاترین قیمت اخیر خود کاهش یافت و وارد یک اصلاح فنی شد. Osmancan Gurdogan/Anadolu از طریق Getty Images de rot both actual computer-style code rot, and the more elusive cultural kind. I'm also taking a look at the fake controversy over the \"cancellation\" of Freddy Krueger, and finally, bringing things home with viral videos of boyfriends dancing. What does \"code rot\" mean? Expect to hear young people talking about code rot for awhile, maybe for the rest of their lives. It's a concept that's going to affect them more than any previous generation. Code rot, or software rot, describes what happens to a computer program when the hardware and operating system it runs on advance. If older programs aren't updated, they become less stable and glitchy until they eventually become unusable. The idea of code rot has really caught on in the young people's popular imagination, probably because they're going to spend a lot of their lives dealing with it. They've even taken the idea of code rot into life, and use the phrase to describe anything that is worn out or malfunctioning. If the ice cream machine isn't working at McDonald's, it's code rotted. Bad grades on a report card? Code rot. Kids are making videos where they demonstrate actual code rot: or point out physical things that are code rotted, like a cat: or their school: Interestingly, a lot of the online discourse around code rotting concerns the massive video game platform Roblox . Because Roblox games there are made by users, there's often not a lot of incentive for the creators to keep the games current with the platform's changes, so a lot of Gen Z's childhood memories of playing games are sinking into code rot. Here's a video about it: Another interesting wrinkle is the tone these videos take. Code rot is seen as apocalyptic. While it's mostly hyperbole, I think part of it is the realization that the entire world is code rotted. The old programs that used to run within the \"Western Culture\" operating system no longer apply and everything is starting to glitch out. What does \"PDF file\" mean? The meaning of \"PDF file\" depends on the context. If you're at work, it refers to a Portable Document Format file, a format created by Adobe that is famously hard for older people to open. In slang, though, PDF file is algo speak for \"pedophile.\" Because that word is flagged by moderation software online, people say \"PDF File\" to skirt the censorship. Why was Freddy Krueger (supposedly) can", "date_str": "2026-11-03T14:30:00+00:00", "hash": "284b676b6b56727b", "title_fa": "راهنمای بزرگسالان خارج از تماس برای فرهنگ کودک: «پوسیدگی کد» به چه معناست؟", "summary_fa": "راهنمای خارج از تماس این هفته نگاهی به پدیده‌ای می‌اندازد که احتمالاً زندگی نسل‌های جوان را تعریف می‌کند: پوسیدگی کد هم پوسیدگی کد واقعی به سبک رایانه‌ای و هم نوع فرهنگی گریزان‌تر. من همچنین نگاهی به جنجال ساختگی در مورد \"لغو\" فردی کروگر، و در نهایت، آوردن همه چیز به خانه با ویدئوهای ویروسی از رقص دوست پسرها دارم. \"پوسیدگی کد\" به چه معناست؟ انتظار داشته باشید که جوانان در مورد پوسیدگی کد برای مدتی، شاید برای بقیه عمر خود صحبت کنند. این مفهومی است که بیش از هر نسل قبلی آنها را تحت تأثیر قرار خواهد داد. پوسیدگی کد، یا پوسیدگی نرم‌افزار، توضیح می‌دهد که چه اتفاقی برای یک برنامه رایانه‌ای می‌افتد که سخت‌افزار و سیستم عامل آن به‌طور پیش‌رو اجرا شود. اگر برنامه‌های قدیمی‌تر به‌روزرسانی نشوند، ثبات و مشکل کمتری پیدا می‌کنند تا زمانی که در نهایت غیرقابل استفاده شوند. ایده پوسیدگی کد واقعاً در تخیل رایج جوانان جا افتاده است، احتمالاً به این دلیل که آنها قرار است بسیاری از عمر خود را صرف مقابله با آن کنند. آنها حتی ایده پوسیدگی کد را نیز به زندگی خود وارد کرده‌اند و از این عبارت برای توصیف هر چیزی که فرسوده یا خراب است استفاده می‌کنند. اگر دستگاه بستنی ساز در مک دونالد کار نمی کند، کد آن پوسیده شده است. نمرات بد در کارنامه؟ پوسیدگی کد. بچه‌ها در حال ساختن ویدیوهایی هستند که پوسیدگی کد واقعی را نشان می‌دهند: یا به چیزهای فیزیکی که کد پوسیده شده‌اند، مانند گربه: یا مدرسه‌شان اشاره می‌کنند: جالب است که بسیاری از گفتمان‌های آنلاین درباره پوسیدگی کد مربوط به پلتفرم عظیم بازی‌های ویدیویی Roblox است. از آنجایی که بازی‌های Roblox در آ       media: [{"source": "Billboard", "title": "Wisin Signs Global Distribution Agreement With Sony Music Latin for Upcoming Releases", "link": "https://www.billboard.com/pro/wisin-signs-global-distribution-deal-sony-music-latin/", "summary": "Wisin has signed a new agreement with Sony Music Latin for the release of his upcoming music projects, which will continue to be launched under his own label, La Base Music Group, Billboard can exclusively announce on Tuesday (Nov. 3). The alliance combines Wisin s artistic vision and business leadership with the global promotional and distribution capabilities of the major label, with which he has worked in the past. “We’re proud to welcome back home Wisin and La Base Music Group and look forward to working together to bring his next chapter of music to fans around the world,” Alex Gallardo , president of Sony Music Latin, said in a statement. Related Wisin Signs With WME in All Areas: ‘I’m Ready to Expand Beyond Music’ Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania “Returning to Sony Music Latin feels like coming home, Wisin added. I’m thrilled to begin this new chapter alongside a team that shares my passion for continuing to innovate and bringing our music to audiences around the world.” The agreement comes as Wisin promotes his latest album Universidad del Perreo , released in September, which celebrates the Puerto Rican roots of reggaetón and connects its pioneers with a new generation of artists. The 12-track set includes collaborations with Ivy Queen, Jowell Randy and Kapo, among others. The project has evolved into a broader platform featuring educational experiences, courses and exclusive events, with more than 2 million registered “students,” according to a press release. The Universidad del Perreo world tour kicks off with two shows at the Coliseo de Puerto Rico José Miguel Agrelot on Nov. 13 and 14. On the B  Wins Best Original Song at 2026 Oscars, But Speech Is Cut Short Here are the 12 soundtracks that have logged the most weeks at No. 1 on Billboard ’s Soundtracks chart since the chart was introduced on June 30, 2001. The list includes two TV soundtracks and 10 film soundtracks. Notably, the five soundtracks with the most weeks at No. 1 are all from animated films. The number in each header is the number of weeks the album has spent at No. 1. They are listed in ascending order.", "date_str": "2026-11-03T15:30:00+00:00", "hash": "484ce893175239ba", "title_fa": "«KPop Demon Hunters» رکورد بیشترین هفته‌ها را در رتبه اول جدول موسیقی متن بیلبورد افزایش داد: فهرست کامل", "summary_fa": "KPop Demon Hunters در چارت موسیقی متن بیلبورد شکست خورده است و 67 هفته در رتبه اول قرار گرفته است - یک رکورد جدید و تمام دوران. بنابراین، ما فکر کردیم که زمان خوبی است که به 12 موسیقی متنی که به مدت 25 هفته یا بیشتر در جدول پیشرو بوده اند نگاه کنیم. این نمودار کمی بیش از 25 سال پیش - در 30 ژوئن 2001 - معرفی شد که به این معنی است که فهرست موسیقی‌های متن ما با بیشترین هفته در رتبه اول. 1 شامل موسیقی متن‌های پرفروش دوره‌های قبلی، مانند داستان وست ساید، صدای موسیقی، دکتر ژیواگو، تب شنبه شب و باران بنفش نیست. در واقع، شامل یکی - موسیقی متن فیلم تلویزیونی 1965 Vince Guaraldi Trio، A Charlie Brown Christmas - است، اما فقط به دلیل موفقیت در نمودار از سال 2001. KPop Demon Hunters رتبه اول را کسب کرده است. 1 برای همه به جز چهار هفته از 71 هفته‌اش در Top Soundtracks، که هر یک به مدت یک هفته به Wicked: For Good، کریسمس چند ساله تعطیلات A Charlie Brown Christmas، Charli xcx's Wuthering Heights و موسیقی متن فیلم کوتاه‌ترین سریال تلویزیونی امسال، Heated Rivalry، پرداخته است. طلایی مرتبط از KPop Demon Hunters برنده بهترین آهنگ اصلی در اسکار 2026 شد، اما Speech Is Cut Short در اینجا 12 موسیقی متن فیلم که بیشترین هفته ها را در رتبه اول ثبت کرده اند آورده شده است. از زمان معرفی نمودار در 30 ژوئن 2001، رتبه 1 در جدول موسیقی متن بیلبورد. این فهرست شامل دو موسیقی متن تلویزیون و 10 موسیقی متن فیلم است. قابل ذکر است، پنج موسیقی متن با بیشترین هفته در رتبه 1، همه از فیلم های انیمیشن هستند. تعداد در هر هدر تعداد هفته هایی است که آلبوم در شماره 1 سپری کرده است. آنها به ترتیب صعودی فهرست", "image_url": "https://www.billboard.com/wp-content/uploads/2025/08/02-kpop-demon-hunters-cr-netflix-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۲ آبان • ۱۹:۰۰"}, {"source": "Billboard", "title": "BTS’ Comeback Drives HYBE’s Quarterly Earnings to All-Time Highs", "link": "https://www.billboard.com/pro/hybe-q3-earnings-2026-bts-katseye/", "summary": "BTS ’ continuing world tour has delivered HYBE its best earnings report in the company s history, with the company reporting 1.52757 trillion Korean won ($1.135 billion) in revenue and 188.5 billion Korean won ($140.35 million) in operating profit for the third quarter of 2026. Revenue from recorded music, concerts, appearances and advertisements for HYBE’s artists accounted for 70% of this quarter’s revenue, totaling 1.0743 billion Korean won ($801.36 million). Indirect artist activities, which include merchandise, licensing, fan club memberships and content, had been 750.4 billion Korean won ($559.1 million). Related Q3 Music Earnings Roundup: Here s What Every Company Made (Updating) Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Revenue from recorded music generated 282.8 billion Korean won ($210.67 million) this quarter, while touring generated 726.8 billion Korean won ($541.7 million). On Aug. 14, KATSEYE released their third EP, WILD , which topped the Billboard 200 and earned 170,000 equivalent album units in its first week. Touring revenue was largely driven by BTS’ European and North American tour dates, with HYBE artists ENHYPHEN , LE SSERAFIM , TEAM , KATSEYE and CORTIS also all out on the road. KATSEYE performed 31 sold out shows, according to HYBE’s earnings report, with  را تولید کرد و ترانه عنوان آن هفت هفته در رتبه اول ماند. 1 در Billboard Hot 100 . این آهنگ از آن زمان تاکنون بیش از 720 میلیون استریم در Spotify داشته است. این آهنگ همچنین در فهرست 100 بهترین آهنگ سال 1982 رولینگ استون که توسط راب شفیلد گردآوری شده بود، مورد توجه قرار گرفت. شفیلد در مورد تأثیر ماندگار جت نوشت: «پس از", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/joan-jett-beer.jpg?w=1534&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۲ آبان • ۱۹:۱۸"}, {"source": "Rolling Stone", "title": "Mick Jagger Praises Sam Fender’s Rolling Stones Cover", "link": "https://www.rollingstone.com/music/music-news/mick-jagger-sam-fender-you-cant-always-get-what-you-want-1235651718/", "summary": "Cover of \"You Can't Always Get What You Want\" features in U.K. Christmas advertisement", "date_str": "2026-11-03T15:22:04+00:00", "hash": "9fb275867e533457", "title_fa": "میک جگر جلد رولینگ استونز سام فندر را می ستاید", "summary_fa": "جلد ویژگی‌های «همیشه نمی‌توانی آنچه را که می‌خواهی به دست بیاوری» در تبلیغات کریسمس بریتانیا گاهی اوقات، میک جگر رضایت‌بخش شناخته می‌شود. اخیراً، زمانی که برای اولین بار به جلد سام فندر از رولینگ استونز گوش کرد، این احساس را داشت. جگر در بیانیه‌ای گفت: من از طرفداران کارهای سم هستم، بنابراین از شنیدن اینکه او یکی از آهنگ‌های من را کاور می‌کند خوشحال شدم. من فکر می کنم او کار بزرگی با آن انجام داده است. اجرای Fender s، ضبط شده برای بریتانیا. آگهی کریسمس خرده‌فروش، فقط نصف نسخه اصلی پخش می‌شود، اما تمام نشانه‌های درست را به نمایش می‌گذارد: احساساتی بودن که با یک بخش بوق و یک گروه کر کامل همراه است، دمدمی‌انگاری که همراه با پذیرش حقایق سخت است، و لحن در صدای او که هم احساس ناامیدی و هم پذیرش را نشان می‌دهد که همراه با مصالحه کردن نیازهای قدیمی است برادر کوک کورش را دزدید. اکنون او در حال بازسازی زندگی خود است - و برای بازگشت توپ می‌زند اندی گارسیا، دیوید فاستر، پل آنکا، افتخارات مرکز کندی، بله، مت دیمون و دیوید لترمن بازیگران پس‌زمینه اولین فصل فصل «عصر طلایی» بودند. جو اتکینسون و دین تامپس . مک فارلین می‌گوید: «من برای همیشه بازیگر خواهم بود»، مک فارلین می‌گوید، در یک تلویزیون سنتی، مشارکت او توسط تهیه‌کنندگان انجام می‌شد. او می‌گوید امسال، \"صدایی که می‌توانیم از آن استفاده کنیم، صدای من است. من بدون اسکریپت می‌روم، بدون تله پرومتر، فقط به مردم می‌گویم چه اتفاقی دارد می‌افتد.\" ده ها روزنامه نگار مستقل نیز همین کار را خواهند کرد. پوشش گزارش‌های خبری در شب انتخابات مدت‌هاست که تحت سلطه رسانه‌های خبری تلویزیونی بزرگ کشور بوده است. با این حال، امسال روزنامه‌نگاران مستقل و کارشناسان غیرسنتی به‌اصطلاح «خالق‌ها» سهم خود را از مخاطبان می‌خواهند. علاوه بر استریم MeidasTouch، که مک فارلین به همراه کیتی فانگ، مجری سابق MSNBC را به نمایش می‌گذارد، چاک تاد، مرشد سیاسی سابق NBC News با همکارش کریس سیلیزا در یک استریم زنده که آن‌ها آن را «The Projection» می‌نامند، حضور خواهند داشت. این در سراسر YouTube، X، Substack، پورتال Decision Desk HQ's Votes و Noosphere، یکی از بسیاری از پلتفرم‌های اشتراک", "image_url": "https://variety.com/wp-content/uploads/2019/10/election-politics-media-placeholder.jpg?w=1000&#038;h=562&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۱۲ آبان • ۱۸:۵۰"}, {"source": "Billboard", "title": "What’s at Stake in the Dismissal of Wixen’s Lawsuit Against Meta — And Why It Refiled Its Complaint (Guest Column)", "link": "https://www.billboard.com/pro/wixen-music-meta-copyright-lawsuit-whats-at-stake/", "summary": "Our songwriting clients write the music that soundtracks many of Meta s Instagram and Facebook Reels. Meta licensed our clients music for seven years, from 2018 until 2025. Then it decided it would pay only a small fraction of what it had been paying for the same music. We said no. Meta kept using the music anyway. No license and no payment. It also started pulling our clients songs down while they were still under license, then told songwriters and their managers that we were the ones who took them down. That s why we filed suit , and it s why so much of our clients music is no longer up on Meta s platforms. Related Music Publisher Wixen Sues Meta, Says It Plans To Replace Human Songwriters With AI Music Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Nobody wanted that outcome, least of all songwriters whose fans live on Instagram. But to us, Meta s message was clear: It does not value the music that helped build its platforms. We do. Meta s first move in court: try to get the case thrown out before anyone has to answer for anything. Earlier this month, the judge ruled on that motion, and the headlines said he tossed our suit. He didn t. Here s what actually happened. Meta s motion never claimed it had a license. It never claimed it wasn t using the songs. It argued about whose name is on the paperwork, and on that, the judge asked us to spell out, song by song, whether Wixen owns each work or is its exclusive licensee, and which rights we hold. That s a pleading exercise. We did the same thing in our earlier 2020 case against Triller. That case went forward, and the judge cited it in his order. He gave us two weeks to refile, and we did. Our claims over Meta pulling songs down mid-license and blaming us for it were left alone. The trial date is still on the calendar. Discovery is underway, and we expect it to turn up even more of our clients music used without a license. Under a much-criticized Ninth Circuit rule from prior copyright infringement cases — a rule which now covers California — a publishing administrator must exclusively control 100% of a song to bring a claim. This is out of step with every other court that has looked at the question. We conceded that prior ruling in our briefs and kept those partially controlled songs in the case so we can take it up on appeal. Related Supreme Court Won t Overturn Landmark Music Copyright Termination", "date_str": "2026-11-03T15:00:00+00:00", "hash": "262bda1d46a3e32a", "title_fa": "چه چ lor-death-triplet-act-taylor-red-dies-obituary-1236372873/", "summary": "Nika and Natalie Taylor are mourning the passing of their triplet sister and the lead singer of their country trio Taylor Red, Nicole Taylor. The sisters announced Nicole s passing in a TikTok video posted on Monday (Nov. 2), with Nika revealing, We’re heartbroken to announce the passing of our sister Nicole Taylor. We honestly thought she’d be healed here on earth, but now she’s healed in heaven.” Related Justin Timberlake to Release 4-Part Docuseries That Includes Janet Jackson as a Guest Gone But Not Forgotten: Musicians We Lost in 2026 Bruce Springsteen Backs Michigan s Dr. Abdul El-Sayed for U.S. Senate Amid Haley Stevens Reversal: He s a Fighter The sisters said that Nicole died at age 35 after being diagnosed with stage three breast cancer. in 2022. “It was an aggressive type. In her words, when she first found out, was ‘God’s Gonna use this for his glory,’ ” Natalie added. “She thought it fearlessly and she said, ‘We’re not going to live in dread during all of this, Nika said. And she even did CrossFit while she was with her chemo treatments. She responded well to treatments and she was declared evidence without disease.” The sisters said that after the diagnosis — and the subsequent news that the disease had advanced to a more serious stage four — their sister tried to remain hopeful and spent her time traveling, living life and having fun. She said she had so much peace and we re really thankful for that, Nika said of their sister s final days. We are still shocked and didn t think this would happen, but we know she s not suffering anymore we have God s promise of ultimate healing. On a page dedicated to Nicole , the family announced that a private funeral service has already been held and that anyone who wants to make a donation in the singer s honor can click here to see a list of her favorite charities. The Mississippi-bred identical triplets released their debut album, Red Roots ,  بقا تبدیل می‌شود. این فیلم توسط کرت ویمر («زنبوردار 1 2»، «شهروند مطیع قانون»، «نقطه شکست»)، جیب پولهموس («مکانیک»، «لارا کرافت: مهاجم مقبره»، «مصرف‌ها 2»)، «هنا لیدر» («مری»، «فرودیس توس»، و لاس‌پاست ساخته شده است. داگرهارت («لوتوس سیاه»، «کایوتس»)، که فیلمنامه را نیز نوشته است («Expend4bles»، «Black Lotus»).", "image_url": "https://variety.com/wp-content/uploads/2026/11/Olga-and-Alex.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۲ آبان • ۱۸:۳۰"}, {"source": "Variety", "title": "WWE, Disney Team for ‘Avengers: Doomsday’-Themed Worlds Collide, John Cena Classic", "link": "https://variety.com/2026/tv/news/wwe-disney-avengers-doomsday-worlds-collide-john-cena-1236938410/", "summary": "WWE and The Walt Disney Company are teaming for an Avengers -themed collaboration. Expanding on WWE s existing relationship with ESPN, WWE will take over the ESPN Wide World of Sports Complex at the Walt Disney World Resort for two days this December. The takeover will kick off with the John Cena Classic on Dec. 14, followed [ ]", "date_str": "2026-11-03T14:44:56+00:00", "hash": "4cd7539d24499694", "title_fa": "دبلیو دبلیو دبلیو ای، تیم دیزنی برای فیلم «انتقام‌جویان: روز قیامت» با مضمون برخورد جهان‌ها، جان سینا کلاسیک", "summary_fa": "دبلیو دبلیو دبلیو ای و کمپانی والت دیزنی برای همکاری با موضوع انتقام جویان با یکدیگر همکاری می کنند. با گسترش روابط موجود WWE با ESPN، WWE مجموعه ورزشی ESPN Wide World of Sports در استراحتگاه جهانی Walt Disney را به مدت دو روز در دسامبر امسال در اختیار خواهد گرفت. این تصاحب با John Cena Classic در 14 دسامبر آغاز خواهد شد، و به دنبال آن [ ] همانطور که قبلا اعلام شده بود، John Cena Classic ستاره هایی از سراسر WWE را به نمایش می گذارد و کودی رودز قبلاً در آن شرکت خواهد کرد. اعضای کلاب دبلیو دبلیو دبلیو دبلیو ای، برنامه عضویت طرفداران دبلیو دبلیو دبلیو دبلیو ای، سپس می توانند در زمان واقعی به سوپراستار مورد علاقه خود در شب رای دهند، که قهرمانی کلاسیک جان سینا به او اهدا خواهد شد. این رویداد به صورت زنده //rezjalibd.github.io/daily-news/archive/2026-09-13.html"}, {"date_key": "2026-09-12", "p_date": "۲۱ شهریور ۱۴۰۵", "g_date": "۱۲ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-12.html"}, {"date_key": "2026-09-11", "p_date": "۲۰ شهریور ۱۴۰۵", "g_date": "۱۱ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
