 از عبور غیرقانونی از ایالات متحده، شهروند ایالات متحده شد. میچل می گوید که باید کارهایی انجام دهد. در 4 نوامبر، سه روز قبل از تولد 83 سالگی اش، این افسانه NEWS را منتشر می کند، مجموعه ای از 23 نقاشی که به چرخه اخبار 24 ساعته می پردازد. نقاش مادام العمر، میچل این پروژه را خودش طراحی، اجرا و طراحی کرد که شامل اشعار آهنگ، تصاویر و شعارهاست. در پشت جلد نیوز آمده است: اخیراً از موسیقی بازنشسته شدم تا اولین عشقم یعنی نقاشی را دنبال کنم. زمانی که [جرج] بوش رئیس جمهور بود و برج های دوقلو در نیویورک مورد حمله قرار گرفتند، من یک سری نقاشی سیاسی کشیدم. در شرایط کنونی احساس کردم که باید نگرانی خود را بیان کنم. این وظیفه یک هنرمند است که صحبت کند. میچل افزود: پیکاسو گرنیکا را برای اعتراض به جنگ داخلی اسپانیا ایجاد کرد. فیلم دیکتاتور بزرگ چارلی چاپلین هیتلر را به سخره گرفت. کمدی مل بروکس The Producers نیز با Springtime برای هیتلر به آن مرد دیوانه پرداخت. NEWS آهنگ اعتراض من است - آهنگی نه برای گوش، بلکه برای چشم. امیدوارم از صحت آن ناراحت نشوید. این خبر جعلی نیست! NEWS در نسخه استاندارد و همچنین 500 نسخه با شماره دستی و امضا شده از طریق وب سایت میچل و انتشارات جولین"}, {"source": "Rolling Stone", "title": "Grammy Family Feuds: Six Times Relatives Competed for the Same Award", "link": "https://www.rollingstone.com/music/music-features/grammys-family-members-compete-1235639846/", "summary": "Siblings Audrey Hobert and Malcolm Todd may wind up duking it out for Best New Artist this year, but it wouldn't be the first time family members went head to head", "date_str": "2026-10-15T12:56:15+00:00", "hash": "9cf8e0d60ab9361a", "title_fa": "دشمنی های خانواده گرمی: شش بار خویشاوندان برای دریافت همان جایزه رقابت کردند", "summary_fa": "خواهر و برادر آدری هوبرت و مالکوم تاد ممکن است امسال جایزه بهترین هنرمند جدید را به پایان برسانند، اما این اولین باری نیست که اعضای خانواده دست به دست می‌شوند. 16.، با در نظر گرفتن تاریخ دشوار رای دهندگان - به یاد می آورید زمانی که بانی رایت فوق العاده زیر رادار، درست مثل آن، برنده ترانه سال در سال 2023 نسبت به آهنگ های بیانسه Break My Soul و تیلور سویفت 10 دقیقه ای خیلی خوب شد؟ اما یک سناریوی قوی وجود دارد که اگر آدری هوبرت، ترانه سرای پاپ و مالکوم تاد، خواننده R B، هر دو نامزد شوند، امسال شاهد چیزی تاریخی در بخش بهترین هنرمند جدید خواهیم بود. آنها با لیبل های مختلف قرارداد بسته اند و طرفداران بسیار متفاوتی دارند، اما آنها برادر و خواهر هستند. و اگر آنها دوباره نامزد شوند، این اولین بار در تاریخ گرمی خواهد بود که دو خواهر و برادر در آن بخش با یکدیگر روبرو می شوند. تاد اخیراً به هالیوود ریپورتر گفت: «من فقط اینطور بودم که «این دیوانه است، فقط این واقعیت که هر دو می‌توانیم یکی از والدینمان را ببریم و همه می‌توانیم برویم و والدینمان می‌توانند همزمان بروند». \"من قبلاً به مادرم قول داده بودم، بنابراین بسیار عالی است اگر او بتواند بابا را بیاورد.\" دیو گرول ممکن است دخترش ویولت را بیاورد، و این احتمال وجود دارد که هر دوی آنها جایزه گرمی را به خانه بیاورند، زیرا فو فایترز اسباب بازی مورد علاقه شما را کنار گذاشت و گرول جوانتر اولین LP خود را با نام Be Sweet to Me منتشر کرد. (از اینکه آنها را در یک دسته قرار دهیم بسیار شگفت زده خواهیم شد، اما هر چیزی ممکن است.)"}, {"source": "Rolling Stone", "title": "Joe Bonamassa on Making His All-Star B.B. King Tribute Album: ‘It Was a Selfish Mission’", "link": "https://www.rollingstone.com/music/music-features/joe-bonamassa-interview-bb-king-blues-summit-1235642552/", "summary": "The blues guitarist assembled all-stars from Slash to Susan Tedeschi for his B.B. King’s Blues Summit 100 album", "date_str": "2026-10-15T12:50:33+00:00", "hash": "35449d3fad4da497", "title_fa": "جو بوناماسا در مورد ساخت آلبوم ادای احترام بی بی کینگش: \"این یک ماموریت خودخواهانه بود\"", "summary_fa": "این گیتاریست بلوز برای آلبوم B.B. King's Blues Summit 100 ستاره‌هایی را از اسلش گرفته تا سوزان تدسکی مونتاژ کرد. اما بدون B.B. King، حرفه این 49 ساله ممکن است آنقدر که برای شروع به کار نیاز داشت، دریافت نکرده باشد. در 12 سالگی، بوناماسا برای کینگ در روچستر، نیویورک افتتاح شد و در همان سال دو بار با اسطوره بلوز بازی کرد. این دو در تماس بودند و کینگ تبدیل به یک مربی قابل اعتماد برای Bonamassa شد. Bonamassa رابطه آنها را در سالهای پس از مرگ کینگ در سال 2015 ادامه داد و در اکتبر 2024، او شروع به آماده سازی برای جشن تولد 100 سالگی کینگ کرد، در آن زمان فقط 11 ماه دیگر. در ژانویه 2025، بوناماسا با جاش اسمیت و گروهی از نوازندگان، عمدتاً از گروه تور او، به نیروهای خود پیوست و به Sunset Sound در لس آنجلس رفت. در آنجا، آنها نزدیک به دوجین آهنگ کینگ را قطع کردند، و فهرست آرزوهای هنرمندان مهمانی را که برای آلبوم استخدام خواهند کرد، تهیه کردند. آمار نهایی که به 50 شرکت کننده رسید شامل اریک کلاپتون، چاکا خان، مایکل مک دونالد، گری کلارک جونیور، مارکوس کینگ، بادی گای، کریستون کینگ فیش اینگرام، سوزان تدسکی، درک تراکس و اسلش بود. Bonamassa قصد داشت اولین دسته از آهنگ ها را در سپتامبر منتشر کند. 16، 2025، در صدمین سالگرد تولد کینگ؛ KTBA Records مجموعه کاملی را با عنوان B.B. King’s Blues Summit 100 در 6 فوریه 2026 منتشر کرد. او چندین بار در حمایت از مجموعه ظاهر شد، از جمله در آگوست گذشته در یک رویداد موزه گرمی در لس آنجلس، جایی که Shemekia Copeland و Kingfish Ingramrating به او پیوستند."}, {"source": "Rolling Stone", "title": "Blondie Announce New Album ‘High Noon,’ Clem Burke’s Final Recording", "link": "https://www.rollingstone.com/music/music-news/blonde-new-album-high-noon-clem-burke-final-recording-1235642952/", "summary": "“This album is classic Blondie — an amalgamation of all our different influences and eras into something new,” Debbie Harry said", "date_str": "2026-10-15T12:04:46+00:00", "hash": "8f7cb66d89bbd379", "title_fa": "Blondie آلبوم جدید \"High Noon\" آخرین ضبط کلم برک را اعلام کرد", "summary_fa": "دبی هری گفت: «این آلبوم بلوندی کلاسیک است - تلفیقی از همه تأثیرات و دوره‌های مختلف ما به چیزی جدید.» پس از نه سال، بلوندی با اولین مجموعه موسیقی جدید خود بازگشته است. آلبوم آنها، High Noon، در 26 فوریه رونمایی خواهد شد، و اولین تک آهنگ LP، Spectral Eyes، اکنون منتشر شده است. LP آتی آخرین ضبط درامر از بنیانگذار Blondie، کلم برک است که در آوریل 2025 در سن 70 سالگی درگذشت. نوازنده تالار مشاهیر ستون فقرات آهنگ‌های بی‌نظیر بلوندی و اجراهای زنده جنبشی بود. دبی هری، رهبر گروه در بیانیه‌ای گفت: «این آلبوم «بلوندی» کلاسیک است - تلفیقی از همه تأثیرات و دوره‌های مختلف ما به چیزی جدید. این موسیقی در زمان حال به نظر می رسد که بر اساس اینکه ما چه کسی هستیم و چگونه زندگی می کنیم شکل گرفته است. گروه High Noon را ترکیبی وسیع از صداها، ایده ها و همکاران توصیف می کند که در آن راک اند رول و پانک در کنار موسیقی رقص و ریتم های لاتین قرار دارند. پروژه جدید شامل مشارکت های جانی مار، گلن ماتلاک، زک کاندون از بیروت، جس ولف و هالی لسیگ از لوسیوس و دیگران است. تک‌آهنگ اصلی آلبوم، چشم‌های طیفی، توسط مار نوشته شده است که گیتار را نیز در این آهنگ می‌نویسد. Blondie جلسات LP را در سال 2022 آغاز کرد و در شهر نیویورک با تهیه کننده John Congleton ضبط کرد که در Pollinator در سال 2017 با گروه همکاری کرد. دیوید رنچ بعداً برای تولید بیشتر و میکس آلبوم جدید به آن پیوست. High Noon شامل 13 آهنگ است و شامل Heartbreak Kid است که توسط کریس استین گیتاریست Blondie نوشته شده است. راه رفتن در خواب، نوشته Matlock; و مردی که صورت نداشت، نوشته مشترک استین و هری. گروه همچنین Little Metal Drummer را که در اصل توسط کیبوردیست"}, {"source": "Rolling Stone", "title": "Aaron Paul Remembers Last Time He Saw ‘Breaking Bad’ Co-Star RJ Mitte: ‘I Kept Calling You Superman’", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/aaron-paul-breaking-bad-rj-mitte-tribute-1235642999/", "summary": "Mitte, the actor who played Walter White Jr. on Breaking Bad , died by suicide on Monday", "date_str": "2026-10-15T01:30:54+00:00", "hash": "4001d2e1f3cac838", "title_fa": "آرون پل آخرین باری را که همبازی اش در سریال Breaking Bad، RJ Mitte را دید، به یاد می آورد: «من همچنان تو را سوپرمن صدا می کردم»", "summary_fa": "میت، بازیگر نقش والتر وایت جونیور در سریال Breaking Bad، روز دوشنبه بر اثر خودکشی درگذشت. مرگ بازیگر و مدافع حقوق معلولیت، RJ Mitte با موجی از غم و اندوه از سوی همبازی هایش در Breaking Bad مواجه شد که خاطراتی از Mitte پس از این تراژدی به اشتراک گذاشتند. میته که بیشتر به خاطر بازی در نقش والتر وایت جونیور در سریال برنده امی شناخته شد، روز دوشنبه در براونزویل تگزاس در سن 34 سالگی درگذشت. نماینده میته تایید کرد که علت خودکشی بوده است. در ادای احترامی از آرون پل، بازیگر نقش جسی پینکمن در سریال، این بازیگر میته را الهام بخش بسیاری از افراد خواند و آخرین باری را که یکدیگر را دیدند به یاد آورد. خیلی متاسفم که به دوستم صدمه زدی ای کاش می دانستیم، پل در پست خود به اشتراک گذاشته شده در رسانه های اجتماعی نوشت. مدام لبخند بر لب داشتی و تک تک چالش هایی که به تو داده می شد را با این اعتماد به نفس و لطف می پذیرفتی. پل به یاد می آورد که وقتی میته پسر کوچکی بود ملاقات کرده بود و او را تماشا می کرد که به یک مرد جوان زیبا تبدیل می شد که هر چالشی را به طور جدی انجام می داد. او ادامه داد، آخرین باری که همدیگر را دیدیم، مدام تو را سوپرمن صدا می کردم. تو منو یاد اون انداختی تو مرا به یاد او انداختی زیرا همیشه با مهربانی و قدرت رهبری می کردی. کور کننده بود. شما در دنیایی با چالش ها متولد شده اید، اما هرگز اجازه نمی دهید هیچ یک از آن ها مانعی برای شما ایجاد کند. میت، که در سه سالگی فلج مغزی خفیف تشخیص داده شد، برای بازی خود در نقش والت جونیور نقدهای مثبتی دریافت کرد. میته در طول اجرای مشهور سریال بین"}, {"source": "Rolling Stone", "title": "Drakeo the Ruler’s Mom Settles With Live Nation Over Rapper’s Killing at Music Festival", "link": "https://www.rollingstone.com/music/music-news/drakeo-the-ruler-mom-settles-live-nation-wrongful-death-1235642809/", "summary": "Darrylene Corniel settled her wrongful death lawsuit against the concert company, but claims brought by the rapper's son and brother remain set for trial next month", "date_str": "2026-10-15T00:26:23+00:00", "hash": "69ef05de13f5c483", "title_fa": "مادر دراکئو حاکم با Live Nation به خاطر قتل رپر در جشنواره موسیقی به توافق رسید", "summary_fa": "دارلین کورنیل شکایت مرگ نادرست خود علیه شرکت کنسرت را حل و فصل کرد، اما ادعاهای مطرح شده توسط پسر و برادر رپر همچنان برای محاکمه در ماه آینده آماده می‌شود. شرایط توافق در اخطاریه ای که به دادگاه ارسال شده است فاش نشده است، اما توافقنامه مشروط توصیف شده است، با اخراج مشروط به \"تکمیل رضایت بخش شرایط مشخص شده که ظرف 45 روز انجام شود.\" این زبان نشان می دهد که این معامله شامل تعهداتی است که هنوز انجام نشده است، به طور بالقوه از جمله پرداخت مالی. وکلای هر دو طرف به درخواست های رولینگ استون برای اظهار نظر پاسخ ندادند. دارلین کورنیل، که مدیر دارایی پسرش است، با این ادعا که پسرش «به دست یک گروه خشن که اجازه ورود به منطقه ای محافظت شده و امن در پشت صحنه جشنواره موسیقی را داشتند، مرده است» شکایت کرد. دیگر شرکت‌های دخیل در حل و فصل او عبارتند از C3 Presents، Contemporary Services Corporation، Black Tide Events، Bobby Dee Presents و Hollywood Elite Security. مقامات قبلاً گفته بودند که دراکئو که نام قانونی او دارل کالدول بود، مدتی قبل از اجرای برنامه در جشنواره در 18 دسامبر 2021 توسط یک مهاجم ناشناس از ناحیه گردن مورد اصابت چاقو قرار گرفت. او با برادر کوچکترش، دوانت کالدول، خواننده رپ معروف به رالفی پلاگ، و همچنین یک نگهبان امنیتی شخصی و چندین عضو گروه موسیقی تیم استینک خود در پشت صحنه بود."}, {"source": "Rolling Stone", "title": "Mon Laferte, Francisca Valenzuela, Juanes to Headline Latin Grammys’ In The Mix/Los Producers Event", "link": "https://www.rollingstone.com/music/music-latin/mon-laferte-luis-fonsi-latin-grammys-los-producers-event-1235642578/", "summary": "The night will also include Kinky, CoastCity, Lila Downs, and more, and will honor Latin producer Sebastian Krys", "date_str": "2026-10-14T23:12:46+00:00", "hash": "79951e8314474d3b", "title_fa": "Mon Laferte، Francisca Valenzuela، Juanes سرفصل های گرمی لاتین In The Mix/Los Producers Event", "summary_fa": "این شب همچنین شامل Kinky، CoastCity، Lila Downs و غیره خواهد بود و از تهیه‌کننده لاتین سباستین کریس تقدیر می‌شود. آکادمی ضبط لاتین اعلام کرده است که In The Mix از حلقه تولیدکنندگان و مهندسان و گالای مشهور سباستین کریس را برای تهیه‌کنندگان لوس گرد هم می‌آورد تا یک شب فوق‌العاده را ایجاد کند که از حرفه‌ای‌های موسیقی لاتین تقدیر می‌کند. این شب شامل اجراها و حضور ستارگان زیادی از جمله Mon Laferte، Francisca Valenzuela، Fonseca، Yami Safdie، Lila Downs، Arath Herce، Kinky، Juanes و غیره خواهد بود. این رویداد که توسط BMI حمایت می شود، در 11 نوامبر در لاس وگاس به عنوان بخشی از برنامه رسمی هفته گرمی لاتین برگزار می شود. این فیلم توسط Krys، تهیه‌کننده قدیمی لاتین که چندین سال متوالی گالای Los Producers را به یکی از اصلی‌ترین رویدادها تبدیل کرده، تولید خواهد شد. مانند Los Producers در گذشته، این رویداد رسمی به نفع بنیاد مایکل جی فاکس برای تحقیقات پارکینسون خواهد بود که به پیشرفت تحقیقات در جهت درمان بیماری پارکینسون اختصاص دارد. کریس در سال 2019 به این بیماری مبتلا شد و رسالت خود را گسترش آگاهی قرار داده است. لوس پرودوچرز یکی از بزرگترین موهبت های زندگی من بوده است. این یکی از آن ابتکاراتی است که همه واقعاً برنده می شوند. مایکل جی. کریس در بیانیه‌ای گفت: بنیاد فاکس بیش از 3 میلیارد دلار برای پیشبرد تحقیقات پارکینسون و مبارزه با این بیماری سرمایه‌گذاری کرده است، و این راه ما برای کمک کوچکی از گوشه جهان است.» در طول این رویداد، کریس افتخار ویژه‌ای را دریافت خواهد کرد که کمک‌های خود در موسیقی لاتین را دریافت می‌کند. او با هنرمندانی مانند شکیرا، الویس کاستلو، ژوانز، مارتینا، سازنده سانتا سیکل و ریکس کار کرده است. داستان‌های پرطرفدار آرون پل آخرین باری را که همبازی‌اش در سریال «Breaking Bad» دیده بود، آر جی"}, {"source": "Rolling Stone", "title": "Chance the Rapper Wins Lingering Legal Fight With Ex-Manager: ‘Owed Him Loyalty’", "link": "https://www.rollingstone.com/music/music-news/chance-the-rapper-legal-fight-manager-pat-corcoran-1235642805/", "summary": "“I’m grateful to finally close this chapter of my life,\" the artist says in a statement", "date_str": "2026-10-14T22:27:15+00:00", "hash": "74f339b6a64d6d29", "title_fa": "شانس برنده شدن رپر در دعوای حقوقی طولانی مدت با مدیر سابق: \"به او وفاداری مدیونم\"", "summary_fa": "این هنرمند در بیانیه‌ای می‌گوید: «از اینکه بالاخره این فصل از زندگی‌ام را بسته‌ام، سپاسگزارم.» پس از اینکه شانس رپر در دادگاهی در ماه مارس علیه مدیر سابقش بر سر ادعای قرارداد و مداخله پیروز شد، یک قاضی شیکاگو پیروزی دیگری برای هنرمند به ارمغان آورد و به مدیر سابق دستور داد غرامتی را که می‌تواند بیش از 1.5 میلیون دلار باشد، از دست بدهد. این حکم باقیمانده ادعای نقض امانتداری را که به دادگاه واگذار شده بود، نه هیئت منصفه، حل می کند. هنرمندی که نام قانونی او صدراعظم بنت است، در بیانیه‌ای که با رولینگ استون به اشتراک گذاشته شد، گفت: «از اینکه سرانجام این فصل از زندگی‌ام را بسته‌ام سپاسگزارم و نمی‌توانم صبر کنم تا در نهایت جنبه داستانی خود را بگویم. من از دادگاه‌ها و مهم‌تر از آن از خدا به خاطر وفاداری خود سپاس‌گزارم. در حکم ۲۸ صفحه‌ای جدید دادگاه کانتی جیمز استووکیل که توسط رولینگ استوکوک به دست آمده است. جونیور گفت که مدیر سابق، پت کورکوران، باید برخی از کمیسیون های پرداخت شده توسط فروشنده را تسلیم کند و 15 درصد غرامت مدیریتی خود را که به معاملات تجاری مرتبط است، از دست بدهد. قاضی گفت، این حکم بر اساس شواهد ارائه شده در محاکمه هیئت منصفه و روند پیگیری در ماه مه، دوره ای را در بر می گیرد که طی آن کورکوران بیش از 10 میلیون دلار از مدیریت موسیقی، تور و تجارت تجاری خواننده رپ به دست آورده است. کورکوران وظیفه خود را زیر پا گذاشت. قاضی نوشت: شرکت تجاری او به دستور خود بنت از فروشندگان خود بنت پورسانت دریافت می کرد که این یک سود مخفی است. او کالاها و خدماتی را با پول بنت خرید، با فروشندگان به نام بنت معامله کرد و موقعیت بنت را وارد مذاکره با افرادی کرد که بنت هرگز ملاقات نکرده بود."}, {"source": "Hollywood Reporter", "title": "Iranian Drama ‘Midday Meal’ Wins Busan Film Festival’s Top Prize, Qualifying for Oscar Consideration", "link": "https://www.hollywoodreporter.com/movies/movie-news/midday-meal-iran-movie-busan-award-qualifies-oscars-1236730784/", "summary": "'Midday Meal' director Majid Majidi dedicated the award to the people of Iran, while Taiwan’s Lee Yun Chan won best director and Zhou Xun and Kashun Himeno took acting honors at the festival’s closing ceremony.", "date_str": "2026-10-15T13:50:26+00:00", "hash": "9cfd560d57744fd5", "title_fa": "درام ایرانی «غذای نیمروز» برنده جایزه برتر جشنواره فیلم بوسان و واجد شرایط دریافت جایزه اسکار شد.", "summary_fa": "مجید مجیدی کارگردان «غذای نیمروز» این جایزه را به مردم ایران تقدیم کرد، لی یون چان از تایوانی برنده بهترین کارگردانی شد و ژو ژون و کاشون هیمنو در مراسم اختتامیه جشنواره جوایز بازیگری را از آن خود کردند. «غذا ظهر» ساخته مجید مجیدی کارگردان ایرانی، پنج‌شنبه برنده جایزه بهترین فیلم جشنواره بین‌المللی فیلم بوسان شد و این درام تحسین‌برانگیز درباره معلمی است که تلاش می‌کند دانش‌آموزانش را برای رسیدن به بهترین مسابقه بین‌المللی اسکار سیر کند. هیئت منصفه هفت نفره بوسان به رهبری اسطوره فیلمسازی چینی ژانگ ییمو گفت که تصمیم آن به اتفاق آرا بوده است. سر و صدا در مورد فیلم مجیدی در تمام هفته در بوسان در بوسان ایجاد شده بود و بسیاری پیش بینی می کردند - به درستی - که جایزه برتر را به خانه خواهد برد. مجیدی با پذیرش این افتخار در مرکز سینمایی بوسان، پیروزی خود را تقدیم مردم ایران کرد و از بخش‌هایی از سخنرانی خود برای محکوم کردن تلفات غیرنظامیان جنگ تحت رهبری ایالات متحده علیه کشورش استفاده کرد. داستان‌های مرتبط اسکای تجاری ۲.۱ میلیارد دلاری ITV Megadeal: فیلم‌های مداخله‌ای با چشم‌های دولت بریتانیا، بیل کرامر و لینیت هاول تیلور از آکادمی در جشنواره فیلم توکیو شرکت می‌کنند «می‌خواهم این جایزه را به قهرمانان شجاع ایران تقدیم کنم - مردم ایران که در تمام این سال‌ها همچنان در برابر ظلم ایستاده‌اند و همچنان در برابر ظلم ایستاده‌اند و ایستاده‌اند». در همان روز اول این جنگ در ایران، مدرسه ای در میناب مورد اصابت قرار گرفت و 120 دانش آموز بی گناه کشته شدند. او بعداً افزود: «مردم ما چه جنایتی مرتکب شده اند؟» چیزی نیست جز اینکه مردم ما می خواهند مستقل باشند. آنها تا آخر محکم خواهند ماند.»"}, {"source": "Hollywood Reporter", "title": "Amy DeGregorio Promoted to EVP at Hearst Media Production Group (Exclusive)", "link": "https://www.hollywoodreporter.com/tv/tv-news/amy-degregorio-promoted-hearst-media-production-group-hmpg-1236730067/", "summary": "She'll be HMPG president Bryan Curb's right hand.", "date_str": "2026-10-15T13:30:00+00:00", "hash": "7debe8cb851726b3", "title_fa": "امی دگرگوریو در گروه تولید رسانه هرست به EVP ارتقا یافت (انحصاری)", "summary_fa": "به گزارش هالیوود ریپورتر، ایمی دگرگوریو به عنوان معاون اجرایی تازه ایجاد شده، درآمد فروش برای گروه تولید رسانه ای هرست (HMPG) ارتقا یافته است. با این ترفیع، دگرگوریو عملاً شماره دو برایان کرب می شود. کرب، رئیس HMPG، در بیانیه‌ای که با THR به اشتراک گذاشته شده است، گفت: امی کار استثنایی ایجاد شراکت‌های معنادار با برند و ادغام یکپارچه حامیان مالی در برنامه‌نویسی E/I ما انجام داده است. همانطور که HMPG به گسترش خود ادامه می دهد، ما می خواهیم همان تخصص و رویکرد استراتژیک را به کل مجموعه خود بیاوریم و فرصت های جدیدی را برای برندها ایجاد کنیم تا با محتوای برنده جوایز و مخاطبان وفادار ما تعامل داشته باشند. داستان های مرتبط کسب و کار دیزنی سهام خود در A+E را به قیمت 1.2 میلیارد دلار به هرست می فروشد، فرانک بیانکوزو، رئیس گروه تولید رسانه تلویزیونی Hearst، پس از 31 سال در شرکت (انحصاری) بازنشسته می شود. به گفته این شرکت، دگرگوریو به عنوان معاون ارشد از سال 2022، تیم بازاریابی فروش HMPG و ابتکارات جدید توسعه کسب و کار را رهبری کرده و با تبلیغ‌کنندگان، سازمان‌ها و بنیادهای برند ملی همکاری می‌کند. در سمت جدید خود، او به عنوان یکی از اعضای کلیدی تیم رهبری اجرایی HMPG و مشاور استراتژیک رئیس HMPG در زمینه رشد درآمد، تجاری‌سازی و فرصت‌های تجاری جدید، هدایت استراتژی درآمد و نظارت بر فروش و فعالیت‌های حمایت مالی در کل مجموعه شرکت: برنامه‌های تلویزیونی خطی، محتوای برند و دیجیتال بومی، کانال‌های FAST و پلت‌فرم‌های در حال ظهور، خدمت خواهد کرد."}, {"source": "Hollywood Reporter", "title": "Ganni and Lululemon Blur the Lines Between Fashion and Fitness With an ’80s-Inspired Collection", "link": "https://www.hollywoodreporter.com/lifestyle/shopping/ganni-lululemon-collection-80s-activewear-2026-shop-online-1236730802/", "summary": "The 22-piece collection reimagines Lululemon’s performance staples with Ganni’s signature leopard prints, ruffles and a campaign starring Jennifer Beals.", "date_str": "2026-10-15T13:16:46+00:00", "hash": "33b5de43a00b6c85", "title_fa": "گانی و لولولمون خطوط بین مد و تناسب اندام را با مجموعه ای الهام گرفته از دهه 80 محو می کنند", "summary_fa": "این مجموعه 22 قطعه‌ای، پایه‌های اجرایی Lululemon را با طرح‌های پلنگی امضای گانی، رفل‌ها و کمپینی با بازی جنیفر بیلز دوباره به تصویر می‌کشد. اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، هالیوود ریپورتر ممکن است کمیسیون وابسته دریافت کند. شیفتگی صنعت مد به لباس های فعال کم نمی شود. در هر صورت، باشگاه به مکان دیگری برای برچسب های طراحان تبدیل شده است تا عضلات خلاق خود را منعطف کنند. آخرین جفت؟ گانی مورد علاقه مد کپنهاگ و لباس پرفورمنس لولولمون. مجموعه 22 تکه Ganni x Lululemon که در 15 اکتبر عرضه می شود، از 70 تا 280 دلار قیمت دارد و دو فلسفه طراحی متمایز را در کنار هم قرار می دهد: دقت فنی Lululemon و رویکرد بازیگوش و اغلب غیر متعارف گانی برای لباس پوشیدن. داستان‌های مرتبط سبک زندگی Ugg به شیک پوشی خود با مجموعه جدید JW Anderson الهام گرفته از لوفر ادامه می‌دهد. The Everybody Loves Raymond Creator Wants to You One More God نقطه شروع خلاقانه فیلم های رقص دهه 1980 است، اگرچه این مجموعه کمتر به بازسازی یک کمد ایروبیک می پردازد تا بازتفسیر قابل تشخیص ترین عناصر آن. طرح‌های پلنگی، تریم‌های ژولیده و جفت‌های رنگی جسورانه در کنار گرم‌کننده‌های پا، بولرو و هدبند ظاهر می‌شوند، در حالی که ژاکت Define محبوب Lululemon ظاهری کاملاً گانی دارد. لبه‌های حباب‌دار و یقه بزرگ این پیراهن را جالب‌تر از متوسط ​​گرمکن بعد از تمرین شما می‌کند. سیلوئت نرم و شلخته به لباس‌های رقص دهه ۸۰ اشاره می‌کند، در حالی که لبه‌های قابل تنظیم به شما امکان می‌دهند با نسبت‌ها بازی کنید."}, {"source": "Hollywood Reporter", "title": "Sky’s $2.1 Billion ITV Megadeal: U.K. Government Eyes Intervention", "link": "https://www.hollywoodreporter.com/business/business-news/sky-itv-deal-uk-government-eyes-intervention-public-interest-1236730785/", "summary": "Culture secretary Lisa Nandy cites “public interest considerations.”", "date_str": "2026-10-15T13:10:41+00:00", "hash": "2a1270b5c9bd2835", "title_fa": "Megadeal ITV 2.1 میلیارد دلاری Sky: مداخله چشمان دولت بریتانیا", "summary_fa": "لیزا نندی، وزیر فرهنگ، «منافع عمومی» را ذکر می کند. لیزا نندی، وزیر فرهنگ بریتانیا روز پنجشنبه گفت که دولت بریتانیا \"مصور مداخله\" در تصرف برنامه ریزی شده 2.1 میلیارد دلاری شبکه های تلویزیونی ITV و دارایی های پخش جریانی توسط Comcast's Sky است. قرارداد ITV-Sky وعده می دهد که بزرگترین اپراتور تلویزیون پولی بریتانیا را با بزرگترین پخش کننده تجاری رایگان خود گرد هم آورد. دانا استرانگ، مدیر عامل Sky، آن را \"لحظه ای تعیین کننده برای رسانه های بریتانیایی\" خواند. کارولین مک کال، مدیر عامل ITV، آن را ایجاد \"قهرمان بریتانیایی با مقیاس و منابعی برای رقابت بهتر با پلتفرم های پخش جهانی\" معرفی کرد. اما منتقدان درباره قدرت بازار شرکت ادغام شده ابراز نگرانی کرده اند. و اکنون، دولت حزب کارگر در بریتانیا نیز به نگرانی های تمرکز اشاره کرده است. او در جریان حضور در پارلمان لندن، به «ملاحظات منافع عمومی» از جمله «نیاز به بیان آزادانه عقیده در رسانه‌های خبری» و «نیاز به تعدد کافی دیدگاه‌ها در رسانه‌های خبری در هر بازار» اشاره کرد. نندی همچنین «نیاز به در دسترس بودن طیف گسترده‌ای از برنامه‌های پخش، درخواستی یا هر دو» را در سراسر بریتانیا تأکید کرد. ITV موافقت کرد که بازوی رسانه ای و سرگرمی خود را در ماه جولای به مبلغ 1.6 میلیارد پوند به Sky بفروشد. این قرارداد کانال های تلویزیونی زمینی و سرویس پخش ITVX ITV را پوشش می دهد. بازوی تولید ITV Studios به عنوان یک شرکت جداگانه به فعالیت خود ادامه خواهد داد. اسکای توسط مدیر عامل دانا استرانگ رهبری می شود. این شرکت نه تنها در بریتانیا، ایرلند و ایتالیا کسب‌وکارهای تلویزیون پولی و پخش جریانی را اداره می‌کند، بلکه خدمات مخابراتی خود مانند عملیات باند پهن و تلفن همراه را نیز افزایش داده است. Sky همچنین مالک بازوی تولید Sky Studios است که توسط Cécile Frot-Coutaz رهبری می"}, {"source": "Hollywood Reporter", "title": "Jennie to Headline Soundtrack for Netflix’s Upcoming Animated Film ‘Steps’", "link": "https://www.hollywoodreporter.com/music/film-tv-music-news/jennie-soundtrack-netflix-upcoming-animated-film-steps-1236730584/", "summary": "The trailer for the film, which stars Ali Wong, Amanda Seyfried, Stephanie Hsu and Nikki Glaser, was also released Thursday morning.", "date_str": "2026-10-15T13:02:09+00:00", "hash": "6cd5c6f3d88a449a", "title_fa": "جنی به سرفصل موسیقی متن فیلم انیمیشنی آینده نتفلیکس \"Steps\"", "summary_fa": "تریلر این فیلم که علی ونگ، آماندا سیفرید، استفانی هسو و نیکی گلسر در آن ایفای نقش می کنند نیز صبح پنجشنبه منتشر شد. جنی قرار است با آهنگی جدید، تیتر موسیقی متن انیمیشن آینده نتفلیکس Steps باشد. نتفلیکس موسیقی متن فیلم را که به طور کامل توسط جاستین ترانتر، ترانه سرای پرکار نوشته و تهیه شده است، برای انیمیشن ماجراجویی کمدی روز پنجشنبه اعلام کرد. جنی، ستاره جهانی پاپ و عضو بلک پینک، موسیقی متن فیلم را با آهنگ جدیدی به نام Someone to Hold رهبری خواهد کرد. چهار آهنگ اصلی در این آلبوم وجود خواهد داشت، با آوازهای دیگری از نامزد جایزه اسکار، آماندا سیفرید، رز گری و ایمی و آهنگی از کریس باورز. جنی در بیانیه‌ای گفت: من برای پیوستن به خانواده Steps بسیار هیجان‌زده هستم و ساختن اولین آهنگم برای یک فیلم انیمیشن واقعاً جالب بود. من عاشق قلب و شخصیت شخصیت ها هستم و بسیار خوشحالم که بخشی کوچک از دنیای آنها هستم. امیدوارم شما هم مثل من از Steps and Someone to Hold لذت ببرید و بی صبرانه منتظر شنیدنش هستم. داستان های مرتبط کسب و کار مدیران تلویزیون نتفلیکس لیزا لنگ مک مولن، جیمز اوه، کارولینا گارسیا و اندرو مک کوئین در میان اخراجی های تلویزیون نتفلیکس Untold to Tackle Daejon Love (اختصاصی) ترانتر آهنگ جنی را به عنوان آهنگی ناب توصیف می کند، در حالی که آهنگی با رقص پاپ الهام گرفته از آندری رقصی است. به عنوان یک سرود ضعیف توصیف شد. آهنگ گری، Meet Me on the Dance Floor، یک آهنگ شرور پاپ الکترو رقص است. به گفته این ترانه سرا، آهنگ Seyfried Smile and a Song بیشتر یک آهنگ تئاتر موسیقی قدیمی است. Tranter را اضافه می کند، The Story in Steps به زیبایی به انواع صداها و سونیک ها کمک می کند، و خط اصلی در موسیقی متن،"}, {"source": "Hollywood Reporter", "title": "Doja Cat to Debut Doc Short Recorded on Ma Vie World Tour Using Ray-Ban Meta Glasses", "link": "https://www.hollywoodreporter.com/music/music-news/doja-cat-tour-ma-vie-documentary-ray-ban-meta-glasses-1236730529/", "summary": "Directed by Quinn Whitney Wilson, it's a roughly 12-minute short filmed almost entirely on Ray-Ban Meta glasses and shot from the perspective of Doja Cat and members of her crew on the current tour.", "date_str": "2026-10-15T13:00:00+00:00", "hash": "37812526ca0bb281", "title_fa": "Doja Cat برای اولین بار مستند کوتاهی را در تور جهانی Ma Vie با استفاده از عینک های متا Ray-Ban ضبط کرد.", "summary_fa": "این فیلم به کارگردانی کوین ویتنی ویلسون، یک فیلم کوتاه تقریباً 12 دقیقه ای است که تقریباً تماماً با عینک Ray-Ban Meta فیلمبرداری شده و از منظر گربه دوجا و اعضای گروهش در تور فعلی فیلمبرداری شده است. مستندهای تور چیز جدیدی نیستند. اما عکاسی یک - حتی یک عینک کوتاه - روی عینک Ray-Ban Meta راه جدیدی برای انجام آن است. در 23 اکتبر، یک روز پس از روی صحنه رفتن در انجمن کیا در لس آنجلس، Doja Cat تور جهانی Ma Vie را با مشارکت Ray-Ban Meta برگزار خواهد کرد. این یک فیلم کوتاه تقریباً 12 دقیقه ای است که تقریباً به طور کامل با عینک Ray-Ban Meta فیلمبرداری شده است و از دیدگاه گربه دوجا و اعضای گروهش در تور فعلی فیلمبرداری شده است. کارگردانی مشهور کوین ویتنی ویلسون، که پیش از این فیلم مستند ژان میشل باسکیات درباره این هنرمند نمادین، نمایش هایی مانند Ziwe، Your Attention Please و MPower و موزیک ویدیوهای هنرمندانی مانند Lizzo و Baby Ariel را کارگردانی کرده بود. فیلم ضبط‌شده نشان می‌دهد که دوجا نشان می‌دهد که رفتن روی صحنه در تور با تمام نماهایی از پشت صحنه که طرفداران از این نوع مستندهای تور عاشق شده‌اند، مانند انتظار در بال‌ها قبل از زمان نمایش و پشت صحنه با اعضای حلقه درونی‌اش، نشان می‌دهد. اخبار مرتبط اخبار نامزدهای جوایز BET فاش شد: کاردی بی با شش سبک زندگی در گالا هنری+فیلم LACMA با مغول‌ها، رایان کوگلر با لباس گوچی و رایان کوگلر بازتابنده پیشتاز است. تور را از درون، از طریق چشمان Doja و از طریق چشمان تیمی که همه چیز را انجام می دهد، ثبت کنید. ویلسون در بیانیه‌ای که به هالیوود ریپورتر ارائه کرده است، گفت: این یک نگاه صمیمی و بدون فیلتر به Tour Ma Vie است که شما را مستقیماً وارد هرج و مرج، هنر و عشقی"}, {"source": "Hollywood Reporter", "title": "Zendaya to Star in Alex Garland’s New Sci-Fi Movie for A24", "link": "https://www.hollywoodreporter.com/movies/movie-news/zendaya-star-alex-garland-sci-fi-movie-a24-1236730546/", "summary": "The actress has had a busy 2026, with 'Dune: Part Three' waiting in the wings for later this year.", "date_str": "2026-10-15T13:00:00+00:00", "hash": "77bc4555144bc89c", "title_fa": "زندایا در فیلم علمی تخیلی جدید الکس گارلند برای A24 بازی می کند", "summary_fa": "این بازیگر سال 2026 پرمشغله‌ای را پشت سر گذاشته است و «تلماسه: قسمت سوم» در انتظار پایان سال جاری است. متن لوگو زندایا با پایان سال خاطره انگیزش به پروژه جدیدی پیوست. این بازیگر قرار است در یک فیلم علمی تخیلی بدون عنوان بازی کند که فیلمساز الکس گارلند آن را بر اساس فیلمنامه خودش برای A24 کارگردانی خواهد کرد. هنوز جزئیات داستان این ویژگی که قرار است در سال 2027 ساخته شود، اعلام نشده است. این فیلم نشان‌دهنده آخرین همکاری زندایا و A24 پس از سریال موفق او در HBO Euphoria است که A24 را به عنوان تهیه‌کننده به حساب می‌آورد و امسال فیلم The Drama. گارلند سابقه ای طولانی با A24 دارد که شامل Ex Machina، Civil War، Men، Warfare و بازی ویدیویی آینده او Elden Ring است که قرار است در سال 2028 اکران شود. داستان‌های مرتبط فیلم‌ها هیچ‌کس فیلمنامه او را نمی‌خواند، سپس از فیلم‌های رابرت پتینسون تماس گرفت. الیزابت هولمز ناتان فیلدر Doc Sets در بریتانیا تاریخ اکران سال جاری پر از پروژه‌ها و لحظات قابل‌توجهی برای Zendaya است، که با تام هالند همبازی شد در سونیدر پیکچرز جدید Blockbuster. پرفروش ترین فیلم تاریخ باکس آفیس داخلی او و هالند که اخیراً تایید کرده‌اند که به صورت مخفیانه ازدواج کرده‌اند، در فیلم The Odyssey به کارگردانی کریستوفر نولان نیز نقش آفرینی کردند که به پردرآمدترین اکران یونیورسال تبدیل شد و انتظار می‌رود در طول فصل جوایز توجه زیادی را به خود جلب کند. زندایا در کنار رابرت پتینسون در فیلم بهاری درام A24 بازی کرد و به زودی می توان دوباره نقش چانی را در فیلم دنیس ویلنوو در فیلم Dune: Part Three که برادران وارنر در ماه دسامبر به نمایش در می آورد، بازی کرد. علاوه بر این، او امسال برای بازی در نقش Rue در فصل سوم و آخر سریال تحسین شده Euphoria"}, {"source": "Hollywood Reporter", "title": "The Academy’s Bill Kramer and Lynette Howell Taylor to Attend Tokyo Film Festival", "link": "https://www.hollywoodreporter.com/movies/movie-news/ampas-bill-kramer-lynette-howell-taylor-tokyo-film-festival-1236730749/", "summary": "AMPAS is set to have a significant presence at Asia's biggest film event, and will also an event for Academy members.", "date_str": "2026-10-15T10:48:54+00:00", "hash": "c3d9817ccfc83382", "title_fa": "بیل کرامر و لینت هاول تیلور از آکادمی در جشنواره فیلم توکیو شرکت خواهند کرد", "summary_fa": "AMPAS قرار است در بزرگترین رویداد سینمایی آسیا حضور چشمگیری داشته باشد و همچنین رویدادی برای اعضای آکادمی خواهد بود. سه نفر از بازیگران سنگین وزن هالیوود قرار است در میزگردهای سی و نهمین جشنواره بین المللی فیلم توکیو (TIFF) که به سرعت نزدیک می شود، شرکت کنند. بیل کرامر، مدیر عامل آکادمی علوم و هنرهای تصاویر متحرک (AMPAS) و همچنین رئیس آکادمی، لینیت هاول تیلور و مدیرت شی، مدیر ارشد عضویت، تأثیرگذاری و صنعت، برای میزبانی از رویدادها در ژاپن خواهند بود. در 28 اکتبر، کرامر، تیلور و شی در یک میزگرد (جزئیات در زیر) شرکت خواهند کرد و پس از آن جایزه رهبری به کرامر و گردهمایی اعضای آکادمی اهدا خواهد شد. و در اکتبر در 29، کرامر در گفتگو با هیرو ماتسوکا، رئیس و مدیر عامل غول تولید ژاپنی توهو شرکت خواهد کرد. داستان‌های مرتبط فیلم‌های کریستین اسلیتر، ترین دیرهولم، دری همینگوی به Dogma25 بپیوندید وقایع ویژه فیلم‌های صمیمیت 7 مایل بیرون، با بازی لوسی هالیدی، داستانی از سنین بالای غم و اندوه، موسیقی و دوستی را روایت می‌کند و همچنین سه نفر نام‌گذاری شده در بالا، آکادمی آکادمی چندین عضو اجرایی دیگر در جشنواره خواهد داشت. هما، کارگردان و رئیس، موزه آکادمی تصاویر متحرک و مجموعه آکادمی؛ جنی گالانته، مدیر ارشد درآمد و توسعه تجارت؛ و جنیفر دیویدسون، مدیر ارشد بازاریابی، ارتباطات و محتوا. رویدادهایی که سه نفر آکادمی قرار است در آن شرکت کنند عبارتند از: این پانل که برای 28 اکتبر تنظیم می شود، نگاهی از پشت صحنه اسکار و همچنین بینش هایی در مورد ابتکارات جهانی آکادمی و برنامه های عضویت ارائه می دهد. این بحث همچنین دیدگاه آکادمی را در مورد وضعیت فعلی و آینده سینمای بین‌المللی بررسی خواهد کرد. سخنرانان از AMPAS عبارتند از: بیل کرامر، لینیت هاول تیلور و مردیث شی، و تاکئو هیساماتسو، مدیر جشنواره TIFF، مدیریت را بر"}, {"source": "Hollywood Reporter", "title": "Christian Slater, Trine Dyrholm, Dree Hemingway Join Dogma25 Feature ‘Incidents of Intimacy’", "link": "https://www.hollywoodreporter.com/movies/movie-news/christian-slater-trine-dyrholm-join-dogma25-feature-1236730700/", "summary": "Johannes Lilleøre, Julie Agnete Vang, Laura Drasbæk and Michael Moritzen will co-star in the low budget drama, directed by Jesper Just under the strict Dogma \"vow of chastity.\"", "date_str": "2026-10-15T09:38:03+00:00", "hash": "218690e788620f88", "title_fa": "کریستین اسلیتر، ترین دیرهولم، دری همینگوی به فیلم «حوادث صمیمیت» به Dogma25 می‌پیوندند.", "summary_fa": "یوهانس لیلور، جولی آگنته وانگ، لورا دراسبک و مایکل موریتزن در این درام کم‌هزینه به کارگردانی جسپر جاست که تحت عنوان «نذر پاکدامنی» سخت‌گیرانه دگمایی است، همبازی خواهند شد. کریستین اسلیتر (آقای ربات)، دری همینگوی (استارلت) و ستاره دانمارکی ترینین دیرهولم (ملکه قلب ها) برای بازی در فیلم Incidents of Intimacy به کارگردانی جاسپر جاست قرارداد امضا کردند. یوهانس لیلور، جولی اگنته وانگ، لورا دراسبک و مایکل موریتزن در این فیلم به ایفای نقش خواهند پرداخت. این ویژگی کم‌هزینه اولین اولین کارگردانی Just را نشان می‌دهد و دومین مورد از ویژگی‌های جاه‌طلبانه هنری Dogma25 از سازنده Zentropa است. دیرهولم که آثارش شامل برنده جایزه اسکار سوزان بیر در دنیای بهتر، مگنوس فون هورن دختری با سوزن و نیکولای آرسل A Royal Affair است، نقش لیندا، هماهنگ کننده صمیمیت را بازی خواهد کرد که برای ایجاد ارتباطات صمیمی تلاش می کند. او که قادر به تصدیق یا دسترسی به احساسات خود نیست، به جای نزدیک شدن به افراد، اشیاء را از آنها می دزدد و غارت خود را در بایگانی صمیمیت در کمد خود ذخیره می کند. مطالب مرتبط اخبار عمومی مجید مجیدی فیلمساز ایرانی جنگ ایالات متحده را به دلیل ظهور غذای نیمروزی به عنوان سبک زندگی برجسته در جشنواره بوسان محکوم کرد. Just بیشتر به عنوان یک هنرمند تجسمی شناخته می شود. او نماینده دانمارک در بینال ونیز در سال 2013 بود و نمایشگاه های انفرادی در سراسر جهان ارائه کرده است. بسیاری از کارهای او بازنمایی های مرسوم جنسیت، عشق و هنجارهای اجتماعی را در سینمای جریان اصلی ساختارشکنی می کند. حوادث صمیمیت اولین فیلم او در مقام کارگردان خواهد بود. فقط با سیسل دالزگارد تامسن (کوچ آرام) فیلمنامه را نوشت."}, {"source": "Hollywood Reporter", "title": "‘7 Miles Out,’ Starring Lucy Halliday, Tells a Coming-of-Age Story Full of Grief, Music and Friendship", "link": "https://www.hollywoodreporter.com/movies/movie-news/7-miles-out-carol-morley-film-lucy-halliday-grief-music-lff-1236729975/", "summary": "Carol Morley's adaptation of her semi-autobiographical novel about her adolescence near Manchester also stars Gemma Whelan and Aidan Gillen and premieres at the BFI London Film Festival.", "date_str": "2026-10-15T09:00:00+00:00", "hash": "e066b46af1761514", "title_fa": "«7 مایل بیرون» با بازی لوسی هالیدی، داستانی از سن بلوغ را روایت می‌کند که پر از غم، موسیقی و دوستی است.", "summary_fa": "اقتباس کارول مورلی از رمان نیمه اتوبیوگرافیک خود درباره دوران نوجوانی اش در نزدیکی منچستر، جما ویلان و آیدان گیلن را نیز بازی می کند و در جشنواره فیلم BFI لندن نمایش داده می شود. کارول مورلی، نویسنده و کارگردان بریتانیایی (رویاهای یک زندگی، سقوط) رمان نیمه اتوبیوگرافی تکان دهنده خود را 7 مایل بیرون، درباره دوران نوجوانی خود در استاکپورت، نزدیک منچستر، طی دهه‌های 1970 و 1980، در سفری به سن بلوغ برای نمایشگر بزرگ اقتباس کرده است. لوسی هالیدی (بلو ژان، عهدها) در نقش آن، که پس از مرگ پدر محبوبش با اندوه دست و پنجه نرم می کند، با بازی آیدان گیلن (بازی تاج و تخت، پیکی بلایندرز، کوئیر به عنوان فولک)، و گریز را در جنبش پانک موج نو و دوستی او با هل می یابد. جما ویلان (بازی تاج و تخت، کشتن حوا) در این فیلم نقش مادرش را بازی می‌کند که دارای موسیقی متنی مناسب برای آن دوران است، پر از Joy Division، New Order، The Raincoats و غیره. 7 مایل بیرون به همان اندازه که داستانی در مورد یافتن صدا و خلاقیت خود شخص است، به همان اندازه که سرود دوستی است. داستان‌های مرتبط کسب‌وکار CNN با راه‌اندازی جریانی سبک زندگی کتاب‌های سالی رونی از قفسه‌های بریتانیا بیرون کشیده می‌شود در میان بحث و جدل در مورد حمایت اکشن فلسطین هنگامی که ایان کورتیس، رهبر گروه محلی Joy Division خود را می‌کشد، و هل شهر را ترک می‌کند، همه چیز به خاطر الکل از بین می‌رود. اما احیای دوباره گذشته و یک نوار کاست دوباره کشف شده ممکن است راهی برای شروعی جدید باشد. ترانه‌های اصلی اجرا شده در این فیلم توسط مورلی و کارلی پارادیس نوشته شده‌اند که موسیقی را نیز بر عهده داشتند. فیلمبردار همکار مکرر مورلی، اگنس گدار (سقوط، Beau Travail)، با تدوین رالوکا پتر است."}, {"source": "Variety", "title": "Iranian Auteur Majid Majidi Wins Top Prize at Busan Film Festival With ‘Midday Meal’", "link": "https://variety.com/2026/film/festivals/majid-majidi-wins-top-prize-at-busan-film-festival-midday-meal-1236912870/", "summary": "Veteran Iranian filmmaker Majid Majidi has won Best Film at the 31st Busan International Film Festival for “Midday Meal,” his simple, starkly powerful contemporary parable about a rural schoolteacher making difficult moral choices to ensure his students continue to receive a free lunch in the face of government cuts. Majidi received the prize from this [ ]", "date_str": "2026-10-15T14:11:02+00:00", "hash": "f1d2d5b8423c83f6", "title_fa": "مجید مجیدی نویسنده ایرانی با «غذا ظهر» برنده جایزه برتر جشنواره فیلم بوسان شد.", "summary_fa": "مجید مجیدی، فیلمساز کهنه کار ایرانی، برنده بهترین فیلم سی و یکمین جشنواره بین المللی فیلم بوسان برای «غذا ظهر» شد، مثل ساده و کاملاً قدرتمند معاصر او درباره یک معلم مدرسه ای روستایی که انتخاب های اخلاقی دشواری انجام می دهد تا اطمینان حاصل کند که دانش آموزانش در مواجهه با تعدیل های دولتی ناهار رایگان دریافت می کنند. مجیدی این جایزه را از این جایزه دریافت کرد [ ] با این برد، درام آگاهانه اجتماعی از نویسنده و کارگردان کهنه کار اکنون واجد شرایط دریافت جایزه بهترین فیلم بین المللی اسکار امسال است. با رویکرد اومانیستی خود به رئالیسم اجتماعی و تمرکز خاص خود بر رفاه کودکان، غذای ظهر یکی از آثار مجیدی است که شامل فیلم‌هایی مانند رنگ بهشت ​​و مسابقه ونیز 2020 کودکان خورشید می‌شود. او در سطح بین‌المللی با فیلم «بچه‌های بهشت» در سال 1998 شناخته می‌شود، اولین محصول ایرانی که تاکنون در بخش بهترین فیلم بین‌المللی نامزد شده است. کامبول کمپبل، منتقد ورایتی، در نقدی قدردانی از آخرین خود، نوشت: سبک تیراندازی واقعی مجیدی بر واقعیت سردی تأکید می‌کند که [قهرمان داستان] سعی می‌کند از آن عبور کند، و هرگونه ظاهری از تعلیم بالقوه را از بین می‌برد. پرطرفدار در ورایتی میددی میل به طور بالقوه می‌تواند مجیدی را به رقابت‌های اسکار بازگرداند: بر اساس قوانین جدید آکادمی که امسال وضع شد، برنده بوسان به‌طور خودکار فیلم را واجد شرایط دریافت جایزه بهترین فیلم بلند بین‌المللی اسکار می‌کند، بدون اینکه نیازی باشد کشورش آن را به طور رسمی برای بررسی ارسال کند. (ایران در حال حاضر وارد سرزمین پایین تر فرشتگان شده است.) بوسان ششمین و آخرین جشنواره در تقویم است که به این وضعیت اعطا می شود. سایر فیلم‌هایی که طبق قانون جدید واجد شرایط بودن را تضمین می‌کنند شامل برندگان جشنواره شرم و پول و نگه داشتن کوه (هر دو ساندنس)، نامه‌های"}, {"source": "Variety", "title": "‘POV Shorts’ Moves From PBS to Time Studios’ YouTube Channel (EXCLUSIVE)", "link": "https://variety.com/2026/tv/news/pov-shorts-time-studios-youtube-channel-pbs-season-9-1236912673/", "summary": "“POV Shorts,” the PBS series focused on independent short-form documentaries, is moving homes. For Season 9, “POV Shorts” will run its films on Time Studios YouTube page. The season, which launches Nov. 17, will kick off with “Bloodlines, Mississippi” from director Crystal Kayiza and “The Boys and the Bees” from director Arielle Knight. Those two [ ]", "date_str": "2026-10-15T14:00:00+00:00", "hash": "81ff165b1855218c", "title_fa": "«POV Shorts» از PBS به کانال یوتیوب Time Studios منتقل می‌شود (انحصاری)", "summary_fa": "«POV Shorts»، مجموعه PBS که بر مستندهای کوتاه مستقل متمرکز است، خانه‌های خود را تغییر می‌دهد. برای فصل نهم، «POV Shorts» فیلم‌های خود را در صفحه YouTube Studios پخش خواهد کرد. این فصل که از 17 نوامبر آغاز می شود، با «خطای خون، می سی سی پی» به کارگردانی کریستال کائیزا و «پسران و زنبورها» از کارگردان آریل نایت آغاز می شود. این دو [ ] \" POV Shorts \"، مجموعه PBS که بر مستندهای کوتاه مستقل متمرکز است، خانه های خود را تغییر می دهد. برای فصل نهم، «POV Shorts» فیلم‌های خود را در صفحه YouTube Studios پخش خواهد کرد. این دو فیلم از شبکه PBS نیز پخش خواهند شد، اما پس از آن، این فصل از \"POV Shorts\" انحصاری استودیوی تایم خواهد بود. از جمله آرورا براچمن و لاتاج سیمونز ویور، \"Hold Me Close\"، بریت فرایر و لیدیا کورنت، \"Tessitura\" از سرویل پوبلته، \"در آفتاب صبح\"، \"عشق مصنوعی\" آرجون فیشر، \"Bucksip-Rackabe\" از Mars Verrone، و \"Buckskinabe\" «هنوز ایستاده»، آرشیا شکیبا «کسی که خورشید را دوست دارد» و ناتان تروسدل «A Derailment». داستان‌های مرتبط امتیازات فیلم‌های MK2 برادی کوربت، کلبر مندونسا فیلهو، فیلم کوتاه سلین سیاما (انحصاری) دادگاه برند راسل: جزئیات زن مورد تجاوز جنسی پس از درخواست از او برای گرفتن عکس نیمه برهنه شش فیلم از این فصل، واجد شرایط دریافت جایزه اسکار در رده‌بندی فیلم‌های کوتاه اسکار شده‌اند. «پسران و زنبورها»، «خارج شدن از ریل»، «پوست سیاه»، «در آفتاب صبح» و «هنوز ایستاده». محبوب در Variety"}, {"source": "Variety", "title": "‘KPop Demon Hunters’ Coming Soon to Toca Boca World Gaming App", "link": "https://variety.com/2026/digital/news/kpop-demon-hunters-toca-boca-world-1236906431/", "summary": "Game on, Huntr/x fans! You ll soon be able to unleash your inner KPop Demon Hunters idol on the Toca Boca World storytelling gaming app for kids, through an exclusive in-game collab with Netflix for the animated hit movie. The Toca Boca World x KPop Demon Hunters collaboration launches Oct. 27, featuring stylized depictions of the [ ]", "date_str": "2026-10-15T14:00:00+00:00", "hash": "90509d49ae402a20", "title_fa": "\"KPop Demon Hunters\" به زودی در برنامه بازی جهانی Toca Boca عرضه می شود", "summary_fa": "بازی ادامه دارد، طرفداران Huntr/x! شما به زودی قادر خواهید بود از طریق یک همکاری انحصاری درون بازی با نتفلیکس برای انیمیشن موفق، بت درونی KPop Demon Hunters را در برنامه بازی داستان‌گویی Toca Boca World برای کودکان آزاد کنید. همکاری Toca Boca World x KPop Demon Hunters در اکتبر راه اندازی می شود. 27، شامل تصاویری سبک از [ ] محتوای جدید در Toca Boca World دو بعد متمایز از دنیای KPop Demon Hunters را گرد هم می آورد: سبک روزمره شخصیت ها و انرژی صحنه کی پاپ. بازیکنان می توانند هر دو را با هم ترکیب کنند تا شخصیت ها و داستان ها را برای شخصی سازی داستان سرایی خود بسازند. محبوب در Variety همانطور که انتظار دارید، موسیقی از فیلم یکی از ویژگی های اصلی این تجربه خواهد بود. Toca Boca World در حال راه اندازی یک پخش کننده موسیقی جدید شامل چهار آهنگ برتر جدول از فیلم Golden، \"How It's Done\"، \"Soda Pop\" و \"Your Idol\" است. برای مدت محدودی، بازیکنان می‌توانند از این آهنگ‌ها به عنوان موسیقی متن برای داستان‌های خود در Toca Boca World استفاده کنند. مارک دی ولیس، رئیس اسپین مستر و بازی‌های دیجیتال، گفت: «شکارچیان شیاطین KPop Netflix یک پدیده فرهنگی جهانی است که موسیقی، مد و شخصیت‌های محبوب را به گونه‌ای گرد هم می‌آورد که به وضوح در بین بازیکنان ما طنین‌انداز شده است». ما قبلاً شاهد بودیم که جامعه توکا بوکا در داستان‌هایشان در دنیای توکا بوکا از فیلم الهام می‌گرفتند، بنابراین این همکاری فوق‌العاده طبیعی بود. این به بازیکنان ما امکان دسترسی به محتوای معتبر و انحصاری KPop Demon Hunters را می‌دهد و راه‌های بیشتری برای ایجاد، بازی، گفتن داستان و بیان خود در دنیایی که دوست دارند، می‌دهد.»"}, {"source": "Variety", "title": "‘La Bola Negra’ Directors Los Javis and Star Guitarricadelafuente to Be Awarded at Miami Film Festival Gems", "link": "https://variety.com/2026/film/news/los-javis-guitarricadelafuente-miami-film-festival-1236912494/", "summary": "Variety will present Guitarricadelafuente with the Virtuoso Award and Javier Calvo and Javier Ambrossi (known as Los Javis) with the Visionary Director Award at Miami Dade College’s Miami Film Festival Gems on Wednesday, Nov. 4. The event will take place at the Wolfson Auditorium at 7:00 p.m. Guitarricadelafuente will be honored for his breakout performance [ ]", "date_str": "2026-10-15T14:00:00+00:00", "hash": "15f9e24801a06220", "title_fa": "کارگردانان «توپ سیاه» لوس جاویس و استار گیتار فوونتین در جشنواره فیلم میامی جوایز جوایز اهدا می‌شوند.", "summary_fa": "Variety جایزه Virtuoso را به Guitarricadelafuente و خاویر کالوو و خاویر آمبروسی (معروف به لس جاویس) جایزه کارگردان رویایی را در جواهرات جشنواره فیلم میامی کالج داد در میامی در روز چهارشنبه، 4 نوامبر اهدا خواهد کرد. این رویداد ساعت 7:00 بعد از ظهر در سالن ولفسون برگزار خواهد شد. Guitarricadelafuente به خاطر اجرای شکست خود مورد تجلیل قرار خواهد گرفت [ ] Guitarricadelafuente، Calvo و Ambrossi در یک پرسش پاسخ درباره کار خود با رئیس مشترک Variety و سردبیر مشترک رامین ستوده شرکت خواهند کرد. محبوب در Variety از لحظه ای که La Bola Negra را در کن دیدم - جایی که با تشویق ایستاده 20 دقیقه ای رعد و برق تجلیل شد - می دانستم که این یک اثر هنری به یاد ماندنی است. ما بسیار خوشحالیم که از Guitarricadelafuente به خاطر بازی ستاره‌دار او در نقش سرباز دل‌سوخته سباستین و همچنین خاویر کالوو و خاویر آمبروسی، تیم درخشان کارگردانان فیلم، تقدیر می‌کنیم. گروه Guitarricadelafuente مستقر در بارسلون با شروع کار خود به عنوان یک موسیقی‌دان، دو آلبوم به نام‌های «La Cantera» در سال 2022 و «Spanish Leather» در سال 2025 منتشر کرد و نامزد دریافت دو جایزه گرمی لاتین شده است. او اولین بازی خود را در نقش سباستین در «لابولا نگرا» انجام می دهد. آهنگ اصلی Guitarricadelafuente که در فیلم برجسته شده است، \"La Nieve\" اکنون برای پخش در دسترس است. کالوو و آمبروسی کارگردانی، نویسندگی و تهیه کنندگی \"La Bola Negra\" را بر عهده داشتند و پیش از این سریال های \"Veneno\" و \"La Mesías\" را ساخته بودند. آنها برنده جایزه بهترین کارگردانی در جشنواره کن شدند و فیلم برنده جایزه منتخب مردم در جشنواره بین المللی فیلم تورنتو و جایزه تماشاگران در جشنواره فیلم سن سباستین شد."}, {"source": "Variety", "title": "‘Club Kid’ to Host Free Screenings for Nightlife Communities in 12 U.S. Cities (EXCLUSIVE)", "link": "https://variety.com/2026/film/columns/club-kid-free-screenings-nightlife-communities-1236912486/", "summary": "Jordan Firstman is bringing “Club Kid” to the club. A24 is set to hold free screenings of Firstman’s feature film directorial debut “Club Kid” for nightlife communities in 12 U.S. cities, including Atlanta, Austin, Boston, Chicago, Dallas, Houston, Miami, Philadelphia, Portland, San Francisco, Seattle and Washington D.C. The activation is in partnership with Resident Advisor, [ ]", "date_str": "2026-10-15T13:00:00+00:00", "hash": "f6b578291a9df619", "title_fa": "«بچه باشگاه» برای میزبانی نمایش‌های رایگان برای جوامع شبانه در ۱۲ شهر ایالات متحده (اختصاصی)", "summary_fa": "جردن فرستمن \"Club Kid\" را به باشگاه می آورد. A24 قرار است نمایش رایگان اولین کارگردانی فیلم داستانی Firstman \"Club Kid\" را برای جوامع تفریحی شبانه در 12 شهر ایالات متحده، از جمله آتلانتا، آستین، بوستون، شیکاگو، دالاس، هیوستون، میامی، فیلادلفیا، پورتلند، سانفرانسیسکو، سیاتل و واشنگتن دی سی برگزار کند. هفته اکتبر برگزار خواهد شد ساعت 26 ساعت 7 بعد از ظهر، زمان زیادی برای بچه ها باقی می ماند تا در آن شب به باشگاه خود بروند. پرطرفدار در ورایتی «کلاب کید» ستاره اول، که فیلمنامه را نیز نوشته است، به عنوان یک مروج زندگی شبانه در شهر نیویورک که وقتی متوجه می شود پدر یک پسر 10 ساله (رجی ابسلوم) است، دنیایش زیر و رو می شود. از بازیگران این فیلم می‌توان به دیگو کالوا، کارا دلوین، پاریس پتیجن، کولین کمپ، کربی هاول باپتیست، ویکی پپردین، نیگیل وایت، الدار ایسگانداروف، ساترن ریسین 9، دوشیزه بنی و آلاسکا رایلی اشاره کرد. «کلاب کید» پس از تشویق شش دقیقه‌ای در اولین نمایش جشنواره فیلم کن در ماه مه، توسط A24 به قیمت 17 میلیون دلار پس از یک جنگ مناقصه داغ با Mubi، Focus Features، Searchlight، A24 و Netflix خریداری شد. برادران وارنر برچسب مستقل جدید Clockwork و Neon نیز خواستگاران اولیه بودند. فرستمن مدت کوتاهی پس از امضای قرارداد A24 به مت دانلی گفت: «این واقعاً بهترین هفته زندگی من بود. دیدن مادرم در اینجا بسیار زیبا بود، خواهر و برادر غیر باینری من که سبک زندگی عجیب و غریب متفاوتی دارد. تماشای عاشق شدن مردم با دیگو کالوا. من چند پست [درباره من] دیدم که می گفت: \"خدایا، این او را به چنین هیولایی تبدیل می کند.\" اما من برعکس آن را احساس می کنم. من نمی خواهم غر بزنم. من فقط خیلی ممنونم.»"}, {"source": "Variety", "title": "Spike Lee and Mick Jagger’s Favorite Eyewear Brand Unveils First Collection From New Creative Directors John Juniper and Jeff Solorio", "link": "https://variety.com/2026/shopping/news/morgenthal-fredericks-collection-shop-online-1236912270/", "summary": "Spike Lee, LeBron James and Mick Jagger have all been spotted in Morgenthal Frederics eyewear, helping make the century-old New York label a favorite among celebrities. Now, the luxury eyewear house is getting a refresh courtesy of John Juniper and Jeff Solorio, the design duo who founded DITA and helped turn high-end spectacles into a [ ]", "date_str": "2026-10-15T13:00:00+00:00", "hash": "7c6240e0592c83f5", "title_fa": "برند محبوب عینک اسپایک لی و میک جگر اولین مجموعه از کارگردانان خلاق جدید جان جونیپر و جف سولوریو را رونمایی کرد.", "summary_fa": "اسپایک لی، لبرون جیمز و میک جگر همگی در عینک های Morgenthal Frederics دیده شده اند که به محبوبیت این برچسب نیویورکی در میان سلبریتی ها کمک کرده است. اکنون، خانه عینک‌های لوکس به لطف جان جونیپر و جف سولوریو، دوتایی طراحی که DITA را تأسیس کردند و به تبدیل عینک‌های سطح بالا به [ ] کمک کردند، تجدید می‌شود. اولین مجموعه پاییز/زمستان 2026 آن‌ها که در 15 اکتبر عرضه می‌شود، جهت طراحی جدیدی را به برندی می‌آورد که بیشتر به‌خاطر قاب‌های شاخ بوفالو دست‌سازش معروف است. این مجموعه با پیشنهادات استات و تیتانیوم ژاپنی Morgenthal Frederics، با شبح‌های مجسمه‌سازی، فلزکاری پیچیده و امضاهای ظریف جدید، از جمله نوک‌های معبد بنفش، گسترش می‌یابد. داستان‌های مرتبط فضیلت‌های YouTube، ادغام صنعت، کریستی برینکلی و «Baywatch»: روندها و موضوعات از یک Mipcom پر مشغله راه‌اندازی ESPN کانال YouTube JV ESPN برای کودکان این قرار ملاقات دو نام آشنا در عینک‌های لوکس را به یکی از قدیمی‌ترین بازیکنان این دسته می‌آورد. دوستان دوران کودکی که DITA را در اواسط دهه 1990 در لس آنجلس تأسیس کردند، جونیپر و سولوریو این برچسب را حول صنایع دستی ژاپنی و سیلوئت های الهام گرفته از کلاسیک ساختند. نفوذ آنها در نهایت به تجارت عینک طراحان گسترش یافت، به ویژه از طریق همکاری DITA با تام براون، که در سال 2011 راه اندازی شد. تاریخچه مورگنتال، در عین حال، به سال 1913 باز می گردد، زمانی که به عنوان Frederics Opticians در منهتن شروع به کار کرد. عینک، که در سال 2006 معرفی شد، به تمایز آن از رقبا کمک کرد. اما پیروی از افراد مشهور این برند چیزی است که واقعاً به حفظ شهرت آن کمک کرد. لی، که عینک‌های بزرگ و رنگ‌های روشن او تقریباً به اندازه طرفداران نیکس او قابل تشخیص است، فریم‌های نارنجی سفارشی را از Morgenthal Frederics سفارش داده است. نورمن ریدوس نیز"}, {"source": "Variety", "title": "British Government ‘Minded to Intervene’     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
