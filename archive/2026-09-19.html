934 بلوف می زدند. حالا ... به نظر می رسد کالیفرنیای جنوبی توسط خالق برای جذب صنعت فیلمسازی شکل گرفته است: هوای ملایم و آفتابی که برای عکسبرداری در فضای باز مناسب است. تنوع بی حد و حصر از مناظر طبیعی (اقیانوس، کوه، صحرا، زمین های کشاورزی) که می تواند برای هر مکانی روی زمین دو برابر شود. جمعیت متنوع اکسسوری های آماده، و حداقل در دهه های اول، سیاست های مغازه باز پدران شهر (بدون اتحادیه های کارگری مزاحم). جای تعجب نیست که پیشگامان رسانه، مناطق سرد، آب‌آلود و شلوغ نیویورک و نیوجرسی را رها کرده‌اند تا چشم‌اندازی عالی داشته باشند. به زودی، کارخانه‌های مدرن با مجموعه‌ای از هنرمندان فوق‌العاده بااستعداد برای تولید محصولات با کیفیت تولید شدند. چرا هر فیلمسازی بخواهد چنین املاک برجسته و تخصص پر زرق و برقی را ترک کند؟ دیوید الیسون دلایل خود را دارد. مدیرعامل پارامونت تهدید کرده است که زیرساخت‌های خود را برمی‌دارد و به مقصدی می‌رود که بعداً نام‌گذاری می‌شود، مگر اینکه راب بونتا، دادستان کل کالیفرنیا و همکارانش در ایالت آبی از شکایت خود برای جلوگیری از ادغام پارامونت و برادران وارنر صرفنظر کنند. شاید یک چراغ سبز نشان دهنده مهاجرت گسترده تر استودیو-کنگلومراها باشد. نتیجه لازم نیست ویرانگر باشد، اما مطمئناً روحیه شما را تضعیف می کند. هالیوود تنها یک بار در سال 1934 اینجا بوده است، زمانی که چشم انداز وحشتناک یک محیط تجاری متخاصم باعث شد استودیوهای بزرگ به فکر (یا حداقل تهدید) برای ترک سرزمین موعود به مناطق دوستانه تر باشند. آن موقع بلوف می زدند. حالا؟ من هرگز با الیسون پوکر بازی نکرده‌ام، اما با توجه به شرط‌بندی‌ها و کارت‌های او، دست او را صدا نمی‌کنم."}, {"source": "Hollywood Reporter", "title": "Hudson Williams Shares How “Surreal” It Was for Him and Connor Storrie to Return to ‘Heated Rivalry’ Set", "link": "https://www.hollywoodreporter.com/tv/tv-news/hudson-williams-heated-rivalry-tiff-conversation-1236705982/", "summary": "The 26-year-old actor also teased what fans can expect in season two of the hit hockey romance drama: \"If season one/book one is the yearning season, book two is external adversity and [relationship] communication problems.\"", "date_str": "2026-09-19T05:06:27+00:00", "hash": "0ddb7a9994ac7b5d", "title_fa": "هادسون ویلیامز به اشتراک می‌گذارد که بازگشت او و کانر استوری به مجموعه «رقابت داغ» چقدر «سوررئال» بود.", "summary_fa": "این بازیگر 26 ساله همچنین به تمسخر گفت که طرفداران در فصل دوم درام عاشقانه هاکی موفق چه انتظاری دارند: \"اگر فصل اول/کتاب اول فصل آرزو است، کتاب دو مصیبت بیرونی و مشکلات ارتباطی [روابط] است.\" متن لوگو هادسون ویلیامز در حال تمسخر است که سر صحنه فیلمبرداری فصل دوم Heated Rivalry چگونه بوده است. این بازیگر 26 ساله که در جریان گفتگو در جشنواره بین‌المللی فیلم تورنتو صحبت می‌کرد، در مورد اینکه او و کانر استوری همبازی‌اش برای صحنه‌برداری درام عاشقانه هاکی عجیب و غریب به چه شکلی بودند. ویلیامز به جمعیت گفت که قدم گذاشتن در آن سورئال بود. قراره همدیگرو ببوسیم داداش او با تقلید از استوری گفت: من لهجه لعنتی روسی خود را با شما خواهم کرد. ویلیامز گفت برای آنها سخت بود که سرشان را به عقب برگردانند و نگران بودند که نتوانند دوباره به آن برگردند. ویلیامز خاطرنشان کرد که این اولین باری بود که به شخصیتی در مقیاس بزرگ بازگشت. داستان‌های مرتبط فیلم‌ها نقد چهره ترسناک: کریستین فروسث درخشش می‌کند، اما داستان قرون وسطایی آنا بیلر نمی‌تواند به راه خود ادامه دهد نقد فیلم: یک همجنس‌گرای عصبی واگرا در جهان در یک اولین فیلم برجسته و متمایز حرکت می‌کند، ویلیامز گفت که همه چیزهایی بود که طرفداران خاطره‌شان را در فصل اول دیدند، اما خاطره‌شان را در فصل اول دیدند. در 10 ماه گذشته اتفاق افتاده است. اما در نهایت این جفت تصمیم گرفتند بیش از حد اعتماد به نفس داشته باشند و می دانستند که شخصیت های خود را در داخل و خارج می شناسند. او گفت که ما قرار است حاضر شویم و ایلیا و شین به عقب برگردند. استوری در روز اول بدون ویلیامز کار کرد و برگشت تا به همبازی خود درباره این تجربه بگوید. او می گفت، این یک جورهایی عجیب بود. همه آنها آنقدر خوب بودند که"}, {"source": "Hollywood Reporter", "title": "‘Murderous’ Review: Neil LaBute’s New Film Is Undone by Its Overly Familiar Premise and Obvious Plot Machinations", "link": "https://www.hollywoodreporter.com/movies/movie-reviews/murderous-review-neil-labute-thomas-sadoski-1236705377/", "summary": "A successful filmmaker receives an unwelcome visit from a former collaborator in this thriller receiving its world premiere at the Oldenburg International Film Festival.", "date_str": "2026-09-19T02:57:57+00:00", "hash": "b742761d52c5a9e8", "title_fa": "نقد و بررسی «قاتلانه»: فیلم جدید نیل لابوت با پیش‌فرض بیش از حد آشنا و توطئه‌های آشکارش لغو شد", "summary_fa": "یک فیلمساز موفق با بازدید ناخواسته یکی از همکاران سابق این فیلم هیجانی روبرو می شود که اولین نمایش جهانی آن در جشنواره بین المللی فیلم اولدنبورگ است. رمان‌های پرفروشی مانند The Plot اثر ژان هانف کورلیتز و فیلم‌های هیجان‌انگیز صحنه‌ای مانند تله مرگ اثر ایرا لوین، در میان بسیاری از آثار دیگر، نشان داده‌اند که دزدیدن آثار نویسنده‌ای دیگر می‌تواند عواقب سرنوشت‌ساز داشته باشد. نیل لابوت (در گروه مردان، پرستار بتی) با آخرین تلاش خود، نسخه دیگری از موضوع آشنا را ارائه می دهد و اولین نمایش جهانی آن را در جشنواره فیلم اولدنبورگ دریافت کرد. Murderous که در یک مکان اتفاق می‌افتد و تنها سه بازیگر اصلی را به نمایش می‌گذارد، بوی قوی از تأثیراتی که LaBute به آنها اشاره شده است مانند Sleuth از Joseph L. Mankiewicz و Hitchcock's Rope دارد. متأسفانه، مطابق با آن پیشینیان نیست، احساس می‌کند که مانند یک تریلر صحنه‌ای کم‌تغذیه است که نقشه‌های داستانی آن بسیار آشکار است. داستان‌های مرتبط فیلم‌های نیل لابوت و جیا کرواتین در مورد ساخت فیلم‌های جنایت‌بار ترسناک-کمدی مستقل هیچکاک، Zoë Bell برای دور دوم آماده است. محل برگزاری: جشنواره بین المللی فیلم اولدنبورگ بازیگران: جیا کرواتین، توماس سادوسکی، جردن بیکر کارگردان و فیلمنامه نویس: نیل لابات 1 ساعت و 47 دقیقه داستان، که با فصل اول با عنوان او شروع می شود، حول محور ماریان (همکار مکرر LaBute، Gia Crovatin)، فیلمسازی که یک فیلم متمایل به یک فیلم ترسناک بود، می چرخد. قاتل با موفقیت مالی‌اش که نشان‌دهنده‌ی خانه‌ی بسیار زیبای روستایی‌اش، کارخانه‌ای سابق، و پورشه‌ی قرمز رنگ قدیمی در راهروی خانه‌اش است، او یک روز از ورود غیرمنتظره‌ی نورمن (توماس سادوسکی)، که اعلام می‌کند می‌خواهد با هم صحبت کند، شگفت‌زده می‌شود. و اینکه او تمام راه را از آیووا برای انجام آن رانندگی کرده است."}, {"source": "Hollywood Reporter", "title": "The Best Films of the Fall Festivals: THR Critics’ Picks", "link": "https://www.hollywoodreporter.com/lists/best-films-fall-festivals-2026-venice-toronto-telluride/", "summary": "A shape-shifting Elizabeth Holmes doc, a star vehicle for Mahershala Ali, and new gems from Mike Leigh and Lee Chang-dong were among THR reviewers’ 13 favorite world premieres out of Venice, Telluride and Toronto.", "date_str": "2026-09-19T02:08:26+00:00", "hash": "e6417345df8c74c4", "title_fa": "بهترین فیلم‌های جشنواره‌های پاییز: انتخاب‌های منتقدان THR", "summary_fa": "یک مستند الیزابت هولمز که تغییر شکل می دهد، یک وسیله نقلیه ستاره ای برای ماهرشالا علی، و جواهرات جدید از مایک لی و لی چانگ دونگ در میان 13 نمایش جهانی مورد علاقه بازبینان THR در ونیز، تلوراید و تورنتو بودند. همراه با ساندنس در ژانویه، برلین در فوریه و کن در ماه مه، جشنواره پاییزی ونیز، تلوراید و تورنتو تقریباً همیشه بسیاری از فیلم‌هایی را به نمایش می‌گذارد که قرار است از جوایز گروه منتقدان در دسامبر تا اواسط ماه مارس در گفتگوها حضور داشته باشند. محصول امسال برای رقبای اصلی بسیار سبک تر از حد معمول بود، اما با این وجود، تیم بررسی سخت کوش هالیوود ریپورتر چیزهای زیادی را برای دوست داشتن پیدا کرد. پنج مورد از 13 انتخاب برتر ما مستند هستند، با موضوعاتی به اندازه مقاومت روزنامه نگاری مستقل در روسیه پوتین؛ نماد شکار سینمای دگرباش بریتانیا. دیدگاه جدید ویرانگر در مورد جنگ در غزه. یک پرتره خاص از یک ملکه کلاهبردار محکوم؛ و مبارزات کارگران تحویل در شهر نیویورک. در بخش روایی، وسایل نقلیه جدید جولیان مور، جان مالکوویچ و ماهرشالا علی بهترین نقش‌هایشان را در سال‌های اخیر به این بازیگران خوب ارائه کردند، در حالی که روزالیند الازار که کمتر شناخته شده بود، نقش‌آفرینی ستاره‌ای را به ثمر رساند که باید او را در رادار هر کارگردانی قرار دهد. غول رئالیسم انگلیسی چیزی را خلق کرد که احتمالاً اوج آواز قو یک حرفه باشکوه خواهد بود. اولین کارگردان لبنانی ژانر دزدی را دوباره تقویت کرد. و یک استاد سینمای معاصر کره، تفکری منحصر به فرد از ثروت و شکاف طبقاتی ارائه کرد. بیوگرافی آزاد ایلیا خرژانوفسکی از فیزیکدان روسی، لو لندائو، در عین حال عظیم و صمیمی، سیاسی، تاریخی و شخصی، از آن نوع فیلمبرداری برای ماه است که دیگر به ندرت اتفاق می افتد - و مطمئناً شبیه این نیست (تصویربرداری"}, {"source": "Hollywood Reporter", "title": "Chris Brown Turns on Texas Rep. as Congressional Honor Causes Controversy", "link": "https://www.hollywoodreporter.com/music/music-news/chris-brown-jasmine-crockett-venton-jones-texas-honor-backlash-1236705949/", "summary": "The singer thanked Jasmine Crockett but blasted Venton Jones after the state rep tried to walk back their AT T Stadium tribute amid domestic violence backlash.", "date_str": "2026-09-19T01:46:04+00:00", "hash": "36c9246db975957e", "title_fa": "کریس براون از نماینده تگزاس انتقاد می کند زیرا افتخار کنگره باعث بحث و جدل می شود", "summary_fa": "این خواننده از یاسمین کروکت تشکر کرد اما پس از اینکه نماینده ایالتی سعی کرد در میان واکنش خشونت آمیز خشونت خانگی از ادای احترام خود در استادیوم AT T عقب نشینی کند، ونتون جونز را مورد انتقاد قرار داد. کریس براون اظهارات متفاوتی را به ونتون جونز، نماینده ایالت تگزاس و جاسمین کراکت، نماینده ایالات متحده، دو نماینده دموکرات تگزاس که در تور مشترک خود از او و آشر در ایستگاه آرلینگتون قدردانی کردند، ارائه کرد، در حالی که جنجال‌ها حول به رسمیت شناختن رسمی ستاره پاپ قطبی توسط این دو قانونگذار در جریان است. در سپتامبر در 12، کروکت در طول توقف براون و آشر در تور R B در استادیوم AT T روی صحنه رفت و اعلام کرد که به دلیل مشارکت جداگانه خواننده چند پلاتینی در موسیقی، هر دو هنرمند در رکورد کنگره به رسمیت شناخته شده اند. نماینده ایالتی جونز نیز در کنسرت روی صحنه بود تا به کراکت در این مراسم بپیوندد و به براون یک قدردانی قانونی جداگانه ارائه کرد. این تصمیم جنجال بزرگی را در فضای مجازی برانگیخت، با واکنش دموکرات‌های لیبرال تگزاس به کراکت که از گیج شدن در مورد اینکه چرا او از یک بدسرپرست معروف خانگی تجلیل می‌کند تا خشم داغ در تصمیمی که بسیاری آن را مایه شرمساری می‌دانستند. داستان‌های مرتبط موسیقی کریس براون پس از حمله به کلوپ شبانه لندن گناهکار خود را اعتراف کرد. موسیقی آشر می‌گوید که از دیدی سوء تعبیر شده است: کراکت در کنسرت گفت: هیچ چیز منفی برای گفتن درباره شان کامبز ندارم، ما در بالاترین سطح شادی سیاه را تجربه می‌کنیم. و من می خواستم مطمئن شوم که ما آن را در سطح کنگره مستند می کنیم. پس بیایید دوباره آن را برای کریس براون رها کنیم. کروکت این هفته در مورد این رویداد در استادیوم AT T اظهار نظر عمومی"}, {"source": "Hollywood Reporter", "title": "‘American Horror Story’ Season 13: Everything We Know", "link": "https://www.hollywoodreporter.com/lists/american-horror-story-season-13-everything-we-know-guide/", "summary": "The 13th installment of Ryan Murphy and Brad Falchuk's horror anthology series is returning — and in a big way.", "date_str": "2026-09-19T01:27:06+00:00", "hash": "d7af8f215d513787", "title_fa": "«داستان ترسناک آمریکایی» فصل 13: هر آنچه می دانیم", "summary_fa": "سیزدهمین قسمت از مجموعه گلچین ترسناک رایان مورفی و برد فالچوک در حال بازگشت است - و به شکلی بزرگ. متن لوگو طرفداران ترسناک را آماده کنید، زیرا فصل جدیدی از American Horror Story در حال نزدیک شدن است و برخی از محبوب‌ترین شخصیت‌های سریال - و بازیگرانی که آنها را بازی می‌کنند - باز می‌گرداند. AHS که توسط رایان مورفی و براد فالچوک ساخته شد، اولین بار در سال 2011 با Murder House شروع به کار کرد و از آن زمان بینندگان را در فصل دوم پناهندگی، فصل سوم Coven، فصل چهارم Freak Show، فصل پنجم هتل، فصل ششم Roanoke، فصل هفتم Cult، فصل هشتم، فصل هشتم آخرالزمان، فصل 19، فصل نهم، دوبار، فصل 9، فصل نهم، جذب کرده است. 11 s NYC و فصل 12 s Delicate. در حال حاضر، سریال گلچین تقریباً برای فصل 13 بازگشته است، با موارد مورد علاقه فرنچایز از جمله جسیکا لانژ، ایوان پیترز، سارا پالسون، اما رابرتز و سایرین به سریال برنده امی، که تبدیل به یکی از اصلی‌های آیه مورفی شده است. این فصل توسط مورفی، فالچوک، ند مارتل، چارلی کارور، اریک کوتون، نیسا دیدریک، اسکات رابرتسون، تاناس پوپا، کریستل رابرسون دورسی، جنیفر سالت و تیم مینیر تهیه‌کننده اجرایی است. این توسط تلویزیون بیستم تولید شده است. در زیر، هالیوود ریپورتر همه چیزهایی را که در مورد AHS باید بدانید را شرح می دهد: 13 - از بازیگران جدید و بازگشته آن گرفته تا آنچه مورفی در مورد آینده فرنچایز و اولین فیلم رسمی به زبان آورده است. این داستان در ابتدا در 13 آگوست ارسال شد و تا اولین پخش فصل به روز خواهد شد. پس از اینکه AHS: 13 در ابتدا برای نمایش در حوالی هالووین 2026 مشخص شد، FX تاریخ انتشار رسمی خود را برای 24 سپتامبر ساعت 9 شب تعیین کرد. ET / ساعت 6 بعد از"}, {"source": "Hollywood Reporter", "title": "Between ‘The Love Hypothesis’ and ‘Adults,’ Rachel Marsh’s Breakout Moment Is Here", "link": "https://www.hollywoodreporter.com/movies/movie-features/next-big-thing-rachel-marsh-the-love-hypothesis-1236705607/", "summary": "The 34-year-old, fresh off a viral turn in the new season FX's 'Adults,' is jumping into the world of romantic comedies, playing Anh in Prime Video's adaptation of 'The Love Hypothesis.'", "date_str": "2026-09-19T00:30:00+00:00", "hash": "ae3262f1cee93db6", "title_fa": "بین «فرضیه عشق» و «بزرگسالان»، لحظه شکست ریچل مارش اینجاست", "summary_fa": "این مرد 34 ساله که در فصل جدید «بزرگسالان» از FX تبدیل به یک چرخش ویروسی شده است، با بازی آنه در اقتباس «فرضیه عشق» در پرایم ویدیو، به دنیای کمدی‌های رمانتیک می‌پرد. راشل مارش، بازیگر سینما، اعلام می‌کند که من هر زمانی که زنان بامزه هستند، دوست دارم. خوشبختانه، این مرد 34 ساله توانسته است در پروژه‌های زیادی حضور داشته باشد که این کمدی رمانتیک پرایم ویدئو را به نمایش می‌گذارد. مارش نقش آنه، دانشجوی کارشناسی ارشد و بهترین دوست زیتون لیلی راینهارت را در اقتباس پخش کننده از رمان بسیار محبوب علی هیزلوود بازی می کند. این بازیگر به دنبال تبدیل شدن به شخصیت عجیب و غریب بهترین دوست نبود، موضوعی که کارگردان، کلر اسکنلون و نویسندگان سارا روچیلد و هیزل‌وود علاقه‌ای به تکرار آن نداشتند. مارش به هالیوود ریپورتر در یک زوم اخیر به هالیوود ریپورتر می‌گوید: داستان‌های مرتبط بزرگسالان تلویزیونی از افت سال دوم با رشد رتبه‌بندی‌ها سرپیچی می‌کنند. او همچنین بامزه است. مارش احساس می کند دوستی بین شخصیت او و زیتون راینهارت پایه و اساس کل داستان است، چیزی که در کتاب هیزلوود نیز صادق است. این دو زن با یافتن این دوستی در صفحه و خارج از صفحه، لحظات بسیار خوبی را سپری کردند. ایجاد این اعتماد بسیار آسان بود. لیلی خیلی شگفت انگیز است این بازیگر می گوید، او بسیار شیرین است. او یک بازیگر خوب و یک شریک صحنه عالی است. برای ما واقعاً جالب بود که بهترین دوستی آنها را در طول تابستان در مونترال ایجاد کنیم. رام کام آینده اولین بار نیست که مارش را روی صفحه نمایش خود می بینید. نوبت او به عنوان کارلی، دوست دختر بازیکن پیشرو سمیر (مالک السال)، در بزرگسالان در ماه گذشته در فضای مجازی منتشر شده است. این بیشتر به لطف یک آهنگ جعلی مضحک و جذاب کی پاپ در این مجموعه"}, {"source": "Hollywood Reporter", "title": "Where to Buy Engagement Rings Online, From Classic Cuts to Sustainable Picks", "link": "https://www.hollywoodreporter.com/lifestyle/shopping/where-to-buy-best-engagement-rings-online-shopping-1236204809/", "summary": "Whether you're looking for edgy styles, classic cuts or lab-grown faves, these online retailers may have your dream ring.", "date_str": "2026-09-18T23:51:19+00:00", "hash": "931c4a83ad1e08f1", "title_fa": "از کجا می توان حلقه های نامزدی را آنلاین خرید، از برش های کلاسیک تا انتخاب های پایدار", "summary_fa": "فرقی نمی‌کند به دنبال سبک‌های تند، برش‌های کلاسیک یا مدل‌های مورد علاقه‌تان در آزمایشگاه باشید، این خرده‌فروشان آنلاین ممکن است حلقه رویایی شما را داشته باشند. توسط ناتالی آلکالا، ارین لاسنر، 18 سپتامبر 2026، ساعت 4:51 بعد از ظهر اگر محصول یا خدماتی را که به طور مستقل بررسی شده است، از طریق پیوندی در وب سایت ما خریداری کنید، هالیوود ریپورتر ممکن است کمیسیون وابسته دریافت کند. تابستان ممکن است هنوز محبوب‌ترین زمان سال برای ازدواج باشد، اما این روزها، فصل عروسی در هر چهار فصل گسترش می‌یابد، و مردم می‌گویند که من در تعطیلات، در اولین شکوفه‌های بهار و هر ماه در بین آن‌ها انجام می‌دهم. به طور مشابه، نامزدی در طول سال برگزار می‌شود و به نظر می‌رسد که بهترین زمان برای طرح این سؤال درست زمانی است که می‌دانید درست است. آن را از تراویس کلس بگیرید، که در پایان تابستان این سوال را به تیلور سویفت داد، یا تام هالند و زندایا، که در ماه‌های اوج زمستان نامزد کردند. ضرب المثل قدیمی انتظار برای روز ولنتاین؟ آن را در نظر بگیرید که از پنجره بیرون انداخته می شود، همراه با روش های قدیمی خرید حلقه. داستان های مرتبط Lifestyle T-Mobile آیفون 18 پرو را در اختیار ما قرار می دهد: در اینجا نحوه درخواست معامله آورده شده است. کاملا چالش برانگیز باشد در حالی که خرید حضوری برای حلقه یک گزینه عالی است، اما ما خوش شانس هستیم که در عصری زندگی می کنیم که بسیاری از خرده فروشان معتبر امکان خرید آنلاین حلقه نامزدی را فراهم می کنند. آیا می خواهید بهترین مکان ها برای خرید آنلاین انگشتر را بدانید؟ در اینجا چیزی است که شما باید بدانید."}, {"source": "Hollywood Reporter", "title": "Paramount and California AG Reportedly Closing in on a Settlement", "link": "https://www.hollywoodreporter.com/business/business-news/paramount-and-california-ag-reportedly-closing-in-on-a-settlement-1236705848/", "summary": "Per the Wall Street Journal, the two sides are in “advanced talks” to resolve the case. A spokesperson for California Attorney General Rob Bonta's office said the discussions are “confidential.”", "date_str": "2026-09-18T23:20:53+00:00", "hash": "4d56641a9364c23f", "title_fa": "بنا به گزارش ها، پارامونت و کالیفرنیا AG در حال نزدیک شدن به یک تسویه حساب هستند", "summary_fa": "به گفته وال استریت ژورنال، دو طرف در حال \"گفتگوهای پیشرفته\" برای حل این پرونده هستند. سخنگوی دفتر راب بونتا، دادستان کل کالیفرنیا، گفت که این گفتگوها \"محرمانه\" است. وال استریت ژورنال روز جمعه گزارش داد که پارامونت و دهها ایالت به رهبری راب بونتا دادستان کل کالیفرنیا در حال نزدیک شدن به یک معامله برای حل و فصل یک دعوای حقوقی به چالش کشیدن پیشنهاد استودیو برای خرید برادران وارنر دیسکاوری هستند. بر اساس این گزارش، دو طرف در حال گفتگوهای پیشرفته برای حل این پرونده هستند. بر اساس قرارداد گزارش شده، شرایط شامل موافقت پارامونت با اداره استودیوهای فیلمسازی دو شرکت به طور جداگانه برای مدتی به جای ترکیب فوری آنها است. در نشانه دیگری مبنی بر قریب الوقوع بودن توافق، رویترز گزارش داد که توافق می تواند در اسرع وقت در آخر این هفته حاصل شود. این توافق می‌تواند مستلزم نظارت مستقل بر محتوای سی‌ان‌ان، به‌علاوه تعهد در مورد تعداد نمایش‌های نمایشی باشد. در سراسر دعوای قضایی، بونتا مدعی است که تنها راه‌حل‌های ساختاری را می‌پذیرد، که معمولاً شامل شرکت‌هایی است که بخش‌هایی از تجارت ترکیبی را می‌فروشند، و قبلاً گفته بود که چنین توافقی برای اجرای مستقل عملیات استودیویی نمی‌تواند جزء اصلی هر معامله احتمالی باشد. تا کنون، پارامونت تنها امتیازات رفتاری، از جمله تعهد به اکران حداقل 30 فیلم با پنجره های 45 روزه را ارائه کرده است. معامله ای که بدون هیچ گونه واگذاری منعقد شود، یک پیروزی بزرگ برای دیوید الیسون، مدیر عامل پارامونت خواهد بود، که تهدید کرده است در صورت عدم حصول توافق تا آغاز ماه آینده بدون توجه به نتیجه نهایی، استودیو را از کالیفرنیا منتقل خواهد کرد. با تسویه حساب، پارامونت می‌تواند ادغام را پیش از ضرب‌الاجل اول اکتبر، یعنی زمانی که هفت میلیون دلار در روز به اصطلاح کارمزد شروع می‌شود، ببندد."}, {"source": "Variety", "title": "‘Anchors Aweigh’ Review: A Cynical Comedian Reflects on His Youth in an Abridged Mockumentary", "link": "https://variety.com/2026/film/reviews/anchors-aweigh-review-1236866281/", "summary": "In Matt Barats’ “Anchors Aweigh,” a caustic alt-comedian is left adrift after his failed proposal, prompting him to revisit old footage from his college days and ruminate on his arrested development. It’s a lot less serious than it sounds, in part because Barats’ self-insert — who he also plays — has a sardonic cadence that [ ]", "date_str": "2026-09-19T14:18:47+00:00", "hash": "ca202f039f373cd6", "title_fa": "نقد و بررسی \"Anchors Aweigh\": یک کمدین بدبین در یک فیلم کوتاه به دوران جوانی خود فکر می کند", "summary_fa": "در «Anchors Aweigh» مت باراتس، یک آلت کمدین تند و زننده پس از پیشنهاد ناموفق خود، سرگردان می ماند و او را وادار می کند تا فیلم های قدیمی دوران دانشگاه خود را دوباره مرور کند و در مورد پیشرفت دستگیر شده خود فکر کند. این بسیار کمتر از آن چیزی است که به نظر می رسد، تا حدی به این دلیل که خود درج باراتس - که او همچنین نقش او را بازی می کند - دارای آهنگ طعنه آمیزی است که [ ] مت باراتس، چه خوب و چه بد، شوخ طبعی را به هر دو طرف دوربین می آورد. در Matt Barats Anchors Aweigh، یک آلت کمدین تندخو پس از پیشنهاد ناموفق خود سرگردان می ماند و او را وادار می کند تا فیلم های قدیمی دوران دانشگاه خود را دوباره مرور ovisual Hub, has plowed €215.6 million ($252.3 million) into Spain’s film, [ ]", "date_str": "2026-09-19T09:55:02+00:00", "hash": "fef73c9372d65bac", "title_fa": "سرمایه گذاری 521 میلیون دلاری SETT اسپانیا برای ایجاد بازیگران سمعی و بصری جهانی", "summary_fa": "احتمالاً هیچ ابتکار صنعت اسپانیایی در جشنواره سن سباستین امسال بیشتر از آخرین اقدامات انجمن اسپانیایی برای دگرگونی فناوری (SETT) گفتگو را به همراه نخواهد داشت. طی 12 ماه گذشته، صندوق سرمایه گذاری مخاطره آمیز تحت حمایت دولتی SETT، محرک سرمایه گذاری مرکز سمعی و بصری اسپانیا، 215.6 میلیون یورو (252.3 میلیون دلار) را برای فیلم اسپانیا سرمایه گذاری کرده است، [ ] پیشگام فاز 2 مرکز سمعی و بصری اسپانیا، SETT، یک سرمایه گذاری جدید با پشتوانه تلویزیونی برای چهار صنعت فیلم و سرمایه های تلویزیونی با حمایت دولتی است. برابر متوسط بودجه صندوق یارانه اصلی اسپانیا در هیئت فیلم ICAA این کشور. از جهات دیگر، SETT که بخشی از وزارت تحول دیجیتال اسپانیا است، یک انقلاب را نیز در خود جای داده است. از دهه 1940، دولت‌های اسپانیا کمک‌های یارانه‌ای و وام‌هایی را برای فیلم‌های فردی و از حدود سال 2015 معافیت‌های مالیاتی برای فیلم‌برداری در اسپانیا ارائه کرده‌اند. در مقابل، SETT تا 10 سال در شرکت‌هایی با مجموعه‌ای از تولیدات سرمایه‌گذاری می‌کند که نیاز به سرمایه‌گذاری مشترک از شرکای بخش خصوصی دارد و به دنبال برتری آنها در بازار بین‌المللی است. همچنین از وسایل سرمایه گذاری بخش خصوصی حمایت می کند. گونز لز وراکروز می گوید: ما از دوران تشویق یک اکوسیستم به سمت تحکیم یک صنعت سمعی و بصری واقعا بین المللی حرکت می کنیم. یازده سرمایه‌گذاری از 15 سرمایه‌گذاری SETT تا به امروز عمومی شده است، با ذینفعانی از جمله رهبران بخش انیمیشن (Anima Kitchen، Amuse Animation، Planeta Junior)، شرکت‌های تولید جدید مستقر در اسپانیا (Good Films Studios اسپانیا، taca Films Madrid، Moonlighting Studios اسپانیا)، امکانات پس از تولید (Huzonaue-Full audiovis)، Hussonaue-Full a Audiovis. پخش کننده تولید-توزیع (استودیو ایمپالس)."}, {"source": "Variety", "title": "Naomi Watts Believes Standards Have Changed for Older Women in the Industry: ‘Look at the Emmys Last Week… That’s Heartening to See’", "link": "https://variety.com/2026/film/global/naomi-watts-older-women-in-the-industry-emmys-san-sebastian-1236867602/", "summary": "British actor Naomi Watts, at the San Sebastián Film Festival to receive this year’s prestigious Donostia Award, spoke about opportunities in the industry for women over 50. Talking a week after Sarah Paulson told Variety about the lack of film offers following her spellbinding portrait of Marcia Clark in “The People v. O.J. Simpson: American [ ]", "date_str": "2026-09-19T09:48:43+00:00", "hash": "a3bfa45096296d92", "title_fa": "نائومی واتس معتقد است که استانداردها برای زنان مسن در صنعت تغییر کرده است: \"به امی هفته گذشته نگاه کنید... دیدن این موضوع دلچسب است.\"", "summary_fa": "نائومی واتس، بازیگر بریتانیایی، در جشنواره فیلم سن سباستین برای دریافت جایزه معتبر دونوستیا، در مورد فرصت‌های این صنعت برای زنان بالای 50 سال صحبت کرد. یک هفته پس از صحبت سارا پالسون در مورد کمبود پیشنهادات فیلم پس از پرتره جذاب مارسیا کلارک در فیلم The People v. O.J. سیمپسون: آمریکایی [ ] ستاره «مالهالند درایو» در جشنواره فیلم سن سباستین برای نمایش فیلم «زن خانه دار» بن شیرینیان و همچنین دریافت جایزه دونوستیا امسال حضور دارد. در ابتدا به من گفتند که بهتر است اسکیت هایم را بپوشم زیرا همه چیز در سن 40 سالگی تمام می شود. و امروز اینجا هستیم. من در اواخر دهه 50 هستم. به جوایز امی هفته گذشته [و] تعداد زنان در دسته های قوی بالای 50 سال نگاه کنید. دیدن این موضوع دلگرم کننده است. محبوب در داستان های مرتبط با تنوع، چونینگ تاتوم، جما چان و یک جبهه 10 ساله، کمپین اسکار ژوزفین (انحصاری) جان تورتورو 40 سال برای نامزدی اسکار منتظر ماند. «تنها جیب بر زنده در نیویورک» نامزدهای پرونده بالای 50 سال شامل رئا سیهورن (پلوریباس)، ژان اسمارت (هکس) و آلیسون جنی (دیپلمات) بودند. او افزود، من فکر می کنم همه چیز تغییر کرده است. زنان مصرف کننده فیلم و تلویزیون هستند و داستان آنها باید منعکس شود. این روایت باید جابه‌جا می‌شد. و من از اینکه بخش کوچکی از این تغییر هستم سپاسگزارم. این بازیگر همچنین در جشنواره باسک با اولین فیلم سینمایی «خانه دار» بن شیرینیان حضور دارد. در ety A breakout بالقوه، 5 More Minutes توسط Movistar Plus، El Terrat، بخشی از Mediapro Studio، و Ikiru Films تولید شده است. Filmax توزیع داخلی در اسپانیا و فروش بین المللی را انجام می دهد. رویز کالدرا و رومرو هر دو با ورایتی در آستانه نمایش جهانی آن در سن سباستین صحبت کردند. چه چیزی در این پروژه بود که شما را مجبور به انجام آن کرد، به خصوص بعد از فیلم قبلی؟ رویز کالدرا: من همیشه دوست دارم فیلم بعدی ام با فیلم قبلی متفاوت باشد و چالش جدیدی ارائه کند. فیلمنامه برتو رومرو با ترکیب ژانرهایی که من بیشتر دوست دارم: فانتزی، هیجان انگیز و طنز مقاومت ناپذیر را ارائه می دهد. بلافاصله خواستم درستش کنم. انتخاب موسیقی در قاب فیلم قابل توجه است. چه چیزی باعث تصمیم گیری برای باز و بسته شدن با روی اوربیسون در رویاها شد، و امیدوار بودید که موتیف موسیقی چه چیزی را برانگیزد؟"}, {"source": "Variety", "title": "Lego’s ‘Ninjago Legends: Duskfall’ Anime-Style Shorts Premiere in Korea Ahead of YouTube Release", "link": "https://variety.com/2026/tv/global/legos-ninjago-legends-duskfall-premiere-youtube-1236866920/", "summary": "“Ninjago Legends: Duskfall” is premiering in Korea this weekend ahead of a worldwide release on Lego’s YouTube channel. The anime-style shorts feature some of “Ninjago’s” most beloved characters as they encounter new challenges and new battles while bringing back some familiar voices from the original show as well as “Ninjago Dragons Rising.” The series of [ ]", "date_str": "2026-09-19T07:01:00+00:00", "hash": "00d3e4ac467fdc38", "title_fa": "نمایش انیمیشن کوتاه Lego's Ninjago Legends: Duskfall در کره قبل از انتشار YouTube", "summary_fa": "«Ninjago Legends: Duskfall» این آخر هفته و پیش از انتشار جهانی در کانال یوتیوب Lego در کره اکران می شود. این فیلم‌های کوتاه به سبک انیمه برخی از محبوب‌ترین شخصیت‌های «نینجاگو» را به نمایش می‌گذارند که با چالش‌های جدید و نبردهای جدید روبرو می‌شوند و در عین حال صداهای آشنا را از نمایش اصلی و همچنین «نینجاگو اژدهایان برمی‌خیزند». مجموعه‌ای از [ ] مجموعه‌ای از سه فیلم کوتاه به هم پیوسته، هر کدام سه دقیقه‌ای، روز جمعه در یک رویداد طرفداران Ninjago Legends Duskfall در مرکز خرید پارک یونگسان در سئول به نمایش درآمد. این شورت در روز شنبه 19 سپتامبر در کانال یوتیوب گروه Lego منتشر خواهد شد. داستان های مرتبط رابرت پتینسون بهترین سال خود را با Primetime، درام، ادیسه و Dune 3 سپری می کند. آیا اسکار او را می شناسد؟ چگونه خشکسالی 30 ساله اسکار جان مالکوویچ می تواند سرانجام با «اسب وحشی نه» به پایان برسد این سه فیلم کوتاه با نام های «پایان آغاز می شود» به کارگردانی دیوید کازو و چارلز لفور، پایانه، به کارگردانی دوباره کازو و لفور، و پایان به کارگردانی کازو و هوگوف، کارگردانی می شود. محبوب در Variety اندرو فرانسیس نقش خود را در نقش کول در کنار کلی متزگر در نقش نیا و وینسنت تانگ در نقش کای بازی می کند. همچنین برایان دراموند در نقش دیوینر و رانت، آدریان پتریو در نقش اسکات و سابرینا پیتر (صدای سورا در بازی Dragons Rising) به عنوان گزارشگر به این فرنچایز بازگشته اند. در تریلر سریال شورت، با صدای زنانه ای شروع می شود که می گوید Kai، اگر از این کار خارج شدی، به من قول بده که دور شوی. سپس قبل از اینکه کای در لباس نینجا قرمزش بگوید: عناصر را نجات دهید، من می‌آیم، فعالیت‌های زیادی انجام می‌شود. صدای زن سپس می گوید: ما دیگر با شیاطین"}, {"source": "Variety", "title": "Portugal’s Queer Lisboa Celebrates 30th Anniversary With Vast Showcase of Latest LGBTQ Titles, Dose of Radical 1970s Counterculture and Family Fare", "link": "https://variety.com/2026/film/global/portugal-queer-lisboa-lgbtq-1236867311/", "summary": "Celebrating its 30th anniversary this year, Portugal’s preeminent Queer Lisboa – International Queer Film Festival kicked off Friday with a vast program showcasing the latest in LGBTQ cinema, from established filmmakers to new voices, and a look back at the underground counterculture and revolutionary works of activist filmmakers on both sides of the Atlantic. Lisbon’s [ ]", "date_str": "2026-09-19T06:44:26+00:00", "hash": "128f67e957989943", "title_fa": "کوئر لیسبوا پرتغال سی امین سالگرد خود را با نمایش وسیعی از جدیدترین عناوین دگرباشان جنسی، دوز ضد فرهنگ رادیکال دهه 1970 و هزینه های خانوادگی جشن می گیرد.", "summary_fa": "جشنواره بین‌المللی فیلم کوئیر پرتغال که سی‌امین سالگرد خود را جشن می‌گیرد، روز جمعه با برنامه‌ای گسترده با نمایش جدیدترین‌های سینمای دگرباشان جنسی، از فیلم‌سازان تثبیت‌شده تا صداهای جدید، و نگاهی به ضد فرهنگ زیرزمینی و آثار انقلابی فیلم‌سازان فعال در دو سوی اقیانوس اطلس آغاز شد. لیسبون [ ] Unspooling فیلم هایی از ایرا ساکس، لیا نلسون، پدرو آلمودوار، جین شوئنبرون، سالی پاتر، واچوفسکی ها و ژائو پائولو فریرا قدیمی ترین جشنواره فیلم لیسبون، کوئیر لیسبون است که در سال 1997 با افتتاحیه جشنواره فیلم گابون و پورتوگبیس به عنوان جشنواره فیلم لیسبون آغاز شد. فیلم کوتاه Un chant d amour محصول 1950، تنها فیلمی که تا به حال توسط ژان ژنه، رمان‌نویس و نمایشنامه‌نویس فرانسوی کارگردانی شده است، که آثارش شامل Querelle de Brest می‌شود که توسط راینر ورنر فاسبیندر اقتباس شده است. داستان های مرتبط سه فیلم و اسکار دوم؟ چگونه پنه‌لوپه کروز می‌توانست بر فصل جوایز با La Bola Negra، The Invite و Bunker I Play Rocky Premiers در TIFF: فیلمی درباره برنده بهترین فیلم که رقیب بهترین فیلم است، تسلط یابد؟ جو او فریرا، مدیر هنری کوئیر لیسبون به ورایتی می گوید که خاستگاه جشنواره در سینماتک پرتغال یکی از عواملی است که آن را از سایر جشنواره های دگرباشان در سراسر اروپا متمایز کرده است. محبوب در Variety از همان ابتدا، می‌توانم بگویم که جشنواره به دلیل حمایت نهادی که از همان روز اول از آن برخوردار بود، تنها برای جامعه LGBTQ به‌عنوان یک جشنواره یا جشنواره متصور نبود. بنابراین من فکر می کنم این یک مورد بسیار خاص برای یک جشنواره عجیب و غریب در اروپا است. در مورد برخی از فستیوال هایی که کم و بیش همزمان شروع به کار کردند، مثل مادرید یا پاریس، مطمئناً اینطور نبود."}, {"source": "Variety", "title": "‘It’s My Most Personal Film,’ Says Director Rodrigo García Saiz of His San Sebastian New Directors Title, ‘Morro’", "link": "https://variety.com/2026/film/global/irodrigo-garcia-saiz-san-sebastian-new-directors-morro-1236856801/", "summary": "A dog is indeed a man’s best friend. A New Directors contender at the San Sebastián Film Festival, “Morro” explores the unlikely bond between a man and the dog he inadvertently adopts. It is Rodrigo Garcia Saiz’s (“Lluvia”) sophomore feature and, by his own account, his most personal film to date. The titular Morro is [ ]", "date_str": "2026-09-19T06:28:12+00:00", "hash": "bafb6879ef37d173", "title_fa": "رودریگو گارسیا سایز، کارگردان، درباره عنوان کارگردان جدیدش در سن سباستین، «مورو» می‌گوید: «این شخصی‌ترین فیلم من است».", "summary_fa": "سگ در واقع بهترین دوست یک مرد است. «مورو» که یکی از رقبای کارگردانان جدید در جشنواره فیلم سن سباستین است، پیوند نامحتمل بین یک مرد و سگی را که ناخواسته به فرزندی قبول می‌کند، بررسی می‌کند. این فیلم بلند دوم رودریگو گارسیا سایز (\"Lluvia\") و به گفته خودش شخصی ترین فیلم او تا به امروز است. گارسیا که اکنون در مادرید زندگی می‌کند، می‌گوید: «مورو» این است که [ ] من همیشه با سگ‌ها ارتباط داشته‌ام و همچنین می‌خواستم از زمانی که مکزیک را ترک کردم درباره خشونت‌ها فکر کنم. اما نه در مورد نشان دادن خود خشونت، بلکه در مورد آنچه برای افرادی که می مانند. و چگونه حیوانی که قضاوت نمی کند، چیزی جز عشق نمی خواهد و عشق می بخشد، چگونه می تواند کمک کند. محبوب در Variety Morro حول محور متئو، دامپزشکی در روستایی مکزیک می چرخد ​​که با گناه حل نشده از دست دادن پسرش، بی سر و صدا زندگی می کند. در شهری که خشونت در آن زیر سطح می جوشد، روال شکننده او با درمان مورو، سگ زخمی یک قاچاقچی محلی، مختل می شود. مراقبت از حیوان باعث ایجاد یک پیوند بی کلام و بدون قضاوت می شود که به آرامی به متئو حس جدیدی از هدف می بخشد. پس فرض واقعاً این است: چه کسی چه کسی را نجات می دهد؟ من شروع به تحقیق کردم، به مناطق درگیری رفتم و این داستان را کشف کردم، که کاملاً بر اساس تجربه شخصی است که از طریق یکی از دوستانم ملاقات کردم. در ابتدا، او کمی مردد بود زیرا واقعاً نمی خواست کل داستان را برای ما تعریف کند. اما کم کم حرفش را باز کرد. کم کم اعتماد او را جلب کردم و او شروع کرد به گفتن چیزهایی به من و من با فیلمنامه نویس دیگری [کارلوس آرملا] و تعدادی"}, {"source": "Variety", "title": "World Premiering at San Sebastián, Igor Legarreta Describes His Third Film ‘The Blind Ants’ as a Coastal Western Set in the Basque Country", "link": "https://variety.com/2026/film/global/igor-legarreta-the-blind-ants-san-sebastian-lamia-lazona-1236862823/", "summary": "The Blind Ants ( Inurri Itsuak ), the third feature by director Igor Legarreta ( All the Moons, When You Stop Loving Me ), had it world premiere on Sept. 18 at the 74th San Sebastián International Film Festival. Part of the Zinemira section, which is dedicated to Basque productions, the film is competing for the Irizar Award for [ ]", "date_str": "2026-09-19T05:00:00+00:00", "hash": "1ce8525bd4e043eb", "title_fa": "ایگور لگارتا در اولین نمایش جهانی در سن سباستین، سومین فیلم خود با نام مورچه های کور را به عنوان یک وسترن ساحلی در کشور باسک توصیف می کند.", "summary_fa": "مورچه‌های کور (Inurri Itsuak)، سومین اثر کارگردانی به کارگردانی ایگور لگارتا (همه ماه‌ها، وقتی که دوستم نداری)، در 18 سپتامبر در هفتاد و چهارمین جشنواره بین‌المللی فیلم سن سباستین به نمایش درآمد. بخشی از بخش Zinemira که به تولیدات باسک اختصاص دارد، این فیلم برای جایزه Irizar برای [ ] رقابت می‌کند که بر اساس رمان تحسین‌شده همنام رامیرو پینیلا، مورچه‌های کور داستانی از بقا در دهه 1930 Biskaia است که در کشور باسک در سال 1930 اتفاق می‌افتد، داستانی به زبان انگلیسی روایت می‌شود. Biscay در طول یک طوفان شدید. مردم محلی آلگورتا با در اختیار داشتن تن‌ها زغال سنگ ارزشمند، برای نجات بخشی از آن تلاش می‌کنند تا به آنها کمک کنند تا در زمستان سخت جان سالم به در ببرند. خانواده Jauregui تصمیم می‌گیرند همه چیز را به خطر بیندازند و در طوفان بی‌امان جان سالم به در ببرند تا بخشی از طلای سیاه را حفظ کنند. تصمیم آنها منجر به عواقب غم انگیزی می شود که آنها را برای همیشه تغییر خواهد داد. داستان‌های مرتبط اسکار: مجارستان «دوست خاموش» ایلدیکو انیدی را برای مسابقه بین‌المللی فیلم انتخاب کرد (اختصاصی) اسکار: اسرائیل درام «همه چیز را به من بگو» برای مسابقه بین‌المللی فیلم برگزیده است. ما با Inurri Itsuak به این مهم دست یافتیم: فیلمی به زبان باسکی با جذابیت بین‌المللی و ارزش تولید بالا که داستانی را روایت می‌کند که عمیقاً در بافت محلی مانند رامیرو پینیلا ریشه دارد. لوئیس فر n تهیه کننده Lazona Zinema به ورایتی گفت که همکاری با Playtime برای فروش بین المللی و Buena Vista برای توزیع در اسپانیا به این فیلم کمک می کند تا به وسیع ترین مخاطب ممکن دست یابد. محبوب در Variety"}]

    const archiveManifest = [{"date_key": "2026-09-19", "p_date": "۲۸ شهریور ۱۴۰۵", "g_date": "۱۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-19.html"}, {"date_key": "2026-09-18", "p_date": "۲۷ شهریور ۱۴۰۵", "g_date": "۱۸ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-18.html"}, {"date_key": "2026-09-17", "p_date": "۲۶ شهریور ۱۴۰۵", "g_date": "۱۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-17.html"}, {"date_key": "2026-09-16", "p_date": "۲۵ شهریور ۱۴۰۵", "g_date": "۱۶ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-16.html"}, {"date_key": "2026-09-15", "p_date": "۲۴ شهریور ۱۴۰۵", "g_date": "۱۵ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-15.html"}, {"date_key": "2026-09-14", "p_date": "۲۳ شهریور ۱۴۰۵", "g_date": "۱۴ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-14.html"}, {"date_key": "2026-09-13", "p_date": "۲۲ شهریور ۱۴۰۵", "g_date": "۱۳ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-13.html"}, {"date_key": "2026-09-12", "p_date": "۲۱ شهریور ۱۴۰۵", "g_date": "۱۲ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-12.html"}, {"date_key": "2026-09-11", "p_date": "۲۰ شهریور ۱۴۰۵", "g_date": "۱۱ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
