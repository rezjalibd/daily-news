was already much higher, haven't benefited from the same extraordinary run-up. This can create a natural exit point for some employees who are weighing retirement. Zuhayeer Musa, cofounder of compensation-sharing site Levels.fyi, said Nvidia's rapid ascent can flip the effect of retention benefits, making some employees wealthy enough to leave. Levels.fyi data illustrate the scale of these windfalls, with a focus on larger initial grants for new hires. The median initial grant for a senior software engineer who joined the company in 2022 would be worth about $4.1 million today if they had held on to the shares, according to its analysis of offers submitted to the site. Some senior Nvidia leaders retired this year Another former employee described a similar calculus, saying they waited for a large quarterly vest before retiring, knowing their next stock payout would have been significantly smaller. The former employee described working at Nvidia as a 24/7 commitment, adding that it was exciting to culminate their career \"at the cente", "date_str": "2026-09-25T09:00:02+00:00", "hash": "6576e23d6f8a70f5", "title_fa": "رونق تاریخی سهام انویدیا در حال تبدیل دستبندهای طلایی آن به یک بلیط بیرون از در است", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا. بلومبرگ/گتی ایماژ رونق سهام انویدیا دستبندهای طلایی را به یک رمپ خروجی بالقوه تبدیل کرده است. برخی از کارمندان قدیمی زمان خروج خود را با جلیقه های سهام با ارزش تعیین کردند. برخی دیگر گفتند که سن و شدت شغل تصمیم به ترک را شکل داده است. برای برخی از کارمندان انویدیا، دستبندهای طلایی رونق هوش مصنوعی در حال باز شدن است. پس از نزدیک به یک دهه کار در انویدیا بر روی طراحی تراشه و مدل‌های هوش مصنوعی برای زیست‌شناسی، کن جانیک می‌خواست وقت خود را صرف چیزی معنادارتر کند. بنابراین این مرد 56 ساله در ماه آگوست شرکت را ترک کرد تا ابزار تحقیقاتی هوش مصنوعی خود به نام موسسه کایرن را راه‌اندازی کند که در آن پروژه‌هایی از کمک به افراد کم بینا تا مطالعه ارتباط نهنگ‌های عنبر را شامل می‌شود. جانیک گفت که سهام نقش مهمی در زمان خروج او ایفا کرده است، زیرا او قبل از خروج منتظر یک جلیقه ویژه با ارزش سهام در ماه ژوئن بود. او گفت که جلیقه بعدی او در سپتامبر مهم نیست. جانیک گفت: «من دیگر نیازی به کار ندارم. \"چرا سعی نکنم در زمانی که دارم بهترین کار را انجام دهم؟\" غول‌های فناوری از کمک‌های بلاعوض سهام استفاده می‌کنند که در طول زمان به عنوان یک استراتژی برای حفظ کارمندان می‌پردازند. در Nvidia، این سهام منفجر شده است. کمک‌های بلاعوض معمولاً در طول چهار سال اعطا می‌شوند، به این معنی که برخی از آنها در سال 2022 اعطا می‌شوند - قبل از اینکه ChatGPT رونق هوش مصنوعی را آغاز کند که باعث افزایش سهام شد - بسیار ارزشمند شدند و اکنون کاملاً به آنها اختصاص داده شده است. سهام انویدیا از پایان سال 2022 تقریباً 1400 درصد افزایش یافته است. کمک‌های بلاعوض که بعداً اعطا شد، زمانی که قیمت سهام انویدیا در حال حاضر"}, {"source": "Business Insider", "title": "She left her NYC teaching job to open a sewing studio. Here's how she did it.", "link": "https://www.businessinsider.com/nyc-teaching-job-quit-sewing-studio-2026-9", "summary": "Kate Saffady, 50, runs Brooklyn Stitch Studio full-time as of June 2026. Her revenue year-to-date is around $190,000. George Etheredge for BI Kate Saffady left teaching to manage her Brooklyn sewing studio full-time. Brooklyn Stitch Studio offers sewing classes for kids and adults. Saffady had to navigate NYC's business costs, balancing expenses and income to make it work. Tucked in a brick building in Carroll Gardens, Brooklyn, is a studio with four white walls with highlights of blue and purple furniture, where children go to sew. At the Brooklyn Stitch Studio, kids ages eight and up dedicate 90 minutes after school to working on self-directed projects — coming out with sweatshirts and zip pouches. The more sew-savvy kids help out those still trying to get over the learning curve — in the meantime, they form tight-knit groups, and although the shop's owner, Kate Saffady, encourages it, it seems to happen organically as they share the space, she said. This spring, Saffady saw that the studio was bringing in more revenue than her preschool teaching job, and in June, the 50-year-old left the classroom to run the studio full time. Brooklyn Stitch Studio is located inside Gowanus Creative Studios, a Brooklyn workspace complex. George Etheredge for BI In 2025, she earned almost $110,000 with her studio while working as a teacher. Year to date, Saffady has earned around $190,000 in revenue and expects additional income in November, when she begins booking the winter session. In addition to the after-school courses, Saffady also offers private sewing events, birthdays, and one-off adult workshops. She has done everything herself, from building her website to the business's accounting. \"This business is kind of hyperlocal, very specific to this area, so that's why I wanted Brooklyn in it,\" she said in reference to the studio's name. Saffady said she usually spends more on fabric for adult classes, since they have a wider range of aesthetics and tastes, while kids are usually easier to buy fabrics for. George Etheredge for BI Saffady is one of the business owners Business Insider has interviewed for our Cost of the City series, where we report on what it takes to make it work in New York City, one of the most expensive cities in the country. The Albany-born small-business owner moved to NYC in 1994. She has lived in Carroll Gardens, Brooklyn , for 25 years. Her mom was a quilter, and as an adult, Saffady practiced sewing on and off. Yet, it was only in 2019 that s", "date_str": "2026-09-25T09:00:01+00:00", "hash": "bbe34a618f1b0304", "title_fa": "او شغل تدریس در نیویورک را ترک کرد تا یک استودیوی خیاطی باز کند. در اینجا او چگونه این کار را انجام داد.", "summary_fa": "کیت صفادی، 50 ساله، از ژوئن 2026 استودیوی بروکلین استیچ را به طور تمام وقت اداره می کند. درآمد او از سال تا به امروز حدود 190000 دلار است. جورج اتریج برای BI کیت صفادی تدریس را ترک کرد تا استودیوی خیاطی خود در بروکلین را تمام وقت مدیریت کند. استودیو Brooklyn Stitch کلاس های خیاطی را برای کودکان و بزرگسالان ارائه می دهد. صفادی مجبور شد هزینه‌های تجاری نیویورک را هدایت کند، هزینه‌ها و درآمد را متعادل کند تا بتواند کار کند. در یک ساختمان آجری در Carroll Gardens، بروکلین، استودیویی با چهار دیوار سفید با برجسته‌ترین مبلمان آبی و بنفش قرار دارد که کودکان برای خیاطی به آنجا می‌روند. در استودیوی بروکلین استیچ، بچه‌های هشت ساله و بالاتر، 90 دقیقه بعد از مدرسه را به کار روی پروژه‌های خودگردان اختصاص می‌دهند - با پیراهن‌ها و کیسه‌های زیپی. او گفت که بچه‌های باهوش‌تر در زمینه خیاطی به کسانی کمک می‌کنند که هنوز سعی می‌کنند از منحنی یادگیری عبور کنند - در این بین، آنها گروه‌های محکمی تشکیل می‌دهند، و اگرچه صاحب مغازه، کیت صفادی، آن را تشویق می‌کند، اما به نظر می‌رسد که وقتی آنها فضای را به اشتراک می‌گذارند، این به طور ارگانیک اتفاق می‌افتد. در بهار امسال، صفادی دید که استودیو درآمد بیشتری نسبت به شغل معلمی پیش دبستانی او دارد و در ماه ژوئن، این خانم 50 ساله کلاس را ترک کرد تا استودیو را تمام وقت اداره کند. استودیو Brooklyn Stitch در داخل استودیو خلاق Gowanus، یک مجتمع فضای کاری بروکلین واقع شده است. جورج اتریج برای BI در سال 2025، در حالی که به عنوان معلم کار می کرد، تقریباً 110000 دلار با استودیوی خود به دست آورد. از سال تا به امروز، صفادی حدود 190000 دلار درآمد کسب کرده است و انتظار دارد در نوامبر، زمانی که رزرو جلسه زمستانی را آغاز می"}, {"source": "Business Insider", "title": "Russia's once-rare turbojet drones that fly twice as fast are now attacking Ukraine by the thousands", "link": "https://www.businessinsider.com/russia-once-rare-turbojet-shaheds-drones-attack-ukraine-thousands-2026-9", "summary": "A Russian Geran-5 drone, filmed by a Wild Hornets interceptor. Wild Hornets/Screenshot via X Russia's use of jet-powered drones against Ukraine has surged to over 2,000 a month. It's a sign that Moscow has greatly expanded access to engines and electronics it can't make at home. Ukraine reports intercepting only about 60% of drone attacks since turbojet threats surged this summer. New tallies from Kyiv show that Russia was able to bombard Ukraine with thousands of jet-powered attack drones — a rare weapon just a year-and-a-half ago — over the summer. Col. Yuriy Ignat, the main spokesperson for Ukraine's air force, told national broadcaster TSN on Wednesday that the Kremlin has launched 7,700 turbojet drones into Ukraine so far. The bulk of these appeared over the summer, surging from 350 jet-powered drones in June to 1,500 in July, before leaping to 2,850 in August, he said. Russia has launched 1,900 of the faster, more advanced drones so far this month. That means that at least half of all Russian long-range drone attacks, which include the Kremlin's versions of the Iranian-designed Shahed, consist of jet-powered systems. \"This suggests that the enemy is not stopping, that they are finding opportunities to purchase those jet engines, other components, and assemble them on the territory of Russia,\" Ignat said. Jet-powered drones have posed a particularly acute problem for Ukraine's air defenses, with the country still scrambling to find cheap, mass-producible countermeasures. A novelty in the war's earlier years, the drones drew wider attention at the start of 2025, when Ukrainian war observers began reporting increased sightings of Shahed drones equipped with jet engines. Their surge in production this year indicates that Russia has greatly expanded access to vital components that Ukrainian intelligence has repeatedly said Moscow can only procure on the global market. Ukraine has said that the jet engines, in particular, are sourced from China. Kyiv has said it has also found critical electronic components in the drones, such as digital signal processors, clock generators, and transceivers, originating from US or European firms. It's been a particular pain point for Ukraine, which has long warned that Russia's military production base has been able to evade international sanctions at a scale that allows it to mass-produce weapons with foreign parts. The Kremlin looks to be expanding production further. Politico reported last week on plans it acquired from", "date_str": "2026-09-25T05:41:26+00:00", "hash": "576c507b6dc49724", "title_fa": "پهپادهای توربوجت نادر روسیه که دو برابر سریعتر پرواز می کردند اکنون هزاران نفر به اوکراین حمله می کنند.", "summary_fa": "یک پهپاد روسی Geran-5 که توسط یک رهگیر Wild Hornets فیلمبرداری شده است. Wild Hornets/ اسکرین شات از طریق X استفاده روسیه از هواپیماهای بدون سرنشین جت علیه اوکراین به بیش از 2000 در ماه افزایش یافته است. این نشانه آن است که مسکو دسترسی به موتورها و وسایل الکترونیکی را که نمی تواند در خانه بسازد بسیار گسترش داده است. اوکراین گزارش می دهد که از زمان افزایش تهدیدات توربوجت در تابستان امسال، تنها حدود 60 درصد از حملات هواپیماهای بدون سرنشین را رهگیری کرده است. آمارهای جدید از کیف نشان می دهد که روسیه توانست اوکراین را با هزاران پهپاد تهاجمی جت - یک سلاح کمیاب فقط یک سال و نیم پیش - در تابستان بمباران کند. سرهنگ یوری ایگنات، سخنگوی اصلی نیروی هوایی اوکراین، روز چهارشنبه به تلویزیون ملی TSN گفت که کرملین تاکنون 7700 پهپاد توربوجت را به اوکراین پرتاب کرده است. او گفت که بخش عمده ای از این هواپیماها در تابستان ظاهر شدند و از 350 هواپیمای بدون سرنشین جت در ژوئن به 1500 پهپاد در ژوئیه رسیدند و در اوت به 2850 رسید. روسیه تاکنون 1900 پهپاد سریعتر و پیشرفته تر را در این ماه به فضا پرتاب کرده است. این بدان معناست که حداقل نیمی از حملات هواپیماهای بدون سرنشین دوربرد روسیه، که شامل نسخه‌های کرملین از شاهد طراحی ایران می‌شود، شامل سیستم‌های جت است. ایگنات گفت: «این نشان می‌دهد که دشمن متوقف نمی‌شود و فرصت‌هایی برای خرید موتورهای جت، سایر قطعات و مونتاژ آن‌ها در خاک روسیه پیدا می‌کند.» پهپادهای جت مشکلی به‌ویژه برای پدافند هوایی اوکراین ایجاد کرده‌اند و این کشور همچنان در تلاش برای یافتن اقدامات متقابل ارزان و تولید انبوه است. این پهپادها که در سال‌های اولیه جنگ، تازگی داشتند، در آغاز سال 2025 توجه بیشتری را به خود جلب کردند، زمانی که ناظران جنگ اوکراینی شروع به"}, {"source": "Business Insider", "title": "The who's who in tech showed up for Trump's dinner with Xi — with one glaring exception", "link": "https://www.businessinsider.com/tech-leaders-join-donald-trump-dinner-with-xi-jinping-2026-9", "summary": "Kevin Dietsch/Getty Images Donald Trump is hosting China's leader to discuss tariffs, critical minerals, and AI safety. The attendees included AMD CEO Lisa Su, OpenAI's Sam Altman, and Elon Musk. Here are the biggest names in tech who showed up for dinner at the White House. Donald Trump's dinner with China's leader, Xi Jinping, on Thursday was a glitzy gathering of the biggest names in tech. AMD CEO Lisa Su said during a fireside chat at the New York Stock Exchange that she will be attending Thursday's White House event, joining executives expected to include Nvidia's Jensen Huang, OpenAI's Sam Altman, Alphabet's Sundar Pichai, Tesla's Elon Musk, and Amazon founder Jeff Bezos. Dario Amodei, the Anthropic CEO who also led the call for more cautious AI development, was notably absent from the dinner. Plenty is riding on the talks. Washington and Beijing are negotiating amid a trade truce, with tariffs, critical minerals, and semiconductors among the issues at stake. The US has also proposed a channel for the two countries to notify each other about significant AI safety incidents, which remains under discussion. \"I think technology is one of those areas where we rely on the global ecosystem to come together,\" Su told Fox Business's Liz Claman in a fireside chat on Wednesday, adding she was \"honored\" to join the White House dinner. \"So, yes, I think we're anxiously looking at what will come out of it,\" Su said. \"And the truth is, we want to ensure that there's good stability across the global ecosystem as it relates to technology.\" The seating arrangement Kevin Dietsch/Getty Images In clockwise order, Trump's table consisted of himself, first lady Melania Trump, Musk, Su and her spouse, Daniel Lin, Jensen Huang and his spouse, Lori Huang, former Apple CEO Tim Cook , China's first lady Peng Liyuan, and China's leader Xi Jinping. Vice President JD Vance and Usha Vance were seen seated at a different table to the right. Altman spotted chatting with Mark Zuckerberg Brendan SMIALOWSKI / AFP via Getty Images The two tech CEOs have both recently weighed in on AI safety issues, as the topic is expected to be discussed with China's leader. Altman has backed setting shared safety standards, including rules for when companies should slow or stop developing more powerful models, while Zuckerberg has said that AI labs have strong incentives to make their models safe and can decide for themselves when to slow down. Jensen Huang spoke to other guests at the center table Ke", "date_str": "2026-09-25T04:40:48+00:00", "hash": "3dcf9524cbc777a6", "title_fa": "کسی که در فناوری برای شام ترامپ با شی حاضر شد - با یک استثنای آشکار", "summary_fa": "کوین دیچ/ گتی ایماژ دونالد ترامپ میزبان رهبر چین است تا درباره تعرفه ها، مواد معدنی حیاتی و ایمنی هوش مصنوعی گفتگو کند. شرکت کنندگان شامل لیزا سو، مدیر عامل AMD، سم آلتمن از OpenAI و ایلان ماسک بودند. در اینجا بزرگ‌ترین نام‌های فناوری که برای شام در کاخ سفید حاضر شدند، آمده‌اند. شام دونالد ترامپ با شی جین پینگ، رهبر چین در روز پنجشنبه، گردهمایی پر زرق و برقی از بزرگ‌ترین نام‌های فناوری بود. لیزا سو، مدیر عامل AMD، طی یک گفتگوی آتشین در بورس نیویورک گفت که در رویداد روز پنجشنبه کاخ سفید شرکت خواهد کرد و به مدیرانی خواهد پیوست که انتظار می‌رود جنسن هوانگ انویدیا، سم آلتمن از OpenAI، ساندار پیچای آلفابت، ایلان ماسک تسلا و جف بزوس بنیانگذار آمازون باشند. داریو آمودی، مدیر عامل آنتروپیک که همچنین دعوت به توسعه هوش مصنوعی محتاطانه‌تر را رهبری می‌کرد، به‌طور مشخص در این شام غایب بود. بسیاری بر مذاکرات سوار هستند. واشنگتن و پکن در بحبوحه آتش بس تجاری با تعرفه ها، مواد معدنی حیاتی و نیمه هادی ها از جمله موضوعات مورد بحث در حال مذاکره هستند. ایالات متحده همچنین کانالی را برای دو کشور پیشنهاد کرده است تا یکدیگر را در مورد حوادث مهم ایمنی هوش مصنوعی مطلع کنند که همچنان در حال بحث است. سو به لیز کلامن از فاکس بیزینس روز چهارشنبه در یک گفتگوی کنار آتش گفت: «فکر می‌کنم فناوری یکی از آن حوزه‌هایی است که ما به اکوسیستم جهانی برای گردهم آمدن تکیه می‌کنیم. سو گفت: «بنابراین، بله، من فکر می‌کنم که ما با نگرانی به دنبال این هستیم که چه چیزی از آن بیرون خواهد آمد. و حقیقت این است که ما می خواهیم اطمینان حاصل کنیم که ثبات خوبی در سراسر اکوسیستم جهانی در ارتباط با فناوری وجود دارد. چیدمان صندلی کوین دیچ/گتی ایماژ به ترتیب عقربه های ساعت، میز"}, {"source": "Business Insider", "title": "Diane von Furstenberg, 79, says she never felt guilty about choosing work over her kids", "link": "https://www.businessinsider.com/diane-von-furstenberg-never-felt-mom-guilt-working-career-parenting-2026-9", "summary": "Diane von Furstenberg said she spoke to her children like adults from the start, just as her mother had done with her. Stefanie Keenan/Getty Images for DVF Diane von Furstenberg said she didn't experience mom guilt when work took her away from her kids. She said she did the best she could and is proud of how her children turned out. The fashion designer said she does not believe in helicopter parenting. Diane von Furstenberg , 79, said she believes she did a good job raising her kids as a working mom . On Thursday's episode of the \" Aspire with Emma Grede \" podcast, von Furstenberg spoke about how she managed motherhood while building her fashion empire. \"If you talk to my children, I was never there,\" von Furstenberg told podcast host Emma Grede . \"But if I look at the results, God bless them. They're wonderful, and now they are fully grown-up, parents of adults, and we speak every single day.\" Von Furstenberg shares two children with her ex-husband, Prince Egon von Furstenberg, whom she divorced in 1983. He died in 2004. The fashion designer said she has no regrets about how she raised her kids and that she is \"a good mom.\" She said she was also more present for them than they gave her credit for: \"I think I was more there than they think, and I would never abandon them.\" Von Fustenberg said she's also \"very proud\" of her kids and the parents that they've become. \"For example, Alexander will say that I never went to a game,\" she said, adding that she simply wasn't interested in attending. \"But, as a result, he goes to every game of every child.\" Despite juggling her career with raising two children, von Furstenberg said she has never experienced mom guilt . \"Guilt is not an option. Guilt and fear,\" she said. \"I did the best I could. They came with me. I mean, I went on business trips in Japan, I took them along. I did the best I could, but guilt, no.\" Von Furstenberg said she spoke openly with her children about why work sometimes took her away, and encouraged other parents to do the same. \"You go to school, I go to work, and then you have a conversation,\" she said, adding that she spoke to her children like adults from the start, just as her own mother had done with her. Von Furstenberg added she doesn't agree with helicopter parenting because she believes a parent's role is to teach kids to stand on their own. \"You give them love, values, and you make them independent,\" she said. The designer has previously pushed back on the idea that mothers should f", "date_str": "2026-09-25T04:26:59+00:00", "hash": "d099c2212d062cad", "title_fa": "دایان فون فورستنبرگ، 79 ساله، می‌گوید که هرگز از انتخاب شغل به جای فرزندانش احساس گناه نکرده است", "summary_fa": "دایان فون فورستنبرگ گفت که از همان ابتدا با فرزندانش مانند بزرگسالان صحبت می کرد، درست همانطور که مادرش با او رفتار کرده بود. استفانی کینان/ گتی ایماژ برای DVF دایان فون فورستنبرگ گفت که وقتی کار او را از فرزندانش دور کرد، احساس گناه مادر را تجربه نکرد. او گفت که بهترین کار ممکن را انجام داده است و به این که فرزندانش موفق شدند افتخار می کند. این طراح مد گفت که به فرزندپروری با هلیکوپتر اعتقادی ندارد. دایان فون فورستنبرگ، 79 ساله، گفت که معتقد است در تربیت فرزندانش به عنوان یک مادر شاغل کار خوبی انجام داده است. فون فورستنبرگ در قسمت پنجشنبه پادکست \"آرزو با اما گرید\" در مورد چگونگی مدیریت مادری در حین ساختن امپراتوری مد خود صحبت کرد. فون فورستنبرگ به مجری پادکست اما گرید گفت: «اگر با فرزندانم صحبت کنید، من هرگز آنجا نبودم. «اما اگر به نتایج نگاه کنم، خدا به آنها برکت دهد. آن‌ها فوق‌العاده هستند، و اکنون کاملاً بزرگ شده‌اند، والدین بزرگسالان، و ما هر روز با هم صحبت می‌کنیم.\" این طراح مد گفت که از نحوه تربیت فرزندانش پشیمان نیست و \"مادر خوبی\" است. او گفت که بیشتر از آنچه که آنها به او اعتبار می دهند برای آنها حضور داشته است: \"فکر می کنم بیشتر از آنچه آنها فکر می کنند آنجا بودم و هرگز آنها را رها نمی کنم.\" فون فوستنبرگ گفت که او همچنین به فرزندانش و والدینی که تبدیل شده اند \"بسیار افتخار می کند\". او گفت: «به عنوان مثال، الکساندر خواهد گفت که من هرگز به بازی نرفتم. اما، در نتیجه، او به هر بازی از هر کودک می رود. فون فورستنبرگ علیرغم اینکه در حرفه خود با تربیت دو فرزند دستکاری کرده است، گفت که هرگز احساس گناه مادر را تجربه نکرده است. او گفت: \"گناه یک گزینه نیست. گناه و ترس.\""}, {"source": "Business Insider", "title": "Some say Taylor Swift is doing too much to stay in the spotlight. What if she just loves her job?", "link": "https://www.businessinsider.com/taylor-swift-showgirl-deluxe-productivity-criticisms-2026-9", "summary": "Taylor Swift wears an orange dress onstage at the Eras Tour. Vittorio Zunino Celotto/TAS24/Getty Images for TAS Rights Management Taylor Swift has released a deluxe version of \"The Life of a Showgirl,\" featuring four new tracks. Despite criticism of Swift's prolificacy and success, she clearly has a passion for making music. Even if every song isn't a winner, Swift makes it fun to be a fan because she loves her job. It's a good day to be a Swiftie, but these days, that's hardly unusual. On Friday, Taylor Swift released \"The Life of a Showgirl: The Encore,\" a deluxe version of her 2025 album, featuring four brand-new tracks. Two days later, the music video for \"Patient Zero\" will premiere at the MTV Video Music Awards. Now, \"The Life of a Showgirl\" is far from my favorite album , but I'm hardly the type to turn down fresh music. Indeed, \"It's a good day to be a Swiftie\" has almost become a stock phrase in my Swift-friendly group chats, thanks to the pop star's peerless prolificacy. Swift has released five studio albums in the last six years alone, in addition to four \"Taylor's Version\" rerecords and a generous helping of No. 1 hits . She announced the \"Showgirl\" deluxe on Wednesday — shocking and delighting fans who didn't expect to receive new music so soon. Of course, as with everything Swift does, it's a polarizing move. Not everyone is quite so charmed by her output. There's a popular, exasperated narrative that's plagued Swift since the 2023-2024 Eras Tour dominated the cultural landscape and became the highest-grossing tour of all time. It also yielded two concert films, a docuseries, a best-selling book , and two new albums: Swift released the 31-track behemoth \" The Tortured Poets Department \" in the middle of her two-year trek, and its successor, \"Showgirl,\" mere months after her final bow. The Life of a Showgirl was released on October 3, 2025. Mert Alas Marcus Piggott/TAS Rights Management Now, a year after she pledged that its 12-song tracklist was set in stone, Swift has added four more songs — written and recorded during a celebratory trip with her Swedish collaborators, she said, after \"Showgirl\" sold more copies in its first week than any other album in history. \"Really, we just wanted to reflect and take in how grateful we were for the moment we were in,\" Swift explained in her announcement , \"but there was a studio there, and we did what we do when we feel anything at all: We wrote more songs.\" So the popular narrative among critics — and ", "date_str": "2026-09-25T04:13:01+00:00", "hash": "5805b372933bc5ba", "title_fa": "برخی می گویند تیلور سوئیفت بیش از حد تلاش می کند تا در کانون توجه بماند. اگر او فقط کارش را دوست داشته باشد چه؟", "summary_fa": "تیلور سوئیفت در تور Eras روی صحنه لباس نارنجی می پوشد. ویتوریو زونینو سلوتو/TAS24/گتی ایماژ برای مدیریت حقوق TAS تیلور سویفت نسخه لوکس «زندگی یک دختر نمایشی» را منتشر کرده است که شامل چهار آهنگ جدید است. علیرغم انتقادهایی که نسبت به موفقیت و موفقیت سوئیفت وجود دارد، او به وضوح علاقه زیادی به ساخت موسیقی دارد. حتی اگر هر آهنگی برنده نباشد، سوئیفت طرفدار بودن را سرگرم کننده می کند زیرا او عاشق کارش است. روز خوبی برای سوئیفتی بودن است، اما این روزها، به سختی غیرعادی است. روز جمعه، تیلور سوئیفت \"زندگی یک دختر نمایشگر: The Encore\" را منتشر کرد، نسخه لوکس آلبوم 2025 خود، که شامل چهار آهنگ کاملاً جدید است. دو روز بعد، موزیک ویدیوی «بیمار صفر» در مراسم جوایز موسیقی ویدیوی ام تی وی به نمایش درخواهد آمد. اکنون، \"زندگی یک دختر نمایشی\" با آلبوم مورد علاقه من فاصله زیادی دارد، اما من به سختی از آن دسته ای هستم که موسیقی تازه را رد کنم. در واقع، \"روز خوبی برای سوئیفتی شدن است\" به لطف پربار بودن ستاره پاپ تقریباً به یک عبارت سهام در چت های گروهی من برای سوئیفت تبدیل شده است. سوئیفت تنها در شش سال گذشته پنج آلبوم استودیویی منتشر کرده است، علاوه بر این، چهار آلبوم دوباره ضبط شده \"نسخه تیلور\" و کمک سخاوتمندانه ای از موفقیت های شماره 1. او روز چهارشنبه لوکس \"شوگرل\" را اعلام کرد - طرفدارانی که انتظار نداشتند به این زودی موسیقی جدیدی دریافت کنند، شوکه کننده و خوشحال کننده است. البته، مانند هر کاری که سوئیفت انجام می دهد، این یک حرکت قطبی است. همه از خروجی او چندان مجذوب نمی شوند. روایتی پرطرفدار و خشمگین وجود دارد که از زمانی که تور Eras 2023-2024 بر چشم انداز فرهنگی تسلط داشت و به پردرآمدترین تور تمام دوران تبدیل شد، گریبانگیر سوئیفت شده است."}, {"source": "Business Insider", "title": "I spent months traveling solo around Asia. A trip with a friend showed me how much I'd changed.", "link": "https://www.businessinsider.com/solo-travel-around-asia-changed-travels-with-friends-2026-9", "summary": "Macie Strum finds solo traveling less stressful. Provided by Macie Strum Macie Strum has been traveling alone for eight years. During a trip to Japan, she realized that traveling with a friend was more stressful than traveling on her own. Now, she credits years of solo travel for helping her gain more trust in herself. After spending two months traveling alone through Thailand and Vietnam in early 2024, I went to Japan to meet a friend. I was excited, but within days, traveling with someone else felt more stressful than being on my own. For months, I'd made every decision myself: when to wake up, where to eat, and how to spend the day. I could change plans on a whim. Suddenly, every choice involved another person. After months of solo travel, apparently, I'd become terrible at compromising. Just a few months earlier, I'd been laid off from a job that hadn't made me happy for some time. I'd wanted to quit after a year and spend months traveling around Asia; losing my job simply sped up that plan. Within four months, I sold my furniture, found someone to take over my lease, and boarded a one-way flight to South Korea in April 2024, unsure when I would return home. I'd traveled alone before, but never for this long. I'd never felt I had to wait for someone else to see the places on my bucket list. And, for the first time, I wasn't squeezing travel into PTO or college breaks, or planning a short trip around friends' schedules. I had months ahead of me — and no one else's timetable to consider. Strum found traveling with her friend in Japan stressful after being on her own. Provided by Macie Strum At first, I was nervous about traveling alone I could wake up without a packed itinerary, stay longer when I loved a place, or rearrange my plans without consulting anyone. If I wanted pad see ew from the same Bangkok restaurant every day, I could. If I wanted to spend hours at the War Remnants Museum in Ho Chi Minh City, I didn't have to worry about someone else being ready to leave. And when I met a great group of people at a hostel in Ninh Binh, I simply changed my schedule. I didn't realize how normal that freedom had become until I met my friend to travel in Japan . We had a great trip, but our travel styles didn't always align. I preferred social hostels; she was more comfortable in hotels. I could have happily eaten wagyu every night, while she — reasonably — suggested breaks from that much meat. She was right. It was just so delicious. These compromises weren'", "date_str": "2026-09-25T04:03:45+00:00", "hash": "d07cb45f1d7e4d7a", "title_fa": "من ماه ها را صرف سفر انفرادی در سراسر آسیا کردم. سفر با یکی از دوستانم به من نشان داد که چقدر تغییر کرده ام.", "summary_fa": "مکی استرام سفر انفرادی را کمتر استرس زا می داند. ارائه شده توسط Macie Strum Macie Strum به مدت هشت سال به تنهایی سفر می کند. در سفر به ژاپن، او متوجه شد که سفر با یک دوست استرس‌زاتر از سفر به تنهایی است. اکنون، او سال‌ها سفر انفرادی را به خاطر کمک به او برای جلب اعتماد بیشتر به خودش می‌داند. پس از گذراندن دو ماه در سفر به تنهایی از طریق تایلند و ویتنام در اوایل سال 2024، برای ملاقات با یکی از دوستانم به ژاپن رفتم. من هیجان زده بودم، اما در عرض چند روز، سفر با شخص دیگری استرس بیشتری نسبت به تنهایی داشتم. ماه‌ها تمام تصمیم‌هایم را خودم گرفته بودم: کی از خواب بیدار شوم، کجا غذا بخورم، و روز را چگونه بگذرانم. می‌توانستم برنامه‌ها را از روی هوس تغییر دهم. ناگهان هر انتخابی درگیر شخص دیگری بود. پس از ماه‌ها سفر انفرادی، ظاهراً در سازش کردن بسیار بد می‌شدم. همین چند ماه قبل، از کاری اخراج شده بودم که مدتی بود خوشحالم نمی کرد. می‌خواستم بعد از یک سال کار را ترک کنم و ماه‌ها را در سفر به آسیا بگذرانم. از دست دادن شغلم به سادگی این برنامه را تسریع کرد. ظرف چهار ماه، اثاثیه‌ام را فروختم، کسی را پیدا کردم که اجاره‌ام را به عهده بگیرد و در آوریل 2024 سوار یک پرواز یک طرفه به کره جنوبی شدم، مطمئن نبودم چه زمانی به خانه برمی‌گردم. قبلا به تنهایی سفر کرده بودم، اما هرگز برای این مدت طولانی. هرگز احساس نمی‌کردم که باید منتظر شخص دیگری باشم تا مکان‌های فهرست سطل من را ببیند. و، برای اولین بار، من سفر به PTO یا تعطیلات دانشگاه را فشرده نمی‌کردم، یا برای یک سفر کوتاه بر اساس برنامه دوستان برنامه‌ریزی نمی‌کردم. من ماه ها در پیش داشتم - و هیچ کس دیگر برنامه زمانی"}, {"source": "Business Insider", "title": "I've spent 190 hours on long-haul flights. These carry-on essentials make the journey more bearable.", "link": "https://www.businessinsider.com/carry-on-packing-list-for-a-long-haul-flight-2026-9", "summary": "Long-haul flights can be easier if you pack comforting and entertaining essentials in your carry-on, according to Business Insider s travel reporter. Joey Hadden/Business Insider On long-haul flights, your carry-on is more than a bag — it's a survival kit. It should include everything you might need to stay comfortable, entertained, and refreshed. My packing list could make a long journey feel a little shorter. Focus on what you can control and let the rest go. I've heard countless versions of this advice throughout my life, and it gets me through my most stressful moments. Enter the long-haul flight — my least favorite part of any faraway vacation. I can't make planes leave on time. I can't change the crowds in the terminal, the size of my seat, or the turbulence of the air. But I can decide what's in my carry-on . Taking flights six hours or longer from my home in New York City to Germany, Switzerland, Canada, and the Pacific Islands taught me exactly what to pack to make the trip as smooth as possible. After 190 hours of long-distance flying, these are the things I'll always bring with me, no matter the destination. A refillable water bottle is a must. Joey Hadden/Business Insider Low humidity and high altitudes can cause dehydration in aircraft cabins. I feel that acutely on longer flights. A reusable bottle will help you save money and plastic on these journeys. To keep your skin hydrated, I recommend slipping some lip balm and lotion in your carry-on, too. Joey Hadden/Business Insider Some long-haul flights I've taken have had lotion and face mist in the cabin bathrooms, but I wouldn't count on it. And since lip balm is so small, I typically bring two or three in case I lose one. You should also bring Advil. Crystal Cox/Business Insider Dry air on planes could cause migraines so it's important to bring medicine, in case your headache is unbearable. That is, if you take meds for stuff like that. Don t forget your toothbrush. Ross D. Franklin/AP Images Some of my trips have been so far away that I had to take three long flights over a 24-hour period. I don't normally go 24 hours without brushing my teeth, and if you don't either, I'd suggest bringing a toothbrush. Though it won t satisfy a craving for clean teeth, a pack of gum is always helpful for fresh breath. Roman Samokhin/Shutterstock Gum also helps combat ear-popping during changes in air pressure. I recommend bringing a change of clothes if your trip has layovers. Joey Hadden/Business Insider Y", "date_str": "2026-09-24T23:44:02+00:00", "hash": "95cd45a8a4f3a7a9", "title_fa": "من 190 ساعت را در پروازهای طولانی مدت صرف کرده ام. این وسایل ضروری سفر را قابل تحمل تر می کند.", "summary_fa": "به گزارش خبرنگار مسافرتی Business Insider، اگر وسایل ضروری و سرگرم کننده را در چمدان خود بچسبانید، پروازهای طولانی مدت می توانند آسان تر شوند. Joey Hadden/Business Insider در پروازهای طولانی مدت، چمدان شما چیزی فراتر از یک کیف است – این یک کیت بقا است. این باید شامل همه چیزهایی باشد که ممکن است برای راحت ماندن، سرگرمی و شادابی نیاز داشته باشید. لیست بسته بندی من می تواند یک سفر طولانی را کمی کوتاه تر کند. روی آنچه می توانید کنترل کنید تمرکز کنید و بقیه را رها کنید. من نسخه‌های بی‌شماری از این توصیه را در طول زندگی‌ام شنیده‌ام، و این من را از پر استرس‌ترین لحظاتم عبور می‌دهد. وارد پرواز طولانی‌مدت شوید - کمترین قسمت مورد علاقه من در هر تعطیلات دور. من نمی توانم هواپیماها را به موقع ترک کنم. من نمی توانم شلوغی ترمینال، اندازه صندلی ام یا تلاطم هوا را تغییر دهم. اما من می توانم تصمیم بگیرم که در چمدانم چه چیزی باشد. پروازهای شش ساعته یا بیشتر از خانه ام در شهر نیویورک به آلمان، سوئیس، کانادا و جزایر اقیانوس آرام به من آموخت که دقیقاً چه وسایلی را بپوشم تا سفر را تا حد امکان راحت کنم. پس از 190 ساعت پرواز در مسافت طولانی، اینها چیزهایی هستند که من همیشه با خود خواهم آورد، بدون توجه به مقصد. یک بطری آب قابل شارژ مجدد ضروری است. جوی هادن/Business Insider رطوبت کم و ارتفاع زیاد می تواند باعث کم آبی در کابین هواپیما شود. در پروازهای طولانی تر این را به شدت احساس می کنم. یک بطری قابل استفاده مج ing only thrift store digs is another badge of honor: Look how hard they're locking in, they won't even spend money on new clothes. Add to that Gen Z's general love of secondhand shopping. Oh, you got that from Shein? Do you want the planet to combust? Despite all the internet sleuthing about how Wang's T-shirt is probably $800 from a designer label, I fully believe that he did, in fact, source it from an overpriced thrift store in Northern California. (I reached out to Meta and Wang, but didn't hear back.) I've spent a significant amount of time in Lake Tahoe , the place whose name adorns the sleeve of his graphic tee. I can confirm the design is exactly the type you'd expect from a place where local bumper stickers read, \"Go back to the Bay.\" Crocs have been hot with Gen Z since at least the pandemic — Piper Sandler found they were the No. 6 favorite footwear brand among teens in 2023, and this year, the brand said it had its first billion-dollar quarter in revenue. Make no mistake: This is a deeply Gen Z-coded outfit. \"What's happening with that outfit, whether he means to or not, is he's emphasizing his age,\" said Daniel James Cole, a fashion historian and professor at New York University. Cole said he's seen students around the campus where he teaches throw on similar fits, matching their outf", "date_str": "2026-09-24T23:10:25+00:00", "hash": "1fd8dd1897c9cdcc", "title_fa": "الکساندر وانگ یک نماد سبک نیست. او فقط یک پسر جنرال Z است.", "summary_fa": "الکساندر وانگ، افسر ارشد هوش مصنوعی متا، در Meta Connect 2026، مارک زاکربرگ صاحب تی شرت سفید نیست. الکساندر وانگ نیز صاحب ظاهری از مغازه‌های صرفه‌جویی نیست. اکنون مردان Gen Z اینگونه لباس می پوشند. اکثر آنها آن را در یک کنفرانس کاری که در آن ارائه می کنند نمی پوشند، اما من پرت می شوم. شما می توانید مد \"بد\" ژنرال Z را هرچه می خواهید دلقک کنید. فقط قرار است بیشتر نمایان شود. یونیفرم مرد فناوری پر از تی‌شرت‌های ساده و مدل‌های موی بد است، بنابراین می‌دانم که چرا نگاه الکساندر وانگ به متا کانکت، دره سیلیکون را مخد لای صفحه حفظ کرده است. اگر خانواده کوچک تری دارید یا تنها قهوه خور خانه خود هستید، زجیروشی زوتو جمع و جور، نایب قهرمان شایسته ای است. مهم نیست که کدام یک از این ماشین‌ها را خریداری می‌کنید، می‌توانید اطمینان داشته باشید که توصیه‌های ما بر اساس ارزیابی‌های واقعی زمان دم کردن، دمای آب (با هدف استاندارد ۱۹۵ درجه فارنهایت تا ۲۰۵ درجه فارنهایت تنظیم شده توسط انجمن تخصصی قهوه (SCA) برای استخراج طعم بهینه)، حفظ حرارت، قابلیت استفاده طولانی‌مدت و"}, {"source": "Business Insider", "title": "Peter Thiel says America's anti-AI backlash is a self-inflicted wound", "link": "https://www.businessinsider.com/peter-thiel-ai-backlash-united-states-china-2026-9", "summary": "Peter Thiel told Mathias Döpfner that blaming China for AI backlash was too easy. Niels Starnick/Niels Starnick/BILD Peter Thiel said he doesn't believe China to be the driving force behind anti-AI sentiment in the US. \"This is mainly what we're doing to ourselves,\" he said. Thiel railed against the Pope, calling him a \"useful idiot for the CCP.\" Americans are souring on AI. Peter Thiel said the US mostly has itself to blame, not China. A growing cohort of tech executives blame China, America's AI adversary, for people turning on the tech. Executives from Garry Tan to Kevin O'Leary have accused data center discourse of being a psyop. In a conversation on Axel Springer CEO Mathias Döpfner's \"MD Meets\" podcast , Thiel said that while he was \"inclined to believe\" China could be fueling anti-AI content in the US — it wasn't the driving force of the change in sentiment. \"This is mainly what we're doing to ourselves,\" said Thiel. \"It's often somewhat too easy to simply blame it on China.\" Thiel is a fierce critic of China , and he made that clear in the interview. Thiel also criticized Pope Leo XIV's AI encyclical published in May. The investor said it was anti-AI and that Americans were more likely to listen to the Pope than any social media posts from China. That means the Pope has the \"effect\" of working for the CCP, he said. \"I'm not saying he was an agent of the communists,\" Thiel said, \"but he was at least acting as a useful idiot for the CCP.\" Other tech CEOs have questioned and criticized the Pope's encyclical. The Holy See did not respond to a request for comment from Business Insider. Still, Thiel believed the biggest contributor to AI skepticism in the US is … the US. \"I think there's so many of these things that we're doing to ourselves,\" he told Döpfner. Döpfner interviewed the PayPal cofounder ahead of a Thursday event in Berlin where Thiel received the media company's \"Axel Springer Award,\" which honors \"individuals whose achievements have had a lasting impact on business, society, or technological progress.\" Axel Springer, which, among other publications, owns Business Insider, Politico, The Daily Telegraph, and Bild, previously bestowed the award on business leaders including Meta CEO Mark Zuckerberg , SpaceX CEO Elon Musk, and OpenAI CEO Sam Altman. Read the original article on Business Insider", "date_str": "2026-09-24T21:18:38+00:00", "hash": "0e552891692dbef8", "title_fa": "پیتر تیل می گوید واکنش متقابل آمریکا علیه هوش مصنوعی یک زخم خودساخته است", "summary_fa": "پیتر تیل به Mathias Döpfner گفت که سرزنش چین به دلیل واکنش شدید هوش مصنوعی بسیار آسان است. نیلز استارنیک/نیلز استارنیک/BILD پیتر تیل گفت که معتقد نیست چین نیروی محرکه احساسات ضد هوش مصنوعی در ایالات متحده باشد. او گفت: «این عمدتاً کاری است که ما با خودمان انجام می دهیم. تیل علیه پاپ انتقاد کرد و او را یک \"احمق مفید برای ح‌ک‌چ\" خواند. آمریکایی ها از هوش مصنوعی رنج می برند. پیتر تیل گفت که ایالات متحده بیشتر خود را مقصر می داند نه چین. گروه رو به رشدی از مدیران فناوری، چین، دشمن هوش مصنوعی آمریکا، را به خاطر استفاده از این فناوری مقصر می دانند. مدیران اجرایی از گری تان تا کوین اولری، گفتمان مرکز داده را به روانی بودن متهم کرده اند. تیل در گفتگو با پادکست \"MD Meets\" مدیر عامل شرکت Axel Springer Mathias Döpfner گفت که در حالی که او \"مایل است باور کند\" چین می تواند محتوای ضد هوش مصنوعی را در ایالات متحده تقویت کند - این نیروی محرکه تغییر در احساسات نبود. تیل گفت: «این عمدتاً همان کاری است که ما با خودمان انجام می دهیم. اغلب تا حدودی خیلی آسان است که آن را به سادگی به گردن چین انداخت. تیل یک منتقد سرسخت چین است، و او این را در مصاحبه به وضوح بیان کرد. تیل همچنین از بخشنامه هوش مصنوعی پاپ لئو چهاردهم که در ماه می منتشر شد انتقاد کرد. این سرمایه گذار گفت که این ضد هوش مصنوعی است و آمریکایی ها بیشتر از هر پست رسانه اجتماعی از چین به صحبت های پاپ گوش می دهند. او گفت که این بدان معناست که پاپ \"اثر\" کار برای ح‌ک‌چ را دارد. تیل گفت: \"من نمی گویم که او عامل کمونیست ها بود، اما او حداقل به عنوان یک احمق مفید برای ح‌ک‌چ عمل می کرد.\""}, {"source": "Business Insider", "title": "Best 65-inch TVs of 2026", "link": "https://www.businessinsider.com/guides/tech/best-65-inch-tv", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We reviewed 65-inch TVs from brands like Sony and LG to find the best models for different needs. Steven Cohen/Business Insider For many rooms, a 65-inch TV offers an ideal balance between size and performance. This tier is large enough to immerse you in movies, games, and sports without completely taking over your space. But figuring out which models are actually worth the money isn't always straightforward. Specs and marketing claims only tell part of the story, which is why my team and I test popular models year-round to find the best 65-inch TVs you can buy. If you want the quick answer, the Samsung S90F 4K TV is my top pick overall. Its OLED panel delivers excellent contrast with deep black levels, and its quantum dot tech helps colors look rich and vibrant. If you're trying to spend less, the TCL QM6K 4K TV is a good alternative. It's not as bright as pricier models, but it offers impressive performance for the money. I've been reviewing home entertainment gear for more than a decade, and that experience helps me spot a TV's strengths and weaknesses. The best 65-inch or US administration official, both of whom were granted anonymity to describe the request. The request, which came from the Office of the National Cyber Director, puts companies in the difficult position of having to choose between withholding their models from UK's AI Security Institute — one of the most well-resourced government testing agencies in the world which previously enjoyed privileged early access to models — or risk upsetting the Trump White House. The senior administration official said the White House wants the US to review the models and take steps to make sure US systems are secure before the models are shared with US partners. \"Because they're American companies and this has been our policy with every new frontier model that comes out,\" the senior official explained. The White House did not immediately respond to a request for comment. Anthropic appears to have agreed to the request, so far. The company did not provide its Claude Mythos 5.1 model to UK AISI, saying in its announcement that the model was \"only available to a set of US organizations.\" \"We're coordinating with the US government to expand access to a broader set of domestic and international partners as quickly as possible,\" an Anthropic blog announcing the model reads. Anthropic declined to comment for this piece. In a letter to a UK parliamentary committee earlier this month, AISI Director Henry de Zoete acknowledged the lack of access to Anthropic's model, but said: \"We maintain strong relationships with all frontier AI developers and continue to have prerelease access to some of the world's most capable models,\" pointing out that it tested OpenAI's GPT-6 Astra model ahead of release. \"The trusted relationships AISI holds enable us to test a range of models that represent industry-wide cap", "date_str": "2026-09-24T20:48:43+00:00", "hash": "0d669fada2070be7", "title_fa": "منابع می‌گویند کاخ سفید از OpenAI و Anthropic می‌خواهد تا مدل‌های جدید آزمایش‌کننده‌های بریتانیا را تا زمان بررسی ایالات متحده نگه دارند.", "summary_fa": "پرزیدنت دونالد ترامپ و سام آلتمن، مدیر عامل OpenAI در طی یک نشست ناهار در اجلاس G7، در فرانسه، در 17 ژوئن 2026 لودویک مارین / خبرگزاری فرانسه از طریق Getty Images منابع به پولیتیکو گفتند که کاخ سفید برای اولین بار به دنبال دسترسی به مدل های OpenAI و Anthropic جدید قبل از بریتانیا است. رهبران بریتانیا خواستار مجموعه ای مشترک از اصول جهانی هستند. این درخواست در حالی است که کاخ سفید تلاش می‌کند تا نحوه مدیریت مدل‌های جدید و قدرتمند هوش مصنوعی را مشخص کند. POLITICO به نقل از یک فرد آشنا و یک مقام ارشد دولت ایالات متحده که هر دوی آنها درخواستی را برای انجام آزمایش‌ها انجام داده‌اند، گزارش داد که کاخ سفید از OpenAI و Anthropic خواسته است تا مدل‌های هوش مصنوعی جدید خود را با آژانس آزمایشی دولت بریتانیا به اشتراک نگذارند تا زمانی که مدل‌ها با دولت ایالات متحده آزمایش شوند. این درخواست که از سوی دفتر مدیر ملی سایبری ارائه شد، شرکت‌ها را در موقعیت دشواری قرار می‌دهد که مجبور باشند مدل‌های خود را از مؤسسه امنیت هوش مصنوعی بریتانیا خودداری کنند - یکی از منابع خوب ترین آژانس‌های آزمایش دولتی در جهان که قبلاً از دسترسی اولیه ممتاز به مدل‌ها برخوردار بودند - یا خطر ناراحت کردن کاخ سفید ترامپ. این مقام ارشد دولت گفت کاخ سفید از ایالات متحده می‌خواهد که مدل‌ها را بررسی کند و اقداماتی را برای اطمینان از ایمن بودن سیستم‌های ایالات متحده قبل از به اشتراک گذاشتن مدل‌ها با شرکای آمریکایی انجام دهد. این مقام ارشد توضیح داد: «زیرا آنها شرکت‌های آمریکایی هستند و این سیاست ما در مورد هر مدل مرزی جدیدی بوده است. کاخ سفید بلافاصله به درخواست برای اظهار نظر پاسخ نداد. به نظر می رسد آنتروپیک تاکنون با این درخواست موافقت کرده است. این شرکت مدل Claude Mythos 5.1 خود را"}, {"source": "Business Insider", "title": "Best catios", "link": "https://www.businessinsider.com/guides/pets/best-catios", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Outdoor enclosures from Aivituvin, Easy Pet Fence, and Outback Jack are our top recommendations. Janelle Leeson/Business Insider It's 5 a.m. and, while the house is asleep, my cats let themselves into their catio. Instead of waking my husband or me, they spend the early morning sniffing the breeze, chattering at birds, and watching the neighborhood wake up. Come fall, they proudly haul fallen leaves back through the cat door like their catch of the day. Many evenings, I'll join them in the catio with a book and a drink in hand. Now that we have a toddler, the catio also gives my cats a quiet place to retreat. The best catios allow cats to safely indulge in their instincts — whether that's surveying the neighborhood or hunting leaves — without the risks of roaming free. Catios protect local wildlife, since free-roaming cats are among the biggest threats to songbirds and other small animals. To find a catio that delivers on all of the above, I tested five over several months with help from my cats, Atlas and Lyra. Our top pick at a glance: The Easy Pet Fence is the best prefab catio for many homes and apartments and comes in several sizes. It's easy to assemble and disassemble, thanks to a sturdy steel frame that's secure but still manageable for one person to maneuver. This catio doesn't include built-in perches, but its spacious design can accommodate cat trees, scratchers, and seating, so you can comfortably spend time with your cats. While my custom-built 5-by-8-by-9-foot catio cost around $7,000, prefab catios offer a budget-friendly entry point. Still, construction quality varies widely, and a poorly designed enclosure can put your cat at risk. To find the best balance of safety, durability, ease of assembly, and value, I assembled each catio myself, then left it out in heavy rain, measured gaps, tested mesh durability, and checked whether doors latched securely. I also spoke with veterinarians, a certified cat behavior consultant, and bird conservationists to understand what makes a catio secure and worth buying. Our top picks for the best catios Best overall: Easy Pet Fence Heavy-Duty Paneled Catio Enclosure - From $460 at Easy Pet Fence Best budget: Aivituvin AIR37 Walk-In Outdoor Cat House - $270 at Chewy Best portable: Outback Jack Cat Tent - $54 at Chewy Best window: VistaGato Freedom - $170 at VistaGato Best overall Best for: Renters or homeowners who w", "date_str": "2026-09-24T20:38:02+00:00", "hash": "a2a90f781389c57d", "title_fa": "بهترین کاتیوها", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید محفظه های فضای باز از Aivituvin، Easy Pet Fence، و Outback Jack بهترین توصیه های ما هستند. Janelle Leeson/Business Insider ساعت 5 صبح است و در حالی که خانه خواب است، گربه‌های من خود را به اتاق خود رها می‌کنند. آنها به جای اینکه من یا شوهرم را بیدار کنند، صبح زود نسیم را استشمام می کنند، با پرندگان صحبت می کنند و بیدار شدن محله را تماشا می کنند. بیا پاییز، آنها با افتخار برگ های افتاده را مانند صید روزشان از در گربه می کشند. بسیاری از عصرها، با یک کتاب و یک نوشیدنی در دست به آنها می پیوندم. اکنون که یک کودک نوپا داریم، کاتیو نیز به گربه های من مکانی آرام برای عقب نشینی می دهد. بهترین کاتیوها به گربه ها این امکان را می دهد که با خیال راحت غرایز خود را - چه بررسی محله و چه شکار برگ - بدون خطرات پرسه زدن آزادانه انجام دهند. Catios از حیات وحش محلی محافظت می کند، زیرا گربه های پرسه زدن آزاد یکی از بزرگترین تهدیدها برای پرندگان آوازخوان و سایر حیوانات کوچک هستند. برای یافتن یک کاتیو که تمام موارد بالا را ارائه می‌کند، پنج مورد را طی چند ماه با کمک گربه‌هایم، Atlas و Lyra آزمایش کردم. انتخاب برتر ما در یک نگاه: نرده ایزی پت بهترین کاتیو پیش ساخته برای بسیاری از خانه ها و آپارتمان ها است و در اندازه های مختلفی عرضه می شود. مونتاژ و جداسازی آن آسان است، به لطف یک قاب فولادی مستحکم که ایمن است اما همچنان برای یک نفر مانور می دهد. این کاتیو شامل نشیمنگاه‌های داخلی نمی‌شود، اما طراحی جادار آن می‌تواند درختان گربه، خراش‌ها و صندلی‌ها را در خود جای دهد، بنابراین می‌توانید"}, {"source": "Business Insider", "title": "Get 50% off your first The Farmer's Dog order for fresh food your pup will love", "link": "https:
