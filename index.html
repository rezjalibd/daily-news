<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۴ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۴ آذر ۱۴۰۵</span>

        <span class="meta-tag">⏰ ساعت انتشار: ۲۰:۱۰</span>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">

      <button class="tab-btn" onclick="switchTab('tech', this)">

        <span class="badge" id="badge-tech">۶۷</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۶۰</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

ولت فدرال اداره تمام گذرگاه‌های مرزی اقلیم کردستان را به دست بگیرد و وزارت نفت عراق مدیریت میدان‌های نفتی فدرال تحت حفاظت نیروهای کرد در چهار استان را بر عهده بگیرد. این دستور چهار روز پس از ورود نیروهای دولتی به جرف‌الصخر، پایگاه اصلی کتائب حزب‌الله در استان بابل صادر شده است. هر دو اقدام در پی تحقیقات درباره قاچاق نفت انجام شده است و دامنه مداخله مستقیم بغداد در حفاظت از زیرساخت‌های نفتی و نظارت بر مسیرهای انتقال فرآورده‌های نفتی را گسترش می‌دهد. صباح النعمان، سخنگوی فرمانده کل نیروهای مسلح عراق، امروز اعلام کرد که بر اساس دستور نخست‌وزیر، هیئت فدرال گذرگاه‌های مرزی اداره همه گذرگاه‌های اقلیم را بر عهده می‌گیرد. فرماندهی مرزبانی هم موظف شده است گذرگاه‌های غیررسمی در امتداد مرزهای بین‌المللی عراق، از جمله در اقلیم کردستان را ببندد. دستور مربوط به میدان‌های نفتی شامل تاسیساتی است که بغداد آن‌ها را متعلق به وزارت نفت می‌داند و حفاظت از آن‌ها در استان‌های کرکوک، نینوا، دیاله و صلاح‌الدین در اختیار نیروهای کرد است. الزیدی همچنین به دولت اقلیم دستور داده است مجوز صادرات نفت خام و فرآورده‌های نفتی را فقط از طریق وزارت نفت فدرال صادر کند. حفاظت از میدان‌ها به پلیس انرژی عراق واگذار می‌شود و دولت برای ثبت میزان تولید چاه‌ها و نظارت بر خطوط لوله، نصب کنتورهای الکترونیکی و راه‌اندازی سامانه پایش را در دستور کار قرار داده است. وزارت منابع طبیعی اقلیم می‌گوید صادرات نفت خام اقلیم از مسیر ترکیه هم‌اکنون زیر نظر بغداد انجام می‌شود و درآمد آن به خزانه فدرال می‌رود. تصمیم تازه دامنه اختیارات بغداد را به مدیریت و حفاظت از میدان‌هایی می‌رساند که امنیتشان در اختیار نیروهای کرد بوده است. مخالفت اربیل و برکناری مقام‌های عراقی مسرور بارزانی، نخست‌وزیر اقلیم کردستان، دستور الزیدی را «غیرقابل قبول» خواند و گفت این تصمیم با مذاکرات پیشین اربیل و بغداد مغایرت دارد. او گفت دولت اقلیم تصمیم‌هایی را که مغایر قانون اساسی عراق بداند، نمی‌پذیرد. الزیدی و بارزانی دو هفته پیش در بغداد درباره مدیریت میدان‌های نفتی، درآمدهای نفتی و غیرنفتی، سهم اقلیم از بودجه فدرال سال ۲۰۲۷ و حقوق کارکنان بخش دولتی گفت‌وگو کرده بودند. در توافق امنیتی سپتامبر هم پیش‌بینی شده بود گذرگاه‌های رسمی با مدیریت مشترک باز بما robotics to world sims but the tool requires a lot of computing power, and access is limited for the time being. You can dive in now if you're on one of the Google AI Ultra plans ($99.99 or $199.99 a month), or join the waitlist if you're a Google AI Pro user ($19.99 a month). But if you've got access, is it worth the effort (and money)? I put it to the test. What Google says you can do with Genie 4 It's no exaggeration to say you can build an entire virtual world in Google Genie. It's going to be a more basic, less developed, and more chaotic world than the one in, say, GTA 6 , but you can do it. Think of it like generating an AI video from a prompt, but you can then walk through the video and go as deep as you like, taking turns along the way. Everything is rendered in real time, at a resolution of 720p and at 24 frames per second. That's not to say the engine is storing a massive 3D map in memory, however after a minute or so, it's going to start to forget the places you've already seen. And while the basic layout will stay fixed, you might notice disappearing trees or changing colors. Walking with the dinosaurs in Genie. Credit: Lifehacker Google's official line is \"visual details and object permanence can still shift or drift over time\" in Genie 4, so it's a known limitation. The tool is presented as-is, with the intention to develop it further over time as models improve, and it's aimed at filmmakers, historians, designers, scientists, robotics engineers, and game developers. Or indeed, anyone who just wants to get lost in a world that isn't real. Some of the demos you'll find as you step through the Genie 4 portal give you a great idea of the possibilities. There's a \"Dino Field Guide\" that, you guessed it, lets you wander safari-style through a prehistoric habitat. All the flora and fauna are neatly rendered,", "date_str": "2026-11-24T16:30:00+00:00", "hash": "817d132c9831aa06", "title_fa": "من سعی کردم دنیای تعاملی خودم را در Google Genie بسازم، اما موت leapis.com/gweb-uniblog-publish-prod/images/Google_Gemini_1.max-1440x810.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "عامل‌های هوشمند"], "datetime_fa": "۳ آذر • ۱۹:۳۰"}, {"source": "Business Insider", "title": "From Anthropic’s IPO to Huang’s return, here’s how retail has traded a chaotic stretch for markets", "link": "https://www.businessinsider.com/nvidia-anthropic-retail-buy-the-dip-jensen-huang-nvda-ant-2026-11", "summary": "People watch at the Nasdaq MarketSite as shares of Anthropic begin trading after their IPO. Stephanie Keith/NurPhoto via Getty Images The market has been a minefield of catalysts these days, both good and bad. Retail traders navigated massive swings around Anthropic's IPO and Jensen Huang's comeback. Vanda Research said that retail traders were big dip buyers of Nvidia ahead of Monday's rally. Retail traders have had a lot to deal with in the last few weeks. Nvidia's decision to reinstate ousted CEO Jensen Huang was only the latest catalyst that sent stocks on a roller coaster, and it may have been an early Christmas gift for retail traders. Nvidia stock surged 31% on Monday, driving the broader market to a dizzying rally after weeks of losses brought on by Huang's resignation and jitters across the AI trade. But, according to data from Vanda Research, many retail traders were in prime position to benefit from the \"Jensen 2.0\" rally. \"Retail investors, at least the ones that bought the dip last week, are amongst the big winners from the return of Jensen rally,\" wrote global macro strategist, Viraj Patel. \"We estimate that the average retail investor who bought NVDA shares last week is up around 11% today (from being down 15% at Friday's close).\" Patel noted that throughout the Nvidia turmoil that led to Huang's resignation, retail traders were major dip-buyers, adding $1.12 billion in Nvidia shares last week. When it came to last week's other big event, individual investors were less enthusiastic. While retail traders were ready for the Anthropic IPO, the Claude maker's historic offering couldn't unseat SpaceX as retail investors' most-bought IPO stock. In fact, Vanda's data shows Anthropic didn't even come in second in terms of retail buying on IPO day, finishing behind both SpaceX and Coinbase . The cohort's strategy shifted on Monday when Anthropic started trending downward as Nvidia surged. Patel noted that retail enthusiasm for the newly minted ANT stock was on par with Nvidia for most of the day, even as the stock slumped. \"Anthropic is the other big winner from the return of Jensen — it is the second-most bought stock by retail today,\" he stated. \"While net retail buying in ANT didn't break any IPO records, activity picked up on Friday to $98mn (vs. $60mn last Thursday when the stock listed).\" Patel also flagged another indicator that suggests retail has maintained a risk-on stance during the latest stretch of volatility. On top of piling into Nvidi", "date_str": "2026-11-24T16:06:02+00:00", "hash": "340e5895483643f3", "title_fa": "از عرضه اولیه عمومی سهام آنتروپیک تا بازگشت هوانگ، در اینجا آمده است که چگونه خرده فروشی ها بازارهای بی نظم را معامله کرده اند.", "summary_fa": "مردم در Nasdaq MarketSite مشاهده می کنند که سهام آنتروپیک پس از عرضه اولیه اولیه خود شروع به معامله می کند. استفانی کیث/نورعکس از طریق گتی ایماژ این روزها بازار میدان مین کاتالیزورهای خوب و بد بوده است. معامله گران خرده فروشی نوسانات گسترده ای را در مورد عرضه اولیه عمومی سهام آنتروپیک و بازگشت جنسن هوانگ انجام دادند. واندا ریسرچ گفت که تاجران خرده‌فروشی خریداران بزرگ انویدیا قبل از رالی روز دوشنبه بودند. تاجران خرده‌فروشی در چند هفته گذشته با مشکلات زیادی روبرو بوده‌اند. تصمیم انویدیا برای بازگرداندن جنسن هوانگ، مدیرعامل برکنار شده، تنها آخرین کاتالیزوری بود که سهام را به یک ترن هوایی فرستاد، و ممکن است این یک هدیه اولیه کریسمس برای خرده‌فروشان باشد. سهام انویدیا در روز دوشنبه 31 درصد افزایش یافت و بازار گسترده‌تر را پس از هفته‌ها ضرر ناشی از استعفای هوانگ و نگرانی‌ها در تجارت هوش مصنوعی به یک رشد سرگیجه‌آور سوق داد. اما، طبق داده‌های Vanda Research، بسیاری از معامله‌گران خرده‌فروشی در موقعیت برتر برای بهره‌مندی از رالی \"Jensen 2.0\" بودند. ویرج پاتل، استراتژیست کلان جهانی، نوشت: «سرمایه‌گذاران خرد، حداقل آن‌هایی که هفته گذشته افت را خریدند، از برندگان بزرگ بازگشت رالی جنسن هستند. ما تخمین می زنیم که میانگین سرمایه گذاران خرده فروشی که هفته گذشته سهام NVDA را خریداری کرده اند، امروز حدود 11 درصد افزایش یافته است (از 15 درصد کاهش در پایان روز جمعه). پاتل خاطرنشان کرد که در طول آشفتگی انویدیا که منجر به استعفای هوانگ شد، معامله‌گران خرده‌فروشی خریداران عمده کاهش قیمت بودند و هفته گذشته 1.12 میلیارد دلار به سهام انویدیا اضافه کردند. وقتی نوبت به رویداد بزرگ دیگر هفته گذشته رسید، سرمایه‌گذاران فردی کمتر مشتاق بودند. در حالی که معامله‌گران خرده‌فروشی آماده عرضه اولیه عمومی سهام آنتروپیک بودند، پیشنهاد تاریخی سازنده کلود نتوانست اسپیس ایکس را به‌عنوان پرفروش‌ترین سهام سرمایه‌گذاران خرده‌فروشی از بین ببرد.", "image_url": "https://i.insider.com/6b05a3f773f126f9eccb9f2b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Nvidia", "بورس و طلا"], "datetime_fa": "۳ آذر • ۱۹:۳۶"}, {"source": "Business Insider", "title": "Ukraine is moving to share its battle-tested Delta combat management system with Germany as Europe learns from its war", "link": "https://www.businessinsider.com/ukraine-delta-combat-management-system-germany-2026-11", "summary": "Allies want to learn from Ukraine s battlefield management, including its Delta system. Dmytro Smolienko/ Ukrinform/Future Publishing via Getty Images Ukraine says Germany will be the first partner nation to gain access to its Delta system. Delta creates a unified battlefield picture for units, helping them find and strike targets faster. It's another sign of Ukraine's shift from aid recipient to a military partner Western allies want to learn from. Ukraine intends to share its Delta battlefield management system with Germany, marking another step in the country's transition from a recipient of Western military aid to a partner with proven battlefield technology and expertise . Ukraine's defense ministry announced on Tuesday that the two nations' defense ministers had \"signed a letter of intent to cooperate on developing, implementing, and using the Delta combat digital ecosystem.\" Germany will be given access to the system and plans to further support its development, the ministry said, but that access will not include Ukraine's combat or operational data. The agreement would make Germany the first partner nation to secure access to the Delta system, which provides units with a single picture of the battlefield by combining data and intelligence from satellites, radars, and drones. Commanders can access the system on laptops, phones, and tablets. It reduces the time it takes for units to locate and engage targets. Evgeniy Khmara, Ukraine's defense minister, said on Tuesday that \"Ukraine has technological solutions tested at the front . Delta is a unique digital platform that combines planning, operations management, and situational analysis.\" \"German technological expertise will help develop and scale up the system's capabilities,\" he said. \"This is an important step for our mutually beneficial defense cooperation. Ukraine's partnership with Germany will strengthen both our countries and the security of Europe as a whole.\" Germany has already tested Delta, but further work is required before its military can use the system. \"The next step will be signing a separate agreement setting out the practical, technical, and legal terms of cooperation,\" Ukraine's defense ministry said. German officials previously said that their military needs to determine which parts of Delta could be integrated into its own systems, suggesting that Germany is not looking to adopt Ukraine's version wholesale. The news is another step in Ukraine's evolving relationship with its We", "date_str": "2026-11-24T15:49:08+00:00", "hash": "4e19a207c407cf0c", "title_fa": "در حالی که اروپا از جنگ خود درس می گیرد، اوکراین در حال به اشتراک گذاشتن سیستم مدیریت رزمی دلتای آزمایش شده خود با آلمان است", "summary_fa": "متحدان می خواهند از مدیریت میدان نبرد اوکراین، از جمله سیستم دلتا، بیاموزند. Dmytro Smolienko/ Ukrinform/ Future Publishing از طریق Getty Images اوکراین می گوید آلمان اولین کشور شریکی خواهد بود که به سیستم دلتا خود دسترسی پیدا می کند. دلتا یک تصویر یکپارچه میدان نبرد برای واحدها ایجاد می‌کند و به آنها کمک می‌کند تا اهداف را سریع‌تر پیدا کنند و به آنها حمله کنند. این نشانه دیگری از تغییر اوکراین از دریافت کننده کمک به شریک نظامی است که متحدان غربی می خواهند از آن بیاموزند. اوکراین قصد دارد سیستم مدیریت میدان نبرد دلتا خود را با آلمان به اشتراک بگذارد و این گامی دیگر در گذار این کشور از دریافت کننده کمک های نظامی غرب به شریکی با فناوری و تخصص اثبات شده میدان نبرد است. وزارت دفاع اوکراین روز سه‌شنبه اعلام کرد وزرای دفاع دو کشور \"نامه‌ای مبنی بر همکاری برای توسعه، اجرا و استفاده از اکوسیستم دیجیتالی رزمی دلتا\" امضا کرده‌اند. این وزارتخانه گفت که آلمان به این سیستم دسترسی خواهد داشت و قصد دارد از توسعه آن بیشتر حمایت کند، اما این دسترسی شامل اطلاعات رزمی یا عملیاتی اوکراین نمی شود. این توافق آلمان را به اولین کشور شریکی تبدیل می کند که دسترسی ایمن به سامانه دلتا را دارد که با ترکیب داده ها و اطلاعات ماهواره ها، رادارها و پهپادها، تصویر واحدی از میدان نبرد را در اختیار واحدها قرار می دهد. فرماندهان می توانند روی لپ تاپ، تلفن و تبلت به سیستم دسترسی داشته باشند. زمان لازم برای مکان یابی و درگیری با اهداف واحدها را کاهش می دهد. اوگنی خمارا، وزیر دفاع اوکراین، روز سه‌شنبه گفت: «اوکراین راه‌حل‌های فن‌آوری آزمایش شده در جبهه را دارد. دلتا یک پلت فرم دیجیتال منحصر به فرد است که برنامه ریزی، مدیریت عملیات و تجزیه و تحلیل موقعیتی را ترکیب می کند.» او گفت:", "image_url": "https://i.insider.com/6b05adae73f126f9eccb9f8b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۳ آذر • ۱۹:۱۹"}, {"source": "Business Insider", "title": "Goldman Sachs says an unusual pattern in the job market could hit workers’ pay", "link": "https://www.businessinsider.com/job-market-pattern-workers-pay-wage-growth-goldman-sachs-2026-11", "summary": "The job market is seeing unusually low churn, a trend that could negatively impact workers wages, Goldman Sachs wrote in a client note. Paul Hackett/In Pictures Ltd./Corbis via Getty Images The low-hire, low-fire job market could be eating into workers' pay increases, Goldman Sachs said. In a new analysis, the bank estimated that low churn in the labor market has weighed on yearly wage growth. That's because workers are more likely to accept lower pay or smaller pay increases in their roles. An unusual trend in the job market could be responsible for the hit to your paycheck . Goldman Sachs analysis highlighted a possible consequence of the low-hire, low-fire labor market — a dynamic in which employers aren't letting go of many workers, while also curtailing new hiring. That dynamic has resulted in \"unusually low\" churn, or the pace that workers change jobs in the market, Pierfrancesco Mei, an economist at the bank, wrote in a note on Monday. In the end, the trend spells trouble for wage growth , as workers who do switch to new jobs are more likely to accept lower pay, and those staying in their current roles are more likely to accept smaller pay increases due to job insecurity, Mei said. The job reallocation rate, one reflection of churn, is hovering around a 40-year low, with the 12-month average of total private-sector job creation and destruction as a share of employment recently falling under 4%. The job reallocation rate is hovering around a 40-year low. Goldman Sachs Global Investment Research The bank estimated that \"depressed\" churn was weighing on yearly wage growth by around 0.3 percentage points. Wage growth has trended lower for most of the past five years, falling to a 3.1% yearly pace in October, according to the Bureau of Labor Statistics. Churn has moved lower for decades, thanks to an aging workforce and improved matches between workers and employers, which means fewer employers have let go of workers and fewer workers are quitting their jobs compared to the past, Mei said. The bank highlighted two reasons the drop in churn has accelerated recently: The job-switching boom during the pandemic has died down. AI adoption is also reducing churn. Churn has fallen below pre-pandemic levels in sectors with higher AI adoption rates and greater potential to automate, Mei said. AI is thought to have a negative impact on wages, as firms, in theory, could turn to the tech to lower labor costs, which drives down demand for workers in AI-exposed fields", "date_str": "2026-11-24T15:40:04+00:00", "hash": "5e1292b6b8dd29c9", "title_fa": "گلدمن ساکس می گوید یک الگوی غیرمعمول در بازار کار می تواند به دستمزد کارگران ضربه بزند", "summary_fa": "گلدمن ساکس در یادداشت مشتری نوشت: بازار کار شاهد ریزش غیرمعمول کم است، روندی که می تواند بر دستمزد کارگران تأثیر منفی بگذارد. گلدمن ساکس گفت: پل هکت/این پیکچرز با مسئولیت محدود/ کوربیس از طریق گتی ایماژ، بازار کار کم استخدام و کم آتش می تواند باعث افزایش دستمزد کارگران شود. در یک تحلیل جدید، بانک تخمین زد که ریزش کم در بازار کار بر رشد سالانه دستمزدها تأثیر گذاشته است. این به این دلیل است که کارگران بیشتر احتمال دارد که دستمزد کمتر یا افزایش دستمزد کمتر را در نقش خود بپذیرند. یک روند غیرمعمول در بازار کار می تواند عامل ضربه به دستمزد شما باشد. تجزیه و تحلیل گلدمن ساکس پیامد احتمالی بازار کار کم استخدام و کم آتش را نشان می دهد - پویایی که در آن کارفرمایان بسیاری از کارگران را رها نمی کنند و در عین حال استخدام های جدید را نیز محدود می کنند. پیرفرانچسکو می، اقتصاددان این بانک، روز دوشنبه در یادداشتی نوشت که این پویایی منجر به ریزش غیرمعمول پایین یا سرعت تغییر شغل کارگران در بازار شده است. می گفت که در پایان، این روند برای رشد دستمزدها مشکل ایجاد می کند، زیرا کارگرانی که به مشاغل جدید تغییر می کنند بیشتر احتمال دارد دستمزد کمتری را بپذیرند و افرادی که در سمت های فعلی خود باقی می مانند به دلیل عدم امنیت شغلی بیشتر احتمال دارد افزایش حقوق کمتری را بپذیرند. نرخ تخصیص مجدد مشاغل، که بازتابی از ریزش است، در حول و حوش پایین ترین سطح در 40 سال گذشته قرار دارد، به طوری که میانگین 12 ماهه کل اشتغالزایی و تخریب بخش خصوصی به عنوان سهم اشتغال اخیراً به زیر 4 درصد رسیده است. نرخ تخصیص مجدد مشاغل حول پایین ترین سطح 40 سال اخیر در نوسان است. تحقیقات سرمایه گذاری جهانی گلدمن ساکس این بانک تخمین زد", "image_url": "https://i.insider.com/6b05910dd6c5d341c9b4c98a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۳ آذر • ۱۹:۱۰"}, {"source": "Business Insider", "title": "He was 29 and hitting the gym 5 days a week. A tiny stomach pain turned out to be stage 4 cancer.", "link": "https://www.businessinsider.com/29-year-old-nagging-stomach-pain-stage-4-colon-cancer-2026-11", "summary": "Joe Faratzis was diagnosed with stage 4 colon cancer at 29, despite being otherwise healthy and active. Courtesy of Joe Faratzis A man was diagnosed with stage 4 colon cancer at 29 after noticing subtle symptoms months earlier. He said persistent abdominal pain and rectal bleeding were warning signs to get checked out. The cancer came back after treatment. Now, if immunotherapy doesn't work, he'll face major surgery. Joe Faratzis was a healthy, active 29-year-old when he started to notice a tiny pain in his stomach that wouldn't go away. In the mornings, getting dressed for his job as a TMZ producer, he felt a little pinch on his lower right side. Over more than a decade in media, he had seen headlines about young cancer diagnoses , including patients in their 30s or younger. He never considered he might become one of them. \"I was feeling good, working full time, and started to notice very subtle issues,\" he told Business Insider. \"I never thought it was going to be anything super serious. \" When the pain persisted for four months, accompanied by alarming symptoms like rectal bleeding , Faratzis underwent a colonoscopy that found a large tumor. He was diagnosed with stage 4 colorectal cancer. That was in 2019. After extensive treatments, including chemo and radiation, the cancer seemed to recede. About a year ago, another large tumor appeared. Now 36, Faratzis is facing intensive measures to fight the cancer, including a life-altering surgery, and an uncertain future as a single dad of a two-and-a-half-year-old daughter. \"I feel like I'm kind of in limbo right now,\" he said. \"My life is between going to the hospital and trying to be there for my kid as much as possible, not miss out on things in her life, and keep my head on straight while all this is going on.\" He shared the subtle symptoms that led up to his diagnosis, the challenges of treatment, and what everyone — especially young people — should know about cancer risk. Spotting subtle signs of colon cancer Faratzis said he noticed symptoms around January 2019, four months before he was diagnosed. At the time, he was busy but generally full of energy, working out at the gym five days a week and focused on his career. The main symptom was a little abdominal pain when he bent over to tie his shoes. Once in a while, he noticed a bit of blood after using the bathroom. Rectal bleeding is one of the biggest warning signs of colon cancer , particularly in young people. He assumed it was hemorrhoids, a common", "date_str": "2026-11-24T15:38:21+00:00", "hash": "32ef3d9553257614", "title_fa": "او 29 سال داشت و 5 روز در هفته به ورزشگاه می رفت. معلوم شد که یک معده درد کوچک مرحله 4 سرطان است.", "summary_fa": "جو فراتزیس در سن 29 سالگی با وجود اینکه سالم و فعال بود، به سرطان روده بزرگ در مرحله 4 مبتلا شد. با حسن نیت از جو فاراتزیس مردی در سن 29 سالگی پس از مشاهده علائم ظریف ماه ها قبل به سرطان روده بزرگ در مرحله 4 تشخیص داده شد. او گفت که درد مداوم شکم و خونریزی مقعدی از علائم هشدار دهنده برای معاینه است. سرطان بعد از درمان برگشت. حالا، اگر ایمونوتراپی جواب ندهد، با یک عمل جراحی بزرگ روبرو خواهد شد. جو فراتزیس یک جوان ۲۹ ساله سالم و فعال بود که متوجه درد کوچکی در معده خود شد که از بین نمی رفت. صبح ها که برا  for (or renewing) your Prime membership, here s how to judge whether or not the benefits outweigh the $139 cost. The benefits of Amazon Prime Here are the main perks of Amazon Prime that make it worth the cost for so many users. Free two-day shipping on millions of items: This is the main draw of Prime. If you shop frequently on Amazon and want quick free delivery, the shipping perks alone may make Prime worthwhile. Prime members also get free same-day delivery on over 3 million items in eligible areas. The ultra-fast (and morally suspect ) shipping usually costs $9.99 per order for non-members, though you can choose lower-cost or free shipping options if you're willing to place larger orders and wait longer to receive them. Access to Prime Video : Prime includes unlimited streaming of movies, TV shows, and Amazon Originals. If you ask me, the content library isn t as robust as Netflix or Hulu, but this is still an added value. Other Prime benefits: You also get Amazon Music for streaming songs, Prime Reading for ebooks, magazines, and audiobooks; Prime gaming, free photo storage, and occasional exclusive discounts/deals. Amazon Prime Rewards Visa card : Cardholders get 5% back on Amazon/Whole Foods purchases. Prime members who use this card extensively can earn rewards that offset the annual fee. Number of users: Prime benefits can be shared with other members of your household. The more users, the more value per person. Is an Amazon Prime account worth it? Let's say you don't care about Prime Video, Amazon Music, or free e-books, and just want to know if you'll save money you would otherwise be spending on shipping. For non-Prime members, Amazon requires a minimum order of $35 to qualify for free shipping on eligible items. The average shipping costs f", "date_str": "2026-11-24T16:00:00+00:00", "hash": "a15f35204e5cd6a9", "title_fa": "چند وقت یکبار باید از آمازون سفارش دهید تا پرایم ارزشش را داشته باشد", "summary_fa": "جمعه سیاه تا 27 نوامبر باقی نمانده است، اما to shop some seriously substantial Black Friday sales . As you're adding item after item to your cart during the sale, you might be tempted by offers for an \"affordable monthly payment system.\" Also known as \"buy now, pay later\" (BNPL), the pitch is a tempting one: Buy what you need now, and pay later, \" on your own timeline .\" But as convenient as it sounds, you should think twice before using buy now, pay later options, whether during Black Friday, Cyber Monday, or at any other time. While BNPL plans can allow you to pay for purchases in installments without interest, they come with a cost that can easily outweigh any big discounts. Let's take a look at the hidden costs of BNPL, and why you're better off paying upfront for all your Black Friday purchases. How does Amazon's buy now, pay later program work? To be clear, Amazon doesn't have its own buy now, pay later program, and the company is not uniquely misleading on this front. The process is straightforward: you choose your items, select Affirm (a third-party lender) at checkout, complete a quick application, and receive an instant decision on your loan terms. Individual transactions initiated through Affirm are limited to $25,000, with a daily maximum of $100,000 across multiple purchases but of course, your Black Friday splurge will be nowhere near that big, right? ( Right?! ) The main draw of these programs is the ability to \"pay at your own pace.\" If you are required to pay a down payment, that is due at the time of the transaction. From there, your first monthly payment is usually due one month after your purchase is processed. Each following payment will be due one month later, on the same day of the month. You can choose your own timeline, usually spanning 3, 6, 12, or 24 months, depending on the purchase amount and your creditworthiness. Unlike traditional credit cards, Affirm shows you the exact payment amount and total cost upfront, and claims no hidden fees or compound interest. You need a separate Affirm account in addition to your Amazon Prime membership . The application process requires basic information, including your name, mobile phone number, date of birth, and the last four digits of your Social Security number. Affirm performs a soft credit check initially, which doesn't impact your credit score, though they may conduct a hard inquiry for some loans. BNPL plans are helpful if you really need to finance something big, bu", "date_str": "2026-11-24T15:30:00+00:00", "hash": "6d783d6940e9a02d", "title_fa": "سه دلیل برای عدم استفاده از «اکنون بخرید، بعداً بپردازید» در جمعه سیاه", "summary_fa": "روزهایی که باید منتظر بمانید تا بعد از عید شکرگزاری برای خرید برخی از فروش های قابل توجه جمعه سیاه گذشته بود. از آنجایی که در حین فروش، آیتم‌های دیگری را به سبد خرید خود اضافه می‌کنید، ممکن است با پیشنهادات «سیستم پرداخت ماهانه مقرون‌به‌صرفه» وسوسه شوید. همچنین به‌عنوان «اکنون بخرید، بعداً بپردازید» (BNPL) نیز شناخته می‌شود، پیشنهادی وسوسه‌انگیز است: آنچه را که اکنون نیاز دارید بخرید و بعداً «در جدول زمانی خودتان» بپردازید. اما هر چقدر هم که راحت به نظر می رسد، باید قبل از استفاده از خرید اکنون دو بار فکر کنید، گزینه های بعدی را بپردازید، چه در جمعه سیاه، چه در روز دوشنبه سایبری یا هر زمان دیگری. در حالی که طرح‌های BNPL به شما امکان می‌دهند برای خرید به صورت اقساطی بدون بهره پرداخت کنید، هزینه‌ای دارند که به راحتی می‌تواند از هر تخفیف بزرگی بیشتر باشد. بیایید نگاهی به هزینه‌های پنهان BNPL بیندازیم، و چرا بهتر است برای همه خریدهای جمعه سیاه خود پیش‌پرداخت کنید. برنامه خرید در حال حاضر، پرداخت بعداً آمازون چگونه کار می کند؟ برای روشن بودن، آمازون برنامه خرید خود را در حال حاضر، پرداخت بعداً ندارد، و این شرکت به طور منحصر به فردی در این زمینه گمراه کننده نیست. این روند ساده است: شما موارد خود را انتخاب می کنید، تأیید (یک وام دهنده شخص ثالث) را در هنگام پرداخت انتخاب می کنید، یک درخواست سریع را تکمیل می کنید و تصمیم فوری در مورد شرایط وام خود دریافت می کنید. تراکنش‌های انفرادی که از طریق Affirm شروع می‌شوند به 25000 دلار محدود می‌شوند، با حداکثر روزانه 100000 دلار در خریدهای متعدد، اما مطمئناً هجوم جمعه سیاه شما به این بزرگی نخواهد بود، درست است؟ (درسته؟! ) نکته اصلی این برنامه ها توانایی \"پرداخت با سرعت خود\" است. اگر شما ملزم به پرداخت پیش پرداخت هستید، این", "image_url": "https://lifehacker.com/imagery/articles/01J03XDC2A0HZTS5ZSFV585KY3/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۳ آذر • ۱۹:۰۰"}, {"source": "The Verge", "title": "You can lock in Hulu and Disney Plus for as low as $5 per month for a year", "link": "https://www.theverge.com/gadgets/1041150/hulu-disney-plus-black-friday-ad-free-streaming-subscription-deal-sale-2026", "summary": "Emmy Rossum leads the fantastic cast of Furious. | Image: Hulu The Black Friday offers on streaming services are rolling in, and the latest deal includes Disney Plus and Hulu for a steeply discounted monthly rate. There are sales happening for both the ad-supported and ad-free tiers that offer full access to both services, and either will save you quite a bit of money. For those who despise ads, you can opt for the ad-free version for $14.99 per month (was $21.99) for a year, costing you $180 instead of $264 over the duration. This deal is located in a small banner near the bottom of the sale page via Hulu or Disney Plus . The ad-supported tier drops from $12.99 to just $4.99, so you’ll pay $60 over the course of the year instead of $156. You have through Cyber Monday, November 30th, at 11:59PM PST to take advantage of the lower prices. Disney Plus and Hulu bundle Where to Buy: $12.99 $4.99 at Hulu (ad-supported, monthly) $21.99 $14.99 at Hulu (ad-free, monthly) The Hulu and Disney Plus bundle is one of the best values in streaming, especially if you have kids who can’t get enough Disney movies and other cartoons. On the other hand, Hulu is home to plenty of shows made for adults, including Furious (a crime drama that gripped this household like no other show this year), The Bear , Shōgun , Alien: Earth , T ld-growth measure, where permit pace most exceeds projected household change, adjusted by total number of current households. Land availability and economic growth in many of these states have helped ensure that building permits outpace expected increases in demand. \"Utah, Idaho, South Carolina and North Carolina, South Dakota. I mean, all these places have more land available in their major cities and surrounding areas,\" Irwin said. He also pointed to the flock of new businesses in the Carolinas, and how the presence of businesses and research innovation centers has also spurred cities in these states to grow. North Carolina , in particular, led the nation, as its permit pace from January to August 2026 stood at a 6.11 gap per 1,000 households. That's after it approved an average of 8,072 permits a month, versus 4,640 projected households. Ka", "date_str": "2026-11-24T14:32:18+00:00", "hash": "0fe19071f973c5d3", "title_fa": "10 ایالت برتر قرار است بیشترین مسکن را برای جمعیت رو به رشد خود بسازند", "summary_fa": "کارولینای شمالی، کانزاس و ویرجینیای غربی پیشتاز هستند تا به خانه‌ها اجازه دهند تا رشد پیش‌بینی‌شده خانوار را برآورده کنند. جرمی اریکسون/ بلومبرگ از طریق گتی ایماژ مجوزهای ساخت خانه در ایالات متحده از رشد خانوارهای جدید پیشی گرفته است که توسط بازیگران برجسته ایالتی هدایت می شود. کارولینای شمالی با صدور 8072 مجوز ماهانه برای 4640 خانوار جدید پیشتاز در صدور مجوزهای مسکن است. کشورهایی با افزایش عرضه می توانند شاهد کاهش فشارهای قیمتی باشند. ایالات متحده به عنوان یک کل در حال تصویب مجوزهای ساختمانی سریعتر از رشد پیش بینی شده خانوار است، اما سرعت ملی توسط چند ایالت با عملکرد بهتر افزایش می یابد. بر اساس گزارش پژوهشی ماه اکتبر مرکز Lied برای املاک و مستغلات در دانشگاه نوادا، لاس‌وگاس، در سطح ملی، ایالت‌ها حدود 1.7 خانه را برای هر خانوار جدید پیش‌بینی می‌کنند و حدود 121,000 مجوز مسکن در ماه را تأیید می‌کنند، در مقایسه با 72,000 خانوار جدید پیش‌بینی‌شده. نیکلاس ایروین، یکی از نویسندگان گزارش و مدیر تحقیقات مرکز Lied برای املاک و مستغلات، گفت که در سراسر کشور، سرعت \ t from other parts of your device. According to Signal's support documents , these protections will now be enabled by default on iOS 27 and Android with the latest versions of the Signal app. Users on iOS 27 can confirm or manually disable screenshot protection via Settings Privacy Block Siri AI . The compromise with this setting is that it also blocks you from taking screenshots of Signal conversations in the app and App Switcher, though you can disable it temporarily for 10 minutes if needed. On Android, Signal automatically engages the \"Screen security\" setting when it detects an AI agent attempting to access the screen. This, too, blocks screenshots inside the app and can be disabled via Settings Privacy App security Screen security . Signal cannot block screenshots on macOS 27. However, users can add Signal to their Excluded Apps list via System Settings Siri , which at least limits proactive access to conversations by Siri AI.", "date_str": "2026-11-24T14:30:00+00:00", "hash": "c37061c9154b4a16", "title_fa": "هوش مصنوعی ممکن است چت های سیگنال خصوصی شما را اسکن کند", "summary_fa": "اگر از Signal استفاده می کنید، احتمالاً حداقل کمی به خصوصی نگه داشتن ارتباط خود اهمیت می دهید تا فقط شما و کسانی که با آنها چت می کنید بتوانید رشته های پیام خود را ببینید. رمزگذاری سرتاسر سیگنال چشمان کنجکاو را از خود دور می کند، اما اگر از هوش مصنوعی عاملی در دستگاه خود استفاده می کنید، ممکن است چت شما آنقدر که فکر می کنید قفل نشود. در یک پست وبلاگ اخیر، مردیث ویتاکر، رئیس سیگنال، تهدید بالقوه دستیاران هوش مصنوعی مانند سیری و جمینی را برای وعده حریم خصوصی پلتفرم بیان کرد. قابلیت‌های سطح سیستم مانند Gemini Intelligence (در اندروید) و Siri AI Onscreen Awareness (در iOS و macOS) صفحه‌نمایش شما را اسکن می‌کنند و ممکن است بتوانند داده‌هایی را از مکالمات سیگنال در این فرآیند ضبط کنند، که سپس می‌تواند برای انجام وظایف استفاده شود. این نه تنها به طور بالقوه اطلاعات شما، بلکه سایر شرکت کنندگان در مکالمه را نیز آشکار می کند. ویتاکر خاطرنشان می کند که این امر حفاظت از حریم خصوصی را خارج از کنترل سیگنال قرار می دهد زیرا این پلتفرم نمی تواند به راحتی دسترسی هوش مصنوعی را به برنامه محدود کند. سیگنال قبلاً قابلیت‌های اسکرین‌شات را برای Recall AI مایکروسافت مسدود کرده است، که به طور پیش‌فرض می‌توانست پیام‌های سیگنال را در ویندوز 11 بگیرد و ذخیره کند. در حالی که سیگنال نمی‌تواند تضمین کند که هوش مصنوعی به داده‌های شما دسترسی نخواهد داشت، اکنون چند محافظت برای کسانی که در iOS و Android نیز هستند در دسترس است. چگونه هوش مصنوعی را در خواندن چت های سیگنال خود محدود کنید راه حل اصلی در سیگنال در حال حاضر محدود کردن اسکرین شات ها و ضبط صفحه در داخل برنامه است، اگرچه این مانع نمی شود که عوامل هوش مصنوعی به طور بالقوه محتوای سایر قسمت های دستگاه", "image_url": "https://lifehacker.com/imagery/articles/01M84NJC6JZ1P63B86PRX2VQBQ/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Microsoft", "امنیت سایبری"], "datetime_fa": "۳ آذر • ۱۸:۰۰"}, {"source": "The Guardian AI", "title": "Mamdani says Nvidia drama shows stock market is overly dependent on AI", "link": "https://www.theguardian.com/us-news/2026/nov/24/mamdani-nvidia-stock-market-ai", "summary": "New York City mayor notes ‘massive impact’ on working Americans’ lives when Jensen Huang stepped down as CEO Zohran Mamdani , New York City ’s mayor, on Monday weighed in on the corporate turbulence surrounding Nvidia and the chipmaker’s chief executive officer, Jensen Huang , saying he does not think working Americans “signed up for their pensions being tied to the question of … Huang’s fidelity to his marriage”. The mayor said Huang “had a massive impact”, with Nvidia’s share price dropping dramatically when Huang stepped down as the company’s CEO on 12 November after a reported extramarital relationship with a suspected Chinese spy. Continue reading...", "date_str": "2026-11-24T14:22:17+00:00", "hash": "b9382baf31ef83aa", "title_fa": "ممدانی می گوید درام انویدیا نشان می دهد که بازار سهام بیش از حد به هوش مصنوعی وابسته است", "summary_fa": "شهردار نیویورک به «تأثیر عظیم» ت روزانه‌ی منفی ۱۰ تا مثبت ۲۰ ثانیه را ارائه می‌دهد. مقاومت مغناطیسی این موتور در سطح ۱۶٬۰۰۰ آمپر بر متر اعلام شده است. چنین مشخصه‌ای اجازه می‌دهد ساعت در مجاورت لپ‌تاپ، تبلت، گوشی هوشمند و شارژرهای مغناطیسی بدون اختلال در زمان‌سنجی کار کند. مقاومت در برابر آب نیز تا عمق ۱۰۰ متر تأیید شده و برای شنا، دوش گرفتن و غواصی سطحی کافی خواهد بود. سیتیزن تولید این مدل را محدود نگه داشته و تنها ۶۰۰ دستگاه از آن را در سراسر جهان عرضه می‌کند. قیمت ساعت مچی مردانه سری ۸۳۱ در وب‌سایت آمریکایی سیتیزن ۱٬۱۲۵ دلار تعیین شده است. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/citizen-series8-831-burgundy-watch-6b052f4911439fc00640452f?w=1920&q=75", "category": "موبایل و گجت‌ها", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳ آذر • ۱۷:۴۰"}, {"source": "Business Insider", "title": "The US Navy is reviving repair commands to rebuild sailors' abilities to fix and maintain their ships", "link": "https://www.businessinsider.com/us-navy-revives-repair-commands-to-rebuild-sailors-skills-2026-11", "summary": "A Navy sailor welding repairs on a ship at Shore Intermediate Maintenance Activity in Norfolk, Virginia. Public Affairs Specialist Oscar Pope/US Navy The Navy is reviving repair commands to rebuild skills it says have eroded. Sailors are training to fix warships in a future fight far from shipyards and outside help. Staffing and spare-parts shortages also complicate efforts to keep warships ready. The US Navy is bringing back specialized repair commands to rebuild skills it says have eroded, as it prepares sailors to keep warships running far from shipyards and outside help. The service has so far reestablished four Shore Intermediate Maintenance Activities, or SIMA, facilities — two on the East Coast and two on the West Coast. The commands combine ship repairs with training. In a Navy announcement this summer, Capt. Bill Albert, who commands SIMA San Diego, described its return as \"reversing the degradation of technical skills at sea.\" San Diego's original SIMA was folded into a regional maintenance center over two decades ago. The Navy hopes that restoring San Diego, and standing up others, can help make repair training practice a priority on par with actually completing repairs . Sailors work on operational equipment alongside more experienced technicians at these repair facilities, developing troubleshooting skills that the naval ranks need but frequently lack. Years of consolidating maintenance organizations have reduced sailors' opportunities to master repair skills, Chief of Naval Operations Adm. Daryl Caudle told lawmakers in written testimony in May. A 2024 government watchdog report found that personnel shortages and inadequate training hindered shipboard maintenance . Among executive officers surveyed, 75% said sailors had moderate to extreme difficulty completing repairs when relying on available formal training. The Navy's problems extend beyond sailors' technical maintenance skills. That same watchdog report found many ships have difficulty even completing repairs underway with their assigned crews and obtaining enough spare parts to complete repairs. The Navy has struggled for years with a strained shipbuilding and repair industrial base. Workforce shortages , limited shipyard capacity , and constant delays have complicated efforts to keep American warships operational. In a conflict with a major power, such as China in the Pacific, damaged ships could face long journeys to repair facilities, potentially keeping those vessels out of action f", "date_str": "2026-11-24T13:52:01+00:00", "hash": "8093200f13724b5e", "title_fa": "نیروی دریایی ایالات متحده در حال احیای دستورات تعمیر برای بازسازی توانایی های ملوانان برای تعمیر و نگهداری کشتی هایشان است.", "summary_fa": "یک ملوان نیروی دریایی در حال تعمیرات در یک کشتی در Shore Intermediate Maintenance Activity در نورفولک، ویرجینی       media: [{"source": "Deadline", "title": "Steven Hack Dies: Actor On ‘American Horror Story’, ‘Ratched’, ‘Marvel’s Agent Carter’, ‘General Hospital’; Original Cast Member Of Broadway’s ‘Cats’ Was 68", "link": "https://deadline.com/2026/11/steven-hack-dead-1237232579/", "summary": "Steven Hack, an original member of Broadway s Cats and A Chorus Line who went on to gain numerous credits on stage as well as in such TV series and films as Thor: The Dark World, American Horror Story: 1984, Criminal Minds, Scrubs, Fresh Off The Boat, General Hospital and many more, died November 19 at [ ]", "date_str": "2026-11-24T16:40:16+00:00", "hash": "a09aaa3c74d59ebb", "title_fa": "استیون هک می میرد: بازیگر «داستان ترسناک آمریکایی»، «راچد»، «کارتر مامور مارول»، «بیمارستان عمومی»؛ بازیگر اصلی «گربه‌ها» برادوی 68 ساله بود", "summary_fa": "استیون هک، یکی از اعضای اصلی گربه‌های برادوی و خط کر که در ادامه به کسب اعتبارات متعددی روی صحنه و همچنین در مجموعه‌های تلویزیونی و فیلم‌هایی مانند Thor: The Dark World، American Horror Story: 1984، Criminal Minds، Scrubs، Fresh Off The Boat، General Hospital و بسیاری دیگر روی صحنه رفت. کوروس لاین که در صحنه و همچنین در سریال‌ها و فیلم‌های تلویزیونی مانند ثور: دنیای تاریک، داستان ترسناک آمریکایی: 1984، ذهن‌های جنایتکار، اسکراب‌ها، Fresh Off The Boat، General Hospital و بسیاری دیگر اعتبارات زیادی کسب کرد، در 19 نوامبر در خانه‌اش در لس‌آنجلس در پی یک اتفاق ناگهانی و غیرمنتظره درگذشت. او 68 سال داشت. مرگ او توسط شرکت تئاتر لس آنجلس اینتراکت، که هک یکی از اعضای موسس آن بود، اعلام شد. هک متولد 20 آوریل 1958 در سنت لوئیس بود و سرانجام در مؤسسه هنرهای کالیفرنیا (CalArts) و آکادمی هنرهای دراماتیک آمریکا (A.A.D.A.) تحصیل کرد و اولین کار حرفه ای خود را به عنوان یک رقصنده نوجوان در فیلم Grease در سال 1978 انجام داد، درست قبل از ساخت اولین اولین فیلم Off the Broadway Music Cownolest. در سال 1982، هک به تولید اصلی گربه‌های موزیکال اندرو لوید وبر پیوست، بیش از پنج سال با بازی در نقش‌های Mungojerrie، Carbucketty، Coricopat و دیگران. از آنجا او نقش گرگ را در تور ملی A Chorus Line بر عهده گرفت و زمانی که به برادوی بازگشت برای 3389 امین اجرای برادوی در 29 سپتامبر 1983 به برادوی بازگشت. Watch on Deadline Stack در بسیاری از تولیدات صحنه ای دیگر خارج از برادوی اجرا شد، از جمله تولیدات Off و Off Off Broadway Consellor-at-Law با جان روبینشتاین، که همچنین به مدت هفت ماه در لس آنجلس اجرا شد. استک که در سال 1989 یکی از اعضای مؤسس شرکت تئاتر اینتراکت تحسین شده لس آنجلس بود، در بسیاری از تولیدات این", "image_url": "https://deadline.com/wp-content/uploads/2026/11/hack.jpg?w=851", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "عامل‌های هوشمند", "سینما", "موسیقی"], "datetime_fa": "۳ آذر • ۲۰:۱۰"}, {"source": "Rolling Stone", "title": "This Americana Songwriter’s New Album All But Predicted the Blue Wave", "link": "https://www.rollingstone.com/music/music-features/mary-gauthier-reckoning-november-midterms-blue-wave-1235663491/", "summary": "On Reckoning , Mary Gauthier recounts injustice and the change that had to come to set things right", "date_str": "2026-11-24T16:33:16+00:00", "hash": "dbdabf68a17a86d7", "title_fa": "آلبوم جدید این ترانه سرای آمریکاییانا همه اما موج آبی را پیش بینی کردند", "summary_fa": "در مورد حساب، مری گوتیه بی‌عدالتی و تغییری را که باید برای درست کردن اوضاع اتفاق می‌افتاد، بازگو می‌کند. او این کار را در سال 1999 با \"من می نوشم\" به یاد ماندنی انجام داد، تصنیف شدیدی درباره مبارزه او با اعتیاد به الکل که علیرغم ملودی آوازش، در به تصویر کشیدن اعتیاد بسیار مهم بود. گوتیه، یکی از بهترین ترانه سرایان زنده آمریکا، آهنگ‌هایش را همه از بوی جورج گرفته تا بلیک شلتون ضبط کرده‌اند و در سال 2019 برای آلبومش «Rifles Rosary Beads» که شامل همکاری با کهنه‌سربازان آمریکایی بود، نامزد دریافت جایزه گرمی شد. روند ترانه سرایی می تواند به ویژه برای کسانی که استعدادی در این زمینه ندارند، جادویی به نظر برسد، اما گوتیه در کتاب سال 2021 خود با یک آهنگ نجات یافته، پرده را کنار زد و نشان داد که او دقیقا چگونه آهنگی را شروع می کند و به طور مداوم آن را اصلاح می کند. با این حال، سخت است که از آهنگ‌هایی که Reckoning را تشکیل می‌دهند شگفت زده نشدیم، آلبومی که بی‌سر و صدا به موسیقی متن تغییر سیاسی کشور تبدیل شده است. تیتراژ به غیر از پیش‌بینی میانه‌دوره‌ای لرزه‌انگیز نوامبر، که در آن رای‌دهندگانی که از فساد دولتی، جنگ ناخواسته، و هزینه‌های غیرقابل تحمل زندگی خسته شده بودند، به دموکرات‌ها کنترل هر دو مجلس کنگره، به علاوه اکثریت فرمانداری‌ها را داد. گوتیه پیشاپیش در «حساب» می‌خواند: «شما می‌توانید همه گل‌ها را قطع کنید، اما نمی‌توانید بهار را متوقف کنید/ آونگی در حرکت است، و نمی‌توانید از نوسان پیشی بگیرید.» این یک ترکیب غیر متعارف و شبیه دیلن است که از شش بیت و نه یک کر تشکیل شده است. نزدیک‌ترین حالت زمانی است که خط پرداخت هر آیه به ایده «حساب» برمی‌گردد.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/MaryGauthier_DarkField_byDavidMcClister-2-scaled-2.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۲۰:۰۳"}, {"source": "Hollywood Reporter", "title": "Tidal Bans Wholly AI-Generated Music: “Serious Problem That Has Only Increased in Scale”", "link": "https://www.hollywoodreporter.com/music/music-industry-news/tidal-bans-wholly-ai-generated-music-1236762171/", "summary": "The service said Tuesday that more than 60 percent of new tracks uploaded to its service on Nov. 6 were fully AI-generated songs.", "date_str": "2026-11-24T16:31:46+00:00", "hash": "e6206e288f140fdc", "title_fa": "جزر و مد موسیقی کاملاً تولید شده توسط هوش مصنوعی را ممنوع می کند: \"مشکل جدی که فقط در مقیاس افزایش یافته است\"", "summary_fa": "این سرویس روز سه شنبه گفت که بیش از 60 درصد از آهنگ های جدیدی که در 6 نوامبر در سرویس آن آپلود شده اند، آهنگ های کاملاً ساخته شده توسط هوش مصنوعی هستند. سرویس استریم روز سه‌شنبه اعلام کرد که Tidal موسیقی کاملاً تولید شده توسط هوش مصنوعی را از پلتفرم خود غیرقانونی می‌کند و می‌گوید که موسیقی AI جریان‌ها و حق امتیازها را از هنرمندان منحرف می‌کند و طرفداران را گیج می‌کند. Tidal در روز سه‌شنبه در پستی در رسانه‌های اجتماعی گفت: برای اطمینان از اینکه Tidal بهترین مکان برای اشتراک‌گذاری آثارشان است و شنوندگان از آن لذت م idal-bans-ai-music-from-platform/", "summary": "Tidal announced Tuesday (Nov. 24) that AI-generated music will be banned entirely from the platform, beginning Dec. 9. This follows the company’s announcement in July that AI music had been demonetized and labeled , with requirements for distributors to label AI songs. Tidal says that it will remove any songs that distributors say were created solely with AI tools. In a post on social media platform X (formerly known as Twitter), Tidal claimed that 94% of AI-badged tracks had come from Suno. The company also claimed in a blog post that as of Nov. 6, 60% of the songs that it had received daily were AI-generated, that 96% of AI-generated songs on its platform had received no streams over the last three months and that it had taken down 66,000 tracks from people it suspects are impersonating another artist. The company says that songs created with assistance from AI tools, but are not entirely AI-generated, will be allowed to remain on the platform. Related How Each Music Listening Platform Is Treating AI Music (Updating) Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Rod Wave Indicted on Drug Gun Charges for Items Allegedly Found in Car After Speeding Stop “If you make music, you should be able to put it on Tidal knowing it won’t be buried under tracks no one asked for, or copied by someone pretending to be you,” the blog post read. Tidal s statement also said that 43% of songs delivered to the platform over the last three months have been marked as AI and labeled with a badge. Labeling has been a big part of the push to regulate AI music across platforms. This summer, a coalition of record labels got together to propose a new system for tagging AI-generated songs on streaming services and called on those platforms to adopt it. So far, none of them have adopted that exact proposal, but services like Tidal, Spotify, Deezer and Apple Music all created some form of a system on their own. Tidal is the first streaming service to outright ban AI songs from its platform. It joins online record store service BandCamp and radio company iHeartRadio as the only firms placing a full prohibition on fully AI works. Other sites like Deezer, Spotify and Apple Music have explored solutions that fall short of a total ban. Commonly, services will try labeling AI music, regulating spam and fraud associated with it or removing it from recommendation engines, rather than resorting to a full ban. Related SoundCloud CEO Talks AI Policies:", "date_str": "2026-11-24T16:30:02+00:00", "hash": "d1d12f73b1b1a95f", "title_fa": "Tidal اولین سرویس استریم است که موسیقی هوش مصنوعی را از پلتفرم خود ممنوع می کند", "summary_fa": "Tidal روز سه شنبه (24 نوامبر) اعلام کرد که موسیقی تولید شده توسط هوش مصنوعی از 9 دسامبر به طور کامل از این پلتفرم ممنوع خواهد شد. این به دنبال اعلام شرکت در ماه ژوئیه مبنی بر اینکه موسیقی هوش مصنوعی غیرفعال شده است و برچسب گذاری شده است، با الزامات توزیع کنندگان برای برچسب زدن آهنگ های هوش مصنوعی انجام می شود. Tidal می‌گوید که هر آهنگی را که توزیع‌کنندگان می‌گویند تنها با ابزارهای هوش مصنوعی ساخته شده‌اند را حذف می‌کند. Tidal در پستی در پلتفرم رسانه اجتماعی X (که قبلاً به عنوان توییتر شناخته می شد)، ادعا کرد که 94 درصد از آهنگ های دارای نشان هوش مصنوعی از سونو آمده است. این شرکت همچنین در یک پست وبلاگ ادعا کرد که تا 6 نوامبر، 60 درصد از آهنگ‌هایی که روزانه دریافت می‌کردند، با هوش مصنوعی تولید می‌شدند، که 96 درصد از آهنگ‌های تولیدشده با هوش مصنوعی در پلتفرم آن طی سه ماه گذشته هیچ استریمی دریافت نکردند و 66000 آهنگ از افرادی که گمان می‌برد جعل هنرمند دیگری هستند را حذف کرده است. این شرکت می‌گوید آهنگ‌هایی که با کمک ابزارهای هوش مصنوعی ایجاد می‌شوند، اما کاملاً توسط هوش مصنوعی تولید نشده‌اند، اجازه خواهند داشت روی پلتفرم باقی بمانند. مرتبط با نحوه برخورد هر پلتفرم گوش دادن به موسیقی با موسیقی هوش مصنوعی (در حال به روز رسانی) کریس براون موافقت می کند که فعلاً حمایت از کودکان را افزایش دهد تا Diamond در Bitter Custdy Fight Rod Wave متهم به اتهامات اسلحه م ز و در مورد تردید خود برای کار بر روی پروژه های بیش از حد شرکتی صحبت کرد. \"به من پیشنهاد شد ... \"ارباب حلقه ها\" در آمازون چیست؟ فینچر در طول مصاحبه پرسید. داستان‌های مرتبط پلت‌فرم پخش و تجارت سلبریتی‌ها TalkShopLive قبل از جمعه سیاه به TikTok گسترش می‌یابد آمازون بسته پخش 30 دلاری را شامل Starz، BritBox، AMC+، MGM+ و PBS شاهکار در یک مکان «اوه، حلقه‌های قدرت» معرفی می‌کند. فینچر ادامه داد: «به من پیشنهاد شد که ... برای نمایش. این قبل از رفتن به آمازون است، درست است؟ و من می‌گفتم: «به هیچ وجه.» این گسترش منافع شرکت است.» او به بحث درباره اینکه چگونه به جیمز گان حسادت نمی‌کرد و موقعیتی که او به عنوان مدیرعامل استودیو دی‌سی پذیرفته بود، که اخیراً اعلام کرد از آن جدا می‌شود، صحبت کرد. منظورم این است که من به جیمز گان نگاه می‌کنم و فکر می‌کنم، آن‌ها توپ‌های بزرگ‌تری از من هستند. من ... DC و تمام اختلالات آن را نمی پذیرم. دی‌ان‌ای ذاتی آن ناکارآمد است.» فینچر بعداً در گفتگو اضافه کرد: «فکر می‌کنم در حال حاضر محدودیت وحشتناکی در تجارت وجود دارد. می‌دانید، با پارامونت، برادران وارنر... حفاظت از صدای فردی در سینما روز به روز سخت‌تر می‌شود.»", "image_url": "https://variety.com/wp-content/uploads/2026/11/P108WR9E.jpg?crop=0px%2C88px%2C1333px%2C749px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۳ آذر • ۱۹:۵۵"}, {"source": "Variety", "title": "Ariana Grande’s ‘Eternal Sunshine Tour’ Concert Movie and Making-of Documentary to Stream on Peacock in December", "link": "https://variety.com/2026/music/news/ariana-grande-teases-eternal-sunshine-tour-movie-peacock-1236956068/", "summary": "After teasing a documentary of her Eternal Sunshine tour on Monday, Ariana Grande made it official on Tuesday: “The Eternal Sunshine Diaries: The Making of the Tour” will premiere Friday, December 11 followed by the concert film The Eternal Sunshine Tour on Saturday, December 12, exclusively on Peacock. The cameras follow Grande during the 30 [ ]", "date_str": "2026-11-24T16:15:00+00:00", "hash": "6797f1e3eb0877eb", "title_fa": "کنسرت فیلم و ساخت مستند «تور آفتاب ابدی» آریانا گرانده برای پخش در دسامبر در طاووس", "summary_fa": "آریانا گرانده پس از پخش فیلم مستندی از تور آفتاب ابدی خود در روز دوشنبه، آن را در روز سه‌شنبه رسمی کرد: «خاطرات آفتاب ابدی: ساخت تور» جمعه 11 دسامبر به نمایش درمی‌آید و پس از آن کنسرت فیلم تور آفتاب ابدی در روز شنبه، 12 دسامبر، به طور انحصاری در طاووس پخش می‌شود. دوربین‌ها گرانده را در طول 30 دنبال می‌کنند [ ] به عبارت کمتر تحت اللفظی، ادامه می‌یابد، در بازگشت مدت‌ها منتظر گرانده به صحنه، تور آفتاب ابدی از میان فروپاشی واقعیت او، تولد دوباره کیهانی، ارتباط مجدد با فرزند درونی‌اش و خاطراتی که او را شکل داده است، سفر می‌کند. او The Eternal Sunshine Tour را به جشنی سینمایی از شفا، ارتباط و موسیقی که زندگی او را تعریف کرده است، تبدیل می کند. هر دو فیلم توسط آریانا گرانده، لوگا پودستا، اندرو لریوس و کریستین برسلائر تهیه‌کننده اجرایی بودند. مستند چهار قسمتی جاستین تیمبرلیک اپل تی وی در همان روز به نمایش درآمد. این خواننده صبح دوشنبه کلیپی از لحظه تور Eternal Sunshine خود منتشر کرد که در وسط صحنه ایستاده و آواز خود را از آهنگ Eternal Sunshine پخش می کند. با محو شدن کلیپ، متنی روی صفحه ظاهر می شود که می گوید: به زودی به… طاووس. طرفداران پس از اینکه گرانده هفته گذشته عکسی از او در بخش تدوین در کنار کارگردان کریستین برسلائر و تدوینگر اندرو مورو در شبکه های اجتماعی منتشر کرد، شک داشتند که ممکن است روی یک فیلم کنسرت کار کند. Breslauer چندین بار با Grande در گذشته کار کرده است و فیلم های Yes, And? و ما نمی‌توانیم دوستان باشیم (منتظر عشقت باش) و به عنوان کارگردان و نویسنده فیلم روزهای روشن‌تر در آینده در کنار گرانده خدمت می‌کند. در همین حال، مورو ویرایش «رنسانس بیانسه: فیلمی از بیانسه» و «لیل ناس ایکس: زنده باد مونترو» را", "image_url": "https://variety.com/wp-content/uploads/2026/11/Peacock_Original_TheEternalSunshineTour_KeyArt_Poster_2025x3000_OG-e1795537368624.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی"], "datetime_fa": "۳ آذر • ۱۹:۴۵"}, {"source": "Billboard", "title": "Riley Green Brings Out the Big Guns to Announce Stagecoach 2027’s Dolly Day With Kelly Clarkson", "link": "https://www.billboard.com/music/music-news/stagecoach-2027-dolly-parton-day-the-voice-video-announcement-1236388654/", "summary": "After working 9 to 5 on the Friday of Stagecoach weekend, country music fans will be able to enjoy a whole day devoted to Dolly Parton at the country music festival next year. Related Garth Brooks, Riley Green, Zach Top to Headline Stagecoach 2027: A Guaranteed Good Time Stagecoach 2026: 10 Best Performances Kelly Clarkson Recalls Dolly Parton s Beautiful Words to Her 30 Minutes After Her Divorce Was Finalized As revealed Monday (Nov. 23) on The Voice , the first day of the three-day festival will officially be known as Dolly Day. Host Carson Daly explained on the singing competition show that Stagecoach will encourage guests to wear their Parton gear before throwing it over to coach Riley Green, who showed off his tee emblazoned with the late country icon s image. Green will headline next year s Stagecoach, which also features fellow Voice coach Kelly Clarkson on the lineup. She teased, You should show em what the shirt really looks like. As a few ladies in the crowd squealed loudly, Green tastefully lifted his hoodie slightly to show that his Parton shirt had nothing by way of sleeves, giving the crowd a narrow glimpse of his biceps. Stagecoach will take place April 23-25 in Indio, Calif. Garth Brooks and Zach Top are also among the headliners, leading a bill that features HARDY, Turnpike Troubadours, Charley Crockett, Jo Dee Messina, Kaitlin Butts, Willie Nelson Family, Kelly Clarkson, Brothers Osborne, Shaboozey, Dasha, Stella Lefty and more. It ll mark the first year of the country fest since Parton died at the age of 80 in August following a cancer battle. About a month afterward the icon s passing, Clarkson opened up about a meaningful moment she shared with the Queen of Country on the day of the 2023 ACM Awards, where the two women performed a duet of “I Will Always Love You” at the ACM Awards. J h had been released months earlier, reached No. 1 on both Top Latin Albums and Top Regional Mexican Albums. His posthumous set Lobo Domesticado , released in January 2007, peaked at No. 2 on Top Latin Albums and was nominated for a Latin Grammy for best banda album. In 2009, he competed in the same category with the compilation Solamente El Gallo de Oro . Elizalde s legacy has transcended time, with new generations of regional Mexican artists paying homage to him in their concerts and through new versions of his hits. For example, Edgardo Nuñez recorded two tribute albums in his honor this year. Below, find 10 songs from El Gallo de Oro that are essential for any playlist to remember him today, two decades after his passing.", "date_str": "2026-11-24T15:58:30+00:00", "hash": "fa3b0ce153e3a766", "title_fa": "ده آهنگی که 20 سال پس از مرگ والنتین الیزالد به یاد می آوریم", "summary_fa": "این چهارشنبه (25 نوامبر) 20 سال از ترور والنتین الیزالد، خواننده منطقه ای مکزیکی می گذرد که در اوج فعالیت حرفه ای خود، پس از اجرای یک برنامه در رینوسا، در شمال مکزیک، به همراه مدیرش ماریو مندوزا و راننده اش رینالدو بالستروس به ضرب گلوله کشته شدند. تا به امروز، دلایل یا مقصران این جنایت ناشناخته مانده است. در تنها 27 سالگی، خواننده سونورا به لطف شخصیت فرمانده و سبک تفسیری منحصر به فرد خود که با موسیقی باندای Sinaloan همراهی می شد، یک نماد بود. علی‌رغم اینکه الیزالد صدای قدرتمندی نداشت، احساسات را در آهنگ‌هایی مانند «Vete Ya»، «Cómo Me Duele»، «Vencedor» و «Te Quiero Así» که به کلاسیک‌های جاودانه موسیقی مکزیکی تبدیل شده‌اند، ریخت. مربوط به 20 سال بدون والنتین الیزالد: سازندگان مستندهای جدید درباره نماد موزیکال اواخر قتل هنوز حل نشده او بحث می کنند، ال گالو د اورو (خروس طلایی)، همانطور که او را می شناختند، با آهنگ 20 آهنگ 20 خود وارد فهرست 10 برتر جدول ایرپلی منطقه ای مکزیکی بیلبورد شد. پس از مرگ او، آلبوم Vencedor او که ماه‌ها قبل منتشر شده بود، در هر دو آلبوم برتر لاتین و بهترین آلبوم منطقه‌ای مکزیکی به رتبه اول رسید. مجموعه پس از مرگ او Lobo Domesticado که در ژانویه 2007 منتشر شد، در رتبه دوم آلبوم های لاتین برتر قرار گرفت و نامزد دریافت جایزه گرمی لاتین برای بهترین آلبوم باندا شد. در سال 2009، او در همان رده با مجموعه Solamente El Gallo de Oro رقابت کرد. میراث الیزالد از زمان فراتر رفته است و نسل‌های جدیدی از هنرمندان منطقه‌ای مکزیکی در کنسرت‌های خود و نسخه‌های جدید آهنگ‌هایش به او ادای احترام می‌کنند. به عنوان مثال، ادگاردو نونیز امسال دو آلبوم بزرگداشت به افتخار خود ضبط کرد. در زیر، 10 آهنگ از El Gallo de Oro را بیابید که برای هر لیست", "image_url": "https://www.billboard.com/wp-content/uploads/2023/01/Valentin-Elizalde-cr-Fonovisa-Records-espanol-2023-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۱۹:۲۸"}, {"source": "Deadline", "title": "Sabrina S. Gordon, Actress Danielle Brooks To Executive Produce Oscar Contender ‘Free Joan Little,’ Story Of Historic 1975 Court Case", "link": "https://deadline.com/2026/11/free-joan-little-sabrina-s-gordon-danielle-brooks-executive-producers-1237232455/", "summary": "EXCLUSIVE: Sabrina S. Gordon and Oscar-nominated actress Danielle Brooks have joined the award-winning short documentary Free Joan Little as executive producers. The Oscar-contending film, directed by Yoruba Richen, “recounts the groundbreaking 1975 case of a young Black woman in eastern North Carolina who killed a white jailer after he attempted to rape her,” according to [ ]", "date_str": "2026-11-24T16:00:00+00:00", "hash": "32a0b28f9a7fae1a", "title_fa": "سابرینا اس. گوردون، بازیگر دانیل بروکس برای تهیه کنندگی اجرایی نامزد اسکار «جوان لیتل را آزاد کنید»، داستانی از پرونده دادگاه تاریخی 1975", "summary_fa": "اختصاصی: سابرینا اس. گوردون و بازیگر نامزد اسکار دانیل بروکس به عنوان تهیه کننده اجرایی به مستند کوتاه برنده جوایز Free Joan Little پیوستند. به گفته [ ] فری جوآن لیتل جوایز متعددی از جمله بهترین مستند در جشنواره بین المللی بهار لس آنجلس، بهترین فیلم مستند در جشنواره بین المللی بهار لس آنجلس را به دست آورده است، فیلم رقیب اسکار، به کارگردانی یوروبا ریچن، \"یک مورد پیشگامانه در سال 19 estival , capping off Rockstar’s massive opening week. Billboard spoke with Alejandro about joining Grand Theft Auto VI: The Album , the making of “Macacoa 2000” and Rockstar’s decision to go global with its music. What’s your first memory of playing Grand Theft Auto as a fan? Wooo Wee! Mano, GTA has been part of my life desde chamaquito , for real. I remember spending hours just driving around, exploring the city, huyéndole a la policía [ Laughs ]. Sometimes I wasn’t even doing the missions, I was just vibing, discovering new things, listening to the music on the radio. GTA is one of those games que tú empiezas a jugar y cuando vienes a ver, se te fue el día entero [ Laughs. ] I have so many memories growing up with it. It’s such a crazy experience, y hasta el día de hoy lo sigo disfrutando igual. ¡Eso nunca pasa de moda! When you recorded “Macacoa 2000,” what kind of energy were you trying to capture, especially knowing the game would return to the Miami-inspired Vice City? With “Macacoa 2000,” I wanted to bring back the roots of reggaeton, ese perreo de antes, but with a fresh twist. Vice City has ", "date_str": "2026-11-24T15:32:50+00:00", "hash": "5932244f9e67f3e0", "title_fa": "راو آلخاندرو با بازی Rockstar رویای کودکی خود را برآورده می کند: \"GTA بخشی از زندگی من بوده است\"", "summary_fa": "مانند بسیاری از بزرگسالان در حال حاضر، Rauw Alejandro احتمالاً به کاناپه چسبیده است و Grand Theft Auto VI را بازی می کند. سن چیزی نیست جز یک عدد برای هزاره‌هایی که با سرگرمی در فرارهای جنایی بزرگ شده‌اند و گیم‌پلی انفجاری که Rockstar Games در دو دهه گذشته به گیمرها ارائه کرده است. حالا، راو فقط دوران کودکی خود را زنده نمی کند. او بخشی از یکی از بزرگ‌ترین بازی‌های ویدیویی تاریخ است، به لطف گنجاندن او در موسیقی متن فیلم پرفروش، Grand Theft Auto VI: The Album. او به بیلبورد می‌گوید: «وقتی در مورد این فرصت شنیدم، گفتم: «بیا برویم! ما باید آن صدای زیرزمینی پورتوریکویی را به GTA y más que nuevamente regresa a Miami، خانه بسیاری از لاتین‌ها بیاوریم». \"وقتی با بازی GTA بزرگ شدم،  on Pop Airplay. “No More Regrets” is Almost Monday’s eighth career Alternative Airplay entry. The group first made the ranking in October 2020 with “Broken People,” which reached No. 26. Earlier this year, “Lost” hit No. 18. The coronation is also a milestone for Hollywood Records, which earns its third Alternative Airplay No. 1. The label first topped the chart in 1998 with Fastball’s “The Way” and returned with “Can’t Slow Down.” In between, it reached the top 10 on hits by Limp Bizkit (“Take a Look Around”); Breaking Benjamin (“So Cold,” “Sooner or Later,” “The Diary of Jane,” “Breath,” “I Will Not Bow,” “Give Me a Sign [Forever and Ever]”); Atreyu (“Falling Down”); and Little Image (“Out of My Mind”). Meanwhile, of the 15 songs that have ruled Alternative Airplay in 2026, “No More Regrets” is the fifth released on an independent label, following The Paradox’s “Get the Message” (Hundred Days); Yellowcard’s “Bedroom Posters,” featuring Good Charlotte (Better Noise); Young the Giant’s “Different Kind of Love” (Concord); and Temper City’s “Self Aware” (Thirty Knots). There were eight indie No. 1s on the chart in 2025 and three in 2024. “No More Regrets” is on Almost Monday’s second studio album, Thank God It’s Almost Monday , released Sept. 9.", "date_str": "2026-11-24T15:28:48+00:00", "hash": "a81667d547fe11c2", "title_fa": "تقریبا دوشنبه دومین پخش آلترناتیو شماره 1 را با \"نه دیگر پشیمان\" می گیرد", "summary_fa": "تقریبا دوشنبه دومین موفقیت خود را در جدول پخش جایگزین بیلبورد (مورخ 28 نوامبر) با \"No More Regrets\" به دست آورد. طبق گزارش Luminate، این آهنگ که در 1 می از طریق هالیوود رکوردز منتشر شد، به لطف افزایش 5 درصدی چرخش در قالب 13 تا 19 نوامبر، دو پله به قله صعود کرد. (نمودار Alternative Airplay پخش هفتگی آهنگ ها را اندازه گیری می کند، همانطور که توسط Mediabase جدول بندی شده و توسط Luminate در 60 U.S. به بیلبورد ارائه شده است. ایستگاه‌های رادیویی جایگزین.) سه نفر مستقر در سن دیگو برای اولین بار در فوریه 2025 با «Can't Slow Down» رهبری Alternative Airplay را     let currentTab = 'persian';
