بود، و خودش را تماشا می‌کرد که به تنهایی در حال تلو تلو خوردن از خیابان بود، اسلحه‌ای در دستش. قربانی خود را می شناخت: خودش. او شاهد درد در صورت خود بود. بدتر از آن، همسرش پشت سر او بود، پسر شیرخوارشان را در آغوش گرفته بود و دختر خردسالشان را با خود می کشید. نسخه خودش"}, {"source": "Rolling Stone", "title": "Watch ‘SNL UK’ Skewer Ed Sheeran for ‘Sitting on the Fence’", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/snl-uk-ed-sheeran-sketch-king-charles-princess-diana-1235629454/", "summary": "\"Say what you want about Ed, but he has always been a passionate advocate of causes that are allowed\"", "date_str": "2026-09-21T07:50:13+00:00", "hash": "9d9f8fc3bc94a9ca", "title_fa": "SNL UK Skewer Ed Sheeran را برای «Sitting on the Fence» تماشا کنید", "summary_fa": "«درباره اد هر چه می‌خواهید بگویید، اما او همیشه مدافع پرشور دلایلی بوده است که مجاز هستند» شنبه شب زنده بریتانیا پس از جنجال‌های اخیر مربوط به تور لوپ، اد شیران را هدف قرار داد. اولین نمایش فصل دوم سریال اواخر شب با طرحی درباره شاه چارلز و پرنسس دایانا آغاز شد که در نهایت بر ناتوانی شیران در انتخاب طرف تمرکز داشت. در طرح، به چارلز با بازی لری دین، یک ربات هوش مصنوعی جدید (جک شپ) توسط جفت میلیاردر فناوری (سلست درینگ و فردی مردیت) در کاخ باکینگهام داده می شود. این ربات یک اندروید عمیق هوشمند، خودمختار، نوروکینتیک است. دیانا. هوش مصنوعی سرکش می کند و به میلیاردرها شلیک می کند و چارلز را وادار می کند که بگوید، ما باید هر کاری که می توانیم برای مقاومت انجام دهیم. آنابل مارلو در نقش شیرن پاسخ می دهد یا شاید ما نباید این کار را انجام دهیم. من نمی توانستم صحبت های شما را بشنوم. من بیرون بودم و روی حصار نشسته بودم. مسئله این است، اعلیحضرت، من دوست ندارم طرفی بگیرم. من نمی‌خواهم هیچ یک از طرفدارانم، انسان‌ها یا روبات‌هایم را از خود دور کنم. بسیاری از بلیط های من توسط ربات های اسکالپینگ خریداری می شوند. می دانید، گاهی اوقات، وقتی صحبت از درگیری می شود، شجاعانه ترین کاری که می توانید انجام دهید این است که اصلاً چیزی نگویید. شیران مصنوعی سپس آهنگی می خواند که چگونه هر دو طرف می توانند به یک اندازه حق داشته باشند. بعداً در اپیزود، Weekend Update، با میزبانی بازیگران آنیا ماگلیانو و پدی یانگ، دوباره بر روی شیران متمرکز شد. ماگلیانو با کنایه گفت: این بحران بدترین اتفاقی است که برای هواداران اد شیران از زمان آسیب دیدگی سر آنها رخ داده است. یانگ افزود، در مورد اد هر چه می خواهید بگویید، اما او همیشه مدافع"}, {"source": "Rolling Stone", "title": "Taylor Swift Celebrates Travis Kelce’s First Touchdown of the Season: ‘That’s My Husband!’", "link": "https://www.rollingstone.com/music/music-news/taylor-swift-travis-kelce-first-touchdown-celebration-nfl-1235629448/", "summary": "The Kansas City Chiefs triumphed over the Indianapolis Colts at Arrowhead Stadium", "date_str": "2026-09-21T07:04:11+00:00", "hash": "474a1ca7999398f5", "title_fa": "تیلور سوئیفت اولین تاچ داون فصل تراویس کلس را جشن می گیرد: «این شوهر من است!»", "summary_fa": "چیفز کانزاس سیتی بر ایندیاناپولیس کلتس در ورزشگاه اروهد پیروز شد تیلور سوئیفت مطمئن شد که همه حلقه ازدواج او را در روز یکشنبه در جریان بازی کانزاس سیتی چیفز مقابل ایندیاناپولیس کلتس دیده اند. هنگامی که تراویس کلسه او اولین تاچ داون خود در فصل را در کوارتر ابتدایی به ثمر رساند، سوئیفت از جا پرید، دست چپش را بالا گرفت، به انگشت حلقه اش اشاره کرد و گفت: این شوهر من است. سوئیفت که در 3 جولای در مدیسون اسکوئر گاردن با کلسه ازدواج کرد، تا کنون در تمام بازی Chiefs در این فصل دیده شده است. هفته گذشته، تام کروز برای پیروزی 31-10 تیم مقابل دنور برونکوس به او پیوست. کروز که در پادکست New Heights برای تبلیغ فیلم خود Digger حضور داشت، به جیمی فالون در The Tonight Show گفت که سوئیفت بازی را صرف آموزش فوتبال کرده است. کروز گفت که او فوتبال را می آورد. اول از همه، او یک نابغه است. از بچگی دنبالش بودم همه آنجا، همه دوستانشان زوجی زیبا و جادویی هستند. او اضافه کرد، من از قبل از کووید به یک بازی فوتبال نرفته بودم، جایی که کار می کردم و همه چیز. بنابراین برای این که در آنجا بنشینم و آن لحظه را داشته باشم، بسیار بود. اما او چیزهای خود را می داند. داستان های پرطرفدار پریسلی گربر، پسر سیندی کرافورد و رانده گربر، مرده در 27 سالگی چاد گیلبرت، گیتاریست بنیانگذار New Found Glory، مرده در 45 سالگی تیلور سویفت اولین تاچ داون فصل تراویس کلس را جشن می گیرد: این شوهر من است! نگاه کنید به ویلیام شاتنر کاور متالیکا و آزی آزبورن در اولین هوی متال سوئیفت و کلس اوایل تابستان امسال مدیسون اسکوئر گاردن را برای عروسی خود به دست گرفتند. لیست مهمانان نزدیک به 1000 شرکت کننده از جمله پل مک کارتنی، برد"}, {"source": "Rolling Stone", "title": "‘I Didn’t Think I Would Live’: Patrick Clancy Speaks Out in First Interview Since Lindsay Clancy Mistrial", "link": "https://www.rollingstone.com/culture/culture-features/patrick-clancy-interview-lindsay-clancy-mistrial-1235628594/", "summary": "Lindsay Clancy's ex-husband spoke to CBS News about losing his children, the dangers of TikTok sleuths, and how he's rebuilding his life", "date_str": "2026-09-21T01:43:20+00:00", "hash": "65b9904ebaf8d484", "title_fa": "\"فکر نمی کردم زنده بمانم\": پاتریک کلنسی در اولین مصاحبه بعد از لیندسی کلنسی میستریال صحبت کرد", "summary_fa": "همسر سابق لیندسی کلنسی درباره از دست دادن فرزندانش، خطرات کارآگاهان TikTok و نحوه بازسازی زندگی خود با CBS News صحبت کرد. این مرد 38 ساله شوهر سابق لیندسی کلنسی، پرستار داکسبری، ماساچوست است که در مرکز یک آزمایش ملی و بحث در مورد سلامت روان پس از زایمان قرار دارد. در سال 2023، لیندسی ظاهراً از پاتریک خواست که خانه را ترک کند تا برای شام و دارو از یک داروخانه محلی تهیه کند. در حالی که او رفته بود، او متهم است که سه فرزندش کورا، پنج، داوسون، سه و کالان هشت ماهه را به زیرزمین خانه خانوادگی آنها برده و با استفاده از نوارهای ورزشی آنها را خفه کرده است. سپس کلنسی از پنجره طبقه دوم پرید و در اثر برخورد او را فلج کرد. سپس پاتریک برای کشف اجساد لیندسی و فرزندانش به خانه بازگشت. در اوایل این ماه، دادگاه قتل سه گانه لیندزی با یک محاکمه نامشروع به پایان رسید (لیندسی کشتن کودکان را انکار نکرد؛ محاکمه قرار بود مشخص شود که آیا او از نظر قانونی مسئول اعمال خود است یا خیر). دادستان ها اعلام نکرده اند که آیا قصد دارند دوباره لیندسی را محاکمه کنند یا خیر. اکنون، پاتریک برای اولین بار پس از محاکمه در مصاحبه ای با CBS 60 Minutes درباره مرگ غم انگیز فرزندانش و چگونگی بازسازی زندگی خود در سال های پس از بررسی عمومی در جریان محاکمه صحبت می کند که باعث شد صدها کارمند TikTok او را به ارتکاب قتل و قتل همسر سابقش متهم کنند. من تیترهایی را دیدم که می‌گفتند مامان قاتل و بچه قاتل، هیولا. و هیچکدام [آنها] دقیق نبودند. پاتریک در دفاع از لیندسی گفت، من معتقدم که این بیماری روانی او بود که باعث آن شد. وقتی صحبت از بخشش به میان می‌آید، من نیز احساس می‌کردم که اگر به آنجا نرسم،"}, {"source": "Hollywood Reporter", "title": "Movie Theater Advertising Giant Closes $275 Million Deal to Expand to Offices", "link": "https://www.hollywoodreporter.com/business/business-news/national-cinemedia-offices-1236706861/", "summary": "National CineMedia, the firm that powers AMC, Cinemark and Regal pre-shows, now has set its sights on growth outside the cinema.", "date_str": "2026-09-21T14:12:06+00:00", "hash": "a96408396b2d7ece", "title_fa": "غول تبلیغاتی سینماها قرارداد 275 میلیون دلاری را برای گسترش به دفاتر بسته است", "summary_fa": "National CineMedia، شرکتی که پیش‌نمایش‌های AMC، Cinemark و Regal را تامین می‌کند، اکنون رشد خارج از سینما را در نظر گرفته است. National CineMedia، شرکت تبلیغاتی درون تئاتری که با AMC Theatres، Cinemark و Regal برای محتوای تبلیغاتی قبل از نمایش همکاری می‌کند، یک معامله بزرگ برای سرمایه‌گذاری خارج از سینما بسته است. این شرکت به رهبری توماس لسینسکی، قراردادی را برای خرید Captivate Holdings امضا کرده است که ده‌ها هزار صفحه نمایش کوچک در ساختمان‌های اداری، لابی‌ها و آسانسورها را تامین می‌کند که تبلیغات و محتوای کوتاه را در حین عبور مردم (یا زمانی که منتظر طبقه شما در آسانسور هستند) نشان می‌دهند. ارزش این معامله 275 میلیون دلار است. National CineMedia در حال حاضر از طریق تمام نمایشگرهای خود که تبلیغات را در لابی‌های سینما نشان می‌دهند، جای پایی در این تجارت داشته است (طبق گزارش سالانه‌اش، 17000 صفحه در بیش از 1300 سالن سینما داشت). اکنون می خواهد این فرمول را به ساختمان های اداری و املاک مسکونی نیز بیاورد. و با پلتفرم Captivate s، این شرکت می گوید که 48000 صفحه نمایش دیجیتال برای این کار خواهد داشت. وسیله اصلی آن برای فروش تبلیغات، پیش نمایش Noovie است که توسط خبرنگار سابق Today، ماریا منوونوس میزبانی می‌شود و شامل نکات بی‌اهمیت فیلم، مصاحبه‌های به سبک آشغال با افراد مشهور و لحظات فلاش بک هالیوود آمیخته با تبلیغات است. از زمان خروج از ورشکستگی در سال 2023، درست زمانی که سال‌های کووید برای سینماها بسیار وحشیانه بود، آنها همچنین تبلیغات درون تئاتری را ویران کردند، CineMedia ملی خود را برای بازسازی قرار داده است. این شرکت در نوامبر گذشته 8.2 میلیون دلار برای خرید شبکه سینمایی Spotlight هزینه کرد، یک شبکه تبلیغاتی که به سالن‌های بوتیک، لوکس و درایو-این مانند Cin polis Luxury Cinema، Landmark Theatres و غیره خدمات می‌دهد."}, {"source": "Hollywood Reporter", "title": "Netflix’s ‘Cliff Booth’ Trailer Has Brad Pitt Taking a Playful Poke at Leonardo DiCaprio", "link": "https://www.hollywoodreporter.com/movies/movie-news/netflix-cliff-booth-trailer-brad-pitt-leonardo-dicaprio-1236706879/", "summary": "The first full trailer of David Fincher and Quentin Tarantino's 'The Further Mis-Adventures of Cliff Booth' has just dropped.", "date_str": "2026-09-21T14:06:50+00:00", "hash": "b364f958e18d5450", "title_fa": "در تریلر «Cliff Booth» نتفلیکس، برد پیت بازی‌آمیزی به لئوناردو دی‌کاپریو می‌زند.", "summary_fa": "اولین تریلر کامل فیلم «The Further Mis-Adventures of Cliff Booth» دیوید فینچر و کوئنتین تارانتینو به تازگی منتشر شده است. متن لوگو اولین تریلر کامل برای دنباله فیلم «روزی روزگاری در هالیوود» نتفلیکس، «ماجراهای اشتباه بعدی کلیف بوث» منتشر شد. فیلم جدید (در زیر) نشان می دهد که بدلکار سابق براد پیت اکنون به عنوان یک تعمیرکار هالیوود کار می کند، در حالی که بارتن می کند و به عنوان یک پروژکتور نیز کار می کند. این تریلر همچنین شامل یک شوخی بازیگوش به هزینه همبازی خود در روزی روزگاری، لئوناردو دی کاپریو است. بوث توضیح می دهد که دیگر برای شخصیت دی کاپریو، ریک دالتون، دوبله نمی کند، زیرا ریک بیش از حد چاق شده است. داستان‌های مرتبط تلویزیون Sweet Magnolias در نتفلیکس پس از پنج فصل لغو شد، سهام نتفلیکس پس از تنزل رتبه Wells Fargo سقوط کرد: روندهای نامزدی برای ما نگران‌کننده به نظر می‌رسند این فیلم نشان‌دهنده همکاری منحصربه‌فردی است که توسط کوئنتین تارانتینو نوشته شده و دیوید فینچر کارگردانی آن را بر عهده گرفته است. در اینجا توضیحات رسمی و تریلر دقیق است: قتل، باج گیری، سرقت، اخاذی تابستانی دیگر در هالیوود. سال 1977 است، هشت سال از زمانی که کلیف بوث (پیت) در تاریخ موازی کوئنتین تارانتینو در سال 1969، روزی روزگاری در هالیوود با خانواده منسون روبرو شد. در فیلم The Further Mis-Adventures of Cliff Booth به کارگردانی دیوید فینچر بر اساس فیلمنامه جدیدی از تارانتینو، این افسانه به پایان رسیده است. لس آنجلس دیگر مانند بدلکار هیپی قاتل نیازی ندارد. اما هالیوود همیشه مشکلاتی خواهد داشت، مشکلاتی که تنها توسط فردی با توانایی‌های منحصربه‌فرد (گاهی غیرقانونی) کلیف قابل حل است. وقتی کلیف بوث از بارتنی کردن یا به عنوان یک پروجکشنیست درآمدی کسب نمی کند، برای حل کردن موقعیت های هالیوود عالی و گاهی اوقات نه چندان خوب است."}, {"source": "Hollywood Reporter", "title": "Josephine Vaccarello Named President of MSG Entertainment", "link": "https://www.hollywoodreporter.com/business/business-news/josephine-vaccarello-named-new-president-msg-entertainment-1236706865/", "summary": "The exec is a nearly thirty year veteran of the company, which oversees Madison Square Garden, Radio City Music Hall, and the Radio City Rockettes.", "date_str": "2026-09-21T13:26:55+00:00", "hash": "21b016cf43cc46c6", "title_fa": "جوزفین واکارلو به عنوان رئیس MSG Entertainment انتخاب شد", "summary_fa": "مدیر اجرایی تقریباً سی ساله کهنه کار این شرکت است که بر مدیسون اسکوئر گاردن، رادیو سیتی موزیک هال و رادیو سیتی راکتز نظارت دارد. مدیسون اسکوئر گاردن انترتینمنت جوزفین واکارلو را به عنوان رئیس جمهور ارتقاء داده است و نظارت اجرایی کهنه کار بر استراتژی و عملیات شرکت سرگرمی زنده را که مدیسون اسکوئر گاردن، رادیو سیتی تالار موسیقی، تئاتر بیکن و مکان های دیگر را اداره می کند، می دهد. این شغل شامل تمام رزروهای سرگرمی و ورزشی در مکان ها (به استثنای نیویورک رنجرز و نیویورک نیکس) و همچنین رزرو زنده در Sphere در لاس وگاس خواهد بود. MSG Entertainment همچنین بر رادیو سیتی کریسمس Spectacular با بازی رادیو سیتی Rockettes نظارت می کند. Vaccarello اخیراً معاون اجرایی لایو برای MSG Entertainment بود، جایی که به رزرو کنسرت‌ها و رویدادهای ورزشی مهم و همچنین اقامتگاه‌هایی مانند اقامتگاه‌های بیلی جوئل و هری استایلز کمک کرد. او در سال 1998 به عنوان دستیار اداری به این شرکت پیوست و از آن زمان تاکنون در چندین نقش کار کرده است. جیم دولان، رئیس اجرایی و مدیر عامل MSG Entertainment و Sphere Entertainment، گفت: جوزفین در طول تقریباً سی سال فعالیت خود با MSG، نه تنها در رشد کسب و کار رویدادهای زنده ما مؤثر بوده، بلکه خود را به عنوان یکی از تأثیرگذارترین و معتبرترین رهبران صنعت تثبیت کرده است. درک عمیق او از تجارت ما و روابط صنعتی بی‌نظیر ما همچنان به عنوان یک دارایی در این نقش جدید باقی خواهد ماند، زیرا ما چشم‌انداز استراتژیک خود را برای شرکت اجرا می‌کنیم، از جمله شناسایی فرصت‌های رشد نوآورانه و ارتقای موقعیت رهبری ما در تجربیات زنده."}, {"source": "Hollywood Reporter", "title": "Kit Harington Credits Harry Potter With Helping Him Through Sobriety Struggle", "link": "https://www.hollywoodreporter.com/tv/tv-news/kit-harington-jon-snow-game-of-thrones-sequel-1236706847/", "summary": "The actor gives a Jon Snow spinoff update, plus talks playing Gilderoy Lockhart in 'Harry Potter.'", "date_str": "2026-09-21T13:03:47+00:00", "hash": "732aa3863e7b9016", "title_fa": "کیت هرینگتون از هری پاتر با کمک به او در مبارزه با هوشیاری تقدیر می کند", "summary_fa": "این بازیگر به‌روزرسانی اسپین‌آف جان اسنو را ارائه می‌کند، به‌علاوه درباره نقش گیلدروی لاکهارت در «هری پاتر» صحبت می‌کند. متن لوگو کیت هرینگتون نسبت به ایده تکرار نقش محبوب طرفداران خود یعنی جان اسنو کمی گرمتر است و در مورد بازگشت او به HBO در مجموعه تلویزیونی آینده هری پاتر صحبت کرد. این بازیگر ابتدا دوشنبه به پادکست Happy Sad Confused گفت که در واقع احساس راحتی بیشتری نسبت به گذشته با این ایده دارد که جنگجوی بی میل بازی تاج و تخت را تکرار کند. این موضوع زمانی مطرح شد که از هرینگتون در مورد دنباله اسپین آف Snow HBO که چندین سال پیش ساخته شد و سپس کنار گذاشته شد، پرسیده شد. داستان‌های مرتبط TV A Tale of Two Cities نقد و بررسی: کیت هرینگتون کارهای بسیار بسیار بهتری نسبت به این سبک زندگی MGM+ دیکنز انجام داده است. من هنوز فکر می کنم دنیایی وجود دارد که در آن چیزی می تواند کار کند. اگر این کار را نمی‌کردم از ابتدا وارد آن نمی‌شدم. اما من در ابتدا بسیار اصرار داشتم، همانطور که HBO و جورج آر آر مارتین می‌گفتند: اگر کار درست را پیدا نکردیم، اجازه ندهیم آن را انجام دهیم. اگر این کار را نکنیم خیلی بهتر است. پس از مدتی فکر کردن در مورد آن، به نوعی من بودم [گفتم]، این [داستان] کاملاً درست نیست. ادامه هرینگتون: [اما] اکنون رفته ام و همه این کارها را انجام داده ام و اکنون با آن شخصیت و آن جهان دوباره و جایی که در زندگی من قرار دارد احساس راحتی بیشتری می کنم. با این حال این فرنچایز دیگری بود که به HBO هدایت شد و به هرینگتون در مبارزه با هوشیاری هری پاتر کمک کرد. هرینگتون به پادکست گفت که کتاب های صوتی پاتر در پی کنار گذاشتن الکل مفید بودند. او گفت که مغز"}, {"source": "Hollywood Reporter", "title": "CNN, MS NOW and Politico Sue White House for Revoking Press Credentials: “Patently Unconstitutional”", "link": "https://www.hollywoodreporter.com/news/politics-news/cnn-ms-now-sue-white-house-revoking-press-credentials-1236706836/", "summary": "President Trump declared that the three news outlets would be persona non grata last Friday.", "date_str": "2026-09-21T12:03:15+00:00", "hash": "cc822133af81e49f", "title_fa": "CNN، MS NOW و Politico از کاخ سفید به دلیل ابطال اعتبارنامه مطبوعاتی شکایت کردند: \"به طور آشکار خلاف قانون اساسی\"", "summary_fa": "پرزیدنت ترامپ جمعه گذشته اعلام کرد که این سه رسانه خبری غیر ارادی خواهند بود. CNN، MS NOW و Politico پس از لغو اعتبارنامه مطبوعاتی آنها توسط کاخ سفید، عملاً آنها را از مجتمع کاخ سفید منع کرد و پوشش رئیس جمهور و کارکنانش را به چالشی تبدیل کرد، از دولت ترامپ شکایت کردند. این سه خبرگزاری در اوایل صبح دوشنبه در بیانیه‌ای اعلام کردند، صبح امروز به دولت اطلاع دادیم که امروز برای محافظت از حقوق متمم اول قانون اساسی خود و دفاع از این اصل که دولت تصمیم نمی‌گیرد که مطبوعات چه گزارش یا منتشر کنند، شکایت می‌کنیم. کاخ سفید بدون اطلاع قبلی یا روندی، اعتبار روزنامه نگاران ما را لغو کرد زیرا با گزارش ما مخالفت کرد. در صورت عدم چالش، آزادی مطبوعات و حق عموم مردم برای روزنامه نگاری مستقل و عاری از مداخله دولت را تهدید می کند. داستان‌های مرتبط کسب‌وکار سیلوستر استالونه هنگام تماشای تلویزیون درباره سفیر ترامپ در هالیوود یاد گرفت: تلویزیون کار نمی‌کند آلن ریچسون فاش می‌کند که کدام فصل ریچر پس از انتخاب مجدد کسی لغو شده است در واقع، قرار بود CNN به عنوان مرکز اصلی مطبوعات تلویزیونی در روز دوشنبه باشد، روزی که قرار است رئیس‌جمهور ترامپ و رئیس‌جمهور ترامپ در نیویورک برای دیدار با رئیس‌جمهور فرانسه در نیویورک برگزار کنند. امانوئل مکرون در حاشیه مجمع عمومی سازمان ملل در یادداشتی بعد از ظهر دوشنبه، استخر تلویزیون کاخ سفید به دلیل تبعید CNN به حالت تعلیق درآمد. CNN وظایف استخر اولیه را با ABC، CBS، NBC و Fox News تقسیم می کند. در بیانیه مشترک شرکت های استخر تلویزیونی آمده است که عموم مردم علاقه ای حیاتی به دریافت اطلاعات دقیق و مستقل درباره دولت خود دارند. هیچ دولتی نباید یک سازمان خبری را محدود کند زیرا با گزارش آن مخالف است."}, {"source": "Hollywood Reporter", "title": "Red Sea Film Festival Cancels 2026 Edition, Vows to Return Next Year With “Renewed Vision”", "link": "https://www.hollywoodreporter.com/movies/movie-news/red-sea-film-festival-canceled-2026-conflict-war-postponed-1236706825/", "summary": "The decision \"reflects the Foundation’s commitment to ensuring the Festival takes place at the right time and under the right conditions,\" said a statement on Monday as the region deals with ongoing conflicts.", "date_str": "2026-09-21T10:43:40+00:00", "hash": "317fe1b389979107", "title_fa": "جشنواره فیلم دریای سرخ نسخه 2026 را لغو کرد، قول داد سال آینده با \"چشم انداز تجدید\" بازگردد", "summary_fa": "روز دوشنبه در بیانیه ای که منطقه با درگیری های جاری سر و کار دارد، آمده است: این تصمیم «بازتاب تعهد بنیاد به تضمین برگزاری جشنواره در زمان مناسب و تحت شرایط مناسب است». بنیاد رویداد تایید کرد ششمین دوره جشنواره بین المللی فیلم دریای سرخ به تعویق افتاد. یادداشتی که روز دوشنبه برای مطبوعات منتشر شد، توضیح می‌دهد که قسط امسال، در ابتدا برای دسامبر تعیین شده بود. 3-12 در جده، عربستان سعودی، به سه ماهه چهارم سال 2027 بازگردانده شده است. این در حالی است که کل منطقه با تنش نظامی مداوم در بحبوحه جنگ ایالات متحده، اسرائیل و ایران، با تهدید حملات موشکی و پهپادی فعال و عربستان سعودی با حملات هدفمند حوثی‌های مورد حمایت ایران مواجه است. داستان‌های مرتبط فیلم‌ها مرا سرشار از غرور می‌کند: چگونه کشور باسک نسل بعدی فیلم‌سازان خود را پرورش می‌دهد فیلم‌های برنده سن سباستین، یشیم اوستاوغلو با آنچه باقی مانده به رقابت بازمی‌گردد (کلیپ اختصاصی) این تصمیم به دنبال بررسی جامع طیف وسیعی از ملاحظات مربوط به زمان‌بندی بین‌المللی، از جمله الزامات مربوط به یک رویداد سالمند بعدی بیانیه گفت. این بیانگر تعهد بنیاد به حصول اطمینان از برگزاری جشنواره در زمان مناسب و تحت شرایط مناسب برای ارائه تجربه ای است که جشنواره بین المللی فیلم دریای سرخ برای آن شناخته شده است. به عنوان بخشی از این تعهد مستمر، بنیاد برنامه‌ریزی در طول سال را در میدان فرهنگ در جده تاریخی از نوامبر 2026 معرفی می‌کند و آن را به عنوان مقصدی دائمی برای نمایش فیلم، رویدادهای فرهنگی و برنامه‌های تخصصی فیلم-صنعتی معرفی می‌کند."}, {"source": "Hollywood Reporter", "title": "“It Fills Me With Pride”: How the Basque Country Is Nurturing Its Next Generation of Filmmakers", "link": "https://www.hollywoodreporter.com/movies/movie-features/basque-films-san-sebastian-javier-giner-nitya-harvester-tv-1236706458/", "summary": "A total of 31 projects with Basque production ties are hitting this year's San Sebastián Film Festival — and some of those creatives are only just getting started: \"We are in a great moment compared to 20 years ago.\"", "date_str": "2026-09-21T10:00:00+00:00", "hash": "d877e1dd595d5316", "title_fa": "«من را با غرور پر می‌کند»: چگونه کشور باسک نسل بعدی فیلمسازان خود را پرورش می‌دهد", "summary_fa": "در مجموع 31 پروژه با تولیدات باسکی در جشنواره فیلم سن سباستین امسال حضور دارند - و برخی از این خلاقیت‌ها تازه شروع شده‌اند: \"در مقایسه با 20 سال پیش در لحظه بسیار خوبی هستیم.\" این دیگر بر کسی پوشیده نیست که سینمای باسک مدتی در کانون توجه قرار گرفته است. به لطف رونق تولید توانا در منطقه، که با تخفیف مالیاتی عظیم 60 درصدی (اف  ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
