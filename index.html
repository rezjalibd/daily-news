 and availability subject to change after time of publication. If you want an advanced fitness tracker in a sleek package, Garmin makes some of the best options for detailed health and workout insights, along with longer battery life than many mainstream smartwatches. One of its most enticing models is the Garmin Vivoactive 6 , which is currently down to a record-low $229.99 (originally $299.99) on Amazon. Garmin Vivoactive 6 GPS Smartwatch, 42mm $229.99 at Amazon $299.99 Save $70.00 Get Deal Get Deal $229.99 at Amazon $299.99 Save $70.00 Its 1.2-inch AMOLED touchscreen is crisp and easier to read than Garmin s older display technology. It s also lightweight at 36 grams with the included band and slim, at just 10.9 mm thick. As a result, it s a better option for overnight wear and sleep tracking than the bulkier Venu. The watch also has a Smart Wake Alarm, which uses a half-hour window to try to wake you during a lighter sleep stage with vibration, giving users a more pleasant way to wake up than a blaring phone alarm. The watch lasts up to 11 days in smartwatch mode, removing the need to charge it nightly, and it delivers up to 21 hours of battery life in GPS-only mode. Built-in GPS lets you accurately track outdoor workouts and activities without bringing your phone, while music storage allows for phone-free listening with compatible Bluetooth headphones. It also features Garmin Pay for contactless payments, so you can leave your wallet behind, too. With more than 80 preloaded sports apps, the Vivoactive 6 is highly versatile and supports a wide range of workouts. It s also a solid option for strength training, with tools to track reps, sets, and rest periods, plus step-by-step workouts for strength, HIIT, yoga, Pilates, mobility, and more. Beyond health and fitness tracking, it includes Garmin Coach plans that adapt to your performance and health metrics, plus daily suggested workouts. It doesn t have every feature serious runners and adventurers may want from the brand s pricier watches, such as more advanced training and navigation tools. But it packs a ton of useful features into a lightweight, everyday-friendly design and lets you spend more time away from your phone if that s the goal. At $70 off, the Garmin Vivoactive 6 is a great choice for iPhone and Android users who want a capable fitness smartwatch without the premium Garmin price tag. Our Best Editor-Vetted Tech Deals Right Now Ap", "date_str": "2026-09-15T20:30:08+00:00", "hash": "a7131b61eb265688", "title_fa": "Garmin Vivoactive 6 در حال حاضر 70 دلار تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اگر یک ردیاب تناسب اندام پیشرفته در یک بسته شیک می‌خواهید، Garmin برخی از بهترین گزینه‌ها را برای اطلاعات دقیق درباره سلامتی و تمرین، همراه با عمر باتری طولانی‌تر از بسیاری از ساعت‌های هوشمند معمولی ارائه می‌کند. یکی از جذاب‌ترین مدل‌های آن Garmin Vivoactive 6 است که در حال حاضر به رکورد پایین 229.99 دلار (در اصل 299.99 دلار) در آمازون رسیده است. ساعت هوشمند Garmin Vivoactive 6 GPS، 42 میلی متری 229.99 دلار در آمازون 299.99 دلار صرفه جویی 70.00 دلار دریافت معامله دریافت معامله 229.99 دلار در آمازون 299.99 دلار پس انداز 70.00 دلار صفحه نمایش لمسی AMOLED 1.2 اینچی آن واضح تر است و خوانش آن آسان تر از فناوری قدیمی Garmin است. همچنین وزن آن 36 گرم با بند همراه و باریک است و تنها 10.9 میلی متر ضخامت دارد. در نتیجه، نسبت به Venu حجیم‌تر، گزینه بهتری برای پوشیدن و ردیابی خواب شبانه است. این ساعت همچنین دارای هشدار بیدار شدن هوشمند است که با استفاده از یک پنجره نیم ساعته سعی می کند شما را در مرحله خواب سبک تر با لرزش بیدار کند و به کاربران روشی دلپذیرتر برای بیدار شدن از زنگ هشدار تلفن همراه می دهد. این ساعت در حالت ساعت هوشمند تا 11 روز دوام می آورد و نیاز به شارژ شبانه آن را برطرف می کند و در حالت فقط GPS تا 21 ساعت عمر باتری را ارائه می دهد. GPS داخلی به شما امکان می‌دهد تمرینات و فعالیت‌های خارج از منزل را بدون همراه داشتن تلفن خود به دقت پیگیری کنید، در حالی که ذخیره‌سازی موسیقی امکان گوش دادن بدون تلفن را با هدفون‌های بلوتوث سازگار فراهم می‌کند. همچنین دارای Garmin Pay برای"}, {"source": "Lifehacker", "title": "10 Hacks Every macOS 27 User Should Know", "link": "https://lifehacker.com/tech/10-hacks-every-macos-27-golden-gate-user-should-know?utm_medium=RSS", "summary": "macOS 27 Golden Gate is now available for every Mac that runs Apple Silicon. As long as you don't own a Mac with an Intel processor , you should be able to update to macOS 27. This update includes a bunch of new features, but Apple's focus has been more on stability, bug fixes, and to some extent, fixing some design missteps from macOS 26. I've been running Golden Gate on my primary Mac for a few weeks now, and these are the 10 best macOS 27 hacks I've found: Use this slider to reduce Liquid Glass effects macOS 26 Tahoe introduced Liquid Glass animations, but that didn't resonate with many users . Apple has walked back those changes since , and with macOS 27, you can use a slider to precisely control Liquid Glass effects. I think reducing Liquid Glass improves readability, so that's what I've chosen. To make the change, click the Apple logo in the top-left corner of your Mac's display, and select System Settings Appearance . You can now use the slider in the \"Liquid Glass\" section. Move it to the right to reduce the effect. Use this gesture to refresh pages like you would on iOS Pull-to-refresh, developed by former Apple engineer Loren Brichter, is one of the iPhone's most iconic gestures. This gesture has now arrived on the Mac, as some first-party apps now let you pull-to-refresh in macOS 27. You can try it on your MacBook (or iMac if you have a trackpad) by opening a webpage in Safari, and performing a two-finger swipe gesture. If you use natural scrolling, then you can use two fingers to swipe downwards. If not, then swipe upwards with two fingers. This will refresh the webpage. The gesture also works in Mail, Calendar, News, and Podcasts Use this tool to draw and create art in Apple Notes and Freeform There's a new drawing tool in Apple Notes and Freeform in macOS 27, which you can use to create art and other drawings. To try it in Freeform, open the app, and click the pen icon in the toolbar up top. You can now use the trackpad or a mouse to draw on the board. Similarly, you can select a note (or create a new one) in Apple Notes, hit the pen icon, and start sketching. Use the new Siri app to set timers, reminders, and answer your questions macOS 27 has a dedicated Siri app, which you can use for all interactions with the virtual assistant. Once you open the app, you can speak or type your request, and Siri will handle the rest. If you disable \"Hey Siri,\" as I've done, opening the Siri app automatically shows a \"Type to Siri\" popover. You can then typ", "date_str": "2026-09-15T20:00:00+00:00", "hash": "fcc83ef8b60f8ba9", "title_fa": "10 هک که هر کاربر macOS 27 باید بداند", "summary_fa": "macOS 27 Golden Gate اکنون برای هر مکی که Apple Silicon را اجرا می کند در دسترس است. تا زمانی که صاحب یک مک با پردازنده اینتل نیستید، باید بتوانید به macOS 27 به‌روزرسانی کنید. این به‌روزرسانی شامل مجموعه‌ای از ویژگی‌های جدید است، اما تمرکز اپل بیشتر بر روی پایداری، رفع اشکال‌ها و تا حدودی رفع برخی اشتباهات طراحی از macOS 26 بوده است. من چند هفته است که Golden Gate را بر روی Mac اصلی خود اجرا می کنم و اینها 10 هک برتر macOS 27 هستند که پیدا کردم: از این نوار لغزنده برای کاهش جلوه های Liquid Glass استفاده کنید macOS 26 Tahoe انیمیشن های Liquid Glass را معرفی کرد، اما این مورد برای بسیاری از کاربران طنین انداز نشد. اپل از آن زمان به بعد این تغییرات را لغو کرده است و با macOS 27، می‌توانید از یک نوار لغزنده برای کنترل دقیق جلوه‌های Liquid Glass استفاده کنید. من فکر می کنم کاهش شیشه مایع خوانایی را بهبود می بخشد، بنابراین این چیزی است که من انتخاب کرده ام. برای انجام این تغییر، روی لوگوی اپل در گوشه سمت چپ بالای صفحه نمایش مک کلیک کنید و تنظیمات ظاهری سیستم را انتخاب کنید. اکنون می توانید از نوار لغزنده در بخش \"شیشه مایع\" استفاده کنید. برای کاهش اثر آن را به سمت راست حرکت دهید. از این ژست برای بازخوانی صفحات مانند آنچه در iOS استفاده می کنید استفاده کنید Pull-to-refresh که توسط مهندس سابق اپل، لورن بریشتر توسعه داده شده است، یکی از نمادین ترین حرکات آیفون است. این ژست اکنون در مک وارد شده است، زیرا برخی از برنامه های شخص اول اکنون به شما امکان می دهند در macOS 27 pull-to-refresh را انجام دهید. می توانید با باز کردن صفحه وب در Safari و انجام یک حرکت تند کشیدن با دو انگشت، آن"}, {"source": "Lifehacker", "title": "How to Get the Most Cloud Storage Possible for Free", "link": "https://lifehacker.com/tech/how-to-get-the-most-cloud-storage-for-free?utm_medium=RSS", "summary": "Cloud storage is likely an essential part of your data management strategy, whether you're just using Google Drive for documents or you back up everything to a remote service. You can get a significant amount of space for a reasonable monthly fee, but if you prefer not to pay, it's possible to combine free options and cobble together quite a bit of free storage around 80GB (or more) at no cost. A reminder: You shouldn't rely solely on cloud storage for your backups. Follow the 3-2-1 rule , which protects against a single point of failure, such as getting locked out of your account or issues with the service itself. Google: 15GB of free cloud storage The most obvious option for free storage is Google Drive. Google offers up to 15GB of storage per account, though this is split across all Google apps, including Gmail, Google Drive, and Google Photos as well as Android backups. You could create multiple Google accounts, which would allow you to stack 15GB allotments. Note that Google recently introduced a 5GB free storage cap on some new accounts, though you can get around this by linking a phone number. Apple iCloud: 5GB of free cloud storage iCloud users automatically get 5GB of free storage, split across backups, photos, and files, as well as data from Messages, Mail, Contacts, FaceTime, voice memos, and Apple Invites. You can delete content to reduce the size of your iCloud backup to manage available storage space. The cheapest paid iCloud+ tier comes with 50GB storage for around $1 per month. Microsoft OneDrive: 5GB of free cloud storage Similar to iCloud, OneDrive comes with 5GB of free cloud storage, and all you need is a Microsoft 365 account. This limit is shared across documents, files, and photos Outlook gets a separate 15GB allotment. Box: 10GB of free cloud storage Box offers 10GB of secure storage on its free plan. There's a 250GB file upload limit, so this isn't the best option for media or larger files, plus you only get access to one file version. Free users do get 5 e-signature requests per month, so Box is a good choice for documents. Dropbox: 2GB of free cloud storage Dropbox's free plan is limited to just 2GB of storage, which can be filled with photos, documents, and files from up to three devices. You can also use Dropbox to share files and collaborate with other users, and the service integrates with many third-party apps. Proton Drive: 5GB of free cloud storage Proton is known for its privacy-focused products, so Proton Drive is a good", "date_str": "2026-09-15T19:30:00+00:00", "hash": "28a051177887f3a1", "title_fa": "چگونه می توان بیشترین فضای ذخیره سازی ابری را به صورت رایگان دریافت کرد", "summary_fa": "فضای ذخیره‌سازی ابری احتمالاً بخش مهمی از استراتژی مدیریت داده‌های شما است، چه فقط از Google Drive برای اسناد استفاده می‌کنید یا از همه چیز در یک سرویس راه دور نسخه پشتیبان تهیه می‌کنید. شما می توانید مقدار قابل توجهی از فضا را با هزینه ماهانه معقول دریافت کنید، اما اگر ترجیح می دهید پرداخت نکنید، می توانید گزینه های رایگان را با هم ترکیب کنید و مقدار زیادی فضای ذخیره سازی رایگان حدود 80 گیگابایت (یا بیشتر) را بدون هیچ هزینه ای با هم ترکیب کنید. یادآوری: برای تهیه نسخه پشتیبان خود نباید تنها به فضای ذخیره سازی ابری متکی باشید. از قانون 3-2-1 پیروی کنید، که از یک نقطه شکست مانند قفل شدن حساب خود یا مشکلات مربوط به خود سرویس محافظت می کند. گوگل: 15 گیگابایت فضای ابری رایگان واضح ترین گزینه برای ذخیره سازی رایگان گوگل درایو است. Google برای هر حساب تا 15 گیگابایت فضای ذخیره‌سازی ارائه می‌کند، اگرچه این حافظه در همه برنامه‌های Google، از جمله Gmail، Google Drive، و Google Photos و همچنین نسخه‌های پشتیبان اندروید تقسیم می‌شود. می توانید چندین حساب Google ایجاد کنید که به شما امکان می دهد 15 گیگابایت تخصیص را روی هم قرار دهید. توجه داشته باشید که گوگل اخیراً یک سقف ذخیره سازی رایگان 5 گیگابایتی را برای برخی از حساب های جدید معرفی کرده است، اگرچه می توانید با پیوند دادن یک شماره تلفن از این موضوع جلوگیری کنید. اپل iCloud: 5 گیگابایت فضای ابری رایگان کاربران iCloud به طور خودکار 5 گیگابایت فضای ذخیره‌سازی رایگان دریافت می‌کنند که بین نسخه‌های پشتیبان، عکس‌ها و فایل‌ها تقسیم می‌شود و همچنین داده‌های پیام‌ها، ایمیل، مخاطبین، FaceTime، یادداشت‌های صوتی و دعوت‌نامه‌های اپل را دریافت می‌کنند. می‌توانید برای کاهش اندازه پشتیبان iCloud خود برای مدیریت فضای ذخیره‌سازی موجود، محتوا را حذف کنید. ارزان‌ترین سطح پولی iCloud+ با 50 گیگابایت فضای"}, {"source": "Lifehacker", "title": "Everything You Need to Know About the October Prime Day Sale", "link": "https://lifehacker.com/everything-you-need-to-know-about-october-prime-big-deals-day-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. It feels like Amazon's Prime Day 2026 sale just ended, but the company isn't done targeting your wallet yet. The fall version of the mega-sale, known as Prime Big Deal Days , is just around the corner. Here is everything you need to know to prepare for the fall's biggest sale (at least until Black Friday rolls around). What is Prime Big Deal Days? You can think of Prime Big Deal Days as fall's answer to Prime Day. It's a two-day sale with deals in virtually every category you can think of. While Prime Day is the bigger sale of the two, Prime Big Deal Days has grown substantially since its first iteration back in 2022. When is Prime Big Deal Days this year? Amazon announced Prime Big Deal Days 2026 will take place from Oct. 6 Oct. 7. This is the fifth year for Amazon's fall Prime Day sale. Do you need to be a Prime Member to shop during Prime Big Deal Days? Yes, you will need to be a Prime Member to shop the exclusive sales during Amazon's Prime Big Deal Days. Prime membership starts at $14.99 per month. While only you can decide if buying a yearly Prime membership is worth it for you , remember you can always sign up and then cancel your Prime membership once the sale is over: Amazon offers a free 30-day trial , and students get six months for free , so you can shop both days of the event (and even get some early Black Friday deals) before canceling without being charged. Here's how to sign up for a Prime account and all of the benefits that come with it. What sales you can expect during Prime Big Deal Days Prime Day happens in the summer, when you're more likely to see deals on outdoorsy stuff, like gardening equipment, grills, and hot tubs, in addition to the usual tech and Amazon device deals. Since Prime Big Deal Days happens in the fall, you're likely to see more deals on gaming and indoor gym equipment. Amazon has already announced some of the 35 categories that will be on sale, including beauty, tech, kitchen, fashion, and home. Some brands Amazon has already mentioned are: Shark, Princess Polly, Soundcore by Anker, UGG, Nest New York, Sony, Tarte, Adidas, and Barefoot Dreams. Keep an eye on \"Today s Big Deals,\" since that's where you'll see the biggest discounts from major brands, according to Amazon's press release. Amazon also teased deals for up to 45% off Amazon devices, kitchen appliances for up to 40% off, print books f", "date_str": "2026-09-15T18:30:00+00:00", "hash": "ca96f314e1687dd6", "title_fa": "هر آنچه که باید در مورد فروش روز اول اکتبر بدانید", "summary_fa": "افزودن به عنوان منبع برگزیده در Google افزودن به عنوان منبع برگزیده در Google ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کن shelves and into Amazon shopping carts that it can be tough to figure out which ones are worth your money. I've been covering smart glasses for Lifehacker for years, testing everything I can get my eyes on. Below are my favorite smart glasses for 2026, broken down by how people actually use them. Best smart glasses overall: Ray-Ban Meta Glasses (Gen 2) Credit: Robyn Johnson Meta's Ray-Ban and Oakley shades own about 80% of the smart glasses market in the United States, and it's not only because they were first to market. Meta glasses look good, are comfortable enough to wear all day, and have an excellent 12MP camera, decent audio, and reliable AI integration. Most importantly, their core features, like the always-ready hands-free camera, instant translation, and instant AI, are useful without being obtrusive. If you can deal with Meta's sometimes spotty reputation when it comes to privacy, these are great smart glasses. Read my full review here . Ray-Ban Meta Glasses (Gen 2) $409.00 at Amazon Shop Now Shop Now $409.00 at Amazon Best display style smart glasses: XReal One Pro Credit: Stephen Johnson XReal's flagship glasses are like a multi-monitor PC you can put in your pocket. These tethered glasses plug into your laptop, phone, or game console via USB-C, giving you the equivalent of a 171\" screen for gaming, streaming, or working. What sets these apart from other display glasses is the onboard X1 spatial computing chip that allows for smooth head-tracking, ultra-wide video that wraps around you, and the ability to pin virtual screens wherever you like. You can even combine them with a sold-separately camera and a control puck to bring you even closer to the future. These are hands down the best \"portable theater\" glasses you can buy right now. Read my full review here . XReal One Pro Glasses $449.00 at Amazon $579.00 Save $130.00 Shop Now Shop Now $449.00 at Amazon $579.00 Save $130.00 Best privacy-focused camera glasses: HTC Vive Eagle Credit: Stephen Johnson dium=RSS", "summary": "We may earn a commission from links on this page. If someone on your gift list is looking to make their home smarter, the challenge can be daunting. There are a lot of smart products out there , all with varying price points and feature sets. What's more, smart home designs can be as simple or as complex as the user wants them to be: Maybe someone wants to be able to control their lights with the same convenient smart speaker they use to listen to music, while others might want their house running on automations. If you're here, you likely know your giftee is looking for smart home devices but aren't sure where to start. As such, I've compiled some of the most popular smart categories and highlighted a specific product that is generally best for the majority of users interested in that type of device. (Though, with all technology gifts, my main piece of advice is asking what your recipient wants exactly that will help eliminate risks of buying something incompatible with their systems, or something that requires a subscription they don't want to pay for.) Best smart speaker gift: Echo Dot Max Echo Dot Max Speaker $119.99 at Amazon Get Deal Get Deal $119.99 at Amazon \"Smart home\" encompasses a myriad of product categories, but for me, the most important is arguably the smart speaker. It's the most universal by far: A smart speaker can act as a smart hub to power the rest of your smart home, or it can be your only smart device. Maybe someone on your list wants to build out their smart home, and this is their first step, or they simply want something that can play music and tell them the weather at the same time. It's tough to pick a smart speaker to recommend over all others, since this category is particularly platform-dependent. If your giftee is all-in on the Apple ecosystem, the HomePod mini could be the best choice; on the other hand, if they love Google products, the Google Home Speaker could be equally as solid. However, if I have to choose one speaker over all others, I'd have to go with Amazon. It's not that I necessarily think Amazon's product has the best audio quality, but I do think it's the most universal speaker of the bunch. It doesn't matter what platform your recipient depends on; they can connect their Amazon speaker to it and power any number of smart home devices. If they happen to have other Amazon devices, like a Fire TV or Kindle, even better; if not, it won't hurt. Amazon makes quite a few smart speakers these days, but I'm focused o", "date_str": "2026-09-15T17:10:38+00:00", "hash": "862f4e2af4488a07", "title_fa": "اینها بهترین هدایای خانه هوشمند سال 2026 هستند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اگر شخصی در لیست هدیه شما به دنبال هوشمندتر کردن خانه خود است، این چالش می تواند دلهره آور باشد. محصولات هوشمند زیادی در بازار وجود دارد، همه با قیمت ها و مجموعه ویژگی های متفاوت. علاوه بر این، طراحی‌های خانه‌های هوشمند می‌توانند به همان اندازه که کاربر می‌خواهند ساده یا پیچیده باشند: شاید شخصی بخواهد بتواند چراغ‌های خود را با همان بلندگوی هوشمند مناسبی که برای گوش دادن به موسیقی استفاده می‌کند کنترل کند، در حالی که دیگران ممکن است بخواهند خانه‌شان با اتوماسیون کار کند. اگر اینجا هستید، احتمالاً می دانید که هدیه دهنده شما به دنبال دستگاه های خانه هوشمند است اما مطمئن نیستید از کجا شروع کنید. به این ترتیب، من برخی از محبوب‌ترین دسته‌های هوشمند را گردآوری کرده‌ام و محصول خاصی را برجسته کرده‌ام که عموماً برای اکثر کاربران علاقه‌مند به آن نوع دستگاه بهترین است. (هر چند، با همه هدایای فناوری، توصیه اصلی من این است که بپرسم گیرنده شما دقیقاً چه چیزی می خواهد که به از بین بردن خطرات خرید چیزی ناسازگار با سیستم های آنها کمک می کند، یا چیزی که نیاز به اشتراکی دارد که نمی خواهند برای آن هزینه بپردازند.) بهترین هدیه بلندگوی هوشمند: بلندگوی Echo Dot Max Echo Dot Max 119.99 دلار. در Amazon. دسته‌های بی‌شماری محصول، اما برای من، مهم‌ترین آن بلندگوی هوشمند است. این تا کنون جهانی ترین است: یک بلندگوی هوشمند می تواند به عنوان یک هاب هوشمند برای تامین انرژی بقیه خانه هوشمند شما عمل کند، یا می تواند تنها دستگاه هوشمند شما باشد. شاید فردی در لیست شما بخواهد خانه هوشمند خود را بسازد، و این اولین قدم او است، یا به سادگی چیزی می خواهد که بتواند موسیقی پخش کند و همزمان آب و هوا را به او بگوید. انتخاب یک"}, {"source": "Lifehacker", "title": "I Tried 'Tailscale,' the Self-Hosted VPN Service That Makes It Look Like You're Always Home", "link": "https://lifehacker.com/tech/i-tried-tailscale-the-self-hosted-vpn-service?utm_medium=RSS", "summary": "Tailscale wasn't on my radar until a friend recently raved about its capabilities to me. Looking around the web, it seems the software has attracted a loyal following; perhaps part of the reason I hadn't come across it before is that it's not all that easy to understand what it does. Tailscale is technically a VPN (Virtual Private Network), but not in the way the term is typically used. Whereas something like NordVPN or ExpressVPN connects you to someone else's network to access the wider web, Tailscale does the opposite, and connects you to your own network from outside. Start your tailnet with one of the apps. Credit: Lifehacker \"Remote access technology\" has been around for years, of course, but it often involves a lot of detailed and technical setup steps you want to be able to access your home network remotely without letting anyone else in, and that usually means some complicated configuration involving router settings and several third-party apps. There's none of that with Tailscale, and when you actually install the software, you quickly start to see what all the fuss is about. You can be sitting in a coffee shop or hotel room and have virtually the same access to your home network as you would if you were actually in your living room, which has all kinds of benefits, from file sharing to managing your smart home devices. The obvious use case is remote access to a computer you have at home, without the layers of complexity or using another company's servers. Tailscale also makes it easier to access media servers you've set up with apps like Plex or Jellyfin, and smart home setups running through Home Assistant or another dashboard. You can be set up in minutes. Credit: Lifehacker Everything is built on the open-source WireGuard VPN protocol, which creates private and encrypted links to all of the devices you want to connect to your network your \"tailnet.\" To add a new device, just install Tailscale on it, whether it's your phone on a 5G connection or a desktop computer set up at the office. Tailscale is free for personal use, which covers up to six individual users and an unlimited number of personal devices, though there are some limits: 50 tagged resources (always-on devices that need multi-user access, like a NAS box), and three Access Control List or ACL groups (for setting access permissions per user). Paid plans start at $8 per month. Putting Tailscale to the test The ease of setup is one of the main appeals of Tailscale, and it couldn't be m", "date_str": "2026-09-15T16:00:00+00:00", "hash": "ebe807f9004b7967", "title_fa": "من \"Tailscale\" را امتحان کردم، سرویس VPN خود میزبانی که باعث می شود به نظر برسد همیشه در خانه هستید", "summary_fa": "Tailscale در رادار من نبود تا اینکه یکی از دوستان اخیراً در مورد قابلیت‌های آن برای من صحبت کرد. با نگاهی به وب، به نظر می رسد این نرم افزار طرفداران وفاداری را به خود جلب کرده است. شاید بخشی از دلیلی که من قبلاً با آن برخورد نکرده بودم این بود که درک اینکه چه کاری انجام می دهد چندان آسان نیست. Tailscale از نظر فنی یک VPN (شبکه خصوصی مجازی) است، اما نه به روشی که معمولاً از این اصطلاح استفاده می شود. در حالی که چیزی مانند NordVPN یا ExpressVPN شما را به شبکه شخص دیگری برای دسترسی به وب گسترده تر متصل می کند، Tailscale برعکس عمل می کند و شما را از خارج به شبکه خود متصل می کند. tailnet خود را با یکی از برنامه ها راه اندازی کنید. اعتبار: «فناوری دسترسی از راه دور» لایف هکر سال‌هاست که وجود دارد، البته، اما اغلب شامل مراحل راه‌اندازی دقیق و فنی زیادی است که می‌خواهید بتوانید از راه دور به شبکه خانگی خود دسترسی داشته باشید بدون اینکه اجازه ورود دیگران را بدهید، و این معمولاً به معنای پیکربندی پیچیده‌ای است که شامل تنظیمات روتر و چندین برنامه شخص ثالث می‌شود. هیچ‌کدام از اینها در Tailscale وجود ندارد، و وقتی واقعاً نرم‌افزار را نصب می‌کنید، به سرعت متوجه می‌شوید که این همه هیاهو برای چیست. شما می توانید در یک کافی شاپ یا اتاق هتل نشسته باشید و تقریباً همان دسترسی را به شبکه خانگی خود داشته باشید که اگر واقعاً در اتاق نشیمن خود بودید، که همه نوع مزیت دارد، از اشتراک گذاری فایل گرفته تا مدیریت دستگاه های هوشمند خانه شما. مورد استفاده آشکار، دسترسی از راه دور به رایانه ای است که در خانه دارید، بدون لایه های پیچیدگی یا استفاده از سرورهای شرکت دیگری. Tailscale همچنین دسترسی به سرورهای رسانه‌ای را"}, {"source": "Lifehacker", "title": "10 Shows Like 'Outlander' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-outlander-and-blood-of-my-blood?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Outlander asks the all-important question: what if the Jacobite rising was very, very horny? The series proper, an adaptation of the enduring books by Diana Gabaldon, has ended after an impressive eight seasons, but the second season premiere of Blood of My Blood , the spin-off/prequel involving Claire's and Jamie's parents, is debuting right about now. Showrunner Matthew B. Roberts has plans for at least three seasons, and Gabaldon is at work on at least one more novel, so there's plenty more Outlander action to come. In the meantime, here are 10 more sultry historical romances you can stream now some of them even involve time travel! Lost in Austen (2008) A bit of bonus time travel back to 2008 for this breezy fantasy that's become a bit of a cult fave, initial ratings notwithstanding. Jemima Rooper is Amanda Price, a modern-day Austen fan navigating the fallout of a terrible wedding proposal from her drunk boyfriend when she hallucinates (she thinks) seeing Elizabeth Bennett in the bathroom. Before long, she finds herself swapping places with Lizzy, navigating the Regency era and the events of the novel, roleplaying as a hitherto unknown family friend who draws the eye of more than one marriage prospect. It's simultaneously a soapy romp and a meditation on the meaning of Austen to those of us living in the 21st century. Stream Lost in Austen on Peacock , Prime Video , and Tubi. Lost in Austen (2008) at Peacock Learn More Learn More at Peacock Poldark (2015 2019) No time travel here, except in the magic of period drama, but we do land in 18th century Cornwall, which, OK, isn't Scotland but the earthy vibe isn't entirely dissimilar to Outlander (bosoms will heave, regardless of gender). Aidan Turner is the title's Captain Ross Poldark, a British Army veteran returned home to find his land and inheritance in shambles and his longtime love engaged to another. Luckily, fiery, savvy runaway Demelza (Eleanor Tomlinson) turns up just in time to help him rebuild his life a prelude to the hot and scandalous love affair that only adds to the windswept drama. Stream Poldark on Netflix . Poldark (2015 2019) at Netflix Learn More Learn More at Netflix A Discovery of Witches (2018 2022) Teresa Palmer is Diana Bishop, an American historian at Oxford whose studies lead her back to her own witchy lineage, setting her up for an alliance with Matthew Clairmont (Matthew Goode), a biochemist, but also a vampire, and therefore", "date_str": "2026-09-15T15:30:41+00:00", "hash": "26a423025ad4e3c7", "title_fa": "10 نمایش مانند \"Outlander\" که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اوتلندر این سوال بسیار مهم را می پرسد: چه می شد اگر قیام ژاکوبیت بسیار بسیار شیدا بود؟ این سریال که اقتباسی از کتاب‌های ماندگار دایانا گابالدون است، پس از هشت فصل تاثیرگذار به پایان رسیده است، اما اولین پخش فصل دوم Blood of My Blood، اسپین‌آف/پیش‌آف با حضور والدین کلر و جیمی، در حال حاضر در حال پخش است. مجری برنامه متیو بی. رابرتز حداقل برای سه فصل برنامه دارد و گاب       media: [{"source": "Billboard", "title": "Offset Announces ‘She Ain’t Mine’ Single to Launch New Solo Era: ‘Just Something I Need’", "link": "https://www.billboard.com/music/rb-hip-hop/offset-she-aint-mine-single-announcement-1236340967/", "summary": "Offset has launched a new solo era. The Atlanta rapper announced Tuesday (Sept. 15) that his She Ain t Mine single is set to arrive on Friday (Sept. 18). Set shared a video teaser on Monday and then followed up with the cover art, which finds him in a body of water hugging an unidentified woman. JUST SOMETHING I NEED, he added in the caption. Related Quavo Confirms Final Migos Album Tour With Offset Is in the Works: We Going to Do It Right Quavo Offset Heat Up Migos Reunion Rumors With Return to Instagram Offset Released From Hospital After Shooting, Thanks Fans for Support: Life s a Gamble I m Still Playing to Win Internet detectives hopped into Offset s comments trying to figure out who the woman in the artwork was, while some lent guesses like Saweetie or Cardi B rival BIA. An accompanying teaser clip featured Set taking a boat trip on a gloomy day and enjoying some yacht time with various women at sea. She Ain t Mine figures to be the lead single heading into the Migos rapper s next solo project. Offset s last album, Kiari , arrived in September 2025 and debuted at No. 16 on the Billboard 200. Following the solo endeavor, fans can expect Set and Quavo to reunite for a final Migos album and tour together. Huncho sat down with V-103’s DJ Greg Street earlier in September, where he opened up about plans for the Migos. The album will feature posthumous vocals from groupmate Takeoff, who was killed in a shooting in November 2022. “We coming back. We’re going to do it one more time,” Quavo said. “Long live the Rocket … There’s more. We going to tour. We going to do it right. Culture III served as the Migos most recent album, which was released in 2021 and debuted at No. 2 on the Billboard 200 . Ahead of the reunion, Quavo is set to drop his own solo album with Qrömelife , which will arrive on Oct. 2. Find Offset s She Ain t Mine cover art and teaser below. View this post on Instagram View this post on Instagram", "date_str": "2026-09-15T21:44:00+00:00", "hash": "d81e37f57cc2401b", "title_fa": "آفست تک آهنگ \"She Ain't Mine\" را برای راه اندازی دوره جدید سولو اعلام کرد: \"فقط چیزی که من نیاز دارم\"", "summary_fa": "افست یک دوره جدید سولو را راه اندازی کرده است. خواننده رپ آتلانتا سه شنبه (15 سپتامبر) اعلام کرد که تک آهنگ She Ain t Mine او قرار است در روز جمعه (18 سپتامبر) از راه برسد. ست روز دوشنبه یک تیزر ویدیویی را به اشتراک گذاشت و سپس روی جلد را دنبال کرد که او را در آب در حال بغل کردن یک زن ناشناس پیدا کرد. فقط چیزی که به آن نیاز دارم، او در توضیح اضافه کرد. Quavo مرتبط تایید کرد که تور نهایی آلبوم Migos با Offset در دست اجراست: ما این کار را درست انجام خواهیم داد Quavo Offset Heat Up Migos Reunion شایعات با بازگشت به اینستاگرام Offset از بیمارستان پس از فیلمبرداری منتشر شد، از طرفداران برای حمایت تشکر می کنیم: زندگی یک قمار است. آثار هنری بود، در حالی که برخی حدس می زدند مانند Saweetie یا Cardi B رقیب BIA. در یک کلیپ تیزر همراه، ست در حال سفر با قایق در یک روز تاریک و لذت بردن از قایق بادبانی با زنان مختلف در دریا بود. She Ain t Mine تک آهنگ اصلی پروژه انفرادی بعدی رپر Migos است. آخرین آلبوم افست، کیاری، در سپتامبر 2025 وارد شد و در رتبه 16 بیلبورد 200 قرار گرفت. پس از تلاش انفرادی، طرفداران می توانند انتظار داشته باشند که ست و کواوو برای آخرین آلبوم Migos و تور با هم متحد شوند. هونچو در اوایل سپتامبر با دی جی گرگ استریت V-103 صحبت کرد، جایی که او در مورد برنامه های Migos صحبت کرد. این آلبوم دارای آوازهای پس از مرگ از هم گروه Takeoff است که در نوامبر 2022 در تیراندازی کشته شد. Quavo گفت: \"ما برمی گردیم. یک بار دیگر این کار را انجام خواهیم داد.\" زنده باد Rocket… چیزهای بیشتری وجود دارد. ما به تور می رویم. ما این"}, {"source": "Billboard", "title": "The Hayley Williams Show 2026: Here’s Where to Shop Affordable Concert Tickets Online", "link": "https://www.billboard.com/c be offered a full refund without the extra credit. At the time of publishing, Hayley Williams tickets start at $39. EARN REWARDS Find Hayley Williams Tickets at Vivid Seats FIND TICKETS at Vivid Seats Vivid Seats lets you search by type of seat, such as suite, standing room, front of section or the VIP section, while the retailer prioritizes Super Sellers who are experienced, highly-rated sellers. With Vivid Seats, your purchase is protected with the company s 100% Buyer Guarantee, which ensures that you receive legitimate tickets in time for your concert, or your money back. Meanwhile, you can save an additi", "date_str": "2026-09-15T21:37:47+00:00", "hash": "e228f956f259b4c3", "title_fa": "نمایش هیلی ویلیامز 2026: در اینجا می توان بلیط های کنسرت مقرون به صرفه را به صورت آنلاین خرید کرد", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. هیلی ویلیامز، پیشرو زن پارامور، هم‌اکنون در حال تور با نمایش هیلی ویلیامز در سراسر ایالات متحده است، با قرارهایی در شهر نیویورک، سینسیناتی، نیواورلئان، لس آنجلس و دیگر شهرها. ایالات متحده روز دوشنبه 12 اکتبر در آمفی تئاتر BankPlus در اسنودن گروو در ساوتون، می سی سی پی به پایان می رسد. در همین حال، تور در حمایت از آخرین آلبوم او، Ego Death at a Bachelorette Party است که در آگوست 2025 منتشر شد. علاوه بر این، هنرمندان کوچکی از جمله Magena در حال تنظیم هستند. بلیط‌های تور هیلی ویلیامز را در Ticketmaster بخرید بلیط‌های تور ابتدا از طریق Live Nation و Ticketmaster به فروش رفت، در حالی که برنامه تبادل ارزش چهره خرده‌فروش گزینه‌ای برای طرفداران برای فروش مجدد بلیط است. با این حال، بسیاری از تاریخ ها یا فروخته شده اند، یا بسیار نزدیک به فروش هستند، بنابراین یکی از بهترین راه ها برای یافتن بلیط های لحظه آخری هیلی ویلیامز به صورت آنلاین از طریق سایت های شخص ثالث، مانند StubHub، Vivid Seat، SeatGeek، TicketNetwork، Gametime، مرکز بلیط رویداد و موارد دیگر است. همه خرده فروشان آنلاین بلیط های معتبر را به موقع برای کنسرت شما تضمین می کنند. قیمت ها ممکن است در مواقعی بالاتر یا کمتر از ارزش اسمی باشند. کجا می‌توان بلیت‌های نمایش ۲۰۲۶ هیلی ویلیامز را پیدا کرد. انتخاب ویرایشگر آنلاین بلیط‌های هیلی ویلیامز را در StubHub پیدا کنید بلیت‌ها را در StubHub بیابید بهترین انتخاب برای بلیت‌های کنسرت در سال 2026. StubHub قیمت‌های همه جانبه دارد، بنابراین همه هزینه‌ها از قبل فهرست می‌شوند. گارانتی"}, {"source": "Billboard", "title": "‘Tributo al Rey Con Banda Vol. 2’ Unites Vicente Fernández With Different Generations: Stream It Here", "link": "https://www.billboard.com/music/latin/vicente-fernandez-tributo-al-rey-con-banda-vol-2-stream-here-1236340987/", "summary": "Vicente Fernández continues to amaze with the material he left behind before his death on Dec. 12, 2021. Recordings of his most iconic hits, accompanied by Sinaloan banda instead of mariachi, have been compiled into two volumes, featuring the voices of other standout artists in the regional Mexican genre. Tributo al Rey con Banda (Grandes Duetos Vol. 2) , the sixth posthumous production, was released on Tuesday (Sept. 15) via Sony Music. The set includes 10 new duets with established stars such as Julio Preciado on Las Llaves de Mi Alma, Ana Bárbara on Hermoso Cariño and Joan Sebastian on El Último Barco. Related Las 50 Mejores Canciones de Mariachi de Todos los Tiempos, Clasificadas: Selección Editorial The Late Show With Stephen Colbert Wins at 2026 Primetime Emmys: Widow s Bay, Bad Bunny s Super Bowl Halftime More Big Winners Noah Kahan Offers a Bridge Over Troubled Water for Tearful In Memoriam Segment at 2026 Emmys Other artists featured on this compilation include Banda MS on Por Tu Maldito Amor, Edwin Luna y La Trakalosa de Monterrey on Qué de Raro Tiene, Víctor García on Para Siempre, Joss Favela on Bohemio de Afición and Lenin Ramírez on the focus track, Cruz de Olvido. We selected these collaborations with the goal of ensuring that my father s musical legacy continues to transcend time, Vicente Fernández Jr., the project s executive producer and son of Fernández, told Billboard Español . For me, it’s a great honor and privilege to be part of this, added Lenin Ramírez, part of the new-generation of música mexicana artists. I’m so grateful to the Fernández family for choosing me. I hope people enjoy the version I created, and I send a huge hug to Vicente Fernández up in heaven. The album follows Tributo al Rey con Banda (Grandes Duetos Vol. 1) , released this past May, which featured performances from Alejandro Fernández, Christian Nodal and Banda El Recodo, among others. Throughout his career, Vicente Fernández released more than 70 albums and acted in over 30 films. He also received accolades such as the 2002 Latin Recording Academy Person of the Year award and a star on the Hollywood Walk of Fame. Known as El Charro de Huentitán, he remains the most significant figure in ranchera music, boasting 15 million monthly listeners on Spotify. His classic rendition of “El Rey” tops Billboard s 50 Best Mariachi Songs of All Time list, which was published earlier today (Sept. 15). Stream to Tributo al Rey Con Banda (Grandes Duetos Vol. 2) below:", "date_str": "2026-09-15T21:35:51+00:00", "hash": "8c0ae30e19b86152", "title_fa": "Tributo al Rey Con Banda Vol. 2' ویسنته فرناندز را با نسل های مختلف متحد می کند: آن را در اینجا پخش کنید", "summary_fa": "ویسنته فرناندز همچنان با مطالبی که پیش از مرگش در 12 دسامبر 2021 به جا گذاشته بود، شگفت زده می کند. ضبط شده ترین آهنگ های موفق او که به جای ماریاچی با Sinaloan Banda همراهی می شود، در دو جلد گردآوری شده است که صدای هنرمندان برجسته دیگری در ژانر منطقه ای مکزیکی را به نمایش می گذارد. Tributo al Rey con Banda (Grandes Duetos Vol. 2)، ششمین ساخته پس از مرگ، در روز سه شنبه (15 سپتامبر) از طریق سونی موزیک منتشر شد. این مجموعه شامل 10 دوئت جدید با ستارگان شناخته شده ای مانند خولیو پرسیادو در Las Llaves de Mi Alma، Ana Barbara در Hermoso Cariño و Joan Sebastian در El Último Barco است. مرتبط: 50 بهترین آهنگ ماریاچی در تمام دوران، رتبه‌بندی: تحریریه انتخاب شوی دیرهنگام با استفان کولبرت برنده جایزه امی 2026: Widow s Bay, Bad Bunny's Super Bowl Halftime برنده‌های بزرگ بیشتر Noah Kahan پلی بر روی آب آشفته را برای هنرمند Searful In Memori در Others Emmy2 ارائه می‌کند. مجموعه شامل Banda MS در Por Tu Maldito Amor، Edwin Luna و La Trakalosa de Monterrey در Qué de Raro Hace، ویکتور گارسیا در Para Siempre، Joss Favela در Bohemio de Afificación و لنین رامیرز در مسیر تمرکز، Cruz de Olvido. ویسنته فرناندز جونیور، تهیه کننده اجرایی پروژه و پسر فرناندز، به Billboard Español گفت: ما این همکاری ها را با هدف اطمینان از اینکه میراث موسیقی پدرم به فراتر از زمان ادامه می دهد، انتخاب کردیم. لنین رامیرز، بخشی از نسل جدید هنرمندان موسیقی مکزیکی، افزود: برای من، این یک افتخار و امتیاز بزرگ است که بخشی از این باشم. من از خانواده فرناندز که من را انتخاب کردند بسیار سپاسگزارم. امیدوارم مردم از نسخه ای که من ساخته ام لذت ببرند، و من در بهشت ​​برای ویسنته فرناندز در آغوشی بزرگ"}, {"source": "Billboard", "title": "How Should ADÉLA Build Off Her Debut Album’s Impressive Chart Debut?", "link": "https://www.billboard.com/music/pop/adela-prima-top-five-billboard-200-five-burning-questions-1236340795/", "summary": "Though 2026 has been relatively slow in the minting of totally new pop stars, it appears one might be on the way with Slovak singer-songwriter ADÉLA. The rising hitmaker — who first made public notice as a contest on the KATSEYE-forming reality contest show Dream Academy , then as an opener on Demi Lovato s It s Not That Deep tour — released her much-anticipated debut LP PRIMA on Sept. 4. On this week s Billboard 200 (dated Sept. 19), the set bows at No. 4, while charting two singles in the Billboard Hot 100 s top 50: lead single Ain t in LA (which moves 57-30) and follow-up Nicole Kidman (which debuts at No. 45). How does her debut compare to our expectations? And what should she do next to take advantage of all of this? Billboard staffers and contributors answer these questions and more below. 1. ADÉLA s PRIMA bows at No. 4 on the Billboard 200 this week with 56,000 first-week units. Is that first-week performance better, worse or about what you expected? Lyndsey Havens : A bit better! I was expecting top 10, for sure, but once you remember that this album is home to her breakout hit and Hot 100 debut Ain t in LA — plus KGB and Red Bottoms and latest single Nicole Kidman — it s easy to see how it landed in the Billboard 200 s top 5. Kristin Robinson : This is a little below what I expected. No. 4 is a very strong performance from a new artist, and she should be incredibly proud of that. That being said, I must be on the ADÉLA algorithm because, based on how much I’m seeing her song on TikTok, I actually thought this might be No. 2 or 3 this week. This just goes to show how much algorithms — or just a killer digital marketing campaign — can impact our perception of what is popular. Andrew Unterberger : Higher! A debut in the back half of the top 10 would ve still been a total success for ADÉLA on this campaign, given how new she still is and how many hitmakers feel permanently entrenched in the chart s top five at this point. For her to get to No. 4 — well higher than recent efforts by more proven hitmakers like Karol G and Steve Lacy — is a real eye-opener. Alicia Urrea : It’s about what I expected, but in the best way possible. As someone who has been watching ADÉLA’s transformation into the pop star she is now, I had a feeling PRIMA would have a very strong debut. The momentum around her has been building for some time, and the moment “Ain’t in LA” dropped, it felt like the beginning of a much bigger moment for her. A No. 4 debut with 56,000 units feel", "date_str": "2026-09-15T21:17:12+00:00", "hash": "b4e38b9dafd2eef6", "title_fa": "ADÉLA چگونه باید از اولین نمودار چشمگیر اولین آلبوم خود بسازد؟", "summary_fa": "اگرچه سال 2026 در ساخت ستارگان پاپ کاملاً جدید نسبتاً کند بوده است، به نظر می رسد که ممکن است با خواننده و ترانه سرای اسلواکی ADÉLA در راه باشد. این هیت‌ساز در حال رشد - که ابتدا به عنوان یک مسابقه در برنامه مسابقه واقعیت ساز KATSEYE و سپس به عنوان افتتاحیه تور Its Not That Deep دمی لواتو به اطلاع عموم رساند - اولین LP PRIMA را در 4 سپتامبر منتشر کرد. 4، در حالی که دو تک‌آهنگ را در 50 آهنگ برتر Billboard Hot 100 جدول می‌آورید: تک آهنگ اصلی Ain t در لس‌آنجلس (که 57-30 حرکت می‌کند) و دنباله‌دار نیکول کیدمن (که در رتبه 45 قرار می‌گیرد). اولین بازی او چگونه با انتظارات ما مقایسه می شود؟ و او برای استفاده از همه اینها چه باید بکند؟ کارکنان و همکاران بیلبورد به این سوالات و موارد دیگر در زیر پاسخ می دهند. 1. ADÉLA s PRIMA در این هفته با 56000 واحد در هفته اول، در رتبه 4 بیلبورد 200 قرار گرفت. آیا عملکرد هفته اول بهتر است، بدتر است یا در حد انتظار شماست؟ Lyndsey Havens: کمی بهتر است! مطمئناً منتظر 10 آلبوم برتر بودم، اما وقتی به یاد بیاورید که این آلبوم خانه موفقیت او و اولین آلبوم Hot 100 Ain t در لس آنجلس است - به علاوه KGB و Red Bottoms و آخرین تک آهنگ نیکول کیدمن - به راحتی می توانید ببینید که چگونه در بیلبورد 200s برتر 5 قرار گرفت. کریستین رابینسون: این چیزی است که من انتظار داشتم. خیر 4 یک اجرای بسیار قوی از یک هنرمند جدید است و او باید به آن افتخار کند. همانطور که گفته شد، من باید بر روی الگوریتم ADÉLA باشم، زیرا بر اساس میزان دیدن آهنگ او در TikTok، در واقع فکر کردم که ممکن است این هفته شماره 2 یا 3"}, {"source": "Billboard", "title": "After Macklemore’s Removal & Opener Exodus, What’s Next for Ed Sheeran’s Tour?", "link": "https://www.billboard.com/pro/macklemore-removed-ed-sheeran-tour-whats-next-faq/", "summary": "On Monday (Sept. 14), Seattle rapper Macklemore was removed from his opening slot on Ed Sheeran ’s Loop Tour, just a week after performing two shows at New Jersey’s MetLife Stadium during which he performed his protest anthem “Hind’s Hall” and said “Free Palestine” from the stage. The performances, which had sparked criticism on social media from the likes of P!nk and Boy George , came amid Macklemore’s criticism of the Israeli government’s war in Gaza; “Hind’s Hall” was originally released in May 2024. Macklemore had originally been slated to perform at 10 of Sheeran’s Loop Tour shows, but only made the two appearances at MetLife before he was pulled from the trek. Related Robert Kraft Calls Macklemore s Free Palestine Statements Deeply Offensive : A Line Had Been Crossed Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction “Last Monday, in the middle of all the media attention surrounding Pink and what I said at MetLife, Ed told me that Robert Kraft called him,” Macklemore wrote on Instagram . “We were scheduled to play Gillette Stadium later this month, which is owned by the Kraft Group. Ed told me that Kraft said I would not be allowed to perform in his stadium. Ed also told me that Kraft had rallied some of the other stadium owners and collectively they gave him an ultimatum: if Macklemore stays on the tour, you will not be allowed to play in our venues.” In his own statement , Kraft said, “Based on Macklemore’s recent actions, material shared from the stage during Ed Sheeran’s shows in New Jersey, and a broader history of antisemetic rhetoric and imagery that we believe has been deeply offensive and hurtful to the Jewish community, we determined that his participation in the Sept. 25 and 26 concerts at Gillette Stadium would cross that line.” On Tuesday (Sept. 15), Sheeran spoke up , noting that “Macklemore coming off tour was the promoter’s decision, it was not mine. Macklemore’s contract for the tour was with the promoter, not me.” That promoter, Messina Touring, also released a statement, which was first shared with Rolling Stone , which said it had “been notified by venues on the upcoming U.S. tour dates that they will not allow a concert to take place with Macklemore on the lineup, which would result in the cancellation of the tour and impact hundreds of thousands of fans.” Now, in addition to Macklemore, openers Finneas , Lukas Graham and Aaron Rowe al", "date_str": "2026-09-15T21:11:24+00:00", "hash": "6bdda0200d96b778", "title_fa": "بعد از حذف و خروج بازکن مککلمور، تور اد شیران بعدی چیست؟", "summary_fa": "روز دوشنبه (14 سپتامبر)، مککلمور، خواننده رپ سیاتل، از محل افتتاحیه خود در تور حلقه اد شیران، تنها یک هفته پس از اجرای دو نمایش در استادیوم مت لایف نیوجرسی که طی آن سرود اعتراضی خود \"Hind's Hall\" را اجرا کرد و از روی صحنه گفت \"فلسطین را آزاد کنید\" حذف شد. این اجراها که در رسانه های اجتماعی مورد انتقاد افرادی مانند P!nk و Boy George قرار گرفت، در بحبوحه انتقاد مککلمور از جنگ دولت اسرائیل در غزه انجام شد. \"Hind's Hall\" در ابتدا در ماه مه 2024 منتشر شد. مککلمور در ابتدا قرار بود در 10 برنامه تور شیران اجرا کند، اما فقط قبل از اینکه از سفر بیرون کشیده شود، دو بار در MetLife ظاهر شد. مرتبط رابرت کرافت بیانیه‌های فلسطین آزاد مکلمور را عمیقا توهین‌آمیز می‌خواند: یک خط بیلبورد برای افزودن آلبوم‌های رسانه‌های هوشمند به عنوان فرمت‌های فروش واجد شرایط در نمودار، دوان کفه دی دیویس اولین مصاحبه را پس از محکومیت قتل توپاک شکور انجام می‌دهد «دوشنبه گذشته، در وسط همه رسانه‌ها در Pinkt و کرافت به من گفتم رابرت به من گفتم مکلمور در اینستاگرام نوشت. ما قرار بود در اواخر این ماه با استادیوم ژیلت که متعلق به گروه کرافت است، بازی کنیم. اد به من گفت که کرافت گفته است که اجازه نخواهم داد در استادیوم او اجرا کنم. اد همچنین به من گفت که کرافت برخی دیگر از مالکان استادیوم را جمع کرده است و آنها در مجموع به او اولتیماتوم دادند: اگر مکلمور در تور بماند، اجازه بازی در سالن های ما را نخواهید داشت. کرافت در بیانیه خود گفت: «بر اساس اقدامات اخیر مکلمور، مطالبی که از روی صحنه در نمایش‌های اد شیران در نیوجرسی به اشتراک گذاشته شد، و تاریخچه وسیع‌تری از لفاظی‌ها و تصاویر یهودی‌ستیزانه که به اعتقاد ما برای جامعه یهودی عمیقاً توهین‌آمیز و آسیب‌رسان بوده"}, {"source": "Billboard", "title": "Ricardo Montaner Is Back on Top as ‘Para Que Seas Feliz’ Ends 24-Year Wait for Latin Pop Airplay No. 1: ‘Totally Unexpected’", "link": "https://www.billboard.com/music/chart-beat/ricardo-montaner-para-que-seas-feliz-latin-pop-airplay-1236340872/", "summary": "Ricardo Montaner reclaims his Billboard Latin Pop Airplay No. 1 status after 24 years, as “Para Que Seas Feliz” rises 4-1 on the chart dated Sept. 19. It s his 40th hit on the chart, his fourth leader, and his first No. 1 on the list in more than 24 years, since Yo Puedo Hacer spent two weeks on top in August 2002. “During the 1990s, I had become familiar with repeatedly appearing in Billboard’s top 10,” Montaner tells Billboard on the road. “It was familiar territory, and I must admit that, for a while, I missed it.” Related It’s a ‘Polaroid’ Moment for Eladio Carrión With Second Latin Airplay No. 1 Jay Wheeler’s ‘De Lejitos’ Gets Up Close With No. 1 on Latin Airplay: ‘Fills Me With Great Pride’ Becky G Returns to Top Latin Pop Albums Chart With Baraja Bendita In total, the singer-songwriter has etched four career chart-toppers among his 40 entries on the tally, dating to 1994. Here are those No. 1s on Latin Pop Airplay: Title, Peak Date, Weeks at No. 1 “Es Así” Dec. 6, 1997, one “El Poder De Tu Amor,” Oct. 2, 1999, three “Yo Puedo Hacer,” Aug. 10, 2002, two “Para Que Seas Feliz,” Sept. 19, 2026 “Para Que Seas Feliz” climbs 4-1 on Latin Pop Airplay —after spending 13 earlier weeks in the top 10 during its 23-week run (and counting)— with 5.5 million audience impressions, up 60%, earned in the United States in the week ending Sept. 10, according to Luminate. “Returning after more than 20 years—and doing so as I turn 69 this month—is quite an achievement,” Montaner muses. “That’s why, in music, there are no deadlines or expiration dates. I’m thrilled about this No. 1, which feels like my first No. 1 all over again: completely unexpected.” Only one other artist has endured a longer gap between No. 1s on Latin Pop Airplay: Gloria Estefan, whose “No Me Dejes de Querer” topped the chart in June 2000, followed by “Raíces” in May 2025—a 24-year, 11-month wait, 10 months longer than Montaner’s 24-year, one-month gap. Despite the long gap between No. 1s, Montaner has never lost presence on Latin Pop Airplay. His chart journey began with the No. 5-peaking “No Te Pareces a Mí” in 1994 and surged highest in the 2000s—his most prolific decade, with 17 entries, compared with nine in the 1990s, seven in the 2010s and seven so far in the 2020s. Montaner’s Latin Airplay Comeback Hits Top 10: “Para Que Seas Feliz” also earns Montaner his ninth Latin Airplay top 10, debuting at No. 8 and marking his first appearance in the region since “Cuando a Mi Lado Estás” in 2005. The a", "date_str": "2026-09-15T21:09:22+00:00", "hash": "15dec626df178f95", "title_fa": "ریکاردو مونتانر به عنوان «Para Que Seas Feliz» به پایان می رسد که 24 سال انتظار برای پخش پاپ لاتین شماره 1 را به پایان می رساند: «کاملا غیرمنتظره»", "summary_fa": "ریکاردو مونتانر پس از 24 سال جایگاه شماره 1 پخش پاپ لاتین بیلبورد خود را پس گرفت، زیرا \"Para Que Seas Feliz\" 4-1 در نمودار مورخ 19 سپتامبر صعود کرد. این چهلمین موفقیت او در نمودار، چهارمین رهبر او و اولین شماره 1 او در لیست در بیش از 24 سال از اوت 20 در اوت 20 است. مونتانر به بیلبورد در جاده می گوید: «در طول دهه 1990، من با حضور مکرر در 10 بیلبورد برتر آشنا شده بودم. \"این منطقه آشنا بود، و باید اعتراف کنم که برای مدتی آن را از دست دادم.\" مرتبط این یک لحظه «پولاروید» برای Eladio Carrión با پخش دوم لاتین شماره 1 است. «De Lejitos» از Jay Wheeler با شماره 1 در ایرپلی لاتین نزدیک می شود: «Fills Me With Great Pride» بکی جی به بالاترین آلبوم های پاپ لاتین برمی گردد. در میان 40 ثبت نام او در فهرست، مربوط به سال 1994. 1 ها در پخش پاپ لاتین: عنوان، تاریخ اوج، هفته های شماره 1 \"Es Así\" 6 دسامبر 1997، یک \"El Poder De Tu Amor\"، 2 اکتبر 1999، سه \"Yo Puedo Hacer\"، 10 اوت 2002، دو قسمت \"Paralie Sept.20,6\" طبق گزارش Luminate، «Para Que Seas Feliz» 4-1 در پخش پاپ لاتین - پس از گذراندن 13 هفته قبل در بین 10 فیلم برتر در طول 23 هفته پخش (و تعداد زیاد) - با 5.5 میلیون بازدید مخاطب، 60 درصد، در ایالات متحده در هفته منتهی به 10 سپتامبر، صعود کرد. مونتانر می گوید: «بازگشت پس از بیش از 20 سال - و انجام این کار در حالی که در این ماه 69 ساله می شوم - یک موفقیت است. \"به همین دلیل است که در موسیقی، هیچ مهلت یا تاریخ انقضا وجود ندارد. من در مورد این شماره 1 هیجان زده هستم، که دوباره احساس می کنم اولین شماره"}, {"source": "Billboard", "title": "Ed Sheeran Has No Tour Openers Left After Finneas & Lukas Graham Drop Out Over Macklemore ‘Free Palestine’ Controversy", "link": "https://www.billboard.com/music/music-news/finneas-lukas-graham-ed-sheeran-tour-1236340861/", "summary": "Finneas and Lukas Graham have dropped out of their supporting slots for Ed Sheeran s tour after Macklemore s politically charged dismissal from the trek. On Tuesday (Sept. 15) shortly after Aaron Rowe became the first to voluntarily withdraw from the Loop Tour due to the controversy Finneas shared a succinct statement announcing his choice. Artists must not be silenced when they speak up for the oppressed, he wrote. I have decided to withdraw from my upcoming tour dates with Ed Sheeran. The Oscar and Grammy-winning artist added, I stand with Palestine and its people. Graham also wrote on Instagram, “I love Ed, and I’m grateful for everything we’ve shared. That hasn’t changed. But I can’t put these words out into the world and carry on with this tour as things stand. We’re withdrawing from the remaining dates.” Additionally, Beoga the band that has played a six-song mini set alongside Sheeran during the Loop Tour shows shared Tuesday that it has also chosen not to complete the trek, citing the silencing of Macklemore by zionist lobbies. We are a traditional Irish band who never saw ourselves playing in stadiums of that size and that opportunity is not lost on us, Beoga wrote, noting its decade-long friendship with Sheeran. To play in venues that silence anyone advocating for Free Palestine is simply not an option for us. Billboard has reached out to Sheeran s reps for comment. Graham has been a part of the Loop Tour s supporting lineup since August, while Finneas was scheduled to begin a stint of opening dates in October. Rowe, who had been opening Loop shows since February, announced earlier on Tuesday that he was dropping out of the tour: I cannot stand by and allow billionaires to use their position of power to silence the rightful voices of those who speak up against Israeli genocide and who highlight the savage murder of children. There are currently no openers remaining on Sheeran s tour. The controversy began in early September, when Macklemore called for a free Palestine on stage and performed his protest song Hind s Hall. Many calls for his removal soon followed, including from P!nk. The Israeli-American Council launched a petition demanding action. On Monday (Sept. 14), Messina Touring Group the Loop Tour s promoter in the U.S. announced that Macklemore had been removed from the bill. We have been notified by venues on the upcoming U.S. tour dates that they will not allow a concert to take place with Macklemore on the lineup,” the company s statem", "date_str": "2026-09-15T20:27:34+00:00", "hash": "7ce44d2ceffe5e45", "title_fa": "بعد از اینکه فینیاس و لوکاس گراهام به خاطر جنجال مکلمور «فلسطین آزاد» ترک کردند، اد شیران هیچ تور بازکنی باقی نگذاشته است.", "summary_fa": "فینیاس و لوکاس گراهام پس از اخراج مکلمور به اتهام سیاسی از تور اد شیران، از قسمت های حمایتی خود برای تور اد شیران کنار گذاشته شده اند. در روز سه‌شنبه (15 سپتامبر) اندکی پس از اینکه آرون رو اولین نفری شد که داوطلبانه از تور حلقه به دلیل جنجال خارج شد، فینیاس بیانیه‌ای مختصر را به اشتراک گذاشت که انتخاب خود را اعلام کرد. او نوشت که هنرمندان وقتی به نفع مظلوم صحبت می کنند نباید ساکت شوند. من تصمیم گرفته ام از تاریخ های تور آینده ام با اد شیران کنار بکشم. این هنرمند برنده جایزه اسکار و گرمی افزود، من در کنار فلسطین و مردم آن ایستاده ام. گراهام همچنین در اینستاگرام نوشت: \"من اد را دوست دارم و برای همه چیزهایی که به اشتراک گذاشتیم سپاسگزارم. این تغییری نکرده است. اما من نمی توانم این کلمات را در دنیا به زبان بیاورم و همانطور که اوضاع پیش می رود به این تور ادامه دهم. ما از تاریخ‌های باقی‌مانده کنار می‌رویم.» بعلاوه، گروه Beoga که در طول تور Loop Tour یک مجموعه مینی شش آهنگی را در کنار شیران نواخته است، روز سه شنبه به اشتراک گذاشت که همچنین تصمیم گرفته است که این سفر را کامل نکند، با استناد به خاموش کردن Macklemore توسط لابی های صهیونیستی. Beoga با اشاره به دوستی ده ساله خود با شیران نوشت: ما یک گروه موسیقی سنتی ایرلندی هستیم که هرگز خودمان را ندیدیم که در استادیوم هایی با آن بزرگی بازی کنیم و این فرصت از دست ما نمی رود. بازی در مکان هایی که هر کسی را که از فلسطین آزاد حمایت می کند ساکت می کند، گزینه ای برای ما نیست. بیلبورد برای اظهار نظر با نمایندگان شیران تماس گرفته است. گراهام از آگوست بخشی از گروه پشتیبانی Loop Tour بوده است، در حالی که فینیاس قرار"}, {"source": "Billboard", "title": "Bruce Springsteen Wins Appeal, Won’t Face Lawsuit Over Vintage Car on 2022 Album Cover", "link": "https://www.billboard.com/pro/bruce-springsteen-wins-appeal-lawsuit-vintage-car-album-art/", "summary": "Bruce Springsteen has defeated a second attempt at litigation over his use of a New Jersey man’s 1967 Pontiac GTO in the album art for his 2022 cover collection Only the Strong Survive. In a Tuesday (Sept. 15) ruling, obtained by Billboard , a New Jersey appeals court affirmed the earlier dismissal of a lawsuit brought against Springsteen by the family of deceased classic car collector Louis Billotti. The case had also targeted Sony Music, which owns Springsteen’s label Columbia Records, and his longtime manager Jon Landau . Related Bruce Springsteen’s Merch Partner Sues to Stop Tour Knockoffs in New Jersey Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction In 2021, Billotti was paid $1,200 for Springsteen to pose with his vintage GTO during two photoshoots at the singer’s New Jersey home. One of those photos became the album artwork for Only the Strong Survive , a collection of R B/soul covers that debuted at No. 8 on the Billboard 200 in 2022. Billotti died shortly before the LP’s release, and the man’s son alleged in a 2023 lawsuit that Springsteen had orally promised to pay his father additional money if the car photos ever ended up on an album cover. Springsteen denied making any such promise, and a trial court judge threw out the case last year due to insufficient evidence. Billotti’s estate appealed. The New Jersey Superior Court Appellate Division ruled Tuesday that this dismissal was the right call. The appeals panel said there isn’t a single witness or document to back up the younger Billotti’s description of a conversation relayed to him by his late father, a legal situation known as “double hearsay,” which must clear a high bar to be deemed admissible as evidence in court. To the contrary, multiple witnesses testified that Billotti never expected any extra money from Springsteen. One of his longtime friends, for example, wrote in a sworn affidavit that Billotti “was a simple guy and just really enjoyed the experience he had with Bruce Springsteen and was looking forward to seeing his car on his album cover.” The appeals court said such statements “cast considerable doubt upon the probative value of plaintiff s contentions.” “Given the circumstances and the paucity of plaintiff s evidence, the trial court had a sound basis to grant summary judgment,” wrote the appellate panel. “Whatever aspirations decedent may have had to be paid more money than the ", "date_str": "2026-09-15T20:22:41+00:00", "hash": "e06fe8c47ef77ee4", "title_fa": "بروس اسپرینگستین برنده درخواست تجدید نظر شد و در مورد خودروی قدیمی در جلد آلبوم 2022 با دعوی قضایی روبرو نخواهد شد", "summary_fa": "بروس اسپرینگستین دومین تلاش خود را برای دعوای حقوقی به دلیل استفاده از پونتیاک GTO مرد نیوجرسی در سال 1967 در هنر آلبوم برای مجموعه جلد سال 2022ش Only the Strong Survive شکست داد. در حکمی که روز سه شنبه (15 سپتامبر) توسط بیلبورد به دست آمد، دادگاه تجدیدنظر نیوجرسی رد شکایتی را که خانواده کلکسیونر فقید خودروهای کلاسیک، لوئیس بیلوتی، علیه اسپرینگستین مطرح کرده بود، تایید کرد. این پرونده همچنین سونی موزیک را که مالک لیبل اسپرینگستین Columbia Records است و مدیر قدیمی او Jon Landau را هدف قرار داده بود. شریک تجاری مرتبط بروس اسپرینگستین برای متوقف کردن تورهای بیلبورد در نیوجرسی برای افزودن آلبوم های رسانه های هوشمند به عنوان فرمت های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل توپاک شکور انجام می دهد در سال 2021، بیلوتی در حین عکسبرداری TO بهار 1200 دلار برای عکسبرداری خود با قیمت 1200 دلار دستمزد دریافت کرد. خانه این خواننده در نیوجرسی یکی از این عکس‌ها به اثر هنری آلبوم Only the Strong Survive تبدیل شد، مجموعه‌ای از کاورهای R B/soul که در سال 2022 در رتبه 8 بیلبورد 200 قرار گرفت. بیلوتی اندکی قبل از انتشار LP درگذشت و پسر مرد در سال 2023 ادعا کرد که اگر پدر اسپرینگستین به خاطر ماشینش پول بیشتری بپردازد یا قول داده بود که در دادگاه پول اضافی را پرداخت کند. جلد آلبوم اسپرینگستین هرگونه چنین قولی را رد کرد و یک قاضی دادگاه بدوی سال گذشته به دلیل شواهد ناکافی این پرونده را رد کرد. دارایی بیلوتی درخواست تجدیدنظر داد. بخش استیناف دادگاه عالی نیوجرسی روز سه شنبه حکم داد که این اخراج درخواست درستی بوده است. هیئت استیناف گفت که هیچ شاهد یا سندی وجود ندارد که توصیفات بیلوتی جوانتر را از مکالمه ای که پدر فقیدش به او منتقل کرده"}, {"source": "Billboard", "title": "‘Give Artists a Fairer Share’: Songwriter Urges SCOTUS to Let Landmark Copyright Ruling Stand", "link": "https://www.billboard.com/pro/songwriter-supreme-court-let-copyright-ruling-stand/", "summary": "The songwriter who won a landmark ruling on copyright termination is urging the U.S. Supreme Court to reject efforts by major music companies to overturn it, telling the justices there is no “emergency” and that publishers are “doing just fine.” The majors asked the high court this summer to tackle and reverse the first-ever ruling that came down in January, which said musicians can use termination to regain not just American songs but also overseas rights. They called the decision “profoundly wrong” and warned it will cause “chaos” for the music business. But in their first brief to the justices on Monday (Sept. 14), attorneys for Cyril Vetter, the songwriter who won that ruling, say the music firms are “breathlessly” painting doomsday scenarios that are unlikely to happen. “Petitioners try to depict this case as some sort of copyright emergency that cannot await further [litigation],” Vetter’s attorneys write in the brief, obtained and first reported by Billboard . “But publishers are doing just fine and will continue to thrive even if some of them have slightly less bargaining power with which to deprive authors of a fair return when their works become wildly successful.” The new brief — filed by Vetter’s longtime attorneys Tim Kappel and Loren Wells as well as veteran Supreme Court litigator Joshua Rosenkranz and his firm Orrick — argues that music companies are just afraid of actually competing over the real value of music. “Petitioners openly resist a rule that makes publishers negotiate on an open market to re-up deals,” Vetter’s attorneys write. “Publishers can afford to negotiate with more artists about whether to give artists a fairer share of the fruits of their artistic brilliance.” Attorneys for the music companies did not immediately return a request for comment on Tuesday (Sept. 15). Termination is a legal provision that gives creators a chance to recapture their rights decades after they sold them away. But it has only ever applied to U.S. copyrights and had no effect in foreign countries. Under that approach, publishers continue to control overseas rights even after termination, an arrangement that gives them perpetual revenue in a globalized streaming era, veto power over cross-border projects and key leverage in deal re-negotiations. In January, the ruling for Vetter overturned that longstanding approach. Siding with him in his quest to win back ownership of his 1963 rock classic “Double Shot (Of My Baby’s Love)” from a small publisher, ", "date_str": "2026-09-15T20:15:22+00:00", "hash": "eafc5fff23890257", "title_fa": "\"به هنرمندان سهم عادلانه‌تری بدهید\": ترانه‌سرا از SCOTUS می‌خواهد تا اجازه دهد تا قانون حق چاپ نقطه‌نظر باقی بماند", "summary_fa": "ترانه سرایی که برنده حکمی تاریخی در مورد فسخ حق چاپ شد، از دادگاه عالی ایالات متحده می خواهد تا تلاش های شرکت های موسیقی بزرگ برای لغو آن را رد کند و به قضات گفت که \"شرایط اضطراری\" وجود ندارد و ناشران \"به خوبی کار می کنند\". بزرگ‌ها از دادگاه عالی در تابستان امسال خواستند که اولین حکمی را که در ژانویه صادر شد، که می‌گفت موسیقی‌دانان می‌توانند از پایان کار برای بازپس‌گیری نه تنها آهنگ‌های آمریکایی، بلکه حقوق خارج از کشور نیز استفاده کنند، رسیدگی کند و لغو کند. آنها این تصمیم را \"عمقاً اشتباه\" خواندند و هشدار دادند که این تصمیم باعث \"آشوب\" برای تجارت موسیقی خواهد شد. اما وکلای سیریل وتر، ترانه سرایی که برنده آن حکم شد، در اولین گزارش خود به قضات در روز دوشنبه (14 سپتامبر)، می‌گویند که شرکت‌های موسیقی «بی‌نفس» سناریوهای روز قیامت را ترسیم می‌کنند که بعید است اتفاق بیفتد. وکلای وتر در این خلاصه می‌نویسند: «دادخواست‌کنندگان سعی می‌کنند این پرونده را به‌عنوان نوعی وضعیت اضطراری حق نسخه‌برداری به تصویر بکشند که نمی‌تواند منتظر [برنامه‌های قضایی] بیشتر باشد»، وکلای وتر در این خلاصه می‌نویسند که برای اولین بار توسط بیلبورد به دست آمده و گزارش شده است. اما ناشران به خوبی کار می کنند و حتی اگر برخی از آنها قدرت چانه زنی اندکی کمتری داشته باشند تا بتوانند نویسندگان را از بازگشت عادلانه در زمانی که آثارشان به شدت موفقیت آمیز می شود، محروم کنند، به پیشرفت خود ادامه خواهند داد. گزارش جدید - که توسط تیم کاپل و لورن ولز وکلای قدیمی وتر و همچنین جاشوا روزنکرانز وکیل کهنه کار دادگاه عالی و شرکت او اریک ارائه شده است - استدلال می کند که شرکت های موسیقی فقط از رقابت واقعی بر سر ارزش واقعی موسیقی می ترسند. وکلای وتر می نویسند: «دادخواهان آشکارا در برابر قاعده ای که"}, {"source": "Billboard", "title": "‘Dancing with the Stars’: Here’s Where to Watch Season 35 Live Online for Free", "link": "https://www.billboard.com/culture/product-recommendations/dancing-with-the-stars-season-35-2026-watch-live-onli . جلد EP را که شامل نقاشی های اصلی خالد الغرابلی است، در زیر ببینید."}, {"source": "Pitchfork", "title": "Watch Angine de Poitrine Shred Through a New Song on Fallon", "link": "https://pitchfork.com/story/angine-de-poitrine-new-song-fallon/", "summary": "The Canadian duo debuted “Zugzek” during their first U.S. TV appearance", "date_str": "2026-09-15T14:58:20+00:00", "hash": "ae2560d82bdd430a", "title_fa": "Angine de Poitrine Shred Through a New Song را در Fallon تماشا کنید", "summary_fa": "این دو نفر کانادایی اولین حضورشان در تلویزیون «Zugzek» را در ایالات متحده انجام دادند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان. (عاشقان واقعی می دانند که برای اولین بار بعداً با جولز هالند در ژوئن به صفحه نمایش کوچک زیبایی بخشیدند.) ریاضی پانکرهای کانادایی این مناسبت را با آهنگ کاملاً جدید \"Zugzegk\" جشن گرفتند. اگرچه فالون برای تلفظ این عنوان مشکل داشت، نوازنده گیتاریست خن و درامر Klek هیچ مشکلی برای ریپ کردن آهنگ پنج دقیقه ای نداشتند. عملکرد آنها را در زیر مشاهده کنید. آنژین دو پویترین، یک ارکستر مانترا-راک دادا فیثاغورثی-کوبیست که خودش را توصیف می‌کند، آخرین آلبوم خود، جلد. دوم، در ماه آوریل. آنها همچنین در تابستان امسال جشنواره جاز نیوپورت را اجرا کردند و اخیراً یک دو شب دوشبه را به Le Poisson Rouge نیویورک آوردند. در مورد آنژین دو پویترین جلد. دوم در بهترین موسیقی 2026 تاکنون."}, {"source": "Pitchfork", "title": "Bob Dylan Somehow Finds 371 Unreleased Songs for Another Rolling Thunder Box Set", "link": "https://pitchfork.com/story/bob-dylan-somehow-finds-371-unreleased-songs-for-another-rolling-thunder-box-set/", "summary": "The 39-disc Rolling Thunder Revue: The 1976 Live Recordings documents the fabled tour’s second leg", "date_str": "2026-09-15T14:09:08+00:00", "hash": "e884c92ae1392cf5", "title_fa": "باب دیلن به نحوی 371 آهنگ منتشر نشده را برای مجموعه دیگری از Rolling Thunder Box پیدا کرد", "summary_fa": "39 دیسک Rolling Thunder Revue: The Live Recordings مرحله دوم تور افسانه ای را مستند می کند Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان ماتریالیست ها، شاد باشید: 39 دیسک دیگر از ضبط های زنده باب دیلن در راه است. Rolling Thunder Revue: The 1976 Live Recordings یکی دیگر از مجموعه‌های آرشیوی از تور داستانی و معروف دیلن در سالن‌های کوچک است که مهمانانی از جمله Joan Baez، Joni Mitchell، Willie Nelson و Allen Ginsberg در آن حضور دارند. این مجموعه، در 6 نوامبر، با مرحله دوم تور، که در بهار 1976 برگزار شد، مبارزه می کند. ران 1975 در سال 2019 با فیلم مستند Rolling Thunder ساخته مارتین اسکورسیزی با جعبه ست برخورد کرد. کنسرت مرحله دوم در 16 می در فورت ورث در همان روز به صورت مستقل 3xLP منتشر خواهد شد. به «رفتن، رفتن، رفت» از آن نمایش زیر گوش دهید. هر نمایش حرفه ای ضبط شده از مرحله دوم - که تقریباً همه آنها هستند - در مجموعه جدید گنجانده شده است. گروه‌های دیلن برای نمایش شامل راب استونر، اسکارلت ریورا، هاوی وایت، گیتاریست اسپایدرز از مریخ، میک رونسون، و تی بون برنت بودند. ما معمولاً فهرست آهنگ‌های این جور چیزها را تایپ می‌کنیم اما [اشاره‌ها در عنوان]. آن را در وب سایت Dylan پیدا کنید. برنت، شاید کمی بیش از حد، در یک بیانیه مطبوعاتی می‌گوید: «The Rolling Thunder Revue اولین تور ملی پانک راک بود. دری را باز کرد که به انفجار خشمگین موسیقی جدید منتهی شد - کلش، الویس کاستلو، رامونز، سکس پیستولز، و غیره. دیلن دوباره این کار را کرده بود. او در عبور از درهایی که هیچ کس حتی آنها را نمی بیند خوب است، درهایی که دیگران فکر می کنند دیوار هستند.\""}, {"source": "Rolling Stone", "title": "Trump Is Reportedly Sending Israel $2.8 Billion in Bombs. You’re Paying for Them", "link": "https://www.rollingstone.com/politics/politics-news/trump-supply-bombs-israel-1235627183/", "summary": "It’s described as a sale, but the U.S. is giving Israel taxpayer money to buy over 40,000 bombs, The Washington Post reports", "date_str": "2026-09-15T20:47:33+00:00", "hash": "3fccbabc0f5683d5", "title_fa": "ترامپ در حال ارسال 2.8 میلیارد دلار بمب به اسرائیل است. شما برای آنها هزینه می کنید", "summary_fa": "واشنگتن پست گزارش می دهد که این یک فروش توصیف شده است، اما ایالات متحده به مالیات دهندگان اسرائیل پول م eaving Tour: Venue, Promoter Made ‘Final’ Decisions", "link": "https://www.rollingstone.com/music/music-news/ed-sheeran-macklemore-tour-statement-1235626937/", "summary": "“I have spent this week trying to build bridges, to find a solution, and, unfortunately, was unable to do so,” singer says", "date_str": "2026-09-15T16:57:04+00:00", "hash": "a9bfdf61beef026b", "title_fa": "اد شیران سکوت را در ترک تور مکلمور می شکند: محل برگزاری، پروموتور تصمیمات «نهایی» را گرفت", "summary_fa": "خواننده می‌گوید: «این هفته را صرف ساختن پل‌ها، یافتن راه‌حل کرده‌ام و متأسفانه نتوانستم این کار را انجام دهم.» در یک بیانیه جدید طولانی که در اینستاگرام منتشر شد، اد شیران گفت که تصمیم برای کنار گذاشتن مک‌کلمور از تور او نبود، بلکه تصمیم پروموتور گروه تور مسینا، همراه با فشار مکان‌ها بود. این خواننده و ترانه سرا گفت که پس از شنیدن اینکه برخی از سالن‌ها نمی‌خواهند مکلمور پس از مخالفت با نظرات فلسطین آزاد در استادیوم MetLife اجرا کند، با مالکان از جمله مالک استادیوم ژیلت، رابرت کرافت، صحبت کرد. با این حال، تلاش های او برای تغییر نظر آنها ناموفق بود. شیرن گفت هدفش این بود که به مککلمور، مانند هر هنرمندی که افتتاحیه می‌دهد، بستری بدهد تا هرچه می‌خواهد بگوید. شیران نوشت، مککلمور سال گذشته درخواست کرد که به تور من بپیوندد و من موافقت کردم، زیرا به او به عنوان یک هنرمند احترام می گذارم. مانند تمام اقدامات حمایتی من، موافقم که آنها یک لیست انتخابی خود را پخش کنند. شیران نوشت که مذاکرات او با صاحبان سالن در نهایت بی نتیجه بود و او تلاش کرد تا دیگران را درگیر کند اما ناموفق بود. شیران نوشت، من همچنین درگیر گفتگوهای مستقیم با مروجین و فعالان دو طرف بودم تا بتوانم راه حلی متقابل برای همه پیدا کنم، اما تصمیم محل برگزاری و مروج نهایی بود. شیران درباره تصمیم خود مبنی بر اینکه با تصمیم آنها پیش برود و بقیه تور را به خطر نیندازد، توضیح داد: هرگز طرفدارانی را که برنامه ریزی کرده بودند ناامید نخواهم کرد، و همچنین گروه تور و سایر بازیگران و نوازندگانی که برای کار و زندگی به من متکی هستند را رها نمی کنم. نمایندگان مکلمور، مروج گروه تورینگ مسینا، و رابرت کرافت بلافاصله به درخواست های رولینگ استون برای اظهار نظر پاسخ ندادند."}, {"source": "Rolling Stone", "title": "Wednesday Celebrate ‘Bleeds’ Anniversary With Deluxe Edition, Delightful New Demo", "link": "https://www.rollingstone.com/music/music-news/wednesday-bleeds-deluxe-demos-1235626834/", "summary": "North Carolina indie rockers introduced “June 2 (Early Version)” into their set-list rotation this year", "date_str": "2026-09-15T16:36:02+00:00", "hash": "33d7ef51c5377f72", "title_fa": "چهارشنبه سالگرد «Bleeds» را با نسخه Deluxe، نسخه نمایشی جدید دلپذیر جشن بگیرید", "summary_fa": "راک‌های مستقل کارولینای شمالی امسال «2 ژوئن (نسخه اولیه)» را در فهرست ست‌های خود معرفی کردند. برای جشن گرفتن سالگرد، گروه کارولینای شمالی یک نسخه لوکس از LP را در روز جمعه، 18 سپتامبر منتشر خواهد کرد. Bleeds Deluxe دارای 20 آهنگ دارای چندین ریمیکس (از جمله Avey Tare از Animal Collective در Carolina Murder Suicide) و دمو است. آنها پیش نمایش این مجموعه را با 2 ژوئن (نسخه اولیه) که توسط کنت بلوم (با نام مستعار Kenny Beats) تهیه شده بود، مشاهده کردند که در زیر می توانید آن را مشاهده کنید. چهارشنبه در اوایل سال جاری شروع به گنجاندن 2 ژوئن در چرخش لیست خود کرد. آنها در این ماه و تا پاییز به تور خود ادامه خواهند داد و از تایلر چیلدرز و مانکن پوسی در تاریخ های مختلف حمایت خواهند کرد. آنها همچنین چندین جشنواره برای اوایل سال 2027 رزرو کرده‌اند. داستان‌های پرطرفدار «با غزه، نمی‌توانستم صحبت کنم»: خانم. ریچل در مورد جنجال، شهرت و آینده مکلمور از تور اد شیران پس از بیانیه‌های «فلسطین آزاد» کنار رفت آهنگ های Bleeds برای Rolling Stone. او به ما گفت که من همیشه مثل یک حالت نوشتن مداوم هستم. هر وقت حتی کوچکترین احساسی بهم دست داد می نویسم. هر وقت از چیزی که تجربه می‌کنم، به یاد می‌آورم، تماشا می‌کنم یا می‌خوانم، الهام می‌گیرم، مانند میلیون‌ها چیز مختلف است، بنابراین هرگز متوقف نمی‌شوم. لیست آهنگ دلوکس Bleeds 1. Reality TV Argument Bleeds 2. Townies 3. Wound Up Here (By Holdin On) 4. Elderberry Wine 5. Phish Pepsi 6. Candy Breath 7. The Way Love Goes 8. Pick Up That Knife 9. Wasp 10.2 Bitterolaryde II 13. Reality TV Argument Bleeds (ریمیکس اندی لوبز) 14. The ان یک مکانیسم اجرایی ثانویه مشروط به محدودیت های خاصی توصیف می کند که برای وزارت دادگستری و کمیسیون تجارت فدرال اعمال نمی شود. به گفته وزارت دادگستری، کنگره اجرای مکمل ضد انحصار را توسط دولت فدرال و احزاب خصوصی ارائه کرد، اما روشن کرد که این یک سیستم برابر نیست. در سراسر این دعوای قضایی، پارامونت بر ضررهای سنگین مرتبط با توقف ادغام توسط دادگاه تاکید کرده است و به فرصت های از دست رفته برای افزایش سرمایه گذاری در تولید و افزایش هزینه های تامین مالی اشاره کرده است."}, {"source": "Hollywood Reporter", "title": "Kennedy Center’s Abrupt Plan to Shut Down May Spark Further Legal Battles", "link": "https://www.hollywoodreporter.com/news/politics-news/kennedy-center-shut-down-1236702546/", "summary": "A federal judge had issued an injunction earlier in the day blocking the board from adding Trump’s name to the Kennedy Center.", "date_str": "2026-09-15T20:28:41+00:00", "hash": "ba902b9f0f58e0cc", "title_fa": "طرح ناگهانی مرکز کندی برای تعطیلی ممکن است جرقه نبردهای حقوقی بیشتری را برانگیزد", "summary_fa": "یک قاضی فدرال اوایل روز با صدور حکمی از اضافه کردن نام ترامپ به مرکز کندی توسط هیئت مدیره جلوگیری کرده بود. متن لوگو، نماینده جویس بیتی، یکی از اعضای هیئت مدیره مرکز کندی که از رئیس جمهور ترامپ به دلیل برنامه هایش برای این موسسه هنری شکایت کرد، تصمیم به تعطیلی این مرکز را محکوم کرد. بر اساس گزارش رسانه ها و پستی از ترامپ که به گفته آنها اجازه می دهد مرکز کندی را بازسازی کند، روز سه شنبه، هیئت مدیره به تعطیلی فوری مرکز کندی رای داد. این رای گیری پس از آن صورت گرفت که یک قاضی فدرال در اوایل روز دستوری صادر کرد و هیئت مدیره را از اضافه کردن نام ترامپ به مرکز کندی منع کرد. هیئت مدیره اوایل سال جاری نام او را اضافه کرده بود، اما بیتی شکایت کرده بود و به دنبال حکم دادگاه برای توقف تعطیلی مرکز و تغییر نام آن بود. او روز سه‌شنبه بیانیه‌ای صادر کرد و پیشنهاد کرد که موضوع بسته شدن را به دادگاه خواهد برد. برای سال‌ها، مرکز کندی برنامه‌ریزی کرده است که بازسازی‌های مرحله‌ای را انجام دهد که در آن ما هم بازسازی می‌کنیم و هم برخی از اجراها را حفظ می‌کنیم. مراکز بزرگ هنرهای نمایشی در کشور به ای هالیوود یان شریگر عمومی می‌شود: هیچ چیز خسته‌کننده‌تر از اتاقی پر از افراد ثروتمند نیست که سفر کنند چگونه در طول هفته جشنواره ونیز را درست انجام دهیم. آخرین فیلم با نام «دعوت غیرمنتظره»، آوانتیکا را در دبلیو تورنتو به نمایش می‌گذارد، زیرا او از روال معمول هتل خود برای بله گفتن به مهمانی شام در ملک اجتناب می‌کند. شبی پر از عیاشی رخ می دهد و او را تشویق می کند تا مسافران را به خوبی طی کنند و کمتر سفر کنند."}, {"source": "Hollywood Reporter", "title": "‘Evil Genius’ Review: A Hilarious Patricia Arquette and David Harbour Make for a Bonkers Bonnie and Clyde in Courteney Cox’s Twisted True-Crime Yarn", "link": "https://www.hollywoodreporter.com/movies/movie-reviews/evil-genius-review-patricia-arquette-david-harbour-1236700717/", "summary": "The comic dramatization of 2003's notorious \"Pizza Bomber\" incident takes its cue from the Netflix series 'Evil Genius: The True Story of America's Most Diabolical Bank Heist.\"", "date_str": "2026-09-15T20:14:18+00:00", "hash": "a8deba918f6fb599", "title_fa": "نقد و بررسی «نابغه شیطانی»: پاتریشیا آرکت و دیوید هاربر خنده‌دار برای یک بانی و کلاید در فیلم جنایات واقعی کورتنی کاکس ساخته می‌شوند.", "summary_fa": "دراماتیزاسیون کمیک حادثه بدنام «بمب‌بگذار پیتزا» در سال 2003 از سریال نتفلیکس «نابغه شیطانی: داستان واقعی شیطانی‌ترین سرقت بانک آمریکا» گرفته شده است.» تعداد کمی از داستان‌های جنایی واقعی وجود دارند که ارزش ثبت شدن در «تو نمی‌توانی این شات را بالا ببرند» را داشته باشند، که در مورد «پیتزا»، داستانی کاملاً بی‌نظیر از سال 2003 وجود دارد. ساکنان پنسیلوانیا با استخدام یک راننده پیتزا به عنوان یک گروگان که در حالی که یک بمب یقه جعلی به گردنش قفل شده بود، در پنجره باجه ها حاضر شد، برای سرقت از یک بانک توطئه کردند. اینکه بگوییم دزدی طبق برنامه پیش نرفت، اندکی پس از دستگیری دزد احتمالی توسط پلیس، کم‌کم است، اما بمب منفجر شد و بلافاصله او را کشت. زنجیره‌ی پیچیده و درهم‌پیچ از رویدادهایی که قبل و بعد از این حادثه رخ داد، در مجموعه چهار قسمتی نتفلیکس ۲۰۱۸، نابغه شیطانی: شیطان واقعی‌ترین دزدی بانک آمریکا، مستند شد. اکنون، به لطف یک چرخش
