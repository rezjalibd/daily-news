 آنها را قادر می سازد تا در سه روز کاری را انجام دهند که قبلاً پنج روز بود. بنیانگذار و رئیس آمازون گفت: «برخی افراد تصمیم خواهند گرفت: «من می‌توانم خانواده‌ام را سه روز در هفته کار کنم» و افزود که خانواده‌های دودرآمد ممکن است به جای یک ضرورت تبدیل به یک انتخاب شوند. به همین ترتیب، جیمی دیمون در سال های اخیر بارها پیش بینی کرده است که نسل بعدی تنها سه روز و نیم در هفته کار خواهد کرد. مدیر عامل جی پی مورگان در بهار امسال گفت که آن کارگران آینده می توانند «بیشتر پیاده روی کنند» و «همه کارهایی را انجام دهند» که پیشینیانشان وقت انجام آن را نداشتند. اریک یوان در پاییز گذشته همین مورد را با نیویورک تایمز مطرح کرد، زمانی که گفت هوش مصنوعی حجم کار بیشتری را در آینده به دوش خواهد کشید. مدیرعامل زوم گفت: «هر شرکتی سه روز و چهار روز در هفته پشتیبانی خواهد کرد. \"من"}, {"source": "Business Insider", "title": "Law firms are building AI around their most valuable asset: experience", "link": "https://www.businessinsider.com/law-firms-building-ai-based-on-their-own-data-expertise-2026-10", "summary": "Tyler Le/BI For generations, a law firm's most valuable asset walked out the door every night. It was the attorney who remembered the clause that saved a deal years ago. The trial lawyer who knew which arguments worked on a judge and which ones didn't. The partner who told an associate, \"We've seen this before.\" Now law firms are racing to turn that expertise into software. After spending the past two years adopting tools from OpenAI , Harvey, Microsoft, Legora, and others , large law firms are building systems around something more valuable: what only they know. The bet is that artificial intelligence steeped in their deal histories, trial strategies, and client preferences will be more useful than whatever the firm across the street can buy. Law firms are spending big to bottle their secret sauce. Earlier this year, Kirkland Ellis agreed to pay Palantir $500 million to build technology for one of the firm's core businesses: advising private equity clients on raising money. Latham Watkins bought its own Nvidia servers to start customizing large language models. Law firms like Kirkland Ellis are investing heavily to customize their technology. Bloomberg/Getty Images At Morgan Morgan , America's largest personal injury law firm, lawyers have begun using an in-house artificial intelligence model trained to recognize patterns in their cases. A younger lawyer might miss that a patient showing signs of a pinched nerve near the spine could later require surgery. The firm says its software can flag that possibility. \"Our best and experienced people will spot it almost immediately,\" said Yath Ithayakumar, Morgan Morgan's chief transformation officer. \"But if you're a first-year attorney, this is your first job, maybe that's not as obvious to you. Technology makes a huge difference.\" This story is part of a series called The AI Data Grab , an inside look at how tech giants are increasingly turning to workers, users, and the physical world to get data to train AI. Read more stories in this series here . That is the promise behind Morgan Morgan's push to build its own technology. The firm, which has said it will spend $1 billion on the effort over the next decade, isn't trying to compete with OpenAI . It wants to capture what its best lawyers already know. Law firms 'have more data than anybody else' Many law firms already use the same high-tech tools. Harvey says it has users at 80% of the country's 100 largest law firms by revenue. Legora says it covers a majority ", "date_str": "2026-10-14T09:30:01+00:00", "hash": "5a95378392a5fd02", "title_fa": "شرکت‌های حقوقی در حال ساخت هوش مصنوعی با ارزش‌ترین دارایی خود یعنی تجربه هستند", "summary_fa": "Tyler Le/BI برای نسل‌ها، ارزشمندترین دارایی یک شرکت حقوقی هر شب از خانه بیرون می‌رفت. این وکیل بود که بند یک معامله را سالها پیش به یاد آورد. وکیلی که می‌دانست کدام استدلال برای یک قاضی کارساز است و کدام نه. شریکی که به یکی از همکارانش گفت: \"ما قبلاً این را دیده ایم.\" اکنون شرکت های حقوقی در حال رقابت برای تبدیل این تخصص به نرم افزار هستند. پس از گذراندن دو سال گذشته با استفاده از ابزارهای OpenAI، Harvey، Microsoft، Legora، و دیگران، شرکت‌های حقوقی بزرگ در حال ساختن سیستم‌هایی پیرامون چیزی ارزشمندتر هستند: چیزی که فقط آنها می‌دانند. شرط این است که هوش مصنوعی غرق در تاریخچه معاملات، استراتژی‌های آزمایشی و ترجیحات مشتری، مفیدتر از هر چیزی باشد که شرکت آن طرف خیابان می‌تواند بخرد. شرکت های حقوقی برای بطری سس مخفی خود هزینه های زیادی می کنند. در اوایل سال جاری، کرکلند الیس موافقت کرد که 500 میلیون دلار به Palantir بپردازد تا فناوری یکی از مشاغل اصلی این شرکت را بسازد: مشاوره به مشتریان سهام خصوصی برای جمع آوری پول. Latham Watkins سرورهای Nvidia خود را خرید تا شروع به سفارشی سازی مدل های زبان بزرگ کند. شرکت های حقوقی مانند Kirkland Ellis سرمایه گذاری زیادی برای سفارشی کردن فناوری خود انجام می دهند. بلومبرگ/گتی ایماژ در مورگان مورگان، بزرگترین شرکت حقوقی آسیب های شخصی در آمریکا، وکلا شروع به استفاده از یک مدل هوش مصنوعی داخلی کرده اند که برای تشخیص الگوها در پرونده های آنها آموزش دیده است. یک وکیل جوانتر ممکن است از این موضوع غافل شود که بیماری که علائمی از انقباض عصب در نزدیکی ستون فقرات را نشان می دهد ممکن است بعداً به جراحی نیاز داشته باشد. این شرکت می‌گوید نرم‌افزارش می‌تواند این امکان را علامت‌گذاری کند. یاث ایتایاکومار، مدیر ارشد تحول مورگان مورگان، گفت: «بهترین و با تجربه"}, {"source": "Business Insider", "title": "A 23-year-old made his first $3 selling sweatshirts on TikTok. 2 years later, he's earning 6 figures as an affiliate.", "link": "https://www.businessinsider.com/how-tiktok-shop-affiliate-earns-money-from-videos-social-media-2026-10", "summary": "Talon Krebs began earning money through TikTok Shop while he was a student at the University of Nebraska. Talon Krebs Talon Krebs discovered TikTok Shop's affiliate program as a college student. He started making videos with a couple hundred dollars and earned commissions on tagged products. Today, he earns six figures as a TikTok Shop affiliate and is developing his own brand. Talon Krebs was sitting in an 8 a.m. college class when he realized one of his TikTok videos was taking off. A few weeks earlier, he'd posted a video about a digital business card available through TikTok Shop. When he glanced at his phone during class that February morning, he saw he had already earned $100 in commissions that day alone. \"I was blown away,\" the 23-year-old told Business Insider. \"That was my biggest day already.\" The video kept gaining traction. By the end of February, he'd earned more than $10,000 in commissions from the product. Krebs, a University of Nebraska alum who graduated in May 2026, now works full time as a TikTok Shop affiliate. He promotes products in short-form videos and earns a commission when someone buys through his shopping link. The gig earned him six figures last year, according to a 1099 form reviewed by Business Insider. Starting with a few hundred dollars and a personal TikTok account TikTok offers affiliates more than one path into its shopping program. Krebs said its pilot program requires 1,000 followers but limits participants to a handful of posts each week. The main program offers more flexibility, he said, but requires at least 5,000 followers. Krebs already had about 24,000 followers on a personal account he started in high school, a following he had built by posting about sports and other interests. His startup costs were minimal: about $100 to $200 for products to promote, including a three-pack of sweatshirts he bought because he needed hoodies anyway. Krebs graduated from the University of Nebraska in 2026. Courtesy of Talon Krebs Filming his first few videos felt \"uncomfortable,\" he said. He kept the hoodie video simple, dropping the still-packaged sweatshirts onto a table and talking about them on camera. It led to a sale — and about $3 in commission. \"When I saw that, I was blown away,\" he said. \"I was like, 'Wow, I just made money from my phone.'\" The barrier to entry can be low: New affiliates can film on a smartphone, use TikTok's built-in editing tools, and even make videos about eligible products they already own. Krebs a", "date_str": "2026-10-14T09:30:01+00:00", "hash": "446d1dd5824d03e0", "title_fa": "یک جوان ۲۳ ساله اولین سویشرت ۳ دلاری خود را در TikTok ساخت. 2 سال بعد، او 6 رقم به عنوان یک شرکت وابسته به دست می آورد.", "summary_fa": "تالون کربس زمانی که در دانشگاه نبراسکا دانشجو بود شروع به کسب درآمد از طریق فروشگاه TikTok کرد. Talon Krebs Talon Krebs برنامه وابسته فروشگاه TikTok را به عنوان یک دانشجوی کالج کشف کرد. او با چند صد دلار شروع به ساختن ویدیو کرد و برای محصولات برچسب گذاری شده کمیسیون دریافت کرد. امروز، او به عنوان یکی از شعبه های فروشگاه TikTok شش رقم کسب می کند و در حال توسعه برند خود است. تالون کربس ساعت 8 صبح در کلاس کالج نشسته بود که متوجه شد یکی از ویدیوهای TikTok او در حال پخش شدن است. چند هفته قبل، او ویدیویی درباره یک کارت ویزیت دیجیتالی که از طریق فروشگاه TikTok در دسترس است، منتشر کرده بود. وقتی صبح همان روز فوریه در سر کلاس به تلفن خود نگاه کرد، دید که تنها در آن روز 100 دلار کمیسیون درآمد داشته است. این جوان 23 ساله به بیزینس اینسایدر گفت: «من غرق شدم. \"آن روز بزرگترین روز من بود.\" ویدیو مدام مورد توجه قرار می گرفت. تا پایان فوریه، او بیش از 10000 دلار کمیسیون از این محصول به دست آورده بود. کربس، دانش آموخته دانشگاه نبراسکا که در ماه مه 2026 فارغ التحصیل شد، اکنون به عنوان یک شعبه فروشگاه TikTok به صورت تمام وقت کار می کند. او محصولات را در ویدیوهای کوتاه تبلیغ می کند و وقتی کسی از طریق لینک خرید او خرید می کند، کمیسیون دریافت می کند. بر اساس فرم 1099 بررسی شده توسط Business Insider، این کنسرت سال گذشته شش رقم برای او به ارمغان آورد. شروع با چند صد دلار و یک حساب شخصی TikTok، TikTok بیش از یک مسیر را برای برنامه خرید خود به شرکت های وابسته ارائه می دهد. کربس گفت که برنامه آزمایشی آن به 1000 دنبال کننده نیاز دارد اما شرکت کنندگان را به تعداد"}, {"source": "Business Insider", "title": "My 3 kids went to school in France and the US. The French school system isn't perfect, but I'd choose it again.", "link": "https://www.businessinsider.com/american-with-kids-in-school-france-neither-system-perfect-2026-10", "summary": "American Sarah Lucas educated her three children in France. Courtesy of Sarah Lucas American Sarah Lucas is raising her three children in France, where she moved 25 years ago. She navigated the French school system, which she said is very different from the US. The mom said education in both countries has its pros and cons. This story is based on an interview with Sarah Lucus, 52, of the Chamonix valley , France, who works in international education. It has been edited for length and clarity. I moved to France in 2001 for personal and professional reasons after meeting a man from there in the US. At the time, I was looking to work with the United Nations organizations and international NGOs. We settled in the Chamonix Valley, about an hour from Geneva , because it was a very convenient place to live. Have you got a story about raising children abroad? Please email Jane Ridley at jridley@businessinsider.com if you'd like to be interviewed by Business Insider. My three kids — Charlie, 15, Elizabeth, 20, and Jeanne, 22 — were all born in France. Charlie is in the equivalent of 10th grade, Elizabeth is in art school in Paris, and Jeanne recently finished a bachelor's degree at McGill University in Montreal. They've spent most of their education in France, apart from three years between 2014 and 2017 when we moved to Seattle. There are many differences between the two school systems, neither of which is perfect. However, overall, I'd defend the French one as better. Kids can enroll in no-cost preschool as young as 2.5 The preschool education in France is wonderful. The children learn lots of pre-writing and accounting skills, but it's very play-based, warm, and welcoming. It's free, which eases the burden considerably. Charlie went to preschool in Seattle , and it cost $900 a month. It was a private Montessori, but there weren't really any other options. Lucas outside a French elementary school. Courtesy of Sarah Lucas Looking back, it was crazy that we spent the equivalent of our monthly rent on it. Food is excellent Most French schools allow at least an hour and a half for lunch, so the meal is nowhere near as rushed as in the US, where crowded cafeterias are the norm. Even in preschool, they sit down at the table and get served with plates, knives, and forks. It's often four courses — something like a small salad, chicken and rice for the main, and cheese, followed by dessert . It usually costs around 5 euros per day, roughly $5.50. Younger kids are not allo", "date_str": "2026-10-14T09:27:01+00:00", "hash": "f09926046c3e7cdb", "title_fa": "3 بچه من در فرانسه و ایالات متحده به مدرسه رفتند. سیستم مدارس فرانسه کامل نیست، اما من دوباره آن را انتخاب می کنم.", "summary_fa": "سارا لوکاس آمریکایی سه فرزند خود را در فرانسه آموزش داد. با حسن نیت سارا لوکاس سارا لوکاس آمریکایی سه فرزند خود را در فرانسه بزرگ می کند، جایی که 25 سال پیش به آنجا نقل مکان کرد. او سیستم مدرسه فرانسه را هدایت کرد، که به گفته او بسیار متفاوت از ایالات متحده است. مادر گفت آموزش در هر دو کشور مزایا و معایب خود را دارد. این داستان بر اساس مصاحبه ای با سارا لوکوس، 52 ساله، از دره شامونی، فرانسه، که در آموزش بین المللی کار می کند، ساخته شده است. برای طول و وضوح ویرایش شده است. من در سال 2001 به دلایل شخصی و حرفه ای پس از ملاقات با مردی از آنجا در ایالات متحده به فرانسه نقل مکان کردم. در آن زمان به دنبال همکاری با سازمان های ملل متحد و سازمان های غیردولتی بین المللی بودم. ما در دره Chamonix، حدود یک ساعت از ژنو، مستقر شدیم، زیرا مکان بسیار مناسبی برای زندگی بود. آیا داستانی در مورد تربیت فرزندان در خارج از کشور دارید؟ اگر می خواهید با Business Insider مصاحبه کنید، لطفاً به جین ریدلی به آدرس jridley@businessinsider.com ایمیل بزنید. سه فرزند من - چارلی 15 ساله، الیزابت 20 ساله و ژان 22 ساله - همگی در فرانسه به دنیا آمدند. چارلی معادل کلاس دهم است، الیزابت در مدرسه هنر در پاریس است و ژان اخیراً مدرک لیسانس خود را در دانشگاه مک گیل در مونترال به پایان رسانده است. آنها بیشتر دوران تحصیل خود را در فرانسه گذرانده اند، به غیر از سه سال بین سال های 2014 و 2017 که ما به سیاتل نقل مکان کردیم. تفاوت های زیادی بین این دو سیستم مدرسه وجود دارد که هیچ کدام کامل نیستند. با این حال، به طور کلی، من از فرانسه بهتر دفاع می کنم. کودکان از سن 2.5"}, {"source": "Business Insider", "title": "The winners and losers of the new H-1B era", "link": "https://www.businessinsider.com/h-1b-winners-losers-companies-industries-applicants-policies-2026-10", "summary": "Rob Dobi for BI The new H-1B reality is beginning to produce clear winners and losers. The Trump administration has introduced proposals that target various legal immigration pathways, from the H-1B visa for highly skilled foreign workers to the OPT student work authorization for foreign students who have graduated from a US university. On Thursday, Vice President JD Vance announced a crackdown on the pathway to green cards for workers at some tech firms, including Microsoft and Adobe. Business Insider has been covering how skilled foreign workers navigate the changing immigration policies through our ongoing H-1B fallout series, launched one year after Trump first introduced the $100,000 fee on some H-1B applicants. We have examined where foreign talent is heading and the hidden sacrifices of those who opt into the H-1B system. We've also spotlighted stories from individuals at different stages of the visa pipeline . To understand who is better and worse off in the new H-1B system, Business Insider spoke to immigration lawyers and academics and analyzed H-1B application data from the first three quarters of the last three fiscal years. Ted Chiappari, head of immigration law at law firm Duane Morris, told Business Insider there is nothing in any of the changes in H-1B rules or policies that \"would favor one company over another.\" Instead, what's emerging is that employers with cash and employees with in-demand skills are seeing a relative advantage from the increasingly uncertain H-1B regime. The US issues 85,000 H-1B visas a year. Demand still outweighs supply, even as applications in the March 2026 H-1B lottery dropped more than 38% from the year before, the United States Citizenship and Immigration Services said. Trump's proposed $100,000 H-1B fee for new applicants is held up in the courts. It is \"probably the main reason\" those applications fell, Chiappari said. The administration has previously said its changes are intended to curb misuse of the H-1B program and protect American workers, a sentiment echoed by USCIS. Spokesperson Zach Kahler said the goal is to have employment-based visas \"supplement, not supplant American workers.\" The White House and the Department of Labor did not respond to requests for comment. Winner: High salary, high specialization workers A regulatory change that favors one group of workers over another is the wage-weighted H-1B cap selection. It replaced the randomized lottery earlier this year and gives applicants in higher", "date_str": "2026-10-14T09:18:55+00:00", "hash": "2e8eeff437f9863f", "title_fa": "برندگان و بازندگان دوره جدید H-1B", "summary_fa": "راب دوبی برای BI واقعیت جدید H-1B شروع به تولید برندگان و بازندگان آشکار می کند. دولت ترامپ پیشنهادهایی را ارائه کرده است که مسیرهای مهاجرت قانونی مختلف را هدف قرار می دهد، از ویزای H-1B برای کارگران خارجی بسیار ماهر گرفته تا مجوز کار دانشجویی OPT برای دانشجویان خارجی که از دانشگاه های ایالات متحده فارغ التحصیل شده اند. روز پنجشنبه، معاون رئیس جمهور JD Vance از سرکوب مسیر کارت سبز برای کارگران برخی از شرکت های فناوری از جمله مایکروسافت و ادوبی خبر داد. Business Insider چگونگی هدایت کارگران خارجی ماهر در سیاست‌های مهاجرتی در حال تغییر را از طریق مجموعه‌های در حال اجرا H-1B پوشش می‌دهد که یک سال پس از اینکه ترامپ برای اولین بار هزینه 100000 دلاری را برای برخی از متقاضیان H-1B معرفی کرد، راه‌اندازی شد. ما بررسی کرده ایم که استعدادهای خارجی به کجا می روند و فداکاری های پنهان کسانی که سیستم H-1B را انتخاب می کنند. ما همچنین به داستان هایی از افراد در مراحل مختلف خط لوله ویزا توجه کرده ایم. برای درک اینکه چه کسی در سیستم جدید H-1B وضعیت بهتر و بدتری دارد، Business Insider با وکلای مهاجرت و دانشگاهیان صحبت کرد و داده های برنامه H-1B را از سه فصل اول سه سال مالی گذشته تجزیه و تحلیل کرد. تد چیاپاری، رئیس قانون مهاجرت در شرکت حقوقی Duane Morris، به Business Insider گفت که هیچ یک از تغییرات در قوانین یا سیاست های H-1B وجود ندارد که \"یک شرکت را بر دیگری ترجیح دهد.\" در عوض، آنچه در حال ظهور است این است که کارفرمایان با پول نقد و کارمندان با مهارت های مورد تقاضا مزیت نسبی را از رژیم نامشخص H-1B مشاهده می کنند. ایالات متحده سالانه 85000 ویزای H-1B صادر می کند. خدمات شهروندی و مهاجرت ایالات متحده گفت، حتی با وجود کاهش بیش از"}, {"source": "Business Insider", "title": "SocGen's top stock strategist shares his 3-part AI investing playbook, and 12 stocks to own for further upside", "link": "https://www.businessinsider.com/top-ai-stock-picks-to-buy-investing-productivity-msft-lly-2026-10", "summary": "TIMOTHY A. CLARY / AFP via Getty Images Société Générale is urging investors to stick with all aspects of the AI trade. The bank said new developments in the technology should spur on the trade. SocGen's AI investing playbook highlights companies that are AI builders, AI sellers, and AI users. It's four years since the start of the AI-fueled bull market , and Société Générale is urging investors to stick with all parts of it. In a recent client note, the bank said that new legs of the trade are unfolding, which should continue to propel returns upward, even for the AI infrastructure and application trades that have already seen huge upside. \"After three years of massive infrastructure buildout, AI value creation is beginning to broaden downstream,\" Manish Kabra , SocGen's chief US equity strategist, wrote in the note. \"Rapidly evolving use cases and an expanding ecosystem of software, agents and physical AI applications are widening the opportunity set, from infrastructure providers to companies directly monetising AI products and, ultimately, those capturing productivity gains from adoption.\" There's perhaps no better illustration of Kabra's point than Meta's agentic AI model, Muse . After worries that AI buildout stocks had run their course, the product has sparked new optimism that AI can indeed be monetized and that other firms are likely to keep spending to develop their own agents. The agentic AI boom also promises to boost productivity of firms across sectors of the economy. To keep playing the AI theme, SocGen has released a three-part investing playbook. Here's what to know. AI builders Nvidia s logo is displayed at their headquarters in Santa Clara, California. Benjamin Fanjoy/Getty Images This is the AI infrastructure trade . Think chipmakers, data center stocks, and power companies. These stocks are the recipients of massive hyperscaler capex. Kabra laid out five parts of the supply chain, and stock picks to play each one. We've listed an example stock from each list each below: Chipmaking enablers: Applied Materials (AMAT) Chipmakers: Nvidia (NVDA) Server and networking providers: Arista Networks (ANET) Power Suppliers: GE Vernova (GEV) Cooling: Vertiv (VRT) AI sellers Signage at the Microsoft campus in Mountain View, California, US. Bloomberg/Getty Images This basket capitalizes on companies monetizing the AI buildout through their models. \"AI is part of what customers pay for, directly translating adoption into revenue,\" Kabra wrote. \"Fronti", "date_str": "2026-10-14T09:15:01+00:00", "hash": "982293bab13a6782", "title_fa": "استراتژیست برتر سهام SocGen کتاب سه قسمتی سرمایه گذاری هوش مصنوعی خود را به اشتراک می گذارد و 12 سهام را برای مالکیت بیشتر به اشتراک می گذارد.", "summary_fa": "TIMOTHY A. CLARY / AFP از طریق Getty Images Société Générale از سرمایه گذاران می خواهد تا به تمام جنبه های تجارت هوش مصنوعی پایبند باشند. این بانک گفت که تحولات جدید در فناوری باید تجارت را تحریک کند. کتاب راهنما سرمایه گذاری هوش مصنوعی SocGen شرکت هایی را که سازنده هوش مصنوعی، فروشندگان هوش مصنوعی و کاربران هوش مصنوعی هستند برجسته می کند. چهار سال از شروع بازار صعودی مبتنی بر هوش مصنوعی می‌گذرد، و Société Générale از سرمایه‌گذاران می‌خواهد تا به تمام بخش‌های آن پایبند باشند. در یادداشت اخیر مشتری، بانک اعلام کرد که مراحل جدیدی از تجارت در حال آشکار شدن است، که باید همچنان به افزایش بازده ادامه دهد، حتی برای زیرساخت‌های هوش مصنوعی و معاملات کاربردی که قبلاً رشد چشمگیری داشته‌اند. Manish Kabra، استراتژیست ارشد سهام ایالات متحده SocGen، در یادداشت نوشت: «پس از سه سال ساخت زیرساخت های عظیم، ایجاد ارزش هوش مصنوعی شروع به گسترش پایین دستی می کند. موارد استفاده به سرعت در حال تکامل و اکوسیستم در حال گسترش نرم افزار، عامل ها و برنامه های کاربردی هوش مصنوعی فیزیکی، مجموعه فرصت ها را از ارائه دهندگان زیرساخت گرفته تا شرکت هایی که مستقیماً از محصولات هوش مصنوعی درآمدزایی می کنند و در نهایت، آن هایی که دستاوردهای بهره وری ناشی از پذیرش را کسب می کنند، گسترش می دهد. شاید هیچ تصویری بهتر از مدل هوش مصنوعی متا، Muse، از نظر کابرا وجود نداشته باشد. پس از نگرانی‌ها مبنی بر اینکه سهام‌های توسعه هوش مصنوعی روند خود را طی کرده‌اند، این محصول خوش‌بینی جدیدی را ایجاد کرد که هوش مصنوعی واقعاً می‌تواند درآمدزایی داشته باشد و اینکه سایر شرکت‌ها احتمالاً به هزینه‌های خود برای توسعه نمایندگان خود ادامه می‌دهند. رونق هوش مصنوعی عاملی همچنین نویدبخش افزایش بهره وری شرکت ها در سراسر بخش های اقتصاد است. برای ادامه اجرای تم"}, {"source": "Business Insider", "title": "Ukraine says a sudden Starlink speed limit is disrupting its most important drone missions", "link": "https://www.businessinsider.com/ukraine-starlink-access-slowed-down-affecting-military-operations-elon-musk-2026-10", "summary": "Ukraine is heavily reliant on Starlink for military operations. Inna Varenytsia/REUTERS Ukrainian officials said on Wednesday that Kyiv's access to Starlink has been disrupted. Slower-than-normal speeds have affected military operations, the officials said. Ukraine is heavily reliant on Starlink, specifically for communications and drone missions. Ukraine's access to Starlink internet service was suddenly disrupted, interfering with military operations, sources in the country's defense ministry and a top presidential advisor said on Wednesday. Serhii Beskrestnov, a top advisor to Ukrainian President Volodymyr Zelenskyy, said in a social media post that Elon Musk's SpaceX had implemented speed limits for Starlink terminals overnight. He did not provide evidence to support his claim. Beskrestnov said the restriction throttles the operation of Starshield , the company's dedicated satellite network for military services, at speeds above 100 miles per hour. Sources in Ukraine's defense ministry confirmed the disruption and told Business Insider that SpaceX restricted the Starshield operations without warning the military. They said some units have experienced a loss of connection when drones reach speeds as low as 45 mph. The sources said the disruption has complicated military operations , particularly drone missions. This includes mid-range strikes, front-line logistics, and air defense intercepts, some of Ukraine's most important drone missions. Because Starlink does not work inside Russia, the disruption is limited to drone operations within Ukrainian territory and Russian-occupied territory. Ukraine is in contact with the US, SpaceX, and NATO partners and is working to install backup communication channels, the sources said. SpaceX did not immediately respond to requests for comment from Business Insider. Critical in combat Starlink has become critically important to Ukraine's military, which has adopted it as a battlefield comms system and also uses it in drone warfare. Drones equipped with Starlink dishes, which can be controlled remotely by pilots hundreds of miles away and adapted to new targets mid-mission, have become one of the country's most potent weapons in the battle against Russian forces. Ukraine's use of Starlink has made it reliant on Musk and SpaceX , however. In 2023, the world's richest man said he refused a request from Ukraine's military to activate Starlink to assist a Ukrainian assault on Crimea, and Reuters reported last year that Sp", "date_str": "2026-10-14T08:59:17+00:00", "hash": "80f58b2d3edfa2dd", "title_fa": "اوکراین می‌گوید محدودیت سرعت ناگهانی استارلینک مهم‌ترین ماموریت‌های هواپیماهای بدون سرنشین این کشور را مختل می‌کند", "summary_fa": "اوکراین برای عملیات نظامی به شدت به Starlink وابسته است. اینا وارنیتسیا/رویترز مقامات اوکراینی روز چهارشنبه گفتند که دسترسی کیف به استارلینک مختل شده است. مقامات گفتند که سرعت کمتر از حد معمول بر عملیات نظامی تأثیر گذاشته است. اوکراین شدیداً به استارلینک وابسته است، به‌ویژه برای مأموریت‌های ارتباطی و هواپیماهای بدون سرنشین. منابعی در وزارت دفاع این کشور و یکی از مشاوران ارشد ریاست جمهوری روز چهارشنبه گفتند که دسترسی اوکراین به سرویس اینترنت استارلینک به طور ناگهانی مختل شد و در عملیات نظامی دخالت کرد. سرهی بسکرستنوف، مشاور ارشد ولودیمیر زلنسکی، رئیس جمهور اوکراین، در پستی در شبکه های اجتماعی گفت که اسپیس ایکس ایلان ماسک یک شبه محدودیت سرعت را برای پایانه های Starlink اعمال کرده است. او مدرکی برای اثبات ادعای خود ارائه نکرد. بسکرستنوف گفت که این محدودیت عملکرد Starshield، شبکه ماهواره ای اختصاصی این شرکت برای خدمات نظامی را با سرعت بالای 100 مایل در ساعت کاهش می دهد. منابعی در وزارت دفاع اوکراین این اختلال را تایید کردند و به Business Insider گفتند که اسپیس ایکس بدون هشدار به ارتش، عملیات Starshield را محدود کرد. آنها گفتند که برخی از واحدها زمانی که پهپادها به سرعت 45 مایل در ساعت می رسند، ارتباط خود را از دست داده اند. این منابع گفتند که این اختلال عملیات نظامی، به ویژه ماموریت های هواپیماهای بدون سرنشین را پیچیده کرده است. این شامل حملات میان برد، تدارکات خط مقدم، و رهگیری های پدافند هوایی، برخی از مهم ترین ماموریت های پهپاد اوکراین است. از آنجایی که استارلینک در داخل روسیه کار نمی کند، این اختلال به عملیات پهپادها در داخل خاک اوکراین و سرزمین های تحت اشغال روسیه محدود می شود. این منابع گفتند که اوکراین با ایالات متحده، اسپیس ایکس و شرکای ناتو در تماس است و برای نصب کانال های ارتباطی پشتیبان کار می"}, {"source": "Business Insider", "title": "More babies, more workers, way more AI", "link": "https://www.businessinsider.com/remote-work-long-term-effects-birth-rates-labor-ai-2026-10", "summary": "Maxim Konankov; Agnès Bun; Thomas Trutschell; Andrew Caballero-Reynolds/Getty Images; Alyssa Powell/BI Work from home is dead: You've probably heard some version of this declaration from your boss over the past year. But the numbers show that WFH is actually very much here to stay . The prevalence of working from home has barely budged over the last two years, at around 26% of all American work days. That's a lot less than the 62% we saw in the early months of the pandemic — but a near quadrupling since 2019, when that share was at a miniscule 7%. Had the pandemic never happened, it probably would have taken us 40 years to get to work from home as much as we do today. We've reached a new normal for the corporate workplace — one where remote jobs have become a bigger minority, and it's also become totally normal for white-collar professionals to work from home at least a day or two a week. That shift has brought about all kinds of other changes in American life — some profound, some life-saving, some strange and unexpected. Nobody's reflected on those changes more than Nick Bloom, an economist at Stanford who's the world's leading expert on remote work. When I first spoke to him in early 2021, Bloom was right in the midst of helping rewrite corporate America's work policies , presenting his research to managers at companies including Microsoft, Facebook, Google, and Apple. He warned that years of intense turmoil would follow as employees and employers fought over the new terms of where we work — and he couldn't have been more right. Now that the dust has largely settled, I caught up with him at his house on one of his WFH days to take stock of the most lasting impacts of America's work-from-home revolution. 1. Saved time One of the biggest reasons why people love working from home is because it saves them time. The average commute in the US is about 40 minutes each way, and ahead of venturing out into the world, you need to spend a little extra time making yourself presentable to the world by showering and getting dressed. Rolling out of bed and opening your laptop? That takes 30 seconds. By Bloom's estimates, the typical American worker saves an hour and a half for every day they work from home. For those in WFH-friendly sectors like tech and finance, those time savings average about 3 hours a week. What have people done with that extra time? They're getting more sleep and exercise, and they're cooking — and if they have kids, they're spending a lot more t", "date_str": "2026-10-14T08:11:01+00:00", "hash": "d9ee77113ae234ee", "title_fa": "نوزادان بیشتر، کارگران بیشتر، هوش مصنوعی بسیار بیشتر", "summary_fa": "ماکسیم کونانکوف؛ Agnès Bun; توماس تروتشل؛ اندرو کابالرو-رینولدز/گتی ایماژ; آلیسا پاول/BI کار از خانه مرده است: احتمالاً نسخه‌ای از این بیانیه را در سال گذشته از رئیس خود شنیده‌اید. اما اعداد و ارقام نشان می دهد که WFH واقعاً اینجاست تا بماند. شیوع کار از خانه در دو سال گذشته به سختی کاهش یافته است و حدود 26 درصد از کل روزهای کاری آمریکا بوده است. این بسیار کمتر از 62 درصدی است که در ماه‌های ابتدایی همه‌گیری شاهد بودیم - اما از سال 2019 تقریباً چهار برابر شده است، زمانی که این سهم در حد ناچیز 7 درصد بود. اگر این همه‌گیری هرگز اتفاق نمی‌افتاد، احتمالاً 40 سال طول می‌کشید تا به اندازه امروز از خانه سر کار برویم. ما به یک وضعیت عادی جدید برای محل کار سازمانی رسیده‌ایم - جایی که مشاغل از راه دور به اقلیت بزرگ‌تری تبدیل شده‌اند، و همچنین برای متخصصان یقه سفید کار از خانه حداقل یک یا دو روز در هفته کاملاً عادی شده است. این تغییر انواع تغییرات دیگر را در زندگی آمریکایی به وجود آورده است - برخی عمیق، برخی نجات دهنده، برخی عجیب و غیرمنتظره. هیچ کس به اندازه نیک بلوم، اقتصاددان در استنفورد که متخصص برجسته کار از راه دور در جهان است، به این تغییرات فکر نکرده است. وقتی برای اولین بار در اوایل سال 2021 با او صحبت کردم، بلوم درست در میانه کمک به بازنویسی سیاست‌های کاری شرکت‌های آمریکایی بود و تحقیقات خود را به مدیران شرکت‌هایی از جمله مایکروسافت، فیس‌بوک، گوگل و ا 1 sectors and 40 Chinese and global companies to study where Chinese firms are gaining market share. Chinese products typically enter new markets at about a 30% discount to incumbent rivals, but prices often rise in subsequent years. Chen said higher prices could reflect factors including inflation, economic cycles, and improvements in product quality. Chinese companies often raise prices as their products improve without losing their price advantage over competitors. Chen said the discount versus competitors generally remained stable. Chinese electric vehicles are one example. They sell at roughly a 20% discount to comparable global models, a gap Chen said has remained stable over the past three to four years. Robot vacuum cleaners show an even more dramatic shift. Chen said Chinese products in the category entered the US market at around a 40% discount but now command a roughly 60% premium as manufacturers continue innovating and adding new functions. \"I think it's fair to say the entry of the Chine", "date_str": "2026-10-14T07:11:21+00:00", "hash": "39450b0ef121a1f5", "title_fa": "گلدمن ساکس می‌گوید شرکت‌های چینی تنها به این دلیل که ارزان‌تر هستند، در خارج از کشور برنده نمی‌شوند", "summary_fa": "فناوری مصرف کننده چینی به طور فزاینده ای این تصور را که صادرکنندگان این کشور تنها بر سر قیمت رقابت می کنند، به چالش می کشد. به گفته گلدمن ساکس، لو یونفی/ سرویس خبری چین/ VCG/ گتی ایماژز بزرگترین افسانه در مورد رونق صادرات چین ممکن است اشتباه باشد. محصولات چینی اغلب ارزان شروع می شوند اما با پیشرفت گران تر می شوند. جنگ قیمت اغلب با رقبا شروع می شود که برای به دست آوردن مجدد مشتریان می جنگند. به گفته گلدمن ساکس، شرکت‌های چینی تنها به دلیل ارزان‌تر بودن در خارج از کشور برنده نمی‌شوند و یکی از بزرگترین فرضیات پشت رونق صادرات چین را به چالش می‌کشند. ترینا چن، رئیس تحقیقات سهام چین بزرگ در گلدمن ساکس، در پادکست \"Exchanges\" این بانک که روز سه شنبه منتشر شد، گفت: \"به طور شهودی، فکر می کنم همه ما با محصول چینی همراه خواهیم بود، با کاهش قیمت و کاهش قیمت.\" اما گلدمن دریافت که محصولات چینی اغلب پس از ورود به بازارهای خارجی گران تر می شوند، تا حدی با بهبود کیفیت آنها، در حالی که کاهش قیمت ها دیرتر اتفاق می افتد زیرا رقبای معتبر برای دفاع از سهم بازار مبارزه می کنند. این یافته این دیدگاه را به چالش می کشد که شرکت های چینی با کاهش بی امان قیمت رقبا، بازارهای خارجی را به دست می آورند. این در حالی است که سیاست گذاران از واشنگتن تا بروکسل با افزایش صادرات چین دست و پنجه نرم می کنند، بخشی از آنچه برخی اقتصاددانان آن را \"شوک چین 2.0\" می نامند. تقاضای ضعیف داخلی چین و سال ها فشار کاهش تورم نیز نگرانی هایی را در مورد اینکه صادرکنندگان این کشور ممکن است قیمت ها را در خارج از کشور کاهش دهند، افزایش داده است. گلدمن بیش از یک مسابقه به سمت پایین، 11 بخش و"}, {"source": "Business Insider", "title": "John Cena says thinking about death helps him make a bad day shorter", "link": "https://www.businessinsider.com/john-cena-tip-making-bad-day-feel-shorter-2026-10", "summary": "John Cena says people should talk more openly about death. Noam Galai/FilmMagic John Cena has a tip for making a bad day feel shorter. The retired wrestler says remembering he's \"just renting\" helps him appreciate being alive. The thought helps him see setbacks and frustrations in a different light. John Cena , 49, has a trick to put a bad day into perspective. During an appearance on \" The Drew Barrymore Show ,\" the retired WWE wrestler spoke about how getting older has shifted his perspective on life. When host Drew Barrymore said turning 50 helped quiet her negative self-talk because she realized she had less time, Cena said he, too, had a similar epiphany. \"We're all going to die. And I don't think we look at that enough, because death — loss — is tragic. It's morbid. It's very sad if you look at it that way. It is absolute and inevitable,\" Cena told Barrymore. Cena said science may one day extend life or help people avoid the pain of loss, but for now, he sees death as an unavoidable part of being human. People would be \"much better off\" if they were able to have open conversations about death, he said. Cena added that he's learned not to take the time he has for granted. \"Me reminding myself that I'm just renting, and we're all going to the same place, allows me to approach every day, if I'm on the wrong side of the bed, to make that wrong side of the bed shorter — because I'm alive,\" he said. Cena started wrestling professionally in 1999. In 2024, he announced his retirement and wrestled his final match the following year. He previously said he retired from wrestling because he wanted to protect his body and \" enjoy a long, good life \" outside the ring. In May, Cena told Business Insider that he trains his flexibility by stretching for 45 minutes and enjoys doing squat exercises because they help him improve his balance and stability. He also said his one regret from his WWE days is not seeking help, especially about his health, sooner, \"I think it's very important to know that you're not indestructible, you're not alone, and you're not perfect. And anytime you have an ailment, asking for help is not a weakness, that's a strength,\" Cena said. Read the original article on Business Insider", "date_str": "2026-10-14T07:10:46+00:00", "hash": "8d743c73a5677411", "title_fa": "جان سینا می‌گوید فکر کردن به مرگ به او کمک می‌کند تا یک روز بد را کوتاه‌تر کند", "summary_fa": "جان سینا می گوید مردم باید با صراحت بیشتر درباره مرگ صحبت کنند. Noam Galai/FilmMagic جان سینا نکته ای برای کوتاه کردن یک روز بد دارد. کشتی‌گیر بازنشسته می‌گوید یادآوری این که «فقط اجاره می‌کند» به او کمک می‌کند از زنده بودنش قدردانی کند. این فکر به او کمک می‌کند تا شکست‌ها و ناامیدی‌ها را از دید دیگری ببیند. جان سینا، 49 ساله، ترفندی برای ترسیم یک روز بد دارد. این کشتی گیر بازنشسته دبلیو دبلیو ای در طی حضور در \"نمایش درو بریمور\" در مورد اینکه چگونه پیر شدن دیدگاه او را نسبت به زندگی تغییر داده است صحبت کرد. هنگامی که درو بریمور مجری برنامه گفت که 50 سالگی به او کمک کرد تا صحبت های منفی خود را آرام کند زیرا متوجه شد که زمان کمتری دارد، سینا گفت که او نیز چنین اتفاقی افتاده است. \"همه ما قرار است بمیریم. و من فکر نمی‌کنم که به اندازه کافی به این موضوع نگاه کنیم، زیرا مرگ - از دست دادن - غم انگیز است. این بیمارگونه است. اگر اینطور به آن نگاه کنید بسیار ناراحت کننده است. این امر مطلق و اجتناب ناپذیر است.\" سینا به بریمور گفت. سینا گفت که علم ممکن است روزی عمر را افزایش دهد یا به مردم کمک کند تا از درد ناشی از فقدان دوری کنند، اما در حال حاضر، او مرگ را بخشی اجتناب ناپذیر از انسان می داند. او گفت که مردم اگر بتوانند گفتگوهای صریح درباره مرگ داشته باشند، \"بسیار بهتر خواهند بود\". او گفت: «من به خودم یادآوری می‌کنم که فقط اجاره می‌دهم، و همه ما به یک مکان می‌رویم، به من اجازه می‌دهد هر روز، اگر در سمت اشتباه تخت هستم، نزدیک‌تر شوم تا آن سمت اشتباه تخت را کوتاه‌تر کنم - چون زنده هستم. سینا کشتی را از سال 1999 به صورت حرفه ای آغاز"}, {"source": "Business Insider", "title": "Ukraine wants to use AI to predict where Russian drones will hit the battlefield with 'high probability'", "link": "https://www.businessinsider.com/ukraine-nato-artificial-intelligence-model-13-russian-drones-where-when-2026-10", "summary": "A soldier from the Striletskyi special forces police battalion of the National Police in the Zaporizhzhia region looks at a smartphone near a Ukrainian 2S22 Bohdana 155 mm self-propelled howitzer. Dmytro Smolienko/Ukrinform/NurPhoto via Getty Images Ukraine says it's about to start using an AI model that can forecast drone threats on the front lines. It said the tool analyzes battlefield data to predict how, where, and when Russia will strike. The model, dubbed No. 13, was jointly developed with NATO, its defense ministry said. Ukraine's defense ministry said on Tuesday that its forces are about to start using a jointly NATO-developed artificial intelligence model to predict where and when Russia's drone strikes will land. Dubbed \"Model No. 13,\" the tool analyzes past combat data, weather conditions, and battlefield conditions to determine, with \"high probability,\" how Russian troops will use drones on the front lines, the ministry said in a statement. The model can forecast the strike's time, location, intensity, and type of drone used, the ministry said. \"The solution has already been validated using real-world datasets. It has been refined and is ready for integration into the Armed Forces of Ukraine's situational awareness systems,\" its statement read. The ministry said Model No. 13 was developed by its armed forces and NATO's Allied Command Transformation , with support from the Joint Analysis, Training and Education Center, an organization the alliance created in late 2024 to help it innovate based on lessons learned in the war. ACT and JATEC did not immediately respond to requests for comment sent outside regular business hours by Business Insider. Another AI model that plans artillery deployments, No. 32, is also being jointly created, Ukraine's defense ministry said. However, Ukrainian troops are still testing a prototype of the model, it added. The announcement comes after Ukrainian officials said in February that their forces had been working with AI and machine learning models since last year to process combat data from the war for \"threat forecasting.\" Model No. 13 is likely to run on Ukraine's DELTA battlefield management system , a digital app that combines intelligence from drones, cameras, and battlefield reports to give commanders an overview of the frontline from their tablets or phones. The system already uses an AI module called Vezha that Ukraine says can automatically detect and flag Russian equipment in seconds by analyzing satellit", "date_str": "2026-10-14T05:09:15+00:00", "hash": "cb3b0f5a9cae4294", "title_fa": "اوکراین می‌خواهد از هوش مصنوعی برای پیش‌بینی محل برخورد پهپادهای روسی به میدان نبرد با «احتمال بالا» استفاده کند.", "summary_fa": "یک سرباز از گردان پلیس نیروهای ویژه Striletskyi پلیس ملی در منطقه Zaporizhzhia به تلفن هوشمند نزدیک یک هویتزر خودکششی 155 میلی متری اوکراینی 2S22 Bohdana نگاه می کند. Dmytro Smolienko/Ukrinform/NurPhoto از طریق Getty Images اوکراین می گوید در شرف استفاده از یک مدل هوش مصنوعی است که می تواند تهدیدات پهپادها را در خط مقدم پیش بینی کند. این ابزار می‌گوید این ابزار داده‌های میدان نبرد را برای پیش‌بینی چگونگی، مکان و زمان حمله روسیه تجزیه و تحلیل می‌کند. مدل با نام No. 13، به طور مشترک با ناتو توسعه داده شد، وزارت دفاع آن گفت. وزارت دفاع اوکراین روز سه‌شنبه اعلام کرد که نیروهای این کشور در آستانه استفاده از مدل هوش مصنوعی مشترک ناتو برای پیش‌بینی محل و زمان حملات پهپادی روسیه هستند. این وزارتخانه در بیانیه ای اعلام کرد که این ابزار که «مدل شماره 13» نام دارد، داده های رزمی گذشته، شرایط آب و هوایی و شرایط میدان نبرد را تجزیه و تحلیل می کند تا با «احتمال زیاد» نحوه استفاده نیروهای روسی از هواپیماهای بدون سرنشین در خط مقدم را مشخص کند. به گفته این وزارتخانه، این مدل می‌تواند زمان، مکان، شدت و نوع پهپاد مورد استفاده را پیش‌بینی کند. در بیانیه آن آمده است: \"راه حل قبلاً با استفاده از مجموعه داده های دنیای واقعی تأیید شده است. این راه حل اصلاح شده و برای ادغام با سیستم های آگاهی موقعیتی نیروهای مسلح اوکراین آماده است.\" این وزارتخانه گفت مدل شماره. 13 توسط نیروهای مسلح آن و فرماندهی متفقین تحول ناتو، با حمایت مرکز تحلیل، آموزش و آموزش مشترک، سازمانی که اتحاد در اواخر سال 2024 برای کمک به نوآوری بر اساس درس های آموخته شده در جنگ ایجاد کرد، توسعه یافت. ACT و JATEC بلافاصله به درخواست‌های ارسال شده خارج از ساعات کاری عادی توسط Business Insider پاسخ ندادند. مدل دیگری از"}, {"source": "Business Insider", "title": "The Treasury just fined BofA $1.2 billion, saying it didn't report Chinese money laundering networks", "link": "https://www.businessinsider.com/treasury-fined-bank-of-america-1-2-billion-2026-10", "summary": "The Treasury has fined the Bank of America more than $1.2 billion. Nicolò Campo/LightRocket via Getty Images The Treasury Department has imposed a fine of more than $1.2 billion on the Bank of America. It said BofA failed to report suspicious transactions tied to Chinese money-laundering networks. A BofA spokesperson said the fine would impact the bank's coming quarterly earnings. The US Treasury Department said it is imposing more than $1.2 billion in penalties against Bank of America . The Treasury said in a Tuesday news release that the bank — the country's second-largest — failed to report over $5 billion in suspicious transactions to the Financial Crimes Enforcement Network. This included Chinese money-laundering networks along the US's southwestern border. It added that the bank had also violated several sanctions programs, \"including on Iran, Russia, narcotics, and global terrorism.\" The Treasury did not provide details of when these missteps occurred. Its release said the fine was the third-largest penalty it had imposed in its history. \"When a bank of this size fails to meet its anti-money laundering and sanctions obligations, the consequences extend far beyond its own walls, exposing the entire US financial system to significant illicit finance risks,\" Treasury Secretary Scott Bessent said in the release. \"Today's actions send a clear message that even the biggest financial institutions are not above the law,\" he added. The Treasury said that the bank lacked trained staff who could monitor suspicious activity. Along with the fine, the Treasury has ordered the bank to work with a third party to identify and report previously undetected suspicious transactions, and to undergo an independent review of its suspicious activity identification. A BofA spokesperson said in a statement that it is working with regulators on the issue. \"We have invested billions of dollars in technology and dedicated thousands of employees to combat financial crime , and our team is far along with and committed to completing the work required to address the issues raised by our regulators,\" a Bank of America spokesperson said. The spokesperson also said that the fine would impact the bank's upcoming third-quarter earnings, \"impacting net income by approximately 17 cents per share.\" Representatives of the Treasury did not respond to requests for comment from Business Insider. Read the original article on Business Insider", "date_str": "2026-10-14T05:02:02+00:00", "hash": "1c9d4ebd6ec3b07a", "title_fa": "وزارت خزانه داری به تازگی BofA را 1.2 میلیارد دلار جریمه کرد و گفت که شبکه های پولشویی چینی را گزارش نکرده است.", "summary_fa": "وزارت خزانه داری بانک آمریکا را بیش از 1.2 میلیارد دلار جریمه کرده است. Nicolò Campo/LightRocket از طریق Getty Images وزارت خزانه داری بیش از 1.2 میلیارد دلار جریمه برای بانک آمریکا وضع کرده است. این سازمان گفت که BofA در گزارش تراکنش های مشکوک مرتبط با شبکه های پولشویی چینی شکست خورده است. یکی از سخنگویان BofA گفت این جریمه بر درآمد سه ماهه آینده بانک تأثیر خواهد گذاشت. وزارت خزانه داری آمریکا اعلام کرد که بیش از 1.2 میلیارد دلار جریمه علیه بانک آمریکا اعمال می کند. وزارت خزانه داری روز سه شنبه در یک بیانیه خبری گفت که این بانک - دومین بانک بزرگ کشور - در گزارش بیش از 5 میلیارد دلار تراکنش های مشکوک به شبکه اجرای جرایم مالی کوتاهی کرده است. این شامل شبکه های پولشویی چینی در امتداد مرز جنوب غربی ایالات متحده بود. این بانک همچنین چندین برنامه تحریمی از جمله ایران، روسیه، مواد مخدر و تروریسم جهانی را نقض کرده است. وزارت خزانه داری جزئیات مربوط به زمان وقوع این اشتباهات را ارائه نکرد. در انتشار آن آمده است که این جریمه سومین جریمه بزرگی است که در تاریخ خود اعمال کرده است. اسکات بسنت، وزیر خزانه داری آمریکا در این بیانیه گفت: «وقتی بانکی با این بزرگی به تعهدات خود در مبارزه با پولشویی و تحریم عمل نمی کند، عواقب آن فراتر از دیوارهای خود است و کل سیستم مالی آمریکا را در معرض خطرات مالی غیرقانونی قابل توجهی قرار می دهد.» وی افزود: «اقدامات امروز پیام روشنی را ارسال می کند که حتی بزرگ ترین مؤسسات مالی فراتر از قانون نیستند». خزانه داری گفت که بانک فاقد کارکنان آموزش دیده است که بتوانند فعالیت های مشکوک را نظارت کنند. همراه با جریمه، خزانه داری بانک را موظف کرده است تا با شخص ثالثی برای شناسایی و گزارش تراکنش های"}, {"source": "Business Insider", "title": "Inside the Singapore shophouse where assisted living comes with a social club", "link": "https://www.businessinsider.com/camino-house-assisted-living-facility-singapore-shophouse-community-eldercare-2026-10", "summary": "Camino House is an assisted-living facility in one of Singapore s iconic conservation shophouses. Rebecca Toh for Business Insider. This is the story of seven older adults who live together in a shophouse in Singapore. Uncle Chee is usually the first up. Aunty Lydia begins her day with oats and blueberries. Uncle Cheong often heads to a nearby hawker center, sometimes returning with snacks from the 7-Eleven next door. Some days, the space fills with people beyond its residents. On the Tuesday morning I visited in September, Camino House, their assisted-living home , was a flurry of activity. Preschoolers had come for a painting session, filling the shophouse with chatter and laughter. It is also home to Joo Chiat Social Club, which hosts art, cooking, and other activities that bring residents together with children, volunteers, and other community members. Rebecca Toh for Business Insider. This was exactly the kind of interaction Mariel Chee and Bennett Lee, both 32, hoped to foster when they founded Camino House. Rather than build a traditional care facility, they wanted to create a space where people from all walks of life could interact. \"One that's beautiful and welcoming, not clinical or institutional. Somewhere we'd want to grow old ourselves,\" Chee told Business Insider. Shophouses are an iconic part of Singapore s heritage. As the name suggests, the ground floor of a shophouse is traditionally used for commercial purposes, while people live upstairs. Rebecca Toh for Business Insider. Chee, an artist with a background in early childhood development, and Lee, an engineer, were childhood friends who later married. Lee also grew up around eldercare: his parents are both doctors and founded another assisted-living provider in Singapore. Have you chosen a retirement, assisted living, memory care, or long-term care community in Asia for yourself or a loved one? We'd love to hear about your experience. Fill in this short form to share your story. Follow Amanda Goh for more on this topic. For Chee, the project was also personal. Her father was diagnosed with Alzheimer's in his mid-60s. Chee and her siblings were still in school at the time. \"It was really hard, because he was so young and none of us knew how to care for him,\" she said. Mariel Chee and Bennett Lee are the founders of Camino House and Joo Chiat Social Club. Rebecca Toh for Business Insider. A middle ground between home and a nursing home Populations are aging around the world, raising urgent ", "date_str": "2026-10-14T05:00:16+00:00", "hash": "60302f49d75a703f", "title_fa": "در داخل مغازه سنگاپور که در آن زندگی کمکی یک باشگاه اجتماعی دارد", "summary_fa": "خانه کامینو یک مرکز کمکی برای زندگی در یکی از فروشگاه‌های نمادین حفاظت‌شده سنگاپور است. ربکا تو برای Business Insider. این داستان هفت سالمند است که با هم در یک مغازه در سنگاپور زندگی می کنند. عمو چی معمولاً اولین نفر است. عمه لیدیا روز خود را با جو و زغال اخته آغاز می کند. عمو چئونگ اغلب به یک مرکز دستفروشی در همان نزدیکی می رود و گاهی اوقات با خوردن تنقلات از 7-Eleven همسایه برمی گردد. برخی از روزها، فضا پر از افراد فراتر از ساکنان آن می شود. صبح روز سه‌شنبه‌ای که در ماه سپتامبر از آن بازدید کردم، خانه کامینو، خانه کمک‌هایشان، فعالیت‌های زیادی داشت. بچه های پیش دبستانی برای یک جلسه نقاشی آمده بودند و مغازه را پر از پچ پچ و خنده کرده بودند. همچنین محل باشگاه اجتماعی جو چیات است که میزبان هنر، آشپزی و سایر فعالیت‌هایی است که ساکنان را با کودکان، داوطلبان و سایر اعضای جامعه گرد هم می‌آورد. ربکا تو برای Business Insider. این دقیقاً همان نوع تعاملی بود که ماریل چی و بنت لی، هر دو 32 ساله، امیدوار بودند که در زمان تأسیس خانه کامینو ایجاد کنند. آنها به جای ساختن یک مرکز مراقبت سنتی، می خواستند فضایی ایجاد کنند که در آن افراد از همه اقشار بتوانند تعامل داشته باشند. چی به Business Insider گفت: \"یکی که زیبا و خوشایند است، نه بالینی یا نهادی. جایی که ما می خواهیم خودمان پیر شویم.\" فروشگاه‌ها بخشی نمادین از میراث سنگاپور هستند. همان  بانکدار را استخدام کرده است", "summary_fa": "لیسبون، پرتغال - 12 نوامبر 2025؛ جسی ژانگ، یکی از بنیانگذاران، مدیر عامل، هوش مصنوعی Decagon در مرکز استیج در روز دوم Web Summit 2025 در MEO Arena در لیسبون، پرتغال. (عکس Shauna Clinton/Sportsfile for Web Summit از طریق Getty Images) Shauna Clinton/Sportsfile for Web Summit از طریق Getty Images استارت‌آپ هوش مصنوعی Decagon عوامل هوش مصنوعی را برای خودکارسازی پشتیبانی مشتری برای مشتریان سازمانی ایجاد می‌کند. این شرکت یک بانک سرمایه گذاری را برای ارزیابی بهره M A استخدام کرده است. مذاکرات اولیه با خریداران بالقوه انجام شده است. به روز رسانی: این داستان به روز شده است تا نشان دهد که ServiceNow می گوید دیگر در حال مذاکره با Decagon نیست. استارت‌آپ عامل هوش مصنوعی Decagon می‌تواند آخرین شرکتی باشد که در موج رو به رشد معاملات هوش مصنوعی به کار گرفته شده است. به گفته افراد آشنا، این شرکت که آخرین ارزش آن در اوایل امسال 4.5 میلیارد دلار بود، یک بانک را برای ارزیابی سود خرید استخدام کرده است. Decagon مذاکرات اولیه ای را با غول نرم افزار ابری ServiceNow انجام داد، اما سخنگوی ServiceNow می گوید که آنها ادامه ندارند. افراد آشنا به این موضوع به Business Insider گفتند که مذاکرات اولیه با شرکت های دیگر نیز انجام شده است. اگر یک معامله محقق نشود، دکاگون می تواند در عوض یک دور جدید تامین مالی را افزایش دهد. رویکرد ما به M A تغییر نکرده است: ما ابتدا یک شرکت رشد ارگانیک باقی می‌مانیم. امیت زاوری، رئیس، مدیر ارشد محصول و مدیر عملیات ServiceNow، گفت: M A ابزاری برای تسریع نقشه راه ما یا باز کردن نوآوری های جدید معنادار است. علاقه به Decagon نشان دهنده یک تغییر جدید در رونق هوش مصنوعی است: پس از سال ها دور سرمایه گذاری عظیم و ارزش گذاری های فزاینده، شرکت های فناوری به طور فزاینده ای به"}, {"source": "Business Insider", "title": "Art of Play co-owner says Kelly Clarkson's post was 'like she threw a Molotov cocktail at us'", "link": "https://www.businessinsider.com/art-of-play-co-owner-response-kelly-clarkson-molotov-cocktail-2026-10", "summary": "Kelly Clarkson s complaint went viral. The store s owner told Business Insider that people in his life are hearing from her fans. Weiss Eubanks/NBCUniversal via Getty Images - Ben Shimkus/Business Insider Art of Play's co-owner told Business Insider Kelly Clarkson's post was \"like a Molotov cocktail.\" The viral fight placed Adam Rubin's small Brooklyn shop at the center of a massive online drama. Rubin says the store got threats online — and hugs from supportive strangers. Adam Rubin said he wasn't supposed to come into work on Tuesday. The co-owner of Art of Play — a small Brooklyn-based shop with tarot cards, funky home decor, magic trick books, and a wooden bird named Molly — said he was supposed to get some stitches removed. Instead, he came in to answer questions about Kelly Clarkson's viral social-media complaint. \"It's like she threw a Molotov cocktail at us,\" Adam Rubin told Business Insider. \"And we're just here to pick up the pieces.\" On Saturday, Clarkson wrote on X that she had driven to Brooklyn to visit Art of Play and was treated as if she could not afford an item she wanted to buy. She compared the experience to the \"Pretty Woman\" scene, when Julia Roberts' character is dismissed by salespeople at a luxury store. Art of Play has an altogether different story. The store said Clarkson had asked to buy Molly, a one-of-a-kind bird automaton that was not for sale. Clarkson responded by calling the shop liars. On Tuesday, Rubin told USA Today the bird is now for sale for $15 million. View this post on Instagram A post shared by Art of Play (@artofplay) Internet sleuths have been attempting to sort out the drama, largely to no avail. Investigative journalist Pablo Torre is also on the case — an update Rubin declined to comment on. The back-and-forth has pushed an otherwise sleepy block of Brooklyn into a surprisingly large online drama. Art of Play sits adjacent to a hospital and across from the Brooklyn-Queens Expressway, in what Rubin called a \" Robert Moses-abandoned \" stretch of old buildings that had fallen into decay before businesses l ارکسون پاسخ داد و مغازه را دروغگو خواند. روز سه شنبه، روبین به USA Today گفت که این پرنده اکنون به قیمت 15 میلیون دلار به فروش می رسد. این پست را"}, {"source": "Business Insider", "title": "Best fresh dog food", "link": "https://www.businessinsider.com/guides/pets/best-fresh-dog-food", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We tried eight fresh dog food brands before landing on our top picks from The Farmer s Dog, JustFoodForDogs, and Freshpet. Jaclyn Turner; Jill Waldbieser; Elizabeth Holbrook/Business Insider Several companies offer fresh dog food made with gently cooked, whole foods. These diets are often very appealing to dogs, but finding the right one for your pet can be overwhelming. For this guide, we tested eight fresh dog food delivery services. I tested seven of them with my dog, Lyla. Since then, several other reporters and their pups have tried them to ensure consistent quality and service among our top picks. I also consulted two board-certified veterinary nutritionists and a food safety expert to better understand canine nutrition and fresh pet food safety. The best fresh dog food at a glance Best overall: JustFoodForDogs is our top pick for fresh dog food, thanks to its wide variety of frozen and shelf-stable recipes supported by pet nutrition research and feeding trials. Best on a budget: The Farmer's Dog offers the best value with seven feed-trial-tested, fresh-frozen recipes. Best for food puzzles and training: Freshpet Delivery features five different recipes that only require refrigeration and are easy to scoop and serve. We've thoroughly vetted our recommendations to choose the best fresh dog food brands that lead the pack with expertly formulated healthy recipes, rigorous quality control, convenient home delivery, and generous discounts for new subscribers. No matter which food you choose, make sure it meets the Association of American Feed Control Officials (AAFCO) standards for complete and balanced nutrition. Veterinarians also recommend choosing foods from brands that adhere to the Global Nutrition Guidelines published by the World Small Animal Veterinary Association (WSAVA). If you're switching to fresh pet food, keep in mind that it's not necessarily healthier than our top picks for canned and dry dog food . Researchers at the University of Minnesota's Urolith Center recently identified a new type of canine bladder stone — calcium tartrate tetrahydrate (CTT) — linked to choline bitartrate, an ingredient used in some fresh dog foods and supplements, including recipes from JustFoodForDogs, The Farmer's Dog, and Nom Nom. If your dog has CTT stones, consult your vet about switching to a choline bitartrate-free food, such as formulas from Hill's, Royal Canin, ", "date_str": "2026-10-13T21:54:10+00:00", "hash": "81ede286b0e51259", "title_fa": "بهترین غذای تازه سگ", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید ما هشت برند تازه غذای سگ را امتحان کردیم قبل از اینکه به بهترین انتخاب‌هایمان از The Farmer s Dog، JustFoodForDogs و Freshpet رسیدیم. جاکلین ترنر؛ جیل والدبیزر; الیزابت هالبروک/Business Insider چندین شرکت غذای تازه سگ را ارائه می دهند که با غذاهای کامل و به آرامی پخته شده باشد. این رژیم‌ها اغلب برای سگ‌ها بسیار جذاب هستند، اما پیدا کردن رژیم غذایی مناسب برای حیوان خانگی شما می‌تواند سخت باشد. برای این راهنما، ما هشت سرویس تحویل غذای تازه سگ را آزمایش کردیم. من هفت تا از آنها را با سگم لیلا آزمایش کردم. از آن زمان، چندین خبرنگار دیگر و بچه‌هایشان آنها را امتحان کرده‌اند تا از کیفیت و خدمات ثابت در میان برگزیدگان ما اطمینان حاصل کنند. من همچنین با دو متخصص تغذیه دامپزشکی دارای گواهی هیئت مدیره و یک متخصص ایمنی مواد غذایی برای درک بهتر تغذیه سگ ها و ایمنی غذای تازه حیوانات خانگی مشورت کردم. بهترین غذای تازه سگ در یک نگاه به طور کلی بهترین: JustFoodForDogs بهترین انتخاب ما برای غذای تازه سگ است، به لطف طیف گسترده ای از دستور العمل های منجمد و قابل نگهداری که unger, Tolles Olson; Skadden, Arps, Slate, Meagher Flom; and Quinn Emanuel Urquhart Sullivan were owed roughly $137,000, $126,000, and $64,000, respectively. Representatives for Google and the law firms did not immediately respond to requests for comment. The court filing does not detail the nature of the debts. However, Character.AI, founded by former Google researchers, named Google Cloud its preferred cloud infrastructure in 2023. The startup has also faced a wave of lawsuits alleging its chatbots harmed or encouraged harmful behavior among young users. Character.AI agreed to settle multiple lawsuits earlier this year. The AI company's bankruptcy filings suggest that those legal troubles were part of a broader financial squeeze. Character.AI's bankruptcy petition estimated assets worth $50 million to $100 million and estimated liabilities in the same range. \"The burgeoning and evolving field of AI entertainment, however, has proven to be costly to develop and grow,\" a filing in the case reads. \"These high costs, coupled with potential litigation related liabilities and regulatory engagement have contributed to the Debtor's inability to generate sufficient cash flows to support its business in the present form.\" A Character.AI spokesperson told Busin", "date_str": "2026-10-13T21:49:09+00:00", "hash": "252ff6f0303d8728", "title_fa": "پرونده های دادگاه نشان می دهد Character.AI به گوگل و شرکت های حقوقی بزرگ نزدیک به 7 میلیون دلار بدهکار است", "summary_fa": "Character.AI برای حفاظت از ورشکستگی فصل 11 ثبت نام کرد. تصویر توسط Algi Febri Sugita/SOPA Images/LightRocket از طریق Getty Images Character. AI به گوگل و پنج شرکت حقوقی بزرگ مجموعاً 7 میلیون دلار بدهکار است، پرونده های ورشکستگی نشان می دهد. استارت‌آپ هوش مصنوعی که توسط کارمندان سابق گوگل تأسیس شده بود، این هفته برای حمایت از ورشکستگی فصل 11 ثبت نام کرد. پرونده های دادگاه نشان می دهد که بیش از 10.6 میلیون دلار به 20 طلبکار بزرگ بدون وثیقه خود بدهکار است. پرونده های دادگاه نشان می دهد که استارت آپ هوش مصنوعی Cha
