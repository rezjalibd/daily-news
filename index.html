<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۸ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۸ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۳۰ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۹:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۱۶</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۳۱</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۶۶</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

ews.com/articles/stories/09/97/20/55/1200x675_cmsv2_44e7a797-088a-5d94-b3ed-b20e728b6beb-9972055.jpg", "category": "جامعه و رویدادها", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۷ آبان • ۱۷:۴۰"}, {"source": "Euronews Persian", "title": "وصیت‌نامه خامنه‌ای سوخته یا پنهان شده است؟ سه روایت از راز جانشینی مجتبی", "link": "https://parsi.euronews.com/2026/10/29/ali-khamenei-missing-will-mojtaba-succession-iran", "summary": "هشت ماه پس از کشته‌شدن علی خامنه‌ای، هنوز خبری از وصیت‌نامه او نیست. آیا این سند در بمباران نابود شده یا محتوای آن با رهبری مجتبی خامنه‌ای در تضاد است؟ سه فعال سیاسی در گفت‌وگو با یورونیوز، روایت‌های متفاوتی از موضع رهبر پیشین جمهوری اسلامی درباره جانشینی پسرش مطرح کرده‌اند.", "date_str": "2026-10-29T14:03:44+00:00", "hash": "f5716bf531deb2c8", "title_fa": "وصیت‌نامه خامنه‌ای سوخته یا پنهان شده است؟ سه روایت از راز جانشینی مجتبی", "summary_fa": "هشت ماه پس از کشته‌شدن علی خامنه‌ای، هنوز خبری از وصیت‌نامه او نیست. آیا این سند در بمباران نابود شده یا محتوای آن با رهبری مجتبی خامنه‌ای در تضاد است؟ سه فعال سیاسی در گفت‌وگو با یورونیوز، روایت‌های متفاوتی از موضع رهبر پیشین جمهوری اسلامی درباره جانشینی پسرش مطرح کرده‌اند.", "image_url": "https://images.euronews.com/articles/stories/09/97/20/41/1200x675_cmsv2_9bb23ae7-13bd-544f-b5d1-b9e08dcc2fe6-9972041.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۷ آبان • ۱۷:۳۳"}, {"source": "BBC Persian", "title": "دست‌کم سیزده نفر در حمله پهپادی روسیه به یک ایستگاه قطار در اوکراین کشته شدند", "link": "https://www.bbc.com/persian/articles/ckly06j4dqdxo?at_medium=RSS&at_campaign=rss", "summary": "مقام‌های اوکراینی می‌گویند در پی اصابت یک پهپاد روسی مجهز به موتور جت به سکوی شلوغ ایستگاه راه‌آهن شهر دنیپرو دست‌کم ۱۳ نفر کشته شدند. به گفته مقام‌های محلی، در این حمله دست‌کم ۱۳ نفر دیگر نیز مجروح شده‌اند.", "date_str": "2026-10-29T14:44:10+00:00", "hash": "6b7daf4ff88804d0", "title_fa": "دست‌کم سیزده نفر در حمله پهپادی روسیه به یک ایستگاه قطار در اوکراین کشته شدند", "summary_fa": "مقام‌های اوکراینی می‌گویند در پی اصابت یک پهپاد روسی مجهز به موتور جت به سکوی شلوغ ایستگاه راه‌آهن شهر دنیپرو دست‌کم ۱۳ نفر کشته شدند. به گفته مقام‌های محلی، در این حمله دست‌کم ۱۳ نفر دیگر نیز مجروح شده‌اند. بر اساس گزارش‌ها، قربانیان در انتظار سوار شدن به قطار بودند. رئیس شبکه راه آهن اوکراین گفته است با آنکه پیش از این حمله، سطح هشدار امنیتی در شهر دنیپرو افزایش یافته بود، باز هم شماری از مسافران در ایستگاه جمع شده بودند. ولودیمیر زلنسکی، رئیس جمهور اوکراین گفت روسیه به محلی حمله کرده که مسافران عادی منتظر سوار شدن به یک قطار شهری بودند. او بار دیگر از آمریکا، اروپا و کشورهای عضو گروه هفت خواست تحریم‌های بیشتری علیه مسکو اعمال کنند. وزارت دفاع روسیه ادعای حمله به اهداف غیرنظامی را رد کرده و گفته حمله به شبکه راه آهن اوکراین بخشی از حملات به زیرساخت‌هایی است که برای نقل و انتقالات نظامی استفاده می‌شود. هم‌زمان مقامات اوکراینی از کشته شدن دو دختر نوجوان در حمله موشکی روسیه به شهر چرنیهیف خبر دادند. به گفته این مقامات دست‌کم یازده نفر دیگر که بیشتر آنها کودک بودند، در این حمله زخمی شدند. در خبری دیگر، روسیه حمله پهپادی اوکراین به مسکو را محکوم کرده است. این حمله در زمانی صورت گرفته که مسکو میزبان نشست روسیه-آفریقا با حضور بیش از بیست رهبر آفریقایی است. دیمیتری پسکوف، سخنگوی کرملین زمان این حمله را «بسیار نامتعارف» خوانده است. به گفته سرگئی سوبیانین، شهردار مسکو، بیش از ششصد پهپاد اوکراینی، در طول شب به این منطقه حمله کردند که بیشتر آنها رهگیری شد. در هفته‌های اخیر، اوکراین حملات به خاک روسیه را با هدف آسیب رساندن به زیرساخت‌های این کشور بیشتر کرده است. مقام‌های اوکراینی گفته‌اند مردم عادی روسیه باید تاثیرات جنگ را حس کنند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/b8b9/live/f95e0ce0-d39e-11f1-abc7-23eff3a47521.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۷ آبان • ۱۸:۱۴"}, {"source": "BBC Persian", "title": "نقش احزاب عربی در شرایطی که نتانیاهو و آیزنکوت پیروز نشوند", "link": "https://www.bbc.com/persian/articles/cx1l3912rq7zo?at_medium=RSS&at_campaign=rss", "summary": "با شمارش آرا انتخابات پارلمانی اسرائیل، این پرسش مطرح شده که در صورت برنده نشدن نتانیاهو و آیزنکوت، نقش احزاب عربی در سیاست این کشور چه خواهد بود", "date_str": "2026-10-29T14:31:22+00:00", "hash": "a22e08d58defbe6f", "title_fa": "نقش احزاب عربی در شرایطی که نتانیاهو و آیزنکوت پیروز نشوند", "summary_fa": "با شمارش آرا انتخابات پارلمانی اسرائیل، این پرسش مطرح شده که در صورت برنده نشدن نتانیاهو و آیزنکوت، نقش احزاب عربی در سیاست این کشور چه خواهد بود با شمارش بیش از۹۰ درصد آرای انتخابات اسرائیل، رسانه‌های اصلی این کشور گزارش داده‌اند که ائتلاف بنیامین نتانیاهو متشکل از احزاب راستگرا و راست افراطی و یهودیان بنیادگرا، در مسیر کسب ۵۳ کرسی پارلمان قرار دارد؛ بسیار بیشتر از ۴۸ کرسی ائتلاف مخالف به رهبری گادی آیزنکوت. اما بی‌سابقه‌ترین نتیجه را احزاب عرب‌ها و فلسطینی‌های اسرائیل به‌دست آوردند که با مشارکت بالا ۱۹ کرسی کنست، پارلمان اسرائیل، را به دست خواهند آورد. با شمارش آرای غیابی، نتایج هنوز ممکن است تغییر کند اما پیروزی گادی آیزنکوت هر لحظه دورتر به نظر می‌رسد. به نظر می‌رسد بنیامین نتانیاهو، نخست‌وزیر کهنه‌کار اسرائیل، عملکردی بهتر از آنچه پیش‌بینی می‌شد داشته و حزب لیکود او به بزرگ‌ترین حزب منفرد تبدیل شده است. با حضور پرشمار ۷۷ درصدی رأی‌دهندگان اسرائیلی در پای صندوق‌های رأی، به‌طور گسترده پیش‌بینی می‌شد که بن‌بستی پرماجرا شکل بگیرد. در نظام سیاسی چندپاره اسرائیل، نشانه‌ها حاکی از آن است که رقیب اصلی نتانیاهو، گادی آیزنکوت، رئیس پیشین ارتش، برای دستیابی به اکثریت پارلمانی بدون احزابی که از سوی اقلیت عرب اسرائیل رهبری می‌شوند، با دشواری روبه‌رو خواهد شد. بخشی از نتایج حاکی از آن است که این احزاب تعداد کرسی‌های رکوردشکن قبلی خود را حفظ کرده‌اند یا بر آن افزوده‌اند. در جریان کارزار انتخاباتی، بیشتر احزاب یهودی مخالف دولت متعهد شدند با فهرست‌های انتخاباتی عمدتا عرب همکاری نکنند و دلیل آن را نبود ارزش‌های مشترک عنوان کردند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. با این حال، اگر سایر گروه‌ها حاضر به همکاری با آن‌ها باشند، احزاب تحت رهبری اعراب اسرائیل می‌توانند به بازیگران تعیین‌کننده تبدیل شوند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/8c43/live/a1cef160-d3a3-11f1-a5cd-49637fcbd4e4.jpg", "category": "سینما و سریال", "tags": ["رویداد", "گزارش"], "datetime_fa": "۷ آبان • ۱۸:۰۱"}, {"source": "Iran International", "title": "پدر و مادرهایی که از موج مهاجرت ایرانیان جا مانده‌اند", "link": "https://www.iranintl.com/202610294270", "summary": "در حالی که شمار بیشتری از ایرانیان زندگی تازه‌ای را در خارج از کشور آغاز می‌کنند، بسیاری از پدر و مادرهایشان در ایران با پیامدی کمتر دیده‌شده از مهاجرت روبه‌رو هستند: دوری از فرزندان، روابط خانوادگی از پشت صفحه تلفن و نگرانی درباره اینکه در دوران سالمندی چه کسی کنارشان خواهد بود.", "date_str": "2026-10-29T13:58:46+00:00", "hash": "138f5cc990f18c96", "title_fa": "پدر و مادرهایی که از موج مهاجرت ایرانیان جا مانده‌اند", "summary_fa": "در حالی که شمار بیشتری از ایرانیان زندگی تازه‌ای را در خارج از کشور آغاز می‌کنند، بسیاری از پدر و مادرهایشان در ایران با پیامدی کمتر دیده‌شده از مهاجرت روبه‌رو هستند: دوری از فرزندان، روابط خانوادگی از پشت صفحه تلفن و نگرانی درباره اینکه در دوران سالمندی چه کسی کنارشان خواهد بود.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/31fe6f6bb411ede64e062b51504039afde465ff4-1536x1024.png?rect=0,109,1536,806&w=1200&h=630&q=66&fit=max&auto=format", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۷ آبان • ۱۷:۲۸"}],
      tech: [{"source": "NYT Tech", "title": "Polymarket and Kalshi Turn Midterm Elections Into a Multimillion Dollar Market", "link": "https://www.nytimes.com/2026/10/29/technology/polymarket-kalshi-midterm-election-betting-wagers.html", "summary": "Betting markets like Polymarket and Kalshi have transformed America’s democracy into a new kind of casino.", "date_str": "2026-10-29T14:59:25+00:00", "hash": "cb9ca918381d852f", "title_fa": "پلی مارکت و کالشی انتخابات میان دوره ای را به یک بازار چند میلیون دلاری تبدیل کردند", "summary_fa": "بازارهای شرط بندی مانند Polymarket و Kalshi دموکراسی آمریکا را به نوع جدیدی از کازینو تبدیل کرده اند.", "image_url": "", "category": "اقتصاد و بازرگانی", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۷ آبان • ۱۸:۲۹"}, {"source": "The Guardian AI", "title": "Reader Q&A: Send a question to Guardian economics columnist Aditya Chakrabortty", "link": "https://www.theguardian.com/community/live/2026/oct/29/reader-qa-aditya-chakrabortty-answers-your-questions", "summary": "Guardian columnist, senior economics commentator and host of the new Radical Thinking podcast Aditya Chakrabortty will be online at 2pm GMT (9am EDT) on Friday to answer your questions on the big ideas around economics, society and democracy Send your questions to conversations@theguardian.com or join the discussion on Friday from 8am Aditya Chakrabortty is the Guardian’s award-winning senior economics correspondent. Through his regular opinion column, he shares his thoughts on the economy and its impact on society and earlier this year he was awarded an MBE for services to public understanding of the economy and wider social issues. Last month he launched his new Saturday podcast Radical Thinking, where he interviews major thinkers about the ideas that have shaped our times. He has conducted conversations with Yanis Varoufakis on democracy and the Eurozone crisis and Naomi Klein and Astra Taylor on Gaza, fascism and climate chaos. Continue reading...", "date_str": "2026-10-29T15:31:25+00:00", "hash": "5c1ab6f278f09e28", "title_fa": "پرسش و پاسخ خواننده: سؤالی را به آدیتیا چاکرابورتی، ستون‌نویس اقتصاد گاردین بفرستید", "summary_fa": "ستون نویس گاردین، مفسر ارشد اقتصاد و مجری پادکست جدید تفکر رادیکال، آدیتیا چاکرابورتی در ساعت 2 بعدازظهر به وقت گرینویچ (9 صبح به وقت شرقی) روز جمعه آنلاین خواهد بود تا به سوالات شما در مورد ایده های بزرگ در مورد اقتصاد، جامعه و دموکراسی پاسخ دهد. خبرنگار او از طریق ستون نظرات منظم خود، افکار خود را در مورد اقتصاد و تأثیر آن بر جامعه به اشتراک می‌گذارد و اوایل امسال به دلیل خدمات به درک عمومی از اقتصاد و مسائل اجتماعی گسترده‌تر، مدرک MBE دریافت کرد. ماه گذشته او پادکست شنبه جدید خود را با نام Radical Thinking راه اندازی کرد، جایی که با متفکران اصلی درباره ایده هایی که زمان ما را شکل داده اند مصاحبه می کند. او با یانیس واروفاکیس در مورد دموکراسی و بحران منطقه یورو و نائومی کلاین و آسترا تیلور در مورد غزه، فاشیسم و ​​هرج و مرج آب و هوا گفتگو کرده است. به خواندن ادامه دهید... رویدادهای کلیدی 49 دقیقه پیش به گفتگو خوش آمدید رویدادهای کلیدی 49 دقیقه پیش به گفتگو خوش آمدید آدیتیا چاکرابورتی خبرنگار ارشد اقتصاد گاردین برنده جایزه است. او از طریق ستون نظرات منظم خود، افکار خود را در مورد اقتصاد و تأثیر آن بر جامعه به اشتراک می‌گذارد و اوایل امسال به دلیل خدمات به درک عمومی از اقتصاد و مسائل اجتماعی گسترده‌تر، مدرک MBE دریافت کرد. در آخرین قسمت خود، او با نمایشنامه نویس جیمز گراهام درباره سرنوشت و دموکراسی صحبت می کند که نشان می دهد الگوریتم های ما ما را به \"بحران عظیم جدید\" سوق داده اند و ما را از تصور آینده ای متفاوت باز می دارند. Aditya در ساعت 2 بعد از ظهر به وقت گرینویچ (9 صبح به وقت شرقی) روز جمعه آنلاین خواهد بود تا به سوالات شما در مورد اقتصاد، دموکراسی، آینده بریتانیا و سیاست", "image_url": "https://i.guim.co.uk/img/media/061bd00ab542b5868a6b8186c18270f69f6865c7/0_0_2000_1600/master/2000.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctbGl2ZS5wbmc&enable=upscale&s=58e3e7b744c31d373e275287e56a75bb", "category": "موسیقی و هنر", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۷ آبان • ۱۹:۰۱"}, {"source": "The Guardian AI", "title": "What is it like to work when your co-workers are AI agents?", "link": "https://www.theguardian.com/technology/2026/oct/29/ai-agent-coworker", "summary": "Using AI for roles from executive assistants to chiefs of staff, companies are boasting about doing more with less, creating tension with their human workers On an average workday, Dhruv Amin chats with dozens of colleagues to get things done at his AI startup Anything. He might ask Gwen, his executive assistant, to schedule a meeting, then troubleshoot a technical problem with Cody, his coding partner. Then he might check in with Betsy for search engine optimization, or Juno for onboarding customers. If the office runs out of snacks, he sends a Slack message to Justin, the office manager charged with stocking the kitchen. But none of these co-workers are people. They’re artificial intelligence agents, software that handles tasks without human intervention. Anything is one of several startups building them, and betting on a future where workplaces will increasingly turn over their sales, marketing, coding and other tasks to semi-autonomous AI. At Anything, there are 15 human employees and roughly 150 agents – a ratio that Amin believes will soon be the norm. Continue reading...", "date_str": "2026-10-29T15:00:46+00:00", "hash": "b2bfdfc45df6f5a4", "title_fa": "وقتی همکاران شما عامل هوش مصنوعی هستند، کار کردن چگونه است؟", "summary_fa": "با استفاده از هوش مصنوعی برای نقش‌هایی از دستیاران اجرایی تا روسای کارکنان، شرکت‌ها به انجام کارهای بیشتر با کمتر، ایجاد تنش با کارکنان انسانی خود افتخار می‌کنند. او ممکن است از گوئن، دستیار اجرایی خود، بخواهد که یک جلسه را برنامه ریزی کند، سپس یک مشکل فنی را با کودی، شریک برنامه نویسی اش عیب یابی کند. سپس او ممکن است با Betsy برای بهینه‌سازی موتور جستجو یا Juno برای مشتریان داخلی بررسی شود. اگر تنقلات در دفتر تمام شود، ا ns tech giants are pouring into the technology will be worth it. The company's big miss on search revenue also showed that AI might be taking a bite out of one of the company's biggest business segments. Metric Q3 results Expected Earnings per share $2.67 adjusted $3.02 adjusted Revenue $127.58 billion (+25% year-over-year) $128.22 billion Free cash flow -$9.07 billion -$2.70 billion Its free cash flow also turned negative for the first time ever, stoking investor jitters about how it will fund the AI buildout. On the capex front, spending was lower in the quarter than Wall Street expected, but it signaled a huge year of spending ahead in 2027, projecting over $300 billion in spending for the year. Alphabet shares are down 10% year-to-date. Read the original article on Business Insider", "date_str": "2026-10-29T15:11:52+00:00", "hash": "fcfd5b52e5341b83", "title_fa": "به زیر توجه کنید: سهام Alphabet به تازگی یک «صلیب مرگ» وحشتناک را به نمایش گذاشت", "summary_fa": "سهام آلفابت در روز پنج‌شنبه زمانی که سرمایه‌گذاران آخرین درآمدهای این شرکت را از دست دادند، سیگنال مرگ را به نمایش گذاشت. آلن جوکارد/خبرگزاری فرانسه از طریق گتی ایماژ سهام آلفابت به تازگی سیگنال ترسناک \"صلیب مرگ\" را به نمایش گذاشت. هنگامی که میانگین متحرک 50 روزه یک دارایی به زیر میانگین 200 روزه کاهش یابد، سیگنال فنی چشمک می زند. معمولاً قبل از کاهش بیشتر قیمت دارایی است. سرمایه گذاران مراقب باشند: سهام آلفابت روز پنجشنبه وارد قلمرو \"دث متقاطع\" شد. آلفابت سیگنال فنی ترسناکی را منتشر کرد که نشان می‌دهد میانگین متحرک 50 روزه یک دارایی به زیر میانگین متحرک 200 روزه رسیده است. اغلب پیش از نزولی بیشتر است، که خبر بدی برای آلفابت و تجارت فناوری به طور کلی خواهد بود. شرکت مادر گوگل که پس از گزارش تاسف بار سه ماهه سوم خود به سمت بدترین افت سهام یک روزه خود پیش رفت، میانگین متحرک 50 روزه خود را به 340.28 دلار رساند که کمتر از میانگین متحرک 200 روزه 340.93 دلاری بود. سهام حوالی ساعت 11 صبح به وقت شرقی 12 درصد کاهش یافت. آلفابت، چهارمین شرکت بزرگ جهان از نظر ارزش بازار، بازیگری حیاتی در رونق هوش مصنوعی است، اما els frozen. I know there are things I should be doing, but I can't organize them into a next step. If I'm overstimulated enough, I can barely formulate a cohesive thought. Sometimes the only thing that helps is going into my room , closing the door, and sitting in complete silence. I don't hide this from my kids. I let them see it on purpose. I spent most of my life not knowing my brain worked differently I was diagnosed with ADHD at 38. Until then, I genuinely didn't know other people's brains worked the way mine did. The best way I can describe my brain is that there are three musicals happening on three different stages at the same time. There are songs, conversations, ideas, and a constant stream of thoughts all competing for my attention. Do you have a hot take on a common parenting belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. From the outside , I looked highly functional. I was an A+ student. I worked hard. I got things done. I became an entrepreneur. Internally, I was exhausted to the point that it sometimes felt like an existential level. I remember hitting this same wall when I was around the same age as my sons. My parents didn't understand what was happening, and why would they? ADHD wasn't something anyone was considering for me. I wasn't physically hyperactive. All of the pinging was happening inside my head. So I learned to push through it and, eve", "date_str": "2026-10-29T14:54:01+00:00", "hash": "332daa43ebb5f8a6", "title_fa": "من به عنوان یک مادر مجرد مبتلا به ADHD، فرسودگی شغلی خود را از فرزندانم پنهان نمی کنم", "summary_fa": "نویسنده گفت که تا قبل از 30 سالگی تشخیص داده نشد که او مبتلا به ADHD است. با حسن نیت از عکاسی الکساندریا مونی از طریق اولیویا هاول. در 38 سالگی تشخیص داده شد که مبتلا به ADHD هستم. بیشتر عمرم را صرف پوشاندن چیزهایی کردم که نمی دانستم ADHD هستند. به جای اینکه وانمود کنم حالم خوب است، وقتی مغزم پر شده و باتریم تمام می شود به پسرانم می گویم. من به آنها یاد می ده  approach is. Every Halloween, I know exactly what's coming: two excited kids, costumes, a neighborhood full of candy , and by the end of the night, bags that seemingly weigh almost as much as they do. They look forward to trick-or-treating for months. Every year it's the same: despite my annual request that they wait until we get home to start eating their haul, more candy than I'd like gets eaten while we're still walking around the neighborhood . I'm a registered dietitian , but I'm also a mom. Halloween is supposed to be fun, the kind of event that becomes a core childhood memory. I want my kids to feel \"normal\" in the best sense of the word. I want them to run from house to house, trade candy, and enjoy the same traditions as their friends without feeling like they have different rules because their mom happens to be a dietitian. At the same time, I want them to understand balance. When we get home, they may each have a few more pieces. Then we dump everything out, and they choose about five favorite pieces to save for later. The rest goes to the Candy Fairy . My kids write letters to the Candy Fairy The Candy Fairy takes the extra candy and leaves a small toy in exchange. My kids even write her letters and put them in the mailbox. It turns getting rid of the excess into something fun instead of a punishment. The author s kids trade in the candy they don t want to the Candy Fairy for something else. Courtesy of the author They still get the excitement of collecting candy and choosing the pieces they really love, while having some control over what stays. I'm not deciding which candy they're allowed to keep or telling them what they should like. They get to decide which pieces are worth saving and which ones they're ready to give up. I get to avoid having a ridiculous amount of candy sitting in the house until Thanksgiving. My daughter may be starting to outgrow the tradition now, at 9 years old, but my son pro", "date_str": "2026-10-29T14:49:01+00:00", "hash" l Says Its AI Model ‘Le Chonk’ Has Leapfrogged China in the Open-Weight Race", "link": "https://www.wired.com/story/mistral-says-le-chonk-surpasses-chinese-models-cybersecurity/", "summary": "The French AI lab claims its latest release matches or outperforms even the best models from DeepSeek and Z.ai in coding and cybersecurity.", "date_str": "2026-10-29T14:00:00+00:00", "hash": "199faadb39b8d308", "title_fa": "میسترال می‌گوید مدل هوش مصنوعی «Le Chonk» چین را در مسابقات وزن آزاد شکست داده است.", "summary_fa": "آزمایشگاه هوش مصنوعی فرانسوی ادعا می‌کند که آخرین نسخه‌اش با بهترین مدل‌های DeepSeek و Z.ai در کدنویسی و امنیت سایبری همخوانی یا عملکرد بهتری دارد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان چند هفته پیش، شرکت فرانسوی Mistral نسخه اولیه مدل هوش مصنوعی جدید خود را با نام مستعار Le Chonk منتشر کرد. در آن زمان، این شرکت گفت که این پیشرفته ترین پیشنهاد وزن باز در خارج از چین است. پس از اصلاحات بیشتر، Mistral اکنون می گوید Le Chonk \"بهترین مدل وزن باز جهان\" برای کدنویسی خودکار و امنیت سایبری است. میسترال می‌گوید این پیشرفت‌ها با تامین مشکلات امنیتی سایبری و کدگذاری سخت‌تر این مدل امکان‌پذیر شد، که به Le Chonk با پارامتر تریلیون‌ها اجازه می‌داد تا با مدل‌های آزمایشگاه‌های برجسته چینی مانند DeepSeek و Z.ai مطابقت یا پیشی بگیرد. پیر استاک، معاون علمی Mistral در یک نشست خبری به خبرنگاران گفت: «این یک لحظه مهم در رقابت جهانی رهبری هوش مصنوعی است. این قابلیت‌های مرزی را برای شرکت‌ها و دولت‌ها ارائه می‌کند تا در برابر افزایش سطح تهدید در سایبری دفاع کنند.» نسخه نهایی Le Chonk اکنون به صورت رایگان برای همه در دسترس است. پس از انبوهی از حوادث امنیت سایبری مرتبط با هوش مصنوعی، Mistral ادعا می کند که برای غرب مهم است که مدل های وزن باز پیشرفته خود را داشته باشد. استوک گفت: \"شما هیچ تضمینی ندارید که [مدل های چینی] بدخواهانه رفتار نکنند. آنها می توانند ناقل تهدید باشند.\" پرمخاطب‌ترین قسمت زمانی رخ داد که یکی از مدل‌های OpenAI از یک جعبه آزمایشی خارج شد و در طول تابستان به چندین شرکت هک شد. این موضوع باعث ایجاد وحشت در مورد این ایده شد که هوش fore approving data centers. Shafkat Anowar/The Dallas Morning News via Getty Images Mark Cuban says data center developers are using healthcare-style contracts to confuse communities. He said healthcare contracts are \"so big and so long\" that insurers \"get to be contractual terrorists.\" Data centers, which are crucial for the AI boom, have become a hugely contentious issue across America. Healthcare has long used complex contracts that can obscure who pays for what. Mark Cuban says data center developers are using a similar playbook. \"A lot of communities have been really dumb with the deals they've negotiated for data centers,\" Cuban said on an episode of \"The A16z Show\" released on Wednesday. \"They've fallen for the contractual terrorism in a lot of cases.\" Cuban, who co-founded Cost Plus Drugs, a company that sells generic medicines at a transparent markup, previously coined the phrase \"contractual terrorism\" while discussing healthcare. On the A16z podcast, he said massive healthcare insurers and their subsidiaries use sprawling, opaque agreements to obscure costs and make it difficult for employers to know where their money is going. Cuban said those contracts are \"so big and so long\" that insurers \"get to be contractual terrorists\" — a formulation he also applied to communities' data center deals. His comments come as the data center boom has become a hugely contentious issue in communities across the US. Residents living near facilities have reported incessant low-frequency hums, diesel smells, intrusive lights, construction disruption, pressure on water and electricity supplies, and the loss of trees and open land. In Northern Virginia, the country's data center capital , local opposition has helped reshape elections, prompted lawsuits, and pushed residents to demand tighter noise and zoning rules. A University of Massachusetts Amherst poll of 1,000 Americans from September found that 65% opposed building an AI data center in their local community, including 49% who said they strongly opposed it. The ghost data center backlash The race to build AI infrastructure has also produced far more announcements than operating facilities. Aterio, which tracks projects through satellite imagery, permits, and other records, counted 8,268 announced US facilities as of October 20. But only 2,126 were active, and 861 were under construction. Thousands more had just been announced, leaving local governments to negot", "date_str": "2026-10-29T14:31:08+00:00", "hash": "baca405dba17acff", "title_fa": "مارک کوبان می گوید که جوامع در معاملات مراکز داده قربانی «تروریسم قراردادی» می شوند", "summary_fa": "مارک کوبان می گوید شهرها باید قبل از تایید مراکز داده از خود محافظت کنند. Shafkat Anowar/ اخبار صبح دالاس از طریق Getty Images مارک کوبان می گوید که توسعه دهندگان مراکز داده از قراردادهایی به سبک مراقبت های بهداشتی برای سردرگمی جوامع استفاده می کنند. او گفت که قراردادهای مراقبت های بهداشتی \"آنقدر بزرگ و طولانی هستند\" که بیمه ها \"تروریست های قراردادی\" می شوند. مراکز داده، که برای رونق هوش مصنوعی بسیار مهم هستند، به یک موضوع بسیار بحث برانگیز در سراسر آمریکا تبدیل شده اند. مراقبت‌های بهداشتی مدت‌هاست که از قراردادهای پیچیده استفاده می‌کند که می‌تواند مبهم باشد که چه کسی برای چه چیزی پرداخت می‌کند. مارک کوبان می گوید توسعه دهندگان مراکز داده از یک کتاب بازی مشابه استفاده می کنند. کوبان در یکی از اپیزودهای \"The A16z Show\" که روز چهارشنبه منتشر شد، گفت: \"بسیاری از جوامع نسبت به معاملاتی که برای مراکز داده مذاکره کرده اند، واقعا احمق شده اند.\" آنها در بسیاری از موارد گرفتار تروریسم قراردادی شده اند.» کوبان که یکی از بنیانگذاران Cost Plus Drugs است، شرکتی که داروهای ژنریک را با یک نشانه شفاف می فروشد، قبلاً در هنگام بحث در مورد مراقبت های بهداشتی عبارت \"تروریسم قراردادی\" را ابداع کرد. در پادکست A16z، او گفت که بیمه‌گران عظیم مراقبت‌های بهداشتی و شرکت‌های تابعه آن‌ها از توافق‌نامه‌های گسترده و مبهم برای پنهان کردن هزینه‌ها استفاده می‌کنند و کارفرمایان را دشوار می‌سازند که بدانند پولشان به کجا می‌رود. کوبان گفت این قراردادها آنقدر بزرگ و طولانی هستند که بیمه‌گران «تروریست‌های قراردادی می‌شوند» - فرمولی که او در معاملات مراکز داده جوامع نیز به کار برد. اظهارات او در حالی مطرح می شود که رونق مرکز داده به یک موضوع بسیار بحث برانگیز در جوامع سراسر ایالات متحده تبدیل شده است. ساکنانی که در نزدیکی تأسیسات زندگی می کنند، صدای زمزمه های", "image_url": "https://i.insider.com/6ae329c5ca24d51c5f8a0236?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۷ آبان • ۱۸:۰۱"}, {"source": "Business Insider", "title": "I spent 53 hours in a 50-square-foot Amtrak bedroom with a full bathroom. I'd gladly pay $2,200 for it again.", "link": "https://www.businessinsider.com/amtrak-california-zephyr-bedroom-tour-2026-10", "summary": "Business Insider s reporter spent 53 hours on Amtrak s California Zephyr train in a bedroom accommodation. Joey Hadden/Business Insider A couch, a seat, a table, two beds, a full bathroom, a window, and a sliding door. My home for the longest train ride in the US was basically a hotel room in motion. It wasn't cheap, but I don't regret splurging on an Amtrak bedroom. I wasn't about to sacrifice comfort to save a few bucks. Not when booking the longest train ride in the US. Most people use trains to get from one place to another. But in February, Amtrak's California Zephyr was my destination. I wanted to thoroughly enjoy the 53-hour journey from snowy Chicago to sunny Emeryville, California. That's why I spent $2,200 on a bedroom accommodation, a private cabin with a full bathroom. While I was excited to stay in the tiny, moving hotel room, I wondered whether I'd regret spending so much. In the end, I was sure I had made the right choice for such a long journey. Here's a look inside the 50-square-foot bedroom. My bedroom was on the second level of an Amtrak Superliner train. Joey Hadden/Business Insider The California Zephyr is an Amtrak Superliner — a two-story train with coach seating , bedrooms, roomettes (a private cabin that's about half the size of a bedroom), a dining car, and a lounge car. There are also larger, family-sized bedrooms and accessible bedrooms. I'd ridden the California Zephyr a year earlier, but I took a shorter trip in a roomette. This was my first time riding the entire route from Chicago to California. It was also my first time booking a bedroom on an Amtrak Superliner. The 50-square-foot enclosed space packed in two bunks, a couch, a single seat, and a full bathroom. Joey Hadden/Business Insider The couch folded out to form the bottom bunk, and the top bunk pulled down from the ceiling. The Amtrak bedroom sleeps up to two passengers, though I traveled solo. The booking also included some perks. Sleeper-car ticket holders get a first-class attendant, priority boarding, lounge access at some stations, and complimentary meals on board. When I first boarded the train, there were no bunks in sight. Joey Hadden/Business Insider During the day, the lower bunk was set up as a couch, and the upper bunk was folded up. A single seat faced the couch with a pullout table in between. There was a pullout table between the seats that I used for working and eating. Joey Hadden/Business Insider The table also had two foldout leaves for more space. ", "date_str": "2026-10-29T14:27:23+00:00", "hash": "6b919e023728a3f1", "title_fa": "من 53 ساعت را در یک اتاق خواب 50 فوت مربعی Amtrak با حمام کامل گذراندم. من با کمال میل دوباره برای آن 2200 دلار پرداخت می کنم.", "summary_fa": "خبرنگار Business Insider 53 ساعت را در قطار کالیفرنیا زفیر Amtrak در یک اتاق خواب گذراند. Joey Hadden/Business Insider یک کاناپه، یک صندلی، یک میز، دو تخت، یک حمام کامل، یک پنجره، و یک در کشویی. خانه من برای طولانی ترین سفر قطار در ایالات متحده اساساً یک اتاق هتل در حال حرکت بود. ارزان نبود، اما پشیمان نیستم که در اتاق خواب آمتراک ولخرجی کردم. من قصد نداشتم راحتی را فدای چند دلار پس انداز کنم. نه هنگام رزرو طولانی ترین سفر قطار در ایالات متحده. اکثر مردم برای رفتن از یک مکان به مکان دیگر از قطار استفاده می کنند. اما در ماه e debt relief they're owed, a new lawsuit said. On Wednesday, advocacy group Student Defense filed a class-action lawsuit on behalf of Kendrick Gaussoin, a borrower who took out student loans to attend the Brooks Institute. The visual arts college shut down in 2016 due to financial distress and new regulation on for-profit colleges; Gaussoin was left with student debt but no degree. A mechanism called a \"closed school discharge\" allows borrowers whose schools shut down to receive debt relief. A January 2025 decision under the Biden administration expanded the timeframe for relief, allowing more borrowers to qualify. The lawsuit said the department has not been adhering to the timeframe extension. \"The Department cannot make promises to students and then pretend that those promises do not exist,\" said Alexander Elson, vice president of Student Defense, in a statement. \"Thousands of borrowers are entitled to discharges under the Department's 2025 Decision, and we are going to court to make sure they receive them.\" The Education Department did not immediately respond to a request for comment from Business Insider. The lawsuit said that despite qualifying for relief, Gaussoin and other affected borrowers have been required to keep paying down their balances. Those who do not or cannot repay face the consequences of default , including wage garnishment and the seizure of federal benefits, such as Social Security. Beyond closed school discharges, the Trump administration has faced a range of lawsuits over stalled debt relief. For example, advocacy groups have been pushing for the department to process relief for defrauded borrowers , in addition to those who received lower payments under a Biden-era repayment plan. The department has previously denied wrongdoing in the cases. Gaussoin, the plaintiff in the recent closed-school lawsuit, said he's struggling with \"tens of thousands of dollars of debt and no degree.\" \"When the Department expanded relief for Brooks s tetime_fa": "۷ آبان • ۱۷:۵۵"}, {"source": "Business Insider", "title": "A market veteran says there are 3 reasons to stay calm amid earnings angst and AI jitters", "link": "https://www.businessinsider.com/ai-trade-alphabet-earnings-capex-msft-ed-yardeni-2026-10", "summary": "Edward Yardeni, president and chief investment strategist at Yardeni Research Inc., speaks during a panel discussion. Ramin Talaie/Bloomberg via Getty Images Markets are feeling less upbeat about the AI trade lately. Spending concerns and fears over rising rates and the economics of AI are brewing. But market veteran Ed Yardeni says investors have three reasons to stay bullish. The AI trade has been rattled in the last month, with Alphabet 's dismal third-quarter results on Wednesday that latest source of angst for investors. But market veteran Ed Yardeni says investors should think about three things to quell their anxiety. Investors are increasingly questioning whether massive AI spending will yield the results they want to see. Microsoft's decision to scale back its AI capex forecast likely isn't helping soothe fears that AI isn't paying off, and capex questions continue to swirl around the other big hypercalers, but Yardeni says that the good news still outweighs the bad. Here are three positive signs he's keeping tabs on. Spending remains robust While Microsoft dialed back its capex forecast for the year, Yardeni sees significant spending from other tech leaders. He highlighted the collective $235 billion AI financing figure that this week brought as a reason the sector is likely to keep growing. This number included $100 billion that Anthropic could raise from its IPO, as well as also $95 billion that Meta is anticipating to raise via new stock sales, and Elon Musk's move to have SpaceX borrow $40 billion to purchase new GPUs. AI economics are encouraging Yardeni's view of AI economics is centered on Anthropic, and he sees several reasons the AI lab's success should indicate to investors that AI compute demand is both strong, and sustainable. \"First, H1 revenues surged from $1.2 billion to $16.3 billion y/y,\" he listed. \"Second, operating losses narrowed from $2.1 billion to $693 million, with Q2 marking its first quarterly operating profit. Third, 11,900 customers now spend at least $100,000 annually, up from roughly 950 a year earlier. Fourth, revenue per dollar of compute expense increased more than fivefold to $2.08.\" Chip earnings have been strong Yardeni also said he believes infrastructure demand will remain strong, as evidenced by Sk Hynix 's Q3 earnings smash that sent chip stocks higher on Wednesday. \"Management expects memory shortages through 2030, with production effectively sold out through 2029, suggesting durable demand and pricing po", "date_str": "2026-10-29T14:08:01+00:00", "hash": "77e4a42f172fc404", "title_fa": "یک کهنه‌کار بازار می‌گوید 3 دلیل برای آرام ماندن در میان نگرانی‌های درآمدی و اختلالات هوش مصنوعی وجود دارد", "summary_fa": "ادوارد یاردنی، رئیس و استراتژیست ارشد سرمایه‌گذاری در شرکت تحقیقاتی یاردنی، طی یک میزگرد سخنرانی می‌کند. رامین طلایی/ بلومبرگ از طریق Getty Images Markets اخیراً نسبت به تجارت هوش مصنوعی احساس خوش‌بینی کمتری دارند. نگرانی‌ها و نگرانی‌ها در مورد افزایش نرخ‌ها و اقتصاد هوش مصنوعی در حال ایجاد است. اما اد یاردنی کهنه کار بازار می گوید سرمایه گذاران سه دلیل برای صعودی ماندن دارند. تجارت هوش مصنوعی در ماه گذشته متلاطم شده است، به طوری که نتایج تاسف بار سه ماهه سوم آلفابت در روز چهارشنبه، آخرین منبع اضطراب برای سرمایه گذاران بود. اما اد یاردنی کهنه کار بازار می گوید سرمایه گذاران برای فرونشاندن اضطراب خود باید به سه چیز فکر کنند. سرمایه گذاران به طور فزاینده ای این سوال را مطرح می کنند که آیا هزینه های هنگفت هوش مصنوعی نتایجی را که می خواهند ببینند به همراه خواهد داشت یا خیر. تصمیم مایکروسافت برای کاهش پیش‌بینی سرمایه هوش مصنوعی خود احتمالاً به کاهش ترس از نتیجه ندادن هوش مصنوعی کمکی نمی‌کند، و پرسش‌های مربوط به سرمایه‌گذاری همچنان در اطراف دیگر هایپرکالرهای بزرگ می‌چرخند، اما یاردنی می‌گوید که اخبار خوب همچنان بیشتر از بد است. در اینجا سه ​​نشانه مثبت او وجود دارد. مخارج همچنان قوی است در حالی که مایکروسافت پیش بینی سرمایه خود را برای سال عقب نشینی کرده است، یاردنی شاهد هزینه های قابل توجهی از سوی دیگر رهبران فناوری است. او رقم جمعی 235 میلیارد دلاری تامین مالی هوش مصنوعی را که این هفته دلیلی برای ادامه رشد این بخش بود، برجسته کرد. این رقم شامل 100 میلیارد دلار است که Anthropic می‌تواند از IPO خود به دست آورد، همچنین 95 میلیارد دلاری که متا پیش‌بینی می‌کند از طریق فروش سهام جدید به دست آورد، و اقدام ایلان ماسک برای وام گرفتن 40 میلیارد دلار از SpaceX برای خرید پردازنده‌های گرافیکی جدید است.", "image_url": "https://i.insider.com/6ae348733139f3982e740a5e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Meta", "Microsoft"], "datetime_fa": "۷ آبان • ۱۷:۳۸"}, {"source": "Business Insider", "title": "I'm a 72-year-old grandfather and spent $60,000 on a facelift and other cosmetic procedures. People now think I'm in my 50s.", "link": "https://www.businessinsider.com/older-man-plastic-surgery-facelift-no-stigma-2026-10", "summary": "Ariel Grunberg before and after having plastic surgery. Courtesy of Dr. John Layliev Ariel Grunberg was unhappy with his appearance at 72 and decided to do something about it. He opted for plastic surgery, including a facelift, a lower blepharoplasty, and a neck lift. The grandad is pleased with the results, and said some people think he's in his fifties. This story is based on an interview with Ariel Grunberg, 72, a semi-retired real estate owner and manager from New York City . It has been edited for length and clarity. My eyes bothered me the most as I got older. I always felt they were drooping too much, and if I didn't do anything about them, they would cover my vision . One of the turning points was attending a presentation when the speaker had eyes similar to mine and peered upward in an exaggerated way. Have you undergone cosmetic surgery as a man? Please email Jane Ridley at jridley@insider.com if you'd like to share your story with Business Insider. I remember thinking, \"Why doesn't he get them fixed?\" Sure enough, when I saw him again, I noticed that he'd had his eyelids lifted. You could see a lot more of his eyes, and he no longer had that mannerism of looking up. Grunberg, pictured before his surgery, felt particularly self-conscious about his eyes and neck. Courtesy of Ariel Grunberg In February 2026, I consulted the New York cosmetic surgeon, Dr. John Layliev , who came highly recommended, to discuss my options. He suggested eye surgery and a brow lift. As we got talking, I mentioned how much I didn't like my turkey neck, which made me think about my age. People had remarked about how young and fit I looked — I did triathlons, including a half IronMan — but I was still self-conscious. The total cost was around $60K In the end, we settled on a deep plane facelift , neck lift, brow lift, lower blepharoplasty procedure , facial fat grafting, and fat-based liquid rhinoplasty. I thought that, if I were under anesthesia anyway, I might as well get more than my eyes and brow done. The total cost was around $60,000. My girlfriend was supportive, but I only told my two daughters about two weeks beforehand. I suspected they'd say I didn't need it, but they said it was up to me. Grunberg, pictured after his surgery, which included a deep plane facelift, is pleased with the results. Courtesy of Ariel Grunberg I'm not the nervous type, so I wasn't worried ahead of the operation on July 31. It took around eight hours, and I stayed in the hospital overnig", "date_str": "2026-10-29T13:41:10+00:00", "hash": "24858e0cc636c9dd", "title_fa": "من یک پدربزرگ 72 ساله هستم و 60000 دلار برای لیفت صورت و سایر عمل های زیبایی خرج کردم. مردم اکنون فکر می کنند من در دهه 50 هستم.", "summary_fa": "آریل گرونبرگ قبل و بعد از جراحی پلاستیک. با حسن نیت دکتر جان لیلیف، آریل گرونبرگ از ظاهرش در 72 سالگی ناراضی بود و تصمیم گرفت برای این موضوع کاری انجام دهد. او جراحی پلاستیک شام
