در نحوه عملکرد یک شرکت فاصله وجود دارد. او گفت: «این پلاگین و بازی نیست. او گفت که انتظار دارد سهم رهبرانی که گزارش می دهند که نمایندگان در حال تغییر کسب و کار خود هستند طی شش تا 12 ماه آینده افزایش یابد. بیشتر انتظار دارند که تعداد کارها افزایش یابد. ترکیب هوش مصنوعی همچنین در حال تغییر شکل نیاز شرکت ها از کارگران است. این نظرسنجی نشان داد که مدیران عامل این فناوری را"}, {"source": "Business Insider", "title": "Photos show how classrooms have changed for millennials, Gen Z, and Gen Alpha", "link": "https://www.businessinsider.com/photos-how-classrooms-evolved-over-generations-millenials-gen-z-2026-10", "summary": "Two students use Smart Board technology on December 10, 2010. John Carl D Annibale /Albany Times Union via Getty Images US classrooms have changed dramatically since the early 2000s. They've changed through technology, mainly from computers and tablets to social media and AI. Photos show how Millennials, Gen Z, and Gen Alpha all grew up in vastly different classrooms. Much like the rest of the world, US classrooms have changed quite a bit since the beginning of the 21st century. The onslaught of technological advancement , from the internet and computers to AI, has brought the biggest changes to US education, but societal changes have, too. The rise of social media in the early 2010s changed how students interact with each other, and an uptick in school shootings in the mid-to-late 2010s called for heightened security systems across various school districts. Add in a pandemic at the beginning of the 2020s, and classrooms were nearly unrecognizable from what they looked like in the early 2000s. Three different generations — millennials , Gen Z , and Gen Alpha — have been at the forefront of these changes. Those born between 1981 and 1996 are defined as millennials, according to research from the University of Southern California , while people born between 1997 and 2012 are considered Gen Z, and those born between 2013 and 2025 are defined as Gen Alpha. Here's how US classrooms have evolved alongside each of those generations. Chalkboards were still used in classrooms in 2000, but they all largely disappeared by 2010. Connie David, who is blind, teaches third grade at Wenonah Elementary School in Minneapolis. -- Minneapolis, Mn., Mon., May 22, 2000--(Left to right) Raphael Kelly (far left) and Kevin Rambacchus watch and listen as Sandy Pierce writes on the blackboard and Connie David discusses the differences between cities, towns and rural areas with the class. Pierce and David team teach the class.(Photo By JOEY MCLEISTER/Star Tribune via Getty Images) JOEY MCLEISTER/Star Tribune via Getty Images Chalkboards, invented in 1801 by Scottish geography teacher James Pillans, had been a classroom staple since the early 20th century. The boards themselves went green in the 1960s to help reduce the glare from classroom lights bouncing off black surfaces and into students' eyes. Whiteboards began replacing chalkboards in classrooms in the 1980s, in part because chalk dust can irritate the lungs of students and teachers with asthma. By 2010, chalkboards had become ", "date_str": "2026-10-15T09:42:01+00:00", "hash": "a8e84acaa0d63ec3", "title_fa": "عکس‌ها نشان می‌دهند که چگونه کلاس‌های درس برای نسل هزاره، ژنرال Z و ژنرال آلفا تغییر کرده است", "summary_fa": "دو دانش آموز در 10 دسامبر 2010 از فناوری تخته هوشمند استفاده می کنند. جان کارل دی آنیبال / اتحادیه آلبانی تایمز از طریق گتی ایماژ کلاس های درس ایالات متحده از اوایل دهه 2000 به طرز چشمگیری تغییر کرده است. آنها از طریق فناوری، عمدتاً از رایانه ها و تبلت ها گرفته تا رسانه های اجتماعی و هوش مصنوعی، تغییر کرده اند. عکس‌ها نشان می‌دهند که چگونه Millennials، Gen Z و Gen Alpha همه در کلاس‌های بسیار متفاوت بزرگ شدند. مانند سایر نقاط جهان، کلاس های درس ایالات متحده از ابتدای قرن بیست و یکم تا حد زیادی تغییر کرده است. هجوم پیشرفت تکنولوژی، از اینترنت و کامپیوتر گرفته تا هوش مصنوعی، بزرگترین تغییرات را در آموزش و پرورش ایالات متحده به ارمغان آورده است، اما تغییرات اجتماعی نیز چنین بوده است. ظهور رسانه های اجتماعی در اوایل دهه 2010 نحوه تعامل دانش آموزان با یکدیگر را تغییر داد و افزایش تیراندازی در مدارس در اواسط تا اواخر دهه 2010 خواستار افزایش سیستم های امنیتی در مناطق مختلف مدارس شد. به یک بیماری همه گیر در آغاز دهه 2020 اضافه کنید، و کلاس های درس تقریباً از آنچه در اوایل دهه 2000 به نظر می رسید غیرقابل تشخیص بودند. سه نسل مختلف - هزاره ها، ژن Z و ژن آلفا - در خط مقدم این تغییرات بوده اند. طبق تحقیقات دانشگاه کالیفرنیای جنوبی، متولدین بین سال‌های 1981 و 1996 به عنوان نسل هزاره تعریف می‌شوند، در حالی که متولدین سال‌های 1997 تا 2012 ژن Z و متولدین بین 2013 و 2025 به عنوان ژن آلفا تعریف می‌شوند. در اینجا نحوه تکامل کلاس های درس ایالات متحده در کنار هر یک از آن نسل ها آمده است. تخته‌های گچی هنوز در سال 2000 در کلاس‌های درس استفاده می‌شد، اما تا سال 2010 همه آنها تا حد زیادی ناپدید شدند. کانی"}, {"source": "Business Insider", "title": "Welcome back from leave. Your job is completely different.", "link": "https://www.businessinsider.com/leave-from-work-ai-changed-your-job-tech-advances-2026-10", "summary": "Getty Images; Alyssa Powell/BI Ashley Wallace returned to her job after six months of maternity leave and met a new coworker: Claude . Before her leave, Wallace used ChatGPT to answer questions and some basic automations for notetaking or recruiting in her role as head of talent at the AI language-learning app Praktika. \"I came back thinking, oh, I'll ease myself in,\" she says. \"It definitely isn't the case in the landscape that I came back to.\" During her absence, the company had ushered in Claude Cowork — and Wallace didn't even know where to find the new system everyone was talking about on her computer. Add to her new reality that AI has rocked the job hunt process . Instead of the typical few hundred people applying for open roles at the startup, Wallace returned to find more than 1 ,000 vying for some jobs . Candidates sometimes come to interviews unable to answer a single question after she suspects they padded their applications with AI, forcing Wallace to come up with new ways to weed out unqualified applicants earlier. In the few months that she had been away with her baby, AI had made the job she knew foreign to her. \"Ever seen someone give someone a mobile phone that's never had a mobile phone before?\" Wallace says. \"That's like how I felt when I came back.\" A leave of absence from work often results in a frenzied email inbox and missed office gossip, but, as companies unleash AI into every corner of their business, some people now return to a job they don't recognize. There are new enterprise systems, workflows, and AI sprint experiments that rise and fall — all under the shadow of the threat that AI will end up taking your job anyway. In a world of constant AI updates, going out of the office, even for a few weeks, can feel like moving toward obsolescence. Nearly half of workers say their companies have adopted AI, up from 38% last fall, according to a Gallup poll published in July. Forty percent of workers at large companies said in a McKinsey survey this spring that their firms are scaling their use of agents, up from 27% last year. PwC found a massive spike in workers saying they have used AI : 64% this year, growing 10% year-over-year. At the same time, America's workforce has the widest access to paid leave it's ever known, thanks to a spike in state-mandated family leave over the last two decades and changes to company policies to extend family leave or add paid sabbaticals. As the pace of change in white-collar work accelerates at worl", "date_str": "2026-10-15T09:39:01+00:00", "hash": "598c7b1cce2f8f0b", "title_fa": "از مرخصی برگشتی خوش آمدی شغل شما کاملا متفاوت است.", "summary_fa": "گتی ایماژ; آلیسا پاول/بی‌آی اشلی والاس پس از شش ماه مرخصی زایمان به کار خود بازگشت و با یک همکار جدید آشنا شد: کلود. قبل از ترک، والاس از ChatGPT برای پاسخ دادن به سوالات و برخی از اتوماسیون های اساسی برای یادداشت برداری یا استخدام در نقش خود به عنوان سرپرست استعداد در برنامه یادگیری زبان هوش مصنوعی Praktika استفاده کرد. او می گوید: «به این فکر کردم که اوه، خودم را راحت می کنم. قطعاً در منظره‌ای که من به آن برگشتم اینطور نیست.» در طول غیبت او، شرکت کلود کوورک را راه‌اندازی کرده بود - و والاس حتی نمی‌دانست سیستم جدیدی را که همه درباره آن صحبت می‌کردند کجا پیدا کند. به واقعیت جدید او اضافه کنید که هوش مصنوعی روند کاریابی را تکان داده است. به جای چند صد نفر معمولی که برای نقش‌های آزاد در استارت‌آپ درخواست می‌کردند، والاس برگشت و بیش از 1000 نفر را پیدا کرد که برای برخی مشاغل رقابت می‌کردند. نامزدها گاهی اوقات به مصاحبه می آیند که نمی توانند به یک سؤال پاسخ دهند، زیرا او مشکوک است که برنامه های خود را با هوش مصنوعی تکمیل کرده اند و والاس را مجبور می کند تا راه های جدیدی برای حذف زودتر متقاضیان فاقد صلاحیت ارائه دهد. در چند ماهی که او با نوزادش دور بود، هوش مصنوعی شغلی را که می دانست برایش بیگانه کرده بود. \"تا به حال دیده اید که شخصی به کسی تلفن همراهی بدهد که قبلاً تلفن همراه نداشته است؟\" والاس می گوید. وقتی برگشتم این احساس را داشتم.» مرخصی از محل کار اغلب منجر به یک صندوق پست الکترونیکی دیوانه‌وار و از دست دادن شایعات اداری می‌شود، اما از آنجایی که شرکت‌ها هوش مصنوعی را در هر گوشه‌ای از کسب‌وکار خود رها می‌کنند، برخی از افراد اکنون به شغلی بازمی‌گردند که نمی‌شناسند. سیستم‌های جدید"}, {"source": "Business Insider", "title": "Buyers are shopping for cheaper cars. New-car prices are still near a record.", "link": "https://www.businessinsider.com/car-prices-buyers-cheap-cars-prices-2026-10", "summary": "New vehicle prices are just $52 away from a fresh record high. FREDERIC J. BROWN/AFP via Getty Images Shoppers are turning to smaller cars as gas and vehicle prices keep climbing. They're even willing to try out new car brands, Cox Automotive found. Still, car prices keep climbing and are nearing an all-time record. There's a tension playing out on American car dealership lots: Shoppers want cheap cars , but prices keep going up and up. That's what Cox Automotive found in its September numbers. Last month, the average new car transaction price was $50,562, a nearly 1% rise from the month before, and just $52 below a record high, the data firm found. The average price is up 0.7% from a year ago. At the same time, buyers are gravitating away from full-size segments toward more affordable options. \"Customers continue to show us that they're willing to adapt by either going to smaller vehicles, like sedans, or smaller-sized SUVs,\" Erin Keating, Cox Auto's executive analyst , told Business Insider. She said shoppers are also willing to switch brands to make their finances work. That flexibility has helped restrain the industrywide average price, Keating said — but now, smaller vehicles are increasing the numbers on their window stickers. The average price of a compact car rose 3.2% year over year in September, to $27,977, while subcompact SUVs rose 1.5%, to $31,213. Four of the five highest-volume new-vehicle segments posted price gains above the industry average. Only compact SUVs saw a small dip compared to September 2025. Their prices were down 0.4% to $37,614. It's important to keep those prices in context with the greater economy, Keating added. On Wednesday, the Bureau of Labor Statistics found that overall inflation accelerated by 3.7% in September. \"The rate of inflation on a vehicle is so far below the standard rate of inflation in the country,\" she said. \"Going up by 1% or 2% really is still way below historical norms.\" September's numbers still show that the industry is struggling to let go of 2026 . Next-model-year vehicles accounted for 22.4% of available inventory at the end of September. That's up from 12.4% in August, according to a Cox Automotive analysis, but it's still far below last year's changeover. By the end of September 2025, 38.6% of all new vehicles waiting on lots were 2026 model years. Keating said this year's slower rollout means fewer updated (and often repriced) models have reached new-vehicle dealerships. She predicts that avera", "date_str": "2026-10-15T09:37:01+00:00", "hash": "ce41f60a0c8bb425", "title_fa": "خریداران به دنبال خودروهای ارزان‌تر هستند. قیمت خودروهای جدید همچنان نزدیک به یک رکورد است.", "summary_fa": "قیمت خودروهای جدید تنها 52 دلار با رکورد جدید فاصله دارد. FREDERIC J. BROWN/AFP از طریق Getty Images با افزایش قیمت بنزین و خودرو، خریداران به خودروهای کوچکتر روی می آورند. Cox Automotive دریافت که آنها حتی مایلند مارک های جدید خودرو را امتحان کنند. با این حال، قیمت خودرو همچنان در حال افزایش است و به رکورد بی سابقه ای نزدیک می شود. یک تنش در بسیاری از نمایندگی‌های خودرو در آمریکا وجود دارد: خریداران خودروهای ارزان قیمت می‌خواهند، اما قیمت‌ها همچنان بالا و بالاتر می‌رود. این چیزی است که Cox Automotive در اعداد ماه سپتامبر خود پیدا کرد. این شرکت داده دریافت که در ماه گذشته، میانگین قیمت تراکنش خودروهای جدید 50562 دلار بود که تقریباً 1 درصد نسبت به ماه قبل افزایش داشت و تنها 52 دلار کمتر از بالاترین رکورد بود. میانگین قیمت نسبت به سال گذشته 0.7 درصد افزایش یافته است. در عین حال، خریداران از بخش‌های سایز کامل به سمت گزینه‌های مقرون به صرفه‌تر می‌روند. ارین کیتینگ، تحلیلگر اجرایی Cox Auto، به Business Insider گفت: «مشتریان همچنان به ما نشان می‌دهند که با رفتن به وسایل نقلیه کوچک‌تر، مانند سدان‌ها یا SUV‌های سایز کوچک‌تر، مایلند خود را تطبیق دهند. او گفت که خریداران همچنین مایل به تغییر نام تجاری هستند تا بتوانند امور مالی خود را بهبود بخشند. کیتینگ گفت که این انعطاف‌پذیری به کاهش میانگین قیمت در صنعت کمک کرده است - اما اکنون، وسایل نقلیه کوچک‌تر تعداد برچسب‌های پنجره خود را افزایش می‌دهند. میانگین قیمت یک خودروی کامپکت در ماه سپتامبر سالانه 3.2 درصد افزایش یافت و به 27977 دلار رسید، در حالی که شاسی بلندهای ساب کامپکت با 1.5 درصد افزایش به 31213 دلار رسید. چهار بخش از پنج بخش خودروهای جدید با بیشترین حجم افزایش قیمت بالاتر از میانگین صنعت را ثبت کردند. فقط شاسی بلندهای کامپکت در مقایسه با"}, {"source": "Business Insider", "title": "I tried Meta's Muse AI agent for 3 days — then it sent me a strange message that made me want to delete the app completely", "link": "https://www.businessinsider.com/stopped-using-meta-muse-after-strange-message-from-ai-agent-2026-10", "summary": "Ugo Nwune stopped using Meta s Muse AI agent after receiving a strange message from the agent. Courtesy of Ugo Nwune Ugo Nwune, a Houston-based developer, stopped using Meta's Muse after a strange message incident. Nwune said it seemed as though the AI agent wanted to access his email without being prompted to. He said his trust in AI agents, like Muse, was shaken after the incident. This as-told-to essay is based on a conversation with Ugo Nwune, a 37-year-old software developer based in Houston. His words have been edited for length and clarity. I downloaded Meta's Muse about four weeks ago. I stopped using it three days later. Before using Muse, I considered trying other AI agents, like OpenClaw and Hermes, but I didn't feel I had enough cybersecurity knowledge to be confident using open-source agents . When Muse came out, I saw it was a simple app on the App Store. I also felt good about the security since it was coming from a trillion-dollar company like Meta. I decided to give it a shot. I used it once. Then a few days later, the agent sent me an unexpected message. The whole thing really shook me. I was excited to use Muse I'm a software developer, and I use AI often. My favorite AI model is Claude Opus 5.5, and I'm currently building an AI digital legacy platform called EchoVault to help people connect with their loved ones, even after they're gone. The idea of Meta's Muse agent helping me run around and do my bidding was very appealing. When I first downloaded Muse, I didn't give it any additional permissions on my device besides permission to access my Facebook, Threads, and Instagram accounts. I never connected it to control anything external, like my email or phone number. I also only downloaded the app on my phone because I heard something about potential issues on a Mac . The first task I used it for was to help me reach out to a prospective investor. I was just giving it context and then sending the messages myself. After that, I didn't use Muse for another two days. My Muse agent started acting strange Three days after downloading Muse, I hopped out of the shower, and I saw a random message pop up from the app. The message was from my Muse agent , saying, \"I can't check your email right now — Gmail isn't connected on my end, so I have no way to look for that Anthropic message.\" I was so confused because I hadn't asked for the agent to check my mailbox or messaged it in two days. I thought my email might've been hacked. I went back and forth", "date_str": "2026-10-15T09:26:01+00:00", "hash": "6024afae7c6da334", "title_fa": "من عامل هوش مصنوعی Meta's Muse را به مدت 3 روز امتحان کردم - سپس پیام عجیبی برای من ارسال کرد که باعث شد بخواهم برنامه را به طور کامل حذف کنم.", "summary_fa": "Ugo Nwune پس از دریافت پیامی عجیب از طرف عامل، استفاده از عامل هوش مصنوعی Meta s Muse را متوقف کرد. با حسن نیت از Ugo Nwune Ugo Nwune، یک توسعه دهنده مستقر در هیوستون، پس از یک پیام عجیب، استفاده از Meta's Muse را متوقف کرد. Nwune گفت که به نظر می رسد عامل هوش مصنوعی می خواهد بدون اینکه از او خواسته شود به ایمیل او دسترسی پیدا کند. او گفت که اعتمادش به عوامل هوش مصنوعی مانند Muse پس از این حادثه متزلزل شد. این مقاله گفته شده بر اساس گفتگو با Ugo Nwune، یک توسعه دهنده نرم افزار 37 ساله مستقر در هیوستون است. کلمات او برای طولانی و وضوح ویرایش شده است. من حدود چهار هفته پیش Meta's Muse را دانلود کردم. سه روز بعد استفاده نکردم. قبل از استفاده از Muse، در نظر داشتم عوامل هوش مصنوعی دیگری مانند OpenClaw و Hermes را امتحان کنم، اما احساس نمی‌کردم که دانش امنیت سایبری کافی برای استفاده از عوامل منبع باز را داشته باشم. وقتی Muse بیرون آمد، دیدم این یک برنامه ساده در اپ استور است. من همچنین احساس خوبی در مورد امنیت داشتم زیرا از یک شرکت تریلیون دلاری مانند متا می آمد. تصمیم گرفتم به آن ضربه بزنم. من یکبار استفاده کردم سپس چند روز بعد، نماینده یک پیام غیرمنتظره برای من فرستاد. همه چیز واقعاً من را تکان داد. من برای استفاده از Muse هیجان زده بودم. من یک توسعه دهنده نرم افزار هستم و اغلب از هوش مصنوعی استفاده می کنم. مدل هوش مصنوعی مورد علاقه من Claude Opus 5.5 است و من در حال حاضر در حال ساخت یک پلتفرم میراث دیجیتالی هوش مصنوعی به نام EchoVault هستم تا به مردم کمک کنم حتی پس از رفتن عزیزانشان با آنها ارتباط برقرار کنند. این ایده که نماینده Meta's Muse به"}, {"source": "Business Insider", "title": "The oil market is facing a transportation crisis that suggests energy costs aren't falling soon", "link": "https://www.businessinsider.com/oil-market-tanker-rates-crisis-energy-costs-inflation-2026-10", "summary": "Oil tanker rates have skyrocketed, one reason why energy costs may remain high even if the price of crude cools. Allen J. Schaben / Los Angeles Times via Getty Images The oil market is in the midst of a shipping crisis that could keep crude prices high. Tanker rates have skyrocketed, adding pressure to energy costs even if oil prices cool. Shipping pressures also directly push up the price of oil, adding to price pressures for consumers. Oil prices have fallen from wartime peaks, but a broader transportation crisis in the crude market suggests it may not matter so far as preventing further pain for consumers. Energy costs have been top of mind for investors for most of this year as the war has dragged on. Brent crude , the international benchmark, has seesawed recently, trading around $105 a barrel this week as traders weighed supply disruptions alongside the outlook for a resolution to the war. But it's no longer an oil supply shortage energy experts are worried about — it's a shipping crisis that has drawn more attention recently, analysts watching the crude market say. Shipping costs are thought to be secondary to the price of oil when it comes to energy costs, but that's changed recently as tanker rates and diesel prices have skyrocketed , reflecting how the market is pricing in a higher premium for transporting oil out of the Middle East, as well as reduced refining capacity to produce fuel. For consumers, it's fundamentally changed the equation for the cost of su
