<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <title>مجله خبری روزانه — ۷ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۷ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۸ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۹:۰۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">

      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۷</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۶</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

زارت خارجه کویت روز جمعه ششم آذر۱۴۰۵، «محمد توتونچی»، سفیر جمهوری اسلامی در این کشور، را احضار کرد و یادداشت اعتراضی خود را درباره ادام ... «حمد سلیمان المشعان»، معاون وزیر خارجه کویت، این حملات را نقض آشکار حاکمیت و تمامیت ارضی کویت، قوانین بین‌المللی، منشور سازمان ملل متحد و قطعنامه ۲۸۱۷ شورای امنیت دانست و جمهوری اسلامی را مسئول تمامی پیامدهای آن خواند. «عباس عراقچی»، وزیر خارجه جمهوری اسلامی، پنج‌شنبه پنجم آذر۱۴۰۵ در گفت‌وگویی تلفنی با «جراح جابر الاحمد الصباح»، وزیر خارجه کویت، دخالت جمهوری اسلامی در حمله پهپادی به این کشور را رد کرد. او همچنین از آمادگی جمهوری اسلامی برای انجام تحقیقات مشترک با کویت خبر داد. پیش از وزیر خارجه جمهوری اسلامی، «ابوالفضل شکارچی»، سخنگوی ارشد نیروهای مسلح جمهوری اسلامی، گزارش ارتش کویت درباره حمله جمهوری اسلامی به یکی از تاسیسات حیاتی این کشور را رد کرد و گفت هیچ‌گونه عملیات نظامی یا تهاجمی از سوی نیروهای مسلح جمهوری اسلامی در منطقه انجام نشده است. «سعود عبدالعزیز العطوان»، سخنگوی وزارت دفاع کویت، روز پنجم آذر اعلام کرد که در پی حمله جمهوری اسلامی به یکی از مراکز حیاتی این کشور، چهار نفر شامل یک شهروند کویتی، دو شهروند ایتالیایی و یک شهروند پاکستانی مجروح شدند. بر اساس بیانیه ارتش کویت که در شبکه اجتماعی ایکس منتشر شد، نیروهای مسلح این کشور شماری از پهپادهای متخاصم را در حریم هوایی کویت شناسایی و با آن‌ها مقابله کردند. سخنگوی وزارت دفاع کویت افزود که سقوط ترکش‌ها علاوه بر مجروح شدن چهار نفر، خسارت‌های مادی نیز به همراه داشته است. مجروحان برای دریافت خدمات درمانی به بیمارستان منتقل شدند. نیروهای مسلح کویت همچنین بر تداوم آمادگی نظامی و اتخاذ تمامی اقدامات لازم برای حفاظت از حاکمیت، امنیت و ثبات این کشور و تامین امنیت شهروندان و افراد مقیم تاکید کردند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Screenshot_2026-11-27_at_9.49.03AM_ieOQ__v1024x512__box_0%2C23%2C1074%2C588.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۶ آذر • ۱۸:۱۶"}, {"source": "Euronews Persian", "title": "نمایشگاه کیک و شیرینی لندن؛ بزرگداشت صدمین سال تولد دیوید اتنبرو", "link": "https://parsi.eur mages.euronews.com/articles/stories/10/01/16/57/1200x675_cmsv2_11a21758-fd57-5eee-8457-3e0b47b2a9dd-10011657.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آذر • ۱۸:۱۰"}, {"source": "Independent Persian", "title": "پیام منتسب به مجتبی خامنه‌ای؛ هراس از بازگشت اعتراض‌ها در سالگرد خیزش ملی دی‌ماه", "link": "https://www.independentpersian.com/node/423378/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D9%BE%DB%8C%D8%A7%D9%85-%D9%85%D9%86%D8%AA%D8%B3%D8%A8-%D8%A8%D9%87-%D9%85%D8%AC%D8%AA%D8%A8%DB%8C-%D8%AE%D8%A7%D9%85%D9%86%D9%87%E2%80%8C%D8%A7%DB%8C%D8%9B-%D9%87%D8%B1%D8%A7%D8%B3-%D8%A7%D8%B2-%D8%A8%D8%A7%D8%B2%DA%AF%D8%B4%D8%AA-%D8%A7%D8%B9%D8%AA%D8%B1%D8%A7%D8%B6%E2%80%8C%D9%87%D8%A7-%D8%AF%D8%B1-%D8%B3%D8%A7%D9%84%DA%AF%D8%B1%D8%AF-%D8%AE%DB%8C%D8%B2%D8%B4", "summary": "در آستانهٔ نخستین سالگرد انقلاب ملی ایرانیان در دی‌ماه ۱۴۰۴ و کشتار بی‌سابقهٔ معترضان، رسانه‌های حکومتی پیامی مکتوب منتسب به مجتبی خامنه‌ای منتشر کردند که در آن آمده است بسیجیان برای ضربه زدن به «دشمنان اسلام و نظام اسلامی» از هیچ فرصتی چشم‌پوشی نمی‌کنند. در این پیام که به مناسبت هفتهٔ بسیج منتشر شد، از این سازمان خواسته شده است «تحول و تولدی جدید» را تجربه کند و برای تحقق شعار «هر ایرانی، یک بسیجی» گام بردارد. در متن پیام، مصداق «دشمنان نظام اسلامی» مشخص نشده، اما مخاطب آن سازمانی زیرمجموعه سپاه پاسداران است که گردان‌هایش در سرکوب خونین خیزش ملی دی‌ماه نقش مهمی داشتند. تأکید بر ضربه زدن به «دشمنان نظام اسلامی» در پیامی خطاب به بسیج، با توجه به نقش محوری این نیرو در کشتار دی‌ماه، نشانه‌ای از آمادگی حکومت برای سرکوب دوباره اعتراض‌های احتمالی است. انتشار پیام تنها چند هفته مانده به سالگرد کشته‌شدگان، در شرایطی که بحران معیشت به اعتصاب و اعتراض در شهرهای مختلف دامن زده است، به این بخش از متن اهمیت بیشتری می‌دهد. از کشتار دی‌ماه تا طرح «محله‌محور» طائب اعتراض‌های دی‌ماه سال گذشته از دل نارضایتی‌های اقتصادی و با حمایت از شاهزاده رضا پهلوی در بازار تهران آغاز شد و به‌سرعت به خیزشی سراسری علیه جمهوری اسلامی در سراسر ایران تبدیل شد. ایندیپندنت فارسی بر اساس تصاویر راستی‌آزمایی‌شده و شهادت شاهدان، مشارکت سپاه پاسداران، گردان‌های بسیج، واحدهای فرماندهی انتظامی و نیروهای لباس‌شخصی را در سرکوب‌ها ثبت کرده است. حکومت همزمان اینترنت را قطع کرد و ده‌ها هزار نفر، عمدتاً در روزهای ۱۸ و ۱۹ دی کشته شدند. بازگشت حسین طائب به ریاست سازمان بسیج در مردادماه، جهت‌گیری این نهاد رادر برابر اعتراض‌های احتمالی روشن‌تر می‌کند. طائب که پیش‌تر ریاست سازمان اطلاعات سپاه را بر عهده داشت، پس از کشته شدن غلامرضا سلیمانی، رئیس پیشین بسیج در جنگ، به این سمت منصوب شد. او در هفته‌های اخیر «حکمرانی محله‌محور و مسجد‌محور» را از اولویت‌های بسیج خواند و بر افزایش نقش این سازمان در تأمین امنیت محله‌ها تأکید کرد. از منظر امنیتی، چنین رویکردی به حکومت امکان می‌دهد برای مهار تجمع‌ها در همان محله‌ها، پیش از گسترش آن‌ها به دیگر نقاط شهر، به شبکه پایگاه‌های بسیج متکی باشد. شعار «هر ایرانی، یک بسیجی» در همین چارچوب معنا پیدا می‌کند. در پیام تازه از سازمان بسیج خواسته شده است از ظرفیت کسانی که با این نهاد همسو هستند و عضو رسمی آن نیستند، استفاده کند. جمهوری اسلامی ایران از آغاز جنگ در اسفندماه، برای برگزاری تجمع‌های حکومتی در شهرهای مختلف به نیروهای بسیج متکی بود. اکنون تلاش برای گسترش این شبکه در جامعه‌ای صورت می‌گیرد که نقش سپاه و بسیج در کشتار دی‌ماه، نفرت بخش بزرگی از مردم را از این دو نهاد عمیق‌تر کرده است. سالگرد کشته‌شدگان در اوج بحران معیشت بخشی از فشار اقتصادی که معترضان سال گذشته را به خیابان کشان", "date_str": "2026-11-27T14:56:19+00:00", "hash": "8a086c96b844a7aa", "title_fa": "پیام منتسب به مجتبی خامنه‌ای؛ هراس از بازگشت اعتراض‌ها در سالگرد خیزش ملی دی‌ماه", "summary_fa": "در آستانهٔ نخستین سالگرد انقلاب ملی ایرانیان در دی‌ماه ۱۴۰۴ و کشتار بی‌سابقهٔ معترضان، رسانه‌های حکومتی پیامی مکتوب منتسب به مجتبی خامنه‌ای منتشر کردند که در آن آمده است بسیجیان برای ضربه زدن به «دشمنان اسلام و نظام اسلامی» از هیچ فرصتی چشم‌پوشی نمی‌کنند. در این پیام که به مناسبت هفتهٔ بسیج منتشر شد، از این سازمان خواسته شده است «تحول و تولدی جدید» را تجربه کند و برای تحقق شعار «هر ایرانی، یک بسیجی» گام بردارد. در متن پیام، مصداق «دشمنان نظام اسلامی» مشخص نشده d one-way New York-to-London tickets for as little as $99, warned on Wednesday that its \"financial situation is critical.\" On Friday, it announced that its Norwegian operating unit had filed for bankruptcy. All Norse flights are canceled, and ticket sales have been discontinued, it added. \"We are deeply sorry for the impact this has on our passengers, employees and partners,\" said CEO Eivind Roald. He added that the board, management, and its advisors are \"working to find a solution for the remaining part of the business to continue operations.\" Earlier on Friday, Norse said that it received notices terminating the lease agreements for all 12 of its airplanes. It added that while it was contesting these and is still continuing discussions over short-term financing, \"there can be no assurance that a viable solution will be found.\" Shares in the airline, which trade on the Norwegian stock exchange, are trading at 1 cent, down 40% over the past five days, and 98.5% since the start of the year. The airline reported a net loss of $94.6 million for the first half of the year. It also noted that fuel prices had nearly doubled compared to last year. Before this week, Norse had already been looking for ways to shore up its finances. In May, it announced a cost-cutting plan aimed at saving $50 million a year, including the elimination of 75 jobs. And last August, it axed half of its US-to-Europe routes . Norse was founded in 2021 after fellow Scandinavian carrier Norwegian Air abandoned its transatlantic routes as it fought to survive the pandemic. Norse uses the familiar budget-airline model, relying on extra fees for baggage, seat selection, and onboard meals. However, the war in Iran has sent jet fuel prices skyrocketing. Unlike many European carriers, Norse does not hedge its fuel purchases, so it has been more exposed to the surge. The fuel surge has already brought down another budget carrier. Spirit Airlines shut down in May after filing for bankruptcy protecti Business Insider", "title": "We couldn't agree on a vacation for 13 people. Then the 8-year-old twins suggested something unexpected.", "link": "https://www.businessinsider.com/multigenerational-family-vacation-idaho-dude-ranch-2026-11", "summary": "Horseback riding with the family on a dude ranch in Idaho. Courtesy of Bill Hallier We wanted to celebrate my parents' 80th birthdays with a vacation for all 13 family members. After struggling to agree on a destination, the youngest kids suggested an Idaho dude ranch. With activities for every age and meals included, everyone could relax and enjoy time together. Around a campfire in an Idaho horse pasture, our family of 13 hummed along with the jovial guitar-strumming folk singer. The kids licked marshmallow-covered fingers under a starry sky, seemingly mesmerized by the fire's shadows dancing on our faces. It's a memory that has stuck in my mind and made me laugh more than once over the past year. Grandma and Grandpa were celebrating their 80th birthday and wanted the entire family along for the ride. That night under the twinkling stars, for a little while, nobody needed to plan anything or wonder what tomorrow would bring. We could just sit together and sing. But getting us there was considerably less harmonious. We had ages ranging from 8 to 80 We all wanted to celebrate together, but agreeing on where to go nearly derailed the whole thing. Everyone had a say. Unfortunately, most of those opinions conflicted . From cruises to beaches and everything in between, we just couldn't decide where to go or what type of vacation would work best for our large group. The author went on a multigenerational trip with her family Courtesy of Bill Hallier With ages ranging from 8 to 80, we were asking a lot of one vacation. The kids needed adventures and time with the other young campers. The teenagers needed some freedom. The adults were hoping to relax, and we all wanted Grandma and Grandpa to enjoy their birthday without spending the trip keeping everyone else entertained. Then the youngest of the group, 8-year-old twins, suggested a dude ranch . It was the idea with the fewest complaints, and in our family, that counted as enthusiasm. What followed was an Idaho getaway reminiscent of the kind of family time I remember from childhood, when we were happy just sitting outside together under the stars. There was plenty to do, but it also allowed us to do very little. Getting there and staying together were manageable Before falling in love with a ranch, we looked at how everyone would get there. A beautiful setting loses some appeal if getting there requires an exhausting journey, especially with young children or older relatives. The author s family was celebrating ", "date_str": "2026-11-27T13:47:01+00:00", "hash": "28e65f207bda92c7", "title_fa": "ما نتوانستیم برای تعطیلات 13 نفر به توافق برسیم. سپس دوقلوهای 8 ساله چیزی غیرمنتظره را پیشنهاد کردند.", "summary_fa": "اسب سواری با خانواده در مزرعه ای در آیداهو. با حسن نیت از بیل هالیر ما می خواستیم تولد 80 سالگی والدینم را با تعطیلات برای تمام 13 عضو خانواده جشن بگیریم. پس از تلاش برای توافق بر سر یک مقصد، کوچک‌ترین بچه‌ها مزرعه‌ای برای افراد آیداهو پیشنهاد کردند. با انجام فعالیت‌هایی برای هر سن و وعده‌های غذایی، همه می‌توانستند استراحت کنند و از زمان با هم لذت ببرند. در اطراف آتشی در یک مرتع اسب آیداهو، خانواده 13 نفره ما همراه با خواننده فولکلور خوش‌نواز نوازنده گیتار زمزمه می‌کردند. بچه‌ها انگشت‌های پوشیده از گل ختمی را زیر آسمان پرستاره لیس می‌زدند و به نظر می‌رسید که سایه‌های آتشی که روی صورت‌هایمان می‌رقصند مسحور شده بودند. این خاطره ای است که در یک سال گذشته بیش از یک بار در ذهنم مانده و باعث خنده ام شده است. مادربزرگ و پدربزرگ هشتادمین سالگرد تولدشان را جشن می‌گرفتند و می‌خواستند تمام خانواده برای سواری همراه باشند. آن شب در زیر ستارگان چشمک زن، برای مدتی، هیچ کس نیازی به برنامه ریزی نداشت یا فکر نکرد که فردا چه خواهد شد. فقط می توانستیم کنار هم بنشینیم و آواز بخوانیم. اما رسیدن ما به آنجا به میزان قابل توجهی هماهنگی کمتری داشت. ما از 8 adline.com/2026/11/netflix-edits-tyson-fury-schizophrenia-scene-paris-fury-1237234272/", "summary": "Tyson Fury does not have schizophrenia and a scene in which his wife claims he does has been edited out of the Netflix movie about the British boxing superstar. The doc, titled Tyson Fury, provides a tell-all account of Fury s mental health struggles as he builds up to his fight with Anthony Joshua next month, [ ]", "date_str": "2026-11-27T14:56:31+00:00", "hash": "9c40d3bc451321a8", "title_fa": "نتفلیکس صحنه اسکیزوفرنی خارج از دکتر تایسون فیوری را بعد از اینکه همسرش فاش کرد که بوکسور شرایط ندارد را ویرایش کرد", "summary_fa": "تایسون فیوری مبتلا به اسکیزوفرنی نیست و صحنه‌ای که همسرش ادعا می‌کند او مبتلاست، از فیلم نت‌فلیکس درباره فوق‌ستاره بریتانیایی بوکس ویرایش شده است. این مستند که تایسون فیوری نام دارد، گزارش کاملی از مبارزات فیوری در مورد سلامت روانی او ارائه می‌کند که او به مبارزه خود با آنتونی جاشوا در ماه آینده ادامه می‌دهد، [ ] تریلر در ابتدا همسر فیوری، پاریس فیوری را نشان می‌دهد که می‌گوید این بوکسور یک اسکیزوفرنی خفیف است، اما در میان سوالاتی که از سوی سازمان تنظیم‌کننده بوکس منتشر شد، این موضوع اکنون فاش نشده است. اخبار مرتبط اخبار نتفلیکس به سریال‌های فانتزی چینی موسیقی‌محور لحن می‌دهد اخبار ملودی عشق پست‌های نتفلیکس پیام شنیع شکرگزاری در روز پخش فصل دوم The Hunting Wives من می‌خواهم بیانیه‌ای را که در نسخه اصلی مستند تایسون فیوری بیان کردم، توضیح دهم. زمانی که در مورد وضعیت تایسون صحبت می‌کردم، صحبتی از سال‌ها پیش به یاد آوردم و از کلمه اسکیزوفرنی استفاده کردم. در حالی که تایسون برخی علائم مرتبط با اسکیزوفرنی را نشان داد، او این بیماری را ندارد و هرگز تشخیص داده نشده است. در ددلاین تماشا کنید یک سخنگوی نتفلیکس گفت که این صحنه از سند حذف شده است که امروز حذف شد. او اضافه کرد که به دنبال اطلاعات جدیدی که خانواده در رابطه با تشخیص رسمی سلامت روان تایسون به اشتراک گذاشته اند، ما در کنار آنها برای به روز رسانی مستند قبل از انتشار کار کرده ایم. به دنبال اظهارات مربوط به اسکیزوفرنی، که در یک بیانیه مطبوعاتی نتفلیکس در مورد این سند در روز دوشنبه نیز گنجانده شد، هیئت کنترل بوکس بریتانیا گفت که در حال بررسی است که آیا آنچه که تصور می‌شد تشخیص فیوری باشد مانع مبارزه طولانی مدت او با بوکسور بریتانیایی، جاشوا می‌شود یا خیر.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Tyson_Fury_n_00_57_11_23.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۶ آذر • ۱۸:۲۶"}, {"source": "Rolling Stone", "title": "Watch ‘Sesame Street’ Pay Homage to Mariah Carey’s ‘All I Want for Christmas Is You’", "link": "https://www.rollingstone.com/music/music-news/sesame-street-mariah-carey-christmas-song-homage-1235665152/", "summary": "This year the characters need the letter \"U\" to help the holidays stay festive and bright", "date_str": "2026-11-27T14:57:04+00:00", "hash": "9772e983cb0be016", "title_fa": "«خیابان کنجد» را تماشا کنید که به آهنگ «همه چیزی که برای کریسمس می‌خواهم تو هستی» ماریا کری", "summary_fa": "امسال کاراکترها به حرف \"U\" نیاز دارند تا به تعطیلات کمک کند تا در تعطیلات جشن و شادی داشته باشند. امسال، شخصیت‌های Sesame Street با نسخه عجیب و غریب خود، با عنوان All I Want for Christmas Is U به آهنگ تعطیلات ادای احترام کردند. در کلیپ که امروز به اشتراک گذاشته شد، Abby Cadabby، Grover، Elmo و Cookie Monster درباره حرف بسیار مهم U می خوانند، که آرزوی اصلی آنها در کریسمس است. ماپت های رنگارنگ می خوانند: \"اگر ما برای کریسمس U نداشتیم، هیچ کلمه ای وجود نداشت.\" «ما نمی‌توانیم هدایا را زیر درخت کریسمس باز کنیم/ بدون کلماتی که با U شروع می‌شوند، تعطیلات احساس درستی نمی‌کند/ ما حتی نمی‌توانیم روبان‌ها را باز کنیم/ یا چراغ‌های کریسمس را باز کنیم/ می‌خواهیم جعبه کریسمس را باز کنیم، اما نمی‌توانیم/ کمک نمی‌کنی بفهمیم/ نمی‌دانیم چه خواهیم کرد/ تنها چیزی که برای کریسمس نیاز داریم، U است!» موفقیت کری معمولاً هر سال به صدر جدول 100 بیلبورد برمی‌گردد. این آهنگ از زمانی که برای اولین بار در 19 دسامبر 2019 به این جایگاه رسید، به مدت 22 هفته در صدر جدول 100 قرار گرفته است. با این حال، امسال، کری شاهد رقابت هایی از الا لنگلی بود، که رکورد حضور در صدر جدول را در سپتامبر به دست آورد، زمانی که \"Choosin' Texas\" بیست و سومین هفته خود را در رتبه 1 در هات 10 به دست آورد. داستان های پرطرفدار دوران دوران گیتاریست اندی تیلور در سن 65 سالگی مرده تماشا کنید میراندا لمبرت در حال اجرای ترکیبی از هیت هایش در نمایش نیمه وقت دالاس کابوی ها ژرارد دوپاردیو برای محاکمه به دلیل تجاوز جنسی بازیگر زن شارلوت آرنولد دوران ویلد ویلد ترین ویلی از اندی تای.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/sesamestreet.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آذر • ۱۸:۲۷"}, {"source": "Rolling Stone", "title": "Justin Timberlake Says Making Upcoming Doc Series Was ‘Really Cathartic’", "link": "https://www.rollingstone.com/music/music-news/justin-timberlake-upcoming-doc-series-interview-fallon-1235665140/", "summary": "The pop star took over The Tonight Show on Thanksgiving with an interview, performances, and sketches", "date_str": "2026-11-27T14:33:39+00:00", "hash": "67e009ec0e317992", "title_fa": "جاستین تیمبرلیک می‌گوید ساخت سریال Doc آینده «واقعاً دلخراش» بود", "summary_fa": "این ستاره پاپ با مصاحبه، اجراها و طرح‌هایی، سریال The Tonight Show در روز شکرگزاری را بر عهده گرفت. امسال می‌توانید از جاستین تیمبرلیک تشکر کنید. این ستاره پاپ تعطیلات خود را در The Tonight Show گذراند، جایی که آواز خواند، رقصید، در طرح‌های مضحک ظاهر شد، بیستمین سالگرد آلبوم FutureSex/LoveSounds را جشن گرفت و به آنچه در مجموعه مستند آینده‌اش خواهد آمد اشاره کرد. تیمبرلیک در طول نمایش در اواخر شب، FutureSex / LoveSound، SexyBack، Summer Love و My Love را برای تماشاگران زنده در اتاق رنگین کمان در شهر نیویورک اجرا کرد. او همچنین LoveStoned، Until the End of Time، و What Goes Around…/…Comes Around را به نمایش گذاشت. تیمبرلیک با مجری برنامه، جیمی فالون، تاریخچه ای از آهنگ مهمانی را برای مخاطبان استودیو ارائه کرد. این اجرا شامل اجرای سریع آهنگ های Caron Wheeler و Soul II Soul Back to Life (هر جور که می خواهی)، Montell Jordan This Is How We Do It، و Daft Punk و Pharrell Get Lucky بود. آنها با یک برداشت از سرود در بک استریت Boys I Want It That Way به پایان رسیدند. تیمبرلیک در جای دیگر در برنامه The Tonight Show لباس بوقلمون پوشید و خاطرات اردوگاه دهه 1980 را زنده کرد. تیمبرلیک همچنین با فالون درباره سالگرد FutureSex/LoveSounds که در سال 2006 منتشر شد و مستند چهار قسمتی آینده‌اش، تیمبرلیک، گفتگو کرد. تیمبرلیک به فالون گفت: \"من واقعاً تمایلی به انجام آن نداشتم. من به نوعی خصوصی مشهور هستم. و با فیشر استیونز که کارگردانی فوق العاده و انسانی بزرگ است رابطه دارم. وقتی فیشر برای اولین بار به من نزدیک شد تا این کار را انجام دهم، من تمایلی نداشتم زیرا می‌گفتم: «نمی‌خواهم در مورد خودم صحبت کنم،» می‌دانی؟ اما هر چه بیشتر می‌نشستیم و صحبت می‌کردیم، بیشتر به دنبال چیزی می‌گشتم که کمی بیشتر در زیر", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/GettyImages-2306420865-1.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آذر • ۱۸:۰۳"}]

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
