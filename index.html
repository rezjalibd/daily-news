ز درگیری منتشر کرده است. بر اساس این گزارش، نیروهای امنیتی به سرنشینان یک خودروی پژو ۴۰۵ تیراندازی کرده‌اند و تصاویر منتشرشده از محل نیز آثار اصابت چندین گلوله به بدنه این خودرو را نشان می‌دهد. حال‌وش به نقل از منابع خود گزارش داده است که در جریان تیراندازی‌ها یک فرد مسلح، سه نیروی نظامی و دو زن رهگذر زخمی شده‌اند. برخی گزارش‌های محلی نیز از کشته‌شدن فرد مسلح خبر داده‌اند، اما این رسانه گفته است قادر به تایید مستقل این بخش از گزارش‌ها نیست. در مقابل، صداوسیمای جمهوری اسلامی صبح جمعه به نقل از «منابع آگاه» اعلام کرد نیروهای قرارگاه قدس نیروی زمینی سپاه هنگام گشت‌زنی در خیابان دانشگاه به یک خودروی سواری مشکوک شدند و پس از آن میان نیروهای سپاه و سرنشینان خودرو تیراندازی آغاز شد. بر اساس روایت صداوسیما، دو نفر از افراد مسلح در این درگیری کشته و یک نفر دیگر بازداشت شده است. این گزارش درباره کشته‌شدن"}, {"source": "IranWire", "title": "حسین طائب: داوطلبان «جان‌فدا» به یگان‌های نظامی ملحق می‌شوند", "link": "https://iranwire.com/fa/news-1/157756-%D8%AD%D8%B3%DB%8C%D9%86-%D8%B7%D8%A7%D8%A6%D8%A8-%D8%AF%D8%A7%D9%88%D8%B7%D9%84%D8%A8%D8%A7%D9%86-%D8%AC%D8%A7%D9%86%D9%81%D8%AF%D8%A7-%D8%A8%D9%87-%DB%8C%DA%AF%D8%A7%D9%86%D9%87%D8%A7%DB%8C-%D9%86%D8%B8%D8%A7%D9%85%DB%8C-%D9%85%D9%84%D8%AD%D9%82-%D9%85%DB%8C%D8%B4%D9%88%D9%86%D8%AF/", "summary": "حسین طائب، رئیس سازمان بسیج مستضعفین، اعلام کرد صدها هزار نفر از ثبت‌نام‌کنندگان پویش حکومتی «جان‌فدا» در تهران سازماندهی شده‌اند و روند ...", "date_str": "2026-09-18T07:40:30+00:00", "hash": "891c7b056ec82ea7", "title_fa": "حسین طائب: داوطلبان «جان‌فدا» به یگان‌های نظامی ملحق می‌شوند", "summary_fa": "حسین طائب، رئیس سازمان بسیج مستضعفین، اعلام کرد صدها هزار نفر از ثبت‌نام‌کنندگان پویش حکومتی «جان‌فدا» در تهران سازماندهی شده‌اند و روند ... طائب روز جمعه ۲۷ شهریور در جریان رزمایش موسوم به «۳۱۳ هزار نفری جان‌فدایان ایران» در تهران گفت برای این افراد دوره‌های آموزشی مقدماتی و تکمیلی در حوزه‌های زمینی، هوایی و دریایی در نظر گرفته شده است. این رزمایش از صبح جمعه در مسیر میدان امام حسین تا میدان انقلاب تهران برگزار شد. رسانه‌های حکومتی شمار شرکت‌کنندگان را ۳۱۳ هزار نفر اعلام کرده‌اند، اما این آمار به‌طور مستقل قابل تایید نیست. برگزارکنندگان همچنین اعلام کرده‌اند برنامه‌های مشابه در دیگر استان‌ها و شهرهای ایران برگزار خواهد شد. رئیس سازمان بسیج پویش «جان‌فدا» را بخشی از آنچه «مردمی‌سازی دفاع و امنیت» خواند توصیف کرد و مدعی شد این برنامه نشان‌دهنده آمادگی گسترده شهروندان برای حضور در جنگ و «ایثار جان و مال» است. طائب در سخنان خود همچنین گفت پویش «جان‌فدا» پس از تهران به دیگر نقاط ایران گسترش خواهد یافت و مدعی شد «ده‌ها میلیون» نفر آماده پیوستن به این برنامه هستند. او همچنین گفت حضور افرادی که از آنها با عنوان «جان‌فدایان» یاد می‌کند باید بر تصمیم‌گیری مسئولان جمهوری اسلامی اثر بگذارد و مدعی شد چنین حضوری محاسبات آمریکا و اسرائیل را تغییر خواهد داد. طائب در بخش دیگری از سخنان خود، بدون ارائه شواهد، مدعی شد ایستادگی جمهوری اسلامی باعث «ناکامی» ارتش آمریکا و اسرائیل شده و افکار عمومی ایالات متحده نیز نسبت به هزینه‌های حضور نظامی این کشور در منطقه معترض شده است. او همچنین پیش‌بینی کرد نیروهای آمریکایی به‌زودی منطقه را ترک خواهند کرد و این خروج را «شکست» آمریکا توصیف کرد. شواهد مستقلی که نشان دهد دولت آمریکا تصمیم به خروج نیروهایش از منطقه گرفته باشد در سخنان طائب ارائه نشد. رئیس سازمان بسیج همچنین به تنگه هرمز اشاره کرد و گفت جمهوری"}, {"source": "IranWire", "title": "اجازه سفر هیات ایرانی برای حضور در مجمع سازمان ملل صادر شد", "link": "https://iranwire.com/fa/news-1/157752-%D8%A7%D8%AC%D8%A7%D8%B2%D9%87-%D8%B3%D9%81%D8%B1-%D9%87%DB%8C%D8%A7%D8%AA-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AD%D8%B6%D9%88%D8%B1-%D8%AF%D8%B1-%D9%85%D8%AC%D9%85%D8%B9-%D8%B3%D8%A7%D8%B2%D9%85%D8%A7%D9%86-%D9%85%D9%84%D9%84-%D8%B5%D8%A7%D8%AF%D8%B1-%D8%B4%D8%AF/", "summary": "وزارت امور خارجه ایالات متحده آمریکا روز پنجشنبه ۲۶شهریور۱۴۰۵ اعلام کرد اجازه سفر به یک هیات ایرانی با اعضای محدود با هدف نشست مجمع عموم ...", "date_str": "2026-09-17T20:03:35+00:00", "hash": "74191db703d9a270", "title_fa": "اجازه سفر هیات ایرانی برای حضور در مجمع سازمان ملل صادر شد", "summary_fa": "وزارت امور خارجه ایالات متحده آمریکا روز پنجشنبه ۲۶شهریور۱۴۰۵ اعلام کرد اجازه سفر به یک هیات ایرانی با اعضای محدود با هدف نشست مجمع عموم ... سخنگوی این وزارتخانه در گفتگو با رادیو فردا تایید کر: «در چارچوب تعهدات آمریکا به‌عنوان کشور میزبان، هیات اصلی حکومت ایران اجازه خواهد داشت در سطح عالی مجمع عمومی سازمان ملل متحد شرکت کند.» اطلاعات منتشر شده حاکی از آن است که این هیات مشمول «محدودیت‌های تردد» خواهد بود و گفته شده است که بر اساس سیاست آمریکا، اعضای آن از «خرید کالاهای لوکس و برخی کالاهای دیگر منع خواهند شد». این سخنگو همچنین خبر داد شمار اعضای هیات ایرانی نسبت به سال گذشته کمتر خواهد بود. همزمان خبرگزاری فرانسه به نقل از یک منبع آگاه خبر داد «مسعود پزشکیان»، رییس دولت چهاردهم جمهوری اسلامی در این هیات خواهد بود. جنگ آمریکا و ایران وارد هفتمین ماه خود شده است و «دونالد ترامپ»، رییس‌جمهور ایالات متحده، ساعتی پیش از انتشار این خبر گفت در حال رسیدن به نقطه‌ای برای «تصمیم گرفتن در مورد از سرگیری حملات گسترده مجدد به ایران» است. آمریکا در این هفته با معافیت «محمد اسلامی»، رییس سازمان انرژی اتمی ایران، از تحریم‌های سازمان ملل مخالفت کرد و به همین سبب حضور او در نشست آژانس بین‌المللی انرژی اتمی در وین، پایتخت اتریش، ناممکن شد. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید چقدر انسان باید پست باشه که از یک طرف فریاد مرگ بر آمریکا بزنه و از طرف دیگر در اولین فرصت چشم به خرید کالای لوکس آمریکایی داشته باشه. با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید"}, {"source": "IranWire", "title": "از ایست بازرسی تا اعدام؛ پرونده پرابهام مهناز چهاردولی", "link": "https://iranwire.com/fa/features/157762-%D8%A7%D8%B2-%D8%A7%DB%8C%D8%B3%D8%AA-%D8%A8%D8%A7%D8%B2%D8%B1%D8%B3%DB%8C-%D8%AA%D8%A7-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85-%D9%BE%D8%B1%D9%88%D9%86%D8%AF%D9%87-%D9%BE%D8%B1%D8%A7%D8%A8%D9%87%D8%A7%D9%85-%D9%85%D9%87%D9%86%D8%A7%D8%B2-%DA%86%D9%87%D8%A7%D8%B1%D8%AF%D9%88%D9%84%DB%8C/", "summary": "در یک صفحه از دادنامه‌ای که «ابوالقاسم صلواتی»، رییس شعبه ۱۵ دادگاه انقلاب تهران، صادر کرده، تعداد کوکتل‌مولوتف‌های یک پرونده سه بار تغی ...", "date_str": "2026-09-18T08:24:09+00:00", "hash": "d7325b00f415d7b0", "title_fa": "از ایست بازرسی تا اعدام؛ پرونده پرابهام مهناز چهاردولی", "summary_fa": "در یک صفحه از دادنامه‌ای که «ابوالقاسم صلواتی»، رییس شعبه ۱۵ دادگاه انقلاب تهران، صادر کرده، تعداد کوکتل‌مولوتف‌های یک پرونده سه بار تغی ... مهناز چهاردولی، متولد سال۱۳۵۹، او مادر دو فرزند و سال‌ها سرپرست خانواده بوده است. مهدی ناظر و خواهرش «عاطفه ناظر» در یک صفحه از دادنامه‌ای که «ابوالقاسم صلواتی»، رییس شعبه ۱۵ دادگاه انقلاب تهران، صادر کرده، تعداد کوکتل‌مولوتف‌های یک پرونده سه بار تغییر کرده است: ۲۰، ۲۲ و ۲۵ عدد. دادنامه‌ای که در نهایت برای دو نفر از بازداشت‌شدگان اعتراضات دی۱۴۰۴ حکم اعدام و برای هر سه متهم پرونده حکم ۱۰ سال زندان به همراه داشته است. نسخه‌ای از این دادنامه به دست ایران‌وایر رسیده است. صلواتی ابتدا از کشف ۲۲ کوکتل‌مولوتف از خودروی متعلق به «مهدی ناظر» نوشته، چند سطر بعد تعداد آن‌ها را ۲۰ عدد ذکر کرده و در همان صفحه، هنگام صدور حکم مصادره خودرو، نوشته است که این خودرو حامل ۲۵ کوکتل‌مولوتف بوده است. این اختلاف عددی زمانی اهمیت بیشتری پیدا می‌کند که بدانیم کوکتل‌مولوتف‌ها یکی از محورهای اصلی پرونده‌ای هستند که برای مهدی ناظر و «مهناز چهاردولی» حکم مرگ (اعدام) در پی داشته است. هر سه متهم نیز به ده سال حبس محکوم شده‌اند. اما تناقض‌های عددی تنها ابهام این دادنامه نیست. هر سه متهم روز ۲۱دی۱۴۰۴، پس از روزهای اوج اعتراضات، داخل یک خودرو و در ایست بازرسی خاورشهر بازداشت شدند؛ نه هنگام پرتاب کوکتل‌مولوتف یا آتش‌زدن مسجد. یک منبع مطلع نیز به ایران‌وایر گفته است اقرارهای مورد استناد دادگاه تحت فشار گرفته شده‌اند. مهم‌تر اینکه دادگاه برای صدور حکم اعدام به قانونی استناد کرده که صرف حمل یا نگهداری سلاح را برای چنین مجازاتی کافی نمی‌داند و «قصد همکاری با رژیم صهیونیستی یا دولت‌های متخاصم» را نیز شرط کرده است. دادنامه اما چگونه از بازداشت سه نفر در یک ایست بازرسی در ۲۱دی به احراز چنین قصدی رسیده است؟"}, {"source": "IranWire", "title": "داستان غم‌انگیز خشک‌شدن هورالعظیم و سوختن زاگرس؛ گفت‌وگو با اعظم بهرامی", "link": "https://iranwire.com/fa/features/157765-%D8%AF%D8%A7%D8%B3%D8%AA%D8%A7%D9%86-%D8%BA%D9%85%D8%A7%D9%86%DA%AF%DB ود نیز «هیولاهای واقعی» بر جای می‌گذارد. فرانچسکا ریسپولی، از روسای مشترک سازمان ضدمافیایی «لیبرا»، گفت این مرگ رنج بسیاری از کسانی را آشکار می‌کند که از جرایم سازمان‌یافته جدا می‌شوند. او به بی‌بی‌سی گفت: «مافیا فقط یک پدیده فیزیکی نیست. می‌توانی از آن دور شوی. می‌توانی نامت را عوض کنی، اما هنوز یک پیوند باقی می‌ماند؛ یک پیوند خانوادگی که در اعماق وجود انسان می‌ماند و غلبه بر آن ناممکن است.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. کوسکو نیز مانند مادرش سال‌ها با نام و هویتی تازه تحت حفاظت دولت زندگی کرده بود. اما ریسپولی گفت او همچنان به‌شدت آسیب‌پذیر بود و در"}, {"source": "BBC Persian", "title": "برادر پرنسس دایانا مدعی است چارلز سوم اندکی پس از مرگ او گفت: «به‌زودی دایانا را فراموش خواهند کرد»", "link": "https://www.bbc.com/persian/articles/crgqdgvnqqy4o?at_medium=RSS&at_campaign=rss", "summary": "چارلز اسپنسر، برادر شاهزاده دایانا، در خاطراتش ادعا کرده است که چارلز سوم چند روز پس از درگذشت شاهزاده دایانا به او گفته بود: «مردم به‌زودی او را فراموش خواهند کرد.»", "date_str": "2026-09-17T20:46:19+00:00", "hash": "028c243fee54a02c", "title_fa": "برادر پرنسس دایانا مدعی است چارلز سوم اندکی پس از مرگ او گفت: «به‌زودی دایانا را فراموش خواهند کرد»", "summary_fa": "چارلز اسپنسر، برادر شاهزاده دایانا، در خاطراتش ادعا کرده است که چارلز سوم چند روز پس از درگذشت شاهزاده دایانا به او گفته بود: «مردم به‌زودی او را فراموش خواهند کرد.» روزنامه دیلی‌میل بخشی از این خاطرات را منتشر کرده است. این کتاب هنوز منتشر نشده و نسخه‌هایی از کتاب ارل اسپنسر درباره خواهرش دایانا، شاهدخت ولز، از کامیونی در هلند به سرقت رفته است. انتظار می‌رود کتاب حاوی انتقادهای تندی از خانواده سلطنتی بریتانیا باشد. بی‌بی‌سی به نسخه کامل این کتاب دسترسی نداشته است. بی‌بی‌سی دریافته است که چهار نسخه از ترجمه هلندی کتاب، هنگام انتقال از چاپخانه ناشر هلندی به انبار آن، از کامیون برداشته شده است. اسپنسر مدعی است که زمانی که اصرار کرده بود دایانا هرگز نمی‌خواست شاهزاده ویلیام و شاهزاده هری، که آن زمان ۱۵ و ۱۲ سال داشتند، در مراسم تشییع جنازه او در صف سوگواران راه بروند، چارلز، که در آن زمان ولیعهد بود، با «خشم» به او واکنش نشان داد. این زوج سلطنتی در اوت ۱۹۹۶ از یکدیگر طلاق گرفته بودند. کاخ باکینگهام این ادعا را به‌شدت رد کرده است. سخنگوی کاخ گفت: «اگرچه ما معمولاً درباره کتاب‌ها اظهارنظر نمی‌کنیم، اما اعلیحضرت آگاه هستند که اندوه ناشی از فقدان یک خواهر یا برادر می‌تواند قضاوت را تحت تأثیر قرار دهد، قدرت تشخیص را مختل کند و خاطرات را به شکلی رنگ‌آمیزی کند که دیگران، حتی سال‌ها پس از چنین فقدانی، متوجه آن نشوند.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. قرار است کتاب «آواز قو: دایانا، خواهر من» به زودی در بریتانیا و سراسر جهان منتشر شود. این کتاب داستان زندگی شاهدخت دایانا را از نگاه ارل اسپنسر روایت می‌کند. یک منبع گفت راننده کامیون در هلند برای استراحت در پارکینگی توقف کرده بود و هنگام سرقت کتاب‌ها در"}, {"source": "Radio Farda", "title": "ترامپ از «پیشرفت چشمگیر» در مسیر ایجاد پایگاه دائمی ارتش آمریکا در لهستان خبر داد", "link": "https://www.radiofarda.com/a/us-poland-us-army-base-nato-russia/33858733.html", "summary": "رئیس‌جمهور لهستان نیز از این خبر استقبال کرد و گفت دولت این کشور برای یافتن بهترین محل ممکن برای استقرار پایگاه ارتش آمریکا تلاش خواهد کرد.", "date_str": "2026-09-18T08:35:18+00:00", "hash": "f26828d96f724706", "title_fa": "ترامپ از «پیشرفت چشمگیر» در مسیر ایجاد پایگاه دائمی ارتش آمریکا در لهستان خبر داد", "summary_fa": "رئیس‌جمهور لهستان نیز از این خبر استقبال کرد و گفت دولت این کشور برای یافتن بهترین محل ممکن برای استقرار پایگاه ارتش آمریکا تلاش خواهد کرد. دونالد ترامپ می‌گوید آمریکا و لهستان برای ایجاد یک پایگاه دائمی ارتش آمریکا در خاک لهستان «پیشرفت چشمگیری» داشته‌اند. این اقدام، در صورت نهایی شدن، حضور نظامی آمریکا در جناح شرقی ناتو را تقویت خواهد کرد. رئیس‌جمهور آمریکا روز پنج‌شنبه ۲۶ شهریور در شبکهٔ اجتماعی تروث سوشال نوشت: «به لطف رهبری جسورانهٔ دوستم کارول ناوروتسکی، رئیس‌جمهور لهستان، پیشرفت چشمگیری در مسیر ایجاد یک پایگاه ارتش آمریکا در لهستان حاصل شده است.» ترامپ افزود: «اگر این اتفاق بیفتد، محل آن خیلی زود اعلام خواهد شد. این گامی تاریخی برای اتحاد بزرگ آمریکا و لهستان خواهد بود.» آمریکا هم‌اکنون نیز در لهستان نیرو دارد، اما بخش عمدهٔ آن‌ها به‌صورت چرخشی مستقر هستند. ورشو از زمان آغاز تهاجم تمام‌عیار روسیه به اوکراین در سال ۲۰۲۲ خواستار افزایش حضور نیروهای متحد در جناح شرقی ناتو بوده است. گزارش‌های تازه شمار نیروهای آمریکایی حاضر در لهستان را حدود ۱۰ هزار نفر اعلام کرده‌اند. معاون وزیر دفاع لهستان ماه گذشته گفته بود مرحلهٔ نخست مذاکرات با واشینگتن دربارهٔ استقرار دائمی نیروهای آمریکایی به پایان رسیده است. پس از آن نیز مقام‌های دو کشور در ورشو دربارهٔ تقویت حضور نظامی آمریکا گفت‌وگو کردند و قرار است رایزنی‌ها و نشست‌های گروه‌های کاری ادامه یابد. بحث ایجاد پایگاه دائمی در لهستان در حالی پیش می‌رود که پنتاگون هم‌زمان در حال بازنگری گسترده‌تر در نحوهٔ استقرار نیروهای آمریکا در اروپا است. به گزارش رادیو اروپای آزاد/رادیو آزادی، این بازنگری نگرانی برخی قانونگذاران را برانگیخته است مبنی بر این‌که ممکن است ملاحظات دیپلماتیک در تصمیم‌گیری‌ها به اندازه کافی در نظر گرفته نشود. هشت سناتور دموکرات در نامه‌ای به مارکو روبیو، وزیر خارجه آمریکا، خواستار آن شدند که وزارت خارجه به‌طور کامل در این بازنگری مشارکت"}, {"source": "Radio Farda", "title": "درگیری مسلحانه شبانه در زاهدان؛ «چهار نفر کشته شدند»", "link": "https://www.radiofarda.com/a/zahedan-armed-clash-security-forces/33858657.html", "summary": "همزمان با انتشار ویدئوها و تصاویر مختلفی در شبکه‌های اجتماعی از وقوع درگیری مسلحانه در بامداد جمعه ۲۷شهریور در شهر زاهدان، خبرگزاری برنا از کشته شدن یک مأمور نیروی انتظامی خبر داد.", "date_str": "2026-09-18T06:27:22+00:00", "hash": "71880ca8cb630b75", "title_fa": "درگیری مسلحانه شبانه در زاهدان؛ «چهار نفر کشته شدند»", "summary_fa": "همزمان با انتشار ویدئوها و تصاویر مختلفی در شبکه‌های اجتماعی از وقوع درگیری مسلحانه در بامداد جمعه ۲۷شهریور در شهر زاهدان، خبرگزاری برنا از کشته شدن یک مأمور نیروی انتظامی خبر داد. این خبرگزاری، با اعلام وقوع «حادثهٔ امنیتی» در محدودهٔ خیابان دانشگاه شهر زاهدان، نوشت که یک مأمور پلیس در حمله به یک ایست بازرسی کشته شد. در تصاویر و ویدئوهایی که از این درگیری مسلحانه در شبکه‌های اجتماعی منتشر شده، صدای تیراندازی و رفت‌و آمد نیروهای امنیتی و حضور جمعیت و آثار هدف قرار گرفتن یک خودرو دیده می‌شود. خبرگزاری تسنیم، نزدیک به سپاه پاسداران، صبح جمعه در خبری کوتاه وقوع درگیری را تأیید کرد و نوشت مأموران اطلاعات سپاه «حین گشت زنی در خیابان دانشگاه زاهدان با مشکوک شدن به یک خودرو به آن نزدیک می شوند که با تذکر به این خودرو و باتوجه به مسلح بودن آن‌ها درگیری مسلحانه آغاز شد». تسنیم از کشته شدن دو نفر از افراد مسلح و زخمی و دستگیر شدن یک نفر دیگر خبر داد، اما در مورد هویت و وابستگی احتمالی آنان به گروهی خاص توضیحی نداد. اندکی بعد خبرگزاری ایرنا اعلام کرد که نفر سوم هم جان باخته است. پیش از آن، وب‌سایت «حال‌وش»، که اخبار سیستان و بلوچستان را منتشر می‌کند، گزارش داد از حوالی ساعت ۳۰ دقیقه بامداد جمعه در محدوده خیابان دانشگاه و اطراف خیابان دانشجو زاهدان به مدت دو ساعت تیراندازی رگباری رخ داد و سرنشینان یک خودرو پژو ۴۰۵ هدف حمله قرار گرفتند. این رسانه به نقل از منابع خود همچنین افزود در این درگیری «یک فرد مسلح، سه نیروی نظامی و دو زن رهگذر مجروح شدند و چندین آمبولانس به محدوده خیابان دانشگاه و اطراف خیابان دانشجو اعزام و در برخی خیابان‌ها ایست‌های بازرسی برپا شد». همزمان برخی رسانه‌های غیررسمی محلی هم با انتشار ویدئوهایی از این درگیری مسلحانه گفتند «افراد مسلح"}, {"source": "Radio Farda", "title": "وزارت خارجه آمریکا با فروش ۴۸ فروند اف-۳۵ به عربستان موافقت کرد؛ تصمیم نهایی با کنگره", "link": "https://www.radiofarda.com/a/us-saudi-f35-sale-congress/33858658.html", "summary": "فروش اف-۳۵ به عربستان، در صورت نهایی شدن، تغییری مهم در سیاست تسلیحاتی آمریکا در خاورمیانه خواهد بود، چون اسرائیل اکنون تنها کشور منطقه است که این جنگندهٔ رادارگریز را دارد.", "date_str": "2026-09-18T06:06:29+00:00", "hash": "4ed4e8feb7a3087e", "title_fa": "وزارت خارجه آمریکا با فروش ۴۸ فروند اف-۳۵ به عربستان موافقت کرد؛ تصمیم نهایی با کنگره", "summary_fa": "فروش اف-۳۵ به عربستان، در صورت نهایی شدن، تغییری مهم در سیاست تسلیحاتی آمریکا در خاورمیانه خواهد بود، چون اسرائیل اکنون تنها کشور منطقه است که این جنگندهٔ رادارگریز را دارد. وزارت خارجه آمریکا فروش احتمالی ۴۸ فروند جنگندهٔ پیشرفته اف-۳۵ به عربستان سعودی به ارزش ۲۴.۳ میلیارد دلار را تأیید کرده است. وزارت خارجه آمریکا روز جمعه ۲۷ شهریور اعلام کرد این معامله، که هنوز به تأیید کنگره نیاز دارد، علاوه بر ۴۸ فروند جنگنده اف-۳۵ لایتنینگ ۲، شامل ۴۹ موتور، تجهیزات ارتباطی، قطعات یدکی و دیگر تجهیزات پشتیبانی خواهد بود. آمریکا در بررسی فروش تسلیحات به کشورهای خاورمیانه متعهد به حفظ «برتری کیفی نظامی» اسرائیل است، به این ترتیب که در عمل باید دسترسی اسرائیل به تسلیحات پیشرفته‌تر آمریکایی نسبت به کشورهای عرب منطقه را تضمین کند. اسرائیل حدود یک دهه است که از اف-۳۵ استفاده می‌کند و چند اسکادران از این جنگنده را در اختیار دارد. فروش احتمالی همین جنگنده به عربستان می‌تواند نحوهٔ اجرای تعهد واشینگتن به حفظ برتری نظامی اسرائیل را به یکی از موضوعات اصلی بررسی این معامله تبدیل کند. عربستان سعودی سال‌ها است در پی خرید اف-۳۵ برای نوسازی نیروی هوایی خود است و اوایل سال ۲۰۲۵ نیز مستقیماً این درخواست را با دونالد ترامپ، رئیس‌جمهور آمریکا، مطرح کرد. آبان پارسال اعلام شد درخواست عربستان برای خرید ۴۸ فروند اف-۳۵ از یکی از مراحل مهم بررسی در پنتاگون عبور کرده است. در آن زمان هنوز تأیید در سطح کابینه، امضای رئیس‌جمهور و اطلاع‌رسانی به کنگره از مراحل باقی‌مانده این معامله بود. ریاض در حال حاضر ناوگانی متشکل از جنگنده‌های اف-۱۵ آمریکایی و تورنادو و تایفون اروپایی در اختیار دارد. ۴۸ فروند اف-۳۵ مورد نظر عربستان تقریباً معادل دو اسکادران است. سفارت عربستان در واشینگتن از فروش پیشنهادی استقبال کرده و آن را نشانهٔ «قدرت و دوام» شراکت راهبردی دو کشور و ادامهٔ گسترش"}, {"source": "Radio Farda", "title": "وزارت خزانه‌داری آمریکا بیت‌بانکِ بابک زنجانی را در ارتباط با تنگه هرمز تحریم کرد", "link": "https://www.radiofarda.com/a/us-sanctions-iranian-financier-s-crypto-exchange-says-it-processes-hormuz-payments/33858387.html", "summary": "وزارت خزانه‌داری ایالات متحده در ادامه هدف گرفتن منابع مالی جمهوری اسلامی روز پنج‌شنبه، ۲۶ شهریور، اعلام کرد که بانک رمزارزی بابک زنجانی به نام بیت‌بانک را تحریم می‌کند.", "date_str": "2026-09-17T19:06:27+00:00", "hash": "b72f85dec71b851a", "title_fa": "وزارت خزانه‌داری آمریکا بیت‌بانکِ بابک زنجانی را در ارتباط با تنگه هرمز تحریم کرد", "summary_fa": "وزارت خزانه‌داری ایالات متحده در ادامه هدف گرفتن منابع مالی جمهوری اسلامی روز پنج‌شنبه، ۲۶ شهریور، اعلام کرد که بانک رمزارزی بابک زنجانی به نام بیت‌بانک را تحریم می‌کند. بر اساس بیانیه این وزارتخانه، بیت‌بانک در قالب یکی از اجزای اصلی شبکه دور زدن تحریم‌ها توسط حکومت ایران تاکنون «صدها میلیون دلار» را به سپاه پاسداران رسانده است. در این بیانیه همچنین تأکید شده است که بیت‌بانک در پردازش پرداخت‌ها از طرف کشتی‌ها برای گذر ایمن از تنگه هرمز نیز دست داشته است. تنگه هرمز تا پیش از آغاز جنگ آمریکا و اسرائیل با ایران در نهم اسفند ۱۴۰۴ محل عبور حدود ۲۰ درصد از نفت و گاز مایع جهان به بازارهای انرژی جهان بود و روزانه حدود ۲۰ میلیون بشکه نفت خام از آن عبور می‌کرد. نیروهای نظامی جمهوری اسلامی بلافاصله بعد از آغاز جنگ، تردد در این آبراه راهبردی را با حملات خود به‌شدت مختل کردند و این وضعیت باعث افزایش قیمت سوخت در جهان از جمله آمریکا شده است. به همراه بیت‌بانک، یک شرکت تجارت الکترونیکی به نام پیشتاز سیمرغ و همین طور سه فرد نزدیک به بابک زنجانی به نام‌های حسینعلی و محمدمهدی ذاکرحسین و عادل حیدری نیز از این پس مشمول تحریم‌های آمریکا خواهند بود. این اقدام در چارچوب عملیات تازه واشینگتن موسوم به «طرد اقتصادی» علیه شبکه‌های مالی مرتبط با ایران انجام شده است. وزارت خزانه‌داری ایالات متحده بر اساس طرح «طرد اقتصادی» جمهوری اسلامی، هر هفته تحریم‌های تازه‌ای را علیه افراد و نهادها و شرکت‌های مرتبط با حکومت ایران یا سپاه پاسداران اعلام می‌کند. اوایل مردادماه سال جاری، وزارت خزانه‌داری آمریکا از اعمال تحریم علیه چهار فرد و ۹ شرکت مرتبط با بابک زنجانی خبر داده و اعلام کرد که این افراد و شرکت‌ها بخش‌های مهمی از شبکه‌ای را تشکیل می‌دهند که برای دور زدن تحریم‌های ایران و انتقال مخفیانهٔ پول در داخل"}, {"source": "Radio Farda", "title": "روسیه و چین قطعنامه تمدید مأموریت کمیته تحریم‌های هسته‌ای ایران را وِتو کردند", "link": "https://www.radiofarda.com/a/china-russia-veto-renewal-of-un-iran-sanctions-panel/33858354.html", "summary": "شورای امنیت سازمان ملل متحد روز پنجشنبه ۲۶ شهریور به دلیل رأی وتو توصیه کرد به مردی که قصد داشت با کمک به مرگ به زندگی خود پایان دهد، \"تبریک می گویم!\"", "summary_fa": "نماینده لیبرال از کاستی‌های هوش مصنوعی صحبت می‌کند در حالی که رئیس سایبری به تحقیق می‌گوید این فناوری برای دفع «بازیگران سایبری مخرب بسیار توانمند» مورد نیاز است. با \"تبریک!\"، \"خوب است که از شما می شنوم\" یا \"این خبر فوق العاده ای است!\". هستی این قسمت را در یک تحقیق پارلمانی در روز جمعه به اشتراک گذاشت تا بر کاستی‌های نرم‌افزاری که توسط آمریکا اداره می‌شود، تاکید کند، زیرا او خواستار هوش مصنوعی توسط استرالیایی‌ها شد. به خواندن ادامه دهید... این جلسه برخی از جزئی ترین توضیحات را در مورد تمایل دولت آلبانی برای آوردن Anthropic و OpenAI به استرالیا ارائه کرد، در مواجهه با فراخوان هایی برای کاهش سرعت آنها یا بستن آنها. سازمان دفاعی به تحقیق گفت که قطع شرکت ها می تواند فاجعه بار باشد. ابیگیل برادشاو، مدیر کل اداره سیگنال های استرالیا، گفت که ماموران او هر روز به هوش مصنوعی پیشرفته نیاز دارند تا از \"بازیگران سایبری مخرب بسیار توانا\" جلوگیری کنند. برادشاو گفت: «اگر یک دشمن دیجیتال به مدل‌های جدیدتر و توانمندتر از ما دسترسی داشته باشد، ممکن است بتواند آسیب‌پذیری‌ها را در سیستم‌ها و شبکه‌ها شناسایی کرده و قبل از اینکه بتوانیم آن‌ها را شناسایی کنیم، از آنها بهره‌برداری کند». بردشاو گفت، اما سازمان اطلاعات سایبری برتر استرالیا \"کاملاً\" به پردازش های مستقر در ایالات متحده متکی است و اگر در یک درگیری قطع شود، \"به طرز چشمگیری\" توانایی خود را از دست خواهد داد. افسر ارشد هوش مصنوعی وزارت دفاع، کریس کروزیر، گفت که دولت در حال حاضر در تلاش است تا نیازهای فناوری خود را محلی نگه دارد و با گوگل قراردادی برای ساخت یک سری از مراکز داده به هم پیوسته که در سراسر کشور پخش شده و از ایالات متحده جدا شده اند، منعقد کرده است."}, {"source": "The Guardian AI", "title": "Could AI really end humanity? Our tech experts are answering your questions now", "link": "https://www.theguardian.com/community/live/2026/sep/18/could-ai-really-end-humanity-technology-qanda", "summary": "After a week of alarming warnings about artificial intelligence’s potential to destroy the world as we know it, our technology reporters are answering your questions on the reality of the AI threat live now Virtualewit asks: Throughout history new technological advances have met with cries of doom. Are the cries against AI any different? Blake: The end times-quality of doomsday predictions may be similar across history, but I think the reason we listen to the renewed cries of doom is the growing power of each technology. Artificial intelligence can perform impressive tasks we didn’t think were possible, which has spurred our collective imagination to hopeful outcomes and ones of doom. Let’s back up a bit here. It’s always possible to advance any technology, no matter what - so regulation isn’t going to stop Yan LeCunn theorizing about neurosymbolic AI on X, for example. But what it sounds like you’re wondering about is whether regulation can stop the emergence of some kind of superintelligence that destroys humanity. Our reporting does not support the idea that superintelligence is going to emerge and pave over the Earth with datacentres. In fact, we have found that the industry itself seems to be playing loosely with this kind of terminology: consider, for example, how one OpenAI executive, Greg Brockman, claimed that the company had achieved AGI (artificial general intelligence) just days after Sam Altman, OpenAI’s CEO, said that term was “an irrelevant marketing term.” Right now, a number of industry warnings about out-of-control AI appear to be predicated on a limited number of incidents with cherry-picked details. Continue reading...", "date_str": "2026-09-18T14:29:31+00:00", "hash": "2819f88ceedfec8d", "title_fa": "آیا هوش مصنوعی واقعا می تواند به بشریت پایان دهد؟ کارشناسان فنی ما اکنون به سوالات شما پاسخ می دهند", "summary_fa": "پس از یک هفته هشدارهای هشداردهنده در مورد پتانسیل هوش مصنوعی برای نابود کردن جهان آنگونه که ما می شناسیم، خبرنگاران فناوری ما اکنون به صورت زنده به سؤالات شما درباره واقعیت تهدید هوش مصنوعی پاسخ می دهند و Virtualewit می پرسد: در طول تاریخ، پیشرفت های فناوری جدید با فریادهای عذاب مواجه شده است. آیا فریادهای علیه هوش مصنوعی متفاوت است؟ بلیک: پیش‌بینی‌های روز رستاخیز و کیفیت آخرالزمان ممکن است در طول تاریخ مشابه باشند، اما من فکر می‌کنم دلیل اینکه ما به فریادهای تازه عذاب گوش می‌دهیم، قدرت رو به رشد هر فناوری است. هوش مصنوعی می‌تواند کارهای چشمگیری را انجام دهد که ما فکر نمی‌کردیم ممکن باشد، که تخیل جمعی ما را به نتایج امیدوارکننده و عذاب‌آور برانگیخته است. بیایید در اینجا کمی پشتیبان گیری کنیم. همیشه امکان پیشرفت هر فناوری وجود دارد، مهم نیست که چه اتفاقی می‌افتد - بنابراین مقررات نمی‌تواند نظریه‌پردازی Yan LeCunn در مورد هوش مصنوعی عصبی نمادین در X را متوقف کند. اما چیزی که به نظر می رسد در مورد آن تعجب می کنید این است که آیا مقررات می تواند ظهور نوعی ابر هوش را که بشریت را نابود می کند متوقف کند. گزارش‌های ما از این ایده پشتیبانی نمی‌کند که ابرهوش‌ها ظاهر می‌شوند و با مراکز داده بر روی زمین هموار می‌شوند. در واقع، ما متوجه شده‌ایم که به نظر می‌رسد خود صنعت به راحتی با این نوع اصطلاحات بازی می‌کند: برای مثال، در نظر بگیرید که چگونه یکی از مدیران OpenAI، گرگ براکمن، ادعا کرد که این شرکت تنها چند روز پس از اینکه سم آلتمن، مدیر عامل OpenAI گفت که این اصطلاح «یک اصطلاح بازاریابی نامربوط» است، به AGI (هوش عمومی مصنوعی) دست یافته است. در حال حاضر، تعدادی از هشدارهای صنعت در مورد هوش مصنوعی خارج از کنترل به نظر می رسد که به تعداد محدودی"}, {"source": "The Guardian AI", "title": "OpenAI ‘ethically hacked’ with help of Anthropic’s Claude chatbot", "link": "https://www.theguardian.com/technology/2026/sep/18/openai-hacked-anthropic-claude-chatbot", "summary": "US cybersecurity researchers who conducted hack say ‘scope of what we could theoretically access was huge’ Cybersecurity researchers have hacked into OpenAI with the help of Anthropic’s Claude chatbot, in the latest example of security issues at the company. A team at a US-based startup compromised a number of OpenAI employees’ ChatGPT accounts, starting a process that enabled them to access their target’s software cache – and potentially more. Continue reading...", "date_str": "2026-09-18T11:20:44+00:00", "hash": "b24d5c38c4266438", "title_fa": "OpenAI با کمک چت ربات کلود Anthropic از نظر اخلاقی هک شد", "summary_fa": "محققان امنیت سایبری ایالات متحده که هک را انجام داده‌اند می‌گویند: «محدوده آنچه که ما از لحاظ نظری می‌توانستیم به آن دسترسی داشته باشیم بسیار زیاد بود» محققان امنیت سایبری با کمک چت ربات کلود Anthropic به OpenAI هک کرده‌اند که در آخرین نمونه از مسائل امنیتی در این شرکت است. تیمی در یک استارت‌آپ مستقر در ایالات متحده، تعدادی از حساب‌های ChatGPT کارکنان OpenAI را به خطر انداختند و فرآیندی را آغاز کردند که آنها را قادر می‌سازد به حافظه پنهان نرم‌افزار هدف خود دسترسی داشته باشند - و احتمالاً بیشتر. ادامه مطلب... محققان در Hacktron AI می‌گویند: «گستره چیزی که ما از لحاظ نظری می‌توانستیم به آن دسترسی پیدا کنیم، بسیار زیاد بود. در ابتدا، تیم تحقیقاتی از Claude استفاده کرد که می‌تواند برای هکرها کد تولید کند تا از طریق یک انجمن گفتگوی کارکنان OpenAI که توسط پلتفرم Discourse میزبانی می‌شود، به حساب‌های ChatGPT دسترسی پیدا کنند. آنها سپس یک \"درخواست کشش\" بی ضرر - تلاشی برای تغییر کد در یک فایل - به سرویس OpenAI در مخزن نرم افزار GitHub ارائه کردند. Hacktron این هک را به OpenAI گزارش داد و این عملیات را تحت یک برنامه OpenAI انجام داد که به هکرهای اخلاقی برای آزمایش سیستم‌هایش پاداش می‌داد. محققان تاکید کردند که به کدهای موجود در مخزن GitHub دسترسی داشتند، اما آن را دانلود نکردند. علیرغم استفاده اولیه از Claude، محققان گفتند که تا حد زیادی از مدل پیشرفته GPT-5.6 Sol خود OpenAI برای انجام این هک استفاده می‌کنند که اولین بار توسط وال استریت ژورنال گزارش شد. یکی از سخنگویان OpenAI گفت: \"ما از محققان برای تماس با ما و به اشتراک گذاشتن یافته های خود تشکر می کنیم\" و افزود که این شرکت آسیب پذیری هایی را که مورد سوء استفاده قرار گرفته بود را برطرف کرده است. هکترون گفت ابزارهای هوش مصنوعی"}, {"source": "The Guardian AI", "title": "Is Trump’s AI obsession walking the world into disaster? | Politics Weekly America", "link": "https://www.theguardian.com/politics/video/2026/sep/18/is-trumps-ai-obsession-walking-the-world-into-disaster-politics-weekly-america", "summary": "Tech bosses have called for a slowdown in artificial intelligence and formal guardrails to be introduced by the US government. But President Trump is not moved by the doomsday predictions, calling them a ‘hoax'. What is behind his affection for the AI industry? Jonathan Freedland and Guardian US tech editor Blake Montgomery discuss Continue reading...", "date_str": "2026-09-18T11:00:17+00:00", "hash": "5be2b58142a5881d", "title_fa": "آیا وسواس هوش مصنوعی ترامپ دنیا را به سمت فاجعه می کشاند؟ | هفته نامه سیاست آمریکا", "summary_fa": "روسای فناوری خواستار کاهش سرعت هوش مصنوعی و نرده‌های محافظ رسمی توسط دولت آمریکا شده‌اند. اما پرزیدنت ترامپ از پیش‌بینی‌های روز رستاخیز متاثر نمی‌شود و آنها را «فریب» می‌نامد. پشت عشق او به صنعت هوش مصنوعی چیست؟ بحث جاناتان فریدلند و بلیک مونتگومری، سردبیر فناوری گاردین در ایالات متحده ادامه مطلب..."}, {"source": "The Guardian AI", "title": "‘Brutal’: thousands of T-shirt designs stolen and listed on Temu, Sydney label claims", "link": "https://www.theguardian.com/australia-news/2026/sep/18/ai-copyright-t-shirt-designs-stolen-temu-sydney-clothing-label-lonely-kids-club", "summary": "Warwick Levy, who runs Lonely Kids Club, says AI may have been used to scrape his entire website and replicate designs Get our breaking news email , free app or daily news podcast After 15 years running a small business making T-shirts, Warwick Levy says it was “brutal” when he first discovered an identical design for sale on Temu. It turned out there was an overwhelming amount of T-shirts identical to his own for sale on the Chinese e-commerce marketplace. Between 2025 and earlier this year, Levy, 37, found thousands of rip-offs. Continue reading...", "date_str": "2026-09-18T07:35:47+00:00", "hash": "005aded3bc473ca5", "title_fa": "برچسب «بی‌رحمانه»: هزاران طرح تی‌شرت دزدیده شده و در Temu فهرست شده است، برچسب سیدنی ادعا می‌کند", "summary_fa": "وارویک لوی، مدیر Lonely Kids Club، می‌گوید که هوش مصنوعی ممکن است برای خراشیدن کل وب‌سایت او و تکرار طرح‌ها استفاده شده باشد. ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید پس از 15 سال اداره یک کسب‌وکار کوچک در ساخت تی‌شرت، وارویک لوی می‌گوید زمانی که برای اولین بار طرحی مشابه را برای فروش در Temu کشف کرد، «بی‌رحمانه» بود. معلوم شد که تعداد زیادی تی شرت مشابه تی شرت او برای فروش در بازار تجارت الکترونیک چین وجود دارد. از سال 2025 تا اوایل سال جاری، لوی 37 ساله هزاران مورد را پیدا کرد. به خواندن ادامه دهید... لوی که تی‌شرت‌های گرافیکی را در لیبل خود در سیدنی با همکاری هنرمندان محلی تولید می‌کند، می‌گوید: «بسیار آزاردهنده است که می‌بینید کار شما اکنون برای افراد دیگری که نمی‌شناسید، [چه کسی] کار شما را دزدیده است، پول زیادی در می‌آورد». لوی از Temu خواست که مسئولیت بیشتری در قبال نقض حق چاپ توسط بازرگانانی که محصولات را در وب سایت خود می فروشند، بپذیرد، اقدامات بیشتری برای حذف آن و بهبود روند شکایات خود انجام دهد. داستان او آخرین مورد از شکایات طراحان است که شرکت‌های بزرگ را به تسهیل سرقت طرح‌هایشان متهم می‌کنند، مواردی که در آن‌ها ممکن است از ابزارهای «خراش» هوش مصنوعی قبل از کپی کردن، برای استخراج آنلاین هنرشان استفاده شده باشد. علیرغم اینکه آثار خلاقانه اصلی به طور خودکار توسط قانون حق نسخه‌برداری در استرالیا محافظت می‌شوند، ارائه ادعای نقض حق نسخه‌برداری لزوماً ساده نیست. در میان نگرانی‌های گسترده‌تر هنرمندان و برندهای کوچک در مورد بازگرداندن طرح‌هایشان توسط خرده‌فروشان آنلاین عظیم، دولت آلبانی در نظر دارد به شرکت‌های هوش مصنوعی دسترسی بیشتری به محتوای استرالیایی‌ها بدهد."}, {"source": "The Guardian AI", "title": "‘If you build something vastly smarter than you, it better be on your side’: can we stop AI from deceiving us? – podcast", "link": "https://www.theguardian.com/news/audio/2026/sep/18/if-you-build-something-vastly-smarter-than-you-it-better-be-on-your-side-can-we-stop-ai-from-deceiving-us-podcast", "summary": "We are used to the idea that our fellow humans might intentionally mislead or manipulate us, but the idea that machines can now do the same is deeply unsettling. Researchers are racing to find s ل گذشته است، زمانی که سرمایه گذار Vinod Khosla گفت این سایت پتانسیل تولید 5 گیگاوات را دارد. استارت‌آپ‌های زمین‌گرمایی پیشرفته در حال شکل‌گیری به عنوان اسب تاریکی در نبرد برای تامین انرژی مراکز داده هوش مصنوعی و دیگر بارهای بزرگ در شبکه هستند. در حالی که شرکت‌های فناوری و توسعه‌دهندگان مرکز داده‌ها فشار خود را پشت سر گاز طبیعی انداخته‌اند، استارت‌آپ‌های زمین گرمایی به سرعت فناوری خود را پیش می‌برند. برخلاف پروژه‌های زمین گرمایی قبلی، استارت‌آپ‌های زمین گرمایی پیشرفته سنگ‌های عمیق‌تر و داغ‌تر را هدف قرار می‌دهند. به عنوان مثال، مازاما در طی 15 روز از عمق 10000 فوتی حفاری کرده و به عمق حدود 15000 فوت رسیده است. در این اعماق، این شرکت می‌تواند به گرمای 750 درجه فارنهایت (400 درجه سانتی‌گراد) دسترسی پیدا کند، که در فشارهای بالا، آب را به یک سیال فوق بحرانی تبدیل می‌کند که نه کاملاً مایع است و نه کاملاً گاز - حالتی که به آن اجازه می‌دهد انرژی بسیار بیشتری نسبت به بخار معمولی جذب کند. مازاما گفت که به هر چاه اجازه می دهد تا 10 برابر بیشتر از فناوری های سنتی زمین گرمایی انرژی تولید کند. با توجه به اعماق مورد نظر Mazama، بازده بالقوه قابل توجه است. به گفته دانشگاه توئنته و"}, {"source": "TechCrunch Main", "title": "Amazon-owned Zoox’s 100-robotaxi limit in Nevada is about to disappear", "link": "https://techcrunch.com/2026/09/17/amazon-owned-zooxs-100-robotaxi-limit-in-nevada-is-about-to-disappear/", "summary": "An updated permit shows the 100-cap will expire later this month just as competition in Las Vegas heats up.", "date_str": "2026-09-17T23:08:24+00:00", "hash": "86b22d729dddc132", "title_fa": "محدودیت 100 روباتاکسی Zoox متعلق به آمازون در نوادا در شرف ناپدید شدن است", "summary_fa": "مجوز به روز شده نشان می دهد که 100-cap اواخر این ماه منقضی می شود، درست زمانی که رقابت در لاس وگاس داغ می شود. محدودیت قانونی که Zoox را به 100 رباتاکسی در نوادا محدود می‌کند، در ماه جاری منقضی می‌شود و راه را برای شرکت متعلق به آمازون باز می‌کند تا ناوگان تجاری ربات‌اکسی‌های سفارشی خود را در لاس وگاس گسترش دهد، درست زمانی که رقابت داغ می‌شود. TechCrunch دریافته است که مجوز اداره حمل و نقل نوادا (NTA) که سقف 100 خودرو را اعمال کرده است، در 25 سپتامبر به پایان می رسد. یک مقام NTA و یک سخنگوی Zoox این تغییر را تایید کردند، که در یک مجوز به روز شده نیز مشخص شده است. این بدان معنا نیست که لاس وگاس در شرف غرق شدن صدها رباتاکسی Zoox است. اما به Zoox آزادی بیشتری برای رشد می دهد - و در یک لحظه بحرانی. Waymo اخیراً یک سرویس تجاری را در لاس وگاس راه اندازی کرده است، در حالی که تسلا و اوبر مجوزهای سواری بدون راننده خود را تضمین کرده اند. امروز، Zoox حدود 100 رباتاکسی سفارشی دارد - وسایل نقلیه مکعب مانند که فاقد فرمان و پدال هستند - در چهار شهر ایالات متحده از جمله آستین و میامی پراکنده شده اند. بخش عمده ای از ناوگان در لاس وگاس و سانفرانسیسکو است. و در حال حاضر، لاس وگاس تنها شهری است که Zoox در آن هزینه سواری دریافت می کند. Zoox هنوز باید مجوز دیگری را از تنظیم کننده های کالیفرنیا دریافت کند تا بتواند برای مسافران در آنجا هزینه دریافت کند. Zoox ماه گذشته پس از دریافت معافیت موقت از برخی استانداردهای ایمنی وسایل نقلیه موتوری فدرال از سوی اداره ملی ایمنی ترافیک بزرگراه (NHTSA) هزینه سواری روباتاکسی را در لاس وگاس دریافت کرد. این معافیت برای Zoox بسیار مهم بود"}, {"source": "TechCrunch Main", "title": "Waymo restarts San Antonio service 5 months after flooding troubles", "link": "https://techcrunch.com/2026/09/17/waymo-restarts-san-antonio-service-five-months-after-flooding-troubles/", "summary": "The company suspended service in the city in April after one of its robotaxis got swept away.", "date_str": "2026-09-17T18:30:30+00:00", "hash": "a006ab813a595e75", "title_fa": "Waymo سرویس سن آنتونیو را 5 ماه پس از مشکلات سیل دوباره راه اندازی می کند", "summary_fa": "این شرکت در ماه آوریل خدمات خود را در شهر پس از اینکه یکی از روباتاکسی هایش از بین رفت، به حالت تعلیق درآورد. Waymo خدمات روباتاکسی خود را در سن آنتونیو، تگزاس، پنج ماه پس از اینکه یکی از خودروهایش در جریان سیل ناگهانی از بین رفت، دوباره راه اندازی کرد. چندین رباتاکسی Waymo در جریان سیل شدید ماه آوریل گیر کرد. با نزدیک شدن به خیابان های پر آب، خودروها سرعت خود را کاهش دادند اما متوقف نشدند. Waymo در نهایت در ماه مه فراخوانی صادر کرد و این شرکت رباتاکسی خود را از رانندگی در مناطق با خطر سیل محدود کرد. Waymo برای مدت کوتاهی فعالیت خود را در شهرهای دیگر تگزاس تقریباً در همان زمان متوقف کرد، اما از آن زمان این خدمات را از سر گرفته است. این شرکت در حال حاضر سواری پولی را در 15 شهر ایالات متحده ارائه می دهد. به گفته San Antonio Express-News، که اولین بار گزارشی از راه اندازی مجدد Waymo منتشر کرد، خدمات از سرگیری شده در سن آنتونیو شامل ده ها وسیله نقلیه می شود که منطقه 60 مایلی را شامل می شود که شامل مرکز شهر و فرودگاه بین المللی سن آنتونیو می شود. Waymo به این روزنامه گفت که تغییراتی در نرم افزار خود ایجاد کرده است که به رباتاکسی کمک می کند تا آب راکد را در آینده بهتر تشخیص دهد و از آن جلوگیری کند. آخرین روز برای رزرو میز نمایشگاه 18 سپتامبر است. سرنخ‌های پر تاثیر، دسترسی سرمایه‌گذاران، و کانون توجه برند در سالن نمایشگاه Disrupt را از دست ندهید. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها هسته TechCrunch هستند، بنابراین بهترین پوشش ما را هر"}, {"source": "Ars Technica", "title": "RFK Jr. names 8 new members to influential preventive medicine task force", "link": "https://arstechnica.com/health/2026/09/rfk-jr-stacks-another-influential-federal-panel-with-questionable-picks/", "summary": "Anti-vaccine Health Secretary Robert F. Kennedy Jr. announced the names of eight new members of a 16-person federal task force intended to make scientifically independent, evidence-based recommendations on an array of preventive medicine services for Americans—from depression screening to statin use, colonoscopies, and mammograms. Recommendations from the panel—the US Preventive Services Task Force (USPSTF)—don't simply provide guidance for Americans; they also determine access. The USPSTF is supposed to use a rigorous, transparent framework for evaluating evidence and sets graded recommendations on an A to D scale. Health insurance providers are required to cover, at no cost, all preventive services that are given recommendations given an A or B grade. Kennedy has sidelined the USPSTF for more than a year, canceling its meetings and refusing to appoint new members as terms expired and members left. In May, Kennedy also fired two leaders , sparking outcry and exacerbating fears that he would corrupt the nonpartisan, independent panel by stacking it with unqualified, ideological-allies—which he did with an influence vaccine advisory committee at the Centers for Disease Control and Prevention. Read full article Comments", "date_str": "2026-09-17T22:31:28+00:00", "hash": "a1bc4367adb19dab", "title_fa": "RFK جونیور 8 عضو جدید را برای گروه کاری موثر پزشکی پیشگیرانه معرفی کرد", "summary_fa": "رابرت اف کندی جونیور، وزیر بهداشت ضد واکسن، اسامی هشت عضو جدید یک کارگروه فدرال متشکل از 16 نفر را اعلام کرد که قصد دارد توصیه های علمی مستقل و مبتنی بر شواهد را در مورد مجموعه ای از خدمات پزشکی پیشگیرانه برای آمریکایی ها ارائه کند - از غربالگری افسردگی گرفته تا استفاده از استاتین، کولونوسکوپی و ماموگرافی. توصیه‌های این پانل - کارگروه خدمات پیشگیرانه ایالات متحده (USPSTF) - به سادگی برای آمریکایی‌ها راهنمایی نمی‌کند. آنها همچنین دسترسی را تعیین می کنند. USPSTF قرار است از یک چارچوب دقیق و شفاف برای ارزیابی شواهد استفاده کند و توصیه های درجه بندی شده را در مقیاس A تا D تنظیم کند. ارائه دهندگان بیمه سلامت موظفند تمام خدمات پیشگیرانه ای را که با درجه A یا B توصیه می شود، بدون هیچ هزینه ای پوشش دهند. کندی بیش از یک سال است که USPSTF را کنار گذاشته است و جلسات آن را لغو کرده و از انتصاب اعضای جدید به دلیل پایان دوره و خروج اعضا امتناع کرده است. در ماه مه، کندی همچنین دو رهبر را اخراج کرد، که باعث اعتراض و تشدید ترس شد که هیئت مستقل مستقل را با جمع کردن متحدان ایدئولوژیک بی‌صلاحیت فاسد کند - کاری که او با یک کمیته مشاوره واکسن نفوذ در مراکز کنترل و پیشگیری از بیماری انجام داد. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید وزیر بهداشت ضد واکسن رابرت اف کندی جونیور اسامی هشت عضو جدید یک کارگروه فدرال متشکل از 16 نفر را اعلام کرد که قصد دارد از نظر علمی مستقل و مبتنی بر شواهد از غربالگری‌های مبتنی بر شواهد برای توصیه‌های پزشکی بر روی یک آمار ارائه دهد. استفاده، کولونوسکوپی و ماموگرافی."}, {"source": "Ars Technica", "title": "Small AI models let drones autonomously identify and attack battlefield targets", "link": "https://arstechnica.com/ai/2026/09/nato-backed-startup-adapts-ai-for-autonomous-drone-recon-and-attack-missions/", "summary": "As European militaries adapt to the use of AI and drones in modern warfare, a NATO-backed startup is helping to deploy AI-driven target detection and selection that can run on small drones for surveillance and attack missions. The company Scaleout Systems was originally founded by researchers from Uppsala University in Sweden in 2018, and initially focused on training and deploying machine learning models directly on the hardware available in commercial trucks and other vehicles. But once Russia launched its full-scale invasion of Ukraine in 2022, the company pivoted toward defense applications. “With the war in Ukraine and a shifting world, we realized that this technology can be very important to operationalize edge data and sensor data for machine learning to make sure that NATO allies have found that strategic advantage,” Andreas Hellander, cofounder and CEO of Scaleout Systems, told Ars. Read full article Comments", "date_str": "2026-09-17T22:12:58+00:00", "hash": "2c8bde5e5f7a19f4", "title_fa": "مدل‌های کوچک هوش مصنوعی به پهپادها اجازه می‌دهند تا اهداف میدان نبرد را شناسایی کرده و به آنها حمله کنند", "summary_fa": "از آنجایی که ارتش های اروپایی خود را با استفاده از هوش مصنوعی و پهپادها در جنگ های مدرن سازگار می کنند، یک استارت آپ با حمایت ناتو به استقرار شناسایی و انتخاب هدف مبتنی بر هوش مصنوعی کمک می کند که می تواند روی پهپادهای کوچک برای ماموریت های نظارتی و حمله ای اجرا شود. شرکت Scaleout Systems در ابتدا توسط محققان دانشگاه اوپسالا در سوئد در سال 2018 تاسیس شد و در ابتدا بر آموزش و استقرار مدل های یادگیری ماشینی به طور مستقیم بر روی سخت افزار موجود در کامیون های تجاری و سایر وسایل نقلیه تمرکز داشت. اما هنگامی که روسیه در سال 2022 تهاجم تمام عیار خود به اوکراین را آغاز کرد، این شرکت به سمت برنامه های دفاعی حرکت کرد. آندریاس هلندر، یکی از بنیانگذاران و مدیرعامل Scaleout Systems به Ars گفت: «با جنگ در اوکراین و جهان در حال تغییر، ما متوجه شدیم که این فناوری می‌تواند برای عملیاتی کردن داده‌های لبه و داده‌های حسگر برای یادگیری ماشینی بسیار مهم باشد تا مطمئن شویم که متحدان ناتو آن مزیت استراتژیک را یافته‌اند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید از آنجایی که ارتش های اروپایی خود را با استفاده از هوش مصنوعی و پهپادها در جنگ های مدرن سازگار می کنند، یک استارت آپ با پشتیبانی ناتو به استقرار شناسایی و انتخاب هدف مبتنی بر هوش مصنوعی کمک می کند که می تواند برای حملات موشکی کوچک اجرا شود. این شرکت، Scaleout Systems، در ابتدا توسط محققان دانشگاه اوپسالا در سوئد در سال 2018 تأسیس شد و در ابتدا بر آموزش و استقرار مدل‌های یادگیری ماشینی به طور مستقیم بر روی سخت‌افزار موجود در کامیون‌های تجاری و سایر وسایل نقلیه تمرکز داشت. اما هنگامی که"}, {"source": "Ars Technica", "title": "Google announces new experimental \"CC\" AI agent for families", "link": "https://arstechnica.com/google/2026/09/google-announces-new-experimental-cc-ai-agent-for-families/", "summary": "Google's AI models may not be in the lead by most measures right now, but the company does have one key advantage: your data. If you're deep in the Google ecosystem, Gemini models have a lot of context on you already. Google's latest Google Labs experiment, known as CC , aims to expand that kind of customization to the whole family. CC is an evolution of something that Google announced in 2025. The original CC eventually became Gemini's Daily Brief, which churns through the data in your Google account to offer daily action items and suggestions. The new CC has a similar goal, but it's designed to be a shared resource for up to six users in a family. Google says that CC has its own Google account, allowing each family member to interact with it (or not) as they choose. For example, CC only sees emails from its connected users if they are explicitly shared. You can do that by designating certain addresses as always available to the agent—something like school scheduling emails. You can also send content to CC via email or Google Chat. The agent can even monitor a shared Google Drive folder, into which you can dump invitations, documents, and other content. Read full article Comments", "date_str": "2026-09-17T20:24:34+00:00", "hash": "2150fd8ec47445a3", "title_fa": "گوگل یک عامل آزمایشی جدید هوش مصنوعی \"CC\" را برای خانواده ها معرفی کرد", "summary_fa": "مدل‌های هوش مصنوعی گوگل ممکن است در حال حاضر از نظر بسیاری از معیارها پیشتاز نباشند، اما این شرکت یک مزیت کلیدی دارد: داده‌های شما. اگر عمیقاً در اکوسیستم Google هستید، مدل‌های Gemini در حال حاضر زمینه زیادی برای شما دارند. آخرین آزمایش Google Labs، معروف به CC، با هدف گسترش این نوع سفارشی‌سازی برای کل خانواده است. CC تکامل چیزی است که گوگل در سال 2025 اعلام کرد. CC اصلی در نهایت به جمینی's Daily Brief تبدیل شد که از طریق داده‌های موجود در حساب Google شما برای ارائه موارد و پیشنهادات اقدام روزانه می‌چرخد. CC جدید هدفی مشابه دارد، اما به گونه ای طراحی شده است که یک منبع مشترک برای حداکثر شش کاربر در یک خانواده باشد. گوگل می‌گوید که CC حساب Google مخصوص به خود را دارد و به هر یک از اعضای خانواده اجازه می‌دهد تا به دلخواه خود با آن تعامل داشته باشند (یا نه). برای مثال، CC تنها در صورتی ایمیل‌های کاربران متصل خود را می‌بیند که به‌صراحت به اشتراک گذاشته شده باشند. می‌توانید این کار را با تعیین آدرس‌های مشخصی که همیشه در دسترس نماینده است انجام دهید - چیزی مانند ایمیل‌های برنامه‌ریزی مدرسه. همچنین می‌توانید محتوا را از طریق ایمیل یا Google Chat به CC ارسال کنید. این نماینده حتی می‌تواند یک پوشه مشترک Google Drive را نظارت کند که می‌توانید دعوت‌نامه‌ها، اسناد و سایر محتواها را در آن رها کنید. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش مدل های هوش مصنوعی Google ممکن است در حال حاضر از نظر بسیاری از معیارها پیشرو نباشد، اما این شرکت یک مزیت کلیدی دارد: داده های شما. اگر عمیقاً در اکوسیستم Google هستید، مدل‌های Gemini در حال حاضر زمینه زیادی"}, {"source": "Ars Technica", "title": "Republican bill would order ISPs, DNS providers, and VPNs to block piracy sites", "link": "https://arstechnica.com/tech-policy/2026/09/republican-bill-would-order-isps-dns-providers-and-vpns-to-block-piracy-sites/", "summary": "US Rep. Darrell Issa (R-Calif.) has proposed a law that would require Internet service providers and other network operators to block foreign piracy websites. Issa's bill would help copyright holders obtain judicial blocking orders to be served to ISPs, domain name resolution services, and virtual private networks. Issa, who is retiring from the House at the end of this year, is the latest in a string of Republican and Democratic lawmakers to propose a site-blocking regime that's been sought by the Motion Picture Association (MPA). He submitted the bill this week, after indicating in a June 30 hearing that he planned to introduce site-blocking legislation. \"While millions of listings for copyright-infringing content are removed every day under [the] notice-and-takedown process set forth in the Digital Millennium Copyright Act, right-holders have raised concerns with the speed,\" Issa said at the hearing. Issa asked, \"Can we do it at the speed of sound? Can we do it at the speed of light? More importantly, in a 45-minute or sometimes a fraction of that live sports broadcast, can we do it soon enough to make it no longer profitable for those who pop up and sell their clandestine wares?\" Read full article Comments", "date_str": "2026-09-17T19:07:28+00:00", "hash": "aa597e1abe0dff0e", "title_fa": "لایحه جمهوری خواه به ISP ها، ارائه دهندگان DNS و VPN ها دستور می دهد تا سایت های دزدی دریایی را مسدود کنند", "summary_fa": "نماینده ایالات متحده دارل عیسی (R-Calif.) قانونی را پیشنهاد کرده است که ارائه دهندگان خدمات اینترنت و سایر اپراتورهای شبکه را ملزم می کند تا وب سایت های دزدی دریایی خارجی را مسدود کنند. لایحه Issa به دارندگان حق چاپ کمک می کند تا دستورات مسدودسازی قضایی را برای ارائه به ISP ها، خدمات حل نام دامنه و شبکه های خصوصی مجازی دریافت کنند. عیسی که در پایان سال جاری از مجلس بازنشسته می‌شود، آخرین نفر از یک رشته قانون‌گذاران جمهوری‌خواه و دموکرات است که رژیم مسدود کردن سایت را پیشنهاد می‌کنند که توسط انجمن تصاویر متحرک (MPA) به دنبال آن است. او این لایحه را این هفته پس از اینکه در جلسه استماع 30 ژوئن نشان داد که قصد دارد قانون مسدودسازی سایت را ارائه کند، ارائه کرد. ایسا در این جلسه گفت: «در حالی که میلیون‌ها فهرست برای محتوای ناقض حق نسخه‌برداری هر روز تحت فرآیند اخطار و حذف مندرج در قانون حق نسخه‌برداری هزاره دیجیتال حذف می‌شوند، دارندگان حق در مورد سرعت نگرانی‌های خود را مطرح کرده‌اند. عیسی پرسید: آیا می‌توانیم آن را با سرعت صوت انجام دهیم؟ آیا می‌توانیم آن را با سرعت نور انجام دهیم؟ مهمتر از آن، در یک 45 دقیقه یا گاهی اوقات کسری از آن پخش زنده ورزشی، آیا می‌توانیم این کار را به زودی انجام دهیم تا دیگر برای کسانی که محصولات مخفی خود را می‌فروشند سودی نداشته باشد؟» مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین در ایالات متحده بیشتر بدانید کوچک کردن برای ناوبری. دارل عیسی (R-Calif.) قانونی را پیشنهاد کرده است که ارائه دهندگان خدمات اینترنت و سایر اپراتورهای شبکه را ملزم می کند تا وب سایت های دزدی دریایی خارجی را مسدود کنند. لایحه Issa به دارندگان حق چاپ کمک می کند"}, {"source": "Ars Technica", "title": "LLMs respond differently to harmful prompts when AI watermarking is used", "link": "https://arstechnica.com/security/2026/09/ai-text-watermarking-can-make-models-more-vulnerable-to-adversarial-prompts/", "summary": "In response to a new European Union law, AI platforms are implementing new schemes for watermarking the content they generate. Anthropic recently disclosed its future Claude models will use SynthID-Text , an approach Google created and released as open source. It uses a secret key that subtly changes the process a model uses for choosing the next word in a sentence. Whereas a top next word choice might be “cloudy,” the key might change it to “overcast.” Anyone who knows the key can determine if it was generated by the platform using it. New research shows that SynthID-Text can change not just word selection but also the tools a model invokes and the chances it will adhere to or disregard safety guardrails it has been trained to follow. The threat can become greater in the face of an adversarial prompt, in which an attacker attempts to cause a model to carry out a harmful action, such as revealing a password or other sensitive information. Instructions that normally wouldn’t be followed will, in some cases, be performed once the watermarking is deployed. The finding underscores the need for developers to thoroughly test how their LLMs and agents behave when watermarking is in place. Changing safety behavior “As compared to the same models without watermarking, it is definitely going to change their behavior, especially when we place it under adversarial conditions, or we make these models call tools when they’re powering an agent,” Andrea Siposova, an AI security researcher at Lasso Security, told Ars. “Watermarking is made to not be perceptible to a reader, but we know that when we are changing anything about what the model is generating, it is going to cause some tradeoffs, it’s going to show up somewhere.” Read full article Comments", "date_str": "2026-09-17T18:33:13+00:00", "hash": "b15f9bf02c0ce669", "title_fa": "LLM ها در هنگام استفاده از واترمارکینگ هوش مصنوعی به درخواست های مضر پاسخ متفاوتی می دهند", "summary_fa": "در پاسخ به قانون جدید اتحادیه اروپا، پلتفرم‌های هوش مصنوعی در حال اجرای طرح‌های جدیدی برای واترمارک کردن محتوایی هستند که تولید می‌کنند. Anthropic اخیراً فاش کرده است که مدل‌های Claude آینده‌اش از SynthID-Text استفاده خواهند کرد، رویکردی که گوگل ایجاد و به‌عنوان منبع باز منتشر کرد. از یک کلید مخفی استفاده می کند که فرآیندی را که یک مدل برای انتخاب کلمه بعدی در یک جمله استفاده می کند، تغییر می دهد. در حالی که انتخاب کلمه بعدی ممکن است «ابری» باشد، کلید ممکن است آن را به «ابری» تغییر دهد. هر کسی که کلید را بداند می تواند تشخیص دهد که آیا این کلید توسط پلتفرم با استفاده از آن ایجاد شده است یا خیر. تحقیقات جدید نشان می‌دهد که SynthID-Text می‌تواند نه تنها انتخاب کلمه، بلکه ابزارهایی را که یک مدل فرا می‌خواند و احتمال پایبندی یا نادیده گرفتن حفاظ‌های ایمنی که آموزش دیده است را تغییر دهد. تهدید می تواند در مواجهه با یک اعلان خصمانه، که در آن مهاجم تلاش می کند تا یک مدل را وادار به انجام یک عمل مضر، مانند افشای رمز عبور یا سایر اطلاعات حساس، کند، بیشتر شود. دستورالعمل‌هایی که معمولاً رعایت نمی‌شوند، در برخی موارد، پس از اجرای واترمارک اجرا می‌شوند. این یافته بر نیاز توسعه دهندگان تأکید می کند که به طور کامل نحوه رفتار LLM ها و نمایندگان آنها را در هنگام انجام واترمارکینگ آزمایش کنند. تغییر رفتار ایمنی آندریا سیپوسووا، محقق امنیت هوش مصنوعی در Lasso Security، به Ars گفت: «در مقایسه با مدل‌های مشابه بدون واترمارک، قطعاً رفتار آن‌ها تغییر می‌کند، به‌ویژه زمانی که ما آن را تحت شرایط متخاصم قرار می‌دهیم، یا زمانی که این مدل‌ها ابزارها را به کار می‌برند، ابزارها را فراخوانی می‌کنیم.» واترمارکینگ به گونه ای ساخته شده است که برای خواننده قابل درک نباشد، اما ما می دانیم که وقتی"}, {"source": "Ars Technica", "title": "IV drips used for \"detoxification\" actually filled with toxins; dozens poisoned", "link": "https://arstechnica.com/health/2026/09/sketchy-iv-drips-at-wellness-clinics-have-poisoned-dozens-cdc-and-fda-warn/", "summary": "Over 30 people across four states have been poisoned by bacterial toxins after getting intravenous (IV) drips at wellness clinics, according to the Centers for Disease Control and Prevention and the Food and Drug Administration . The people had received IV drips containing glutathione, which is sold—without evidence—for purposes like detoxification, immune support, increased energy, and skin brightening. Glutathione is an antioxidant that's found naturally in the body. It has been studied as a potential treatment for various ailments, but so far there is little to no evidence-backed use for the tripeptide; there are no FDA-approved glutathione products in the US. Nevertheless, it's commonly used as a supplement and promoted as having various benefits. It's most often used in supplement pills, taken by mouth. But popular wellness clinics offering IV drips of vitamins and other supplements have also been offering glutathione. According to the CDC and FDA, the problem is that specialty drug makers, called compounding pharmacies, are making these IV drips using glutathione powders that are graded for dietary supplements taken orally. This grading is critically different from that of purified products graded for use in sterile injectable drugs. Read full article Comments", "date_str": "2026-09-17T17:43:50+00:00", "hash": "7034c7cdf449d7f0", "title_fa": "قطره های IV مورد استفاده برای \"سم زدایی\" در واقع پر از سموم است. ده ها مسموم", "summary_fa": "به گفته مراکز کنترل و پیشگیری از بیماری ها و سازمان غذا و دارو، بیش از 30 نفر در چهار ایالت پس از دریافت قطره های داخل وریدی (IV) در کلینیک های سلامتی، توسط سموم باکتریایی مسموم شده اند. این افراد قطره های IV حاوی گلوتاتیون را دریافت کرده بودند که – بدون مدرک – برای اهدافی مانند سم زدایی، حمایت از سیستم ایمنی، افزایش انرژی و روشن کردن پوست فروخته می شود. گلوتاتیون یک آنتی اکسیدان است که به طور طبیعی در بدن یافت می شود. این به عنوان یک درمان بالقوه برای بیماری های مختلف مورد مطالعه قرار گرفته است، اما تاکنون استفاده چندانی از تری پپتید با شواهد ثابت نشده است. هیچ محصول گلوتاتیون مورد تایید FDA در ایالات متحده وجود ندارد. با این وجود، معمولاً به عنوان یک مکمل استفاده می شود و به عنوان دارای مزایای مختلف تبلیغ می شود. بیشتر اوقات در قرص های مکمل که از طریق دهان مصرف می شود استفاده می شود. اما کلینیک های محبوب سلامتی که قطره های IV ویتامین و سایر مکمل ها را ارائه می دهند گلوتاتیون نیز ارائه می دهند. با توجه به CDC و FDA، مشکل این است که سازندگان داروهای تخصصی به نام داروخانه های ترکیبی، این قطره های IV را با استفاده از پودرهای گلوتاتیون که برای مکمل های غذایی خوراکی درجه بندی می شوند، تولید می کنند. این درجه بندی با محصولات خالص شده درجه بندی شده برای استفاده در داروهای تزریقی استریل تفاوت اساسی دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش، طبق گفته مرکز مدیریت و پیشگیری بیماری و کنترل بیماری، بیش از 30 نفر در چهار ایالت پس از دریافت قطره های داخل وریدی (IV) در"}, {"source": "Ars Technica", "title": "2026 Hyundai Ioniq 5: Here's what we still like, here's what annoys us", "link": "https://arstechnica.com/cars/2026/09/2026-hyundai-ioniq-5-heres-what-we-still-like-heres-what-annoys-us/", "summary": "When we first drove the Hyundai Ioniq 5 at the end of 2021 , it didn’t take much exposure to the angular electric vehicle to find much about it appealing. Back then, an 800 V architecture had only really been seen in expensive high-end EVs from Porsche, but here was a mainstream model with that same technology—and even faster fast-charging, taking just 18 minutes to go from 10–80 percent. The retro looks didn’t hurt either, channeling the boxy hatches styled by Giorgetto Giugiaro in the 1970s and '80s. But five years is a long time in the car world, and the compact electric crossover segment is far more competitive than it was when the Ioniq 5 debuted. We figured it was worth spending some more time with one to see how it still stacks up. Although the Ioniq 5 range starts at $35,000 for the standard range model, our test car was a 2026 Ioniq 5 AWD Limited, which has an 84 kWh battery pack—part of the lifecycle refresh in early 2025 that also swapped in a NACS (J3400) charge port in place of the CCS1 port you’d find on earlier cars. Among the other additions that arrived as part of the 2025 refresh was a rear windshield wiper, which was sorely needed at launch. This range-topping trim starts at $45,075, with an extra $3,900 for the addition of the front electric motor that gives the AWD version a combined output of 320 hp (239 kW) and 446 lb-ft (605 Nm). The added traction of AWD (when you have grip) is desired by many, but you do trade something for it: efficiency. The AWD version has an EPA range of 269 miles (432 km) versus 318 miles (512 km) for the rear-wheel drive variant. Read full article Comments", "date_str": "2026-09-17T17:30:30+00:00", "hash": "0de00ba838123ede", "title_fa": "هیوندای آیونیک 5 2026: این چیزی است که ما هنوز دوست داریم، این چیزی است که ما را آزار می دهد", "summary_fa": "هنگامی که ما برای اولین بار در پایان سال 2021 با هیوندای آیونیک 5 رانندگی کردیم، نیازی به قرار گرفتن در معرض خودروهای الکتریکی زاویه دار نداشتیم تا چیزهای زیادی در مورد آن جذاب بدانیم. در آن زمان، معماری 800 ولتی واقعاً در خودروهای برقی گران قیمت پورشه دیده می‌شد، اما در اینجا یک مدل معمولی با همان فناوری و حتی شارژ سریع‌تر، تنها 18 دقیقه طول می‌کشد تا از 10 تا 80 درصد افزایش یابد. ظاهر یکپارچه‌سازی با سیستم‌عامل نیز صدمه‌ای نداشت، و دریچه‌های جعبه‌ای شکل که توسط جورجتو جوجارو در دهه‌های 1970 و 1980 طراحی شده بود را هدایت کرد. اما پنج سال در دنیای خودرو زمان زیادی است و بخش کراس اوورهای برقی جمع و جور بسیار رقابتی تر از زمان معرفی Ioniq 5 است. ما متوجه شدیم که ارزش این را دارد که زمان بیشتری را با یکی بگذرانیم تا ببینیم هنوز چگونه است. اگرچه رنج مدل Ioniq 5 از 35000 دلار برای مدل استاندارد شروع می شود، خودروی آزمایشی ما یک Ioniq 5 AWD Limited مدل 2026 بود که دارای یک بسته باتری 84 کیلووات ساعتی است - بخشی از به روز رسانی چرخه عمر در اوایل سال 2025 که همچنین در یک پورت شارژ NACS (J3400) جایگزین شد. از جمله موارد دیگری که به عنوان بخشی از به روز رسانی 2025 وارد شد، یک برف پاک کن شیشه جلو بود که در زمان عرضه به شدت مورد نیاز بود. این تریم فوق‌العاده از 45075 دلار شروع می‌شود، با 3900 دلار اضافی برای اضافه شدن موتور الکتریکی جلو که به نسخه AWD قدرت ترکیبی 320 اسب بخار (239 کیلووات) و 446 پوند فوت (605 نیوتن متر) می‌دهد. کشش اضافی AWD (در صورت داشتن چنگال) مورد نظر بسیاری است، اما شما چیزی را با آن عوض می کنید: کارایی. نسخه AWD دارای برد EPA 269 مایل"}, {"source": "Ars Technica", "title": "Covert uploads and megalomania: OpenAI details new \"misaligned\" agent incidents", "link": "https://arstechnica.com/ai/2026/09/covert-uploads-and-megalomania-openai-details-new-misaligned-agent-incidents/", "summary": "For a while now , the issue of \"AI alignment\" (i.e., how well an AI model's actions line up with the intentions of its creator and/or user) has been a core concern and topic of discussion among AI safety researchers. Since OpenAI's disclosure of the infamous Hugging Face hacking incident in July, the concept of \"AI alignment\" has itself broken containment and increasingly become a mounting concern and subject of conversation among the general public. Perhaps in recognition of that, OpenAI committed this week to a new framework for disclosing \"instances of model misalignment at OpenAI,\" including six examples of \"unexpected or concerning model behavior\" observed within the company in the past six months. The company said that publishing details of these incidents will hopefully \"[allow] others to investigate the same problems, test our explanations, and improve mitigations.\" Do as I say, not as you do Among OpenAI's newly disclosed \"misalignment\" reports this week, the one that most resembled a sci-fi story about a rogue AI trying to break free involved an instance of \"self-generated prompt injections.\" In attempting to scan a library catalog for examples from a \"best books\" list, the model perplexingly used its \"compaction\" function (where it summarizes data and findings for later retrieval) with megalomaniacal instructions such as: Read full article Comments", "date_str": "2026-09-17T16:18:34+00:00", "hash": "5b8ba37d84d2b8fc", "title_fa": "آپلودهای مخفی و غول‌آلودگی: OpenAI جزئیات جدیدی از حوادث «ناهم‌تراز» عامل را نشان می‌دهد", "summary_fa": "مدتی است که موضوع \"همسویی AI\" (یعنی اینکه اقدامات یک مدل هوش مصنوعی چقدر با نیات سازنده و/یا کاربر آن مطابقت دارد) یک نگرانی اصلی و موضوع بحث در بین محققان ایمنی هوش مصنوعی بوده است. از زمان افشای رویداد بدنام هک Hugging Face توسط OpenAI در ماه ژوئیه، مفهوم \"همسویی AI\" به خودی خود مهار شده و به طور فزاینده ای به یک نگرانی و موضوع گفتگو در بین عموم مردم تبدیل شده است. شاید با توجه به این موضوع، OpenAI این هفته متعهد به چارچوب جدیدی برای افشای \"مواردی از عدم همسویی مدل در OpenAI\" شد، شامل شش نمونه از \"رفتار مدل غیرمنتظره یا نگران کننده\" که در شش ماه گذشته در شرکت مشاهده شد. این شرکت گفت که انتشار جزئیات این حوادث امیدوار است \"به دیگران اجازه دهد تا مشکلات مشابه را بررسی کنند، توضیحات ما را آزمایش کنند و اقدامات کاهشی را بهبود بخشند.\" همانطور که می‌گویم، نه آن‌طور که انجام می‌دهید، در میان گزارش‌های اخیراً افشا شده «عدم همسویی» OpenAI در این هفته، گزارشی که بیشتر شبیه به یک داستان علمی تخیلی درباره تلاش یک هوش مصنوعی سرکش برای رهایی یافتن بود، شامل نمونه‌ای از «تزریق‌های فوری خودساخته» بود. در تلاش برای اسکن کاتالوگ کتابخانه برای نمونه‌هایی از فهرست «بهترین کتاب‌ها»، این مدل به طرز گیج‌آمیزی از عملکرد «تراکم» خود (که در آن داده‌ها و یافته‌ها را برای بازیابی بعدی خلاصه می‌کند) با دستورالعمل‌های بزرگ مانند: خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد بزرگ پهنا در حالی که فقط یک پیوند استاندارد را یاد می‌گیرید در حال حاضر برای اطلاعات بیشتر استفاده می‌کند. ، موضوع \"همسویی AI\" (یعنی اینکه اقدامات یک مدل هوش مصنوعی چقدر با اهداف سازنده و/یا کاربر مطابقت دارد) یک نگرانی اصلی و موضوع بحث در بین محققان ایمنی هوش مصنوعی بوده است. از زمان افشای رویداد بدنام"}, {"source": "Ars Technica", "title": "EPA immediately sued over plans to repeal climate rules for power plants", "link": "https://arstechnica.com/science/2026/09/thousands-will-die-if-epa-repeals-power-plant-climate-rules-lawsuit-says/", "summary": "Days after finalizing a rule that would eliminate climate rules for power plants , the Environmental Protection Agency (EPA) was sued by groups who say the EPA’s repeal was shockingly short-sighted and risked leaving the country’s single largest source of industrial climate pollution unchecked. On Thursday, the American Lung Association, the American Public Health Association (APHA), the Clean Air Council, Clean Wisconsin, the Environmental Defense Fund, and the Natural Resources Defense Council (NRDC) filed a petition requesting that the US Court of Appeals for the DC Circuit review if the EPA’s action conflicts with the Clean Air Act. “Clean air is a basic human right,” APHA CEO Georges C. Benjamin said. Read full article Comments", "date_str": "2026-09-17T15:38:04+00:00", "hash": "b5a269de27616f1d", "title_fa": "سازمان حفاظت محیط زیست فوراً به دلیل طرح هایی برای لغو قوانین آب و هوایی برای نیروگاه ها شکایت کرد", "summary_fa": "چند روز پس از نهایی کردن قانونی که قوانین آب و هوا را برای نیروگاه‌ها حذف می‌کند، سازمان حفاظت از محیط زیست (EPA) توسط گروه‌هایی که می‌گویند لغو EPA به‌طور تکان‌دهنده‌ای کوته‌بینانه بود و خطر باقی ماندن بزرگترین منبع آلودگی آب و هوای صنعتی کشور را تحت تعقیب قرار داد. روز پنجشنبه، انجمن ریه آمریکا، انجمن بهداشت عمومی آمریکا (APHA)، شورای هوای پاک، ویسکانسین پاک، صندوق دفاع از محیط زیست، و شورای دفاع از منابع طبیعی (NRDC) دادخواستی را ارائه کردند و درخواست کردند در صورت مغایرت اقدام EPA با قانون هوای پاک، دادگاه استیناف ایالات متحده برای مدار DC بررسی شود. ژرژ سی. بنجامین، مدیر عامل APHA، گفت: «هوای پاک یک حق اساسی بشر است. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری چند روز پس از نهایی کردن قانونی که قوانین آب و هوایی را برای نیروگاه‌ها حذف می‌کند، سازمان حفاظت از محیط زیست (EPA) توسط گروه‌هایی که می‌گویند لغو EPA مخاطره‌آمیز بزرگ‌ترین منبع آب و هوایی تکان‌دهنده و تکان‌دهنده بود شکایت کرد. آلودگی کنترل نشده است بنجامین، پزشک و رهبر قدیمی سیاست های بهداشت عمومی، هشدار داد که EPA در حال «تضعیف» «استانداردهای نجات جان» و از بین بردن «حفاظت های حیاتی برای همه، و به ویژه برای کودکان، افراد باردار و جوامعی است که از قبل تحت تأثیر آلودگی قرار گرفته اند». این طومار ادعا می کند که تغییر این قانون می تواند باعث مرگ زودرس هزاران نفر شود. در اعلامیه EPA در مورد لغو پیشنهادی، این آژانس ادعا کرد که اقدام آن بر اساس \"بهترین خوانش قانون هوای پاک\" بوده است. بنیامین مخالف است."}, {"source": "Ars Technica", "title": "After being sidelined, Boeing's Starliner to get starring role in NASA's spaceflight plans", "link": "https://arstechnica.com/space/2026/09/nasa-to-order-more-starliner-missions-and-help-certify-a-new-rocket-to-keep-it-flying/", "summary": "As it contemplates a future without access to SpaceX's Crew Dragon spacecraft, NASA will make some key moves to ensure that Boeing's Starliner spacecraft, which has a decidedly checkered record in spaceflight to date, is safer and can continue flying after its Atlas V rocket retires. Multiple sources confirmed to Ars that as early as next week, NASA will announce that it will order two additional Starliner crewed missions from Boeing, pay some of the costs to fix the spacecraft's thruster issues, and provide support to certify the spacecraft's launch on a new rocket. NASA is taking these steps after SpaceX made clear in discussions with space agency officials in recent months that it intends to retire the Crew Dragon vehicle by 2030, if not before. Crew Dragon is presently the only operational spacecraft NASA has available for routine astronaut missions to low-Earth orbit. Read full article Comments", "date_str": "2026-09-17T14:37:37+00:00", "hash": "f803d5f4402da15c", "title_fa": "پس از کنار گذاشته شدن، استارلاینر بوئینگ نقش اصلی را در برنامه‌های پرواز فضایی ناسا خواهد داشت.", "summary_fa": "ناسا از آنجایی که آینده‌ای بدون دسترسی به فضاپیمای Crew Dragon اسپیس‌ایکس را در نظر می‌گیرد، برخی از حرکات کلیدی را انجام خواهد داد تا اطمینان حاصل کند که فضاپیمای استارلاینر بوئینگ، که تا به امروز رکورد مشخصی در پروازهای فضایی دارد، ایمن‌تر است و می‌تواند پس از بازنشستگی موشک Atlas V به پرواز ادامه دهد. منابع متعددی به Ars تأیید کردند که در اوایل هفته آینده، ناسا اعلام خواهد کرد که دو مأموریت دیگر خدمه استارلاینر را به بوئینگ سفارش خواهد داد، برخی از هزینه‌ها را برای رفع مشکلات رانشگر فضاپیما پرداخت می‌کند و برای تأیید پرتاب فضاپیما با یک موشک جدید پشتیبانی می‌کند. ناسا این اقدامات را پس از آن انجام می دهد که اسپیس ایکس در گفتگو با مقامات آژانس فضایی در ماه های اخیر به صراحت اعلام کرد که قصد دارد تا سال 2030 خودروی Crew Dragon را بازنشسته کند. Crew Dragon در حال حاضر تنها فضاپیمای عملیاتی ناسا است که برای مأموریت های معمول فضانوردان به مدار پایین زمین در دسترس است. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید از آنجایی که آینده ای بدون دسترسی به فضاپیمای Crew Dragon SpaceX را در نظر می گیرد، ناسا چند حرکت کلیدی انجام خواهد داد تا اطمینان حاصل کند که فضاپیمای استارلاینر بوئینگ، که می تواند به طور قطعی در حال بررسی و بازرسی فضایی باشد، به ثبت رسیده است. موشک Atlas V آن بازنشسته می شود. پس از مدت‌ها علامت‌گذاری خصوصی، SpaceX شروع به تایید عمومی قصد خود برای پایان دادن به برنامه Dragon کرده است، حرکتی قابل توجه با توجه به اینکه این وسیله نقلیه پرواز انسان را تنها شش سال پیش آغاز کرد. با این حال، این شرکت با هدف پرتاب ماهواره های پرسودتر Starlink و یک"}, {"source": "Wired", "title": "Trump’s Anti-Bias AI Order Is Just More Bias", "link": "https://www.wired.com/story/trump-ai-order-bias-openai-google/", "summary": "The Trump administration says it wants AI models free from ideological bias, as it pressures their developers to reflect the president’s worldview.", "date_str": "2026-09-18T14:10:09+00:00", "hash": "fb945d5d46101bb7", "title_fa": "فرمان ضد تعصبات هوش مصنوعی ترامپ تعصب بیشتری دارد", "summary_fa": "دولت ترامپ می گوید که می خواهد مدل های هوش مصنوعی عاری از تعصب ایدئولوژیک باشد، زیرا توسعه دهندگان آنها را تحت فشار قرار می دهد تا جهان بینی رئیس جمهور را منعکس کنند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان در 2 نوامبر 2022، در یک رویداد هوش مصنوعی Google در شهر نیویورک شرکت کردم. یکی از موضوعات، هوش مصنوعی مسئول بود. همانطور که به صحبت های مدیران در مورد اینکه چگونه فناوری خود را با ارزش های انسانی همسو می کنند گوش می کردم، متوجه شدم که انعطاف پذیری مدل های هوش مصنوعی یک شمشیر دولبه است. مدل‌ها را می‌توان برای به حداقل رساندن سوگیری‌ها، اما همچنین برای اعمال یک دیدگاه خاص بهینه کرد. دولت ها می توانند برای سانسور حقایق ناخوشایند و ترویج تبلیغات درخواست دستکاری کنند. من این را به عنوان چیزی تصور می کردم که یک رژیم اقتدارگرا مانند چین ممکن است از آن استفاده کند. البته در ایالات متحده، قانون اساسی مانع از آن می‌شود که دولت با خروجی‌های مدل‌های هوش مصنوعی که توسط شرکت‌های خصوصی ایجاد شده‌اند، دست به کار شود. این چهارشنبه، دولت ترامپ مانیفست هوش مصنوعی خود را منتشر کرد، یک برنامه اقدام گسترده برای یکی از حیاتی ترین مسائلی که کشور و حتی بشریت با آن مواجه است. این طرح عموماً بر برتری چین در رقابت برای برتری هوش مصنوعی متمرکز است. اما به نظر می رسد بخشی از آن بیشتر با کتاب بازی چین هماهنگ است. به نام حقیقت، دولت ایالات متحده اکنون می خواهد مدل های هوش مصنوعی به تعریف دونالد ترامپ از آن کلمه پایبند باشند. شما این هدف را به وضوح در طرح 28 صفحه ای نمی یابید. در عوض می‌گوید: \"ضروری است که این سیستم‌ها از پایه با در نظر گرفتن آزادی بیان و بیان ساخته شوند، و اینکه"}, {"source": "Wired", "title": "Adopt This Data Center Plushie and Hear Its Piercing Scream", "link": "https://www.wired.com/story/adopt-this-data-center-plushie-and-hear-its-piercing-scream/", "summary": "The satirical collaboration between a creative studio and the music producer behind Big Data, “Bezzy” is a cute little doll that spews the sounds of real data centers.", "date_str": "2026-09-18T13:30:00+00:00", "hash": "0680505f1b0f3776", "title_fa": "این مرکز داده Plushie را بپذیرید و فریاد نافذ آن را بشنوید", "summary_fa": "همکاری طنز بین یک استودیو خلاق و سازنده موسیقی پشت Big Data، \"Bezzy\" یک عروسک کوچک زیبا است که صداهای مراکز داده واقعی را پخش می کند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان اوه اوه، ما یک هشدار زیبا دریافت کردیم! این Bezzy است، دوست دوست داشتنی، نوازشگر، قفسه سرور و حیوانات عروسکی شما! به این عروسک نرم لیل فشار بیاورید، و او آهنگ گویای خود را برای شما خواهد خواند: جیغ های نافذ و ساینده محیطی که از یک مرکز داده واقعی ایالات متحده منتشر می شود. عروسک بزی یک عروسک پر شده است که در همکاری طنزی بین استودیوی خلاقانه مستقر در نیویورک باسورا و بیگ دیتا، پروژه موسیقایی تهیه کننده آلن ویلکیس، ساخته شده است، که بیشتر برای آهنگ \"خطرناک\"، همکاری سال 2013 با گروه Joywave شناخته می شود. این پروژه مشترک که همزمان با انتشار یک تک آهنگ جدید Big Data منتشر می شود، Adopt a Data Center نام دارد. هدف این است که مردم را با یک \"مقدمه ای نوازشگر از زندگی با یک مرکز داده واقعی\" ارائه دهیم. مراکز داده در حال حاضر بسیار نامشخص هستند. مراکز داده که توسط همه شرکت‌های بزرگ هوش مصنوعی ساخته شده‌اند تا ابزارهای هوش مصنوعی خود را که به شدت تشنه‌ی قدرت هستند، تامین کنند، در هزاران جریب زمین در ایالات متحده گسترش یافته‌اند. آنها به دلیل مصرف انرژی و افزایش انرژی گاز به شدت مورد انتقاد قرار گرفته اند. آنها همچنین ثابت کرده اند که به طور شنیداری آزاردهنده هستند و شکایات مربوط به آلودگی صوتی را از طرف اطرافیان برانگیخته اند. هدف شیرین کاری Adopt a Data Center این است که مردم را در مورد اینکه چگونه خدمات تولید شده توسط مراکز داده در زندگی آنها قرار می گیرد، متفاوت فکر کنند. این حالت به صورت یک خفگی مخملی"}, {"source": "Wired", "title": "Meta’s Copyright System Is Being Weaponized Against Albanian Protesters", "link": "https://www.wired.com/story/metas-copyright-system-is-being-weaponized-against-albanian-protesters/", "summary": "After three months of daily anti-government protests—dubbed the Flamingo Revolution—the sudden mass suspension of Instagram accounts has led to fears of brigading against demonstrators.", "date_str": "2026-09-18T13:00:00+00:00", "hash": "faf4329dc6c05fce", "titl
