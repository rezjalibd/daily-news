sday’ Line His Character Says", "link": "https://variety.com/2026/film/awards/pedro-pascal-behemoth-cello-avengers-doomsday-line-podcast-1236921933/", "summary": "“If you could hear it, you would think I was killing an animal.” That’s Pedro Pascal on his cello playing, more than a year after he started lessons for a movie that hadn’t been greenlit yet. The star first had lunch with Tony Gilroy in late July 2025 about taking on the lead role of [ ]", "date_str": "2026-10-23T18:13:48+00:00", "hash": "9026da9bc7d60406", "title_fa": "پدرو پاسکال در مورد یادگیری ویولن سل برای «بیهموث!»، «چرا باید S بخوری—» برای ساخت آن در هالیوود و خط «انتقام‌جویان: روز قیامت» که شخصیت او می‌گوید", "summary_fa": "\"اگر می توانستی آن را بشنوی، فکر می کردی دارم حیوانی را می کشم.\" این پدرو پاسکال در حال نواختن ویولن سل است، بیش از یک سال پس از شروع درس برای فیلمی که هنوز چراغ سبز نشده بود. این ستاره برای اولین بار در اواخر ژوئیه 2025 با تونی گیلروی ناهار خورد و نقش اصلی پادکست مدار جوایز [ ] را بر عهده گرفت: همچنین در این قسمت، میزگرد به بررسی این موضوع می‌پردازد که آیا شما می‌توانید همه چیز را ببینید در حال نمایش The Odyssey برای نامزدی اسکار است یا خیر. \"اگر می توانستی آن را بشنوی، فکر می کردی دارم حیوانی را می کشم.\" این پدرو پاسکال در حال نواختن ویولن سل است، بیش از یک سال پس از شروع درس برای فیلمی که هنوز چراغ سبز نشده بود. این ستاره برای اولین بار در اواخر ژوئیه 2025 با تونی گیلروی ناهار خورد و نقش اصلی آخرین فیلمش \"بهموت\" را بازی کرد. \" اما پاسکال حتی قبل از اینکه هر چیزی امضا شود و قبل از اینکه بداند پروژه ادامه خواهد داشت یا نه، مستقیماً سراغ تیموتی لو و چارلی تایلر نوازندگان ویولن سل رفت و دست به کار شد. داستان‌های مرتبط هیچ‌کس این خالق را نمی‌خواهد ارین فاستر در مورد حمایت آدام برودی از فلسطین: من با او مخالفم، و خوب است، در نهایت دوربین‌ها در اواخر اکتبر همان سال در سراسر لس‌آنجلس پخش می‌شوند و آخرین روز آن در وین خواهد بود. هر تعطیلات ناهار و آخر هفته کوتاه به «چیز بعدی و چیز بعدی» می رفت. پاسکال آن را \"یک همگام سازی لب بسیار شدید\" می نامد که باعث شد او در کل عکسبرداری پشت پا بماند و \"سخت ترین کاری که تا به حال انجام داده ام.\" محبوب در Variety این تجربه فیلمسازی مورد علاقه او نیز بوده است. او به ورایتی", "image_url": "https://variety.com/wp-content/uploads/2026/10/P1075CPY-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۲۱:۴۳"}, {"source": "Billboard", "title": "Executive Turntable: Barbara Cane Retires From BMI After 50 Years; Ron Broitman Named Global Synch President at WMG", "link": "https://www.billboard.com/lists/executive-turntable-barbara-cane-retires-from-bmi/", "summary": "Barbara Cane has announced her retirement from BMI after 50 years at the company. She most recently served as vp of worldwide creative at the publishing company, and agreed to continue serving in an advisory capacity working directly with CEO Mike O’Neill . Cane began at BMI in 1970, where she worked part time while still in high school. She spent the entirety of her professional career at the company, starting in BMI’s Song Research department. She held roles including general manager of the Los Angeles office and as vp of create in New York, Los Angeles and London. “After more than five decades, BMI is not simply where I have built my career — it is part of who I am,” Cane said in a statement. “It gave me the opportunity to grow, to discover, and, most importantly, to uncover the soul within the songwriter. Through every chapter of my journey, I have come to understand that creativity is not simply a profession it is the heart of who songwriters are and the force that moves our industry forward. What has made this journey so meaningful is that my own values remain deeply aligned with those of BMI — to believe in creators, to nurture their gifts, and to create an environment in which their careers can flourish. After 50 years, that purpose still lives in my heart — and it is why this work has never felt simply like a career, but like a calling.” O’Neill added, “Barbara is one of the first people I met when I joined BMI almost 32 years ago, and her kindness, caring nature and warm welcome showed me exactly why she is so loved by so many in our industry. She has demonstrated that same care and attention time and again to the many songwriters she worked with, nurtured and supported, and it’s why her relationships in this industry have endured. While Barbara and I started out as colleagues, we’ve ended up as family, and I don’t know many who can say that about the people they work with. The beautiful thing for me is that Barbara has agreed to continue working with me as an advisor, allowing BMI and our writers to still have her insight and counsel, while also allowing her to enjoy some time away from us for the first time in fifty years.” In 2019, Cane received the NMPA Lifetime Service Award, and she is a member of NARAS, CMA, ACM and the Songwriters Hall of Fame. She was named one of Billboard ’s Top Women in Music in 2011 and 2024. When it comes to inspiring and elevating songwriters, Barbara is in a league of her own,” Mike Steinberg, executive vp and chi", "date_str": "2026-10-23T17:28:53+00:00", "hash": "9b8e394dae3ef862", "title_fa": "میز گردان اجرایی: باربارا کین پس از 50 سال از BMI بازنشسته شد. ران برویتمن به عنوان رئیس Global Synch در WMG انتخاب شد", "summary_fa": "باربارا کین پس از 50 سال فعالیت در این شرکت، بازنشستگی خود را از BMI اعلام کرد. او اخیراً به عنوان معاون خلاق جهانی در شرکت انتشارات خدمت کرد و موافقت کرد که به عنوان مشاور به طور مستقیم با مدیر عامل مایک اونیل به خدمت ادامه دهد. کین در سال 1970 با BMI شروع به کار کرد، جایی که او در دوران دبیرستان به طور نیمه وقت کار می کرد. او تمام دوران حرفه ای خود را در این شرکت گذراند و از بخش تحقیقات آهنگ BMI شروع کرد. او نقش هایی از جمله مدیر کل دفتر لس آنجلس و معاون ایجاد در نیویورک، لس آنجلس و لندن را بر عهده داشت. کین در بیانیه‌ای گفت: «پس از بیش از پنج دهه، BMI فقط جایی نیست که من حرفه‌ام را ساخته‌ام، بلکه بخشی از شخصیت من است. این به من این فرصت را داد که رشد کنم، کشف کنم و مهمتر از همه، روح درون ترانه سرا را کشف کنم. در هر فصل از سفرم، متوجه شدم که خلاقیت صرفاً یک حرفه نیست، بلکه قلب ترانه سراها و نیرویی است که صنعت ما را به جلو می برد. چیزی که این سفر را بسیار معنی‌دار کرده است این است که ارزش‌های من عمیقاً با ارزش‌های BMI همسو می‌ماند - اعتقاد به سازندگان، پرورش هدایای آن‌ها و ایجاد محیطی که در آن حرفه‌شان شکوفا شود. پس از 50 سال، این هدف هنوز در قلب من زنده است - و به همین دلیل است که این کار هرگز به سادگی مانند یک حرفه نیست، بلکه مانند یک فراخوان است. اونیل اضافه کرد: «باربارا یکی از اولین افرادی است که تقریباً 32 سال پیش زمانی که به BMI پیوستم با او آشنا شدم و مهربانی، طبیعت دلسوز و استقبال گرم او دقیقاً به من نشان داد که چرا بسیاری از افراد در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P1071MD2.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۵۸"}, {"source": "Billboard", "title": "Drake, Travis Scott & Quavo Show Love to Druski for Upcoming ‘SNL’ Hosting Gig: ‘So F–king Proud’", "link": "https://www.billboard.com/music/rb-hip-hop/drake-travis-scott-quavo-druski-snl-host-reactions-1236367271/", "summary": "Druski was announced as a season 52 host for Saturday Night Live on Thursday (Oct. 22), and plenty of his hip-hop friends showed him love for the trailblazing feat. Related Druski Credits Drake With Launching His Comedy Career: Everything Shifted After That Phoebe Bridgers to Make Her SNL Return as Musical Guest on John Mulaney-Hosted Episode With Support From Jack Harlow Drake, Druski Wants To Take His Comedic Chops to the Next Level Among those sending Druski congratulatory messages were Drake, Travis Scott, Quavo, Wheezy and Reese LaFlare. So f—king proud, Drizzy wrote in Druski s IG comments in the post announcing his upcoming hosting gig. Quavo added: That boy good! Fans can expect Travis Scott to be in attendance come Nov. 7 when Druski takes over Rockefeller Center s Studio 8H in Midtown Manhattan. N—A WE MADE IT, a hyped La Flame wrote. I WILL BE THERE. !!!? CANT MISS THIS. Scott also reposted Druski s hosting gig on his IG Story. What ever u doing on the 7th you gotta be tapped in, he wrote. Continuing his meteoric and unique rise in entertainment, Druski — who graced one of Billboard s 2025 covers — will be the first-ever digital content creator to host SNL in the show s history. The Strokes will perform as the musical guest on Nov. 7. In a rare candid interview with The Diary of a CEO in September, Druski opened up about his childhood and journey as an internet comedian, which saw him credit Drake with changing his trajectory after casting him in one of the rapper s videos in 2020. “The thing that changed my life at the time was Drake calling for the Laugh Now Cry Later music video . Everything shifted after that because brands started to take me seriously,” he explained. “Now it’s transactional with everything.” Druski continued: “Once I was seen with Drake, Lil Durk, we had Marshawn Lynch, Kevin Durant, Odell Beckham Jr. all in this video alongside me. Me being the comedic relief in this video, which was called ‘Laugh Now, Cry Later,’ this meant a lot more than another music video.” Season 52 of SNL is slated to resume on Halloween with Obsession actress Inde Navarrette hosting and Gracie Abrams performing. Following Druski s episode, John Mulaney will play host on Nov. 14 with Phoebe Bridgers serving as the musical guest. Find Druski s SNL announcement post below. View this post on Instagram", "date_str": "2026-10-23T17:24:28+00:00", "hash": "eb5e1b5beb095dad", "title_fa": "دریک، تراویس اسکات و کواوو عشق خود را به دروسکی برای کنسرت میزبانی «SNL» نشان می‌دهند: «So F–king Proud»", "summary_fa": "دروسکی به عنوان مجری فصل 52 شنبه شب زنده در روز پنجشنبه (22 اکتبر) معرفی شد و بسیاری از دوستان هیپ هاپ او به او عشق خود را به این شاهکار پیش رو نشان دادند. دروسکی با شروع کار کمدی خود: همه چیز بعد از آن تغییر کرد تا فیبی بریجرز به عنوان مهمان موزیکال در اپیزود میزبان جان مولانی با پشتیبانی جک هارلو دریک، SNL خود را تغییر دهد، دروسکی می خواهد آثار کمدی خود را به سطح بعدی برساند. Quavo، Wheezy و Reese LaFlare. دریزی در کامنت های IG دروسکی در پستی که از کنسرت میزبانی آتی خود خبر می دهد، نوشت. Quavo افزود: آن پسر خوب است! طرفداران می توانند انتظار داشته باشند که تراویس اسکات در 7 نوامبر حضور داشته باشد، زمانی که دروسکی استودیو 8H مرکز راکفلر در میدتاون منهتن را بر عهده گرفت. La Flame هیپ نوشت: N—A WE MADE IT. من آنجا خواهم بود. !!!؟ نمی توان این را از دست داد. اسکات همچنین کنسرت میزبانی دروسکی را در IG Story خود بازنشر داد. او نوشت. دروسکی - که یکی از جلدهای بیلبورد 2025 را بر عهده داشت - در ادامه رشد بی نظیر و بی نظیر خود در سرگرمی، اولین خالق محتوای دیجیتالی خواهد بود که میزبان SNL در تاریخ نمایش است. گروه Strokes به عنوان مهمان موسیقی در 7 نوامبر اجرا خواهند کرد. دروسکی در یک مصاحبه صریح نادر با The Diary of a CEO در سپتامبر در مورد دوران کودکی و سفر خود به عنوان یک کمدین اینترنتی صحبت کرد، که باعث شد دریک پس از انتخاب او در یکی از ویدیوهای رپر در سال 2020، مسیر خود را تغییر دهد. او توضیح داد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/drake-druski-2021-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۵۴"}, {"source": "Billboard", "title": "Billy Corgan on Why He’s Stood By Marilyn Manson: ‘I Don’t Want the World to Tell Me Who My Friends Are’", "link": "https://www.billboard.com/music/music-news/billy-corgan-defends-marilyn-manson-friendship-explains-why-1236367239/", "summary": "Billy Corgan is standing by Marilyn Manson . In his Thursday (Oct. 22) appearance on The New York Times Popcast , The Smashing Pumpkins frontman explained why he s maintained his friendship with the controversial shock rocker. Related A Timeline of Abuse Allegations Against Marilyn Manson Marilyn Manson s Ex-Assistant Successfully Revives Sex Abuse Lawsuit Against Rocker (Again) Smashing Pumpkins Billy Corgan Talks Green Day s Political Music, Criticizes Rock Roll Hall of Fame As a Christian person, you have to stand by your friends, but that doesn t mean you don t have an opinion, and it doesn t mean you re not critical, Corgan began, pausing to choose his words carefully. In his case and I m not here to adjudicate it but the [district attorney] looked at the case for five years. In some cases, I knew personal things behind the scenes that are not in the public sphere, the Chicago musician continued. I personally didn t feel that he was guilty of the things that he was being charged with, and ultimately the fact that the DA didn t pursue [it] was commensurate with the person I knew. Corgan and Manson whose real name is Brian Warner have known each other for decades. A couple of years after they became friends in the 90s, they went through a rift that lasted up until 2015, when they reunited to embark on their joint End Times Tour. It was about six years after the two men buried the hatchet that Evan Rachel Wood named Manson as her alleged abuser after years of advocating against domestic violence, which was followed by multiple other women coming forward with accusations of sexual assault and misconduct against the rocker; Manson has continuously denied all of the claims. In January 2025, Los Angeles DA Nathan J. Hochman announced that after investigating for four years, Manson would not face criminal charges due to the statute of limitations on the charges and a lack of ways to prove them. “While we are unable to bring charges in this matter, we recognize that the strong advocacy of the women involved has helped bring greater awareness to the challenges faced by survivors of domestic abuse and sexual assault,” Hochman stated at the time. Manson’s attorney Howard King told Billboard shortly after the decision, “We are very pleased that, after a thorough and incredibly lengthy review of all of the actual evidence, the district attorney has concluded what we knew and expressed from the start Brian Warner is innocent. On Popcast , Corgan shared a bit of his ", "date_str": "2026-10-23T17:16:34+00:00", "hash": "60ca64ee4e59fde9", "title_fa": "بیلی کورگان در مورد اینکه چرا او در کنار مرلین منسون ایستاده است: \"من نمی خواهم دنیا به من بگوید دوستان من چه کسانی هستند\"", "summary_fa": "بیلی کورگان در کنار مرلین منسون ایستاده است. رهبر گروه The Smashing Pumpkins در روز پنجشنبه (22 اکتبر) خود در پاپکست The New York Times توضیح داد که چرا دوستی خود را با شوک راکر جنجالی حفظ کرده است. مرتبط جدول زمانی اتهامات سوء استفاده علیه مرلین منسون دستیار سابق مرلین منسون با موفقیت احیای دادخواست سوء استفاده جنسی علیه راکر (دوباره) Smashing Pumpkins بیلی کورگان در موسیقی سیاسی گرین دی صحبت می کند، از شما انتقاد می کند که راک رول شما را به عنوان یک شخص مسیحی از طرف من می شناسد. کورگان شروع کرد و مکث کرد تا کلماتش را با دقت انتخاب کند. در مورد او و من اینجا نیستم تا در مورد آن قضاوت کنم، اما [دادستان منطقه] به مدت پنج سال به پرونده نگاه کرد. این نوازنده شیکاگو ادامه داد: در برخی موارد، در پشت صحنه چیزهای شخصی می دانستم که در حوزه عمومی نیست. من شخصاً احساس نمی‌کردم که او در مورد چیزهایی که به آنها متهم می‌شد مقصر است، و در نهایت این واقعیت که DA [آن را] دنبال نکرد، متناسب با شخصی بود که من می‌شناختم. کورگان و منسون با نام اصلی برایان وارنر چندین دهه است که یکدیگر را می شناسند. چند سال پس از اینکه آنها در دهه 90 با هم دوست شدند، آنها شکافی را پشت سر گذاشتند که تا سال 2015 ادامه یافت، زمانی که آنها دوباره متحد شدند تا تور مشترک پایان تایمز خود را آغاز کنند. حدود شش سال پس از دفن هچ دو مرد بود که ایوان ریچل وود منسون را پس از سال‌ها حمایت از خشونت خانگی، منسون را به‌عنوان آزاردهنده‌ی ادعایی خود معرفی کرد، که پس از آن چندین زن دیگر با اتهامات تجاوز جنسی و بدرفتاری علیه راک مطرح شدند. منسون به طور مداوم تمام این ادعاها را رد کرده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/483208216-e1792774543960.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۴۶"}, {"source": "Billboard", "title": "John Mayer Wants To Run Away With You on First Single in Five Years, ‘Tom and Jerry’: Stream It Now", "link": "https://www.billboard.com/music/rock/john-mayer-tom-and-jerry-single-stream-it-now-1236367270/", "summary": "John Mayer really wants you, even if you don t necessarily want him back. The Your Body Is a Wonderland star and Dead Company member released his first new solo single in more than five years on Friday (Oct. 23), the contemplative Tom and Jerry . The midtempo bubbler opens with a shuffling, brushed drum pattern and hypnotic guitar riff as Mayer admits from the jump that things are not going great. I m never gonna catch you/ This is never gonna end/ Might as well be my lover/ If you don t wanna be my friend, he sings in a resigned voice. You re my badge/ Baby, I m your scar/ Throwin daggers at the camera/ Trying to him me from afar, he adds. Then comes the real talk, as Mayer concedes, Now if you ever come through/ Which I doubt you ll do/ I ll run away with you to a lover who only wants him when they ve already got someone else or when it s all wrong. Tom and Jerry was the name I used when saving my first voice memo with this song idea, Mayer wrote in an Instagram post promoting the song, featuring cover art in which he is handcuffed to an unseen woman. And if you ever come through, which I doubt you’ll do, I’ll run away with you. From that moment on, the adventure began in bringing that feeling to life, he continued. I’ve said it before, but it bears repeating every time I get to work with a group of incredibly talented and deeply dedicated artists who will stop at nothing until the sound comes into focus and becomes a picture. I can’t wait to tell you more about it, but first, it’s important that you know who contributed to this track. The post included the full roster of contributors, which includes co-writer and co-producer Blake Slatkin (Justin Bieber, Sam Smith), beloved Welsh session bassist Pino Palladino (The Who, Adele), drummer Aaron Sterling (Taylor Swift, Harry Styles), percussionist Lenny Castro (Maroon 5, The Rolling Stones) and pianist Larry Goldings (Sia, James Taylor). In addition to co-writing and co-producing the song, Mayer is credited with acoustic and electric guitar, keyboards/synths and programming. The song — the singer/guitarist s first solo release since his 2021 Sob Rock album — is the first effort under Mayer s new deal with Mercury Records for his Sob Rock Records imprint. Sob Rock , which peaked at No. 2 on the Billboard 200, was Mayer s final album for Columbia Records. The Gravity star is gearing up to launch his 21-show residency run at Las Vegas Sphere, which is slated to kick-off on April 8 and run through a June 12, 20", "date_str": "2026-10-23T17:15:49+00:00", "hash": "6c7c07a5634d326c", "title_fa": "جان مایر می‌خواهد در اولین تک‌آهنگ بعد از پنج سال، «تام و جری» با شما فرار کند: اکنون آن را پخش کنید", "summary_fa": "جان مایر واقعاً شما را می خواهد، حتی اگر لزوماً نمی خواهید او را برگردانید. ستاره The Your Body Is a Wonderland و عضو Dead Company اولین تک آهنگ جدید خود را پس از بیش از پنج سال در روز جمعه (23 اکتبر) منتشر کرد، تام و جری متفکر. حباب‌ساز میان‌تمپو با الگوی درام درهم‌آلود، برس‌خورده و ریف گیتار هیپنوتیزمی باز می‌شود، زیرا مایر از روی پرش اعتراف می‌کند که اوضاع عالی پیش نمی‌رود. من هرگز تو را نخواهم گرفت / این هرگز تمام نمی شود / ممکن است معشوق من باشد / اگر نمی خواهی دوست من باشی، او با صدایی سرکش آواز می خواند. تو نشان من هستی/ عزیزم، من جای زخم تو هستم/ خنجرها را به سمت دوربین پرتاب می‌کنم/ او می‌افزاید که از دور به دنبال او هستم. همان‌طور که مایر اذعان می‌کند، صحبت واقعی پیش می‌آید، حالا اگر زمانی از راه برسی/ که من شک دارم انجامش خواهی داد/ با تو فرار می‌کنم پیش معشوقی که فقط وقتی او را می‌خواهد که قبلاً شخص دیگری را پیدا کرده باشد یا وقتی همه چیز اشتباه است. مایر در یک پست اینستاگرامی در تبلیغ این آهنگ نوشت تام و جری زمانی که اولین یادداشت صوتی خود را با این ایده آهنگ ذخیره کردم، نامی بود که در آن به زنی نادیده دستبند زده شده بود. و اگر روزی از راه برسی، که من شک دارم که انجامش دهی، من با تو فرار خواهم کرد. او ادامه داد، از آن لحظه به بعد، ماجراجویی برای زنده کردن این احساس آغاز ش mentum comes as Valladolid’s Merci market enters its sixth edition, its first since the death of José Luis Cienfuegos, the director of Valladolid, known in Spain as the Seminci, who helped build [ ]", "date_str": "2026-10-23T17:38:18+00:00", "hash": "9e92e731036d736b", "title_fa": "با تقویت \"La Bola Negra\"، توزیع مستقل اسپانیا دستاوردهای قدرتمندی دارد که در بازار Merci وایادولید برجسته می شود", "summary_fa": "موفقیت در باکس آفیس \"La Bola Negra\" که توسط الاستیکا فیلمز مدیریت می شود، به بخش پخش فیلم مستقل اسپانیا به موقع رونق داده است. این شتاب زمانی رخ می‌دهد که بازار مرسی وایادولید وارد ششمین دوره خود می‌شود، اولین دوره پس از مرگ خوزه لوئیس سینفوئگوس، کارگردان وایادولید، که در اسپانیا با نام Seminci شناخته می‌شود، که به ساختن کمک کرد [ 28 تا 30 اکتبر در سینماهای برادوی وایادولید، مرسی قرار است بیش از 200 متخصص صنعت را جذب کند. لوحۀ 26 فیلمی آن به غرفه داران نگاهی از قبل به اکران های برنامه ریزی شده برای اواخر سال 2026 و نیمه اول 2027 می دهد. داستان‌های مرتبط ایلان ماسک می‌گوید به هر بچه‌ای در آمریکا یک سهم SpaceX می‌دهد - هدایایی که بیش از 10.5 میلیارد دلار می‌شود ویویان ویلسون، مدل و دختر غریبه الون ماسک، Signs With Echo Lake Entertainment (EXCLUSIVE) که توسط اکثریت شرکت‌های Valladinest سازماندهی شده است. بخش توزیع فیلم مستقل اسپانیا، Merci، توزیع‌کنندگان و غرفه‌داران را گرد هم می‌آورد تا درباره استراتژی‌های انتشار، ارائه کمپین‌های بازاریابی و ایجاد روابط تجاری بحث کنند. محبوب در Variety در Merci اکتبر گذشته، Comscore گزارش داد که اعضای Adicine 12 درصد از باکس آفیس تئاتر اسپانیا را تا سپتامبر 2025 به دست آورده اند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/20251029_InauguracionMERCI_2490.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۲۱:۰۸"}, {"source": "Variety", "title": "FilmQuest 2026 Launches With Explosive Motorcycle Drama ‘Whiskey Throttle’ as Rowdy Crowd Celebrates Utah-Made Film", "link": "https://variety.com/2026/film/festivals/filmquest-2026-opening-night-whiskey-throttle-1236922157/", "summary": "“Motherfucking Utah, let’s go!” That was the spirit inside the energetic Oct. 22 opening night screening at FilmQuest. The 10-day festival in Provo launched its 10th installment with a screening of the Utah-made motorcycle action feature, “Whiskey Throttle.” Upon entering the festival’s screening home at the Velour Live Music Gallery, the audience was greeted with [ ]", "date_str": "2026-10-23T17:16:50+00:00", "hash": "b5c83e4a3d2f171c", "title_fa": "FilmQuest 2026 با درام انفجاری موتور سیکلت «Whiskey Throttle» به نمایش درمی‌آید زیرا جمعیت شلوغی فیلم ساخته‌شده در یوتا را جشن می‌گیرند", "summary_fa": "\"لعنتی یوتا، بیا بریم!\" این روحیه در نمایش پرانرژی افتتاحیه 22 اکتبر در FilmQuest بود. جشنواره 10 روزه در پروو، دهمین قسمت خود را با نمایش ویژگی اکشن موتورسیکلت ساخت یوتا، \"Whisky Throttle\" آغاز کرد. پس از ورود به خانه نمایش جشنواره در گالری موسیقی زنده Velor، از تماشاگران با [ ] استقبال شد: \"مادر لعنتی یوتا، بیا برویم!\" جاناتان مارتین، بنیانگذار و کارگردان FilmQuest، یک تیم تشویق کننده تک نفره برای فیلمسازی و ژانر در یوتا، به تقویت تماشاگران کمک کرد. او شب بازی را به جمعیت معرفی کرد — به ساندنس برای جمع کردن وسایل و خروج از ایالت و همسایه‌های شمال آیداهو چند ضربات دوستانه پرتاب کرد. پرطرفدار در Variety طنز محلی به خوبی در اتاق بازی می‌کرد، همانطور که در اعلامیه افتتاحیه FilmQuest اعلام شد که هیچ یک از فیلم‌های جشنواره از هوش مصنوعی استفاده نمی‌کردند. این موضوع باعث شد تا در اتاقی مملو از خلاقان مستقل که معتقدند هوش مصنوعی شغل آنها را تهدید می کند و کیفیت هنر را پایین می آورد، صدای تشویق را به همراه داشت. «Whiskey Throttle» جمعیت شهر زادگاه را با تشویق مکرر برای انفجارهای فیلم، دوربین‌های خیره‌کننده موتورسیکلت بیابانی و بدلکاری‌های عملی، مردم شهر را روی لبه صندلی‌هایشان نگه داشت. جیکوب شوارتز داستان یک باند دوچرخه سواری را کارگردانی کرد که یک سوار مرموز را تعقیب می کند که یک رهبر کارتل را کشته و کیف پول رمزنگاری او را دزدیده است. در Q A بعد از اولین نمایش، دیو هانتر، که فیلم را تحت پرچم جدید خود در یوتا تولید کرد، با احساس تولید در با صرفه‌جویی در هزاران نفر از هالیوود [ ] در آگهی، باس به دوربین نگاه می‌کند و می‌گوید: با مشکل صنعت فیلم، من هزینه‌ها را کاهش دادم و اعتبار مالیاتی فیلم و تلویزیون را افزایش دادم... هزاران شغل در هالیوود را نجات دادم. دولت گاوین نیوسام تلاش برای دوبرابر کردن انگیزه فیلم ایالتی به 750 میلیون دلار در سال گذشته را در پاسخ به رکود چشمگیر تولید لس‌آنجلس از سال 2022 انجام داد. مشاغل سرگرمی به موضوعی کلیدی در رقابت برای شهردار تبدیل شده است و هر نامزد دیگری را متهم می‌کند که به اندازه کافی برای حمایت از صنعت انجام نمی‌دهد. داستان های مرتبط آیا ایلان ماسک به الیسون ها کمک می کند تا بدهی عظیم Skydance را پرداخت کنند؟ جان مالون پیش‌بینی می‌کند که اسپیس‌ایکس مغول فناوری می‌تواند تا ۱۰ میلیارد دلار در شرکت رسانه‌ای «ماسک» سرمایه‌گذاری کند، حساب تبلیغاتی TikTok به طور موقت پیش از انتشار گسترده مستند به حالت تعلیق درآمده است. لیز گارسیا، سخنگوی، گفت: ما به برخی از شخصیت‌های بزرگ شهردار باس عادت کرده‌ایم، اما این ممکن است یکی از بزرگترین او باشد. او به چشم رای دهندگان نگاه می کند و از افزایش اعتبار مالیاتی فیلم که در سطح ایالت وضع شده است، اعتبار می گیرد. در همین حال، لس آنجلس 40000 شغل سرگرمی را در ساعت خود از دست داده است. شهردار باید زمان کمتری را صرف اعتبار برای کار ساکرامنتو کند و زمان بیشتری را برای پاسخگویی به شکست او در محافظت از مشاغل و تولیداتی که لس‌آنجلس را", "image_url": "https://variety.com/wp-content/uploads/2026/05/Karen-Bass-Nithya-Raman.jpg?crop=0px%2C0px%2C1000px%2C562px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما", "سرمایه‌گذاری"], "datetime_fa": "۱ آبان • ۲۰:۳۱"}, {"source": "Billboard", "title": "Jamie Miller Becomes First Male Solo Welsh Artist to Top U.K. Singles Chart in 41 Years With ‘Babydoll’", "link": "https://www.billboard.com/music/chart-beat/jamie-miller-babydoll-number-1-uk-singles-chart-1236367178/", "summary": "Jamie Miller ’s “Babydoll” has ascended to No. 1 on the U.K. s Official Singles Chart (dated Oct. 23), making him the first Welsh artist in 15 years to land a chart-topping single. The Cardiff-born singer’s achievement marks the first time a Welsh artist has topped the U.K. singles chart since Sian Evans featured on DJ Fresh’s “Louder,” which reached No. 1 in 2011. He also becomes the first Welsh solo male artist to lead the chart in 41 years, since Shakin’ Stevens topped the chart with his holiday hit “Merry Christmas Everyone” in 1985. “Babydoll,” which has become a viral smash in recent weeks due to Miller’s two-step choreography trend, narrowly edged out Tate McRae’ s “Housewife” (No. 2) to hit the summit. Miller told the Official Charts Company in a statement: “I don t even know what to say other than thank you so much for getting me No. 1. This is the biggest thing that s ever happened to me in my life I love you guys.” Elsewhere on the chart, Olivia Rodrigo ’s “Expectations” remix with Chappell Roan lands at No. 3. Ashe’s “Stop the Wedding” follows at No. 4, while Sienna Spiro’s previous chart-topper “Great Expectation” falls to No. 5. Country superstar Zach Bryan scores a new U.K. chart best as “Lies,” featuring Lana Del Rey, climbs to No. 7. Bryan also lands another track in the top 40, with “Lodi When” reaching No. 33 following the release of his new EP, Young Manhood and Other Donatable Organs . Fontaines D.C., who reins triumphant on this week’s Official Albums Chart with chart-topping fifth LP Dopamine Chamber , lands three songs in the top 40. Marianne” finishes at No. 12, marking a new personal best for the Irish five-piece, while “Japan” debuts at No. 14 and “Demolition” enters at No. 18. Justice also returns to the U.K. top 40 for the first time in 20 years. The French electronic duo’s new Grand Theft Auto VI song, “Flower In a Hurricane” featuring Tame Impala and SZA, finishes at No. 31. Rounding out the week’s chart highlights, Michael Jackson’s classic “Thriller” creeps back into the top 40 at No. 39 as Halloween approaches.", "date_str": "2026-10-23T17:00:00+00:00", "hash": "11788f47ee64a05d", "title_fa": "جیمی میلر با «Babydoll» به اولین هنرمند ولزی سولو مرد تبدیل شد که در 41 سال گذشته در جدول تک آهنگ های بریتانیا قرار گرفت.", "summary_fa": "«Babydoll» جیمی میلر در جدول تک‌آهنگ‌های رسمی بریتانیا (مورخ 23 اکتبر) به رتبه 1 صعود کرد و او را به اولین هنرمند ولزی در 15 سال اخیر تبدیل کرد که موفق به کسب یک تک آهنگ برتر شد. موفقیت این خواننده متولد کاردیف اولین بار است که یک هنرمند ولزی پس از حضور سیان ایوانز در آهنگ \"Louder\" از دی جی فرش که در سال 2011 به رتبه اول رسید، در صدر جدول تک آهنگ های بریتانیا قرار گرفت. او همچنین به اولین هنرمند مرد ولزی تبدیل شد که در 41 سال گذشته چارت را رهبری می‌کند، از زمانی که Shakin' Stevens با آهنگ تعطیلاتش «Merry Christmas Everyone» در سال 1985 در صدر جدول قرار گرفت. برای زدن قله میلر در بیانیه‌ای به شرکت نمودارهای رسمی گفت: «من حتی نمی‌دانم چه بگویم جز اینکه از شما بسیار سپاسگزارم که من را شماره 1 کردید. این بزرگترین اتفاقی است که در زندگی من برای من افتاده است. در جای دیگری از چارت، ریمیکس «انتظارات» اولیویا رودریگو با چاپل روان در رتبه 3 قرار می گیرد. «عروسی را متوقف کنید» از اش در رتبه 4 قرار می گیرد، در حالی که «انتظار بزرگ» از سینا اسپیرو در رتبه 5 قرار دارد. با حضور لانا دل ری به شماره 7 صعود می کند. برایان همچنین آهنگ دیگری در 40 آهنگ برتر قرار می گیرد که آهنگ Lodi When به شماره 7 رسید. 33 پس از انتشار EP جدید او، جوانمردی و سایر اعضای قابل اهدا. Fontaines D.C. که در چارت آلبوم های رسمی این هفته با رتبه پنجم آلبوم دوپامین Chamber پیروز شد، سه آهنگ را در بین 40 آهنگ برتر به دست آورد. ماریان در رتبه 12 قرار گرفت و بهترین آلبوم شخصی جدید برای پنج قطعه ایرلندی را به خود اختصاص داد، در حالی که \"Japan\" در رتبه 8.14 اولین بار", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Jamie-Miller-Matthew-Langlois-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Fontaines D.C. Earns 2026’s Biggest Opening Week By a Group as ‘Dopamine Chamber’ Hits No. 1 on U.K. Albums Chart", "link": "https://www.billboard.com/music/chart-beat/fontaines-dc-dopamine-chamber-number-1-uk-albums-chart-1236364318/", "summary": "Fontaines D.C. has secured its second No. 1 on the U.K. s Official Albums Chart with Dopamine Chamber , delivering one of the biggest album debuts of 2026 so far. Related Fontaines D.C. s Dopamine Chamber : Every Song Ranked Fontaines D.C. Enlist Rosalía for Stunning Duet Where Is Gone? : Listen Tate McRae Debuts at No. 1 In Australia With ‘Housewife’ According to the Official Charts Company, the Irish five-piece shifted more than 70,000 chart units during the album’s opening week for the chart dated Oct. 23, giving Dopamine Chamber the third-biggest opening week for an album in 2026, following Harry Styles’ Kiss All the Time. Disco, Occasionally (183,000 chart units) and Olivia Rodrigo’s you seem pretty sad for a girl so in love (103,000 chart units). It marks the band’s second U.K. chart-topper, following 2022’s Skinty Fia . Reviewing Dopamine Chamber for Billboard U.K. , editor Thomas Smith wrote that the album treads a fine line between introspection and darkness, with stadium-headlining ambition and does so superbly, adding that the set could be the start of the band s Imperial Phrase, to borrow a phrase from Pet Shop Boys’ Neil Tenant. Rodrigo’s you seem pretty sad follows at No. 2, while Michael Jackson’s The Essential Compilation lands at No. 3. Olivia Dean’s The Art of Loving holds firm at No. 4, while Sienna Spiro’s July debut LP, Visitor , rounds out the top five. British-Zimbabwean singer Rachel Chinouriri earns her first top 10 album as sophomore LP I Think I Spoke Too Soon finishes at No. 9, with Zach Bryan’s Young Manhood and Other Donatable Organs coming in at No. 11. Tate McRae’s 2025 album So Close To What also rebounds into the top 40, landing at No. 29 following renewed interest sparked by her latest single, “Housewife.” Midlands singer-songwriter Nieve Ella scores a milestone as her debut album, How Long Will It Take? , enters the chart at No. 31.", "date_str": "2026-10-23T17:00:00+00:00", "hash": "e8dfa571a6ae ر که او در مصاحبه خود در پادکست Rolling Stone Music Now توضیح می دهد. در این مصاحبه، پرایس عمیقاً به ساخت یکی از بهترین آلبوم‌های سال می‌پردازد، از میکس‌تیپ‌ها و تأثیرات خانه‌ای که صدای آن را شکل داده تا مدونا در ترکیب بی‌باکانه رویدادهای زندگی شخصی‌اش در آهنگ‌نویسی، و همچنین به همکاری‌های زنده این زوج می‌پردازد. می‌توانید یک نسخه فشرده از مصاحبه زیر را بخوانید، یا به پادکست‌های اپل یا Spotify گوش دهید (یا فقط پخش را در بالا فشار دهید). آیا در طول تور جشن شروع به صحبت در مورد ساخت موسیقی جدید کردید؟ خیر تور جشن اولین باری بود که برای مدتی با هم کار کردیم، اما کار بر روی نمایش ها، کار کردن به صورت زنده در واقع منشأ شروع همکاری خلاقانه ما [در وهله اول] بود. در ابتدا، برای تور جهانی غرق شده، این اولین باری بود که ما با هم ملاقات کردیم. این اولین باری بود که ما واقعاً احساس کردیم که یکدیگر چگونه خلاقانه هستند. و تورها عناصر بسیار زیادی در خود دارند. آنها عنصر خلاقیت را دارند. آنها همچنین عنصر استقامت و بقا را دارند، زیرا شما واقعاً روزانه در مکان ها مشکل", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/stuart-price-madonna-confessions-ii.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "موسیقی"], "datetime_fa": "۱ آبان • ۱۹:۴۹"}, {"source": "Rolling Stone", "title": "‘The Notebook’ Musical Will Premiere on the West End in 2027", "link": "https://www.rollingstone.com/music/music-news/the-notebook-musical-london-west-end-premiere-1235647109/", "summary": "The Judi Dench Theatre, previously named the Shaftesbury Theatre, will be home to the production", "date_str": "2026-10-23T16:17:26+00:00", "hash": "286ee9514e984879", "title_fa": "موزیکال «The Notebook» در سال 2027 در وست اند اکران خواهد شد", "summary_fa": "The Judi Dench Theatre که قبلاً Shaftesbury Theatre نام داشت، محل تولید هر عشق بزرگ با یک داستان عالی است و The Notebook s در سال 2027 به سمت West End می رود تا یکی از کلاسیک ترین داستان های عاشقانه همه آنها را روایت کند. اقتباس موزیکال The Notebook که برای اولین بار در سال 2024 در برادوی عرضه شد، با پیش نمایش از 10 مارس در بریتانیا به نمایش در خواهد آمد و پس از آن در 13 آوریل افتتاحیه رسمی خواهد شد. تئاتر جودی دنچ که قبلاً تئاتر شفتسبری نامیده می شد، محل تولید کارگردانان مایکل گریف و شل ویلیامز خواهد بود. اینگرید مایکلسون که موسیقی و اشعار نمایش را نوشته است، در بیانیه‌ای گفت: «چیزی که یک موزیکال را برای من بسیار خاص می‌کند، ماهیت مشارکتی آن است و نمی‌توانم تیم بهتری از افراد را برای ساخت The Notebook تصور کنم. بازبینی و احیای مجدد قطعه با بکاه [برونستتر]، مایکل، شله و بقیه اعضای تیم برای این محصول جدید در لندن، افتخاری است و برای اولین بار بودن موزیکال ما در تئاتر جودی دنچ، فوق العاده هیجان انگیز است. برانستتر این کتاب را برای The Notebook نوشت که بر اساس رمان نیکلاس اسپارکس در سال 1996 و فیلم نیک کاساوتیس در سال 2004 هر دو به همین نام است. اسپارکس گفت: \"زمانی که 30 سال پیش نوت بوک را منتشر کردم، نمی توانستم پیش بینی کنم که این داستان چنین تاثیر ماندگاری در سراسر جهان داشته باشد. استقبال جهانی باورنکردنی بوده است، و من هیجان زده هستم که این آخرین تحول داستان را با تماشاگران لندن به اشتراک می گذارم. بازیگران تولید هنوز توسط جیل گرین فاش نشده اند، اما قرار است بازیگر نقش اصلی را بر عهده بگیرد.\"", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/the-notebook-musical.jpg?crop=79px%2C0px%2C1721px%2C969px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۱۹:۴۷"}, {"source": "Hollywood Reporter", "title": "IATSE’s First Tech Czar Wants Crew Members Involved in the Creation of AI Tools (Exclusive)", "link": "https://www.hollywoodreporter.com/business/business-news/iatses-first-tech-officer-ai-reskilling-1236738751/", "summary": "Jillian Arnold, the sprawling crew union’s inaugural labor and technology intelligence officer, says she wants to help reskill workers and involve them in the development of AI use in the business.", "date_str": "2026-10-23T17:00:00+00:00", "hash": "59989fb1243ad51d", "title_fa": "اولین تزار فناوری IATSE می‌خواهد اعضای خدمه در ایجاد ابزارهای هوش مصنوعی شرکت کنند (انحصاری)", "summary_fa": "جیلیان آرنولد، افسر اطلاعات کارگری و فناوری در اتحادیه گسترده خدمه، می‌گوید که می‌خواهد به مهارت‌های مجدد کارگران کمک کند و آنها را در توسعه استفاده از هوش مصنوعی در تجارت مشارکت دهد. با افزایش استفاده از هوش مصنوعی در هالیوود، اتحادیه برتر خدمه صنعت سرگرمی یک کارمند اختصاصی را استخدام کرده است تا به آنها کمک کند تا در این دنیای جدید شجاع و نامطمئن حرکت کنند. جیلیان آرنولد، اولین افسر اطلاعات کار و فناوری بیش از 170000 نفر، که وظیفه دارد اتحادیه را در جریان پیشرفت‌های فناوری قرار دهد و از کارگرانش محافظت کند، وارد شوید. با حوزه قضایی ای که ایالات متحده و کانادا را در بر می گیرد، او قرار است در مذاکرات قرارداد، ابتکارات مهارت مجدد و ارتقاء مهارت و تلاش های سیاست فدرال و ایالتی شرکت کند. او به هالیوود ریپورتر گفت، اگرچه استخدام او در روز جمعه توسط IATSE به طور عمومی اعلام شد، آرنولد از اواخر جولای بی سر و صدا در این نقش مشغول به کار بوده است. او گفت: \"ما می خواهیم مطمئن شویم که بخشی از استقرار و ادغام هر هوش مصنوعی در صنعت خود هستیم تا ابزارهایی را بسازیم که برای کارگران باشد، نه جابجایی کارگران.\" آرنولد از نوع سیلیکون ولی نیست، بلکه خود یک خدمه سابق است. رئیس سابق IATSE Local 695 و اولین زنی که تا به حال این موقعیت را به دست آورده است، او یک مهندس ویدئو و فیلمبردار سابق است که دارای اعتباری است که شامل ماموریت های ناسا (فرود مریخ نورد کنجکاوی، ماموریت جونو) و تلویزیون زنده (جوایز اسکار، امی، جوایز موسیقی ویدئوی MTV) می شود. در سال 2024، او ریاست کمیته فرعی هوش مصنوعی اتحادیه را در جریان مذاکرات آن با استودیوها و استریمرها بر عهده داشت. بر اساس بیانیه ای از متیو لوب، رئیس بین المللی IATSE، آرنولد ثابت کرده", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/JA_headshot_2026.jpg?crop=0px%2C0px%2C1291px%2C723px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی", "روابط بین‌الملل"], "datetime_fa": "۱ آبان • ۲۰:۳۰"}, {"source": "Hollywood Reporter", "title": "Ted McGinley Tapped to Narrate Volleyball Documentary ‘Kings of the Beach’", "link": "https://www.hollywoodreporter.com/movies/movie day of July and debuted atop the Billboard 200 . It spawned Grande s 10th Hot 100 No. 1, Hate That I Made You Love Me. After the music video for the album s title track dropped, however, an outpour of comments on her body and appearance flooded the internet. Her rep revealed that she d be taking a step back from the spotlight shortly afterward, citing endless, ongoing public scrutiny. The break has involved dropping out of the West End revival of Sunday in the Park With George which would-be costar Jonathan Bailey has also since pulled out of and scaling back public appearances. She will, however, participate in Focker-in-Law promo as the film s Nov. 25 premiere d", "date_str": "2026-10-23T15:26:17+00:00", "hash": "70d4ef421ddcafc5", "title_fa": "آریانا گرانده باب جدیدی را نشان می دهد که دوست پسرش ریکی آلوارز دوباره عاشق شده است", "summary_fa": "موهای من را دوست داری؟ مرسی، همین الان خردش کردم. آریانا گرانده اکنون در حال تکان دادن باب است که برای اولین بار در یک پست جمعه (23 اکتبر) در اینستاگرام خود را نشان داد و دوست پسر ریکی آلوارز همه چیز را برای این کار دوست دارد. مرتبط آریانا گراند عزادار کوکو، سگ محبوبش در 17 سال است: من هر روز دلم برایت تنگ خواهد شد پیت دیویدسون انتقاد آنلاین از نامزد سابق آریانا گرانده ظاهر آریانا گرانده را به باد انتقاد می‌گیرد: من فکر می‌کنم این کار انجام می‌شود آریانا گرانده به‌خوبی توییتی را انجام می‌دهد. نمایش سوپراستار پاپ یک رشته سلفی در پست خود به اشتراک گذاشت که دوربین را به پهلو گرفته و به لنز خیره شده است. اما به جای اینکه دم اسبی مشخص خود را بکشد یا با مدل موی شیکی که اخیراً گرانده پوشیده است، موهایش چند اینچ بالاتر از شانه‌هایش کوتاه می‌شود، و انتهای آن به شکلی سرحال به سمت بالا می‌چرخد. گرانده اجازه داد ظاهر جدید خودش صحبت کند، عکس‌ها را با یک قلب ساده شرح می‌دهد و آرایشگر براندون پیچ را تگ می‌کند. نظرات به سرعت مملو از دوستان مشهوری شد که از تغییر چهره برنده گرمی تعریف می کردند، با نوشتن جیجی حدید، بسیار زیبا!!!!!!!!! و بازیگر پیروز دانیلا مونه در حال تایپ کردن، عیار طبیعی. اما نظر آلوارز قطعاً جلوگیرترین بود. عکاس نوشت: می خواهم از شما درخواست کنم. گرانده و آلوارز برای اولین بار در سال 2015 با هم قرار گرفتند و زمانی که او به عنوان رقصنده پشتیبان خواننده کار می کرد با هم ملاقات کردند. آنها زمانی در سال 2016 از هم جدا شدند، اما یک دهه بعد دوباره عاشقانه خود را احیا کردند، و طرفداران آنها را در طول تابستان 2026 در کنار هم در میان تور Eternal Sunshine Tour و آلبوم گلبرگ بازیگر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/P103MHHX-e1786379508733.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۱۸:۵۶"}, {"source": "Billboard", "title": "After a Turbulent Year, BNXN Is ‘Back Outside’ & Taking Charge of His Career: Find His Track-by-Track Guide to New EP", "link": "https://www.billboard.com/lists/bnxn-still-in-charge-back-outside-interview/", "summary": "After a heated split with his former management team in 2025, BNXN finds himself in redemption mode. The Nigerian hitmaker, who dropped out of college after catching Burna Boy s attention in the early 2020s, is looking to recapture his momentum, one song at a time. “A whole lot has changed,” BNXN reflects shortly after releasing his new EP, Still in Charge . “After I dropped the Captain album, I toured, reshuffled my team, and took a lot of time off to prepare the music that was coming next. Came back in May and dropped a little project with Sarz called The Game Needs Us. One of the songs went really crazy, Back Outside. I m really excited I got to put that out because it showed people that [ Captain ] wasn t a joke. He really knows what he s doing.” With Still in Charge , released earlier this month, the Afrobeats star sounds rejuvenated and eager to turn the page. Whether he s joining forces with Asake on the opener “Eja Meja” or wrestling with his past on “Deliberate Work,” BNXN (pronounced Benson) moves with purpose and intention. The six-track offering also radiates a warm, festive energy as he looks to shed the remnants of his turbulent past and embrace a fresh start. On “Shamaya,” BNXN trades his frustrations for celebration, revealing a lighter, more carefree side of the twenty-something singer-songwriter. Billboard caught up with BNXN for his explanation of each of the six tracks on Still in Charge , the surprising amount he paid Qing Madi for her background vocals on “16,” and how he bounced back from his highly publicized online crashout.", "date_str": "2026-10-23T15:16:31+00:00", "hash": "a5427531d34fb879", "title_fa": "پس از یک سال پرتلاطم، BNXN \"بازگشت به بیرون\" است و مسئولیت حرفه خود را بر عهده می گیرد: راهنمای آهنگ به تراک او را برای EP جدید پیدا کنید", "summary_fa": "پس از جدایی شدید با تیم مدیریت سابق خود در سال 2025، BNXN خود را در حالت رستگاری می بیند. هیت ساز نیجریه ای که پس از جلب توجه Burna Boy در اوایل دهه 2020، کالج را رها کرد، به دنبال این است که شتاب خود را دوباره به دست آورد، یک آهنگ. BNXN مدت کوتاهی پس از انتشار EP جدید خود، Still in Charge، منعکس می کند: «خیلی چیزها تغییر کرده است. «بعد از اینکه آلبوم کاپیتان را رها کردم، به تور رفتم، تیمم را تغییر دادم و زمان زیادی را برای آماده کردن موسیقی که در راه بود، گرفتم. در ماه می برگشتم و پروژه کوچکی را با Sarz به نام The Game Needs Us منتشر کردم. یکی از آهنگ ها واقعا دیوانه شد، Back Outside. من واقعاً هیجان‌زده‌ام که مجبور شدم آن را بیان کنم، زیرا به مردم نشان داد که [کاپیتان] شوخی نبود. او واقعاً می داند که دارد چه کار می کند.» با Still in Charge که در اوایل این ماه منتشر شد، ستاره Afrobeats جوان شده و مشتاق به تغییر صفحه به نظر می رسد. چه او در حال پیوستن به نیروهای Asake در بازکننده \"Eja Meja\" یا کشتی با گذشته خود در \"Deliberate Work\" باشد، BNXN (تلفظ بنسون) با هدف و نیت حرکت می کند. پیشنهاد شش آهنگی همچنین انرژی گرم و جشنی را ساطع می کند، زیرا او به دنبال رها کردن بقایای گذشته آشفته خود و در آغوش گرفتن شروعی تازه است. در «شمایا»، BNXN ناامیدی‌هایش را با جشن عوض می‌کند و جنبه‌ای سبک‌تر و بی‌خیال‌تر از خواننده و ترانه‌سرا بیست و چند ساله را نشان می‌دهد. بیلبورد با BNXN برای توضیح هر یک از شش آهنگ در Still in Charge، مبلغ شگفت‌انگیزی که به چینگ مادی برای آواز پس‌زمینه‌اش در «16» پرداخت کرد، و نحوه بازگشت او از کراش اوت", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/bnxn-2026-press-cr-mykyta-vashchenko-billboard-1800.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۸:۴۶"}, {"source": "Billboard", "title": "John Legend to Appear With Democratic Ohio Gov. Candidate Amy Acton Amid Backlash Against Opponent’s ‘Deeply Troubling’ Ad", "link": "https://www.billboard.com/culture/politics/john-legend-appear-ohio-gov-candidate-acton-backlash-ramaswamy-1236367094/", "summary": "John Legend will throw his hat into the ring for Ohio gubernatorial candidate Dr. Amy on Monday (Oct. 26), when he is slated to appear with the former state director of the Ohio Department of Health at a rally in Dayton. Legend is just one of the bold-faced names Acton will bring out on the road with her in the lead-up to the Nov. 3 midterm election in which she is facing off against tech mogul and former DOGE co-lead Vivek Ramaswamy. First up on Sunday (Oct. 25) will be a joint appearance in Akron with Democratic U.S. Senator from Georgia Rev. Raphael Warnock, followed by a rally in Cincinnati on Oct. 28 featuring Queen City natives Aaron Dessner and Matt Berninger of The National. Springfield, Ohio native Legend has long used his platform to stump for candidates and causes, backing former President Barack Obama in 2008 and endorsing former Vice President Kamala Harris in her 2024 presidential bid. He also spoke out during that campaign against unfounded, hateful racist attacks by then-candidate Donald Trump and running mate and Ohio native JD Vance against the Haitian resident of Springfield. Legend s support for Acton comes as Ramaswamy s campaign has come under fierce bipartisan pushback for a campaign ad in which Acton s long-estranged mother repeatedly calls her daughter a liar while insinuating that Acton s claims that she was sexually abused by her stepdad, and that the family was homeless and lived in a tent for a period, are untrue. “It’s not easy for a mother to say this, but Amy has a serious problem,” Donna Arthur says in the ad. “She lies about her past. She says she grew up living in a tent. None of that is true. She’s lied her entire life. Acton, 60, has said she hasn t spoken to her mother since she was 12-years-old, when officials removed her from her mother s custody. Police arrested Acton s stepfather in July 1978 on rape charges , with a grand jury later indicting Arthur for engaging in sexual conduct with Acton when she was under the age of 13. Arthur, who pleaded not guilty to the charges initially, did not appear in court and later fled, along with her mother, and became a fugitive. 13ABC also reported that documents provided by Acton s campaign include police and court records and a 1982 sheriff s report in which a park manager confirmed that Acton s stepfather, Cledith Arthur, lived at the campground years earlier. The ad, which many political pundits have called the most disturbing of a very heated political season, has gotten pu", "date_str": "2026-10-23T15:16:30+00:00", "hash": "fe8e12699023103d", "title_fa": "جان لجند با امی اکتون، نامزد دموکرات فرماندار اوهایو در میان واکنش‌های شدید علیه تبلیغ «عمقاً نگران‌کننده» مخالف ظاهر می‌شود.", "summary_fa": "جان لجند روز دوشنبه (26 اکتبر)، زمانی که قرار است همراه با مدیر سابق وزارت بهداشت اوهایو در یک گردهمایی در دیتون ظاهر شود، کلاه خود را برای کاندیدای فرمانداری اوهایو، دکتر امی، به رینگ خواهد انداخت. Legend تنها یکی از نام‌های جسورانه‌ای است که اکتون در انتخابات میان‌دوره‌ای 3 نوامبر با او در جاده‌ها به میدان می‌آورد و در آن با غول فناوری و همکار سابق DOGE ویوک راماسوامی روبرو می‌شود. اولین بار در روز یکشنبه (اکتبر. 25) یک حضور مشترک در آکرون با سناتور دموکرات ایالات متحده از جورجیا کشیش رافائل وارنوک خواهد بود و پس از آن گردهمایی در سینسیناتی در 28 اکتبر با حضور بومیان کوئین سیتی آرون دسنر و مت برنینگر از The National برگزار خواهد شد. افسانه بومی اسپرینگفیلد، اوهایو، مدت‌هاست که از پلتفرم خود برای حمایت از نامزدها و اهداف، حمایت از باراک اوباما، رئیس‌جمهور سابق در سال 2008 و حمایت از معاون رئیس‌جمهور سابق کامالا هریس در رقابت‌های ریاست‌جمهوری سال 2024 استفاده کرده است. او همچنین در جریان آن مبارزات انتخاباتی علیه حملات نژادپرستانه بی‌اساس و نفرت‌انگیز توسط دونالد ترامپ، نامزد سابق انتخابات و جی‌دی ونس، اهل اوهایو، علیه ساکنان هائیتی در اسپرینگفیلد صحبت کرد. حمایت افسانه‌ای از اکتون در حالی صورت می‌گیرد که کمپین راماسوامی با واکنش شدید دو حزبی برای تبلیغات کمپینی روبرو شده است که در آن مادر اکتون که مدت‌ها از او دور شده بود، بارها دخترش را دروغگو خطاب می‌کند و در عین حال القا می‌کند که اکتون ادعا می‌کند که توسط پدرخوانده‌اش مورد آزار جنسی قرار گرفته است، و اینکه خانواده بی‌خانمان بوده و در یک چادر زندگی می‌کنند. دونا آرتور در تبلیغ می گوید: گفتن این حرف برای مادر آسان نیست، اما امی یک مشکل جدی دارد. او در مورد گذشته خود دروغ می گوید. او می گوید که در یک چادر بزرگ شده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P106J9VJ-e1792765487484.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۱۸:۴۶"}, {"source": "Billboard", "title": "‘People Might Think I’m a Closed Book’: On Her Debut Album, Jazzy Is Opening Up", "link": "https://www.billboard.com/music/music-news/jazzy-interview-peace-and-patience-album-calvin-harris-1236367057/", "summary": "Jazzy had made a lot of music for her debut album — and when it came time to decide which songs would make it onto the project, she selected tracks around two related themes. These concepts were so crucial to the music and the experiences that informed it that she ultimately made them the name of the album. This 13-song set, Peace Patience , is out today (Oct. 23) via Chaos Records. A tight 36 minutes of sumptuous house-leaning dance pop, the album is centered around Jazzy s gorgeously textured voice and cements her as a crucial next-gen dance pop hitmaker. Related Head Trip 2026 Was (Accidentally) the Craziest One-Night Lineup in EDM History: Seven Takeaways From the Historic Festival Tate McRae Debuts at No. 1 In Australia With Housewife LISA, Miley, Kacey Musgraves John Mayer: New Music Friday Guide She s developed this reputation in her native Ireland and nearby U.K. over the last half-decade with a series of chart hits, including 2023 s Giving Me — her first solo single, which reached No. 3 on the UK Singles Chart and hit No. 1 on the Official Irish Singles Chart, knocking “Miracle” by Calvin Harris and Ellie Goulding into the No. 2 position. Harris noticed, which led to him and Jazzy pairing up for May s Satisfy, which itself hit No. 1 on Billboard s Dance Airplay chart this past June. All in, the Dublin-born DJ/producer has made these successes look pretty easy — and in fact, she makes her journey from Dublin child violinist to chart-topping dance star sound pretty breezy too. Meeting with Billboard in a sunny office in the Capitol Records building in Los Angeles on a recent Friday morning, Jazzy — dressed in athleisure — is cheerful and warm. Tonight (Oct. 23), she ll play a set at the nearby nightclub Sound, the second to last date on an American club tour around Peace Patience . The album s release party will find her back in her native Dublin, where she plans celebrate at the pub with a handful of friends before joining many thousand more the next evening for a show at the city s 3Arena that will mark her biggest headlining performance to date. Here, Jazzy talks about her origins, her album and being in the studio with Harris. You ve said you had a lot of music to choose from for the album, some of it a few years old. Were you selecting songs around a theme in terms of what ultimately made it on? Yeah, I wanted them to be cohesive, and I wanted to pick ones that meant the most to me — ones with stories I wanted to tell. I feel like people might ", "date_str": "2026-10-23T15:01:51+00:00", "hash": "5a9f46a36213bc51", "title_fa": "\"مردم ممکن است فکر کنند من یک کتاب بسته هستم\": در اولین آلبوم خود، Jazzy در حال باز شدن است", "summary_fa": "Jazzy برای اولین آلبوم خود آهنگ های زیادی ساخته بود - و زمانی که زمان تصمیم گیری فرا رسید که کدام آهنگ ها وارد پروژه شوند، او آهنگ هایی را با دو موضوع مرتبط انتخاب کرد. این مفاهیم به قدری برای موسیقی و تجربیاتی که به آن کمک می‌کرد بسیار حیاتی بودند که در نهایت او آنها را به نام آلبوم تبدیل کرد. این مجموعه 13 آهنگی، صبر صلح، امروز (23 اکتبر) از طریق Chaos Records منتشر شد. این آلبوم با 36 دقیقه رقص پاپ مجلل و متمایل به هاوس، حول صدای بسیار زیبای Jazzy متمرکز شده است و او را به عنوان یک سازنده هیت پاپ رقص نسل بعدی تعیین می کند. Related Head Trip 2026 (به طور تصادفی) دیوانه‌کننده‌ترین ترکیب یک شبه در تاریخ EDM بود: هفت نکته از جشنواره تاریخی تیت مک‌ری در رتبه اول در استرالیا با زن خانه‌دار لیزا، مایلی، کیسی ماسگریوز جان مایر: New Musicby Friday Guide او در نزدیکی Ureput. در نیم دهه گذشته با مجموعه‌ای از پرفروش‌ها، از جمله Giving Me در سال 2023 - اولین تک‌آهنگ انفرادی او، که به رتبه 3 جدول تک‌آهنگ‌های بریتانیا رسید و در جدول رسمی تک‌آهنگ‌های ایرلندی به شماره 1 رسید و آهنگ Miracle توسط کالوین هریس و الی گولدینگ را به رتبه 2 رساند. هریس متوجه شد، که منجر به جفت شدن او و Jazzy برای May s Satisfy شد، که خود در ژوئن گذشته در جدول Dance Airplay بیلبورد در رتبه اول قرار گرفت. در مجموع، دی‌جی/تهیه‌کننده متولد دوبلین این موفقیت‌ها را بسیار آسان جلوه داده است - و در واقع، او سفر خود را از نوازنده کودک ویولن دوبلین تا ستاره‌ی رقص برگزیده در جدول، بسیار شاداب می‌کند. ملاقات با بیلبورد در یک دفتر آفتابی در ساختمان Capitol Records در لس آنجلس در صبح جمعه اخیر، Jazzy - با لباس ورزشی - شاد", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Billboard_Jazzy_2026.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۸:۳۱"}, {"source": "Deadline", "title": "David Zayas Joins Dakota Fanning In Apple TV’s Alex Cary Thriller Series", "link": "https://deadline.com/2026/10/david-zayas-cast-apple-tv-alex-cary-series-1237171754/", "summary": "EXCLUSIVE: David Zayas (Dexter, The Bear) is se  جوایز نقدی برای حمایت از توسعه خود دریافت کردند. جایزه توسعه پروژه سریال انیمیشن برجسته به سوفی، اگر هستی به ما نشان بده! به کارگردانی داریو پیانا ایتالیایی، محصول مشترک ایتالیا، بلژیک و اسپانیا بین برند کراس، 20 عکس تا نیمه شب و دیجیاتونز اینترتینمنت، رسید. این سریال بر روی یک نوجوان 13 ساله به نام سوفی تمرکز دارد که هر روز در قبرستان میلان برای پدربزرگش توماس عزاداری می کند. واقعیت او زمانی از هم می پاشد که دو کودک ارواح بدجنس از جهان پایین، به اصطلاح Vivitic Séance ممنوعه ای اجرا می کنند و به طور تصادفی سوفی را به این قلمرو دیگر می کشانند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/Inheritance-1000-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۱۹:۰۴"}, {"source": "Variety", "title": "Who Should Be the Next James Bond? 25 Picks for the New 007", "link": "https://variety.com/lists/next-james-bond-henry-cavill-james-norton-rege-jean-page/", "summary": "Ever since Daniel Craig announced that he would be turning in the tuxedo and putting down the martini glass, the race has been on to decide who will be chosen as the next James Bond. The rumor mill has been heating up for years now, but now it s really down to the wire for the [ ]", "date_str": "2026-10-23T15:30:00+00:00", "hash": "58e735eb33951904", "title_fa": "جیمز باند بعدی چه کسی باید باشد؟ 25 انتخاب برای 007 جدید", "summary_fa": "از زمانی که دنیل کریگ اعلام کرد که با تاکسیدو می چرخد ​​و لیوان مارتینی را زمین می گذارد، رقابت برای تصمیم گیری برای انتخاب جیمز باند بعدی ادامه دارد. شایعات سال‌هاست که داغ می‌شود، اما اکنون واقعاً برای [ ] به پایان رسیده است، هنگامی که دنیس ویلنوو، کارگردان فیلم Dune برای تهیه‌کنندگی قسمت بعدی استخدام شد، با نوشتن فیلمنامه توسط استیون نایت، تصمیم گیری در مورد اینکه نینا گلد و ویلنوو چه کسی را برای انتخاب کارگردان انتخاب کنند. این چیزی است که ما می دانیم: باند جدید تقریباً مطمئناً 007 آشنا نخواهد بود. اگر فیلم بعدی از جدول زمانی No Time to Die پیروی کند، جیمز باند مرده است و شخصیت لاشانا لینچ، نومی، شماره مامور MI6 خود را پذیرفته است. البته، فیلم بعدی باند به راحتی می‌تواند این جدول زمانی تعیین شده را کنار بگذارد و به طور کلی در یک جهان جایگزین باند اتفاق بیفتد. (به هر حال، هیچ وقت چندان منطقی نبود که باند شون کانری از دهه 1960 و پیرس برازنان باند از دهه 1990 یک شخص باشند.) باربارا بروکلی و مایکل ویلسون، تهیه کنندگان قبلی سریال، سه چیز را روشن می دانستند: باند بعدی باید توسط یک بریتانیایی بازی شود. باند بعدی باید آنقدر جوان باشد که بتواند حداقل 15 سال به این نقش ادامه دهد. و باند بعدی یک مرد خواهد بود نه یک زن. اما با توجه به اینکه کلم بروکلی و ویلسون کنترل خلاقانه را به آمازون MGM واگذار کرده اند، نمی توان گفت که چه تغییراتی ممکن است رخ دهد. ایمی پاسکال و دیوید هیمن اکنون تهیه کنندگی را بر عهده دارند و از آنجایی که این اولین فیلم باند آنهاست، ممکن است هر تعداد تغییری در انتظارشان باشد. و همانطور که مامور 007 بهتر از بسیاری می‌داند، قوانین در صورتی که کاملاً شکسته نشوند، باید منحرف شوند.", "image_url": "https://variety.com/wp-content/uploads/2024/11/2025-ee-bafta-film-awards-special-access-the-dog-stars-world-1000x667-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۱ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "AI Giant Nvidia Invests in Entertainment Startup Higgsfield", "link": "https://variety.com/2026/digital/news/nvidia-tcv-invest-generative-ai-startup-higgsfield-1236929624/", "summary": "Higgsfield, the AI video and image generation company dabbling across both marketing and entertainment spaces, extended its Series B funding round with new investments from Nvidia and the investment firm TCV. The San Francisco-based company announced the investments as Nvidia CEO Jensen Huang visited Kazakhstan on Friday, where much of Higgsfield s founding team hails from. [ ]", "date_str": "2026-10-23T15:18:11+00:00", "hash": "2478ca5b8a77ef36", "title_fa": "غول هوش مصنوعی انویدیا در استارتاپ سرگرمی هیگزفیلد سرمایه گذاری می کند", "summary_fa": "هیگزفیلد، شرکت تولید تصویر و ویدئو با هوش مصنوعی که در فضاهای بازاریابی و سرگرمی فعالیت می کند، دور سرمایه گذاری سری B خود را با سرمایه گذاری های جدید انویدیا و شرکت سرمایه گذاری TCV گسترش داد. این شرکت مستقر در سانفرانسیسکو این سرمایه‌گذاری‌ها را در حالی اعلام کرد که مدیرعامل انویدیا، جنسن هوانگ، روز جمعه از قزاقستان بازدید کرد، جایی که بسیاری از تیم موسس هیگزفیلد از آنجا می‌آیند. [ ] هیگزفیلد، شرکت تولید ویدیو و تصویر هوش مصنوعی که در فضاهای بازاریابی و سرگرمی فعالیت می کند، دور سرمایه گذاری سری B خود را با سرمایه گذاری های جدید انویدیا و شرکت سرمایه گذاری TCV گسترش داد. الکس مشربوف، مدیرعامل هیگزفیلد در بیانیه‌ای گفت: اکنون هر برند، استودیو و خالقی به محتوای بصری بیشتری نسبت به تولید سنتی نیاز دارد و دسته جدیدی برای پاسخگویی به این تقاضا در حال شکل‌گیری است. «TCV از شرکت‌های نمادینی که رسانه‌ها را متحول کرده‌اند حمایت کرده است و انویدیا هر نسل از پلتفرم ما را تامین کرده است. با رهبران از کامپیوتر تا توسعه رسانه، ما موقعیت خوبی برای رهبری این مرز جدید داریم.\" نیل تولانی، جنرال پارتنر افزود: «ما معتقدیم الکس و تیم هیگزفیلد چشم‌اندازی قدرتمند را با سرعتی از سرعت محصول و پذیرش بازار ارائه می‌کنند که به ندرت شاهد آن بوده‌ایم: مکانیزمی کاملاً سریع‌تر، حرفه‌ای و بومی هوش مصنوعی برای سازندگان، بازاریابان برند و آژانس‌ها برای تبدیل ایده‌ها به تصویر و ویدیو. انویدیا قبلاً روی استارت‌آپ‌های هوش مصنوعی دیگری سرمایه‌گذاری کرده است، از جمله دو سرمایه‌گذاری جداگانه در Runway شریک Lionsgate. سرمایه‌گذاری هیگزفیلد آن، اولین سرمایه‌گذاری انویدیا در این شرکت، در حالی صورت می‌گیرد که این استارت‌آپ برای تقویت پلتفرم خود به منابع غول فناوری تکیه کرده است، جایی که 12 تریلیون توکن در ماه در 150 میلیون نسل پردازش می‌کند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/Zhaslan-Madiyev-Kazakhstans-Deputy-Prime-Minister-and-Minister-of-AI-and-Digital-Development.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "سرمایه‌گذاری"], "datetime_fa": "۱ آبان • ۱۸:۴۸"}, {"source": "Deadline", "title": "Tribeca Horror ‘Recluse’ Gets North American Deal With Vertical", "link":     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
