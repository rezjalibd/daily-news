apital for backers via separately managed accounts, this person said, including a macro strategy that is up 28% this year through the end of August. The average macro fund, according to hedge fund research firm PivotalPath, is up less than 6% through the same period. SMAs are an increasingly common way for allocators to access alternative investment strategies, as the structure provides greater transparency into the underlying strategy than a traditional hedge fund. For aspiring asset manager founders, it can be a simpler way to launch a new firm or strategy. The firm has also \"streamlined\" head count by using AI agents to assist investment staff, the person close to the firm said, reducing costs. Regulatory filings show that the firm has 18 total staffers, including investment talent in offices in New York and Los Angeles, as well as at its headquarters in Singapore. At the start of 2023, regulatory filings show that the firm had 55 staffers. Levinson is well-known in the Asia investing scene. A former Goldman Sachs prop trader, he was an executive at Fortress before spinning out and starting Graticule in 2015. Read the original article on Business Insider", "date_str": "2026-09-28T07:00:01+00:00", "hash": "27e01f164a0f1f66", "title_fa": "سه سال پس از سقوط SVB که صندوق تامینی او را از بین برد، Adam Levinson's Graticule به مدیریت 3 میلیارد دلار بازگشت.", "summary_fa": "آدام لوینسون Graticule را پس از کار در Fortress و Goldman Sachs شروع کرد. SALT Graticule، یک مدیر دارایی کلان مستقر در سنگاپور، اکنون 3 میلیارد دلار را مدیریت می کند. این شرکت در سال 2023، زمانی که صندوق تامینی شاخص آن سقوط کرد، تمام سرمایه را برگرداند. این شرکت که توسط آدام لوینسون اداره می شود، یک استراتژی کلان دارد که در سال جاری نزدیک به 30 درصد رشد داشته است. سه سال پیش، مدیر دارایی آدام لوینسون مستقر در سنگاپور، پسر پوستر خرابه بازار اوراق قرضه ناشی از فروپاشی بانک سیلیکون ولی بود. Graticule Asset Management Asia که سال 2023 را با حدود 3 میلیارد دلار آغاز کرد، به لطف شرط‌بندی‌های نادرست بر روی نرخ‌های بهره کوتاه‌مدت، صندوق تامینی کلان شاخص خود بیش از 25 درصد از دست داده است. این شرکت این استراتژی را در سه ماهه اول سال 2023 تعطیل کرد و سرمایه را به سرمایه گذاران برگرداند. یکی از نزدیکان به این شرکت به Business Insider گفت: اکنون Graticule بار دیگر ۳ میلیارد دلار را مدیریت می کند و دارایی های خود را تحت مدیریت در جایی که قبل از سقوط بودند بازسازی کرده است. این شخص گفت، به جای یک صندوق تامینی، این شرکت سرمایه را برای حامیان از طریق حساب‌های مدیریت شده جداگانه مدیریت می‌کند، از جمله یک استراتژی کلان که امسال تا پایان آگوست 28 درصد افزایش یافته است. طبق گفته شرکت تحقیقاتی PivotalPath، متوسط ​​صندوق کلان، در مدت مشابه کمتر از 6 درصد رشد داشته است. SMA ها روشی رایج برای تخصیص دهندگان برای دسترسی به استراتژی های سرمایه گذاری جایگزین هستند، زیرا این ساختار شفافیت بیشتری را در استراتژی اساسی نسبت به صندوق های تامینی سنتی فراهم می کند. برای بنیانگذاران مشتاق مدیریت دارایی، می تواند راه ساده تری برای راه اندازی یک شرکت یا استراتژی جدید باشد. یکی از"}, {"source": "Business Insider", "title": "LeBron James, 41, says he knows what will tell him when it's time to retire", "link": "https://www.businessinsider.com/lebron-james-time-to-retire-decision-nba-basketball-2026-9", "summary": "LeBron James said one thing will tell him when it s time to retire. Luke Hales/Getty Images LeBron James said thoughts about retirement can pop up at any point in his day. However, at 41, James said he still loves the work it takes to stay great. He has one clear sign for knowing when it's finally time to walk away from basketball. LeBron James , 41, said he finds himself thinking about retirement at unexpected times. On Friday's episode of the \" Mind the Game \" podcast, the NBA star talked about leaving the Los Angeles Lakers for the Philadelphia 76ers and how he weighs his future in the sport. The thought that he may be nearing his final game can come to him \"at random moments\" and \"random times of the day,\" James told podcast host Steve Nash. He said it can happen on game days, during bus rides to the arena, or while he's reading or listening to music on a flight. Ultimately, the decision to retire will come down to whether he can still meet his own expectations. If he can no longer commit to \"the process of waking up and training the body and training the mind\" consistently and feel good afterward, James said, \"then I know for sure that I'm done.\" With his wife and three children encouraging him to keep playing, James said he sees no point in stopping while he still has the opportunity and ability to do what he loves. He added that he will not cut corners on the work required to keep playing at a high level. \"I'm not going to cheat it. I'm not going to just wake up and show up to practice — no stretch, no workout, no weight room, no recovery, no nothing — and just go on the court and play,\" he said. \"There's no way I could do that and be successful in this game.\" At this stage of his life and career, the motivation to keep playing is about more than just a love of basketball. He said he is just as driven by the process of keeping his body strong and his mind \"fresh.\" \"I think I'm more in love with the pursuit of, 'How much can I continue to defy the odds?'\" James said. In July, James pushed back on the idea that athletes should retire simply because of their age, noting that musicians such as Bruce Springsteen and the Rolling Stones are not held to the same expectations. \"We're giving everything that we have to the sport, and we're still driving revenue as well. Why not still play it if you still love it?\" James said. James is among several high-profile figures who have said they plan to keep working. \"Shark Tank\" investor Kevin O'Leary told Business I", "date_str": "2026-09-28T05:07:53+00:00", "hash": "7a99d3b583d7746b", "title_fa": "لبرون جیمز 41 ساله می گوید که می داند وقتی زمان بازنشستگی فرا می رسد چه چیزی به او خواهد گفت", "summary_fa": "لبرون جیمز گفت زمانی که زمان بازنشستگی فرا می رسد یک چیز به او می گوید. لوک هیلز/ گتی ایماژ لبرون جیمز گفت که افکار در مورد بازنشستگی ممکن است در هر مقطعی از روزگار او ظاهر شوند. با این حال، جیمز در 41 سالگی گفت که هنوز عاشق کارهایی است که برای عالی ماندن لازم است. او یک نشانه واضح برای دانستن اینکه بالاخره زمان دور شدن از بسکتبال فرا رسیده است. لبرون جیمز 41 ساله گفت که در مواقع غیرمنتظره ای به بازنشستگی فکر می کند. در قسمت روز جمعه پادکست \"Mind the Game\"، ستاره NBA در مورد ترک لس آنجلس لیکرز به فیلادلفیا 76ers و چگونگی ارزیابی آینده خود در این ورزش صحبت کرد. جیمز به مجری پادکست استیو نش گفت که این فکر که ممکن است به آخرین بازی خود نزدیک شود، می تواند «در لحظات تصادفی» و «زمان های تصادفی روز» به سراغش بیاید. او گفت که این اتفاق می‌تواند در روزهای بازی، در حین سفر با اتوبوس به میدان مسابقه، یا زمانی که در حال خواندن یا گوش دادن به موسیقی در پرواز است، رخ دهد. در نهایت، تصمیم برای بازنشستگی به این بستگی دارد که آیا او هنوز هم می تواند انتظارات خود را برآورده کند. جیمز گفت: اگر دیگر نتواند متعهد به \"فرایند بیدار شدن و تمرین بدن و تمرین ذهن\" به طور مداوم باشد و پس از آن احساس خوبی داشته باشد، \"پس مطمئناً می دانم که کارم تمام شده است.\" جیمز در حالی که همسر و سه فرزندش او را تشویق به ادامه بازی می‌کردند، گفت که او هیچ فایده‌ای در توقف ندارد در حالی که هنوز فرصت و توانایی انجام کاری را که دوست دارد دارد. او اضافه کرد که از کارهای مورد نیاز برای ادامه بازی در سطح بالا کوتاه نمی آید. او گفت: \"من قرار نیست فریبش"}, {"source": "Business Insider", "title": "After 14 years abroad, I moved back to my home state of California. I'm happier now than I've been in years.", "link": "https://www.businessinsider.com/expat-returned-us-after-years-abroad-happier-2026-9", "summary": "The author said she and her dog love hiking near where they live in California. Courtesy of Rebecca Mendoza. I lived abroad for 14 years and built a nice life for myself. I came home to care for my sick aunt and realized how much I missed life in the US. I'm back in California , connecting with friends and family and happier than I've been in years. In October 2025, I packed up my 15-pound hairless Xoloitzcuintli, Troy, and the rest of my belongings and moved from the north of England back to my hometown in California. I was exhausted, relieved, excited, heartbroken, and so hopeful. I'd been living outside the US for 14 years — a year in Taiwan teaching English, followed by 13 in York. I was there for over a third of my life. I had no idea I'd stay so long. Those years brought growth and hard choices: a master's degree , meeting and marrying a local, and a string of jobs unrelated to what I wanted, until I found work I cared about. I built a life through work, rugby, and volunteering, and could walk the medieval streets of York and run into someone I knew most days. But underneath that friendliness, I was growing lonelier. Every new conversation brought the same questions: Where are you from? Why did you leave California? Will you move back? It took years to understand why. It was the feeling of always being othered, always just outside full belonging , no matter how hard I'd worked to build a life there. The author said she spent 14 years living abroad, 13 of which were in York. Courtesy of Rebecca Mendoza. What I thought I wanted versus what I actually needed I hit some dark times and retreated inward for a few years. It was partly the pandemic, but mostly because life came at me all at once. My marriage hit a reckoning, and between May 2023 and May 2024, I lost four family members, including my eldest brother. Just as I gained the courage for a big change to move to Wales, I learned that an aunt was facing serious health issues . I flew home to care for her, pausing my move. I was suddenly living between two countries. It was also the longest I'd spent in my hometown since 2011, and I was forced to confront what actually made me happy, versus what I'd convinced myself I wanted. I told myself California was temporary, I was just there for a few months to help out. But I started hiking the hills, watching the sun set over Monterey Bay , and spending time with friends, my mom, dad, sister, brother, nieces, and nephews. I began writing again after years of ", "date_str": "2026-09-27T22:12:01+00:00", "hash": "9dbc7214abe1318d", "title_fa": "پس از 14 سال خارج از کشور، به ایالت خودم کالیفرنیا بازگشتم. من الان خوشحال تر از سال های گذشته هستم.", "summary_fa": "نویسنده گفت که او و سگش عاشق پیاده روی در نزدیکی محل زندگی خود در کالیفرنیا هستند. با حسن نیت از ربکا مندوزا. 14 سال در خارج از کشور زندگی کردم و زندگی خوبی برای خودم ساختم. برای مراقبت از عمه مریضم به خانه آمدم و فهمیدم چقدر دلم برای زندگی در آمریکا تنگ شده است. من به کالیفرنیا برگشته ام و با دوستان و خانواده در ارتباط هستم و خوشحال تر از سال های گذشته هستم. در اکتبر 2025، Xoloitzcuintli، تروی، 15 پوندی بدون مو و بقیه وسایلم را جمع کردم و از شمال انگلیس به زادگاهم در کالیفرنیا نقل مکان کردم. خسته، آسوده، هیجان زده، دلشکسته و خیلی امیدوار بودم. من 14 سال است که در خارج از ایالات متحده زندگی می کنم - یک سال در تایوان به تدریس زبان انگلیسی و پس از آن 13 سال در یورک. بیش از یک سوم عمرم آنجا بودم. فکر نمیکردم اینقدر بمونم آن سال‌ها رشد و انتخاب‌های سختی را به همراه داشت: مدرک کارشناسی ارشد، ملاقات و ازدواج با یک محلی، و مجموعه‌ای از مشاغل غیر مرتبط با آنچه می‌خواستم، تا زمانی که کاری را پیدا کردم که برایم مهم بود. من با کار، راگبی و داوطلبانه زندگی را ساختم و می توانستم در خیابان های قرون وسطایی یورک قدم بزنم و با کسی که بیشتر روزها می شناختم برخورد کنم. اما در زیر این دوستی، تنهاتر شدم. هر مکالمه جدید سوالات یکسانی را به همراه داشت: اهل کجا هستید؟ چرا کالیفرنیا را ترک کردید؟ آیا به عقب برمی گردی؟ سال ها طول کشید تا بفهمیم چرا. این احساس این بود که همیشه با دیگران متفاوت بودم، همیشه خارج از تعلق کامل، مهم نیست چقدر برای ساختن زندگی در آنجا تلاش کرده بودم. نویسنده گفت که او 14 سال را در خارج از کشور زندگی کرده است که 13"}, {"source": "Business Insider", "title": "Where to watch the VMAs: MTV Video Music Awards live streams, channel, nominees, presenter, and performers", "link": "https://www.businessinsider.com/guides/streaming/where-to-watch-vmas-mtv-video-music els and includes a seven-day free trial for new customers. CBS and several other popular channels (including both local and cable favorites) are available in YouTube TV and Fubo, two top cable alternatives. YouTube TV carries CBS and 100+ channels in its Main plan, which normally costs $83 a month, but new customers can get $15 a month off their first five months. YouTube TV also carries CBS and 30+ other channels in its Sports plan, which usually costs $65 a month, but new users can get $20 a month off their first six mo", "date_str": "2026-09-27T20:30:01+00:00", "hash": "d283b6a01a277fad", "title_fa": "محل تماشای VMA ها: پخش زنده جوایز موسیقی ویدئویی MTV، کانال، نامزدها، مجریان و اجراکنندگان", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید اسنوپ داگ میزبان VMAهای امسال خواهد بود. Theo Wargo/Getty Images برای MTV/Paramount Global جوایز موسیقی ویدئوی MTV برای چهل و سومین بار بازمی‌گردد. ما همه چیزهایی را که باید در مورد مکان تماشای VMA بدانید، جمع آوری کرده ایم، از جمله گزینه های پخش زنده، مجریان، نامزدها و اجراکنندگان. اسنوپ داگ میزبان مراسم امسال در تئاتر Peacock در لس آنجلس خواهد بود. اگر نمی‌خواهید بیشتر بخوانید، می‌توانید VMAها را در Paramount Plus Premium یا از طریق یک سرویس تلویزیونی زنده (مانند فیلو) در ایالات متحده پخش مستقیم کنید. شما می‌توانید از هر کجا با VPN به گزینه‌های پخش معمول خود دسترسی داشته باشید، مانند NordVPN. محل تماشای VMA: پیوندهای سریع ایالات متحده: CBS/MTV Paramount Plus Premium (از 14 دلار در ماه) Philo (مبارزه آزمایشی رایگان، از 25 دلار در ماه) تلویزیون YouTube (آزمایش آزمایشی رایگان، از 65 دلار در ماه) Fubo (مبارزه آزمایشی رایگان، از 65 دلار در ماه) دسترسی به اشتراک‌ها از هر کجا، 30 سپتامبر تا 7 سپتامبر ضمانت بازگشت پول: NordVP ساعت 7:30 بعد از ظهر ET / دوشنبه در ساعت 12:30 صبح BST / 7:30 صبح AWST VMA ها در چه کانالی هستند؟ جوایز موسیقی ویدئویی ام تی وی از شبکه CBS در ایالات متحده پخش می شود. آنها همچنین در MTV پخش خواهند شد. مراسم اهدای جوایز روز یکشنبه ساعت 19:30 آغاز می شود. ET. این رویداد تا ساعت 21:30 مسدود است. ET در راهنمای تلویزیون. مکان تماشای VMA ها در ایالات متحده بند ناف در ایالات متحده می تواند VMA ها را از طریق چندین سرویس استریم دریافت کند. مستقیم ترین گزینه Paramount Plus است که پخش زنده CBS را در سطح Premium ماهانه 14 دلاری خود ارائه می دهد. Premium همچنین محتوای درخواستی بدون"}, {"source": "Business Insider", "title": "Dario Amodei to have dinner with President Trump in a rare meeting", "link": "https://www.businessinsider.com/dario-amodei-to-have-dinner-with-president-trump-2026-9", "summary": "President Donald Trump and Anthropic CEO Dario Amodei are set to have dinner together on Sunday, according to a person familiar with the matter. Chip Somodevilla/Getty Images Dario Amodei and President Donald Trump will dine together on Sunday. The meeting comes as Amodei's calls for government regulation of AI companies have fallen flat. The meeting will be the first sit-down between the two men. Anthropic CEO Dario Amodei will have dinner with President Donald Trump on Sunday, a person familiar with the matter told Business Insider. On the menu? Some nitty-gritty discussions about AI. \"President Trump has been clear: America will lead the world in Super Intelligence, while protecting American consumers,\" a White House official told Business Insider, using Trump's preferred term for the tech. \"We will drive innovation, strengthen American competitiveness, and ensure this transformative technology works for the American people,\" the official said. Sunday's soiree will mark the first sit-down meeting between Anthropic's CEO and the president. It comes as Amodei's calls for government regulation of frontier AI companies have largely fallen flat among key power brokers in Washington. In a recent post on Truth Social, Trump mocked Amodei and spurned his calls for regulation and a coordinated slowdown among frontier AI companies. \"The Trump Administration has stopped AI 'people' from doing bad, or potentially bad, 'things,' like Dario (Anthropic!), who is now pretending to be a 'perfect little angel,'\" the president said on September 14. \"We will continue to do so!\" Amodei was notably absent from a summit of tech honchos held at the White House last week during a visit by China's leader, Xi Jinping, to the US. Last year, Amodei and Trump attended an AI and energy summit together in Pennsylvania. Amodei said then that the pair \"had a good conversation about US leadership in AI.\" News of Sunday's dinner meeting was first reported by Axios. Though Trump has repeatedly signaled strong disinterest in regulating the US AI industry to stay ahead of China, the president announced a new \"AI force\" last week, which he said will \"watch over\" the industry. No further details about the AI force have emerged since Trump's post last week. Trump also said he would name a new \"AI Czar,\" but he has not done so yet, though he did say that Treasury Secretary Scott Bessent was not in contention for the position. Read the original article on Business Insider", "date_str": "2026-09-27T19:08:26+00:00", "hash": "66b7a93b99c976c6", "title_fa": "داریو آمودی برای شام با پرزیدنت ترامپ در یک دیدار نادر", "summary_fa": "به گفته یکی از افراد آشنا، دونالد ترامپ، رئیس جمهور آمریکا و داریو آمودی، مدیر عامل آنتروپیک، قرار است روز یکشنبه با هم شام بخورند. Chip Somodevilla/Getty Images داریو آمودی و رئیس جمهور دونالد ترامپ روز یکشنبه با هم شام خواهند خورد. این نشست در حالی برگزار می‌شود که درخواست‌های آمودی برای مقررات دولتی در مورد شرکت‌های هوش مصنوعی بی‌تفاوت بوده است. این دیدار اولین نشست بین دو مرد خواهد بود. یک فرد مطلع به Business Insider گفت: داریو آمودی، مدیر عامل آنتروپیک، روز یکشنبه با دونالد ترامپ، رئیس جمهور آمریکا شام خواهد خورد. در منو؟ برخی از بحث های سخت در مورد هوش مصنوعی. یکی از مقامات کاخ سفید با استفاده از اصطلاح ترجیحی ترامپ برای فناوری، به Business Insider گفت: «رئیس‌جمهور ترامپ واضح گفته است: آمریکا در سوپراطلاعات جهان را رهبری خواهد کرد و در عین حال از مصرف‌کنندگان آمریکایی محا rt from both of us, but it would also give her a chance to do something meaningful. I thought she had a cooler first job than me \"She'd be working at a seafood place on an island off the coast of Maine,\" I said to my husband. \"What a cool first job and amazing experience.\" I worked at a clothing store in the mall for my first job, where we had to upsell everything. If a person bought shorts, we pushed them to buy the matching shirt or headband. It was the 90s. Matching meant everything. After my daughter interviewed with the manager, she got the job. Her text was enthusiastic and hopeful: \"She offered me the job, and I really, really want to take it.\" Negotiations began later that evening. We went back and forth as she pleaded her case. I wondered aloud if I would make it through an entire summer driving in and out of one of the busiest sections of Southern Maine , but her excitement fed my own. The author s daughter commutes to work by ferry. Courtesy of the author My husband was less than enthusiastic, but I understood that she needed this job. I also knew I needed to let her accept it, even if it meant hours of vacationers crossing in front of us at the crosswalk. Even if I had to shift my schedule and rethink my summer priorities. I wanted this experience for my daughter. We bought a ferry pass and planned the drive into Portland. She agreed to pay for half of her monthly pass from her paycheck. She would also have to go in early since I was driving her, which wasn't ideal during the summer when I teach extended school year. The extra time spent on the ", "date_str": "2026-09-27T18:52:01+00:00", "hash": "565b4113848c3de4", "title_fa": "تقریباً به اولین کار ناخوشایند نوجوانم نه گفتم. سپس متوجه شدم که او چقدر به این تجربه نیاز دارد.", "summary_fa": "نویسنده نوجوان خود را به کشتی می‌برد تا بتواند برای کار در جزیره‌ای در مین برود. با حسن نیت از نویسنده، نوجوان من اولین شغل تابستانی خود را در یک رستوران غذاهای دریایی در جزیره مین دریافت کرد. بردن او به کشتی مست interview on NBC's \"Meet the Press,\" the billionaire businessman said AI will evolve in two phases. He told host Kristen Welker that humanity is entering the first phase, in which AI has the potential to solve problems like the high cost of living and expensive healthcare, but can't do so yet. \"Yet it will be changing the job market and potentially empowering criminals if we don't have the right safeguards, so you have a period that's probably 20 years long where you have this adjustment,\" Gates said. Phase two is when humanity will begin to reap the benefits of AI. \"Once you get through that, then a combination of humanoid robots and AIs will provide. Building houses, growing food, a lot of things,\" Gates said. \"You could call it an era of abundance.\" He told \"Meet the Press\" that humanity will still face challenges, like finding a sense of purpose and deciding how to spend newly acquired free time, but large-scale shortages won't bog us down. \"That's for the younger generation to figure out what that looks like. My focus is can we get through this period of turmoil without too much damage,\" Gates said. Tech leaders have promoted AI as the next technological frontier and a necessary step in advancing humanity. They've said AI could lead to medical breakthroughs, boost productivity , revitalize economies, make essential goods affordable, and handle mundane tasks, giving humans more free time. Critics, on the other hand, have expressed concerns that AI will cause job losses, worsen the environment, strain utility grids, and pose the risk of copyright infringement by trained AI models. They've also pointed toward privacy and cybersecurity issues, which have gained attention in recent weeks due to a spattering of AI-linked hacks. An OpenAI agent escaped its system and hacked another AI company, Hugging Face , in July. Earlier this month, a research team at an AI startup said it used Anthropic's Claude to hack into OpenAI's codebase. The Wall Street Journ", "date_str": "2026-09-27T16:55:13+00:00", "hash": "7473d7e22c4e23e7", "title_fa": "بیل گیتس می گوید آینده هوش مصنوعی در 2 مرحله اتفاق می افتد و به «عصر فراوانی» می انجامد.", "summary_fa": "بیل گیتس گفت که ترکیب هوش مصنوعی و ربات های انسان نما می تواند به عصر فراوانی منجر شود. Tayfun Coskun/Anadolu از طریق Getty Images بیل گیتس در مصاحبه ای در \"Meet the Press\" گفت که هوش مصنوعی دو مرحله خواهد داشت. او گفت ما اکنون در یک دوره تعدیل هستیم که طی آن پتانسیل کامل هوش مصنوعی قابل دستیابی نیست. گیتس فاز دو را که ترکیبی از هوش مصنوعی و روبات‌های انسان‌نما است، «عصر فراوانی» نامید. بیل گیتس می گوید در انتهای تونل برای هوش مصنوعی نوری وجود دارد، تا زمانی که بشریت بتواند چند دهه صبر کند. این تاجر میلیاردر در طی مصاحبه ای در شبکه NBC \"Meet the Press\" گفت که هوش مصنوعی در دو مرحله تکامل می یابد. او به مجری برنامه کریستن ولکر گفت که بشریت در حال ورود به مرحله اول است که در آن هوش مصنوعی پتانسیل حل مشکلاتی مانند هزینه بالای زندگی و مراقبت های بهداشتی گران را دارد، اما هنوز نمی تواند این کار را انجام دهد. گیتس گفت: «با این حال، اگر ما تدابیر لازم را نداشته باشیم، بازار کار را تغییر خواهد داد و مجرمان را به طور بالقوه توانمند می‌کند، بنابراین شما یک دوره احتمالاً 20 ساله دارید که در آن این تعدیل را داشته باشید». فاز دوم زمانی است که بشریت شروع به درو کردن مزایای هوش مصنوعی خواهد کرد. گیتس گفت: \"وقتی از آن عبور کردید، ترکیبی از ربات‌های انسان‌نما و هوش مصنوعی فراهم می‌شود. ساختن خانه‌ها، پرورش غذا و بسیاری چیزها.\" می توانید آن را دوران فراوانی بنامید. او به «ملاقات با مطبوعات» گفت که بشریت همچنان با چالش هایی مانند یافتن حس هدفمندی و تصمیم گیری در مورد نحوه گذراندن اوقات فراغت تازه به دست آمده روبرو خواهد بود، اما کمبودهای بزرگ ما را دچار مشکل نمی کند. \"این برای نسل جوان است که"}, {"source": "Business Insider", "title": "'Saturday Night Live' spoofs Dario Amodei: ‘AI is the devil and I its maker’", "link": "https://www.businessinsider.com/snl-skit-mocks-dario-amodei-ai-doomsday-predictions-2026-9", "summary": "Anthropic CEO Dario Amodei was the butt of the AI jokes on Saturday Night Live. UNGA Dario Amodei has a split personality and wants the world to save humanity from himself… …that is, if you believe actor Jane Wickline's portrayal of the Anthropic CEO on \"SNL.\" The real Dario Amodei has called for government regulation of frontier AI companies. Dario Amodei spent Saturday night arguing with himself on national television. Well, sort of. The Anthropic CEO was spoofed last night by Jane Wickline in her first season as a repertory player on \"Saturday Night Live,\" playing Amodei as a bumbling megalomaniac struggling to explain why his own technology won't end the world. In Wickline's portrayal, Amodei has two personalities: one media-trained and the other frighteningly not. Several times during the segment, the two personalities talk to each other. When Weekend Update host Michael Che asks Wickline about the pros of AI , the two Amodeis exchange words. \"Land the plane, Dario,\" the media-trained one says. \"I can't,\" says the other. Earlier this month, the real Dario Amodei published a very grave essay on his personal website, in which he said AI models were quickly getting out of control and argued for a coordinated slowdown among frontier AI companies and for government regulation. His essay came at the fever pitch of the AI doomsday debate, which heated up a few days earlier when former Anthropic researcher Jacob Coxon quit the company and embarked on a media tour, warning that AI labs were \"gambling with our lives.\" President Donald Trump, for his part, mocked Amodei in a Truth Social post, accusing him of \"pretending to be a 'perfect little angel.'\" Trump has signaled strong disinterest in regulating AI, though he did pledge last week to create an \" AI Force \" that would \"watch over\" AI companies. In recent weeks, Amodei has been stridently promoting Anthropic breakthroughs in medical research and protein structure, and has stopped making dire predictions about an AI doomsday. The AI safety warnings have so far failed t       media: [{"source": "Billboard", "title": "Keyshia Cole, Spice & Malie Donn Set to Join Cardi B at BZR WKND Jamaica 2026", "link": "https://www.billboard.com/music/rb-hip-hop/keyshia-cole-spice-malie-donn-cardi-b-bzr-wknd-jamaica-2026-1236345820/", "summary": "A little more than a month after exclusively announcing Cardi B s forthcoming stadium-headlining debut at BZR WKND Jamaica 2026, Billboard is also the first to report the complete lineup for this year s staging of the cross-genre music festival. Related Cardi B Will Headline a Caribbean Stadium for the First Time at BZR WKND Jamaica 2026 DJ Mac Talks Blockbuster WYFL Riddim Upcoming Tour: ‘Manifestation Is Real’ Cardi B’s Exhausting, Exhilarating ‘Drama’ Recaptures Her Crown (Critic s Take) Grammy-nominated dancehall superstar Spice will host this year s festival, which will supplement Cardi s headlining set with performances by Keyshia Cole, Malie Donn, Ding Dong, Stalk Ashley and DJ MAC. BZR WKND’s four-day celebration of music, culture, food, tourism, fashion and entertainment will take place at the National Stadium in Kingston, Jamaica, from Oct. 16 to 19. Additional ticket information is available here . Last year, Cole mounted an arena-headlining tour of the U.S. and U.K. to honor the 20th anniversary of her landmark debut album, The Way It Is , which houses R B staples such as Love and I Should ve Cheated. Her BZR WKND set will build on her recent stadium debut — which she made during Usher and Chris Brown s smash joint R B Tour — as well as this year s resurgence of her and Sean Paul s hit 2006 Billboard Hot 100 No. 3 duet (When You Gonna) Give It Up to Me. While the Heaven Sent singer will hold it down for R B, the other acts will keep the dancehall vibes going. Malie Donn, who Billboard named its Caribbean Up-and-Comer of the Month for August, will grace the stage with recent smash Van Cleef and selections from his new Golden Child LP. Stalk Ashley helped Destin Conrad, Billboard s R B Rising Star of the Year , honor his Jamaican heritage with Skin Out from his new Roadrunner album, and she ll bring that same sultry energy to the BZR WKND stage. Shaneil Muir, who was nominated for female dancehall artist of the year at the 2026 Caribbean Music Awards, will also take the stage. Badman Forward Badman Pull Up singer Ding Dong took home dancehall performer of the year at the 2026 Caribbean Music Awards , marking a fitting preview for what s sure to be a characteristically high-octane set at BZR WKND. And DJ MAC — who crafted this year s dominant Skippa-led WYFL riddim alongside CrashDummy — will also treat the crowd ahead of Cardi s Little Miss Drama set. Additional music and entertainment will be provided by Ricky Platinum (who won Male Internationa", "date_str": "2026-09-28T14:00:00+00:00", "hash": "c68d8bffe8516ecf", "title_fa": "کیشیا کول، اسپایس و مالی دان به کاردی بی در BZR WKND جامائیکا 2026 می پیوندند", "summary_fa": "کمی بیش از یک ماه پس از اعلام انحصاری کاردی بی برای اولین بار در ورزشگاه BZR WKND جامائیکا 2026، بیلبورد همچنین اولین نفری است که ترکیب کامل را برای اجرای جشنواره موسیقی چند ژانر امسال گزارش می دهد. Cardi B مربوطه برای اولین بار در BZR WKND جامائیکا تیتر یک استادیوم کارائیب خواهد شد 2026 DJ Mac Talks Blockbuster WYFL Riddim تور آتی: «مظهر واقعی است» کاردی بی «درام» هیجان‌انگیز و هیجان‌انگیز Recaptures Her danamic-Danomictar Takes اسپایس میزبان جشنواره امسال خواهد بود که مجموعه تیترهای کاردی را با اجراهای کیشیا کول، مالی دان، دینگ دونگ، استالک اشلی و دی جی مک تکمیل خواهد کرد. جشن چهار روزه موسیقی، فرهنگ، غذا، گردشگری، مد و سرگرمی BZR WKND از 16 تا 19 اکتبر در استادیوم ملی کینگستون، جامائیکا برگزار خواهد شد. اطلاعات بیشتر بلیت در اینجا موجود است. سال گذشته، کول برای گرامیداشت بیستمین سالگرد اولین آلبوم برجسته‌اش به نام The Way It Is، که شامل قطعات اصلی R B مانند Love و I Should ve Cheated است، یک تور پرطرفدار در ایالات متحده و بریتانیا برگزار کرد. مجموعه BZR WKND او بر اساس اولین بازی اخیرش در استادیوم - که او در تور مشترک Usher و Chris Brown ساخته شد - و همچنین در سال 2006 او و شان پل موفق شد دوئت 100 شماره 3 بیلبورد (When You Gonna) را به من بده. در حالی که خواننده Heaven Sent آن را برای R B نگه می‌دارد، سایر کنش‌ها حال و هوای سالن رقص را حفظ می‌کنند. مالی دان، که بیلبورد او را به‌عنوان نوازنده ماه کارائیب در ماه آگوست انتخاب کرد، با آلبوم اخیر ون کلیف و انتخاب‌هایی از آلبوم جدید فرزند طلایی‌اش، صحنه را زیبا خواهد کرد. استالک اشلی به دستین کنراد، ستاره نوظهور سال R B بیلبورد کمک کرد تا میراث جامائیکایی خود را با Skin Out"}, {"source": "Billboard", "title": "Watch Bebeshito Talk Reparto’s Momentum, El Taiger’s Legacy & Meeting Bad Bunny", "link": "https://www.billboard.com/music/latin/bebeshito-cuba-reparto-bad-bunny-el-taiger-cafecito-con-1236347538/", "summary": "As the 2026 Billboard Latin Music Week approaches, Bebeshito is ready to take center stage as one of the speakers at the first-ever reparto panel, alongside Wow Popy, Rey Tony y Helabusador and DJ Conds. Related Juanes on His Most Extensive U.S. Tour Yet: I Think Right Now We Have the Best Version of Our Show Eladio Carrión Reveals He Nearly Died in Video Shoot With Cazzu: But We re Here Alive Grupo Frontera, Santos Bravos, Mau y Ricky, Anuel AA More to Join Billboard Latin Music Week 2026: See the Full Program “It’s a huge opportunity for the genre. Trust me, the genre is celebrating,” he says in the latest episode of Billboard’s Cafecito Con video series out Monday (Sept. 28). The Cuban singer — one of Billboard’s 2026 Latin Artists to Watch — spearheads the new generation of reparto stars, a musical genre that is derived from the “repartos” (housing projects in Cuba) that fuses urban music with traditional Cuban rhythms such as timba and rumba, and is powered by the clave instrument. In August 2025, the artist born Oniel Ernesto Columbie Campos made history as the first reparto artist to sell out the Kaseya Center in Miami, where he performed for 20,000 people. He’s also placed various entries on the Billboard charts, including his viral “Tacto Que Llegó El Reparto,” which entered Hot Tropical Songs last spring. Also in 2025, he made his Latin Music Week debut as part of the “Cumbia and Tropical Explosion panel, where he joined Olga Tañon, Guaynaa, Luck Ra and Grupo 5. “Honestly, I am an artist who is deeply dedicated to this. I truly love it,” he says on Cafecito Con . “I can t let anyone down because people believe in me, and I have to make them proud; I bring a lot of discipline and consistency to my work.” In the episode, the urban singer also opens up about his friendship with the late El Taiger (real name José Manuel Carbajal Zaldívar), who passed away in October 2024 after being shot in the head in Miami. Together, they collaborated on many tracks, including “Marca Mandarina” and “El Punto.” “José was my friend, and it’s my duty to carry on that legacy,” he notes. “He truly supported me. There was no self-interest, because I was just starting out.” Additionally, Bebeshito talks about the first time he met Bad Bunny, the momentum reparto is having right now and even taught a quick dancing lesson. Watch the episode above. Bebeshito is confirmed to speak at the 2026 Billboard Latin Music Week, set for Oct. 19 to 22 in Miami Beach’s Faena Forum. For ", "date_str": "2026-09-28T14:00:00+00:00", "hash": "2b873c602b76da4e", "title_fa": "Bebeshito Talk Reparto’s Momentum، El Taiger’s Legacy و Meeting Bad Bunny را تماشا کنید", "summary_fa": "با نزدیک شدن به هفته موسیقی لاتین بیلبورد در سال 2026، Bebeshito آماده است تا به عنوان یکی از سخنرانان اولین پنل رپارتو، در کنار Wow Popy، Rey Tony y Helabusador و DJ Conds در مرکز صحنه قرار گیرد. خوانز مرتبط با گسترده ترین ایالات متحده. تور هنوز: فکر می‌کنم در حال حاضر بهترین نسخه نمایش خود را داریم Eladio Carrión نشان می‌دهد که تقریباً در فیلمبرداری ویدیویی با Cazzu مرده است: اما ما اینجا زنده‌ایم Grupo Frontera، Santos Bravos، Mau y Ricky، Anuel AA بیشتر برای پیوستن به بیلبورد لاتین برنامه بزرگ هفته موسیقی لاتین، یک فرصت کامل برای من. ژانر در حال جشن گرفتن است ets out a roar. The big night started hours earlier with Madonna taking the stage for her first VMA performance in 23 years — and fifth time opening the show — following up her iconic 2003 double kiss with Britney Spears and Christina Aguilera with an all-star set featuring her new-school collaborators Sabrina Carpenter and Charli. Perched on top of a piano played by Carpenter, the pair sang their Confessions II hit Bring You Love, after which Madonna danced across the stage and was lifted onto a moving platform as a gospel choir sang before moving into Danceteria. At that point, Charli popped out and they collaborated on the Danceteria Afterhours remix, which transitioned into the bathroom dance party from the Confessions II short film, featuring cameos from sombr, Garner, Seth Rogen and hip-hop legend Fab 5 Freddy. Garner was slated to play Madonna in a biopic that appears to be on permanent pause, a situation that she reportedly revisits on upcoming season of Rogen s Emmy-winning Apple+ series The Studio . According to a Variety report, Madonna will appear in two episodes of the upcoming second season of the Hollywood-skewering show in a storyline that makes reference to the star-crossed attempts to bring her life story to the big screen. The singer was photographed in Veni", "date_str": "2026-09-28T13:23:17+00:00", "hash": "48f6ca3266869df9", "title_fa": "تماشای مدونا در حال جشن گرفتن حماسی 2026 MTV VMA با مهمانی رقص تخت خواب در اتاق هتل با حضور Charli xcx و جولیا گارنر", "summary_fa": "مدونا یکشنبه شب (27 سپتامبر) 2026 MTV VMA با اجرای مجلل و پر ستاره افتتاحیه و بهترین هفت جایزه حرفه ای تسلط داشت. اما افسانه پاپ 68 ساله ثابت کرد که تازه در حال شروع کار در یک پس از نمایش TikTok است که در آن در اتاق هتلی با دوستان Charli xcx و بازیگر جولیا گارنر خشمگین بود. ریحانا عکس های جدید و شایان ستایش را به اشتراک می گذارد ویدیوهای دختر راکی پس از اولین تولد در اینجا رکوردهای VMA است که توسط مدونا تیلور سویفت با طرفداران برنده های بزرگ 2026 تنظیم شده است. لگد زدن و برگرداندن مو با رها کردن به ریمیکس آهنگی از LP اعترافات II ملکه پاپ، Danceteria Afterhours. در حالی که گروهی از دوستان روی زمین نشسته و تماشا می‌کنند، مدونا، چهار دست و پا، موهایش را پر می‌کند و روی تخت می‌چرخد در حالی که چارلی - با شلوار جین و سوتین مشکی - پرنده دوتایی را به سمت دوربین برمی‌گرداند، لگدهای بلند می‌زند و مدونا را در رقصیدن دنبال می‌کند، طوری که همه نگاه می‌کنند. گارنر، با پوشیدن یک لغزش سفید، ژست می گیرد و دستانش را به طور پیروزمندانه در هوا بلند می کند و درست قبل از اینکه مدونا به سمت دوربین خزیده شود و غرش بفرستد، ژست های اغواکننده و مدونا مانندی می گیرد. شب بزرگ ساعت‌ها زودتر با حضور مدونا برای اولین اجرای VMA خود پس از 23 سال - و پنجمین بار افتتاحیه نمایش - به دنبال بوسه دوگانه نمادین او در سال 2003 با بریتنی اسپیرز و کریستینا آگیلرا با یک مجموعه ستاره‌ای با حضور همکاران جدید مدرسه‌اش سابرینا کارپنتر و چارلی آغاز شد. این زوج که بالای یک پیانوی نواخته شده توسط کارپنتر قرار گرفتند، آهنگ Confessions II خود را به نام Bring You Love خواندند، پس از آن مدونا در سراسر صحنه"}, {"source": "Billboard", "title": "Rod Stewart Announces Dates For 2027 Final Encore European Tour With a Very Important Caveat: ‘I’m Not Retiring’", "link": "https://www.billboard.com/music/pop/rod-stewart-dates-2027-final-encore-european-tour-not-retiring-1236349022/", "summary": "Rod Stewart has been on the road for more than 60 years and now, at 81, it s finally time to say goodbye to the road. The Forever Young singer announced plans to retire from mounting major tours in the future, while stressing that he s not going away entirely. Ladies and gentlemen, after much deliberation and sadness, I have to announce that next year will be my last tour ever, ever, Stewart said in an Instagram video posted early Monday morning (Sept. 28). I m not retiring, but this will be the last rock n roll tour. So I want to thank you for everything you ve given me and hopefully I ve given you something in return. Dressed in white pants and matching shirt and a gold brocade jacket, Stewart then leaned over to a piano and began pounding on one of the keys as he shout sang, So please come out and see me on the tour! It s gonna be great! The caveat that it was his last rock tour might leave some wiggle room for Stewart to hit the road in the future to perform songs from his series of early 2000s American songbook albums of standards. In a statement, Stewart elaborated, My dear friends, the time has come to say farewell to life on the road. After more than six decades, The Final Encore will most definitely be my last. I’ve been singing the music I love since I was 19 years old, and I’ve had the privilege of taking it around the world to all of you. It has given me a life beyond anything I could ever have imagined, and I hope I’ve given you some fond memories in return. He continued, “So, may I take this opportunity to thank you for making this extraordinary life possible. I hope you’ll join me so I can thank you the best way I know how … with the music and one hell of a show. See you there.” The European outing is slated to kick off on April 23, 2027 at 3Arena in Dublin, Ireland, and include stops in Belfast, Glasgow, Birmingham, Manchester and London before moving on to Amsterdam, Antwerp, Berlin, Düsseldorf, Copehagen, Helsinki, Rättvik (Sweden), Trondheim (Norway), Bergen (Norway), Budapest, Munich, Pula (Croatia), Prague and Kraków (Poland) before winding down on July 24 at ZAG Arena in Hannover, Germany. Stewart was forced to cancel some dates on his One Last Time North American tour after a series of medical issues disrupted the outing. In June, he reportedly had to use an oxygen tank and pause his concert in Utah after nearly fainting on stage and doubling over in discomfort and then drew fire when he canceled a June 12 show in San Diego less than", "date_str": "2026-09-28T12:41:38+00:00", "hash": "63175d468a361b96", "title_fa": "راد استوارت تاریخ برگزاری تور اروپایی نهایی Encore 2027 را با یک هشدار بسیار مهم اعلام کرد: \"من بازنشسته نمی شوم\"", "summary_fa": "راد was spilled on her just moments before the Pussycat Dolls were slated to take the stage at PSD Bank Dome in Düsseldorf, Germany, on Saturday (Sept. 26). According to People , in a since-expired Instagram Story, Scherzinger, 48, shared the image of her leg with burn marks and blisters along with the caption, Nothing like boiling water falling on your leg an hour before your set — but the show must go on. Thanks Düsseldorf for keeping me going. See you soon Amsterdam.” Tony-winner Scherzinger is currently on the PCD Forever reunion world tour with the group, which returned as a trio earlier this year with the single Club Song . Along with Scherzinger, the PSD lineup on the road includes Kimberly Wyatt and Ashley Roberts, with former members Carmit Bachar, Jessica Sutta and Melody Thornton not part of this revival. Back in May, the group canceled all but one of their planned North American PCD Forever tour dates, pulling all their arena and amphitheater stops except for an appearance at the WeHo Festival in Los Angeles on June 6, in what the group called a difficult and heartbreaking decision . At the time, the group gave no official reason for the cancellation of the dates. The PCD Forever tour, the group s first outing since they broke up in 2010, was slated to kick off in Palm Desert, Calif. on June 5. Founding members Scherzinger, Wyatt and Roberts revived PCD earlier this year following a brief reunion as a quintet in 2019. The Dolls launched in 2005 behind the group’s PCD debut album, which featured the top 5 Billboard Hot 100 anthems “Don’t Cha” (No. 2 peak) feat. Busta Rhymes and the Snoop Dogg -assisted “Buttons” (No. 3 peak). The next scheduled date on the tour is on Tuesday (Sept. 29) at Utilita Arena in Birmingham, U.K.", "date_str": "2026-09-28T11:56:14+00:00", "hash": "029909431ee19058", "title_fa": "نیکول شرزینگر عکسی از سوختگی شدید پا ناشی از جوشاندن آب درست قبل از کنسرت Pussycat Dolls منتشر کرد: \"نمایش باید ادامه یابد\"", "summary_fa": "نیکول شرزینگر on Music announced an upcoming livestream of one of Shakira s Madrid shows. Related Madrid Howls With Shakira as She Kicks Off 12-Date Residency: Tonight We Are One Inside Macondo Park, The City Created for Shakira’s Residency in Madrid Goal! Shakira Burna Boy s Dai Dai Surpasses 1 Billion Views on YouTube Titled Shakira Live from Madrid Presented by Amazon Music , the concert on Saturday, Oct. 3, will be livestreamed starting at 2:45 p.m. ET/11:45 a.m. PT in the United States, 12:45 p.m. in Mexico City ,3:45 p.m. in Brazil and 8:45 p.m. CEST in Spain. The livestream will be available via the Amazon Music app and Prime Video, plus the Amazon Music app on Fire TV and the Amazon Music channel on Twitch, with no subscription required. Las Mujeres Ya No Lloran World Tour has become so much more than I could have ever imagined, and I am so proud of it, Shakira said in a statement. I m thrilled to know I can take it even further by sharing this special night with fans around the world, alongside Amazon Music. The livestream will be one of the highlights of The Women Shaping Latin Music, the 2026 edition of Music Connects Us, Amazon Music s annual celebration of the artists, sounds and cultural movements shaping Latin music. This year’s event is dedicated to recognizing the women who have paved the way in Latin music and the new generations who continue to transform it. Shakira’s residency marks the singer-songwriter’s return to Spanish stages after eight years and focuses on the conclusion of the Las Mujeres Ya No Lloran World Tour in Madrid. The 12 concerts are part of ES LATINA, a program that brings together Latin music, cuisine, art and culture within Macondo Park, a temporary space created specifically for the occasion that also houses the Shakira Stadium. The partnership with Amazon Music also includes Shakira’s work with her Pies Descalzos Foundation, which, in collaboration with Amazon Web Services (AWS) and Laboratoria, will offer free training in AI and cloud computing. The initiative, which will begin in Colombia, aims to reach one million women across Latin America by 2028. The collaboration also includes a new remix of Dai Dai produced by RVSS", "date_str": "2026-09-28T09:00:00+00:00", "hash": "1e85e9830973a00e", "title_fa": "شکیرا به پخش زنده 3 اکتبر نمایش مادرید: چگونه تماشا کنیم", "summary_fa": "شکیرا در حال حاضر در میانه اقامت اروپا در مادرید است، مجموعه‌ای از کنسرت‌هایی که از 18 سپتامبر در سالن موسیقی Iberdrola آغاز شد و قرار است در 11 اکتبر به پایان برسد. اکنون، طرفداران از سراسر جهان می‌توانند از خانه به این جشن بپیوندند. روز دوشنبه (28 سپتامبر) سوپراستار کلمبیایی و آمازون موزیک پخش زنده آینده یکی از نمایش های مادرید شکیرا را اعلام کردند. مادرید مرتبط با شکیرا زوزه می کشد در حالی که او اقامت 12 روزه را آغاز می کند: امشب ما یکی در داخل پارک ماکوندو هستیم، شهری که برای اقامت شکیرا در مادرید ایجاد شده است! Dai Dai از Shakira Burna Boy بیش از 1 میلیارد بازدید در YouTube با عنوان Shakira Live from Madrid ارائه شده توسط آمازون موزیک، کنسرت شنبه، 3 اکتبر، از ساعت 14:45 به صورت زنده پخش می شود. ET/11:45 صبح PT در ایالات متحده، 12:45 بعد از ظهر. در مکزیکو سیتی، 3:45 بعد از ظهر. در برزیل و ساعت 20:45. CEST در اسپانیا پخش زنده از طریق برنامه موزیک آمازون و پرایم ویدیو، به علاوه برنامه موسیقی آمازون در Fire TV و کانال آمازون موزیک در توییچ، بدون نیاز به اشتراک در دسترس خواهد بود. شکیرا در بیانیه‌ای گفت: تور جهانی Las Mujeres Ya No Lloran بسیار بیشتر از چیزی است که می‌توانستم تصور کنم، و من به آن افتخار می‌کنم. خوشحالم که می‌توانم با اشتراک‌گذاری این شب ویژه با طرفداران در سراسر جهان، در کنار آمازون موزیک، آن را حتی فراتر ببرم. پخش زنده یکی از نکات برجسته The Women Shaping Music Latin، نسخه 2026 Music Connects Us، جشن سالانه آمازون موزیک از هنرمندان، صداها و جنبش های فرهنگی است که موسیقی لاتین را شکل می دهند. رویداد امسال به شناسایی زنانی که راه را در موسیقی لاتین هموار کرده‌اند و نسل‌های جدیدی که به تغییر آن ادامه"}, {"source": "Billboard", "title": "Lana Del Rey Celebrates Second Wedding Anniversary With Jeremy Dufrene", "link": "https://www.billboard.com/music/music-news/lana-del-rey-wedding-footage-second-anniversary-jeremy-dufrene-1236349004/", "summary": "Lana Del Rey is marking two years of marriage to Jeremy Dufrene with a look back at their wedding day. The singer shared a series of previously unseen photos and videos from the couple’s September 2024 wedding in Louisiana, including footage of the pair exchanging a kiss during the ceremony and images of Del Rey in her wedding dress alongside Dufrene. “Hi husband, happy second anniversary… Thank you for making everywhere I’ve ever lived feel like home again,” Del Rey wrote in the caption. “And also to our little family … literally everything we do is the best. Xo.” View this post on Instagram The carousel also included more casual moments from their life together, including clips of the pair driving, Dufrene fixing a chandelier and a close-up of Del Rey’s engagement ring. Dufrene also celebrated the anniversary on social media , writing, “Happy Anniversary to the most Beautiful and Precious lil wife. I love you so much.” His post included additional images from the couple’s wedding and life together. View this post on Instagram Del Rey and Dufrene, a Louisiana alligator tour guide, first met in 2019, though the pair did not confirm their relationship until August 2024, when they appeared together at the Reading and Leeds festivals. They married the following month. Their relationship has also found its way into Del Rey’s music. Earlier this year, she released “White Feather Hawk Tail Deer Hunter,” a song co-written with Dufrene and produced by Jack Antonoff. The track is expected to appear on her forthcoming album Stove . Del Rey, 41, remains one of the most influential artists of her generation. Her 2012 breakthrough Born to Die peaked at No. 2 on the Billboard 200 and in 2025 became the longest-charting album by a female artist in the chart s history, powered by the multi-platinum Summertime Sadness and Video Games. She has since scored two No. 1 albums on the Billboard 200 with Lust for Life (2017) and, earlier in her career, Ultraviolence (2014), and earned wide acclaim for 2019 s Norman F ing Rockwell! She is currently working toward a new album.", "date_str": "2026-09-28T07:42:42+00:00", "hash": "2a27675ab77c0d3c", "title_fa": "لانا دل ری دومین سالگرد ازدواج خود را با جرمی دوفرن جشن گرفت", "summary_fa": "لانا دل ری دو سال از ازدواج خود با جرمی دوفرن را با نگاهی به روز عروسی آنها جشن می گیرد. این خواننده مجموعه‌ای از عکس‌ها و ویدیوهای دیده‌نشده قبلی را از عروسی این زوج در سپتامبر 2024 در لوئیزیانا به اشتراک گذاشت، از جمله تصاویری از این جفت در حال تبادل بوسه در طول مراسم و تصاویر دل ری در لباس عروسی‌اش در کنار دوفرن. دل ری در توضیح این عکس نوشت: «شوهرش، دومین سالگردش مبارک... از تو متشکرم که به هر جایی که زندگی کرده‌ام، دوباره احساس خانه‌ام می‌کنی». \"و همچنین برای خانواده کوچکمان... به معنای واقعی کلمه هر کاری که انجام می دهیم بهترین است. Xo.\" این پست را در اینستاگرام مشاهده کنید چرخ فلک همچنین شامل لحظات غیررسمی بیشتری از زندگی مشترک آنها بود، از جمله کلیپ هایی از رانندگی جفت، تعمیر لوستر دوفرن و حلقه نامزدی دل ری. دوفرن همچنین این سالگرد را در رسانه‌های اجتماعی جشن گرفت و نوشت: «سالگرد ازدواج زیباترین و باارزش‌ترین همسر لیل مبارک. خیلی دوستت دارم.» پست او شامل تصاویر اضافی از عروسی و زندگی مشترک این زوج بود. این پست را در اینستاگرام مشاهده کنید دل ری و دوفرن، راهنمای تور تمساح لوئیزیانا، برای اولین بار در سال 2019 ملاقات کردند، اگرچه این جفت تا آگوست 2024 که با هم در جشنواره های ریدینگ و لیدز ظاهر شدند، رابطه خود را تایید نکردند. ماه بعد ازدواج کردند. رابطه آنها به موسیقی دل ری نیز راه پیدا کرده است. در اوایل سال جاری، او \"White Feather Hawk Tail Deer Hunter\" را منتشر کرد، آهنگی که با همکاری Dufrene نوشته شده بود و توسط جک آنتونوف تهیه شده بود. انتظار می‌رود این آهنگ در آلبوم آینده او Stove ظاهر شود. دل ری، 41 ساله، یکی از تأثیرگذارترین هنرمندان نسل خود باقی مانده است. موفقیت او در Born to Die در سال"}, {"source": "Billboard", "title": "2026 MTV Video Music Awards: What You Didn’t See On TV", "link": "https://www.billboard.com/lists/vmas-best-moments-behind-scenes/", "summary": "It was a big night for Madonna and Taylor Swift at the 2026 MTV Video Music Awards, where both superstars came into the night as the year’s top nominees — and they were also the evening’s biggest winners . Madonna not only opened the show with a medley of songs from her Confessions II album (joined by Sabrina Carpenter and Charli xcx), she also walked away with seven trophies, including three wins onstage (artist of the year, best dance and best collaboration). As for Swift, she won a trio of Moon Persons: the first-ever Artist Director Honors, video of the year (both presented onstage) and best direction. Inside the Peacock Theater in downtown Los Angeles, there were moments viewers at home never saw — including an encounter between Madonna and Swift (more on that in a second). The venue felt at once intimate and immense, its expansive stage anchored by a towering Moon Person. Early arrivals watched the production crew make last-minute preparations and deliver instructions to the enthusiastic fans recruited to surround the stage. Once the show got underway, the mixture of veteran acts (Madonna, host Snoop Dogg) and newer faces (LISA, Sienna Spiro) kept the audience engaged. Seemingly the biggest in-venue response went to the George Michael tribute, where the audience was on its feet the entire time — no doubt thanks to the fact that Michael’s sterling catalog of hits was well-known by the crowd. Here’s a rundown of some of the moments viewers did not see at home on TV during the MTV Video Music Awards.", "date_str": "2026-09-28T07:01:33+00:00", "hash": "086ba1e1ad96b5ef", "title_fa": "جوایز موسیقی ویدئویی MTV 2026: آنچه در تلویزیون ندیدید", "summary_fa": "این شب بزرگی برای مدونا و تیلور سویفت در جوایز موسیقی ویدیوی MTV 2026 بود، جایی که هر دو سوپراستار به عنوان برترین نامزدهای سال وارد شب شدند - و همچنین بزرگترین برندگان این شب بودند. مدونا نه تنها نمایش را با ترکیبی از آهنگ‌های آلبوم Confessions II خود آغاز کرد (که سابرینا کارپنتر و چارلی xcx به آن پیوستند)، او همچنین با هفت جایزه از جمله سه برد روی صحنه (هنرمند سال، بهترین رقص و بهترین همکاری) کنار رفت. در مورد سوئیفت، او برنده سه نفر از Moon Persons شد: اولین افتخارات کارگردان هنرمند، ویدیوی سال (هر دو روی صحنه ارائه شده) و بهترین کارگردانی. در داخل تئاتر Peacock در مرکز شهر لس آنجلس، لحظاتی بود که تماشاگران در خانه هرگز ندیده بودند - از جمله رویارویی مدونا و سویفت (در یک ثانیه بیشتر). محل برگزاری در آن واحد احساس صمیمی و عظیم می‌کرد، صحنه گسترده‌اش توسط یک مون پرسون لنگر انداخته است. کسانی که زودتر وارد شدند، گروه تولید را تماشا کردند که در آخرین لحظه آماده‌سازی می‌کردند و دستورالعمل‌ها را به طرفداران مشتاقی که برای احاطه کردن صحنه استخدام شده بودند، ارائه می‌کردند. هنگامی که نمایش شروع شد، ترکیبی از بازیگران کهنه کار (مدونا، مجری اسنوپ داگ) و چهره های جدیدتر (LISA، Sienna Spiro) مخاطب را درگیر خود نگه داشت. به نظر می‌رسد بیشترین استقبال در محل برگزاری، مربوط به ادای احترام جورج مایکل بود، جایی که تماشاگران تمام مدت روی پا بودند - بدون شک به لطف این واقعیت که کاتالوگ بی‌نظیر آثار مایکل توسط جمعیت شناخته شده بود. در اینجا خلاصه ای از برخی از لحظاتی است که بینندگان در طول مراسم جوایز موسیقی ویدئویی ام تی وی در خانه در تلویزیون ندیده اند. در طول یک استراحت تبلیغاتی، و کمی قبل از اهدای جایزه افتخارات کارگردان هنرمند به سویفت، این فوق ستاره به تماشاگران"}, {"source": "Billboard", "title": "Producer Todd Rundgren Criticizes Taylor Swift: ‘The Apotheosis of Mediocrity’", "link": "https://www.billboard.com/music/music-news/todd-rundgren-taylor-swift-1236348967/", "summary": "Todd Rundgren has called Taylor Swift the apotheosis of mediocrity and suggested she ruined music in a new interview. Speaking to Vulture , the veteran producer was asked which current artist he would spoof if he made a parody album, a nod to his work on Meat Loaf s 1977 album Bat Out of Hell , which he has said he intended partly as a Bruce Springsteen send-up. Taylor Swift, of course. There s an argument to be made that she ruined music, he said. It s just that, to me, Taylor Swift is the apotheosis of mediocrity. He went further later in the interview. Taylor Swift doesn t do anything particularly great except grow hair, he said. She s not a great singer. She s not a great songwriter. She s not a great dancer. Rundgren praised Lady Gaga as a real musician and classically trained piano player, and floated a theory that female pop stars rose to dominance after young men shifted their spending to video games in the 1990s. It isn t the first time he s criticized Swift — he made similar comments on Rick Rubin s Broken Record podcast in 2022. Swift hasn t responded. When The Life of a Showgirl drew mixed reactions on its release last year, she addressed the criticism on Apple Music s The Zane Lowe Show . I have a lot of respect for people s subjective opinions on art. I m not the art police, she said. Everybody is allowed to feel exactly how they want. The comments arrive days after Swift released The Life of a Showgirl: The Encore , an expanded edition of her 2025 album featuring four new tracks, including “ Patient Zero .” Swift premiered the song’s music video during Sunday’s MTV Video Music Awards 2026 . The deluxe version of Swift’s 12th studio album, out now, also features the newly recorded song “Babylon,” “Pink Clouding” and “Cleveland!” The original album spent 12 weeks at No. 1 on the Billboard 200 and opened with a record-breaking 4.002 million equivalent album units in the United States in its first week.", "date_str": "2026-09-28T06:19:14+00:00", "hash": "badb9c18479a94f7", "title_fa": "تهیه‌کننده تاد راندگرن از تیلور سویفت انتقاد می‌کند: «آپوتئوز متوسط ​​بودن»", "summary_fa": "تاد راندگرن تیلور سوئیفت را آپوتئوز متوسط ​​بودن نامیده است و به او پیشنهاد داده است که در یک مصاحبه جدید موسیقی را خراب کرده است. در صحبت با Vulture، از تهیه کننده باسابقه پرسیده شد که اگر یک آلبوم تقلید آمیز بسازد، کدام هنرمند فعلی را جعل می کند، اشاره ای به کارش در آلبوم Meat Loaf در سال 1977 Bat Out of Hell، که او گفته است تا حدودی به عنوان یک ارسال کننده بروس اسپرینگستین قصد داشته است. البته تیلور سویفت. او گفت، بحثی وجود دارد که او موسیقی را خراب کرده است. فقط برای من، تیلور سوئیفت آپوتئوز متوسط ​​بودن است. او بعداً در مصاحبه جلوتر رفت. او گفت که تیلور سوئیفت کار خاصی جز رشد مو انجام نمی دهد. او خواننده بزرگی نیست. او ترانه سرای بزرگی نیست. او یک رقصنده بزرگ نیست. راندگرن لیدی گاگا را به‌عنوان یک نوازنده واقعی و نوازنده پیانو که به‌طور کلاسیک آموزش دیده بود، تحسین کرد و این نظریه را مطرح کرد که ستاره‌های زن پاپ پس از اینکه مردان جوان هزینه‌های خود را به بازی‌های ویدیویی در دهه 1990 تغییر دادند، به تسلط رسیدند. این اولین باری نیست که او از سویفت انتقاد می کند - او نظرات مشابهی را در پادکست رکورد شکسته ریک روبین در سال 2022 بیان کرد. سویفت پاسخی نداد. هنگامی که The Life of a Showgirl در سال گذشته با واکنش‌های متفاوتی روبه‌رو شد، او به انتقادات در مورد نمایش Zane Lowe از Apple Music پرداخت. من برای نظرات ذهنی مردم در مورد هنر احترام زیادی قائلم. او گفت: من پلیس هنر نیستم. به هر کسی اجازه داده می شود دقیقاً آنطور که می خواهد احساس کند. این نظرات چند روز پس از انتشار سوئیفت به نام The Life of a Showgirl: The Encore منتشر شد، نسخه ای گسترده از آلبوم 2025 او"}, {"source": "Deadline", "title": "Altered Innocence Strikes North America Deal With Charades For Queer Gothic Romance ‘No Rest For The Wicked’", "link": "https://deadline.com/2026/09/queer-romance-no-rest-for-wicked-gets-us-deal-1237115200/", "summary": "EXCLUSIVE: Altered Innocence has acquired all North American rights to Kasper Kalle’s queer gothic romance No Rest For The Wicked. The film, which world-premiered in Competition at the 2026 Fantasia International Film Festival won the Cheval Noir Award for Best Director and the Cheval Noir Award for Best Actor (Pilou Asbæk). It will continue its [ ]", "date_str": "2026-09-28T14:29:46+00:00", "hash": "e57ee6c4f7f3ece6", "title_fa": "«بی‌گناهی تغییریافته» آمریکای شمالی را درگیر می‌کند.", "summary_fa": "انحصاری: Altered Innocence تمام حقوق آمریک te_str": "2026-09-28T14:16:46+00:00", "hash": "972e265631853d5f", "title_fa": "ادواردو سانچز، یکی از خالقان «جادوگر بلیر» و کارل گلوسمن بازیگر، به فیلم علمی تخیلی مستقل «Giant Void» می‌پیوندند.", "summary_fa": "انحصاری: کارل گلوسمن (Eenie Meanie) به بازیگران Giant Void، درام علمی تخیلی مستقل آینده از مایکل ریزینگر، نویسنده و کارگردان ملحق شده است و ادواردو سانچز، خالق پروژه جادوگر بلر، به عنوان تهیه کننده اجرایی حضور دارد. گلوسمن به مولی برنت (نظام قانون: SVU)، الین هندریکس (تله والدین) و شاهجهان خان (پسران دلی) در گروه می‌پیوندد. [ ] این فیلم کلویی (برنت)، دانشمند کامپیوتری باهوش اما منزوی را دنبال می‌کند که نرم‌افزار بالقوه‌ای که جهان را تغییر می‌دهد، ارتباطات پنهانی را که هرگز قرار نبود پیدا کند، کشف می‌کند. همانطور که او به یک همکار جدید (گلوسمن) نزدیکتر می شود، این کشف او را مجبور می کند تا ماهیت ارتباط انسان، واقعیت و جایگاه انسان در جهان را زیر سوال ببرد. داستان های مرتبط اکتساب ها فریاد بزنید! استودیو برای آلیشیا سیلوراستون آمریکای شمالی را می گیرد. تماشا در ددلاین این فیلم اولین کارگردانی بلند سینمایی رایسینگر است که فیلمنامه‌اش قبلاً توسط Slamdance Screenplay Competition و Scriptapalooza شناخته شده بود. این فیلم به طور مستقل در کلرادو تولید شد و اکنون در حال آماده شدن برای اجرای جشنواره است. S nchez درباره فیلم کامل شده گفت: من افتخار می کنم که بخشی از این تیم هستم. Giant Void یک سفر شگفت انگیز و احساسی است که مطمئناً مخاطبان را در همه جا تحت تأثیر قرار می دهد. نمی توانم منتظر بمانم تا این فیلم به بازار عرضه شود. S nchez اخیراً به عنوان تهیه کننده اجرایی در فیلم بعدی Lionsgate در این مجموعه به مجموعه Blair Witch بازگشته است."}, {"source": "Deadline", "title": "Harry Smith To Return To NBC News As A Contributor", "link": "https://deadline.com/2026/09/harry-smith-returns-to-nbc-news-1237115169/", "summary": "Harry Smith is returning to NBC News as a contributor, with plans to report on feature stories called Common Good. Smith s return is official as of Monday, when he will appear at a Common Ground live event hosted by the network. The network confirmed his  {"source": "Deadline", "title": "Disney Unveils Oasis Doc Premiere Date", "link": "https://deadline.com/2026/09/disney-unveils-oasis-doc-premiere-date-october-9-1237115158/", "summary": "Disney has unveiled premiere date for Steven Knight s Oasis documentary on Disney+ and Hulu. The feature will land on October 9, just two weeks after tickets to Oasis next round of tour dates were snapped up, including some shows in the U.S. Oasis: Don t Look Back in Anger has already had a theatrical run where [ ]", "date_str": "2026-09-28T14:00:00+00:00", "hash": "2901d9d00bcb9709", "title_fa": "دیزنی از تاریخ نمایش Oasis Doc رونمایی کرد", "summary_fa": "دیزنی تاریخ اکران مستند Oasis استیون نایت در دیزنی+ و هولو را اعلام کرد. این ویژگی در 9 اکتبر، تنها دو هفته پس از تهیه بلیط‌های Oasis دور بعدی تورها، از جمله برخی از نمایش‌ها در ایالات متحده، به نمایش در خواهد آمد. Oasis: Don t Look Back in Anger قبلاً یک نمایش سینمایی داشته است که در آن [ ] این فیلم از استودیو Magna و کارگردانان Dylan Southern و Will Lovelace حاوی مطالبی از یک مصاحبه مشترک نادر بین گالاگرها، همراه با پوشش فراوانی از کنسرت های فروخته شده است. نایت، خالق پیکی بلایندرز، یکی از طرفداران بزرگ گروه، نویسنده و خالق است. تماشا در Deadline Angela Jain، رئیس محتوا، Disney+ EMEA، گفت: انتظار بزرگ به پایان رسیده است زیرا ما اکنون Oasis: Don t Look Back In Anger را برای هرچه بیشتر مردم از طریق Disney+ می آوریم، و انجام آن با فیلم های انحصاری دیده نشده نیز برای طرفداران بسیار هیجان انگیز است. گردهمایی Oasis یکی از لحظات فرهنگی تعیین کننده ما در دوران اخیر بوده است. ما دیده‌ایم که چگونه این مستند در میان مخاطبان سراسر جهان طنین‌انداز شده است، زیرا آنها قدرت Oasis و موسیقی را از طریق این داستان تداعی‌کننده و تکان دهنده تجلیل می‌کنند. Oasis برای اولین بار در Saturday Night Live UK نمایش سرد در آخر هفته پخش شد و برادران گالاگر پس از متقاعد کردن نخست وزیر اندی برنهام برای پیوستن به آنها، خود را به عنوان جاسوسان روسیه نشان دادند. این فیلم با تصاویری که قبلاً دیده نشده است، محصول استودیوی مگنا است که توسط Sony Music Vision در ارتباط با Sony Music Entertainment UK ارائه شده است. تهیه کنندگان این فیلم سم بریجر و گای هیلی هستند."}, {"source": "Deadline", "title": "Mind-Reading Comedian Peter Antoniou Sets 2027 Tour", "link": "https://deadline.com/2026/09/peter-antoniou-tour-dates-2027-1237113946/", "summary": "EXCLUSIVE: British comedian and mind reader Peter Antoniou has announced a big set of tour dates for 2027. From a childhood fascination with a tarot deck to performing for audiences around the world, Antoniou has built a career around turning the impossible into unforgettable theatre. His live performances combine comedy and audience interaction with moments [ ]", "date_str": "2026-09-28T13:45:00+00:00", "hash": "dc852241b03744b0", "title_fa": "پیتر آنتونیو، کمدین ذهن خوان، تور 2027 را تنظیم می کند", "summary_fa": "اختصاصی: پیتر آنتونیو، کمدین و خواننده ذهن بریتانیایی، مجموعه بزرگی از تاریخ‌های تور را برای سال 2027 اعلام کرده است. آنتونیو از دوران کودکی شیفتگی به عرشه تاروت گرفته تا اجرا برای تماشاگران در سراسر جهان، حرفه‌ای را حول تبدیل غیرممکن‌ها به تئاتر فراموش‌نشدنی ساخته است. اجراهای زنده او کمدی و تعامل بین تماشاگران را با لحظاتی ترکیب می کند [ ] تازه از تور سراسری «روانی زیبا»، نمایش جدید آنتونیو، پیتر آنتونیو: بازی فکری، این تجربه را بیش از هر زمان دیگری پیش می برد. او می‌گوید: این نمایش بزرگ‌تر، جسورانه‌تر و جاه‌طلبانه‌تر از هر کاری است که من انجام داده‌ام. تنها قطعه گم شده مغز شماست. بلیط ها با پیش فروش سیتی در روز سه شنبه 29 سپتامبر ساعت 10 صبح در دسترس خواهند بود. به وقت محلی، تا پنجشنبه، 1 اکتبر ساعت 23:59 ادامه دارد. به وقت محلی آنها در روز جمعه، 2 اکتبر در ساعت 10 صبح محلی برای عموم به فروش خواهند رسید. آنتونیو هنر خود را از طریق سالها مطالعه با تمرین‌کنندگانی از تاروت‌خوان‌ها و روان‌شناسان گرفته تا هیپنوتیزورها، جادوگران و روان‌شناسان توسعه داد. او توسط Val Sloot در Gersh and Brillstein Entertainment Partners انتخاب شده است. لیست تاریخ های تور او را در زیر مشاهده کنید. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود ن ا تبدیل شده است. طبق داده های Barb از overnights.tv، قسمت اول فصل 2، که هفته گذشته به پایان رسید، اکنون توسط 9.1 میلیون مخاطب تماشا شده است. بی‌بی‌سی از دیوید میچل [ ] ستاره‌های لودویگ در نقش جان تیلور، یک معماساز گوشه‌نشین تجلیل می‌کرد که وقتی ناپدید می‌شود وانمود می‌کند برادرش است و برای تحقیق در ایستگاه پلیس محلی نفوذ می‌کند، قبل از اینکه در موارد دیگر درگیر شود. Mark Brotherhood خالق است، Big Talk تهیه کننده است و سریال که قبلاً برای فصل سوم به همراه ویژه کریسمس با بازی دیوید ساچت مجددا راه اندازی شده است، آنا مکسول مارتین و ایزوکا هویل نیز در آن حضور دارند. کنتون آلن، رئیس Deadline Big Talk، گفت: لودویگ یک کارآگاه باشکوه عجیب و غریب در قلب نمایشی است که هرگز طبق قوانین معمول بازی نکرده است، بنابراین دیدن بیش از نه میلیون نفر که او را در آغوش می گیرند واقعاً هیجان انگیز است. مارک اخوان آن چیز نادر را خلق کرده است: نمایشی هوشمندانه، خنده دار و خونگرم که به نظر می رسد مخاطبان بخشی از زندگی خود را ساخته اند. فصل 2 لودویگ پنجشنبه گذشته با 1.6 میلیون بیننده در شبانه روز به پایان رسید، اما در iPlayer بی‌بی‌سی تعداد تماشاگران زیادی به دست آورده است. فصل اول در زمانی شروع شد که مخاطبان به دنبال تماشای راحت بودند و بهترین فیلمنامه سال 2024 را بی بی سی منتشر کرد. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را خوشحال نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید."}, {"source": "Netflix NL", "title": "Tweede seizoen The Beast in Me op Netflix", "link": "https://www.netflix-nederland.nl/tweede-seizoen-the-beast-in-me-op-netflix/", "summary": "The Beast in Me was vorig jaar (in 2025 dus) één van de allergrootste hits op Netflix. En nu kunnen we bekendmaken dat deze thrillerserie een vervolg krijgt! De streamingdienst heeft groen licht gegeven voor een tweede seizoen. Netflix kondigt The Beast in Me seizoen 2 aan Goed, de kans is klein, maar misschien kun jij je de show waar we het over hebben niet meer herinneren. The Beast in Me is een psychologische thriller op Netflix met Claire Danes en Matthew Rhys in de hoofdrollen. Het verhaal draait om de succesvolle schrijfster Aggie Wiggs, die na de tragische dood van haar jonge zoon vrijwel volledig uit het openbare leven is verdwenen. Ze worstelt met haar verdriet en is bovendien niet meer in staat om te schrijven. Dat verandert wanneer de rijke vastgoedmagnaat Nile Jarvis naast haar komt wonen. Nile heeft een duistere reputatie: zijn vrouw is enkele jaren eerder spoorloos verdwenen en hij werd destijds verdacht van betrokkenheid, hoewel nooit bewezen werd dat hij iets met haar verdwijning te maken had. Aggie raakt steeds meer door hem gefascineerd en besluit hem te onderzoeken als onderwerp voor haar volgende boek. Kat-en-muissspel Daarmee ontstaat een gevaarlijk kat-en-muisspel. Hoe dichter Aggie bij de waarheid over Nile en zijn verdwenen vrouw probeert te komen, hoe moeilijker het wordt om te bepalen of hij werkelijk een moordenaar is of dat er iets anders achter het verhaal zit. Tegelijkertijd blijkt Aggie zelf ook geheimen en trauma s met zich mee te dragen The Beast in Me stond maar liefst zeven weken in de top 10 met meest bekeken series op Netflix, wereldwijd, en verzamelde in die tijdsperiode maar liefst 43 miljoen views. Het is dus geen verrassing dat de streamingdienst nu heeft bekendgemaakt dat er ook een tweede seizoen komt. Daarin keert hoofdrolspeelster Claire Danes sowieso terug, maar het is onbekend of Matthew Rhys ook in de nieuwe afleveringen zal zitten. Hij heeft het namelijk druk met de hitserie Widow s Bay (Apple TV). Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Tweede seizoen The Beast in Me op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-28T10:41:55+00:00", "hash": "3a45f1da129c9b70", "title_fa": "فصل دوم سریال The Beast in Me در نتفلیکس", "summary_fa": "The Beast in Me یکی از بزرگترین موفقیت های نتفلیکس در سال گذشته (در سال 2025) بود. و اکنون می توانیم اعلام کنیم که این سریال هیجان انگیز ادامه خواهد داشت! سرویس پخش برای فصل دوم چراغ سبز نشان داده است. نتفلیکس سریال The Beast in Me فصل 2 را اعلام کرد خب، شانس بسیار اندک است، اما شاید سریالی را که در مورد آن صحبت می کنیم به خاطر نداشته باشید. The Beast in Me یک فیلم هیجان انگیز روانشناختی در نتفلیکس با بازی کلر دینز و متیو ریس است. داستان حول محور نویسنده موفق آگی ویگز است که پس از مرگ غم انگیز پسر خردسالش تقریباً به طور کامل از زندگی عمومی ناپدید شده است. او با اندوه خود دست و پنجه نرم می کند و دیگر قادر به نوشتن نیست. زمانی که نیل جارویس، نجیب زاده ثروتمند املاک و مستغلات به خانه همسایه نقل مکان می کند، این تغییر می کند. نیل شهرت تاریکی دارد: همسرش چندین سال قبل بدون هیچ ردی ناپدید شد و در آن زمان مظنون به دست داشتن او بود، اگرچه هرگز ثابت نشد که او با ناپدید شدن او ارتباطی داشته است. اگی به طور فزاینده ای مجذوب او می شود و تصمیم می گیرد به عنوان موضوع کتاب بعدی اش درباره او تحقیق کند. بازی موش و گربه این یک بازی موش و گربه خطرناک ایجاد می کند. هر چه اگی سعی می کند به حقیقت در مورد نیل و همسر گم شده اش نزدیک تر شود، تشخیص اینکه آیا او واقعا یک قاتل است یا چیز دیگری پشت داستان وجود دارد دشوارتر می شود. در همان زمان، اگی نیز به نظر می رسد که اسرار و آسیب های روحی را با خود حمل می کند. The Beast in Me به مدت کمتر از هفت هفته در بین 10 سریال برتر"}, {"source": "Pitchfork", "title": "Watch Taylor Swift Haunt Dakota Johnson and Colin Farrell in “Patient Zero” Video", "link": "https://pitchfork.com/story/watch-taylor-swift-haunt-dakota-johnson-and-colin-farrell-in-patient-zero-video/", "summary": "Cara Delevingne makes an appearance too", "date_str": "2026-09-28T14:13:06+00:00", "hash": "ed93cec09dff8da5", "title_fa": "تیلور سویفت هانت داکوتا جانسون و کالین فارل را در ویدیوی «بیمار صفر» تماشا کنید.", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Taylor Swift موزیک ویدیوی جدید خود را به نام The Life of a Showgirl: The Encore Track Patient Zero در مراسم جوایز موسیقی ویدیویی 2026 یکشنبه شب به نمایش گذاشت. این کلیپ که داکوتا جانسون و کالین فارل در آن نقش آفرینی می کنند، رابطه ای را دنبال می کند که به آرامی بین یک زوج متاهل (جانسون و فارل) از بین می رود، در حالی که همسر سابق شوهر (سوئیفت) که اکنون درگذشته است، تلاش می کند تا قبل از اینکه خیلی دیر شود به جانسون هشدار دهد. کارا دلوین نیز ظاهر می شود. هنوز در یوتیوب نیست، بنابراین برای تماشای آن باید به Spotify یا Apple Music بروید. این یک موقعیت مناسب برای سوئیفت بود که یک ویدیوی جدید را منتشر کند: او امسال افتخارات کارگردان هنرمند MTV VMA را دریافت کرد، جایزه جدیدی که برای «کارهایی که پشت دوربین امکان پخش موزیک ویدیو و پیشرفت هنر داستان سرایی بصری را افزایش داده است» در نظر گرفته شده است. سوئیفت در مجموع این شب برای 9 جایزه VMA حضور داشت و او را در کنار مدونا 13 به دومین هنرمند نامزد شب تبدیل کرد. این نمایش همچنین یک هفته شلوغ را برای سوئیفت به پایان رساند. سوئیفت چهار آهنگ جدید را در The Life of a Showgirl نوشت: The Encore — Patient Zero، «Cleveland!»، «Pink Clouding» و «Babylon» - به همراه مکس مارتین و Shellback تهیه کنندگان TLOAS در حالی که موفقیت آلبوم را در سوئد در سال 2025 جشن می گرفت. با تمام پوشش Pitchfork از جوایز موسیقی ویدیوی MTV 2025 همراه باشید."}, {"source": "Pitchfork", "title": "Stevie Wonder Unvaults Four Songs in the Key of Life Tracks", "link": "https://pitchfork.com/story/stevie-wonder-unvaults-four-songs-in-the-key-of-life-tracks/", "summary": "“We didn’t add these songs to the album, but they were part of what I was feeling and discovering as we made it,” says Wonder", "date_str": "2026-09-28T13:59:23+00:00", "hash": "2042d32313f36d53", "title_fa": "استیوی واندر چهار آهنگ را در آهنگ های کلید زندگی باز می کند", "summary_fa": "Wonder Loader Save Story Save this Story می‌گوید: «ما این آهنگ‌ها را به آلبوم اضافه نکردیم، اما آن‌ها بخشی از آن چیزی بودند که من هنگام ساختن آن احساس و کشف می‌کردم. این چهار آهنگ که توسط خود واندر از میان آهنگ‌های خروجی انتخاب شده‌اند، «این آسان‌تر است»، «داستان زندگی من از عشق»، «من می‌توانم خورشید را در اواخر دسامبر ببینم» و «من در زندگی هستم» اکنون به‌عنوان Songs in the Key of Life: The EP منتشر شده‌اند. زیر گوش کنید واندر در بیانیه‌ای مطبوعاتی می‌گوید: «ما پنجاه سال با Songs in the Key of Life زندگی کرده‌ایم، اما هنوز چیزهای بیشتری برای شنیدن وجود دارد. ما این آهنگ‌ها را به آلبوم اضافه نکردیم، اما بخشی از آن چیزی بود که من هنگام ساختن آن احساس و کشف کردم. آن‌ها مرا به آن دوران زندگی‌ام برمی‌گردانند و حالا می‌توانند بخشی از زندگی تو شوند.» آهنگ‌ها توسط واندر نوشته و تولید شده‌اند – سوزای گرین، عضو سابق سوپریمز، یکی از نویسندگان «داستان زندگی من از عشق» بود – و مهندسان اصلی آلبوم، جان فیشباخ و گری او آدانته، برای میکس آن‌ها بازگشتند. واندر ماه آینده به تور سالگرد آلبوم اصلی می رود."}, {"source": "Pitchfork", "title": "Watch Kacey Musgraves Sing Dolly Parton’s “I Will Always Love You” at the 2026 VMAs", "link": "https://pitchfork.com/story/watch-kacey-musgraves-sing-dolly-partons-i-will-always-love-you-at-the-2026-vmas/", "summary": "Musgraves has also been covering the late country icon's songs on tour", "date_str": "2026-09-28T00:36:41+00:00", "hash": "e21b65a6a5c1ea14", "title_fa": "تماشای کیسی ماسگریوز در حال خواندن ترانه «I Will Always Love You» از دالی پارتون در VMA 2026", "summary_fa": "ماسگریوز همچنین آهنگ‌های نماد کانتری فقید را در تور پخش می‌کرده است. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان کیسی ماسگریوز روز یکشنبه برای ادای احترام به دالی پارتون، که ماه گذشته در سن 80 سالگی درگذشت، به صحنه VMA رفت. از زمان مرگ پارتون در 25 آگوست، ماسگریوز موسیقی این نماد فقید را در چندین ایستگاه در تور Middle of Nowhere خود پوشش داده است، با موفقیت سال 1977 \"Here You Come Again\" در یک نمایش در بوستون و \"9 به 5\" در مدیسون اسکوئر گاردن. ماسگریوز در حین اجرای دوم گفت: \"من از آن گذشته نیستم و هرگز نخواهم گذشت.\" جهان قطعاً نوری را از دست داد، و صحبت کردن در مورد آن برای من سخت است.» ماسگریوز امسال نامزد دریافت بهترین موزیک ویدیوی کانتری برای قطعه بصری همراه با قطعه Middle of Nowhere «Dry Spell» است. اگرچه او هرگز موفق به دریافت جایزه VMA نشده است، اما قبلاً دو بار نامزد دریافت جایزه شده است: بهترین ویدیوی لانگ فرم و بهترین کارگردانی هنری برا rk", "title": "Sabrina Carpenter to Play Ginger Rogers in Fred Astaire Biopic", "link": "https://pitchfork.com/story/sabrina-carpenter-to-play-ginger-rogers-in-fred-astaire-biopic/", "summary": "She’ll star opposite Tom Holland and Margaret Qualley in the still-untitled Paul King film", "date_str": "2026-09-27T15:37:52+00:00", "hash": "a423ab5c9ae1cbbd", "title_fa": "سابرینا کارپنتر برای ایفای نقش جینجر راجرز در فیلم بیوگرافی فرد آستر", "summary_fa": "او در کنار تام هالند و مارگارت کوالی در فیلم هنوز بدون عنوان پل کینگ بازی می‌کند، داستان را ذخیره کنید Loader Save Story ذخیره این داستان Comment Loader Save Story Save this story سابرینا کارپنتر برای فیلم زندگی‌نامه‌ای جدید به کفش جینجر راجرز می‌رود. ددلاین گزارش می‌دهد که خواننده The Man’s Best Friend برای ایفای نقش افسانه سینمای نقره‌ای در فیلمی که هنوز عنوان نشده است درباره فرد آستر، از پل کینگ انتخاب شده است. تام هالند در نقش تهدید سه گانه هالیوود قدیمی ایفای نقش خواهد کرد، در حالی که مارگارت کوالی در نقش خواهر بزرگتر مجری، ادل، یکی از اولین شرکای رقص آستر و ستاره ای در برادوی و وست اند لندن به تنهایی بازی خواهد کرد. کینگ در بیانیه ای به اشتراک گذاشت: «فرد میراثی جاودانه از رقص در فیلم به جا گذاشت که معروف ترین آن در همکاری با جینجر راجرز بود، در حالی که آثار ادل در تاریخ گم شده است؛ در واقع هیچ فیلمی از رقص او باقی نمانده است. چالش سینمایی جان بخشیدن به این نمادهای قرن بیستم چالشی است که نمی‌توانستم بدون کنارم تام هالند، مارگارت کوالی و سابرینا کارپنتر تصور کنم.» اعلان انتخاب بازیگران یک سال پشت سر هم برای کارپنتر است که در مراسم گرمی اجرا کرده است، تیتر Coachella بوده و در چند ماه گذشته با مدونا همکاری کرده است. او همچنین اولین جایزه امی خود را برای تهیه کنندگی اجرایی و اجرای نمایش ماپت دریافت کرد. درباره بهترین دوست مرد در شماره بخوانید. 17 در 30 بهترین آلبوم پاپ 2025."}, {"source": "Pitchfork", "title": "Here’s What Went Down at Olivia Rodrigo’s Unraveled Tour Opener", "link": "https://pitchfork.com/story/heres-what-went-down-at-olivia-rodrigos-unraveled-tour-opener/", "summary": "A melting dress, a field of pink flowers, and some Sour throwbacks came together at the Hartford, Connecticut show", "date_str": "2026-09-27T14:54:35+00:00", "hash": "f334a0090a1773a7", "title_fa": "این چیزی است که در افتتاحیه تور Unraveled Olivia Rodrigo پایین آمد", "summary_fa": "یک لباس آب شدنی، یک مزرعه از گل‌های صورتی، و برخی از رقص‌های ترش در نمایشگاه هارتفورد، کانکتیکات گرد هم آمدند. رودریگو با همراهی بازکننده ولف آلیس، داستان عشق غم انگیز را در قلب سومین آلبوم تحسین‌شده‌اش «به نظر می‌رسد برای دختری خیلی عاشق» بسیار غمگین می‌کند، و برای اندازه‌گیری خوب، چند آهنگ قدیمی‌تر و برش‌های عمیق‌تر را به کار برد. کلیپ های این نمایش و لیست کامل مجموعه را در زیر مشاهده کنید. رودریگو نمایش را با آهنگ You Seem Pretty Sad for a Girl So In Love آغاز کرد و آهنگ اصلی \"Drop Dead\" را شروع کرد که در حالی که دراز کشیده بود در میان مزرعه ای از گل های صورتی شروع به خواندن کرد. اگرچه او برخی از سکانس‌های آلبوم را تغییر داد، اما تا حد زیادی سفر آلبوم را از عاشقانه‌ای با چشمان پرستاره تا جدایی دردناک دنبال کرد. او همچنین در جدیدترین نسخه خود، «سرنا جوی» الهام گرفته از The Handmaids Tale، که ماه گذشته در افتتاحیه جشنواره موسیقی Daisy Chain Fields برای اولین بار آن را اجرا کرد، میکس کرد. رودریگو در طول چند ماه آینده، بخش تور آمریکای شمالی خود را با نمایش هایی در پیتسبورگ، شیکاگو، بوستون، مونترال، تورنتو و غیره ادامه خواهد داد. سال آینده، او سه اقامتگاه 10 شبه را بازی خواهد کرد: یکی در Intuit Dome لس آنجلس، یکی در Barclays Center نیویورک و دیگری در O2 Arena لندن. داستان جلد Pitchfork's Olivia Rodrigo: Blood on the Tracks را دوباره ببینید. اولیویا رودریگو Unraveled Tour Opener 2026 ست لیست : Drop Dead U + Me = 3 So American Good 4 U My Way Serena Joy ایده بد درست تصنیف یک دختر خانه نشین خون آشام بنفش احمقانه آهنگ احمقانه برای مغز خیانتکار خواهش می کند که سیگار کشیدن آمریکایی ها Levourites انتظارات عوضی"}, {"source": "Rolling Stone", "title": "The Trump-Loving Texas Republican Sounding the Alarm on Data Centers", "link": "https://www.rollingstone.com/politics/politics-features/sid-miller-texas-republican-sounds-alarm
