icipated foldable model. The iPhones will come with iOS 27 , which will bring Siri AI on Monday, Sept. 14. 256GB iPhone Duo $1,999.00 at Apple Pre-order Here Pre-order Here $1,999.00 at Apple 256GB iPhone 18 Pro $1,199.00 at Apple Pre-order Here Pre-order Here $1,199.00 at Apple 256GB iPhone 18 Pro Max $1,299.00 at Apple Pre-order Here Pre-order Here $1,299.00 at Apple SEE 0 MORE What to know about the iPhone 18 Pro and 18 Pro Max The iPhone 18 Pro starts at $1,199, and the iPhone 18 Pro Max starts at $1,299. The iPhone 18 Pro Max offers the same hardware and features as the 18 Pro on a bigger 6.9-inch display. Check back in on Sept. 12 to pre-order the phones. Apple will start shipping them out on Sept.18. One of the biggest upgrades you'll notice is the battery . The iPhone 17 had up to 30 hours of playback, and the new 18 Pro comes with up to 45 hours of juice. The new A20 Pro chip has two extra GPU cores, bringing it up to seven cores. The other noticeable difference is in the camera with \"Pro controls.\" There is a new aperture control from a new 48MP \"Fusion Telephoto\" lens that automatically changes the aperture of the camera to best fit the environment (you can also change it manually). This new lens also improves video with smart focus-tracking (it locks onto a subject in a video); a \"Cinematic mode\" effect that lets you change the video after shooting to 60 fps for a half-speed video effect; 4K resolution on time-lapse; improved low-light video; and more. What to know about the iPhone Duo Perhaps the most-anticipated moment of the event was the introduction of the new iPhone Duo . It's a completely new iPhone series and is Apple's first attempt at making a foldable phone. The Duo will be available for pre-order on Sept. 12 and start shipping out on Sept. 18. It starts at a whopping $1,999 with the 256GB version. The display is 7.6 inches when open and has a 5.4-inch when it's closed. Apple changed the user experience on the Duo, which makes sense since it's the first iPhone with an expandable screen. It seems to be great for multitaski", "date_str": "2026-09-09T20:22:23+00:00", "hash": "33e75d62686a21de", "title_fa": "نحوه پیش خرید آیفون 18 پرو، آیفون 18 پرو مکس و آیفون دو", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. آخرین رویداد اپل در این هفته دو گوشی جدید آیفون 18 پرو و ​​آیفون دو را معرفی کرد. پیش‌سفارش‌های iPhone 18 Pro از 12 سپتامبر آغاز می‌شود و برای iPhone Duo، پیش‌سفارش‌ها از 16 اکتبر آغاز می‌شود. بهبودهای خوبی در گوشی‌ها وجود دارد، به‌ویژه iPhone Duo، که یک مدل تاشو مورد انتظار مدت‌هاست. آیفون‌ها با iOS 27 عرضه می‌شوند که هوش مصنوعی Siri را در روز دوشنبه، 14 سپتامبر به ارمغان می‌آورند. 256 گیگابایت iPhone Duo 1999.00 دلار در پیش‌سفارش اپل در اینجا پیش‌سفارش 1999.00 دلار در اپل 256 گیگابایت آیفون 18 پرو. 18 Pro Max 1,299.00 دلار در Apple پیش‌سفارش اینجا پیش‌سفارش کنید 1,299.00 دلار در Apple مشاهده 0 اطلاعات بیشتر در مورد iPhone 18 Pro و 18 Pro Max iPhone 18 Pro از 1,199 دلار شروع می‌شود و iPhone 18 Pro Max از 1,299 دلار شروع می‌شود. آیفون 18 پرو مکس همان سخت افزار و ویژگی های 18 پرو را در صفحه نمایش 6.9 اینچی بزرگتر ارائه می دهد. برای پیش‌سفارش تلفن‌ها، دوباره در 12 سپتامبر وارد شوید. اپل ارسال آنها را از 18 سپتامبر آغاز خواهد کرد. یکی از بزرگترین ارتقاهایی که متوجه خواهید شد باتری است. آیفون 17 تا 30 ساعت پخش داشت و 18 پرو جدید تا 45 ساعت پخش می شود. تراشه جدید A20 Pro دارای دو هسته گرافیکی اضافی است که آن را به هفت هسته می رساند. تفاوت قابل توجه دیگر در دوربین با \"کنترل های حرفه ای\" است. یک کنترل دیافراگم جدید از یک لنز جدید 48 مگاپیکسلی \"Fusion Telephoto\" وجود دارد که به طور خودکار دیافراگم دوربین را به بهترین شکل با محیط تغییر می دهد (همچنین می توانید آن را به صورت دستی تغییر"}, {"source": "Lifehacker", "title": "All the Differences Between the AirPods 5, AirPods 4, and AirPods Pro 3", "link": "https://lifehacker.com/tech/airpods-5-vs-airpods-pro-3-vs-airpods-4-anc?utm_medium=RSS", "summary": "We may earn a commission from links on this page. I've been rocking the first-gen AirPods Pro since 2021, so you can safely say that I take my time with gadget upgrades. But I was so shocked to see Apple's new AirPods 5 are cheaper and better than the AirPods 4 that I initially thought I might've just found the easier upgrade decision of all time. But then, my sense of propriety kicked in: Experience has taught me to weigh my options carefully before buying anything, so I decided to compare (on paper, at least) the AirPods 5 with their counterparts from Apple: the AirPods 4 with active noise cancellation (ANC) and the AirPods Pro 3 . Here's what I found. AirPods Pro 3 still offer the best noise cancellation As much as I want to love the AirPods 5, and as much as I appreciate the fact that ANC is now standard on all Apple earbuds, the new model's noise cancellation feature is significantly weaker than that on the AirPods Pro 3. According to the specs comparison on Apple's website , the AirPods Pro 3 has \"3x more Active Noise Cancellation (ANC) than AirPods 5.\" This is the most important AirPods feature for me, and I'm seriously considering paying that $120 premium (at retail) for better ANC. Having said that, the AirPods 5 do get \"1.5x more ANC than AirPods 4 (with ANC),\" so it could be a good upgrade for many people. AirPods 5 have the worst battery life (but it's probably good enough) According to Apple, the AirPods 5 offer up to five hours of battery on a single charge (with ANC on), and 22 hours of battery life if you include the power from the charging case. If you get the cheapest variant of the AirPods 5 (without wireless charging), these numbers drop to four hours on one charge, and 20 hours from the charging case. This is lower than the AirPods 4 (with ANC), which offer 5 hours of battery life and 30 hours including the charging case. The AirPods Pro 3 have the best battery life, with 8 hours of playback time on a single charge and 24 hours with the charging case. The upgraded AirPods 5 are worth the extra $20 If you opt for the $149 variant of the AirPods 5, you're getting improved battery life, on-stem volume controls, a wireless charging case, and a speaker for Find My. I think those features are easily worth the extra $20 over the base variant of the AirPods 5. I think the extra hour of battery life is an essential feature, and all the others are great quality-of-life additions. It's nice to control volume by swiping the stem of the AirPods, an", "date_str": "2026-09-09T20:15:05+00:00", "hash": "24122d1395b1f33d", "title_fa": "تمام تفاوت های AirPods 5، AirPods 4 و AirPods Pro 3", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. من از سال 2021 نسل اول AirPods Pro را تکان می دهم، بنابراین می توانید با خیال راحت بگویید که وقتم را با ارتقاء گجت صرف می کنم. اما وقتی دیدم ایرپاد 5 جدید اپل ارزان تر و بهتر از ایرپاد 4 است، آنقدر شوکه شدم که در ابتدا فکر کردم شاید تصمیم آسان تری را برای ارتقای همه زمان ها پیدا کرده باشم. اما پس از آن، احساس شایستگی من شروع شد: تجربه به من آموخت که قبل از خرید هر چیزی گزینه‌هایم را با دقت بسنجیم، بنابراین تصمیم گرفتم (حداقل روی کاغذ) AirPods 5 را با همتایان خود از اپل مقایسه کنم: AirPods 4 با حذف نویز فعال (ANC) و AirPods Pro 3. این چیزی است که من پیدا کردم. AirPods Pro 3 همچنان بهترین حذف نویز را ارائه می‌کند همان‌قدر که می‌خواهم AirPods 5 را دوست داشته باشم، و همانطور که از این واقعیت که ANC اکنون در همه هدفون‌های اپل استاندارد است، قدردانی می‌کنم، ویژگی حذف نویز مدل جدید به‌طور قابل‌توجهی ضعیف‌تر از AirPods Pro 3 است. با توجه به مقایسه مشخصات در وب سایت اپل، AirPods Pro 3 «3 برابر بیشتر از AirPods 5 حذف نویز فعال (ANC) دارد. این مهمترین ویژگی AirPods برای من است، و من به طور جدی به پرداخت آن 120 دلار حق بیمه (در خرده فروشی) برای ANC بهتر فکر می کنم. با این حال، AirPods 5 \"1.5 برابر ANC بیشتر از AirPods 4 (با ANC) دریافت می کند، بنابراین می تواند برای بسیاری از افراد ارتقاء خوبی باشد. AirPods 5 بدترین عمر باتری را دارد (اما احتمالاً به اندازه کافی خوب است) طبق گفته اپل، AirPods 5 تا 5 ساعت باتری با یک بار شارژ (با ANC روشن) و 22 ساعت عمر باتری را در صورت در نظر"}],
      media: [{"source": "Billboard", "title": "UMG Inks Deal With ElevenLabs to Develop AI Music Remix Platform", "link": "https://www.billboard.com/pro/umg-elevenlabs-to-develop-ai-music-remix-platform/", "summary": "Universal Music Group has inked a new multi-year licensing agreement with ElevenLabs, the AI audio research and product giant. According to the press release, ElevenLabs and UMG will work on a new, bespoke AI-powered music platform for fans built on licensed music and artist participation, as well as to jointly develop AI audio products for artists and songwriters. Specifically, the AI music platform the two companies are working toward will give fans the ability to co-create, remix and mashup with music from artists and songwriters who choose to participate. Users can also render personalized vocal experiences, building on ElevenLabs dominance in the AI voice recreation market. The agreement also includes the development of additional products and fan experiences in the months and years to come, says the press release. Related Suno Launches First AI Music Models in Partnership With the Music Industry Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction Importantly, this new deal with UMG is more about creating new products together, rather than partnering on ElevenLabs current music offerings. The deal does not include ElevenMusic, ElevenLabs music creation app for generating and editing original songs and it does not include Music EPI, ElevenLabs studio-grade music models available via API. The news comes just one day after the biggest name in generative AI music, Suno, announced the launch of v6 , its first suite of models made in partnership with the music industry. Specifically, according to an interview with Suno CEO Mikey Shulman on Billboard On the Record , v6 was trained on music provided by UMG competitors WMG, Believe and BMG as well as user interactions with the platform. (Universal, alongside Sony Music, is still pursuing a major lawsuit against Suno over claims of widespread copyright infringement of their sound recordings). ElevenLabs has already made several deals with the music business. This includes licensing deals with Merlin — a digital licensing organization, representing 30,000 independent labels and distributors — and large indie publisher Kobalt. Its earliest known partnership is with music production library SourceAudio , which was announced in 2025. “The most exciting possibilities for AI and music are those that put artists, songwriters, and fans at the center, Lucian Grainge , chairman and CEO of Universal Music Group, says of the deal", "date_str": "2026-09-10T14:25:41+00:00", "hash": "c74327583951af00", "title_fa": "جوهرهای UMG با ElevenLabs برای توسعه پلتفرم ریمیکس موسیقی هوش مصنوعی معامله می کنند", "summary_fa": "گروه موسیقی یونیورسال قرارداد مجوز چند ساله جدیدی را با ElevenLabs، غول محصولات و تحقیقات صوتی هوش مصنوعی منعقد کرده است. طبق بیانیه مطبوعاتی، ElevenLabs و UMG روی یک پلتفرم موسیقی جدید و سفارشی مبتنی بر هوش مصنوعی برای طرفداران که بر اساس موسیقی مجاز و مشارکت هنرمندان ساخته شده است، و همچنین به طور مشترک محصولات صوتی هوش مصنوعی را برای هنرمندان و ترانه سراها توسعه خواهند داد. به طور خاص، پلتفرم موسیقی هوش مصنوعی که این دو شرکت روی آن کار می‌کنند، به طرفداران این امکان را می‌دهد تا با موسیقی هنرمندان و ترانه‌سراهایی که برای شرکت در آن شرکت می‌کنند، مشترک بسازند، ریمیکس کنند و ترکیب کنند. کاربران همچنین می‌توانند تجربه‌های صوتی شخصی‌سازی شده را ارائه دهند و بر تسلط ElevenLabs در بازار سرگرمی صوتی هوش مصنوعی بنا کنند. در بیانیه مطبوعاتی آمده است که این قرارداد همچنین شامل توسعه محصولات اضافی و تجربیات طرفداران در ماه ها و سال های آینده است. سونو مرتبط اولین مدل‌های موسیقی هوش مصنوعی را با همکاری بیلبورد صنعت موسیقی راه‌اندازی کرد تا آلبوم‌های رسانه‌ای هوشمند را به‌عنوان فرمت‌های فروش واجد شرایط نمودار اضافه کند. Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل Tupac Shakur انجام می‌دهد. این معامله شامل ElevenMusic، برنامه ایجاد موسیقی ElevenLabs برای تولید و ویرایش آهنگ‌های اصلی نمی‌شود و شامل Music EPI، مدل‌های موسیقی درجه ElevenLabs که از طریق API در دسترس هستند نمی‌شود. این خبر تنها یک روز پس از آن منتشر می‌شود که بزرگترین نام موسیقی مولد هوش مصنوعی، سونو، از راه‌اندازی نسخه ۶، اولین مجموعه از مدل‌های خود که با همکاری صنعت موسیقی ساخته شده است، خبر داد. به طور خاص، طبق مصاحبه ای با Mikey Shulman، مدیر عامل Suno در Billboard On the Record، نسخه ۶ بر روی موسیقی ارائه شده توسط رقبای UMG WMG، Believe و BMG و همچنین"}, {"source": "Billboard", "title": "2026 CMA Awards Snubs & Surprises: Morgan Wallen, Riley Green, Taylor Swift and More", "link": "https://www.billboard.com/lists/2026-cma-awards-snubs-surprises-morgan-wallen-taylor-swift/", "summary": "The final nominees for the 60 th annual CMA Awards were revealed Thursday morning (Sept. 10). To no one’s surprise, Ella Langley led all nominees with nine nods, including her first entertainer of the year nominations. She’s the only newbie in the entertainer of the year category, joining reigning champ Lainey Wilson, past winner Luke Combs and past nominees Chris Stapleton and Cody Johnson. Miranda Lambert followed Langley with seven nominations, four of them coming from her work with Langley including co-writing “Choosin’ Texas,” which has spent a record-setting 21 weeks on top of the Billboard Hot 100. Lambert also earns her 19 th nomination for female vocalist of the year. That sets a new record, surpassing Reba McEntire’s 18 nominations. Other nominees reached major milestones, including Little Big Town, which received its 21 st consecutive nomination for vocal group of the year, the most for any group. The eligibility period is July 1, 2025, through June 30, 2026. Additionally, for single of the year, the track must have reached the top 10 of Billboard ’s Country Airplay or Hot Country Songs charts or the Country Aircheck chart. The 60th CMA Awards will air on ABC and, for the first time, stream live on Disney + on Nov. 18 as part of a new six-year extension the CMA signed with Disney in May. It will stream starting Nov. 19 on Hulu. While Langley’s nominations were expected, there were several surprises, both in those who received nods and several who did not. Below, we look at some of the largest snubs and surprises from Thursday’s nominations.", "date_str": "2026-09-10T14:15:00+00:00", "hash": "753a2a69af64bd25", "title_fa": "غافلگیری و غافلگیری جوایز CMA 2026: مورگان والن، رایلی گرین، تیلور سویفت و غیره", "summary_fa": "نامزدهای نهایی شصتمین جوایز سالانه CMA صبح پنجشنبه (10 سپتامبر) مشخص شدند. در کمال تعجب، الا لنگلی با 9 تکان دادن سر همه نامزدها، از جمله نامزدی اولین بازیگر سال او را رهبری کرد. او تنها تازه‌کار در رده سرگرمی‌های سال است که به قهرمان حاکم، لینی ویلسون، برنده قبلی لوک کامبز و نامزدهای قبلی کریس استپلتون و کودی جانسون می‌پیوندد. میراندا لمبرت پس از لنگلی با هفت نامزدی، چهار مورد از آنها حاصل کار او با لنگلی از جمله نویسندگی \"Choosin' Texas\" است که رکورد رکورد 21 هفته را در صدر 100 بیلبورد سپری کرده است. لمبرت همچنین نوزدهمین نامزدی خود را برای خواننده زن سال به دست آورد. این رکورد جدیدی را به نام خود ثبت کرد و از 18 نامزدی ربا مک انتایر پیشی گرفت. نامزدهای دیگر به نقاط عطف مهمی رسیدند، از جمله Little Big Town، که بیست و یکمین نامزدی متوالی خود را برای گروه آواز سال دریافت کرد که بیشترین نامزدی برای هر گروهی بود. دوره واجد شرایط بودن از 1 ژوئیه 2025 تا 30 ژوئن 2026 است. علاوه بر این، برای تک‌آهنگ سال، آهنگ باید به 10 چارت برتر پخش کانتری یا آهنگ‌های داغ کانتری بیلبورد یا نمودار Country Aircheck رسیده باشد. شصتمین دوره جوایز CMA از شبکه ABC پخش خواهد شد و برای اولین بار به صورت زنده از دیزنی + در نوامبر پخش خواهد شد. 18 به عنوان بخشی از تمدید شش ساله جدید CMA در ماه می با دیزنی امضا شد. از 19 نوامبر در Hulu پخش خواهد شد. در حالی که نامزدی لنگلی انتظار می رفت، شگفتی های متعددی وجود داشت، هم در آنهایی که سرم را دریافت کردند و هم در چند نفر دیگر. در زیر، ما به برخی از بزرگترین غافلگیری ها و شگفتی های نامزدهای روز پنجشنبه نگاه می کنیم."}, {"source": "Billboard", "title": "Ella Langley Has Two CMA Awards Nods for Single of the Year — Who Else Has Done That?", "link": "https://www.billboard.com/lists/cma-awards-single-of-the-year-two-nominations-same-year-list-lainey-wilson/", "summary": "When the 2026 CMA Awards nominations were announced on Thursday (Sept. 10), Ella Langley became just the eighth artist in CMA history to land two single of the year nominations in the same year. Interestingly, the first five times this happened, it involved male artists. The last three times, it has involved female artists. Langley is nominated both as artist and co-producer of her hits “Choosin’ Texas” and “Be Her.” She co-produced both hits with Miranda Lambert and Ben West. Related Ella Langley Leads Nominations for 2026 CMA Awards: Full List The other nominees in the category are Taylor Swift ’s “I Knew It, I Knew You” (which she co-produced with Jack Antonoff ), Lainey Wilson ’s “Somewhere Over Laredo” (produced by Jay Joyce) and Cody Johnson ’s “The Fall” (produced by Trent Willmon). This marks the first time in CMA history that female artists have accounted for four of the five nominees for single of the year. In three of the seven previous cases where an artist had two single of the year nominations in the same year, that artist won with one of their nominated hits. In the four others, they lost to someone else. So, there’s no strong evidence that an artist with two nominations will split their votes, though many believe such a phenomenon exists. Here are the eight times in CMA Awards history that one artist had two singles vying for single of the year. We also show you who won that year. Who will win this year? We’ll find out on Nov. 18, when the 60th annual CMA Awards are presented at Bridgestone Arena in Nashville.", "date_str": "2026-09-10T14:14:00+00:00", "hash": "5e4b27b8e0e3a981", "title_fa": "الا لنگلی دو جایزه CMA برای تک‌آهنگ سال دارد - چه کسی این کار را انجام داده است؟", "summary_fa": "هنگامی که نامزدهای جوایز CMA 2026 در روز پنجشنبه (10 سپتامبر) اعلام شد، الا لنگلی تنها هشتمین هنرمند در تاریخ CMA شد که در همان سال نامزدی دو تک آهنگ سال را دریافت کرد. جالب اینجاست که پنج بار اول که این اتفاق افتاد، شامل هنرمندان مرد بود. سه بار اخیر، هنرمندان زن را درگیر کرده است. لنگلی هم به‌عنوان هنرمند و هم تهیه‌کننده آهنگ‌های موفقش «Choosin’ Texas» و «Be Her» نامزد شده است. او هر دو اثر را با میراندا لمبرت و بن وست تولید کرد. مرتبط الا لنگلی پیشتاز نامزدهای جوایز CMA 2026: فهرست کامل دیگر نامزدهای این رده عبارتند از «I Knew It, I Knew You» اثر تیلور سوئیفت (که او با جک آنتونوف تهیه کننده آن بود)، «Somewhere Over Laredo» از Lainey Wilson و «Somewhere Over Laredo» (محصول جانی کولایسون) (تهیه شده توسط ترنت ویلمون). این اولین بار در تاریخ CMA است که هنرمندان زن چهار نامزد از پنج نامزد تک آهنگ سال را به خود اختصاص می دهند. در سه مورد از هفت مورد قبلی که یک هنرمند در همان سال دو نامزدی برای تک‌آهنگ سال داشت، آن هنرمند با یکی از آثار نامزدی خود برنده شد. در چهار مورد دیگر به شخص دیگری باختند. بنابراین، هیچ مدرک محکمی وجود ندارد که هنرمندی با دو نامزدی، آرای خود را تقسیم کند، اگرچه بسیاری معتقدند چنین پدیده ای وجود دارد. در اینجا هشت بار در تاریخ جوایز CMA آورده شده است که یک هنرمند دو تک آهنگ داشت که برای تک آهنگ سال رقابت می کردند. ما همچنین به شما نشان می دهیم که چه کسی در آن سال برنده شد. چه کسی امسال برنده خواهد شد؟ در 18 نوامبر، زمانی که شصتمین جوایز سالانه CMA در Bridgestone Arena در نشویل برگزار می شود، متوجه خواهیم شد."}, {"source": "Billboard", "title": "Ella Langley Leads Nominations for 2026 CMA Awards: Full List", "link": "https://www.billboard.com/music/awards/2026-cma-nominations-list-ella-langley-1236337089/", "summary": "Ella Langley is the leading nominee for the 60th annual CMA Awards, with nine nods. That ties the record for the most nods in one year by a female artist. That record was first set by Miranda Lambert in 2010 and then matched by Lambert in 2014 and equaled by Lainey Wilson in 2023. These tallies are just one off the all-time record of 10, set by Alan Jackson in 2002. Other top 2026 nominees are Lambert with seven nods; Kacey Musgraves and Ben West with five each; Cody Johnson , Chris Stapleton and Stephen Wilson Jr. with four each; and Dave Clauss, Luke Combs and Wilson with three each. Related Lainey Wilson Set to Host 2026 CMA Awards CMA Touring Awards: Lainey Wilson s The Whirlwind World Tour Crew Takes Top Honors The Future of the Country Music Association: Sarah Trahern Brittany Schaffer Give First Joint Interview in CEO Evolution Vying for the night’s highest honor, entertainer of the year, are Combs, Johnson, Langley, Stapleton and Wilson. Langley’s “Choosin’ Texas,” which has logged 21 weeks at No. 1 on the Billboard Hot 100 , more than any other non-holiday hit in the chart’s 68-year history, is this year’s only work that is nominated for single, song and music video of the year. Female artists account for four of the five nominees for single of the year for the first time in CMA history. Langley is nominated for both “Choosin’ Texas” and “Be Her.” She’s just the eighth artist in CMA history to have two nominations in the same year in that category. She’s the first to do it since Wilson scored in 2023 with “Heart Like a Truck” and HARDY’s “Wait in the Truck,” on which she was featured. Taylor Swift’s “I Knew It, I Knew You” and Wilson’s “Somewhere Over Laredo” are also nominated in the category, along with one single by a male artist – Cody Johnson’s “The Fall.” Fun Fact: “I Knew It, I Knew You” appears to be the front-runner to win the Oscar for best original song. “Somewhere Over Laredo” interpolates the melody of “Over the Rainbow” from The Wizard of Oz , which won in that category in 1940. Jay Joyce produced “Somewhere Over Laredo.” It’s his 14th nomination for single of the year, which puts him second only to Tony Brown for the most nominations in that category as a producer. Brown, who was inducted into the Country Music Hall of Fame in 2025, has had 16. Miranda Lambert lands her 19th nomination for female vocalist of the year, which surpasses Reba McEntire for the most nominations in that category. McEntire tallied 18 from 1983 to 2017. Shan", "date_str": "2026-09-10T13:27:28+00:00", "hash": "0eb083cc8c3982fa", "title_fa": "الا لنگلی پیشتاز نامزدهای جوایز CMA 2026: فهرست کامل", "summary_fa": "الا لنگلی نامزد اصلی شصتمین دوره جوایز سالانه CMA با 9 سر زدن است. این رکورد بیشترین تکان دادن در یک سال توسط یک هنرمند زن را به خود اختصاص داده است. این رکورد ابتدا توسط میراندا لمبرت در سال 2010 ثبت شد و سپس توسط لامبرت در سال 2014 برابر شد و با لینی ویلسون در سال 2023 برابر شد. دیگر نامزدهای برتر سال 2026، لامبرت با هفت نوبت است. کیسی ماسگریوز و بن وست هر کدام با پنج نفر؛ کودی جانسون، کریس استپلتون و استیون ویلسون جونیور هر کدام با چهار نفر. و دیو کلاوس، لوک کامبز و ویلسون هر کدام با سه نفر. مرتبط Lainey Wilson میزبان جوایز CMA 2026 جوایز تور CMA: گروه تور جهانی The Whirlwind توسط Lainey Wilson افتخارات برتر را کسب می کند آینده انجمن موسیقی کانتری: سارا تراهرن بریتنی شافر اولین مصاحبه مشترک را در مدیر عامل شرکت Evolution انجام دهید، رقابت برای سرگرمی های شبانه، جانسون با بالاترین افتخارات سال استپلتون و ویلسون فیلم «Choosin’ Texas» از لنگلی که 21 هفته در رتبه اول ثبت شده است. 1 در Billboard Hot 100، بیش از هر موفقیت غیر تعطیل دیگری در تاریخ 68 ساله نمودار، تنها اثر امسال است که نامزد دریافت تک آهنگ، آهنگ و موزیک ویدیوی سال شده است. هنرمندان زن برای اولین بار در تاریخ CMA چهار نامزد از پنج نامزد تک آهنگ سال را تشکیل می دهند. لنگلی هم برای «Choosin’ Texas» و «Be Her» نامزد شده است. او هشتمین هنرمند در تاریخ CMA است که در یک سال دو نامزدی در آن بخش داشته است. او اولین کسی است که پس از گلزنی ویلسون در سال 2023 با «قلب مثل کامیون» و «منتظر در کامیون» از هاردی که در آن نقش آفرینی کرد، این کار را انجام داد. \"I Knew It, I Knew You\" از تیلور سویفت"}, {"source": "Billboard", "title": "Trey Parker & Matt Stone ‘Take Full Responsibility’ For Scheduling Delays in ‘Whitney Springs’ Movie Collab With Kendrick Lamar", "link": "https://www.billboard.com/culture/tv-film/trey-parker-matt-stone-full-responsibility-delays-movie-lamar-1236337261/", "summary": "South Park creators Trey Parker and Matt Stone have been talking up their first feature film since the bonkers 2004 puppet action spectacle Team America: World Police for a while now. So, why haven t we seen their reportedly $100 million live-action follow-up to 1997 s bonkers sex comedy Orgazmo more than a year since its original release date came and went? In a statement to The Ankler this week, the duo explained why the musical comedy about reparations from slavery referred to internally at Paramount as Whitney Springs keeps getting pushed off their to-do list. “We take full responsibility for the schedule delay of this movie,” Stone and Parker said in a statement to the site. “We apologize to our partners at pgLang and Paramount and we appreciate their patience. South Park and life’s circumstances have gotten in the way but we still believe in the project.” According to The Ankler , back in 2021, a group of Paramount executives visited the offices of the duo s Park County production company to read the script written by South Park veteran Vernon Chatman ( Wonder Showzen ). The plan at that point was for the movie to be directed by Parker and produced by Stone, Kendrick Lamar and his business partner, Dave Free. Paramount reportedly picked up the movie in January 2022, with then-Paramount Pictures boss Brian Robbins saying in 2024 that the script was one of the funniest and most original ones he d ever read. The film focused on a young Black reenactor at a historical slave plantation museum in the Midwest who yells at tourists and fights with the town s racist mayor — played by Parker — was reportedly slated to go into production in the summer of 2024. Unnamed sources told the site that the film also features previously unreleased, original music from Lamar. The original release date, July 4, 2025, was then pushed back to March 20 of this year and then, in November, removed from the studio s release schedule. At press time, no additional information was available on a potential release date.", "date_str": "2026-09-10T13:24:38+00:00", "hash": "9d243af5b2ce80b9", "title_fa": "تری پارکر و مت استون «مسئولیت کامل را برای تأخیر در برنامه‌ریزی در فیلم «ویتنی اسپرینگز» با کندریک لامار به عهده می‌گیرند", "summary_fa": "تری پارکر و مت استون، خالقان South Park، مدتی است که درباره اولین فیلم بلندشان پس از نمایش اکشن عروسکی در سال 2004، تیم آمریکا: پلیس جهانی صحبت می کنند. بنابراین، چرا ما بیش از یک سال از تاریخ انتشار اولیه آن ندیده ایم که طبق گزارشات 100 میلیون دلاری آن ها را دنبال می کند کمدی جنس اورگازمو 1997 که تاریخ اکران اصلی آن فرا رسیده است؟ این دو در بیانیه‌ای برای The Ankler این هفته توضیح دادند که چرا کمدی موزیکال درباره غرامت‌های برده‌داری که در داخل پارامونت به آن اشاره می‌شود به‌عنوان ویتنی اسپرینگز مدام از فهرست کارهایشان حذف می‌شود. استون و پارکر در بیانیه‌ای به سایت گفتند: «ما مسئولیت کامل تأخیر برنامه این فیلم را می‌پذیریم. ما از شرکای خود در pgLang و پارامونت عذرخواهی می کنیم و از صبر آنها قدردانی می کنیم. پارک جنوبی و شرایط زندگی مانع شده است، اما ما هنوز به این پروژه اعتقاد داریم.» بر اساس گزارش The Ankler، در سال 2021، گروهی از مدیران پارامونت از دفاتر شرکت سازنده دوتایی پارک کانتی دیدن کردند تا فیلمنامه نوشته شده توسط ورنون چتمن (Wonder Showzen) کهنه کار ساوت پارک را بخوانند. در آن زمان برنامه این بود که فیلم توسط پارکر کارگردانی شود و توسط استون، کندریک لامار و شریک تجاری او دیو فری تهیه شود. طبق گزارش‌ها، پارامونت این فیلم را در ژانویه 2022 انتخاب کرد، و برایان رابینز، رئیس وقت پارامونت پیکچرز، در سال 2024 گفت که این فیلم‌نامه یکی از خنده‌دارترین و اصلی‌ترین فیلم‌نامه‌هایی بود که او خوانده است. این فیلم بر روی یک جوان سیاه‌پوست جوان در موزه مزارع برده‌های تاریخی در غرب میانه تمرکز دارد که بر سر گردشگران فریاد می‌زند و با شهردار نژادپرست شهر - با بازی پارکر - درگیر می‌شود - طبق گزارش‌ها قرار بود در تابستان 2024 تولید شود. منابع ناشناس به"}, {"source": "Billboard", "title": "AC/DC Show at Toronto’s Rogers Stadium Canceled Due to ‘Significant Damage’ From Massive Thunderstorm", "link": "https://www.billboard.com/music/rock/acdc-show-rogers-stadium-canceled-significant-damage-storm-1236337253/", "summary": "Mother nature is the only force that can slow down AC/DC . The veteran Australian hard rockers were slated to play one of the last shows on their two-year, 90-date Power Up tour at Toronto s Rogers Stadium on Sept. 16, but on Wednesday night (Sept. 9) the stadium announced that the show could not go on after the venue suffered major damage in a storm last week. We regret to announce that AC/DC s show scheduled for Sept. 16, 2026 at Rogers Stadium in Toronto has been canceled due to damage the venue sustained following a severe weather event, read a statement from the venue on X. The safety of our fans, artists, crew and venue staff remains our highest priority. Every effort was made to find potential solutions for the show to move forward in Toronto, but unfortunately we were unable to find an alternative venue that could accommodate everyone, it continued, noting that fans who bought tickets through Ticketmaster will automatically receive a refund to their original payment method. The statement revealed that after a thorough assessment of the stadium after last week s extreme weather event — which resulted in wide swaths of seats getting tossed, twisted and ripped from their moorings and other damage to the venue — there was no way to stage the show. It described a suspected microburst in the area from a 100-year storm that included extreme winds and heavy rainfall. In the days since, engineers have conducted a thorough assessment of the venue in coordination with the City of Toronto, read the statement attributed to Kevin Mahoney, the DTN risk communicator team lead and an AMS-certified consulting meteorologist and the venue s on-site meteorologist. That work has determined that sections of the venue impacted by the storm will need to be removed and rebuilt. Wayne Zronik, president of business operations for Live Nation Canada also weighed in with a statement in which he said that canceling a concert is never a decision we want to make. He acknowledged that doing so is disappointing to everyone who was looking forward to AC/DC closing out the venue s summer season. Safety has to come first, he said. Our teams have been working closely with the city and our partners to understand the storm damage and what needs to happen next. The right decision is to make the time to remove and rebuild the affected parts of the stadium to ensure it is ready to welcome fans next summer. There are three gigs left on AC/DC s tour, including a Saturday (Sept. 12) stop at Par", "date_str": "2026-09-10T12:39:04+00:00", "hash": "0e5fff9977cb85e2", "title_fa": "نمایش AC/DC در استادیوم راجرز تورنتو به دلیل \"خسارت قابل توجه\" از طوفان عظیم لغو شد.", "summary_fa": "طبیعت مادر تنها نیرویی است که می تواند AC/DC را کاهش دهد. هارد راکرهای کهنه کار استرالیایی قرار بود در تاریخ 16 سپتامبر یکی از آخرین برنامه های تور دو ساله 90 پاور آپ خود را در استادیوم راجرز تورنتو اجرا کنند، اما چهارشنبه شب (9 سپتامبر) استادیوم اعلام کرد که بعد از اینکه محل برگزاری در طوفان هفته گذشته آسیب زیادی دید، نمایش نمی تواند ادامه یابد. با کمال تاسف اعلام می کنیم که نمایش AC/DC برای سپتامبر برنامه ریزی شده است. بیانیه ای از محل برگزاری در X بخوانید. ایمنی هواداران، هنرمندان، خدمه و کارکنان سالن ما همچنان بالاترین اولویت ماست. تمام تلاش‌ها برای یافتن راه‌حل‌های بالقوه برای پیشبرد نمایش در تورنتو انجام شد، اما متأسفانه نتوانستیم مکان جایگزینی را پیدا کنیم که بتواند همه را در خود جای دهد، و خاطرنشان کرد که طرفدارانی که بلیط‌ها را از طریق Ticketmaster خریداری کرده‌اند به طور خودکار به روش پرداخت اصلی خود بازپرداخت خواهند کرد. این بیانیه نشان داد که پس از ارزیابی کامل ورزشگاه پس از رویداد آب و هوای شدید هفته گذشته - که منجر به پرت شدن، پیچ و تاب خوردن و کنده شدن قسمت‌های وسیعی از صندلی‌ها از لنگرگاه‌ها و آسیب‌های دیگر به محل برگزاری شد - راهی برای اجرای نمایش وجود ندارد. این گزارش یک ریز انفجار مشکوک در منطقه را از یک طوفان 100 ساله که شامل بادهای شدید و بارندگی شدید بود، توصیف کرد. در روزهای پس از آن، مهندسان با هماهنگی شهر تورنتو، ارزیابی کاملی از محل برگزاری انجام دادند، بیانیه منتسب به کوین ماهونی، سرپرست تیم ارتباط دهنده خطر DTN و هواشناس مشاور دارای گواهینامه AMS و هواشناس محل برگزاری را بخوانید. این کار مشخص کرده است که بخش‌هایی از مکان تحت تأثیر طوفان باید برداشته و بازسازی شود."}, {"source": "Billboard", "title": "Ludacris, Chris Stapleton Reimagine ‘In the Air Tonight’ for ‘Monday Night Football’: Watch", "link": "https://www.billboard.com/music/music-news/ludacris-chris-stapleton-in-the-air-tonight-monday-night-football-1236336763/", "summary": "All he does is win! Billboard can exclusively announce that Ludacris is joining Chris Stapleton and Cindy Blackman Santana for Monday Night Football s signature opening with Phil Collins iconic 1981 hit In the Air Tonight. Related Here s How to Watch the 2026-27 NFL Season Live Online for Free Lil Uzi Vert, Infinity Song Memphis Bleek Among NFL Roc Nation s 2026 Songs of the Season Ricky Martin Pedro Sampaio to Headline NFL Halftime Show in Rio: There s Nothing Quite Like the Energy of the Brazilian People The second you hear that song, you know something big is coming, Luda tells Billboard . Teaming up with Chris and Cindy to bring a new energy to Monday Night Football was a lot of fun, and I can t wait for fans to experience it. In the new opening for Monday Night Football , Stapleton and Blackman Santana roll up together in a vehicle as a stage shows off her drum set and the country star s silhouette. A hand then takes the mic. Monday night magic/ Closing out the weekend/ Luda on the mic/ It s football season! the rapper-actor who currently boasts 18 Billboard Hot 100 top 10 hits rhymes to a frenzied crowd before Blackman Santana pounds out the unmistakeable drum fill from In the Air Tonight. Chris and Cindy have helped make In the Air Tonight an integral part of the Monday Night Football experience over the last three seasons, Julie McGlone, ESPN vp, production and executive producer of the In the Air Tonight project, said in a statement. Adding Ludacris to the legacy MNF anthem brings a new dimension to the creative and continues our tradition of celebrating the intensity, anticipation and shared emotion of American sports culture, where music, competition and spectacle come together to make each game feel like a cultural event. The new segment will lead into each Monday Night Football match for the 2026 NFL season. This year also marks the fourth football season that the country star and the drumme have reimagined Collins Hot 100 No. 19 track for ESPN. They have previously also incorporated Snoop Dogg in 2023. Watch the new spot below:", "date_str": "2026-09-10T12:30:00+00:00", "hash": "7a9548d87d63615b", "title_fa": "لوداکریس، کریس استاپلتون برای فیلم دوشنبه شب فوتبال در هوا دوباره تصور کنید: تماشا کنید", "summary_fa": "تنها کاری که او انجام می دهد برنده شدن است! بیلبورد می‌تواند به طور انحصاری اعلام کند که لوداکریس به کریس استپلتون و سیندی بلکمن سانتانا برای افتتاحیه امضای دوشنبه شب فوتبال با آهنگ نمادین فیل کالینز در سال 1981 در هوای امشب می‌پیوندد. در اینجا مربوطه نحوه تماشای آنلاین فصل NFL 2026-27 به صورت زنده به صورت آنلاین Lil Uzi Vert، آهنگ Infinity Memphis Bleek در میان آهنگ های فصل NFL Roc Nation 2026 Ricky Martin Pedro Sampaio تا Headline NFL Halftime Show in Rio: Theres You Know the Energy The Second The People of Brazil. لودا به بیلبورد می گوید بزرگ در راه است. همکاری با کریس و سیندی برای آوردن انرژی جدید به فوتبال دوشنبه شب بسیار سرگرم کننده بود و من نمی توانم منتظر بمانم تا طرفداران آن را تجربه کنند. در افتتاحیه جدید دوشنبه شب فوتبال، استیپلتون و بلکمن سانتانا در یک وسیله نقلیه کنار هم جمع می‌شوند تا صحنه درام او و شبح ستاره کانتری را نشان دهد. سپس یک دست میکروفون را می گیرد. جادوی دوشنبه شب/ تعطیلی آخر هفته/ لودا روی میکروفون/ فصل فوتبال است! این بازیگر رپ که در حال حاضر دارای 18 قافیه از 100 آهنگ برتر بیلبورد در میان جماعت دیوانه شده است، قبل از اینکه بلکمن سانتانا درام بی‌نظیر را از In the Air Tonight پخش کند. جولی مک‌گلون، معاون ESPN، تهیه‌کننده و تهیه‌کننده اجرایی پروژه In the Air Tonight، در بیانیه‌ای گفت: کریس و سیندی کمک کرده‌اند تا In the Air Tonight بخشی جدایی‌ناپذیر از تجربه فوتبال دوشنبه شب در سه فصل گذشته باشد. اضافه کردن Ludacris به سرود میراث MNF بعد جدیدی به خلاقیت می‌آورد و سنت ما را در جشن گرفتن شدت، پیش‌بینی و احساسات مشترک فرهنگ ورزش آمریکایی ادامه می‌دهد، جایی که موسیقی، رقابت و تماشای نمایش با هم ترکیب می‌شوند تا هر بازی"}, {"source": "Billboard", "title": "Billy Joel Says Doctors Who Diagnosed Him With Brain Disorder Told Him His Concerts Were ‘Causing Damage to My Brain Nerves’", "link": "https://www.billboard.com/music/pop/billy-joel-concerts-causing-damage-brain-nerves-surgery-shunt-1236337246/", "summary": "Billy Joel is finally opening up about how a diagnosis of Normal Pressure Hydrocephalus last year revealed the unexpected damage his concerts were causing to his brain. In an interview on his SiriusXM channel on Wednesday (Sept. 9), 77-year-old Piano Man singer described going to see a doctor after suffering from balance problems that made it feel like he was on a boat. After giving him the diagnosis, his neurologists recommended implanting a shunt in his brain to reliever some of the pressure. So I agreed to do the shunt,” Joel said, noting that he initially said he d pass on the suggestion of the surgery that entailed drilling a hole through his skull to implant the shunt, in order to stop the progressive condition from getting worse. “But then I read up on it and I realized it can help improve your balance and can help your memory. You know, I don t want to lose my marbles, Joel said. It s hard to tell what s age and what s a condition, so I agreed to do the shunt and I had a surgery, and they implanted a shunt in my brain and it actually improved things.” And while he said his memory, balance and ability to function all improved after the procedure, the bad news was that his doctors also advised him to stop performing live because they said the physical effects of playing loud rock shows might cause further damage. I realized, and the doctors told me this, because of my job, which is playing rock n roll music very loud, that it was giving me something like a concussion every time I did a show, the singer said. It was causing damage to my brain nerves and I could be losing more brain cells the more shows I did and I realized that means I shouldn t be doing this right now. And so, Joel canceled his planned 2025 tour dates due to the diagnosis and recovery from the condition that occurs when cerebrospinal fluid builds up inside the skull, pressing on the brain and affecting a number of abilities, including thinking and concentration, memory, movement and more, according to the Cleveland Clinic . Taking his doctor s orders to let his brain rest, Joel decided he needed to take a break from the road. “I gotta improve. They don’t want me to stress too much, he said. So now he s doing physical therapy and whatever it is they tell me to do because I don t want to lose it. In addition, he described constantly testing myself, while assuring fans who ve heard about his condition that he s doing just fine. I just want people to know, don t worry about me, he said. ", "date_str": "2026-09-10T12:06:18+00:00", "hash": "f6d4a05032820d70", "title_fa": "بیلی جوئل می‌گوید پزشکانی که به او اختلال مغزی داده‌اند به او گفته‌اند کنسرت‌هایش به اعصاب مغزی من آسیب می‌زند.", "summary_fa": "بیلی جوئل بالاخره در مورد اینکه چگونه تشخیص هیدروسفالی با فشار طبیعی در سال گذشته آسیب غیرمنتظره‌ای را که کنسرت‌هایش به مغزش وارد می‌کرد، آشکار کرد. خواننده 77 ساله پیانو من در مصاحبه ای در کانال SiriusXM خود در روز چهارشنبه (9 سپتامبر) توضیح داد که پس از مشکلات تعادلی که باعث می شد احساس کند در یک قایق است، به پزشک مراجعه کرده است. پس از تشخیص این بیماری، متخصصان مغز و اعصاب او کاشت یک شانت در مغز او را برای کاهش بخشی از فشار توصیه کردند. جوئل با اشاره به اینکه در ابتدا گفت که پیشنهاد جراحی را که شامل سوراخ کردن جمجمه برای کاشت شانت به منظور جلوگیری از بدتر شدن وضعیت پیشرونده بود، گفت: «اما سپس آن را خواندم و متوجه شدم که می‌تواند به بهبود تعادل شما کمک کند و به حافظه شما کمک کند. می‌دانی، من نمی‌خواهم تیله‌هایم را گم کنم، جوئل گفت. تشخیص سن و شرایط سخت است، بنابراین با انجام شانت موافقت کردم و یک عمل جراحی انجام دادم و آنها یک شانت را در مغز من کاشتند و در واقع اوضاع را بهبود بخشید. و در حالی که او گفت که حافظه، تعادل و توانایی عملکردش بعد از عمل بهبود یافته است، خبر بد این بود که پزشکانش همچنین به او توصیه کردند که اجرای زنده را متوقف کند، زیرا آنها گفتند که اثرات فیزیکی پخش شوهای راک با صدای بلند ممکن است باعث آسیب بیشتر شود. به گفته این خواننده، به دلیل شغلم که موسیقی راک اند رول با صدای بلند پخش می‌کنم، متوجه شدم و پزشکان این را به من گفتند که هر بار که برنامه‌ای اجرا می‌کردم چیزی شبیه ضربه مغزی به من می‌داد. این باعث آسیب به اعصاب مغزم می‌شد و هرچه نمایش‌های بیشتری انجام می‌دادم سلول‌های مغزی بیشتری را از دست می‌دادم و متوجه شدم"}, {"source": "Billboard", "title": "Alicia Keys, YEONJUN & More Join 2026 Global Citizen Festival Lineup: ‘Every Time We Come Together, Something Shifts’", "link": "https://www.billboard.com/culture/events/alicia-keys-yeonjun-2026-global-citizen-festival-lineup-1236336939/", "summary": "The 2026 Global Citizen Festival is getting even bigger. Alicia Keys , Victoria Monét , YEONJUN and YOSHIKI are among the roster of stars set to take the stage at the event, which returns to New York City s Central Park on Sept. 26. Keys will perform alongside a group of special guests, while Monét, YEONJUN and YOSHIKI will make their Global Citizen Festival debuts. They join a previously announced lineup that includes Ms. Lauryn Hill Wyclef Jean , Lenny Kravitz , John Legend , Lainey Wilson , Shaboozey and TOMORROW X TOGETHER . More performers are expected to be announced ahead of the festival. Related Victoria Monét Announces Frequency of Love Release Date Drops Kaytranada-Produced Reach Out Single YEONJUN Brings NO LABELS to Life at Billboard Live: Photos From Inside TOMORROW X TOGETHER Singer s West Hollywood Concert Sit-Down Chat Alicia Keys Signs With CAA The event will also feature appearances from Bill Nye, IZA, Jordan Fisher , Katie Couric, Lais Ribeiro, Marcus Samuelsson, Naomi Watanabe, Nomzamo Mbatha, PJ Sin Suela and Vladimir Duthiers. For Keys, returning to the festival carries some hometown significance. There s nothing like standing on that Global Citizen stage in the middle of Central Park, in my city, with people who love the world enough to show up for it, she said in a statement. Every time we come together, something shifts. This year s festival is built around Global Citizen s efforts to address issues connected to extreme poverty, with campaigns focused on education, supporting smallholder farmers and expanding access to electricity. Fans can earn free festival tickets by completing action-based challenges through the Global Citizens app. New Yorkers also have opportunities to earn points through local volunteer efforts throughout September, including urban planting, beach cleanups and food donations. Participating organizations include Bowery Mission, Jamaica Bay-Rockaway Parks Conservancy, Pollinator Pathways, Support + Feed and 9/11 Day. There s also a new way to turn those points into a ticket: After completing an action journey and earning enough points, fans can either enter the free-ticket lottery or make a $25 charitable donation to instantly secure a ticket, while supplies last. Donations will support New York City initiatives, including free programming through City Parks Foundation and organizations serving New Yorkers experiencing homelessness. And for fans who want to rep the festival before heading to Central Park, the ", "date_str": "2026-09-10T12:00:00+00:00", "hash": "c571400f8ada0c3a", "title_fa": "آلیشیا کیز، YEONJUN و بیشتر به فهرست جشنواره جهانی شهروند 2026 بپیوندید: \"هر بار که با هم می آییم، چیزی تغییر می کند\"", "summary_fa": "جشنواره جهانی شهروند 2026 بزرگتر می شود. آلیشیا کیز، ویکتوریا مونه، یونجون و یوشیکی از جمله ستارگانی هستند که قرار است در این رویداد روی صحنه بروند، که در 26 سپتامبر به پارک مرکزی شهر نیویورک بازمی گردد. کیز در کنار گروهی از مهمانان ویژه اجرا خواهند کرد، در حالی که مونه، یونجون و یوشیکی اولین جشنواره شهروند جهانی خود را خواهند داشت. آنها به صفی که قبلا اعلام شده بود ملحق می شوند که شامل خانم. Lauryn Hill Wyclef Jean، Lenny Kravitz، John Legend، Lainey Wilson، Shaboozey و ToMORROW X TOGETHER. انتظار می رود پیش از جشنواره تعداد بیشتری از اجراکنندگان معرفی شوند. موارد مرتبط ویکتوریا مونه تعداد دفعات انتشار عشق را اعلام کرد. IZA، جردن فیشر، کیتی کوریک، لایس ریبیرو، مارکوس ساموئلسون، نائومی واتانابه، نومزامو مباتا، پی جی سین سوئلا و ولادیمیر دوتیرز. برای کیز، بازگشت به جشنواره دارای اهمیت شهر مادری است. او در بیانیه ای گفت، هیچ چیز مانند ایستادن روی صحنه شهروند جهانی در وسط پارک مرکزی، در شهر من، با افرادی که به اندازه کافی دنیا را دوست دارند برای حضور در آن حضور دارند، نیست. هر بار که دور هم جمع می شویم، چیزی عوض می شود. جشنواره امسال حول محور تلاش‌های Global Citizen برای رسیدگی به مسائل مرتبط با فقر شدید، با کمپین‌هایی متمرکز بر آموزش، حمایت از کشاورزان خرده‌مالک و گسترش دسترسی به برق است. طرفداران می توانند با انجام چالش های مبتنی بر اکشن از طریق اپلیکیشن Global Citizens بلیت جشنواره رایگان دریافت کنند. نیویورکی‌ها همچنین فرصت‌هایی برای کسب امتیاز از طریق تلاش‌های داوطلبانه محلی در ماه سپتامبر دارند، از جمله کاشت شهری، پاک‌سازی ساحل و اهدای غذا."}, {"source": "Billboard", "title": "Shania Twain Says ‘You’re Still the One’ Enters ‘A Different Universe’ With Zedd’s ‘Candy Crush’ Remix: ‘It’s On a Never-Ending Journey’", "link": "https://www.billboard.com/music/music-news/shania-twain-youre-still-the-one-zedd-remix-candy-crush-1236337105/", "summary": "Nearly three decades after “You’re Still the One” became Shania Twain ’s signature love song, the country-pop classic is getting a decidedly different kind of second life: a dance makeover from Zedd , wrapped in the sugar-coated interactive universe of Candy Crush . For Twain, the alteration of the song’s anatomy is less about changing a classic than watching it continue to evolve. “You’re Still the One,” which reached No. 2 on the Billboard Hot 100 back in 1998 — Twain’s highest-charting song on the all-genre tally — has been a fixture of weddings and anniversaries for a long time. Now, with Zedd’s production and Candy Crush ’s fantastical Candy Country setting, Twain sees the light of another beautiful chapter for the classic. “It’s a great, new, exciting platform for the song, for my classic, and I’m flattered by it,” Twain tells Billboard . The song, originally released on Twain’s 1997 album Come On Over , spent 42 weeks on the Hot 100 and became a major country-pop crossover hit for the singer. It also earned Twain two Grammys, for best country song and best female country vocal performance. The song is now getting a fresh, new sonic identity. The new version, releasing as part of Candy Crush ’s Music Season 2026, keeps Twain’s original vocal while Zedd gives the track a dance-oriented production. Its accompanying interactive music video drops fans into Candy Country, a surreal Western-inspired world filled with hidden clues and rewards, including opportunities to win VIP trips to meet Twain or Zedd on tour and pieces inspired by their looks. The idea initially caught Twain off-guard. Obviously, “You’re Still the One” has its fair share of remixed versions, but the combination of Zedd’s production and Candy Crush ’s visual concept took the idea somewhere she hadn t anticipated. “I would never have thought of that myself,” she says of the Candy Country concept. “So I was excited about it. And it takes the song to a whole other place. It takes it to a different universe, is a good way to put it.” That sense of discovery is part of what made the collaboration so appealing to Twain. Instead of just replacing the original recording altogether, Zedd was able to build around her existing vocal, allowing for a song that fans have known for nearly 30 years to sound different without losing its most recognizable parts. “I was really flexible. I’m just like, you know, Do your thing! ” Twain says. “ You’re Zedd for a reason, and I’m excited about what you’re gonn", "date_str": "2026-09-10T12:00:00+00:00", "hash": "af0b57e1224aa4f2", "title_fa": "شانیا تواین می‌گوید «تو هنوز هم یکی هستی» با ریمیکس «Candy Crush» از Zedd وارد «یک جهان متفاوت» می‌شود: «این در یک سفر بی‌پایان است»", "summary_fa": "تقریباً سه دهه پس از اینکه «تو هنوز هم یکی هستی» به آهنگ عاشقانه امضای شانیا تواین تبدیل شد، این کلاسیک کانتری پاپ به طور قطعی زندگی دوم متفاوتی پیدا می‌کند: یک تغییر رقص از Zedd، که در دنیای تعاملی قندی کراش پیچیده شده است. برای تواین، تغییر آناتومی آهنگ کمتر به تغییر یک کلاسیک مربوط می شود تا تماشای ادامه تکامل آن. «You're Still The One» که به شماره رسید. 2 در Billboard Hot 100 در سال 1998 - بالاترین ترانه چارت تواین در فهرست همه ژانرها - برای مدت طولانی یکی از مراسم عروسی و سالگرد بوده است. اکنون، با تولید Zedd و محیط فوق العاده Candy Crush Candy Country، تواین نور فصل زیبای دیگری را برای کلاسیک می بیند. تواین به بیلبورد می‌گوید: «این یک پلتفرم عالی، جدید و هیجان‌انگیز برای این آهنگ، برای کلاسیک من است، و من از آن متملق هستم. این آهنگ که در ابتدا در سال 1997 در آلبوم تواین به نام Come On Over منتشر شد، 42 هفته را در Hot 100 سپری کرد و تبدیل به یک موفقیت بزرگ متقاطع کانتری پاپ برای خواننده شد. همچنین برای تواین دو جایزه گرمی برای بهترین آهنگ کانتری و بهترین اجرای آواز کانتری زن به دست آورد. این آهنگ اکنون هویت صوتی تازه و جدیدی پیدا می کند. نسخه جدید که به عنوان بخشی از فصل موسیقی Candy Crush در سال 2026 منتشر می شود، آواز اصلی تواین را حفظ می کند در حالی که Zedd به آهنگ یک تولید رقص محور می دهد. موزیک ویدیوی تعاملی همراه آن طرفداران را به Candy Country می‌کشاند، دنیایی سورئال الهام گرفته از غرب پر از سرنخ‌ها و جوایز پنهان، از جمله فرصت‌هایی برای برنده شدن در سفرهای VIP برای ملاقات با تواین یا زد در تور و قطعاتی که از ظاهر آن‌ها الهام گرفته شده است."}, {"source": "Deadline", "title": "Anthony Hopkins To Star In Post-Apocalyptic Sci-Fi ‘2048’ — TIFF Market", "link": "https://deadline.com/2026/09/anthony-hopkins-post-apocalyptic-sci-fi-2048-tiff-market-1237073285/", "summary": "EXCLUSIVE: Two-time Oscar winner Anthony Hopkins is set to star in 2048, a post-apocalyptic sci-fi film from director Timothy Woodward Jr. Hopkins and Woodward Jr recently teamed up on sci-fi-horror film Eyes In The Trees, which is in post-production. Set in a future where a dying planet has forced the last remnants of humanity underground, 2048 unfolds [ ]", "date_str": "2026-09-10T14:30:00+00:00", "hash": "cd2f0db09a0ab333", "title_fa": "آنتونی هاپکینز در فیلم علمی تخیلی پساآخرالزمانی «2048» - TIFF Market بازی می کند", "summary_fa": "اختصاصی: آنتونی هاپکینز برنده دو جایزه اسکار قرار است در سال 2048 بازی کند، یک فیلم علمی تخیلی پسا آخرالزمانی از کارگردان تیموتی وودوارد جونیور هاپکینز و وودوارد جونیور اخیراً در فیلم علمی تخیلی ترسناک Eyes In The Trees که در مرحله پس از تولید است، همکاری کردند. در آینده ای که در آن سیاره ای در حال مرگ آخرین بقایای بشریت را به زیر زمین آورده است، 2048 آشکار می شود [ ]"}, {"source": "Deadline", "title": "‘American Horror Story’ Season 13 Trailer: “It’s Witch-Hunting Season”", "link": "https://deadline.com/2026/09/american-horror-story-season-13-trailer-1237032637/", "summary": "UPDATE: Welcome to the greatest show on earth. So begins the official trailer for American Horror Story Season 13. FX unveiled the full version Thursday which features returning Jessica Lange, Sarah Paulson and Evan Peters, who reprise multiples roles from previous seasons. AHS: 13 will premiere Thursday, September 24 at 9 p.m. ET / 6 [ ]", "date_str": "2026-09-10T14:26:00+00:00", "hash": "b51cb8b2a08180a3", "title_fa": "تریلر فصل سیزدهم «داستان ترسناک آمریکایی»: «فصل شکار جادوگر است»", "summary_fa": "به روز رسانی: به بزرگترین نمایش روی زمین خوش آمدید. بنابراین، تریلر رسمی فصل 13 American Horror Story آغاز می شود. FX نسخه کامل آن را پنجشنبه رونمایی کرد که جسیکا لانژ، سارا پالسون و ایوان پیترز بازگشته اند، که نقش های چندگانه از فصل های قبل را تکرار می کنند. AHS: 13 پنج شنبه، 24 سپتامبر ساعت 21 پخش خواهد شد. ET / ساعت 6 بعد از ظهر PT در FX و Hulu. تریلر رسمی بالا را ببینید و جزئیات بیشتر و تیزر زیر را ببینید. قبلی، آگوست 13: اگر به کولروفوبیا (ترس از دلقک ها) مبتلا هستید، ممکن است بخواهید از تماشای اولین تیزر فصل سیزدهم داستان ترسناک آمریکایی که به تازگی منتشر شد (بالا) صرف نظر کنید. اخبار مرتبط اخبار بزرگسالان ستاره مالک السال زهران ممدانی را برای فصل 3 می خواهد کمئو: ما اخبار متقابل داریم بزرگسالان ستاره لوسی فریر فکر می کند جولیا فاکس بعد از فصل 1 یک نفرین را در نمایش می گذارد: احساس می کند توئیستی دلقک به یک برکت تبدیل می شود (جان کارول لینچ، بازیگران، رابرت کارول، بازیگران مختلف فیلم، اما رابرت لینچ را نیز در نقش دیگر بازیگران فیلم دارد). مدیسون مونتگومری، جسیکا لانژ در نقش کنستانس لنگدون، آنجلا باست در نقش ماری لاوئو، سارا پالسون در نقش کوردلیا گود، ایوان پیترز در نقش کای اندرسون، گابوری سیدیبه، جیمی بروئر در نقش آدی لنگدون و منا سوواری در نقش کوکب سیاه، و همچنین برای نقش من بلوستر آنتونی کِلی، دونینگ. در ددلاین تماشا کنید بقیه بازیگران شامل جوی پولاری، کتی بیتس، لزلی گروسمن، آوانتیکا، ال چپمن، برتو کولون، الکس کنسانی، فرانسیس کانروی، مت فریزر، ست گابل، اورلاندو جونز، پل آنتونی کلی، تیگ نوتارو، مادلین پتش، جان استیچ، ویلا و فدور هستند."}, {"source": "Deadline", "title": "New York Film Festival To Screen Buzzy Elizabeth Holmes Doc ‘You Can See Everything’", "link": "https://deadline.com/2026/09/new-york-film-festival-adds-you-can-see-everything-documentary-1237073367/", "summary": "The New York Film Festival has a late addition to its lineup, setting Nathan Fielder and Lance Oppenheim’s Elizabeth Holmes documentary You Can See Everything to the Spotlight section for a NY debut after its buzzy sneak premiere at Telluride. Holmes, founder of biotech startup Theranos and inventor of a purported miracle medical blood screening [ ]", "date_str": "2026-09-10T14:24:46+00:00", "hash": "812528ae1137e149", "title_fa": "جشنواره فیلم نیویورک برای نمایش مستند الیزابت هلمز با عنوان «شما می توانید همه چیز را ببینید»", "summary_fa": "جشنواره فیلم نیویورک اخیراً به ترکیب خود اضافه شده است و مستند ناتان فیلدر و لنس اوپنهایم از الیزابت هولمز، شما می توانید همه چیز را در بخش Spotlight ببینید، برای اولین بار در نیویورک پس از اولین نمایش مخفیانه آن در تلوراید تنظیم کرد. هولمز، بنیانگذار استارتاپ بیوتکنولوژی Theranos و مخترع آزمایش خون پزشکی معجزه آسا [ ]"}, {"source": "Deadline", "title": "Blue Fox Launches Sales On YA Rom-Com ‘Buster Brooks’ With Matt Cornett & Melissa Collazo — TIFF Market", "link": "https://deadline.com/2026/09/matt-cornett-melissa-collazo-buster-brooks-launches-sales-1237073377/", "summary": "EXCLUSIVE: Blue Fox Entertainment has acquired worldwide rights to the YA romantic comedy Buster Brooks, written and directed by Savannah Ostler (Even in Dreams). The company will launch worldwide sales at this week s TIFF market. Matt Cornett (Every Year After) stars as Buster Brooks, who moves from his small farm town to Hollywood to try [ ]", "date_str": "2026-09-10T14:18:23+00:00", "hash": "481037a75a9287c0", "title_fa": "Blue Fox فروش خود را در YA Rom-Com \"Buster Brooks\" با مت کورنت و ملیسا کولازو آغاز کرد - TIFF Market", "summary_fa": "اختصاصی: Blue Fox Entertainment حقوق جهانی کمدی رمانتیک YA باستر بروکس به نویسندگی و کارگردانی ساوانا اوستلر (حتی در رویاها) را به دست آورده است. این شرکت فروش جهانی خود را در بازار TIFF این هفته راه اندازی خواهد کرد. مت کورنت (هر سال بعد) در نقش باستر بروکس، که از شهر مزرعه کوچک خود به هالیوود نقل مکان می کند تا سعی کند آن را در فیلم بسازد، بازی می کند. او بیش از آنچه انتظار داشت می یابد، از جمله علاقه جدیدی به لوسی باهوش و باهوش، که به او کمک می کند تا واقعیت های غیرقابل پیش بینی هالیوود را طی کند. همانطور که باستر به رویای خود نزدیک می شود، با یک انتخاب دشوار روبرو می شود: دنبال زندگی و دختری که همیشه تصور می کرد، یا بازگشت به خانواده ای که به او نیاز دارند. اخبار مرتبط: اولین نگاه به بریجرتون استار فلورانس هانت در سن بلوغ اخبار درام Le Faux Soir تریلر: آریه وورتالتر ملانی تیری ستاره در درام هک رسانه ای مقاومتی بلژیکی WW2 - TIFF این فیلم همچنین با بازی Vanessa Angel (Wird Knowledge Mother, Em Corin-My Neuinme-Baster) نام استیون است در نقش پدرش، گلن مورشوور (24 ساله) در نقش عمو ند، و ملیسا کولازو (چیزهای عجیب) در نقش لوسی، در کنار آلیسون آرنگریم (خانه کوچک در دشت)، شارلوت همینگز (ایمان فرشتگان)، آرتمیس پبدانی (اسکاندال دور، ادرکی در حال بیرون رفتن) بازیگران کلیدی Watch on Deadline Pic توسط Tony Toscano، McCord Larsen، Steven D Alo و Savannah Ostler برای Iris Entertainment، S S Productions و Olympus Media International تهیه شده است و Carolyn Koskan و Tony Toscano به عنوان تهیه کنندگان اجرایی فعالیت می کنند. وس جانسون به عنوان فیلمبردار، با بازیگران لیزا لندن و کاترین استراد کار می کند. تدوین فیلم توسط استیون دی آلو و براندون هو انجام شده است."}, {"source": "Deadline", "title": "‘Bare’: First Look At ‘Bridgerton’ Star Florence Hunt In Coming-Of-Age Drama", "link": "https://deadline.com/2026/09/bridgerton-star-florence-hunt-first-look-new-movie-bare-1237073366/", "summary": "EXCLUSIVE: Deadline can reveal the first look at Bare, the feature directorial debut from writer-director Lorna Tucker, starring Florence Hunt (Bridgerton) alongside Isla Fisher and Colin Firth. The ensemble cast also includes Sky Frances, Ruaridh Mollica, Séamus McLean Ross, Mirren Mack, Lewis Gribben, Tut Nyuot, Clay Russell, Umi Myers and Shane Walker, with a cameo from Fatboy [ ]", "date_str": "2026-09-10T14:05:27+00:00", "hash": "4ae4b0a05f7c1250", "title_fa": "\"Bare\": اولین نگاه به فلورانس هانت ستاره \"بریجرتون\" در درام دوران بلوغ", "summary_fa": "انحصاری: Deadline می‌تواند اولین نگاه به Bare را نشان دهد، اولین فیلم کارگردانی بلند از لورنا تاکر، نویسنده و کارگردان، با بازی فلورانس هانت (بریجرتون) در کنار Isla Fisher و Colin Firth. بازیگران گروه همچنین شامل Sky Frances، Ruaridh Mollica، Séamus McLean Ross، Mirren Mack، Lewis Gribben، Tut Nyuot، Clay Russell، Umi Myers و Shane Walker، با یک فیلم کوتاه از Fatboy [ ]"}, {"source": "Deadline", "title": "‘Now You See Me Live’ Stage Illusion Show To Play Broadway This Holiday Season", "link": "https://deadline.com/2026/09/now-you-see-me-live-broadway-1237072975/", "summary": "Following engagements in Australia, Singapore and London’s West End, Now You See Me Live, the stage show inspired by the Lionsgate film franchise, will run on Broadway this holiday season. Presented by Tim Lawson and Simon Painter (creators of The Illusionists), and in collaboration with Lionsgate, Now You See Me Live will begin performances at [ ]", "date_str": "2026-09-10T14:00:00+00:00", "hash": "d07d11088d2003dd", "title_fa": "نمایش توهم روی صحنه «اکنون مرا زنده می‌بینی» برای پخش برادوی در این فصل تعطیلات", "summary_fa": "پس از نامزدی در استرالیا، سنگاپور و وست اند لندن، برنامه Now You See Me Live، نمایش صحنه ای با الهام از فرانچایز فیلم Lionsgate، در این فصل تعطیلات در برادوی اجرا می شود. با ارائه تیم لاوسون و سایمون پینتر (سازندگان The Illusionists) و با همکاری Lionsgate، Now You See Me Live اجراهای خود را در [ ] آغاز خواهد کرد."}, {"source": "Deadline", "title": "‘Burgundy’ Cheers Moviegoers With Tale Of Old School Values And Grand Cru Wine – Telluride Film Festival", "link": "https://deadline.com/2026/09/burgundy-documentary-telluride-film-festival-1237073283/", "summary": "What wine pairs well with beefcake? Burgundy, of course. That’s the conclusion one might reasonably draw from the new documentary directed by Michael Dweck and Gregory Kershaw that’s set in the famous wine-making region of France. Among the colorful personnages in Burgundy is Enzo Ferraroli, a young hunk who goes shirtless at times as he [ ]", "date_str": "2026-09-10T14:00:00+00:00", "hash": "2aa76c98ef777389", "title_fa": "«Burgundy» تماشاگران سینما را با داستان ارزش‌های مدرسه قدیمی و شراب Grand Cru شاد می‌کند - جشنواره فیلم تلوراید", "summary_fa": "چه شرابی با کیک بیف جفت می شود؟ البته بورگوندی این نتیجه‌ای است که می‌توان از مستند جدیدی به کارگردانی مایکل دوک و گریگوری کرشاو که در منطقه معروف شراب‌سازی فرانسه می‌گذرد، گرفت. در میان پرسنل رنگارنگ در بورگوندی، انزو فرارولی، جوانی است که گاهی اوقات بدون پیراهن می‌رود، زیرا می‌آموزد که شراب‌سازی می‌کند، برای مثال، انگور را در یک خمره فشار می‌دهد. این فیلم که به تازگی اولین نمایش خود را در آمریکای شمالی در جشنواره فیلم تلوراید برگزار کرد، همچنین مالک زمین [برتراند دیویلیارد، پدرسالار خانواده دیویلیارد] را نشان می‌دهد که به میراث خانواده‌اش علاقه دارد، کارگر جوان مشتاقی که امیدوار است تاکستان خود را راه‌اندازی کند [که انزو می‌تواند در مورد طلاق‌گیران صحبت کند و در مورد طلاق‌گرفتن بسیاری صحبت می‌کند. همانطور که برنامه تلوراید اشاره می کند، تاریخ های ناگوار. (منتقد شراب به این فکر می کند که نوشیدن یک شراب بطری شده در سال تولد چقدر شگفت انگیز است و خوش شانسی او که در سال 1971 به دنیا آمده است، یک وینتاژ عالی). داستان‌های مرتبط جشنواره‌ها The Talk Of Telluride: Screening Secret Of Elizabeth Holmes Documentary You Can See Everything مستند کارگردان پاوو چوینینگ دورجی، ویولن‌سلیست تیم یویو ما در آهنگی برای شیر برفی در هیمالیاهای بوتان - جشنواره فیلم تلوراید در منطقه دوک و کرشاو در ایتالیا فرهنگ‌ها و شخصیت‌های آنها را بررسی کردند. مستند اسکار شکارچیان ترافل، و گاوچران و گاوچران آرژانتین در Gaucho Gaucho، فیلمبرداری شده در سیاه و سفید زیبا. آنها به سمت زمین‌ها و افرادی جذب می‌شوند که به نوعی خارج از زمان وجود دارند زیرا سنت‌های دیرینه را حفظ می‌کنند، خواه شکار ترافل، اسب‌سواری، یا در بورگوندی، کشت انگور بزرگ و غذاخوری‌های زیبا. به نظر می رسد که انزو از گذشته منتقل شده است، او یک مرد جوان 20 ساله است، در عین حال به دو معنی کلمه"}, {"source": "Deadline", "title": "Harry Styles Sets 2027 Global Stadium Tour; Opening Acts To Include Kylie Minogue, LCD Soundsystem, Tears for Fears & Others", "link": "https://deadline.com/2026/09/harry-styles-2027-together-together-stadium-tour-1237073325/", "summary": "Harry Styles will play two Los Angeles dates in the six-city North American leg of his Together, Together 2027 global stadium tour, with another six cities set for the subsequent European leg to follow. In all, 12 dates in the six North American cities are set for next year (two shows per city), with 13 [ ]", "date_str": "2026-09-10T13:46:51+00:00", "hash": "e3c8e2cb8d1126ea", "title_fa": "تور جهانی استادیوم 2027 هری استایلز. اقدامات افتتاحیه شامل کایلی مینوگ، سیستم صوتی LCD، اشک برای ترس و دیگران", "summary_fa": "هری استایلز در تور جهانی استادیوم Together, Together 2027 در شش شهر آمریکای شمالی، دو دیدار لس آنجلس برگزار خواهد کرد و شش شهر دیگر برای بازی اروپایی بعدی در نظر گرفته شده است. در مجموع، 12 تاریخ در شش شهر آمریکای شمالی برای سال آینده (دو نمایش در هر شهر)، با 13 تاریخ برای شش شهر اروپایی در نظر گرفته شده است. مراسم افتتاحیه، تغییر برای هر شهر، شامل Tinashe، CA7RIEL Paco Amoroso، Kylie Minogue، Lainey Wilson، Q Marsden، The Womack Sisters، Getdown Services، Caroline Polachek، Feist، LCD Soundsystem، Baby Rose و Tears for Fears خواهد بود. اخبار مرتبط اخبار هری استایلز کنسرت سائوپائولو را به دلیل بیماری لغو کرد کتاب‌ها همه آهنگ‌های پروژه درود مری: از هری استایلز گرفته تا نیل دایموند یکی از شهرهایی که در این فهرست وجود ندارد نیویورک است: استایلز در حال حاضر در آنجا حضور دارد. جزئیات تور امروز در یک پست اینستاگرامی آن را در زیر ببینید. بازی 12 تاریخ 2027 آمریکای شمالی شامل تاریخ های زیر خواهد بود: جمعه، 2 آوریل فینیکس، استادیوم مزرعه ایالتی AZ، با پشتیبانی تیناشه"}, {"source": "Deadline", "title": "NBCUniversal’s Split From Comcast Will “Allow Us To Move Faster,” Media Group Chief Matt Strauss Says", "link": "https://deadline.com/2026/09/nbcuniversal-comcast-split-matt-strauss-peacock-1237073307/", "summary": "NBCUniversal Media Group Chairman Matt Strauss is extremely bullish on the company s forthcoming split from Comcast. There is genuine excitement about the move inside the company, Strauss said Thursday at an investor conference hosted by BofA Securities. We feel really good about our trajectory and our growth, and I think the independence is going to [ ]", "date_str": "2026-09-10T13:32:23+00:00", "hash": "d6e22bc259cd0e05", "title_fa": "مت اشتراوس، رئیس گروه رسانه ای می گوید، جدایی NBCUniversal از Comcast به ما امکان می دهد سریعتر حرکت کنیم", "summary_fa": "مت اشتراوس، رئیس گروه رسانه ای NBCUniversal نسبت به جدایی آتی شرکت از Comcast بسیار خوش بین است. استراوس روز پنجشنبه در کنفرانس سرمایه گذاران به میزبانی BofA Securities گفت: هیجان واقعی در مورد این حرکت در داخل شرکت وجود دارد. ما نسبت به مسیر و رشد خود احساس بسیار خوبی داریم و فکر می کنم استقلال به [ ]"}, {"source": "Deadline", "title": "Spain’s Mediapro Group To Become Imagina After Reorganization", "link": "https://deadline.com/2026/09/grup-mediapro-relaunch-imagina-after-reorganization-1237073310/", "summary": "Spain s Grup Mediapro will relaunch as Imagina on January 1, 2027, following a major company review. The decision to relaunch comes after several months of reorganization and was announced internally yesterday at an all-staff meeting. The change revives a name the group has used before across its more than 30-year history, reflecting its intent to [ ]", "date_str": "2026-09-10T13:26:15+00:00", "hash": "86faca7af31f0b7e", "title_fa": "گروه Mediapro اسپانیا پس از سازماندهی مجدد به Imagina تبدیل می شود", "summary_fa": "Grup Mediapro اسپانیا در تاریخ 1 ژانویه 2027 با نام Imagina پس از بررسی یک شرکت بزرگ دوباره راه اندازی خواهد شد. تصمیم برای راه اندازی مجدد پس از چندین ماه سازماندهی مجدد گرفته شد و دیروز در یک جلسه تمام کارکنان به صورت داخلی اعلام شد. این تغییر نامی را که گروه قبلاً در تاریخ بیش از 30 ساله خود از آن استفاده کرده بود، احیا می کند و نشان دهنده قصد آن برای [ ]"}, {"source": "Deadline", "title": "‘Le Faux Soir’ Trailer: Arieh Worthalter & Mélanie Thierry Star In WW2 Belgian Resistance “Media Hack” Drama – TIFF", "link": "https://deadline.com/2026/09/le-faux-soir-belgian-resistance-drama-trailer-toronto-1237073316/", "summary": "EXCLUSIVE: Michaël R. Roskam‘s ensemble World War Two Belgian resistance drama Le Faux Soir world premieres as a Special Presentation in Toronto this weekend, before heading to San Sebastian as the closing film, and Deadline can unveil the trailer. Set in B لین است. این گروه به دریاچه کومو در ایتالیا سفر می کنند. چیزی که قرار بود یک دیدار خانوادگی عاشقانه باشد به سرعت به درام تبدیل می شود. گروه اصلی دوستان بزرگتر شده اند و به نظر می رسد برخی از مشکلات گذشته را پشت سر گذاشته اند، اما در طول آماده سازی برای عروسی، ناامیدی های قدیمی دوباره ظاهر می شوند. مایک همچنین وقتی با یک دوست دختر بسیار جوان‌تر ظاهر می‌شود، سروصدا به پا می‌کند، در حالی که به نظر می‌رسد خود روزلین در رابطه‌ای است که کاملاً در مورد آن صحبت نکرده است. یاسمین و وسلی در همان زمان معلوم می شود که یاسمین و وسلی آنقدر که خانواده شان فکر می کنند رابطه بدون مشکلی ندارند. نسل جوان با این باور بزرگ شده‌اند که والدینشان در نهایت ازدواج‌های موفق و محکمی ایجاد کرده‌اند، بدون اینکه بدانند دقیقاً چه درد و رنجی پیش از آن بوده است. در نتیجه، عروسی فرصتی را برای فرزندان و والدین آنها فراهم می کند تا نگاهی انتقادی به روابط خود داشته باشند. چرا دوباره ازدواج کردم؟ اکنون در لیست ۱۰ برتر نتفلیکس، بالاتر از The Whisper Man و Breadwinner، شماره یک است! آیا نمی خواهید چیزی در"}, {"source": "Netflix NL", "title": "Razendpopulaire rechtbankserie verrast op Netflix", "link": "https://www.netflix-nederland.nl/razendpopulaire-rechtbankserie-verrast-op-netflix/", "summary": "Er gaat niets boven een toffe rechtbankserie! Toch? Tóch? En als we het over rechtbankseries hebben, dan is Matlock toch wel een begrip. Er zijn twee Matlocks , waarvan er nu eentje naar Netflix komt. Rechtbankserie Matlock Eerst eventjes een stukje uitleg: in 1986 kwam het allereerste seizoen van het originele Matlock uit, en die serie liep tot 1995. In 2024 ging een moderne herinterpretatie van die show in première op de Amerikaanse zender CBS, géén vervolg waarin het verhaal van Ben Matlock wordt voortgezet. Die herinterpretatie is nu ingelijfd door Netflix. Matlock (de versie waar we het over hebben) is een Amerikaanse juridische dramaserie uit 2024, met Kathy Bates als Madeline Matty Matlock. Ze is een briljante advocate van in de zeventig die na een lange afwezigheid weer aan de slag gaat bij een prestigieus advocatenkantoor in New York. Matty lijkt op het eerste gezicht een vriendelijke, wat ouderwetse vrouw die niet helemaal thuishoort in de moderne advocatenwereld. Haar collega’s en tegenstanders onderschatten haar daardoor regelmatig. In werkelijkheid is ze bijzonder scherp en weet ze haar onschuldige uitstraling slim te gebruiken om informatie te verzamelen en rechtszaken te winnen. Verborgen agenda De serie draait niet alleen om de juridische zaken die ze samen met haar collega’s behandelt. Matty heeft namelijk ook een verborgen persoonlijke agenda en is niet zomaar bij het kantoor komen werken. Langzaam wordt duidelijk dat ze op zoek is naar antwoorden over iets uit haar verleden. Daarnaast speelt de onderlinge dynamiek op het kantoor een belangrijke rol. Matty moet het vertrouwen winnen van haar collega’s, terwijl ze tegelijkertijd haar geheimen verborgen probeert te houden. Op IMDb scoort Matlock een 7,5 als rapportcijfer en dat is natuurlijk helemáál niet slecht. Hieronder kun je de trailer checken. Het is nog niet helemaal duidelijk wanneer Matlock precies te zien zal zijn op Netflix in Nederland. Binnenkort . Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep The post Razendpopulaire rechtbankserie verrast op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-10T09:41:47+00:00", "hash": "b2b393c6b5a6fb16", "title_fa": "غافلگیری سریال های دادگاهی بسیار محبوب در نتفلیکس", "summary_fa": "هیچ چیز مثل یک سریال دادگاه عالی نیست! درسته؟ درسته؟ و وقتی در مورد سریال های دادگاه صحبت می کنیم، متلوک نامی آشناست. دو Matlock وجود دارد که یکی از آنها اکنون به نتفلیکس می آید. سریال دادگاه Matlock ابتدا توضیحی سریع: اولین فصل سریال اصلی Matlock در سال 1986 منتشر شد و این سریال تا سال 1995 ادامه داشت. در سال 2024، یک تفسیر مجدد مدرن از آن نمایش در کانال آمریکایی CBS به نمایش درآمد، نه دنباله‌ای که داستان بن متلاک را ادامه دهد. این تفسیر مجدد اکنون توسط نتفلیکس گنجانده شده است. Matlock (نسخه ا 26-09-09T20:51:23+00:00", "hash": "988f6ead03cc95cf", "title_fa": "اولین خاطرات بوتسی کالینز Funked Around، Found Out نام دارد", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان بوتسی کالینز اولین خاطرات خود را اعلام کرده است، که در 23 مارس 2027 عرضه می شود. نوشته شده با مورخ فرهنگ پاپ، Caseen Gaines، با عنوان مناسب Funked Around، Found Out ردپای 74 ساله فانک 5 ساله را دنبال می کند. این کتاب به بررسی این موضوع می‌پردازد که چگونه گیتاریست باس متولد سینسیناتی – همراه با برادرش، فلپس «کت‌فیش» کالینز – به‌عنوان پیس‌میکرز شروع به کار کردند، به گروه جیمز براون به‌عنوان گروه جی‌بی پیوستند و در نهایت برای نواختن با گروه پارلمان-فنکادلیک جورج کلینتون جدا شدند. فراتر از نکات برجسته شغلی، Funked Around، Found Out نوید برخی چیزهای بی مزه را می دهد، مانند زمانی که کالینز توسط یکی از اعضای خانواده مافیای سیاه فلوریدا پس از یک سخنرانی یک شبه هدف قرار گرفت، و حادثه ای که LAPD پارلمان-Funkadelic را با محکومان فراری اشتباه گرفت و یک \"جستجوی دقیق حفره\" انجام داد. این کتاب همچنین شامل جزئیاتی در مورد دوستی گهگاه چالش برانگیز کالینز با کلینتون و رابطه پر سر و صدای او با مربی جیمز براون است که به طور معروف او و سایر اعضای JB را جریمه کرد، زیرا آنها مطابق با استانداردهای او بازی نکردند. برای تکمیل آن، Funked Around شامل یک پیشگفتار «بد بو» از دوست و همکار قدیمی کالینز اسنوپ داگ است. نوازنده باس در بیانیه ای می نویسد: کتاب \"معامله مستقیم و واقعی\" است. \"اگر دروغ می گویم، دارم می میرم\" و هنوز برای رفتن آماده نیستم.\""}, {"source": "Rolling Stone", "title": "Eric Church Drops His Own ‘Turn the Page’ With New Piano Rocker ‘On the Road’", "link": "https://www.rollingstone.com/music/music-country/eric-church-on-the-road-song-1235624409/", "summary": "On his latest single — a Church solo write — the country renegade takes stock of the places and stages that have made up a career", "date_str": "2026-09-10T14:16:01+00:00", "hash": "842663ba45c3db68", "title_fa": "اریک چرچ آهنگ خود را با آهنگ Turn the Page با نوکر پیانو جدید On the Road رها کرد", "summar
