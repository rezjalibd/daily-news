اهدانه برای بررسی و تأیید مدارک هویتی مشتریان خود استفاده می شود. این اخطار اولین اعتراف شرکت مبنی بر هک شدن آن است. این شرکت هفته گذشته گفت که در حال بررسی یک حادثه است، اما هنوز نفوذی را تایید نکرده است. IDScan در اطلاعیه خود اعلام کرد که اطلاعاتی را در تاریخ 1 سپتامبر یا حدوداً در مورد ادعای هک دریافت کرده است، در همان روزی که روزنامه‌نگار مستقل امنیت سایبری برایان کربس برای اولین بار گزارش نقض داده در IDScan را گزارش کرد."}, {"source": "TechCrunch Main", "title": "Snapchat takes aim at Partiful with new event-planning features", "link": "https://techcrunch.com/2026/09/10/snapchat-takes-aim-at-partiful-with-new-event-planning-features/", "summary": "Snapchat says the new features can be used to organize everything from birthday celebrations and sporting events to study sessions and weekend hangouts.", "date_str": "2026-09-10T13:00:00+00:00", "hash": "4359f8edea466e1e", "title_fa": "Snapchat با ویژگی های جدید برنامه ریزی رویداد، Partiful را هدف قرار می دهد", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر بیش از 6 مرحله صنعتی را طی می کنند. 25 درصد تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبارات: KIRILL KUDRYAVTSEV/AFP / برنامه های Getty Images Snapchat با ویژگی های جدید برنامه ریزی رویداد، Partiful را هدف قرار می دهد Aisha Malik ساعت 6:00 PM PDT · 10 سپتامبر 2026، برنامه Snapchat در پنج شنبه راه اندازی شد. برای ایجاد، اشتراک گذاری و مدیریت رویدادهای دنیای واقعی با دوستان. ویژگی های جدید برنامه ریزی رویداد به کاربران امکان می دهد دعوت نامه ها را ارسال و دریافت کنند و جزئیاتی مانند زمان، مکان و شرکت کنندگان را در یک مکان پیگیری کنند. اسنپ ​​چت می گوید که از ویژگی های جدید می توان برای سازماندهی همه چیز از جشن تولد و رویدادهای ورزشی گرفته تا جلسات مطالعه و پاتوق های آخر هفته استفاده کرد. با برنامه‌های اسنپ چت، این شبکه اجتماعی به دنبال پذیرش Partiful است، یک پلتفرم برنامه‌ریزی رویداد و دعوت دیجیتالی محبوب، زیرا کاربران جوان به جای تکیه بر چت‌های گروهی یا رسانه‌های اجتماعی، به برنامه‌های اختصاصی برای سازمان‌دهی گردهمایی‌ها روی می‌آورند. اسنپ ​​چت تنها شرکت فناوری نیست که برنامه های Partiful و سایر برنامه های دعوت را انجام می دهد، زیرا اپل سال گذشته اپلیکیشنی به نام Invites را راه اندازی کرد که به کاربران امکان می دهد برای هر مناسبتی دعوت نامه های سفارشی ایجاد کنند. کاربران اسنپ چت می توانند با افزودن عنوان، انتخاب تاریخ و زمان و دعوت از 200 دوست، رویدادی به نام طرح اسنپ چت ایجاد کنند. سپس دعوت‌نامه‌ها مستقیماً در یک چت یک به یک با هر دوست دعوت شده ارسال می‌شوند. سپس مهمانان می توانند با Going، Maybe یا Can t Go پاسخ دهند."}, {"source": "TechCrunch Main", "title": "Defense tech Mach Industries doubles valuation to $3.7B in 3 months", "link": "https://techcrunch.com/2026/09/10/defense-tech-mach-industries-doubles-valuation-to-3-7b-in-3-months/", "summary": "The buzzy startup raised $600 million in its Series C round.", "date_str": "2026-09-10T13:00:00+00:00", "hash": "1d45ab9558e8732f", "title_fa": "صنایع دفاعی Mach در 3 ماه ارزش خود را به 3.7 میلیارد دلار افزایش می دهد", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر بیش از 6 مرحله صنعتی را طی می کنند. 25% تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه های تصویر مختل کنید: استارتاپ های صنایع Mach فناوری دفاعی Mach Industries در عرض 3 ماه ارزش خود را به 3.7 میلیارد دلار افزایش می دهد جولی بورت 6:00 AM PDT · 10 سپتامبر 2026 یک استارتاپ فناوری دفاعی جدید را در 6 میلیون دلار افزایش داد. این شرکت روز پنجشنبه اعلام کرد که ارزش آن را دو برابر کرده و به 3.7 میلیارد دلار رسانده است. در ژوئن سری C اصلی را معرفی کرد که 300 میلیون دلار با ارزش 1.8 میلیارد دلار بود. سرمایه گذاران در هر دو بخش عبارتند از Ribbit Capital، Infinite Capital، Bedrock Capital و Sequoia. این بدان معناست که این افزایش نشان دهنده یک جهش دو برابری در تنها سه ماه است. دور قبلی نیز افزایش بزرگی داشت: چهار برابر کردن ارزش یک دور 100 میلیون دلاری با ارزش 470 میلیون دلاری که در ژوئن 2025 اعلام شد. ماخ انواع وسایل نقلیه و تسلیحات نظامی بدون سرنشین، از جمله پهپادهای عمودی برخاست و فرود، سیستم های در نظر گرفته شده برای حملات دوربرد و سیستم های ضد پهپاد را تولید می کند. این شرکت یک مرکز تولیدی به مساحت 115000 فوت مربع در دفتر مرکزی خود در هانتینگتون بیچ، کالیفرنیا، با امکانات اضافی در سراسر ایالت راه اندازی می کند. هدف آن این است که سیستم های بسیار یکپارچه ای را می سازد که هزینه کمتری نسبت به پیمانکاران دفاعی فعلی دارند. به گفته این استارتاپ، استارتاپ موتور موشک جامد (SRM) Exquadrum را در یک معامله نقدی و سهام 50 میلیون دلاری در ماه می خریداری کرد و حداقل هشت خریدار بالقوه دیگر را شکست داد."}, {"source": "TechCrunch Main", "title": "European founders and VCs urge lawmakers ‘to get EU Inc right’", "link": "https://techcrunch.com/2026/09/10/european-founders-and-vcs-urge-lawmakers-to-get-eu-inc-right/", "summary": "Amid negotiations for a new EU-wide corporate status, an open letter signed by unicorn founders and investors warns that 'EU Inc.' shouldn’t be watered down.", "date_str": "2026-09-10T12:25:08+00:00", "hash": "865c87ea60f429e8", "title_fa": "بنیانگذاران اروپایی و VCها از قانونگذاران می خواهند که اتحادیه اروپا را به درستی انجام دهند.", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر بیش از 6 مرحله صنعتی را طی می کنند. 25% تخفیف بلیط ها اکنون بازگشت با تقاضای عمومی: تا 300 دلار در هزینه تصویر مختل صرفه جویی کنید اعتبارات: NICOLAS TUCAT/AFP از طریق Getty Images سیاست دولت بنیانگذاران اروپایی و VCها از قانونگذاران می خواهند که شرکت اتحادیه اروپا را به درستی انجام دهند Anna Heim 5:25 AM PDT · 10 سپتامبر 2026، evoware خود را به زودی می تواند دارای مجوزهای جدید کند. فشار بر قانونگذاران را رها نمی کنند. در نامه سرگشاده‌ای که روز پنجشنبه منتشر شد، یک who's who از صحنه استارت‌آپ اروپا تاکید کرد که این وضعیت جدید شرکتی نباید کمرنگ شود. این نامه آخرین مرحله از کمپین اتحادیه اروپا است، جنبشی که خواستار یک اساسنامه شرکت در سراسر اتحادیه اروپا است که به شرکت ها اجازه می دهد تحت یک چارچوب مشترک ادغام شوند و در سراسر بلوک فعالیت کنند. مروجین آن تأییدیه‌های مقامات ارشد اتحادیه اروپا را دریافت کرده‌اند، اما اکنون ابراز نگرانی می‌کنند که در صورت تضعیف ویژگی‌های اصلی آن، قانون نهایی غیرقابل استفاده شود. طبق معمول قانونگذاری اروپا، لابی های ملی مختلفی از جمله دفاتر اسناد رسمی آلمان که انجمن آنها جنبه هایی از پیشنهاد کمیسیون اروپا را مورد انتقاد قرار داده است، وارد گفتگو شده اند. اما مذاکرات همچنان ادامه دارد تا پارلمان و شورای اروپا بر سر متن نهایی به نتیجه برسند و مروجین اتحادیه اروپا به آنچه در خطر است اشاره می کنند. در حالی که حدود 100 روز تا تعطیل شدن موسسات اروپایی برای تعطیلات زمستانی باقی مانده است، این نامه از سیاستگذاران می‌خواهد که این پیشنهاد را حفظ کنند و گفته است که این پتانسیل می‌تواند «بسیاری از اصطکاک و پراکندگی را که همچنان شرکت‌های اروپایی را خنثی می‌کند، باز کردن قفل سرمایه‌گذاری و تحریک موج جدیدی از کارآفرینی"}, {"source": "TechCrunch Main", "title": "US Army places $11M bet on Austin-based GPS alternative Tern", "link": "https://techcrunch.com/2026/09/10/us-army-places-11m-bet-on-austin-based-gps-alternative-tern/", "summary": "Tern has described its tech as \"Google Maps for the battlefield.\"", "date_str": "2026-09-10T12:00:00+00:00", "hash": "080f86e899200fb5", "title_fa": "ارتش ایالات متحده 11 میلیون دلار بر روی GPS جایگزین Tern مستقر در آستین شرط بندی می کند", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر بیش از 6 مرحله صنعتی را طی می کنند. 25 درصد تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در اعتبار تصویر مختل: حمل و نقل ترن ارتش ایالات متحده 11 میلیون دلار بر روی GPS جایگزین مبتنی بر آستین، Tern Sean O Kane شرط بندی می کند 5:00 AM PDT · 10 سپتامبر 2026. Tern مستقر در آستین قراردادی را برنده شد. فن آوری قرارداد 11.26 میلیون دلاری باعث می‌شود ارتش از فناوری ناوبری Tern در وسایل نقلیه استفاده کند، اگرچه این استارت‌آپ در مقیاس دقیق استقرار آنچه Google Maps برای میدان جنگ می‌نامد، کاملاً دقیق بود. ارتش در زمانی که اختلالات GPS در حال افزایش است، به ویژه در خاورمیانه و در آسمان بالای اوکراین و روسیه، از ترن استفاده می کند. ایالات متحده گزارش شده است که خود ارتش در حال آزمایش پارازیت GPS بوده است که حتی ممکن است در سقوط مرگبار یک هواپیمای مدواک در اوایل سال جاری نقش داشته باشد. تلاش‌های متعددی از سوی کنگره و رئیس‌جمهور ترامپ (در اولین دوره ریاست‌جمهوری او) برای توسعه فناوری‌های ناوبری انعطاف‌پذیر و غیر GPS برای استفاده نظامی انجام شده است. وسایل نقلیه مدرن هنگام رانندگی انواع داده‌ها را تولید می‌کنند، و کل پشته فناوری ترن حول محور استفاده از برخی از این اطلاعات برای حرکت بدون GPS است."}, {"source": "TechCrunch Main", "title": "Automattic’s board forces CEO Matt Mullenweg into leave of absence", "link": "https://techcrunch.com/2026/09/09/automattics-board-forces-ceo-matt-mullenweg-into-leave-of-absence/", "summary": "Mullenweg said in a company Slack message that it was against his will.", "date_str": "2026-09-09T23:14:29+00:00", "hash": "321344e878ca5997", "title_fa": "هیئت مدیره Automattic، مدیرعامل مت مولنوگ را مجبور به مرخصی می کند", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر بیش از 6 مرحله صنعتی را طی می کنند. 25% تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار در هزینه تصویر مختل صرفه جویی کنید اعتبارات: Kimberly White/Getty Images for TechCrunch Apps هیئت مدیره Automattic مدیر عامل شرکت Matt Mullenweg را مجبور به مرخصی جولی بورت سارا پرز 4:14 بعد از ظهر به وقت PDT · 9 سپتامبر، Matt 20، Automatticer و Matt 20، 6 سپتامبر از Mullenweg تاسیس شد. بر اساس یک پیام Slack که توسط TechCrunch مشاهده شده است، که بیشتر به عنوان شرکت مادر WordPress.com شناخته می شود، بر خلاف میل خود توسط هیئت مدیره خود مرخصی گرفته است. اوایل چهارشنبه، مولنوگ در یک کانال Slack که برای همه کارمندان قابل مشاهده است، پست کرد که مدیر مالی شرکت، مارک دیویس، با دیگر اعضای هیئت مدیره آن دانوودی، تونی اشنایدر و سو دکر برای رای دادن به مرخصی استحقاقی مولنوگ توطئه کرده است. و بزرگترین خبر: فردا نمی توانم [جلسه] را برگزار کنم. مارک دیویس با Ann Dunwoody، @Toni و @Sue Decker پشت سر من توطئه کرده است و آنها رای دادند که من را به مرخصی با حقوق ببخشند. من به آن رای منفی دادم. برای مارک و همه شما بهترین ها را آرزو می کنم. برای شفاف سازی، مارک دیویس به عنوان مدیرعامل موقت انتخاب شد. من قطعنامه را 50 دقیقه قبل از شروع جلسه دریافت کردم و بارها درخواست زمان برای بررسی آن توسط وکیل مستقل حقوقی حتی چند ساعته کردم که رد شد. یک پیام Slack به جامعه منبع باز WordPress.org از سوی مدیر اجرایی پروژه، مری هابارد، نیز تغییر وضعیت مولنوگ در شرکت تجاری را تایید کرد. با این حال، هابارد گفت که WordPress.org تحت تأثیر قرار نگرفته است. مت رهبر پروژه وردپرس و من مدیر اجرایی وردپرس باقی می ماند. او"}, {"source": "TechCrunch Main", "title": "Apple’s new CEO is reviving a Steve Jobs strategy from 25 years ago", "link": "https://techcrunch.com/2026/09/09/apples-new-ceo-is-reviving-a-steve-jobs-strategy-from-25-years-ago/", "summary": "John Ternus made the case in his first keynote as Apple CEO that the iPhone isn't going anywhere.", "date_str": "2026-09-09T20:58:09+00:00", "hash": "9ceab11c7d5f78b0", "title_fa": "مدیرعامل جدید اپل در حال احیای استراتژی استیو جابز از 25 سال پیش است", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر بیش از 6 مرحله صنعتی را طی می کنند. 25% تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در اعتبارات تصویر مختل: آدام گری/بلومبرگ/سخت افزار Getty Images مدیر عامل جدید اپل در حال احیای استراتژی استیو جابز از 25 سال پیش تیم دی چانت 1:58 PM PDT · 9 سپتامبر 2026، شما می دانید که Apple می خواهد آیفون می خواهد. هر جایی ترنوس روز چهارشنبه در اولین سخنرانی اصلی خود به عنوان مدیر عامل، وزن خود را پشت سر این دستگاه ارجمند گذاشت و آن را محکم در مرکز استراتژی محصول اپل برای عصر هوش مصنوعی قرار داد. هیچ محصولی در دنیا وجود ندارد که بهتر از آیفون طراحی شده باشد تا مرکز هوشمند شخصی شما باشد.» این با رویکرد تیم کوک، مدیر عامل سابق، که بارها و بارها تلاش کرد تا وال استریت را متقاعد کند که اپل چیزی فراتر از آیفون است، در تضاد است."}, {"source": "Ars Technica", "title": "Artemis II commander and pilot become NASA's first astronaut emeriti", "link": "https://arstechnica.com/space/2026/09/artemis-ii-commander-and-pilot-become-nasas-first-astronaut-emeriti/", "summary": "The commander and pilot of NASA's Artemis II mission have gained a new distinction five months after splashing down from the Moon: They're not fully retiring from the space agency. Reid Wiseman and Victor Glover are the first astronauts to join NASA's emeritus program , enabling them to continue to support the work being done at Johnson Space Center in Houston. They will remain available to train and mentor the current workforce while still being able to pursue employment and opportunities outside of NASA. \"I have asked NASA ... to not use the term 'retire' as much, but technically emeritus is a retirement program,\" Glover told collectSPACE.com on Wednesday. \"It's something we have typically done for scientists when they have groundbreaking research, and they want to go back to academia to teach or to research and publish.\" Read full article Comments", "date_str": "2026-09-10T11:30:42+00:00", "hash": "69e15659b593e840", "title_fa": "فرمانده و خلبان آرتمیس دوم اولین فضانورد بازنشسته ناسا شد", "summary_fa": "فرمانده و خلبان ماموریت آرتمیس ۲ ناسا، پنج ماه پس از سقوط از ماه، به تمایز جدیدی دست یافتند: آنها به طور کامل از آژانس فضایی بازنشسته نمی شوند. رید وایزمن و ویکتور گلاور اولین فضانوردانی هستند که به برنامه افتخاری ناسا ملحق شدند و آنها را قادر می سازد به حمایت از کارهای انجام شده در مرکز فضایی جانسون در هیوستون ادامه دهند. آنها همچنان در دسترس خواهند بود تا نیروی کار فعلی را آموزش دهند و راهنمایی کنند، در حالی که همچنان می توانند شغل و فرصت های خارج از ناسا را ​​دنبال کنند. گلاور روز چهارشنبه به collectSPACE.com گفت: «من از ناسا خواسته‌ام... از واژه بازنشستگی زیاد استفاده نکند، اما از نظر فنی بازنشستگی یک برنامه بازنشستگی است. این کاری است که ما معمولاً برای دانشمندان انجام می‌دهیم، زمانی که آنها تحقیقات پیشگامانه دارند، و می‌خواهند برای تدریس به دانشگاه بازگردند یا برای تحقیق و انتشار.» نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Four groups caught using the same Chrome and Windows exploit kit", "link": "https://arstechnica.com/information-technology/2026/09/4-groups-caught-using-the-same-chrome-and-windows-exploit-kit/", "summary": "A nearly identical exploit kit that targets critical vulnerabilities in both Chromium-based browsers and older versions of Windows is being actively used by at least four hacking groups, some of which have ties to the Chinese government. Researchers from security firm Proofpoint said Wednesday that BlueMoon, the name they gave to the kit, chains three vulnerabilities together so the attackers using it can install malware of their choice. BlueMoon exploits two Chromium vulnerabilities and one in the kernel of Windows 10 (Oct. 2018 Update), Windows Server 2019, Windows 10 2004, Windows Server 2022, and the initial release of Windows 11. All three vulnerabilities have received patches in the past 24 hours. Deployed rapidly, widely shared The attacks lacked the stealth found in many campaigns. More often, hackers want to exploit newly discovered vulnerabilities sparingly to lengthen their longevity. Proofpoint hypothesized that one reason for the widely used and visible exploit chain was to take advantage of a “patch gap” in the Chromium supply chain, which spans the time a patch is available from developers and the time that patch is incorporated into browsers such as Chrome and Edge. Another likely contributor was the use of AI, which can often spot vulnerabilities faster than discovery performed solely by humans. Read full article Comments", "date_str": "2026-09-09T20:55:02+00:00", "hash": "650db1796be25e32", "title_fa": "چهار گروه با استفاده از کیت بهره برداری مشابه کروم و ویندوز دستگیر شدند", "summary_fa": "یک کیت اکسپلویت تقریباً یکسان که آسیب‌پذیری‌های حیاتی را هم در مرورگرهای مبتنی بر Chromium و هم در نسخه‌های قدیمی‌تر ویندوز هدف قرار می‌دهد، به طور فعال توسط حداقل چهار گروه هک استفاده می‌شود که برخی از آنها با دولت چین ارتباط دارند. محققان شرکت امنیتی Proofpoint روز چهارشنبه گفتند که BlueMoon، نامی که برای کیت گذاشته‌اند، سه آسیب‌پذیری را به هم متصل می‌کند تا مهاجمانی که از آن استفاده می‌کنند بتوانند بدافزار مورد نظر خود را نصب کنند. BlueMoon از دو آسیب‌پذیری Chromium و یک آسیب‌پذیری در هسته ویندوز 10 (به‌روزرسانی اکتبر 2018)، ویندوز سرور 2019، ویندوز 10 2004، ویندوز سرور 2022 و انتشار اولیه ویندوز 11 سوء استفاده می‌کند. هر سه آسیب‌پذیری در ساعت‌های گذشته وصله‌هایی دریافت کرده‌اند. به سرعت مستقر شد، به طور گسترده به اشتراک گذاشته شد. اغلب، هکرها می‌خواهند از آسیب‌پذیری‌های تازه کشف‌شده به‌طور کم برای افزایش طول عمرشان سوءاستفاده کنند. پروفپوینت این فرضیه را مطرح کرد که یکی از دلایل زنجیره بهره برداری پرکاربرد و قابل مشاهده، استفاده از یک \"شکاف وصله\" در زنجیره تامین Chromium است که مدت زمانی را در بر می گیرد که یک پچ در دسترس توسعه دهندگان قرار می گیرد و زمانی که آن وصله در مرورگرهایی مانند کروم و اج گنجانده می شود. یکی دیگر از عوامل احتمالی استفاده از هوش مصنوعی بود که اغلب می‌تواند آسیب‌پذیری‌ها را سریع‌تر از کشفی که صرفاً توسط انسان انجام می‌شود شناسایی کند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Europe may finally have found a space entrepreneur who is meeting the moment", "link": "https://arstechnica.com/space/2026/09/as-europe-flounders-in-space-a-rising-french-star-may-show-the-way/", "summary": "All of a sudden, French entrepreneur Hèlene Huby is seemingly everywhere. This week she is serving as one of two envoys, alongside astronaut Thomas Pesquet, at a high-profile International Space Summit convened by French President Emmanuel Macron. The government's website for the event describes her as chief executive of \"the fastest-growing space company in Europe.\" Also this week, that firm, The Exploration Company, announced a significant capital raise of $450 million in Series C funding. Although not spectacular by the standards of some US space businesses, this is the largest-ever Series C funding round by a Europe-based space company, and likely the largest funding round ever raised by a female-led company in Europe. Read full article Comments", "date_str": "2026-09-09T20:27:40+00:00", "hash": "4922572a7c1708d6", "title_fa": "اروپا ممکن است بالاخره یک کارآفرین فضایی پیدا کرده باشد که در حال ملاقات است", "summary_fa": "به طور ناگهانی، هلن هوبی، کارآفرین فرانسوی، ظاهراً همه جا حضور دارد. او این هفته به عنوان یکی از دو فرستاده، همراه با فضانورد توماس پسکت، در اجلاس بین المللی فضایی که توسط امانوئل مکرون، رئیس جمهور فرانسه تشکیل شده بود، خدمت می کند. وب سایت دولت برای این رویداد او را به عنوان مدیر اجرایی \"سریع ترین شرکت فضایی در اروپا در حال رشد\" توصیف می کند. همچنین در این هفته، آن شرکت، The Exploration Company، افزایش سرمایه قابل توجهی را به مبلغ 450 میلیون دلار در بودجه سری C اعلام کرد. اگرچه با استانداردهای برخی از مشاغل فضایی ایالات متحده دیدنی نیست، اما این بزرگترین دور سرمایه گذاری سری C توسط یک شرکت فضایی مستقر در اروپا است و احتمالاً بزرگترین دور سرمایه گذاری است که تا کنون توسط یک شرکت تحت رهبری زنان در اروپا جمع آوری شده است. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Six Chinese AI firms accused of aggressively copying US frontier models", "link": "https://arstechnica.com/tech-policy/2026/09/six-chinese-ai-firms-accused-of-aggressively-copying-us-frontier-models/", "summary": "The United States has now named six Chinese AI firms accused of waging industrial-scale attacks distilling US frontier AI model capabilities and perhaps sparing billions in Chinese development costs. In a joint release Tuesday, the National Security Agency (NSA), Cybersecurity and Infrastructure Security Agency (CISA), and Federal Bureau of Investigation (FBI) alleged that DeepSeek, Moonshot AI, Alibaba, MiniMax, StepFun, and Z.AI have been attacking US models since at least late 2024. The firms “likely” acted with “Chinese government awareness” when extracting capabilities from US models, including variants of Claude, GPT, Gemini, and Grok, agencies said. “China-based AI companies that conduct industrial-scale distillation against US AI models see significantly shorter AI development timelines and reduced financial expenditures in training a frontier model,” agencies said. Read full article Comments", "date_str": "2026-09-09T20:06:28+00:00", "hash": "b9f7f1a4338a3c93", "title_fa": "شش شرکت چینی هوش مصنوعی متهم به کپی برداری تهاجمی از مدل های مرزی ایالات متحده شدند", "summary_fa": "ایالات متحده اکنون نام شش شرکت چینی هوش مصنوعی را معرفی کرده است که متهم به انجام حملاتی در مقیاس صنعتی و تقطیر قابلیت های مدل هوش مصنوعی مرزی ایالات متحده و شاید صرفه جویی میلیاردها دلار در هزینه های توسعه چین شده اند. آژانس امنیت ملی (NSA)، آژانس امنیت سایبری و امنیت زیرساخت (CISA) و دفتر تحقیقات فدرال (FBI) در یک انتشار مشترک ادعا کردند که DeepSeek، Moonshot AI، Alibaba، MiniMax، StepFun و Z.AI حداقل از اواخر سال 2024 به مدل‌های آمریکایی حمله کرده‌اند. آژانس‌ها گفتند که شرکت‌ها «احتمالاً» با «آگاهی دولت چین» هنگام استخراج قابلیت‌ها از مدل‌های آمریکایی، از جمله انواع Claude، GPT، Gemini، و Grok عمل کردند. آژانس‌ها گفتند: «شرکت‌های هوش مصنوعی مستقر در چین که تقطیر در مقیاس صنعتی را در برابر مدل‌های هوش مصنوعی ایالات متحده انجام می‌دهند، زمان‌بندی توسعه هوش مصنوعی به‌طور قابل‌توجهی کوتاه‌تر و کاهش هزینه‌های مالی در آموزش یک مدل مرزی می‌بینند». نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Apple's long-rumored foldable becomes reality with the $2,000 iPhone Duo", "link": "https://arstechnica.com/gadgets/2026/09/apples-long-rumored-foldable-becomes-reality-with-the-2000-iphone-duo/", "summary": "Apple ended today's hardware event with one of its classic \"One more thing\" reveals. Some smartphone makers have been offering foldable phones for the better part of a decade, but Apple has now joined the fray with the iPhone Duo after years of speculation . This device is undeniably the most capable iPhone ever, as well as the most expensive. It's not as spendy as many expected, though, starting at $1,999. That's in the same range as foldables from Google and Samsung. An iPad in your pocket The iPhone Duo would have looked like a totally fresh take on the foldable design a few months ago, but Samsung has made waves with the Galaxy Z Fold 8 . Like that phone, the iPhone Duo has a wider, shorter chassis. Apple prefaced its reveal with a denunciation of foldables that open into a square aspect ratio. While that shape can accommodate two portrait apps side by side pretty well, it's bad at almost everything else, stretching single apps awkwardly and leaving videos with gargantuan black bars. Read full article Comments", "date_str": "2026-09-09T19:42:00+00:00", "hash": "e3814cd47c6ff237", "title_fa": "گوشی تاشو اپل که مدت ها شایعه شده بود با آیفون 2000 دلاری به واقعیت تبدیل شد", "summary_fa": "اپل رویداد سخت افزاری امروز را با یکی از رونمایی های کلاسیک \"One more thing\" به پایان رساند. برخی از سازندگان گوشی‌های هوشمند برای بخش عمده‌ای از یک دهه، گوشی‌های تاشو عرضه می‌کنند، اما اپل پس از سال‌ها گمانه‌زنی، اکنون با آیفون Duo به این رقابت پیوسته است. این دستگاه بدون شک توانمندترین آیفون تاریخ و همچنین گران ترین است. اگرچه آنقدرها هم که خیلی ها انتظار داشتند پرهزینه نیست و از 1999 دلار شروع می شود. این در همان محدوده تاشوهای گوگل و سامسونگ است. یک آی‌پد در جیب شما iPhone Duo چند ماه پیش ظاهری کاملاً تازه از طراحی تاشو به نظر می‌رسید، اما سامسونگ با Galaxy Z Fold 8 دست به کار شده است. مانند آن گوشی، iPhone Duo نیز دارای شاسی پهن تر و کوتاه تر است. اپل مقدمه رونمایی خود را با تقبیح صفحه‌های تاشو که به نسبت ابعاد مربعی باز می‌شوند، معرفی کرد. در حالی که این شکل به خوبی می‌تواند دو برنامه پرتره را در کنار هم قرار دهد، تقریباً در هر چیز دیگری بد است، برنامه‌های تک را به طرز عجیبی کشیده و ویدیوها را با نوارهای سیاه غول‌پیکر باقی می‌گذارد. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "When it comes to Beatles references, scientists can't let it be", "link": "https://arstechnica.com/science/2026/09/scientists-really-love-to-reference-the-beatles-in-their-work/", "summary": "Scientists have an indisputable playful side, evidenced by frequent allusions to popular culture in their research publications. That includes popular song lyrics. And the most popular musical group, in terms of how frequently their songs and lyrics appear in the scientific literature, is The Beatles, according to a new paper published in the journal PLoS ONE. “Some of these are genuinely brilliant,\" said co-author Gabriel Budel of Delft University of Technology in the Netherlands. \"'The lung and winding road' is a paper on Long COVID that changes one vowel of the more than 3,000 references they found to The Beatles. 'Here comes the SU(N)' turns 'Here Comes the Sun' into a quantum computing paper about mathematical groups. Someone was having a very good day at their desk.” Back in 2014, scientists at the Karolinska Institute in Sweden revealed that they had been deliberately inserting Bob Dylan lyrics into their papers as part of a long-running bet, starting with a 1997 Nature review entitled \"Nitric Oxide and inflammation: The answer is blowing in the wind.\" That resulted in a 2015 study on whether Dylan lyrics appeared elsewhere in the biomedical literature; the most frequently referenced were \"The Times They Are A'Changin'\" and \"Blowing in the Wind.\" Read full article Comments", "date_str": "2026-09-09T19:31:55+00:00", "hash": "edc747cb27ff1de0", "title_fa": "وقتی صحبت از ارجاعات بیتلز به میان می آید، دانشمندان نمی توانند اجازه دهند", "summary_fa": "دانشمندان جنبه بازیگوشی غیرقابل انکاری دارند که با اشارات مکرر به فرهنگ عامه در نشریات تحقیقاتی خود نشان می دهد. که شامل متن آهنگ محبوب است. بر اساس مقاله جدیدی که در مجله PLoS ONE منتشر شده است، محبوب ترین گروه موسیقی، از نظر تعداد دفعات حضور آهنگ ها و اشعار آنها در ادبیات علمی، The Beatles است. گابریل بودل از دانشگاه صنعتی دلفت در هلند گفت: «برخی از اینها واقعاً درخشان هستند. \"ریه و جاده پر پیچ و خم\" مقاله ای در مورد کووید طولانی است که یک مصوت از بیش از 3000 مرجعی را که آنها به بیتلز پیدا کردند تغییر می دهد. \"اینجا SU(N) می آید\" \"اینجا خورشید می آید\" را به یک مقاله محاسباتی کوانتومی درباره گروه های ریاضی تبدیل می کند. یک نفر پشت میزش روز خیلی خوبی را سپری می کرد.» در سال 2014، دانشمندان مؤسسه کارولینسکا در سوئد فاش کردند که آنها عمداً اشعار باب دیلن را به عنوان بخشی از یک شرط بندی طولانی در مقالات خود وارد کرده اند، که با بررسی سال 1997 Nature با عنوان \"اکسید نیتریک و التهاب: پاسخ در باد می وزد\" شروع شد. این منجر به یک مطالعه در سال 2015 در مورد اینکه آیا اشعار دیلن در جای دیگری از ادبیات زیست پزشکی ظاهر شده است یا خیر. بیشترین ارجاع به آنها «زمان هایی که آچانگین هستند» و «وزیدن در باد» بودند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Lawsuit: Amazon refused to give pregnant workers bathroom breaks and chairs", "link": "https://arstechnica.com/tech-policy/2026/09/lawsuit-amazon-refused-to-give-pregnant-workers-bathroom-breaks-and-chairs/", "summary": "Amazon discriminated against pregnant warehouse employees by denying accommodations like bathroom breaks and the option to sit while working, according to a lawsuit filed yesterday by four women who worked for Amazon while pregnant. The lawsuit is a class-action complaint that seeks to represent Amazon workers throughout the US. \"Plaintiffs Willamina Barclay, Kristina Green, Jennifer Hatch, and Dazaria Parks were formerly Amazon warehouse employees,\" said the lawsuit filed in US District Court for the Eastern District of New York. \"All four became pregnant. All four asked Amazon for basic pregnancy-related accommodations so they could keep doing their jobs. Amazon denied them basic modifications the law recognizes pregnant workers regularly need, even in uncomplicated pregnancies: Bathroom breaks. An extra 15-minute break. Sitting instead of standing.\" The lawsuit said the four plaintiffs were unlawfully terminated from jobs at Amazon facilities in New York between April 2025 and July 2026. After the plaintiffs \"took medically necessary breaks or absences to get off their feet, visit the doctor, or go to the emergency room, they were punished,\" the lawsuit said. \"Amazon deducted their limited bank of un paid time off. Soon enough, they had depleted that limited bank of 'unpaid time off,' and Amazon threatened to terminate them.\" Read full article Comments", "date_str": "2026-09-09T19:09:20+00:00", "hash": "79607c89668f4bdf", "title_fa": "شکایت: آمازون از دادن استراحت و صندلی به کارگران باردار خودداری کرد", "summary_fa": "بر اساس شکایتی که دیروز توسط چهار زن که در دوران بارداری برای آمازون کار می کردند، آمازون با رد اقامتگاه هایی مانند استراحت در حمام و گزینه نشستن در حین کار، علیه کارکنان انبار باردار تبعیض قائل شد. این شکایت یک شکایت دسته جمعی است که به دنبال نمایندگی از کارگران آمازون در سراسر ایالات متحده است. در دادخواستی که در دادگاه منطقه ای ایالات متحده برای ناحیه شرقی نیویورک تنظیم شده است، آمده است: «شاکیان ویلامینا بارکلی، کریستینا گرین، جنیفر هچ و دازاریا پارکس قبلاً کارمندان انبار آمازون بودند. هر چهار نفر باردار شدند. هر چهار نفر از آمازون درخواست کردند که امکانات اولیه مربوط به بارداری را داشته باشند تا بتوانند به کار خود ادامه دهند. آمازون تغییرات اساسی را که قانون تشخیص می دهد که کارگران باردار به طور مرتب نیاز دارند، حتی در بارداری های بدون عارضه، رد کرد: استراحت در حمام. 15 دقیقه استراحت اضافی. نشستن به جای ایستادن.\" در این دادخواست آمده است که چهار شاکی به طور غیرقانونی از کار در تأسیسات آمازون در نیویورک بین آوریل 2025 تا ژوئیه 2026 اخراج شده اند. پس از اینکه شاکیان \"وقفه های پزشکی یا غیبت های ضروری برای بلند شدن از پا، ملاقات با پزشک یا رفتن به اتاق اورژانس را انجام دادند، آنها با \"زمان محدود از بانک\" مجازات شدند. به زودی، آنها آن بانک محدود «مرخصی بدون پرداخت» را تخلیه کردند و آمازون تهدید کرد که آنها را فسخ خواهد کرد.» نظرات مقاله کامل را بخوانید."}, {"source": "Ars Technica", "title": "Apple debuts $129 AirPods 5 with better noise cancellation and transparency mode", "link": "https://arstechnica.com/gadgets/2026/09/apple-debuts-129-airpods-5-with-better-noise-cancellation-and-transparency-mode/", "summary": "Apple has debuted the new AirPods 5 with improved active noise cancellation and sound quality—aiming to provide improved listening and user features at a lower launch price than the predecessor AirPods 4. The newest AirPods will go on sale for $129 in stores starting on September 18, according to an Apple press release accompanying the company’s “Surprise and Shine” event. Customers can also purchase AirPods 5 with a wireless charging case that provides longer battery life and on-stem volume control for $149. Preorders are already open. This is looking like a solid deal compared to the predecessor AirPods 4. The older AirPods debuted in 2024 with a starting price of $129, but users had to pay $179 for the version with active noise cancellation. Read full article Comments", "date_str": "2026-09-09T18:58:24+00:00", "hash": "fa63d3c9bdf9be8f", "title_fa": "اپل ایرپاد 5 129 دلاری را با قابلیت حذف نویز و حالت شفافیت بهتر معرفی کرد", "summary_fa": "اپل ایرپاد 5 جدید را با حذف نویز فعال و کیفیت صدا بهبود یافته معرفی کرده است – با هدف ارائه بهبود گوش دادن و ویژگی‌های کاربر با قیمت کمتری نسبت به AirPods 4 قبلی. طبق بیانیه مطبوعاتی اپل که همراه با شرکت Shineur و “S” است، جدیدترین AirPods با قیمت 129 دلار از 18 سپتامبر در فروشگاه‌ها به فروش می‌رسد. مشتریان همچنین می‌توانند AirPods 5 را با کیس شارژ بی‌سیم که عمر باتری و کنترل صدا روی پایه را بیشتر می‌کند، با قیمت 149 دلار خریداری کنند. پیش‌سفارش‌ها از قبل باز شده است. در مقایسه با AirPods 4 قبلی، این یک معامله محکم به نظر می رسد. ایرپادهای قدیمی در سال 2024 با قیمت اولیه 129 دلار عرضه شدند، اما کاربران مجبور بودند برای نسخه با حذف نویز فعال 179 دلار بپردازند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Apple starts preorders for Watch Series 12, Ultra 4 with new Health Sensing System", "link": "https://arstechnica.com/gadgets/2026/09/apple-watch-series-12-ultra-4-have-wearables-most-accurate-heart-rate-sensing/", "summary": "Apple announced the Watch Series 12 and Ultra 4 today. Both include a new \"Health Sensing System\" and S11 chip that give the devices the “most accurate heart rate sensing in a wearable,\" Apple claimed during its fall event . Apple's depiction of the S11 chip. Credit: Apple Both watches will use the new S11 chip alongside the new \"Health Sensing System,\" allowing the watches to deliver higher-frequency heart rate and heart rate variability (HRV) measurements than prior Apple Watches. The Watch Series 12 and Ultra 4 (pictured) will run watchOS 27. Read full article Comments", "date_str": "2026-09-09T18:47:07+00:00", "hash": "4a5886a058cd37c0", "title_fa": "اپل پیش‌فروش ساعت‌های سری 12، اولترا 4 را با سیستم تشخیص سلامت جدید آغاز می‌کند", "summary_fa": "اپل امروز ساعت‌های سری ۱۲ و اولترا ۴ را معرفی کرد. اپل در جریان رویداد پاییزی خود ادعا کرد که هر دو شامل یک \"سیستم سنجش سلامت\" و تراشه S11 هستند که \"دقیق ترین سنجش ضربان قلب را در یک ابزار پوشیدنی\" به دستگاه ها می دهد. تصویر اپل از تراشه S11. اعتبار: اپل هر دو ساعت از تراشه جدید S11 در کنار «سیستم سنجش سلامت» جدید استفاده خواهند کرد، که به ساعت‌ها امکان می‌دهد تا اندازه‌گیری‌های ضربان قلب و تغییرات ضربان قلب (HRV) را با فرکانس بالاتری نسبت به ساعت‌های قبلی اپل ارائه دهند. Watch Series 12 و Ultra 4 (تصویر) از watchOS 27 استفاده می کنند. مقاله کامل را بخوانید نظرات"}, {"source": "Ars Technica", "title": "The quick guide to fall vaccines and when you should get them", "link": "https://arstechnica.com/health/2026/09/what-to-know-about-covid-and-flu-shots-as-rfk-jr-s-chaos-drags-on/", "summary": "Labor Day is in the rearview mirror, kids are back to school, and a squall of pumpkin spice is upon us. It's that time again to prepare for the equally inevitable respiratory virus season with annual vaccines. With fervent anti-vaccine activist Robert F. Kennedy Jr. as the country's top health official, it might seem like the rollout of this year's shots could be a disaster. For instance, one of Kennedy's first actions as health secretary last year was to obliterate an ad campaign for flu shots amid a particularly deadly flu season. As we head into this fall, the Centers for Disease Control and Prevention's vaccine advisory committee—which normally sets vaccination recommendations and insurance coverage for the shots—is nonfunctioning. A federal judge ruled in March that the anti-vaccine allies Kennedy installed on the panel were illegally appointed and unfit to serve. All their changes to vaccine policy have been temporarily voided. And meanwhile, Kennedy spent last week trying to obscure the number of babies who died from measles so far this year (it was two, including a newborn). Big picture Despite all of that, the fall vaccine effort is looking like it will likely be somewhat smooth, potentially unremarkable even. The Food and Drug Administration has approved updated flu and COVID-19 shots for this season. Those shots have already begun arriving at pharmacies —in case your pharmacy hasn't already sent you multiple texts and reminders. While there are still some snags for access, it seems like it will be a lot like last year's fall vaccine rollout. Read full article Comments", "date_str": "2026-09-09T18:39:36+00:00", "hash": "e39ec01f49f7ac20", "title_fa": "راهنمای سریع واکسن های پاییزی و زمانی که باید آنها را دریافت کنید", "summary_fa": "روز کارگر در آینه عقب است، بچه‌ها به مدرسه برگشته‌اند، و ادویه کدو تنبل در راه است. این زمان دوباره برای آماده شدن برای فصل ویروس تنفسی به همان اندازه اجتناب ناپذیر با واکسن های سالانه فرا رسیده است. با توجه به رابرت اف کندی جونیور، فعال ضد واکسن، به عنوان مقام ارشد بهداشتی کشور، ممکن است به نظر برسد که عرضه واکسن های امسال می تواند یک فاجعه باشد. به عنوان مثال، یکی از اولین اقدامات کندی به عنوان وزیر بهداشت در سال گذشته، از بین بردن یک کمپین تبلیغاتی برای واکسن آنفولانزا در میان یک فصل آنفولانزای مرگبار بود. با ورود به پاییز امسال، کمیته مشاوره واکسن مراکز کنترل و پیشگیری از بیماری - که معمولاً توصیه‌های واکسیناسیون و پوشش بیمه‌ای را برای واکسن‌ها تعیین می‌کند - کار نمی‌کند. یک قاضی فدرال در ماه مارس حکم داد که متحدان ضد واکسن کندی که در هیئت مدیره نصب کرده بود، به طور غیرقانونی منصوب شده و برای خدمت مناسب نیستند. تمام تغییرات آنها در سیاست واکسن به طور موقت لغو شده است. و در همین حال، کندی هفته گذشته تلاش کرد تا تعداد نوزادانی را که تا کنون در اثر سرخک جان باخته‌اند در سال جاری پنهان کند (از جمله یک نوزاد، دو نوزاد). تصویر بزرگ علی‌رغم همه این‌ها، تلاش برای واکسن پاییزی به نظر می‌رسد که احتمالاً تا حدودی صاف و حتی غیرقابل توجه خواهد بود. سازمان غذا و دارو واکسن های به روز شده آنفولانزا و COVID-19 را برای این فصل تایید کرده است. این عکس‌ها قبلاً به داروخانه‌ها می‌رسند - در صورتی که داروخانه شما قبلاً چندین متن و یادآوری برای شما ارسال نکرده باشد. در حالی که هنوز مشکلاتی برای دسترسی وجود دارد، به نظر می رسد که بسیار شبیه به عرضه واکسن پاییز سال گذشته خواهد بود. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Apple's iPhone 18 Pro adds variable camera aperture and a more powerful chip", "link": "https://arstechnica.com/gadgets/2026/09/apples-iphone-18-pro-adds-variable-camera-aperture-and-a-more-powerful-chip/", "summary": "CUPERTINO, Calif.—Apple's new iPhone 18 Pro is an iterative update that—as usual—focuses heavily on both performance and new camera features. This time around, many of the new camera features are oriented around giving the user more direct control of the image, rather than depending entirely on Apple's computational photography assumptions. As usual, the new iPhone has a new chip. It's called A20 Pro, and it's the first 2 nm chip for the iPhone. It has a 6-core CPU, with two super-cores that are up to 20 percent faster, and four efficiency cores. A 7-core GPU offers up to 40 percent improved performance and increased bandwidth. The A20 Pro also has a new Neural Engine—the machine-learning processor on the system-on-chip—which the company says is basically two Neural Engines on one chip. Read full article Comments", "date_str": "2026-09-09T17:38:53+00:00", "hash": "d13f26067c479cd3", "title_fa": "آیفون 18 پرو اپل دیافراگم متغیر دوربین و تراشه قدرتمندتری را اضافه می کند", "summary_fa": "CUPERTINO، کالیفرنیا—آیفون 18 پرو جدید اپل یک به‌روزرسانی تکراری است که طبق معمول به شدت بر عملکرد و ویژگی‌های دوربین جدید تمرکز دارد. این بار، بسیاری از ویژگی‌های دوربین جدید به جای اینکه کاملاً به فرضیات عکاسی محاسباتی اپل وابسته باشند، حول محور دادن کنترل مستقیم‌تر تصویر به کاربر است. طبق معمول، آیفون جدید دارای یک تراشه جدید است. A20 Pro نام دارد و اولین تراشه 2 نانومتری برای آیفون است. دارای یک CPU 6 هسته ای، با دو هسته فوق العاده که تا 20 درصد سریعتر هستند و چهار هسته بازده. یک GPU 7 هسته ای تا 40 درصد بهبود عملکرد و افزایش پهنای باند را ارائه می دهد. A20 Pro همچنین دارای یک موتور عصبی جدید - پردازنده یادگیری ماشینی در سیستم روی تراشه - است که به گفته شرکت اساساً دو موتور عصبی روی یک تراشه است. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Popular navigation apps unlikely to ditch Mercator maps despite UN resolution", "link": "https://arstechnica.com/gadgets/2026/09/un-correct-the-map-resolution-wont-change-mercator-map-use-in-navigation-apps/", "summary": "Nearly every country represented in the United Nations General Assembly recently voted in favor of promoting world maps that more accurately show the size of various continents. But the UN resolution is unlikely to change how millions of people regularly see versions of 16th-century Mercator maps depicting skewed continent sizes in navigation apps. On September 4, the African-led resolution attracted 164 votes in favor, with six countries abstaining from voting. Only the United States voted to oppose the resolution after describing it as a “radical ideological project,” according to UN News . The non-binding UN resolution does not impose map changes on anyone. Instead, it “encourages governments, schools, international organizations, and technology companies to use the Equal Earth projection and other so-called equal-area maps when relative size matters,” UN News reported. The resolution also encourages teaching about the trade-offs that arise from depicting a spherical planet on a flat map. Read full article Comments", "date_str": "2026-09-09T17:11:46+00:00", "hash": "3c9bba5318d23cec", "title_fa": "برنامه های ناوبری محبوب با وجود قطعنامه سازمان ملل بعید است که نقشه های Mercator را حذف کنند", "summary_fa": "تقریباً تمام کشورهایی که در مجمع عمومی سازمان ملل متحد حضور دارند اخیراً به تبلیغ نقشه‌های جهان که اندازه قاره‌های مختلف را با دقت بیشتری نشان می‌دهند، رأی مثبت دادند. اما بعید است که قطعنامه سازمان ملل تغییری در نحوه مشاهده منظم نسخه‌های نقشه‌های مرکاتور قرن شانزدهمی توسط میلیون‌ها نفر که در برنامه‌های ناوبری اندازه‌های کج‌شده قاره را نشان می‌دهند، تغییر دهد. در 4 سپتامبر، قطعنامه تحت رهبری آفریقا با 164 رای موافق و 6 کشور از رای دادن خودداری کردند. به گزارش UN News، تنها ایالات متحده پس از توصیف آن به عنوان \"پروژه ایدئولوژیک رادیکال\" به مخالفت با این قطعنامه رای داد. قطعنامه غیر الزام آور سازمان ملل تغییر نقشه را بر کسی تحمیل نمی کند. به گزارش UN News، در عوض، «دولت‌ها، مدارس، سازمان‌های بین‌المللی و شرکت‌های فناوری را تشویق می‌کند تا از نقشه‌های زمین برابر و سایر نقشه‌های به‌اصطلاح مساحت برابر در مواقعی که اندازه نسبی اهمیت دارد، استفاده کنند». این قطعنامه همچنین آموزش در مورد مبادلاتی را که از به تصویر کشیدن یک سیاره کروی بر روی یک نقشه مسطح ناشی می شود، تشویق می کند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Anthropic researcher quits with a warning: Self-improving AI could \"kill us all\"", "link": "https://arstechnica.com/ai/2026/09/anthropic-researcher-quits-with-a-warning-self-improving-ai-could-kill-us-all/", "summary": "When a prominent researcher quits a job at a frontier AI lab these days, it's often to pursue a new startup or protest a new business model . But AI researcher Jacob Coxon is using his departure from Anthropic to publicly warn that frontier AI companies are \"gambling with our lives\" with systems that they \"earnestly believe... could kill us all by the end of the decade.\" In a social media thread Tuesday night , Coxon said that this existential risk is inherent not so much in today's models but more in the impending prospect of \"self-improving superintelligence\" creating \"superhuman systems that can hack anything, revolutionize any field overnight, and acquire real power and resources.\" Others working on these models have either not \"internalized the civilizational stakes\" or believe that they need to \"speedrun\" the race to superintelligence to prevent an irresponsible party from getting there first, he wrote. Lest you think this is just one departing researcher expressing an unpopular opinion, Anthropic Alignment Science lead Evan Hubinger piped in on social media to say that \"Jacob is correct here—we really do earnestly believe AI could kill all humans! I personally think it is 10% within the next decade.\" Read full article Comments", "date_str": "2026-09-09T16:59:40+00:00", "hash": "0a90122fb49e3f06", "title_fa": "محقق Anthropic با یک هشدار استعفا داد: هوش مصنوعی خود-بهبود می تواند همه ما را بکشد", "summary_fa": "وقتی این روزها یک محقق برجسته کار خود را در آزمایشگاه هوش مصنوعی مرزی رها می کند، اغلب به دنبال یک استارتاپ جدید یا اعتراض به یک مدل کسب و کار جدید است. اما محقق هوش مصنوعی جیکوب کاکسون از خروج خود از آنتروپیک استفاده می کند تا به طور علنی هشدار دهد که شرکت های مرزی هوش مصنوعی با سیستم هایی که آنها \"صادقانه معتقدند\" با زندگی ما قمار می کنند... می‌تواند تا پایان دهه همه ما را بکشد.» سه‌شنبه شب در یک تاپیک در رسانه‌های اجتماعی، کاکسن گفت که این خطر وجودی نه چندان در مدل‌های امروزی، بلکه بیشتر در چشم‌انداز قریب‌الوقوع «فوق هوشی خود-بهبود» ایجاد «سیستم‌های مافوق بشری است که می‌توانند هر چیزی را هک کنند، هر زمینه‌ای را یک شبه متحول کنند، و قدرت تمدنی واقعی را به دست آورند، نه در این مدل‌ها و منابع». او نوشت، یا معتقدند که آنها باید مسابقه را به سمت ابراطلاعات \"سریع بدورند\" تا از رسیدن یک حزب غیرمسئول ابتدا به آنجا جلوگیری کنند. مبادا فکر کنید که این فقط یک محقق در حال خروج است که نظری نامطلوب را بیان می کند، ایوان هابینگر، رهبر علوم همسویی آنتروپیک، در رسانه های اجتماعی صحبت کرد و گفت که \"در اینجا حرف جیکوب درست است - ما واقعاً عمیقاً معتقدیم که هوش مصنوعی می تواند همه انسان ها را بکشد! من شخصاً فکر می کنم این میزان در یک دهه آینده 10٪ خواهد بود.\" نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Prime Video releases full trailer for Mike Flanagan's Carrie", "link": "https://arstechnica.com/culture/2026/09/prime-video-releases-full-trailer-for-mike-flanagans-carrie/", "summary": "I'm on record expressing a certain amount of skepticism about Mike Flanagan's rebooted Carrie miniseries for Prime Video. We don’t need another disappointing remake , so what story is there left to tell—especially stretched out over six episodes? On the plus side, I'm a staunch fan of Flanagan's excellent Netflix horror fare, and he has a particular affinity for the works of Stephen King. He insists he has no intention of creating yet another straight adaptation of the novel. “ Carrie was written half a century ago,” Flanagan said at San Diego Comic-Con earlier this year. “ Carrie was adapted spectacularly by Brian De Palma. It is iconic. It is untouchable. There is no reason whatsoever to try to follow in those footsteps and to try to walk on that path. However, the world has changed quite a lot. I think a lot of people think they know what the show is. And the biggest thing I’m excited about today is just knowing what a big surprise our Carrie is going to be.” Read full article Comments", "date_str": "2026-09-09T16:40:45+00:00", "hash": "fc09dee7aebde9fa", "title_fa": "پرایم ویدیو تریلر کامل فیلم کری مایک فلانگان را منتشر کرد", "summary_fa": "من در حال ابراز شک و تردید در مورد مینی سریال ریبوت شده مایک فلانگان کری برای Prime Video هستم. ما نیازی به بازسازی ناامیدکننده دیگری نداریم، بنابراین چه داستانی برای گفتن باقی مانده است - به خصوص در شش قسمت؟ نکته مثبت این است که من از طرفداران سرسخت فیلم ترسناک عالی فلانگان در نتفلیکس هستم و او علاقه خاصی به آثار استیون کینگ دارد. او اصرار دارد که قصد ندارد اقتباس مستقیم دیگری از رمان بسازد. فلانگان در اوایل سال جاری در San Diego Comic-Con گفت: «کری نیم قرن پیش نوشته شد. برایان دی پالما از کری به طرز شگفت انگیزی اقتباس شده است. نمادین است. دست نخورده است. هیچ دلیلی وجود ندارد که بخواهیم آن راه را دنبال کنیم و در آن مسیر قدم برداریم. با این حال، جهان بسیار تغییر کرده است. من فکر می کنم بسیاری از مردم فکر می کنند که می دانند نمایش چیست. و بزرگترین چیزی که امروز در مورد آن هیجان زده هستم این است که بدانم کری ما قرار است چه غافلگیر کننده بزرگی باشد.\" نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Google's AI genome system evaluates every possible one-base change", "link": "https://arstechnica.com/science/2026/09/googles-ai-genome-system-evaluates-every-possible-one-base-change/", "summary": "On Tuesday, Google announced AlphaGenome Atlas , a resource that attempts to predict the consequences of every possible single-base variant in the human genome. The human genome is about 3 billion bases long, so trying the other three DNA bases that don't appear in our reference genome means sending a total of 9 billion bases through AlphaGenome software. AlphaGenome is designed to identify potential functions of non-coding DNA, which does not encode proteins but makes up the vast majority of the human genome. Some of this non-coding DNA is essential for controlling the activity of the protein-coding portion—it tells the cell where and when to make messenger RNAs, how to process them into mature protein-coding forms, and so on. But much of it appears to be little more than the remains of viruses and other molecular parasites. Being able to identify the functional portion is very useful, as is having all the analysis done by a single software package. But until biologists start to use it heavily (assuming they do), it won't be clear what AlphaGenome offers beyond what we could have gotten out of its training data. Read full article Comments", "date_str": "2026-09-09T16:34:18+00:00", "hash": "4fcb3d434d52288e", "title_fa": "سیستم ژنوم هوش مصنوعی گوگل هر تغییر یک پایه ممکن را ارزیابی می کند", "summary_fa": "روز سه‌شنبه، گوگل AlphaGenome Atlas را معرفی کرد، منبعی که تلاش می‌کند پیامدهای هر نوع تک پایه احتمالی در ژنوم انسان را پیش‌بینی کند. طول ژنوم انسان حدود 3 میلیارد باز است، بنابراین آزمایش سه پایگاه DNA دیگر که در ژنوم مرجع ما دیده نمی شوند به معنای ارسال مجموعا 9 میلیارد پایگاه از طریق نرم افزار AlphaGenome است. AlphaGenome برای شناسایی عملکردهای بالقوه DNA غیر کد کننده طراحی شده است که پروتئین ها را رمزگذاری نمی کند اما اکثریت قریب به اتفاق ژنوم انسان را تشکیل می دهد. برخی از این DNA غیرکدکننده برای کنترل فعالیت بخش کدکننده پروتئین ضروری است - به سلول می‌گوید کجا و چه زمانی RNA‌های پیام‌رسان را بسازد، چگونه آنها را به شکل‌های کدکننده پروتئین بالغ پردازش کند و غیره. اما به نظر می رسد که بیشتر آن کمی بیشتر از بقایای ویروس ها و سایر انگل های مولکولی باشد. توانایی شناسایی بخش عملکردی بسیار مفید است، همانطور که تمام تجزیه و تحلیل ها توسط یک بسته نرم افزاری انجام می شود. اما تا زمانی که زیست شناسان شروع به استفاده شدید از آن نکنند (با فرض اینکه این کار را انجام دهند)، مشخص نخواهد شد که AlphaGenome فراتر از آنچه می توانستیم از داده های آموزشی آن به دست آوریم، چه چیزی ارائه می دهد. نظرات مقاله کامل را بخوانید"}, {"source": "Wired", "title": "Coway Airmega Halo Review: Is Your Air Really Clean?", "link": "https://www.wired.com/review/coway-airmega-halo/", "summary": "Coway’s new Airmega Halo runs quietly and clears visible smoke quickly, but its air-quality readings weren’t always reassuring.", "date_str": "2026-09-10T14:19:23+00:00", "hash": "ac2783aa1863d0af", "title_fa": "بررسی Coway Airmega Halo: آیا هوای شما واقعاً تمیز است؟", "summary_fa": "اکنون بخرید چندین گزینه خرید موجود است 230 دلار در آمازون 229 دلار در Coway Loader نظر ذخیره داستان ذخیره این داستان Comment Loader ذخیره داستان ذخیره این داستان امتیاز: 6 /10 WIRED سبک وزن. بدون نیاز به Wi-Fi برای استفاده. سنسور لیزری مگا اسکن داخلی برای نظارت مستمر ذرات PM2.5. تقریباً ساکت در پایین. خسته بدون چرخ و دسته. بدون ریموت هیچ نمایشگری برای نشان دادن سطوح واقعی آلاینده وجود ندارد. چراغ های نشانگر کد رنگی ممکن است گیج کننده باشند و در طول آزمایش من عقب مانده باشند. من نمی توانم اهمیت داشتن یک تصفیه کننده هوا را اغراق کنم که نه تنها قدرت کافی برای تصفیه هوای اتاق را داشته باشد، بلکه نیازهای خاص خانه شما را نیز برآورده کند. آلاینده‌هایی مانند دود آتش‌سوزی، گرده گل، اجاق‌های گاز بدون تهویه، مواد حساسیت‌زای حیوانات خانگی و حتی بوی جعبه زباله می‌توانند به طور بالقوه مضری به هوایی که در خانه تنفس می‌کنید باشند. تصفیه‌کننده‌های هوا از Coway برای سال‌ها یک انتخاب برتر ثابت در راهنمای ما برای بهترین تصفیه‌کننده‌های هوا بوده‌اند، از جمله Coway Airmega Mighty2 که در مارس امسال منتشر شد. سلف آن، Coway Airmega Mighty، همچنین سال‌ها «بهترین تصفیه‌کننده هوای مقرون‌به‌صرفه» حاکم ما بود. من برای آزمایش جدیدترین گزینه سایز متوسط ​​که برای اتاق های متوسط ​​تا بزرگ در خط Coway's Airmega ساخته شده است، هیجان زده بودم، جایی که بین Airmega جمع و جور 50 یا 100 و مدل های با ظرفیت بالاتر 350 یا 450 قرار می گیرد. Coway’s Airmega Halo که در پایان آگوست عرضه شد، یک تصفیه‌کننده هوای مقرون‌به‌صرفه و سبک وزن است که هدف آن ارائه تصفیه هوای کل اتاق با قیمتی قابل دسترس است. به‌علاوه، تمرکز آن بر ارتقای خواب شبانه سالم‌تر با ویژگی‌های خواب هوشمند و سطوح صدای آرام در حالت خواب است. به طور کلی، به اکثر وعده‌هایش"}, {"source": "Wired", "title": "Best Bluetooth Speaker (2026): JBL, Sonos, Marshall, and More", "link": "https://www.wired.com/story/best-bluetooth-speakers/", "summary": "I tested portable speakers of all shapes and sizes, from pocket to party-sized.", "date_str": "2026-09-10T11:00:00+00:00", "hash": "97832477732570c6", "title_fa": "بهترین بلندگوی بلوتوث (2026): JBL، Sonos، Marshall و بیشتر", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان اگر می خواهید موسیقی خود را همه جا بیاورید، بلندگوی ساده بلوتوث بهترین گزینه برای شماست. در مقایسه با بلندگوهای قفسه کتاب، مقداری کیفیت صدا را از دست خواهید داد، اما این روزها، بلندگوهای بلوتوث صدای بسیار خوبی دارند و به شما اجازه می‌دهند هر کجا که می‌روید - حیاط خلوت، ساحل و فراتر از آن، آهنگ‌ها را پخش کنید. از زمانی که آنها برای اولین بار در سال 2010 در صحنه صوتی ظاهر شدند، تیم WIRED صدها بلندگوی بلوتوث را در هر محدوده قیمتی بررسی کرده است. بهترین گزینه من برای بیشتر موارد استفاده، JBL Flip 7 قابل حمل، بادوام و مقرون به صرفه (150 دلار) است، اما من تقریباً برای هر مورد استفاده و بودجه ای توصیه های تخصصی دارم. از مهمانی های در فضای باز، روزهای ساحلی و تفریحات کنار استخر گرفته تا گوش دادن در خانه در هر اتاق، اینها بهترین بلندگوها برای هر کاری هستند که انجام می دهید. فراموش نکنید که سایر راهنماهای صوتی WIRED از جمله بهترین نوارهای صوتی، بهترین هدفون های بی سیم و بهترین بلندگوهای رایانه را بررسی کنید. به‌روزرسانی در سپتامبر 2026: من LG xboom Stage 501 و JBL Go 5 را به توصیه‌هایم اضافه کردم، فهرست Honorable Mentions را به‌روزرسانی کردم و قیمت و کپی را با به‌روزترین اطلاعات به‌روزرسانی کردم. کارشناسان صوتی WIRED ساعت های بی شماری را صرف گوش دادن، حمل، شارژ، انداختن و غوطه ور کردن بلندگوهای بلوتوث کرده اند. من بیش از 20 سال است که تجهیزات صوتی را آزمایش می‌کنم و هیجانی را که پیرامون راه‌اندازی Jawbone Jambox که در سال 2010 در حال تغییر صنعت بود، به یاد می‌آورم. این دستگاه کمک کرد تا بلندگوهای بی‌سیم را به جریان اصلی تبدیل کند و کل صنعت را راه‌اندازی کند. از آن"}, {"source": "Wired", "title": "‘Killmonger Locs’ Are Everywhere in Video Games. This Artist Is Sick of It", "link": "https://www.wired.com/story/killmonger-locs-have-infiltrated-video-games-this-artist-is-sick-of-it/", "summary": "The Black Panther villain’s hairstyle has become a default for Black video game characters because it’s easy to code. Danielle Udogaranya is changing that.", "date_str": "2026-09-10T10:45:00+00:00", "hash": "49b8139f3f65a237", "title_fa": "\"Killmonger Locs\" همه جا در بازی های ویدیویی وجود دارد. این هنرمند از آن بیمار است", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان وقتی بازی شبیه‌سازی زندگی Paralives در دسترسی اولیه منتشر شد، دست دانیل اودوگارانیا از فکر ساخت مدل موی سیاه جدید برای آن درد گرفت. دلیلش این نبود که او نمی خواست برای بازی خلق کند. Udogaranya که بیشتر با نام Ebonix شناخته می‌شود، بیش از یک دهه را صرف ایجاد محتوای سفارشی برای بازی‌های زنده با هدف کمک به مردم برای دیدن خود در صفحه‌های دیجیتال کرده است. تردید او ناشی از هزینه‌های فیزیکی بود که برای ساخت سیم‌پیچ دیجیتال کامل، قیطان و پیچ خوردگی لازم است - ساعت‌های طولانی و دقت خسته‌کننده. با خودم فکر کردم چرا هنوز باید این کار را انجام دهم؟ Udogaranya، یک هنرمند فنی که دارای مدرک روانشناسی است، به WIRED می گوید. طرفداران بازی‌هایی مانند The Sims زمانی را صرف ورق زدن سایت‌های او می‌کنند و بسته‌های موی سفارشی را با الهام از سبک‌های زندگی واقعی دانلود می‌کنند که در غیر این صورت در بازی موجود نیست. در حال حاضر، Ebonix Patreon بیش از 115000 عضو و صدها مورد محتوای رایگان و پولی دارد. دلیل تقاضا برای محتوای سفارشی در بازی‌های شبیه‌سازی زندگی ساده و ناامیدکننده است: مدل‌های موی سیاه طبیعی در طول تاریخ کمتر معرفی شده‌اند و فناوری مورد استفاده در ساخت آنها به کندی بهبود می‌یابد. اودوگارانیا با اشاره به سبک سخت و ترسناک شخصیت مایکل بی جردن در فیلم Black Panther که تبدیل به یکی از محبوب ترین بازی ها و همچنین برخی از فیلم های دیگر شد، می گوید: \"با بازی های جدیدی که اکنون منتشر می شوند، من هنوز هم مشکلات را می بینم و هنوز هم \"Killmonger locs\" را می بینم. خدا نکنه بیش از سه گزینه داشته باشیم. نمونه‌های مشابهی را می‌توان در فرنچایزهای قدیمی و جدید، از جمله Tekken 8، Spider-Man 2، Apex"}, {"source": "Wired", "title": "Everything New You Can Do With Siri AI", "link": "https://www.wired.com/story/everything-new-you-can-do-with-siri-ai/", "summary": "When iOS 27 arrives, it will bring with it a fully revamped assistant for your iPhone.", "date_str": "2026-09-10T10:30:00+00:00", "hash": "f99f270cfda71654", "title_fa": "همه چیز جدیدی که می توانید با هوش مصنوعی سیری انجام دهید", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Siri اولین بار در iPhone در سال 2011 وارد بازار شد، پنج سال قبل از Google Assistant و 11 سال قبل از اینکه ChatGPT برای عموم باز شود. علیرغم شروع اولیه، هوش مصنوعی صوتی اپل در سال های اخیر به طور کامل پیشی گرفته است و در مقایسه با بسیاری از رقبای هوش مصنوعی مولد که اکنون در برابر آن قرار دارد، بسیار ابتدایی به نظر می رسد. با راه اندازی iOS 27، اپل و سیری در حال مبارزه هستند. یک نام جدید - Siri AI - و مجموعه ای از قابلیت های جدید وجود دارد که به آیفون شما می آید. اگر از iPhone 15 Pro یا iPhone 15 Pro Max یا جدیدتر استفاده می کنید (البته از جمله iPhone 18 Pro و iPhone Duo) می توانید از آنها استفاده کنید، به محض اینکه iOS 27 روی گوشی شما ظاهر شد. فقط این جدیدترین تلفن‌ها دارای سیلیکون داخلی لازم برای پاسخگویی به نیازهای پردازش هوش مصنوعی بالاتر هستند. زمانی که هوش مصنوعی Siri وارد می شود متوجه خواهید شد که مدتی را صرف فهرست کردن همه چیز در آیفون شما می کند. به این ترتیب می‌تواند متن‌ها، ایمیل‌ها، تقویم‌ها و هر چیز دیگری را که در تلفن خود ذخیره کرده‌اید، عمیقاً بررسی کند (هرچند همه چیز در دستگاه نگهداری می‌شود - هیچ چیزی به اپل ارسال نمی‌شود). این بدان معنی است که می توانید سؤالات طبیعی در مورد مکالمات متنی، تعاملات ایمیلی و قرار ملاقات ها بپرسید - ارزیابی کار من در چه روزی اتفاق می افتد؟ مثلاً یا کجا گفتم با مامان ملاقات کنم؟ و بر اساس آنچه قبلاً در برنامه‌هایتان ذخیره شده است، پاسخ‌های آگاهانه و شخصی‌شده را دریافت کنید. این برای عکس ها و فیلم ها نیز کار می کند. برنامه Photos را"}, {"source": "Wired", "title": "9 Windows Laptops That Give MacBooks a Run for Their Money", "link": "https://www.wired.com/gallery/best-windows-laptops/", "summary": "Windows laptops have never been so good, and they’re only going to get better as we move through 2026.", "date_str": "2026-09-10T10:30:00+00:00", "hash": "33b2f9c4a6639785", "title_fa": "۹ لپ‌تاپ ویندوزی که به مک‌بوک‌ها برای پول خود کار می‌کنند", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان در این مقاله برجسته شده است بهترین لپ تاپ Windows Dell XPS 13 (2026) بیشتر بخوانید 700 دلار Dell (8 گیگابایت) بهترین لپ تاپ ویندوز ارزان HP OmniBook 5 بیشتر بخوانید 1050$630-5 اینچ (14% تخفیف) HP لپ تاپ Lenovo IdeaPad Slim 5x بیشتر بخوانید 1000 دلار 950 دلار (5٪ تخفیف) آمازون (2560 x 1600) زیباترین لپ تاپ ویندوز HP OmniBook Ultra 14 بیشتر بخوانید 1,800 دلار 1,200 دلار (33 درصد تخفیف) HP (Core Ultra MacBook 7 لپ تاپ هرگز جنگنده نبوده است.) اکنون جایگزین های مناسب تری برای هر مک بوک در خط تولید وجود دارد. چه ویندوز را انتخاب کنید زیرا از اپل استفاده نمی‌کنید، برای نرم‌افزار خاصی به آن نیاز دارید، یا فقط به این دلیل که گزینه‌های سخت‌افزاری متنوعی را دوست دارید، در حال حاضر هزاران لپ‌تاپ ویندوزی عالی برای انتخاب وجود دارد. من قبلاً ده ها لپ تاپ ویندوزی را امسال آزمایش کرده ام و بیش از یک دهه است که لپ تاپ ها را بررسی می کنم. اینها توصیه های من هستند که می توانید همین الان خریداری کنید، از جمله بسیاری از آنها که اخیراً به روز شده اند."}, {"source": "Wired", "title": "Book Excerpt: Emily St. John Mandel’s ‘Exit Party’ Imagines a Future Where a Spy Could Disappear", "link": "https://www.wired.com/story/book-excerpt-emily-st-john-mandel-exit-party/", "summary": "In Emily St. John Mandel’s new novel Exit Party, becoming a “ghost” means running afoul of the state. In this excerpt, a secret agent discovers it doesn’t take much.", "date_str": "2026-09-10T10:15:00+00:00", "hash": "0021fb02549f9781", "title_fa": "گزیده کتاب: «پارتی خروج» اثر امیلی سنت جان مندل آینده‌ای را تصور می‌کند که در آن جاسوسی می‌تواند ناپدید شود.", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان کوشش واقعی مسیر نامحتمل را دنبال می کند. این جمله را در یک رمان پلیسی در کودکی خواندم، زمانی که 8 یا 9 ساله بودم و بعد این جمله برای همیشه در ذهنم ماند. برای مدت طولانی در صفحه داخلی هر دفترچه یا گاهی اوقات روی جلد جلویی، True Diligence را با حروف مجعد سبک می نوشتم. من دفترچه هایی برای نوشتن سرنخ داشتم، زیرا حتی در 9 سالگی می خواستم برای سرویس اطلاعات داخلی کار کنم. کدام کودک پنهانی نمی خواهد جاسوس شود؟ ما به همان اندازه از سرویس وحشت زده و مجذوب شدیم. سرویس ماشین‌های تیره‌ای بود که به سمت پایین بلوک حرکت می‌کردند، مردان و زنانی با لباس‌های فراموش‌شدنی والدین ما را در خیابان برای بازجویی‌های تصادفی کوتاه متوقف می‌کردند. خدمات نیرویی بود که باعث ناپدید شدن مردم شد - وقتی کلاس اول بودم، دوستم از آن طرف خیابان با والدینش به پشت ماشین سیاه رنگی رفت و آپارتمان آنها یک سال قبل از نقل مکان دیگران خالی بود - اما سرویس نیز نوعی زرق و برق تاریک را به همراه داشت، هاله ای از قدرت که ما را صدا می کرد. ما همیشه، من و دوستانم، ارواح و مأموران را بازی می‌کردیم، اما در نهایت آنها به علایق دیگری گرایش پیدا کردند و من همچنان می‌خواستم جاسوس باشم، بنابراین بعد از دبیرستان با موفقیت برای آکادمی خدمات در لس‌آنجلس درخواست دادم. من با استعداد بودم و به سرعت به مدرسه رفتم، و پس از آن به فیلمور، شهری زیبا در حدود 80 کیلومتری شمال لس آنجلس فرستاده شدم. پدر و مادرم در سال اول به دیدن من آمدند. وقتی از قطار پیاده شد، مادرم گفت: «این دوست‌داشتنی است، ایباری». شهر اولین تاثیر خوبی داشت. ایستگاه مرکزی زیبا بود، یکی از آن سازه‌های کالیفرنیای"}, {"source": "Wired", "title": "Vari Electric Standing Desk Review (2026): Form and Value", "link": "https://www.wired.com/review/vari-ergo-electric-standing-desk/", "summary": "The Vari Ergo electric standing desk is compact, easy to assemble, affordable, and gently sloped to fit my natural posture and shape.", "date_str": "2026-09-10T10:05:00+00:00", "hash": "0e96545ce3ff05cf", "title_fa": "بررسی میز ایستاده Vari Electric (2026): فرم و ارزش", "summary_fa": "اکنون بخرید چندین گزینه خرید در دسترس است 699 دلار 559 دلار در Vari 699 دلار 559 دلار در آمازون Comment Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان رتبه: 9 /10 WIRED آسان برای جمع آوری. شکل بریده شده برای ارگونومی (و افراد با سایز بزرگ) مناسب است. خوش قیافه، به روشی مینیمالیستی. طیف گسترده ای از تنظیمات. موتور نسبتا بی صدا فشرده. محکم گارانتی مادام العمر. خسته برخی ممکن است عمق بیشتر یا عرض های متفاوت بخواهند. مدیریت کابل می تواند بهتر باشد. در شغلم به عنوان بازبینی محصول، یاد گرفته ام از جعبه های بزرگ بترسم. هر کدام که وارد می‌شود، چه یک صندلی اداری یا یک سیگاری گلوله‌ای، ممکن است به این معنا باشد که از 20 دقیقه تا چندین ساعت سرم را در نمودارهای مخفی می‌خراشم، در حالی که سرم را خم کرده‌ام و سعی می‌کنم جای مناسبی برای قرار دادن پیچ بدون انداختن آن پیدا کنم. و بنابراین کتابچه راهنمای دستورالعمل چهار مرحله ای روی میز ایستاده برقی Vari Ergo منبع تسکین فوق العاده ای بود. از زمانی که شرکت میز ایستاده مستقر در تگزاس برای اولین بار شروع به عرضه کیت های تبدیل میز ایستاده در اوایل دهه 2010 کرد (در آن زمان با نا ه کسی زنگ خطر هوش مصنوعی را به صدا درآورده است، اما در لحظه حساسی رخ می دهد. سیلیکون ولی در تلاش است تا نگرانی‌های ایمنی و امنیتی مدل‌های پیشرفته هوش مصنوعی را در نظر بگیرد. OpenAI برای پاسخ به یک حادثه امنیتی که در آن عواملش پلتفرم Hugging Face را هک کردند، عجله کرده است. در همین حال، آنتروپیک در تلاش است تا به سرمایه‌گذاران اطمینان دهد که این نگرانی‌ها را تحت کنترل دارد، زیرا طبق گزارش‌ها آماده می‌شود تا برای چیزی که می‌تواند بزرگترین عرضه اولیه اولیه اولیه سهام (IPO) باشد، ثبت نام کند. آنچه در پاسخ به پست کاکسون مشخص شد این است که نظرات او در واقع توسط بسیاری از همتایانش مشترک است. ایوان هوبینگر، مدیر"}, {"source": "Wired", "title": "San Francisco Orders Meta to Stop ‘Allowing’ AI Child Abuse Ads", "link": "https://www.wired.com/story/san-francisco-orders-meta-to-stop-allowing-ai-child-abuse-ads/", "summary": "The City Attorney’s Office has asked Meta to explain how the harmful ads repeatedly ran on Facebook and Instagram. The company claims the ads are not under the city’s jurisdiction.", "date_str": "2026-09-09T21:15:27+00:00", "hash": "0c6efd5cd6b326dc", "title_fa": "سانفرانسیسکو به متا دستور داد تا «اجازه دادن» تبلیغات سوء استفاده از کودکان توسط هوش مصنوعی را متوقف کند", "summary_fa": "روز سه‌شنبه، WIRED گزارش داد که متا در ماه‌های اخیر بیش از 350 آگهی را اجرا کرده است که تصاویر ساکن خردسالان را - که برخی از آنها به عنوان افراد واقعی تأیید شده‌اند، از جمله اعضای یک خانواده سلطنتی اروپایی - را به کلیپ‌های ویدیویی کوتاهی تبدیل کرده است که می‌تواند آنها را در حال انجام اعمال جنسی به تصویر بکشد. هنگامی که روی این تبلیغات کلیک می‌شود، افراد را هدایت می‌کند تا برنامه‌های تولید تصویر و ویدیوی هوش مصنوعی را دانلود کنند، که برخی از آنها می‌توانند برای برهنه کردن افراد به صورت دیجیتالی یا ایجاد تصاویر غیرمتعارف صمیمانه استفاده شوند. این تبلیغات که توسط محققان پروژه شفافیت فناوری (TTP) کشف شد، شامل تبلیغات یکسانی بود که چندین بار آپلود شده بود و در مجموع به بیش از 29000 حساب در کشورهای اتحادیه اروپا رسید. تبلیغاتی که در فیس‌بوک، اینستاگرام و Threads نشان داده شد، حساب‌های موجود در ایالات متحده، استرالیا و هند را نیز هدف قرار داده است. WIRED در ابتدا در مورد دسته ای از 53 آگهی در ابتدای ماه اوت گزارش داد، اما بیش از 250 از تعداد کل تبلیغات پس از این گزارش اولیه در پلتفرم های متا اجرا شد. دیوید چیو، دادستان شهر سانفرانسیسکو در بیانیه ای به WIRED می گوید: \"متا نتوانسته است به یک موضوع شناخته شده تبلیغات جنسی کودکان توسط هوش مصنوعی رسیدگی کند، در حالی که از آنها سود می برد.\" متا ادعا می کند که برای استثمار کودکان تحمل صفر دارد، اما مقیاس و تداوم این مسائل نشان می دهد که تلاش های فعلی به طرز تاسف باری ناکافی است. این غیرقابل قبول است و متا باید بهتر عمل کند.\" این نامه انبوهی از سؤالات را در مورد نحوه عملکرد خط‌مشی‌های تبلیغاتی و سیستم‌های ایمنی متا مطرح می‌کند و از کارکنان حقوقی، ایمنی کودکان و تبلیغات این شرکت"}, {"source": "Wired", "title": "A Year After Charlie Kirk’s Death, Turning Point Plans to Spend Big on the Midterms", "link": "https://www.wired.com/story/a-year-after-charlie-kirks-death-turning-point-plans-to-spend-big-on-the-midterms/", "summary": "Turning Point will spend tens of millions on ads and turnout, sources say, with a focus on New Hampshire, Arizona, and Nevada.", "date_str": "2026-09-09T21:00:00+00:00", "hash": "16cb956114e19bf9", "title_fa": "یک سال پس از مرگ چارلی کرک، برنامه های نقطه عطفی برای هزینه های کلان در میان دوره ای", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان یک سال پس از ترور یکی از بنیانگذاران چارلی کرک، Turning Point قصد دارد ده ها میلیون دلار برای انتخابات میان دوره ای برای کمک به نامزدهای جمهوری خواه در رقابت های کلیدی کنگره و فرمانداری سرمایه گذاری کند. انتظار می رود که گروه محافظه کار مردمی در میان دوره ای سه ایالت را در اولویت قرار دهد - نیوهمپشایر، آریزونا و نوادا - اما همچنین کارکنان میدانی تمام وقت را در هفت ایالت دیگر که دموکرات ها می توانند کرسی های خود را انتخاب کنند، مستقر خواهند کرد. مبالغ دقیق ممکن است تغییر کند، اما منابع به WIRED می‌گویند که ابر PAC شرکت Turning Point به دنبال هزینه 15 تا 20 میلیون دلاری برای تبلیغات در سه ایالت اولویت‌دار است. هزینه های عملیات میدانی نقطه عطف را نمی توان آموخت، زیرا توسط یک سازمان غیرانتفاعی 501(c)(4) اداره می شود، اما تخمین زده می شود که ده ها میلیون بیشتر باشد. تزریق پول نقد برنامه ریزی شده هم برای عملیات میدانی و هم برای تبلیغات دیجیتال هزینه می کند و تنها به مزیت جمهوری خواهان در تأمین بودجه از طریق مجموعه ای از فوق العاده PAC ها و کمیته های حزبی می افزاید. بیشترین رقابت برای جمهوری خواهان در نیوهمپشایر، کرسی سنا است که توسط ژان شاهین، دموکرات بازنشسته خالی شده است، جایی که سناتور سابق جمهوری خواه جان سونونو در مقابل کریس پاپاس، نماینده دموکرات برای تغییر کرسی رقابت می کند. رقابت در سنای نیوهمپشایر میدان نبردی حیاتی برای هر دو حزب است، زیرا بسیاری از راه‌های احتمالی برای کسب اکثریت سنا توسط دموکرات‌ها مستلزم حفظ کرسی این حزب است که گزارش سیاسی کوک آن را دموکرات لاغر ارزیابی می‌کند."}, {"source": "The Next Web", "title": "Celero raises $275m to bring coherent optics inside AI data centres", "link": "https://thenextweb.com/news/celero-275m-series-c-coherent-optics-ai-data-centres", "summary": "Celero Communications, a two-year-old chip startup, has raised $275m in a Series C round that values it at more than $3bn. It makes the processors that push data down fibre optic cables between AI chips, racks and whole data centres. Atreides Management, Valor Equity Partners and CapitalG, Alphabet’s growth fund, co-led the round. Dina Bass [ ] This story continues at The Next Web", "date_str": "2026-09-10T13:02:28+00:00", "hash": "d31a07d3afc7c573", "title_fa": "سلرو 275 میلیون دلار جمع‌آوری می‌کند تا اپتیک منسجم را در مراکز داده هوش مصنوعی بیاورد", "summary_fa": "Celero Communications، یک استارت‌آپ تراشه دو ساله، 275 میلیون دلار در دور سری C جمع‌آوری کرده است که ارزش آن بیش از 3 میلیارد دلار است. این پردازنده‌هایی را می‌سازد که کابل‌های فیبر نوری را بین تراشه‌های هوش مصنوعی، رک‌ها و کل مراکز داده پایین می‌آورند. مدیریت Atreides، Valor Equity Partners و CapitalG، صندوق رشد آلفابت، دور را رهبری کردند. دینا باس [ ] این داستان در وب بعدی ادامه دارد"}, {"source": "The Next Web", "title": "UK space strategy puts £7.8bn behind defence, satellites and ESA to 2030", "link": "https://thenextweb.com/news/uk-space-strategy-7-8bn-defence-esa", "summary": "The UK government has published a new space strategy, backed by £7.8bn to 2030. It brings the government’s civil and military space spending under one plan. The government’s announcement on 8 September named national security and defence as its key pillars, alongside growth. The UK Space Strategy formally replaces the National Space Strategy of 2021. [ ] This story continues at The Next Web", "date_str": "2026-09-10T12:39:12+00:00", "hash": "0326998e4ba2f9ea", "title_fa": "استراتژی فضایی بریتانیا 7.8 میلیارد پوند از دفاع، ماهواره ها و ESA تا سال 2030 صرف می کند.", "summary_fa": "دولت بریتانیا استراتژی فضایی جدیدی را منتشر کرده است که با حمایت 7.8 میلیارد پوند تا سال 2030، هزینه‌های فضایی غیرنظامی و نظامی دولت را تحت یک برنامه قرار می‌دهد. اعلامیه دولت در 8 سپتامبر، امنیت ملی و دفاع را به عنوان ستون های کلیدی خود در کنار رشد نام برد. استراتژی فضایی بریتانیا به طور رسمی جایگزین استراتژی ملی فضایی سال 2021 می شود. [ ] این داستان در The Next Web ادامه دارد"}, {"source": "The Next Web", "title": "Researchers used AI to build a WeChat worm that spreads through phone calls", "link": "https://thenextweb.com/news/wechat-worm-ai-calif-tencent-zero-click", "summary": "Researchers at Calif, a Palo Alto security company, say they used AI to build a worm that spreads through WeChat calls. It takes over an account while the phone is still ringing. It then uses that account to call the victim’s contacts and repeat the trick. Tencent, which owns WeChat, has confirmed the flaw and [ ] This story continues at The Next Web", "date_str": "2026-09-10T12:19:35+00:00", "hash": "40ef41026239e7c1", "title_fa": "محققان از هوش مصنوعی برای ساخت کرم WeChat استفاده کردند که از طریق تماس های تلفنی پخش می شود", "summary_fa": "محققان کالیف، یک شرکت امنیتی پالو آلتو، می‌گویند که از هوش مصنوعی برای ساختن کرمی استفاده کردند که d estimates how far away they are by reading the Bluetooth signals the glasses broadcast. It has around 5,000 users a month after launch. Pawel Szydlowski bought several models of smart glasses and catalogued their Bluetooth fingerprints, [ ] This story continues at The Next Web", "date_str": "2026-09-10T10:34:03+00:00", "hash": "ce2986068ccb56ff", "title_fa": "یک توسعه‌دهنده لهستانی اپلیکیشنی ساخته است که عینک‌های هوشمند متا را از طریق بلوتوث تشخیص می‌دهد", "summary_fa": "یک توسعه‌دهنده نرم‌افزار 30 ساله لهستانی یک برنامه آیفون ساخته است که عینک‌های هوشمند متا را در مجاورت تشخیص می‌دهد و با خواندن سیگنال‌های بلوتوثی که عینک پخش می‌شود تخمین می‌زند که چقدر فاصله دارند. یک ماه پس از راه اندازی حدود 5000 کاربر دارد. Pawel Szydlowski چندین مدل عینک هوشمند خرید و اثر انگشت بلوتوث آنها را فهرست بندی کرد، [ ] این داستان در The Next Web ادامه دارد."}, {"source": "The Next Web", "title": "A Republican senator is now investigating OpenAI over the Hugging Face incident", "link": "https://thenextweb.com/news/hawley-senate-probe-openai-hugging-face-16-questions", "summary": "Senator Josh Hawley has opened an investigation into the incident in which OpenAI’s models broke out of their test environment and compromised Hugging Face, giving the company until 1 October to answer 16 questions and hand over records of its policies and its handling of rogue AI activity, Reuters reports. Josh Hawley, who leads a [ ] This story continues at The Next Web", "date_str": "2026-09-10T10:22:36+00:00", "hash": "9cf2b328472248d0", "title_fa": "یک سناتور جمهوری خواه اکنون در حال تحقیق درباره OpenAI درباره حادثه Hugging Face است", "summary_fa": "به گزارش رویترز، سناتور جاش هاولی تحقیقاتی را در مورد حادثه ای که در آن مدل های OpenAI از محیط آزمایشی خود خارج شدند و Hagging Face را به خطر انداختند، آغاز کرده است و به شرکت تا اول اکتبر فرصت داده تا به 16 سوال پاسخ دهد و سوابق سیاست های خود و مدیریت فعالیت های هوش مصنوعی سرکش را تحویل دهد. جاش هاولی، که رهبری [ ] را بر عهده دارد این داستان در وب بعدی ادا
