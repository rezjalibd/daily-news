  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {

      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

d, and B: been given all the world's wealth and power.\" The sketch also included a Venn diagram that said beautiful women have no overlap with the billionaires' interests and opinions. Late Sunday, Musk replied to SNL's X post with his own Venn diagram, saying that only a small number of the show's sketches are funny. lol pic.twitter.com/7vw3wS9Jm3 — Elon Musk (@elonmusk) November 16, 2026 Musk also criticized Jeremy Culhane's portrayal of him, which parodied the SpaceX CEO's mannerisms and love of memes. \"I'd give them maybe 5/10 for me. They need to try harder,\" Musk wrote. In another post, after an X user said political opinions had taken over SNL's skits and that the \"insults aren't funny,\" Musk replied: \"Exactly.\" One hour and 40 minutes after his first SNL-related post, Musk shared a YouTube playlist of the episode he hosted in 2021. The billionaire acted as a cowboy, a doctor who uses Gen Z slang in a medical-drama parody, and Nintendo character Wario on trial accused of murdering his nemesis Mario. Chloe Fineman, a comedian who was part of SNL at the time, said in 2024 that Musk made her cry after he crit", "date_str": "2026-11-16T15:27:04+00:00", "hash": "c5fc6eb95d246cff", "title_fa": "ایلان ماسک، مجری سابق «SNL»، عاشق تقلید آن از هفته وحشی فناوری نبود.", "summary_fa": "ایلان ماسک میزبان SNL در سال 2021 بود. بانک عکس Will Heath/NBC/NBCU از طریق Getty Images ایلان ماسک چندین پست X در انتقاد از آخرین تصویر خود در \"SNL\" منتشر کرد. در این طرح، یک افسر سیا در مورد اجتناب از تله عسل به میلیاردرهای فناوری آموزش های امنیتی می دهد. ماسک پیشنهاد کرد که خنده دار نیست و به تصور جرمی کولهن از او امتیاز 10/5 داد. ایلان ماسک از آخرین نقش آفرینی خود در «شنبه شب زنده» چندان راضی نیست. ثروتمندترین فرد جهان چندین پست X منتشر کرد و از سردرد در نسخه این هفته شکایت کرد که میلیاردرهای فناوری را مسخره کرد. در آن، جان مولانی نقش یک افسر سیا را بازی می‌کرد که به پیتر تیل، مارک زاکربرگ، سم آلتمن از OpenAI، داریو آمودی از آنتروپیک و البته ماسک آموزش‌های امنیتی داد. مولانی به n't until a couple of years later, at the onset of the COVID-19 pandemic, that Tyler and I reconnected on a dating app . It was immediately evident that we had a lot in common. We were both divorced, ready to try again after failed rebound relationships, and each parents to two little girls. It's now been six years since we made it official, and it's the happiest, easiest, most natural relationship I have ever known. I've even proposed, and he said yes. But sometimes, I can't help but wonder: How much of what keeps us happy has to do with our choice to live nearby, but apart? We talked about moving in together, but realized it wasn't the best decision for us Tyler initially suggested we move in together. Renee Lynn Frojo The decision to live separately wasn't a given. The conversation started after Tyler's girls began outgrowing the one-bedroom apartment he temporarily moved into after his divorce. He assumed that when it came time to move into something bigger and more permanent, it would be into my three-bedroom house . After all, at this point, we had been together for three years, and moving in together is the expected next step for most couples. But for us, it was the first major disagreement. I argued that, unless financially critical, it wasn't worth unnecessarily complicating our lives. For starters, the girls love each other and get along like cousins. But when we spend extended periods of time together under the same roof, like on summer vacations , they inevitably start to fight like sisters. If we Brady Bunched our situation full time, we'd invite more battles for space, attention, and control. Our girls get along great, but they can also fight like sisters. Renee Lynn Frojo Then there's the fact that we both have very different living s", "date_str": "2026-11-16T15:16:09+00:00", "hash": "dd0b531ccc2bb9b1", "title_fa": "من و نامزدم در یک محله در خانه های جداگانه زندگی می کنیم. ما هیچ برنامه ای برای نقل مکان با هم نداریم.", "summary_fa": "من و نامزدم به ط was flying as a regular customer during the ground stop and is experiencing travel delays. Booking a hotel room as soon as your flight is canceled is one of her key points of advice. This as-told-to essay is based on a conversation with Aimee Allenback . It has been edited for length and clarity. I've been a flight attendant for the past seven years. When the FAA set a national ground stop on Friday, I was on a personal trip trying to get home from Myrtle Beach, South Carolina, to Pensacola, Florida. My original flight path was Myrtle Beach to Fort Lauderdale and then on to Pensacola, but when I landed in Fort Lauderdale, the pilot let us know about the ground stop. The language that this was a national ground stop due to extraordinary circumstances definitely frightened a lot of people, which I understand, but it was a different situation than something like 9/11. There are a few things I think people should keep in mind when flights get delayed or canceled in the future. Always have a plan B, like booking a hotel room and a rental car When I landed in Fort Lauderdale and saw my next flight was delayed, I immediately booked a hotel room for the night. This is a cost not everyone can or wants to afford, but I knew that if my flight got canceled, I'd have a place to stay for the night. Aimee Allenback has been a flight attendant for years. Courtesy of Aimee Allenback I was willing to eat the $170 cost if my connecting flight didn't get canceled, which is a luxury, but it is always worth it to me to have a plan B that I know I can fall back on. And when my flight did get canceled, I already had a room. If I had waited to book, I'm not sure there would have been anything available because so many other people needed a room, too. My neighbor in Pensacola happened to be on the same flight, so we decided to team up to get back home. We looked at flight options for the next day and decided that flying out of Orlando made more sense than flying out of Fort Lauderdale. That on so far this year, compared with $3.59 billion in all of 2025 — a difference of roughly 47% . One important caveat: This compares a year-to-date figure with a full-year total. Still, the concentration of capital is hard to miss — and the drop-off hard to ignore. Two plausible explanations: The category is maturing. Investors may see Harvey and Legora as the runaway leaders in the race for law firms and corporate legal departments. Those who can get in may prefer to write larger checks to the two companies rather than spread their bets across younger startups. Investors may also be waiting to see how the model labs change the game. OpenAI, Anthropic, Google, and Microsoft are all moving deeper into the legal market. That could make investors wary of startups that look like thin wrappers around the same underlying models. I’ll be looking for other explanations at the TLTF Summit. Tell me your theories. Quick links A", "date_str": "2026-11-16T15:00:22+00:00", "hash": "479e3d5fa26253fe", "title_fa": "آیا تأمین مالی فناوری حقوقی از بین می رود؟ اعداد را بررسی کردیم.", "summary_fa": "شبکه ایالات متحده آمریکا؛ مجموعه نقره ای; گتی ایماژ; پیکسار (WALL-E)؛ آلیسا پاول/BI من برای اجلاس TLTF به اسکاتسدیل می روم، یک گردهمایی فقط دعوت شده از رهبران شرکت های حقوقی، مشاوران عمومی، و سازندگان استارت آپ، با یک سوال: آیا زمستان برای فناوری حقوقی در راه است؟ در این شماره ذکر شده است: ویکتور وانگ، ایلا، کرانچ بیس، هاروی، لگورا، آنتروپیک، دیویس پولک، نیکی شیور، لیا، لاتهام واتکینز، کراسبی، نورم، آتیکوس، فینچ، تئو آی، آیریس، ایو، جی مادسواران، امیلی هاوارد، ردش مورچه‌الر، امیلی هاوارد، ردش مورچه و آلر. سرمایه گذاری برای فناوری حقوقی چرخش شدیدی پیدا می کند آنچه من می خوانم و می نویسم نام های بسیار انسانی فناوری حقوقی دارندگان و نداشته های فناوری حقوقی وینستون واینبرگ، مدیر عامل هاروی، و مکس جونسترند، مدیرعامل لگورا. رسانه رویداد بزرگ/ گتی ایماژ یک پست لینکدین از وکیل تجاری ویکتور وانگ هفته گذشته توجه من را به خود جلب کرد. وانگ به داده‌های استارت‌آپ Eilla اشاره کرد که نشان می‌دهد پس از حذف get back to basics. The Polish troops, who were tasked with assaulting a target with drones, had to cross dozens of miles of forest and farmland in just a few days, during which they were hunted by drones with thermal cameras, dogs, and US Army paratroopers , NATO said in a statement this month. Completing the mission meant doing so without the cutting-edge technology that special operations forces are known for. \"Indeed, on the modern battlefield, sophisticated electronics can broadcast a team's location, leading to their capture,\" NATO said. NATO special forces units have long leveraged what the alliance described as \"high-tech wizardry\" to operate in stealth, while relying on jets for air support and helicopters for surprise insertion and rapid extraction . Russia's war against Ukraine has demonstrated the potential vulnerabilities of overreliance on some high-end tech . \"When both sides have night vision goggles, nobody owns the night,\" NATO said in its statement, adding that \"the proliferation of advanced heat-sensing thermal optics makes moving undetected even more difficult.\" On top of this, air defense systems fielded on both sides prevent fighter jets and helicopters from getting too close to the front lines. NATO special operators during the Deep Strike exercise. NATO photo Furthermore, drones have turned the front lines into what Ukrainian soldiers and officials describe as a miles-wide kill zone , where any movement can be tracked, leading to instantaneous pinpoint strikes. As they watched the kill zone evolve and grow, NATO military leaders decided to create an exercise that would test how soldiers could survive on a battlefield like the one in Ukraine . US Special Operations Command Europe created the scenario —", "date_str": "2026-11-16T14:56:39+00:00", "hash": "d30ee0c8c5edfe42", "title_fa": "نیروهای ویژه غربی بدون «جادوگری با فناوری پیشرفته» خود برای زنده ماندن در یک منطقه کشتار مانند آنچه در اوکراین است، آموزش می بینند", "summary_fa": "نیروهای ویژه ناتو بدون تجهیزات پیشرفته برای زنده ماندن در میدان جنگی مانند اوکراین آموزش می بینند. عکس نیروی هوایی ایالات متحده نیروهای ویژه لهستان در حال آموزش برای عملیات بدون تجهیزات پیشرفته هستند. برخی از تجهیزات را می توان در جنگ مدرن پر از پهپاد مانند جنگ اوکراین ردیابی کرد. ارتش های غربی سربازان نخبه خود را در سناریوهایی آزمایش می کنند که آنها را مجبور می کند کمتر دیجیتال و بیشتر آنالوگ باشند. کماندوهای نخبه ناتو بدون تجهیزات پیشرفته آموزش می بینند تا مطمئن شوند که می توانند در میدان های نبرد مدرن مانند آنچه در اوکراین وجود دارد، زنده بمانند، جایی که برخی تجهیزات پیشرفته را می توان به راحتی توسط پهپادهای دشمن و سایر حسگرها ردیابی کرد. نیروهای ویژه لهستان اخیراً اولین کسانی بودند که در \"ضربه عمیق\"، یک تمرین جدید ناتو که برای آزمایش چگونگی بازگشت اپراتورهای غربی به اصول اولیه طراحی شده است، شرکت کردند. ناتو در بیانیه ای در ماه جاری اعلام کرد که سربازان لهستانی که وظیفه حمله به یک هدف با هواپیماهای بدون سرنشین را بر عهده داشتند، مجبور شدند ده ها مایل از جنگل و زمین کشاورزی را تنها در چند روز عبور دهند و طی آن توسط پهپادها با دوربین های حرارتی، سگ ها و چتربازان ارتش آمریکا شکار شدند. تکمیل این مأموریت به معنای انجام این کار بدون فناوری پیشرفته ای بود که نیروهای عملیات ویژه به آن شهرت دارند. ناتو گفت: «در واقع، در میدان نبرد مدرن، تجهیزات الکترونیکی پیشرفته می‌توانند موقعیت یک تیم را پخش کنند و منجر به دستگیری آن‌ها شود.» واحدهای نیروهای ویژه ناتو مدت‌هاست که از آنچه ائتلاف به عنوان «جادوگری با فناوری پیشرفته» توصیف می‌کند، برای عملیات پنهان‌کاری استفاده می‌کنند، در حالی که به جت‌ها برای پشتیبانی هوایی و هلیکوپترها برای جابجایی غافلگیرانه و استخراج سریع تکیه می‌کنند. جنگ روسیه علیه اوکراین", "image_url": "https://i.insider.com/6afb0c81b2c29afb4e56b462?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۵ آبان • ۱۸:۲۶"}, {"source": "Business Insider", "title": "I tried Ina Garten's 'grown-up' mac and cheese. It puts a delicious twist on a traditional Thanksgiving side dish.", "link": "https://www.businessinsider.com/ina-garten-grown-up-mac-and-cheese-recipe-2026-11", "summary": "I made Ina Garten s grown-up mac and cheese, and it s perfect for Thanksgiving. Anneta Konstantinides/Business Insider I made Ina Garten's \"grown-up\" mac and cheese recipe. The recipe features Gruyère, extra-sharp cheddar, and blue cheese, plus bacon and breadcrumbs. I thought Garten's mac and cheese was delicious and perfect for Thanksgiving. The holidays are nearly upon us, which means it's time to indulge in one of the most universally beloved pastas. I'm talking about mac and cheese , obviously. I'm a huge fan of Ina Garten's pasta recipes ( I've even ranked them! ), so I decided to try her \"grown-up\" mac and cheese in time for Thanksgiving. Ina Garten s grown-up mac and cheese features bacon, basil, and plenty of cheese. Anneta Konstantinides/Business Insider To make Garten's \"grown-up\" mac and cheese for four, you'll need: 4 cups of elbow macaroni or cavatappi 4 slices of white sandwich bread 8 ounces of Gruyère cheese, grated 6 ounces of extra-sharp cheddar, grated 4 ounces of blue cheese, crumbled (Garten recommends Roquefort) 8 ounces of thick-sliced bacon 3 cups of milk 4 tablespoons of all-purpose flour 4 tablespoons of unsalted butter 4 tablespoons of freshly chopped basil leaves ½ teaspoon of freshly ground black pepper Pinch of nutmeg First, I preheated the oven to 400 degrees Fahrenheit and prepped the bacon. Anneta Konstantinides/Business Insider I arranged my bacon on a sheet pan in one layer. Garten recommends placing a baking rack over the sheet pan, but I just lined mine with aluminum foil to avoid making a greasy mess. I cooked my bacon for 15 minutes, until the strips turned crisp, then transferred them to a plate lined with a paper towel. While the bacon was in the oven, I prepped my breadcrumbs and started cooking the pasta. Anneta Konstantinides/Business Insider I sliced the crusts off my sandwich bread before cutting each slice into smaller pieces. I also roughly chopped ت بازرگانی ایالات متحده یک قانون نهایی موقت را با هدف جلوگیری از دسترسی از راه دور به تراشه‌های هوش مصنوعی پیشرفته که کنترل‌های صادراتی کشور را دور می‌زند، منتشر کرد. در بیانیه آمده است: «پیشرفت سریع در محاسبات ابری و زیرساخت‌های SI دسترسی به قابلیت‌های محاسباتی پیشرفته آمریکا را از راه دور، از جمله از طریق مراکز داده واقع در خارج از کشورهای مشمول محدودیت‌های صادراتی ایالات متحده، به طور فزاینده‌ای ممکن کرده است. این اقدام در حالی صورت می‌گیرد که انویدیا در پی رسوایی که منجر به استعفای جنسن هوانگ، مدیرعامل این شرکت شد، در مورد صادرات تراشه‌های هوش مصنوعی خود با بررسی‌های شدید مواجه است. سهام انویدیا در معاملات قبل از بازار تا 3.9 درصد کاهش یافت. این یک داستان در حال توسعه است. برای به روز رسانی دوباره بررسی کنید. مقاله اصلی را در Business Insider بخوانید", "image_url": "https://i.insider.com/6afb0be9cbe2120470735c9b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه", "بورس و طلا"], "datetime_fa": "۲۵ آبان • ۱۷:۳۲"}, {"source": "Business Insider", "title": "A Ukrainian drone maker says that if it had to do business facing Western levels of bureaucracy, it wouldn't exist", "link": "https://www.businessinsider.com/ukraine-drone-maker-says-with-wests-level-bureaucracy-wouldnt-exist-2026-11", "summary": "Ukrainian drone maker TechEx says the West should rethink its level of regulation to be fast and agile enough for modern, large-scale war. Pavlo Bahmut/Ukrinform/Sipa USA via Reuters Connect Ukraine's defense industry works differently from the West, with less bureaucracy. One key drone maker said that with such heavy levels of regulation, \"we wouldn't exist.\" The West wants to learn from Ukraine's speed and flexibility, and questions some bureaucratic steps. A Ukrainian drone maker said it wouldn't exist if it had to grapple with Western-style weapons regulations, warning that cutting the red tape can be key to keeping pace in modern warfare. Ukraine's defense industry operates at speeds that many Western partner nations admire and say they ought to learn from. The pace is born in part from authorities allowing companies to bypass traditional structures to work directly with units. Many Ukrainian companies have warned that their Western partners ought to adopt a less rigid, more flexible approach if they are going to be ready for a possible large-scale conflict, TechEx, which makes fiber-optic and interceptor drones, works with more than 100 units and was the first Ukrainian company to receive NATO codification for fiber-optic FPV drones . Its team started experimenting in 2022, and it was formally registered in 2024. Oleg, a TechEx executive, told Business Insider that had it needed to adhere to strict pre-war regulations similar to those governing defense companies in the West, \"we wouldn't exist.\" Ukraine's experience suggests that \"the regulations and the amount of the bureaucracy or the paperwork required for those things to launch or to produce anything should be definitely reduced,\" he said. If Russia attacks Europe, Oleg said, \"there will be no time for the bureaucracy. There will be no time for the paperwork or any kind of approval to 100 levels by the checking authorities.\" After Russia launched its full-scale invasion in February 2022, Ukraine pivoted away from its old system for procuring weapons and arming troops, toward more decentralized operations. Ukraine still has certain regulations, but troops have better access to industry and vice versa. Key weaponry like drones, electronic warfare, and robotics is dominated by agile firms that are allowed to work directly with units to test, request, and buy what they need. Defense products can be authorized for use without meeting traditional peacetime testing requirements as long as they meet the ", "date_str": "2026-11-16T13:44:01+00:00", "hash": "65345011c93bbcd4", "title_fa": "یک سازنده هواپیمای بدون سرنشین اوکراینی می‌گوید که اگر مجبور بود با سطوح بوروکراسی غربی تجارت کند، وجود نداشت.", "summary_fa": "سازنده هواپیما  tennis injury and poor sleep explained why he looked “grizzled” in a recent interview. Michael Nagle/Bloomberg via Getty Images Bill Ackman said a tennis injury and poor sleep explained his \"grizzled\" appearance in an interview. After he spoke on Bloomberg TV on Friday, X users criticized Ackman's appearance. The hedge fund billionaire also said he wasn't helped by bad lighting and having dry skin. Bill Ackman has an explanation for why he looked \"grizzled\" in an interview last week: a tennis injury, two sleepless nights, dry skin, and bad lighting. After a clip of Friday’s interview circulated on X, commenters questioned the Pershing Square founder's appearance, saying he looked older. \"Markets have really done a number on Bill here?\" one user wrote. Another asked whether it was \"really Bill Ackman\" and why he looked \"so old and out of shape.\" A third said he appeared to have \"aged 20 years in the last 6 months.\" In a Sunday post, Ackman, 60, set the record straight. His explanation involved no dramatic market losses: He had hurt his back playing tennis, slept badly, and the lighting in the interview did him no favors. The post was pinned to the top of his X account. Yesterday, some of you in the @X community expressed concern about my health based on how grizzled I looked in a Bloomberg interview I did on the street this past Friday. I explained to those concerned that I had pulled out my back, couldn’t work out for a week, and had trouble… https://t.co/fq9I0y23Ks — Bill Ackman (@BillAckman) November 15, 2026 He had trouble sleeping because of the pain, he said, and joked that the resulting look made him seem a decade older. The tennis-loving Ackman then joked that he looked like John McEnroe, who is seven years his senior. The interview that sparked the commentary had focused on AI. Ackman told Bloomberg he was sad to see Jensen Huang leave Nvidia and said he was impressed by Anthropic CEO Dario Amodei’s presentation at the company’s New York IPO road show. Those remarks, however, took a back seat to a debate about his face. Ackman followed up with a recovery report. He said the team at VOSK Center, a luxury New York-based performance and longevity club, helped him return to exercise with electrical stimulation, work on his back and hip muscles, and weights. VOSK, which called Ackman one of its founding members , shared a video of him taking on a pull-up challenge. \"The back is still stiff but I can walk again,\" Ackman wrote, thanking", "date_str": "2026-11-16T13:38:53+00:00", "hash": "6141bcf9ffc2dde4", "title_fa": "\"نور بد، پوست خشک\": بیل آکمن توضیحی برای متنفرانی دارد که می‌گفتند او به نظر می‌آید:", "summary_fa": "بیل آکمن گفت که آسیب دیدگی تنیس و بد خوابی توضیح می دهد که چرا او در مصاحبه اخیر \"خس خس\" به نظر می رسید. مایکل ناگل/ بلومبرگ از طریق گتی ایماژ بیل آکمن گفت که آسیب دیدگی تنیس و بد خوابی ظاهر \"خارخ\" او را در مصاحبه ای توضیح می دهد. پس از صحبت او در تلویزیون بلومبرگ در روز جمعه، کاربران X از ظاهر آکمن انتقاد کردند. میلیاردر صندوق تامینی همچنین گفت که نور بد و داشتن پوست خشک کمکی به او نکرده است. بیل آکمن توضیحی برای این که چرا در مصاحبه هفته گذشته او \"غیره\" به نظر می رسید، دارد: مصدومیت تنیس، دو شب بی خوابی، پوست خشک و نور بد. پس از پخش کلیپی از مصاحبه روز جمعه در X، نظر دهندگان ظاهر بنیانگذار Pershing Square را زیر سوال بردند و گفتند او پیرتر به نظر می رسید. \"بازارها واقعاً در اینجا تعداد بیل را انجام داده اند؟\" یک کاربر نوشت دیگری پرسید که آیا واقعاً بیل آکمن است و چرا او اینقدر پیر و نامتناسب به نظر می رسد. سومی گفت که به نظر می رسد \"در 6 ماه گذشته 20 سال سن داشته است.\" در یک پست یکشنبه، آکمن 60 ساله، رکورد را ثابت کرد. توضیح او متضمن هیچ ضرر چشمگیری در بازار نبود: او در بازی تنیس کمرش آسیب دیده بود، بد خوابیده بود و نور در مصاحبه هیچ لطفی به او نکرد. پست به بالای حساب X او پین شد. دیروز، برخی از شما در انجمن X@ بر اساس اینکه در مصاحبه ای که جمعه گذشته در بلومبرگ در خیابان انجام دادم، در مورد سلامتی من ابراز نگرانی کردند. به کسانی که نگران بودند توضیح دادم که کمرم را بیرون کشیده بودم turn the Cybercab into a shiny gold lawn ornament. The autonomous EV \"will not operate\" without an autonomy subscription, according to Tesla's Cybercab order and subscription agreements, which were uploaded to Tesla's website over the weekend. Those who get the green light to order a Cybercab will also only be able to drive it within the limits of Tesla's Robotaxi ride-hailing service . Right now, that includes parts of Austin, Dallas, and three other cities in Texas, as well as Miami, Orlando, and Tampa in Florida. But owners will not be able to add their Cybercabs to the service and make money from them, a key part of the robotaxi pitch Musk has been making for nearly a decade . That's not the only catch. Like other limited-edition vehicles Tesla has released, Cybercab owners are barred from reselling their robotaxis without the company's permission. Those who do face a $50,000 penalty, and Tesla might also remotely brick your vehicle. More unusually, the Cybercab's order agreement says that Tesla can repurchase the vehicle \"at any time,\" at a fair market value determined by the company. A replacement is not guaranteed, and owners have to pay the cost of shipping their Cybercab back to Tesla. Tesla Cybercabs on a lot in Austin, Texas. Jay Janner/The Austin American-Statesman via Getty Images Other details buried in the fine print include a ban on modifications, including wraps and tinted windows. Would-be Cybercab owners should also be aware that Tesla will be collecting their data. That includes personally identifying data such as location data and \"cabin camera image data\" recorded by a camera above the rear-view mirror, per the autonomy subscription agreement, which states that ", "date_str": "2026-11-16T13:07:13+00:00", "hash": "8f04076b9c4aac79", "title_fa": "پرداخت نکردن اشتراک 299 دلاری Cybercab تسلا، آن را به یک زیورآلات طلایی براق چمنزار تبدیل می کند.", "summary_fa": "تسلا روز جمعه اعلام کرد که فروش Cybercab را برای استفاده شخصی فقط به صورت دعوتی آغ m that let users scan major data breaches, dark web marketplaces, and private forums to see if their personal information had ended up in the hands of hackers. But the company discontinued the service at the start of 2026, with new scans stopping on Jan. 15 and all accounts deleted on Feb. 16. Google says it sunsetted Dark Web Report because, although the information it provided was generally useful, the service failed to provide helpful next steps for users whose data was found on the dark web. Google promised a new service that would provide more actionable intel, but that service has yet to materialize, and there haven t been any further announcements about it yet. Dark Web Report may not have been perfect, but it was the only early warning system of its kind that was available for personal use and let users run scans free of cost. Now that it s gone, however, there are plenty of other services that offer the same service at varying costs and levels of effectiveness. Let s talk through the nature of the insight that Google's reports offered, how it collected that information in the first place, and what options exist in the market to replace it. How the Dark Web Report worked Google launched the Dark Web Report in March 2023 as a premium feature available to Google One users, but later extended it for free to anyone with a Google account and moved it to the \"Results about you\" dashboard. You'd set up a monitoring profile with your name, date of birth, physical address, phone number, emails, and Social Security Number if you lived in the U.S. After that, you could head to the dashboard anytime you wanted to run a free scan across dark web forums and marketplaces, publicly disclosed corporate data breaches, and other hidden online spaces to see if any of your personal information had shown up there. It was easy to use but not a lot of people knew it existed in the first place. What made Google pull the plug on Dark Web Report It s unclear what prompted the intern nance, and people fit together, turning AI from a collection of tools into part of the enterprise operating model. For Thorsten Leiduck, SVP and global head of SAP Business AI Platform Ecosystem, that shift begins with treating AI as an enterprise platform rather than a collection of disconnected projects. “AI is absolutely dependent on the data foundation,” he says, arguing that companies need a connected, semantically rich layer that reflects their business before they can reliably deploy AI across processes. The stakes also change as AI moves into mission-critical workflows. For some everyday applications, “80% might be good enough,” he says, but in areas such as supply chains or financial close, that level of accuracy is “a very terrible result.” That foundation also determines which AI applications are worth pursuing. Satinder Pal Singh, associate VP North America for SAP BAIP and SAP AI Strategy at Infosys, frames AI agents as “digital coworkers” and recommends evaluating potential use cases through three lenses: impact, feasibility, and scalability. Companies should identify where an agent can move meaningful business metrics, determine whether their data and talent can support the use case, and then establish whether successful applications can be replicated. “A pilot that can t scale is just an experiment,” he says. Scaling also brings governance into sharper focus. Clear policies, access controls, monitoring, and oversight are necessary to ensure agents remain trustworthy and aligned with business requirements. “The absence of governance doesn t speed up AI adoption,” Singh says. “It creates a risk backlog” that can ultimately force a more disruptive stop and audit. Those considerations will become more important as AI agents take on more responsibilities as digital coworkers. Both executives see a future in which agentic systems coordinate work across applications, while customer-specific knowledge graphs and governed data become critical enterprise asset       media: [{"source": "Billboard", "title": "Steve Aoki Earns His First Dance Airplay No. 1 With Ely Oaks & SACHA Collab ‘Gravity’", "link": "https://www.billboard.com/music/chart-beat/steve-aoki-gravity-number-1-dance-airplay-chart-1236382973/", "summary": "Sixteen years after his first appearance on Billboard ’s Dance Airplay chart, Steve Aoki earns his first No. 1, as “Gravity,” with Ely Oaks and SACHA, rises one place on the Nov. 21-dated chart. Released in July via Dim Mak Records, the song reaches the summit thanks to a 20% increase in plays at the format in the Nov. 6-12 tracking week, according to Luminate. The Dance Airplay chart measures songs’ weekly plays, as tabulated by Mediabase and provided to Billboard by Luminate, on a panel of dance-formatted radio stations in the United States. “Gravity” also earns Ely Oaks his first Dance Airplay No. 1 and SACHA, her second, after “Set Me Free” with Armin van Buuren in January. Aoki first appeared on Dance Airplay in April 2010 with “I’m in the House,” featuring Zuper Blahq (a pseudonym of will.i.am). He has since earned nine top 10s. Steve Aoki’s Dance Airplay Top 10s: Peak Position, Title, Peak Date No. 1, “Gravity,” with Ely Oaks and SACHA, Nov. 21, 2026 No. 7, “Heartless,” with Mia Takarabe, Oct. 17, 2026 No. 2, “I’m Going Out,” with Sam Feldt and Xandra (Nile Rodgers Zak Abel), March 22, 2025 No. 4, “Hungry Heart,” with Galantis and Hayley Kiyoko, June 24, 2023 No. 3, “Save Me,” with HRVY, Sept. 17, 2022 No. 6, “Imagine,” with Frank Walker feat. AJ Mitchell, Nov. 7, 2020 No. 4, “Let It Be Me,” feat. Backstreet Boys, Dec. 7, 2019 No. 4, “Waste It on Me,” feat. BTS, Dec. 22, 2018 No. 5, “Just Hold On,” with Louis Tomlinson, March 4, 2017 “Gravity” is Aoki’s second chart-topping song of 2026, following “YAPAQUE,” with Farruko and Greeicy. That track led both Latin Airplay and Latin Rhythm Airplay in August, giving Aoki his first No. 1s on any Latin chart. On the albums side, Aoki has topped the Top Dance Albums chart twice: Neon Future I in 2014 and Neon Future III in 2018. “Gravity” also marks the second Dance Airplay No. 1 for Dim Mak Records, the independent Los Angeles-based label and lifestyle brand that Aoki founded in 1996 as a student at UC Santa Barbara. The label first led the chart in 2021 with Aviella’s “Tell Me What You’re Thinking” and had most recently reached the top 10 with Z3LLA’s No. 8-peaking “Supernova” in February.", "date_str": "2026-11-16T15:59:24+00:00", "hash": "bc18c685641cf6e1", "title_fa": "استیو آئوکی اولین نمایش رقص شماره 1 خود را با الی اوکس و ساچا کولب \"Gravity\" به دست آورد.", "summary_fa": "شانزده سال پس از اولین حضورش در جدول رقص ایرپلی بیلبورد، استیو آئوکی اولین شماره 1 خود را به دست آورد، زیرا \"جاذبه\" با الی اوکس و ساچا یک پله در جدول تاریخ 21 نوامبر صعود کرد. طبق گزارش Luminate، این آهنگ که در ماه جولای از طریق Dim Mak Records منتشر شد، به لطف افزایش 20 درصدی پخش در قالب در هفته پیگیری 6 تا 12 نوامبر به قله رسید. نمودار Dance Airplay پخش هفتگی آهنگ‌ها را اندازه‌گیری می‌کند، همانطور که توسط Mediabase جدول‌بندی شده و توسط Luminate در پانل ایستگاه‌های رادیویی با فرمت رقص در ایالات متحده ارائه شده است. \"جاذبه\" همچنین اولین نمایش رقص شماره 1 را برای الی اوکس به ارمغان می آورد و بعد از \"مرا آزاد کن\" با آرمین ون بورن در ژانویه، ساچا دومین نمایشنامه اوست. آئوکی اولین بار در آوریل 2010 در Dance Airplay با \"I'm in the House\" با حضور Zuper Blahq (نام مستعار will.i.am) ظاهر شد. او از آن زمان تاکنون موفق به کسب 9 رتبه برتر 10 شده است. 10های برتر پخش رقص استیو آئوکی: موقعیت اوج، عنوان، تاریخ اوج شماره 1، «جاذبه» با الی اوکس و ساچا، 21 نوامبر 2026، شماره 7، «بی دل»، با میا تاکارابه، 17 اکتبر، 2026، سام فِه‌لد، 2026، سم. (نیل راجرز زاک آبل)، 22 مارس 2025 شماره 4، «قلب گرسنه»، با گالانتیس و هیلی کیوکو، 24 ژوئن 2023، شماره 3، «نجات من،» با HRVY، 17 سپتامبر 2022 شماره 6، «Imagine feet» با فرانک فید. ای جی میچل، شماره 4، 7 نوامبر 2020، «بگذار من باشم» شاهکار. بک استریت بویز، دسامبر 7، 2019 شماره 4، «این را روی من هدر بده،» شاهکار. BTS، 22 دسامبر 2018 شماره 5، \"Just Hold On\"، با لوئیس تاملینسون، 4 مارس 2017 \"Gravity\" دومین آهنگ برتر جدول آئوکی در سال 2026 است، پس از \"YAPAQUE\" با Farruko و Greeicy.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/P1148N9P-e1768247982923.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۹:۲۹"}, {"source": "Billboard", "title": "Dominic Fike Earns His Second Alternative Airplay No. 1 With ‘Babydoll’", "link": "https://www.billboard.com/music/chart-beat/dominic-fike-babydoll-number-1-alternative-airplay-chart-1236382968/", "summary": "Dominic Fike scores his second No. 1 on Billboard ’s Alternative Airplay chart (dated Nov. 21) as “Babydoll” rises two spots. Fike first topped the chart in 2019 with his breakthrough single, “3 Nights.” He returned to the list once after that, before “Babydoll,” with “Chicken Tenders” (No. 34 peak in 2020). Both of his leaders come from the same project: “Babydoll” and “3 Nights” were each introduced on his 2018 EP, Don’t Forget About Me, Demos , the project that preceded his three studio albums. “Babydoll” found a new audience in early 2026 when it became a popular sound on TikTok, eight years after its original release. The song was then newly promoted, along with 2025 track “White Keys.” The run of “Babydoll” at alternative radio accompanies its broader success. Earlier this month, “Babydoll” became Fike’s first No. 1 on Pop Airplay. In October, it reached No. 10 on the multimetric Billboard Hot 100 , giving Fike his first top 10. It was also a top three hit on both the Billboard Global 200 and the Billboard Global Excl. U.S. charts in April. (“White Keys” hit No. 32 on the Hot 100 the same month.) “Babydoll,” released via Sandy Boys/Columbia/Legacy, is the second Alternative Airplay No. 1 for Columbia Records in 2026, following Tame Impala’s “Dracula” in February. The Alternative Airplay chart measures songs’ weekly plays, as tabulated by Mediabase and provided to Billboard by Luminate, on 60 U.S. alternative radio stations. “Babydoll” hits No. 1 with support on stations including WTBV Tampa, Fla.; KYRK Corpus Christi, Texas; and KRAT Reno, Nev. Fike released his third studio album, How to Quit Smoking , on Oct. 30. The set reached No. 14 on the Alternative Airplay chart and No. 69 on the Billboard 200 . All charts dated Nov. 21 will update Tuesday, Nov. 17, on Billboard.com.", "date_str": "2026-11-16T15:51:15+00:00", "hash": "0e1d88010f25fad2", "title_fa": "دومینیک فیک دومین بازی جایگزین شماره 1 خود را با «Babydoll» به دست آورد.", "summary_fa": "دومینیک فیک دومین شماره 1 خود را در جدول پخش جایگزین بیلبورد (مورخ 21 نوامبر) به دست آورد که «Babydoll» دو پله صعود کرد. فیک اولین بار در سال 2019 با آهنگ موفقیت آمیز خود \"3 Nights\" در صدر جدول قرار گرفت. او یک بار بعد از آن، قبل از «Babydoll» با «مراقصه مرغ» (نمره 34 قله در سال 2020) به لیست بازگشت. هر دو رهبر او از یک پروژه می آیند: \"Babydoll\" و \"3 Nights\" هر کدام در EP 2018 او، Don't Forget About Me, Demos، پروژه ای که قبل از سه آلبوم استودیویی او بود، معرفی شدند. «Babydoll» در اوایل سال 2026، زمانی که هشت سال پس از انتشار اولیه‌اش به یک صدای محبوب در TikTok تبدیل شد، مخاطبان جدیدی پیدا کرد. سپس این آهنگ به همراه آهنگ 2025 \"White Keys\" به تازگی تبلیغ شد. اجرای \"Babydoll\" در رادیو جایگزین موفقیت گسترده تر آن را همراهی می کند. اوایل این ماه، «Babydoll» اولین شماره 1 فیک در پاپ ایرپلی شد. در ماه اکتبر، به رتبه 10 در 100 بیلبورد داغ چند متری رسید و اولین 10 رتبه برتر را برای فیک به ارمغان آورد. همچنین در Billboard Global 200 و Billboard Global Excl جزو سه مورد برتر بود. نمودارهای ایالات متحده در ماه آوریل. («White Keys» شماره 32 را در Hot 100 در همان ماه به دست آورد.) «Babydoll» که از طریق Sandy Boys/Columbia/Legacy منتشر شد، دومین پخش Alternative Airplay No. 1 برای Columbia Records در سال 2026، پس از Tame Impala \"Dracula\" در فوریه. نمودار Alternative Airplay پخش هفتگی آهنگ‌ها را که توسط Mediabase جدول‌بندی شده و توسط Luminate در اختیار بیلبورد قرار گرفته است، در 60 ایستگاه رادیو niting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Most recently, Saturn served for nearly eight years as chief marketing officer of SESAC Music Group, leading global brand strategy, corporate communications, affiliate engagement and digital licensing modernization across multiple entities. Saturn s career has also included time at Columbia Records as senior vp of digital marketing, where she built digital sales and marketing platforms for artists including Adele, The Chicks, Beyoncé, John Legend, AC/DC, Bruce Springsteen and more. She is an alumna of Leadership Music (Class of 2024) and a former board member at Gilda’s Club of Middle Tennessee and Watkins College of Art at Belmont University. Related Five Reasons Country Has the Top 5 Songs on the Billboard Hot 100 for the First Time “Creating this new role reflects our commitment to Music City and our vibrant new Nashville office in Wedgewood-Houston,” Elizabeth Matthews , ASCAP CEO, said in a statement. “As a native Nashvillian who is widely respected and deeply connected across creative and music industry circles, Samantha brings the relationships and strategic vision needed to effectively represent ASCAP and champion our members. We are excited to welcome her to the team.” “Nashville has become a global destination for music creation, with songwriters and composers collaborating across genres and boundaries every day,” Saturn said in a statement. “I’m honored to join Elizabeth Matthews, Brian Roberts, Nicole George-Middleton and the entire ASCAP team to support our members, build partnerships across the city’s creative community, and make our Wedgewood-Houston office a true home for ASCAP creators.”", "date_str": "2026-11-16T15:24:52+00:00", "hash": "cd01a0cbf6f24979", "title_fa": "ASCAP از سامانتا زحل به عنوان مدیر کل ASCAP نشویل نام می برد", "summary_fa": "انجمن آهنگسازان، نوی ه فینیگان، که کارگردانی و بازیگری آن را بر عهده داشت. حذف فیلم اسرائیلی پس از تهدیدات بایکوت: ما ساندنس نیستیم، درست است؟ جشنواره Tribeca Lisboa همچنین جوزفین برندگان جایزه ساندنس را با بازی میسون ریوز،چنینگ تیتوم و جما چان به کارگردانی بت دی آرائوخو و کارگردان لوئیس پکستون The Incomer به همراه برنده خرس نقره ای برلیناله، ملکه دریا، از کارگردان لنس همر و با بازی ژولیت بینا، رزرو کرده است.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Bob-Odenkirk-Alec-Baldwin-Isla-Fisher-Split-Getty-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۵ آبان • ۱۹:۳۰"}, {"source": "Hollywood Reporter", "title": "Casting James Bond Is Easy. Finding the Perfect Villain Is Hard", "link": "https://www.hollywoodreporter.com/movies/movie-features/casting-james-bond-villain-hard-1236752409/", "summary": "As Denis Villeneuve prepares to reboot 007, everyone’s obsessing over who’ll wear the tuxedo. But the trickier job will be finding the right fit for the Nehru jacket.", "date_str": "2026-11-16T16:00:00+00:00", "hash": "d260cf6939fc2568", "title_fa": "انتخاب جیمز باند آسان است. پیدا کردن شرور کامل سخت است", "summary_fa": "در حالی که دنیس ویلنوو برای راه اندازی مجدد 007 آماده می شود، همه وسواس دارند که چه کسی این لباس را بپوشد. اما کار دشوارتر پیدا کردن مناسب برای کت نهرو است. گلدفینگر از پنجره هواپیما مکیده شد. دکتر نو در یک محفظه راکتور رادیواکتیو تا حد مرگ جوشیده شد. و کانانگا؟ او به زور با یک گلوله گاز فشرده تغذیه شد و مانند یک هیندنبورگ انسانی منفجر شد. در حالی که تمام جهان در مورد اینکه چه کسی به عنوان جیمز باند بعدی انتخاب می شود وسواس داشت، تقریباً به نقش واقعاً مهم توجه کافی نشده است - چه کسی به عنوان شخصیت شرور بعدی باند به طرز شگفت انگیزی می میرد. آن‌ها به ندرت دختر را می‌گیرند - و حتی وقتی می‌گیرند، معمولاً او را به داخل استخری پر از پیرانا می‌برند - اما آدم‌های بد در فیلم‌های باند به اندازه خود 007 برای فرنچایز حیاتی هستند. شاید حتی بیشتر از این. واقعیت این است که جیمز باند بدون توجه به نقش او، جیمز باند خواهد بود. چه جک لودن، کالوم ترنر یا جاش او کانر باشد - یا هرکس دیگری که ممکن است در حال حاضر در لندن در حال آزمایش صفحه نمایش باشد - می توانید با بانک در مونت کارلو شرط بندی کنید که همه آنها شخصیت را تقریباً به یک شکل به تصویر می کشند: سردرگم، با اعتماد به نفس فوق العاده و به زیبایی بی رحمانه. همانطور که جورج لازنبی با شان کانری متفاوت بود، و تیموتی دالتون از راجر مور، و دنیل کریگ از پیرس برازنان بود، همه آنها در همان تاکسیدی که به صورت متعارف طراحی شده بود زندگی می کردند. داستان‌های مرتبط فیلم‌های جیمز باند یافت شده: رابرت پتینسون برای بازی 007 فیلم‌ها از کرم‌های شنی تا 007: جو واکر در تپه‌های شنی: قسمت سوم، ویلنوو، مک‌کوئین و باند،", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/20col_Bond-Villians_Final-SPLASH-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۵ آبان • ۱۹:۳۰"}, {"source": "Hollywood Reporter", "title": "Beyoncé Becomes First Artist to Receive 100 Grammy Nominations", "link": "https://www.hollywoodreporter.com/music/music-news/beyonce-grammys-history-100-nominations-1236756177/", "summary": "The superstar once again made history Monday morning when she secured a nomination in the best R B solo performance category ahead of the February show.", "date_str": "2026-11-16T15:49:43+00:00", "hash": "3547095e7fe04dc6", "title_fa": "بیانسه اولین هنرمندی شد که 100 نامزدی جایزه گرمی دریافت کرد", "summary_fa": "این سوپراستار بار دیگر بامداد دوشنبه با نامزدی در بخش بهترین اجرای انفرادی R B قبل از نمایش فوریه، تاریخ ساز شد. بیانسه بار دیگر در حال ثبت تاریخ گرمی است. پس از کسب نامزدی در بخش بهترین اجرای انفرادی R B، این سوپراستار اولین هنرمندی بود که در طول دوران حرفه‌ای خود موفق به کسب 100 نامزدی گرمی شد. بیانسه در حال حاضر رکورد بیشترین جایزه در تاریخ گرمی را در اختیار دارد و از رهبر ارکستر فقید گئورگ سولتی برای رکورد 32 برنده پیشی گرفته است. او ابتدا با برنده شدن در جایزه گرمی 2023 در بخش بهترین آلبوم رقص/الکترونیک به این افتخار دست یافت. بیانسه پس از کسب سه جای  زن در جشنواره‌های بین‌المللی کم نداریم. ما آنجا هستیم.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Cairo-women-filmmakers.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۵ آبان • ۱۹:۰۲"}, {"source": "Variety", "title": "Anti-Crypto Activist Ben McKenzie to Moderate ‘The Altruists’ Premiere Q&A With Julia Garner, Anthony Boyle, Graham Moore (EXCLUSIVE)", "link": "https://variety.com/2026/tv/news/ben-mckenzie-the-altruists-julia-garner-anthony-boyle-1236947738/", "summary": "Ben McKenzie will moderate the premiere Q A for Netflix’s “The Altruists” with stars Julia Garner and Anthony Boyle and showrunner Graham Moore on Nov. 19 in New York, the same day the series premieres on the streamer. Known now as an anti-crypto activist as well as an actor, McKenzie followed his successful runs on television [ ]", "date_str": "2026-11-16T15:30:00+00:00", "hash": "1e8dbd5f63701b1b", "title_fa": "بن مک‌کنزی، فعال ضد رمزنگاری، پرسش و پاسخ نخست «نوخواهان» با جولیا گارنر، آنتونی بویل، گراهام مور را تعدیل می‌کند (اختصاصی)", "summary_fa": "بن مک‌کنزی اولین نمایش QA را برای «نودوکاران» نتفلیکس با حضور ستارگان جولیا گارنر و آنتونی بویل و گراهام مور مجری برنامه در 19 نوامبر در نیویورک، در همان روزی که این سریال برای اولین بار در استریمر پخش می‌شود، مدیریت خواهد کرد. مک کنزی که اکنون به عنوان یک فعال ضد رمزنگاری و همچنین بازیگر شناخته می شود، اجرای موفق خود را در تلویزیون دنبال کرد [ ] \"همه به خاطر پول به شما دروغ می گویند\" در ژوئن 2025 در SXSW لندن نمایش داده شد و در چندین جشنواره دیگر بازی کرد. توزیع‌کننده مستقل The Forge در مارس 2025 حقوق توزیع و فروش را به دست آورد، و فیلم از آوریل 2026 اکران محدودی داشت. اوون گلیبرمن از Variety فیلم را به‌عنوان «سرزنده، تیز، بی‌عیب و نقص» توصیف کرد و گفت: «به هر سوالی پاسخ می‌دهد که شریکی برای شما قابل تصور است، اما هنوز هم به دنبال یک شریک است. در حال حاضر برای اجاره از طریق Eventive، C5.now، Amazon و Kanopy در ایالات متحده موجود است. بویل و گارنر در فیلم «نوخواهان» در نقش کارولین الیسون بازی می‌کنند. سریال محدود نتفلیکس که در 19 نوامبر برای اولین بار به نمایش در می آید، رمزارز بانی و کلاید را از طریق ظهور و سقوط FTX، صرافی ارزهای دیجیتال و صندوق تامینی که توسط Bankman-Fried تأسیس شده است، دنبال می کند. بانکمن-فرید در اوج خود، چهل و یکمین آمریکایی ثروتمند در فهرست فوربس 400 بود. FTX در نوامبر 2022 پس از افشای شواهدی مبنی بر کلاهبرداری مجبور به ورشکستگی شد. بانکمن-فرید در دسامبر 2022 دستگیر شد و از آن زمان به 25 سال زندان محکوم شد. الیسون قبل از آزادی در ژانویه به 24 ماه زندان محکوم شد و 14 ماه را گذراند. این مجموعه هشت قسمتی توسط گراهام مور و با الهام از مقالات مجله نیویورک نوشته", "image_url": "https://variety.com/wp-content/uploads/2026/11/Altruists.BenMcKenzie.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۲۵ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "Jesús López, Legendary Latin Music Executive, to Become a Chairman Emeritus at Universal Music Group", "link": "https://variety.com/2026/music/news/jesus-lopez-chairman-emeritus-universal-music-group-1236948939/", "summary": "Jesús López, one of the most important executives in Latin music history, will take on a new role at Universal Music Group as Chairman Emeritus, Global Talent Services, UMG’s artist management and services company. López continues a career encompassing five decades in music and 30 years in leadership positions at UMG, most recently as Chairman [ ]", "date_str": "2026-11-16T15:08:23+00:00", "hash": "3248b1f2c3d9cc85", "title_fa": "ژسوس لوپز، مدیر اجرایی موسیقی لاتین افسانه ای، رئیس بازنشسته در گروه موسیقی یونیورسال می شود", "summary_fa": "ژسوس لوپز، یکی از مهمترین مدیران تاریخ موسیقی لاتین، نقش جدیدی را در گروه موسیقی جهانی به عنوان رئیس بازنشسته، خدمات استعدادهای جهانی، شرکت مدیریت و خدمات هنرمندان UMG به عهده خواهد گرفت. لوپز به حرفه ای شامل پنج دهه در موسیقی و 30 سال در سمت های رهبری در UMG ادامه می دهد، اخیراً به عنوان رئیس [ ] ژسوس لوپز، یکی از مهم ترین مدیران تاریخ موسیقی لاتین، نقش جدیدی در گروه موسیقی یونیورسال به عنوان رئیس بازنشسته، خدمات استعدادهای جهانی، مدیریت هنرمندان و خدمات شرکت UMG به عهده خواهد گرفت. لوپز به مدت پنج دهه در موسیقی و 30 سال در سمت های رهبری در UMG ادامه می دهد که اخیراً به عنوان رئیس و مدیر عامل شرکت یونیورسال موزیک آمریکای لاتین شبه جزیره ایبری است. او با Lucian Grainge، رئیس هیئت مدیره و مدیر عامل UMG، برای ایجاد یک طرح جانشینی، با جزئیات که در هفته‌های آینده اعلام می‌شود، کار کرده است. داستان‌های مرتبط تایکا وایتیتی منتقدان «کلارا و خورشید» را به‌عنوان «بی‌ربط»، «ارواح گمشده غم‌انگیز» مورد انتقاد قرار می‌دهد و می‌گوید که ۱۵ سال است «نقدی نخوانده است: اما من به مردم گوش می‌دهم» که توسط لوپز طراحی شده است، GTS در سال ۲۰۰۷ راه‌اندازی شد، یک هنرمند برجسته، با تمرکز بر خدمات لاتین، به یک کتاب تبلیغاتی برجسته تبدیل شد. مشارکت، با دفاتر در هشت کشور، و Narcís Rebollo به عنوان رئیس و مدیرعامل آن - و اکنون لوپز به عنوان رئیس بازنشسته. لوپز همچنین به کار خود با خانه هنر جولیو ریس کوپلو ادامه خواهد داد. همکاری UMG با هنرستان آکادمی ترکیبی از آموزش، مربیگری، و توسعه هنرمندان است و به پرورش استعدادها کمک می کند، از جمله برندگان متوالی جایزه لاتین بهترین هنرمند جدید، Joaquina (2023) و Ela Taubert (2024).", "image_url": "https://variety.com/wp-content/uploads/2022/04/Jesus-Lopez-e1794841562256.jpg?w=958&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۳۸"}, {"source": "Variety", "title": "‘Survivor’ Season 52 Premiere Date Set at CBS in Midseason Slate", "link": "https://variety.com/2026/tv/news/survivor-season-52-premiere-date-cbs-1236948922/", "summary": "Survivor returns with Season 52 with a two-hour premiere on Feb. 24, CBS announced alongside a slate of midseason premieres. New series Einstein, Stacks of Cash and the reimagined Undercover Boss with Drew Carey have been given early 2027 dates, as well as the Golden Globes, hosted by Nikki Glaser. View CBS full midseason schedule [ ]", "date_str": "2026-11-16T15:00:00+00:00", "hash": "b7c7ec390d34e6e4", "title_fa": "تاریخ پخش فصل 52 \"Survivor\" در CBS در Midseason Slate تنظیم شده است.", "summary_fa": "شبکه سی بی اس اعلام کرد که در کنار برنامه ای برای اولین بار در میانه فصل، Survivor با فصل 52 با پخش دو ساعته در 24 فوریه باز می گردد. سریال‌های جدید انیشتین، پشته‌های پول نقد و رئیس مخفی بازسازی‌شده با درو کری تاریخ‌های اوایل سال ۲۰۲۷ و همچنین گلدن گلوب به میزبانی نیکی گلاسر داده شده‌اند. مشاهده برنامه کامل نیم فصل CBS [ ]", "image_url": "https://variety.com/wp-content/uploads/2026/08/Survivor.jpg?w=1000&#038;h=563&#038;crop=1", "category": "سینما و سریال", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Jesús López Steps Down as Head of Universal Music Latin America/Iberian Penninsula, Named Chairman Emeritus of UMG’s Global Talent Services", "link": "https://www.billboard.com/pro/jesus-lopez-leaves-universal-music-latin-shifts-to-gts/", "summary": "Jesús López , the longtime head of Universal Music’s entire Latin music business and one of the most iconic and influential executives in Latin music, will step down from his longtime position as chairman/CEO of Universal Music Latin America/Iberian Penninsula, Billboard can officially announce. López will take on a new role as chairman emeritus for Global Talent Services (GTS), the UMG artist management, booking, promotion and services company that he launched in 2007 and which today has offices in eight countries. In his new capacity, he will continue to provide his longtime expertise and knowledge of the Spanish-language music market and its artists. Narcis Rebollo will remain as president/CEO of GTS. Related Universal Music Latin America Unveils Executive Appointments for its Next Phase of Evolution’ CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive On the label side, López has been working with Sir Lucian Grainge , chairman and CEO of UMG, to put in place a succession plan, “with details to be announced in due course,” according to a Universal release. No further information about a successor was available at press time. “Jesús is an industry icon who has helped change the course of Latin music on the world stage,” said Grainge in a statement. “Throughout our industry’s evolution he has been a tireless advocate for the creative community, building a team that has advanced the careers of countless superstars. I’m grateful for the care he’s taken to prepare the business for the future and delighted that he’ll help shape the future of GTS, a company born of his own vision for serving artists. I look forward to continuing our work together.” López added: “As I begin this next chapter within UMG, I’m incredibly proud of what we’ve built together: a company that believes in artists early, stays with them and helps their music travel further than anyone imagined. I look forward to welcoming my successor and supporting our teams as they build on that success. As Chairman of GTS, I will continue pursuing a passion that has guided my entire career: helping artists realize the full scope of their ambitions. I’m grateful to Lucian for his trust and support over so many years, and excited to continue working with him and our teams to create new opportunities for artists.” Related Universal Music Lat", "date_str": "2026-11-16T15:00:00+00:00", "hash": "290c84d0c456529a", "title_fa": "ژسوس لوپز به عنوان رئیس یونیورسال موسیقی آمریکای لاتین/شبه‌جزیره ایبری کناره‌گیری کرد و به عنوان رئیس بازنشسته خدمات استعدادهای جهانی UMG معرفی شد.", "summary_fa": "بیلبورد می‌تواند رسماً اعلام کند، ژسوس لوپز، رئیس قدیمی کل تجارت موسیقی لاتین یونیورسال موزیک و یکی از نمادین‌ترین و تأثیرگذارترین مدیران در موسیقی لاتین، از سمت طولانی‌مدت خود به‌عنوان رئیس/مدیرعامل یونیورسال موزیک آمریکای لاتین/شبه‌جزیره ایبری کناره‌گیری می‌کند. لوپز نقش جدیدی را به عنوان رئیس بازنشسته برای خدمات استعدادهای جهانی (GTS)، شرکت مدیریت، رزرو، ارتقاء و خدمات هنرمندان UMG که در سال 2007 راه‌اندازی کرد و امروز در هشت کشور دفاتر دارد، برعهده خواهد گرفت. در سمت جدید، او به ارائه تخصص و دانش دیرینه خود در مورد بازار موسیقی اسپانیایی زبان و هنرمندان آن ادامه خواهد داد. نارسیس ربولو به عنوان رئیس/مدیرعامل GTS باقی خواهد ماند. موسیقی یونیورسال مرتبط آمریکای لاتین از قرارهای اجرایی برای فاز بعدی تکامل خود رونمایی می‌کند. نشانه‌های CL با THEBLACKLABEL، اتحاد مجدد با تدی، تهیه‌کننده قدیمی، برای لحظه‌ای کامل، شرایط جوی شدید، بندهای شعاع و یافتن نسل بعدی از عناوین جشنواره: لوپز با سر Lucian Grainge، رئیس و مدیر عامل UMG همکاری کرده است تا یک طرح جانشینی را اجرا کند، \"با جزئیات که در زمان مناسب اعلام خواهد شد\"، طبق یک نسخه یونیورسال. هیچ اطلاعات بیشتری در مورد جانشین در زمان انتشار در دسترس نبود. Grainge در بیانیه ای گفت: «Jesús یک نماد صنعتی است که به تغییر مسیر موسیقی لاتین در صحنه جهانی کمک کرده است. \"در طول تکامل صنعت ما، او یک مدافع خستگی ناپذیر برای جامعه خلاق بوده است، و تیمی را ایجاد می کند که مشاغل فوق ستاره های بی شماری را ارتقا داده است. من از مراقبتی که او برای آماده کردن کسب و کار برای آینده انجام داد سپاسگزارم و خوشحالم که او به شکل دادن به آینده GTS کمک خواهد کرد، شرکتی که برگرفته از دیدگاه خودش برای خدمت به هنرمندان است. من مشتاقانه منتظر ادامه کار مشترکمان هستم.» لوپز اضافه کرد: «همانطور که فصل بعدی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Jesus-Lopez-cr-Universal-Music-Group-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Greeicy Talks About Her No. 1 Hit ‘YAPAQUE,’ Karol G and Motherhood | Cafecito Con", "link": "https://www.billboard.com/video/greeicy-talks-about-no-1-hit-yapaque-karol-g-motherhood/", "summary": "Greeicy brings laughs and a very special surprise guest to “Cafecito Con,” and shares how acting alongside Karol G inspired her to “dream bigger.” In a warm, candid conversation, she talks about her life, career, and the people who inspire her. She also looks back on her first No. 1 on the Billboard charts with “YAPAQUE,” alongside Farruko and Steve Aoki. The singer and actress discusses how her relationship with social media has changed and what it means to share personal moments with her fans, including her experience as a mom. She also reflects on her childhood dreams and the creative journey that led her to music and acting, and explains why she loves connecting with fans while traveling and performing. Plus, she shares what makes creating music with Mike Bahía so special. Jessica Roiz: Hey, Greeicy. Oh, welcome to Cafecito Con. So happy to have you here. Greeicy: It’s been a while. Jessica Roiz: Yes, it’s true, it’s true. It’s been a while, like a few days. Well, Greeicy, we’re here at Macondo Coffee Roasters in Downtown. Barista: Well, welcome, welcome. Greeicy: Thank you so much. Barista: This is your home. Are you a café con leche person? Greeicy: Bitter. Jessica Roiz: Yes. And you don’t add sugar? Greeicy: No. I added sugar for many years, but they taught me that coffee is drunk without sugar. Barista: Whoever taught you that, I think it’s very good. Jessica Roiz: So, I’m going to get the seasonal one, which is the banana milk pumpkin pie latte. Barista: That’s my favorite. Divine. Greeicy: And that one has milk? Barista: Banana. Greeicy: Oh, banana milk? From which banana? Barista: They squeeze the milk from the banana. Greeicy: From which banana? Barista: Banana milk. I wish it were like that. Greeicy: That coffee is… I want it. Barista: Oh, my goodness. Perfect. So we have the order ready. Enjoy your super coffee. Greeicy: Thank you. Jessica Roiz: Well, actually, I heard somewhere that you’re bringing us a little surprise today, but… Greeicy: Oh, yes, a little surprise. Jessica Roiz: Yes? Greeicy: And I’ve had it by my side all day. Jessica Roiz: Oh. Ooh, okay, let’s see what it is, but later, while we wait for the coffee. And I want you to tell me a bit about what was happening in these posts. They’re… Okay? Keep watching for more!", "date_str": "2026-11-16T15:00:00+00:00", "hash": "a79aa6ab08fbc6f9", "title_fa": "Greeicy درباره آهنگ شماره 1 خود 'YAPAQUE'، Karol G و Motherhood صحبت می کند | Cafecito Con", "summary_fa": "Greeicy خنده و یک مهمان غافلگیرکننده بسیار ویژه را برای Cafecito Con به ارمغان می‌آورد و به اشتراک می‌گذارد که چگونه بازی در کنار کارول جی الهام بخش او برای «رویاهای بزرگ‌تر» شده است. در یک گفتگوی صمیمانه و گرم، او در مورد زندگی، حرفه و افرادی که به او الهام می‌دهند صحبت می‌کند. او همچنین با «YAPAQUE» در کنار Farruko و Steve Aoki به اولین شماره 1 خود در نمودارهای بیلبورد نگاه می کند. این خواننده و بازیگر درباره چگونگی تغییر رابطه اش با رسانه های اجتماعی و به اشتراک گذاشتن لحظات شخصی با طرفدارانش، از جمله تجربه خود به عنوان مادر، صحبت می کند. او همچنین در مورد رویاهای دوران کودکی خود و سفر خلاقانه ای که او را به سمت موسیقی و بازیگری سوق داد منعکس می کند و توضیح می دهد که چرا دوست دارد در سفر و اجرا با طرفداران ارتباط برقرار کند. به علاوه، او آنچه را که خلق موسیقی را با مایک باهیا بسیار خاص می‌کند، به اشتراک می‌گذارد. جسیکا رویز: هی، گریسی. اوه، به Cafecito Con خوش آمدید. خیلی خوشحالم که اینجا هستید گریسی: مدتی گذشت. جسیکا رویز: بله، درست است، درست است. مدتی گذشت، مثل چند روز. خوب، گریسی، ما اینجا در Macondo Coffee Roasters در مرکز شهر هستیم. باریستا: خوب، خوش آمدید، خوش آمدید. گریسی: خیلی ممنون. باریستا: اینجا خانه شماست. آیا شما یک آدم کافه دار هستید؟ گریسی: تلخ. جسیکا رویز: بله. و شکر اضافه نمیکنید؟ گریسی: نه. من سالها شکر اضافه کردم، اما به من یاد دادند که قهوه بدون شکر نوشیده می شود. باریستا: هر کسی که این را به شما آموخت، فکر می کنم خیلی خوب است. جسیکا رویز: بنابراین، من می‌خواهم آن فصلی را تهیه کنم، که لاته پای کدو حلوایی شیر موز است. باریستا: این مورد علاقه من است. الهی. گریسی: و اون یکی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Artboard-1-copy-9.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Madonna & Slayyyter Lead 2027 Dance/Electronic Grammy Nominations", "link": "https://www.billboard.com/music/awards/2027-grammy-nominees-dance-electronic-madonna-slayyyter-1236382910/", "summary": "Madonna , Slayyyter , Tame Impala and Tinashe lead the nominees in the dance/electronic categories at the 2027 Grammy Awards. Related Grammy Nominations 2027: See the Complete List RAYE Rosalía Lead 2027 Grammy Nominations as Women Make History Snubs Surprises In the 2027 Grammy Nominations Nominees were announced early on Monday (Nov. 16), setting up the race for the awards ceremony happening Feb. 7 in Los Angeles. As widely predicted, Madonna leads the pack, with nominations in all four of the dance electronic categories. Her July album Confessions II generated nods for best dance/electronic album, best dance/electronic recording, best dance pop recording and best remixed recording. Meanwhile, Slayyyter comes in second on the list, with her March album Wor$t Girl In America getting nods in the best dance/electronic album category along with best dance/electronic recording and best dance pop recording. Tame Impala and Tinashe follow, each getting a pair of nominations in the dance fields. See the complete list of nominees across the dance/electronic categories below. Best Dance/Electronic Album Madonna, Confessions II Robyn, Sexistential Skrillex, Soma Slayyyter, Wor$t Girl In America Tame Impala, Deadbeat Best Dance/Electronic Recording Fred again.., Lights Burn Dimmer Madonna, I Feel So Free Slayyyter, Crank Tame Impala, My Old Ways Tinashe, Melatonin Underscores, Music Best Dance Pop Recording Zara Larsson, Blue Moon Madonna, Danceteria Raye, Life Boat. Slayyyter, Dance Tinashe, Too Easy Best Remixed Recording Fred again.., Ca7riel Paco Amoroso, Beto s Horns (Fred remix) Bruno Mars, I Just Might (Austin Millz Remix) Madonna, Love Sensation (Stuart Price Remix with Madonna Kylie Minogue) Taylor Swift, Opalite (Chris Lake Remix) Nine Inch Nails Boys Noize, A Question of Trust (Boys Noize Remix) Raye, Where Is My Husband! (David Guetta Remix)", "date_str": "2026-11-16T14:46:40+00:00", "hash": "edcac19c030eb87c", "title_fa": "مدونا و اسلایتر، نامزدهای رقص/الکترونیک گرمی 2027", "summary_fa": "مدونا، اسلایتر، تم ایمپالا و تیناشه نامزدهای بخش رقص/الکترونیک در جوایز گرمی 2027 هستند. نامزدهای مربوط به گرمی 2027: فهرست کامل را ببینید نامزدهای گرمی 2027 RAYE Rosalía پیشتاز به عنوان زنان تاریخ ساز را غافلگیر می کند نامزدهای گرمی 2027 در اوایل روز دوشنبه (16 نوامبر) معرفی شدند و مسابقه برای مراسم اهدای جوایز در Lob برگزار شد. همانطور که به طور گسترده پیش بینی شده بود، مدونا با نامزدی در هر چهار دسته الکترونیکی رقص، رهبری گروه را بر عهده دارد. آلبوم ژوئیه او Confessions II برای بهترین آلبوم رقص/الکترونیک، بهترین رقص/ضبط الکترونیکی، بهترین ضبط پاپ رقص و بهترین ضبط ریمیکس تمجید کرد. در همین حال، Slayyyter با آلبوم مارس Wor$t Girl In America در رتبه دوم لیست قرار می گیرد و در رده بهترین آلبوم رقص/الکترونیک به همراه بهترین رقص/ضبط الکترونیکی و بهترین ضبط پاپ رقص رتبه اول را کسب کرد. Tame Impala و Tinashe دنبال می‌شوند و هر کدام یک جفت نامزدی در زمینه رقص دریافت می‌کنند. فهرست کامل نامزدها در دسته‌های رقص/الکترونیک را در زیر ببینید. بهترین آلبوم رقص/الکترونیک مدونا، Confessions II Robyn، Sexistential Skrillex، Soma Slayyyter، Wor$t Girl In America Tame Impala، Deadbeat بهترین رقص/ضبط الکترونیکی Fred..، Lights Burn Dimmer Madonna، I Feel So Free Old Slayyyter، Cranslatin موسیقی بهترین رقص پاپ ضبط شده زارا لارسون، مدونا ماه آبی، دانستریا ری، قایق نجات. Slayyyter, Dance Tinashe, Too Easy Best Remixed Remixed Fred again.., Ca7riel Paco Amoroso, Beto s Horns (Remix Fred) Bruno Mars, I Just Might ( Austin Millz Remix) Madonna, Love Sensation ( استوارت پرایس ریمیکس با مدونا تالیور مینویکس ) نه اینچ میخ پسران نویز، سوال اعتماد (ریمیکس پسران نویز) ری، شوهرم کجاست! (ریمیکس دیوید گتا)", "image_url": "https://www.billboard.com/wp-content/uploads/2026/06/madonna-press-2026-credit-Rafael-Pavarotti-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۱۶"}, {"source": "Billboard", "title": "LCD Soundsystem to Headline First of Manchester’s New Platt Fields Park Concerts in 2027", "link": "https://www.billboard.com/music/music-news/lcd-soundsystem-manchester-platt-fields-park-show-2027-1236382887/", "summary": "LCD Soundsystem will headline Manchester’s Platt Fields Park next summer, marking the return of live music at the venue for the first time in more than 15 years. The show, announced on Monday (Nov. 16) will take place on July 30 and be the first of a new series of 25,000-capacity outdoor gigs planned at the venue next year, with further headline acts set to be revealed in the coming weeks. The legendary New York band, led by James Murphy, will be joined by a slate of support acts including Mercury Prize-winning Scottish group Young Fathers, rising duo Cowboy Hunters and DJs Erol Alkan and Luke Una. Tickets will go live at 10 a.m. GMT on Nov. 20 and will be available via Plattform , where further information can be found. The park s last major shows took place in 2011, when the Parklife Weekender brought a host of acts to Platt Fields, including Chase Status, Kelis, Two Door Cinema Club, Mark Ronson, Jamie xx and Skrillex, among others. The festival later moved to Heaton Park, its current home, in 2013 as it expanded. Sam Kandel, event director and founder of promoters The Warehouse Project, said in a statement: We re so proud to be part of the team delivering the return of live music events to Platt Fields Park. Everyone in the city knows Platt Fields has its own unique character, shaped by its fantastic location and the diverse communities who live alongside it, and we re planning to create some truly special moments and memories there for everyone. He added: The return of LCD Soundsystem to Manchester, performing in the beautiful surrounds of Platt Fields Park, after nearly a decade away is, we think, the perfect place to start! The event will run as a collaboration between The Warehouse Project, Live Nation and SJM Concerts. Councilor Shazia Butt, executive member for culture, leisure and libraries for Manchester City Council, added: “With 2027 already set to be yet another massive year of live music in the city bringing with it huge benefits for the city’s economy, local businesses and our residents we’re looking forward to adding to this next summer with the return once more of live music to our amazing Platt Fields Park, and to welcoming even more visitors to our fantastic city. We ll be working closely with concert organizers to ensure maximum benefit for Platt Fields and for the local community from the gigs, both in the run-up to, during and after they ve taken place, and we look forward to sharing more information on this in the coming months. LC", "date_str": "2026-11-16T14:36:06+00:00", "hash": "314788e0919b0abf", "title_fa": "ال سی دی ساوندسیستم به عنوان اولین کنسرت جدید پارک پلات فیلدز منچستر در سال 2027 سرلوحه قرار خواهد گرفت.", "summary_fa": "ال سی دی ساوندسیستم تابستان آینده در پارک پلات فیلدز منچستر قرار خواهد گرفت و برای اولین بار در بیش از 15 سال، بازگشت موسیقی زنده به این مکان را رقم خواهد زد. این نمایش که در روز دوشنبه (16 نوامبر) اعلام شد در 30 جولای برگزار می شود و اولین سری از کنسرت های فضای باز با ظرفیت 25000 نفر خواهد بود که در سال آینده در محل برنامه ریزی شده است، با تیترهای بعدی که قرار است در هفته های آینده فاش شوند. گروه افسانه‌ای نیویورکی به رهبری جیمز مورفی به گروهی از حامیان از جمله گروه اسکاتلندی Young Fathers برنده جایزه مرکوری، دوتای نوظهور Cowboy Hunters و دی‌جی‌های Erol Alkan و Luke Una ملحق خواهند شد. بلیت‌ها در ساعت 10 صبح به وقت گرینویچ در 20 نوامبر پخش می‌شوند و از طریق Plattform در دسترس خواهند بود، جایی که اطلاعات بیشتر را می‌توانید پیدا کنید. آخرین نمایش های مهم پارک در سال 2011 برگزار شد، زمانی که Parklife Weekender مجموعه ای از نمایش ها را به Platt Fields آورد، از جمله Chase Status، Kelis، Two Door Cinema Club، Mark Ronson، Jamie xx و Skrillex و غیره. این جشنواره بعداً در سال 2013 با گسترش آن به پارک هیتون، خانه فعلی آن منتقل ش
