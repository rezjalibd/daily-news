  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>

      --card-border: #232f48;

      --primary: #38bdf8;
      --primary-hover: #0284c7;

      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;

      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;

    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;

      --read-bg: #f1f5f9;

      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;

    .container {

      margin: 0 auto;

      transition: all 0.3s ease;

    .header-actions {

      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;

      font-weight: 600;

    .btn-action:hover {

      font-weight: 800;

      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;

    .search-input:focus {
      border-color: var(--primary);

    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

tps://www.independentpersian.com/node/423164/%DA%A9%D9%84%DB%8C%D9%87-%D8%B3%D9%87%E2%80%8C%D9%88%D9%86%DB%8C%D9%85-%D9%85%DB%8C%D9%84%DB%8C%D8%A7%D8%B1%D8%AF-%D8%AA%D9%88%D9%85%D8%A7%D9%86%D8%8C-%D9%85%D8%BA%D8%B2-%D8%A7%D8%B3%D8%AA%D8%AE%D9%88%D8%A7%D9%86-%DA%86%D9%87%D8%A7%D8%B1-%D9%85%DB%8C%D9%84%DB%8C%D8%A7%D8%B1%D8%AF%D8%9B-%DA%86%D9%87%D8%B1%D9%87-%D8%B9%D8%B1%DB%8C%D8%A7%D9%86-%D9%81%D9%82%D8%B1", "summary": "همزمان با گسترش فقر و سقوط قدرت خرید خانواده‌ها در ایران، گزارش‌های تازه از خیابان‌های تهران ابعاد تکان‌دهنده‌ای از بحران معیشتی در نظام جمهوری اسلامی ایران را آشکار می‌کند. در خیابان فرهنگ حسینی تهران که به «خیابان کلیه» شهرت یافته، دیوارها و درهای ساختمان‌ها از آگهی فروش اعضای بدن پر شده است. البته فروشندگان تنها به عرضه کلیه هم اکتفا نکرده‌اند و در میان آگهی‌ها، برای فروش کبد، مغز استخوان و حتی بیضه نیز اعلام آمادگی شده است. خبرنگار ایلنا در گزارشی میدانی، با شماری از فروشندگان اعضای بدن گفت‌وگو کرده است؛ این افراد در انواع مشاغل از پیک موتوری و کارگر ساختمانی گرفته تا مشاغل آزاد کار می‌کنند و برای پرداخت بدهی، تأمین پول رهن خانه یا جبران هزینه‌های زندگی حاضر شده‌اند بخشی از بدنشان را بفروشند. این گزارش در شرایطی منتشر می‌شود که طی سال‌های گذشته، همزمان با افزایش تورم، گرانی مسکن، کاهش ارزش ریال و سقوط دستمزدها، آگهی‌های فروش اعضای بدن به یکی از نشانه‌های بحران فقر در ایران تبدیل شده‌ است. اکنون روایت‌های تازه نشان می‌دهد که فشار اقتصادی حتی برخی افراد شاغل و دارای درآمد را نیز به چنین نقطه‌ای رسانده است. عابران پیاده در خیابان فرهنگ حسینی و خیابان مجاور آن، والی‌نژاد، با انبوه آگهی‌های فروش اعضای بدن مواجه می‌شوند. نزدیکی این خیابان‌ها به انجمن خیریه حمایت از بیماران کلیوی و مراکز درمانی، باعث شده است افرادی که به دنبال عضو پیوندی‌اند و کسانی که قصد فروش عضو دارند، در این محدوده به یکدیگر نزدیک شوند. یکی از کارکنان بیمارستان صدرا، واقع در انتهای خیابان فرهنگ حسینی، می‌گوید انتظار برای دریافت کلیه از مسیر رسمی ممکن است تا چهار سال طول بکشد، به همین دلیل برخی خانواده‌ها خود مستقیم درصدد جست‌وجوی فروشنده برمی‌آیند. به گفتهٔ این فرد، قیمت‌های پیشنهادی ب ر را جوزپه والیتارا، وزیر آموزش ایتالیا، اعلام کرد و آن را احتمالاً یک «حمله سایبری، نه یک خطر واقعی» توصیف کرد. آقای والیتارا به تلویزیون ایتالیا گفت که پشت تهدیدهای گسترده در ایتالیا و سایر نقاط اروپا که پروازها، سوپرمارکت‌ها و حتی بیمارستان‌ها را هدف قرار دادند، یک راهبرد مشخص وجود دارد. ایمیل‌ تهدید به بمب‌گذاری به مدارس شهرهای رم، ناپل، ویچنزا، فلورانس، پیزا، تریسته و بسیاری دیگر از شهرهای ایتالیا ارسال شده‌ و به‌عنوان یک اقدام احتیاطی، ساختمان‌ مدارس تخیله شدند. جورجا ملونی، نخست‌وزیر ایتالیا، جلسه‌ای با حضور وزیران ارشد و رؤسای دستگاه‌های اطلاعاتی تشکیل داده است. خانم ملونی گفت که دولت گزارش‌های متعدد «تهدید به بمب‌گذاری در مؤسسات آموزشی» را از نزدیک زیر نظر دارد، هرچند بررسی‌ها تاکنون هیچ مدرکی دال بر «خطر ملموس» نشان نداده‌اند. او در فیسبوک نوشت: «به نظر می‌رسد این گزارش‌ها بیشتر با راهبرد ایجاد اضطرار و نگرانی مرتبط باشند.» هفته گذشته، فرودگاه‌های ایتالیا و همچنین شرکت‌های هواپیمایی در سایر نقاط اروپا مجموعه‌ای از تهدیدهای دروغین بمب‌گذاری دریافت کردند که موجب موج نگرانی‌، تخلیه اماکن و اختلالات گسترده شد. اگرچه یک گروه افراطی زن‌ستیز مسئولیت تعدادی از این تهدیدها را بر عهده گرفت اما بعداً هرگونه ارتباط خود را با این هشدارهای کاذب انکار کرد. بر اساس گزارش رسانه‌های ایتالیایی، ۲۸۰ مدیر مدرسه در روزهای اخیر تهدیدهایی دریافت کرده‌اند. بر اساس گزارش‌های منتشرشده از چندین منطقه، اگرچه روز چهارشنبه در ابتدا بسیاری از مدارس تخلیه شدند، وضعیت اضطراری به‌سرعت برداشته و به دانش‌آموزان اجازه داده شد به کلاس‌های درس برگردند. استفانیا پرویِتی، رئیس منطقه اومبریا در مرکز ایتالیا، در بیانیه‌ای گفت: «در بازرسی مدارس اومبریا چیزی یافت نشده و نیروهای انتظامی با سرعت و دقت در حال بررسی و راستی‌آزمایی تک‌تک گزارش‌ها هستند.»", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/82a9/live/dba5a0f0-ddda-11f1-b865-d17d8611efca.jpg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۰ آبان • ۱۷:۵۵"}, {"source": "Iran International", "title": "پس از رد پیشنهاد دستیاری گل‌محمدی؛ مجتبی حسینی هدایت مس شهربابک را بر عهده گرفت", "link": "https ndly 3D printer that supports four filament spools. It features an enclosed build chamber, automatic bed leveling, and a large touchscreen, making it easy to produce reliable prints. Where to Buy: $449 $369 at Elegoo Moft Trackable Tripod Wallet Moft’s Trackable Tripod Wallet is a MagSafe-compatible wallet that holds two cards and folds into an adjustable phone stand or small tripod. It also supports both Apple’s Find My network and Google’s Find Hub, offers Qi wireless charging, and includes a detachable shutter remote for taking photos. Where to Buy: $59.99 $50.99 at Amazon Govee Christmas String Lights 2 Govee’s Christmas lig", "date_str": "2026-11-11T15:53:55+00:00", "hash": "e7227f7e7cd3197f", "title_fa": "بهترین معاملات جمعه سیاه اولیه که می توانید از قبل خرید کنید", "summary_fa": "شمارش معکوس برای جمعه سیاه شروع شده است و اولین تخفیف ها ظاهر می شوند. اگرچه تعطیلات خرید به طور رسمی تا 27 نوامبر نیست، خرده فروشان در حال حاضر معاملات اولیه برخی از فناوری های مورد علاقه ما را کنار گذاشته اند. البته، با افزایش قیمت‌ها، یک تخفیف خوب لزوماً به این معنی نیست که شما از لحاظ تاریخی قیمت پایینی دریافت می‌کنید. اما ما همچنان شاهد تخفیف های ارزشمندی بر روی مجموعه ای از تجهیزات آزمایش شده هستیم که انتظار می رود در هفته های آینده بیشتر شود. در زیر، بهترین معاملات جمعه سیاه اولیه را که تاکنون پیدا کرده ایم جمع آوری کرده ایم. با نزدیک شدن به جمعه سیاه، همانطور که همیشه اتفاق می افتد، قیمت ها ممکن است بیشتر کاهش یابد، اما اگر ترجیح می دهید زودتر خرید کنید و عجله تعطیلات را شکست دهید، ارزش بررسی این معاملات را دارد. ما همچنان به به روز رسانی این راهنما ادامه خواهیم داد زیرا خرده فروشان بیشتری فروش تعطیلات خود را نیز راه اندازی می کنند، بنابراین حتماً با نزدیک شدن به رویداد اصلی، مرتباً آن را بررسی کنید. لیوان Ember 3 (14 اونس) جدیدترین لیوان هوشمند Ember به گونه ای طراحی شده است که قهوه شما را تا سه ساعت در دمای ایده آل نگه می دارد، با پنج تنظیم دمای بین 120 تا 145 درجه فارنهایت. نسخه نسل سوم مشابه مدل های قبلی است. با این حال، اکنون می توانید تنظیمات حرارت را مستقیماً روی لیوان تنظیم کرده و آن را در ماشین ظرفشویی بیندازید، که قبلاً اینطور نبود. کجا بخریم: 149.95 دلار 99.99 دلار در آمازون 149.95 دلار 99.99 دلار در بهترین حالت خرید 149.95 دلار 99.99 دلار در Ember Hisense CanvasTV (2026) CanvasTV 2026 Hisense یک تلویزیون QLED 4K است که وقتی تماشای دیوار را نمی بینید، به عنوان هنر دیواری عمل", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/268838_BF_CM_EARLY_DEALS_Headers_CVirginia.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple"], "datetime_fa": "۲۰ آبان • ۱۹:۲۳"}, {"source": "The Verge", "title": "Sharge’s eye-catching MacBook charger is over 25 percent off", "link": "https://www.theverge.com/gadgets/1031301/sharge-140w-gan-charger-lenovo-yoga-mini-desktop-pc-deal-sale", "summary": "Looking for a MacBook and device charger that’s as stylish as it is capable? Both Amazon and Sharge are selling the Pixel 140W GaN charger for $69.88 and $69.90, respectively, a $24 discount on its usual price. If you’re not in need of that much wattage but like the style, Sharge is also selling the 67W version for $19.90 ($30 off) or the 100W version for $59.90 ($16 off). Sharge Pixel 140 GaN Charger Where to Buy: $90.9 $69.88 at Amazon $90.9 $69.9 at Sharge The Pixel 140 delivers up to 140W of power when using only one of its three USB-C ports, which Sharge says is capable of taking a 16-inch MacBook Pro from a flat battery to 50 percent charge in just 25 minutes. It’s 47 percent smaller than the MacBook’s included charging brick as well, which is great if you’re tight on bag space or travel frequently. The pixel display on the side has configurable brightness and orientation, and displays your current charging wattage. Other deals to consider Halo fans looking for a fun weeknight project can grab Mattel’s Brick Shop Warthog on Amazon for $62.99 ($12 off), which is the lowest price we’ve seen on the brick-ified UNSC replica. The 935-piec  flew to Washington and spent three days and two nights at the senior-living facility , sleeping in the guest suite and meeting some of the residents. The campus, which is about an hour outside of Seattle, is made up of 228 units, which range from independent and assisted living arrangements to a secure memory-care section. Jody and I toured the first-floor independent-living apartments, which had tall ceilings and large windows. The natural light streamed in, and the view of the surrounding area was impressive. Each apartment had its own laundry room and a large kitchen with an island. In fact, the space was even better than my apartment back in California. Plus, I was impressed by the amenities, like a fitness room, a theater, a beauty salon, two dining rooms, and general activities. What really sold me, though, was getting to meet some of the other residents. While relaxing in the library, I actually met a woman from my hometown in Iowa who was 12 years older than me. We were mutua", "date_str": "2026-11-11T14:57:01+00:00", "hash": "01b77341f89e09b1", "title_fa": "من قسم خوردم که هرگز در یک جامعه سالمندان زندگی نخواهم کرد. من در 83 سالگی وارد این دانشگاه شدم و زندگی من پر جنب و جوش تر از همیشه است.", "summary_fa": "من هرگز نمی خواستم به یک مرکز زندگی مستقل نقل مکان کنم، اما پس از چهار سال اینجا، آن را دوست دارم. Rochelle Linick من هرگز نمی خواستم به یک جامعه سالمندان نقل مکان کنم، اما اکنون که اینجا هستم، در حال پیشرفت هستم. این روزها، من یک آپارتمان عالی، یک زندگی اجتماعی فعال و دوستان زیادی دارم. اکنون چهار سال از مهاجرتم می گذرد و زندگی من پر جنب و جوش تر از همیشه به نظر می رسد. در 83 سالگی، هرگز فکر نمی کردم که دوباره نقل مکان کنم. من قبلاً کوچک شده بودم، خانه ام را در لس آنجلس فروختم تا نزدیک دختر کوچکترم جودی باشم و زندگی جدیدی را در آپارتمانی در منطقه شرقی خلیج شروع کردم. زندگی خوب بود اما وقتی جودی به من گفت که او و همسرش قصد دارند خانه خود را بفروشند و به واشنگتن نقل مکان کنند، شگفت زده شدم. او توضیح داد که آنها در حال ساختن خانه ای در یک جامعه بالای 55  ویژگی‌های طراحی اعتیادآور، تبلیغات برای افراد خردسال و «الگوهای تاریک» مانند اشتراک‌هایی که به سختی لغو می‌شوند. طبق نسخه پیش نویس، جریمه برای عدم رعایت می تواند تا شش درصد از درآمد سالانه یک شرکت باشد. مایکل مک گرات، رئیس دادگستری اتحادیه اروپا در بیانیه‌ای گفت: «قوانین حمایت از مصرف‌کننده ما به ما کمک می‌کند تا اطمینان حاصل شود که کسب‌وکارها بر اساس شایستگی‌های محصولات و خدمات خود رقابت می‌کنند، نه بر اساس توانایی آنها در استثمار مصرف‌کنندگان یا توانایی آنها برای فرار از قوانین». \"ما کار را سخت تر نمی کنیم، بلکه انجام ناعادلانه تجارت را سخت تر می کنیم.\" این قانون به دنبال حمایت از مصرف‌کنندگان به روش‌های مختلف است، مانند ممنوع کردن الگوهای تاریک، اجبار به قیمت‌گذاری شفاف و شفاف آنلاین برای رویدادهای فرهنگی و ورزشی و اجازه دادن به مصرف‌کنندگان برای خاموش کردن «ویژگی‌های طراحی اعتیادآور که هزینه‌های بیش از حد یا اجباری را تشویق می‌کند. همچنین اعمال ناعادلانه ای را که تشویق به خرج کردن بیش از حد توسط خردسالان می شود، محدود می کند، مانند پرداخت به برد در بازی ها (لوت باکس) و درخواست های مداوم. DFA همچنین به بازاریابی تأثیرگذار می", "image_url": "https://www.engadget.com/img/gallery/europe-wants-to-ban-addictive-design-loot-boxes-and-dark-patterns-in-apps/l-intro-1794406701.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲۰ آبان • ۱۷:۵۹"}, {"source": "Zoomit", "title": "شخصیت‌های انیمیشن «ماشین‌ها» به دنیای واقعی می‌آیند؛ ربات‌های دوست‌داشتنی برای نمایش جای پارک", "link": "https://www.zoomit.ir/robotics-smart-machines/470950-disney-tests-parking-robots/", "summary": "والت دیزنی با همکاری استارتاپ Field AI نمونه‌ی اولیه‌ی یک ربات چهارچرخ هوشمند را برای هدایت رانندگان در پارکینگ‌ها به‌نمایش گذاشت.", "date_str": "2026-11-11T14:40:00+00:00", "hash": "ad197fbe083e16e7", "title_fa": "شخصیت‌های انیمیشن «ماشین‌ها» به دنیای واقعی می‌آیند؛ ربات‌های دوست‌داشتنی برای نمایش جای پارک", "summary_fa": "والت دیزنی با همکاری استارتاپ Field AI نمونه‌ی اولیه‌ی یک ربات چهارچرخ هوشمند را برای هدایت رانندگان در پارکینگ‌ها به‌نمایش گذاشت. تبلیغات والت دیزنی با همکاری استارتاپ Field AI نمونه‌ی اولیه‌ی یک ربات هدایت‌کننده‌ی پارک خودرو را معرفی کرد. سازندگان، ظاهر این ربات چهارچرخ را با الهام از شخصیت‌های انیمیشن محبوب «ماشین‌ها» طراحی کرده‌اند تا رانندگان را به‌سمت فضاهای خالی پارکینگ راهنمایی کند. شرکت رباتیک Field AI که مهندسان سابق گوگل دیپ‌مایند، ناسا، انویدیا و تسلا در سال ۲۰۲۳ میلادی آن را پایه‌گذاری کردند، این دستیار پارکینگ را با همکاری بخش والت دیزنی ایمجینیرینگ توسعه داده است. هدف از ساخت نمونه‌ی مورد بحث، ارزیابی عملکرد سیستم‌های خودران و بررسی شیوه‌ی واکنش مراجعان به دستیاران ماشینی اعلام می‌شود. ربات مورد نظر روی یک نمایشگر بزرگ شبیه به شیشه‌ی جلوی خودرو، چشم‌های متحرک و پلک‌های انیمیشنی را نشان می‌دهد. تابلوی متحرکی روی سقف دستگاه تعبیه شده است که پیام‌های جهت‌دهنده را برای راهنمایی رانندگان تغییر می‌دهد. در کنار نمایشگر و تابلو، دو بازوی مجهز به چراغ‌های قرمز نیز شبیه به ماموران هدایت هواپیماها در باند فرودگاه، مسیر دقیق را علامت می‌دهند تا ارتباط چندلایه‌ای میان راننده و ربات شکل بگیرد. مقامات دیزنی‌لند تأکید کرده‌اند که زمان‌بندی مشخصی برای بهره‌برداری عملیاتی در پارکینگ‌ها وجود ندارد و تکنولوژی رونمایی‌شده صرفا نمونه‌ی مفهومی است. شرکت‌های سازنده‌ی خودروهای خودران نیز با چالش مشابهی در انتقال مفاهیم ماشینی به انسان‌ها در ترافیک شهری روبه‌رو هستند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/disney-cars-parking-robot-6af43eed1e22a6ae5bd3ec1c?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Nvidia"], "datetime_fa": "۲۰ آبان • ۱۸:۱۰"}, {"source": "Zoomit", "title": "استرالیا به جنگ هوش مصنوعی سرکش می‌رود", "link": "https://www.zoomit.ir/ai-articles/470857-australia-ai-safety-regulator-penalties/", "summary": "استرالیا نهاد ناظر جدیدی برای ایمنی هوش مصنوعی با اختیارات گسترده جهت اعمال جریمه‌های سنگین علیه شرکت‌های متخلف تأسیس می‌کند.", "date_str": "2026-11-11T14:00:00+00:00", "hash": "632de15735a4118d", "title_fa": "استرالیا به جنگ هوش مصنوعی سرکش می‌رود", "summary_fa": "استرالیا نهاد ناظر جدیدی برای ایمنی هوش مصنوعی با اختیارات گسترده جهت اعمال جریمه‌های سنگین علیه شرکت‌های متخلف تأسیس می‌کند. تبلیغات دولت استرالیا نهاد نظارتی جدیدی برای ایمنی هوش مصنوعی تاسیس می‌کند که اختیارات گسترده‌ای برای اعمال «جریمه‌های سنگین» بر شرکت‌های متخلف خواهد داشت. آنتونی آلبانیزی ، نخست‌وزیر استرالیا، در کانبرا اعلام کرد لوایح قانونی مرتبط با این فناوری در حال تدوین است و سازمان جدید بخشی از همین چارچوب قانونی خواهد بود. بر اساس مقررات پیش‌رو، شرکت‌ها موظف می‌شوند حوادث امنیتی را فورا گزارش دهند و امکان ارزیابی مستقل مدل‌های خود را فراهم کنند. دولت استرالیا در بیانیه‌ای رسمی تأکید کرد محافظت‌های امنیتی اجباری از طریق استانداردهای مصوب، بر تمامی فعالان حوزه‌ی هوش مصنوعی پیشرو اعمال می‌شود. مؤسسه‌ی ایمنی هوش مصنوعی استرالیا نیز با نهاد نظارتی تازه همکاری می‌کند تا همگام با تحولات جهانی، نظارت فنی دقیقی اعمال شود. نگرانی‌ها پیرامون ایمنی این فناوری زمانی اوج گرفت که مدلی متعلق به اوپن‌ای‌آی وب‌سایت یکی از بخش‌های دولتی استرالیا را هک کرد. هرچند داده‌های شخصی حساسی افشا نشد، اما وقوع حادثه هشداری جدی درباره‌ی خطرات بالقوه به شمار رفت. بررسی‌های رسمی پس از نفوذ سایبری منجر به پیشنهاد اصلاح قوانین کیفری شد تا تخلفات فاحش با مجازات‌های سنگین روبه‌رو شوند. همچنین جرمی تحت عنوان «ناتوانی در پیشگیری» تعریف می‌شود تا اگر شرکتی اقدامات لازم برای جلوگیری از آسیب‌رسانی مدل‌های خود انجام ندهد، پاسخگو باشد. دولت استرالیا تمام توصیه‌های این بازنگری را پذیرفته است. آنتونی آلبانیزی می‌گوید: «ما دیده‌ایم که در سایر نقاط جهان بدون وجود چارچوب‌های ایمنی یا استانداردها چه اتفاقی افتاده است. در غیاب این سازوکارها، مقبولیت اجتماعی از بین می‌رود و ایمنی و امنیت تضعیف می‌شوند.» توسعه‌ی شتابان فناوری چالش‌های زیرساختی نیز به همراه داشته و احداث دیتاسنترها با مخالفت‌های محلی روبه‌رو شده است. اعتراض‌های اخیر در حومه‌ی سیدنی و ملبورن به لغو و تعلیق چند پروژه‌ی بزرگ", "image_url": "https://api2.zoomit.ir/media/rogue-artificial-intelligence-robot-face-6af2bc861e22a6ae5bd3e784?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۲۰ آبان • ۱۷:۳۰"}, {"source": "Zoomit", "title": "والپیپرهای اصلی ویندوز بازطراحی می‌شوند؛ نسخه‌های جدید چه‌شکلی‌اند؟", "link": "https://www.zoomit.ir/os/470961-windows-11-new-default-wallpapers/", "summary": "مایکروسافت در حال بازطراحی والپیپرهای پیش‌فرض ویندوز ۱۱ است که می‌تواند نشانه‌ای از تغییر استراتژی انتشار سیستم‌عامل تا سال ۲۰۲۷ باشد.", "date_str": "2026-11-11T13:59:36+00:00", "hash": "53e2e7f47e228885", "title_fa": "والپیپرهای اصلی ویندوز بازطراحی می‌شوند؛ نسخه‌های جدید چه‌شکلی‌اند؟", "summary_fa": "مایکروسافت در حال بازطراحی والپیپرهای پیش‌فرض ویندوز ۱۱ است که می‌تواند نشانه‌ای از تغییر استراتژی انتشار سیستم‌عامل تا سال ۲۰۲۷ باشد. تبلیغات مایکروسافت روی تصاویر پس‌زمینه‌ی کاملا جدیدی برای ویندوز ۱۱ کار می‌کند. تغییر تصویر شاخص سیستم‌عامل معمولا رویدادی فراتر از یک تحول ظاهری ساده به شمار می‌رود و مسیر توسعه‌ی آینده اکوسیستم ویندوز را مشخص می‌سازد. خلق والپیپرهای پیش‌فرض جدید اغلب حاکی از معرفی یک نسخه‌ی کاملا جدید مثل ویندوز ۱۲ یا یک بازنگری و نوسازی اساسی در نسل فعلی است. طبق بررسی‌های تخصصی، احتمال وقوع سناریوی دوم یعنی ارتقای بنیادین سیستم‌عامل فعلی به‌مراتب بیشتر از رونمایی زودهنگام ویندوز ۱۲ ارزیابی می‌شود. تصاویر جدید قرار است در نسخه‌های متفاوتی برای ویرایش‌های گوناگون مانند ویندوز ۱۱ پرو و مدل‌های تجاری سیستم‌عامل ارائه شوند. با وجود شباهت‌هایی به طرح Bloom، این تصاویر صرفا تغییر رنگ یا ویرایش جزئی نسخه‌های قبلی نیستند و ساختاری نوآورانه و مجزا دارند. برنامه‌های پیشین مایکروسافت برای انتشار نسخه‌ی جدید ویندوز در هر سه سال، پس از خروج پانوس پانای تغییر کرد. در حال حاضر نشانه‌ها حاکی از آماده‌سازی یک به‌روزرسانی بزرگ برای سال ۲۰۲۷ به‌جای مهاجرت به ویندوز ۱۲ است؛ اما احتمال درز زودهنگام فایل نهایی این تصاویر در فضای مجازی وجود دارد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/microsoft-surface-pro-9-desktop-63a9993e8318d4958b6224b5?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["Microsoft"], "datetime_fa": "۲۰ آبان • ۱۷:۲۹"}, {"source": "Business Insider", "title": "I tried the famous 'PieCaken,' a 6-pound cake stuffed with 3 different pies. It was a huge hit at Friendsgiving.", "link": "https://www.businessinsider.com/piecaken-review-famous-thanksgiving-cake-2026-11", "summary": "The PieCaken is a six-pound cake with four different desserts stuffed inside, including three pies. Courtesy of PieCaken The PieCaken features pecan pie, pumpkin pie, spice cake, and apple pie filling all in one dessert. I tried it for the first time and couldn't believe how delicious every layer tasted. The PieCaken also wowed everyone at my Friendsgiving. I couldn't believe my eyes when I first saw a photo of the PieCaken. Kelly Ripa once said that the six-pound cake — which has four desserts stuffed inside — was the \"greatest thing that happened to me, besides the birth of my children.\" There's a pecan pie on the bottom, followed by a pumpkin pie layer, and then spice cake on top. If that's not enough, there's apple pie filling in the center, and everything is held together by cinnamon buttercream. It sounded like the perfect wacky dessert to bring to Friendsgiving . The PieCaken was invented by the pastry chef Zac Young. Cindy Ord/Stringer/Getty Images Young first came up with the idea in 2015 while working as the executive pastry chef at David Burke Fabrick in New York City. The restaurant's executive chef was serving a Turducken special (a chicken stuffed into a duck stuffed into a turkey), and Young decided he wanted to make a sweet version. He was just planning to make a dessert to serve by the slice. But when Young posted a photo on Instagram, the PieCaken immediately took off. The Thanksgiving dessert can be purchased on Goldbelly for $110 and ships across the US. Also currently available are a red velvet PieCaken and a $160 DecaCaken featuring 10 layers, including chocolate cream pie, coffee cake, and New York cheesecake. My PieCaken was delivered frozen two days after I placed my order. Anneta Konstantinides/Business Insider The PieCaken was shipped with dry ice. Per the instructions, I stuck it in the fridge the night before I planned to serve it and let it sit out on the counter for two hours before digging in. Unlike many desserts, the PieCaken can actually be stored in the freezer for up to three months if it's tightly wrapped in its original packaging. It also lasts in the fridge for up to seven days. At first glance, the PieCaken looked very impressive. Anneta Konstantinides/Business Insider The 5-inch cake is covered in an oat crumble, and the colors pair well with the pale-pink cinnamon buttercream. When I brought the PieCaken to a Friendsgiving dinner, its appearance wowed everyone at the table. The apple pie filling on top also looked", "date_str": "2026-11-11T14:28:03+00:00", "hash": "c9f891d6723b8225", "title_fa": "من کیک معروف \"PieCaken\" را امتحان کردم، یک کیک 6 پوندی که با 3 پای مختلف پر شده بود. موفقیت بزرگی در Friendsgiving بود.", "summary_fa": "PieCaken یک کیک شش پوندی با چهار دسر مختلف، از جمله سه پای است. با حسن نیت از PieCaken PieCaken دارای پای اسپند، پای کدو تنبل، کیک ادویه و پای سیب است که همه در یک دسر پر می شوند. من برای اولین بار آن را امتحان کردم و باورم نمی شد طعم هر لایه چقدر خوشمزه است. PieCaken همچنین همه را در Friendsgiving من شگفت زده کرد. وقتی برای اولین بار عکسی از PieCaken را دیدم، نمی توانستم چشمانم را باور کنم. کلی ریپا یک بار گفت که کیک شش پوندی - که داخل آن چهار دسر پر شده است - \"بزرگترین اتفاقی بود که برای من افتاد، به جز تولد فرزندانم.\" یک پای اسپند در پایین، به دنبال یک لایه پای کدو تنبل، و سپس کیک ادویه در بالا وجود دارد. اگر این کافی نیست، در مرکز پای سیب قرار دارد و همه چیز با کره دارچینی به هم چسبیده است. به نظر می‌رسید که دسر بی‌نقصی برای آوردن به Friendsgiving باشد. PieCaken توسط شیرینی پز Zac Young اختراع شد. سیندی اورد/استرینگر/گتی ایماژ یانگ برای اولین بار در سال 2015 در حالی که به عنوان سرآشپز اجرایی در دیوید برک فابریک در شهر نیویورک کار می کرد، این ایده را مطرح کرد. سرآشپز اجرایی رستوران در حال سرو غذای ویژه Turducken (مرغ پر شده در اردک پر شده در بوقلمون) بود و یانگ تصمیم گرفت که می خواهد یک نسخه شیرین درست کند. او فقط قصد داشت یک دسر درست کند تا آن را سرو کند. اما زمانی که یانگ عکسی را در اینستاگرام منتشر کرد، PieCaken بلافاصله بلند شد. دسر شکرگزاری را می توان در Goldbelly با قیمت 110 دلار خریداری کرد و در سراسر ایالات متحده ارسال کرد. همچنین در حال حاضر یک PieCaken قرمز مخملی و یک DecaCaken 160 دلاری با 10 لایه شامل پای", "image_url": "https://i.insider.com/6aebed8a308912814ed71171?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۲۰ آبان • ۱۷:۵۸"}, {"source": "Business Insider", "title": "I sold almost everything I owned before moving abroad. Now, I'm returning home with even less stuff than I packed.", "link": "https://www.businessinsider.com/sold-belongings-before-international-move-like-owning-less-2026-11", "summary": "I moved to Japan with just two bags worth of belongings. Alessa Hickman I got rid of almost everything I owned before moving to Japan , and I don't miss most of it. Having fewer belongings has made me aware of how little I need, and I've since gotten rid of more. Now, I'm preparing to return to Canada, but I plan to maintain a more minimalist lifestyle. Just about a year ago, I left my Ottawa apartment, sold most of my belongings, packed up the rest, and moved to Japan with a suitcase and carry-on. Since then, I've brought those same bags to short-term Airbnb rentals across Tokyo, Osaka, Kumamoto, and Saitama. After almost a year, I've stopped missing most of the things I left behind and started loving the flexibility that comes with having so much less. In fact, these days, I'm questioning why I ever needed so much in the first place. I wasn't exactly a minimalist back in Canada I sold most of my belongings before moving. Alessa Hickman I've always been a bit of a \"stuff\" person. I had an overflowing closet, shelves full of books, and shoes for basically every occasion, including some I wore only once or twice a year. My apartment was full of stuff, too: records, plants, kitchenware, and everything in between. My husband loves collectibles, and I always enjoyed picking up little things to make our space feel more like us. However, when we planned our yearlong move to Japan , we knew we would have to downsize. We wouldn't have an apartment to come back to, so we got rid of almost everything. Facebook Marketplace was my best friend for a few months as I sold our furniture, electronics, and beyond. I sold and donated a ton of my clothing to create a capsule wardrobe, which I'd later pare down even more to just four shirts, two skirts, a pair of pants, shorts, a dress, one pair of shoes, and a rain jacket — all organized into packing cubes. Then, we packed a few sentimental things we wanted to keep into boxes and left them with family in Canada. I don't miss the stuff I gave away — and, in fact, I think I could've packed even less After moving, I ended up shipping even more of my stuff back home to Canada. Alessa Hickman Turns out, I was so excited to be in Japan that I didn't miss anything I left behind — even after I ran out of my usual hair products and had to find alternatives for my curls. It was also a relief to have less to carry around. I just felt lighter. As my months in Japan went on, I realized I could have packed even less. Did I really need a su", "date_str": "2026-11-11T14:27:01+00:00", "hash": "2cea32f819dd528d", "title_fa": "من تقریباً هر چیزی را که داشتم قبل از مهاجرت به خارج فروختم. اکنون، من با وسایلی کمتر از آنچه که بسته بودم به خانه برمی گردم.", "summary_fa": "من فقط با دو کیف به ارزش وسایل به ژاپن رفتم. آلسا هیکمن من تقریباً از شر همه چیزهایی که داشتم قبل از نقل مکان به ژاپن خلاص شدم و بیشتر آن را از دست نمی دهم. داشتن وسایل کمتر باعث شده است که به مقدار کمی نیاز داشته باشم و از آن زمان از شر چیزهای بیشتری خلاص شده ام. اکنون، در حال آماده شدن برای mples that show impact. Get better at: Highlighting your impact Today's move Proving your value requires more than listing tasks you completed. It means highlighting a moment where you did something that genuinely stood out, according to Tesla and SpaceX CEO Elon Musk. Musk has a high bar for hiring and has repeatedly said he looks for \"exceptional ability\" in candidates. One way he assesses that is by asking candidates for three bullet points that demonstrate their talent, he said on the \"Dwarkesh Podcast\" in February. The Tesla CEO explained that he wants to hear someone cite one to three accomplishments that would lead the listener to say \"wow.\" Why it works Musk said that in a 2014 Auto Bild interview that college degrees aren't always indicative of the best talent. For example, Bill Gates , Larry Ellison , or even Steve Jobs didn't graduate from college, he said. Musk went on to say that even if the bullet points of achievement are unrelated to the candidate's field, the goal is to find a record of extraordinary accomplishments. \"If there's a track record of exceptional achievement, then it's likely that that will continue into the future,\" Musk said. Try it today Spend a few minutes thinking about three accomplishments that you're proud of. For each one, write down what you contributed, the impact it had, and any relevant metrics that show how valuable your contribution was. Make sure you bring that list to your next job interview, promotion conversation, or performance review. The bottom line If you want to prove your impact, you should aim to highlight an achievement that elicits some kind of \"wow\" response, and that is more likely to come from a specific story, rather than a summary of everything you have done during a six-month period. Source This insight is drawn from Business Insider's reporting on the famous three-bullet-point requirement that Musk has used, and how it applies to his search for trade workers to build AI centers. Read the full icials said this week. It comes as NATO explores how new technologies could permit better operations in the Arctic. NATO is experimenting with amphibious robots that can cross water and ice in the Arctic, where the harsh environment could limit command and control. The Western military alliance launched a new initiative, Task Force X-Arctic, in June to explore how networked uncrewed and autonomous systems can provide NATO forces with more situational awareness across the High North. The new task force, led by NATO's Allied Command Transformation and Centre for Maritime Research and Experimentation, has carried out initial testing in an operational environment and is now exploring ways to deploy uncrewed vehicles in unconventional roles . João Alves, who leads CMRE's exercises and experimentation branch, told reporters at a roundtable discussion on Tuesday that NATO is exploring the use of uncrewed ground vehicles \"to expand the presence on the ice cap,\" where the alliance's footprint had previously been insufficient. \"We are talking about using unmanned amphibious vehicles that can go from ice to water and back from water to ice,\" Alves said, adding that the vehicles can be used to patrol areas and establish communication links with drones and underwater vessels. The amphibious vehicles were initially designed to have a driver, but CMRE modified them to be uncrewed. Having these kinds of platforms \"opens up a lot of possibilities,\" particularly for communications, Alves said. NATO is also working with other types of vehicles, including conventional uncrewed ground vehicles that can carry communications payloads and set up on hilltops for greater coverage — terrain features can disrupt signals — or launch drones as a mothership would. Uncrewed surface vessels operate off the coast of Norway during NATO s Arctic Sentry mission. US Navy Portuguese Capt. João Piedade, who leads the operational command-and-control branch for ACT's capability development directorate, told reporters on the call that the uncrewed amphibious vehicles are useful in the Arctic because the region is vast and lacks communications infrastructure. \"With amphibious vehicles, we can cover wide areas, travel through the water, travel inland, on the", "date_str": "2026-11-11T13:04:03+00:00", "hash": "a13a1c50b9e24400", "title_fa": "ناتو در حال آزمایش روبات های آبی خاکی است که می توانند از یخ و آب در قطب شمال عبور کنند", "summary_fa": "ناتو در حال آزمایش سیستم های خودمختار برای کار در کنار دارایی های خدمه در قطب شمال است. ناتو ناتو در حال آزمایش روبات های آبی خاکی است که می توانند از آب و یخ در قطب شمال عبور کنند. مقامات ناتو این هفته گفتند که این روبات ها می توانند توسط نیروها برای حفظ ارتباطات استفاده شوند. این در حالی است که ناتو بررسی می‌کند که چگونه فناوری‌های جدید می‌توانند عملیات بهتر در قطب شمال را مجاز کنند. ناتو در حال آزمایش روبات‌های آبی خاکی است که می‌توانند از آب و یخ در قطب شمال عبور کنند، جایی که محیط سخت می‌تواند فرماندهی و کنترل را محدود کند. ائتلاف نظامی غربی ابتکار جدیدی را به نام Task Force X-Arctic در ماه ژوئن آغاز کرد تا بررسی کند که چگونه سیستم‌های بدون خدمه و خودمختار شبکه‌ای می‌توانند آگاهی موقعیتی بیشتری را در سراسر شمال بالا به نیروهای ناتو ارائه دهند. گروه ضربت جدید به رهبری فرماندهی ناتو و مرکز تحقیقات و آزمایش های دریایی، آزمایش های اولیه را در یک محیط عملیاتی انجام داده و اکنون در حال بررسی راه هایی برای استقرار خودروهای بدون سرنشین در نقش های غیر متعارف است. ژائو آلوز، که رهبری شاخه آزمایش و تمرین CMRE را بر عهده دارد، روز سه‌شنبه در یک میزگرد به خبرنگاران گفت که ناتو در حال بررسی استفاده از وسایل نقلیه زمینی بدون خدمه است «برای گسترش حضور روی کلاهک یخی، جایی که ردپای اتحاد قبلاً کافی نبود. آلوز گفت: «ما در مورد استفاده از وسایل نقلیه آبی خاکی بدون سرنشین صحبت می کنیم که می توانند از یخ به آب و از آب به یخ برگردند. وسایل نقلیه آبی خاکی در ابتدا برای داشتن راننده طراحی شده بودند، اما CMRE آنها را تغییر داد تا بدون خدمه باشند. آلوز گفت که داشتن این نوع پلتفرم ها \"امکانات زیادی", "image_url": "https://i.insider.com/6af438b38a8cac0989cc02ad?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۱۶:۳۴"}, {"source": "Lifehacker", "title": "Aura's Second E-Ink Picture Frame Is Much Improved, and Much Cheaper", "link": "https://lifehacker.com/tech/aura-e-ink-picture-frame-review?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Last year, Aura released the Aura Ink, its first digital photo frame using an e-ink display rather than the LCD screens common to the other devices that made them the major player in the market (Aura customers have already uploaded more than one billion photos this year alone). When I reviewed the original 13-inch Aura Ink last year , I recommended it, with a few major reservations. Today, Aura announced its second-generation 10-inch Ink frame , and while I wouldn't exactly say they've solved every one of my issues, the new device is significantly improved and much cheaper. The benefits of e-ink (and the tradeoffs) Most digital photo frames will remind you of an iPad with a decorative border around it. They're great for displaying hundreds of your photos with vibrant color, but not everyone loves the look, or the fact that these frames always need to be plugged in. An e-ink frame, on the other hand, uses a variant of the sort of low-power screen you'd find in a Kindle Colorsoft less bright, but more paperlike, and much closer to the look of a traditionally printed photo. The Aura Ink is a great choice if you want a digital frame that looks more like a \"real\" photo and doesn't need to be plugged in and doesn't light up like a tablet (though it does have a light, it's really to make up for the fact that color e-ink screens don't reflect light very well, and thus can make your pictures look way too dark without an additional boost). You'll still get all the benefits of an LCD frame like the Aura Aspen, including the ability to load photos from anywhere using the versatile Aura app (you can now even text them directly to the frame), but you'll only need to charge it once every few months. Now for the downsides: Where most digital frames allow you to flick between photos with a swipe, the Aura Ink is much more sluggish switching from one photo to another takes about 45 seconds. While an LCD can match the colors in your photo exactly, e-ink uses a \"dithering algorithm\" to blend tiny pixels together to create the illusion of different hues (\"millions\" of them, according to Aura). In practice, this means up close, your pictures will look rather grainy, and the colors won't be nearly as bright as what you see on your phone screen. The 10-inch Aura Ink offers some significant upgrades Credit: Joel Cunningham All of that said, the Aura Ink is a great product, provided you know what you're buying, and the new 10-inch m", "date_str": "2026-11-11T14:30:00+00:00", "hash": "05dbdbba28a99bb4", "title_fa": "قاب عکس E-Ink دوم Aura بسیار بهبود یافته و بسیار ارزان تر است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. سال گذشته، Aura اولین قاب عکس دیجیتال خود را با استفاده از نمایشگر e-ink به جای صفحه نمایش LCD رایج در سایر دستگاه‌ها منتشر کرد که آنها را به بازیگر اصلی بازار تبدیل کرد (مشتریان Aura تاکنون بیش از یک میلیارد عکس را تنها در سال جاری آپلود کرده‌اند). وقتی سال گذشته جوهر 13 اینچی Aura اصلی را بررسی کردم، آن را با چند رزرو عمده توصیه کردم. امروز، Aura نسل دوم قاب جوهر 10 اینچی خود را معرفی کرد، و اگرچه نمی‌توانم دقیقاً بگویم که آنها همه مشکلات من را حل کرده‌اند، دستگاه جدید به طور قابل توجهی بهبود یافته و بسیار ارزان‌تر است. مزایای جوهر الکترونیکی (و معاوضه ها) اکثر قاب های عکس دیجیتال شما را به یاد یک آی پد با حاشیه تزئینی در اطراف آن می اندازند. آنها برای نمایش صدها عکس شما با رنگ‌های پر جنب و جوش عالی هستند، اما همه از ظاهر یا این واقعیت که این قاب‌ها همیشه نیاز به وصل شدن دارند، خوششان نمی‌آید. از سوی دیگر، یک قاب e-ink از نوعی صفحه نمایش کم مصرف استفاده می کند که در Kindle Colorsoft روشن تر، اما کاغذی تر، و بسیار ن شما گفته بودیم که نمایش در حال انتقال به وست اند است. این نمایشنامه که از خاطرات جیکوب دان اقتباس شده است، داستان این است که چگونه زندگی نویسنده آن با وارد کردن ضربه مهلک به یک امدادگر کارآموز برای همیشه تغییر کرد. همچنین در اطراف ناتینگهام قرار دارد. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/483288.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۰ آبان • ۱۸:۴۱"}, {"source": "Deadline", "title": "Film Accelerator Open Cities, Run By Ex-Sundance CEO Joana Vicente & Producer Jason Kliot, Reveals First Projects", "link": "https://deadline.com/2026/11/film-accelerator-open-cities-sundance-joana-vicente-reveals-first-projects-ai-1237220246/", "summary": "EXCLUSIVE: Open Cities, the tech-oriented film accelerator and production company led by former Sundance CEO Joana Vicente and Oscar-nominated producer Jason Kliot, has selected its first 11 projects. The roster of features in the Lisbon, Portugal-based company s inaugural cohort spans genres and global regions. (See the full list below.) In a newly conceived version of [ ]", "date_str": "2026-11-11T15:01:32+00:00", "hash": "a75304a8b48b06ef", "title_fa": "فیلم Accelerator Open Cities که توسط مدیر عامل سابق ساندنس، جوآنا ویسنته و تهیه کننده جیسون کلیوت اداره می شود، اولین پروژه ها را فاش می کند.", "summary_fa": "اختصاصی: Open Cities، شتاب دهنده و شرکت تولید فیلم مبتنی بر فناوری به رهبری جوآنا ویسنته، مدیر عامل سابق ساندنس و جیسون کلیوت، تهیه کننده نامزد اسکار، 11 پروژه اول خود را انتخاب کرده است. فهرست ویژگی‌های گروه افتتاحیه شرکت مستقر در لیسبون، پرتغال، ژانرها و مناطق جهانی را در بر می‌گیرد. (لیست کامل را در زیر ببینید.) در نسخه جدید [ ] انحصاری: شهرهای باز، شتاب دهنده و شرکت تولید فیلم مبتنی بر فناوری به رهبری جوآنا ویسنته، مدیر عامل سابق ساندنس و جیسون کلیوت، ت rmiga, Tim Blake Nelson and Jim Parsons, Bought for U.S. by Dark Sky Films (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/heavens-gate-cult-thriller-the-leader-us-dark-sky-films-1236943712/", "summary": "On the 30th anniversary of the Heaven s Gate tragedy — the infamous mass suicide involving members of a Californian religious cult — a film detailing the story is hitting cinemas. The Leader, a true crime cult thriller starring Vera Farmiga, Tim Blake Nelson and Jim Parsons, has been picked for U.S. distribution by by Dark Sky Films, [ ]", "date_str": "2026-11-11T15:30:00+00:00", "hash": "1c9d461653f40cf1", "title_fa": "تریلر فرقه ای Heaven's Gate \"The Leader\" با بازی ورا فارمیگا، تیم بلیک نلسون و جیم پارسونز، خریداری شده برای ایالات متحده توسط Dark Sky Films (اختصاصی)", "summary_fa": "در سی امین سالگرد تراژدی دروازه بهشت ​​- خودکشی دسته جمعی بدنام اعضای یک فرقه مذهبی کالیفرنیایی - فیلمی با جزئیات داستان در سینماها پخش می شود. The Leader، یک مهیج جنایی جنایی واقعی با بازی ورا فارمیگا، تیم بلیک نلسون و جیم پارسونز، توسط Dark Sky Films برای توزیع در ایالات متحده انتخاب شده است، [ ] The Leader، یک جنایی جنایی واقعی با بازی ورا فارمیگا، تیم بلیک نلسون و جیم پارسونز، برای پخش در ایالات متحده انتخاب شده است. توزیع توسط Dark Sky Films، که قصد دارد فیلم را در اواخر مارس 2027، تا سی امین سالگرد اکران کند. داستان‌های مرتبط بازگشت تام هنکس به برادوی پس از 14 سال برای نمایش جدید This World of Tomorrow شما در برادران وارنر راه‌اندازی مجدد نامه دریافت کردید. از مایکل گالاگر نویسنده و کارگردان و همچنین با بازی گریس کارولین کری و سایمون رکس، این فیلم اولین نمایش جهانی خود را در جشنواره فیلم Tribeca در جشنواره امسال داشت. بررسی Variety می‌گوید این قوی‌ترین درام درباره زندگی درون یک فرقه از زمان مارتا مارسی می مارلن است. Exchange/Voltage مناطق باقی مانده را در AFM مدیریت می کند، با چندین منطقه اصلی که قبلاً به توزیع کنندگان تئاتر فروخته شده است. طبق توضیحات، The Leader در پس زمینه یکی از عجیب ترین و ویرانگرترین فصل های تاریخ آمریکا قرار دارد. داستان مارشال هرف اپل وایت (نلسون)، معلم موسیقی سابق، و بانی لو نتلز (فارمیگا)، پرستاری است که ملاقات تصادفی او در اوایل دهه 1970 جرقه یک شراکت معنوی خارق‌العاده می‌دهد. این زوج که متقاعد شده اند برای هدایت بشریت به سوی سطح بالاتری از هستی انتخاب شده اند، دروازه بهشت ​​را تأسیس می کنند و پیروانی را جذب می کنند که مایل به تسلیم دارایی های خود، ترک خانواده و قطع روابط با دنیای خارج هستند. خلاصه داستان می افزاید:", "image_url": "https://variety.com/wp-content/uploads/2026/11/TheLeader_Applewhite.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "Usher and Chris Brown Cancel Two More Performances as Feud Reports Heat Up", "link": "https://variety.com/2026/music/news/usher-chris-brown-cancel-two-concerts-feud-1236945101/", "summary": "Amid reports of an ongoing feud, Usher and Chris Brown have canceled two more performances on their dual-headlining “R B Tour,” bringing the total number of canceled concerts to six. The canceled dates were all added to the tour’s original itinerary in August. The latest cancellations are the November 16 performance at Los Angeles’ SoFi Stadium [ ]", "date_str": "2026-11-11T15:09:40+00:00", "hash": "234b77c10ef67276", "title_fa": "آشر و کریس براون دو اجرای دیگر را با داغ شدن گزارش های Feud لغو کردند", "summary_fa": "در بحبوحه گزارش‌هایی مبنی بر درگیری‌های مداوم، آشر و کریس براون دو اجرای دیگر را در تور دو تیتراژ R B خود لغو کردند و تعداد کل کنسرت‌های لغو شده را به شش رساندند. تاریخ های لغو شده همگی به برنامه سفر اصلی تور در ماه اوت اضافه شدند. آخرین لغو، اجرای 16 نوامبر در استادیوم سوفای لس آنجلس است [ ] این لغو در میان گزارش های گسترده اما تایید نشده دعوای بین این دو سرگروه انجام شد و شایعاتی مبنی بر وقوع یک مشاجره با صدای بلند پشت صحنه در آتلانتا رخ داد. نمایندگان این دو هنرمند و Live Nation، مجری تور، بلافاصله به درخواست‌های Variety برای اظهار نظر پاسخ ندادند. لغو قبلی در بالتیمور، سینسیناتی، کارولینای جنوبی و ایندیاناپولیس بود. طبق بیانیه ای از استادیوم لوکاس اویل ایندیاناپولیس به نقل از تیکت نیوز، در آن زمان، برگزارکنندگان نیاز به اولویت دادن به سلامت و رفاه مهمانی و خدمه تور را ذکر کردند. این بیانیه ادامه داد: درخواست‌های یک تور با این طول و مقیاس قابل توجه است و این تنظیمات به تور اجازه می‌دهد تا با خیال راحت و پایدار در اجرای برنامه‌های باقی‌مانده ادامه یابد. معمولاً، نمایش‌های لغو شده نتیجه بیش از حد در نظر گرفته می‌شوند - که تقاضای بلیت قبلاً تا حد زیادی برآورده شده بود. با این حال، آنها پس از کنسرت جنجالی 5 نوامبر در استادیوم مرسدس بنز در آتلانتا آمدند، که با تاخیرهای طولانی، مشکلات کیفیت صدا و عدم اجرای این زوج، مانند تاریخ های قبلی تور، همراه بود. طبق گزارشی در TMZ، اختلاف بر سر زمان شروع کنسرت بود و براون استدلال کرد که نمایش را برای طرفدارانی که در ترافیک شدید محلی گرفتار شده بودند به تأخیر بیاندازد. نمایش سه ساعت به تعویق افتاد و خشم هواداران را برانگیخت.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Untitled_e8b05d.jpg?w=800&#038;h=536&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲۰ آبان • ۱۸:۳۹"}, {"source": "Billboard", "title": "Stove God Cooks & Swizz Beatz Talk Making ‘All This For Me?’: ‘Album of the Decade’", "link": "https://www.billboard.com/music/rb-hip-hop/stove-god-cooks-swizz-beatz-all-this-for-me-interview-1236378722/", "summary": "Stove God Cooks is finally ready to follow up his underground classic Reasonable Drought , which he dropped alongside Roc Marciano back in 2020. Since then, he s been on an impressive feature run (mainly on Grisleda records) and has had to deal with a plethora of leaks that have only sent demand for a sophomore album to a fever pitch, especially after his scene-stealing chorus on the Clipse s LET GOD SORT EM OUT standout F.I.C.O. Now, after a year of label drama and false starts — including one scrapped project in Goat Stamp , and a March 27 release date for the album we re here to talk about — his parent label Babygrande has a entered a joint partnership with Warner Records in an effort to finally give fans what they ve been waiting for in a new full-length album. Part of the reason for the delay has been because Stove wasn t really aware of how things worked on the sample-clearing side of the business — because he s used to working alongside prolific rappers like Griselda Records founder Westside Gunn, who craft albums and drop them in a span of a week. I didn t understand a lot of s—t, you know? So, things that was pissing me off, it was really the way I was seeing s—t, he explains to me over Zoom. My references wasn t the way s—t really go. I m seeing my people move this way. Why we taking so long to drop albums? I see West drop an album in three days. I know he got samples in his s—t. I m on the songs. So, it s that kind of s—t. But once you rip the sheet off and Gunn starts telling me about the lawsuits and s—t that he deals with, I m like, Oh, no, this s—t is for real.' Now, alongside legendary producer Swizz Beatz , he s finally beginning the rollout for his long-awaited sophomore album All This For Me? They first dropped the warm up single, Welcome to My Garden , earlier this year in February (which has been elevated, according to Stove and Swizz) and the duo recently released the project s second single and music video in Stovie s Home (Down Down) this past Friday (Nov. 6). And the Syracuse, N.Y. rapper is excited for his fans to finally hear what he s been working on and put the rollercoaster that was this past year behind him. The s—t is a super blessing, man, he says. That s the reality of this moment for me right now. All the other s—t, the old s—t, none of s—t matter to me right now. Check out my conversation with Stove God Cooks Swizz Beatz below as we talk their creative process, their chemistry and what fans can expect once they finally g", "date_str": "2026-11-11T15:00:00+00:00", "hash": "99f140d41ff9122c", "title_fa": "Stove God Cooks & Swizz Beatz Talk Making \"All This For Me?\": \"Album of the Decade\"", "summary_fa": "Stove God Cooks بالاخره آماده است تا فیلم کلاسیک زیرزمینی خود یعنی Reasonable Dought را که در سال 2020 در کنار راک مارسیانو عرضه کرد، دنبال کند. از آن زمان، او در یک مجموعه موسیقی چشمگیر (عمدتاً در رکوردهای Grisleda) بوده است و مجبور شده است با انبوهی از درزها دست و پنجه نرم کند که تقاضا برای یک آلبوم جدید را به خصوص پس از یک صحنه جدید در سال دوم او ارسال کرده است. Clipse s LET GOD SORT EM OUT OUT F.I.C.O. اکنون، پس از یک سال سریال درام و شروع اشتباه - از جمله یک پروژه منسوخ شده در Goat Stamp و تاریخ انتشار 27 مارس برای آلبومی که ما اینجا هستیم تا در مورد آن صحبت کنیم - لیبل مادر او Babygrande با Warner Records وارد همکاری مشترک شده است تا در نهایت به طرفداران آنچه که در یک آلبوم کامل جدید منتظرش بودند ارائه دهد. بخشی از دلیل تأخیر به این دلیل بوده است که استو واقعاً از نحوه کار در بخش پاکسازی نمونه کار آگاه نبود - زیرا او عادت داشت در کنار رپرهای پرکار مانند وست ساید گان، بنیانگذار Griselda Records کار کند، که آلبوم‌ها را می‌سازند و در یک بازه زمانی یک هفته منتشر می‌کنند. من خیلی از s-t را متوجه نشدم، می دانید؟ بنابراین، چیزهایی که من را عصبانی می‌کردند، واقعاً همان چیزی بود که من s-t را می‌دیدم، او در زوم برای من توضیح می‌دهد. ارجاعات من واقعاً راهی نبود. من می بینم که مردم من به این سمت حرکت می کنند. چرا ما اینقدر طول می کشیم تا آلبوم ها را منتشر کنیم؟ من می بینم که وست یک آلبوم را در سه روز منتشر می کند. من می دانم که او نمونه هایی را در s-t خود دریافت کرد. من روی آهنگ ها هستم بنابراین، این همان", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/stove-god-cooks-swizz-beatz-press-photo-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Diplo and Former Downtown Music CEO Andrew Bergman Launch Indie Publisher Bison Music", "link": "https://www.billboard.com/pro/diplo-andrew-bergman-bison-music/", "summary": "Diplo and Andrew Bergman , the former CEO of Downtown Music, are launching Bison Music, an independent music publisher focused on signing and developing songwriters early in their careers. Bergman will serve as the company s CEO, working alongside COO Tom Lee , CCO Juba Lee and general manager Jenny Ilibassi . The company s roster of songwriters includes Picard Bros., Leclair, Maesic, Nitti, Kaien Cruz, BomboCat, Akira Evans and Groupthink, a group whose credits span songs for artists including BTS, Dua Lipa, Bad Bunny and JENNIE. Related UMG s $775M Downtown Deal Secures EU Approval With Remedies Attached Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Agents Look Ahead as AI Keeps Advancing: We Have the Privilege of Being in a Human Industry Bison is positioning itself in contrast to a current publishing landscape that s has been dominated by catalog acquisition. Rather than buying existing intellectual property, the company says its focused on long-term artist development and making fresh, original music written by real people to connect with a global audience. “For me, there’s still nothing more exciting in music than discovering a great song from someone you’ve never heard of,” Bergman says in a press release. “That’s always been at the core of what makes music publishing a great business. And it’s what excited me about partnering with Diplo, one of the leading creative forces in the modern music business, and tmwrk, his management team and longtime business partners. We’re designed to identify and sign writers early, nurture them through the harsh realities of the music business and allow them to reap the benefits of their creative endeavors. Writers and the music publishers that serve them are at their best when they are in a collaborative mode, and we intend to operate that way internally and externally.” Diplo, who initially formed Bison before bringing Bergman on as a partner, framed the launch as a response to a moment of creative stagnation in the industry. “At a moment when it feels like music needs an injection of originality, our writers are in a position to shape where music goes next,” he says. “Andrew and I are creating a home for those writers, with a team that knows how to develop them and a company built to back them for the long term.” Bison is based in New York and Los Angeles. Additional signings will be announced in the coming months.", "date_str": "2026-11-11T15:00:00+00:00", "hash": "d4115e0138602ac2", "title_fa": "Diplo و مدیر عامل سابق Downtown Music اندرو برگمن ناشر Indie Bison Music را راه اندازی کردند.", "summary_fa": "دیپلو و اندرو برگمن، مدیر عامل سابق Downtown Music، در حال راه اندازی Bison Music، یک ناشر موسیقی مستقل هستند که بر روی امضای قرارداد و توسعه ترانه سرایان در ابتدای کار خود متمرکز است. برگمن به عنوان مدیر عامل شرکت، در کنار تام لی، مدیر ارشد اجرایی جوبا لی و مدیر کل جنی ایلیباسی کار خواهد کرد. فهرست ترانه سرایان این شرکت شامل Picard Bros، Leclair، Maesic، Nitti، Kaien Cruz، BomboCat، Akira Evans و Groupthink است، گروهی که آهنگ های آن برای هنرمندانی از جمله BTS، Dua Lipa، Bad Bunny و JENNIE است. معامله 775 میلیون دلاری مربوط به مرکز شهر UMG تاییدیه اتحادیه اروپا را با راه‌حل‌های ضمیمه آب و هوای سخت، بندهای شعاع و یافتن نسل بعدی سرفصل‌های جشنواره تضمین می‌کند: این یک مبارزه سال به سال برای زنده ماندن است. موقعیت خود را در مقابل چشم انداز فعلی انتشاراتی قرار می دهد که تحت سلطه اکتساب کاتالوگ است. این شرکت می‌گوید به‌جای خرید مالکیت معنوی موجود، بر توسعه بلندمدت هنرمندان و ساخت موسیقی تازه و اصیل نوشته شده توسط افراد واقعی برای ارتباط با مخاطبان جهانی تمرکز کرده است. برگمن در بیانیه‌ای مطبوعاتی می‌گوید: «برای من، هنوز هیچ چیز در موسیقی هیجان‌انگیزتر از کشف یک آهنگ عالی از کسی نیست که هرگز نامش را نشنیده‌اید». \"این همیشه هسته اصلی چیزی است که انتشار موسیقی را به یک تجارت عالی تبدیل می کند. و این همان چیزی است که من را از شراکت با Diplo، یکی از نیروهای خلاق پیشرو در تجارت موسیقی مدرن، و tmwrk، تیم مدیریت و شرکای تجاری قدیمی او هیجان زده کرد. ما طراحی شده ایم تا نویسندگان را زودتر شناسایی و امضا کنیم، آنها را از طریق واقعیت های خشن تجارت موسیقی پرورش e, we re creating eight right now. I think one of the most unique and interesting things that you guys have done is the Whitney Houston slot machines. Larry Mestel: Yeah. We re making more money for the estate of Whitney Houston than the entire estate was generating six and a half years ago when we bought into the estate. 150,000 songs being uploaded every day, how does that change the nature of what you guys do? Laurent Hubert: This is a topic that we talk about almost every day, and it s a challenge. The music industry in recent years has started to see a lot of these kind of acquisitions and mergers of major companies, and I m wondering why you think these acquisitions and this consolidation is happening now. Larry Mestel: Well, I think you re gonna see a lot more. Today we have an exclusive first press interview about one of the biggest acquisitions in music in 2026. Primary Wave has officially bought Kobalt, and the deal is reported to be well over a billion dollars. This is a big deal in the music publishing world o", "date_str": "2026-11-11T14:00:00+00:00", "hash": "41c26776ec4e37f1", "title_fa": "معامله میلیارد دلاری بین موج اولیه و کوبالت | بیلبورد در رکورد", "summary_fa": "تجارت موسیقی در حال تغییر است و مخاطرات هرگز بالاتر نبوده است. پس از خرید 1 میلیارد دلاری کوبالت توسط Primary Wave، لری مستل، مدیرعامل/موسس Primary Wave و لورن هوبرت، مدیرعامل Kobalt، مجری بیلبورد On The Record، کریستین رابینسون، در یک مصاحبه اختصاصی برای شکستن این قرارداد و معنای آن برای آینده انتشار موسیقی می‌پیوندند. آن‌ها درباره نحوه عملکرد جدید کسب‌وکارشان بحث می‌کنند، هر کدام چند میلیون دلار برای کاتالوگ‌های موسیقی در سال جاری خرج کرده‌اند و چرا به نظر می‌رسد خریدها و ادغام‌ها در سال 2026 به استاندارد صنعت موسیقی تبدیل شده‌اند. آنچه می‌شنوید را دوست دارید؟ فراموش نکنید که امتیاز دهید، مرور کنید و مشترک شوید تا هرگز قسمتی از Billboard On The Record را از دست ندهید. Billboard On The Record را در اینستاگرام، TikTok، پادکست های اپل، Spotify و YouTube @billbo a rd دنبال کنید تا هرگز قسم ate": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
