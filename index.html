<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۶ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۶ آذر ۱۴۰۵</span>

      <button class="tab-btn" onclick="switchTab('tech', this)">

        <span class="badge" id="badge-tech">۱۰۹</span>

      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۴۱</span>

    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">

      <div class="modal-header">

        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

ران خبر داده و گفته بود که مردم دیگر توان خرید این کالاها را ندارند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Screenshot_2026-11-26_at_12.43.31PM_kILZ__v1024x512__box_0%2C436%2C1080%2C1004.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۵ آذر • ۲۱:۰۵"}, {"source": "Euronews Persian", "title": "ناتو رادار پرنده به آسمان لهستان فرستاد؛ «آواکس» چه توانایی‌هایی دارد؟", "link": "https://parsi.euronews.com/2026/11/26/nato-awacs-deployment-poland-three-russian-cruise-missiles-airspace", "summary": "پس از سقوط سه موشک کروز روسیه در خاک لهستان، ناتو مجوز اعزام یک هواپیمای راداری آواکس را صادر کرد. این هواپیما با شناسایی اهداف کم‌ارتفاع و انتقال اطلاعات به جنگنده‌ها و مراکز فرماندهی، به تقویت نظارت بر حریم هوایی لهستان و جناح شرقی ناتو کمک می‌کند.", "date_str": "2026-11-26T17:45:21+00:00", "hash": "5c683c2da69801e4", "title_fa": "ناتو رادار پرنده به آسمان لهستان فرستاد؛ «آواکس» چه توانایی‌هایی دارد؟", "summary_fa": "پس از سقوط سه موشک کروز روسیه در خاک لهستان، ناتو مجوز اعزام یک هواپیمای راداری آواکس را صادر کرد. این هواپیما با شناسایی اهداف کم‌ارتفاع و انتقال اطلاعات به جنگنده‌ها و مراکز فرماندهی، به تقویت نظارت بر حریم هوایی لهستان و جناح شرقی ناتو کمک می‌کند.", "image_url": "https://images.euronews.com/articles/stories/10/00/96/37/1200x675_cmsv2_95ccbab1-f594-5649-8b31-afba6d174bf0-10009637.jpg", "category": "موسیقی و هنر", "tags": ["رویداد", "گزارش"], "datetime_fa": "۵ آذر • ۲۱:۱۵"}, {"source": "Euronews Persian", "title": "«یورونیوز ویریفای»؛ اتحادیه اروپا تا چه زمانی از پس کمک به اوکراین برمی‌آید؟", "link": "https://parsi.euronews.com/2026/11/26/euronews-verify-how-can-the-eu-continue-to-afford-supporting-ukraine", "summary": "کمیسیون اروپا هفته گذشته از وامی ۴۵ میلیارد یورویی برای کمک به اوکراین در بحبوحه حملات هوایی بی‌وقفه روسیه قریب‌الوقوع دو زندانی سیاسی را محکوم کرد و خواستار آزادی فوری او شد. بر اساس این بیانیه، محمودیان پس از انتشار سندی درباره اجرای حکم اعدام «میلاد آرمون» و «نوید نجاران» دو زندانی سیاسی مرتبط با جنبش «زن، زندگی، آزادی» هدف برخورد نیروهای امنیتی قرار گرفت. به گفته گزارشگران بدون مرز، چند ساعت پس از انتشار این خبر، ماموران پلیس به خانه او در تهران مراجعه، او را بازداشت کرده و وسایل کارش را ضبط کردند. این سازمان گزارش داده است که محمودیان در دوران بازداشت تحت بدرفتاری و خشونت شدید قرار گرفته و شدت ضرب‌وشتم به حدی بوده که او بیهوش شده است. او پس از انتقال به بیمارستان، بار دیگر به زندان تهران بزرگ بازگردانده شده است. گزارشگران بدون مرز می‌گوید این روزنامه‌نگار با اتهام‌های «تبلیغ علیه نظام» و «انتشار اخبار کذب» روبه‌رو شده است. در پی انتشار سند مربوط به حکم اعدام دو زندانی سیاسی، واکنش‌های عمومی به این موضوع افزایش یافت و به گفته وکیل یکی از زندانیان، اجرای حکم اعدام متوقف شد. گزارشگران بدون مرز می‌گوید حکومت ایران در واکنش به انتشار این خبر، از وجود یک توافق «رسانه‌ای ـ قضایی» برای اخلال در روند کار دستگاه قضایی سخن گفته و روزنامه‌نگاران را به نظارت و برخورد تهدید کرده است. با این حال، احکام اعدام این دو زندانی همچنان لغو نشده‌اند. «جاناتان داگر»، مسوول بخش خاورمیانه گزارشگران بدون مرز، در این بیانیه تاکید کرده است: «روزنامه‌نگاری جان انسان‌ها را نجات می‌دهد و انتشار اطلاعات در راستای منافع عمومی نباید جرم تلقی", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/HX_YJPTWIAA2JcA_ZjRf__v1024x512__box_0%2C57%2C1601%2C900.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۵ آذر • ۲۰:۲۹"}, {"source": "Euronews Persian", "title": "اسرائیل بیش از ۵۳۰ پهپاد در کرانه باختری توقیف کرد؛ ممنوعیت استفاده غیرنظامی از پهپادها", "link": "https://parsi.euronews.com/2026/11/26/israel-seizes-530-drones-west-bank-bans-civilian-use", "summary": "ارتش اسرائیل از توقیف بیش از ۵۳۰ پهپاد در کرانه باختری از ابتدای سال ۲۰۲۶ خبر داد. اسرائیل نگهداری و استفاده از پهپادها، حتی برای مصارف غیرنظامی، را در این منطقه ممنوع کرده و دلیل آن را نگ ه اتهام «فعالیت تبلیغی و انحرافی مغایر با شرع مقدس اسلام از طریق ترویج و تبلیغ آیین بهائیت» به سه سال حبس تعزیری محکوم شده است. تشکیل گروه جوانان، نگهداری و ارسال جزوه‌های مذهبی و مشارکت در برنامه‌ریزی جلسات بهاییان از مصادیق این اتهام عنوان شده است. او همچنین از اتهام «فعالیت تبلیغی علیه نظام» تبرئه شده است. الهام خلص، همسر او، نیز به اتهام «فعالیت تبلیغی علیه نظام» به یازده ماه حبس تعزیری محکوم شده است. تدریس جزوه و ارسال محتوای آموزشی برای دانشگاه مجازی بهاییان (BIHE) و توصیف جمهوری اسلامی به‌عنوان حکومتی «سرکوبگر» در متون آکادمیک، از جمله مصادیق این اتهام اعلام شده است. الهام خلص نیز از اتهام «فعالیت تبلیغی و انحرافی مغایر با شرع مقدس اسلام» تبرئه شده است. علاوه بر احکام حبس، تلفن‌های همراه هر دو نفر نیز به حکم دادگاه ضبط خواهد شد. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/WhatsApp_Image_2026-11-26_at_11.29.05_AM_ULqd__v1024x512__box_0%2C24%2C1280%2C697.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۵ آذر • ۲۰:۰۹"}, {"source": "Radio Farda", "title": "ایتالیا می‌گوید دو شهروندش در حمله پهپادی ایران به کویت کشته شدند؛ ایران منکر حمله شد", "link": "https://www.radiofarda.com/a/italy-says-two-citizens-killed-in-iranian-drone-strike-in-kuwait/33906409.html", "summary": "وزارت خارجه ایتالیا روز پنجشنبه پنجم آذر گزارش‌ها درباره کشته شدن دو شهروند این کشور در حمله پهپادی ایران به کویت را تأیید کرد.", "date_str": "2026-11-26T14:44:25+00:00", "hash": "2f0c1e3a06d9390f", "title_fa": "ایتالیا می‌گوید دو شهروندش در حمله پهپادی ایران به کویت کشته شدند؛ ایران منکر حمله شد", "summary_fa": "وزارت خارجه ایتالیا روز پنجشنبه پنجم آذر گزارش‌ها درباره کشته شدن دو شهروند این کشور در حمله پهپادی ایران به کویت را تأیید کرد. ساعتی پیش‌تر اعلام شده بود این دو ایتالیایی بر اثر اصابت ترکش‌های ناشی از رهگیری پهپادهای ایرانی در کویت جان باختند. این پهپادها به گفته وزارت دفاع کویت، یک «تأسیسات حیاتی» را هدف قرار داده بودند. وزارت امور خارجه ایتالیا می‌گوید دو شهروند این کشور که برای شرکت دفاعی آلمانی «راین‌متال» کار می‌کردند، روز پنج‌شنبه در پی حمله پهپادهای ایرانی در کویت کشته شدند. این وزارتخانه در بیانیه‌ای اعلام کرد: «انفجاری ناشی از حمله پهپادی در محلی رخ داد که دو تکنسین ایتالیایی شرکت راین‌متال ایتالیا در آن مشغول کار بودند.» این بیانیه افزود هر دو نفر جان باختند. همچنین آنتونیو تایانی، وزیر خارجه ایتالیا، در اظهاراتی در مجلس سنا این کشور خبر داد حدود ساعت ۱۴ روز پنج‌شنبه، پهپادهایی با منشأ ایرانی تأسیسات نظامی کویت، از جمله یک ایستگاه شناسایی پدافند هوایی را هدف قرار دادند؛ جایی که دو تکنسین ایتالیایی شرکت راین‌متال ایتالیا مشغول به کار بودند. به گزارش خبرگزاری آنسا، او گفت: «انفجاری شدید رخ داد و بر اساس گزارش‌هایی که از کویت به دست ما رسیده است، هر دو هم‌وطنمان جان باخته‌اند.» تایانی با ابراز همدردی با خانواده‌های این دو قربانی، اعلام کرد سفارت ایتالیا بلافاصله برای بررسی وضعیت وارد عمل شده و خود او نیز با لورنتسو مورینی، سفیر این کشور در کویت، گفت‌وگو کرده است. در پی این اظهارات، رسانه‌های ایران اظهارات ابوالفضل شکارچی، سخنگوی ستادکل نیروهای مسلح جمهوری اسلامی را منتشر کردند که حمله به تأسیسات کویت را تکذیب کرد و گفت: «هیچ‌گونه عملیات نظامی یا تهاجمی از سوی نیروهای مسلح جمهوری اسلامی ایران در منطقه صورت نگرفته است.» پیش‌تر، سعود عبدالعزیز العتیان، سخنگوی وزارت دفاع کویت، در پیامی در حساب ارتش این کشور در شبکه اجتماعی ایکس اعلام", "image_url": "https://gdb.rferl.org/d49c94ba-e6ef-4c46-aa26-f0dddf57faaa_w1200_h630.jpg", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۵ آذر • ۱۸:۱۴"}, {"source": "Iran International", "title": "مسی و ستاره‌های فوتبال جهان در مراسم خداحافظی کارلوس توز", "link": "https://www.iranintl.com/202611263410", "summary": "لیونل مسی، سرخیو آگوئرو، مارتین پالرمو، جان‌لوئیجی بوفون، ریو فردیناند و لئاندرو پاردس در مراسم خداحافظی کارلوس توز در ورزشگاه لا بومبونرا حضور خواهند داشت. این مسابقه روز ۲۰ دسامبر برگزار می‌شود.", "date_str": "2026-11-26T16:08:04+00:00"  کار کشیدند. آن‌ها می‌گویند کمبود گازوئیل، افزایش بهای روغن، لاستیک و قطعات یدکی و پایین ماندن کرایه‌ها، ادامه کار را ناممکن کرده است. رضا اکبری، رییس سازمان راهداری و حمل‌ونقل جاده‌ای، دوم آذر وقوع اعتصاب را تکذیب کرد و گفت موضوع اعتصاب «جدیت نداشته است». با این‌همه روزنامه جهان‌صنعت به نقل از فعالان صنعت حمل‌ونقل، وقوع اعتصاب را تایید کرده و اتحادیه تشکل‌های کامیون‌داران و رانندگان ایران نیز نسبت به تداوم وضع موجود تا زمان تغییر مصوبه‌های کرایه‌های حمل بار هشدار داده است. به گفته این نهاد صنفی، ادامه این وضعیت به‌طور مستقیم بر تولید، توزیع کالا و قیمت‌ها اثر می‌گذارد. اتحادیه کامیون‌داران و رانندگان ایران در کانال تلگرامی خود نوشت: «کامیون تنها راننده و بار نیست. برای حرکت به گازوئیل، لاستیک سالم، روغن موتور و انواع قطعه نیاز دارد و هر یک از این اقلام اگر کم شود، کل زنجیره حمل‌ونقل لنگ می‌زند. بار کارخانه، محصول کشاورز و کالای مورد نیاز خانوارها با همین ناوگان جابه‌جا می‌شود.» در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/2026-11-26_11.04.14_VhnG__v1024x512__box_20%2C0%2C726%2C370.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۵ آذر • ۱۹:۲۷"}, {"source": "Euronews Persian", "title": "حملات موشکی و پهپادی روسیه به اوکراین دست‌کم سه کشته بر جای گذاشت", "link": "https://parsi.euronews.com/2026/11/26/russia-ballistic-missile-drone-strikes-ukraine-three-killed-ukrainian-attacks-russia", "summary": "حملات موشکی و پهپادی روسیه به اوکراین دست‌کم سه کشته در خارکیف و هفت زخمی در کی‌یف بر جای گذاشت. همزمان، پهپادهای اوکراینی یک کارخانه تولید مواد مورد استفاده در ساخت مواد منفجره، نیروگاه برق و تاسیسات نفتی روسیه را هدف قرار دادند. مسکو مدعی سرنگونی ۳۴۳ پهپاد شد.", "date_str": "2026-11-26T16:05:00+00:00", "hash": "c32f8ff5df17a803", "title_fa": "حملات موشکی و پهپادی روسیه به اوکراین دست‌کم سه کشته بر جای گذاشت", "summary_fa": "حملات موشکی و پهپادی روسیه به اوکراین دست‌کم سه کشته در خارکیف و هفت زخمی در کی هوری اسلامی به یکی از مراکز ...", "date_str": "2026-11-26T14:31:04+00:00", "hash": "96fd22283264d826", "title_fa": "دو شهروند ایتالیایی در پی حمله جمهوری اسلامی به کویت کشته شدند", "summary_fa": "«سعود العطوان»، سخنگوی وزارت دفاع کویت، عصر پنج‌شنبه ۵آذر۱۴۰۵ تایید کرد که دو شهروند ایتالیایی که در حمله جمهوری اسلامی به یکی از مراکز ... پیشتر خبرگزاری «آنسا» در ایتالیا گزارش داده بود که دو تکنسین ایتالیایی شرکت «راین‌متال» که در حمله جمهوری اسلامی به کویت مجروح شده بودند، کشته شده‌اند. راین‌متال بزرگ‌ترین شرکت صنایع دفاعی آلمان و یکی از تولیدکنندگان عمده تسلیحات، مهمات، خودروهای زرهی و سامانه‌های پدافند هوایی در اروپا است. شرکت راین‌متال ایتالیا، از شرکت‌های زیرمجموعه این گروه آلمانی، در رم مستقر است و در زمینه تولید رادارها و سامانه‌های پدافند هوایی فعالیت می‌کند. این دو تکنسین از کارکنان غیرنظامی راین‌متال ایتالیا بودند. سخنگوی وزارت دفاع کویت می‌گوید علاوه بر این دو شهروند ایتالیایی یک شهروند کویتی و یک شهروند پاکستانی هم مجروح شدند. بر اساس بیانیه ارتش کویت که در شبکه اجتماعی ایکس منتشر شد، نیروهای مسلح این کشور شماری از پهپادهای متخاصم را در حریم هوایی کویت شناسایی و با آن‌ها مقابله کردند. سخنگوی وزارت دفاع کویت همچنین گفته است که سقوط ترکش‌های ناشی از انفجار پهپادها، علاوه بر دو کشته و دو مجروح، خسارت‌های مادی نیز به همراه داشته است. نیروهای مسلح کویت همچنین بر تداوم آمادگی نظامی و اتخاذ تمامی اقدامات لازم برای حفاظت از حاکمیت، امنیت و ثبات این کشور و تامین امنیت شهروندان و افراد مقیم تاکید کردند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DA%A9%D9%88%DB%8C%D8%AA_SPKh__v1024x512__box_0%2C22%2C1312%2C712.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۵ آذر • ۱۸:۰۱"}, {"source": "Euronews Persian", "title": "تمو با تغییر رویه‌های تجاری خود در اتحادیه اروپا موافقت کرد، به‌گفته کمیسیون اروپا", "link": "https://parsi.euronews.com/ ز قاچاق نفت، تنش‌ها میان بغداد و اربیل را افزایش داده است. معترضان در اقلیم کردستان عراق امروز در اعتراض به این تصمیم دست به راهپیمایی زدند. علی زیدی، نخست‌وزیر عراق به وزارت نفت دستور داده تا «مدیریت تمامی میدان‌های نفتی» در استان‌های دیاله، کرکوک، صلاح‌الدین و نینوا را در اختیار بگیرد و آن را گامی ضروری برای مقابله با قاچاق نفت عنوان کرده است. این میدان‌ها با وجود آنکه خارج از مرزهای اقلیم کردستان عراق قرار دارند، تاکنون زیر چتر «اختیارات امنیتی» نیروهای کرد اداره می‌شدند. تنش بین بغداد واقلیم کردستان عراق به‌ویژه پس از آن بالا گرفت که دیوان عالی این کشور تدابیر جدید دولت مرکزی را مطابق قانون اساسی دانست. علاوه بر این، این دیوان اعزام نیروهای دولت مرکزی به اقلیم کردستان را هم قانونی دانست. قانون اساسی عراق برخی مناطق در این استان‌ها را به دلیل اختلافات حل‌نشده میان بغداد و اربیل بر سر ادعای حاکمیت و مالکیت، «مناطق مورد مناقشه» تعریف می‌کند. مقام‌های محلی اقلیم کرستان هم به اقدام دولت عراق اعتراض کرده‌اند. نچیروان بارزانی، رئیس‌ اقلیم کردستان عراق، در شبکه ایکس نوشت که حل مسائل بین بغداد و اربیل «باید بر اساس قانون اساسی، احترام به حقوق و جایگاه اقلیم کردستان در قانون اساسی و تعهد به اصول شراکت و تفاهم صورت بگیرد.» او گفت که اربیل «هرگونه ادبیات نظامی در قبال اقلیم کردستان را قاطعانه رد می‌کند.» مسرور بارزانی، نخست‌وزیر اقلیم کردستان عراق هم تصمیم اعلام‌شده از سوی دولت عراق را رد کرده و با بیان اینکه این تصمیم مغایر با مذاکرات پیشین حکومت اقلیم کردستان با بغداد است، آن را «غیرقابل قبول» خوانده است. دولت عراق هم‌زمان با افزایش تنش‌ها با اقلیم کردستان در پی مجموعه‌ای از اقدامات اخیر،", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/e12c/live/128e9030-e9a3-11f1-a094-5fdc692f3e33.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۵ آذر • ۱۷:۵۵"}],

ave to be honest with themselves,\" said Marlon Nichols, a founding partner at Mac Venture Capital . \"Some of them aren't really venture-scale or venture-type investments. We're looking for the next big thing, the next category leader.\" Meet 19 startups in social networking, dating, and AI that investors have their eyes on In the AI era, investors have their eyes set elsewhere, forcing social media startups to get creative with their e", "date_str": "2026-11-26T15:57:32+00:00", "hash": "25e9da361d798f4c", "title_fa": "فهرست 19 استارت آپی را بخوانید که به دنبال ایجاد اختلال در برنامه های دوستیابی و شبکه های اجتماعی هستند که میلیون ها نفر را جمع آوری کرده اند.", "summary_fa": "آی استوک؛ ربکا زیسر/BI استارت‌آپ‌های اجتماعی، حرفه‌ای و شبکه‌های اجتماعی جدید وارد صحنه می‌شوند. VC ها و سرمایه گذاران فرشته در حال تامین مالی برخی از این استارت آپ های امیدوارکننده هستند. در اینجا 19 استارت‌آپ از آن‌ها استفاده می‌شود که در دوره‌های بالا بردن یا خرید استفاده می‌شوند. نسل جدیدی از استارت آپ های اجتماعی مصرف کننده در حال ظهور است. از پلت‌فرم‌هایی که بر جذب افراد برای ملاقات با IRL متمرکز شده‌اند تا اپلیکیشن‌های دوست‌یابی که در Tinder یا Hinge تمرکز دارند، استارت‌آپ‌ها صحنه اجتماعی دیجیتال را مختل می‌کنند. بنیان‌گذاران این استارت‌آپ‌ها در حال مقابله با مشکلاتی مانند تنهایی، خستگی برنامه‌های دوستیابی و نارضایتی عمومی از مدیران فعلی رسانه‌های اجتماعی هستند. برخی از بنیان‌گذاران از پس‌زمینه‌های Big Tech می‌آیند، مانند تیم سنگین اینستاگرام پشت برنامه اشتراک‌گذاری عکس Retro، یا کارمندان سابق Google که برنامه نقشه‌برداری اجتماعی PamPam را می‌سازند. بنیانگذاران Gen Z نیز مانند ایزابلا اپستین با برنامه Kndrd که بر روی IRL متمرکز شده است، کلاه خود را در رینگ پرتاب می‌کنند و در این راه به تولیدکنندگان محتوا تبدیل می‌شوند. سرمایه گذاران توجه دارند. با 22 VC و سرمایه‌گذار چشمگیر به استارت‌آپ‌های اجتماعی جدید آشنا شوید برخی از صندوق‌های سرمایه‌گذاری خطرپذیر - مانند شرکت فرانسوی Intuition VC یا شرکت متمرکز بر بازی Patron - مقابله با تنهایی و روابط را بخشی از پایان‌نامه‌های سرمایه‌گذاری خود قرا e of Snow's life for 65 years. \"Sunrise on Reaping\" jumps ahead 40 years to the 50th Hunger Games, the games that Haymitch (Joseph Zada) wins. The story picks up with Haymitch's life in District 12, where he has a family, friends, and a girlfriend, Lenore Dove (Whitney Peak). After he's reaped, he meets many of our future faves, including Plutarch Heavensbee (Jesse Plemons), Effie Trinket (Elle Fanning), Beetee (Kelvin Harrison Jr.), Wiress (Maya Hawke), and Mags (Lili Taylor). Both films add complexity and depth to the world of Panem, and they continue the social and political commentary themes that are so central to Katniss' story . Not only do we like these movi", "date_str": "2026-11-26T15:22:01+00:00", "hash": "fe1b9c8fdf0aa24c", "title_fa": "بهترین، بدترین و غیرضروری ترین پیش درآمدهای تاریخ سینما", "summary_fa": "هایمیچ و افی، البته با بازی بازیگران مختلف، در بازی‌های گرسنگی: طلوع آفتاب در درو بازگشته‌اند. Lionsgate با پیش درآمد، هالیوود می تواند تا حد امکان از مالکیت معنوی بهره ببرد. پیش درآمدها همچنین می توانند راه خوبی برای روشن کردن چیزهای جدید در مورد یک داستان یا شخصیت باشند. در اینجا تعدادی از بهترین، بدترین و ساده ترین دنباله های غیرضروری تاریخ سینما آورده شده است. قبل از سال 2025، اگر از یک طرفدار معمولی «بازی‌های گرسنگی» با این سوال که بازی‌های چه کسانی را می‌خواهند در صفحه (یا صفحه نمایش) به تصویر کشیده شده، نظرسنجی کنید، مایلیم شرط ببندیم که اکثریت می‌گویند: هایمیچ. این طرفداران در این ماه به آرزوی خود رسیدند، زیرا \"بازی های گرسنگی: طلوع آفتاب در درو\" سرانجام در سینماها اکران شد. جوزف زادا در نقش یک هیمیچ آبرناتی نوجوان، مربی بداخلاق منطقه 12 که اولین بار توسط وودی هارلسون ایفای نقش شد، بازی می کند. این فیلم (و کتابی که بر اساس آن ساخته شده است) به طرفداران نگاه جدیدی به وحشت های هیمیچ در طول و بعد از پنجاهمین بازی های گرسنگی داد. ما خراب نمی کنیم، اما این وحشیانه است. اما برای هر «طلوع خورشید در درو»، یک «موفاسا»، «تهدید شبح» یا «وانکا» وجود دارد... و این تنها مواردی نیستند که هالیوود پیش درآمدی را منتشر کرده است که ممکن است کاملاً ضروری باشد /26/as-anthropic-ipos-grand-theft-auto-vi-proves-why-efficiency-isnt-a-virtue/", "summary": "On the same day that Anthropic entered the public market, a painstakingly human video game became one of most successful entertainment launches of all time.", "date_str": "2026-11-26T16:00:00+00:00", "hash": "a300818b0de7ac52", "title_fa": "Grand Theft Auto VI به عنوان IPO های Anthropic ثابت می کند که چرا کارایی یک فضیلت نیست", "summary_fa": "در همان روزی که آنتروپیک وارد بازار عمومی شد، یک بازی ویدئویی پر زحمت انسانی به یکی از موفق‌ترین راه‌اندازی‌های سرگرمی در تمام دوران تبدیل شد. برای \"Grand Theft Auto VI\" (GTA VI) باید غیرممکن بود که بتواند به این هیاهو عمل کند. طرفداران 13 سال منتظر جدیدترین قسمت این مجموعه جنایی-ماجراجویی بودند و Rockstar Games حتی زمانی که بازی در نهایت هفته گذشته منتشر شد، حتی از آن انتظارات غیرقابل تصور هم فراتر رفت. GTA VI به عنوان بالاترین امتیاز تمام دوران در متاکریتیک راه اندازی شد و در روز انتشار 3.79 میلیارد دلار به دست آورد تا بزرگترین رویداد سرگرمی تاریخ باشد – عظیم تر از «انتقام جویان: پایان بازی» (2.9 میلیارد دلار) یا تور تیلور سویفت (2 میلیارد دلار). انتظار 13 ساله مطمئناً به جنون و فروش در اطراف GTA VI دامن زد، اما برخی از طرفداران GTA VI را به خاطر چیزی که در عصر نوظهور هوش مصنوعی نشان می دهد هوس کردند. حتی بزرگترین معتادان به کار در میان ما - بنیانگذاران استارتاپ - برای بازی کردن زمان استراحت تعیین کردند، از جمله دیما بیسدا، یکی از بنیانگذاران Spiry، که به TechCrunch گفت، من حجم کاری خود را تغییر دادم تا آخر هفته ها وقت خالی کنم و حتی برای حفظ انرژی ام، قطره های ویتامین IV رزرو کردم. با این حال، برخی از بازیکنان حس نوستالژی پیش‌بینی‌کننده‌ای داشتند که لایه‌ای از گرد و غبار را بر روی ایکس‌باکس خود پاک کردند تا بازی‌ای را انجام دهند که از کودکی منتظر آن بودند. بن فدر، شریک مدیریت TIRTA Ventures و مدیر عامل سابق شرکت مادر Rockstar Take-Two Interactive، به TechCrunch گفت: ما معتقدیم که GTA احتمالا آخرین بازی در نوع خود خواهد بود که به این روش ساخته می شود. به این دلیل که GTA VI کاملاً بدون هوش مصنوعی تولید شده است. فدر گفت:", "image_url" -sentenced-to-47-month-prison-sentence-after-using-ai-impersonate-streamer/", "summary": "David Anthony Sanchez, the man who impersonated N3on, scammed victims out of $260,000 worth of cryptocurrency.", "date_str": "2026-11-26T15:50:37+00:00", "hash": "c1df98929a83ca2f", "title_fa": "مردی به دلیل استفاده از هوش مصنوعی برای جعل هویت استریمر N3on به ۴۷ ماه زندان محکوم شد", "summary_fa": "دیوید آنتونی سانچز، مردی که خود را جعل هویت N3on کرد، از قربانیان 260000 دلار ارز دیجیتال کلاهبرداری کرد. دیوید آنتونی سانچز از قربانیان 260000 دلار ارز دیجیتال کلاهبرداری کرد. Paras Griffin/Getty Images افزودن انگجت به گوگل: منبع برگزیده Google Discover مردی از فلوریدا که به \"دیو جواهر\" معروف است، پس از اجرای یک کلاهبرداری از ارزهای دیجیتال که شامل استفاده از هوش مصنوعی برای جعل هویت یک استریمر معروف بود، به 47 ماه زندان محکوم شد. دیوید آنتونی سانچز، که به پولشویی و سرقت هویت تشدید شده اعتراف کرد، همچنین به قربانیان غرامت محکوم شد. همانطور که توسط Aftermath مشاهده شد، دفتر دادستانی ایالات متحده در منطقه جنوبی فلوریدا گفت سانچز از هوش مصنوعی برای شبیه سازی صدای Mikyle \"N3on\" Rafiq استفاده کرد تا افراد پشت پروژه memecoin را متقاعد کند که استریمر با تایید، تبلیغ و مشارکت در طرح آنها موافقت کرده است. کلاهبردار در حین برقراری ارتباط با سازمان دهندگان پروژه وانمود کرد که هم N3on و هم نماینده استریمر است. سانچز آنها را فریب داد تا حدود 260000 دلار ارز دیجیتال را به حساب‌هایی که تحت کنترل او بود منتقل کنند. او سپس مقداری از رمزارز را به دلار آمریکا تبدیل کرد که برای منافع شخصی خود استفاده کرد. یارا لورنزو کلوکاس، سرپرست دادستان ناحیه جنوبی فلوریدا، گفت: «در پشت هر طرح کلاهبرداری، افراد واقعی هستند که آسیب مالی واقعی را متحمل می شوند. \"در این پرونده، متهم از هوش مصنوعی برای دستکاری اعتماد قربانیان ناآگاه و محروم کردن آنها از پول آنها سوء استفاده کرده است. حکم امروز نشان دهنده تعهد ما به حمایت از قربانیان، حفاظت از یکپارچگی بازارهای مالی ما و پاسخگویی به کسانی است که از فناوری های نوظهور برای کلاهبرداری از دیگران سوء استفاده می کنند.\"", "image_url": "https://www.engadget.com/img/gallery/ ting glimpse into the wonderfully chaotic world of the música mexicana breakout star s May debut album, Los Locos Nunca Mueren (Crazy People Never Die). Related Who Is Chuyin? Masked Artist s Debut Album Los Locos Nunca Mueren Arrives on Billboard Charts Chuyin Unmasks First Billboard No. 1 With ‘Pues Qué Le Hago?’ All the Performances at the 2026 Billboard Latin Music Awards But to understand the mysterious masked performer, first enter the void. “Before Chuyín, there was nothing, just black space,” the masked singer tells Billboard . According to his origin story, he came into existence on May 6, 2023, at a Fuerza Regida concert in Tepic, Nayarit, where frontman Jesús Ortiz Paz (JOP) adopted him. He’s been living with JOP ever since, he says, never once breaking character throughout the interview. Chuyín is three years old — or 21, if you count in dog years, as he does — and already making his mark on música mexicana. His 16-track debut album, released May 7 via Street Mob Records, debuted at No. 9 on the Top Regional Mexican Albums chart and No. 17 on Top Latin Albums , both dated May 23. In September, “Pues Qué Le Hago?” gave him his first No. 1 on a Billboard chart, topping Regional Mexican Airplay . On Los Locos Nunca Mueren , which features Fuerza Regida, Calle 24 , Luis R Conriquez , Óscar Maydon and Jorsshh, Chuyín takes on the carnal pleasures and intoxicating excesses common to contemporary corridos — then gives them a comedic twist. His protagonist doesn’t escape the consequences. On “Paniki,” a cheating Chuyín goes to ridiculous lengths to conceal his infidelity, only to get caught when he tries his luck again. On the album opener, “Rehabilitado,” he declares himself rehabilitated while remaining tempted by his vices. “Everyone sings about the never-ending party. I sing about the hangover,” he says. “Everyone sings about partying, partying and partying. I sang about getting sent to rehab.” Consequences are central to Chuyín’s character, but so is perseverance. “Chuyín is the guy everything happens to, and somehow he gets back up and keeps going,” he explains. “Everything that could go wrong happens to Chuyín, and he gets up with the same smile and says, ‘OK, let’s keep going.’” Beh", "date_str": "2026-11-26T15:00:00+00:00", "hash": "756d72573264fac7", "title_fa": "درون دنیای دیوانه چویین: «همه درباره مهمانی بی پایان می خوانند. من درباره خماری می خوانم", "summary_fa": "در مراسم جوایز موسیقی لاتین بیلبورد 2026، ماه گذشته، گروهی از چویین‌ها با جلیقه‌های تنگ سفید صحنه را در حین اجرای موسیقی پوئس یا نی پدو به بخش روانپزشکی تبدیل کردند. در پایان نمایش، اعضای Fuerza Regida در زیر ماسک‌های بزرگ نشان داده شد - نگاهی اجمالی به دنیای پر هرج و مرج آلبوم اولین ستاره موسیقی مکزیکا، Los Locos Nunca Mueren (مردم دیوانه هرگز نمی‌میرند). مطالب مرتبط چویین کیست؟ اولین آلبوم هنرمند نقابدار Los Locos Nunca Mueren وارد نمودارهای بیلبورد شد Chuyin اولین بیلبورد شماره 1 را با «Pues Qué Le Hago؟» از همه اجراها در جوایز موسیقی لاتین بیلبورد در سال 2026 آشکار می کند اما برای درک مجری مرموز نقابدار، ابتدا وارد فضای خالی شوید. این خواننده نقابدار به بیلبورد می گوید: «قبل از چویین، هیچ چیزی وجود نداشت، فقط فضای سیاه. طبق داستان اصلی او، او در 6 مه 2023 در یک کنسرت Fuerza Regida در تپیک، نایاریت، جایی که جسوس اورتیز پاز (JOP) خواننده او را به فرزندی پذیرفت، پا به عرصه وجود گذاشت. او می‌گوید که از آن زمان با JOP زندگی می‌کند و حتی یک بار هم شخصیت خود را در طول مصاحبه شکسته است. چویین سه ساله است - یا اگر سال های سگ را حساب کنید، 21 سال دارد - و در حال حاضر اثر خود را در موسیقی مکزیکا گذاشته است. اولین آلبوم 16 آهنگی او که در 7 می از طریق Street Mob Records منتشر شد، در رتبه اول قرار گرفت. رتبه 9 در جدول برترین آلبوم‌های منطقه‌ای مکزیکی و شماره 17 در آلبوم‌های لاتین برتر، هر دو به تاریخ 23 می. در سپتامبر، \"Pues Qué Le Hago?\" اولین شماره 1 خود را در جدول بیلبورد به او داد و در صدر مسابقات منطقه ای مکزیک ایرپلی قرار گرفت. در Los Locos Nunca Mueren، که Fuerza Regida، Calle 24،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Ch . وست به عنوان فیلمنامه نویس و تهیه کننده اجرایی The Neighbor، یک فیلم هیجانی روانشناختی که از رویدادهای واقعی الهام گرفته شده و توسط کایل اسکات کارگردانی شده است، به دنیای فیلمسازی قدم می گذارد. بازیگران بین‌المللی شامل مایلز ترویت (چیزهای عجیب)، جوزف استیون یانگ (G20)، هانا کیم (مادر/اندروید) و استونب‌وی، موسیقی‌دان غنائی آفریقایی و سالن رقص هستند. اخبار مرتبط وارویک تورنتون، تئونا استروگار میتفسکا میروسلاو اسلابوشپیتسکی در صحنه سینماارت سان روتردام حقوقی پرونده تجاوز جنسی ژرارد دوپاردیو در دادگاه جنایی پس از اینکه بازیگر از دست دادن درخواست تجدیدنظر وست، که 15 فصل را در NBA گذرانده و دو پروژه جنگی در فیلمنامه ایالت طلایی را برنده شده است به دادگاه فرستاده شد. منطقه خلیج فرانسیسکو این فیلم یک بسکتبالیست حرفه ای کهنه کار و همسرش را دنبال می کند که امیدهایشان برای شروعی جدید و آرام، زمانی که حضور ناراحت کننده در محله آنها آنها را به شبکه خطرناکی از وسواس، دستکاری و رازهای مدفون می کشاند، از هم باز می شود. هنگامی که احساس امنیت آنها شروع به فروپاشی می کند، این زوج متوجه می شوند که بزرگترین تهدیدها ممکن است بیشتر از آنچه تصور می کردند در نزدیکی خانه پنهان شوند. تیتراژ فیلم Deadline کایل اسکات از جمله اکشن کمدی Boyz Trip با Rome Flynn، Algee Smith، Desi Banks و Sivuyile Ngesi", "image_url": "https://deadline.com/wp-content/uploads/2026/11/The-Neighbor-2.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "سینما", "موسیقی"], "datetime_fa": "۵ آذر • ۱۸:۲۳"}, {"source": "Rolling Stone", "title": "All the ‘GTA’ Games Ever, Ranked", "link": "https://www.rollingstone.com/culture/rs-gaming-lists/gta-grand-theft-auto-games-ranked-1235661232/", "summary": "From handheld free-for-alls to the newest groundbreaking title, here's all the franchise's entries, from worst to best", "date_str": "2026-11-26T15:00:00+00:00", "hash": "9f20aba60492d1a6", "title_fa": "همه بازی‌های «GTA» که تاکنون رتبه‌بندی شده‌اند", "summary_fa": "از بازی‌های رایگان برای همه تا جدیدترین عنوان پیشگامانه، در اینجا همه ورودی‌های فرنچایز، از بدترین تا بهترین آمده است، مگر اینکه در 30 سال گذشته 0:00+00:00", "hash": "ea09c9590848e259", "title_fa": "تمرین فوتبال و موسیقی قرمز خاک: در زمین با گروه اوکلاهاما کیلند", "summary_fa": "کایل راس، مربی دبیرستان و هنرمند تور، می‌گوید: «نمودار ون بزرگی از علایق مربیان خارج از فوتبال وجود دارد، و یکی از آنها موسیقی است. مسلما هیچ روزی برای فوتبال بهتر از تماشای آن یا بازی کردن آن نیست. اما در این بعد از ظهر خاص اواخر تابستان، علی‌رغم دمای سه رقمی و آفتاب اوکلاهما که هوا را حتی داغ‌تر می‌کند، فوتبال یک کار غرق در عرق است: مربی کایل راس من را در تمرین قرار می‌دهد. از دست هیچ یک از ما نیست که شغل اصلی راس مربیگری ورزشکاران پرانرژی نوجوانان در برنامه فوتبال شاخص این ایالت، در بیکسبی است، و من یک روزنامه نگار نامتعارف در اواخر دهه 40 او هستم. اگر تمرینات راس را درست و سالم تمام کنم، آن را موفقیت آمیز اعلام خواهیم کرد. «تو چی؟ سه به سه یا چهار به چهار اینجا پاس می‌گیرند؟» راس - که همچنین بنیانگذار و رهبر گروه Keyland است - از من می پرسد. فوتبال من در دبیرستان، 30 سال پیش به پایان رسید، اما من یک گیرنده شکاف بودم که به گرفتن هر چیزی که به راهم می‌افتد شهرت داشتم. اگر الان شروع به انداختن کارت کنم والدینم چه می گویند؟ به او قول می دهم: «بدنم را روی این چمن می اندازم تا پاس را از دست ندهم. در چند ماه آینده، راس تلاش خواهد کرد تا به عنوان مربی و هنرمند تور، تعادل نسبتاً منحصر به فردی ایجاد کند. او سالن مرکوری در تولسا، در 30 دقیقه شمال بیکسبی را تیتر خواهد کرد و آن را به فروش خواهد رساند، یک مسیر ساحل شرقی را برای مورگان وید باز خواهد کرد و مجموعه ای از تاریخ های سال 2027 را اعلام خواهد کرد که از کیتلین باتس حمایت می کنند. و در حالی که او ظاهراً در حال تبلیغ Knuckle Sandwich، سومین آلبوم استودیویی کیلند", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Keyland020-2.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آذر • ۱۸:۳۰"}, {"source": "Hollywood Reporter", "title": "Get Ready for the Great Asterix Film Festival and Three Restored ‘Asterix’ Animated Movies!", "link": "https://www.hollywoodreporter.com/movies/movie-news/asterix-film-festival-three-restored-asterix-movies-coming-1236763992/", "summary": "StudioCanal and Mediatoon Distribution have struck a distribution agreement for the popular European comic book franchise.", "date_str": "2026-11-26T14:59:34+00:00", "hash": "3045644c5abdd881", "title_fa": "برای جشنواره بزرگ فیلم آستریکس و سه انیمیشن بازسازی شده «آستریکس» آماده شوید!", "summary_fa": "StudioCanal و Mediatoon Distribution قراردادی را برای توزیع مجموعه محبوب کتاب های مصور اروپایی منعقد کرده اند. StudioCanal، واحد استودیو Canal+ Group، و Mediatoon Distribution، بازوی توزیع محتوا Média-Participations، توافقنامه توزیع اروپایی را که شامل سه فیلم کلاسیک انیمیشن آستریکس بازسازی شده است، منعقد کرده‌اند. این قرارداد شامل سه عنوان برجسته از کاتالوگ فرنچایز، یعنی آستریکس گول، آستریکس و کلئوپاترا، و آستریکس رم را فتح می‌کند، در چندین قلمرو اروپایی، از جمله فرانسه، آلمان، لهستان و هلند. شرایط مالی فاش نشد. اولین ابتکار مهم تحت این مشارکت، جشنواره بزرگ فیلم آستریکس خواهد بود که توسط StudioCanal در آلمان از ژانویه 2027 برگزار می شود. داستان‌های مرتبط سازندگان تاریک تلویزیونی در اولین تیزر خبری از جنگل‌های وهم‌آور آلمان بازدید می‌کنند. دادگاه فرانسوی درخواست تجدیدنظر دوپاردیو در پرونده تجاوز را رد کرد. شرکت مشهور در ماجراجویی‌های روز پنجشنبه اعلام کرد که جشنواره این سه فیلم را در نسخه‌های بازسازی‌شده‌شان به صفحه بزرگ بازمی‌گرداند و به مخاطبان فرصتی منحصربه‌فرد برای کشف دوباره برخی از نمادین‌ترین انیمیشن‌های ماجراجویی ارائه می‌دهد. در کنار این رویداد تئاتری، مجموعه جعبه دی وی دی کلکسیونی شامل این سه فیلم به ترتیب در فصل تعطیلات 2026 و در بهار 2027 در فرانسه و آلمان منتشر خواهد شد. در لهستان و هلند، این فیلم‌ها بر روی پلتفرم‌های ویدیویی بر اساس تقاضا نیز در دسترس خواهند بود و مخاطبان جدیدی را در هر دو منطقه به دست خواهند آورد. این ابتکار بخشی از یک تلاش گسترده تر برای جشن گرفتن و ترویج جهان آستریکس در سراسر اروپا است. به گفته استودیوکانال، این چندین نقطه عطف مهم در تاریخ این فرنچایز در سال‌های آینده همراه خواهد بود، از جمله پنجاهمین سالگرد Asterix Conques Rome و شصتمین سالگرد Asterix the Gaul در سال 2028.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2019/11/asterix-publicity_-_h_2019_.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آذر • ۱۸:۲۹"}, {"source": "Billboard", "title": "Was The Rolling Stones’ 1973 Still Part of the Band’s Classic Period, Or the Beginning of the End? (Greatest Pop Stars Podcast)", "link": "https://www.billboard.com/music/pop/rolling-stones-1973-greatest-pop-stars-podcast-discussion-1236390158/", "summary": "In 1973, The Rolling Stones were coming off one of the greatest album runs in rock and roll history, a four-album stretch that cemented them as the World s Greatest Rock and Roll Band, culminating in 1972 s Exile on Main Street and its legendarily hedonistic accompanying tour. Rather than take time off to victory lap following this iconic period, they headed to Jamaica to record their third album of the 70s, released in 1973 as Goats Head Soup — which topped the Billboard 200 and spawned a Billboard Hot 100 No. 1 single with breakup ballad Angie, but drew middling lukewarm and is now viewed by many fans as the beginning of the end of the band s glory days. On this Vintage Pop Stardom episode of the Greatest Pop Stars podcast , host Andrew Unterberger is joined by Billboard executive digital director, east coast Joe Lynch — who wrote an excellent Stones cover story in July — to discuss a fascinating year in the Stones trajectory, where they were still one of the biggest bands in the world, but moving into their holiday period as rock standard-bearers. Along the way, we answer all the most pressing questions about the 1973 Rolling Stones: Was Goats Head Soup really that much of a step down for the Stones, or is it a bit misunderstood historically? Is it surprising we didn t get more of a reggae album out of it? What was the deal with that album title and album cover? Is Angie a little too MOR for our tastes? How much did the band go on to miss Mick Taylor (and/or Jimmy Miller) after their departures? Was Truman Capote really unable to find a story following the Stones on their single most storied tour? And perhaps most importantly: Why the hell are we doing the 1973 Rolling Stones for this podcast right now anyway? Check it out above, along with a YouTube playlist of the Stones biggest 1973 moments — all of which are discussed in the episode — and subscribe to the Greatest Pop Stars podcast on Apple Music or Spotify (or wherever you get your podcasts ) for weekly discussions every Thursday about all things related to pop stardom! And as we say in every one of these GPS podcast posts — if you have the time and money to spare, please consider donating to any of these causes in the fight for trans rights: Transgender Law Center Trans Lifeline Destination Tomorrow Gender-Affirming Care Fundraising on GoFundMe Human Rights Campaign – In Your Area", "date_str": "2026-11-26T14:47:13+00:00", "hash": "03cece9e5f3a13a9", "title_fa": "آیا سال 1973 رولینگ استونز هنوز بخشی از دوره کلاسیک گروه بود یا آغاز پایان آن؟ (پادکست بزرگترین ستاره های پاپ)", "summary_fa": "در سال 1973، رولینگ استونز یکی از بهترین آلبوم‌های تاریخ راک اند رول را منتشر کرد، چهار آلبومی که آنها را به عنوان بزرگترین گروه موسیقی راک اند رول جهان تثبیت کرد و در تبعید در خیابان اصلی در سال 1972 و تور افسانه‌ای لذت‌گرای همراه آن به اوج خود رسید. به جای استراحت برای دور پیروزی پس از این دوره نمادین، آنها به جامائیکا رفتند تا سومین آلبوم خود را در دهه 70 ضبط کنند، که در سال 1973 با عنوان Goats Head Soup منتشر شد - که در صدر بیلبورد 200 قرار گرفت و یک تک آهنگ داغ بیلبورد 100 شماره 1 را ایجاد کرد که با تصنیف فروپاشی انجی شروع شد، اما اکنون به عنوان آهنگی که بسیاری از طرفداران آن را می بینند، در حال مشاهده است. پایان روزهای شکوه گروه استعدادهای مرتبط: Belinda Carlisle، UB40، Spandau Ballet بیشتر به یاد داشته باشید اندی تیلور U2 Wind the Years Back With Classics، ادای احترام دالی پارتون برای شب شکرگزاری NFL نیمه وقت نمایش سریال Hunger Games به شماره بازگشت. 1 در نمودار موسیقی متن پس از         const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
