f higher long-dated yields, AI accounts for about one-fifth of the recent rise, according to strategists at ING in a Thursday note. Much of the discussion around AI's impact on bond yields has centered on Big Tech's borrowing spree, which has forced companies to compete with governments for investor capital. But that's only part of the story, the strategists argued. The bank estimates roughly 70% of AI's impact on long-dated yields stems from expectations that the technology will boost productivity and long-run economic growth. By comparison, only about 25% comes from higher AI-related corporate debt issuance. That's because if AI makes businesses more productive, investors expect companies to borrow and invest more, pushing up expectations for long-term interest rates. Those expectations can push up real bond yields even before productivity gains become visible in economic data, they wrote. \"Whether we like it or not, rises in real yields for productivity reasons should be construed as higher yields for 'positive' reasons,\" the bank's strategists wrote. ING's strategists compare today's AI boom with the dot-com era, when the 10-year real Treasury yield reached about 4% amid optimism over technology. At roughly 2.9% today, real yields remain well below those levels, the strategists wrote. \"Arguably, the productivity story today is even more persuasive than it was back then,\" they wrote. ING's note comes as the global bond selloff gathered pace. Yields on long-dated government debt have climbed across the US, Europe, and Japan as investors grapple with persistent inflation, resilient growth, higher oil prices, and concerns over government borrowing. The move has pushed borrowing costs to multi-year highs in many major economies, raising the stakes for richly valued equity markets. On Thursday, the benchmark 10-year US Treasury yield climbed as high as ", "date_str": "2026-10-02T05:35:37+00:00", "hash": "8e91fcb11669360e", "title_fa": "ING می گوید رونق هوش مصنوعی باعث افزایش بازده اوراق قرضه به روش هایی فراتر از استقراض شرکتی می شود.", "summary_fa": "فروش جهانی اوراق قرضه با ارزیابی مجدد رشد، تورم و تاثیر اقتصادی هوش مصنوعی توسط سرمایه گذاران، بازدهی خزانه داری را به بالاترین حد در چند دهه اخیر رساند. هوش مصنوعی Charly Triballeau/AFP/Getty Images به دلایلی فراتر از تامین مالی مراکز داده جدید، بازده اوراق قرضه را افزایش می دهد. به گفته ING، بازارها به طور فزاینده ای پتانسیل هوش مصنوعی را برای افزایش بهره وری و رشد بلندمدت قیمت گذاری می کنند. با تعمیق فروش جهانی اوراق قرضه، بازدهی اوراق بهادار خزانه داری به بالاترین حد در چند دهه اخیر رسیده است. رونق هوش مصنوعی باعث افزایش بازده اوراق قرضه بلندمدت می شود که فراتر از موج استقراض شرکتی است. به گفته استراتژیست‌های ING در یادداشت پنجشنبه، در حالی که تورم و کسری‌های مالی همچنان بزرگترین محرک‌های بازدهی بلندمدت هستند، هوش مصنوعی حدود یک پنجم افزایش اخیر را تشکیل می‌دهد. بسیاری از بحث‌ها در مورد تأثیر هوش مصنوعی بر بازده اوراق قرضه بر وام‌گیری Big Tech متمرکز شده است که شرکت‌ها را مجبور به رقابت با دولت‌ها برای سرمایه‌گذاری سرمایه‌گذاران کرده است. استراتژیست ها استدلال کردند اما این تنها بخشی از داستان است. این بانک تخمین می‌زند که تقریباً 70 درصد از تأثیر هوش مصنوعی بر بازدهی طولانی‌مدت ناشی از انتظارات است که این فناوری بهره‌وری و رشد اقتصادی بلندمدت را افزایش دهد. در مقایسه، تنها حدود 25 درصد از انتشار بدهی های شرکتی مرتبط با هوش مصنوعی بالاتر است. این به این دلیل است که اگر هوش مصنوعی باعث بهره‌وری کسب‌وکارها شود، سرمایه‌گذاران انتظار دارند که شرکت‌ها وام بگیرند و سرمایه‌گذاری بیشتری کنند و انتظارات برای نرخ‌های بهره بلندمدت را افزایش دهند. آنها نوشتند که این انتظارات می تواند بازده واقعی اوراق قرضه را حتی قبل از اینکه افزایش بهره وری در داده های اقتصادی قابل مشاهده باشد، افزایش دهد. استراتژیست های بانک نوشتند: «چه بخواهیم چه نخواهیم،"}, {"source": "Business Insider", "title": "Milk Bar founder Christina Tosi shares the hiring approach she used to grow her bakery business", "link": "https://www.businessinsider.com/christina-tosi-milk-bar-hiring-approach-talent-women-2026-10", "summary": "Milk Bar founder Christina Tosi said she found a way to turn overlooked talent into a business advantage. Mike Coppola/Getty Images for The Original Donut Shop Milk Bar founder Christina Tosi said she took a hands-on approach to building her team. That also meant looking beyond a candidate's technical skills, she said. Tosi said also saw a way to turn overlooked talent into a business advantage. Milk Bar founder Christina Tosi said the key to hiring a great team is learning to do the jobs yourself first. \"For the longest time, I demanded of myself to work the job, whether that was human resources, or ops, or the delivery driver, or the pick-pack-ship person,\" Tosi said on Thursday's episode of the \" Pretty Tough with Maria Sharapova \" podcast. Whenever the company needed to create a new role, Tosi said she first wanted to understand what the job involved before hiring someone to do it. \"What is it like to work this job? What are the highs and the lows? What kind of personality would it take?\" she said. \"And then, how do I find someone who can be better than me at it?\" Beyond technical skills, Tosi said she looked for people she would want beside her, \"celebrating the highs, and being in the trenches on the hard days and lows with.\" She added that she was focused on hiring women for leadership roles because of how difficult she had found it to gain opportunities herself. \"It wasn't just getting a foot in a door. Like, I had to put my whole body in the door jam just to get in, and then I had to prove my worth,\" Tosi said. She saw an opportunity to hire talented women whose potential other employers might have overlooked and make that a strength for her business. \"I definitely know how smart and brilliant women are. I know how tough they are. I know how driven they are,\" Tosi said. \"And I thought, well, this is a secret that maybe other people don't know yet, and I'm going to leverage it to my freaking advantage.\" Other entrepreneurs have also ه بود، بر استخدام زنان برای نقش‌های رهبری متمرکز بود. طوسی گفت: \"این فقط یک پا در یک در نبود. مثلاً، من مجبور بودم تمام بدنم را در گیره در بگذارم تا وارد شوم و سپس باید ارزشم را ثابت کنم.\" او فرصتی دید تا زنان با استعدادی را استخدام کند که سایر"}, {"source": "Business Insider", "title": "Former Google CEO Eric Schmidt to programmers: Stop building the house. Start designing it.", "link": "https://www.businessinsider.com/eric-schmidt-young-programmers-should-become-architects-ai-tools-2026-10", "summary": "The former Google CEO said AI coding tools have beaten him at writing code even at his best. Alexander Tamargo/Getty Images for America Business Forum Eric Schmidt said AI coding tools can now write code he never could at his best. The former Google CEO still advises young people to learn programming. Schmidt said future programmers will act as architects, directing AI to execute their designs. The former Google CEO said AI has beaten him at the thing he was once best at. Eric Schmidt, now 71, told Blackstone's \"Inside Blackstone\" podcast that he was among the top programmers of his generation, but today's AI coding tools are writing the code he couldn't. \"I was a very, very good programmer when I was 22, right? I was one of the best, according to myself. My field is over, right?\" Schmidt told podcast host Christine Anderson. \"I look at the code it writes now. I can't write that code. I couldn't when I was 22, right? So, I got beaten, right? Hard.\" Still, Schmidt tells young people to learn to code so they can give the most accurate orders to AI tools and be the brains of the design. \"I had to build the house,\" Schmidt said in an analogy. \"Now I can architect the house using the equivalent of Claude Code or OpenAI Codex or future products from Google, which they're working on, all of which allow me to say what I want and the code gets written.\" \"The next generation of people like me will be the architects, and they'll be very, very smart and they know how to say, 'this is what I want,'\" Schmidt added. The shift is already underway inside AI companies. At Daytona, a 30-person AI startup, CEO Ivan Burazin previously told Business Insider that each of the 16 engineers manages an average of five AI agents, and no one there writes code anymore. Anthropic CFO Krishna Rao also said on the \"Invest Like the Best\" podcast that AI now handles much of the execution layer of knowledge work, including producing some of the company's financial statements, freeing up humans for oversight and strategy. \"90 plus percent of our code is actually written by Claude Code,\" Rao said. \"Everyone kind of becomes a manager .\" Read the original article on Business Insider", "date_str": "2026-10-02T04:02:01+00:00", "hash": "e88f11180292fec8", "title_fa": "اریک اشمیت، مدیر عامل سابق گوگل خطاب به برنامه نویسان: ساختن خانه را متوقف کنید. شروع به طراحی آن کنید.", "summary_fa": "مدیر عامل سابق گوگل گفت ابزارهای کدنویسی هوش مصنوعی او را در نوشتن کد حتی در بهترین حالتش شکست داده اند. الکساندر تامارگو/ گتی ایماژ برای انجمن تجاری آمریکا اریک اشمیت گفت که ابزارهای کدنویسی هوش مصنوعی اکنون می توانند کدهایی را بنویسند که هرگز در بهترین حالت ممکن نبود. مدیر عامل سابق گوگل همچنان به جوانان توصیه می کند برنامه نویسی را یاد بگیرند. اشمیت گفت برنامه نویسان آینده به عنوان معمار عمل خواهند کرد و هوش مصنوعی را برای اجرای طرح های خود هدایت خواهند کرد. مدیر عامل سابق گوگل گفت هوش مصنوعی او را در کاری که زمانی در آن بهترین بود شکست داده است. اریک اشمیت که اکنون 71 سال دارد به پادکست «Inside Blackstone» بلک استون گفت که او جزو برترین برنامه نویسان نسل خود بود، اما ابزارهای کدنویسی هوش مصنوعی امروزی کدهایی را می نویسند که او نتوانسته است. \"من در 22 سالگی برنامه نویس خیلی خیلی خوبی بودم، درست است؟ به گفته خودم یکی از بهترین ها بودم. رشته من تمام شده است، درست است؟\" اشمیت به مجری پادکست کریستین اندرسون گفت. \"الان به کدی که می نویسد نگاه می کنم. نمی توانم آن کد را بنویسم. وقتی 22 ساله بودم نمی توانستم، درست است؟ پس کتک خوردم، درست است؟ سخت.\" با این حال، اشمیت به جوانان می گوید که کدنویسی را یاد بگیرند تا بتوانند دقیق ترین دستورات را به ابزارهای هوش مصنوعی بدهند و مغز طراحی شوند. اشمیت در قیاسی گفت: \"من مجبور بودم خانه را بسازم.\" \"اکنون می توانم خانه را با استفاده از معادل کلود کد یا OpenAI Codex یا محصولات آینده گوگل که روی آنها کار می کنند، معمارانه بسازم، همه اینها به من اجازه می دهد آنچه را که می خواهم بگویم و کد نوشته می شود.\" اشمیت افزود: «نسل بعدی افرادی مانند من معماران خواهند بود"}, {"source": "Business Insider", "title": "Tesla rolled out a 'drive away' feature it hopes ‘you never need’", "link": "https://www.businessinsider.com/tesla-emergency-drive-away-update-charging-supercharger-2026-10", "summary": "Tesla released a feature that lets the car shift into drive while connected to a charger in case of an emergency. Marcin Golba/NurPhoto via Getty Images Tesla rolled out an update that lets the car quickly drive away while connected to a charger. The update comes after three people at a Tesla charging station in Idaho were shot at. Tesla said the feature is \"for emergency use only\" and will damage the vehicle and Supercharger. One Tesla employee is calling it \"a feature we hope you never need.\" Tesla on Thursday rolled out an over-the-air software update called \"Emergency Drive Away\" that would allow the vehicle to quickly shift into drive while plugged into a Supercharging station . Typically, a Tesla does not shift out of park if a cable is detected. The feature comes two months after a shooting near an In-N-Out in Twin Falls, Idaho, left three people dead. One of the victims, Dale Schultz, was inside a Tesla with his wife at a charging station at the time of the shooting, NBC-affiliate KTVB reported. Tesla said in an X post that the feature is for emergencies only. \"Use of this feature will damage your vehicle and the Supercharger,\" the post said. \"Deliberate misuse will invoke additional penalties.\" A video demonstration posted on X showed how the Tesla breaks off from the charging handle after a driver shifts into drive and presses an \"Activate\" button at the bottom of an alert message. Max de Zegher, the senior director of charging in North America, said in an X post that it's a feature \"we hope you never need.\" \"We select Supercharger locations with safety in mind and relocate sites deemed unsafe. Our goal is that you always feel safe getting out to unplug,\" he wrote. \"We went back and forth on this for years, but believe offering it is the right call. Don't abuse it, so we don't have to restrict it.\" Tesla didn't say what the penalties are if a driver were to use misuse the feature. A Tesla spokesperson did not immediately respond to a request for comment. Read the original article on Business Insider", "date_str": "2026-10-02T01:01:09+00:00", "hash": "7ce7fe949e1c1403", "title_fa": "تسلا یک ویژگی «drive away» را ارائه کرد که امیدوار است «هرگز به آن نیاز نداشته باشید»", "summary_fa": "تسلا قابلیتی را منتشر کرد که به خودرو اجازه می‌دهد در مواقع اضطراری در حین اتصال به شارژر به سمت درایو حرکت کند. Marcin Golba/NurPhoto از طریق Getty Images تسلا به‌روزرسانی‌ای را ارائه کرد که به خودرو اجازه می‌دهد در حالی که به شارژر متصل است به سرعت دور شود. این به روز رسانی پس از تیراندازی به سه نفر در ایستگاه شارژ تسلا در آیداهو منتشر شد. تسلا گفت این ویژگی \"فقط برای استفاده اضطراری\" است و به خودرو و سوپرشارژر آسیب می رساند. یکی از کارمندان تسلا آن را \"ویژگی که امیدواریم هرگز نیاز نداشته باشید\" نامیده است. تسلا روز پنجشنبه یک به‌روزرسانی نرم‌افزاری را به نام «Emergency Drive Away» منتشر کرد که به وسیله نقلیه اجازه می‌دهد در حالی که به ایستگاه سوپرشارژ متصل است، به سرعت به سمت درایو حرکت کند. معمولاً در صورت تشخیص کابل، تسلا از پارک خارج نمی‌شود. این ویژگی دو ماه پس از تیراندازی در نزدیکی یک In-N-Out در توئین فالز، آیداهو که منجر به کشته شدن سه نفر شد، منتشر شد. KTVB وابسته به NBC گزارش داد که یکی از قربانیان، دیل شولتز، در زمان تیراندازی به همراه همسرش در داخل یک تسلا در ایستگاه شارژ بودند. تسلا در یک پست X گفت که این ویژگی فقط برای مواقع اضطراری است. در این پست آمده است: \"استفاده از این ویژگی به خودرو و سوپرشارژر آسیب می رساند.\" \"سوء استفاده عمدی مجازات های بیشتری را در پی خواهد داشت.\" یک نمایش ویدئویی منتشر شده در X نشان داد که چگونه تسلا پس از جابجایی راننده به درایو و فشار دادن دکمه \"فعال کردن\" در پایین پیام هشدار، از دسته شارژ جدا می شود. Max de Zegher، مدیر ارشد شارژ در آمریکای شمالی، در یک پست X گفت که این یک ویژگی است \"امیدواریم هرگز به آن نیاز نداشته باشید.\" ما مکان‌های سوپرشارژر"}, {"source": "Business Insider", "title": "Best streaming deals and bundles (2026)", "link": "https://www.businessinsider.com/guides/deals/best-streaming-deals-bundles", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more There are several streaming deals available this month. LuisPortugal/Getty Images/iStockphoto Even if you have an elaborate cable package, streaming services have become all but necessary to keep up with select sports and original TV shows. Fortunately, there are deals on nearly every streaming subscription service out there, especially when you bundle multiple platforms together or opt for an annual plan. Below, we've highlighted all of the best streaming deals and bundles, from Disney to Amazon and everything in between. Many of these discounts are evergreen, year-round offerings, but we'll keep this page updated with the latest limited-time deals, so you don't need to worry about missing out on a potential savings opportunity. After scouring the internet for discounts this month, we've found introductory offers from multiple live TV services, six-month price lock offers from Disney Plus and Hulu, and a brand-new mega bundle from Prime Video. We know streaming can get pricey, especially after the slew of recent price hikes, which is why we've rounded up a massive list of the best streaming deals below using our rigorous deal hunting and vetting process . You can explore both basic stand-alone streaming services and comprehensive live TV packages, wi  بنابراین لازم نیست نگران از دست دادن فرصت پس‌انداز احتمالی باشید. پس از جستجوی اینترنت برای تخفیف در این ماه، پیشنهادهای مقدماتی از چندین سرویس تلویزیون زنده، پیشنهادات قفل قیمت شش ماهه از Disney Plus و Hulu و یک بسته بزرگ جدید از Prime Video پیدا کردیم. ما می‌دانیم که پخش جریانی می‌تواند گران‌تر شود، به‌ویژه پس از افزایش قیمت‌های اخیر، به همین دلیل است که فهرست گسترده‌ای از بهترین معاملات پخش جریانی را در زیر با استفاده از فرآیند جستجو و بررسی دقیق معامله خود گردآوری کرده‌ایم. می‌توانید هم سرویس‌های استریم مستقل پایه و هم بسته‌های تلویزیونی زنده جامع را بررسی کنید، با مقایسه قیمت‌ها که نشان می‌دهد در یک برنامه ماهانه چقدر در سال پرداخت می‌کنید یا چقدر در ماه پرداخت می‌کنید بدون اینکه چندین سرویس را با هم بپردازید. بسیاری از پخش‌کننده‌ها معاملات مقدماتی را برای مشتریان جدید و/یا واجد شرایط بازگشتی ارائه می‌کنند که ما نیز به آنها اشاره کرده‌ایم. بهترین معاملات پخش جریانی در اکتبر 2026 طرح بسته Disney Plus Hulu (با تبلیغات): 12.99 دلار"}, {"source": "Business Insider", "title": "NBCUniversal is cutting a few hundred global streaming tech employees", "link": "https://www.businessinsider.com/nbcuniversal-cuts-hundreds-global-streaming-tech-employees-sky-uk-peacock-2026-10", "summary": "NBCUniversal is letting go of streaming employees under Comcast co-CEO Brian Roberts. Marcin Golba/NurPhoto via Getty Images; Comcast NBCUniversal is laying off a few hundred streaming tech employees in Europe and the US. Most of the cuts are at UK-based Sky, a person familiar with the move said. NBCU let go of a few dozen streaming staffers in March. Comcast's NBCUniversal is cutting a few hundred streaming tech staffers, Business Insider has learned. The layoffs will impact NBCU's global streaming technology group, which includes the engineering and quality assurance teams, three people familiar with the changes said. Most of the cuts are at Sky, Comcast's European media arm, though a person briefed on the change said that some US-based workers at NBCU will be affected. Comcast is preparing to spin off NBCU , with its streamers and studio, from its cable and internet businesses next summer. Traditional media companies are cutting costs as they face pressure to please Wall Street, while competing with deep-pocketed, tech-forward rivals like Netflix and YouTube. NBCU's streaming cuts come months after its US streamer, Peacock, became profitable on an adjusted EBITDA basis for the first time. \"As NBCUniversal and Sky continue to invest in our streaming products and technology, we are proposing changes to our Global Streaming Technology organization, which will impact some roles,\" an NBCU spokesperson said in a statement. \"This evolution will ensure we have the right structure and resources in place for future growth and enable us to better serve our customers and partners.\" Employees affected by the downsizing were informed of the cuts on Wednesday, people familiar with the move said. UK labor laws require that staffers affected by cuts undergo a consultation process, meaning their dismissals won't take effect immediately. Those processes began yesterday, a person familiar with the cuts said. A Peacock tech employee said that they're \"still happy\" at NBCU despite the cuts, though they're uncertain about the future as the media company prepares for life without Comcast . \"Layoffs on the tech side make me question how we will hit our big goals for 2027, such as decoupling from Comcast and incorporating ITV into the platform,\" this person said. NBCU let go of dozens of employees in March following the closure of Showmax, an African streaming service it operated with French broadcaster Canal+. Some of its rivals have also made cuts. Disney had its third layoff ", "date_str": "2026-10-01T21:56:44+00:00", "hash": "e98a1c36a1376975", "title_fa": "NBCUniversal چند صد کارمند فناوری استریم جهانی را اخراج می کند", "summary_fa": "NBCUniversal کارمندان استریم تحت مدیریت برایان رابرتز، مدیرعامل Comcast را رها می کند. Marcin Golba/NurPhoto از طریق گتی ایما omote better digestion. Specific types of dietary fiber can also be beneficial. All of my recommendations meet the nutritional standards set by the Association of American Feed Control Officials (AAFCO) and follow the Global Nutrition Guidelines set by the World Small Animal Veterinary Association (WSAVA). These are key considerations when choosing the best cat food . What are the signs of a sensitive stomach in a cat? The signs can be easy to overlook. Because hairballs are common in cats, symptoms like vomiting and regurgitation are easy to dismiss. However, a cat that vomits material with very little to no hair or vomits more than once a week should be evaluated by their veterinarian, says Dr. Kelly Diehl , a veterinary internist with a subspecialty in gastroenterology. Other common signs of a sensitive stomach include loose stools and gas. While dietary changes may relieve sympt", "date_str": "2026-10-01T20:00:41+00:00", "hash": "42e5abb0d9f8a029", "title_fa": "بهترین غذای حساس معده گربه، با راهنمایی دامپزشکان", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید ما با استفاده از توصیه دامپزشکان و متخصصان تغذیه حیوانات، بهترین غذاهای گربه را برای حمایت از دستگاه گوارش انتخاب کردیم. تپه s; رویال کنین; Purina/Business Insider بهترین غذای حساس معده گربه برای حیوان خانگی شما به علت اصلی مشکلات گوارشی آنها بستگی دارد. گربه‌ها نیز مانند انسان‌ها می‌توانند گهگاهی مدفوع شل، یبوست یا گاز بیش از حد را تجربه کنند. اگر گربه شما این علائم را نشان می دهد، یک ویزیت دامپزشک می تواند شرایطی مانند آلرژی غذایی یا بیماری التهابی روده را که ممکن است نیاز به رژیم غذایی تجویزی داشته باشد را رد کند. اگر گربه شما با حساسیت کلی گوارشی سروکار دارد، یکی از غذاهای این راهنما ممکن است کمک کند. انتخاب های برتر ما در یک نگاه: رویال کنین Digestive Care Thin Slices in Gravy یک غذای مرطوب برجسته است، تا حد زیادی به لطف فیبر نامحلول آن، که ممکن است به جلوگیری از یبوست کمک کند. برای غذاهای خشک، پوست و معده حساس Purina One + Plus یک انتخاب عالی است. این شامل فیبر محلول و پری بیوتیک برای حمایت از سلامت دستگاه گوارش است و به ویژه برای گربه هایی که مستعد مدفوع شل هستند مفید است. برای انتخاب غذاهای حساس گربه معده، ده ها گزینه را ارزیابی کردم و از راهنمایی دامپزشکان استفاده کردم. من از نزدیک روی کیفیت مواد تشکیل دهنده و ارزش غذایی کلی تمرکز کردم. دامپزشکی که با آنها صحبت کردم، فرمول های حساس معده را توصیه می کنند که شامل پروتئین های حیوانی بسیار قابل هضم، سطوح چربی کم تا متوسط ​​و کربوهیدرات های کمتر است. بسیاری از این فرمول ها همچنین شامل پروبیوتیک ها و اسیدهای چرب امگا 3 از روغن ماهی هستند که می توانند به کاهش"}, {"source": "Business Insider", "title": "Trump says he ‘wouldn’t necessarily like’ a data center right next to his house", "link": "https://www.businessinsider.com/trump-data-center-near-house-quotes-time-interview-2026-10", "summary": "President Donald Trump questioned communities that don t want data centers. Bloomberg/Getty Images President Donald Trump wants communities to welcome data centers. He said he's not entirely sure he wants one in his backyard. Some Virginia residents already live next to data centers that are just beyond their property lines. President Donald Trump says he isn't sure he would want a data center in his backyard. \"I would like to have data centers,\" Trump told Time Magazine as part of a cover story interview published on Thursday. \"It doesn't mean I want them right next to my house, but certainly I like them in my county.\" Trump has repeatedly defended the benefits of data centers and the AI industry more broadly, as polling shows widespread public skepticism. Republican governors have also begun to rein in incentives for data centers. Communities that don't welcome data centers, Trump said, are also passing up on potentially lucrative tax revenue. As he has before, the president portrayed communities that oppose data center development as wrong and impoverished. \"If you want to be poor, you want to have no money, if you don't want to have a job, and if you want to live in a crime-infested area, squalor, all the things that go along with it, you should not have a data center,\" he said. Amid the growing backlash against data centers, some AI and tech leaders have begun considering other ways to supply the compute they need to train and then run cutting-edge AI models. SpaceX CEO Elon Musk is pursuing orbital data centers . OpenAI CEO Sam Altman has suggested data centers are better suited for deserts . An aerial view shows data centers near a Virginia neighborhood. Anna Moneymaker/Getty Images As he welcomed AI executives to the White House on Tuesday, Trump told reporters that data centers would become \"very popular\" as residents see what their cooperation will bring to their communities. \"They're going to make the community happy,\" Trump said. \"That might be supplying oil and gas. It might be supplying education. It may be helping teachers along financially, helping people along financially.\" Trump described how, in some cases, a data center can be \"right next to a guy's house,\" a reality some residents in Loudoun County, Virginia, face. Loudoun County, home to the famed \" Data Center Alley, \" once allowed many data centers to be built by right, including some near residential neighborhoods. In 2025, county supervisors ended by-right approvals for new data c", "date_str": "2026-10-01T19:48:44+00:00", "hash": "2d01e9406e3addf9", "title_fa": "ترامپ می گوید که «لزوماً دوست ندارد» یک مرکز داده درست در کنار خانه اش باشد", "summary_fa": "دونالد ترامپ، رئیس جمهور آمریکا، جوامعی را که مراکز داده نمی خواهند، زیر سوال برد. بلومبرگ/گتی ایماژ، دونالد ترامپ، رئیس جمهور آمریکا می خواهد که جوامع از مراکز داده استقبال کنند. او گفت که کاملا مطمئن نیست که یکی را در حیاط خلوت خود می خواهد. برخی از ساکنان ویرجینیا در حال حاضر در کنار مراکز داده زندگی می کنند که درست فراتر از خطوط دارایی آنها هستند. رئیس جمهور دونالد ترامپ می گوید مطمئن نیست که بخواهد یک مرکز داده در حیاط خلوت خود داشته باشد. ترامپ به عنوان بخشی از مصاحبه ای که روز پنجشنبه منتشر شد، به مجله تایم گفت: «من دوست دارم مراکز داده داشته باشم. این بدان معنا نیست که من آنها را دقیقاً در کنار خانه‌ام می‌خواهم، اما مطمئناً آنها را در شهرستان خود دوست دارم.» ترامپ بارها از مزایای مراکز داده و صنعت هوش مصنوعی به طور گسترده‌تر دفاع کرده است، زیرا نظرسنجی‌ها شک و تردید گسترده عمومی را نشان می‌دهد. فرمانداران جمهوری خواه نیز شروع به مهار مشوق ها برای مراکز داده کرده اند. ترامپ گفت، جوامعی که از مراکز داده استقبال نمی کنند، درآمدهای مالیاتی بالقوه پرسود را نیز رد می کنند. رئیس جمهور همانطور که قبلاً انجام داده است، جوامعی را که با توسعه مرکز داده مخالف هستند، اشتباه و فقیر نشان می دهد. او گفت: «اگر می‌خواهید فقیر باشید، می‌خواهید پول نداشته باشید، اگر نمی‌خواهید شغلی داشته باشید، و اگر می‌خواهید در یک منطقه جنایت‌آلود زندگی کنید، فلاکت، همه چیزهایی که با آن همراه است، نباید مرکز داده داشته باشید. در میان واکنش‌های فزاینده علیه مراکز داده، برخی از رهبران هوش مصنوعی و فناوری شروع به بررسی راه‌های دیگری برای تأمین محاسبات مورد نیاز برای آموزش و سپس اجرای مدل‌های پیشرفته هوش مصنوعی کرده‌اند. ایلان ماسک، مدیرعامل اسپیس ایکس در حال پیگیری مراکز داده مداری است. سام آلتمن، مدیر"}, {"source": "Business Insider", "title": "Best Fire TV sticks and devices, compared", "link": "https://www.businessinsider.com/guides/tech/amazon-fire-tv-buying-guide", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Fire TV devices include streaming sticks and smart TVs. David Murphy/Steven Cohen/Business Insider Amazon offers a wide range of Fire TV streaming devices, from compact Fire Sticks to full-fledged smart TVs. All provide access to popular video apps and support Alexa, but certain models are better suited to specific needs. For instance, the brand's cheapest, entry-level Fire TV Stick HD delivers high-definition playback, which is enough for smaller displays and some older TVs. But most people will be better off with one of the company's 4K-capable models, like the flagship Fire TV Stick 4K Max , which supports Ultra HD video and Dolby Vision for enhanced color and contrast on compatible TVs. Amazon also sells its own smart TVs with the Fire TV operating system (OS). These sets are now branded as part of the company's Ember collection . Their picture quality can't compete with top TVs from other brands, but when they're on sale, they're decent budget options for fans of Amazon's ecosystem. With so many Fire TVs to consider, it's important to understand the key differences between models. To help you pick the best Fire TV Stick or display for your setup, we've detailed all the ins and outs of each offering, including pricing and defining features. Did Amazon raise Fire TV prices? In August 2026, Amazon raised the prices of several of its devices, including Fire TV Sticks, with models now carrying an MSRP that's $5 to $60 more than before. Amazon says the price hike is the result of increased costs for memory and storage. In addition to Fire TV products, Amazon also raised prices for several Echo and Kindle devices. However, despite the price hike, Amazon continues to offer frequent discounts on Fire TV models, so it's still rare to actually find them selling at full price. In fact, recent deal prices have remained well below each model's original MSRP. Here's a rundown of current Fire TV devices affected by the August 2026 price increase, along with details on the best deals we've seen since then. Fire TV model Original list price Current list price Best deal price since the increase Fire TV Stick HD $34.99 $39.99 $15.99 Fire TV Stick 4K Max $59.99 $84.99 $44.99 Fire TV Cube $139.99 $199.99 $89.99 Fire TV Stick HD The Fire TV Stick HD is Amazon's most affordable streaming device. Like the company's other sticks, this compact dongle plugs directly into your TV's HDMI ", "date_str": "2026-10-01T19:31:38+00:00", "hash": "da5d2716b3cbc24a", "title_fa": "بهترین چوب‌ها و دستگاه‌های Fire TV، در مقایسه", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید دستگاه‌های Fire TV شامل استیک‌های پخش جریانی و تلویزیون‌های هوشمند هستند. دیوید مورفی/استیون کوهن/Business Insider آمازون طیف وسیعی از دستگاه‌های پخش تلویزیونی Fire، از Fire Sticks فشرده تا تلویزیون‌های هوشمند تمام عیار را ارائه می‌دهد. همه آنها دسترسی به برنامه های ویدیویی محبوب را فراهم می کنند و از الکسا پشتیبانی می کنند، اما برخی از مدل ها برای نیازهای خاص مناسب تر هستند. به عنوان مثال، ارزان‌ترین و پایه Fire TV Stick HD این برند، پخش با وضوح بالا را ارائه می‌کند که برای نمایشگرهای کوچک‌تر و برخی تلویزیون‌های قدیمی‌تر کافی است. اما اکثر مردم با یکی از مدل‌های دارای قابلیت 4K این شرکت، مانند پرچم‌دار Fire TV Stick 4K Max که از ویدیوی Ultra HD و Dolby Vision برای افزایش رنگ و کنتراست در تلویزیون‌های سازگار پشتیبانی می‌کند، وضعیت بهتری خواهند داشت. آمازون همچنین تلویزیون های هوشمند خود را با سیستم عامل Fire TV (OS) می فروشد. این مجموعه ها در حال حاضر به عنوان بخشی از مجموعه Ember این شرکت شناخته می شوند. کیفیت تصویر آن‌ها نمی‌تواند با تلویزیون‌های برتر برندهای دیگر رقابت کند، اما زمانی که آنها به فروش می‌رسند، گزینه‌های اقتصادی مناسبی برای طرفداران اکوسیستم آمازون هستند. با توجه به تعداد زیادی تلویزیون Fire، درک تفاوت های کلیدی بین مدل ها بسیار مهم است. برای کمک به شما در انتخاب بهترین Fire TV Stick یا نمایشگر برای راه‌اندازی خود، همه نکات و نکات مربوط به هر پیشنهاد از جمله قیمت‌گذاری و ویژگی‌های تعریف شده را به تفصیل شرح داده‌ایم. آیا آمازون قیمت تلویزیون فایر را افزایش داد؟ در آگوست 2026، آمازون قیمت چندین دستگاه خود، از جمله Fire TV Sticks را افزایش داد و مدل‌هایی که اکنون دارای MSRP هستند، 5 تا 60 دلار بیشتر از"}, {"source": "Business Insider", "title": "Diego Megia raised $1.5 billion this spring and bet interest rates would go down. It backfired.", "link": "https://www.businessinsider.com/taula-capital-september-performance-bond-market-pain-2026-10", "summary": "Diego Megia traded for Millennium and Citadel before launching his own fund, Taula. Europa Press News/Europa Press via Getty Images Taula Capital lost 12.2% in a concentrated, interest-rate-focused strategy in September. The London-based manager raised $1.5 billion in March and launched the strategy in April. The strategy's first six months of trading have resulted in a 12.8% loss. September's bond market pain has stung Diego Megia's $9 billion hedge fund Taula Capital. The firm's TSO fund — which runs a concentrated strategy that made a large bet on European interest rates going down — is down 12.8% through September since it launched six months ago, two people familiar with the matter told Business Insider. The strategy lost 12.2% in September alone, the two people said, meaning a vast majority of the fund's losses came last month. The firm raised $1.5 billion for the young fund in March, and backers can't redeem their capital until next spring, the people added. Taula declined to comment. Global interest rates have jumped thanks to sticky inflation, the ongoing war in Iran, and artificial intelligence companies flooding the fixed-income market with new debt issuance. For many asset managers who expected Kevin Warsh, the Federal Reserve chair, and other central bankers to cut rates or hold steady, last month's rate hike has been stomach-churning. That was particularly painful for TSO, whose concentrated strategy is positioned for European interest rates to fall. Instead, they moved sharply in the opposite direction. An index of global government bonds compiled by Bloomberg had its worst quarter since 2024, falling more than 2%, and French debt in particular had its worst quarter in decades. As ExodusPoint macro portfolio manager Matt Dratch said on X, bonds are \"having their 'Situational Awareness' moment,\" referencing the implosion of Leopold Aschenbrenner's AI-focused tech fund in August. \"Except perhaps everyone is Leopold this time,\" Dratch added. This is the second time this year macro investors have been stung by interest-rate moves. In the spring, when the US first bombed Iran, several managers, including Taula, suffered losses . The London-based firm's flagship strategy, which manages money for Megia's former employer, Millennium Management, and is more diversified than the TSO fund, has also lost money this month. It's down 4.3% through September 18, the people familiar with the firm said. That loss brought the flagship's 2026 losses to nearly 1", "date_str": "2026-10-01T19:30:26+00:00", "hash": "e87b843b3289ab81", "title_fa": "دیگو مگیا 1.5 میلیارد دلار در بهار امسال جمع آوری کرد و نرخ بهره شرط بندی کاهش پیدا کرد. نتیجه معکوس داد.", "summary_fa": "دیگو مگیا قبل از راه‌اندازی صندوق سرمایه‌گذاری خود، تاولا، با هزاره و سیتادل معامله کرد. Europa Press News/Europa Press از طریق گتی ایماژ Taula Capital در یک استراتژی متمرکز و متمرکز بر نرخ بهره در ماه سپتامبر 12.2 درصد از دست داد. این مدیر مستقر در لندن در ماه مارس 1.5 میلیارد دلار جمع آوری کرد و این استراتژی را در آوریل آغاز کرد. شش ماه اول معاملات این استراتژی منجر به زیان 12.8 درصدی شده است. درد بازار اوراق قرضه در ماه سپتامبر، صندوق سرمایه گذاری 9 میلیارد دلاری دیگو مگیا تاولا کپیتال را خفه کرده است. دو نفر آشنا به این موضوع به Business Insider گفتند که صندوق TSO این شرکت - که یک استراتژی متمرکز را اجرا می کند که بر کاهش نرخ های بهره اروپا شرط بندی کرده است - تا ماه سپتامبر از زمان راه اندازی آن 12.8٪ کاهش یافته است. این دو نفر گفتند که این استراتژی تنها در ماه سپتامبر 12.2 درصد از دست داده است، به این معنی که اکثریت قریب به اتفاق زیان صندوق در ماه گذشته رخ داده است. مردم افزودند که این شرکت در ماه مارس 1.5 میلیارد دلار برای صندوق جوان جمع آوری کرد و حامیان نمی توانند تا بهار آینده سرمایه خود را بازخرید کنند. تاولا از اظهار نظر خودداری کرد. نرخ های بهره جهانی به لطف تورم چسبنده، جنگ ادامه دار در ایران و شرکت های هوش مصنوعی که بازار با درآمد ثابت را با انتشار بدهی های جدید پر کرده اند، افزایش یافته است. برای بسیاری از مدیران دارایی که انتظار داشتند کوین وارش، رئیس فدرال رزرو و سایر بانک‌های مرکزی نرخ‌ها را کاهش دهند یا ثابت نگه دارند، افزایش نرخ بهره در ماه گذشته بسیار ناراحت کننده بوده است. این به ویژه برای TSO دردناک بود، که استراتژی متمرکز آن برای کاهش نرخ بهره"}, {"source": "Business Insider", "title": "The October Prime Day deals parents are actually waiting for", "link": "https://www.businessinsider.com/guides/deals/october-prime-day-parenting-deals-2026-9", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more A Yoto Player and a digital camera are two of the items parents are waiting until Prime Day to purchase. Hawys Bobbier/Amazon/Business Insider Our team at Business Insider covers Prime Day deals each year in the summer and fall by tracking discounts on tested products from our buying guides and reviews. But beyond our own product recommendations, we also ask colleagues, friends, and family what they plan to buy. Consider it our version of consumer research. Who better to ask than parents, who are experienced at managing household budgets and making practical purchases? After chatting with several people, the biggest trend I saw was parents investing in items that would reduce screen time, encourage creative play, or lead to more outdoor activities. One standout is the Yoto Mini , a clever audio player with no screen that two moms have on their list for car time entertainment. Some said they were waiting to check deals on the basics (like snacks), but most seem keen on finding ways to keep their kids away from the iPad. While we don't know which of these items will actually be on sale, these are the products parents are waiting for October Prime Day to buy. A knee-saving bath mat Amazon The PandaEar Non-Slip Kneeling Mat (current price: $18.95) \"As an expecting parent, my cart is full of postpartum essentials I'm waiting to buy on sale during Prime Day (that is, if I get lucky with deal prices). One of the things I'm hoping goes on sale is this kneeling mat for bath time. Even though it's not expensive, when you have a hundred things to buy at a time, it adds up. We have sliding glass doors on our tub instead of a shower curtain, so we're also looking for a clever elbow rest solution — but in the meantime, if we can make kneeling on the floor any more comfortable, we'll take it!\" — Sally Kaplan, executive editor, BI Yoto Player for screen-free entertainment Hawys Boobier/Business Insider The Yoto Player (current price: $109) and the Yoto Player Mini (Current price: $79.99) \"My three kids, all under the age of 9, don't have iPads and don't even know how to unlock my phone. We are very much a no-screen family, unless we are watching a movie together. We also love taking road trips and have relied on kids' podcasts and Peppa Pig stories to help keep our kids entertained while on the road. That said, they are all growing and having different interests, and agreeing on ", "date_str": "2026-10-01T19:24:15+00:00", "hash": "8cef7fc4a9d34255", "title_fa": "معاملات روز اول اکتبر که والدین واقعاً منتظر آن هستند", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید یک Yoto Player و یک دوربین دیجیتال دو مورد از مواردی هستند که والدین برای خرید تا Prime Day منتظر هستند. Hawys Bobbier/Amazon/Business Insider تیم ما در Business Insider معاملات Prime Day را هر سال در تابستان و پاییز با ردیابی تخفیف‌های محصولات آزمایش‌شده از راهنمای خرید و بررسی ما پوشش می‌دهد. اما فراتر از توصیه‌های محصول خود، از همکاران، دوستان و خانواده نیز می‌پرسیم که قصد دارند چه چیزی بخرند. آن را نسخه ما از تحقیقات مصرف کننده در نظر بگیرید. چه کسی بهتر از والدینی که در مدیریت بودجه خانوار و خریدهای عملی باتجربه هستند، بپرسید؟ بعد از گپ زدن با چندین نفر، بزرگترین روندی که دیدم این بود که والدین روی مواردی سرمایه گذاری می کردند که زمان نمایش را کاهش می داد، بازی خلاقانه را تشویق می کرد یا منجر به فعالیت های بیشتر در فضای باز می شد. یکی از برجسته‌ترین آنها Yoto Mini است، یک پخش‌کننده صوتی هوشمند بدون صفحه‌نمایش که دو مادر در لیست خود برای سرگرمی در زمان ماشین دارند. برخی گفتند که منتظر هستند تا معاملات اولیه (مانند تنقلات) را بررسی کنند، اما به نظر می‌رسد بیشتر آنها مشتاق یافتن راه‌هایی برای دور نگه داشتن فرزندانشان از iPad هستند. در حالی که نمی دانیم کدام یک از این اقلام واقعاً در فروش خواهند بود، اینها محصولاتی هستند که والدین برای خرید در ماه اکتبر منتظر هستند. تشک حمام مناسب زانو آمازون The PandaEar Non-Slip Kneeling Mat (قیمت فعلی: 18.95 دلار) \"به عنوان یک والدین منتظر، سبد خرید من پر از لوازم ضروری پس از زایمان است که منتظر خرید آنها در روز اول هستم (یعنی اگر با قیمت های معامله خوش شانس باشم). گران است، وقتی صدها چیز برای خرید در یک"}, {"source": "Business Insider", "title": "We live paycheck to paycheck and don't want wedding debt. So we're getting creative.", "link": "https://www.businessinsider.com/long-engagement-save-money-budget-wedding-2026-10", "summary": "The author is getting married for the third time at 39. Courtesy of the author We knew from the start that we'd need to keep our wedding costs low. Our friends offered to officiate, DJ, photograph, and help coordinate the day. Their generosity is letting us create a meaningful celebration we can actually afford. At the age of 39, I already had two failed marriages under my belt and could never have expected to enter another engagement. Life held its own plan for me, bringing the man I was searching for all along when I least expected it. Roger had never married and never expected to be. We began our relationship straight out of my failing second marriage , and we were both at a loss about what our end goal would be — until we fell in love hard and never looked back. My family had helped financially with the previous weddings Preparing for my previous weddings was much simpler. Both families chipped in financially, which seems to be customary. Roger's and my wedding would be much more difficult to afford. Roger's father died 13 years ago, and his mother has Alzheimer's disease . We knew that we would need to find our own way to make our wedding dreams come true. The author is getting creative to afford her third wedding. Courtesy of the author The most reasonable solution was to opt for a lengthy engagement , giving us over two years' time to plan and budget for our big day. Roger is a respiratory care specialist and is currently in massage therapy school. I am a freelance writer and a pet caretaker. We are raising Roger's daughter and caring for our dog and two cats. In today's economy, we are living paycheck to paycheck. We had to get creative Instead of an engagement party, we opted for a Stock the Bar Party. In lieu of gifts, attendees will bring bottles of spirits to be served at our wedding reception. Each bottle will earn them a raffle ticket toward a chance to win a free massage. This option will allow us some relief on alcohol costs and will also give Roger more practice with his massage skills . The first item that we secured was the venue. We were able to find a marina that was cost-effective, flexible, and offered both ceremony and reception space. The tables and chairs are included in the cost, as well as a kitchen area for the reception. The venue provides security to assist with parking, so there will be no need for parking attendants. When we called to put down our deposit, we were pleasantly surprised to receive a 10% discount for booking s", "date_str": "2026-10-01T18:37:01+00:00", "hash": "ea749d066d213074", "title_fa": "ما از حقوق به دستمزد زندگی می کنیم و بدهی عروسی نمی خواهیم. بنابراین ما خلاق می شویم.", "summary_fa": "نویسنده در 39 سالگی برای سومین بار ازدواج می کند. با احترام نویسنده ما از همان ابتدا می دانستیم که باید هزینه های عروسی خود را پایین نگه داریم. دوستان ما به ما پیشنهاد داد که به عنوان مسئول، دی جی، عکاسی و هماهنگی روز کمک کنند. سخاوت آنها به ما این امکان را می دهد که جشنی معنادار ایجاد کنیم که واقعاً می توانیم از عهده آن برآییم. در سن 39 سالگی، قبلاً دو ازدواج ناموفق داشتم و هرگز نمی توانستم انتظار داشته باشم که وارد نامزدی دیگری شوم. زندگی برنامه خودش را برای من داشت و مردی را که همیشه در جستجویش بودم در زمانی که اصلاً انتظارش را نداشتم آورد. راجر هرگز ازدواج نکرده بود و هرگز انتظار نداشت. ما رابطه مان را مستقیماً از ازدواج دوم ناموفق من شروع کردیم و هر دو در مورد هدف نهایی مان غافل بودیم - تا اینکه سخت عاشق شدیم و هرگز به عقب نگاه نکردیم. خانواده ام به عروسی های قبلی کمک مالی کرده بودند. آماده شدن برای عروسی های قبلی من بسیار ساده تر بود. هر دو خانواده از نظر مالی دچار مشکل شدند که به نظر مرسوم است. هزینه ازدواج من و راجر بسیار دشوارتر خواهد بود. پدر راجر 13 سال پیش فوت کرد و مادرش به بیماری آلزایمر مبتلا بود. ما می دانستیم که باید راه خود را برای تحقق رویاهای عروسی خود پیدا کنیم. نویسنده در حال خلاقیت برای تامین هزینه عروسی سوم خود است. با حسن نیت از نویسنده معقول ترین راه حل این بود که یک نامزدی طولانی را انتخاب کنیم که به ما بیش از دو سال زمان می داد تا برای روز بزرگمان برنامه ریزی و بودجه کنیم. راجر متخصص مراقبت های تنفسی است و در حال حاضر در دانشکده ماساژ درمانی است. من یک نویسنده مستقل و یک مراقب حیوانات"}, {"source": "Business Insider", "title": "5 drinks that are in this fall and 5 that are out, according to bartenders", "link": "https://www.businessinsider.com/best-cocktails-worst-drinks-to-order-now-fall-bartenders-2026-10", "summary": "Beverage trends tend to change throughout the seasons. Rudy Workaholic / 500px/Getty Images Business Insider asked three experienced bartenders to share which drinks are in and out for fall. Savory cocktails, nonalcoholic, and low-ABV drinks are becoming popular orders. Hugo Spritzes, cucumber drinks, and pumpkin-spice cocktails may be falling out of favor. From pumpkin spice and apple cinnamon to chai and maple, fall brings to mind plenty of cozy, warming flavors. These seasonal staples show up in our food as well as our drinks, but some bartenders are also experimenting with unexpected ingredients and fresh takes on classic fall flavors. To find out which beverages are worth ordering this season and ones you may want to skip, Business Insider spoke with three bartenders about the trends they're seeing the most from behind the bar. Savory and produce-forward cocktails are having a moment. Indie Studios LLC/Getty Images Jenneca Younger, a lead bartender at The Mothership in Milwaukee, said savory cocktails are still very much trending — especially if they're made with fresh produce. \"I love a savory cocktail. I feel like there's a big uptick in my social media on all of those tomato martinis,\" Younger told BI. Ordering a cocktail \"dirty\" (with olive brine) is in, too. Additionally, she said, she's also seeing bartenders incorporate purées made from fresh produce, like shisito peppers or squash, into classics like margaritas and gimlets. Darker days call for darker spirits. A Boulevardier is often made with rye whiskey. Kirill Busargin/Getty Images As the weather gets colder in the fall, drinkers tend to gravitate toward more whiskey-based cocktails and darker spirits, Younger said. In contrast to the lighter, crisper spirits that are popular in summer, Younger said whiskey-based cocktails tend to become more popular as temperatures cool. Some examples include Manhattans (made with whiskey, sweet vermouth, and bitters) and Boulevardiers (often made with bourbon or whiskey, sweet vermouth, and Campari). Tea-infusions can add unexpected flavors to fall cocktails. Penpak S./Getty Images Chris Hewes, beverage director and bartender at Coast Range in Solvang, California, said he's been especially loving tea cocktails lately. He especially enjoys pairing Thai tea with whiskey, cognac, mezcal, or rum to really extract the tea's vanilla-like flavors. Espresso martinis with a twist are hitting the spot. There are many ways to elevate a simple espresso martini. urbaz", "date_str": "2026-10-01T18:22:01+00:00", "hash": "6c7ed35b53337f94", "title_fa": "5 نوشیدنی که در پاییز امسال هستند و 5 نوشیدنی که به گفته بارمن ها خارج هستند", "summary_fa": "روند نوشیدنی ها در طول فصل تغییر می کند. Rudy Workaholic / 500px/Getty Images Business Insider از سه بارمن باتجربه درخواست کرد که نوشیدنی‌هایی را که برای پاییز در داخل و خارج هستند به اشتراک بگذارند. کوکتل های خوش طعم، نوشیدنی های غیر الکلی، و نوشیدنی های کم ABV در حال تبدیل شدن به سفارشات محبوب هستند. هوگو اسپریتز، نوشیدنی های خیار و کوکتل های ادویه کدو تنبل ممکن است از بین بروند. از ادویه کدو تنبل و دارچین سیب گرفته تا چای و افرا، پاییز طعم های گرم و دنج زیادی را به ذهن متبادر می کند. این مواد اصلی فصلی در غذاها و نوشیدنی‌های ما ظاهر می‌شوند، اما برخی از بارمن‌ها نیز در حال آزمایش مواد غیرمنتظره و طعم‌های تازه از طعم‌های کلاسیک پاییزی هستند. برای اینکه بفهمید کدام نوشیدنی‌ها در این فصل ارزش سفارش دادن دارند و ممکن است بخواهید از آن‌ها صرف نظر کنید، Business Insider با سه بارمن درباره روندهایی که بیشتر از همه از پشت میله می‌بینند صحبت کرد. کوکتل‌های خوش طعم و خوش طعم لحظه‌ای را سپری می‌کنند. Indie Studios LLC/Getty Images Jenneca Younger، یک متصدی بار در The Mothership در میلواکی، گفت که کوکتل های خوش طعم هنوز هم بسیار پرطرفدار هستند – به خصوص اگر با محصولات تازه تهیه شده باشند. یانگر به BI گفت: \"من عاشق یک کوکتل خوش طعم هستم. احساس می کنم در رسانه های اجتماعی من در تمام آن مارتینی های گوجه فرنگی افزایش زیادی وجود دارد.\" سفارش یک کوکتل \"کثیف\" (با آب نمک زیتون) نیز امکان پذیر است. او گفت که علاوه بر این، بارمن‌هایی را می‌بیند که پوره‌های تهیه‌شده از محصولات تازه، مانند فلفل شیسیتو یا کدو حلوایی، را در کلاسیک‌هایی مانند مارگاریتا و گیملت ترکیب می‌کنند. روزهای تاریک تر، ارواح تاریک تری را می طلبد. Boulevardier اغلب با ویسکی چاودار درست می شود. کیریل"}, {"source": "Business Insider", "title": "The 11 best movies coming to Netflix in October", "link": "https://www.businessinsider.com/best-movies-on-netflix-october-2026", "summary": "(L-R) Al Pacino and Robert De Niro in Heat. Warner Bros. Watch originals like the Ben Affleck-directed \"Animals\" and Wu-Tang Clan documentary \"The Disciple.\" Watch all the \"Twilight\" and \"Jason Bourne\" movies. Also check out \"Heat,\" \"The Sixth Sense,\" and \"The Prestige.\" Check out the best movies to watch on the streaming giant in October. Call Me by Your Name (October 1) Armie Hammer and Timothée Chalamet in Call Me by Your Name. Sony Pictures Classics Directed by Luca Guadagnino with a screenplay by James Ivory, we follow a teen ( Timothée Chalamet ) as he has a sexual awakening when a twentysomething (Armie Hammer) enters his life, all set in lush 1980s Italy. All the Jason Bourne movies (October 1) Matt Damon plays Jason Bourne. Universal If you are looking for some action this weekend, Netflix currently has all the \"Jason Bourne\" movies (yes, even \"The Bourne Legacy,\" starring Jeremy Renner). Watch as Matt Damon completely beats the hell out of anyone who crosses his path. The Menu (October 1) Anya Taylor-Joy and Ralph Fiennes star in The Menu. Eric Zachanowich/20th Century Studios This darkly comedic horror follows a group of foodies who expect to get an amazing dinner at an exclusive restaurant. In reality, their chef (Ralph Fiennes) has set up some courses that will shock and, in some cases, kill his patrons. Anya Taylor-Joy, Nicholas Hoult, and John Leguizamo also star. The Prestige (October 1) (L-R) Christian Bale and Hugh Jackman in The Prestige. Buena Vista Pictures If Christopher Nolan has one underappreciated movie, it's probably this one. Set in Victorian London, Christian Bale and Hugh Jackman play rival musicians who try to top one another with their illusions until it gets to the point where one of them takes things way too far. Scarlett Johansson, Rebecca Hall, Andy Serkis, Michael Caine, and David Bowie also star. The Sixth Sense (October 1) (L-R) Bruce Willis and Haley Joel Osment in The Sixth Sense. Buena Vista Pictures Need another movie that is going to keep you guessing until the end? M. Night Shyamalan's masterpiece stars Bruce Willis as a psychologist who tries to help a young boy (Haley Joel Osment) who believes he sees dead people. All the Twilight movies (October 1) Robert Pattinson and Kristen Stewart play Edward and Bella in the Twilight franchise. Summit Entertainment Once you are done watching all the \"Jason Bourne\" movies, go ahead and run through the \"Twilight\" franchise . Experience the love between Bella and Edward tha", "date_str": "2026-10-01T18:17:46+00:00", "hash": "61a1a4d0737a6731", "title_fa": "11 فیلم برتر که در ماه اکتبر به نتفلیکس می آیند", "summary_fa": "(L-R) آل پاچینو و رابرت دنیرو در گرما. برادران وارنر فیلم‌های اصلی مانند «حیوانات» به کارگردانی بن افلک و مستند «شاگرد» از قبیله وو تانگ را تماشا کنید. تمام فیلم های «گرگ و میش» و «جیسون بورن» را تماشا کنید. همچنین «حرارت»، «حس ششم» و «پرستیژ» را ببینید. بهترین فیلم‌ها را برای تماشای غول استریم در ماه اکتبر بررسی کنید. مرا به نام خود صدا کن (اول اکتبر) آرمی همر و تیموتی شالامه در فیلم مرا با نامت صدا کن. Sony Pictures Classics به کارگردانی لوکا گوادانینو با فیلمنامه‌ای از جیمز آیوری، نوجوانی (Timothée Chalamet) را دنبال می‌کنیم که وقتی یک جوان بیست‌ساله (آرمی همر) وارد زندگی‌اش می‌شود، بیدار می‌شود و همه در ایتالیای سرسبز دهه 1980 اتفاق می‌افتد. همه فیلم‌های جیسون بورن (اول اکتبر) مت دیمون نقش جیسون بورن را بازی می‌کند. یونیورسال اگر به دنبال اکشن این آخر هفته هستید، نتفلیکس در حال حاضر تمام فیلم‌های «جیسون بورن» را دارد (بله، حتی «میراث بورن» با بازی جرمی رنر). تماشا کنید که مت دیمون به طور کامل هر کسی را که از مسیر او عبور می کند شکست می دهد. منو (اول اکتبر) آنیا تیلور جوی و رالف فاینس در فیلم The Menu بازی می کنند. اریک زاکانوویچ/ استودیو قرن بیستم این فیلم ترسناک کمدی تاریک گروهی از غذاخورها را دنبال می‌کند که انتظار دارند یک شام شگفت‌انگیز را در یک رستوران اختصاصی بخورند. در حقیقت، سرآشپز آنها (رالف فاینس) دوره‌هایی را راه‌اندازی کرده است که حامیانش را شوکه کرده و در برخی موارد می‌کشد. آنیا تیلور جوی، نیکلاس هولت و جان لگوئیزامو نیز در این فیلم ایفای نقش کرده اند. The Prestige (1 اکتبر) (L-R) کریستین بیل و هیو جکمن در The Prestige. تصاویر بوئنا ویستا اگر کریستوفر نولان یک فیلم دارد که مورد استقبال قرار نگرفته است، احتمالاً این فیلم است. داستان در لندن ویکتوریایی، کریستین بیل"}, {"source": "Business Insider", "title": "Everyone told me what to pack in my hospital bag as a first-time mom. Here's what I actually used and what I wish I'd brought.", "link": "https://www.businessinsider.com/guides/style/hospital-bag-packing-list", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Talia Ergas/Business Insider As an expectant first-time mom , I packed my hospital bag with the mindset that I'd rather over-prepare than wish I'd brought something. On my list were plenty of practical items, but also a few comforts to make the delivery room feel more like my own space. With my Caraa Baby Hospital Bag in tow, I somehow fit everything from pajamas and toiletries to my own bedding with room to spare. After several days in the hospital, I came home with a much better sense of what was genuinely useful, what could have stayed behind, and what I wish I'd brought. The biggest lesson: Hospitals generally provide many of the necessities, so precious packing space is better spent on things that make you more comfortable. My 3 main takeaways on packing a hospital bag Talia Ergas/Business Insider Check what your hospital provides. Ours supplied nearly every postpartum and newborn essential we needed, from disposable underwear and pads for me to diapers and swaddles for our baby. Prioritize comfort over outfit changes. I packed several lounge outfits, but mostly lived in nightgowns and robes. My personal labor and delivery gown got far more use than the extra sweats I brought. A few nonessentials will make the hospital feel more like home. Flameless candles, a galaxy projector, and my own bedding weren't necessities, but they made labor and recovery more comfortable. There were a few items I wish I'd packed. Talia Ergas/Business Insider A pumping bra. I was aware the hospital would supply a breast pump, but as a newbie mama, I didn't think to bring my own pumping bra. At a time when my proverbial and literal hands were full enough, I had to hold both collection bottles during every pumping session. I ordered a 2-pack of pumping bralettes on Amazon from the hospital, and it was waiting on my doorstep when I got home. A donut pillow. For people anticipating a vaginal birth, a donut pillow may be worth its weight in packing real estate. My hospital provided foam egg crates, but they weren't substantial enough to make sitting anywhere but the bed comfortable. I bought my own donut pillow when I got home: Some newborn outfits in a couple of sizes. Many hospitals offer a photographer for newborn photos. I packed one cute outfit based on my baby's predicted birth weight, but it was comically large after I went into labor three weeks early. If I could go back, I'd br", "date_str": "2026-10-01T18:08:15+00:00", "hash": "883c998b1a27a314", "title_fa": "همه به من می گفتند که برای اولین بار در کیف بیمارستانم چه چیزی ببندم. در اینجا چیزی است که من واقعاً استفاده کردم و آرزو می کردم چه چیزی می آوردم.", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Talia Ergas/Business Insider. در فهرست من آیتم های کاربردی زیادی وجود داشت، اما همچنین امکانات کمی وجود داشت تا اتاق زایمان را بیشتر شبیه فضای خودم کنم. با در دست گرفتن کیف بیمارستان نوزاد Caraa، همه چیز از لباس خواب و لوازم بهداشتی گرفته تا رختخواب خودم را با فضای خالی در اختیار دارم. پس از چند روز بستری شدن در بیمارستان، با درک بهتری از آنچه واقعاً مفید است، چه چیزی می‌توانست باقی بماند و چه چیزی را که آرزو می‌کردم می‌آورم، به خانه آمدم. بزرگترین درس: بیمارستان ها به طور کلی بسیاری از ملزومات را فراهم می کنند، بنابراین فضای گرانبها برای بسته بندی بهتر است صرف چیزهایی شود که شما را راحت تر می کند. 3 پیشنهاد اصلی من برای بسته بندی کیف بیمارستان Talia Ergas/Business Insider بررسی کنید که بیمارستان شما چه چیزی ارائه می دهد. ما تقریباً هر مورد ضروری بعد از زایمان و نوزادی را که نیاز داشتیم، از لباس زیر و پدهای یکبار مصرف برای من گرفته تا پوشک و قنداق برای نوزادمان تامین می‌کردیم. راحتی را به تغییر لباس اولویت دهید. من چندین لباس سالن می‌پوشیدم، اما بیشتر با لباس‌های شب و عبا زندگی می‌کردم. لباس کار و زایمان شخصی من بسیار بیشتر از عرق های اضافی که آورده بودم استفاده می شد. چند مورد غیر ضروری باعث می شود بیمارستان بیشتر احساس خانه را داشته باشد. شمع‌های بدون شعله، یک پروژکتور کهکشانی، و ملافه‌های خودم ضروری نبودند، اما کار و بهبودی را راحت‌تر می‌کردند. چند مورد بود که ای کاش بسته بندی می کردم. تالیا ارگاس/Business Insider یک سوتین پمپاژ. می دانستم که بیمارستان پمپ سینه می دهد، اما به عنوان یک مادر تازه کار، فکر نمی کردم سوتین پمپاژ خودم را"}, {"source": "Business Insider", "title": "Vinod Khosla trashed a portfolio company — and the startup world has thoughts", "link": "https://www.businessinsider.com/vinod-khosla-trashing-portfolio-company-factory-cognition-feud-2026-10", "summary": "Vinod Khosla has got some heat from the startup world over his comments about Factory AI. Big Event Media/Getty Images for HumanX Conference Vinod Khosla bashed Factory AI, a startup that his VC firm has invested in. Khosla's comments about Factory drew backlash from some founders and tech VCs. Khosla Ventures is an investor in two software development startups that are feuding. In Silicon Valley, investing in competitors is increasingly standard practice. Publicly trashing one of them is not. Vinod Khosla , the founder of Khosla Ventures, sparked a wave of criticism on Wednesday after publicly taking sides in a spat between Factory AI and Cognition — two rival AI coding startups — even though his firm has invested in both of them. Khosla sided emphatically with Cognition, calling Factory a “struggling second tier competitor” and accusing its founder of lying out of \"desperation.\" Khosla's comments came after Factory CEO Matan Grinberg said the company was terminating Chris Degnan, its board observer and advisor, for \"unethical conduct involving Cognition.\" Degnan said he had resigned before any termination and disputed sharing Factory information with Cognition. Degnan announced shortly afterward that he was joining Cognition as its chief revenue officer. Cognition CEO Scott Wu denied the company had asked employees to gather information about competitors “under-the-table.” All of this played out in the very public arena of X, and Khosla's comments were met with disagreement from startup founders and investors. You are a struggling second tier competitor that is more unethical and lying just because you have no decency or sense of proper behavior and shows your desperation. Straight out lying about if Chris being fired I thought would be below even you. https://t.co/5pyZlYcry8 — Vinod Khosla (@vkhosla) September 30, 2026 \"If they are struggling second-tier losers, why did you just invest in them a few weeks ago at a multi-billion dollar valuation?\" wrote Palmer Luckey, the cofounder of defense technology company Anduril, in a Thursday reply on X. Khosla Ventures was a key investor in Factory's $200 million funding round that it announced last month. Khosla Ventures did not respond to a request for comment. Spenser Skates, the CEO of product analytics company Amplitude, wrote that it was “another great reason not to raise from Vinod.\" He called Khosla “one of the biggest bullies of founders in the VC ecosystem” and added that the investor was doing so to “", "date_str": "2026-10-01T17:50:03+00:00", "hash": "2ad6d04a681cc4bc", "title_fa": "Vinod Khosla یک شرکت پرتفوی را به هدر داد - و دنیای استارتاپ افکاری دارد", "summary_fa": "Vinod Khosla به خاطر نظراتش در مورد Factory AI از دنیای استارتاپ‌ها داغ شده است. رسانه رویداد بزرگ/ گتی ایماژ برای کنفرانس HumanX وینود خوسلا با Factory AI، استارت آپی که شرکت VC او روی آن سرمایه گذاری کرده است، انتقاد کرد. نظرات خوسلا درباره Factory با واکنش برخی از بنیانگذاران و VCهای فناوری مواجه شد. Khosla Ventures یک سرمایه گذار در دو استارت آپ توسعه نرم افزار است که در حال اختلاف هستند. در سیلیکون ولی، سرمایه گذاری روی رقبا به طور فزاینده ای یک روش استاندارد است. سطل زباله عمومی یکی از آنها نیست. Vinod Khosla، بنیانگذار Khosla Ventures، پس از اینکه علناً در اختلاف بین Factory AI و Cognition - دو استارت‌آپ رقیب برنامه‌نویسی هوش مصنوعی - موضع‌گیری کرد، موجی از انتقادات را در روز چهارشنبه برانگیخت، حتی اگر شرکت او در هر دوی آنها سرمایه‌گذاری کرده است. Khosla قاطعانه با Cognition طرف شد و Factory را یک \"رقیب در حال مبارزه درجه دوم\" خواند و مؤسس آن را متهم کرد که از روی \"ناامیدی\" دروغ گفته است. اظهارات Khosla پس از آن بیان شد که Matan Grinberg، مدیرعامل Factory گفت که شرکت کریس دگنان، ناظر و مشاور هیئت مدیره خود را به دلیل \"رفتار غیراخلاقی مرتبط با شناخت\" خاتمه می دهد. دگنان گفت که قبل از هر گونه فسخ استعفا داده است و در مورد اشتراک گذاری اطلاعات کارخانه با Cognition اختلاف نظر داشته است. دگنان مدت کوتاهی پس از آن اعلام کرد که به عنوان مدیر ارشد درآمد به Cognition می پیوندد. اسکات وو، مدیر عامل Cognition، درخواست این شرکت از کارمندان را برای جمع‌آوری اطلاعات درباره رقبا «زیر میز» رد کرد. همه اینها در عرصه عمومی X اجرا شد و نظرات خوسلا با مخالفت بنیانگذاران و سرمایه گذاران استارت آپی مواجه شد. شما یک رقیب ردیف دوم هستید که بیشتر غیراخلاقی است و دروغ"}, {"source": "Business Insider", "title": "I saw the Elizabeth Holmes doc. Shhhhhh I can't tell you about it.", "link": "https://www.businessinsider.com/elizabeth-holmes-nathan-fielder-documentary-premiere-reaction-2026-10", "summary": "The New York premiere of You Can See Everything was a hot ticket. Henry Chandonnet/Business Insider I went to the New York Film Festival premiere of \"You Can See Everything.\" The documentary was a shocking and funny look at Elizabeth Holmes' life. The festival director swore us to secrecy. But, here's what little I can share without spoiling it. My row of Alice Tully Hall was filled with reporters scribbling notes about the buzzy new Elizabeth Holmes documentary . Then, we heard the warning. \"In the interest of trying to preserve a relatively spoiler-free experience for later audiences, we ask that you not film and post this conversation,\" said Dennis Lim, the artistic director of New York Film Festival. Lim recommended shaming anyone who recorded the chat between Nathan Fielder and Lance Oppenheim, the directors of \"You Can See Everything.\" A flock of journalists put their phones away, disappointedly. The filmmakers had reason to worry: \"You Can See Everything\" was one of the most shocking, revelatory, and oddly funny films I've ever seen. It was twisty and worthy of seeing with fresh eyes. So, I'm not going to spoil it for you. Lim wouldn't want me to. Here's my veiled, semi-secretive attempt to tell you what I saw. The anticipation was palpable The line wrapped around the block. One woman, with her marker-written sign, begged for just one ticket by the security scanners. It's no surprise that the New York premiere was a hot ticket. \"You Can See Everything\" is about the story of Elizabeth Holmes , the founder of blood-testing startup Theranos, who was convicted of defrauding investors of hundreds of millions of dollars. Her case became a media sensation, spawning books and a Hulu series. The line for You Can See Everything wrapped around the block. Henry Chandonnet/Business Insider Fielder himself is a pull, with his alt-comedy shows like \"Nathan for You\" and \"The Rehearsal.\" Oppenheim is in the news of late for his eerie take on the Chris Hansen story , \"Primetime.\" But, in the lobby of the theater, Holmes was all I heard about. She's still the fraudster of our public imagination, spurring endless questions. (Holmes maintains that she's innocent throughout the film.) The crowd and I eventually filed into the theater. There were lots of journalists, lots of creative types, lots of people involved in the film. I spotted multiple \"Now Playing\" caps from Film Forum. I waited in the lobby of the Starr Theater for the screening. Henry Chandonnet/Business Insi", "date_str": "2026-10-01T17:39:43+00:00", "hash": "9ab625835a2a3a0a", "title_fa": "من سند الیزابت هلمز را دیدم. هههه من نمیتونم در موردش بهت بگم", "summary_fa": "اولین نمایش تو می توانی همه چیز را ببینی در نیویورک یک بلیط داغ بود. هنری Chandonet/Business Insider من به اولین نمایش \"شما می توانید همه چیز را ببینید\" در جشنواره فیلم نیویورک رفتم. این مستند نگاهی تکان دهنده و خنده دار به زندگی الیزابت هلمز بود. مدیر جشنواره ما را به مخفی کاری سوگند داد. اما، این چیزی است که من می توانم بدون خراب کردن آن به اشتراک بگذارم. ردیف من از آلیس تالی هال مملو از خبرنگارانی بود که یادداشت هایی درباره مستند پر سر و صدا جدید الیزابت هلمز می نوشتند. سپس، ما هشدار را شنیدیم. دنیس لیم، مدیر هنری جشنواره فیلم نیویورک گفت: «به منظور تلاش برای حفظ یک تجربه نسبتاً بدون اسپویل برای مخاطبان بعدی، از شما می‌خواهیم که این گفتگو را فیلمبرداری و ارسال نکنید. لیم توصیه کرد هر کسی را که چت بین ناتان فیلدر و لنس اوپنهایم، کارگردان‌های «شما می‌توانید همه چیز را ببینید» ضبط کرده است، شرمنده کنید. گروهی از روزنامه نگاران با ناامیدی گوشی های خود را کنار گذاشتند. سازندگان فیلم دلیلی برای نگرانی داشتند: «شما می توانید همه چیز را ببینید» یکی از تکان دهنده ترین، افشاگرانه ترین و به طرز عجیبی خنده دارترین فیلم هایی بود که تا به حال دیده بودم. پر پیچ و خم بود و شایسته دیدن با چشمانی تازه بود. بنابراین، من آن را برای شما خراب نمی کنم. لیم از من نمی خواهد. در اینجا تلاش پنهان و نیمه مخفیانه من برای گفتن آنچه دیدم است. انتظار محسوس بود خط دور بلوک پیچیده شد. یک زن با علامت نوشته شده خود، فقط یک بلیط توسط اسکنرهای امنیتی التماس کرد. جای تعجب نیست که اولین نمایش نیویورک یک بلیط داغ بود. «شما می توانید همه چیز را ببینید» درباره داستان الیزابت هلمز، موسس استارت آپ آزمایش خون Theranos است که به دلیل کلاهبرداری"}, {"source": "Business Insider", "title": "Student-loan borrowers get notices saying they have 30 more days to pick a new repayment plan", "link": "https://www.businessinsider.com/student-loan-borrowers-save-deadline-extra-month-new-repayment-plan-2026-10", "summary": "Some student-loan borrowers are receiving notices extending their deadline to transition off the SAVE repayment plan. hxdbzxy/Getty Images Student-loan borrowers are receiving a \"final notice\" to leave the SAVE repayment plan. The notice said that borrowers have 30 more days to pick a new plan or be placed in the most expensive option. Borrowers have expressed confusion with the notices and conflicting deadlines. The confusion grows for student-loan borrowers transitioning off a key repayment plan. The deadline for the first wave of borrowers to leave SAVE , a Biden-era income-driven repayment plan, was September 29. However, some borrowers who didn't pick a new plan within their 90-day window might have more time. A Department of Education spokesperson confirmed to Business Insider that borrowers who received their initial notice to leave SAVE \"on or around July 1\" have received a final 30-day notice to pick a new plan and leave on their own terms, and did not specify how many borrowers received the notice. \"This is your FINAL NOTICE,\" the email, reviewed by Business Insider, said. \"If you do not take immediate action to select a repayment plan, we will place you into a repayment plan in 30 days.\" The email added that borrowers currently enrolled in SAVE will be placed on the standard or tiered repayment plan — the most expensive options — if they do not select a new one before the 30-day period ends. The department has not publicly announced an extension of the 90-day timeframe borrowers have received. After the Trump administration eliminated SAVE, student-loan servicers began sending notices to borrowers, effective July 1, informing them of a 90-day timeframe to switch to a new plan. Borrowers who received the latest \"final notice\" expressed confusion, with some saying they had already selected a new plan or are seeing conflicting deadlines on their online portal. It follows a range of confusing communications that borrowers have received since Trump's repayment overhaul took effect on July 1, including new repayment plans. Borrowers have reported incorrect monthly bills, erroneous notices on their account statuses, and difficulty getting clear information from customer service. Borrowers have said those mistakes have made it challenging to budget their finances, and they're concerned about falling behind on payments and facing the consequences of default, which include wage garnishment and the seizure of federal benefits. Notices to transition off SAV", "date_str": "2026-10-01T17:31:34+00:00", "hash": "7889973dfce42110", "title_fa": "وام‌گیرندگان وام دانشجویی اخطاریه‌هایی دریافت می‌کنند که می‌گویند 30 روز دیگر برای انتخاب طرح بازپرداخت جدید فرصت دارند.", "summary_fa": "برخی از وام‌گیرندگان وام دانشجویی اخطاریه‌هایی را دریافت می‌کنند که مهلت خود را برای خروج از طرح بازپرداخت SAVE تمدید می‌کند. hxdbzxy/Getty Images وام گیرندگان وام دانشجویی یک \"اخطار نهایی\" برای خروج از طرح بازپرداخت SAVE دریافت می کنند. در این اطلاعیه آمده است که وام گیرندگان 30 روز دیگر فرصت دارند تا طرح جدیدی را انتخاب کنند یا در گران ترین گزینه قرار گیرند. وام گیرندگان نسبت به اطلاعیه ها و مهلت های متناقض ابراز سردرگمی کرده اند. سردرگمی برای وام گیرندگان وام دانشجویی که از برنامه بازپرداخت کلیدی خارج می شوند، بیشتر می شود. آخرین مهلت موج اول وام گیرندگان برای خروج از SAVE، یک طرح بازپرداخت مبتنی بر درآمد دوره بایدن، 29 سپتامبر بود. با این حال، برخی از وام گیرندگانی که طرح جدیدی را در بازه زمانی 90 روزه خود انتخاب نکردند، ممکن است زمان بیشتری داشته باشند. سخنگوی وزارت آموزش به Business Insider تأیید کرد که وام گیرندگانی که اخطار اولیه خود را برای خروج از SAVE «در یا حوالی 1 ژوئیه» دریافت کرده‌اند، آخرین اخطار 30 روزه برای انتخاب طرح جدید و ترک بر اساس شرایط خود دریافت کرده‌اند، و مشخص نکرد که چه تعداد وام گیرنده این اخطار را دریافت کرده‌اند. در ایمیلی که توسط Business Insider بررسی شده، آمده است: «این اعلامیه نهایی شماست. \"اگر اقدام فوری برای انتخاب یک طرح بازپرداخت انجام ندهید، ما شما را در یک طرح بازپرداخت ظرف 30 روز قرار خواهیم داد.\" این ایمیل اضافه می‌کند که وام‌گیرندگانی که در حال حاضر در SAVE ثبت‌نام کرده‌اند، در صورتی که قبل از پایان دوره 30 روزه طرح جدیدی را انتخاب نکنند، در طرح بازپرداخت استاندارد یا سطحی - گران‌ترین گزینه‌ها - قرار خواهند گرفت. این وزارتخانه به طور عمومی تمدید 90 روز بازه زمانی وام گیرندگان را اعلام نکرده است. پس از حذف SAVE توسط دولت ترامپ، سرویس‌دهندگان"}, {"source": "Business Insider", "title": "I swallowed my pride and moved back in with my parents after a layoff. I'm glad I did.", "link": "https://www.businessinsider.com/losing-job-crushed-confidence-moving-home-helped-get-it-back-2026-10", "summary": "The author, shown on a recent road trip through Maine, said that moving back in with her parents gave her the space she needed to plan her next career move. Courtesy of Erika Lindquist. I struggled to find a new job after I was laid off in 2023. After months of trying, I decided to leave NYC and move in with my parents. Being unemployed gave me time to heal and rethink what success now means to me. New York City is expensive, even when you're employed. If you happen to be job hunting , that expense hits even harder. In 2024, about a year after I was laid off, I was facing a difficult decision: Should I stay in NYC, drain the rest of my savings, and hope to land a job soon? Or should I, an adult in my 30's, just call it and move back in with my parents in the New England suburbs? My pride reared up against leaving. It felt like an admission of defeat and giving up a part of myself. After all, who was I if not an anxious, depressed, and unhealthy corporate worker ? In the end, with no work leads, I couldn't justify the cost of staying and spinning my wheels. So in January 2025, I left the big city behind me, tail firmly tucked between my legs, and moved back home. Success is about how you sell it After the layoff, I began to see how my mental health had suffered during my tenure at my old job. Putting aside anxiety, bouts of hives, and the unhealthy habits I'd developed, the most significant loss was my confidence. Without it, I was floundering. At the suggestion of loved ones, I started working with a career coach , who sat with me as I struggled to articulate what I actually wanted to accomplish in my life. My coach encouraged me to focus on defining success in terms of what would actually make me happier and more fulfilled. I knew I didn't want to return to my old job, but I still couldn't kick the impulse to chase that kind of paycheck and job title, and the respect I thought it would earn me. Progress took time With the benefit of career coaching, I had hoped my luck would turn quickly once I moved back home. But it took another five months for me to land a role. It was part time at a non-profit, without benefits or substantial pay, but I couldn't afford to turn it down. As a newly minted operations manager, I joined a small team and got to work on creating organizational systems, untangling billing issues, and handling day-to-day tasks. As my little victories stacked up, I could feel my confidence slowly building again. Sure, I was still living at home", "date_str": "2026-10-01T17:29:01+00:00", "hash": "27592684925dbf05", "title_fa": "غرورم را قورت دادم و بعد از اخراج دوباره نزد پدر و مادرم رفتم. خوشحالم که انجام دادم.", "summary_fa": "نویسنده، که در یک سفر جاده ای اخیر از مین نشان داده شده است، گفت که بازگشت به خانه با والدینش فضای مورد نیاز برای برنامه ریزی حرکت شغلی بعدی خود را به او داد. با حسن نیت از اریکا لیندکویست. بعد از اینکه در سال 2023 اخراج شدم، برای یافتن شغل جدید تلاش کردم. پس از ماه‌ها تلاش، تصمیم گرفتم نیویورک را ترک کنم و نزد والدینم نقل مکان کنم. بیکار بودن به من زمان داد تا خوب شوم و دوباره فکر کنم که موفقیت اکنون برای من چه معنایی دارد. شهر نیویورک گران است، حتی زمانی که شما شاغل هستید. اگر به دنبال شغل باشید، این هزینه حتی سخت‌تر می‌شود. در سال 2024، حدود یک سال پس از اخراج، با یک تصمیم دشوار روبرو بودم: آیا باید در نیویورک بمانم، بقیه پس اندازم را تخلیه کنم و امیدوار باشم که به زودی شغلی پیدا کنم؟ یا من، یک بزرگسال در 30 سالگی، باید فقط با آن تماس بگیرم و با والدینم در حومه نیوانگلند برگردم؟ غرور من در برابر رفتن بالا رفت. احساسی مثل اعتراف به شکست و کنار گذاشتن بخشی از خودم بود. بالاخره اگر یک کارگر مضطرب، افسرده و ناسالم شرکتی نباشم، من که بودم؟ در نهایت، بدون سرنخ کاری، نمی‌توانم هزینه‌های ماندن و چرخاندن چرخ‌هایم را توجیه کنم. بنابراین در ژانویه 2025، شهر بزرگ را پشت سرم ترک کردم، دم را محکم بین پاهایم قرار دادم و به خانه برگشتم. موفقیت به این بستگی دارد که چگونه آن را بفروشید پس از اخراج، متوجه شدم که سلامت روانی من در دوران تصدی شغل قبلی ام چگونه آسیب دیده است. با کنار گذاشتن اضطراب، حملات کهیر، و عادات ناسالمی که ایجاد کرده بودم، مهم ترین ضرر اعتماد به نفس من بود. بدون آن، من دست و پا می زدم. به پیشنهاد عزیزان، کارم را با یک"}, {"source": "Business Insider", "title": "The 25 best new restaurants in the country, according to diners", "link": "https://www.businessinsider.com/best-new-restaurants-in-the-country-yelp-reviews-2026-10", "summary": "Ahi tuna from The Chapman. The Chapman/Yelp Yelp ranked the best new restaurants in the country based on customer reviews. The list shows that diners are embracing steakhouses, Indian restaurants, and buzzy brunch spots. A jungle-inspired Tempe lounge and a Chinese American prix-fixe restaurant took the top two spots. America's most exciting new restaurants aren't just opening in New York, Los Angeles, or Miami — they're opening nationwide. A Yelp ranking of the best new restaurants in the US shows diners are gravitating toward big, experience-driven meals, from trendy steakhouses and Indian restaurants to lavish brunches and live-fire cooking. To make the list, Yelp ranked 25 of the country's best new full-service restaurants based on a few key factors, including review volume and individual ratings from diners. To be eligible, restaurants had to open after January 1, 2025, and have a passing health score. Yelp also reviewed data through June 11, 2026, to ensure reviews remained positive well after the business first opened. The list, released Tuesday, featured Filthy Animal, a jungle-themed restaurant in Tempe, Arizona, at the top, as well as two buzzy New York City openings (Mexican restaurant Limusina and London import Ambassadors Clubhouse) and Travis Kelce and Patrick Mahomes' new steakhouse , 1587 Prime, in Kansas City, Missouri. Here are the 25
