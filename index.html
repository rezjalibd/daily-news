h the \"supply chain risk\" label — a move that Anthropic has said will cause it significant \"reputational stigma\" and cost it hundreds of millions of dollars in revenue. This story originally appeared on POLITICO and is courtesy of the Axel Springer Global Reporters Network, which harnesses the resources of the company's newsrooms to publish ambitious scoops, investigations, interviews, opinion pieces, and analysis. It allows journalists — including those from POLITICO, Business Insider, WELT, BILD, Onet, and Fakt — to collaborate on major stories for an international audience of hundreds of millions across platforms. Read the original article on Business Insider", "date_str": "2026-09-25T16:19:53+00:00", "hash": "6c045f95b9f56e3e", "title_fa": "دادگاه استیناف به پنتاگون اجازه می دهد تا Anthropic را یک خطر امنیت ملی بداند", "summary_fa": "داریو آمودی بلومبرگ/ گتی ایماژ، مدیر عامل آنتروپیک، دادگاه تجدیدنظر فدرال روز جمعه اعلام کرد که دولت ترامپ می تواند شرکت هوش مصنوعی آنتروپیک را در لیست سیاه همه قراردادهای پنتاگون قرار دهد. دادگاه تجدیدنظر منطقه دی سی رای 2-1 به نفع وزارت دفاع صادر کرد. این تصمیم، اختیارات گسترده ای را برای قوه مجریه ایجاد می کند تا شرکت ها را با برچسب \"ریسک زنجیره تامین\" برچسب گذاری کند. دادگاه تجدید نظر فدرال روز جمعه اعلام کرد که دولت ترامپ می تواند شرکت هوش مصنوعی Anthropic را در لیست سیاه همه قراردادهای پنتاگون قرار دهد، تصمیمی که اختیارات قوه مجریه را برای تعیین مشاغل آمریکایی به عنوان خطرات امنیت ملی افزایش می دهد. D.C. دادگاه تجدیدنظر منطقه ۲-۱ حکم داد که وزارت دفاع دلایل خوبی برای این نتیجه دارد که محصولات هوش مصنوعی این شرکت خطری زنجیره تامین برای این بخش و پیمانکاران آن دارد زیرا این شرکت کدی را در مدل‌های خود گنجانده است که آنها را از انجام برخی وظایف محدود می‌کند. آنتروپیک گفته است که اجازه نخواهد داد محصولاتش برای تسلیحات خودمختار یا نظارت انبوه داخلی استفاده شود. دادگاه نوشت: «وزارت حمایت کافی برای نتیجه گیری خود داشت که ادغام مستمر کلود در سیستم های اطلاعاتی وزارتخانه، توسط وزارت یا پیمانکاران آن، یک خطر امنیتی ملی را به همراه دارد.» همانطور که آنتروپیک اعتراف می کند، این شرکت محدودیت هایی را برای کلود کدگذاری می کند که مدل را از انجام وظایفی که آنتروپیک می خواهد جلوگیری کند، باز می دارد. این تصمیم قدرت گسترده ای را برای قوه مجریه ایجاد می کند تا به طور موثر شرکت های خارجی و آمریکایی را با برچسب \"ریسک زنجیره تامین\" برچسب گذاری کند - اقدامی که آنتروپیک گفته است باعث \"ننگ شهرت\" قابل توجهی خواهد شد و صدها میلیون دلار درآمد برای آن به همراه خواهد داشت."}, {"source": "Business Insider", "title": "See the luxurious, heavily fortified presidential jets that world leaders use for official travel", "link": "https://www.businessinsider.com/air-force-one-presidential-planes-around-the-world", "summary": "President Donald Trump greeted Chinese President Xi Jinping as he disembarked from China s presidential jet on Wednesday. Chip Somodevilla/Getty Images The US' presidential plane is dubbed Air Force One when the commander in chief is on board. Other countries have their own presidential aircraft. Boeing 747 jumbo jets and Airbus A330 and A340 planes are popular options for world leaders. The Boeing VC-25 is arguably the most famous jetliner in the world, even though most people have never heard of it by that name. Most do know it, though, by the call sign it's assigned when the president of the United States is on board: Air Force One . Air Force One is instantly recognizable, both as the president's airplane and as a flying symbol of American military and economic might. The US president is not the only one to have their own presidential jet. A number of prominent international leaders also use some form of executive transport. The Boeing 747 jumbo jet is a popular option for many nations, including Turkey, South Korea, and China. China's leader, Xi Jinping, landed at Joint Base Andrews in Maryland on Wednesday aboard the country's Boeing 747-8i airliner for a state visit. President Donald Trump and first lady Melania Trump greeted Xi and his wife, Peng Liyuan, as they disembarked, and hosted a state dinner at the White House on Thursday attended by numerous tech leaders. The Airbus A330 and A340 are also commonly found in presidential fleets. Here's a closer look at how the presidents, chancellors, and prime ministers of the world travel. President Donald Trump s interim Air Force One jet, a Boeing 747-8 retrofitted as a VC-25B Bridge, entered service in July. US President Donald Trump arrives on Air Force One at Shannon Airport, Co Clare, as he travels to the Irish Open at the Trump International Golf Links Hotel in Doonbeg, during his trip to the Republic of Ireland. Picture date: Saturday September 12, 2026. (Photo by Liam McBurney/PA Images via Getty Images) Liam McBurney - PA Images/PA Images via Getty Images Trump accepted the luxury business jet previously used by the Qatari royal family as a gift from Qatar in May 2025, saying he'd be \"stupid\" to turn it down. After the plane was retrofitted to serve as Air Force One, the aircraft became known as the VC-25B Bridge and will serve as an interim presidential aircraft until Boeing's new VC-25Bs are delivered. In its first few months flying the president, the VC-25B Bridge has been the subject of secu", "date_str": "2026-09-25T16:10:48+00:00", "hash": "cb250c772b0c3b67", "title_fa": "جت های لوکس و مستحکم ریاست جمهوری را ببینید که رهبران جهان برای سفرهای رسمی از آنها استفاده می کنند", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا روز چهارشنبه هنگام پیاده شدن از هواپیمای ریاست‌جمهوری چین، شی جین پینگ، رئیس‌جمهور چین را مورد استقبال قرار داد. Chip Somodevilla/Getty Images هواپیمای ریاست جمهوری ایالات متحده زمانی که فرمانده کل در هواپیما باشد، Air Force One نامیده می شود. کشورهای دیگر هواپیماهای ریاست جمهوری خود را دارند. بوئینگ 747 جامبو جت و هواپیماهای ایرباس A330 و A340 گزینه های محبوب برای رهبران جهان هستند. بوئینگ VC-25 مسلماً مشهورترین هواپیمای جت در جهان است، حتی اگر اکثر مردم هرگز نام آن را به این نام نشنیده باشند. با این حال، بسیاری آن را می‌دانند، اما با علامت تماس زمانی که رئیس‌جمهور ایالات متحده در کشتی است، تعیین می‌شود: Air Force One. ایر فورس وان هم به عنوان هواپیمای رئیس جمهور و هم به عنوان نماد پرواز قدرت نظامی و اقتصادی آمریکا فوراً قابل تشخیص است. رئیس جمهور آمریکا تنها کسی نیست که جت ریاست جمهوری خود را دارد. تعدادی از رهبران برجسته بین المللی نیز از نوعی حمل و نقل اجرایی استفاده می کنند. بوئینگ 747 جت جامبو یک گزینه محبوب برای بسیاری از کشورها از جمله ترکیه، کره جنوبی و چین است. شی جین پینگ، رهبر چین، روز چهارشنبه با هواپیمای مسافربری بوئینگ 747-8i این کشور برای یک دیدار دولتی در پایگاه مشترک اندروز در مریلند فرود آمد. دونالد ترامپ، رئیس‌جمهور آمریکا و ملانیا ترامپ، بانوی اول، هنگام پیاده شدن از شی و همسرش پنگ لیوان استقبال کردند و روز پنج‌شنبه در کاخ سفید یک شام دولتی با حضور بسیاری از رهبران فناوری برگزار کردند. ایرباس A330 و A340 نیز معمولاً در ناوگان ریاست جمهوری یافت می شوند. در اینجا نگاهی دقیق تر به نحوه سفر روسای جمهور، صدراعظم و نخست وزیران جهان داریم. جت موقت ایر فورس وان رئیس جمهور دونالد ترامپ، یک بوئینگ 747-8 که به عنوان پل VC-25B بهسازی شده بود، در"}, {"source": "Business Insider", "title": "Billionaire investor Bill Ackman says the AI race may have broken the Fed’s inflation playbook", "link": "https://www.businessinsider.com/bill-ackman-ai-fed-rate-hikes-inflation-economy-kevin-warsh-2026-9", "summary": "Bloomberg/Getty Images Investor Bill Ackman says the Fed may have made a mistake by raising interest rates. That's because AI might be scrambling the usual thinking on demand and inflation. \"What if the old models don't apply to the current paradigm and the Fed is wrong?\" Bill Ackman thinks tighter monetary policy could prove to be a mistake in the era of AI. The billionaire investor said late Thursday that the Federal Reserve's decision to hike interest rates last week was the wrong move, because AI may be rewriting the rules that guide the central bank's response to inflation. Ackman wrote in an X post that the principle that rate hikes reduce inflation by pushing down demand potentially no longer applies. \"What if the old models don't apply to the current paradigm and the Fed is wrong?\" he mused. \"I think the Fed might have just made a mistake.\" The Pershing Square founder theorized that, while higher rates cool demand in normal times, that's not necessarily the case in the AI era. \"What if higher rates don't reduce demand and investment because the demand for intelligence and energy is unaffected by higher rates because winning the race for super intelligence has a near infinite ROI and the demand for compute will remain incalculable?\" Ackman wrote. In his view, the Fed's decision to embark on a new rate hike cycle could actually lead to worse inflation, as higher interest costs become \"embedded in everything.\" \"The problem is compounded as the more the Fed raises rates, the more inflation we will have and the more the Fed will need to raise rates further and so on.\" Ackman's post stirred up debate among X users. Some noted that higher rates have already led to more inflation, exacerbating issues of low supply facing certain segments of the economy like housing. Some pointed to the 2022-2023 era as proof that rate hikes worked to cool inflation that had peaked above 9%. But Ackman argued that the world of the pre-AI era was different. \"The world has changed since 2023. That's my point. We are in a post ChatGPT world in a race toward super intelligence,\" he wrote. Other market pros have been against rates hike recently as well, though for different reasons. Moody's Analytics chief economist Mark Zandi , argued ahead of last week's hike that increasing rates would likely be a mistake for the Fed, as it could weigh on consumers while doing little to address major macro issues like the oil shock from the Iran war. Read the original article on Business Insi", "date_str": "2026-09-25T16:06:20+00:00", "hash": "5cd4cb036750af56", "title_fa": "بیل آکمن، سرمایه گذار میلیاردر، می گوید که رقابت هوش مصنوعی ممکن است کتاب تورم فدرال رزرو را شکسته باشد.", "summary_fa": "بیل آکمن، سرمایه گذار بلومبرگ/ گتی ایماژ می گوید که فدرال رزرو ممکن است با افزایش نرخ بهره اشتباه کرده باشد. این به این دلیل است که هوش مصنوعی ممکن است تفکر معمول در مورد تقاضا و تورم را به چالش بکشد. \"اگر مدل های قدیمی برای الگوی فعلی اعمال نشود و فدرال رزرو اشتباه کند چه؟\" بیل آکمن فکر می کند که سیاست های پولی سخت تر می تواند در عصر هوش مصنوعی اشتباه باشد. این سرمایه گذار میلیاردر اواخر پنجشنبه گفت که تصمیم فدرال رزرو برای افزایش نرخ بهره در هفته گذشته حرکت اشتباهی بوده است، زیرا هوش مصنوعی ممکن است قوانینی را بازنویسی کند که واکنش بانک مرکزی به تورم را هدایت می کند. آکمن در یک پست X نوشت که این اصل که افزایش نرخ‌ها با کاهش تقاضا، تورم را کاهش می‌دهد، دیگر اعمال نمی‌شود. \"اگر مدل های قدیمی برای الگوی فعلی اعمال نشود و فدرال رزرو اشتباه کند چه؟\" او فکر کرد. فکر می کنم فدرال رزرو ممکن است اشتباه کرده باشد. بنیانگذار میدان پرشینگ این نظریه را مطرح کرد که اگرچه نرخ‌های بالاتر تقاضا را در زمان‌های عادی کاهش می‌دهد، اما لزوماً در عصر هوش مصنوعی اینطور نیست. \"اگر نرخ‌های بالاتر تقاضا و سرمایه‌گذاری را کاهش ندهد، چرا که تقاضا برای هوش و انرژی تحت تاثیر نرخ‌های بالاتر قرار نمی‌گیرد، چه می‌شود، زیرا برنده شدن در مسابقه برای هوش فوق‌العاده، بازگشت سرمایه تقریباً نامحدودی دارد و تقاضا برای محاسبه غیرقابل محاسبه باقی می‌ماند؟\" آکمن نوشت. به نظر او، تصمیم فدرال رزرو برای شروع چرخه افزایش نرخ جدید در واقع می تواند منجر به تورم بدتر شود، زیرا هزینه های بهره بالاتر «در همه چیز تعبیه شده است». مشکل پیچیده تر می شود زیرا هر چه فدرال رزرو بیشتر نرخ ها را افزایش دهد، تورم بیشتری خواهیم داشت و فدرال رزرو به افزایش بیشتر نرخ"}, {"source": "Business Insider", "title": "I moved from the US to Germany 4 years ago. Here are the 7 biggest culture shocks I've experienced.", "link": "https://www.businessinsider.com/surprising-things-moving-to-germany-from-us-2024-9", "summary": "My husband and I moved to Germany despite never visiting before. Ashley Packard The first time I visited Germany was when I moved here with my husband four years ago. I couldn't believe how easily accessible and convenient the public-transportation system was. I was shocked to find that most stores, including grocers, were closed on Sundays. In July 2022, I fulfilled my lifelong dream of moving to Europe . When my husband and I married in January that year, we didn't opt for the typical wedding registry. Instead, we sold, donated, or tossed almost everything we owned. Even our cars — which we sold two days before we left the US — had to go. We headed to Germany, a country we'd never visited, with just a few suitcases and our two cats. As soon as we arrived, we noticed a lot of cultural differences . Here are seven things that surprised us about life in Germany. Most places don t have air conditioning. Ashley Packard After a tiring seven-hour flight from Boston to Frankfurt, a three-hour drive from the airport, and six flights of stairs to our apartment, we arrived in Düsseldorf and quickly learned air conditioning isn't really a thing in Germany. The large tilt-and-turn windows in our place didn't have screens, only metal rolling shutters. This meant we couldn't open the windows fully for fear our cats would try to go outside. Instead, we cranked the metal shutters down early in the morning to keep hot air out and rolled them up at night to let in cool air. We also stayed hydrated, added ice cubes to the cats' water bowls, tried not to use the oven, took cool showers, and ordered a standing fan. It blew my mind to learn that only about one in eight German households use air conditioning. Still, we had no choice but to adjust to that lifestyle. Many apartments don t come with equipped kitchens. hanohiki/Shutterstock When I was apartment hunting , I was surprised that many rentals didn't have kitchens stocked with a refrigerator, oven, cabinets, counters, a washing machine, or a dishwasher. Instead, there was typically only an empty room with appliance hookups. That's because tenants in Germany often take most of their kitchen appliances with them when they leave, or they sell the major parts to whoever is moving in. This allows tenants to personalize their spaces, can help landlords save on costs, and may encourage tenants to stay longer. Public transit is easily accessible in most major cities. Ashley Packard Growing up in the Massachusetts suburbs , I rel", "date_str": "2026-09-25T15:39:43+00:00", "hash": "5ec5fd731cf79376", "title_fa": "من 4 سال پیش از آمریکا به آلمان نقل مکان کردم. در اینجا 7 بزرگترین شوک فرهنگی که من تجربه کرده ام آورده شده است.", "summary_fa": "من و شوهرم علیرغم اینکه قبلاً هرگز به این کشور سفر نکرده بودیم به آلمان نقل مکان کردیم. اشلی پاکارد اولین باری که به آلمان رفتم زمانی بود که چهار سال پیش با شوهرم به اینجا نقل مکان کردم. من نمی توانستم باور کنم که سیستم حمل و نقل عمومی چقدر آسان و راحت است. وقتی متوجه شدم اکثر فروشگاه ها، از جمله خواربارفروشی ها، یکشنبه ها تعطیل هستند، شوکه شدم. در ژوئیه 2022، من رویای همیشگی خود را برای مهاجرت به اروپا برآورده کردم. زمانی که من و شوهرم در ژانویه همان سال ازدواج کردیم، دفتر ثبت عروسی معمولی را انتخاب نکردیم. درعوض، تقریباً هر چیزی را که داشتیم فروختیم، اهدا کردیم یا پرت کردیم. حتی ماشین‌های ما - که دو روز قبل از خروج از ایالات متحده فروختیم - باید بروند. ما با چند چمدان و دو گربه خود به آلمان رفتیم، کشوری که هرگز به آن سفر نکرده بودیم. به محض ورود ما متوجه تفاوت های فرهنگی زیادی شدیم. در اینجا هفت چیز وجود دارد که ما را در مورد زندگی در آلمان شگفت زده کرد. اکثر جاها تهویه هوا ندارند. اشلی پاکارد پس از یک پرواز خسته کننده هفت ساعته از بوستون به فرانکفورت، سه ساعت رانندگی از فرودگاه و شش پله به آپارتمان خود، به دوسلدورف رسیدیم و به سرعت متوجه شدیم که تهویه مطبوع در آلمان واقعاً چیزی نیست. پنجره‌های بزرگ شیب‌دار در محل ما پرده نداشت، فقط کرکره‌ای فلزی داشت. این به این معنی بود که از ترس اینکه گربه‌هایمان سعی کنند به بیرون بروند، نمی‌توانستیم پنجره‌ها را کاملاً باز کنیم. درعوض، کرکره‌های فلزی را صبح زود پایین می‌کشیدیم تا هوای گرم خارج نشود و شب‌ها آنها را می‌پیچیدیم تا هوای خنک وارد شود. ما همچنین هیدراته ماندیم، تکه‌های یخ را به کاسه‌های آب گربه‌ها اضافه کردیم، سعی کردیم از فر استفاده نکنیم،"}, {"source": "Business Insider", "title": "6 of the best scents to wear this fall, according to professional perfumers", "link": "https://www.businessinsider.com/best-scents-fragrances-fall-perfumes-from-experts-2026-9", "summary": "Spicy, woodsy fragrances will be on trend this fall. brasovianu/Getty Images Business Insider spoke to three perfumers about the best scents for fall 2026. Woodsy and spicy notes are perfect for the cozy fall months. Fruity scents are typically associated with summer, but these could also be trendy this autumn. Fall has officially arrived, which means you're likely swapping out sandals for boots and dresses for sweaters. But don't forget to spruce up your fragrance collection , too. If you've been pondering the idea of finding your signature scent , now is the perfect time to be on the prowl. Business Insider spoke with three professional perfumers to get their expert-backed fragrance recommendations and tips. From classic scents like sandalwood, vanilla, and honey to more unexpected notes of banana, rose, and tea leaves, here's what experts say are this season's must-haves. It s a great time of year for woodsy scents. Sandalwood can be great for fall. Pawel Kacperek/Getty Images Watching the leaves change colors and spending time by the fireplace are quintessential fall experiences. So, it makes sense that woodsy, earthy scents are popular during this time of year. Darryl Do, a New York-based senior perfumer at Delbia Do Fragrances Flavors , thinks sandalwood in particular will be huge this season. Yes, Nós Temos Banana , a fragrance by Brazilian brand Granado, is one of Do's fall favorites. This scent combines sandalwood and cedar with banana leaves and fig for a tropical twist on woodsy scents. If you're looking for something more traditionally earthy, Bryson Ammons, a New York City-based perfumer and founder of The Alloy Studio , recommends Somewhere but Nowhere by LORE. This fragrance features notes of cedarwood, cardamom, black tea, and vanilla cream. He said it's a \"great starter fall fragrance at a really accessible price point.\" Gourmands are still on trend. Chocolate notes Katsumi Murouchi/Getty Images When fall rolls around, certain scents like pumpkin spice become all the rage — but there are other sweet, culinary-inspired fragrances that deserve a spot on your shelf, too, according to Ammons. \"A lot of different perfumes [...] are playing with that warm, autumnal spice and sweetness without literally being pumpkin spice,\" he said. Teddy Haugen, a Bay Area-based perfumer, founder of Teddy the Perfumer , and creative director at House of Cosmo , recommends chocolate-forward scents as the season changes. One of his favorites is Lust Oud Delice by", "date_str": "2026-09-25T14:58:01+00:00", "hash": "89cef8684255ba89", "title_fa": "6 تا از بهترین عطرها برای استفاده در پاییز امسال به گفته عطرسازان حرفه ای", "summary_fa": "عطرهای تند و چوبی در پاییز امسال رواج خواهند داشت. brasovianu/Getty Images Business Insider با سه عطرساز در مورد بهترین رایحه‌های پاییز 2026 صحبت کرد. نت‌های چوبی و تند برای ماه‌های دنج پاییز عالی هستند. رایحه های میوه ای معمولاً با تابستان مرتبط هستند، اما این عطرها می توانند در پاییز امسال نیز مد شوند. پاییز رسما فرا رسیده است، به این معنی که احتمالا صندل ها را با چکمه و لباس ها را با ژاکت عوض می کنید. اما فراموش نکنید که مجموعه عطرهای خود را نیز تقویت کنید. اگر در فکر یافتن عطر و بوی خاص خود بوده اید، اکنون زمان مناسبی برای سرگردانی است. Business Insider با سه عطرساز حرفه‌ای صحبت کرد تا توصیه‌ها و راهنمایی‌های تخصصی آنها را در مورد عطر دریافت کند. از رایحه‌های کلاسیک مانند چوب صندل، وانیل و عسل گرفته تا نت‌های غیرمنتظره‌تر از موز، گل رز و برگ‌های چای، در اینجا چیزی است که کارشناسان می‌گویند باید در این فصل داشته باشید. این یک زمان عالی از سال برای عطرهای چوبی است. چوب صندل می تواند برای پاییز عالی باشد. Pawel Kacperek/Getty Images تماشای تغییر رنگ برگ ها و گذراندن وقت در کنار شومینه از تجربیات اساسی پاییز است. بنابراین منطقی است که رایحه های چوبی و خاکی در این فصل از سال پرطرفدار باشند. داریل دو، عطرساز ارشد نیویورکی در Delbia Do Fragrances Flavors، فکر می کند که چوب صندل به ویژه در این فصل بسیار بزرگ خواهد بود. بله، Nós Temos Banana، عطری از برند برزیلی Granado، یکی از عطرهای مورد علاقه Do در پاییز است. این عطر ترکیبی از چوب صندل و سدر با برگ‌های موز و انجیر است و رایحه‌ای استوایی بر روی رایحه‌های چوبی ایجاد می‌کند. اگر به دنبال چیزی سنتی خاکی تر هستید، برایسون آمونز، عطرساز ساکن نیویورک و بنیانگذار استودیوی آلیاژی، Somewhere but Nowhere توسط"}, {"source": "Business Insider", "title": "Taylor Swift's 'The Life of a Showgirl' deluxe album has 4 new songs. They range from inspired to indefensible.", "link": "https://www.businessinsider.com/taylor-swift-showgirl-encore-deluxe-album-review-tracklist-breakdown-2026-9", "summary": "Taylor Swift in a promo photo for The Life of a Showgirl: The Encore. Mert Alas Marcus Piggott; TAS Rights Management On Friday, Taylor Swift released \"The Life of a Showgirl: The Encore.\" The \"Showgirl\" deluxe edition includes four new songs that Swift wrote after the original's release. \"Patient Zero\" and \"Babylon\" are standouts, but \"Cleveland!\" is one of her worst songs to date. Precious few music critics would've said that Taylor Swift's \"The Life of a Showgirl\" needed more songs. When it was unveiled last October, Swift's 12th studio album — inspired by the joy, drama, and \"effervescence\" of the Eras Tour , Swift said at the time — received some of the most disenchanted reviews of her career. Although \"Showgirl\" became a titanic commercial success , and some reviewers praised the album as glitzy and triumphant, many said it fell short of her best work as a songwriter. Even among Swifties, the pop star's ever-devoted fan base, \"Showgirl\" is commonly considered a bottom-tier album in her two-decade oeuvre. And yet, Swift has rarely been one to back down from a challenge. Faced with both thoughtful critiques and bad-faith smear campaigns , she refused to disavow \"Showgirl.\" Instead, Swift thanked haters for giving her free promo: \"I welcome the chaos,\" she told Zane Lowe. \"The rule of show business is, if it's the first week of my album release and you are saying either my name or my album title, you're helping.\" Nearly one year later, Swift has doubled down on her sequins-are-forever era with the release of a deluxe edition, \"The Life of a Showgirl: The Encore,\" which features four brand-new songs. Although Swift previously said the \"Showgirl\" tracklist would not be extended, she was evidently struck with creative inspiration amid the album's chaotic (and record-breaking) arrival . So, she wrote more songs. Indeed, the surprise deluxe release aligns nicely with the album's relentless, theatrical ethos. As Swift sings in \" Elizabeth Taylor ,\" half-sarcastically, half-sincerely, \"You're only as hot as your last hit, baby.\" Business Insider's senior pop culture writer and resident Swift expert, Callie Ahlgrim , reviewed each of the album's new songs upon first listen . The track-by-track breakdown is below. 'Patient Zero' Taylor Swift and Dakota Johnson in the Patient Zero music video. TAS Rights Management \"Patient Zero\" is a kind of Swiftian twist on the famous \"cool girl\" monologue. In Gillian Flynn's seminal mystery novel, \"Gone Girl,\" the pathologica", "date_str": "2026-09-25T14:44:02+00:00", "hash": "6155c65490d4cbaf", "title_fa": "آلبوم لوکس The Life of a Showgirl از تیلور سوئیفت دارای 4 آهنگ جدید است. آنها از الهام گرفته تا غیرقابل دفاع متغیر هستند.", "summary_fa": "تیلور سویفت در یک عکس تبلیغاتی برای The Life of a Showgirl: The Encore. مرت افسوس مارکوس پیگوت; مدیریت حقوق TAS روز جمعه، تیلور سوئیفت \"زندگی یک دختر نمایشگر: The Encore\" را منتشر کرد. نسخه لوکس \"شوگرل\" شامل چهار آهنگ جدید است که سوئیفت پس از انتشار نسخه اصلی نوشت. \"بیمار صفر\" و \"بابل\" برجسته هستند، اما \"کلولند!\" یکی از بدترین آهنگ های او تا به امروز است. تعداد کمی از منتقدان موسیقی می‌گویند که «زندگی یک دختر نمایشی» تیلور سویفت به آهنگ‌های بیشتری نیاز دارد. سوئیفت در آن زمان گفت، هنگامی که در اکتبر گذشته رونمایی شد، دوازدهمین آلبوم استودیویی سوئیفت - که از شادی، درام و \"جوش و جوشش\" تور Eras الهام گرفته شده بود - برخی از مأیوس کننده ترین نقدهای حرفه ای خود را دریافت کرد. اگرچه \"شوگرل\" به یک موفقیت تجاری بزرگ تبدیل شد و برخی از منتقدان آلبوم را به عنوان پر زرق و برق و پیروز تحسین کردند، بسیاری گفتند که این آلبوم از بهترین کار او به عنوان یک ترانه سرا فاصله داشت. حتی در میان سوئیفتی ها، پایگاه طرفداران همیشه فداکار ستاره پاپ، «شوگرل» معمولاً به عنوان یک آلبوم سطح پایین در آثار دو دهه ای او در نظر گرفته می شود. با این حال، سوئیفت به ندرت کسی بوده است که از یک چالش عقب نشینی کند. در مواجهه با نقدهای متفکرانه و کمپین‌های بدنامی بدبینانه، او از انکار «شوگرل» خودداری کرد. در عوض، سوئیفت از افراد متنفر به خاطر ارائه تبلیغ رایگان به او تشکر کرد: او به زین لو گفت: \"من از هرج و مرج استقبال می کنم.\" \"قاعده تجارت نمایش این است که اگر هفته اول انتشار آلبوم من باشد و شما نام یا عنوان آلبومم را بگویید، دارید کمک می کنید.\" نزدیک به یک سال بعد، سوئیفت با انتشار نسخه لوکس «زندگی یک دختر نمایشگر: The"}, {"source": "Business Insider", "title": "Politicians are attacking AI with a core message: It's costing you money", "link": "https://www.businessinsider.com/what-i-learned-about-ai-pr-crisis-from-political-ads-2026-9", "summary": "AI has become a frequent talking point in US political ads. AdImpact. Artificial intelligence is the new boogeyman in political campaign ads. Both Democrats and Republicans want to own the issue and use it to undermine their opponents. The biggest argument they're driving home: AI is burning a hole in voters' wallets. Political candidates are attacking AI in ads, and they're focusing on the one thing scarier than a killer robot: a high electricity bill . Republicans, Democrats, and Independents are peddling anti-AI messaging this year, with subtle differences. The attacks pose a challenge for AI companies looking to build political support for data centers and other infrastructure projects. Business Insider reviewed 130 US political TV ads that mentioned artificial intelligence or data centers. More than AI safety or other hot-button tech issues, campaigns are mostly making noise about AI's costs, per our review of Senate, House, and gubernatorial campaign ads aired between January 2025 and last week, compiled by the ad intelligence firm AdImpact. Data centers are \"draining our water, driving up our power bills, threatening our way of life,\" Fred Simon, a Republican candidate who ran in the June 9 primary for Nevada's 2nd District, said in one ad. All of the anti-AI political ads we reviewed aired in states like Ohio, Pennsylvania, and Texas, where data centers operate, are under construction, or have been proposed. Beyond electricity price increases, the ads criticized corporate or \"billionaire\" tax breaks for AI infrastructure, as well as water and land use . Rising electric bills were frequently cited in political ads in states like Ohio where data centers are prevalent. AdImpact. \"A number of candidates are linking data center concerns to broader affordability issues,\" said Darrell West, a senior fellow at the Brookings Institution, a public policy and governance think tank. \"That makes the combination much more potent.\" No party owns AI as a wedge issue AI, as a political talking point, is still up for grabs. Neither Democrats nor Republicans have found a way to turn it into a wedge issue that they own. About 37% of the candidates represented in AdImpact's dataset were Republicans, while 47% were Democrats and 16% were Independents. The candidates' messaging often overlapped in Business Insider's review of TV ads. Regardless of party, the politicians often criticized increased electricity costs for voters, attacked incumbents who had supported data-ce", "date_str": "2026-09-25T14:42:52+00:00", "hash": "9ac6cc215f98ccb7", "title_fa": "سیاستمداران با یک پیام اصلی به هوش مصنوعی حمله می کنند: این برای شما هزینه دارد", "summary_fa": "هوش مصنوعی تبدیل به یک موضوع مکرر در تبلیغات سیاسی ایالات متحده شده است. AdImpact. هوش مصنوعی عامل جدید تبلیغات کمپین سیاسی است. هم دموکرات‌ها و هم جمهوری‌خواهان می‌خواهند صاحب این موضوع شوند و از آن برای تضعیف مخالفان خود استفاده کنند. بزرگترین بحثی که آنها به خانه می رانند: هوش مصنوعی سوراخی در کیف پول رأی دهندگان می سوزاند. نامزدهای سیاسی در تبلیغات به هوش مصنوعی حمله می‌کنند و بر روی یک چیز ترسناک‌تر از یک ربات قاتل تمرکز می‌کنند: قبض بالای برق. جمهوری‌خواهان، دموکرات‌ها و مستقل‌ها امسال پیام‌های ضد هوش مصنوعی را با تفاوت‌های ظریف عرضه می‌کنند. این حملات چالشی را برای شرکت‌های هوش مصنوعی ایجاد می‌کند که به دنبال ایجاد پشتیبانی سیاسی برای مراکز داده و سایر پروژه‌های زیرساختی هستند. Business Insider 130 آگهی تلویزیونی سیاسی ایالات متحده را بررسی کرد که به هوش مصنوعی یا مراکز داده اشاره می کرد. بر اساس بررسی ما از تبلیغات کمپین سنا، مجلس نمایندگان و فرمانداری که بین ژانویه 2025 و هفته گذشته توسط شرکت اطلاعاتی AdImpact گردآوری شده است، بیش از ایمنی هوش مصنوعی یا سایر مسائل مهم فناوری، کمپین ها عمدتاً در مورد هزینه های هوش مصنوعی سروصدا ایجاد می کنند. فرد سیمون، کاندیدای جمهوری خواه که در انتخابات مقدماتی 9 ژوئن برای ناحیه دوم نوادا شرکت کرد، در یک آگهی گفت: مراکز داده \"آب ما را تخلیه می کنند، قبض های برق ما را بالا می برند، و شیوه زندگی ما را تهدید می کنند.\" همه تبلیغات سیاسی ضد هوش مصنوعی که بررسی کردیم در ایالت هایی مانند اوهایو، پنسیلوانیا و تگزاس پخش شدند، جایی که مراکز داده در آن ها کار می کنند، در حال ساخت هستند یا پیشنهاد شده اند. فراتر از افزایش قیمت برق، این تبلیغات از معافیت‌های مالیاتی شرکت‌ها یا «میلیاردرها» برای زیرساخت‌های هوش مصنوعی و همچنین استفاده از آب و زمین انتقاد"}, {"source": "Lifehacker", "title": "Five Game-Changing Features on Garmin's Fenix 9 Pro", "link": "https://lifehacker.com/health/garmin-fenix-9-pro-best-features?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Garmin's Fenix line has long been the watch to beat in the outdoor GPS category, and the new Fenix 9 Pro checks all the right boxes. You still get excellent mapping, a durable and premium build, and strong battery life, plus a handful of quality-of-life updates that make daily use even better. Here are the five features on Garmin's latest flagship that I suddenlly find I can't live without. Garmin Fenix 9 Pro Solar 47mm Titanium GPS Smartwatch Pebble Gray Band $1,121.99 at Amazon Shop Now Shop Now $1,121.99 at Amazon Garmin Epic training summaries (aka multi-day activity grouping) Not to be confused with the older Epix product line, Garmin Epic is a new way to tell the story of a trip rather than just log it. Instead of scrolling through a pile of disconnected activities after a multi-day hike or a training block, Epic groups related sessions into a combined, shareable summary in Garmin Connect plotting everything on a color-coded map by activity type, with a rundown of health and performance stats underneath. Credit: Meredith Dietz While Epic is marketed as the place to relive your adventures, I'd argue the more useful trick is using it to zoom out and look for patterns in your training. And while the launch of Garmin Epic has been wrapped up in the debut of the Fenix 9, you don't need this particular smartwatch to use Epics in the Connect app but for now, however, the Fenix 9 is the only Garmin model that lets you start an Epic straight from the watch. Stamina curve and stamina zones to chart your endurance The Stamina Curve estimates how long you can sustain a given effort level pace for runners, power for cyclists based on your accumulated training history, and it updates continuously as your fitness shifts. Stamina Zones then turns that curve into personalized effort ranges you can pace against in real time. The mechanics are intuitive once you're observing them in action: easy efforts drain the curve slowly, near-maximal efforts burn through it fast. Tracking how that curve shifts across a training block gives you a pretty useful read on whether your endurance is trending up or down. It's less about a single number on a screen and more about considering your own fatigue trends, which is exactly the kind of feature that rewards long-term users. Tilted perspective map view and smoother zooming/panning to plan your runs Garmin has rebuilt how maps render and move on the Fenix 9 Pro. The new tilted, persp", "date_str": "2026-09-25T19:53:00+00:00", "hash": "ca82e3b5049e5d0b", "title_fa": "پنج ویژگی تغییر دهنده بازی در Fenix ​​9 Pro Garmin", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. خط Fenix ​​گارمین مدت‌هاست که در دسته GPS فضای باز پیشی گرفته است، و Fenix ​​9 Pro جدید تمام جعبه‌های مناسب را بررسی می‌کند. همچنان نقشه برداری عالی، ساخت بادوام و ممتاز، و عمر باتری قوی، به‌علاوه تعداد انگشت شماری به‌روزرسانی با کیفیت زندگی که استفاده روزانه را حتی بهتر می‌کند، دریافت می‌کنید. در اینجا پنج ویژگی جدیدترین پرچمدار گارمین وجود دارد که ناگهان متوجه شدم نمی توانم بدون آنها زندگی کنم. Garmin Fenix ​​9 Pro Solar 47mm Titanium GPS Smartwatch Pebble Grey Band 1,121.99 دلار در آمازون همین حالا خرید کنید 1121.99 دلار در خلاصه های آموزش گارمین اپیک آمازون (معروف به گروه بندی فعالیت های چند روزه) نباید با خط تولید قدیمی Epix اشتباه گرفته شود، Garmin Epic فقط یک راه جدید برای سفر به آن است. به‌جای پیمایش در میان انبوهی از فعالیت‌های قطع‌شده پس از یک پیاده‌روی چند روزه یا یک بلوک آموزشی، Epic جلسات مرتبط را در یک خلاصه ترکیبی و قابل اشتراک در Garmin Connect گروه‌بندی می‌کند که همه چیز را بر اساس نوع فعالیت روی نقشه‌ای با کد رنگی ترسیم می‌کند، با خلاصه‌ای از آمار سلامت و عملکرد در زیر. اعتبار: Meredith Dietz در حالی که Epic به عنوان مکانی برای زنده کردن ماجراهای شما به بازار عرضه می شود، من معتقدم که ترفند مفیدتر استفاده از آن برای کوچکنمایی و جستجوی الگوها در آموزش شما است. و در حالی که راه اندازی Garmin Epic در اولین معرفی Fenix ​​9 به پایان رسیده است، برای استفاده از Epics در برنامه Connect نیازی به این ساعت هوشمند خاص ندارید، اما در حال حاضر، Fenix ​​9 تنها مدل Garmin است که به شما امکان می دهد یک Epic را مستقیماً از ساعت شروع کنید. منحنی استقامت و مناطق استقامتی برای ترسیم استقامت شما منحنی"}, {"source": "Lifehacker", "title": "This Massive Paper-Like TCL Tablet Is 26% Off for October Prime Day", "link": "https://lifehacker.com/tech/tcl-nxtpaper-tablet-early-october-prime-day-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Amazon s Prime Big Deal Days are approaching, but the early deals are already live. If you're looking for a versatile Android tablet, you need not wait for the sale: TCL's NXTPAPER 14 Android tablet , which has a massive matte screen with different viewing modes for reading, streaming video, and writing, is 26% off in the lead-up to the big October Prime Day sale. TCL NXTPAPER 14 Android Tablet $349.98 at Amazon $469.99 Save $120.01 Get Deal Get Deal $349.98 at Amazon $469.99 Save $120.01 With a 14.3-inch display, the NXTPAPER 14 might not be as portable as other tablets on the market , but the screen itself is the biggest perk. The matte display has a paper-like feel and three different viewing modes: You can switch from black-and-white Ink Paper Mode to Color Paper Mode (a must for comics) to full color (for streaming video or using other full-motion apps) with the push of a button. Under harsh, direct lighting, it does an impressive job of reducing glare and reflections. It also has 8GB of RAM, 256GB of storage, and a large 10,000mAh battery. TCL claims up to 10.8 hours of video playback, though actual battery life will vary depending on use. The tablet comes with a folio-style case with a magnetic cover that doubles as a stand, a long charging cable, and a pressure-sensitive rechargeable stylus called the T-Pen, which offers 4,096 levels of pressure sensitivity. Combined with the matte texture of the display, the T-Pen creates a distinctive drag that you don t get when using an Apple Pencil on an untreated glass screen. The tablet also has a useful Edge Bar feature: Swipe inward from the edge and hold to reveal a customizable mini dock containing shortcuts and tools. The 14.3-inch display makes these productivity features particularly useful, giving you enough room to keep reference material, notes, and other apps visible at once. The NXTPAPER 14 isn't a true e-ink device; it remains a backlit LCD, so it won t provide Kindle-like battery life or outdoor visibility, but the matte screen aims to be easier on your eyes. Its 60Hz refresh rate is also less fluid than the screens on many premium tablets, and it lacks a microSD slot to expand the included 256GB of storage. Whether you re an artist, love sketching or reading comics, need to review and sign documents, or simply want a larger screen without all the bells and whistles of a ", "date_str": "2026-09-25T17:30:00+00:00", "hash": "b5097a5178fd3cd8", "title_fa": "این تبلت عظیم کاغذ مانند TCL برای اولین روز اکتبر 26 درصد تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. روزهای معاملات بزرگ آمازون نزدیک است، اما معاملات اولیه در حال حاضر فعال هستند. اگر به دنبال یک تبلت اندرویدی همه کاره هستید، لازم نیست منتظر فروش باشید: تبلت اندرویدی NXTPAPER 14 TCL، که دارای صفحه نمایش مات عظیم با حالت های مختلف مشاهده برای خواندن، پخش ویدیو و نوشتن است، در آستانه فروش بزرگ اکتبر اکتبر، 26 درصد تخفیف دارد. تبلت اندرویدی TCL NXTPAPER 14 349.98 دلار در آمازون 469.99 دلار صرفه جویی 120.01 دلار دریافت معامله دریافت معامله 349.98 دلار در آمازون 469.99 دلار صرفه جویی 120.01 دلار با نمایشگر 14.3 اینچی، NXTPAPER 14 ممکن است بزرگ‌ترین تبلت در بازار نباشد، اما ممکن است به اندازه سایر تبلت‌ها قابل حمل نباشد. صفحه نمایش مات حالت کاغذ مانندی دارد و سه حالت مختلف مشاهده دارد: می‌توانید با فشار دادن یک دکمه از حالت کاغذ جوهر سیاه و سفید به حالت کاغذ رنگی (که برای کمیک‌ها ضروری است) به حالت تمام رنگی (برای پخش ویدیو یا استفاده از سایر برنامه‌های تمام حرکتی) تغییر دهید. تحت نور شدید و مستقیم، کار چشمگیری برای کاهش تابش خیره کننده و e are minor problems, to be sure. But sometimes, it s nice to just forget you re wearing something. People are experimenting with different types of adhesives. One of the more popular is KT tape , the stuff that athletes often use to stabilize a body part that s giving them some minor trouble. You can also use athletic or medical tape. But I don t really trust any of those. I find that KT tape can start peeling off in just a day if you do a really sweaty workout and then take a shower. Maybe it s not supposed to, but it can. Longer strips of tape have plenty of adhesive to keep them on, but a small piece the size you d need for a Fitbit is going to have a harder time doing its job. The best adhesive for the job is probably a CGM overpatch. CGMs, or continuous glucose monitors, are small plastic devices that are typically stuck on the back of the upper arm. A filament pierces the skin to take readings, but to keep it safely in place, the device itself has an adhesive. You can add some security by applying a large sticker called an overpatch. These overpatches are perfect for securing a Fitbit to your arm for long-term use. A typical CGM lasts about two weeks, and the Fitbit Air s battery la", "date_str": "2026-09-25T17:01:00+00:00", "hash": "237f2c6eb7d994df", "title_fa": "من یک Fitbit را به مدت یک هفته به بازویم چسباندم و اعتراف می کنم که یک هک خوب است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. زیبایی یک بند هوشمند در این است که ساعت نیست و نیازی به عملکرد مانند آن ندارد. این شامل جایی است که شما آن را می پوشید: ووپ ایده درستی با بند دوسر بازو و لباس های هر لباسی دارد. از آنجایی که گوگل باند دوسر بازویی را برای Fitbit Air منتشر نکرده است، برخی از کاربران با نوارهای نواری کار را به دست خود می گیرند. من این روند را در زیر ردیت Fitbit Air مشاهده کردم، زیرا یکی پس از دیگری متوجه می شود که می تواند دستگاه را به بازوی خود یا هر جایی که می خواهد بچسباند. من واقعاً چنین کاری را سال‌ها پیش انجام داده‌ام، متوجه شدم که سعی می‌کنم هوپ را روی مچ le است، اما در پیش از رویداد \"Prime Big Deal Days\" آمازون، که در 6 تا 7 اکتبر برگزار می شود، می خواهم توجه شما را به طور کامل به دسته دیگری از کتابخوان های الکترونیکی معطوف کنم. دستگاه‌های جوهر الکترونیکی کوچک در اندازه کارت اعتباری، با صفحه‌نمایش‌هایی با اندازه حدود 4 اینچ، در سال 2026 بسیار محبوب هستند، و اگر شما هم می‌توانید جذابیت حمل همه کتاب‌هایتان را با دستگاهی به‌قدری کوچک ببینید که فراموش می‌کنید حتی در جیبتان است، زمان بدی نیست که وارد آن شوید: یکی از بهترین گزینه‌های X4 کلاسیک که اخیراً منتشر شده است، X1% تخفیف در بازار است، یکی از بهترین گزینه‌های X4 Classicinte در بازار است. پیش از فروش بزرگ Xteink X4 Classic Pocket E-Reader با حمایت مالی 75.99 دلاری در آمازون 89.00 دلار صرفه جویی 13.01 دلار دریافت معامله دریافت معامله 75.99 دلار در آمازون 89.00 دلار صرفه جویی 13.01 دلار Xteink یک استارت آپ چینی است که سال گذشته دستگاه خواندن الکترونیکی را تکان داد و سال گذشته با راه اندازی دستگاه فوق العاده خواندن الکترونیکی X4، عرضه شد. ویژگی ها و قابلیت استفاده با قیمت ارزان زیر 70 دلار. از آن زمان، یک جامعه آنلاین بزرگ از طرفداران در اطراف دستگاه تشکیل شده است، نکاتی را در Reddit به اشتراک می گذارد و حتی برای جمع آوری یک سیستم عامل جایگزین که بسیاری از مشکلات اولیه آن را برطرف می کند، گرد هم می آیند. Xteink به سرعت X4 را با مجموعه‌ای از دستگاه‌های دیگر، از جمله X3 حتی کوچک‌تر و X4 Pro، که نور جلو و صفحه‌نمایش لمسی را اضافه می‌کند (به قیمت"}, {"source": "Lifehacker", "title": "I Tried Google’s New Image Editor, and It Could Replace Canva and Photoshop", "link": "https://lifehacker.com/tech/googles-new-web-image-editor-could-replace-canva-and-photoshop?utm_medium=RSS", "summary": "Google launches ( and retires ) apps at a rapid rate, so it's not always easy to keep track of everything that's coming and going. One of the more recent launches we've had is Google Pics, which is now available to users subscribed to Google AI Pro ($19.99 a month) or Google AI Ultra ($99.99 or $199.99 a month). It sits alongside Google Docs, Slides, and Sheets in your Google Drive Workspace, and it's part Canva, part Photoshop: It does a bit of graphic design (like putting together an event poster), and a bit of image editing (like cutting unwanted objects out of your vacation photos), and if you're paying for one of those Google AI plans mentioned above, you might find Google Pics is the only image creation app you need. The web app incorporates the Nano Banana AI image generation model, and, as well as working as a standalone entity, will also pop up inside the other Google Workspace apps as and when you need it. Here's what you get and how it works. How to use prompts with Google Pics Google Pics is driven primarily through text prompts, whether it's creating something new from scratch or making edits to something you've made elsewhere. From the opening screen, you can type in an image prompt just as you would with the Gemini app: Prompts for anything from photorealistic scenes to printed materials will work, and the more detail you add, the better. The Style box lets you give Google Pics a reference to work from in terms of the overall image look and feel, while clicking on the Upload , Drive , or Photos links lets you load in an existing image ready for editing. At the very top is an aspect ratio drop-down, so you can specify the dimensions of new images, though this can be edited later too. You can create new images or edit existing ones. Credit: Lifehacker When you make something new, you get four or five alternatives shown as thumbnails on the left, so you can click through them to find the one you want. There's also the option to generate four more pictures from your prompt, if you don't mind the extra usage. As it often is, Google is rather vague when it comes to limits: It says \"higher access\" will be available to users until February 2027, and that factors like image resolution affect how quickly you reach the limits. So, you could prompt Google Pics like this: \"Create an A5 flyer for a 10th birthday party for Jess, happening at the village town hall at 3 p.m.-6 p.m. on Sunday, September 20. Include lots of party decorations, including balloon", "date_str": "2026-09-25T16:30:08+00:00", "hash": "7df44ce8bc4585f1", "title_fa": "من ویرایشگر تصویر جدید گوگل را امتحان کردم و می تواند جایگزین Canva و Photoshop شود", "summary_fa": "Google برنامه‌ها را با سرعتی سریع راه‌اندازی می‌کند (و بازنشسته می‌کند)، بنابراین پیگیری همه چیزهایی که می‌آیند و می‌روند همیشه آسان نیست. یکی از راه‌اندازی‌های اخیر Google Pics است که اکنون برای کاربران مشترک Google AI Pro (19.99 دلار در ماه) یا Google AI Ultra (99.99 دلار یا 199.99 دلار در ماه) در دسترس است. در کنار Google Docs، Slides و Sheets در Google Drive Workspace شما قرار دارد، و بخشی Canva، بخشی Photoshop است: کمی طراحی گرافیکی (مانند قرار دادن یک پوستر رویداد) و کمی ویرایش تصویر (مانند برش دادن اشیاء ناخواسته از عکس‌های تعطیلات خود) انجام می‌دهد و اگر برای یکی از آن برنامه‌های Google که در بالا ذکر شد پول می‌دهید، ممکن است برنامه‌ای که در بالا به آن اشاره شد Google است. این اپلیکیشن وب مدل تولید تصویر با هوش مصنوعی Nano Banana را در خود جای داده است، و علاوه بر کارکردن به عنوان یک موجودیت مستقل، در صورت نیاز و در صورت نیاز در داخل سایر برنامه‌های Google Workspace نیز ظاهر می‌شود. در اینجا آنچه دریافت می کنید و چگونه کار می کند. نحوه استفاده از درخواست‌ها با Google Pics، Google Pics عمدتاً از طریق پیام‌های متنی هدایت می‌شود، چه ایجاد چیزی جدید از ابتدا یا ویرایش چیزی که در جای دیگری انجام داده‌اید. از صفحه باز، می‌توانید مانند برنامه Gemini یک پیام تصویری را تایپ کنید: درخواست‌ها برای هر چیزی از صحنه‌های واقعی عکس گرفته تا مواد چاپی کار می‌کنند، و هر چه جزئیات بیشتری اضافه کنید، بهتر است. کادر Style به شما امکان می‌دهد به Google Pics مرجعی بدهید تا از نظر ظاهر و احساس کلی تصویر کار کند، در حالی که با کلیک کردن روی پیوندهای آپلود، درایو یا عکس‌ها می‌توانید یک تصویر موجود را که آماده ویرایش است بارگیری کنید. در بالای صفحه یک کشویی نسبت ابعاد وجود دارد، بنابراین"}, {"source": "Lifehacker", "title": "Five Ad Blocker Hacks Every Android User Should Know", "link": "https://lifehacker.com/tech/ad-blocker-hacks-every-android-user-should-know?utm_medium=RSS", "summary": "Ads are everywhere on Android. For most of us, the answer is either to sit through the ad, or pay up for a service's \"premium\" tier. While services like YouTube Premium can genuinely be worth it , they aren't for every app. Thankfully, there are options: All you need are free apps or extensions, easily available from the Play Store or alternative app stores, including one option that can block virtually all ads on Android. Use BlockAds to block all ads on Android via a local VPN Credit: Khamosh Pathak If you want a single app that blocks everything, start with the aptly named \" BlockAds .\" It s a free, open-source app you can install directly from GitHub or via the F-Droid store. It s not available on the Play Store, so the installation method will depend on where you live and when you re installing it. If Google s new rules are in place, you ll need a 24-hour cooling-off period before you can sideload apps. Once installed, activate BlockAds, giving it permission to add a VPN profile. When enabled, BlockAds will activate its own VPN profile that will stay enabled in the background. While it uses a VPN profile, it s not a VPN service like Proton VPN in the traditional sense. Instead, it s a local VPN that filters the traffic on your device itself. It uses DNS filtering to automatically block traffic to ad servers and trackers, quietly disabling them in the background. All your regular activity continues, but the annoying ads in any app disappear, without needing to root your device. There is one downside to using this method: Android only lets you enable one VPN profile at a time, so if BlockAds is taking up the VPN slot, you can t use an actual VPN to protect your internet usage or to spoof your location. Use private DNS to customize ad blocking across all apps Credit: Khamosh Pathak If you don't want to use a VPN profile, or a third-party app, DNS filtering is another path . This method blocks known advertiser domains, effectively blocking most ads you encounter on the web. Android OS comes with a built-in option that lets you change the DNS server to whatever you like, but there are also services that use DNS filtering to remove ads and trackers as you browse the internet, like AdGuard's free DNS filtering . All you have to do is change the DNS address. Go to Settings Network and Internet Private DNS and switch to the Private DNS provider hostname option, then enter the hostname. In this case, to use the free service, enter \" dns.adguard-dns.co \" and hit", "date_str": "2026-09-25T16:00:00+00:00", "hash": "08fa3d09bb34127e", "title_fa": "پنج هک Ad Blocker که هر کاربر اندرویدی باید بداند", "summary_fa": "تبلیغات در اندروید در همه جا وجود دارد. برای بسیاری از ما، پاسخ این است که یا از طریق آگهی بنشینیم، یا برای ردیف \"حق بیمه\" یک سرویس پرداخت کنیم. در حالی که خدماتی مانند YouTube Premium واقعاً می توانند ارزش آن را داشته باشند، آنها برای هر برنامه ای مناسب نیستند. خوشبختانه، گزینه‌هایی وجود دارد: تنها چیزی که نیاز دارید برنامه‌ها یا برنامه‌های افزودنی رایگان است که به راحتی از فروشگاه Play یا فروشگاه‌های برنامه جایگزین در دسترس هستند، از جمله گزینه‌ای که می‌تواند تقریباً همه تبلیغات را در اندروید مسدود کند. از BlockAds برای مسدود کردن همه تبلیغات در Android از طریق اعتبار VPN محلی استفاده کنید: Khamosh Pathak اگر یک برنامه واحد می‌خواهید که همه چیز را مسدود کند، با نام مناسب «BlockAds» شروع کنید. این یک برنامه رایگان و منبع باز است که می توانید آن را مستقیماً از GitHub یا از طریق فروشگاه F-Droid نصب کنید. در فروشگاه Play در دسترس نیست، بنابراین روش نصب به محل زندگی شما و زمان نصب آن بستگی دارد. اگر قوانین جدید Google اعمال شود، قبل از اینکه بتوانید برنامه‌ها را بارگذاری کنید، به یک دوره خنک‌سازی 24 ساعته نیاز دارید. پس از نصب، BlockAds را فعال کنید و به آن اجازه دهید یک نمایه VPN اضافه کند. وقتی فعال شود، BlockAds نمایه VPN خود را فعال می کند که در پس زمینه فعال می ماند. در حالی که از نمایه VPN استفاده می کند، به معنای سنتی یک سرویس VPN مانند Proton VPN نیست. در عوض، این یک VPN محلی است که ترافیک روی دستگاه شما را فیلتر می کند. از فیلتر DNS برای مسدود کردن خودکار ترافیک سرورها و ردیاب‌های تبلیغاتی استفاده می‌کند و بی‌صدا آنها را در پس‌زمینه غیرفعال می‌کند. تمام فعالیت های منظم شما ادامه می یابد، اما تبلیغات مزاحم در هر برنامه ای بدون"}, {"source": "Lifehacker", "title": "I Tried Snap Specs, and They Could Be the Future of Smart Glasses", "link": "https://lifehacker.com/tech/i-tried-snap-specs-they-could-be-the-future-of-smart-glasses?utm_medium=RSS", "summary": "Snap was in the smart glasses game from the jump. The company s original camera-equipped Spectacles debuted back in 2016, beating Meta to the market by five years. Meta s Ray-Bans and Oakleys captured massive consumer mindshare anyway, while Snap s smart eyewear has been less visible. With Snap Specs , though, the company is aiming to make up for lost time by delivering smart glasses that go beyond a hidden camera and voice-activated AI. At the Snapdragon 2026 Summit, I got my hands (and eyes) on a pair of Snap s soon-to-be-released spatial-computing glasses that overlay digital graphics onto the physical world. Specs are heavy on tech but light on your face Credit: Stephen Johnson There's a lot of tech packed into these black polymer frames. They're powered by two Snapdragon processors, with two full-color hi-res cameras facing outward; the tracking system supports 6DOF (six degrees of freedom) hand tracking for gesture controls; and it's all standalone, as there's no tether or wired puck handling the heavy lifting. With all that crammed into the frames, plus the battery to run it, you'd expect them to be heavy. At around 135 grams, they aren t light, but Specs are surprisingly comfortable. The weight is distributed evenly, mainly across the frames, so for the brief time I used them, they remained ergonomically acceptable. Specs feel more like a pair of sunglasses than a bulky VR helmet. As for battery life, Snap promises four hours of mixed-use on a full charge. Display quality on Snap Specs In the interest of not alienating the people around you, Snap chose to make the lenses clear enough that your eyes can still be seen through them, but if you want to close out the world, there s electrochromic dimming for quick transitions between clear and dark lenses. It both useful and a cool trick. Check it out: Credit: Stephen Johnson The in-glasses display is surprisingly bright. Specs' visuals are powered by a proprietary liquid crystal on silicon (LCoS) display system, and even when used in a light-filled conference room, I could still clearly see the UI and its various apps. I tested out YouTube under these borderline abusive conditions, and it streamed high-def video in 16 million colors suitably. The display offers a 51-degree field of view. It feels like having a large floating window hovering in front of you. From there, you can use simple gestures to launch apps, watch movies, play games, and do most other tasks you can t do from your phone. But it was ", "date_str": "2026-09-25T15:30:00+00:00", "hash": "ca1a645b09a0f267", "title_fa": "من مشخصات Snap را امتحان کردم، و آنها می توانند آینده عینک های هوشمند باشند", "summary_fa": "اسنپ ​​در بازی عینک هوشمند از جامپ بود. عینک مجهز به دوربین اصلی این شرکت در سال 2016 شروع به کار کرد و متا را به مدت پنج سال در بازار شکست داد. Ray-Bans و Oakleys متا به هر حال نظر مصرف کنندگان را جلب کردند، در حالی که عینک هوشمند اسنپ کمتر دیده می شود. با این حال، با مشخصات اسنپ، این شرکت قصد دارد با ارائه عینک های هوشمندی که فراتر از دوربین مخفی و هوش مصنوعی فعال با صدا هستند، زمان از دست رفته را جبران کند. در اجلاس Snapdragon 2026، من دست (و چشم) به یک جفت عینک محاسبات فضایی Snap که قرار است به زودی منتشر شود، گرفتم که گرافیک دیجیتال را روی دنیای فیزیکی می پوشاند. مشخصات فنی بسیار سنگین است، اما روی چهره شما سبک است اعتبار: استفان جانسون در این قاب‌های پلیمری مشکی، فناوری‌های زیادی گنجانده شده است. آنها توسط دو پردازنده اسنپدراگون، با دو دوربین تمام رنگی با وضوح بالا که رو به بیرون هستند، قدرت می‌گیرند. سیستم ردیابی از ردیابی دستی 6DOF (شش درجه آزادی) برای کنترل های اشاره پشتیبانی می کند. و همه اینها مستقل است، زیرا هیچ بند یا بند سیمی برای حمل سنگین وجود ندارد. با تمام آن‌هایی که در قاب‌ها جمع شده‌اند، به‌علاوه باتری برای کارکرد آن، انتظار دارید سنگین باشند. در حدود 135 گرم، آنها سبک نیستند، اما مشخصات آن به طرز شگفت آوری راحت است. وزن به طور مساوی توزیع می شود، عمدتا در سراسر فریم، بنابراین برای مدت کوتاهی که من از آنها استفاده کردم، آنها از نظر ارگونومی قابل قبول باقی ماندند. مشخصات بیشتر شبیه یک عینک آفتابی است تا یک کلاه VR حجیم. در مورد عمر باتری، اسنپ وعده چهار ساعت استفاده ترکیبی با شارژ کامل را می دهد. کیفیت نمایش در مشخصات اسنپ برای اینکه افراد اطرافتان را از خود"}, {"source": "Lifehacker", "title": "These Are the Best October Prime Day Deals on Tools", "link": "https://lifehacker.com/home/these-are-the-best-early-prime-big-deals-on-tools?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. If you need to tackle some DIY projects this fall, you might be looking to beef up your DIY tool kit. But if you ve looked for tools recently, you may have also noticed that getting quality tools that will last can be expensive. Here are some deals on some of my favorite tools ahead of Amazon s Big Deal Days sale. Best Prime Day 2026 deals on tool sets If you re just starting out on your DIY adventure, beginning with a tool set will give you a solid foundation. Here are some deals on quality tools that will be with you for years to come. The DeWalt 20-volt oscillating multitool set is on sale for $157, 47% off its regular price. The set comes with the multitool, a 2-amp-hour battery, a charger, three starter blades, a sanding attachment, and some sandpaper. This tool can be used to cut metal, wood, plaster, drywall, PVC, and tile, and you can also use it for sanding and polishing. It s a good deal for expanding your existing DeWalt set or if you re just starting out with DIY projects. The DeWalt 192-piece mechanic s tool set is on sale for $169.94, 41% off its usual price. This set comes with &frac12;-inch, -inch, and &frac14;-inch ratchets, sockets in SAE and metric sizes, a set of spark plug sockets, driver bits, a set of hex wrenches, and adapters. This is a full tool set that will allow you to work on cars, as well as do maintenance on small home appliances like changing filters and replacing hoses. The Craftsman 10-piece mechanics tool set is on sale for $14.99, 51% off its typical price. The set comes with a -inch ratchet and nine metric sockets. This compact set is good for most beginner DIY projects and can be used for light vehicle maintenance; it's also perfect for an emergency roadside kit. DEWALT Mechanics Tool Set $169.94 at Amazon $289.99 Save $120.05 Get Deal Get Deal $169.94 at Amazon $289.99 Save $120.05 Best Prime Day 2026 deals on cutting and shaping tools Saws are essential for many DIY projects, like repairing fencing or building shelves, and they re also excellent for yard work and demolition. Having the right tools for making precision cuts will make your projects go more smoothly. Here are some deals on saws for all your DIY needs. The DeWalt 7 &frac14;-inch cordless compound miter saw is on sale for $296.65, 20% off its regular price. This is a tool-only deal, so you ll need a DeWalt 20-volt battery and charg", "date_str": "2026-09-25T15:00:06+00:00", "hash": "d203225de0ccc21c", "title_fa": "اینها بهترین معاملات روز اول اکتبر در مورد ابزارها هستند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اگر در پاییز امسال نیاز به انجام برخی پروژه های DIY دارید، ممکن است به دنبال تقویت کیت ابزار DIY خود باشید. اما اگر اخیراً به دنبال ابزاری بوده اید، ممکن است متوجه شده باشید که تهیه ابزارهای باکیفیت و ماندگار می تواند گران باشد. در اینجا چند معامله در مورد برخی از ابزارهای مورد علاقه من قبل از فروش Big Deal Days در آمازون آورده شده است. بهترین معاملات Prime Day 2026 در مجموعه ابزارها اگر به تازگی ماجراجویی خود را شروع کرده اید، شروع با مجموعه ابزار پایه محکمی به شما می دهد. در اینجا برخی از معاملات در مورد ابزارهای با کیفیت وجود دارد که برای سال های آینده با شما خواهد بود. مجموعه چند ابزار نوسانی 20 ولتی DeWalt با قیمت 157 دلار، 47 درصد تخفیف از قیمت معمولی خود به فروش می رسد. این مجموعه با چند ابزار، یک باتری 2 آمپر ساعتی، یک شارژر، سه تیغه استارت، یک چسب سنباده و مقداری کاغذ سنباده ارائه می شود. از این ابزار می توان برای برش فلز، چوب، گچ، دیوار خشک، پی وی سی و کاشی استفاده کرد و همچنین می توانید از آن برای سمباده و پرداخت استفاده کنید. این یک معامله خوب برای گسترش مجموعه DeWalt موجود شما است یا اگر به تازگی با پروژه های DIY شروع کرده اید. مجموعه ابزار مکانیک 192 تکه DeWalt با قیمت 169.94 دلار به فروش می رسد که 41 درصد از قیمت معمول خود تخفیف دارد. این مجموعه دارای جغجغه های ½ اینچ، و ¼ اینچی، سوکت های SAE و اندازه های متریک، مجموعه ای از سوکت های شمع، بیت های درایور، مجموعه ای از آچار شش گوش و آداپتور می باشد."}],
      media: [{"source": "Billboard", "title": "‘JAŸ-Z in 8’: 4 Things We Learned From Episode Four", "link": "https://www.billboard.com/lists/jay-z-in-8-review-episode-four-rick-rubin-hbo-max/", "summary": "JAŸ-Z in 8 is four episodes in and has been insightful so far. We covered the first three episodes after an exclusive screening a few weeks back on Sept. 13 — and on the red carpet, JAŸ-Z told Billboard that none of the conversations he had were difficult, even when he dug deeper into the some of the feelings he had when making some of his most emotional records. Take a song like You Must Love Me, which he covered in the third episode for instance, when he rapped early on in his career about the guilt and shame he felt when he notoriously shot his brother in his shoulder, and the collateral damage he caused when dealing drugs. It s always been a song that his core fanbase has revered — and he spoke on how the booth became therapeutic for an introvert such as himself. In there, he can say things that he would never say in a conversation with other people. That In My Lifetime, Vol. 1 track is one of his rawest songs to date. I use that as an example to intro our takeaways from episode four because he and Rick Rubin start this one off with Where Have You Been, a song featuring Philadelphia rapper Beanie Sigel, where the two of them give one of the most heart-wrenching performances ever recorded on wax as they rap about the traumatic experience they had growing up without their fathers around. As Jay and Rick broke this song down, the Brooklyn MC revealed that he eventually made amends with his pops, only to lose him about a month later. It s truly a sad set of circumstances, and gives insight into an artist who has been known for keeping certain feelings close his vest. The rest of the episode took on a lighter note, though, as Jigga talked about his studio habits and process, the Best Rapper Alive convos people were having during his In My Lifetime, Vol. 1 era, and the now-iconic look of him wearing a bulletproof vest over a white t-shirt while wearing a Rolex. Check out the four key takeaways we had from JAŸ-Z in 8 s fourth episode below.", "date_str": "2026-09-26T14:00:00+00:00", "hash": "7639aabf5253cb2d", "title_fa": "«JAŸ-Z در 8»: 4 چیزهایی که از قسمت چهارم یاد گرفتیم", "summary_fa": "JAŸ-Z در 8 چهار قسمت است و تا کنون روشنگر بوده است. ما سه قسمت اول را پس از یک نمایش انحصاری چند هفته پیش در 13 سپتامبر پوشش دادیم - و روی فرش قرمز، JAŸ-Z به بیلبورد گفت که هیچ یک از مکالماتی که انجام داده دشوار نبوده است، حتی زمانی که او در برخی از احساساتی که در هنگام ساخت برخی از احساسی ترین رکوردهایش داشت، عمیق تر کاوش کرد. آهنگی مثل You Must Love Me را در نظر بگیرید، که او در قسمت سوم آن را به عنوان مثال، زمانی که در اوایل کارش در مورد گناه و شرمی که هنگام شلیک بدنام به برادرش به شانه‌اش احساس می‌کرد و آسیب‌های جانبی که هنگام خرید و فروش مواد مخدر ایجاد کرد، رپ کرد. این همیشه آهنگی بود که طرفداران اصلی او به آن احترام می گذاشتند - و او در مورد اینکه چگونه غرفه برای فردی درون گرا مانند خودش درمانی شد صحبت کرد. در آنجا می تواند چیزهایی بگوید که هرگز در گفتگو با افراد دیگر نمی گوید. That In My Lifetime, Vol. 1 آهنگ یکی از بهترین آهنگ های او تا به امروز است. من از آن به عنوان مثالی برای معرفی مطالب اولیه خود از قسمت چهارم استفاده می‌کنم، زیرا او و ریک روبین این آهنگ را با Where Have You Been شروع می‌کنند، آهنگی با حضور خواننده رپ فیلادلفیا، Beanie Sigel، که در آن دو نفر یکی از دلخراش‌ترین اجراهای ضبط شده روی موم را اجرا می‌کنند، در حالی که درباره تجربه دردناک پدری که در اطرافشان بزرگ شده‌اند رپ می‌کنند. همانطور که جی و ریک این آهنگ را شکستند، بروکلین ام سی فاش کرد که او در نهایت با پاپ هایش جبران کرد، اما حدود یک ماه بعد او را از دست داد. این واقعاً مجموعه‌ای از شرایط غم‌انگیز است و بینشی"}, {"source": "Billboard", "title": "Where to Watch the 2026 Texas vs. Tennessee College Football Game Free Online", "link": "https://www.billboard.com/culture/product-recommendations/where-to-watch-texas-vs-tennessee-2026-free-online-1236348047/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. It’s a clash between two undefeated SEC teams as the Texas Longhorns and Tennessee Volunteers meet Saturday, Sept. 26, at Neyland Stadium in Knoxville during the NCAA 2026-2027 college football season . The game kicks off at noon ET and airs live on ABC. Without cable, fans can stream ABC through DirecTV , Hulu + Live TV or Fubo , all offering free trials for eligible subscribers. Sling also carries ABC, though it does not offer a free trial. stream Texas vs. Tennessee free with directv 5-day trial The No. 1 Texas Longhorns and No. 14 Tennessee Volunteers enter this SEC matchup unbeaten at 3-0. The Longhorns, led by quarterback Arch Manning, started the college football season with wins against Texas State, Ohio State, and UTSA. The Volunteers, also called the Vols, have beaten Furman, Georgia Tech and Kennesaw State so far in the season. Texas leads the all-time series 2-1, but the schools have met only three times, all in bowl games . This Saturday marks their first regular-season meeting in a series that dates back to 1951. At a Glance: Where to Watch Texas vs. Tennessee College Football Game Free Online Date time: The game kicks off on Saturday, Sept. 26 at 12:00 p.m. ET TV Channel: ABC Stream online: You can stream ABC through DirecTV , Hulu + Live TV or Fubo , with each currently offering a free trial for eligible subscribers. Sling also offers ABC but does not have a traditional free trial. The game at Neyland Stadium is sold out and expected to draw plenty of attention. No. 1 Texas is making its first visit to the Knoxville stadium, while No. 14 Tennessee opens SEC play at home. Texas is currently favored by around 4 to 5.5 points, depending on the sportsbook, but overall prediction models are split. Some give Texas the
