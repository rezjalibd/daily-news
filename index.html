یرند که چگونه به طور مؤثر و متقاعدکننده صحبت کنند، و یاد بگیرند که چگونه خوب بنویسند. بنیانگذار غول سهام خصوصی Carlyle همچنین گفت: \"چیزی را پیدا کنید که واقعاً از آن لذت ببرید و آن را به کار زندگی خود تبدیل کنید.\" او ادامه داد: «اگر واقعاً از چیزی لذت می‌برید، کار درستی نیست و در آن خیلی بهتر عمل خواهید کرد.» \"هیچ کس از کاری که انجام می دهد نفرت برنده جایزه نوبل نشده است.\" روبنشتاین، 77 ساله، اذعان کرد که افراد بیشتری برای خواندن و نوشتن به چت ربات‌های هوش مصنوعی متکی هستند، اما او گفت که توانایی تشخیص نوشتن خوب و بد همچنان مهم خواهد بود. او می‌گوید: «فقط فکر می‌کنم مهارت‌های اساسی که باعث شده افراد در چند هزار سال گذشته موفق شوند، احتمالاً از بین نمی‌روند.» روبنشتاین پیش از انتشار آخرین کتاب خود در این هفته با BI صحبت کرد: «در جعبه مالک: گفتگوهایی درباره قدرت و رهبری در ورزش». دستور العمل برای موفقیت مالک اصلی تیم بیسبال بالتیمور اوریولز نیز بینش هایی از زندگی شخصی خود به"}, {"source": "Business Insider", "title": "A former BCG partner says leaving consulting taught him how to build", "link": "https://www.businessinsider.com/bcg-partner-to-juul-skan-tech-consulting-transition-2026-9", "summary": "Daniel Dantus is a former BCG consultant who pivoted into tech. CMAND Daniel Dantus spent over eight years at BCG after graduating from the University of Michigan in 2011. He later moved to Juul and now works at Skan AI, a platform for observing AI agent behavior. \"If a job does not work out the way you thought, you can always get another one\",\" he says This is an as-told-to conversation with Daniel Dantus, a former BCG partner who's now a senior vice president at Skan AI, a startup that analyzes how work happens across a company. This conversation has been condensed and edited for clarity. I came into consulting as an undergraduate at the University of Michigan's business school. I joined a student consulting club and landed at Boston Consulting Group in Chicago, first as an intern, and then full time. What was special about BCG was that you were given a lot of rope from day one. My first week was training. By the second, I was on a manufacturing floor working with a large food-and-beverage company. We flew to Dallas and Mexico and visited plants. I was 20 years old. I was learning to enter new environments, build relationships, and have an impact. I was at BCG for a total of eight years. For the first six, every project involved a different client, city, and team. Firms recommend continuity, but I loved diving into new things. I did operations work in manufacturing and supply chain, as well as in financial services. Later, after I moved to San Francisco, I worked in tech, focusing on sales and product strategy. When I was promoted to project leader, my work shifted from delivering work to figuring out where I was going to build a business. I realized I wanted to keep learning and building products, which consulting projects generally do not allow over the long term. So I took some transition time from the firm, which is paid time to take a breather and find the next thing. I made a list of companies I thought might be interesting and people I knew who might be worth talking to. I had about 100 conversations. Job searches are a numbers game, like sales. If you want to sell to 10 customers, you'd better start talking to 200. That process led me to Harbor Freight Tools, a tool and equipment retailer, as the Director of Marketing, right after BCG. The mandate was to build out the company's digital marketing capability. It was my first \"real job\" after consulting, and I wasn't sure how learning to build PowerPoints would translate into delivering results. Sti", "date_str": "2026-09-27T09:31:01+00:00", "hash": "54dd52611f3173d9", "title_fa": "یکی از شرکای سابق BCG می گوید که ترک مشاوره به او یاد داد که چگونه بسازد", "summary_fa": "دانیل دانتوس مشاور سابق BCG است که در حوزه فناوری فعالیت می‌کند. CMAND دانیل دانتوس پس از فارغ التحصیلی از دانشگاه میشیگان در سال 2011، بیش از هشت سال را در BCG گذراند. او بعداً به Juul نقل مکان کرد و اکنون در Skan AI، پلتفرمی برای مشاهده رفتار عامل هوش مصنوعی، کار می کند. او می‌گوید: «اگر شغلی آنطور که فکر می‌کردید پیش نرود، همیشه می‌توانید شغل دیگری داشته باشید.» این گفتگوی گفته شده با دانیل دانتوس، شریک سابق BCG است که اکنون معاون ارشد در Skan AI است، استارت‌آپی که نحوه انجام کار در یک شرکت را تجزیه و تحلیل می‌کند. این مکالمه برای شفاف‌تر شدن موضوع فشرده شده و ویرایش شده است. من به یک باشگاه مشاوره دانشجویی پیوستم و ابتدا به عنوان کارآموز و سپس به صورت تمام وقت در گروه مشاوره بوستون در شیکاگو فرود آمدم. نکته خاص در مورد BCG این بود که از روز اول طناب زیادی به شما داده شد. هفته اول تمرینم بود. در مرحله دوم، من در یک طبقه تولید بودم که با یک شرکت بزرگ غذا و نوشیدنی کار می کردم. ما به دالاس و مکزیک پرواز کردیم و از گیاهان دیدن کردیم. من 20 ساله بودم. داشتم یاد می گرفتم که وارد محیط های جدید شوم، روابط برقرار کنم و تأثیر بگذارم. من در مجموع هشت سال در BCG بودم. برای شش مورد اول، هر پروژه شامل مشتری، شهر و تیم متفاوتی بود. شرکت ها تداوم را توصیه می کنند، اما من عاشق غواصی در چیزهای جدید بودم. من کارهای عملیاتی در تولید و زنجیره تامین و همچنین در خدمات مالی انجام دادم. بعدها، پس از نقل مکان به سانفرانسیسکو، در زمینه فناوری کار کردم و بر استراتژی فروش و محصول تمرکز کردم. زمانی که به رهبری پروژه ارتقاء یافتم، کار من از ارائه کار به یافتن جایی"}, {"source": "Business Insider", "title": "They couldn't afford nursing homes for their parents. They built them a tiny home instead.", "link": "https://www.businessinsider.com/tiny-house-adu-caregiving-retirement-multigenerational-living-medicare-senior-living-2026-9", "summary": "Jimmy Barton lives in a tiny home purchased by Justin Barton and daughter-in-law Linda Barton. Joseph Bui for BI ADUs are popular for multigenerational living, offering affordable alternatives to nursing homes. Building ADUs can be complex and costly, but they provide family support and community proximity. \"Having everyone on the same property is enormously valuable,\" one source told Business Insider. Over the last few years, Linda Barton watched as her mom and stepdad progressively shifted from active 80-year-olds to, in her words, \"children.\" Her mom with dementia became unable to take care of herself, while her stepfather, whose health has also declined, \"acts like he's 6 years old.\" The commute to see them, which was an hour each way from work, wore her down, and she didn't want them to move in with her because of space constraints. She did the next best thing: move them into her yard. Linda Barton and her husband bought two tiny homes for their three living parents. Joseph Bui for BI Barton, 55, and her husband bought a tiny home for $37,000 in their part of Texas, outside Houston. After months of installing a septic system, an electrical line, an entrance ramp, and indoor essentials, her parents moved in. A year later, they purchased another tiny home for her father-in-law on their property for $43,000. They've hired caregivers for their three parents at rates below assisted living, making caregiving more manageable. Still, it's not a perfect solution. Barton said she's \"drowning\" in caregiving bills because neither Medicare nor hospice has provided much financial relief. Linda Barton said the arrangement has worked well for her and her parents. Joseph Bui for BI \"If we don't pay for caregivers, we end up sacrificing work when they need something,\" Barton said. \"It's exhausting, and we fear we won't live to see our own retirement due to the stress.\" Caregiving costs have skyrocketed in recent years. Instead of emptying their wallets to pay for pricy rooms in nursing homes, Americans like Barton are building tiny houses, renovating sheds, and buying trailers as housing options for their aging loved ones who need full-time care. Are you paying for your own or your loved one's long-term care? Do you have thoughts to share about long-term care in the US? To share your story with a reporter, please fill out this quick form . With construction costs typically ranging from $100,000 to $300,000, not including expenses such as hiring an architect, setting up", "date_str": "2026-09-27T09:01:01+00:00", "hash": "88b710590cda49f2", "title_fa": "آنها نمی توانستند برای والدین خود خانه سالمندان بخرند. آنها در عوض برای آنها خانه کوچکی ساختند.", "summary_fa": "جیمی بارتون در خانه کوچکی زندگی می کند که توسط جاستین بارتون و عروسش لیندا بارتون خریداری شده است. Joseph Bui for BI ADUs برای زندگی چند نسلی محبوب هستند و جایگزین های مقرون به صرفه ای برای خانه های سالمندان ارائه می دهند. ساخت ADU ها می تواند پیچیده و پرهزینه باشد، اما حمایت خانواده و نزدیکی به جامعه را فراهم می کند. یکی از منابع به Business Insider گفت: «داشتن همه افراد در یک ملک بسیار ارزشمند است. در چند سال گذشته، لیندا بارتون شاهد بود که مادر و پدر ناتنی‌اش به تدریج از افراد فعال 80 ساله به «کودکان» تغییر می‌کردند. مادر او که دچار زوال عقل بود قادر به مراقبت از خود نبود، در حالی که ناپدری او که وضعیت سلامتی او نیز رو به افول است، \"انگار 6 ساله است.\" رفت و آمد برای دیدن آنها که یک ساعت از محل کار فاصله داشت، او را خسته کرد و به دلیل محدودیت فضا نمی خواست آنها با او نقل مکان کنند. او بهترین کار بعدی را انجام داد: آنها را به حیاط خانه اش منتقل کرد. لیندا بارتون و همسرش دو خانه کوچک برای سه والدین خود خریدند. جوزف بوی برای بی‌آی بارتون، 55 ساله، و شوهرش خانه‌ای کوچک به قیمت 37000 دلار در منطقه خود در تگزاس، خارج از هیوستون خریدند. پس از ماه‌ها نصب یک سیستم سپتیک، یک خط برق، یک رمپ ورودی و وسایل ضروری داخل خانه، والدین او به آنجا نقل مکان کردند. یک سال بعد، آنها خانه کوچک دیگری را برای پدرشوهرش در ملک خود به قیمت 43000 دلار خریداری کردند. آن‌ها برای سه والدین خود مراقبانی را با نرخ‌های پایین‌تر از زندگی کمکی استخدام کرده‌اند و این امر مراقبت را قابل کنترل‌تر می‌کند. با این حال، این یک راه حل کامل نیست. بارتون گفت که او در صورت‌حساب‌های مراقبتی"}, {"source": "Business Insider", "title": "How financial advisors keep doomer clients from blowing up their portfolios", "link": "https://www.businessinsider.com/how-financial-advisors-keep-doomers-from-blowing-up-their-portfolios-2026-9", "summary": "Mike Kemp/In Pictures via Getty Images Images As AI, geopolitical, and economic doom dominate the mood, it's impacting how people invest. Financial advisors don't want their clients investing like it's the end times. They told us how they ground their clients' fears while still protecting their portfolio. We're in a golden age for apocalyptic thinking. The threat of AI has taken center stage , but there are omens anywhere you're motivated to look: countries trading ballistic missile fire, ballooning national debt, soaring energy prices, and, of course, that old standby, the climate crisis. It's no surprise, then, that Gabriel Shahin, founder of private wealth advisor Falcon Wealth Planning, has seen the steady increase in doomerism among his clients since the COVID shutdown reach new heights this year. Now, Shahin's firm is spending more time than ever protecting its clients from making financial decisions based on fear rather than logic. \"Our job is such a bizarre job,\" Shahin said, adding that sometimes being a certified financial planner isn't enough. \"We need PhDs, or PsyDs, to be working at Falcon because that's what we do.\" Finding a way to steer clients away from their apocalyptic visions while also protecting them against very rational fears is a balancing act for financial planners. Dhruv Maniktala, chief investment officer for True North Advisors, told Business Insider that it's important to find a middle ground between \"protecting against 'doom,'\" and giving up on the upside that comes with keeping your money in the market. \"I think doomerism exists, but if you are wrong for 5 years, even if you are ultimately right after that, you are so far behind that it's impossible to catch up,\" Maniktala said. Understanding doom It's much easier to imagine a future \"catastrophe\" than \"joy,\" said Dr. Daniel Crosby, chief behavioral officer at Orion Advisor Solutions. Psychologists call this the \"negativity bias.\" \"It served our ancestors well when survival depended on noticing threats,\" he said. \"It serves modern investors poorly when financial media outlets compete daily to feed exactly this instinct.\" So, when a client comes in expressing concern over incoming doom, Rick Nott, a senior managing director at Angeles Wealth Management, tries to understand the \"one emotion, above all, that is being communicated\": fear. The role of a financial planner, he said, is to understand and respond to people's financial emotions. \"I view my job as grounding someone's g", "date_str": "2026-09-27T09:00:03+00:00", "hash": "77dedeb1a7be9d0b", "title_fa": "چگونه مشاوران مالی باعث می‌شوند که مشتریان محکوم به شکست پرتفوی‌هایشان نباشند", "summary_fa": "مایک کمپ/در تصاویر از طریق تصاویر گتی ایماژ از آنجایی که هوش مصنوعی، ژئوپلیتیک، و نابودی اقتصادی بر روحیه حاکم است، بر نحوه سرمایه گذاری مردم تأثیر می گذارد. مشاوران مالی نمی‌خواهند مشتریانشان مثل آخرالزمان سرمایه‌گذاری کنند. آنها به ما گفتند که چگونه ترس مشتریان خود را ریشه کن می کنند در حالی که همچنان از مجموعه خود محافظت می کنند. ما در عصر طلایی برای تفکر آخرالزمانی هستیم. تهدید هوش مصنوعی در کانون توجه قرار گرفته است، اما به هرجایی که انگیزه آن را داشته باشید، نشانه هایی وجود دارد: کشورهایی که با شلیک موشک های بالستیک معامله می کنند، بدهی های ملی بالون، افزایش قیمت انرژی، و البته، آن آماده باش قدیمی، بحران آب و هوا. پس جای تعجب نیست که گابریل شاهین، بنیانگذار مشاور ثروت خصوصی Falcon Wealth Planning، از زمانی که تعطیلی کووید در سال جاری به اوج های جدیدی رسیده است، شاهد افزایش مستمر رکود در میان مشتریان خود بوده است. اکنون، شرکت شاهین بیش از هر زمان دیگری زمان صرف می کند تا از مشتریان خود در برابر تصمیم گیری های مالی بر اساس ترس و نه بر اساس منطق محافظت کند. شاهین گفت: \"شغل ما شغل عجیبی است.\" ما برای کار در فالکون به دکترا یا PsyD نیاز داریم زیرا این کاری است که ما انجام می دهیم.\" یافتن راهی برای دور کردن مشتریان از دیدگاه های آخرالزمانی آنها و همچنین محافظت از آنها در برابر ترس های بسیار منطقی یک اقدام متعادل کننده برای برنامه ریزان مالی است. Dhruv Maniktala، مدیر ارشد سرمایه‌گذاری True North Advisors، به Business Insider گفت که یافتن حد وسطی بین \"محافظت در برابر \"عذاب\" و کنار گذاشتن چیزهای مثبتی که با نگه داشتن پول شما در بازار حاصل می‌شود، مهم است. مانیکتالا گفت: «من فکر می‌کنم مصیبت‌گرایی وجود دارد، اما اگر به مدت 5 سال در اشتباه"}, {"source": "Business Insider", "title": "My husband and I work full-time but had to borrow money to pay for my dad's cremation", "link": "https://www.businessinsider.com/death-cremation-cost-debt-borrow-money-2026-9", "summary": "Heather Waughtel s father died in 2026. Courtesy of Heather Waughtel When Heather Waughtel's dad died, a family friend covered the cremation after her card was declined. Waughtel and her husband both work full-time, but live paycheck to paycheck. \"We're barely making enough to live. How can we afford for someone to die?\" she said. This as-told-to essay is based on a conversation with Heather Waughtel, 47, a project coordinator based in Knoxville, Tennessee. Business Insider has verified her income and her dad's funeral costs. It has been edited for length and clarity. Before my dad died, I felt we had been responsible by discussing things like finances and the power of attorney. Dad had life insurance and said the cremation would be covered. I soon learned that when a loved one dies in the US, you must deal with financial and legal questions while in the rawest stage of grief. Did you take on debt or make major financial sacrifices after losing a loved one? Business Insider would like to hear from you for a series about the cost of dying. Please fill out this quick form. Dad died in July, at age 71. About two days later, a family friend and I called credit card companies, insurers, and the bank to close out Dad's accounts. That was how we discovered the life insurance policy had been cashed out. There was also no inheritance : Dad's estate was small and insolvent, with some credit card debt. My husband and I both work full-time — I'm a project coordinator and he's a painter for a boat repair shop — but we still live paycheck to paycheck and our finances are always a concern. Sometimes, we have to choose between buying food and gas to get to work. We had no way to pay for Dad's cremation, so a family friend loaned us the money. I didn't feel I had any other choice. My dad died sooner than we expected In the early 2000s, Dad transitioned and began identifying as a woman. She thought everyone would be upset, but I respected her so much for coming out and being open and honest about who she was. It was a major, positive turning point in our relationship after years of estrangement, and we remained close until the end of her life. Heather Waughtel s dad, who transitioned in the early 2000s, had a lung condition in her final years. Courtesy of Heather Waughtel Her death didn't come as a total surprise, although it happened a little sooner than we expected. In the final years of her life, she had COPD and a chronic lung infection, and often struggled to breathe. ", "date_str": "2026-09-27T09:00:02+00:00", "hash": "36db96ea20ea527e", "title_fa": "من و شوهرم تمام وقت کار می کنیم، اما مجبور شدیم پول قرض کنیم تا هزینه سوزاندن پدرم را بپردازم", "summary_fa": "پدر هدر واتل در سال 2026 درگذشت. با اجازه هدر واتل هنگامی که پدر هدر واتل درگذشت، یکی از دوستان خانواده پس از رد شدن کارت او، مراسم سوزاندن او را پوشاند. واتل و همسرش هر دو به صورت تمام وقت کار می کنند، اما از حقوق و دستمزد به حقوق خود زندگی می کنند. ما به سختی به اندازه کافی زندگی می کنیم. او گفت. این مقاله همانطور که گفته شد بر اساس گفتگو با هدر واتل، 47 ساله، هماهنگ کننده پروژه مستقر در ناکسویل، تنسی است. Business Insider درآمد او و هزینه های خاکسپاری پدرش را تأیید کرده است. برای طول و وضوح ویرایش شده است. قبل از اینکه پدرم بمیرد، احساس می‌کردم که با بحث در مورد مسائلی مانند امور مالی و وکالتنامه، مسئول بوده‌ایم. پدر بیمه عمر داشت و گفت که سوزاندن سوزانده خواهد شد. به زودی متوجه شدم که وقتی یکی از عزیزان در ایالات متحده می میرد، باید با مسائل مالی و حقوقی در حالی که در سخت ترین مرحله غم و اندوه هستید، برخورد کنید. آیا بعد از از دست دادن یکی از عزیزانتان قرض گرفتید یا فداکاری های مالی زیادی کردید؟ Business Insider مایل است از شما برای سریالی در مورد هزینه مردن بشنود. لطفا این فرم سریع را پر کنید. پدر در ژوئیه در سن 71 سالگی درگذشت. حدود دو روز بعد، من و یکی از دوستان خانوادگی با شرکت های کارت اعتباری، بیمه ها و بانک تماس گرفتیم تا حساب های پدر را ببندیم. به این ترتیب متوجه شدیم که بیمه نامه عمر نقد شده است. همچنین هیچ ارثی وجود نداشت: دارایی پدر کوچک و ورشکسته بود، با مقداری بدهی کارت اعتباری. من و شوهرم هر دو به طور تمام وقت کار می کنیم - من هماهنگ کننده پروژه هستم و او نقاش یک تعمیرگاه قایق است - اما ما"}, {"source": "Business Insider", "title": "Couples are using a viral AI agent to do their emotional labor. It’s been helpful — and chaotic.", "link": "https://www.businessinsider.com/why-couples-are-using-ai-agents-instinct-emotional-labor-2026-9", "summary": "Some early adopters of Instinct are using AI agents to manage common tasks in a relationship, like shared to-do lists and vacation itineraries. It s had mixed results. Getty Images; BI Instinct's new \"Trusted Person\" allows users to connect their AI agents and tag-team tasks. Some couples use it for shared to-dos or help planning surprise date nights. While it cuts down on emotional labor, a therapist says not so fast: You still have to put work in. AI agents aren't just sneaking into your workplace anymore. Soon, they might be making regular appearances in your relationship. Since the launch of Instinct, an invite-only AI assistant that went viral among Silicon Valley insiders in August, early adopters have been using it to offload tasks like booking hotels and scheduling appointments. Then, on September 9, Noah Shinn, the company's 23-year-old founder, announced Instinct's new \"Trusted Person\" feature: You could now have your Instinct agent directly communicate with another person's Instinct agent to reduce the amount of \"back-and-forth\" in a relationship , such as coordinating plans and organizing vacations. Introducing our Trusted Person network powered by our new Instinct-to-Instinct communication protocol. Your Instinct can now talk to other Instincts to coordinate plans on your behalf. Getting people together often involves a lot of back-and-forth: finding a time, working out… pic.twitter.com/LXkDpXGmea — Noah Shinn (@noahrshinn) September 9, 2026 So far, some users have found it helpful. \"Instinct syncs with my wife's Instinct so we can actually finish a shared to-do list,\" Alex Borkin, a 36-year-old entrepreneur who uses AI across his portfolio of companies, said on X , noting that it was easier than manually setting up AI agents using Claude Code or Codex. Have you used Instinct's \"Trusted Person\" feature with a spouse or partner? If you'd like to share your story, please reach out to jpugachevsky@businessinsider.com. While Instinct may help eradicate the most annoying part of a partnership (figuring out dinner plans when you both keep saying \"whatever you want!\"), it can also open up the possibilities of new relationship drama. Some users have already reported some issues, ranging from privacy concerns to accidentally spoiled surprises. Your emotional labor robot Emotional labor is disproportionately felt by women in relationships, causing friction. AI agents are marketed as reducing some of those responsibilities. janiecbros/Getty Images The gr", "date_str": "2026-09-27T09:00:01+00:00", "hash": "ed108137a760df42", "title_fa": "زوج ها از یک عامل هوش مصنوعی ویروسی برای انجام کارهای عاطفی خود استفاده می کنند. مفید بوده است - و هرج و مرج.", "summary_fa": "برخی از پذیرندگان اولیه Instinct از عوامل هوش مصنوعی برای مدیریت وظایف مشترک در یک رابطه مانند لیست کارهای مشترک و برنامه های سفر تعطیلات استفاده می کنند. نتایج متفاوتی داشت گتی ایماژ; \"Prusted Person\" جدید BI Instinct به کاربران اجازه می دهد تا عوامل هوش مصنوعی و وظایف تگ تیم خود را به هم متصل کنند. برخی از زوج ها از آن برای انجام کارهای مشترک یا کمک به برنامه ریزی شب های ملاقات غافلگیرکننده استفاده می کنند. در حالی که کار عاطفی را کاهش می دهد، یک درمانگر نه چندان سریع می گوید: شما هنوز باید کار کنید. عوامل هوش مصنوعی دیگر فقط به صورت مخفیانه وارد محل کار شما نمی شوند. به زودی، آنها ممکن است به طور منظم در رابطه شما ظاهر شوند. از زمان راه‌اندازی Instinct، یک دستیار هوش مصنوعی فقط دعوت‌شده که در ماه آگوست در بین افراد داخلی Silicon Valley منتشر شد، کاربران اولیه از آن برای انجام کارهایی مانند رزرو هتل و برنامه‌ریزی قرارها استفاده کرده‌اند. سپس، در 9 سپتامبر، نوآ شین، بنیانگذار 23 ساله شرکت، ویژگی جدید Instinct \"Prusted Person\" را اعلام کرد: اکنون می توانید عامل غریزی خود را مستقیماً با عامل غریزی شخص دیگری در ارتباط باشید تا میزان \"پشت و برگشت\" را در یک رابطه کاهش دهید، مانند هماهنگی برنامه ها و سازماندهی کارهای مخفی. معرفی شبکه افراد معتمد با پروتکل ارتباطی جدید Instinct-to-Instinct ما. غریزه شما اکنون می تواند با غرایز دیگر صحبت کند تا برنامه ها را از طرف شما هماهنگ کند. دور هم جمع کردن افراد اغلب مستلزم رفت و آمدهای زیادی است: یافتن زمان، تمرین… pic.twitter.com/LXkDpXGmea — نوح شین (@noahrshinn) 9 سپتامبر 2026 تاکنون، برخی از کاربران آن را مفید دانسته اند. الکس بورکین، یک کارآفرین 36 ساله که از هوش مصنوعی در مجموعه شرکت‌های خود استفاده می‌کند، در X گفت: «غریزه با غریزه"}, {"source": "Business Insider", "title": "A close read of Mackenzie Scott's baffling post-divorce novel", "link": "https://www.businessinsider.com/mackenzie-scott-last-days-two-nations-novel-review-2026-9", "summary": "PA Images/Reuters; NURPHOTO/Reuters; iStock; Tyler Le/BI When Mackenzie Scott got divorced from Jeff Bezos in 2019, she became one of the richest people in the world overnight. Their divorce settlement was among the largest in history, granting her assets that included 4% of Amazon's stock — roughly $38 billion. She wasted little time before starting to give her fortune away, handing off large sums to organizations ranging from pandemic relief nonprofits to community colleges within a year of their split. Based on the coinciding of her left-leaning philanthropic efforts and her ex-husband's cozying up to the president, it would make sense if she weren't wild about what Bezos has been up to . But other than occasional blog posts about her charitable giving, Scott is famously tight-lipped. Mostly, she lets her actions speak for themselves. So it didn't escape notice when Scott announced last month that she would be self-publishing a serialized novel, \"Last Days in Two Nations (A History in Eighteen Minds)\". A former protégé of Toni Morrison, Scott previously published two novels under the name Mackenzie Bezos: 2005's \"The Testing of Luther Albright,\" a family drama for which she won the American Book Award, and the 2013 thriller \"Traps.\" \"Last Days\" is a departure from her earlier work. It's set in a dystopian near-future where America has been split into two opposing factions, the \"Still United\" states and an authoritarian regime called the Dakota Membership. Scott's third-person narration moves between the perspectives of a sprawling cast — 18 different characters, as the subtitle suggests. And while she worked with traditional publishers for her first two novels, Scott released \"Last Days\" in nine free installments on Substack over the course of August. It was one of the few ways, people online quickly pointed out, that her work would stay off of Amazon . That doesn't mean Scott was trying to fly under the radar . Given her evident interest in preserving her privacy and ample experience of having her actions interpreted and misinterpreted by a rapacious public, she had to know that people would read her first published fiction in over a decade with eyes as all-seeing as Ring cameras. If she wanted to stay out of the spotlight, why did she announce the upcoming release on her verified X page, not to mention publish it under her real name? The fact that she put out this dispatch from a grim imagined future in such an unvarnished and public way feels like an", "date_str": "2026-09-27T08:14:01+00:00", "hash": "a2f00bd994fee17b", "title_fa": "خواندن دقیق رمان گیج کننده مکنزی اسکات پس از طلاق", "summary_fa": "تصاویر PA/رویترز. NURPHOTO/رویترز؛ آی استوک؛ تایلر لی/ بی آی وقتی مکنزی اسکات در سال 2019 از جف بزوس طلاق گرفت، یک شبه به یکی از ثروتمندترین افراد جهان تبدیل شد. توافق طلاق آنها یکی از بزرگترین طلاق های تاریخ بود و دارایی های او شامل 4٪ از سهام آمازون - تقریباً 38 میلیارد دلار بود. او زمان کمی را قبل از شروع به بخشش ثروت خود هدر داد و مبالغ هنگفتی را به سازمان‌هایی از سازمان‌های غیرانتفاعی کمک‌رسانی همه‌گیر گرفته تا کالج‌های اجتماعی در عرض یک سال پس از انشعاب آنها تلف کرد. بر اساس همزمانی تلاش‌های بشردوستانه چپ‌گرایانه‌اش و دلبستگی همسر سابقش با رئیس‌جمهور، اگر او نسبت به کارهایی که بزوس انجام داده است وحشی نبود، منطقی بود. اما به غیر از پست های گاه به گاه وبلاگ در مورد کمک های خیریه اش، اسکات معروف است که لب های تنگ است. بیشتر، او اجازه می دهد که اعمالش خودشان صحبت کنند. بنابراین زمانی که اسکات ماه گذشته اعلام کرد که یک رمان سریالی به نام \"آخرین روزها در دو ملت (تاریخی در هجده ذهن)\" را منتشر خواهد کرد، از توجه دور نشد. اسکات که یکی از شاگردان سابق تونی موریسون بود، قبلاً دو رمان با نام مکنزی بزوس منتشر کرده بود: «آزمایش لوتر آلبرایت» در سال 2005، یک درام خانوادگی که او جایزه کتاب آمریکا را برای آن برنده شد، و تریلر «تله» در سال 2013. «آخرین روزهای» انحرافی از کارهای قبلی اوست. این در آینده ای نزدیک دیستوپیایی می گذرد که در آن آمریکا به دو جناح مخالف تقسیم شده است، ایالت های \"هنوز متحد\" و یک رژیم خودکامه به نام عضویت داکوتا. روایت سوم شخص اسکات بین دیدگاه‌های یک بازیگر گسترده حرکت می‌کند - همانطور که از زیرنویس نشان می‌دهد 18 شخصیت مختلف. و در حالی که او برای دو رمان اول خود با ناشران سنتی"}, {"source": "Business Insider", "title": "Where to watch the Billie Jean King Cup finals for free from anywhere", "link": "https://www.businessinsider.com/guides/streaming/where-to-watch-billie-jean-king-cup-final-tennis-2026", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Karolína Muchová will be hoping to add to her US Open mixed King Cup را به صورت رایگان نشان می دهند. کانادا پوشش بسیار"}, {"source": "Business Insider", "title": "Airlines waive change fees as nor'easter hits Northeast", "link": "https://www.businessinsider.com/airlines-waive-change-fees-noreaster-northeast-boston-laguardia-newark-2026-9", "summary": "A JetBlue airplane takes off from Boston Logan International Airport. Tom Williams/CQ-Roll Call, Inc via Getty Images Airlines are waiving change fees as a nor'easter bears down on the Northeast. The airlines include American Airlines, Delta Air Lines, JetBlue Airways, and United Airlines. Over 87,000 customers in the region had lost power as of Saturday afternoon. Major airlines are letting customers rebook flights around the Northeast for free as a nor'easter threatens the region. American Airlines, Delta Air Lines, JetBlue Airways, and United Airlines have issued travel advisories for passengers flying this weekend to, from, or through several airports in the area, including LaGuardia Airport in New York and Logan Airport in Boston. Travelers will be able to change their flights to new dates as late as September 29 or 30, depending on the airline. Airports affected by the travel advisories span from Virginia to Maine . The advisories come as a major Nor'easter storm is hitting the East Coast on Saturday. New York Gov. Kathy Hochul declared a state of emergency for portions of the state on Friday. \"The rain is underway, and while it's only a half an inch or so thus far, mark my words: Much more is coming,\" Hochul said at a press briefing Saturday morning. By Saturday afternoon, over 87,000 customers in the region had lost power, according to PowerOutage.com, including nearly 35,000 in New York. Over 260 flights at Boston Logan have been canceled as of Saturday afternoon. Read the original article on Business Insider", "date_str": "2026-09-26T20:15:28+00:00", "hash": "c10b64f4081ef0dc", "title_fa": "با فرارسیدن عید نوروز در شمال شرق، خطوط هوایی از هزینه های تغییر چشم پوشی می کنند", "summary_fa": "یک هواپیمای جت بلو از فرودگاه بین المللی بوستون لوگان بلند می شود. تام ویلیامز/CQ-Roll Call، Inc از طریق Getty Images خطوط هوایی از هزینه های تغییر چشم پوشی می کنند، زیرا عید نوروز در شمال شرق کاهش می یابد. خطوط هوایی شامل امریکن ایرلاینز، دلتا ایر لاین، جت بلو ایرویز و یونایتد ایرلاینز می باشد. بیش از 87000 مشتری در منطقه از بعدازظهر شنبه برق قطع شده بودند. خطوط هوایی بزرگ به مشتریان این امکان را می دهند که پروازهای شمال شرق را به صورت رایگان دوباره رزرو کنند زیرا عید نوروز منطقه را تهدید می کند. امریکن ایرلاینز، دلتا ایر لاین، جت بلو ایرویز و یونایتد ایرلاینز برای مسافرانی که این آخر هفته به، از یا از طریق چندین فرودگاه در این منطقه از جمله فرودگاه لاگواردیا در نیویورک و فرودگاه لوگان در بوستون پرواز می کنند، توصیه های مسافرتی صادر کرده اند. مسافران می توانند بسته به خط هوایی، پروازهای خود را تا 29 یا 30 سپتامبر به تاریخ های جدید تغییر دهند. فرودگاه‌هایی که تحت‌تاثیر توصیه‌های سفر قرار گرفته‌اند، از ویرجینیا تا مین را در بر می‌گیرند. این توصیه ها در حالی ارائه می شود که یک طوفان بزرگ نور عید پاک در روز شنبه سواحل شرقی را درنوردیده است. کتی هوچول فرماندار نیویورک روز جمعه در بخش‌هایی از این ایالت وضعیت فوق‌العاده اعلام کرد. هوچول در یک نشست مطبوعاتی صبح شنبه گفت: \"باران در جریان است، و در حالی که تا کنون فقط نیم اینچ یا بیشتر طول کشیده است، به سخنان من توجه کنید: خیلی بیشتر در راه است.\" طبق گزارش PowerOutage.com تا بعدازظهر شنبه، بیش از 87000 مشتری در منطقه برق خود را از دست داده بودند، از جمله نزدیک به 35000 در نیویورک. بیش از 260 پرواز در بوستون لوگان از بعد از ظهر شنبه لغو شده است. مقاله اصلی را در"}, {"source": "Business Insider", "title": "I moved between 2 countries and languages as a teen. I got very good at proving myself.", "link": "https://www.businessinsider.com/immigrant-student-learned-english-reading-newspapers-writing-2026-9", "summary": "joecicak/Getty Images I attended high school in both Spanish and English after moving between countries. My Dominican transcripts led one school to automatically place me in ESL. Being underestimated made me determined to become undeniable in English. There's a specific dread that comes from not knowing if the words in your head are the right ones in that language. I lived inside that fear, not of a school test , but of speaking in class and having the wrong language come out, or the right one come out wrong. I was born in the Dominican Republic . My parents divorced when I was 1, and left for the US, independent of each other, while I stayed behind in my maternal grandparents' care. At 6, my mother came back for me, remarried, with a new baby, and my legal documents. She'd divorce again, and with her third husband, she started a clothing manufacturing business that brought us back to the Dominican Republic, where I lived from 11 to 16. Two high schools in Spanish in the Dominican Republic, for the freshman and sophomore years. Then two in English, junior and senior year, first in New Jersey, then in New York City. I grew up learning how to switch between Spanish and English , and having to prove myself in both languages. I was put in ESL classes When I moved to the US, I was placed straight into an ESL class . Nobody tested me or heard me speak; they just saw a Spanish-speaking country on a piece of paper and decided who I was. I hated that I had to prove myself every time I went to a new school. I had to perform on command for someone to believe that I could speak the language. I raised my hand when I didn't have to. I corrected a teacher's grammar once, in front of the class, just to watch her catch herself. I answered faster and sharper than I needed to. The author moved between the US and the Dominican Republic. Courtesy of the author Once, I wrote an essay on the Civil War and got called into the principal's office like I'd done something wrong. They said it was informative, precise, well written, remarkably so, for an immigrant. They accused me of plagiarism. My mother was called in. She didn't flinch. She'd watched me write it at our kitchen table and said so, plainly. The principal sat me alone with a blank page and a new topic: what the American flag stood for. I wasn't going to let him win this one either. I wrote about Betsy Ross bent over a needle and thread, stitching a symbol together before anyone knew what it would represent, and about ple", "date_str": "2026-09-26T19:56:01+00:00", "hash": "f56241c4e415382f", "title_fa": "من در نوجوانی بین 2 کشور و زبان نقل مکان کردم. من در اثبات خودم خیلی خوب بودم.", "summary_fa": "joecicak/Getty Images من پس از جابجایی بین کشورها در دبیرستان به دو زبان اسپانیایی و انگلیسی تحصیل کردم. رونوشت های دومینیکن من باعث شد که یک مدرسه به طور خودکار مرا در ESL قرار دهد. دست کم گرفته شدن باعث شد تصمیم بگیرم در زبان انگلیسی غیرقابل انکار باشم. ترس خاصی وجود دارد که از ندانستن کلماتی که در ذهن شما وجود دارد، در آن زبان درست هستند یا خیر. من در درون آن ترس زندگی کردم، نه از امتحان مدرسه، بلکه از صحبت کردن در کلاس و بیرون آمدن زبان نادرست یا اشتباه بیرون آمدن زبان درست. من در جمهوری دومینیکن متولد شدم. پدر و مادرم زمانی که من یک ساله بودم طلاق گرفتند و مستقل از یکدیگر به ایالات متحده رفتند، در حالی که من تحت مراقبت پدربزرگ و مادربزرگ مادری ام بودم. در 6 سالگی، مادرم به دنبال من آمد، دوباره ازدواج کرد، با یک نوزاد جدید و مدارک قانونی من. او دوباره طلاق گرفت و با شوهر سومش، یک تجارت تولید لباس را شروع کرد که ما را به جمهوری دومینیکن بازگرداند، جایی که من از 11 تا 16 سالگی در آنجا زندگی می کردم. دو دبیرستان به زبان اسپانیایی در جمهوری دومینیکن، برای سال اول و دوم. سپس دو نفر به زبان انگلیسی، سال اول و ارشد، ابتدا در نیوجرسی، سپس در شهر نیویورک. من بزرگ شدم یاد گرفتم که چگونه بین اسپانیایی و انگلیسی جابجا شوم و باید خودم را به هر دو زبان ثابت کنم. من در کلاس های ESL قرار گرفتم وقتی به ایالات متحده نقل مکان کردم، مستقیماً در کلاس ESL قرار گرفتم. هیچ کس مرا امتحان نکرد و صحبتم را نشنید. آنها فقط یک کشور اسپانیایی زبان را روی یک تکه کاغذ دیدند و تصمیم گرفتند که من کی هستم. از اینکه هر بار که به مدرسه جدیدی می روم"}, {"source": "Business Insider", "title": "My husband and I don't exchange gifts for birthdays or holidays. Here's what we do instead.", "link": "https://www.businessinsider.com/couple-doesnsnt-exchange-holiday-birthday-gifts-give-surprises-2026-9", "summary": "Instead of giving traditional gifts on birthdays and holidays, the author and her husband prefer to travel, give surprise gifts, or show their love through food. Courtesy of Renate Flanagan. My husband and I prioritize experiences like travel over gifts, sharing memorable trips together. Our relationship grew through thoughtful gestures that weren't tied to holidays or events. I'm glad we have memories instead of random trinkets. It was my birthday and my now-husband and I had been dating for about three months. When he got to my house, he wished me a happy birthday, then he apologized, \"I'm sorry I didn't get you a gift.\" At the time, I was 31, had a good job, and could buy whatever I fancied, within reason. I couldn't come up with any material thing that I even wanted. \"Don't be sorry,\" I told him, \"It's a good thing. No obligatory gift giving .\" \"No obligatory gift giving,\" he echoed. And the precedent was set. We don't wait for holidays to do nice things for each other In the three months we had been dating, leading up to my birthday, my boyfriend had brought me numerous loaves of homemade bread; it was the pandemic after all. He had come to my house with jars of freshly made pesto, and he had made me or bought me dinner more times than I could keep track of. If my husband has a love language , it's definitely food. All of those nice things he did weren't because there was a day marked on the calendar. He just did them because he wanted to. In the six years that we've been together, we've only exchanged a handful of material gifts, none of which coincided with a holiday or a birthday. On one occasion, he went to Macy's to pick up a travel potty for our toddler. When he came back, he surprised me with diamond earrings . His reasoning? He just wanted to. When my husband's parental leave ended, I wanted to do something special to commemorate how attentive and involved a father he is. Hallmark doesn't have a card for \"dad going back to the workforce after parental leave.\" My husband dresses up for work, including a suit, tie, and cufflinks. I ordered him a custom pair of map cufflinks with his hometown on one cufflink and the city where our son was born on the other, so he would have something to remind him of our son at work. He wears those cufflinks on heavy rotation. We value experiences over material possessions Our rationale for resisting material objects is part practical, part philosophical. From a practical standpoint, our family of three lives in ", "date_str": "2026-09-26T19:55:01+00:00", "hash": "126fdb220060fb2d", "title_fa": "من و شوهرم برای تولد یا تعطیلات کادو عوض نمی کنیم. در اینجا کاری است که ما به جای آن انجام می دهیم.", "summary_fa": "نویسنده و همسرش به جای دادن هدایای سنتی در روزهای تولد و تعطیلات ترجیح می دهند به مسافرت بروند، هدایایی غافلگیرکننده بدهند یا عشق خود را از طریق غذا نشان دهند. با حسن نیت از Renate Flanagan. من و شوهرم تجربیاتی مانند سفر را به هدیه، به اشتراک گذاشتن سفرهای به یاد ماندنی با هم ترجیح می دهیم. رابطه ما از طریق حرکات متفکرانه ای که به تعطیلات یا رویدادها مرتبط نبود، رشد کرد. خوشحالم که به جای ریزه کاری های تصادفی خاطره داریم. تولدم بود و من و شوهرم حدود سه ماه بود که با هم قرار داشتیم. وقتی به خانه من رسید، تولدم را تبریک گفت، سپس عذرخواهی کرد: ببخشید که برای شما هدیه نگرفتم. در آن زمان، من 31 ساله بودم، شغل خوبی داشتم و می‌توانستم هر چیزی را که دوست داشتم بخرم. هیچ چیز مادی که حتی می خواستم نمی توانستم به دست بیاورم. به او گفتم: «متأسف نباش، چیز خوبی است، هدیه دادن واجب نیست.» او تکرار کرد: \"هدیه دادن واجب نیست.\" و این سابقه ایجاد شد. ما منتظر تعطیلات نیستیم تا کارهای خوبی برای یکدیگر انجام دهیم در سه ماهی که با هم قرار داشتیم، قبل از تولدم، دوست پسرم تعداد زیادی نان خانگی برایم آورده بود. بالاخره همه گیری بود. او با شیشه های پستوی تازه ساخته شده به خانه من آمده بود و بیش از آن چیزی که می توانستم ردیابی کنم برایم درست کرده بود یا برایم شام خریده بود. اگر شوهرم زبان عشقی دارد، قطعا غذاست. تمام آن کارهای خوبی که انجام داد به این دلیل نبود که یک روز در تقویم مشخص شده بود. او آنها را فقط به این دلیل انجام داد که می خواست. در این شش سالی که با هم بودیم، فقط یک مشت هدیه مادی رد و بدل کردیم که هیچ کدام مصادف با تعطیلات"}, {"source": "Business Insider", "title": "I'm 21 and make up to $280,000 a month reselling sneakers. I don't see my friends much and still live at home.", "link": "https://www.businessinsider.com/gen-z-sneaker-reseller-business-lives-with-parents-2026-9", "summary": "Robbie Cartwright resells sneakers online. Courtesy of Robbie Cartwright Robbie Cartwright started selling items when he was about 11. He now makes hundreds of thousands reselling sneakers online. He was late for his own 21st birthday because he was working, and he rarely sees friends. This as-told-to essay is based on a conversation with Robbie Cartwright, founder of Yorkshire Trainers . It has been edited for length and clarity . I've been selling things since I was a child: candy bars, fidget spinners — you name it. My middle school had a challenge to see which student could take a small investment of about $10 and make the most profit. I won, selling hooks to hang handbags on. I profited more than $1,000 over the six weeks of the challenge, although it was all for charity. By the time I was about 14, I was reselling sneakers . Some kids have hobbies or play sports, but I would troll eBay, looking for deals that I could make a profit on. I reinvested what I made, and soon started camping out in line for exclusive sneaker drops. I might spend $200 on a pair of sneakers from the factory, then resell them for $1,000 later that night. That was my whole weekend: sourcing items to sell. Sometimes I could convince my friends to come camp outside stores with me. My parents weren't too keen on the idea of me sleeping outside overnight, but they let me do it. I believe it made me a tougher person. I'm making tons of money, but that's not what motivates me If I sold three pairs of sneakers, I'd use the profit to buy five more. I viewed selling as more of a hobby than a job . Still, it was taking up a lot of my time. I didn't study much and found any excuse I could to get out of school. By about 17, I was all in on the business. That was four years ago, and the business has grown massively. Today, I do five figures of sales each month, and in May, I hit a record: more than $280,000 in one month. Money isn't my main motivator. The industry of reselling online via live-streaming is still young, especially in the UK, where I'm based. I'm chasing that top spot in the industry because it's still up for grabs. Friends have drifted because I'm so focused on work Being so dedicated to work impacts all areas of my personal life. I used to go to watch my favorite football team with my friends every week. Now, I haven't seen a game in probably three years. Unsurprisingly, my friends have drifted away. I'm not still friends with anyone I went to school with. I did a vacation w", "date_str": "2026-09-26T17:55:01+00:00", "hash": "9735b8e8c0bcbb21", "title_fa": "من 21 ساله هستم و از فروش مجدد کفش های کتانی تا 280000 دلار در ماه درآمد دارم. من دوستانم را زیاد نمی بینم و هنوز در خانه زندگی می کنم.", "summary_fa": "رابی کارترایت کفش های کتانی را به صورت آنلاین می فروشد. با حسن نیت از رابی کارترایت رابی کارترایت از زمانی که حدود 11 سال داشت شروع به فروش اقلام کرد. او اکنون صدها هزار نفر از فروش مجدد کفش های کتانی آنلاین به دست می آورد. او برای تولد 21 سالگی خود دیر آمده بود زیرا کار می کرد و به ندرت دوستانی را می دید. این مقاله همانطور که گفته شد بر اساس گفتگو با رابی کارترایت، بنیانگذار مربیان یورکشایر است. برای طول و وضوح ویرایش شده است. من از بچگی چیزهایی می فروختم: آب نبات، فیجت اسپینر - شما اسمش را بگذارید. مدرسه راهنمایی من برای دیدن اینکه کدام دانش آموز می تواند سرمایه گذاری کوچکی در حدود 10 دلار انجام دهد و بیشترین سود را داشته باشد چالشی بود. من برنده شدم، قلاب هایی برای آویزان کردن کیف های دستی فروختم. من در طول شش هفته چالش بیش از 1000 دلار سود بردم، اگرچه همه آن برای امور خیریه بود. زمانی که حدود 14 ساله بودم، کفش های کتانی می فروختم. برخی از بچه‌ها سرگرمی‌هایی دارند یا ورزش می‌کنند، اما من eBay را ترول می‌کردم و به دنبال معاملاتی بودم که بتوانم از آن سود ببرم. آنچه را که ساخته بودم دوباره سرمایه‌گذاری کردم و به زودی در صف خرید کفش‌های کتانی انحصاری کمپ زدم. من ممکن است 200 دلار برای خرید یک جفت کفش ورزشی از کارخانه خرج کنم، سپس آنها را به قیمت 1000 دلار در اواخر همان شب بفروشم. این تمام آخر هفته من بود: تامین اقلام برای فروش. گاهی اوقات می توانستم دوستانم را متقاعد کنم که با من در خارج از فروشگاه ها کمپ بزنند. والدینم چندان مشتاق این نبودند که من یک شبه بیرون بخوابم، اما به من اجازه دادند این کار را انجام دهم. من معتقدم که این باعث"}, {"source": "Business Insider", "title": "We moved from the US to a small Italian village. Now, my 75-year-old parents are following in our footsteps.", "link": "https://www.businessinsider.com/aging-parents-moving-to-italian-town-in-sicily-following-us-2026-9", "summary": "My parents were supportive of our decision to move to Italy, and now, they re joining us here. Camellia Phillips When we moved to an Italian village , my biggest worry was being far from my parents in the US. They were excited to visit us in Sicily, though, and even started looking at properties. Now, they're buying a house here — and the process has brought us closer than ever. Nearly three years ago, my husband and I moved from New York City to a hillside Sicilian village. We'd bought a house here remotely, without seeing it in person until several months after the closing. During the unconventional process, my now-75-year-old parents, based in Colorado, were our biggest supporters. We had long phone calls, during which we reviewed the pros and cons of each property. They were as immersed in the adventure as we were. Sometimes, they'd even talk about \"our house in Sicily\" — as if we were buying them a Mediterranean home. Still, I worried about how they'd feel when we decided to move here full-time. My dad's response: \"We thought you'd do it sooner.\" Then, my parents started planning their first visit. The hardest part of moving to Italy was leaving my aging parents We spent a few months with my parents before moving to Italy, and a health scare exacerbated my worries about leaving them behind. Camellia Phillips Supporting aging parents is emotionally fraught in the best of circumstances. Most of my friends in the US are struggling with it right now. Since my husband had recently lost both of his parents, we spent two months visiting mine before our one-way flight to Italy. As if to drive home my worries, one night during this time, my dad had a health scare. He lost consciousness, and it took what felt like an eternity to revive him. Paramedics rushed him to the hospital, and we learned that thankfully, he'd be OK — but for a few moments, I thought I was losing my dad. Leaving felt like abandoning my family. In the years ahead, more care responsibilities would likely fall to my younger sister, who lives in Colorado near my parents. My own chronic health issues also meant regular trips back to the US wouldn't be realistic. I just hoped that I could be helpful and supportive from afar. My parents' first visit to Italy was a semi-disaster A lot went wrong on my parents first trip to Italy, but they still had a great time. Camellia Phillips After giving us a year to settle in Sicily, my parents planned their first monthlong visit. They arrived in mid-January", "date_str": "2026-09-26T16:01:01+00:00", "hash": "5a8c3464a0cabcec", "title_fa": "ما از ایالات متحده به یک روستای کوچک ایتالیایی نقل مکان کردیم. حالا پدر و مادر 75 ساله من راه ما را دنبال می کنند.", "summary_fa": "پدر و مادرم از تصمیم ما برای نقل مکان به ایتالیا حمایت کردند، و اکنون، آنها دوباره به ما می‌پیوندند. کاملیا فیلیپس وقتی به یک روستای ایتالیایی نقل مکان کردیم، بزرگترین نگرانی من دور بودن از پدر و مادرم در ایالات متحده بود. با این حال، آنها از دیدن ما در سیسیل هیجان‌زده بودند و حتی شروع به تماشای املاک کردند. اکنون، آنها در حال خرید خانه در اینجا هستند - و این روند ما را بیشتر از همیشه به هم نزدیک کرده است. نزدیک به سه سال پیش، من و شوهرم از شهر نیویورک به روستایی سیسیلی در دامنه تپه نقل مکان کردیم. ما خانه ای را از راه دور اینجا خریده بودیم، بدون اینکه شخصاً تا چند ماه پس از بسته شدن آن را ببینیم. در طول این فرآیند غیرمتعارف، والدین 75 ساله من که در کلرادو مستقر هستند، بزرگترین حامیان ما بودند. ما تماس های تلفنی طولانی داشتیم که در طی آن مزایا و معایب هر ملک را بررسی کردیم. آنها هم مانند ما در ماجراجویی غوطه ور بودند. گاهی اوقات، آنها حتی در مورد \"خانه ما در سیسیل\" صحبت می کنند - گویی ما برای آنها یک خانه مدیترانه ای می خریدیم. با این حال، نگران بودم که وقتی تصمیم گرفتیم تمام وقت به اینجا نقل مکان کنیم، چه احساسی خواهند داشت. پاسخ پدرم: \"ما فکر می کردیم زودتر این کار را انجام دهید.\" سپس، والدینم شروع به برنامه ریزی برای اولین ملاقات خود کردند. سخت ترین قسمت مهاجرت به ایتالیا ترک والدین پیرم بود. ما قبل از نقل مکان به ایتالیا چند ماه را با والدینم گذراندیم و ترس از سلامتی نگرانی من را در مورد ترک آنها تشدید کرد. کاملیا فیلیپس حمایت از والدین سالخورده در بهترین شرایط از نظر عاطفی مملو است. اکثر دوستان من در ایالات متحده در حال حاضر با آن"}, {"source": "Business Insider", "title": "Pope Leo XIV warns against losing humanity to a ‘paradise of machines’", "link": "https://www.businessinsider.com/pope-leo-xiv-warns-against-losing-humanity-paradise-of-machines-2026-9", "summary": "Pope Leo XIV spoke about technology during a speech given to French diplomats on Friday. Tom Nicholson/Getty Images Pope Leo XIV spoke to diplomats in France on Friday. The Pope cautioned against losing our humanity \"amid a paradise of machines.\" Addressing potential risks of AI has become a central theme of his papacy. Pope Leo XIV has a new warning about AI. The Pope cautioned against an overreliance on artificial intelligence and other technology during a speech to French diplomats, including President Emmanuel Macron, on Friday. Earlier that day, he traveled from Rome to Paris as part of an apostolic journey. \"If we are to avoid losing our humanity amid a 'paradise of machines' invading and conditioning our daily lives, there is an urgent need for education in ethical discernment and the capacity to acknowledge the moral good,\" Pope Leo XIV said. \"This is indispensable if we are to recognize the genuine good that enables human beings to flourish in accordance with their primordial vocation, with unconditional respect for their interior freedom and their sacred dignity.\" During a separate speech at the United Nations Educational, Scientific, and Cultural Organization on Friday, Pope Leo XIV said AI can amplify misinformation. \"Indeed, without truth, language becomes subject to the logic of violence and to the arbitrary will of the powerful,\" he said. Pope Leo XIV became head of the Catholic Church in 2025, three years after OpenAI launched ChatGPT and changed the AI landscape. Since then, tech companies like Google, Meta, and Anthropic have invested billions of dollars in a race to become the industry leader. Doing so could secure profits and market dominance, a massive victory for whichever company comes out on top. Critics have expressed concerns that AI could exacerbate cybersecurity and privacy issues. An OpenAI agent escaped its system and hacked another AI company, Hugging Face , in July. Earlier this month, a research team at a small AI startup said it used Anthropic's Claude to hack into OpenAI's codebase . Last week, The Wall Street Journal reported that Google's Gemini had hacked three companies this spring. And on Wednesday, Australia's Prime Minister Anthony Albanese said an OpenAI agent gained unauthorized access to a government website in June. While tech leaders go back and forth on how to pace AI development , Pope Leo XIV has repeatedly advocated putting humans first as the frontier AI model revolution rages on. In August, he warned tha", "date_str": "2026-09-26T15:52:38+00:00", "hash": "96e03c0fd58fddb2", "title_fa": "پاپ لئو چهاردهم نسبت به از دست دادن بشریت در «بهشت ماشین‌ها» هشدار داد.", "summary_fa": "پاپ لئو چهاردهم در سخنرانی روز جمعه در جمع دیپلمات های فرانسوی درباره فناوری صحبت کرد. تام نیکلسون/ گتی ایماژ پاپ لئو چهاردهم روز جمعه با دیپلمات های فرانسه صحبت کرد. پاپ نسبت به از دست دادن انسانیت ما \"در میان بهشت ​​ماشین ها\" هشدار داد. پرداختن به خطرات احتمالی هوش مصنوعی به موضوع اصلی دوران پاپی او تبدیل شده است. پاپ لئو چهاردهم هشدار جدیدی درباره هوش مصنوعی دارد. پاپ روز جمعه در سخنرانی خود در جمع دیپلمات های فرانسوی از جمله امانوئل ماکرون، رئیس جمهور آمریکا، نسبت به اتکای بیش از حد به هوش مصنوعی و سایر فناوری ها هشدار داد. در اوایل آن روز، او به عنوان بخشی از سفر رسولی از رم به پاریس سفر کرد. پاپ لئو چهاردهم گفت: «اگر می‌خواهیم انسانیت خود را در میان «بهشت ماشین‌ها» که زندگی روزمره ما را مورد هجوم قرار می‌دهند و شرطی‌سازی می‌کنند، از دست ندهیم، نیاز مبرمی به آموزش در زمینه تشخیص اخلاقی و ظرفیت اعتراف به خیر اخلاقی وجود دارد. \"اگر بخواهیم خیر واقعی را بشناسیم که به انسانها امکان می دهد مطابق با شغل اولیه خود با احترام بی قید و شرط به آزادی درونی و کرامت مقدس خود شکوفا شوند، این امر ضروری است.\" پاپ لئو چهاردهم در یک سخنرانی جداگانه در سازمان آموزشی، علمی و فرهنگی سازمان ملل متحد در روز جمعه گفت هوش مصنوعی می تواند اطلاعات نادرست را تقویت کند. او گفت: \"در واقع، بدون حقیقت، زبان تابع منطق خشونت و اراده خودسرانه قدرتمندان می شود.\" پاپ لئو چهاردهم در سال 2025، سه سال پس از راه اندازی OpenAI ChatGPT و تغییر چشم انداز هوش مصنوعی، رئیس کلیسای کاتولیک شد. از آن زمان، شرکت‌های فناوری مانند گوگل، متا و آنتروپیک میلیاردها دلار در رقابت برای تبدیل شدن به رهبر صنعت سرمایه‌گذاری کرده‌اند. انجام این کار می تواند سود و تسلط بر"}, {"source": "Business Insider", "title": "White House blocks CNN from traveling with Trump on Air Force One", "link": "https://www.businessinsider.com/white-house-blocks-cnn-from-traveling-trump-air-force-one-2026-9", "summary": "President Donald Trump waves as he boards Air Force One. Chip Somodevilla/Getty Images The White House is blocking CNN from traveling on Air Force One with President Trump on Saturday. CNN had been scheduled to travel with Trump to Knoxville, Tennessee. The move is the latest development in the Trump administration's ongoing fight with CNN, MS NOW and POLITICO. The White House is blocking CNN from traveling aboard Air Force One with President Donald Trump on Saturday, a CNN spokesperson confirmed, days after a federal judge ordered the administration to restore the network's access to the White House, along with POLITICO and MS NOW. CNN had been scheduled to travel with Trump to Knoxville, Tennessee, where the president is expected to attend a college football game, as part of the rotating television press pool that covers the president in settings where space is limited. The pool's reporting and video are shared with other television networks. But CNN was left off White House guidance for Saturday's trip, preventing the network from carrying out its scheduled pool duties aboard the president's plane. Such interventions in the television rotation have historically been rare. Typically, the five networks decide who is up for rotation. A Saturday pool report noted that there would be no TV pool for the Tennessee trip, \"meaning there won't be widely available independent video of events.\" The White House did not immediately respond to a request for comment. The move marks the latest development in the Trump administration's ongoing fight with CNN, MS NOW and POLITICO over access to the president. Trump announced last week that he was barring all three news organizations from the White House, accusing them of repeatedly reporting \"FAKE NEWS.\" CNN was also prevented from traveling aboard Air Force One when Trump traveled to New York for the United Nations General Assembly earlier this week. In response, the four other members of the five-network television pool — ABC, CBS, NBC and Fox News — declined to take CNN's place. But a federal judge early on Thursday stepped in and ordered the White House to immediately restore the three news organizations' press credentials. On Saturday morning, Trump wrote on Truth Social , \"FAKE NEWS SHOULD NOT BE ALLOWED IN THE WHITE HOUSE!!! IT HAS GONE ON FAR TOO LONG, AT A TREMENDOUS COST TO OUR COUNTRY.\" This story originally appeared on POLITICO and is courtesy of the Axel Springer Global Reporters Network, which harnesses the ", "date_str": "2026-09-26T15:14:55+00:00", "hash": "0cad245bcd85ec60", "title_fa": "کاخ سفید از سفر CNN با ترامپ در ایر فورس وان جلوگیری کرد", "summary_fa": "رئیس جمهور دونالد ترامپ هنگام سوار شدن به ایر فورس وان دست تکان می دهد. Chip Somodevilla/Getty Images کاخ سفید از سفر CNN به ایر فورس وان با رئیس جمهور ترامپ در روز شنبه جلوگیری می کند. CNN قرار بود با ترامپ به ناکسویل، تنسی سفر کند. این اقدام آخرین تحول در مبارزه مداوم دولت ترامپ با CNN، MS NOW و POLITICO است. چند روز پس از آن که یک قاضی فدرال به دولت دستور داد تا دسترسی شبکه به کاخ سفید را بازگرداند، کاخ سفید روز شنبه از سفر سی‌ان‌ان به همراه دونالد ترامپ رئیس‌جمهور آمریکا با ایر فورس وان جلوگیری می‌کند. سی‌ان‌ان قرار بود با ترامپ به ناکسویل، تنسی سفر کند، جایی که انتظار می‌رود رئیس‌جمهور در یک بازی فوتبال کالج شرکت کند، به عنوان بخشی از استخر مطبوعاتی چرخشی تلویزیونی که رئیس‌جمهور را در مکان‌هایی که فضا محدود است پوشش می‌دهد. گزارش و ویدئوی استخر با سایر شبکه های تلویزیونی به اشتراک گذاشته می شود. اما سی ان ان از راهنمایی کاخ سفید برای سفر روز شنبه کنار گذاشته شد و این شبکه از انجام وظایف برنامه ریزی شده خود در هواپیمای رئیس جمهور جلوگیری کرد. چنین مداخلاتی در چرخش تلویزیون از لحاظ تاریخی نادر بوده است. به طور معمول، پنج شبکه تصمیم می گیرند که چه کسی برای چرخش باشد. یک گزارش استخر شنبه اشاره کرد که هیچ استخر تلویزیونی برای سفر به تنسی وجود نخواهد داشت، \"به این معنی که ویدیوی مستقل به طور گسترده ای از رویدادها در دسترس نخواهد بود.\" کاخ سفید بلافاصله به درخواست برای اظهار نظر پاسخ نداد. این اقدام نشان‌دهنده آخرین تحول در مبارزه مداوم دولت ترامپ با CNN، MS NOW و POLITICO بر سر دسترسی به رئیس جمهور است. ترامپ هفته گذشته اعلام کرد که هر سه سازمان خبری را از حضور در کاخ سفید منع می کند و"}],
      media: [{"source": "Billboard", "title": "KATSEYE Perform ‘Animal’ and ‘Hootie Frutti’ in ‘SNL’ Debut", "link": "https://www.billboard.com/music/music-news/katseye-snl-debut-1236348385/", "summary": "KATSEYE made their Saturday Night Live debut on Saturday (Sept. 26), performing two songs from their latest EP Wild on the NBC sketch series. The global girl group delivered Animal and Hootie Frutti, both from the five-track EP released in August. Four of the group s six members performed, as Manon Bannerman and Sophia Laforteza are currently on hiatus; both stepped back citing their mental health. Wild also features the singles Pinky Up, Bel Air and That Way. The appearance marked another mainstream U.S. television milestone for the group, following an August performance on The Tonight Show Starring Jimmy Fallon and a slot on the Today summer concert series. The SNL debut caps a rapid ascent for KATSEYE, who formed just two years ago through the reality competition series Dream Academy — a joint venture between K-pop powerhouse HYBE and Universal Music Group s Geffen Records designed to build a globally sourced girl group. The six-member lineup, drawn from across the U.S. and around the world, released their debut EP SIS (Soft Is Strong) in 2024 before breaking through in a major way the following year. That breakthrough came with their 2025 second EP Beautiful Chaos , which debuted at No. 4 on the Billboard 200 — their first top 10 — and spent more than a year on the chart. Its lead single Gnarly became the group s first Hot 100 entry, while the Latin-pop follow-up Gabriela climbed to No. 21, still their highest-charting single to date. The run earned KATSEYE nominations for Best New Artist and Best Pop Duo/Group Performance at the 68th annual Grammy Awards. Wild pushed them to a new commercial peak. Released in August, the EP debuted at No. 1 on the Billboard 200 with 170,000 first-week units — the group s first chart-topper and the biggest sales week for an all-female group in years. Its lead single Animal, co-written by Ed Sheeran, debuted at No. 24 on the Hot 100, a career high and the fifth consecutive solo single the group has sent onto the chart, following Gnarly, Gabriela, Internet Girl and Pinky Up. With more than 30 million monthly Spotify listeners at points this year, KATSEYE have become one of the most commercially successful girl groups in the world. The group is currently on their 31-date Wildworld Tour, which opened in Europe earlier this month and heads to North America in October, beginning in Miami and working north into Canada before moving west and wrapping in Mexico City in late November.", "date_str": "2026-09-27T07:47:27+00:00", "hash": "69d87d592c297e49", "title_fa": "KATSEYE در اولین بازی SNL «Animal» و «Hootie Frutti» را اجرا کرد.", "summary_fa": "KATSEYE اولین بازی Saturday Night Live خود را در روز شنبه (26 سپتامبر) انجام داد و دو آهنگ از آخرین EP Wild خود را در سری طرح های NBC اجرا کرد. گروه جهانی دختران، Animal و Hootie Frutti را که هر دو از EP پنج آهنگی که در ماه آگوست منتشر شد، تحویل دادند. چهار نفر از شش عضو گروه اجرا کردند. هر دو به دلیل سلامت روان خود عقب نشینی کردند. وایلد همچنین دارای تک آهنگ های Pinky Up، Bel Air و That Way است. این ظاهر یکی دیگر از نقطه عطف جریان اصلی تلویزیون ایالات متحده برای گروه بود، پس از اجرای اوت در نمایش امشب با بازی جیمی فالون و یک قسمت در مجموعه کنسرت های تابستانی Today. اولین SNL یک صعود سریع را برای KATSEYE، که فقط دو سال پیش از طریق مجموعه مسابقه واقعیت Dream Academy شکل گرفت - یک سرمایه گذاری مشترک بین HYBE قدرتمند کی پاپ و Geffen Records از گروه موسیقی یونیورسال است که برای ایجاد یک گروه دخترانه با منبع جهانی طراحی شده است. این گروه شش نفره، که از سراسر ایالات متحده و سراسر جهان تهیه شده است، اولین EP SIS (Soft Is Strong) خود را در سال 2024 منتشر کردند و سپس در سال بعد به طور عمده به موفقیت رسیدند. این موفقیت با دومین EP Beautiful Chaos در سال 2025 اتفاق افتاد که در رتبه 4 بیلبورد 200 قرار گرفت - اولین 10 نفر برتر آنها - و بیش از یک سال را در جدول سپری
