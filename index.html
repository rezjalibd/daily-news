<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۲۴ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">

      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

 ندهند، ممکن است حمله به جمهوری اسلامی را به تعویق بیندازد.", "date_str": "2026-11-14T14:05:27+00:00", "hash": "65d91eb81654bcd0", "title_fa": "رویترز: اگر تهران دست به اقدام تحریک‌آمیز نزند، ترامپ ممکن است حمله را به تعویق بیندازد", "summary_fa": "خبرگزاری رویترز به‌نقل از منابع آگاه گزارش داد دونالد ترامپ، رییس‌جمهوری آمریکا، به مشاوران ارشد خود گفته است اگر تهران یا حوثی‌های یمن اقدام تحریک‌آمیز تازه‌ای علیه واشینگتن انجام ندهند، ممکن است حمله به جمهوری اسلامی را به تعویق بیندازد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/bd994f3a4823c78a937b9b1b0bd3e750b9622beb-5460x3640.jpg?rect=0,387,5460,2867&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۳ آبان • ۱۷:۳۵"}, {"source": "Radio Farda", "title": "سفر رئیس موساد به آمریکا؛ مقام‌های امنیتی اسرائیل بر سر حمله دوباره به ایران «اختلاف دارند»", "link": "https://www.radiofarda.com/a/israel-mossad-chief-iran-strikes-security-dispute/33898641.html", "summary": "در پی سفر رئیس موساد به آمریکا برای رایزنی درباره ایران، رسانه‌های اسرائیل از ادامه تلاش نتانیاهو برای ازسرگیری حملات و اختلاف‌نظر مقام‌های ارشد امنیتی بر سر ضرورت حمله خبرمی‌دهند.", "date_str": "2026-11-14T14:44:23+00:00", "hash": "952aca4e34104c22", "title_fa": "سفر رئیس موساد به آمریکا؛ مقام‌های امنیتی اسرائیل بر سر حمله دوباره به ایران «اختلاف دارند»", "summary_fa": "در پی سفر رئیس موساد به آمریکا برای رایزنی درباره ایران، رسانه‌های اسرائیل از ادامه تلاش نتانیاهو برای ازسرگیری حملات و اختلاف‌نظر مقام‌های ارشد امنیتی بر سر ضرورت حمله خبرمی‌دهند. باراک راوید، خبرنگار اسرائیلی وب‌سایت آمریکایی اکسیوس، روز جمعه ۲۲ آبان به نقل از سه منبع آگاه گزارش داد که رومن گوفمن، رئیس موساد، برای دیدار با مقام‌های ارشد دولت دونالد ترامپ به واشینگتن رفته است. این سفر در شرایطی انجام شده که به نوشتهٔ اکسیوس، نتانیاهو در تلاش است رئیس‌جمهور آمریکا را به ازسرگیری عملیات نظامی گسترده علیه ایران متقاعد کند؛ درخواستی که ترامپ تاکنون در برابر آن مقاومت کرده است. بر اساس این گزارش، گوفمن با جان رتکلیف، رئیس سی‌آی‌ای، دیدار می‌کند و انتظار می‌رود در میامی نیز با استیو ویتکاف، فرستادهٔ ویژهٔ ترامپ، گفت‌وگو کند. موساد، سی‌آی‌ای و کاخ سفید از اظهارنظر دربارهٔ این گزارش خودداری کرده‌اند. در ادامهٔ انتشار این خبر، رسانه‌های اسرائیلی در روزهای جمعه و شنبه جزئیات بیشتری از اختلاف‌نظر مقام‌های سیاسی و امنیتی این کشور بر سر احتمال حملهٔ دوباره به ایران منتشر کردند. به گزارش این رسانه‌ها، نتانیاهو برخلاف دولت آمریکا چندان متقاعد نشده است که ادامهٔ تحریم‌های گسترده و محاصرهٔ دریایی بتواند به‌تنهایی مانع احیای توانایی‌های نظامی و هسته‌ای جمهوری اسلامی شود. نخست‌وزیر اسرائیل به‌ویژه نگران گزارش‌ها دربارهٔ تلاش تهران برای بازسازی برنامهٔ هسته‌ای و ازسرگیری تولید موشک‌های بالستیک است و معتقد است اسرائیل نباید اجازه دهد این توانایی‌ها بار دیگر گسترش یابد. شبکهٔ ۱۴ اسرائیل که از نتانیاهو حمایت می‌کند نیز در گزارشی به تلاش جمهوری اسلامی برای بازسازی توانایی‌های هسته‌ای و موشکی خود اشاره کرده و احتمال داده است که اسرائیل ناچار شود بدون مشارکت آمریکا به ایران حمله کند. نتانیاهو در سخنرانی‌های اخیر خود بارها بر ضرورت برطرف کردن آنچه «تهدید موجودیتی جمهوری اسلامی علیه اسرائیل» می‌نامد تأکید کرده و از تغییر حکومت ایران به‌عنوان یکی از اهداف", "image_url": "https://gdb.rferl.org/F1881922-FDD6-4C6A-AA40-87C6F329AB36.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۲۳ آبان • ۱۸:۱۴"}, {"source": "Radio Farda", "title": "رسانه‌های آمریکایی: ترامپ فعلاً تمایلی به حمله دوباره به ایران یا توافق فوری ندارد", "link": "https://www.radiofarda.com/a/trump-iran-military-strikes-economic-pressure-/33898629.html", "summary": "ترامپ در روزهای اخیر به مشاوران ارشد خود گفته است، در صورت نبود اقدامات تحریک‌آمیز تازه از سوی حکومت ایران یا حوثی‌ها در یمن، ممکن است از حملهٔ دوباره به ایران خودداری کند.", "date_str": "2026-11-14T14:07:39+00:00", "hash": "ba6f6601129770b8", "title_fa": "رسانه‌های آمریکایی: ترامپ فعلاً تمایلی به حمله دوباره به ایران یا توافق فوری ندارد", "summary_fa": "ترامپ در روزهای اخیر به مشاوران ارشد خود گفته است، در صورت نبود اقدامات تحریک‌آمیز ت       tech: [{"source": "Engadget", "title": "What the circled \"Z\" on Google Maps means", "link": "https://www.engadget.com/2311447/google-maps-circled-z-meaning/", "summary": "If you ve seen a circled capital Z on your Google Maps route, you should know what it means. It might save you from a ticket.", "date_str": "2026-11-14T16:00:00+00:00", "hash": "4516b09bd70fb86f", "title_fa": "دایره «Z» در Google Maps به چه معناست", "summary_fa": "اگر یک دایره بزرگ Z را در مسیر Google Maps خود دیده‌اید، باید معنی آن را بدانید. ممکن است شما را از یک بلیط نجات دهد. Nimrod Aldea افزودن Engadget در Google: منبع برگزیده Google Discover اگر اخیراً در حین استفاده از Google Maps فرصت رانندگی در اروپا را داشته‌اید، ممکن است یک نماد کوچک \"Z\" را در جزئیات مسیر خود مشاهده کرده باشید. برخی از رانندگان متوجه ظاهر شدن این نماد در اطلاعات مسیر خود شدند و آنلاین شدند تا بپرسند این نماد چیست. خوب، متأسفانه این نماد عبور از گورخر نیست و به معنای \"حالت خواب\" نیز نیست. Google Maps فقط به شما هشدار می دهد که مسیر شما از منطقه کم انتشار عبور می کند. بیش از 2 میلیارد نفر هر ماه از Google Maps برای پیمایش در سراسر جهان استفاده می کنند. اما با توجه به اینکه بسیاری از کشورهای مختلف قوانین جداگانه خود را در مورد رانندگی دارند، جای تعجب نیست که مردم با نمادهایی روبرو می شوند که برای آنها کاملاً جدید است. با این حال، نادیده گرفتن این نماد می تواند جریمه ای را به همراه داشته باشد، بنابراین آن را نادیده نگیرید. \"Z\" یک منطقه کم انتشار (LEZ) را در مسیر شما مشخص می کند. برای مثال، هنگام برنامه‌ریزی رانندگی به مرکز آمستردام، نماد زیر زمان سفر، درست در کنار خط \"منطقه کم انتشار آمستردام در مسیر\" ظاهر می‌شود. این اپلیکیشن هشدار می‌دهد خودروهایی که استانداردهای آلایندگی را رعایت نمی‌کنند جریمه می‌شوند، به رانندگان می‌گوید که بررسی کنند آیا خودروی آنها این استانداردها را دارد یا خیر و یک لینک به صفحه رسمی شهر اضافه می‌کند. این هشدارها در سال 2021 به Google Maps اضافه شدند و مناطق کم انتشار در آلمان، هلند، فرانسه، اسپانیا و بریتانیا را در اندروید و iOS پوشش دادند. هنگامی که برای اولین بار منتشر شد، نماد", " een airports. I also read that officia", "date_str": "2026-11-14T14:49:09+00:00", "hash": "f4f464234a11e8df", "title_fa": "من در حال پرواز بودم که FAA همه پروازها را زمین گیر کرد. همه چیز هرج و مرج بود و من ساعت ها روی آسفالت گیر کردم.", "summary_fa": "در میان هرج و مرج زمینگیر FAA در فرودگاه میامی گیر کردم. جنتری هیل من در ارتفاع 35000 پایی بودم که کاپیتانم گفت یک مشکل کنترل ترافیک هوایی باعث توقف پروازها شد. من و چند مسافر نگران بودیم که این موضوع مربوط به امنیت سایبری یا هوش مصنوعی باشد. ما در میامی فرود آمدیم اما ساعت ها نتوانستیم از هواپیما خارج شویم و در نهایت 600 دلار برای اتاق هتل پرداخت کردم. من بخش بزرگی از زندگی ام را به عنوان مسافر و روزنامه نگار مکرر در هواپیما می گذرانم، بنابراین به تاخیرهای معمول، اتصالات از دست رفته و تغییرات لحظه آخری پرواز که با سفرهای هوایی تجاری به وجود می آید، عادت کرده ام. اما من هرگز چیزی مانند قطعی فلج کننده کنترل ترافیک هوایی در روز جمعه، 13 نوامبر، که هزاران مسافر و خدمه را آواره کرد و بیش از 12500 پرواز را لغو کرد، تجربه نکرده بودم. زمانی که اداره هوانوردی فدرال پروازهای خروجی را در سراسر ایالات متحده متوقف کرد، در ارتفاع سفر دریایی بودم و از تعطیلات در جزیره کوراسائو در دریای کارائیب به سمت خانه ام در سالت لیک سیتی برمی گشتم. قبل از جمعه، FAA فقط دو بار در تاریخ مدرن دستور توقف زمینی در سراسر کشور را داده بود: یک بار در ژانویه 2023، پس از شکست یک سیستم هشدار خلبان کلیدی، و پس از حملات تروریستی 11 سپتامبر. با توجه به سابقه کمیاب، وقتی این خبر را شنیدم، هیجان زده نشدم که خودم را در میان هوا ببینم. چیزی که باید یک توقف سریع دو ساعته در میامی باشد، با تأخیر بی‌نظم یک شبه، با ساعت‌ها گذراندن روی آسفالتی که مسافران برای اتاق‌های ناپدید شده هتل و موجودی پرواز در حال مسابقه بودند، رو به رو شد. ما از تعطیلی سراسری در ارتفاع 35000 فوتی مطلع شدیم. باید چوب را می", "image_url": "https://i.insider.com/6af860f10cc3ffba8779d368?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۲۳ آبان • ۱۸:۱۹"}, {"source": "The Verge", "title": "Here are our favorite deals from REI’s giant Ho  up here . Now, the question of AI safety is everywhere . This summer, AI models from OpenAI and Anthropic broke out of their testing environments and hacked real companies. The CEOs of these frontier labs have since called for a slowdown and asked Washington for help, but the White House’s answer was a voluntary accord — one that relies in part on the kind of board accountability that failed at OpenAI. Anthropic is also about to go public, which will put a whole new set of market pressures on OpenAI’s biggest competitor. Helen has seen up close what happens when safety commitments run headlong into commercial incentives. And as she put it to me, if our hopes for the future depend on any one person being trustworthy, we’re in big trouble. So we talked about what we might do instead: what the labs are actually trying to build, whether AI alignment is a problem that can be solved, and what a smarter approach to AI regulation might look like. That includes how to think about China, which is the issue that looms large in every policy conversation about AI right now — especially now after the Jensen Huang affair . Just for clarity, Helen and I talked before Nvidia opened its investigation and Jensen ultimately resigned, so you won’t hear us talk about that directly. Before we get going, do me a favor and subscribe to Decoder on YouTube , where we put out new episodes every Monday and Thursday. Okay: Helen T", "date_str": "2026-11-14T15:00:00+00:00", "hash": "3771480df262797f", "title_fa": "یکی از اعضای هیئت مدیره OpenAI که سم آلتمن را برکنار کرد، می‌گوید ما هنوز نمی‌توانیم به مدیران عامل هوش مصنوعی اعتماد کنیم", "summary_fa": "سیاست هوش مصنوعی پادکست عضو هیئت مدیره OpenAI که سام آلتمن را برکنار کرد، می‌گوید ما هنوز نمی‌توانیم به مدیران عامل هوش مصنوعی اعتماد کنیم، هلن تونر از CSET می‌گوید اگر برنامه ایمنی هوش مصنوعی ما بر روی هر فردی باشد که برای درست کردن این موضوع به او اعتماد می‌شود، «معصوم شده‌ایم». Nilay Patel 14 نوامبر 2026، ساعت 15:00 UTC پیوند اشتراک گذاری Nilay ace aren't ideal for me. Although I'm happy living in Ireland , I sometimes long for warmer weather and a slower pace of life. So when I travel, I'm always wondering if my destination could become more than a vacation spot — maybe a place to retire to someday. In 2023, I spent a month seeing if Malta could be a potential forever home. Unfortunately, it wasn't a match for me, but it had so much going for it that I decided to try its charming sister island, Gozo. Gozo lies a few miles northwest of Malta and belongs to the same archipelago. It's just 26 square miles (roughly the size of Manhattan) and home to around 40,000 people. I first visited Gozo in 2012 and have returned a handful of times since then. On my most recent trip this September, I stayed in a gorgeous little villa in Xagħra, a small, historic town with a population of about 5,400. As much as I adore the Maltese island , my most recent trip there made me realize it might not be the perfect spot for me to retire. Gozo has great Mediterranean vibes and feels ideal for slow exploring Gozo has some incredible options for outdoor dining. Louise Slyth Gozo seemed to have many of the same draws as Malta, but with slightly fewer crowds and a slower pace of life. For one, English is widely spoken in both Malta and Gozo, which I appreciate. Gozo has lovely weather with about 300 days of sunshine a year and mostly mild temperatures. The island really does feel Mediterranean, with limestone buildings, beautiful churches, and endless sea views. It had a nice balance of rural beauty and bustling shops and eateries. People were friendly, the villages I've explored so far have all felt safe, and life seemed to move at an unhurried pace. The Visit Gozo website describes the island as \"developed just enough but not too much,\" which I think defines its charm. There are many things to see and do in Gozo, but the island didn't feel super aimed at tourists with a massive list of must-see attractions. Gozo has world-class diving, swimming at Ramla Bay, and leisurely boat rides along the coastline. T", "date_str": "2026-11-14T14:28:01+00:00", "hash": "c0e4dc467bf03e8a", "title_fa": "پس از رد کردن مالتا به عنوان مکانی برای بازنشستگی، زندگی در جزیره خواهر کوچکتر آن، گوزو را آزمایش کردم.", "summary_fa": "من واقعاً می‌خواستم مالتا کار کند، بنابراین Gozo را امتحان کردم - و در حالی که این یک مکان عالی برای تعطیلات بود، متوجه شدم که جایی نیست که بخواهم تمام وقت زندگی کنم. لوئیز اسلیث هنگام آزمایش مکان‌هایی برای بازنشستگی، من مالتا را رد کردم اما می‌خواستم جزیره خواهرش، گوزو را امتحان کنم. من عاشق آفتاب، آب و هوا و حال و هوای گوزو هستم، اما فکر نمی‌کنم بتوانم درازمدت در آنجا پیشرفت کنم. شیوع برخی اشکالات، نبود فرودگاه بین المللی و سرعت آهسته برای من ایده آل نیست. اگرچه از زندگی در ایرلند خوشحالم، اما گاهی اوقات آرزوی هوای گرمتر و سرعت پایین تر زندگی را دارم. بنابراین وقتی سفر می‌کنم، همیشه به این فکر می‌کنم که آیا مقصد من می‌تواند چیزی بیش از یک مکان تعطیلات باشد - شاید جایی برای بازنشستگی روزی. در سال 2023، یک ماه وقت گذاشتم تا ببینم آیا مالت می‌تواند یک خانه بالقوه برای همیشه باشد. متأسفانه، برای من مناسب نبود، اما آنقدر برایم جذاب بود که تصمیم گرفتم جزیره خواهر جذابش، گوزو را امتحان کنم. گوزو در چند مایلی شمال غربی مالت قرار دارد و متعلق به همان مجمع الجزایر است. این تنها 26 مایل مربع (تقریبا به اندازه منهتن) است و حدود 40000 نفر را در خود جای داده است. من اولین بار در سال 2012 از گوزو بازدید کردم و از آن زمان تاکنون چندین بار به این کشور بازگشته ام. در آخرین سفرم در سپتامبر امسال، در یک ویلای کوچک و زیبا در Xagħra، یک شهر کوچک و تاریخی با جمعیتی حدود 5400 نفر اقامت کردم. به همان اندازه که من جزیره مالت را دوست دارم، سفر اخیرم به آنجا باعث شد متوجه شوم که ممکن است مکان مناسبی برای بازنشستگی من نباشد. گوزو حال و هوای مدیترانه ای عالی دارد و برای کاوش آهسته احساس ایده آلی", "image_url": "https://i.insider.com/6aee299d8f37e8e0b5baad78?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۳ آبان • ۱۷:۵۸"}, {"source": "Business Insider", "title": "My parents raised 5 kids without losing their minds. They had a system for everything, from dinner to Christmas presents.", "link": "https://www.businessinsider.com/parents-five-kids-unusual-household-rules-schedules-2026-11", "summary": "The author (not pictured) was the youngest of five siblings Liderina/Getty Images I grew up as the youngest of five kids, and our parents relied on strict routines to manage us all. We each had assigned days for chores, cooking, walking the dog, and even sitting in the front seat. I used to resent all the rules, but now I appreciate the teamwork and patience they taught me. The ringing bell had the same effect as a break horn blowing in an industrial factory . Doors would slowly open along the corridor, and disheveled bodies stumbled out. At our house, 6:30 p.m. was dinner time. I can't remember when the bell was introduced, but it proved the most effective way to call five young teenagers down to the kitchen to eat. Despite regularly being called the Brady Bunch when out in public (particularly when in a line on moving escalators), five kids is actually quite a convenient number. Five weekdays were perfect for each person to have an allocated day for duties: to cook, to walk the dog, even to sit in the front seat of the car (an honor every teenager in the early 00s fought for). I'm the youngest, and so my day was Friday, which was a clear injustice because I was convinced I had to wait longer than everyone else. We all had a job to do Five children and two adults meant eating dinner was \"feeding time at the zoo,\" according to my dad. Yes, there was a one-serving-only policy in place, and messy plates were inevitable, but once we finished eating, we became a well-oiled machine. Someone collected the dirty dishes, someone washed up, someone dried, someone put items away, and someone cleaned the table. I remember an adult family friend joining us for dinner one evening, their eyes widening as we all stood in sync to start our jobs, rolled up our sleeves, and discussed the unfair compensation. The author was the youngest of five kids. Courtesy of the author We'd mumble that one day we'd form a union . Birthdays had a similar efficiency. In the morning, the person celebrating would have breakfast , then wait patiently in the lounge while we all mysteriously disappeared upstairs. In hushed tones, resentful about the gifts we weren't getting, a parent would hand each of us a present to carry. We'd then queue up in age order and slowly descend the stairs singing happy birthday in different pitches, the person in the lounge overacting their surprise as we finally came into view. Christmas was another meticulous affair. We'd watch as a parent burrowed through piles", "date_str": "2026-11-14T14:25:01+00:00", "hash": "f8a592b0c7faf81b", "title_fa": "پدر و مادر من 5 بچه را بدون اینکه عقلشان را از دست بدهند بزرگ کردند. آنها یک سیستم برای همه چیز داشتند، از شام گرفته تا هدایای کریسمس.", "summary_fa": "نویسنده (در تصویر نیست) کوچکترین از پنج خواهر و برادر لیدرینا/گتی ایماژ بود. هر کدام از ما روزهایی را برای کارهای روزمره، آشپزی، راه رفتن با سگ و حتی نشستن روی صندلی جلو تعیین کرده بودیم. قبلاً از همه قوانین ناراحت بودم، اما اکنون از کار گروهی و صبری که به من آموختند قدردانی می کنم. صدای زنگ همان تاثیر بوق شکستن در یک کارخانه صنعتی را داشت. درها به آرامی در امتداد راهرو باز می‌شدند و بدن‌های ژولیده بیرون می‌آمدند. در خانه ما، ساعت 18:30. وقت شام بود نمی‌توانم به یاد بیاورم که زنگ چه زمانی معرفی شد، اما ثابت کرد که مؤثرترین راه برای فراخوانی پنج نوجوان جوان به آشپزخانه برای صرف غذا بود. علیرغم اینکه معمولاً هنگام بیرون رفتن در انظار عمومی (مخصوصاً هنگامی که در یک صف در پله‌های برقی متحرک قرار می‌گیرید)، پنج بچه در واقع عدد بسیار مناسبی است. پنج روز هفته برای هر فرد مناسب بود تا یک روز اختصاص داده شده برای وظایف داشته باشد: آشپزی، راه رفتن با سگ، حتی نشستن در صندلی جلوی ماشین (افتخاری که هر نوجوان در اوایل دهه 00 برای آن می جنگید). من کوچکترین هستم، و بنابراین روز من جمعه بود، که یک بی عدالتی آشکار بود زیرا متقاعد شده بودم که باید بیشتر از بقیه منتظر بمانم. همه ما کاری داشتیم که باید انجام دهیم، به گفته پدرم، پنج کودک و دو بزرگسال به این معنی بود که خوردن شام «زمان غذا دادن در باغ وحش» بود. بله، یک خط مشی فقط یک وعده وجود داشت، و بشقاب های آشفته اجتناب ناپذیر بود، اما وقتی غذا را تمام کردیم، تبدیل به ماشینی شدیم که به خوبی روغن کاری شده بود. یکی ظرف های کثیف را جمع کرد، یکی شست، یکی خشک کرد، یکی وسایل را کنار گذاشت و دیگری میز را تمیز کرد. به یاد", "image_url": "https://i.insider.com/6ae8a386f3bee449b3d2a2bf?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۳ آبان • ۱۷:۵۵"}, {"source": "Business Insider", "title": "A woman on the cruise ship struck by a tanker said the riverboat started filling with water like the 'Titanic'", "link": "https://www.businessinsider.com/new-orleans-cruise-ship-riverboat-tanker-collision-passengers-2026-11", "summary": "Tamara Carrasco, a retired elementary school teacher from Atlanta, was on the ship when it was struck. Blake Paterson A riverboat was struck by a tanker in New Orleans on Friday, causing the ship to tip over and sink. Tamara Carrasco said the collision knocked her to the floor and water gushed into the ship. \"What was going through my mind was: we're going to die,\" she said. Tamara Carrasco was in the dining room of the American Heritage cruise ship , docked in the Port of New Orleans, when she spotted a tanker heading straight toward them. Carrasco, a retired elementary school teacher from Atlanta, was seated at a table by the windows so she could look out at the Mississippi River . She saw the tanker crossing under the bridge nearby and noticed it was lowering its anchor. \"I thought, 'Why would they be anchoring here?'\" she said. Her friend turned to her: \"It's not stopping. It's going to hit us.\" Carrasco was skeptical, until she saw the crew running across the tanker's deck \"like ants.\" \"What was going through my mind was: We're going to die,\" she said. The tanker, Atlantic Asphalt, crashed directly into the American Cruise Lines riverboat on Friday, causing the ship to topple over and sink as passengers rushed to evacuate. Several people ended up in the river and had to be pulled out by first responders. Of the nearly 200 people on board, 32 were transported to hospitals. None were critically injured, officials said. \"We have zero people unaccounted for, which truly is a miracle on the Mississippi,\" New Orleans Mayor Helena Moreno said at a press conference. Carrasco, 65, said when the tanker approached the riverboat , she ran to the opposite end to get as far away from the glass windows as possible. She found a nook on the other end of the ship where she braced herself. \"It hit so hard I flew to the ground,\" she said. The American Heritage riverboat toppled over after being struck by the Atlantic Asphalt tanker in New Orleans. Gerald Herbert/AP After the collision, she ran to the stairwell in the middle of the boat and could see into the dining room. The tanker, she said, had broken through the glass windows and water was pouring in. \"Seen the movie 'Titanic'? There was a big gash and water is flying in, and I said, 'Oh, this is going down,'\" she said. She ran up to the next floor and exited the cruise ship usinga gangplank. The crowd gathering on dry land was in shock. Carrasco said it was like after 9/11. \"We're all just kind of wandering in a daze", "date_str": "2026-11-14T14:18:21+00:00", "hash": "b8c225d85cc562ae", "title_fa": "یک زن در کشتی تفریحی که توسط یک تانکر مورد اصابت قرار گرفته است، گفت: قایق رودخانه مانند تایتانیک شروع به پر شدن از آب کرد.", "summary_fa": "تامارا کاراسکو، معلم بازنشسته مدرسه ابتدایی از آتلانتا، در کشتی بود که تصادف کرد. بلیک پترسون روز جمعه یک قایق رودخانه ای در نیواورلئان مورد اصابت یک تانکر قرار گرفت که باعث واژگونی و غرق شدن کشتی شد. تامارا کاراسکو گفت که برخورد او را به زمین زد و آب به داخل کشتی ریخت. او گفت: \"آنچه در ذهن من می گذشت این بود: ما خواهیم مرد.\" تامارا کاراسکو در اتاق ناهار خوری کشتی کروز هریتیج آمریکایی که در بندر نیواورلئان لنگر انداخته بود، یک نفتکش را دید که مستقیماً به سمت آنها می رفت. کاراسکو، معلم بازنشسته مدرسه ابتدایی از آتلانتا، پشت میزی کنار پنجره ها نشسته بود تا بتواند به رودخانه می سی سی پی نگاه کند. او تانکری را دید که از زیر پل در همان نزدیکی عبور می کرد و متوجه شد که لنگر خود را پایین می آورد. او گفت: \"من فکر کردم، \"چرا آنها باید اینجا لنگر بیاندازند؟\" دوستش رو به او کرد: \"قطع نمی شود. به ما ضربه می زند.\" کاراسکو مشکوک بود، تا اینکه دید خدمه از روی عرشه نفتکش «مثل مورچه» می دویدند. او گفت: \"آنچه در ذهن من می گذشت این بود: ما خواهیم مرد.\" نفتکش آتلانتیک آسفالت روز جمعه مستقیماً با قایق رودخانه آمریکن کروز لاین سقوط کرد و باعث شد کشتی واژگون شود و در حالی که مسافران برای تخلیه عجله داشتند کشتی غرق شود. چند نفر به رودخانه ختم شدند و نیروهای امدادی مجبور شدند آنها را بیرون بکشند. از حدود 200 سرنشین هواپیما، 32 نفر به بیمارستان منتقل شدند. به گفته مقامات، هیچ یک به شدت آسیب ندیده است. هلنا مورنو، شهردار نیواورلئان در یک کنفرانس مطبوعاتی گفت: \"ما هیچ نفری داریم که از آنها خبری نیست، که واقعاً یک معجزه در می سی سی پی است.\" کاراسکو 65 ساله گفت وقتی تانکر به قایق رودخانه", "image_url": "https://i.insider.com/6af7cf770cc3ffba8779d27f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۳ آبان • ۱۷:۴۸"}, {"source": "Business Insider", "title": "I watched Jensen Huang speak 9 days before his resignation. Two things stand out now.", "link": "https://www.businessinsider.com/jensen-huang-nvidia-management-succession-conference-talk-2026-11", "summary": "Jensen Huang in San Francisco on Nov. 3 without his famous leather jacket. Alistair Barr/Business Insider A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . Nine days before Jensen Huang resigned as Nvidia CEO, I sat near the front row at a San Francisco conference and watched him discuss the future of AI. Two things struck me that day. Both seem more significant now. First, Huang wasn't wearing his famous black leather jacket . Instead, as you can see in the photo I took, he wore a dark fabric zip-up. At the time, I thought it was funny. His jacket had become such a recognizable part of his image that seeing him without it was a bit jarring. Now, with revelations about his extramarital affairs and allegations involving a possible Chinese spy , I wonder whether the wardrobe change meant something. The initial allegations were already public by November 3. Of course, that's hindsight talking. Maybe a jacket is just a jacket. The second thing was more consequential. Fireworks AI CEO Lin Qiao (left) interviewing Jensen Huang at the startup s conference in San Francisco on Nov. 3, 2026. Alistair Barr/Business Insider Near the end of the conversation, Fireworks AI CEO Lin Qiao asked Huang about his unusual management style. He had 60 executives reporting directly to him . Huang explained that he'd designed this structure more than 30 years ago, when personal computers and email were transforming business. Rather than a traditional hierarchy, he wanted information flowing freely among executives empowered to make decisions. Then came the obvious question: What should a company's leadership structure look like in the AI age? \"I don't know the answer to that,\" Huang replied. At the time, I thought that was a bit odd. Nvidia is leading the AI revolution and Jensen leads Nvidia. Wouldn't he be thinking of how best to run this company in the future? Today, that exchange seems especially relevant. With Huang gone, Nvidia faces an extraordinary succession challenge . Sixty direct reports may have worked brilliantly under its founder. But it also means there isn't an obvious deputy to take the reins. If he'd had two or three direct reports, those people would have had more experience with more responsibility. But 60 direct reports, by definition, means that each one of those execs only had a small piece of Nvidia to oversee. Does this mean Nvidia is doomed? I'm not sure. The way Je", "date_str": "2026-11-14T14:00:01+00:00", "hash": "26b42fd391ba603e", "title_fa": "من سخنرانی جنسن هوانگ را 9 روز قبل از استعفا تماشا کردم. دو چیز در حال حاضر برجسته است.", "summary_fa": "", "image_url": "https://i.insider.com/6af67723cbe2120470735066?width=1200&format=jpeg", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۳ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "We sold our house and nearly everything we owned to move our kids to Malta. Parenting is different here.", "link": "https://www.businessinsider.com/moved-family-delaware-malta-parenting-differences-2026-11", "summary": "The author moved his family from the US to Malta. Courtesy of the author My wife and I had dreamed of raising our two kids abroad after learning about worldschooling. When our daughter's school introduced active shooter drills in kindergarten, we decided to leave. We moved to Malta, where our kids feel safe and experience new cultures and history every day. In the fall of 2024, our local school district in Delaware moved the mandatory ALICE drills to start in kindergarten, my daughter's year at the time. These are intense quarterly drills where the school simulates a shooting, training children to hide in case of an active shooting. My wife and I had talked about world schooling before this, and had a lot of discussions about what would work for our family. We decided it was time for our family to leave. We moved to Malta In April, 2025, following four months of intense paperwork, my son and I arrived in Malta as part of the digital nomad approval process. We had never set foot on the islands and honestly knew very little about the country we'd chosen based on internet research. We were there to secure a rental and finalize the paperwork. And two months later, my full family of four had sold nearly every possession, including our house and car. We boarded a plane, with just suitcases in hand. The author says parenting in Malta is different to parenting in the US. Courtesy of the author Life in Malta is very different. And by extension, parenting here is different too. Malta is a tiny archipelago between Sicily and Tunisia. The bulk of the population, including us, lives on the island of Malta, which is a densely populated stretch that feels like a city-state. The country's population is only a bit over 500,000, but 5 million tourists pass through annually, mostly in the summer. To some, Malta is a cruise stop. To others, a party destination. It is a country that is remarkably young: having just celebrated its 50 th anniversary of independence from Britain. And it is a land that is deeply, deeply old. The second-oldest human freestanding structures are Neolithic temples here on the island. History and modernity combine in every direction. Parenting in Malta feels different As a parent, the most obvious difference comes in a feeling of safety. I never worry when my kids are at school. Everywhere we've been on the island, whether at a local festa, a beach, or a historic site, we've found many other children, and my kids have made many friends. And for a small", "date_str": "2026-11-14T13:54:01+00:00", "hash": "7433d40566e711e7", "title_fa": "خانه و تقریباً هر چیزی که داشتیم را فروختیم تا بچه هایمان را به مالت منتقل کنیم. فرزندپروری در اینجا متفاوت است.", "summary_fa": "نویسنده خانواده خود را از ایالات متحده به مالت نقل مکان کرد. با حسن نیت از نویسنده من و همسرم رویای بزرگ کردن دو فرزندمان را در خارج از کشور پس از یادگیری در مورد مدرسه جهانی در سر داشتیم. وقتی مدرسه دخترمان تمرینات تیراندازی فعال را در مهدکودک معرفی کرد، تصمیم گرفتیم آن را ترک کنیم. ما به مالتا نقل مکان کردیم، جایی که بچه‌های ما احساس امنیت می‌کنند و هر روز فرهنگ‌ها و تاریخ جدیدی را تجربه می‌کنند. در پاییز 2024، منطقه مدرسه محلی ما در دلاور، تمرینات اجباری ALICE را برای شروع در مهدکودک، سال دخترم در آن زمان، منتقل کرد. این‌ها تمرین‌های سه ماهه شدیدی هستند که در آن مدرس e": "۱۱ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
