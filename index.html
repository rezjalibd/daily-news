 her pay for housing, that likely wouldn't be possible in the upcoming semester. Her first thought when she learned of Jodi's payment increase: how would she afford her rent? The 150% increase comes from President Donald Trump's student-loan repayment overhaul , which took effect on July 1. It eliminated the Biden-era SAVE repayment plan , which gave Jodi and millions of other borrowers affordable monthly payments. The administration said its changes are intended to curb excessive borrowing, simplify a complex repayment system, and compel colleges to lower their tuition. Over the past year, more than a thousand borrowers have told Business Insider that they're taking on extra work, postponing retirement, and worrying they'll default because of higher monthly bills. This story is part of Business Insider's \"Student Debt Spiral\" series, which explores how rising student debt is changing the financial futures of millions. Do you have a story to share? Fill out this form , and we'll be in touch. Read more of our student-loan coverage here: 'A bunch of red tape': Student-loan borrowers can't get clear answers from the companies that manage their debt Student-loan borrowers are pushing off retirement , delaying children, and taking on 3 jobs to prep for repayment changes New student-loan repayment glitches are throwing borrowers' budgets into limbo The payment is in Jodi's name, but it will reshape decisions across the household. As Olivia prepares to borrow more for college and Evelyn weighs an expensive career path, Jodi and Paul have to decide how much more wor", "date_str": "2026-09-12T10:30:01+00:00", "hash": "546c2b7c9c6069f4", "title_fa": "\"آسیب خواهد زد\": چگونه افزایش پرداخت وام دانشجویی آینده یک خانواده را تغییر می دهد", "summary_fa": "خانواده اسپراگ در حال تعیین فداکاری‌هایی هستند که باید برای پرداخت‌های بالاتر وام دانشجویی انجام دهند. آلیسا پوینتر برای BI Jodi و Paul Sprague دختران خود را با یک اصل راهنما بزرگ کردند: ارزش یک دلار را درک کنید. در دوران دبستان، اولین و اولیویا در مورد وام مسکن، بیمه ماشین و حسابداری اولیه در مسیر کارپول یاد می‌گرفتند. اوایل یک صبح ژوئن، قبل از اینکه ایولین 17 ساله و اولیویا 19 ساله برای کار تابستانی خود بروند، جودی آنها را با اخباری که بودجه با دقت مدیریت شده Spragues را زیر سوال می برد، نشست. پرداخت های وام دانشجویی که خانواده از سال 2015 برای آن در نظر گرفته بودند، از ماه سپتامبر از 404 دلار به 1014 دلار در ماه افزایش یافت. جودی اسپراگ و دخترش، اولیویا، هر دو با مشکلات دانشجویی مواجه هستند. آلیسا پوینتر برای BI او و اولیویا شروع به گریه کردند. اولیویا در آستانه شروع سال دوم تحصیلی خود در دانشگاه جورجیا جنوبی بود، و در حالی که والدینش به او کمک کردند تا هزینه مسکن را پرداخت کند، احتمالاً در ترم آینده این امکان وجود نخواهد داشت. اولین فکر او وقتی از افزایش دستمزد جودی مطلع شد: او چگونه می‌توانست اجاره خانه‌اش را تامین کند؟ این افزایش 150 درصدی ناشی از اصلاحات اساسی بازپرداخت وام دانشجویی دونالد ترامپ رئیس جمهور آمریکا است که از اول جولای اجرایی شد. این طرح بازپرداخت SAVE دوره بایدن را حذف کرد که به جودی و میلیون ها وام گیرنده دیگر پرداخت های ماهانه مقرون به صرفه را می داد. دولت گفت که تغییرات آن به منظور محدود کردن استقراض بیش از حد، ساده کردن سیستم پیچیده بازپرداخت و مجبور کردن کالج ها به کاهش شهریه است. در طول سال گذشته، بیش از هزار وام گیرنده به Business Insider گفته‌اند که مشغول به کار اضافی هستند، بازنشستگی را"}, {"source": "Business Insider", "title": "A developer emailed Claude Code's creator about AI slop. Boris Cherny wrote back.", "link": "https://www.businessinsider.com/claude-codes-creator-email-ai-slop-reply-2026-9", "summary": "Boris Cherny shared his response to a developer worried about AI slop. Bloomberg/Getty Images A developer emailed Claude Code creator Boris Cherny that AI coding had created \"friction.\" Cherny posted his full response to the engineer. The developer's job is to \"hold the bar on code quality,\" Cherny wrote. Developers are worried about AI. The creator of Claude Code has a response. On Thursday, Anthropic's Boris Cherny posted an email a developer wrote to him on X. The email was titled: \"What to do about slop?\" Cherny wrote that he receives emails like this every day and that he tries to respond to as many as possible. It's no surprise that developers are reaching out to Cherny with their worries. AI has radically changed coding , shifting job descriptions and turning engineers into reviewers. Some engineers love the ease; others call it lonely and tedious . In the email, the unnamed developer wrote that the shift to AI coding was causing \"friction.\" He broke it down into two views and asked Cherny to broker the dispute. The first view was a more restrained use of AI tools: We create code similar to before, accelerated by AI. We may not review all of it, but it should be reviewable. The person submitting the code should be able to explain it. It should be built in such a way to make it as easy to maintain — or easier — than before, by human agents. The second view was more permissive. This was the vibe coding position: We treat the code as a black box. We don't worry about it. We just check the output. The developer wrote that many people were incapable of doing option 1 — the more restrained approach — but worried about getting laid off . \"A lot of people are just forcing it,\" they wrote. Cherny posted his response in full. As for the two options the developer provided, Cherny said there was room for both. On the \"don't worry\" approach: Prototypes and other throw-away code can be treated as totally black box. If you're going to throw it away anyway, and if the blast radius of it breaking is low, it doesn't need to be perfect. And, on cautious reviewing: Production code written by Claude should have a higher bar than if it was written by a human. At Anthropic, we have many guardrails in place to make sure this is happening: lots of lint rules, lots of tests, Claude-driven end to end tests, Claude-powered fuzzers running daily, automated code reviews and security reviews, automated code refactoring, and so on. Without these, you can end up with a mess that is", "date_str": "2026-09-12T09:47:01+00:00", "hash": "ee3903b5b046aca1", "title_fa": "یک توسعه دهنده به خالق کلود کد در مورد AI slop ایمیل زد. بوریس چرنی پاسخ داد.", "summary_fa": "بوریس چرنی پاسخ خود را به توسعه دهنده ای که نگران شیب هوش مصنوعی بود به اشتراک گذاشت. بلومبرگ/گتی ایماژ یک توسعه دهنده به بوریس چرنی، خالق کلود کد، ایمیل زد که کدنویسی هوش مصنوعی \"اصطکاک\" ایجاد کرده است. چرنی پاسخ کامل خود را به مهندس ارسال کرد. چرنی نوشت، وظیفه توسعه‌دهنده این است که \"نقطه بار روی کیفیت کد را نگه دارد.\" توسعه دهندگان نگران هوش مصنوعی هستند. خالق کلود کد پاسخی دارد. روز پنجشنبه، بوریس چرنی از Anthropic ایمیلی را ارسال کرد که یک توسعه دهنده برای او در X نوشت. این ایمیل با عنوان: \"در مورد slop چه باید کرد؟\" چرنی نوشت که هر روز چنین ایمیل هایی دریافت می کند و سعی می کند تا جایی که ممکن است به آنها پاسخ دهد. جای تعجب نیست که توسعه دهندگان با نگرانی های خود به چرنی مراجعه می کنند. هوش مصنوعی به طور اساسی کدگذاری را تغییر داده است، شرح وظایف را تغییر داده و مهندسان را به بازبین تبدیل کرده است. برخی از مهندسان عاشق آسانی هستند. دیگران آن را تنها و خسته کننده می نامند. در این ایمیل، توسعه‌دهنده ناشناس نوشت که تغییر به کدنویسی هوش مصنوعی باعث \"اصطکاک\" شده است. او آن را به دو دیدگاه تقسیم کرد و از چرنی خواست که میانجی این اختلاف باشد. دیدگاه اول استفاده محدودتر از ابزارهای هوش مصنوعی بود: ما کدی شبیه به قبل ایجاد می کنیم که توسط هوش مصنوعی تسریع می شود. ممکن است همه آن را بررسی نکنیم، اما باید قابل بررسی باشد. شخصی که کد را ارسال می کند باید بتواند آن را توضیح دهد. باید به گونه‌ای ساخته شود که نگهداری آن توسط عوامل انسانی آسان‌تر - یا آسان‌تر - از قبل باشد. دیدگاه دوم سهل‌انگیزتر بود. این موقعیت کدگذاری vibe بود: ما با کد به عنوان یک جعبه سیاه برخورد می"}, {"source": "Business Insider", "title": "A veteran economist tells us why he sees a recession and a stock crash by the end of 2027", "link": "https://www.businessinsider.com/stock-market-crash-ai-bubble-recession-us-economy-outlook-2026-9", "summary": "Spencer Platt/Getty Images Henrik Zeberg says US stocks are headed for a final rally before the AI trade breaks down. The economist, who studies business cycles, sees signs the US is already on its way to a recession. His thesis involves the Nasdaq 100 plunging 72% from its peak, a decline on par with the dot-com crash. The K-shaped economy and the AI bubble are sowing the seeds of the next crash. That's the message from Henrik Zeberg, a Danish economist who sees a roller coaster ride ahead for the US economy and stock market. In his view, equities are headed for a massive \" blow-off top \" sometime before the end of the year, with stocks tumbling from their peaks the economy entering a recession. If thing play out the way his models are forecasting, it could involve the Nasdaq 100 soaring as high as 39,000 by late 2026 — an increase of around 32% — before plummeting back to around 10,600, its 2022 trough, he told Business Insider in a recent interview. A decline of that magnitude would mark a 72% crash from the peak Zeberg predicts, and would be on par with the dot-com crash that saw the Nasdaq 100 plunge 83% from its 2000 peak to the low in 2002. \"I think we will see a 2000-scenario ,\" the macro strategist at the investment firm Swissblock said, speculating that a sharp drop in markets could later be followed by broader distress in the financial system, such as in banking and private credit . \"I think that run is going to be quite devastating,\" he added of the AI bubble bursting. Zeberg, who's studied business cycles for 20 years, said he drew much of his thesis from an economic model he created, which analyzes the state of the economy and finds parallels with past cycles. The model — which correctly predicted the 2020 downturn and dismissed a recession when investors were worried about one in 2022 — now shows the US is heading into an economic contraction, Zeberg said. That's at odds with what recent economic data is showing on the surface. Hiring in the US blew past expectations in August, with the US adding 162,000 jobs, nearly triple economists' estimates. GDP growth, meanwhile, is expected to accelerate to 4.7% in the third quarter, more than triple its pace in the second quarter, according to the latest estimate from the Atlanta Fed. But those positive data points are largely a distortion stemming from the growing gap between top earnings and lower- to middle-income households, Zeberg said, pointing to signs that the real economy is struggling under", "date_str": "2026-09-12T09:40:01+00:00", "hash": "a0ab80223f5baebf", "title_fa": "یک اقتصاددان کهنه کار به ما می گوید که چرا تا پایان سال 2027 شاهد رکود و سقوط سهام است.", "summary_fa": "Spencer Platt/Getty Images هنریک زبرگ می‌گوید که سهام ایالات متحده قبل از شکسته شدن تجارت هوش مصنوعی به سمت یک صعود نهایی در حرکت است. این اقتصاددان که چرخه های تجاری را مطالعه می کند، نشانه هایی را مشاهده می کند که ایالات متحده در حال حاضر در مسیر رکود قرار دارد. تز او حاکی از سقوط 72 درصدی نزدک 100 از اوج خود است که در مقایسه با سقوط دات کام کاهش یافته است. اقتصاد K شکل و حباب هوش مصنوعی بذر سقوط بعدی را می کارند. این پیام هنریک زبرگ، اقتصاددان دانمارکی است که می‌بیند یک ترن هوایی برای اقتصاد و بازار سهام ایالات متحده در پیش است. به نظر او، سهام در زمانی قبل از پایان سال به سمت یک \"بالا\" بزرگ پیش می‌روند، با سقوط سهام از اوج خود، اقتصاد وارد رکود می‌شود. او در مصاحبه‌ای اخیر به Business Insider گفت: اگر اوضاع آن‌طور که مدل‌های او پیش‌بینی می‌کنند پیش برود، ممکن است نزدک 100 تا اواخر سال 2026 تا 39000 افزایش پیدا کند - افزایشی در حدود 32٪ - قبل از اینکه دوباره به حدود 10600 برسد، یعنی در سال 2022. کاهش به این بزرگی نشان‌دهنده سقوط ۷۲ درصدی از اوج پیش‌بینی‌های زبرگ خواهد بود و با سقوط دات‌کام برابری می‌کند که شاهد سقوط ۸۳ درصدی Nasdaq 100 از اوج خود در سال ۲۰۰۰ به پایین‌ترین سطح در سال ۲۰۰۲ بود. استراتژیست کلان شرکت سرمایه گذاری Swissblock گفت: \"من فکر می کنم ما شاهد سناریوی 2000 خواهیم بود.\"، با این حدس و گمان که افت شدید بازارها می تواند بعداً با مشکلات گسترده تر در سیستم مالی مانند بانکداری و اعتبارات خصوصی همراه شود. او درباره ترکیدن حباب هوش مصنوعی افزود: «من فکر می‌کنم این دویدن کاملاً ویرانگر خواهد بود. زبرگ که به مدت 20 سال چرخه های تجاری را مطالعه کرده است، گفت که"}, {"source": "Business Insider", "title": "Miss USA contestants sold vacation packages and asked fans to buy votes. It's the CEO's latest effort to stay relevant.", "link": "https://www.businessinsider.com/miss-usa-2026-changes-fan-voting-pageant-2026-9", "summary": "Contestants at the 2026 Miss USA pageant in Miami on August 27. Ivan Apfel/Getty Images The 2,400-seat Miami theater lit up like a Coldplay concert when the QR code dropped at the Miss USA pageant . A sea of phones — held up by supportive parents, partners, and past pageant queens — trained their cameras on the massive barcode being projected from center stage, ready to vote for their favored contestant. Twelve minutes on the clock: The countdown was on. Fingers tapped rapidly as the audience used their free vote or purchased more in bundles — $50 for 50, $250 for 250, $500 for 500 — alongside viewers at home. The top 20 contestants' headshots shifted around the leaderboard as the votes tallied live on the pageant's website, revealing exactly how far each woman was from the top spot. Two minutes left on the clock, a banner flashed across: Now, votes counted double. As the seconds ticked closer to zero, the votes burst in like a flash flood. The gap between first and second place was 1,794 votes at the 36-second mark. When the clock struck zero, it was more than 14,000. Fans have never had more of a say at Miss USA — especially if they're willing to pay. At last month's pageant, paid voting helped determine three top 20 spots, while a fourth went to the contestant who sold the most Westgate Resorts vacation packages, an unprecedented incentive that tied a contestant's placement to sales for a pageant sponsor. The winner was determined by a panel of six judges, including a mix of Miss USA and Miss Universe winners , but fans also had the opportunity to vote for the top 10 as the \"seventh judge.\" Nearly a dozen of this year's Miss USA contestants spoke to Business Insider about the changes. Some believe it's a savvy strategy by CEO Thom Brodeur , who took over the pageant in September 2025, to keep the business afloat and increase fan engagement, especially at a time when pageants struggle to remain relevant. Others worry the competition is turning into what one called a \"pay-to-play\" model, making it less accessible to women who don't have money or big social media followings. Nobody is arguing with Beyoncé or Taylor Swift's teams over the standing-room ticket prices of four-figures and higher, and we're not going to apologize either. Miss USA CEO Thom Brodeur \"There's a lot of fatigue,\" Miss Arizona Kaitlyn Humphrey told Business Insider. \"It's an expensive sport already, and it breaks my heart that a lot of people can't compete purely because there's such ", "date_str": "2026-09-12T09:32:01+00:00", "hash": "834414785668e53b", "title_fa": "شرکت کنندگان دوشیزه ایالات متحده آمریکا بسته های تعطیلات را فروختند و از طرفداران خواستند رای بخرند. این آخرین تلاش مدیر عامل برای مرتبط ماندن است.", "summary_fa": "شرکت کنندگان در مسابقه دوشیزه ایالات متحده آمریکا 2026 در میامی در 27 اوت. ایوان آپفل/ گتی ایماژ تئاتر 2400 نفری میامی مانند یک کنسرت Coldplay وقتی که کد QR در مسابقه دوشیزه ایالات متحده کاهش یافت، روشن شد. دریایی از تلفن‌ها - که توسط والدین حامی، شرکا و ملکه‌های مسابقه‌های گذشته در دست گرفته شده‌اند - دوربین‌های خود را بر روی بارکد عظیمی که از مرکز نمایش داده می‌شد، آموزش می‌دادند و آماده رای دادن به شرکت‌کننده مورد علاقه‌شان بودند. دوازده دقیقه روی ساعت: شمارش معکوس شروع شد. با استفاده از رای رایگان مخاطبان یا خرید بیشتر در بسته‌ها - 50 دلار برای 50، 250 دلار برای 250، 500 دلار برای 500 - در کنار بینندگان در خانه، انگشتان به سرعت ضربه می‌زدند. هد شات های 20 شرکت کننده برتر در حالی که آرا به طور زنده در وب سایت مسابقه جمع می شد، در سراسر جدول امتیازات جابه جا شد و دقیقاً نشان داد که هر زن چقدر از رتبه اول فاصله دارد. دو دقیقه مانده به ساعت، بنری چشمک زد: حالا، آرا دوبرابر شمارش شده است. با نزدیک‌تر شدن ثانیه‌ها به صفر، رأی‌ها مانند یک سیل ناگهانی سرازیر شدند. فاصله بین رتبه اول و دوم 1794 رای در 36 ثانیه بود. وقتی ساعت صفر شد، بیش از 14000 بود. طرفداران هرگز در Miss USA بیش از این حرفی برای گفتن نداشته اند - به خصوص اگر مایل به پرداخت باشند. در مسابقه ماه گذشته، رای گیری پولی به تعیین سه رتبه 20 برتر کمک کرد، در حالی که رتبه چهارم به شرکت کننده ای رسید که بیشترین بسته های تعطیلات وستگیت را فروخته بود، انگیزه ای بی سابقه که قرار گرفتن یک شرکت کننده را با فروش یک حامی مسابقه مرتبط کرد. برنده توسط هیئتی متشکل از شش داور، شامل ترکیبی از برندگان Miss USA و Miss"}, {"source": "Business Insider", "title": "Meet the NYC parents who feel like their toddlers got into Harvard", "link": "https://www.businessinsider.com/nyc-free-childcare-2k-two-year-olds-launches-overwhelmed-demand-2026-9", "summary": "A new 2-K student poses for her first day in the program. Paola Chapdelaine for BI When Zaire Wells's daughter was selected for a free childcare slot, it felt like the two-year-old \"got into Harvard.\" NYC Mayor Zohran Mamdani proposed free childcare for two-year-olds in his affordability-focused campaign. In March, he announced that it would launch with 2,000 seats in a handful of communities selected for economic need and childcare demand . Wells, a high school teacher, lives in one of the targeted areas. After a five-minute online application back in June, she and her partner were now tearfully dropping off their daughter for her first day at a Friends of Crown Heights center in Brooklyn. The family posed for pictures with a staged first-day backdrop, the two-year-old curiously examining her new surroundings. Wells' Harvard comparison was apt: Lisa Joseph-Mayers, who works with families in the center, said the program received 339 applications for 12 slots. That's a 3.5% acceptance rate; Harvard accepted 4.2% for the class of 2029. At least two parents called during school drop-off to see if they could snag a seat, and were told that the program was full. \"It's going to be like that for the rest of the week,\" Joseph-Mayers said. Since students with siblings already in the center were given preference, Joseph-Mayers said, some families claimed distant family connections to try to finagle a spot. Business Insider wants to hear from parents with kids in 2-K, or care centers offering the program. Contact this reporter at jkaplan@businessinsider.com if you have a story to share. The city has said that more than 5,700 applications were submitted for around 2,000 available seats. The popularity of the new program has become a double-edged sword, as some centers were reportedly left without the necessary funding to open, and others scrambled to determine whether they could secure bridge loans in time for the first day. For a program intended to expand sixfold by next year, it highlights a set of growing pains that are currently falling on providers. When asked about the funding delays, the city cited previous remarks by the mayor and Gov. Kathy Hochul. Lisa Joseph-Mayers fielded calls from parents hoping to get their kids into the program. Paola Chapdelaine for BI \"I think it's critically important that we both address longstanding issues in our New York City public school system and advance an agenda that makes it more affordable for families to stay in this ci", "date_str": "2026-09-12T09:30:03+00:00", "hash": "6a5cfdad6cce0609", "title_fa": "با والدین نیویورک که احساس می کنند کودکان نوپاشان وارد هاروارد شده اند آشنا شوید", "summary_fa": "یک دانش آموز جدید 2-K برای اولین روز خود در برنامه ژست می گیرد. پائولا چاپدلین برای BI هنگامی که دختر زایر ولز برای یک محل رایگان مراقبت از کودک انتخاب شد، احساس می‌کرد که دختر دو ساله «به دانشگاه هاروارد رفته است». زهران ممدانی، شهردار نیویورک، در کمپین متمرکز بر مقرون به صرفه بودن، مراقبت رایگان از کودکان دو ساله را پیشنهاد کرد. در ماه مارس، او اعلام کرد که با 2000 صندلی در تعداد انگشت شماری از جوامع انتخاب شده برای نیازهای اقتصادی و تقاضای مراقبت از کودکان راه اندازی خواهد شد. ولز، معلم دبیرستان، در یکی از مناطق مورد نظر زندگی می کند. پس از یک درخواست آنلاین پنج دقیقه‌ای در ژوئن، او و شریک زندگی‌اش اکنون با گریه دخترشان را برای اولین روزش در مرکز Friends of Crown Heights در بروکلین ترک می‌کردند. خانواده با یک پس‌زمینه صحنه‌سازی شده در روز اول عکس گرفتند، کودک دو ساله با کنجکاوی محیط جدیدش را بررسی می‌کرد. مقایسه هاروارد ولز مناسب بود: لیزا جوزف مایرز، که با خانواده ها در مرکز کار می کند، گفت که این برنامه 339 درخواست برای 12 اسلات دریافت کرده است. این نرخ پذیرش 3.5٪ است. هاروارد 4.2% را برای کلاس 2029 پذیرفته است. حداقل دو والدین در هنگام ترک مدرسه تماس گرفتند تا ببینند آیا می توانند صندلی را ببندند یا خیر، و به آنها گفته شد که برنامه پر است. جوزف مایرز گفت: \"تا آخر هفته همینطور خواهد بود.\" جوزف-مایرز گفت، از آنجایی که به دانش‌آموزانی که قبلاً خواهر و برادرشان در مرکز بودند، اولویت داده می‌شد، برخی از خانواده‌ها ادعا کردند که ارتباط خانوادگی دوری دارند و سعی می‌کنند به جایی برسند. Business Insider می‌خواهد از والدین دارای فرزند در 2-K یا مراکز مراقبتی که این برنامه را ارائه می‌دهند بشنود. اگر داستانی برای به اشتراک گذاشتن دارید با این خبرنگار"}, {"source": "Business Insider", "title": "A single mom works as a makeup artist and NYC real estate broker. Here's how she affords life in the city.", "link": "https://www.businessinsider.com/nyc-broker-real-estate-affordability-2026-9", "summary": "Violetta Kruglyak, 44, is a real estate broker and makeup and hair stylist living in NYC. Marissa Alper for BI Violetta Kruglyak thrives in NYC real estate by hustling for deals in a competitive market. Originally from Ukraine, Kruglyak balances her real estate career with raising her son in NYC. Despite fluctuating income, Kruglyak stays motivated by focusing on financial growth and success. Working in NYC real estate , brokering deals for the rich and famous in one of the most desirable property markets in the world, is a \"glamorous\" business. Yet, for broker Violetta Kruglyak, that does not translate to a glamorous life. For her, breaking into the real estate world is defined by one word: hustle. She might work for a firm that sells luxury Manhattan townhouses — but there is a lot of behind-the-scenes work, tight budgeting, and trial and error that go into being successful in the competitive and dynamic NYC real estate business. Kruglyak, 44, originally from Odessa, Ukraine, moved to NYC in 2011 after getting married, having taught herself English while growing up. Fifteen years later, she still thinks in Russian, raises her 17-year-old son as a single mother, owns her dream sports car, and has worked her way up to become a make-up and hair stylist and a broker at luxury residential and commercial brokerage firm Nest Seekers International. Violetta Kruglyak started working in real estate in 2024 and aims to continue growing as a broker at Nest Seekers International. Marissa Alper for BI Kruglyak is one of the people Business Insider has interviewed for our Cost of the City series, where we dive into the lives of New Yorkers and the trade-offs they face to stay in one of the most expensive cities in the country. How has your experience living and affording New York City been? What challenges have you faced and how have you adapted? Talk to a reporter about your experience: reach out to mros@businessinsider.com or fill out this form so we can contact you. There have been times when Kruglyak has considered moving away from NYC, especially when she was struggling financially. In 2020, after losing her last full-time job as a beauty advisor at Nordstrom, she went into credit card debt to make ends meet. This is when she decided to pursue a career with a higher financial ceiling. After watching the first episode of \"Owning Manhattan,\" a reality TV show that follows NYC celebrity real estate broker Ryan Serhant , she signed up for a course to get her broker's ", "date_str": "2026-09-12T09:30:02+00:00", "hash": "86c03e1fc9a41e48", "title_fa": "یک مادر مجرد به عنوان یک آرایشگر و دلال املاک در نیویورک کار می کند. در اینجا نحوه زندگی او در شهر است.", "summary_fa": "ویولتا کروگلیاک، 44 ساله، یک دلال املاک و آرایشگر و آرایشگر است که در نیویورک زندگی می کند. Marissa Alper برای BI Violetta Kruglyak با تلاش برای معاملات در یک بازار رقابتی در املاک و مستغلات نیویورک رشد می کند. کروگلیاک که اصالتاً اهل اوکراین است، شغل خود در زمینه املاک و مستغلات را با بزرگ کردن پسرش در نیویورک متعادل می کند. با وجود نوسان درآمد، کروگلیاک با تمرکز بر رشد مالی و موفقیت انگیزه خود را حفظ می کند. کار در املاک و مستغلات نیویورک، معاملات دلالی برای افراد ثروتمند و مشهور در یکی از مطلوب ترین بازارهای ملک در جهان، یک تجارت \"پر زرق و برق\" است. با این حال، برای کارگزار Violetta Kruglyak، این به معنای زندگی پر زرق و برق نیست. برای او، ورود به دنیای املاک و مستغلات با یک کلمه تعریف می شود: شلوغی. او ممکن است برای شرکتی کار کند که خانه‌های شهری مجلل منهتن را می‌فروشد - اما کارهای پشت صحنه زیادی، بودجه‌بندی فشرده، و آزمون و خطا وجود دارد که باعث موفقیت در تجارت رقابتی و پویای املاک نیویورک می‌شود. کروگلیاک، 44 ساله، اصالتاً اهل اودسا، اوکراین، در سال 2011 پس از ازدواج به نیویورک نقل مکان کرد، زیرا در دوران رشد خود انگلیسی را آموزش داده بود. پانزده سال بعد، او هنوز به زبان روسی فکر می‌کند، پسر 17 ساله‌اش را به‌عنوان یک مادر مجرد بزرگ می‌کند، صاحب ماشین اسپرت رویایی‌اش می‌شود، و تا یک آرایشگر و آرایشگر و دلال در شرکت کارگزاری تجاری و مسکونی لوکس Nest Seekers International تلاش کرده است. Violetta Kruglyak کار در املاک و مستغلات را در سال 2024 آغاز کرد و قصد دارد به عنوان یک کارگزار در Nest Seekers International به رشد خود ادامه دهد. Marissa Alper برای BI Kruglyak یکی از افرادی است که Business Insider برای سریال Cost of the"}, {"source": "Business Insider", "title": "I replaced my boss with AI", "link": "https://www.businessinsider.com/ai-replaced-my-boss-helpful-tasks-bad-manager-2026-9", "summary": "Ryan Kailath; Getty Images; BI This summer, we decided it was time to outsource my boss. Well, really, I \"replaced\" my boss with AI, working with a chatbot trained in his image. RyanBot, named for its human counterpart, turned out to be an existential rumination on leadership. My boss had a proposal: It was time to replace him with AI . It was late spring, following months of AI-attributed layoffs across the economy that left workers wondering: Am I next? In the name of journalism, my editor and direct manager, Ryan Kailath , agreed to be a guinea pig. I'm an AI skeptic , but some aspects of \"RyanBot\" excited me. It wouldn't be busy with meetings, lunch breaks, or other reporters. It could read every line of a 100-page data report and provide feedback within seconds. I could see how having a second brain trained on my editor's preferences and proclivities might be helpful. While that proved true sometimes, working with my boss's AI clone taught me the value of skills I didn't realize were crucial in a manager until they were gone. I had accidentally stumbled upon one of the biggest questions in our AI-workplace age. \"It's going back to our roots of understanding who a manager is,\" said Emily Campion, an associate professor of management and entrepreneurship at the University of Iowa. \"What is the goal of a manager in an organization? Or to make it even maybe a little more philosophical: What is a leader?\" And if you're wondering, Ryan recused himself from editing this story, though he did fact-check the final draft. How we set up my ChatGPT boss At the end of May, Ryan and I sat down with ChatGPT's Codex . He tweaked its settings to have a pragmatic voice and gave it two essay-length instruction manuals. One detailed who he is, including his communication style and professional motivations. The other was about how he worked, with instructions on how the chatbot made in his image should think, assess, and provide feedback. For example, he wrote that his bot-twin should \"encourage reporters to argue for their ideas if they believe in them.\" I tried to send Ryan and RyanBot the same story pitches, messages, questions, and drafts, then compared their responses for the next four months. Every time I talked with friends about work, I had a shadow boss in the back of my mind: a chatbot that I knew was ready to edit me at any hour of the day. This was going to get weird. Where AI couldn't replace my boss What surprised me most was how quickly RyanBot turned into a", "date_str": "2026-09-12T09:30:01+00:00", "hash": "fa1d9726d9910ef3", "title_fa": "من رئیسم را با هوش مصنوعی جایگزین کردم", "summary_fa": "رایان کایلات; گتی ایماژ; BI امسال تابستان، تصمیم گرفتیم که زمان آن رسیده است که رئیسم را برون سپاری کنیم. خوب، واقعاً، من رئیسم را با هوش مصنوعی «جایگزین» کردم و با یک چت بات آموزش دیده در تصویر او کار می کردم. RyanBot که به خاطر همتای انسانی خود نامگذاری شد، یک نشخوار وجودی در مورد رهبری بود. رئیس من یک پیشنهاد داشت: وقت آن رسیده بود که او را با هوش مصنوعی جایگزین کنم. اواخر بهار بود، پس از ماه‌ها اخراج‌های ناشی از هوش مصنوعی در سراسر اقتصاد که کارگران را متعجب کرد: آیا من بعدی هستم؟ به نام روزنامه نگاری، سردبیر و مدیر مستقیم من، رایان کایلات، پذیرفت که یک خوکچه هندی باشد. من یک شکاک به هوش مصنوعی هستم، اما برخی از جنبه های \"RyanBot\" من را هیجان زده کرد. با جلسات، استراحت‌های ناهار یا سایر خبرنگاران مشغول نیست. این می تواند هر خط از یک گزارش داده 100 صفحه ای را بخواند و در عرض چند ثانیه بازخورد ارائه دهد. می‌توانستم ببینم چگونه داشتن مغز دومی که بر روی ترجیحات و تمایلات ویراستار من آموزش دیده باشد، می‌تواند مفید باشد. در حالی که گاهی اوقات این درست بود، کار با کلون هوش مصنوعی رئیسم به من ارزش مهارت هایی را آموخت که تا زمانی که از بین نرفتند در یک مدیر متوجه نمی شدم. من به طور تصادفی با یکی از بزرگترین سوالات در عصر هوش مصنوعی در محل کارمان برخورد کردم. امیلی کمپیون، دانشیار مدیریت و کارآفرینی در دانشگاه آیووا، می‌گوید: «این به ریشه‌های ما در درک یک مدیر برمی‌گردد. «هدف یک مدیر در یک سازمان چیست؟ یا برای اینکه حتی شاید کمی فلسفی‌تر شود: رهبر چیست؟» و اگر تعجب می‌کنید، رایان از ویرایش این داستان خودداری کرد، اگرچه پیش‌نویس نهایی را بررسی کرد. چگونه رئیس ChatGPT خود را راه‌اندازی کردیم در پایان ماه"}, {"source": "Business Insider", "title": "Indeed's CEO wants to break this 'vicious cycle' in hiring", "link": "https://www.businessinsider.com/indeed-ceo-help-job-seekers-ai-2026-9", "summary": "Some job seekers report applying for roles and not hearing back, while employers complain about unresponsive candidates, Indeed s CEO said. Connect Images/Getty Images Indeed CEO Hisayuki Idekoba wants to make it easier for those who aren't recruited to find a job. He said that better matching job seekers with open roles could disrupt a \"vicious cycle.\" It comes as technology is creating an AI-to-AI loop in hiring, one recruiter said. Hisayuki Idekoba hears regularly about how broken hiring can feel . As head of the job platform Indeed, job seekers tell him they have applied to roles only to get nothing back, while employers complain about unresponsive candidates and surging application volumes, thanks in part to AI bots that flood open roles with résumés. \"It's a vicious cycle,\" Idekoba said. He wants to break that loop by making Indeed's matching tools feel more like help from a recruiter for people applying cold. That means guiding job seekers toward roles where they are more likely to gain traction, while helping employers focus on applicants who are serious and relevant. Idekoba said better matching could discourage fruitless applications. He gave the example of a restaurant worker applying for a $200,000 engineering job rather than pursuing a more appropriate restaurant-management position. Ultimately, Idekoba said, the goal is to make better matches on both sides of the process. \"How can we make sure job seekers are a real person, and it's not an AI application, and they're serious, and they're qualified,\" he said. \"And how can we have real employers who are really trying to fill positions?\" Indeed is navigating some of the same tensions Idekoba described. In July, it began a limited US test of Apply For Me, a tool that could automatically submit applications for job seekers. About a month later, it paused the feature after receiving feedback, saying it would instead focus on having users review drafted applications before hitting \"submit.\" The other 96% Questions about AI's role in the job search are unfolding in a labor market where few people are changing jobs. Overall job postings on Indeed were 1.8% above their pre-pandemic level in mid-August, though postings in areas like software development remain lower, underscoring how uneven conditions can be for people hunting for a job. Idekoba said Indeed data show that only 4% of US job changers, with at least a high-school degree, switched jobs last year with the help of a recruiter contacting them.", "date_str": "2026-09-12T09:23:01+00:00", "hash": "63e03130f534f225", "title_fa": "مدیرعامل Indeed می خواهد این «چرخه معیوب» را در استخدام بشکند", "summary_fa": "مدیرعامل Indeed گفت، برخی از جویندگان کار گزارش می دهند که برای نقش ها درخواست می دهند و پاسخ نمی دهند، در حالی که کارفرمایان از نامزدهای پاسخگو شکایت دارند. Connect Images/Getty Images در واقع هیسایوکی ایدکوبا، مدیر عامل شرکت، می‌خواهد کار را برای کسانی که استخدام نمی‌شوند آسان‌تر کند. او گفت که تطبیق بهتر کارجویان با نقش‌های باز می‌تواند «چرخه معیوب» را مختل کند. یکی از استخدام‌کنندگان می‌گوید این در حالی است که فناوری در حال ایجاد حلقه هوش مصنوعی در استخدام است. هیسایوکی ایدکوبا مرتباً در مورد احساس شکست استخدامی می شنود. در واقع، به عنوان رئیس پلتفرم شغلی، جویندگان کار به او می‌گویند که فقط برای اینکه چیزی پس نگیرند، برای نقش‌ها درخواست داده‌اند، در حالی که کارفرمایان از نامزدهای پاسخگو و افزایش حجم درخواست‌ها شکایت دارند، تا حدی به لطف ربات‌های هوش مصنوعی که نقش‌های باز را پر از رزومه می‌کنند. ایدکوبا گفت: «این یک چرخه معیوب است. او می خواهد این حلقه را با ایجاد حس تطبیق ابزارهای Indeed بیشتر شبیه کمک یک استخدام کننده برای افرادی که از سرما استفاده می کنند، بشکند. این بدان معنی است که جویندگان کار را به سمت نقش هایی هدایت می کند که در آن بیشتر مورد توجه قرار می گیرند، در حالی که به کارفرمایان کمک می کند روی متقاضیانی که جدی و مرتبط هستند تمرکز کنند. Idekoba گفت تطابق بهتر می تواند برنامه های بی نتیجه را منصرف کند. او مثالی زد که یک کارگر رستوران برای شغل مهندسی 200000 دلاری به جای دنبال کردن موقعیت مناسب تری در مدیریت رستوران درخواست داد. در نهایت، ایدکوبا گفت، هدف این است که مسابقات بهتری را در هر دو طرف روند انجام دهیم. او گفت: \"چگونه می توانیم مطمئن شویم که جویندگان کار یک شخص واقعی هستند، و این یک برنامه کاربردی هوش مصنوعی نیست، و آنها جدی"}, {"source": "Business Insider", "title": "United Airlines CEO says he sleeps 8 ½ hours a night and limits meetings to 'no more than 4 hours a day’", "link": "https://www.businessinsider.com/united-airlines-ceo-schedule-meetings-sleep-scott-kirby-2026-9", "summary": "United CEO Scott Kirby says he makes sure to carve out time in his schedule to read and sleep. EWR via Getty Images United Airlines CEO Scott Kirby doesn't have time for endless meetings. Instead, he sleeps eight and a half hours a day and reads roughly 2 books a week. Does his advice change how you would structure your day? Don't think that United Airlines CEO Scott Kirby is going to sit through your slide deck. \"If you want to send a deck, send it to me in advance, and then we're just going to talk about it, but you're not going to read slides to me,\" Kirby told Semafor's \"CEO Signal\" podcast. Kirby is fiercely protective of his schedule. That's why he caps meetings at four hours per day, though he said he averages less. It means keeping the meetings he does have quick and conversational. \"That gives me time to think,\" he said. \"The further you go in your career, certainly by the time you're the CEO, your job is not to work hard. It's to think hard.\" In Kirby's schedule, \"Sleep is the number one priority.\" He said he gets eight and a half hours a night. He also has a rotating set of four workouts, but if he's traveling and his schedule is compressed, it's sleep that remains the key. The United CEO said he wakes up at 5:30 am. He doesn't need an alarm. He'll look at emails, but \"that's like five minutes.\" As for the rest of the day, Kirby said he devotes three hours to reading. \"I read The Wall Street Journal cover to cover and probably 15 minutes worth of The New York Times,\" he said. \"Reading cover to cover, I find all kinds of interesting stuff that I would've never known if I wouldn't have searched for it.\" Most afternoons, Kirby will also squeeze in a 15-to 20-minute nap. On top of that, Kirby said he has five magazines he'll look through, depending on when they arrive. He also said he reads about two books a week. His favorite genre is science fiction. \"But it's really hard to find good science fiction,\" he said. \"Isaac Asimov is my favorite. The best science fiction I've read in the last 20 years was probably ' The Three-Body Problem.'\" In a 2025 interview, Kirby detailed some of the things he cuts from his life to save time for what matters. \"I just naturally don't want to waste time,\" Kirby told former Fast Company editor-in-chief Bob Safian during an interview for Safian's \"Rapid Response\" podcast. \"I'm not on social media. What a colossal waste of time on social media. I don't do that. I don't watch TV.\" Kirby, who has seven kids, said when he'", "date_str": "2026-09-12T09:19:01+00:00", "hash": "36e4edd0e230af4f", "title_fa": "مدیر عامل شرکت هواپیمایی یونایتد می گوید که 8 ساعت و نیم در شبانه روز می خوابد و جلسات را به \"بیش از 4 ساعت در روز\" محدود می کند.", "summary_fa": "اسکات کربی، مدیرعامل یونایتد می‌گوید که مطمئن است زمانی را برای خواندن و خوابیدن در برنامه خود اختصاص می‌دهد. EWR از طریق Getty Images United Airlines، اسکات کربی، زمانی برای جلسات بی پایان ندارد. در عوض او روزی هشت ساعت و نیم می خوابد و تقریباً 2 کتاب در هفته می خواند. آیا توصیه های او نحوه ساختار روز خود را تغییر می دهد؟ فکر نکنید که اسکات کربی، مدیر عامل شرکت هواپیمایی یونایتد ایرلاینز قرار است در عرشه سرسره شما بنشیند. کربی به پادکست «سیگنال مدیر عامل» سمافور گفت: «اگر می‌خواهید یک عرشه بفرستید، آن را از قبل برای من بفرستید، و سپس ما فقط در مورد آن صحبت می‌کنیم، اما شما برای من اسلاید نمی‌خوانید». کربی به شدت از برنامه خود محافظت می کند. به همین دلیل است که او جلسات را با چهار ساعت در روز تعطیل می کند، اگرچه او می گوید میانگین کمتری دارد. این بدان معناست که جلساتی را که او انجام می دهد سریع و مکالمه نگه دارد. او گفت: «این به من زمان می‌دهد تا فکر کنم. \"هرچه در حرفه خود جلوتر بروید، مطمئناً تا زمانی که مدیرعامل هستید، کار شما سخت کار کردن نیست، بلکه سخت فکر کردن است.\" در برنامه کربی، \"خواب اولویت شماره یک است.\" گفت شبی هشت ساعت و نیم وقت دارد. او همچنین یک ست چرخشی متشکل از چهار تمرین دارد، اما اگر در سفر باشد و برنامه‌اش فشرده شده باشد، این خواب است که کلید آن باقی می‌ماند. مدیرعامل یونایتد گفت که ساعت 5:30 صبح از خواب بیدار می شود. او به زنگ هشدار نیاز ندارد. او به ایمیل‌ها نگاه می‌کند، اما \"مثل پنج دقیقه است.\" در مورد بقیه روز، کربی گفت که سه ساعت را به مطالعه اختصاص می دهد. او گفت: «من جلد وال استریت ژورنال را تا روی جلد خواندم و احتمالاً 15"}, {"source": "Business Insider", "title": "Why everyone in tech is suddenly talking about LARPing", "link": "https://www.businessinsider.com/tech-startup-founders-larp-definition-garry-tan-ai-2026-9", "summary": "The term LARP comes from live action role play. Techies use it to denote bad founder behavior. 9:00-9:30 p.m., ET/PT Startup founders online keep calling out \"LARPers.\" The term started as an acronym for \"live action role play,\" but has grown to replace words like \"poser.\" Techies use it to refer to founders who prioritize social media clout over startup success. It's time to add another word to the founder dictionary. The term \"LARP\" started as an acronym for live action role play . LARPers wore costumes and adopted characters, imagining a video game-like world in real life. Then the internet adopted it, making it a stand-in for terms like \"poser\" or \"faker.\" Now, the term is all the rage in startup land. A LARPer is someone who's playing founder more than actually being one. They loudly flex their work and the circles they run in, rather than fighting for customers. Y Combinator CEO Garry Tan fashioned it into a warning: \"Be earnest, don't larp.\" The anatomy of a LARPing founder Intercom cofounder Des Traynor warned about it in a September email to Business Insider : \"Look, you get one shot at this life, don't waste it LARPing as a startup founder for followers.\" Indeed, the founder-influencer type is growing — and it's hard to distinguish earnest marketing from performative hype-cycling. Is that 996 post a real portrayal of your hustle, or is it merely grindslop ? grab 10 founders you know book a mansion in bali with a home gym hire a private chef lock the fuck in 10x your revenue in 30 days larp pic.twitter.com/sY313TYcF5 — Gaurav (@gauravsbuilding) September 11, 2026 Posting about 996 on LinkedIn — but having an ultra-high screen time spent on the X app — was on Christian Di Bratto's list of attributes of an LARPing founder. Others he listed were sleeping on the floor of a WeWork and quoting Paul Graham essays like scripture. Graham himself has commented on the rise of LARPers and how difficult it is to spot them. He responded to a comment accusing Y Combinator of being full of LARP. \"YC is pretty good at filtering them out at this point, but it's inevitable that a few will slip in,\" Graham wrote. \"Especially among the younger founders, where larping is often indistinguishable from inexperience.\" Google search interest in the term larp is up 200% year-over-year. Screenshot via Google Tan asked Sam Altman about the LARPing accusations at YC Startup School in July. (Rather than pronouncing the acronym, Tan spelled out the words — \"live action role play\"", "date_str": "2026-09-12T09:17:01+00:00", "hash": "170fbfca8be8e576", "title_fa": "چرا همه در فن آوری به طور ناگهانی در مورد LARPing صحبت می کنند", "summary_fa": "اصطلاح LARP از بازی نقش آفرینی زنده می آید. فناوران از آن برای نشان دادن رفتار بد بنیانگذار استفاده می کنند. از ساعت 9:00 تا 9:30 بعد از ظهر، بنیانگذاران استارت‌آپ ET/PT به صورت آنلاین مدام «LARPers» را صدا می‌زنند. این اصطلاح به عنوان مخفف \"بازی نقش اکشن زنده\" شروع شد، اما به جای کلماتی مانند \"پوزر\" رشد کرد. فناوران از آن برای اشاره به بنیان‌گذارانی استفاده می‌کنند که نفوذ رسانه‌های اجتماعی را بر موفقیت استارت‌آپ‌ها ترجیح می‌دهند. وقت آن است که یک کلمه دیگر به فرهنگ لغت موسس اضافه کنید. اصطلاح \"LARP\" به عنوان مخفف بازی نقش اکشن زنده شروع شد. LARPers لباس‌ها و شخصیت‌های پذیرفته‌شده می‌پوشیدند و دنیایی شبیه بازی ویدیویی را در زندگی واقعی تصور می‌کردند. سپس اینترنت آن را پذیرفت و آن را به عنوان جایگاهی برای عباراتی مانند \"poser\" یا \"faker\" تبدیل کرد. اکنون، این اصطلاح در سرزمین استارت‌آپ‌ها رایج است. یک LARPer کسی است که بیشتر از اینکه واقعاً یک بنیانگذار باشد، نقش بنیانگذار را بازی می کند. آنها به جای اینکه برای مشتریان بجنگند، با صدای بلند کار خود و حلقه هایی را که در آن اداره می کنند، تغییر می دهند. مدیر عامل Y Combinator، گری تان، آن را به عنوان یک هشدار در نظر گرفت: \"جدی باشید، لنگ نزنید.\" آناتومی یک بنیانگذار LARPing، یکی از بنیانگذاران Intercom، Des Traynor در ایمیلی در سپتامبر به Business Insider در مورد آن هشدار داد: \"ببینید، شما یک شات به این زندگی خواهید داشت، آن را هدر ندهید LARP به عنوان یک بنیانگذار استارت آپ برای دنبال کنندگان.\" در واقع، نوع بنیانگذار-اینفلوئنسر در حال رشد است – و تشخیص بازاریابی جدی از هیپ دوچرخه‌سواری عملکردی دشوار است. آیا آن پست 996 تصویری واقعی از شلوغی شماست، یا صرفاً grindslop است؟ 10 بنیان‌گذار را که می‌شناسید برای رزرو یک عمارت در بالی با یک باشگاه ورزشی"}, {"source": "Business Insider", "title": "The FIRE crowd might be making some lofty assumptions about their path to retirement", "link": "https://www.businessinsider.com/coast-fire-financial-independence-retire-early-401k-average-stock-returns-2026-9", "summary": "Federico Gambarini/picture alliance via Getty Images FIRE and its variants require some number crunching to know if it's a viable path. \"Coast FIRE\" involves saving aggressively early on to enjoy some degree of financial freedom before retirement. But those aspiring to this version of FIRE may not be taking into account a few key risks, finance pros say. If the army of personal finance influencers out there has managed to infiltrate your social media algorithms, you've likely come across the concept of \" Coast FIRE. \" It's an approach to retirement savings that lets you start to enjoy some form of financial freedom in the decades before retirement without having to stick to a rigorous savings regimen to fully retire early. Essentially, you save and invest aggressively in your early working years, eventually building up enough of a nest egg that you can allow compounding to do the rest of the work to get you to your retirement savings goal. No more saving needed. For example, if by 65 you want $2 million in retirement savings at today's purchasing power and assume annual inflation of 3%, you'll need around $278,000 invested by age 35. Average historical inflation-adjusted annualized returns of 7% will carry you to $2 million. In nominal terms, with returns averaging 10%, your portfolio will actually be worth almost $5 million. The concept is meant to reward you for doing the work early and taking advantage of the magic of compounding over long time horizons. With your retirement needs taken care of, you can spend more of the money you earn, or could even move to a lower paying job that you're more passionate about, as long as you can cover your immediate financial needs. But according to investing pros, there are risks to the strategy, and the assumptions needed for it to work may not prove as reliable as Coast FIRE proponents are hoping. Risks to the Coast FIRE strategy Let's start with the return assumptions. Through the decades, stocks have averaged 10% annualized nominal returns. Over the last decade-plus, returns have been particularly stellar. Is it safe to assume that 10% returns will continue? If you're planning to hold for multiple decades, then the answer is probably yes. However, high stock valuations imply that returns over the next decade or so may be subpar, and there's no guarantee that markets are advancing swimmingly to new highs right around the time one plans to retire. In other words, don't expect a smooth 10% annual return. If a signifi", "date_str": "2026-09-12T09:15:01+00:00", "hash": "9b4c02a57bb969b2", "title_fa": "جمعیت FIRE ممکن است در مورد مسیر بازنشستگی خود گمانه زنی های بزرگی داشته باشند", "summary_fa": "فدریکو گامبارینی/تصویر اتحاد از طریق Getty Images FIRE و انواع آن نیاز به تعداد کمی دارد تا بدانیم آیا مسیری قابل اجرا است یا خیر. \"Coast FIRE\" شامل پس انداز تهاجمی در مراحل اولیه برای برخورداری از درجاتی از آزادی مالی قبل از بازنشستگی است. کارشناسان مالی می گویند، اما کسانی که مشتاق این نسخه از FIRE هستند ممکن است چند ریسک کلیدی را در نظر نگیرند. اگر ارتش اینفلوئنسرهای مالی شخصی خارج از کشور توانسته اند به الگوریتم های رسانه های اجتماعی شما نفوذ کنند، احتمالاً با مفهوم \"Coast FIRE\" برخورد کرده اید. این رویکردی برای پس انداز بازنشستگی است که به شما امکان می دهد در دهه های قبل از بازنشستگی شروع به لذت بردن از نوعی آزادی مالی بدون نیاز به یک رژیم پس انداز دقیق برای بازنشستگی زودهنگام کنید. اساساً، شما در سال‌های اولیه کاری خود پس‌انداز و سرمایه‌گذاری تهاجمی می‌کنید، در نهایت به اندازه کافی تخم لانه ایجاد می‌کنید که می‌توانید به ترکیب اجازه دهید بقیه کارها را انجام دهد تا شما را به هدف پس‌انداز بازنشستگی خود برساند. پس انداز بیشتری لازم نیست. به عنوان مثال، اگر تا 65 سالگی 2 میلیون دلار پس انداز بازنشستگی با قدرت خرید امروزی بخواهید و تورم سالانه 3 درصد را فرض کنید، تا سن 35 سالگی به حدود 278000 دلار سرمایه گذاری نیاز دارید. متوسط ​​بازده سالانه 7 درصدی تعدیل شده بر اساس تورم، شما را به 2 میلیون دلار می رساند. در شرایط اسمی، با بازدهی متوسط ​​10 درصد، سبد شما در واقع تقریباً 5 میلیون دلار ارزش خواهد داشت. این مفهوم به منظور پاداش دادن به شما برای انجام زودهنگام کار و استفاده از جادوی ترکیب در افق های طولانی است. با توجه به نیازهای بازنشستگی، می توانید مقدار بیشتری از پولی را که به دست می آورید خرج کنید، یا حتی می توانید به"}, {"source": "Business Insider", "title": "I'm a French CEO in NYC. I say 'no' to 80% of emails, take two-hour lunches, and don't compare myself to others.", "link": "https://www.businessinsider.com/yuka-app-ceo-routine-saying-long-lunch-cycle-to-work-2026-9", "summary": "Julie Chapon, the CEO of Yuka, lives in New York City. Adélaïde Chantilly This as-told-to essay is based on a conversation with Julie Chapon, the 39-year-old CEO and cofounder of Yuka, who is based in New York. The app rates food and cosmetics based on their ingredients and campaigns for bans and reformulations. The following has been edited for length and clarity. Some CEOs have very strict agendas, but I don't like my day to be too defined. I used to work at a consultancy firm where I had no choice in what I did. When I started Yuka in France around 10 years ago, I thought, \"OK, now no one's going to tell me what I have to do.\" Yuka grew very quickly, and I learned to say no, in a very polite way, to 80% of the emails I receive . Yuka has a yearly road map that I'm in charge of. If I spend my time doing other things, I can't deliver. I also used to put up barriers because I didn't feel like the right person for certain opportunities, even if I was. Now I just act, and legitimacy comes. Otherwise, you can get easily crushed when you're up against big companies with a lot of money and resources. I used to live in Paris, and I moved to New York three years ago when Yuka started growing in the US. I live in Brooklyn with my husband and my daughter, who is 4, and my son, who is 5 1/2. I'm very close with my cofounders. We support each other in all that we do. I don't think I could be a solo founder. Here's what a typical day in my life in New York City looks like. Business Insider's Power Hours series gives readers an inside look at how powerful people structure their workday. Reach out to editor Lauryn Haas to share your daily routine. I wake up at 6:30 a.m. to hang out with my kids I'm definitely a morning person . I wake up very early, at 6:30 a.m., and get ready. From 7 a.m. I wake the kids, dress them, and prepare their breakfast, backpacks, and lunchboxes. At 7:30 a.m, I wake up my husband, who drops the kids off at school at 8:15 a.m. For years, I haven't eaten breakfast because I'm not hungry in the morning. I don't have time, anyway, because I want to be with my kids before leaving for work. It gives me a lot of energy. When I cycle to work at around 7:30 a.m., my ideas flow My schedule doesn't allow me to spend a lot of time commuting, so I chose an office close to my apartment, which takes about 15 minutes to cycle to. I get all my best ideas when I bike or run, and my mind is free. I arrive at our coworking space between 7:30 and 8 a.m., grab a co", "date_str": "2026-09-12T09:05:01+00:00", "hash": "f1c7734544a49ee4", "title_fa": "من یک مدیر عامل فرانسوی در نیویورک هستم. من به 80 درصد ایمیل‌ها «نه» می‌گویم، ناهار دو ساعته می‌خورم و خودم را با دیگران مقایسه نمی‌کنم.", "summary_fa": "جولی چاپون، مدیر عامل یوکا، در شهر نیویورک زندگی می کند. آدلاید شانتیلی این مقاله گفته شده بر اساس گفتگو با جولی چاپون، مدیر عامل و بنیانگذار 39 ساله یوکا است که در نیویورک مستقر است. این برنامه مواد غذایی و آرایشی را بر اساس مواد تشکیل دهنده آنها و کمپین هایی برای ممنوعیت و فرمول بندی مجدد آنها رتبه بندی می کند. موارد زیر برای طول و وضوح ویرایش شده است. برخی از مدیران اجرایی برنامه های بسیار سخت گیرانه ای دارند، اما من دوست ندارم روزم خیلی تعریف شده باشد. من قبلاً در یک شرکت مشاوره کار می کردم که هیچ انتخابی در کارم نداشتم. وقتی حدود 10 سال پیش یوکا را در فرانسه راه‌اندازی کردم، فکر کردم، \"خوب، حالا کسی به من نمی‌گوید که باید چه کار کنم.\" یوکا خیلی سریع رشد کرد و من یاد گرفتم که به ۸۰ درصد ایمیل‌هایی که دریافت می‌کنم، به شیوه‌ای بسیار مؤدبانه، نه بگویم. یوکا یک نقشه راه سالانه دارد که من مسئول آن هستم. اگر وقتم را صرف کارهای دیگر کنم، نمی توانم تحویل بدهم. من همچنین موانعی ایجاد می‌کردم، زیرا احساس نمی‌کردم برای موقعیت‌های خاص، حتی اگر بودم، فرد مناسبی باشم. حالا من فقط عمل می کنم و مشروعیت می آید. در غیر این صورت، زمانی که در مقابل شرکت های بزرگ با پول و منابع زیاد قرار می گیرید، می توانید به راحتی له شوید. من قبلاً در پاریس زندگی می کردم و سه سال پیش زمانی که یوکا در ایالات متحده شروع به رشد کرد به نیویورک نقل مکان کردم. من با شوهرم و دخترم 4 ساله و پسرم 5 1/2 ساله در بروکلین زندگی می کنم. من با بنیانگذارانم بسیار صمیمی هستم. ما در هر کاری که انجام می دهیم از یکدیگر حمایت می کنیم. فکر نمی کنم بتوانم یک بنیانگذار انفرادی باشم. در اینجا"}, {"source": "Business Insider", "title": "Young people are building fitness portfolios. Solidcore wants a bigger piece of them.", "link": "https://www.businessinsider.com/solidcore-ascend-strength-class-boutique-fitness-trends-2026-9", "summary": "Solidcore is expanding its brand with a new class focused on heavier weight training. Courtesy of Solidcore Boutique fitness brand Solidcore is beefing up with a new strength-focused class in infrared heat. It's a big bet on resistance training as the future of fitness, with emphasis on longevity. The balancing act is reaching new audiences without diluting what hooked loyal fans in the first place. Solidcore is expanding beyond its signature workout for the first time in its nearly 13-year history. When Solidcore launched over a decade ago, the brand found success with an intense 50-minute workout on Pilates-inspired resistance machines , known as reformers. This winter, it will debut Ascend, a high-intensity, heated, floor-based strength training class, according to details shared exclusively with Business Insider. The class will launch at Solidcore's upcoming Manhattan West studio, before rolling out to other locations. Ascend puts heavier weights and progressive strength training at the center of its workout, a direct appeal to people who want to build muscle. It also features a new infrared heating system, tapping into emerging research that training with heat may offer heart-health and anti-inflammatory benefits. The move reflects a broader shift in boutique fitness. The studios that made their names by specializing in a single type of exercise are confronting a new type of customer: one who lifts, runs, does Pilates, tracks their fitness metrics , and increasingly thinks about exercise as an investment in their bodies, rather than going for aesthetics. \"Consumers are more savvy now. They're talking about longevity, recovery, wellness, not so much calorie burn,\" CJ Zarb, founder of The Pilates Journal, told Business Insider. \"The question is no longer, 'Did I work hard in that class?' The question is, 'Do I move and feel better long-term?\" The biggest brands are making moves to address the moment — to complement rather than compete with other types of workouts or physical endeavors, from sports to marathon training to adventure hiking. \"People are starting to think, 'What's a longevity athlete's approach to building my fitness routine? I want a little bit of everything that is going to help me move better, feel stronger, recover faster, to live a longer, more enjoyable life,'\" Solidcore CEO Bryan Myers told Business Insider. Ascend, the new offering from Solidcore, combines floor-based strength training with weights in a heated space under its signat", "date_str": "2026-09-12T09:00:01+00:00", "hash": "3307902c491a89df", "title_fa": "جوانان در حال ساختن پورتفولیوهای تناسب اندام هستند. سالیدکور یک قطعه بزرگتر از آنها می خواهد.", "summary_fa": "Solidcore در حال گسترش نام تجاری خود با کلاس جدیدی است که بر تمرینات با وزنه های سنگین متمرکز شده است. برند تناسب اندام Solidcore Boutique Solidcore با یک کلاس جدید متمرکز بر قدرت در گرمای مادون قرمز تقویت می شود. این یک شرط بزرگ برای تمرینات مقاومتی به عنوان آینده تناسب اندام، با تاکید بر طول عمر است. عمل متعادل کننده در حال دستیابی به مخاطبان جدید است بدون اینکه چیزی که طرفداران وفادار را در وهله اول به خود جذب کرده بود کمرنگ کند. Solidcore برای اولین بار در تاریخ نزدیک به 13 سال خود، فراتر از تمرینات مشخص خود گسترش می یابد. زمانی که Solidcore بیش از یک دهه پیش راه اندازی شد، این نام تجاری با یک تمرین شدید 50 دقیقه ای در دستگاه های مقاومتی الهام گرفته از پیلاتس، معروف به اصلاح کننده، به موفقیت دست یافت. طبق جزئیاتی که به طور انحصاری با Business Insider به اشتراک گذاشته شده است، در زمستان امسال، اولین کلاس Ascend، یک کلاس تمرین قدرتی با شدت بالا، گرم و مبتنی بر کف را آغاز خواهد کرد. این کلاس در استودیوی آتی سالیدکور در منهتن غرب راه اندازی می شود، قبل از اینکه در مکان های دیگر راه اندازی شود. Ascend وزنه‌های سنگین‌تر و تمرینات قدرتی پیشرونده را در مرکز تمرینات خود قرار می‌دهد، که جذابیت مستقیمی برای افرادی که می‌خواهند عضله‌سازی کنند. همچنین دارای یک سیستم گرمایش مادون قرمز جدید است که به تحقیقات در حال ظهور کمک می کند که تمرین با گرما ممکن است مزایای سلامت قلب و ضد التهابی را ارائه دهد. این حرکت نشان دهنده یک تغییر گسترده تر در تناسب اندام بوتیک است. استودیوهایی که با تخصص در یک نوع ورزش نام خود را بر سر زبان ها انداختند، با نوع جدیدی از مشتری روبرو می شوند: فردی که بلند می کند، می"}, {"source": "Business Insider", "title": "I used to write between lunch breaks at my corporate job. Now my income as a best-selling romantasy author supports my family", "link": "https://www.businessinsider.com/brigid-kemmerer-left-finance-job-to-write-romantasy-books-2026-9", "summary": "NYT bestselling author Brigid Kemmerer used to write books during lunch breaks while working in finance. Brigid Kemmerer Brigid Kemmerer wrote books during lunch breaks while working in finance and raising three kids. An NYT bestseller gave Kemmerer enough money to quit her corporate job in 2016. Kemmerer said that as a full time writer, losing corporate stability can still feel scary. This as-told-to essay is based on a conversation with Brigid Kemmerer, a New York Times bestselling author of young-adult and romantasy novels . Kemmerer, based in Baltimore and now 48 years old, has worked as a full-time author for the past 10 years and has published at least two dozen books. The essay has been edited for length and clarity. I've wanted to be a writer since I was 12, when a librarian I knew published her first young-adult novel . Until then, authors might as well have been movie stars. Seeing a real person become one made writing feel like a possible career. I started working in finance at 19 and eventually became a licensed stockbroker. After selling my first novel in 2011, I continued working my day job while raising three children and writing whenever I could. I wrote early in the morning, late at night, and during my lunch hour. In 2016, I finally sold the book that allowed me to leave finance. Becoming a full-time author took years, and my income is now supporting my entire family. I treated writing like a second job I always wanted to be a writer, but I never really thought of it as a full-time job. In my 20s, I worked in finance, and I was a licensed stockbroker. I loved my coworkers, and I liked having a consistent salary . I sold my first novel in 2011, but publishing is not a get-rich-quick scheme. I used my first advance payment to fix our leaky roof and buy a cheap children's playset from Costco. For years, my schedule was insane. I would wake up at 5 a.m. and try to get some words down over coffee before the kids woke up. Then I changed diapers, got everybody dressed, packed their day care bags, dropped them off, and commuted 40 minutes. Sometimes, I wrote during my lunch hour. I had an ancient, janky laptop that wouldn't work unless it was plugged in, until my husband bought me a MacBook, even though we didn't have MacBook money. After work, we picked up the kids and made dinner. If I wanted to get words written, I needed to leave the house. I would go to the library or Starbucks and treat writing like a part-time job . My husband was hands-on", "date_str": "2026-09-12T08:11:01+00:00", "hash": "ba6f56f5a5a61d08", "title_fa": "من بین ساعات ناهار در محل کارم می نوشتم. اکنون درآمد من به عنوان یک نویسنده رمانتیز پرفروش باعث حمایت خانواده ام می شود", "summary_fa": "بریجید کمرر، نویسنده پرفروش نیویورک، زمانی که در امور مالی کار می کرد، در زمان استراحت ناهار کتاب می نوشت. بریجید کمرر بریجید کمرر در زمان استراحت ناهار هنگام کار در امور مالی و بزرگ کردن سه فرزند کتاب می نوشت. یکی از پرفروش‌ترین کتاب‌های نیویورک به کمرر پول کافی داد تا در سال 2016 شغل شرکتی خود را ترک کند. کمرر گفت که به عنوان یک نویسنده تمام وقت، از دست دادن ثبات شرکت همچنان می‌تواند ترسناک باشد. این مقاله همانطور که گفته می شود بر اساس گفتگو با بریجید کمرر، نویسنده پرفروش نیویورک تایمز در رمان های جوان بزرگسال و عاشقانه است. کمرر، مستقر در بالتیمور و اکنون 48 سال سن دارد، در 10 سال گذشته به عنوان نویسنده تمام وقت کار کرده و حداقل 22 کتاب منتشر کرده است. مقاله برای طولانی بودن و وضوح ویرایش شده است. از 12 سالگی می‌خواستم نویسنده شوم، زمانی که کتابداری که می‌شناختم اولین رمان بزرگسالش را منتشر کرد. تا آن زمان، نویسندگان ممکن است ستاره های سینما نیز بوده باشند. دیدن تبدیل شدن یک شخص واقعی به نویسندگی باعث شد احساس شود که یک شغل ممکن است. از 19 سالگی در امور مالی شروع به کار کردم و در نهایت یک کارگزار مجاز بورس شدم. پس از فروش اولین رمانم در سال 2011، به کار روزانه خود ادامه دادم و سه فرزند را بزرگ کردم و هر زمان که می توانستم می نوشتم. صبح زود، آخر شب و در ساعت ناهار می نوشتم. در سال 2016، سرانجام کتابی را فروختم که به من اجازه داد از امور مالی خارج شوم. تبدیل شدن به یک نویسنده تمام وقت سال ها طول کشید، و درآمد من در حال حاضر حمایت از کل خانواده ام است. من با نوشتن مانند شغل دومی برخورد می کردم که همیشه می خواستم نویسنده باشم، اما هرگز"}, {"source": "Business Insider", "title": "Charity founder says he secretly gave FTX fraud figure Caroline Ellison a job", "link": "https://www.businessinsider.com/ftx-caroline-ellison-new-job-manifund-manifold-austin-chen-2026-9", "summary": "Caroline Ellison, the former Alameda Research CEO who served prison time for her role in the FTX fraud case Bloomberg/Getty Images Manifund CEO Austin Chen says Caroline Ellison has taken a role at the grantmaking platform. Ellison admitted to misusing FTX customer funds and testified against Sam Bankman-Fried. Chen said Ellison's new role is to research how to direct philanthropic dollars. It looks like Caroline Ellison has emerged from stealth mode. A nonprofit CEO announced Friday that he secretly gave a job to Ellison — who went to prison in connection with fraud by Sam Bankman-Fried's crypto exchange. Austin Chen, the founder of Manifund, a grantmaker tied to the effective altruism movement, wrote on Substack that Ellison, 31, will develop its platform and research \"how to effectively direct philanthropic dollars.\" In the post, Chen framed the hiring as a second chance for Ellison. \"I believe in redemption,\" he wrote. \"Caroline has admitted her faults, worked to make creditors whole, and served her time in prison. I'd like to give her the opportunity to contribute back to the world; I hope that the world will concur.\" Manifund began as a charitable side project of Manifold Markets, a prediction market company cofounded by Chen. Manifold was previously backed by FTX Future Fund, a philanthropic initiative, which Chen noted in the blog. Chen confirmed the news in a brief text message to Business Insider. He did not provide documentation of Ellison's new role. Ellison could not be reached for comment. The blog contained a message in Ellison's name. \"I'm deeply sorry for what I did, and I completely understand why people may not want to work with me,\" it said. \"But I'm very grateful to Austin for giving me a second chance, and judging me on my current work performance rather than my past. I feel very lucky not only to have a job, but to be working somewhere that I think is doing great work and has a mission I believe in.\" Ellison previously led Alameda Research, FTX's affiliated crypto trading firm. In December 2022, she pleaded guilty to seven counts of fraud and conspiracy in connection with her role in the misuse of FTX customer funds to cover Alameda's debts and trading losses. Ellison testified against FTX founder Sam Bankman-Fried and was sentenced to two years in prison. She was released from federal custody in January and had been keeping a low profile. Chen wrote that he invited Ellison to Manifest 2026, a festival the nonprofit held in June. She", "date_str": "2026-09-12T03:05:14+00:00", "hash": "6fff42fb27e13b19", "title_fa": "موسس خیریه می گوید که مخفیانه به کارولین الیسون، شخصیت کلاهبرداری FTX، شغل داده است", "summary_fa": "کارولین الیسون، مدیر عامل سابق Alameda Research که به دلیل نقشش در پرونده کلاهبرداری FTX، آستین چن، مدیر عامل بلومبرگ/گتی ایمیجز مانیفند، به حبس محکوم شد، می گوید که کارولین الیسون در پلتفرم اعطای کمک هزینه ایفای نقش کرده است. الیسون به سوء استفاده از وجوه مشتریان FTX اعتراف کرد و علیه سام بانکمن-فرید شهادت داد. چن گفت نقش جدید الیسون تحقیق در مورد چگونگی هدایت دلارهای بشردوستانه است. به نظر می رسد کارولین الیسون از حالت مخفی کاری خارج شده است. یک مدیر عامل غیرانتفاعی روز جمعه اعلام کرد که مخفیانه به الیسون - که در ارتباط با کلاهبرداری توسط صرافی رمز ارز سام بنکمن-فرید به زندان رفت، شغلی داده است. آستین چن، بنیانگذار Manifund، یک کمک مالی وابسته به جنبش موثر نوع دوستی، در Substack نوشت که الیسون، 31 ساله، پلتفرم خود را توسعه خواهد داد و در مورد چگونگی هدایت موثر دلارهای بشردوستانه تحقیق خواهد کرد. در این پست، چن استخدام را به عنوان شانس دوم برای الیسون در نظر گرفت. او نوشت: من به رستگاری اعتقاد دارم. کارولین به اشتباهات خود اعتراف کرده است، تلاش کرده تا طلبکاران را کامل کند و دوران زندان خود را سپری کرده است. Manifund به عنوان یک پروژه جانبی خیریه Manifold Markets، یک شرکت بازار پیش‌بینی که توسط Chen تأسیس شد، آغاز شد. منیفولد قبلاً توسط FTX Future Fund، یک ابتکار بشردوستانه حمایت می شد که چن در وبلاگ به آن اشاره کرد. چن این خبر را در یک پیام کوتاه کوتاه به Business Insider تایید کرد. او مستنداتی از نقش جدید الیسون ارائه نکرد. الیسون برای اظهار نظر در دسترس نیست. این وبلاگ حاوی پیامی به نام الیسون بود. در این بیانیه آمده است: «من عمیقاً برای کاری که انجام دادم متاسفم و کاملاً درک می کنم که چرا مردم ممکن است نخواهند با من کار کنند. \"اما من"}, {"source": "Business Insider", "title": "An ex-OpenAI researcher's influential nonprofit is now smack in the middle of AI's doom debate", "link": "https://www.businessinsider.com/metr-beth-barnes-ai-talent-shortage-safety-research-openai-2026-8", "summary": "METR s president, Chris Painter, and CEO, Beth Barnes. METR METR, a Berkeley lab started by an ex-OpenAI researcher, has grown into a prominent AI umpire. The nonprofit works with OpenAI, Anthropic, and governments to evaluate cutting-edge models. Anthropic researcher Joe Benton announced this week that he has left to join METR. Beth Barnes, one of the AI industry's most influential watchdogs, said in July she was struggling to hire talented researchers to monitor AI's risks. That has begun to change. Researcher Joe Benton announced this week that he had left Anthropic for Barnes' nonprofit METR, writing that he worries about \"extinction-level risks\" from the tech. The comments came after Jacob Coxon , another researcher, stoked those fears nationwide with a viral post announcing his own departure from Anthropic and accusing the top AI labs of \"gambling with our lives.\" METR, all of a sudden, is in the middle of AI's biggest story. Formed in 2022, it had already worked closely with OpenAI, Anthropic , Google, and Meta to study the tech's quickly changing capabilities. This summer, researchers from the nonprofit investigated a security incident at OpenAI , and now plan to look into security issues at Anthropic, relying on internal access granted by each company. \"The public should know whether AI development is headed down a dangerous path,\" Jasmine Dhaliwal, a member of policy staff, said Friday. \"That is core to our mission: to provide independent, scientific assessment of AI capabilities, alignment, and control measures.\" Benton isn't alone in jumping ship from a tech juggernaut to the Berkeley-based organization. Josh Engels, an AI safety researcher, also recently joined METR (Model Evaluation and Threat Research) from Google DeepMind. Barnes left OpenAI to start the nonprofit in 2022 and sees such fierce competition for AI researchers that even METR's lofty salaries, which reach $503,000 on current job postings, don't address the nonprofit's talent shortage. \"Ideally, we'd like to scale really large, but in practice, we've been able to fundraise as much as we need, and the bottleneck is much more talent,\" Barnes said. 'Humanity's preparedness team' struggles to grow The security incident announced by OpenAI and Hugging Face in July sparked a new wave of questions about how to evaluate and control AI. More than 1,300 frontier lab employees signed a letter in July warning that AI development could outpace control. In the last month, both OpenAI and Anthr", "date_str": "2026-09-11T23:01:35+00:00", "hash": "9722eac8b4518996", "title_fa": "یک موسسه غیرانتفاعی با نفوذ یک محقق سابق OpenAI اکنون در میانه بحث عذاب هوش مصنوعی قرار گرفته است.", "summary_fa": "رئیس METR، کریس پینتر، و مدیر عامل، بت بارنز. METR METR، یک آزمایشگاه برکلی که توسط یک محقق سابق OpenAI راه اندازی شده است، به یک داور برجسته هوش مصنوعی تبدیل شده است. این سازمان غیرانتفاعی با OpenAI، Anthropic و دولت ها برای ارزیابی مدل های پیشرفته همکاری می کند. جو بنتون، محقق انسان‌شناسی، این هفته اعلام کرد که برای پیوستن به METR ترک کرده است. بث بارنز، یکی از تأثیرگذارترین ناظران صنعت هوش مصنوعی، در ماه ژوئیه گفت که در تلاش برای استخدام محققان با استعداد برای نظارت بر خطرات هوش مصنوعی است. که شروع به تغییر کرده است. جو بنتون، محقق، این هفته اعلام کرد که Anthropic را به مقصد METR غیرانتفاعی بارنز ترک کرده است و نوشت که نگران \"خطرات در سطح انقراض\" این فناوری است. این نظرات پس از آن بیان شد که جیکوب کوکسون، محقق دیگری، با انتشار پستی ویروسی در سراسر کشور این ترس ها را برانگیخت و خروج خود از آنتروپیک را اعلام کرد و آزمایشگاه های برتر هوش مصنوعی را به \"قماربازی با زندگی ما\" متهم کرد. METR، به طور ناگهانی، در میانه بزرگترین داستان هوش مصنوعی قرار دارد. این شرکت که در سال 2022 تشکیل شد، قبلاً با OpenAI، Anthropic، Google و Meta برا laces-not-worth-visiting-from-frequent-traveler-2026-9", "summary": "Cinque Terre is one of my favorite places to visit in Italy. Alison Van Glad After visiting 21 cities and villages in Italy, there are some spots I can't wait to return to. However, a few Italian destinations left me wanting more. Overall, I really enjoyed my time in popular cities like Florence and Verona. Italy holds a special place in my heart, which is why I'm always finding excuses to return. I've visited three times since 2016, including a four-month stay in Florence during college. Thanks to Italy's well-connected transit systems , I've had the chance to visit 21 cities and villages, most often by rail. Some of the destinations I've been to have blown me away, while others left me wanting more. Here are four Italian cities I'd happily return to — and two I'd leave off my itinerary next time. Cinque Terre is a beautiful place to hike. Andrii Marushchynets/Getty Images Cinque Terre is a string of five seaside villages on the northwestern coast of Italy. Although all five villages are accessible by train, hiking between them is a popular activity. I'd recommend starting in the southernmost town, Riomaggiore, and hiking north for stunning views. Cinque Terre is perfect for anyone looking to relax in a vibrant environment, enjoy traditional Italian culture, or explore five seaside villages in one day. My trip to Verona felt like something straight out of a fairytale. Alena 11/Shutterstock I immediately fell in love with how enchanting, quaint, and walkable Verona felt during my first visit in 2016. Home to Shakespeare's beloved \"Romeo and Juliet,\" visitors commonly visit Juliet's house, calling down to those below from the balcony. During my time in Verona, I stumbled upon Club di Giulietta , a volunteer group that calls themselves the secretaries of Juliet. They receive thousands of letters addressed to Juliet from around the world, and volunteers sort letters by language before handwriting a response. I got to spend a few hours reading and writing replies myself, which became the highlight of my trip to Verona . Overall, the city's walkability, history, and quaint feel make it perfect for a day trip for time-restricted itineraries. There s so much to do in Florence. Omri Eliyahu/Shutterstock Since living in Florence in 2016, I've been back to visit twice. There's so much to love about the city, which is the capital of the Tuscany region. For those visiting for the first time, I recommend staying a minimum of four full days to explore the city's museums", "date_str": "2026-09-11T19:43:15+00:00", "hash": "dfab73b6ea23e8c9", "title_fa": "من به تمام ایتالیا سفر کرده ام. 4 مکان وجود دارد که نمی توانم صبر کنم تا به آنها برگردم - و 2 مکان وجود دارد که دفعه بعد برنامه سفرم را ترک می کنم.", "summary_fa": "Cinque Terre یکی از مکان های مورد علاقه من برای بازدید در ایتالیا است. آلیسون ون گلد پس از بازدید از 21 شهر و روستا در ایتالیا، نقاطی وجود دارد که بی صبرانه منتظر بازگشت به آنها هستم. با این حال، چند مقصد ایتالیایی باعث شد که من بیشتر بخواهم. به طور کلی، من واقعاً از زمانم در شهرهای محبوبی مانند فلورانس و ورونا لذت بردم. ایتالیا جایگاه ویژه ای در قلب من دارد و به همین دلیل است که همیشه بهانه ای برای بازگشت پیدا می کنم. من از سال 2016 سه بار از آن بازدید کرده ام، از جمله اقامت چهار ماهه در فلورانس در دوران کالج. به لطف سیستم های حمل و نقل خوب ایتالیا، من این شانس را داشته ام که از 21 شهر و روستا بازدید کنم، اغلب از طریق راه آهن. برخی از مقاصدی که در آنها بوده‌ام، مرا غافلگیر کرده‌اند، در حالی که برخی دیگر من را رغبت کرده‌اند. در اینجا چهار شهر ایتالیا وجود دارد که من با خوشحالی به آنها باز خواهم گشت - و دو شهر که دفعه بعد سفرم را ترک خواهم کرد. Cinque Terre مکانی زیبا برای پیاده روی است. Andrii Marushchynets/Getty Images Cinque Terre رشته‌ای از پنج روستای ساحلی در ساحل شمال غربی ایتالیا است. اگرچه هر پنج روستا با قطار قابل دسترسی هستند، پیاده روی بین آنها یک فعالیت محبوب است. توصیه می‌کنم از جنوبی‌ترین شهر، Riomaggiore شروع کنید و برای دیدن مناظر خیره‌کننده به شمال بروید. Cinque Terre برای هر کسی که به دنبال استراحت در یک محیط پر جنب و جوش، لذت بردن از فرهنگ سنتی ایتالیایی یا کاوش در پنج دهکده ساحلی در یک روز است، عالی است. سفر من به ورونا شبیه چیزی خارج از افسانه بود. Alena 11/Shutterstock من بلافاصله در اولین دیدارم در سال 2016 عاشق ورونا شدم که چقدر"}, {"source": "Business Insider", "title": "M.Gemi's Felize loafers are my holy grail of suede shoes", "link": "https://www.businessinsider.com/guides/style/m-gemi-felize-loafer-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Gabrielle Chase/Business Insider The Felize loafers by M.Gemi are a perfect showcase of the brand's tagline: \"Made in Italy the old way and sold the new way.\" Founder Maria Gangemi grew up along the olive tree-lined streets of Sicily. She would go on to mount a career in merchandising and creative direction for footwear and accessories brands, always reserving a special appreciation for the artistry of shoes made in mom-and-pop operations. Three things ruled these hot, intimate shops clustered in town: quality, attention, and pride in one's work. This is led Gangemi to creating M.Gemi , a startup that connects anyone with internet access to shoes done \"the old way.\" For reference, M.Gemi's fine leather goods are of the same material quality as Prada. If you're going to try any shoes from M.Gemi, the Felize driving loafers are where to start. They're the number one M.Gemi style to bring in returning customers, and in the past, they've accumulated a waitlist of over 36,000 people. See which other shoes from our M.Gemi review made it into our guides on the best ankle boots , loafers , and most comfortable heels . The Felize Suede Driving Loafer My M.Gemi Felize suede loafers after two years of wear. The rubber sole gives them a cushiony feel. Mara Leighton/Business Insider The Felize is the classic driver that moonlights as the perfect travel shoe. It's been produced in nearly 200 unique color and material combinations since its debut. I have the Felize Suede driving loafers in Emerald (a colorway that's now retired), and I'm happy to report that they're relatively true to size and required zero break-in time. My only fit tip is that they begin snug and grow looser and more custom-fit over time, meaning you should size a half size up for a looser fit immediately. For what it's worth, my regular size allowed for socks. These slips off easily for airport security lines, combining an effortlessly timeless style with extremely sensible comfort. The uppers are made from a beautiful suede with a leather lining that gets better with time — molding to cup your foot like a custom-fit glove. They're a deceptively chic sub-in for sneakers on grocery trips, weekend mornings, or travel days. The Felize family Over the years, we've seen the Felize loafer take many different shapes. This season's moccasins are all made with the same process of cutting and hand stitching a single pi", "date_str": "2026-09-11T19:00:07+00:00", "hash": "f4d5f2def0ef7f5a", "title_fa": "کفش راحتی فلیز M.Gemi جام مقدس کفش های جیر من است", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Gabrielle Chase/Business Insider The Felize loafers ساخته M.Gemi ویترین کاملی از شعار این برند است: \"ساخت ایتالیا به روش قدیمی و فروش به روش جدید.\" بنیانگذار ماریا گنگمی در امتداد خیابان های درختان زیتون سیسیل بزرگ شد. او به حرفه ای در تجارت و کارگردانی خلاقانه برای مارک های کفش و لوازم جانبی ادامه داد و همیشه قدردانی ویژه ای از هنر کفش های تولید شده در عملیات های مادر و پاپ داشت. سه چیز بر این مغازه‌های گرم و صمیمی که در شهر جمع شده‌اند حکومت می‌کند: کیفیت، توجه، و افتخار به کار. این باعث شد که Gangemi به سمت ایجاد M.Gemi، یک استارتاپ که هر کسی را که به اینترنت دسترسی داشته باشد به کفش‌هایی که به روش قدیمی انجام شده است، متصل می‌کند. به عنوان مرجع، اجناس چرمی مرغوب M.Gemi از کیفیت مواد مشابه پرادا برخوردار هستند. اگر می‌خواهید oidered pumps, sparkly ballet flats, or something a little edgier for a second look, these are the best bridal shoes for every dress, venue, and wedding-day plan. And for more of our rigorously tested guides to the best footwear, see our articles on the most comfortable heels, the best flats , the best travel sandals , and more. If this sounds like you… You want a tall, glamorous platform that still feels steady and walkable: Inez Camilla You want a cool, sculptural sandal that pairs with a modern gown: Nomasei Baghera Sandals You want a reliable and affordable open-toe heel that you can wear for hours of standing, walking, and dancing: Naturalizer Joy Dress Sandal You want a sparkly mule to pair perfectly with a second-look dress: Dolce Vita Nandy Confetti Heels in Ivory Sequin You want a romantic stiletto with delicate bridal details that can peek out from under your dress: Eve Ivory Butterfly Heels You want a timeless pointed-toe pump , but you need more comfort, support, and toe room than that silhouette usually offers: Scarlett 75 Pumps You want a comfortable flat for dancing , changing into after the ceremony, or wearing all day: Everlane Day Mary Jane How I evaluated each bridal shoe Comfort : For the purposes of testing, I stood and walked around in each pair for at least four hours, including a little dancing. This helped me determine whether the style was comfy enough to wear for an entire ceremony and reception. Fit Support : I also assessed each shoe'", "date_str": "2026-09-11T18:58:27+00:00", "hash": "24933f0f30cdd773", "title_fa": "ما بیش از 50 جفت کفش عروس را آزمایش کردیم تا کفش‌هایی را که به اندازه کافی راحت می‌توان در تمام شب بپوشید، پیدا کرد", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید ویراستاران ما اینز کامیلا (سمت چپ) و پاشنه‌های پروانه‌ای عاج خوشگل حوا (راست) را پوشیده‌اند. Gabrielle Chase، Samantha Crozier/Business Insider یافتن بهترین کفش عروس به معنای متعادل کرد
