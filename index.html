299.99) right now, directly from the Bissell website. It's an upright wired vacuum with two brush rolls, a HEPA filtration system, headlights for spotting pet hair, and a detachable Lift-Off pod for spot cleaning. Most vacuums have a single brush roll, but this Bissell vacuum has two that work together to loosen, lift, and suck up debris, especially fur and dander from different surfaces. There are two high- and low-beam LEDs that help spot debris on the floor. If you're allergic to your pets, you'll likely love this feature that not many others have: a sealed HEPA allergen system that traps 99.97% of dust and dander allergens at 0.3 microns. This means the particles that make you sneeze will stay in the 1.25-liter bagless vacuum and not be spit back out into your home. There's a useful pod attachment you can detach from the floorhead to vacuum stairs, furniture, upholstery, shelves, etc. You get swivel steering, a 30-foot power cord, and a 7-foot hose that works on carpets, rugs, bare floors, sealed hardwood, stairs, pet beds, etc. The Bissell Pet Hair Eraser DualBrush Upright Vacuum is great for pet owners who want to remove fur, dander, and keep allergens off their floors and surfaces. It also works great as a general vacuum cleaner since it works on many different types of floors, carpets, and rugs. With the Lift-Off pod, it also brings the stick vacuum element into the picture, so it's versatile for most uses. At $249.99, you're getting a powerful vacuum from a trusted brand designed for homes with pets. An advertiser paid for editorial consideration of this deal. Our editorial experts vetted the deal based on our independent expertise. Because we determined that the deal will save money for the consumer, we wrote the content.", "date_str": "2026-09-11T19:30:00+00:00", "hash": "240ee48856a9398f", "title_fa": "این جاروبرقی قدرتمند Bissell Pet در حال حاضر 50 دلار تخفیف دارد", "summary_fa": "قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. بر خلاف جاروبرقی های معمولی، جاروبرقی های حیوانات خانگی به طور خاص برای حذف مواد حساسیت زا طراحی شده اند و دارای فیلترها و برس های مخصوص برای تمیزتر نگه داشتن سطوح شما هستند. جاروبرقی عمودی DualBrush Hair Eraser Bissell برای صاحبان حیوانات خانگی که با مو و آلرژی دست و پنجه نرم می کنند عالی است و در حال حاضر مستقیماً از وب سایت Bissell به 249.99 دلار (در اصل 299.99 دلار) تخفیف داده شده است. این یک جاروبرقی سیمی عمودی با دو رول برس، یک سیستم فیلتراسیون HEPA، چراغ‌های جلو برای تشخیص موهای حیوانات خانگی، و یک غلاف Lift-Off قابل جدا شدن برای تمیز کردن نقطه است. بیشتر جاروبرقی ها یک رول برس دارند، اما این جاروبرقی بیسل دو عدد دارد که با هم کار می کنند تا زباله ها، به ویژه خز و شوره سطوح مختلف را شل، بلند و مکش کنند. دو LED با نور بالا و پایین وجود دارد که به شناسایی زباله ها روی زمین کمک می کند. اگر به حیوانات خانگی خود حساسیت دارید، احتمالاً این ویژگی را دوست خواهید داشت که بسیاری دیگر از آن برخوردار نیستند: یک سیستم آلرژن HEPA مهر و موم شده که 99.97 درصد از گرد و غبار و آلرژن های شوره را در 0.3 میکرون به دام می اندازد. این بدان معناست که ذراتی که باعث عطسه شما می شوند در خلاء 1.25 لیتری بدون کیسه باقی می مانند و به خانه شما ریخته نمی شوند. ضمیمه غلاف مفیدی وجود دارد که می توانید آن را از کف به پله ها، مبلمان، اثاثه یا لوازم داخلی، قفسه ها و غیره جدا کنید. شما از فرمان چرخان، سیم برق 30 فوتی و شلنگ 7 فوتی استفاده می کنید که روی فرش ها، موکت ها،"}, {"source": "Lifehacker", "title": "Yes, the Apple Watch's New Audio Intelligence Features Really Are Always Listening to You", "link": "https://lifehacker.com/tech/the-new-apple-watch-listens-to-your-conversations?utm_medium=RSS", "summary": "During its Sept. 9 keynote, Apple announced the Apple Watch Series 12 and the Ultra 4 , both of which will come with a feature that passively listens to your audio conversations all day and can summarize them for you on demand. It's part of a collection of features called \"Audio Intelligence,\" but the two key features to consider here are: Live Rewind: If you double-press the Digital Crown on your Apple Watch, it will pull up a text snippet of your conversation over the last fifteen seconds. Siri Recaps: Your watch listens to your conversations and generates an AI summary of any of your transcribed audio at the end of each day. At first glance, the basic concept seems like a privacy nightmare, but Apple has put some safeguards in place to help people feel more comfortable with this feature: The audio that is captured is never recorded or stored, and never leaves your device; it is essentially deleted immediately and in real time from local storage; only a truncated version is uploaded to Apple Private Cloud Compute servers for AI processing, and the resulting transcript that is delivered to you is end-to-end encrypted. Still, there are some potential privacy concerns worth considering, especially since you'll essentially be subjecting everyone around you to using it without their consent. How Audio Intelligence makes a transcript of what it hears Series 12 and Ultra 4 watches run on an S11 chip with a Secure Exclave feature , a partitioned local storage compartment that even the operating system cannot access. When your Apple Watch picks up ambient audio, it is sent straight into this protected buffer, where it is encrypted, then sent over to a matching Secure Enclave on your paired iPhone. From there, your iPhone transcribes it locally using an on-device AI model to create a summarized version that s half the length of the actual audio, removing everything but the essentials, and stripping out any identifying information. After the audio data is overwritten, the transcript is sent to Apple's Private Cloud Compute along with some generic metadata, like a rough location and timestamps. None of the audio data is tied to your Apple ID once it reaches the servers at this stage. Apple uses a third-party relay to conceal your IP address while uploading the data to Private Cloud Compute, so not even their employees can identify you from your device. While in the Private Cloud Compute servers, your audio data gets summarized by Siri AI. This is how you end up with", "date_str": "2026-09-11T18:30:33+00:00", "hash": "f7e89f0c8cc8849b", "title_fa": "بله، ویژگی های جدید هوش صوتی اپل واچ واقعا همیشه به شما گوش می دهند", "summary_fa": "اپل در جریان سخنرانی خود در 9 سپتامبر، اپل واچ سری 12 و اولترا 4 را معرفی کرد که هر دو دارای قابلیتی هستند که در تمام طول روز به صورت غیر فعال به مکالمات صوتی شما گوش می دهد و می تواند در صورت نیاز آنها را برای شما خلاصه کند. این بخشی از مجموعه‌ای از ویژگی‌ها به نام «هوش صوتی» است، اما دو ویژگی کلیدی که در اینجا باید در نظر گرفته شود عبارتند از: بازگشت زنده: اگر Digital Crown را روی Apple Watch خود دوبار فشار دهید، یک قطعه متنی از مکالمه شما در پانزده ثانیه گذشته نمایش داده می‌شود. Siri Recaps: ساعت شما به مکالمات شما گوش می دهد و در پایان هر روز یک خلاصه هوش مصنوعی از صدای رونویسی شده شما تولید می کند. در نگاه اول، مفهوم اولیه مانند یک کابوس حفظ حریم خصوصی به نظر می رسد، اما اپل برای کمک به افراد احساس راحتی بیشتری با این ویژگی ایجاد کرده است: صدایی که گرفته می شود هرگز ضبط یا ذخیره نمی شود و هرگز از دستگاه شما خارج نمی شود. اساساً بلافاصله و در زمان واقعی از حافظه محلی حذف می شود. فقط یک نسخه کوتاه شده برای پردازش هوش مصنوعی در سرورهای Apple Private Cloud Compute آپلود می شود و رونوشت حاصل که به شما تحویل داده می شود رمزگذاری شده است. با این حال، برخی نگرانی‌های بالقوه در مورد حفظ حریم خصوصی وجود دارد که ارزش بررسی دارند، به‌ویژه از آنجایی که اساساً همه اطرافیان خود را مجبور خواهید کرد بدون رضایت آنها از آن استفاده کنند. چگونه Audio Intelligence یک رونوشت از آنچه می شنود ساعت های سری 12 و Ultra 4 روی تراشه S11 با ویژگی Secure Exclave، یک محفظه ذخیره سازی محلی پارتیشن بندی شده که حتی سیستم عامل نیز نمی تواند به آن دسترسی داشته"}, {"source": "Lifehacker", "title": "These Are the Most Affordable Running Watches With Maps", "link": "https://lifehacker.com/health/affordable-running-watches-maps?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Maps are an excellent feature on any watch you plan to take running or hiking. Unfortunately they tend to be a premium feature, and until recently you had to spend some pretty serious money to get offline maps on a watch. But that s changing, and we now have several great options in the mid range and even entry level watches. For this list, I m only considering watches that are current models you may be able to find deals on older versions of these. All of these watches have been road-tested either by myself or Meredith Dietz here at Lifehacker. Why maps matter on a watch This watch has breadcrumb navigation but no maps. Credit: Beth Skwarecki Let me be really clear on what it means for a watch to have maps. This is a premium feature on top of navigation and GPS tracking. Here s the difference between those three things: GPS tracking: where you are GPS (or GNSS) tracking means that the watch can communicate with satellites to know where you are in the world. All modern running watches have this ability. (Some wearables, like the Whoop and Fitbit Air, use the GPS that is built into your phone rather than having this capability onboard. This GPS data tells the watch how far and how fast you re running during the workout, and allows you to see your data on a map after the workout for example, when you re reviewing the workout on your phone afterward, you ll see the route your watch tracked overlaid on a map that the phone draws based on data it has downloaded from the Internet. Breadcrumb navigation: where you ve been Breadcrumb navigation means that the watch can remember where you ve been, while you re on the run. You ll see a line representing the path you ve taken, and it will be shown to you on a blank background. You can usually also download a route or course to the watch, and it will display a line showing you where you re supposed to go, overlaid with the line for where you actually went. Many watches can even give you turn-by-turn directions based on these routes, but they don t know where the route intersects other roads or trails. Offline maps: what else is out there This is the feature we ll be talking about today. In addition to knowing where you are and where you ve been, watches with maps can show you what exists in the world around you. Instead of seeing a line in a void, your watch will clearly show you that you re running down Main Street and you re about to cross a bridge over a creek. Maps", "date_str": "2026-09-11T18:30:11+00:00", "hash": "902b46c9fb598430", "title_fa": "اینها مقرون به صرفه ترین ساعت های دویدن با نقشه هستند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. نقشه ها یک ویژگی عالی برای هر ساعتی است که قصد دویدن یا پیاده روی دارید. متأسفانه آنها یک ویژگی ممتاز هستند و تا همین اواخر مجبور بودید برای دریافت نقشه‌های آفلاین روی یک ساعت پول بسیار جدی خرج کنید. اما این در حال تغییر است و ما اکنون چندین گزینه عالی در ساعت‌های رده متوسط ​​و حتی ابتدایی داریم. برای این لیست، من فقط ساعت‌هایی را در نظر می‌گیرم که مدل‌های فعلی هستند و ممکن است بتوانید با نسخه‌های قدیمی‌تر آن‌ها تخفیف پیدا کنید. همه این ساعت‌ها توسط من یا مردیث دیتز در لایف هکر در جاده‌ها آزمایش شده‌اند. چرا نقشه ها در ساعت اهمیت دارند این ساعت دارای ناوبری خرده نان است اما نقشه ندارد. اعتبار: Beth Skwarecki اجازه دهید من واقعاً در مورد معنای داشتن نقشه برای یک ساعت توضیح دهم. این یک ویژگی برتر در بالای ناوبری و ردیابی GPS است. در اینجا تفاوت بین این سه چیز وجود دارد: ردیابی GPS: جایی که شما در آن هستید ردیابی GPS (یا GNSS) به این معنی است که ساعت می تواند با ماهواره ها ارتباط برقرار کند تا بداند در کجای جهان هستید. تمام ساعت های مدرن دویدن این قابلیت را دارند. (برخی از ابزارهای پوشیدنی، مانند Whoop و Fitbit Air، به جای داشتن این قابلیت در گوشی، از GPS تعبیه شده در گوشی شما استفاده می کنند. این داده GPS به ساعت می گوید که در طول تمرین چقدر مسافت و سرعت می دوید و به شما این امکان را می دهد که داده های خود را بعد از تمرین روی نقشه ببینید، به عنوان مثال، وقتی تمرین را در تلفن خود مرور می کنید، مسیری را که ساعت ردیابی کرده است روی نقشه ای که تلفن بر اساس داده هایی که از اینترنت دانلود"}, {"source": "Lifehacker", "title": "If You Loved 'The Office,' There's One Movie You Need to Watch Next", "link": "https://lifehacker.com/entertainment/best-movies-for-fans-of-the-office?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Since ending its nine-season run in 2013, The Office has only grown more powerful. Thanks to endless re-runs and availability on streaming platforms, the series has evolved into the glue that holds society together no matter who you are, you ve watched The Office (probably more than once, with the exception of Scott s Tots, which is simply too cringey (though hilarious!) for anyone to experience twice). If you just finished your sixth re-watch and you ve watched all the recommended streamalike series , it s time to watch David Brent: Life on the Road . Why fans of The Office should watch David Brent: Life on the Road If you re a huge fan of The Office , you ve almost certainly watched the original UK version created by Rickey Gervais. The original series has a different vibe than the American version, of course, but all the pieces are there especially Gervais s performance as David Brent, who was a slightly meaner Michael Scott. That s what makes David Brent: Life on the Road a must-watch for Office fans. It picks up Brent s story after the series end and digs deep into his character. No longer the boss, Brent is working as a sales rep and finds himself in the same position his employees once did, miserable in his work and treated poorly by many of his co-workers. Instead of inspiring some self-reflection, however, Brent decides to make a desperate stab at music stardom, cleaning out his retirement funds to hire a band and go on a short tour during his vacation. There s very little office in David Brent: Life on the Road , but the film has the same cringe-comedy chops you love about the series. Brent is as bombastic, un-self-aware, and weirdly overconfident as ever when the story kicks off, but just like Michael in the U.S. series is slowly humanized over the course of the story, learning how to make real human connections. Along the way, there s plenty of awkward comedy and hilarious moments, all done in the same mockumentary style of both the original show and the American adaptation. If you re looking for something similar to bridge the gap to your next re-watch of the show, this is the perfect choice. Stream David Brent: Life on the Road on Netflix . David Brent: Life on the Road (2016) at Netflix Learn More Learn More at Netflix More movies that fans of The Office should watch If that just made you want to watch more office-based comedies or mockumentaries that do cringe comedy well, never fear: Here a", "date_str": "2026-09-11T17:30:37+00:00", "hash": "d603fba73a22c865", "title_fa": "اگر عاشق «دفتر» بودید، یک فیلم وجود دارد که باید در ادامه ببینید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. از زمان پایان اجرای نه فصل خود در سال 2013، آفیس تنها قدرتمندتر شده است. به لطف تکرار بی‌پایان و در دسترس بودن در پلتفرم‌های استریم، این مجموعه تبدیل به چسبی شده است که جامعه را بدون توجه به اینکه چه کسی هستید، کنار هم نگه می‌دارد، شما The Office را تماشا کرده‌اید (احتمالاً بیش از یک بار، به استثنای Scott s Tots، که به سادگی بیش از حد ترسناک است (هر چند خنده‌دار!) برای هر کسی که نمی‌تواند دو بار تجربه کند). اگر به تازگی ششمین تماشای مجدد خود را به پایان رسانده اید و تمام سریال های پخش جریانی توصیه شده را تماشا کرده اید، زمان تماشای دیوید برنت: زندگی در جاده فرا رسیده است. چرا طرفداران The Office باید David Brent: Life on the Road را تماشا کنند اگر از طرفداران پرشور The Office هستید، تقریباً مطمئناً نسخه اصلی بریتانیا را که توسط Rickey Gervais ساخته شده است تماشا کرده اید. البته سری اصلی حال و هوای متفاوتی نسبت به نسخه آمریکایی دارد، اما همه قطعات وجود دارد، به ویژه بازی جرویس در نقش دیوید برنت، که مایکل اسکات کمی پست تر بود. این چیزی است که دیوید برنت: زندگی در جاده را برای طرفداران آفیس واجب می کند. پس از پایان سریال داستان برنت را بررسی می کند و عمیقاً شخصیت او را می کاود. برنت دیگر رئیس نیست، به عنوان نماینده فروش کار می کند و خود را در همان موقعیتی می بیند که کارمندانش در گذشته داشتند، در کارش بدبخت است و بسیاری از همکارانش با آنها بد رفتار می کردند. با این حال، برنت به جای الهام بخشیدن به خود اندیشی، تصمیم می گیرد با خنجر زدن ناامیدانه به ستاره های موسیقی، بودجه بازنشستگی خود را جمع آوری کند تا گروهی را"}, {"source": "Lifehacker", "title": "10 Hacks Every Google Photos User Should Know", "link": "https://lifehacker.com/tech/10-hacks-every-google-photos-user-should-know?utm_medium=RSS", "summary": "Google Photos doesn't have to be one of those things that you set up and forget. Despite its initial simplicity, Google Photos is full of settings and features you can configure to make the app work better for you. With these hacks, you can manage a massive photo library, reduce cloud storage, hide pictures of your ex, and disable AI in search. Use Storage saver mode to upload more photos without running out of cloud storage If you feel like you re going to run out of cloud storage space, and you don t care about backing up photos and videos at the best quality possible, try Google s Storage saver mode. When backing up, it automatically scales down photos and videos to help you save cloud storage space at a respectable quality level. Photos get scaled down to 16MP, and videos stay at 1080p. This only works for new uploads, though, so the sooner you enable this feature, the better off you ll be. Go to Settings Backup Photo and Video Quality and switch to Storage Saver . Use Hide Faces to stop Google Photos from resurfacing photos of your ex Credit: Khamosh Pathak Google Photos' Memories feature surfaces old photos and videos, and stitches them together in slideshows and videos. But this can also backfire if it shows you photos of people (say, an ex) you'd rather not see randomly in notifications when you're trying to work. Memories is thankfully highly customizable. You can tell Google Photos to show you more photos of your partner, kids, or pets, and ask it to show fewer photos of specific people. You can even block people from ever surfacing in suggestions. Go to Photos settings Preferences Memories Hide Faces . Then, choose the faces that you want to block. Use this setting to automatically back up Locked photos to the cloud You can use the Locked Folder in Google Photos to save sensitive photos or documents in a secure folder. Only a PIN or biometrics can get you through. But by default, the Locked Folder contents are local-only. Even if your entire Google Photos library is backed up, you might lose all that secured media if you lose your phone. There is a hidden setting that does let you back up and sync locked photos securely. Even after they are synced to the cloud and other devices, they will continue to stay in the Locked Folder. If it's not already set up, go to the Collections tab, swipe all the way to the bottom, and choose Locked Folder . During setup, you can enable the cloud backup feature. Alternatively, open the Locked Folder, tap the Cloud", "date_str": "2026-09-11T16:30:00+00:00", "hash": "eec860a016080843", "title_fa": "10 هک که هر کاربر Google Photos باید بداند", "summary_fa": "Google Photos نباید یکی از مواردی باشد که شما تنظیم کرده و فراموش می کنید. علی‌رغم سادگی اولیه، Google Photos پر از تنظیمات و ویژگی‌هایی است که می‌توانید پیکربندی کنید تا برنامه برای شما بهتر کار کند. با این هک ها، می توانید یک کتابخانه عکس عظیم را مدیریت کنید، فضای ذخیره سازی ابری را کاهش دهید، تصاویر سابق خود را مخفی کنید و هوش مصنوعی را در جستجو غیرفعال کنید. از حالت ذخیره‌سازی ذخیره‌سازی برای آپلود عکس‌های بیشتر بدون اتمام فضای ذخیره‌سازی ابری استفاده کنید اگر احساس می‌کنید فضای ذخیره‌سازی ابری شما تمام می‌شود و برایتان مهم نیست که از عکس‌ها و ویدیوها با بهترین کیفیت ممکن نسخه پشتیبان تهیه کنید، حالت ذخیره‌سازی ذخیره‌سازی Google را امتحان کنید. هنگام پشتیبان‌گیری، به طور خودکار عکس‌ها و ویدیوها را کاهش می‌دهد تا به شما کمک کند فضای ذخیره‌سازی ابری را در سطح کیفی قابل‌اعتمادی ذخیره کنید. عکس‌ها تا 16 مگاپیکسل کوچک می‌شوند و ویدیوها در کیفیت 1080p باقی می‌مانند. این فقط برای آپلودهای جدید کار می کند، بنابراین هرچه زودتر این ویژگی را فعال کنید، وضعیت بهتری خواهید داشت. به Settings Backup Photo and Video Quality بروید و به Storage Saver بروید. از Hide Faces برای جلوگیری از نمایش مجدد عکس‌های اعتبار قبلی‌تان توسط Google Photos استفاده کنید: ویژگی خاموش Pathak Google Photos' Memories عکس‌ها و ویدیوهای قدیمی را نشان می‌دهد و آنها را در نمایش‌های اسلاید و ویدیو به هم می‌چسباند. اما اگر عکس‌هایی از افرادی را به شما نشان دهد (مثلاً یک سابق) که ترجیح می‌دهید در هنگام کار به‌طور تصادفی در اعلان‌ها نبینید، می‌تواند نتیجه معکوس نیز داشته باشد. خاطرات خوشبختانه بسیار قابل تنظیم است. می‌توانید به Google Photos بگویید تا عکس‌های بیشتری از شریک زندگی، بچه‌ها یا حیوانات خانگی شما به شما نشان دهد و از آن بخواهید عکس‌های کمتری از افراد خاص نشان دهد. حتی می‌توانید"}, {"source": "Lifehacker", "title": "This Long-Awaited Feature Is Finally Coming to the Apple Watch", "link": "https://lifehacker.com/tech/apple-watch-step-count-feature?utm_medium=RSS", "summary": "We may earn a commission from links on this page. We expect fitness wearables to count our steps an idea that Fitbit borrowed from pedometers forever ago. In recent years even Oura and Whoop have added step tracking. But the Apple Watch has never made it easy to see your step count, even though it s been keeping track in the background all along. Apple is finally changing that. Apple Watch Series 12 (GPS, 42mm) $399.00 at Amazon Learn More Learn More $399.00 at Amazon On the product pages for the Series 12 and the Apple Watch Ultra, Apple boasts that the new watches give you a more accurate step count interesting, because step count hasn t been a selling point in the past. And then comes the big news: And now you can more easily check your step count, right from your watch face. So far, it has been frustratingly difficult to get a step count on your watch. You would think you could easily add that number to a watch complication (a complication being a mini data field for the watch face), but nope if you want a little counter of your steps on the watch face, you have to install a third-party app to provide that. I kind of understand why: Apple wanted to set itself apart from the Fitbits of the world. You re supposed to close your rings , and rings are based on movement, exercise, and stand hours. I can imagine somebody at Apple saying no, step counting is dumb and they were arguably right. But the idea has stuck in the public consciousness; we now expect step counts, and Apple is finally going to deliver. How to get step count on your Apple Watch First of all, the Apple Watch already counts your steps. You can see your step count by going to the Health app on your phone and searching for Steps . Scroll to the bottom of the Steps screen and tap Add to Pinned . Now it will be the first thing you see when you open the Health app. (Surprised the Health app can do this? You have no idea of the hidden gems in that thing.) To get a step count on your Apple Watch right now , without upgrading anything, you ll need to install a step counter app. Duffy is a popular (free) one; there are plenty of others out there, so choose one you like. These apps typically provide a complication, so you can add your step count to your favorite watch face. But what about taking advantage of Apple s new embrace of the step count? Apple says the feature will be available on the Series 12 and Ultra 4 watches. That said, this seems like a very simple software change, so I d bet money th", "date_str": "2026-09-11T16:00:00+00:00", "hash": "17cadd46eba6d501", "title_fa": "این ویژگی که مدت ها منتظرش بودیم بالاخره به اپل واچ می آید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. ما انتظار داریم که ابزارهای پوشیدنی تناسب اندام قدم های ما را بشمارند، ایده ای که Fitbit برای همیشه از قدم سنج ها قرض گرفته بود. در سال های اخیر حتی Oura و Whoop نیز ردیابی گام را اضافه کرده اند. اما اپل واچ هرگز دیدن تعداد گام‌های شما را آسان نکرده است، حتی اگر همیشه در پس‌زمینه ردیابی داشته باشد. اپل بالاخره در حال تغییر آن است. اپل واچ سری 12 (GPS، 42 میلی متر) 399.00 دلار در آمازون بیشتر بدانید 399.00 دلار در آمازون در صفحات محصول سری 12 و اپل واچ اولترا، اپل به خود می بالد که ساعت های جدید تعداد گام های دقیق تری را به شما ارائه می دهند، زیرا تعداد گام ها در گذشته نقطه فروش نبوده است. و سپس یک خبر بزرگ می آید: و اکنون می توانید به راحتی تعداد قدم های خود را درست از صفحه ساعت خود بررسی کنید. تا کنون، به‌طور ناامیدکننده‌ای دشوار بوده است که تعداد قدم‌های ساعت خود را به دست آورید. ممکن است فکر کنید که می‌توانید به راحتی آن عدد را به یک پیچیدگی ساعت اضافه کنید (عوارضی که یک فیلد داده کوچک برای صفحه ساعت است)، اما خیر، اگر می‌خواهید کمی از گام‌های خود را روی صفحه ساعت شمارش کنید، باید یک برنامه شخص ثالث برای ارائه آن نصب کنید. من به نوعی می فهمم چرا: اپل می خواست خود را از Fitbits دنیا متمایز کند. شما باید حلقه های خود را ببندید و حلقه ها بر اساس حرکت، ورزش و ساعت ایستادن هستند. می توانم تصور کنم که شخصی در اپل بگوید نه، شمارش گام ها احمقانه است و مسلماً حق با آنها بود. اما این ایده در آگاهی عمومی باقی مانده است. ما اکنون انتظار تعداد مراحل را داریم و"}, {"source": "Lifehacker", "title": "I Just Bought a House, and I Want to Make It the Coolest One in the Neighborhood", "link": "https://lifehacker.com/home/i-just-bought-a-house-and-i-want-to-make-it-the-coolest-home-possible?utm_medium=RSS", "summary": "We may earn a commission from links on this page. After years of city living and renting, I finally bought a house. And, as any homeowner will tell you, buying a house means taking on a large, time-consuming, expensive responsibility. I plan to share that adventure over on our social media pages, but with a twist: You can expect home maintenance content, but I also want to make this the kind of house I wanted as a kid. You know, like when you visited your friend who lived in the coolest house in the neighborhood. View this post on Instagram I have a long list of small projects I've been putting off, like fixing my running toilet or cleaning my garbage bins so bears and flies stop coming around ; but I also have fun projects that I want to try out, like installing permanent outdoor lights , designing a reading nook, converting my garage into a home gym, and turning my basement into a home theater. As I enter my influencer \"like and subscribe\" era, I invite you to follow along on our official Instagram , official YouTube , or my personal page . And if you want to browse any of the products I use to do the projects yourself, you can find an ongoing shopping list , organized by project, on one convenient page. I'm looking forward to the hard work...I think. I'll see you here and on our social pages.", "date_str": "2026-09-11T15:30:27+00:00", "hash": "d3cdb059ae363ff9", "title_fa": "من تازه یک خانه خریدم و می خواهم آن را به جذاب ترین خانه در محله تبدیل کنم", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. بعد از سال ها زندگی در شهر و اجاره، بالاخره خانه ای خریدم. و همانطور که هر صاحب خانه به شما خواهد گفت، خرید خانه به معنای بر عهده گرفتن مسئولیت بزرگ، وقت گیر و گران است. من قصد دارم آن ماجراجویی را در صفحات رسانه های اجتماعی خود به اشتراک بگذارم، اما با یک پیچ و خم: شما می توانید انتظار محتوای تعمیر و نگهداری خانه را داشته باشید، اما من همچنین می خواهم خانه ای را بسازم که در کودکی می خواستم. می دانید، مثل زمانی که به ملاقات دوستتان رفتید که در باحال ترین خانه محله زندگی می کرد. این پست را در اینستاگرام مشاهده کنید من یک لیست طولانی از پروژه های کوچکی دارم که آنها را به تعویق انداخته ام، مانند تعمیر توالت در حال اجرا یا تمیز کردن سطل های زباله ام تا خرس ها و مگس ها از آمدن دور نشوند. اما پروژه‌های سرگرم‌کننده‌ای هم دارم که می‌خواهم آن‌ها را امتحان کنم، مانند نصب چراغ‌های دائمی در فضای باز، طراحی یک گوشه مطالعه، تبدیل گاراژم به یک باشگاه ورزشی خانگی، و تبدیل زیرزمینم به سینمای خانگی. با ورود به دوره اینفلوئنسرهای خود \"لایک و اشتراک\"، از شما دع  اتاق متوسط ​​یا یک اجتماع کوچک در فضای باز را پر کنند، به طرز شگفت آوری بلند می شود. همچنین می‌توانید از آن به عنوان یک بلندگوی بلوتوث با پشتیبانی از بلوتوث 5.3 و برد حدود 100 فوت استفاده کنید. این باعث می شود حتی زمانی که چیزی را فرافکنی نمی کنید مفید باشد. ویژگی کارائوکه ممکن است برای همه مناسب نباشد، اما تصور اینکه تبدیل شدن به جذابیت اصلی در یک مهمانی خانگی آسان است. دو ورودی میکروفون، جلوه های اکو و یک میکروفون سیمی در جعبه دریافت می کنید. برای ویدیو، همه چیز را ساده نگه می دارد. یک لپ‌تاپ، استیک استریم یا کنسول را از طریق HDMI وصل کنید یا از درایو USB"}],
      media: [{"source": "Billboard", "title": "Minneapolis Declares Sept. 9 Los Tigres del Norte Day & More Uplifting Moments in Latin Music", "link": "https://www.billboard.com/music/latin/los-tigres-del-norte-day-minneapolis-uplifting-moments-1236338423/", "summary": "From career milestones to new music releases to major announcements and those little important moments, Billboard editors highlight uplifting moments in Latin music. Here’s what happened in the Latin music world this week. Los Tigres del Norte Headline the First Hispanic Heritage Awards Held Outside D.C. Los Tigres del Norte were honored with their own day in Minneapolis on Wednesday (Sept. 9), when Mayor Jacob Frey welcomed the band to City Hall and proclaimed it “Los Tigres del Norte Day.” “Los Tigres have always shown up and spoken up for our community, and it is a privilege to once again provide them with a stage to do so,” said Antonio Tijerino, president and CEO of HHF, in a statement. The recognition came one day before the Mexican-American group headlined the 39th annual Hispanic Heritage Awards at Orchestra Hall, marking the first time the ceremony was held outside Washington, D.C. Other honorees included Mon Laferte, Ximena Sariñana, Oscar D’León, Eladio Carrión and U.S. Rep. Joaquín Castro, in a night that celebrated Latin contributions across music, culture and public service. View this post on Instagram Feid s Short Film El Green Print is Headed to U.S. Theaters Colombian artist Feid is bringing his short film El Green Print to the big screen for a special one-night event on Sunday (Sept. 13). The film will screen in 42 Regal theaters across 41 U.S. cities, with tickets priced at $10 — fully redeemable as a concession voucher at participating locations — and will include the theatrical premiere of his new music video for “A Xon De Que.” Set across Japan, Miami, Los Angeles and Tokyo, El Green Print follows the latest evolution of Feid’s iconic Ferxxo alter ego, blending underground culture, modified cars, drift racing and cinematic storytelling. The film features appearances by Álvaro Díaz, Yuki Chiba, Tony Hawk and Japanese racing star Keiichi Tsuchiya. Tickets available here . Watch a teaser below. View this post on Instagram Latin Grammy Cultural Foundation Awards More Than $1.7 Million in Scholarships The Latin Grammy Cultural Foundation awarded more than $1.7 million in scholarships to music students from across the United States and Ibero-America, supporting tuition, mentorship, learning labs and other educational opportunities. The 2026 recipients include Puerto Rican violinist Razil Rosado Figueroa, who received the Noel Schajris “Prodigy” Scholarship — a four-year award valued at up to $250,000 to study at Berklee College of Music. “E", "date_str": "2026-09-12T14:00:00+00:00", "hash": "46630ff117173843", "title_fa": "مینیاپولیس 9 سپتامبر را روز Los Tigres del Norte و لحظات نشاط‌آور بیشتر در موسیقی لاتین اعلام کرد.", "summary_fa": "ویراستاران بیلبورد از نقاط عطف شغلی گرفته تا انتشار موسیقی جدید تا اطلاعیه های مهم و آن لحظات مهم کوچک، لحظات نشاط آور در موسیقی لاتین را برجسته می کنند. این چیزی است که این هفته در دنیای موسیقی لاتین اتفاق افتاد. Los Tigres del Norte Headline اولین جوایز میراث اسپانیایی که در خارج از دی سی برگزار شد. لوس تیگر دل نورته با روز خود در مینیاپولیس در روز چهارشنبه (سپتامبر). 9)، زمانی که شهردار جیکوب فری از گروه در تالار شهر استقبال کرد و آن را \"روز لوس تیگر دل نورت\" اعلام کرد. آنتونیو تیجرینو، رئیس و مدیر عامل HHF در بیانیه‌ای گفت: \"لس تیگرس همیشه ظاهر شده و برای جامعه ما صحبت کرده است، و این یک افتخار است که یک بار دیگر زمینه را برای آنها فراهم کنیم.\" این قدردانی یک روز قبل از اینکه گروه مکزیکی-آمریکایی تیتر یک سی و نهمین جوایز سالانه میراث اسپانیایی در سالن ارکستر شود، به‌عنوان اولین بار برگزار شد که مراسم در خارج از واشنگتن دی سی برگزار شد. موسیقی، فرهنگ و خدمات عمومی. این پست را در اینستاگرام مشاهده کنید. تئاترها، هنرمند کلمبیایی فید، فیلم کوتاه خود را به نام El Green Print برای یک رویداد ویژه یک شبه در روز یکشنبه (13 سپتامبر) به پرده نمایش بزرگ می آورد. این فیلم در 42 سینمای رگال در 41 ایالات متحده نمایش داده می شود. شهرها، با بلیت‌هایی به قیمت 10 دلار - که به طور کامل به عنوان کوپن امتیاز در مکان‌های شرکت‌کننده قابل بازخرید است - و شامل اولین نمایش موزیک ویدیوی جدید او برای \"A Xon De Que\" خواهد بود. ال گرین پرینت که در سراسر ژاپن، میامی، لس آنجلس و توکیو اتفاق می‌افتد، آخرین تکامل نماد Ferxxo alter ego Feid را دنبال می‌کند، فرهنگ زیرزمینی، اتومبیل‌های اصلاح‌شده، مسابقات دریفت و داستان‌سرایی سینمایی را در هم می‌آمیزد."}, {"source": "Billboard", "title": "The Roots Talk Hip-Hop Hall of Fame, ‘Endgame’ & Roots Picnic | Billboard R&B/Hip-Hop House 2026", "link": "https://www.billboard.com/video/the-roots-hip-hop-hall-of-fame-endgame-roots-picnic/", "summary": "The Roots joined Billboard for an R B panel conversation covering their 2026 Hip-Hop Hall of Fame moment, four decades of brotherhood, and what’s next — including updates on the long-teased project Endgame . Black Thought and Questlove also talk about the “secret sauce” behind their creative synergy, how fans are giving Thought his flowers in the algorithm era, Roots Picnic’s massive growth and why “creativity is transferable.” They also discuss studio stories (including how deep the vault really goes), the “no spoilers” approach to features and a throwback to performing at the 2002 Grammys with Eminem. Carl Lamarre: I would ve thought you were a Knicks fan for a second the way you were yelling when that tip-in happened. Questlove: I mean- I, I mean- What was I gonna boo? Carl Lamarre: I, I- [ Laughs ] Questlove: I m in New York City. Black Thought: I would ve thought you were a Knicks fan for a second. Questlove: Look, I m a forever Philadelphia. D- don t get it twisted. Black Thought: Wow. Questlove: But I m in, you know, uh, this is my 18th year here. Carl Lamarre: I know, I just, you know- Questlove: I gotta go somewhere. Carl Lamarre: I m just seeing who you repping. [upbeat music] We have a Hall of Fame group in the building today. We giving flowers today. This group is straight out of Philly. We talking four decades of straight heat, of longevity, of success. I m talking about The Roots. Come on, now. Come on, now. Black Thought, Questlove, they are our 2026 Hip-Hop Hall of Famers. So we re gonna really dive into their career, their marvelous year, and I m, I m just gonna stop talking. I m gonna bring the brothers out here. Can we have the brothers, please? Black Thought. [cheering] Questlove. [clapping] Come on, now. Ah. Woo. I just gotta say, I could ve went with a Roots record. I wanted to, but I was like, I was bumping Hov and it just was so befitting, the rhymes. Never been a n a this good for this long. Watch the full video above!", "date_str": "2026-09-12T13:00:00+00:00", "hash": "00e7d58e28eac920", "title_fa": "The Roots Talk Hip-Hop Hall of Fame، «Endgame» و Roots Picnic | Billboard R&B/Hip-Hop House 2026", "summary_fa": "The Roots به بیلبورد ملحق شد تا یک گفتگوی پانل R B را پوشش دهد که در آن لحظه تالار مشاهیر هیپ هاپ 2026، چهار دهه برادری و اتفاقات بعدی را پوشش می دهد - از جمله به روز رسانی در مورد پروژه طولانی مدت Endgame. Black Thought و Questlove همچنین در مورد \"سس مخفی\" پشت هم افزایی خلاقانه خود، نحوه اهدای گل های طرفداران Thought به Thought در دوره الگوریتم، رشد عظیم Roots Picnic و چرایی \"خلاقیت قابل انتقال\" صحبت می کنند. آن‌ها همچنین درباره داستان‌های استودیویی (از جمله اینکه خرک واقعاً چقدر عمیق است)، رویکرد «بدون اسپویلر» به ویژگی‌ها و بازگشت به اجرای مراسم گرمی 2002 با امینم بحث می‌کنند. کارل لامار: فکر می‌کردم برای لحظه‌ای از طرفداران نیکز هستید، همان‌طور که وقتی آن تذکر داد می‌کردید. Questlove: یعنی- من، یعنی- چی رو می خواستم بو کنم؟ کارل لامار: من، من- [می خندد] Questlove: من در شهر نیویورک هستم. Black Thought: من فکر می‌کردم برای یک لحظه طرفدار نیکز هستید. Questlove: ببینید، من یک فیلادلفیا برای همیشه هستم. د- آن را پیچ و تاب نکنید. فکر سیاه: عجب. Questlove: اما من وارد شده ام، می دانید، اوه، این هجدهمین سال است که اینجا هستم. کارل لامار: می دانم، فقط، تو می دانی- کوئست لاو: باید جایی بروم. کارل لامار: من فقط می بینم که شما چه کسی را تکرار می کنید. [موسیقی شاد] امروز یک گروه تالار مشاهیر در ساختمان داریم. ما امروز گل می دهیم. این گروه مستقیماً از فیلی خارج شده اند. ما از چهار دهه گرمای مستقیم، طول عمر و موفقیت صحبت می کنیم. من در مورد The Roots صحبت می کنم. حالا بیا حالا بیا Black Thought، Questlove، آنها تالار مشاهیر هیپ هاپ 2026 ما هستند. بنابراین ما واقعاً وارد حرفه آنها خواهیم شد، سال شگفت انگیز آنها، و من فقط صحبت نمی کنم."}, {"source": "Billboard", "title": "Kylie Minogue to Deliver 20-Minute ‘Spectacle’ at AFL Grand Final", "link": "https://www.billboard.com/music/pop/kylie-minogues-afl-grand-final-show-mcg-1236338919/", "summary": "Kylie Minogue s headline performance at this year s AFL Grand Final is being billed as the biggest spectacle ever seen at the Melbourne Cricket Ground, according to new details about the show. Per a report in Melbourne s Sunday Herald Sun , the pop icon will deliver a 20-minute pre-game production featuring an avant-garde stage, dancers and visual elements never before seen at a Grand Final. The performance — produced in partnership with Mushroom Group and the AFL — is being described as a world-class production. The Grand Final takes place Saturday, Sept. 26, at the MCG, with around 100,000 fans expected at the stadium and millions more watching the broadcast. AFL CEO Andrew Dillon called it the league s most ambitious pre-game show to date. Kylie s performance on the day of the Grand Final is the greatest production and show we ve performed so far, he said, adding that the league is very excited that Kylie is returning home to perform on our most important day. Ahead of the match, Yarra Park will host a Footy Festival and a Kylie Village, where fans can buy exclusive official merchandise, both launching Sept. 23. The performance marks Minogue s first time headlining the AFL Grand Final, the biggest date on the Australian sporting calendar. When the booking was announced in March, the Melbourne-born singer framed it as a homecoming. As a Melburnian, I m so excited to be coming home for the biggest day in the Aussie sporting calendar, she said at the time. I ll not only be performing, but I ll be one of 100,000 fans at the G, watching the wonder that is footy. She is the first Australian to headline the event since 2021, when a medley of local acts performed at Perth s Optus Stadium during the COVID-19 pandemic; the intervening years featured international headliners Robbie Williams, KISS, Katy Perry and, in 2025, Snoop Dogg. One of the most successful pop artists in history, Minogue has sold more than 80 million records worldwide and scored nine No. 1 albums in Australia across a career spanning nearly four decades. A two-time Grammy winner and 18-time ARIA Award recipient, she returned to the U.S. spotlight in recent years with the global smash Padam Padam and her Grammy-winning album Tension . She toured Australia in March 2026 on her Tension Tour, her first headline shows in the country since 2019.", "date_str": "2026-09-12T08:17:22+00:00", "hash": "72dce354f15f79e7", "title_fa": "کایلی مینوگ \"Spectacle\" 20 دقیقه ای را در فینال بزرگ AFL ارائه می کند.", "summary_fa": "با توجه به جزئیات جدید در مورد نمایش، اجرای سرفصل کایلی مینوگ در فینال بزرگ AFL امسال به عنوان بزرگترین نمایشی که تا به حال در زمین کریکت ملبورن دیده شده است، معرفی می شود. طبق گزارشی در ساندی هرالد سان ملبورن، نماد پاپ یک تولید 20 دقیقه ای قبل از بازی را ارائه می دهد که شامل صحنه ای آوانگارد، رقصندگان و عناصر بصری است که قبلاً در یک فینال بزرگ دیده نشده بود. این اجرا - که با مشارکت گروه قارچ و AFL تولید شده است - به عنوان یک تولید در سطح جهانی توصیف می شود. فینال بزرگ شنبه، 26 سپتامبر، در MCG برگزار می شود و انتظار می رود حدود 100000 هوادار در استادیوم حضور داشته باشند و میلیون ها نفر دیگر پخش را تماشا کنند. اندرو دیلون، مدیر عامل AFL، آن را جاه طلبانه ترین نمایش قبل از بازی لیگ تا به امروز خواند. او گفت که اجرای کایلی در روز فینال بزرگ بزرگترین تولید و نمایشی است که ما تاکنون اجرا کرده ایم و افزود که لیگ بسیار هیجان زده است که کایلی برای اجرای مهم ترین روز ما به خانه بازمی گردد. قبل از مسابقه، یارا پارک میزبان فستیوال فوتی و روستای کایلی است که در آن طرفداران می توانند کالاهای رسمی انحصاری خریداری کنند که هر دو در 23 سپتامبر راه اندازی می شوند. این نمایش اولین باری است که مینوگ در فینال بزرگ AFL، بزرگترین تاریخ در تقویم ورزشی استرالیا، تیتر اول می شود. هنگامی که رزرو در ماه مارس اعلام شد، خواننده ملبورن آن را به عنوان یک بازگشت به خانه توصیف کرد. او در آن زمان گفت، به‌عنوان یک ملبورنیایی، بسیار هیجان‌زده هستم که برای بزرگ‌ترین روز در تقویم ورزشی استرالیا به خانه می‌آیم. من نه تنها اجرا خواهم کرد، بلکه یکی از 100,000 طرفدار در G خواهم بود"}, {"source": "Billboard", "title": "Nashville Airport Moves to Rename Itself After Dolly Parton in Unanimous Vote", "link": "https://www.billboard.com/music/country/dolly-parton-nashville-airport-1236338913/", "summary": "Nashville International Airport is set to be renamed in honor of Dolly Parton , after the airport s governing board voted unanimously to begin the process on Friday (Sept. 11). The Metropolitan Nashville Airport Authority board of commissioners voted 6-0 to start modifying the airport s name to honor the late country icon, who died Aug. 25 at age 80 following a brief battle with cancer. A final name has not yet been determined. While a final name has not yet been determined, we are working closely with the appropriate parties to thoughtfully determine how Dolly Parton s name and legacy will be incorporated, the authority said, describing the vote as the first step in a multifaceted process and noting it expects to share more detailed plans in the coming months. The final name will be decided jointly by airport leaders and the Dollywood Foundation, the nonprofit Parton established in 1988. The board also had to modify its existing naming policy, which generally calls for airport properties to be named after individuals who have been deceased for at least two years. The renaming push predates Parton s death — a petition to rename the airport Dolly Parton International Airport launched in early 2025 — but gained momentum after she died, with the petition surpassing 175,000 signatures. The effort has drawn bipartisan support: Tennessee Gov. Bill Lee, a Republican, proposed the change shortly after Parton s death, and Nashville s Democratic mayor, Freddie O Connell, backed it, with the city s Metro Council unanimously adopting a supporting resolution on Sept. 1. At a place where Tennessee welcomes the world, it is fitting that Nashville International Airport would bear the name of our state s favorite daughter, Lee said in his initial statement. A Tennessee native born in Sevier County, Parton became one of the most successful and beloved figures in American music, selling more than 100 million records worldwide across a seven-decade career. She topped the Billboard Hot 100 with 9 to 5 and Islands in the Stream (with Kenny Rogers), holds the record for the most No. 1s by a woman on the Hot Country Songs chart with 25, and was inducted into the Country Music Hall of Fame in 1999 and the Rock Roll Hall of Fame in 2022. Beyond her music, she was celebrated for her philanthropy, particularly the Dollywood Foundation s Imagination Library, which has distributed hundreds of millions of books to children.", "date_str": "2026-09-12T06:03:12+00:00", "hash": "419cc861f993d7ab", "title_fa": "فرودگاه نشویل با رای وحدت رویه نام خود را به نام دالی پارتون تغییر می‌دهد", "summary_fa": "فرودگاه بین‌المللی نشویل قرار است به افتخار دالی پارتون تغییر نام دهد، زیرا هیئت مدیره فرودگاه به اتفاق آرا به آغاز فرآیند در روز جمعه (11 سپتامبر) رای داد. هیئت کمیساریای اداره فرودگاه متروپولیتن نشویل با 6-0 رأی به شروع تغییر نام فرودگاه برای گرامیداشت نماد کشور فقید، که در 25 اوت در 80 سالگی در پی نبردی کوتاه با سرطان درگذشت، رای داد. نام نهایی هنوز مشخص نشده است. در حالی که نام نهایی هنوز مشخص نشده است، ما از نزدیک با احزاب مناسب کار می کنیم تا به طور اندیشمندانه تعیین کنیم که نام و میراث دالی پارتون چگونه گنجانده شود، این مقام با توصیف این رای به عنوان اولین گام در یک روند چند وجهی و اشاره کرد که انتظار دارد در ماه های آینده برنامه های دقیق تری را به اشتراک بگذارد. نام نهایی به طور مشترک توسط رهبران فرودگاه و بنیاد Dollywood، سازمان غیرانتفاعی Parton که در سال 1988 تأسیس شد، تعیین خواهد شد. این هیئت همچنین مجبور شد سیاست نامگذاری موجود خود را تغییر دهد، که عموماً خواستار نامگذاری املاک فرودگاه به نام افرادی است که حداقل دو سال است که فوت کرده اند. تلاش برای تغییر نام قبل از مرگ پارتون است - طوماری برای تغییر نام فرودگاه بین‌المللی دالی پارتون که در اوایل سال 2025 راه‌اندازی شد - اما پس از مرگ او شتاب بیشتری گرفت و این طومار از 175000 امضا فراتر رفت. این تلاش حمایت دو حزبی را جلب کرده است: فرماندار تنسی. بیل لی، یک جمهوری خواه، اندکی پس از مرگ پارتون این تغییر را پیشنهاد کرد و فردی او کانل، شهردار دموکرات نشویل، از آن حمایت کرد و شورای متروی شهر به اتفاق آرا قطعنامه حمایتی را در 1 سپتامبر به تصویب رساند. پارتون که بومی تنسی متولد شده در شهرستان سویر است، به یکی از موفق‌ترین و"}, {"source": "Billboard", "title": "Lady Gaga Welcomes First Baby With Fiancé Michael Polansky: Reports", "link": "https://www.billboard.com/music/pop/lady-gaga-baby-michael-polansky-first-child-1236338900/", "summary": "A (baby) star is born: Lady Gaga and her fiancé, Michael Polansky, have welcomed their first child, according to multiple reports. The couple has yet to share the news, but according to photos obtained by Page Six , they were spotted out in Northern California with a baby in tow, with Gaga wearing the newborn in a sling. No additional details, including the baby s gender or birth date, are known. This is the first baby for both Gaga (real name: Stefani Germanotta) and Polansky. Billboard has reached out to reps for Gaga for confirmation. Gaga and Polansky similarly didn t announce the news that they were engaged to be married , with the singer simply referring to the tech entrepreneur as her fiancé in July 2024. Later that year, she confirmed that Polansky had proposed months earlier, in April 2024, and then shared details of the proposal in an interview with Jimmy Kimmel. “He proposed to me right after my birthday, so my birthday passed and I was like, ‘Well, I thought he was gonna propose …, ” Gaga said on Jimmy Kimmel Live! , explaining that he popped the question during a rock-climbing trip. “We were just walking back to the room and talking,” she continued. “He actually — it was very Michael — asked me if he could ask me. He wanted to know if it was OK to propose before he proposed. And I was like, ‘Yes, it’s so OK!’” The couple have been publicly dating since early 2020 when Gaga made their relationship Instagram-official with a post that February. In an interview a few months later, she referred to Polansky as “the love of my life.” Gaga wrapped her The Mayhem Ball tour back in April and has kept a low profile publicly since.", "date_str": "2026-09-12T01:31:17+00:00", "hash": "f70fc3ad7474d5c8", "title_fa": "لیدی گاگا با نامزدش مایکل پولانسکی خوش آمد گفت: گزارش ها", "summary_fa": "یک ستاره (کودک) به دنیا آمد: طبق گزارش های متعدد، لیدی گاگا و نامزدش، مایکل پولانسکی، اولین فرزند خود را به دنیا آوردند. این زوج هنوز این خبر را به اشتراک نگذاشته‌اند، اما بر اساس عکس‌های به دست آمده توسط Page Six، آنها در شمال کالیفرنیا با یک نوزاد در کنار خود دیده شدند، در حالی که گاگا نوزاد را در بند انداخته بود. هیچ جزئیات اضافی، از جمله جنسیت یا تاریخ تولد نوزاد، مشخص نیست. این اولین نوزاد برای گاگا (نام اصلی: استفانی جرمنوتا) و پولانسکی است. بیلبورد برای تایید با نمایندگان گاگا تماس گرفته است. گاگا و پولانسکی به طور مشابه خبر نامزدی خود را اعلام نکردند، و خواننده صرفاً در جولای 2024 به کارآفرین فناوری به عنوان نامزد خود اشاره کرد. در اواخر همان سال، او تأیید کرد که پولانسکی ماه‌ها قبل، در آوریل 2024، خواستگاری کرده بود و سپس جزئیات این خواستگاری را در مصاحبه‌ای با جیمی کیم به اشتراک گذاشت. گاگا در برنامه Jimmy Kimmel Live گفت: \"او بلافاصله بعد از تولدم از من خواستگاری کرد، بنابراین تولد من تمام شد و من e. Related Tupac Shakur Murder Verdict: Man Found Guilty In Rapper s 1996 Slaying Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction Durk remains in custody, since he still faces an additional racketeering charge that accuses him of operating his OTF label as a violent gang. Judge Michael W. Fitzgerald excluded that new count from the original trial and scolded prosecutors for tacking it on at the last minute. A second trial is currently scheduled for Oct. 5. Durk s attorney, Drew Findling , said the defense team is so elated and proud while speaking outside the courthouse following the verdict. 22 months ago, Durk and I made an agreement that we would make history with the greatest verdict in this country, and it happened today, said Findling. Durk is not guilty of all charges.” “So now we work to get pull the shackles off, added Findling. The shackles must come off, and he must walk free so that he can come home to his beautiful family and to the world that loves him.” A rep for the prosecution did return a request for comment. Prosecutors claimed during a two-week trial that Durk ordered his Only the Family (OTF) crew to murder Rondo in retaliation for the 2020 killing of his close friend and collaborator King Von . Rondo was shot at a Los Angeles gas station in 2022 and survived, but his cousin Saviay’a Robinson, also known as Lul Pab, was killed in the crossfire. The case rested largely on testimony from three alleged participants in the plot who pled guilty and became government cooperators: Kacey “OTF Jam” Hester, Keith “Flacka” Jones, and Kavon “Vonnie” Grant. The trio told jurors that Durk planned for a group of shooters to travel from Chicago to Los Angeles in 2022 and offered cash rewards for the attack, though", "date_str": "2026-09-12T00:23:44+00:00", "hash": "8ddb73aa212da3fa", "title_fa": "لیل دورک از تمامی اتهامات در محاکمه قتل برای اجاره به خاطر حمله کواندو روندو تبرئه شد", "summary_fa": "لیل دورک از تمام اتهامات متهم به سازماندهی یک توطئه قتل برای اجاره که کواندو روندو را هدف قرار داده و در نهایت پسر عموی رپر رقیب را به قتل رساند، تبرئه شده است. بیلبورد تأیید کرد که هیئت منصفه در دادگاه فدرال لس آنجلس به مدت سه روز قبل از بی گناهی ستاره دریل شیکاگو (درک بنکس) در روز جمعه (11 سپتامبر) به اتهام قتل برای اجیر، تعقیب و توطئه که می توانست او را به حبس ابد محکوم کند، بحث کرد. همدستان دورک، دیوید «براونیز» لیندزی و دیندر «OTF دد» ویلسون، به اتهام تعقیب و توطئه مجرم شناخته شدند، اما از قتل برای اجاره نیز تبرئه شدند. آنها در تاریخ بعدی محکوم خواهند شد. حکم قتل توپاک شکور مرتبط: مردی در سال 1996 در رپر مجرم شناخته شد کشتن بیلبورد برای افزودن آلبوم های رسانه های هوشمند به عنوان فرمت های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل توپاک شکور انجام می دهد. یک باند خشن قاضی مایکل دبلیو. فیتزجرالد آن شمارش جدید را از محاکمه اولیه کنار گذاشت و دادستان ها را به خاطر انجام آن در آخرین لحظه سرزنش کرد. دادگاه دوم در حال حاضر برای 5 اکتبر برنامه ریزی شده است. وکیل دورک، درو فایندلینگ، گفت که تیم دفاعی در حین سخنرانی در خارج از دادگاه پس از صدور حکم، بسیار خوشحال و مفتخر است. فیندلینگ گفت: 22 ماه پیش، دورک و من توافق کردیم که با بزرگترین حکم در این کشور تاریخ را بسازیم و امروز این اتفاق افتاد. دورک در تمامی اتهامات مجرم نیست.» فایندلینگ اضافه کرد: «بنابراین اکنون ما تلاش می کنیم تا قیدها را برداریم. غل و زنجیر باید جدا شود و او باید آزادانه راه برود تا بتواند به خانه نزد خانواده زیبایش و به جهانی که او را دوست دارد بازگردد.»"}, {"source": "Billboard", "title": "Alison Krauss & Union Station, Sister Sadie Among Top 2026 IBMA Awards Nominees: Full List", "link": "https://www.billboard.com/music/awards/alison-krauss-sister-sadie-2026-ibma-awards-nominees-list-1236294582/", "summary": "UPDATE (Sept. 11): Mandolin maestros Sam Bush and Sierra Hull will co-host and perform at the 37th annual IBMA Bluegrass Music Awards, set for Thursday, Oct. 22 at 7:30 p.m. ET at Soldiers and Sailors Memorial Auditorium in Chattanooga Tenn. The Del McCoury Band, Sister Sadie, Authentic Unlimited, The Grascals and Michael Cleveland Flamekeeper are also set to perform. The 2026 class of inductees into the Bluegrass Music Hall of Fame consists of Byron Berline, Nashville Bluegrass Band, Barry Poss and The Lost Found. Musical tributes for each inductee are planned. The IBMA Bluegrass Music Awards will be livestreamed; details coming soon. UPDATE (July 22): One week after announcing the nominations for the 37th annual IBMA Bluegrass Music Awards , the International Bluegrass Music Association announced the nominees for the 2026 IBMA Industry Awards and the 2026 IBMA Momentum Awards. The IBMA Industry Awards recognize outstanding work in non-performing industry categories and honor the individuals who help advance bluegrass music and support its artists. The ceremony will take place on Thursday, Oct. 22, at the Chattanooga Convention Center in Chattanooga, Tenn. The IBMA Momentum Awards recognize artists and industry professionals in the early stages of their bluegrass music careers. In addition to honoring emerging talent, the awards also include recognition for a mentor whose guidance has had a significant and positive impact on upcoming artists and industry professionals. The Momentum Awards ceremony will take place on Wednesday, Oct. 21, also at the Chattanooga Convention Center. These award ceremonies are part of IBMA World of Bluegrass, which runs Oct. 20-24. The week encompasses four events: the IBMA Business Conference, Oct. 20-22 at the Chattanooga Convention Center; the IBMA Bluegrass Ramble, Oct. 20-21 in downtown Chattanooga venues; the 37th Annual IBMA Bluegrass Music Awards, Oct. 22 at the Soldiers and Sailors Memorial Auditorium; and IBMA Bluegrass Live!, Oct. 23-24, a two-day festival of live performances and fan experiences. Tickets are now on sale for all IBMA World of Bluegrass events; visit their website for details. PREVIOUSLY (July 15): This year s nominees for the International Bluegrass Music Association Bluegrass Music Awards were announced on Wednesday (July 15), with Alison Krauss Union Station, Sister Sadie and East Nash Grass among the year s top nominees. All three acts are up for entertainer of the year, alongside Billy Strings an", "date_str": "2026-09-11T23:30:00+00:00", "hash": "f8f8ca04ae27660b", "title_fa": "Alison Krauss & Union Station، Sister Sadie در میان نامزدهای برتر جوایز IBMA 2026: فهرست کامل", "summary_fa": "به روز رسانی (11 سپتامبر): استادان ماندولین سم بوش و سیرا هال در سی و هفتمین مراسم سالانه جوایز موسیقی IBMA Bluegrass که برای پنجشنبه 22 اکتبر ساعت 7:30 بعدازظهر برگزار می شود، مجری و اجرا خواهند کرد. ET در سالن یادبود سربازان و ملوانان در چاتانوگا تن. گروه دل مک کوری، خواهر سادی، آتنتیک نامحدود، گراسکالز و مایکل کلیولند شعله‌کیپر نیز قرار است اجرا کنند. گروهی که در سال 2026 به تالار مشاهیر موسیقی بلوگراس راه یافتند، متشکل از بایرون برلین، گروه نشویل بلوگرس، بری پوس و The Lost Found هستند. ادای احترام موسیقایی برای هر یک از پذیرفته شدگان برنامه ریزی شده است. جوایز موسیقی IBMA Bluegrass پخش زنده خواهد شد. جزئیات به زودی به روز رسانی (22 ژوئیه): یک هفته پس از اعلام نامزدهای سی و هفتمین دوره جوایز موسیقی سالانه IBMA Bluegrass، انجمن بین المللی موسیقی بلوگراس نامزدهای جوایز صنعت IBMA 2026 و جوایز IBMA Momentum 2026 را اعلام کرد. جوایز صنعت IBMA کارهای برجسته را در دسته‌های صنعتی غیراجرای به رسمیت می‌شناسد و به افرادی که به پیشرفت موسیقی بلوگراس کمک می‌کنند و از هنرمندان آن حمایت می‌کنند، قدردانی می‌کند. این مراسم روز پنجشنبه 10 مهرماه برگزار خواهد شد. 22، در مرکز همایش چاتانوگا در چاتانوگا، تن. جوایز IBMA Momentum هنرمندان و متخصصان صنعت را در مراحل اولیه حرفه موسیقی بلوگرس خود به رسمیت می شناسند. این جوایز علاوه بر قدردانی از استعدادهای نوظهور، شامل قدردانی از یک مربی است که راهنمایی او تأثیر مثبت و قابل توجهی بر هنرمندان و متخصصان صنعت آینده داشته است. مراسم جوایز Momentum در روز چهارشنبه، 21 اکتبر، همچنین در مرکز همایش چاتانوگا برگزار خواهد شد. این مراسم جایزه بخشی از IBMA World of Bluegrass است که از 20 tampede Park aiming to become a year-round entertainment destination as part of its 20-year plan, which aligns with the premier s vision for the province. Read more here . — Stefano Rebuli The Beaches Score Their First Gold-Certified Single in the U.S. With ‘Blame Brett’: ‘Beyond Humbled’ The Beaches have secured their first-ever gold-certified single in the U.S. The Toronto rock act’s song “Blame Brett” received a gold certification from the Recording Industry Association of America (RIAA). While the 2023 track officially went gold back in April this year, it wasn’t until over the weekend that the band — comprised of sisters Jordan and Kylie Miller, Leandra Earl and Eliza Enman-McDaniel — shared the news on social media. Related The Beaches Accept Billboard Canada’s Global Force Award | Billboard Women In Music 2026 “T", "date_str": "2026-09-11T23:22:32+00:00", "hash": "fd26ddb589a46145", "title_fa": "در کانادا: برنامه های دانیل اسمیت برای ساختن صنعت موسیقی کلگری به نام نشویل نورث", "summary_fa": "کلگری در نظر دارد به قطب موسیقی بعدی کانادا تبدیل شود. این جاه‌طلبی نخست‌وزیر آلبرتا، دانیل اسمیت، پس از سفر اخیر به نشویل است، جایی که با اتاق بازرگانی تنسی و رهبران صنعت گردشگری ملاقات کرد تا درباره رشد شهر موسیقی بیشتر بداند. اسمیت نشویل را به‌عنوان مدلی می‌بیند که کلگری می‌تواند از آن پیروی کند، و استدلال می‌کند که پایه‌هایی که به تبدیل شهر تنسی به یک نیروگاه موسیقی کمک کردند، در خانه وجود دارند. به روز رسانی مرتبط: کانتری تاندر آلبرتا جشنواره را لغو کرد به دلیل مشکلات زیرساختی در بیلبورد شهر کلگری برای افزودن آلبوم های رسانه های هوشمند به عنوان فرمت های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل توپاک شکور انجام می دهد تعدادی از تغییراتی که آنها در 25 سال پیش به منظور تبدیل شدن به کنفرانس اسمیت گفته اند، ایجاد کرده اند. من می‌خواهم کمی درباره چیست و ببینم آیا می‌توانیم همکاری‌های عالی با صنعت موسیقی ایجاد کنیم تا بتوانیم انتقال استعداد و انتقال تخصص را انجام دهیم. صنعت موسیقی کلگری سالانه با رویدادهای مهمی مانند فستیوال موسیقی کلگری و کابوی ها که به ترتیب حدود 1.4 میلیون و 165000 طرفدار را جذب می کند، به رشد خود ادامه می دهد و اسمیت معتقد است که ارزش تخمینی 2.3 میلیارد دلاری آن می تواند با برداشتن گام های صحیح به تأثیر 28.3 میلیارد دلاری خود نشویل برسد. کلگری در حال حاضر زیرساخت های موسیقی خود را افزایش داده است، به ویژه با اضافه شدن Scotia Place، یک عرصه جدید و خانه برای Calgary Flames، که در حال حاضر در حال ساخت است و قرار است در پاییز 2027 افتتاح شود و همچنین میزبان کنسرت خواهد بود. این استان همچنین به دنبال توسعه زیرساخت‌های موجود است، با هدف پارک Stampede تبدیل شدن به یک مقصد سرگرمی"}, {"source": "Billboard", "title": "Jamaican Dancehall Singer Shabba Ranks Sues to Claw Back Publishing Catalog", "link": "https://www.billboard.com/pro/jamaican-dancehall-singer-shabba-ranks-lawsuit-catalog/", "summary": "1990s Jamaican dancehall star Shabba Ranks has launched a court battle over his publishing rights. Shabba (born Rexton Gordon) sued the publishing arm of reggae label Greensleeves Records on Friday (Sept. 11). The lawsuit, obtained and first reported by Billboard , aims to reclaim compositions including the Billboard Hot 100 hits “Slow and Sexy”, “Housecall”, “Mr. Loverman” and “Let’s Get It On.” Shabba’s catalog also includes the 1990 song “Dem Bow”, the namesake for reggaetón’s iconic “dembow” rhythm that is currently at the center of a long-running copyright infringement lawsuit entangling the entire genre. Related Bad Bunny Wins Key Ruling in Massive Reggaeton Lawsuit Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction Friday’s lawsuit, meanwhile, centers on copyright termination — the provision of U.S. copyright law that enables authors to claw back their intellectual property decades after signing it away. Labels and publishers have a habit of fighting back when musicians invoke this right, often leading to litigation. Such is the case here. Shabba first notified Greensleeves in 2023 that he wanted to exercise his termination right, but the publisher said no. According to Greensleeves, Shabba’s 1989 publishing deal stipulated that his compositions were “works made for hire,” which are explicitly excluded from the copyright termination statute. Shabba, however, is contesting the validity of that work-for-hire provision, and he wants a judge to declare that his copyright termination is effective regardless. Related Salt-N-Pepa Music Ownership Appeal: Irving Azoff Org Supports Duo, Blasts Ill-Conceived Court Ruling “The compositions are not and could not have been works made for hire under the U.S. Copyright Act, regardless of the language of the assignment,” wrote Shabba’s attorneys at Reitler Kailas Rosenblatt. “Gordon was never at any time an employee of [Greensleeves], and musical compositions are not recognized in the U.S. Copyright Act as a type of work that can be deemed a work made for hire simply by agreement between the hiring party and a non-employee author.” Reps for Shabba and Greensleeves did not immediately return requests for comment on the lawsuit Friday. Copyright termination is a hot topic in music law right now. Salt-N-Pepa is battling Universal Music Group (UMG) over the provision in a case that has caught the industry’s attention . Meanwh", "date_str": "2026-09-11T23:05:22+00:00", "hash": "b547e5e0fe39b2a5", "title_fa": "Shabba خواننده جامائیکایی Dancehall از کاتالوگ انتشارات Claw Back شکایت کرد", "summary_fa": "Shabba Ranks، ستاره سالن رقص جامائیکایی دهه 1990، بر سر حقوق انتشار خود، دعوای دادگاهی را آغاز کرده است. Shabba (متولد رکستون گوردون) در روز جمعه (11 سپتامبر) از بازوی انتشاراتی لیبل رگی Greensleeves Records شکایت کرد. این شکایت که برای اولین بار توسط بیلبورد به دست آمده و گزارش شده است، با هدف بازپس گیری آهنگ هایی از جمله آهنگ های بیلبورد داغ 100 «آهسته و سکسی»، «هوسکال»، «آقای. Loverman\" و \"Let's Get It On.\" کاتالوگ Shabba همچنین شامل آهنگ 1990 \"Dem Bow\" است، همنام ریتم نمادین reggaetón \"dembow\" که در حال حاضر در مرکز یک پرونده حقوقی طولانی مدت نقض حق چاپ است که کل ژانر را درگیر کرده است. بانی بد مرتبط برنده حکم کلیدی در بیلبورد دعوی عظیم Reggaeton برای افزودن آلبوم‌های رسانه‌های هوشمند به عنوان فرمت‌های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل توپاک شکور انجام می‌دهد، در همین حال، شکایت روز جمعه، بر فسخ حق نسخه‌برداری متمرکز است. مالکیت معنوی چندین دهه پس از امضای آن. برچسب ها و ناشران عادت دارند وقتی نوازندگان این حق را مطرح می کنند که اغلب منجر به دعوی قضایی می شود، مخالفت کنند. در اینجا چنین است. شابا برای اولین بار در سال 2023 به Greensleeves اطلاع داد که می خواهد از حق فسخ خود استفاده کند، اما ناشر پاسخ منفی داد. به گفته Greensleeves، قرارداد انتشارات Shabba در سال 1989 تصریح کرد که آهنگ‌های او «آثاری ساخته شده برای اجاره» هستند که به صراحت از قانون فسخ حق چاپ مستثنی شده‌اند. با این حال، شبا در حال مخالفت با اعتبار این ماده کار در ازای استخدام است و از یک قاضی می‌خواهد که اعلام کند که فسخ حق نسخه‌برداری او بدون توجه به این موضوع مؤثر است. درخواست تجدیدنظر مالکیت موسیقی Salt-N-Pepa مرتبط: اروینگ آزوف از گروه دو"}, {"source": "Deadline", "title": "‘The Family Stone’ Sequel Set At Searchlight With Claire Danes, Rachel McAdams, Sarah Jessica Parker & Many More Returning", "link": "https://deadline.com/2026/09/the-family-stone-sequel-movie-returning-cast-1237099527/", "summary": "Some exciting news heading into the holiday season: Searchlight has announced a sequel to the beloved 2005 holiday film The Family Stone, with nearly the entire cast returning. This includes Claire Danes, Rachel McAdams, Dermot Mulroney, Craig T. Nelson, Sarah Jessica Parker, Luke Wilson, Tyrone Giordano, Elizabeth Reaser, Paul Schneider, and Brian White. The one big [ ]", "date_str": "2026-09-12T14:00:00+00:00", "hash": "787f2303337433c5", "title_fa": "دنباله «سنگ خانواده» با حضور کلر دینز، ریچل مک آدامز، سارا جسیکا پارکر و بسیاری دیگر از افراد بازگشته در نورافکن قرار می‌گیرد.", "summary_fa": "چند خبر هیجان انگیز در آستانه فصل تعطیلات: سرچ لایت دنباله ای بر فیلم م ucer Of ‘The Last Emperor’ & ‘Crash’ Was 77", "link": "https://deadline.com/2026/09/jeremy-thomas-dead-producer-77-1237099975/", "summary": "Jeremy Thomas, one of the UK’s most prominent independent film producers of the last 50 years, died on September 11. He was 77 years old. His family announced his death in a statement on Saturday. Jeremy Thomas, the celebrated British producer of The Last Emperor and of over 40 other films, has died, at the [ ]", "date_str": "2026-09-12T13:03:28+00:00", "hash": "b83df94a87a2c55d", "title_fa": "جرمی توماس درگذشت: تهیه‌کننده افسانه‌ای بریتانیایی «آخرین امپراتور» و «سقوط» ۷۷ ساله بود.", "summary_fa": "جرمی توماس، یکی از برجسته‌ترین تهیه‌کنندگان فیلم مستقل بریتانیا در 50 سال گذشته، در 11 سپتامبر درگذشت. او 77 سال داشت. خانواده وی روز شنبه در بیانیه ای مرگ وی را اعلام کردند. جرمی توماس، تهیه کننده مشهور بریتانیایی آخرین امپراتور و بیش از 40 فیلم دیگر در سن 77 سالگی درگذشت. توماس در اواخر روز جمعه یازدهم در خانه روستایی خود در آکسفوردشایر در حالی که در محاصره خانواده و عزیزانش بود، با آرامش درگذشت. توماس در طول زندگی حرفه ای خود بیش از 80 عنوان از جمله کریسمس مبارک ناگیسا اوشیما، آقای لارنس برنده اسکار برناردو برتولوچی، آخرین امپراتور برنده اسکار، جاناتان گلیزر سکسی جانور و دیوید کراننبرگ کراش به دست آورد. خبر مرگ توماس در روز پایانی هشتاد و سومین جشنواره فیلم ونیز منتشر شد، با حضور ورنر هرتزوگ در مسابقه اصلی که توماس تهیه کننده آن بود. تماشا در ددلاین در کنفرانس مطبوعاتی جشنواره هفته گذشته، هرتزوگ به توماس به خاطر ایده انتخاب کیت و رونی مارا در نقش‌های اصلی دو خواهر که در قلب درام نقش دارند و صحبت می‌کنند، اعتبار می‌دهد و او را قادر می‌سازد تا پروژه 40 ساله را ادامه دهد."}, {"source": "Deadline", "title": "Nashville Board Approves Renaming Airport For Dolly Parton", "link": "https://deadline.com/2026/09/dolly-parton-nashville-airport-1237099972/", "summary": "Nashville International Airport is a step closer to being renamed to honor the late country superstar Dolly Parton. The six-person board of the Metro Nashville Airport Authorit nya Taylor-Joy ken je (op Netflix) natuurlijk vooral van The Queen s Gambit, maar binnenkort speelt ze de hoofdrol in een nieuwe serie van de streamingdienst. Het gaat hier om How to Kill Your Family! Anya Taylor-Joy How to Kill Your Family wordt een thriller, met komedie-elementen. Dat klinkt misschien gek, maar Netflix belooft duistere humor . Hoe dan ook: Taylor-Joy speelt Grace Bernard, de buitenechtelijke dochter van de steenrijke en meedogenloze miljardair Simon Artemis. Simon heeft Grace en haar moeder nooit als onderdeel van zijn leven geaccepteerd. Sterker nog: hij beweert zich de affaire waaruit Grace werd geboren nauwelijks te kunnen herinneren. Daardoor moesten Grace en haar moeder het altijd zonder zijn hulp stellen. Wanneer Grace moeder overlijdt, speelt Simons afwijzing een cruciale rol. Grace had gehoopt dat haar vader haar moeder zou helpen, maar haar familie laat hen opnieuw in de steek. Voor Grace is daarmee een grens bereikt. Ze besluit (natúúrlijk) wraak te nemen op de complete familie Artemis. En het is niet zo dat ze de publiciteit opzoekt of iets dergelijks, want haar plan is veel extremer: ze is van plan haar vervreemde familieleden één voor één te vermoorden. Daarbij bedenkt ze voor ieder familielid een andere, zorgvuldig voorbereide manier om van die persoon af te komen. Financieel motief Er zit óók een financieel motief achter haar plan. Door de familieleden die tussen haar en het enorme familiefortuin staan uit de weg te ruimen, hoopt Grace uiteindelijk ook zelf aanspraak te kunnen maken op de erfenis. Maar hoe verder ze komt met haar wraakactie, hoe ingewikkelder haar leven wordt Bestseller How to Kill Your Family, dat overigens gebaseerd is op de gelijknamige bestseller van Bella Mackie, beschikt over een sterrencast. Niet alleen Taylor-Joy doet mee, ook Clive Owen, Orlando Norman en David Shields zijn gestrikt voor het project. De productie begint binnenkort, dus mogelijk mikt Netflix op een release in de laatste maanden van 2027 óf d in-nieuwe-romcom-op-netflix/", "summary": "Wat als je met jouw liefde iemand anders leven kunt redden? Maar dan op een hele bijzondere manier? Het is het plot van een nieuwe romantische komedie op Netflix, genaamd Nareul Chungjeonhaejwo. Nareul Chungjeonhaejwo Nareul Chungjeonhaejwo (in het Engels: Take Charge of My Heart), is een Zuid-Koreaanse romcom met fantasy-invloeden. De hoofdrollen zijn voor Chae Soo-bin als Na Bo-bae en Kim Young-kwang als Baek Ho-rang. Het verhaal draait om Na Bo-bae, een scenarioschrijfster die als kind door de bliksem werd getroffen. Sindsdien stroomt er letterlijk elektriciteit door haar lichaam. Dat klinkt als een bijzondere gave, maar levert vooral problemen op: wanneer ze iemand aanraakt, kan diegene een elektrische schok krijgen. Daarom draagt Bo-bae vaak handschoenen en vermijdt ze lichamelijk contact, waardoor ze ook nooit echt een normale liefdesrelatie aan heeft kunnen gaan. Rijke erggenaam Dan ontmoet ze Baek Ho-rang, een rijke erfgenaam van een groot zakenimperium en bestuurder van een luxe resort. Hij houdt een groot geheim verborgen: hij leeft met een kunsthart dat op een batterij werkt. Die batterij begint leeg te raken, terwijl hij midden in een machtsstrijd zit over de toekomst van het familiebedrijf. Wanneer Bo-bae en Ho-rang elkaar per ongeluk kussen, ontdekt ze iets wat ze nog nooit heeft meegemaakt: haar elektriciteit doet hem geen pijn. Later blijkt zelfs dat haar aanwezigheid en aanraking de batterij van zijn kunsthart kunnen opladen. Ho-rang heeft haar vervolgens drie maanden nodig om zijn hart werkend te houden totdat hij opnieuw geopereerd kan worden. Hij stelt daarom een bijzondere overeenkomst voor: Bo-bae houdt hem via lichamelijk contact letterlijk opgeladen , terwijl hij haar helpt om eindelijk de romantische ervaringen op te doen die ze door haar elektrische krachten altijd heeft moeten missen. Op 9 oktober aanstaande verschijnt Nareul Chungjeonhaejwo op Netflix! Wil jij nou niets missen over Netflix, films  قسمت های 7 و 8 (که 7 اکتبر را پوشش می دهند) صحبت می کنند، با نظراتی مانند: آن قسمت ها"}, {"source": "Netflix NL", "title": "Romantische dramaserie knalt top-10 van Netflix binnen", "link": "https://www.netflix-nederland.nl/romantische-dramaserie-knalt-top-10-van-netflix-binnen/", "summary": "Heb jij genoten van Gossip Girl en Friday Night Lights? Dan past de nieuwe Netflix-serie Crew Girl helemaal in jouw straatje. Maar Crew Girl is wel Gossip Girl en Friday Night Lights op een boot . Direct succes Crew Girl is een zogenaamd coming-of-age drama dat het verhaal van de 16-jarige Teagan vertelt, een getalenteerde jonge roeister wier leven volledig op zijn kop komt te staan nadat een schandaal haar familie in de schijnwerpers zet. Op zoek naar een nieuwe start belandt ze op een prestigieuze kostschool, waar ze hoopt haar verleden achter zich te laten en zich opnieuw op haar sport te kunnen richten. Die nieuwe start verloopt echter allesbehalve volgens plan. In plaats van zelf in een boot te stappen als roeister, wordt Teagan aangesteld als stuurvrouw van het jongensroeiteam. Ze moet leidinggeven aan een groep ambitieuze teamgenoten die niet allemaal staan te springen om instructies aan te nemen van een nieuw meisje. Terwijl het team zich voorbereidt op belangrijke wedstrijden, probeert Teagan hun vertrouwen te winnen en tegelijkertijd haar eigen plek binnen de schoolgemeenschap te veroveren. Leven op een kostschool Buiten het roeien om krijgt ze te maken met alles wat hoort bij het leven op een kostschool: nieuwe vriendschappen, rivaliteiten, eerste liefdes, sociale druk en de constante aanwezigheid van klasgenoten die nieuwsgierig zijn naar haar verleden. Naarmate de trainingen intensiever worden en de competitie dichterbij komt, wordt Teagan steeds vaker geconfronteerd met de gebeurtenissen die haar naar de school hebben gebracht Miku Martineau (Taegan), Jessica Paré (Ella), Samuel Braun (Josh), Kyle Clark (Cam) en Thomas Cadrot (Hayden) spelen de belangrijkste rollen in Crew Girl. Gossip Girl en Friday Night Lights Vivian Lin, één van de scriptschrijfsters achter Crew Girl, vergelijkt de serie met Gossip Girl en Friday Night Lights in een interview met Teen Vogue: Na onze eerste gezamenlijke scriptlezing kwam Thomas, die Hayden (de coach, red.) speelt, naar me toe en zei: dus… Gossip Girl en Friday Night Lights, maar dan op een boot? En ik zei: ja, precies. Je snapt het. Direct na de release is Crew Girl de top-10 binnengevlogen van Netflix. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Romantische dramaserie knalt top-10 van Netflix binnen appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-11T16:41:15+00:00", "hash": "a9f1e5365e7a83bd", "title_fa": "سریال‌های درام رمانتیک در بین ۱۰ سریال برتر نتفلیکس قرار گرفتند", "summary_fa": "آیا از Gossip Girl و Friday Night Lights لذت بردید؟ سپس سریال جدید نتفلیکس Crew Girl درست در کوچه شماست. اما Crew Girl Gossip Girl و Friday Night Lights on a Boat است. موفقیت آنی Crew Girl یک درام به اصطلاح دوران بلوغ است که داستان تیگان 16 ساله، یک پاروزن جوان با استعداد را روایت می‌کند که پس از یک رسوایی که خانواده‌اش را در کانون توجه قرار می‌دهد، زندگی کاملاً زیر و رو می‌شود. در جستجوی یک شروع جدید، او به یک مدرسه شبانه روزی معتبر ختم می شود، جایی که امیدوار است گذشته خود را پشت سر بگذارد و دوباره روی ورزش خود تمرکز کند. با این حال، این شروع جدید چیزی جز رفتن طبق برنامه است. تیگان به جای سوار شدن به قایق به عنوان یک پاروزن، به عنوان قایقران تیم قایقرانی پسران منصوب می شود. او باید گروهی از هم تیمی های جاه طلب را رهبری کند، که همه آنها مشتاق نیستند از یک دختر جدید دستور بگیرند. همانطور که تیم برای مسابقات مهم آماده می شود، تیگان سعی می کند اعتماد آنها را جلب کند و در عین حال جایگاه خود را در جامعه مدرسه ایجاد کند. زندگی در یک مدرسه شبانه روزی خارج از قایقرانی، او باید با همه چیزهایی که در یک مدرسه شبانه روزی زندگی می کند کنار بیاید: دوستی های جدید، رقابت ها، عشق های اولیه، فشار اجتماعی و حضور مداوم همکلاسی هایی
