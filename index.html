ن مدل‌های مقرون‌به‌صرفه دیگری را نیز پیدا کرده‌ام که برای فضاهای کوچک‌تر یا برای افرادی که می‌خواهند صدای Dolby Atmos همه‌جانبه با درایورهای بلندگوی تقویت‌کننده اختصاصی داشته باشند، مناسب هستند. همه توصیه‌های من برای بهترین ساندبارهای مقرون‌به‌صرفه ارزش را در اولویت قرار می‌دهند، و هر کدام از آنها در فرآیند آزمایش گسترده من، با بیش از یک دهه تجربه در بررسی تجهیزات صوتی، قرار گرفته‌اند. بهترین انتخاب‌های ما برای بهترین ساندبارهای مقرون‌به‌صرفه بهترین کلی: Vizio 2.1 AIO (SV210D-0806) - در Walmart بهترین انتخاب ارتقاء: Sony Bravia Theater Bar 5 - در آمازون ببینید بهترین مدل جمع‌وجور: Bose Smart Soundbar -"}, {"source": "Business Insider", "title": "Walmart won't charge a 'personalized price', CEO says", "link": "https://www.businessinsider.com/walmart-ceo-ai-digital-tags-wont-charge-personalized-price-2026-9", "summary": "Walmart won t charge a personalized price , CEO says Charles-McClintock Wilson/NurPhoto via Getty Images Walmart CEO John Furner says AI and digital shelf labels won't be used for personalized prices. \"We price the product, not the person,\" he said in a memo to employees and customers Friday. The retail giant and other competitors have faced public scrutiny over new pricing tech. Walmart CEO John Furner wants to clear the air about how the retail giant is using new pricing technology . \"We don't set different prices based on who you are or the time of day, and we won't,\" he said in a memo to employees and customers on Friday. Furner said he was responding to questions he's received this year about how the company is implementing new digital shelf labels and the AI-powered shopping assistant, Sparky. \"When you engage with Sparky, that's an invitation to serve you better not to use your personal information to set a personalized price,\" he said. \"We've never used the relationships our associates have with customers to charge more, and we won't do that with AI.\" Furner also said that any form of personalized pricing would violate the company's decades-long commitment to being an everyday low-price retailer. \"We price the product, not the person,\" Furner said. Walmart and its competitors have faced growing public scrutiny over the rollout of both online shopping assistants and in-store digital tech that critics say could be used to selectively hike prices on individual customers. The company has said its focus on using the tech is to improve the efficiency of its stores and deliver a better shopping experience for customers. Read the full memo from Walmart CEO John Furner: To our customers and members, For more than 50 years, our pricing principle has been Every Day Low Prices (EDLP) : low, consistent prices you can count on without guessing whether Monday or Tuesday is the better day to shop or wondering if someone else is getting a better price than you. Prices can change. We lower them when we can pass savings along. Sometimes they rise because an item costs more to buy or transport. But using someone's income, shopping history or moment of need to charge them more would violate the EDLP promise our business model is built on. We won't do it. YOU are at the heart of our WHY and our relationship with you has always been built on trust. For decades, our associates have built that trust, one interaction at a time. So, as technology improves, we're putting the ", "date_str": "2026-09-25T19:47:50+00:00", "hash": "a885027495fe5fe9", "title_fa": "مدیر عامل شرکت می‌گوید والمارت «قیمت شخصی‌شده» را دریافت نخواهد کرد", "summary_fa": "چارلز-مک کلینتاک ویلسون/نورفوتو از طریق گتی ایماژ، مدیر عامل شرکت Walmart می‌گوید والمارت قیمت شخصی‌سازی نمی‌کند. او روز جمعه در یادداشتی خطاب به کارمندان و مشتریان گفت: ما محصول را قیمت گذاری می کنیم، نه شخص را. غول خرده‌فروشی و سایر رقبا با نظارت عمومی بر روی فناوری جدید قیمت‌گذاری مواجه شده‌اند. جان فورنر، مدیر عامل Walmart می‌خواهد در مورد نحوه استفاده غول خرده‌فروشی از فناوری جدید قیمت‌گذاری صحبت کند. او روز جمعه در یادداشتی خطاب به کارمندان و مشتریان گفت: «ما قیمت‌های متفاوتی را بر اساس فردی که هستید یا ساعت روز تعیین نمی‌کنیم و نمی‌کنیم. فورنر گفت که در حال پاسخ به سوالاتی است که در سال جاری در مورد نحوه پیاده‌سازی برچسب‌های قفسه دیجیتال جدید و دستیار خرید مبتنی بر هوش مصنوعی، اسپارکی، دریافت کرده است. او گفت: «وقتی با اسپارکی درگیر می‌شوید، این دعوتی است که بهتر است از اطلاعات شخصی خود برای تعیین قیمت شخصی استفاده نکنید.» ما هرگز از روابطی که همکارانمان با مشتریان دارند برای هزینه بیشتر استفاده نکرده‌ایم و این کار را با هوش مصنوعی انجام نخواهیم داد.» فورنر همچنین گفت که هر شکلی از قیمت‌گذاری شخصی‌شده تعهد چند دهه‌ای این شرکت را برای خرده‌فروشی روزمره با قیمت پایین نقض می‌کند. فورنر گفت: ما محصول را قیمت گذاری می کنیم، نه شخص را. والمارت و رقبای آن در مورد عرضه دستیاران خرید آنلاین و فناوری دیجیتال در فروشگاه‌ها که به گفته منتقدان می‌تواند برای افزایش انتخابی قیمت‌ها برای مشتریان فردی مورد استفاده قرار گیرد، با نظارت عمومی رو به رشد روبرو شده‌اند. این شرکت گفته است تمرکزش بر استفاده از این فناوری بهبود کارایی فروشگاه‌هایش و ارائه تجربه خرید بهتر برای مشتریان است. یادداشت کامل جان فرنر، مدیر عامل Walmart را بخوانید: برای مشتریان و اعضای ما، برای بیش از 50 سال، اصل قیمت‌گذاری ما قیمت‌های پایین هر روز (EDLP) بوده است:"}, {"source": "Business Insider", "title": "Meta's Muse feels real in a way the metaverse never did", "link": "https://www.businessinsider.com/meta-muse-feels-different-from-metaverse-2026-9", "summary": "Business Insider s Pranav Dixit at Meta Connect Pranav Dixit/Business Insider A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . My colleague Pranav Dixit attended Meta Connect this week and he stopped by AI Insider to share his thoughts with newsletter subscribers. Here's how the Q A went down, in longer form: What was your biggest surprise while at the event? The biggest surprise was how good Meta's upcoming VR glasses were. They're not coming out until spring 2027, and they'll cost around $1,300, so they're definitely not a mass-market product yet. But after spending about half an hour with them, I walked away really impressed. I watched 3D movies, played Beat Saber, and even paired the glasses with a laptop so I suddenly had three giant virtual monitors floating in front of me. The whole thing weighs about 100 grams, and after a few minutes, you kind of stop thinking about the hardware and just use it. More than anything, it made me realize how far Meta has come . I kept thinking, this is what Apple should have released instead of the Vision Pro . It obviously won't be for everyone, especially at that price, but it was the first time I'd tried something that made me think lightweight VR glasses might actually be getting close. Which product/device were you most impressed by and why? I already use Muse quite a lot for surprisingly complex tasks. I'll ask it to place a hold on a library book, send the ebook to my Kindle, or handle little chores that would otherwise have me bouncing between apps. It feels less like using a chatbot and more like having an assistant. That's why I think bringing Muse to the glasses is such a big deal. The glasses themselves are just a tool. The real magic is being able to ask for something while you're walking down the street, cooking dinner, or driving, and have it quietly take care of it without you ever reaching for your phone. That starts to feel less like software and more like a superpower. That feature hasn't launched yet. Meta says it's coming in the next few weeks. I can't say how well it works in the real world. But if it does work well, it's the first AI glasses feature I've seen that feels genuinely useful rather than just a gimmick. Folks seem to like Muse much better than the metaverse. Why? Can anyone really explain what the metaverse was? Was it a giant virtual world we were all supposed to hang out in? The vision always", "date_str": "2026-09-25T17:57:48+00:00", "hash": "1c3c83edc12164c9", "title_fa": "Meta's Muse به گونه ای احساس واقعی می کند که متاورس هرگز چنین نکرد", "summary_fa": "پراناو دیکسیت Business Insider در Meta Connect Pranav Dixit/Business Insider نسخه ای از این داستان در ابتدا در خبرنامه هوش مصنوعی منتشر شد. برای خبرنامه هفتگی AI Insider Business Insider در اینجا ثبت نام کنید. همکار من پراناو دیکسیت این هفته در Meta Connect شرکت کرد و با AI Insider سر زد تا افکار خود را با مشترکان خبرنامه در میان بگذارد. در اینجا نحوه پایین آمدن Q A به شکل طولانی تر آمده است: بزرگترین سورپرایز شما در این رویداد چه بود؟ بزرگترین شگفتی این بود که عینک VR آینده متا چقدر خوب بود. آنها تا بهار 2027 وارد بازار نمی شوند و حدود 1300 دلار قیمت خواهند داشت، بنابراین قطعاً هنوز یک محصول انبوه نیستند. اما بعد از گذراندن حدود نیم ساعت با آنها، من واقعا تحت تأثیر قرار گرفتم. من فیلم های سه بعدی تماشا کردم، بیت سابر را بازی کردم، و حتی عینک را با یک لپ تاپ جفت کردم، بنابراین ناگهان سه مانیتور مجازی غول پیکر جلوی من شناور شد. وزن کل آن حدود 100 گرم است و پس از چند دقیقه، به نوعی دیگر به سخت افزار فکر نمی کنید و فقط از آن استفاده می کنید. بیش از هر چیز، این باعث شد که بفهمم متا تا کجا پیش رفته است. من مدام فکر می کردم، این چیزی است که اپل باید به جای Vision Pro منتشر می کرد. بدیهی است که برای همه نخواهد بود، به خصوص با آن قیمت، اما این اولین بار بود که چیزی را امتحان کردم که باعث شد فکر کنم عینک های VR سبک وزن ممکن است واقعاً نزدیک شوند. کدام محصول/دستگاه بیشتر تحت تاثیر قرار گرفتید و چرا؟ من قبلاً از Muse بسیار برای کارهای پیچیده و شگفت‌آور استفاده می‌کنم. از آن می‌خواهم کتاب کتابخانه را نگه دارد، کتاب الکترونیکی را به Kindle من بفرستد، یا"}, {"source": "Business Insider", "title": "A deluge of new stock supply will be a drag on the market for years, GMO says", "link": "https://www.businessinsider.com/stock-returns-us-market-outlook-equity-supply-gmo-2026-9", "summary": "TIMOTHY A. CLARY / AFP via Getty Images Stock returns are facing an under-the-radar headwind in coming years: a glut of supply, GMO says. Equity supply is on track to grow 5% a year, compared to the prior 1% yearly decline, the firm said. The asset manager says a 20% hit to the market is possible over the next several years. The US stock market has a supply problem brewing over the next several years, Jeremy Grantham's GMO is warning. In a quarterly note to clients, the asset manager flagged the risk posed by a coming wave of stock supply , thanks to factors like SpaceX unlocking insider shares , coming mega-IPOs, and secondary issuances. SpaceX's stock sales, besides those made by CEO Elon Musk personally, also make up around 1% of the US stock market's total value. Meanwhile, OpenAI and Anthropic , which are expected to go public in the near future, make up around 5% of the stock market's total investable market cap, GMO estimated. Altogether, equity supply in the US could grow around 5% a year, the firm said, comparing the growth to the historical precedent of equity supply shrinking 1% annually. \"Today's passive, benchmark-aware, and constrained markets leave fewer buyers willing to absorb new equity supply,\" Ben Inker, GMO's co-head of asset allocation and John Pease, the firm's head of asset allocation research, wrote in the letter. \"We believe the equity supply already coming to market is large enough to have a meaningful dampening effect on likely returns—perhaps a 20% hit relative to normal over the next year and a half, if history is a decent guide,\" the note added. The coming wave of new stock could also be the catalyst that pops the AI bubble , Inker and Pease said, adding that the market has shown a greater sensitivity to changes in equity supply in recent years. \"In a market as sensitive to equity supply as this one seems to be, prices are likely to turn before the market truly knows that has happened,\" they added. More attention has been paid to rapidly growing supply of publicly available stock recently. SpaceX's historic $2 trillion IPO drew concerns from analysts about how the wave of stock issuance could impact the structure of public markets and drain liquidity from other parts of the market as investors rush to make room for new mega-cap tech stocks. It's been a record-breaking year for IPOs . New public companies raised over $137 billion in the first half of the year, marking a nearly 400% year-over-year increase, according to the Sec", "date_str": "2026-09-25T17:28:25+00:00", "hash": "d8c0e104d18a8a7d", "title_fa": "GMO می‌گوید سیل عرضه جدید سهام برای سال‌ها باعث ایجاد مشکل در بازار خواهد شد", "summary_fa": "TIMOTHY A. CLARY / AFP از طریق Getty Images بازده سهام در سال های آینده با یک باد مخالف تحت رادار مواجه است: به گفته GMO، مازاد عرضه. این شرکت گفت که عرضه سهام در مسیر رشد 5 درصدی در سال در مقایسه با کاهش سالانه 1 درصدی قبلی است. مدیر دارایی می گوید که طی چند سال آینده امکان ورود 20 درصدی به بازار وجود دارد. GMO جرمی گرنتهام هشدار می دهد که بازار سهام ایالات متحده در چند سال آینده مشکل عرضه دارد. مدیر دارایی در یادداشتی سه ماهه برای مشتریان، ریسک ناشی از موج عرضه سهام را به دلیل عواملی مانند باز کردن قفل سهام خودی توسط اسپیس ایکس، عرضه‌های اولیه اولیه بزرگ و انتشار ثانویه اعلام کرد. فروش سهام اسپیس ایکس، علاوه بر آنهایی که شخصاً توسط ایلان ماسک، مدیرعامل شرکت انجام شده است، حدود 1 درصد از ارزش کل بازار سهام ایالات متحده را نیز تشکیل می دهد. در همین حال، GMO تخمین زده است که OpenAI و Anthropic که انتظار می‌رود در آینده نزدیک به بازار عرضه شوند، حدود 5 درصد از کل بازار سرمایه‌پذیر بازار سهام را تشکیل می‌دهند. این شرکت گفت که در مجموع، عرضه سهام در ایالات متحده می تواند حدود 5 درصد در سال رشد کند و این رشد را با سابقه تاریخی کاهش 1 درصدی عرضه سهام در سال مقایسه کرد. بن اینکر، رئیس تخصیص دارایی GMO و جان پیز، رئیس تحقیقات تخصیص دارایی این شرکت، در نامه‌ای نوشتند: بازارهای منفعل، آگاه و محدود امروزی، خریداران کمتری را برای جذب عرضه سهام جدید ترک می‌کند. یادداشت اضافه کرد: «ما معتقدیم عرضه سهام که در حال حاضر به بازار می‌آید به اندازه‌ای بزرگ است که اثر کاهشی معنی‌داری بر بازده احتمالی داشته باشد - شاید در یک سال و نیم آینده نسبت به حالت عادی 20 درصد کاهش یابد، اگر"}, {"source": "Business Insider", "title": "I wasn't ready to leave my college, so I took a job at my alma mater. It gave me the closure graduation never did.", "link": "https://www.businessinsider.com/took-job-at-college-after-graduating-strange-but-worth-it-2026-9", "summary": "Taking a job at my college after graduating was a strange and confusing experience, but worth it. Celia Krefter After graduating from college , I wasn't ready to leave, so I applied for an admin job at my school. I loved working there, but sometimes felt stuck in the past, jealous of other students. Overall, the position helped me prepare for my next career step and feel ready to go out on my own. When I was in college in New York City , I loved the theater department so much that it became a punchline: my friends and I joked that after graduation, I would take a job there and stay forever. Little did we know that would actually become my reality. After earning my degree in May 2022, I faced an uncertain job market in an industry still struggling to recover from the COVID-19 pandemic , which had forced my hands-on theater program to transition to remote learning. Even though I was beginning to build a freelance career in theater, I wanted a day job to offer some stability in an unpredictable field. So, when a job as the administrator of my college theater department opened up, I applied, and a yearslong joke came true. On paper, it was the perfect position: stable, better-paying than a comparable administrative role at a commercial theater, with ample time off and the flexibility to freelance as a director and writer. Above all, it was something I loved doing — managing the operations of a place I knew inside and out, surrounded by colleagues who had been my teachers, mentors, and friends for years. In reality, the job was so much more than that: It allowed me to retrace the footsteps of my college self in a way I never would've imagined. The theater department became my lifeline, but after a while, it made me feel stuck in the past When I was still a student, I felt like I hadn t received a full college experience, so I stayed. Celia Krefter At the start of the pandemic, I was a sophomore in college. Like universities everywhere, we had to adjust to online learning , with campus operations not \"returning to normal\" until the spring of 2021. So, two years later, by the end of my senior year, as I started preparing to say goodbye to a place that had become a lifeline, I balked. I thought it was unfair that half my undergraduate career had been in a virtual or hybrid format, and this sense of betrayal froze me in my tracks. So, because I felt I hadn't had a full college experience and that I was unprepared to make the high-stakes choices required of graduate", "date_str": "2026-09-25T17:12:01+00:00", "hash": "f6e50c1a03256a19", "title_fa": "من آمادگی ترک دانشگاه را نداشتم، بنابراین در دانشگاه خود مشغول به کار شدم. آن را به من داد که فارغ التحصیلی بسته شدن هرگز.", "summary_fa": "استخدام در کالج من پس از فارغ التحصیلی تجربه عجیب و گیج کننده ای بود، اما ارزشش را داشت. سلیا کرفتر پس از فارغ‌التحصیلی از کالج، آمادگی ترک را نداشتم، بنابراین برای شغل مدیریت در مدرسه‌ام درخواست دادم. من دوست داشتم آنجا کار کنم، اما گاهی اوقات احساس می کردم در گذشته گیر کرده ام، حسادت می کنم به دانش آموزان دیگر. به طور کلی، این موقعیت به من کمک کرد تا برای قدم بعدی شغلی‌ام آماده شوم و احساس کنم آماده بیرون رفتن به تنهایی هستم. وقتی در کالج در شهر نیویورک تحصیل می کردم، بخش تئاتر را آنقدر دوست داشتم که تبدیل به یک موضوع شد: من و دوستانم به شوخی می گفتیم که بعد از فارغ التحصیلی، شغلی را در آنجا می گیرم و برای همیشه می مانم. ما نمی دانستیم که واقعاً به واقعیت من تبدیل می شود. پس از اخذ مدرک در ماه مه 2022، با یک بازار کار نامشخص در صنعتی مواجه شدم که هنوز در تلاش برای بهبودی از بیماری همه گیر COVID-19 بود، که برنامه تئاتر عملی من را مجبور به انتقال به یادگیری از راه دور کرده بود. حتی با وجود اینکه شروع به ایجاد یک حرفه آزاد در تئاتر کردم، می خواستم یک شغل روزانه داشته باشم تا در یک زمینه غیرقابل پیش بینی ثبات ایجاد کنم. بنابراین، وقتی شغلی به‌عنوان مدیر بخش تئاتر کالج من باز شد، درخواست دادم و یک شوخی چند ساله به حقیقت پیوست. روی کاغذ، این موقعیت عالی بود: باثبات، با درآمد بهتر نسبت به نقش اداری قابل مقایسه در یک تئاتر تجاری، با مرخصی کافی و انعطاف پذیری برای کار آزاد به عنوان کارگردان و نویسنده. مهمتر از همه، این کاری بود که انجامش را دوست داشتم – مدیریت عملیات مکانی که از درون و بیرون می شناختم، در محاصره همکارانی که سال ها"}, {"source": "Business Insider", "title": "Each state's infrastructure, ranked worst to best", "link": "https://www.businessinsider.com/states-infrastructure-ranked-2026-9", "summary": "Oregon was ranked among the states with one of the best infrastructure systems in the country. Brooke Tierney/Getty Images Slow internet, long commutes, and expensive electricity are often beyond our control. Yet, these daily inconveniences can make a massive impact on your quality of life. US News World Report ranked the quality of infrastructure across all 50 states. Infrastructure has a big impact on the quality of day-to-day life . Whether you're struggling to get around because of poor road quality, unreliable public transportation, or your neighborhood experiences frequent power outages , weak infrastructure can make everyday life more difficult. It's also something that varies massively from state to state. US News World Report compiled a ranking of states with the best and worst infrastructure, which forms part of its annual ranking of the best states to live in. To determine the quality of each state's infrastructure, US News World Report examined three categories: energy, internet access, and transportation. For energy, it calculated the average retail electricity price , power grid reliability, and renewable energy usage. Internet access was analyzed by looking at the broadband subscription internet and access to high-speed broadband internet. For transport, the metrics were commute time , bridge quality, road quality, and public transit usage. Each state was then ranked based on these metrics. US News World Report prioritized recent and standardized data from government sources to compile the ranking. Here is the infrastructure quality of all 50 states, from worst to best. 50. West Virginia Charleston, West Virginia. Leonid Andronov/Getty Images Transportation: 49th Energy: 49th Internet access: 49th 49. Mississippi Jackson, Mississippi. CRobertson/Getty Images Transportation: 46th Energy: 47th Internet access: 48th 48. Alaska Anchorage, Alaska. Jacob Boomsma/Getty Images Transportation: 12th Energy: 48th Internet access: 47th 47. Rhode Island Providence, Rhode Island. Wirestock/Getty Images Transportation: 50th Energy: 44th Internet access: 36th 46. Louisiana New Orleans, Louisiana. George Dodd/Getty Images Transportation: 48th Energy: 38th Internet access: 44th 45. New Mexico Albuquerque, New Mexico. GummyBone/Getty Images Transportation: 37th Energy: 16th Internet access: 50th 44. Hawaii Honolulu, Hawaii. Iryna Olkhova/Getty Images Transportation: 28th Energy: 50th Internet access: 16th 43. Pennsylvania Philadelphia, Pennsylvania. f11photo/G", "date_str": "2026-09-25T17:01:13+00:00", "hash": "90f8a3b168524cc5", "title_fa": "زیرساخت هر ایالت از بدترین تا بهترین رتبه بندی شده است", "summary_fa": "اورگان در میان ایالت هایی با یکی از بهترین سیستم های زیرساختی در کشور رتبه بندی شد. Brooke Tierney/Getty Images اینترنت کند، رفت و آمدهای طولانی و برق گران قیمت اغلب خارج از کنترل ما هستند. با این حال، این ناراحتی‌های روزانه می‌توانند تأثیر زیادی بر کیفیت زندگی شما بگذارند. US News World Report کیفیت زیرساخت ها را در تمام 50 ایالت رتبه بندی کرد. زیرساخت ها تأثیر زیادی بر کیفیت زندگی روزمره دارند. خواه به دلیل کیفیت پایین جاده، حمل‌ونقل عمومی نامطمئن برای رفت‌وآمد مشکل داشته باشید، یا محله‌تان دچار قطعی مکرر برق شود، زیرساخت‌های ضعیف می‌تواند زندگی روزمره را دشوارتر کند. همچنین چیزی است که از ایالت به ایالت دیگر بسیار متفاوت است. US News World Report رتبه‌بندی ایالت‌های دارای بهترین و بدترین زیرساخت‌ها را تهیه کرد که بخشی از رتبه‌بندی سالانه بهترین ایالت‌ها برای زندگی را تشکیل می‌دهد. برای تعیین کیفیت زیرساخت هر ایالت، US News World Report سه دسته انرژی، دسترسی به اینترنت و حمل و نقل را بررسی کرد. برای انرژی، میانگین قیمت خرده فروشی برق، قابلیت اطمینان شبکه برق و مصرف انرژی تجدیدپذیر را محاسبه کرد. دسترسی به اینترنت با نگاهی به اینترنت اشتراک باند پهن و دسترسی به اینترنت پهن باند پرسرعت مورد تجزیه و تحلیل قرار گرفت. برای حمل و نقل، معیارها زمان رفت و آمد، کیفیت پل، کیفیت جاده و استفاده از حمل و نقل عمومی بود. سپس هر ایالت بر اساس این معیارها رتبه بندی شد. US News World Report داده های اخیر و استاندارد شده از منابع دولتی را برای جمع آوری این رتبه بندی اولویت بندی کرد. در اینجا کیفیت زیرساخت همه 50 ایالت، از بدترین تا بهترین، آمده است. 50. چارلستون ویرجینیای غربی، ویرجینیای غربی. Leonid Andronov/Getty Images حمل و نقل: 49th انرژی: 49th دسترسی به اینترنت: 49th 49. Mississippi Jackson, Mississippi. CRobertson/Getty Images حمل و نقل:"}, {"source": "Business Insider", "title": "Every Taylor Swift album, ranked from worst to best", "link": "https://www.businessinsider.com/taylor-swift-albums-ranked-best-worst", "summary": "Taylor Swift through the years Pedro Gomes/TAS24/Getty Images; Visual China Group/Getty Images; Marcus Piggott; Jason Kempin/Getty Images; Tyler Le/BI Taylor Swift has released 12 distinct albums throughout her career (and rerecorded four of them). BI's resident Swift expert ranked them from worst to best, using a unique scoring method. \"Folklore\" took the top spot, while Swift's newest album, \"The Life of a Showgirl,\" is ranked last. Taylor Swift's deluxe release, \"The Life of a Showgirl: The Encore,\" is the newest addition to a prodigious discography that includes two decades' worth of music, a dozen No. 1 hits , and four album of the year winners at the Grammy Awards. These days, every album that Swift unleashes is all but guaranteed to find commercial success and fan-fueled fawning, but as with every musician, some albums are better than others. Business Insider's senior pop culture writer and resident Swift expert, Callie Ahlgrim , scored all 12 of Swift's distinct albums, coupling each \"Taylor's Version\" rerelease with its original. They're ranked below from worst to best. 12. The Life of a Showgirl Taylor Swift s 12th album, The Life of a Showgirl, was released on October 3, 2025. TAS Rights Management Final grade: 6.6/10 In many ways, \" The Life of a Showgirl \" is the spiritual successor to \"Reputation.\" Both albums are written by a Swift who's in love , headstrong, and determined to defend her relationship from cynics. Both are co-produced either partially or entirely with Max Martin and Shellback, who tease out some of Swift's stickiest hooks. Both are pop albums that lean hard into the drama and commit to the bit. Alas, both albums are devastatingly front-loaded, starting off strong before taking a turn for the worse in the latter half. In the case of \"Showgirl,\" Swift spends way too much time treading tactless or redundant ground, from a banal suburban fantasy (\"Wi$h Li$t\") to a slew of corny sex puns (\"Wood\") and an eye-roll-inducing ode to scandalous starlets (\"Cancelled!\"). Swift famously described herself as a mirrorball, and if this is her reflecting the crowd's demands and cultural obsessions back to us, I'm morbidly fascinated by the result. As the album title suggests, \"Showgirl\" is more concerned with gloss than substance. The few times it succeeds are when Swift doesn't undercut her own craft. The first four songs, which are also the album's best, manage to prioritize melody without dumbing down the language. \" The Fate of Ophelia \" a", "date_str": "2026-09-25T16:45:12+00:00", "hash": "af0e35de40c2d962", "title_fa": "هر آلبوم تیلور سویفت، از بدترین تا بهترین رتبه بندی شده است", "summary_fa": "تیلور سویفت در طول سال ها پدرو گومز/TAS24/گتی ایماژ; گروه ویژوال چین/گتی ایماژ; مارکوس پیگوت؛ جیسون کمپین/گتی ایماژ; تایلر لو/بی‌آی تیلور سوئیفت 12 آلبوم مجزا در طول دوران حرفه‌ای خود منتشر کرده است (و چهار تای آنها را دوباره ضبط کرده است). کارشناس سوئیفت مقیم BI با استفاده از یک روش امتیازدهی منحصر به فرد، آنها را از بدترین به بهترین رتبه بندی کرد. «فولکلور» رتبه اول را به خود اختصاص داد، در حالی که جدیدترین آلبوم سوئیفت، «زندگی یک دختر نمایشی» در رتبه آخر قرار دارد. انتشار لوکس تیلور سوئیفت، \"زندگی یک دختر نمایشگر: The Encore\" جدیدترین اثر اضافه شده به یک دیسکوگرافی شگفت انگیز است که شامل موسیقی دو دهه، ده ها آهنگ شماره 1 و چهار برنده آلبوم سال در جوایز گرمی است. این روزها، هر آلبومی که سوئیفت منتشر می‌کند، مطمئناً موفقیت تجاری و حنایی‌های هواداران را پیدا می‌کند، اما مانند هر موسیقی‌دانی، برخی از آلبوم‌ها بهتر از بقیه هستند. Callie Ahlgrim، نویسنده ارشد فرهنگ پاپ Business Insider و کارشناس ساکن سوئیفت، همه 12 آلبوم مجزای سوئیفت را به ثمر رساند و هر نسخه تیلور را با نسخه اصلی خود همراه کرد. آنها از بدترین تا بهترین رتبه بندی شده اند. 12. The Life of a Showgirl دوازدهمین آلبوم تیلور سویفت، The Life of a Showgirl، در 3 اکتبر 2025 منتشر شد. مدیریت حقوق TAS درجه نهایی: 6.6/10 از بسیاری جهات، \"زندگی یک دختر نمایشی\" جانشین معنوی \"شهرت\" است. هر دو آلبوم توسط سوئیفت نوشته شده است که عاشق، سرسخت و مصمم است از رابطه خود در برابر بدبین ها دفاع کند. هر دو به طور جزئی یا کامل با مکس مارتین و شل بک که برخی از چسبناک ترین قلاب های سوئیفت را اذیت می کنند، تولید شده اند. هر دو آلبوم‌های پاپ هستند که به شدت به درام متمایل می‌شوند و متعهد به بیت"}, {"source": "Business Insider", "title": "Ron Johnson worked with Steve Jobs for 11 years. This lesson stuck with him.", "link": "https://www.businessinsider.com/apple-former-retail-chief-ron-johnson-lesson-steve-jobs-2026-9", "summary": "Ron Johnson worked with Steve Jobs for more than a decade. Visual China Group via Getty Images In a live Q A with Business Insider, Apple's former head of retail shared what he learned from Steve Jobs . Ron Johnson said the Apple cofounder taught him to be present and not rush. He said Jobs took his time building out a vision and was patient rolling out new products. Ron Johnson spent more than a decade working alongside Steve Jobs — including a stretch when the two spoke on the phone every night for about a year. The former head of retail at Apple oversaw the creation of 350 stores and the development of nearly 50 more, representing nearly three-quarters of Apple's locations today. Johnson, who stayed at the company until Jobs' death in 2011, said the Apple cofounder left him with an important lesson that he still carries today. \"The big one is: Don't be in a hurry,\" Johnson said during a Business Insider live Q A about his new book, \"Shop Different: How Retail Revealed Apple's Genius.\" Johnson, who later became CEO at JCPenney, said that Jobs was always present. When Jobs was working, he focused entirely on the task at hand and didn't carry his phone on him, Johnson said. Jobs' assistant would ask Johnson to be available to take calls in case she needed to reach Jobs, the former retail chief said. \"The next meeting, he remembered everything we talked about the week before,\" he said. Johnson said that level of presence showed up not only in their regular conversations, but also in Jobs' approach to building Apple. During his time leading Apple, Jobs helped transform it into a multibillion-dollar company. Apple's product rollout under Jobs serves as one example of that focus, Johnson said. Despite being a consumer electronics company, Apple waited until 2007 to introduce the iPhone after launching the iPod in 2001. \"He wasn't in a hurry,\" Johnson said. \"He wanted that iPod to be great — and then we earned the right to do a phone.\" Johnson brought that same mindset to Apple's retail business during his tenure at the tech giant. When he arrived, he was tasked with building out the company's retail network. At the time, many believed physical retail was on its way out due to the rise of online shopping. Despite this, he remained committed to the plan until Apple Stores became a hit. Johnson later added that any store that hit $15 million in revenue would be profitable, and they reached that milestone after the iPod Nano went live. Johnson wrote in his book ab", "date_str": "2026-09-25T16:41:00+00:00", "hash": "081c3537adc55323", "title_fa": "ران جانسون 11 سال با استیو جابز کار کرد. این درس به او چسبید.", "summary_fa": "ران جانسون بیش از یک دهه با استیو جابز کار کرد. گروه ویژوال چین از طریق گتی ایماژ در QA زنده با Business Insider، رئیس سابق خرده فروشی اپل آنچه را که از استیو جابز آموخته به اشتراک گذاشت. ران جانسون گفت که یکی از بنیانگذاران اپل به او آموخته است که حضور داشته باشد و عجله نکند. او گفت که جابز وقت خود را صرف ایجاد یک چشم انداز کرد و صبور بود تا محصولات جدید را عرضه کند. ران جانسون بیش از یک دهه را در کنار استیو جابز کار کرد - از جمله زمانی که آن دو به مدت حدود یک سال هر شب تلفنی صحبت کردند. رئیس سابق خرده‌فروشی اپل بر ایجاد 350 فروشگاه و توسعه نزدیک به 50 فروشگاه دیگر نظارت داشت که تقریباً سه چهارم مکان‌های اپل را امروز تشکیل می‌دهند. جانسون که تا زمان مرگ جابز در سال 2011 در این شرکت ماند، گفت که بنیانگذار اپل درس مهمی را برای او به یادگار گذاشت که هنوز هم دارد. جانسون در جریان برنامه زنده QA Business Insider درباره کتاب جدیدش با عنوان «خرید متفاوت: چگونه خرده فروشی نبوغ اپل را آشکار کرد» گفت: «مهمترین مسئله این است: عجله نکنید. جانسون که بعداً مدیرعامل JCPenney شد، گفت که جابز همیشه حضور داشت. جانسون گفت، زمانی که جابز کار می کرد، کاملاً روی کار انجام شده تمرکز می کرد و تلفن خود را با خود حمل نمی کرد. مدیر سابق خرده‌فروشی گفت، دستیار جابز از جانسون می‌خواهد که در صورت نیاز به تماس با جابز در دسترس باشد تا بتواند تماس بگیرد. او گفت: \"جلسه بعدی، او همه چیزهایی را که هفته قبل در مورد آن صحبت کرده بودیم به یاد آورد.\" جانسون گفت که سطح حضور نه تنها در مکالمات منظم آنها، بلکه در رویکرد جابز برای ساخت اپل نیز نمایان است. جابز در"}, {"source": "Business Insider", "title": "42 Amazon finds under $25 that our editors can't stop raving about", "link": "https://www.businessinsider.com/guides/gifts/cheap-amazon-purchases-under-25-dollars", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We compiled a list of t % In the period drama \"Little Ashes,\" renowned artist Salvador Dalí (Pattinson) and poet Frederic García Lorca fall in love during the pre-Spanish Civil War era. \"The drawcard of Robert 'Twilight' Pattinson as Dalí is a mixed blessing for the filmmakers, given how ill-at-ease he is in the role. Javier Beltran, as Garcia Lorca, cast as the heroic center of the film, cuts a more confident figure,\" wrote Philippa Hawker for The Age. 30 (tie). The Twilight Saga: Breaking Dawn Part 1 (2011) The Twilight Saga: Breaking Dawn Part 1. Summit Entertainment Rotten Tomatoes score: 25% The first part of a two-part adaptation of \"Breaking Dawn,\" the final novel in Stephenie Meyer's series, \"The Twilight Saga: Breaking Dawn Part 1,\" focuses on Bella Swan (Kristen Stewart) and Edward (Pattinson) as they go from wedded bliss to chaos. \"The last twenty minutes of '", "date_str": "2026-09-25T16:38:34+00:00", "hash": "1ee5ac2986ba0ea1", "title_fa": "همه 32 فیلم رابرت پتینسون، رتبه بندی شده اند", "summary_fa": "رابرت پتینسون جان ناسیون/ورایتی/گتی ایماژز رابرت پتینسون با بازی در نقش ادوارد کالن در فیلم «گرگ و میش» به شهرت رسید. اکنون او یکی از بزرگترین ستاره های سینمای ماست که امسال در چهار فیلم بازی کرد. بالاترین امتیاز او (لایو اکشن) یکی از فیلم های امسال است: «اودیسه». سال 2026 سال رابرت پتینسون بوده است. تنها امسال، او در «درام»، «اودیسه»، «پریمتایم» ظاهر شد و در فیلم موردانتظار «تلماسه: قسمت سوم» که برای اکران در دسامبر برنامه ریزی شده است، حضور خواهد داشت. او از دهه 2000، زمانی که در دو تا از بزرگترین فرنچایزهای این قرن ظاهر شد، راه درازی را پیموده است: ابتدا در نقش سدریک دیگوری کوچک (اما محوری) در «هری پاتر» و سپس به عنوان بزرگ‌ترین دل‌باز هزاره‌ها، ادوارد کالن، در «گرگ و میش». برای جشن اکران آخرین فیلم او، «Primimetime» در روز جمعه، در اینجا نگاهی داریم به این که منتقدان چگونه به فیلم‌های پتینسون در طول دوران حرفه‌ای‌اش، از اولین فیلمش در سال 2005 تا کنون، امتیاز داده‌اند. 31. ملکه صحرا (2017) IFC Films Rotten Tomatoes امتیاز: 17% بر اساس یک داستان واقعی، \"ملکه صحرا\" گرترود بل (نیکول کیدمن) را دنبال می کند که زندگی در انگلیس را پشت سر می گذارد و در سراسر خاورمیانه سفر می کند و در طول راه با یک افسر بریتانیایی (جیمز فرانکو) رابطه عاشقانه برقرار می کند. پتینسون در نقش باستان شناس معروف T.E. لارنس که موضوع «لورنس عربستان» بود. \"یک رابطه عاطفی خالی، از نظر موضوعی بد تعریف و بی حال. آنجلیکا جید باستین برای RogerEbert.com نوشت: هرگز قادر نیست پیچیدگی زن را در مرکز خود بیان کند.\" در دوران قبل از جنگ داخلی اسپانیا عاشق می شوند."}, {"source": "Business Insider", "title": "I was afraid to delegate tasks for my 7-figure business. Learning to let go helped me grow it to nearly $5M.", "link": "https://www.businessinsider.com/seven-figure-business-burnout-delegating-growth-systems-2026-9", "summary": "Luba Patlakh Kaplun founded her own company in search fo more revenue. Courtesy of Luba Patlakh Kaplun Luba Patlakh Kaplun searched for a serious job that would appeal to her immigrant parents. After working for someone, she founded her own company in hopes of generating more revenue. Her company began to scale rapidly after she became more comfortable with outsourcing. This as-told-to essay is based on a conversation with Luba Patlakh Kaplun, founder of Kidology . It has been edited for length and clarity . I used to dream of being a broadcast journalist . But my parents — Russian Jewish immigrants from Ukraine — wanted me to do something more serious, in their eyes. I floundered for a bit, studying journalism , then opening a marketing agency. All the while, my parents were asking, \"When are you going to establish yourself?\" Much of my family works in medicine , but I can't do blood and needles. I did an internet search for careers with the most security and growth potential, and found speech-language pathology. It seemed perfect: serious enough for my parents, and adjacent to the medical field, but with no blood or needles. My language skills helped me differentiate my business I got my master's and started working for another speech-language pathologist who had a bilingual English-Spanish clinic. I speak Russian, and when the owner realized that, they started to grow their clientele. I realized my community was almost completely untouched. Instead of using my Russian skills to expand someone else's business, I wanted to use them to benefit my family and me. Doing that felt like a way to honor the generational trauma that my family had been through, sacrificing and working so hard to get to America. Doing everything myself started to catch up That's when Luba, the business owner, was born. I started going to all the Jewish clubs and churches to see students. I was juggling seeing patients with building a practice, billing insurance , and raising awareness about speech-language pathology within my Russian-speaking community. I was constantly trying to do a little more before hiring someone. I worried I could never teach the business to another person, and that no one would treat the business — my baby — as well as I would. Five years in, I was burned out. I realized I was missing payments because I didn't have the systems in place to track them and follow up with clients. I was good at juggling, but some of the balls were starting to drop . Creating stan", "date_str": "2026-09-25T16:37:01+00:00", "hash": "4b1dd269235e5226", "title_fa": "می ترسیدم وظایفی را برای کسب و کار 7 رقمی خود محول کنم. یادگیری رها کردن به من کمک کرد تا آن را تا نزدیک به 5 میلیون دلار افزایش دهم.", "summary_fa": "Luba Patlakh Kaplun شرکت خود را در جستجوی درآمد بیشتر تأسیس کرد. با حسن نیت لوبا پاتلاخ کاپلان لوبا پاتلاخ کاپلون به دنبال شغل جدی بود که برای والدین مهاجرش جذاب باشد. او پس از کار برای شخصی، شرکت خود را به امید کسب درآمد بیشتر تأسیس کرد. پس از اینکه او با برون سپاری راحت تر شد، شرکت او به سرعت شروع به گسترش کرد. این مقاله گفته شده بر اساس گفتگو با لوبا پاتلاخ کاپلون، بنیانگذار Kidology است. برای طول و وضوح ویرایش شده است. من قبلاً رویای روزنامه نگاری را در سر داشتم. اما والدینم - مهاجران یهودی روسی از اوکراین - از من می خواستند که از نظر آنها کار جدی تری انجام دهم. من برای مدتی دست و پا زدم، روزنامه‌نگاری خواندم، سپس یک آژانس بازاریابی باز کردم. در تمام مدت پدر و مادرم می‌پرسیدند: «کی می‌خواهی خودت را تثبیت کنی؟» بسیاری از خانواده من در پزشکی کار می کنند، اما من نمی توانم خون و سوزن انجام دهم. من جستجوی اینترنتی برای مشاغلی با بیشترین امنیت و پتانسیل رشد انجام دادم و آسیب شناسی گفتار و زبان را پیدا کردم. عالی به نظر می رسید: برای والدینم به اندازه کافی جدی بود، و در مجاورت رشته پزشکی بود، اما بدون خون و سوزن. مهارت های زبانی به من کمک کرد تا کسب و کارم را متمایز کنم. فوق لیسانس خود را گرفتم و برای آسیب شناس گفتار زبان دیگری که یک کلینیک دوزبانه انگلیسی-اسپانیایی داشت شروع به کار کردم. من روسی صحبت می کنم و وقتی صاحب آن متوجه شد، شروع به افزایش مشتریان خود کردند. متوجه شدم که جامعه من تقریباً کاملاً دست نخورده است. به‌جای استفاده از مهارت‌های روسی خود برای گسترش تجارت دیگران، می‌خواستم از آنها برای من و خانواده‌ام استفاده کنم. انجام این کار راهی برای ارج نهادن به ترومای"}, {"source": "Business Insider", "title": "44 of the best and worst looks Melania Trump has worn as first lady", "link": "https://www.businessinsider.com/melania-trump-best-worst-looks-first-lady-2025-1", "summary": "Melania Trump has hits and misses with her fashion. Kevin Dietsch - Pool/Getty Images People have kept a close eye on Melania Trump's fashion since she became first lady. Her fashion works best when she mixes her personal style with a professional edge. She's also been known to wear some controversial looks. Melania Trump has been quietly reinventing her style in her second tenure as first lady . Since she returned to the White House in 2025, she has largely struck a more subdued tone in her attire than when President Donald Trump first took office in 2017, though she still switches it up from time to time. Since becoming first lady, Melania Trump's style has often drawn attention, with some of her outfits proving controversial. Take a look at some of the best and worst looks she's worn during Donald Trump's presidency . Melania Trump paid homage to Jackie Kennedy when she debuted as first lady. Donald and Melania Trump on Inauguration Day 2017. Kevin Dietsch - Pool/Getty Images Ralph Lauren Collection designed the knee-length, powder-blue dress Melania wore to Trump's inauguration in 2017, along with the coordinating shrug and gloves. She accessorized the outfit with pearl earrings and blue, pointed-toe heels. The full ensemble evoked Jackie Kennedy's style . From the bright color to the nod to one of America's most iconic first ladies, Melania's look was the perfect choice for her husband's first inauguration . Her custom gown for the 2017 inaugural balls featured standout three-dimensional detailing. Donald and Melania Trump at the 2017 Inauguration Ball 2017. Kevin Dietsch - Pool/Getty Images Hervé Pierre custom-designed Melania's off-the-shoulder dress for the inaugural ball. The cream dress had an A-line silhouette, a thigh-high slit on one side, and three-dimensional fabric that curved across the bodice. A thin red belt cinched at the waist for a pop of color. The dress felt high-fashion, connecting the first lady to her past as a model as she stepped into a new role. Melania s outfit for a visit to Texas in August 2017 got attention online. Donald and Melania Trump in Texas in August 2017. JIM WATSON / AFP / Getty Images In August 2017, the Trumps visited Corpus Christi, Texas, following Hurricane Harvey to assess recovery efforts. The pair wore casual attire, with Melania arriving in a white button-down, black jeans, and sneakers. She also added a black baseball hat to her look that said \"FLOTUS,\" first lady of the United States, on the front. Mel", "date_str": "2026-09-25T16:33:18+00:00", "hash": "36cde0436242fdd9", "title_fa": "44 تا از بهترین و بدترین ظاهری که ملانیا ترامپ به عنوان بانوی اول داشته است", "summary_fa": "ملانیا ترامپ با مد و فشن‌اش ضربه‌های زیادی خورده است. کوین دیچ - Pool/Getty Images مردم از زمانی که ملانیا ترامپ بانوی اول شد، مد و لباس مد را زیر نظر داشتند. مد او زمانی بهترین کار را می کند که سبک شخصی خود را با یک مزیت حرفه ای ترکیب کند. او همچنین به پوشیدن لباس های بحث برانگیز معروف است. ملانیا ترامپ در دومین دوره تصدی خود به عنوان بانوی اول بی سر و صدا در حال ابداع سبک خود است. از زمانی که او در سال 2025 به کاخ سفید بازگشت، لحن ملایم‌تری نسبت به زمانی که دونالد ترامپ، رئیس‌جمهور آمریکا برای اولین بار در سال 2017 به قدرت رسید، در لباس‌هایش ظاهر شده است، اگرچه او هنوز هم هر از گاهی آن را تغییر می‌دهد. از زمانی که ملانیا ترامپ بانوی اول شد، سبک ملانیا ترامپ اغلب توجه ها را به خود جلب کرده است و برخی از لباس های او بحث برانگیز بوده است. نگاهی به بهترین و بدترین تیپ های او در دوران ریاست جمهوری دونالد ترامپ بیاندازید. ملانیا ترامپ در اولین حضورش به عنوان بانوی اول، به جکی کندی ادای احترام کرد. دونالد و ملانیا ترامپ در روز تحلیف 2017. کوین دیچ - استخر/گتی ایماژ مجموعه رالف لورن لباس آبی پودری که ملانیا در مراسم تحلیف ترامپ در سال 2017 پوشیده بود تا روی زانو طراحی کرد، همراه با بالا انداختن هماهنگ و دستکش. او این لباس را با گوشواره های مروارید و پاشنه های آبی و نوک تیز تزئین کرد. گروه کامل سبک جکی کندی را تداعی می کرد. از رنگ روشن گرفته تا تکان دادن سر به یکی از نمادین ترین بانوی اول آمریکا، ظاهر ملانیا بهترین انتخاب برای اولین مراسم تحلیف همسرش بود. لباس مجلسی سفارشی او برای مراسم افتتاحیه 2017 دارای جزئیات سه بعدی برجسته بود. دونالد و ملانیا"}, {"source": "Business Insider", "title": "A Google employee said he quit because he's worried about superintelligent AI", "link": "https://www.businessinsider.com/google-deepmind-employee-resigns-ai-safety-harm-chips-robert-ocallahan-2026-9", "summary": "Another Google worker has said they are concerned about the pace of AI development. Bloomberg/Getty Images Another tech worker has said they resigned over concerns about how fast AI is developing. This time, it's someone who worked on Google's AI chips. Robert O'Callahan said the risk of AI causing harm \"is real but uncertain.\" A Google employee said he resigned from the company, citing the pursuit of powerful artificial intelligence as \"inherently irresponsible.\" Robert O'Callahan, who worked at Google DeepMind, wrote in an X post that his team was developing chips to make AI faster and cheaper and that he believed AI was already \"progressing too fast.\" He shared a resignation letter on his personal blog that he said he sent to colleagues on Friday, in which he wrote that he couldn't \"turn a blind eye\" to the impact of his work because it \"would not be a Jesus-following thing to do.\" He describes himself as a Christian in his blog's bio. \"This has not been an easy decision. I love my colleagues and my work environment, and being paid handsomely to solve fun puzzles has been amazing,\" he wrote. \"But my team's goal is ultimately to make AI much cheaper and lower-latency, and I don't think that's good for people right now: I firmly believe AI progress is currently far too rapid (and I have doubts about the destination too).\" Business Insider could not establish how long O'Callahan, who says he is based in New Zealand, worked for Google. Approached for comment, O'Callahan referred Business Insider to the blog post. Google declined to comment. O'Callahan joins a string of employees from AI companies who have either quit over safety concerns or sounded the alarm from within. Jacob Coxon resigned from Anthropic earlier this month, citing fears that the industry was building technology it would not ultimately be able to control. His comments sparked broader concerns that advanced AI could one day wipe out humanity . Last month, Google DeepMind researcher Bilal Chughtai said he resigned from the company in the summer over fears that humanity might be running out of time to avoid a scenario in which AI harms humanity. I resigned from Google today. I enjoyed my work and loved the people, but my GDM team was working on a new generation of chips to make AI much faster and cheaper, and I think AI is already progressing too fast, so I had to quit. — Robert O'Callahan (@rocallahan) September 25, 2026 O'Callahan did not go as far as some of his fellow tech workers . In a ", "date_str": "2026-09-25T16:30:39+00:00", "hash": "185344585a6b6756", "title_fa": "یکی از کارمندان گوگل گفت به دلیل نگرانی در مورد هوش مصنوعی فوق‌هوشمند استعفا داده است", "summary_fa": "یکی دیگر از کارمندان گوگل گفته است که نگران سرعت توسعه هوش مصنوعی هستند. Bloomberg/Getty Images یکی دیگر از کارکنان فناوری گفته است که به دلیل نگرانی در مورد سرعت توسعه هوش مصنوعی استعفا داده اند. این بار، این شخصی است که روی تراشه های هوش مصنوعی گوگل کار کرده است. رابرت اوکالاهان گفت خطر ایجاد آسیب هوش مصنوعی \"واقعی اما نامشخص است.\" یکی از کارمندان گوگل گفت که از این شرکت استعفا داد و به دنبال هوش مصنوعی قدرتمند به عنوان \"ذاتا غیرمسئولانه\" اشاره کرد. رابرت اوکالاهان، که در Google DeepMind کار می‌کرد، در یک پست X نوشت که تیمش در حال توسعه تراشه‌هایی برای سریع‌تر و ارزان‌تر کردن هوش مصنوعی هستند و او معتقد است که هوش مصنوعی در حال حاضر «خیلی سریع پیشرفت می‌کند». او نامه استعفای خود را در وبلاگ شخصی خود به اشتراک گذاشت که به گفته او روز جمعه برای همکارانش فرستاده بود و در آن نوشت که نمی تواند \"چشم خود را بر تاثیر کار خود ببندد\" زیرا \"این کار پیروی از عیسی نخواهد بود.\" او در بیو وبلاگش خود را مسیحی معرفی می کند. او نوشت: \"این تصمیم آسانی نبوده است. من عاشق همکارانم و محیط کارم هستم و دریافت دستمزد هنگفت برای حل پازل های سرگرم کننده شگفت انگیز بوده است.\" اما هدف تیم من در نهایت این است که هوش مصنوعی را بسیار ارزان‌تر و با تأخیر کمتری انجام دهد، و فکر نمی‌کنم در حال حاضر این برای مردم خوب باشد: من کاملاً معتقدم که پیشرفت هوش مصنوعی در حال حاضر بسیار سریع است (و در مورد مقصد نیز شک دارم). Business Insider نتوانست مشخص کند که اوکالاهان، که می گوید در نیوزلند مستقر است، چه مدت برای گوگل کار کرده است. برای اظهار نظر، اوکالاهان Business Insider را به پست وبلاگ ارجاع داد. گوگل از اظهار نظر خودداری کرد."}, {"source": "Business Insider", "title": "Meta smart glasses have a new AI-training opt-out", "link": "https://www.businessinsider.com/meta-glasses-ai-visual-data-opt-out-training-2026-9", "summary": "Meta s smart glasses reportedly adjusted their AI training policy. Andrej Sokolow/picture alliance via Getty Images Meta will allow its smart-glass users to opt out of visual data collection for training AI models. The setting applies to camera-based AI requests, not photos saved to a user's camera roll. The move comes as Meta faces scrutiny over how its glasses collect and handle visual data. Meta's smart glasses have a new opt-out. Meta spokesperson Dina El-Kassaby confirmed to Business Insider that the company is changing the setting options on its camera-wielding glasses. Previously, the glasses could collect visual data for training when the wearer used AI features. Now, those users can opt out of having their visual data stored for AI training. Engadget first reported the change. In a blog post , Meta wrote that users can do so in four steps: Open the Meta AI app, tap the glasses settings, find \"Meta AI\" under \"Experiences,\" and turn off \"Store visual data from AI experiences.\" Meta has long said that it doesn't save data from ordinary photos and videos taken with the glasses. A user's camera roll is private by default and not used to train AI, the company said. That's different for visual data collected during AI use. The current privacy policy, which has been in effect since June, says Meta can \"share recordings, transcripts, and related data about your voice conversations with Meta AI with vendors and service providers who assist us in improving, troubleshooting, and training our speech recognition systems.\" Earlier this year, a Swedish news outlet reported that human data annotators in Kenya could video and images taken while using the AI features of Meta glasses, including during intimate moments. Meta makes the glasses with EssilorLuxottica, Ray-Ban's parent company. The brands reported selling more than 7 million units last year. On Wednesday, during the company's Meta Connect 2026 conference , CEO Mark Zuckerberg announced that two new styles will come with camera-free, voice-only AI features. Meta's AI glasses have spawned uneasy questions over privacy . They're designed to flash a small light to alert bystanders when they're recording — but Meta recently said it had to deactivate the hardware for thousands of users who had tampered with the lights. Read the original article on Business Insider", "date_str": "2026-09-25T16:23:27+00:00", "hash": "6e4f1df866389df0", "title_fa": "عینک‌های هوشمند متا دارای یک انصراف جدید برای آموزش هوش مصنوعی هستند", "summary_fa": "طبق گزارش‌ها، عینک‌های هوشمند متا سیاست آموزش هوش مصنوعی خود را تنظیم کردند. اتحاد Andrej Sokolow/تصویر از طریق Getty Images Meta به کاربران شیشه‌های هوشمند خود اجازه می‌دهد از جمع‌آوری داده‌های بصری برای آموزش مدل‌های هوش مصنوعی خودداری کنند. این تنظیم برای درخواست‌های هوش مصنوعی مبتنی بر دوربین اعمال می‌شود، نه عکس‌های ذخیره‌شده در رول دوربین کاربر. این حرکت در حالی صورت می‌گیرد که متا در مورد نحوه جمع‌آوری و مدیریت داده‌های بصری توسط عینک‌هایش مورد بررسی قرار می‌گیرد. عینک هوشمند متا یک انصراف جدید دارد. دینا الکسابی، سخنگوی متا به Business Insider تایید کرد که این شرکت در حال تغییر گزینه‌های تنظیمات روی عینک‌های مجهز به دوربین است. پیش از این، این عینک می‌توانست داده‌های بصری را برای آموزش هنگام استفاده از ویژگی‌های هوش مصنوعی جمع‌آوری کند. اکنون، این کاربران می توانند از ذخیره داده های بصری خود برای آموزش هوش مصنوعی صرف نظر کنند. Engadget ابتدا این تغییر را گزارش کرد. متا در یک پست وبلاگی نوشت که کاربران می توانند این کار را در چهار مرحله انجام دهند: برنامه Meta AI را باز کنید، روی تنظیمات عینک ضربه بزنید، \"Meta AI\" را در زیر \"Experiences\" پیدا کنید، و \"ذخیره داده های بصری از تجربیات AI\" را خاموش کنید. متا مدتهاست که گفته است که داده های عکس ها و فیلم های معمولی گرفته شده با عینک را ذخیره نمی کند. این شرکت گفت که رول دوربین کاربر به طور پیش فرض خصوصی است و برای آموزش هوش مصنوعی استفاده نمی شود. این برای داده های بصری جمع آوری شده در طول استفاده از هوش مصنوعی متفاوت است. سیاست حفظ حریم خصوصی فعلی، که از ژوئن اجرایی
