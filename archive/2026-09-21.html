 بدون هیچ‌گونه محدودیت و ملاحظه‌ای، هدف حملات مستمر، مؤثر و دردناک قرار خواهد گرفت». این بیانیه از «چراغ سبز» برخی کشورهای منطقه برای جنگ «در نشست مشترکی در یکی از کشورهای اروپایی» خبر می‌دهد. این پیام‌های متناقض و همزمانی که تهران ارسال می‌کند خبر از فهم مسوولان حکومتی از وضعیت در شرف تغییر منطقه دارد. به خاطر همین حکومت خود را نیازمند یک تدبیر احساس می‌کند تدبیری که نام آن را «هم جنگ و هم مذاکره» گذاشته‌اند. نگرانی اصلی تهران، هم از یک حمله قریب‌الوقوع در چند جبهه است و هم تثبیت تدریجیِ نظمی امنیتی در منطقه آن هم بدون جمهوری اسلامی است؛ در صورتی که شعار مقامات حکومت این است که نظم منطقه را آن‌ها دیکته می‌کنند. بیانیه قرارگاه خاتم‌الانبیا اگرچه یک واکنش پیش‌دستانه است، اما لحن و زمان‌بندی آن نشان می‌دهد تهران خطر را جدی‌تر از هر زمان دیگری احساس کرده و گمان می‌کند ناگزیر است پیش از"}, {"source": "IranWire", "title": "وحیده حق‌پرست به چهار سال و چهار ماه حبس محکوم شد", "link": "https://iranwire.com/fa/news-1/157821-%D9%88%D8%AD%DB%8C%D8%AF%D9%87-%D8%AD%D9%82%D9%BE%D8%B1%D8%B3%D8%AA-%D8%A8%D9%87-%DA%86%D9%87%D8%A7%D8%B1-%D8%B3%D8%A7%D9%84-%D9%88-%DA%86%D9%87%D8%A7%D8%B1-%D9%85%D8%A7%D9%87-%D8%AD%D8%A8%D8%B3-%D9%85%D8%AD%DA%A9%D9%88%D9%85-%D8%B4%D8%AF/", "summary": "وحیده حق‌پرست، از بازداشت‌شدگان مراسم هفتم خسرو علیکردی، توسط شعبه اول دادگاه انقلاب مشهد مجموعا به چهار سال و چهار ماه حبس محکوم شد.خب ...", "date_str": "2026-09-20T14:34:47+00:00", "hash": "b110a6b9e756cdd9", "title_fa": "وحیده حق‌پرست به چهار سال و چهار ماه حبس محکوم شد", "summary_fa": "وحیده حق‌پرست، از بازداشت‌شدگان مراسم هفتم خسرو علیکردی، توسط شعبه اول دادگاه انقلاب مشهد مجموعا به چهار سال و چهار ماه حبس محکوم شد.خب ... خبرگزاری هرانا، روز ۲۹ شهریور ۱۴۰۵، گزارش داد این حکم شامل سه سال و هفت ماه حبس به اتهام «اجتماع و تبانی» و ۹ ماه حبس به اتهام «تبلیغ علیه نظام» است. هرانا به نقل از یک منبع مطلع گزارش داد که جلسه رسیدگی به اتهامات حق‌پرست روز ۱۰ شهریور، بدون حضور او و وکیل مدافعش برگزار شده است. این شهروند به دلیل بیماری قادر به حضور در دادگاه نبوده و پیش‌تر درخواست قانونی برای تغییر زمان برگزاری جل بیه گزارش درباره یک داستان علمی‌تخیلی بود تا فوتبال.» اسرائیل که تیم بزرگسالانش تنها یک بار به جام جهانی فوتبال صعود کرده، توانسته بود، برزیل را در یک‌چهارم نهایی جام جهانی زیر ۲۰ سال شکست دهد. با سوت پایان بازی، گزارشگر تلویزیون اسرائیل که مسابقه را پوشش می‌داد، گفت: «این شب را برای فرزندانتان تعریف خواهید کرد و آنها هم آن را برای نوه‌هایتان تعریف خواهند کرد.» پنج روز بعد، دیدار نیمه‌نهایی این تیم برابر اروگوئه پربیننده‌ترین برنامه آن شب در تلویزیون اسرائیل بود و سهم ۲۳ درصدی از بینندگان را به خود اختصاص داد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. راکوفسکی که برای رسانه اسرائیلی هاآرتص مسابقات را گزارش می‌کرد، می‌گوید: «آن تابستان همه فوتبال زیر ۲۰ سال را تماشا می‌کردند و همه بازیکنان را می‌شناختند. همه در اسرائیل عاشق این بچه‌ها شده بودند.» اما تنها عملکرد آنها در زمین نبود که حال‌وهوایی غیرواقعی داشت. پس از آن که عنان خلایلی در وقت‌های تلف‌شده برابر ازبکستان گل پیروزی را زد، با تلویزیون اسرائیل گفت‌وگو کرد. خلایلی که یک عرب اسرائیلی است، از بینندگان داخل کشور که تا دیروقت بیدار مانده بودند تا پیروزی تیمشان در آرژانتین را تماشا کنند، تشکر کرد. او برای این کار از عبارت «عم اسرائیل» استفاده کرد؛ عبارتی عبری به معنای «مردم اسرائیل» که با دین، جامعه، فرهنگ و تاریخ یهودیان پیوند دارد. راکوفسکی می‌گوید: «این که یک بازیکن عرب از چنین تعبیری استفاده کرد، چیزی درباره هویت آن تیم می‌گفت."}, {"source": "BBC Persian", "title": "شبیری زنجانی؛ مرجع تقلیدی به دور از هیاهوی سیاسی", "link": "https://www.bbc.com/persian/articles/c8jev0kyvd1o?at_medium=RSS&at_campaign=rss", "summary": "موسی شبیری زنجانی از مراجع تقلید شیعه یکشنبه ۲۹ شهریور ۱۴۰۵ در ۹۹ سالگی در گذشت. به گزارش رسانه‌های ایران، او به دلیل مشکلات داخلی و خونریزی معده در یکی از بیمارستان‌های قم بستری شده و تحت درمان قرار داشت.", "date_str": "2026-09-21T08:02:41+00:00", "hash": "0ccba85f5da25539", "title_fa": "شبیری زنجانی؛ مرجع تقلیدی به دور از هیاهوی سیاسی", "summary_fa": "موسی شبیری زنجانی از مراجع تقلید شیعه یکشنبه ۲۹ شهریور ۱۴۰۵ در ۹۹ سالگی در گذشت. به گزارش رسانه‌های ایران، او به دلیل مشکلات داخلی و خونریزی معده در یکی از بیمارستان‌های قم بستری شده و تحت درمان قرار داشت. آیت‌الله شبیری زنجانی استاد درس خارج فقه و خارج اصول در قم بود و در حوزه علمیه از او به عنوان فقیهی با پایبندی به سنت‌های اصیل حوزوی یاد می‌شود. آقای شبیری زنجانی یکی از هفت فقیهی بود که پس از درگذشت آیت‌الله اراکی، از سوی جامعه مدرسین حوزه علمیه قم، جایز التقلید و واجد شرایط مرجعیت معرفی شد. او همانند پدرش امام جماعت در حرم معصومه، خواهر امام هشتم شیعیان بود. موسی شبیری‌زنجانی در سال ۱۳۰۶ شمسی در شهر قم متولد شد. پدرش احمد شبیری زنجانی، از علمای برجسته و مورد احترام حوزه بود و از نخستین مشوقان او در مسیر تحصیل علوم دینی به شمار می‌رفت. آقای شبیری تحصیلات ابتدایی را در قم گذراند و از همان سنین نوجوانی وارد حوزه علمیه شد. او دروس حوزوی را از سال ۱۳۱۹ آغاز کرد و دروس دوره سطح را در سه یا چهار سال به پایان برد. آقای شبیری زنجانی، دو بار به حوزه علمیه نجف رفت و درس‌های خارج فقه را در آنجا گذراند. او نزد مراجع تقلید و چهره‌های مطرح حوزه مانند محمد حجت کوه‌کمره‌ای، حسین طباطبایی بروجردی، روح‌الله خمینی، محمدحسین طباطبایی و ابوالقاسم خویی علوم دینی را فرا گرفت. این مرجع تقلید علاوه بر تدریس و تحقیق در زمینه علوم دینی تالیفاتی داشته است. توضیح المسائل (رساله عملیه فقهی)، مقالات رجالی و حدیثی در قالب جزوات پژوهشی، تحقیقات فقهی و اصولی منتشر شده توسط شاگردانش از جمله کتاب‌های او هستند. کتاب چهارجلدی «جرعه‌ای از دریا» شامل تعلیقات و تألیفات و سخنان شفاهی آقای شبیری زنجانی شناخته‌ترین کتاب درباره او است. آیت‌الله شبیری زنجانی همانند بسیاری از مراجع"}, {"source": "BBC Persian", "title": "دختر فیدل کاسترو: هیچ‌وقت نخواستم او را پدر صدا کنم", "link": "https://www.bbc.com/persian/articles/cly58ny8n4vo?at_medium=RSS&at_campaign=rss", "summary": "آلینا فرناندز می‌گوید تا جایی که از دوران کودکی خود به یاد می‌آورد، فیدل کاسترو مرتب به دیدارش می‌آمد، بی‌آنکه بداند رهبر انقلاب کوبا در واقع پدر اوست.", "date_str": "2026-09-21T05:13:33+00:00", "hash": "dd35289537c7faff", "title_fa": "دختر فیدل کاسترو: هیچ‌وقت نخواستم او را پدر صدا کنم", "summary_fa": "آلینا فرناندز می‌گوید تا جایی که از دوران کودکی خود به یاد می‌آورد، فیدل کاسترو مرتب به دیدارش می‌آمد، بی‌آنکه بداند رهبر انقلاب کوبا در واقع پدر اوست. آلینا فرناندز از زمانی که به یاد می‌آورد و دوران کودکی‌اش را به خاطر داشت، مرتب شاهد رفت‌وآمد فیدل کاسترو به خانه‌شان بود. او در بخش بزرگی از سال‌های کودکی‌اش نمی‌دانست چرا. اما دلیلش این بود که مردی که نزدیک به ۵۰ سال با مشت آهنین بر کوبا حکومت کرد، در واقع پدر او بود. آلینا در سال ۱۹۵۶ در هاوانا و در نتیجه رابطه خارج از ازدواج کاسترو با ناتی فرناندز متولد شد، زن جوان و زیبایی از طبقه مرفه پایتخت کوبا. کاسترو در آن زمان هنوز فقط یکی از رهبران جنبشی چریکی بود که سه سال بعد، فولخنسیو باتیستا، دیکتاتور کوبا، را سرنگون کرد و حکومتی خودکامه و کمونیستی را در این جزیره واقع در دریای کارائیب بر سر کار آورد. برآورد می‌شود در دهه‌های پس از آن، تا سه میلیون نفر از کوبا به آمریکا، کشور همسایه، گریختند. دختر خود کاسترو نیز یکی از آن‌ها بود. کاسترو از سال ۱۹۵۹ تا ۲۰۰۸ حکومت کرد و در نوامبر ۲۰۱۶ بر اثر سرطان درگذشت. آلینا فرناندزدر میامی درباره زندگی‌ سخن گفت که با سرگذشت یکی از مشهورترین و جنجالی‌ترین سیاستمداران قرن بیستم گره خورده بود؛ مردی که او هرگز نمی‌خواست «پدر» صدایش کند. نخستین خاطره آلینا از کاسترو، مردی ریشو است که در تلویزیون ظاهر می‌شد و برنامه‌هایش جای کارتون‌های میکی‌موس را که پیش‌تر پخش می‌شدند، گرفته بود. آلینا که اکنون ۷۰ سال دارد، می‌گوید: «میکی‌موس ناپدید شد.» به یاد می‌آورد که جای آن را «مردان ریشویی گرفته بودند که از خودروها آویزان بودند؛ کسانی که حسابی مرا می‌ترساندند و روزها روی صفحه تلویزیون ظاهر می‌شدند.» دگرگونی‌های سیاسی در این کشور بسیاری از خانواده‌ها، از جمله خانواده خود او را، از"}, {"source": "BBC Persian", "title": "آیا نتانیاهو پیش از انتخابات اسرائیل دوباره به ایران حمله می‌کند؟", "link": "https://www.bbc.com/persian/articles/cwgk52m6kyg6o?at_medium=RSS&at_campaign=rss", "summary": "تنها چند هفته مانده به انتخابات اسرائیل، نظرسنجی‌ها هنوز اکثریت لازم برای ادامه نخست‌وزیری بنیامین نتانیاهو را نشان نمی‌دهند؛ اما وضعیت جدید در آستانه انتخابات، او را مقابل پرسش‌هایی قرار داده که ممکن است باعث شود شرایط در منطقه بیش از پیش پیچیده شود. سخنان تازه نتانیاهو درباره ادامه مقابله با ایران حالا پرسش‌هایی را درباره تاثیر یک رویارویی تازه بر سرنوشت سیاسی‌اش همراه کرده است.", "date_str": "2026-09-21T04:24:58+00:00", "hash": "dc89fcdecd0d3dbc", "title_fa": "آیا نتانیاهو پیش از انتخابات اسرائیل دوباره به ایران حمله می‌کند؟", "summary_fa": "تنها چند هفته مانده به انتخابات اسرائیل، نظرسنجی‌ها هنوز اکثریت لازم برای ادامه نخست‌وزیری بنیامین نتانیاهو را نشان نمی‌دهند؛ اما وضعیت جدید در آستانه انتخابات، او را مقابل پرسش‌هایی قرار داده که ممکن است باعث شود شرایط در منطقه بیش از پیش پیچیده شود. سخنان تازه نتانیاهو درباره ادامه مقابله با ایران حالا پرسش‌هایی را درباره تاثیر یک رویارویی تازه بر سرنوشت سیاسی‌اش همراه کرده است. بنیامین نتانیاهو سوم سپتامبر، در جمع فرماندهان ارتش، سرنگونی حکومت ایران را «ماموریت مرکزی» باقیمانده کشورش و هدفی «در دسترس» خواند. این در حالی است که در نظرسنجی ۱۴ سپتامبر شبکه ۱۲ اسرائيل، اردوگاه نتانیاهو ۵۰ کرسی داشت؛ کمتر از ۶۱ کرسی لازم برای اکثریت در پارلمان. تا انتخابات ۲۷ اکتبر، نخست وزیر اسرائیل همچنان فرصت دارد برای تغییر فضای رقابت تلاش کند، اما آیا تشدید تنش با ایران می‌تواند یکی از گزینه‌های او باشد و در آن صورت، همراهی آمریکا و واکنش رای‌دهندگان چه محدودیت‌هایی پیش روی او می‌گذارد؟ در میان مخالفان نتانیاهو، نگرانی از استفاده انتخاباتی از جنگ وجود دارد، هرچند کارشناسان درباره اینکه این نگرانی تا چه اندازه رفتار او در قبال ایران را توضیح می‌دهد، اختلاف نظر دارند. دالیا شیندلین، پژوهشگر علوم سیاسی، متخصص افکار عمومی و نویسنده کتاب «چوب کج دموکراسی در اسرائیل: وعدهای محقق نشده» به بی‌بی‌سی فارسی می‌گوید: «بسیاری از هواداران احزاب مخالف به شدت گمان می‌کنند که او برای تاثیرگذاری بر انتخابات، در جایی تنش را تشدید خواهد کرد. فکر نمی‌کنم برای تشدید تنش تا حد یک جنگ تمام عیار دست بازی داشته باشد، مگر اینکه آمریکا و به ویژه ترامپ به شکلی از آن حمایت کنند.» بخشی از کارشناسان این احتمال را مطرح کرده‌اند که ممکن است نتانیاهو با تشدید تنش در یکی از جبهه‌ها، فضای اضطرار ملی را دوباره بر رقابت سیاسی حاکم کند. چنین وضعیتی می‌تواند توجه کارزار را به مدیریت جنگ ، گفته بود فرماندهان ارشد نظامی آمریکا و اسرائیل و چند کشور عرب در آلمان گرد هم آمدند تا درباره جنگ ایران و تنش‌های خاورمیانه گفت‌وگو کنند. بنابر این گزارش، علاوه بر آمریکا، فرماندهان ارشد نظامی اسرائیل، عربستان، امارات، بحرین، کویت، قطر، اردن و مصر حاضر بودند؛ از جمله برد کوپر، فرمانده سنتکام، و ایال زمیر، رئیس ستاد نیروهای مسلح اسرائیل. اکسیوس همچنین به نقل از یک منبع آگاه گفت که اسرائیل و عربستان سعودی، با کمک سنتکام، در حال گفت‌وگو درباره چگونگی حمایت اسرائیل از عملیات نظامی عربستان علیه حوثی‌ها هستند و همچنین ارائه کمک‌های اطلاعاتی و نظارتی و شناسایی (آی‌اس‌آر) به عربستان، مشابه حمایت اسرائیل از امارات متحده عربی. کشورهای عرب اظهارنظری نکرده‌‌اند اما به گفته اکسیوس سنتکام این نشست را تایید و در بیانیه‌ای گفت که «میزبانی فرماندهان ارشد نظامی از هشت کشور را در جریان کنفرانسی برنامه‌ریزی‌شده در آلمان برعهده داشته است. این فرماندهان درباره فرصت‌های تقویت همکاری‌های امنیتی در خاورمیانه گفت‌وگو کردند.» در آنچه از سنتکام نقل شده است به نام کشور یا افراد اشاره نشده و ذکر شده است که نشست «برنامه‌ریزی‌شده» بود و اضطراری نبود."}, {"source": "BBC Persian", "title": "«کلید قطع اضطراری» چیست و آیا می‌تواند مانع حمله هوش مصنوعی شود؟", "link": "https://www.bbc.com/persian/articles/cpw9pgey2yno?at_medium=RSS&at_campaign=rss", "summary": "نخستین مورد تاییدشده از هک یک شرکت واقعی به دست یک سامانه هوش مصنوعیِ خودمختار، نگرانی کارشناسان در سراسر جهان را برانگیخته است. با این حال، به گفته متخصصان، راه جلوگیری از تکرار چنین رخدادهایی در آینده به مراتب پیچیده‌تر از آن چیزی است که به نظر می‌رسد.", "date_str": "2026-09-20T20:12:48+00:00", "hash": "d6883e8afa740df5", "title_fa": "«کلید قطع اضطراری» چیست و آیا می‌تواند مانع حمله هوش مصنوعی شود؟", "summary_fa": "نخستین مورد تاییدشده از هک یک شرکت واقعی به دست یک سامانه هوش مصنوعیِ خودمختار، نگرانی کارشناسان در سراسر جهان را برانگیخته است. با این حال، به گفته متخصصان، راه جلوگیری از تکرار چنین رخدادهایی در آینده به مراتب پیچیده‌تر از آن چیزی است که به نظر می‌رسد. بیشتر مردم دست‌کم یک بار به این فکر کرده‌اند که اگر هوش مصنوعی از کنترل انسان نکه به طور خاص در اینجا صحبت کنیم.» به علاوه، او استدلال کرد: «به نظر نمی‌رسد تعداد زیادی انتخاب مصرف‌کننده این بازار را هدایت کند، به این معنا که، بسیار خوب، اگر یکی از این شرکت‌ها واقعاً کار بدی انجام دهد، تأثیری در تعداد لغو یا هر چیز دیگری خواهد دید.» برای پیش نمایش مکالمه ما که برای طولانی و وضوح ویرایش شده است، به خواندن ادامه دهید. آنتونی: شان، نظرت چیست؟ آیا ما واقعاً قصد داریم \"سرعت مرز\" را طی کنیم؟ سین: به دلایلی شبیه چیزی از «Point Break» به نظر می رسد. این فقط یک بیانیه بسیار"}, {"source": "TechCrunch AI", "title": "Vocci’s ring adds a new form factor to meeting note-taking", "link": "https://techcrunch.com/2026/09/20/voccis-ring-adds-a-new-form-factor-to-meeting-note-taking/", "summary": "Vocci's lightweight ring costs $249, and might pose some privacy questions.", "date_str": "2026-09-20T18:32:52+00:00", "hash": "c1b75d0be3c0c17f", "title_fa": "حلقه Vocci شکل جدیدی را به یادداشت برداری جلسات اضافه می کند", "summary_fa": "انگشتر سبک وزن Vocci 249 دلار قیمت دارد و ممکن است برخی از سوالات حریم خصوصی را مطرح کند. اشکال مختلفی از سخت افزار برای یادداشت برداری جلسات، از جمله آویزها، سنجاق ها و دستگاه هایی با مدل کارت اعتباری کم نیست. این امر Vocci را از انتشار یک دستگاه جدید برای همان مورد استفاده به صورت حلقه ای که راحت است اما می تواند برخی از مشکلات حفظ حریم خصوصی ایجاد کند متوقف نکرده است. ضریب فرم حلقه یکی از ساده‌ترین موارد برای هر کسی است که می‌خواهد فقط یک دکمه را فشار دهد و دستگاه شروع به ضبط کند. حلقه Index 01 جدید Pebble که اکنون در حال آزمایش آن هستم، به شما امکان می دهد دکمه را نگه دارید و یادداشت یا یادآوری بگیرید. Stream Ring، ساخته شده توسط Sandbar، به طور مشابه با یک پد کنترل در بالا کار می کند. حلقه Vocci مسیر متفاوتی را طی می کند و یادداشت برداری از جلسات به عنوان یک عملکرد مرکزی است. حلقه دارای یک دکمه است که می توانید برای شروع ضبط دوبار روی آن ضربه بزنید و برای توقف دوباره دوبار ضربه بزنید. برای پرسیدن سوالات Vocci AI می توانید روی دکمه ضربه بزنید و نگه دارید، اما این فقط زمانی کار می کند که برنامه را باز کنید. یک چراغ نشانگر و یک موتور لمسی برای ثبت بازخورد وجود دارد. این حلقه سبک وزن کمتر از شش گرم است و از مواد تیتانیوم در سطوح داخلی و خارجی استفاده می کند - احتمالاً یک پوشش. این شرکت ادعا می کند که حلقه Vocci می تواند نت ها را با یک بار شارژ به مدت هشت ساعت ضبط کند. این دستگاه دارای یک کیف پلاستیکی درشت است که می تواند حلقه را تا سه بار شارژ کند. این دستگاه به خوبی جلسات را ضبط می کند."}, {"source": "TechCrunch AI", "title": "ScrollEd wants to turn textbooks into TikTok", "link": "https://techcrunch.com/2026/09/20/scrolled-wants-to-turn-textbooks-into-tiktok/", "summary": "ScrollEd turns textbooks into a scrollable, Instagram-like feed with video, audio, and quizzes. The Palo Alto startup, founded by student co-founders (and spouses) Utsav Gupta and Rebecca Neff, pitches at TechCrunch Disrupt.", "date_str": "2026-09-20T18:00:00+00:00", "hash": "f05d29cef1dd3498", "title_fa": "ScrollEd می خواهد کتاب های درسی را به TikTok تبدیل کند", "summary_fa": "ScrollEd کتاب‌های درسی را به یک فید قابل پیمایش و مانند اینستاگرام با ویدیو، صدا و آزمون‌ها تبدیل می‌کند. استارت‌آپ پالو آلتو که توسط دانش‌آموزان (و همسرانشان) اوتساو گوپتا و ربکا نف تأسیس شد، در TechCrunch Disrupt شرکت می‌کند. جامعه زمان زیادی را صرف نارضایتی از ذهن‌های اضافه شده دیجیتالی و گستره‌های توجه ماهی قرمز ما کرده است، و انگشت سرزنش را بر سر قیامت نشانه می‌رود که دلیل آن این است که ما نمی‌توانیم فقط بنشینیم و کتاب بخوانیم یا برای امتحان مطالعه کنیم. اما اگر راه حل متوقف کردن پیمایش نباشد، بلکه بازاندیشی در مورد آنچه در حال پیمایش هستیم، چه می شود؟ این همان شرط بندی است که ScrollEd در حال انجام آن است. استارت‌آپ مبتنی بر پالو آلتو در رقابت TechCrunch Disrupt Startup Battlefield 200 با این ایده جدید شرکت می‌کند که اگر دانش‌آموزان موفق به باز کردن کتاب درسی نشدند، کتاب درسی باید خودش را به روی آنها باز کند - به عنوان یک طومار. ScrollEd اپلیکیشنی ساخته است که به کاربر این امکان را می‌دهد تا هر فایل متنی - از جمله PDF خشک یا کتاب‌های متنی - را به فید تبدیل کند که بسیار شبیه به حلقه‌های اینستاگرام یا TikTok است. همانطور که پیمایش می کنید، محتوا به صورت ویدئو، صدا، متن یا حتی آزمون های تعاملی ایجاد شده توسط هوش مصنوعی نشان داده می شود. کشیدن به سمت بالا موضوع جدیدی را نشان می‌دهد، در حالی که کشیدن انگشت به طرفین به شما امکان می‌دهد به موضوعی که روی آن هستید عمیق‌تر بروید و در پایان یک مسابقه در انتظار شماست. اوتساو گوپتا، یکی از بنیانگذاران ScrollEd در ایمیلی به TechCrunch گفت: «نسل جوان به طور فزاینده‌ای به شکل کوتاه، فقط تغذیه عمودی (به ویژه جوانان 18 ساله‌ای که با آنها صحبت کرده‌ایم!) پیش می‌رود، و این چالش‌هایی را برای هر نوع"}, {"source": "NYT Tech", "title": "This A.I. House Can Provide You With Connections. It Also Has a Dark Side.", "link": "https://www.nytimes.com/2026/09/21/technology/agi-house-ai-culture.html", "summary": "Group tech houses have proliferated across the San Francisco Bay Area in the artificial intelligence boom. One of the most prominent has also racked up an extensive police record.", "date_str": "2026-09-21T11:01:14+00:00", "hash": "e125044cc008013a", "title_fa": "این A.I. خانه می تواند اتصالات را برای شما فراهم کند. همچنین دارای یک سمت تاریک است.", "summary_fa": "در رونق هوش مصنوعی، خانه‌های فناوری گروه در سراسر منطقه خلیج سانفرانسیسکو تکثیر شده‌اند. یکی از برجسته ترین آنها نیز سابقه گسترده پلیس را به دست آورده است."}, {"source": "The Guardian AI", "title": "Nvidia boss says there is ‘0% chance’ AI destroys the world by 2030", "link": "https://www.theguardian.com/technology/2026/sep/21/nvidia-boss-jensen-huang-dismisses-warnings-ai-destroys-world-anthropic", "summary": "Jensen Huang dismisses warnings from former Anthropic researcher and others as ‘doomsday narratives’ Business live – latest updates The boss of the chipmaker Nvidia has said AI will not develop to a point that will lead to the extinction of the human race within a few years, rejecting such assertions as overblown “doomsday narratives”. Jensen Huang, the co-founder and chief executive of the $5tn AI chipmaker, said the claims made on social media by the former Anthropic researcher Jacob Coxon that AI could become “superhuman” and kill off humanity within the decade were “irresponsible”. Continue reading...", "date_str": "2026-09-21T10:31:47+00:00", "hash": "79147925642e7c50", "title_fa": "رئیس انویدیا می‌گوید «0 درصد احتمال دارد» هوش مصنوعی جهان را تا سال 2030 نابود کند", "summary_fa": "جنسن هوانگ هشدارهای محقق سابق Anthropic و دیگران را به‌عنوان «روایت‌های روز قیامت» به‌صورت زنده رد می‌کند – آخرین به‌روزرسانی‌ها رئیس تراشه‌ساز انویدیا، با رد ادعاهایی به‌عنوان «روایت‌های روز قیامت»، گفته است که هوش مصنوعی به حدی توسعه نمی‌یابد که منجر به انقراض نسل بشر شود. جنسن هوانگ، یکی از بنیانگذاران و مدیر اجرایی سازنده تراشه‌های هوش مصنوعی 5 تریلیون دلاری، گفت: ادعاهای مطرح شده در رسانه‌های اجتماعی توسط محقق سابق آنتروپیک، جاکوب کوکسون، مبنی بر اینکه هوش مصنوعی می‌تواند «فوق بشر» شود و بشریت را در طول یک دهه از بین ببرد، «غیر مسئولانه» است. به خواندن ادامه دهید... هوانگ در مصاحبه با CBS News گفت: \"2030 پایان جهان نخواهد بود. 0٪ احتمال وجود دارد که پایان جهان باشد.\" ترساندن مردم غیر ضروری است. غیرمسئولانه است.» اظهارات کاکسون، که توسط دو محقق دیگر در سازنده سیستم هوش مصنوعی کلود حمایت شد، بحثی بین‌المللی را در مورد خطرات و عدم نظارت بر هوش مصنوعی در حالی که شرکت‌ها برای توسعه مدل‌های قدرتمندتر رقابت می‌کنند، برانگیخت. قانونگذاران آمریکایی از شرکت‌های هوش مصنوعی به دلیل خطرات آنها انتقاد کرده‌اند و Anthropic یک گزارش اطلاعاتی تهدید منتشر کرد که در آن جزئیات نحوه استفاده از مدل‌های قدرتمند هوش مصنوعی توسط مجرمان، گروه‌های تحت حمایت دولت، فروشندگان نرم‌افزارهای جاسوسی، دانشمندان و مبلغان برای طراحی موشک‌ها و بمب‌ها، ایجاد پاتوژن‌های مرگبار و جاسوسی از مخالفان منتشر شد. داریو آمودی، مدیر اجرایی Anthropic، سام آلتمن، رئیس OpenAI سازنده ChatGPT و ایلان ماسک خواستار کاهش سرعت توسعه این فناوری شده‌اند. با این حال، دونالد ترامپ نگرانی در مورد توسعه هوش مصنوعی را به عنوان یک \"فریب\" و \"توطئه\" رد کرده و افزوده است که کاهش سرعت می تواند به چین برتری دهد."}, {"source": "The Guardian AI", "title": "More Australians will be dying than being born in 40 years as major report predicts future of lower growth", "link": "https://www.theguardian.com/australia-news/2026/sep/21/jim-chalmers-intergenerational-report-2026-deaths-outnumber-births-australia2060s", "summary": "Seventh intergenerational report also outlines how Australia is on the brink of an uncertain age of artificial intelligence Follow our Australia news live blog for latest updates Get our new political email , free app or daily news podcast There will be more Australians dying than being born in 40 years’ time, according to the government’s latest intergenerational report, which lays bare the fundamental challenges of managing an ageing population at a time of rapid change and lower economic growth. The country’s seventh IGR also outlines how Australia is on the brink of a new and uncertain age of artificial intelligence that will shape the economy and society over the coming four decades. Continue reading...", "date_str": "2026-09-21T02:30:32+00:00", "hash": "9d1dc2d78c2a3f56", "title_fa": "در 40 سال آینده تعداد بیشتری از استرالیایی‌هایی که به دنیا می‌آیند می‌میرند، زیرا گزارش اصلی آینده رشد کمتری را پیش‌بینی می‌کند", "summary_fa": "هفتمین گزارش بین نسلی همچنین نشان می‌دهد که استرالیا چگونه در آستانه عصر نامشخص هوش مصنوعی قرار دارد برای آخرین به‌روزرسانی‌ها وبلاگ اخبار استرالیا را دنبال کنید، ایمیل سیاسی جدید، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید، طبق آخرین گزارش بین‌نسلی دولت، که چالش‌های اساسی پیری جمعیت در زمان کاهش رشد اقتصادی را آشکار می‌کند. هفتمین IGR این کشور همچنین نشان می دهد که استرالیا چگونه در آستانه عصر جدید و نامشخصی از هوش مصنوعی است که اقتصاد و جامعه را در چهار دهه آینده شکل خواهد داد. به خواندن ادامه دهید... جیم چالمرز، در سخنرانی در دانشگاه ملی استرالیا همزمان با انتشار این تحلیل، گفت: «این گزارش بین نسلی راه پیش رو را روشن می کند». خزانه‌دار گفت: \"هیچ IGR قبلی با چالش‌های جهانی به این بزرگی، با سیاست‌های پرمشغله یا آینده کمتر قطعی مقابله نکرده است. خطرات جهانی و نسلی جدی هستند، اما فرصت‌های استرالیا بی‌پایان است.\" آخرین پیش‌بینی‌های 40 ساله نشان می‌دهد که با داشتن فرزندان کمتر، جمعیت همچنان پیرتر خواهد شد، تا جایی که کاهش نرخ باروری به این معناست که برای اولین بار پیش‌بینی می‌شود که تعداد مرگ و میرها تا دهه 2060 از تعداد تولدها بیشتر شود. این گزارش می‌گوید: «این نقطه عطفی است که بسیاری از اقتصادهای پیشرفته از جمله ژاپن، آلمان، ایتالیا و جمهوری کره از آن پیشی گرفته‌اند و انتظار می‌رود که اکثر کشورهای دیگر در دهه‌های آینده این کار را انجام دهند». با رشد 0.9 درصدی جمعیت برای آینده قابل پیش‌بینی، در مقابل 1.4 درصد از نظر تاریخی، در کنار کاهش سهم استرالیایی‌های شاغل برای حمایت از فعالیت‌ها و بودجه، IGR پیش‌بینی می‌کند که اقتصاد وارد یک نرمال جدید با رشد پایین‌تر شده است."}, {"source": "The Guardian AI", "title": "Can Trump and Xi cooperate to guide humanity through the AI revolution? Humanity might depend on it | Alan Finkel", "link": "https://www.theguardian.com/commentisfree/2026/sep/21/can-trump-and-xi-cooperate-to-guide-humanity-through-the-ai-revolution-humanity-might-depend-on-it", "summary": "The CEOs of tech firms issue stark warnings over the rate of change, with AI capability doubling every four months Recently, Jacob Coxon, a researcher at Anthropic, quit his job over concerns that AI was on a collision course with humanity. A flurry of headlines put the spotlight on the current crisis: unregulated competition between technology companies and between the US and China is putting our global infrastructure at risk at the very least, and threatening human existence at worst. One’s mind fills with pictures of robot armies or systematic blackmail. Continue reading...", "date_str": "2026-09-20T22:00:26+00:00", "hash": "c92229143de1b43b", "title_fa": "آیا ترامپ و شی می توانند برای هدایت بشریت از طریق انقلاب هوش مصنوعی همکاری کنند؟ بشریت ممکن است به آن وابسته باشد | آلن فینکل", "summary_fa": "مدیران عامل شرکت‌های فناوری هشدارهای جدی در مورد میزان تغییرات صادر می‌کنند و توانایی هوش مصنوعی هر چهار ماه یکبار دو برابر می‌شود. اخیراً، جاکوب کوکسون، محقق در Anthropic، به دلیل نگرانی از اینکه هوش مصنوعی در مسیر برخورد با بشریت قرار دارد، کار خود را ترک کرد. انبوهی از سرفصل‌ها کانون توجه را بر بحران کنونی نشان می‌دهد: رقابت غیرقانونی بین شرکت‌های فناوری و بین ایالات متحده و چین، زیرساخت‌های جهانی ما را حداقل در معرض خطر قرار می‌دهد و در بدترین حالت موجودیت انسان را تهدید می‌کند. ذهن فرد پر از تصاویر ارتش ربات ها یا باج گیری سیستماتیک می شود. به خواندن ادامه دهید... اخیراً، جیکوب کوکسون، محقق در Anthropic، به دلیل نگرانی از اینکه هوش مصنوعی در مسیر برخورد با بشریت قرار دارد، کار خود را ترک کرد. انبوهی از سرفصل‌ها کانون توجه را بر بحران کنونی نشان می‌دهد: رقابت غیرقانونی بین شرکت‌های فناوری و بین ایالات متحده و چین، زیرساخت‌های جهانی ما را حداقل در معرض خطر قرار می‌دهد و در بدترین حالت موجودیت انسان را تهدید می‌کند. با روحیه ای که هرگز اجازه ندهیم یک بحران خوب از بین برود، با نشست این هفته بین رئیس جمهور ایالات متحده، دونالد ترامپ، و رئیس جمهور چین، شی جین پینگ، فرصت مهمی پیش خواهد آمد. هوش مصنوعی همه جا هست. این قدرتمند است و به ما کمک می کند تا سفر خود را برنامه ریزی کنیم، کلاس های بدنسازی خود را رزرو کنیم و غذای آماده سفارش دهیم، در حالی که در سطح سازمانی کارایی مشاغل و بوروکراسی ها را افزایش می دهد. در دانشگاه، پیشرفت های خیره کننده ای در ریاضیات ارائه می کند که برای چندین دهه از بهترین ریاضیدانان نظری دور مانده است. به این معنا که هوش مصنوعی به طور گسترده در دسترس است و می تواند کارهای خوبی انجام دهد، مانند"}, {"source": "The Guardian AI", "title": "Ella Baron on our evolving relationship with AI – cartoon", "link": "https://www.theguardian.com/commentisfree/picture/2026/sep/20/ella-baron-relationship-with-ai-human-technology-cartoon", "summary": "Continue reading...", "date_str": "2026-09-20T17:11:53+00:00", "hash": "aa802ed75756f8b7", "title_fa": "الا بارون در مورد رابطه در حال تکامل ما با هوش مصنوعی - کارتون", "summary_fa": "ادامه مطلب..."}, {"source": "The Guardian AI", "title": "The Guardian view on AI v mathematicians: humans are still vital to the field, but tech firms refuse to see that | Editorial", "link": "https://www.theguardian.com/commentisfree/2026/sep/20/the-guardian-view-on-ai-v-mathematicians-humans-are-still-vital-to-the-field-but-tech-firms-refuse-to-see-that", "summary": "OpenAI claims its agents have solved the Navier-Stokes problem. But questions remain about how useful and independent its work really is On 8 September, OpenAI claimed that its AI agents had solved the Navier-Stokes problem, one of the most famous and difficult challenges in mathematics. Had a human solved it, they would have collected both prize money and plaudits from their fellows. The announcement instead ignited what some mathematicians have called an “ existential crisis ” in their field over the power of AI, and accusations that OpenAI misused human work . The maths behind Navier-Stokes is difficult to understand, but the critiques levelled by mathematicians will be familiar to artists, office workers, or anyone else concerned about AI. OpenAI’s results, like any arising from a large language model, depend on digesting work by human mathematicians. The OpenAI paper cites sources, but many believe the company didn’t give sufficient credit, especially to several mathematicians believed to be very close to a solution – bad form that erases human ingenuity and hogs all the glory. The mathematician Tristan Buckmaster also has concerns that work he was doing on Navier-Stokes using OpenAI’s Codex model was seen by the OpenAI team. OpenAI has denied directly accessing this material, but could not rule out that data from Buckmaster’s use of their products “helped improve our model”. Continue reading...", "date_str": "2026-09-20T16:58:03+00:00", "hash": "21c506e16d0bc0f8", "title_fa": "دیدگاه گاردین در مورد هوش مصنوعی در مقابل ریاضیدانان: انسان ها هنوز برای این رشته حیاتی هستند، اما شرکت های فناوری از دیدن آن امتناع می ورزند | سرمقاله", "summary_fa": "OpenAI ادعا می کند که عوامل آن مشکل Navier-Stokes را حل کرده اند. اما سؤالاتی در مورد اینکه واقعاً کارش چقدر مفید و مستقل است باقی می‌ماند در 8 سپتامبر، OpenAI ادعا کرد که عوامل هوش مصنوعی آن مشکل ناویر-استوکس، یکی از معروف‌ترین و دشوارترین چالش‌ها در ریاضیات را حل کرده‌اند. اگر یک انسان آن را حل می کرد، آنها هم پول جایزه و هم تقدیر از همنوعان خود را جمع آوری می کردند. این اعلامیه در عوض باعث شعله‌ور شدن چیزی شد که برخی از ریاضی‌دانان آن را «بحران وجودی» در حوزه خود بر سر قدرت هوش مصنوعی می‌نامند و اتهاماتی مبنی بر سوء استفاده OpenAI از کار انسانی. درک ریاضیات پشت Navier-Stokes دشوار است، اما نقدهایی که توسط ریاضیدانان مطرح می شود برای هنرمندان، کارمندان اداری یا هرکس دیگری که نگران هوش مصنوعی است آشنا خواهد بود. نتایج OpenAI، مانند نتایج حاصل از یک مدل زبان بزرگ، به هضم کار ریاضیدانان انسانی بستگی دارد. مقاله OpenAI به منابع استناد می کند، اما بسیاری معتقدند که این شرکت اعتبار کافی را اعطا نکرده است، به ویژه به چندین ریاضیدان که اعتقاد بر این است که به یک راه حل بسیار نزدیک هستند - شکل بدی که نبوغ انسان را از بین می برد و تمام شکوه را به خود جلب می کند. تریستان باک مستر، ریاضیدان، همچنین نگرانی دارد که کاری که روی ناویر استوکس با استفاده از مدل OpenAI's Codex انجام می‌داد، توسط تیم OpenAI دیده شده است. OpenAI دسترسی مستقیم به این مطالب را رد کرده است، اما نمی تواند رد کند که داده های استفاده Buckmaster از محصولات آنها \"به بهبود مدل ما کمک کرده است\". به خواندن ادامه دهید... در 8 سپتامبر، OpenAI ادعا کرد که عوامل هوش مصنوعی آن مشکل ناویر-استوکس، یکی از معروف ترین و دشوارترین چالش های ریاضیات را حل کرده اند."}, {"source": "The Guardian AI", "title": "‘An out-of-touch Silicon Valley radical’: meet Trump’s AI whisperer pushing for limited regulation", "link": "https://www.theguardian.com/us-news/2026/sep/20/david-sacks-trump-ai-czar", "summary": "David Sacks convinced Trump against any restrictions on AI – putting the White House out of step with its own party As lawmakers from both sides of the aisle in the US have joined together calling for the regulation of powerful artificial intelligence models, one of the few vocal naysayers has been Donald Trump . He’s called the perceived dangers of the technology a “hoax” and a “scam”, arguing that the government already has “tremendous CRIMINAL and REGULATORY power over these companies”. It’s a starkly different stance from those of his former adviser Steve Bannon , the Republican Texas senator Ted Cruz and even the heads of the world’s leading AI companies. But it’s directly in line with the opinion of David Sacks – a prominent billionaire venture capitalist and Trump’s onetime AI and crypto czar, who has pushed back publicly and forcefully against recent claims of an impending AI apocalypse. Continue reading...", "date_str": "2026-09-20T16:44:54+00:00", "hash": "692df19fe2945a03", "title_fa": "\"یک رادیکال غیر قابل لمس سیلیکون ولی\": با زمزمه کننده هوش مصنوعی ترامپ که برای مقررات محدود فشار می آورد ملاقات کنید", "summary_fa": "دیوید ساکس ترامپ را در برابر هرگونه محدودیتی برای هوش مصنوعی متقاعد کرد - کنار گذاشتن کاخ سفید با حزب خود در حالی که قانونگذاران از هر دو طرف در ایالات متحده با هم متحد شده اند و خواستار تنظیم مدل های قدرتمند هوش مصنوعی شده اند، یکی از معدود مخالفان پر سر و صدا دونالد ترامپ بوده است. او خطرات محسوس این فناوری را یک «فریب» و «کلاهبرداری» نامید و استدلال کرد که دولت در حال حاضر «قدرت کیفری و نظارتی فوق‌العاده‌ای بر این شرکت‌ها دارد». این موضع کاملاً متفاوت از موضع استیو بنن، مشاور سابق او، تد کروز، سناتور جمهوری‌خواه تگزاس و حتی روسای شرکت‌های برجسته هوش مصنوعی در جهان است. اما این به طور مستقیم با نظر دیوید ساکس - یک میلیاردر برجسته سرمایه‌گذاری ریسک‌پذیر و تزار سابق هوش مصنوعی و ارزهای دیجیتال ترامپ، مطابقت دارد، که به طور علنی و قاطعانه از ادعاهای اخیر درباره یک آخرالزمان هوش مصنوعی عقب نشینی کرده است. ادامه مطلب... ساکس، که معتقد است مقررات، پیشتازی ایالات متحده را در رقابت جهانی هوش مصنوعی از بین می برد، به عنوان زمزمه کننده هوش مصنوعی ترامپ - مشاوری که بیشترین نفوذ را در کاخ سفید در این موضوع دارد، دیده می شود. او بارها و بارها به رئیس‌جمهور توصیه کرده است که به مقررات هوش مصنوعی نگاهی نرم بدهد و به اجرای دستورات اجرایی و سایر اقدامات با هدف کاهش محدودیت‌ها در این فناوری کمک کند. او همچنین دارای سهام مستقیم مالی در چندین شرکت هوش مصنوعی است. روز جمعه، بیش از 100 محقق، استاد و فن‌شناس هوش مصنوعی نامه‌ای را امضا کردند که در آن خواستار ارزیابی شخص ثالث مدل‌های هوش مصنوعی و تشریح چگونگی انجام این کار شدند. امضاکنندگان شامل برخی از برجسته ترین متخصصان در این زمینه، مانند جفری هینتون، \"پدرخوانده هوش مصنوعی\" و استوارت راسل، دانشمند مشهور کامپیوتر"}, {"source": "Medium AI", "title": "My Agents Agreed on Everything Except What Happened (1/5)", "link": "https://medium.com/@nuno.roberto/my-agents-agreed-on-everything-except-what-happened-1-5-c2f71bf2f949?source=rss------artificial_intelligence-5", "summary": "Responsible AI was built for one model and one reviewer. My pipeline had neither. Continue reading on Medium »", "date_str": "2026-09-21T14:16:01+00:00", "hash": "cf6d2a09c4db607a", "title_fa": "عوامل من در مورد همه چیز توافق کردند به جز آنچه اتفاق افتاد (1/5)", "summary_fa": "هوش مصنوعی مسئول برای یک مدل و یک بازبین ساخته شده است. خط لوله من هیچ کدام را نداشت. ادامه مطلب در Medium »"}, {"source": "Medium AI", "title": "AI di Ruang Kelas: Antara Berkah dan Dilema — Perspektif SMK hingga Kampus", "link": "https://medium.com/@daffayrr/ai-di-ruang-kelas-antara-berkah-dan-dilema-perspektif-smk-hingga-kampus-253ba965f918?source=rss------artificial_intelligence-5", "summary": "Ketika siswa lebih cepat tanya ke ChatGPT daripada angkat tangan di kelas, ada yang perlu kita renungkan. Continue reading on Medium »", "date_str": "2026-09-21T14:14:48+00:00", "hash": "3a5f6824424a566f", "title_fa": "هوش مصنوعی در کلاس درس: بین برکات و معضلات - دیدگاه های مدرسه حرفه ای تا پردیس", "summary_fa": "وقتی دانش‌آموزان در ChatGPT سریع‌تر از بالا بردن دستان خود در کلاس سؤال می‌پرسند، باید به چیزی فکر کنیم. ادامه مطلب در Medium »"}, {"source": "Medium AI", "title": "How AI Video Ads Are Transforming Business Marketing in 2026", "link": "https://medium.com/@digitalmarketingonpage/how-ai-video-ads-are-transforming-business-marketing-in-2026-3a42bd89939e?source=rss------artificial_intelligence-5", "summary": "In today&#x2019;s fast-changing digital world, bus _fa": "بازگشت به مقالات a]:hidden\"> Pruning LLMs Like a Physicist: حذف بلوک به عنوان یک تیم مشکل بهینه سازی Ising مقاله منتشر شده در 21 سپتامبر 2026 رأی مثبت 5 Antonio Tiene AntonioTN MultiverseComputingCAI را دنبال کنید علی هاشمی علی هاشمی دنبال MultiverseComputingCAI دنبال کنید. MultiverseComputingCAI :last-child]:mb-0\"> یکی از ارزان‌ترین راه‌ها برای سریع‌تر کردن یک مدل زبان بزرگ، یکی از صریح‌ترین آنها نیز هست: حذف کل بلوک‌های ترانسفورماتور. از آنجایی که مدل به معنای واقعی کلمه کوتاه‌تر می‌شود، حذف بلوک (که هرس عمقی نیز نامیده می‌شود) افزایش سرعت استنتاج قابل پیش‌بینی را در بالای ذخیره‌سازی حافظه خریداری می‌کند و با کوانتیزاسیون، فشرده‌سازی با رتبه پایین و تکنیک‌های دیگر به‌طور تمیز روی هم قرار می‌گیرد. قسمت سخت این است که تصمیم بگیرید کدام بلوک ها را برش دهید. موارد اشتباه را حذف کنید و مدل از بین می رود. و تأثیر حذف هر یک از بلوک‌ها بستگی به این دارد که کدام بلوک را در کنار آن حذف کنید، بنابراین انتخاب‌ها با هم تعامل دارند. این مسئله آن را به یک مسئله ترکیبی تبدیل می‌کند، نه یک مشکل رتبه‌بندی، و مشکلات ترکیبی با متغیرهای باینری در حال تعامل دقیقاً همان چیزی است که فیزیک سیستم‌های اسپین برای توصیف آن ساخته شده است. آخرین مقاله ما، فشرده سازی LLM با حذف بلوک با بهینه سازی باینری محدود، این مکاتبات را به معنای واقعی کلمه دریافت می کند. ما انتخاب بلوک را به عنوان یک مسئله بهینه‌سازی باینری محدود (CBO) که مستقیماً روی یک شیشه Ising، یک سیستم چرخش نامنظم با فعل و انفعالات همه‌جانبه و تعداد ثابتی از چرخش‌های «بالا» نقشه می‌گیرد، دوباره فرموله می‌کنیم. انرژی آن سیستم اسپین به عنوان یک پروکسی قوی و ارزان برای نشان دادن اینکه مدل هرس شده واقعاً در معیارها امتیاز می‌گیرد است، به این معنی که می‌توانیم تعداد زیادی از پیکربندی‌های کاندید را بدون محک زدن"}, {"source": "HuggingFace Blog", "title": "tokenizers v1: encode, decode and scaling, measured", "link": "https://huggingface.co/blog/tokenizers-v1", "summary": "", "date_str": "2026-09-21T00:00:00+00:00", "hash": "340071e9a5c87d2b", "title_fa": "tokenizers v1: رمزگذاری، رمزگشایی و مقیاس بندی، اندازه گیری شده است", "summary_fa": "بازگشت به مقالات a]:hidden\"> tokenizers v1: رمزگذاری، رمزگشایی و مقیاس‌بندی، اندازه‌گیری شده منتشر شده در 21 سپتامبر 2026 به‌روزرسانی در GitHub رای مثبت 9 +3 آرتور زوکر آرتورZ Simon Brandeis sbrandeis را دنبال کنید Luc Georges mcpotato را دنبال کنید Lysandrelastni Follow0: از لحاظ تاریخی گلوگاه در جریان کار ML نبوده است. از نظر محاسباتی، توکن‌سازی در مقایسه با مدل‌سازی سنگینی که در بقیه خطوط لوله انجام می‌شود، سبک است. با این حال، در برخی موارد، به سرعت به کلیدی برای تسریع (یا کاهش سرعت) کار یادگیری ماشین شما تبدیل شده است. با سریع‌تر شدن مدل‌ها و افزایش حجم کار، این تعادل شروع به تغییر می‌کند. آموزش بر روی مجموعه داده های عظیم، ارائه درخواست های همزمان متعدد، یا پردازش مکرر ورودی های طولانی می تواند فشار کافی بر توکنایزر وارد کند که مدل داده ها را از بین ببرد. به همین دلیل است که ما تصمیم گرفته‌ایم تا به شدت روی عملکرد نسخه 1 بعدی توکن سازها تمرکز کنیم. توکن سازی باید سبک باشد و با گردش کار شما مقیاس شود. پردازنده‌های گرافیکی شما هرگز نباید بیکار بنشینند و منتظر بمانند تا CPU Tokenization خود را کامل کند. در این مقاله، ما به آنچه که v1 را سریع‌تر از v0.23 می‌کند، اغلب ده‌ها برابر نگاه می‌کنیم. این کار به لطف بقیه اکوسیستم کاملاً ممکن شد. Tokenization یک حوزه بسیار فعال از کار منبع باز است، و کتابخانه هایی مانند gigatoken، tiktoken، kitoken، tokie، fastokens، wordchipper و ai-tokenizer، و همچنین بسیاری دیگر، هر کدام به این موضوع پرداخته اند که یک توکنایزر سریع می تواند باشد. ما آن کار را خواندیم و چندین ایده زیر به دست ما رسید زیرا پروژه دیگری نشان داد ارزش امتحان کردن را دارند. قبل از این ریفاکتور، توکنایزرها به هیچ وجه به عملکردی که می‌توانست داشتند نزدیک نبود، بنابراین مشارکت در آن شاید ارزشش"}, {"source": "The Verge", "title": "Can John Ternus find Apple’s next big thing?", "link": "https://www.theverge.com/podcast/996874/apple-john-ternus-tim-cook-mark-gurman-future-ai-siri-iphone", "summary": "Today, I’m talking with Mark Gurman, who is the world’s best-sourced Apple reporter — both as Bloomberg ’s chief Apple correspondent and the host of the upcoming podcast Power On . Earlier this month, Apple hosted its annual iPhone hardware event, virtually every detail of which was reported ahead of time by Mark. But this event was special, for a number of reasons. It was new Apple CEO John Ternus’ first major product launch since he took over for former CEO Tim Cook less than two weeks prior. It was also the debut of the iPhone Duo, Apple’s first foldable smartphone. The timing of those two things was not at all coincidental, as you’ll hear Mark explain. Apple takes these hardware events — and the stories they tell — extremely seriously. This year’s story actually says a great deal about what’s happening at Apple, how Cook managed in wholesale leadership ranks over the past year, and how all of that might change Apple’s culture. Furthermore, what all that tells about Ternus’ plan to navigate Apple from what you might call the iPhone era into the AI era. Okay: Bloomberg ’s Mark Gurman on the future of Apple. Here we go. This interview has been lightly edited for length and clarity. Mark Gurman, you re the chief Apple correspondent and the managing editor of consumer technology at Bloomberg . Welcome to Decoder . Good to be here finally. Thanks for having me. And it s been a while, so it’s good to catch up on all things Apple. Yeah, I m really excited to talk to you. Obviously, Apple just had its big event. They announced the iPhone Duo. It was John Ternus s first event as CEO. This is a Decoder episode, so we’ve got a new CEO, and we’ve got a new org chart inside of Apple. There s been a lot of shuffling. You ve been chronicling them very, very deeply over the past few years. Let s just start with the event. I have a very basic question for you. Sure. Do you ever get nostalgic for a time when you didn t know what was going to happen at the iPhone event? Do I ever get nostalgic? Do you ever wish that you, Mark Gurman, were about to be surprised? Honestly, I never think about it that way. I m just fixated on delivering the g نالد ترامپ در انتخابات محافظت می‌کند. حامی این لایحه، نماینده دموکرات، مارک برمن، گفت که او این لایحه را پس از اینکه متوجه شد «در مورد قانون [موجود] و نحوه اجرای آن کمی ابهام وجود دارد، ارائه کرد». آخرین روز برای رزرو میز نمایشگاه، 18 سپتامبر است. سرنخ های پر تاثیر، دسترسی سرمایه گذاران، و کانون توجه برند در سالن نمایشگاه Disrupt را از دست ندهید. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید."}, {"source": "TechCrunch Main", "title": "TechCrunch Mobility: How do we know when an AV is safe enough?", "link": "https://techcrunch.com/2026/09/20/techcrunch-mobility-how-do-we-know-when-an-av-is-safe-enough/", "summary": "Welcome back to TechCrunch Mobility, your hub for the future of transportation and now, more than ever, the role AI is playing in it. To get this in your inbox, sign up here for free — just click TechCrunch Mobility!", "date_str": "2026-09-20T16:02:00+00:00", "hash": "158b7710d4415413", "title_fa": "TechCrunch Mobility: چگونه بفهمیم یک AV به اندازه کافی ایمن است؟", "summary_fa": "به TechCrunch Mobility، مرکز شما برای آینده حمل و نقل و اکنون، بیش از هر زمان دیگری، نقشی که هوش مصنوعی در آن ایفا می کند، خوش آمدید. برای دریافت آن در صندوق ورودی خود، در اینجا به صورت رایگان ثبت نام کنید - فقط روی TechCrunch Mobility کلیک کنید! یکی از مشکلات مهم برای توسعه دهندگان خودروهای خودران، رگولاتورها و عموم مردم، تعیین این است که چه زمانی فناوری خودران به اندازه کافی برای جاده ایمن است. تاکنون، این سوال تا حد زیادی بر عهده صنعت بوده است - شرکت‌هایی که از فناوری وسایل نقلیه خودران خود برای کامیون‌های خودران، ربات‌اکسی‌ها و شاید روزی خودروهای شخصی شخصی استفاده می‌کنند. امروزه هیچ آزمون استانداردی برای قضاوت در مورد عملکرد یک سیستم رانندگی خودکار در دنیای واقعی وجود ندارد. ما از مردم می‌خواهیم قبل از گرفتن گواهینامه، آزمون رانندگی را بگذرانند، اما آزمون یا سیستمی معادل برای فناوری خودروهای خودران وجود ندارد. بنابراین چگونه بفهمیم که آیا AV یک راننده ایمن است؟ اداره ملی ایمنی ترافیک بزرگراه می گوید که در حال کار بر روی پاسخ است. استانداردهای فدرال ایمنی وسایل نقلیه موتوری (FMVSS) در حال حاضر بر فروش خودروسازان امروزی حاکم است. اما این قوانین FMVSS برای وسایل نقلیه ای مانند تسلا سایبرکاب و رباتاکسی Zoox که فاقد تجهیزات سنتی و مورد نیاز فدرال هستند مانند پدال، فرمان و ویژگی های طراحی مانند آینه های جانبی و آینه های دید عقب طراحی نشده اند. NHTSA در حال کار بر روی یک چارچوب خودروی خودکار فدرال است که می‌گوید ایمنی را بدون خفه کردن نوآوری پایه‌گذاری می‌کند، یا همانطور که جاناتان موریسون مدیر این هفته بیان کرد، آژانس را مجبور می‌کند تا با تصمیم‌گیری‌های خط‌مشی «قطع خال» بازی کند یا سعی کند پیش‌بینی کند که فناوری چگونه تکامل خواهد یافت. این یک دستور العمل دشوار برای درست کردن است."}, {"source": "TechCrunch Main", "title": "A small but growing number of founders are betting on bringing people together offline", "link": "https://techcrunch.com/2026/09/20/a-small-but-growing-number-of-founders-are-betting-that-bringing-people-together-is-its-own-industry/", "summary": "On the surface, a game console and a leathercraft school don't appear to have much in common. But both founders think there's money in fostering the kind of connection that technology has eroded over the last couple of decades.", "date_str": "2026-09-20T15:00:00+00:00", "hash": "0d59d05bad3a6e58", "title_fa": "تعداد کمی از بنیانگذاران، اما در حال افزایش، روی گرد هم آوردن افراد به صورت آفلاین شرط بندی می کنند", "summary_fa": "در ظاهر، به نظر نمی رسد یک کنسول بازی و یک مدرسه چرم سازی وجه اشتراک زیادی داشته باشند. اما هر دو بنیان‌گذار فکر می‌کنند که برای تقویت ارتباطی که فناوری در چند دهه گذشته از بین رفته است، پول وجود دارد. برین پاتنام و تریستان واکر قبلاً کاری را انجام داده اند که اکثر بنیانگذاران فقط در مورد آن آرزو دارند: ایجاد شرکت هایی به قدری قانع کننده که لباس های بزرگتر آنها را خرید. پاتنام، یک بالرین آموزش دیده با زنجیره کوچکی از استودیوهای بوتیک، شرکت تناسب اندام میرور را ساخت و کمتر از سه سال بعد آن را به مبلغ 500 میلیون دلار به صورت نقد به لولولمون فروخت. واکر که در مدرسه بازرگانی استنفورد در توییتر کار k را نداشته باشید. فقط یک مدل زیر یک گرند وجود دارد و بقیه بسیار بالاتر از آن هستند. سخت‌افزار آشنا اکثر کروم‌بوک‌ها دستگاه‌های مقرون‌به‌صرفه بوده‌اند و به نظر می‌رسند. با این حال، گوگل بوک ها دارای صفحه نمایش های OLED روشن، ساختارهای فلزی، پدهای لمسی بزرگ و نوار گلو هستند. همه دستگاه‌ها این نوار روشن را روی درب دارند، اما فعلاً کار خاصی انجام نمی‌دهد. هنگامی که دستگاه بوت می شود روشن می شود و می تواند میزان باتری را نشان دهد، اما گوگل می گوید که قصد دارد یک API برای توسعه دهندگان منتشر کند تا ویژگی های بیشتری اضافه کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش Google آماده است تا دوباره لپ تاپ ها را تغییر دهد. این شرکت موفقیت های زیادی در زمینه گوشی ها داشته است، اما تلاش کرده است تا آن را به یک استراتژی موثر برای نمایشگرهای بزرگتر تبدیل کند. کروم‌بوک‌ها به‌عنوان"}, {"source": "Wired", "title": "Here’s the iFixit Repairability Rating for the iPhone 18 Pro", "link": "https://www.wired.com/story/ifixit-rating-for-the-iphone-18-pro-repairability/", "summary": "It’s actually pretty good for an iPhone, given Apple’s long-standing reticence to make its products repairable.", "date_str": "2026-09-21T14:15:09+00:00", "hash": "e1c66a8bb97825d1", "title_fa": "در اینجا رتبه تعمیر iFixit برای iPhone 18 Pro آمده است", "summary_fa": "این در واقع برای آیفون بسیار خوب است، با توجه به کوتاهی طولانی مدت اپل در تعمیر محصولاتش. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان iFixit، شرکتی که به دلیل پاره کردن کامل تقریباً هر محصول و دستگاهی که می تواند شناخته می شود، یک آیفون 18 پرو کاملاً جدید را جدا کرده است. هدف این است که بفهمیم همه قسمت‌ها چگونه با هم قرار می‌گیرند و راه‌هایی برای رفع هر چیزی که ممکن است خراب شود پیدا کنیم. در پست و ویدیوی تخریب این شرکت، iFixit نشان داد که چگونه آخرین آیفون را از هم جدا کرده است و افرادی که ممکن است روزی نیاز به تعمیر آیفون خود داشته باشند باید به چه نکاتی توجه کنند. این به آیفو r-perpared-meals-2026/", "summary": "Factor home-delivery meals have mastered the art of a juicy, medium-rare steak. But inconsistency is still an issue.", "date_str": "2026-09-21T09:37:00+00:00", "hash": "427c69eccfd00ab3", "title_fa": "بررسی وعده های غذایی تحویل فاکتور (2026): ماهی قزل آلا لطیف، اتاقی برای رشد", "summary_fa": "غذاهای تحویل در خانه فاکتور بر هنر یک استیک آبدار، متوسط ​​و کمیاب مسلط شده است. اما ناهماهنگی همچنان یک مسئله است. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان رتبه: 7/10 WIRED غذاهای آماده برای گرم کردن راحت، سریع و آسان آماده می شوند. هرگز منجمد نشد. به ویژه پروتئین ها به طرز شگفت انگیزی بافت خوبی دارند. می توان آن را در سرخ کن بادی آماده کرد تا تاثیر خوبی داشته باشد. مشاوره رایگان با متخصص تغذیه غذاهای خسته هنوز هم بیش از حد به مایکروویو وابسته هستند. وعده های غذایی گرم شده دارای محدودیت های ذاتی هستند، به خصوص در مورد بافت. بسیاری از وعده های غذایی برای طعم دادن به چربی و سدیم تکیه دارند. مانند بسیاری از کودکان ساحل غربی، من مشتاق ماهی قزل آلا تریاکی هستم - یک کلاسیک ژاپنی که به راحتی وارد منوی کلبه‌های بنتو کوچک و بامزه متعلق به موج‌سواران سابق به نام‌های دن یا دیو می‌شود. و بنابراین شاید من هدف اصلی یک غذای ماهی آزاد تریاکی و «برنج ممنوعه» از Factor، سرویس تحویل غذای آماده HelloFresh بودم. Factor غذاهای خود را به صورت تازه در یک آشپزخانه کمیساری آماده می کند و می پزد و سپس با جادوی بسته بندی جوی اصلاح شده، Factor این غذا را بدون انجماد از طریق پست ارسال می کند. تنها کاری که بعد از آن باید انجام دهم این است که آن را گرم کنم. چیزی که من را شگفت زده کرد این است که طعم ماهی سالمون حتی پس از گرم شدن مجدد چقدر خوب است. بعد از سرخ کردن غذا با سس در بالا، ماهی قزل آلا پوسته پوسته و ملایم، بدون لاستیک یا ماس باقی ماند. برنج آل دنته بود، کمی ترد. من تقریباً همه سرویس‌های تحویل وعده غذایی موجود را آزمایش کرده‌ام، و یکی"}, {"source": "Wired", "title": "After 8 Years in Space, ‘BepiColombo’ Is Finally Approaching Mercury", "link": "https://www.wired.com/story/after-8-years-in-space-bepicolombo-finally-approaching-mercury/", "summary": "Following a difficult journey, the probe will soon begin unravelling the mysteries of Mercury’s magnetic field and internal structure.", "date_str": "2026-09-21T09:00:00+00:00", "hash": "bb82b6839a60aad8", "title_fa": "پس از 8 سال در فضا، \"BepiColombo\" سرانجام به عطارد نزدیک شد", "summary_fa": "پس از یک سفر دشوار، کاوشگر به زودی کشف اسرار میدان مغناطیسی و ساختار درونی عطارد را آغاز خواهد کرد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان BepiColombo کمی در اودیسه بوده است. کاوشگر فضایی که به افتخار یک دانشمند ایتالیایی تحسین شده که ترفند «کمک گرانشی» را ابداع کرد که امروزه سفرهای بین سیاره‌ای را امکان‌پذیر می‌کند نامگذاری شده است، در ابتدا قرار بود سال گذشته به عطارد برسد. با این حال، پس از یک نقص در پیشرانه، کاوشگر مجبور به تغییر مسیر شد تا بتواند با قدرت کاهش یافته به عطارد برسد. در نتیجه، تاریخ رسیدن نزدیک به یک سال عقب افتاد و اکنون پس از هشت سال در فضا، BepiColombo شروع به فرود خود به مدار پایین به دور عطارد می کند. در 3 سپتامبر، کنترل زمینی تأیید کرد که ماژول پیشرانه با موفقیت از بقیه فضاپیما جدا شده است و مرحله نهایی ماموریت مشترک بین آژانس فضایی اروپا (ESA) و آژانس اکتشافات هوافضای ژاپن (JAXA) را نشان می‌دهد. پس از یک سفر پر دست انداز - رسیدن به بیش از 200 میلیون کیلومتر از زمین - انتقال از کاوشگر نشان داد که همه چیز به آرامی انجام شد. عطارد پیش از این تنها دو بار کاوش شده است، هر دو بار توسط کاوشگرهای ناسا. زیرا حتی بدون پیشرانه‌های ناگوار، رسیدن به عطارد به دلیل موقعیت نزدیک‌ترین سیاره به خورشید بسیار دشوار است. هنگام سفر به سمت مرکز منظومه شمسی، یک فضاپیما اساساً از زمین به سمت گرانش بسیار بیشتر خورشید \"سقوط\" می کند. این قسمت آسان است. قسمت سخت این است که به زمین نخورید. بنابراین رسیدن به عطارد نیاز به سوخت زیادی دارد، نه برای سفر به آنجا، بلکه برای درگیر کردن راکت‌ها برای قرار دادن وقفه‌ها."}, {"source": "The Next Web", "title": "The EU will rate data centres on energy and water from 2027", "link": "https://thenextweb.com/news/eu-data-centre-rating-scheme-energy-water", "summary": "Europe’s data centers are to be graded on how much energy and water they use, under a rating scheme proposed on Monday by the European Commission. Any individual site drawing more than 500 kW is covered. What the rating measures is not only consumption but what a data center puts back: heat recovered and reused, clean [ ] This story continues at The Next Web", "date_str": "2026-09-21T13:30:33+00:00", "hash": "5945e4e36e6f9d3b", "title_fa": "اتحادیه اروپا از سال 2027 به مراکز داده در زمینه انرژی و آب رتبه بندی می کند", "summary_fa": "براساس یک طرح رتبه بندی که روز دوشنبه توسط کمیسیون اروپا پیشنهاد شد، مراکز داده اروپا باید بر اساس میزان مصرف انرژی و آب درجه بندی شوند. هر سایت فردی که بیش از 500 کیلو وات مصرف کند تحت پوشش قرار می گیرد. آنچه که رتبه بندی می سنجد نه تنها مصرف است، بلکه آن چیزی است که مرکز داده پس می دهد: گرمای بازیابی و استفاده مجدد، تمیز [ ] این داستان در The Next Web ادامه دارد استدلال برای صرف زمان برای بازیابی گرما بر اساس یک رقم است: اگر حدود نیمی از گرمایی که مراکز داده اروپا در حال حاضر هدر می دهند بازیابی می شد، نیازهای گرمایشی چهار میلیون خانوار را برآورده می کرد. ترزا ریبرا، معاون اجرایی کمیسیون برای انتقال پاک، عادلانه و رقابتی، گفت: «سه برابر شدن ظرفیت مرکز داده ما نمی‌تواند به معنای سه برابر کردن فشار بر شبکه‌ها، صورت‌حساب‌های آب و انرژی ما باشد». سه برابر کردن صرفاً فرضی نیست. این طرح اعلام شده است: اتحادیه اروپا قصد دارد ظرف پنج تا هفت سال سه برابر ظرفیت فعلی خود را داشته باشد، هدفی که به عنوان یک موضوع استقلال تکنولوژیکی و نه به عنوان بخشی از یک سیاست انرژی تعیین می کند. در سال 2024، مراکز داده اروپایی حدود 68 تراوات ساعت برق مصرف کردند، و آژانس بین المللی انرژی پیش بینی کرده است که این میزان تا سال 2030 به دلیل هوش مصنوعی به 114 تراوات ساعت افزایش می یابد، که در آن زمان این بخش بیش از 3 درصد از کل برق مصرفی در منطقه را به خود اختصاص خواهد داد. این یک مقررات تفویض شده است و تعیین می کند که پس از آن چه اتفاقی می افتد. مجلس و شورا اکنون دو ماه فرصت دارند تا آن را بررسی کنند و اگرچه می توانند به کل آیین نامه"}, {"source": "The Next Web", "title": "A single git trick beat the safety lock on four AI coding agents", "link": "https://thenextweb.com/news/plugin4shell-ai-coding-agents-zero-click-rce-sha-pinning", "summary": "The AI industry already knew attackers could poison plugin marketplaces. Its answer was to lock every plugin to one reviewed version of its code. That lock is what just broke. Researchers at Air Security published a vulnerability on Thursday that they call Plugin4Shell. It affects the four most widely used AI coding agents. Those are [ ] This story continues at The Next Web", "date_str": "2026-09-21T12:53:24+00:00", "hash": "f25d421cf71375a8", "title_fa": "یک ترفند git تنها قفل ایمنی را در چهار عامل کدنویسی هوش مصنوعی شکست داد", "summary_fa": "صنعت هوش مصنوعی از قبل می دانست که مهاجمان می توانند بازارهای پلاگین را مسموم کنند. پاسخ آن قفل کردن هر افزونه به یک نسخه بازبینی شده از کد آن بود. آن قفل چیزی است که به تازگی شکسته است. محققان در Air Security روز پنجشنبه یک آسیب پذیری را منتشر کردند که آن را Plugin4Shell می نامند. این چهار عامل کدنویسی AI به طور گسترده مورد استفاده قرار می گیرد. اینها [ ] این داستان در The Next Web Anthropic ادامه می یابد که آن را در Claude Code 2.1.179 و OpenAI در Codex 0.146.0 ثابت کرده است. مایکروسافت هیچ مشکلی برای Copilot ارسال نکرده است. Google جمینی CLI را اصلاح نخواهد کرد، زیرا در حال بازنشستگی آن است. عوامل برنامه نویسی افزونه ها را از بازارها نصب می کنند. برای ایمن نگه داشتن این افزونه ها، یک بازار هر کدام را به یک هش commit پین می کند. این یک رشته 40 کاراکتری است که یک عکس فوری دقیق از کد را شناسایی می کند. یک بار عکس فوری را مرور کنید، آن را پین کنید و عامل باید همان کد ممیزی شده را برای همیشه اجرا کند. ایر متوجه شد که ماموران عکس فوری پین شده را می‌خواهند اما هرگز آنچه را که به دست آورده‌اند را بررسی نمی‌کنند. Git به یک شاخه اجازه می دهد تقریباً هر نامی را داشته باشد، از جمله رشته ای که دقیقاً شبیه هش commit است. وقتی نامی هم یک شاخه معتبر و هم یک شی معتبر است، git بی سر و صدا شاخه را ترجیح می دهد. بنابراین هر کسی که مخزن یک پلاگین را کنترل می‌کند می‌تواند شاخه‌ای به نام ه g in them. Settlement will occur in central bank money, routed through Pontes, the system the Eurosystem has built for trades running on distributed ledger technology. What the bank [ ] This story continues at The Next Web", "date_str": "2026-09-21T10:55:24+00:00", "hash": "939b7f7d3dbdd19e", "title_fa": "بانک مرکزی اروپا در اوراق بهادار نمادین سرمایه گذاری خواهد کرد و معاملات را با راه آهن جدید خود تسویه خواهد کرد", "summary_fa": "بانک مرکزی اروپا در حال آماده شدن برای سرمایه گذاری بخشی از پول خود در اوراق بهادار توکن شده، از ساخت لوله کشی برای بازارهای دارایی دیجیتال به خرید در آنها است. تسویه با پول بانک مرکزی انجام می شود که از طریق پونتس ارسال می شود، سیستمی که یوروسیستم برای معاملاتی که بر اساس فناوری دفتر کل توزیع شده ساخته شده است. آنچه بانک [ ] این داستان در وب بعدی ادامه دارد آنچه بانک قصد خرید آن را دارد از نظر ماهیت به اندازه کافی متعارف است: بدهی های یورویی صادر شده توسط دولت های مرکزی و منطقه ای در منطقه یورو، توسط آژانس های آنها و توسط نهادهای فراملی اروپایی. فقط لفافش نو هست این اطلاعیه بانک را متعهد به «بخش کوچکی» از پرتفوی بدون ضمیمه رقم می‌کند و جزئیات عملیاتی و زمان‌بندی را تا زمان انجام این کار به هیئت اجرایی واگذار می‌کند. این تصمیم در نظر گرفتن نحوه توسعه واقعی صدور توکن است، که راهی برای گفتن این است که اندازه برنامه به میزان خرید بستگی دارد. این پول از سبد سرمایه های خود بانک مرکزی اروپا می آید. این یک ابزار سیاست پولی نیست: این ظرفی است که بازده آن به پرداخت هزینه‌های جاری بانک کمک می‌کند، با نظارت جداگانه. بنابراین این مؤسسه به جای انجام عملیات بر روی اقتصاد منطقه یورو، درآمد خود را به خطر می اندازد، که چیزی کوچکتر از آن چیزی است که ممکن است به نظر برسد و همچنین دلیل اینکه اصلاً می تواند حرکت کند. بانک به جای تماشای بازارهای توکن شده از روی صندلی تنظیم‌کننده، می‌خواهد در یک چرخه سرمایه‌گذاری کامل کار کند، از اجرای معامله گرفته تا تسویه آن و اجرای سیستم‌ها و مدیریت موقعیت پس از آن. موسساتی که فقط بر یک بازار نظارت دارند، تمایل دارند تا دیرتر از آن مطلع شوند."}, {"source": "The Next Web", "title": "Ireland’s data watchdog has fined Google €403M over location data", "link": "https://thenextweb.com/news/google-dpc-403m-location-data-fine", "summary": "Google has been fined €403M, or about $463M, by Ireland’s Data Protection Commission over the way it handled users’ location data, in a case brought after several European consumer groups complained. It found breaches of lawfulness and fairness in the location data processed through Web App Activity and Location History, of transparency across those [ ] This story continues at The Next Web", "date_str": "2026-09-21T10:25:03+00:00", "hash": "d2d9fa243bba88f0", "title_fa": "سازمان دیده بان داده ایرلند گوگل را به دلیل داده های موقعیت مکانی 403 میلیون یورو جریمه کرده است", "summary_fa": "کمیسیون حفاظت از داده‌های ایرلند، گوگل را به دلیل نحوه رسیدگی به داده‌های موقعیت مکانی کاربران، 403 میلیون یورو یا حدود 463 میلیون دلار جریمه کرده است، پرونده‌ای که پس از شکایت چندین گروه مصرف‌کننده اروپایی مطرح شد. نقض قانونمندی و انصاف در داده‌های مکان پردازش شده از طریق فعالیت برنامه وب و سابقه موقعیت مکانی، شفافیت در بین آن‌ها مشاهده شد. گراهام دویل، معاون کمیسیون، می‌گوید: «در نتیجه شکست‌های گوگل در این زمینه، افراد می‌توانستند از موقعیت مکانی آنها برای تأثیرگذاری بر روی آنها با تبلیغات یا استنباط علایقشان غافل باشند.» پس از شکایت گروه های مصرف کننده اروپایی از جمله BEUC، کمیسیون به ابتکار خود در فوریه 2020، به عنوان مرجع نظارتی اصلی گوگل در اتحادیه اروپا، این تحقیق را آغاز کرد. این شکایات در نوامبر 2018 توسط گروه‌هایی در هفت کشور ثبت شد که بر اساس تحقیقات شورای مصرف‌کننده نروژ در مورد اینکه چگونه طراحی رابط Google افراد را به سمت ترک ردیابی سوق می‌دهد. یکی از سخنگویان گوگل به Irish Examiner گفت که این پرونده مربوط به \"سیاست های تاریخی است که از آن زمان به روز شده اند\" و به کنترل های حذف خودکار معرفی شده از سال 2019 اشاره می کند. این چهارمین جریمه بزرگی است که تنظیم کننده از زمان اجرایی شدن GDPR صادر کرده است، پس از 1.2 میلیارد یورویی که در سال 2023 به متا برای ارسال اطلاعات شخصی اروپایی ها به ایالات متحده تحمیل شد. مهم ترین اخبار فنی را هر هفته در صندوق ورودی خود دریافت تیم های سطح کاری جلسات را تا روز دوشنبه ادامه دادند. بسنت پس از آن به خبرنگاران گفت: حرکت از مبهم به شفافیت بیشتر بین قدرت های شماره 1 و شماره 2 هوش مصنوعی در جهان بسیار مهم است. او آن را به عنوان یک کانال ارتباطی به جای چیزی شبیه به"}, {"source": "MIT Tech Review", "title": "The Download: investigating deaths at the US border’s “virtual wall”", "link": "https://www.technologyreview.com/2026/09/21/1144834/the-download-investigating-deaths-at-the-us-borders-virtual-wall/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. The US spent billions on border surveillance. Why can’t it catch people before they die? When José Morales Bernal crossed the border into the US in April 2024, the day before his 32nd birthday, he was within range of three surveillance towers equipped with cameras and AI to automatically detect and track people. If the system worked as intended, Morales should have been apprehended. If he needed medical help, agents were trained to provide it. None of that happened. Instead, Morales died just 360 feet from the closest tower. It was local landfill workers, rather than Border Patrol, who first spotted him. An autopsy concluded that he had died of “environmental exposure.” A first-of-its-kind investigation by MIT Technology Review reveals that deaths like Morales’s are startlingly common. After mapping nearly 4,000 locations where human remains were found against information on nearly 600 surveillance towers, we discovered that a humanitarian crisis at the border has unfolded in view of the government’s own cameras. Read our full investigation into the deadly failings of the virtual wall . —James O Donnell and Eileen Guo Learn more: As part of our 15-month investigation, we created the first comprehensive map of deaths near US-Mexico border surveillance towers. Take a look at that map , and read about how we made it . The US government is about to spend another $1 billion to triple the virtual wall’s size, yet we found it has systemic flaws: broken towers, algorithms that failed to detect people and agents who simply did not respond to alerts. Here are four ideas for what Customs and Border Protection should do to rectify those failures. An analysis by the Times of San Diego found at least 138 cases since 2022 in which migrants’ remains were found within the nominal range of a nearby surveillance tower. A separate MIT Technology Review analysis estimated that more than half of those people were likely within a tower’s field of view. Gómez Hernández was one of them. Here’s her story, written by our partners at Times of San Diego . All of these stories are part of Dying on Camera , our new series investigating the failures of border surveillance technology and their human cost. The must-reads I’ve combed the internet to find you today’s most fun/important/scary/fascinating stories about technology. 1 An AI hallucination near", "date_str": "2026-09-21T12:20:00+00:00", "hash": "a60a026e6f8c9ffd", "title_fa": "دانلود: بررسی مرگ و میر در \"دیوار مجازی\" مرز ایالات متحده", "summary_fa": "هنگامی که خوزه مورالس برنال در آوریل 2024، یک روز قبل از تولد 32 سالگی خود، از مرز به ایالات متحده عبور کرد، او در محدوده سه برج مراقبت مجهز به دوربین و هوش مصنوعی برای شناسایی و ردیابی خودکار افراد قرار داشت. اگر سیستم طبق برنامه کار می کرد، مورالس باید دستگیر می شد. اگر او به کمک پزشکی نیاز داشت، ماموران برای ارائه آن آموزش می دیدند. هیچ کدام از آن اتفاق نیفتاد. در عوض، مورالس در فاصله 360 فوتی نزدیکترین برج درگذشت. این کارگران محل دفن زباله بودند و نه گشت مرزی که اولین بار او را دیدند. کالبد شکافی به این نتیجه رسید که او بر اثر \"معرض قرار گرفتن در معرض محیط زیست\" درگذشته است. اولین تحقیق در نوع خود توسط MIT Technology Review نشان می دهد که مرگ و میرهایی مانند مورالس به طرز شگفت انگیزی رایج است. پس از نقشه برداری از نزدیک به 4000 مکان که در آن بقایای انسان در برابر اطلاعات نزدیک به 600 برج مراقبت پیدا شد، متوجه شدیم که یک بحران انسانی در مرز با دید دوربین های خود دولت آشکار شده است. تحقیقات کامل ما را در مورد خرابی های مرگبار دیوار مجازی بخوانید. همه این داستان‌ها بخشی از Dying on Camera هستند، سری جدید ما که به بررسی شکست‌های فناوری نظارت بر مرزها و هزینه‌های انسانی آن می‌پردازد. من اینترنت را بررسی کردم تا سرگرم کننده ترین/مهم ترین/ترسناک/جذاب ترین داستان های امروز در مورد تکنولوژی را برای شما پیدا کنم. 1 یک توهم هوش مصنوعی تقریباً باعث آغاز عملیات نظامی ایالات متحده شد. ( سی ان ان ) + این حادثه در حالی رخ می دهد که پنتاگون استفاده از هوش مصنوعی را تسریع کرده است. (Ars Technica) + \"انسان ها در حلقه\" در جنگ هوش مصنوعی یک توهم است. ( بررسی فناوری MIT ) 2"}, {"source": "MIT Tech Review", "title": "How we made the first comprehensive map of deaths along the US border’s “virtual wall”", "link": "https://www.technologyreview.com/2026/09/21/1144161/border-towers-surveillance-methodology/", "summary": "Our 15-month investigation into death and surveillance along the US-Mexico border began with a simple question: Why did so many people die near government surveillance towers meant to help track and apprehend them? This story is part of Dying on Camera , a collaboration between MIT Technology Review and Times of San Diego . Journalists in both newsrooms spent the past year examining the failures of border surveillance technology and uncovering the stories of the people who die in the borderlands . To answer that question, we looked through thousands of pages of government documents, visited the border multiple times, and interviewed more than 45 people, including current and former White House advisors, presidential appointees, Border Patrol agents, medical examiners, sheriffs, humanitarian volunteers, and employees of tech companies. The result of our investigation is the first comprehensive map and analysis of deaths near border surveillance towers. Here’s how we built it, what decisions we made along the way, and what the data can and can’t tell us. Our data The investigation relied on knowing where migrants have died and where and when US Customs and Border Protection towers were installed. We analyzed cases dating back to 2015, allowing us to cover different border policies, presidential administrations, and tower technologies. Migrant deaths The US-Mexico border has been called the world’s deadliest land border, and Border Patrol estimates that more than 10,000 people have died during crossings since 2000—a figure that’s widely considered an undercount. But the amount of information available publicly on where and when these people died, and who they were, varies widely. Some remains are never discovered, and for those that are, there’s no national protocol for how the records are handled. We considered a case for further analysis if we could confirm three basic things: whether the person was believed to have been crossing the border, where the remains were found, and roughly when the person died. We created our dataset by merging existing ones that had been compiled and shared by other organizations, including No More Deaths, Humane Borders, and the Electronic Frontier Foundation, with new records we obtained ourselves from more than a dozen agencies. Public records requests in Texas Texas was the biggest missing link in most existing databases of migrant deaths. Unlike Arizona, it has no initiative to share records online, and unlike New Mexico, it", "date_str": "2026-09-21T12:00:00+00:00", "hash": "5f1bbdbf2519c333", "title_fa": "چگونه اولین نقشه جامع مرگ و میر در امتداد \"دیوار مجازی\" مرز ایالات متحده را تهیه کردیم", "summary_fa": "تحقیقات 15 ماهه ما در مورد مرگ و مراقبت در امتداد مرز ایالات متحده و مکزیک با یک سوال ساده آغاز شد: چرا تعداد زیادی از مردم در نزدیکی برج‌های نظارت دولتی جان خود را از دست دادند که برای کمک به ردیابی و دستگیری آنها بود؟ این داستان بخشی از Dying on Camera است که همکاری بین MIT Technology Review و Times of San Diego است. روزنامه نگاران در هر دو اتاق خبر سال گذشته را صرف بررسی شکست های فناوری نظارت بر مرزها و کشف داستان های افرادی کردند که در مناطق مرزی جان خود را از دست می دهند. برای پاسخ به این سوال، هزاران صفحه از اسناد دولتی را بررسی کردیم، چندین بار از مرز بازدید کردیم و با بیش از 45 نفر از جمله مشاوران فعلی و سابق کاخ سفید، منصوبین ریاست جمهوری، ماموران گشت مرزی، بازرسان پزشکی، کلانترها، داوطلبان بشردوستانه و کارمندان شرکت‌های فناوری مصاحبه کردیم. نتیجه بررسی ما اولین نقشه و تحلیل جامع مرگ و میر در نزدیکی برج های مراقبت مرزی است. در اینجا نحوه ساخت آن، تصمیماتی که در طول مسیر گرفتیم، و داده ها می توانند و نمی توانند به ما بگویند، آمده است. داده‌های ما این تحقیق به دانستن محل مرگ مهاجران و محل و زمان نصب برج‌های گمرک و حفاظت مرزی ایالات متحده متکی بود. ما موارد مربوط به سال 2015 را مورد تجزیه و تحلیل قرار دادیم که به ما امکان می دهد سیاست های مرزی مختلف، ادارات ریاست جمهوری و فناوری های برج را پوشش دهیم. مرگ و میر مهاجران مرز ایالات متحده و مکزیک مرگبارترین مرز زمینی جهان نامیده می شود و گشت مرزی تخمین می زند که از سال 2000 تاکنون بیش از 10000 نفر در هنگام عبور از مرزها جان خود را از دست داده اند - رقمی که به طور گسترده به"}, {"source": "MIT Tech Review", "title": "4 ways to address the failures we found along the US border’s “virtual wall”", "link": "https://www.technologyreview.com/2026/09/21/1144164/border-towers-surveillance-policy-recommendations/", "summary": "MIT Technology Review today published our investigation into how many people have died near the “virtual wall” of surveillance towers that the US government has installed along the US-Mexico border. We found cases of people who walked undetected through areas surveilled by advanced, AI-enabled towers and later died nearby, where their bodies remained unnoticed for weeks or months. These cases reflect systemic flaws in the virtual wall: broken towers, algorithms that failed to detect people, and agents who simply did not respond to alerts. This story is part of Dying on Camera , a collaboration between MIT Technology Review and Times of San Diego . Journalists in both newsrooms spent the past year examining the failures of border surveillance technology and uncovering the stories of the people who die in the borderlands . Each of these deaths should have raised alarms inside US Customs and Border Protection (CBP) about the flaws in the agency’s surveillance network. This is particularly true for cases near the latest towers built by the defense company Anduril, which continues to win major contracts and is poised to benefit from the windfall of federal money slated for border security. The US is set to spend $1 billion to triple the size of the virtual wall by 2034. Here are four ideas for what CBP should do next to address these failures. 1. Conduct a comprehensive audit of deaths near the virtual wall In this June 16, 2021, file photo, a family from Venezuela moves to a Border Patrol transport vehicle after they and other migrants crossed the U.S.-Mexico border and turned themselves in to agents in Del Rio, Texas. ERIC GAY/AP PHOTO “If I were the federal government, I would do an audit, because this feels like it’s not working.” That was New Mexico state representative Sarah Silva’s reaction when MIT Technology Review showed her that in 2024 alone, more than 18 people had died near surveillance towers in just one small stretch of desert near her district. An audit is necessary because, despite poring over thousands of pages of police reports and other documents about surveillance towers, we have only limited knowledge of how many towers are out there and where they’re located. CBP does not publish a comprehensive map of its virtual wall. We instead relied on mapping work led by the nonprofit Electronic Frontier Foundation and then used satellite imagery to verify where specific towers were and approximately when they were installed. We analyzed lots of to", "date_str": "2026-09-21T12:00:00+00:00", "hash": "a8aad07631787e07", "title_fa": "4 راه برای رسیدگی به شکست هایی که در امتداد \"دیوار مجازی\" مرز ایالات متحده یافتیم", "summary_fa": "MIT Technology Review امروز تحقیقات ما را در مورد تعداد افرادی که در نزدیکی «دیوار مجازی» برج‌های نظارتی که دولت ایالات متحده در امتداد مرز ایالات متحده و مکزیک نصب کرده است، منتشر کرد. ما مواردی از افرادی پیدا کردیم که بدون شناسایی در مناطقی که توسط برج‌های پیشرفته و مجهز به هوش مصنوعی نظارت می‌شد راه می‌رفتند و بعداً در همان نزدیکی مردند، جایی که بدن‌شان برای هفته‌ها یا ماه‌ها بی‌توجه باقی می‌ماند. این موارد منعکس کننده نقص های سیستمی در دیوار مجازی هستند: برج های شکسته، الگوریتم هایی که نتوانستند افراد را شناسایی کنند، و عواملی که به سادگی به هشدارها پاسخ نمی دادند. این داستان بخشی از Dying on Camera است که همکاری بین MIT Technology Review و Times of San Diego است. روزنامه نگاران در هر دو اتاق خبر سال گذشته را صرف بررسی شکست های فناوری نظارت بر مرزها و کشف داستان های افرادی کردند که در مناطق مرزی جان خود را از دست می دهند. هر یک از این مرگ‌ها باید هشدارهایی را در گمرک و حفاظت مرزی ایالات متحده (CBP) در مورد نقص‌های شبکه نظارتی آژانس ایجاد می‌کرد. این امر به ویژه در مورد موارد نزدیک به آخرین برج های ساخته شده توسط شرکت دفاعی Anduril که همچنان برنده قراردادهای بزرگ است و آماده است از پول بادآورده فدرال که برای امنیت مرزی در نظر گرفته شده است، سود ببرد، صادق است. ایالات متحده قرار است یک میلیارد دلار برای سه برابر کردن اندازه دیوار مجازی تا سال 2034 هزینه کند. در اینجا چهار ایده برای آنچه که CBP باید در مرحله بعدی برای رسیدگی به این شکست ها انجام دهد، آورده شده است. 1. انجام یک ممیزی جامع از مرگ و میر در نزدیکی دیوار مجازی در این عکس فایل 16 ژوئن 2021، خانواده ای از ونزوئلا پس از عبور آنها و"}, {"source": "MIT Tech Review", "title": "The US spent billions on border surveillance. Why can’t it catch people before they die?", "link": "https://www.technologyreview.com/2026/09/21/1144166/border-towers-surveillance-investigation/", "summary": "When José Morales Bernal crossed the border into the United States on April 8, 2024, the day before his 32nd birthday, it should have triggered a chain of technological alerts and human responses. As he walked through the desert in southern New Mexico that morning, he was within range of three surveillance towers. Newly installed by US Customs and Border Protection (CBP), they were built by the defense tech company Anduril and equipped with cameras and AI to automatically detect and track people. They transmit live video to nearby control rooms and can send alerts to the government-issued smartphones held by agents in the area, prompting the closest available to respond. This story is part of Dying on Camera , a collaboration between MIT Technology Review and Times of San Diego . Journalists in both newsrooms spent the past year examining the failures of border surveillance technology and uncovering the stories of the people who die in the borderlands . These AI-enabled towers are meant to give greater visibility across the 1,951-mile southern border, freeing up border agents from having to spend hours staring into video monitors. They were installed in this particular place to spot border crossers before they reached the nearby town of Sunland Park. If the system worked as intended, Morales should have been apprehended. If he needed medical help, agents were trained to provide it. The view from where José Morales Bernal’s body was found toward a Customs and Border Protection surveillance tower made by Anduril, along the southern US border in Sunland Park, New Mexico. CENGIZ YAR FOR MITTR That didn’t happen. Despite the nearby surveillance towers, it was employees of the local landfill, rather than Border Patrol, who first spotted Morales that morning. At 1 p.m. the workers saw him again, now lying in the sand. At 4 p.m. the landfill workers saw that he had not moved and called Border Patrol. Agents arrived 45 minutes later. He was dead. When an agent then called 911 to report the body, he said it was “probably one of the migrants crossing through there,” seemingly unaware that Morales had been moving near the agency’s surveillance systems earlier that day. The agent can be heard sounding unsure of Morales movements despite the proximity of an AI-powered surveillance camera. The call has been edited for length. Morales had died just 360 feet from the closest surveillance tower. Two more towers stood watch to the east and the west. An autopsy later conclude", "date_str": "2026-09-21T12:00:00+00:00", "hash": "b40eebccf2827055", "title_fa": "آمریکا میلیاردها دلار برای نظارت بر مرزها هزینه کرد. چرا نمی تواند مردم را قبل از مرگ بگیرد؟", "summary_fa": "هنگامی که خوزه مورالس برنال در 8 آوریل 2024، یک روز قبل از تولد 32 سالگی خود، از مرز به ایالات متحده عبور کرد، باید زنجیره ای از هشدارهای تکنولوژیکی و پاسخ های انسانی را ایجاد می کرد. همان روز که صبح در صحرای جنوب نیومکزیکو قدم می زد، در محدوده سه برج مراقبت قرار داشت. آنها که به تازگی توسط گمرک و حفاظت مرزی ایالات متحده (CBP) نصب شده اند، توسط شرکت فناوری دفاعی Anduril ساخته شده و مجهز به دوربین و هوش مصنوعی برای شناسایی و ردیابی خودکار افراد هستند. آنها ویدئوی زنده را به اتاق‌های کنترل مجاور مخابره می‌کنند و می‌توانند هشدارهایی را به تلفن‌های هوشمند دولتی که توسط ماموران آن منطقه نگهداری می‌شوند ارسال کنند و نزدیک‌ترین افراد را وادار به پاسخ‌گویی کنند. این داستان بخشی از Dying on Camera است که همکاری بین MIT Technology Review و Times of San Diego است. روزنامه نگاران در هر دو اتاق خبر سال گذشته را صرف بررسی شکست های فناوری نظارت بر مرزها و کشف داستان های افرادی کردند که در مناطق مرزی جان خود را از دست می دهند. این برج‌های مجهز به هوش مصنوعی برای ایجاد دید بیشتر در سراسر مرز جنوبی 1951 مایلی، آزاد کردن عوامل مرزی را از گذراندن ساعت‌ها به مانیتورهای ویدیویی آزاد می‌کنند. آنها در این مکان خاص نصب شده بودند تا عبور کنندگان مرزی را قبل از رسیدن به شهر مجاور پارک سانلند شناسایی کنند. اگر سیستم طبق برنامه کار می کرد، مورالس باید دستگیر می شد. اگر او به کمک پزشکی نیاز داشت، ماموران برای ارائه آن آموزش می دیدند. منظره ای از جایی که جسد خوزه مورالس برنال به سمت یک برج مراقبت گمرک و حفاظت از مرز ساخته شده توسط اندوریل، در امتداد مرز جنوبی ایالات متحده در پارک سانلند، نیومکزیکو، پیدا شد. CENGIZ YAR برای MITTR این"}, {"source": "MIT Tech Review", "title": "She died at the San Diego border. A surveillance camera was in plain sight", "link": "https://www.technologyreview.com/2026/09/21/1144170/border-towers-surveillance-feature/", "summary": "She had only walked for a couple of hours, and already she was lost. It was early afternoon on Sept. 14, 2025, when 30-year-old Graciela Gómez Hernández crossed the border from the eastern edge of Tijuana into Southern California, sending voice messages to her mother and sister as she walked. This story is part of Dying on Camera , a collaboration between MIT Technology Review and Times of San Diego . Journalists in both newsrooms spent the past year examining the failures of border surveillance technology and uncovering the stories of the people who die in the borderlands . Gómez Hernández did not tell her family about her plan until the day before. Once she arrived in California, she hoped to work and send money back to her three children and her parents in southern Mexico. Her oldest son, age 11, had asked for a bicycle. She either climbed a ladder over the border wall or slipped through a section in steep terrain where fencing has yet to be built. Dozens of game trails cut through the dust on hillsides of sagebrush and manzanita. It was the first segment of a hike through the Otay Mountain Wilderness. The eastern edge of San Diego is just a mile away, but countless migrants hike 10 or 20 miles north through the mountains to evade the Border Patrol, emerging in smaller towns and on distant highways with fewer checkpoints. A border agent rides an ATV along the U.S.-Mexico border outside San Diego, September 2026. While the mountainous terrain makes some areas difficult to access, the area is blanketed with interconnected surveillance technology. ANNIE BARKER/TIMES OF SAN DIEGO/CATCHLIGHT LOCAL/REPORT FOR AMERICA Between 2 and 3 p.m., her sister said, Gómez Hernández sent a final message to her mother. “I can’t do it anymore,” she whispered into her phone. By the time a forensic crew came ت‌های بازرسی کمتر ظاهر می‌شوند. یک مامور مرزی در امتداد مرز ایالات متحده و مکزیک خارج از سن دیگو، سپتامبر 2026، سوار بر یک ATV می‌شود. در حالی که زمین‌های کوهستانی دسترسی به برخی مناطق را دشوار می‌کند، منطقه با فناوری نظارت به هم پیوسته پوشیده شده است. آنی بارکر/ تایمز سن دیگو/ گزارش محلی CATCHLIGHT برای آمریکا، خواهرش گفت: بین ساعت 2"}, {"source": "Zoomit", "title": "گزارش سالانه دیجی‌کالا؛ تورم ۷۴ درصدی قیمت‌ها و ورود بیش از ۲ میلیون خریدار جدید در یک سال پرنوسان", "link": "https://www.zoomit.ir/report/467614-digikala-annual-report-1404-ecommerce-data/", "summary": "گزارش سال ۱۴۰۴ دیجی‌کالا از رشد ۷۴ درصدی قیمت کالاها، فعالیت بیش از ۴۲۶ هزار فروشنده و ورود ۲ میلیون خریدار جدید به این پلتفرم خبر می‌دهد.", "date_str": "2026-09-21T14:05:20+00:00", "hash": "5571508c54a063d4", "title_fa": "گزارش سالانه دیجی‌کالا؛ تورم ۷۴ درصدی قیمت‌ها و ورود بیش از ۲ میلیون خریدار جدید در یک سال پرنوسان", "summary_fa": "گزارش سال ۱۴۰۴ دیجی‌کالا از رشد ۷۴ درصدی قیمت کالاها، فعالیت بیش از ۴۲۶ هزار فروشنده و ورود ۲ میلیون خریدار جدید به این پلتفرم خبر می‌دهد. تبلیغات گزارش سال ۱۴۰۴ دیجی‌کالا تصویری از یکی از بزرگ‌ترین بازیگران اقتصاد دیجیتال ایران در سالی پر از تورم، نوسان‌های اقتصادی و بحران‌های سیاسی و اجتماعی ارائه می‌کند. داده‌های این گزارش نشان می‌دهد که با وجود رشد قابل‌توجه قیمت کالاها، بازار خرید آنلاین هم‌چنان به گسترش جغرافیایی و جذب مشتریان جدید ادامه داده؛ هرچند سهم دیجی‌کالا از کل بازار خرده‌فروشی کشور همچنان تنها ۱.۸ درصد اعلام شده است. بر اساس این گزارش، دیجی‌کالا در سال ۱۴۰۴ به‌طور متوسط روزانه ۵.۶ میلیون بازدیدکننده داشته و کاربران هر روز ۴٫۴ میلیون جست‌وجو در این پلتفرم انجام داده‌اند. تعداد کالاهای قابل خرید در دیجی‌کالا نیز به ۱۵٫۳ میلیون قلم رسیده است. دیجی‌کالا تا پایان سال ۱۴۰۴ در ۲۷۴۰ شهر و روستای کشور مشتری داشته و ظرفیت پردازش روزانه کالا در زیرساخت‌های آن از یک میلیون قلم فراتر رفته است. این مجموعه همچنین ۹۵۹ مرکز زیرساختی و ۹۷۰۰ نیروی تمام‌وقت داشته است. کپی لینک ورود بیش از ۲ میلیون خریدار جدید به دیجی‌کالا یکی از مهم‌ترین داده‌های گزارش، تعداد افرادی است که ب
