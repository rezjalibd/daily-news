kplace collaboration startup, which was valued at $17.5 billion in late 2021.", "date_str": "2026-09-10T14:34:09+00:00", "hash": "7eee474dacd8af14", "title_fa": "Bending Spoons برای خرید Miro سازنده ابزارهای همکاری به قیمت 1.36 میلیارد دلار، 90٪ کمتر از ارزش گذاری آن در سال 2022", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید: Miro Enterprise Bending Spoons برای خرید ابزارهای همکاری سازنده Miro به قیمت 1.36 میلیارد دلار، 90 درصد کمتر از ارزش گذاری آن در سال 2022 Ram Iyer 7:34 AM PDT · 10 سپتامبر، 10 سپتامبر، 10 سپتامبر، 26 سپتامبر روند خرید ادامه دارد. شرکت‌های نرم‌افزاری که زمانی به دنبال دلار بودند. این بار، شرکت ایتالیایی Miro را به قیمت 1.36 میلیارد دلار به صورت نقدی (ارزش سهام 1.79 میلیارد دلار) خریداری می‌کند، که کاهش قابل توجهی در ارزش استارت‌آپ همکاری در محل کار بود که در اواخر سال 2021 قیمتی معادل 17.5 میلیارد دلار دریافت کرد. Miro که در سال 2011 به عنوان یک ابزار تخته سفید به نام RealtimeBoard تأسیس شد، در طول همه‌گیری کووید-19، زمانی که شرکت‌ها به طور انبوه به سمت کار از راه دور رفتند و متوجه شدند کارمندان خود می‌خواهند تجربه همکاری روی تخته سفید فیزیکی را تکرار کنند، ثروت زیادی پیدا کرد. Miro با ساختن پلتفرمی که می تواند با بیش از 250 برنامه ادغام شود و با Atlassian، Cisco، Microsoft و Zoom همکاری کند، به سرعت از این شتاب استفاده کرد. این شرکت همچنین شروع به اجازه دادن به کاربران خود برای ایجاد یکپارچگی با ابزارهای رایج و سفارشی سازی محصول پایه برای رفع نیازهای خود کرد. امروزه، خود را یک فضای کاری نوآوری در هوش مصنوعی می‌نامد که دستیارهای هوش مصنوعی را برای ابزارهای تخته سفید، گردش‌های کاری هوش مصنوعی، ابزارهای نمونه‌سازی اولیه و اتصال‌های هوش مصنوعی که زمینه را از پلتفرم‌های مختلف مانند GitHub، Jira و Slack می‌کشند، ارائه می‌دهد. تا سال 2022، Miro از 5 میلیون کاربر به حدود 30 میلیون کاربر در عرض دو سال"}, {"source": "Ars Technica", "title": "Claude users found ways around safeguards for bioweapons research", "link": "https://arstechnica.com/ai/2026/09/claude-users-found-ways-around-safeguards-for-bioweapons-research/", "summary": "Anthropic said it stopped multiple attempts by scientists this year to use its technology for research that could help develop biological weapons, as experts increasingly fear the threat that AI poses to public safety. The startup gave five examples of times actors “circumvented controls” and made other efforts to “obfuscate” the purpose of their research to dodge safeguards. The cases involved some users in nations that it prohibits from accessing its models, which include Russia, China, and Iran. “We hope that by sharing these examples, we spark a conversation within the AI industry and with governments about emerging biological risks and how best to counter them,” Anthropic said in a report about efforts to use its models for malicious activity. Read full article Comments", "date_str": "2026-09-11T13:02:35+00:00", "hash": "1e3e39a83c7c7567", "title_fa": "کاربران کلود راه هایی را برای حفاظت از تحقیقات در مورد سلاح های زیستی پیدا کردند", "summary_fa": "آنتروپیک گفت که امسال تلاش های متعدد دانشمندان را برای استفاده از فناوری خود برای تحقیقاتی که می تواند به توسعه سلاح های بیولوژیکی کمک کند، متوقف کرد، زیرا کارشناسان به طور فزاینده ای از تهدیدی که هوش مصنوعی برای امنیت عمومی ایجاد می کند، بیم دارند. این استارت‌آپ پنج مثال از زمان‌هایی که بازیگران «کنترل‌ها را دور زدند» و تلاش‌های دیگری را برای «مبهم کردن» هدف تحقیق خود برای طفره رفتن از پادمان‌ها انجام دادند. این موارد شامل برخی از کاربران در کشورهایی می شود که دسترسی به مدل های خود را ممنوع کرده است، از جمله روسیه، چین و ایران. آنتروپیک در گزارشی درباره تلاش‌ها برای استفاده از مدل‌هایش برای فعالیت‌های مخرب گفت: «امیدواریم با به اشتراک گذاشتن این نمونه‌ها، گفت‌وگویی را در صنعت هوش مصنوعی و با دولت‌ها درباره خطرات بیولوژیکی در حال ظهور و بهترین روش مقابله با آنها ایجاد کنیم. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "ClickFix attacks infecting PCs and Macs are going viral", "link": "https://arstechnica.com/security/2026/09/clickfix-attacks-infecting-pcs-and-macs-are-going-viral/", "summary": "It wasn’t that long ago that ClickFix attacks were exotic. Now the technique has become mainstream as attackers reap its simplicity and effectiveness in infecting users of PCs and Macs alike. All that’s required is a compromised website—a painless enough task—a fake CAPTCHA overlay, and the inclusion of a single terminal command. So many visitors get suckered into pasting and running the command that just about every malware pusher has adopted the technique. Even Kremlin-backed hacking groups are joining in. “Reddit is becoming post after post after post of people getting their computer infected via ClickFix,” independent researcher Kevin Beaumont observed Thursday . “Legit websites everywhere [are] getting hacked to serve the fake captcha prompts.” How many of us make things worse More seasoned Internet users—a fair number who read this site—are quick to dismiss the attack. They typically blame the people who fall for the scams and marvel at their gullibility and lack of attention. The reality is that for more casual users, using computers and the Internet has become so difficult—think impossible-to-close interstitials, CAPTCHAs with an endless series of pictures to analyze, and constantly changing interfaces that bury the features they’re looking for—that they have grown desensitized to instructions that seem ridiculous and burdensome. Read full article Comments", "date_str": "2026-09-11T11:30:58+00:00", "hash": "82c78eab924e6233", "title_fa": "حملات ClickFix که رایانه‌های شخصی و مک را آلوده می‌کنند، ویروسی می‌شوند", "summary_fa": "چندی پیش نبود که حملات ClickFix عجیب و غریب بود. اکنون این تکنیک به جریان اصلی تبدیل شده است زیرا مهاجمان از سادگی و اثربخشی آن در آلوده کردن کاربران رایانه های شخصی و مک به طور یکسان بهره می برند. تنها چیزی که مورد نیاز است یک وب سایت در معرض خطر است - یک کار به اندازه کافی بدون درد - یک پوشش CAPTCHA جعلی و گنجاندن یک فرمان ترمینال واحد. بسیاری از بازدیدکنندگان در چسباندن و اجرای دستور غرق می شوند که تقریباً هر عامل بدافزاری از این تکنیک استفاده کرده است. حتی گروه‌های هکری تحت حمایت کرملین نیز به آن ملحق می‌شوند. کوین بومونت، محقق مستقل، روز پنجشنبه مشاهده کرد: «Reddit در حال تبدیل شدن به پست پس از پست از افرادی است که رایانه‌شان را از طریق ClickFix آلوده می‌کنند». \"وب سایت های قانونی در همه جا [در حال] هک شدن هستند تا به درخواست های کپچای جعلی ارائه شوند.\" چه تعداد از ما اوضاع را بدتر می کنیم. بیشتر کاربران باتجربه اینترنت - تعداد نسبتاً زیادی که این سایت را می خوانند - به سرعت این حمله را رد می کنند. آنها معمولاً افرادی را سرزنش می کنند که به کلاهبرداری می افتند و از زودباوری و عدم توجه آنها شگفت زده می شوند. واقعیت این است که برای کاربران معمولی‌تر، استفاده از رایانه و اینترنت آنقدر دشوار شده است - فکر کنید غیرممکن است بینابینی‌ها را ببندید، CAPTCHAهایی با مجموعه‌ای از تصاویر بی‌پایان برای تجزیه و تحلیل، و رابط‌های دائماً در حال تغییر که ویژگی‌های مورد نظرشان را پنهان می‌کند - که نسبت به دستورالعمل‌هایی که به نظر مضحک و سنگین به نظر می‌رسند حساسیت‌زدایی شده‌اند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "What happens when quantum mechanics and relativity meet?", "link": "https://arstechnica.com/science/2026/09/what-happens-when-quantum-mechanics-and-relativity-meet/", "summary": "Almost a hundred years ago, physicists theorized out what free fall should do to a quantum wave. If the solution they came up with is wrong, quantum mechanics and Einstein's theory of gravity flatly contradict each other. But testing it has been impossible because nobody has managed to build an interferometer that could perform the necessary measurement. Now, a team led by Ron Folman, a physicist at Ben-Gurion University of the Negev, with collaborators in Germany, the UK, and the US, including Nobel laureate Roger Penrose, has done it. They built a new interferometer that gives a single atom two possible paths at once: one that involves a free fall, and another where it is held perfectly still. Both paths end at the same place at the same moment, allowing the team to measure what the fall does to a wave-like property of the atom. Long time coming Ever since Galileo, physicists have known how to describe a falling object—where it is, how fast it goes, or how quickly it accelerates. Quantum mechanics, though, insists that every object is also a wave. “Every particle, doesn't matter if it's a car or a spaceship or an atom, is a wave,” Folman says. “Everything that is a wave, like sea waves or sound waves, goes up and down. And if you're up or down, this is measured by something called a phase. A phase just tells you if you are at the top of the wave or at the bottom.” Read full article Comments", "date_str": "2026-09-11T11:20:02+00:00", "hash": "21bdff26a4862c5f", "title_fa": "وقتی مکانیک کوانتومی و نسبیت به هم می رسند چه اتفاقی می افتد؟", "summary_fa": "تقریباً صد سال پیش، فیزیکدانان این نظریه را مطرح کردند که سقوط آزاد باید با موج کوانتومی چه کند. اگر راه حلی که آنها پیدا کردند اشتباه باشد، مکانیک کوانتومی و نظریه گرانش اینشتین کاملاً با یکدیگر در تضاد هستند. اما آزمایش آن غیرممکن بوده است زیرا هیچ کس موفق به ساخت تداخل سنج نشده است که بتواند اندازه گیری های لازم را انجام دهد. اکنون، تیمی به رهبری ران فولمن، فیزیکدان دانشگاه بن گوریون نقب، با همکارانی در آلمان، بریتانیا و ایالات متحده، از جمله برنده جایزه نوبل، راجر پنروز، این کار را انجام داده است. آنها یک تداخل سنج جدید ساختند که به یک اتم دو مسیر ممکن را همزمان می دهد: یکی که شامل سقوط آزاد است و دیگری جایی که کاملاً ثابت نگه داشته می شود. هر دو مسیر در یک لحظه به یک مکان ختم می‌شوند و به تیم اجازه می‌دهند تا آنچه را که سقوط با خاصیت موج مانند اتم انجام می‌دهد اندازه‌گیری کند. زمان طولانی از زمان گالیله، فیزیکدانان می دانستند که چگونه یک شی در حال سقوط را توصیف کنند - کجاست، با چه سرعتی می رود، یا چقدر سریع شتاب می گیرد. با این حال، مکانیک کوانتومی اصرار دارد که هر جسم نیز یک موج است. فولمن می گوید: «هر ذره، فرقی نمی کند ماشین باشد یا سفینه فضایی یا اتم، یک موج است. \"هر چیزی که موج است، مانند امواج دریا یا امواج صوتی، بالا و پایین می رود. و اگر بالا یا پایین هستید، این با چیزی به نام فاز اندازه گیری می شود. یک فاز فقط به شما می گوید که در بالای موج هستید یا در پایین.» نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Could United Launch Alliance's money problems finally force its owners to sell?", "link": "https://arstechnica.com/space/2026/09/could-united-launch-alliances-money-problems-finally-force-its-owners-to-sell/", "summary": "Pretty much every rocket company in the United States, save one, has embraced two fundamental tenets: reusability and diversification. Most famously, SpaceX branched out from reusable rockets to pursue and dominate a growing spectrum of space services: cargo delivery, human spaceflight, satellite production, broadband, and, perhaps soon, orbital data centers and in-space manufacturing. Blue Origin is evolving from a pure rocket company into a satellite manufacturer, robotics developer, and, most recently, a potential competitor for SpaceX's Starlink network. Rocket Lab used a different approach to diversify after achieving success with its small Electron launch vehicle. The company relocated its headquarters from New Zealand to Southern California, started building spacecraft and payloads, and then went on a spree of corporate acquisitions to expand into satellite communications and take on a new role as a merchant supplier of satellite components and sensors. It's now in a stage of advanced development of its partially reusable next-generation Neutron launch vehicle. Read full article Comments", "date_str": "2026-09-11T11:00:44+00:00", "hash": "ecff6674feb7e570", "title_fa": "آیا مشکلات مالی اتحاد راه اندازی یونایتد سرانجام می تواند صاحبان آن را مجبور به فروش کند؟", "summary_fa": "تقریباً هر شرکت موشکی در ایالات متحده، به جز یکی، دو اصل اساسی را پذیرفته است: قابلیت استفاده مجدد و تنوع. معروف‌تر از همه، SpaceX از موشک‌های قابل استفاده مجدد برای پیگیری و تسلط بر طیف رو به رشدی از خدمات فضایی منشعب شد: تحویل محموله، پروازهای فضایی انسانی، تولید ماهواره، پهنای باند، و شاید به زودی، مراکز داده مداری و تولید در فضا. Blue Origin از یک شرکت موشکی خالص به یک سازنده ماهواره، توسعه دهنده رباتیک و اخیراً به یک رقیب بالقوه برای شبکه Starlink اسپیس ایکس تبدیل شده است. Rocket Lab پس از دستیابی به موفقیت با وسیله نقلیه کوچک پرتاب الکترون خود، از رویکرد متفاوتی برای ایجاد تنوع استفاده کرد. این شرکت دفتر مرکزی خود را از نیوزلند به کالیفرنیای جنوبی منتقل کرد، شروع به ساخت فضاپیماها و محموله‌های محموله کرد و سپس خریدهای شرکتی را آغاز کرد تا به ارتباطات ماهواره‌ای گسترش یابد و نقش جدیدی به عنوان تامین‌کننده تاجر قطعات و حسگرهای ماهواره ای ایفا کند. اکنون در مرحله توسعه پیشرفته نسل بعدی پرتابگر نوترون قابل استفاده مجدد است. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Rocket Report: Europe joins the commercial launch club; a Ravn X sighting?", "link": "https://arstechnica.com/space/2026/09/rocket-report-europe-joins-the-commercial-launch-club-a-ravn-x-sighting/", "summary": "Welcome to Edition 9.10 of the Rocket Report! This week we're celebrating a historic moment in Europe when a German rocket company successfully put its launch vehicle into orbit. Isar Aerospace became the first purely commercial European company to reach orbit, and impressively it did so on just its second launch attempt. How quickly can they scale up operations? How quickly will the second European launch firm reach this goal? Big questions, which for now we don't have answers to. As always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar. Isar Aerospace takes a huge step forward . Isar Aerospace, founded in 2018 by three students at a German university, successfully launched a privately developed rocket into low-Earth orbit on Saturday from a Norwegian spaceport inside the Arctic Circle. The two-stage rocket, Spectrum, became the first fully commercial launch vehicle in Europe to reach orbit, Ars reports . With Saturday’s success, Isar becomes the clear leader among a pack of several European launch startups vying to inject some competition into Europe’s stagnant launch market. Read full article Comments", "date_str": "2026-09-11T11:00:30+00:00", "hash": "d1b7a5bf0db6886d", "title_fa": "گزارش موشک: اروپا به باشگاه پرتاب تجاری می پیوندد. مشاهده Ravn X؟", "summary_fa": "به نسخه 9.10 گزارش موشک خوش آمدید! این هفته ما در حال جشن گرفتن لحظه ای تاریخی در اروپا هستیم که یک شرکت راکت آلمانی با موفقیت پرتابگر خود را در مدار قرار داد. Isar Aerospace اولین شرکت کاملاً تجاری اروپایی بود که به مدار رسید و به طرز چشمگیری این کار را در دومین تلاش خود برای پرتاب انجام داد. آنها چقدر سریع می توانند عملیات را افزایش دهند؟ دومین شرکت پرتاب اروپایی چقدر سریع به این هدف خواهد رسید؟ سوالات بزرگی که در حال حاضر پاسخی برای آنها نداریم. مثل همیشه، از ارسال‌های خوانندگان استقبال می‌کنیم، و اگر نمی‌خواهید مشکلی را از دست بدهید، لطفاً با استفاده از کادر زیر مشترک شوید (فرم در نسخه‌های دارای AMP سایت ظاهر نمی‌شود). هر گزارش شامل اطلاعاتی در مورد موشک های کوچک، متوسط ​​و سنگین و همچنین نگاهی سریع به سه پرتاب بعدی در تقویم خواهد بود. ایثار گام بزرگی به جلو برداشته است. Isar Aerospace که در سال 2018 توسط سه دانشجو در یک دانشگاه آلمان تأسیس شد، روز شنبه یک موشک توسعه‌یافته خصوصی را با موفقیت از یک فرودگاه فضایی نروژی در داخل دایره قطب شمال به مدار پایین زمین پرتاب کرد. به گزارش Ars، موشک دو مرحله ای اسپکتروم اولین وسیله پرتاب کاملا تجاری در اروپا شد که به مدار رسید. با موفقیت روز شنبه، ایسار به رهبر واضحی در میان مجموعه ای از چندین استارتاپ راه اندازی اروپایی تبدیل می شود که برای تزریق رقابت به بازار راکد راه اندازی اروپا رقابت می کنند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Boy developed \"toasted skin\" condition from using a laptop every day", "link": "https://arstechnica.com/health/2026/09/boy-developed-toasted-skin-condition-from-using-a-laptop-every-day/", "summary": "Fears that modern electronic devices may harm children are nothing new. Gadgets with screens of any size have long been allegedly melting, rotting, and/or corrupting the brains of youths for decades. However, a medical case report published this week offers a new and alarming way our digital doodads may cause physical harm. In BMJ Case Reports , two UK doctors, Mara Znagoveanu and Edward Artley, report the case of a boy who came to an emergency department with alarming marks on his abdomen. The marks were described as being in a patch about 15 centimeters (6 inches) wide, made of flat, reddish-brown \"interlacing lines forming irregular circles and a lace-like morphology.\" A picture of the marks is here . Mysterious marks The boy, whom they described only as being in \"mid-childhood,\" was not in any pain, and the rash was not warm to the touch or tender. He and his parents said they couldn't think of any recent injuries or trauma that might explain the marks. He was otherwise healthy, hadn't recently been ill, and had no systemic symptoms, such as fever or fatigue. Everything about the boy's health, growth, and medical history looked normal. Read full article Comments", "date_str": "2026-09-10T22:16:05+00:00", "hash": "fcb800ea1b4f56b0", "title_fa": "پسری به دلیل استفاده روزانه از لپ تاپ دچار بیماری \"پوست برشته\" شد", "summary_fa": "ترس از اینکه وسایل الکترونیکی مدرن ممکن است به کودکان آسیب برساند چیز جدیدی نیست. گجت‌هایی با صفحه‌نمایش در هر اندازه‌ای که گفته می‌شود برای چندین دهه در حال ذوب، پوسیدگی و/یا فاسد کردن مغز جوانان بوده‌اند. با این حال، یک گزارش مورد پزشکی که این هفته منتشر شد، راه جدیدی و هشداردهنده را ارائه می‌کند که دوادهای دیجیتال ما ممکن است باعث آسیب فیزیکی شوند. در BMJ Case Reports، دو پزشک بریتانیایی به نام‌های Mara Znagoveanu و Edward Artley، مورد پسری را گزارش می‌کنند که با علائم هشداردهنده روی شکمش به بخش اورژانس مراجعه کرده است. این نشانه‌ها به صورت تکه‌ای به پهنای حدود 15 سانتی‌متر (6 اینچ)، ساخته شده از خطوط مسطح، قهوه‌ای مایل به قرمز «خطوط درهم تنیده که دایره‌های نامنظم و مورفولوژی توری مانند را تشکیل می‌دهند» توصیف شد. عکسی از علائم اینجاست. علائم اسرارآمیز پسری که آنها او را فقط در \"اواسط کودکی\" توصیف کردند، هیچ دردی نداشت و راش در لمس گرم یا حساس نبود. او و والدینش گفتند که نمی‌توانستند آسیب‌های اخیر یا ضربه‌ای که ممکن است علائم را توضیح دهد فکر کنند. او در غیر این صورت سالم بود، اخیراً بیمار نشده بود و هیچ علائم سیستمیک مانند تب یا خستگی نداشت. همه چیز در مورد سلامتی، رشد و سابقه پزشکی پسر عادی به نظر می رسید. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "LinkedIn beats \"BrowserGate\" lawsuits over scanning users' Chrome extensions", "link": "https://arstechnica.com/tech-policy/2026/09/linkedin-beats-browsergate-lawsuits-over-scanning-users-chrome-extensions/", "summary": "LinkedIn beat two lawsuits over its practice of scanning users’ browser extensions, with a judge granting the Microsoft subsidiary's motion to dismiss the cases. The users who sued LinkedIn failed to adequately allege that they have standing to sue because neither asserted that they \"had browser extensions installed that conveyed private information to LinkedIn,\" ruled Judge Vince Chhabria in US District Court for the Northern District of California. In his ruling on Tuesday, Chhabria gave the plaintiffs leave to amend their complaints but said he doubts they can make a plausible case. \"Given LinkedIn’s further arguments that users voluntarily download browser extensions, which by their nature intentionally expose data to websites, it seems unlikely that the plaintiffs will ever be able to allege a privacy violation, much less prevail at the end of the day,\" Chhabria wrote. California residents Nicholas Farrell and Jeff Ganan separately filed class actions against LinkedIn in April, seeking to represent themselves and other LinkedIn users. Ganan's attorney, J.R. Howell, said he is evaluating whether to bring the claims in a California state court, which has different requirements on standing, or to appeal the US district court ruling in the US Court of Appeals for the Ninth Circuit. Read full article Comments", "date_str": "2026-09-10T20:55:29+00:00", "hash": "278cb905daefd96d", "title_fa": "لینکدین شکایت های «BrowserGate» را در مورد اسکن افزونه های کروم کاربران شکست داد", "summary_fa": "لینکدین دو شکایت را در مورد اسکن برنامه های افزودنی مرورگر کاربران شکست داد و قاضی با درخواست شعبه مایکروسافت برای رد پرونده ها موافقت کرد. قاضی وینس چابریا در دادگاه منطقه ای ایالات متحده در ناحیه شمالی کالیفرنیا حکم داد کاربرانی که از لینکدین شکایت کردند به اندازه کافی ادعا نکردند که دارای حق شکایت هستند زیرا هیچ یک ادعا نکردند که \"برنامه های افزودنی نصب شده برای مرورگرهایی که اطلاعات خصوصی را به لینکدین منتقل می کند نصب کرده اند.\" چابریا در حکم روز سه‌شنبه خود به شاکیان اجازه داد تا شکایات خود را اصلاح کنند اما گفت که شک دارد که آنها بتوانند یک مورد قابل قبول داشته باشند. چابریا می‌نویسد: «با توجه به استدلال‌های بیشتر لینکدین مبنی بر اینکه کاربران به‌طور داوطلبانه افزونه‌های مرورگر را دانلود می‌کنند، که طبیعتاً داده‌ها را عمداً در معرض دید وب‌سایت‌ها قرار می‌دهند، بعید به نظر می‌رسد که شاکیان هرگز بتوانند ادعای نقض حریم خصوصی داشته باشند، بسیار کمتر در پایان روز.» نیکلاس فارل و جف گانان ساکنان کالیفرنیا به طور جداگانه در ماه آوریل علیه لینکدین شکایت دسته جمعی کردند و به دنبال نمایندگی از خود و سایر کاربران لینکدین بودند. وکیل گانان، جی. آر. هاول، گفت که او در حال ارزیابی این است که آیا این ادعاها را در یک دادگاه ایالتی کالیفرنیا، که شرایط متفاوتی در قبال استقرار دارد، مطرح کند یا به حکم دادگاه منطقه ای ایالات متحده در دادگاه استیناف حوزه نهم ایالات متحده اعتراض کند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Europe will go it alone on Venus mission after NASA yanks radar instrument", "link": "https://arstechnica.com/space/2026/09/europe-will-go-it-alone-on-venus-mission-after-nasa-yanks-radar-instrument/", "summary": "The European Space Agency is moving \"full steam ahead\" with development of a robotic mission to Venus after NASA officials determined they were unlikely to fulfill a commitment to provide a US-built radar instrument for the spacecraft, the mission's project scientist said. The European orbiter, named Envision, will map the Venusian surface at 10 times higher resolution than the last radar mission sent to Venus by NASA in the 1990s. The planet is enshrouded in a blanket of thick clouds of sulfuric acid, rendering its mysterious surface unseen by optical cameras in orbit. Radar is the most effective way to penetrate the clouds of Venus to reveal the terrain below, and scientists will use Envision to look for signs of active volcanism. NASA and ESA signed a memorandum of understanding in 2024 outlining their partnership on Envision. NASA agreed to supply a US-made synthetic aperture radar instrument, Envision's primary means of mapping the surface of Venus, along with providing tracking and communications support through NASA's Deep Space Network. In exchange, ESA would include US researchers on Envision's science team. Europe would build the Envision spacecraft and the rest of its science instruments and provide the launch on an Ariane 6 rocket. Read full article Comments", "date_str": "2026-09-10T19:09:29+00:00", "hash": "8c8c98e3f9528068", "title_fa": "پس از آن که ناسا ابزار راداری را بیرون آورد، اروپا به تنهایی به ماموریت زهره خواهد رفت", "summary_fa": "دانشمند پروژه این ماموریت گفت، آژانس فضایی اروپا با «با تمام قوا» در حال توسعه یک مأموریت روباتیک به زهره است، پس از اینکه مقامات ناسا تشخیص دادند که بعید است به تعهد خود مبنی بر ارائه یک ابزار راداری ساخت ایالات متحده برای فضاپیما عمل کنند. مدارگرد اروپایی که Envision نام دارد، سطح سیاره زهره را با وضوح 10 برابر بالاتر از آخرین مأموریت راداری ارسال شده توسط ناسا به زهره در دهه 1990 نقشه برداری می کند. این سیاره در پوششی از ابرهای ضخیم اسید سولفوریک پوشانده شده است و سطح مرموز آن توسط دوربین های نوری در مدار دیده نمی شود. رادار موثرترین راه برای نفوذ به ابرهای زهره برای آشکار کردن زمین زیر است و دانشمندان از Envision برای جستجوی نشانه‌هایی از آتشفشان فعال استفاده خواهند کرد. ناسا و ESA یادداشت تفاهمی را در سال 2024 امضا کردند که در آن شراکت خود را در Envision تشریح کردند. ناسا موافقت کرد که یک ابزار رادار دیافراگم مصنوعی ساخت ایالات متحده، ابزار اصلی انویژن برای نقشه برداری از سطح زهره، همراه با ارائه پشتیبانی ردیابی و ارتباطی از طریق شبکه فضایی عمیق ناسا، ارائه کند. در ازای آن، ESA شامل محققان آمریکایی در تیم علمی Envision خواهد شد. اروپا فضاپیمای انویژن و بقیه ابزارهای علمی آن را می‌سازد و پرتاب را با موشک آریان 6 فراهم می‌کند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Android can now securely migrate your logins between password managers", "link": "https://arstechnica.com/gadgets/2026/09/android-can-now-securely-migrate-your-logins-between-password-managers/", "summary": "As longer, more complex passwords have become a necessity, remembering all those strings of numbers, letters, and special characters has become nearly impossible. Password managers can solve that problem, but what happens when you want to move to a different login organizer? Sure, you could manually type all your logins into a new app, but now Android can do that for you without the tedium. Google designed the new login transfer process to happen entirely on your phone, so you need the corresponding apps installed with your credentials synced. To start the move, you'll have to find the import option in the app you want to use. The location of that feature will vary, but in Google Password Manager (built into Android), it's near the top under the settings tab. The import option in Google Password Manager will plug in to the new migration system, while export still just creates an unencrypted CSV with your passwords that can be dumped into any app. It will be similar in other apps, so make sure to start the process in the app you want to use. Currently, this works in Google's app, 1Password, Bitwarden, and Dashlane. Read full article Comments", "date_str": "2026-09-10T18:41:09+00:00", "hash": "52930763bcbbda54", "title_fa": "اندروید اکنون می تواند به طور ایمن لاگین های شما را بین مدیران رمز عبور انتقال دهد", "summary_fa": "با طولانی‌تر شدن، رمزهای عبور پیچیده‌تر به یک ضرورت تبدیل شده‌اند، به خاطر سپردن تمام رشته‌های اعداد، حروف و کاراکترهای خاص تقریباً غیرممکن شده است. مدیران گذرواژه می‌توانند این مشکل را حل کنند، اما وقتی می‌خواهید به یک سازمان‌دهنده ورود دیگر بروید، چه اتفاقی می‌افتد؟ مطمئناً، می‌توانید به صورت دستی همه ورودهای خود را در یک برنامه جدید تایپ کنید، اما اکنون اندروید می‌تواند این کار را برای شما بدون خستگی انجام دهد. Google فرآیند انتقال ورود به سیستم جدید را طوری طراحی کرد که کاملاً در تلفن شما انجام شود، بنابراین باید برنامه های مربوطه را با اعتبارنامه خود همگام سازی کنید. برای شروع حرکت، باید گزینه import را در برنامه ای که می خواهید استفاده کنید پیدا کنید. مکان آن ویژگی متفاوت خواهد بود، اما در Google Password Manager (ساخته شده در اندروید)، در قسمت بالای تب تنظیمات قرار دارد. گزینه import در Google Password Manager به سیستم مهاجرت جدید وصل می‌شود، در حالی که صادرات فقط یک CSV رمزگذاری نشده با رمزهای عبور شما ایجاد می‌کند که می‌تواند در هر برنامه‌ای ریخته شود. در سایر برنامه ها مشابه خواهد بود، بنابراین مطمئن شوید که این فرآیند را در برنامه ای که می خواهید استفاده کنید شروع کنید. در حال حاضر، این در برنامه Google، 1Password، Bitwarden و Dashlane کار می کند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Panic builds over bankrupt Spirit’s looming data sale to Google", "link": "https://arstechnica.com/tech-policy/2026/09/panic-builds-over-bankrupt-spirits-looming-data-sale-to-google/", "summary": "Doug Kreuzkamp was shocked when news outlets reported that Google won an auction to buy a huge amount of operational data as part of Spirit Airlines’ bankruptcy proceedings. Kreuzkamp founded a startup called Springshot in 2011, which created a widely used proprietary platform that helps humans and AI systems improve airline efficiency and quickly solve logistics problems so flights can stay on time and airlines can operate as smoothly as possible. Hundreds of airports use it globally. Springshot powered Spirit’s technology stack for the last three years, right up to the “very last flight,” Kreuzkamp told Ars. Yet his company got no notice when Spirit prepared to auction off a massive dataset that he thinks likely improperly includes a substantial amount of data and intellectual property (IP) that Springshot owns—not Spirit. Read full article Comments", "date_str": "2026-09-10T18:14:14+00:00", "hash": "81125b1cc1675ed1", "title_fa": "وحشت ناشی از فروش قریب الوقوع Spirit به گوگل است", "summary_fa": "داگ کروزکمپ زمانی که رسانه های خبری گزارش دادند که گوگل برنده حراجی برای خرید حجم عظیمی از داده های عملیاتی به عنوان بخشی از روند ورشکستگی Spirit Airlines شد، شوکه شد. کروزکمپ استارت آپی به نام Springshot را در سال 2011 تأسیس کرد که یک پلتفرم اختصاصی پرکاربرد ایجاد کرد که به انسان ها و سیستم های هوش مصنوعی کمک می کند کارایی خطوط هوایی را بهبود بخشند و مشکلات لجستیکی را به سرعت حل کنند تا پروازها بتوانند به موقع بمانند و خطوط هوایی بتوانند تا حد امکان راحت عمل کنند. صدها فرودگاه در سراسر جهان از آن استفاده می کنند. کروزکمپ به Ars گفت که Springshot پشته فناوری Spirit را در سه سال گذشته، درست تا آخرین پرواز، تامین کرد. با این حال، شرکت او زمانی که اسپیریت آماده حراج مجموعه داده عظیمی شد که به نظر او به طور نادرست شامل مقدار قابل توجهی از داده‌ها و مالکیت معنوی (IP) است که اسپرینگ‌شات مالک آن است - نه Spirit، هیچ اطلاعی دریافت نکرد. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Physicist does the math on Star Trek’s “Picard maneuver”", "link": "https://arstechnica.com/science/2026/09/physicist-does-the-math-on-star-treks-picard-maneuver/", "summary": "It turns out Jean-Luc Picard was an even better starship helmsman than the writers knew. A physicist has gone through the details of a warp-speed trick from the first season of Star Trek: The Next Generation and found a subtlety the show missed. But instead of a plot hole, the detail he found actually makes the maneuver more impressive… as well as a great opportunity to teach about a lesser-known feature of the theory of relativity. Níckolas de Aguiar Alves, a physicist at the Federal University of ABC in Brazil, first watched Next Generation as a master’s student. When he got to the episode \"The Battle\" in the show’s first season, the plot reminded him of his relativity coursework. In \"The Battle,\" a Ferengi leader reminds Picard of a battle he fought years ago as captain of a ship called the Stargazer . Under fire from a mysterious attacker, Picard’s ship’s shields were down. He had to get closer without taking a hit, so he made a gamble. Picard ordered the Stargazer to charge the enemy ship at warp speed (meaning faster than light), then stop abruptly and fire. By going faster than light, Picard anticipated that the other ship would see two images of the Stargazer : where it reached warp speed and where it stopped. If they fired on the wrong image, they would miss the Stargazer , and Picard could win the battle. Read full article Comments", "date_str": "2026-09-10T17:54:33+00:00", "hash": "8238799e137951bd", "title_fa": "فیزیکدان در \"مانور پیکارد\" در Star Trek محاسبه می کند", "summary_fa": "به نظر می رسد ژان لوک پیکارد سکان دار کشتی ستاره ای حتی بهتر از آنچه نویسندگان می دانستند بود. یک فیزیکدان جزئیات یک ترفند سرعت چرخشی از فصل اول Star Trek: The Next Generation را بررسی کرده و به نکته‌ای ظریف پی برده است که سریال از دست داده است. اما به جای یک حفره طرح، جزئیاتی که او پیدا کرد در واقع مانور را چشمگیرتر می کند ... و همچنین فرصتی عالی برای آموزش در مورد ویژگی کمتر شناخته شده نظریه نسبیت. نیکولاس دی آگویار آلوز، فیزیکدان دانشگاه فدرال ABC در برزیل، اولین بار به عنوان دانشجوی کارشناسی ارشد، نسل بعدی را تماشا کرد. وقتی او به قسمت «نبرد» در فصل اول سریال رسید، طرح داستان او را به یاد درس نسبیت او انداخت. در «نبرد»، یکی از رهبران فرنگی پیکارد را به یاد نبردی می‌اندازد که سال‌ها پیش به‌عنوان کاپیتان کشتی‌ای به نام Stargazer در آن شرکت کرده بود. در زیر آتش یک مهاجم مرموز، سپرهای کشتی پیکارد پایین بود. او مجبور شد بدون ضربه ای نزدیک تر شود، بنابراین قمار کرد. پیکارد به Stargazer دستور داد تا کشتی دشمن را با سرعت تار (به معنی سریعتر از نور) شارژ کند، سپس ناگهان متوقف شود و آتش بگیرد. با حرکت سریعتر از نور، پیکارد پیش بینی کرد که کشتی دیگر دو تصویر از Stargazer را ببیند: جایی که به سرعت پیچ و تاب می رسد و کجا متوقف می شود. اگر آنها به تصویر اشتباه شلیک می کردند، ستاره نگرش را از دست می دادند و پیکارد می توانست در نبرد پیروز شود. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Kimmel's ABC show won't air interview with Democrat because of Trump FCC threats", "link": "https://arstechnica.com/tech-policy/2026/09/kimmels-abc-show-wont-air-interview-with-democrat-because-of-trump-fcc-threats/", "summary": "ABC's Jimmy Kimmel said he will be interviewing a Democratic candidate for Senate tonight, but the interview will be on YouTube only and not broadcast on TV because of threats made by the Federal Communications Commission. Kimmel has been a prime target in the Trump FCC's attacks on ABC and its owner, Disney. In his monologue last night, Kimmel said he'll be interviewing Democrat James Talarico, a state representative who is running against Texas Attorney General Ken Paxton for a seat in the US Senate. In previous years, such an interview would have aired on the broadcast show via local stations throughout the country, Kimmel said. This time, it will only be on the Jimmy Kimmel Live YouTube channel in order to prevent further trouble for individual stations that hold FCC licenses, he said. Read full article Comments", "date_str": "2026-09-10T17:30:09+00:00", "hash": "23f1936f6033f86a", "title_fa": "برنامه کیمل در ABC به دلیل تهدیدات FCC ترامپ با دموکرات ها مصاحبه نمی کند", "summary_fa": "جیمی کیمل از شبکه ای بی سی گفت که امشب با یک نامزد دموکرات برای مجلس سنا مصاحبه خواهد کرد، اما این مصاحبه فقط در یوتیوب خواهد بود و به دلیل تهدیدات کمیسیون ارتباطات فدرال از تلویزیون پخش نخواهد شد. کیمل هدف اصلی حملات FCC ترامپ به ABC و مالک آن دیزنی بوده است. کیمل در مونولوگ دیشب خود گفت که با جیمز تالاریکو دموکرات، نماینده ایالتی که با کن پکستون، دادستان کل تگزاس برای یک کرسی در سنای ایالات متحده رقابت می کند، مصاحبه خواهد کرد. کیمل گفت که در سال های گذشته، چنین مصاحبه ای از طریق ایستگاه های محلی در سراسر کشور در این برنامه پخش می شد. او گفت که این بار فقط در کانال YouTube Live Jimmy Kimmel خواهد بود تا از مشکلات بیشتر برای ایستگاه های فردی که دارای مجوز FCC هستند جلوگیری شود. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "China’s drone supremacy shows in airlifting bodies and food after Nepal flood disaster", "link": "https://arstechnica.com/gadgets/2026/09/drones-deliver-food-and-remove-bodies-after-nepals-flood-disaster/", "summary": "Chinese-made drones are flying out the bodies of flood victims and delivering food to survivors in the aftermath of devastating flash floods on the border of Nepal and China’s Tibetan region. Nepal’s army has been using four DJI FlyCart 100 drones donated from China to make 10 to 16 aid deliveries each day, according to Reuters . This comes after a partial glacier collapse in the Himalayan mountains unleashed a sudden surge of water, mud, and debris that swept through border crossings, valley communities, and hydropower projects on August 26. The DJI Flycart 100 Drones come with a 98-foot rope and winch system for picking up and dropping off heavy loads. The website of Chinese drone company DJI describes the drones as being able to carry between 187 and 220 pounds, depending on the battery configuration. Read full article Comments", "date_str": "2026-09-10T16:53:52+00:00", "hash": "89db7f2e78d9ea63", "title_fa": "برتری هواپیماهای بدون سرنشین چین در انتقال اجساد و مواد غذایی پس از فاجعه سیل نپال نشان می دهد", "summary_fa": "پهپادهای ساخت چین در پی سیل ویرانگر در مرز نپال و منطقه تبت چین، اجساد قربانیان سیل را به پرواز در می آورند و به بازماندگان غذا می رسانند. به گزارش رویترز، ارتش نپال از چهار پهپاد DJI FlyCart 100 اهدایی از چین برای ارسال 10 تا 16 کمک در روز استفاده کرده است. این اتفاق پس از فروپاشی جزئی یخچال در کوه‌های هیمالیا رخ داد که موج ناگهانی آب، گل و زباله را در گذرگاه‌های مرزی، جوامع دره‌ای و پروژه‌های نیروگاه آبی در 26 آگوست فرا گرفت. پهپادهای DJI Flycart 100 با یک سیستم 98 فوتی برای برداشتن و بلند کردن بار می‌آیند. وب سایت شرکت چینی پهپاد DJI این پهپادها را می تواند بین 187 تا 220 پوند، بسته به پیکربندی باتری، حمل کند. نظرات مقاله کامل را بخوانید"}, {"source": "Wired", "title": "This Man Has a Cult Internet Following Over His Olive Garden Lifetime Pasta Pass", "link": "https://www.wired.com/story/this-man-has-a-cult-internet-following-over-his-olive-garden-lifetime-pasta-pass/", "summary": "Braden Sinclair is one of just 50 people in the world who can have unlimited pasta at the chain for life. Now, fans are deciding what he should eat next.", "date_str": "2026-09-11T11:00:00+00:00", "hash": "a6e45cae068fd2e6", "title_fa": "این مرد از طریق پاستا ماکارونی مادام العمر باغ زیتون، اینترنت پرستیزی دارد", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان همه می‌دانند که وقتی در باغ زیتون هستید، خانواده هستید. اما در ۴۴ سالی که از تأسیس رستوران‌های زنجیره‌ای معمولی ایتالیایی-آمریکایی می‌گذرد، تعداد کمی آن را با شور و حرارتی که برادن سینکلر دارد، پذیرفته‌اند. در واقع، در روزهایی که در لیگ کوچولو داشت، یک مربی او را \"Breadsticks\" نامید. سینکلر به WIRED می‌گوید: «من مجبور شدم برای تولدم به باغ زیتون بروم، خیلی غذا خوردم، یک بازی کامل را از دست دادم. یکی از مربیانم تصمیم گرفت که به دلیل حرف اولم B.S و شماره 11 من - که به گفته خودش شبیه نان است - و بعد از آن داستان، باید برای بقیه فصل \"Breadsticks\" نامیده شوم.\" او این رابطه نزدیک را با این زنجیره برای سال‌ها حفظ کرد، تا اینکه در سال 2019 با یک تمایز تقریباً غیرقابل پاداش دریافت کرد: سینکلر یکی از 50 انسان روی این سیاره است که همیشه پاستا ماکارونی مادام‌العمر باغ زیتون را تضمین می‌کند. برخلاف هزاران پاستا بی پایان 13 هفته ای که این زنجیره از سال 2014 در فواصل زمانی مختلف ارائه کرده است - در تابستان امسال، یک دسته 10000 عددی به قیمت هر عدد 100 دلار در عرض چند ثانیه فروخته شد - کارت طلایی سنگین سینکلر تاریخ انقضا ندارد. این حق را به او می دهد که تا زمانی که زنجیره دوام دارد و مشتری وفادار باقی می ماند، به همان اندازه پاستا، تاپینگ، نان، سوپ یا سالاد بخورد. (البته، برای روشن بودن، تحویل وجود ندارد. یک کاسه ماکارونی آنقدر بی انتها می‌خواهد که برای تجربه غذا خوردن در جایگاه افتخاری قرار گیرد.) سینکلر دقیقاً چگونه از حقوق پادشاهی خود در باغ زیتون استفاده می‌کند؟ همه چیز در وب‌سایت جدید او، Lifetimepastapass.com، نشان داده شده است، جایی که او اعداد و ارقام زیادی را"}, {"source": "Wired", "title": "8 Best Travel Adapters (2026): 20+ Models Tested", "link": "https://www.wired.com/gallery/best-travel-adapters/", "summary": "When going abroad, the right plugs are essential to keep your gadgets charged. These are my favorite travel adapters and chargers that I’ve tested myself.", "date_str": "2026-09-11T11:00:00+00:00", "hash": "8b8f069088659eb9", "title_fa": "8 بهترین آداپتور مسافرتی (2026): بیش از 20 مدل آزمایش شده", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان در این مقاله برجسته شده است بهترین آداپتور مسافرتی کلی Ceptics S آداپتور مسافرتی جهانی GAN 100W بیشتر بخوانید 51 دلار آمازون بهترین آداپتور مسافرتی جمع و جور Epicka آداپتور مسافرتی هوایی بیشتر بخوانید 40 دلار آمازون بهترین آداپتور مسافرتی ارزان قیمت Amazonet Adapter Travel Adap 6 in 1 مجموعه دوشاخه آداپتور Ceptics برای سفرهای بین‌المللی در سراسر جهان بیشتر بخوانید 15 دلار آمازون (مجموعه 5 تایی) چه برنامه‌ریزی برای یک سفر عازم کشوری یا یک سفر کاری سریع داشته باشید، سفر شما با بهترین آداپتورهای مسافرتی راحت‌تر پیش خواهد رفت که به شما امکان می‌دهند با خیال راحت همه وسایل خود را در هر کجا که فرود می‌آیید شارژ کنید. پس از بسیاری از سفرهای کاری و تعطیلات خانوادگی، چندین گزینه را آزمایش کردم - هم گزینه های جهانی و هم اساسی - و موارد مورد علاقه من در بیشتر نقاط جهان کار می کنند. بهترین آداپتورها هدایای عالی برای مسافران می‌سازند و سزاوار جایگاهی در چمدان شما هستند، اما سایر راهنماهای سفر ما مانند بهترین لوازم ضروری سفر، بهترین فناوری سفر برای خانواده‌ها، بهترین بالش‌های مسافرتی، و بهترین کابل‌های USB-C را بررسی کنید."}, {"source": "Wired", "title": "I Fixed a Tractor Using John Deere’s Self-Repair Service. Farmers Aren’t Sold on It", "link": "https://www.wired.com/story/i-fixed-a-tractor-john-deere-self-repair-service/", "summary": "The agricultural machine manufacturer has a subscription service that lets owners repair their own equipment. Why is barely anybody using it?", "date_str": "2026-09-11T10:45:00+00:00", "hash": "b099113422616920", "title_fa": "من یک تراکتور را با استفاده از خدمات خود تعمیر جان دیر تعمیر کردم. کشاورزان روی آن فروخته نمی شوند", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان مشکلی در تراکتور وجود دارد. سنسور آب در سوخت، دستگاه کوچکی که در دستگاه جان دیر تعبیه شده است و یکپارچگی موتور دیزل آن را کنترل می کند، قطع شده است. و باید درستش کنم من مکانیک یا کشاورز نیستم. من در دفتر شرکت جان دیر در سانتا کلارا، کالیفرنیا به یک لپ‌تاپ نگاه می‌کنم. کابلی وجود دارد که کامپیوتر را به یک تراکتور 5130 میلی لیتری که روی چمن نزدیک آن نشسته وصل می کند. یک اعلان قرمز روشن روی صفحه می‌نشیند و به من می‌گوید چیزی اشتباه است. من یک سوال تایپ می کنم و نرم افزار دستورالعمل ها و چند تصویر را از دفترچه راهنمای کاربر که با شماره سریال دستگاه مطابقت دارد، می گیرد. عکس: بون اشورث به سمت تراکتور سرگردان می شوم و قطعاتی را که روی صفحه مدل شده اند، پیدا می کنم. من حسگر را با دو سیم آویزان بسیار واضح که باید به هم وصل شوند، می بینم. آنها را روی هم فشار می دهم، صدای کلیکی را می شنوم، سپس دور می شوم و به صفحه نگاه می کنم. اعلان پاک شد. به نظر می رسد همه چیز خوب است. فقط در چند دقیقه، به تنهایی، سنسور آب در سوخت را تعمیر کردم. این اصلاح یک راه حل آسان بود. این یک WiF است، واقعا. عکس: بون اشورث کارمندان جان دیر در اطراف من تبریک می گویند. همه آنها با من بسیار صبور بوده اند، کسی که چندین مقاله برای WIRED در مورد عدم تمایل ظاهرا  Orbital و Marlan Space برنامه‌ای یک میلیارد دلاری برای افزایش مجموعه ماهواره‌های مجهز به هوش مصنوعی خود از 10 ماهواره به 50 ماهواره اعلام کرده‌اند و میسترال مدل‌های هوش مصنوعی را در آن عرضه می‌کند. این دو شرکت این طرح را در یک بیانیه مطبوعاتی در 9 سپتامبر ارائه کردند. آنها گفتند که امانوئل مکرون، رئیس جمهور فرانسه آن را در فضای بین المللی اعلام کرد [ ] این داستان در The Next Web ادامه دارد"}, {"source": "The Next Web", "title": "HelmGuard raises $7.3m to replace compliance paperwork with AI agents", "link": "https://thenextweb.com/news/helmguard-7-3m-seed-ai-compliance-agents", "summary": "London startup HelmGuard has raised $7.3m in seed funding. It uses AI agents to check how companies manage security and compliance. Infinity Ventures and Frontline co-led the round, the company said in its funding announcement on 9 September. FinTech Collective, Stage 2 Capital and Entrepreneurs First also invested. John Daley, the chief executive, and Jack [ ] This story continues at The Next Web", "date_str": "2026-09-11T10:45:47+00:00", "hash": "43191696274fa1d6", "title_fa": "HelmGuard 7.3 میلیون دلار جمع آوری می کند تا اسناد انطباق را با عوامل هوش مصنوعی جایگزین کند", "summary_fa": "استارتاپ هلم گارد لندن 7.3 میلیون دلار سرمایه اولیه جذب کرده است. از عوامل هوش مصنوعی برای بررسی نحوه مدیریت امنیت و انطباق شرکت ها استفاده می کند. این شرکت در اطلاعیه تامین مالی خود در 9 سپتامبر گفت که Infinity Ventures و Frontline دور را رهبری کردند. FinTech Collective، Stage 2 Capital و Entrepreneurs First نیز سرمایه گذاری کردند. جان دیلی، مدیر اجرایی، و جک [ ] این داستان در وب بعدی ادامه دارد"}, {"source": "The Next Web", "title": "Macron’s Paris space summit ends with €20bn in commitments and 51 signed deals", "link": "https://thenextweb.com/news/macron-paris-space-summit-20bn-51-deals-nyx-iris2", "summary": "The first International Space Summit closed at the Grand Palais in Paris on Thursday with about €20bn in announced investment and 51 deals signed, after two days in which European governments tried to convert a long-running argument about dependence on American launch providers into contracts. Euronews, which covered both days from the venue, reported the headline [ ] This story continues at The Next Web", "date_str": "2026-09-11T08:49:21+00:00", "hash": "4f7364d5cfe2af75", "title_fa": "نشست فضایی مکرون در پاریس با 20 میلیارد یورو تعهدات و 51 قرارداد امضا شده به پایان می رسد", "summary_fa": "اولین اجلاس بین المللی فضایی در Grand Palais پاریس روز پنجشنبه با حدود 20 میلیارد یورو سرمایه گذاری اعلام شده و 51 قرارداد امضا شد، پس از دو روز که در آن دولت های اروپایی تلاش کردند بحث طولانی مدت در مورد وابستگی به ارائه دهندگان پرتاب آمریکایی را به قرارداد تبدیل کنند. یورونیوز که هر دو روز را از محل برگزاری پوشش می داد، تیتر را گزارش کرد [ ] این داستان در The Next Web ادامه دارد."}, {"source": "MIT Tech Review", "title": "The Download: biotech’s future and cheaper, cleaner steel", "link": "https://www.technologyreview.com/2026/09/11/1143879/the-download-biotech-future-cheaper-cleaner-steel/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. Meet the under-35s shaping the future of biotech Every year, MIT Technology Review puts together our 35 Innovators Under 35 , a list of some of the brightest and best young minds working across science and technology. This year’s honorees include nine people transforming biotech, whose work spans everything from lifesaving innovations to groundbreaking longevity tech. Their innovations include a “reprogramming” therapy that reverses vision loss, tiny brain electrodes inspired by Japanese art, and a personalized gene-editing treatment for a baby with a rare genetic disorder. There are even efforts to design new viruses with generative AI, which (hopefully) will produce new drugs or soak up pollution. Get to know the biotech innovators behind these breakthroughs . —Jessica Hamzelou This story is from The Checkup, our weekly biotech newsletter. Sign up to receive it in your inbox every Thursday. Biotechnology is one of four categories in our 35 Innovators Under 35 list for 2026, featuring young people worldwide doing groundbreaking work in science and technology. Meet the rest of them here , or explore the full list across the AI, computing and robotics, biotechnology, and climate and energy categories. This founder is making cheaper, cleaner steel The steel industry isn’t exactly known for innovation. Very little has changed about purifying iron ore since the process was invented and commercialized in the 1850s. But Laureen Meroueh, founder of Hertha Metals, has an idea that could change that. Meroueh may have found a way to clean up steelmaking without driving up the price. Her new furnace turns iron ore into refined liquid steel in a single step and swaps coal for natural gas. Together, those changes slash emissions by at least half, she says, and cut costs by 25% compared with steelmaking as usual. Here’s how she plans to make steel cleaner without making it more expensive . —Bridget Reed Morawski Laureen Meroueh is one of the climate change and energy honorees on our 35 Innovators Under 35 list . The must-reads I’ve combed the internet to find you today’s most fun/important/scary/fascinating stories about technology. 1 Anthropic says it has blocked potential plots to build biological weapons The company identified five such cases. ( NYT $) + And six cases of using AI to build software for conventional weapons ( BBC ) ", "date_str": "2026-09-11T12:10:00+00:00", "hash": "f0e8436c208ab928", "title_fa": "دانلود: آینده بیوتکنولوژی و فولاد ارزان تر و تمیزتر", "summary_fa": "این نسخه امروز دانلود است، خبرنامه روزهای هفته ما که دوز روزانه ای از آنچه در دنیای فناوری می گذرد را ارائه می دهد. با افراد زیر 35 سال آشنا شوید که آینده بیوتکنولوژی را شکل می دهند، MIT Technology Review هر سال 35 مبتکر زیر 35 سال ما را گرد هم می آورد، فهرستی از برخی از باهوش ترین و بهترین ذهن های جوان که در علم و فناوری کار می کنند. برگزیدگان امسال شامل 9 نفر هستند که بیوتکنولوژی را متحول می‌کنند، که کارشان از نوآوری‌های نجات جان گرفته تا فناوری پیشگامانه طول عمر را در بر می‌گیرد. نوآوری‌های آن‌ها شامل درمان «برنامه‌ریزی مجدد» است که از دست دادن بینایی را معکوس می‌کند، الکترودهای کوچک مغز با الهام از هنر ژاپنی، و درمان شخصی‌سازی شده برای ویرایش ژن برای نوزاد مبتلا به یک اختلال ژنتیکی نادر. حتی تلاش‌هایی برای طراحی ویروس‌های جدید با هوش مصنوعی مولد وجود دارد که (امیدوارم) داروهای جدید تولید کند یا آلودگی را جذب کند. با نوآوران بیوتکنولوژی در پشت این پیشرفت ها آشنا شوید. جسیکا همزلو این داستان از The Checkup، خبرنامه هفتگی بیوتکنولوژی ما است. ثبت نام کنید تا هر پنجشنبه آن را در صندوق پستی خود دریافت کنید. بیوتکنولوژی یکی از چهار دسته در فهرست 35 مبتکر زیر 35 سال ما برای سال 2026 است که جوانانی را در سراسر جهان در حال انجام کارهای پیشگامانه در علم و فناوری نشان می دهد. بقیه آنها را در اینجا ملاقات کنید، یا فهرست کامل را در رده های هوش مصنوعی، محاسبات و رباتیک، بیوتکنولوژی، و آب و هوا و انرژی کاوش کنید. این بنیانگذار فولاد ارزان تر و تمیزتر می سازد صنعت فولاد دقیقاً به دلیل نوآوری شناخته شده نیست. از زمان اختراع و تجاری سازی این فرآیند در دهه 1850، تغییرات بسیار کمی در مورد تصفیه سنگ آهن ایجاد شده است."}, {"source": "MIT Tech Review", "title": "Meet the under-35s shaping the future of biotech", "link": "https://www.technologyreview.com/2026/09/11/1143834/meet-the-under-35s-shaping-the-future-of-biotech/", "summary": "Every year, MIT Technology Review puts together a list of some of the brightest and best young minds working across science and technology. Our 35 Innovators Under 35 are the ones to watch—people whose research and technical work stands to shape the future of their fields. This year, the list includes nine people who are transforming biotech. And this week, I’m going to give you a taste of some of the very cool stuff five of them are working on, which includes lifesaving innovations and groundbreaking “age reversal” tech. 1. Preventing maternal deaths Let’s start with Paschal Kija, a 28-year-old who has developed a device to treat postpartum hemorrhage—a dangerous birth complication that contributes to around 29% of maternal deaths in his home country, Tanzania. The Mkanda Salama (“Safe Wrap” in Swahili) is easy to use and costs just $70. A study found that it stopped postpartum bleeding in 73% of women within 20 minutes. 2. Making brain electrodes inspired by Japanese art For decades, scientists have been developing, testing, and implanting brain electrodes. These devices are literally inserted into people’s brains, so while they can help us understand brain activity and treat various neurological disorders, it’s not totally surprising that they can also cause a bit of damage. Xiao Yang, 34, is working on ultra-small electrodes, which she hopes will have less of an impact on surrounding brain tissue. Her electrodes are flexible, too—in fact, they look a lot like actual neurons. Yang is also creating sheets of electrodes to study brain cells in the lab. Inspired by kirigami—the traditional Japanese art of cutting paper to form three-dimensional shapes—she’s created a sheet of electrodes with a honeycombed structure shaped like a spiral basket. And she’s already using it to study brain cells. 3. Developing an all-new treatment for baby KJ In 2024, Kyle “KJ” Muldoon Jr. was born with a rare and potentially fatal genetic disorder. Sarah Grandinette was a member of a team that developed an entirely new, personalized treatment for him—a gene-editing therapy essentially designed to correct a genetic misspelling. Grandinette, who is now 26, created cells with KJ’s genetic variant and used them to screen gene-editing approaches; then she tested potential medicines in mice and monkeys. KJ ultimately got his first dose of the resulting treatment when he was about seven months old. He responded well and was eventually discharged from hospital. He’s “doing pretty grea", "date_str": "2026-09-11T09:00:00+00:00", "hash": "1d8bdbe6878840ab", "title_fa": "با افراد زیر 35 سال آشنا شوید که آینده بیوتکنولوژی را شکل می دهند", "summary_fa": "هر سال، MIT Technology Review فهرستی از برخی از باهوش ترین و بهترین ذهن های جوان که در زمینه علم و فناوری کار می کنند را گردآوری می کند. 35 مبتکر زیر 35 سال ما کسانی هستند که باید تماشا کنند - افرادی که کارهای تحقیقاتی و فنی آنها برای شکل دادن به آینده رشته هایشان است. امسال، این لیست شامل 9 نفر است که در حال تغییر بیوتکنولوژی هستند. و این هفته، من می‌خواهم برخی از چیزهای بسیار جالبی که پنج نفر از آن‌ها روی آن‌ها کار می‌کنند، که شامل نوآوری‌های نجات‌بخش و فناوری پیشگامانه «معکوس سن» است را به شما بچشم. 1. پیشگیری از مرگ و میر مادران بیایید با پاسکال کیجا شروع کنیم، یک جوان 28 ساله که دستگاهی را برای درمان خونریزی پس از زایمان ساخته است - یک عارضه خطرناک هنگام تولد که در حدود 29٪ از مرگ و میر مادران در کشورش، تانزانیا، نقش دارد. استفاده از Mkanda Salama (به زبان سواحیلی \"Safe Wrap\") آسان است و فقط 70 دلار قیمت دارد. یک مطالعه نشان داد که خونریزی پس از زایمان را در 73 درصد از زنان در عرض 20 دقیقه متوقف کرد. 2. ساخت الکترودهای مغز با الهام از هنر ژاپنی برای چندین دهه، دانشمندان در حال توسعه، آزمایش و کاشت الکترودهای مغز بوده اند. این دستگاه‌ها به معنای واقعی کلمه در مغز افراد قرار می‌گیرند، بنابراین در حالی که می‌توانند به ما در درک فعالیت مغز و درمان اختلالات عصبی مختلف کمک کنند، اصلاً تعجب‌آور نیست که می‌توانند کمی آسیب نیز ایجاد کنند. شیائو یانگ، 34 ساله، روی الکترودهای بسیار کوچک کار می کند، که امیدوار است تأثیر کمتری بر بافت مغز اطراف داشته باشد. الکترودهای او نیز انعطاف پذیر هستند - در واقع، آنها بسیار شبیه نورون های واقعی هستند. یانگ همچنین در حال ایجاد صفحات الکترود برای مطالعه سلول های"}, {"source": "Zoomit", "title": "ناسا شرکت بلو ارجین را مسئول ساخت مدارگرد مریخی بعدی خود کرد", "link": "https://www.zoomit.ir/space/466982-blue-origin-build-nasa-next-mars-orbiter/", "summary": "بلو ارجین با دریافت قراردادی به ارزش ۷۰۰ میلیون دلار، وظیفه دارد مدارگرد مخابراتی مریخ را تا ۳۱ دسامبر ۲۰۲۸ به ناسا تحویل دهد.", "date_str": "2026-09-11T14:15:00+00:00", "hash": "747a16da62cdc5a7", "title_fa": "ناسا شرکت بلو ارجین را مسئول ساخت مدارگرد مریخی بعدی خود کرد", "summary_fa": "بلو ارجین با دریافت قراردادی به ارزش ۷۰۰ میلیون دلار، وظیفه دارد مدارگرد مخابراتی مریخ را تا ۳۱ دسامبر ۲۰۲۸ به ناسا تحویل دهد. تبلیغات ناسا می‌گوید بلو ارجین، شرکت فضایی متعلق به جف بیزوس را برای ساخت مدارگرد مریخی بعدی خود به نام «شبکه مخابراتی مریخ» (MTN) انتخاب کرده است. ارزش قرارداد ساخت این شبکه ۷۰۰ میلیون دلار است و انتظار می‌رود تا سال ۲۰۳۰ در سیاره سرخ عملیاتی شود. مقام‌های ناسا در بیانیه‌ای گفتند : «این قرارداد نقطه عطفی در راهبرد ناسا برای گسترش خدمات ارتباطی و ناوبری فراتر از زمین و ماه است و پایه‌ای برای اکتشاف مستمر مریخ در دهه‌های آینده ایجاد می‌کند.» شبکه مخابراتی مریخ که پیش‌تر مدارگرد مخابراتی مریخ (MTO) نام داشت، عمدتاً برای کمک به مأموریت‌های علمی ناسا طراحی خواهد شد و قرار نیست خودش به جمع‌آوری داده‌های علمی بپردازد. مقام‌های ناسا در بیانیه خود گفتند: «ام‌تی‌ان یک سامانه ارتباطی نسل بعدی است که امکان برقراری ارتباطات مطمئن و پهن‌باند و ارائه خدمات ناوبری را برای مأموریت‌های کنونی و آتی مریخ فراهم خواهد کرد.» انتظار می‌رود نیاز به فضاپیمای انتقال‌دهنده داده در سیاره سرخ، در سال‌های آینده به‌شدت افزایش یابد؛ زیرا اعضای ناوگان کنونی مدارگردهای مریخ ناسا دیگر پا به سن گذاشته‌اند و این سازمان نیز در حال آماده‌سازی سطح سیاره سرخ برای مأموریت‌های سرنشین‌دار در اواخر دهه ۲۰۳۰ یا اوایل دهه ۲۰۴۰ است."}, {"source": "Zoomit", "title": "ویدیو رونمایی آیفون دوئو شامل یک اشاره زیرپوستی به سرفیس است!", "link": "https://www.zoomit.ir/mobile/467024-apple-iphone-duo-easter-egg/", "summary": "اپل در ویدیوی تبلیغاتی گوشی تاشدنی آیفون دوئو، اشاره‌ای زیرپوستی به سرفیس مایکروسافت گنجانده است.", "date_str": "2026-09-11T14:04:52+00:00", "hash": "fdb38444830abc92", "title_fa": "ویدیو رونمایی آیفون دوئو شامل یک اشاره زیرپوستی به سرفیس است!", "summary_fa": "اپل در ویدیوی تبلیغاتی گوشی تاشدنی آیفون دوئو، اشاره‌ای زیرپوستی به سرفیس مایکروسافت گنجانده است. تبلیغات همان‌طور که انتظار می‌رفت، اپل با رونمایی از گوشی آیفون دوئو توجه رسانه‌ها را به رویکرد تازه‌ی خود جلب کرد. خبرنگار و دهند. بدنه‌ی دستگاه شامل پین‌های پوگو برای شارژ، سطحی صاف ویژه‌ی کنترل‌های لمسی و بخش خروجی صدای گرد برای ارگونومی بهتر است. کدهای رؤیت شده در اپلیکیشن Galaxy Wearable تأیید می‌کنند هدفون جدید از ژست‌های حرکتی سر، قابلیت تنظیم خودکار صدا و بوست حجم خروجی پشتیبانی می‌کند. کاربران به دستیارهای صوتی بیکسبی و گوگل جمنای دسترسی دارند و سامسونگ ضبط صدا و خلاصه‌سازی هوشمند با Galaxy AI را نیز در نظر گرفته است. هدفون جدید قابلیت تشخیص خوابیدن کاربر و متوقف‌کردن خودکار پخش موسیقی را ارائه می‌دهد. گزارش‌ها نشان می‌دهند ویژگی‌هایی مثل حذف نویز فعال (ANC) و صدای ۳۶۰ درجه در مشخصات فنی نهایی غایب خواهند بود."}, {"source": "Zoomit", "title": "اپلیکیشن «متا میوس» به رتبه دوم اپ استور صعود کرد", "link": "https://www.zoomit.ir/software-news/467002-meta-muse-ai-agent-launch/", "summary": "دستیار هوش مصنوعی جدید متا «میوز» به دومین اپلیکیشن پردانلود در اپ استور آمریکا تبدیل شد.", "date_str": "2026-09-11T08:30:00+00:00", "hash": "66b01d86a901a665", "title_fa": "اپلیکیشن «متا میوس» به رتبه دوم اپ استور صعود کرد", "summary_fa": "دستیار هوش مصنوعی جدید متا «میوز» به دومین اپلیکیشن پردانلود در اپ استور آمریکا تبدیل شد. تبلیغات اپلیکیشن هوش مصنوعی جدید متا با نام میوس پس از انتشار در بازار ایالات متحده، جایگاه دوم جدول برترین برنامه‌های فروشگاه اپ استور را به خود اختصاص داد. متا با این محصول، ورود جدی خود را به حوزه‌ی دستیارهای هوشمند کارگزار را اعلام کرد. بر اساس آمار مؤسسه آماری سنسور تاور ، نسخه‌ی آیفون این برنامه بیش از ۸۳ هزار بار در آمریکا دانلود شده است. آمار ثبت‌شده در مقایسه با شروع سایر سرویس‌های متا نظیر تردز با بیش از ۴٫۳ میلیون بار دانلود در روز نخست یا ChatGPT با نیم میلیون نصب در هفته اول، شروعی آرام‌تر را نشان می‌دهد. نسخه‌ی اندرویدی میوس تاکنون به رتبه‌ی ۳۳۸ دسته‌ی ابزارهای کاربردی پلی استور رسیده و آمار نسخه‌های تحت وب و واتساپ در این داده‌ها لحاظ نشده است. هم‌زمان رقبای دیگری نظیر Instinct با ارزش‌گذاری ۲٫۵ میلیارد دلار و جذب سرمایه ۳۵۰ میلیون دلاری، رقابت را در این بخش تشدید کرده‌اند."}, {"source": "Zoomit", "title": "شیائومی تبلت رده‌بالای «پد ۹ پرو» را با ۱۲ گیگابایت رم و اندروید ۱۷ تولید می‌کند", "link": "https://www.zoomit.ir/tablet/466946-xiaomi-pad-9-pro-geekbench/", "summary": "تبلت شیائومی پد ۹ پرو با تراشه‌ی اسنپدراگون ۸ نسل ۵ و اندروید ۱۷ رؤیت شد.", "date_str": "2026-09-11T07:50:00+00:00", "hash": "b3724ccaf94fb2c6", "title_fa": "شیائومی تبلت رده‌بالای «پد ۹ پرو» را با ۱۲ گیگابایت رم و اندروید ۱۷ تولید می‌کند", "summary_fa": "تبلت شیائومی پد ۹ پرو با تراشه‌ی اسنپدراگون ۸ نسل ۵ و اندروید ۱۷ رؤیت شد. تبلیغات تبلت پرچمدار شیائومی پد ۹ پرو با شماره‌مدل 2612CRPFFC در دیتابیس گیک‌بنچ رؤیت شد . داده‌های ثبت‌شده نشان می‌دهند این دستگاه از پردازنده‌ی قدرتمند اسنپدراگون ۸ نسل ۵ همراه با ۱۲ گیگابایت رم و اندروید ۱۷ بهره می‌برد. تراشه‌ی کوالکام با شناسه‌ی فنی QTI SM8845P دارای ساختار هشت هسته‌ای شامل دو هسته با فرکانس ۳٫۸۰ گیگاهرتز و ۶ هسته با فرکانس ۳٫۳۲ گیگاهرتز است. پردازش گرافیکی را واحد Adreno 829 بر عهده دارد. نسخه‌ی آزمایشی تبلت شیائومی در آزمون‌های تک‌هسته‌ای و چندهسته‌ای گیک‌بنچ ۷ به‌ترتیب امتیازهای ۲٬۰۷۵ و ۸٬۷۵۰ را ثبت کرد. اطلاعات فاش‌شده نشان می‌دهند تبلت جدید مجهز به نمایشگر ۱۲٫۱ اینچی ال‌سی‌دی با وضوح 3.2K و نرخ نوسازی ۱۴۴ هرتز خواهد بود. تامین انرژی دستگاه بر عهده‌ی باتری ۱۱٬۰۰۰ میلی‌آمپرساعتی با پشتیبانی از شارژ سیمی ۶۷ وات قرار دارد. نسل پیشین با نمایشگر ۱۱٫۲ اینچی، تراشه‌ی اسنپدراگون ۸ الیت و باتری ۹٬۲۰۰ میلی‌آمپرساعتی روانه‌ی بازارهای جهانی شده بود. سبد محصولات تبلت شیائومی اکنون با تنوع بیشتری گسترش می‌یابد. درحالی‌که پد ۹ پرو مکس با نمایشگر ۱۳٫۳ اینچی و تراشه‌ی اختصاصی Xring O3 در بازار چین عرضه شده است، پد ۹ پرو پرچمداری جمع‌وجورتر با تراشه‌ی کوالکام به‌شمار می‌رود."}, {"source": "Zoomit", "title": "تعمیر آیفون ۱۸ پرو کمی ساده‌تر از آیفون ۱۷ پرو است", "link": "https://www.zoomit.ir/mobile/466993-iphone-18-pro-repairability-slightly-better-than-17-pro/", "summary": "اپل برای آیفون ۱۸ پرو امتیاز تعمیرپذیری بالاتری ثبت کرد، اما تفاوت با نسل قبل بسیار کم است.", "date_str": "2026-09-11T07:00:00+00:00", "hash": "d45c9b653e68ad54", "title_fa": "تعمیر آیفون ۱۸ پرو کمی ساده‌تر از آیفون ۱۷ پرو است", "summary_fa": "اپل برای آیفون ۱۸ پرو امتیاز تعمیرپذیری بالاتری ثبت کرد، اما تفاوت با نسل قبل بسیار کم است. تبلیغات اپل در تازه‌ترین اسناد الزامیِ اتحادیه‌ی اروپا، تعمیر آیفون ۱۸ پرو و آیفون ۱۸ پرو مکس را کمی آسان‌تر از آیفون ۱۷ پرو و آیفون ۱۷ پرو مکس توصیف کرد. اختلاف، بزرگ نیست؛ اما در چند بخش کلیدی دیده می‌شود. این داده‌ها در برگه‌ی اطلاعات رسمی برای رعایت مقررات برچسب‌گذاری انرژی در اتحادیه‌ی اروپا ارائه می‌شود. سازوکار ارزیابی هم بر پایه‌ی خوداظهاری سازندگان شکل گرفته و چندین بخش را در بر می‌گیرد. هر بخش از صفر تا ۵ امتیاز می‌گیرد و در نهایت، یک شاخص کلی ساخته می‌شود. برای آیفون ۱۸ پرو و آیفون ۱۸ پرو مکس، امتیاز کلی به ۳٫۱۴ رسید؛ عددی که نسبت به ۳٫۰۴ در آیفون ۱۷ پرو و آیفون ۱۷ پرو مکس ، ۰٫۱۰ واحد بالاتر است. در بخش ابزارهای لازم برای تعمیر، جهش دیده می‌شود؛ از ۲٫۰۵ به ۲٫۵۵. در مقابل، امتیاز «سازوکار بست‌ها» روی ۳٫۸۰ ثابت مانده و قطعات یدکی مثل قبل امتیاز ۴٫۰ را ثبت کردند. پشتیبانی نرم‌افزاری در این ارزیابی تغییری نکرده و عدد ۱٫۰ را نشان می‌دهد. مقررات اتحادیه‌ی اروپا فقط زمانی امتیاز بالاتری برای هسته‌ی نرم‌افزار در نظر می‌گیرد که سازنده فراتر از حداقل پنج‌ساله‌ی پشتیبانی متعهد شود. بخش اطلاعات تعمیر هم با امتیاز کامل ۵٫۰ بدون تغییر مانده است. جمع‌بندی اولیه از داده‌های اپل این است که بدنه و شیوه‌ی تعمیر دو نسل اخیر، شباهت زیادی دارد و تغییرات بیشتر در سطح جزئیات فنی دیده می‌شود. با این حال، همین جابه‌جایی‌های کوچک در ابزارهای دسترسی و نحوه‌ی بازکردن دستگاه می‌تواند برای تعمیرکاران اهمیت داشته باشد. اسناد نظارتی توضیح نمی‌دهند که اپل دقیقا چه ابزارهای تازه‌ای را در نظر گرفته، اما به‌نظر می‌رسد راه رسیدن به برخی قطعات کمی ساده‌تر شده باشد."}, {"source": "Zoomit", "title": "گوشی شیائومی ۱۸ پرو مکس با پردازنده پرقدرت اسنپدراگون رؤیت شد", "link": "https://www.zoomit.ir/mobile/466944-xiaomi-18-pro-max-geekbench/", "summary": "گوشی شیائومی ۱۸ پرو مکس با تراشه‌ی اسنپدراگون ۸ الیت نسل ۶ پرو و کسب امتیازهای چشمگیر رؤیت شد.", "date_str": "2026-09-11T06:40:00+00:00", "hash": "3b42b587ddaffb3a", "title_fa": "گوشی شیائومی ۱۸ پرو مکس با پردازنده پرقدرت اسنپدراگون رؤیت شد", "summary_fa": "گوشی شیائومی ۱۸ پرو مکس با تراشه‌ی اسنپدراگون ۸ الیت نسل ۶ پرو و کسب امتیازهای چشمگیر رؤیت شد. تبلیغات مشخصات فنی و نتایج بنچمارک گوشی پرچمدار شیائومی ۱۸ پرو مکس در دیتابیس گیک‌بنچ ثبت شد. مدل چینی این محصول با شماره‌مدل M1544F در این آزمون حضور یافت . تراشه‌ی اسنپدراگون ۸ الیت نسل ۶ پرو در گوشی شیائومی مدل ۱۸ پرو مکس هشت هسته دارد. چینش هسته‌ها شامل سه هسته با فرکانس ۳٫۷۴ گیگاهرتز، سه هسته با فرکانس ۴٫۰۳ گیگاهرتز و دو هسته‌ی قدرتمند با فرکانس ۵٫۱۱ گیگاهرتز است. پردازش گرافیکی این تراشه را واحد آدرنو ۸۵۰ بر عهده دارد. پرچمدار بعدی شیائومی در آزمون‌های گیک‌بنچ ۷ موفق به ثبت ۳٬۵۸۲ امتیاز در بخش تک‌هسته‌ای و ۱۲٬۲۴۷ امتیاز در بخش چندهسته‌ای شد. دستگاه مورد آزمایش از ۱۲ گیگابایت رم (۱۱ گیگابایت در دسترس) و سیستم‌عامل اندروید ۱۷ همراه با رابط کاربری HyperOS 4 استفاده می‌کند. نتایج پردازش گرافیکی نشان‌دهنده‌ی کسب ۲۶٬۲۱۰ امتیاز در آزمون OpenCL و ۲۹٬۹۳۴ امتیاز در آزمون Vulkan است. هم‌زمان با نزدیک‌شدن به معرفی تراشه‌های سری دیمنسیتی ۹۶۰۰ مدیاتک و پرچمداران جدید کوالکام، گوشی‌های دیگری نظیر ویوو X500 Pro Max و اوپو Find X10 Pro Max نیز در بنچمارک‌ها مشاهده شده‌اند."}, {"source": "Zoomit", "title": "«آمبولانس ربات‌ها» در ژاپن رونمایی شد", "link": "https://www.zoomit.ir/robotics-smart-machines/467001-japan-humanoid-robot-ambulance-service/", "summary": "غول فناوری ژاپنی از ون امدادی ویژه‌ای برای تعمیر و جایگزینی سریع ربات‌های انسان‌نما در توکیو رونمایی کرد.", "date_str": "2026-09-11T06:28:34+00:00", "hash": "7ec8c23ff5b95d6b", "title_fa": "«آمبولانس ربات‌ها» در ژاپن رونمایی شد", "summary_fa": "غول فناوری ژاپنی از ون امدادی ویژه‌ای برای تعمیر و جایگزینی سریع ربات‌های انسان‌نما در توکیو رونمایی کرد. تبلیغات خیابان‌های توکیو به‌زودی شاهد نوع جدیدی از خودروهای امدادی خواهند بود که برای خدمات‌رسانی به ربات‌های انسان‌نما طراحی شده‌اند. GMO Internet Group، غول فناوری اطلاعات ژاپن، از ونی رونمایی کرد که مهندسان، تجهیزات تعمیراتی، قطعات یدکی و یک ربات انسان‌نمای جایگزین را به محل حادثه منتقل می‌کند. این وسیله‌ی نقلیه نخستین نمونه در ژاپن محسوب می‌شود که به‌طور اختصاصی برای نگهداری و تعمیر ربات‌های انسان‌نما توسعه یافته است. ون مذکور با وجود برخورداری از چراغ‌های بنفش روی سقف و نشان‌های شبیه به آمبولانس، در عمل یک کارگاه تعمیراتی سیار محسوب می‌شود که فضای داخلی‌اش برای قرارگیری ربات‌ها، لپ‌تاپ‌ها و ابزارهای عیب‌یابی بهینه‌سازی شده است. شوتا تاکی‌زاوا ، مهندس شرکت GMO Air، می‌گوید: «آمبولانس انسان‌نما ربات جایگزین را به محل اعزام می‌کند و آن را به‌جای ربات آسیب‌دیده قرار می‌دهد.» اگر فرایند تعمیر در محل ممکن نباشد، ربات آسیب‌دیده به مرکز پشتیبانی منتقل می‌شود و ربات جایگزین وظایف آن را ادامه می‌دهد تا وقفه‌ای در فعالیت‌ها ایجاد نشود."}, {"source": "Zoomit", "title": "متا برای هوش مصنوعی جدیدش آی‌دی Muse را از یک گروه راک گرفت", "link": "https://www.zoomit.ir/ai-articles/466987-muse-meta-ai-handle/", "summary": "گروه راک بریتانیایی میوز نام کاربری ایکس و اینستاگرام خود را به ابزار هوش مصنوعی جدید متا واگذار کرد.", "date_str": "2026-09-11T06:00:00+00:00", "hash": "f98b340a0345c82a", "title_fa": "متا برای هوش مصنوعی جدیدش آی‌دی Muse را از یک گروه راک گرفت", "summary_fa": "گروه راک بریتانیایی میوز نام کاربری ایکس و اینستاگرام خود را به ابزار هوش مصنوعی جدید متا واگذار کرد. تبلیغات گروه راک میوز (Muse) نام کاربری خود در شبکه‌های اجتماعی ایکس و اینستاگرام را به ابزار هوش مصنوعی شخصی جدید متا که آن هم میوز نام دارد، واگذار کرد. این تغییر پس از راه‌اندازی ابزار هوش مصنوعی متا در هفته‌ی جاری رخ داد. فناوری جدید متا در حال حاضر تنها برای کاربران ساکن ایالات متحده در دسترس است و شرکت مادر فیسبوک و اینستاگرام آن را با تأکید بر حریم خصوصی و ایمنی عرضه می‌کند. میوز برای کمک به بزرگسالان در انجام کارهای روزمره مانند زمان‌بندی، خرید، پرداخت و ایمیل طراحی شده و می‌تواند اهداف بلندمدت را به برنامه‌های عملی تبدیل کند. هواداران گروه میوز که سال ۱۹۹۴ در دوون شکل گرفت، متوجه شدند نام کاربری این گروه در ایکس به Musetheband@ تغییر کرده و ابزار هوش مصنوعی متا نام قبلی Muse@ را تصاحب کرده؛ در اینستاگرام نیز وضعیت مشابه است. بسیاری از کاربران به طنز ماجرا اشاره کرده‌اند؛ چرا که میوز با ترانه‌هایی شناخته می‌شود که درباره‌ی آینده‌ای ویران‌شهر هشدار می‌دهند؛ آینده‌ای که در آن فناوری بر انسان‌ها حکومت یا آن‌ها را شست‌وشوی مغزی می‌دهد. یکی از هواداران در ایکس نوشت: «میوز از ساخت آلبوم‌های راک ویران‌شهری که درباره‌ی تسلط ماشین‌ها هشدار می‌دادند به پذیرش خرید از سوی یک شرکت هوش مصنوعی رسیده؛ این یک طنز تلخ درجه‌یک است.»"}, {"source": "Zoomit", "title": "۲۰ شهریور؛ از نخستین راهپیمایی فضایی تجاری تا نجات فضاپیمای آسیب‌دیده در فضا", "link": "https://www.zoomit.ir/time-tunnel/466959-polaris-dawn-space-history-2026-09-11/", "summary": "سال‌ها پیش در چنین روزی، دراگون با کابینی بی‌هوا تاریخ ساخت و یک ماهواره‌ی بازیافتی به دیدار دنباله‌دار رفت.", "date_str": "2026-09-11T05:30:00+00:00", "hash": "af191eac03782579", "title_fa": "۲۰ شهریور؛ از نخستین راهپیمایی فضایی تجاری تا نجات فضاپیمای آسیب‌دیده در فضا", "summary_fa": "سال‌ها پیش در چنین روزی، دراگون با کابینی بی‌هوا تاریخ ساخت و یک ماهواره‌ی بازیافتی به دیدار دنباله‌دار رفت. تبلیغات چهار روایت امروز از دل تصمیم‌هایی بیرون می‌آیند که روی کاغذ نامطمئن یا حتی ناممکن به نظر می‌رسیدند. یک کپسول تجاری دروازه‌اش را رو به خلا گشود، کاوشگری آسیب‌دیده بر ماه نشست و ماهواره‌ای قدیمی صاحب ماموریتی تازه شد. رشته‌ی مشترک قصه‌ها فقط فضا نیست. هر کدام نشان می‌دهد چگونه یک محاسبه، مانور یا راه‌حل مهندسی می‌تواند مرز دانسته‌های بشر را چند گام جلو ببرد. فهرست مطالب وقتی تمام کابین دراگون به خلا باز شد فرودی که نشت هلیوم نتوانست متوقفش کند زندگی دوم یک ماهواره در دُم دنباله‌دار از فاجعه‌ی فرابنفش تا تولد ستاره‌ها کپی لینک وقتی تمام کابین دراگون به خلا باز شد Polaris Dawn چهار فضانورد پولاریس داون هنگام گشوده‌شدن دریچه، پناهگاه جداگانه‌ای نداشتند. کپسول دراگون رزیلینس هیچ محفظه‌ی هوابندی نداشت و برای نخستین راهپیمایی فضایی تجاری، تمام کابین چهارسرنشینه باید از هوا تخلیه می‌شد. جرد آیزاکمن و سارا گیلیس از دریچه بیرون رفتند و اسکات پوتیت و آنا منون داخل کابین لباس فضایی پوشیدند. برای خروج دو فضانورد، هر چهار سرنشین باید با خلا روبه‌رو می‌شدند دو سال پیش، موشک فالکون ۹ مأموریت را از سکوی 39A مرکز فضایی کندی آغاز کرد. پرواز ۵ روزه تا ارتفاع ۱٬۴۰۸٫۱ کیلومتری اوج گرفت و در کنار حدود ۳۶ آزمایش، ارتباط لیزری استارلینک را در مدار آزمود."}, {"source": "Zoomit", "title": "پورت غیررسمی بازی GTA V برای گوشی‌های اندرویدی در راه است", "link": "https://www.zoomit.ir/mobile/466942-gta-v-android-snapdragon-port/", "summary": "توسعه‌دهنده‌ی پورت غیررسمی سوییچ، مشخصات سخت‌افزاری لازم برای اجرای بومی بازی GTA 5 روی گوشی‌های اندرویدی را اعلام کرد.", "date_str": "2026-09-11T04:50:00+00:00", "hash": "29e8860991707fbb", "title_fa": "پورت غیررسمی بازی GTA V برای گوشی‌های اندرویدی در راه است", "summary_fa": "توسعه‌دهنده‌ی پورت غیررسمی سوییچ، مشخصات سخت‌افزاری لازم برای اجرای بومی بازی GTA 5 روی گوشی‌های اندرویدی را اعلام کرد. تبلیغات توسعه‌دهنده‌ای مستقل با نام مستعار M0jso از گروه Paralympics Productions در حال توسعه‌ی نسخه‌ی بومی GTA V برای اندروید است . این پروژه برخلاف روش‌های مبتنی‌بر شبیه‌ساز ویندوز نظیر Winlator، بازی را به‌صورت مستقیم روی نخستین نسخه‌ی عمومی این پورت به تراشه‌ی اسنپدراگون ۸۶۵، ۸ گیگابایت رم و ۶۵ گیگابایت فضای ذخیره‌سازی نیاز دارد. توسعه‌دهنده‌ی پروژه پیش‌تر بازی مذکور را با اتکا به کدهای فاش‌شده در سال ۲۰۲۳ برای کنسول نینتندو سوییچ بازکامپایل کرده بود و اکنون نسخه‌ی اندروید را با همان ساختار توسعه می‌دهد. فهرست سازگاری اولیه‌ی بازی نشان می‌دهد که پردازنده‌های اسنپدراگون 782G، ۸۷۰، ۸۸۸ و سری جدیدتر اسنپدراگون ۸ الیت در دامنه‌ی پشتیبانی رسمی قرار دارند. تراشه‌هایی با امتیاز تک‌هسته‌ای کمتر از ۱۰۶۹ در گیک‌بنچ ۶ توانایی اجرای بازی را دارند؛ اما پایداری عملکرد آن‌ها تضمین نمی‌شود. پشتیبانی از پردازنده‌های اگزینوس سامسونگ با گرافیک Xclipse از جمله مدل‌های ۲۲۰۰ و ۲۴۰۰ و همچنین پردازنده‌های گرافیکی Mali به مراحل بعدی موکول شده است. پورت جدید هنوز تاریخ انتشار مشخصی ندارد و فایل‌های فعلی موجود در اینترنت به پروژه‌های غیررسمی دیگر تعلق دارند."}, {"source": "Zoomit", "title": "مدل ۳۵۰ اسب بخاری هیوندای توسان در راه است؟", "link": "https://www.zoomit.ir/car/466937-hyundai-tucson-n-hybrid-development/", "summary": "هیوندای توسعه‌ی نسخه‌ی قدرتمند و هیبریدی کراس‌اوور محبوب توسان را با توان بالقوه‌ی ۳۵۰ اسب‌بخار آغاز کرده است.", "date_str": "2026-09-11T04:10:00+00:00", "hash": "0cda8888457deb54", "title_fa": "مدل ۳۵۰ اسب بخاری هیوندای توسان در راه است؟", "summary_fa": "هیوندای توسعه‌ی نسخه‌ی قدرتمند و هیبریدی کراس‌اوور محبوب توسان را با توان بالقوه‌ی ۳۵۰ اسب‌بخار آغاز کرده است. تبلیغات هیوندای قصد دارد پرفروش‌ترین محصول خود را به یک شاسی‌بلند اسپرت و بسیار پرقدرت تبدیل کند. گزارش‌های تازه نشان می‌دهند که نسل بعدی توسان به نسخه‌ی پرچمدار و تقویت‌شده‌ی N مجهز خواهد شد و از پیشرانه‌ی هیبریدی با تمرکز ویژه بر قدرت بهره خواهد برد. به گزارش اتو اکسپرس ، توسان N خروجی قدرتی بین ۳۰۰ تا ۳۵۰ اسب‌بخار خواهد داشت و هدفش افزایش چشمگیر شتاب خودرو بدون فداکردن بازدهی مصرف سوخت است. کراس‌اور جدید هیوندای با تکیه بر همین قوای محرکه می‌تواند به رقیبی مستقیم برای تویوتا راو ۴ جی‌آر اسپرت با توان ۳۲۰ اسب بخار تبدیل شود. جون پارک ، نایب‌رئیس گروه مدیریت بخش N هیوندای، گفت: «ما خود را به خودروهای برقی محدود نمی‌کنیم. ما مسیر خودروهای مجهز به موتورهای احتراق داخلی را نیز ادامه خواهیم داد؛ اینجا پایان سفر ما نیست. من نمی‌توانم مشخصات دقیق را به شما بگویم، اما سبکی، چابکی، واکنش‌پذیری و هیجان بیشتر، عناصر کلیدی هدفی هستند که به سوی آن حرکت می‌کنیم.» نسل جدید توسان به دلیل ابعاد بزرگ‌تر، فضای کافی برای تعبیه‌ی سامانه‌های هیبریدی سنگین‌تر را در اختیار مهندسان قرار می‌دهد. هیوندای پالیسید هیبرید با موتور ۲٫۵ لیتری چهار سیلندر و دو موتور برقی توان ترکیبی ۳۲۰ اسب‌بخار تولید می‌کند و استفاده از ساختاری مشابه در نسخه‌ی عملکردی توسان محتمل خواهد بود. بهبود سیستم تعلیق تطبیقی و ارتقای ترمزها نیز جزو مشخصات فنی قطعی این کراس‌اوور اسپرت کره‌ای خواهد بود."}, {"source": "Zoomit", "title": "خبری از نمایشگر نیست؛ خودرو اقتصادی جدید اروپا روی سنت‌گرایی تمرکز دارد", "link": "https://www.zoomit.ir/car/466951-dacia-spring-no-screen-ev/", "summary": "مدل پایه‌ی خودروی الکتریکی داچیا اسپرینگ برای کاهش هزینه‌ها، نمایشگر مرکزی لمسی را حذف کرده و گوشی هوشمند کاربر را جایگزین آن می‌کند.", "date_str": "2026-09-11T02:30:00+00:00", "hash": "0a066c70c0c18437", "title_fa": "خبری از نمایشگر نیست؛ خودرو اقتصادی جدید اروپا روی سنت‌گرایی تمرکز دارد", "summary_fa": "مدل پایه‌ی خودروی الکتریکی داچیا اسپرینگ برای کاهش هزینه‌ها، نمایشگر مرکزی لمسی را حذف کرده و گوشی هوشمند کاربر را جایگزین آن می‌کند. تبلیغات مدل پایه‌ی خودروی برقی داچیا اسپرینگ با هدف کاهش حداکثری هزینه‌ها، بدون نمایشگر لمسی در داشبورد روانه‌ی بازار می‌شود . شرکت رومانیایی تابعه‌ی رنو به‌جای نصب مانیتورهای گران‌قیمت، سیستمی با نام Media Control را به کار گرفته که به رانندگان اجازه می‌دهد گوشی شخصی خود را به داشبورد متصل کنند و از آن به‌عنوان سیستم چندرسانه‌ای، ناوبری و برقراری تماس استفاده کنند. داچیا جایگاه ویژه‌ای روی داشبورد برای نگهداری موبایل تعبیه کرده و دکمه‌های کنترل روی فرمان، مدیریت امکانات اصلی را بدون لمس مداوم گوشی ممکن می‌کند. قیمت مدل پایه‌ی اسپرینگ در فرانسه از ۱۷٬۹۰۰ یورو (معادل ۲۰٬۸۰۰ دلار) آغاز می‌شود که با اعمال یارانه‌های دولتی خودروهای پاک، به ۱۴٬۲۸۰ یورو (معادل ۱۶٬۶۰۰ دلار) کاهش می‌یابد. تیپ مجهزتر این خودرو ۱۹٬۴۰۰ یورو قیمت دارد که امکاناتی نظیر صفحه‌نمایش ۱۰ اینچی را ارائه می‌دهد. مدل پایه‌ی اسپرینگ با وجود حذف نمایشگر مرکزی و دکمه‌ی استارت در ازای حفظ سوییچ سنتی، تجهیزات استانداردی مانند پشت‌آمپر دیجیتال ۷ اینچی، ترمز پارک برقی، سیستم تهویه‌ی مطبوع و رینگ‌های فولادی ۱۵ اینچی دو‌رنگ دارد. شیشه‌های عقب هر دو تیپ مانند رنو توئینگو به سمت بیرون باز می‌شوند و بالا و پایین نمی‌روند. داچیا برای تطابق با استانداردهای ایمنی اتحادیه‌ی اروپا، تجهیزاتی نظیر ترمز اضطراری خودکار با قابلیت تشخیص عابر پیاده، دستیار حفظ خودرو در مسیر، تابلوخوان و سیستم پایش هوشیاری راننده را به‌صورت استاندارد در اسپرینگ ارائه می‌کند. خریداران تیپ بالاتر به امکاناتی مانند دوربین دنده‌عقب، رینگ‌های ۱۶ اینچی، درگاه‌های USB-C، گرم‌کن صندلی‌های جلو، شارژ سریع ۵۰ کیلوواتی و قابلیت شارژ معکوس (V2L) دسترسی خواهند داشت."}, {"source": "Zoomit", "title": "تبلت ارزنده «ایکس‌پد ۳۰ پرو» با نمایشگر ۱۱ اینچ و باتری مناسب رونمایی شد", "link": "https://www.zoomit.ir/tablet/466789-infinix-xpad-30-pro-launch/", "summary": "اینفینیکس تبلت اندرویدی اکس‌پد ۳۰ پرو را با نمایشگر ۱۱ اینچی معرفی کرد.", "date_str": "2026-09-10T23:15:00+00:00", "hash": "2b65f5a9dc732fd8", "title_fa": "تبلت ارزنده «ایکس‌پد ۳۰ پرو» با نمایشگر ۱۱ اینچ و باتری مناسب رونمایی شد",
