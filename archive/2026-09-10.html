کرده است و اکنون در حال آزمایش آن در کنار GPT-6 Astra OpenAI است. رویترز این تایید را گزارش کرد و به روندی پایان داد که از بهار آغاز شده بود. Anthropic در ماه آوریل اعلام کرد که Mythos می تواند از انسان ها بهتر عمل کند [ ] این داستان در The Next Web ادامه دارد"}, {"source": "MIT Tech Review", "title": "The Download: a “God-driven” cryptocurrency and a solar engineering roadmap", "link": "https://www.technologyreview.com/2026/09/10/1143828/the-download-christian-cryptocurrency-scandal-solar-engineering-roadmap/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. God told them to sell crypto. Their investors lost everything. When Eli Regalado first heard God speak to him, he wondered whether he was hallucinating. According to Eli and his wife, Kaitlyn, He told them to get married, buy a house, and start having kids. Then in 2021, divine guidance steered them in an unexpected new direction: crypto. That October, the Regalados later testified in court, they received holdings in a little-known digital coin. “Take this to my people for a wealth transfer,” Eli heard God say. Over time, they came to believe that He wanted them to launch their own coin. The Regalados created INDXcoin, which they promoted through family, friends, and contacts in evangelical Christian circles. In all, more than 500 people handed over more than $3 million. But within a year, the project collapsed. Investors lost it all, leaving many to wonder where the funds went and whether they had fallen victim to an elaborate fraud. Read the full story on the collapse of a pastor’s “God-driven” cryptocurrency . —Katia Savchuk This article is part of the Big Story series, the home of MIT Technology Review’s most important and ambitious reporting. You can read the rest of the series here. The story was produced in partnership with Type Investigations and with support from the Fund for Investigative Journalism. This road map could help us decide whether to deploy solar geoengineering Scientists have spent half a century exploring whether we could counteract climate change by releasing reflective particles into the stratosphere, mimicking the cooling effects of volcanic eruptions. But even after hundreds of studies, we still don’t know how well it would work or what else it might do—and there’s no systematic plan for clearing up that uncertainty. Reflective, a research organization, has now attempted to fill that gap. The San Francisco nonprofit has published a detailed road map of the experiments, studies, and infrastructure that it says would be needed to make informed decisions about the use of solar geoengineering, MIT Technology Review can reveal. Find out what it would take to make informed decisions about solar geoengineering . —James Temple This founder is teaching chips how to recycle (their energy) Throughout the history of the computer chip, engineers have treated waste heat as an inevitable cost of a calculati", "date_str": "2026-09-10T12:10:00+00:00", "hash": "b66f78c1ac37601d", "title_fa": "دانلود: یک ارز رمزپایه «خدا محور» و یک نقشه راه مهندسی خورشیدی", "summary_fa": "این نسخه امروز دانلود است، خبرنامه روزهای هفته ما که دوز روزانه ای از آنچه در دنیای فناوری می گذرد را ارائه می دهد. خدا به آنها گفت که کریپتو بفروشند. سرمایه گذاران آنها همه چیز را از دست دادند. وقتی الی رگالادو برای اولین بار شنید که خدا با او صحبت می کند، از خود متعجب شد که آیا او دچار توهم شده است یا خیر. به گفته الی و همسرش، کیتلین، او به آنها گفت که ازدواج کنند، خانه بخرند و بچه دار شوند. سپس در سال 2021، هدایت الهی آنها را به یک مسیر غیرمنتظره جدید هدایت کرد: رمزنگاری. در اکتبر آن سال، رگادوها بعداً در دادگاه شهادت دادند، آنها دارایی‌هایی را در یک سکه دیجیتالی کمتر شناخته شده دریافت کردند. الی شنید که خدا گفت: «این را برای انتقال ثروت نزد قوم من ببر». با گذشت زمان، آنها به این باور رسیدند که او می‌خواهد سکه خودشان را به بازار عرضه کنند. Regalados INDXcoin را ایجاد کرد که از طریق خانواده، دوستان و مخاطبین در محافل مسیحی انجیلی تبلیغ می‌کرد. در مجموع بیش از 500 نفر بیش از 3 میلیون دلار را تحویل دادند. اما در عرض یک سال، این پروژه از بین رفت. سرمایه‌گذاران همه چیز را از دست دادند و بسیاری را به این فکر انداخت که این سرمایه‌ها کجا رفته و آیا قربانی یک کلاهبرداری مفصل شده‌اند یا خیر. داستان کامل سقوط رمزارز «خدا محور» یک کشیش را بخوانید. — Katia Savchuk این مقاله بخشی از مجموعه Big Story است که محل مهم ترین و جاه طلبانه ترین گزارش MIT Technology Review است. بقیه سریال ها را می توانید اینجا بخوانید. این داستان با مشارکت Type Investigations و با حمایت صندوق روزنامه نگاری تحقیقی تهیه شده است. این نقشه راه می تواند به ما در تصمیم گیری برای استقرار مهندسی زمین خورشیدی کمک"}, {"source": "MIT Tech Review", "title": "Powering AI is an architecture problem", "link": "https://www.technologyreview.com/2026/09/10/1141649/powering-ai-is-an-architecture-problem/", "summary": "On July 22, 2026, a transmission line fault in Ashburn, Virginia—the heart of the world s largest data center cluster—knocked more than 3 gigawatts of load off the grid in seconds. And it wasn t the first time. Two years earlier, a single failed surge arrester dropped roughly 60 Virginia facilities and 1,500 megawatts at once. No one could anticipate so much uniform load responding to grid faults the same way, at the same time. The AI power debate is mostly about generation: more turbines, more solar, more transmission. The grid needs more electrons. But the outages in Virginia weren t supply failures; they were architecture failures. And a giant wave of interconnections is arriving on that same architecture, putting grid reliability at risk. It s a problem nobody wants to own. Asking more from the grid The grid was built around predictable loads: steel mills, refineries, and houses at dinnertime. Different load sizes, same process—drawing power smoothly, misbehaving occasionally, and recovering gracefully. But AI data centers don t behave that way. An AI campus can swing 70% of its load in milliseconds during a training run, then trip offline just as fast at the first sign of trouble upstream to protect billions in compute. Each is rational alone. Together, at gigawatt scale, they re a problem the grid has never solved—and the next wave of data center campuses is planned at exactly that scale. Where the old stack breaks The standard data center power stack hasn t changed in decades. Medium-voltage power arrives, transformers step it down, low-voltage uninterruptible power supply (UPS) units condition it, and it reaches the racks. Push that design to AI scale, and it cracks in three places. First, the UPS sits deep inside the building, close to the racks. But its batteries are an undersized spare tire, designed to handle an outage for a few minutes, not to absorb load swings this fast and volatile around the clock. Second, the UPS spends most of its life in bypass. Legacy converters waste enough power that operators run in eco-mode: A static switch feeds the racks directly from the grid and nothing filters in either direction. The compute s swings go out raw, and grid transients—sub-millisecond events that can damage or take down equipment—come in too fast for any switch to catch. Third, the protection logic was written when large load meant 50 megawatts. This protection logic can t see the grid it is now a part of, so when trouble hits upstream, it does e", "date_str": "2026-09-10T11:00:00+00:00", "hash": "3ac9a70047aa289d", "title_fa": "تقویت هوش مصنوعی یک مشکل معماری است", "summary_fa": "در 22 جولای 2026، یک خطای خط انتقال در اشبرن، ویرجینیا - قلب بزرگترین خوشه مرکز داده جهان - بیش از 3 گیگاوات بار را در عرض چند ثانیه از شبکه خارج کرد. و اولین بار نبود دو سال قبل از آن، یک برقگیر شکست خورده تقریباً 60 تأسیسات ویرجینیا و 1500 مگاوات را به یکباره کاهش داد. هیچ کس نمی تواند بار یکنواخت را پیش بینی کند که به طور یکسان و در همان زمان به خطاهای شبکه پاسخ می دهد. بحث قدرت هوش مصنوعی بیشتر در مورد تولید است: توربین های بیشتر، خورشیدی بیشتر، انتقال بیشتر. شبکه به الکترون های بیشتری نیاز دارد. اما قطعی‌ها در ویرجینیا با نقص تامین نبودند. آنها شکست های معماری بودند. و موج عظیمی از اتصالات به همان معماری می رسد که قابلیت اطمینان شبکه را به خطر می اندازد. این مشکلی است که هیچ کس نمی خواهد مالک آن باشد. درخواست بیشتر از شبکه این شبکه حول بارهای قابل پیش بینی ساخته شده است: کارخانه های فولاد، پالایشگاه ها و خانه ها در زمان شام. اندازه‌های بار مختلف، فرآیند یکسان - کشیدن قدرت به آرامی، رفتار نامناسب گهگاهی و بازیابی برازنده. اما مراکز داده هوش مصنوعی اینگونه رفتار نمی کنند. یک پردیس هوش مصنوعی می‌تواند 70 درصد از بار خود را در طول یک دوره آموزشی در میلی‌ثانیه جابه‌جا کند، سپس با اولین نشانه مشکل در بالادست به سرعت آفلاین شود تا از میلیاردها محاسبات محافظت کند. هر کدام به تنهایی عقلانی هستند. آنها با هم، در مقیاس گیگاوات، مشکلی هستند که شبکه هرگز آن را حل نکرده است - و موج بعدی پردیس های مرکز داده دقیقاً در این مقیاس برنامه ریزی شده است. جایی که پشته قدیمی شکسته می شود پشته برق مرکز داده استاندارد در دهه ها تغییر نکرده است. برق ولتاژ متوسط ​​می رسد، ترانسفورماتورها آن را پایین"}, {"source": "MIT Tech Review", "title": "This road map could help us decide whether to deploy solar geoengineering", "link": "https://www.technologyreview.com/2026/09/10/1143804/this-road-map-could-help-us-decide-whether-to-deploy-solar-geoengineering/", "summary": "A San Francisco nonprofit has published a detailed road map of the experiments, studies, and infrastructure that it says would be needed to make informed decisions about the use of solar geoengineering, MIT Technology Review can reveal. Scientists have now spent half a century exploring the possibility that we could counteract climate change by releasing reflective particles into the stratosphere, mimicking the cooling effects of volcanic eruptions. But even after at least hundreds of studies on the concept, known as stratospheric aerosol injection (SAI), big gaps remain in the scientific understanding of how well it would work and what else it might do—and there has been no systematic plan for clearing up that uncertainty. Reflective, a research organization that funds studies on solar geoengineering, has today attempted to fill that gap with the release of its SAI Research Roadmap . “Our mission is to equip the world with the data and tools required for informed decision-making about sunlight reflection fast enough to matter,” says Dakota Gruener, the organization’s cofounder and chief executive. “Our sense is the world may need to make very consequential decisions on timelines far shorter than our research system is prepared for.” The hope is the exercise will guide scientific efforts and encourage philanthropies or government agencies to fund high-priority work and “responsibly accelerate research,” says Gruener. If all the work is done in a coordinated way, it would take about a decade and cost around $370 million—and if it’s not, it would require roughly 20 years and nearly $1.4 billion, the report estimates. While Gruener stresses that Reflective doesn’t advocate using this form of solar geoengineering, the report does make the case for conducting outdoor experiments, which would release successively larger amounts of sulfur dioxide (or materials that would convert into it) in the stratosphere to observe what happens. That is a controversial standpoint. Since 2002, hundreds of academics have signed an open letter calling for a ban on outdoor experiments and an international non-use agreement, arguing that such a powerful technology could never be governed in a globally equitable way. And some signatories argue that more studies can never address one of the biggest questions about using solar geoengineering: Who gets to do it. “The first-order questions, from my perspective, are not technical,” Aarti Gupta, co-initiator of the non-use initiative and ", "date_str": "2026-09-10T11:00:00+00:00", "hash": "ac4d128119b27dec", "title_fa": "این نقشه راه می تواند به ما در تصمیم گیری برای استقرار مهندسی زمین خورشیدی کمک کند", "summary_fa": "موسسه غیرانتفاعی سانفرانسیسکو نقشه راه دقیقی از آزمایش‌ها، مطالعات و زیرساخت‌ها را منتشر کرده است که می‌گوید برای تصمیم‌گیری آگاهانه در مورد استفاده از مهندسی زمین خورشیدی لازم است، بررسی فناوری MIT نشان می‌دهد. دانشمندان اکنون نیم قرن را صرف بررسی این امکان کرده اند که می توانیم با انتشار ذرات بازتابنده در استراتوسفر، با تقلید از اثرات خنک کننده فوران های آتشفشانی، با تغییرات آب و هوایی مقابله کنیم. اما حتی پس از حداقل صدها مطالعه بر روی این مفهوم، که به عنوان تزریق آئروسل استراتوسفری (SAI) شناخته می‌شود، شکاف‌های بزرگی در درک علمی از اینکه چقدر خوب کار می‌کند و چه کارهای دیگری ممکن است انجام دهد باقی می‌ماند – و هیچ برنامه سیستماتیکی برای رفع این عدم قطعیت وجود ندارد. Reflective، یک سازمان تحقیقاتی که بودجه مطالعاتی در زمینه مهندسی زمین خورشیدی را تأمین می کند، امروز تلاش کرده است تا با انتشار نقشه راه تحقیقاتی SAI خود، این شکاف را پر کند. داکوتا گرونر، یکی از بنیانگذاران و مدیر اجرایی این سازمان می گوید: «مأموریت ما این است که جهان را با داده ها و ابزارهای مورد نیاز برای تصمیم گیری آگاهانه در مورد انعکاس نور خورشید به اندازه ای سریع که اهمیت داشته باشد، تجهیز کنیم. حس ما این است که جهان ممکن است نیاز به تصمیم گیری های بسیار مهم در زمان بندی های بسیار کوتاه تر از آنچه سیستم تحقیقاتی ما برای آن آماده شده باشد داشته باشد. گرونر می‌گوید، امید این است که این تمرین تلاش‌های علمی را هدایت کند و خیریه‌ها یا سازمان‌های دولتی را تشویق کند تا کارهای با اولویت بالا را تأمین مالی کنند و «مسئولانه تحقیقات را تسریع بخشند». این گزارش تخمین می زند که اگر همه کار به صورت هماهنگ انجام شود، حدود یک دهه طول می کشد و حدود 370 میلیون دلار هزینه خواهد داشت –"}, {"source": "MIT Tech Review", "title": "Can the US battery market untangle from China?", "link": "https://www.technologyreview.com/2026/09/10/1143791/us-china-batteries/", "summary": "The US is hitting records for the rapid growth of its energy storage market. That’ll go a long way to shoring up the grid, increasing reliability and also cutting emissions, since batteries can help store energy from intermittent renewables like wind and solar. Crucially, this is all happening with the help of cheap Chinese batteries, though there’s been a concerted effort to reduce the US’s reliance on them. Most recently, in an executive order in late August, the Trump administration declared a national emergency that essentially bans Chinese batteries from being used in grid-scale energy storage systems. There’s an argument to be made about reducing reliance on any single source of a crucial energy technology. But all this tension raises a broader question for me: How much should countries take advantage of cheap, available tech, versus cutting off major sources to force development of their own factories even if that comes at a higher cost? This is hardly America’s first push to move away from Chinese influence in the battery supply chain. One of the major policy tools used in recent years is restricting the tax credits designed to incentivize use of the new technologies. Limiting the types of projects that are eligible can help reduce the cost of local technologies so they’re more competitive with otherwise cheaper imported options. Back in 2022 , the US government designed the tax credits that were part of the Inflation Reduction Act to restrict where a battery’s minerals could be mined, processed, or recycled, as well as where a battery and its components were assembled. Those tax credits underwent a makeover in 2025, but the Trump administration has taken a similar tack. New legislation requires that starting in 2026, 55% of the cost of materials used for new energy storage projects must come from outside China and other restricted countries or the projects won’t qualify for tax credits. And we can’t forget about tariffs. Import taxes for batteries increased to 25% in January, up from 7.5%. But the new executive order is a more drastic move. It bans the installation of “any foreign-produced bulk-power system electric equipment” that poses a national security risk. The order specifically calls out battery energy storage systems, as well as inverters and transformers. “An outright ban was a bit of a surprise, and it does create a bit of concern for domestic players in the US,” says Shan Tomouk, energy storage and energy lead for Benchmark Mineral Int", "date_str": "2026-09-10T10:00:00+00:00", "hash": "79b2ef5f47a61907", "title_fa": "آیا بازار باتری ایالات متحده می تواند گره از چین باز کند؟", "summary_fa": "ایالات متحده در حال ثبت رکورد برای رشد سریع بازار ذخیره انرژی خود است. این امر به تقویت شبکه، افزایش قابلیت اطمینان و همچنین کاهش انتشار کمک می کند، زیرا باتری ها می توانند به ذخیره انرژی از انرژی های تجدیدپذیر متناوب مانند باد و خورشید کمک کنند. مهم این است که همه اینها با کمک باتری های ارزان قیمت چینی اتفاق می افتد، اگرچه تلاش های هماهنگی برای کاهش اتکای ایالات متحده به آنها انجام شده است. اخیراً، در یک فرمان اجرایی در اواخر اوت، دولت ترامپ وضعیت اضطراری ملی اعلام کرد که اساساً استفاده از باتری‌های چینی در سیستم‌های ذخیره‌سازی انرژی در مقیاس شبکه را ممنوع می‌کند. بحثی وجود دارد که باید در مورد کاهش اتکا به هر منبع واحدی از یک فناوری حیاتی انرژی مطرح شود. اما این همه تنش برای من سوال گسترده‌تری ایجاد می‌کند: کشورها چقدر باید از فناوری ارزان و در دسترس در مقابل قطع منابع اصلی برای وادار کردن توسعه کارخانه‌های خود استفاده کنند، حتی اگر هزینه‌های بالاتری داشته باشد؟ این به سختی اولین فشار آمریکا برای دور شدن از نفوذ چین در زنجیره تامین باتری است. یکی از ابزارهای اصلی سیاستی که در سال های اخیر مورد استفاده قرار گرفته است، محدود کردن اعتبارات مالیاتی است که برای تشویق استفاده از فناوری های جدید طراحی شده است. محدود کردن انواع پروژه‌های واجد شرایط می‌تواند به کاهش هزینه‌های فناوری‌های محلی کمک کند تا با گزینه‌های وارداتی ارزان‌تر رقابتی‌تر شوند. در سال 2022، دولت ایالات متحده اعتبارات مالیاتی را طراحی کرد که بخشی از قانون کاهش تورم بود تا محل استخراج، پردازش یا بازیافت مواد معدنی باتری و همچنین محل مونتاژ باتری و اجزای آن را محدود کند. این اعتبارات مالیاتی در سال 2025 تغییر کرد، اما دولت ترامپ رویکرد مشابهی را در پیش گرفته است. قانون جدید مستلزم آن است که از سال"}, {"source": "MIT Tech Review", "title": "God told them to sell crypto. Their investors lost everything.", "link": "https://www.technologyreview.com/2026/09/10/1143588/indxcoin-god-regalados-sell-crypto-investors-lost-everything/", "summary": "This article was produced in partnership with Type Investigations and with support from the Fund for Investigative Journalism. When Eli Regalado first heard God speak to him, he wondered whether he was hallucinating. Now he likens the experience to having “a thought that is not my thought.” Divine words echo in his mind like a line from a movie or the memory of a loved one’s voice. “It’s not ‘You better do this,’” he says. “It’s just a knowing inside you: This is what you do .” Holy messages arrive daily while Eli is praying, reading, or watching television. Sometimes they surface in prophetic dreams or missives from strangers. Occasionally, they appear midsentence, when he pauses to ask, “Lord, what do you want to say here?” Eli’s wife, Kaitlyn, tends to get heavenly dispatches in the shower, when she finally has a moment to herself. Other times, she seeks counsel from above. “I’ll be writing in my journal and praying and asking questions and just believing what I’m hearing is Him,” she says. God’s directives have been manifold. According to the Regalados, He told them to get married, buy a house, and start having kids. When Eli owned a marketing firm in Colorado, He told him what to name it, whom to hire, and which clients to take on. Then God told him to start preaching in his living room and online. Always, the couple obeyed. In 2021, when Eli was 41 and Kaitlyn was 28, divine guidance steered them in an unexpected new direction: crypto. That October, the Regalados later testified in court, Eli’s sister and her husband gifted the couple some of their holdings in a little-known digital coin. “Take this to my people for a wealth transfer,” Eli heard God say. He and Kaitlyn felt that they were being called to sell the cryptocurrency to fellow Christians. Later, though they had no background in crypto, they came to believe that God wanted them to launch their own coin. Learning as they went, the Regalados created a new cryptocurrency called INDXcoin, which they promoted through family, friends, and contacts in evangelical Christian circles. “I was really feeling that this is the wave of the future,” says Debbie Bonilla, a retired pharmacy technician in her 70s who bought INDXcoin with her husband, Jose. The couple learned about the currency through friends—a minister and his wife, who had also invested. “We just trusted that their judgment was good,” Jose says. Starting in November 2022, Debbie and Jose withdrew a total of $70,000 from their retirement acc", "date_str": "2026-09-10T09:00:00+00:00", "hash": "534f477dc38da540", "title_fa": "خدا به آنها گفت که کریپتو بفروشند. سرمایه گذاران آنها همه چیز را از دست دادند.", "summary_fa": "این مقاله با مشارکت Type Investigations و با حمایت صندوق روزنامه نگاری تحقیقی تهیه شده است. وقتی الی رگالادو برای اولین بار شنید که خدا با او صحبت می کند، از خود متعجب شد که آیا او دچار توهم شده است یا خیر. اکنون او این تجربه را به داشتن \"فکری که فکر من نیست\" تشبیه می کند. کلمات الهی مانند خطی از فیلم یا خاطره صدای یکی از عزیزان در ذهن او طنین انداز می شود. او می‌گوید: «بهتر است این کار را بکنید» نیست. \"این فقط یک شناخت درون شماست: این کاری است که شما انجام می دهید.\" پیام‌های مقدس هر روز در حالی که الی در حال دعا، خواندن یا تماشای تلویزیون است، می‌رسد. گاهی اوقات در رویاهای نبوی یا پیام های غریبه ظاهر می شوند. گاهی اوقات، آنها در حد وسط ظاهر می شوند، زمانی که او مکث می کند و می پرسد: \"خداوندا، اینجا چه می خواهی بگویی؟\" همسر الی، کیتلین، تمایل دارد که در حمام، زمانی که در نهایت لحظه‌ای به خود می‌دهد، پیام‌های آسمانی دریافت کند. مواقع دیگر، او از بالا به دنبال مشاوره است. او می‌گوید: «من در دفترم می‌نویسم و ​​دعا می‌کنم و سؤال می‌پرسم و فقط باور می‌کنم آنچه می‌شنوم اوست. دستورات خداوند متعدد بوده است. طبق گزارش Regalados، او به آنها گفت که ازدواج کنند، خانه بخرند و بچه دار شوند. زمانی که الی صاحب یک شرکت بازاریابی در کلرادو بود، به او گفت که نام آن را چه نامی بگذارد، چه کسی را استخدام کند، و چه مشتریانی را استخدام کند. سپس خدا به او گفت که موعظه را در اتاق نشیمن و آنلاین خود شروع کند. همیشه زن و شوهر اطاعت می کردند. در سال 2021، زمانی که الی 41 ساله و کیتلین 28 ساله بود، هدایت الهی آنها را به سمت یک مسیر غیرمنتظره جدید هدایت"}, {"source": "MIT Tech Review", "title": "Healthcare AI’s next test is integration", "link": "https://www.technologyreview.com/2026/09/10/1141421/healthcare-ais-next-test-is-integration/", "summary": "The entrance of major AI companies into healthcare is a meaningful and welcome development, accelerating the technical foundation available to the industry. Their models are increasingly capable of processing long clinical records, interpreting complex terminology, comparing documentation against evidence and generating coherent summaries from large volumes of information. For clinicians, operators, and administrative teams who spend significant time searching through fragmented data, these advances are helping reduce cognitive burden and make high-value information easier to access. But healthcare leaders should not confuse model capability with operational capability. Healthcare’s administrative challenges are caused by fragmented information, fragmented workflows, and fragmented accountability, not a lack of information. The industry has spent decades investing in systems that capture activity: electronic health records, billing platforms, payer portals, scheduling systems, call center platforms, and analytics applications. Each system records something important. But few were designed to reason across the full chain of decisions that determines whether patients get timely access, clinicians have the right documentation and providers are reimbursed appropriately. This is the problem that AI must now confront. Revenue cycle is becoming one of healthcare AI’s proving grounds The revenue cycle is the process healthcare providers use to get paid for care — from scheduling and registration through coding, billing, payer follow-up, and payment collection. It is unusually suited to rigorous AI deployment because it combines high transaction volume, complex reasoning, structured and unstructured data, measurable outcomes, and significant operational variation. It also sits at the intersection of financial performance, patient access, and administrative workload. A single claim can be influenced by patient insurance information, clinical documentation, coding rules, payer-specific policies, prior authorization requirements, medical necessity criteria, and many other data sources and operational processes. A breakdown in any one of those areas can create downstream consequences weeks or months later. This is why generic automation has often fallen short. Traditional robotic process automation works well when workflows are stable and rules are predictable, but healthcare administration is neither. Payer requirements change. Documentation expectations evolve. Excep", "date_str": "2026-09-10T08:58:01+00:00", "hash": "7a0ce96d569dd7dd", "title_fa": "تست بعدی Healthcare AI یکپارچه سازی است", "summary_fa": "ورود شرکت‌های بزرگ هوش مصنوعی به بخش مراقبت‌های بهداشتی یک توسعه معنادار و خوش‌آمد است که پایه‌های فنی در دسترس این صنعت را تسریع می‌کند. مدل‌های آنها به طور فزاینده‌ای قادر به پردازش سوابق بالینی طولانی، تفسیر اصطلاحات پیچیده، مقایسه اسناد با شواهد و ایجاد خلاصه‌های منسجم از حجم زیادی از اطلاعات هستند. برای پزشکان، اپراتورها و تیم های اداری که زمان قابل توجهی را صرف جستجوی داده های تکه تکه می کنند، این پیشرفت ها به کاهش بار شناختی کمک می کند و دسترسی به اطلاعات با ارزش را آسان تر می کند. اما رهبران مراقبت های بهداشتی نباید قابلیت مدل را با قابلیت عملیاتی اشتباه بگیرند. چالش های اداری مراقبت های بهداشتی ناشی از اطلاعات پراکنده، گردش کار پراکنده و پاسخگویی پراکنده است، نه کمبود اطلاعات. این صنعت دهه‌ها را صرف سرمایه‌گذاری در سیستم‌هایی کرده است که فعالیت‌ها را ثبت می‌کنند: سوابق سلامت الکترونیک، پلت‌فرم‌های صورت‌حساب، پورتال پرداخت‌کنندگان، سیستم‌های زمان‌بندی، پلت‌فرم‌های مرکز تماس و برنامه‌های تحلیلی. هر سیستم چیزی مهم را ثبت می کند. اما تعداد کمی از آنها برای استدلال در سراسر زنجیره کامل تصمیمات طراحی شده اند که تعیین می کند آیا بیماران به موقع دسترسی دارند یا خیر، پزشکان مدارک مناسبی دارند و ارائه دهندگان به طور مناسب بازپرداخت می کنند. این مشکلی است که هوش مصنوعی اکنون باید با آن روبرو شود. چرخه درآمد در حال تبدیل شدن به یکی از زمینه های اثبات هوش مصنوعی مراقبت های بهداشتی است. چرخه درآمد فرآیندی است که ارائه دهندگان مراقبت های بهداشتی برای دریافت هزینه مراقبت از آن استفاده می کنند - از برنامه ریزی و ثبت نام از طریق کدگذاری، صورتحساب، پیگیری پرداخت کننده و جمع آوری پرداخت. این به طور غیرعادی برای استقرار دقیق هوش مصنوعی مناسب است زیرا حجم تراکنش بالا، استدلال پیچیده، داده های ساختاریافته و بدون ساختار، نتایج قابل اندازه گیری"}, {"source": "Zoomit", "title": "دوربین اصلی آیفون دوئو همان دوربین آیفون 17e است", "link": "https://www.zoomit.ir/mobile/466967-iphone-duo-camera-specs-revealed/", "summary": "مشخصات فنی اپل نشان می‌دهد دوربین اصلی آیفون دوئو همان دوربین مدل اقتصادی‌تر آیفون 17e است.", "date_str": "2026-09-10T14:09:56+00:00", "hash": "10df15130b089d2d", "title_fa": "دوربین اصلی آیفون دوئو همان دوربین آیفون 17e است", "summary_fa": "مشخصات فنی اپل نشان می‌دهد دوربین اصلی آیفون دوئو همان دوربین مدل اقتصادی‌تر آیفون 17e است. تبلیغات مشخصات فنی رسمی نشان می‌دهد دوربین اصلی آیفون دوئو برخلاف انتظار شباهت بسیار نزدیکی به آیفون 17e دارد و از حسگر مدل عادی آیفون ۱۷ بهره نمی‌برد. اطلاعات رسمی تأیید می‌کند لنز ۲۶ میلی‌متری با گشودگی دیافراگم ƒ/1.6 و فناوری فوکوس خودکار Hybrid Focus Pixels در هر دو دستگاه به کار رفته است. به روایت مک‌رومرز ، دوربین اصلی آیفون دوئو امکان ثبت عکس‌های تله‌فوتو ۱۲ مگاپیکسلی با بزرگ‌نمایی دوبرابری را فراهم می‌کند. با وجود شباهت‌های فوکوس خودکار با 17e، اپل در مدل دوئو از سیستم لرزش‌گیر اپتیکال سنسور شیفت استفاده کرده؛ قابلیتی که در مدل استاندارد آیفون ۱۷ وجود دارد اما 17e تنها به لرزش‌گیر اپتیکال ساده مجهز است. بررسی این داده‌ها نشان می‌دهد ساختار تصویربرداری گوشی تاشدنی اپل در جایگاهی میان آیفون 17e و آیفون ۱۷ قرار می‌گیرد. مدل عادی آیفون ۱۷ و مدل‌های پیشرفته‌تر از اصطلاح 100% Focus Pixels استفاده می‌کنند، درحالی‌که دوئو اصطلاح مشترک با مدل 17e را یدک می‌کشد. اپل هنوز ابعاد فیزیکی حسگر یا اندازه‌ی پیکسل‌های دوربین اصلی را منتشر نکرده و شباهت عبارت‌های فنی تنها مدرک موجود به شمار می‌رود. قیمت آیفون دوئو ۱۹۹۹ دلار است."}, {"source": "Zoomit", "title": "نیویورک به ممنوع‌سازی استخراج رمزارز و دیتاسنترهای هوش مصنوعی فکر می‌کند", "link": "https://www.zoomit.ir/cryptocurrency/466833-plattsburgh-ai-crypto-moratorium-hearing/", "summary": "مسئولان شهر پلاتسبرگ در نیویورک طرح توقف موقت مجوزهای مربوط به دیتاسنترها هوش مصنوعی و استخراج رمزارز را بررسی کردند.", "date_str": "2026-09-10T14:00:00+00:00", "hash": "ae91f9c9f78c29b9", "title_fa": "نیویورک به ممنوع‌سازی استخراج رمزارز و دیتاسنترهای هوش مصنوعی فکر می‌کند", "summary_fa": "مسئولان شهر پلاتسبرگ در نیویورک طرح توقف موقت مجوزهای مربوط به دیتاسنترها هوش مصنوعی و استخراج رمزارز را بررسی کردند. تبلیغات مسئولان شهر پلاتسبرگ در ایالت نیویورک جلسه‌ای عمومی برگزار کردند تا لایحه‌ی توقف موقت استفاده از زمین برای فعالیت‌های مرتبط با دیتاسنترهای هوش مصنوعی و استخراج رمزارز را به بحث بگذارند. طی جلسه‌ای، وندل هیوز، شهردار پلاتسبرگ و اعضای شورای شهر، نظرات شهروندان را درباره‌ی ممنوعیت کوتاه‌مدت تأسیسات پردازشی پرمصرف شنیدند. طرح پیشنهادی در صورت تصویب نهایی، صدور هرگونه مجوز برای فعالیت‌هایی با مصرف ۳۰۰ کیلووات یا بیشتر را به‌مدت ۱۲ ماه به حالت تعلیق درمی‌آورد. گفته می‌شود شهردار هنوز این مصوبه را امضا نکرده و تصمیم‌گیری نهایی را به جلسه‌ی بعدی شورای شهر در ۲۶ شهریور موکول کرده است. پلاتسبرگ پیش‌تر یکی از نخستین حوزه‌های قضایی در ایالات متحده به‌شمار می‌رفت که در سال ۲۰۱۸ و در پاسخ به نگرانی شهروندان از افزایش هزینه‌ی برق، استخراج بیت‌کوین را به‌مدت ۱۸ ماه ممنوع کرد. افزایش هزینه‌های انرژی، سختی شبکه و نوسانات قیمت توکن‌ها باعث شده است بسیاری از شرکت‌های استخراج به سمت میزبانی پردازش‌های هوش مصنوعی و رایانش ابری سنگین تغییر مسیر دهند."}, {"source": "Zoomit", "title": "تبدیل گرمای تلف‌شده به سرما با فلزات هوشمند؛ ایده‌ای نو برای خنک‌سازی تراشه‌ها", "link": "https://www.zoomit.ir/energy-environment/466733-elastocaloric-cooling-waste-heat-alloys/", "summary": "دانشمندان با اتصال دو آلیاژ حافظه‌دار، سامانه‌ای ساختند که با جذب حرارت و بدون موتور الکتریکی، سرمای موردنیاز برای خنک‌سازی تراشه‌ها را تولید می‌کند.", "date_str": "2026-09-10T13:05:00+00:00", "hash": "17d077efc6f73845", "title_fa": "تبدیل گرمای تلف‌شده به سرما با فلزات هوشمند؛ ایده‌ای نو برای خنک‌سازی تراشه‌ها", "summary_fa": "دانشمندان با اتصال دو آلیاژ حافظه‌دار، سامانه‌ای ساختند که با جذب حرارت و بدون موتور الکتریکی، سرمای موردنیاز برای خنک‌سازی تراشه‌ها را تولید می‌کند. تبلیغات ما نمی‌توانیم با تاریکی اتاقی را روشن یا با خیس‌کردن حوله آن را خشک کنیم. همچنین قطعاً نمی‌توان با گرما چیزی را خنک کرد. بااین‌حال، دانشمندان یک سامانه سرمایش حالت‌جامد ساخته‌اند که می‌تواند از گرما برای تولید سرما استفاده کند؛ فناوری‌ای که در آینده ممکن است به پردازنده‌ها و دیگر تجهیزات الکترونیکی داغ اجازه دهد بخشی از گرمای اتلافی خود را برای خنک‌سازی مجدداً به کار بگیرند. به‌گزارش نیواطلس ، پژوهشگران مؤسسه فناوری کارلسروهه در آلمان (KIT) و دانشگاه تسوکوبا در ژاپن، خنک‌کننده آزمایشی خود را با اتصال دو لایه فوق‌العاده نازک از آلیاژهای دارای حافظه شکل (قابلیت بازگشت به شکل اولیه) ساختند. یکی از این لایه‌ها گرما را به حرکت مکانیکی و دیگری این حرکت را به سرمایش تبدیل می‌کند. در واقع، گرما در این سامانه کاری را انجام می‌دهد که معمولاً بر عهده موتور یا محرک الکتریکی است؛ همان قطعه‌ای که چرخه سرمایش را به حرکت درمی‌آورد. بیشتر یخچال‌ها و سیستم‌های تهویه مطبوع از سرمایش تراکمی استفاده می‌کنند. یک کمپرسور الکتریکی، گاز مبرد را فشرده می‌کند و در نتیجه فشار و دمای آن افزایش می‌یابد. مبرد داغ سپس گرمای خود را به محیط اطراف پس می‌دهد و بعد از عبور از شیر انبساطی، فشار و دمایش کاهش پیدا می‌کند. مبرد اکنون می‌تواند گرمای یخچال، اتاق یا فضای دیگری را که قرار است خنک شود جذب کند و سپس برای تکرار چرخه به کمپرسور بازگردد. سرمایش حالت‌جامد مسیر متفاوتی را دنبال می‌کند. این فناوری به‌جای استفاده از کمپر  "hash": "f9f16e635f473290", "title_fa": "پردازنده A20 Pro اپل در دل آیفون ۱۸ پرو مکس قدرت‌نمایی کرد؛ انتشار اولین نتایج گیک‌بنچ", "summary_fa": "نتایج اولیه بنچمارک تراشه‌ی A20 Pro در آیفون ۱۸ پرو و پرو مکس با جهش چشمگیر عملکرد پردازشی و گرافیکی ثبت شد. تبلیغات نخستین نتایج بنچمارک تراشه‌ی A20 Pro در دو گوشی آیفون ۱۸ پرو و آیفون ۱۸ پرو مکس در گیک‌بنچ ۷ ثبت شد تا تصویر اولیه‌ای از توان پردازشی و گرافیکی پرچمداران جدید اپل داشته باشیم. تراشه‌ی جدید در بخش تک‌هسته‌ای حدود ۲۱ تا ۲۳ درصد و در بخش چند‌هسته‌ای بین ۲۷ تا ۲۸ درصد نسبت‌به A19 Pro سریع‌تر عمل می‌کند. گوشی آیفون ۱۸ پرو امتیاز تک‌هسته‌ای ۴٬۷۱۹ و چند‌هسته‌ای ۱۲٬۶۷۷ را به دست آورد، در حالی که مدل پرو مکس به امتیاز تک‌هسته‌ای ۴٬۷۲۵ و چند‌هسته‌ای ۱۲٬۵۷۵ دست یافت. پردازنده‌ی ۶ هسته‌ای این محصولات با فرکانس تقریبی ۴٫۹۳ گیگاهرتز کار می‌کند. پردازنده‌ی گرافیکی هفت هسته‌ای A20 Pro توانست در آزمون متال در گیک‌بنچ رشدی ۳۸ تا ۴۰ درصدی را نسبت‌به واحد ۶ هسته‌ای نسل پیش نشان دهد. تراشه‌ی آیفون ۱۸ پرو و پرو مکس با لیتوگرافی ۲ نانومتری ساخته شده است و از ۵۰ درصد پهنای باند حافظه‌ی بیشتری بهره می‌برد."}, {"source": "Zoomit", "title": "آیفون دوئو در حالت باز، باریک‌ترین گوشی تاریخ اپل است", "link": "https://www.zoomit.ir/mobile/466934-apple-foldable-iphone-duo-thickness/", "summary": "آیفون دوئو، باریک‌ترین و هم‌زمان سنگین‌ترین گوشی هوشمند تاریخ اپل است.", "date_str": "2026-09-10T11:50:00+00:00", "hash": "820a13a42cbad29b", "title_fa": "آیفون دوئو در حالت باز، باریک‌ترین گوشی تاریخ اپل است", "summary_fa": "آیفون دوئو، باریک‌ترین و هم‌زمان سنگین‌ترین گوشی هوشمند تاریخ اپل است. تبلیغات آیفون دوئو در حالت باز با ضخامت ۵٫۲ میلی‌متر، عنوان باریک‌ترین آیفون تاریخ را به خود اختصاص می‌دهد. گوشی تاشدنی جدید اپل در حالت باز ۰٫۴ میلی‌متر از آیفون ایر ۵٫۶ میلی‌متری باریک‌تر است. ضخامت گوشی در حالت بسته به ۱۱٫۳ میلی‌متر می‌رسد که در مقایسه با ضخامت ۸٫۷۵ میلی‌متری آیفون ۱۷ پرو مکس و آیفون ۱۸ پرو مکس ، ابعاد بزرگ‌تری دارد. آیپد پرو ۱۳ اینچی با ضخامت ۵٫۱ میلی‌متر همچنان باریک‌ترین محصول تولیدی اپل به شمار می‌رود. محصول تاشوی اپل با وزن ۲۵۴ گرم، 1:25:00+00:00", "hash": "55b26f71b876d6b1", "title_fa": "آزمون سنجش صدای هواپیمای ایکس-۵۹ ناسا؛ آیا دیوار صوتی بی‌صدا می‌شکند؟", "summary_fa": "ناسا پس از تکمیل مجموعه‌ای از پروازهای آزمایشی با ایکس-۵۹، بالاخره آماده است تا صدای تولیدشده توسط این هواپیمای مافوق‌صوت را به‌طور دقیق اندازه بگیرد. تبلیغات هواپیمای آزمایشی مافوق‌صوت ناسا به‌تازگی بیست‌وپنجمین پرواز خود را با موفقیت انجام داد و مسافتی چشمگیر را در آسمان پیمود. با تکمیل این پرواز، هواپیما اکنون آماده است تا به مرحله بعدی آزمایش‌ها وارد شود: سنجش سطح صدای تولیدشده. به‌گزارش ناسا ، هواپیمای X-59 در ۲۱ اوت از مرکز تحقیقات پرواز آرمسترانگ ناسا در ادواردز کالیفرنیا به پرواز درآمد تا یکی دیگر از مجموعه پروازهای آزمایشی موفق خود را انجام دهد. این هواپیما در مجموع ۷۲ دقیقه پرواز کرد، به سرعت ماخ ۱٫۲ رسید و تا ارتفاع تقریبی ۴۹هزار پا (۱۴ کیلومتر) اوج گرفت. مانند تمام پروازهای آزمایشی قبلی، یک فروند هواپیمای تعقیب‌کننده اف-۱۵ ناسا نیز برای پایش ایکس-۵۹ آن را همراهی می‌کرد. به همین دلیل، صدای غرش‌های صوتی ایجادشده توسط هواپیمای تعقیب‌کننده، تمام صداهای تولیدشده توسط ایکس-۵۹ را تحت‌الشعاع قرار می‌داد. اما وضعیت کنونی قرار نیست مدت زیادی ادامه پیدا کند. ناسا سرانجام خود را برای ارزیابی صدای بسیار آرام‌تر هواپیمای آزمایشی‌اش در اواخر سال جاری آماده می‌کند؛ آزمونی تعیین‌کننده که فناوری نوآورانه ایکس-۵۹ را واقعاً به چالش خواهد کشید. کپی لینک سرعت مافوق‌صوت ایکس-۵۹ برای عبور از دیوار صوتی بدون ایجاد صدای بلند و انفجاری موسوم به «غرش صوتی» طراحی شده است. این هواپیما پس از سال‌ها توسعه، پنجم ژوئن امسال با رسیدن به حداکثر سرعت تقریبی ماخ ۱٫۱، معادل ۱۱۴۷ کیلومتر بر ساعت، برای نخستین‌بار دیوار صوتی را شکست . از آن زمان، ناسا به آزمایش هواپیمای خود ادامه داده است تا پیش از ورود آن به مرحله بعدی، عملکردش را با دقت بیشتری ارزیابی کند."}, {"source": "Zoomit", "title": "طراحی بهتر از آیفون ۱۸ پرو مکس؟ اولین تصاویر واقعی از گوشی جدید آنر لو رفت", "link": "https://www.zoomit.ir/mobile/466941-honor-magic-9-pro-max-leak/", "summary": "ویدیوی جعبه‌گشایی گوشی مجیک ۹ پرو مکس آنر پیش از رونمایی رسمی فاش شد.", "date_str": "2026-09-10T11:00:0 ماد مشتریان را جلب کردند. در یک مورد شماره‌سریال روی برد با جعبه همخوانی نداشت و در موردی دیگر، فروشنده شماره‌سریال روی سخت‌افزار را مخدوش کرده بود تا مانع از کشف مغایرت با فاکتور جعلی شود."}, {"source": "Zoomit", "title": "نگاه نزدیک رسانه‌ها به آیفون ۱۸ پرو مکس؛ یکی از خوش‌رنگ‌ترین گوشی‌های اپل", "link": "https://www.zoomit.ir/mobile/466950-apple-iphone-18-pro-max-hands-on-media/", "summary": "با رونمایی از آیفون ۱۸ پرو مکس، رسانه‌ها فرصت کردند از نزدیک با پرچمدار جدید اپل آشنا شوند.", "date_str": "2026-09-10T08:51:10+00:00", "hash": "be8342b73fb7d841", "title_fa": "نگاه نزدیک رسانه‌ها به آیفون ۱۸ پرو مکس؛ یکی از خوش‌رنگ‌ترین گوشی‌های اپل", "summary_fa": "با رونمایی از آیفون ۱۸ پرو مکس، رسانه‌ها فرصت کردند از نزدیک با پرچمدار جدید اپل آشنا شوند. تبلیغات آیفون ۱۸ پرو مکس پس از ماه‌ها شایعه، سرانجام شب گذشته در مراسم اپل معرفی شد و رسانه‌های فناوری بیش از هر چیز روی سه تغییر اصلی آن تمرکز کرده‌اند: افزایش قیمت گوشی ، دوربین جدید با دیافراگم متغیر و جهش چشمگیر عمر باتری. اپل قیمت آیفون ۱۸ پرو مکس را در کانفیگ پایه ۱٬۲۹۹ دلار تعیین کرده؛ ۱۰۰ دلار بیشتر از نسل قبل. مک‌رومرز می‌گوید این افزایش کمتر از برخی پیش‌بینی‌های بدبینانه‌ی تحلیلگران پیش از مراسم است و مدل پایه همچنان ۲۵۶ گیگابایت فضای ذخیره‌سازی دارد. زومیت لایک تغییرات ظاهری چندان انقلابی نیست و خبرنگاران هم ظاهر نسل جدید را نزدیک به آیفون ۱۷ پرو و پرو مکس توصیف کرده‌اند. در عوض، اپل در درون گوشی دست برده: تراشه‌ی A20 Pro با لیتوگرافی ۲ نانومتری، سیستم خنک‌کننده‌ی جدید و داینامیک آیلند کوچک‌تر از تغییرات اصلی هستند. اپل می‌گوید عملکرد پایدار دستگاه تا ۴۰ درصد نسبت‌به نسل قبل افزایش یافته است. شاید جذاب‌ترین ارتقا به باتری مربوط باشد. اپل می‌گوید آیفون ۱۸ پرو مکس با تا ۳۰ ساعت استفاده در هر شارژ، بزرگ‌ترین افزایش عمر باتری در تاریخ آیفون را ارائه می‌دهد. دوربین اصلی ۴۸ مگاپیکسلی هم حالا به دیافراگم متغیر مجهز شده تا کنترل بیشتری روی نور و عمق میدان در اختیار عکاس قرار دهد. زومیت لایک برداشت کلی رسانه‌ها این است که آیفون ۱۸ پرو مکس بیشتر یک نسخه‌ی بهینه‌شده و قدرتمند از نسل قبل است تا محصولی با طراحی کاملاً متفاوت ت را به او به اشتراک می گذارد", "summary_fa": "وارن بافت رئیس برکشایر هاتاوی است. بیل پولیانو/ گتی ایماژ مری بارا در مورد ملاقات های خود با وارن بافت و \"توصیه های خارق العاده\" او به او صحبت کرد. مدیر عامل جنرال موتورز گفت که به او گفته است که روی موفقیت بلندمدت خودروساز تمرکز کند نه درآمد سه ماهه. چند سال پیش، برکشایر هاتاوی، متعلق به بافت، نزدیک به 6 درصد از سهام جنرال موتورز را در اختیار داشت، اما از آن زمان تاکنون از سهام خود خارج شده است. مری بارا از کسی جز وارن بافت یک استاد کلاس کسب و کار دریافت کرد. مدیرعامل قدیمی جنرال موتورز گفت که این سرمایه‌گذار افسانه‌ای به او «فقط توصیه‌های خارق‌العاده‌ای داده است، و من برای همیشه سپاسگزار زمانی که به من داده، حکمت رهبری که با من در میان گذاشته، و همچنین حمایت‌هایی که در زمان‌های بسیار دشواری داشته، خواهم بود». بارا در آخرین قسمت از پادکست \"Fortune 500: Titans and Disruptors of Industry\" در مورد بازدید از بافت در زادگاهش اوماها صحبت کرد. بافت یک بار پرسید که اگر جنرال موتورز یک شرکت خصوصی بود و مجبور نبود هر سه ماهه درآمدش را گزارش کند، آیا کار متفاوتی انجام می داد یا نه، بارا گفت که وقتی جواب منفی داد، خوشحال به نظر می رسید. او به یاد آورد که گفت: \"من نمی‌خواهم که شرکت را برای سه ماهه مدیریت کنید. اینطوری واقعاً ارزش خلق خواهید کرد.\" بارا گفت: \"پس فقط تمام این مرواریدهای خرد بود.\" بارا گفت که \"قبلاً عاشق\" نشستن در دفتر کارش یا ملاقات با او برای ناهار در یک رستوران محلی بود. آنها \"مکالمه های شگفت انگیزی خواهند داشت\" و او با یکسری غذای ارزشمند آنجا را ترک می کرد. او گفت. مدیرعامل مری بارا. بلومبرگ/ گتی ایماژ بارا و بافت بارا در سن 18 سالگی کار خود را در کارخانه جنرال موتورز شروع"}, {"source": "Business Insider", "title": "Researchers fear there's a chance AI could kill us all. Here's how experts say that might play out.", "link": "https://www.businessinsider.com/ai-apocalypse-anthropic-open-ai-how-it-would-happen-experts-2026-9", "summary": "Evan Hubinger, who leads Anthropic s alignment stress-testing team, said AI has a greater-than-10% chance of killing all humans within a decade. Dominika Zarzycka/SOPA Im ould attack critical infrastructure, including electricity, water, transport, financial services, and communications. AI could also help malicious actors develop new viruses, he said. Geoffrey Hinton, the \"godfather of AI,\" made a similar point in an interview on BBC Newsnight on Wednesday. An advanced system would not need direct p", "date_str": "2026-09-10T13:06:54+00:00", "hash": "b01eb481bb1833ea", "title_fa": "محققان می ترسند که این احتمال وجود داشته باشد که هوش مصنوعی همه ما را بکشد. در اینجا کارشناسان می گویند که چگونه ممکن است انجام شود.", "summary_fa": "ایوان هابینگر، سرپرست تیم تست استرس همسویی آنتروپیک، گفت که هوش مصنوعی بیش از 10 درصد شانس کشتن همه انسان ها در یک دهه را دارد. Dominika Zarzycka/SOPA Images/LightRocket از طریق Getty Images هشدار هولناک یکی از کارکنان Anthropic درباره آخرالزمان مبتنی بر هوش مصنوعی بحث های شدیدی را برانگیخته است. محققان ارشد هوش مصنوعی به Business Insider گفتند که چگونه ممکن است این اتفاق بیفتد، اما در مورد احتمال آن اختلاف نظر داشتند. سناریوها شامل ساخت ویروس های مرگبار توسط هوش مصنوعی، حمله به زیرساخت ها یا تسریع جنگ های جهانی بود. یک سوال این است که پس از استعفای یک محقق Anthropic در این هفته بر دنیای فناوری تسلط یافته است: آیا هوش مصنوعی می تواند همه ما را بکشد؟ جیکوب کوکسون که قبلاً در OpenAI کار می‌کرد، روز سه‌شنبه در یک پست X با اعلام استعفای خود از آنتروپیک گفت که «افرادی که هوش مصنوعی می‌سازند، عمیقاً معتقدند که این هوش مصنوعی می‌تواند تا پایان دهه همه ما را بکشد». ایوان هوبینگر، که تیم تست استرس آنتروپیک را رهبری می‌کند، از کوکسون حمایت کرد و گفت که او شخصاً معتقد است که هوش مصنوعی بیش از 10 درصد احتمال دارد که همه انسان‌ها را در آن بازه زمانی بکشد. این هشدارها پس از ماه‌ها تماس از سوی محققان و مدیران ارشد هوش مصنوعی برای کاهش سرعت توسعه هوش مصنوعی منتشر می‌شود، در میان ترس از اینکه سیستم‌های خودکار به طور فزاینده می‌توانند از نظارت فرار کنند، رایانه‌ها را هک کنند و سریع‌تر از آنچه مردم می‌توانند آنها را کنترل کنند، بهبود پیدا کنند. این اظهارات همچنین شکاف شدید بین کارشناسان هوش مصنوعی را آشکار کرده است. برخی می ترسند که مردم کنترل سیستم هایی را که توانایی بیشتری نسبت به انسان ها دارند از دست بدهند. برخی دیگر می‌گویند هوش مصنوعی می‌تواند از طریق حملات سایبری، سلاح‌های"}, {"source": "Business Insider", "title": "Ukraine says AI is moving beyond drones and into strike missiles for the first time", "link": "https://www.businessinsider.com/ukraine-developing-ai-assisted-strike-missiles-2026-9", "summary": "A test of a Neptune missile in April 2020. General Staff of the Armed Forces of Ukraine Ukraine is developing artificial-intelligence-enabled missiles, a first as its autonomous warfare evolves. Brave1, Ukraine's state-backed innovation platform, said multiple companies are part of this effort. AI has already been widely incorporated into Ukrainian drones and robots. Ukraine is developing strike missiles augmented by artificial intelligence , a first and a significant step as its offensive weapons become increasingly autonomous. Brave1 , the Ukrainian state-backed innovation platform, confirmed to Business Insider that multiple companies involved in this initiative are developing AI-enabled missiles . Ukrainian companies have widely incorporated AI into their drones and war robots, enabling functions such as decision-making, navigation, and targeting. Missiles are new. \"AI was initially deployed at scale in drones,\" Andrii Hrytseniuk, Brave1's CEO, told Business Insider. \"It's not that fast — it's sufficient for the drones, but missiles require much higher speeds.\" Hrytseniuk shared that AI is now \"increasingly being integrated into missile systems as well. Although it hasn't reached the scale of hundreds of solutions seen in the drone sector, we are already seeing first successes and plenty of developments in progress.\" More than 200 Ukrainian companies were developing AI-based parts for missiles, drones, radars, and other systems, Hrytseniuk said in an earlier interview in May. Ukraine has invested heavily in developing cruise and ballistic missiles. Now it is focusing on incorporating AI into the weapons. Frédéric Pétry/Hans Lucas via Reuters Connect Efforts to integrate AI into missiles appear to have ramped up as Kyiv invests in developing long-range strike weapons , often used to attack military and energy targets inside Russian territory. Mykhailo Fedorov, Ukraine's former defense minister who pushed for advances in battlefield innovation and just launched a high-profile venture fund in Kyiv to invest in military startups, said this week that one of his priorities is \"low-cost strike missiles and, eventually, missiles powered by AI.\" It's unclear how the Ukrainian companies are using AI in the country's missiles and how far along they are in the development process. The technology will add to Kyiv's capabilities, but won't remove humans entirely from the process, Brave1 said. The approach echoes Ukraine's use of AI in warfighting systems more broadl", "date_str": "2026-09-10T13:05:16+00:00", "hash": "caf56e4780bf5056", "title_fa": "اوکراین می گوید هوش مصنوعی برای اولین بار فراتر از هواپیماهای بدون سرنشین و موشک های تهاجمی حرکت می کند", "summary_fa": "آزمایش یک موشک نپتون در آوریل 2020. ستاد کل نیروهای مسلح اوکراین اوکراین در حال توسعه موشک های مجهز به هوش مصنوعی است که برای اولین بار در حال تکامل جنگ خودمختار آن است. Brave1، پلت فرم نوآوری مورد حمایت دولت اوکراین، گفت که چندین شرکت بخشی از این تلاش هستند. هوش مصنوعی قبلاً به طور گسترده در پهپادها و روبات های اوکراینی گنجانده شده است. اوکراین در حال توسعه موشک های تهاجمی است که با هوش مصنوعی تقویت شده اند، که اولین و گام مهمی است زیرا تسلیحات تهاجمی آن به طور فزاینده ای خودمختار می شوند. Brave1، پلت فرم نوآوری مورد حمایت دولت اوکراین، به Business Insider تأیید کرد که شرکت های متعددی که در این ابتکار عمل می کنند در حال توسعه موشک های مجهز به هوش مصنوعی هستند. شرکت‌های اوکراینی به‌طور گسترده‌ای هوش مصنوعی را در پهپادها و روبات‌های جنگی خود گنجانده‌اند که عملکردهایی مانند تصمیم‌گیری، ناوبری و هدف‌گیری را ممکن می‌سازد. موشک ها نو هستند آندری هریتسنیک، مدیر عامل Brave1 به Business Insider گفت: «هوش مصنوعی ابتدا در پهپادها در مقیاس به کار گرفته شد. آنقدرها هم سریع نیست - برای پهپادها کافی است، اما موشک ها به سرعت بسیار بالاتری نیاز دارند. هریتسنیک به اشتراک گذاشت که هوش مصنوعی اکنون \"به طور فزاینده ای در سیستم های موشکی نیز ادغام می شود. گرچه به مقیاس صدها راه حلی که در بخش هواپیماهای بدون سرنشین دیده می شود، نرسیده است، اما ما در حال حاضر شاهد اولین موفقیت ها و پیشرفت های زیادی در حال پیشرفت هستیم.\" استفاده از هوش مصنوعی در سلاح ها فردریک پتری/هانس لوکاس از طریق رویترز کانکت تلاش‌ها برای ادغام هوش مصنوعی در موشک‌ها به نظر می‌رسد با سرمایه‌گذاری کیف در توسعه سلاح‌های حمله دوربرد، که اغلب برای حمله به اهداف نظامی و انرژی در داخل خاک روسیه استفاده می‌شوند، افزایش"}, {"source": "Business Insider", "title": "My friends pay me to watch their kids alongside my own. It's a fulfilling way to make $400 a week as a stay-at-home mom.", "link": "https://www.businessinsider.com/friends-pay-watch-kids-side-hustle-stay-at-home-parent-2026-9", "summary": "Some of my friends pay me to watch their children since I m already staying home with my son. Rachel Meghan Quint I'm a stay-at-home mom, and some friends pay me $25 an hour to watch their kids alongside my son. It's a fairly easy side hustle because I love working with kids and my son enjoys having playdates. It's nice being able to help my mom friends while earning extra money each week. I have been a stay-at-home mom since my son was born in 2024. The cost of day care in my area is high, with prices I saw starting at $1,400 a month for a few hours a week. It didn't make sense for me to work a full-time job only to give my entire paycheck to someone else to watch my kid. So my husband and I decided he would keep his full-time job, and I'd do freelance writing work in between watching our son to give us a little left over for extra expenses after paying rent and bills. My schedule shifted in late 2025 when a friend reached out to me. Since I was staying home with my son, would it be too much trouble if I also watched her daughter? She'd pay me, of course. I wanted to be a good friend and help her out in any way that I could. She was pregnant with her second child and juggling two teaching jobs while her partner was also working. They needed the extra help, and I could offer more flexible hours than any day care. So, I began watching their kid for about 10 hours a week, and my friend became my first client. Being a stay-at-home mom and a babysitter, simultaneously, hasn't been very challenging for me I have experience working with children and enjoy doing it. Rachel Meghan Quint Honestly, when you're home watching a toddler, one more doesn't really make that much of a difference. My son was also excited to have someone to play with regularly, and some of the socialization he may have been missing out on by not going to day care was made up for by his mama taking on another kid. When my friend's second child was born, I continued to babysit for the family, now watching two toddlers and a newborn. That came with its own challenges, but the toddlers usually kept each other entertained while I tended to the baby. Eventually, other moms in our circle found out I was babysitting my friend's kids and asked me to watch theirs as well. I now have three regular babysitting clients, which isn't too challenging for me. I've worked as a babysitter, after-school teacher, and children's library aide in the past. I'm very used to being around kids — I'm with my son during", "date_str": "2026-09-10T12:32:01+00:00", "hash": "3f63b273cf99573f", "title_fa": "دوستانم به من پول می دهند تا بچه هایشان را در کنار بچه های خودم تماشا کنم. این یک راه رضایت بخش برای کسب 400 دلار در هفته به عنوان یک مادر در خانه است.", "summary_fa": "برخی از دوستانم به من پول می دهند تا فرزندانشان را تماشا کنم، زیرا من از قبل با پسرم در خانه مانده ام. ریچل مگان کوینت من یک مادر خانه نشین هستم و برخی از دوستان به من ساعتی 25 دلار می دهند تا بچه هایشان را در کنار پسرم تماشا کنم. این یک کار جانبی نسبتاً آسان است International benchmark Brent crude breached $100 a barrel on Wednesday for the first time since late July and was trading over $101 on early on Thursday. US benchmark West Texas Intermediate was around $96. Even so, Brent remains well below its wartime peak of about $126 a barrel in April. One reason the market absorbed the initial shock better than the scale of the disruption might suggest is China. The world's biggest crude importer slashed its purchases by 40%, or 4.6 million barrels a day, between February and May, significantly pressure on the global oil market, according to the International Energy Agency. Goldman Sachs estimates Brent's fair value — the price suggested by supply, demand, and inventories — would have been $10 to $15 a barrel higher if China had kept its imports steady from March through August, the bank wrote in a report on Monday. \"I don't think we can overestimate the extent to which that has been an important balancing factor,\" David Fyfe, the chief economist at energy and commodities pricing firm Argus, said at the firm's conference in Singapore on Monday. Rystad Energy, a consultancy, sees that shift as a new role for China in the global oil market. CEO Jarand Rystad called the country \"one of the important factors saving the energy system\" at the company's Asia summit in Singapore last week. He likened China to a \"demand-side OPEC\": Instead of controlling how much oil it supplies, China can increasingly help balance the market by changing how much it buys as prices rise and fall. That flexibility rests on a series of buffers China has built over the years — from oil stockpiles and electric vehicles to alternative fuels and supply routes. Loading up on cheap oil China entered the war with a large oil cushion. China imported about 12 million barrels a day in the sec", "date_str": "2026-09-10T12:18:40+00:00", "hash": "1fb015e96c7524ab", "title_fa": "نفت 100 دلاری نقش جدید چین به عنوان اوپک طرف تقاضا را در معرض آزمایش قرار می دهد", "summary_fa": "عقب نشینی شدید چین از واردات نفت به کاهش فشار بر قیمت جهانی نفت خام در طول جنگ ایران کمک کرده است. چن جیمین / سرویس خبری چین / VCG / گتی ایماژ جنگ ایران بزرگترین اختلال در عرضه نفت در تاریخ را ایجاد کرد، اما قیمت نفت خام به طرز شگفت انگیزی بالا رفته است. چین واردات نفت را 40 درصد کاهش داد و به کاهش بحران کمک کرد. گلدمن می گوید در غیر این صورت قیمت برنت می تواند 10 تا 15 دلار بالاتر باشد. ذخایر عظیم نفت، جایگزین های زغال سنگ، خودروهای برقی و مسیرهای عرضه جایگزین به چین فضای کمتری برای خرید داده است. نفت به بالای 100 دلار در هر بشکه بازگشته است زیرا درگیری های مجدد بین ایالات متحده و ایران نگرانی ها از اختلالات بیشتر عرضه را در بازاری که پیش از این با بزرگترین اختلال در عرضه نفت در تاریخ مواجه شده است، افزایش داده است. قیمت نفت برنت روز چهارشنبه برای اولین بار از اواخر جولای از 100 دلار در هر بشکه عبور کرد و در اوایل روز پنجشنبه بیش از 101 دلار معامله شد. معیار ایالات متحده وست تگزاس اینترمدیت حدود 96 دلار بود. با این حال، برنت بسیار پایین تر از اوج خود در زمان جنگ یعنی حدود 126 دلار در هر بشکه در ماه آوریل است. یکی از دلایلی که بازار شوک اولیه را بهتر از مقیاسی که ممکن است نشان دهد، جذب کند، چین است. بر اساس گزارش آژانس بین‌المللی انرژی، بزرگترین واردکننده نفت خام جهان بین فوریه تا مه خرید خود را 40 درصد یا 4.6 میلیون بشکه در روز کاهش داد که فشار قابل توجهی بر بازار جهانی نفت وارد کرد. این بانک روز دوشنبه در گزارشی نوشت: گلدمن ساکس تخمین می‌زند که ارزش منصفانه برنت - قیمت پیشنهادی برنت، عرضه، تقاضا و موجودی‌ها -"}, {"source": "Business Insider", "title": "The US Army is betting on new AI navigation for its vehicles when GPS is jammed", "link": "https://www.businessinsider.com/us-army-betting-on-ai-navigation-vehicles-when-gps-jammed-2026-9", "summary": "Recent conflicts have shown the pervasiveness of GPS jamming and connection issues. US Army Reserve photo by Capt. Katherine Bustos The US Army is fielding TERN's AI-based navigation system on a variety of vehicles. TERN said the system can operate offline without GPS or a connection. Military leaders anticipate troops will face consistent jamming in potential future wars. In future wars, US forces could find themselves fighting against enemy electronic warfare and jamming. The lack of GPS and network connectivity could impact everything from navigation to communications. The challenge is forcing leaders to assess potential vulnerabilities and determine how they need to adapt. A newly announced US Army contract for an artificial intelligence-based alternative offers a potential solution. On Thursday, defense tech company TERN announced an $11.26 million deal with the US Army to deploy its AI-based technologies on Army vehicles, offering soldiers an alternative to GPS should they lose GPS due to signal disruptions or jamming . The contract includes TERN's Independently Derived Positioning System and Vehicle Health Maintenance System, both of which operate without GPS or external connections. \"It can't be expected that GPS is going to be available on the battlefield moving forward,\" Brett Harrison, the president and cofounder of TERN, told Business Insider. \"That's kind of a given at this point,\" he said. TERN's technology makes use of the sensors a vehicle already has, \"making them smarter\" with AI, Harrison said, and pre-loads a geographic area that soldiers can view like a digital map. Soldiers can use it completely offline to see their vehicle's position and surroundings. According to the company, the continuous positioning and waypoint-based routing also map out off-road environments that traditional navigation systems often struggle with. If they regain connection, the map will then update and operate similarly to civilian navigation apps. Shaun Moore, CEO and cofounder of TERN, said the interface is designed to be user-friendly for soldiers. TERN s program is designed to be intuitive and user-friendly for soldiers, the company said. Photo courtesy of TERN The vehicle health system uses similar methods to constantly monitor maintenance needs and fuel levels. It's able to flag issues as they arise so commanders can have a better sense of overall equipment and operational requirements . Harrison said the decision to develop these systems and make them lo", "date_str": "2026-09-10T12:00:39+00:00", "hash": "0487a38b9ee136ea", "title_fa": "ارتش ایالات متحده روی ناوبری هوش مصنوعی جدید برای وسایل نقلیه خود شرط می‌بندد وقتی GPS مسدود می‌شود", "summary_fa": "درگیری‌های اخیر فراگیر شدن پارازیت GPS و مشکلات اتصال را نشان داده است. عکس ذخیره ارتش ایالات متحده توسط سروان کاترین بوستوس ارتش ایالات متحده در حال پیاده سازی سیستم ناوبری مبتنی بر هوش مصنوعی TERN بر روی انواع وسایل نقلیه است. TERN گفت این سیستم می تواند به صورت آفلاین بدون GPS یا اتصال کار کند. رهبران نظامی پیش بینی می کنند که سربازان در جنگ های احتمالی آینده با پارازیت های مداوم مواجه خواهند شد. در جنگ‌های آینده، نیروهای ایالات متحده می‌توانند خود را در حال مبارزه با جنگ الکترونیکی دشمن و پارازیت بیابند. فقدان GPS و اتصال شبکه می تواند بر همه چیز از ناوبری گرفته تا ارتباطات تأثیر بگذارد. چالش این است که رهبران را وادار می‌کند تا آسیب‌پذیری‌های بالقوه را ارزیابی کنند و تعیین کنند که چگونه باید سازگار شوند. قرارداد تازه اعلام شده ارتش ایالات متحده برای جایگزین مبتنی بر هوش مصنوعی یک راه حل بالقوه ارائه می دهد. روز پنجشنبه، شرکت فناوری دفاعی TERN از قراردادی 11.26 میلیون دلاری با ارتش ایالات متحده برای استقرار فناوری های مبتنی بر هوش مصنوعی بر روی خودروهای ارتش خبر داد و به سربازان در صورت از دست دادن GPS به دلیل اختلال در سیگنال یا پارازیت، جایگزینی برای GPS ارائه کرد. این قرارداد شامل سیستم موقعیت یابی مستقل TERN و سیستم تعمیر و نگهداری سلامت خودرو است که هر دو بدون GPS یا اتصالات خارجی کار می کنند. برت هریسون، رئیس و بنیانگذار TERN به Business Insider گفت: «نمی توان انتظار داشت که GPS در میدان جنگ در حال حرکت رو به جلو در دسترس باشد. او گفت: «این در این مرحله به نوعی داده شده است. هریسون گفت، فناوری TERN از حسگرهایی استفاده می کند که یک وسیله نقلیه از قبل دارد و آنها را با هوش مصنوعی \"هوشمندتر\" می کند و یک منطقه جغرافیایی"}, {"source": "Business Insider", "title": " ه کارکنان و بهترین مشتریان شما برای سال‌های آینده درباره آن صحبت می‌کنند، از تخته‌های غذاخوری لذیذ گرفته تا یکی از جفت‌های مورد علاقه ما از هدفون‌های حذف نویز. اینها گزینه های عالی برای اشتراک گذاری در سراسر شرکت یا جشن گرفتن نقاط عطف کارمندان و سالگردهای کاری هستند. اکثر این محصولات را می توان به راحتی به صورت عمده سفارش داد، با بسیاری از مارک ها که شخصی سازی را با آرم شرکت شما و حمل و نقل انعطاف پذیر به مکان های مختلف ارائه می دهند. تا جایی که امکان داشت، ما اطلاعات مربوط به سیاست‌های هدایای شرکتی هر برند را پیوند دادیم. اگر به دنبال یافتن هدایای مناسب برای همکاران به صورت فردی هستید، راهنمای هدیه اختصاصی ما از بهترین هدایا برای همکاران و هدایایی برای رئیس خود را در نظر بگیرید. وقتی صحبت از سفارش‌های عمده و سفارشی به میان می‌آید، توصیه می‌کنیم تا زمانی که جدول زمانی شما اجازه می‌دهد برای اطمینان از تحویل به‌موقع قبل از تاریخ مورد نظر، آن را"}, {"source": "Business Insider", "title": "One of McKinsey's top AI leaders explains how it's stopping staff from overspending on tokens", "link": "https://www.businessinsider.com/mckinsey-partner-consultants-managing-ai-costs-token-spend-2026-9", "summary": "Wolf von Dewitz/picture alliance via Getty Images McKinsey advises some of the world's biggest companies on managing their AI spend. Internally, the firm has implemented controls to help manage how its staff use AI tokens. One solution is an email alert when consultants' AI usage gets too high. Consulting firms moved quickly to make AI part of employees' working lives . Now they are confronting the cost of using it at scale. One of McKinsey's strategies for managing rising costs isn't to cap consultants' use of AI but to let them know when they're using too much. The firm tracks consumption on a user-by-user basis and alerts its employees via email when their AI usage gets too high, said Debasish Patnaik, who leads QuantumBlack — McKinsey's AI, data, and analytics group — in the UK. The alert system was introduced firmwide in the summer. \"Similar to using mobile data on a work phone, we tell them this is how you could do things to make it more cost-effective for the firm,\" said Patnaik. Companies that initially focused on encouraging AI experimentation are now confronting the cost of operating the technology at scale. The age of freewheeling AI token use came to an end earlier this year as LLM providers moved from subscriptions to consumption-based pricing models. Consulting firms and other enterprise users are now charged based on the number of tokens — the small chunks of text an AI model reads and produces — they use, rather than a flat access rate, making efficiency more important as usage grows. In September, OpenAI announced that its most prolific users of AI coding agents now consume more than $7,000 worth of tokens a day. McKinsey's approach to managing that spending pressure rests on transparency and education, Patnaik said. By May 2026, the firm was processing about five trillion AI tokens a month, according to a company blog post. Consumption was highly concentrated: about 10% of users accounted for roughly 65% of the total, with consultants and software engineers among the heaviest users. Debasish Patnaik is the leader of McKinsey s QuantumBlack arm in the UK. McKinsey The AI usage alerts aren't intended to discourage employees from using AI, but to show them what they are consuming and help them complete the same work more efficiently . \"We really believe in giving autonomy to the consultants,\" said Patnaik. Ensuring they have the right education about how to use tools has been key for managing usage, he added, noting that McKinsey has already", "date_str": "2026-09-10T09:53:23+00:00", "hash": "90320acea9b0f008", "title_fa": "یکی از رهبران برتر هوش مصنوعی مک کینزی توضیح می دهد که چگونه کارمندان را از خرج بیش از حد روی توکن ها باز می دارد.", "summary_fa": "Wolf von Dewitz/تصویر اتحاد از طریق Getty Images مک کینزی به برخی از بزرگترین شرکت‌های جهان در مورد مدیریت هزینه‌های هوش مصنوعی خود مشاوره می‌دهد. در داخل، این شرکت کنترل هایی را برای کمک به مدیریت نحوه استفاده کارکنانش از توکن های هوش مصنوعی پیاده سازی کرده است. یک راه حل این است که وقتی میزان استفاده از هوش مصنوعی مشاوران خیلی زیاد می شود، هشدار ایمیلی است. شرکت های مشاوره به سرعت حرکت کردند تا هوش مصنوعی را بخشی از زندگی کاری کارکنان کنند. اکنون آنها با هزینه استفاده از آن در مقیاس روبرو هستند. یکی از استراتژی‌های مک‌کینزی برای مدیریت هزینه‌های فزاینده محدود کردن استفاده مشاوران از هوش مصنوعی نیست، بلکه اطلاع دادن به آنها در صورت استفاده بیش از حد است. Debasish Patnaik، سرپرست QuantumBlack - گروه هوش مصنوعی، داده ها و تجزیه و تحلیل مک کینزی - در بریتانیا، گفت: این شرکت مصرف را بر اساس کاربر به کاربر ردیابی می کند و از طریق ایمیل به کارکنان خود در صورت افزایش استفاده از هوش مصنوعی آنها هشدار می دهد. سیستم هشدار در تابستان به طور کامل معرفی شد. Patnaik می‌گوید: «مانند استفاده از داده‌های تلفن همراه در تلفن کار، ما به آنها می‌گوییم که این روشی است که می‌توانید کارهایی را انجام دهید تا آن را برای شرکت مقرون به صرفه‌تر کنید.» شرکت‌هایی که در ابتدا بر تشویق آزمایش‌های هوش مصنوعی تمرکز داشتند، اکنون با هزینه‌های عملیاتی این فناوری در مقیاس مواجه هستند. عصر استفاده از توکن هوش مصنوعی در اوایل امسال به پایان رسید، زیرا ارائه دهندگان LLM از اشتراک به مدل های قیمت گذاری مبتنی بر مصرف نقل مکان کردند. شرکت‌های مشاور و سایر کاربران سازمانی اکنون بر اساس تعداد توکن‌ها - تکه‌های کوچک متنی که یک مدل هوش مصنوعی می‌خواند و تولید می‌کند - به جای یک نرخ دسترسی ثابت، از آنها"}, {"source": "Business Insider", "title": "Seeking nominations for the most influential finance recruiters on Wall Street", "link": "https://www.businessinsider.com/seeking-nominations-most-influential-recruiters-finance-list-2026-9", "summary": "Spencer Platt/Getty Images Business Insider is putting together a list of the top recruiters on Wall Street. We want to know which headhunters are most essential for getting a high-finance job. Submit your nominations using the form below by October 2. Getting a job on Wall Street is fiercely competitive. Behind the scenes are the headhunters who make all the difference. Who are the recruiters whom aspiring dealmakers, investors, and traders should know? Business Insider is putting together a list of the top recruiters to break into private equity, hedge funds, investment banks, and trading firms. Business Insider will put together this list based on the nominations we receive and additional reporting. We'll consider a number of factors including: That they're based in the US Their impact, including firms they recruit for and specific hires they've placed in 2026 Their strength of network, and reputation with clients and candidates Their ability to advise, not just fill roles The roles they focus on Fill out the form here , or below: Read the original article on Business Insider", "date_str": "2026-09-10T09:51:01+00:00", "hash": "a51ef3ca4c01114b", "title_fa": "به دنبال نامزدی برای تأثیرگذارترین استخدام کنندگان مالی در وال استریت", "summary_fa": "Spencer Platt/Getty Images Business Insider فهرستی از برترین استخدام‌کنندگان در وال استریت را گردآوری می‌کند. ما می‌خواهیم بدانیم کدام یک از هدهانترها برای به دست آوردن یک شغل با بودجه بالا ضروری هستند. نامزدهای خود را با استفاده از فرم زیر تا 2 اکتبر ارسال کنید. یافتن شغل در وال استریت به شدت رقابتی است. در پشت صحنه، هدشارچیانی هستند که تفاوت را ایجاد می کنند. استخدام کنندگانی که معامله گران، سرمایه گذاران و معامله گران مشتاق باید آنها را بشناسند چه کسانی هستند؟ Business Insider در حال جمع آوری لیستی از برترین استخدام کنندگان برای نفوذ به سهام خصوصی، صندوق های تامینی، بانک های سرمایه گذاری و شرکت های تجاری است. Business Insider این لیست را بر اساس نامزدهای دریافتی ما و گزارش های اضافی جمع آوری می کند. ما تعدادی از عوامل را در نظر می گیریم از جمله: اینکه آنها در ایالات متحده مستقر هستند تأثیر آنها، از جمله شرکت هایی که برای آنها استخدام می کنند و استخدام های خاصی که در سال 2026 استخدام کرده اند، قدرت شبکه آنها، و شهرت آنها نزد مشتریان و نامزدها، توانایی آنها در مشاوره، نه فقط نقش ها، نقش هایی که روی آنها تمرکز می کنند فرم را در اینجا پر کنید، یا در زیر: مقاله اصلی را در Business Insi بخوانید."}, {"source": "Business Insider", "title": "Wall Street has thrown in the towel on a quick end to the global oil shock", "link": "https://www.businessinsider.com/oil-price-forecasts-global-shock-iran-war-wall-street-outlook-2026-9", "summary": "PDVSA Wall Street is raising its 2027 oil forecasts with a quick return to normal looking less and less likely. The longer crude stays elevated, the more pressure builds on consumers, inflation, bonds, and stocks. Sign up for First Trade , Business Insider's daily markets newsletter. Around the time Ben Shelton was polishing off his US Open victory over Carlos Alcaraz in the wee hours of Wednesday morning, the price of oil was making some waves of its own, climbing back above $100 per barrel . The break into triple digits was weeks in the making. After falling below $80 in early August, oil has been on a mostly uninterrupted climb higher. Any optimism traders have around an Iran-war resolution has fizzled. They're now (re)pricing for a prolonged disruption. But while $100 is an important psychological milestone, a deeper shift is occurring across Wall Street . There's a growing recognition that the global oil shock may not fade as quickly as investors once hoped. A forecast reset Perhaps the most drastic reaction to oil's latest spike came from HSBC, which lifted its 2027 Brent forecast by a whopping $20, to $85. The firm's base case is that Strait of Hormuz flows will recover only gradually, continuing the ongoing supply squeeze. Then there's Goldman Sachs , which raised its 2027 forecast to $80, while also flagging a worst-case scenario of $120 oil where Gulf output remains suppressed. Not to be outdone, Bank of America said continued Middle East conflict could put oil in a $95-to-$120 range, with $150 a possibility if energy infrastructure is damaged further. Even if those forecasts remain below oil's current price, Wall Street is now treating triple-digit crude as a realistic outcome rather than a remote risk. Why \"higher for longer\" is gathering steam Three forces are combining to sustain the ongoing oil shock. First, the Strait of Hormuz — despite occasional signs of progress — is still operating well below normal capacity. Second, the oil stockpiles being used to cushion the blow to prices are getting thinner with every delayed shipment. And finally, while workarounds and new routes have offered relief, they haven't helped enough to avoid a full-blown supply crisis. The old normal is far from being restored, and may never be. The stakes for everyday people A prolonged stretch of $100-plus crude oil impacts consumers well beyond the gas pump (although that certainly hurts too). It also means higher prices for diesel, jet fuel, and shipping, which can", "date_str": "2026-09-10T09:50:01+00:00", "hash": "87a4a8ac793b50db", "title_fa": "وال استریت شوک جهانی نفت را به سرعت پایان داده است", "summary_fa": "PDVSA وال استریت پیش بینی های نفتی خود در سال 2027 را با بازگشت سریع به حالت عادی افزایش می دهد و احتمال کمتری دارد. هر چه قیمت نفت خام طولانی تر بماند، فشار بیشتری بر مصرف کنندگان، تورم، اوراق قرضه و سهام وارد می شود. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. در حوالی زمانی که بن شلتون در ساعات اولیه بامداد چهارشنبه در حال صیقل دادن پیروزی خود بر کارلوس آلکاراز در ایالات متحده بود، قیمت نفت موجی از خود ایجاد کرد و به بالای 100 دلار در هر بشکه رسید. شکستن سه رقمی هفته ها در حال ساخت بود. پس از سقوط به زیر 80 دلار در اوایل آگوست، نفت عمدتاً بدون وقفه صعودی را طی کرد. هر گونه خوش بینی معامله گران به قطعنامه جنگ ایران ناپدید شده است. آنها اکنون برای یک اختلال طولانی مدت (دوباره) قیمت گذاری می کنند. اما در حالی که 100 دلار یک نقطه عطف روانی مهم است، تغییر عمیق تری در وال استریت رخ می دهد. این درک رو به رشدی وجود دارد که شوک جهانی نفت ممکن است به همان سرعتی که سرمایه گذاران امیدوار بودند از بین نرود. بازنشانی پیش‌بینی شاید شدیدترین واکنش به جدیدترین افزایش قیمت نفت از سوی اچ‌اس‌بی‌سی بود که پیش‌بینی خود برنت در سال 2027 را با 20 دلار افزایش به 85 دلار رساند. مورد اصلی این شرکت این است که جریان تنگه هرمز تنها به تدریج بهبود می یابد و به فشار عرضه ادامه می دهد. پس از آن گلدمن ساکس است که پیش‌بینی سال 2027 خود را به 80 دلار افزایش داد، در حالی که بدترین سناریوی نفت 120 دلاری را که در آن تولید خلیج‌فارس همچنان سرکوب می‌شود، نشان داد. بانک آمریکا گفت که ادامه درگیری در خاورمیانه می تواند قیمت نفت را در محدوده 95 تا"}, {"source": "Business Insider", "title": "Blackstone swipes left on Bumble after doubling its investment", "link": "https://www.businessinsider.com/blackstone-exiting-bumble-investment-return-bmbl-dating-apps-2026-9", "summary": "Getty Images; Tyler Le/BI Blackstone and Bumble are headed for a breakup. While Bumble's stock has struggled, Blackstone doubled its money. Blackstone sold early, making most of its money in the first two years. After almost seven years together, it looks like Blackstone and Bumble are splitting , and the private-equity giant is poised to walk away with a tidy return despite the dating app's massive stock decline. Blackstone first bought a majority stake in Bumble 's parent MagicLab in 2019 at a $3 billion valuation. Just over a year later, Bumble went public and ended its first trading day worth roughly $13 billion. The good times didn't last. The dating app is now worth less than $450 million as shares have fallen more than 96% from their high. Blackstone entered into a deal with UBS late last year that has the firm on track to sell out of its Bumble position in the first half of next year, according to SEC filings. While investors who bought on IPO day never saw their shares climb to that day's heights, Blackstone was able to recoup roughly double the $2.1 billion it and venture capital co-investor Accel invested in Bumble in 2019, according to Business Insider's analysis of SEC filings. The key to Blackstone's return was cashing out early. It began taking money off the table before Bumble even traded in the public market, recouping its investment at the IPO, and then making the bulk of its profits through stock sales later that year. At Bumble's public-market peak, Blackstone's investment looked like it could be much more lucrative. Forbes estimated around the IPO that the firm was sitting on a fourfold paper return, though much of those unrealized gains were erased as its stock price dipped. Blackstone's Bumble purchase still generated an outsized 98% internal rate of return , or IRR, a private capital industry-favored metric that prioritizes an early return on capital, according to a person familiar with the investment. Here's a look back at Blackstone's Bumble deal as the two companies head toward a breakup. Looking back on the Bumble-Blackstone business Within the first two years of the Bumble deal, Blackstone and its investors had already made their money back and then some. Blackstone used Bumble's debt to pay itself a $334 million dividend in late 2020, and then, during the IPO a few months later, sold its position down from 83.6% to 53.2%, netting nearly $2 billion. Later in 2021, while Bumble was valued north of $50 per share, the firm sold an", "date_str": "2026-09-10T09:41:01+00:00", "hash": "29b00f58ac7036c5", "title_fa": "بلک استون پس از دوبرابر کردن سرمایه گذاری خود، بامبل را ترک کرد", "summary_fa": "گتی ایماژ; تایلر لی/بی بلکستون و بامبل به سمت جدایی می روند. در حالی که سهام بامبل با مشکل مواجه شده است، بلک استون پول خود را دو برابر کرد. بلک استون زود فروخته شد و بیشتر پول خود را در دو سال اول به دست آورد. پس از تقریباً هفت سال زندگی مشترک، به نظر می‌رسد که بلک استون و بامبل در حال جدا شدن هستند و این غول سهام خصوصی با وجود کاهش شدید سهام اپلیکیشن دوست‌یابی، آماده است تا با بازدهی منظمی کنار برود. بلک استون برای اولین بار اکثریت سهام MagicLab مادر Bumble را در سال 2019 با ارزش 3 میلیارد دلار خریداری کرد. بیش از یک سال بعد، بامبل وارد بورس شد و اولین روز معاملاتی خود را به ارزش حدوداً 13 میلیارد دلار به پایان رساند. روزهای خوب دوام نداشت ارزش اپلیکیشن دوستیابی اکنون کمتر از 450 میلیون دلار است، زیرا سهام آن بیش از 96 درصد از بالاترین میزان خود کاهش یافته است. بر اساس اسناد SEC، بلک استون در اواخر سال گذشته با UBS قراردادی منعقد کرد که این شرکت را در مسیر فروش از موقعیت Bumble خود در نیمه اول سال آینده قرار داد. بر اساس تجزیه و تحلیل Business Insider از پرونده های SEC، در حالی که سرمایه گذارانی که در روز عرضه اولیه سهام خرید کرده بودند، هرگز شاهد صعود سهام خود به اوج آن روز نبودند، بلک استون توانست تقریباً دو برابر 2.1 میلیارد دلاری را که Accel در سال 2019 در Bumble سرمایه گذاری کرده بود، جبران کند. کلید بازگشت بلک استون پول نقد زود هنگام بود. قبل از اینکه بامبل حتی در بازار عمومی معامله کند، شروع به برداشتن پول از میز کرد، سرمایه گذاری خود را در IPO جبران کرد و سپس بخش عمده ای از سود خود را از طریق فروش سهام در اواخر"}, {"source": "Business Insider", "title": "Will Apple convince people to actually buy a foldable phone?", "link": "https://www.businessinsider.com/apple-convince-foldable-phone-iphone-duo-2026-9", "summary": "Apple is bringing a foldable phone to the market. The big question: Do customers want it? Bloomberg/Getty Images Apple announced the iPhone Duo on Wednesday, its long-awaited flippable smartphone. It gets a wider screen and selfie-taking upgrades. The Duo is a big risk for the famously meticulous, iterative design tech company. The foldable iPhone is here . It still faces a big question: Will shoppers pay $1,999 (and as much as $3,199) for one? Apple unveiled the long-awaited iPhone Duo on Wednesday during its \"Surprise and Shine\" event . The book-style foldable opens to a 7.6-inch inner display and has a 5.4-inch outer screen, letting users run two apps side by side. It starts at $1,999 — $800 more than the (also new) iPhone 18 Pro. That makes the Duo a big break from the iPhone Apple has sold since 2007: a single-screen rectangle that has become one of the world's most popular consumer products. \"iPhone Duo is the most transformational change to iPhone since the original,\" CEO John Ternus said in a press release. Apple is betting that a supposedly pocketable phone that doubles as a small tablet will persuade buyers to spend more. The company says it's better at taking selfies, and the wide screen offers improved movie-watching. Apple isn't the first company to build a phone that closes. Samsung has sold its Galaxy Fold line since 2019, while Huawei, Google, Motorola, and several Chinese phone makers have also chased the market. Modern foldable phones have remained pricey. The closest US competitors, Samsung's Galaxy Z Fold 8 and Google's Pixel 11 Pro Fold, both start around $1,900. Those phones have yet to capture much of the overall smartphone market. Tech analysis firm IDC expects global foldable-phone shipments to reach 22.9 million units in 2026, up 12.6% from last year. That would represent just over 2% of the global smartphone market. Still, Apple's enormous base of iPhone users could change that equation. Nabila Popal, a senior research director at IDC, said Apple's entry could \"fundamentally alter the market's trajectory.\" \"Without Apple, foldable shipments would have declined at a double-digit rate year over year,\" she said. \"We forecast Apple will ship more than 17 million foldable iPhones by 2027, capturing roughly 40% of the global foldables market.\" Will the iPhone Duo become a status symbol? Its unique shape, high price point, and famously loyal customer base could quickly make it into a marker of wealth. Or, it could be the next iPhone Air", "date_str": "2026-09-10T09:33:01+00:00", "hash": "01e5b275755cbf52", "title_fa": "آیا اپل مردم را متقاعد خواهد کرد که واقعاً یک گوشی تاشو بخرند؟", "summary_fa": "اپل در حال عرضه یک گوشی تاشو به بازار است. سوال بزرگ: آیا مشتریان آن را می خواهند؟ بلومبرگ/گتی ایماژ اپل روز چهارشنبه آیفون Duo را معرفی کرد، گوشی هوشمند قابل انعطاف خود که مدت ها مورد انتظارش بود. صفحه‌نمایش عریض‌تر و به‌روزرسانی‌هایی برای گرفتن سلفی دارد. Duo یک ریسک بزرگ برای شرکت مشهور فناوری طراحی دقیق و تکراری است. آیفون تاشو اینجاست. هنوز با یک سوال بزرگ روبرو است: آیا خریداران برای یک مورد 1999 دلار (و به اندازه 3199 دلار) می پردازند؟ اپل روز چهارشنبه در جریان رویداد \"سورپرایز و درخشش\" خود از آیفون دو مورد انتظار رونمایی کرد. صفحه‌نمایش داخلی 7.6 اینچی و صفحه‌نمایش بیرونی 5.4 اینچی تاشو به سبک کتاب باز می‌شود و به کاربران اجازه می‌دهد دو برنامه را در کنار هم اجرا کنند. قیمت آن از 1999 دلار شروع می شود - 800 دلار بیشتر از آیفون 18 پرو (همچنین جدید). این باعث می‌شود که Duo یک شکست بزرگ نسبت به آیفونی که اپل از سال 2007 به فروش رسانده است: یک مستطیل تک صفحه‌ای که به یکی از محبوب‌ترین محصولات مصرفی جهان تبدیل شده است. جان ترنوس، مدیرعامل این شرکت در یک بیانیه مطبوعاتی گفت: «iPhone Duo متحول‌کننده‌ترین تغییر آیفون از زمان نسخه اصلی است. اپل شرط می‌بندد که یک تلفن جیبی که ظاهراً به عنوان یک تبلت کوچک عمل می‌کند، خریداران را متقاعد می‌کند که بیشتر خرج کنند. این شرکت می‌گوید در گرفتن سلفی بهتر است و صفحه‌نمایش عریض، تماشای فیلم را بهبود می‌بخشد. اپل اولین شرکتی نیست که گوشی بسته می‌سازد. سامسونگ خط تولید گلکسی فولد خود را از سال 2019 فروخته است، در حالی که هوآوی، گوگل، موتورولا و چندین سازنده گوشی چینی نیز بازار را تعقیب کرده اند. تلفن‌های تاشو مدرن همچنان گران هستند. نزدیکترین رقبای آمریکایی، گلکسی زد فولد 8 سامسونگ و پیکسل 11 پرو فولد گوگل، هر"}, {"source": "Business Insider", "title": "T-Pain says these are the 2 rules billionaires taught him for sharing money with friends and family", "link": "https://www.businessinsider.com/t-pain-sharing-money-family-friends-financial-advice-kevin-oleary-2026-9", "summary": "T-Pain shared financial advice during a Twitch stream this month. Kevin Winter/Getty Images T-Pain issues an ultimatum when friends and family ask him for money. He said they can either work for him to earn the money or take a one-time payment. Billionaires like Kevin O'Leary have similar strategies. T-Pain has no qualms about issuing an ultimatum when it comes to his money. The \"Buy U a Drank\" rapper shared how he sets boundaries with friends and family asking for money during a Twitch livestream on August 29.
