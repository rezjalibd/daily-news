 boast incredible landscapes. Matt Stirn The town of Jackson has become one of the most famous and crowded landing bases for people exploring Grand Teton National Park and Yellowstone National Park , but there are several other wonderful satellite communities that deserve attention, too. Dubois, a Wyoming town located about an hour-and-a-half east of Grand Teton, is situated perfectly between the Absaroka Range and Wind River Range and offers a taste of the Old West. Pinedale, an hour-and-a-half south of Jackson, used to be a hub for fur traders and is an exceptional place to explore central Wyoming's mountains and desert. Victor and Driggs are two Idaho towns located just east of the Tetons that are slower-paced, cheaper, and less-crowded alternatives to Jackson. Most travelers automatically book flights to and from the Jackson Hole Airport without checking prices at nearby airports. Consider flying to Jackson and departing from a different airport. Matt Stirn Flying in and out of the Jackson Hole Airport is known to be pretty expensive. Consider booking flights to and from a nearby airport and pairing your trip with a beautiful drive through less-visited areas. Idaho Falls, located only two hours from Jackson, offers striking views over mountain passes. Bozeman, about four hours away, allows you to drive through Yellowstone on the way. Salt Lake City , a five-hour drive, offers a beautiful route with multiple hot springs that break up the journey. Some tourists get so excited to see Jackson s moose, elk, and bears that they forget they re wild animals.", "date_str": "2026-11-11T14:35:03+00:00", "hash": "dd19fda1a6c2503f", "title_fa": "من در جکسون، وایومینگ بزرگ شدم. در اینجا 10 اشتباه بزرگی که گردشگران هنگام بازدید از شهر محبوب من مرتکب می شوند، آورده شده است.", "summary_fa": "در طول دهه گذشته، تعداد فزاینده ای از گردشگران را دیده ام که به دنبال ماجراجویی در زادگاه من جکسون، وایومینگ هستند. مت استیرن من در جکسون، وایومینگ، یک مقصد محبوب برای افرادی که از تتون ها ی mit that he can't know everyone and that they are unlikely to confess the things that go wrong to him. But he doesn't need them to. He uses Databricks' newly revised Genie agent for that.", "date_str": "2026-11-11T15:00:00+00:00", "hash": "e9a421e404cb7c13", "title_fa": "عامل هوش مصنوعی جدید دیتابریکس به مدیرعامل علی قدسی حقیقت ناپاک را می گوید", "summary_fa": "با 12000 کارمند، AI قدسی اولین کسی است که اعتراف می کند که نمی تواند همه را بشناسد و بعید است آنها به چیزهایی که برای او اشتباه می کند اعتراف کنند. اما او به آنها نیاز ندارد. او برای این کار از نماینده Genie تازه اصلاح شده Databricks استفاده می کند. دیتابریکس روز چهارشنبه از نسخه به روز شده ای از عامل هوش مصنوعی Genie خود رونمایی کرد که اکنون می تواند کارهای چند مرحله ای را انجام دهد که پایان کار طولانی مدت را می طلبد. این کار را از طریق هستی شناسی که Databricks ساخته است انجام می دهد تا به Genie زمینه مورد نیاز خود را از اطلاعاتی که مشتریان در پلت فرم Databricks ذخیره می کنند، بدهد. این شرکت می‌گوید رهبران شرکت‌ها اکنون می‌توانند طیف وسیعی از وظایف را به نماینده محول کنند و آنها را بدون نظارت کامل می‌کند. برای اثبات این موضوع، علی قدسی، مدیرعامل Databricks به من نشان داد که چگونه از آن در داخل استفاده می کند. او به جای نمایش محصول، نماینده واقعی خود را اخراج کرد و من را در آخرین چت ها و نمودارهایش راهنمایی کرد. او به من نشان داد که چگونه بخش‌هایی از یک نظرسنجی رضایت کارکنان را تجزیه و تحلیل می‌کند که در آن شرکت امتیاز خوبی کسب نمی‌کند، و چگونه به او کمک می‌کند تا اصلاحات آن نمره‌های پایینی را که برخی از مدیران پیشنهاد کرده‌اند ارزیابی کند (و رد کند). او به من نشان داد که چگونه یک فروش بزرگ را به یک مشتری بالقوه خلاصه می کند که ضعیف عمل می کند - از جمله ویژگی هایی که مشتری قبل از خرید می گوید به آن نیاز دارد. همچنین او را برای یک مصاحبه پادکست با مرور حضورهای قبلی خود و ایجاد سؤالات احتمالی آماده کرد. در حین صحبت کردن، او حتی", "image_url": "https://techcrunch.com/wp-content/uploads/2021/04/Ali_Ghodsi.jpg?resize=1200,1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۲۰ آبان • ۱۸:۳۰"}, {"source": "VentureBeat Tech", "title": "TrustedRouter launches three new encrypted 'fusion' models that combine multiple LLMs, including one exclusively with U.S. model providers", "link": "https://venturebeat.com/technology/trustedrouter-launches-three-new-encrypted-fusion-models-that-combine-multiple-llms-including-one-exclusively-with-u-s-model-providers", "summary": "Choosing an AI model for your company is hard enough. Choosing which one to use for every job is harder. Should you send a tricky code review to Anthropic’s Claude Fable 5.2, try an open-weight model such as Meituan’s LongCat-2.5, or use something else? The answer can change from one task to the next, even inside the same application. Read more", "date_str": "2026-11-11T14:39:03+00:00", "hash": "5db16d3ea1677c79", "title_fa": "TrustedRouter سه مدل جدید رمزگذاری شده «فیوژن» را راه اندازی می کند که چندین LLM را ترکیب می کند، از جمله یکی منحصراً با ارائه دهندگان مدل ایالات متحده", "summary_fa": "انتخاب یک مدل هوش مصنوعی برای شرکت شما به اندازه کافی سخت است. انتخاب اینکه کدام یک برای هر کاری استفاده شود سخت تر است. آیا باید یک بررسی کد پیچیده به Anthropic's Claude Fable 5.2 ارسال کنید، یک مدل وزن باز مانند Meituan's LongCat-2.5 را امتحان کنید یا از چیز دیگری استفاده کنید؟ پاسخ می تواند از یک کار به کار دیگر تغییر کند، حتی در داخل همان برنامه. ادامه مطلب", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic"], "datetime_fa": "۲۰ آبان • ۱۸:۰۹"}, {"source": "Ars Technica", "title": "Google DeepMind just mathematically verified key parts of Signal", "link": "https://arstechnica.com/ai/2026/11/signals-encryption-just-passed-an-ai-powered-mathematical-checkup/", "summary": "Google DeepMind researchers used agentic AI to mathematically prove, or “formally verify,” a number of the Signal protocol’s key cryptographic guarantees—a landmark development for the widely used cryptography and AI itself. Conducted as a sort of proof-of-concept project in just four weeks, the work is significant in two ways. It serves as further independent validation of the cryptography that protects massive quantities of the world's communications on platforms like the Signal app , Google Messages, and WhatsApp. And it demonstrates Google DeepMind's formal verification capabilities using a new AI framework called AlphaProof Code. More broadly, AI-aided formal verification is having a moment, but it is unclear how practical it will be for widespread use and how effective it can be at securing large amounts of code. Proponents of formal verification have long referred to it as a sort of holy grail in software security, because it uses math to check and validate that software is functioning as intended—in other words, that it doesn't have critical vulnerabilities. Read full article Comments", "date_str": "2026-11-11T14:08:57+00:00", "hash": "345389d7aa341d93", "title_fa": "Google DeepMind فقط بخش‌های کلیدی سیگنال را از نظر ریاضی تأیید کرد", "summary_fa": "محققان Google DeepMind از هوش مصنوعی عاملی برای اثبات ریاضی یا «تأیید رسمی» تعدادی از ضمانت‌های رمزنگاری کلیدی پروتکل سیگنال استفاده کردند - یک پیشرفت برجسته برای رمزنگاری پرکاربرد و خود هوش مصنوعی. این کار که به عنوان نوعی پروژه اثبات مفهوم تنها در چهار هفته انجام شد، از دو جنبه قابل توجه است. این به عنوان اعتبار سنجی مستقل بیشتر رمزنگاری عمل می کند که از مقادیر عظیمی از ارتباطات جهان در سیستم عامل هایی مانند برنامه سیگنال، پیام های گوگل و واتس اپ محافظت می کند. و قابلیت‌های تأیید رسمی Google DeepMind را با استفاده از یک چارچوب هوش مصنوعی جدید به نام AlphaProof Code نشان می‌دهد. به طور گسترده تر، تأیید رسمی با کمک هوش مصنوعی زمان زیادی دارد، اما مشخص نیست که چقدر برای استفاده گسترده عملی خواهد بود و چقدر می تواند در ایمن سازی مقادیر زیادی کد مؤثر باشد. طرفداران راستی‌آزمایی رسمی مدت‌هاست که از آن به عنوان نوعی جام مقدس در امنیت نرم‌افزار یاد می‌کنند، زیرا از ریاضیات برای بررسی و اعتبارسنجی اینکه نرم‌افزار همانطور که در نظر گرفته شده است، استفاده می‌کند – به عبارت دیگر، آسیب‌پذیری‌های حیاتی ندا بات هدایت‌کننده‌ی پارک خودرو را معرفی کرد. سازندگان، ظاهر این ربات چهارچرخ را با الهام از شخصیت‌های انیمیشن محبوب «ماشین‌ها» طراحی کرده‌اند تا رانندگان را به‌سمت فضاهای خالی پارکینگ راهنمایی کند. شرکت رباتیک Field AI که مهندسان سابق گوگل دیپ‌مایند، ناسا، انویدیا و تسلا در سال ۲۰۲۳ میلادی آن را پایه‌گذاری کردند، این دستیار پارکینگ را با همکاری بخش والت دیزنی ایمجینیرینگ توسعه داده است. هدف از ساخت نمونه‌ی مورد بحث، ارزیابی عملکرد سیستم‌های خودران و بررسی شیوه‌ی واکنش مراجعان به دستیاران ماشینی اعلام می‌شود. ربات مورد نظر روی یک نمایشگر بزرگ شبیه به شیشه‌ی جلوی خودرو، چشم‌های متحرک و پلک‌های انیمیشنی را نشان می‌دهد. تابلوی متحرکی روی سقف دستگاه تعبیه شده است که پیام‌های جهت‌دهنده را برای راهنمایی رانندگان تغییر می‌دهد. در کنار نمایشگر و تابلو، دو بازوی مجهز به چراغ‌های قرمز نیز شبیه به ماموران هدایت هواپیماها در باند فرودگاه، مسیر دقیق را علامت می‌دهند تا ارتباط چندلایه‌ای میان راننده و ربات شکل بگیرد. مقامات دیزنی‌لند تأکید کرده‌اند که زمان‌بندی مشخصی برای بهره‌برداری عملیاتی در پارکینگ‌ها وجود ندارد و تکنولوژی رونمایی‌شده صرفا نمونه‌ی مفهومی است. شرکت‌های سازنده‌ی خودروهای خودران نیز با چالش مشابهی در انتقال مفاهیم ماشینی به انسان‌ها در ترافیک شهری روبه‌رو هستند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/disney-cars-parking-robot-6af43eed1e22a6ae5bd3ec1c?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Nvidia"], "datetime_fa": "۲۰ آبان • ۱۸:۱۰"}, {"source": "Zoomit", "title": "استرالیا به جنگ هوش مصنوعی سرکش می‌رود", "link": "https://www.zoomit.ir/ai-articles/470857-australia-ai-safety-regulator-penalties/", "summary": "استرالیا نهاد ناظر جدیدی برای ایمنی هوش مصنوعی با اختیارات گسترده جهت اعمال جریمه‌های سنگین علیه شرکت‌های متخلف تأسیس می‌کند.", "date_str": "2026-11-11T14:00:00+00:00", "hash": "632de15735a4118d", "title_fa": "استرالیا به جنگ هوش مصنوعی سرکش می‌رود", "summary_fa": "استرالیا نهاد ناظر جدیدی برای ایمنی هوش مصنوعی با اختیارات گسترده جهت اعمال جریمه‌های سنگین علیه شرکت‌های متخلف تأسیس می‌کند. تبلیغات دولت استرالیا نهاد نظارتی جدیدی برای ایمنی هوش مصنوعی تاسیس می‌کند که اختیارات گسترده‌ای برای اعمال «جریمه‌های سنگین» بر شرکت‌های متخلف خواهد داشت. آنتونی آلبانیزی ، نخست‌وزیر استرالیا، در کانبرا اعلام کرد لوایح قانونی مرتبط با این فناوری در حال تدوین است و سازمان جدید بخشی از همین چارچوب قانونی خواهد بود. بر اساس مقررات پیش‌رو، شرکت‌ها موظف می‌شوند حوادث امنیتی را فورا گزارش دهند و امکان ارزیابی مستقل مدل‌های خود را فراهم کنند. دولت استرالیا در بیانیه‌ای رسمی تأکید کرد محافظت‌های امنیتی اجباری از طریق استانداردهای مصوب، بر تمامی فعالان حوزه‌ی هوش مصنوعی پیشرو اعمال می‌شود. مؤسسه‌ی ایمنی هوش مصنوعی استرالیا نیز با نهاد نظارتی تازه همکاری می‌کند تا همگام با تحولات جهانی، نظارت فنی دقیقی اعمال شود. نگرانی‌ها پیرامون ایمنی این فناوری زمانی اوج گرفت که مدلی متعلق به اوپن‌ای‌آی وب‌سایت یکی از بخش‌های دولتی استرالیا را هک کرد. هرچند داده‌های شخصی حساسی افشا نشد، اما وقوع حادثه هشداری جدی درباره‌ی خطرات بالقوه به شمار رفت. بررسی‌های رسمی پس از نفوذ سایبری منجر به پیشنهاد اصلاح قوانین کیفری شد تا تخلفات فاحش با مجازات‌های سنگین روبه‌رو شوند. همچنین جرمی تحت عنوان «ناتوانی در پیشگیری» تعریف می‌شود تا اگر شرکتی اقدامات لازم برای جلوگیری از آسیب‌رسانی مدل‌های خود انجام ندهد، پاسخگو باشد. دولت استرالیا تمام توصیه‌های این بازنگری را پذیرفته است. آنتونی آلبانیزی می‌گوید: «ما دیده‌ایم که در سایر نقاط جهان بدون وجود چارچوب‌های ایمنی یا استانداردها چه اتفاقی افتاده است. در غیاب این سازوکارها، مقبولیت اجتماعی از بین می‌رود و ایمنی و امنیت تضعیف می‌شوند.» توسعه‌ی شتابان فناوری چالش‌های زیرساختی نیز به همراه داشته و احداث دیتاسنترها با مخالفت‌های محلی روبه‌رو شده است. اعتراض‌های اخیر در حومه‌ی سیدنی و ملبورن به لغو و تعلیق چند پروژه‌ی بزرگ", "image_url": "https://api2.zoomit.ir/media/rogue-artificial-intelligence-robot-face-6af2bc861e22a6ae5bd3e784?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۲۰ آبان • ۱۷:۳۰"}, {"source": "Zoomit", "title": "والپیپرهای اصلی ویندوز بازطراحی می‌شوند؛ نسخه‌های جدید چه‌شکلی‌اند؟", "link": "https://www.zoomit.ir/os/470961-windows-11-new-default-wallpapers/", "summary": "مایکروسافت در حال بازطراحی والپیپرهای پیش‌فرض ویندوز ۱۱ است که می‌تواند نشانه‌ای از تغییر استراتژی انتشار سیستم‌عامل تا سال ۲۰۲۷ باشد.", "date_str": "2026-11-11T13:59:36+00:00", "hash": "53e2e7f47e228885", "title_fa": "والپیپرهای اصلی ویندوز بازطراحی می‌شوند؛ نسخه‌های جدید چه‌شکلی‌اند؟", "summary_fa": "مایکروسافت در حال بازطراحی والپیپرهای پیش‌فرض ویندوز ۱۱ است که می‌تواند نشانه‌ای از تغییر استراتژی انتشار سیستم‌عامل تا سال ۲۰۲۷ باشد. تبلیغات مایکروسافت روی تصاویر پس‌زمینه‌ی کاملا جدیدی برای ویندوز ۱۱ کار می‌کند. تغییر تصویر شاخص سیستم‌عامل معمولا رویدادی فراتر از یک تحول ظاهری ساده به شمار می‌رود و مسیر توسعه‌ی آینده اکوسیستم ویندوز را مشخص می‌سازد. خلق والپیپرهای پیش‌فرض جدید اغلب حاکی از معرفی یک نسخه‌ی کاملا جدید مثل ویندوز ۱۲ یا یک بازنگری و نوسازی اساسی در نسل فعلی است. طبق بررسی‌های تخصصی، احتمال وقوع سناریوی دوم یعنی ارتقای بنیادین سیستم‌عامل فعلی به‌مراتب بیشتر از رونمایی زودهنگام ویندوز ۱۲ ارزیابی می‌شود. تصاویر جدید قرار است در نسخه‌های متفاوتی برای ویرایش‌های گوناگون مانند ویندوز ۱۱ پرو و مدل‌های تجاری سیستم‌عامل ارائه شوند. با وجود شباهت‌هایی به طرح Bloom، این تصاویر صرفا تغییر رنگ یا ویرایش جزئی نسخه‌های قبلی نیستند و ساختاری نوآورانه و مجزا دارند. برنامه‌های پیشین مایکروسافت برای انتشار نسخه‌ی جدید ویندوز در هر سه سال، پس از خروج پانوس پانای تغییر کرد. در حال حاضر نشانه‌ها حاکی از آماده‌سازی یک به‌روزرسانی بزرگ برای سال ۲۰۲۷ به‌جای مهاجرت به ویندوز ۱۲ است؛ اما احتمال درز زودهنگام فایل نهایی این تصاویر در فضای مجازی وجود دارد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/microsoft-surface-pro-9-desktop-63a9993e8318d4958b6224b5?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["Microsoft"], "datetime_fa": "۲۰ آبان • ۱۷:۲۹"}, {"source": "Business Insider", "title": "I tried the famous 'PieCaken,' a 6-pound cake stuffed with 3 different pies. It was a huge hit at Friendsgiving.", "link": "https://www.businessinsider.com/piecaken-review-famous-thanksgiving-cake-2026-11", "summary": "The PieCaken is a six-pound cake with four different desserts stuffed inside, including three pies. Courtesy of PieCaken The PieCaken features pecan pie, pumpkin pie, spice cake, and apple pie filling all in one dessert. I tried it for the first time and couldn't believe how delicious every layer tasted. The PieCaken also wowed everyone at my Friendsgiving. I couldn't believe my eyes when I first saw a photo of the PieCaken. Kelly Ripa once said that the six-pound cake — which has four desserts stuffed inside — was the \"greatest thing that happened to me, besides the birth of my children.\" There's a pecan pie on the bottom, followed by a pumpkin pie layer, and then spice cake on top. If that's not enough, there's apple pie filling in the center, and everything is held together by cinnamon buttercream. It sounded like the perfect wacky dessert to bring to Friendsgiving . The PieCaken was invented by the pastry chef Zac Young. Cindy Ord/Stringer/Getty Images Young first came up with the idea in 2015 while working as the executive pastry chef at David Burke Fabrick in New York City. The restaurant's executive chef was serving a Turducken special (a chicken stuffed into a duck stuffed into a turkey), and Young decided he wanted to make a sweet version. He was just planning to make a dessert to serve by the slice. But when Young posted a photo on Instagram, the PieCaken immediately took off. The Thanksgiving dessert can be purchased on Goldbelly for $110 and ships across the US. Also currently available are a red velvet PieCaken and a $160 DecaCaken featuring 10 layers, including chocolate cream pie, coffee cake, and New York cheesecake. My PieCaken was delivered یده را مطرح کرد. سرآشپز اجرایی رستوران در حال سرو غذای ویژه Turducken (مرغ پر شده در اردک پر شده در بوقلمون) بود و یانگ تصمیم گرفت که می خواهد یک نسخه شیرین درست کند. او فقط قصد داشت یک دسر درست کند تا آن را سرو کند. اما زمانی که یانگ عکسی را در اینستاگرام منتشر کرد، PieCaken بلافاصله بلند شد. دسر شکرگزاری را می توان در Goldbelly با قیمت 110 دلار خریداری کرد و در سراسر ایالات متحده ارسال کرد. همچنین در حال حاضر یک PieCaken قرمز مخملی و یک DecaCaken 160 دلاری با 10 لایه شامل پای", "image_url": "https://i.insider.com/6aebed8a308912814ed71171?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۲۰ آبان • ۱۷:۵۸"}, {"source": "Business Insider", "title": "I sold almost everything I owned before moving abroad. Now, I'm returning home with even less stuff than I packed.", "link": "https://www.businessinsider.com/sold-belongings-before-international-move-like-owning-less-2026-11", "summary": "I moved to Japan with just two bags worth of belongings. Alessa Hickman I got rid of almost everything I owned before moving to Japan , and I don't miss most of it. Having fewer belongings has made me aware of how little I need, and I've since gotten rid of more. Now, I'm preparing to return to Canada, but I plan to maintain a more minimalist lifestyle. Just about a year ago, I left my Ottawa apartment, sold most of my belongings, packed up the rest, and moved to Japan with a suitcase and carry-on. Since then, I've brought those same bags to short-term Airbnb rentals across Tokyo, Osaka, Kumamoto, and Saitama. After almost a year, I've stopped missing most of the things I left behind and started loving the flexibility that comes with having so much less. In fact, these days, I'm questioning why I ever needed so much in the first place. I wasn't exactly a minimalist back in Canada I sold most of my belongings before moving. Alessa Hickman I've always been a bit of a \"stuff\" person. I had an overflowing closet, shelves full of books, and shoes for xplores how new technologies could permit better operations in the Arctic. NATO is experimenting with amphibious robots that can cross water and ice in the Arctic, where the harsh environment could limit command and control. The Western military alliance launched a new initiative, Task Force X-Arctic, in June to explore how networked uncrewed and autonomous systems can provide NATO forces with more situational awareness across the High North. The new task force, led by NATO's Allied Command Transformation and Centre for Maritime Research and Experimentation, has carried out initial testing in an operational environment and is now exploring ways to deploy uncrewed vehicles in unconventional roles . João Alves, who leads CMRE's exercises and experimentation branch, told reporters at a roundtable discussion on Tuesday that NATO is exploring the use of uncrewed ground vehicles \"to expand the presence on the ice cap,\" where the alliance's footprint had previously been insufficient. \"We are talking about using unmanned amphibious vehicles that can go from ice to water and back from water to ice,\" Alves said, adding that the vehicles can be used to patrol areas and establish communication links with drones and underwater vessels. The amphibious vehicles were initially designed to have a driver, but CMRE modified them to be uncrewed. Having these kinds of platforms \"opens up a lot of possibilities,\" particularly for communications, Alves said. NATO is also working with other types of vehicles, including conventional uncrewed ground vehicles that can carry communications payloads and set up on hilltops for greater coverage — terrain features can disrupt signals — or launch drones as a mothership would. Uncrewed surface vessels operate off the coast of Norway during NATO s Arctic Sentry mission. US Navy Portuguese Capt. João Piedade, who leads the operational command-and-control branch for ACT's capability development directorate, told reporters on the call that the unc category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۱۶:۳۴"}, {"source": "Lifehacker", "title": "Aura's Second E-Ink Picture Frame Is Much Improved, and Much Cheaper", "link": "https://lifehacker.com/tech/aura-e-ink-picture-frame-review?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Last year, Aura released the Aura Ink, its first digital photo frame using an e-ink display rather than the LCD screens common to the other devices that made them the major player in the market (Aura customers have already uploaded more than one billion photos this year alone). When I reviewed the original 13-inch Aura Ink last year , I recommended it, with a few major reservations. Today, Aura announced its second-generation 10-inch Ink frame , and while I wouldn't exactly say they've solved every one of my issues, the new device is significantly improved and much cheaper. The benefits of e-ink (and the tradeoffs) Most digital photo frames will remind you of an iPad with a decorative border around it. They're great for displaying hundreds of your photos with vibrant color, but not everyone loves the look, or the fact that these frames always need to be plugged in. An e-ink frame, on the other hand, uses a variant of the sort of low-power screen you'd find in a Kindle Colorsoft less bright, but more paperlike, and much closer to the look of a traditionally printed photo. The Aura Ink is a great choice if you want a digital frame that looks more like a \"real\" photo and doesn't need to be plugged in and doesn't light up like a tablet (though it does have a light, it's really to make up for the fact that color e-ink screens don't reflect light very well, and thus can make your pictures look way too dark without an additional boost). You'll still get all the benefits of an LCD frame like the Aura Aspen, including the ability to load photos from anywhere using the versatile Aura app (you can now even text them directly to the ce their own music. It gives me goosebumps. I just burst with pride when I see them. Like Spiro and RAYE, Dean has experienced a major rise in the past couple of years. She took home best new artist at the Grammys in 2026, an award for which RAYE was nominated the year prior, and for which Spiro is highly anticipated to be up for in 2027. As the three Brits have dominated in 2025 and 2026, Bey has kept a low profile musically. She hasn t dropped an album since 2024 s two-week Billboard 200 -topper Cowboy Carter , though fans are holding out hope that her long-awaited Act III is coming any day now. See Bey for i-D below. View this post on Instagram", "date_str": "2026-11-11T18:51:56+00:00", "hash": "899cd3c742b71519", "title_fa": "بیانسه از RAYE، سینا اسپیرو و اولیویا دین \"Goosebumps\" دریافت می کند: \"وقتی آنها را می بینم فقط از غرور منفجر می شوم\"", "summary_fa": "بیانسه فکر می کند RAYE همان دختر است و سینا اسپیرو و اولیویا دین هم همینطور. برچسب مرتبط بیانسه دومین دعوای «بی‌بنیاد» را در مورد نمونه سوپراستار بیگانه محکوم کرد. مصاحبه با آی دی که چهارشنبه (11 نوامبر) منتشر شد. او در حالی که در مورد راه اندازی برند مراقبت از مو Cecred خود در بریتانیا بود، قبل از ذکر چند نمونه گفت که صحنه موسیقی کشور را دوست دارد. بی به این نشریه گفت، من شاهد بزرگ شدن سینا اسپیرو از یک دختر جوان زیبا به یک زن جوان با استعداد فوق العاده هستم. مدت زیادی است که خانواده او را به خوبی می شناسم. وقتی بچه بود صدایش را شنیدم که آواز می خواند و نمی توانم غروری که برایم به ارمغان می آورد را بیان کنم. چه استعداد خدادادی! این برنده 35 جایزه گرمی از طریق پدر سینا، جواهرساز گلن اسپیرو، که سال هاست برای Bey کیوریتور و طراحی می کند، با خانواده اسپیرو مرتبط است. در سال 2018، او به دلیل اهدای انگشتر پروانه ای چشم نواز که جی زی به او هدیه داده بود و توسط آقای اسپیرو طراحی شده بود به موزه ویکتوریا و آلبرت لندن خبرساز شد. همچنین در این مصاحبه، آلوم Destinys Child فریاد زد RAYE، که سال‌ها به عنوان آهنگساز کار می‌کرد و آهنگ‌های موفقیت‌آمیز را برای ستارگانی مانند Bey نوشته بود، قبل از اینکه در سال 2023 با فیلم مستقل Escapism پخش شود. بی گفت، من همچنین به RAYE که برخی از آهنگ‌های The Gift را نوشت، بسیار افتخار می‌کنم. او چنین مسح کرده است. آسیب پذیری و خرد را در صدای او می شنوید. غول مراقبت از مو افزود، من همچنین اولیویا دین را دوست دارم و به آن احترام می گذارم. این زنان زیبا همه مهربانند، لطف دارند و موسیقی خود را می نویسند و تولید می کنند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P105ZYWL-e1794418658642.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۲۲:۲۱"}, {"source": "Billboard", "title": "BigXthaPlug Scores His First No. 1 Rap Album With ‘Better Over Time’", "link": "https://www.billboard.com/music/chart-beat/bigxthaplug-better-over-time-number-1-rap-albums-chart-1236379353/", "summary": "BigXthaPlug scores his first No. 1 on Billboard ’s Top Rap Albums chart as Better Over Time debuts atop the list dated Nov. 14. The set, released on BigXthaPlug/United Masters, starts with 35,000 equivalent album units earned in the United States for the tracking week of Oct. 29-Nov. 5, according to Luminate. Related BigXthaPlug Pleads No Contest in 2025 Weapon Case BigXthaPlug Honored by UnitedMasters at Pre-Grammy Celebration in L.A. BigXthaPlug Signs to Sony Music Publishing Better Over Time ’s first-week figure breaks down into 29,000 units from streaming activity (representing 29.1 million official on-demand streams of the album’s songs), traditional album sales contributing 6,000 units and a negligible number of track-equivalent sales. (One unit equals the following levels of consumption: one album sale, 10 individual tracks sold from an album, or 1,000 paid/subscription tier or 2,500 ad-supported tier official on-demand audio and video streams for a song on the album.) Thanks to the new album, the Dallas-based rapper born Xavier Landum achieves his first No. 1 on Top Rap Albums with his fourth entry. He first reached the ranking in 2024 with Take Care , which debuted and peaked at No. 3, while 2025’s I Hope Your Happy secured him the runner-up rank. Earlier this year, 600 Entertainment: NWA a collaborative project with Ro$ama and other artists reached No. 25. In addition to its chart-topping rap opening, Better Over Time launches at No. 2 on the Top R B/Hip-Hop Albums chart, a new career peak, and at No. 7 on the all-genre Billboard 200 , matching I Hope You re Happy for the rapper’s best showing. Largely due to its streaming performance, Better Over Time lands 10 tracks on the 50-position Hot R B/Hip-Hop Songs chart. Current single “Burn,” featuring Ava Max, ranks highest, pushing 27-14 as both the week’s Sales Gainer and Streaming Gainer for the largest improvements in both metrics. Previous release “Lite,” featuring Belly Gang Kushington, reenters at No. 27 to capture a new peak in its third week on the chart. Here’s a list of BigXthaPlug’s placements on this week’s Hot R B/Hip-Hop Songs chart, all debuts excluding “Burn” and “Lite.” No. 14, “Burn,” feat. Ava Max No. 18, “I Like It,” feat. Loe Shimmy No. 27, “Lite,” feat. Belly Gang Kushington No. 31, “Give It All” No. 34, “No Limit,” feat. Leon Thomas No. 37, “Da Fucc,” feat. Ro$ama No. 38, “I Get It” No. 40, “Cracced” No. 42, “Faf,” feat. GloRilla No. 48, “Believe,” feat. Babyface Ray Lil Yacht", "date_str": "2026-11-11T18:21:31+00:00", "hash": "c20bd5acd4e68314", "title_fa": "BigXthaPlug اولین آلبوم رپ شماره 1 خود را با \"بهتر در طول زمان\" دریافت کرد", "summary_fa": "BigXthaPlug اولین شماره 1 خود را در جدول آلبوم‌های رپ برتر بیلبورد به‌عنوان اولین آلبوم Better Over Time در 14 نوامبر به دست می‌آورد. این مجموعه که در BigXthaPlug/United Masters منتشر شد، با 35000 واحد آلبوم معادل 29-هفته O-N در ایالات متحده شروع می‌شود. 5، به گفته لومینیت. BigXthaPlug مرتبط اعلام کرد که در سال 2025 در مورد سلاح 2025 مسابقه ای نمی دهد. BigXthaPlug Signs to Better Music Publishing Sony در طول زمان رقم هفته اول از فعالیت استریم به 29000 واحد تقسیم می‌شود (نماینده 29.1 میلیون جریان رسمی درخواستی از آهنگ‌های آلبوم)، فروش آلب tend Travis Kelce’s Chiefs Game in Kansas City The magazine announced the news on Wednesday (Nov. 11), while revealing that Barbie director Greta Gerwig will present the award to Swift at the gala. Taylor Swift took on an industry that has long underestimated women and won on every front: artistically, commercially and on the question of who owns her work,” said THR editor-in-chief Maer Roshan. “She reclaimed her catalog, set new terms for the artists who follow her and became the most popular musician in the world while doing it — and helping scores of other artists along the way. We’re proud to honor her with the Sherry Lansing Leadership Award. The award named for the first woman to head a Hollywood Studio — Lansing is the former head CEO of Paramount Pictures — recognizes trailblazers and philanthropists in entertainment and media, with past recipients including Adele, Gwyneth Paltrow, Charlize Theron, Reese Witherspoon, Barbra Streisand, Meryl Streep and others. I am so pleased to recognize Taylor Swift with the award that bears my name,” Lansing told THR . “She has paved the way for women in music, demonstrating what is possible when a woman takes ownership of her work, her career and her future. Equally impressive is her generosity and commitment to giving back. She is an extraordinary talent and a remarkable role model, and I could not be more proud to see her receive this award. Swift and Gerwig are friends and have been spotted out together having dinner in New York and last October, the singer appeared on Late Night with Seth Meyers to promote her The Life of a Showgirl album, where she told a funny story about how then-boyfriend Travis Kelce mixed up Hugh Grant s wife and Gerwig at an Eras Tour stop.", "date_str": "2026-11-11T18:14:02+00:00", "hash": "e44c1acf556602bf", "title_fa": "تیلور سویفت جایزه رهبری شری لنسینگ 2026 را از گرتا گرویگ در جشن زنان در سرگرمی دریافت کرد", "summary_fa": "تیلور سویفت در اواخر امسال با دریافت جوایز رهبری شری لنسینگ در مراس d into the No. 1 position on the Nov. 11, 2006, list. Related Carrie Underwood, Luke Bryan and Lionel Richie Will Return For ‘American Idol’ Season 25 Miranda Lambert Thinks She Carrie Underwood Deserve a Ribbon for Surviving Male-Dominated Era of Country Music Chart Rewind: In 2016, the Country Music Association Engineered the Ultimate Group Effort Underwood was not the original target for the feisty title. Songwriters Chris Tompkins (Dierks Bentley’s “Drunk on a Plane,” Florida Georgia Line’s “Dirt”) and Josh Kear (Lady A’s “Need You Now,” Lainey Wilson’s “Watermelon Moonshine”) had “Redneck Woman” singer Gretchen Wilson in mind for the story of a woman who trashes her cheatin’ boyfriend’s vehicle in a fit of anger. Underwood had developed a brand as a heartland girl next door as a competitor on Fox’s American Idol , which she won in May 2005. “Cheats” broke that mold, though she didn’t need coaching to recognize its potency; she identified it as a song she wanted to record the first time she heard it. Produced by Mark Bright (Rascal Flatts, Sara Evans), “Cheats” emerged as the third of four radio-promoted country singles from Underwood’s debut album, Some Hearts , released by Arista Nashville on Nov. 15, 2005. After “Jesus, Take the Wheel” became her first Hot Country Songs leader on Jan. 21, 2006, follow-up “Don’t Forget to Remember Me” reached No. 2 that August. “Cheats” snuck onto the list in February and charted during most of the run of “Forget,” becoming an obvious single in the process. “Cheats” also became a crossover smash, climbing to the top 10 on Pop Airplay, Adult Pop Airplay and Adult Contemporary in 2007. That June, it rode to No. 6 on the Billboard Hot 100 during a 64-week run on the chart overall, then the fifth-longest in the ranking’s history. “Cheats” won single of the year from both the Academy of Country Music and the Country Music Association, and it also set up Underwood as a powerful voice for take-no-prisoners female anthems.", "date_str ms in Wednesday) in de hoofdrollen. De film speelt zich af tijdens de prestigieuze kunstbeurs Art Basel in Miami en draait om een ambitieuze galeriehoudster die na een mislukt huwelijk en financiële problemen wanhopig probeert door te breken in de kunstwereld. Het verhaal draait om Polina Polinski (Natalie Portman), die met haar eigen galerie eindelijk naam wil maken. Samen met haar jonge assistente Kiki Gorman (Jenna Ortega) bereidt ze een belangrijke tentoonstelling voor, waarop het werk van de veelbelovende kunstenares Stella Burgess (Da Vine Joy Randolph) centraal staat. Wanneer de invloedrijke kunstinfluencer Dalton Hardberry (Zach Galifianakis) de galerie bezoekt, loopt de situatie volledig uit de hand. Dalton krijgt een ongeluk en komt om het leven nadat hij op een groot kunstwerk terechtkomt. In plaats van de politie te bellen, bedenkt Polina een bijzonder gewaagd plan: ze besluit het lichaam te laten liggen en het aan bezoekers te presenteren als onderdeel van de tentoonstelling. Tot haar verbazing blijkt het macabere kunstwerk een enorm succes. Bezoekers zijn gefascineerd, de belangstelling voor de galerie groeit en het werk trekt zelfs de aandacht van invloedrijke kunsthandelaren. Polina ziet plotseling de kans om haar financiële problemen op te lossen en eindelijk de erkenning te krijgen waar ze zo naar verlangt. Maar hoe populairder het kunstwerk wordt, hoe moeilijker het wordt om de waarheid verborgen te houden. Polina en Kiki moeten steeds ingewikkeldere leugens verzinnen, terwijl nieuwsgierige bezoekers, kunstverzamelaars en ook de politie zich met de zaak beginnen te bemoeien. Ondertussen dreigt het lichaam hun geheim letterlijk te verraden. Wanneer komt The Gallerist op Netflix? The Gallerist ging in januari 2026 in première op het Sundance Film Festival en verschijnt op 4 december 2026 in de Amerikaanse bioscopen, waarna de film dus de oversteek zal maken naar Netflix. Vermoedelijk gebeurt dat al betrekkelijk snel, omdat The Gallerist in Europa ge ۲۸"}, {"source": "Rolling Stone", "title": "Coachella 2027 Lineup Takeaways: Madonna’s Special Spot, Indie Surprises, and… No Drake?", "link": "https://www.rollingstone.com/music/music-features/coachella-2027-lineup-takeaways-madonna-drake-snub-1235653885/", "summary": "The poster for next year's festival is here, and we have questions", "date_str": "2026-11-11T18:41:19+00:00", "hash": "4c2d4fac12982b35", "title_fa": "پیشنهادات ترکیبی Coachella 2027: مکان ویژه مدونا، سورپرایزهای مستقل، و... بدون دریک؟", "summary_fa": "پوستر جشنواره سال آینده اینجاست، و ما سؤالاتی داریم که چه کسی بالاترین صورتحساب را دریافت کرد؟ آن هنرمند افسانه ای را زیر کی گذاشتند!؟ اسم آن با کوچکترین فونت چیست؟ و دقیقا چگونه ویزر در مورد قرار دادن لوگوی flying-W خود روی پوستر مذاکره کرد؟ وقتی کوچلا ترکیب خود را فاش می کند همیشه سوالات زیادی وجود دارد. امسال، سه نفر اصلی Dua Lipa، SZA و Tame Impala - سه مورد از منطقی‌ترین انتخاب‌ها برای یک جشنواره بزرگ در دهه 2020 - ممکن است کمی غافلگیرکننده باشند. اما بقیه ترکیب پر از نام های هیجان انگیز، و چند حذف قابل توجه است. در اینجا پنج مورد از مهم ترین پیشنهادات ما آورده شده است. در سال 2006، اندکی پس از انتشار آلبوم کلاسیک خود به نام Confessions on a Dance Floor، مدونا اجرایی کرد که به آینده کوچلا اشاره کرد. در آن زمان، جشنواره به شدت به راک، ایندی و چیزی که برخی هنوز آن را آلترناتیو می‌نامیدند متمایل شد - سرفصل‌های آن سال شامل Depeche Mode، فرانتس فردیناند، و Yeah Yeah Yeahs بود. بنابراین خبر اینکه مدونا در چادر رقص صحرا ظاهر خواهد شد با هیجان جهانی روبرو نشد. تعدادی از طرفداران تی‌شرت‌های Madonna Killed Coachella را پوشیدند و کری براونشتاین، بازیگر Sleater-Kinney، حتی مدونا را از روی صحنه رد کرد. اما مجموعه شش آهنگ یک پیروزی کامل بود، و کواچلا در نهایت تحت سلطه پاپ قرار گرفت - شاید به یک خطا. در هر صورت، بازگشت مدونا به چادر رقص، شاید با اجرای طولانی‌تر این بار، نمی‌تواند جشن مناسب‌تری برای آلبوم فوق‌العاده او یعنی Confessions II باشد. — برایان هیات هنگامی که ترکیب یک شبه سقوط کرد، بسیاری از مردم به همین موضوع فکر کردند: دریک کجاست؟ این واکنشی بود که توس t 100 No. 1 All for You. I am so excited, Miss Jackson said in the clip. I cannot wait to watch you perform tonight. Watch Brandy and Monica s DWTS performance above, and check out Crow and Morris singing on the show below.", "date_str": "2026-11-11T17:42:24+00:00", "hash": "959610cee1757d20", "title_fa": "اجرای زنده براندی و مونیکا، شریل کرو و مارن موریس برای «شب گرمی» در «DWTS» را تماشا کنید.", "summary_fa": "Dancing With the Stars در روز سه‌شنبه (10 نوامبر) از چند ستاره دیگر روی صحنه استقبال کرد، در قسمت شب گرمی نمایش، موسیقی زنده ارائه شده توسط برندی و مونیکا، شریل کرو و مارن موریس به برنامه اضافه شد. جانت جکسون بسیار هیجان‌زده در فیلم سورپرایز DWTS Cameo Honoring Former All For You Video Dancer: I Feel So Honoured Harry Shum Jr. و جنا جانسون در DWTS یک رقص وحشتناک وحشتناک با بریتنی اسپیرز را بترسانند: تماشا کنید که جولیا استایلز با میشل ویلیامز تماس گرفت تا برکتش را برای DWTS روتین اختصاص داده شده به هیث لجر مهمانان ویژه برخی از شناخته‌شده‌ترین آهنگ‌های خود را اجرا کردند، در حالی که شش جفت در حال مبارزه در مقابل یکدیگر بودند. تا یک هفته دیگر در نمایش مسابقه سالن رقص بماند. دو آیکون R B برای خواندن آهنگ اصلی 100 بیلبورد 13 هفته‌ای خود به نام پسر من است، در حالی که امبر گلن و ازرا فرچ سعی کردند با روتین‌هایی که همزمان روی صحنه اتفاق می‌افتند و با همراهی حرفه‌ای‌های مربوطه خود، دانیلا پاشا پاشکوف و طرفداران مربوطه‌شان، دانیلا پاشا پاشکوف و هم‌زمان روی صحنه اتفاق می‌افتند، از آیکون‌های R B بیرون آمدند. کرو وقت خود را روی صحنه با نواختن All I Wanna Do در سال 1994 گذراند و با نواختن یک گیتار مشکی براق در حالی که کانر وود و رایلی آرنولد حرفه ای با مائورا هیگینز و مارک بالاس روبرو شدند، هر دو زوج برداشت خود را از چا چا به نمایش گذاشتند. جنا دوان و طرفدار وال چمرکوفسکی نیز چا چا د، با تاتیانا علی و یان راونیک پا به پای موریس می‌خواندند، در حالی که موریس آهنگ 2018 Smash The Middle را بدون شرکای Zedd و Grey می‌خواند. با وجود پیروزی مقابل علی و راونیک، دوان و چمرکوفسکی به عنوان زوج حذف شده این هفته", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/brandy ed the unusual artifact from his collection [ ]", "date_str": "2026-11-11T17:48:24+00:00", "hash": "54fa79507d2beaf8", "title_fa": "موی تناسلی راسل برند پس از محکومیت تجاوز به عنف از موزه لندن برداشته شد، متصدی کتاب می گوید: «هیچ تمایلی برای شنیدن نام او دوباره ندارم»", "summary_fa": "پس از محکومیت و محکومیت این کمدین به تجاوز و تجاوز جنسی، موهای تناسلی راسل برند دیگر در موزه کنجکاوی لندن به نمایش گذاشته نمی شود. ویکتور ویند، کلکسیونر عجیب و غریب موزه کنجکاوی ویکتور ویند، تاریخچه غیرطبیعی هنرهای زیبا در هاکنی، تأیید کرد که این مصنوع غیرعادی را از مجموعه خود حذف کرده است [ ] موهای تناسلی راسل برند پس از محکومیت و تجاوز جنسی این کمدین دیگر در موزه کنجکاوی لندن به نمایش گذاشته نمی شود. ویند بعدازظهر چهارشنبه به ورایتی گفت: من آنها را مستقیماً از روی نمایش برداشتم و تمایلی به شنیدن نام او دوباره ندارم، او جایی در موزه وحشت من ندارد. این حذف تنها چند روز پس از آن صورت می گیرد که برند، 51 ساله، در روز دوشنبه، 9 نوامبر، در دادگاه سلطنتی Southwark لندن به 10 سال و شش ماه زندان محکوم شد. هیئت منصفه کمدین و بازیگر سابق را در یک فقره تجاوز جنسی و سه مورد تجاوز جنسی شامل چهار زن مجرم تشخیص داد که این جرایم بین سال‌های 2004 تا 2009 و در طول به شهرت رسیدن او در تلویزیون بریتانیا و هالیوود رخ داده است. او از دو اتهام تجاوز جنسی دیگر و یک مورد تلاش برای حمله غیرقانونی تبرئه شد. موهای ناحیه تناسلی یکی از بدنام ترین اقلام مجموعه ویند برای بیش از یک دهه بود. طبق گزارشی از موزه در سال 2016، این مو در اصل توسط زنی که ادعا می کرد برند را در سالن کامدن تاون اصلاح کرده بود، برای ویند فرستاده شد. این کمک با نامه ای دست نویس همراه بود که در آن توضیح می داد که او فکر می کند که مجموعه دار از این سوغاتی غیر معمول قدردانی می کند. اصالت مو به طور مستقل تأیید نشده است.", "image_url": "https://variety.com/wp-content/uploads/2026/10/GettyImages-2300430525-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۰ آبان • ۲۱:۱۸"}, {"source": "Variety", "title": "’Unguarded,’ Mario Casas’ Second Movie as a Director, Starring Mario and Oscar Casas, Joins Film Factory’s AFM Slate", "link": "https://variety.com/2026/film/global/unguarded-mario-casas-oscar-casas-film-factory-nostromo-1236944445/", "summary": "Action drama-thriller “Unguarded,” the second movie as a director of Mario Casas, toplined by Mario and Óscar Casas as underground bare-knuckle MMA fighters, will be brought to market by Film Factory Ent. at this week’s AFM. Film Factory will handle international sales. International star Mario Casas (“The Invisible Guest,” “Cross the Line,” “Bird Box Barcelona)” [ ]", "date_str": "2026-11-11T17:34:11+00:00", "hash": "1f031d6552e79654", "title_fa": "«بی نگهبان»، دومین فیلم ماریو کاساس در مقام کارگردان، با بازی ماریو و اسکار کاساس، به فیلم AFM Slate می‌پیوندد.", "summary_fa": "فیلم اکشن درام-هیجان‌انگیز «Unguarded»، دومین فیلم کارگردان ماریو کاساس، که توسط ماریو و اسکار کاساس به‌عنوان مبارزان زیرزمینی MMA با بند انگشت برهنه معرفی می‌شود، توسط Film Factory Ent به بازار عرضه خواهد شد. در AFM این هفته کارخانه فیلم فروش بین المللی را انجام خواهد داد. ستاره بین المللی ماریو کاساس («مهمان نامرئی»، «عبور از خط»، «جعبه پرنده بارسلونا)» [ ] محصول Nostromo Pictures («Apocalipsis Z»، «The Invisible Guest») در ارتباط با Movistar Plus+ («La Bola Negra»، «The Beloved»، «Sirāt aufguarded apackage»)، فیلم درام هیجان‌انگیز «Unguarded»، دومین فیلم کارگردان ماریو کاساس، که توسط ماریو و اسکار کاساس به‌عنوان مبارزان زیرزمینی MMA با بند انگشت برهنه معرفی می‌شود، توسط Film Factory Ent به بازار عرضه خواهد شد. در AFM این هفته کمپانی برادران وارنر این فیلم را در سال 2027 در سینماهای اسپانیا اکران خواهد کرد. \"Unguarded\" (\"A puño descubierto\") که به عنوان یک درام اکشن زمینی و با شدت بالا و یک داستان خام و احساسی از برادری، گناه و بقا توصیف می شود، به لوئیس می پردازد که در دنیای جنگ های زیرزمینی در کنار برادر دانیل زنده می ماند که پیوند برادرانه اش \"به همان اندازه که شکننده است\" قوی است. یکی از خواهر و برادرها خواب فرار را می بیند و دیگری در دام می ماند. در خلاصه داستان آمده است: «در میان وفاداری، ضرورت و تصمیم‌های دشوار، هر دو باید با محدودیت‌های خود روبرو شوند. «بی‌حافظ» داستانی درباره برادری، فداکاری و امکان (یا عدم امکان) فرار از سرنوشت موروثی است. تانیا نوریگا («بانو آلتاگراسیا»)، میگدالیا اچ و خاویر اولیوراس بازیگران را تکمیل می‌کنند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Unguarded-@-Irene-Kuroi-y-Laura-Pattoglio-Prensa-13.05.26.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۰ آبان • ۲۱:۰۴"}, {"source": "Variety", "title": "‘Avengers: Endgame Encore’ Sets Disney+ Streaming Release Date", "link": "https://variety.com/2026/film/news/avengers-endgame-encore-disney-streaming-release-date-1236821013/", "summary": "Avengers: Endgame Encore, the extended version of the 2019 blockbuster, will begin streaming on Disney+ on Friday, Nov. 13, roughly a month before Doomsday takes over theaters on Dec. 18. When it released in theaters, the slightly longer version of Endgame added four new scenes that tied into Doomsday. It was also a hit at [ ]", "date_str": "2026-11-11T17:17:18+00:00", "hash": "97048270a1bc9572", "title_fa": "«Avengers: Endgame Encore» تاریخ انتشار استریم دیزنی+ را تعیین می‌کند", "summary_fa": "Avengers: Endgame Encore، نسخه توسعه‌یافته فیلم پرفروش 2019، تقریباً یک ماه قبل از اینکه Doomsday در 18 دسامبر در سینماها شروع شود، در دیزنی پلاس پخش می‌شود. نسخه کمی طولانی‌تر Endgame چهار صحنه جدید را اضافه کرد که به Doomsday گره خوردند. پس از اینکه Spider-Man: Brand New Day رکوردهای باکس آفیس را در تابستان امسال شکست، در [ ] نیز موفق شد، Avengers: Doomsday در تاریخ 18 دسامبر در سینماها اکران می شود. کوین فایگ، مدیر اجرایی استودیو مارول، اوایل سال جاری در CinemaCon از اولین جزئیات Infinity Vision، یک فرمت جدید پرمیوم برای تماشای Doomsday رونمایی کرد. دیزنی در حال تغییر نام نمایشگرهای موجود در سینماهای ممتاز به عنوان نمایش Infinity Vision است تا اطمینان حاصل کند که طرفداران می توانند پایان بازی را با بهترین تصاویر و صوت ممکن تماشا کنند. این حرکت در حالی صورت می‌گیرد که فرمت‌های ممتاز برای بسیاری از فیلم‌ها و برادران وارنر، سر و صدای زیادی را به همراه داشته است. Dune: Part 3 تمام صفحه‌های Imax را به مدت سه هفته در اختیار گرفته است تا در همان روز با Doomsday منتشر شود. در حالی که هیچ صفحه نمایش Imax در حال حاضر در دسترس نیست، دیزنی و مارول به Infinity Vision روی آورده اند تا در میان مسابقه Dunesday که در 18 دسامبر برگزار می شود، هیاهویی برای دنباله Avengers ایجاد کنند. درست مانند باربی و اوپنهایمر که پدیده باربنهایمر را خلق کردند، Doomsday و Dune: Part 3 با هم روبرو خواهند شد. اوپنهایمر کریستوفر نولان از فرمت‌های نمایشگر بزرگ استفاده کرد تا باکس آفیس عظیم خود را رشد دهد و طرفداران بسیاری از نمایش‌های Imax را برای فیلم پرفروش تابستانی The Odyssey بار دیگر به فروش رساندند. اکنون Doomsday سعی خواهد کرد همین کار را با Infinity Vision انجام دهد.", "image_url": "https://variety.com/wp-content/uploads/2024/04/MCDAVEN_EC255.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۰ آبان • ۲۰:۴۷"}, {"source": "Variety", "title": "Judge Refuses to Dismiss Trump’s $10 Billion Defamation Suit Against BBC", "link": "https://variety.com/2026/politics/news/trump-bbc-defamation-suit-dismiss-1236944785/", "summary": "A federal judge on Tuesday denied the BBC s motion to throw out President Trump s $10 billion defamation suit over a documentary about the Jan. 6, 2021, attack on the U.S. Capitol. Judge Jeffrey T. Kuntz found that Trump could make an argument that the BBC should be held liable for splicing together two parts of [ ]", "date_str": "2026-11-11T17:15:06+00:00", "hash": "9af41595e79a0dee", "title_fa": "قاضی از رد شکایت 10 میلیارد دلاری ترامپ برای افترا علیه بی‌بی‌سی خودداری کرد", "summary_fa": "یک قاضی فدرال روز سه‌شنبه درخواست بی‌بی‌سی مبنی بر کنار گذاشتن شکایت 10 میلیارد دلاری ترامپ برای افترا به دلیل مستندی درباره حمله 6 ژانویه 2021 به ساختمان کنگره آمریکا را رد کرد. قاضی جفری تی کونتز دریافت که ترامپ می‌تواند استدلال کند که بی‌بی‌سی باید مسئول به هم پیوستن دو بخش [ ] بی‌بی‌سی باشد که تلاش می‌کند این ویرایش را به‌عنوان ویرایش معمولی در نظر بگیرد که یک سخنرانی هفتاد دقیقه‌ای را در دوازده ثانیه خلاصه کند. کونتز حکم داد که دادگاه متقاعد نشده است. این به معنای کوتاه کردن لبه ها نبود، بلکه چیزی متفاوت از آنچه در سخنرانی بیان شد ایجاد کرد. ترامپ در پستی در Truth Social این حکم را به عنوان یک پیروزی بزرگ در برابر اخبار جعلی بی‌بی‌سی جشن گرفت و کونتز را که اوایل امسال او را به سمت نیمکت‌نشینی منصوب کرد، به خاطر حکم قدرتمندش تحسین کرد. کونتز به عنوان قاضی استیناف فلوریدا، نظری را نوشت که به ترامپ اجازه داد از اعضای هیئت پولیتزر شکایت کند. سخنگوی بی بی سی گفت که این سازمان خبری از این حکم تعجب کرده است. سخنگو گفت: ما از این تصمیم تعجب می کنیم اما به اختیارات دادگاه احترام می گذاریم و توجه داشته باشید که پرونده اکنون به مرحله بعدی خواهد رفت. ما به موضع خود اطمینان داریم و از طریق روند قانونی مناسب به پاسخگویی خود ادامه خواهیم داد. ترامپ به خاطر یک مستند پانورامای بی بی سی که اندکی قبل از انتخابات 2024 آمریکا پخش شد، شکایت کرد. برنامه ای با عنوان ترامپ: شانس دوم؟ سخنرانی ترامپ را ویرایش کرد تا خطی را در کنار هم قرار دهد که ما به ساختمان کنگره می رویم و من آنجا با شما خواهم بود، با اظهارنظر دیگری که تقریباً یک ساعت بعد آمد: و ما می جنگیم. ما مثل جهنم می جنگیم و", "image_url": "https://variety.com/wp-content/uploads/2026/09/Donald-Trump-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۰ آبان • ۲۰:۴۵"}, {"source": "Variety", "title": "Filmax Brings to Market ‘A Family,’ Star Ricardo Gómez’s Director Debut ‘Highlighting the Value of Single Mothers’ (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/filmax-a-family-ricardo-gomez-claudia-traisac-1236943247/", "summary": "Spanish studio Filmax has boarded “A Family,” the debut as a director of Ricardo Gómez who attained a huge fanbase in Spain playing Carlitos Alcántara, the young son in family drama “Remember When,” the longest running TV series in Spanish history. A world premiere at Valladolid Film Festival last month, “A Family” marked out Gómez [ ]", "date_str": "2026-11-11T17:00:31+00:00", "hash": "4899d42bc5330c67", "title_fa": "فیلمکس «خانواده» را به بازار می‌آورد، کارگردان ستاره ریکاردو گومز اولین فیلم «برجستگی ارزش مادران مجرد» (اختصاصی)", "summary_fa": "استودیوی اسپانیایی فیلماکس به عنوان اولین کارگردانی ریکاردو گومز که با بازی کارلیتوس آلکانتارا، پسر جوان درام خانوادگی «به یاد بیاور کی»، طولانی‌ترین سریال تلویزیونی تاریخ اسپانیا، طرفداران زیادی در اسپانیا پیدا کرد، «یک خانواده» را انتخاب کرد. اولین نمایش جهانی در جشنواره فیلم وایادولید در ماه گذشته، «یک خانواده» گومز را برجسته کرد [ ] یک فیلم موفق در جشنواره فیلم وایادولید اسپانیا، «یک خانواده» که با استعداد کارگردانی و ساختار پیچیده‌اش شگفت زده شد. با این حال، «یک خانواده» یک دهه به عقب می‌رود و به ملاقات کلارا و کیکه در کلوپی می‌رود که کلارا در آن یک رقص بازی می‌کند، و کیکه با مجوز یک روزه برای شرکت در مراسم خاکسپاری پدرش از زندان بیرون می‌آید. چند سال به سمت غسل تعمید پابلو بروید، جایی که اتفاقات دراماتیک فزاینده ای کلارا را مجبور می کند تا نه تنها برای خودش، بلکه برای پابلو و کیکه نیز تصمیمی تغییر دهد. Filmax در بازار فیلم آمریکا این هفته «یک خانواده» را وارد بازار بین‌المللی می‌کند، جایی که تیزر-تریلر را به خریداران معرفی می‌کند. در این فیلم کلودیا ترایساک («اسکوبار: بهشت ​​گمشده»)، در نقش کلارا، پاتریک کریادو («کریسمس تلخ») در نقش کیکه و آنا واگنر («مهمان نامرئی») در نقش مادر کیکه که مدت‌ها رنج کشیده است، بازی می‌کنند. همچنین جوان تازه وارد، ویکتور لایت را به عنوان پابلو معرفی می کند. گومز گفت: \"هدف من نشان دادن پیچیدگی‌های پیوندهای خانوادگی و مهم‌تر از همه، برجسته کردن ارزش مادران مجرد است. می‌توانید آن را یک نامه عاشقانه سینمایی به همه زنانی بنامید که مجبور بودند و هنوز هم مجبورند بار را به تنهایی تحمل کنند.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/A-FAMILY_DSC04580-UF-LAIALLUCH_S03_OK.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۰ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "Antonio Banderas Film ‘Mare Nostrum’ Picked Up by Buena Vista International for Latin America (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/antonia-banderas-mare-nostrum-buena-vista-latin-america-1236945196/", "summary": "Mare Nostrum, the upcoming feature starring Antonio Banderas and from award-winning Argentinian writer-director duo Mariano Cohn and Gastón Duprat ( Official Competition, The Distinguished Citizen ), has been acquired by Buena Vista International for theatrical and all media distribution in Latin America. HanWay Films is selling the film at the American Film Market. Continuing his collaboration with [ ]", "date_str": "2026-11-11T17:00:02+00:00", "hash": "a86bdc5131b3315b", "title_fa": "فیلم «Mare Nostrum» آنتونیو باندراس توسط Buena Vista International برای آمریکای لاتین انتخاب شد (اختصاصی)", "summary_fa": "Mare Nostrum، فیلم آینده با بازی آنتونیو باندراس و از دو نویسنده و کارگردان آرژانتینی برنده جوایز ماریانو کوهن و گاستون دوپرات (مسابقه رسمی، شهروند ممتاز)، توسط Buena Vista International برای پخش تئاتر و همه رسانه ها در آمریکای لاتین خریداری شده است. HanWay Films این فیلم را در بازار فیلم آمریکا می فروشد. در ادامه همکاری خود با [ ] در حالی که پیش تولید به طور فعال در حال انجام است، قرار است عکاسی اصلی از Mare Nostrum در مارس 2027 در بیلبائو، اسپانیا آغاز شود. تیم خلاق شامل تهیه کننده خوزه لوئیس اسکولار (کشیدن جکی، آکادمی خون آشام)، فیلمبردار برنده جایزه گویا ژاوی گیمنز (ماشینیست، ترانس سیبری) و متخصص VFX دنیای مارول، آرتورو لوپز ایریارته (Murderbot، Money Heist) است که از فناوری اسکنر سه بعدی در بزرگترین فناوری اسکنر کانتینر جهان برای روایت کردن یک صفحه داستانی استفاده می کند. آنها همچنین با طراح تولید معمولی خود، برنده جایزه چندگانه گویا، آلن بینه (جامعه برف، مسابقه رسمی) دوباره متحد می شوند. تهیه کنندگان اجرایی عبارتند از ماریانو کوهن، گاستون دوپرات، آنتونیو باندراس، آلخاندرو رومرز، مانو فابیرو، مانوئل مارتی، گونزالو فرید و کارولینا کراسینسکی. باندراس توسط NuCo Media Group و Greenberg Glusker بازنمایی می شود. Cohn و Duprat توسط NuCo Media Group بازنمایی می شوند.", "image_url": "https://variety.com/wp-content/uploads/2025/11/Antonio-Banderas.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۰ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Mariah Carey, Madison Beer & More: Holiday Moments to Look Forward To | Billboard News", "link": "https://www.billboard.com/video/mariah-carey-madison-beer-holiday-moments-to-look-forward/", "summary": "This is partner content. From Madison Beer’s rumored Disney holiday appearance to Mariah Carey’s annual “It’s Time” kickoff, Billboard News rounds up some of the season’s festive entertainment highlights. Plus, Disney and Hallmark team up for a new movie, and Fraggle Rock: A Holiday Gift brings a dose of nostalgia to Apple TV. Tetris Kelly: From millennial throwbacks to Madison Beer making an appearance in front of an iconic castle. And of course, every Christmas season is Mariah s. Billboard News is breaking down some holiday moments to catch this season, presented by Aperol. Disney always takes care of holiday lovers. This year they partnered with Hallmark on a brand new movie. The Wonderful World of Disney Holiday Spectacular will air on November 30th at 8:00 PM on ABC. Some eagle-eyed Disney fans already caught Madison Beer being filmed in the park. Our favorite holiday diva just released her annual It s Time video, and even dropped a new Gucci ad. But if you wanna see Mimi this holiday season, then for now the only way is internationally, as her Christmas Time tour hits Brazil, the U.K. and more. Apple TV was the home of Mariah s Christmas specials in the past, and this year they re tapping our nostalgia with Fraggle Roc k. We know so much more is yet to be announced, and we can t wait. For all your holiday cheer, you ve been locked with Billboard News.", "date_str": "2026-11-11T17:00:00+00:00", "hash": "56b4dff56a438e2c", "title_fa": "ماریا کری، مدیسون بیر و بیشتر: لحظات تعطیلاتی که باید منتظر آن باشید | اخبار بیلبورد", "summary_fa": "این محتوای شریک است. بیلبورد نیوز از شایعه حضور مدیسون بیر در تعطیلات دیزنی گرفته تا شروع سالانه «وقتش است» ماریا کری، برخی از نکات مهم سرگرمی جشن فصل را گردآوری می کند. به‌علاوه، دیزنی و هالمارک برای یک فیلم جدید با هم همکاری می‌کنند و Fraggle Rock: A Holiday Gift مقداری نوستالژی را برای Apple TV به ارمغان می‌آورد. تتریس کلی: از بازگشت‌های هزاره‌ای تا مدیسون بیر که در مقابل یک قلعه نمادین ظاهر می‌شود. و البته، هر فصل کریسمس ماریا است. Billboard News در حال تجزیه و تحلیل برخی از لحظات تعطیلات برای تماشای این فصل است که توسط Aperol ارائه شده است. دیزنی همیشه از عاشقان تعطیلات مراقبت می کند. امسال آنها با هالمارک در یک فیلم کاملاً جدید شریک شدند. The Wonderful World of Disney Holiday Spectacular در 30 نوامبر ساعت 20:00 از شبکه ABC پخش خواهد شد. برخی از طرفداران دیزنی با چشم عقابی قبلا مدیسون بیر را در حال فیلمبرداری در پارک شکار کرده بودند. دیوای محبوب تعطیلات ما به تازگی ویدیوی سالانه It s Time خود را منتشر کرد و حتی یک تبلیغ جدید گوچی منتشر کرد. اما اگر می‌خواهید میمی را در این فصل تعطیلات ببینید، در حال حاضر تنها راه بین‌المللی است، زیرا تور او در زمان کریسمس به برزیل، بریتانیا و موارد دیگر می‌رود. Apple TV در گذشته خانه ویژه کریسمس ماریا بود، و امسال آنها با Fraggle Roc k به نوستالژی ما دست زدند. ما می دانیم که هنوز چیزهای بیشتری اعلام نشده است و نمی توانیم صبر کنیم. با وجود همه شادی های تعطیلات، با بیلبورد نیوز قفل شده اید. ماریا کری، مدیسون بیر بیشتر: لحظات تعطیلات برای انتظار | اخبار بیلبورد اشتراک‌گذاری در فیس‌بوک اشتراک‌گذاری در X + گزینه‌های اشتراک‌گذاری اضافی اضافه شد اشتراک‌گذاری در Pinterest اشتراک‌گذاری در Tumblr اشتراک‌گذاری در Reddit اشتراک‌گذاری در LinkedIn اشتراک‌گذاری در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/xmasspons.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما"], "datetime_fa": "۲۰ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Chris Young Signs Management Deal With Fletcher Foster’s F2 Entertainment Group", "link": "https://www.billboard.com/pro/chris-young-management-fletcher-foster-f2-entertainment/", "summary": "Chris Young has a new management home. The 11-time Billboard Country Airplay chart-topper has signed with Fletcher Foster s F2 Entertainment Group, which also represents artists John Carter Cash and MŌRIAH. Related Signed: Chris Young Joins UTA Roster; Rock Icon Lita Ford Finds New Frontiers Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Agents Look Ahead as AI Keeps Advancing: We Have the Privilege of Being in a Human Industry Earlier this year, Young announced he had signed with United Talent Agency for booking, and in 2024, began working with a new label home, Black River Entertainment. He released his first Black River album, I Didn t Come Here To Leave , in 2025. The album s title track is at No. 26 on Billboard s Country Airplay chart. “I’m so excited to announce that Fletcher Foster will be guiding my career into the future. He is truly an industry stalwart and a true leader in every way shape and form, Young said in a statement. I couldn’t be happier for this new chapter alongside Fletcher, UTA and, of course, True Public Relations.” “I’ve followed Chris and his music since his first self-titled album in 2006, Foster said in a statement. He’s got one of the best pure country voices in this format Looking forward to this next chapter of Chris’ career building a great team to support him. Foster s career has included time at Sony Records Nashville, Arista Records Nashville, MCA, Capitol Records Nashville and Universal South Nashville. Along the way, Foster has worked with artists including Keith Urban , Garth Brooks , Alan Jackson , Toni Braxton and Whitney Houston . Foster has also served on the boards for ACM Lifting Lives, the Academy of Country Music, the Songwriters Hall of Fame and Belmont University s Curb School of Entertainment advisory board.", "date_str": "2026-11-11T16:53:19+00:00", "hash": "e6d03c1d1a037d4d", "title_fa": "قرارداد مدیریت علائم کریس یانگ با گروه سرگرمی F2 Fletcher Foster", "summary_fa": "کریس یانگ یک خانه مدیریتی جدید دارد. برنده 11 جدول بیلبورد کانتری ایرپلی با گروه سرگرمی F2 Fletcher Foster که همچنین نماینده هنرمندان جان کارتر کش و MŌRIAH است، قرارداد بسته است. امضای مرتبط: کریس یانگ به فهرست UTA می پیوندد. نماد راک لیتا فورد مرزهای جدیدی را پیدا می کند آب و هوای سخت، بندهای شعاع و یافتن نسل بعدی سرفصل های جشنواره: این یک مبارزه سال به سال برای زنده ماندن است. در سال 2024، شروع به کار با یک خانه برچسب جدید، Black River Entertainment کرد. او اولین آلبوم Black River خود را با نام I Didn t Come Here To Leave را در سال 2025 منتشر کرد. آهنگ عنوان آلبوم در رتبه 26 جدول کانتری پخش بیلبورد قرار دارد. یانگ در بیانیه ای گفت: \"من بسیار هیجان زده هستم که اعلام کنم فلچر فاستر حرفه من را در آینده هدایت خواهد کرد. او واقعاً یک صنعت استوار و یک رهبر واقعی از هر نظر است.\" من نمی‌توانم برای این فصل جدید در کنار فلچر، UTA و البته روابط عمومی واقعی خوشحال باشم.» فاستر در بیانیه ای گفت: «من کریس و موسیقی او را از اولین آلبوم خود در سال 2006 دنبال کرده ام. او یکی از بهترین صداهای کانتری خالص را در این قالب دارد. کار فاستر شامل مدت زمانی در سونی رکوردز نشویل، آریستا رکوردز نشویل، MCA، کاپیتول رکوردز نشویل و یونیورسال ساوت نشویل بوده است. در طول مسیر، فاستر با هنرمندانی از جمله کیت اوربان، گارث بروکس، آلن جکسون، تونی براکستون و ویتنی هیوستون کار کرده است. فاستر همچنین در هیئت مدیره ACM Lifting Lives، آکادمی موسیقی کانتری، تالار مشاهیر آهنگسازان و هیئت مشاوران مدرسه کرب دانشگاه بلمونت خدمت کرده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Chris-Young_Primary-Press-Photo-billboard.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "موسیقی"], "datetime_fa": "۲۰ آبان • ۲۰:۲۳"}, {"source": "Billboard", "title": "Rock Hall of Fame 2026 Induction Ceremony: Who Is and Isn’t Attending", "link": "https://www.billboard.com/music/music-news/rock-hall-of-fame-2026-induction-who-is-isnt-attending-1236379348/", "summary": "Saturday s (Nov. 14) 2026 Rock Roll Hall of Fame induction might set a new high-water mark for low attendance among A-list guests of honor. While the annual gathering celebrating the latest names to be etched on the wall at the Cleveland museum regularly features a few no-shows — due to lingering inter-band tensions, health and scheduling issues or, in some cases, contempt for the whole exercise — this year s event looks like it will have empty seats for more than half the living honorees. Related Hilary Duff Reflects On Her Massive Lucky Me Tour: I m Really Proud of Myself, and That s Hard to Feel As An Adult John Sykes on 2026 Rock Hall Inductions, Why Voters Embraced So Many Acts From the 1980s Their Curious Snub of Mariah Carey Sade Won t Be Attending the Rock Hall Induction Ceremony Though the Hall of Fame has not officially confirmed who will, or won t, be on hand, some acts have taken the initiative to confirm their absence in advance. It s no surprise that Oasis Noel and Liam Gallagher seem unlikely to make the flight for their induction after making the ballot three years in a row given their past statements about the Rock Hall. While spokespeople for the Britpop legends have not returned Billboard s request for comment on their plans, singer Liam Gallagher has made it pretty clear in recent X comments that he s staying put. It s too far to be going for the night I got s t to do it s Christmas, he wrote on Tuesday morning (Nov. 10) in response to a report that Oasis are not going to be in the house. In addition, guitarist/songwriter Noel Gallagher has booked his first solo gig since Oasis 2025 reunion tour with an appearance at Goldie’s EFG Jazz Festival in London, also on Saturday. Liam doubled-down on his no-show plans in a follow-up tweet on Tuesday in response to a fan who noted that not many artists show up to the affair, writing , If it was in the UK I d be there but for some reason it s in LA and that s miles. Also on Tuesday, Sade , said they will not make the trip. The elusive British act fronted by singer Sade Adu , confirmed the news in a post , writing, Sorry we can’t be there in person to celebrate with the other artists. Please know that our absence takes nothing away from how much this recognition means to us.” After landing in the Hall on their third try, Iron Maiden won t be on hand due to a scheduling conflict with their Australian tour. The British heavy metal giants kicked off their run of Run For Your Lives world tour shows in", "date_str": "2026-11-11T16:46:50+00:00", "hash": "8cfcc35c91604a72", "title_fa": "مراسم معارفه راک تالار مشاهیر 2026: چه کسی حاضر است و چه کسی در آن شرکت نمی کند", "summary_fa": "معرفی تالار مشاهیر راک رول 2026 شنبه (14 نوامبر) ممکن است امتیاز جدیدی را برای حضور کم در میان مهمانان افتخاری فهرست A ایجاد کند. در حالی که گردهمایی سالانه‌ای که آخرین نام‌هایی را که روی دیوار موزه کلیولند حک می‌شوند، به طور منظم شامل چند عدم نمایش می‌شود - به دلیل تنش‌های طولانی بین گروهی، مسائل بهداشتی و برنامه‌ریزی یا در برخی موارد، تحقیر کل تمرین - به نظر می‌رسد که رویداد امسال برای بیش از نیمی از برگزیدگان زنده صندلی‌های خالی خواهد داشت. هیلاری داف مربوط به تور عظیم خود Lucky Me فکر می‌کند: من واقعاً به خودم افتخار می‌کنم و به سختی می‌توانم به عنوان یک بزرگسال احساس کنم جان سایکس در سال 2026 مقدمه‌های راک هال. Fame رسماً تأیید نکرده است که چه کسی حاضر است یا برنده خواهد شد، برخی از اقدامات ابتکار عمل برای تأیید غیبت آنها را از قبل انجام داده اند. جای تعجب نیست که Oasis Noel و Liam Gallagher بعید به نظر می‌رسند که پس از سه سال متوالی رای دادن با توجه به اظهارات گذشته خود در مورد تالار راک، برای معرفی خود به پرواز درآیند. در حالی که سخنگویان اسطوره های بریت پاپ درخواست بیلبورد برای اظهار نظر در مورد برنامه هایشان را پس ندادند، لیام گالاگر خواننده در نظرات اخیر X به وضوح اعلام کرده است که در جای خود باقی می ماند. او صبح سه‌شنبه (10 نوامبر) در پاسخ به گزارشی مبنی بر اینکه Oasis قرار نیست در خانه باشد، نوشت: خیلی دور است برای شبی که باید آن را در کریسمس انجام دهم. علاوه بر این، نوئل گالاگر، گیتاریست/ترانه‌سرا، اولین کنسرت انفرادی خود را پس از تور اتحاد مجدد Oasis 2025 با حضور در جشنواره جاز Goldie's EFG در لندن، همچنین در روز شنبه، رزرو کرده است. لیام در یک توییت بعدی در روز سه‌شنبه در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/P1081AWB-e1789049687630.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۰ آبان • ۲۰:۱۶"}, {"source": "Billboard", "title": "Iceland Airwaves’ 2026 Edition Ditched Headliners in Major Shake-Up: ‘If You’re Not Evolving, You’ll Just Die and Wither’", "link": "https://www.billboard.com/pro/iceland-airwaves-2026-shygirl-the-streets-headliners/", "summary": "It s difficult not to be charmed, and in rather a hurry, by a city as thoroughly enamored with its musical heritage as Reykjavík. The first clue comes at 30,000 feet, with Icelandair s in-flight playlists devoted entirely to homegrown artists. Down on terra firma, The World Of Icelandic Music, a new audio-guided exhibition downtown, charts a century-spanning journey of the country’s sounds, traversing folky beginnings and the anarcho-punk scene of the 1980s, through to the international success of Björk , Sigur Rós and contemporary jazz-pop star Laufey . “Icelandic music can stand tall and proud on its own; it’s like a brand name in itself,” Ísleifur Þórhallsson , festival manager of Iceland Airwaves and founder and CEO of Sena Live, the nation s leading concert promoter, tells Billboard U.K. “There’s always so much good stuff to be found, the energy and variety of what you can find here is crazy. There’s always something new to discover every single year.” Perhaps it’s the near-subzero temperatures outside, or the occasional gust of wind sweeping through Reykjavík, but there’s a giddy energy about Þórhallsson when we chat in the lobby of the Parliament Hotel, which serves as a de facto meeting place for industry delegates. Dressed in an Iceland Airwaves-branded t-shirt and cap, he talks fast and fires off observations and anecdotes with gusto, as if there’s always another story waiting to be told. Related Icelandic Artists Dish on Where to Stay and Eat for Super-Chill (Literally) Iceland Airwaves Music Festival Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Agents Look Ahead as AI Keeps Advancing: We Have the Privilege of Being in a Human Industry The tastemaking festival and conference (Nov. 4-8) is back in town for its 27th edition, bringing together oodles of local talent and international names to offer a snapshot of a musical community whose ambition and reach continues to exceed the limitations of its size. (Iceland has a population of approximately 395,050.) Situated halfway between North America and Europe, it is also in a position to capitalize on the fast-growing market for music tourism, which Fortune Business Insights valued at $106.9 billion globally in 2025. Its national airline, Icelandair, founded Iceland Airwaves in 1999 and it remains the festival s founding sponsor, investing heavily in the event’s marketing to attract tourists outside of the summer season. ", "date_str": "2026-11-11T16:39:17+00:00", "hash": "3894ba383903c923", "title_fa": "Iceland Airwaves نسخه 2026 Headliners در Major Shake-Up: «اگر در حال تکامل نباشی، فقط می‌میری و پژمرده می‌شوی»", "summary_fa": "سخت است که شیفته ی شهری به اندازه ریکیاویک شیفته میراث موسیقایی خود، و در عوض با عجله نباشید. اولین سرنخ در ارتفاع 30000 فوتی به دست می‌آید، و لیست‌های پخش داخل پرواز Icelandair به طور کامل به هنرمندان بومی اختصاص داده شده است. در پایین‌تر، دنیای موسیقی ایسلندی، یک نمایشگاه جدید با هدایت صوتی در مرکز شهر، سفری صد ساله از صداهای این کشور را به تصویر می‌کشد، شروع‌های محلی و صحنه آنارکو پانک دهه 1980 را تا موفقیت بین‌المللی بیورک، سیگور روس و ستاره معاصر جاز پاپ لاوفی نشان می‌دهد. Ísleifur Þórhallsson، مدیر جشنواره ایسلند ایرویوز و بنیانگذار و مدیر عامل Sena Live، پیشرو کنسرت کشور، به بیلبورد بریتانیا می گوید: «موسیقی ایسلندی به تنهایی می تواند سربلند و سربلند باشد؛ به خودی خود مانند یک نام تجاری است.» همیشه هر سال چیز جدیدی برای کشف وجود دارد. ptured clip from the show. Thank you guys so much for showing me so much support I m feeling so much better. The modified performance came after KATSEYE canceled three shows which had been scheduled to take place in Detroit, Chicago and Minneapolis citing illness on behalf of Megan. On Nov. 5, she revealed on her Instagram Story that she d suffered a concussion, writing that she was devastated and doing everything I possibly can to recover. Four days later, she gave an update on Weverse , explaining that the Austin show would go on as planned, but with reduced choreography, less intense movement and taking breaks as needed on her end. I won’t be going full out just yet! she added. My doctors have recommended these limitations for now, and I ll need to be reassessed before returning to unrestricted performances. The decision to go forward with the show with Megan sitting down was polarizing among EYEKONs, many of whom expressed concern that she d be in such a loud, overstimulating environment while dealing with a head injury. are they serious??? why is she not FULLY on recovery this actually scares me…, one fan commented on a video posted to X of Megan at the concert. Another person wrote on X, This is a terrible environment for someone with a concussion. This is inhumane. Katseye def doing an exposé documentary in like 10 years, another person posted on X . Having Megan perform like ", "date_str": "2026-11-11T16:35:36+00:00", "hash": "f474d7d7275feddf", "title_fa": "مگان از KATSEYE در حالی که نشسته است به دلیل ضربه مغزی اجرا می کند و باعث نگرانی طرفداران می شود: \"آنها جدی هستند؟\"", "summary_fa": "نمایش باید ادامه پیدا کند؟ در حالی که KATSEYE دو عضو خود را به دلیل وقفه های منون و سوفیا از دست داده است، گروه دختر اخیراً یک برنامه در آستین، تگزاس اجرا کردند، در حالی که مگان به معنای واقعی کلمه در حالی که از ضربه مغزی بهبود می یابد، خارج از رقص نشسته بود. مرتبط KATSEYE دو برنامه دیگر را به دلیل بیماری به تعویق انداخت پس از تاخیر در کنسرت دیترویت، مگان کاتسی در مجموعه تد، هریسون به ددلاین گفت که صحنه‌هایی از کتاب را هنگام نوشتن تجسم کرده است و مانند دیگران خاطرنشان کرد که رمانش کیفیت سینمایی دارد. در ددلاین تماشا کنید «وقتی صحنه‌ای را می‌سازم، وقتی آن را به کلمات تبدیل می‌کنم، می‌توانم آن را ببینم. و در واقع می‌خواستم این رمان را «پایان همه چیز: یک فیلم» زیرنویس کنم. در آخرین لحظه اعصابم را از دست دادم، اما اکنون واقعاً آرزو می‌کنم که این کار را انجام می‌دادم، زیرا ساختار یک فیلم اروپایی میانه‌ای دارد که می‌توان آن را به خوبی تماشا کرد.» این کتاب توسط Serpent’s Tail imprint منتشر شده است و اولین برد بوکر آن را رقم می زند. به طور مشابه، این اولین برد برای هریسون 81 ساله بود که در سال 2022 به عنوان داور بوکر خدمت کرد. نویسنده در پاسخ به این سوال که آیا اقتباسی در دست ساخت است یا خیر، گفت: «ما کمی علاقه داریم، آنقدر پیش نرفتیم که بتوانیم در مورد [جزئیات] صحبت کنیم، اما علاقه به انجام کاری وجود دارد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/m_joh_harrison_booker_prize.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۰ آبان • ۱۹:۳۵"}, {"source": "Deadline", "title": "Britt Robertson Joins Kellan Lutz In Faith-Based Survival Thriller ‘The Rescue’ — AFM", "link": "https://deadline.com/2026/11/britt-robertson-joins-kellan-lutz-faith-thriller-the-rescue-1237220156/", "summary": "EXCLUSIVE: Britt Robertson (Tomorrowland) is joining Kellan Lutz in faith-based survival thriller The Rescue, which Premiere Entertainment will continue selling at the AFM. Production is scheduled to begin in New Zealand in February 2027. Pic will be directed by Darren Simmonds and Jared van Berkel from a screenplay written by van Berkel. Simon Ambridge, Anton [ ]", "date_str": "2026-11-11T16:05:00+00:00", "hash": "05f2f77254008edc", "title_fa": "بریت رابرتسون به کلین لوتز در تریلر بقا مبتنی بر ایمان \"نجات\" - AFM می پیوندد", "summary_fa": "اختصاصی: بریت رابرتسون (Tomorrowland) به Kellan Lutz در تریلر بقا مبتنی بر ایمان The Rescue می‌پیوندد، که Premiere Entertainment به فروش آن در AFM ادامه خواهد داد. تولید ای summary_fa": "اولین آهنگ از موسیقی متن In Waves، \"Swirl Ahead\" اکنون منتشر شده است Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان Oklou امتیاز یک انیمیشن جدید به نام In Waves را نوشته است که قرار است ماه آینده در نتفلیکس پخش شود. او با هنرمند فرانسوی ROB در موسیقی متن 23 آهنگ، که در کنار فیلم در 11 دسامبر منتشر می شود، همکاری کرد. شما می توانید اولین پیش نمایش، \"Swirl Ahead\" را در زیر مشاهده کنید. به کارگردانی Phuong Mai Nguyen، In Waves از خاطرات گرافیکی AJ Dungo در سال 2019 به همین نام اقتباس شده است، که داستان عاشقانه بین موج‌سوار و اسکیت‌بورد جوان را در حالی که به دنبال علایق خود می‌روند و مبارزات شخصی را دنبال می‌کنند، نشان می‌دهد. این فیلم در اوایل سال جاری در جشنواره فیلم کن به نمایش درآمد و اولین انیمیشنی بود که برای افتتاحیه هفته منتقدان کن انتخاب شد. این انتشار سال بزرگی را برای اوکلو به پایان رساند، که به تازگی دومین دوره از یک تور گسترده را در حمایت از آلبوم 2025 خود Choke Enough بسته است. این سفر شامل اولین حضور او در کواچلا در آوریل، به‌علاوه تاریخ‌های تیتراژ در Primavera Sound، Lollapalooza، و All Points East بود. سال گذشته، او همچنین یک نسخه لوکس از آلبوم را منتشر کرد که دارای آهنگی با شاخه های FKA بود، \"Viscus\". دوباره به داستان جلد 2025 آنا گاکا یعنی تابستان بی پایان Oklou مراجعه کنید. In Waves (موسیقی متن رسمی) : 01 Meeting the Wave 02 The Wave 03 Kristen 04 Facebook 05 Sweet Sixteen 06 Miss You 07 Abrazo 08 The Swirl Ahead 09 Here 10 Moon 11 Family 12 Morning Second 13 Back 14 The NYC 14 Winll 18 In Waves 19 Friends 20 The Promise 21 Fly Again 22 Lilac 23 آهنگ", "image_url": "https://media.pitchfork.com/photos/6af3813f66555f23ece98a3e/16:9/w_1280,c_limit/%C2%A9%EF%B8%8FMarine%20Benjamin%20for%20Konbini%20-%20%20DSCF1368%20(1).jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۲۰ آبان • ۱۹:۴۲"}, {"source": "Rolling Stone", "title": "Angie Martinez’s Unaired Tupac Shakur Interview Set for Release After 30 Years", "link": "https://www.rollingstone.com/music/music-news/los
