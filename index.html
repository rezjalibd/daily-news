مک می‌کند تا شراکت‌های جدید ناشران ممتاز و مشتریان تبلیغات مالی بلو چیپ را ایجاد کند. تابولا در حال گسترش امپراطوری خود است. شرکت adtech به طور انحصاری به CMO Insider گفت که پیشنهادی برای خرید Dianomi، یک شرکت adtech متخصص در فضای مالی ارائه کرده است. مشابه تابولا، دیانومی یک شبکه تبلیغاتی ارائه می دهد که ویجت های محتوای حمایت شده را در بین وب سایت های ناشر قرار می دهد. این خرید که روز جمعه اعلام شد، به Taboola کمک می کند تا با ناشران بزرگی مانند CNN Business، وال استریت ژورنال و رویترز - شرکای که در حال حاضر با آنها کار نمی کند، روابط برقرار کند. تبلیغ‌کنندگانی که با Dianomi کار می‌کنند شامل نام‌های بزرگی مانند Bank of America، Charles Schwab و Invesco می‌شوند. طبق یک پرونده مالی، تابولا با 19 میلیون پوند یا تقریباً 25.4 میلیون دلار به صورت نقدی با خرید دیانومی موافقت کرده است. ارزش این معامله به طور بالقوه تا 27 میلیون پوند یا 36.1 میلیون دلار در صورت رعایت شرایط عملکرد خاص است. ارزش‌گذاری اولیه خرید حدود 68 درصد نسبت به قیمت سهام دیانومی در پایان معاملات روز پنج‌شنبه برتری دارد. زمان خرید از طرف تابولا زیرکانه به نظر می رسد. سال گذشته برای دیانومی چالش برانگیز بود. درآمد این شرکت مستقر در بریتانیا در مقایسه با سال گذشته 2 درصد کاهش یافت و به 27.4 میلیون پوند، حدود 36.6 میلیون دلار رسید که عمدتاً نشان دهنده حجم پایین تر ترافیک ناشران است، در حالی که حرکت ارز نیز بر نتایج گزارش شده آن تأثیر گذاشته است. دیانومی گفته است که ناشران"}, {"source": "Business Insider", "title": "This tiny cybersecurity startup managed to hack OpenAI using Claude, and won a $6,500 bounty", "link": "https://www.businessinsider.com/hacktron-ai-cybersecurity-startup-hack-openai-using-claude-2026-9", "summary": "An AI startup found vulnerabilities in OpenAI s infrastructure. illustration by Leon Neal/Getty Images Hacktron, a small cybersecurity startup, hacked into OpenAI's codebase with the help of Claude. The company flagged vulnerabilities in OpenAI's systems and was paid $6,500 for the discovery. The potential for malicious AI agents to go unchecked has recently spurred fears of an AI apocalypse. A small AI startup used Claude to hack into OpenAI's internal codebase shortly after the OpenAI Hugging Face hack . Zayne Zhang, the cofounder and CEO of Hacktron, told Business Insider that his research team has begun investigating security vulnerabilities at frontier AI companies like OpenAI to determine whether they have gaps that could be exploited by AI agents. Hacktron is a San Francisco-based AI cybersecurity startup. In July, Zhang's team discovered some gaps in OpenAI's infrastructure. According to Hacktron's disclosure about the incident, published on Sunday, any user or OpenAI employee logging into OpenAI's community help forum could have had their ChatGPT and Codex accounts hacked. Hacktron then tried to exploit that vulnerability via Claude. The company had access to Anthropic's Cyber Verification Program, which relaxed certain cyber restrictions on Claude for authorized security research, Zhang said. The team managed to hack into an OpenAI employee's account and prompt the employee's Codex account to suggest changes in OpenAI's internal code repository. Hacktron said the team stopped there, didn't access any internal code, and flagged the issue to OpenAI. Hacktron said in its disclosure that the company won a $6,500 bounty from its discovery. The startup was launched less than a year ago and has fewer than 10 employees. An OpenAI spokesperson said in an emailed statement to Business Insider about Hacktron, \"We thank the researchers for contacting us and sharing their findings. We narrowed the permissions on Community sign-in tokens and revoked affected tokens and sessions.\" \"The worlds of AI safety and cybersecurity are converging, and we think that having more cybersecurity experts in the conversation is always a good thing for the industry,\" Zhang said of the incident. Representatives for Anthropic did not respond to a request for comment from Business Insider. Hacktron's disclosure comes as AI security is becoming one of the most important topics in tech. In recent months, OpenAI, Anthropic, and Meta have disclosed that their agents engaged in rogue a", "date_str": "2026-09-18T06:46:12+00:00", "hash": "0a7a398bd7049592", "title_fa": "این استارت آپ کوچک امنیت سایبری با استفاده از Claude توانست OpenAI را هک کند و جایزه 6500 دلاری دریافت کند.", "summary_fa": "یک استارت آپ هوش مصنوعی آسیب پذیری هایی را در زیرساخت OpenAI پیدا کرد. تصویر توسط Leon Neal/Getty Images Hacktron، یک استارت آپ کوچک امنیت سایبری، با کمک کلود به پایگاه کد OpenAI هک شد. این شرکت آسیب‌پذیری‌های سیستم‌های OpenAI را شناسایی کرد و برای این کشف ۶۵۰۰ دلار پرداخت کرد. پتانسیل کنترل نشدن عوامل مخرب هوش مصنوعی اخیراً ترس از آخرالزمان هوش مصنوعی را برانگیخته است. یک استارتاپ کوچک هوش مصنوعی از کلود برای هک کردن پایگاه کد داخلی OpenAI مدت کوتاهی پس از هک OpenAI Hugging Face استفاده کرد. زین ژانگ، بنیانگذار و مدیرعامل Hacktron، به Business Insider گفت که تیم تحقیقاتی او بررسی آسیب‌پذیری‌های امنیتی در شرکت‌های هوش مصنوعی مرزی مانند OpenAI را آغاز کرده‌اند تا مشخص کنند آیا آنها شکاف‌هایی دارند که می‌توانند توسط عوامل هوش مصنوعی مورد سوء استفاده قرار گیرند یا خیر. Hacktron یک استارت آپ امنیت سایبری هوش مصنوعی مستقر در سانفرانسیسکو است. در ماه جولای، تیم ژانگ شکاف هایی را در زیرساخت OpenAI کشف کرد. با توجه به افشای Hacktron در مورد این حادثه که در روز یکشنبه منتشر شد، هر کاربر یا کارمند OpenAI که به انجمن کمک جامعه OpenAI وارد می‌شود، ممکن است حساب‌های ChatGPT و Codex خود را هک کند. سپس Hacktron سعی کرد از این آسیب پذیری از طریق Claude سوء استفاده کند. ژانگ گفت که این شرکت به برنامه راستی‌آزمایی سایبری Anthropic دسترسی داشت که محدودیت‌های سایبری خاصی را برای کلود برای تحقیقات امنیتی مجاز کاهش داد. این تیم موفق شد حساب یکی از کارکنان OpenAI را هک کند و از حساب Codex کارمند درخواست کند تا تغییراتی را در مخزن کد داخلی OpenAI پیشنهاد دهد. Hacktron گفت که تیم در آنجا متوقف شد، به هیچ کد داخلی دسترسی نداشت و مشکل را به OpenAI پرچم گذاری کرد. Hacktron در افشای خود گفت که این شرکت جایزه"}, {"source": "Business Insider", "title": "China's AI price war is entering a new phase", "link": "https://www.businessinsider.com/china-ai-price-war-new-phase-bofa-2026-9", "summary": "China s AI price war is entering a new phase as companies compete on the cost of completing AI tasks. Long Wei/VCG/Getty Images China's AI price war is moving beyond blanket token price cuts, BofA says. Companies are increasingly competing on the cost of completing AI tasks, not processing tokens. US export controls accelerated China's AI push, fueling fiercer domestic competition. China's AI price war is moving beyond blanket token price cuts as companies increasingly compete on the cost of getting artificial intelligence systems to finish tasks, according to a Bank of America report published Thursday. The shift follows aggressive price cuts after low-cost Chinese AI models such as DeepSeek intensified competition across the industry. The economics are now changing, BofA said. \"China's LLM price war is evolving from blanket cuts to tiered pricing,\" wrote BofA analysts led by Winnie Wu, the bank's head of Asia equity strategy and co-head of China equity research. Instead, companies are increasingly competing on how efficiently their AI systems complete tasks rather than simply how cheaply they process tokens. Models with stronger reasoning, longer context windows, multimodal capabilities, and agentic workflows can still command premium prices, according to the BofA analysts. \"Basic inference is increasingly commoditized, while frontier capabilities remain differentiated,\" the analysts wrote. \"The key economic metric is shifting from price per token to cost per completed task,\" they added. The shift also comes as years of US-led export controls have accelerated China's push for domestic AI technology. The restrictions expanded the market for local suppliers while intensifying competition as more companies entered the sector. The changing economics could also reshape where profits are made across China's AI industry, according to the bank. The strongest long-term economics are likely to remain with AI chips, semiconductor equipment, memory, and large cloud platforms, rather than standalone AI model developers, its analysts wrote. The trend isn't unique to China. Businesses are increasingly choosing different AI models for different tasks based on cost and performance, instead of relying on a single model, Business Insider reported in July. Read the original article on Business Insider", "date_str": "2026-09-18T06:44:47+00:00", "hash": "7c46ebb21b4774c2", "title_fa": "جنگ قیمت هوش مصنوعی چین وارد مرحله جدیدی شده است", "summary_fa": "جنگ قیمت هوش مصنوعی چین وارد مرحله جدیدی می شود زیرا شرکت ها بر سر هزینه تکمیل وظایف هوش مصنوعی رقابت می کنند. Long Wei/VCG/Getty Images، BofA می‌گوید جنگ قیمت هوش مصنوعی چین فراتر از کاهش قیمت نمادین است. شرکت ها به طور فزاینده ای بر سر هزینه انجام وظایف هوش مصنوعی رقابت می کنند، نه پردازش توکن ها. کنترل صادرات ایالات متحده، فشار هوش مصنوعی چین را تسریع کرد و رقابت داخلی شدیدتری را دامن زد. بر اساس گزارش بانک آمریکا که روز پنجشنبه منتشر شد، جنگ قیمت هوش مصنوعی چین فراتر از کاهش قیمت‌های نمادین است زیرا شرکت‌ها به طور فزاینده بر سر هزینه‌های دریافت سیستم‌های هوش مصنوعی برای تکمیل وظایف رقابت می‌کنند. این تغییر به دنبال کاهش شدید قیمت‌ها پس از مدل‌های کم‌هزینه هوش مصنوعی چینی مانند DeepSeek، رقابت را در سراسر صنعت تشدید کرد. BofA گفت که اقتصاد اکنون در حال تغییر است. تحلیلگران BofA به رهبری وینی وو، رئیس استراتژی سهام آسیایی بانک و رئیس تحقیقات سهام چین، نوشتند: «جنگ قیمت LLM چین از کاهش کلی به قیمت گذاری پلکانی در حال تغییر است. در عوض، شرکت‌ها به‌طور فزاینده‌ای در حال رقابت بر سر این است که سیستم‌های هوش مصنوعی آن‌ها وظایف را تا چه حد کارآمد انجام می‌دهند، نه اینکه چگونه توکن‌ها را ارزان پردازش می‌کنند. به گفته تحلیلگران BofA، مدل‌هایی با استدلال قوی‌تر، پنجره‌های زمینه طولانی‌تر، قابلیت‌های چندوجهی، و جریان‌های کاری عاملی همچنان می‌توانند قیمت‌های بالاتری داشته باشند. تحلیلگران نوشتند: «استنباط اساسی به طور فزاینده ای کالایی می شود، در حالی که قابلیت های مرزی متفاوت باقی می مانند». آنها افزودند: معیار اقتصادی کلیدی تغییر از قیمت هر توکن به هزینه هر کار تکمیل شده است. این تغییر همچنین در حالی رخ می دهد که سال ها کنترل صادرات به رهبری ایالات متحده، فشار چین برای فناوری هوش مصنوعی داخلی را تسریع کرده"}, {"source": "Business Insider", "title": "Oprah Winfrey says people-pleasing led her to make a career decision she knew was wrong", "link": "https://www.businessinsider.com/oprah-winfrey-people-pleasing-career-lesson-own-2026-9", "summary": "Oprah Winfrey said 2012 was one of the worst years of her life. Vivien Killilea/Getty Images Oprah Winfrey says she let people-pleasing get in the way of a big career decision. She ignored her intuition because she was afraid of what others would think. The fallout made 2012 \"one of the worst years\" of her life, she said. Oprah Winfrey , 72, said she made a career decision she knew was wrong, simply because she didn't want to disappoint others. Speaking on Thursday's episode of \" The Mel Robbins Podcast ,\" Winfrey reflected on the difficult early years of OWN: Oprah Winfrey Network . Winfrey launched OWN in January 2011, months before \"The Oprah Winfrey Show\" ended its 25-year run in May that year. The network struggled with low ratings and later made highly publicized layoffs , including 30 staff cuts in March 2012. \"2012 was one of the worst years of my life,\" Winfrey said. \"Every single story headline about me was 'Oprah and the struggling OW Network. Oprah and the struggling OW Network.' And it was hurtful and painful to me because it was the truth. I was struggling.\" Winfrey said she was \"so angry\" for not trusting \"the voice inside myself,\" which was \"so strong\" that she would wake up in the middle of the night unable to breathe. Despite her doubts, Winfrey said she pushed ahead with the venture because she felt bound by the agreement she had signed. She later realized she hadn't moved forward because she truly wanted to, but because she was afraid of disappointing the people invol  "Business Insider", "title": "Netflix's 'Monster' makes Lizzie Borden's maid her lover and accomplice. Here's what we know about the real Bridget Sullivan.", "link": "https://www.businessinsider.com/who-was-bridget-sullivan-true-story-lizzie-borden-murders-2026-9", "summary": "Ella Beatty in Monster: The Lizzie Borden Story. Netflix The latest season of Netflix's \"Monster\" tells the story of Lizzie Borden. Borden was tried and acquitted for the hatchet murders of her father and stepmother in 1892. Ryan Murphy's \"Monster\" portrays Borden and her maid as the killers and as lovers. From Jeffrey Dahmer to the Menendez brothers to Ed Gein, Ryan Murphy's \"Monster\" series on Netflix is all about famous killers. This time, the series follows its first female protagonist — Lizzie Borden, who was tried and acquitted of the 1892 hatchet murders of her father and stepmother in Massachusetts. Borden was the prime suspect and went to trial for the murders, which captivated the country. The court proceedings only heightened public fervor, as people were split over whether Borden was responsible. The proceedings were highlighted by Borden fainting in court when she was shown the skeletal remains of her parents as evidence. Ultimately, partly due to a lack of physical evidence, Borden was acquitted after the prosecution was unable to prove her guilt beyond reasonable doubt. No one else was ever charged and the case remains unsolved. Borden went on to become a fixture in true-crime lore, and the subject of folk rhymes, books, and movies. Now that she's at the center of the latest \"Monster\" season, there's even more interest in Borden. Including the big question: Did Borden do it? And did she do it alone? Warning: Spoilers ahead for \"Monster: The Lizzie Borden Story.\" In 'Monster,' Borden is in a sexual relationship with her maid, Bridget Sullivan, who assists in the murders Ella Beatty and Vicky Krieps in Monster: The Lizzie Borden Story. Netflix In \"Monster,\" Borden (played by Ella Beatty) is motivated to kill her father, Andrew (Charlie Hunnam), and stepmother, Abby (Rebecca Hall) after years of verbal and physical abuse. She's assisted in the crimes by the family maid, Irish immigrant Bridget Sullivan (Vicky Krieps). On top of that, Lizzie and Bridget are lovers. When we first meet Lizzie in the show, she's a reserved young woman who is having trouble meeting men. Enter Bridget, who's more worldly than Lizzie and her parents, and more liberal in her thinking. Lizzie is drawn to her, and eventually the two begin a sexual relationship. It also helps that the two share common enemies. Both hate Andrew and Abby, and they begin plotting to kill them. First, they try to off the two by poisoning their dinner, but their attempt only sickens rather tha", "date_str": "2026-09-17T22:31:05+00:00", "hash": "3acacb7e5af1d3a0", "title_fa": "«هیولا» نتفلیکس، خدمتکار لیزی بوردن را معشوق و همدست خود می کند. در اینجا چیزی است که ما در مورد بریجت سالیوان واقعی می دانیم.", "summary_fa": "الا بیتی در هیولا: داستان لیزی بوردن. نتفلیکس آخرین فصل از نتفلیکس \"هیولا\" داستان لیزی بوردن را روایت می کند. بوردن در سال 1892 به دلیل قتل پدر و نامادری اش محاکمه و تبرئه شد. \"هیولا\" رایان مورفی بوردن و خدمتکارش را به عنوان قاتل و عاشق به تصویر می کشد. از جفری دامر گرفته تا برادران منندز تا اد جین، سریال «هیولا» رایان مورفی در نتفلیکس همه چیز درباره قاتلان معروف است. این بار، سریال اولین قهرمان زن خود - لیزی بوردن - را دنبال می کند که از قتل هچری پدر و نامادری خود در ماساچوست در سال 1892 محاکمه و تبرئه شد. بوردن مظنون اصلی بود و به خاطر قتل هایی که کشور را مجذوب خود کرد به محاکمه رفت. روند دادگاه فقط شور و اشتیاق عمومی را افزایش داد، زیرا مردم بر سر این که آیا بوردن مسئول است یا خیر اختلاف داشتند. این روند با غش کردن بوردن در دادگاه برجسته شد، زمانی که بقایای اسکلتی والدینش به عنوان مدرک به او نشان داده شد. در نهایت، تا حدی به دلیل فقدان شواهد فیزیکی، بوردن پس از اینکه دادستان نتوانست جرم او را فراتر از شک منطقی اثبات کند، تبرئه شد. هیچ کس دیگری هرگز متهم نشد و پرونده حل نشده باقی مانده است. بوردن در ادامه تبدیل به یکی از مهره‌های داستان جنایی واقعی و موضوع قافیه‌های عامیانه، کتاب‌ها و فیلم‌ها شد. اکنون که او در مرکز آخرین فصل «هیولا» قرار دارد، علاقه بیشتری به بوردن وجود دارد. از جمله سوال بزرگ: آیا بوردن این کار را انجام داد؟ و آیا او این کار را به تنهایی انجام داد؟ هشدار: اسپویل‌هایی در راه است برای «هیولا: داستان لیزی بوردن». در «هیولا»، بوردن با خدمتکار خود، بریجت سالیوان، که در قتل الا بیتی و ویکی کریپس در هیولا: داستان لیزی بوردن کمک می‌کند، رابطه جنسی"}, {"source": "Business Insider", "title": "Amazon's big, new delivery push targets Walmart's biggest advantage, Bank of America says", "link": "https://www.businessinsider.com/amazons1000-hub-same-day-delivery-bet-catching-walmart-bofa-analyst-2026-9", "summary": "A worker unloads boxes from an Amazon delivery van in San Francisco, California Bloomberg/Getty Images Amazon's 1,000-hub plan aims to close Walmart's proximity advantage. Bank of America analysts say Amazon's same-day delivery service is \"very important strategically.\" Faster delivery and automation could extend Amazon's retail-margin gains, the bank said. Amazon 's plan for more than 1,000 same-day fulfillment centers is fundamentally an attempt to close Walmart's long-held proximity advantage, Bank of America analysts wrote in a research note. Business Insider reported this week that Amazon is considering an internal project called Mercury, which would expand its same-day fulfillment network from roughly 85 facilities today to more than 1,000 by 2031. The goal is to place inventory within 10 miles of about 80% of Prime members in the US, according to internal planning documents reviewed by Business Insider. BofA analyst Justin Post said Project Mercury's strategy is less about expanding selection than making a smaller set of high-demand products more immediately accessible. Amazon's ability to compete with same-day delivery is \"very important strategically,\" he wrote. \"We see Project Mercury as another piece of Amazon's broader effort to build a denser, faster, and increasingly automated countrywide fulfillment network,\" Post wrote in the note. The bank called the project's estimated $6.8 billion investment \"manageable\" for Amazon. Internal projections reviewed by Business Insider forecast that Mercury would turn cash-flow positive by 2030 and generate $7.1 billion in economic value over 10 years. Walmart has a major head start. Its roughly 5,000 stores put fast delivery within 10 miles of 90% of the US population. The retailer has increasingly used those stores as local fulfillment centers, helping it deliver 70% of e-commerce orders the same day. Amazon's same-day sites carry a narrower assortment — roughly 90,000 fast-moving products such as paper towels, cough medicine, and fresh food — rather than the broad selection of a conventional fulfillment center. The strategy is to move those everyday purchases closer to customers without trying to replicate Amazon's full catalog in every market. The Bank of America note added that Amazon's investments in faster delivery and automation could bolster its retail profit margins for years. It cited an earlier Business Insider report on Project Tetromino , Amazon's automated delivery-station initiative. \"The com", "date_str": "2026-09-17T22:05:48+00:00", "hash": "34223540a1e668c8", "title_fa": "بانک آمریکا می‌گوید، فشار تحویل بزرگ و جدید آمازون، بزرگترین مزیت والمارت را هدف قرار می‌دهد", "summary_fa": "کارگری جعبه‌ها را از ون تحویل آمازون در سانفرانسیسکو، کالیفرنیا تخلیه می‌کند بلومبرگ/گتی ایماژ طرح 1000 مرکز آمازون با هدف بستن مزیت نزدیکی والمارت است. تحلیلگران بانک آمریکا می گویند که خدمات تحویل همان روز آمازون از نظر استراتژیک بسیار مهم است. این بانک گفت که تحویل سریعتر و اتوماسیون می تواند سود حاشیه خرده فروشی آمازون را افزایش دهد. تحلیلگران بانک آمریکا در یادداشتی تحقیقاتی نوشتند که طرح آمازون برای بیش از 1000 مرکز انجام یک روزه، اساساً تلاشی برای بستن مزیت مجاورت طولانی مدت Walmart است. Business Insider این n, grew up in a lavish televangelist family lifestyle. Costi challenges Benny Hinn's ministry, calling it a 'scam' and rejecting the prosperity gospel. Costi is now a pastor who promotes transparency and criticizes televangelist practices. Costi Hinn describes his upbringing as \"Beamers, Benz's, and Bentley's.\" His family's nearly 10,000-square-foot home had an indoor hot tub, a pool, a steam room, and a sport court, he says. They traveled to Hawaii and Europe for vacation and stayed at high-end resorts, he added. By high school, Hinn says, he drove a Mercedes. Around age 20, he had an H2 Hummer with custom rims and a $10,000 Breitling watch . For years, Hinn says he believed his family's wealth reflected God's favor. Hinn was born into a wealthy televangelist family and is the nephew of faith healer Benny Hinn, the flamboyant televangelist known for preaching in white suits and presiding over healing crusades before packed arenas. \"We are the example of what will happen to you,\" Costi Hinn said of what he believed at the time. \"If you have enough faith, if you believe like us, if you do what we do. Oh, God will make you rich.\" \"If you had cancer or some ailment or you were struggling with infertility,\" he added, \"we would question your faith.\" Hinn spoke to Business Insider for its flagship video series \" Authorized Account \" about growing up in a wealthy televangelist family and ultimately rejecting a system he said tied donations and faith to false promises of healing and prosperity. Working for Benny Hinn made him walk away A young Costi Hinn with the H2 Hummer he drove at 20. Courtesy of Costi Hinn At its peak, Benny Hinn Ministries was bringing in over $90 million a year. After high school around 2003, Hinn says, he began working as his uncle's personal assistant. He says he traveled on a private plane, carried Louis Vuitton and Fendi luggage, and stayed in expensive hotels. Hinn says he also participated in healing crusades as a \"catcher,\" helping lower people to the ground when they fell after his uncle prayed for them. The job brought him closer to the people who came seeking help. What he saw, he says, challenged what he had believed his entire life. \"I started questioning when I was younger in my teenage years, why certain things didn't happen as they were said to have happened,\" Hinn said. \"What really got me was working for him and seeing ever", "date_str": "2026-09-17T21:19:45+00:00", "hash": "6ab27c80e3ed153c", "title_fa": "برادرزاده یک تبشیر تلویزیونی آنچه را دید و چرا گله را ترک کرد را فاش می کند", "summary_fa": "کوستی هین یک کشیش است و برای انجیل اجرا می کند. با حسن نیت از کوستی هین کوستی هین، برادرزاده بنی هین، در یک سبک زندگی خانوادگی مجلل تلویزیونی بزرگ شد. کوستی خدمت بنی هین را به چالش می کشد و آن را یک «کلاهبرداری» می خواند و انجیل سعادت را رد می کند. کوستی اکنون یک کشیش است که شفافیت را ترویج می کند و از شیوه های تبلیغی تلویزیونی انتقاد می کند. کوستی هین تربیت خود را به عنوان \"بیمر، بنز و بنتلی\" توصیف می کند. او می‌گوید خانه نزدیک به 10000 فوت مربع خانواده‌اش دارای یک جکوزی سرپوشیده، یک استخر، یک اتاق بخار و یک زمین ورزشی بود. او افزود که آنها برای تعطیلات به هاوایی و اروپا سفر کردند و در استراحتگاه های سطح بالا اقامت کردند. هین می گوید که در دبیرستان، یک مرسدس بنز رانده بود. در حدود 20 سالگی، او یک H2 Hummer با رینگ های سفارشی و یک ساعت Breitling 10000 دلاری داشت. هین می‌گوید که سال‌ها معتقد بود که ثروت خانواده‌اش نشان دهنده لطف خداست. هین در خانواده ای ثروتمند مبشر تلویزیونی متولد شد و برادرزاده شفادهنده ایمان، بنی هین، تبشیر پر زرق و برق تلویزیونی است که به موعظه در لباس های سفید و ریاست بر جنگ های صلیبی شفابخش قبل از میدان های شلوغ شهرت دارد. کوستی هین درباره آنچه در آن زمان اعتقاد داشت گفت: «ما نمونه آن چیزی هستیم که برای شما اتفاق خواهد افتاد. «اگر به اندازه کافی ایمان دارید، اگر مانند ما ایمان دارید، اگر کاری را که ما انجام می دهیم انجام دهید. او افزود: «اگر سرطان یا بیماری داشتید یا با ناباروری دست و پنجه نرم می‌کردید، ایمان شما را زیر سوال می‌بردیم.» هین برای مجموعه ویدیویی شاخص خود «حساب مجاز» درباره بزرگ شدن در یک خانواده ثروتمند تبلیغی تلویزیونی و در نهایت"}, {"source": "Business Insider", "title": "Apple Store pioneer Ron Johnson on the iPhone Duo, working with Steve Jobs, and leading with kindness", "link": "https://www.businessinsider.com/apple-store-ron-johnson-leadership-steve-jobs-2026-9", "summary": "When Ron Johnson joined Apple in 2000, he was tasked with developing the brand's physical stores. Apple Stores eventually grew into retail giants, but at the time they were a risky bet, as conventional wisdom predicted online shopping would replace in-person stores. Johnson's new book, \"Shop Different,\" details the strategy behind the stores and offers a broad look at Johnson's retail career. In this live Q A with Business Insider's Ana Altchek , he discusses his time at Apple and explains what it was like to work with Steve Jobs. He also answers viewer questions about retail strategies, leadership, and more. Read the original article on Business Insider", "date_str": "2026-09-17T21:18:23+00:00", "hash": "4ea69705fa87be39", "title_fa": "ران جانسون، پیشگام استور اپل در آیفون دو، با استیو جابز کار می‌کند و با مهربانی رهبری می‌کند", "summary_fa": "زمانی که ران جانسون در سال 2000 به اپل پیوست، وظیفه توسعه فروشگاه های فیزیکی این برند را بر عهده گرفت. فروشگاه‌های اپل در نهایت به غول‌های خرده‌فروشی تبدیل شدند، اما در آن زمان شرط‌بندی مخاطره‌آمیز بودند، زیرا خرد متعارف پیش‌بینی می‌کرد که خرید آنلاین جایگزین فروشگاه‌های حضوری شود. کتاب جدید جانسون، \"خرید متفاوت\"، جزئیات استراتژی پشت فروشگاه ها را ارائه می دهد و نگاهی گسترده به حرفه خرده فروشی جانسون ارائه می دهد. در این QA زنده با آنا آلچک از Business Insider، او درباره زمان خود در اپل صحبت می کند و توضیح می دهد که کار با استیو جابز چگونه بود. او همچنین به سوالات بینندگان در مورد استراتژی های خرده فروشی، رهبری و موارد دیگر پاسخ می دهد. مقاله اصلی را در Business Insider Video BI Live Apple Store، Ron Johnson در کار با Steve Jobs Share icon یک فلش منحنی به سمت راست بخوانید. X LinkedIn کپ grown into one of the most influential companies on the planet. But the company has some dark secrets. Oscar winner Mikey Madison plays Facebook engineer Frances Haugen, who has put her trust in Wall Street Journal reporter Jeff Horwitz, played by Jeremy Allen White, to expose the company's internal research and decision-making. Sorkin based the script on The Wall Street Journal's expansive investigative series, The Facebook Files , which delved into the social network's impact on youth mental health, misinformation, and the January 6, 2021 Capitol attack. Sony will release the movie on October 9. Here's everything to know. Aaron Sorkin has wanted to do a Social Network follow-up for years. Aaron Sorkin. Ethan Miller/Getty Images Sorkin is no stranger to exploring power and the people who wield it. When he wasn't creating shows like \"The West Wing\" and \"The Newsroom,\" he wrote the scripts for movies like \"The American President\" and \" Steve Jobs. \" But he's never been able to let go of Zuckerberg and Facebook. In a 2020 interview for the \"Happy Sad Confused\" podcast , he noted that what fascinated him about a continuation to \"The Social Network\" was exploring \" the dark side of Facebook. \" That interest intensified a year later when The Wall Street Journal released The Facebook Files. By the spring of 2025 , Sony announced that Sorkin was attached to write and direct a follow-up movie. \"There isn't a life that Facebook's algorithm hasn't touched, and that influence has reshaped everything,\" Sorkin told a room full of movie theater owners at ", "date_str": "2026-09-17T21:12:38+00:00", "hash": "f454fc3437262c7a", "title_fa": "جرمی استرانگ نقش مارک زاکربرگ را در «حساب اجتماعی»، ادامه‌ای از «شبکه اجتماعی» در سال 2010 بازی می‌کند. در اینجا همه چیزهایی است که می دانیم.", "summary_fa": "جرمی استرانگ در نقش مارک زاکربرگ در The Social Reckoning. Sony \"The Social Reckoning\" داستان فرانسیس هاگن، مهندس فیس بوک را روایت می کند که به افشاگر تبدیل شده است. این فیلم به نویسندگی و کارگردانی آرون سورکین ساخته شده است و قطعه ای همراه با \"شبکه اجتماعی\" است. این فیلم در 9 اکتبر در سینماها اکران می شود. شانزده سال پیش، دیوید فینچر با داستان اصلی فیس بوک در خوابگاه با \"شبکه اجتماعی\" تماشاگران را شگفت زده کرد. این فیلم هشت بار نامزدی اسکار و سه برنده شد و از جسی آیزنبرگ به عنوان خالق خود، مارک زاکربرگ و اندرو گارفیلد در نقش دوست و همکار سابق زاک، ادواردو ساورین، ستاره هایی را به خود اختصاص داد. اکنون آرون سورکین که برای نگارش فیلمنامه «شبکه اجتماعی» برنده جایزه اسکار شده است، نویسندگی و کارگردانی فیلم بعدی «تحقیق اجتماعی» را بر عهده می گیرد. در این فیلم، همه چیز برای زاکربرگ (اکنون با بازی جرمی استرانگ) به طرز چشمگیری تغییر کرده است، زیرا فیس بوک به یکی از تأثیرگذارترین شرکت های روی کره زمین تبدیل شده است. اما این شرکت رازهای تاریکی دارد. مایکی مدیسون، برنده اسکار، نقش مهندس فیس بوک فرانسیس هاگن را بازی می کند که به جف هورویتز، گزارشگر وال استریت ژورنال، جف هورویتز، با بازی جرمی آلن وایت، اعتماد کرده است تا تحقیقات و تصمیم گیری های داخلی شرکت را افشا کند. سورکین فیلمنامه را بر اساس مجموعه تحقیقاتی گسترده وال استریت ژورنال به نام فایل‌های فیس‌بوک ساخته است که به تأثیر این شبکه اجتماعی بر سلامت روان جوانان، اطلاعات نادرست و حمله 6 ژانویه 2021 به کنگره می‌پردازد. سونی این فیلم را در 9 اکتبر منتشر خواهد کرد. در اینجا همه چیزهایی که باید بدانید وجود دارد. آرون سورکین سال هاست که می خواهد یک شبکه اجتماعی پیگیری کند. آرون سورکین. اتان میلر/ گتی ایماژ"}, {"source": "Lifehacker", "title": "10 Keyboard Hacks Every iPhone User Should Know", "link": "https://lifehacker.com/tech/10-keyboard-hacks-every-iphone-user-should-know?utm_medium=RSS", "summary": "On the surface, the iPhone keyboard looks like it did a decade ago, but underneath, much has changed. In addition to the hidden features that have existed for years, Apple has slowly added features and gestures that make typing a bit easier. If you're still shaking your iPhone to undo text, it's time to dig deeper. These 10 hacks can help you make the most of typing on your iPhone. Use keyboard haptics to simulate a physical keyboard Typing on an iPhone s glass surface can feel a bit lifeless, especially if you re used to typing on mechanical keyboards on your Mac. While there s no way to get a physical keyboard on the iPhone (unless you get something like the Clicks keyboard ), you can simulate it. The iPhone has a built-in Taptic engine, which provides subtle vibrations as you interact with the device. While most know it from notifications, calls, and scrolling through various iOS UI elements, it can be enabled for the keyboard too. Go to Settings Sounds Haptics Keyboard Feedback and enable \\\"Haptic Feedback.\" Use this hidden gesture to type one number from the main keyboard When you type on the iPhone keyboard, all you see are letters. To type numbers or symbols, you have to switch to the 123 keyboard layout instead unless you use this hidden gesture, that is. See, each letter is already hiding a number or alternative symbol behind it. All you need to do to reveal it is to swipe from the 123 key. Once you do that, the keyboard will reveal numbers and symbols. Drag your finger to the number you want to enter, let go, and it s done. The keyboard goes back to being a keyboard. Use this camera trick to scan text into any field Credit: Apple The iPhone has OCR (optical character recognition) built into iOS. You use this anytime you copy text from an image in the Photos app. The same feature is integrated into the Camera app, and lets you paste that text straight into any field, bypassing the keyboard entirely. To do so, point the camera towards any text, and the app will frame it in a yellow border. You ll also see a Live Text button in the bottom-right corner. Tap on it, select the text, and tap the Copy button. Now, open any text field, and you ll see a suggestion to paste the text you just copied. Enable one-handed mode to shift the keyboard toward your thumb Credit: Khamosh Pathak If you have a large iPhone, typing with one hand can be extremely difficult. Instead, use the keyboard's one-handed mode. Tap and hold the Globe key to find options to dock the", "date_str": "2026-09-18T14:00:00+00:00", "hash": "c69ecbbb42250946", "title_fa": "10 هک صفحه کلید که هر کاربر آیفون باید بداند", "summary_fa": "در ظاهر، صفحه کلید آیفون مانند یک دهه قبل به نظر می رسد، اما در زیر، چیزهای زیادی تغییر کرده است. علاوه بر ویژگی‌های پنهانی که سال‌هاست وجود داشته است، اپل به آرامی ویژگی‌ها و ژست‌هایی را اضافه کرده است که تایپ کردن را کمی آسان‌تر می‌کند. اگر همچنان آیفون خود را تکان می‌دهید تا متن را لغو کنید، وقت آن است که عمیق‌تر بگردید. این 10 هک می تواند به شما کمک کند تا از تایپ کردن در آیفون خود نهایت استفاده را ببرید. از صفحه کلید لمسی برای شبیه سازی صفحه کلید فیزیکی استفاده کنید تایپ کردن روی سطح شیشه ای آیفون می تواند کمی بی روح باشد، به خصوص اگر عادت به تایپ روی صفحه کلیدهای مکانیکی در مک خود داشته باشید. در حالی که هیچ راهی برای دریافت صفحه کلید فیزیکی در آیفون وجود ندارد (مگر اینکه چیزی شبیه صفحه کلید Clicks دریافت کنید)، می توانید آن را شبیه سازی کنید. آیفون دارای موتور Taptic داخلی است که هنگام تعامل با دستگاه، لرزش های ظریفی را ایجاد می کند. در حالی که بیشتر آن را از طریق اعلان‌ها، تماس‌ها و پیمایش در عناصر مختلف رابط کاربری iOS می‌دانند، می‌توان آن را برای صفحه‌کلید نیز فعال کرد. به Settings Sounds Haptics Keyboard Feedback بروید و \\\"Haptic Feedback\" را فعال کنید. از این حرکت مخفی برای تایپ یک عدد از صفحه کلید اصلی استفاده کنید وقتی روی صفحه کلید آیفون تایپ می کنید، تنها چیزی که می بینید حروف است. برای تایپ اعداد یا نمادها، باید به جای صفحه کلید 123 تغییر حالت دهید، مگر اینکه از این حرکت پنهان استفاده کنید. ببینید، هر حرف قبلاً یک عدد یا نماد جایگزین را پشت خود پنهان کرده است. تنها کاری که برای آشکار شدن آن باید انجام دهید این است که انگشت خود را از روی کلید 123 بکشید."}, {"source": "Lifehacker", "title": "These Are the Best Headphones to Gift This Year", "link": "https://lifehacker.com/tech/best-headphones-gift-guide?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Many of us use h s for the best tech under $50. The JBL Go 4 is a powerful portable speaker JBL Go 4 $49.95 at Amazon Shop Now Shop Now $49.95 at Amazon You don't need to spend hundreds of dollars to get a capable speaker for on-the-go use. The JBL Go 4 is plenty powerful for its small size, with up to seven hours of playtime between charges. This speaker is also both IP67-rated against dust and water, which makes it suited for trips to locations that would otherwise be treacherous for audio equipment. While this JBL speaker is excellent for individual use, my favorite feature isn't necessarily exclusive to this speaker. JBL makes it easy to pair its speakers together with a single button on each unit. If your friends also have their own JBL speakers among JBL's many different offerings you can connect them to establish a quick multi-speaker setup. (Note that you can find the Go 5 on sale under $50 at times, so keep an eye out if you'd prefer the newer model.) The Anker Soundcore 2 offers great audio for the price Anker Soundcore 2 Portable Bluetooth Speaker $29.99 at Amazon $44.99 Save $15.00 Get Deal Get Deal $29.99 at Amazon $44.99 Save $15.00 If you're looking for a JBL alternative, the Anker Soundcore 2 could be the move. Anker is known for making good \"budget\" speakers, and while the Soundcore 2 is cheaper than, say, the Soundcore Boom 2, it still offers great sound quality for the price. It has a much larger battery than the JBL Go 4 (24 hours versus seven), and while it's as waterproof as the JBL, it isn't as well protected against dust and debris, so while it should be fine when stacked against your pool, watch out when using it around sand. If your friend happens to have ano", "date_str": "2026-09-17T20:00:00+00:00", "hash": "08efe08d62248b80", "title_fa": "15 دستگاه فنی مفیدی که می توانید با قیمت زیر 50 دلار بخرید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. فناوری اغلب گران است و بحران مداوم حافظه کمکی نمی کند. اگر به دنبال خرید یک دستگا
