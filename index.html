<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۳ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۳ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۴ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۸</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۲۳</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۹</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

d pose no national security risk. \"The Board believes Jensen is the right person to lead Nvidia, and that his reinstatement is in the best interests of our stockholders, employees, partners and customers,\" said Harvey C. Jones, chair of the board, in the statement. Nvidia was up about 30% premarket on the news. The decision comes just days after the board said it had no intention of reinstating Huang, who resigned as Nvidia CEO earlier this month following an extramarital affair scandal and a board investigation into concerns he might have been the subject of a foreign intelligence effort. \"I am honored to return to NVIDIA and lead one of the most consequential technology companies in the world at the beginning of a new industrial revolution,\" said Huang in a statement. \"I take this responsibility with the greatest humility and renewed commitment. I want to thank the Nvidia Board for its confidence and deliberation through this process. The board said it investigated reports that Huang had been targeted in a foreign intelligence effort, forming a committee \"solely of independent directors.\" It said the committee's investigation \"will proceed to conclusion.\" President Donald Trump welcomed Huang's reinstatement, calling it the \"correct and proper decision.\" \"The Country needs Jensen's leadership at NVIDIA in order to ensure the Success and Prosperity of not only the Company, but the American Economy.\" Trump wrote in a post on X. This is a developing story. Check back for updates. Read the original article on Business Insider", "date_str": "2026-11-23T14:03:16+00:00", "hash": "948e19d5770c7d2f", "title_fa": "انویدیا جنسن هوانگ را به عنوان مدیرعامل بازگرداند", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا. بلومبرگ/گتی ایماژز، هیئت مدیره روز دوشنبه اعلام کرد که انویدیا جنسن هوانگ را به عنوان مدیرعامل و رئیس بازگردانده است. هیئت مدیره در بیانیه‌ای اعلام کرد که به اتفاق آرا به بازگرداندن هوانگ پس از یک سری بحث‌ها و جلسات با هوانگ رای داده است و پس از آن با احتر l Miss Universe competition . This year, Justus Kelley will represent the United States at the pageant. She won the Miss USA 2026 title in August, becoming the first married woman and mother to take home the crown. In honor of the coming competition, let's take a look back at the nine Miss USAs who have won Miss Universe. 1954: Miriam Stevenson Christianne Martel, 1953 Miss Universe, crowns Miss Universe 1954 Miriam Stevenson Bettmann/Getty Images Stevenson was crowned Miss Universe in 1954, making her the first American to win the pageant. She initially tied with Miss Brazil Martha Rocha, but the judges ultimately decided to crown Stevenson because they thought she had a better physique, according to Telemundo . Stevenson grew up on a dairy farm and was a student at Lander College when she began competing in pageants, first representing South Carolina in the Miss USA pageant in 1954, according to the college , now called Lander University. After her reign ended, Stevenson — who is now 93 years old — finished her studies and became a TV host, Telemundo also reported. She met her husband, Donald Upton, through work, and they had two children. 1956: Carol Morris Miss USA 1956. Earl Leaf/Michael Ochs Archives/Getty Images Morris won Miss USA while representing Iowa before she went on to become Miss Universe. The then-20-year-old was studying elementary education at Drake University when she took home the crown. After her win, she left college behind to act, according to the Des Moines Register . Morris' last IMDb credit is for an \"ITV Film of the Week\" episode, and the Register reported that she stepped back from acting after she got married and had four children. Morris, now 90, is still the only representative from Iowa to win both Miss USA and Miss Universe. 1960: Linda Bement Miss USA 1960. Bettmann / Contributor / Getty Images Bement, who died in 2018, won the 1960 Miss USA pageant while representing Utah before becoming Miss Universe the same yea", "date_str": s Insider they're particularly excited about the opportunities in AI infrastructure and cyber in Israel . \"The opportunity is as good, and probably even better, than we had in fund one,\" Pilowsky said. \"One, more founders want to build bigger businesses, and two, AI is such a massive propeller for every good founder.\" At Goldman, Key1's cofounders generally worked with well-established companies considering an M A deal or going public, which they say has informed their strategy today. \"Through essentially a tremendous amount of repetition, you know how to actually select those that you feel comfortable taking public, s", "date_str": "2026-11-23T14:00:01+00:00", "hash": "dedafe6a804123cb", "title_fa": "آنها گلدمن را ترک کردند تا یک شرکت VC تأسیس کنند - و فقط 320 میلیون دلار برای صندوق دوم خود تضمین کردند", "summary_fa": "سارل الدور، آمیت پیلوفسکی و دنی آکرمن قبل از تاسیس Key1 Capital سال‌ها را به عنوان مدیران در گلدمن ساکس سپری کردند. Key1 Capital سه نفر از مدیران سابق گلدمن ساکس، از جمله مدیرعامل دفتر اسرائیلی آن، برای تأسیس یک شرکت VC ترک کردند. آنها 320 میلیون دلار برای صندوق دوم خود با تمرکز بر شرکت های فناوری اسرائیلی که در اواخر رشد بودند، جمع آوری کردند. بنیانگذاران از تجربه و روابط خود در بانک برای افزایش حقوق استفاده کردند. سه مدیر سابق گلدمن ساکس 320 میلیون دلار برای صندوق دوم شرکت VC خود تضمین کرده اند - و آنها از روابط خود در بانک برای کمک به افزایش سرمایه استفاده می کنند. سارل الدور، آمیت پیلووسکی و دنی آکرمن پس از گذراندن سال‌ها در گلدمن در اسرائیل، Key1 Capital، یک شرکت سرمایه‌گذاری خطرپذیر با رشد دیرینه را در سال 2022 تأسیس کردند. Key1 گفت که بیشتر سرمایه برای صندوق دوم آن از سوی سرمایه گذاران نهادی و دفاتر خانوادگی، همراه با نزدیک به 10 شریک محدود که مدیران فعلی یا سابق گلدمن هستند، تامین می شود. مشتریان سابق نیز در این صندوق مشارکت دارند - در میان 25 LP که بنیانگذار فعلی یا سابق هستند، 20 نفر از آنها در طول مدتی که در بانک بودند با تیم Key1 کار می کردند. برخی از مشتریان قدیمی آنها مربیان بنیانگذارانی هستند که Key1 اکنون از آنها حمایت می کند. ای rones and other technologies. Zero is no stranger to the officer training at Sandhurst. He completed the British Army's officer training course there in 2022, before returning to the front . Now he's back helping instructors and cadets rethink how they ready officers for combat. \"It's just really useful having an individual who's been through Sandhurst, who's spent four years on the front line in Ukraine,\" Brigadier Nick Wight-Boycott, the commander of the Royal Military Academy Sandhurst, said, explaining that it's valuable to be able to ask, \"What from Sandhurst worked for you?\" The 44-week commissioning course at the Royal Military Academy Sandhurst, the home of British Army officer training, is making changes in response to the war in Ukraine . Cadets are learning to dig different trenches , move faster, and operate under the constant threat of enemy drones. Zero is spending several months advising instructors and cadets on what modern combat looks like and helping shape the training environment. Brigadier Nick Wight-Boycott, the commander of the Royal Military Academy Sandhurst, told Business Insider that \"the new scenario, I think, is more realistic than the one to which we've used in the past.\" Learning from a Ukrainian combat veteran Zero, who served as a platoon commander on Ukraine's front lines, is at Sandhurst as an advisor rather than a formal instructor. H", "date_str": "2026-11-23T13:53:33+00:00", "hash": "024ad14246c4e2fe", "title_fa": "ارتش بریتانیا یک افسر اوکراینی را که در نبرد آزمایش شده بود وارد کرد تا افسران آینده را برای واقعیت های وحشیانه جنگ مدرن آماده کند.", "summary_fa": "یک افسر اوکراینی به رهبران آینده ارتش بریتانیا کمک می کند تا برای جنگ آینده آماده شوند، آموزش آنها را راهنمایی می کند و به سوالات دانشجویان و رهبران پاسخ می دهد. Sinéad Baker افسران ارتش آینده بریتانیا به شیوه ای متفاوت آموزش می بینند و از درس هایی از جنگ اوکراین استفاده می کنند. کادت ها سنگرهای مختلف حفر می کنند، سریع تر حرکت می کنند و تحت تهدید پهپادها آموزش می بی       media: [{"source": "Billboard", "title": "Corina Smith Signs With Universal Music Latino: ‘They’ve Embraced Me Exactly As I Am’", "link": "https://www.billboard.com/pro/corina-smith-universal-music-latino-signing-exclusive/", "summary": "Corina Smith has signed a deal with Universal Music Latino, Billboard can exclusively announce today (Nov. 23). “Corina Smith is an exceptional talent with a unique artistic identity, authenticity, and undeniable global potential,” Daniel Luna, general manager at Universal Music Latino, said in a statement. “What drew us to Corina is how much of herself she puts into her songs. With this genuine connection we believe Corina has everything it takes to become one of the leading voices of the next generation of Latin music. We are proud to welcome her to Universal Music Latino and be part of her new global journey.” Related Ignacio Meyer Named President of Universal Music Latin America Iberian Peninsula Ignacio Meyer Named President of Universal Music Latin America Iberian Peninsula Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Smith is a Venezuelan singer-songwriter who began writing songs in her bedroom and quickly brought those personal experiences to life through her blooming music career. Blending elements of pop, reggaeton and R B music, Smith’s musical identity is rooted in authenticity, vulnerability and creative independence. She says, “Through my career as an artist my fans and I have developed our own universe and the UML team has given that universe a home. They ve embraced me exactly as I am, allowing me to continue genuinely making the music that I love, with the support of their world-class team. I m so excited to continue building our universe together.” This year, Smith released key collaborations with Mika Bahía (“Encubiertos”), Dome (“@BOMBA DE HUMO” ), and Dani Barranco (“8 Preguntas”). She’s released three studio albums: Antisocial (2022), triste pero siempre mami (2023) and menos triste más mami (2025), and has collaborated with Arcángel, Eladio Carrión and De La Ghetto, to name a few. New music is slated for release in the first quarter of 2027 under her new chapter with Universal Music Latino.", "date_str": "2026-11-23T15:00:00+00:00", "hash": "f06aaa057883c93a", "title_fa": "کورینا اسمیت با یونیورسال موزیک لاتین امضا می کند: \"آنها مرا دقیقاً همانطور که هستم در آغوش گرفتند\"", "summary_fa": "کورینا اسمیت قراردادی با Universal Music Latino امضا کرده است، بیلبورد می تواند به طور انحصاری امروز (23 نوامبر) اعلام کند. دانیل لونا، مدیر کل یونیورسال موزیک لاتین در بیانیه ای گفت: «کورینا اسمیت یک استعداد استثنایی با هویت هنری منحصر به فرد، اصالت و پتانسیل جهانی غیرقابل انکار است. آنچه ما را به سمت کورینا جذب کرد این است که چقدر از خودش در آهنگ هایش استفاده می کند. با این ارتباط واقعی، ما معتقدیم که کورینا همه چیز لازم را برای تبدیل شدن به یکی از صداهای پیشرو نسل بعدی موسیقی لاتین دارد. ما مفتخریم که به او در Universal Music Latino خوش آمد می‌گوییم و بخشی از سفر جهانی جدید او هستیم. مرتبط ایگناسیو مایر به عنوان رئیس یونیورسال موسیقی آمریکای لاتین شبه جزیره ایبری ایبریا انتخاب شد ایگناسیو مایر به عنوان رئیس یونیورسال موسیقی آمریکای لاتین شبه جزیره ایبری آمریکای لاتین موافقت کرد در حال حاضر حمایت از کودکان را افزایش دهد تا دیاموند سابق در مبارزه تلخ حضانت اسمیت یک خواننده و ترانه سرای ونزوئلایی است که در اتاق خواب خود شروع به نوشتن آهنگ های شخصی کرد و به سرعت شروع به نوشتن آهنگ کرد. حرفه ترکیب عناصر موسیقی پاپ، رگیتون و RB، هویت موسیقی اسمیت ریشه در اصالت، آسیب پذیری و استقلال خلاقانه دارد. او می‌گوید: «در طول حرفه‌ام به‌عنوان یک هنرمند، من و طرفدارانم دنیای خود را توسعه داده‌ایم و تیم UML به آن جهان خانه داده است. آنها من را دقیقاً همانطور که هستم در آغوش گرفتند و به من این امکان را دادند که با حمایت تیم کلاس جهانی خود به ساختن واقعی موسیقی مورد علاقه‌ام ادامه دهم. \"من بسیار هیجان زده هستم که به ساختن جهان خود با هم ادامه دهم.\" در این سال، اسمیت همکاری‌های کلیدی خود را با Mika Bahía (\"مخفی\")، Dome (\"@BOMBA DE HUMO\") و Dani", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/corina-smith-cr-universal-music-latino-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۳۰"}, {"source": "Billboard", "title": "‘It’s Not Just a Song on the Radio’: How Music Became A Main Character In ‘Grand Theft Auto VI’", "link": "https://www.billboard.com/music/features/gta-6-radio-songs-soundtrack-justice-billboard-cover-1236386805/", "summary": "For decades, Rockstar Games was chasing one song. In 2002, when the gaming behemoth was developing Grand Theft Auto: Vice City , the fourth installment of its iconic series, it had successfully secured classics like Michael Jackson’s Billie Jean and Grandmaster Flash and the Furious Five’s The Message for the game. But one record remained tantalizingly out of reach: The Cars 1984 single Drive, the highest-charting of the power-pop band’s career. A favorite of Rockstar co-founder Sam Houser, the haunting, synth-driven song encapsulated the neon-soaked 80s world the developer was expanding. Rockstar couldn t clear the track then — but more than two decades later, the wait is finally over. On Nov. 19, Rockstar made its long-awaited return to Vice City with the epic, stunningly cinematic Grand Theft Auto VI . Even before breathless reviews of the game flooded the internet, GTA VI was predicted to be the biggest entertainment launch in history, with possibly more than $5 billion in first week sales alone. And when players turn on one of the game’s defining features — the in-game radio — Drive is the first song they hear. Related Every Track From Grand Theft Auto VI: The Album Ranked Grand Theft Auto VI Soundtrack, Gracie Abrams, LISA, Tomorrow x Together More: New Music Friday Guide Justice, Pretty Lights, Honey Dijon RL Grime Lead Lightning In a Bottle 2027 Lineup For Rockstar vice president of music Ivan Pavlovich, clearing Drive wasn’t just a licensing victory — it was a testament to the company s unwavering prioritization of music, the relationships it has cultivated throughout the industry and the meticulous curation that has transformed Grand Theft Auto into one of the past 20 years’ most culture-saturating, riveting and lucrative products. Music, Pavlovich says, is the through line through all of that. That’s never been more true than with GTA VI , which Pavlovich calls the biggest project we’ve ever done, with, by his count, over 800 songs in the game right now. With 23 radio stations — 21 for music and two for talk radio — along with in-game podcasts to crank up as you re cruising through the streets of Leonida ( GTA ’s Florida stand-in), plus even TV shows to watch when you’re not, it s Rockstar’s most ambitious music-driven experience yet. In 1997, video game developers David Jones and Mike Dailly helped bring the first Grand Theft Auto to life at Scottish gaming studio DMA Design (now Rockstar North). Originally published by BMG Interactive, the 2D ", "date_str": "2026-11-23T14:59:18+00:00", "hash": "6f38829927072c0c", "title_fa": "\"این فقط یک آهنگ در رادیو نیست\": چگونه موسیقی به شخصیت اصلی \"Grand Theft Auto VI\" تبدیل شد", "summary_fa": "برای چندین دهه، Rockstar Games دنبال یک آهنگ بود. در سال 2002، زمانی که این غول بازی در حال توسعه Grand Theft Auto: Vice City، چهارمین قسمت از سری نمادین خود بود، با موفقیت آثار کلاسیکی مانند Billie Jean و Grandmaster Flash مایکل جکسون و Furious Five's The Message را برای بازی تضمین کرد. اما یک رکورد به طرز وسوسه انگیزی دور از دسترس ماند: تک آهنگ The Cars 1984 Drive، بالاترین نمودار در کارنامه گروه پاور پاپ. آهنگ مورد علاقه سام هاوسر، یکی از بنیانگذاران Rockstar، آهنگ ترسناک و مبتنی بر سنتز، دنیای نئونی دهه 80 را که سازنده در حال گسترش آن بود، در بر می گیرد. Rockstar در آن زمان نتوانست مسیر را پاک کند - اما بیش از دو دهه بعد، سرانجام انتظار به پایان رسید. در 19 نوامبر، Rockstar با فیلم حماسی و خیره کننده سینمایی Grand Theft Auto VI به Vice City بازگشت که مدت ها منتظرش بودیم. حتی قبل از اینکه بررسی‌های بی‌نفس این بازی به اینترنت سرازیر شود، GTA VI بزرگترین عرضه سرگرمی تاریخ خواهد بود که احتمالاً تنها در هفته اول فروش بیش از 5 میلیارد دلار خواهد داشت. و هنگامی که بازیکنان یکی از ویژگی های تعیین کننده بازی - رادیو درون بازی - را روشن می کنند، Drive اولین آهنگی است که می شنوند. هر آهنگ مرتبط از Grand Theft Auto VI: The Album Ranked Grand Theft Auto VI موسیقی متن، Gracie Abrams، LISA، Tomorrow x Together موارد بیشتر: New Music Friday Guide Justice، Pretty Lights، Honey Dijon RL Grime Lead Lightning In a Bottle 2027 Lineup For Rockstar Driver Pavlovich، معاون رئيس جمهور موسيقي بود. پیروزی - این گواهی بر اولویت بندی تزلزل ناپذیر این شرکت برای موسیقی، روابطی که در سراسر صنعت ایجاد کرده است و مدیریت دقیقی بود که Grand Theft Auto را به یکی از", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/cover-gta-vi-grand-theft-auto-billboard-rockstar-games-1-jason-lucia-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۲۹"}, {"source": "Billboard", "title": "Justin Timberlake Exposes His Doubts in Docuseries Trailer: ‘People Aren’t Gonna Understand Who I Am’", "link": "https://www.billboard.com/culture/tv-film/justin-timberlake-doubts-docuseries-trailer-release-date-1236387718/", "summary": "What goes around comes around back on TV. The Justin Timberlake documentary series that was first reported in early November is now official. Apple TV announced the four-part series, simply titled Timberlake , on Monday (Nov. 23) and dropped the project s first trailer. Related Justin Timberlake to Release 4-Part Docuseries That Includes Janet Jackson as a Guest Justin Timberlake Makes Rare Public Appearance With Sons and Niece on Runway at Down Syndrome Foundation Fashion Show Justin Timberlake Crowns This FutureSex/LoveSounds Hit as the Best Song He s Ever Made: Written in Damn Near 20 Minutes The 2.5 minute clip kicks off with the 10-time Grammy winner plopping down on a cushy couch and demanding to know, What are you looking to accomplish from this documentary? He immediately reveals his doubts about the project directed by Oscar winner Fisher Stevens. People aren t going to understand who I am! The trailer for the docuseries, which will follow the trajectory of Timberlake s career from *NSYNC through his solo success, dives in from the beginning. I m sure that you re going to go back and see these incredibly sweet and goofy things from my childhood — the star says as family footage of Timberlake as a toddler play, moving through his teen years, including a clip of him showing off the poster of Janet Jackson in his bedroom — and some things that are really hard to talk about. At that, clips of him with former girlfriend Britney Spears appear, followed by news footage of Timberlake s DUI arrest. But it s not all bad. Big names in entertainment such as Pharrell Williams and Lorne Michaels also appear to praise the singer-actor, though Janet Jackson, who was previously reported to be taking part in the project, did not appear other than in flashback clips from her 2004 Super Bowl performance with Timberlake. For the first time in my life, I m coming to a place to say, I can t handle it all,' admits the star in one confessional scene. In the finale one, he notes, You want to ask me about specific things? Let s do it! According to the press release, the four-part series will include never-before-seen archival footage, as well as interviews with his friends, collaborators and of course, his family. (Jessica Biel, whom Timberlake married in 2012, as well as his mother appear in the teaser.) The first two episodes of Timberlake will premiere Friday, Dec. 11, on Apple TV with the third episode dropping Dec. 18 and the finale arriving just in time for Christmas ", "date_str": "2026-11-23T14:55:19+00:00", "hash": "907ca7bb080ce56c", "title_fa": "جاستین تیمبرلیک شک های خود را در تریلر مستند افشا می کند: «مردم نمی توانند بفهمند من کی هستم»", "summary_fa": "آنچه در اطراف می گذرد به تلویزیون بازمی گردد. مجموعه مستند جاستین تیمبرلیک که اولین بار در اوایل نوامبر گزارش شد، اکنون رسمی شده است. اپل تی‌وی این مجموعه چهار قسمتی را با نام ساده تیمبرلیک در روز دوشنبه (23 نوامبر) اعلام کرد و اولین تریلر این پروژه را منتشر کرد. جاستین تیمبرلیک فیلم مستندی 4 قسمتی را منتشر می‌کند که شامل جانت جکسون به عنوان مهمان می‌شود. دقایق این کلیپ 2.5 دقیقه‌ای با برنده 10 جایزه گرمی شروع می‌شود که بر روی یک کاناپه آرام فرو می‌رود و می‌خواهد بداند، به دنبال چه کاری از این مستند هستید؟ او بلافاصله تردیدهای خود را در مورد پروژه ای که توسط فیشر استیونز برنده اسکار کارگردانی شده است، آشکار می کند. مردم نمی توانند بفهمند من کی هستم! تریلر سریال مستند که مسیر حرفه تیمبرلیک را از *NSYNC تا موفقیت انفرادی او دنبال می‌کند، از همان ابتدا وارد صحنه می‌شود. مطمئنم که به عقب برمی‌گردید و این چیزهای فوق‌العاده شیرین و احمقانه را از دوران کودکی‌ام می‌بینید - ستاره به عنوان فیلم خانوادگی تیمبرلیک در دوران بازی یک کودک نوپا، می‌گوید که در سال‌های نوجوانی‌اش می‌گذرد، از جمله کلیپی از او که پوستر جانت جکسون را در اتاق خوابش نشان می‌دهد - و برخی چیزهایی که صحبت کردن در مورد آنها واقعاً سخت است. در آن زمان، کلیپ هایی از او با دوست دختر سابق بریتنی اسپیرز ظاهر می شود و به دنبال آن تصاویر خبری از دستگیری تیمبرلیک DUI منتشر می شود. اما همه چیز بد نیست. به نظر می رسد که نام های بزرگ سرگرمی مانند فارل ویلیامز و لورن مایکلز نیز خواننده-بازیگر را ستایش می کنند، اگرچه جانت جکسون، که قبلاً گزارش شده بود که در این پروژه شرکت می کرد، جز در کلیپ های فلش بک از اجرای سوپر باول او در سال 2004 با تیمبرلیک ظاهر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/justin-timberlake-appletv-screengrab-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما"], "datetime_fa": "۲ آذر • ۱۸:۲۵"}, {"source": "Deadline", "title": "‘The Grand Tour’s New Hosts Get Season 2 Renewal At Amazon Prime Video", "link": "https://deadline.com/2026/11/the-grand-tour-season-2-renewal-amazon-prime-video-1237231574/", "summary": "Francis Bourgeois, James Engelsman, and Thomas Holland are revving their engines for a second lap. Amazon Prime Video has renewed The Grand Tour s reincarnation for a second season, with Studio Lambert set to begin production next year. Bourgeois, Engelsman, and Holland followed in the footsteps of Jeremy Clarkson, James May, and Richard Hammond, who hosted [ ]", "date_str": "2026-11-23T15:00:00+00:00", "hash": "40e9f22e4bf59e81", "title_fa": "میزبانان جدید The Grand Tour در Amazon Prime Video تمدید می شوند", "summary_fa": "فرانسیس بورژوا، جیمز انگلسمن و توماس هالند برای دور دوم موتورهای خود را دور می زنند. Amazon Prime Video تناسخ The Grand Tour را برای فصل دوم تمدید کرد و استودیو لامبرت قرار است سال آینده تولید خود را آغاز کند. بورژوا، انگلسمن و هالند جا پای جرمی کلارکسون، جیمز می و ریچارد هاموند، که میزبان [] این سه نفر بودند، گفتند: «حتی با وجود برکت جرمی، جیمز و ریچارد، احتمالاً این کار احمقانه‌تر بود تا شجاع. اما استقبال از سری اول ما بیشتر از چیزی بود که تصورش را می کردیم. و اکنون که به یافتن پاهای خود در این دنیا ادامه می‌دهیم، شجاعت این را داریم که احمق‌تر باشیم و حماقتی که حتی شجاع‌تر باشیم.» تهیه کننده اجرایی نیا یمو افزود: ما نمی توانیم منتظر باشیم تا ببینیم که چگونه شیمی بین این سه نفر رشد می کند زیرا ما مکان ها، داستان های غیرمنتظره و همه چیز را با عنصر تجاری رقابت که بینندگان می شناسند و دوست دارند کشف می کنیم. Watch on Deadline تهیه کنندگان اجرایی استودیو لامبرت فیل چرچوارد، تیم هارکورت، استفان لمبرت، یمو هستند. مدیران تولید هیلاری برکشایر و دایانا فوک هستند. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/tgt1-e1795444801476.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲ آذر • ۱۸:۳۰"}, {"source": "Deadline", "title": "UTA Moving To New London HQ With Curtis Brown & Soccer Agency ROOF For First Time", "link": "https://deadline.com/2026/11/uta-new-london-hq-curtis-brown-r     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
