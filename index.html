ilty of securities fraud. Prosecutors said they didn't learn about the investigation until after the trial was over. A witness who testified against Andrew Left has himself become involved in an insider trading probe, bringing a new twist to the bombastic short-seller's fraud conviction. Left's lawyers this month asked the judge who oversaw his trial to toss the jury's verdict convicting him of 13 counts of securities fraud. The trial was irredeemably unfair, they said, because they never had the chance to ask the witness about the investigation and attack his credibility. \"A new trial would probably produce an acquittal,\" Left's lawyers wrote. In June, a federal jury in Los Angeles found Left guilty of 13 counts of securities fraud. Prosecutors said he deceived investors by using social media and research reports to set target prices for stocks — including Tesla, Nvidia, and Palantir — while quietly trading them at different prices with his own money. The founder of Citron Research, Left is something of a short-seller celebrity. He placed bets against GameStop at the same time it became a meme stock, which pitted him against some retail traders on social media. For years, he was a fixture on CNBC and Bloomberg, where he shared his views on stock prices. Left hasn't been sentenced. In addition to the criminal case, he faces a parallel civil lawsuit from the Securities and Exchange Commission that remains unresolved. Left's criminal conviction shook certain corners of Wall Street , which viewed the trial as a referendum on free speech and the legality of activist short-seller tactics. Left, testifying in his own defense at the trial , said that the views he shared about public companies were sincere. One of the trial's prosecution witnesses was Daniel Bachus, the CFO of Grand Canyon Education, a publicly traded technology company that provides services to universities. Left's lawyers say that Bachus was the only witness who testified that Left used his Citron Research reports to lie about a company, not merely omit information. On August 21 — weeks after the trial ended — Grand Canyon Education placed Bachus on paid administrative leave \"in connection with an", "date_str": "2026-10-18T10:00:04+00:00", "hash": "4407c9cf2c4bcd35", "title_fa": "اندرو چپ می خواهد محکومیت کلاهبرداری خود را پس از گرفتار شدن شاهد در تحقیقات تجاری خودی لغو کند.", "summary_fa": "وکلای اندرو چپ از قاضی خواستند محکومیت خود را در مورد 13 مورد کلاهبرداری اوراق بهادار رد کند. دانیا مکسول/ بلومبرگ/ گتی ایماژ شاهدی که علیه اندرو چپ شهادت داده بود، خودش درگیر یک تحقیق تجاری داخلی شده است. وکلای چپ از یک قاضی خواستند تا رای هیئت منصفه را که او را متهم به کلاهبرداری اوراق بهادار می‌دانست، بی‌اندازد. دادستان ها گفتند که از تحقیقات تا پایان محاکمه مطلع نشدند. شاهدی که علیه اندرو چپ شهادت داده است، خود درگیر یک تحقیق تجاری داخلی شده است و پیچیدگی جدیدی در محکومیت کلاهبرداری فروشنده کوتاه فروش ایجاد می کند. وکلای چپ در این ماه از قاضی که بر محاکمه او نظارت داشت خواستند حکم هیئت منصفه را که او را به 13 فقره کلاهبرداری اوراق بهادار محکوم کرده بود، صادر کند. آنها گفتند که محاکمه به طور جبران ناپذیری ناعادلانه بود، زیرا هرگز این فرصت را نداشتند که از شاهد در مورد تحقیقات بپرسند و به اعتبار او حمله کنند. وکلای چپ نوشتند: «یک محاکمه جدید احتمالاً موجب تبرئه خواهد شد. در ژوئن، یک هیئت منصفه فدرال در لس آنجلس، چپ را در 13 فقره کلاهبرداری اوراق بهادار مجرم تشخیص داد. دادستان‌ها گفتند که او با استفاده از رسانه‌های اجتماعی و گزارش‌های تحقیقاتی برای تعیین قیمت‌های هدف سهام - از جمله تسلا، انویدیا و پالانتیر - سرمایه‌گذاران را فریب داده و در حالی که بی‌سروصدا آنها را با قیمت‌های مختلف با پول خود معامله می‌کند. بنیانگذار Citron Research، Left چیزی شبیه یک سلبریتی کم فروش است. او همزمان با GameStop شرط بندی کرد که به یک سهام میم تبدیل شد، که او را در مقابل برخی از معامله گران خرده فروشی در رسانه های اجتماعی قرار داد. او سال‌ها در CNBC و بلومبرگ حضور داشت و نظرات خود را در مورد قیمت سهام به اشتراک گذاشت. چپ محکوم نشده است"}, {"source": "Business Insider", "title": "I made an impulsive decision to quit a great job in Hollywood. It felt like a mistake — but here's what I learned.", "link": "https://www.businessinsider.com/quit-hollywood-job-career-mistake-worked-out-risks-reward-2026-10", "summary": "My worst professional mistake ultimately became my biggest professional and personal break, writes Peter Csathy. DNY59/Getty Images Peter Csathy is a studio exec, startup CEO, media and tech advisor, music dealmaker, and podcaster. He calls leaving a Hollywood studio job for a startup the 'stupidest' decision of his career. In the long run, it led him to achieve higher heights of personal and professional satisfaction. The following is adapted from a book excerpt. I began my career as an entertainment lawyer in a major firm. It was a lucrative, predictable professional path that likely would have generated more money over time than my far more circuitous one —studio executive, startup CEO, media/tech advisor, music dealmaker, author, podcaster — has. But early on, I chose a different path to pursue my bigger dream of playing a part in a major Hollywood studio. And after seemingly endless rejection, and through sheer tenacity and will, I scored the lottery when I found my way \"in\" — jumping the industry's velvet rope and landing in the senior executive ranks at Universal Studios. And then, just a few years later, I left. I left to enter the great unknown of entrepreneurialism — into the world of internet 1.0 in the late 1990s where dreams were big, but salaries small. Never mind that; I was going to score big and fast in my inevitable IPO. Only I didn't, and my decision to leave Universal in favor of an overblown internet startup (a digital greeting card company, for God's sake!) became my stupidest decision in my professional career. My wife, Luisa, was pregnant with our first child, Hunter. It's not as if we had built a substantial nest egg up to that point. And I had been making a nice salary in Hollywood, with plenty of upward room to grow. جا را ترک کردم تا وارد ناشناخته بزرگ کارآفرینی شوم - در اواخر دهه 1990 وارد دنیای اینترنت 1.0 شدم، جایی که رویاها بزرگ بودند، اما حقوق کم. هرگز اهمیتی نمی‌دهیم که؛ من قرار بود در IPO اجتناب ناپذیر خود امتیاز بزرگ و سریعی کسب کنم. فقط من این کار را نکردم، و تصمیم من برای ترک یونیورسال به نفع یک استارتاپ اینترنتی بیش از حد (یک شرکت کارت تبریک دیجیتال، به خاطر خدا!) احمقانه ترین تصمیم من در حرفه حرفه ای من شد. همسرم، لویزا، اولین فرزندمان، هانتر را باردار بود. اینطور نیست که تا"}, {"source": "Business Insider", "title": "What the rich and poor have in common: They say they're living paycheck to paycheck", "link": "https://www.businessinsider.com/living-paycheck-to-paycheck-richest-poorest-americans-2026-10", "summary": "Americans at the top and bottom of the income distribution are feeling stressed. Natalia Lebedinskaia/Getty Images Higher- and lower-income Americans are more likely than those in the middle to say they're living paycheck to paycheck. The top and bottom also struggled with making credit card payments and are delaying financial goals. Lifestyle creep is one reason high earners are feeling anxious. Low and high earners have at least one thing in common: they're more likely than those somewhere in the middle to say they're living paycheck to paycheck . A July survey of over Americans by Goldman Sachs Asset Management and behavioral economics firm Escalent showed about 61% of working respondents with less than $50,000 said they're primarily living paycheck to paycheck, meaning they struggle to save or make progress toward long-term goals . The share dropped to 22% for those with $100,000 to $200,000 but rose to about 37% for those with more than $500,000. \"Financial security as reported does not rise in a straight line with income; it follows a u-shaped pattern,\" a recent report said. However, those at the top and bottom are facing different challenges. Lower earners are struggling to keep up with the basics. A Pew Research Center survey found 42% of lower-income US adults struggled to afford daily transportation costs, and 39% of lower-income adults said the same about paying their rent or mortgage. High gas prices don't help; they're rising at a faster clip than before the Iran war. Food-at-home prices, which include groceries, are rising more slowly, but they are still increasing. And the gap between what you need to earn to afford a house and the actual median household income has worsened, according to a tracker from the Atlanta Fed. Meanwhile, high earners with more than $300,000 are facing \"more complex financial lives, higher lifestyle expectations, larger fixed commitments, and a wider gap between the retirement they envision and what they believe they have secured,\" the report said. Lifestyle creep could also be a factor, said Chris Ceder, senior retirement strategist at Goldman Sachs Asset Management. U-shapes everywhere The report also showed there were U-shapes by income level in how often financial concerns make it tough to focus at work, how many people are struggling with credit card payments, and how many said they're delaying financial goals. Those at the highest end of the income spectrum also had the highest share saying they've had to dela", "date_str": "2026-10-18T10:00:02+00:00", "hash": "61d841f3e64b9986", "title_fa": "وجه اشتراک ثروتمندان و فقیرها: آنها می گویند که از حقوق و دستمزد به چک می گذرانند", "summary_fa": "آمریکایی ها در بالا و پایین توزیع درآمد احساس استرس می کنند. Natalia Lebedinskaia/Getty Images آمریکایی‌های با درآمد بالاتر و پایین‌تر از آنهایی که در سطح متوسط ​​هستند، بیشتر از افرادی که در سطح متوسط ​​قرار دارند، می‌گویند که از حقوق و دستمزد به چک پرداخت می‌کنند. بالا و پایین نیز با پرداخت کارت اعتباری مشکل داشتند و اهداف مالی را به تاخیر می اندازند. خزش سبک زندگی یکی از دلایلی است که افراد با درآمد بالا احساس اضطراب می کنند. افراد کم درآمد و پردرآمد حداقل یک چیز مشترک دارند: آنها بیشتر از کسانی که در وسط هستند می گویند که از حقوق و دستمزد به چک دستمزد زندگی می کنند. نظرسنجی ژوئیه از بیش از آمریکایی‌ها توسط Goldman Sachs Asset Management و شرکت اقتصاد رفتاری Escalent نشان داد که حدود 61 درصد از پاسخ‌دهندگان شاغل با کمتر از 50000 دلار گفته‌اند که عمدتاً از حقوق و دستمزد تا چک حقوق زندگی می‌کنند، به این معنی که برای پس‌انداز یا پیشرفت به سمت اهداف بلندمدت تلاش می‌کنند. این سهم برای کسانی که 100000 تا 200000 دلار داشتند به 22% کاهش یافت اما برای کسانی که بیش از 500000 دلار داشتند به حدود 37% رسید. در گزارش اخیر آمده است: \"امنیت مالی همانطور که گزارش شده در یک خط مستقیم با درآمد افزایش نمی یابد، بلکه از یک الگوی U پیروی می کند.\" با این حال، کسانی که در بالا و پایین هستند با چالش های متفاوتی روبرو هستند. افراد کم درآمد برای همگام شدن با اصول اولیه تلاش می کنند. نظرسنجی مرکز تحقیقات پیو نشان داد که 42 درصد از بزرگسالان کم درآمد ایالات متحده برای پرداخت هزینه های حمل و نقل روزانه با مشکل مواجه هستند و 39 درصد از بزرگسالان کم درآمد نیز همین را در مورد پرداخت اجاره یا وام مسکن خود گفتند. قیمت بالای بنزین"}, {"source": "Business Insider", "title": "He retired after he got notified of student-loan forgiveness. Then his payments came back.", "link": "https://www.businessinsider.com/retired-after-student-loan-forgiveness-pslf-payments-came-back-debt-2026-10", "summary": "Donald Knierim is fighting to get his Public Service Loan Forgiveness restored. Vanessa Valadez for BI Donald Knierim planned his retirement around student-loan forgiveness. He spent most of his career designing financial data systems for major companies. At the age of 60, he took a pay cut and moved to the public sector, working for Metra, Chicago's commuter railway. His primary draw to the job was lower stress, and an added bonus was that it qualified for the Public Service Loan Forgiveness program, which erases student debt for government and nonprofit workers after 10 years. Knierim had a $62,000 balance remaining on the student loans he took out to send his kids to college. If all went according to plan, a decade at Metra would wipe that clean. In November 2025, the now-71-year-old logged on to his Federal Student Aid dashboard. It read \"Congratulations! You've satisfied your obligation, and no additional payments are required for this loan.\" That tracked — Knierim said he had never missed a payment, always verifying that his payments were counting toward his forgiveness progress. So he put in his notice and retired. Knierim retired after thinking his student-loan payments were done. Vanessa Valadez for BI Months later, he received an update: 15 payments that had previously counted toward forgiveness were changed to \"non-qualifying.\" The notice said his payments were below the amount required under his income-driven repayment plan, but did not specify the proper amount. That means he has at least another year and a half of payments — about $470 monthly — to achieve PSLF. \"If I have to restore that payment, it's going to put my wife and me in a bad situation,\" Knierim said. \"We're too tight in retirement to be shelling out money for stuff that we can't afford.\" Since 2023, Business Insider has heard from student-loan borrowers whose loan forgiveness was rescinded. Over the past few months, issues with PSLF have become more widespread, with borrowers reporting challenges in receiving accurate payment counts. Some had their payments toward forgiveness removed after the Department of Education said it was correcting accounts following Biden-era coding errors. An Education Department spokesperson said that the agency \"remains committed to ensuring that every qualifying payment is properly credited to a borrower's account.\" For years, Knierim said he made sure his payments were counting toward his forgiveness progress. Vanessa Valadez for BI Knierim said th", "date_str": "2026-10-18T10:00:01+00:00", "hash": "84e95b3033c65080", "title_fa": "او پس از دریافت خبر بخشودگی وام دانشجویی بازنشسته شد. سپس پرداخت های او برگشت.", "summary_fa": "دونالد Knierim در حال مبارزه برای بازگرداندن بخشش وام خدمات عمومی خود است. ونسا والادز برای BI Donald Knierim بازنشستگی خود را با بخشش وام دانشجویی برنامه ریزی کرد. او بیشتر دوران حرفه ای خود را صرف طراحی سیستم های داده مالی برای شرکت های بزرگ کرد. در سن 60 سالگی، دستمزدش را کاهش داد و به بخش دولتی رفت و در مترا، راه آهن شهری شیکاگو کار کرد. جلب توجه اولیه او به این شغل استرس کمتر بود و یک امتیاز اضافی این بود که برای برنامه بخشودگی وام خدمات عمومی واجد شرایط بود، که بدهی دانشجویان را برای کارگران دولتی و غیرانتفاعی پس از 10 سال پاک می کند. کنیریم 62000 دلار باقی مانده از وام های دانشجویی که برای فرستادن فرزندانش به کالج گرفته بود، داشت. اگر همه چیز طبق برنامه پیش می رفت، یک دهه در Metra آن را پاک می کرد. در نوامبر 2025، این مرد 71 ساله به داشبورد فدرال کمک دانشجویی خود وارد شد. روی آن نوشته شده بود: «تبریک! شما تعهد خود را انجام داده‌اید و برای این وام نیازی به پرداخت اضافی نیست.» که پیگیری شد - کنیریم گفت که او هرگز پرداختی را از دست نداده است، و همیشه تأیید می‌کرد که پرداخت‌هایش در پیشرفت بخشش او حساب می‌شود. بنابراین اخطار خود را اعلام کرد و بازنشسته شد. ونسا والادز برای BI ماه‌ها بعد، یک به‌روزرسانی دریافت کرد: 15 پرداختی که قبلاً برای بخشش حساب می‌شد به «غیر واجد شرایط» تغییر یافت. در این اخطار گفته شده است که پرداخت‌های وی کمتر از مبلغ مورد نیاز در برنامه بازپرداخت مبتنی بر درآمد است، اما مبلغ مناسبی را مشخص نکرده است. این بدان معناست که او حداقل یک سال و نیم دیگر پرداخت - حدود 470 دلار در ماه - برای دستیابی به PSLF دارد. کنیریم گفت: «اگر مجبور باشم این"}, {"source": "Business Insider", "title": "A bottle of whiskey just sold for $2.8 million. Here's what luxury market pros say drives sky-high booze prices.", "link": "https://www.businessinsider.com/whiskey-bottle-sale-record-price-luxury-alternative-assets-scotch-2026-10", "summary": "Sotheby s global head of spirits, Jonny Fowle, poses with a bottle of Macallan 1926 Adami, in 2023. credit should read Wiktor Szymanowicz/Future Publishing via Getty Images A Sotheby's auction drew $2.8 million for a bottle of Macallan whiskey this month. It's a staggering sum, bolstered by its origins from a prized 1928 cask. Luxury market experts unpacked the economics of the market for high-priced alcohol. The market for high-end booze is giving new meaning to the term \"liquid assets.\" Niche investments like fine art, whiskey, and wine have always enjoyed a modicum of popularity among investors as alternative assets. But a Sotheby's auction this month that saw a bottle of Macallan whiskey go for $2.8 million begs the question: what can possibly drive such a high price for a bottle of booze? Whiskey is a different animal than wine, largely because the liquor ages in a barrel , while wine ages in the bottle. This is an important distinction in this case, as the enormous sum paid for the bottle at auction comes from a coveted cask filled in 1926 and not bottled until 1986. But apart from rare casks and astoundingly old liquor, there are other economic drivers that influence prices collectors are willing to pay. \"The factor that determines the value of an investment Scotch bottle is of course supply and demand,\" Jeremy Kasler, the CEO of whiskey cask investment firm CaskX, told Business Insider. \"But it's different from a normal supply and demand situation, where you can produce something and then you produce more if you need to, and less if there's too much around.\" The bottle Sotheby's sold is a Scotch whiskey, but Marlon Tulaszewski, a former Sotheby's whiskey specialist turned private client manager at Campari Group, says buyers are demonstrating a surging interest in American whiskey investments as well. \"The category offers accessible entry points across a wide range of prices, opening collecting to a broad and incredibly passionate audience,\" he stated. \"Its appeal encompasses the liquid, the history of the distilleries and the people behind them.\" Kasler, who has worked in both wine and luxury art, described whiskey as an \"alternative alternative\" market. It's a niche but increasingly popular investment theme in recent years, as more people seek out alternatives to traditional markets like stocks and bonds. That's been evidenced by the growing number of app-based platforms that offer everyday investors exposure to portfolios of everything from art t", "date_str": "2026-10-18T09:50:01+00:00", "hash": "2e8c62a11b4c9b80", "title_fa": "یک بطری ویسکی به قیمت 2.8 میلیون دلار فروخته شد. در اینجا چیزی است که طرفداران بازار لوکس می گویند که باعث افزایش قیمت مشروبات الکلی می شود.", "summary_fa": "جانی فاول، رئیس جهانی ارواح Sotheby، با یک بطری Macallan 1926 Adami، در سال 2023 ژست می گیرد. اعتبار باید Wiktor Szymanowicz را بخوانید/ انتشارات آینده از طریق Getty Images حراج ساتبی 2.8 میلیون دلار برای یک بطری ماکالان ویسکی در این ماه به دست آورد. این مبلغ سرسام‌آوری است که منشأ آن را از یک چلیک باارزش 1928 تقویت می‌کند. کارشناسان بازار لوکس شرایط اقتصادی بازار را برای الکل گران قیمت آشکار کردند. بازار مشروبات الکلی گران‌قیمت معنای جدیدی به اصطلاح «دارایی‌های نقدی» می‌دهد. سرمایه‌گذاری‌های خاص مانند هنرهای زیبا، ویسکی و شراب همیشه از محبوبیت کمی در میان سرمایه‌گذاران به عنوان دارایی‌های جایگزین برخوردار بوده‌اند. اما حراج ساتبی در این ماه که شاهد آن بود که یک بطری ویسکی ماکالان به قیمت 2.8 میلیون دلار فروخته شد، این سوال را مطرح می کند: چه چیزی می تواند چنین قیمت بالایی را برای یک بطری مشروب الکلی ایجاد کند؟ ویسکی حیوانی متفاوت از شراب است، عمدتاً به این دلیل که مشروب در یک بشکه کهنه می شود، در حالی که شراب در بطری پیر می شود. این یک تمایز مهم در این مورد است، زیرا مبلغ هنگفتی که برای بطری در حراج پرداخت می‌شود، از یک کالسکه پر شده است که در سال 1926 پر شده بود و تا سال 1986 بطری نشده بود. اما جدا از چلیک‌های کمیاب و مشروب حیرت‌انگیز قدیمی، محرک‌های اقتصادی دیگری نیز وجود دارند که بر قیمت‌هایی که کلکسیونرها مایل به پرداخت هستند تأثیر می‌گذارند. جرمی کاسلر، مدیر عامل شرکت سرمایه گذاری CaskX در زمینه ویسکی، به Business Insider گفت: «عاملی که ارزش یک بطری اسکاچ سرمایه گذاری را تعیین می کند، البته عرضه و تقاضا است. اما این با وضعیت عرضه و تقاضای معمولی متفاوت است، جایی که شما می‌توانید چیزی تولید کنید و سپس در صورت نیاز بیشتر تولید کنید، و اگر مقدار"}, {"source": "Business Insider", "title": "I’m the CEO of Torani, and we've never done layoffs. I believe they're a choice.", "link": "https://www.businessinsider.com/torani-ceo-says-layoffs-are-a-choice-2026-10", "summary": "Torani CEO Melanie Dulbecco has been in the role for 35 years. Torani Melanie Dulbecco has been CEO of the syrup company Torani for 35 years. Dulbecco said layoffs are a choice, and that Torani's decision not to do them has helped with retention. She said that the company is hiring fewer people than it would be if Torani didn't use automation. This as-told-to essay is based on a conversation with Melanie Dulbecco, the CEO of syrup brand Torani. She's based in San Leandro, California, where the company is headquartered. This story has been edited for length and clarity. I may sound different than most CEOs. I grew up in a blue-collar neighborhood, and my parents divorced when I was really young. When I was little, I saw my mom struggle so much, and I noticed that some kids around me didn't have the same opportunities. I felt this sense of inequity, and that became a motivating and driving force for me. I tried working in politics, then nonprofits, and eventually went into business. I wanted to build an opportunity company. When I met the family from Torani, they liked that idea. I was the ninth hire at Torani in 1991 and became the first CEO in 1995. We now have over 500 employees. When I started, we made $700,000 a year in annual revenue. We've grown 20% a year on average, and this year, we plan to hit over $800 million in revenue. But to us, growth is not a financial endeavor. The trailing indicator of success may be the financials, but we think our work together creates the momentum and value in the marketplace that drives our growth. It's very easy for us to say layoffs are not our approach . I think layoffs are a choice. I get it if a company is going through bankruptcy and has to make extremely challenging choices. Otherwise, I think it's a financial exercise that doesn't consider how you're going to be resilient or regain momentum — because you do that with a team. Our workers aren't concerned about being replaced by AI Torani is currently hiring fewer people than it would be if the company didn't use automation. We use automation to deprioritize manual, rote jobs with limited career mobility. We also use AI for consumer and market research, sales forecasting, and demand planning. However, our team doesn't get worried about things like AI because they trust that we will both automate and elevate the work, that we will never do anything that squashes opportunities for people, and that we are looking out for everybody's success. We're often in hyper-gr", "date_str": "2026-10-18T09:47:01+00:00", "hash": "a56d950f376f5ab3", "title_fa": "من مدیرعامل تورانی هستم و هرگز اخراج نکردیم. من معتقدم آنها یک انتخاب هستند.", "summary_fa": "ملانی دولبکو، مدیرعامل تورانی، 35 سال است که در این نقش حضور داشته است. تورانی ملانی دولبکو به مدت 35 سال مدیرعامل شرکت شربت سازی تورانی بوده است. دولبکو گفت که اخراج یک انتخاب است و تصمیم تورانی برای انجام ندادن آنها به حفظ آنها کمک کرده است. او گفت که این شرکت نسبت به زمانی که تورانی از اتوماسیون استفاده نمی کرد، افراد کمتری را استخدام می کند. این مقاله گفته شده بر اساس گفتگو با ملانی دولبکو، مدیر عامل برند شربت تورانی است. او در San Leandro، کالیفرنیا، جایی که دفتر مرکزی شرکت است، مستقر است. این داستان برای طولانی بودن و وضوح ویرایش شده است. ممکن است صدای من با اکثر مدیران عامل متفاوت باشد. من در یک محله یقه آبی بزرگ شدم و پدر و مادرم وقتی واقعاً جوان بودم طلاق گرفتند. وقتی کوچک بودم، دیدم که مادرم آنقدر تقلا می‌کند و متوجه شدم که برخی از بچه‌های اطرافم فرصت‌های مشابهی ندارند. من این احساس بی عدالتی را احساس کردم و این برای من انگیزه و نیروی محرکه شد. من سعی کردم در سیاست و سپس غیرانتفاعی کار کنم و در نهایت وارد تجارت شدم. من می خواستم یک شرکت فرصت بسازم. وقتی با خانواده تورانی آشنا شدم، از این ایده خوششان آمد. من در سال 1991 نهمین استخدام در تورانی بودم و در سال 1995 اولین مدیرعامل شدم. اکنون بیش از 500 کارمند داریم. وقتی شروع کردم، سالانه ۷۰۰ هزار دلار درآمد داشتیم. ما به طور متوسط ​​سالانه 20 درصد رشد داشته ایم و امسال قصد داریم به بیش از 800 میلیون دلار درآمد برسیم. اما برای ما رشد یک تلاش مالی نیست. شاخص بعدی موفقیت ممکن است وضعیت مالی باشد، اما ما فکر می کنیم که کار ما با هم باعث ایجاد حرکت و ارزش در بازار می شود که باعث رشد ما می"}, {"source": "Business Insider", "title": "My Costco price tracker is pretty stable, but big increases hit oil and protein", "link": "https://www.businessinsider.com/costco-price-tracker-mostly-steady-with-hikes-on-oil-protein-2026-10", "summary": "Prices have held steady at Costco in spite of a turbulent year — but cracks are starting to show. Gary Hershorn/Getty Images Business Insider has been tracking 45 items at Costco to see how energy costs affect retail prices. President Trump's conflict with Iran has disrupted oil and transportation markets around the world. Most products have had minimal price changes, but some like motor oil and whey protein are way up. Like the proverbial pot that's been watched but won't boil, the Costco prices I've tracked this year have remained remarkably calm amid an economy full of heat. A basket of 45 items I'm following rose 3% since July, but that change is largely attributable to the recent surge in motor oil prices. Overall, the numbers I see on my local warehouse shelves tell a very different story than what I would expect after following the tumultuous news from around the world. Costco prides itself on keeping shelf prices in its warehouses close to wholesale prices for its members, which makes it a useful early read on supply-cost pressures. It's hardly a national price index, but it does reveal how global economic forces are showing up in an ordinary US community like Madison, Wisconsin. My data show that grocery and merchandise prices remain steady, with small hikes and discounts mostly balancing out in the total basket. Meanwhile, some items like motor ین تغییر تا حد زیادی به افزایش اخیر قیمت روغن موتور مربوط می شود. به طور کلی، اعدادی که در قفسه‌های انبار محلی‌ام می‌بینم، داستان بسیار متفاوتی با آنچه که پس از دنبال کردن اخبار پر سر و صدا از سراسر جهان انتظار داشتم، بیان می‌کنند. Costco به خود می بالد که قیمت های قفسه ای را در انبارهای خود نزدیک به قیمت های عمده فروشی برای اعضای خود نگه می دارد، که آن را به یک مطالعه اولیه مفید در مورد فشار عرضه و هزینه تبدیل می کند. این به سختی یک شاخص قیمت ملی است، اما نشان می دهد که چگونه نیروهای اقتصادی جهانی در یک جامعه معمولی ایالات متحده مانند مدیسون، ویسکانسین ظاهر می شوند. داده‌های من نشان می‌دهد که قیمت‌های خواربار و کالاها ثابت می‌مانند و افزایش‌ها و تخفیف‌های کوچک عمدتاً در سبد کل متعادل می‌شوند. در همین حال، برخی از اقلام مانند روغن موتور، پودر پروتئین، و فویل آلومینیوم شروع به نشان دادن نشانه‌هایی از فشار از سوی بازارهای کالای مربوطه خود"}, {"source": "Business Insider", "title": "Here's the playbook for investors as new fears rattle the AI trade", "link": "https://www.businessinsider.com/ai-stocks-where-to-invest-coreweave-neocloud-interest-rates-capex-2026-10", "summary": "NYSE AI-related stocks have faced a downturn thanks in part to rising borrowing costs. Experts like James Russo and Ross Mayfield suggest taking steps to protect portfolios. Travis Prentice recommends pivoting to AI adopters like Visa and MetLife. It was a brutal start to October for the AI trade . Here's a rundown of how some pockets of the high-flying tech sector have fared this month: Neocloud firms, which are at the heart of the data center buildout, have tanked, with the Roundhill Neocloud ETF (NCLD) down 31%. CoreWeave shares plunged this week on fears about its debt. Chip stocks have been hammered. The iShares Semiconductor ETF (SOXX) has fallen 13%. The Defiance AI and Power Infrastructure ETF (AIPO), which holds power and energy stocks crucial for data centers, is down 14%. A main driver of the recent sell-off is rising borrowing costs, as investors have grown wary of the leverage that neocloud companies have amassed . Meanwhile, a pair of hot inflation readings this week have added to macro fears as bond yields continue to hover near the highest levels in two decades. Higher interest rates make borrowing more expensive for companies building AI infrastructure, and higher debt costs are recalibrating the risk-reward profile at a moment when investors are already on edge about returns on capex spending. Fears of overbuilding and a glut of compute are also weighing on sentiment, and a major slowdown in AI spending would change the entire ecosystem that the AI trade has thrived in since the start of the boom in 2022. So where should investors go from here? We asked three market pros last week how they're viewing the volatility, and where they'd be putting their money now. Ross Mayfield, a strategist and VP, Baird Mayfield said he's overweighting three sectors that act as a hedge against the AI trade amid high concentration in AI-related stocks. They include healthcare, financials, and energy. Healthcare is defensive, he said, while financials are tied to the health of the overall economy, behaving cyclically. Both industries, however, stand to see their profit margins grow thanks to AI technology, allowing investors to play both sides of the trade, Mayfield said. Energy, meanwhile, is a direct way to benefit from oil price spikes, which have become more common amid rising geopolitical tensions, he said. Rising oil prices have fueled inflation worries and helped to push up interest rates, weighing on growth stocks. While Mayfield is overweight AI hedg", "date_str": "2026-10-18T09:15:01+00:00", "hash": "19af708ba275752c", "title_fa": "در اینجا کتاب بازی برای سرمایه گذاران است زیرا ترس های جدید تجارت هوش مصنوعی را به هم می زند", "summary_fa": "سهام مرتبط با هوش مصنوعی نیویورک تا حدی به دلیل افزایش هزینه های استقراض با رکود مواجه شده اند. کارشناسانی مانند جیمز روسو و راس می‌فیلد پیشنهاد می‌کنند اقداماتی را برای محافظت از پورتفولیوها انجام دهند. تراویس پرن nversation with Matthew Guerrero, a 41-year-old Uber driver in Southern California. It has been edited for length and clarity. I worked as a firefighter for about four years before I got injured on the job. I've been seeking a workers' comp settlement that should be settled soon. In the meantime, my lawyer said that I could start working again. I needed a job really quickly, especially with three kids, so I started driving with Uber. I've been driving with Uber for about five weeks. So far, it hasn't been very successful. For example, one week, I made $600 working 30 hours. To make that, I spent about $300 in gas driving my SUV. Then, I have to put between 20% and 30% of what's left aside for taxes. That comes out to about $210 for 30 hours of work. That doesn't even include wear and tear on my car. I don't understand how anybody can do this long-term. It's not sustainable. The pay is better if you drive in Los Angeles or San Diego. But I'm in Riverside County, and the pay seems to be lower here. To get better-paying rides, you have to be strategic. Sometimes, I try to get a ride with a passenger who's headed to an airport in one of the big cities. Then, I stay there all day and take rides. That's not always feasible, though. When I started with Uber, I realized that there were a lot of rides that involved taking people to morning doctor's appointments. Most of those people didn't tip well, though, and tips are key to making money. Instead, I like to work Friday and Saturday nights around bars in Temecula. I usually log on around 4 pm and head home around 3 am. The pay is good, and the tips are a lot better than other rides in my area. Sometimes you have to deal with drunk people throwing up, but it's worth it. I've given some rides to veteran Uber drivers — people who were working on the app back in 2015 and 2016. They said that they used to make better money than I do, and that they quit after they saw pay fall. That was eye-opening for me. I don't understand how 0", "summary": "Louisiana Delta Community College in Monroe has a mock data center room on campus. Business Insider Meta is building its largest-ever data center in northeast Louisiana. A local community college is training data center technicians to work there. Data center jobs are in high demand and can pay handsomely. Thousands of construction workers are arriving in a small Louisiana community to build Meta's largest-ever data center . Less than an hour away, at the Louisiana Delta Community College's Monroe campus, the next generation of data center professionals is hoping to join their ranks. \"I see AI is really the future. We're going to need data centers to house all the data,\" Eric Crowe Jr., 27, told Business Insider. \"I feel like it will become a very lucrative job to have, and we're going to need more of them. Why not get in now before it gets oversaturated?\" Crowe Jr. is among the students who signed up for the community college's Data Center Technician program. The four-week, nearly $3,700 training course prepares students to enter the data center industry, which is rapidly expanding to support the age of AI. Construction for Meta's nearly 10-million-square-foot data center, Hyperion, is underway in rural Richland Parish, where business is now thriving as workers flood the region. Meta says the project will include over 7,500 trade workers on-site at peak construction and support 1,000 operational jobs once completed. For residents living in the region, where there's no state minimum wage law and agriculture is a major industry, the new opportunity to make good money in a growing sector is too enticing to ignore. \"This is a stepping stone into the real world,\" Dan McCarty, director of Workforce Trades at Louisiana Delta Community College, said. \"We prepare you with a résumé. We work on every aspect of employability, safety, and technical skills.\" The inaugural class graduated in March, and all 11 students received job offers from IES Communications, which employs people working on Meta's project. McCarty said the program, which is available at the Winnsboro campus, now produces about 24 graduates a month. \"In the past, a lot of people, including myself, had to leave here to find the good jobs,\" McCarty said. \"Now they're 30 minutes down the road.\" 'It's a no-brainer' Louisiana Delta Community College s program lasts four weeks. Business Insider The Data Center Technician program teaches students everything from operating equipment to workplace safety. They'l", "date_str": "2026-10-18T09:04:01+00:00", "hash": "9dd7760728eec57f", "title_fa": "ساکنان لوئیزیانا در حال آموزش برای شغل در بزرگترین مرکز داده هوش مصنوعی متا هستند: \"چرا اکنون وارد نمی شوید؟\"", "summary_fa": "کالج محلی لوئیزیانا دلتا در مونرو یک اتاق مرکز داده ساختگی در محوطه دانشگاه دارد. Business Insider Meta در حال ساخت بزرگترین مرکز داده خود در شمال شرقی لوئیزیانا است. یک کالج محلی در حال آموزش تکنسین های مرکز داده برای کار در آنجا است. مشاغل مرکز داده تقاضای زیادی دارند و می توانند دستمزد بالایی داشته باشند. هزاران کارگر ساختمانی در حال ورود به یک جامعه کوچک لوئیزیانا هستند تا بزرگترین مرکز داده متا را بسازند. کمتر از یک ساعت دیگر، در پردیس مونرو کالج لوئیزیانا دلتا، نسل بعدی متخصصان مرکز داده امیدوارند به صفوف آنها بپیوندند. اریک کرو جونیور 27 ساله به Business Insider گفت: \"من می بینم که هوش مصنوعی واقعا آینده است. ما به مراکز داده نیاز داریم تا همه داده ها را در خود جای دهند.\" \"من احساس می‌کنم داشتن این شغل بسیار پردرآمد خواهد بود و ما به تعداد بیشتری از آنها نیاز خواهیم داشت. کرو جونیور یکی از دانشجویانی است که برای برنامه تکنسین مرکز داده کالج محلی ثبت نام کرده است. این دوره آموزشی چهار هفته‌ای، نزدیک به 3700 دلار، دانش‌آموزان را برای ورود به صنعت مراکز داده آماده می‌کند که به سرعت در حال گسترش برای حمایت از عصر هوش مصنوعی است. ساخت و ساز مرکز داده متا با مساحت تقریباً 10 میلیون فوت مربع، Hyperion، در روستایی ریچلند پریش در حال انجام است، جایی که اکنون کسب و کار در حال رونق است زیرا کارگران در منطقه هجوم آورده اند. متا می گوید که این پروژه شامل بیش از 7500 کارگر تجاری در محل در اوج ساخت و ساز خواهد بود و پس از تکمیل از 1000 شغل عملیاتی پشتیبانی می کند. برای ساکنانی که در منطقه زندگی می کنند، جایی که هیچ قانون حداقل دستمزد ایالتی وجود ندارد و کشاورزی یک صنعت بزرگ است، فرصت جدید برای کسب درآمد"}, {"source": "Business Insider", "title": "I've used credit card rewards to pay for vacations for 2 decades. Here are 3 tips to make the most of your points.", "link": "https://www.businessinsider.com/credit-card-airline-points-maximizing-strategies-travel-book-flights-hotels-2026-10", "summary": "Taryn White has used credit card points and airline miles to book vacations for herself and her family for over two decades. Courtesy of Taryn White/The Trip Wish List Taryn White is a freelance travel writer and the founder of travel and lifestyle brand The Trip Wish List. She's used points to book trips to places like Puerto Rico, Bali, Sydney, Prague, and Johannesburg. She shares her strategies for booking with points, including positioning flights and comparing options. I've been collecting airline miles and credit card points for more than two decades, long before the influx of social media posts promising things like a \"free\" business-class seat to Europe. Over the years, I've redeemed points for everything from weekend getaways to Puerto Rico to long-haul international flights to Bali that would have otherwise cost thousands of dollars. Looking back, I realized that earning points is actually the easy part. The real challenge is knowing how to use them well, and I haven't always been strategic about it. Here are the three key strategies I've learned that I use to travel the world for less. 1. Build a flexible points ecosystem Don't put all your eggs in one basket when it comes to miles and points. One of the most important strategies in maximizing travel rewards is to build a flexible \"points ecosystem\" rather than relying on a single airline, hotel program, or credit card. My current points ecosystem includes two American Express cards, one Chase card, and one Capital One credit card; co-branded airline and hotel cards for United, Delta, and Marriott; and memberships in dozens of airline, hotel, and rental-car loyalty programs. Most of my travel credit cards have annual fees, ranging from $150 for my Delta SkyMiles Gold card to $895 for my American Express Business Platinum card. When the value I receive from the benefits — annual travel or hotel credits, free-night certificates, airport lounge access , checked-bag benefits, elite-status perks, and travel protections — exceeds the annual fee, the card earns a place in my points ecosystem. The writer in Kuala Lumpur in 2019 Courtesy of Taryn White/The Trip Wish List 2. Learn airline and alliance sweet spots One of the biggest misconceptions about airline miles is that you should use the airline's own miles to book its flights. That's often not true; the exact same seat could actually cost fewer points through another loyalty program. Many airlines belong to the three major airline alliances — Star A", "date_str": "2026-10-18T09:00:01+00:00", "hash": "d433121f149f8df3", "title_fa": "من از پاداش کارت اعتباری برای پرداخت هزینه های تعطیلات برای 2 دهه استفاده کرده ام. در اینجا 3 نکته برای استفاده حداکثری از امتیازات ارائه شده است.", "summary_fa": "تارین وایت بیش از دو دهه است که از امتیاز کارت اعتباری و مایل های خطوط هوایی برای رزرو تعطیلات برای خود و خانواده اش استفاده کرده است. با حسن نیت از تارین وایت/ فهرست آرزوهای سفر تارین وایت یک سفرنامه نویس آزاد و بنیانگذار نام تجاری سفر و سبک زندگی The Trip Wish List است. او از امتیاز برای رزرو سفر به مکان‌هایی مانند پورتوریکو، بالی، سیدنی، پراگ و ژوهانسبورگ استفاده می‌کند. او استراتژی‌های خود را برای رزرو با امتیاز به اشتراک می‌گذارد، از جمله موقعیت‌یابی پروازها و مقایسه گزینه‌ها. من بیش از دو دهه است که مایل‌های خطوط هوایی و امتیاز کارت اعتباری را جمع‌آوری می‌کنم، مدت‌ها قبل از هجوم پست‌های رسانه‌های اجتماعی که نویدبخش چیزهایی مانند یک صندلی کلاس تجاری «رایگان» به اروپا هستند. در طول سال‌ها، برای همه چیز از تعطیلات آخر هفته به پورتوریکو گرفته تا پروازهای بین‌المللی طولانی مدت به بالی که در غیر این صورت هزاران دلار هزینه داشتند، امتیاز دریافت کرده‌ام. با نگاهی به گذشته، متوجه شدم که کسب امتیاز در واقع بخش آسان است. چالش واقعی این است که بدانیم چگونه از آنها به خوبی استفاده کنیم، و من همیشه در مورد آن استراتژیک نبوده ام. در اینجا سه ​​استراتژی کلیدی است که من یاد گرفته ام و از آنها برای سفر کمتر به دنیا استفاده می کنم. 1. یک اکوسیستم امتیازی انعطاف پذیر بسازید وقتی صحبت از مایل ها و امتیازها می شود، همه تخم های خود را در یک سبد قرار ندهید. یکی از مهم‌ترین استراتژی‌ها در به حداکثر رساندن پاداش‌های سفر، ایجاد یک «اکوسیستم امتیاز» انعطاف‌پذیر به جای تکیه بر یک خط هوایی، برنامه هتل یا کارت اعتباری است. اکوسیستم امتیاز فعلی من شامل دو کارت امریکن اکسپرس، یک کارت چیس و یک کارت اعتباری Capital One است. کارت های هواپیمایی و هتل های مشترک برای یونایتد، دلتا"}, {"source": "Business Insider", "title": "Mamdani on the move: Why the mayor's busy schedule is his secret leadership weapon", "link": "https://www.businessinsider.com/zohran-mamdani-nyc-mayor-schedule-public-calendar-leadership-style-2026-10", "summary": "@nycmayor Zohran Mamdani has places to be. At 35, the mayor of New York City knows how to catch — and keep — people's attention. It's tempting to think the key to Mamdani's success is Instagram, but the secret sauce of his leadership isn't just a social media machine. It's a man criss-crossing the five boroughs with a portable podium and the occasional sugar-free Red Bull. To better understand how his in-person ubiquity shapes public perception, Business Insider spent the summer tracking the mayor's daily schedule. From May 1 to August 31, Mamdani had 249 listed appointments, 170 of which were held in public. Eighty-one of these were in community spaces such as classrooms, libraries, parks, apartment buildings, tennis courts, places of worship, and restaurants. Another 50 were government events at emergency preparedness centers and police precincts. With the exception of Staten Island — which Mamdani visited three times — his appearances dotted the city. He spent the most time in Manhattan with 85 events, followed by Brooklyn (35), the Bronx (26), and Queens (21). He made few appearances in City Council chambers and other traditional political arenas. At the mayor's home, Gracie Mansion, there were no press conferences. Instead, Mamdani hosted 10 cultural receptions, pickup soccer games, and religious celebrations. At a time when C-suite bigwigs are delivering bad news via canned memo, and politicians are mediating their message through glossy election mailers, dozens of political analysts, media strategists, historians, and people in the mayor's orbit say that Mamdani's man-about-town style stands out. What makes Mamdani a lesson in charisma is his ability to combine four important factors: physical presence, personal authenticity, political messaging, and active participation, a review of his nearly first year shows. He's able to be in on the joke — poking fun at his omnipresent suit by jumping into a pool, tie and all — while still getting his message across. They're a regular part of his schedule, rather than a surprise one-off that feels like it was cooked up by a communications staffer. It's not an easy balance to strike, but the mayor's in-person events lay out a road map for other leaders . Showing up doesn't solve all problems, and nine months into his tenure, the mayor has met his fair share of critics. Glad-handing with a few CEOs and small business owners doesn't replace the need to attract investment from blue-chip companies and buzzy startups", "date_str": "2026-10-18T08:46:01+00:00", "hash": "a9c548aa7a2e5c2d", "title_fa": "ممدانی در حرکت: چرا مشغله های شهردار سلاح مخفی رهبری اوست؟", "summary_fa": "@nycmayor زهران ممدانی جاهایی برای بودن دارد. در 35 سالگی، شهردار نیویورک سیتی می داند که چگونه توجه مردم را جلب کند - و آن را حفظ کند. وسوسه انگیز است که فکر کنیم رمز موفقیت ممدانی اینستاگرام است، اما سس مخفی رهبری او فقط یک ماشین رسانه اجتماعی نیست. این مردی است که با یک سکوی قابل حمل و گهگاه ردبول بدون شکر از پنج منطقه عبور می کند. برای درک بهتر اینکه چگونه حضور حضوری او در همه جا، ادراک عمومی را شکل می دهد، Business Insider تابستان را صرف پیگیری برنامه روزانه شهردار کرد. ممدانی از اول اردیبهشت تا 31 مرداد 249 نوبت ثبت شده داشت که 170 مورد آن به صورت علنی برگزار شد. هشتاد و یک مورد از آنها در فضاهای اجتماعی مانند کلاس های درس، کتابخانه ها، پارک ها، ساختمان های آپارتمانی، زمین تنیس، عبادتگاه ها و رستوران ها بود. 50 مورد دیگر نیز رویدادهای دولتی در مراکز آمادگی اضطراری و مراکز پلیس بودند. به استثنای استاتن آیلند - که ممدانی سه بار از آن بازدید کرد - ظاهر او در شهر پراکنده بود. او با 85 رویداد بیشترین زمان را در منهتن گذراند و پس از آن بروکلین (35)، برانکس (26) و کوئینز (21) قرار گرفتند. او در اتاق های شورای شهر و دیگر عرصه های سیاسی سنتی حضور چندانی نداشت. در خانه شهردار، عمارت گریسی، هیچ کنفرانس مطبوعاتی برگزار نشد. در عوض، ممدانی میزبان 10 پذیرایی فرهنگی، بازی های فوتبال وانت و جشن های مذهبی بود. در زمانی که بزرگان سوئیت سی خبرهای بد را از طریق یادداشت‌های کنسرو شده ارائه می‌کنند و سیاستمداران پیام خود را از طریق پست‌های انتخاباتی براق رسانه‌ای می‌کنند، ده‌ها تحلیلگر سیاسی، استراتژیست‌های رسانه‌ای، تاریخ‌دانان و افرادی در مدار شهردار می‌گویند که سبک مرد-درباره شهر ممدانی برجسته است. آنچه که ممدانی را به درس کاریزما تبدیل می‌کند،"}, {"source": "Business Insider", "title": "A processed-foods researcher and mom of 2 says there are 2 additives on labels she avoids at all costs", "link": "https://www.businessinsider.com/additives-ultra-processed-foods-researcher-upf-mom-wont-buy-2026-10", "summary": "Elizabeth Dunford studies food additives and their impact on health. Elizabeth Dunford/ Getty Images Ultra-processed foods are everywhere, but some additives are worse than others. Elizabeth Dunford is a nutrition epidemiologist who studies additives and health issues. She avoids two types of additives when she sees them on a food label. Elizabeth Dunford isn't trying to make grocery shopping an impossible task. Dunford is a nutrition epidemiologist who studies additives in ultra-processed foods and their impact on health. It's not realistic to avoid packaged foods altogether, Dunford, who is based at the University of North Carolina at Chapel Hill, told Business Insider. They make up around 70% of the US food supply. So, she focuses on buying foods for her family that have a low \"additive load\" overall. \"I try and avoid things in general that have a lot of additives, but you can't avoid everything,\" said Dunford, who is a mom of two. \"If you pick it up, you turn it over, and you don't recognize half the ingredients, it's probably not a good choice,\" she said. She has taught her kids that eating enough vegetables , protein, and calcium will \"keep their brains and bodies healthy,\" and that there's a time and a place for treats, but it's not good to have too many. \"It is the everyday food and drink choices that really matter to me,\" Dunford said. Ultra-processed foods contain ingredients you wouldn't find in a regular kitchen, like emulsifiers and thickening agents. They tend to be ultrapalatable, meaning they contain an irresistible combination of sugar, salt, and fat, and have long shelf lives. They can be anything from potato chips and soda to packaged bread and yogurt. A diet high in this type of food has been linked to a higher risk of chronic diseases , including type two diabetes, cardiovascular disease, cancer, and depression. While she finds it unrealistic to cut out all additives, Dunford shared the two additives that she won't buy. Synthetic dyes Synthetic dyes are used in many different kinds of foods, not just junk food, Dunford said. markcarper/Getty Images Dunford avoids buying products that contain synthetic dyes for herself and her family. \"I will allow it at a birthday party. That's about it. Day-to-day, they're not allowed in our house,\" she said. The dyes, which are typically made from petroleum, are used to give food products colorful appearances. If you're looking out for them on a label, scan for a color and a number. Dunford said that", "date_str": "2026-10-18T08:37:01+00:00", "hash": "f80950f5497ed3a2", "title_fa": "یک محقق مواد غذایی فرآوری شده و مادر 2 فرزند می گوید 2 ماده افزودنی روی برچسب وجود دارد که او به هر قیمتی از آن اجتناب می کند.", "summary_fa": "الیزابت دانفورد مواد افزودنی غذایی و تاثیر آنها بر سلامت را مطالعه می کند. الیزابت دانفورد/ گتی ایماژ غذاهای فوق فرآوری شده همه جا هستند، اما برخی از افزودنی ها بدتر از بقیه هستند. الیزابت دانفورد یک اپیدمیولوژیست تغذیه است که به مطالعه مواد افزودنی و مسائل بهداشتی می پردازد. او وقتی دو نوع افزودنی را روی برچسب مواد غذایی می بیند اجتناب می کند. الیزابت دانفورد سعی نمی کند خرید مواد غذایی را به یک کار غیرممکن تبدیل کند. دانفورد یک اپیدمیولوژیست تغذیه است که مواد افزودنی موجود در غذاهای فوق فرآوری شده و تأثیر آنها بر سلامت را مطالعه می کند. دانفورد که مستقر در دانشگاه کارولینای شمالی در چپل هیل است، به Business Insider گفت که اجتناب از غذاهای بسته بندی شده به طور کامل واقع بینانه نیست. آنها حدود 70 درصد از عرضه غذای ایالات متحده را تشکیل می دهند. بنابراین، او روی خرید غذاهایی برای خانواده‌اش تمرکز می‌کند که در کل «بار افزودنی» پایینی دارند. دانفورد که مادر دو فرزند است، می‌گوید: «من سعی می‌کنم به طور کلی از چیزهایی که دارای مواد افزودنی زیادی هستند اجتناب کنم، اما شما نمی‌توانید از همه چیز اجتناب کنید. او گفت: \"اگر آن را بردارید، آن را برگردانید و نیمی از مواد تشکیل دهنده را تشخیص دهید، احتمالاً انتخاب خوبی نیست.\" او به فرزندان خود یاد داده است که خوردن سبزیجات، پروتئین و کلسیم کافی \"مغز و بدن آنها را سالم نگه می دارد\" و اینکه زمان و مکانی برای خوردن غذا وجود دارد، اما زیاد بودن آن خوب نیست. دانفورد گفت: «این انتخاب‌های روزانه غذا و نوشیدنی است که واقعاً برای من مهم است. غذاهای فوق فرآوری شده حاوی موادی هستند که در آشپزخانه های معمولی نمی توانید پیدا کنید، مانند امولسیفایرها و مواد غلیظ کننده. آنها بسیار خوش طعم هستند، به این معنی که حاوی ترکیب"}, {"source": "Business Insider", "title": oyed my business. They've smashed my shop windows. They're taking pieces of glass to throw at the riot police. They're giving us the finger. They're telling us they're going to slit our throats. It's just the apocalypse.\" Other French cities also saw looting and damage to businesses Rioters set cars on fire at the Canal Saint Martin during severe unrest on October 17, 2026 in Paris, France. Remon Haazen/Getty Images The AFP reported that looting took place in several French cities, including Marseille, Nice, Nantes, Bordeaux, Limoges, Lille, Toulouse and Strasbourg, where supermarkets, pharmacies, luxury boutiques, and electronics stores were raided and vandalized. Luxury goods looted Mask protesters f", "date_str": "2026-10-18T03:54:01+00:00", "hash": "5fdbec2fec549276", "title_fa": "فرانسه با حمله غارتگران به فروشگاه های لوکس، مواد غذایی و داروخانه ها شعله ور است", "summary_fa": "معترضان یک فروشگاه خرده فروشی را در جریان تظاهراتی در نزدیکی میدان جمهوری پاریس تخریب کردند. کارل کورت/ گتی ایماژ شکستن ویترین مغازه ها و اتومبیل ها در آتش - این همان چیزی است که وقتی اعتراضات روز شنبه در پاریس شروع شد. هرج و مرج روز شنبه تشدید خشونت پس از هفته ها تظاهرات در کشور بود. دانشجویان و کارگران در اعتراض به هزینه های زندگی به خیابان ها آمده اند. مجموعه ای از اعتراضات در مورد هزینه های زندگی روز شنبه به هرج و مرج و خشونت در سراسر فرانسه تبدیل شد. تلفن های همراه و کالاهای لوکس غارت شدند در حالی که اعتراضات فرانسه به خشونت تبدیل شد غارتگران یک فروشگاه تلفن همراه SFR را در جریان اعتراضات در 17 اکتبر غارت کردند. اوباش به یک فروشگاه تلفن همراه SFR و سایر مراکز فروش کالاها و لباس های لوکس حمله کردند. فروشگاه های زنجیره ای مواد غذایی غارت شد، همچنین یک فروشگاه فرانپریکس غارت شد. جودی هامانی / هانس لوکاس / خبرگزاری فرانسه از طریق گتی ایماژ فرانپریکس، مونوپریکس، پیکارد، و کارفور سیتی از جمله خرده فروشان مواد غذایی بودند که در پاریس غارت شدند. به گزارش خبرگزاری فرانسه، در منطقه یازدهم، غارتگرانی دیده شدند که یک فرانپریکس پر از کیسه های آب میوه، الکل و کیک را ترک می کردند. مغازه های آخرالزمان در میدان د لا رپوبلیک پاریس غارت و به آتش کشیده شد. Lucy North/PA Images از طریق Getty Images مغازه دار فروشگاهی در نزدیکی میدان جمهوری به نام سدریک به RTL، یک شبکه رادیویی در فرانسه، گفت که در تلاش برای محافظت از کالاهایش، خود را در داخل کسب و کارش سنگر کرده است. او به RTL گفت: «آنها همه چیز را در اطراف ما در هم می ریزند. \"آنها کسب و کار من را نابود کرده اند. آنها ویترین مغازه ام را"}, {"source": "Business Insider", "title": "There was 'no sex' at this reality-show-style incubator for founders — but the drama was juicy", "link": "https://www.businessinsider.com/startup-founder-reality-show-incubator-stan-social-media-2026-10", "summary": "Founder teams anxiously wait for the leaderboard to update at 9 a.m. at a reality-style incubator in rural Pennsylvania. Truman Dickerson There was only one thing on the minds of the founders at this reality-show-style startup incubator. It wasn't sex. Founder teams had two weeks to become profitable, and potent social media was paramount. At 9 p.m. on a recent Friday night, Max Harding had just returned from a barefoot run in the woods. The eccentric 20-year-old Californian was back in a large barn in rural Pennsylvania — still barefoot — alternatively working on his startup and asking me about the point of life. Though not an especially adept programmer, Harding possesses a more adroit, perhaps unteachable skill that has never been more valuable in the current landscape of founder culture . \"Max captures the attention of the camera, keeps us center stage,\" said his cofounder, Skyler Ji, who added that Harding's role includes \"spreading our philosophy\" while he runs the operation behind the scenes. \"Max brings some of the grander things,\" Ji told me. The pair's startup, Hivemind Research, aims to build \"digital brains\" in the form of social media. Harding and Ji were among 66 mostly young, mostly imaginative startup founders taking part in a two-week \"incubator\" workshop called Launchpad. The novel event was hosted by Stan, the company behind a moderately successful platform for independent creators to advertise and sell their services. At the last meetup Stan organized, startup founders jet-skied the East River at golden hour. At the incubator event, the entirety of which was filmed for use in a reality show that Stan plans to release sometime soon (though it is uploading Instagram clips daily), magnetic personalities were among the most valuable commodities. Max Harding (left) with his startup team at the launchpad event. Max Harding Stan cofounder Vitalii Dodonov told me that the 30 participating teams were chosen from a pool of 700 applicants, primarily for their existing social media followings and their ability to grow them . \"It's not the building that gets you to revenue, it's the distribution,\" he said of today's startup culture. Of the many metrics competing teams were required to meet daily (10 sales calls, for example), social media videos were among the most heavily weighted. Everywhere I looked, people were talking about their companies into phones attached to tripods. Their products ran the gamut of usefulness — ranging from an AI facial sc", "date_str": "2026-10-18T02:04:45+00:00", "hash": "f1b02c0de997ebd4", "title_fa": "در این انکوباتور به سبک واقعیت‌شو برای بنیان‌گذاران «هیچ رابطه جنسی» وجود نداشت - اما درام شاداب بود", "summary_fa": "تیم‌های بنیان‌گذار مشتاقانه منتظر به‌روزرسانی جدول امتیازات در ساعت 9 صبح در یک انکوباتور به سبک واقعیت در روستایی پنسیلوانیا هستند. ترومن دیکرسون تنها یک چیز در ذهن بنیانگذاران این انکوباتور استارت آپی به سبک واقعیت نمایش وجود داشت. سکس نبود تیم‌های بنیان‌گذار دو هفته فرصت داشتند تا سودآور شوند و رسانه‌های اجتماعی قدرتمند از اهمیت بالایی برخوردار بودند. ساعت 9 شب در یک جمعه شب اخیر، مکس هاردینگ به تازگی از دویدن با پای برهنه در جنگل بازگشته بود. این جوان عجیب و غریب 20 ساله کالیفرنیایی به انباری بزرگ در روستایی پنسیلوانیا بازگشته بود - هنوز پابرهنه - در عوض روی استارتاپ خود کار می کرد و از من در مورد هدف زندگی می پرسید. اگر  meantime, they've been populating not only their Instagrams, but also a sprawling visual diary on their joint Pinterest account. It's an interesting choice, as far as K-pop goes — usually, teasers are limited to platforms like YouTube or the K-pop-centric social network, Weverse. In a written interview with Business Insider, the duo described their interest in Pinterest as a means of introducing the \"visual world,\" concept, and vibe of \"DREAMSCAPE.\" The mood boards and the buffet of photos they've posted for fans to feast on are also a \"little gift\" to their audience. \"JxJ Diary is a space we created to share the concept and vibe of the album more directly with fans before its release. We spent a lot of time thinking about what kind of content they would enjoy, and decided to launch our first-ever Pinterest channel featuring different sides of ourselves,\" the duo said. The singers said they wanted to explore the concept of \"dreams\" with the posts on their joint account. They've curated a collection of photographs and behind-the-scenes moments, including everything from candid shots to sneak peeks of their album photoshoots. \"We hope fans will take inspiration from the album's imagery and vibe, and express it in their own ways,\" they added. \"It would be really fun to see them create their own version of 'DREAMSCAPE' on Pinterest by collecting photos, experimenting with styling, and curating images that reflect their personal tastes.\" The business around the boys That invitation for fans taps into a K-pop fan economy in which an album is not only heard or watched but also worn, collected, decorated, and remade. The two Seventeen members belong to a group whose fan base collects their pho", "date_str": "2026-10-18T02:00:01+00:00", "hash": "45574a49096c967e", "title_fa": "واحد JxJ جدید و داغ Seventeen در حال نشان دادن شیمی خود هستند - با کمی کمک Pinterest", "summary_fa": "Jeonghan و Joshua از Seventeen در 19 اکتبر به عنوان یک دو نفر دبیو می کنند - و آلبوم
