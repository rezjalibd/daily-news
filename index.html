      font-weight: 700;

      text-align: justify;

    .news-source {

      display: inline-flex;

      align-items: center;

    .footer-actions-right {

      align-items: center;

      align-items: center;

      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;

      justify-content: space-between;

      font-weight: 700;

    .btn-close {

      cursor: pointer;
      line-height: 1;
      padding: 4px;

    .modal-body {

      display: flex;

    .archive-item {

    .archive-date-fa {

      font-size: 0.95rem;

    .archive-date-g {

    .archive-arrow {

    @media (max-width: 640px) {

      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

 که در صف انتظار پیوند جان خود را از دست می‌دهند، افزایش یابد.نجفی‌زاده با استناد به آمار بخش پیوند قلب بیمارستان شهید رجایی افزود سال گذشته ۱۳۰ کودک به دلیل تامین نشدن قلب پیوندی در فهرست انتظار این بیمارستان جان باختند و در همین مدت تنها ۳۰ پیوند قلب کودکان انجام شد. او همچنین از برنامه‌ریزی انجمن اهدای عضو ایرانیان و وزارت بهداشت برای اجرای یک طرح ملی با مشارکت نهادهای فرهنگ‌ساز، واحدهای پیوند و سازمان‌های مرتبط خبر داد. هدف این طرح، افزایش هماهنگی میان دستگاه‌های مسئول و استفاده مؤثرتر از اعضای قابل پیوند افراد دچار مرگ مغزی عنوان شده است.نجفی‌زاده تأکید کرد که افزایش آگاهی عمومی و فراهم کردن امکان استفاده از اعضای قابل پیوند می‌تواند به نجات جان بیمارانی کمک کند که در انتظار دریافت عضو هستند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/13941105132956646968004_eBDP__v1024x512__box_0%2C87%2C800%2C507.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۵ آبان • ۱۹:۳۹"}, {"source": "IranWire", "title": "محکومیت حمید کاظمی و حسن دیوبند، دو معترض دی‌ماه به اعدام", "link": "https://iranwire.com/fa/news-1/159898-%D9%85%D8%AD%DA%A9%D9%88%D9%85%DB%8C%D8%AA-%D8%AD%D9%85%DB%8C%D8%AF-%DA%A9%D8%A7%D8%B8%D9%85%DB%8C-%D9%88-%D8%AD%D8%B3%D9%86-%D8%AF%DB%8C%D9%88%D8%A8%D9%86%D8%AF-%D8%AF%D9%88-%D9%85%D8%B9%D8%AA%D8%B1%D8%B6-%D8%AF%DB%8C%D9%85%D8%A7%D9%87-%D8%A8%D9%87-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85/", "summary": "سازمان حقوق بشری هرانا روز جمعه ۱۵آبان۱۴۰۵ از صدور حکم اعدام برای «حمید کاظمی» و «حسن دیوبند» دو معترض بازداشت شده در اعتراضات دی‌ماه۱۴۰ ...", "date_str": "2026-11-06T16:44:30+00:00", "hash": "bafa3adbc1f89eff", "title_fa": "محکومیت حمید کاظمی و حسن دیوبند، دو معترض دی‌ماه به اعدام", "summary_fa": "سازمان حقوق بشری هرانا روز جمعه ۱۵آبان۱۴۰۵ از صدور حکم اعدام برای «حمید کاظمی» و «حسن دیوبند» دو معترض بازداشت شده در اعتراضات دی‌ماه۱۴۰ ... این دو شهروند از زمستان ۱۴۰۴ توسط ماموران امنیتی بازداشت و به ندامتگاه مرکزی کرج منتقل شده بودند. هرانا تایید کرده اسن که حکم اعدام این دو شهروند معترض از سوی شعبه دوم دادگاه انقلاب کرج، به ریاست قاضی سبزواری صادر شده است. درباره اتهامات و دلایل بازداشت، زمان دقیق و نحوه بازداشت حمید کاظمی هیچ جزییاتی منتشر نشده است اما کمیته پیگیری وضعیت بازداشت‌شدگان پیشتر گزارش داده بود که «حسن دیوبند»، ۳۰ ساله ۲۰ دی‌ماه در محل کار خود بازداشت شده است. علاوه بر حسن دیوبند در همان روزها و در فاصله بین ۲۰تا۲۸دی، چهارعضو دیگر خانواده این جوان ۳۰ساله نیز بازداشت شده بودند. «علی‌اصغر دیوبند»، ۲۹ ساله، ۲۰دی‌ماه در محل کار خود بازداشت شد. «علی‌اکبر دیوبند»، ۱۵ساله ۲۱دی‌ماه در یورش نیروهای امنیتی به منزل خانوادگی خود بازداشت شد. یک‌هفته بعد و در تاریخ ۲۸دی‌ماه، «محمدعلی دیوبند»۵۰ساله و پدر خانواده در محل کار خود بازداشت شده است. یکی از بستگان این‌خانواده با نام «حمیدرضا فروهر»، ۲۰ ساله نیز در همان روز ۲۸ دی از محل کارش بازداشت شد. درباره اتهامات و وضعیت فعلی دیگر اعضای خانواده حسن دیوبند اطلاعاتی در دست نیست. صدور حکم اعدام برای بسیاری از بازداشت‌شدگان اعتراضات دی‌ماه در زندان‌های مختلف ایران در حالی رخ می‌دهد که به‌سبب فشارهای امنیتی بر خانواده‌های بازداشت‌شدگان، هیچ اطلاع رسانی دقیقی درباره وضعیت پرونده، دسترسی به وکیل و شرایط برگزاری دادگاه‌ها و صدور احکام وجود ندارد. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/2ff6e193-9c21-4950-9ea5-8cc2dd78eda7_Ugly__v1024x512__box_0%2C19%2C1536%2C826.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۵ آبان • ۲۰:۱۴"}, {"source": "Euronews Persian", "title": "تسلا متعلق به ایلان ماسک سال آینده تولید «سایبرتراک» را به‌تدریج متوقف می‌کند", "link": "https://parsi.euronews.com/2026/11/06/elon-musks-tesla-will-wind-down-cybertruck-production-next-year", "summary": "ماسک گفت این تصمیم برای ایجاد فضا جهت افزایش تولید ربا ررسی تصاویر ماهواره‌ای گزارش داده است که جمهوری اسلامی در نزدیکی دو سایت مهم موشکی، در حال انجام عمل ...", "date_str": "2026-11-06T15:19:00+00:00", "hash": "9c8723b2e9a57bfb", "title_fa": "بی‌بی‌سی: تصاویر ماهواره‌ای از بازسازی پایگاه‌های موشکی ایران خبر می‌دهند", "summary_fa": "بخش راستی‌آزمایی بی بی سی جهانی با بررسی تصاویر ماهواره‌ای گزارش داده است که جمهوری اسلامی در نزدیکی دو سایت مهم موشکی، در حال انجام عمل ... کارشناسان بی‌بی‌سی در این گزارش تایید کرده‌اند که این تصاویر نشان می‌دهد ایران احتمالاً در حال اجرای اقداماتی برای افزایش حفاظت از تاسیسات نظامی خود در برابر حملات هوایی احتمالی آینده، از جمله ایجاد پوشش‌های حفاظتی برای مهمات مهم است. بر اساس این گزارش، تعمیرات دست‌کم ۱۲ سایت نظامی را در بر می‌گیرد. بخش راستی‌آزمایی بی‌بی‌سی جهانی مکان‌هایی که تصاویر ماهواره‌ای در آن‌ها نشانه‌هایی از ساخت‌وساز یا بازسازی تأسیسات نظامی را نشان می‌دهند، به این ترتیب معرفی کرده است: در پایگاه نظامی گرمدره در نزدیکی کرج و تهران، تصاویر ماهواره‌ای ماه نوامبر نشانه‌هایی از حفاری، خاک‌برداری و احداث ساختمان‌های جدید را نشان می‌دهند. چندین خودروی عملیاتی نیز در تصاویر دیده شده‌اند. به گفته سام لِیر، تحلیلگر مؤسسه پژوهش سیاست خارجی (FPRI)، تصاویر احتمالاً نشان‌دهنده ایجاد ورودی جدید برای یک تأسیسات زیرزمینی هستند. در پایگاه شاهرود در شمال ایران نیز آثار حفاری و ساخت‌وساز جدید مشاهده شده است. جیم لمسون، تحلیلگر سابق سازمان اطلاعات مرکزی آمریکا (CIA)، احتمال داده است که این حفاری‌ها با تولید موشک و انتقال تأسیسات تولیدی به زیر زمین ارتباط داشته باشند. در پایگاه موشکی کرمانشاه، در غرب ایران و نزدیک مرز عراق، تصاویر ماهواره‌ای نشان می‌دهند که روی ساختمان‌هایی که در حملات هوایی تخریب شده بودند، سقف‌های جدید نصب شده است. در شرق تهران، در مجموعه نظامی پارچین، آثار پاک‌سازی آوار و تخریب ساختمان‌های آسیب‌دیده مشاهده شده است. تحلیلگران همچنین می‌گویند عملیات بازسازی در تأسیسات تَلِقان ۲ این مجموعه انجام شده و بخش‌هایی از یک پناهگاه زیرزمینی با بتن تقویت شده‌اند. تحلیلگران شرکت اطلاعاتی MAIAR همچنین حفاری‌ها و ساخت‌وسازهای جدیدی را در نزدیکی ورودی تونل‌ها در اطراف قم شناسایی کرده‌اند؛ منطق ": "گسترش دامنه تهدید بمب‌گذاری در اروپا؛ تحریریه چند رسانه ایمیل تهدیدآمیز دریافت کردند", "summary_fa": "شبکه رادیو و تلویزیون ملی ایرلند، شبکه اسکای بریتانیا، شبکه خصوصی نووا در بلغارستان و چند رسانه دیگر اعلام کردند که پیام‌های تهدیدآمیز دریافت کرده‌اند. دامنه تهدیدهای بمب‌گذاری در قاره اروپا روز جمعه ۱۵ آبان به اهداف تازه‌ای گسترش یافت و پس از ارسال ایمیل‌های حاوی تهدید بمب‌گذاری به تحریریه چند رسانه، کارکنان این رسانه‌ها تخلیه شدند. تهدیدهای بمب‌گذاری با هشدار «زمان در حال سپری‌شدن است»، روز جمعه برای شبکه‌های تلویزیونی در سراسر اروپا ارسال شد و به تخلیه ساختمان‌ها و توقف پخش برنامه‌های برخی از این شبکه‌ها انجامید. پخش برنامه‌های شبکه رادیو و تلویزیون ملی ایرلند با موسیقی و پیام‌های از پیش ضبط‌شده جایگزین شد و پخش برخی برنامه‌ها تا سه ساعت متوقف ماند. این هشدارها پس از موجی از تهدیدهای دروغین بمب‌گذاری مطرح شده‌اند که در روزهای اخیر پروازهای مسافربری را از صربستان تا فنلاند، اسپانیا و دیگر کشورهای اروپایی مختل کرده‌اند. این تهدیدها موجب تغییر مسیر پروازها، فرودهای اضطراری و بازرسی‌های امنیتی شده‌اند، هرچند تاکنون هیچ ماده منفجره‌ای کشف نشده است. این حوادث همچنین در شرایطی رخ می‌دهد که نگرانی‌ها درباره کلاهبرداری‌های اینترنتی و حملات سایبری در هفته‌های اخیر، از جمله حملات به فروشگاه‌های زنجیره‌ای، افزایش یافته است. در یکی از ایمیل‌هایی که روز جمعه به شبکه‌های نووا و آر‌تی‌ای ارسال شد، آمده بود: «می‌خواهیم تمام جهان درباره ما بداند. به همین دلیل، یکی از عوامل ما یک وسیله انفجاری در ساختمان شما کار گذاشته است.» در ادامه این پیام نوشته شده بود: «این وسیله تا ۴۵ دقیقه دیگر منفجر خواهد شد. زمان در حال سپری‌شدن است.» با این حال هنوز مشخص نیست چه کسی پشت تهدیدهای دروغین روز جمعه قرار دارد. ایمیل‌های ارسال‌شده به شبکه‌های رادیو و تلویزیون ایرلند و نووا با نام «میخائیل آندروپوف» امضا شده بودند. نویسنده این پیام‌ها مدعی شده بود که یکی از رهبران گروهی است که مسئول تهدیدهای دروغین علیه هواپیماها", "image_url": "https://gdb.rferl.org/38565a8a-4cfe-4964-4f98-08df13aec0bb_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۱۹:۰۵"}, {"source": "IranWire", "title": "علی باقری کنی: جمهوری اسلامی این‌بار به تعهدات کاغذی آمریکا اکتفا نمی‌کند", "link": "https://iranwire.com/fa/news-1/159888-%D8%B9%D9%84%DB%8C-%D8%A8%D8%A7%D9%82%D8%B1%DB%8C-%DA%A9%D9%86%DB%8C-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D8%A7%DB%8C%D9%86%D8%A8%D8%A7%D8%B1-%D8%A8%D9%87-%D8%AA%D8%B9%D9%87%D8%AF%D8%A7%D8%AA-%DA%A9%D8%A7%D8%BA%D8%B0%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D8%A7%DA%A9%D8%AA%D9%81%D8%A7-%D9%86%D9%85%DB%8C%DA%A9%D9%86%D8%AF/", "summary": "«علی باقری کنی» معاون دبیر شورای عالی امنیت ملی ایران می‌گوید جمهوری اسلامی برای ورود به مرحله تازه‌ای از دیپلماسی با آمریکا قرار نیست ب ...", "date_str": "2026-11-06T14:31:12+00:00", "hash": "3f7ca95f7649aaa9", "title_fa": "علی باقری کنی: جمهوری اسلامی این‌بار به تعهدات کاغذی آمریکا اکتفا نمی‌کند", "summary_fa": "«علی باقری کنی» معاون دبیر شورای عالی امنیت ملی ایران می‌گوید جمهوری اسلامی برای ورود به مرحله تازه‌ای از دیپلماسی با آمریکا قرار نیست ب ... این مقام عالی جمهوری اسلامی روز جمعه ۱۵ آبان۱۴۰۵ در گفت‌وگو با خبرگزاری صداوسیما، آمریکا را متهم کرد که طی یک سال‌ونیم گذشته، چهار بار روند مذاکرات با جمهوری اسلامی را با «اقدامات خصمانه و نقض عهد» بر هم زده و در ادامه گفت: «این حق جمهوری اسلامی است که برای ورود به یک عرصهٔ دیپلماسی جدید، دیگر به تعهدات کاغذی آمریکایی‌ها اکتفا نکند.» باقری کنی بر این‌که حکومت ایران باید «اقدامات عملی را از سوی آمریکایی‌ها» ببیند تاکید کرد و گفت در صورت تحقق این اقدامات، زمینه برای «گشایش سرفصل جدید» در روند دیپلماسی فراهم خواهد شد. این اظهارات در شرایطی مطرح می‌شود که تماس‌های غیر مستقیم تهران و واشنگتن با میانجی‌گری کشورهای منطقه از جمله قطر ادامه دارد، اما اختلاف بر سر ترتیب اجرای تعهدات و شروط ایران برای ازسرگیری مذاکرات همچنان پابرجاست. قطر، میانجی گفت‌وگوهای دیپلماتیک میان ایران و آمریکا، روز ۱۵آبان سال جاری اعلام کرد که «تمیم بن حمد آل ثانی»، امیر این کشور، در گفت‌وگوی تلفنی با «دونالد ترامپ»، رییس‌جمهور آمریکا، دربارهٔ تلاش‌های میانجی‌گرانه برای پایان دادن به بحران منطقه رایزنی کرده است. خبرگزاری رسم ود پس از بررسی آن را تایید کرد. Roku در سراسر جهان به بیش از 100 میلیون خانوار دسترسی دارد و به عنوان دروازه ای برای پلتفرم های پخش جریانی مانند Netflix، YouTube TV و Disney+ عمل می کند. این شرکت همچنین آگهی‌ها و بسته‌های اشتراک را می‌فروشد، در حالی که دارای یک سرویس پخش جریانی دیگر، Tubi است. از قضا، فاکس سهام Roku خود را در سال 2020 فروخت تا به تامین مالی خرید Tubi کمک کند. این بسته پس از گزارش هایی مبنی بر کاهش 27 درصدی بینندگان فاکس نیوز در ماه اکتبر در مقایسه با سال گذشته صورت گرفت. در مقایسه، بینندگان CNN 3 درصد و MS NOW (MSNBC سابق) 16 درصد افزایش یافت. با این حال، بینندگان فاکس نیوز همچنان از مجموع بینندگان CNN و MS NOW بیشتر است. بنیانگذار Roku آنتونی وود به هیئت مدیره فاکس خواهد پیوست. او با همکاری فاکس دیجیتال پلتفرم، بخش جدیدی که بر روکو، توبی، فاکس وان و سایر برندهای دیجیتال نظارت دارد، همکاری خواهد کرد. معنای این موضوع برای دارندگان Roku هنوز مشخص نیست. اما با توجه به تمایل امپراتوری رسانه ای به سمت سیاست جناح راست، تصور اینکه این شرکت از فرصت استفاده از Roku به عنوان یک مگافون دیگر غافل شود، سخت است. فاکس", "image_url": "https://www.engadget.com/img/gallery/fox-wraps-up-its-22-billion-roku-deal/l-intro-1793985540.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "نتفلیکس", "بورس و طلا"], "datetime_fa": "۱۵ آبان • ۲۰:۵۰"}, {"source": "Engadget", "title": "The EU accuses TikTok's 'rabbit hole' algorithm of breaching its content rules", "link": "https://www.engadget.com/2309300/the-eu-accuses-tiktoks-rabbit-hole-algorithm-of-breaching-its-content-rules/", "summary": "The bloc said the platform needs to change how the For You page works to help protect users' mental health.", "date_str": "2026-11-06T17:17:14+00:00", "hash": "cbe6e7fe663bda9b", "title_fa": "اتحادیه اروپا الگوریتم «حفره خرگوش» TikTok را به نقض قوانین محتوایی خود متهم می کند.", "summary_fa": "این بلوک گفت این پلتفرم باید نحوه عملکرد صفحه For You را تغییر دهد تا از سلامت روانی کاربران محافظت کند. miss.cabul/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover کمیسیون اروپا TikTok را به نقض قانون خدمات دیجیتال (DSA) به دلیل اثرات مضر احتمالی سیستم توصیه‌ای که در صفحه For You استفاده می‌کند، متهم کرده است. بازوی نظارتی اتحادیه اروپا گفت ماهیت شخصی‌سازی شده این الگوریتم به این معناست که هرچه کاربر بیشتر با نوع خاصی از محتوا تعامل داشته باشد، ویدیوهای مشابه را بیشتر می‌بیند. کمیسیون گفت: «این طراحی زمانی می‌تواند مضر باشد که چنین قرار گرفتن در معرض بی‌پایان و مکرر، به‌عنوان مثال، محتوایی درباره غم، انزوا یا تصویر بدن را شامل شود.» این سوراخ‌های خرگوش می‌تواند تأثیر مخربی بر سلامت روانی کاربران، به‌ویژه بزرگسالان و خردسالان آسیب‌پذیر داشته باشد.» در یافته های اولیه خود، تنظیم کننده اعلام کرد که TikTok به اندازه کافی برای ارزیابی اینکه چگونه این الگوریتم می تواند کاربران را به داخل سوراخ های خرگوش بکشد و سلامت آنها را به خطر بیندازد، انجام نداده است. این کمیسیون همچنین گفت که اقدامات کافی برای کاهش این خطرات انجام نداده است، و خاطرنشان کرد که وقتی کاربر روی دکمه \"علاقه‌مند نیستم\" روی یک ویدیو ضربه می‌زند، \"ممکن است برای تغییر فید محتوا کافی نباشد.\" در این بیانیه آمده است که TikTok باید طراحی صفحه For You را تغییر دهد و باید «بیشتر به ترجیحات صریح کاربران تکیه کند، زمان مشاهده را به عنوان شاخصی برای توصیه محتوا غیرفعال کند، دسترسی و قابلیت استفاده کنترل‌های کاربر را افزایش دهد و الگوریتم آن را به طور منظم آزمایش کند». اگر TikTok به اندازه کافی این موضوع را از نظر کمیسیون حل نکند و اتحادیه اروپا یافته ها را تأیید کند، شرکت مادر ByteDance ممکن است شش درصد از درآمد جهانی سالانه خود را جریمه کند.", "image_url": "https://www.engadget.com/img/gallery/the-eu-accuses-tiktoks-rabbit-hole-algorithm-of-breaching-its-content-rules/l-intro-1793985365.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۵ آبان • ۲۰:۴۷"}, {"source": "Engadget", "title": "You'll soon be able to text Alexa to shop on Amazon", "link": "https://www.engadget.com/2309285/youll-soon-be-able-to-text-alexa-to-shop-on-amazon/", "summary": "The latest Alexa for shopping feature is initially available by invite in the US.", "date_str": "2026-11-06T17:11:10+0 le lighting effects. You can also control it via Alexa and Google Assistant, or using either Bluetooth or a Philips Hue Bridge. Anker’s new Desktop USB-C Hub is currently available from both Amazon and Anker (with code WSPDV2ONVYED ) for $79.99 ($20 off), which is $5 shy of its lowest price to date. The 10-in-1 hub features a built-in screen that not only displays charging speeds, but also doubles as a digital photo frame and customizable timer. It also sports an HDMI port, a DisplayPort connection, f", "date_str": "2026-11-06T16:39:15+00:00", "hash": "ad40962e9156335a", "title_fa": "هدست مرمت شده Quest 3S متا در حال حاضر نزدیک به 100 دلار تخفیف دارد", "summary_fa": "اگر در مورد واقعیت مجازی کنجکاو هستید، Meta’s Quest 3S یک هدست سطح ابتدایی خوب برای فرو بردن انگشتان پا است، به خصوص اکنون که با استفاده از کد کوپن SAVE20TECH به قیمت 255.99 دلار مستقیماً از فروشگاه eBay متا تا 8 نوامبر به فروش می رسد. برای مقایسه، این هدست اخیراً به عنوان بخشی از رویداد Prime Day پاییز آمازون در شرایط جدید به 300 دلار کاهش یافته است و در حال حاضر با قیمت 349.99 دلار به فروش می رسد. به گفته eBay، هدست تعمیر شده تایید شده در شرایط \"شبیه جدید\" است و توسط سازنده مورد بازرسی و تمیز کردن حرفه ای قرار گرفته است. مهمتر از آن، لوازم جانبی اصلی یا جدید - از جمله آداپتور برق، فاصله بین عینک، بند مچ و غیره - به همراه دو سال ضمانت Allstate ارائه می شود. Meta Quest 3S از کجا بخریم: $349.99 $255.99 در eBay (بازسازی شده) Quest 3S در حد وسط بین Quest 3 و Quest 2 قرار می گیرد. مانند Quest 3 گران‌تر، بر روی تراشه سریع Snapdragon XR2 Gen 2 اجرا می‌شود و از همان کتابخانه بازی‌ها پشتیبانی می‌کند. همچنین با دوربین های یکسانی برای عبور تمام رنگی عرضه می شود که به شما امکان می دهد با استفاده از هدست با دنیای اطراف خود ارتباط برقرار کنید. این دستگاه با کنترلرهای Touch Plus Meta ارائه می شود، اگرچه می توانید از دستان خود برای پیمایش منوها و تعامل با برخی از برنامه ها نیز استفاده کنید. و از آنجایی که این یک هدست مستقل است، برای انجام بازی ها به رایانه شخصی یا کنسول نیاز ندارید. با این حال، وضوح نمایشگر و کیفیت NBIS +9٪ Roundhill Neocloud ETF NCLD +9٪ Vertiv VRT +8٪ Roundhill Memory ETF DRAM +7٪ Micron MU +7٪ Nvidia NVDA +6٪ CoreWeave CRWV +6٪ SpaceX SPCX +6٪ Intel INTC +5٪ iShares Semiconductor ETF SOXX +5٪ Broadco اقتصاد ایالات متحده در ماه گذشته 165000 حقوق و دستمزد اضافه کرد که بسیار بیشتر از پیش بینی اقتصاددانان است. اگرچه این خبر", "image_url": "https://i.insider.com/6aede7108f37e8e0b5baaa9f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "Meta", "تراشه"], "datetime_fa": "۱۵ آبان • ۱۸:۴۶"}, {"source": "Business Insider", "title": "I watched AI recreate a childhood video game in 5 seconds. It showed me what's next for AI agents.", "link": "https://www.businessinsider.com/fireworks-ai-asteroids-demo-faster-agents-2026-11", "summary": "The Fireworks AI conference in San Francisco Alistair Barr/Business Insider A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . I attended the Fireworks AI conference in San Francisco on Tuesday and met the company's VP of technology and strategy, Rob Ferguson. He showed me a stunning demo in which an AI model running on Fireworks' systems created a video game from scratch in about five seconds. (A LOT faster than Claude Code , by the way.) The game was Asteroids. Watching Rob play it brought childhood memories flooding back. I used to play Asteroids on my Oric-1 computer. My dad bought it because it was cheaper than a Commodore 64. (Yes, I'm still bitter.) I had to load the game using a cassette tape player, a process that took about 10 minutes. Now, an AI model can create the game, not just load it, in seconds. Why does this matter? Rob explained that speed is crucial if AI agents are going to handle tasks efficiently on our behalf. Today, working with AI agents often means waiting for them to finish something, occasionally nudging them along. It's called botsitting , and it's a drag. Faster AI models could change that. Instead of waiting around, we could watch agents complete tasks in seconds, without interrupting our flow of work. That's exactly what happened with Rob's demo. Asteroids appeared so quickly that he could immediately ask the AI to improve it, turning the game into 3-D and adding new weapons, including colorful lasers. He didn't just use AI to create Asteroids from scratch. He made it better, too. All in about 15 seconds. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-11-06T15:11:01+00:00", "hash": "c26dfb3ee276f53d", "title_fa": "من دیدم که هوش مصنوعی یک بازی ویدیویی دوران کودکی را در 5 ثانیه بازسازی کرد. این به من نشان داد که چه اتفاقی برای عوامل هوش مصنوعی خواهد افتاد.", "summary_fa": "", "image_url": "https://i.insider.com/6aed177e9270da3cc6668ab7?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۱۵ آبان • ۱۸:۴۱"}, {"source": "Business Insider", "title": "I thought staying in my college town after graduation would spare me the postgrad growing pains. It didn't.", "link": "https://www.businessinsider.com/stayed-in-college-town-after-graduating-still-lonely-postgrad-living-2026-11", "summary": "Postgrad life is still hard, even though I stayed in my college town after graduating. Siena Frolich I didn't feel ready to leave my college town after graduation, so I decided to stay. Surprisingly, living close to my friends didn't make the postgrad transition any easier. Even though staying in the same place doesn't freeze time, I've learned to love this new chapter. When I graduated from Texas Christian University last year, I didn't want to leave. I enjoyed my time at school so much, and the thought of parting ways with the community, the people, and the routine I had settled into over the past four years didn't sit right with me. I didn't want to stop visiting the Stockyards for group dinners and rodeos, walking along the Trinity River at sunset, or attending the church I'd frequented for so many years. Plus, I felt there was more to experience in Fort Worth beyond my campus bubble, and I didn't want to return to my hometown in California. So, I thought staying in the city I had come to love so much would make the transition after graduating easier and ease my anxieties about postgrad life. My boyfriend was still in school at TCU, and all of my closest friends decided to stick around as well, either by getting jobs nearby or by continuing their studies, which made my decision even easier. I expected us to hang out all the time, go out to dinner, and show up at each other's apartments unannounced, just like when we were in school. It seemed like I had created the most seamless transition into this next phase of adulthood — or so I thought. I stayed close to the people I loved, but still felt lonely Because of our different schedules, I felt out of sync with my friends. Siena Frolich In the months after graduation, I started to feel a loneliness creep in that I couldn't make sense of. I was living with two of my best friends , the rest of them lived in the same apartment complex as us, and my boyfriend and I had just celebrated our first anniversary. Yet, I still felt isolated. I was the only one out of our group of friends with a standard 9-to-5 job — everyone else had more flexible roles or was continuing their education. I felt completely out of sync with them: while I sat in an office all day, some of them bounced from class to class or didn't have to work much at all. When I came home from work tired and wanting to stay home for the night, some of them were desperate to go out. Along with our routines being nothing alike, I didn't really understan", "date_str": "2026-11-06T15:07:09+00:00", "hash": "4e3ec51639180641", "title_fa": "فکر می‌کردم ماندن در شهر کالجم پس از فارغ‌التحصیلی، من را از دردسرهای رو به رشد پس از فارغ‌التحصیلی در امان می‌دارد. این کار را نکرد.", "summary_fa": "زندگی پس از فارغ التحصیلی هنوز سخت است، حتی اگر بعد از فارغ التحصیلی در شهر کالج خود ماندم. Siena Frolich من احساس نمی کردم که بعد از فارغ التحصیلی، شهر دانشگاهی را ترک کنم، بنابراین تصمیم گرفتم بمانم. با کمال تعجب، زندگی نزدیک با دوستانم، انتقال پس از تحصیل را آسانتر نکرد. اگرچه ماندن در همان مکان زمان را یخ نمی‌زند، من یاد گرفته‌ام که این فصل جدید را دوست داشته باشم. وقتی سال گذشته از دانشگاه مسیحی تگزاس فارغ التحصیل شدم، نمی خواستم آنجا را ترک کنم. من از زمانم در مدرسه بسیار لذت بردم، و فکر جدایی از جامعه، مردم و روتینی که در چهار سال گذشته در آن زندگی کرده بودم، چندان برایم خوشایند نبود. نمی‌خواستم برای شام‌های دسته‌جمعی و سفرهای تفریحی، قدم زدن در کنار رودخانه ترینیتی در غروب آفتاب، یا شرکت در کلیسایی که سال‌ها در آن رفت و آمد می‌کردم، از استوک یاردز دیدن نکنم. بعلاوه، احساس می‌کردم فراتر از حباب دانشگاه، چیزهای بیشتری برای تجربه در فورت ورث وجود دارد، و نمی‌خواستم به زادگاهم در کالیفرنیا برگردم. بنابراین، فکر می‌کردم ماندن در شهری که خیلی دوستش داشتم، گذار پس از فارغ‌التحصیلی را آسان‌تر می‌کند و نگرانی‌هایم را در مورد زندگی پس از فارغ‌التحصیلی کاهش می‌دهد. دوست پسرم هنوز در مدرسه TCU درس می‌خواند، و همه نزدیک‌ترین دوستانم تصمیم گرفتند که در نزدیکی کار یا با ادامه تحصیل، ادامه دهند، که تصمیم من را آسان‌تر کرد. توقع داشتم که همیشه با هم بنشینیم، برای شام بیرون برویم و بدون اطلاع قبلی در آپارتمان یکدیگر ظاهر شویم، درست مثل زمانی که در مدرسه بودیم. به نظر می‌رسید که بی‌نظیرترین انتقال را به مرحله بعدی بزرگسالی ایجاد کرده بودم - یا اینطور فکر می‌کردم. من با افرادی که دوستشان داشتم نزدیک بودم، اما هنوز احساس تنهایی می کردم به دلیل برنامه های متفاوتمان، احساس می", "image_url": "https://i.insider.com/6aecad939270da3cc66686de?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۵ آبان • ۱۸:۳۷"}, {"source": "Business Insider", "title": "A guide to every real-life historical figure on 'The Gilded Age'", "link": "https://www.businessinsider.com/the-gilded-age-cast-hbo-real-life-historical-figures", "summary": "Bertha and George Russell are based on different figures from the real Gilded Age. Karolina Wojtasik/HBO Season four of \"The Gilded Age\" premiered on November 1. While some of its characters are fictional, the show is populated with real people from the era. Grover Cleveland, Booker T. Washington, Oscar Wilde, and Clara Barton have all popped up. Few eras have captivated people more than the Gilded Age , a period in the late 19th century characterized by extreme wealth (and wealth inequality), progress, immigration, and a certain ruthlessness among the age's businessmen. And now, any history buff can tune into HBO's \" The Gilded Age \" to see this iconic time period brought to life. The show is populated by a mix of entirely fictional creations and a few characters who differ only in name from real people of the time. Here's a guide to every real person who made the jump from history books to HBO in \"The Gilded Age.\" Warning: There are some season three and four spoilers ahead. Carrie Coon plays Bertha Russell, who s based on Alva Vanderbilt. HBO; Heritage Art/Heritage Images/Getty Images Alva Vanderbilt Belmont was a Gilded Age socialite who married William K. Vanderbilt, a Vanderbilt railroad heir. In 1882, the couple built a mansion that took up a whole city block on Fifth Avenue in New York City — much like the mansion the Russells move into in the series premiere. Bertha isn't exactly Alva, but the similarities are there, including Alva's hunger and determination to be accepted by the upper crust of New York society, her strong personality, and love of the opera. Taissa Farmiga plays Bertha s daughter Gladys, based on Alva s daughter Consuelo. HBO; Gilliam Press Syndicate/PhotoQuest/Getty Images If there was any doubt that Bertha and Gladys were based on Alva and Consuelo , that doubt ended when Gladys married off to a British duke against her will, in order to elevate her family's status and credibility. While Gladys and Hector's relationship was at a high point at the end of season three — though, after the season four premiere, there seems to be a major conflict incoming — if you don't want to know what could happen to Gladys, skip ahead. In real life, Consuelo's marriage to Charles Spencer-Churchill, 9th Duke of Marlborough, was largely an unhappy one, though she and her husband mostly lived separately. They separated in 1906 and were officially divorced in 1921. The marriage was annulled in 1926. However, Bertha s husband George (Morgan Spector) i", "date_str": "2026-11-06T14:58:37+00:00", "hash": "9ac998ce8d78fdfc", "title_fa": "راهنمای هر شخصیت تاریخی زندگی واقعی در \"عصر طلایی\"", "summary_fa": "برتا و جورج راسل بر اساس چهره های متفاوتی از عصر طلایی واقعی ساخته شده اند. Karolina Wojtasik/HBO فصل چهارم «عصر طلایی» در اول نوامبر به نمایش درآمد. در حالی که برخی از شخصیت‌های آن تخیلی هستند، سریال مملو از افراد واقعی آن دوره است. گروور کلیولند، بوکر تی واشنگتن، اسکار وایلد، و کلارا بارتون همگی ظاهر شده اند. کمتر دوره ای مردم را بیش از عصر طلایی مجذوب خود کرده است، دوره ای در اواخر قرن نوزدهم که با ثروت شدید (و نابرابری ثروت)، پیشرفت، مهاجرت، و ظلم خاصی در میان تجار عصر مشخص می شود. و اکنون، هر علاقه‌مند به تاریخ می‌تواند با «عصر طلایی» HBO هماهنگ شود تا زنده شدن این دوره زمانی نمادین را ببیند. نمایش با ترکیبی از خلاقیت‌های کاملاً تخیلی و چند شخصیت که فقط از نظر نام با افراد واقعی آن زمان متفاوت هستند، پر شده است. در اینجا راهنمای هر شخص واقعی است که از کتاب های تاریخ به HBO در «عصر طلایی» جهش کرده است. هشدار: چند فصل سوم و چهارم اسپویلر در پیش است. کری کون نقش برتا راسل را بازی می کند که بر اساس آلوا واندربیلت ساخته شده است. HBO; هنر میراث/تصاویر میراث/گتی ایماژ آلوا واندربیلت بلمونت یک فرد اجتماعی عصر طلاکاری بود که با ویلیام کی واندربیلت، وارث راه آهن واندربیلت ازدواج کرد. در سال 1882، این زوج عمارتی ساختند که کل یک بلوک شهری را در خیابان پنجم در شهر نیویورک اشغال کرد - بسیار شبیه عمارتی که راسل ها در اولین نمایش سریال به آن نقل مکان کردند. برتا دقیقاً آلوا نیست، اما شباهت ها وجود دارد، از جمله گرسنگی و عزم آلوا برای پذیرفته شدن توسط قشر بالای جامعه نیویورک، شخصیت قوی او و عشق به اپرا. تایسا فارمیگا نقش گلدیس دختر برتا را بر اساس دختر آلوا کنسوئلو بازی می کند. HBO; سندیکای", "image_url": "https://i.insider.com/6aeb9d43308912814ed70fb8?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۵ آبان • ۱۸:۲۸"}, {"source": "Business Insider", "title": "Fox has finalized its Roku acquisition well ahead of schedule, forming a free streaming giant", "link": "https://www.businessinsider.com/fox-buys-roku-free-streaming-tv-tubi-advertising-2026-11", "summary": "Fox has bought Roku in a big strategic move under CEO Lachlan Murdoch. Illustration by Thomas Fuller/SOPA Images/LightRocket via Getty Images; Jon Kopaloff/WireImage Fox finalized its Roku deal on Friday, months ahead of schedule. Owning Roku will give Fox control of two top free streamers. Fox told investors that it expects to save $400 million annually from the deal within two years. Fox has bought Roku in a deal that could transform the TV giant into a free streaming powerhouse . The timing of the $22 billion deal is a surprise. Fox originally said it expected its acquisition of Roku to be finalized in the first half of 2027. Fox had said in September the US Department of Justice requested more information about its Roku deal, though the broadcast titan said that move was \"expected.\" Buying Roku will help Fox scale its advertising business while giving it control of The Roku Channel in addition to Tubi, the second- and third-largest free streaming services by US TV viewership. YouTube is the clear No. 1. Together, Roku, Tubi, and Fox's broadcast channel and cable networks — which include Fox News and FS1 — generate more TV viewership in the US than Netflix or NBCUniversal, according to Nielsen. Roku's connected TV platform is in over 100 million households. It drove over $727 million in advertising revenue in its September quarter, up 23% from the year before, the company said on Monday. Fox said in its deal announcement on Friday that it expects to generate about $400 million in annual cost savings within two years by buying Roku. \"Our top priority for the combined company is to continue to relentlessly serve audiences and partners,\" Fox CEO Lachlan Murdoch said in a statement. Gaining The Roku Channel gives Fox another asset in a hot area. As paid streamers raise prices , consumers have been increasingly turning to free services for their TV viewing. Read the original article on Business Insider", "date_str": "2026-11-06T14:55:37+00:00", "hash": "d47777d64a86dd77", "title_fa": "فاکس خرید Roku خود را خیلی زودتر از موعد مقرر نهایی کرده است و یک غول پخش رایگان را تشکیل داده است", "summary_fa": "فاکس Roku را در یک حرکت استراتژیک بزرگ تحت مدیریت Lachlan Murdoch خریداری کرده است. تصویر توسط توماس فولر/SOPA Images/LightRocket از طریق Getty Images. Jon Kopaloff/WireImage Fox قرارداد Roku خود را در روز جمعه، ماه‌ها زودتر از موعد مقرر نهایی کرد. مالکیت Roku به فاکس امکان کنترل دو پخش کننده رایگان برتر را می دهد. فاکس به سرمایه گذاران گفت که انتظار دارد سالانه 400 میلیون دلار از این معامله ظرف دو سال پس انداز کند. فاکس Roku را در معامله ای خرید که می تواند غول تلویزیون را به یک نیروگاه پخش رایگان تبدیل کند. زمان قرارداد 22 میلیارد دلاری غافلگیر کننده است. فاکس در ابتدا گفت که انتظار دارد خرید Roku در نیمه اول سال 2027 نهایی شود. فاکس در ماه سپتامبر گفته بود که وزارت دادگستری ایالات متحده اطلاعات بیشتری در مورد قرارداد Roku خود درخواست کرده است، اگرچه تایتان پخش گفت که این اقدام \"منتظر می شود\". خرید Roku به فاکس کمک می کند تا تجارت تبلیغاتی خود را گسترش دهد و در عین حال کنترل کانال Roku را علاوه بر Tubi، دومین و سومین سرویس پخش رایگان بزرگ بین بینندگان تلویزیون ایالات متحده، به آن می دهد. یوتیوب شماره 1 واضح است. به گفته نیلسن، کانال‌های پخش و شبکه‌های کابلی Roku، Tubi و فاکس - که شامل فاکس نیوز و FS1 می‌شود - در ایالات متحده بیننده بیشتری نسبت به Netflix یا NBCUniversal ایجاد می‌کنند. پلت فرم تلویزیون متصل Roku در بیش از 100 میلیون خانوار است. این شرکت روز دوشنبه اعلام کرد که در سه ماهه سپتامبر خود بیش از 727 میلیون دلار درآمد تبلیغاتی داشته است که نسبت به سال قبل 23 درصد افزایش داشته است. فاکس در اطلاعیه معامله خود در روز جمعه اعلام کرد که انتظار دارد با خرید Roku در مدت دو سال حدود 400 میلیون دلار صرفه جویی در", "image_url": "https://i.insider.com/6aede6688f37e8e0b5baaa98?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۱۵ آبان • ۱۸:۲۵"}, {"source": "Business Insider", "title": "The UK's newest aircraft carrier has fewer sailors and fighter jets than US supercarriers. It's built to operate 'lean.'", "link": "https://www.businessinsider.com/uk-newest-aircraft-carrier-fewer-crew-aircraft-makes-them-count-2026-11", "summary": "A sailor on the flight deck of the HMS Prince of Wales. Jake Epstein/Business Insider Business Insider embarked on the UK's newest aircraft carrier during operations near Norway. The HMS Prince of Wales is smaller and has fewer sailors and jets than American aircraft carriers. The warship's leadership described it as \"lean-crewed\" with a \"highly efficient\" air wing. ABOARD THE HMS PRINCE OF WALES — An F-35 stealth fighter roars down the flight deck of Britain's newest aircraft carrier, hurtling toward a ski-jump ramp above the Norwegian Sea. Seconds later, the jet is airborne, climbing into the sky. Silence returns to the flight deck of the HMS Prince of Wales , the Royal Navy's flagship. The Prince of Wales can carry up to 36 F-35 fighter jets , but only a handful were aboard when Business Insider visited the warship while it was operating off the coast of Norway this week. \"We have a relatively modest, yet highly efficient, air wing with the aircraft that we have,\" Capt. Ben Power, the carrier's commanding officer, said on the bridge. Even with relatively few fighters onboard, the carrier can sustain high-tempo flight operations. The Prince of Wales, currently leading the UK carrier strike group, is deployed to the Norwegian Sea for the second phase of Operation Firecrest, a deterrence mission in the Arctic and North Atlantic . It is sailing with NATO warships while also participating in the alliance's recurring Neptune Strike exercise. The Prince of Wales can carry dozens of F-35B stealth fighter jets. Jake Epstein/Business Insider The carrier can accommodate up to 72 aircraft, including 36 F-35Bs, the short take-off and vertical landing variants — and a mix of helicopters, like the Merlin Mk2, which is designed for anti-submarine warfare . The ship can also carry up to 1,600 sailors and Royal Marines. Power said the Prince of Wales is smaller than the US Navy's Ford-class carriers and typically operates with just 1,200 sailors, compared with nearly 5,000 aboard USS Gerald R. Ford , which can carry more than 75 aircraft, including dozens of fighter jets. We are a \"very lean-crewed, effective, and efficient platform, as you would expect, because this is very modern technology,\" Power said of the Prince of Wales. Power credited the Prince of Wales' high sortie rate to its well-trained crew and advanced technology aboard the $4 billion vessel , commissioned in 2019. He singled out the automated weapons-handling system that moves bombs and missiles from mag", "date_str": "2026-11-06T14:54:58+00:00", "hash": "dd7e19b5f7d50109", "title_fa": "جدیدترین ناو هواپیمابر بریتانیا نسبت به ابرناوهای آمریکایی ملوان و جت های جنگنده کمتری دارد. این ساخته شده است به کار \"لاغر\".", "summary_fa": "یک ملوان در عرشه پرواز HMS Prince of Wales. Jake Epstein/Business Insider Business Insider در حین عملیات در نزدیکی نروژ، جدیدترین ناو هواپیمابر بریتانیا را سوار کرد. HMS Prince of Wales کوچکتر است و ملوان ها و جت های کمتری نسبت به ناوهای هواپیمابر آمریکایی دارد. رهبری این کشتی جنگی آن را به عنوان \"خدمه لاغر\" با بال هوایی \"بسیار کارآمد\" توصیف کرد. سوار بر HMS PRINCE OF WALES - یک جنگنده رادارگریز F-35 در عرشه پرواز جدیدترین ناو هواپیمابر بریتانیا غرش می کند و به سمت یک رمپ پرش ocus. Multi-strategy giants like Millennium Management and Balyasny Asset Management lost money, while macro superstars like Greg Coffey and credit wunderkinds like Hamza Lemssouguer made headlines for the wrong reasons. The carnage shows no signs of slowing, as artificial-intelligence-linked stocks tumbled Thursday following Democrats' dominance in Tuesday's midterm elections. It's been a bloody stretch for an industry known for its insatiable demand for investing personnel, potentially justifying Elliott Management founder Paul Singer's view that the talent war has been \"exaggerated\" by \"the non-stop bull market.\" \"The next serious bear market could lead to a comprehensive rethink of how investors determine excellence,\" he wrote in an investor letter from late January. The consequences of these losses are no surprise for those familiar with the cutthroat nature of the industry: Nameplate changes. There is very little patience for people who aren't making money, especially at the sprawling multi-strategy funds which, on average, turn over 20% of their portfolio managers each year. On the stock-picking side, Walleye Capital and Engineers Gate just cut senior leaders, including Anil Gondi and Mike Daylamani, respectively, and other equity-focused staffers, while Balyasny's Corbets unit shed investors in October, Business Insider reported. Funds had to battle a volatile market in October when several big-name tech stocks, such as Meta and Intel, sold off. Macro traders meanwhile had to navigate the ripple effects of rising interest rates , war-driven oil price fluctuations, and an electoral surprise in Brazil. It resulted in the worst month on record for Kirkoswald Capital, the firm run by Coffey, the macro investing legend nicknamed \"The Wizard of Oz.\" The manager dropped more than 6%, though its year-to-date gains are still above 16%, a person close to the manager told Business Insider. There's also been plenty of personnel departures from macr", "date_str": "2026-11-06T14:41:37+00:00", "hash": "009b8453ded9413d", "title_fa": "داخل حمام خون صندوق پرچین اکتبر - و چرا درد ممکن است تمام نشود", "summary_fa": "کمتر کسی می تواند چنین دوران پرنوسانی را در صنعت صندوق های تامینی به خاطر بیاورد. TIMOTHY A. CLARY/AFP از طریق Getty Images بسیاری از مدیران مشهور در اکتبر پرتلاطم پول خود را از دست دادند. صندوق های تامینی با افزایش درد، معامله گران و مدیران ارشد را کنار می گذارند. معامله گرانی که در بین طبقات دارایی سرمایه گذاری می کنند تحت تأثیر قرار گرفته اند و این درد تا ماه نوامبر ادامه دارد. هالووین گذشته است، اما زمان‌ها هرگز برای صنعت صندوق‌های تامینی ترسناک‌تر نبوده است. اکتبر تقریباً برای هر شرکتی، صرف نظر از تمرکز استراتژی، ماه بی رحمانه ای بود. غول‌های چند استراتژی مانند مدیریت هزاره و مدیریت دارایی بالیاسنی پول خود را از دست دادند، در حالی که ابرستاره‌های کلان مانند گرگ کافی و واندرکایند اعتباری مانند حمزه لمسوگر به دلایل اشتباه تیتر خبرها شدند. این قتل عام هیچ نشانه ای از کند شدن را نشان نمی دهد، زیرا سهام های مرتبط با هوش مصنوعی روز پنجشنبه پس از تسلط دموکرات ها در انتخابات میان دوره ای سه شنبه سقوط کردند. برای صنعتی که به دلیل تقاضای سیری ناپذیرش برای سرمایه‌گذاری پرسنل شناخته می‌شود، این یک کشش خونین بود، که به طور بالقوه دیدگاه پل سینگر، بنیانگذار الیوت مدیریت را توجیه می‌کند که جنگ استعدادها توسط «بازار افزایشی بی‌وقفه» «اغراق‌آمیز» شده است. او در نامه ای از سرمایه گذاران از اواخر ژانویه نوشت: «بازار نزولی جدی بعدی می تواند منجر به بازنگری جامع در مورد چگونگی تعیین تعالی سرمایه گذاران شود. عواقب این زیان‌ها برای کسانی که با ماهیت بد صنعت آشنا هستند تعجب آور نیست: تغییر پلاک. برای افرادی که پول در نمی آورند، صبر بسیار کمی وجود دارد، به خصوص در صندوق های گسترده چند استراتژی که به طور متوسط ​​هر سال 20 درصد از مدیران پورتفولیوی خود را تغییر می دهند. به گزارش", "image_url": "https://i.insider.com/6aede267eaa5e46dca2278e0?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "سرمایه‌گذاری", "بورس و طلا"], "datetime_fa": "۱۵ آبان • ۱۸:۱۱"}, {"source": "Business Insider", "title": "I tried Ina Garten's chocolate pecan pie recipe. It's the easiest Thanksgiving dessert I've ever made.", "link": "https://www.businessinsider.com/ina-garten-bourbon-chocolate-pecan-pie-recipe-2026-11", "summary": "I tried Ina Garten s bourbon chocolate pecan pie with store-bought crust. Anneta Konstantinides/Business Insider I tried Ina Garten's bourbon chocolate pecan pie recipe for Thanksgiving. The recipe has barely any steps or prep and uses a store-bought pie crust. I thought the pie was super easy to make, and it was deliciously crunchy and creamy. I love making Ina Garten's recipes, especially during the holidays. Whether it's her delicious brown-butter skillet cornbread or creamy potato gratin , Garten has never let me down on Christmas and Thanksgiving. But I'd never tried making one of Garten's desserts for my family's festivities. So when I saw a recipe for bourbon chocolate pecan pie in her \"Go-To Dinners\" cookbook, which includes a store-bought pie crust, I knew it'd be an easy addition to my Thanksgiving menu. Ina Garten s pecan pie includes a store-bought crust, chocolate chips, and bourbon. Anneta Konstantinides/Business Insider To make Garten's bourbon chocolate pecan pie, which serves six to eight people, you'll need: 1 9-inch store-bought frozen pie crust (make sure you defrost it the night before baking) 2 extra-large eggs 1 cup of whole pecans, large-diced 1 stick (8 tablespoons) of unsalted butter, melted and slightly cooled 1 ¼ cups of semisweet chocolate chips (Garten recommends Nestlé) ½ cup of light brown sugar, lightly packed ½ cup of granulated sugar ½ cup of all-purpose flour 2 ½ tablespoons of good bourbon (Garten recommends Maker's Mark) 1 teaspoon of pure vanilla extract Good vanilla ice cream for serving (Garten recommends Häagen-Dazs) First, I prepped my pecans. Anneta Konstantinides/Business Insider Garten's recipe calls for whole pecans to be \" large-diced .\" To save time, I bought pecans that had already been halved and gave them a quick, rough chop to get them down to size. Then I added all of my dry ingredients into a bowl. Anneta Konstantinides/Business Insider I threw in the brown sugar, granulated sugar, and flour, along with one teaspoon of salt, before mixing everything together. I whisked the liquid ingredients together. Anneta Konstantinides/Business Insider I threw in the eggs, melted butter, vanilla, and bourbon and whisked everything together. I poured my wet ingredients into the bowl with my dry ingredients. Anneta Konstantinides/Business Insider I stirred the ingredients with a rubber spatula until they were combined. Then I stirred in my chocolate chips and pecans. Anneta Konstantinides/Business Insider And just li", "date_str": "2026-11-06T14:29:02+00:00", "hash": "77f8a6c722834c68", "title_fa": "من دستور پای اسپند شکلاتی اینا گارتن را امتحان کردم. این ساده ترین دسر شکرگزاری است که تا به حال درست کرده ام.", "summary_fa": "من پای اسپند شکلاتی بوربن اینا گارتن را با پوسته فروشگاهی امتحان کردم. Anneta Konstantinides/Business Insider من دستور پای اسپند بوربن شکلاتی Ina Garten را برای روز شکرگزاری امتحان کردم. این دستور تقریباً هیچ مرحله یا آماده سازی ندارد و از پوسته پای خریداری شده در فروشگاه استفاده می کند. من فکر می کردم که پای فوق العاده آسان درست می شود و به طرز خوشمزه ای ترد و خامه ای بود. من عاشق درست کردن دستور العمل های اینا گارتن هستم، مخصوصاً در تعطیلات. گارتن چه نان ذرت تابه‌ای خوشمزه با کره قهوه‌ای یا گراتن سیب‌زمینی خامه‌ای، هرگز در کریسمس و روز شکرگزاری من را ناامید نکرده است. اما من هرگز سعی نکردم یکی از دسرهای گارتن را برای جشن های خانواده ام درست کنم. بنابراین وقتی در کتاب آشپزی او «Go-To Dinners» دستور تهیه پای اسپند شکلاتی بوربون را دیدم، که شامل یک پوسته پای خریداری شده در فروشگاه است، می دانستم که افزودن آسانی به منوی شکرگزاری من خواهد بود. پای اسپند اینا گارتن شامل یک پوسته از فروشگاه، چیپس شکلات و بوربون است. Anneta Konstantinides/Business Insider برای تهیه پای گردوی شکلاتی بوربن Garten که برای شش تا هشت نفر سرو می شود، به این موارد نیاز دارید: 1 پوسته پای یخ g. But can these technologies actually help the US make more honey? Read the original article on Business Insider", "date_str": "2026-11-06T14:05:12+00:00", "hash": "cc6f6f1a98fc314d", "title_fa": "چگونه Nate's Honey از هوش مصنوعی برای محافظت از 6 میلیارد زنبور خود استفاده می کند", "summary_fa": "آمریکایی ها سالانه بیش از 600 میلیون پوند عسل مصرف می کنند، به طوری که برای تامین نیاز باید عسل وارد کرد. عسل به زنبورهای سالم وابسته است که در داخل کشور با نبرد سختی روبرو هستند و هر ساله 50 درصد کلنی های زنبور عسل در ایالات متحده می میرند. آفاتی مانند کنه واروآ و حرکت مداوم کهیر را در معرض خطر قرار می دهد. بنابراین عسل و غذاهای شیرین نیت برای کمک به حفظ سلامت زنبورها به هوش مصنوعی روی می آورند. آنها از دستگاه های تشخیص هوش مصنوعی برای نظارت بر صداهایی که کندوها تولید می کنند استفاده می کنند. و آنها از کندوی روباتیکی استفاده کرده اند که به تعیین اینکه آیا کنه ها در حال گسترش هستند یا خیر کمک می کند. اما آیا این فناوری ها واقعا می توانند به ایالات متحده کمک کنند تا عسل بیشتری تولید کند؟ مقاله اصلی در مورد هوش مصنوعی ویدیوی Business Insider را بخوانید چگونه عسل نیت از هوش مصنوعی برای محافظت از 6 میلیارد زنبور خود استفاده می کند نماد اشتراک گذاری یک فلش منحنی که به سمت راست اشاره می کند. X LinkedIn کپی پیوند نماد فیس بوک حرف F. Olivia Nemec، Daniel Gessner، Yuelei Song و A.C. Fowler 2026-11-06T14:05:12.837Z نماد اشتراک گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند فیس بوک نماد حرف F. توضیحات Angle down icon نمادی به شکل زاویه ای که به سمت پایین است. آمریکا سالانه بیش از 6 میلیارد دلار مواد بازیافتی را هدر می دهد. آیا ربات ها و هوش مصنوعی می توانند کمک کنند؟ نماد پخش مثلثی که به سمت راست اشاره می کند که نشان می دهد این نوع رسانه قابل پخش است.", "image_url": "https://i.insider.com/6aeb66fec54bfafa65abef06?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۵ آبان • ۱۷:۳۵"}, {"source": "Lifehacker", "title": "ChatGPT's New GIF Generator Is Fun, but Won't Replace Us Humans (Yet)", "link": "https://lifehacker.com/tech/chatgpts-new-gif-generator-is-fun-but-wont-replace-us-humans?utm_medium=RSS", "summary": "When it comes to generating AI images, both Gemini and ChatGPT do a passable job. In most cases, the results will look AI-generated, but they likely won t have glaring spelling issues or missing limbs. Now, OpenAI is trying something new, introducing GIF support for ChatGPT . It's the company's first \"moving images\" feature since OpenAI shut down Sora , and while you can generate hyper-realistic videos in Gemini , this new ChatGPT feature is trying to fill in the gap, in a small way. How to make animated GIFs using ChatGPT Credit: Khamosh Pathak OpenAI is pitching the new feature as an animation tool, not exactly as a way to create looping videos though that s how I ended up using it. You give ChatGPT a prompt, as detailed as you can make it, and the chatbot produces a GIF in just a few seconds. You can start with your own drawings or images, too. ChatGPT uses sketches as the base for animations, though it can turn any still image into animated GIFs. Like other AI editing tools, you can edit it if ChatGPT didn't quite get it right: You can ask ChatGPT to make the GIF longer or shorter, remove certain objects, change the style, slow down transitions, among other edits. Credit: Khamosh Pathak AI art can be quite sterile, but I was surprised by how adding motion and animation to the mix makes generating images a lot more fun. Unlike traditional GIFs, which usually pull from existing video clips, you can turn anything you want into a GIF, which is especially cool if you're using your own art. In my testing, I found this to be the most rewarding part. It s not always possible to one-shot a GIF with a single prompt. But after a few rounds of edits, I ended up creating some GIFs that I actually wanted to share in my WhatsApp groups. ChatGPT can t beat regular GIFs That being said, I think human-made GIFs are still the gold standard here. For example, I asked ChatGPT to generate a video of someone brewing a pour-over, with a gooseneck kettle, showing the coffee blooming process. It did okay, but it s nothing like actually making a pour-over. The kettle doesn t move in circles, the water doesn t rise evenly, there are no bubbles, and the steam is all over the place. Credit: Khamosh Pathak Compare that to the GIF below, which comes from a royalty-free video. Even though it s a compressed, low-quality, and noisy GIF, it still shows the movement of the pour, the water rising, and even the bubbles. The details captured by a real video just aren t there in ChatGPT GIFs.", "date_str": "2026-11-06T15:00:00+00:00", "hash": "495b909fa8abc752", "title_fa": "تولید کننده GIF جدید ChatGPT سرگرم کننده است، اما جایگزین ما انسان ها نخواهد شد (هنوز)", "summary_fa": "وقتی نوبت به تولید تصاویر هوش مصنوعی می رسد، Gemini و ChatGPT هر دو کار قابل قبولی را انجام می دهند. در بیشتر موارد، نتایج به‌نظر می‌آیند که توسط هوش مصنوعی تولید شده‌اند، اما احتمالاً مشکلات املایی فاحش یا از دست دادن اندام‌ها ندارند. اکنون، OpenAI در حال آزمایش چیز جدیدی است و پشتیبانی GIF را برای ChatGPT معرفی می کند. این اولین ویژگی «تصاویر متحرک» این شرکت از زمانی است که OpenAI Sora را تعطیل کرد، و در حالی که می‌توانید ویدیوهای فوق‌العاده واقعی در Gemini تولید کنید، این ویژگی جدید ChatGPT تلاش می‌کند تا شکاف را به روشی کوچک پر کند. نحوه ساخت گیف های متحرک با استفاده از ChatGPT Credit: Khamosh Pathak OpenAI این ویژگی جدید را به عنوان یک ابزار انیمیشن ارائه می کند، نه دقیقاً به عنوان راهی برای ایجاد ویدیوهای حلقه ای، اگرچه من در نهایت از آن استفاده کردم. شما به ChatGPT یک اعلان می‌دهید، تا جایی که می‌توانید جزئیات آن را بسازید، و چت بات تنها در چند ثانیه یک GIF تولید می‌کند. می توانید با نقاشی ها یا تصاویر خود نیز شروع کنید. ChatGPT از طرح‌ها به عنوان پایه انیمیشن‌ها استفاده می‌کند، اگرچه می‌تواند هر تصویر ثابت را به GIF متحرک تبدیل کند. مانند سایر ابزارهای ویرایش هوش مصنوعی، اگر ChatGPT به درستی متوجه نشد، می‌توانید آن را ویرایش کنید: می‌توانید از ChatGPT بخواهید که GIF را طولانی‌تر یا کوتاه‌تر کند، اشیاء خ =1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۵ آبان • ۱۷:۳۰"}, {"source": "Ars Technica", "title": "Nvidia CEO Jensen Huang summoned by Congress over Chinese espionage concerns", "link": "https://arstechnica.com/tech-policy/2026/11/nvidia-ceo-jensen-huang-summoned-by-congress-over-chinese-espionage-concerns/", "summary": "Top Republican lawmakers have asked Jensen Huang to appear before Congress to answer questions after it was reported that US intelligence officials believe Nvidia’s chief executive has been targeted by a Chinese spying operation. The chairs of the House committees on China, foreign affairs and intelligence wrote to Huang this week asking him to appear before a joint closed-door briefing for their committees on November 18. “Recent reports raise significant national security concerns regarding the People’s Republic of China’s access to sensitive US technology and information,” representatives John Moolenaar, Brian Mast and Rick Crawford wrote. Read full article Comments", "date_str": "2026-11-06T14:13:32+00:00", "hash": "46fdfeb4b49d35dc", "title_fa": "جنسن هوانگ، مدیرعامل انویدیا، به دلیل نگرانی‌های مربوط به جاسوسی چین، توسط کنگره احضار شد", "summary_fa": "قانون‌گذاران ارشد جمهوری‌خواه از جنسن هوانگ خواسته‌اند تا در مقابل کنگره حاضر شود تا به سوالاتی پاسخ دهد که مقامات اطلاعاتی آمریکا معتقدند مدیر اجرایی انویدیا هدف یک عملیات جاسوسی چینی قرار گرفته است. روسای کمیته‌های چین، امور خارجه و اطلاعات مجلس نمایندگان این هفته نامه‌ای به هوانگ نوشتند و از او خواستند در جلسه توجیهی مشترک پشت درهای بسته برای کمیته‌های آنها در 18 نوامبر حاضر شود. جان مولنار، برایان ماست و ریک کرافورد، نمایندگان این سازمان نوشتند: «گزارش‌های اخیر نگرانی‌های امنیت ملی مهمی را در مورد دسترسی جمهوری خلق چین به فناوری و اطلاعات حساس ایالات متحده ایجاد می‌کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید قانونگذاران جمهوریخواه برتر از جنسن هوانگ خواسته اند تا در کنگره برای پاسخگویی به سوالات پس از گزارش مقامات اطلاعاتی ایالات متحده بر این باورند که مدیر اجرایی انویدیا هدف یک عملیات جاسوسی چینی قرار گرفته است. قانونگذاران افزودند: \"مسئله نفوذ PRC و دسترسی به فناوری پیشرفته ایالات متحده هسته اصلی کار تحقیقاتی سه کمیته ما در این کنگره است. بسیار مهم است که کنگره تعیین کند که امنیت ملی ایالات متحده تا چه حد در معرض خطر قرار گرفته است.\" نیویورک تایمز هفته گذشته نوشت که مقامات اطلاعاتی آمریکا معتقدند هوانگ هدف یک عملیات جاسوسی چینی قرار گرفته است. این نگرانی بر روی یک زن چینی به نام آلیس هوانگ، مدیر اجرایی Megaspeed، یک شرکت ابری مستقر در سنگاپور است که میلیاردها دلار از تراشه های انویدیا را خریداری کرده است.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/08/GettyImages-2285710586-1024x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Nvidia", "امنیت سایبری", "تراشه", "عامل‌های هوشمند"], "datetime_fa": "۱۵ آبان • ۱۷:۴۳"}, {"source": "Ars Technica", "title": "No more Cybertrucks; Musk moves on from the angular metallic flop", "link": "https://arstechnica.com/cars/2026/11/the-cybertruck-is-dead-makes-way-for-cybercab-says-elon-musk/", "summary": "Elon’s Edsel is no more. Last night Tesla CEO Elon Musk revealed on social media that his car company is calling time on its failed attempt to wrest control of the American pickup truck market. The Cybertruck will cease production in the middle of 2027, liberating that space in Tesla’s cavernous factory for other uses—more Cybercabs , most likely. Musk first revealed the Cybertruck in late 2019 , back when Tesla was still trading at a theoretically understandable price-to-earning ratio. The pickup's unusual angular shape owed more to low-res video game models than any concessions to practicality. At the time Musk made fanciful claims that the truck would use a stainless steel monocoque construction, telling his audience that “the body and bed don’t do anything useful” on a normal truck. While some race cars use carbon-fiber monocoques for strength and lightness, making a pickup truck with a stainless steel monocoque chassis would only make sense if someone had an awful lot of stainless steel lying around and needed something to do with it all. The truck was supposed to go on sale for less than $40,000, and Tesla made its usual stratospheric sales predictions that (had they been accurate) the bare metal EVs would be as ubiquitous as the Model 3 and Y. Read full article Comments", "date_str": "2026-11-06T13:50:20+00:00", "hash": "a0873c5bf2d0332e", "title_fa": "دیگر خبری از کامیون های سایبری نیست. ماسک از فلاپ فلزی زاویه دار حرکت می کند", "summary_fa": "ادسل ایلان دیگر نیست. دیشب، ایلان ماسک، مدیرعامل تسلا در رسانه‌های اجتماعی فاش کرد که شرکت خودروسازی او در تلاش شکست خورده خود برای کنترل بازار وانت‌های آمریکایی زمان می‌گذارد. Cybertruck در اواسط سال 2027 تولید خود را متوقف می کند و فضای موجود در کارخانه غارنشین تسلا را برای استفاده های دیگر آزاد می کند - به احتمال زیاد سایبر تاکسی ها. ماسک اولین بار Cybertruck را در اواخر سال 2019 معرفی کرد، زمانی که تسلا هنوز با نسبت قیمت به درآمد قابل درک از نظر تئوری معامله می کرد. شکل زاویه‌ای غیرمعمول این پیکاپ بیش از هر امتیازی برای عملی بودن مدیون مدل‌های بازی ویدیویی با وضوح پایین است. در آن زمان ماسک ادعاهای تخیلی داشت مبنی بر اینکه این کامیون از یک ساختار مونوکوک از جنس استنلس استیل استفاده می کند و به مخاطبانش می گفت که \"بدنه و تخت هیچ کار مفیدی در یک کامیون معمولی انجام نمی دهند\". در حالی که برخی از خودروهای مسابقه‌ای از مونوکوک‌های فیبر کربنی برای استحکام و سبکی استفاده می‌کنند، ساخت یک پیکاپ با شاسی مونوکوک از جنس استنلس استیل تنها زمانی منطقی خواهد بود که کسی مقدار زیادی فولاد ضد زنگ در اطراف خود داشته باشد و نیاز به کاری داشته باشد. قرار بود این کامیون با قیمتی کمتر از 40000 دلار به فروش برسد و تسلا پیش‌بینی‌های فروش استراتوسفری معمول خود را انجام داد که (اگر دقیق بودند) خودروهای الکتریکی فلزی لخت به اندازه مدل 3 و Y در همه جا حاضر خواهند بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن Elon's Edsel دیگر وجود ندارد. دیشب، ایلان ماسک، مدیرعامل تسلا در رسانه‌های اجتماعی فاش کرد که شرکت خودروسازی او در تلاش شکست خورده خود برای کنترل", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/GettyImages-2303012424-2560x1440.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۵ آبان • ۱۷:۲۰"}, {"source": "Ars Technica", "title": "Rocket Report: Artemis II literally tore through the atmosphere; New Glenn delay", "link": "https://arstechnica.com/space/2026/11/rocket-report-new-glenn-wont-fly-this-year-china-launches-mini-falcon-heavy/", "summary": "Welcome to Edition 9.18 of the Rocket Report! Blue Origin packed a lot of news into one afternoon Thursday with the reveal of a new kick stage for the New Glenn rocket, a new rocket engine design, and the minor and widely expected delay for New Glenn's return-to-flight mission from December until January. The reconstruction of Blue Origin's wrecked launch pad at Cape Canaveral, Florida, continues apace after a catastrophic explosion nearly six months ago. There's a lot of pent-up demand from NASA, Amazon, and the Space Force for Blue Origin to get New Glenn back in action. As always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar. SpaceX vets work on water-fed propulsion . Three brothers who worked at SpaceX in the Falcon 9 era are now building satellites that run on water, a potentially harvestable resource on the Moon and found all over the Solar System, Ars reports . In late 2022, the three Carlisle brothers founded Argo Space to build infrastructure in space. Their vision was not just in-space transportation but also removing the need to use propellants from Earth to move around the heavens. Argo Space's satellites will use water not only as a propellant, but also as a coolant and radiation shield. Read full article Comments", "date_str": "2026-11-06T13:33:20+00:00", "hash": "8d07660635ed4697", "title_fa": "گزارش موشک: آرتمیس دوم به معنای واقعی کلمه جو را درید. تاخیر گلن جدید", "summary_fa": "به نسخه 9.18 گزارش موشک خوش آمدید! Blue Origin اخبار زیادی را در یک بعد از ظهر پنجشنبه با فاش شدن مرحله ضربه زدن جدید برای موشک نیو گلن، طراحی جدید موتور موشک و تاخیر جزئی و به طور گسترده ای مورد انتظار برای ماموریت بازگشت نیو گلن به پرواز از دسامبر تا ژانویه منتشر کرد. بازسازی سکوی پرتاب شکسته Blue Origin در کیپ کاناورال، فلوریدا، پس از انفجاری فاجعه بار تقریباً شش ماه پیش، با سرعت ادامه دارد. تقاضای زیادی از سوی ناسا، آمازون و نیروی فضایی برای Blue Origin برای بازگرداندن نیو گلن به فعالیت وجود دارد. مثل همیشه، از ارسال‌های خوانندگان استقبال می‌کنیم، و اگر نمی‌خواهید مشکلی را از دست بدهید، لطفاً با استفاده از کادر زیر مشترک شوید (فرم در نسخه‌های دارای AMP سایت ظاهر نمی‌شود). هر گزارش شامل اطلاعاتی در مورد موشک های کوچک، متوسط ​​و سنگین و همچنین نگاهی سریع به سه پرتاب بعدی در تقویم خواهد بود. دامپزشکان SpaceX روی نیروی محرکه آب کار می کنند. به گزارش Ars، سه برادری که در دوران Falcon 9 در SpaceX کار می کردند، اکنون در حال ساخت ماهواره هایی هستند که روی آب کار می کنند، منبعی بالقوه قابل برداشت در ماه و در سراسر منظومه شمسی یافت می شود. در اواخر سال 2022، سه برادر کارلایل، Argo Space را برای ایجاد زیرساخت در فضا تأسیس کردند. دید آنها فقط حمل و نقل در فضا نبود، بلکه نیاز به استفاده از پیشرانه ها از زمین برای حرکت در آسمان ها را نیز از بین بردند. ماهواره های آرگو اسپیس از آب نه تنها به عنوان پیشران، بلکه به عنوان خنک کننده و سپر تشعشع استفاده خواهند کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به ناوبری به", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/NHQ202604010115orig-1152x648-1793950034.jpg", "category": "اقتصاد و بازرگانی", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۵ آبان • ۱۷:۰۳"}, {"source": "Wired", "title": "RIP Cybertruck. You Were Unloved, Unwanted, and Utterly Absurd", "link": "https://www.wired.com/story/rip-cybertruck-you-were-unloved-unwanted-and-utterly-absurd/", "summary": "The decision to halt production of Tesla’s polarizing polygonal pickup marks the end of an error.", "date_str": "2026-11-06T14:20:59+00:00", "hash": "9dd9ae3208d150e7", "title_fa": "RIP Cybertruck. تو مورد بی مهری، ناخواسته و کاملا پوچ بودی", "summary_fa": "تصمیم برای توقف تولید پیکاپ چند ضلعی پلاریزه تسلا پایان یک خطا است. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Elon Musk در پستی در X، رسماً زمان را در Cybertruck اعلام کرد و اظهار داشت که \"تسلا در اواسط سال آینده تولید Cybertruck را در Gigafactory تگزاس به پایان خواهد رساند تا جایی برای افزایش تولید Cybercab ایجاد کند.\" این پیکاپ پلاریزه که کمتر از چهار سال تولید می‌شود، ظاهراً همانطور که زندگی می‌کرد در حال مرگ است، با این خبر که در انبوهی از پاسخ‌ها در ستایش EV و همچنین تمسخر آن مورد استقبال قرار گرفت. جیمز استار، که ادعا می‌کرد کارمند تسلا است، پست کرد که \"این غم انگیزترین خبر بود! Cybertruck (بود) بهترین خودروی فروخته شده تسلا\" درست در کنار کاربری به نام کاپیتان فورد که به سادگی به ماسک پاسخ داد: \"لعنت به آن جعبه‌ی گنده\". تسلا به درخواست WIRED برای اظهار نظر و توضیح درباره اینکه Cybertruck دیگر اصلا ساخته نخواهد شد، پاسخ نداده است. Cybertruck به طور انحصاری در Gigafactory Texas ساخته شده است، زیرا ظاهراً این تنها مرکز تسلا است که مجهز به ماشین آلات مورد نیاز برای ساخت بدنه منحصر به فرد فولاد ضد زنگ کامیون است که ظاهراً در برخی موارد شروع به زنگ زدگی کرده است. علیرغم افزایش تعداد زیادی رزرو - طبق گفته ماسک که در پایان سال 2023 اعلام کرد که تقاضا \"خارج از نمودارها\" بود، ظاهراً بیش از یک میلیون نفر بود - این کامیون موفق به فروش نشد و در مجموع تا مارس سال گذشته کمتر از 50000 دستگاه جابجا شد. EVWire به داده‌های Kelley Blue Book اشاره می‌کند که نشان می‌دهد تسلا 11586 سایبرتراک در سه فصل اول سال جاری در ایالات متحده فروخته است که نسبت به سال گذشته 28 درصد کاهش داشته است، و اضافه می‌کند", "image_url": "https://media.wired.com/photos/6aede0c1a88069e85ad40ac8/191:100/w_1280,c_limit/GettyImages-2199394161.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۵ آبان • ۱۷:۵۰"}, {"source": "Zoomit", "title": "تسلا «توقف تدریجی تولید» وانت افسانه‌ای سایبرتراک را کلید می‌زند", "link": "https://www.zoomit.ir/car/470607-tesla-cybertruck-production-wind-down-2027/", "summary": "ایلان ماسک اعلام کرد تسلا از اواسط سال ۲۰۲۷ تولید سایبرتراک را در تگزاس کاهش می‌دهد تا ظرفیت بیشتری برای ساخت تاکسی خودران سایبرکب فراهم کند.", "date_str": "2026-11-06T14:38:53+00:00", "hash": "5a3880b31dbbf3c0", "title_fa": "تسلا «توقف تدریجی تولید» وانت افسانه‌ای سایبرتراک را کلید می‌زند", "summary_fa": "ایلان ماسک اعلام کرد تسلا از اواسط سال ۲۰۲۷ تولید سایبرتراک را در تگزاس کاهش می‌دهد تا ظرفیت بیشتری برای ساخت تاکسی خودران سایبرکب فراهم کند. تبلیغات تسلا قصد دارد از اواسط سال ۲۰۲۷، «توقف تدریجی تولید» وانت برقی سایبرتراک را در کارخانه‌ی تگزاس شروع کند؛ تصمیمی که پس از چند سال فروش ضعیف این خودرو گرفته شده است. ایلان ماسک ، مدیرعامل تسلا، اعلام کرد که هدف از این تغییر، اختصاص ظرفیت تولید بیشتر به سایبرکب، تاکسی خودران جدید شرکت، خواهد بود. هنوز مشخص نیست که تولید این خودرو به کارخانه‌ی دیگری منتقل خواهد شد یا تسلا قصد دارد در نهایت تولید آن را به‌طور کامل متوقف کند. کارخانه‌ی گیگافکتوری تگزاس در شهر آستین، تنها مرکز شناخته‌شده‌ی تسلا است که تجهیزات لازم برای ساخت قطعات اختصاصی سایبرتراک را در اختیار دارد. به همین دلیل، انتقال خط تولید به تأسیسات دیگر احتمالاً با چالش‌هایی همراه خواهد بود. ماسک در پاسخ به یکی از کاربران ایکس، سایبرتراک را بهترین خودرویی توصیف کرد که تسلا تاکنون ساخته است. او همچنین از کاهش تولید این پیکاپ با عنوان «پایان یک دوران» یاد کرد؛ عبارتی که گمانه‌زنی‌ها درباره‌ی توقف کامل تولید سایبرتراک را افزایش داده است. سایبرتراک از زمان ورود به بازار نتوانست در فرآیند خرید و
