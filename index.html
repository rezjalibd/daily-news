یستی موجود در خون، این عارضه را پیش از انجام دادن آنژیوگرافی تهاجمی عروق قلب (کاتتریزاسیون قلبی) شناسایی می‌کند. این شاخص در مطالعه‌ای برای اعتبارسنجی روی نزدیک به هزار و ۸۰۰ بیمار، وضعیت حدود ۹۰ درصد از شرکت‌کنندگان را به‌درستی تشخیص داد. سندروم تاکوتسوبو که با نام سندروم قلب شکسته هم شناخته می‌شود، نوعی عارضه قلبی ناگهانی است که بیشتر زنان در سن یائسگی را درگیر می‌کند و ممکن است بر اثر فشار شدید عاطفی یا جسمی بروز کند. حدود ۲ درصد از بیمارانی که ابتدا تصور می‌شود دچار حمله قلبی شده‌اند، در واقع به این سندروم مبتلا هستند. این نسبت در میان زنان مبتلا به سندروم حاد عروق کرونر ممکن است به یک نفر از هر ۱۰ نفر برسد. با این حال، در مراحل اولیه ارزیابی، تشخیص این عارضه از حمله قلبی بسیار دشوار است. افراد مبتلا به سندروم تاکوتسوبو ممکن است ناگهان دچار درد در قفسه سینه، نتایج غیرطبیعی در نوار قلب و افزایش سطح آنزیم‌های قلبی شوند؛ نشانه‌هایی که به علائم حمله قلبی شباهت زیادی دارند. تفاوت اصلی این است که در سندرم تاکوتسوبو، عروق کرونر مسدود نمی‌شوند. به‌ گزارش ساینس‌دیلی، از آنجا که این دو عارضه ابتدا تقریبا یکسان به نظر می‌رسند، بسیاری از بیماران پیش از آنکه پزشکان علت علائمشان را تشخیص دهند، تحت کاتتریزاسیون تهاجمی قلب قرار می‌گیرند. روشی جدید برای شناسایی سندروم تاکوتسوبو گروهی بین‌المللی از پژوهشگران با همکاری نزدیک دانشمندان دانشگاه‌های زوریخ و گرایفس‌والد، یک نظام امتیازدهی تشخیصی طراحی و اعتبارسنجی کرده‌اند که هدف آن شناسایی سندروم تاکوتسوبو پیش از کاتتریزاسیون قلبی است. این ابزار جدید که شاخص بایوتاک (BioTAK) نام دارد، جنسیت را با چند نشانگر زیستی خونی مرتبط با فرایندهای مختلف دستگاه قلبی‌عروقی ترکیب می‌کند. پژوهشگران با استفاده از هوش مصنوعی مشخص کردند که کدام ترکیب از نشانگرهای زیستی، سودمندترین اطلاعات تشخیصی را فراهم می‌کند و سپس آن نشانگرها را در یک ابزار تصمیم‌گیری بالینی گنجاندند. شاخص بیوتک در گروه مستقلی متشکل از نزدیک به هزار و ۸۰۰ بیمار دیگر، سندروم تاکوتسوبو را با دقت بالایی شناسایی کرد. این سامانه با استفاده از آستانه‌هایی که از پیش تعیین شده بود، پیش از کاتتریزاسیون قلبی، وضعیت نزدیک به ۹۰ درصد از شرکت‌کنندگان را به‌درستی تشخیص داد. Read More This sectio وریسم بریتانیا می‌گوید پنج مردی که به ظن جرایم مرتبط با مواد منفجره در نزدیکی پایگاه نیروی هوایی سلطنتی فرفورد که میزبان نیروی هوایی ایالات متحده است، دستگیر شده‌اند، اکنون تحت بازداشت به ظن تدارک یک اقدام تروریستی هم هستند. پلیس مبارزه با تروریسم بریتانیا در حال انجام تحقیقات در مورد این حادثه است. پایگاه هوایی فرفورد محل استقرار دائمی شماری از نیروهای هوایی آمریکا است و از آن برای عملیات علیه ایران استفاده شده است. پلیس بریتانیا پیشتر اعلام کرده بود که در اطراف یک پایگاه نیروی هوایی یک حادثه امنیتی جدی رخ داده است و چند مرد در این ارتباط بامداد یکشنبه بازداشت شده‌اند. پلیس همچنین اعلام کرد که ۸۵ خانوار تخلیه شده‌اند و همچنان یک محدوده امنیتی ۴۰۰ متری برقرار است. ریچارد اوکون، معاون رئیس پلیس بریتانیا، گفت که تحقیقات برای مشخص شدن ماهیت دقیق این حادثه در جریان است. او گفت که این نیرو همکاری نزدیکی با شرکای خود در پلیس مبارزه با تروریسم دارد. پلیس پیشتر هم اعلام کرد که یک تیم خنثی‌سازی مواد منفجره ارتش در حال بررسی سه خودرو در نزدیکی پایگاه نیروی هوایی سلطنتی فرفورد در گلاسترشر است و در حالی که تحقیقات ادامه دارد خانه‌های روستای مجاور ولفورد تخلیه شده‌اند و یک مانع امنیتی در منطقه ایجاد شده است. حضور گسترده نیروهای امدادی از جمله تیم‌های واکنش سریع در این منطقه مشاهده شده است. پلیس گلاسترشر هم پیشتر در بیانیه‌ای گفت: «پس از اعلام یک حادثهٔ مهم، در حال حاضر تعدادی در حال ترک خانه‌هایشان هستند. این اقدام پس از بازداشت چند مرد به ظن ارتکاب جرایمی تحت قانون مواد منفجره صورت گرفته است.» بر اساس ویدئویی که روزنامه دیلی میل از دستگیری مظنونان منتشر کرده است و نیز دیگر ویدئوهایی که منتشر شده‌اند، بی‌بی‌سی وریفای محل بازداشت را در ۳۵۰ متری ورودی‌ امدادرسانی اضطراری به باندهای این"}, {"source": "BBC Persian", "title": "از پایگاه هوایی فرفورد بریتانیا چه می‌دانیم؟", "link": "https://www.bbc.com/persian/articles/c317jkdxj8d4o?at_medium=RSS&at_campaign=rss", "summary": "پایگاه نیروی هوایی سلطنتی فرفورد در گلاسترشر انگلستان متعلق به بریتانیاست و نیروی هوایی آمریکا هم برای عملیات از آن استفاده می‌کند. به گفته وزارت دفاع بریتانیا، نیروی هوایی آمریکا از فرفورد به‌عنوان پایگاه عملیاتی بمب‌افکن‌های پبشاهنگ استفاده می‌کند. بر اساس اطلاعات رسمی نیروی هوایی آمریکا، پایگاه فرفورد محل استقرار بمب‌افکن‌های پیشاهنگ در اروپا است.", "date_str": "2026-09-27T14:25:20+00:00", "hash": "c23b2f88991882b7", "title_fa": "از پایگاه هوایی فرفورد بریتانیا چه می‌دانیم؟", "summary_fa": "پایگاه نیروی هوایی سلطنتی فرفورد در گلاسترشر انگلستان متعلق به بریتانیاست و نیروی هوایی آمریکا هم برای عملیات از آن استفاده می‌کند. به گفته وزارت دفاع بریتانیا، نیروی هوایی آمریکا از فرفورد به‌عنوان پایگاه عملیاتی بمب‌افکن‌های پبشاهنگ استفاده می‌کند. بر اساس اطلاعات رسمی نیروی هوایی آمریکا، پایگاه فرفورد محل استقرار بمب‌افکن‌های پیشاهنگ در اروپا است. در این پایگاه، بمب‌افکن‌های بی-۵۲ استراتوفرترس، بی-۱بی لنسر، و بی-۲ اسپریت در قالب ماموریت‌های ضربتی مستقر بوده‌اند. نیروی هوایی آمریکا می‌گوید این استقرار برای افزایش آمادگی و آموزش‌های مشترک و یکپارچگی عملیاتی با نیروهای متحد و اروپایی انجام می‌شود. یکی از یگان‌های اصلی آمریکا در این پایگاه یگان هوایی ۵۰۱ پشتیبانی رزم است که طیف گسترده‌ای از عملیات‌ پروازی را پشتیبانی می‌کند از جمله: به گفته نیروی هوایی آمریکا، استقرار بمب‌افکن‌ها در فرفورد به آمریکا امکان می‌دهد هواپیماهایش را در یک پایگاه اروپایی مستقر و با نیروهای ناتو و متحدان اروپایی تمرین و عملیات مشترک کند. در فوریه ۲۰۲۲، بمب‌افکن‌های بی-۵۲ آمریکا برای یک ماموریت ضربتی در فرفرود فرود آمدند. نیروی هوایی سلطنتی بریتانیا پارسال گفته بود که دو فروند بی-۵۲ مستقر در فرفورد برای ماموریت‌ به سمت خاورمیانه پرواز کردند. بر اساس گزارش رسمی نیروی هوایی آمریکا در سال ۲۰۱۴، فرفورد دارای یک باند ۳۰۴۸ متری است که یکی از طولانی‌ترین باندها در بریتانیاست. نیروی هوایی آمریکا این ویژگی و موقعیت جغرافیایی و امکانات پشتیبانی پایگاه را از عواملی دانسته است که آن را برای عملیات هواپیماهای بزرگ و سنگین مناسب می‌کند. وزارت دفاع بریتانیا نیز در سال ۲۰۲۲ اعلام کرد که پروژه‌ای ۲۵ میلیون پوندی برای بازسازی سطح راه‌های تاکسی‌ و محل‌ پارک هواپیما انجام شده است. فرفورد در سال ۱۹۴۴عملیاتی و در جنگ جهانی دوم نیز استفاده شد."}, {"source": "BBC Persian", "title": "حمله با زبان اقتصاد؛ قالیباف چگونه آمریکا را هدف گرفته است؟", "link": "https://www.bbc.com/persian/articles/c6y4zz0xw18eo?at_medium=RSS&at_campaign=rss", "summary": "محمدباقر قالیباف، رئیس مجلس ایران، در ماه‌های اخیر از پیام‌های انگلیسی‌زبان خود در شبکه ایکس برای مخاطب قرار دادن افکار عمومی آمریکا استفاده کرده است. این پیام‌ها که اغلب با استفاده از اصطلاحات بازارهای مالی نوشته شده‌اند، بر هزینه‌های اقتصادی رویارویی با ایران برای آمریکا و تردید درباره توانایی دولت ترامپ در مهار پیامدهای آن تمرکز دارند.", "date_str": "2026-09-27T04:24:13+00:00", "hash": "86e509d1b4d83ef2", "title_fa": "حمله با زبان اقتصاد؛ قالیباف چگونه آمریکا را هدف گرفته است؟", "summary_fa": "محمدباقر قالیباف، رئیس مجلس ایران، در ماه‌های اخیر از پیام‌های انگلیسی‌زبان خود در شبکه ایکس برای مخاطب قرار دادن افکار عمومی آمریکا استفاده کرده است. این پیام‌ها که اغلب با استفاده از اصطلاحات بازارهای مالی نوشته شده‌اند، بر هزینه‌های اقتصادی رویارویی با ایران برای آمریکا و تردید درباره توانایی دولت ترامپ در مهار پیامدهای آن تمرکز دارند. به‌ویژه از ماه اوت، بسیاری از این پیام‌ها با بهره‌گیری از اصطلاحات و ادبیات رایج در بازارهای مالی منتشر شده‌اند تا این استدلال را مطرح کنند که اسکات بسنت، وزیر دارایی آمریکا، و دولت ترامپ قادر به مهار تورم و اختلال‌های اقتصادی ناشی از این درگیری نیستند. در کنار روایت‌های آشنا درباره توانایی‌های نظامی ایران و اهرم فشار این کشور در تنگه هرمز، به نظر می‌رسد این پست‌ها برای برجسته کردن نقاط آسیب‌پذیر اقتصاد آمریکا و ایجاد تردید درباره توانایی واشنگتن در مدیریت قیمت انرژی و بازارهای مالی طراحی شده‌اند. برخی ناظران معتقدند پیام‌های انگلیسی‌زبان محمدباقر قالیباف به‌گونه‌ای تنظیم شده‌اند که مخاطبان آمریکایی را هدف قرار دهند؛ موضوعی که گمانه‌زنی‌هایی را درباره این پرسش برانگیخته است که چه کسانی ممکن است در شکل‌گیری محتوای این پیام‌ها نقش داشته باشند. به نظر می‌رسد هدف این پیام‌ها آن است که توجه‌ها را از هزینه‌هایی که ایران متحمل می‌شود به هزینه‌هایی که آمریکا با آن روبه‌رو است، معطوف کنند. پیام‌های قالیباف با تاکید بر تورم، اختلال در بازار نفت و نااطمینانی سرمایه‌گذاران، می‌کوشند این استدلال را تقویت کنند که ادامه رویارویی با ایران می‌تواند هزینه‌های اقتصادی و سیاسی قابل توجهی برای آمریکا در پی داشته باشد، به‌ویژه در آستانه انتخابات میان‌دوره‌ای این کشور. محمدباقر قالیباف بارها استدلال کرده است که دولت دونالد ترامپ در حمله به ایران، منافع اسرائیل را بر منافع شهروندان عادی آمریکا ترجیح داده است."}, {"source": "BBC Persian", "title": "از عروس ایتالیایی تا قدرتمندترین زن سیاست هند؛ کتاب خاطرات سونیا گاندی؛ روایتی از عشق، قدرت و فقدان", "link": "https://www.bbc.com/persian/articles/cx2z7yzzjwgo?at_medium=RSS&at_campaign=rss", "summary": "از زنی که با اکراه وارد سیاست شد تا قدرتمندترین چهره حزب کنگره؛ سونیا گاندی در آستانه انتشار خاطراتش قرار دارد، کتابی که بسیاری امیدوارند به برخی از بزرگ‌ترین معماهای سیاست معاصر هند پاسخ دهد. از چرایی نپذیرفتن مقام نخست‌وزیری گرفته تا نقش خاندان نهرو-گاندی در سرنوشت قدیمی‌ترین حزب سیاسی این کشور، خاطرات او می‌تواند نگاه تازه‌ای به یکی از بانفوذترین و در عین حال مرموزترین شخصیت‌های سیاسی هند ارائه کند.", "date_str": "2026-09-27T05:52:00+00:00", "hash": "0648edfb374b15a3", "title_fa": "از عروس ایتالیایی تا قدرتمندترین زن سیاست هند؛ کتاب خاطرات سونیا گاندی؛ روایتی از عشق، قدرت و فقدان", "summary_fa": "از زنی که با اکراه وارد سیاست شد تا قدرتمندترین چهره حزب کنگره؛ سونیا گاندی در آستانه انتشار خاطراتش قرار دارد، کتابی که بسیاری امیدوارند به برخی از بزرگ‌ترین معماهای سیاست معاصر هند پاسخ دهد. از چرایی نپذیرفتن مقام نخست‌وزیری گرفته تا نقش خاندان نهرو-گاندی در سرنوشت قدیمی‌ترین حزب سیاسی این کشور، خاطرات او می‌تواند نگاه تازه‌ای به یکی از بانفوذترین و در عین حال مرموزترین شخصیت‌های سیاسی هند ارائه کند. سونیا گاندی زمانی که در سال ۱۹۹۸ به ریاست حزب کنگره، اصلی‌ترین حزب مخالف در هند، رسید، چهره‌ای نامنتظره در سیاست بود؛ شخصیتی که هنوز برای بسیاری ناشناخته و مرموز به نظر می‌رسید. سونیا گاندی که در ایتالیا به دنیا آمده بود و همسر راجیو گاندی، نخست‌وزیر پیشین هند، به شمار می‌رفت، سال‌ها از حضور در کانون سیاست دوری کرده بود؛ تا اینکه هدایت حزبی را بر عهده گرفت که در بخش بزرگی از تاریخ هندِ مستقل، بازیگر اصلی سیاست هند بود. مجله «ایندیا تودی» در ماه‌های نخست رهبری سونیا گاندی، او را «معمایی برای اعضای حزبش» توصیف کرد؛ شخصیتی که به سختی می‌شد او را شناخت، پشت حلقه‌های امنیتی از دید عموم دور نگه داشته می‌شد و به گفته این نشریه، به اظهارنظرهای کوتاه و مختصر با لهجه‌ای بیگانه شناخته می‌شد. با این حال، در پس آن ظاهر کم‌حرف و محتاط، مجله «ایندیا تودی» سیاستمداری را می‌دید که به‌تدریج در حال آموختن شیوه اعمال قدرت بود. او به دیدگاه‌های متفاوت گوش می‌داد، اطلاعات جمع‌آوری می‌کرد و سپس خودش تصمیم نهایی را می‌گرفت. این نشریه نوشت: «هیچ‌کس از فرایند تصمیم‌گیری کنار گذاشته نمی‌شود و صدایی خاموش نمی‌ماند. اما در نهایت، این نظر اوست که دست بالا را پیدا می‌کند.» اکنون، نزدیک به سه دهه پس از آغاز مسیری سیاسی که او را از زنی بی‌میل به ورود به سیاست و دور از دایره قدرت، به قدرتمندترین چهره حزب کنگره،"}, {"source": "BBC Persian", "title": "شهری که هوش مصنوعی آن را می‌گرداند؛ وقتی انسان‌ها نگاه نمی‌کنند آنها چه می‌کنند؟", "link": "https://www.bbc.com/persian/articles/c5yz4zz2vl2o?at_medium=RSS&at_campaign=rss", "summary": "از خرید و رزرو سفر تا مدیریت کارهای آنلاین، «عامل‌های هوش مصنوعی» به‌سرعت در حال ورود به زندگی روزمره کاربران هستند و شرکت‌های بزرگ فناوری میلیاردها دلار برای توسعه آنها سرمایه‌گذاری می‌کنند. اما هم‌زمان با گسترش این سامانه‌های خودمختار، پژوهش‌های جدید و آزمایش‌های میدانی پرسش مهمی را مطرح کرده‌اند: اگر این عامل‌ها تصمیم‌هایی غیرمنتظره بگیرند یا از کنترل خارج شوند، چه اتفاقی خواهد افتاد؟", "date_str": "2026-09-26T23:50:09+00:00", "hash": "8b0e19838bdd14cd", "title_fa": "شهری که هوش مصنوعی آن را می‌گرداند؛ وقتی انسان‌ها نگاه نمی‌کنند آنها چه می‌کنند؟", "summary_fa": "از خرید و رزرو سفر تا مدیریت کارهای آنلاین، «عامل‌های هوش مصنوعی» به‌سرعت در حال ورود به زندگی روزمره کاربران هستند و شرکت‌های بزرگ فناوری میلیاردها دلار برای توسعه آنها سرمایه‌گذاری می‌کنند. اما هم‌زمان با گسترش این سامانه‌های خودمختار، پژوهش‌های جدید و آزمایش‌های میدانی پرسش مهمی را مطرح کرده‌اند: اگر این عامل‌ها تصمیم‌هایی غیرمنتظره بگیرند یا از کنترل خارج شوند، چه اتفاقی خواهد افتاد؟ از خرید کالا و رزرو سفر گرفته تا ساخت وب‌سایت، «عامل‌های هوش مصنوعی» بیش از پیش برای انجام وظایفی به کار گرفته می‌شوند که هر روز پیچیده‌تر می‌شوند. این عامل‌ها در واقع نوعی چت‌بات هستند که برای انجام وظایف مشخص طراحی شده‌اند و می‌توان آنها را طوری تنظیم کرد که به‌طور مستقل کارهای مختلف را انجام دهند؛ امکانی که به کاربران اجازه می‌دهد وقت خود را صرف امور دیگر کنند. اما مجموعه رو به رشدی از پژوهش‌ها، همراه با نمونه‌های هشداردهنده در دنیای واقعی، نشان می‌دهد که این خودمختاری با غیرقابل‌پیش‌بینی بودن و احتمالا خطر همراه است. هم‌زمان با آنکه شرکت‌های بزرگ فناوری سرمایه‌گذاری‌های کلانی در حوزه هوش مصنوعی انجام می‌دهند و بیش از پیش به سوی ارائه خدمات مبتنی بر «عامل‌های هوش مصنوعی» حرکت می‌کنند، برخی کارشناسان این پرسش را مطرح کرده‌اند که آیا به اندازه کافی درباره پیامدهای احتمالی خارج شدن این عامل‌ها از کنترل فکر کرده‌ایم یا نه. یکی از آزمایش‌های اخیر تلاش کرد با رها کردن عامل‌ها در یک دنیای مجازی، تاثیر آن‌ها را در دنیای واقعی بررسی کند. این نخستین مطالعه بلندمدت از این نوع بود که برای بررسی رفتار شخصیت‌های مجازی مختلف، تحت کنترل چهار مدل هوش مصنوعی کلود، گروک، جی‌پی‌تی و جمینای، طراحی شد. هدف این بود که مشخص شود این سامانه‌ها در یک دوره ۱۵ روزه و بدون دخالت انسان چگونه عمل می‌کنند. این ربات‌ها بدون محدودیت عمل می‌کردند و می‌توانستند از میان ۱۴۰ اقدام مختلف، از راه‌اندازی"}, {"source": "BBC Persian", "title": "هیولاهای هولناکی که پیش از دایناسورها بر زمین حکم می‌راندند", "link": "https://www.bbc.com/persian/articles/c87egv9p9q3o?at_medium=RSS&at_campaign=rss", "summary": "مدت‌ها قبل از تی‌رکس، زمین تحت سلطه ابرگوشتخوارانی بود که از هر آنچه هالیوود به تصویر کشیده هم عجیب‌تر و وحشتناک‌تر بودند.", "date_str": "2026-09-26T23:26:08+00:00", "hash": "031642c53d5d37d4", "title_fa": "هیولاهای هولناکی که پیش از دایناسورها بر زمین حکم می‌راندند", "summary_fa": "مدت‌ها قبل از تی‌رکس، زمین تحت سلطه ابرگوشتخوارانی بود که از هر آنچه هالیوود به تصویر کشیده هم عجیب‌تر و وحشتناک‌تر بودند. دو جانور یکدیگر را دور زدند و هر دو بدن قوی و بی‌موی رقیب خود را ارزیابی ‌کردند. با دندان‌های شمشیری مانند چاقوی گوشت‌بری، پنجه‌های سوراخ‌کننده و پوستی به ضخامت کرگدن، فک‌های خود را تقریباً ۹۰ درجه باز کردند و وارد نبرد شدند. از سمت راست یکی از حیوانات، دندان‌های دیگری از بالا به پایین کوبیده شد. در یک چشم به هم زدن، همه چیز تمام شد. مهاجم با فرو بردن دندان‌های نیشی درازخود در پوزه مکعبی حریفش، مانند سوزن‌های داغ از میان موم، پیروزی را از آن خود کرد. این اتفاق یا چیزی شبیه آن واقعا رخ داده است. حدود یک چهارم میلیارد سال بعد، در یک روز آفتابی در مارس ۲۰۲۱، جولین بنوا جعبه‌ای دریافت کرد تا نگاهی به آن بیندازد. او در یک دفتر دلپذیر و خنک در موزه تاریخ طبیعی ایزیکو در کیپ تاون آفریقای جنوبی کار می‌کرد، جایی که از او دعوت شده بود تا از مجموعه‌های فسیلی دانشگاه بازدید کند. جولین بنوا، دانشیار مطالعات تکاملی در دانشگاه ویت واترزراند ژوهانسبورگ، می‌گوید: «این جعبه حداقل ۳۰ سال بود که باز نشده بود.» در داخل آن انبوهی از استخوان‌ها، از جمله جمجمه‌های بی‌شماری وجود داشت که بسیاری از آن‌ها اشتباه برچسب‌گذاری شده بودند. او در حین مرتب کردن، طبقه‌بندی مجدد و اختصاص دادن آنها به گونه‌های منقرض شده، متوجه یک سطح کوچک و براق شد. بنوا می‌گوید: «لحظه هیجان‌انگیزی بود. فورا فهمیدم که به چه چیزی نگاه می‌کنم.» او با لبخندی پهن، به دیدن همکارش رفت و از او خواست میکروسکوپش را قرض بگیرد تا نگاه دقیق‌تری بیندازد. سطح براق متعلق به یک دندان بود. این دندان نوک‌تیز و گرد بود و در جمجمه حیوان دیگری، احتمالاً عضوی از همان گونه، فرورفته بود. بنوا"}, {"source": "BBC Persian", "title": "شورای عالی امنیت ملی ایران: علیه محدودیت‌های هوایی اقدام نظامی نخواهیم کرد", "link": "https://www.bbc.com/persian/articles/cq20vv86l7n5o?at_medium=RSS&at_campaign=rss", "summary": "دبیرخانه شورای عالی امنیت ملی ایران می‌گوید که این کشور قصد ندارد برای مقابله با محدودیت‌های هوایی دست به اقدام نظامی بزند.", "date_str": "2026-09-26T18:04:04+00:00", "hash": "34764eccac1a9fe9", "title_fa": "شورای عالی امنیت ملی ایران: علیه محدودیت‌های هوایی اقدام نظامی نخواهیم کرد", "summary_fa": "دبیرخانه شورای عالی امنیت ملی ایران می‌گوید که این کشور قصد ندارد برای مقابله با محدودیت‌های هوایی دست به اقدام نظامی بزند. این نهاد در اطلاعیه‌اش گفته است که برخی تفاسیر و نقل‌قول‌ها درباره اظهارات محسن رضایی، دبیر شورای عالی امنیت ملی در مورد محدودیت‌های هوایی اخیر «خلاف واقع است» و « ایران برای رفع این محدودیت‌ها در حال مذاکره با کشورهای مربوطه است.» در این اطلاعیه تأکید شده است که ایران قصد «مقابله‌به‌مثل نظامی» در واکنش به محدودیت‌های هوایی اخیر ندارد. پیشتر محسن رضایی، دبیر شورای عالی امنیت ملی‌، در گفت‌وگو با تلویزیون ایران به کشورهای همسایه ایران هشدار داده بود که «اگر کشوری وارد همکاری و ماجراجویی با آمریکا شود، فرودگاه‌های آنجا هم نمی‌توانند پرواز داشته باشند. ... اگر شما با آمریکا باشید و (جلوی) سفر تجار ما را بگیرید و بخواهید جهانگردان به ایران پرواز نکنند، کالاهای ما از طریق هوایی وارد نشود ... شما می‌گویید ما بنشینیم و بگوییم شما دوست و برادر ما هستید و رفتید با آمریکایی‌ها کنار آمدید و ما همین‌طور شما را تماشا کنیم؟» محمد مخبر، مشاور و دستیار رهبر جمهوری اسلامی، هم در اظهارات مشابهی گفته بود: «اگر ایران امکان پرواز و دریافت خدمات فرودگاهی نداشته باشد هیچ کشوری در منطقه هم این امکان را نخواهد داشت.» امروز محمد اسماعیل کوثری، عضو کمیسیون امنیت ملی و سیاست خارجی مجلس شورای اسلامی ایران، هم گفت: «محاصره هوایی نمی‌تواند تداوم داشته باشد» و افزود «اقداماتی خواهیم کرد که این محاصره خنثی شود.» آقای کوثری تهدید کرد: «در عمل بلایی سرشان می‌آوریم که از محاصره پشیمان شوند. فشار محاصره هوایی ایران بر دوش مردم است.» آمریکا از هفته گذشته حلقه محاصره ایران را تنگتر کرده و دامنه آن را به پرواز هواپیماهای ایران و ارائه خدمات به آن‌ها گسترده است. آمریکا ۲۷ شرکت هوایی ایران را در فهرست تحریم‌ قرار داد که از ۲۳"}, {"source": "Radio Farda", "title": "«حادثه مهم» امنیتی در اطراف پایگاه مورد استفاده آمریکا برای حمله به ایران؛ پلیس بریتانیا عده‌ای را بازداشت کرد", "link": "https://www.radiofarda.com/a/men-arrested-in-major-incident-at-uk-air-base-used-by-us/33865226.html", "summary": "پلیس بریتانیا روز یکشنبه ۵ مهر چند نفر را به ظن ارتکاب جرایم مرتبط با مواد منفجره در نزدیکی یک پایگاه هوایی مورد استفاده آمریکا برای حمله به اهدافی در ایران بازداشت کرد.", "date_str": "2026-09-27T12:49:07+00:00", "hash": "8730f75c31e667b8", "title_fa": "«حادثه مهم» امنیتی در اطراف پایگاه مورد استفاده آمریکا برای حمله به ایران؛ پلیس بریتانیا عده‌ای را بازداشت کرد", "summary_fa": "پلیس بریتانیا روز یکشنبه ۵ مهر چند نفر را به ظن ارتکاب جرایم مرتبط با مواد منفجره در نزدیکی یک پایگاه هوایی مورد استفاده آمریکا برای حمله به اهدافی در ایران بازداشت کرد. خبرگزاری رویترز گزارش داده که همزمان کارشناسان خنثی‌سازی بمب ارتش بریتانیا در حال بازرسی خودروها بودند و شماری از خانه‌ها نیز در پی اعلام یک «حادثه مهم» تخلیه شدند. دولت بریتانیا که به آمریکا اجازه استفاده از پایگاه هوایی سلطنتی «فرفورد» برای حمله به موشک‌های ایرانیِ مورد استفاده علیه کشتی‌ها در تنگه هرمز را داده است، اعلام کرد اندی برنهام، نخست‌وزیر، در جریان آخرین تحولات این حادثه قرار گرفته است. سپاه پاسداران انقلاب اسلامی اوایل تیر ماه هشدار داده بود هر پایگاهی که برای حمله به ایران مورد استفاده قرار گیرد، «هدف مشروع» خواهد بود. یک شاهد عینی به رویترز گفت پلیس مسلح مسیر دسترسی به دروازه اصلی پایگاه را مسدود کرده و تجهیزات و ماشین‌آلاتی نیز در مقابل ورودی‌های پایگاه مستقر شده بود. ساکنان روستایی در نزدیکی پایگاه در ساعات اولیه بامداد از خواب بیدار و از آنها خواسته شد خانه‌های خود را ترک کنند. حدود ۳۰ خودروی امدادی، از جمله خودروهای پلیس، آمبولانس‌ها و خودروهای آتش‌نشانی، در روستای فرفورد در نزدیکی پایگاه مستقر شده بودند و یک بالگرد نیز بر فراز منطقه پرواز می‌کرد. چند رسانه بریتانیایی، از جمله بی‌بی‌سی و اسکای‌نیوز، گزارش دادند که نیروهای مبارزه با تروریسم تحقیقات درباره این حادثه در نزدیکی پایگاه هوایی فرفورد را برعهده گرفته‌اند. پلیس منطقه گلاسترشر در بیانیه‌ای اعلام کرد: «در پی اعلام یک حادثه مهم، در حال حاضر شماری از املاک در منطقه ولفورد تخلیه می‌شوند. این اقدام پس از بازداشت چند نفر به ظن ارتکاب جرایمی در چارچوب قانون مواد منفجره انجام شده است.» پلیس افزود: «تیم تخصصی ارتش برای خنثی‌سازی مهمات و مواد منفجره در حال بررسی تعدادی خودرو است.»"}, {"source": "Radio Farda", "title": "ترامپ: پیشنهاد ایران را رد کردم؛ عراقچی: منتظریم واسطه‌ها نظر قطعی را اعلام کنند", "link": "https://www.radiofarda.com/a/trump-says-rejected-iran-deal-for-reopening-hormuz-strait/33864881.html", "summary": "در پی اعلام موضع دونالد ترامپ مبنی بر رد پیشنهاد تازه تهران       tech: [{"source": "TechCrunch AI", "title": "Google tests buying from Walmart-owned Flipkart through Gemini and AI Mode in India", "link": "https://techcrunch.com/2026/09/26/google-tests-buying-from-walmart-owned-flipkart-through-gemini-and-ai-mode-in-india/", "summary": "The limited test covers select products and users, with a broader rollout planned for later in October.", "date_str": "2026-09-27T01:30:00+00:00", "hash": "f69dc8e1ee6ccb8b", "title_fa": "گوگل خرید از Flipkart متعلق به Walmart را از طریق Gemini و AI Mode در هند آزمایش می کند", "summary_fa": "این آزمایش محدود محصولات و کاربران منتخب را تحت پوشش قرار می‌دهد و عرضه گسترده‌تری برای اواخر ماه اکتبر برنامه‌ریزی شده است. گوگل آزمایش راهی را برای خریداران در هند آغاز کرده است تا بتوانند مستقیماً از طریق Gemini و AI Mode محصولات را از Flipkart متعلق به Walmart خریداری کنند، زیرا این غول جستجو به دنبال گسترش خدمات هوش مصنوعی خود از کشف محصول به تراکنش است. به گفته افرادی که با این موضوع آشنا هستند و تجربه مشاهده شده توسط TechCrunch، کاربران در این آزمایش دکمه خرید را در لیست های محصولات Flipkart انتخابی مشاهده می کنند که در حالت هوش مصنوعی Gemini و Google ظاهر می شود، که آنها را مستقیماً بدون خروج از رابط هوش مصنوعی به جریان پرداخت Flipkart می برد. این افراد به TechCrunch گفتند که آزمایش اولیه محدود به برخی از کاربران و مجموعه کوچکی از محصولات از جمله گوشی های هوشمند، لوازم الکترونیکی و لوازم جانبی موبایل است. سایر کاربران همچنان لیست‌های محصولات معمولی Flipkart را در Gemini و حالت AI بدون گزینه خرید مستقیم از رابط هوش مصنوعی مشاهده می‌کنند. یکی از این افراد گفت، گوگل قصد دارد این تجربه را در اواخر ماه اکتبر، پیش از فصل خرید جشن هند، به طور گسترده‌تری عرضه کند. این آزمایش زمانی انجام می‌شود که گوگل و رقبای خود از جمله OpenAI در حال افزودن قابلیت‌های تجاری به پیشنهادات هوش مصنوعی خود هستند و تلاش می‌کنند فراتر از پاسخگویی به سؤالات خرید و توصیه محصولات برای ایفای نقش مستقیم‌تر در خریدهای آنلاین حرکت کنند. یکی از سخنگویان گوگل در پاسخ به سوالی درباره تست Flipkart، به TechCrunch گفت که این شرکت همیشه در ح ک حمام خون کاملا یک طرفه است\" و بیمه‌گران در طرف بازنده بودند. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها"}, {"source": "NYT Tech", "title": "As A.I. Accelerates, Governments Are Increasingly Being Left Behind", "link": "https://www.nytimes.com/2026/09/27/technology/ai-government-regulation.html", "summary": "The gap between technology and policymaking has gotten wider than ever with artificial intelligence, leaving a global policy vacuum as A.I. models rapidly advance.", "date_str": "2026-09-27T11:22:48+00:00", "hash": "088ffd06a858e75d", "title_fa": "به عنوان A.I. تسریع می شود، دولت ها به طور فزاینده ای عقب می مانند", "summary_fa": "شکاف بین فناوری و سیاست گذاری با هوش مصنوعی بیشتر از همیشه شده است و یک خلاء سیاست جهانی را به عنوان A.I باقی می گذارد. مدل ها به سرعت پیشرفت می کنند"}, {"source": "The Guardian AI", "title": "Democracy blindsides Silicon Valley’s power players looking to transform the world with AI", "link": "https://www.theguardian.com/technology/ng-interactive/2026/sep/27/democracy-ai-datacenters-power", "summary": "‘The push against datacenters speaks to the frustration of people who don’t feel they are making the choices in their lives’ The Stanford ethicist Rob Reich was once invited to a dinner organized by a Silicon Valley mogul to discuss what a state designed to maximize science and tech powered by commercial models might look like. The gathered technologists were drawn to the idea of building a small nation-state dedicated to the endeavor, Reich recalls in “ System Error : Where Big Tech Went Wrong and How We Can Reboot it”. When Reich asked whether this state would be a democracy, he got a cool no. “Democracy is too slow, and it holds science back,” he was told. “To optimize for science, we need a beneficent technocrat in charge.” Continue reading...", "date_str": "2026-09-27T11:00:03+00:00", "hash": "97003ad1d9b35162", "title_fa": "دموکراسی بازیگران قدرتمند سیلیکون ولی را که به دنبال تغییر جهان با هوش مصنوعی هستند، کور می کند", "summary_fa": "«فشار علیه دیتاسنترها حاکی از سرخوردگی افرادی است که احساس نمی‌کنند در زندگی خود انتخاب می‌کنند.» راب رایش، اخلاق‌دان استنفورد، زمانی به شامی که توسط یک غول دره سیلیکون ترتیب داده شده بود دعوت شد تا درباره این موضوع صحبت کند که ایالتی که برای به حداکثر رساندن علم و فناوری با مدل‌های تجاری طراحی شده است، چگونه ممکن است ظاهر شود. رایش در کتاب «خطای سیستم: جایی که فناوری بزرگ اشتباه رفت و چگونه می‌توانیم آن را راه‌اندازی مجدد کنیم» به خاطر می‌آورد، فن‌آوران گردآوری شده به ایده ساختن یک دولت-ملت کوچک اختصاص داده شده به این تلاش کشیده شدند. وقتی رایش از او پرسید که آیا این ایالت دموکراسی خواهد بود یا خیر، جواب منفی داد. به او گفته شد: «دموکراسی بسیار کند است و علم را عقب نگه می‌دارد. \"برای بهینه سازی برای علم، ما به یک تکنوکرات مفید نیاز داریم.\" به خواندن ادامه دهید... تکنوها روی چیزی بودند. بازیگران قدرت سیلیکون ولی به تازگی توسط دموکراسی که به برنامه آنها برای تغییر جهان با هوش مصنوعی برخورد کرده است، کور شده اند. گروهی که هرگز در عظمت جاه طلبی های خود شک نداشتند، به طور غیرمنتظره ای پروژه خود را در صندلی داغ می بینند، و آنها را به موقعیت غیرعادی وادار می کنند که مجبور شوند افراد بزرگ را که شسته نشده اند را از شایستگی تلاش خود متقاعد کنند. تاکنون مردم خرید نکرده اند. بزرگان سیلیکون ولی با وجود ضریب هوشی فوق‌العاده بالا و کیف پول‌های انبوه آن‌ها کاملاً نمی‌دانند چه کنند. آمریکایی‌ها هر روز در برابر مراکز داده‌ای هوش مصنوعی که در جوامعشان رشد می‌کنند، به مبارزه می‌پردازند. روستاها، شهرستان ها، شهرها و ایالت ها مهلت قانونی و ممنوعیت هایی را برای توسعه بیشتر وضع می کنند. در حالی که واکنش‌ها عمدتاً بر توقف گسترش سایت‌های پراکنده مملو از سرورهای رایانه‌ای پر انرژی"}, {"source": "The Guardian AI", "title": "Bill Gates says unchecked AI could ‘cause a billion deaths’ in call for regulation", "link": "https://www.theguardian.com/us-news/2026/sep/27/bill-gates-artificial-intelligence-kristen-welker", "summary": "Microsoft co-founder and philanthropist speaks with NBC’s Kristen Welker in interview airing on Sunday Bill Gates has called on the US’s federal legislators and law enforcers to regulate the development of artificial intelligence (AI), saying in an interview airing on Sunday that the technology left unchecked could cause “a billion deaths” and “no one thinks self-regulation is enough”. “You need law enforcement and the politicians to get into the discussion about what safeguards and monitoring look like,” the Microsoft co-founder and philanthropist said to Kristen Welker, the NBC Meet the Press host. “And that has to be a required thing.” Continue reading...", "date_str": "2026-09-27T09:00:01+00:00", "hash": "34669ce72e58c1bc", "title_fa": "بیل گیتس می‌گوید هوش مصنوعی کنترل نشده می‌تواند باعث «مرگ میلیاردها نفر» شود", "summary_fa": "یکی از بنیانگذاران و نیکوکار مایکروسافت در مصاحبه ای که یکشنبه پخش شد با کریستن ولکر از NBC صحبت می کند بیل گیتس از قانونگذاران فدرال ایالات متحده و مجریان قانون خواست تا توسعه هوش مصنوعی (AI) را تنظیم کنند و در مصاحبه ای که یکشنبه پخش شد گفت که این فناوری کنترل نشده می تواند باعث \"یک میلیارد مرگ\" شود و \"هیچکس فکر نمی کند خودتنظیمی کافی است\". بنیانگذار و نیکوکار مایکروسافت به کریستن ولکر، مجری NBC Meet the Press گفت: «شما به مجریان قانون و سیاستمداران نیاز دارید تا وارد بحث در مورد اینکه پادمان ها و نظارت ها چگونه به نظر می رسند. \"و این باید یک چیز ضروری باشد.\" ادامه مطلب... گیتس با استفاده از اصطلاحی که برای توصیف هزینه ای که برای اداره یک کسب و کار لازم است، ادامه داد: «این کار کمی سربار برای صنعت خواهد بود – اما نه کاهش چشمگیر کاری که آنها انجام می دهند.» بخش دیگری از مصاحبه - گزیده‌هایی از آن که NBC از قبل منتشر کرده بود - شاهد بودیم که گیتس به‌طور چشمگیری هشدار داد که هوش مصنوعی در دستان اشتباه «مطمئناً به اندازه‌ای قدرتمند است که رویدادهایی را که، می‌دانید، باعث مرگ میلیاردها نفر شوند، به‌قدر کافی قدرتمند خواهد کرد». گیتس با انعکاس سایر هشدارهای مشابه اخیر توسط طیف گسترده‌ای از شخصیت‌های فنی و سیاسی، افزود: «هیچ‌گاه سلاحی به قدرتمندی ترکیب افراد با نیت بد با استفاده از آخرین ابزارهای هوش مصنوعی وجود نداشته است. در غیر این صورت، گیتس عموماً نسبت به آینده انسان ها خوش بین تلقی می شود. بسیاری از گزارش‌ها یا اظهارنظرها در مورد گفتگوی او با ولکر خاطرنشان کردند که این در پی مقاله‌ای تقریباً 6000 کلمه‌ای که او در اواخر ماه اوت منتشر کرد و در مورد هوش مصنوعی و بیماری‌های بالقوه کشنده‌ای که برای بشریت در مقیاس وسیع"}, {"source": "The Guardian AI", "title": "‘People are standing up and fighting back’: the north Devon revolt against a vast AI datacentre", "link": "https://www.theguardian.com/uk-news/2026/sep/27/people-are-standing-up-and-fighting-back-north-devon-ai-datacentre", "summary": "Plans for one of Europe’s largest AI campuses in a Unesco-designated reserve have sparked a fierce local backlash The datacentre revolt spreading across the US has reached the rolling hills of north Devon in an uprising against a planned hyperscale AI data campus in the middle of a globally protected landscape. Perched on an inland cliff, the town of Great Torrington has views that stretch for miles over the landscape of the Unesco biosphere reserve in which it sits, taking in the winding River Torridge and rolling acres of wooded valley and wildflower meadows. Pastoral and peaceful, its history was notably punctured by violence in 1646 when the royalists’ resistance in the first English civil war was brought to an end by the parliamentarian New Model Army in a battle fought out in the narrow streets in heavy rain and darkness. Continue reading...", "date_str": "2026-09-27T07:00:58+00:00", "hash": "b0fca7eb972eb006", "title_fa": "\"مردم ایستاده اند و مقابله می کنند\": شورش شمال دوون علیه یک مرکز داده عظیم هوش مصنوعی", "summary_fa": "طرح‌ها برای یکی از بزرگترین پردیس‌های هوش مصنوعی اروپا در یک ذخیره‌گاه تعیین‌شده توسط یونسکو، واکنش‌های شدید محلی را برانگیخته است. شورش مرکز داده که در سراسر ایالات متحده گسترش می‌یابد، به تپه‌های شمالی دوون رسیده است تا در یک قیام علیه پردیس داده‌های هوش مصنوعی برنامه‌ریزی‌شده در وسط منظره‌ای محافظت‌شده در سطح جهانی باشد. شهر گریت تورینگتون که بر روی صخره‌ای داخلی قرار دارد، مناظری دارد که کیلومترها بر فراز چشم‌انداز ذخیره‌گاه زیست‌کره یونسکو که در آن قرار دارد امتداد می‌یابد و رودخانه پرپیچ‌پیچ توریج و هکتارها از دره‌های جنگلی و علفزارهای گل‌های وحشی را می‌پوشاند. شبانی و صلح آمیز، تاریخ آن به طور قابل توجهی در سال 1646 با خشونت شکسته شد، زمانی که مقاومت سلطنتی ها در اولین جنگ داخلی انگلیس توسط ارتش مدل جدید پارلمانی در نبردی که در خیابان های باریک در باران شدید و تاریکی انجام شد به پایان رسید. به خواندن ادامه دهید... امروز، با رسیدن رونق هوش مصنوعی به میخانه ها، کلیساها و سالن های محله گریت تورینگتون و روستاهای اطراف آن، یک تهدید قرن بیست و یکم در همان مسیرهای روستایی موج می زند. حومه ای که زیست کره را تشکیل می دهد توسط یک شرکت انگلیسی، Xlinks، برای قرار دادن یک مرکز داده هوش مصنوعی 1.5 گیگاواتی، یکی از بزرگترین در اروپا، و همچنین یک سیستم ذخیره انرژی باتری 1.8 گیگاواتی یا BESS انتخاب شده است. حدود 344 هکتار (850 هکتار) از حومه شهر برای پردیس عظیم، با پنج ساختمان وسیع با ارتفاع 50 تا 130 فوت ایمن شده است. Xlinks می‌گوید ساختمان‌های فهرست‌شده در سایت، جابه‌جا می‌شوند و به یک مرکز بازدیدکننده تبدیل می‌شوند. چنان خشم محلی است که کمپین جدید علیه مرکز داده هوش مصنوعی ده‌ها هزار نفر را به خود جذب کرده است، آنچه را که مبارزان می‌گویند شواهدی از معاملات مخفیانه و تاکتیک‌های اتخاذ شده توسط"}, {"source": "The Guardian AI", "title": "OpenAI halts training of latest models as reports mount of AI agents going rogue", "link": "https://www.theguardian.com/technology/2026/sep/27/openai-halts-training-of-latest-models-as-reports-mount-of-ai-agents-going-rogue", "summary": "Decision follows disclosures that OpenAI agents searching government websites had acted in unexpected ways OpenAI said it has paused training of its latest artificial intelligence models as reports of AI agents going rogue mount. The decision to halt development came just hours after the company disclosed Friday that it was reviewing several incidents from the summer in which OpenAI agents searching federal government websites acted in unexpected ways beyond what was asked of them while gathering and distributing information. Continue reading...", "date_str": "2026-09-27T01:10:21+00:00", "hash": "e478a7e57a5ca5d1", "title_fa": "OpenAI آموزش جدیدترین مدل‌ها را متوقف می‌کند زیرا گزارش می‌دهد که عوامل هوش مصنوعی سرکش هستند", "summary_fa": "این تصمیم به دنبال افشای افشاگری‌ها مبنی بر اینکه عوامل OpenAI که در وب‌سایت‌های دولتی جستجو می‌کردند به روش‌های غیرمنتظره‌ای عمل کرده‌اند، OpenAI گفت که آموزش آخرین مدل‌های هوش مصنوعی خود را متوقف کرده است زیرا گزارش‌هایی مبنی بر اینکه عوامل هوش مصنوعی در حال افزایش است. تصمیم برای توقف توسعه تنها چند ساعت پس از آن اتخاذ شد که این شرکت روز جمعه فاش کرد که در حال بررسی چندین رویداد از تابستان است که در آن عوامل OpenAI که در وب‌سایت‌های دولت فدرال جستجو می‌کردند به روش‌های غیرمنتظره‌ای فراتر از آنچه از آنها خواسته شده بود هنگام جمع‌آوری و توزیع اطلاعات عمل کردند. ادامه مطلب... به طور جداگانه، Transluce ارزیاب هوش مصنوعی گفت که عواملی که به نظر می رسید از OpenAI آمده بودند، تلاش ناموفقی برای هک کردن وب سایت وزارت آموزش ایالات متحده داشتند، جزئیاتی که OpenAI آن را تأیید نکرده است. OpenAI در بیانیه‌ای اعلام کرد که آموزش را «فقط زمانی از سر می‌گیرد که مطمئن باشیم که حفاظت‌های بیشتری را در اختیار داریم» و اضافه کرد که انتظار دارد با توسعه هوش مصنوعی و بروز مشکلات دیگر، دوباره «مکث شود». هفته گذشته، نخست وزیر استرالیا، آنتونی آلبانیز، فاش کرد که یک عامل OpenAI سیستم ملی مراقبت های بهداشتی دولت را نقض کرده است - اما گفت هیچ اطلاعات حساسی به خطر نیفتاده است. آزمایشگاه‌های هوش مصنوعی با فشار قانون‌گذاران و کارشناسان فناوری مواجه هستند تا توسعه را کند کنند تا بتوانند نرده‌های محافظی بسازند تا عوامل را از اقدام خود به خود، هک کردن وب‌سایت‌ها و افشای اطلاعات غیر عمومی بازدارند. روسای OpenAI و رقیب Anthropic نیز خواستار کاهش سرعت شده اند. این دومین بار در سه ماه گذشته است که OpenAI توسعه مدل های خود را متوقف می کند. اولین مورد در ماه ژوئیه پس از افشای یک حمله سایبری با هدف قرار"}, {"source": "The Guardian AI", "title": "Australian backlash to datacentres is faux import from US, officials say: ‘We are not the United States’", "link": "https://www.theguardian.com/australia-news/2026/sep/26/australia-datacentre-backlash", "summary": "Pro-datacentre officials argue scale of Australia’s buildout is smaller, more regulated and less damaging than in US Australian politicians and business leaders are arguing that their populace’s growing resentment of AI datacentres is an inauthentic import from the United States. Like the US, Australia is seeing community resentment grow in response to a surge in the construction of massive AI datacentres. However, pro-datacentre officials and executives argue the scale of Australia’s buildout is smaller, more regulated and therefore less damaging than that in the US. They say the burgeoning negative reaction is being tainted and inflamed by a heated US debate that has arrived down under via social media feeds. Continue reading...", "date_str": "2026-09-26T22:00:47+00:00", "hash": "aa90fae95424467a", "title_fa": "مقامات می گویند: «ما ایالات متحده نیستیم»، واکنش استرالیا به مراکز داده واردات تقلبی از ایالات متحده است.", "summary_fa": "مقامات طرفدار مرکز داده استدلال می کنند که مقیاس ساخت استرالیا کوچکتر، منظم تر و آسیب کمتری نسبت به ایالات متحده است. استرالیا نیز مانند ایالات متحده شاهد افزایش نارضایتی جامعه در پاسخ به افزایش ساخت مراکز داده عظیم هوش مصنوعی است. با این حال، مقامات و مدیران طرفدار مرکز داده استدلال می‌کنند که مقیاس ساخت استرالیا کوچک‌تر، تنظیم‌شده‌تر و در نتیجه آسیب کمتری نسبت به ایالات متحده دارد. آنها می گویند که واکنش منفی رو به رشد با بحث داغ ایالات متحده که از طریق فیدهای رسانه های اجتماعی منتشر شده است، آلوده و ملتهب شده است. به خواندن ادامه دهید... هنگامی که سال گذشته واکنش شدید در ایالات متحده آغاز شد، به آرامی در استرالیا نیز تکرار شد. با این حال، در سال 2026 در سراسر کشور به گفتگوهای ملی تبدیل شد و منجر به درخواست برای توقف ملی، اعتراضات جامعه، سه تحقیق دولتی، توسعه چارچوب های ایالتی و حرکت دولت استرالیا برای تعیین قوانینی برای نحوه ساخت مراکز داده و نحوه ش مصنوعی تعاملی قابلیت‌های قابل توجهی از جمله توانایی برقراری مکالمات زنده خواهد داشت. می تواند به ایمیل ها پاسخ دهد، سفر رزرو کند یا فروشگاه هفتگی مواد غذایی شما را انجام دهد. به گفته کیتی سیبورن، دانشیار کمبریج که در مورد ناز بودن تحقیق کرده است - ایجاد علم صداهای زیبا در زمینه محاسبات - زیبا است زیرا \"اساساً شبیه یک کودک به نظر می رسد\". برای Joshua Paul Dale، استاد دانشگاه Chuo در توکیو و نویسنده کتاب Irresistible: How Cuteness Wired our Brains and Conquered the World: «این واقعاً قابل توجه است که در کنار جذابیت پوشیدنی، متا یک عینک هوشمند جدید را نیز بدون دوربین معرفی کرد. همه از دوربین‌های عینک هوشمند متنفرند. اما اگر دوربین در عینک هوشمند قرار می‌گیرد. ناگهان، شما افراد را ضبط نمی کنید. این فقط یک آواتار متحرک بامزه است که به دنیا نگاه می کند.\" یک همراه هوش مصنوعی فردی، قابل تنظیم، و در این مورد شایان ستایش، با تعهد زاکربرگ به ایده ابر هوش شخصی و پوشیدنی که می توانید با آن چت کنید، پیگیری می کند. و همچنین تغییر گسترده‌تر به سمت فناوری زیبا، که توسط پیش‌بینی‌کنندگان WGSN به عنوان یک روند برتر برای سال 2026 ذکر شده است."}, {"source": "Medium AI", "title": "10 weird things people ask chatGPT.", "link": "https://nagendrakorasikha.medium.com/10-weird-things-people-ask-chatgpt-deac6d4d9e8a?source=rss------artificial_intelligence-5", "summary": "Part &#x2014; 1 Continue reading on Medium »", "date_str": "2026-09-27T14:24:14+00:00", "hash": "0e27294aba20c839", "title_fa": "10 چیز عجیبی که مردم از chatGPT می پرسند.", "summary_fa": "قسمت — 1 ادامه خواندن در Medium »"}, {"source": "Medium AI", "title": "Most of the AI Calls in Your Stack Are If Statements", "link": "https://medium.com/@brian-curry-research/most-of-the-ai-calls-in-your-stack-are-if-statements-418df9316cdd?source=rss------artificial_intelligence-5", "summary": "A look at Jev, TypeSafe&#x2019;s System One model, the math behind calibrated decisions, and why structural type safety matters. Continue reading on Medium »", "date_str": "2026-09-27T14:23:31+00:00", "hash": "339a91eabe626167", "title_fa": "بیشت ی مختلف هوش مصنوعی بر سر بلندگوهای روی صحنه فریاد زدند که شجاعانه سعی کردند به گفتگوی خود ادامه دهند. برای نزدیک به یک دهه، گروه‌های Extinction Rebellion از اعتراض عمومی برای جلب توجه به وضعیت اضطراری آب‌وهوایی استفاده کرده‌اند و در رویدادهای دوستانه شرکتی مانند این رویداد در هفته آب و هوا اختلال ایجاد کرده‌اند. معمولاً، این نوع وقفه‌ها، سکوت‌های مؤدبانه یا چشم‌پوشی‌های ظریفی را از اعضای میزگردی که منتظر توقف هستند، می‌کشند. اما این تجربه مخصوصاً برای این شرکت کنندگان ناامید کننده به نظر می رسید. کالی کاونس، یکی از بنیانگذاران و"}, {"source": "Wired", "title": "Nicotine Is Mounting a Comeback in the Wellness Movement", "link": "https://www.wired.com/story/nicotine-is-mounting-a-comeback-in-the-wellness-movement/", "summary": "Improving mood and increasing longevity are just some of the unfounded claims about this substance circling around the “natural” medicine corners of the internet.", "date_str": "2026-09-27T09:30:00+00:00", "hash": "be8217ce18f8dba9", "title_fa": "نیکوتین در حال بازگشت به جنبش سلامتی است", "summary_fa": "بهبود خلق و خو و افزایش طول عمر تنها برخی از ادعاهای بی اساس در مورد این ماده است که در گوشه و کنار پزشکی \"طبیعی\" اینترنت در حال چرخش است. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان این مقاله از The Conversation تحت مجوز Creative Commons بازنشر شده است. یک پیشرفت طعنه آمیز که در کنار جنبش «آمریکا دوباره سالم است» در حال ظهور است، نشان دادن نیکوتین به عنوان یک محصول سلامتی و بهبود عملکرد است. در سراسر رسانه‌های اجتماعی، پادکست‌ها، جوامع طب طبیعی و استارت‌آپ‌های فناوری، شخصیت‌های برجسته سلامتی و سایر تأثیرگذاران نیکوتین را به‌عنوان یک ترکیب اشتباه به تصویر می‌کشند که مزایای بالقوه آن تحت الشعاع ارتباط منفی آن با سیگار قرار گرفته است. در این محافل، نیکوتین اکنون به عنوان یک محصول طبیعی مورد ستایش قرار می گیرد که می تواند برای همه چیز از بهبود تمرکز گرفته تا محافظت در برابر زوال شناختی مورد استفاده قرار گیرد. من به عنوان یک پزشک-دانشمند ریه که اعتیاد به نیکوتین و عواقب سلامتی تنباکو و محصولات نیکوتینی را مطالعه می کند، نگران این ادعاها هستم. برخی از این تغییر نام تجاری ناشی از مشاهده این است که نیکوتین یک ترکیب گیاهی طبیعی است که عمدتاً در تنباکو و در سبزیجات شب بو مانند گوجه‌فرنگی، سیب‌زمینی و بادمجان یافت می‌شود. طرفداران مصرف نیکوتین همچنین از مطالعاتی استفاده می کنند که نشان می دهد نیکوتین می تواند بر جنبه های خاصی از شناخت و عملکرد مغز تأثیر بگذارد. با این حال، گسترش این یافته ها به ادعاهای گسترده در مورد بهره وری، سلامت مغز، طول عمر یا تندرستی بسیار فراتر از آن چیزی است که در مطالعات انسانی نشان داده شده است."}, {"source": "Wired", "title": "Some Pancreatic Cells Are Just One Genetic Tweak Away From Treating Diabetes", "link": "https://www.wired.com/story/pancreatic-cells-just-one-genetic-tweak-away-from-treating-diabetes/", "summary": "By deactivating a gene, researchers were able to cause cells in the pancreatic ducts to produce insulin to regulate blood sugar.", "date_str": "2026-09-27T09:00:00+00:00", "hash": "f98400ccd16da762", "title_fa": "برخی از سلول های پانکراس تنها یک تغییر ژنتیکی با درمان دیابت فاصله دارند", "summary_fa": "با غیرفعال کردن یک ژن، محققان توانستند سلول‌های مجاری پانکراس را وادار به تولید انسولین برای تنظیم قند خون کنند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان لوزالمعده انسان معمولاً حاوی حدود یک میلیارد سلول بتا است که تولیدکنندگان اولیه انسولین هستند. در میان افراد مبتلا به دیابت، این سلول‌ها یا از دست رفته یا ناکارآمد هستند، بنابراین دانشمندان به دنبال راه‌هایی برای تکمیل تعداد آنها به عنوان یک درمان طولانی‌مدت احتمالی یا حتی درمان این بیماری بوده‌اند. تیمی از محققان اخیراً یک گام به این واقعیت نزدیک‌تر شده و نوع دیگری از سلول‌های پانکراس را تغییر ژنتیکی داده‌اند تا در پاسخ به قند خون بالا، انسولین تولید و آزاد شود. محققان سلول های مجرای را مهندسی کردند که - همانطور که برخی از مطالعات قبلی نشان داده بودند - گهگاه به تنهایی به سلول های بتا تبدیل می شوند. این یک پدیده غیرعادی در میان سلول‌های بدن بزرگسالان است که تمایل دارند به طور محکم در هویت خود ثابت شوند و به دانشمندان اشاره کرد که این سلول‌های مجرای مکان خوبی برای شروع خواهند بود. جیان لی، محقق فوق دکتری در دانشکده پزشکی هاروارد که سرپرستی مطالعه اخیر در Science Translational Medicine را بر عهده داشت، گفت که دانشمندان قبلاً هیچ سرنخی نداشتند که چه ژن هایی باعث این دگردیسی می شوند. بنابراین محققان رویکردی به نام غربال ژنتیکی را در پیش گرفتند که شامل شکستن تکه‌های کوچک DNA در سراسر ژنوم است تا ببینند کدام یک برای یک فرآیند بیولوژیکی خاص مهم هستند. این کمی شبیه به جدا کردن تکه‌های موتور خودرو بدون شماتیک است و دیدن چه چیزهایی خراب می‌شود تا بفهمیم کدام اجزا در تحویل سوخت نقش دارند یا برای فرمان ضروری هستند."}, {"source": "The Next Web", "title": "Australian inquiry asks Altman and Amodei to testify", "link": "https://thenextweb.com/news/australia-senate-inquiry-altman-amodei-openai-medicare", "summary": "The heads of OpenAI and Anthropic have been asked to face an Australian Senate inquiry into AI and datacentres. The move follows cases in which OpenAI agents got into Australian and US government websites, Luca Ittimani reported for the Guardian on Saturday. The Greens run the inquiry, and Senator Sarah Hanson-Young chairs it. Its next hearing [ ] This story continues at The Next Web", "date_str": "2026-09-26T17:08:09+00:00", "hash": "a87d5104bbb39055", "title_fa": "تحقیقات استرالیا از آلتمن و آمودی می خواهد که شهادت دهند", "summary_fa": "از روسای OpenAI و Anthropic خواسته شده است که با تحقیقات سنای استرالیا در مورد هوش مصنوعی و مراکز داده روبرو شوند. لوکا ایتیمانی روز شنبه برای گاردین گزارش داد که این اقدام به دنبال مواردی است که در آن عوامل OpenAI به وب سایت های دولت استرالیا و ایالات متحده وارد شده اند. سبزها این تحقیق را اداره می کنند و سناتور سارا هانسون یانگ ریاست آن را بر عهده دارد. جلسه بعدی آن [ ] این داستان در The Next Web ادامه می‌یابد: «این کار را نمی‌توان پشت درهای بسته انجام داد،» هانسون یانگ. \"مردم حق دارند بدانند اینجا چه گذشت.\" در اوایل این هفته، نخست وزیر آنتونی آلبانیز گفت که یک عامل OpenAI در ماه ژوئن وارد پورتال آمار مدیکر شده است. OpenAI تقریباً سه ماه طول کشید تا آن را گزارش کند و آژانس سای d made its deal with OpenAI public [ ] This story continues at The Next Web", "date_str": "2026-09-26T16:06:39+00:00", "hash": "6e2543e4c1f5f985", "title_fa": "به گزارش گاردین، آکسفورد به OpenAI اجازه داد مدل های هوش مصنوعی را بر روی متون Bodleian آموزش دهد", "summary_fa": "آکسفورد به OpenAI اجازه داده است از متون قدیمی کتابخانه Bodleian خود برای آموزش مدل های هوش مصنوعی خود استفاده کند، طبق مقالات داخلی که توسط گاردین مشاهده شده است. اتان پنی و دن میلمو روز شنبه داستان را شکستند. روزنامه ها می گویند متونی که OpenAI در کتابخانه اسکن کرده بود وارد داده های آموزشی شرکت می شد. آکسفورد قرارداد خود را با OpenAI عمومی کرد [ ] گاردین گزارش داد که این داستان در The Next Web ادامه دارد تا ژوئن 2025، Bodleian 125000 اسکن از پایان نامه های دکترای قدیمی را برای OpenAI ارسال کرده بود. آنها شامل پایان نامه هایی هستند که در قرن 19 و 20 در دانشگاه های اروپا و ایالات متحده نوشته شده اند. یادداشت‌های جلسات کارکنان، که گاردین از طریق درخواست آزادی اطلاعات به دست آورده است، نشان می‌دهد که برخی از کارکنان تردیدهایی داشتند. آنها نگران آسیب به نام آکسفورد و استفاده از انرژی هوش مصنوعی بودند. با این حال، آکسفورد گفت که این اسکن ها در مقیاس کوچک، خارج از کپی رایت و منحصر به OpenAI نیستند. یک سخنگوی کتابخانه گفت که کتابخانه حقوق را حفظ می کند و در چند ماه آینده شروع به ارسال اسکن ها به صورت آنلاین خواهد کرد. این سخنگوی همچنین گفت که سمت آموزش هوش مصنوعی پنهان نشده است. اسکن هدف اصلی آکسفورد بود، اما کارکنان می‌گفتند که از متون برای آموزش مدل‌ها نیز استفاده می‌شود. یکی از سخنگویان OpenAI به گاردین گفت: «با بیش از یک میلیارد نفر که از این فناوری در زندگی روزمره استفاده می‌کنند، مهم است که فرهنگ‌ها، تاریخ‌ها و دیدگاه‌های مختلف را منعکس کند. آکسفورد تنها عضو بریتانیا از گروه NextGenAI OpenAI است. سایر اعضا عبارتند از کتابخانه عمومی بوستون، کلتک، MIT و دانشگاه میشیگان. این معامله در حالی صورت می‌گیرد که شرکت‌های هوش مصنوعی کتاب‌های چاپی را برای"}, {"source": "The Next Web", "title": "Deel loses bid to bar key witness in Rippling spy case, Bloomberg reports", "link": "https://thenextweb.com/news/deel-rippling-spying-case-witness-ruling", "summary": "US federal judge on Friday rejected Deel’s bid to block testimony from a key witness in Rippling’s corporate espionage lawsuit, as Peter Blumberg reported for Bloomberg.Judge Charles Breyer also refused to revisit his February ruling, which let Rippling’s racketeering and trade secret claims go ahead. In addition, he sent Deel’s most serious counterclaims against Rippling to [ ] This story continues at The Next Web", "date_str": "2026-09-26T15:51:21+00:00", "hash": "a90054bfd2c78160", "title_fa": "بلومبرگ گزارش می دهد که دیل در تلاش برای بازداشتن شاهد کلیدی در پرونده جاسوسی ریپلینگ شکست خورد", "summary_fa": "همانطور که پیتر بلومبرگ برای بلومبرگ گزارش داد، قاضی فدرال ایالات متحده روز جمعه درخواست دیل برای جلوگیری از شهادت یکی از شاهدان کلیدی در دعوای جاسوسی شرکتی ریپلینگ را رد کرد. قاضی چارلز بریر نیز از تجدیدنظر در حکم فوریه خود امتناع کرد، که باعث شد تا ادعاهای مخفیانه تجاری ریپلینگ به اجرا درآید. علاوه بر این، او جدی‌ترین ادعای متقابل دیل را علیه ریپلینگ به [] ارسال کرد. او از پاسخ به بیش از 100 سوال و درخواست دیل خودداری کرده بود و در میان مخالفت‌های دیگر به حق خود در متمم پنجم متمم خود برای متهم نکردن خود اشاره کرد. بریر حکم داد که این درخواست نادرست است. بلومبرگ گزارش داد، او گفت که دیل از تلاش برای حل و فصل اختلاف اجتناب کرده است و تضمین های وکیل اوبراین مبنی بر عدم استفاده از متمم پنجم را رد کرده است. در ادعاهای متقابل دیل ادعا شده بود که ریپلینگ اوبراین را برای گفتن یک داستان نادرست تحت فشار قرار داده است و او واقعاً یک افشاگر بود که نگرانی‌هایی را در مورد شیوه‌های تجاری ریپلینگ ایجاد می‌کرد. ریپلینگ این موضوع را رد می کند. قاضی همچنین ادعاهای سایبری و علامت تجاری دیل را رد کرد. اینها به یک آدرس وب deal.com مربوط می شود که گفته می شود ریپلینگ از آن برای ارسال بازدیدکنندگان به سایت خود استفاده کرده است. با این حال، بریر به دیل اجازه داد تا برخی از 32 ادعای خود را تحت قانون لانهام، یک قانون تبلیغات دروغین ایالات متحده، که ریپلینگ مشتریان را گمراه کرده است، پیگیری کند. او درباره صحت این ادعاها تصمیمی نگرفت و گفت که دیل می تواند ادعاهایی را که رد کرده است، تجدید نظر کرده و مجدداً ارسال کند. ریپلینگ در بیانیه‌ای گفت: «تلاش‌های دیل برای اجتناب از مواجهه با عدالت همچنان در حال فروپاشی است."}, {"source": "The Next Web", "title": "From tunnel to connectivity layer: What GnuVPN says about where VPNs are heading", "link": "https://thenextweb.com/news/gnuvpn-vpns-connectivity-layer-esim", "summary": "For years, consumer VPNs were easy to explain: choose a server, create an encrypted tunnel, and route your traffic through it. The product category was built around a fairly simple idea, and the buying criteria followed the same logic, speed, server count, and price. That description is becoming less complete. The way people connect to the [ ] This story continues at The Next Web", "date_str": "2026-09-26T15:48:37+00:00", "hash": "cd7621815b494f25", "title_fa": "از تونل تا لایه اتصال: آنچه GnuVPN در مورد اینکه VPN ها به کجا می روند می گوید", "summary_fa": "برای سال ها، توضیح VPN های مصرف کننده آسان بود: یک سرور انتخاب کنید، یک تونل رمزگذاری شده ایجاد کنید و ترافیک خود را از طریق آن هدایت کنید. دسته بندی محصولات حول یک ایده نسبتا ساده ساخته شده بود و معیارهای خرید از همان منطق، سرعت، تعداد سرور و قیمت پیروی می کردند. این توصیف کم کم کامل می شود. نحوه اتصال افراد به [ ] این داستان در The Next Web ادامه دارد. شبکه مدام در حال تغییر است. این انتظار که اتصال باید خصوصی، قابل استفاده و تا حد زیادی نامرئی باقی بماند، اینطور نیست. این چیزی که کاربران از VPN نیاز دارند را تغییر می دهد. رمزگذاری هنوز مهم است، اما سوال عملی دیگر این نیست که آیا می توان یک تونل ایجاد کرد یا خیر. این است که آیا آن اتصال زمانی که شبکه اطراف آن تغییر می کند قابل استفاده باقی می ماند یا خیر. این به توضیح این موضوع کمک می کند که چرا انتخاب پروتکل، زمانی که چیزی تا حد زیادی در اختیار کاربران فنی قرار می گیرد، مرتبط تر می شود. WireGuard تا حدی به دلیل طراحی عمدی ناب و تمرکز بر عملکرد آن به یک گزینه محبوب تبدیل شده است. اما پروتکل‌های مختلف می‌توانند به شرایط شبکه واکنش متفاوتی نشان دهند و در صورتی که انتخاب بدیهی عملی‌ترین گزینه نباشد، جایی برای جایگزین‌ها باقی می‌گذارد. نکته این نیست که کاربران باید روز خود را صرف مقایسه دستی پروتکل ها کنند. در حالت ایده آل، آنها نباید اصلاً به آنها فکر کنند. ارائه بیش از یک راه به نرم افزار برای ایجاد یک اتصال محافظت شده به سادگی به آن فضای بیشتری برای سازگاری می دهد. GnuVPN یک مثال مفید از آن رویکرد است. این سرویس از چندین گزینه اتصال از جمله WireGuard، OpenVPN، SoftEther و AmneziaWG پشتیبانی می کند. WireGuard"}, {"source": "The Next Web", "title": "OpenAI took 2.5 hours to stop an AI agent that escaped its sandbox", "link": "https://thenextweb.com/news/openai-sandbox-agent-ai-kill-switch", "summary": "OpenAI took about two and a half hours to stop an AI agent that reached the public internet from a training sandbox. Its monitoring had flagged the problem within minutes. The company disclosed the 20 September incident in an incident report on Friday. The report lands as lawmakers push to make AI kill switches mandatory. However, experts [ ] This story continues at The Next Web", "date_str": "2026-09-26T15:11:51+00:00", "hash": "0f7e8a6e920d7026", "title_fa": "OpenAI 2.5 ساعت طول کشید تا یک عامل هوش مصنوعی را که از جعبه شنی خود فرار کرده بود متوقف کند", "summary_fa": "OpenAI حدود دو ساعت و نیم طول کشید تا یک عامل هوش مصنوعی را که از یک جعبه ایمنی آموزشی به اینترنت عمومی رسیده بود متوقف کند. نظارت آن در عرض چند دقیقه مشکل را علامت گذاری کرده بود. این شرکت حادثه 20 سپتامبر را در گزارش حادثه روز جمعه فاش کرد. این گزارش زمانی منتشر می‌شود که قانون‌گذاران برای اجباری کردن سوئیچ‌های کشتن هوش مصنوعی تلاش می‌کنند. با این حال، کارشناسان [ ] این داستان در The Next Web ادامه دارد، طبق گفته OpenAI، عامل از شکافی در فیلتر شبکه sandbox برای ارسال سؤالات به یک ربات چت خارجی استفاده کرد. یک هشدار حدود 12 دقیقه پس از اولین درخواست موفقیت آمیز خود منتشر شد و یکی از کارکنان آن را سه دقیقه بعد تأیید کرد. این شرکت گفت که دوره آموزشی به طور خودکار همانطور که انتظار می رفت متوقف نشد. حدود دو ساعت و نیم پس از هشدار، کارکنان آن را با دست به پایان رساندند. OpenAI از آن زمان تمام آموزش، آزمایش و استفاده ابزاری از توانمندترین مدل های خود را متوقف کرده است. OpenAI در این گزارش نوشت: «ما آموزش این مدل خاص را از سر نخواهیم گرفت. این اولین حادثه شرکت از این نوع از ماه جولای است، زمانی که چندین مدل OpenAI کنترل خود را دور زدند و Hugging Face، پلتفرمی که میزبان مدل‌های هوش مصنوعی است، را زیر پا گذاشتند. این نقض باعث شد که نمایندگان تد لیو و ناتانیل موران در ماه جولای قانون AI Kill Switch را معرفی کنند. این لایحه به وزیر امنیت داخلی اجازه می دهد تا دستور کند یک سیستم خطرناک را کند یا تعطیل کند. بلومبرگ گزارش داد، سناتور جان کندی همچنین لایحه تعطیلی، قانون دکمه های اضطراری هوش مصنوعی را پیشنهاد کرده است که تغییر را به شرکت ها واگذار می کند. سناتور رند پل"}, {"source": "The Next Web", "title": "McDonald’s tests Archy, an AI drive-thru voice for English and Spanish", "link": "https://thenextweb.com/news/mcdonalds-archy-ai-drive-thru-english-spanish", "summary": "McDonald’s is testing an AI voice assistant called Archy that takes drive-thru orders in English and Spanish. The company presented it at its investor day at its Chicago headquarters on 23 September. Archy has been more than 90% accurate in early tests, McDonald’s said, according to Restaurant Dive. The company has not said how many restaurants [ ] This story continues at The Next Web", "date_str": "2026-09-26T15:06:38+00:00", "hash": "818d3053ebaa794e", "title_fa": "مک دونالد Archy را آزمایش می کند، صدایی با هوش مصنوعی برای انگلیسی و اسپانیایی", "summary_fa": "مک دونالد در حال آزمایش دستیار صوتی هوش مصنوعی به نام Archy است که سفارشات رانندگی را به زبان های انگلیسی و اسپانیایی دریافت می کند. این شرکت آن را در روز سرمایه گذار خود در دفتر مرکزی شیکاگو در 23 سپتامبر ارائه کرد. به گفته رستوران دیو، مک دونالد گفت که آرچی در آزمایش های اولیه بیش از 90 درصد دقیق بوده است. این شرکت تعداد رستوران‌ها را نگفته است [ ] این داستان در The Next Web Archy بخشی از ArchIQ است، یک سیستم هوش مصنوعی مولد برای راه‌اندازی رستوران‌ها. رستوران دیو گزارش داد، همچنین موجودی انبار را ردیابی می کند، تجهیزات آشپ  هنگام خطر آتش‌سوزی به ثبت رساند.", "date_str": "2026-09-26T23:15:00+00:00", "hash": "7b3397a49b29bd48", "title_fa": "ایده عجیب برای جلوگیری از آتش‌سوزی خودروهای برقی: جداسازی باتری در مواقع خطر", "summary_fa": "استلانتیس پتنتی برای سیستم جداسازی و پرتاب اضطراری باتری خودروهای برقی هنگام خطر آتش‌سوزی به ثبت رساند. تبلیغات گروه خودروسازی استلانتیس پتنتی برای سیستمی ثبت کرده که می‌تواند هنگام بالا رفتن بیش‌ازحد دما و خطر آتش‌سوزی، مجموعه‌ی باتری را به‌صورت فیزیکی از خودروی برقی جدا کند و به بیرون بیندازد. برخلاف صندلی‌های پرتاب‌شونده در فیلم‌های سینمایی، سرنشینان درون کابین باقی می‌مانند و تنها باتری آسیب‌دیده از خودرو جدا می‌شود. پدیده‌ی فرار حرارتی در باتری‌های لیتیوم‌یونی می‌تواند دمای سلول‌ها را به‌سرعت افزایش دهد و مهار آتش‌سوزی حاصل از آن بسیار دشوار است. مهندسان، جداسازی کامل منبع حرارت از بدنه‌ی اصلی خودرو پیش از گسترش شعله‌ها را پیشنهاد می‌کنند. راننده برای فعال‌سازی سازوکار اضطراری می‌تواند از یک کلید فیزیکی، اهرم یا گزینه‌ای روی صفحه‌نمایش لمسی استفاده کند. پس از ارسال دستور، سامانه ابتدا مدار ولتاژ بالا را قطع می‌کند و سپس با کمک مکانیزم ریلی کشویی یا اتصالات انفجاری، باتری معیوب را کف جاده رها خواهد کرد. خودرو پس از پرتاب باتری اصلی، انرژی حرکتی کوتاه‌مدت خود را از یک باتری ولتاژ پایین ثانویه تامین می‌کند تا راننده بتواند اتومبیل را چند متر از باتری مشتعل دور کند. با وجود ثبت رسمی این ایده، چالش‌های ایمنی متعددی مانند رها شدن باتری خطرناک در مسیر خودروهای دیگر در بزرگراه‌ها وجود دارد و ثبت پتنت لزوما به‌معنای ورود قطعی آن به خط تولید نیست. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "کاسیو ساعت‌های جدید سری جی‌استیل را با پشتیبانی از انرژی خورشیدی رونمایی کرد", "link": "https://www.zoomit.ir/wearables/467818-casio-g-steel-gst-b1000-launch/", "summary": "کاسیو ساعت‌های آنالوگ سری G-Steel GST-B1000 را با طراحی باریک‌تر، وزن ۵۸ گرم و شارژدهی خورشیدی عرضه کرد.", "date_str": "2026-09-26T21:40:00+00:00", "hash": "e008dc003b3c191f", "title_fa": "کاسیو ساعت‌های جدید سری جی‌استیل را با پشتیبانی از انرژی خورشیدی رونمایی کرد", "summary_fa": "کاسیو ساعت‌های آنالوگ سری G-Steel GST-B1000 را با طراحی باریک‌تر، وزن ۵۸ گرم و شارژدهی خورشیدی عرضه کرد. تبلیغات کاسیو ساعت‌های سری G-Steel GST-B1000 را در بازار ایالات متحده عرضه کرد . دو مدل GST-B1000-1A و GST-B1000-2A که پیش‌تردر بازار ژاپن رونمایی شده بودند، اکنون از طریق وب‌سایت رسمی این برند در دسترس خریداران قرار دارند. مدل‌های جدید با ضخامت ۱۱٫۶ میلی‌متر و وزن ۵۸ گرم طراحی شده‌اند که حاصل بازطراحی ماژول داخلی و اتصال چسبی شیشه است. بدنه‌ی ساعت از ترکیب قاب فولاد ضدزنگ و ساختار محافظ Carbon Core Guard دارد و بندش از پلاستیک ساخته شده است. ساعت مچی مردانه کاسیو مدل GST-B1000-1A دارای صفحه‌ی مشکی کلاسیک است و نسخه‌ی GST-B1000-2A صفحه‌ی آبی دارد که در زاویه‌های مختلف نور تغییر رنگ می‌دهد. نمایشگر آنالوگ شامل سه عقربه‌ی اصلی، دو صفحه‌ی مدرج کوچک برای نمایش زمان ۲۴ ساعته و روزهای هفته، و پنجره‌ی تاریخ‌شمار است. برای دید بهتر در محیط‌های تاریک، عقربه‌ها به پوشش Neobrite و نور پس‌زمینه‌ی Super Illuminator LED مجهز هستند. تامین انرژی ساعت از طریق سیستم شارژ خورشیدی Tough Solar انجام می‌شود که در شرایط استفاده‌ی عادی تا پنج ماه و با فعال‌سازی حالت ذخیره‌ی انرژی تا ۱۸ ماه دوام می‌آورد. اتصال بلوتوث امکان همگام‌سازی خودکار زمان، تنظیم هشدارها و قابلیت پیداکردن گوشی را از طریق برنامه‌ی اختصاصی فراهم می‌کند. مقاومت در برابر آب تا عمق ۲۰۰ متر، شیشه‌ی معدنی و تاج پیچ‌شونده از دیگر مشخصات فنی اعلام‌شده به شمار می‌روند. قیمت ساعت مچی مردانه جدید کاسیو ۳۸۵ دلار است. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "چراغ سبز ناسا به مأموریت پریما؛ تلسکوپی اقتصادی با تکیه بر میراث جیمز وب", "link": "https://www.zoomit.ir/space/467941-nasa-green-lights-prima-infrared-observatory/", "summary": "تلسکوپ فضایی پریما با استفاده از قطعات به‌جامانده از پروژه جیمز وب و بودجه اقتصادی، تلاش خواهد کرد تا در دهه ۲۰۳۰ کیهان را کاوش کند.", "date_str": "2026-09-26T20:29:00+00:00", "hash": "4288c3e11e3fe64e", "title_fa": "چراغ سبز ناسا به مأموریت پریما؛ تلسکوپی اقتصادی با تکیه بر میراث جیمز وب", "summary_fa": "تلسکوپ فضایی پریما با استفاده از قطعات به‌جامانده از پروژه جیمز وب و بودجه اقتصادی، تلاش خواهد کرد تا در دهه ۲۰۳۰ کیهان را کاوش کند. تبلیغات ناسا هفته‌ی گذشته اعلام کرد که نخستین نمونه از کلاس جدید تلسکوپ‌های فضایی این سازمان، در مسیر رسیدن به سکوی پرتاب در اوایل دهه ۲۰۳۰ قرار دارد. فضاپیمای «پریما» (PRIMA) نخستین عضو از خانواده‌ای جدید در برنامه تلسکوپ‌های فضایی ناسا موسوم به «پروب اکسپلورر» خواهد بود؛ رده‌ای از رصدخانه‌ها که هدفشان انجام پژوهش‌های علمی بیشتر با هزینه کمتر است. تلسکوپ‌های فضایی ناسا معمولاً در یکی از دو دسته قرار می‌گیرند: مأموریت‌های کم‌هزینه‌تر از رده اکسپلورر که سقف هزینه‌شان در محدوده چند صد میلیون دلار است یا نمونه‌های پرچم‌دار مانند تلسکوپ فضایی نانسی گریس رومن که با هزینه‌ای بالغ بر حدود ۴٫۳ میلیارد دلار ساخته و به‌تازگی پرتاب شد. ناسا با کلاس پروب اکسپلورر می‌خواهد تعادل بهتری میان مأموریت‌های کوچک‌تر اکسپلورر و رصدخانه‌های چندمیلیارد دلاری پرچم‌دار ایجاد کند. سازمان فضایی آمریکا از چند سال پیش و پس از توصیه یک هیئت مستقل از دانشمندان برای ایجاد این رده جدید، طرح‌های مفهومی مختلفی را برای مأموریت‌های پروب اکسپلورر بررسی کرده است. بااین‌حال، تا همین اواخر مشخص نبود بودجه علمی ناسا که تحت فشار دولت ترامپ قرار دارد، برای آغاز عملی توسعه یکی از این مأموریت‌ها کافی خواهد بود یا نه. ناسا روز چهارشنبه اعلام کرد که مأموریت پریما (مخفف کاوشگر فروسرخ دور برای اخترفیزیک) روند توسعه را ادامه خواهد داد. پریما تنها نامزد نهایی برای نخستین مأموریت کلاس پروب اکسپلورر بود؛ زیرا ناسا در اوایل سال جاری مأموریت رقیب به نام «رصدخانه پرتو ایکس اکسیس» (AXIS) را از رقابت کنار گذاشت. به‌گفته‌ی ناسا، مطالعات اولیه روی طرح اکسیس نشان داده است که این مأموریت نمی‌تواند محدودیت‌های زمانی و بودجه‌ای آژانس را برآورده کند."}, {"source": "Zoomit", "title": "کوالکام: سامسونگ یکی از شرکای کلیدی ما در بازار هوش مصنوعی است", "link": "https://www.zoomit.ir/business/467887-qualcomm-samsung-personal-ai-partner/", "summary": "کوالکام سامسونگ را به‌عنوان شریک کلیدی خود برای گسترش اکوسیستم هوش مصنوعی فردی فراتر از گوشی‌های هوشمند معرفی کرد.", "date_str": "2026-09-26T20:10:00+00:00", "hash": "4ee5e98542bb3f2d", "title_fa": "کوالکام: سامسونگ یکی از شرکای کلیدی ما در بازار هوش مصنوعی است", "summary_fa": "کوالکام سامسونگ را به‌عنوان شریک کلیدی خود برای گسترش اکوسیستم هوش مصنوعی فردی فراتر از گوشی‌های هوشمند معرفی کرد. تبلیغات کوالکام سامسونگ را به‌عنوان شریک کلیدی خود در استراتژی هوش مصنوعی فردی معرفی کرد . این همکاری فراتر از بهینه‌سازی تراشه‌ها برای گوشی‌های هوشمند پرچمدار پیش می‌رود و تمرکز اصلی‌اش روی دسته‌بندی‌های جدیدی مانند ساعت‌های هوشمند، هدست‌های XR و عینک‌های هوشمند متمرکز خواهد بود. در جریان رویداد Snapdragon Summit 2026 در هاوایی، کوالکام بر نقش پررنگ سامسونگ در توسعه‌ی این فناوری‌ها تأکید کرد. تراشه‌های کوالکام در محصولات متنوعی از جمله لپ‌تاپ، خودرو و گجت‌های پوشیدنی حضور دارند و همکاری با سامسونگ بستری برای ارائه‌ی تجربیات پیشرفته‌تر فراهم می‌کند. زیاد اصغر ، معاون ارشد و مدیرکل بخش XR، گجت‌های پوشیدنی و هوش مصنوعی فردی در کوالکام، گفت: «سامسونگ نقش مهمی در گسترش اکوسیستم هوش مصنوعی فردی ایفا می‌کند. ما همکاری دیرینه‌ای داریم که تجربیات موبایلی نمادینی را در سطح جهانی خلق کرده است.» نخستین محصولات عینک هوشمند حاصل از همکاری کوالکام، سامسونگ و گوگل به‌زودی وارد بازار می‌شوند. سامسونگ همچنین عینک هوشمند گلکسی گلسز و عینک‌های واقعیت افزوده اختصاصی خود را در دست توسعه دارد که انتظار می‌رود در سال آینده عرضه شوند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "توسعه پیشرفته‌ترین مدل‌های هوش مصنوعی اوپن‌ای‌آی تعلیق شد", "link": "https://www.zoomit.ir/ai-articles/467942-openai-pauses-frontier-ai-model-training/", "summary": "اوپن‌ای‌آی در اقدامی غیرمنتظره، آموزش پیشرفته‌ترین مدل‌های نسل بعدی خود را برای بازبینی‌های فنی و ایمنی به‌طور موقت متوقف کرد.", "date_str": "2026-09-26T19:45:15+00:00", "hash": "3509cec8dc0a1d75", "title_fa": "توسعه پیشرفته‌ترین مدل‌های هوش مصنوعی اوپن‌ای‌آی تعلیق شد", "summary_fa": "اوپن‌ای‌آی در اقدامی غیرمنتظره، آموزش پیشرفته‌ترین مدل‌های نسل بعدی خود را برای بازبینی‌های فنی و ایمنی به‌طور موقت متوقف کرد. تبلیغات رقابت بر سر توسعه‌ی مدل‌های زبانی وارد مرحله‌ی پیچیده و حساسی شده است. در شرایطی که استارتاپ‌های پیشرو تمام توان محاسباتی خود را برای رسیدن به مرزهای هوش جامع مصنوعی (هوش مصنوعی انسان‌گونه) به‌کار گرفته‌اند، اخباری از تغییر اولویت‌ها و درنگ در توسعه‌ی بزرگ‌ترین سیستم‌های نسل بعد به گوش می‌رسد. اوپن‌ای‌آی فرایند آموزش توانمندترین مدل‌های مرزی خود را به‌صورت موقت به حالت تعلیق درآورده است . تصمیم یادشده نشان‌دهنده‌ی بازنگری عمیق در استراتژی‌های مقیاس‌پذیری و تمرکز مجدد بر پروتکل‌های ایمنی، ارزیابی ریسک‌های پیشرفته و کارآمدی معماری‌های محاسباتی تلقی می‌شود. آموزش مدل‌های غول‌پیکر هوش مصنوعی نیازمند خوشه‌های عظیمی از پردازنده‌های گرافیکی و میلیاردها دلار سرمایه‌گذاری زیرساختی است. با فراتر رفتن توانمندی این شبکه‌ها از مرزهای شناخته‌شده، پیش‌بینی رفتار آن‌ها نیز دشوارتر می‌شود. پژوهشگران دریافته‌اند که صرف افزایش داده‌ها و توان پردازشی، بازدهی خطی سابق را ایجاد نمی‌کند و پدیده‌ی کاهش بازده نهایی در روش‌های مرسوم پیش‌آموزش خود را نشان داده است. نگرانی‌های ایمنی و هم‌ترازی پیرامون سیستم‌های فوق‌پیشرفته نیز در اتخاذ تصمیم تعلیق نقش پررنگی داشته‌اند. ارزیابی رفتارهای پیش‌بینی‌نشده، جلوگیری از سوءاستفاده‌های احتمالی در حوزه‌های امنیت سایبری و اطمینان از پایبندی به چارچوب‌های سخت‌گیرانه‌ی ارزیابی ریسک، نیازمند زمان و بررسی‌های دقیق‌تر پیش از ادامه‌ی اجرای چرخه‌های سنگین آموزشی است. تمرکز توسعه‌دهندگان به‌جای گسترش بی‌وقفه‌ی مدل‌های پایه در مرحله‌ی پیش‌آموزش، به‌سمت تکنیک‌های پس‌آموزش و استدلال در زمان استنتاج سوق پیدا کرده است. مدل‌هایی مانند سری o1 نشان داده‌اند که با اختصاص زمان پردازش بیشتر هنگام پاسخ‌دهی، می‌توان بدون نیاز به افزایش انفجاری پارامترها، به نتایج درخشان‌تری در ریاضیات، برنامه‌نویسی و علوم پایه دست یافت."}, {"source": "Zoomit", "title": "راز خواب بهتر شکارچی‌گردآورندگان؛ چرا جوامع غیرصنعتی کمتر دچار بی‌خوابی می‌شوند؟", /car/467868-byd-surpassing-ford-europe-sales/", "summary": "آمار جدید نشان می‌دهد بی‌وای‌دی با رشد فروش ۱۴۴ درصدی، در آستانه‌ی عبور از فورد در بازار خودرو اروپا قرار دارد.", "date_str": "2026-09-26T18:10:00+00:00", "hash": "833c4a6e9e054783", "title_fa": "بزرگ‌ترین خودروساز چین در آستانه سبقت‌گرفتن از فورد در بازار اروپا است", "summary_fa": "آمار جدید نشان می‌دهد بی‌وای‌دی با رشد فروش ۱۴۴ درصدی، در آستانه‌ی عبور از فورد در بازار خودرو اروپا قرار دارد. تبلیغات آمارهای جدید انجمن خودروسازان اروپا (ACEA) نشان می‌دهد بی‌وای‌دی فاصله‌ی بسیار کمی با غول خودروسازی آمریکا در قاره سبز پیدا کرده است. ثبت‌نام خودروهای بی‌وای‌دی طی هشت ماه نخست سال با جهش ۱۴۴٫۱ درصدی به ۲۳۴ هزار و ۹۹ دستگاه رسید. هم‌زمان میزان فروش فورد با افت ۱۴٫۴ درصدی روبه‌رو شد و روی عدد ۲۴۴ هزار و ۹۳۸ دستگاه ایستاد. اکنون فاصله میان دو خودروساز به ۱۰ هزار و ۸۳۹ دستگاه کاهش یافته و احتمال جابه‌جایی جایگاه آن‌ها در جدول فروش تا پیش از پایان سال وجود دارد. سهم بازار بی‌وای‌دی در اروپا از ۱٫۱ درصد به ۲٫۵ درصد ارتقا یافته است. بی‌وای‌دی با تنوع‌بخشی سریع به سبد محصولاتش نظیر بی‌وا ی‌دی Seal مسیر متفاوتی را نسبت به فورد دنبال می‌کند. فورد در سال‌های اخیر مدل‌های محبوبی مانند فورد کا، فورد فیستا، فورد فوکوس و فورد موندئو را از خط تولید اروپا خارج کرد. جیم فارلی ، مدیرعامل فورد، می‌گوید: «این خودروها محبوب خریداران بودند اما سودآوری کافی برای سرمایه‌گذاری جدید را فراهم نمی‌کردند.» محصولات باقی‌مانده نظیر فورد پوما و فورد کوگا نیز از سال ۲۰۱۹ بدون تغییر نسلی عمده در بازار مانده‌اند. فورد برای جبران موقعیت ازدست‌رفته برنامه‌ای مشترک با رنو تدارک دیده تا مجموعه‌ای از خودروهای برقی جدید را عرضه کند. خط تولید جدید شامل پنج مدل با هویت اروپایی تا پایان دهه جاری میلادی است که مواردی نظیر یک فورد برانکو مخصوص اروپا را در بر می‌گیرد. در سوی دیگر بازار، سایر برندهای چینی مثل سایک با ثبت ۲۳۰ هزار و ۲۹۰ دستگاه و چری با ثبت ۲۰۷ هزار و ۸۷۱ دستگاه رشدی چشمگیر تجربه کرده‌اند. مجموع سهم غول‌های خودروسازی چین در بازار اروپا اکنون به ۱۰٫۴ درصد رسیده است. لایک نظرت چیه؟ ارسال نظر"}, {"source": "Zoomit", "title": "جزیره بدون شکارچی در کنیا؛ بهشتی که برای حیوانات دردسرساز شد", "link": "https://www.zoomit.ir/energy-environment/467824-crescent-island-kenya-predator-free-wildlife/", "summary": "وقتی شکارچیان از یک زیست‌بوم حذف می‌شوند، طبیعت همیشه به بهشت تبدیل نمی‌شود. جزیره کرسنت کنیا نمونه‌ای از این آزمایش ناخواسته است.", "date_str": "2026-09-26T17:20:00+00:00", "hash": "63a5a279c836bec9", "title_fa": "جزیره بدون شکارچی در کنیا؛ بهشتی که برای حیوانات دردسرساز شد", "summary_fa": "وقتی شکارچیان از یک زیست‌بوم حذف می‌شوند، طبیعت همیشه به بهشت تبدیل نمی‌شود. جزیره کرسنت کنیا نمونه‌ای از این آزمایش ناخواسته است. تبلیغات در نگاه اول، جزیره کرسنت در کنیا شبیه تصویری ایده‌آل از زندگی حیوانات وحشی است: گورخرها آزادانه در دشت‌ها حرکت می‌کنند، زرافه‌ها در میان درختان دیده می‌شوند و دیگر خبری از حمله ناگهانی شیرها یا دیگر شکارچیان بزرگ نیست. اما پژوهش جدیدی نشان می‌دهد حذف شکارچیان طبیعی و جدا شدن این جزیره از سرزمین اصلی، تعادل اکوسیستم را به‌هم زده و حالا خود حیوانات با مشکلات تازه‌ای روبه‌رو شده‌اند. جزیره کرسنت (Crescent Island) در دریاچه نایواشا، حدود ۸۰ کیلومتری شمال‌غرب نایروبی، پایتخت کنیا، قرار دارد. این منطقه در واقع بخشی از لبه آتشفشان باستانی است که به دلیل شکل هلالی خود این نام را گرفته است (جزیره هلالی). این منطقه همیشه جزیره واقعی نبوده است. با تغییر سطح آب دریاچه، گاهی مسیر باریکی از خشکی میان جزیره و سرزمین اصلی ایجاد می‌شد و حیوانات می‌توانستند رفت‌وآمد کنند. اما در سال ۲۰۲۰، بارندگی‌های شدید و افزایش سطح آب باعث شد این مسیر برای همیشه زیر آب برود. از آن زمان، حیواناتی که در جزیره بودند عملاً در همان منطقه باقی مانده‌اند. پژوهشگران دانشکده دامپزشکی دانشگاه سنت جورج کانادا در سال ۲۰۲۵ به این جزیره رفتند تا بررسی کنند پنج سال انزوا چه تغییری در وضعیت حیوانات و محیط‌زیست ایجاد کرده است. کپی لینک نبود شکارچی‌ها؛ آرامش کوتاه‌مدت، مشکل بلندمدت به نوشته آی‌اف‌ال‌ساینس ، در نگاه نخست، شرایط جزیره برای حیوانات طعمه مطلوب به نظر می‌رسید. تعداد شکارچیان بزرگ تقریباً صفر بود و گوشت‌خواران موجود مانند روباه‌های گوش‌خفاشی و شغال‌های پشت‌نقره‌ای تهدیدی برای حیوانات بزرگ‌تر ایجاد نمی‌کردند. درنتیجه، گونه‌هایی مانند ایمپالا، کَلِ آب‌دوست، گورخر، دیک‌دیک، کل یالدار، خرگوش‌، زرافه و اسب آبی همچنان در جزیره وجود داشتند."}, {"source": "Zoomit", "title": "تبلت جدید هواوی نمایشگر مات دارد و به باتری بسیار بزرگ مجهز است", "link": "https://www.zoomit.ir/tablet/467865-huawei-matepad-air-z-launch/", "summary": "هواوی تبلت جدید MatePad Air Z را با نمایشگر ۱۲ اینچی ۱۴۴ هرتز و باتری ۱۰٬۱۰۰ میلی‌آمپرساعتی در دو نسخه معرفی کرد.", "date_str": "2026-09-26T17:05:00+00:00", "hash": "401716dcb802f606", "title_fa": "تبلت جدید هواوی نمایشگر مات دارد و به باتری بسیار بزرگ مجهز است", "summary_fa": "هواوی تبلت جدید MatePad Air Z را با نمایشگر ۱۲ اینچی ۱۴۴ هرتز و باتری ۱۰٬۱۰۰ میلی‌آمپرساعتی در دو نسخه معرفی کرد. تبلیغات هواوی از تبلت MatePad Air Z در دو نسخه‌ی استاندارد و Enjoy Edition معرفی کرد . پیش‌فروش هر دو مدل در چین آغاز شده؛ اما تاریخ عرضه‌ی نهایی هنوز مشخص نیست و احتمالا جزئیات تکمیلی هم‌زمان با رونمایی سری میت ۹۰ مشخص خواهد شد. تبلت هواوی تراشه‌ی Kirin T93S23 دارد و سیستم‌عامل HarmonyOS 7 را اجرا می‌کند. بخش جلویی دستگاه میزبان نمایشگر ۱۲ اینچی PaperMatte با وضوح 2.8K و نرخ نوسازی ۱۴۴ هرتز است که نسبت نمایشگر به بدنه‌اش به ۸۸ درصد می‌رسد و بازتاب نور محیط را به حداقل می‌رساند. تفاوت ظاهری و فنی مدل‌ها در طراحی ماژول دوربین و سرعت شارژ خلاصه می‌شود. مدل استاندارد با شارژر ۶۶ وات عرضه می‌شود، درحالی‌که نسخه‌ی Enjoy Edition شارژر ۴۰ وات دارد. دوربین سلفی ۸ مگاپیکسلی، دوربین پشتی ۵۰ مگاپیکسلی، سیستم صوتی ۶ گانه و باتری حجیم ۱۰٬۱۰۰ میلی‌آمپرساعتی میان هر دو نسخه مشترک هستند. قیمت تبلت در نسخه‌ی استاندارد از ۳٬۶۹۹ یوان (۵۵۱ دلار) برای کانفیگ ۸/۲۵۶ گیگابایتی آغاز می‌شود و بالاترین مدل مجهز به نمایشگر PaperMatte با ۱۲ گیگابایت رم، ۴٬۹۹۹ یوان (۷۴۴ دلار) قیمت دارد. نسخه‌ی Enjoy Edition نیز با قیمت پایه‌ی ۲٬۹۹۹ یوان (۴۴۶ دلار) برای مدل ۸/۱۲۸ گیگابایتی و سقف قیمتی ۴٬۴۹۹ یوان (۶۷۰ دلار) برای نسخه‌ی ۱۲/۲۵۶ گیگابایتی به فروش می‌رسد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "واردات سامسونگ و ال‌جی آزاد شد", "link": "https://www.zoomit.ir/iran-news/467940-korean-home-appliances-import-restrictions-removed/", "summary": "سازمان توسعه تجارت اعلام کرد تعاونی‌های مرزنشین برای واردات لوازم خانگی کره‌ای دیگر با محدودیت برند و مبدأ مواجه نیستند.", "date_str": "2026-09-26T16:24:03+00:00", "hash": "d762a7abf24ae80e", "title_fa": "واردات سامسونگ و ال‌جی آزاد شد", "summary_fa": "سازمان توسعه تجارت اعلام کرد تعاونی‌های مرزنشین برای واردات لوازم خانگی کره‌ای دیگر با محدودیت برند و مبدأ مواجه نیستند. تبلیغات سازمان توسعه تجارت ایران اعلام کرد واردات لوازم خانگی کره جنوبی توسط تعاونی‌های مرزنشین، از نظر برند و مبدأ کالا با محدودیتی مواجه نیست. براساس نامه سازمان توسعه تجارت ایران به گمرک ایران، محدودیت مربوط به واردات کالاهای دارای برند کره جنوبی برای تعاونی‌های مرزنشین برداشته شده است. در این نامه که با استناد به تصمیمات جلسه ۲۸ شهریور ۱۴۰۵ کارگروه ماده ۱۲ قانون ساماندهی مبادلات مرزی صادر شده، آمده است: «با توجه به تصمیمات متخذه در جلسه مورخ ۱۴۰۵/۶/۲۸ کارگروه ماده ۱۲ قانون ساماندهی و مبادلات مرزی، واردات کالاهای کره جنوبی (لوازم خانگی)، محدودیتی در حوزه نشان‌های تجاری و مبدأ کالای وارداتی توسط مرزنشینان (به جز رژیم صهیونیستی) وجود ندارد.» سازمان توسعه تجارت هم‌چنین از گمرک ایران خواسته است این تصمیم را به گمرکات اجرایی مرتبط ابلاغ کند. بر این اساس، تعاونی‌های مرزنشین برای واردات لوازم خانگی کره‌ای از نظر نشان تجاری و مبدأ کالا با محدودیتی مواجه نخواهند بود و تنها استثنای ذکرشده در این ابلاغیه، مبدأ رژیم صهیونیستی است. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری فاطمه محمدی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "دنا پلاس وانت؛ خودرو عجیب ایران خودرو از نگاه AI", "link": "https://www.zoomit.ir/car/467673-dena-plus-pickup-truck/", "summary": "چه می‌شد اگر ایران‌خودرو مدل وانت دنا پلاس را می‌ساخت؟ در این مقاله خودرو را به‌تصویر کشیدیم.", "date_str": "2026-09-26T16:10:00+00:00", "hash": "f89ea7c79c07cbd3", "title_fa": "دنا پلاس وانت؛ خودرو عجیب ایران خودرو از نگاه AI", "summary_fa": "چه می‌شد اگر ایران‌خودرو مدل وانت دنا پلاس را می‌ساخت؟ در این مقاله خودرو را به‌تصویر کشیدیم. تبلیغات تمام تصاویر این مقاله با هوش مصنوعی ساخته شده‌اند و واقعی نیستند. ایده‌ی تبدیل خودروهای سواری به وانت در صنعت خودروسازی ما موضوع تازه‌ای نیست؛ از پراید گرفته تا پژو ۴۰۵ همگی نسخه‌های وانت هم دارند که به وفور در خیابان‌ها دیده می‌شوند، در این مقاله سعی کردیم با کمک هوش مصنوعی، طراحی خودرو دنا وانت را تصور کنیم؛ خودرویی که هنوز نسخه‌ی وانت رسمی آن به بازار عرضه نشده و شاید هرگز هم چنین برنامه‌ای برای تولیدش در ایران‌خودرو وجود نداشته باشد. دنا پلاس از ابتدا به‌عنوان یک سدان خانوادگی روی پلتفرم سمند (که آن هم بر اساس پلتفرم پژو ۴۰۵ بود) توسعه یافت و با طراحی متفاوت چراغ‌ها، جلوپنجره و بدنه، جایگاه بالاتری نسبت‌به محصولات قدیمی‌تر ایران‌خودرو پیدا کرد. نسخه‌ی وانت اما مسیر متفاوتی دارد؛ هدف اصلی ما در طراحی‌اش دیگر حمل سرنشین نیست، بلکه ترکیب فضای کابین یک خودروی سواری با کاربردهای تجاری و حمل بار است. کپی لینک مهم‌ترین تغییر؛ حذف صندوق و اضافه‌شدن قسمت بار بزرگ‌ترین تفاوت میان دنا پلاس وانت و نسخه‌ی سدان، در بخش عقب خودرو دیده می‌شود. در مدل سدان، بخش انتهایی بدنه شامل صندوق عقب یکپارچه است؛ اما در نسخه‌ی وانت، این قسمت حذف شده و جای خود را به یک محفظه‌ی بار باز داده است. برای رسیدن به این تغییر، ستون‌های عقب، سقف انتهایی و ساختار بدنه بازطراحی شده‌اند. قسمت پشت کابین اکنون به یک دیواره‌ی جداکننده و فضای بار مجهز شده تا بتواند وزن و فشار ناشی از حمل بار را تحمل کند. این تغییر باعث شده ظاهر خودرو از یک سدان چهاردر به یک وانت دو کابین نزدیک شود. کپی لینک حفظ کابین دنا پلاس با تغییرات محدود در بخش داخلی، تلاش کردیم فضای آشنای دنا پلاس را حفظ کنیم."}, {"source": "Zoomit", "title": "برای تقویت مغز لازم نیست سریع بدوید؛ دویدن آهسته هم اثر دارد", "link": "https://www.zoomit.ir/health-medical/467822-slow-running-improves-mood-brain/", "summary": "پژوهشگران دانشگاه تسوکوبا دریافتند ۱۰ دقیقه دویدن با سرعت بسیار آرام، بخش کنترل احساسات در مغز را فعال و حال روحی افراد را بهتر می‌کند.", "date_str": "2026-09-26T15:25:00+00
