ی‌پیوندد", "link": "https://iranwire.com/fa/news-1/158768-%DA%AF%D8%B2%D8%A7%D8%B1%D8%B4%DA%AF%D8%B1-%D8%B3%D8%A7%D8%B2%D9%85%D8%A7%D9%86-%D9%85%D9%84%D9%84-%D8%A8%D9%87-%D8%A7%D8%B9%D8%AA%D8%B5%D8%A7%D8%A8-%D8%BA%D8%B0%D8%A7%DB%8C-%D8%B3%D9%87%D8%B4%D9%86%D8%A8%D9%87%D9%87%D8%A7%DB%8C-%D9%86%D9%87-%D8%A8%D9%87-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85-%D9%85%DB%8C%D9%BE%DB%8C%D9%88%D9%86%D8%AF%D8%AF/", "summary": "«جینا رومرو»، گزارشگر ویژه سازمان ملل در امور «آزادی تجمعات مسالمت‌آمیز و تشکل»، اعلام کرد روز سه‌شنبه ۲۱مهر۱۴۰۵ در حمایت از زندانیان ای ...", "date_str": "2026-10-12T09:15:04+00:00", "hash": "b948b7a586413c45", "title_fa": "گزارشگر سازمان ملل به اعتصاب غذای «سه‌شنبه‌های نه به اعدام» می‌پیوندد", "summary_fa": "«جینا رومرو»، گزارشگر ویژه سازمان ملل در امور «آزادی تجمعات مسالمت‌آمیز و تشکل»، اعلام کرد روز سه‌شنبه ۲۱مهر۱۴۰۵ در حمایت از زندانیان ای ... رومرو امروز یکشنبه ۱۹مهر۱۴۰۵ با انتشار پیامی ویدیویی و رشته‌پست‌هایی در شبکه اجتماعی «ایکس»، به استفاده جمهوری اسلامی از مجازات اعدام علیه معترضان و فعالان سیاسی اعتراض کرد. او نوشت مجازات اعدام در ایران علیه افرادی به کار گرفته می‌شود که از حقوق خود، از جمله آزادی بیان، تجمع، تشکل‌یابی و مشارکت سیاسی استفاده کرده‌اند. این گزارشگر سازمان ملل همچنین مدعی شد از ماه مارس تاکنون دست‌کم ۴۶ معترض در ایران اعدام شده‌اند؛ آماری که به گفته او بالاترین شمار اعدام‌های سیاسی در نزدیک به چهار دهه گذشته محسوب می‌شود. رومرو با انتقاد از بازداشت‌های غیرقانونی و نقض اصول دادرسی عادلانه، خواستار توقف اعدام‌ها و نظارت مستقل بر وضعیت زندانیانی شد که با خطر اجرای حکم مرگ مواجه‌اند. او در پیام خود خطاب به زندانیان اعتصابی نوشت: «آن‌ها پشت میله‌های زندان همه‌چیز خود را به خطر می‌اندازند. من از بیرون زندان به آن‌ها می‌پیوندم.» «مای ساتو»، گزارشگر ویژه سازمان ملل در امور حقوق بشر ایران، نیز با بازنشر پیام رومرو، آن را «پستی مهم» توصیف کرد. کارزار «سه‌شنبه‌های نه به اعدام» از بهمن۱۴۰۲ با اعتصاب غذای گروهی از زندانیان سیاسی در زندان قزلحصار کرج آغاز شد و به‌تدریج به زندان‌های دیگر گسترش یافت. بر اساس گزارش پیشین «ایران‌وایر»، این کارزار روز سه‌شنبه  پیدا کرده است. اکنون پرسش این است که این تحریم تا چه اندازه می‌تواند بر کریدورهای تجاری، زنجیره تامین و قیمت کالاها در ایران تاثیر بگذارد. آمریکا با تحریم سه مجموعه اصلی فعال در شبکه ریلی ایران، فشار بر یکی دیگر از مسیرهای حمل‌ونقل و تجارت این کشور را افزایش داده است. این اقدام در شرایطی صورت می‌گیرد که ایران پس از محدودیت‌های فزاینده در بخش‌های دریایی و هوایی، بیش از گذشته به کریدورهای زمینی و ریلی برای حفظ تجارت خارجی و زنجیره تأمین خود متکی شده است. اما این تحریم تا چه اندازه می‌تواند بر تجارت و ترانزیت ایران اثر بگذارد؟ تحریم‌های اخیر ریلی و خودروسازی بخشی از بسته جدید وزارت دارایی آمریکا در اول اکتبر ۲۰۲۶ و در چارچوب «عملیات طرد اقتصادی» است. این بسته سه شرکت ریلی، هفت شرکت ایرانی فعال در صنعت خودرو و پنج شرکت خارجی مرتبط با زنجیره تأمین قطعات را هدف قرار داده است. واشنگتن معتقد است که با محدودتر شدن مسیرهای دریایی، اهمیت کریدورهای زمینی و ریلی ایران در جابه‌جایی کالا و حفظ تجارت منطقه‌ای افزایش یافته است. از نگاه آمریکا، تحریم این بخش‌ها راهی برای محدود کردن مسیرهایی است که تهران از آنها برای تداوم تجارت و کاهش اثر تحریم‌ها استفاده می‌کند. در بیانیه وزارت دارایی همچنین ادعا شده که صنایع ریلی و خودروسازی ایران تحت نفوذ حکومت و سپاه پاسداران قرار دارند. این نخستین بار نیست که آمریکا یک شبکه ریلی را هدف تحریم قرار می‌دهد. راه‌آهن دولتی روسیه پس از آغاز جنگ اوکراین با محدودیت‌های مالی و سرمایه‌گذاری روبه‌رو شد و"}, {"source": "BBC Persian", "title": "«راسوت»؛ رقیب روسی استارلینک چیست و چرا اهمیت دارد؟", "link": "https://www.bbc.com/persian/articles/cw1l3v5n7jymo?at_medium=RSS&at_campaign=rss", "summary": "هشدار دمیتری مدودف درباره احتمال «جنگی تمام‌عیار در فضا» بار دیگر توجه‌ها را به «راسوت»، منظومه ماهواره‌ای جدید روسیه، جلب کرده است. مسکو این سامانه را گامی مهم برای کاهش وابستگی به زیرساخت‌های ارتباطی خارجی و تقویت توانمندی‌های خود می‌داند، اما منتقدان می‌گویند راسوت می‌تواند نقشی مهم در جنگ اوکراین نیز ایفا کند.", "date_str": "2026-10-12T07:04:02+00:00", "hash": "89faf41c0f1173ec", "title_fa": "«راسوت»؛ رقیب روسی استارلینک چیست و چرا اهمیت دارد؟", "summary_fa": "هشدار دمیتری مدودف درباره احتمال «جنگی تمام‌عیار در فضا» بار دیگر توجه‌ها را به «راسوت»، منظومه ماهواره‌ای جدید روسیه، جلب کرده است. مسکو این سامانه را گامی مهم برای کاهش وابستگی به زیرساخت‌های ارتباطی خارجی و تقویت توانمندی‌های خود می‌داند، اما منتقدان می‌گویند راسوت می‌تواند نقشی مهم در جنگ اوکراین نیز ایفا کند. دمیتری مدودف، معاون رئیس شورای امنیت روسیه، هشدار داده است که در صورت دخالت آمریکا در «راسوت»، منظومه ماهواره‌ای جدیدی که روسیه در حال توسعه آن است، «جنگی تمام‌عیار در فضا» در خواهد گرفت. او گفت چنین رویارویی‌ در صورتی رخ می‌دهد که آمریکا بخواهد در فعالیت سامانه ماهواره‌ای نوظهور «راسوت» روسیه اختلال ایجاد کند. این اظهارات پس از آن مطرح شد که گزارش شد ولودیمیر زلنسکی، رئیس‌جمهور اوکراین، از آمریکا خواسته است این پروژه را تحریم یا «مسدود» کند. مدودف در شبکه اجتماعی ایکس نوشت: «درخواست [زلنسکی] برای «مسدود کردن» ماهواره‌های راسوت روسیه فقط می‌تواند به معنای نابودی آن‌ها باشد، راهی قطعی برای رسیدن به جنگی تمام‌عیار در فضا. امیدوارم آمریکا این را درک کند. در غیر این صورت، ماهواره‌های استارلینک مثل مگس سقوط خواهند کرد. فضا جای تنگی است، بنابراین رعایت احترام متقابل ضروری است.» این پروژه آشکارا برای مسکو اهمیت دارد. کرملین ۲۷ سپتامبر ۲۰۲۶ ابراز امیدواری کرد که این سامانه «هرچه زودتر... به‌طور موثر آغاز به کار کند». اما این سامانه دقیقا چیست و چه زمانی ممکن است عملیاتی شود؟ «راسوت-۳» (طلوع-۳) یک سامانه ارتباطات ماهواره‌ای است که برای عملکردی مشابه استارلینکِ شرکت اسپیس‌ایکس طراحی شده است. این سامانه را شرکت روسی «بیورو ۱۴۴۰»، از زیرمجموعه‌های هلدینگ «ایکس هولدینگ» می‌سازد. ساخت این پروژه در دسامبر ۲۰۲۳ اعلام شد و قرار است تا سال ۲۰۲۷ به فضا پرتاب شود. به گفته ایکس هولدینگ، این سامانه برای ارائه پوشش پایه به ۲۵۰ ماهواره و برای پوشش جهانی به بیش از ۷۰۰ ماهواره نیاز دارد."}, {"source": "BBC Persian", "title": "جنگ ایران، حوثی‌ها و توافق با پوتین؛ سه بحرانی که در واشنگتن به هم گره خورده‌اند", "link": "https://www.bbc.com/persian/articles/cmn4e8307lpeo?at_medium=RSS&at_campaign=rss", "summary": "در حالی که حملات مرگبار حوثی‌ها به فرودگاه ریاض خطر گسترش جنگ با ایران شان است. اما ما جمعیت انبوه مردم را داریم.» اعتراض‌ها که در مواردی به خشونت کشیده شده‌اند، به یکی از کانون‌های اصلی سیاست به‌شدت دوقطبی فرانسه تبدیل شده‌اند و هر طرف دیگری را به تشدید تنش متهم می‌کند. با نزدیک شدن انتخابات ریاست‌جمهوری، سیاستمداران راست افراطی و چپ افراطی هر دو تلاش کرده‌اند از ناآرامی‌ها و آنچه بسیاری ناتوانی دولت در حل بحران می‌دانند، بهره‌برداری سیاسی کنند. اعتراض‌ها که از دبیرستان آنتوان دو سنت‌اگزوپری در حومه محروم کرتی در پاریس آغاز شد، در سراسر کشور بازتاب گسترده‌ای پیدا کرده است."}, {"source": "BBC Persian", "title": "هشدار موسسه مطالعات مالی بریتانیا درباره تاثیر جنگ ایران بر بودجه دولت", "link": "https://www.bbc.com/persian/articles/c68xz49y91kjo?at_medium=RSS&at_campaign=rss", "summary": "موسسه مطالعات مالی بریتانیا (IFS) هشدار داده است که افزایش شدید قیمت‌ها در پی جنگ آمریکا و اسرائیل علیه ایران، چالشی بزرگ برای جان هیلی، وزیر دارایی بریتانیا، در تدوین نخستین بودجه او ایجاد کرده است.", "date_str": "2026-10-12T00:58:02+00:00", "hash": "bf21261b708c3eb7", "title_fa": "هشدار موسسه مطالعات مالی بریتانیا درباره تاثیر جنگ ایران بر بودجه دولت", "summary_fa": "موسسه مطالعات مالی بریتانیا (IFS) هشدار داده است که افزایش شدید قیمت‌ها در پی جنگ آمریکا و اسرائیل علیه ایران، چالشی بزرگ برای جان هیلی، وزیر دارایی بریتانیا، در تدوین نخستین بودجه او ایجاد کرده است. به گفته این اندیشکده، تورم بالاتر از پیش‌بینی‌ها می‌تواند از ارزش واقعی بودجه اختصاص‌یافته به خدمات عمومی بکاهد و دولت را ناچار کند میان کاهش هزینه‌ها، افزایش مالیات یا ترکیبی از هر دو تصمیم بگیرد. موسسه مطالعات مالی از دولت خواسته است برنامه‌های بودجه‌ای معتبری ارائه کند و برای متوازن نشان دادن بودجه، کاهش هزینه‌هایی را برای سال‌های آینده پیش‌بینی نکند که قصد اجرای آنها را ندارد. وزارت دارایی بریتانیا از اظهارنظر درباره آنچه «شایعات و گمانه‌زنی‌ها» خوانده، خودداری کرده است. با این حال، جان هیلی در آستانه نشست سالانه صندوق بین‌المللی پول گفت: «پیامدهای درگیری‌ها در خاورمیانه و اروپا کشورهای سراسر جهان را تحت تأثیر قرار داده و باعث افزایش قیمت سوخت و هزینه وام‌های مسکن شده است.» او افزود: «اما hall-woodford-win-nobel-prize-for-work-on-how-to-stabilise-economies/33875094.html", "summary": "آکادمی سلطنتی علوم سوئد درباره این دو اقتصاددان گفت آن‌ها به پاس توسعهٔ مدل‌های جدید برای مدیریت رکودها و سایر بحران‌هایی که با ابزارهای سنتی قابل مهار نیستند، تقدیر شدند.", "date_str": "2026-10-12T12:29:06+00:00", "hash": "1794e6b6a938df88", "title_fa": "دو اقتصاددان آمریکایی برنده جایزه نوبل اقتصادی ۲۰۲۶ شدند", "summary_fa": "آکادمی سلطنتی علوم سوئد درباره این دو اقتصاددان گفت آن‌ها به پاس توسعهٔ مدل‌های جدید برای مدیریت رکودها و سایر بحران‌هایی که با ابزارهای سنتی قابل مهار نیستند، تقدیر شدند. جایزهٔ نوبل اقتصاد در سال ۲۰۲۶ به دو محقق و اقتصاددان آمریکایی، مایکل وودفورد و رابرت ‌هال، به خاطر پژوهش‌هایشان دربارهٔ «مبانی اقتصاد خرد برای تثبیت اقتصاد کلان» تعلق گرفت. این دو محقق با ارائه مدل‌های جدید اقتصاد کلان، دربارهٔ این‌که «چگونه سیاست‌های پولی و مالی می‌توانند به تثبیت بهتر نوسانات اقتصادی زیان‌بار کمک کنند»، به سیاست‌گذاران یاری رساندند تا راهکارهای موثرتری برای حفظ ثبات اقتصادی در پیش بگیرند. آکادمی سلطنتی علوم سوئد روز دوشنبه، ۲۰ مهر، در بیانیه‌ای پیرامون اهدای جایزه به این دو اقتصاددان گفت آن‌ها به پاس توسعهٔ مدل‌های جدیدی برای مدیریت رکودها و سایر بحران‌هایی که با ابزارهای سنتی قابل مهار نیستند، مورد تقدیر قرار گرفتند. به گفته هیئت داوران نوبل اقتصاد، «بر اساس این مدل‌ها، اقدامات به‌موقع در حوزهٔ سیاست‌های مالی و پولی می‌تواند نوسانات شدید اقتصادی را کاهش دهد». رابرت هال ۸۳ ساله، استاد دانشگاه استنفورد و مایکل وودفورد ۷۱ ساله، استاد دانشگاه کلمبیا هستند. آن‌ها جداگانه شروع به بررسی مدل‌های جدید کردند. به گفته هیئت داوران، مدل‌های هال و وودفورد شامل درکی از این مسئله است که چگونه خانوارها و بنگاه‌های اقتصادی از طریق کنش‌های خود بر اقتصاد تأثیر می‌گذارند. یون هاسلر، رئیس کمیته اعطای جایزه، در بیانیه‌ای گفت: «دستاوردهای این برندگان، شالودهٔ نظری مستحکمی برای مدل‌هایی فراهم کرده است که امروزه توسط بانک‌های مرکزی و دولت‌ها در سراسر جهان مورد استفاده قرار می‌گیرند». وودفورد هنگام اعلام خبر جایزه، در گفت‌وگوی تلفنی با خبرنگاران گفت: «این موضوع غافلگیرکننده بود، اما حس بسیار خوبی دارم». او افزود که از دریافت «این افتخار بزرگ» بسیار «خوشحال و هیجان‌زده» است."}, {"source": "Radio Farda", "title": "تحریم‌های تازه‌ اروپا علیه روسیه؛ کالاس خواستار تحریم بیشتر مسکو توسط آمریکا شد", "link": "https://www.radiofarda.com/a/eu-s-kallas-welcomes-ukraine-energy-ceasefire-but-wants-signs-russia-will-stick-to-it/33874917.html", "summary": "کایا کالاس، مسئول سیاست خارجی اتحادیه اروپا، روز دوشنبه ۲۰ مهر از آمریکا خواست تحریم‌های بیشتری علیه روسیه اعمال کند تا زمینه پایان جنگ اوکراین فراهم شود.", "date_str": "2026-10-12T07:26:32+00:00", "hash": "2ea8ea5c82b55caa", "title_fa": "تحریم‌های تازه‌ اروپا علیه روسیه؛ کالاس خواستار تحریم بیشتر مسکو توسط آمریکا شد", "summary_fa": "کایا کالاس، مسئول سیاست خارجی اتحادیه اروپا، روز دوشنبه ۲۰ مهر از آمریکا خواست تحریم‌های بیشتری علیه روسیه اعمال کند تا زمینه پایان جنگ اوکراین فراهم شود. همزمان با اعلام تحریم‌های تازه اتحادیه اروپا علیه روسیه، کایا کالاس، مسئول سیاست خارجی اتحادیه اروپا، از آمریکا خواست تحریم‌های بیشتری علیه مسکو اعمال کند تا زمینه پایان جنگ اوکراین فراهم شود. او روز دوشنبه ۲۰ مهر همچنین از اعلام آتش‌بس در حملات به تأسیسات انرژی روسیه و اوکراین استقبال کرد، اما گفت هنوز نشانه‌ای از پایبندی مسکو به این توافق دیده نشده است. به گزارش خبرگزاری رویترز، کالاس در حاشیه نشست وزیران خارجه اتحادیه اروپا در لوکزامبورگ گفت: «ما از آمریکا می‌خواهیم تحریم‌ها را برقرار کند تا بتوانیم واقعاً به جنگ پایان دهیم.» او خواستار همکاری آمریکا و بریتانیا برای افزایش فشار بر مسکو شد و گفت اروپا از آتش‌بس انرژی زمانی استقبال می‌کند که به آن عمل شود. کالاس افزود ترجیح می‌دهد آتش‌بسی برقرار شود که به کشته‌شدن انسان‌ها نیز پایان دهد. او همچنین ابراز اطمینان کرد که اگر فشار کافی برای پایان جنگ بر روسیه وارد شود، اوکراین انتخابات برگزار خواهد کرد. دونالد ترامپ، رئیس‌جمهور آمریکا، روز یکشنبه در شبکه اجتماعی خود اعلام کرد که روسیه و اوکراین بر سر توقف فوری حملات به تأسیسات انرژی یکدیگر توافق کرده‌اند. او نوشت: «از همین لحظه، آتش‌بس انرژی در جنگ میان روسیه و اوکراین برقرار است. هر دو طرف موافقت کرده‌اند. آن را نقض نکنید!» با این حال، مسکو هنوز چنین توافقی را تأیید نکرده و مقام‌های اوکراینی گفته‌اند اعلام ناگهانی ترامپ آنها را غافلگیر کرده است. همزمان، اتحادیه اروپا روز دوشنبه رسماً نام نزدیک به هزار و ۶۰۰ شخص حقیقی و حقوقی دیگر را به فهرست تحریم‌های خود در ارتباط با جنگ روسیه علیه اوکراین افزود. هدف از این اقدام، حفظ فشار بر مسکو اعلام شده است."}, {"source": "Radio Farda", "title": "ادامه حملات حوثی‌ها به فرودگاه‌های عربستان؛ ۱۴ کشته و موج محکومیت‌های بین‌المللی", "link": "https://www.radiofarda.com/a/saudi-houthi-airport-attacks-update/33874879.html", "summary": "سخنگوی نظامی حوثی‌ها، مسئولیت حمله روز شنبه به فرودگاه ریاض را بر عهده گرفت و اعلام کرد این گروه همچنین فرودگاه دمام و دو تأسیسات شرکت نفتی آرامکوی عربستان را هدف قرار داده است.", "date_str": "2026-10-12T05:44:31+00:00", "hash": "c5f7d2199d1898b0", "title_fa": "ادامه حملات حوثی‌ها به فرودگاه‌های عربستان؛ ۱۴ کشته و موج محکومیت‌های بین‌المللی", "summary_fa": "سخنگوی نظامی حوثی‌ها، مسئولیت حمله روز شنبه به فرودگاه ریاض را بر عهده گرفت و اعلام کرد این گروه همچنین فرودگاه دمام و دو تأسیسات شرکت نفتی آرامکوی عربستان را هدف قرار داده است. ائتلاف به رهبری عربستان سعودی روز دوشنبه ۲۰ مهر از حملات تازه موشکی و پهپادی به سمت این کشور خبر داد و گفت با این حملات مقابله کرده است. هم‌زمان، سازمان هواپیمایی عربستان اعلام کرد که در پی این حملات، تعلیق فعالیت‌های فرودگاه ریاض را تمدید کرده است. در نوتام جدیدی که این سازمان منتشر کرده، پرواز بر فراز فرودگاه ملک خالد ریاض تا ۱۷ اکتبر (۲۵ مهر) معلق خواهد شد. پیش از این سازمان هواپیمایی عربستان سعودی تأیید کرده بود که فرودگاه بین‌المللی ملک فهد در دَمام نیز شامگاه ۱۹ مهر هدف حمله قرار گرفته است. حملهٔ تازه به فرودگاه ریاض یک کشته و ۱۱ زخمی بر جای گذاشته است و چهار کشور عربستان سعودی، ترکیه، پاکستان و مصر خواستار توقف فوری حملات حوثی‌ها شده‌اند. حملات حوثی‌های مورد حمایت ایران به فرودگاه‌های مختلف عربستان سعودی، باعث توقف پرواز شرکت‌های هواپیمایی مختلف به این کشور شده است. در تازه‌ترین مورد، شرکت‌های ایرفرانس، کی‌ال‌ام و اتحاد هم گفته‌اند پروازهایشان به عربستان را تعلیق کرده‌اند. پیشتر نیز شرکت‌هایی غاز می‌شود. ما آماده‌ایم و آن را خواهیم پذیرفت.» رئیس‌جمهور اوکراین سپس اعلام کرد روسیه بعد از اعلام آتش‌بس در حوزه انرژی دونالد ترامپ، نیروگاه‌های اوکراین را هدف قرار داده است. زلنسکی در پیامی در شبکه‌های اجتماعی نوشت: «روسیه با یک پهپاد شاهد به یک نیروگاه در کی‌یف حمله کرد.» او افزود که پس از آن، تأسیسات انرژی دیگری نیز در منطقه خارکیف هدف حملات قرار گرفتند. او اضافه کرد: «همه این اتفاقات پس از آن رخ داد که رئیس‌جمهور ایالات متحده بیانیه خود را درباره آتش‌بس در حوزه انرژی منتشر کرد.» روسیه هنوز توافق بر سر چنین آتش‌بسی را تأیید نکرده است. این تحولات در حالی رخ می‌دهد که حملات مرگبار در جریان جنگ تشدید شده است. زلنسکی پیش‌تر در روز یکشنبه بار دیگر تأکید کرده بود که کشورش آماده است حمله به پالایشگاه‌های نفت روسیه را متوقف کند، مشروط بر آنکه مسکو حملات"}],

اند ایده نوپای شما را برای یک شرکت یا استارت‌آپ فعلی‌تان تغییر دهد. این راهنما برای بنیان‌گذارانی است که به تازگی در مورد Disrupt یاد می‌گیرند، نیاز به تجدید نظر دارند یا در مورد ارزشش شک دارند. TechCrunch بیش از 20 سال است که وجود دارد. می توانیم آن را بگیریم و قبل از غواصی، ما دو تخفیف داریم که تا شروع Disrupt ادامه دارد و باید از آنها مطلع شوید. بنیانگذاران می‌توانند با دنبال کردن این پیوند، یکی از اعضای تیم را با تخفیف 50 درصدی بلیط خود همراه کنند، یا می‌توانید"}, {"source": "TechCrunch Main", "title": "Aaron Sorkin’s ‘The Social Reckoning’ is off to a weak start", "link": "https://techcrunch.com/2026/10/11/aaron-sorkins-social-reckoning-is-off-to-a-weak-start/", "summary": "What does this mean for a fall full of movies starring villainous tech CEOs?", "date_str": "2026-10-11T20:51:47+00:00", "hash": "f95ef966a42e37cb", "title_fa": "«حساب اجتماعی» آرون سورکین شروع ضعیفی دارد", "summary_fa": "این برای پاییزی پر از فیلم هایی که مدیران اجرایی شرور فناوری در آن بازی می کنند چه معنایی دارد؟ طبق برآوردهای یکشنبه، «تحقیق اجتماعی»، ادامه‌ی «شبکه اجتماعی» به کارگردانی آرون سورکین، در مسیر فروش تنها 5.5 میلیون دلار در باکس آفیس داخلی این آخر هفته قرار دارد. این رقم کمتر از 7 تا 8 میلیون دلاری است که استودیو پیش‌بینی کرده بود، و این بدان معناست که فیلم جدید سورکین بعید به نظر می‌رسد که در اندازه «شبکه اجتماعی» موفق شود. فیلم قبلی آخر هفته افتتاحیه ۲۲ میلیون دلاری داشت و مجموعاً ۹۷ میلیون دلار فروش داخلی داشت (و این به قیمت بلیت سال ۲۰۱۰ است). این فیلم همچنین برنده جایزه اسکار برای سورکین شد و به یکی از تاثیرگذارترین نمایش های روی صفحه نمایش از سیلیکون ولی و فرهنگ استارتاپ تبدیل شد. فراتر از سرنوشت یک فیلم، باکس آفیس آخر هفته نیز می تواند نکاتی را در مورد هیجان تماشاگر یا فقدان آن ارائه دهد، زیرا ما پاییز پر از فیلم هایی را آغاز می کنیم که در آن مدیران شرکت های فناور شرور و دنیای واقعی بازی می کنند. مستند چهار ساعته الکس گیبنی «ماسک» (که این آخر هفته نیز افتتاح شد)، مستند الیزابت هولمز ظاهراً غیرقابل دسته بندی «شما می توانید همه چیز را ببینید» (آخر هفته آینده!) و درام اتاق هیئت مدیره OpenAI «مصنوعی» (که پس از پخش شدن، توزیع کننده جدیدی توسط آمازون دارد) وجود دارد. خارج از سینماها، نتفلیکس همچنین سریالی به نام «نوخواهان» دارد که در ماه نوامبر منتشر می شود و داستان سم بنکمن-فرید و فروپاشی FTX را روایت می کند. در مورد \"تحقیق اجتماعی\"، در حالی که \"شبکه اجتماعی\" موفقیت قابل توجهی بود، چشم انداز تئاتر در 16 سال گذشته به طور قابل توجهی تغییر کرده است. و در جایی که فیلم اول بر هیجان و درام روزهای اولیه فیس"}, {"source": "TechCrunch Main", "title": "TechCrunch Mobility: A roadblock clears for self-driving trucks", "link": "https://techcrunch.com/2026/10/11/techcrunch-mobility-a-roadblock-clears-for-self-driving-trucks/", "summary": "Welcome back to TechCrunch Mobility, your hub for the future of transportation and now, more than ever, the role AI is playing in it.", "date_str": "2026-10-11T16:02:00+00:00", "hash": "cbfc87d9bfcaae3b", "title_fa": "TechCrunch Mobility: موانعی برای کامیون‌های خودران برطرف می‌شود", "summary_fa": "به TechCrunch Mobility، مرکز شما برای آینده حمل و نقل و اکنون، بیش از هر زمان دیگری، نقشی که هوش مصنوعی در آن ایفا می کند، خوش آمدید. من می‌خواهم همه شما را آنجا ببینم، بنابراین در اینجا یک تخفیف 30 درصدی برای بلیط‌های Disrupt با کد mobility30 وجود دارد. برای اطلاعات بیشتر در مورد نمایش، به پایین بروید. شرکت‌های کامیون‌های خودران Aurora Innovation و Kodiak AI این هفته معافیت فدرال دریافت کردند که مانع بزرگ تجاری‌سازی را از بین می‌برد. بر اساس قوانین فدرال، اگر یک دکل بزرگ سنتی با مشکل مواجه شود، راننده انسانی باید جلوی آن را بگیرد، چراغ‌های خطر را فعال کند و سپس به صورت فیزیکی مثلث‌های هشدار دهنده بازتابنده را در عرض 10 دقیقه در جاده قرار دهد تا به سایر کاربران جاده هشدار دهد. اما اگر یک مشکل مکانیکی یک کامیون خودران را مجبور به عقب نشینی کند، هیچ راننده انسانی برای نصب آن دستگاه های هشدار دهنده وجود ندارد. این یک مانع به اندازه کافی بزرگ بود که Aurora تنظیم کننده های ایمنی فدرال را در مورد این الزام به دادگاه کشاند. پس از اینکه دادگاه درخواست خود را برای معافیت رد کرد، شرکت مبارزه را به دادگاه استیناف منطقه کلمبیا تشدید کرد. (شرکت ها در انتظار تصمیم گیری، معافیت موقت داشتند.) اکنون Aurora و دیگر توسعه دهندگان کامیون های خودران از اداره ایمنی فدرال موتور حامل چراغ سبز نشان داده اند. این آژانس یک معافیت پنج ساله اعطا کرده است که به شرکت‌ها اجازه می‌دهد دستگاه‌های هشداردهنده کنار جاده‌ای مانند مثلث‌های هشدار بازتابنده را با چراغ‌های هشدار نصب شده در کابین جایگزین کنند. اولین صفحه پاسخ دهندگان Aurora را بررسی کنید تا ببینید چگونه کار می کند. دانیل گاف، معاون امور خارجی در کودیاک AI، گفت که این معافیت به صنعت کمک می‌کند «دوران خودگردان حمل و نقل بار در جاده‌های"}, {"source": "TechCrunch Main", "title": "Dawn Myers is making it easier to style, detangle, and care for curly hair", "link": "https://techcrunch.com/2026/10/11/dawn-myers-is-making-it-easier-to-style-detangle-and-care-for-curly-hair/", "summary": "Richualist is one of TechCrunch's Battlefield 200 Companies!", "date_str": "2026-10-11T16:00:00+00:00", "hash": "276aba3ef4c1e8ee", "title_fa": "داون مایرز حالت دادن، باز کردن و مراقبت از موهای مجعد را آسان‌تر می‌کند", "summary_fa": "به طور معمول، داون مایرز موهای خود را در یک آفرو بزرگ قدیمی می‌پوشد، و هر کسی که آفرو دارد می‌تواند تأیید کند که روزهای شستن - روال شستن و حالت دادن به موهای بافت‌دار - اغلب خسته‌کننده است. آنها زمان زیادی از گره گشایی، محصول، یک ظاهر طراحی و، خوب، زمان می برند. داشتم شارک تانک را تماشا می‌کردم، و ایده دختر فرفری دیگری وجود داشت، او از یک روز حدوداً هشت سال پیش، زمانی که برنامه‌ای برای یک محصول مو پخش شد، به یاد آورد. او به TechCrunch گفت: او شروع به فکر کردن به تمام ابزارهای مو در بازار، مانند سشوار و اتوهای فرکننده، \"چیزهایی که موهای مجعد طبیعی ما را صاف می کند و تغییر می دهد\" کرد، و افزود که شستن و حالت دادن به موهایش حدود یک ساعت و 20 دقیقه طول می کشد. هیچ‌کدام از این ابزارها به این کار کمک نمی‌کنند، و برای مایرز، شکافی را که همیشه در فضای سخت‌افزار زیبایی وجود داشته است، برجسته می‌کند - کمبود ابزار برای موهای بافت‌دار. این فضایی است که پیچیده، گران است و فقط نادیده گرفته شده است. او گفت: \"اگر به دوران برده داری فکر می کنید، ما موظف شدیم که موهایمان را بپوشانیم. از آنجا است که لباس های دوز از آنجا سرچشمه می گیرند. شما باید موهای خود را می پوشانید. چرا؟ زیرا موهای ما زشت و نامرتب و غیرقابل قبول به نظر می رسید.\" بعداً شانه‌های داغ، شل‌کننده‌های شیمیایی، و اتوهای صاف آمدند که همگی موهای بافت‌دار را صاف می‌کنند. تنها در حدود 15 سال گذشته است که زنان رنگین پوست و به ویژه زنان سیاه پوست و رک و پوست کنده، زنان سفید پوست نیز واقعاً احساس راحتی می کنند که موهای مجعد طبیعی خود را در معرض دید قرار دهند و واقعاً آنها را در آغوش بگیرند. بلافاصله"}, {"source": "TechCrunch Main", "title": "Efferon wants to eradicate the devastating toll of pediatric sepsis", "link": "https://techcrunch.com/2026/10/11/efferon-wants-to-eradicate-the-devastating-toll-of-pediatric-sepsis/", "summary": "This Battlefield 200 startup has developed blood-purification tech to save children.", "date_str": "2026-10-11T15:00:00+00:00", "hash": "39c317da66da3093", "title_fa": "Efferon می خواهد خسارات ویرانگر سپسیس کودکان را از بین ببرد", "summary_fa": "این استارت آپ Battlefield 200 فناوری تصفیه خون را برای نجات کودکان توسعه داده است. سپسیس، التهاب حاد ناشی از عفونت، یکی از علل اصلی مرگ و میر در دوران کودکی است و سالانه حدود 3 میلیون کودک زیر پنج سال به این بیماری مبتلا می شوند. این شرکت یک دستگاه پزشکی ساخته است که می گوید میزان نارسایی اندام ها را کاهش می دهد و به طور قابل توجهی بهبودی در کودکان را تسریع می کند. هنگامی که درمان های استاندارد مانند آنتی بیوتیک ها نمی توانند واکنش بیش از حد سیستم ایمنی را متوقف کنند، خون بیمار باید برای حذف سموم کشنده فیلتر شود. اینجاست که دستگاه‌های افرون، از جاذب‌های سیتوکین‌ها و سموم خطرناک، وارد عمل می‌شوند تا تفاوتی اساسی ایجاد کنند. دیما روماشین، بنیانگذار و مدیر عامل Efferon، آنچه در بدن در طول سپسیس اتفاق می افتد با آتش سوزی مقایسه می کند، جایی که یک پاسخ ایمنی به سرعت بدن را تحت تاثیر قرار می دهد. او به TechCrunch گفت: \"در آتش دو چیز وجود دارد: خود شعله و دودی که تولید می کند.\" در سپسیس، اندوتوکسین ها شعله های آتش و سیتوکین ها دود هستند. به گفته روماشین، Efferon، بر خلاف سایر دستگاه های موجود در بازار، مکانیزمی را توسعه داده است که می تواند هر دو را به یکباره جذب کند. اگرچه Efferon جاذب‌هایی را برای بزرگسالان تولید می‌کند، Efferon NEO، دستگاه اطفال آن که به طور خاص برای کودکان خردسال ساخته شده است، به‌ویژه موثر است. به گفته روماشین، از آنجایی که کودکان حجم خون در گردش به میزان قابل توجهی کمتری دارند، به دستگاه های پزشکی نیاز دارند که به طور خاص برای فیزیولوژی آنها مهندسی شده است. در ماه آوریل، Efferon NEO نشان CE، معادل تاییدیه FDA در اروپا را دریافت کرد، و آن را به اولین دستگاه تصفیه خون چندوجهی"}, {"source": "Ars Technica", "title": "Inside Amazon’s robotic arms race and what it means for the future of human work", "link": "https://arstechnica.com/ai/2026/10/inside-amazons-robotic-arms-race-and-what-it-means-for-the-future-of-human-work/", "summary": "No organization in the world operates more robots than Amazon. The company already has more than 1 million robots working in warehouses around the clock to make tens of millions of same-day and one-day package deliveries happen on a daily basis—and Amazon is poised to significantly grow that robotic fleet in the coming years as it establishes new factories to churn out increasingly more capable robot workers. Despite deploying so many robots, Amazon is also the second-largest corporate employer in the world, with more than 1.5 million full-time and part-time human workers, according to its 2025 annual report . Amazon executives say that the growing robot fleet has eased the burden on its human workforce by taking on the toughest fulfillment center tasks that carry the greatest risks of physical fatigue and injury. But labor advocacy groups and independent researchers point to evidence suggesting that warehouse automation driven by AI is not all upside for the humans who work alongside robots. “For the last 100 years, most of the automation that we've seen usually happens away from workers—you're taking that high-risk task away from the worker, and you're doing so in a way that is not physically proximate,” Brian Greenwood , professor of business at George Mason University, told Ars. “The rise of collaborative robots really changes that dynamic for two reasons: one is that it is physically proximate, and two, the robot has the ability to dictate the pace of work.” Read full article Comments", "date_str": "2026-10-12T12:43:10+00:00", "hash": "fbcb102d217fcb40", "title_fa": "درون مسابقه تسلیحات رباتیک آمازون و معنای آن برای آینده کار انسانی", "summary_fa": "هیچ سازمانی در دنیا به اندازه آمازون از روبات استفاده نمی کند. این شرکت در حال حاضر بیش از 1 میلیون ربات دارد که به صورت شبانه روزی در انبارها کار می کنند تا ده ها میلیون بسته یک روزه و یک روزه را به صورت روزانه تحویل دهند - و آمازون آماده است که در سال های آینده ناوگان رباتیک را به طور قابل توجهی افزایش دهد زیرا کارخانه های جدیدی را ایجاد می کند تا کارگران ربات های توانمندتر را جذب کند. طبق گزارش سالانه خود در سال 2025، علیرغم استقرار تعداد زیادی ربات، آمازون همچنین با بیش از 1.5 میلیون نیروی انسانی تمام وقت و پاره وقت، دومین کارفرمای بزرگ شرکتی در جهان است. مدیران آمازون می گویند که ناوگان رو به رشد روبات ها با انجام سخت ترین وظایف مرکز انجام که بیشترین خطرات خستگی جسمی و آسیب را به همراه دارد، بار نیروی انسانی خود را کاهش داده است. اما گروه‌های حامی نیروی کار و محققان مستقل به شواهدی اشاره می‌کنند که نشان می‌دهد اتوماسیون انبار که توسط هوش مصنوعی هدایت می‌شود برای انسان‌هایی که در کنار روبات‌ها کار می‌کنند همه چیز مثبت نیست. برایان گرین‌وود، استاد بازرگانی در دانشگاه جورج میسون، به Ars گفت: «در 100 سال گذشته، بیشتر اتوماسیون‌هایی که ما دیده‌ایم معمولاً به دور از دست کارگران اتفاق می‌افتد - شما این کار پرخطر را از کارگر دور می‌کنید، و این کار را به گونه‌ای انجام می‌دهید که از نظر فیزیکی نزدیک نیست. ظهور روبات‌های مشارکتی واقعاً به دو دلیل این پویایی را تغییر می‌دهد: یکی این که از نظر فیزیکی نزدیک است و دوم، این ربات توانایی دیکته کردن سرعت کار را دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن"}, {"source": "Ars Technica", "title": "Review: 4-hour Musk documentary feels like two different films", "link": "https://arstechnica.com/culture/2026/10/review-4-hour-musk-documentary-feels-like-two-different-films/", "summary": "Elon Musk is a very familiar figure to Ars readers, given his massive influence (for better and worse) on the technology sector over the last 20 years. Oscar-winning director Alex Gibney's latest biographical documentary—simply titled Musk —covers a lot of well-known ground and challenges the carefully crafted public image of Musk as a visionary tech titan. Gibney's documentary presents Musk as more of a Gilded Age confidence man, rejiggered for the 21st century: an investor cosplaying as an inventor whose real genius is pumping stocks and dazzling investors and the public alike with visions of a high-tech utopian future. The film is bound to push all the right outrage buttons, whether one is a Musk fan or a detractor—which makes it very much a product of the peculiar social media-driven era in which we live. Gibney has been making documentaries since the 1980s, covering such varied subjects as Jimi Hendrix, Hunter S. Thompson and gonzo journalism, WikiLeaks, Scientology, Steve Jobs, Elizabeth Holmes (the subject of another forthcoming documentary, You Can See Everything , featuring comedian Nathan Fielder), Boris Becker, The Sopranos creator David Chase , alleged Russian interference in the US 2016 presidential election, the opioid epidemic, and cyclist Lance Armstrong. He snagged his first Oscar nomination for 2005’s Enron: The Smartest Guys in the Room , and won the Oscar for Best Documentary Feature two years later for Taxi to the Dark Side . Read full article Comments", "date_str": "2026-10-11T18:10:54+00:00", "hash": "4612e99933e88477", "title_fa": "نقد و بررسی: مستند 4 ساعته ماسک شبیه دو فیلم متفاوت است", "summary_fa": "ایلان ماسک برای خوانندگان Ars یک چهره بسیار آشنا است، با توجه به تأثیر گسترده او (به خوبی و بدتر) در بخش فناوری در 20 سال گذشته. آخرین مستند بیوگرافی الکس گیبنی کارگردان برنده اسکار - که به سادگی ماسک نام دارد - زمینه های شناخته شده زیادی را پوشش می دهد و تصویر عمومی با دقت ساخته شده از ماسک به عنوان یک غول فناوری رویایی را به چالش می کشد. مستند گیبنی، ماسک را بیشتر به عنوان یک مرد با اعتماد به نفس عصر طلایی معرفی می‌کند که برای قرن بیست و یکم بازسازی شده است: سرمایه‌گذاری در نقش مخترعی که نبوغ واقعی او سهام را جمع‌آوری می‌کند و سرمایه‌گذاران و عموم مردم را با چشم‌اندازهایی از آینده‌ای اتوپیایی با تکنولوژی بالا خیره می‌کند. این فیلم قطعاً همه دکمه‌های خشم را فشار می‌دهد، چه کسی طرفدار ماسک باشد یا یک بدخواه - که آن را بسیار محصول دوران عجیب و غریب مبتنی بر رسانه‌های اجتماعی است که در آن زندگی می‌کنیم. گیبنی از دهه 1980 فیلم های مستند می سازد و موضوعات مختلفی مانند جیمی هندریکس، هانتر اس. تامپسون و روزنامه نگاری گونزو، ویکی لیکس، ساینتولوژی، استیو جابز، الیزابت هولمز (موضوع یکی دیگر از مستندهای آینده به نام You Can See Everything، با حضور کمدین فیلد، دیوید کریس، کمدین سوکرانو) را پوشش می دهد. چیس، مداخله ادعایی روسیه در انتخابات ریاست جمهوری 2016 ایالات متحده، اپیدمی مواد افیونی، و دوچرخه سوار لنس آرمسترانگ. او اولین نامزدی اسکار خود را در سال 2005 برای فیلم Enron: The Smartest Guys in the Room به دست آورد و دو سال بعد برای فیلم Taxi to the Dark Side برنده اسکار بهترین فیلم مستند بلند شد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید ایلان"}, {"source": "Ars Technica", "title": "Prime Video unveils Blade Runner 2099 full trailer at NYCC", "link": "https://arstechnica.com/culture/2026/10/prime-video-unveils-blade-runner-2099-full-trailer-at-nycc/", "summary": "We got our first look at Prime Video's new sci-fi series Blade Runner 2099 in July at San Diego Comic-Con. With the show's premiere roughly six weeks away, the streamer unveiled the full trailer this weekend at New York Comic-Con. Co-stars Michelle Yeoh and Hunter Schafer ( Euphoria ) joined showrunner Silka Luisa ( Shining Girls ) onstage for the big reveal. As Luisa described the show during the NYCC panel Saturday night: We are 50 years after [ Blade Runner ] 2049 and, bad news, the worst has happened. The replicant uprising that has been bubbling up in the films has taken place and the humans have lost. So the creations have surpassed their creators. And the series, the big question it asks is, ‘What happens when our time as a species ends?’ 2099 is taking place at a junction point when one species is ending and a new one is rising. The first film, something I loved about it, was that it was looking at mortality on a micro level. Roy Batty and the other replicants were fighting for more life. This show asks that same question but on a macro level. Mankind—what happens when we realize our time is running out? And are we going to accept that loss? Can we hold on to our humanity during it? Yeoh stars as Olwen, the dying Replicant, while Schafer plays Cora. The cast also includes Hugo Hamlet as Buster Friendly, as well as Dmitri Abold, Lewis Gribben, Katelyn Rose Downey, Daniel Rigby, Johnny Harris, Amy Lennox, Sheila Atim, Matthew Needham, Tom Burke, and Maurizio Lombardi—all in as-yet-undisclosed roles. Read full article Comments", "date_str": "2026-10-11T14:50:24+00:00", "hash": "6f7794318622fc03", "title_fa": "پرایم ویدیو از تریلر کامل Blade Runner 2099 در NYCC رونمایی کرد", "summary_fa": "ما اولین نگاه خود را به سریال علمی تخیلی جدید Prime Video Blade Runner 2099 در ماه جولای در کامیک-کان سن دیگو داشتیم. در حالی که تقریباً شش هفته تا آغاز نمایش باقی مانده است، استریمر از تریلر کامل این آخر هفته در کامیک-کان نیویورک رونمایی کرد. میشل یئو و هانتر شفر (Euphoria) همبازی‌هایشان برای نمایش بزرگ به سیلکا لویزا (دختران درخشان) روی صحنه پیوستند. همانطور که لویزا نمایش را در پانل NYCC شنبه شب توصیف کرد: ما 50 سال از [بلید رانر] 2049 می گذریم و، خبر بد، بدترین اتفاق رخ داده است. قیام تکراری که در فیلم ها موج می زند اتفاق افتاده و انسان ها شکست خورده اند. پس آفریده ها بر خالقان خود پیشی گرفته اند. و این سری، سوال بزرگی که می‌پرسد این است، «وقتی زمان ما به‌عنوان یک گونه به پایان می‌رسد، چه اتفاقی می‌افتد؟» ۲۰۹۹ در نقطه اتصالی اتفاق می‌افتد که یک گونه در حال پایان است و گونه جدیدی در حال افزایش است. اولین فیلم، چیزی که در مورد آن دوست داشتم، این بود که به مرگ و میر در سطح خرد نگاه می کرد. روی باتی و دیگر تکرار کننده ها برای زندگی بیشتر می جنگیدند. این نمایش همان سوال را می پرسد اما در سطح کلان. انسان - وقتی متوجه می شویم زمان ما در حال اتمام است چه اتفاقی می افتد؟ و آیا این ضرر را می پذیریم؟ آیا می توانیم در طول آن انسانیت خود را حفظ کنیم؟ Yeoh در نقش اولون، Replicant در حال مرگ بازی می‌کند، در حالی که Schafer نقش کورا را بازی می‌کند. بازیگران این فیلم همچنین شامل هوگو هملت در نقش باستر فرندلی و همچنین دیمیتری ابولد، لوئیس گریبن، کاتلین رز داونی، دنیل ریگبی، جانی هریس، امی لنوکس، شیلا آتیم، متیو نیدهام، تام برک و مائوریتسیو لومباردی هستند که همگی در نقش‌هایی هنوز"}, {"source": "Wired", "title": "They War-Gamed Dimming the Sun. It Went Even Worse Than You Think", "link": "https://www.wired.com/story/they-war-gamed-dimming-the-sun-it-went-even-worse-than-you-think/", "summary": "Solar geoengineering could buy humanity time against climate change—or trigger a dangerous new arms race. A first-of-its-kind simulation offered a glimpse of what happens when geopolitics takes the wheel.", "date_str": "2026-10-12T14:00:00+00:00", "hash": "85ccae529fc78061", "title_fa": "آنها با بازی جنگی Dimming the Sun را بازی کردند. حتی بدتر از آن چیزی که فکر می کنید پیش رفت", "summary_fa": "ژئومهندسی خورشیدی می تواند زمان بشریت را در برابر تغییرات آب و هوایی بخرد - یا یک مسابقه تسلیحاتی خطرناک جدید را آغاز کند. اولین شبیه سازی در نوع خود، نگاهی اجمالی به آنچه که ژئوپلیتیک فرمان را به دست می گیرد، ارائه می دهد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان وقتی نوبت به تصمیم گیری درباره سرنوشت سیاره می رسد، دکتر Colleen Golja همیشه فکر می کرد که علم و عقل پشت میز خواهند نشست. این تا یک روز صبح در سپتامبر گذشته در لندن بود، زمانی که محقق آب و هوا در and the World روی صحنه رفت، گفت: «شاید خوشتان بیاید، شاید هم نخواهید». اما، بازیگر کاپیتان کرک اعلام کرد، \"شما یک فیلم دوست داشتنی خواهید دید که توسط افرادی ساخته شده است که به آنها اهمیت می دهند.\" فیلم The Sixty-Year Mission با تمرکز بر مجموعه اصلی Star Trek که از سال 1966 تا 1969 پخش شد، توسط Mark A نوشته و کارگردانی شده است. آلتمن، خالق پادکست Inglorious Treksperts. این مستند که در جریان کامیک کان نیویورک نمایش داده شد و در سینماهای منتخب این آخر هفته به نمایش درآمد، تأثیر و میراث فرهنگی نمایش را بررسی می‌کند و همچنین نشان می‌دهد که تا چه اندازه محصول فضای سیاسی دورانی بود که در آن ساخته شد. آلتمن توضیح می‌دهد: «فکر می‌کنم مخاطبان از اینکه ماموریت شصت ساله نشان می‌دهد چگونه Star Trek را دهه 60 شکل داد، شگفت‌زده می‌شوند. برای این فیلم، آلتمن با ده ها طرفدار و ستاره سرشناس، از شتنر و سایمون پگ گرفته تا پیشتازان فضا: نسل بعدی، جاناتان فریکز و برنت اسپینر، مصاحبه کرد. خواهرزاده رئیس جمهور – و طرفدار Trek – مری ال. ترامپ از نمایش پیشگامانه نمایش، به ویژه ستوان اوهورا، نیکل نیکولز، تمجید می کند. جورج تاکی که نقش سولو را بازی می‌کرد، روایتی دلخراش از دوران حضور در اردوگاه بازداشت آمریکایی‌های ژاپنی در طول جنگ جهانی دوم ارائه"}, {"source": "Wired", "title": "Google Fitbit Edge: Specs, Features, Price, Release Date", "link": "https://www.wired.com/story/googles-fitbit-edge-debuts-a-replaceable-battery-and-brings-back-the-screen/", "summary": "The new $179 tracker features Pixel Watch smarts, week-long battery life, and an OLED screen.", "date_str": "2026-10-12T13:00:00+00:00", "hash": "316d22a0e2736bda", "title_fa": "Google Fitbit Edge: مشخصات، ویژگی‌ها، قیمت، تاریخ انتشار", "summary_fa": "ردیاب جدید 179 دلاری دارای هوشمند پیکسل واچ، عمر باتری یک هفته ای و صفحه نمایش OLED است. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Fitbit Air بدون صفحه Google سروصدا به پا کرد، اما سه سال است که این شرکت Charge 6 مجهز به نمایشگر خود را به روز کرده است. ردیاب قدیمی‌تر سن خود را نشان می‌دهد، فاقد تشخیص تمرین خودکار جدیدتر، معیارهای سلامت عمیق‌تر و رتبه‌بن غ جلو با تنظیم خودکار و چند ویژگی هوش مصنوعی) هستند. Kindle Aluminium فقط ویژگی‌های هوش مصنوعی را در مقایسه با نسخه‌های Signature ارائه می‌دهد، در حالی که بدنه متفاوت، 32 گیگابایت فضای ذخیره‌سازی و بدون تبلیغات صفحه قفل را نیز در بر می‌گیرد. این واقعاً برای تأیید تغییر قیمت کافی نیست، با این حال هنوز هم می بینم که آن را دوست دارم."}, {"source": "The Next Web", "title": "DeepSeek to lead seed round in $400mn robot AI start-up, Bloomberg reports", "link": "https://thenextweb.com/news/deepseek-winverse-ai-robot-seed-round", "summary": "DeepSeek has agreed to lead the first funding round for Winverse AI, a start-up building AI for robots, Bloomberg reported, citing people familiar with the matter. The seed round is worth tens of millions of dollars and would value Winverse at about $400mn after the investment. Meituan’s investment arm, Long-Z, has also committed, the people said. [ ] This story continues at The Next Web", "date_str": "2026-10-12T13:22:34+00:00", "hash": "d4c4e9f0441c209f", "title_fa": "بلومبرگ گزارش می دهد که DeepSeek در استارت آپ 400 میلیون دلاری ربات هوش مصنوعی رهبری خواهد کرد.", "summary_fa": "بلومبرگ به نقل از افراد آشنا گزارش داد که DeepSeek موافقت کرده است که اولین دور تأمین مالی Winverse AI را رهبری کند، یک هوش مصنوعی استارت آپی برای روبات ها. دور تخم ده ها میلیون دلار ارزش دارد و ارزش Winverse پس از سرمایه گذاری حدود 400 میلیون دلار خواهد بود. به گفته مردم، بازوی سرمایه گذاری Meituan، Long-Z، نیز متعهد شده است. [ ] این داستان در The Next Web ادامه دارد، آنها افزودند که معامله نهایی نیست و ارزش گذاری و سرمایه گذاران ممکن است تغییر کنند. Winverse امسال توسط هو هان، که تیم‌های زبان بینایی و هوش مصنوعی رباتیک Tencent را رهبری می‌کرد، تأسیس شد. او دارای مدرک دکترا از دانشگاه Tsinghua است و در Microsoft Research Asia و Baidu کار کرده است. او Tencent را ترک کرد زیرا تیم تحقیقاتی هوش مصنوعی خود را تغییر داد تا با رقبایی مانند DeepSeek و Moonshot هماهنگ شود. این یکی از بزرگترین شرط بندی های DeepSeek برای یک استارت آپ خواهد بود. این آزمایشگاه قبلاً در شانگهای، سازنده ربات‌های انسان‌نما، Unitree را خریداری کرده بود. DeepSeek نزدیک به جمع آوری حداقل 12 میلیارد دلار در دور با حمایت Tencent است، قبل از فهرست برنامه ریزی شده در اوایل سال 2027. این پول عمدتاً برای مدل های آموزشی و مراکز داده در نظر گرفته شده بود. چین در ساخت بدنه ربات پیشتاز است. هوشمندسازی آنها برای انجام وظایف دنیای واقعی به هوش مصنوعی متفاوتی از چت بات ها نیاز دارد و رقبای آمریکایی مانند Skild AI و Physical Intelligence در حال حاضر میلیاردها دلار ارزش دارند. DeepSeek، Long-Z و Hu به درخواست های بلومبرگ برای اظهار نظر پاسخ ندادند. مهم ترین اخبار فنی را هر هفته در صندوق ورودی خود دریافت کنید."}, {"source": "The Next Web", "title": "Nigerian fintech OPay files for New York IPO, Semafor reports", "link": "https://thenextweb.com/news/opay-nigeria-fintech-new-york-ipo", "summary": "Pay, a Nigerian payments and lending app, has filed to list on the New York Stock Exchange, Yinka Adegoke reported for Semafor. Earlier reports put its likely valuation at about $4bn. The company filed on 9 October, bne IntelliNews reported. It will trade under the ticker OPAY, and investors expect it to price in mid-November, Semafor said. OPay [ ] This story continues at The Next Web", "date_str": "2026-10-12T13:13:01+00:00", "hash": "0b967d74355ae8e5", "title_fa": "سمافور گزارش می‌دهد که OPay فین‌تک نیجریه برای عرضه اولیه سهام در نیویورک پرونده می‌کند", "summary_fa": "Yinka Adegoke برای Semafor گزارش داد که Pay، یک برنامه پرداخت و وام نیجریه ای، در فهرست بورس نیویورک ثبت شده است. گزارش های قبلی ارزش احتمالی آن را حدود 4 میلیارد دلار نشان می داد. bne IntelliNews گزارش داد که این شرکت در 9 اکتبر ثبت نام کرده است. سمافور گفت که این ارز تحت تیک OPAY معامله می شود و سرمایه گذاران انتظار دارند در اواسط نوامبر قیمت گذاری شود. OPay [ ] این داستان در The Next Web ادامه دارد، درآمد OPay در نیمه اول سال 2026 با 137 درصد افزایش به 467 میلیون دلار رسید. درآمد خالص بیش از چهار برابر شد و به 91 میلیون دلار رسید. وام دادن در حال حاضر بزرگترین منبع درآمد آن است، قبل از پرداخت ها. نزدیک به نه دهم درآمد از نیجریه است. OPay در سال 2018 راه اندازی شد و توسط میلیاردر چینی ژو یاهویی کنترل می شود. زمانی برنامه‌های ابربرنامه‌ای را دنبال می‌کرد، با تاکسی‌های موتوری و تحویل غذا، قبل از اینکه به خدمات مالی محدود شود. بین سال‌های 2018 تا 2021، 570 میلیون دلار از سرمایه‌گذاران به رهبری سافت‌بانک جمع‌آوری کرد. بازوی آفریقای استاندارد بانک با سرمایه گذاری تا سقف 200 میلیون دلار موافقت کرده است که پس از فهرست شدن، 4.99 درصد از سهام را در اختیار دارد. انتظار می رود که رئیس آفریقای آن، Lungisa Fuzile، به هیئت مدیره OPay بپیوندد. OPay همچنین یک لیست دوم در لاگوس را برنامه ریزی می کند. بایگانی آن هشدار می دهد که ممکن است سهام آنجا با سهامی که در نیویورک معامله می شود قابل مبادله نباشد. این اولین فین تک با مشتریان عمدتا نیجریه ای خواهد بود که در ایالات متحده فهرست می شود. فهرست های قبلی آفریقایی در نیویورک، مانند جومیا، نتایج متفاوتی داشته است. مهم ترین اخبار فنی را هر هفته در صندوق ورودی"}, {"source": "The Next Web", "title": "Loops raises $3.5M to build the AI operating system for commerce", "link": "https://thenextweb.com/news/loops-3-5m-seed-round-ai-commerce-a16z-speedrun", "summary": "Online shopping has become very good at showing people thousands of products and surprisingly bad at helping them choose one. Loops was built around the idea that AI can collapse those experiences into one continuous journey. The company announced a $3.5 million seed round from a16z speedrun, NTT Docomo, Connecticut Innovations, Alumni Ventures and Monday [ ] This story continues at The Next Web", "date_str": "2026-10-12T12:00:19+00:00", "hash": "fac5867afc747669", "title_fa": "Loops 3.5 میلیون دلار برای ساخت سیستم عامل هوش مصنوعی برای تجارت جمع آوری می کند", "summary_fa": "خرید آنلاین در نشان دادن هزاران محصول به مردم بسیار خوب و به طرز شگفت انگیزی در کمک به انتخاب یکی از آنها بد شده است. Loops بر اساس این ایده ساخته شد که هوش مصنوعی می تواند این تجربیات را در یک سفر مداوم جمع کند. این شرکت مبلغ 3.5 میلیون دلاری را از a16z speedrun، NTT Docomo، Connecticut Innovations، Alumni Ventures و دوشنبه اعلام کرد. این به کسب‌وکارها کمک می‌کند تا بفهمند یک خریدار در تلاش است تا به چه چیزی دست پیدا کند، محصولات مناسب را معرفی کند و آنها را در تصمیم گیری راهنمایی کند. خرده فروش مجبور نیست چندین محصول هوش مصنوعی را در پشت صحنه جمع کند. این بودجه از توسعه محصول، ظرفیت استقرار مشتری و گسترش بین المللی پشتیبانی می کند. هوش مصنوعی در حال ورود به تجارت الکترونیک یک گردش کار در یک زمان است. یک محصول جستجو را بهبود می بخشد، دیگری به سؤالات خریداران پاسخ می دهد، دیگری توضیحات محصول را می نویسد، دیگری آزمایش مجازی را انجام می دهد. هرکدام به تنهایی مفید هستند و خرده فروش باید آنها را به هم بچسباند. حلقه ها حول همان دانش محصول، زمینه کسب و کار و سفر مشتری ایجاد می شوند، بنابراین هر بخش، قسمت های دیگر را تیز می کند. داده های کاتالوگ بهتر جستجو را بهبود می بخشد، جستجو زمینه دستیار را فراهم می کند، و مکالمات مشتری نشان می دهد که اطلاعات محصول در کجا ضعیف است. ایلکر سلیم زورلو اوغلو، رئیس و یکی از بنیانگذاران Loops می‌گوید: «بزرگ‌ترین اشتباهی که می‌بینیم این است که هوش مصنوعی را مجموعه‌ای از ویژگی‌ها می‌دانیم. \"یک خرده‌فروش به پنج محصول مختلف هوش مصنوعی نیاز ندارد که هر کدام یک تکه از مشتری را درک کنند. به سیستمی نیاز دارد که کاتالوگ، تجارت و آنچه خریدار در تلاش است انجام دهد را"}, {"source": "The Next Web", "title": "Your company has a strategy, and your team has no idea what it is", "link": "https://thenextweb.com/news/strategy-execution-teams-cant-name-priorities-okrs-tool", "summary": "Somewhere in your organisation, right now, a team is making a decision. A product prioritisation call, a budget reallocation, a hiring choice, a client proposal. The people making it are smart, experienced, and acting in good faith. There is a fair chance they are making it with no idea what the company’s strategy says about [ ] This story continues at The Next Web", "date_str": "2026-10-12T10:38:07+00:00", "hash": "7d76717f159eb248", "title_fa": "شرکت شما یک استراتژی دارد و تیم شما هیچ ایده ای از آن ندارد", "summary_fa": "در جایی از سازمان شما، در حال حاضر، یک تیم در حال تصمیم گیری است. فرا ای پیامد در مورد افراد، مانند اعتبار یا اشتغال باشد. مایکروسافت گفت که این مدل بالاترین دقت را در مقایسه 36 معیار خود کسب کرده است. که تقریباً 150000 سؤال را پوشش می داد که از آموزش نابینا می شد. در آزمایشات خود، این مدل 2.5 برابر سریعتر از مدل دوم H2O-Lightning-4B v1.1 بود. 35 برابر سریعتر از GPT-6 Sol OpenAI بود. زمانی که مایکروسافت همان درخواست را بازنویسی یا سفارش داد، مدل تصمیم خود را به طور متوسط ​​1.3 درصد از مواقع تغییر داد. مایکروسافت همچنین آن را روی 5250 درخواست در 11 معیار ایمنی آزمایش کرد. این موارد محتوای مضر، تلاش‌های فرار از زندان و تزریق سریع را پوشش می‌دهد. Xbox Research از این"}, {"source": "The Next Web", "title": "Japan steps up cyber warnings as data leaks hit millions of customers", "link": "https://thenextweb.com/news/japan-cyberattacks-warning-data-leaks", "summary": "Japan’s government has told ministries, local authorities and companies to step up their cyber defences. A wave of attacks has exposed the data of millions of customers. The National Cybersecurity Office sent the instructions on Friday, the Associated Press reported. “The attacks are getting increasingly sophisticated,” Digital Transformation Minister Toshiharu Furukawa said this week. The [ ] This story continues at The Next Web", "date_str": "2026-10-12T08:48:37+00:00", "hash": "bbeefd9607edf1a9", "title_fa": "ژاپن هشدارهای سایبری را افزایش می دهد زیرا نشت داده ها میلیون ها مشتری را تحت تأثیر قرار می دهد", "summary_fa": "دولت ژاپن به وزارتخانه ها، مقامات محلی و شرکت ها گفته است که دفاع سایبری خود را افزایش دهند. موجی از حملات داده های میلیون ها مشتری را افشا کرده است. به گزارش آسوشیتدپرس، دفتر ملی امنیت سایبری این دستورالعمل را روز جمعه ارسال کرد. توشیهارو فوروکاوا، وزیر تحول دیجیتال این هفته گفت: \"حملات به طور فزاینده پیچیده تر می شوند.\" [ ] این داستان در The Next Web ادامه دارد در همان روز، حزب حاکم لیبرال دمکرات جلسه اضطراری ستاد راهبرد امنیت سایبری خود را برگزار کرد. فایننشال تایمز گزارش داد، رئیس آن، ماساکی تایرا، گفت که ژاپن در \"وضعیت اضطراری در فضای سایبری\" قرار دا فته FT، مذاکرات در مراحل اولیه است و همچنان ممکن است از بین برود. [ ] این داستان در The Next Web ادامه دارد، FT گزارش داد که یک معامله می تواند اشکال مختلفی داشته باشد. یکی به اصطلاح acqui-hire است. انویدیا به جای خرید مستقیم شرکت، کارکنان Reflection را استخدام کرده و به فناوری آن مجوز می دهد. این مسیر می تواند از بررسی طولانی مدت نظارتی جلوگیری کند. گزینه های دیگر شامل تامین تراشه های بیشتر به استارت آپ یا افزایش سهام انویدیا است. FT گزارش داد که انویدیا در حال حاضر 800 میلیون دلار در Reflection سرمایه گذاری کرده است. به گفته FT، دولت ترامپ امیدوار است که Reflection با مدل های باز ارزان چینی مانند DeepSeek رقابت کند. بلومبرگ به طور جداگانه گزارش داد که انویدیا در حال مذاکره برای افزایش سرمایه گذاری خود در Reflection یا ارائه قدرت محاسباتی به آن است و به نقل از یک فرد آشنا با این موضوع. این شخص گفت که مذاکرات زودهنگام است و دو طرف درباره شرایط توافق نکرده اند. میشا لاسکین و ایوانیس آنتونوگلو، هر دو محقق سابق گوگل دیپ مایند، Reflection را در سال 2024 تاسیس کردند. در 5 اکتبر اولین مدل خود، Beam را منتشر کرد، یک مدل وزن باز با هدف کدنویسی و وظایف عامل. این استارت آپ همچنین قراردادهای محاسباتی با SpaceX ایلان ماسک و ارائه دهنده ابر Nebius امضا کرده است. در ماه سپتامبر، انویدیا با خرید Hugging Face به مبلغ 12.93 میلیارد دلار موافقت کرد. همچنین با استارتاپ تراشه Groq که مدیر اجرایی و مدیر عامل آن به انویدیا ملحق شدند،"}, {"source": "MIT Tech Review", "title": "The Download: moon city problems and drone traffic controllers", "link": "https://www.technologyreview.com/2026/10/12/1146376/the-download-moon-city-drone-air-traffic-controllers/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. Mars may be a hellhole, but the moon is not far behind The US and China are racing to build bases on the moon, with NASA hoping to establish a small lunar city by the end of the century. But the moon is a tremendously hostile place to set up camp. A sprawling lunar base must be safe for its inhabitants, protected from falling asteroids, endless cosmic radiation, razor-sharp lunar dust, and torturous temperature swings. It also must be somewhat self-sustaining. That will require autonomous robots, nuclear power, and a way to use the moon’s resources to keep the base operating. But the chief obstacle may be one of political will. Find out what stands in the way of a city on the moon . —Robin George Andrews This story is from the next issue of our print magazine. Subscribe now to get your hands on a copy as soon as it lands on Wednesday 21 October! 10 Climate Tech Companies to Watch: Brimstone and its one-stop process for making cleaner cement and critical minerals Brimstone is one of MIT Technology Review’s 10 Climate Tech Companies to Watch 2026 , available exclusively to subscribers . Brimstone is a code-switching climate tech company for these polarized political times. The US startup is part green cement company, part critical mineral producer. During the Biden administration, its primary pitch was cement that generates about 60% fewer greenhouse-gas emissions. It achieves this by switching to silicate rocks instead of standard limestone, which releases carbon dioxide when heated. Under the Trump administration, however, the company is emphasizing another benefit of its process: the ability to extract valuable materials from those same rocks. Discover how it’s making strides on two industrial problems . —James Temple Subscribers can now access the full 10 Climate Tech Companies to Watch , spanning everything from geothermal power plants to smart turbines and semi-solid-state cells. Job titles of the future: Delivery drone air traffic controller The moment Trevor Wischnewsky heard that drones were delivering pizza and sushi around his Texas neighborhood, his mind was made up. “It was super fascinating,” he says. “I just immediately wanted to be a part of it.” Wischnewsky is now an RPIC, or remote pilot in command, at a company called FlyTrex. An RPIC is like an air traffic controller. But instead of airplanes, they ove", "date_str": "2026-10-12T12:10:00+00:00", "hash": "638be587d587a802", "title_fa": "دانلود: مشکلات شهر ماه و کنترل کننده های ترافیک پهپاد", "summary_fa": "ایالات متحده و چین در حال رقابت برای ساخت پایگاه هایی در ماه هستند و ناسا امیدوار است تا پایان قرن یک شهر کوچک قمری ایجاد کند. اما ماه مکان بسیار خصمانه ای برای ایجاد کمپ است. یک پایگاه پراکنده ماه باید برای ساکنانش ایمن باشد، از سقوط سیارک ها، تشعشعات کیهانی بی پایان، گرد و غبار ماه مانند تیغ و نوسانات دمایی عذاب آور محافظت شود. همچنین باید تا حدودی خودپایدار باشد. این به ربات‌های مستقل، انرژی هسته‌ای و راهی برای استفاده از منابع ماه برای ادامه فعالیت پایگاه نیاز دارد. اما مانع اصلی ممکن است اراده سیاسی باشد. دریابید که چه چیزی بر سر راه یک شهر در ماه ایستاده است. این داستان از شماره بعدی مجله چاپی ما است. اکنون مشترک شوید تا به محض اینکه در چهارشنبه 21 اکتبر به دستتان رسید، نسخه ای از آن را دریافت کنید! Brimstone یکی از 10 شرکت فناوری اقلیمی MIT Technology Review برای تماشای 2026 است که به طور انحصاری برای مشترکین در دسترس است. Brimstone یک شرکت فناوری آب و هوای تغییر کد برای این دوران سیاسی قطبی است. این استارت آپ ایالات متحده بخشی از شرکت سیمان سبز و بخشی از تولید کننده مواد معدنی حیاتی است. در دوران دولت بایدن، زمین اولیه آن سیمانی بود که حدود 60 درصد کمتر گازهای گلخانه ای تولید می کرد. این امر با تبدیل به سنگ های سیلیکات به جای سنگ آهک استاندارد، که هنگام گرم شدن دی اکسید کربن آزاد می کند، به دست می آورد. با این حال، تحت دولت ترامپ، این شرکت بر مزیت دیگری از فرآیند خود تأکید می کند: توانایی استخراج مواد با ارزش از همان سنگ ها. کشف کنید که چگونه در دو مشکل صنعتی گام بر می دارد. مشترکین اکنون می‌توانند به 10 شرکت فناوری آب و هوا برای تماشا دسترسی داشته باشند"}, {"source": "MIT Tech Review", "title": "Mars may be a hellhole, but the moon is not far behind", "link": "https://www.technologyreview.com/2026/10/12/1145760/imagining-building-cities-on-the-moon/", "summary": "Welcome to the second space race. You can be forgiven for experiencing déjà vu. Last time, it was the Soviet Union and the United States vying to be the first to plant some flags. Now it’s a sprint to the lunar surface between America and China—alongside a host of varyingly friendly and rival nations—plus a cornucopia of private spaceflight companies. And this time it looks like they’re getting ready to set up camp. There will be, the contenders say, bases on the moon, permanently inhabited castles under the stars. The notion of a moon base, fanciful as it might sound, isn’t new. But this year, under the leadership of Administrator Jared Isaacman, NASA has been flooding the zone with bold announcements . If all goes according to plan—a plan that will likely cost tens of billions of dollars to start—there will be drones , robotic landers, communication satellites , and a nuclear power plant ; there will be plant terrariums and moonquake sensors; there will be mechanized scouts exploring craters for water. Initial astronaut missions to the lunar surface, which the US is currently planning to start in 2028, will be focused on exploration and technological experimentation. But the idea is that we will—some time in the 2030s—get to a point where there will be habitation quarters for long-term stays, surrounded by a network of scientific research stations, resource mining and processing plants, and landing pads for spaceships. “It’s going to be an expanse,” says Carlos García-Galán, NASA’s moon base program manager—one that will add up to “hundreds of square miles.” The effort is undoubtedly being fueled by nationalistic competition. China has near-identical plans to build its own base on the moon. And being first matters, because the “victor” gets to define the terms. What is the moon, exactly? Is it a militarized outpost? Is it a manufacturing hub? Is it a wilderness to be studied and preserved? But there are also other reasons to go. Earth’s companion contains primeval rocks that hold clues to the formation of the entire solar system. The lunar surface, with virtually no atmosphere in the way, is an ideal place to put telescopes that could examine the most ancient epochs of the cosmos. The far side of the moon would be “a fantastic place to explore the further universe,” says Josef Aschbacher, the European Space Agency’s director general. And it’s way more energy efficient to launch rockets from the low-gravity lunar surface than it is from Earth, meaning sen", "date_str": "2026-10-12T09:37:02+00:00", "hash": "64a07c2ecbbddc77", "title_fa": "مریخ ممکن است یک جهنم باشد، اما ماه از آن عقب نیست", "summary_fa": "به دومین مسابقه فضایی خوش آمدید. شما را می توان به خاطر تجربه دژاوو بخشید. آخرین بار، این اتحاد جماهیر شوروی و ایالات متحده بود که برای اولین بار برای نصب پرچم رقابت می کردند. اکنون این دوی سرعت به سطح ماه بین آمریکا و چین است - در کنار انبوهی از کشورهای مختلف دوست و رقیب - به‌علاوه مجموعه‌ای از شرکت‌های خصوصی پرواز فضایی. و این بار به نظر می رسد که آنها برای راه اندازی کمپ آماده می شوند. مدعیان می‌گویند، پایگاه‌هایی روی ماه، قلعه‌های دائمی در زیر ستاره‌ها وجود خواهد داشت. تصور پایه ماه، هر چند خیالی به نظر برسد، جدید نیست. اما امسال، تحت رهبری مدیر جارد آیزاکمن، ناسا با اعلامیه های جسورانه منطقه را پر کرده است. اگر همه چیز طبق برنامه پیش برود - طرحی که احتمالاً برای شروع آن ده ها میلیارد دلار هزینه خواهد داشت - هواپیماهای بدون سرنشین، فرودگرهای روباتیک، ماهواره های ارتباطی و یک نیروگاه هسته ای وجود خواهند داشت. تراریوم های گیاهی و سنسورهای زلزله وجود خواهد داشت. پیشاهنگان مکانیزه ای وجود خواهند داشت که دهانه ها را برای یافتن آب کاوش می کنند. مأموریت‌های اولیه فضانوردان به سطح ماه، که ایالات متحده در حال برنامه‌ریزی برای آغاز آن در سال 2028 است، بر اکتشاف و آزمایش‌های فناوری متمرکز خواهد بود. اما ایده این است که ما -در مدتی در دهه 2030- به نقطه‌ای خواهیم رسید که محل‌هایی برای اقامت طولانی‌مدت وجود داشته باشد که توسط شبکه‌ای از ایستگاه‌های تحقیقاتی علمی، کارخانه‌های استخراج و پردازش منابع، و سکوهای فرود برای سفینه‌های فضایی احاطه شده باشد. کارلوس گارسیا گالان، مدیر برنامه های پایگاه ماه ناسا، می گوید: «این یک وسعت خواهد بود. این تلاش بدون شک توسط رقابت ملی گرایانه تقویت می شود. چین برنامه‌های تقریباً مشابهی برای ساخت پایگاه خود در ماه دارد. و اول بودن مهم است، زیرا"}, {"source": "MIT Tech Review", "title": "The ecologist revealing the invisible networks that revive rainforests", "link": "https://www.technologyreview.com/2026/10/12/1145745/daisy-dent-ecologist-revealing-invisible-networks-revive-rainforests/", "summary": "In a research station in central Panama, you can walk through a century of forest time, watching scrubby plots of adolescent trees give way to cathedral-­like canopies of mature growth. Forest ecologist Daisy Dent, a senior scientist at ETH Zurich, oversees this sequence of plots across the Barro Colorado Nature Monument, some of which date as far back as the 19th century. Not one of the trees she surveys was planted by human hands. She maps, measures, and tracks each trunk that emerges, revealing how waves of tree life rise from bare earth. Tropical forests like these are our planet’s biggest terrestrial carbon sink, accounting for around 40% of carbon stored on land . As part of an international network of researchers, Dent is deciphering the networks of animal and plant interactions that enable some forests to recover after destruction. The goal is a low-cost, high-impact alternative to typical carbon-­crediting schemes, which plant huge areas with a single species of tree. For over a decade, her research has built a body of evidence that such large “monocrop” programs could be expensive mistakes—and that more resilient forests can rebound naturally in just a few decades, re-creating ecosystems that suck up vast quantities of carbon dioxide. Few places are better to demonstrate this than Barro Colorado, a reserve covering the forested peninsulas and islands that formed when construction of the Panama Canal flooded the area in 1914. Under the management of the Smithsonian Tropical Research Institute, generations of ecologists have amassed more than a century of records. That means Dent can trace why some plots rebound after clear-cutting for farming and forestry while others falter. Fruit-eating animals—including spider monkeys, bats, and parrots—are responsible for planting more than 70% of trees in tropical forests, and Dent’s dataset can tell which built each patch of trees by depositing seeds in their nutrient-rich droppings. Many of these creatures worked together to plant a diverse 70-year-old patch whose canopy is approaching the stunning structure and richness of an ancient jungle. In contrast, a patch of similar age populated by narrow trunks of a single long-lived species, Gustavia superba , hints that tropical rodents called agoutis are more or less the sole animal architects behind this more homogeneous forest. The data she collects helps write a playbook for when to let ecosystems regenerate and when to give them a helping hand. One 2024 est", "date_str": "2026-10-12T09:00:00+00:00", "hash": "486e6c4e0c1e15a7", "title_fa": "بوم شناس شبکه های نامرئی را که جنگل های بارانی را احیا می کند را آشکار می کند", "summary_fa": "در یک ایستگاه تحقیقاتی در مرکز پاناما، می‌توانید در طول یک قرن جنگل قدم بزنید و با تماشای زمین‌های پوشیده شده از درختان نوجوان، جای خود را به سایبان‌های کلیسای جامع با رشد بالغ ببینید. دیزی دنت، بوم‌شناس جنگل، دانشمند ارشد ETH زوریخ، بر این توالی نقشه‌ها در سراسر بنای تاریخی بارو کلرادو نظارت می‌کند که قدمت برخی از آنها به قرن نوزدهم بازمی‌گردد. هیچ یک از درختانی که او بررسی می کند توسط دست انسان کاشته نشده است. او هر تنه‌ای را که ظاهر می‌شود، نقشه‌برداری، اندازه‌گیری و ردیابی می‌کند و نشان می‌دهد که چگونه امواج زندگی درختان از زمین برهنه بلند می‌شوند. جنگل های استوایی مانند این بزرگترین مخزن کربن زمینی سیاره ما هستند که حدود 40 درصد کربن ذخیره شده در خشکی را تشکیل می دهند. به عنوان بخشی از یک شبکه بین‌المللی از محققان، دنت در حال رمزگشایی شبکه‌های فعل و انفعالات جانوری و گیاهی است که برخی از جنگل‌ها را قادر می‌سازد پس از نابودی بازیابی شوند. هدف، جایگزینی کم‌هزینه و با تاثیر بالا برای طرح‌های معمولی اعتباردهی کربن است که مناطق وسیعی را با یک گونه درخت کاشت می‌کنند. برای بیش از یک دهه، تحقیقات او مجموعه‌ای از شواهد را به وجود آورده است که نشان می‌دهد چنین برنامه‌های بزرگ «تک‌بررسی» می‌تواند اشتباهات گران‌قیمتی باشد – و اینکه جنگل‌های انعطاف‌پذیرتر می‌توانند به طور طبیعی طی چند دهه به حالت اولیه بازگردند و اکوسیستم‌هایی را دوباره ایجاد کنند که مقادیر زیادی دی اکسید کربن را جذب می‌کنند. مکان‌های کمی بهتر از بارو کلرادو، ذخیره‌گاهی که شبه‌جزایر و جزایر جنگلی را پوشش می‌دهد، زمانی که ساخت کانال پاناما در سال 1914 منطقه را زیر آب گرفت، به وجود آمد. این بدان معناست که دنت می تواند ردیابی کند که چرا برخی از طرح ها پس از برش برای کشاورزی و جنگلداری باز می گردند در حالی"}, {"source": "Business Insider", "title": "I want our $1 billion business to stay in the family, but that doesn't mean I'll automatically hire my kids", "link": "https://www.businessinsider.com/milos-tea-ceo-tricia-wallwork-family-business-lawyer-2026-10", "summary": "Tricia Wallwork is now the CEO of her family business. Courtesy of Tricia Wallwork Tricia Wallwork is the CEO of Milo's Tea, founded by her grandfather in 1946. She's grown the brand exponentially, and recently surpassed $1 billion in retail sales. She's learned about family governance from other family-owned companies, she says. This as-told-to essay is based on a conversation with Tricia Wallwork , CEO and Chair of the Board at Milo's Tea . It has been edited for length and clarity . When my grandad Milo returned from World War II , he married my grandma, Bea, the very next week. He likes to say he only had $20 and a footlocker, but he also had a vision: for a hamburger stand serving burgers, fries, pies, and sweet tea to Atlanta's steelworkers. That was the beginning of Milo's Tea. Since then, the business has had three distinct iterations: the initial burger stand, franchise restaurants that my dad and stepmother ran, and now the tea company that I operate. Tricia Wallwork s grandfather started the family company when he came back from war. Courtesy of Tricia Wallwork Through them all, we've been guided by my grandparents' founding values: listening to customers, using real ingredients , and treating people well. I became a lawyer, then joined the family business I never wanted to work at the family business , so I became a lawyer. I thought I would save the world, but really, I was just writing letters and representing companies. It wasn't what I had envisioned, so I traded my high heels for steel-toed boots and started working at Milo's. My dad and stepmom had noticed a trend: people would drive through their restaurants just to order sweet tea . Running a hamburger joint is difficult, so they decided to sell the franchise company and use the proceeds to start the first version of our tea plant. I saw them constantly figuring things out on the fly — like using pantyhose to filter tea. Things are much more sophisticated today, but I still have that entrepreneurial spirit. I've grown the company drastically over 14 years I became CEO of Milo's Tea in 2012, and since then, our growth has been like a hockey stick. In 2012, we did about $30 million in retail sales. In September, we surpassed $1 billion in retail sales, ahead of our projections. It's a very unusual situation to be in as a third-generation business owner . I've tried to find mentors to help me get ahead of things and manage this rocket ship. I've surrounded myself with great advisors, who h", "date_str": "2026-10-12T11:42:01+00:00", "hash": "b246ca5828dea55f", "title_fa": "من می خواهم تجارت 1 میلیارد دلاری ما در خانواده باقی بماند، اما این بدان معنا نیست که به طور خودکار فرزندانم را استخدام می کنم", "summary_fa": "Tricia Wallwork اکنون مدیر عامل شرکت خانوادگی خود است. با حسن نیت از Tricia Wallwork Tricia Wallwork مدیرعامل Milo's Tea است که توسط پدربزرگش در سال 1946 تأسیس شد. او برند را به طور تصاعدی رشد داد و اخیراً از یک میلیارد دلار فروش خرده فروشی فراتر رفت. او می‌گوید که او در مورد حکومت خانواده از سایر شرکت‌های خانوادگی آموخته است. این مقاله همانطور که گفته شد بر اساس گفتگو با Tricia Wallwork، مدیر عامل و رئیس هیئت مدیره Milo's Tea است. برای طول و وضوح ویرایش شده است. وقتی پدربزرگم میلو از جنگ جهانی دوم برگشت، هفته بعد با مادربزرگم بیا ازدواج کرد. او دوست دارد بگوید که فقط 20 دلار و یک جا پایی دارد، اما یک چشم انداز هم داشت: برای یک غرفه همبرگر که برای کارگران فولاد آتلانتا همبرگر، سیب زمینی سرخ کرده، پای و چای شیرین سرو می کرد. این شروع چای میلو بود. از آن زمان، این کسب و کار سه تکرار متمایز داشته است: غرفه اولیه برگر، رستوران‌های فرنچایزی که پدر و نامادری من اداره می‌کردند، و اکنون شرکت چای که من آن را اداره می‌کنم. پدربزرگ تریشا والورک وقتی از جنگ برگشت شرکت خانوادگی را راه اندازی کرد. با حسن نیت از Tricia Wallwork از طریق همه آنها، ما بر اساس ارزش های بنیادی پدربزرگ و مادربزرگم هدایت شده ایم: گوش دادن به مشتریان، استفاده از مواد واقعی و رفتار خوب با مردم. من یک وکیل شدم، سپس به تجارت خانوادگی پیوستم و هرگز نمی خواستم در تجارت خانوادگی کار کنم، بنابراین وکیل شدم. فکر می کردم دنیا را نجات خواهم داد، اما واقعاً فقط نامه می نوشتم و نماینده شرکت ها بودم. آن چیزی که تصور می کردم نبود، بنابراین کفش های پاشنه بلندم را با چکمه های فولادی عوض کردم و در Milo's شروع به کار کردم. پدر و"}, {"source": "Business Insider", "title": "Palantir CTO says some AI researchers are taking up smoking because they expect AI to cure cancer", "link": "https://www.businessinsider.com/ai-researchers-smoking-ai-cure-cancer-palantir-cto-2026-10", "summary": "Palantir s CTO Shyam Sankar said taking up smoking has become a way for AI researchers to show how much they believe in AI. Tom Brenner/Bloomberg via Getty Images Some AI researchers are picking up cigarettes, Palantir's CTO said. Why? They think AI is going to cure cancer anyway, Shyam Sankar said. Lighting up is their way of showing others that their AI \"chips are all in,\" he said. Forget sleepmaxxing and cold plunging: smoking is the new lifestyle flex among AI researchers. At least, that's according to Palantir CTO Shyam Sankar , who said some AI researchers are taking up smoking to signal their belief that AI will eventually cure cancer . \"So many AI researchers have started smoking as a way of signaling to other researchers how much they believe in AI,\" Sankar said in an interview on CBS News' \"Face the Nation\" on Sunday. The logic, he said, is: \"I believe so much in AI that it's going to cure cancer. So I'm showing you my chips are all in.\" Sankar did not name any researchers or provide evidence for the claim. Smoking remains a major cause of preventable illness and death, and no AI breakthrough has eliminated the health risks associated with cigarettes. But the Palantir executive's remarks echo a countercurrent already visible in parts of the tech industry. As Business Insider's Henry Chandonnet reported last month, a small group of founders, engineers, and investors has embraced cigarettes in a sector otherwise known for optimizing their health with cold plunges, sleep tracking, and peptide treatments . For some of them, a cigarette break is an opportunity to meet people and network. For others, it's a way to come across as more relaxed and less polished than the typical startup founder. And some AI believers expect the technology to make smoking-related health risks a thing of the past. \"By the time you do get lung cancer, our AI robots are supposed to have cured that,\" Avi Schiffmann, the founder of AI wearable startup Friend, previously told Business Insider. 'The machine god of AGI' In the CBS News interview, Sankar raised the smoking anecdote while criticizing what he called Silicon Valley's \"mass psychosis\" and \"social delusion\" around AI. He has been outspoken in his criticism of AI safety advocates , whom he accused in the interview of treating artificial general intelligence as a \"machine god.\" Invoking philosopher Blaise Pascal's idea that humans have a \"God-shaped hole\" in their hearts, Sankar said that some people in Silicon Valley hav", "date_str": "2026-10-12T11:31:13+00:00", "hash": "e0a11ef5ec9aa74a", "title_fa": "مدیر ارشد فناوری Palantir می‌گوید برخی از محققان هوش مصنوعی به سیگار کشیدن روی آورده‌اند، زیرا انتظار دارند هوش مصنوعی سرطان را درمان کند", "summary_fa": "شیام سانکار، مدیر ارشد فناوری Palantir، گفت که سیگار کشیدن راهی برای محققان هوش مصنوعی شده است تا نشان دهند چقدر به هوش مصنوعی اعتقاد دارند. تام برنر/ بلومبرگ از طریق گتی ایماژ برخی از محققان هوش مصنوعی در حال برداشتن سیگار هستند، مدیر ارشد فناوری Palantir گفت. چرا؟ شیام سانکار گفت، آنها فکر می کنند که هوش مصنوعی به هر حال سرطان را درمان می کند. او گفت که روشن کردن روشی است که آنها برای نشان دادن به دیگران که \"تراشه های هوش مصنوعی\" آنها در دسترس هستند، است. حداکثر خواب و غوطه ور شدن در سرما را فراموش کنید: سیگار کشیدن شیوه زندگی جدید در میان محققان هوش مصنوعی است. حداقل، این به گفته شیام سانکار، مدیر ارشد فناوری Palantir است، که گفت برخی از محققان هوش مصنوعی سیگار کشیدن را شروع می‌کنند تا نشان دهند که هوش مصنوعی در نهایت سرطان را درمان می‌کند. سانکار روز یکشنبه در مصاحبه ای با شبکه CBS News \"Face the Nation\" گفت: \"بسیاری از محققان هوش مصنوعی سیگار کشیدن را به عنوان راهی برای نشان دادن میزان اعتقاد آنها به هوش مصنوعی شروع کرده اند.\" او گفت که منطق این است: \"من آنقدر به هوش مصنوعی اعتقاد دارم که سرطان را درمان می کند. بنابراین من به شما نشان می‌دهم که تراشه‌هایم تمام شده است.\" سانکار نام هیچ محققی یا مدرکی برای این ادعا ارائه نکرد. سیگار همچنان یکی از دلایل اصلی بیماری‌های قابل پیشگیری و مرگ است و هیچ پیشرفتی در هوش مصنوعی خطرات سلامتی مرتبط با سیگار را از بین نبرده است. اما اظهارات مدیر اجرایی Palantir بازتاب جریان متضادی است که قبلاً در بخش‌هایی از صنعت فناوری قابل مشاهده است. همانطور که هنری چاندونت از Business Insider در ماه گذشته گزارش داد، گروه کوچکی از بنیانگذاران، مهندسان و سرمایه گذاران سیگار را در بخشی که به دلیل"}, {"source": "Business Insider", "title": "When I thought of 'success,' I pictured a thriving career and high-achieving children. Then my daughter was born with complex medical needs.", "link": "https://www.businessinsider.com/having-child-with-disabilities-changed-definition-success-2026-10", "summary": "The author s definition of success changed when her daughter was born. Courtesy of Jamie Davis Smith When I was younger, I viewed success through the lens of typical milestones. I pictured a career as a lawyer, a family, and kids who would go on to their own thriving careers. When my daughter was born with complex medical needs and disabilities, my perspective changed. When I was younger, I pictured a career as an attorney and a family with high-achieving children who would one day build successful careers of their own. I built my life around these goals. I went to law school , got married, and let my job dictate when I started a family. For a while, everything seemed to be going according to plan. I had a thriving career as a civil rights lawyer that I loved, and I got pregnant right on schedule. Almost as soon as I saw two pink lines, I dove headlong into planning my child's future . I made a mental list of the activities she would need to be well-rounded and, laughably, even considered how the right preschool could eventually propel her into one of the country's best colleges. I planned to return to my full-time job a few months after giving birth and assumed that would go according to plan, too. However, my priorities shifted abruptly when my daughter was unexpectedly born with complex medical needs and disabilities. The author s daughter was born with complex medical needs and disabilities. Courtesy of Jamie Davis Smith My daughter's disabilities forced me to reconsider how I approached life I thought my first days as a new mother would be spent blissfully tracking feedings, tracking milestones, and joyfully putting my plans for my little family's future into place. However, instead of worrying about when my daughter would crawl, walk, and talk, I wondered whether she would live or die. That put her life, and mine, sharply into focus. At first, I still hoped our plans were only briefly derailed and that the vision I had for my family's future could still come to fruition. But when my daughter eventually came home from the neonatal intensive care unit, tethered to oxygen and monitors that beeped constantly, I realized that I needed to let go of the pressure and expectation that a successful life meant wealth, a professional career, and good schools . The author now has four kids, and thinks about their future differently. Courtesy of Jamie Davis Smith Leaning out was a necessity Changing my approach to life wasn't a choice at first. With a significantl", "date_str": "2026-10-12T11:17:01+00:00", "hash": "6433f04bf68b2154", "title_fa": "وقتی به \"موفقیت\" فکر کردم، شغلی پر رونق و کودکانی با موفقیت را به تصویر کشیدم. سپس دخترم با نیازهای پیچیده پزشکی به دنیا آمد.", "summary_fa": "وقتی دخترش به دنیا آمد، تعریف نویسنده از موفقیت تغییر کرد. با حسن نیت از جیمی دیویس اسمیت وقتی جوانتر بودم، موفقیت را از دریچه نقاط عطف معمولی می دیدم. من شغلی به عنوان وکیل، خانواده و بچه‌هایی را تصور می‌کردم که به مشاغل پر رونق خود ادامه می‌دادند. وقتی دخترم با نیازها و ناتوانی های پیچیده پزشکی به دنیا آمد، دیدگاه من تغییر کرد. وقتی کوچکتر بودم، شغلی به عنوان یک وکیل و خانواده ای با فرزندانی با موفقیت بالا تصور می کردم که روزی خودشان شغل های موفقی خواهند ساخت. من زندگی ام را حول این اهداف ساختم. من به دانشکده حقوق رفتم، ازدواج کردم، و اجازه دادم که شغلم هنگام تشکیل خانواده تعیین شود. برای مدتی به نظر می رسید همه چیز طبق برنامه پیش می رود. من به عنوان یک وکیل حقوق مدنی شغل پررونقی داشتم که دوستش داشتم و درست طبق برنامه باردار شدم. تقریباً به محض اینکه دو خط صورتی را دیدم، با سرسختی وارد برنامه ریزی برای آینده فرزندم شدم. فهرستی ذهنی از فعالیت‌هایی تهیه کردم که او برای کامل کردن نیاز داشت و به طرز خنده‌آمیزی حتی به این فکر کردم که چگونه یک پیش دبستانی مناسب می‌تواند در نهایت او را به یکی از بهترین کالج‌های کشور سوق دهد. من قصد داشتم چند ماه پس از زایمان به کار تمام وقت خود بازگردم و فکر می کردم که طبق برنامه پیش می رود. با این حال، زمانی که دخترم به طور غیرمنتظره ای با نیازها و ناتوانی های پزشکی پیچیده به دنیا آمد، اولویت های من ناگهان تغییر کرد. دختر نویسنده با نیازها و ناتوانی های پزشکی پیچیده به دنیا آمد. با حسن نیت از جیمی دیویس اسمیت ناتوانی‌های دخترم مرا وادار کرد تا درباره نحوه برخوردم با زندگی تجدید نظر کنم. فکر می‌کردم روزهای اول من به عنوان یک مادر"}, {"source": "Business Insider", "title": "Ray Dalio and billionaire F1 boss Toto Wolff traded tips on how to get the best out of staff using 'tough love'", "link": "https://www.businessinsider.com/ray-dalio-discusses-tough-love-with-mercedes-toto-wolff-2026-10", "summary": "Ray Dalio and Mercedes F1 boss Toto Wolff discussed why high-pressure leadership only works when it is matched with genuine care for a team. Jakub Porzycki/NurPhoto via Getty Images/Dia Dipasupil/Getty Images Billionaire Ray Dalio says a balance of high standards and genuine care is a recipe for happy staff. Meaningful work and relationships create stronger teams, Dalio said at a conference in Singapore. Dalio's comments were echoed by fellow panelist Toto Wolff, the boss of the Mercedes F1 team. Investing and F1 may not share obvious similarities at first glance, but when it comes to managing people, some lessons cross disciplines. During a recent conference appearance, Bridgewater Associates founder Ray Dalio and Toto Wolff, the billionaire CEO of Mercedes F1, agreed that demanding leaders need to pair high standards with genuine care for their teams. As Dalio put it, management needs to implement \"tough love.\" \"My mantra is meaningful work and meaningful relationships,\" Dalio said on a panel at the Milken Institute Asia Summit in Singapore last week. \"When I say tough love, there’s the tough, but there’s also that element of love, that element of mutual caring.\" Dalio, who built Bridgewater into the world’s largest hedge fund, said leaders need a clear mission and have to hold people accountable for delivering on it. But he argued that pressure without a sense of shared purpose can undermine a team. \"You want tough love with your kids; you want tough love with everything because tough makes you stronger,\" he said. \"And then also when you have a team, you have to make that team successful.\" Wolff offered a case study in how that balance can be difficult to get right. He recalled putting \"pressure and pressure\" on a senior Mercedes technical leader during a disappointing season, after the team’s run of eight straight constructors’ championships ended. After Wolff publicly said Mercedes’ car did not deserve to win a race, the executive told him he was considering leaving because he could no longer handle the pressure. Wolff said he ultimately changed course. At a dinner intended to resolve the dispute, he offered the executive a contract allowing him to leave on one month’s notice, far shorter than the usual notice period for senior technical staff, and told him to set his own salary and bonus. \"Fundamentally, I had to change,\" Wolff said. \"I couldn’t continue what I thought was my modus operandi over 30 years.\" Dalio said that kind of mutual care matters ", "date_str": "2026-10-12T11:01:14+00:00", "hash": "bdb7c61b362aca61", "title_fa": "ری دالیو و رئیس میلیاردر فرمول یک، توتو وولف، نکاتی را در مورد چگونگی به دست آوردن بهترین نتیجه از کارکنان با استفاده از \"عشق سخت\" به اشتراک گذاشتند.", "summary_fa": "ری دالیو و توتو وولف، رئیس F1 مرسدس در مورد اینکه چرا رهبری پرفشار تنها زمانی کار می کند که با مراقبت واقعی برای یک تیم مطابقت داشته باشد، بحث کردند. Jakub Porzycki/NurPhoto via Getty Images/Dia Dipasupil/Getty Images میلیاردر ری دالیو می گوید تعادل استانداردهای بالا و مراقبت واقعی دستور العملی برای کارکنان شاد است. دالیو در کنفرانسی در سنگاپور گفت که کار و روابط معنادار تیم های قوی تری ایجاد می کند. نظرات دالیو توسط یکی از اعضای پانل، توتو وولف، رئیس تیم F1 مرسدس منعکس شد. سرمایه‌گذاری و F1 ممکن است در نگاه اول شباهت‌های آشکاری با هم نداشته باشند، اما وقتی صحبت از مدیریت افراد می‌شود، برخی از درس‌ها از رشته‌ها عبور می‌کنند. در طی یک کنفرانس اخیر، ری دالیو
