ting out of their warm beds in the morning, either. When you arrive, the squat rack will be free. You ll have your choice of treadmills. The gym will be your oyster. If you start now, you'll have about two months to get up to speed before the rush starts in January. And that is a perfect little time frame to set a small goal and keep it. Vow to hit the gym three times a week, and you ll be able to get in 24 workouts before Christmas, even if you take a few days off for festivities. You can get a lot stronger in 24 workouts. Or run, if that's the fitness journey you're most excited about. If you start a couch-to-5k running plan now, you ll be routinely running 30 minutes at a stretch by the time we get to January. Yes, the holiday season can be busy and stressful, but remember that working out tends to help our brains manage stress . Mark workouts on your calendar, and keep those appointments with yourself. Don t worry about missing out on deals. Any gym or studio that offers a January special probably offers sales year-round anyway. And ultimately, if you get into the habit of actually using the gym, you're getting a lot more value for your money", "date_str": "2026-10-23T15:30:00+00:00", "hash": "5963ebac5bda703d", "title_fa": "چرا تعطیلات در واقع بهترین زمان از سال برای شروع ورزش است؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اگر حتی کوچکترین تصوری دارید که ممکن است بخواهید در سال جدید یا هر زمانی به تناسب اندام برسید تا ژانویه منتظر نمانید. این یک زمین خودسازی \"قوس زمستانی\" نیست. این فقط حقایق است بهترین زمان برای شروع یک عادت ورزشی قبل از فصل تعطیلات است. هک، در ماه دسامبر، شما حتی این مکان را بیشتر برای خودتان خواهید داشت. مطمئنا، از نظر فنی در حال حاضر بهترین زمان برای شروع ورزش است، اما فصل تعطیلات خاص است. اگر تا ژانویه صبر کنید، سالن‌های ورزشی مملو از جمعیت خواهند بود. در دو هفته اول سال، همه فکر می‌کنند که در شروع یک عادت شگفت‌انگیز تناسب اندام هستند... و تا فوریه، اکثر آنها همه چیز را فراموش کرده‌اند. با شروع در هنگام tr": "2026-10-23T15:24:45+00:00", "hash": "e6d7d1aad31c514a", "title_fa": "فدرال‌رزروها می‌خواهند رباتاکسی با چراغ‌های فیروزه‌ای رنگ «من رانندگی می‌کنم» را نشان دهد", "summary_fa": "پس از سال‌ها بحث در مورد اینکه ماشین‌های بدون راننده چگونه باید به دنیا بگویند هیچ‌کس در فرمان نیست - متن چشمک‌زن، هشدارهای صوتی، چراغ‌های سفارشی - فدرال رزرو فقط با یک پاسخ وارد عمل شد: فیروزه‌ای. اداره ملی ایمنی ترافیک بزرگراه تغییرات پیشنهادی را در استاندارد فدرال ایمنی وسایل نقلیه موتوری (FMVSS) شماره 108 منتشر کرد که به طور خاص قوانین را برای جاسازی وسایل نقلیه خودران بازنویسی می کند. این ترکیبی از بریدن نوار قرمز برای طرح‌های عاری از انسان و استاندارد کردن نحوه برقراری ارتباط روباتاکسی با جهان اطرافشان است - که با نور آبی-سبز متمایز شروع می‌شود. NHTSA لامپ‌های نشانگر فیروزه‌ای رنگ را پیشنهاد می‌کند تا به طور واضح و پیوسته به قانون سیگنال دهند... داستان کامل را در The Verge بخوانید. سیاست اخبار حمل و نقل فدرال رزرو از روباتاکسی می خواهد که با چراغ های فیروزه ای رنگ «من در حال رانندگی هستم» علامت دهد. تنظیم کننده های فدرال از خودروهای بدون راننده می خواهند که چراغ سبز آبی متمایز را بتابانند تا وقتی انسان ها رانندگی نمی کنند، علامت دهند. اندرو جی. هاوکینز، 23 اکتبر 2026، ساعت 3:24 عصر UTC پیوند اشتراک هدیه مرسدس بنز AG اندرو جی. هاوکینز ویرایشگر حمل و نقل با بیش از 10 سال تجربه است که خودروهای برقی، حمل و نقل عمومی و هوانوردی را پوشش می دهد. آثار او در نیویورک دیلی نیوز و سیتی استیت ظاهر شده است. پس از سال‌ها بحث در مورد اینکه چگونه خودروهای بدون راننده باید به دنیا بگویند که هیچ‌کس در فرمان نیست - متن چشمک زن، هشدارهای صوتی، چراغ‌های سفارشی - فدرال رزرو تنها با یک پاسخ وارد عمل شد: فیروزه‌ای. و سابقه ای نیز وجود دارد. مرسدس بنز برای چراغ‌های فیروزه‌ای در خودروهای Level 3 Drive Pilot خود تأییدیه‌ای در سطح دولتی دریافت کرد - حتی اگر این خودروساز", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/24390349/22C0157_053.jpg?quality=90&strip=all&crop=0%2C3.4613147178592%2C100%2C93.077370564282&w=1200", "category": "هوش مصنوعی مولد", "ta ین درد را احساس می‌کند؟ خلاصه ای سریع از پرونده: شکایتی که در سال 2021 ارائه شد، ادعا کرد که این شرکت با دروغ گفتن به کاربران متا در مورد نحوه مدیریت داده های آنها، قانون اقدامات غیرمنصفانه ایالت را نقض کرده است. (بعدها، دادستان کل نیومکزیکو نیز ادعاهایی علیه سیاست های تعدیل محتوای متا مطرح کرد.) در ماه سپتامبر، هیئت منصفه به نفع ایالت رای داد. سپس جریمه چند میلیارد دلاری رسید. سی جی ماهونی، مدیر ارشد حقوقی متا در بیانیه ای گفت: «این حکم و رویکرد دادستان کل برای اجرای آن، انجام تجارت در ایالت نیومکزیکو را غیرممکن می کند. این دادخواست در اصل خود به دنبال اعمال مالیات بر سخنرانی است تا قوانین جدیدی را برای آنچه مردم می توانند به صورت آنلاین بیان کنند، اعمال کند. ما مطمئن هستیم که در دادگاه تجدید نظر پیروز خواهیم شد.» مشکلات حقوقی متا در سال جاری به قدری زیاد شده است که پیگیری آنها دشوار است. در اوایل سال جاری در نیومکزیکو، هیئت منصفه حکم داد که شرکت رسانه های اجتماعی باید 375 میلیون دلار برای نقض قانون اعمال ناعادلانه ایالت بپردازد. آن کارآزمایی با ایمنی کودکان مرتبط بود.", "image_url": "https://media.wired.com/photos/6ada8957133035a6bb08c0f2/191:100/w_1280,c_limit/Business_How%20Many%20Billions%20Would%20It%20Take%20to%20Hold%20Meta%20Accountable_v1.jpg", "category": "هوش مصنوعی مولد", "tags": ["Meta"], "datetime_fa": "۱ آبان • ۱۸:۳۰"}, {"source": "Zoomit", "title": "نبرد خاموش TSMC با انحصار چین بر عناصر خاکی کمیاب", "link": "https://www.zoomit.ir/tech/469625-tsmc-seeks-rare-earth-alternatives/", "summary": "تی‌اس‌ام‌سی در حال بررسی جایگزین‌های عناصر خاکی کمیاب در تجهیزات کارخانه‌ای برای کاهش خطرات ناشی از محدودیت‌های صادراتی چین است.", "date_str": "2026-10-23T15:15:00+00:00", "hash": "7628a225e1f803dd", "title_fa": "نبرد خاموش TSMC با انحصار چین بر عناصر خاکی کمیاب", "summary_fa": "تی‌اس‌ام‌سی در حال بررسی جایگزین‌های عناصر خاکی کمیاب در تجهیزات کارخانه‌ای برای کاهش خطرات ناشی از محدودیت‌های صادراتی چین است. تبلیغات بزرگ‌ترین سازنده‌ی قراردادی تراشه در جهان، بررسی گزینه‌های جایگزین برای قطعات حاوی عناصر خاکی کمیاب در تجهیزات کارخانه‌ای را آغاز کرده است. سه منبع آگاه به رویترز اعلام کرده‌اند هدف از اقدام مذکور، کاهش ریسک اختلال در تولید پیشرفته‌ترین ریزتراشه‌های جهان در پی محدودیت‌های صادراتی چین به شمار می‌رود. تسلط چین بر عناصر خاکی کمیاب پس از وضع تحریم‌ها روی برخی مواد، آهن‌رباها و فناوری‌های پردازش، به نقطه‌ی آسیبی برای صنعت تراشه تبدیل شده است. آهن‌رباهای خاکی کمیاب معمولا در موتورهایی به کار می‌روند که قطعات متحرک تجهیزات صنعتی از جمله ماشین‌آلات اتوماسیون کارخانه‌ها را به حرکت درمی‌آورند. کمبود چنین قطعات تخصصی خط تولید تراشه‌های مربوط به گوشی، سرورهای هوش مصنوعی، دیتاسنترها و زنجیره‌های تامین دفاعی را با چالش روبه‌رو می‌کند. مدیران صنعتی آگاه گزارش داده‌اند که TSMC امکان‌سنجی استفاده از موتورهای فاقد عناصر خاکی کمیاب را با تامین‌کنندگان مطرح کرده است. گفت‌وگوها در مراحل آغازین قرار دارد و هنوز به مرحله‌ی پیاده‌سازی گسترده در خطوط تولید نرسیده است. مدیران این مرکز صنعتی حاضر به ارائه‌ی توضیحات بیشتر درباره‌ی برنامه‌های جاری نشدند. ریموند گرین ، مدیر مؤسسه‌ی آمریکایی در تایوان، گفت: «ایالات متحده در همکاری با تایوان و شرکای دیگر در حال توسعه‌ی منابع تامین جایگزین، گسترش ظرفیت پردازش و ساخت زنجیره‌های تامین انعطاف‌پذیرتر است.» کونگ مینگ-سین ، وزیر اقتصاد تایوان، گفت: «دولت از مؤسسه‌ی پژوهش‌های فناوری صنعتی حمایت خواهد کرد تا فناوری‌های مرتبط با عناصر خاکی کمیاب را توسعه دهد و خط تولید آزمایشی ظرف سه سال راه‌اندازی شود؛ خطی که می‌تواند حدود ۵۰ درصد از تقاضای داخلی جزیره را تامین کند.»", "image_url": "https://api2.zoomit.ir/media/6746ed5a073eb22d13b384fc?w=128&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "تراشه", "روابط بین‌الملل"], "datetime_fa": "۱ آبان • ۱۸:۴۵"}, {"source": "Zoomit", "title": "تویوتایی که خاورمیانه از آن محروم است؛ خودرو «کراون سیگنیا ۲۰۲۷» با ظاهر تهاجمی رونمایی شد", "link": "https://www.zoomit.ir/car/469718-2027-toyota-crown-signia-tech-pricing/", "summary": "تویوتا مدل جدید خودرو لوکس کراون سیگنیا را با تجهیزات بیشتر و قیمت بالاتر در تیپ لیمیتد، معرفی کرد.", "date_str": "2026-10-23T15:14:43+00:00", "hash": "bdf2546809e5e948", "title_fa": "تویوتایی که خاورمیانه از آن محروم است؛ خودرو «  is based on the 2011 novel of the same name, written by Colin Meloy and illustrated by Carson Ellis. Both the film and the book follow Prue, a teenager, whose baby brother, Mac, is stolen by a pack of birds and taken into a mystical forest. She, along with her classmate Curtis, ventures into the woods to rescue Mac and perhaps save this magical land. Prue is voiced by Peyton Elizabeth Lee and Curtis is voiced by Jacob Tremblay. Carey Mulligan, Mahershala Ali, Awkwafina, Jake Johnson, Angela Bassett, Charlie Day, and Amandla Stenberg also star. Klara and the Sun Klara and the Sun. Alfred A. Knopf Release date: October 23 in theaters Kazuo Ishiguro's 2021 novel \"Klara and the Sun\" was longlisted for the Booker Prize upon its publication. The book takes place in a not-too-distant dystopian future where rich children can be gifted \"Artificial Friends\" to help them socialize, since now all schooling is done at home, online. Klara, the narrator, is purchased for a sick girl named Josie. I", "date_str": "2026-10-23T14:45:53+00:00", "hash": "1107c9bce8b381a8", "title_fa": "13 کتابی که امسال باید قبل از تبدیل شدن به فیلم و برنامه تلویزیونی بخوانید", "summary_fa": "Timothée Chalamet در فیلم Dune بازی می کند. برادران وارنر برخی از پر هیاهوترین فیلم‌های سال 2026 بر اساس رمان‌های پرفروش ساخته شده‌اند. هنوز چند هفته فرصت دارید تا \"Dune Messiah\" را قبل از \"Dune: Part Three\" بخوانید. چند کتاب تعطیلات نیز در حال اقتباس هستند. هر کتاب دوستی می‌داند که خبر یک اقتباس می‌تواند پیچیده باشد: آیا می‌توانیم به کارگردان‌ها، فیلمنامه‌نویسان و بازیگران اعتماد کنیم تا داستان‌های مورد علاقه‌مان را زنده کنند؟ فهرست فیلم‌های امسال پر از کتاب‌هایی است که برای هزاران خواننده نزدیک و عزیز هستند، از جمله کتاب‌های کلاسیک با دهه‌ها (یا قرن‌ها) قدمت، مانند «غرور و تعصب»، «سرود کریسمس» و «تماسه مسیح». کتاب‌هایی را که باید قبل از اقتباس از نهنگ‌ها باز کنید. تاریخ اکران کتاب‌های ام‌تی‌وی: 16 اکتبر در سینماها، دانیل کراوس «فشار نهنگ» را در سال 2023 منتشر کرد. این یک داستان کاملاً مستقل است، اگر وحشی tos, eating and drinking, dancing, talking to the people they invited, and connecting with each other. When you try to fit too many things into the day, no one — especially the married couple — has time to breathe and relish the moments. The day can feel rushed and more focused on activities than the celebration of love. A packed schedule often leaves couples stressed, with no time to eat because they've been pushed from one 15-minute window to the next. However, your wedding day shouldn't be a blur. You should have time to soak in every moment. When you map out your day, prioritize traditions you love and estimate how long each will take … then add buffers. I also recommend working with a wedding planner or coordinator to plan your timeline, or consulting with your photographer and other vendors when arranging your schedule. They've experienced countless weddings and know firsthand how much time each activity usually takes. Letting small mishaps and issues ruin the whole day Learning how to laugh off the small mishaps is absolutely key. Courtesy of Cameron Dever One of the things I always tell my couples right before their wedding day is that something will go wrong. I don't say this to scare them or make them worry, but mostly to adjust their expectations. No matter how much planning you do, people are imperfect, the weather can be unpredictable, and life happens. By the time the day comes, couples have done all they can to make sure it's how they pictured it. All that matters after that is that they enjoy their wedding. Missing flowers or a cake that's the wrong flavor can throw off your day — but these unexpected mishaps shouldn't be so consuming that they're all you remember from your wedding. I don't ", "date_str": "2026-10-23T14:44:18+00:00", "hash": "3960dfd8a44e6acd", "title_fa": "بیش از یک دهه است که از عروسی عکاسی کرده ام. در اینجا 4 تا از بزرگترین اشتباهاتی که می بینم زوج ها مرتکب می شوند آورده شده است.", "summary_fa": "من در دهه گذشته انواع عروسی ها را is a problem, too. Tariffs, crushed EV incentives, and Polestar's exit also hurt. China's merciless car market is taking a bite out of Volvo. On Friday, the Swedish luxury automaker said revenue in China fell by almost 50% over the past year. The company said, like many legacy premium automakers, it's facing increasing \"hypercompetition\" from Chinese competitors. Volvo plans to cut 2,500 jobs globally in response, it said, including roughly 2,000 in Sweden. That's part of an effort to slash costs by about $530 million. \"We continue to operate in a very tough environment with strong external challenges: de-globalisation, hypercompetition and climate change,\" CEO Håkan Samuelsson said in a statement. It's the latest stark example of the increasing pressure on legacy automakers in China. Several big-name car companies — including Volkswagen, BMW, and Mercedes-Benz — have recently reported slowing sales from their Chinese dealerships. Volvo is majority-owned by Geely Auto Group, a Chinese automaking conglomerate. The company said the reductions will be made by a combination of ending consultant contracts, natural attrition, and targeted employee exit packages. China is not Volvo's only problem. The company also said that US tariffs and the loss of Washington's consumer incentives for electrified cars squeezed margins. Volvo previously bet heavily on a rapid consumer transition to electric vehicles, aiming for an all-electric portfolio by 2030 . It's since walked back that goal to include plug-in hybrid vehicles. The automaker also said that Polestar — its EV offshoot that is exiting the US market — also posted losses. Volvo's answer is to get more local: the automaker said it would introduce two fresh cars tailored specifically for the Chinese market by the middle of next year. Those cars will be developed in close collaboration with Geely and will include a Chinese tech stack and advanced driver-assist technologies \"to make them fully competitive in China.\" Read the original article on Business Insider", "date_str": "2026-10-23T14:40:10+00:00", "hash": "4392be7c42a001df", "title_fa": "ولوو قصد دارد 2500 شغل خود را به دلیل جنگ قیمت گذاری کبود در چین اخراج کند", "summary_fa": "خودروسازان قدیمی برای رقابت در چین با مشکل مواجه هستند. بلومبرگ/گتی ایماژ خودروسازان قدیمی همچنان از کاهش فروش خود در چین خبر می دهند. ولوو جدیدترین است. در حال برنامه ریزی برای 2500 کاهش شغل جهانی برای صرفه جویی در حدود 530 میلیون دلار است. آمریکا هم مشکل دارد. تعرفه‌ها، مشوق‌های کاهش‌یافته خودروهای برقی و خروج Polestar نیز صدمه دیده است. بازار خودروهای بی‌رحم چین در حال لقمه‌ای از ولوو است. روز جمعه، این خودروساز لوکس سوئدی اعلام کرد که درآمد چین در سال گذشته تقریباً 50 درصد کاهش یافته است. این شرکت گفت، مانند بسیاری از خودروسازان ممتاز قدیمی، با افزایش \"فوق العاده رقابت\" از سوی رقبای چینی مواجه است. ولوو اعلام کرد که قصد دارد در پاسخ به این اقدام 2500 شغل در سطح جهان از جمله حدود 2000 شغل در سوئد را تعدیل کند. این بخشی از تلاش برای کاهش حدود 530 میلیون دلاری هزینه ها است. هاکان ساموئلسون، مدیرعامل این شرکت در بیانیه‌ای گفت: «ما در یک محیط بسیار سخت با چالش‌های خارجی قوی به فعالیت خود ادامه می‌دهیم: جهانی‌زدایی، رقابت بیش از حد و تغییرات آب و هوایی.» این آخرین نمونه واضح از افزایش فشار بر خودروسازان قدیمی در چین است. چندین شرکت خودروسازی بزرگ - از جمله فولکس واگن، بی‌ام‌و و مرسدس بنز - اخیراً کاهش فروش را از نمایندگی‌های چینی خود گزارش کرده‌اند. اکثریت ولوو متعلق به گروه خودروسازی جیلی، یک مجموعه خودروسازی چینی است. این شرکت گفت که این کاهش ها با ترکیبی از پایان دادن به قراردادهای مشاور، فرسایش طبیعی و بسته های هدفمند خروج کارکنان انجام خواهد شد. چین تنها مشکل ولوو نیست. این شرکت همچنین گفت که تعرفه های ایالات متحده و از دست دادن مشوق های مصرف کننده واشنگتن برای خودروهای برقی باعث کاهش حاشیه سود شده است. ولوو قبلاً روی انتقال سریع مصرف‌کنندگان به خودروهای الکتریکی شرط‌بندی", "image_url": "https://i.insider.com/6adb62b2dc67b5b4d01f6d01?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۸:۱۰"}, {"source": "Business Insider", "title": "I spent years building a 'stable' life and climbing the ladder at work. Then, I quit my job and moved to Hungary.", "link": "https://www.businessinsider.com/left-well-paying-job-moved-countries-making-less-money-happier-2026-10", "summary": "I always loved Budapest, but never thought I d actually be able to move here. Sarah Catherine Cowie I spent my 20s climbing the career ladder and building the life of my dreams in Scotland. Then, after losing my dad, I decided to make a big change: I moved abroad and went back to school. I've been struggling financially, but I know that I made the right choice. For most of my 20s, I wanted to climb the career ladder — and hoped that as soon as I reached the top, everything would become clear and I would live happily ever after. My life felt like it was headed in the right direction. I was on a steady, exciting career trajectory in the climate policy field. I even bought my first flat in an up-and-coming area of Edinburgh. Then, my dad was diagnosed with terminal cancer in late 2022. The next few years were spent grappling with his illness and, eventually, his death. I quickly felt the whole ecosystem of my life fall apart. I was struggling at work, and I didn't know how to ask for help. I tried my best to carry on as normal and try to convince myself that the work I was doing — and, by extension, myself — was important. As I edged toward my 30th birthday in early 2025, against a backdrop of grief and burnout, the need for change felt urgent and existential. I made a drastic change I decided to go back to school in a new country. Sarah Catherine Cowie It was shortly after this, in the spring, that I decided a move abroad was exactly what I needed. I quit my job and spent the next few months sending applications to schools across Europe, hoping to pursue a master's degree in my field and embark on a fresh start. When an offer came from a university in Budapest, I knew that was where I would be going. I had visited for the first time about a decade prior, and fallen in love. I remember thinking, \"I could see myself living here one day,\" not thinking that that \"one day\" would ever actually come. In September, I packed up my life, started renting out my Edinburgh flat, and made the move. The first few months brought a mix of excitement, fear, and disbelief. There was a lot of bureaucracy to navigate — forms to fill out, applications to be processed — and I couldn't relax until everything was completed. I was also pretty lonely in the beginning. When I first moved, I didn't know a single person in Budapest and had to build a completely new social circle from scratch. I also sometimes felt like an imposter: I was a lot older than the fresh-faced students in their", "date_str": "2026-10-23T14:40:01+00:00", "hash": "58ce9fce011b104c", "title_fa": "من سالها صرف ساختن یک زندگی «پایدار» و بالا رفتن از نردبان کار کردم. سپس کارم را رها کردم و به مجارستان رفتم.", "summary_fa": "من همیشه بوداپست را دوست داشتم، اما هرگز فکر نمی کردم واقعا بتوانم به اینجا نقل مکان کنم. سارا کاترین کاوی من 20 سالگی خود را با بالا رفتن از نردبان شغلی و ساختن زندگی رویاهایم در اسکاتلند گذراندم. سپس، پس از از دست دادن پدرم، تصمیم گرفتم تغییر بزرگی ایجاد کنم: به خارج از کشور نقل مکان کردم و به مدرسه بازگشتم. من از نظر مالی با مشکل مواجه شده ام، اما می دانم که انتخاب درستی کردم. در بیشتر 20 سالگی‌ام، می‌خواستم از نردبان شغلی بالا بروم - و امیدوار بودم که به محض رسیدن به اوج، همه چیز روشن شود و تا ابد با خوشحالی زندگی کنم. زندگی من احساس می کرد که در مسیر درستی قرار دارد. من در یک مسیر شغلی ثابت و هیجان انگیز در زمینه سیاست آب و هوا بودم. من حتی اولین آپارتمانم را در یک منطقه رو به رشد ادینبورگ خریدم. سپس، در اواخر سال 2022 تشخیص داده شد که پدرم به سرطان ترمینال مبتلا شده است. چند سال بعد با بیماری و در نهایت مرگ او دست و پنجه نرم کرد. به سرعت احساس کردم کل اکوسیستم زندگیم از هم پاشید. در محل کارم مشکل داشتم و نمی دانستم چگونه کمک بخواهم. من تمام تلاشم را کردم تا به طور معمول ادامه _url": "https://deadline.com/wp-content/uploads/2026/10/MCDCLAY_WB023.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آبان • ۰۳:۰۱"}, {"source": "Rolling Stone", "title": "The Best Noise-Canceling Headphones of 2026, Tested", "link": "https://www.rollingstone.com/product-recommendations/tech/best-noise-canceling-headphones-1235398146/", "summary": "From tried-and-true models to manufacturers that may not be on your radar, these are the best ANC headphones right now", "date_str": "2026-10-23T23:48:05+00:00", "hash": "69af5727431b96f6", "title_fa": "بهترین هدفون حذف نویز 2026، تست شده", "summary_fa": "از مدل‌های آزمایش شده و واقعی گرفته تا تولیدکنندگانی که ممکن است در رادار شما نباشند، اینها بهترین هدفون‌های ANC در حال حاضر هستند. هدفون‌های حذف‌کننده نویز از سال 1989 پیشرفت زیادی کرده‌اند. در این سال بود که Bose اولین هدست‌های فعال حذف نویز (ANC) را که در ابتدا برای خلبانان خطوط هوایی طراحی شده بودند، عرضه کرد. بسیاری از مردم هنوز هدفون های ANC را به همان دلیلی که اختراع شده اند می خرند - برای کاهش صدای موتور جت در حین پرواز. اما این روزها، آن‌ها می‌توانند حواس پرتی را در همه جا کاهش دهند، از دفتر گرفته تا قطار و حتی در خانه. با توجه به رقابت شدید در بازار هدفون، انتظار می‌رود هدفون‌های حذف نویز بیشتر از حذف نویز پس‌زمینه انجام دهند. واضح است که کیفیت صدای خوب و راحتی بسیار مهم است، به خصوص اگر ساعت ها در هواپیما از آنها استفاده کنید. سایر ویژگی‌هایی که باید در نظر بگیرید عبارتند از کیفیت میکروفون برای تماس، عمر باتری و سازگاری با سفر. بیشتر هدفون‌های ANC دارای حالت محیطی یا آگاه هستند که باعث می‌شود مقداری نویز وارد شود تا شما را با محیط اطرافتان هماهنگ کند. اما برخی مانند Bose و Sennheiser نیز به شما اجازه می دهند تنظیمات محیط را مطابق میل خود سفارشی کنید. بهترین هدفون‌های حذف نویز ما بهترین هدفون‌های حذف نویز موجود در بازار را گردآوری کرده‌ایم، از مدل‌های مقرون‌به‌صرفه، از مارک‌های رادار پایین‌تر گرفته تا قوطی‌های باارزش درجه یک صدا دوست. برای این راهنما، ما روی مدل‌های روی گوش تمرکز کرده‌ایم، اما اگر به‌دنبال هدفون‌های هدفون هستید، f suburbia and into a spectacle-filled journey through a vast witch realm called Hexe, according to a description. Rashida Jones, Jodie Foster, Walton Goggins, Tracey Ullman and Stephen Fry are also in the voice cast. Magic reached No. 12 on the Billboard Hot 100 in 1984, but it s far from The Cars only hit. The Boston rock band also scored top 10 entries with Drive (No. 3), Shake It Up (No. 4), You Might Think (No. 7) and Tonight She Comes (No. 7). Steinfeld has also earned her share of chart hits with five entries on the Hot 100 to date, led by 2016 s Starving with Grey and Zedd, which peaked at No. 12. She s now becoming known for recording music in collaboration with the films she stars in, dropping Dangerous for Sinners in April of last year. “Blending music and acting like this feels like the fullest expression of who I am,” she told Billboard at the time. Listen to Steinfeld s cover of Magic by The Cars below.", "date_str": "2026-10-23T21:59:36+00:00", "hash": "1cf2fe8e1c478271", "title_fa": "Hailee Steinfeld شما را در جلد \"Magic\" The Cars برای فیلم \"Hexed\" نگه خواهد داشت: گوش کنید", "summary_fa": "Hailee Steinfeld کمی جادوی اضافی را برای نقش خود در انیمیشن جدید دیزنی Hexed به ارمغان می‌آورد، و علاوه بر رهبری صداپیشگان، یک جلد جذاب از آهنگ The Cars را نیز به عهده دارد. نسخه خواننده/بازیگر مجیک که جمعه (23 اکتبر) قبل از اکران سینمای فیلم در 25 نوامبر منتشر شد، تمام استعداد ضبط اصلی The Cars در دهه 1980 را حفظ می کند، در حالی که آوازهای درخشان استاینفلد به آن درخشش پاپ جدیدی می بخشد. فقط کمی سحر و جادو مرا می کشاند، او آواز می خواند. من تو را نگه داشته ام مرتبط Hailee Steinfeld از اولین فرزند با جاش آلن استقبال می کند: ما احساس می کنیم فوق العاده سپاسگزار و خوشبخت هستیم Hailee Steinfeld با آهنگ اصلی خطرناک در موسیقی متن فیلم Sinners به ​​موسیقی بازمی گردد. 1 در استرالیا با زن خانه دار کاملاً با داستان عجیبی که در Hexed گفته می شود، همراه است، که به دنبال دختری به نام بیلی دو با صداپیشگی استاینفلد است که با کشف توانایی های جادویی که قبلاً استفاده نشده بود، او را از حومه شهر خارج می کند و به سفری مملو از تماشایی از طریق قلمروی وسیع جادوگر به نام هکس می برد. راشیدا جونز، جودی فاستر، والتون گوگینز، تریسی اولمن و استفن فرای نیز صداپیشگان این فیلم هستند. مجیک به شماره رسید. 12 در Billboard Hot 100 در سال 1984، اما فاصله زیادی با The Cars دارد. گروه راک بوستون همچنین با Drive (شماره 3)، Shake It Up (شماره 4)، You Might Think (شماره 7) و Tonight She Comes (شماره 7) به 10 اثر برتر رسید. استاینفلد همچنین با پنج ورودی در Hot 100 تا به امروز، سهم خود را از تعداد بازدیدهای چارت به دست آورده است که در سال 2016 توسط Starving with Grey و Zedd رهبری شد که در رتبه 12", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P1032W5T-e1792791046235.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آبان • ۰۱:۲۹"}, {"source": "Billboard", "title": "Billboard Latin Music Week 2026 Photo Booth: Anuel AA, Becky G, Maluma & More", "link": "https://www.billboard.com/photos/billboard-latin-music-week-2026-photo-booth-anuel-aa-becky-g-maluma-more-1236365751/", "summary": "Billboard Latin Music Week 2026 brought some of the biggest Latin music stars to Miami for a weeklong conference, including Anuel AA, Becky G, Fuerza Regida, Kany García, Lali, Maluma, Mau Ricky, and many more. The artists – who spoke at panels and/or performed at showcases – also posed for Billboard ’s photo booth. Among the artists sitting for Icon or Superstar Q As were Puerto Rican singer-songwriter Kany García, música mexicana powerhouse Fuerza Regida, Colombian superstar Maluma, Mexican-American singer and actress Becky G, Panamanian legend Rubén Blades and Cuban-American global megastar Pitbull. Meanwhile, Venezuelan trippy-pop band Rawayana shared the story behind their touring success in a panel presented by Live Nation, along with Latin Power Players Executive of the Year Hans Schafer; married couples Jessi Uribe and Paola Jara, and Jay Wheeler and Zhamira, joined together on stage for a conversation about Love Music; and Ana Mena, Aria Vega, Greeicy, LALI, Lola Indigo and RaiNao were the stars of the Women’s Panel: Global Rising. This year’s Billboard En Vivo showcases where in charge of Fuerza Regida (Oct. 20) and Jay Wheeler and Zhamira (Oct. 21). Speakers also included Bebeshito, Carlos Rivera, Clave Especial, Grupo Frontera, Grupo Niche, Quevedo, Ryan Castro and more. Latin Music Week also coincided with the 2026 Billboard Latin Music Awards, which aired Thursday, Oct. 22, on Telemundo and Peacock. During the ceremony, Cristian Castro, Fuerza Regida, Rosalía and Rubén Blades received special awards, while Fuerza Regida was the biggest winner with eight trophies. Below, see some of the best photo booth gems captured backstage throughout Latin Music Week.", "date_str": "2026-10-23T21:34:31+00:00", "hash": "16bda168d46e501b", "title_fa": "بیلبورد لاتین هفته موسیقی 2026 غرفه عکس: Anuel AA، Becky G، Maluma و بیشتر", "summary_fa": "هفته موسیقی لاتین بیلبورد 2026 تعدادی از بزرگترین ستارگان موسیقی لاتین را برای یک کنفرانس هفتگی به میامی آورد، از جمله Anuel AA، Becky G، Fuerza Regida، Kany García، Lali، Maluma، Mau Ricky و بسیاری دیگر. هنرمندان - که در پانل ها صحبت می کردند و/یا در ویترین ها اجرا می کردند - برای غرفه عکس بیلبورد نیز ژست گرفتند. در میان هنرمندانی که برای Icon یا Superstar Q As نشسته‌اند، کانی گارسیا، خواننده و ترانه‌سرا پورتوریکویی، فوئرزا رژیدا، سوپراستار کلمبیایی، مالوما، خواننده و هنرپیشه مکزیکی-آمریکایی، روبن بلیدز جهانی پانامایی، روبن بلیدز جهانی و Cubanga-sA. در همین حال، گروه تریپی پاپ ونزوئلای Rawayana داستان موفقیت خود در تور را در پانلی که توسط Live Nation ارائه شده بود، همراه با لاتین پاور پلیرز اجرایی سال، Hans Schafer به اشتراک گذاشت. زوج‌های متاهل جسی اوریبه و پائولا خارا، و جی ویلر و ژامیرا برای گفتگو در مورد موسیقی عشق روی صحنه به هم پیوستند. و Ana Mena، Aria Vega، Greeicy، LALI، Lola Indigo و RaiNao ستاره های پانل زنان: ظهور جهانی بودند. Billboard En Vivo امسال، مسئولیت Fuerza Regida (20 اکتبر) و Jay Wheeler و Zhamira (21 اکتبر) را نشان می‌دهد. سخنرانان نیز شامل Bebeshito، Carlos Rivera، Clave Especial، Grupo Frontera، Grupo Niche، Quevedo، Ryan Castro و غیره بودند. هفته موسیقی لاتین همچنین مصادف شد با جوایز موسیقی لاتین بیلبورد در سال 2026 که پنجشنبه 22 اکتبر از شبکه Telemundo و Peacock پخش شد. در طول این مراسم، کریستین کاسترو، فوئرزا رجیدا، روزالیا و روبن بلیدز جوایز ویژه دریافت کردند، در حالی که فوئرزا رجیدا با هشت جام بزرگترین برنده بود. در زیر، تعدادی از بهترین جواهرات غرفه عکس گرفته شده در پشت صحنه را در هفته موسیقی لاتین مشاهده کنید. عکس کانی گارسیا در تئاتر Faena در میامی، فلوریدا در 19 اکتبر 2026.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/billboard-latin-music-week-2026-mary-beth-koeth-anuel-aa-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آبان • ۰۱:۰۴"}, {"source": "Billboard", "title": "Noel Gallagher Says ‘F—‘ Vegetarians on ‘Chicken Shop Date’ — With One Very Notable Exception", "link": "https://www.billboard.com/music/music-news/noel-gallagher-chicken-shop-date-vegetarians-paul-mccartney-1236367401/", "summary": "Noel Gallagher , as is his nature, had some blunt words for non-meat-eaters while guesting on the Chicken Shop Date episode posted Friday (Oct. 23). When asked at the start by host Amelia Dimoldenberg whether he liked chicken nuggets, the Oasis legend replied, Who doesn t? Related Noel Gallagher Down to Write Next James Bond Theme: Should Be Done by Brits, Not Yanks Noel Gallagher Reveals the Exact Moment Oasis Knew They Were Going to Tour Again in 2027 Noel Gallagher Reacts to Latest Oasis 2027 Tour Rumors With a Definitely, Maybe After she pointed out that vegetarians, by definition, aren t fans of the delicacy, Gallagher said gravely: F those guys. Worse, he added when Dimoldenberg then brought up vegans. No stamina. That said, the rocker did reconsider his hard-and-fast stance on the matter when Sir Paul McCartney came up. He s one of those rare people that when you meet them and walk away, you feel more good about yourself, Gallagher gushed. Dimoldenberg then noted that the former Beatle also looks and acts much younger than you d expect from a person in their 80s. Well, he s vegetarian, eh? the Manchester native conceded. Must be something in it. Another person that Gallagher was thrilled to meet was Matthew McConaughey, according to the musician. Elsewhere in the Chicken Shop Date appearance, he revealed how he loved interacting with the actor so much, it inspired him to make a very specific purchase and switch up the decor at the entrance of his home. I d met him at a friend s wedding, Gallagher shared. I d never met anyone like him, and I bought a life-sized cardboard cut-out and put it in the front window for a month. Those are just two of the many fun facts the sardonic rock star shared in his chat with Dimoldenberg, which also spanned Oasis massive stadium tour in 2025 and the band s plans to embark on another trek next year. Last year s excursion was the first time Noel and his brother Liam Gallagher reunited as Oasis after feuding since 2009, making the shows which were documented in the September film Oasis: Don t Look Back in Anger extra meaningful. Watch Noel s episode of Chicken Shop Date above.", "date_str": "2026-10-23T21:33:09+00:00", "hash": "8a2ec4d94ecfe895", "title_fa": "نوئل گالاگر می‌گوید «F—» گیاه‌خواران در «تاریخ فروشگاه مرغ» - با یک استثنا بسیار قابل توجه", "summary_fa": "نوئل گالاگر، همانطور که ذاتش است، هنگام مهمانی در قسمت Chicken Shop Date که جمعه (23 اکتبر) ارسال شد، کلمات رکیکی برای افراد غیر گوشت خوار داشت. هنگامی که در ابتدا توسط آملیا دیمولدنبرگ میزبان از او پرسیده شد که آیا ناگت مرغ را دوست دارد، افسانه Oasis پاسخ داد: چه کسی دوست ندارد؟ موضوع مرتبط با نوئل گالاگر پایین برای نوشتن بعدی موضوع جیمز باند: باید توسط بریتانیایی ها انجام شود، نه یانک ها. طبق تعریف، گالاگر طرفدار این غذای لذیذ نیستید، گالاگر با قاطعیت گفت: به آن بچه ها بپردازید. بدتر از آن، زمانی که دیمولدنبرگ وگان ها را پرورش داد، اضافه کرد. بدون استقامت با این حال، زمانی که سر پل  Industry Association of America (RIAA) from the July 2025-June 2026 eligibility period. Songwriting plaques were presented to more than 80 multi-platinum hitmakers from the Nashville community. Recording Industry Association of America (RIAA) CEO Mitch Glazier was also in attendance to honor the hits and songwriters recognized during the ceremony. Laci Kaye Booth launched the evening with a performance of her song Daddy s Mugshot, featured on her new album Love Ain t for the Faint of Heart . The annual NMPA Gold and Platinum Gala honors new RIAA certifications for songs, no matter when they were initially released; thus, the evening feted songs both new and classic. Numerous songs were honored during the evening, including the Morgan Wallen-recorded Chasing You, which was celebrated Diamond, the Carrie Underwood-recorded Before He Cheats (11x Platinum), and a handful of 12x-Platinum songs: Shaboozey s A Bar Song (Tipsy), Combs s Hurricane and Wallen s Last Night, as well as his 13x-Platinum Whiskey Glasses. Also among the songs honored this year was the 3x Platinum Jesus, Take the Wheel, written by Gordie Sampson, Hillary Lindsey, and the late Brett James. Cornman Music president Nate Lowery accepted the accolade on behalf of James, who passed away just over a year ago. The audience responded with tremendous applause and a standing ovation. The platinum anthem honor, which recognizes the highest-certified song of the year, went to Beautiful Crazy, written by Luke Combs, Rob Williford and Wyatt Durrette, and recorded by Combs. The song earned 15x Platinum certification in December 2025. Brett Young honored the writers by putting his own soulful spin on a performance of Beautiful Crazy, while songwriter Williford took the stage to accept the honor. I think about that kid that j", "date_str": "2026-10-23T21:19:40+00:00", "hash": "9134e633f79ba97d", "title_fa": "وینس گیل و چارلی خوش تیپ سرب 2026 NMPA طلایی و گالا پلاتینیوم", "summary_fa": "انجمن ملی ناشران موسیقی از مج  او تکرار کرد: من پادشاه دریک را دوست دارم. فقط به من بگو نه من با یک نه خوب هستم، اما من را در خواندن رها می کنم؟ این مرد 32 ساله به ستایش و ابراز عشق به رپر OVO ادامه داد. من فقط به دریک احترام می گذارم. او گفت، دریک دریک است، نقطه. من همیشه از طرفداران دریک بودم، همیشه گل هایش را به او دادم، شخصاً دریک را دوست دارم، هرگز سوار قطار نفرت نشدم. من شخصا او را دوست دارم، اما آن را درک می کنم. هنگامی که شما در مورد چیزهایی در صنعت پیش می روید، این کار باعث می شود که به هر کس متفاوت نگاه کنید. این اولین باری نبود که او سعی کرد همکاری با دریک را ایجاد کند. او در ژوئن به پادکست Funky Friday کم نیوتن گفت", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/yung-miami-drake-hot-97-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آبان • ۰۰:۱۳"}, {"source": "Billboard", "title": "‘Case Closed’ Vol. 109 Debuts at No. 1 on Billboard Japan Book Hot 100", "link": "https://www.billboard.com/music/chart-beat/case-closed-vol-109-billboard-japan-book-hot-100-1236367405/", "summary": "Gosho Aoyama’s Meitantei Conan ( Detective Conan / Case Closed ) Vol. 109 hits No. 1 on the Billboard Japan Book Hot 100 chart released Oct. 22. Released Oct. 16, the volume debuts at No. 1, dominating brick-and-mortar and e-commerce (EC) while placing No. 14 in e-books. The volume reveals the untold pasts of Chihaya Hagiwara and Jinpei Matsuda, who played key roles in this spring’s animated movie Detective Conan: Fallen Angel of the Highway . Last week’s No. 1, Taiki Kawakami, Fuse and Mitz Vah’s Tensei Shitara Suraimu Datta Ken ( That Time I Got Reincarnated as a Slime ) Comic Edition Vol. 33, slips to No. 2 while topping e-books and hitting No. 2 for brick-and-mortar. Yu Nagira’s Nanji, Hoshi no Gotoku climbs 4-3, leading both subscriptions and social media and placing No. 3 in brick-and-mortar, marking its 49th week on the chart. The film adaptation — starring Ryusei Yokohama and Suzu Hirose and directed by Michihito Fujii — opened Oct. نیکی دارد. این جلد، گذشته‌های ناگفته چیهایا هاگیوارا و جینپی ماتسودا را نشان می‌دهد که نقش‌های کلیدی را در انیمیشن بهار امسال کارآگاه کانن: فرشته سقوط کرده بزرگراه بازی کردند. شماره هفته گذشته 1، Taiki Kawakami، Fuse and Mitz Vah’s Tensei Shitara Suraimu Datta Ken (The Time I Got I Got Reincarnated as a Slime) Comic Edition Vol. 33، در حالی که از کتاب‌های الکترونیکی بالاتر می‌رود، به شماره 2 می‌لغزد و برای آجر و ملات به شماره 2 می‌رسد. Nanji، Hoshi no Gotoku از Yu Nagira با 4-3 صعود، هم در اشتراک‌ها و هم در شبکه‌های اجتماعی پیشتاز بود و در رتبه 3 در جدول قرار گرفت و چهل و نهمین هفته خود را در جدول ثبت کرد. اقتباس فیلم - با بازی ریوسی یوکوهاما و سوزو هیروس و کارگردانی میچیهیتو فوجی - اکتبر اکران شد. 9، و دوره پیگیری مربوط به هفته دوم آن در سینماها است. اولین بار در رتبه 4، کاتارینا و ریوسکه فوجی Shangri-La Frontier Vol. 28 که شماره 4 را در آجر و ملات و شماره 2 را در کتاب های الکترونیکی قرار می دهد. این جلد که در 16 اکتبر منتشر شد، مسابقه نماینده بین ولفگانگ و شوارتزر ولف را به مبارزه سرنوشت‌ساز خود می‌آورد، و سونراکو را در مقابل Psyger-100 قرار می‌دهد - دو بازیکنی که هدف یکسانی برای شکست دادن لیکاگون دارند اما مسیرهای متفاوتی را برای رسیدن به آن در پیش گرفته‌اند. فصل سوم این انیمیشن تلویزیونی قرار است برای دو فصل متوالی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Case-Closed-109.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آبان • ۰۰:۱۰"}, {"source": "Billboard", "title": "KATSEYE’s Daniela Is Showing Fans a New Side of Herself: ‘There’s Still So Much of Me I Want People to Get to Know’", "link": "https://www.billboard.com/culture/product-recommendations/katseye-daniela-lounge-campaign-interview-oct-2026-buy-1236367361/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. If you&#x2019;ve watched KATSEYE perform, you already know Daniela can command a stage. Between the choreography, coordinated outfits and full glam, the singer knows how to put on a show. But when she&#x2019;s not performing in front of thousands of fans, her wardrobe looks a little different. That&#x2019;s the side of Daniela fans are getting to see in her new campaign with Lounge. The KATSEYE member is the first face of CAST. by Lounge , a new talent-led platform from the British fashion brand that launched Thursday (Oct. 22). Built around the brand&#x2019;s &#x201C;Comfort Made Sexy&#x201D; philosophy, the campaign offers a closer look at Daniela away from the spotlight, marking the latest step in Lounge&#x2019;s expansion beyond lingerie into fashion. Shop Daniela for CAST. by Lounge Campaign 2026 &#x201C;I was so excited about this partnership because I love that LOUNGE is all about feeling confident and comfortable in your own skin,&#x201D; Daniela tells Billboard exclusively. &#x201C;As a dancer and performer, I&#x2019;m in so many different looks for work, so I love having pieces that make me feel good and are still comfortable.&#x201D; And what does Daniela actually wear when she&#x2019;s off the clock? &#x201C;My personal style is definitely cool chic with a little Y2K influence,&#x201D; she says. &#x201C;I love mixing timeless, effortless pieces. I&#x2019;m drawn to color and love experimenting with different shades, textures, and silhouettes. I like my outfits to feel a little edgy and playful while still being feminine and put-together.&#x201D; View this post on Instagram The partnership comes during a particularly busy year for KATSEYE. The group&#x2019;s third EP, WILD, debuted at No. 1 on the Billboard 200 in August with 170,000 equivalent album units earned in its first week, according to Luminate. The six-member group is also in the middle of its Wildword Tour , which kicked off in Dublin on Sept. 1 before making its way to North America earlier this month. For Daniela, who grew up dancing, y’s Dandelion generates a fourth leader, joining “Choosin’ Texas,” “Be Her” and the Morgan Wallen duet “I Can’t Love You Anymore,” making it just the second album by a woman, or an act with a woman vocalist, to send four titles to the summit. The only other, Shania Twain’s The Woman in Me , was alone in that elite club for three decades. Langley moves ahead of the three-apiece hauls from Underwood’s Some Hearts , Carnival Ride and Play On , Twain’s Come On Over and sets by Lady A, Sugarland, The Chicks, Jo Dee Messina, Deana Carter, Kelsea Ballerini and Wynonna. Langley cowrote “Loving Life Again” with ERNEST and Devin Dawson after taking two weeks away from touring in 2025 to reconnect with family and regain her footing amid a whirlwind of career success. Its title grew out of her response when ERNEST asked how she was feeling. Dandelion has spent 21 weeks atop Top Country Albums since its April debut, the most among women since the chart adopted a multimetric methodology nearly a decade ago on the Feb. 11, 2017, survey. It ranks sixth overall in that span, with Wallen’s Dangerous: The Double Album boasting an all-time record 97 weeks at No. 1.", "date_str": "2026-10-23T18:52:18+00:00", "hash": "b90b781cd9432988", "title_fa": "شماره 1 \"دوباره\"! الا لنگلی در چارت پخش کانتری تاریخ بیشتری می سازد", "summary_fa": "طبق گزارش Luminate، الا لنگلی ششمین شماره 1 خود را در جدول پخش کانتری بیلبورد به دست آورد، زیرا «دوباره عاشق زندگی» در لیست تاریخ 31 اکتبر قرار گرفت و 32.4 میلیون مخاطب را در 16 تا 22 اکتبر (7 درصد افزایش) نشان داد. مرتبط پیش‌بینی‌های ما برای بقیه سال در Billboard Hot 100 چیست؟ الا لنگلی چوسین تگزاس شماره است. 1 در جدول آهنگ های تابستانی بیلبورد برای سال 2026 — یکی تاریخی برای موسیقی کانتری 10 رکورد بیلبورد در جدول بیلبوردها شکسته شده یا تنظیم شده است در میان زنان، یا با یک خواننده زن همکاری می کند، لنگلی از رتبه یک به شش سریع ترین در تاریخ 36 ساله جدول رسیده است. او 99 هفته از اولین سفرش به قله، با «تو به نظر می‌رسی که دوستم داری» با رایلی گرین در دسامبر 2024 تا آخرین سفرش ثبت نام کرد. سریعترین قبلی بانوی A (125 هفته) بود. سریعترین زن انفرادی، کری آندروود، این کار را بیش از 127 انجام داد. در میان تمام بازیگران، تنها جلی رول (96) و آلن جکسون (94) سریعتر از لنگلی به شش نفر رسیده اند. راهپیمایی کانتری پخش برای «دوباره عشق به زندگی» فصل دیگری را اضافه می کند. با رسیدن به شماره 1، Langley’s Dandelion رهبر چهارمی را ایجاد می کند و به «Choosin’ Texas»، «Be Her» و «I Can’t Love You Anymore» به دوئت مورگان والن می پیوندد، و آن را به دومین آلبوم یک زن یا اجرای یک خواننده زن برای ارسال چهار عنوان به اجلاس تبدیل می کند. تنها دیگری، «زن در من» اثر شانیا تواین، به مدت سه دهه در آن باشگاه نخبه تنها بود. لنگلی جلوتر از بازی های سه نفره از Underwood’s Some Hearts، Carnival Ride و Play On، Twain’s Come On Over و مجموعه های Lady A، Sugarland، The Chicks، Jo Dee Messina، Deana", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/ella-langley-october21-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۲:۲۲"}, {"source": "Billboard", "title": "Stevie Wonder Sues to Evict Rent-Free Tenant from Hollywood House After Nearly 40 Years", "link": "https://www.billboard.com/pro/stevie-wonder-lawsuit-evict-woman-hollywood-house/", "summary": "Stevie Wonder is taking legal action to evict a woman who’s lived rent-free in his Los Angeles house since 1988. The legendary singer (real name Stevland Morris) sued Carmen Efferson on Thursday (Oct. 22) to demand she move out of a three-bedroom house he owns in the ritzy Hollywood Hills neighborhood. The court papers, obtained by Billboard , say Efferson has lived for free in the home for 38 years under an oral agreement. Related As Stevie Wonder s Songs In the Key of Life Turns 50, Musicians Reflect on Its Impact: An Actual Gift to Humanity Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit Not much is known about Efferson, though it appears she was linked to Wonder around the time she moved into the house: Archival Billboard coverage credited her as a producer of the music video for his Michael Jackson collaboration “Get It” in 1988, and a tabloid report from the same year claimed they were engaged. The two never married. According to Thursday’s lawsuit, Wonder’s representatives tried to enter the Hollywood house three times in July to inspect it for a property insurance renewal. But Efferson refused to let them in and told Wonder’s attorney to “f k the f k off” in an email.” “Please refrain from your racist coldblooded ‘white male privilege’ tone,” wrote Efferson in the July email to lawyer David Huff . “I am feeling harassed. Regarding your ORDERS of entering into the place where I am living, I do not consent. Do not make any attempt to make any kind of contact with me.” In response, Wonder’s lawyers served Efferson with multiple legal notices warning that they would seek her eviction if she did not let in the insurance inspectors. “The choice is yours,” wrote Huff. She did not comply, leading the attorney to file Thursday’s eviction lawsuit. In technical terms, Wonder is suing Efferson for unlawful detainer. The singer wants a judge to order her removed from the Hollywood house, and he says Efferson should pay damages of $600 because her behavior led the home’s property insurance to lapse. Efferson did not immediately return a request for comment on Friday (Oct. 23).", "date_str": "2026-10-23T18:49:39+00:00", "hash": "a81bb2f60b469541", "title_fa": "شکایت استیوی واندر برای اخراج مستاجر بدون اجاره از خانه هالیوود پس از نزدیک به 40 سال", "summary_fa": "استیوی واندر برای اخراج زنی که از سال 1988 بدون اجاره در خانه اش در لس آنجلس زندگی می کند، اقدام قانونی می کند. خواننده افسانه ای (با نام واقعی استولند موریس) روز پنجشنبه (22 اکتبر) از کارمن افرسون شکایت کرد تا از او بخواهد از خانه سه خوابه ای که او در محله شیک هالیوود هیلز دارد، نقل مکان کند. اسناد دادگاه که توسط بیلبورد به دست آمده است، می گوید که افرسون به مدت 38 سال تحت یک توافق شفاهی به صورت رایگان در خانه زندگی کرده است. مرتبط با 50 سالگی آهنگ‌های استیوی واندر در کلید زندگی، نوازندگان درباره تأثیر آن فکر می‌کنند: هدیه واقعی به بشریت دیدی از زندان نیوجرسی به مرکز مشابهی در پنسیلوانیا ویزر برای دریافت جایزه Legend of Live در سال 2026 نقل مکان کرد، هر چند به نظر می‌رسید که بیلبورد Live S چندان شناخته شده نیست. در مورد زمانی که او به خانه نقل مکان کرد شگفت زده شد: پوشش آرشیو بیلبورد او را به عنوان تهیه کننده موزیک ویدیوی همکاری مایکل جکسون \"Get It\" در سال 1988 معرفی کرد، و یک گزارش روزنامه از همان سال ادعا کرد که آنها نامزد کرده اند. این دو هرگز ازدواج نکردند. طبق دادخواست روز پنجشنبه، نمایندگان Wonder در ماه جولای سه بار سعی کردند وارد خانه هالیوود شوند تا آن را برای تمدید بیمه اموال بررسی کنند. اما اففرسون از اجازه ورود آنها امتناع کرد و به وکیل واندر گفت که در یک ایمیل \"f k the f k off\" را انجام دهد. افرسون در ایمیل ژوئیه به وکیل دیوید هاف نوشت: «لطفا از لحن نژادپرستانه «امتیاز مردان سفید» خودداری کنید. \"من احساس آزار و اذیت می کنم. با توجه به دستورات شما مبنی بر ورود به محلی که من در آن زندگی می کنم، رضایت ندارم. هیچ تلاشی برای برقراری ارتباط با", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P105OVQR-e1792780436888.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "موسیقی"], "datetime_fa": "۱ آبان • ۲۲:۱۹"}, {"source": "Billboard", "title": "Slayyyter Reveals She Has Laryngitis & Vocal Cord Tears, Cancels U.K. & Europe Tour: ‘I Will Make This Up to You’", "link": "https://www.billboard.com/music/pop/slayyyter-cancels-2026-tour-dates-laryngitis-vocal-cord-tears-1236367295/", "summary": "After canceling a pair of shows due to health issues earlier in the week, Slayyyter has pulled the plug on the rest of her U.K. and European tour dates. Related More WOR$T Is on the Way: Slayyyter s WOR$T MAN IN AMERICA Album Is Coming Slayyyter Slaughters Final North American Show of Scintillating Wor$t Girl in the World Tour in NYC: 5 Best Moments Slayyyter Reacts to Lady Gaga Using Her Song in a New TikTok She s Feeling the Love The Missouri native announced the cancellations on Friday (Oct. 23), citing laryngitis and vocal cord tears. Hey guys. i am heartbroken to share after multiple doctor visits i have laryngitis and vocal cord tears and have been ordered to go on medication and full vocal rest for at least two weeks, she wrote on her Instagram Story. Because of this, i am forced to cancel the remaining UK/EU dates to avoid permanent damage to my voice. full refunds will be available at point of sale. Slayyyter continued: My team and i are already working on rebooking shows for next year and i hope to have news to share very soon to make it up to you. I know how much time and effort is spent to come out to a show. some of you have traveled, some of you have made costumes, and i am completely devastated to not be able to give you the shows you were planning for. The pop star is promising to make it up to the European fans with shows at a later date. We are working hard to figure out a time to return so i can deliver an even bigger and better show for you all, she added. I hope you know i will make this up to you. lots of love to you all. thank you for making this tour so special. As reported by People , Slayyyter previously revealed that she completely lost her voice and doctors ordered her to cancel shows in Copenhagen (Oct. 22) and Hamburg, Germany (Oct. 23). The tour was slated to resume on Saturday (Oct. 24) in Warsaw, Poland, and run through Nov. 5. Slayyyter s last performance came on Oct. 18 in Paris. The Beat Up Chanel$ singer has no remaining performances after wiping the rest of her 2026 slate clean, and will return to the stage in February with a handful of Australia and New Zealand shows before heading to South America in March. Slayyyter will also headline her first arena show in the Big Apple on June 21 at Madison Square Garden. While she won t be performing, Slayyyter has new music on the way. The pop provocateur s Wor$t Man in America is slated to arrive on Dec. 4, and serves as a nine-track brother album to Wor$t Girl in America , wh", "date_str": "2026-10-23T18:39:21+00:00", "hash": "de4775abdf66450b", "title_fa": "اسلایتر فاش می‌کند که مبتلا به التهاب حنجره و پارگی‌های تار صوتی است، تور بریتانیا و اروپا را لغو می‌کند: «این را به شما خواهم داد»", "summary_fa": "پس از لغو یک جفت برنامه به دلیل مشکلات سلامتی در اوایل هفته، اسلایتر از بقیه تاریخ های تور بریتانیا و اروپا خودداری کرد. موارد مرتبط WOR$T در راه است: آلبوم WOR$T Slayyyter s WOR$T MAN IN AMERICA در راه است Slayyyter Slaughters آخرین نمایش در آمریکای شمالی از Scintillating Wor$t Girl in the World Tour در نیویورک: 5 بهترین لحظه واکنش اسلایتر به لیدی گاگا با استفاده از آهنگ جدید میسوری با استفاده از آهنگ TikeTok Love. در روز جمعه (اکتبر 23)، با اشاره به التهاب حنجره و پارگی تارهای صوتی. هی بچه ها او در استوری اینستاگرام خود نوشت: من قلبم شکسته است که بعد از چندین بار مراجعه به پزشک، من دچار التهاب حنجره و پارگی تارهای صوتی هستم و به من دستور داده شده که حداقل دو هفته دارو و استراحت کامل صوتی داشته باشم. به همین دلیل، من مجبور هستم تاریخ های باقیمانده بریتانیا / اتحادیه اروپا را لغو کنم تا از آسیب دائمی به صدای خود جلوگیری کنم. بازپرداخت کامل در محل فروش در دسترس خواهد بود. اسلایتر ادامه داد: من و تیمم در حال حاضر روی رزرو مجدد نمایش ها برای سال آینده کار می کنیم و امیدوارم به زودی اخباری برای به اشتراک گذاشتن داشته باشم تا آن را جبران کنم. من می دانم که چقدر زمان و تلاش صرف می شود تا در یک نمایش ظاهر شوم. برخی از شما سفر کرده‌اید، برخی از شما لباس‌هایی ساخته‌اید، و من از اینکه نمی‌توانم نمایش‌هایی را که برایشان برنامه‌ریزی می‌کردید به شما ارائه دهم کاملاً متاثر شدم. این ستاره پاپ قول داده است که بعداً با نمایش هایی به طرفداران اروپایی آن را جبران کند. او افزود: ما سخت کار می کنیم تا زمانی را برای بازگشت تعیین کنیم تا بتوانم نمایش بزرگتر و بهتری را برای همه شما ارائه دهم. امیدوارم بدونی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2287486326-e1792775479164.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "موسیقی"], "datetime_fa": "۱ آبان • ۲۲:۰۹"}, {"source": "Billboard", "title": "Billy Corgan Explains Why Olivia Rodrigo Is Your Favorite Rock Star’s Favorite Pop Star: ‘She’s Not Afraid’", "link": "https://www.billboard.com/music/music-news/billy-corgan-fan-olivia-rodrigo-what-he-likes-her-music-1236367252/", "summary": "Olivia Rodrigo is a favorite of many rock stars, and in a new interview, Billy Corgan broke down why he — much like Sheryl Crow, Robert Smith, Jack White, Mick Jagger, Alanis Morissette, Stevie Nicks and more icons — is in her corner. Related Olivia Rodrigo Chappell Roan Exceed Expectations on New Remix: Watch the David Byrne-Starring Video Billy Corgan on Why He s Stood By Marilyn Manson: I Don t Want the World to Tell Me Who My Friends Are Olivia Rodrigo Says Shame on Cornell Amid Fraternity Rape Lawsuit: I Stand With Jane Doe The topic of the Gen Z star first came up on the Thursday (Oct. 22) episode of The New York Times Popcast when hosts Jon Caramanica and Joe Coscarelli asked Corgan why he s recently been championing younger artists such as YUNGBLUD and sombr. Rodrigo is an especially interesting case, they argued, because her songs — namely The Cure and Pretty Isn t Pretty, which share a resemblance to Disarm and 1979, respectively — have drawn comparisons to The Smashing Pumpkins catalog. But the Chicago band s frontman implied that he finds the similarities flattering rather than objectionable. She s so smart, Corgan raved of Rodrigo, whom he joined on stage for a duet of 33 at Lollapalooza this summer. She s super savvy. I don t know her much, but she s figured out that the way to break free is to be free, he continued. She s like, Bring me all these influences. She s not afraid. She s not afraid to make an imperfect song. She s not afraid to have one vocal slightly out of tune Pop stars should be as authentic in their game as rock stars are authentic in their game. Corgan also agreed that it s been freeing connecting with younger artists, because they weren t around when The Smashing Pumpkins received poor reviews on albums that are now heralded as classics, meaning their opinions of him are shaped purely by music. He s hardly the first rock star to sing Rodrigo s praises. Crow has lauded her multiple times, calling her the real deal on The Tonight Show in 2023, and Jagger told Billboard in the Rolling Stones cover story earlier this year, She’s really good at [rock music] the ability to change styles from what you think [her] original girly pop stuff is — it’s kind of interesting. Morrissette and Nicks joined Rodrigo at her inaugural Daisy Chain Fields festival, and White has kept in contact with the former Disney star since they met — and he called her very cool, very real — in 2022. Smith partnered up with Rodrigo for a rare collaboration on", "date_str": "2026-10-23T18:22:34+00:00", "hash": "e12e25d0b65d2433", "title_fa": "بیلی کورگان توضیح می‌دهد که چرا اولیویا رودریگو، ستاره موسیقی مورد علاقه‌تان راک استار پاپ است: «او نمی‌ترسه»", "summary_fa": "اولیویا رودریگو مورد علاقه بسیاری از ستارگان راک است، و بیلی کورگان در یک مصاحبه جدید توضیح داد که چرا او - بسیار شبیه شریل کرو، رابرت اسمیت، جک وایت، میک جگر، آلانیس موریست، استیوی نیکس و نمادهای دیگر - در گوشه اوست. مرتبط Olivia Rodrigo Chappell Roan در ریمیکس جدید از انتظارات فراتر رفت: ویدیوی با بازی دیوید برن را تماشا کنید بیلی کورگان در مورد چرا او در کنار مرلین منسون ایستاده است: من نمی خواهم دنیا به من بگوید دوستانم چه کسانی هستند اولیویا رودریگو می گوید شرم به کرنل است. پنجشنبه (اکتبر 22) قسمت پاپکست نیویورک تایمز که مجریان برنامه جان کارامانیکا و جو کوسکارلی از کورگان پرسیدند که چرا اخیراً از هنرمندان جوان‌تری مانند YUNGBLUD و sombr حمایت می‌کند. آنها استدلال کردند رودریگو مورد بسیار جالبی است، زیرا آهنگ های او - یعنی The Cure و Pretty Isn t Pretty که به ترتیب شباهت هایی با Disarm و 1979 دارند - با کاتالوگ The Smashing Pumpkins مقایسه شده است. اما رهبر گروه شیکاگو به طور ضمنی گفت که شباهت ها را به جای اینکه قابل اعتراض است، تملق آمیز می داند. او بسیار باهوش است، کورگان از رودریگو، که در تابستان امسال برای یک دوئت 33 نفره در لولاپالوزا به روی صحنه رفت، به شدت تشویق شد. او فوق العاده باهوش است او ادامه داد: من او را زیاد نمی شناسم، اما او فهمیده است که راه رهایی آزاد بودن است. او می گوید، همه این تأثیرات را برای من بیاور. او نمی ترسد. او از ساختن یک آهنگ ناقص نمی ترسد. او از داشتن یک آواز کمی ناهنجار ترسی ندارد. کورگان همچنین موافقت کرد که ارتباط با هنرمندان جوان‌تر را آزاد می‌کند، زیرا زمانی که The Smashing Pumpkins نقدهای ضعیفی در مورد آلبوم‌هایی دریافت کرد که اکنون به عنوان کلاسیک معرفی می‌شوند، آن‌ها نبودند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/P107F1H0.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۱:۵۲"}, {"source": "Billboard", "title": "AARP Celebrated the Power of Music, Reinvention and Legacy at Billboard Latin Music Week 2026", "link": "https://www.billboard.com/music/latin/aarp-celebrated-power-of-music-legacy-billboard-latin-week-1236367323/", "summary": "AARP took center stage at Billboard Latin Music Week 2026 as an official partner of one of Latin music’s most influential industry gatherings, celebrating the artists, executives and cultural voices shaping the genre across generations. Latin music is a powerful example of how artists continue to evolve, inspire new audiences and build lasting connections across generations. Richard Bull, George Prajin, Mac Clark and Rudy López Negrete and team at 2026 Billboard Latin Power Players held at Faena Theater on October 19, 2026 in Miami Beach, Florida. Jose Chepe Devillegas Through its partnership with Billboard Latin Music Week, AARP celebrated the pioneers who helped shape Latin music alongside the emerging voices carrying those traditions into the future. One of the highlights of AARP’s programming was “Salsa Revival: Bridging Generations presented by AARP,” a panel featuring legendary salsa artist Tito Nieves and contemporary salsa star Luis Figueroa. The conversation brought together two artists whose careers represent different eras of salsa, united by a shared commitment to keeping the genre alive and moving forward. AARP also presented Tito Nieves with the Latin Music Legacy Award at Billboard Latin Power Players, recognizing his lasting impact on the genre and his contributions to Latin music. Luis Figueroa and Tito Nieves speak onstage at the Salsa Revival: Bridging Generations panel during Billboard Latin Music Week 2026 held at Faena Forum on October 19, 2026 in Miami Beach, Florida. Jose Chepe Devillegas “It s a fantastic year for music, more than ever,” Billboard’s co-chief content officer Leila Cobo said during the ceremony. Citing Luminate data, she noted that one in every 10 streams is now in Spanish… double the share recorded six years ago. “We are so proud to honor [the Latin Power Players] tonight.” AARP’s presence at Billboard Latin Music Week 2026 reflected a vision of aging centered on possibility, participation and continued growth. As a nonprofit dedicated to empowering people to choose how they live as they age, AARP highlighted the importance of lifelong creativity, cultural engagement and connections between generations. Latin music brought that message to life. From honoring industry pioneers with the Latin Music Legacy Award to bringing Tito Nieves and Luis Figueroa together to discuss the evolution of salsa, AARP was part of the conversations where culture, community and generations connect. Tito Nieves at 2026 Billboard Latin Pow", "date_str": "2026-10-23T18:16:09+00:00", "hash": "f6e438e36054ccf2", "title_fa": "AARP قدرت موسیقی، اختراع مجدد و میراث را در هفته موسیقی لاتین بیلبورد 2026 جشن گرفت", "summary_fa": "AARP در هفته موسیقی لاتین بیلبورد 2026 به عنوان شریک رسمی یکی از تأثیرگذارترین گردهمایی‌های صنعت موسیقی لاتین در مرکز صحنه قرار گرفت و از هنرمندان، مدیران و صداهای فرهنگی که این ژانر را در طول نسل‌ها شکل می‌دهند تجلیل کرد. موسیقی لاتین نمونه قدرتمندی از چگونگی ادامه تکامل هنرمندان، الهام بخشیدن به مخاطبان جدید و ایجاد ارتباطات پایدار در بین نسل‌ها است. ریچارد بول، جورج پراجین، مک کلارک و رودی لوپز نگرته و تیم در 2026 Billboard Latin Power Players که در تئاتر Faena در 19 اکتبر 2026 در میامی بیچ، فلوریدا برگزار شد. Jose Chepe Devillegas از طریق مشارکت خود با هفته موسیقی لاتین بیلبورد، AARP از پیشگامانی که به شکل گیری موسیقی لاتین در کنار صداهای نوظهور که این سنت ها را به آینده منتقل می کردند، تجلیل کرد. یکی از نکات برجسته برنامه‌نویسی AARP، «Revival Salsa: Bridging Generations ارائه‌شده توسط AARP» بود، پانلی با حضور هنرمند افسانه‌ای سالسا، تیتو نیوز و ستاره معاصر سالسا، لوئیس فیگوئروآ. این گفتگو دو هنرمند را گرد هم آورد که حرفه‌شان دوره‌های مختلف سالسا را ​​نشان می‌دهد، که با تعهد مشترک برای زنده نگه داشتن این ژانر و حرکت رو به جلو متحد شده‌اند. AARP همچنین جایزه میراث موسیقی لاتین را در Billboard Latin Power Players به ​​تیتو نیوز اهدا کرد و تأثیر ماندگار او را بر این ژانر و مشارکت او در موسیقی لاتین به رسمیت شناخت. لوئیس فیگوروآ و تیتو نیوز روی صحنه در پنل سالسا Revival: Bridging Generations در هفته موسیقی لاتین بیلبورد 2026 که در انجمن Faena در 19 اکتبر 2026 در ساحل میامی، فلوریدا برگزار شد، صحبت می‌کنند. Jose Chepe Devillegas، لیلا کوبو، مدیر ارشد محتوای بیلبورد در این مراسم گفت: «این یک سال فوق‌العاده برای موسیقی است، بیش از هر زمان دیگری». او با استناد به داده‌های Luminate اشاره کرد که از هر 10 استریم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/OSE6566-1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۱:۴۶"}, {"source": "Billboard", "title": "From LISA to Miley Cyrus, John Mayer & More, Which New Music Release Is Your Favorite This Week? Vote!", "link": "https://www.billboard.com/music/music-news/blackpink-lisa-miley-cyrus-john-mayer-best-new-music-poll-1236367274/", "summary": "This New Music Friday is a battle royale between artists across genres for the final spots on your Halloween party playlists. Related LISA, Miley, Kacey Musgraves John Mayer: New Music Friday Guide LISA’s Press Play : All 6 Tracks Ranked How New Music From Miley, Megan Moroney, Bella Kay More Landed on the ‘Nobody Wants This’ Season Three Soundtrack: It Was a Win-Win for All LISA of BLACKPINK leads this week s roundup with her sizzling Press Play EP, which features her Billboard Hot 100 hit SaWaDiKa (No. 69) and the newly released Tarantino. Landing right on time for the Thai singer s upcoming Las Vegas residency taking place Nov. 12-29, the bilingual, six-track set also features an interpolation of Missy Elliott and Timbaland’s 2003 song “Bomb Intro/Pass That Dutch on standout track Cobra. Two major albums lead this week s new R B and hip-hop releases: John Legend s Muse and Yung Miami s Watch Dis , respectively. The former marks the EGOT winner s first album-length collaboration with Pharrell Williams, who was inspired to lock in with Legend for an LP after linking with him for The Birds Don t Sing off Clipse s Grammy-winning Let God Sort Em Out in 2025. The latter is the long-awaited debut solo studio album from Yung Miami, who scored the biggest hit of her career this year with Spend Dat, nearly a decade after she first burst onto the scene as one-half of City Girls. Kacey Musgraves also previewed her forthcoming Middle of Nowhere Vol. 2: Tex Mex Tapes , a 16-track expansion of this year s acclaimed Middle of Nowhere , with the breezy, brassy Weekend In Texas. British DJ Sammy Virji surprise-dropped his sophomore studio album, Open Late , which he conceived almost entirely on the road between shows. This New Music Friday also features new albums from Claud ( Me and the Music ), Anderson .Paak and Cordae ( Heavy Is the Crown ), Halle ( Love? Or Something Like It Deluxe ), Brakence ( Marrow ), Toosii ( Platinum Heart 2 ), Yeat ( Luh Leakyz Vol. 1 ), Samara Joy ( Live at the Blue Note L.A. ), Che Noir ( It Takes A Village ), Laila! ( We’ll Never Be This Young Again ), My Chemical Romance ( The Black Parade 20th Anniversary Deluxe Edition ), girl in red ( Blue EP), Josiah Queen ( Damascus Road ), Lennon Stella ( Sleeping Lion ), Michael Kiwanuka ( Fudge ), Laundry Day ( 4 4 ), Hilary Duff ( Holiday Things EP), Brothers Osborne ( Watertown ) and MC Eiht ( The Story of My Life ). Over on the singles side, Miley Cyrus leads the way with Cold Blood, a mid-2010", "date_str": "2026-10-23T18:14:30+00:00", "hash": "5e6c17df7102b3b9", "title_fa": "از LISA تا مایلی سایرس، جان مایر و بیشتر، کدام نسخه جدید موسیقی مورد علاقه شما در این هفته است؟ رای بده", "summary_fa": "این جمعه موسیقی جدید یک نبرد رویال بین هنرمندان در ژانرهای مختلف برای آخرین نقاط در لیست پخش مهمانی هالووین شما است. مرتبط LISA، مایلی، کیسی ماسگریوز John Mayer: New Music Guide پخش مطبوعاتی LISA: همه 6 آهنگ رتبه بندی شده است که چگونه موسیقی جدید از مایلی، مگان مورونی، بلا کی بیشتر وارد موسیقی متن فصل سوم «Nobody Wants This» شد: این یک برد-برد برای همه پخش های LINKPI از هر هفته بود. که شامل بیلبورد Hot 100 SaWaDiKa (شماره 69) و تارانتینو تازه منتشر شده است. این مجموعه دو زبانه و شش آهنگی که درست به موقع برای اقامت آتی خواننده تایلندی در لاس وگاس که از 12 تا 29 نوامبر برگزار می‌شود، شامل ترانه 2003 میسی الیوت و تیمبالند با نام «Bomb Intro/Pass That Dutch در آهنگ برجسته Cobra» است. دو آلبوم اصلی منتشر شده است: آلبوم‌های جدید و هیپ‌های جدید John Yu. Miami s Watch Dis، به ترتیب. اولین همکاری در طول آلبوم برنده EGOT با فارل ویلیامز است، که پس از ارتباط با او برای آلبوم The Birds Don t Sing off Clipse در سال 2025، اجازه دهید خدا آنها را مرتب کند، الهام گرفته شد تا با Legend برای آلبوم LP همکاری کند. یک سال با Spend Dat، تقریباً یک دهه پس از آن که او برای اولین بار به عنوان نیمی از City Girls وارد صحنه شد. کیسی ماسگریوز همچنین پیش نمایشی از فیلم آینده خود یعنی Middle of Nowhere Vol. 2: Tex Mex Tapes، یک بسط 16 آهنگی از تحسین شده امسال Middle of Nowhere، با آخر هفته بادی و برنجی در تگزاس. دی جی بریتانیایی سامی ویرجی آلبوم دوم استودیویی خود را با نام \"Open Late\" که تقریباً به طور کامل در مسیر بین برنامه ها طراحی شده بود، منتشر کرد. این جمعه موزیک جدید همچنین دارای آلبوم‌های جدیدی از کلود", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/lisa-press-play-cover-cr-Yeyoung-choi-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۲۱:۴۴"}, {"source": "Billboard", "title": "Will We Get Our First Seasonal Halloween No. 1 of the Century This Year? ‘Thriller,’ ‘Dracula’ & The Spookiest Hot 100 Race Ever", "link": "https://www.billboard.com/music/chart-beat/halloween-number-one-thriller-dracula-michael-jackson-1236367320/", "summary": "November is only a little over a week away, which means Mariah Carey is probably getting antsy for her annual emergence from her warm-weather cocoon to declare the start of the pop music holiday season. But this year, she may have to wait a little longer than normal to make it official: We’ve got another seasonal chart race to get through first in 2026. Halloween has proven regularly impactful on the Billboard Hot 100 for nearly a decade now, ever since Michael Jackson’s horror-pop perennial “Thriller” first reentered the chart dated Nov. 10, 2018, at No. 31. It has since been joined by such other spooky season classics as Bobby “Boris” Pickett and the Crypt-Kickers’ “Monster Mash” and Ray Parker, Jr.’s “Ghostbusters” as annual haunters of the listing, with The Citizens of Halloween’s “This Is Halloween” and Rockwell’s “Somebody Watching Me” also crashing the chart the past two years. However, none of those songs have ever seriously threatened the chart’s top spot upon their yearly revisits. Two of them topped the chart upon their original runs — ”Monster Mash” in 1962 and “Ghostbusters” in 1984, the former even doing so for two weeks at the end of October — and in 2025, “Thriller” became the first of the seasonal staples to return to the top 10, reaching No. 10 last November (after originally peaking at No. 4 in ‘84). This year, that might change. Not only could “Thriller” be in the mix for the post-Halloween No. 1, but so might a much newer song — one already not that far from the Hot 100’s top spot. “Thriller” has, of course, been getting progressively closer to No. 1 since 2018 — although some variability in the timing of the chart week and the release schedule has kept it from being a straight line of progress. After reaching No. 31 in 2018, it spent the next two years returning to the 40s, before jumping to No. 19 in 2021, then returning to the 20s in 2022-24, before hitting the top 10 last year. But this year, there’s reason to expect that more than just general upwards momentum will propel “Thriller” closer to the top spot. As covered extensively by writer Mikhail Grant on his Polytmus Substack earlier in the year — in an entry boldly titled “I Predict The Song ‘Thriller’ Will Go To #1 Soon on the Hot 100” — there are larger 2026 trends both within the Hot 100 and within Jackson’s own catalog to lend additional credence to the notion that the song will have a chance to truly contend for No. 1 this year. First, in 2018, when “Thriller” began re-char", "date_str": "2026-10-23T18:05:16+00:00", "hash": "677388ad62378b26", "title_fa": "آیا امسال اولین هالووین فصلی خود را شماره 1 قرن خواهیم داشت؟ «هیجان‌انگیز»، «دراکولا» و وحشتناک‌ترین مسابقه ۱۰۰ داغ تا کنون", "summary_fa": "فقط یک هفته تا نوامبر باقی مانده است، یعنی ماریا کری احتمالاً برای خروج سالانه خود از پیله هوای گرم خود برای اعلام شروع فصل تعطیلات موسیقی پاپ عصبانی می شود. اما امسال، او ممکن است کمی بیشتر از حد معمول صبر کند تا آن را رسمی کند: ما یک مسابقه فصلی دیگر برای اولین بار در سال 2026 داریم. تقریباً یک دهه است که هالووین به طور منظم بر روی بیلبورد Hot 100 تأثیرگذار بوده است، از زمانی که فیلم همیشگی ترسناک پاپ «Thriller» مایکل جکسون برای اولین بار در جدول تاریخ 10 نوامبر 2018 در رتبه 31 قرار گرفت. از آن زمان با دیگر کلاسیک های فصل شبح آور مانند بابی «بوریس» پیکت و «هیولا مش» از Crypt-Kickers و «شکارچیان ارواح» ری پارکر جونیور به عنوان شکارچیان سالیانه این فهرست همراه شده است، با ترانه های The Citizens of Halloween از «This Is Rock Watching the Halloween» و «This Is Rock Watching the Halloween» و همچنین «Thes Iswell Me WatchScra» از The Citizens of Halloween دو سال با این حال، هیچ یک از آن آهنگ‌ها به‌طور جدی رتبه اول جدول را پس از بازدیدهای سالانه خود تهدید نکرده‌اند. دو نفر از آنها در اکران اولیه خود در صدر جدول قرار گرفتند - «Monster Mash» در سال 1962 و «Ghostbusters» در سال 1984، اولی حتی به مدت دو هفته در پایان اکتبر این کار را انجام داد - و در سال 2025، «Thriller» اولین فیلم اصلی فصلی شد که به 10 فیلم برتر بازگشت و به رتبه 8 اصلی رسید (در نوامبر گذشته در رتبه 10 قرار گرفت). امسال، ممکن است تغییر کند. نه تنها \"Thriller\" می تواند در ترکیب شماره پس از هالووین باشد. 1، اما ممکن است یک آهنگ بسیار جدیدتر باشد - آهنگی که در حال حاضر با رتبه برتر Hot 100 فاصله زیادی ندارد. «Thriller»", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/michael-jackson-thriller-1983-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۲۱:۳۵"}, {"source": "Billboard", "title": "From Wynonna to Ella Langley: Albums With 3 or More Country Airplay No. 1s by Women", "link": "https://www.billboard.com/lists/albums-with-country-airplay-number-1s-by-women/", "summary": "Women have spent much of 2026 rewriting Billboard ’s country record books. Ella Langley has been at the center of many of those milestones, while Taylor Swift, Stella Lefty and others have contributed to a broader run of new benchmarks on Hot Country Songs. Related Women s Country Chart Sweep Is Unlike Any Before, Thanks to Ella Langley, Taylor Swift Stella Lefty Now, Langley’s Dandelion , which has spent 21 weeks at No. 1 on Top Country Albums since it debuted in April, has delivered yet another milestone. With “Choosin’ Texas,” “Be Her, the Morgan Wallen duet “I Can’t Love You Anymore,” and on the Oct. 31-dated chart, Loving Life Again, each reaching No. 1, Dandelion is just the second album by a woman or an act with a woman vocalist to generate at least four leaders since the chart launched in 1990. It’s the first to reach the threshold since Shania Twain s The Woman In Me in 1996. Wallen brings some impressive album history of his own to the occasion. His “Don’t We,” which immediately preceded “I Can’t Love You Anymore” atop Country Airplay, became the seventh No. 1 from I’m the Problem , making it the first album to generate seven leaders from an original version. Luke Combs’ What You See Is What You Get also produced seven when counting its original and deluxe editions. For albums by women, however, even three has become rare. Ten of the 13 qualifying sets arrived between 1992 and 2009. Carrie Underwood leads with three — Some Hearts , Carnival Ride and Play On — while Shania Twain follows with two. Twain’s The Woman in Me and Langley s Dandelion remain the only albums in the group to produce four Country Airplay No. 1s. Below, Billboard looks back at the 13 albums and the hits they sent to the top.", "date_str": "2026-10-23T18:00:54+00:00", "hash": "05a3da92da12f386", "title_fa": "از Wynonna تا Ella Langley: آلبوم‌هایی با 3 یا بیشتر پخش کانتری شماره 1 توسط زنان", "summary_fa": "زنان بیشتر سال 2026 را صرف بازنویسی کتاب رکوردهای کشور بیلبورد کرده اند. الا لنگلی در مرکز بسیاری از این نقاط عطف بوده است، در حالی که تیلور سویفت، استلا لفتی و دیگران به مجموعه گسترده‌تری از معیارهای جدید در آهنگ‌های Hot Country کمک کرده‌اند. به لطف الا لنگلی، تیلور سویفت استلا لفتی ناو، قاصدک لنگلی، که 21 هفته را در رتبه اول سپری کرده است، جابجایی نمودار کشوری زنان مشابه هیچ چیز قبلی نیست. 1 در آلبوم های برتر کشور از زمانی که در ماه آوریل عرضه شد، یک نقطه عطف دیگر را به ارمغان آورده است. با «Choosin' Texas»، «Be Her, The Morgan Wallen Duet «I Can't Love You Anymore»، و در جدول تاریخ 31 اکتبر، Loving Life Again، که هر کدام به رتبه 1 رسیدند، Dandelion تنها دومین آلبوم یک زن یا اجرای یک خواننده زن است که حداقل چهار رهبر را از زمان اولین باری که چارت از سال 1999 منتشر شد، ایجاد کرده است. تواین زن در من در سال 1996. والن تاریخچه آلبوم چشمگیر خود را به این مناسبت آورده است. \"Don't We\" او که بلافاصله قبل از \"دیگر نمی توانم تو را دوست داشته باشم\" در صدر کانتری پخش شد، به هفتمین آلبوم شماره 1 از I'm the Problem تبدیل شد و آن را به اولین آلبومی تبدیل کرد که از نسخه اصلی هفت رهبر تولید کرد. Luke Combs's What You See Is What You Get نیز هنگام شمارش نسخه های اصلی و لوکس آن هفت تولید شده است. با این حال، برای آلبوم های زنان، حتی سه آلبوم نیز کمیاب شده است. ده ست از 13 ست مقدماتی بین سال‌های 1992 و 2009 وارد شدند. کری آندروود با سه ست پیشتاز است - Some Hearts، Carnival Ride و Play On - در حالی که شانیا تواین با دو ست بعد از آن.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/04/02-Ella-Langley-2026-cr-Caylee-Robillard-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۱:۳۰"}, {"source": "Deadline", "title": "All The Songs In ‘Love Language’: From Daddy Yankee To Royel Otis", "link": "https://deadline.com/2026/10/love-language-soundtrack-songs-chappell-roan-haim-1237171018/", "summary": "After its premiere at the 2026 SXSW film festival, Vertical’s romantic comedy Love Language starring Chloë Grace Moretz, Anthony Ramos, Manny Jacinto, Isabel May, Lukas Gage and Billie Lourd has arrived in select theaters and on digital/VOD. Written and directed by Joey Power, the film sees an aspiring author Lou (Moretz) — whose lucrative side [ ]", "date_str": "2026-10-23T19:00:00+00:00", "hash": "283d9c7f963e6314", "title_fa": "همه آهنگ ها به زبان عشق: از بابا یانکی تا رویل اوتیس", "summary_fa": "پس از نمایش در جشنواره فیلم SXSW 2026، کمدی عاشقانه عشق عمودی با بازی کلوئی گریس مورتز، آنتونی راموس، مانی جاسینتو، ایزابل می، لوکاس گیج و بیلی لورد در سینماهای منتخب و دیجیتال/VOD وارد بازار شد. این فیلم به نویسندگی و کارگردانی جوی پاور، نویسنده مشتاقی به نام لو (مورتز) را می بیند - که جنبه سودآور او [ ] تمام آهنگ های کمدی رمانتیک را در زیر بیابید: در ددلاین تماشا کنید موارد مرتبط: «1883» ستاره ایزابل می درباره چگونگی ایجاد تعادل در نقش اولیویا در «زبان عشق»: «She's Not
