اه مدت در کارولینای جنوبی کرد. در آن زمان، او گفت که صرفاً گذاشتن یک یادداشت خوب و یک بطری شراب برای مهمانان می تواند برای کسب نظرات پنج ستاره کافی باشد. امروز، با رقابت شدیدتر، این دیگر کافی نیست. Savage که شغل روزانه خود را به عنوان یک آتش نشان برای سرمایه گذاری تمام وقت و رشد SynergyStays، یک تجارت مدیریت درآمد برای صاحبان اجاره"}, {"source": "Business Insider", "title": "Walmart reverses an earlier limit on the height of order fulfillment carts in stores", "link": "https://www.businessinsider.com/walmart-stores-reversing-bin-limit-for-online-order-carts-2026-10", "summary": "A Walmart employee pulls an online order fulfillment cart at a store in Wisconsin. Dominick Reuter/Business Insider Walmart reversed a policy on the height and handling of online fulfillment carts. Earlier this year, the company limited carts to six bins to improve safety and visibility in stores. Now the eight-bin formation is back, with workers instructed to pull loaded carts behind themselves. The push-and-pull continues for Walmart's online order picking teams. The retail giant has reversed an earlier policy that reduced the number of bins workers haul on specialized carts, which was first reported by Business Insider in May and intended to improve visibility and safety . Under that guidance, workers were told to push carts unless they could not safely see ahead. The online fulfillment carts are a key piece of equipment that Walmart store employees use to gather the items shoppers order for pickup or delivery. Four Walmart employees in three states recently told Business Insider that their store leaders instructed their teams to return to hauling eight bins on their fulfillment carts and that they are now supposed to pull the carts rather than push them. Business Insider also observed the practice during a visit to a supercenter in Wisconsin on Tuesday. A Walmart spokesperson confirmed the policy change, saying it followed a period of testing and evaluation. Reducing the bin load over the summer allowed the company to identify ways to improve the online order fulfillment process, the spokesperson said. The spokesperson also said the company's safety policies, which require workers to maintain control of their carts and a line of sight ahead, have not changed. \"Safety of associates and customers is absolute,\" the spokesperson said. The original policy change in May came about after a short-lived April attempt to require the pulling of eight-bin carts. The requirement was widely criticized by workers for contributing to injuries and strains, such as twisted shoulders and wrists, clipped heels and ankles, and bodily collisions when a heavily loaded cart proves difficult to stop. \"This update supports a safer environment for associates and customers while helping make Walmart the best and safest place to shop and work,\" a memo at the time said. A store employee pulls an order fulfillment cart through a Walmart store. Dominick Reuter/Business Insider The issue reveals a tension for Walmart as it navigates the balance between accelerating e-commerce operatio", "date_str": "2026-10-09T09:23:01+00:00", "hash": "1af1b2acce54cc94", "title_fa": "Walmart محدودیت قبلی در ارتفاع سبدهای انجام سفارش در فروشگاه ها را معکوس می کند", "summary_fa": "یک کارمند والمارت در فروشگاهی در ویسکانسین یک سبد خرید سفارش آنلاین می کشد. Dominick Reuter/Business Insider Walmart خط مشی مربوط به ارتفاع و نحوه کارکرد گاری های انجام آنلاین را تغییر داد. در اوایل سال جاری، این شرکت برای بهبود ایمنی و دید در فروشگاه ها، چرخ دستی ها را به شش سطل محدود کرد. اکنون سازند هشت سطل زباله برگشته است و به کارگران دستور داده شده است که گاری های بارگیری شده را پشت سر خود بکشند. فشار و کشش برای تیم‌های سفارش آنلاین والمارت ادامه دارد. این غول خرده‌فروشی سیاست قبلی را که باعث کاهش تعداد سطل‌هایی که کارگران در چرخ‌های مخصوص حمل می‌کنند، که برای اولین بار توسط Business Insider در ماه مه گزارش شده بود، کاهش داده است، تغییر داده است. تحت آن راهنمایی، به کارگران گفته شد که گاری‌ها را هل دهند، مگر اینکه نتوانند با خیال راحت جلو را ببینند. چرخ دستی‌های آنلاین یکی از تجهیزات کلیدی است که کارکنان فروشگاه Walmart برای جمع‌آوری اقلامی که خریداران برای تحویل یا تحویل سفارش می‌دهند، استفاده می‌کنند. چهار کارمند والمارت در سه ایالت اخیراً به Business Insider گفته اند که رهبران فروشگاه آنها به تیم هایشان دستور داده اند که به حمل هشت سطل در چرخ دستی های خود بازگردند و اکنون قرار است به جای هل دادن چرخ دستی ها، گاری ها را بکشند. Business Insider همچنین در بازدید از یک مرکز فوق العاده در ویسکانسین در روز سه شنبه این عمل را مشاهده کرد. یکی از سخنگویان والمارت این تغییر سیاست را تأیید کرد و گفت که این تغییر پس از یک دوره آزمایش و ارزیابی انجام شد. سخنگوی گفت که کاهش بار سطل زباله در تابستان به شرکت اجازه داد تا راه هایی را برای بهبود فرآیند انجام سفارش آنلاین شناسایی کند. این سخنگوی همچنین گفت که سیاست های ایمنی این"}, {"source": "Business Insider", "title": "Amazon says its viral 'About You' profiles don't use outside data. Here's how to edit yours.", "link": "https://www.businessinsider.com/amazon-about-you-dossier-editing-instructions-2026-10", "summary": "Amazon s About You pages have gone viral with silly — often incisive — descriptions of their customers. Bloomberg/Getty Images Amazon says its \"About You\" profiles use activity on its own services — not outside data. The profile draws on purchases, searches, reviews, lists, and Alexa for Shopping conversations. You can edit or remove a detail, but that does not erase your Amazon data. Want to know what Amazon thinks about you? Just check out your \"About You\" page . The page — essentially a customer dossier built from activity across an Amazon customer's purchase history, searches, saved lists, written reviews, and Alexa for Shopping conversations — has gone viral. While Amazon says the editable page gives some transparency into which products it's recommending, shoppers on social media have been laughing about its amusingly specific conclusions. One shopper, it said, has \" flat buttocks, \" while it told another shopper that their husband had \" skinny legs. \" Our office checked out the page on Wednesday, too, and found that its conclusions were sometimes acutely accurate, and sometimes dead wrong . There's data collection underlying those conclusions — and we've heard from plenty of readers that that makes them nervous. Amazon says it does not collect any information from third parties for About You. \"The details on About You come from information customers share through their activity across Amazon,\" an Amazon spokesperson told Business Insider. That means a shopper who regularly orders cat food may see an inference about owning a cat. A person buying children's clothes or birthday gifts could prompt an assumption about having children. A person who only tells another app about their pant size shouldn't see that information on About You, Amazon says. It's also editable Amazon lets customers change or delete their results. That doesn t mean Amazon will get rid of the underlying data. Amazon Shoppers can find the feature by tapping: Account Shopping preferences About You Amazon says the results are not permanent. Customers can tap an individual detail to explain why it is wrong, or remove information they do not want used for recommendations. That gives shoppers a limited right of reply — but it is not necessarily a button to erase their underlying Amazon history. Removing a detail from About You tells Amazon not to use that information for personalization; it does not automatically delete the purchases, searches, or other Amazon activity that may have promp", "date_str": "2026-10-09T09:17:01+00:00", "hash": "4cc0df69b8a502bd", "title_fa": "آمازون می گوید پروفایل های ویروسی «درباره شما» از داده های خارجی استفاده نمی کند. در اینجا نحوه ویرایش مورد شما آمده است.", "summary_fa": "صفحات «درباره شما» آمازون با توضیحات احمقانه - اغلب واضح - از مشتریان خود در فضای مجازی منتشر شده است. بلومبرگ/گتی ایماژ آمازون می‌گوید پروفایل‌های «درباره شما» از فعالیت در سرویس‌های خود استفاده می‌کنند - نه داده‌های خارجی. نمایه از خریدها، جستجوها، بررسی‌ها، فهرست‌ها و مکالمات الکسا برای خرید استفاده می‌کند. شما می توانید یک جزئیات را ویرایش یا حذف کنید، اما این اطلاعات آمازون شما را پاک نمی کند. آیا می خواهید بدانید آمازون در مورد شما چه فکر می کند؟ فقط صفحه \"درباره شما\" خود را بررسی کنید. این صفحه - اساساً یک پرونده مشتری که از فعالیت در تاریخچه خرید مشتری آمازون، جستجوها، لیست های ذخیره شده، نظرات نوشته شده و مکالمات الکسا برای خرید ساخته شده است - ویروسی شده است. در حالی که آمازون می‌گوید صفحه قابل ویرایش در مورد محصولاتی که توصیه می‌کند شفافیت می‌دهد، خریداران در رسانه‌های اجتماعی درباره نتیجه‌گیری‌های خاص آن می‌خندند. گفته می‌شود یکی از خریداران \"باسن صاف\" دارد، در حالی که به خریدار دیگری گفته است که شوهرشان \"پاهای لاغری\" دارد. \"دفتر ما روز چهارشنبه نیز صفحه را بررسی کرد و متوجه شد که نتیجه‌گیری‌های آن گاهی بسیار دقیق و گاهی اشتباه بود. مجموعه داده‌هایی زیربنای این نتیجه‌گیری‌ها وجود دارد - و ما از خوانندگان زیادی شنیده‌ایم که آنها را عصبی می‌کند. آمازون می‌گوید هیچ اطلاعاتی را از اشخاص ثالث برای درباره شما جمع‌آوری نمی‌کند. \"جزئیات درباره شما از اطلاعاتی است که مشتریان از طریق فعالیت‌های خود در آمازون به اشتراک می‌گذارند.\" این بدان معناست که خریدار که مرتباً غذای گربه سفارش می دهد ممکن است استنباط در مورد داشتن یک گربه را ببیند. شخصی که لباس های بچه گانه یا هدایای تولد می خرد می تواند فرضیه ای در مورد بچه دار شدن ایجاد کند. آمازون می‌گوید شخصی که فقط سایز شلوار خود را به اپلیکیشن دیگری می‌گوید، نباید"}, {"source": "Business Insider", "title": "I used to rush through bedtime with my kids. Then I realized every routine has a last time.", "link": "https://www.businessinsider.com/parent-stopped-rushing-bedtime-with-kids-it-wont-last-forever-2026-10", "summary": "The author (not pictured) said she knows there will be a last time her kids want her to read to them at night. Keeping that in mind helps her get through hard moments. AnVr/Getty Images I'm a mom of two kids under 3, and so much of parenting lives in the ordinary moments. It's easy to find yourself rushing through the repetitive, everyday parts without meaning to. I'm learning to slow down and be more present, even on the nights I'm the one nodding off at bedtime. Before I had kids , I would picture the moments I was most excited for. The feeling of a tiny hand tucked into mine while walking through a parking lot. Pushing my baby on a swing over and over again to get a glimpse of a gummy smile. The sweet, somewhat obvious stuff that you dream up when you're imagining what motherhood will feel like. What's harder to picture beforehand are the everyday pieces of parenthood that I can see now that I have two kids, both under 3. Bedtime routines with three or more book requests every night. All the \"5 more minutes\" pleas at the library. Invitations to come play trucks when you're so close to having the dishwasher completely emptied. Some mornings, I look around, and my living room floor is covered in blocks, there's a pile of laundry that has been \"almost done\" for three days, and I'm moving through the mental tabs of everything I need to get done before I'm asked for a snack. Again. These moments aren't exactly hard, but they're the mundane, repetitive layer of parenting that can start to grate on even those of us with the biggest hearts. Rinsing sippy cups and listening to the same song for the sixth time on the drive to preschool. You're grateful, but sometimes, without meaning to, you find yourself rushing through them. At least I know I do. Then I read something about how every ordinary moment has a last time. And it stuck. There is always a last time I don't remember exactly where I came across it. A newsletter, maybe, or something I scrolled past on social media. But the idea was simple: at some point, the everyday moments all happen one last time. A last bath before they decide they're a shower person. A last time they ask you to stay for one more story . A last pull away from whatever you're doing to build a tower. You don't get a warning, but these things just stop happening. I'm a get-the-checklist-done type of person , and parenting asks you to let a lot of that go. My son wants to race motorcycles around the couch, but there's also dinner to make.", "date_str": "2026-10-09T09:11:01+00:00", "hash": "36d333b291cfc83b", "title_fa": "من عادت داشتم با بچه هایم هنگام خواب عجله کنم. سپس متوجه شدم که هر روتینی آخرین بار دارد.", "summary_fa": "نویسنده (در تصویر نیست) گفت که می‌داند آخرین باری خواهد بود که بچه‌هایش می‌خواهند او شب‌ها برایشان بخواند. در نظر گرفتن این موضوع به او کمک می کند تا لحظات سخت را پشت سر بگذارد. AnVr/Getty Images من مادر دو فرزند زیر 3 سال هستم و بسیاری از والدین در لحظات عادی زندگی می کنند. به راحتی می توان متوجه شد که با عجله در بخش های تکراری و روزمره بدون هیچ معنایی می گذرد. دارم یاد می‌گیرم که سرعتم را کم کنم و بیشتر حضور داشته باشم، حتی شب‌هایی که موقع خواب سر تکان می‌دهم. قبل از اینکه بچه دار شوم، لحظاتی را که برایشان بسیار هیجان زده بودم را به تصویر می کشیدم. حس یک دست ریز که در هنگام قدم زدن در یک پارکینگ در دست من فرو رفته است. بارها و بارها کودکم را روی تاب هل می‌دهم تا نگاهی اجمالی به لبخند لثه‌ای داشته باشم. چیزهای شیرین و تا حدودی واضحی که وقتی تصور می کنید مادر شدن چه حسی خواهد داشت، رویای آن را در سر می پرورانید. آنچه از قبل سخت تر است، تکه های روزمره والدینی است که اکنون که دو فرزند دارم، هر دو زیر 3 سال، می توانم ببینم. روال قبل از خواب با سه یا بیشتر درخواست کتاب هر شب. تمام درخواست های \"5 دقیقه دیگر\" در کتابخانه. زمانی که به تخلیه کامل ماشین ظرفشویی نزدیک شده اید، دعوت نامه برای آمدن به کامیون بازی. برخی از صبح‌ها، به اطراف نگاه می‌کنم، و کف اتاق نشیمن‌ام با بلوک‌ها پوشانده شده است، انبوهی از لباس‌های شسته شده وجود دارد که سه روز است «تقریباً تمام شده»، و من در حال حرکت در برگه‌های ذهنی همه چیزهایی هستم که باید قبل از اینکه از من یک میان‌وعده بخواهند انجام دهم. دوباره این لحظه‌ها دقیقاً سخت نیستند، اما لایه‌های روزمره و تکراری"}, {"source": "Business Insider", "title": "I don't need an AI agent to be an executive assistant. I need it to be a wife.", "link": "https://www.businessinsider.com/ai-agent-wife-not-executive-assistant-2026-10", "summary": "Mikhail Seleznev/Getty Images I want an AI agent like Muse to be able to anticipate my needs and not need to tell it every step. Not an executive assistant, but … an AI \"wife.\" A tweet with the same sentiment has gone viral. I talked to the woman who wrote it. A while ago, I was chatting with a friend, venting about some of the stresses of being a working mother, the feeling of spinning plates with something always dropping. \"What I want is a wife ,\" my friend said. I remember laughing out loud, because it so perfectly captured our frustrations. We both have dutiful, egalitarian husbands who go above and beyond to do their share of the housework and childcare. But still, they're not a wife . Sonia Baschez, a marketing entrepreneur and podcaster, went viral earlier this week for saying what she wanted from AI agents is \"a wife,\" not \"a husband\" — by her definition, something that anticipates your needs versus just doing tasks you assign it. Silicon Valley keeps building me a husband when what I really want is a wife lol I don't want an agent that only does one-off, random tasks that are nice but not life-changing: booking flights, making dinner reservations, or buying tickets I want an AI wife who knows what’s on… — Sonia Baschez (@SoniaBaschez) October 6, 2026 Let's indulge in some broad, sweeping, gendered stereotypes for a moment. Consider the \"mental load\" — the concept in heterosexual couples with kids that the mother is often mentally carrying a running tab of chores and considerations, even when the dad helps out. The classic example is a dad offering that if he is given a grocery list, he can go to the store, but that requires that the mom needs to make the list by knowing what's currently in the fridge and what the meal plan for the week is. Some people enthuse that AI agents like Muse or Instinct are like having your own executive assistant. But the truth is, I don't really need an executive assistant at my job. I'm not a globe-trotting executive who needs to book lots of flights, nor am I a coder building an app, which seems to be what a lot of the product demos for tools like OpenAI's Dots are. Instead, what I've found AI agents for (I've tested Muse the most ) to be most helpful for is personal and family tasks, especially related to the various paperwork, scheduling, and messages that come from my kids' school and activities. Basically, I agree with Baschez's idea. I want an AI wife! I want something I don't have to give a list of detailed ins", "date_str": "2026-10-09T09:05:01+00:00", "hash": "e1dedb5046440c0d", "title_fa": "من برای دستیار اجرایی نیازی به یک عامل هوش مصنوعی ندارم. من برای همسر شدن به آن نیاز دارم.", "summary_fa": "میخائیل سلزنف/ گتی ایماژ من از یک عامل هوش مصنوعی مانند Muse می خواهم که بتواند نیازهای من را پیش بینی کند و نیازی به گفتن آن در هر مرحله نداشته باشد. نه یک دستیار اجرایی، بلکه یک \"همسر\" هوش مصنوعی. توییتی با همین حس در فضای مجازی منتشر شده است. با زنی که آن را نوشته بود صحبت کردم. چند وقت پیش داشتم با یکی از دوستانم چت می‌کردم، استرس‌های یک مادر شاغل بودن، احساس چرخیدن بشقاب‌ها با چیزی که همیشه می‌افتد را خالی می‌کردم. دوستم گفت: \"چیزی که من می خواهم یک همسر است.\" یادم می آید که با صدای بلند خندیدم، زیرا به خوبی ناامیدی ما را نشان می داد. هر دوی ما شوهران وظیفه شناس و برابری طلبی داریم که برای انجام کارهای خانه و مراقبت از کودکان فراتر از آن عمل می کنند. اما با این حال، آنها همسر نیستند. سونیا باسچز، یک کارآفرین بازاریابی و پادکست، اوایل این هفته به دلیل گفتن اینکه آنچه از عوامل هوش مصنوعی می‌خواهد «یک همسر» است، نه «شوهر» – بر اساس تعریف او، چیزی که نیازهای شما را در مقابل انجام وظایف محوله‌تان پیش‌بینی می‌کند، در فضای مجازی منتشر شد. سیلیکون ولی برای من شوهر می‌سازد زمانی که من واقعاً می‌خواهم یک همسر داشته باشم، من نماینده‌ای نمی‌خواهم که کارهای تصادفی و یکباره را انجام دهد که خوب هستند، اما زندگی را تغییر نمی‌دهند: رزرو پرواز، رزرو شام یا خرید بلیط، من یک همسر با هوش مصنوعی می‌خواهم که بداند چه خبر است… - Sonia Baschez (@SoniaBascheul's20@SoniaBascheul's20) کلیشه های گسترده، فراگیر و جنسیتی برای لحظه ای. «بار ذهنی» را در نظر بگیرید - این مفهوم در زوج‌های دگرجنس‌گرا با بچه‌ها که مادر اغلب از نظر ذهنی وظایف و ملاحظات خود را به دوش می‌کشد، حتی وقتی پدر کمک می‌کند. مثال کلاسیک این است که پدر پیشنهاد می کند"}, {"source": "Business Insider", "title": "Wall Street is inventing an entirely new financial system around Nvidia's AI chips", "link": "https://www.businessinsider.com/wall-street-wants-nvidia-gpus-to-be-next-asset-class-2026-10", "summary": "Wall Street is building a new financial ecosystem around Nvidia s graphics processing units (GPUs). Bloomberg/Getty Images Wall Street is building new ways to finance Nvidia's coveted AI chips, or graphics processing units. The next step is creating markets to hedge and trade GPUs. Everything hinges on these questions: what are chips worth over time, and how resellable are they? Banks want to lend against them. Insurers want to protect them. Investors want to trade them. A financial ecosystem is forming around Nvidia's graphics processing units (GPUs), as Wall Street tries to turn the AI chips into a new asset class, like real estate, oil, and agricultural commodities. The AI boom sparked a scramble for Nvidia's cutting-edge chips — and a financial market has emerged because they're too expensive to buy outright. But if companies can borrow money against the chips themselves, it could unlock hundreds of billions of dollars for new AI infrastructure — and help realize Nvidia's vision of abundant compute. A new financial playbook has taken shape. Nvidia is acting as a guarantor for deals. Insurers are protecting against falling GPU values. And companies like Amazon are putting GPUs into separate entities instead of owning them directly. As the market matures, it's also creating new jobs. Some AI cloud providers are hiring full-time compute traders to buy and sell GPU contracts that lock in future prices, said Ethan Vera, chief operating officer of Luxor Technology. Whether any of it works hinges on these questions: how much will chips be worth over time, and how resellable are they? Nvidia keeps releasing new generations at a rapid cadence, raising fears that today's chips could quickly lose value . Nvidia's chips are backing billion-dollar loans GPU financing took off in the early 2020s, when banks and private credit firms began lending money to AI cloud providers. A major contract between CoreWeave and Microsoft in 2023 gave lenders confidence that their loans to buy GPUs would be repaid, said Billy Libby, cofounder and CEO of investment firm Upper90. Now, instead of relying on contracts, lenders are increasingly considering whether GPUs themselves can serve as collateral, said Bernie Margulies, CEO of GPU financing startup American Compute. For now, customer contracts do most of the heavy lifting. Still, Wall Street's interest is growing. Nvidia has enlisted BlackRock, Apollo, and Goldman Sachs to help raise more than $500 billion to finance AI infrastruc", "date_str": "2026-10-09T09:00:02+00:00", "hash": "d8caf7a4d8e3f9d9", "title_fa": "وال استریت در حال اختراع یک سیستم مالی کاملاً جدید پیرامون تراشه های هوش مصنوعی انویدیا است", "summary_fa": "وال استریت در حال ساخت یک اکوسیستم مالی جدید در اطراف واحدهای پردازش گرافیکی (GPU) انویدیا است. بلومبرگ/گتی ایماژز وال استریت در حال ساخت راه‌های جدیدی برای تامین مالی تراشه‌های هوش مصنوعی یا واحدهای پردازش گرافیکی انویدیا است. گام بعدی ایجاد بازارهایی برای پوشش و تجارت پردازنده‌های گرافیکی است. همه چیز به این سوالات بستگی دارد: چیپس ها در طول زمان چه ارزشی دارند و چقدر قابل فروش هستند؟ بانک ها می خواهند علیه آنها وام بدهند. بیمه ها می خواهند از آنها محافظت کنند. سرمایه گذاران می خواهند آنها را معامله کنند. یک اکوسیستم مالی در اطراف واحدهای پردازش گرافیکی (GPU) انویدیا در حال شکل گیری است، زیرا وال استریت تلاش می کند تراشه های هوش مصنوعی را به یک طبقه دارایی جدید مانند املاک، نفت و کالاهای کشاورزی تبدیل کند. رونق هوش مصنوعی جرقه تقلا برای تراشه‌های پیشرفته انویدیا را برانگیخت - و یک بازار مالی پدید آمده است، زیرا آنها برای خرید مستقیم بسیار گران هستند. اما اگر شرکت‌ها بتوانند در مقابل تراشه‌ها پول قرض کنند، می‌تواند صدها میلیارد دلار برای زیرساخت‌های جدید هوش مصنوعی باز کند - و به تحقق چشم‌انداز انویدیا در مورد محاسبات فراوان کمک کند. کتاب بازی مالی جدیدی شکل گرفته است. انویدیا به عنوان ضامن معاملات عمل می کند. بیمه‌گران در برابر کاهش ارزش GPU محافظت می‌کنند. و شرکت هایی مانند آمازون به جای مالکیت مستقیم GPU ها را در نهادهای جداگانه قرار می دهند. همانطور که بازار بالغ می شود، مشاغل جدیدی نیز ایجاد می کند. اتان ورا، مدیر عامل شرکت Luxor Technology گفت: برخی از ارائه دهندگان ابر هوش مصنوعی، معامله گران محاسباتی تمام وقت را برای خرید و فروش قراردادهای GPU که قیمت های آینده را قفل می کند، استخدام می کنند. این که آیا هر یک از آن ها کار می کند یا نه به این سؤالات بستگی"}, {"source": "Business Insider", "title": "New York City is coming for companies that make it hard to cancel subscriptions", "link": "https://www.businessinsider.com/nyc-enforces-new-click-to-cancel-rule-subscription-cancellations-2026-10", "summary": "The Mamdani administration is cracking down on companies that won t let you unsubscribe. ANGELA WEISS / AFP via Getty Images Have you ever tried to cancel a gym or Internet subscription and ended up in a phone loop? A new rule in New York City aims to make it as easy to cancel as it is to sign up for memberships. Companies that don't let consumers easily unsubscribe could pay thousands. Alex Aminov, 37, doesn't know why he's on his current phone plan , or how much he's paying for it. Recently, the Brooklyn-based software developer said he tried to cancel the landline included in his Optimum internet package, which cost an extra $25 a month. When he called to try to cancel it — the only way to get through — a representative convinced him that it would be cheaper to transfer the line to a mobile plan, and that he'd be eligible for a slew of discounts. He said that representative told him they'd follow up to ensure that the transfer went through so the discounts could go into effect; she never called him back. When he got back in touch, a different representative said just some of those discounts would apply, and that they didn't know who he originally spoke with. A week or so later, a third representative called to ask why he wasn't using the number. He's still not quite sure what's happening with his various plans. \"Telecom providers or basically almost anything that has a monthly subscription, it's a nightmare to cancel it,\" Aminov said. \"In general, I would like to have an option to cancel anything online.\" An Optimum spokesperson said, \"We're committed to making it as easy as possible for customers to manage their services and get the support they need. Each customer has different needs.\" New York City is addressing this very struggle. As of October 1st, New Yorkers can file complaints against businesses that make canceling subscriptions unnecessarily difficult . The city's Department of Consumer and Worker Protection will enforce fines ranging from $525 for the first violation to up to $3,500 for repeat offenses, and businesses may be required to reimburse affected consumers for unwanted services. The city's \"click to cancel\" rule requires companies to state their subscription terms clearly, explain people's rights when buying or canceling a membership, and provide a cancellation process as \"straightforward\" as the sign-up process. A few hundred complaints were submitted in the first days of the rule, and around 6,000 New Yorkers had visited the click-t", "date_str": "2026-10-09T09:00:01+00:00", "hash": "b1b4d4be23f19634", "title_fa": "شهر نیویورک به سراغ شرکت هایی می آید که لغو اشتراک را سخت می کنند", "summary_fa": "دولت ممدانی شرکت هایی را که به شما اجازه لغو اشتراک نمی دهند سرکوب می کند. آنجلا وایس / خبرگزاری فرانسه از طریق گتی ایماژ آیا تا به حال سعی کرده اید که اشتراک باشگاه یا اینترنت را لغو کنید و در نهایت در یک حلقه تلفن قرار بگیرید؟ یک قانون جدید در شهر نیویورک قصد دارد لغو آن را به همان اندازه که ثبت نام برای عضویت است آسان کند. شرکت هایی که به مصرف کنندگان اجازه نمی دهند اشتراک خود را به راحتی لغو کنند، می توانند هزاران دلار بپردازند. الکس امینوف، 37 ساله، نمی داند چرا در برنامه تلفن فعلی خود قرار دارد، یا چقدر برای آن هزینه می کند. اخیراً، توسعه‌دهنده نرم‌افزار مستقر در بروکلین گفت که تلاش کرده است تلفن ثابت موجود در بسته اینترنت Optimum خود را لغو کند که هزینه آن 25 دلار اضافی در ماه است. هنگامی که او تماس گرفت تا آن را لغو کند - تنها راه برای عبور - یک نماینده او را متقاعد کرد که انتقال خط به یک طرح تلفن همراه ارزان تر است و او واجد شرایط تخفیف های زیادی است. او گفت که آن نماینده به او گفت که پیگیری خواهند کرد تا از انجام این انتقال اطمینان حاصل کنند تا تخفیف ها اعمال شود. او هرگز به او زنگ نزد. وقتی او دوباره تماس گرفت، نماینده دیگری گفت که فقط برخی از این تخفیف ها اعمال می شود و آنها نمی دانستند که او در ابتدا با چه کسی صحبت کرده است. یک هفته یا بیشتر بعد، نماینده سومی تماس گرفت و پرسید که چرا از شماره استفاده نمی کند. او هنوز کاملاً مطمئن نیست که با نقشه های مختلف او چه اتفاقی می افتد. امینوف گفت: «ارائه دهندگان مخابراتی یا تقریباً هر چیزی که اشتراک ماهانه داشته باشد، لغو آن یک کابوس است."}, {"source": "Business Insider", "title": "My personal AI agent posted my bank details on company Slack. It's made me rethink how I use it.", "link": "https://www.businessinsider.com/personal-ai-agent-grok-bot-posted-bank-details-company-slack-2026-10", "summary": "Shane Mac ran into an unexpected problem with his personal AI agents. Shane Mac Shane Mac, the cofounder and CEO of XMTP Labs, started playing around with personal AI agents in December. But he was in for a rude shock when one of his agents posted his bank audit in a company Slack channel. He said it reminded him how powerful agents are, and how the right permissions and controls are crucial. This as-told-to essay is based on a conversation with Shane Mac, the 40-year-old CEO of software company XMTP Labs. It has been edited for length and clarity. This era of personal AI agents really began in the last year, around December for me. I think the OpenClaw moment was when it became clear that a new era was coming. I experimented with OpenClaw when it came out, as well as Hermes and all the different harnesses. On a personal level, I've been using them for things I don't really want to do. That could be following up with the DMV, reaching out to get quotes for local services for the house, booking golf sessions, that sort of stuff. That's how I created my personal CFO agent. I set up a 'CFO' agent using Grok Bot I set up CFO using Grok Bot around the end of August. At the end of every month, I wanted to answer questions like: What are the balances? What are the expenses this month? What are the recurring expenses? Is there anything that looks fraudulent or suspicious? Is there anything you would recommend to save costs? I told the agent, \"If you were going to be my personal financial advisor, what would you say to me every month?\" For its permissions, I gave it read-only access to my personal checking and savings accounts. I told it to send messages only to me through Grok Bot. Every month, it would send me a monthly report in a group chat of all my AI agents on Grok Bot, which I named \"My Personal Exec Team.\" I was using it like I had my own little executive team helping me. At first, I had it run every week, and it worked great. But the first time the monthly audit kicked off, that's when it went wrong. It sent my audit to my company's Slack channel It was Thursday, October 1. Our head of product sent me a DM on Slack. He said, \"Hey, heads-up. I think you meant to post the XMTP bank balance.\" I didn't mean to post anything. He started reading it and thought it was our company's financials. Then it mentioned that I was building a barn on my property, which set off his alarm bells. That's when he realized that it was my personal checking account. It included m", "date_str": "2026-10-09T08:43:28+00:00", "hash": "79821f59c7e511a6", "title_fa": "عامل هوش مصنوعی شخصی من جزئیات بانکی من را در شرکت Slack ارسال کرد. این باعث شد در نحوه استفاده از آن تجدید نظر کنم.", "summary_fa": "شین مک با عوامل هوش مصنوعی شخصی خود به مشکلی غیرمنتظره برخورد کرد. شین مک شین مک، موسس و مدیر عامل آزمایشگاه XMTP، در دسامبر شروع به بازی با عوامل هوش مصنوعی شخصی کرد. اما زمانی که یکی از کارگزارانش حسابرسی بانکی خود را در یکی از کانال های شرکت Slack پست کرد، او در شوک بی ادبی قرار گرفت. او گفت که این به او یادآوری می‌کند که عوامل چقدر قدرتمند هستند و مجوزها و کنترل‌های صحیح چقدر حیاتی هستند. این مقاله گفته شده بر اساس گفتگو با شین مک، مدیر عامل 40 ساله شرکت نرم افزاری XMTP Labs است. برای طول و وضوح ویرایش شده است. این دوره از عوامل شخصی هوش مصنوعی واقعاً در سال گذشته، حدود دسامبر برای من آغاز شد. من فکر می کنم لحظه OpenClaw زمانی بود که مشخص شد دوره جدیدی در راه است. من با OpenClaw زمانی که منتشر شد، و همچنین هرمس و همه مهارهای مختلف را آزمایش کردم. در سطح شخصی، من از آنها برای کارهایی استفاده کرده ام که واقعاً نمی خواهم انجام دهم. این می تواند پیگیری با DMV، تماس گرفتن برای دریافت پیشنهاد خدمات محلی برای خانه، رزرو جلسات گلف، و چیزهایی از این دست باشد. اینگونه بود که من نماینده مالی شخصی خود را ایجاد کردم. من یک نماینده \"CFO\" با استفاده از Grok Bot راه اندازی کردم من CFO را با استفاده از Grok Bot در اواخر ماه اوت راه اندازی کردم. در پایان هر ماه می خواستم به سوالاتی مانند این که: مانده ها چیست؟ هزینه های این ماه چقدر است؟ هزینه های مکرر چیست؟ آیا چیزی وجود دارد که تقلبی یا مشکوک به نظر برسد؟ آیا چیزی برای صرفه جویی در هزینه ها توصیه می کنید؟ به نماینده گفتم: اگر قرار باشد مشاور مالی شخصی من باشی، هر ماه به من چه می‌گویی؟"}, {"source": "Business Insider", "title": "Emma Camp wants Gen Z to grow up", "link": "https://www.businessinsider.com/emma-camp-gen-z-grow-up-shortform-video-influencer-2026-10", "summary": "Alex S.K. Brown / Courtesy of Emma Camp Emma Camp, a writer for The Wall Street Journal's famously conservative editorial page, began a recent video on housing costs with a simple question — and an appealingly simple answer. \"Can rent control fix the housing crisis? No!\" she says. It actually makes the problem worse, Camp argues, by discouraging developers from building new units if they don't think they can charge enough to recoup their investment. The 75-second video has gotten 4.8 million views on X. Camp, 27, has gained traction with pro-free market ideas by riding the short-form vertical video boom. She's shot from 25,000 to 125,000 followers on X in recent weeks after a string of video posts tackling Gen Z's woes, consumerism, and grocery prices that have drawn millions of views. I met up with Camp in Brooklyn's Carroll Gardens, one of the neighborhoods that voted overwhelmingly for Zohran Mamdani for mayor of New York. (Camp didn't yet live in New York during the election last year, but is a staunch Mamdani opponent). \"I like being a debunker,\" she tells me. \"I love a story where I can come at it, like, a commonly held belief about what's going on here is wrong. And let me explain why.\" While much of the early reaction to her videos has been positive, Camp also sees upside in garnering critics, who argue she's a shill for capitalism's power brokers, that she oversimplies complex issues like rent control, and that she's overly dismissive of the plight of her fellow Gen Zers. \"When you have some pushback, that's a sign that you're mounting ideas that people, who disagree with them, think are worth pushing back against,\" she says. Camp's videos and essays often share a few elements. She picks a commonly held belief, usually about why capitalism is bad, and argues why it's actually wrong. In a viral video about people blaming free markets for the disappearance of old-timey fridges, she smizes at the camera and says, \"This could not be more wrong.\" Gen Z tropes, like a pervasive feeling of helplessness and therapy culture, are another common target. \"I'm sick of watching people wallow in their own powerlessness because they're too afraid of the responsibilities of agency,\" she said on social media. She invariably delivers the message in a perky, approachable, just-telling-it-like-it-is package. A video extolling grocery stores ends with Camp taking a twirl around Whole Foods, sniffing an orange with a look of bliss. Camp's rise comes as many of her peers", "date_str": "2026-10-09T08:13:01+00:00", "hash": "44902d36e452bc61", "title_fa": "اما کمپ می خواهد ژنرال Z بزرگ شود", "summary_fa": "الکس اس.کی. براون/ با حسن نیت از اما کمپ اما کمپ، نویسنده صفحه سرمقاله معروف محافظه کار وال استریت ژورنال، ویدئوی اخیر خود را در مورد هزینه های مسکن با یک سوال ساده - و یک پاسخ ساده جذاب آغاز کرد. \"آیا کنترل اجاره بها می تواند بحران مسکن را برطرف کند؟ نه!\" او می گوید. کمپ استدلال می‌کند که در واقع مشکل را بدتر می‌کند، زیرا توسعه‌دهندگان را از ساخت واحدهای جدید دلسرد می‌کند، اگر فکر می‌کنند نمی‌توانند به اندازه کافی برای جبران سرمایه خود هزینه کنند. این ویدیوی 75 ثانیه‌ای 4.8 میلیون بازدید در ایکس داشته است. کمپ 27 ساله با استفاده از رونق ویدیویی عمودی کوتاه با ایده‌های طرفدار بازار آزاد مورد توجه قرار گرفته است. او در هفته‌های اخیر پس از مجموعه‌ای از پست‌های ویدیویی که به مشکلات ژنرال Z، مصرف‌گرایی و قیمت مواد غذایی که میلیون‌ها بازدیدکننده داشته است، از 25000 به 125000 دنبال‌کننده در X شلیک کرده است. من با کمپ در باغ کارول بروکلین، یکی از محله هایی که با اکثریت قاطع به زهران ممدانی برای شهردار نیویورک رأی دادند، ملاقات کردم. (کمپ در جریان انتخابات سال گذشته هنوز در نیویورک زندگی نکرده است، اما یک مخالف سرسخت ممدانی است). او به من می‌گوید: «من دوست دارم یک مرد شکن باشم. «من عاشق داستانی هستم که بتوانم به آن دست پیدا کنم، مثلاً باور عمومی درباره آنچه اینجا می‌گذرد اشتباه است. و اجازه دهید توضیح بدهم که چرا.\" در حالی که بسیاری از واکنش های اولیه به ویدیوهای او مثبت بوده است، کمپ همچنین در جذب منتقدان مثبت می بیند، که استدلال می کنند او برای دلالان قدرت سرمایه داری است، مسائل پیچیده ای مانند کنترل اجاره را بیش از حد ساده می کند، و او بیش از حد از وضعیت اسفناک همکارش ژنرال زرز نادیده گرفته می شود. او می‌گوید، فکر می‌کنید"}, {"source": "Business Insider", "title": "Sheryl Sandberg says adult children can help a widowed parent with a simple message", "link": "https://www.businessinsider.com/sheryl-sandberg-adult-children-help-widowed-parent-grief-love-2026-10", "summary": "Sheryl Sandberg, Meta s former COO, lost her husband, Dave Goldberg, in 2015, when their children were 10 and 7. She later found love again and married Tom Bernthal in 2022. Matt Winkelmeyer/Getty Images for Vanity Fair Sheryl Sandberg lost her husband in 2015 when their children were 10 and 7. She said her son once told her not to remarry, but eventually supported her new chapter. The former Meta COO said children can help a widowed parent through grief and loneliness in one key way. Sheryl Sandberg said one of the most meaningful moments since she was widowed came when her son encouraged her to recreate a photo with her second husband. On Thursday's episode of the \" All There Is with Anderson Cooper \" podcast, the former Meta COO spoke about losing her late husband, Dave Goldberg, in 2015. Their children were 10 and 7 at the time. Sandberg later found love again with Tom Bernthal , whom she married in 2022. During the podcast, Sandberg recounted how, on a recent trip to the Cape of Good Hope in South Africa, she found herself grieving Goldberg because it was where they had taken one of her favorite honeymoon photos. Her 21-year-old son, who had once told her not to remarry, urged her to take the same picture with Bernthal, saying Goldberg would have been happy she'd found him. \"That was one of the most important moments of my life, and it just happened. And I want more people who have lost spouses to have that with their children,\" Sandberg told host Anderson Cooper. Sandberg said she often tells widows and widowers two things: that things will get better, and that they can find love again if they want to. \"Every person kind of gasps, pauses, and then there's relief, and they say, 'Thank you for saying that. No one else has.' And then almost as frequently they say, 'But I don't want to upset my children,'\" Sandberg said. \"Not little kids. I'm talking about grown children.\" She acknowledged that it can be painful for adult children to watch a parent date after losing a spouse . But, she said, parents spend most of their lives caring for their kids, and adult children \"have a chance to do something for a parent\" by supporting a surviving parent's search for companionship. \"I don't fault the adult children who aren't doing this. I think they just haven't thought about it,\" Sandberg said, adding that they may not realize how lonely a widowed parent can feel once their children return to their own partners and families. \"The question is giving them permission", "date_str": "2026-10-09T07:22:58+00:00", "hash": "0af57b97fbc4420b", "title_fa": "شریل سندبرگ می گوید کودکان بزرگسال می توانند با یک پیام ساده به والدین بیوه کمک کنند", "summary_fa": "شریل سندبرگ، مدیر ارشد اجرایی سابق متا، همسرش دیو گلدبرگ را در سال 2015 از دست داد، زمانی که فرزندانشان 10 و 7 ساله بودند. او بعداً دوباره عشق پیدا کرد و در سال 2022 با تام برنتال ازدواج کرد. دوباره ازدواج کرد، اما در نهایت از فصل جدید او حمایت کرد. مدیر اجرایی سابق متا گفت که کودکان می توانند به یک روش کلیدی به والدین بیوه در غم و اندوه و تنهایی کمک کنند. شریل سندبرگ می‌گوید یکی از مهم‌ترین لحظات از زمان بیوه شدنش زمانی بود که پسرش او را تشویق کرد تا عکسی با همسر دومش خلق کند. در قسمت پنجشنبه پادکست \"همه چیز با اندرسون کوپر وجود دارد\"، مدیر ارشد سابق متا در مورد از دست دادن همسر فقیدش، دیو گلدبرگ، در سال 2015 صحبت کرد. فرزندان آنها در آن زمان 10 و 7 ساله بودند. سندبرگ بعداً دوباره با تام برنتال که در سال 2022 با او ازدواج کرد، عشق پیدا کرد. در طول پادکست، سندبرگ تعریف کرد که چگونه در سفر اخیرش به دماغه امید خوب در آفریقای جنوبی، متوجه شد که گلدبرگ غمگین شده است، زیرا آنها یکی از عکس های ماه عسل مورد علاقه او را در آنجا گرفته بودند. پسر 21 ساله او که یک بار به او گفته بود دوباره ازدواج نکند، از او خواست که عکس مشابهی با برنتال بگیرد و گفت که گلدبرگ خوشحال بود که او را پیدا کرده بود. «این یکی از مهمترین لحظات زندگی من بود و همین اتفاق افتاد. سندبرگ به مجری برنامه اندرسون کوپر گفت و من می‌خواهم افراد بیشتری که همسرشان را از دست داده‌اند، آن را با فرزندان خود داشته باشند. سندبرگ گفت که او اغلب به بیوه‌ها و بیوه‌ها دو چیز می‌گوید: اینکه اوضاع بهتر خواهد شد و اینکه اگر بخواهند می‌توانند عشق را دوباره پیدا کنند. هیچ کس"}, {"source": "Business Insider", "title": "Tata says its workforce strategy won't be affected by PERM suspensions and is hiring 15,000 more workers", "link": "https://www.businessinsider.com/tcs-tata-workforce-strategy-not-affected-perm-application-foreign-workers-2026-10", "summary": "TCS says the new restriction won t affect its hiring plans in the US. Indranil Aditya/Bloomberg/Getty Images Tata Consultancy Services says it will still hire 15,000 in the US, despite the PERM freeze. It said it submitted only a single-digit number of PERM applications over the past two years. TCS was among eight tech companies on the list, including Microsoft, Adobe, and Infosys. Indian tech giant Tata Consultancy Services said the Trump administration’s new restrictions on employment-based green card filings will not affect its hiring plans in the US. In a stock exchange filing on Friday, TCS said that it had submitted only a single-digit number of applications through the Permanent Labor Certification, or PERM, process over the past two years. The certification is usually the first required step for an employer seeking to sponsor a foreign worker for permanent US residency. \"Our workforce strategy in the US is anchored in hiring local talent, supported by a robust campus recruitment model,\" the company wrote. \"As we had announced earlier, we intend to hire an additional 15,000 people in the US over the next five years, to further augment our local workforce.\" TCS's statement comes after the Trump administration said it was freezing PERM applications involving TCS, Microsoft, Adobe, Infosys, Wipro, HCLTech, Cognizant, and Capgemini. The move is part of the administration’s wider push to scrutinize companies’ use of skilled-worker immigration programs . The companies are among the largest users of PERM and other employment-based immigration pathways in the US. On Thursday, Vice President JD Vance singled out Microsoft while announcing the action, accusing the company of laying off American workers and replacing them with lower-paid foreign labor. \"If you do the math, for every worker that Microsoft laid off, they replaced that worker with one and a half foreign indentured servants,\" Vance said. Microsoft disputed that framing, saying most of its H-1B filings were for employees already working at the company. \"Of the approximately 6,000 H-1B visa applications we submitted in the last fiscal year, 80% percent were to extend or change the status of existing Microsoft employees. These were not to hire new people,\" the company wrote. TCS is one of India's largest tech consulting companies and one of the world's biggest technology outsourcing firms. It helps clients across banking, retail, healthcare run cloud computing, cybersecurity and AI projects . In a pr", "date_str": "2026-10-09T07:04:53+00:00", "hash": "b4909897d86d66a4", "title_fa": "تاتا می گوید استراتژی نیروی کارش تحت تأثیر تعلیق PERM قرار نخواهد گرفت و 15000 کارگر دیگر استخدام می کند.", "summary_fa": "TCS می گوید محدودیت جدید بر برنامه های استخدام آن در ایالات متحده تأثیر نخواهد گذاشت. Indranil Aditya/Bloomberg/Getty Images خدمات مشاوره تاتا می گوید علیرغم توقف PERM، همچنان 15000 نفر را در ایالات متحده استخدام خواهد کرد. این سازمان گفت که در دو سال گذشته تنها تعداد تک رقمی درخواست های PERM را ارسال کرده است. TCS یکی از هشت شرکت فناوری در این لیست بود، از جمله مایکروسافت، Adobe و Infosys. شرکت خدمات مشاوره ای تاتا، غول فناوری هند، اعلام کرد که محدودیت های جدید دولت ترامپ در زمینه ثبت کارت سبز مبتنی بر اشتغال، بر برنامه های استخدام آن در ایالات متحده تأثیری نخواهد داشت. در تشکیل پرونده بورس اوراق بهادار در روز جمعه، TCS گفت که طی دو سال گذشته تنها تعداد تک رقمی درخواست را از طریق فرآیند گواهی کار دائم یا PERM ارسال کرده است. صدور گواهینامه معمولاً اولین مرحله مورد نیاز برای کارفرمایی است که به دنبال حمایت مالی از یک کارگر خارجی برای اقامت دائم ایالات متحده است. این شرکت نوشت: «استراتژی نیروی کار ما در ایالات متحده مبتنی بر استخدام استعدادهای محلی است که توسط یک مدل قوی استخدام در محوطه دانشگاه پشتیبانی می‌شود. همانطور که قبلاً اعلام کرده بودیم، قصد داریم طی پنج سال آینده 15000 نفر دیگر را در ایالات متحده استخدام کنیم تا نیروی کار محلی خود را بیشتر کنیم. بیانیه TCS پس از آن منتشر شد که دولت ترامپ اعلام کرد برنامه های PERM شامل TCS، Microsoft، Adobe، Infosys، Wipro، HCLTech، Cognizant و Capgemini را مسدود می کند. این اقدام بخشی از فشار گسترده‌تر دولت برای بررسی دقیق استفاده شرکت‌ها از برنامه‌های مهاجرت کارگران ماهر است. این شرکت ها از بزرگترین کاربران PERM و سایر مسیرهای مهاجرت مبتنی بر اشتغال در ایالات متحده هستند. روز پنجشنبه، معاون رئیس جمهور جی. ونس گفت: «اگر حساب کنید، به ازای هر"}, {"source": "Business Insider", "title": "What smart people are saying about the US suspending new PERM applications for Microsoft, Adobe, and Indian tech giants", "link": "https://www.businessinsider.com/smart-people-perm-program-suspended-microsoft-adobe-indian-tech-h1b-2026-10", "summary": "The move has renewed debate over whether stricter skilled-immigration policies protect American workers or hurt American businesses. Alex Wroblewski / AFP via Getty Images The Trump administration suspended Microsoft, Adobe, and others from the PERM program. VP JD Vance said Microsoft abused the PERM program more than any other company. Here’s what immigration and tech experts are saying: For foreign workers at some of the biggest employers in tech, there's another twist in an already uncertain system. The Trump administration’s decision to suspend Microsoft, Adobe, and other named tech companies from the Permanent Labor Certification, or PERM, program has renewed debate over whether stricter skilled-immigration policies protect American workers or hurt American businesses. On Thursday morning, Vice President JD Vance announced the suspension at a press conference. He singled out Microsoft , saying: \"If you do the math, for every worker that Microsoft laid off, they replaced that worker with one and a half foreign indentured servants.\" PERM is not a visa. It is the Labor Department certification employers generally need before sponsoring a worker for an employment-based green card. Vance said that some companies had abused the system and used foreign workers to undercut Americans. In a statement on Thursday, Microsoft disputed Vance's accusations, saying most of its H-1B filings were for existing employees rather than new hires. \"Of the approximately 6,000 H-1B visa applications we submitted in the last fiscal year, 80% percent were to extend or change the status of existing Microsoft employees. These were not to hire new people,\" the company wrote. The action also affects six major IT services companies with deep ties to India’s tech sector: Tata Consultancy Services, Infosys, Wipro, HCLTech, Cognizant, and Capgemini. Here’s what immigration-policy experts and Indian tech voices are saying: Hector Chichoni, partner at Greenspoon Marder \"Technology companies depend heavily on the 'H-1B-to-green-card' pipeline to retain specialized foreign talent,\" Hector Chichoni, a partner at the business law firm Greenspoon Marder, told Business Insider. \"With the PERM process effectively frozen, affected companies cannot move employees forward toward permanent residence , making them vulnerable to the loss of critical talent, either to employers not subject to the suspension or through employees returning to their home countries,\" he added. Chichoni said the affected IT", "date_str": "2026-10-09T06:41:41+00:00", "hash": "6ab67a8bf89663a3", "title_fa": "آنچه افراد باهوش در مورد تعلیق برنامه های جدید PERM برای مایکروسافت، ادوبی و غول های فناوری هند توسط ایالات متحده می گویند", "summary_fa": "این اقدام بحث‌ها را در مورد اینکه آیا سیاست‌های سخت‌گیرانه‌تر مهاجرتی از کارگران آمریکایی محافظت می‌کند یا به کسب‌وکارهای آمریکایی آسیب می‌زند، تجدید شده است. الکس وربلوسکی / خبرگزاری فرانسه از طریق گتی ایماژ دولت ترامپ مایکروسافت، ادوبی و سایرین را از برنامه PERM تعلیق کرد. معاون JD Vance گفت که مایکروسافت بیش از هر شرکت دیگری از برنامه PERM سوء استفاده کرده است. این چیزی است که کارشناسان مهاجرت و فناوری می گویند: برای کارگران خارجی در برخی از بزرگترین کارفرمایان در زمینه فناوری، یک چرخش دیگر در یک سیستم از قبل نامطمئن وجود دارد. تصمیم دولت ترامپ برای تعلیق مایکروسافت، ادوبی و سایر شرکت‌های فناوری نام‌برده از برنامه گواهینامه کار دائم یا PERM، بحث‌ها را در مورد اینکه آیا سیاست‌های سخت‌گیرانه‌تر در زمینه مهاجرت از کارگران آمریکایی محافظت می‌کند یا به کسب‌وکارهای آمریکایی آسیب می‌زند، تجدید شده است. صبح روز پنجشنبه، معاون رئیس جمهور جی دی ونس در یک کنفرانس مطبوعاتی این تعلیق را اعلام کرد. او به مایکروسافت اشاره کرد و گفت: \"اگر حساب کنید، به ازای هر کارگری که مایکروسافت اخراج می کند، آنها یک و نیم کارمند خارجی را جایگزین آن می کنند.\" PERM ویزا نیست. این گواهینامه وزارت کار است که کارفرمایان معمولاً قبل از حمایت از یک کارگر برای کارت سبز مبتنی بر اشتغال به آن نیاز دارند. ونس گفت که برخی از شرکت ها از این سیستم سوء استفاده کرده و از کارگران خارجی برای تضعیف آمریکایی ها استفاده کرده اند. مایکروسافت در بیانیه‌ای در روز پنجشنبه اتهامات ونس را رد کرد و گفت که بیشتر پرونده‌های H-1B آن برای کارمندان فعلی بود تا استخدام‌های جدید. این شرکت نوشت: \"از حدود 6000 درخواست ویزای H-1B که در سال مالی گذشته ارائه کردیم، 80 درصد برای تمدید یا تغییر وضعیت کارمندان فعلی مایکروسافت بود. اینها برای استخدام افراد جدید نبود.\" این اقدام همچنین"}, {"source": "Business Insider", "title": "Ray Dalio says the stock market's margin for error is shrinking", "link": "https://www.businessinsider.com/ray-dalio-bond-market-yields-interest-rates-stocks-ai-trade-2026-10", "summary": "Ray Dalio said the AI investment boom is intensifying competition for capital alongside heavy government borrowing. Jemal Countess/Getty Images/Time Ray Dalio says strong earnings have shielded stocks from surging interest rates. That cushion is shrinking as bond yields climb, leaving less room for error. The AI boom is intensifying the fight for capital, Dalio says. The stock market has been able to shrug off surging interest rates thanks to strong corporate earnings, but its margin for error is shrinking, according to billionaire investor Ray Dalio. \"When we started this cycle, the expected returns of equities were much higher than the expected returns of bonds,\" the Bridgewater Associates founder told CNBC on Thursday. \"Because of that change in pricing, that cushion has come down,\" he added. The benchmark 10-year Treasury yield hit 5.36% this week, its highest level since 2002, as investors grappled with persistent inflation, heavy government borrowing, and expectations that the Federal Reserve will keep interest rates higher for longer. Yet US stocks have remained resilient. The S P 500 is up more than 13% this year despite pulling back from a recent record high, with enthusiasm over artificial intelligence and robust corporate earnings powering much of the rally. Higher bond yields make fixed-income investments more attractive relative to equities, leaving stocks with less room to absorb further increases in borrowing costs. However, strong earnings growth has been enough to offset the drag from higher interest rates for now. \"We're in the part of the cycle where interest rates can rise without sending the equity market down because there's enough earnings growth and there's enough expected return,\" Dalio said. \"But when that cushion comes down, then you're coming later into that cycle.\" The AI buildout is adding to the competition for capital. The enormous capital required to build AI infrastructure is increasing competition for investors' money at the same time that governments are issuing large amounts of debt, adding to upward pressure on financing costs. Despite the growing demand for capital, Dalio said financial conditions have not yet tightened enough to meaningfully constrain access to capital. He pointed to relatively narrow corporate credit spreads — the extra yield investors demand to hold corporate debt over US Treasurys — as evidence that investors are still willing to finance companies at relatively low premiums. \"We know that we haven", "date_str": "2026-10-09T05:29:52+00:00", "hash": "1e987c18f18d92fa", "title_fa": "ری دالیو می گوید حاشیه خطای بازار سهام در حال کاهش است", "summary_fa": "ری دالیو گفت رونق سرمایه گذاری در هوش مصنوعی رقابت برای سرمایه در کنار استقراض سنگین دولت را تشدید می کند. جمال کنتس/ گتی ایماژ/ تایم ری دالیو می گوید درآمدهای قوی سهام را از افزایش نرخ بهره محافظت کرده است. این بالشتک با بالا رفتن بازده اوراق قرضه در حال کوچک شدن است و فضای کمتری برای خطا باقی می گذارد. دالیو می گوید که رونق هوش مصنوعی مبارزه برای سرمایه را تشدید می کند. به گفته ری دالیو، سرمایه گذار میلیاردر، بازار سهام به لطف درآمدهای قوی شرکت ها توانسته است از افزایش نرخ های بهره شانه خالی کند، اما حاشیه خطای آن در حال کاهش است. بنیانگذار Bridgewater Associates روز پنجشنبه به CNBC گفت: «زمانی که ما این چرخه را شروع کردیم، بازده مورد انتظار سهام بسیار بالاتر از بازده مورد انتظار اوراق بود. وی افزود: «به دلیل آن تغییر در قیمت گذاری، این بالشتک پایین آمده است. بازدهی شاخص 10 ساله خزانه داری این هفته به 5.36 درصد رسید که بالاترین سطح از سال 2002 است، زیرا سرمایه گذاران با تورم مداوم، استقراض سنگین دولت و انتظارات فدرال رزرو برای مدت طولانی تری نرخ بهره را بالاتر نگه دارد. با این حال، سهام ایالات متحده انعطاف پذیر باقی مانده است. S P 500 امسال با وجود عقب نشینی از رکورد اخیر، بیش از 13 درصد رشد داشته است، با اشتیاق نسبت به هوش مصنوعی و درآمدهای شرکتی قوی که بخش اعظم این رالی را تقویت کرده است. بازده اوراق قرضه بالاتر، سرمایه‌گذاری‌های با درآمد ثابت را نسبت به سهام جذاب‌تر می‌کند و باعث می‌شود سهام فضای کمتری برای جذب افزایش بیشتر هزینه‌های استقراض داشته باشد. با ovide direct-to-device connectivity. The FCC also waived a rule that requires a leasing arrangement with one or more terrestrial wireless carriers, allowing SpaceX to use its own spectrum for the service. And SpaceX announced on Thursday that it will acquire a slice of low-frequency cellular spectrum that could help Starlink's signal operate better indoors, not just under open skies. Musk called Thursday's announcement a \"very big deal\" in a post on X. The move brings Starlink closer to becoming more than just a mobile service for remote areas or emergency situations — and toward becoming a serious mobile carrier rival. \"This prime low-band spectrum addresses one of the key remaining technical gaps that will pave the way for Starlink Mobile to become a major mobile carrier in the US,\" SpaceX said. Stocks for T-Mobile, AT T, and Verizon were all hit after trading hours following the SpaceX announcement. T-Mobile's stock fell more than 11%, while Verizon and AT T's stock fell by about 6.6%. SpaceX has faced skepticism in the past from the carriers it hopes to take on. \"We've seen no zero discernible impact on our broadband growth from any LEO, low earth orbit satellite provider, including Starlink,\" Verizon CEO Dan Schulman said at a Goldman Sachs conference last month. Schulman added that he does not view satellite as a \"viable competitor in the medium and even longer term.\" SpaceX would also need other critical ingredients to build a reliable urban cellular network, including ground infrastructure like cell sites and fiber connections. Read the original article on Business Insider", "date_str": "2026-10-08T22:55:01+00:00", "hash": "7d6e5d29f3ccbb78", "title_fa": "Starlink شرکت SpaceX اکنون به رقیب اصلی اپراتور تلفن همراه تبدیل شده است", "summary_fa": "FCC برنده SpaceX ایلان ماسک شد. سباستین گولنو/تصویر اتحاد از طریق Getty Images در اوایل این هفته، FCC طرح SpaceX را برای استقرار 15000 ماهواره Starlink برای سرویس مستقیم به دستگاه تایید کرد. آژانس فدرال همچنین ations such as ours, executed and communicated so abruptly, are chilling the open culture OpenAI has prized in the", "date_str": "2026-10-08T22:38:56+00:00", "hash": "05d58b06924f5ea9", "title_fa": "3 محقق اخراج شده OpenAI نامه ای منتشر کردند مبنی بر اینکه تبرئه آنها اثرات \"سرد کننده\" بر فرهنگ شرکت خواهد گذاشت", "summary_fa": "OpenAI هفته گذشته سه کارمند خود را پس از اینکه شرکت گفت تحقیقات داخلی نشان داد که آنها اطلاعات حساس را به درستی مدیریت نکرده اند، اخراج کرد. دیوید پل موریس/ بلومبرگ از طریق گتی ایماژ سه محقق سابق ایمنی OpenAI گفتند که هفته گذشته به طور ناگهانی از شرکت اخراج شدند. هر یک از کارمندان در X گفت که فقط دلایل شفاهی برای اخراج به آنها ارائه شده است. کارمندان گفتند که اخراج آنها تأثیر \"سرد کننده\" بر \"فرهنگ باز\" OpenAI خواهد داشت. سه محقق سابق OpenAI روز پنجشنبه نامه‌ای منتشر کردند که می‌گویند هفته گذشته ناگهان اخراج شدند و این اقدام تأثیری «خطرناک» بر فرهنگ شرکت خواهد داشت. در نامه‌ای با عنوان «OpenAI به تنهایی نمی‌تواند هوش مصنوعی را ایمن کند»، این سه نفر نوشتند که OpenAI «یک شرکت عادی نیست» و همکاری با اشخاص ثالث برای رسیدگی به خطرات ایمنی با «آزادی انجام این کار بدون ترس» جزء کلیدی کار در آنجا است. این نامه که خطاب به کمیته های ایمنی OpenAI بود، توسط میکیتا بالسنی، یکی از کارمندان اخراج شده که روی همسویی هوش مصنوعی کار می کرد، در رسانه های اجتماعی به اشتراک گذاشته شد. Tomek Korbak و Jasmine Wang که هر دو در زمینه ایمنی کار می کردند نیز اخراج شدند و نامه را امضا کردند. سخنگوی OpenAI در بیانیه‌ای به Business Insider گفت که تحقیقات داخلی نشان می‌دهد که این سه کارمند خط‌مشی‌های شرکت در مورد دسترسی و مدیریت اطلاعات حساس را نقض کرده‌اند. این کارمندان در حساب های شخصی خود در رسانه های اجتماعی نوشتند که فقط توضیحات شفاهی برای اخراج خود دریافت کرده اند و همه آنها در محدوده شغلی خود عمل کرده اند. وانگ در X نوشت: «دلایلی که برای فسخ به ما ارائه شد، به سادگی جمع نمی‌شوند. بالسنی در پستی نوشت که به او گفته شده است که"}, {"source": "Business Insider", "title": "Best cat toys", "link": "https://www.businessinsider.com/guides/pets/best-cat-toy", "summary": "W o drama producers, including ReelShort , Flareflow, and ShortMax, have uploaded clips as long as 20 minutes to Meta's ad hub. So Meta gets the best of both worlds: Micro drama producers give them money and they give Meta engaging videos that keep their audiences on Meta's properties. Meta declined to comment. GammaTime, a year-old micro drama company, spends some 55% of its marketing budget on Meta, said cofounder Slava Mudryk. Very long ads are part of the mix when GammaTime launches a series or has a series with a particularly strong story arc within the series, he said. Mudrykh said these long ads give Meta an advantage over TikTok and YouTube , which don't offer them. \"We always use it with launches,\" he said. \"What we see is that this long sequence just brings people in to watch. And when it's done, the desire to continue watching on the app is strong.\" You'd expect that Ti", "date_str": "2026-10-08T21:23:22+00:00", "hash": "e7a7152808602e24", "title_fa": "چرا متا در جنگ های درام خرد پیروز می شود؟", "summary_fa": "متای مارک زاکربرگ با جمع آوری دلارهای تبلیغاتی و محتوای رایگان به طور همزمان به سود بزرگی از رونق درام خرد تبدیل شده است. فین گومز/ گتی ایماژ درام های کوچک در چین بسیار بزرگ هستند و در ایالات متحده و سایر نقاط جهان در حال رشد هستند. مینی شوها شروع به تبدیل شدن به پول تبلیغات واقعی برای متا کرده اند که درام های خرد پلتفرم به آن بستگی دارد. تبلیغات همچنین رایگان و محتوای بسیار جذاب برای مارک زاکربرگ و شرکت است. برخی از تبلیغات تا 20 دقیقه اجرا می شوند. درام های خرد در خارج از ایالات متحده در حال رونق هستند. آنها شروع به دیدن کشش در ایالت‌ها نیز کرده‌اند، با بسیاری از استارت‌آپ‌ها که سعی می‌کنند مصرف‌کنندگان آمریکایی را متقاعد کنند که چند دلار برای تماشای داستان‌های صابونی روی تلفن‌هایشان بپردازند. اما در حال حاضر، یک برنده آشکار در صنعت درام خرد ایالات متحده وجود دارد: مارک زاکربرگ. بازیگران صنعت به ما می‌گویند که متای زاکربرگ محبوب‌ترین مکان برای تولیدکنندگان درام خرد است که محصولاتشان را به بازار عرضه می‌کنند. برخی تخمین می‌زنند که استارت‌آپ‌ها تا cades, Satya Nadella has been a key figure in the transformation of Microsoft — revolutionizing the company and empowering businesses, students, and consumers from all over the world with some of the most capable software ever built or ever even conceived,\" Trump said at the event, before the two posed for a photo op. Nadella, for his part, thanked Trump for the \"incredible honor\" in an X post , which didn't mention Vance's accusations. A Microsoft blog post shared by a spokesperson to Business Insider said 80% of the company's roughly 6,000 H-1B visa applications were for existing employees, not new hires. \"Microsoft only files H-1B petitions for those who meet the rigorous standards of this visa category,\" the company wrote. It also said the \"vast majority of Microsoft employees in the United States are Americans.\" Thursday's awkwardness was the latest example of Trump putting business leaders in tricky situations as he takes a far more active role in business dealings than his presidential predecessors. Trump has used his executive influence to encourage business leaders to back a variety of his initiatives, like his Trump Account savings program for American childre", "date_str": "2026-10-08T20:58:18+00:00", "hash": "c55e139ca0cfe6cb", "title_fa": "ساتیا نادلا روز بدی در کاخ سفید داشت", "summary_fa": "ساتیا نادلا و دونالد ترامپ همه ... لبخند بودند؟ برنده McNamee/Getty Images این روز پنجشنبه برای مایکروسافت یک ترن هوایی بود. جی دی ونس در یک کنفرانس مطبوعاتی در مورد سرکوب ویزا از مایکروسافت خواست. ساعاتی بعد، ترامپ از ساتیا نادلا، مدیر عامل شرکت، به عنوان «شخصیت کلیدی» تقدیر کرد. ساتیا نادلا، مدیرعامل مایکروسافت روز عجیبی را پشت سر گذاشت. صبح پنجشنبه، معاون رئیس جمهور JD Vance میزبان یک کنفرانس مطبوعاتی بود تا اعلام کند که ایالات متحده یک برنامه عمده ویزا برای کارگران مایکروسافت را تعلیق می کند. اگرچه چندین شرکت فناوری هدف قرار گرفتند، ونس مایکروسافت را به نام خواند و مدعی شد که «هیچ شرکتی در ایالات متحده» بدتر از برنامه صدور گواهینامه کار دائمی (PERM) سوء m sure is already.\" Instead, Jeremy Strong was cast as the adult version of Facebook's founder. As he did while playing Kendall Roy in HBO's billionaire-family drama \"Succession,\" Strong went method for the role, according to Sorkin. \"Jeremy does a lot of his own work,\" Sorkin told NYT's \"The Interview.\" \"I told all the other actors in his scenes: 'Guys, he's not going to be hanging out with you at craft service. He's not going to be yucking it up with you between takes. He's probably not going to speak to you at all.\" \"He is going to treat you the way he imagines Mark treats the people around him.' And that's what happened,\" he continued. \"You cannot argue with the results.\" Mikey Madison plays Frances Haugen, also known as the Facebook whistleblower. Mikey Madison plays Frances Haugen in The Social Reckoning. Sony; Tom Williams/CQ-Roll Call, Inc via Getty Images Frances Haugen is a data scientist and former product manager on Facebook's civic misinformation team, al", "date_str": "2026-10-08T20:30:01+00:00", "hash": "f55ade5b2eaf7910", "title_fa": "مقایسه بازیگران «The Social Reckoning» با افرادی که در زندگی واقعی بازی می کنند", "summary_fa": "جرمی آلن وایت، مایکی مدیسون و آرون سورکین در اولین نمایش The Social Reckoning در پاریس شرکت کردند. Yaro Roland/Getty Images فیلم جدید آرون سورکین \"The Social Reckoning\" درباره رسوایی افشاگران فیس بوک در سال 2021 است. جرمی استرانگ در نقش مارک زاکربرگ در مقابل مایکی مدیسون در نقش افشاگر فرانسیس هاگن بازی می کند. جرمی آلن وایت نقش جف هورویتز، خبرنگار وال استریت ژورنال را بازی می کند. در فیلم «حساب اجتماعی» آرون سورکین، جرمی استرانگ نقش مارک زاکربرگ را در جریان رسوایی افشاگران فیسبوک در سال 2021 نشان می‌دهد. این فیلم جدید که در تاریخ 9 اکتبر اکران می‌شود، دنباله‌ای است که انتظار زیادی برای فیلم «شبکه اجتماعی» در سال 2010 وجود داشت. همچنین مایکی مدیسون در نقش افشاگر فرانسیس هاگن و جرمی آلن وایت در نقش گزارشگر فناوری برنده جوایز جف هورویتز بازی می‌کنند. در اینجا نحوه مقایسه بازیگران با افراد واقعی زندگی آنها در \"The Social Reckoning\" آمده است. جرمی استرانگ نقش مارک زاکربرگ، بنیانگذار فیس بوک و مدیر عامل متا را بازی می کند. جرمی استرانگ در فیلم The Social Reckoning نقش مارک زاکربرگ را بازی می کند. سونی؛ دیوید پل موریس/ بلومبرگ از طریق گتی ایماژ جسی آیزنبرگ، بازیگر نقش زاکربرگ در «شبکه اجتماعی» به ورایتی گفت که از او خواسته شده بود که این نقش را برای «حساب اجتماعی» بازی کند، اما نپذیرفت. آیزنبرگ درباره سورکین که نویسندگی و کارگردانی فیلم جدید را برعهده داشت، گفت: «فقط به او گفتم که در مسیرهای مختلف زندگی ام حرکت می کنم. من نمی‌خواهم با آن شخصیت همراه شوم، اما همه دلایل من برای عدم تمایل به بازی کردن هیچ ارتباطی با فوق‌العاده بودن فیلم ندارد و خواهد بود، و مطمئنم همینطور است.» در عوض، جرمی استرانگ به عنوان نسخه بزرگسال بنیانگذار فیس بوک انتخاب شد. به گفته سورکین، استرانگ همانند زمانی که در نقش کندال"}, {"source": "Business Insider", "title": "Vance says the US is suspending permanent visa residency program for Microsoft", "link": "https://www.businessinsider.com/vance-us-suspending-permanent-visa-residency-program-microsoft-adobe-2026-10", "summary": "Vance announced the visa changes at a press conference Thursday. Alex Wong/Getty Images The Trump administration says it's suspending Microsoft and Adobe from a federal program used to sponsor foreign workers. JD Vance accused Microsoft of abusing the Permanent Labor Certification Program, or PERM. “If you do the math, for every worker that Microsoft laid off, they replaced that worker with one and a half foreign indentured servants,” the VP said. The Trump administration is suspending Microsoft and Adobe from a federal program that companies use to sponsor foreign workers for permanent residency, Vice President JD Vance and Secretary of Labor Keith Sonderling said Thursday during a press conference. Vance accused Microsoft of abusing the Permanent Labor Certification Program, or PERM. The program is an initial step that employers generally must complete before sponsoring a worker for an employment-based green card, requiring them to show that no qualified and available US workers could fill the role. “If you do the math, for every worker that Microsoft laid off, they replaced that worker with one and a half foreign indentured servants,” Vance said. Microsoft filed more certified PERM applications than any other employer in the first three quarters of this fiscal year, with 1504, according to a Business Insider analysis, and an additional 174 were filed for subsidiaries LinkedIn and Activision. Adobe filed 168 in the same time period. The announcement came just over a week after Microsoft CEO Satya Nadella sat two seats away from Vance at President Donald Trump's White House \"Super Intelligence\" luncheon, a gathering of tech executives focused on AI. A Microsoft spokesperson pointed Business Insider to a blog post the company published Thursday, which said “the vast majority of Microsoft employees in the United States are Americans.” Microsoft wrote that roughly 80% of the about 6,000 H-1B visa applications it filed in the last fiscal year were to extend or change the status of existing employees, rather than to hire new people. It said the remaining applications were for people already legally in the US and amounted to 1% of its US workforce. Adobe did not respond to Business Insider's request for comment. Labor Secretary Keith Sonderling said the administration was also suspending Cognizant, Infosys, Tata, Wipro, HCL Technologies, and Capgemini from the program. The IT companies are among the largest users of PERM and other employment-based immigration p", "date_str": "2026-10-08T20:23:37+00:00", "hash": "b3b88deee0268e74", "title_fa": "ونس می گوید که ایالات متحده برنامه اقامت دائم مایکروسافت را به حالت تعلیق درآورده است", "summary_fa": "ونس تغییرات ویزا را روز پنجشنبه در یک کنفرانس مطبوعاتی اعلام کرد. الکس وانگ/ گتی ایماژ دولت ترامپ می گوید مایکروسافت و ادوبی را از یک برنامه فدرال که برای حمایت مالی از کارگران خارجی استفاده می شود، تعلیق می کند. جی دی ونس مایکروسافت را به سوء استفاده از date_str": "2026-10-08T20:16:45+00:00", "hash": "6ab47dd590d6fe35", "title_fa": "بهترین پیشنهادات مانیتور Prime Day برای کار و بازی: در Samsung، Asus، LG و موارد دیگر صرفه جویی کنید", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Amazon/Business Insider فروش ماه اکتبر آمازون به پایان رسیده است، اما هنوز برای خرید باقیمانده معاملات Prime Day دیر نیست. کسانی که در بازار یک مانیتور جدید هستند، می‌توانند از تخفیف‌های قابل توجهی برای مدل‌هایی که برای بازی، کار، سرگرمی و هر چیز دیگری طراحی شده‌اند، بهره ببرند. من بهترین معاملات مانیتورهای Prime Day را در طول فروش دنبال کرده ام و این خلاصه را با تخفیف هایی به روز کرده ام که هنوز از طرف ال جی، سامسونگ و ایسوس وجود دارد. من همچنین سهام و قیمت را بررسی کرده ام تا مطمئن شوم هیچ یک از توصیه های من منقضی نشده یا فروخته نشده است. کسانی که بودجه کمتری دارند هنوز هم می توانند این مانیتور 22 اینچی 1080p سامسونگ را با تنها 70 دلار خریداری کنند. صفحه نمایش تقریباً به همان اندازه یک مانیتور سطح ابتدایی است، اما اگر فقط یک مانیتور ارزان قیمت برای کارهای روزمره می خواهید، شکست دادن آن با این قیمت دشوار است. گیمرهایی که به عملکرد بالاتر نیاز دارند نیز می توانند مدل های توانمندی را در فروش پیدا کنند. من بیش از یک دهه است که محصولات فناوری را آزمایش می‌کنم، و از اولین فروش در سال 2015، همه رویدادهای Prime Day را پوشش داده‌ام. تمام این تجربه به من کمک می‌کند تا در معاملات خوب Prime Day شرکت کنم و در عین حال مواردی را که باید نادیده می‌گیرید حذف کنم. و اگر به دنبال معاملات بیشتر در سایر دسته‌بندی‌های محصولات هستید، همه پوشش روز Amazon Prime ما را بررسی کنید. 3 بهترین پیشنهاد برای مانیتور Prime Day مانیتور 22 اینچی سامسونگ S30GD 1080p - 110 دلار 70 دلار سامسونگ 34 اینچ ViewFinity S5 - 350 دلار 260 دلار در Amazon"}, {"source": "Business Insider", "title": "Stocks tumble as oil prices jump and bond yields touch 24-year highs", "link": "https://www.businessinsider.com/stock-market-bond-yields-oil-prices-iran-war-trump-spcx-2026-10", "summary": "CHARLY TRIBALLEAU / AFP via Getty Images Stocks were under pressure on Thursday as oil and yields spiked. The 10-year Treasury yield jumped after easing slightly on Wednesday, hitting a 24-year high. Oil, meanwhile, surged on new fears about US-Iran war escalation. Stocks pulled back further from recent all-time highs on Thursday as traders watched oil prices spike and key bond yields resume their march to their highest levels in nearly a quarter century. The records logged earlier in the week didn't last long, with stock losses mounting for a second day on Thursday following fresh highs in Tuesday's session. The premarket declines pared as trading got underway, with the Dow earlier pointing lower by more than 500 points, though it ultimately turned around, closing out the day in the green. Here's where major indexes stood at the 4 p.m. ET closing bell: S P 500 : 7,765.36, down 0.47% Dow Jones Industrial Average : 51,231.64, up 0.1% (+51.77 points) Nasdaq 100 : 30,725.81, down 1.39% Oil and bond yields were the familiar culprits hitting equities in Thursday trading. Brent crude jumped 5% to $105 per barrel on concerns about new large-scale attacks on Iran in the coming weeks. Reports said that Donald Trump and his advisors have been drawing up plans for major strikes ahead of the midterm elections in November. Trump also told attendees at a rally on Wednesday that a deal \"isn't really something that I want to do.\" However, Trump said later in the day in a post on Truth Social that the US wouldn't attack Iran before the election. Meanwhile, renewed selling in Treasurys drove yields higher again during the session, though they pulled back after touching new 24-year highs. The 10-year Treasury yield ended the day about 5 basis points lower at 5.22% after surging as high as 5.35%, the highest level since 2022. Comments from a top Fed official were the catalyst for the latest yield spike. Fed Gov. Christopher Waller said during an event in Turkey that more hikes are likely needed to cool inflat u want to make $10,000.\" Wang previously encouraged users to use Muse to find such savings as part of his #musemoneychallenge, but asking Muse to make money is on a different level. Meta's goal, Wang said, is to continue to improve Muse's memory so it can help users tackle more complex tasks. \"The memory of the agents is not like that of a human,\" he said. \"Sometimes it can feel like it's like that, but it is really different. So that's one area where we're always trying to improve.\" Muse has proven to be a major hit for Wang's Superintelligence Labs team. A month after its release, Muse remains No. 1 among free apps on the Apple App Store, a crown that has often been held by OpenAI's ChatGPT. Wang said that Meta wanted to find a way to bring \"the magic\" that developers have seen when they used agents and make it more accessible to the masses. \"Most of the industry has been really focused on making them just better and better and better at coding,\" he said. \"But we really felt this was a big gap because most people in the world, they don't know how to code. They probably never even want to code.\" Part of Meta's focus for Muse will be figuring out how to make an agentic product sustainable. Wang noted that Meta is already offering subscription tiers. There's speculation around whether the company could also bring ads into the agentic service, perhaps similar to how Open", "date_str": "2026-10-08T19:59:54+00:00", "hash": "f76841e105e4baa4", "title_fa": "الکساندر وانگ می گوید انتظار نداشته باشید که Muse به شکلی جادویی شما را 10000 دلار کند", "summary_fa": "الکساندر وانگ، مدیر ارشد هوش مصنوعی متا گفت که این شرکت می خواهد به بهبود حافظه Muse ادامه دهد. بلومبرگ/گتی ایماژ، الکساندر وانگ، افسر ارشد هوش مصنوعی متا، می‌داند که مردم می‌خواهند Muse برای آنها پول درآورد. او گفت که به نظرش خنده دار است که چگونه مردم از عامل هوش مصنوعی متا می خواهند 10000 دلار به آنها بدهد. آیا تاکنون از عامل هوش مصنوعی متا استفاده کرده اید؟ نظر شما چیست؟ الکساندر وانگ، افسر ارشد هوش مصنوعی متا، می‌گوید که قصد دارد Muse را بهبود بخشد، اما اگر کاربران بخواهند عامل برای آنها درآمد کسب کند، باید کمی کار کنند. وانگ در خلال مصاحبه اخیر برای نمایش \"مکالمات عظیم\" آبرام به کلئو آبرام گفت: \"ما همیشه می خواهیم بفهمیم که چگونه عوامل را بهتر کنیم. و سپس می خواهیم آنها بتوانند به انجام کارهای پیچیده تر و بیشتر ادامه دهند.\" وانگ در حال تشریح پیام‌های ویروسی بود که برخی از کاربران به عامل محبوب هوش مصنوعی متا می‌دهند تا به آنها مقدار X پول بدهد. \"به نظر من این واقعا خنده دار است، اما افراد زیادی هستند که فقط از موز خود می پرسند: \"من از شما می خواهم 10000 دلار به من بدهید.\" و بدیهی است که همه نمی توانند فقط از موز خود بخواهند که 10000 دلار به آنها بدهد.\" او افزود: \"اگر می خواهید 10000 دلار به دست آورید، باید سهم خود را انجام دهید.\" وانگ قبلاً کاربران را تشویق می کرد که از Muse برای یافتن چنین پس اندازهایی به عنوان بخشی از چالش #musemoney خود استفاده کنند، اما درخواست از Muse برای کسب درآمد در سطح دیگری است. وانگ گفت، هدف متا این است که به بهبود حافظه Muse ادامه دهد تا بتواند به کاربران در انجام کارهای پیچیده‌تر کمک کند. او گفت: «حافظه ماموران شبیه یک انسان نیست. \"گاهی اوقات ممکن است"}, {"source": "Business Insider", "title": "13 books to read while you wait for the new seasons of 'Bridgerton'", "link": "https://www.businessinsider.com/books-like-bridgerton-julia-quinn", "summary": "New Bridgerton episodes are in the works. Zoe McConnell/Liam Daniel/Netflix \"Bridgerton\" has two new seasons in the works. One will focus on Francesca Bridgerton, while the other will show Violet and Edmund's love story. You can read some historical romance books while you wait for the seasons to come out on Netflix. It's a great time to be a \"Bridgerton\" fan. Season five of the beloved Netflix series is officially in production following the success of season four , which told Benedict Bridgerton's love story. Francesca Bridgerton Kilmartin will pick up the helm in season five . Two years after her husband died, she will try to make sense of her feelings for his cousin,
