cking week of Nov. 6-12, according to Luminate. Related Lil Baby Reunites With Chris Brown for Trap B-Leaning From the Back (Remix) : Listen Lil Baby s FRESH : All 17 Tracks Ranked Lil Baby Is Open to Stepping Out of the Box to Collab With Sabrina Carpenter: I Could Make It Work Plus, the set’s de facto title track, “Dead Fresh,” rises to No. 1 on the Hot Rap Songs chart for the first time, capping a 17-week journey to the penthouse. For FRESH , streaming activity powered nearly all the debut sum, with 55,000 units, representing 56.8 million official on-demand streams of the album’s songs. (Thanks to that figure, it opens at No. 1 on the Top Streaming Albums chart.) Four thousand units derived from traditional album sales, with a negligible number of activity from the final metric, track-equivalent albums. (One unit equals the following levels of consumption: one album sale, 10 individual tracks sold from an album, or 1,000 paid/subscription tier or 2,500 ad-supported tier official on-demand audio and video streams for a song on the album.) With FRESH , Lil Baby scores his fifth leader on Top R B/Hip-Hop Albums. He first reigned via 2020’s My Turn , which posted six weeks in the summit and was later named the chart’s top album of the first 25 years of the century, and followed with the one-week champ The Voice of the Heroes , a 2021 collaboration with Lil Durk, three weeks with 2022’s It’s Only Me and one week with 2025’s WHAM . Elsewhere, FRESH becomes the Atlanta rapper’s sixth No. 1 on Top Rap Albums — all five of the Top R B/Hip-Hop Albums No. 1s, plus 2025’s The Leaks — and arrives at No. 2 on the all-genre Billboard 200 . The triumph continues with the album’s single “Dead Fresh,” which ascends to No. 1 on Hot Rap Songs. The track marks Lil Baby’s fourth chart-topper, following three in 2022 that each ruled for one week: “Do We Have a Problem,” with Nicki Minaj, via his and Drake’s features on DJ Khaled’s “Stayin Alive” and his own “California Breeze.” “Dead Fresh” seemed nearly destined to come tantalizingly close to the summit, tracing to its No. 2 debut on the chart dated Aug. 1, and holding the rank for 14 non-consecutive weeks, all behind Drake’s “Janice STFU.” By toppling its main", "date_str": "2026-11-17T19:47:19+00:00", "hash": "bb5ab6c939c9edcd", "title_fa": "آلبوم «FRESH» از Lil Baby در رتبه اول جدول آلبوم‌های R&B/Hip-Hop برتر قرار دارد.", "summary_fa": "لیل بیبی پنجمین شماره 1 خود را در جدول آلبوم های برتر R B/Hip-Hop بیلبورد به دست می آورد، زیرا FRESH در صدر فهرست تاریخ 21 نوامبر عرضه می شود. این مجموعه که در Quality Control/Motown/Interscope Capitol منتشر شد، با 59000 واحد آلبوم معادل 6-2 دقیقه در ایالات متحده شروع می شود. Lil Baby مرتبط با کریس براون برای Trap B-Leaning From the Back (ریمیکس) : Lil Baby s Fresh گوش کنید: همه 17 آهنگ رتبه‌بندی شده لیل بیبی آماده است تا از جعبه خارج شود و با سابرینا کارپنتر همکاری کند: من می‌توانم آن را به کار ببرم، \"مجموعه این آهنگ، در واقع به‌عنوان یکی از آهنگ‌ها، کاملاً جدید است.\" نمودار آهنگ های رپ برای اولین بار، یک سفر 17 هفته ای به پنت هاوس را پوشش می دهد. برای FRESH، فعالیت استریم تقریباً تمام مجموع اولیه را با 55000 واحد، که نشان دهنده 56.8 میلیون استریم رسمی درخواستی از آهنگ‌های آلبوم است، تامین کرد. (به لطف این رقم، در جدول بهترین آلبوم های جریانی در رتبه اول قرار می گیرد.) چهار هزار واحد حاصل از فروش آلبوم های سنتی، با تعداد ناچیزی از فعالیت های متریک نهایی، آلبوم های معادل آهنگ. (یک واحد برابر است با سطوح مصرف زیر: فروش یک آلبوم، 10 قطعه منفرد فروخته شده از یک آلبوم، یا 1000 ردیف پولی/اشتراک یا 2500 پخش صوتی و تصویری رسمی طبق تقاضای تبلیغاتی برای یک آهنگ در آلبوم.) با FRESH، لیل بیبی پنجمین رهبر خود را در Top Rop RB/H به دست آورد. او ابتدا از طریق نوبت من در سال 2020 سلطنت کرد، آلبومی که شش هفته در اجلاس سران منتشر شد و بعداً به عنوان برترین آلبوم جدول در 25 سال اول قرن انتخاب شد، و سپس با قهرمان یک هفته‌ای The Voice of the Heroes، همکاری 2021 با لیل دورک، سه هفته با آلبوم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/lil-baby-2026-press-photo-kendall-bessent-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۳:۱۷"}, {"source": "Billboard", "title": "RM of BTS Made This Change to His Hair — Now He’s Trending on Social Media", "link": "https://www.billboard.com/music/music-news/bts-rm-changes-hair-trending-x-1236384178/", "summary": "RM of BTS just made the subtlest change to his hair, and ARMY thinks it s absolutely dynamite. Related BTS Plans to Add More ARIRANG Tour Dates Work on New Music Solo Projects in 2027 BTS ‘Swim’ Copyright Lawsuit Dropped by Accusers Just Months After They Sued Over Hit Song Inside the Business of Boy Bands — From One Direction to BTS The boy band s leader shared a carousel of photos on Instagram on Tuesday (Nov. 17), showing off his new look. Keeping the same dark auburn-ish color he had before, RM added fluffy waves to his tresses, possibly through a perm. Hello, he simply wrote in the caption of the post, which included snaps of him on an autumnal walk outdoors and a picture of him wearing his glasses while smiling alongside Korean artist Kim Yun Shin. The performer kept his comments turned off to the public, but over on X, ARMY immediately started freaking out over his distinguished new look. EVERYONE PACK IT UP NAMJOON PERMED HIS HAIR, one fan wrote excitedly, while another person gushed , NAMJOON S HAIR, I M NOT OKAY. Namjoon looks so cute with his fluffy hair, a third fan posted . MY HONEST REACTION WITH NAMJOON S NEW HAIRSTYLE, another person joked alongside a clip of V pretending to give Jin CPR chest compressions. The volume of reactions to his post made it so his real name, Namjoon, was trending on X in the first few hours after he shared it. RM s mild makeover came while on break from BTS ARIRANG World Tour supporting three-week Billboard 200 -topping album ARIRANG . After playing stadiums across the globe since April, the Bangtan Boys paused after their late-October concerts in Brazil. Now, RM, his new hairdo and bandmates Suga, Jin, Jimin, Jung Kook, j-hope and V are gearing up to head back out, with dates scheduled for Nov. 19, 21 and 22 at Kaohsiung National Stadium in Taiwan. BTS will stay on the road through late December before taking another break, after which the band will resume in 2027 with a series of shows in Indonesia, Australia, Hong Kong and the Philippines. And as recently revealed by HYBE the guys have even more tour dates in the works to extend the trek through the first half of next year.", "date_str": "2026-11-17T19:41:35+00:00", "hash": "50e327dc54b047d0", "title_fa": "RM از BTS این تغییر را در موهایش ایجاد کرد - اکنون او در رسانه های اجتماعی پرطرفدار است", "summary_fa": "RM از BTS فقط ظریف ترین تغییر را در موهای خود ایجاد کرد و ARMY فکر می کند که کاملاً دینامیت است. BTS مرتبط قصد دارد تاریخ‌های تور ARIRANG را اضافه کند. کار بر روی پروژه‌های جدید موسیقی انفرادی در سال ۲۰۲۷ BTS 'Swim' شکایت حق نسخه‌برداری BTS توسط متهمان تنها چند ماه پس از شکایت آنها به دلیل هیت آهنگ در کسب و کار گروه‌های پسر - از One Direction به BTS. رهبر گروه پسر یک چرخ و فلک جدید از عکس‌های خود را در اینستاگرام به اشتراک گذاشت. با حفظ همان رنگ مایل به قهوه ای تیره ای که قبلا داشت، RM امواج کرکی را به رگ های خود اضافه کرد، احتمالاً از طریق پرم. سلام، او به سادگی در توضیح پست نوشت، که شامل عکس هایی از او در حال پیاده روی پاییزی در فضای باز و تصویری از او در حالی که عینک خود را به چشم می زند در حالی که در کنار هنرمند کره ای کیم یون شین لبخند می زند، نوشته است. مجری نظرات خود را برای عموم خاموش نگه داشت، اما در X، ARMY بلافاصله از ظاهر متمایز جدید خود عصبانی شد. یکی از طرفداران با هیجان نوشت، در حالی که یک نفر دیگر فوران کرد، نامجون موهایش، من خوب نیستم. یکی از طرفداران سوم پست کرد نامجون با موهای کرکی اش خیلی بامزه به نظر می رسد. واکنش صادقانه من با مدل موی جدید نامجون، شخص دیگری در کنار یک کلیپ از V شوخی کرد و وانمود کرد که به جین CPR سینه می‌زند. حجم واکنش‌ها به پست او باعث شد که نام واقعی او، نامجون، در اولین ساعات پس از اشتراک‌گذاری آن، در X ترند شود. تغییر ملایم RM در زمان hone Keys Wallet” rises two spots to No. 9 (16.4 million, up 4%). Plus, Russell Dickerson reaches the top 10 (12-10; 15.6 million, up 9%) for the seventh time, with “Worth Your Wild.” Big Debuts Thomas Rhett scores his second-highest Country Airplay debut as “Be There in a Minute” opens at No. 19 (9.3 million). Only “What’s Your Country Song” (No. 18 in 2020), one of his 21 No. 1s, started higher. Meanwhile, U2 makes its Country Airplay debut as “Torn,” featuring Dolly Parton , launches at No. 28 (4.8 million), marking the late Parton’s highest ever entrance on the chart. With “Son of Jolene,” alongside Belles, likewise on the list at No. 56 (1.1 million), two Parton songs place simultaneously for the first time since 2006; “Torn” is also her first top 40 entry on the chart since then.", "date_str": "2026-11-17T19:36:32+00:00", "hash": "531a0ff3e0ba7900", "title_fa": "الا لنگلی با کری آندروود برای این رکورد در چارت پخش کانتری از تساوی خارج شد", "summary_fa": "بر اساس گزارش Luminate، «دوباره عشق به زندگی» اثر الا لنگلی در رتبه اول جدول کانتری بیلبورد قرار گرفت و در تاریخ 21 نوامبر با 33.8 میلیون تماشاگر از 6 تا 12 نوامبر در صدر قرار گرفت. آلبوم مرتبط «Choosin» تگزاس از الا لنگلی برای رکورد طولانی هفته بیست و هشتم در بالای ۱۰۰ هفته رکورددار است. در اینجا نحوه واکنش الا لنگلی به هفت نامزدی جایزه گرمی او به رهبری الا لنگلی، درخشش هنرمندان زن در دسته‌های کشور گرمی آخرین فریم‌ها در مجموع ۲۲ هفته از ایر تاپ کانتری پخش می‌شود. «Choosin’ Texas»، «Be Her» و دوئت مورگان والن «I Can t Love You Anymore» پیش از این رهبری کرده بودند - او را با کری آندروود (2006) بیش از همه توسط یک زن در یک سال شکسته بود. والن با 17 هفته در صدر در سال 2023 رکورددار است. او همچنین 16 در سال 2025 و 13 در سال 2022 ثبت کرد و لوک کامبز 13 در سال 2019 و 2021 ثبت کرد، در حالی که کنی چسنی در سال 2007 مجموعاً 12 هفته ثبت کرد. والن هفت. کامبز با «بی خواب در اتاق هتل» و «کنار تو باش» و والن با «20 سیگار»، «نکن»، همکاری لنگلی و «تا کنون بوده‌ام» پیشتاز بوده است. در همین حال، \"Choosin' Texas\" 49 هفته را سپری     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
