ntly discounted. Right now, you can get them for $168.99 (originally $229.99), the lowest price ever, according to price-tracking tools . Sleep Earbuds, ANC, Passive Isolation, Snore Masking Sleep Headphones, Extensive Sleep Audio, Ultra Comfort for Side Sleepers, 8-10H Playtime Soundcore Sleep A30 Special by Anker Sleep Earbuds $168.99 at Amazon $229.99 Save $61.00 Get Deal Get Deal $168.99 at Amazon $229.99 Save $61.00 30dB High-Frequency Noise Reduction, Small Earplugs for Side Sleepers, 80H Playtime, Stream Content via Bluetooth 5.3, Sleep Monitor, Personal Alarm Refurbished Soundcore Sleep A20 by Anker Sleep Earbuds $99.99 at Amazon Get Deal Get Deal $99.99 at Amazon SEE -1 MORE As noted in Mashable's review , the Sleep A30 Special are the most popular and arguably the best sleeping earbuds you can buy right now. They're designed for sleep in every way: Side sleepers can doze off without feeling pressure in their ears, since the earbuds sit comfortably inside, and with the addition of ANC, you can now block more outside noise than before. The battery life isn't the best, but this new Special version from 2026 will get you through the night: You can get eight to 10 hours of juice with ANC on, with some variation depending on your settings. There's also some cool tech and features designed for sleeping: The companion app lets you set a timer for your music so you don't drain the battery after you've fallen asleep; the earbuds now integrate with the Calm app for sleep-focused meditations and sleep stories; the charging case's microphones use Adaptive snore masking to block snoring sounds by increasing white noise; and the app includes an alarm and sleep-tracking features, among other features . All in all, I really can't recommend these earbuds enough to anyone who values quality sleep and doesn't mind wearing earbuds to bed. If the ANC isn't a big deal to you and you're looking to spend a bit less, the refurbished Sleep A20 or a refurbished Sleep A30 Special pair ", "date_str": "2026-10-15T17:00:00+00:00", "hash": "6e39432061c148e5", "title_fa": "هدفون های مورد علاقه من برای خواب در حال حاضر 60 دلار تخفیف دارند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. من از زمانی که بیش از دو سال پیش برای اولین بار آنها را در حالت خواب قرار دادم، طرفدار هدفون های Sleep A20 Soundcore بودم. من هرگز هدفون‌هایی را تجربه نکرده‌ام که هنگام خوابیدن به پهلو احساس راحتی کنند. اما این مدل یک ویژگی مهم را از دست داد: ANC. هدفون‌های جدید Sleep A30 Special از این موضوع مراقبت کرده‌اند، و بیشتر و علیرغم عرضه‌شان در ژانویه، در حال حاضر تخفیف قابل توجهی دارند. در حال حاضر، طبق ابزارهای ردیابی قیمت، می‌توانید آنها را با قیمت 168.99 دلار (در اصل 229.99 دلار) دریافت کنید. Sleep Earbuds، ANC، Passive Isolation، Snore Masking Headphones Sleep Audio Sleep Extensive Sleep Audio, Ultra Comfort for Side Sleepers, 8-10h Playtime Soundcore Sleep A30 Special by Anker Sleep Earbuds 168.99 دلار در آمازون 219.9 دلار Save 0.99 دلار دریافت کنید. در آمازون 229.99 دلار صرفه جویی 61 دلاری 30 دسی بل کاهش نویز فرکانس بالا، گوش گیرهای کوچک برای خواباننده جانبی، زمان پخش 80 ساعت، پخش محتوا از طریق بلوتوث 5.3، مانیتور خواب، هشدار شخصی Refurbished Soundcore Sleep A20ar De by Amazon. 99.99 دلار در آمازون SEE -1 بیشتر همانطور که در بررسی Mashable اشاره شد، Sleep A30 Special محبوب‌ترین و مسلما بهترین هدفون خوابی است که می‌توانید در حال حاضر بخرید. آنها از هر نظر برای خواب طراحی شده اند: خواباننده های جانبی می توانند بدون احساس فشار در گوش خود چرت بزنند، زیرا هدفون ها به راحتی در داخل قرار می گیرند، و با افزودن ANC، اکنون می توانید صدای بیرون را بیشتر از قبل مسدود کنید. عمر باتری بهترین نیست، اما این نسخه ویژه جدید از سال 2026 شما را در طول شب به ارمغان می‌آورد: می‌توانید"}, {"source": "Lifehacker", "title": "10 Shows Like 'Crystal Lake' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-crystal-lake?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The new streaming series Crystal Lake takes us back to the early days of the Friday the 13th franchise to explore the origins of hockey-masked killer Jason's power and fury by focusing, once again, on his mom (Linda Cardellini). Is this backstory we needed? Probably not! But I'm happy to revisit the bloodiest (and horniest) summer camp in America. If you're looking for other like-minded horror adaptations, here are 10 chilling shows to stream next. Bates Motel (2013 2017) You want some more backstory on an iconic serial killer and his mom? Say no more. Freddie Highmore stars as Norman Bates, the character author Robert Bloch based on the real killer Ed Gein, with Vera Farmiga playing his mother Norma (in her pre-desiccated-corpse days). Norman might not have accrued nearly the body count of Jason, but he's a lot more charming. Like a lot of media spun off from Alfred Hitchcock's seminal Psycho , it's better than it has any right to be, with impressively compelling character development and several surprises, even if we already know more or less where it's headed. Stream Bates Motel on Prime Video . Bates Motel (2013 2017) at Prime Video Learn More Learn More at Prime Video Hannibal (2013 2015) More high-minded than Crystal Lake , this reboot/prequel/fresh take on the Thomas Harris novels came from Bryan Fuller, who took a first crack at the Friday series before A24 decided it wanted something a little closer to the movies than what he'd proposed. Fuller goes back to the source material here, adapting the first Lecter novel with grand, operatic style and a visual flair unmatched on network television (you're still unlikely to find more gorgeously constructed scenes of carnage). What's more, the deeper, sexier relationship between the Doctor (Mads Mikkelsen) and profiler Will Graham (Hugh Dancy) adds some brilliant subtext as the two work together to hunt serial killers. It ended a bit too early, but the three seasons still make for a satisfying meal. Stream Hannibal on Prime Video . Hannibal (2013 - 2015) at Prime Video Learn More Learn More at Prime Video Wreck (2022 2024) Just a British meta-slasher-comedy on a boat (initially). Oscar Kennedy plays Jamie Walsh, who takes a job on board a cruise ship in order to investigate the disappearance of his sister, last seen working on the same vessel. Once on board, he soon realizes that everyone is a suspect and, being that he's on a boat, there's no escape from t", "date_str": "2026-10-15T16:30:00+00:00", "hash": "b0833c2c9d437924", "title_fa": "10 نمایش مانند «دریاچه کریستال» که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. سریال جدید کریستال لیک ما را به روزهای ابتدایی فرنچایز جمعه سیزدهم بازمی گرداند تا با تمرکز دوباره بر روی مادرش (لیندا کاردلینی) منشأ قدرت و خشم قاتل نقابدار هاکی جیسون را کشف کنیم. آیا به این پیشینه نیاز داریم؟ احتمالا نه! اما خوشحالم که از خونین ترین (و شاخ ترین) کمپ تابستانی در آمریکا بازدید می کنم. اگر به دنبال دیگر اقتباس‌های ترسناک همفکر هستید، در اینجا 10 نمایش هیجان‌انگیز برای پخش در ادامه آورده شده است. متل بیتس (2013 2017) آیا می خواهید داستانی بیشتر در مورد یک قاتل سریالی نمادین و مادرش داشته باشید؟ دیگه نگو فردی هایمور در نقش نورمن بیتس، نویسنده شخصیت رابرت بلوخ بر اساس قاتل واقعی اد جین، با ورا فارمیگا در نقش مادرش نورما (در روزهای قبل از جسد او) بازی می کند. شاید نورمن تقریباً به تعداد بدن جیسون نرسیده باشد، اما او بسیار جذاب تر است. مانند بسیاری از رسانه‌هایی که از فیلم روانی اصلی آلفرد هیچکاک منشعب شده‌اند، بهتر از هر حقی است، با رشد شخصیتی بسیار جذاب و چندین شگفتی، حتی اگر کم و بیش بدانیم به کجا می‌رود. استریم متل بیتس در Prime Video. متل بیتس (2013 2017) در پرایم ویدیو بیشتر بیاموزید در پرایم ویدیو هانیبال (2013 2015) با روحیه بالاتر از کریستال لیک، این راه‌اندازی مجدد/پیش‌درآمد/ برداشت تازه از رمان‌های توماس هریس از برایان فولر گرفته شد، که اولین کرک را در سری جمعه قبل از اینکه A24 تصمیم بگیرد چیزی حرفه‌ای‌تر از سری جمعه را داشته باشد، دریافت کرد. فولر در اینجا به منبع اصلی بازمی گردد، و اولین رمان لکتر را با سبکی بزرگ، اپرایی و استعداد بصری بی بدیل در تلویزیون شبکه تطبیق داد (هنوز بعید است که صحنه های قتل عام با ساخت بسیار زیباتری پیدا کنید). علاوه بر این،"}, {"source": "Lifehacker", "title": "You Can Now Join a WhatsApp Call Without an Account", "link": "https://lifehacker.com/tech/you-can-now-join-a-whatsapp-call-without-an-account?utm_medium=RSS", "summary": "The worst thing about your favorite chat app is trying to get your friends and family to use it. WhatsApp may be the most popular messaging platform in the world, but in the United States, it is hardly universally adopted. On the contrary, you'll find plenty of people who don't use it at all. In short, it's difficult to get a whole group to commit to any one platform, which can make casual video calls frustrating: If you don't use WhatsApp, and your friends are hosting a call, what are you supposed to do? You can't join a WhatsApp call without a WhatsApp account. That's now changing . Meta, WhatsApp's parent company, announced \"guest calling\" on Wednesday. Now, any WhatsApp user can invite any non-WhatsApp user to a call, even if the recipient doesn't have an account. These calls still get the same core perks as traditional WhatsApp calls, Meta says: They're free and end-to-end encrypted, so you won't be compromising on your privacy by calling a non-WhatsApp user this way. Non-WhatsApp users are still limited. Meta says these users always need a call host's approval to join. If you're a non-WhatsApp user, you'll find yourself in a waiting room until the call host lets you in. Meta also says that you can be kicked off the call at any time, and you won't be able to see other callers' phone numbers. You won't be able to send messages or add other users to the call. You are purely a participant. How to invite someone without a WhatsApp account to a WhatsApp call If you're trying to add a non-WhatsApp user to a call, first head to the Calls tab in the app. Here, hit (+) , create a call link, then send it to the recipient. Meta says the user can open the link in their computer browser, enter their name, and join. This applies to one-on-one calls as well as calls with up to 32 people. While guests will have the aforementioned limits, they do have some features available to them. They can share their screen, react with emojis, or raise their hand. WhatsApp isn't the first chat app to offer such a feature. Apple's FaceTime platform, for example, lets you create call links that anyone can join , whether they're calling in on an Apple device or a device running Android or Windows (or Linux, for that matter).", "date_str": "2026-10-15T15:30:11+00:00", "hash": "e0ad207915a4b1ff", "title_fa": "اکنون می توانید بدون حساب کاربری به تماس واتساپ بپیوندید", "summary_fa": "بدترین چیز در مورد برنامه چت مورد علاقه شما این است که سعی کنید دوستان و خانواده خود از آن استفاده کنند. واتس‌اپ ممکن است محبوب‌ترین پلتفرم پیام‌رسانی در جهان باشد، اما در ایالات متحده، به سختی مورد پذیرش جهانی قرار گرفته است. برعکس، شما افراد زیادی را خواهید یافت که اصلاً از آن استفاده نمی کنند. به طور خلاصه، سخت است که یک گروه را به یک پلتفرم متعهد کنید، که می‌تواند تماس‌های ویدیویی معمولی را خسته‌کننده کند: اگر از WhatsApp استفاده نمی‌کنید و دوستانتان میزبان تماس هستند، باید چه کار کنید؟ بدون حساب واتس اپ نمی توانید به تماس WhatsApp بپیوندید. اکنون در حال تغییر است. متا، شرکت مادر واتس اپ، روز چهارشنبه از \"تماس مهمان\" خبر داد. اکنون، هر کاربر واتس اپ می تواند هر کاربر غیر واتس اپ را به تماس دعوت کند، حتی اگر گیرنده حساب کاربری نداشته باشد. متا می‌گوید: این تماس‌ها همچنان همان امتیازات اصلی تماس‌های واتس‌اپ را دارند، متا می‌گوید: آنها رایگان هستند و رمزگذاری شده‌اند، بنابراین با تماس با کاربر غیر واتس‌اپ از این طریق، حریم خصوصی خود را به خطر نمی‌اندازید. کاربران غیر واتس اپ همچنان محدود هستند. متا می گوید این کاربران همیشه برای پیوستن به تایید میزبان تماس نیاز دارند. اگر کاربر غیر واتس اپ هستید، تا زمانی که میزبان تماس به شما اجازه ورود دهد، خود را در اتاق انتظار خواهید دید. متا همچنین می گوید که شما می توانید در هر زمانی تماس را قطع کنید و نمی توانید شماره تلفن تماس گیرندگان دیگر را ببینید. شما نمی توانید پیام ارسال کنید یا کاربران دیگری را به تماس اضافه کنید. شما صرفا یک شرکت کننده هستید. چگونه فردی را بدون حساب واتس اپ به تماس واتس اپ دعوت کنیم اگر می خواهید یک کاربر غیر واتس اپ را به تماس اضافه کنید، ابتدا به برگه تماس"}],
      media: [{"source": "Billboard", "title": "Bad Bunny’s New Adidas Gazelle Sneakers Are Inspired by Puerto Rican Sunsets: Where to Buy", "link": "https://www.billboard.com/culture/product-recommendations/bad-bunny-adidas-gazelle-gold-sneakers-buy-online-2026-1236361844/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. From topping the charts to selling out stadiums, Bad Bunny has made Puerto Rico central to just about everything he does. His Adidas partnership is no exception, and the latest addition to his sneaker lineup takes its cues from one of the island s most familiar sights: a Caribbean sunset. Shop Bad bunny x adidas Gazelles on oct. 17 at 10 a.m. eT The Bad Bunny x Adidas Originals Gazelle Indoor Solar Gold launches Saturday, Oct. 17, at 10 a.m. ET for $140, with availability through Adidas.com , the confirmed app and select retailers. Sign-ups opened Oct. 13. The latest Gazelle arrives in rich honey-yellow suede, complemented by leather lining, Adidas signature Three Stripes and a classic gum outsole. It s a relatively understated design compared with some of Bad Bunny s more experimental footwear releases, but the inspiration is anything but random. SELL-OUT RISK Adidas Bad Bunny Gazelle Indoor Buy Now at adidas $140 $140 Featuring premium suede and leather lining, the $140 sneakers launch Oct. 17. Since introducing his first reimagined Gazelle in 2024, the Puerto Rican superstar has treated the sneaker as another way to tell stories about home. His blue San Juan edition honored Puerto Rico s cultural ties to New York through Casa Amadeo, while the subsequent Gazelle City Series explored the island s landscapes and neighborhoods. Released during his 2025 Puerto Rican residency, the collection included green sneakers inspired by El Yunque rainforest, orange for Santurce and pink for Cabo Rojo s salt flats. The releases reflect a larger theme throughout his career: bringing Puerto Rican culture to a global audience without losing sight of where it all started. That approach has certainly resonated with listeners. Bad Bunny recently secured the No. 1 spot on Billboard s Greatest of All Time Hot Latin Songs Artists ranking, released in celebration of the chart s 40th anniversary. It s another milestone for an artist whose music, fashion collaborations and cultural influence increasingly go hand in hand. Now, with Solar Gold, Bad Bunny is adding another chapter to his Adidas catalog, one that feels distinctly connected to the island that continues to shape his work. Where to Buy the Bad Bunny x Adidas Gazelle Indoor Solar Gold Shop", "date_str": "2026-10-16T14:14:53+00:00", "hash": "a15bfdd6622d03f1", "title_fa": "کفش‌های کتانی Gazelle جدید آدیداس Bad Bunny با الهام از غروب خورشید پورتوریکویی ساخته شده است: از کجا بخریم", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. از صدرنشینی تا فروش استادیوم‌ها، خرگوش بد، پورتوریکو را در مرکز تقریباً هر کاری که انجام می‌دهد تبدیل کرده است. شراکت او در آدیداس نیز از این قاعده مستثنی نیست، و جدیدترین محصول اضافه شده به مجموعه کفش های کتانی او نشانه های خود را از یکی از آشناترین مناظر جزیره گرفته است: غروب خورشید در دریای کارائیب. خرید Bad bunny x adidas Gazeles در اکتبر. 17 ساعت 10 صبح به وقت شرقی The Bad Bunny x Adidas Originals Gazelle Indoor Solar Gold شنبه، 17 اکتبر، ساعت 10 صبح به وقت شرقی با قیمت 140 دلار، با در دسترس بودن از طریق Adidas.com، برنامه تایید شده و خرده فروشان منتخب، عرضه می شود. ثبت نام ها در 13 اکتبر آغاز شد. جدیدترین Gazelle با جیر زرد عسلی غنی، همراه با آستر چرمی، امضای سه راه راه آدیداس و زیره آدامسی کلاسیک وارد بازار می‌شود. در مقایسه با برخی از کفش‌های آزمایشی‌تر Bad Bunny، طراحی نسبتا کم‌توجهی است، اما الهام‌بخش آن چیزی جز تصادفی است. خطر فروش Adidas Bad Bunny Gazelle Indoor هم اکنون با قیمت 140 دلار آدیداس 140 دلار بخرید این کفش ورزشی 140 دلاری در 17 اکتبر عرضه می شود. سوپراستار پورتوریکویی از زمان معرفی اولین Gazelle بازسازی شده خود در سال 2024، کفش ورزشی را به عنوان راهی دیگر برای گفتن داستان در مورد خانه در نظر گرفته است. نسخه آبی سان خوان او پیوندهای فرهنگی پورتوریکو با نیویورک از طریق Casa Amadeo را گرامی داشت، در حالی که مجموعه بعدی شهر Gazelle به کاوش مناظر و محله های جزیره پرداخت."}, {"source": "Billboard", "title": "SiriusXM Celebrates Billboard Latin Music Week With Chart-Topper Channel Spotlight", "link": "https://www.billboard.com/music/chart-beat/siriusxm-billboard-latin-music-week-channel-2026-1236361364/", "summary": "SiriusXM is celebrating the biggest week in Latin music with the Billboard Latin Music Week Channel , highlighting chart-topping Latin music artists, starting Friday (Oct. 16). The Billboard Latin Music Week Channel accompanies Billboard ’s Latin Music Week , with a focus on featured guests, presenters and attendees, leading up to this year’s Billboard Latin Music Awards, which will air live from the James L. Knight Center in Miami Oct. 22 at 8 p.m. ET on Telemundo and Peacock . The channel will stream exclusively on the SiriusXM app through Oct. 22, while also taking over Hits Uno (channel 148) in cars Oct. 20-22. Related Peso Pluma Leads 2026 Billboard Latin Music Awards Finalists: Complete List Rubén Blades, Anthony Ramos, Lenny Tavárez More Join Latin Music Week 2026: Full Schedule 10 Key Issues Driving the Latin Music Industry Today: AI, Distribution, Touring More at Latin Music Week The channel will spotlight top-charting hits and 2026 Latin Music Week award-nominated artists across Latin pop/rock, regional Mexican, rhythm and tropical. Among stars of the channel are Shakira, Karol G, Prince Royce, Bad Bunny, Pitbull, Maluma, Fuerza Regida, Rawayana and Ryan Castro. The Billboard Latin Music Awards mark the culmination of Billboard ’s Latin Music Week, taking place in Miami Oct. 19-22 and bringing together artists, creators, executives and fans for performances, panels, workshops, showcases and other events celebrating Latin music. The Billboard Latin Music Week Channel marks the latest partnership between SiriusXM and Billboard . Previous features include the Billboard Top 500 Summer Hits Countdown , the Billboard Top 500 R B Countdown , the Billboard Women of Pop Countdown and the Billboard #2 Countdown Channel . Additionally, SiriusXM’s Big 40 Countdown , on 80s on 8, and the Back in the Day Replay , on ‘90s on 9, are based on historical weekly Hot 100 charts, with other surveys counted down on 70s on 7 and Prime Country.", "date_str": "2026-10-16T14:01:40+00:00", "hash": "3f7a6f789de6f102", "title_fa": "SiriusXM هفته موسیقی لاتین بیلبورد را با کانون توجه کانال Chart-Topper جشن می گیرد", "summary_fa": "SiriusXM بزرگترین هفته موسیقی لاتین را با کانال هفته موسیقی لاتین بیلبورد جشن می گیرد و هنرمندان موسیقی لاتین را برجسته می کند که از روز جمعه (16 اکتبر) آغاز می شود. کانال هفته موسیقی لاتین بیلبورد، هفته موسیقی لاتین بیلبورد را همراهی می‌کند، با تمرکز بر مهمانان برجسته، مجریان و شرکت‌کنندگان، که منجر به جوایز موسیقی لاتین بیلبورد امسال می‌شود، که به صورت زنده از مرکز جیمز ال نایت در میامی در 22 اکتبر ساعت 8 شب پخش می‌شود. ET در Telemundo و Peacock. این کانال تا 22 اکتبر به طور انحصاری در برنامه SiriusXM پخش خواهد شد، در حالی که Hits Uno (کانال 148) را در خودروهای 20 تا 22 اکتبر نیز در اختیار خواهد گرفت. Peso Pluma مرتبط فینالیست‌های جوایز موسیقی لاتین بیلبورد در سال 2026 پیشتاز شد: فهرست کامل روبن بلیدز، آنتونی راموس، لنی تاورز بیشتر به هفته موسیقی لاتین 2026 بپیوندید: برنامه کامل 10 موضوع کلیدی که صنعت موسیقی لاتین امروز را هدایت می‌کند: هوش مصنوعی، توزیع در کانال برتر موسیقی لاتین هنرمندانی که در هفته موسیقی لاتین 2026 در سراسر موسیقی پاپ/راک لاتین، مکزیکی منطقه ای، ریتم و استوایی نامزد جایزه شدند. از جمله ستارگان این کانال می توان به شکیرا، کارول جی، پرنس رویس، بانی بد، پیتبول، مالوما، فوئرزا رگیدا، راویانا و رایان کاسترو اشاره کرد. جوایز موسیقی لاتین بیلبورد نقطه اوج هفته موسیقی لاتین بیلبورد است که در 19 تا 22 اکتبر در میامی برگزار می‌شود و هنرمندان، سازندگان، مدیران و طرفداران را برای اجراها، پانل‌ها، کارگاه‌ها، ویترین‌ها و رویدادهای دیگر در جشن موسیقی لاتین گرد هم می‌آورد. کانال هفته موسیقی لاتین بیلبورد نشان‌دهنده جدیدترین همکاری بین SiriusXM و بیلبورد است. ویژگی‌های قبلی شامل شمارش معکوس 500 بازدید تابستانی برتر بیلبورد، شمارش معکوس 500 R B برتر بیلبورد، شمارش معکوس زنان بیلبورد پاپ و کانال شمارش معکوس بیلبورد شماره 2 است."}, {"source": "Billboard", "title": "HYBE Taps Juan S. Arenas as President of Global Label Services Division", "link": "https://www.billboard.com/pro/hybe-appoints-juan-s-arenas-lead-global-label-services/", "summary": "HYBE has appointed Juan S. Arenas as president of HYBE Global Label Services (HGLS), the company’s newly renamed division dedicated to supporting the growth of its artists in international markets, Billboard can exclusively announce Friday (Oct. 16). Formerly known as HYBE Label Services, HGLS’ new name reflects HYBE’s broader global strategy to create consistent, integrated services across its labels and strengthen long-term artist development worldwide. “The vision is to build a global platform dedicated to building and super-serving HYBE IPs and artists,” Arenas says in a statement. “HGLS’ aim is to create a competitive edge for them and set them up for exponential growth and global expansion.” Related Latin Power Players: Billboard’s 2026 List Revealed Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit Hilary Duff to Receive Outstanding Pop Tour of the Year Award at 2026 Billboard Live Music Summit Arenas previously served as chief IP officer of HYBE AMERICAS and chief operating officer of HYBE Latin America, where he helped redefine the company’s IP strategy and oversee the development, positioning and international expansion of key music properties across Latin and U.S. markets. Most recently named to Billboard ’s Latin Power Players list , Arenas will report to HYBE CEO Jason Jaesang Lee and remain based in Los Angeles. As part of the expanded HGLS leadership team, Nicole Csabai has been named senior vp of global distribution. Based in Nashville, she will oversee HYBE’s catalog as well as its DSP, commerce and streaming efforts, while helping shape the organization’s integrated, global-minded label services strategy. Csabai joins HYBE from Interscope Records, where she served as senior vp of revenue through mid-2025. Previously, she was vp of revenue and sales at Big Machine Label Group, overseeing physical and digital sales strategies for Big Machine Records, The Valory Music Co. and Nash Icon Records. Additionally, Melissa Victor-Burkhardt has been appointed HYBE s executive vp of global artist services, a newly created role based in Los Angeles. Reporting to Arenas, she will lead HGLS’ Artist Success Unit, which is designed to strengthen project management and provide expanded support across the company’s global artist roster. Victor-Burkhardt most recently served as senior vp and head of publicity and brand strategy at Epic Records, where she spent 11 years. Before joining Epic, she served as vp of media and artist relati", "date_str": "2026-10-16T14:00:00+00:00", "hash": "d7f0fd826b83e5e3", "title_fa": "HYBE خوان اس. آرناس را به عنوان رئیس بخش خدمات برچسب جهانی معرفی می کند", "summary_fa": "HYBE Juan S. Arenas را به عنوان رئیس خدمات برچسب جهانی HYBE (HGLS) منصوب کرده است، بخش تازه تغییر نام یافته این شرکت که به حمایت از رشد هنرمندان خود در بازارهای بین المللی اختصاص دارد، بیلبورد می تواند به طور انحصاری روز جمعه (16 اکتبر) اعلام کند. نام جدید HGLS که قبلا به عنوان خدمات برچسب HYBE شناخته می‌شد، نشان‌دهنده راهبرد جهانی گسترده‌تر HYBE برای ایجاد سرویس‌های یکپارچه و منسجم در سراسر لیبل‌های خود و تقویت توسعه بلندمدت هنرمندان در سراسر جهان است. Arenas در بیانیه‌ای می‌گوید: «چشم‌انداز ایجاد یک پلتفرم جهانی است که برای ساخت و ارائه خدمات فوق‌العاده به IPها و هنرمندان HYBE اختصاص دارد. \"هدف HGLS ایجاد یک مزیت رقابتی برای آنها و تنظیم آنها برای رشد تصاعدی و گسترش جهانی است.\" پخش کننده های قدرت لاتین مرتبط: فهرست بیلبورد 2026 فاش شد ویزر برای دریافت جایزه Legend of Live در اجلاس موسیقی زنده بیلبورد در سال 2026 هیلاری داف برای دریافت جایزه بهترین تور موسیقی پاپ سال در سال 2026 Billboard Live Music Summit Arenas قبلاً به عنوان مدیر دفتر HHBYAMICER کار می کرد. HYBE آمریکای لاتین، جایی که او به تعریف مجدد استراتژی IP شرکت و نظارت بر توسعه، موقعیت‌یابی و گسترش بین‌المللی ویژگی‌های کلیدی موسیقی در سراسر لاتین و ایالات متحده کمک کرد. بازارها آرناس که اخیراً در لیست پاور پلیرهای لاتین بیلبورد نامگذاری شده است، به جیسون جیسانگ لی، مدیر عامل HYBE گزارش می دهد و در لس آنجلس باقی می ماند. نیکول کابای به عنوان بخشی از تیم رهبری توسعه یافته HGLS به عنوان معاون ارشد توزیع جهانی انتخاب شده است. او که در نشویل مستقر است، بر کاتالوگ HYBE و همچنین تلاش‌های DSP، بازرگانی و استریم آن نظارت خواهد داشت و در عین حال به شکل‌دهی استراتژی خدمات برچسب جهانی یکپارچه و جهانی سازمان کمک می‌کند. Csabai از Interscope Records"}, {"source": "Billboard", "title": "White House ICE Deportation Video Using Kacey Musgraves’ ‘Mexico Honey’ Goes Silent", "link": "https://www.billboard.com/music/country/kacey-musgraves-mexico-honey-removed-ice-deportation-video-1236361820/", "summary": "The White House s latest bid to use a popular song to advance its anti-immigration agenda has gone silent. Just two days after the Trump administration posted a video focusing on U.S. Immigration and Customs Enforcement (ICE) action to remove undocumented people, the clip cued to Kacey Musgraves 2026 song Mexico Honey has been muted. Related Glenn Hughes Says He s On the Mend After Another 10-Hour Open-Heart Surgery: All Is Well Musicians Who ve Spoken Out Against ICE, From Bad Bunny to Billie Eilish Following Off The Charts Demand For Tickets, Powderfinger Will Add More Dates to Reunion Tour The video now has a caption that reads this sound isn t available, underneath a clip that features footage of men being handcuffed, detained and frogmarched onto planes with an on-screen message that says, Criminal illegals are going back home. The lyrics to Musgraves fun, flirty tune from this year s Middle of Nowhere album is an homage to an irresistible, magnetic love. You re going down smooth like Mexico, honey/ Take my heart, take all my money/ I want you so bad, it ain t even funny/ I mean for real, what the hell/ You got me shaking my ass in my hot-pink shorts\\/ You re laying down laughing on the bathroom floor, Musgraves sings on the breezy tune that has everything to do with infatuation and, seemingly, nothing to do with the project of massive deportations undertaken in the second Trump term. The video s caption still has a nod to the song s lyrics, reading, Goin back smooth, along with a waving hand emoji. At press time a spokesperson for Musgraves had not returned Billboard s request for comment and it did not appear as if the singer had made any public comments about the song s removal; a spokesperson for ICE had also not returned Billboard s request for comment on the removal of the song from the clip at press time. In August, Mexico Honey became Musgraves first-ever solo top 40 hit on the Billboard Hot 100 when it peaked at No. 39; the song s video was filmed in Mexico . Texas native Musgraves weighed in on the administration s immigration sweeps in June of 2025 on X when she hit out at the use of identity-concealing face coverings by officers, writing, If protesters can’t wear masks ICE shouldn’t be able to either. Then, earlier this year, she teamed up with the Mariachi Brothers — comprised of three young men who were detained by ICE earlier this year despite previously performing on Capitol Hill — at a handful of album release shows in early May. Anto", "date_str": "2026-10-16T13:22:54+00:00", "hash": "69071dfc65b51596", "title_fa": "ویدیوی اخراج یخی کاخ سفید با استفاده از «عسل مکزیک» کیسی ماسگریوز بی‌صدا می‌شود", "summary_fa": "آخرین پیشنهاد کاخ سفید برای استفاده از یک آهنگ محبوب برای پیشبرد برنامه ضد مهاجرتی خود مسکوت مانده است. تنها دو روز پس از اینکه دولت ترامپ ویدئویی را با تمرکز بر اقدام اداره مهاجرت و گمرک ایالات متحده (ICE) برای حذف افراد غیرقانونی ارسال کرد، کلیپ مربوط به آهنگ مکزیک Honey 2026 کیسی ماسگریوز بی صدا شد. گلن هیوز می‌گوید که پس از ۱۰ ساعت جراحی قلب باز در حال بهبود است: همه چیز خوب است نوازندگانی که در برابر ICE صحبت کرده‌اند، از بانی بد تا بیلی آیلیش پس از تقاضای بلیط، Powderfinger تاریخ‌های بیشتری را به تور Reunion اضافه می‌کند. شامل فیلم هایی از مردانی است که با دستبند، بازداشت و سوار شدن قورباغه به داخل هواپیما به همراه پیامی روی صفحه نمایش داده می شود که می گوید، غیرقانونی های جنایتکار به خانه برمی گردند. اشعار آهنگ سرگرم‌کننده و عشوه‌گر ماسگریوز از آلبوم امسال میانه‌ی ناکجاآباد، ادای احترامی است به عشقی غیرقابل مقاومت و مغناطیسی. تو مثل مکزیک صاف می روی، عزیزم/ قلبم را بگیر، همه پولم را بگیر/ من تو را خیلی بد می خواهم، حتی خنده دار نیست/ منظورم واقعاً این است که چه جهنمی/ تو باعث شدی با شلوارک صورتی تندم الاغم را تکان دهم\\/ روی زمین حمام دراز کشیدی و می خندی، ماسگریوز روی لحن بادی آواز می خواند، آهنگی که هیچ کاری برای دیدن ندارد. اخراج های انجام شده در دوره دوم ترامپ. کپشن ویدیو همچنان به متن آهنگ اشاره می‌کند، خواندن، بازگشت صاف، همراه با یک شکلک دست تکان. در زمان انتشار، سخنگوی ماسگریوز درخواست بیلبورد را برای اظهار نظر پاسخ نداده بود و به نظر نمی رسید که خواننده نظر عمومی در مورد حذف آهنگ داشته باشد. سخنگوی ICE همچنین درخواست بیلبورد برای اظهار نظر در مورد حذف آهنگ از کلیپ را در زمان انتشار پاسخ نداده بود."}, {"source": "Billboard", "title": "Glenn Hughes Says He’s On the Mend After Another 10-Hour Open-Heart Surgery: ‘All Is Well’", "link": "https://www.billboard.com/music/rock/glenn-hughes-10-hour-open-heart-surgery-update-1236361811/", "summary": "Former Black Sabbath and Deep Purple singer/bassist Glenn Hughes told fans that he is on the mend after undergoing another major heart procedure. Now Home after an 8 day stay, and a 10 hour open heart surgery operation, called aortic valve replacement, exactly the same procedure I had done in 2013, at UCLA Ronald Reagan Medical Center, Westwood, LA, Hughes, 75, wrote in an Instagram post on Friday (Oct. 16). Hughes praised his doctor, the head of cardiothoracic surgery at UCLA, and the staff and assured fans, Each day as I move forward, I am getting my energy back. There is only love in my life. There are no mistakes. Back in August, Hughes announced that he was retiring from touring effective immediately, calling off a planned six-week tour due to health issues. The Rock Roll Hall of Famer said he d been forced to give up life on the road after half a century on doctor s advice that he needed heart surgery. This past year, I’ve had some health issues. The results from numerous MRIs, CT scans, and an echocardiogram have alerted my medical team, that I need another open-heart surgery, he wrote at the time. I really have no option and no choice as health is my number one priority. Grateful to have been chosen with a life full with the gift of music… Thank you for walking beside me.” Hughes, who began his career as the singer of the British funk rock band Trapeze in the early 1970s, got the chance of a lifetime when he was tapped to replace Deep Purple bassist Roger Glover in 1973, where he sang alongside lead singer David Coverdale on three albums. After the band melted down, Hughes went out on his own, releasing his 1977 solo debut, Play Me Out , the first of more than a dozen solo LPs he s released. He played with a number of bands throughout the late 1970s and early 1980s, including stepping in to sing lead vocals on the 1986 Black Sabbath album Seventh Star . More recently, after releasing a handful of albums with supergroup Black Country Communion , he joined the rock band The Dead Daisies, stepping in as lead singer on a trio of releases in 2020, 2021 and 2022. In Friday s post, Hughes kept a chin-up attitude about his health, writing, Everything is in its right place. Never believe that there is something wrong in your life. You are where you’re supposed to be. Going through those experiences that are necessary for you right now. When you become angry at yourself, because you don’t like the experiences that you are going through, you are hindering you", "date_str": "2026-10-16T11:51:51+00:00", "hash": "0af932e8a85f58b9", "title_fa": "گلن هیوز می‌گوید پس از ۱۰ ساعت جراحی قلب باز در حال بهبود است: «همه چیز خوب است»", "summary_fa": "گلن هیوز، خواننده و نوازنده بیس سابق بلک سابث و دیپ پرپل، به طرفدارانش گفت که پس از انجام یک عمل جراحی بزرگ دیگر قلب، رو به بهبودی است. اکنون پس از 8 روز اقامت، و یک عمل جراحی 10 ساعته قلب باز، به نام تعویض دریچه آئورت، دقیقاً همان روشی که در سال 2013 در مرکز پزشکی رونالد ریگان UCLA، Westwood، LA، هیوز، 75 ساله انجام داده بودم، در یک پست اینستاگرامی در روز جمعه (16 اکتبر) نوشت. هیوز از پزشک خود، رئیس جراحی قلب در UCLA، و کارکنان و هواداران اطمینان داد، هر روز که به جلو می روم، انرژی خود را باز می گردم. در زندگی من فقط عشق وجود دارد. هیچ اشتباهی وجود ندارد. در ماه آگوست، هیوز اعلام کرد که بلافاصله از تور بازنشسته می شود و تور شش هفته ای برنامه ریزی شده را به دلیل مشکلات سلامتی لغو کرد. تالار مشاهیر راک رول گفت که او پس از نیم قرن به توصیه پزشک مبنی بر اینکه نیاز به جراحی قلب دارد، مجبور شد زندگی خود را در جاده رها کند. در سال گذشته، من مشکلات سلامتی داشتم. او در آن زمان نوشت: نتایج بسیاری از ام‌آر‌آی‌ها، سی‌تی اسکن و اکوکاردیوگرام به تیم پزشکی من هشدار داده است که به یک عمل جراحی قلب باز دیگر نیاز دارم. من واقعاً هیچ گزینه و انتخابی ندارم زیرا سلامتی اولویت اول من است. سپاسگزارم که با زندگی پر از موزیک انتخاب شده‌ام... ممنون که کنارم قدم می‌زنی.» هیوز که کار خود را به عنوان خواننده گروه فانک راک بریتانیایی Trapeze در اوایل دهه 1970 آغاز کرد، زمانی که در سال 1973 به جای راجر گلوور، نوازنده باس Deep Purple انتخاب شد و در سه آلبوم در کنار خواننده اصلی دیوید کاوردیل آواز خواند، یک عمر فرصت یافت. پس از فروپاشی گروه، هیوز به تنهایی بیرون رفت"}, {"source": "Billboard", "title": "Following ‘Off The Charts’ Demand For Tickets, Powderfinger Will Add More Dates to Reunion Tour", "link": "https://www.billboard.com/music/concerts/powderfinger-add-more-dates-off-the-charts-reunion-tour-1236361795/", "summary": "As weeks go, it was a “pretty weird” one for Powderfinger . In the best possible way. As previously reported, the beloved Australian rock band will mount a reunion tour next year, pre-sales for which opened on Wednesday, Oct. 14 . “Demand through this week’s presales has been off the charts,” reads an update from the band on Friday (Oct. 16), leaving only “a limited number of tickets” for the general public on-sale this coming Monday, Oct. 19. The 18 coast-to-coast concerts that were initially announced for September and October 2027, quickly grew to 26 with dates extending into November. “All shows are expected to sell out,” the statement continues. With so many fans still hoping to join the biggest singalong of 2027, the band and tour partners are working feverishly on adding more shows, the band insists. Fans can be assured that additional shows will be added, one way or another. Details will be shared as soon as they are confirmed. After a glittering career that produced five consecutive ARIA No. 1 albums, 18 ARIA Awards and three APRA Awards, including a brace for song of the year, Powderfinger called time in 2010 with The Sunsets Farewell tour, a 34-date national trek. A nod to the classic song from 2004’s ARIA No. 1 album Vulture Street , the Sunsets jaunt sold more than 300,000 tickets. Few Aussie acts can command that type of box office action. When the classic lineup of Bernard Fanning (vocals), Ian Haug (guitars), Darren Middleton (guitars), John “JC” Collins (bass) and Jon Coghill (drums) hit the road next year, expect them to crush that final run. “Ok. That was a pretty weird week,” remarks Fanning on behalf of Powderfinger. “We are truly humbled and overwhelmed by the response to the shows we announced. Thank you so much to everyone that sat through the stress of trying to get tickets. We want you all to know that we understand that there is still a huge appetite for people to come and be a part of the tour so we are working on putting more shows together. We want everyone to have an opportunity to come but it will take a couple of weeks to string it all together. Please be patient. We hear you. Lots of love to you all. Choose Kindness.” Powderfinger’s tour will feature a homegrown support cast, all of them performing under “stadium-sized big top” in central city locations across the country, including multiple dates in Cairns, far north Queensland, the band’s home state. View this post on Instagram “In the week since Powderfinger confirmed t", "date_str": "2026-10-16T09:43:40+00:00", "hash": "1ab6b97250ccf01e", "title_fa": "به دنبال تقاضای «Off The Charts» برای بلیط، Powderfinger تاریخ های بیشتری را به تور Reunion اضافه خواهد کرد.", "summary_fa": "با گذشت هفته ها، برای Powderfinger بسیار عجیب بود. به بهترین شکل ممکن. همانطور که قبلاً گزارش شده بود، گروه راک محبوب استرالیایی تور اتحاد مجددی را در سال آینده برگزار خواهد کرد که پیش فروش آن در روز چهارشنبه، 14 اکتبر آغاز شد. به‌روزرسانی گروه در روز جمعه (16 اکتبر) می‌گوید: «تقاضا از طریق پیش‌فروش‌های این هفته از نمودارها خارج شده است» و تنها «تعداد محدودی بلیت» برای عموم مردم در دوشنبه آینده، 19 اکتبر به فروش خواهد رسید. 18 کنسرت ساحل به ساحل که در ابتدا برای سپتامبر و اکتبر 2027 اعلام شده بودند، به سرعت به 26 کنسرت افزایش یافتند که تاریخ آن تا نوامبر ادامه دارد. این بیانیه ادامه می دهد: \"انتظار می رود همه نمایش ها به فروش برسند.\" گروه اصرار دارد با توجه به اینکه بسیاری از طرفداران هنوز امیدوارند به بزرگترین آهنگ سال 2027 بپیوندند، گروه و شرکای تور به شدت در حال کار بر روی اضافه کردن برنامه های بیشتر هستند. طرفداران می توانند مطمئن باشند که نمایش های دیگری به هر شکلی اضافه خواهند شد. جزئیات به محض تایید به اشتراک گذاشته خواهد شد. پس از یک حرفه پر زرق و برق که تولید پنج آلبوم متوالی شماره 1 ARIA، 18 جایزه ARIA و سه جایزه APRA، از جمله یک بریس برای آهنگ سال بود، Powderfinger در سال 2010 با تور خداحافظی Sunsets، یک سفر ملی 34 تاریخ، زمان را فراخواند. با اشاره به آهنگ کلاسیک آلبوم شماره 1 ARIA در سال 2004، خیابان کرکس، گشت و گذار Sunsets بیش از 300000 بلیت فروخت. تعداد کمی از بازیگران استرالیایی می‌توانند این نوع اکشن باکس آفیس را فرمان دهند. وقتی سال آینده گروه کلاسیک برنارد فانینگ (خواننده)، ایان هاگ (گیتار)، دارن میدلتون (گیتار)، جان «جی سی» کالینز (باس) و جان کوگیل (درامز) وارد جاده شدند، انتظار داشته باشید که آن‌ها این اجرای"}, {"source": "Billboard", "title": "Zach Bryan’s ‘Young Manhood and Other Donatable Organs’: Every Song Ranked", "link": "https://www.billboard.com/lists/zach-bryans-young-manhood-and-other-donatable-organs-ranked/", "summary": "It’s been less than a year since Zach Bryan put out his last album, With Heaven on Top , a 25-track opus that debuted at No. 1 on the Billboard 200 dated Jan. 24, 2026. But it turns out that the prolific Bryan still had more to say. Today (Oct. 16), he releases the intriguingly titled Young Manhood and Other Donatable Organs , an eight-song EP solely written, per usual, by the Oklahoma singer-songwriter. Bryan, who turned 30 earlier this year, includes a few tracks he’s road tested on his most recent tour, including “Robot Killed the Working Man” and “Backwards” on the set, which has a similarly intriguing album cover featuring Bryan standing in a field pointing a shotgun at a smiling image of himself about 12 feet away. On Instagram, he posted the cover and then added another image that features him pointing the gun and the song titles are coming out of the barrel. He added a cheery note, “Love you guys very much and hope you enjoy it.” In his relatively short, extremely successful career, Bryan has paired with such artists as Bruce Springsteen , The War and Treaty, and Kacey Musgraves (on the 2023 Billboard Hot 100 chart-topping duet, “I Remember Everything”), and he continues his collaborative ways on Young Manhood and Other Donatable Organs , partnering with Lana Del Rey on “Lies,” and with the Turnpike Troubadours on “Plainsman.” The album may be short it clocks in around 28 minutes but it packs a wallop in its diversity with Bryan incorporating strings on “Lies” and veering out of his usual mid-tempo safety zone on such tracks as “Dog Days,” as well as choosing some truly inspired opening samples for a few songs. The lyrics are more suggestive than literal and often inscrutable, but Bryan still manages to set an unsettling mood and feeling with almost every song. If marriage has brought a new happiness he wed last December it hasn’t found its ways into his music, which is actually a good thing. There s nothing here that has the sweetness of a love song like 2022 s Sun to Me. The world needs the edgy Bryan. Below, Billboard ranks each of the EP’s eight tracks .", "date_str": "2026-10-16T08:04:05+00:00", "hash": "09341ddd407eaf1a", "title_fa": "\"جوانمردی و سایر اعضای قابل اهدا\" زک برایان: هر آهنگ رتبه بندی شده است", "summary_fa": "کمتر از یک سال از انتشار آخرین آلبوم زک برایان به نام With Heaven on Top می گذرد، اثری 25 آهنگی که در 24 ژانویه 2026 در رتبه اول بیلبورد 200 قرار گرفت. اما معلوم شد که برایان پرکار هنوز چیزهای بیشتری برای گفتن داشت. امروز (16 اکتبر)، او عنوان جذاب جوانمردی و سایر اعضای قابل اهدا را منتشر می کند، یک EP هشت آهنگ که طبق معمول، تنها توسط خواننده و ترانه سرای اوکلاهاما نوشته شده است. برایان، که اوایل امسال 30 ساله شد، شامل چند آهنگی است که در آخرین تور خود آزمایش کرده است، از جمله \"Robot Killed the Working Man\" و \"Backwards\" در مجموعه، که دارای جلد آلبوم جذابی است که برایان در یک مزرعه ایستاده و تفنگ ساچمه ای را به تصویری خندان از خود در فاصله 12 پا نشان می دهد. او در اینستاگرام کاور را منتشر کرد و سپس تصویر دیگری را اضافه کرد که نشان می‌دهد اسلحه را نشان می‌دهد و عنوان آهنگ از لوله بیرون می‌آید. او یک یادداشت شاد اضافه کرد: \"بسیار شما را دوست دارم و امیدوارم از آن لذت ببرید.\" برایان در کارنامه نسبتاً کوتاه و بسیار موفق خود، با هنرمندانی مانند بروس اسپرینگستین، جنگ و پیمان، و کیسی ماسگریوز (در دوئت بیلبورد Hot 100 در سال 2023، \"من همه چیز را به یاد می‌آورم\") جفت شده است، و او به راه‌های مشترک خود در Young Manhood و Other Donaties با LaL ادامه می‌دهد. تروبادورهای تورنپیک در «دشت‌مرد». این آلبوم ممکن است کوتاه باشد و در حدود 28 دقیقه طول بکشد، اما تنوع خود را با برایان ترکیب می‌کند که سیم‌هایی را در «دروغ‌ها» به کار می‌برد و از منطقه امن معمولی اش در آهنگ‌هایی مانند «Dog Days» خارج می‌شود، و همچنین نمونه‌های آغازین واقعاً الهام‌بخشی را برای چند آهنگ انتخاب کرد. اشعار بیشتر تداعی کننده هستند تا"}, {"source": "Billboard", "title": "Olivia Rodrigo feat. Chappell Roan, Tate McRae, Zach Bryan & Angèle: New Music Friday Guide", "link": "https://www.billboard.com/music/music-news/olivia-rodrigo-tate-mcrae-zach-bryan-new-music-friday-guide-1236361399/", "summary": "Billboard’s Friday Music Guide serves as a handy guide to New Music Friday’s most essential releases each week — the key music that everyone will be talking about today, and that will be dominating playlists this weekend and beyond. Last week , we featured Troye Sivan, Remi Wolf, Slayyyter and Pitbull. This week, Olivia Rodrigo taps pal Chappell Roan for their Expectations remix; Tate McRae launches her next chapter with single Housewife ; Zach Bryan returns with a new EP titled Young Manhood Other Donatable Organs ; and Belgian artist Angèle releases her anticipated third album… plus much more. Check out all of this week’s picks below: Olivia Rodrigo, Expectations (feat. Chappell Roan ) Ooh , Olivia does remixes now, says Chappell with a touch of cheeky sarcasm at the start of O Rod s reimagined expectations single. And while listeners have to wait a while to see or hear from Chappell again, boy is it worth it. The second half of this remix is supercharged, packing an even bigger punch than it s original thanks to Roan s very own verse and her continued presence throughout the rest of the track as she takes over on a chorus and seamlessly melds her own powerhouse vocals with Rodrigo s. The two match each other well in presence and prowess, making for an exceptionally fun remix that will surely be a standout moment if and when it gets a live debut. — LYNDSEY HAVENS Tate McRae, Housewife With new single Housewife, Tate McRae fantasizes a life well lived full of yachts, loads of cash and prеcious cars, all of which she sings of and shows off in the song s video. I just wanna make a lot of money/ be my own housewife/ You could be the one I m calling honey/ Be my sex on the side, the pop star sings on the chorus over midtempo production. The cover art should have been indication enough on it, Tate is pushing a baby carriage full of money that her focus is on herself and her bag. She doesn t need anyone else to provide, and for now, isn t looking to provide for anyone else. — L.H. Zach Bryan, Young Manhood Other Donatable Organs Zach Bryan, who in his relatively short career has paired with such artists as Bruce Springsteen, The War and Treaty and Kacey Musgraves (on the 2023 Billboard Hot 100 chart-topping duet, “I Remember Everything”), continues his collaborative ways on Young Manhood and Other Donatable Organs , an eight-song EP on which he partners beautifully with Lana Del Rey on the bittersweet “Lies” and Turnpike Troubadours on “Plainsman.” The set come", "date_str": "2026-10-16T07:17:19+00:00", "hash": "23843da94e19cce4", "title_fa": "شاهکار اولیویا رودریگو چاپل روان، تیت مک‌ری، زک برایان و آنجل: راهنمای جمعه جدید موسیقی", "summary_fa": "راهنمای موسیقی جمعه بیلبورد به‌عنوان راهنمای مفیدی برای ضروری‌ترین نسخه‌های New Music Friday در هر هفته عمل می‌کند - موسیقی کلیدی که امروز همه درباره آن صحبت می‌کنند و این آخر هفته و بعد از آن بر فهرست‌های پخش غالب خواهد بود. هفته گذشته، ما Troye Sivan، Remi Wolf، Slayyyter و Pitbull را به نمایش گذاشتیم. این هفته، اولیویا رودریگو با رفیق چاپل روان برای ریمیکس انتظاراتشان تماس می گیرد. تیت مک ری فصل بعدی خود را با زن خانه دار مجرد راه اندازی می کند. Zach Bryan با یک EP جدید با عنوان Young Manhood Other Donatable Organs بازگشت. و آنجل، هنرمند بلژیکی، سومین آلبوم مورد انتظار خود را منتشر کرد... به علاوه خیلی بیشتر. تمام انتخاب‌های این هفته را در زیر بررسی کنید: اولیویا رودریگو، انتظارات (هنر. چپل روان) اوه، اولیویا در حال حاضر ریمیکس می‌کند، چپل با طعنه‌ای بی‌پروا در شروع تک‌آهنگ انتظارات دوباره تصور شده O Rod می‌گوید. و در حالی که شنوندگان باید مدتی صبر کنند تا دوباره چاپل را ببینند یا بشنوند، پسر آیا ارزشش را دارد. نیمه دوم این ریمیکس فوق‌العاده است و به لطف شعر خود روآن و حضور مستمر او در بقیه آهنگ، در حالی که او یک گروه کر را به عهده می‌گیرد و به‌طور یکپارچه آوازهای قدرتمند خود را با رودریگو ادغام می‌کند، صدایی بزرگ‌تر از اصل خود دارد. این دو در حضور و قدرت با یکدیگر به خوبی هماهنگ می شوند و یک ریمیکس فوق العاده سرگرم کننده را ایجاد می کنند که مطمئناً لحظه ای برجسته خواهد بود اگر و زمانی که اولین پخش زنده داشته باشد. — LYNDSEY HAVENS تیت مک‌ری، خانه‌دار با تک آهنگ جدید Housewife، تیت مک‌ری خیال‌پردازی می‌کند که زندگی خوبی داشته باشد، مملو از قایق‌های بادبانی، انبوهی از پول نقد و ماشین‌های گرانبها، که همه آنها را می‌خواند و در ویدیوی آهنگ"}, {"source": "Billboard", "title": "Troye Sivan Enjoys ‘Best’ Start on ARIA Chart", "link": "https://www.billboard.com/music/chart-beat/troye-sivan-best-start-aria-albums-chart-1236361738/", "summary": "Olivia Dean is still the best , certainly with respect to Australia’s official albums tally. But Troye Sivan isn’t far behind. Dean’s The Art Of Loving (via Universal) retains top spot on the ARIA Albums Chart , while Sivan’s fourth studio album, She’s The Best (EMI), opens its account at No. 2. An eight-time ARIA Award winner, Sivan peaked out at No. 6 with 2015’s Blue Neighbourhood , No. 3 in 2018 with Bloom and enjoyed a week at No. 1 with 2023’s Something To Give Each Other . Dean is still feeling the love from her Australian arena tour, which wrapped up this week and sends her sophomore LP back to No. 1 on the ARIA Chart for a 15th non-consecutive cycle. On the singles tally, she has no less than six titles in the top 40. Tame Impala is also on the road in Australia, and enjoying a lift on the ARIA Albums Chart as 2025 s Deadbeat (Columbia/Sony) rises 47-5. Kevin Parker and Co. will play Melbourne’s Rod Laver Arena tonight and Monday (Oct. 19), followed by three shows at Sydney’s Afterpay Arena and a pair of concerts at RAC Arena in his hometown, Perth. Frontier Touring, Chugg Entertainment and Laneway Presents are promoting the 12-date national Deadbeat tour . Geese frontman Cameron Winter bags a top 10 entry on the ARIA Chart, published late Friday, Oct. 16, with Live At Carnegie Hall (PIAS/Inertia), at No. 8, while Chase Status are close behind with Generic Everything (Warner) at No. 9. That’s easily a career-best chart position for the British drum ‘n’ bass act, which has released seven albums for a previous best of No. 38 for 2013’s Brand New Machine . U.S. singer and songwriter Remi Wolf ( Mud at No. 20 via Island/Universal), British electro-pop veterans Pet Shop Boys ( A man from the Future at No. 22 via Parlophone/Warner), Sydney alt-pop artist Darcy Lane ( Vampires Liars at No. 32), Western Australian rock act Grub ( Grub at No. 36 via MGM), and international girl group Katseye ( Wild at No. 44 via Interscope/Universal) enjoy top 40 berths. Over on the ARIA Singles Chart , Taylor Swift ’s “Patient Zero” (Republic/Universal) improves 2-1, for a second non-consecutive week at No. 1. The top debut belongs to Welsh singer Jamie Miller, whose “Babydoll” (Universal) appears at No. 35.", "date_str": "2026-10-16T07:06:20+00:00", "hash": "64e33264dd01df82", "title_fa": "Troye Sivan از \"بهترین\" شروع در نمودار ARIA لذت می برد", "summary_fa": "اولیویا دین هنوز بهترین است، مطمئناً با توجه به آمار آلبوم های رسمی استرالیا. اما Troye Sivan خیلی عقب نیست. Dean's The Art Of Loving (از طریق یونیورسال) جایگاه اول را در نمودار آلبوم های ARIA حفظ کرده است، در حالی که چهارمین آلبوم استودیویی سیوان، She's The Best (EMI) در رتبه 2 قرار دارد. سیوان که برنده هشت جایزه ARIA شده است، با 2015's Bloom's No2 و Blueom's No2 به رتبه 6 رسید. در سال 2023 با فیلم Something To Give Alge در سال 2023 در رتبه 1 قرار گرفت. دین هنوز عاشق تور استرالیایی خود است که این هفته به پایان رسید و LP دوم او را برای پانزدهمین دوره غیر متوالی به شماره 1 نمودار ARIA برگرداند. در مجموع انفرادی، او کمتر از 6 عنوان در بین 40 عنوان برتر دارد. Tame Impala نیز در استرالیا در جاده ها حضور دارد، و در حالی که Deadbeat 2025 (کلمبیا/سونی) 47-5 صعود می کند، از صعود در نمودار آلبوم های ARIA لذت می برد. کوین پارکر و شرکت امشب و دوشنبه (اکتبر) در راد لیور آرنا ملبورن بازی خواهند کرد. 19)، به دنبال آن سه نمایش در Afterpay Arena سیدنی و یک جفت کنسرت در RAC Arena در زادگاهش، پرت. Frontier Touring، Chugg Entertainment و Laneway Presents تور ملی Deadbeat 12 روزه را تبلیغ می کنند. کامرون وینتر، خواننده گروه Geese، در جدول ARIA که اواخر روز جمعه، 16 اکتبر منتشر شد، با Live At Carnegie Hall (PIAS/Inertia)، در رتبه 8 قرار گرفت، در حالی که Chase Status با Generic Everything (Warner) در رتبه 9 نزدیک است. این به راحتی بهترین موقعیت شغلی در چارت برای گروه درام 'n' باس بریتانیا است، که هفت آلبوم را برای بهترین شماره 38 قبلی برای Brand New Machine در سال 2013 منتشر کرده است. خواننده و ترانه سرای آمریکایی رمی وولف (مد"}, {"source": "Billboard", "title": "The Avalanches Press Play on ‘No Bad Memories’: Stream It Now", "link": "https://www.billboard.com/music/music-news/the-avalanches-no-bad-memories-stream-it-now-1236361730/", "summary": "The release of a new Avalanches album is never a trifling matter. With their debut 2000 album Since I Left You, the Australian electronic act let loose into the world a masterpiece. A peerless, timeless work, its creators meticulously sewed thousands of vinyl samples from the likes of Françoise Hardy, Sérgio Mendes, Raekwon, Wayne and Shuster, and even Madonna. Fast-forward a quarter century, Since I Left You sits in a class of all-time classics. Fresh as a field of daisies. Then, the “difficult second album.” The Avalanches recorded and rejected the followup. Years went by without a peep, save for the score to the King Kong stage musical and a batch of remixes. When their full-length sophomore collecting Wildflower finally bloomed, 16 long years had passed. Wildflower went straight to No. 1 on the ARIA Albums Chart. A third album travelled at comparative light-speed in 2020, We Will Always Love You , and later scooped the coveted Australian Music Prize, for the best album of the year. Now led by Robbie Chater, Tony Di Blasi and Andy Szekere, The Avalanches rumble on with their fourth studio effort No Bad Memories. It’s an album stacked with tracks (31 of them) and guests, including Karen O, John Glacier, Jamie xx, Barry Can’t Swim, Rivers Cuomo and Mike Patton. No Bad Memories (via Modular Recordings/Universal) explores “the magical intersection of advertising, memory and nostalgia,” reads a statement accompanying the project, “examining how jingles, sonic logos, commercials and the sounds of technology quietly embed themselves in our lives, becoming inseparable from the memories they soundtrack.” Sonically, it’s a joy. With bounce and soul. The Avalanches manage to harness the energy of a litter of Pomeranians. “Our album No Bad Memories is out in the world today,” reads a statement from the act. “We re beyond grateful for the endless enthusiasm and love our music receives after all this time. Thank you for taking the time to listen, we hope you enjoy it.” Timing out at 52 minutes, No Bad Memories is accompanied by a music video for “I Give Everything I Have 2 U” featuring Loaded Honey. Haley Joel Osment stars in the visual, shot by cinematographer Andrés Arochi ( Long Legs ) on location in Tokyo. “Working with our friend Haley on the visual for this song was such a thrill,” The Avalanches say of the Sixth Sense actor. “A one-take scenario with Haley trying to navigate the Shibuya traffic, a huge camera strapped to the outside of his windshield is not a ", "date_str": "2026-10-16T04:55:53+00:00", "hash": "13041107c471ec64", "title_fa": "The Avalanches Press Play را روی «No Bad Memories»: پخش کنید", "summary_fa": "انتشار آلبوم جدید Avalanches هرگز موضوع کوچکی نیست. بازیگران الکترونیک استرالیایی با اولین آلبوم خود در سال 2000، شاهکاری را در جهان منتشر کردند. یک اثر بی نظیر و جاودانه، سازندگان آن با دقت هزاران نمونه وینیل را از افرادی مانند فرانسوا هاردی، سرجیو مندس، راکوون، وین و شوستر و حتی مدونا دوختند. ربع قرن به جلو، از آنجایی که تو را ترک کردم در کلاسی از آثار کلاسیک همیشگی قرار دارد. تازه مثل مزرعه گل های مروارید. سپس، \"آلبوم دوم دشوار\". بهمن ها پیگیری را ضبط و رد کردند. سال‌ها بدون هیچ صدایی سپری شد، به جز موسیقی موسیقی صحنه کینگ‌کنگ و مجموعه‌ای از ریمیکس‌ها. وقتی جمع آوری گل وحشی سال دوم تمام قد آنها بالاخره شکوفا شد، 16 سال طولانی می گذشت. Wildflower مستقیماً به شماره 1 نمودار آلبوم ARIA رفت. آلبوم سوم در سال 2020 با سرعت نسبی نور سفر کرد، We Will Always Love You، و بعداً جایزه محبوب موسیقی استرالیا را برای بهترین آلبوم سال دریافت کرد. اکنون به رهبری رابی چاتر، تونی دی بلاسی و اندی سکره، The Avalanches با چهارمین تلاش استودیویی خود بدون خاطرات بد به راه افتادند. این آلبومی است مملو از قطعات (31 نفر از آنها) و مهمانانی از جمله Karen O، John Glacier، Jamie xx، Barry Can't Swim، Rivers Cuomo و Mike Patton. No Bad Memories (از طریق Modular Recordings/Universal) به بررسی «تقاطع جادویی تبلیغات، حافظه و نوستالژی» می پردازد، در بیانیه ای که همراه این پروژه است، آمده است: «بررسی این که چگونه جینگل ها، لوگوهای صوتی، آگهی های تبلیغاتی و صداهای فناوری بی سر و صدا خود را در زندگی ما جاسازی می کنند و از خاطرات آنها جدایی ناپذیر می شوند. از نظر صوتی، این یک شادی است. با جهش و روح. بهمن ها موفق می شوند انرژی یک بستر پامرانیان را مهار کنند. در بیانیه"}, {"source": "Deadline", "title": "Rafe Spall On Playing An Amnesiac Super Sleuth In ‘The Death Of Sherlock Holmes’: “This Is A Clean Slate”", "link": "https://deadline.com/2026/10/rafe-spall-death-of-sherlock-holmes-interview-1237157929/", "summary": "Rafe Spall was one of the biggest names at MIPCOM Cannes this ه می کند. او که از مدیرعامل گروه کانال UKTV به مدیر اجرایی کانال‌های جهانی و استودیو استودیو بی‌بی‌سی ارتقا یافته است، با چالش بزرگی مواجه است. قرار دادن بازوی تجاری [ ] آرتور می گوید: «استریم قطعا آینده ماست و ساختن برای آینده ای که اول از همه پخش می شود بسیار مهم است. اما خطی بودن در حال حاضر برای سودهایی که کسب و کارها به دست می آورند و برای 5 تا 10 سال آینده خواهد بود بسیار مهم است. هنر این است که کنترل کلاچ بین ساختن برای آینده استریم، اما همچنان تلاش برای به حداکثر رساندن سود کسب و کارهای خطی بزرگ است. داستان‌های مرتبط جشنواره‌ها پیشنهادات MIPCOM 2026: گشت و گذار در موج جدید تلویزیون با YouTube، Baywatch، Skydance، Banijay اخبار بیشتر چگونه متیو گری گابلر به تابلوی طراحی برای انیشتین بازگشت استودیو BBC کاتالوگ عظیمی از نمایش‌ها دارد که در سرتاسر جهان می‌فروشد — با کانالی که DannyIP در حال تبدیل شدن به آن است. و کسب و کار استریم با درآمد 788 میلیون پوندی (1.1 میلیارد دلار) برای سال مالی 2025/26 همچنان یک درآمد بزرگ است. مجموعه‌های Watch on Deadline Arthur شامل کانال‌ها و خدمات دیجیتالی است که شامل شبکه‌های تلویزیونی خطی، کانال‌های پشتیبانی شده از تبلیغات مارک، خدمات مستقیم به مصرف‌کننده و پخش‌کننده SVoD U.K BritBox International است و آرتور در خارج از آمریکای شمالی بر آن نظارت می‌کند. مشکل برای پخش کننده ها این است که پارادایم جدید [جریان سازی] یک شبه به وجود نمی آید. او می گوید که توسعه خدمات دیجیتال و مسیرهای شما به بازار زمان می برد. و در تمام مدتی که"}, {"source": "Deadline", "title": "Layoffs Take Place At ‘The Repair Shop’ Producer Ricochet", "link": "https://deadline.com/2026/10/ricochet-layoffs-the-repair-shop-skydance-damon-pattison-1237157978/", "summary": "EXCLUSIVE: A number of staffers including creative chief Damon Pattison have been laid off at Ricochet, the Skydance UK-owned indie that produces hit BBC show The Repair Shop. We understand around 10 staff left several weeks back including Pattison and Rob Butterfield, who was running the indie s Scotland office. This represents just under a third [ ]", "date_str": "2026-10-16T08:00:33+00:00", "has s [ ]", "date_str": "2026-10-16T07:30:00+00:00", "hash": "553b2dfa4843f7f1", "title_fa": "آتش Bryson بیش از 140 هکتار را سوزانده است. دستور تخلیه صادر شده؛ وزش باد در طول شب به 50 مایل در ساعت پیش بینی می شود", "summary_fa": "تازه‌ترین اخبار روز پنجشنبه آتش سوزی بادی در غرب مالیبو شعله‌ور شد و در عرض حدود 15 دقیقه از یک تا پنج هکتار گسترش یافت. در عرض یک ساعت، این حادثه در حدود 35 هکتار تخمین زده شد، از جمله آتش سوزی های مختلف نقطه ای که با فشار باد شعله های آتش به سمت جلو فوران کرد. از ساعت 11:30 بعد از ظهر، آتش [ ] به آتش بریسون نامیده شد، آتش برای اولین بار کمی قبل از ساعت 5 بعد از ظهر گزارش شد. در نزدیکی تقاطع بزرگراه Mulholland و جاده Encinal Canyon. به نظر می رسد نقطه اشتعال درست در شمال Encinal بین باشگاه گلف سابق مالیبو و مزرعه Saddlerock قرار دارد. به طور خاص، گزارش‌های تلویزیونی نشان می‌دهند که آتش درست در کنار بازداشتگاه نوجوانان کمپ کیلپاتریک شروع می‌شود. به گزارش اپلیکیشن واچ دیوتی، دستور تخلیه برای جنوب آتش سوزی در دره های زوما و ترانکاس، جایی که باد در حال رانده شدن آتش است، صادر شد. بعداً به غرب منطقه ای که رویداد آغاز شد گسترش یافت. دیده بان در ددلاین اداره مشروط شهرستان لس آنجلس اعلام کرد که 38 جوان را با خیال راحت از کمپ کیلپاتریک تخلیه کرده است. هشدارهای تخلیه از خط شهرستان لس آنجلس در شمال و جنوب به سمت پوینت دوم صادر شد. دستور تخلیه به معنای ترک است، در حالی که هشدار تخلیه به معنای آماده بودن برای ترک است. قسمت سفارش را با رنگ قرمز و هشدار را با نارنجی در زیر ببینید (از ساعت 7:30 بعد از ظهر). بسته شدن جاده ها در این منطقه شامل جاده دکر، جاده Encinal Canyon، جاده Kanan، بزرگراه Mulholland و بلوار Westlake است. مقامات آتش نشانی بیشتر نگران حفظ آتش در شمال جاده Encinal Canyon، یکی از معدود آتش‌نشانی‌های طبیعی در منطقه بودند. نگرانی این است که اگر از جاده Encinal"}, {"source": "Deadline", "title": "‘Street Fighter’ Punches $4M In U.S. Previews, ‘You Can See Everything’ $2M – Box Office Update", "link": "https://deadline.com/2026/10/box-office-street-fighter-you-can-see-everything-1237159320/", "summary": "EXCLUSIVE: Paramount/Legendary s PG-13 take of Capcom videogame Street Fighter is off to a solid start tonight with around $4M after showtimes that began at 2PM (further boosted by a 7PM fan showtime). The expectation is for the fisticuffs feature to open north of $30M; the pic costing a net $82M co-financed by Legendary and Capcom. [ ]", "date_str": "2026-10-16T05:19:00+00:00", "hash": "1acf0880d9c09f17", "title_fa": "«Street Fighter» در پیش‌نمایش‌های ایالات متحده ۴ میلیون دلار مشت زد، «شما می‌توانید همه چیز را ببینید» ۲ میلیون دلار - به‌روزرسانی باکس آفیس", "summary_fa": "انحصاری: برداشت PG-13 پارامونت/افسانه‌ای از بازی ویدیویی کپکام Street Fighter امشب با حدود 4 میلیون دلار پس از زمان‌های نمایشی که از ساعت 2 بعدازظهر شروع شد، شروع خوبی دارد (با افزایش زمان نمایش طرفداران در ساعت 7 عصر). انتظار می رود که ویژگی fisticuffs در شمال 30 میلیون دلار باز شود. این عکس 82 میلیون دلار خالص هزینه دارد که توسط Legendary و Capcom تامین شده است. [ ] طبق منابع، تخمین پیش‌نمایش Street Figther کمتر از 5.2 میلیون دلار است که توسط Mortal Kombat 2 با رتبه R در New Line بر اساس بازی ویدیویی Midway ساخته شده است. یکی از تفاوت‌های اصلی بین این دو بازی ویدیویی هنرهای رزمی این است که Street Fighter در سال 1987 عرضه شد، در حالی که Mortal Kombat در سال 1992 در پیتزافروشی‌ها و آرکیدها دنبال شد. Mortal Kombat 2 که در اواسط ماه مه شروع به کار کرد، پیش‌نمایش‌هایی داشت که در ساعت 15:00 با اولین جمعه 16.8 میلیون دلار و 3.5 میلیون دلار شروع شد. در حال حاضر یک تعطیلات اواسط پاییز در جریان است، که امیدواریم باعث ایجاد ترافیک در Street Fighter شود: Rentrak گزارش می دهد که 21٪ مدارس K-12 و 7٪ کالج ها تعطیل هستند. پیش‌نمایش Street Figther نیز جلوتر از بازی Paramount 2020 Sonic the Hedgehog است که 3 میلیون دلار قیمت داشت و اولین جمعه آن 20.9 میلیون دلار و 3 روز با قیمت 58 میلیون دلار منتشر شد، با این حال آن عکس در قاب تعطیلات روز رئیس‌جمهور پخش شد و رتبه PG را دریافت کرد. منتقدان Street Fighter را با ۴۷ درصد در Rotten Tomatoes شکست دادند. داستان‌های مرتبط اخبار Street Fighter نقد و بررسی: ریبوت فیلم اکشن پرطرفدار دارای یک بازیگر بازی است که باید لطفاً از طرفدارانی که به دنبال احیای اخبار دهه 90 هستند Street Fighter با شروع جهانی"}, {"source": "Deadline", "title": "‘Cupertino’ Creators Robert & Michelle King On Episode 2’s Shocking AGI Twist & Predicting The Future Again With AI Guardrails Storyline", "link": "https://deadline.com/2026/10/cupertino-creators-episode-102-bo-agi-storyline-interview-1237158656/", "summary": "SPOILER ALERT: The story includes details about Episode 102 of CBS Cupertino, Vik Bo. The Good Wife creators Robert and Michelle King are back at CBS this fall with a new legal drama, anchored by The Good Wife favorite Mike Colter, this time set in Silicon Valley. The David vs. Goliath series follows lawyers [ ]", "date_str": "2026-10-16T05:02:09+00:00", "hash": "223079ffbe59aafc", "title_fa": "رابرت و میشل کینگ، خالقان «کوپرتینو» در قسمت دوم، چرخش تکان دهنده AGI و پیش بینی آینده با خط داستانی AI Guardrails", "summary_fa": "SPOILER ALERT: داستان شامل جزئیات قسمت 102 CBS Cupertino، Vik Bo است. رابرت و میشل کینگ، خالقان The Good Wife، پاییز امسال با یک درام حقوقی جدید به CBS بازگشتند که توسط مایک کولتر مورد علاقه همسر خوب، این بار در سیلیکون ولی روایت می‌شود. دیوید در مقابل سریال Goliath به دنبال وکلا است [ ] پرایس سیفر دقیقاً همین کار را انجام می داد تا اینکه یک مشتری بالقوه به نام بو (راب مک کلور) که دستیار بی باک شرکت کریستی (الا استیلر) را مجذوب خود کرده بود، در پایان اپیزود 2 مشخص شد که هوش عمومی مصنوعی متعلق به بزرگترین شرکت هوش مصنوعی جهان است. چرا بو می خواهد Price Siffre را استخدام کند؟ او می‌خواهد از شرکتی که او را ایجاد کرده شکایت کند تا آنها را مجبور کند اطراف او را نرده‌های محافظ بگذارند، زیرا می‌ترسد ممکن است بشریت را نابود کند. اقدامات بو به دلیل اخراج هیئت مدیره اخلاقی خود توسط شرکت او انجام شد زیرا مدیریت احساس می کرد که توسعه AGI را کند می کند. تماشای Deadline آشنا به نظر می رسد؟ اینها برخی از همان نگرانی‌هایی هستند که محقق هوش مصنوعی Jacob Coxon، که برای OpenAI و Anthropic کار می‌کرد، در پست استعفای ویروسی خود مطرح کرد و هشدار داد که صنعت هوش مصنوعی «با زندگی ما قمار می‌کند یلم توسط دبورا فرانسیس وایت نوشته شده است. بازیگرانی که قبلا اعلام شده بودند عبارتند از Serrana Su-Ling Bliss در نقش Fei Chang، James Acaster در نقش Stickers، Dee Bradley Baker در نقش Groundbeef و Ncuti Gatwa در نقش Butterwort. دو نفر برنده تونی توبی مارلو و لوسی ماس (شش: موزیکال) آهنگ‌های اصلی می‌نویسند و ایزابلا ماشین سامرز (Florence + The Machine) نامزد جایزه گرمی نیز آهنگ‌سازی می‌کند و در آهنگ‌ها مشارکت دارد. Ian Eisendrath (KPop Demon Hunters) به عنوان تهیه کننده اجرایی موسیقی فعالیت می کند. کایلی مینوگ توسط جیسون واینبرگ در Untitled و پولی بومیک در Context Management نمایندگی می شود. جاناتان گروف توسط برایان بون و جو میچوتا در CAA نمایندگی می شود. کاترین تیت توسط جرمی باربر در UTA و رابرت تیلور در The Artists Partnership نمایندگی می شود."}, {"source": "Netflix NL", "title": "Zweedse film laat het stormen op Netflix", "link": "https://www.netflix-nederland.nl/zweedse-film-laat-het-stormen-op-netflix/", "summary": "Woeeeeeeeei, woeeeeei hoor je dat? Wat is dat? Het is een storm! Een Zweedse storm! Een Zweedse sneeuwstorm! Die speelt een grote rol in de Zweedse film Stormen, die het momenteel behoorlijk goed doet op Netflix! Zweedse film Stormen laat het stormen op Netflix De film is pas net uit, maar is nu al terug te vinden in de top 10 met meest bekeken films op de streamingdienst. Wie weet zit er wel meer in het vat. De nummeréénpositie misschien, of is dat te veel gevraagd? Voor wie het niet weet: we hebben het hier over een donkere komedie uit Zweden. Stormen draait om Filip (Gustaf Skarsgård), die zijn 45e verjaardag wil vieren met zijn vrouw en een groep van zijn beste vrienden. Het gezelschap komt samen voor een uitgebreid diner op het luxe landgoed dat Filip en zijn vrouw onlangs hebben gekocht in het afgelegen noorden van Zweden. In eerste instantie moet het vooral een gezellige avond worden, met eten, drank, oude vrienden, kortom: een hele hoop gezelligheid. Buiten ontwikkelt zich echter een zware sneeuwstorm. Wanneer ook de stroom uitvalt, wordt duid
