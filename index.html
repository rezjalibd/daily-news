 the work of both Nathan Fielder and Lance Oppenheim. Here s the crash course. Podcasts The 2019 podcast The Dropout is one of the most efficient ways to get the background on Holmes and Theranos. In the style of a true crime podcast, this show from ABC and journalist Rebecca Jarvis offers a deep dive into Holmes and her crimes that will give you all the background you ll need. Books John Carreyrou is the journalist who broke the Holmes story wide open, and his award-winning book Bad Blood offers a more journalistic and less sensational investigation than other accounts, providing a close-up look at Holmes in her CEO persona an alternately terrifying and charismatic person who comes across as a character Holmes is playing. The book will inform your viewing of the documentary in important ways. Films While Nathan Fielder is getting most of the attention for You Can See Everything , co-director Lance Oppenheim brings his", "date_str": "2026-10-21T16:30:00+00:00", "hash": "58b7d2da9305ab8e", "title_fa": "هر چیزی که باید همراه با \"شما می توانید همه چیز را ببینید\" ببینید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. شما می توانید همه چیز را ببینید، مستند جدید درباره الیزابت هولمز بنیانگذار ترانوس (و کلاهبردار کارکشته) از فیلمسازان ناتان فیلدر و لنس اوپنهایم، رکوردها (و مغزها) را می شکند. نه تنها آن را در باکس آفیس به گونه‌ای مطرح می‌کند که کمتر مستندی می‌تواند آن را مدیریت کند، بلکه به لطف تکنیک‌های مخالف ژانر، در حال حاضر بر گپ فرهنگ پاپ تسلط دارد. یک پیچ و تاب بزرگ و قانون شکن (که من آن را خراب نمی کنم). و موضوع پشیمان کننده و غیرقابل توضیح مسحور کننده آن. در حالی که برخی ممکن است استدلال کنند که باید تازه وارد این فیلم باورنکردنی شوید، اگر با هر یک از سه شخصیت اصلی درگیر آشنا نیستید، قبل از شروع کار از کمی کار آماده سازی بهره مند خواهید شد و اگر قبلاً آن را دیده اید، بدون شک مشتاق هستید که حتی عمیق تر در این داستان واقعاً قابل توجه (به تمام معنا) شیرجه بزنید. در اینجا چیزی است که باید قبل یا بعد از اینکه می توانید همه چیز را ببینید، تماشا، بخوانید و گوش دهید. فیلم‌ها، نمایش‌ها، پادکست‌ها و کتاب‌هایی که باید قبل از تماشا ببینید You Can See Everything Bad Blood: Secrets and Lies in a Silicon Valley Startup 10.31 دلار در آمازون 21.00 دلار پس انداز 10.69 دلار همین حالا خرید کنید 10.31 دلار در آمازون 21.00 دلار ذخیره کنید 10.69 دلار در آمازون خرید کنید. تمرین: فصل اول کامل در آمازون اکنون خرید کنید اکنون در آمازون خرید کنید مشاهده 0 بیشتر به بیان ساده: اینجا چیزهای زیادی در جریان است. برای اطمینان از اینکه می توانید از فیلم قدردانی کنید، باید مطمئن شوید که حداقل اصول اولیه را در مورد سه چیز می دانید: الیزابت هلمز (و چرا بدنام است) و کارهای ناتان"}, {"source": "Lifehacker", "title": "10 Hacks Ever Siri AI User Should Know", "link": "https://lifehacker.com/tech/best-siri-ai-hacks?utm_medium=RSS", "summary": "If you're like me, you've spent years ignoring most of Siri's functionality. Sure, it's great for setting timers, making calls, and sending a text. But that's kind of it Apple's promise of an \"always-on\" digital assistant never truly delivered. But that's finally changed with the recent launch of Siri AI. Fifteen years after debuting the app on the iPhone 4S and four years after the release of ChatGPT, Apple has taken the time to build out its own private Apple Foundation Models (with little help from Google) that work both on-device and on Apple's servers to give quick responses to your queries. Siri AI's answers are short, to the point, and actually useful. However, the conversational side isn't the only new thing about Siri AI. In fact, once you scratch the surface, you'll find Siri AI features embedded across the entire iOS and macOS ecosystem. Here's how to get the most out of Apple's new, enhanced digital assistant. Use Silent Response to make sure Siri always answers silently Credit: Khamosh Pathak Siri AI is already tuned for brevity. Compared to Gemini or Claude, its responses are short and to the point. But still, if you ask something with your voice, it responds using voice as well. I personally prefer to quickly read through Siri responses. If you re like me, you can enable a hidden setting that makes sure that Siri always answers silently, no matter if you re writing to it or using your voice. Go to Settings Siri Responses and switch to the Silent Response option. Make Siri AI sound more natural using Expressive Voice Credit: Apple On the other hand, if you prefer to listen to Siri's responses, it's worth it to spend some time fine-tuning them. If you have an iPhone that s under two years old, you have access to a more expressive Siri voice. Siri AI has an Expressive Voice feature that works on iPhone 17 Pro and higher, iPhone Air, and Macs with an M3 processor or higher (at least 12GB RAM). To find this feature, go to Settings Siri Voice . Here, you can change the Pace to make Siri faster or slower. The big feature is the Expressivity slider; you can use it to make Siri sound brighter and more enthusiastic, rather than flat. You also have several voice options at the top (color-coded). Use Visual Intelligence to have Siri take action on anything on your screen Visual Intelligence is deeply integrated into iOS 27 and macOS 27, and it turns anything on your screen into a source that Siri AI can act upon. It can search anything on your screen, a", "date_str": "2026-10-21T15:00:00+00:00", "hash": "356ea9c65e0ae204", "title_fa": "10 هک که کاربر هوش مصنوعی سیری باید بداند", "summary_fa": "اگر شما هم مثل من هستید، سال ها صرف نادیده گرفتن بیشتر قابلیت های سیری کرده اید. مطمئناً برای تنظیم تایمر، برقراری تماس و ارسال پیامک عالی است. اما این همان چیزی است که وعده اپل برای دستیار دیجیتال «همیشه روشن» هرگز واقعاً عملی نشد. اما در نهایت با راه اندازی اخیر هوش مصنوعی سیری تغییر کرد. 15 سال پس از معرفی این برنامه در iPhone 4S و چهار سال پس از انتشار ChatGPT، اپل زمان صرف کرده است تا مدل‌های خصوصی Apple Foundation خود را بسازد (با کمک کمی از Google) که هم روی دستگاه و هم روی سرورهای اپل کار می‌کنند تا به درخواست‌های شما سریع پاسخ دهند. پاسخ های Siri AI کوتاه، دقیق و در واقع مفید هستند. با این حال، بخش مکالمه تنها چیز جدید در مورد هوش مصنوعی سیری نیست. در واقع، هنگامی که سطح را خراشیدید، ویژگی‌های هوش مصنوعی Siri را خواهید دید که در کل اکوسیستم iOS و macOS تعبیه شده است. در اینجا نحوه استفاده حداکثری از دستیار دیجیتالی جدید و پیشرفته اپل آورده شده است. از پاسخ بی‌صدا استفاده کنید تا مطمئن شوید سیری همیشه بی‌صدا پاسخ می‌دهد. در مقایسه با جمینی یا کلود، پاسخ های آن کوتاه و دقیق است. اما با این حال، اگر چیزی را با صدای خود بپرسید، با استفاده از صدا نیز پاسخ می دهد. من شخصا ترجیح می دهم پاسخ های سیری را سریع بخوانم. اگر مثل من هستید، می‌توانید یک تنظیم مخفی را فعال کنید که مطمئن شود سیری همیشه بی‌صدا پاسخ می‌دهد، فرقی نمی‌کند برایش می‌نویسید یا از صدایتان استفاده می‌کنید. به Settings Siri Responses بروید و به گزینه Silent Response بروید. با استفاده از Expressive Voice Credit صدای Siri AI را طبیعی‌تر کنید: اپل از طرف دیگر، اگر ترجیح می‌دهید به پاسخ‌های Siri گوش دهید، ارزش آن را دارد که مدتی را"}, {"source": "Lifehacker", "title": "Why Your Smartwatch Size Really Does Matter", "link": "https://lifehacker.com/health/why-your-smartwatch-size-matters?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Is my watch too big? is a constant question on forums dedicated to smartwatches and fitness trackers of all kinds. (Some, but fewer, wonder if their watch is too small.) Personally, I don t much care how a watch looks , but I ve noticed that size can make a big difference in how accurately a watch functions. If your watch is too big, your numbers may be off. How smartwatch size affects heart rate accuracy Garmin Forerunner 265 (larger) in red, 265s (smaller) in pink. Chest strap for reference in black. Credit: Beth Skwarecki Watches measure heart rate through an optical sensor on the back of the watch. (That s what you see glowing green back there.) The heart rate sensor detects how that light reflects off the blood vessels in your skin. To get a proper reading, it needs to be snug against your skin, ideally in a way that blocks out ambient light. If the sensor loses contact with your skin, or if too much light sneaks in, heart rate readings may be inaccurate. If a watch fits you well to start with, you can generally get an accurate heart rate by simply making sure the watch is snug during workouts. But if a watch is too big, it can move around, letting light in. When you run, if a watch is bouncing around, the sensor may detect a flash of light with every footstep. This can lead to your watch reporting a heart rate that is the same as your cadence (footsteps per minute), which is sometimes called cadence lock. Some runners will cover their watch with a sleeve (especially in cold weather) to minimize this possibility. No matter how you wear it, a big watch on a small wrist is likely to have a lot more difficulty than one that fits properly. Very small devices can have a similar problem: The device isn t large enough or can t be tightened enough to block light. This isn t usually a problem with wristwatches, but it may explain why smart rings tend to be so poor at daytime heart rate tracking. Now, is this a real-life concern, or just a theoretical quibble? I wasn t sure, until I took the Forerunner 265 and 265S for a run at the same time. These are the same watch, with the same heart rate sensor, differing only in size. You can read about my results here , but the graph tells the story pretty well: The smaller 265S (42 mm) captured my heart rate more accurately than the 265 (46 mm). Garmin Forerunner 265 $429.99 at Amazon Get Deal Get Deal $429.99 at Amazon Garmin Forerunner 265S $441.95 at Amazon Shop Now S", "date_str": "2026-10-21T14:30:17+00:00", "hash": "840f2f45bcaf7063", "title_fa": "چرا اندازه ساعت هوشمند شما واقعاً مهم است؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. آیا ساعت من خیلی بزرگ است؟ یک سوال همیشگی در انجمن‌های اختصاص داده شده به ساعت‌های هوشمند و ردیاب‌های تناسب اندام از همه نوع است. (برخی، اما کمتر، تعجب می کنند که آیا ساعت آنها خیلی کوچک است.) من شخصاً اهمیتی نمی دهم که یک ساعت چگونه به نظر می رسد، اما متوجه شده ام که اندازه می تواند تفاوت بزرگی در عملکرد دقیق ساعت ایجاد کند. اگر ساعت شما خیلی بزرگ است، ممکن است شماره های شما خاموش باشد. چگونه اندازه ساعت هوشمند بر دقت ضربان قلب تأثیر می گذارد گارمین فورونر 265 (بزرگتر) به رنگ قرمز، 265 ثانیه (کوچکتر) به رنگ صورتی. بند سینه برای مرجع در مشکی. اعتبار: ساعت‌های Beth Skwarecki ضربان قلب را از طریق یک حسگر نوری در پشت ساعت اندازه‌گیری می‌کنند. (این همان چیزی است که در آنجا سبز درخشان می بینید.) حسگر ضربان قلب نحوه انعکاس نور از رگ های خونی پوست را تشخیص می دهد. برای خواندن صحیح، باید روی پوست شما محکم باشد، در حالت ایده آل به گونه ای که نور محیط را مسدود کند. اگر حسگر تماس خود را با پوست شما از دست بدهد، یا اگر نور زیادی به داخل بدن شما نفوذ کند، خوانش ضربان قلب ممکن است نادرست باشد. اگر یک ساعت برای شروع به خوبی برای شما مناسب است، به طور کلی می توانید ضربان قلب دقیقی را به سادگی با اطمینان از اینکه ساعت در حین تمرین راحت است، به دست آورید. اما اگر یک ساعت خیلی بزرگ باشد، می‌تواند به اطراف حرکت کند و اجازه دهد نور وارد شود. وقتی می‌دوید، اگر ساعتی به اطراف می‌چرخد، حسگر ممکن است با هر قدمی یک فلاش نور را تشخیص دهد. این می تواند منجر به گزارش ساعت شما شود که ضربان قلب شما برابر"}],
      media: [{"source": "Billboard", "title": "House Democrats Press StubHub CEO for Answers Over Ticket Resale Fund: ‘Potential Grift’", "link": "https://www.billboard.com/pro/house-democrats-pressure-stubhub-ceo-ticket-resale-fund/", "summary": "Democrats in the U.S. House of Representatives are continuing to probe StubHub CEO Eric Baker about ties between the ticket resale platform and his own broker fund. House Oversight Committee ranking member Rep. Robert Garcia (D-Calif.) sent Baker a letter on Thursday (Oct. 22) requesting documents and information about Andro Capital. The letter, first obtained and exclusively reported by Billboard , comes three months after Garcia first opened an investigative inquiry into the fund’s relationship with StubHub. Related StubHub Under Scrutiny From House Dems Over CEO’s ‘Alleged Collusion’ With Ticket Broker Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit StubHub disclosed in regulatory filings ahead of its IPO last year that its CEO is also a part-owner and managing partner of Andro, which buys bulk ticket inventory directly from event organizers and then resells them on the secondary market. Baker’s fund has generated revenue of more than $5 million transacting on StubHub since 2022, with StubHub keeping a percentage-based fee of that revenue. An affiliate of Andro, called Colloquy Capital, also has a contract with StubHub to lend short-term financing to other resellers on the platform. Garcia’s first letter in July was directed to Baker in his capacity as StubHub CEO, seeking records from the publicly traded resale platform to investigate whether it’s engaged in “collusion” with Andro. StubHub denies anything untoward in its relationship with Andro. The company’s lawyers have responded to the Oversight Committee by claiming that Andro is one of several above-board vendors that transparently contribute to StubHub’s overall business. As conversations remain ongoing between Garcia’s team and StubHub, Thursday’s letter targets Baker instead in his capacity as Andro’s managing partner. This time, the congressman is seeking “information about the role that Andro Capital plays in the ticket market and how the relationship between Andro Capital and StubHub may unfairly raise costs for consumers and limit profits for artists.” “The financial ties between Andro Capital, its affiliate Colloquy Capital, and StubHub — and your personal connection to all three of these companies — raise concerns that Andro Capital or its affiliates could be receiving favorable placement or other advantages in the resale market at the expense of buyers and sellers of smaller numbers of ticke", "date_str": "2026-10-22T14:30:00+00:00", "hash": "8a726cf9f13260a0", "title_fa": "دموکرات‌های مجلس، مدیر عامل StubHub را برای پاسخ‌های مربوط به صندوق فروش مجدد بلیت‌ها: «عیب بالقوه» منتشر می‌کنند", "summary_fa": "دموکرات‌ها در مجلس نمایندگان ایالات متحده به بررسی اریک بیکر، مدیر عامل StubHub در مورد روابط بین پلت فرم فروش مجدد بلیط و صندوق کارگزاری خود ادامه می‌دهند. عضو رده‌بندی کمیته نظارت مجلس نمایندگان، رابرت گارسیا (دکتر کالیفرنیا) نامه‌ای به بیکر ارسال کرد که در آن اسناد و اطلاعاتی درباره آندرو کپیتال درخواست کرد. نامه ای که برای اولین بار توسط بیلبورد به دست آمده و به طور انحصاری گزارش شده است، سه ماه پس از آن است که گارسیا برای اولین بار تحقیقاتی را درباره رابطه صندوق با StubHub آغاز کرد. StubHub مرتبط تحت نظارت نمایندگان مجلس درباره \"تبانی ادعایی\" مدیرعامل با کارگزار بلیط، دیدی از زندان نیوجرسی به مرکز مشابهی در پنسیلوانیا ویزر نقل مکان کرد تا جایزه Legend of Live را در اجلاس موسیقی زنده بیلبورد در سال 2026 دریافت کند. همچنین یکی از مالکین و شریک مدیریتی Andro است که موجودی بلیط انبوه را مستقیماً از برگزارکنندگان رویداد خریداری می کند و سپس آنها را در بازار ثانویه می فروشد. صندوق بیکر از سال 2022 بیش از 5 میلیون دلار از تراکنش در StubHub درآمد ایجاد کرده است و StubHub یک کارمزد بر اساس درصد از این درآمد را حفظ کرده است. یکی از شرکت‌های وابسته به Andro به نام Colloquy Capital نیز با StubHub قراردادی برای اعطای تسهیلات مالی کوتاه‌مدت به سایر فروشندگان روی پلتفرم بسته است. اولین نامه گارسیا در ماه ژوئیه به بیکر در سمت خود به عنوان مدیر عامل StubHub ارسال شد و به دنبال سوابق از پلتفرم فروش مجدد سهام عمومی بود تا بررسی کند که آیا درگیر \"تبانی\" با Andro است یا خیر. StubHub هر چیز ناخوشایندی را در رابطه با Andro رد می کند. وکلای شرکت به کمیته نظارت پاسخ داده اند و ادعا کرده اند که Andro یکی از چندین فروشنده فوق العاده است که به طور شفاف"}, {"source": "Billboard", "title": "Bernie Taupin Talks His New Solo Album, Working With Elton John and Why He Can’t Name a Taylor Swift Song: ‘I Don’t Listen to the Radio’", "link": "https://www.billboard.com/music/country/bernie-taupin-solo-album-elton-john-taylor-swift-1236365066/", "summary": "Spending two years writing his autobiography, the 2023 bestseller Scattershot , and working on a forthcoming documentary, unleashed a creative wellspring in Bernie Taupin . The result is his first solo album in almost 40 years and the first that Taupin, best known as Elton John ’s writing partner, has ever written solely by himself. The Sea Has No Mercy , produced by Frank Liddell , comes out Friday (Oct. 23) on Vertigo Records/MCA Nashville. “The inspiration of the memoir created something in me that started making me write things for myself by myself in the same vein. But at the same time, we started making this documentary, so it was like a trifecta. It was almost this whole idea of different ways of presenting myself without being completely self-involved — which, unfortunately, it probably sounds like,” Taupin says with a laugh. “I wanted to visualize my past, my present and my possible future very specifically and the only way I could do that was to write these biographical songs,” Taupin, 76, continues, addressing the album’s very personal and reflective nature. “This was a completely 100% selfish endeavor. If other people had assisted me in writing them, they would not have had the cohesive nature that they have.” The album includes guest vocals from Taupin’s good friend Brandi Carlile , who sings on “Come on California — a song he originally thought to ask Joni Mitchell to perform on, but Taupin says he told his manager/wife, “I don’t have the balls to call Joni to ask her.” Taupin will play the Grand Ole Opry for the first time on Nov. 7, backed by The Tennessee Stone Cutters, the musicians who accompany him on The Sea Has No Mercy . His appearance will mark his first public musical performance in nearly 30 years. Below, Taupin talks about making the album, what John thinks of the set and why he can’t name a Taylor Swift song. Why make this record now? I d spent two years writing my memoir, which was incredibly cathartic for me. It was almost like being psychoanalyzed and being on the couch in a psychiatrist s office, but I was interviewing myself and trying to recall my life. I literally spent five hours a day on and off for two years writing that book, so it was kind of the blue touchpaper. I d never thought about doing another record in my life after making my last record, which was probably with [his country-rock band] Farm Dogs in ’98. I wanted there to be a great lapse of time, not because I didn t care about the records I ve made in the pa", "date_str": "2026-10-22T14:27:10+00:00", "hash": "54bb69ed6f67319e", "title_fa": "برنی تاپین درباره آلبوم انفرادی جدیدش صحبت می کند، کار با التون جان و اینکه چرا نمی تواند آهنگ تیلور سوئیفت را نام ببرد: «من به رادیو گوش نمی دهم»", "summary_fa": "صرف دو سال برای نوشتن زندگی‌نامه‌اش، پرفروش‌ترین پراکنده سال ۲۰۲۳، و کار بر روی یک مستند آینده، چشمه‌ای خلاقانه را در برنی تاپین به‌وجود آورد. نتیجه اولین آلبوم انفرادی او پس از تقریباً 40 سال و اولین آلبومی است که تاپین، که بیشتر به عنوان شریک نویسندگی التون جان شناخته می شود، تنها توسط خودش نوشته است. The Sea Has No Mercy، به تهیه کنندگی فرانک لیدل، جمعه (23 اکتبر) در Vertigo Records/MCA Nashville منتشر می شود. تاوپین با خنده می گوید: \"الهام خاطرات چیزی را در من ایجاد کرد که باعث شد من چیزهایی را برای خودم به همین شکل بنویسم. اما در همان زمان، ما شروع به ساخت این مستند کردیم، بنابراین مانند یک ترفکتا بود. تقریباً کل این ایده از روش های مختلف ارائه خودم بدون درگیر شدن کامل با خودم بود - که متاسفانه احتمالاً به نظر می رسد.\" تاوپین، 76 ساله، با اشاره به ماهیت بسیار شخصی و انعکاسی آلبوم ادامه می دهد: «می خواستم گذشته، حال و آینده ام را به طور خاص تجسم کنم و تنها راهی که می توانستم انجام دهم نوشتن این آهنگ های زندگی نامه بود. \"این یک تلاش کاملاً 100٪ خودخواهانه بود. اگر افراد دیگری در نوشتن آنها به من کمک می کردند، طبیعت منسجمی که دارند را نداشتند.» این آلبوم شامل آوازهای مهمان از دوست خوب تاوپین، برندی کارلیل است، که در «بیا کالیفرنیا» می خواند - آهنگی که در ابتدا فکر می کرد از جونی میچل بخواهد که در آن اجرا کند، اما تاپین می گوید که به مدیر/همسرش گفته است: «من توپی ندارم که با جونی تماس بگیرم تا از او بپرسم». تاوپین در نوامبر برای اولین بار در گروه Grand Ole Opry بازی خواهد کرد. 7، با حمایت The Tennessee Stone Cutters، نوازندگانی که او را در The Sea Has No Mercy همراهی می‌کنند. ظاهر"}, {"source": "Billboard", "title": "Billboard & Starlite Announce the Return of Billboard No. 1s to Spain in 2026-2027: ‘We’ve Strengthened This Strategic Alliance’", "link": "https://www.billboard.com/music/latin/starlite-billboard-no-1s-to-return-to-spain-in-2026-2027-1236363846/", "summary": "Billboard and Starlite Music Group, the Spanish company that organizes the famous annual festivals in Marbella and Madrid, announced on Tuesday (Oct. 20) that they will collaborate once again on a Billboard No. 1s event in 2026 and 2027, further solidifying the strategic alliance that began last year with the first edition of the Billboard event held outside of the United States. The announcement was made during Billboard Latin Music Week at the Faena Forum in Miami Beach, Florida, in a panel led by Leila Cobo of Billboard and Sandra García-Sanjuán of Starlite Music Group. Related Billboard No. 1s Spain Lights Up Starlite Madrid With Ana Mena, Pablo Alborán More: Here Are the Best Photos Rubén Blades Reflects on His Legacy at Latin Music Week: What I Wrote Was Honest I Still Feel That Way Becky G Talks Baraja Bendita, Sisterhood Why Latino Joy Is So Important at Latin Music Week We ve strengthened this strategic alliance, and Billboard No. 1s returns to Starlite Madrid this Christmas as part of Starlite Occident, which will take place Dec. 11-23. We will be back for this edition, once again serving as the bridge between America and Spain, said García-Sanjuán, co-founder and executive president of Starlite Music Group. It’s going to be three consecutive years, which truly solidifies this bridge and this alliance that we are building together — Billboard and Starlite — to create opportunities for artists, so that Latin artists can have their home in Spain and Spanish artists can gain visibility in America through such an important platform as Billboard , which is the Bible of music, she added. Meanwhile, Cobo, Billboard s co-executive director of content, said: This is also part of our commitment to bring the Billboard brand to other markets, and Spain is obviously the gateway to Europe, so we are very excited about this partnership. The next edition of Billboard No. 1s Spain will take place in December at IFEMA, Madrid, as part of the programming for Starlite Occident Madrid, a series of concerts that spans two weeks in the Spanish capital. The exact date of the event will be announced soon, and the evening will feature performances from artists who have reached the top 10 of the Billboard Hits of the World Spain Songs chart, along with special recognitions. The first edition was held in December 2025 and included performances by international Spanish stars such as Ana Mena, Pablo Alborán, Rozalén, India Martínez and Vanesa Martín, alongside legendary Cuban", "date_str": "2026-10-22T14:20:51+00:00", "hash": "29b0003f17dd251f", "title_fa": "بیلبورد و استارلایت بازگشت بیلبوردهای شماره 1 را به اسپانیا در 2026-2027 اعلام کردند: \"ما این اتحاد استراتژیک را تقویت کرده ایم\"", "summary_fa": "بیلبورد و گروه موسیقی استارلایت، شرکت اسپانیایی که جشنواره‌های سالانه معروف را در ماربلا و مادرید برگزار می‌کند، روز سه‌شنبه (20 اکتبر) اعلام کردند که یک بار دیگر در رویداد شماره 1 بیلبورد در سال‌های 2026 و 2027 همکاری خواهند کرد و اتحاد استراتژیک را که سال گذشته با اولین نسخه از رویداد بیلبورد در ایالات متحده برگزار شد، بیشتر مستحکم می‌کنند. این اعلامیه در هفته موسیقی لاتین بیلبورد در انجمن Faena در میامی بیچ، فلوریدا، در پنلی به رهبری لیلا کوبو از بیلبورد و ساندرا گارسیا-سانجوان از گروه موسیقی استارلایت اعلام شد. شماره بیلبورد مرتبط 1s Spain Starlite Madrid را با آنا منا، پابلو آلبوران روشن می کند بیشتر: در اینجا بهترین عکس ها وجود دارد که روبن بلیدز به میراث خود در هفته موسیقی لاتین منعکس می کند: آنچه نوشتم صادقانه بود من هنوز هم چنین احساس می کنم بکی جی صحبت می کند Baraja Bendita، خواهرخواندگی چرا موسیقی لاتین Joy بسیار مهم است. 1s در کریسمس امسال به عنوان بخشی از Starlite Occident که از 11 تا 23 دسامبر برگزار می شود، به Starlite مادرید بازمی گردد. García-Sanjuán، یکی از بنیانگذاران و رئیس اجرایی گروه موسیقی استارلایت، گفت: ما برای این نسخه باز خواهیم گشت و یک بار دیگر به عنوان پل بین آمریکا و اسپانیا خدمت خواهیم کرد. سه سال متوالی خواهد بود که واقعاً این پل و اتحادی را که با هم می‌سازیم - بیلبورد و استارلایت - برای ایجاد فرصت‌هایی برای هنرمندان مستحکم می‌کند تا هنرمندان لاتین بتوانند خانه خود را در اسپانیا داشته باشند و هنرمندان اسپانیایی بتوانند از طریق پلتفرم مهمی مانند بیلبورد که کتاب مقدس موسیقی است در آمریکا دیده شوند."}, {"source": "Billboard", "title": "Daft Punk Are (Brick) Builders After All in New Collab With Classic Toy Brand", "link": "https://www.billboard.com/music/music-news/daft-punk-lego-collababoration-pyramid-stage-1236364434/", "summary": "A home-brewed father-and-son LEGO set paying homage to retired dance music legends Daft Punk s iconic Pyramid stage has helped spark a new partnership between the house of bricks and the Robot Rock duo. The LEGO Group announced on Thursday morning (Oct. 22) that its new partnership with the French duo aims to inspire and remix fandoms with a pact that promises product, content and brand experiences celebrating the creativity and communities of both brands. Related Queens of the Stone Age Look Road-Ready In Tonight Show Performance: Watch Daft Punk s Thomas Bangalter To Release New Album Of Ballet Music: Hear a Preview The New Video for This 2013 Daft Punk Classic Is an Animated Voyage Through Space The team-up was announced via a short film in which the minifigures representing helmeted French electronic producers Thomas Bangalter and Guy-Manuel de Homem-Christo follow a holographic red brick through a murky landscape until they reach the gates of play that unlock a LEGO brick console. The teaser film is soundtracked by the incessant bass line from Voyager (from 2001 s Discovery album) and the title track from the 2005 LP Human After All . What makes this partnership so special is the enduring appeal both brands share. Like the LEGO brand, Daft Punk inspires generations through creativity, innovation and a deep connection with fans, said LEGO Group chief product marketing officer Julia Goldin in a statement about the partnership. We’re excited to build on these foundations to reimagine the Daft Punk legacy in a fresh and unexpected way, creating something unique that resonates with fans across all ages. This is just the beginning of a bigger journey – a creative collab made for fans ready to lose themselves to play.“ The new collab was spawned through the LEGO Ideas community, which encourages fans to submit their original concepts for sets that could be turned into official LEGO products. In this case, it was a father and son from Luxembourg whose build won the Grand Prize of the LEGO Ideas Music to Our Ears challenge in 2020, where 10,00 supporters helped boost it to the next level of becoming an official LEGO set. Their submission, a recreation of the legendary pyramid-shaped stage from the duo s 2007 Alive tour, began as a family project during the COVID-19 lockdown in 2020, according to Patrick Harboun. This all started as a creative escape during lockdown between my son and I because of our shared love of Daft Punk and LEGO building, he said in a sta", "date_str": "2026-10-22T14:04:39+00:00", "hash": "bbf746b13c4bec66", "title_fa": "دفت پانک بالاخره سازندگان (آجری) در Collab جدید با برند اسباب بازی کلاسیک هستند", "summary_fa": "یک مجموعه لگوی پدر و پسری که در خانه ساخته شده است برای ادای احترام به اسطوره‌های بازنشسته موسیقی رقص استیج نمادین دفت پانک در هرم به جرقه شراکت جدیدی بین خانه آجرها و گروه دو نفره Robot Rock کمک کرده است. گروه LEGO صبح پنجشنبه (22 اکتبر) اعلام کرد که همکاری جدیدش با این دو فرانسوی با هدف الهام بخشیدن و ترکیب مجدد طرفداران با پیمانی است که نوید تجربه محصول، محتوا و برند را برای تجلیل از خلاقیت و جوامع هر دو برند می دهد. کوئینزهای مربوط به عصر حجر در اجرای نمایش امشب آماده هستند: تماشا کنید توماس بنگلتر از دفت پانک برای انتشار آلبوم جدید موسیقی باله: پیش نمایشی را بشنوید ویدیوی جدید برای این دافت پانک کلاسیک 2013 یک سفر متحرک از طریق فضا است. Guy-Manuel de Homem-Christo یک آجر قرمز هولوگرافیک را در یک منظره تاریک دنبال می کنند تا زمانی که به دروازه های بازی می رسند که قفل کنسول آجری LEGO را باز می کند. این فیلم تیزر با خط بیس بی وقفه از Voyager (از آلبوم Discovery 2001) و آهنگ عنوان از LP Human After All در سال 2005 ساخته شده است. چیزی که این همکاری را بسیار خاص می کند، جذابیت پایداری است که هر دو برند به اشتراک می گذارند. جولیا گلدین، مدیر بازاریابی محصول گروه لگو، در بیانیه ای درباره این همکاری گفت، مانند برند LEGO، دافت پانک نسل ها را از طریق خلاقیت، نوآوری و ارتباط عمیق با طرفداران الهام می بخشد. ما هیجان‌زده هستیم که بر روی این پایه‌ها بنا کنیم تا میراث دافت پانک را به شیوه‌ای تازه و غیرمنتظره دوباره تجسم کنیم، و چیزی منحصربه‌فرد خلق کنیم که با طرفداران در تمام سنین طنین‌انداز شود. این فقط آغاز یک سفر بزرگتر است - یک همکاری خلاقانه برای طرفدارانی که آماده اند خودشان را برای"}, {"source": "Billboard", "title": "SZA Launches First of Two Product Drops With Vans Since Becoming the Brand’s First-Ever Artistic Director", "link": "https://www.billboard.com/culture/product-recommendations/sza-vans-collection-vansza-shoes-clothes-shop-online-1236365185/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. SZA is bringing her sartorial design skills to Vans with Vansza, a two-part collection that pairs skater footwear and clothing with outdoor activities like hiking, hunting and fishing. The collaboration marks her debut since becoming Vans&#x2019; first-ever artistic director last year, with the drop arriving Oct. 22, 2026, at Vans retailers and Vans.com . The &#x201C;Kill Bill&#x201D; singer &#x2018;s second Vansza release is scheduled for April 8, 2027. shop full vansza collection here Ahead of the launch, SZA introduced Vansza through an immersive New York Fashion Week experience in New York City on Sept. 10 and 11, offering fans a closer look at the creative vision behind the collaboration. The Drop 1 lineup includes updated classic sneakers, graphic tees, hoodies, denim hunting jackets and sweatpants, while Drop 2 will see camouflage sneakers and split-toe hiking shoes. &#x201C;This collection is really a reflection of how I live and what inspires me every day,&#x201D; says SZA. &#x201C;I wanted to create pieces that feel comfortable, functional, and expressive, whether you&#x2019;re on a trail, in the city or discovering something new about yourself.&#x201D; SHOES Vansza Knu Skool Mule $115 Buy Now at vans $110 Buy Now at foot locker SHOES Vansza Authentic Kickdown Shoe $110 Buy Now at foot locker JACKET Vansza Workwear Trompe L'oeil Crew Neck Fleece $120 Buy Now at vans PANTS Vansza Bug Out Sweatpants $100 buy now at vans TOP Vansza Layer Long Sleeve Top $70 Buy Now at vans HAT Vansza Snapback Hat $40 Buy Now at vans PANTS Vansza Parachute Pant $160 Buy Now at vans SHORTS Vansza Outdoor Oversized Short $110 Buy Now at vans JEANS Vansza Multi-Pocket Denim Pant $175 Buy Now at vans shop full vansza collection here Standouts From SZA&#x2019;s Vansza Vans Collab Designed around comfort, creativity and self-expression, Vansza also features details drawn from SZA&#x2019;s personal wardrobe, including a fleece set printed to resemble a well-worn workwear jacket . &#x201C;I love workwear but sometimes it&#x2019;s just uncomfortable to move around in,&#x201D; says SZA. &#x201C;I made my dream workwear set but for the quintessentially cozy individual like myself lol.&#x201D; Moreover, Vans positions the Vansza Authentic Kickdown", "date_str": "2026-10-22T14:00:00+00:00", "hash": "49e086819e8f776c", "title_fa": "SZA از زمان تبدیل شدن به اولین مدیر هنری برند، اولین محصول از دو محصول خود را با ون ها عرضه می کند.", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. SZA مهارت‌های طراحی طنز خود را به Vans با Vansza می‌آورد، مجموعه‌ای دو قسمتی که کفش‌ها و لباس‌های اسکیت باز را با فعالیت‌های خارج از منزل مانند پیاده‌روی، شکار و ماهیگیری جفت می‌کند. این همکاری اولین بار از زمان تبدیل شدن به اولین مدیر هنری Vans در سال گذشته است، که در 22 اکتبر 2026 به خرده‌فروشان Vans و Vans.com رسید. دومین انتشار Vansza خواننده «Kill Bill» برای 8 آوریل 2027 برنامه ریزی شده است. مجموعه کامل vansza را از اینجا بخرید. 10 و 11، به طرفداران نگاهی دقیق تر به دیدگاه خلاقانه پشت همکاری ارائه می دهد. مجموعه Drop 1 شامل کفش‌های کتانی کلاسیک به‌روز، تی‌های گرافیکی، هودی، ژاکت‌های جین شکار و شلوار گرمکن است، در حالی که Drop 2 کفش‌های کتانی استتاری و کفش‌های پیاده‌روی دوشاخه را مشاهده می‌کند. SZA می گوید: \"این مجموعه واقعاً بازتابی از زندگی من و آنچه که هر روز به من الهام می دهد است.\" من می‌خواستم قطعاتی بسازم که احساس راحتی، کاربردی و گویا کنند، چه در یک مسیر، چه در شهر یا کشف چیز جدیدی در مورد خود.» SHOES Vansza Knu Skool Mule 115 دلار اکنون با ون بخرید 110 دلار اکنون در کمد پا بخرید SHOES Vansza Authentic Kickdown Shoe 110 دلار اکنون در قفسه پا بخرید ژاکت Vansza لباس کار Trompe L'oeil Crew Neck Fleece 120 دلار اکنون در ون‌ها بخرید ون شلوار S10 دلار TOP Vansza Layer Lang Leyer Top 70$ هم اکنون در ون خرید کلاه Vansza Snapback کلاه 40 دلاری خرید در ون PANTS Vansza Parachute Pant 160$ اکنون در"}, {"source": "Billboard", "title": "Former Virgin Music Comms Head Liz Morentin Launches Strategic Communications Agency", "link": "https://www.billboard.com/pro/liz-morentin-entertainment-media-tech-communications-agency/", "summary": "Veteran entertainment communications executive Liz Morentin has launched Greenvalley Media Marketing, a strategic communications agency that will serve entertainment, media and technology companies and their leaders, she announced Thursday (Oct. 22). Related Interscope Geffen A M Promotes Three Amid UMG Restructure Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit Morentin was most recently senior vp and head of global communications and brand strategy at Virgin Music Group. During her run, she led internal and external communications and brand strategy from the company s launch onward, including subsequent acquisitions and integrations. She supported the company s global expansion from 12 markets in 2020 as Ingrooves to 36 markets in 2026 as Virgin Music Group. Prior to that, Morentin served in senior and leadership roles at Warner Bros. Records, Paradigm Talent Agency, Live Nation, RCA Records and Dick Clark Productions. At Greenville, Morentin will partner with brands and their leaders on communications strategy and execution, including corporate communications, media relations, publicity, executive visibility, reputation management, crisis communications, events and industry marketing. She brings more than 25 years of experience spanning music, live events, TV/film and technology. “Our industry has transformed so much over the years making it possible for so many more businesses and executives to achieve global success and become highly regarded global industry players, from indie record labels and distributors to tech platforms and media companies, said Morentin in a statement. I’m launching Greenvalley to support these businesses and executives looking to build their reputation, grow their business, and reach the right audiences. She added, “The agency is named Greenvalley because we believe companies and leaders each have a green space: the distinctive territory where their story, purpose, and opportunity come together. We help clients find that space, build their visibility and reputation, and protect that reputation when it counts.”", "date_str": "2026-10-22T14:00:00+00:00", "hash": "42b8c0ba4fcaf066", "title_fa": "لیز مورنتین، رئیس سابق Comms Music Virgin، آژانس ارتباطات استراتژیک را راه اندازی کرد", "summary_fa": "او پنجشنبه (22 اکتبر) اعلام کرد که لیز مورنتین، مدیر کهنه کار ارتباطات سرگرمی، بازاریابی رسانه ای گرین ولی، یک آژانس ارتباطات استراتژیک را راه اندازی کرده است که به شرکت های سرگرمی، رسانه و فناوری و رهبران آنها خدمت خواهد کرد. Interscope مرتبط Geffen A M سه نفر را در بحبوحه بازسازی UMG تبلیغ می‌کند، دیدی از زندان نیوجرسی به مرکز مشابهی در پنسیلوانیا ویزر منتقل شد تا جایزه Legend of Live را در اجلاس موسیقی زنده بیلبورد 2026 دریافت کند. او در طول فعالیت خود، ارتباطات داخلی و خارجی و استراتژی برند را از راه اندازی شرکت به بعد، از جمله خریدها و ادغام های بعدی، رهبری کرد. او از گسترش جهانی این شرکت از 12 بازار در سال 2020 به عنوان Ingrooves به 36 بازار در سال 2026 به عنوان گروه موسیقی ویرجین حمایت کرد. پیش از آن، مورنتین در نقش‌های ارشد و رهبری در شرکت‌های Warner Bros. Records، Paradigm Talent Agency، Live Nation، RCA Records و Dick Clark Productions خدمت می‌کرد. در گرین‌ویل، مورنتین با برندها و رهبران آن‌ها در استراتژی و اجرای ارتباطات، از جمله ارتباطات شرکتی، روابط رسانه‌ای، تبلیغات، دیده شدن مدیران، مدیریت شهرت، ارتباطات بحران، رویدادها و بازاریابی صنعتی، همکاری خواهد کرد. او بیش از 25 سال تجربه موسیقی، رویدادهای زنده، تلویزیون/فیلم و فناوری را به ارمغان می آورد. مورنتین در بیانیه‌ای گفت: «صنعت ما در طول سال‌ها بسیار متحول شده است و این امکان را برای کسب‌وکارها و مدیران بیشتری برای دستیابی به موفقیت جهانی و تبدیل شدن به بازیگران صنعت جهانی بسیار مورد توجه قرار داده است، از برچسب‌ها و توزیع‌کنندگان مستقل گرفته تا پلتفرم‌های فناوری و شرکت‌های رسانه‌ای."}, {"source": "Billboard", "title": "Watch INK Make Her TV Debut in ‘Fire Country’: ‘I’m All About Painting Where It Ain’t’", "link": "https://www.billboard.com/music/country/ink-tv-debut-fire-country-american-reject-1236364997/", "summary": "INK is no stranger to the limelight. The singer-songwriter has co-written some of the biggest hits of the last decade, including Beyoncé’s “16 Carriages” and the Billboard Hot 100 No. 1 “Texas Hold ‘Em,” as well as Kendrick Lamar and SZA’s Hot 100-topping “Luther. On Friday (Oct. 23), she tries something completely new: she makes her debut in a scripted television series. In the exclusive clip below, INK debuts her new song “American Reject” on CBS’ hit series Fire Country . She appears as the entertainment at Smokey’s Bar in a scene where firefighter Bode Leone, played by Max Thieriot, deals with mounting financial pressures to try to prove that Edgewater’s new volunteer firefighting program can make a difference. “I grew up watching musical guests appear on my favorite TV shows, so having my new single ‘American Reject’ make its debut on Fire Country is a real childhood dream coming full circle,” INK tells Billboard . “There’s something so nostalgic and special about that for me. I started out performing on street corners, never knowing where my gift would take me, and now here I am stepping into a whole new world of storytelling.” The song addresses overcoming adversity and using others’ doubts to fuel your passion. “‘American Reject’ is special to me because it s one that I didn t have to write. It s one that poured out of me within minutes,” she says. “Everything from the story to the rawness, the message, is truly who INK is at the core. I m excited for people to get into the stripped-back layer of my artistry.” INK couldn’t be more pleased with her TV debut, which was written just for her. “They actually wrote me into the script and made room for me to do what I do best,” she says. “As an artist, it really doesn’t get any better than that. I’m all about painting where it ain’t, and Fire Country opened a whole new door for me to do exactly that.” The taping was filled with good vibes, INK says. “What made this experience even more special was how genuinely welcomed I felt,” she says. “Max is a visionary, and he and I hit it off right from jump! The entire cast and crew made me feel right at home. I came in, let my INK spill and they showed me nothing but genuine love.” The song and video officially come out at midnight on Friday, distributed through Vydia. “American Reject” follows Big Buskin , INK’s debut release as a performer, which came out last fall. In addition to the above-mentioned hits, INK co-wrote “Guilty” with Meshell Ndegeocello, “2.0” w", "date_str": "2026-10-22T14:00:00+00:00", "hash": "0009f673bc923aa6", "title_fa": "اولین حضور تلویزیونی INK در «کشور آتش» را تماشا کنید: «من همه چیز در مورد نقاشی جایی که نیست»", "summary_fa": "INK با کانون توجه غریبه نیست. این خواننده و ترانه سرا برخی از بزرگترین موفقیت های دهه گذشته را نوشته است، از جمله \"16 کالسکه\" بیانسه و \"Texas Hold 'Em\" شماره 100 بیلبورد، و همچنین \"Texas Hold 'Em\" در رتبه 100 بیلبورد و همچنین کندریک لامار و SZA's Hot 100 ترانه ای کاملاً جدید به نام \"لوتر\". سریال تلویزیونی با فیلمنامه در کلیپ اختصاصی زیر، INK اولین آهنگ جدید خود \"American Reject\" را در سریال پرطرفدار Fire Country از CBS ارائه می کند. او به عنوان سرگرمی در Smokey’s Bar در صحنه ای ظاهر می شود که در آن آتش نشان Bode Leone با بازی Max Thieriot با فشارهای مالی فزاینده سر و کار دارد تا ثابت کند که برنامه جدید آتش نشانی داوطلبانه Edgewater می تواند تفاوت ایجاد کند. INK به بیلبورد می‌گوید: «من با تماشای حضور مهمان‌های موسیقی در برنامه‌های تلویزیونی مورد علاقه‌ام بزرگ شدم، بنابراین اولین تک‌آهنگ جدیدم «American Reject» در Fire Country رویای واقعی دوران کودکی‌ام است. چیزی بسیار نوستالژیک و خاص در این مورد برای من وجود دارد. من شروع به اجرا در گوشه و کنار خیابان کردم، هرگز نمی دانستم که هدیه ام مرا به کجا خواهد برد، و اکنون در اینجا دارم به دنیای کاملاً جدیدی از داستان سرایی قدم می گذارم. این آهنگ به غلبه بر ناملایمات و استفاده از تردیدهای دیگران برای تقویت اشتیاق شما می‌پردازد. او می‌گوید: «رد آمریکایی» برای من خاص است، زیرا مجبور نبودم آن را بنویسم. این چیزی است که در عرض چند دقیقه از من سرازیر شد. \"همه چیز از داستان گرفته تا خامی، پیام، واقعاً همان چیزی است که INK در هسته اصلی آن قرار دارد. من برای مردم هیجان‌زده هستم که به لایه‌ای از هنر من وارد شوند.\" INK نمی‌توانست از اولین حضورش در تلویزیون، که فقط برای او نوشته شده بود، خوشحال باشد."}, {"source": "Billboard", "title": "Universal Music Group & AI Gaming Company TYGER Announce Licensing Deal", "link": "https://www.billboard.com/pro/universal-music-group-tyger-licensing-agreement/", "summary": "Universal Music Group announced a licensing agreement with TYGER on Thursday (Oct. 22). TYGER utilizes AI to help music adapt in real-time to fan gameplay. The new deal allows for UMG artists to participate, with TYGER users having access to select UMG songs. Related Lucian Grainge Talks AI Guardrails and New Possibilities at Nvidia s Super Bowl of AI Conference Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit TYGER previously had more than 400,000 songs on its platform, primarily with independent artists. The new deal marks their first agreement with a major label. “Gaming is where the next generation spends its time, discovers culture and connects with friends, but music has never had a native way to reach those audiences,” Nick Venti , CEO and cofounder of TYGER, said in a statement. “This agreement with Universal Music Group is an important milestone for TYGER and validates our vision for the future of music in and around interactive and digital experiences. Together, we’re creating new opportunities for players, developers, artists, songwriters and rights holders alike.” Michael Nash , chief digital officer and executive vp at UMG, said, “At UMG, we have a well-established track record of exploring and developing new creative and commercial opportunities that enable our artists, songwriters and labels to better connect with music fans. We believe that music has a more integral role in gaming and through this innovative new licensing agreement with TYGER, our artists and their music will now be able to soundtrack personalized gameplay experiences and connect with millions of gamers and fans around the world.” Earlier this year, UMG also signed a licensing agreement with Spotify for AI remixing on the platform. UMG CEO Lucian Grainge has been public about his sentiments toward artificial intelligence, telling Nvidia executive Richard Kerris on stage at Nvidia’s GTC AI conference in March that, so long as there are guardrails, the technology may prove useful to the music industry. “[We are working on] product partners [in AI] that we’re going to be talking about in the next three, five, 10 years, and that’s [going to be] so powerful, he said at the time. That’s what’s so exciting, and for me, that’s what’s so inevitable [about AI in music].", "date_str": "2026-10-22T13:57:37+00:00", "hash": "c1b203d124e054a7", "title_fa": "گروه موسیقی یونیورسال و شرکت بازی‌های هوش مصنوعی TYGER قرارداد صدور مجوز را اعلام کردند", "summary_fa": "گروه موسیقی یونیورسال روز پنجشنبه (22 اکتبر) یک قرارداد مجوز با TYGER را اعلام کرد. TYGER از هوش مصنوعی برای کمک به موسیقی کمک می کند تا در زمان واقعی با گیم پلی طرفداران سازگار شود. قرارداد جدید به هنرمندان UMG اجازه می دهد تا در آن شرکت کنند و کاربران TYGER به آهنگ های منتخب UMG دسترسی دارند. مربوط به لوسیان گرینج درباره حفاظ‌های هوش مصنوعی و امکانات جدید در کنفرانس سوپر باول هوش مصنوعی انویدیا صحبت می‌کند. در درجه اول با هنرمندان مستقل. قرارداد جدید اولین توافق آنها با یک لیبل بزرگ است. نیک ونتی، مدیرعامل و یکی از بنیانگذاران TYGER در بیانیه‌ای گفت: «بازی جایی است که نسل بعدی زمان خود را سپری می‌کند، فرهنگ را کشف می‌کند و با دوستان ارتباط برقرار می‌کند، اما موسیقی هرگز راهی برای دسترسی به آن مخاطبان نداشته است. \"این توافق با گروه موسیقی یونیورسال نقطه عطف مهمی برای TYGER است و دیدگاه ما را برای آینده موسیقی در داخل و اطراف تجربیات تعاملی و دیجیتال تایید می کند. ما با هم فرصت‌های جدیدی را برای بازیکنان، توسعه‌دهندگان، هنرمندان، ترانه‌سراها و دارندگان حقوق ایجاد می‌کنیم.» مایکل نش، مدیر ارشد دیجیتال و معاون اجرایی UMG، گفت: \"در UMG، ما سابقه ای تثبیت شده در کاوش و توسعه فرصت های خلاقانه و تجاری جدید داریم که هنرمندان، ترانه سراها و برچسب های ما را قادر می سازد تا بهتر با طرفداران موسیقی ارتباط برقرار کنند. ما بر این باوریم که موسیقی نقش مهم تری در بازی دارد و از طریق این قرارداد مجوز جدید و ابتکاری با TYGER، هنرمندان ما و موسیقی آن‌ها اکنون می‌توانند تجربیات شخصی‌سازی شده گیم‌پلی را به صورت موسیقی متن پخش کنند و با میلیون‌ها گیمر و طرفدار در سراسر جهان ارتباط برقرار کنند.» اوایل سال جاری، UMG همچنین یک قرارداد مجوز با Spotify برای ریمیکس هوش مصنوعی در"}, {"source": "Billboard", "title": "Wynonna Judd Says Late Mother Naomi Judd Talked About Death ‘A Lot’: ‘Grief Is Part of Who I Am’", "link": "https://www.billboard.com/music/country/wynonna-judd-mother-naomi-judd-talked-about-death-a-lot-cooper-1236365638/", "summary": "Anderson Cooper has explored the process of grief for more than four years on his emotional podcast All There Is With Anderson Cooper . The nakedly emotional, thoughtful chats with everyone from Travis Barker to Sharon Stone, Charlamagne Tha God and Sara Bareilles delve into the complex web of emotions brought on by loss, and in the latest episode, country star Wynonna Judd opened up about her feelings about the death by suicide of her late mother and The Judds partner, Naomi Judd . She talked about it a lot, Judd said of her mother s frequent discussion of death before her passing on April 30, 2022 . Even to her grandson who’s a deputy, about jumping off a bridge. And she talked about it so much with me. I don’t know who else, besides [Wynonna’s sister] Ashley [Judd], but she talked about it a lot. And I think I got to the point where, ‘no, no, no, no, no, no. You’re not gonna do that. You have too much to live for.’” Judd said she couldn t recall the first time her mom talked about death, because she talked about it so much. She described Naomi, who struggled with depression and mental illness for much of her adult life, calling up and saying, I don t want to be here anymore,' prompting Wynonna to go to her house and spend the night to keep watch over her mother. It was awful, it was really awful, she said. She was really struggling in the end. In announcing their mother s death, Wynonna and sister actress Ashley Judd, were forthcoming about the cause of Naomi s passing. We lost our beautiful mother to the disease of mental illness. We are shattered. We are navigating profound grief and know that as we loved her, she was loved by her public. We are in unknown territory, they said in a statement at the time. Wynonna explores her complex feelings about Naomi on her new album, The Hard Truth , her first LP in a decade and the first since her mother s passing just days before The Judds were inducted into the Country Music Hall of Fame. “My mom’s gone and that whole thing is just — I still go through denial sometimes. I just can’t believe it happened. It’s not supposed to end this way,” Wynonna told Billboard . “I feel like I’m riding a roller coaster and I just went with it. I just couldn’t imagine my life without mom. And when she left, I was so lost and so broken. I had a hard time catching my breath. And yet I showed up the next day to the Hall of Fame and got inducted. And I thought about my mom, that’s the way she raised us. I turned my pain into purpos", "date_str": "2026-10-22T13:10:13+00:00", "hash": "112be43f093a6b8f", "title_fa": "وینونا جاد می‌گوید که نائومی جاد در اواخر عمر مادرش «خیلی زیاد» درباره مرگ صحبت کرد: «غم بخشی از آن چیزی است که من هستم»", "summary_fa": "اندرسون کوپر فرآیند غم و اندوه را برای بیش از چهار سال در پادکست احساسی خود همه چیز با اندرسون کوپر وجود دارد بررسی کرده است. گفتگوهای عاطفی و متفکرانه برهنه با همه از تراویس بارکر گرفته تا شارون استون، شارلامگن تا خدا و سارا باریل به شبکه پیچیده احساسات ناشی از فقدان می پردازد، و در آخرین قسمت، ویونا جاد، ستاره کانتری، احساسات خود را درباره مرگ مادر فقیدش و شریک جودز، نائومی جود، باز کرد. جاد درباره بحث مکرر مادرش در مورد مرگ قبل از مرگش در 30 آوریل 2022 گفت که او در مورد آن زیاد صحبت کرد. حتی به نوه اش که معاون است، در مورد پریدن از روی پل. و او در مورد آن خیلی با من صحبت کرد. نمی‌دانم به جز [خواهر وینونا] اشلی [جاد] چه کسی دیگری، اما او در مورد آن زیاد صحبت کرد. و فکر می کنم به نقطه ای رسیدم که «نه، نه، نه، نه، نه، نه. شما این کار را نخواهید کرد تو چیزهای زیادی برای زندگی کردن داری.» جاد گفت که نمی‌توانست اولین باری را که مادرش درباره مرگ صحبت کرد، به خاطر بیاورد، زیرا او خیلی در مورد آن صحبت کرد. او نائومی را توصیف کرد که در بیشتر دوران بزرگسالی خود با افسردگی و بیماری روانی دست و پنجه نرم می‌کرد، زنگ زد و گفت، دیگر نمی‌خواهم اینجا باشم، واینونا را ترغیب کرد که به خانه‌اش برود و شب را هول‌انگیز بگذراند. او گفت که او در نهایت در حال مبارزه بود. وینونا و خواهر بازیگر اشلی جاد در اعلام مرگ مادرشان علت مرگ نائومی را اعلام کردند. مادر زیبایمان را بر اثر بیماری روانی از دست دادیم. ما متلاشی شده ایم. ما غم و اندوه عمیقی داریم و می دانیم که همانطور که او را دوست داشتیم، او نیز مورد علاقه عموم بود. آنها در"}, {"source": "Billboard", "title": "Ghazi on Empire’s Global Expansion & Latin Music Growth | On the Record", "link": "https://www.billboard.com/video/ghazi-empire-global-expansion-latin-music-growth/", "summary": "Global music has expanded far beyond its borders, with genres like Latin and Afrobeats reaching audiences around the world at a rate like never before. Live from Billboard Latin Music Week, Billboard On the Record host Kristin Robinson is joined by Ghazi, CEO/founder of EMPIRE, to discuss how he has grown the label from a hip-hop-focused company into a global music powerhouse with signings ranging from Latin America, Southeast Asia and North Africa. They explore why Ghazi invested in certain genres before they were fully monetized, and how visa and immigration issues in the U.S. are affecting Latin artists’ touring schedules. Love what you hear? Don’t forget to rate, review and subscribe so you never miss an episode of Billboard On The Record. Follow Billboard On The Record on Instagram, TikTok, Apple Podcasts, Spotify and Youtube @billboard so you never miss an episode. Billboard On The Record is a podcast in partnership with SickBird Productions. Host: Kristin Robinson Executive Producers: Diona DaCosta Jade Watson Produced By: Kayla Forman Mateo Vergara Edited By: Rachel Derbyshire Kristin Robinson All right. Hello, and welcome to this special Latin music week live installment of On the Record, our music business podcast here at Billboard and SickBird Productions. I m your host, Kristen Robinson, and I m joined by Ghazi. Welcome, Ghazi. Ghazi What s up? What s up? What s up? Kristin Robinson Give him a warm welcome. Come on, guys. Alright. Okay. I feel very honored to be with you here today, Ghazi, cause we re gonna talk about kind of the globalization of US music listening. US music consumers are more open to global genres more than ever, and Empire has really pushed into global markets in the last decade. So I wanted to start off by talking about Empire. You got started in 2010. It was primarily hip-hop-bas e slimme maar nogal chaotische juridisch medewerker Deck Shifflet (P.J. Byrne). Hoewel het kantoor nauwelijks kan concurreren met de grote advocatenkantoren, zijn Bruiser en Deck vastbesloten om mensen te helpen die nergens anders terechtkunnen. Mysterieuze dood Wanneer Rudy betrokken raakt bij een zaak rond de mysterieuze dood van een jonge man, komt hij tegenover Leo F. Drummond (John Slattery) te staan. Drummond is een invloedrijke en ervaren advocaat die werkzaam is bij het kantoor waar Rudy eerder werd ontslagen. De zaak draait om mogelijke medische nalatigheid en een machtig ziekenhuis, maar al snel ontdekt Rudy dat er veel meer aan de hand is. Tijdens zijn onderzoek stuit Rudy op tegenstrijdige verklaring na tegenstrijdige verklaring, verdwenen bewijsmateriaal en nou ja, noem het allemaal maar op. Samen met Deck probeert hij de waarheid te achterhalen, maar hoe dichter ze bij de oplossing komen, hoe gevaarlijker hun situatie wordt. Rudy ontdekt dat zijn tegenstanders bereid zijn ver te gaan om hun reputatie en belangen te beschermen. De rechtszaak wordt bovendien extra ingewikkeld doordat Sarah Plankmore (Madison Iseman), Rudy s vriendin, werkzaam is bij het advocatenkantoor van Drummond. Hierdoor komen de twee geliefden tegenover elkaar te staan. Natúúrlijk gaat dat niet goed. Wanneer komt The Rainmaker op Netflix? Seizoen 1 van The Rainmaker ging in augustus 2025 in premiè", "date_str": "2026-10-22T13:48:31+00:00", "hash": "890b2c134346cdfa", "title_fa": "نتفلیکس ناگهان با یک سریال جان گریشام می آید", "summary_fa": "نتفلیکس در حال حاضر مجموعه های ضروری هارلان کوبن را دارد، اما هر کسی که هارلان کوبن را می شناسد به احتمال زیاد جان گریشام را نیز می شناسد. تقریباً از هیچ، سرویس استریم اکنون با سریال جان گریشام نیز عرضه می شود! سریال جان گریشام The Rainmaker در نتفلیکس این باران ساز است، یک سریال مهیج و درام حقوقی آمریکایی بر اساس پرفروش ترین کتاب جان گریشام در سال ۱۹۹۵ به همین نام. این سریال درباره یک وکیل جوان و کم تجربه است که یکی از قدرتمندترین شرکت های حقوقی کشور را به عهده می گیرد. داستان در مورد رودی بیلور (میلو کالاگان)، یک مرد جوان جاه طلب است که به تازگی از دانشکده حقوق فارغ التحصیل شده است. او رویای یک حرفه موفق به عنوان یک وکیل را در سر می پروراند، اما آینده او به زودی تغییری غیرمنتظره پیدا می کند. در اولین روز کارش، او از شرکت حقوقی معتبر تینلی بریت اخراج می شود و ناگهان خود را بدون کار می بیند. رودی در نهایت با جوسلین برویزر استون (لانا پاریلا)، یک وکیل دمدمی مزاج که دفتری بسیار کوچکتر و کمتر سنتی را اداره می کند، شانس جدیدی پیدا می کند. او در آنجا با دستیار حقوقی باهوش اما نسبتاً پر هرج و مرج دک شیفلت (پی جی بیرن) کار می کند. اگرچه این شرکت به سختی می تواند با شرکت های بزرگ حقوقی رقابت کند، Bruiser و Deck مصمم هستند به افرادی که جای دیگری برای مراجعه ندارند کمک کنند. مرگ مرموز هنگامی که رودی درگیر پرونده ای می شود که مربوط به مرگ مرموز یک مرد جوان است، او خود را در مقابل لئو اف. دراموند (جان اسلاتری) می بیند. دراموند یک وکیل با نفوذ و با تجربه است که در شرکتی کار می کند که رودی قبلاً در آن اخراج شده بود. این"}, {"source": "Netflix NL", "title": "Verrassing: nieuw seizoen Het Gouden Uur op Netflix", "link": "https://www.netflix-nederland.nl/verrassing-nieuw-seizoen-het-gouden-uur-op-netflix/", "summary": "Het Gouden Uur is natuurlijk van de NPO, maar op een gegeven moment kocht Netflix de rechten van het eerste seizoen. Over seizoen 2, dat in 2025 uitgezonden werd, hoorden we echter niets. Tot nu! Het Gouden Uur seizoen 2 op Netflix We doen even een stapje terug. Het Gouden Uur is een Nederlandse misdaad- en thrillerserie over Mardik Sardagh (Nasrdin Dchar), een gedreven rechercheur van Afghaanse afkomst die al jarenlang bij de Amsterdamse politie werkt. Als kind vluchtte hij vanwege de oorlog in Afghanistan naar Nederland, waar hij een nieuw leven opbouwde. Inmiddels is hij getrouwd met Michelle en heeft hij een jonge dochter. Hoewel hij zich volledig thuis voelt in Nederland, draagt hij nog altijd herinneringen aan zijn moeilijke jeugd met zich mee. Zijn rustige gezinsleven verandert wanneer hij een verontrustend bericht ontvangt. Zijn oude jeugdvriend Faysal (Abbas Fasaei) blijkt plotseling in Nederland te zijn. De twee kennen elkaar uit Afghanistan, waar ze samen traumatische gebeurtenissen meemaakten. Mardik vermoedt dat de terugkeer van zijn voormalige vriend weinig goeds betekent, maar weet niet precies wat Faysal van plan is. Aanslag in Amsterdam Wanneer Amsterdam een dag later wordt opgeschrikt door een gewelddadige terroristische aanslag, denkt Mardik onmiddellijk dat Faysal erbij betrokken is. Hij begint een onderzoek en probeert zijn jeugdvriend zo snel mogelijk te vinden. De situatie wordt steeds gevaarlijker wanneer blijkt dat er mogelijk meer aanslagen worden voorbereid. Tegelijkertijd krijgt Mardik te maken met AIVD-medewerker Joëlle (Ellen Parren), die onderzoek doet naar zijn verleden. Ze ontdekt dat de rechercheur mogelijk informatie achterhoudt over zijn contacten in Afghanistan. Wanneer de aanslag plaatsvindt, groeit haar wantrouwen en raakt ze ervan overtuigd dat Mardik zelf iets met de gebeurtenissen te maken kan hebben. Nu heeft Het Gouden Uur seizoen 2 dus een releasedatum op Netflix: vanaf 29 oktober aanstaande kun je aan de slag gaan met de nieuwe afleveringen! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Verrassing: nieuw seizoen Het Gouden Uur op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-22T10:49:04+00:00", "hash": "9a6c4a7f68fb0858", "title_fa": "سورپرایز: فصل جدید ساعت طلایی در نتفلیکس", "summary_fa": "ساعت طلایی البته متعلق به NPO است، اما در مقطعی نتفلیکس حقوق فصل اول را خریداری کرد. با این حال، ما چیزی در مورد فصل 2 که در سال 2025 پخش شد، نشنیدیم. هم اکنون شما را می بینیم! فصل دوم ساعت طلایی در نتفلیکس بیایید یک قدم به عقب برگردیم. ساعت طلایی یک سریال جنایی و هیجان انگیز هلندی درباره مردیک سرداغ (ناصرالدین دچار)، کارآگاه رانده شده افغان تبار است که سال ها برای پلیس آمستردام کار می کند. او در کودکی به دلیل جنگ در افغانستان به هلند گریخت و در آنجا زندگی جدیدی ساخت. او اکنون با میشل ازدواج کرده و یک دختر کوچک دارد. اگرچه او در هلند کاملاً در خانه خود احساس می کند، اما همچنان خاطرات دوران سخت کودکی خود را در خود دارد. زندگی آرام خانوادگی او با دریافت یک پیام ناراحت کننده تغییر می کند. دوست قدیمی دوران کودکی او فیصل (عباس فسایی) ناگهان به نظر می رسد که در هلند است. این دو همدیگر را از افغانستان می شناسند، جایی که اتفاقات دردناکی را با هم تجربه کردند. مردیک مشکوک است که بازگشت دوست سابقش نوید خوبی ندارد، اما او مطمئن نیست که فیصل چه برنامه ای دارد. حمله در آمستردام هنگامی که آمستردام یک روز بعد از یک حمله تروریستی خشونت آمیز شوکه می شود، مردیک بلافاصله فکر می کند که فیصل درگیر است. او تحقیقاتی را آغاز می کند و سعی می کند دوست دوران کودکی خود را در سریع ترین زمان ممکن پیدا کند. وقتی به نظر می رسد که ممکن است حملات بیشتری آماده شود، وضعیت به طور فزاینده ای خطرناک می شود. در همان زمان، مردیک باید با کارمند AIVD جوئل (الن پارن) که در حال تحقیق در مورد گذشته خود است، برخورد کند. او متوجه می شود که کارآگاه ممکن است اطلاعات مربوط به تماس"}, {"source": "Netflix NL", "title": "Wraak na schokkende moord in nieuwe thrillerserie op Netflix", "link": "https://www.netflix-nederland.nl/wraak-na-schokkende-moord-in-nieuwe-thrillerserie-op-netflix/", "summary": "Waarschijnlijk ken je de Amerikaanse actrice Gwyneth Paltrow wel, die eigenlijk alleen rollen in films speelt. Nu is (of wordt) ze echter het gezicht van een heuse thrillerserie op Netflix. Netflix wint gevecht om thrillerserie Het verhaal van The Apology draait om Evelyn Amspoker (Paltrow), een vrouw wier leven achttien jaar geleden volledig werd verwoest toen haar zoon werd vermoord. De misdaad veroorzaakte destijds grote opschudding in de Verenigde Staten en kreeg landelijke media-aandacht. Ondanks uitgebreid onderzoek slaagde de politie er nooit in de verantwoordelijke te vinden, waardoor de zaak jarenlang onopgelost bleef. Samen met haar echtgenoot Caleb probeert Evelyn haar leven voort te zetten. Het verdriet om hun zoon blijft (natúúrlijk) echter een grote rol spelen binnen hun huwelijk. Omdat de dader nooit is opgepakt, hebben ze geen antwoorden gekregen op de vragen die hen al bijna twee decennia achtervolgen. Hun leven verandert ingrijpend wanneer een onbekende man plotseling naar voren stapt en bekent dat hij hun zoon heeft vermoord. Voor het eerst in achttien jaar lijkt er een einde te kunnen komen aan de onzekerheid. Evelyn en Caleb hopen eindelijk te ontdekken wat er precies met hun zoon is gebeurd en waarom hij destijds werd vermoord. Nieuwe klap Die hoop verandert echter al snel in woede en ongeloof. Het echtpaar ontdekt namelijk dat de man die de moord heeft bekend mogelijk in aanmerking komt voor een aanzienlijk lagere gevangenisstraf. Voor Evelyn en Caleb voelt dat als een nieuwe klap, omdat ze vrezen dat de verantwoordelijke niet de straf krijgt die hij volgens hen verdient. Evelyn en Caleb besluiten daarop zelf in actie te komen. Ze willen niet langer afhankelijk zijn van een rechtssysteem dat hen volgens hun gevoel in de steek laat. Hun beslissing vormt het begin van een gevaarlijke strijd waarin hun verlangen naar gerechtigheid steeds meer dreigt over te gaan in wraak. Keiharde wraak! Netflix heeft twee seizoenen van The Apology besteld (na een robbertje knokken met een hele hoop andere streamingdiensten), maar het is niet bekend wanneer deze serie precies uit moet komen. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Wraak na schokkende moord in nieuwe thrillerserie op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-21T16:55:14+00:00", "hash": "1023b246d230e8fb", "title_fa": "انتقام پس از قتل تکان دهنده در سریال هیجان انگیز جدید در نتفلیکس", "summary_fa": "احتمالاً بازیگر آمریکایی گوئینت پالترو را می شناسید که در واقع فقط در فیلم ها ایفای نقش می کند. اما اکنون او چهره یک سریال هیجان انگیز واقعی در نتفلیکس است (یا خواهد شد). نتفلیکس در نبرد برای سریال های هیجان انگیز پیروز می شود داستان The Apology حول محور Evelyn Amspoker (پالترو) می چرخد، زنی که زندگی اش هجده سال پیش با قتل پسرش به طور کامل نابود شد. این جنایت در آن زمان در ایالات متحده سر و صدای زیادی به پا کرد و مورد توجه رسانه ملی قرار گرفت. با وجود تحقیقات گسترده، پلیس هرگز نتوانست فرد مسئول را پیدا کند و این پرونده سال ها حل نشده باقی ماند. اولین به همراه همسرش کالب سعی می کند به زندگی خود ادامه دهد. با این حال، غم و اندوه برای پسرشان (البته) همچنان نقش اصلی را در ازدواج آنها ایفا می کند. از آنجایی که مجرم هرگز دستگیر نشد، آنها پاسخی برای سؤالاتی که تقریباً دو دهه است آنها را آزار می دهد، دریافت نکرده اند. زمانی که مردی ناشناس ناگهان جلو می رود و به قتل پسرشان اعتراف می کند، زندگی آنها به طرز چشمگیری تغییر می کند. برای اولین بار در هجده سال گذشته، به نظر می رسد که عدم قطعیت در حال پایان است. ایولین و کالب امیدوارند که بالاخره کشف کنند که دقیقاً چه اتفاقی برای پسرشان افتاده است و چرا او به قتل رسیده است. ضربه جدید اما این امید به سرعت به خشم و ناباوری تبدیل می شود. این زوج متوجه می شوند که مردی که به قتل اعتراف کرده است ممکن است برای مجازات زندان بسیار کمتری واجد شرایط باشد. برای ایولین و کالب، این یک ضربه دیگر به نظر می رسد، زیرا می ترسند که فرد مسئول مجازاتی را که فکر می کنند سزاوار آن است دریافت نکند. اولین"}, {"source": "Netflix NL", "title": "Romantische serie met liefst 26 afleveringen op Netflix", "link": "https://www.netflix-nederland.nl/romantische-serie-met-liefst-26-afleveringen-op-netflix/", "summary": "Tegenwoordig hebben series in de regel maximaal twaalf afleveringen per seizoen, maar vaak minder. Nu heeft Netflix echter de rechten bemachtigd van Find Me in Paris, met één seizoen en maar liefst 26 afleveringen. Dramaserie met 26 afleveringen op Netflix Het verhaal van deze romantische dramaserie (die uit 2018 komt) draait om Lena Grisky (Jessica Lord), een getalenteerde ballerina die in 1905 studeert aan de prestigieuze balletschool van de Parijse Opera. Lena droomt ervan om een beroemde danseres te worden, maar haar toekomst wordt grotendeels bepaald door haar adellijke familie. Wanneer دلفین. Loader Save Story ذخیره این داستان Comment Loader Save Story Save this Story Being Dead با Polyvinyl قرارداد امضا کرده‌اند و اولین آهنگ‌های خود را در دو سال اخیر به اشتراک گذاشته‌اند. «مرد یا اسطوره» قصیده سه‌گانه راک آستین به مارک اورنشتاین، یک قایق‌ران مشهور «مفسر آزاد» است، در حالی که «آکواریوم» درباره «طبیعت تابوی عاشق شدن در محل کار است، که به خصوص اگر محل کار آکواریوم باشد و همکار شما دلفین باشد، رسوایی‌آور است». هر دو با موزیک ویدیوهای کارگردانی شده توسط خود Being Dead's Falcon Bitch عرضه می شوند که می توانید در زیر تماشا کنید. Being Dead در مطالب مطبوعاتی گفت: \"من قصد نداریم روی پلی وینیل فشار زیادی بیاوریم، اما اگر تا دو سال آینده وارد تالار مشاهیر راک رول نشویم، دستمالی می زنیم. با این اوصاف، ما اطمینان کامل داریم که با هم، جهان را تصاحب خواهیم کرد.\" «مرد یا اسطوره / آکواریوم» پس از مارماهی‌های 2024، ال‌پی دومی از Being Dead ساخته جان کانگلتون است. کونگلتون نیز به کار بر روی هر دو آهنگ جدید بازگشت. در مورد مارماهی های شماره 38 در 50 بهترین آلبوم 2024 بخوانید."}, {"source": "Pitchfork", "title": "Daft Punk Are Now Lego", "link": "https://pitchfork.com/story/daft-punk-are-now-lego/", "summary": "And so is the Alive 2007 pyramid", "date_str": "2026-10-22T14:01:08+00:00", "hash": "8cf14f3f27b85dbb", "title_fa": "دافت پانک اکنون لگو هستند", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان ما احتمالاً پنج سال پس از جدایی دوتایی به یک گردهمایی مجدد Daft Punk نزدیک نیستیم - این با وجود شایعات کاملاً بی اساس به علاوه پروژه های قدیمی پس از جدایی - اما اکنون می توانید حداقل وانمود کنید که توماس بنگالتر و گای-ام را در خانه خود بازی می کنند. جدیدترین مجموعه لگو مجموعه دفت پانک را می توان به قرنطینه کووید ردیابی کرد، زمانی که پدر و پسری از لوکزامبورگ به شرکت پیشنهاد کردند که مرحله هرم آلیو تور سال 2007 این دو نفر را بازسازی کند. رندر آن مدل به همراه مینی فیگورهای رسمی لگو این دو دی جی را می توانید در زیر مشاهده کنید. بنگالتر و هوم-کریستو اکنون به بیتلز و اسپایس گرلز می‌پیوندند که در سالنامه موسیقی‌دانانی که به آجر پلاستیکی تبدیل شده‌اند، می‌پیوندند. سدریک هروت، مدیر خلاقیت قدیمی دفت پانک در بیانیه‌ای گفت: «استیج هرمی یکی از شناخته‌شده‌ترین بیان‌های دنیای بصری دفت پانک است، بنابراین به نظر می‌رسد که این طراحی ساخته‌شده توسط طرفداران مرکز این مشارکت باشد.» طرفداران همیشه نقش مهمی در داستان دفت پانک داشته‌اند و ما از دیدن این خلاقیت در دنیای لگو هیجان‌زده هستیم."}, {"source": "Pitchfork", "title": "Talking Heads Announce New Book", "link": "https://pitchfork.com/story/talking-heads-announce-new-book/", "summary": "With essays from Lorde, Debbie Harry, Karl Ove Knausgaard, and more", "date_str": "2026-10-21T23:03:37+00:00", "hash": "c3ba94bf290551ea", "title_fa": "سخنرانان کتاب جدید را اعلام می کنند", "summary_fa": "با مقالاتی از Lorde، Debbie Harry، Karl Ove Knausgaard، و موارد دیگر Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان Talking Heads دارند گروه را دوباره گرد هم می‌آورند—برای یک کتاب جدید. دیوید برن، تینا ویموث، جری هریسون و کریس فرانتز اعلام کردند Talking Heads: New Feeling قرار است در 18 مه عرضه شود. تاریخ انتشار همچنین پنجاهمین سالگرد اولین آلبوم گروه، Talking Heads: 77 را نشان می دهد. هریسون امروز در مصاحبه‌ای با ناشر آبرامز بوکز گفت: «برای این کتاب، اشعار دست‌نویس، طرح‌های آلبوم اصلی و عکس‌های خصوصی را بیرون کشیدیم که برخی از آنها بیش از ۴۰ سال است که از آرشیو ما خارج نشده‌اند. New Feeling دارای مقاله‌های اصلی از هر چهار عضو، به‌علاوه مشارکت‌های لرد، دبی هری، کارل اوو کناسگارد، جف بریجز و غیره است. کتاب جدید همچنین عکس‌های پشت صحنه فیلم کنسرت Stop Making Sense در سال 1984 را جمع‌آوری می‌کند، که برای یک نامزدی محدود در سال 2023 به سینماها بازگشت. قبل از تبلیغ ریمستر فیلم، گروه در دهه‌های گذشته با هم ظاهر نشده بود. این یک ماه بزرگ برای طرفداران Talking Heads بود. در 1 اکتبر، گروه به تفصیل برنامه‌های خود را برای به اشتراک گذاشتن نسخه جدید بازسازی‌شده و فوق‌الوکس سومین آلبوم خود Fear of Music، That LP، که در 13 نوامبر در راینو منتشر می‌شود، با تعدادی نسخه‌های جایگزین، نسخه‌های استودیویی و ضبط کامل منتشر نشده قبلی از دو کنسرت از آن دوران گسترش می‌  آن مکالمه بیرون کشید. ما برای آن زنده می مانیم، و خوب، این دقیقاً همان چیزی است که هوش مصنوعی تهدید"}, {"source": "Pitchfork", "title": "Ben Folds Five Announce First Tour Since 2013", "link": "https://pitchfork.com/story/ben-folds-five-announce-first-tour-since-2013/", "summary": "The trio will be rockin’ a city near you next spring", "date_str": "2026-10-21T17:53:46+00:00", "hash": "2cde03f72e9dc01d", "title_fa": "Ben Folds Five اولین تور خود را از سال 2013 اعلام کرد", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story Save this story پنج نفر اصلی بن فولدز اولین تور خود را پس از 13 سال اعلام کردند. این سه نفر - به رهبری فولدز، رابرت اسلج، دارن جسی - قرار است در بهار آینده نه شهر حومه‌ای در جنوب را به لرزه درآورند و توقف‌های بیشتری نیز اعلام خواهد شد. جدول کامل را می توان در زیر یافت. فولدز پنج را در کنار اسلج و جسی در سال 1993 در چپل هیل، کارولینای شمالی تأسیس کرد (آنها خود را به جای سه نفر به عنوان پنج نام می بردند زیرا صدای بهتری داشت). اوایل امسال، آنها نسخه ای از اولین آلبوم خود را برای سی امین سالگرد انتشار منتشر کردند. در سال 2025، فولدز از سمت مدیر هنری ارکستر سمفونیک ملی پس از تسلط خصمانه ترامپ بر مرکز کندی استعفا داد. Ben Folds Five 2027 اکنون در Ticketmaster بخرید اکنون در Stubhub Ben Folds Five 04-12 Knoxville, TN – Tennessee Theatre 04-13 Chattanooga, TN – Tivoli Theatre 04-15 Jacksonville, FL – Florida Theater Beachtheamppemp, FL, 04-16 04-17 Clearwater, FL – The BayCare Sound 04-20 Austin, TX – ACL Live at The Moody Theatre 04-21 Houston, TX – 713 Music Hall 04-22 Irving, TX – The Pavilion at Toyota Music Factory A4-ALWING 04-AL4"}, {"source": "Pitchfork", "title": "Yung Miami Reveals Full Tracklist for Debut Solo Album", "link": "https://pitchfork.com/story/yung-miami-announces-debut-solo-album-watch-dis-features/", "summary": "The long-awaited Watch Dis features Travis Scott, Summer Walker, Quavo, G Herbo, Lil Baby, Kodak Black, and more", "date_str": "2026-10-21T17:45:06+00:00", "hash": "f63b7108b6183079", "title_fa": "یونگ میامی لیست کامل آهنگ های اولین آلبوم انفرادی را فاش کرد", "summary_fa": "فیلم مورد انتظار Watch Dis شامل Travis Scott، Summer Walker، Quavo، G Herbo، Lil Baby، Kodak Black، و موارد دیگر Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان دو سال پس از جدایی رسمی City Girls برای تمرکز بر حرفه انفرادی مربوطه خود، یونگ میامی سرانجام ورود آلبوم خود را اعلام کرد. او با دو تک آهنگ جدید LP را رهبری می کند: \"F U\" و \"2008\". در زیر، اکنون می‌توانید فهرست آهنگ کامل را بررسی کنید، که مهمانان دیگری از جمله سامر واکر و تراویس اسکات را نشان می‌دهد. و چرا زمانی که در حال انجام آن هستید، «Spend Dat» را اجرا نکنید؟ روز پنجشنبه، 30 سپتامبر، یونگ میامی یک تریلر مناسب و دراماتیک از LP که مدت ها مورد آزار و اذیت قرار گرفته بود را به اشتراک گذاشت. این کلیپ با انتقادات عمومی جو بودن همراه با آکادمیکز آغاز می شود - که اظهار می کند: \"تو در همه چیز در زندگی شکست خوردی، موسیقی که ساختی عجیب است\" - قبل از اینکه میامی پاسخ دهد: \"نمی دانم چگونه بعضی روزها جرات رفتن به استودیو حتی برای ضبط را پیدا کردم. اما یادم می‌آید که تمام احساساتم، تمام آن انرژی و هر آنچه را که احساس می‌کردم، در این آلبوم گذاشتم.» Pitchfork قبلاً فاش کرده بود که Watch Dis در 23 اکتبر اکران خواهد شد و شامل ویژگی‌هایی از Quavo، G Herbo، Lil Baby، Kodak Black، Shenseea، Vybez Kartel و غیره است. ما همچنین اولین جلد هنری را ارائه کردیم. «می‌توانستم با یک آهنگ برگردم و آن را سالم پخش کنم، اما چرا؟» یونگ میامی در بیانیه ای به Pitchfork گفت. \"من به آنچه ساخته ام اطمینان دارم. من برگشته ام تا همه چیز را به نمایش بگذارم و می خواهم همه دیس را تماشا کنند.\" یونگ میامی در سال 2026 جریانی"}, {"source": "Pitchfork", "title": "Chvrches Announce First Album in Six Years and 2027 Tour", "link": "https://pitchfork.com/story/chvrches-announce-first-album-in-six-years-and-2027-tour/", "summary": "The trio will perform material from All The King’s Men on the road come spring", "date_str": "2026-10-21T16:20:36+00:00", "hash": "63e6b61ac886f8d7", "title_fa": "چورچس اولین آلبوم بعد از شش سال و تور 2027 را اعلام کرد", "summary_fa": "این سه نفر متریالی از All The King’s Men on the road اجرا خواهند کرد. All The King’s Men در 22 ژانویه از طریق Futures Music Group وارد می شود و گروه قصد دارد در سال آینده تورهای گسترده ای را برای حمایت از آن برگزار کند. تک آهنگ \"رزها\" که ماه گذشته چورچس آن را منتشر کرد، پیشتاز LP است. لورن مایبری، ایین کوک و مارتین دوهرتی پس از برگزاری تور در پشت آخرین آلبوم خود، Screen Violence در سال 2021، توقف کردند تا دوباره جمع شوند و راهی برای به چالش کشیدن خود در نوشتن ادامه آن بیابند. All The King’s Men نتیجه این جلسات ترانه سرایی است: 11 آهنگ راک مستقل که از Massive Attack، PJ Harvey، Nick Drake، Bert Jansch و Incredible String Band الهام گرفته شده است. پس از انتشار All The King’s Men، چورچس در سراسر ایالات متحده، کانادا، انگلستان، ایرلند و اسکاتلند بومی خود تور خواهد داشت که از 13 فوریه آغاز می شود و تا 6 می ادامه خواهد داشت. لیست کامل تاریخ های تور آنها را در زیر مشاهده کنید. در مورد 200 آلبوم برتر دهه 2010 در مورد The Bones of What You Believe از Chvrches بخوانید. Chvrches: All The King's Men 29.99$ at Rough Trade All The King's Men : 01 Roses 02 Evil 03 Adore You 04 Overthinker 05 Royal Blue 06 Comedown Tomorrow 07 Friend of a Friend 08 Three from Five 09 Conman 10110 in Jamie's Prayers تور اکنون در Ticketmaster بخرید اکنون در Stubhub Chvrches: 02-13 Philadelphia, PA - Franklin Music Hall 02-17 Brooklyn, NY - Brooklyn Steel 02-19 Washington, DC - Anthem 02-20 Pittsburgh, PA - Roxian NY2alo-The, PA - 02-20Buffbury2ater 02-23 تورنتو، انتاریو - تاریخچه 02-25 شیکاگو، IL - نمکدان (داخلی) 02-26 میلواکی، WI - تئاتر ریورساید 02-27 مدیسون، WI - The Sylvee"}, {"source": "Pitchfork", "title": "Snoh Aalegra Unveils New Album With Song Featuring Nile Rodgers and Raphael Saadiq", "link": "https://pitchfork.com/story/snoh-aalegra-unveils-new-album-with-song-featuring-nile-rodgers-and-raphael-saadiq/", "summary": "Listen to “I Love You” from Legendary Love", "date_str": "2026-10-21T16:07:50+00:00", "hash": "0c73afb92234393d", "title_fa": "Snoh Aalegra از آلبوم جدیدی با آهنگی با حضور نیل راجرز و رافائل سعدیق رونمایی کرد.", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Snoh ​​Aalegra اولین آلبوم خود را در نیم دهه اخیر منتشر می کند، Legendary Love. این اعلامیه همراه با آهنگی به نام «دوستت دارم» است که هنرمند ایرانی سوئدی برای آن دو اسطوره را از گوشه‌های مخالف پانتئون R B به خدمت گرفته است: نیل راجرز در گیتار و رافائل سعدیق در باس. «من تو را دوست دارم» را با ویدیویی به کارگردانی آلفرد ماروکین در زیر ببینید. این آلبوم در 13 نوامبر از طریق Stem منتشر می شود. Aalegra درباره LP جدید در یک بیانیه مطبوعاتی گفت: \"فکر نمی‌کنم بزرگترین داستان‌های عاشقانه با مدت زمانی که طول می‌کشند اندازه‌گیری شوند. آنها با اینکه از شما می‌خواهند چه کسی شوید اندازه‌گیری می‌شود. هر آهنگ بخشی از اینکه من بودم، چه کسی شدم و چه کسی خواهم بود ادامه می‌دهم، زیرا به خودم اجازه دادم عمیقاً این را دوست داشته باشم. این عشق من را به دوران موسیقی بازگرداند که در آن بزرگ شدم. همان حسرت، عاشقانه و نوستالژی را داشت که برای اولین بار باعث شد رویای هنرمند شدن را داشته باشم.» \"من تو را دوست دارم\" که آالگرا با همکاری جوئل کامپس نوشت و با کامپس و جاش گرانت تهیه کننده بود، پس از انتشار هفته گذشته \"کارما\"، اولین آهنگ او در سه سال اخیر، منتشر شد. آخرین ال پی او آهنگ های موقت در آسمان های بنفش بود."}, {"source": "Pitchfork", "title": "Angine de Poitrine Set 2027 International Tour", "link": "https://pitchfork.com/story/angine-de-poitrine-set-2027-international-tour/", "summary": "Will they land Angine de Pawtrine to open?", "date_str": "2026-10-21T15:42:52+00:00", "hash": "b3c0e098ff16f819", "title_fa": "تور بین المللی آنژین صدری 2027", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان آنژین دو پوترین حتی تور در حال انجام خود را به پایان نرسانده است اما در حال طراحی دیگری هستند. گروه دونفره راک ریاضی کبکوا در ماه مارس با اولین توقف خود در استرالیا به جاده بازخواهند گشت. از آنجا به تاریخ جشنواره ها و نمایش های سرفصل در آمریکای جنوبی، کانادا، ایالات متحده، اروپا و بریتانیا می روند. این اجرا شامل
