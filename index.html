  <style>

      --tab-border: #232f48;

      --search-bg: #151d30;

      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;

      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;

      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;

    .container {

      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;

    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {

      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;

      from { transform: scale(0.95); opacity: 0; }

    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;

    .btn-close {

      border: none;

      cursor: pointer;
      line-height: 1;
      padding: 4px;

    .btn-close:hover {

    .modal-body {

      border: 1px solid var(--card-border);

      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }

      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

طنز در جریان جنگ ۱۲ روزه پارسال، هنوز در مورد سرنوشت ذخایر اورانیوم غنی‌شده شفاف‌سازی نکرده است. گروسی بهمن ۱۴۰۴ هشدار داده بود که بن‌بست بر سر بررسی ذخایر اورانیوم غنی‌شده با ظرفیت بالا و بازرسی از تأسیسات هسته‌ای بمباران‌شده‌ ایران، نمی‌تواند «تا ابد» ادامه داشته باشد. دونالد ترامپ، رئیس‌جمهور آمریکا، بارها اعلام کرده که با هدف جلوگیری از دستیابی ایران به سلاح هسته‌ای وارد جنگ با جمهوری اسلامی شده است. جی‌دی ونس، معاون رئیس‌جمهور آمریکا، نیز گفته که ایالات متحده با نابود کردن برنامه هسته‌ای ایران به «پیروزی قاطع» دست یافته، اما جنگ باید ادامه پیدا کند تا اطمینان حاصل شود که جمهوری اسلامی توانایی‌های هسته‌ای خود را بازسازی نمی‌کند.", "image_url": "https://gdb.rferl.org/2d004766-c63f-4c94-bd1e-2a679d32217a_cx0_cy10_cw0_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱ آبان • ۲۰:۵۹"}, {"source": "IranWire", "title": "اعتراض کارکنان فروشگاه رفاه؛ یک سال است بیمه پرداخت نشده", "link": "https://iranwire.com/fa/news-1/159261-%D8%A7%D8%B9%D8%AA%D8%B1%D8%A7%D8%B6-%DA%A9%D8%A7%D8%B1%DA%A9%D9%86%D8%A7%D9%86-%D9%81%D8%B1%D9%88%D8%B4%DA%AF%D8%A7%D9%87-%D8%B1%D9%81%D8%A7%D9%87-%DB%8C%DA%A9-%D8%B3%D8%A7%D9%84-%D8%A7%D8%B3%D8%AA-%D8%AD%D9%82%D9%88%D9%82-%D9%88-%D8%A8%DB%8C%D9%85%D9%87-%D9%86%D8%A7%D9%85%D9%86%D8%B8%D9%85-%D9%BE%D8%B1%D8%AF%D8%A7%D8%AE%D8%AA-%D9%85%DB%8C%D8%B4%D9%88%D8%AF/", "summary": "خبرگزاری ایلنا روز جمعه یکم آبان‌ماه ۱۴۰۵ از اعتراض کارکنان فروشگاه‌های زنجیره‌ای رفاه نسبت به پرداخت نامنظم حقوق و قطع بیمه خود", "date_str": "2026-10-23T16:33:17+00:00", "hash": "4bef8065a7309692", "title_fa": "اعتراض کارکنان فروشگاه رفاه؛ یک سال است بیمه پرداخت نشده", "summary_fa": "خبرگزاری ایلنا روز جمعه یکم آبان‌ماه ۱۴۰۵ از اعتراض کارکنان فروشگاه‌های زنجیره‌ای رفاه نسبت به پرداخت نامنظم حقوق و قطع بیمه خود در این گزارش به نقل از کارکنان فروشگاه‌های زنجیره‌ای رفاه آمده است که حقوق آن‌ها حدود یک سال است به‌صورت هفتگی و نامنظم پرداخت می‌شود و گاهی هیچ مبلغی در طول هفته دریافت نمی‌کنند. به‌گفته کارکنان، دریافتی هفتگی بسیاری از آن‌ها ب 0/production/e2ea40d9d15af9bb4696344b25f16389a3c3b8ac-5607x3556.jpg?rect=0,306,5607,2944&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱ آبان • ۱۹:۲۸"}, {"source": "Radio Farda", "title": "یک کشته و پنج زخمی در تیراندازی در حومه پاریس؛ حمله احتمالاً «نژادپرستانه» بود", "link": "https://www.radiofarda.com/a/shooting-at-trappes-near-paris-clearly-a-terrorist-crime/33883128.html", "summary": "بیشتر قربانیان «پیشینه مهاجرتی» داشتند و دادستان‌ها در حال بررسی این موضوع هستند که آیا مهاجم قربانیان را به دلیل «نژاد، قومیت، ملیت یا مذهب» هدف قرار داده یا نه.", "date_str": "2026-10-23T16:00:50+00:00", "hash": "b8641259b1ad0c62", "title_fa": "یک کشته و پنج زخمی در تیراندازی در حومه پاریس؛ حمله احتمالاً «نژادپرستانه» بود", "summary_fa": "بیشتر قربانیان «پیشینه مهاجرتی» داشتند و دادستان‌ها در حال بررسی این موضوع هستند که آیا مهاجم قربانیان را به دلیل «نژاد، قومیت، ملیت یا مذهب» هدف قرار داده یا نه. مردی مسلح روز جمعه اول آبان با تیراندازی از داخل خودروی خود در حومه پاریس، یک نفر را کشت و پنج نفر دیگر را مجروح کرد. گزارش شده که دختری ۱۲ ساله که هشت گلوله به او اصابت کرده نیز جزو مجروحان است. لوران نونیز، وزیر کشور فرانسه، این تیراندازی مرگبار از داخل خودرو را «اقدامی تروریستی» توصیف کرد. علی رابه، شهردار شهر تراپ می‌گوید مهاجم هنگام رانندگی در شهرهای کارگرنشین تراپ و لا وری‌یر در جنوب‌ غرب پاریس، «به‌طور تصادفی تیراندازی می‌کرد و قصد داشت حمام خون به راه بیندازد». یک منبع پلیس به خبرگزاری فرانسه گفت مهاجم حدود ساعت ۱۰:۳۰ صبح به وقت محلی، از داخل خودروی خود به‌صورت رگباری تیراندازی را آغاز کرد. به گزارش خبرگزاری فرانسه، بیشتر قربانیان «پیشینه مهاجرتی» داشتند و دادستان‌ها در حال بررسی این موضوع هستند که آیا مهاجم قربانیان را به دلیل «نژاد، قومیت، ملیت یا مذهب واقعی یا تصورشده آن‌ها» هدف قرار داده است یا نه. به گفته یک منبع آگاه از پرونده، مظنون تیراندازی مردی ۳۹ ساله است که در شهر نزدیک کوآنی‌یر بازداشت شده است. نیکولا دنویل، شهردار لا وری‌یر، فرد مظنون را «دارای ظاهری اروپایی» توصیف کرده است. یک منبع پلیس گفت م power their workforce. In Goldman's baseline scenario, which has productivity rising 15% in the US and other developed economies, the bank sees up to 9% of workers being displaced from their current roles. Last year, Goldmans' chief economist Jan Hatzius said AI could displace 6% to 7% of all US workers . The bank began to float a displacement rate as high as 9% as this summer, which would be equivalent to around 15 million workers who see their jobs disrupted by AI. The job market may also face headwinds from slower hiring overall because of AI adoption, though the hit to overall unemployment will likely be fueled more by outright job losses rather than less hiring, the report added. \"Under our baseline forecasts for near potential growth next year, our estimates suggest that AI labor disruption will likely only gradually increase rather than delivering an abrupt labor market shock,\" Hatzius wrote in a report on Thursday. The US is still in the early stages of AI adoption. Less than a quarter of firms have incorporated AI into regular workflows, Goldman estimates. Hatzius said AI adoption may speed up if the US economy were to enter an economic downturn, citing its analysis of past automation cycles during recessions. \"A more concerning takeaway from our analysis is that a cyclical slowdown would likely accelerate AI-related automation and job losses, thereby amplifying the broader business cycle,\" he wrote. The panic about AI job losses has eased slightly, but the idea that AI could one day decimate entry-level white-collar work is still a fear voiced by some researchers. Layoff announcements ticked lower in September, but AI remains the top cited reason for job cuts , accounting for 21% of all announced layoffs. Job losses in the tech sector also out", "date_str": "2026-10-23T17:26:48+00:00", "hash": "6a08e29d2ef974c1", "title_fa": "گلدمن ساکس می‌بیند که اخراج‌های مبتنی بر هوش مصنوعی تقریباً 10 درصد از کارگران را جابجا کرده است.", "summary_fa": "گلدمن ساکس گف izabeth Holmes documentary is reviving interest in the Theranos scandal. Hulu, Spotify, and Apple all saw audience growth for titles related to the Silicon Valley saga. The \"You Can See Everything\" doc, released on October 16, has quickly become a smash hit. The new smash-hit documentary about disgraced biotech founder Elizabeth Holmes is fueling a fresh wave of fascination with the saga surrounding one of Silicon Valley's biggest scandals. Nathan Fielder and Lance Oppenheim's film, \" You Can See Everything ,\" follows Holmes, the ex-CEO of blood-testing startup Theranos, in the weeks before she began her 11-year prison sentence for defrauding investors. Ahead of the October 16 release of the nearly three-hour documentary, viewers flocked to Hulu's 2022 miniseries, \"The Dropout,\" in which actor Amanda Seyfried starred as Holmes. Streaming hours for the Hulu original show skyrocketed 186% in September over August and then surged 92% the week of \"You Can See Everything's\" release compared to the week prior, a spokesperson for Disney , which owns Hulu, said. The eight-episode series, also available on Disney+, has been streamed for over 2 million hours since September, the spokesperson said. The renewed spotlight on the rise and fall of Holmes' Theranos is also driving listeners back to ABC News' \"The Dropout\" — the true crime podcast on which Hulu's drama was based. Plays of \"The Dropout\" podcast across Spotify and Apple climbed nearly 400% the week the \"You Can See Everything\" teaser trailer was released, from September 7 to September 13, according to data from ABC News provided by the Disney spokesperson. Listenership was up more than 900% over the new film's release weekend and has continued to soar, the spokesperson said, adding that Tuesday saw the highest number of plays in a single day since \"You Can See Everything\" was announced. A Spotify spokesperson told Business Insider that Wednesday marked the \"The Dropout\" podcast's biggest streaming da ش اوکراین استفاده می‌شود - متوقف شد تا ترمینال‌هایی را که با سرعت‌های بالاتری حرکت می‌کنند از دسترسی به این سرویس مسدود شود. رهگیرهای ارتش اوکراین که با پهپادهای روسیه حامل بمب مقابله می‌کنند، ناگهان با سرعت بالا از کار افتادند و حمله روسیه به زیرساخت‌های انرژی این کشور را آسان‌تر کرد و منجر به دو کشته و حداقل 17 زخمی شد. ارتش اوکراین گزارش داد که هیچ هشدار قبلی در مورد محدودیت سرعت Starshield دریافت نکرده است. اما ولودیمیر زلنسکی، رئیس جمهور اوکراین گفت که این پیام مستقیم از سوی ایالات متحده در میان تنش های فزاینده بود. تسلط خطرناک ایلان ماسک با فناوری علم سیاست در فضای بیرونی در حالی که اسپیس ایکس استارشیلد اوکراین را مهار می کند، کارشناسان هشدار می دهند که انحصار عملی ایلان ماسک بر پرتاب و فناوری ماهواره، تهدیدی بزرگ برای امنیت جهانی است. جورجینا توربت، 23 اکتبر 2026، ساعت 5:35 بعد از ظهر UTC به اشتراک گذاری تصویر هدیه: کات ویرجینیا / The Verge, Getty Images Science Policy Tech کنترل خطرناک ایلان ماسک در فضای بیرونی در حالی که SpaceX دریچه ستاره اوکراین را دریغ می کند، کارشناسان هشدار می دهند که ایلان ماسک بالفعل تهدیدی بزرگ برای امنیت جهانی بر پرتاب و ماهواره است. از آن زمان ماسک و ترامپ رد و بدل کرده اند. ماسک ابتدا گفت که اسپیس ایکس کنترلی بر استارشیلد ندارد و تصمیمات توسط ارتش ایالات متحده گرفته می شود، در حالی که کاخ سفید انجام اقدام را رد کرد. سپس گزارش‌هایی منتشر شد مبنی بر اینکه ماسک کسی بود که تاکتیک کاهش سرعت را به ترامپ پیشنهاد کرد، سپس ترامپ آن را پذیرفت و به دنبال آن گزارش دیگری مبنی بر اینکه خود ماسک به‌طور یکجانبه دستور این محدودیت‌ها را صادر کرده بود.", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/03/STKB355_SPACE_X_IPO_B.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱ آبان • ۲۱:۰۵"}, {"source": "Ars Technica", "title": "Crows can evaluate visual info twice as fast as mammals", "link": "https://arstechnica.com/science/2026/10/crows-can-evaluate-visual-info-twice-as-fast-as-mammals/", "summary": "Much of what sent employees a phishing email promising free championship rings in a test of its staff's ability to detect scams, The New York Times reported yesterday. “Congratulations, your Employee Championship Ring is here,” the email sent in late September said, instructing employees to click a link to make a selection from two ring designs. Madison Square Garden employees who clicked that link \"were forced to attend a mandatory cybersecurity class to help satisfy some of [owner James] Dolan’s growing cybersecurity concerns,\" the report said, citing team sources. Dolan is the owner of the Knicks, the New York Rangers, and Madison Square Garden. It's common for corporations to send phishing emails to find out which employees don't pay attention to clues that an email is a scam. A cybersecurity-test email often appears to be from the company itself but includes telltale signs of phishing. For example, Ars Technica owner Condé Nast sends phishing-test messages from email addresses with a misspelled domain, \"condenest.com.\" Read full article Comments", "date_str": "2026-10-23T16:51:59+00:00", "hash": "e833f2c47a0b47c9", "title_fa": "نیکس پیشنهاد جعلی حلقه های قهرمانی در تست فیشینگ را به کارکنان فرستاد: گزارش", "summary_fa": "نیویورک تایمز دیروز گزارش داد که سازمان نیویورک نیکس یک ایمیل فیشینگ به کارمندان ارسال کرد که در آن وعده حلقه های قهرمانی رایگان را در آزمایش توانایی کارکنان خود در شناسایی کلاهبرداری ها می داد. ایمیلی که در اواخر سپتامبر ارسال شد، گفت: «تبریک می‌گویم، حلقه قهرمانی کارمند شما اینجاست. در این گزارش به نقل از منابع تیمی آمده است، کارمندان مدیسون اسکوئر گاردن که روی آن لینک کلیک کردند «مجبور شدند در کلاس امنیت سایبری اجباری شرکت کنند تا به برخی از نگرانی‌های فزاینده [مالک] جیمز دولان در مورد امنیت سایبری کمک کنند». دولان مالک نیکس، نیویورک رنجرز و مدیسون اسکوئر گاردن است. معمولاً شرکت‌ها ایمیل‌های فیشینگ ارسال می‌کنند تا بفهمند کدام کارمندان به سرنخ‌هایی مبنی بر کلاهبرداری یک ایمیل توجه نمی‌کنند. یک ایمیل تست امنیت سایبری اغلب به نظر می رسد از طرف خود شرکت atetime_fa": "۱ آبان • ۱۹:۳۰"}, {"source": "Lifehacker", "title": "I Tested ChatGPT's New 'Slides' Tool, and Here's How It Compares to Gemini", "link": "https://lifehacker.com/tech/chatgpt-slides-versus-google-slides-gemini?utm_medium=RSS", "summary": "ChatGPT's capabilities continue to expand apace, and the latest feature is a fully capable slideshow creator. Announced a few weeks ago, ChatGPT Slides lets you create PowerPoint-style decks from inside your conversations, and it's now appearing for those on the Pro tier and above (meaning right now, you need to spend at least $100 a month to get it). If you're on the free ChatGPT plan or the $20-a-month Plus tier, you can still get ChatGPT to generate downloadable PowerPoint files from the content of your conversations. However, they'll be more basic than those made in the full version of ChatGPT Slides, and there are no collaboration or native edit options. ChatGPT Slides is part of OpenAI's push to give users a complete office suite inside the ChatGPT apps. Pages (the word processor) is already available for Pro tiers and above, while a spreadsheet app is on the way the idea being that you will soon be able to get all your work done without any help from Google or Microsoft. While Chatgpt Slides is only available on pricey plans right now, it's likely to come to lower subscription tiers in the future. But for now, how does the tool compare to what's available in the free and Plus tiers, not to mention what you can do with Gemini inside Google Slides ? I've taken a detailed look. How ChatGPT handles presentations for free and Pro users When it comes to testing out AI tools, it helps to focus on something you're already knowledgeable about so you can spot any mistakes. To test this, I decided to see what ChatGPT could hoover up from the web about the new iPhone Duo. If you're on the free or Plus plans, you can start a conversation, then ask for a slideshow or PowerPoint about it. Plus accounts also have access to a specific Presentations add-on, available via the + (plus) menu in the prompt box, though I get the impression this feature is in a state of flux since ChatGPT Slides arrived. In any case, you can begin asking about the iPhone Duo specs and early online reactions, and then say \"build me a slideshow on the key features and reviews so far\". A slideshow made with a ChatGPT Plus account with a strange iPhone Duo screen mark. Credit: Lifehacker What I got back on the $20 Plus account was a fairly competent slideshow on Apple's foldable, with accurate information as far as I could see, and a simple series of layouts. It looked like something you might whip up from a template if you were in a rush and didn't have time to properly align all the bullet p", "date_str": "2026-10-23T16:30:05+00:00", "hash": "0f25ba9680a6599e", "title_fa": "من ابزار جدید ChatGPT 'Slides' را آزمایش کردم و در اینجا نحوه مقایسه آن با Gemini است.", "summary_fa": "قابلیت‌های ChatGPT به سرعت در حال گسترش است و آخرین ویژگی، ایجاد نمایش اسلاید کاملاً توانا است. چند هفته پیش اعلام شد، اسلایدهای ChatGPT به شما امکان می دهد دک هایی به سبک پاورپوینت از داخل مکالمات خود ایجاد کنید، و اکنون برای افرادی که در سطح حرفه ای و بالاتر هستند ظاهر می شود (به این معنی که در حال حاضر، برای دریافت آن باید حداقل 100 دلار در ماه هزینه کنید). اگر از طرح رایگان ChatGPT یا سطح 20 دلاری در ماه Plus استفاده می کنید، همچنان می توانید ChatGPT را برای تولید فایل های پاورپوینت قابل دانلود از محتوای مکالمات خود دریافت کنید. با این حال، آنها ساده تر از اسلایدهای ساخته شده در نسخه کامل ChatGPT خواهند بود و هیچ گزینه همکاری یا ویرایش بومی وجود ندارد. ChatGPT Slides بخشی از تلاش OpenAI برای ارائه یک مجموعه اداری کامل به کاربران در داخل برنامه های ChatGPT است. Pages (پردازنده کلمه) در حال حاضر برای سطوح حرفه ای و بالاتر در دسترس است، در حالی که یک برنامه صفحه گسترده در راه است که به زودی قادر خواهید بود تمام کارهای خود را بدون هیچ کمکی از Google یا Microsoft انجام دهید. در حالی که اسلایدهای Chatgpt در حال حاضر فقط در برنامه های گران قیمت در دسترس هستند، احتمالاً در آینده به سطوح پایین تری اشتراک خواهند رسید. اما در حال حاضر، چگونه این ابزار در مقایسه با آنچه که در سطوح رایگان و پلاس موجود است، مقایسه می‌شود، نه اینکه بگوییم با Gemini در اسلایدهای Google چه کارهایی می‌توانید انجام دهید؟ من یک نگاه دقیق انداختم چگونه ChatGPT ارائه‌ها را برای کاربران رایگان و حرفه‌ای مدیریت می‌کند وقتی نوبت به آزمایش ابزارهای هوش مصنوعی می‌رسد، به تمرکز روی چیزی که قبلاً در مورد آن آگاهی دارید کمک می‌کند تا بتوانید هر اشتباهی را تشخیص دهید.", "image_url": "https://lifehacker.com/imagery/articles/01M5MDEG0XSF280TC4Y9ZQEC7J/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Google", "Apple"], "datetime_fa": "۱ آبان • ۲۰:۰۰"}, {"source": "Lifehacker", "title": "Why the Holidays Are Actually the Best Time of Year to Start Working Out", "link": "https://lifehacker.com/start-working-out-during-the-holidays?utm_medium=RSS", "summary": "We may earn a commission from links on this page. If you have even the tiniest inkling that you might want to get in shape in the new year or anytime really don t wait until January. This isn't a \"winter arc\" self-improvement pitch; it's just facts. The best time to start a gym habit is before the holiday season. Heck, in December, you ll even have the place mostly to yourself. Sure, technically right now is always the best time to start exercising, but the holiday season is special. If you wait until January, gyms will be packed. The first two weeks of the year, everybody thinks they re at the start of an amazing new fitness habit...and by February, most of them have forgotten all about it. Don t make life harder for yourself by starting during the big rush. Classes will fill up, you ll have to fight people for the squat rack, and it will be hard to have any real fun. So start now. ZICOTO Ultimate Fitness Journal with consistency tracker $13.99 at Amazon Shop Now Shop Now $13.99 at Amazon In October and November, gyms and classes are at more or less their normal capacities. This is a good time to feel out the vibe of a new place. But it gets better: Once December rolls around, the fair-weather gymgoers will be off shopping for gifts after work and attending holiday parties on the weekends. They won t feel like getting out of their warm beds in the morning, either. When you arrive, the squat rack will be free. You ll have your choice of treadmills. The gym will be your oyster. If you start now, you'll have about two months to get up to speed before the rush starts in January. And that is a perfect little time frame to set a small goal and keep it. Vow to hit the gym three times a week, and you ll be able to get in 24 workouts before Christmas, even if you take a few days off for festivities. You can get a lot stronger in 24 workouts. Or run, if that's the fitness journey you're most excited about. If you start a couch-to-5k running plan now, you ll be routinely running 30 minutes at a stretch by the time we get to January. Yes, the holiday season can be busy and stressful, but remember that working out tends to help our brains manage stress . Mark workouts on your calendar, and keep those appointments with yourself. Don t worry about missing out on deals. Any gym or studio that offers a January special probably offers sales year-round anyway. And ultimately, if you get into the habit of actually using the gym, you're getting a lot more value for your money", "date_str": "2026-10-23T15:30:00+00:00", "hash": "5963ebac5bda703d", "title_fa": "چرا تعطیلات در واقع بهترین زمان از سال برای شروع ورزش است؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اگر حتی کوچکترین تصوری دارید که ممکن است بخواهید در سال جدید یا هر زمانی به تناسب اندام برسید تا ژانویه منتظر نمانید. این یک زمین خودسازی \"قوس زمستانی\" نیست. این فقط حقایق است بهترین زمان برای شروع یک عادت ورزشی قبل از فصل تعطیلات است. هک، در ماه دسامبر، شما حتی این مکان را بیشتر برای خودتان خواهید داشت. مطمئنا، از نظر فنی در حال حا ان در اوایل این هفته، یک قاضی نیومکزیکو به متا دستور داد تا 25 میلیارد دلار جریمه به دلیل نقض قوانین حمایت از مصرف کننده آنا ریج بپردازد. 25 میلیارد دلار جریمه هنگفتی است، بزرگ‌ترین جریمه متا که تا به حال با آن مواجه شده است، اما همچنان ما را در WIRED متعجب می‌کند: آیا متا حتی این درد را احساس می‌کند؟ خلاصه ای سریع از پرونده: شکایتی که در سال 2021 ارائه شد، ادعا کرد که این شرکت با دروغ گفتن به کاربران متا در مورد نحوه مدیریت داده های آنها، قانون اقدامات غیرمنصفانه ایالت را نقض کرده است. (بعدها، دادستان کل نیومکزیکو نیز ادعاهایی علیه سیاست های تعدیل محتوای متا مطرح کرد.) در ماه سپتامبر، هیئت منصفه به نفع ایالت رای داد. سپس جریمه چند میلیارد دلاری رسید. سی جی ماهونی، مدیر ارشد حقوقی متا در بیانیه ای گفت: «این حکم و رویکرد دادستان کل برای اجرای آن، انجام تجارت در ایالت نیومکزیکو را غیرممکن می کند. این دادخواست در اصل خود به دنبال اعمال مالیات بر سخنرانی است تا قوانین جدیدی را برای آنچه مردم می توانند به صورت آنلاین بیان کنند، اعمال کند. ما مطمئن هستیم که در دادگاه تجدید نظر پیروز خواهیم شد.» مشکلات حقوقی متا در سال جاری به قدری زیاد شده است که پیگیری آنها دشوار است. در اوایل سال جاری در نیومکزیکو، هیئت منصفه حکم داد که شرکت رسانه های اجتماعی باید 375 میلیون دلار برای نقض قانون اعمال ناعادلانه ایالت بپردازد. آن کارآزمایی با ایمنی کودکان مرتبط بود.", "image_url": "https://media.wired.com/photos/6ada8957133035a6bb08c0f2/191:100/w_1280,c_limit/Business_How%20Many%20Billions%20Would%20It%20Take%20to%20Hold%20Meta%20Accountable_v1.jpg", "category": "هوش مصنوعی مولد", "tags": ["Meta"], "datetime_fa": "۱ آبان • ۱۸:۳۰"}, {"source": "Zoomit", "title": "نبرد خاموش TSMC با انحصار چین بر عناصر خاکی کمیاب", "link": "https://www.zoomit.ir/tech/469625-tsmc-seeks-rare-earth-alternatives/", "summary": "تی‌اس‌ام‌سی در حال بررسی جایگزین‌های عناصر خاکی کمیاب در تجهیزات کارخانه‌ای برای کاهش خطرات ناشی از محدودیت‌های صادراتی چین است.", "date_str": "2026-10-23T15:15:00+00:00", "hash": "7628a225e1f803dd", "title_fa": "نبرد خاموش TSMC با انحصار چین بر عناصر خاکی کمیاب", "summary_fa": "تی‌اس‌ام‌ olin as Mitt, Jay's deceased father, from whom he was estranged. That's the whole reason he dives in the first place; he's diving to find his father's remains. Wildwood Wildwood. Storytide Release date: October 23 in theaters Stop-motion studio LAIKA's latest film, \"Wildwood,\" is based on the 2011 novel of the same name, written by Colin Meloy and illustrated by Carson Ellis. Both the film and the book follow Prue, a teenager, whose baby brother, Mac, is stolen by a pack of birds and taken into a mystical forest. She, along with her classmate Curtis, ventures into the woods to rescue Mac and perhaps save this magical land. Prue is voiced by Peyton Elizabeth Lee and Curtis is voiced by Jacob Tremblay. Carey Mulligan, Mahershala Ali, Awkwafina, Jake Johnson, Angela Bassett, Charlie Day, and Amandla Stenberg also star. Klara and the Sun Klara and the Sun. Alfred A. Knopf Release date: October 23 in theaters Kazuo Ishiguro's 2021 novel \"Klara and the Sun\" was longlisted for the Booker Prize upon its publication. The book takes place in a not-too-distant dystopian future where rich children can be gifted \"Artificial Friends\" to help them socialize, since now all schooling is done at home, online. Klara, the narrator, is purchased for a sick girl named Josie. I", "date_str": "2026-10-23T14:45:53+00:00", "hash": "1107c9bce8b381a8", "title_fa": "13 کتابی که امسال باید قبل از تبدیل شدن به فیلم و برنامه تلویزیونی بخوانید", "summary_fa": "Timothée Chalamet در فیلم Dune بازی می کند. برادران وارنر برخی از پر هیاهوترین فیلم‌های سال 2026 بر اساس رمان‌های پرفروش ساخته شده‌اند. هنوز چند هفته فرصت دارید تا \"Dune Messiah\" را قبل از \"Dune: Part Three\" بخوانید. چند کتاب تعطیلات نیز در حال اقتباس هستند. هر کتاب دوستی می‌داند که خبر یک اقتباس می‌تواند پیچیده باشد: آیا می‌توانیم به کارگردان‌ها، فیلمنامه‌نویسان و بازیگران اعتماد کنیم تا داستان‌های مورد علاقه‌مان را زنده کنند؟ فهرست فیلم‌های امسال پر از کتاب‌هایی است که برای هزاران خواننده نزدیک و عزیز هستند، از جمله کتاب‌های کلاسی ceremonies and receptions — some disastrous, others impeccable. Throughout the years, I've also watched couples make the same mistakes over and over. Here are a few I wish they'd avoid. Filling the day-of schedule with way too much Couples have to find time for the ceremony, photos, eating and drinking, dancing, talking to the people they invited, and connecting with each other. When you try to fit too many things into the day, no one — especially the married couple — has time to breathe and relish the moments. The day can feel rushed and more focused on activities than the celebration of love. A packed schedule often leaves couples stressed, with no time to eat because they've been pushed from one 15-minute window to the next. However, your wedding day shouldn't be a blur. You should have time to soak in every moment. When you map out your day, prioritize traditions you love and estimate how long each will take … then add buffers. I also recommend working with a wedding planner or coordinator to plan your timeline, or consulting with your photographer and other vendors when arranging your schedule. They've experienced countless weddings and know firsthand how much time each activity usually takes. Letting small mishaps and issues ruin the whole day Learning how to laugh off the small mishaps is absolutely key. Courtesy of Cameron Dever One of the things I always tell my couples right before their wedding day is that something will go wrong. I don't say this to scare them or make them worry, but mostly to adjust their expectations. No matter how much planning you do, people are imperfect, the weather can be unpredictable, and life happens. By the time the day comes, couples have done all they can to make sure it's how they pictured it. All that matters after that is that they enjoy their wedding. Missing flowers or a cake that's the wrong flavor can throw off your day — but these unexpected mishaps shouldn't be so consuming that they're all you remember from your wedding. I don't ", "date_str": "2026-10-23T14:44:18+00:00", "hash": "3960dfd8a44e6acd", "title_fa": "بیش از یک دهه است که از عروسی عکاسی کرده ام. در اینجا 4 تا از بزرگترین اشتباهاتی که می بینم زوج ها مرتکب می شوند آورده شده است.", "summary_fa": "من در دهه گذشته انواع عروسی ها را دیده ام، اما بسیاری از زوج ها اشتباهات مشابهی را انجام می دهند. با حسن نیت از Cameron Dever من سال ها به عنوان عکاس عروسی کار کرده ام و زوج ها را دیده ام که اشتباهات مشابهی انجام می دهند. بسیاری از مردم هر روز برنامه ریزی می کنند و فرصت لذت بردن از عروسی خود را ندارند. عدم تخصیص بودجه برای عکاس و فیلمبردار مناسب می تواند به نتایج ناامیدکننده ای منجر شود. من بیش از یک دهه است که از عروسی ها عکاسی می کنم، بنابراین شاهد مراسم و پذیرایی های بی شماری بوده ام - برخی فاجعه بار، برخی دیگر بی عیب و نقص. در طول سال‌ها، من زوج‌ها را بارها و بارها مشاهده کرده‌ام که اشتباهات مشابهی انجام می‌دهند. در اینجا چند مورد است که ای کاش آنها از آنها اجتناب می کردند. پر کردن برنامه روزانه با بیش از حد زیاد زوج ها باید برای مراسم، عکس، خوردن و آشامیدن، رقصیدن، صحبت کردن با افرادی که دعوت کرده اند و ارتباط با یکدیگر وقت پیدا کنند. وقتی سعی می کنید چیزهای زیادی را در روز بگنجانید، هیچ کس - به خصوص زوج متاهل - وقت برای نفس کشیدن و لذت بردن از لحظات ندارند. این روز ممکن است عجله داشته باشد و بیشتر بر فعالیت‌ها متمرکز باشد تا جشن عشق. یک برنامه فشرده اغلب زوج ها را تحت فشار قرار می دهد و زمانی برای غذا خوردن ندارند زیرا آنها از یک پنجره 15 دقیقه ای به پنجره بعدی فشار آورده اند. با این حال، روز عروسی شما نباید تار باشد. شما باید در هر لحظه زمانی برای غوطه ور شدن داشته باشید. وقتی روز خود را ترسیم می کنید، سنت هایی را که دوست دارید اولویت بندی کنید و تخمین بزنید که هر کدام چقدر", "image_url": "https://i.insider.com/68483fcd85e81483682bc5fc?width=1200&format=jpeg", "category": "سینما و سریال", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۸:۱۴"}, {"source": "Business Insider", "title": "Volvo plans to cut 2,500 jobs due to China's bruising pricing war", "link": "https://www.businessinsider.com/volvo-layoffs-job-cuts-china-pricing-pressure-2026-10", "summary": "Legacy automakers are struggling to compete in China. Bloomberg/Getty Images Legacy carmakers continue to report slumping sales in China. Volvo is the latest. It's planning 2,500 global job cuts to save about $530 million. America is a problem, too. Tariffs, crushed EV incentives, and Polestar's exit also hurt. China's merciless car market is taking a bite out of Volvo. On Friday, the Swedish luxury automaker said revenue in China fell by almost 50% over the past year. The company said, like many legacy premium automakers, it's facing increasing \"hypercompetition\" from Chinese competitors. Volvo plans to cut 2,500 jobs globally in response, it said, including roughly 2,000 in Sweden. That's part of an effort to slash costs by about $530 million. \"We continue to operate in a very tough environment with strong external challenges: de-globalisation, hypercompetition and climate change,\" CEO Håkan Samuelsson said in a statement. It's the latest stark example of the increasing pressure on legacy automakers in China. Several big-name car companies — including Volkswagen, BMW, and Mercedes-Benz — have recently reported slowing sales from their Chinese dealerships. Volvo is majority-owned by Geely Auto Group, a Chinese automaking conglomerate. The company said the reductions will be made by a combination of ending consultant contracts, natural attrition, and targeted employee exit packages. China is not Volvo's only problem. The company also said that US tariffs and the loss of Washington's consumer incentives for electrified cars squeezed margins. Volvo previously bet heavily on a rapid consumer transition to electric vehicles, aiming for an all-electric portfolio by 2030 . It's since walked back that goal to include plug-in hybrid vehicles. The automaker also said that Polestar — its EV offshoot that is exiting the US market — also posted losses. Volvo's answer is to get more local: the automaker said it would introduce two fresh cars tailored specifically for the Chinese market by the middle of next year. Those cars will be developed in close collaboration with Geely and will include a Chinese tech stack and advanced driver-assist technologies \"to make them fully competitive in China.\" Read the original article on Business Insider", "date_str": "2026-10-23T14:40:10+00:00", "hash": "4392be7c42a001df", "title_fa": "ولوو قصد دارد 2500 شغل خود را به دلیل جنگ قیمت گذاری کبود در چین اخراج کند", "summary_fa": "خودروسازان قدیمی برای رقابت در چین با مشکل مواجه هستند. بلومبرگ/گتی ایماژ خودروسازان قدیمی همچنان از کاهش فروش خود در چین خبر می دهند. ولوو جدیدترین است. در حال برنامه ریزی برای 2500 کاهش شغل جهانی برای صرفه جویی در حدود 530 میلیون دلار است. آمریکا هم مشکل دارد. تعرفه‌ها، مشوق‌های کاهش‌یافته خودروهای برقی و خروج Polestar نیز صدمه دیده است. بازار خودروهای بی‌رحم چین در حال لقمه‌ای از ولوو است. روز جمعه، این خودروساز لوکس سوئدی اعلام کرد که درآمد چین در سال گذشته تقریباً 50 درصد کاهش یافته است. این شرکت گفت، مانند بسیاری از خودروسازان ممتاز قدیمی، با افزایش \"فوق العاده رقابت\" از سوی رقبای چینی مواجه است. ولوو اعلام کرد که قصد دارد در پاسخ به این اقدام 2500 شغل در سطح جهان از جمله حدود 2000 شغل در سوئد را تعدیل کند. این بخشی از تلاش برای کاهش حدود 530 میلیون دلاری هزینه ها است. هاکان ساموئلسون، مدیرعامل این شرکت در بیانیه‌ای گفت: «ما در یک محیط بسیار سخت با چالش‌های خارجی قوی به فعالیت خود ادامه می‌دهیم: جهانی‌زدایی، رقابت بیش از حد و تغییرات آب و هوایی.» این آخرین نمونه واضح از افزایش فشار بر خودروسازان قدیمی در چین است. چندین شرکت خودروسازی بزرگ - از جمله فولکس واگن، بی‌ام‌و و مرسدس بنز - اخیراً کاهش فروش را از نمایندگی‌های چینی خود گزارش کرده‌اند. اکثریت ولوو متعلق به گروه خودروسازی جیلی، یک مجموعه خودروسازی چینی است. این شرکت گفت که این کاهش ها با ترکیبی از پایان دادن به قراردادهای مشاور، فرسایش طبیعی و بسته های هدفمند خروج کارکنان انجام خواهد شد. چین تنها مشکل ولوو نیست. این شرکت همچنین گفت که تعرفه های ایالات متحده و از دست دادن مشوق های مصرف کننده واشنگتن برای خودروهای برقی باعث کاهش حاشیه سود شده است. ولوو قبلاً روی انتقال سریع مصرف‌کنندگان به خودروهای الکتریکی شرط‌بندی", "image_url": "https://i.insider.com/6adb62b2dc67b5b4d01f6d01?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۸:۱۰"}, {"source": "Business Insider", "title": "I spent years building a 'stable' life and climbing the ladder at work. Then, I quit my job and moved to Hungary.", "link": "https://www.businessinsider.com/left-well-paying-job-moved-countries-making-less-money-happier-2026-10", "summary": "I always loved Budapest, but never thought I d actually be able to move here. Sarah Catherine Cowie I spent my 20s climbing the career ladder and building the life of my dreams in Scotland. Then, after losing my dad, I decided to make a big change: I moved abroad and went back to school. I've been struggling financially, but I know that I made the right choice. For most of my 20s, I wanted to climb the career ladder — and hoped that as soon as I reached the top, everything would become clear and I would live happily ever after. My life felt like it was headed in the right direction. I was on a steady, exciting career trajectory in the climate policy field. I even bought my first flat in an up-and-coming area of Edinburgh. Then, my dad was diagnosed with terminal cancer in late 2022. The next few years were spent grappling with his illness and, eventually, his death. I quickly felt the whole ecosystem of my life fall apart. I was struggling at work, and I didn't know how to ask for help. I tried my best to carry on as normal and try to convince myself that the work I was doing — and, by extension, myself — was important. As I edged toward my 30th birthday in early 2025, against a backdrop of grief and burnout, the need for change felt urgent and existential. I made a drastic change I decided to go back to school in a new country. Sarah Catherine Cowie It was shortly after this, in the spring, that I decided a move abroad was exactly what I needed. I quit my job and spent the next few months sending applications to schools across Europe, hoping to pursue a master's degree in my field and embark on a fresh start. When an offer came from a university in Budapest, I knew that was where I would be going. I had visited for the first time about a decade prior, and fallen in love. I remember thinking, \"I could see myself living here one day,\" not thinking that that \"one day\" would ever actually come. In September, I packed up my life, started renting out my Edinburgh flat, and made the move. The first few months brought a mix of excitement, fear, and disbelief. There was a lot of bureaucracy to navigate — forms to fill out, applications to be processed — and I couldn't relax until everything was completed. I was also pretty lonely in the beginning. When I first moved, I didn't know a single person in Budapest and had to build a completely new social circle from scratch. I also sometimes felt like an imposter: I was a lot older than the fresh-faced students in their", "date_str": "2026-10-23T14:40:01+00:00", "hash": "58ce9fce011b104c", "title_fa": "من سالها صرف ساختن یک زندگی «پایدار» و بالا رفتن از نردبان کار کردم. سپس کارم را رها کردم و به مجارستان رفتم.", "summary_fa": "من همیشه بوداپست را دوست داشتم، اما هرگز فکر نمی کردم واقعا بتوانم به اینجا نقل مکان کنم. سارا کاترین کاوی من 20 سالگی خود را با بالا رفتن از نردبان شغلی و ساختن زندگی رویاهایم در اسکاتلند گذراندم. سپس، پس از از دست دادن پدرم، تصمیم گرفتم تغییر بزرگی ایجاد کنم: به خارج از کشور نقل مکان کردم و به مدرسه بازگشتم. من از نظر مالی با مشکل مواجه شده ام، اما می دانم که انتخاب درستی کردم. در بیشتر 20 سالگی‌ام، می‌خواستم از نردبان شغلی بالا بروم - و امیدوار بودم که به محض رسیدن به اوج، همه چیز روشن شود و تا ابد با خوشحالی زندگی کنم. زندگی من احساس می کرد که در مسیر درستی قرار دارد. من در یک مسیر شغلی ثابت و هیجان انگیز در زمینه سیاست آب و هوا بودم. من حتی اولین آپارتمانم را در یک منطقه رو به رشد ادینبورگ خریدم. سپس، در اواخر سال 2022 تشخیص داده شد که پدرم به سرطان ترمینال مبتلا شده است. چند سال بعد با بیماری و در نهایت مرگ او دست و پنجه نرم کرد. به سرعت احساس کردم کل اکوسیستم زندگیم از هم پاشید. در محل کارم مشکل داشتم و نمی دانستم چگونه کمک بخواهم. من تمام تلاشم را کردم تا به طور معمول ادامه دهم و سعی کردم خودم را متقاعد کنم که کاری که انجام می‌دهم - و در نتیجه، خودم - مهم است. همانطور که در اوایل سال 2025 به 30 سالگی رسیدم، در پس زمینه ای از غم و اندوه و فرسودگی، نیاز به تغییر ضروری و وجودی احساس می شد. تغییری اساسی ایجاد کردم و تصمیم گرفتم در کشوری جدید به مدرسه برگردم. سارا کاترین کووی مدت کوتاهی پس از آن، در بهار، تصمیم گرفتم که مهاجرت به خارج از کشور دقیقا همان چیزی است که به آن", "image_url": "https://i.insider.com/6ada2ac62a1b5bc156b1aff1?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۸:۱۰"}, {"source": "Business Insider", "title": "Celebrity deaths in 2026: Remembering the famous people we lost this year", "link": "https://www.businessinsider.com/celebrity-deaths-famous-people-who-died-2026", "summary": "Tom Skerritt. Mat Hayward/Getty Images Actors James Van Der Beek, Hayden Panettiere, Robert Duvall, Chuck Norris, Tom Skerritt, and Eva Marie Saint died in 2026. So did musicians Dolly Parton and Duncan Sheik. Civil rights leader Rev. Jesse Jackson, activist Gloria Steinem, and NFL Hall of Famer Mike Ditka also died this year. Below, we look back at the celebrities we lost in 2026, listed in alphabetical order. Scott Adams, 68 Scott Adams. Michael Macor/Getty Images Scott Adams worked at a telephone company in the 1980s. The experience inspired his beloved comic strip, \"Dilbert.\" By the end of the decade, the character and his satirical office humor began appearing in comic strips. At its peak, \"Dilbert\" was syndicated in over 2,000 newspapers. A cartoon series debuted in 1999, running for two seasons. Adams gained notoriety when he began writing blog posts praising Donald Trump during his 2016 presidential run. In 2023, \"Dilbert\" was pulled from newspapers across the US following racist comments made by Adams. Adams died on January 13 from metastatic prostate cancer . Brad Arnold, 47 Brad Arnold. Scott Gries/ImageDirect/Getty Images The lead singer of 3 Doors Down, Brad Arnold launched the group into fame with the 2000 rock anthem \"Kryptonite,\" which peaked at No. 3 on the Billboard Hot 100 that year. The success led to other hits like \"Loser,\" \"Here Without You,\" and \"When I'm Gone.\" Arnold's vocal range and lyrics focused on love and love lost, which fueled the group to stardom. Arnold died on February 7 from a type of kidney cancer. Afrika Bambaataa, 68 Afrika Bambaataa. Paul Natkin/WireImage/Getty A hip-hop pioneer during the 1970s and 1980s, Lance Taylor, known professionally as Afrika Bambaataa, first gained attention as a DJ in the Bronx. He signed with Tommy Boy Records in 1981 and released landmark songs like \"Jazzy Sensation\" and \"Planet Rock.\" He would go on to influence the likes of Queen Latifah and A Tribe Called Quest throughout his career. Bambaataa founded the hip-hop awareness group, Universal Zulu Nation, in the 1970s to steer kids away from gang life. Bambaataa stepped down as the head of the organization in 2016 after accusations of sexual abuse . Bambaataa denied all claims. He died on April 9 due to prostate cancer . Rob Bass, 59 Rob Bass. Al Pereira/Michael Osche Archives/Getty Images One of the icons responsible for bringing hip-hop to the mainstream, Rob Bass crafted the iconic track \"It Takes Two\" alongside DJ E-Z Rock. The trac", "date_str": "2026-10-23T14:36:32+00:00", "hash": "26449fe59fd90d89", "title_fa": "مرگ افراد مشهور در سال 2026: به یاد افراد مشهوری که امسال از دست دادیم", "summary_fa": "تام اسکریت مت هیوارد/گتی ایماژ بازیگران جیمز ون در بیک، هیدن پانتییر، رابرت دووال، چاک نوریس، تام اسکریت و اوا ماری سنت در سال 2026 درگذشتند. دالی پارتون و دانکن شیک نیز موسیقیدانان. کشیش جسی جکسون، رهبر حقوق مدنی، گلوریا استاین
