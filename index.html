mere sweaters , I ranked Naadam and Quince among my favorites. But you've got to brace for conflict when your two favorites are against each other, because all's fair in love and capitalism. Pointed ads from Quince, with captions such as \"Like Naadam, without the price tag,\" provoked Naadam's social media manager to clap back with a playful campaign of memes on Instagram . Quince, to my disappointment, chose not to engage. This ended the feud with barely a wisp of smoke. A need for closure compelled me into trying one cashmere crewneck from each brand. May the best sweater win, I say. Gabrielle Chase/Business Insider In one corner we have Quince , a San Francisco-based direct-to-consumer apparel and home goods company best known for offering luxury fabrics at competitive prices. Its affordable cashmere collection also includes skirts, dresses, sweatpants, and cozy beanies. Over on the East Coast we have Naadam, AKA \"the world's fairest cashmere,\" whose original claim to fame was the $75 Cashmere sweater (which was raised to $98 in about October of 2023). Cashmere is Naadam's primary specialty , and they offer different tiers that go from premium to luxe. It took a few days of consistent wear and a close inspection of their materials before I ultimately declared Naadam my first choice. Quince's sweater just didn't have the same brushed softness. Even a year later, Naadam proved to be the winner. Quince's Mongolian Cashmere Crewneck Sweater Quince s $50 Cashmere Crewneck is undeniably high-quality, but it s slightly thinner than Naadam s. Gabrielle Chase/Business Insider The super soft Quince Mongolian Cashmere Crewneck Sweater feels more expensive than it is, and it's obvious why it's such a hit. Still, I could feel that it's slightly thinner than Naadam's. Of course, the price tag on Quince's 100% Grade-A Mongolian cashmere is attractive when you see practically identical these sweaters are. The patterns are the exact same (unless I'm really nitpicking — Quince's neckline is bound with a seam that looks slightly more unfinished and liable to fray). But the quality is there and consistent with other pieces I tried for our Quince cashmere", "date_str": "2026-09-13T11:00:01+00:00", "hash": "e087b97dfa4d37c3", "title_fa": "نادم در مقابل ترمه کوینس: من 2 ژاکت را مقابل هم قرار دادم تا ببینم کدام یک بهتر است", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید Gabrielle Chase/Business Insider اگر از علم صنعت ترمه مستقیم به مصرف کننده آگاه نیستید، بگذارید به شما بگویم: همه چیز گرم و مبهم نیست. هنگامی که بیش از ده ها یقه و ژاکت کش باف پشمی را برای یافتن بهترین ژاکت های کشمیری آزمایش کردم، Naadam و Quince را در میان مورد علاقه هایم قرار دادم. اما باید خود را برای درگیری آماده کنید زمانی که دو مورد علاقه شما در برابر یکدیگر قرار دارند، زیرا همه چیز در عشق و سرمایه داری منصفانه است. تبلیغات اشاره‌ای از Quince، با زیرنویس‌هایی مانند «مثل نادام، بدون برچسب قیمت»، مدیر رسانه‌های اجتماعی Naadam را برانگیخت تا با کمپین بازیگوشی از میم‌ها در اینستاگرام دست بزند. کوینس، در کمال ناامیدی من، تصمیم گرفت که شرکت نکند. این به دشمنی با کمی دود پایان داد. نیاز به بسته شدن من را وادار کرد تا از هر برند یک یقه ترمه را امتحان کنم. من می گویم که بهترین ژاکت برنده شود. Gabrielle Chase/Business Insider در گوشه ای ما Quince را داریم، یک شرکت پوشاک و کالاهای خانگی مستقر در سانفرانسیسکو که مستقیماً به مصرف کنندگان می رسد و به دلیل ارائه پارچه های لوکس با قیمت های رقابتی شناخته شده است. مجموعه ترمه مقرون به صرفه آن نیز شامل دامن، لباس، شلوار گرمکن، و لوبیای دنج است. در ساحل شرقی، نادام، با نام مستعار \"عادلانه ترین ترمه جهان\" را داریم، که ادعای اصلی او برای شهرت ژاکت ترمه 75 دلاری بود (که در اکتبر 2023 به 98 دلار افزایش یافت). ترمه تخصص اصلی Naadam است و آنها طبقات مختلفی را ارائه می دهند که از درجه یک به لوکس می رسد. چند روز استفاده مداوم و بازرسی دقیق از مواد آنها طول کشید تا اینکه"}, {"source": "Business Insider", "title": "YouTuber Markiplier's movie made over $50 million. Here's his advice for creators looking to level up.", "link": "https://www.businessinsider.com/markiplier-advice-youtuber-dont-need-hollywood-creator-help-level-up-2026-9", "summary": "YouTube creator Markiplier, whose real name is Mark Fischbach. Natasha Campos/Getty Images for Mark Markiplier Fischbach YouTuber Markiplier independently released a box-office hit, \"Iron Lung,\" earlier this year. He hopes more content creators will try to take on Hollywood projects without ceding control. He said YouTubers are a \"powerful entity that hold sway and a lot of eyeballs.\" YouTuber Markiplier thinks more creators can break into Hollywood without giving up control. The 37-year-old put it to the test earlier this year, when he wrote, directed, and starred in the film \"Iron Lung.\" He funded the movie's low 7-figure budget himself, and it became a box-office hit that grossed over $50 million worldwide. His takeaway was that more creators should try to enter traditional media on their own, so long as they're ready to learn and wear many hats — and take on their own financial risk. \"In Hollywood, it is kind of like a foregone conclusion that you'll have to give up all control to be able to do anything,\" the YouTuber, whose real name is Mark Fischbach, told Business Insider. \"I'm like, 'No, I don't think that should be.'\" A decade ago, when social media was still an emergent format, many influencers viewed a TV show deal or a movie role as a sign they'd made it. Content creators like Liza Koshy and Bretman Rock signed on to do TV shows, but YouTube success didn't always translate to TV ratings, and the results were mixed. For every web series that became a TV darling, like Comedy Central's \"Broad City,\" there was a project that stalled out and was canceled, such as NBC's late-night show from YouTuber Lilly Singh. YouTube's gains in recent years have flipped the creator-to-TV pipeline. YouTube has become the top destination on US TV screens, reaching over 14% market share and crushing competitors like Netflix and Disney, according to Nielsen. Former TV stars like Don Lemon, Alton Brown, and Tucker Carlson are building large audiences as independent creators on YouTube and other platforms. The shift in audience to YouTube has given its top creators more power relative to Hollywood, said Fischbach, who has nearly 40 million subscribers. \"YouTubers as a conglomerate are this powerful entity that hold sway and a lot of eyeballs are always on them,\" he said. Creators have power, but distributing a film in theaters or selling a TV show is a different skillset entirely. Fischbach thinks creators, who are used to mastering new formats and come from a DIY cultu", "date_str": "2026-09-13T10:30:03+00:00", "hash": "8895947562355866", "title_fa": "فیلم مارکیپلیر یوتیوبر بیش از 50 میلیون دلار فروش داشت. در اینجا توصیه او برای سازندگانی است که به دنبال ارتقاء سطح هستند.", "summary_fa": "خالق یوتیوب Markiplier که نام اصلی او مارک فیشباخ است. ناتاشا کامپوس/ گتی ایماژ برای Mark Markiplier فیشباخ یوتیوب Markiplier به طور مستقل در اوایل سال جاری یک فیلم موفق باکس آفیس به نام Iron Lung منتشر کرد. او امیدوار است که سازندگان محتوا بیشتر تلاش کنند تا پروژه های هالیوود را بدون واگذاری کنترل انجام دهند. او گفت که یوتیوب‌برها «موجود قدرتمندی هستند که قدرت و چشم‌های زیادی را در دست دارند». YouTuber Markiplier فکر می کند که سازندگان بیشتری می توانند بدون دست کشیدن از کنترل به هالیوود نفوذ کنند. این مرد 37 ساله در اوایل سال جاری با نویسندگی، کارگردانی و بازی در فیلم «ریه آهنی» آن را مورد آزمایش قرار داد. او بودجه 7 رقمی کم فیلم را خودش تأمین کرد و به یک فیلم موفق در گیشه تبدیل شد که بیش از 50 میلیون دلار در سراسر جهان فروخت. نکته اصلی او این بود که سازندگان بیشتری باید سعی کنند خودشان وارد رسانه های سنتی شوند، تا زمانی که آماده یادگیری و استفاده از کلاه های زیادی باشند - و ریسک مالی خود را بپذیرند. یوتیوبر که مارک فیشباخ نام اصلی او است، به Business Insider گفت: «در هالیوود، این یک نتیجه از پیش تعیین شده است که باید تمام کنترل خود را کنار بگذارید تا بتوانید هر کاری انجام دهید. یک دهه پیش، زمانی که رسانه‌های اجتماعی هنوز یک قالب نوظهور بود، بسیاری از اینفلوئنسرها به یک برنامه تلویزیونی یا یک نقش سینمایی به عنوان نشانه‌ای از موفقیت خود نگاه می‌کردند. سازندگان محتوا مانند لیزا کوشی و برتمن راک برای اجرای برنامه‌های تلویزیونی ثبت نام کردند، اما موفقیت YouTube همیشه به رتبه‌بندی تلویزیونی تبدیل نشد و نتایج متفاوت بود. برای هر سریال وبی که تبدیل به یکی از عزیزان تلویزیونی شد، مانند «شهر وسیع» کمدی سنترال، پروژه‌ای وجود داشت که متوقف شد و لغو"}, {"source": "Business Insider", "title": "Grandma's 72 and still working to support her children — and theirs", "link": "https://www.businessinsider.com/more-grandparents-raising-grandchildren-delaying-retirement-supporting-children-rent-mortgage-2026-9", "summary": "Joann Ernst has played a motherly role in her grandchildren s lives. Roy de la Cruz for BI Joann Ernst, 72, shook her head as her older grandson decapitated an action figure. The other laid out puzzle pieces in a line, surrounded by a sea of toys. \"You have to put all the Play-Doh back in the container so it doesn't dry out,\" Ernst called out to the 5- and 7-year olds. Ernst is not the boys' legal guardian . She's spent the past two years living with her son Jack, helping with her grandsons on weekends. Jack had struggled to work after losing an arm in an accident, so Ernst took a job in the special education department of a local school, paid his rent, and spent weekends shopping for the boys and disciplining them \"as a mother would.\" Ernst watches on as her son, Jack, helps the boys with their technology. Roy de la Cruz for BI In June, she moved back to Oregon from Connecticut. She needed to help her daughter, Joanna, with her children in the same way she's been helping Jack and his boys. \"I wish I could just be a grandmother, but I also discipline, school them, feed them, and provide a home for them,\" Ernst said. \"I enjoy it immensely, but I'm unable to retire, and my retirement money is slowly being spent.\" For some grandparents, helping adult children through illness, job loss, addiction, or other crises means taking on far more than occasional babysitting. They become the family's financial and practical backstop, spending down savings, delaying retirement , or going back to work to help support both adult children and grandchildren. Business Insider wants to hear from grandparents caring for their grandchildren and older Americans caring for younger loved ones. Share your story by filling out this quick form . This year, Business Insider has spoken with more than 60 grandparents and great- grandparents raising young children or helping adult children get back on their feet, just when they thought they'd be retiring. Some have legal custody of their grandchildren. Others, like Ernst, have no official parenting roles but pay bills, provide care, and prepare them for a good life. Census data show that more than 1.1 million US grandparents 60 and older were at least part-time caregivers for their grandchildren as of 2024. The boys have been treated to many gifts by their grandmother. Roy de la Cruz for BI \"Where is my Barbie?\" her older grandson asks. \"Barbie is long gone,\" Ernst replies, adding that she threw her out after her leg fell off. \"She's in t", "date_str": "2026-09-13T10:30:02+00:00", "hash": "98823943a0eea786", "title_fa": "مادربزرگ 72 ساله است و هنوز برای حمایت از فرزندانش - و فرزندان آنها - کار می کند", "summary_fa": "جوآن ارنست در زندگی نوه هایش نقشی مادرانه داشته است. روی د لا کروز برای BI Joann Ernst، 72 ساله، در حالی که نوه بزرگترش یک چهره اکشن را از بدن جدا می کرد، سرش را تکان داد. دیگری تکه های پازل را در یک خط، که توسط دریایی از اسباب بازی ها احاطه شده بود، چید. ارنست به بچه های 5 و 7 ساله گفت: \"شما باید تمام Play-Doh را دوباره در ظرف قرار دهید تا خشک نشود.\" ارنست قیم قانونی پسران نیست. او دو سال گذشته را با پسرش جک زندگی کرده است و آخر هفته ها به نوه هایش کمک می کند. جک پس از از دست دادن بازوی خود در یک تصادف برای کار به سختی کار می کرد، بنابراین ارنست در بخش آموزش ویژه یک مدرسه محلی مشغول به کار شد، اجاره خانه خود را پرداخت کرد و آخر هفته ها را صرف خرید برای پسران و تنبیه آنها \"مثل یک مادر\" کرد. ارنست مراقب است که پسرش جک به پسرها در زمینه فناوری کمک می کند. روی د لا کروز برای BI در ماه ژوئن، او از کانکتیکات به اورگان بازگشت. او باید به دخترش، جوآنا، با فرزندانش کمک کند، همانطور که به جک و پسرانش کمک می کند. ارنست می‌گوید: «ای کاش می‌توانستم فقط یک مادربزرگ باشم، اما آنها را هم نظم می‌دهم، به آنها درس می‌دهم، به آنها غذا می‌دهم و خانه‌ای برایشان فراهم می‌کنم. من از این کار بی نهایت لذت می برم، اما نمی توانم بازنشسته شوم و پول بازنشستگی من کم کم خرج می شود.» برای برخی از پدربزرگ‌ها و مادربزرگ‌ها، کمک به کودکان بالغ در گذر از بیماری، از دست دادن شغل، اعتیاد یا سایر بحران‌ها به معنای انجام کارهای بسیار بیشتر از مراقبت از کودک است. آنها به پشتوانه مالی و عملی خانواده تبدیل می شوند، پس"}, {"source": "Business Insider", "title": "A 43-year-old with colon cancer used AI in 3 ways to help make treatment a little easier", "link": "https://www.businessinsider.com/man-with-colon-cancer-uses-ai-to-manage-his-symptoms-2026-9", "summary": "Russ Read-Barrow was diagnosed with colon cancer. Russ Read-Barrow Russ Read-Barrow was diagnosed with stage 4 colon cancer after seeing blood in his poop. Using Claude, he built a chemotherapy symptom tracker to help him recall what made him feel better. Read-Barrow asks AI to create a summary of his health history for new medical providers. Russ Read-Barrow has been living with incurable stage four colon cancer for five years. The 43-year-old former PR director and father of two from the UK was diagnosed with the disease in 2021. After seeing blood in his poop around six times over the course of a few weeks, he got a colonoscopy. With multiple rounds of chemotherapy and surgeries to remove cancerous cells from his colon, liver, and later his lungs, Read-Barrow's doctors have stopped the cancer from spreading further since 2022. He still needs regular chemotherapy, roughly every three months, to slow cell division and prevent further growth in his lungs and liver. \"The chemo I'm having now is doing a good job of keeping it under control, but at some point that'll change and I'll have to have something else,\" Read-Barrow told Business Insider. Over the years, Read-Barrow has experimented with using AI to help manage the symptoms , medications, and emotional challenges that have become part of his life. In 2025, he launched a side project called FcancerwithAI, a blog where he shares his story and the AI cancer tools he's built. \"I'm not saying AI is going to cure cancer. I'm saying it's going to help me remember what my consultant said, spot patterns in my side effects, and maybe give me back some control in a situation where control is basically an illusion,\" he wrote in a blog post . He hopes that by sharing what has helped him, he can help others, as rates of colon cancer cases in those under 50 have risen since the mid-1990s, making it the deadliest cancer in this age group. However, if spotted early, the survival rate for colon cancer is high, meaning, like Read-Barrow, more and more people are living with cancer as a chronic illness. Here are three ways Read-Barrow has used AI to manage his ongoing cancer treatment . Chemotherapy symptom tracker Russ-Barrow will need chemo for the foreseeable future. Afterwards, he typically experiences side effects like fatigue, nausea, and changes to his mood and sleep habits, which can be hard to cope with. \"The hardest part day-to-day is trying to manage the energy windows I do have,\" he said. He started recording", "date_str": "2026-09-13T10:30:01+00:00", "hash": "c8e0dd4eb97ec9bf", "title_fa": "یک مرد 43 ساله مبتلا به سرطان روده بزرگ از هوش مصنوعی به 3 روش استفاده کرد تا درمان را کمی آسان تر کند", "summary_fa": "راس رید بارو به سرطان روده بزرگ مبتلا شد. راس رید بارو راس رید بارو پس از مشاهده خون در مدفوع خود به سرطان روده بزرگ مرحله 4 مبتلا شد. او با استفاده از کلود، یک ردیاب علائم شیمی درمانی ساخت تا به او کمک کند آنچه را که باعث شده احساس بهتری داشته باشد، به خاطر بیاورد. Read-Barrow از هوش مصنوعی می خواهد که خلاصه ای از تاریخچه سلامتی خود را برای ارائه دهندگان پزشکی جدید ایجاد کند. راس رید بارو پنج سال است که با سرطان روده بزرگ در مرحله چهار غیر قابل درمان زندگی می کند. مدیر روابط عمومی سابق 43 ساله و پدر دو فرزند از بریتانیا در سال 2021 به این بیماری مبتلا شد. پس از دیدن خون در مدفوع خود در طول چند هفته حدود 6 بار، کولونوسکوپی شد. پزشکان رید بارو با چندین دوره شیمی‌درمانی و جراحی برای برداشتن سلول‌های سرطانی از روده بزرگ، کبد و بعداً ریه‌های او، از گسترش بیشتر سرطان از سال 2022 جلوگیری کردند. او هنوز به شیمی درمانی منظم، تقریباً هر سه ماه یکبار، نیاز دارد تا تقسیم سلولی را کاهش دهد و از رشد بیشتر در ریه ها و کبدش جلوگیری کند. رید بارو به بیزینس اینسایدر گفت: «شیمی درمانی که در حال حاضر مصرف می‌کنم کار خوبی برای کنترل آن انجام می‌دهد، اما در برخی مواقع این تغییر خواهد کرد و من باید چیز دیگری داشته باشم. طی سال‌ها، Read-Barrow با استفاده از هوش مصنوعی برای کمک به مدیریت علائم، داروها و چالش‌های احساسی که بخشی از زندگی او شده‌اند، آزمایش کرده است. در سال 2025، او یک پروژه جانبی به نام FcancerwithAI راه اندازی کرد، وبلاگی که در آن داستان خود و ابزارهای سرطان هوش مصنوعی ساخته شده را به اشتراک می گذارد. او در یک پست وبلاگی نوشت: \"من نمی گویم که هوش مصنوعی"}, {"source": "Business Insider", "title": "My listing sat for 4 months. Marketing it as a multigenerational home got 2 offers in a day.", "link": "https://www.businessinsider.com/luxury-real-estate-multigenerational-homes-family-trend-2026-9", "summary": "Scheryl W. Glanton outside the property she sold as a multi-generational home. Courtesy of Scheryl W. Glanton Real estate agent Scheryl W. Glanton had trouble selling a 5,100-square-foot home with seven bedrooms. She had an \"aha moment\" and repositioned the property as a multi-generational home . Offers arrived within 24 hours, and Glanton is awaiting closing later this month. This story is based on an interview with Scheryl W. Glanton , 74, a real estate agent from Philadelphia . It has been edited for length and clarity. It was getting frustrating. Despite at least 20 showings of my listing in suburban Philadelphia, no one made an offer. We put the 5,100-square-foot Tudor-style property, built in 1925, on the market in April 2026. I hoped it would sell relatively quickly for the $1m asking price. It was an estate sale, the area had good schools, and the neighborhood was highly sought after. Do you live in a multi-generational household? Please email Jane Ridley at jridley@businessinsider.com to share your story with Business Insider. However, whenever I asked the buyers' agents why their clients weren't interested, they said the same thing: \"It's too much house.\" They said the seven-bedroom, five-and-a-half-bathroom home was too large for one family, regardless of whether they were planning to have more kids. I decided to market it as a multigenerational home Glanton, who has worked in real estate for seven-and-a-half years. Courtesy of Scheryl W. Glanton Everything else — such as its long history, a third-of-an-acre plot, stone walls, and light interior — made it a beautiful option. Four months went by, and there was no movement. Then, in August, I had what can only be described as an \"aha moment.\" The three-story house had two distinct wings and included two sitting rooms on the second floor, two en-suite bedrooms, and a Jack-and-Jill bathroom. It also had two separate entrances, two staircases, and a four-car garage. The place struck me as being perfectly set up for multi-generational living. If I wanted a sale, I needed to lower the price to $875K and pivot. So I repositioned the listing. This time, I marketed it toward young parents and grandparents who wanted to be under the same roof with privacy, too. I got offers immediately Within a day, I got two offers from multigenerational families , with one on hold in case they fell through. The successful buyers, who are paying close to the asking price, were a couple from Los Angeles, their two children", "date_str": "2026-09-13T10:13:01+00:00", "hash": "e4f9d1d0e12ba8fa", "title_fa": "لیست من به مدت 4 ماه ماندگار شد. بازاریابی آن به عنوان یک خانه چند نسلی 2 پیشنهاد در روز داشت.", "summary_fa": "شریل دبلیو گلنتون خارج از ملکی که به عنوان خانه چند نسلی فروخت. شریل دبلیو گلنتون، نماینده املاک و مستغلات شریل دبلیو گلنتون در فروش خانه ای به مساحت 5100 فوت مربع با هفت اتاق خواب مشکل داشت. او یک \"لحظه آها\" داشت و ملک را به عنوان یک خانه چند نسلی تغییر مکان داد. پیشنهادات ظرف 24 ساعت رسید و گلنتون در انتظار بسته شدن در اواخر این ماه است. این داستان بر اساس مصاحبه با شریل دبلیو گلنتون، 74 ساله، یک مشاور املاک از فیلادلفیا است. برای طول و وضوح ویرایش شده است. داشت ناامید کننده می شد. با وجود حداقل 20 نمایش از فهرست من در حومه فیلادلفیا، هیچ کس پیشنهادی نداد. ما ملک 5,100 فوت مربعی به سبک تودور را که در سال 1925 ساخته شد، در آوریل 2026 در بازار عرضه کردیم. من امیدوار بودم که نسبتاً سریع با قیمت درخواستی 1 میلیون دلار به فروش برسد. فروش ملک بود، این منطقه مدارس خوبی داشت، و محله بسیار مورد توجه بود. آیا در یک خانواده چند نسلی زندگی می کنید؟ لطفاً به جین ریدلی به آدرس jridley@businessinsider.com ایمیل بزنید تا داستان خود را با Business Insider به اشتراک بگذارید. با این حال، هر وقت از نمایندگان خریداران می‌پرسیدم که چرا مشتری‌ها علاقه‌ای ندارند، همان‌ها را می‌گفتند: خانه خیلی زیاد است. آنها گفتند که خانه هفت خوابه و پنج و نیم حمام برای یک خانواده خیلی بزرگ است، صرف نظر از اینکه آنها قصد دارند بچه های بیشتری داشته باشند یا خیر. من تصمیم گرفتم آن را به عنوان یک خانه چند نسلی گلنتون، که هفت سال و نیم در املاک و مستغلات کار کرده است، به بازار عرضه کنم. با حسن نیت شریل دبلیو گلنتون هر چیز دیگری - مانند تاریخ طولانی آن، زمینی به مساحت یک هکتار، دیوارهای سنگی و فضای داخلی سبک -"}, {"source": "Business Insider", "title": "Read the memo: PwC US is planning big changes to its offshore structure in India", "link": "https://www.businessinsider.com/pwc-us-paul-griggs-memo-overhaul-india-offshoring-center-2026-9", "summary": "PwC is making changes to its offshore delivery center model. Artur Widak/NurPhoto via Getty Images PwC US is shaking up its offshore delivery center model in India. The US firm is planning a joint venture with PwC India, merging its offshore center with its India operation. The move will improve access to talent and technology, CEO Paul Griggs said in a memo to staff. PwC US is overhauling its offshore delivery structure in India, bringing its local operations closer to PwC India's consulting business. The US firm and PwC India plan to form a new joint venture that will merge PwC US's India-based offshoring hubs — known as Acceleration Centers, or ACs — with PwC India's consulting arm, according to an internal memo sent to staff on Saturday by the US CEO, Paul Griggs . Those hubs provide specialist talent and overnight support to US teams and operate independently of PwC India's operations. Creating a joint venture will help PwC compete more effectively as a global network, Griggs said in the memo. The tie-up would drive growth and create new opportunities, improve access to talent and capabilities, and bring the firm's \"technology, engineering and AI capabilities together at greater scale,\" said Griggs. PwC announced the agreement early Sunday morning after Business Insider contacted the company. Neither PwC US nor PwC India responded to requests for comment. The transaction is expected to close in the first half of 2027, subject to closing conditions and regulatory approvals, the memo said. Paul Griggs, CEO of PwC US Mandel NGAN / AFP via Getty Images Professional services firms have long used offshoring centers in lower-cost regions such as India, Argentina, and the Philippines. The hubs help firms keep client costs down, tap specialist skills, and offer round-the-clock delivery. During a consulting or auditing project, US-based employees send non-client-facing work to offshore teams in different time zones to be completed overnight. A PwC US consultant told Business Insider that they turn to PwC India when the India AC does not have enough capacity. But doing so can create delays, because the firms must renegotiate rates and terms of the work. The joint venture could speed up that process by removing \"the middle man, PwC AC,\" they said. The joint venture also signals closer collaboration between PwC's US and Indian firms — a meaningful shift for a network built around separate national member firms. Like its fellow Big Four competitors —KPMG, Deloitte,", "date_str": "2026-09-13T10:08:45+00:00", "hash": "9cd45baef7c5bb6e", "title_fa": "این یادداشت را بخوانید: PwC US در حال برنامه‌ریزی تغییرات بزرگ در ساختار فراساحلی خود در هند است", "summary_fa": "PwC در حال ایجاد تغییراتی در مدل مرکز تحویل دریایی خود است. Artur Widak/NurPhoto از طریق Getty Images PwC US مدل مرکز تحویل دریایی خود را در هند تغییر می دهد. این شرکت آمریکایی در حال برنامه ریزی سرمایه گذاری مشترک با PwC India است که مرکز فراساحلی خود را با عملیات هند ادغام می کند. پل گریگز، مدیرعامل این شرکت در یادداشتی به کارکنان گفت: این حرکت دسترسی به استعدادها و فناوری را بهبود می بخشد. PwC US در حال بازسازی ساختار تحویل دریایی خود در هند است و فعالیت های محلی خود را به تجارت مشاوره PwC هند نزدیک می کند. بر اساس یک یادداشت داخلی که روز شنبه توسط پل گریگز، مدیر عامل ایالات متحده برای کارکنان ارسال شد، شرکت آمریکایی و PwC India قصد دارند یک سرمایه گذاری مشترک جدید تشکیل دهند که مراکز برون مرزی PwC ایالات متحده در هند - معروف به مراکز شتاب یا ACs - را با بازوی مشاوره PwC India ادغام کند. این هاب ها استعدادهای متخصص و پشتیبانی یک شبه را به تیم های ایالات متحده ارائه می دهند و مستقل از عملیات PwC هند عمل می کنند. گریگز در این یادداشت گفت که ایجاد یک سرمایه گذاری مشترک به PwC کمک می کند تا به عنوان یک شبکه جهانی به طور موثرتری رقابت کند. به گفته گریگز، این پیوند باعث رشد و ایجاد فرصت‌های جدید، بهبود دسترسی به استعدادها و قابلیت‌ها می‌شود و «فناوری، مهندسی و قابلیت‌های هوش مصنوعی» شرکت را در مقیاس بزرگ‌تری در کنار هم قرار می‌دهد. PwC در اوایل صبح یکشنبه پس از تماس Business Insider با این شرکت، این توافق را اعلام کرد. نه PwC US و نه PwC India به درخواست‌ها برای اظهار نظر پاسخ ندادند. در این یادداشت آمده است که انتظار می رود این معامله در نیمه اول سال 2027 بسته شود،"}, {"source": "Business Insider", "title": "A gut health scientist shared 3 recipes that help her eat 30 grams of fiber a day, from noodles to chocolate slices", "link": "https://www.businessinsider.com/gut-health-scientist-eats-30g-fiber-3-recipes-2026-9", "summary": "Emily Leeming is a nutrition scientist, dietitian, and former private chef. Haarala Hamilton Nutrition scientist and former chef Emily Leeming is on a mission to get people eating more fiber. Fiber helps keep cholesterol levels in check, balances blood sugar, and supports the gut microbiome. Leeming shared three high-fiber recipes that help her eat 30 grams a day. For years, fiber has had a reputation problem (boring and unsexy), but you wouldn't know it looking at Emily Leeming's go-to recipes . The former chef and nutrition scientist, who specializes in the gut microbiome , is on a mission to get people eating more fiber because it is so beneficial for our health. \"Just adding seven grams of extra fiber a day is related to a significantly lower risk of heart disease, bowel cancer, and type 2 diabetes. And that's the same as about half a can of chickpeas ,\" Leeming told Business Insider. Beyond its reputation for aiding smooth digestion, fiber, which is found in plant foods like beans, nuts, and veggies, helps lower cholesterol levels and keep blood sugar levels balanced throughout the day. Leeming eats around 30 grams a day — a number that she said a wide body of evidence has linked to heart and gut health — but she never skimps on flavor while doing so. She shared three high-fiber, high-protein recipes from her cookbook \"Fiber Power.\" Sesame chicken noodles Leeming s sesame noodle dish contains 10 grams of fiber. Haarala Hamilton Contains 10 grams of fiber and 51 grams of protein Serves: 4 Prep time: 20 minutes Cook time: 20 minutes Ingredients: 8 skinless, boneless chicken thigh fillets (600g) Thumb-size piece of fresh ginger, sliced 1 tbsp soy sauce 150g buckwheat noodles 1⁄2 small red cabbage, finely sliced 1 large carrot, skin on, peeled into strips 300g edamame, cooked 2 spring onions, finely sliced A large bunch of cilantro, leaves only, roughly chopped 2 tbsp sesame seeds (black or white), toasted For the creamy sesame dressing: 1 garlic clove Thumb-size piece of fresh ginger 1 tsp sesame oil 3 tbsp rice vinegar or fresh lemon juice 1 tbsp water 2 tbsp tahini 3 tbsp soy sauce Sea salt 1 tbsp honey Method: Put the chicken thighs into a saucepan with the sliced ginger and soy sauce. Add enough cold water to cover, then bring to a gentle simmer and cook for 10 to 15 minutes until cooked through. Take off the heat and leave to cool to room temperature in the water. Cook the buckwheat noodles following the packet instructions. Drain and rinse under co", "date_str": "2026-09-13T09:48:01+00:00", "hash": "c8aa5b29cb0fd630", "title_fa": "یک دانشمند سلامت روده 3 دستور غذا را به اشتراک گذاشت که به او کمک می کند روزانه 30 گرم فیبر بخورد، از رشته فرنگی گرفته تا تکه های شکلات.", "summary_fa": "امیلی لیمینگ دانشمند تغذیه، متخصص تغذیه و آشپز خصوصی سابق است. امیلی لیمینگ، دانشمند تغذیه هاارالا همیلتون و سرآشپز سابق، ماموریتی دارد تا مردم را به خوردن فیبر بیشتر تشویق کند. فیبر به کنترل سطح کلسترول کمک می کند، قند خون را متعادل می کند و از میکروبیوم روده حمایت می کند. لیمینگ سه دستور غذایی با فیبر بالا را به اشتراک گذاشت که به او کمک می‌کرد 30 گرم در روز بخورد. برای سال‌ها، فیبر مشکل شهرت داشت (خسته‌کننده و غیرسکسی)، اما با دیدن دستور العمل‌های امیلی لیمینگ متوجه نمی‌شوید. سرآشپز سابق و دانشمند تغذیه، که در میکروبیوم روده تخصص دارد، ماموریت دارد تا مردم را وادار به خوردن فیبر بیشتری کند، زیرا برای سلامتی ما بسیار مفید است. تنها افزودن هفت گرم فیبر اضافی در روز با کاهش قابل توجهی در خطر بیماری قلبی، سرطان روده و دیابت نوع 2 مرتبط است. لیمینگ به Business Insider گفت: فیبر که در غذاهای گیاهی مانند لوبیا، آجیل و سبزیجات یافت می‌شود، علاوه بر شهرتش برای کمک به هضم غذا، به کاهش سطح کلسترول و متعادل نگه داشتن سطح قند خون در طول روز کمک می‌کند. و سلامت روده - اما او هرگز در حین انجام این کار از طعم آن کوتاهی نمی کند. او سه دستور غذای پر فیبر و پروتئین بالا را از کتاب آشپزی خود \"Fiber Power\" به اشتراک گذاشت. رشته فرنگی مرغ کنجدی غذای نودل کنجد لیمینگ حاوی 10 گرم فیبر است. هاارالا همیلتون حاوی 10 گرم فیبر و 51 گرم پروتئین وعده های غذایی: 4 زمان آماده سازی: 20 دقیقه زمان پخت: 20 دقیقه مواد لازم: 8 عدد فیله ران مرغ بدون پوست و استخوان (600 گرم) تکه زنجبیل تازه به اندازه انگشت شست، ورقه ورقه ورقه ورقه 1⁄1 قاشق غذاخوری کلم قرمز کوچک، ریز خلال شده 1 هویج بزرگ، پوست، پوست کنده شده 300 گرم"}, {"source": "Business Insider", "title": "A Florida investor explains how he bought 3 condos for $360,000 and turned them into cash-flowing rentals using the 1% rule", "link": "https://www.businessinsider.com/real-estate-deal-analysis-florida-investor-breaks-down-the-numbers-2026-9", "summary": "Florida-based couple Ted and Jamie Garber own more than 20 rental units in Florida. Ted Garber Florida-based investor Ted Garber walks Business Insider through one of his deals. He bought a 3-condo portfolio for $360,000 in 2022. He shares how he financed it and turned it into a cash-flowing asset. Ted Garber did not set out to become a long-distance landlord, but after struggling to find the cash flow he wanted close to home, he broadened his search. Looking at neighboring counties \"really opened up the opportunities for us,\" the part-time investor, who has built a portfolio of Florida rentals alongside his wife, Jamie, told Business Insider. In September 2022, the Garbers bought three occupied condos listed together for $360,000. The properties were about a 90-minute drive from their Florida home. It was their first out-of-area acquisition — and an experiment to see whether they could self-manage rentals without being on-site regularly. Four years later, Garber said they have visited the properties just once and spend less than an hour a week managing their broader portfolio of 29 tenants. He opened the books on the deal and shared how he picked the condos, financed the purchase, and turned the portfolio into a cash-flowing asset. BI verified the purchase and the Garbers' ownership of the three condos by reviewing the final ALTA Settlement Statement and new landlord letters showing the rent for each unit. A portfolio that passed the 1% rule Garber found the three-condo portfolio on LoopNet, where the listed gross rent immediately caught his attention. At the $360,000 purchase price, the condos generated $3,675 in combined monthly rent, just over 1% of the price. That satisfied Garber's initial screening tool: the 1% rule . The rule of thumb suggests that a property's monthly rent should be at least 1% of its purchase price to have a reasonable chance of generating positive cash flow. It is not a guarantee, but it is a quick way to decide whether a listing is worth investigating further. He also saw room to increase rents, which he determined were below market, and liked the stable area outside Orlando's Disney corridor. To make the numbers work, however, he had to negotiate. The condo portfolio was initially listed for between $390,000 and $400,000, he said. That's a typical step in his process, he added: \"I always negotiate. If it's really a steal, I'll do full asking immediately with a seller concession or something.\" Due diligence and the purchase Bef", "date_str": "2026-09-13T09:40:01+00:00", "hash": "b3eeef928f7da0cb", "title_fa": "یک سرمایه گذار فلوریدا توضیح می دهد که چگونه 3 آپارتمان را به قیمت 360000 دلار خریداری کرده و با استفاده از قانون 1٪ آنها را به اجاره نقدینگی تبدیل کرده است.", "summary_fa": "زوج ساکن فلوریدا تد و جیمی گاربر بیش از 20 واحد اجاره ای در فلوریدا دارند. تد گاربر، سرمایه گذار مستقر در فلوریدا، تد گاربر، یکی از معاملات خود را در Business Insider دنبال می کند. او در سال 2022 یک نمونه کار 3 آپارتمانی به قیمت 360000 دلار خرید. او نحوه تامین مالی آن و تبدیل آن به دارایی نقدی را به اشتراک می گذارد. تد گاربر برای تبدیل شدن به یک صاحبخانه از راه دور قصد نداشت، اما پس از تلاش برای یافتن جریان نقدی مورد نظر خود در نزدیکی خانه، جستجوی خود را گسترش داد. این سرمایه‌گذار پاره وقت که در کنار همسرش جیمی مجموعه‌ای از اجاره‌های فلوریدا را ساخته است، به Business Insider گفت که با نگاهی به شهرستان‌های همسایه «واقعاً فرصت‌ها را برای ما باز کرد». در سپتامبر 2022، گاربرز سه کاندو اشغالی را به قیمت 360000 دلار خریداری کرد. این ملک حدود 90 دقیقه با ماشین از خانه آنها در فلوریدا فاصله داشت. این اولین خرید آنها در خارج از منطقه بود - و آزمایشی برای اینکه ببینند آیا می توانند اجاره ها را بدون حضور منظم در محل خود مدیریت کنند یا خیر. چهار سال بعد، گاربر گفت که آنها فقط یک بار از این املاک بازدید کرده اند و کمتر از یک ساعت در هفته را صرف مدیریت مجموعه گسترده 29 مستاجر خود کرده اند. او دفترهای معامله را باز کرد و نحوه انتخاب کاندوها، تامین مالی خرید و تبدیل پرتفوی به دارایی نقدی را به اشتراک گذاشت. BI خرید و مالکیت Garbers بر سه کاندو را با بررسی بیانیه نهایی تسویه حساب ALTA و نامه‌های صاحبخانه جدید که اجاره بهای هر واحد را نشان می‌دهد، تأیید کرد. پورتفولیویی که قانون 1% را تصویب کرد، گاربر نمونه کارها با سه آپارتمان را در LoopNet پیدا کرد، جایی که اجاره ناخالص فهرست شده"}, {"source": "Business Insider", "title": "Why AI researchers keep building something they think will kill humans", "link": "https://www.businessinsider.com/ai-researchers-warn-doom-keep-building-kill-humans-doomers-2026-9", "summary": "A masked protester holds a placard saying Skynet Just Woke Up in reference to the Terminator movies in London during a 2021 anti-lockdown demonstration. ZUMA Press Wire via Reuters Connect A version of this story originally appeared in the AI Insider newsletter. Sign up for the weekly AI Insider newsletter here . On Tuesday, OpenAI CFO Sarah Friar headlined a packed Goldman Sachs tech conference in San Francisco. One thing she said really stood out to me: The company's biggest models can now train other smaller models, helping OpenAI save on the huge costs of training these systems. This is an example of recursive self improvement, or RSI, where AI gets so powerful it can create the next, even more powerful, system itself. For the Wall Street analysts and investors around me at the Goldman conference, this sounded like an amazing business opportunity. For Silicon Valley, especially some hardcore AI researchers, it's terrifying. Now that summer is over, there's a realization that RSI is either here already or coming very soon. There's a chance AI systems will get way more powerful very quickly. Add in the rise of AI agents swarming across the internet doing both great and worrying things, like breaking out of their \"sandbox\" testing environments, and you have full-blown panic in some parts of the AI community. \"We really do earnestly believe AI could kill all humans! I personally think it is 10% within the next decade,\" Evan Hubinger, alignment science lead at Anthropic , wrote on X this week. Other employees from Anthropic and OpenAI weighed in too, setting off a firestorm across the valley. \"Nonsense\" Back at the Goldman conference on Thursday, I ran into Brad Gerstner from Altimeter Capital, an investor in Anthropic and OpenAI. Will AI kill humans I asked? \"It's fucking nonsense,\" he said. For the Wall Street crowd, it's head-scratching why, right before what could be the biggest IPO in history, Anthropic employees would say their main product will kill humans. So why would these people keep working on AI development when they think it will kill people? Here are some theories, some gathered this week and others from discussing and thinking about this for longer. \"Commercial incentives\" First up, the money reason. Anthropic and OpenAI will succeed by creating better AI and selling it. So they must keep going, and employees are along for the ride, even if they feel awful about the technology being potentially dangerous. Second, some researchers, especially", "date_str": "2026-09-13T09:30:02+00:00", "hash": "10294753c7db24ca", "title_fa": "چرا محققان هوش مصنوعی به ساختن چیزی ادامه می دهند که فکر می کنند انسان ها را می کشد؟", "summary_fa": "یک معترض نقابدار پلاکاردی در دست دارد که می گوید Skynet Just Woke Up با اشاره به فیلم های ترمیناتور در لندن در جریان تظاهرات ضد قرنطینه 2021. ZUMA Press Wire از طریق رویترز کانکت نسخه ای از این داستان در ابتدا در خبرنامه AI Insider ظاهر شد. برای خبرنامه هفتگی AI Insider در اینجا ثبت نام کنید. در روز سه‌شنبه، سارا فریار، مدیر مالی OpenAI، کنفرانس فناوری گلدمن ساکس در سانفرانسیسکو را عنوان کرد. چیزی که او گفت واقعاً برای من جالب بود: بزرگترین مدل‌های این شرکت اکنون می‌توانند مدل‌های کوچک‌تر دیگری را آموزش دهند، و به OpenAI کمک می‌کند در هزینه‌های هنگفت آموزش این سیستم‌ها صرفه‌جویی کند. این نمونه ای از بهبود خود بازگشتی یا RSI است، که در آن هوش مصنوعی آنقدر قدرتمند می شود که می تواند خود سیستم بعدی و حتی قدرتمندتر را ایجاد کند. برای تحلیلگران وال استریت و سرمایه گذاران اطراف من در کنفرانس گلدمن، این یک فرصت تجاری شگفت انگیز به نظر می رسید. برای سیلیکون ولی، به ویژه برخی از محققان سخت‌افزار هوش مصنوعی، وحشتناک است. اکنون که تابستان به پایان رسیده است، متوجه می شویم که RSI یا در حال حاضر اینجاست یا خیلی زود می آید. این احتمال وجود دارد که سیستم‌های هوش مصنوعی خیلی سریع قدرتمندتر شوند. به افزایش عوامل هوش مصنوعی که در سراسر اینترنت ازدحام می‌کنند و کارهای بزرگ و نگران‌کننده‌ای را انجام می‌دهند، مانند خروج از محیط‌های آزمایشی «جعبه ماسه‌بازی» خود را اضافه کنید، و در برخی از بخش‌های جامعه هوش مصنوعی دچار وحشت کامل خواهید شد. ایوان هوبینگر، سرپرست علم همسویی در Anthropic، این هفته در X نوشت: \"ما واقعاً عمیقاً معتقدیم که هوش مصنوعی می‌تواند همه انسان‌ها را بکشد! من شخصاً فکر می‌کنم این میزان در دهه آینده به 10٪ خواهد رسید.\" کارمندان دیگری از Anthropic و OpenAI نیز در این کار تلاش"}, {"source": "Business Insider", "title": "Attention shoppers: digital ad screens are about to be everywhere you look", "link": "https://www.businessinsider.com/digital-ad-screens-everywhere-retail-stores-2026-9", "summary": "Amazon has specific rules about what types of ads can be shown on the screens at Whole Foods. Dominick Reuter/Business Insider Retailers have gradually added digital display ads to their stores for the past year. Now the pace is picking up as the concept gains wider acceptance with Walmart and Walgreens. A survey this year found that shoppers' acceptance of ad screens depends on the in-store context. Trips to the store used to offer a break from the digital screens that dominate modern life. Those days are winding down . Retailers are now trying to bring more advertising into stores by selling brands access to screens in aisles, endcaps, and checkouts, where customers make their final decisions . Walmart, Walgreens, Amazon, and grocery chains are betting that the screens can help shoppers find relevant products while opening a new source of high-margin revenue. \"We do see a meaningful opportunity there to have more engaging screens throughout the store,\" Walmart's head of advertising, Ryan Mayward, said this week at a conference hosted by Goldman Sachs. Walmart has a large and growing online ad business , and it already has a lot of screens in its stores, mostly located in perimeter areas like the deli, bakery, or electronics sections. The next step is to bring some of that online ad information to an in-store shopping experience. Now, Mayward said the retail giant is testing options in higher-traffic areas, like aisle endcaps. These displays would include up-to-date information about inventory and pricing that could entice shoppers to venture down an aisle for a sponsored product. \"We're really excited about using the store and introducing new advertising services,\" Mayward added. Although Walmart is the largest retailer to adopt the tech, it's far from the first. Walgreens is partnering with Looma to add digital displays to 1,200 stores. Walgreens Walgreens also made news this month when it said it is taking another swing at digital display ads in its stores after its ill-fated experiment replacing cooler doors with TV screens. The drugstore chain said it is partnering with in-store advertising firm Looma to outfit about 1,200 locations with screens, starting in October, to serve ads near specific merchandise. Looma provides similar services to retailers such as Kroger, HEB, and BJ's Wholesale Club, and says it projects that most major chains will have 100 to 200 screens per location within the next seven years. Brands under the Albertson's banner have a", "date_str": "2026-09-13T09:30:01+00:00", "hash": "10b197cdbce25726", "title_fa": "توجه خریداران: صفحه‌های تبلیغات دیجیتال به هر کجا که نگاه می‌کنید قرار است", "summary_fa": "آمازون قوانین خاصی در مورد اینکه چه نوع تبلیغاتی را می توان بر روی صفحه نمایش در Whole Foods نشان داد، دارد. Dominick Reuter/Business Insider خرده فروشان به تدریج تبلیغات نمایشگر دیجیتال را در سال گذشته به فروشگاه های خود اضافه کرده اند. اکنون با استقبال گسترده‌تری از این مفهوم با Walmart و Walgreens، این سرعت در حال افزایش است. یک نظرسنجی در سال جاری نشان داد که استقبال خریداران از صفحه‌های تبلیغاتی به بافت فروشگاه بستگی دارد. سفرهایی که به فروشگاه می‌رفتند برای استراحت از صفحه‌نمایش‌های دیجیتالی که بر زندگی مدرن حاکم هستند، ارائه می‌کردند. آن روزها رو به پایان است. خرده‌فروشان اکنون در تلاش هستند تا تبلیغات بیشتری را با فروش برندها به صفحه‌نمایش در راهروها، درپوش‌های انتهایی و صندوق‌ها، جایی که مشتریان تصمیم‌های نهایی خود را می‌گیرند، وارد فروشگاه‌ها کنند. والمارت، والگرین، آمازون، و زنجیره‌های خواربارفروشی شرط می‌بندند که صفحه‌نمایش‌ها می‌توانند به خریداران کمک کنند تا محصولات مرتبط را پیدا کنند و در عین حال منبع جدیدی از درآمد پر حاشیه را باز کنند. رایان میوارد، رئیس تبلیغات والمارت، این هفته در کنفرانسی به میزبانی گلدمن ساکس گفت: «ما فرصتی معنادار برای داشتن صفحه نمایش های جذاب تر در سراسر فروشگاه می بینیم. والمارت یک کسب و کار تبلیغات آنلاین بزرگ و رو به رشد دارد و در حال حاضر صفحه نمایش های زیادی در فروشگاه های خود دارد که بیشتر در مناطق پیرامونی مانند اغذیه فروشی ها، نانوایی ها یا بخش های الکترونیکی قرار دارند. گام بعدی این است که برخی از اطلاعات تبلیغات آنلاین را به تجربه خرید در فروشگاه بیاورید. اکنون میوارد گفت که غول خرده‌فروشی در حال آزمایش گزینه‌ها در مناطق پرترافیک، مانند درپوش‌های انتهایی راهرو است. این نمایشگرها شامل اطلاعات به‌روز در مورد موجودی و قیمت است که می‌تواند خریداران را ترغیب کند تا در راهروی یک محصول حمایت‌شده شرکت کنند. میوارد"}, {"source": "Business Insider", "title": "What jobs wipeout? Morgan Stanley says white-collar workers might benefit the most from AI", "link": "https://www.businessinsider.com/ai-jobs-employment-wall-street-high-income-economy-morgan-stanley-2026-9", "summary": "Bloomberg/Getty Images White-collar workers are said to be highly at risk of job displacement by AI. Yet, Morgan Stanley says office workers stand to benefit the most from AI-enabled productivity gains. \"AI-related job postings have been targeted towards higher-income consumers,\" the bank said. Morgan Stanley has some good news if you're an office worker who lives in fear of an AI-fueled jobs wipeout. The Wall Street Bank said on Friday that the most exposed demographic to AI disruption stands to benefit the most. As widespread AI-driven layoff announcements have dominated news cycles, white-collar workers across industries have wondered if their jobs are next to be automated away. But according to Morgan Stanley economist Heather Berger, it's these workers who stand to win from the ways in which AI will reshape labor. \"High-income, college-educated, urban households are most exposed to AI displacement but also to potential AI gains: productivity-driven wage growth, job creation, wealth effects, and disinflation,\" she wrote. \"We think these upside channels are underappreciated.\" Berger's team uses the acronym CHIC— college-educated, high-income, city-dwelling. This group, by Morgan Stanley's assessment, is most likely to be impacted by AI as a job-market disrupting force as it continues to evolve. The economists noted that younger CHIC workers are more likely to see parts of their jobs replaced by AI, particularly routine, entry-level tasks. But older colleagues could end up seeing wage growth due to productivity gains that AI is expected to deliver without fully replacing them. \"In terms of job creation, it is still early, but new AI-related occupations have so far been aimed at these same CHIC consumers,\" Berger added. \"AI-related job postings have been targeted towards higher-income consumers with some experience in similar 'highly-exposed' industries.\" The bank's prediction comes as AI fears are on the rise in the job market and beyond, as ominous statements from AI industry insiders and doomsday scenarios have gone viral. But Berger's team maintains that AI job fears may be overblown, and she isn't the only one. Andrew Slimmon, head of applied equity advisors at Morgan Stanley Investment Management, told Business Insider earlier this year that he wasn't worried about the impact AI would have on employment. He predicted that the market would rebound and become stronger, similar to how the dot-com boom of the early 2000s reshaped the labor force. Now Be", "date_str": "2026-09-13T09:20:01+00:00", "hash": "b065d20684150929", "title_fa": "چه مشاغلی از بین می روند؟ مورگان استنلی می گوید کارگران یقه سفید ممکن است بیشترین بهره را از هوش مصنوعی ببرند", "summary_fa": "Bloomberg/Getty Images گفته می شود کارگران یقه سفید به شدت در معرض خطر جابجایی شغلی توسط هوش مصنوعی هستند. با این حال، مورگان استنلی می گوید که کارکنان اداری بیشترین بهره را از دستاوردهای بهره وری مبتنی بر هوش مصنوعی خواهند برد. این بانک گفت: «آگهی های شغلی مرتبط با هوش مصنوعی برای مصرف کنندگان با درآمد بالاتر هدف گذاری شده است. اگر کارمند اداری هستید که در ترس از بین رفتن مشاغل مبتنی بر هوش مصنوعی زندگی می کنید، مورگان استنلی خبرهای خوبی دارد. بانک وال استریت روز جمعه اعلام کرد که افرادی که بیشتر در معرض اختلالات هوش مصنوعی هستند بیشترین سود را خواهند برد. از آنجایی که اعلان‌های گسترده اخراج مبتنی بر هوش مصنوعی بر چرخه‌های خبری تسلط یافته است، کارگران یقه سفید در سراسر صنایع به این فکر می‌کنند که آیا شغل‌هایشان در آینده خودکار خواهد شد یا خیر. اما به گفته هدر برگر، اقتصاددان مورگان استنلی، این کارگران هستند که می‌توانند از روش‌هایی که هوش مصنوعی به نیروی کار تغییر شکل می‌دهد پیروز شوند. او نوشت: «خانوارهای شهری با درآمد بالا، تحصیلات دانشگاهی، بیشتر در معرض جابه‌جایی هوش مصنوعی هستند، اما همچنین در معرض دستاوردهای بالقوه هوش مصنوعی هستند: رشد دستمزد مبتنی بر بهره‌وری، ایجاد شغل، اثرات ثروت، و کاهش تورم. ما فکر می‌کنیم که این کانال‌های صعودی مورد ارزیابی قرار نگرفته‌اند.» تیم برگر از نام اختصاری CHIC استفاده می کند - تحصیل کرده در دانشگاه، با درآمد بالا، شهر نشین. این گروه، بر اساس ارزیابی مورگان استنلی، به احتمال زیاد تحت تأثیر هوش مصنوعی به عنوان یک نیروی برهم زننده بازار کار در حالی که به تکامل خود ادامه می دهد، خواهد بود. اقتصاددانان خاطرنشان کردند که کارگران CHIC جوان‌تر به احتمال زیاد شاهد جایگزینی بخش‌هایی از مشاغلشان با هوش مصنوعی هستند، به‌ویژه کارهای معمولی و ابتدایی. اما همکاران مسن‌تر ممکن است به دلیل"}, {"source": "Business Insider", "title": "I visited Capital One's lounge at LaGuardia. I loved the free steak and shrimp, but I'll do 1 thing differently next time.", "link": "https://www.businessinsider.com/laguardia-capital-one-landing-airport-lounge-experience-credit-card-2026-9", "summary": "The author got to LaGuardia Airport over three hours early to fully experience the Capital One Landing. Jane Zhang Business Insider editor Jane Zhang utilized Capital One's lounge at LaGuardia Airport ahead of her flight home. Thanks to lounge access through her credit card, she enjoyed tapas, steak, shrimp, and mocktails. She enjoyed her experience, but would've preferred self-service options and being seated in a different section. Anyone who knows me knows that I'm not a timely person. Even in higher-stakes situations like flights, my time blindness is hard to overcome. (I've definitely gotten to the airport 45 minutes before takeoff on at least one occasion before.) So when I showed up at LaGuardia Airport last week, three and a half hours early for my flight home to Chicago, it was a first-time experience for me. However, it wasn't entirely out of character — because another thing about me is that I love a good deal . In this case, the good deal was getting my money's worth at the new Capital One Landing that opened in February. Here's how I got access to it, and how I made the most of the experience. My credit card gives me lounge access The Capital One Venture X is my first-ever credit card that includes airport lounge access . With its $395 annual fee, it gives me access to Capital One's seven airport lounges (two of which are designed as sit-down restaurant-style culinary concepts, which Capital One calls \"Landings,\" including the one I visited) as well as Priority Pass lounges worldwide. Unfortunately for me, there is no Capital One lounge in Chicago, where I live, so I was elated when I saw that the Capital One Landing at LaGuardia had opened ahead of my trip to New York. Previously, Venture X holders used to be able to bring up to two guests into Capital One lounges for free, and authorized users on Venture X cards also could get complimentary entry to the lounges. That changed in February 2026. Now, authorized users like my husband must pay a $125 fee annually to get complimentary access to the lounges, or I could pay a guest fee of $45 for him each time. Before leaving for our New York trip, my husband and I discussed and decided that it felt worth it to pay the $125 annual fee for him. After all, we reasoned, we're bound to spend at least $20 a person on food at the airport anyway, so this will pay itself off after three round-trip flights. And since we have several trips planned for the next year, it's more cost-effective than paying for a ", "date_str": "2026-09-13T09:15:01+00:00", "hash": "a6521dbace99a382", "title_fa": "من از سالن Capital One در LaGuardia بازدید کردم. من استیک رایگان و میگو را دوست داشتم، اما دفعه بعد 1 کار را متفاوت انجام خواهم داد.", "summary_fa": "نویسنده بیش از سه ساعت زودتر به فرودگاه لاگاردیا رسید تا به طور کامل فرود پایتخت وان را تجربه کند. جین ژانگ، سردبیر جین ژانگ Business Insider، قبل از پرواز به خانه، از سالن Capital One در فرودگاه لاگاردیا استفاده کرد. به لطف دسترسی به سالن از طریق کارت اعتباری خود، او از تاپاس، استیک، میگو و ماکتل لذت می برد. او از تجربه‌اش لذت می‌برد، اما ترجیح می‌داد گزینه‌های سلف‌سرویس و نشستن در بخش دیگری باشد. هر کس مرا می شناسد می داند که من آدم به موقعی نیستم. حتی در موقعیت‌های با ریسک بالاتر مانند پروازها، غلبه بر نابینایی زمانی من سخت است. (من قطعاً حداقل یک بار قبلاً 45 دقیقه قبل از پرواز به فرودگاه رسیده ام.) بنابراین وقتی هفته گذشته در فرودگاه لاگواردیا حضور یافتم، سه ساعت و نیم زودتر برای پرواز به خانه به شیکاگو، برای من اولین تجربه بود. با این حال، کاملاً غیرمعمول نبود - زیرا چیز دیگری در مورد من این است که من عاشق یک معامله خوب هستم. در این مورد، معامله خوب این بود که ارزش پولم را در کپیتال وان لندینگ جدید که در فوریه افتتاح شد، بدست آوردم. در اینجا آمده است که چگونه به آن دسترسی پیدا کردم و چگونه از این تجربه بهترین استفاده را کردم. کارت اعتباری من به من امکان دسترسی به سالن را می دهد. Capital One Venture X اولین کارت اعتباری من است که شامل دسترسی به سالن فرودگاه است. با هزینه سالانه 395 دلاری‌اش، به من امکان دسترسی به هفت سالن فرودگاه Capital One را می‌دهد (دو مورد از آنها به‌عنوان مفاهیم آشپزی به سبک رستوران‌های نشسته طراحی شده‌اند، که Capital One آن را \"لندینگ\" می‌نامد، از جمله همان چیزی که من بازدید کردم) و همچنین سالن‌های Priority Pass در سراسر جهان. متأسفانه برای من، در شیکاگو، جایی که من زندگی"}, {"source": "Business Insider", "title": "A laid-off Grubhub worker created a tracker to help others find jobs. 18 months later, recruiters are learning from it.", "link": "https://www.businessinsider.com/irvin-thevaranjan-supports-grubhub-layoffs-recovery-efforts-2026-9", "summary": "Irvin Thevaranjan has managed a tracker for laid-off Grubhub workers over the past year and a half. Irvin Thevaranjan Tech and related industries continue to get hit with layoffs. One laid-off Grubhub employee built a community to help coworkers navigate the aftermath. It's helped laid-off workers find jobs and recover from losing their roles. Irvin Thevaranjan was blindsided by his layoff. The day before, the head of governance risk and controls at delivery service Grubhub had a stellar performance review with his boss, who told him that he had lots of opportunities in front of him at the company. Less than a day later, though, he found himself on a call where most participants weren't visible, and no one could unmute themselves. \"That's when I was like 'Oh crap, this is the wrong call to be on,'\" he said. In the hours afterward, Thevaranjan started piecing together a list of the hundreds of others who lost their jobs at Grubhub that day in February 2025. Then, he had an idea: What if he created a list of everyone who was laid off that day to help them find new opportunities? One-and-a-half years later, Thevaranjan still runs the Ex-Grubhub Talent Network, which has listed 326 laid-off alumni looking for work after layoffs. Most have found new jobs, according to the tracker. \"Irvin makes it his personal mission to get everybody employed,\" said Paul de Lucena, a former Grubhub employee and network member. Workers at tech companies from Amazon to Meta to Uber have faced layoffs this year . Many have to figure out what's next with their own networks — or, perhaps, with some help from a group chat of fellow laid-off employees that goes dark after a month or two. Thevaranjan's network represents something different, according to former Grubhub employees and others who have interacted with it: A grassroots effort to provide the support that's typically lacking after a layoff. From the 'empathy window' to a tracker The most publicly visible part of the network is a tracker that Thevaranjan built to showcase laid-off employees and their experience to potential employers. There's also a Slack workspace where laid-off workers commiserate over the job search, share links to open roles, and post about their hobbies. Grubhub workers who were more recently laid off can also join the group by filling out a Google Form that Thevaranjan and other administrators review. Thevaranjan said he got the idea from Kristen Ubaldi, the former chief people officer at Groupon. Ubaldi", "date_str": "2026-09-13T09:07:01+00:00", "hash": "9eeeeb665fd7208b", "title_fa": "یک کارگر بیکار شده Grubhub یک ردیاب ایجاد کرد تا به دیگران کمک کند شغل پیدا کنند. 18 ماه بعد، استخدام کنندگان از آن یاد می گیرند.", "summary_fa": "ایروین ثوارانجان طی یک سال و نیم گذشته یک ردیاب برای کارگران اخراج شده Grubhub مدیریت کرده است. ایروین ثوارانجان تک و صنایع وابسته همچنان با اخراج کارگران مواجه هستند. یکی از کارمندان اخراجی Grubhub یک جامعه برای کمک به همکاران در پیمایش عواقب بعدی ایجاد کرد. این به کارگران اخراج شده کمک می کند تا شغل پیدا کنند و پس از از دست دادن نقش خود بهبود یابند. اروین ثوارانجان با اخراجش کور شد. روز قبل، رئیس اداره ریسک و کنترل‌ها در سرویس تحویل گرابهاب یک بررسی عملکرد خیره‌کننده با رئیس خود داشت، که به او گفت فرصت‌های زیادی در شرکت پیش روی او است. با این حال، کمتر از یک روز بعد، او خود را در تماسی دید که اکثر شرکت‌کنندگان در آن قابل مشاهده نبودند و هیچ‌کس نمی‌توانست صدای خود را لغو کند. او می‌گوید: «آن موقع بود که من به این فکر می‌کردم که «اوه چرند، این تماس اشتباهی است که باید در آن حضور داشته باشم». در ساعات بعد، ثوارانجان شروع به جمع آوری لیستی از صدها نفر دیگر کرد که در آن روز در Grubhub در فوریه 2025 شغل خود را از دست دادند. سپس، او یک ایده داشت: اگر فهرستی از همه کسانی که آن روز اخراج شده بودند را ایجاد کند تا به آنها کمک کند فرصت های جدید پیدا کنند، چه؟ پس از گذشت یک سال و نیم، Thevaranjan هنوز شبکه استعدادهای درخشان Ex-Grubhub را اداره می کند که 326 فارغ التحصیل اخراج شده را فهرست کرده است که پس از اخراج به دنبال کار هستند. به گفته ردیاب، بیشتر آنها شغل جدیدی پیدا کرده اند. پل دی لوسنا، کارمند سابق گرابهاب و عضو شبکه، می گوید: «اروین مأموریت شخصی خود را برای استخدام همه می داند. کارگران شرکت های فناوری از آمازون گرفته تا متا و اوبر امسال با اخراج"}, {"source": "Business Insider", "title": "I own a house rental business near a future Meta AI data center. Construction workers make up most of our tenants.", "link": "https://www.businessinsider.com/meta-ai-data-center-louisiana-housing-market-home-rentals-2026-9", "summary": "Angel and Bryan Crawford opened a mobile home park in northeast Louisiana in 2025. Angel Crawford Meta is building its largest data center to date in Richland Parish, Louisiana. Angel Crawford and her husband own 18 rental properties in the area. Crawford said RV and mobile home parks are booming due to the influx of workers. This as-told-to essay is based on a conversation with Angel Crawford, who owns 18 rental properties in northeastern Louisiana and runs a third-party website connecting tenants with property owners. Construction for Meta's largest-ever AI data center has begun in Holly Ridge, an unincorporated community about 10 minutes away from her home in Delhi. My husband and I have been in Delhi for four years. We're originally from this area, but we've moved around because of our nursing careers. I was a quality manager, and my husband was a director of case management. We were empty nesters looking for something to do, so we started with real estate and rentals because they are very much needed in this area. It's very rural here, so when there are fluctuating prices in the market, it doesn't really hit us because there are never enough houses for sale or rent. In 2024, we started buying older houses that had been on the market for a long time or needed a lot of work. We had a vision to create a mobile home park and already purchased some land when we heard about Meta's data center. That's what pushed us to keep going forward. We understood there wasn't enough housing for residents, and our dream of building more multifamily houses was right in line to do that. Around here, people feel one way or the other about the data center. Either people are excited about the opportunities, or they hate it. There's no in between. I see it as an opportunity for us to have more experiences in our area and jobs for our children, so they can stay here instead of moving away. We began Parish Line Properties, which now operates 18 properties, in 2024. I also created StayNELA, a third-party website to connect listing agents with tenants, in 2025. The impact of Meta's data center on real estate Parish Line Properties has 18 homes, and 14 of those are workforce housing. Location is very important to Meta's workers because they work six to seven days a week and 12-plus hours a day. They leave around 4:30 in the morning, and they don't come home until 7 at night. One of the big things my tenants tell me is that if they live in Dallas and it's 30 miles to work, it takes", "date_str": "2026-09-13T09:04:01+00:00", "hash": "fa04222be920998f", "title_fa": "من صاحب یک کسب و کار اجاره خانه در نزدیکی یک مرکز داده متا هوش مصنوعی آینده هستم. کارگران ساختمانی بیشتر مستاجران ما را تشکیل می دهند.", "summary_fa": "آنجل و برایان کرافورد در سال 2025 یک پارک خانه متحرک در شمال شرقی لوئیزیانا افتتاح کردند. Angel Crawford Meta در حال ساخت بزرگترین مرکز داده خود تا به امروز در ریچلند پریش، لوئیزیانا است. آنجل کرافورد و همسرش 18 ملک اجاره ای در این منطقه دارند. کرافورد گفت پارک‌های RV و خانه‌های متحرک به دلیل هجوم کارگران در حال رونق هستند. این مقاله گفته شده بر اساس گفتگو با آنجل کرافورد است که دارای 18 ملک اجاره ای در شمال شرقی لوئیزیانا است و یک وب سایت شخص ثالث را راه اندازی می کند که مستاجران را با صاحبان املاک وصل می کند. ساخت بزرگترین مرکز داده هوش مصنوعی متا در هالی ریج آغاز شده است، یک جامعه غیرقانونی که حدود 10 دقیقه با خانه او در دهلی فاصله دارد. من و شوهرم چهار سال است که در دهلی هستیم. ما اصالتاً اهل این منطقه هستیم، اما به دلیل حرفه پرستاری خود به آنجا نقل مکان کرده ایم. من مدیر کیفیت بودم و شوهرم مدیر مدیریت پرونده. ما آشیانه‌های خالی بودیم که دنبال کاری می‌گشتیم، بنابراین با املاک و مستغلات و اجاره شروع کردیم، زیرا در این زمینه بسیار مورد نیاز هستند. اینجا خیلی روستایی است، بنابراین وقتی قیمت‌ها در بازار نوسان دارد، واقعاً به درد ما نمی‌خورد زیرا هرگز خانه‌های کافی برای فروش یا اجاره وجود ندارد. در سال 2024، ما شروع به خرید خانه‌های قدیمی‌تری کردیم که مدت‌ها در بازار بودند یا به کار زیادی نیاز داشتند. ما چشم انداز ایجاد یک پارک خانه متحرک را داشتیم و زمانی که در مورد مرکز داده متا شنیدیم مقداری زمین خریداری کردیم. این همان چیزی بود که ما را به ادامه راه پیش برد. ما متوجه شدیم که مسکن کافی برای ساکنان وجود ندارد، و رویای ما برای ساخت خانه‌های چندخانواره بیشتر درست در راستای انجام این کار بود."}, {"source": "Business Insider", "title": "What happens when you tell Jensen Huang you're quitting Nvidia", "link": "https://www.businessinsider.com/ceo-jensen-huang-offers-candid-advice-to-departing-nvidia-staff-2026-9", "summary": "Nvidia CEO Jensen Huang. Chris Jung/NurPhoto via Getty Images CEO Jensen Huang doesn't sugarcoat advice to Nvidia employees who quit. He critiqued one startup's name and told another founder his biggest weakness could hold him back. Founders said the tough love stuck — and they acted on his advice. As they were preparing to leave Nvidia, David Hoeller and Nikita Rudin anxiously hopped on a late-night call with their CEO. The two had spent years working on robotics at the chip giant, pushing the boundaries of simulation and helping pull off a demo in which CEO Jensen Huang took the stage with a coterie of humanoids. The pair wanted more freedom to bring that technology into the real world and left in 2024 to found Flexion Robotics, a startup building robot intelligence . As they dialed in from a conference in Munich, Huang didn't try to talk them out of leaving, though he did have one problem with their startup: its intended name, Checkpoint. \"He told us that the name was bad, and that we had to change it,\" Rudin said, adding that they'd heard from others that the name sounded like it belonged in a different industry. \"I don't want to give him all the credit, but we probably changed it because of his comment.\" Huang also warned them about the long road ahead. \"His message was, 'We don't realize how tough a journey it's going to be,'\" Rudin said. Flexion's experience offers a glimpse into how Huang counsels some departing founders: with encouragement and little sugarcoating. That directness extends through Nvidia's culture, where Huang is known for cutting through management layers and personally weighing in on everything from employee output to customer complaints . Flexion Robotics David Hoeller and Nikita Rudin. Courtesy of Flexion Robotics Flexion's relationship with Nvidia didn't end there. Nvidia later invested in the Zurich-based company, which is now expanding into the US, having recently opened a San Francisco office and hired researchers from companies like Meta. In total, it has raised more than $57 million. Nvidia did not respond to a request for comment. Founders say Jensen Huang gives 'honest feedback' For Bing Xu, Huang's parting advice was more personal. Xu joined Nvidia after it acquired his first startup in 2024. He left earlier this year — walking away from a potentially life-changing sum of Nvidia equity , he said — to build another startup called INT21, which uses AI to improve chip software. After Xu shared his plans, Huang spent two ho", "date_str": "2026-09-13T09:00:01+00:00", "hash": "299be99903f9ec12", "title_fa": "وقتی به جنسن هوانگ می‌گویید انویدیا را ترک می‌کنید چه اتفاقی می‌افتد", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا. کریس جونگ/نور فوتو از طریق گتی ایماژ، جنسن هوانگ، مدیر عامل شرکت انویدیا، به کارمندان انویدیا که کار را ترک می‌کنند، توصیه نمی‌کند. او نام یک استارتاپ را مورد انتقاد قرار داد و به یکی دیگر از بنیانگذاران گفت که بزرگترین ضعف او می تواند او را عقب نگه دارد. بنیانگذاران گفتند که این عشق سخت باقی مانده است - و آنها به توصیه او عمل کردند. در حالی که آنها در حال آماده شدن برای ترک انویدیا بودند، دیوید هولر و نیکیتا رودین با نگرانی آخر شب با مدیر عامل خود تماس گرفتند. این دو سال‌ها روی رباتیک در غول تراشه‌ها کار می‌کردند و مرزهای شبیه‌سازی را پیش می‌بردند و به اجرای نمایشی کمک می‌کردند که در آن، جنسن هوانگ، مدیر عامل شرکت، با گروهی از انسان‌نماها روی صحنه رفت. این زوج آزادی بیشتری را برای آوردن این فناوری به دنیای واقعی می‌خواستند و در سال 2024 راهی شدند تا Flexion Robotics، یک استارت‌آپ هوشمند ساخت ربات را تأسیس کنند. همانطور که آنها از کنفرانسی در مونیخ تماس گرفتند، هوانگ سعی نکرد از ترک آنها صحبت کند، اگرچه او یک مشکل با راه اندازی آنها داشت: نام مورد نظر آن، Checkpoint. رودین گفت: «او به ما گفت که این نام بد است و ما باید آن را تغییر دهیم. نمی‌خواهم تمام اعتبار را به او بدهم، اما احتمالاً به خاطر اظهارنظر او آن را تغییر دادیم.» هوانگ همچنین در مورد راه طولانی پیش رو به آنها هشدار داد. رودین گفت: \"پیام او این بود که \"ما نمی دانیم که این سفر چقدر سخت خواهد بود.\" تجربه Flexion نگاهی اجمالی به نحوه مشاوره هوانگ به برخی از بنیانگذاران در حال خروج ارائه می دهد: با تشویق و پوشش کمی. این صراحت در فرهنگ انویدیا گسترش می‌یابد، جایی که هوانگ به دلیل گذر از لایه‌های مدیریتی و"}, {"source": "Business Insider", "title": "America's growing EV graveyard: See the electric cars axed this year", "link": "https://www.businessinsider.com/evs-automakers-axed-this-year-2026-3", "summary": "Several EV models have been pulled from automaker s lineups in 2026. It extends a trend that stretched from September 2025. Hyundai USA Automakers have reorganized their EV lineups since September 2025, when federal tax credits ended. Sagging demand, tariffs, and a new generation of EVs have also led to several product cancellations. Business Insider compiled a list of EVs that have been killed or indefinitely delayed in 2026. American EV sales are still facing pressure . Since September 2025, when the federal $7,500 tax credit for US-made EVs ended, fewer shoppers have chosen a battery-powered car for their next set of wheels. In the second quarter of 2026, deliveries dropped 20.5%, according to Cox Automotive data. That follows a 27% drop in first-quarter 2026 EV sales and a 36% plunge in EV sales in the final quarter of 2025. The slowdown began reshaping which new car models appeared on US dealership lots last year. By the end of 2025, Ford ended production of the F-150 Lightning, Nissan axed the Ariya, Acura stopped building the ZDX, and Volkswagen paused the ID. Buzz until 2027. That shake-up has continued into 2026, but the lineup changes aren't a wholesale retreat from EVs . \"It's a part of many legacy automakers retooling their EV strategies,\" Seth Goldstein, an analyst at Morningstar, told Business Insider. \"A lot of automakers are going back to the drawing board. They're looking to discontinue unprofitable EVs and replace them with more affordable, long-range EVs.\" Business Insider is tracking every EV canceled or postponed since January 1, 2026 — a list we'll keep updating as the industry redraws its all-electric road map. Hyundai Ioniq 6 Standard Hyundai. confirmed to Business Insider that the Standard model Ioniq 6 is discontinued in the US. Sjoerd van der Wal/Getty Images Hyundai confirmed to Business Insider that it will stop selling the Korean-built, standard Ioniq 6 in the US. The retro-styled sedan never matched the success of its crossover sibling, the Ioniq 5 (which has been on a sales tear this year; in May, the company reported delivering 5,002 units, up 16% from last year). Hyundai said it sold just 229 Ioniq 6 units in February. \"Sedan sales have declined a lot over the past decade, and the Ioniq 6 is no exception,\" Sam Abuelsamid, the vice president of market research at Telemetry, told Business Insider. \"Without enough sales to justify US production, the numbers just don't add up for Hyundai.\" Hyundai said it plans to import a lim", "date_str": "2026-09-13T08:33:01+00:00", "hash": "8c8e7b912d8f127f", "title_fa": "قبرستان رو به رشد EV در آمریکا: خودروهای برقی را که امسال تبر شدند را ببینید", "summary_fa": "چندین مدل EV از خط تولید خودروسازان در سال 2026 خارج شدند. این روند از سپتامبر 2025 ادامه یافت. خودروسازان هیوندای ایالات متحده از سپتامبر 2025، زمانی که اعتبار مالیاتی فدرال به پایان رسید، خط تولید خودروهای برقی خود را سازماندهی مجدد کرده اند. کاهش تقاضا، تعرفه ها و نسل جدید خودروهای برقی نیز منجر به لغو چندین محصول شده است. Business Insider فهرستی از خودروهای برقی که در سال 2026 کشته شده اند یا به طور نامحدودی به تعویق افتاده اند جمع آوری کرده است. فروش خودروهای برقی آمریکایی همچنان با فشار مواجه است. از سپتامبر 2025، زمانی که اعتبار مالیاتی 7500 دلاری فدرال برای خودروهای الکتریکی ساخت ایالات متحده به پایان رسید، تعداد کمتری از خریداران خودرویی با باتری را برای چرخ های بعدی خود انتخاب کردند. بر اساس داده های Cox Automotive، در سه ماهه دوم سال 2026، تحویل 20.5 درصد کاهش یافت. این به دنبال کاهش 27 درصدی در فروش سه ماهه اول 2026 و افت 36 درصدی در فروش خودروهای برقی در سه ماهه پایانی سال 2025 است. کاهش سرعت شروع به تغییر شکل مدل‌های جدید خودرو در سال گذشته در نمایندگی‌های ایالات متحده کرد. در پایان سال 2025، فورد به تولید F-150 لایتنینگ پایان داد، نیسان آریا را تبر کرد، آکورا ساخت ZDX را متوقف کرد و فولکس واگن ID را متوقف کرد. تا سال 2027 پر سر و صدا. این تغییر تا سال 2026 ادامه داشت، اما تغییرات خط تولید، عقب نشینی عمده ای از خودروهای برقی نیست. ست گلدشتاین، تحلیلگر مورنینگ استار، به بیزینس اینسایدر گفت: «این بخشی از بسیاری از خودروسازان قدیمی است که استراتژی‌های خودروهای برقی خود را بازطراحی می‌کنند. «بسیاری از خودروسازان در حال بازگشت به تابلوی طراحی هستند. آنها به دنبال توقف تولید خودروهای برقی غیرسودآور و جایگزینی آنها با خودروهای برقی دوربرد مقرون به صرفه تر هستند.\""}, {"source": "Business Insider", "title": "Music, hoodies, and beer: Inside the battle tearing golf apart", "link": "https://www.businessinsider.com/golf-popularity-boom-etiquette-clash-2026-9", "summary": "Getty Images; Alyssa Powell/BI David Schneider is all for people having fun on the golf course — to a point. The 47-year-old reached said point recently on a rare three-generational outing with his father and son on a municipal course in San Diego. They got stuck behind a foursome of 20-somethings who were downing Coors Lights, smoking cigars, and playing at what he describes as a \"snail's pace,\" oblivious to the groups piling up behind them. \"They really didn't care about pace of play,\" says Schneider, who runs a curated golf experience company in Southern California. The situation reached a boiling point when the increasingly belligerent bros decided to tee off their finished beer cans. They even started taking mulligans (golf-speak for second tries) when their empties didn't clear the tee box. \"All the while, my foursome watched their drunken incompetence from just a few feet away,\" Schneider says. While Schneider's experience was an especially egregious scene, it's emblematic of the culture clash taking place within golf . The sport has surged in popularity in recent years: Nearly 50 million Americans hit a golf ball in 2025, up 41% from 2019. It's exploded on social media — even LeBron James has launched a golf YouTube channel. But growing the game has come with major growing pains. Golf's old guard complains that novices aren't tuned into the game's rules and etiquette : they play too slowly, listen to music, and (gasp!) don't tuck in their shirts. It's prompted a \"Shrink the Game\" backlash among some online traditionalists. Newcomers, on the other hand, contend that many of the gripes are little more than elitist gatekeeping that has long defined the sport. Fancy clubs have a tendency to get \"bent out of shape over stuff that doesn't matter at all,\" Schneider says, like someone changing shoes in the parking lot. This \"Caddyshack\" showdown for the YouTube era is triggering surprisingly heated emotions. On Reddit, posts about wearing hats in the clubhouse and paying for drinks after a hole-in-one garner hundreds of comments. When a colleague found out I was working on this story, he reached out to share his two cents: Everyone who \"screams\" about shrinking the game is an \"effing loser,\" he argues, who's salty \"because
