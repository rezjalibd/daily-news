  <style>

      --card-border: #232f48;
      --text: #f1f5f9;

      --tab-border: #232f48;

      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;

    :root[data-theme="light"] {

      --card-bg: #ffffff;
      --card-border: #e2e8f0;

      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;

      transition: background-color 0.3s ease, color 0.3s ease;

    .container {

      margin: 0 auto;

      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {

      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;

      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {

      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;

      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }

      from { transform: scale(0.95); opacity: 0; }

    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;

    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;

    .btn-close:hover {
      color: var(--text);

    .modal-body {

      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;

    .archive-item {

      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }

      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

شت اعداد است. تب Model جایی است که مجموعه داده های زیرین و اسکریپت های پایتون در آن قرار می گیرند. طراحی منعکس کننده پس زمینه پاتل است. پاتل در طول دوران تصدی خود در متا بر یادگیری تقویتی تمرکز کرد - نوعی یادگیری ماشینی که در آن عوامل", "image_url": "https://techcrunch.com/wp-content/uploads/2026/10/rohit-5.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Google", "Meta"], "datetime_fa": "۵ آبان • ۱۸:۲۹"}, {"source": "NYT Tech", "title": "How Billionaires Are Fighting the Prop 40 California Wealth Tax", "link": "https://www.nytimes.com/2026/10/27/technology/proposition-40-california-billioniare-tax.html", "summary": "The latest Silicon Valley billionaire club is a $333 million political ad machine that is heavily engaged in next week’s elections.", "date_str": "2026-10-27T14:55:35+00:00", "hash": "c54af21a191a5f86", "title_fa": "چگونه میلیاردرها با مالیات بر ثروت کالیفرنیا Prop 40 مبارزه می کنند", "summary_fa": "آخرین باشگاه میلیاردرهای سیلیکون ولی یک دستگاه تبلیغات سیاسی 333 میلیون دلاری است که به شدت درگیر انتخابات هفته آینده است.", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۵ آبان • ۱۸:۲۵"}, {"source": "The Guardian AI", "title": "‘Meaningless as a laptop screensaver’: reviewers slate Musk’s AI-made Odyssey film", "link": "https://www.theguardian.com/technology/2026/oct/27/reviewers-slate-musk-ai-grok-odyssey-film-nolan", "summary": "Tesla tycoon launched Grok project after criticising Christoper Nolan’s diverse casting for his Homeric blockbuster Elon Musk has released an AI-generated rival to Christopher Nolan’s The Odyssey after pledging to make a version “true to the art of Homer”. Having criticised the hit movie in the summer, the tycoon said he would use Grok Imagine to make a “historically accurate” adaptation. Continue reading...", "date_str": "2026-10-27T14:08:41+00:00", "hash": "05c562008c286204", "title_fa": "\"بی معنی به عنوان محافظ صفحه نمایش لپ تاپ\": منتقدان فی l taboo in China and are considered disrespectful. Dongpeng, a drinks company whose ads and packaging feature Mbappé, announced on Tuesday that it would no longer work with him. \"Our company firmly opposes and has zero tolerance for actions that hurt national feelings,\" it said in a statement. \"Effective immediately, we are ending all cooperation with Kylian Mbappé.\" Mengniu, the country's largest dairy producer, also released a similar statement. Soon after it was posted, Dongpeng's statement became the top-trending topic on the Chinese social media site Weibo. Mbappé apologized in a statement on Tuesday morning, calling the comment \"ill-judged.\" \"I now understand that it hurt many people in China and in Chinese communities around the world,\" he said in the statement, which was posted in English, French, and Mandarin. \"I apologize to everyone my words have upset. This was absolutely not my intention. I have deep respect for the Chinese people and their history, and I am sincerely sorry.\" https://t.co/MQBo9NCSy5 — Kylian Mbappé (@KMbappe) October 27, 2026 Mbappé is one of soccer's biggest stars. On Monday, he came second in ", "date_str": "2026-10-27T14:00:37+00:00", "hash": "cc05d5d807f14faf", "title_fa": "کیلیان امباپه، ستاره جهانی فوتبال، پس از شوخی در مورد رئیس مائو، حامیان مالی خود را در چین از دست می دهد.", "summary_fa": "کیلیان ام‌باپه روی بطری‌های نوشیدنی الکترولیتی دانگ‌پنگ نشان داده شده است. VCG/VCG از طریق گتی ایماژ یکی از بزرگترین ستاره های فوتبال در چین به دلیل شوخی در مورد رئیس مائو تسه تونگ در آب داغ است. کیلیان ام‌باپه در پادکستی از مائو به عنوان «دیکتاتور چین» در مورد میم‌های مورد علاقه‌اش یاد کرد. دو برند چینی به قرارداد خود با امباپه پایان دادند، در حالی که سهام کفاش On، که حامی مالی او بود، سقوط کرد. برندهای چینی پس از شوخی درباره مائو تسه تونگ در پادکست، روابط خود را با کیلیان امباپه، یکی از بزرگترین ستاره های فوتبال جهان قطع می کنند. امباپه که برای رئال مادرید بازی می کند و کاپیتان تیم ملی فرانسه است، به دلیل اعتماد به نفس و نفوذش بر  instead next time you're dining out. Ordering something they can readily buy at their local grocer Shebeko/Shutterstock Sommeliers work hard to curate thoughtful and interesting wine lists at restaurants. If you can get the wine at your grocery store or any retailer you frequent, skip it while you're out. Dining out is a time to explore and discover something new. This can be a grape you've never had, a producer you've never heard of, or a wine from a new-to-you region. Sure, you've had a Tuscan red wine, but have you had a red wine from Oltrepò Pavese made from pinot-noir grapes? At Italian restaurants, I always look out for bottles of La Genisia pinot. Exclusively sticking with overpriced bottles from major wine regions Ritu Manoj Jethani/Shutterstock Bordeaux is widely considered one of the finest wine regions in France, and Napa Valley reigns supreme in the US. So, it's no surprise that their wines often have price tags to match their elite status. Instead, I always look for areas near these benchmark regions to expand my horizons and save a few bucks. Just outside Bordeaux is a region called Cahors, which is known for making wines from the malbec grape. Crocus Wines is a reputable brand to try. In terms of Napa alternatives, I tend to reach for bottles from the Anderson Valley in Mendocino. Classic producers include Goldeneye Winery and Husch Vineyards. Only ever ordering white wines within their comfort zone guys_who_shoot/Shutterstock Ubiquitous, \"comfort zone\" white wines like chardonnay, sauvignon blanc, and pinot grigio tend to have cultlike followings. If you're open to branching out and are in a white-wine rut, I say start by taking a closer look at the menu. For example, Italy has a treasure trove of \"under the radar\" varieties. Th", "date_str": "2026-10-27T13:15:06+00:00", "hash": "87b450936421fc01", "title_fa": "4 اشتباهی که مردم هنگام سفارش شراب در رستوران مرتکب می شوند، به گفته یک سوملیه", "summary_fa": "سفارش شراب نباید ترسناک یا دشوار باشد. Carlo Prearo/Shutterstock به عنوان یک ساملی، من عاشق امتحان شراب های جدید در رستوران ها هستم، اما همه آنها برنده نیستند. بسیاری از شراب‌های سفید ایتالیایی که برخی از کم‌ارزش‌ترین شراب‌های جهان هستند، غافل می‌شوند. از بطری های مناطق معروف شراب صرف نظر کنید و به جای آن از همسایگان خود سفارش دهید. ارائه یک لیست شراب گسترده در یک رستوران می تواند غافلگیر کننده باشد. صفحات متعدد با چاپ ریز می تواند حجم زیادی از اطلاعات را به همراه داشته باشد - اضطراب ایجاد می شود و شما مطمئن نیستید که چه چیزی را سفارش دهید. اما به عنوان یک ساملی، من برای درک همه آن جزئیات کوچک آموزش دیده ام، بنابراین شما مجبور نیستید. در اینجا اشتباهاتی وجود دارد که می بینم مردم هنگام سفارش شراب مرتکب می شوند - به علاوه توصیه هایی برای اینکه دفعه بعد که بیرون غذا می خورید چه کاری انجام دهید. سفارش دادن چیزی که می‌توانند به راحتی در خواربار فروشی محلی خود بخرند، ساملی‌ها سخت تلاش می‌کنند تا فهرست‌های متفکرانه و جالب شراب را در رستوران‌ها تهیه کنند. اگر می‌توانید شراب را از خواربارفروشی یا هر خرده‌فروشی که به آن سر می‌زنید تهیه کنید، وقتی بیرون هستید از آن صرفنظر کنید. ناهار خوری زمانی برای کشف و کشف چیزهای جدید است. این می‌تواند انگوری باشد که هرگز نخورده‌اید، تولیدکننده‌ای باشد که هرگز نامش را نشنیده‌اید، یا شرابی از منطقه‌ای باشد که تازه به آن دست یافته‌اید. مطمئناً، شما یک شراب قرمز توسکانی مصرف کرده‌اید، اما آیا شراب قرمزی از Oltrepò Pavese که از انگور پینو نوآر ساخته شده بود، خورده‌اید؟ در رستوران های ایتالیایی، من همیشه به دنبال بطری های La Genisia pinot هستم. به طور انحصاری چسبیدن به بطری های گران قیمت از مناطق عمده شراب Ritu Manoj Jethani/Shutterstock Bordeaux به طور گسترده", "image_url": "https://i.insider.com/66e1d196cfb7f307e5708f54?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۵ آبان • ۱۶:۴۵"}, {"source": "Lifehacker", "title": "These Retro-Chic Nothing Headphones Are $100 Off Right Now", "link": "https://lifehacker.com/tech/nothing-headphones-1-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page باشید، می‌توانید حالت شفافیت را روشن کنید. علیرغم شکل مستطیلی غیرعادی گوشواره‌های بیرونی، آنها از داخل با لایه‌بندی فراوان گرد می‌شوند و دارای استاندارد IP52 هستند که", "image_url": "https://lifehacker.com/imagery/articles/01M5X2SWE81DDF2G6GXFBYZ9D1/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "موسیقی"], "datetime_fa": "۵ آبان • ۱۸:۰۰"}, {"source": "Lifehacker", "title": "How to Export Your Arc Data to a New Browser", "link": "https://lifehacker.com/tech/how-to-export-arc-data-to-new-browser?utm_medium=RSS", "summary": "If you've been a dedicated Arc browser user, the time has finally come to say goodbye. The Browser Company paused development of Arc in 2025, continuing only with security updates. As announced late last week, Arc will officially sunset on Dec. 22, 2026, giving users two months to transition their data to an alternative. One option is to move to the company's new AI-focused Dia browser , though there are other (potentially better) choices depending on what you're looking for. Most data from Arc including Spaces, Favorites, pinned tabs, and folders as well as passwords, bookmarks, extensions, and history will transition automatically over to Dia, but if you're switching to a different platform entirely, you'll need to take what you can with you before Dec. 22. How to export your Arc data to a new browser Officially, Arc supports exporting Spaces and tabs only , and the resulting Export.md plain-text file is simply a list of links that you can open and bookmark in your new browser. MacOS users can initiate this process via Arc Settings Advanced Export Data and saving the file to a preferred location. On Windows, open the Arc menu, select Settings , and go to Export Spaces and tabs Export Data . To simply copy and paste every link from one folder, right-click the folder, select Copy All Links , and paste them wherever you'd like (select Copy All Links as Markdown to keep link titles on macOS). You can also save Easels as images by tapping the share icon Share Via... and selecting PNG . There's no formal process to export other Arc data. If you saved logins in Arc, now is a good time to start moving credentials over to a different platform. (Our top picks for password managers aren't tied to a single browser.) There are a few alternatives to Arc's official export process, which is highly manual and doesn't keep your folder structure intact. There are several third-party scripts available (for free) that can facilitate the transition as well as a paid extension called ArcEscape that can export folders and pinned tabs and import into another browser. The extension is available for Chrome, Edge, Brave, Vivaldi, and Firefox. According to Arc's FAQ, all user accounts will be deactivated on Dec. 22, and personal data will be deleted within 30 days of deactivation.", "date_str": "2026-10-27T14:00:00+00:00", "hash": "11cd747a7189c3ff", "title_fa": "چگونه داده های Arc خود را به یک مرورگر جدید صادر کنیم", "summary_fa": "اگر کاربر اختصاصی مرورگر Arc بوده اید، بالاخره زمان خداحافظی فرا رسیده است. شرکت مرورگر توسعه Arc را در سال 2025 متوقف کرد و تنها با به‌روزرسانی‌های امنیتی ادامه داد. همانطور که در اواخر هفته گذشته اعلام شد، Arc به طور رسمی در 22 دسامبر 2026 غروب می کند و به کاربران دو ماه فرصت می دهد تا داده های خود را به یک جایگزین انتقال دهند. یکی از گزینه ها این است که به مرورگر جدید Dia متمرکز بر هوش مصنوعی شرکت بروید، اگرچه بسته به آنچه به دنبال آن هستید، انتخاب های دیگری (به طور بالقوه بهتر) وجود دارد. بیشتر داده‌های Arc از جمله Spaces، Favorites، برگه‌ها و پوشه‌های پین‌شده، همچنین گذرواژه‌ها، نشانک‌ها، برنامه‌های افزودنی و تاریخچه به‌طور خودکار به Dia منتقل می‌شوند، اما اگر به طور کامل به پلتفرم دیگری تغییر مکان می‌دهید، باید قبل از ۲۲ دسامبر هر آنچه را که می‌توانید با خود ببرید. چگونه داده‌های Arc خود را به یک مرورگر جدید صادر کنیم به طور رسمی، Arc فقط از صادرات Spaces و برگه‌ها پشتیبانی می‌کند و فایل متنی ساده Export.md به سادگی فهرستی از پیوندهایی است که می‌توانید آن‌ها را باز کرده و در مرورگر جدید خود نشانک‌گذاری کنید. کاربران MacOS می توانند این فرآیند را از طریق Arc Settings Advanced Export Data و ذخیره فایل در مکان دلخواه آغاز کنند. در ویندوز، منوی Arc را باز کنید، تنظیمات را انتخاب کنید و به Export Spaces و برگه‌ها Export Data بروید. برای اینکه به سادگی هر پیوند را از یک پوشه کپی و جایگذاری کنید، روی پوشه کلیک راست کنید، Copy All Links را انتخاب کنید و هر کجا که می‌خواهید آن‌ها را جای‌گذاری کنید (برای حفظ عنوان پیوندها در macOS، Copy All Links را به‌عنوان Markdown انتخاب کنید). همچنین می توانید Easels را به عنوان تصویر با ضربه زدن روی نماد اشتراک", "image_url": "https://lifehacker.com/imagery/articles/01M5WZWMBKPBPF8NPFNMQ2MY91/hero-image.fill.size_1200x675.png", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۵ آبان • ۱۷:۳۰"}],
      media: [{"source": "Billboard", "title": "How KATSEYE’s Sophia Laforteza Made ‘Forgotten Island’ INXS Cover Her Own: ‘She Really Has the Story in Her DNA’", "link": "https://www.billboard.com/culture/tv-film/katseye-sophia-laforteza-forgotten-island-inxs-cover-video-1236368521/", "summary": "With Forgotten Island s central story of friendship and themes inspired by Philippines mythology, Filipino-American singer Sophia Laforteza of the global girl group KATSEYE was a fitting pick to make music for the DreamWorks Animation film. In a new digital bonus feature debuting exclusively on Billboard , Sophia and her collaborators including composer Nathan Matthew David, producer Mike Elizondo and writers/directors Joel Crawford and Januel P. Mercado take viewers inside the studio to discuss the making of her cover of INXS Never Tear Us Apart for the film, which arrives on digital platforms Tuesday (Oct. 27) with more than 60 minutes of bonus content. Related KATSEYE s Sophia Says Her INXS Cover for Forgotten Island Is The Most Sophia Thing I Could Do Why Filipino Pop Powerhouses SB19 BINI Are Embracing the Grammys Asian Pop Category: We See It as a Door Opening, Not a Box Closing SB19 Has No Plans to Stop Breaking Barriers: It Feels Like We re Unstoppable ‘Never Tear Us Apart’ is really kind of the journey of this movie and of the girls’ friendship – their anthem, in a way, Crawford says of lead besties Raissa and Jo (voiced by singer/songwriter H.E.R.). For Sophia and Mike and Nathan to make it an interpretation that stands on its own is an incredible accomplishment, Mercado adds of reinterpreting the 1988 top 10 Billboard Hot 100 hit for INXS. For David, Sophia immediately impressed him in the studio. Right from the beginning of her vocal session, we knew it was going to be really special. I think she just sang the hell out of this song. Sophia s personal connection to the film as a Filipino American was what drove home the musical connection. Hearing her talk about how she really has the story in her DNA, in her soul what she brought to this, I can’t imagine anyone else, Crawford says. That story was Sophia s north star as she navigated making Never Tear Us Apart her own. As a performer, my strength is, if you tell me what the story is, I’ll tell it the best way that I can, she says in the bonus feature. I got to watch the scene while singing it, and I really tried to take every ounce of knowledge I knew just growing up in this world. This is one of the most beautiful things I think I’ll ever do. Watch the full bonus feature here: Sophia is currently on hiatus from KATSEYE, but HYBE announced earlier this month that she plans to return to group activities in January 2027. She stepped back from the group in August to focus on her mental health, mean", "date_str": "2026-10-27T15:00:00+00:00", "hash": "0a1479e7cb08f702", "title_fa": "سوفیا لافورتزا از KATSEYE چگونه «جزیره فراموش شده» را ساخت INXS پوشش خود را: «او واقعاً داستان را در DNA خود دارد»", "summary_fa": "سوفیا لافورتزا، خواننده فیلیپینی-آمریکایی از گروه جهانی دختران KATSEYE، با داستان اصلی دوستی جزیره فراموش شده و مضامین الهام گرفته شده از اساطیر فیلیپین، انتخاب مناسبی برای ساخت موسیقی برای فیلم انیمیشن DreamWorks بود. سوفیا و همکارانش از جمله آهنگساز ناتان متیو دیوید، تهیه کننده مایک الیزوندو و نویسندگان/کارگردانان جوئل کرافورد و ژانوئل پی. Mercado بینندگان را به داخل استودیو می برد تا درباره ساخت کاور INXS Never Tear Us Apart برای این فیلم که از سه شنبه (27 اکتبر) روی پلتفرم های دیجیتالی با بیش از 60 دقیقه محتوای جایزه می آید، بحث کنند. سوفیای مرتبط KATSEYE می گوید جلد INXS او برای Forgotten Island بهترین کاری است که می توانم انجام دهم چرا پاپ پاپ فیلیپینی SB19 BINI دوباره گرمی را پذیرفته است رده: ما آن را به عنوان یک درب باز می بینیم، نه یک جعبه بسته شدن SB19 هیچ برنامه ای برای توقف آن ندارد. «هرگز ما را از هم جدا نکن» واقعاً نوعی سفر این فیلم و دوستی دختران است – سرود آن‌ها، به نوعی، کرافورد درباره بهترین بازیگران اصلی رایسا و جو (با صدای خواننده/ترانه‌سرا H.E.R.) می‌گوید. برای سوفیا و مایک و ناتان که تفسیری بی‌نظیر از آن بسازند، موفقیتی باورنکردنی است، مرکادو تفسیر مجدد 10 موفقیت برتر بیلبورد 100 برتر سال 1988 را برای INXS اضافه می‌کند. برای دیوید، سوفیا بلافاصله او را در استودیو تحت تأثیر قرار داد. درست از ابتدای جلسه آواز او، ما می دانستیم که واقعاً خاص خواهد بود. من فکر می کنم او فقط از این آهنگ جهنم خوانده است. ارتباط شخصی سوفیا با فیلم به عنوان یک آمریکایی فیلیپینی چیزی بود که ارتباط موسیقی را به خانه رساند. کرافورد می‌گوید با شنیدن صحبت‌های او درباره اینکه واقعاً چگونه داستان را در DNA خود دارد، در روحش که چه چیزی را به این موضوع رساند، نمی‌توانم شخص دیگری", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/sophia-laforteza-forgotten-island-2026-billboard-1800.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Here Are Special Award Recipients & Performers for the 2026 Soul Train Awards: Updating List", "link": "https://www.billboard.com/lists/soul-train-awards-2026-special-awards-recipients-performers/", "summary": "BET is starting to announce the talent that will appear on the 2026 Soul Train Awards . The show, hosted by actor Anthony Anderson , will air on BET on Friday, Nov. 27, at 8 p.m. ET/PT, with a simulcast on CBS, BET Her, VH1, MTV2 and LOGO. Grammy-winning singer, songwriter and producer Durand Bernarr will receive the Soul Personified Honor and perform on the show. Bernarr will also host the 2026 Soul Train Awards Red Carpet Show: Back on Track . This digital experience is billed as “a reimagination of the traditional red carpet.” Chaka Khan has already been announced as the recipient of the Classic Soul Honor. Related Chaka Khan to Receive Classic Soul Honor at 2026 Soul Train Awards This is the first Soul Train Awards since 2023 and the first ever to simulcast on CBS. The two-hour show will tape on Thursday, Nov. 5, in Chicago. Anderson, best known for his role on ABC’s long-running Black-ish , previously hosted the Soul Train Awards in 2013. The show will be light on competitive award categories (just two, both fan-voted) but heavy on special awards and performances. In addition, the show will crown the greatest R B song of the 2020s, according to the fans. Connie Orlando serves as the executive producer of the 2026 Soul Train Awards for BET. Jesse Collins Entertainment is the production company for the show, with Jesse Collins , Dionne Harmon and Jeannae Rouzan-Clay also serving as executive producers. Here are award recipients and performers that have been announced so far for the 2026 Soul Train Awards. This post will be updated as additional names are announced.", "date_str": "2026-10-27T15:00:00+00:00", "hash": "f3541e2e866b9a97", "title_fa": "در اینجا دریافت کنندگان و مجریان جوایز ویژه برای جوایز Soul Train 2026 آمده اند: لیست به روز رسانی", "summary_fa": "BET شروع به اعلام استعدادهایی می کند که در جوایز Soul Train 2026 ظاهر می شوند. این برنامه با مجری گری بازیگر آنتونی اندرسون، جمعه، 27 نوامبر، ساعت 20 از شبکه BET پخش خواهد شد. ET/PT، با پخش همزمان در CBS، BET Her، VH1، MTV2 و LOGO. دیورند برنار، خواننده، ترانه سرا و تهیه کننده برنده گرمی، جایزه Soul Personified Honor را دریافت خواهد کرد و در این برنامه اجرا خواهد کرد. برنار همچنین میزبان مراسم Soul Train Awards 2026 Carpet Show: Back on Track خواهد بود. این تجربه دیجیتال به عنوان \"تخیل مجدد فرش قرمز سنتی\" نامگذاری شده است. چاکا خان قبلاً به عنوان دریافت کننده افتخار روح کلاسیک اعلام شده است. مربوطه چاکا خان در جوایز Soul Train 2026 افتخار روح کلاسیک را دریافت می کند این اولین جوایز Soul Train از سال 2023 است و اولین بار است که در CBS پخش می شود. این نمایش دو ساعته در روز پنجشنبه، 5 نوامبر، در شیکاگو پخش خواهد شد. اندرسون که بیشتر به خاطر نقشش در سریال طولانی‌مدت Black-ish شبکه ABC شناخته می‌شود، قبلاً در سال 2013 میزبان جوایز Soul Train Awards بود. این نمایش در دسته‌های جوایز رقابتی (فقط دو مورد، که هر دو با رای طرفداران انتخاب شده‌اند) اما برای جوایز و اجراهای ویژه سنگین خواهد بود. علاوه بر این، طبق گفته طرفداران، این نمایش تاج بزرگترین آهنگ R B در سال 2020 را خواهد داشت. کانی اورلاندو به عنوان تهیه کننده اجرایی جوایز ترن روح 2026 برای BET فعالیت می کند. Jesse Collins Entertainment شرکت سازنده این نمایش است و جسی کالینز، دیون هارمون و جین روزان-کلی نیز به عنوان تهیه کنندگان اجرایی این نمایش را بر عهده دارند. در اینجا دریافت کنندگان جوایز و اجراکنندگانی هستند که تاکنون برای جوایز Soul Train 2026 اعلام شده اند. این پست با اعلام اسامی تکمیلی بروزرسانی خواهد", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/2259300419-e1779388906380.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۱۸:۳۰"}, {"source": "Deadline", "title": "Sosie Bacon Set As Co-Lead Alongside Nikolaj Coster-Waldau In MGM+ Series ‘The Black Tapes’", "link": "https://deadline.com/2026/10/sosie-bacon-mgm-plus-series-the-black-tapes-1237191989/", "summary": "Sosie Bacon (Smile, Scarpetta) has been tapped as the female lead opposite Nikolaj Coster-Waldau in The Black Tapes, MGM+ s supernatural investigation drama series based on the 2015 horror podcast of the same name. In The Black Tapes, Dr. Richard Strand (Coster-Waldau), a brilliant psychiatrist with a mysterious past, teams with the obsessed, methodical physicist Alex [ ]", "date_str": "2026-10-27T15:00:00+00:00", "hash": "fbabe7ea09b7e1eb", "title_fa": "سوسی بیکن در کنار نیکولای کاستر والداو در مجموعه MGM+ \"The Black Tapes\" نقش آفرینی می کند.", "summary_fa": "سوسی بیکن (لبخند، اسکارپتا) به عنوان نقش اول زن در مقابل نیکولای کاستر والداو در سریال درام تحقیقات فراطبیعی MGM+ The Black Tapes بر اساس پادکست ترسناک سال 2015 به همین نام انتخاب شده است. در نوارهای سیاه، دکتر. ریچارد استرند (کاستر والدو)، روانپزشکی درخشان با گذشته ای مرموز، تیمی با فیزیکدان متدین و وسواس آلکس [ ] سوسی بیکن (لبخند، اسکارپتا) به عنوان نقش اول زن در مقابل نیکولای کاستر والداو در نوارهای سیاه، مجموعه درام MGM+1 بر اساس تحقیقات فراطبیعی 5 درام انتخاب شده است. در نوارهای سیاه، دکتر. ریچارد استرند (کاستر والدو)، روانپزشکی     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
