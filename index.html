mmary_fa": "اگر همه‌چیز طبق برنامه پیش برود، اسپیس‌ایکس به‌زودی به نقطه عطفی بزرگ در تاریخ پروازهای فضایی دست خواهد یافت. تبلیغات ایلان ماسک، بنیان‌گذار و مدیرعامل شرکت، سه‌شنبه ۲۰ اکتبر در جریان نشست گزارش مالی سه‌ماهه سوم اسپیس‌ایکس اعلام کرد که این شرکت قصد دارد در پرواز آزمایشی بعدی موشک غول‌پیکر استارشیپ، هر دو مرحله آن را در هوا مهار کند. این پرواز برای ماه آینده برنامه‌ریزی شده است. ماسک گفت اگر اسپیس‌ایکس موفق به انجام این کار شود، «برای نخستین بار در تاریخ، یک پرتابگر مداری به‌طور کامل بازیابی خواهد شد». او افزود: «تنها راهی که می‌توانیم آگاهی را به‌طور پایدار به خارج از زمین گسترش دهیم، استفاده از موشکی است که به‌طور کامل چندبارمصرف باشد. بنابراین، به‌نظر من، این یک نقطه عطف فناورانه‌ی عمیق در تاریخ تمدن و آگاهی است.» استارشیپ بزرگ‌ترین و قدرتمندترین موشکی است که تاکنون ساخته شده و هنگامی که هر دو مرحله آن روی هم سوار شوند، ارتفاعش به بیش از ۱۲۲ متر می‌رسد. همان‌طور که ماسک اشاره کرد، هر دو مرحله استارشیپ، یعنی بوستر سوپر هوی و فضاپیمای شیپ، به‌گونه‌ای طراحی شده‌اند که بتوان آن‌ها را به‌طور کامل و در فواصل زمانی کوتاه دوباره به پرواز درآورد. اسپیس‌ایکس باور دارد که این دستاورد می‌تواند اسکان انسان در مریخ و دیگر مأموریت‌های اکتشافی بلندپروازانه را از نظر اقتصادی امکان‌پذیر کند. کپی لینک روش بازیابی استارشیپ چگونه است؟ استارشیپ درمقایسه موشک‌های فالکون ۹ و فالکون هوی ، به روشی متفاوت بازیابی می‌شود. موشک‌های کنونی اسپیس‌ایکس فقط مرحله‌ی اول چندبارمصرف دارند و مرحله فوقانی آن‌ها برای بازیابی پس از پرتاب طراحی نشده است. بوسترهای فالکون ۹ و فالکون هوی پس از پرتاب، روی سکوهای فرود در نزدیکی محل پرتاب یا روی کشتی‌هایی بدون سرنشین در دریا فرود می‌آیند. اما سوپر هوی و شیپ قرار است به‌طور مستقیم به برج پرتاب خود بازگردند و به‌وسیله‌ی بازوهایی غول‌پیکر به"}, {"source": "Zoomit", "title": "نبرد تازه اپل و ناظر بریتانیایی بر سر پرداخت بدون تماس در آیفون", "link": "https://www.zoomit.ir/mobile/469536-uk-proposes-apple-pay-rivals/", "summary": "سازمان رقابت بریتانیا تغییراتی را برای ارزان‌تر و آسان‌تر شدن ارائه‌ی جایگزین‌های Apple Pay روی آیفون پیشنهاد کرد.", "date_str": "2026-10-21T20:00:00+00:00", "hash": "779cd10df3a1edc2", "title_fa": "نبرد تازه اپل و ناظر بریتانیایی بر سر پرداخت بدون تماس در آیفون", "summary_fa": "سازمان رقابت بریتانیا تغییراتی را برای ارزان‌تر و آسان‌تر شدن ارائه‌ی جایگزین‌های Apple Pay روی آیفون پیشنهاد کرد. تبلیغات سازمان رقابت و بازارهای بریتانیا (CMA) با هدف ارزان‌تر و آسان‌تر کردن توسعه اپلیکیشن‌های پرداخت برای شرکت‌های ثالث، طرحی را جهت بازنگری در دسترسی به تراشه NFC گوشی‌های آیفون ارائه داد. رگولاتور بریتانیایی کارمزدها و محدودیت‌های کنونی اپل را مانعی جدی برای رقابت شرکت‌ها و راه‌اندازی سرویس‌های پرداخت بدون تماس می‌داند. اپل دسترسی به NFC را در سال ۲۰۲۴ میلادی برای توسعه‌دهندگان بریتانیا آزاد کرد؛ اما سازندگان برنامه‌ها ناچار به امضای توافق‌نامه، پرداخت هزینه‌ها و استفاده انحصاری از تراشه‌ی امنیتی Secure Element هستند. رگولاتور بریتانیا اکنون پیشنهاد کرده است که اپل فناوری شبیه‌سازی کارت میزبان یعنی HCE را نیز در دسترس قرار دهد تا اجرای ابزارهای پرداخت بدون نیاز به این تراشه ممکن شود. طرح جدید علاوه‌بر باز کردن مسیرهای فنی، به کاهش چشمگیر کارمزدهای دسترسی به امکانات آیفون تأکید دارد، هرچند اپل کماکان اجازه‌ی دریافت مبالغی مشخص را حفظ خواهد کرد. اتحادیه‌ی اروپا از سال ۲۰۲۴ میلادی دسترسی رایگان به فناوری HCE را اجرایی کرده است و بر اساس اعلام نهادهای نظارتی، از آن زمان سرویس‌های متعددی در قاره‌ی سبز فعال شده‌اند؛ شرایطی که هنوز در بریتانیا به ثبت نرسیده و هیچ کیف پول رقیبی در بریتانیا شکل نگرفته است. نماینده اپل در گفت‌و‌گو با رویترز ، درباره این سیاست‌ها گفت: «ما معتقد نیستیم که CMA باید اپل را ملزم به اتخاذ رویکردی با حفاظت‌های حریم خصوصی و امنیتی پایین‌تر کند. ما به تعامل سازنده ادامه خواهیم داد تا به نتیجه‌ای برسیم که به نفع کاربرانمان باشد.» سازمان رقابت بریتانیا اعلام کرد شواهد بررسی‌شده هیچ نشانه‌ای از ناامن بودن روش‌های پیشنهادی را اثبات نمی‌کنند. فرصت ثبت نظرات و بازخوردها درباره پیش‌نویس این مقررات تا تاریخ ۱۷ نوامبر ۲۰۲۶ (۲۶ آبان ۱۴۰۵) ادامه دارد و نهاد قانون‌گذار پس از آن نتیجه‌ی"}, {"source": "Zoomit", "title": "جنرال موتورز با هوش مصنوعی زمان توسعه خودروها را نصف می‌کند", "link": "https://www.zoomit.ir/car/469585-gm-onward-ai-ev-battery-central-compute-autonomy/", "summary": "جنرال موتورز از کامپیوتر مرکزی ۴۰ برابر قوی‌تر، باتری LMR و رانندگی بدون نگاه برای خودروهایش گفت؛ اما آیا وعده‌ها سرانجام عملی می‌شوند؟", "date_str": "2026-10-21T19:38:08+00:00", "hash": "958611d1505055f8", "title_fa": "جنرال موتورز با هوش مصنوعی زمان توسعه خودروها را نصف می‌کند", "summary_fa": "جنرال موتورز از کامپیوتر مرکزی ۴۰ برابر قوی‌تر، باتری LMR و رانندگی بدون نگاه برای خودروهایش گفت؛ اما آیا وعده‌ها سرانجام عملی می‌شوند؟ تبلیغات جنرال موتورز هنوز هم در کسب‌وکار فروش وانت‌های پرمصرف و شاسی‌بلندهای غول‌پیکر حضوری پررنگ دارد؛ اما اگر به حرف‌های مدیرانش گوش دهید، می‌فهمید غول آمریکایی با سرعت در حال پوست‌اندازی است و می‌خواهد به بازیگری چابک و نرم‌افزارمحور بدل شود؛ شرکتی که هوش مصنوعی را محکم در مشت گرفته. جنرال موتورز در رویداد آن‌وارد مجموعه‌ای گسترده از طرح‌ها را در حوزه‌ی خودروهای برقی، رانندگی خودران و هوش مصنوعی رونمایی کرد. هدف همه‌ی آن‌ها یک چیز بود؛ ایستادگی در برابر تهدید رو‌به‌رشد خودروسازان چینی که فناوری را در قلب محصولاتشان نشانده‌اند. وعده‌ها کوچک نیستند. جنرال موتورز می‌گوید قرار است به این اهداف برسد: جنرال موتورز می‌خواهد از یک خودروساز سنتی به بنگاهی فناورمحور با محوریت هوش مصنوعی تبدیل شود و در مسیر، از مقیاس عظیم ناوگانش در هر دو بخش خودروهای برقی و بنزینی بهره ببرد. راهبردی جسورانه به نظر می‌رسد، هرچند نسخه‌های مشابهش را پیش‌تر هم شنیده‌ایم. کپی لینک تحقیق‌وتوسعه سریع‌تر و همزاد دیجیتال کارخانه‌ها جنرال موتورز ده‌ها سال با چرخه‌های کُند توسعه‌ی خودرو دست‌وپنجه نرم کرده است؛ چرخه‌هایی چهار تا پنج‌ساله که در مقایسه با سرعت سرسام‌آور فناوری‌های مصرفی، عقب می‌مانند. خودروساز آمریکایی کوشید با اهداف بلندپروازانه در حوزه‌ی خودروهای برقی و نرم‌افزارهایی مانند سوپرکروز (Super Cruise) فاصله را پر کند. با این‌حال معماری نرم‌افزارمحور به‌تدریج از یک اصطلاح پرسروصدا به حداقل الزامات صنعت تبدیل شد. در چنین فضایی، نگه‌داری از پلتفرم‌های پراکنده و ده‌ها واحد کنترل ناهمگون، تلاش‌های مهندسی جنرال موتورز را به‌شدت کند می‌کرد. حالا جنرال موتورز می‌گوید قصد دارد با روشی به نام «مجازی‌سازی رشته‌ی دیجیتال» چرخه‌ی توسعه را به تنها دو سال برساند. به‌جای کار در بخش‌های جدا از هم یا تحویل گام‌به‌گام و زمان‌بر کار از یک تیم به تیم"}, {"source": "Zoomit", "title": "گیمرها در شوک؛ سازنده بازی Mass Effect پس از ۳۰ سال تعطیل شد", "link": "https://www.zoomit.ir/gaming/469584-ea-shuts-down-bioware-mass-effect-cancelled/", "summary": "بایوور، خالق Mass Effect و Dragon Age، پس از بیش از ۳۰ سال تعطیل شد؛ تصمیمی که با خصوصی‌شدن EA و تعدیل حدود ۴۰۰ نفر گره خورده است.", "date_str": "2026-10-21T19:28:48+00:00", "hash": "0863b5bb999d2da9", "title_fa": "گیمرها در شوک؛ سازنده بازی Mass Effect پس از ۳۰ سال تعطیل شد", "summary_fa": "بایوور، خالق Mass Effect و Dragon Age، پس از بیش از ۳۰ سال تعطیل شد؛ تصمیمی که با خصوصی‌شدن EA و تعدیل حدود ۴۰۰ نفر گره خورده است. تبلیغات پرونده‌ی بایوور بسته شد. استودیویی که نامش با نقش‌آفرینی‌هایی چون Mass Effect و Dragon Age و Star Wars: Knights of the Old Republic گره خورده است، به‌طور رسمی تعطیل می‌شود . الکترونیک آرتز هم هم‌زمان تصمیم گرفته ساخت نسخه‌ی بعدی Mass Effect را که در دست توسعه بود، ادامه ندهد. بلومبرگ گزارش داده که الکترونیک آرتز در مجموع حدود ۴۰۰ نفر را تعدیل می‌کند که نزدیک به ۵۰ نفر از آن‌ها در بایوور مشغول به کار بودند. موج تازه‌ی تغییرات چند ماه پس از خصوصی‌شدن الکترونیک آرتز از راه رسیده است. گروهی از سرمایه‌گذاران به رهبری صندوق سرمایه‌گذاری عمومی عربستان سعودی، سیلور لیک و افینیتی پارتنرز، الکترونیک آرتز را در معامله‌ای ۵۵ میلیارد دلاری خریدند. الکترونیک آرتز در صنعت بازی تنها نیست. ایکس‌باکس امسال برنامه‌ای را با عنوان «بازتنظیم» کلید زده که ۳٬۲۰۰ تعدیل را در بر می‌گیرد، بانجی از تعدیل‌هایی «قابل‌توجه» خبر داده و اپیک گیمز، سازنده‌ی فورتنایت، بیش از ۱٬۰۰۰ نفر از نیروهایش را کنار گذاشته است. مدیر ارشد استودیوهای الکترونیک آرتز و مدیر عملیاتی این شرکت، در اطلاعیه‌ی داخلی نوشتند: «بایوور استودیویی افسانه‌ای است که به تعریف ژانر نقش‌آفرینی کمک کرد و ما به‌سادگی به چنین تصمیمی نرسیدیم.» بایوور در شبکه‌های اجتماعی متنی منتشر کرد که با مرور سابقه‌ی سی‌ساله‌اش آغاز می‌شود. استودیو نوشت: «بیش از ۳۰ سال، بایوور چیزی فراتر از یک استودیو بوده است. خانه‌ای برای قصه‌گوها، توسعه‌دهندگان و بازیکنانی که به دنیاهای ما جان بخشیدند.» در ادامه، فهرستی از نام‌هایی آمد که هویت استودیو را شکل داده‌اند؛ از Baldur&#x27;s Gate و Neverwinter Nights گرفته تا Star Wars: Knights of the Old Republic و Dragon Age و Mass Effect و Anthem."}, {"source": "Zoomit", "title": "جریمه سنگین ۲۵ میلیارد دلاری؛ رسوایی کمبریج آنالیتیکا دوباره گریبان متا را گرفت", "link": "https://www.zoomit.ir/business/469583-meta-25-billion-penalty-cambridge-analytica-new-mexico/", "summary": "قاضی نیومکزیکو، متا را بابت بیش از ۴۳ میلیون تخلف به پرداخت ۲۵ میلیارد دلار محکوم کرد. ریشه‌ی پرونده به رسوایی کمبریج آنالیتیکا می‌رسد.", "date_str": "2026-10-21T19:23:05+00:00", "hash": "07dd6fdac255b964", "title_fa": "جریمه سنگین ۲۵ میلیارد دلاری؛ رسوایی کمبریج آنالیتیکا دوباره گریبان متا را گرفت", "summary_fa": "قاضی نیومکزیکو، متا را بابت بیش از ۴۳ میلیون تخلف به پرداخت ۲۵ میلیارد دلار محکوم کرد. ریشه‌ی پرونده به رسوایی کمبریج آنالیتیکا می‌رسد. تبلیغات رسوایی کمبریج آنالیتیکا پس از سال‌ها دوباره گریبان متا را گرفت. قاضی دادگاهی در ایالت نیومکزیکو، غول شبکه‌های اجتماعی را به پرداخت ۲۵ میلیارد دلار جریمه محکوم کرد؛ عددی که بابت بیش از ۴۳ میلیون مورد تخلف از قانون رویه‌های تجاری ناعادلانه‌ی ایالت تعیین شد. حکم تازه ، سنگین‌ترین ضربه‌ی حقوقی به متا در سال‌های اخیر به شمار می‌رود. شرکت مادر فیسبوک طی ماه‌های گذشته چند شکست دیگر در دادگاه را پشت سر گذاشته بود و به چند توافق مالی هم تن داد، اما هیچ‌کدام به ابعاد پرونده‌ی نیومکزیکو نمی‌رسند. مبلغ جدید حتی از عدد توافق اخیر متا در پرونده‌های ایمنی آنلاین کودکان نیز به‌مراتب بیشتر است. ماجرا در شهریور امسال وارد مرحله‌ی تعیین‌کننده شد. هیئت منصفه‌ی نیومکزیکو در آن ماه رأی داد که متا درباره‌ی شیوه‌ی محافظت از داده‌های کاربران و همچنین جلوگیری از انتشار اطلاعات نادرست و سخنان نفرت‌پراکن در پلتفرم‌هایش، مصرف‌کنندگان را گمراه کرده است. ریشه‌ی پرونده به شکایتی در سال ۲۰۲۱ بازمی‌گردد. شکایت در پی افشاگری‌هایی مطرح شد که چند سال پیش‌تر پرده از کار کمبریج آنالیتیکا برداشته بود. شرکت مشاوره‌ی سیاسی بریتانیایی داده‌های میلیون‌ها حساب کاربری فیسبوک را جمع‌آوری کرده بود تا پیام‌هایی را شناسایی کند که در آستانه‌ی نخستین انتخابات ریاست‌جمهوری دونالد ترامپ بیشترین تأثیر را بر رأی‌دهندگان می‌گذاشت. درواقع داده‌های شخصی، ابزار هدف‌گیری سیاسی شده بودند. کپی لینک ۲۱۹ میلیارد دلار روی کاغذ، ۲۵ میلیارد در حکم نهایی قاضی پرونده برای تعیین میزان جریمه به مجموعه‌ای از عوامل استناد کرد و آن‌ها را برای اعمال بالاترین جریمه‌ی مجاز قانونی کافی دانست. به تعبیر او، این عوامل در کنار موارد دیگر چنین تصمیمی را توجیه می‌کرد: «تعداد فوق‌العاده‌ی تخلفات عامدانه‌ای که هیئت منصفه احراز کرده»، «مدت و تکرار رفتار»،"}, {"source": "Zoomit", "title": "اینتل و ای‌ام‌دی برای تسهیل توسعه هوش مصنوعی روی تراشه‌های x86 وارد همکاری شدند", "link": "https://www.zoomit.ir/hardware/469535-intel-amd-x86-ai-collaboration/", "summary": "اینتل و AMD با همکاری یکدیگر، اجرای مدل‌های هوش مصنوعی روی پردازنده‌های x86 را تسهیل می‌کنند.", "date_str": "2026-10-21T19:15:00+00:00", "hash": "efcc4a99bd61ee78", "title_fa": "اینتل و ای‌ام‌دی برای تسهیل توسعه هوش مصنوعی روی تراشه‌های x86 وارد همکاری شدند", "summary_fa": "اینتل و AMD با همکاری یکدیگر، اجرای مدل‌های هوش مصنوعی روی پردازنده‌های x86 را تسهیل می‌کنند. تبلیغات اینتل و AMD برای ساده‌ترکردن توسعه‌ی هوش مصنوعی روی پردازنده‌های x86 همکاری می‌کنند . این دو شرکت قصد دارند با یکپارچه‌سازی ابزارهای نرم‌افزاری خود و توسعه‌ی قابلیت‌های پردازش ماتریسی، اجرای مدل‌های هوش مصنوعی روی پردازنده‌های هر دو شرکت را برای توسعه‌دهندگان آسان‌تر کنند. اینتل تأیید کرده است که ابزار oneDNN خود را با ZenDNN متعلق به AMD در قالب یک رابط برنامه‌نویسی یکپارچه‌تر هماهنگ می‌کند. هدف این اقدام، ساده‌کردن مسیر پشتیبانی از پردازنده‌های دو شرکت در فریم‌ورک یادگیری ماشین پای‌تورچ (PyTorch) است؛ به‌طوری‌که توسعه‌دهندگان برای پشتیبانی از سخت‌افزارهای مختلف، کمتر به مسیرهای نرم‌افزاری جداگانه نیاز داشته باشند. oneDNN مجموعه‌ای از کتابخانه‌های بهینه‌سازی‌شده برای اجرای عملیات یادگیری عمیق هوش مصنوعی روی پردازنده‌ها و دیگر سخت‌افزارها است. در مقابل، ZenDNN ابزارهای نرم‌افزاری AMD برای بهینه‌سازی یادگیری عمیق روی پردازنده AMD را فراهم می‌کند. هماهنگ‌سازی این ابزارها می‌تواند از پراکندگی نرم‌افزارها بکاهد و نگهداری و توسعه‌ی برنامه‌های هوش مصنوعی را آسان‌تر کند. همکاری دو شرکت به نرم‌افزار محدود نمی‌شود. اینتل و AMD همچنین روی توسعه‌ی ACE یا افزونه‌های ماتریسی پیشرفته کار می‌کنند؛ قابلیتی که هدف آن بهبود اجرای محاسبات ماتریسی موردنیاز هوش مصنوعی روی پردازنده‌های x86 است. چنین محاسباتی در بخش‌هایی مانند اجرای مدل‌های زبانی و شبکه‌های عصبی کاربرد دارد. بااین‌حال، پشتیبانی سخت‌افزاری از ACE هنوز آماده نیست و طبق اطلاعات منتشرشده، انتظار می‌رود در ادامه‌ی این دهه به سخت‌افزارها راه پیدا کند. بنابراین، مزایای عملی آن به زمان عرضه‌ی پردازنده‌های سازگار و پشتیبانی نرم‌افزاری وابسته خواهد بود."}, {"source": "Zoomit", "title": "کارت گرافیک RTX 6060 انویدیا شاید تا سال ۲۰۲۹ عرضه نشود", "link": "https://www.zoomit.ir/graphic/469534-rtx-6060-delayed-to-2029/", "summary": "گفته می‌شود کارت گرافیک میان‌رده‌ی بعدی انویدیا احتمالا تا سال ۲۰۲۹ وارد بازار نخواهد شد.", "date_str": "2026-10-21T18:00:00+00:00", "hash": "09eac964971b1195", "title_fa": "کارت گرافیک RTX 6060 انویدیا شاید تا سال ۲۰۲۹ عرضه نشود", "summary_fa": "گفته می‌شود کارت گرافیک میان‌رده‌ی بعدی انویدیا احتمالا تا سال ۲۰۲۹ وارد بازار نخواهد شد. تبلیغات گمانه‌زنی‌های تازه درباره‌ی نسل آینده‌ی پردازنده‌های گرافیکی انویدیا حاکی است که کارت گرافیک میان‌رده‌ی این خانواده یعنی RTX 6060 احتمالا زودتر از سال ۲۰۲۹ به دست خریداران نخواهد رسید. این ادعا در شرایطی مطرح می‌شود که گزارش‌های پیشین نیز از موکول‌شدن تولید انبوه سری RTX 60 به سال ۲۰۲۸ حکایت داشتند. یکی از افشاگران معتبر سخت‌افزار در انجمن NeoGAF اعلام کرد که انویدیا در دوره‌های کمبود قطعات و چالش‌های زنجیره‌ی تامین، معرفی و عرضه‌ی مدل‌های اقتصادی‌تر را به تعویق می‌اندازد. طبق پیش‌بینی او، مدل میان‌رده‌ی بعدی کارت گرافیک انویدیا حتی ممکن است عملکرد گیمینگ ضعیف‌تری نسبت‌به کنسول پلی استیشن ۶ ارائه دهد. نام‌گذاری این محصول با عنوان RTX 6060 هنوز جنبه‌ی رسمی ندارد؛ چون انویدیا تراشه‌های خود را ابتدا با شناسه‌های فنی و شماره‌های SKU توسعه می‌دهد و عناوین تجاری نهایی را در آستانه‌ی بسته‌بندی رسمی مشخص می‌سازد. از زمان معرفی معماری کپلر، میانگین فاصله‌ی زمانی میان عرضه‌ی مدل‌های رده‌ی ۶۰ حدود ۲۱ ماه بوده است؛ اما ورود احتمالی مدل جدید در سال ۲۰۲۹ این بازه را به حداقل ۴۴ ماه افزایش خواهد داد. جدول زیر روند تاریخی و فاصله‌ی زمانی عرضه‌ی کارت‌های گرافیک سری ۶۰ انویدیا را در نسل‌های مختلف نشان می‌دهد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "از جیمیل تا گوگل فوتوز؛ هوش مصنوعی جمنای به دستیار شخصی راننده‌ها تبدیل می‌شود", "link": "https://www.zoomit.ir/ai-articles/469533-google-gemini-cars-personal-intelligence/", "summary": "گوگل دستیار هوش مصنوعی جمنای در خودروها را به قابلیت «هوش شخصی» مجهز کرد تا اطلاعات برنامه‌های کاربردی را یکپارچه کند.", "date_str": "2026-10-21T17:10:00+00:00", "hash": "8e35d6d9b2b060c1", "title_fa": "از جیمیل تا گوگل فوتوز؛ هوش مصنوعی جمنای به دستیار شخصی راننده‌ها تبدیل می‌شود", "summary_fa": "گوگل دستیار هوش مصنوعی جمنای در خودروها را به قابلیت «هوش شخصی» مجهز کرد تا اطلاعات برنامه‌های کاربردی را یکپارچه کند. تبلیغات گوگل دستیار هوش مصنوعی جمنای را در پلتفرم‌های خودرویی به قابلیت Personal Intelligence مجهز کرد . با فعال‌سازی قابلیت یادشده، سیستم‌های مبتنی‌بر اندروید اتو و خودروهای دارای سیستم‌عامل داخلی گوگل می‌توانند به داده‌های کاربر در برنامه‌های مختلف دسترسی پیدا کنند. دستیار مذکور توانایی اتصال به سرویس‌هایی مانند جیمیل، تقویم، نقشه‌ی گوگل، گوگل فوتوز، یوتیوب و موتور جست‌وجو را دارد. برای نمونه، راننده هنگام حرکت به‌سمت فرودگاه می‌تواند وضعیت پرواز را جویا شود؛ هوش مصنوعی اطلاعات بلیت را از ایمیل تاییدیه استخراج کرده و وضعیت لحظه‌ای آن را بررسی می‌کند. همچنین امکان درخواست مسیریابی بر اساس رویدادهای تقویم یا حتی عکس‌های ذخیره‌شده در حساب کاربری وجود دارد. خودروسازانی نظیر فورد، جنرال موتورز، هوندا، نیسان، ولوو و پولستار پشتیبانی از نرم‌افزارهای داخلی گوگل را در مدل‌های جدیدتر خود پیاده‌سازی کرده‌اند. قابلیت شخصی‌سازی تنها در صورت فعال‌سازی صریح بخش ه د را همین‌حالا نصب کنید.", "date_str": "2026-10-21T15:23:10+00:00", "hash": "1301f73b864da3ff", "title_fa": "آپدیت بحرانی PHP بالأخره منتشر شد؛ پایان کابوس موقتی وب", "summary_fa": "دو آسیب‌پذیری بحرانی در هسته‌ی PHP بالأخره برطرف شدند. اگر مدیر وب‌سایت هستید، به‌روزرسانی جدید را همین‌حالا نصب کنید. تبلیغات پروژه‌ی PHP برای دو آسیب‌پذیری بحرانی وصله‌ی امنیتی منتشر کرد. هر دو حفره به مهاجم اجازه می‌دهند بدون احراز هویت و از راه دور، کد دلخواه خود را اجرا کند. خطر محدود به پیکربندی خاصی نیست. به‌گزارش تیم امنیتی PHP ، مدیران سرور باید بی‌درنگ به یکی از نسخه‌های ۸٫۵٫۱۲، ۸٫۴٫۲۷، ۸٫۳٫۳۶ یا ۸٫۲٫۳۵ مهاجرت کنند. ریشه‌ی مشکل در هسته‌ی PHP قرار دارد، نه در یک افزونه یا کتابخانه‌ی جانبی. به همین دلیل دامنه‌ی آسیب گسترده است و طیف وسیعی از محیط‌های اجرایی را در بر می‌گیرد. در میان همه‌ی گزینه‌ها، تیم امنیتی PHP بیشترین خطر را متوجه mod_php می‌داند. برای همین پیکربندی، یک اکسپلویت جدید وجود دارد که با یک درخواست ساده و بدون احراز هویت، حمله را پیش از اجرای حتی یک خط از کد برنامه به جریان می‌اندازد. توزیع‌های لینوکس و فروشندگان نسخه‌های پشتیبانی بلندمدت (LTS) وصله‌ها را از پیش دریافت کرده بودند. بنابراین بسته‌های به‌روزشده باید در مخازن آن‌ها در دسترس باشند. نسخه‌ی PHP 8.1 و نسخه‌های قدیمی‌تر دیگر به‌روزرسانی رسمی نمی‌گیرند. با این حال، شدت مشکل تیم امنیتی را واداشت تا بک‌پورت‌های حداقلی در سطح کد منبع را برای نسخه‌های ۷٫۴، ۸٫۰ و ۸٫۱ آماده کند. کاربران مخزن داوطلبانه‌ی rpms.remirepo.net امروز به‌روزرسانی دریافت نخواهند کرد. پروژه‌ی PHP به آن‌ها پیشنهاد می‌کند به بسته‌های رسمی توزیع‌ها روی بیاورند یا PHP را مستقیما از کد منبع کامپایل کنند. برای سرورهایی که نمی‌توانند فورا به‌روز شوند، راهکارهای موقتی پیش‌بینی شده است. با این حال، پروژه‌ی PHP صراحتا تأکید می‌کند که هیچ‌کدام از راهکارها نصب را امن نمی‌کنند و فقط سطح خطر را پایین می‌آورند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری مبین احمدی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟"}, {"source": "Zoomit", "title": "هوش مصنوعی Perplexity حالا به‌صورت کاملا آفلاین روی مک اجرا می‌شود", "link": "https://www.zoomit.ir/ai-article Insider", "title": "This startup raised $34 million to help security teams keep up with AI threats. Read the pitch deck.", "link": "https://www.businessinsider.com/mave-startup-cybersecurity-funding-ai-agents-pitch-deck-2026-10", "summary": "Guy Eshel and Raziel Oren founded Mave in 2025. Mave Mave has raised $34 million to bring AI agents to companies' security operations. CEO Raziel Oren said old systems can't keep up with how quickly AI is transforming cyberattacks. Business Insider got an exclusive look at the pitch deck Mave used to raise its Series A round. Mave, a cybersecurity startup that uses agents to counter the rise in AI-powered cyberattacks, has raised $34 million in funding. The Israel-based startup says its AI agents pull together information from a company's existing security systems, investigate alerts, filter out false alarms, and take actions approved by human teams. \"Security operations is the last gate in any organization,\" cofounder and CEO Raziel Oren said, comparing it to the physical security guards who monitor a building's live camera footage. \"This thing is really broken from the inside. The roots of the solutions there are just not keeping the relevant pace with the emerging threats.\" AI has transformed cyber threats at a dizzying pace. Attacks can happen much faster and on a much larger scale, and Oren predicted that the increase in agent-powered incidents will be \"exponential.\" Mave says its own agents help human security teams keep up. \"You can't hire your way out of this,\" Oren told Business Insider. \"There must be a change in how you do [security operations] in order to protect your organizations.\" Oren cofounded Mave with Guy Eshel in 2025 after years of friendship. The two met when Oren was Eshel's mentor in unit 8200 of the Israel Defense Forces, which sits under the intelligence corps and gave them firsthand experience with cybersecurity issues. AI agents have come under the spotlight after a string of high-profile security breaches . Corporate leaders have grown increasingly worried about the cybersecurity risks AI poses, and some of Wall Street's executives spent third-quarter earnings calls explaining how they're defending against rogue AI agents. The technology has also been used by researchers to uncover security flaws: this week, OpenAI said one of its AI models had helped identify a vulnerability that puts 70% of the world's websites at risk. Oren said it takes some customers time to become comfortable handing over security operations to agents, but that the product's transparency is key to building trust. Mave says its agents track each step of their thousands of workflows, giving human employees insight into the agents' reasoning and actions. Mav", "date_str": "2026-10-22T13:00:01+00:00", "hash": "6daaa6f2b0cdd53a", "title_fa": "این استارت آپ 34 میلیون دلار برای کمک به تیم های امنیتی برای مقابله با تهدیدات هوش مصنوعی جمع آوری کرد. عرشه زمین را بخوانید.", "summary_fa": "گای اشل و رازیل اورن Mave را در سال 2025 تاسیس کردند. Mave Mave 34 میلیون دلار جمع آوری کرده است تا عوامل هوش مصنوعی را به عملیات امنیتی شرکت ها بیاورد. رازیل اورن، مدیرعامل این شرکت گفت: سیستم‌های قدیمی نمی‌توانند با سرعتی که هوش مصنوعی حملات سایبری را متحول می‌کند، همگام شوند. Business Insider نگاهی انحصاری به زمین بازی Mave برای بالا بردن دور سری A خود داشت. Mave، یک استارت آپ امنیت سایبری که از عوامل برای مقابله با افزایش حملات سایبری مبتنی بر هوش مصنوعی استفاده می کند، 34 میلیون دلار سرمایه جذب کرده است. این استارت‌آپ مستقر در اسرائیل می‌گوید که عوامل هوش مصنوعی آن اطلاعات سیستم‌های امنیتی موجود یک شرکت را جمع‌آوری می‌کنند، هشدارها را بررسی می‌کنند، آلارم‌های نادرست را فیلتر می‌کنند و اقدامات مورد تایید تیم‌های انسانی را انجام می‌دهند. رازیل اورن، یکی از بنیانگذاران و مدیرعامل، گفت: «عملیات امنیتی آخرین دروازه در هر سازمانی است. «این چیز واقعاً از درون شکسته است. ریشه‌های راه‌حل‌های موجود در آنجا، همگام نبودن با تهدیدات نوظهور است.\" هوش مصنوعی تهدیدات سایبری را با سرعتی سرگیجه‌آور تغییر داده است. حملات می‌توانند بسیار سریع‌تر و در مقیاس بسیار بزرگ‌تر اتفاق بیفتند، و اورن پیش‌بینی کرد که افزایش حوادث مبتنی بر عامل \"تصاعدی\" خواهد بود. Mave می‌گوید که تیم خود می‌تواند از این طریق به امنیت انسان کمک کند. به Business Insider گفت. \"باید تغییری در نحوه انجام [عملیات امنیتی] برای محافظت از سازمان‌هایتان ایجاد شود.\" اورن پس از سال ها دوستی، Mave را با گای اشل در سال 2025 تأسیس کرد. این دو زمانی با هم ملاقات کردند که اورن مربی اشل در واحد 8200 نیروهای دفاعی اسرائیل بود که زیر نظر سپاه اطلاعاتی مستقر است و به آنها تجربیات دست اولی در مورد مسائل امنیت سایبری داد. عوامل هوش مصنوعی پس از یک رشته نقض امنیتی در سطح"}, {"source": "Business Insider", "title": "Meta investors will get free shares if Mark Zuckerberg hits 'extraordinary' targets", "link": "https://www.businessinsider.com/meta-stock-price-share-dividend-mark-zuckerberg-california-billionaire-tax-2026-10", "summary": "Mark Zuckerberg is the founder and CEO of Meta. Bloomberg/Getty Images Meta will give its investors free shares if Mark Zuckerberg hits certain \"extraordinary\" targets. It will pay 1:1 share dividends each time Meta stock doubles and has compounded at over 10% a year. Meta is rolling out Class C shares to address Zuckerberg's tax concerns and keep him in California. Meta stockholders are set to receive free shares if Mark Zuckerberg absolutely crushes it as CEO. The social-media giant revealed in a Wednesday filing that if its upcoming Class C shares double from a baseline price of $580.60 to just over $1,161, and their compound annualized return since September 10 has been at least 10%, shareholders will receive a dividend: a Class C share for every Meta share they own. If Meta stock — specifically its 30-day volume-weighted average price — doubles again to around $2,322, and has risen by at least 10% on average per year, shareholders will receive the same dividend again, and so on. Meta, which owns Facebook, WhatsApp, Instagram, and the AI agent Muse , acknowledged how difficult it will be to unlock those dividends, describing the stock price targets as \"extraordinary\" in its filing. Its stock has already surged more than sevenfold from its November 2022 low, giving Meta a nearly $1.8 trillion market capitalization that ranks it among the 10 most valuable companies in the world. The additional dividends would be paid on top of the initial dividend declared by Meta's board on Wednesday, which will see Class A and Class B shareholders receive Class C shares on a 1:1 basis, likely in late January. Meta is rejigging its share structure in response to Zuckerberg's concerns about California's so-called billionaire tax: a one-off, 5% wealth tax on the roughly 250 billionaires living in the state. Zuckerberg, who ranked fifth on the Bloomberg Billionaires Index with a $247 billion net worth at Wednesday's close, will be able to sell the Class C shares to access the liquidity needed to pay the tax, avoiding a sale of his existing shares that would erode his voting power . Meta's board took action after Zuckerberg said he was considering moving out of California because of the potential tax, and cautioned that the steps involved in relocating, such as listing his home for sale, could spark questions from employees about the company's management, the filing says. Read the original article on Business Insider", "date_str": "2026-10-22T12:49:45+00:00", "hash": "940e4df6732be24f", "title_fa": "اگر مارک زاکربرگ به اهداف \"فوق العاده\" برسد، سرمایه گذاران متا سهام رایگان دریافت خواهند کرد", "summary_fa": "مارک زاکربرگ موسس و مدیر عامل متا است. بلومبرگ/گتی ایماژز اگر مارک زاکربرگ به اهداف \"فوق العاده\" خاصی دست یابد، متا به سرمایه گذاران خود سهام رایگان می دهد. هر بار که سهام متا دوبرابر می شود و بیش از 10 درصد در سال ترکیب می شود، سود سهام 1:1 را پرداخت می کند. متا برای رفع نگرانی های مالیاتی زاکربرگ و نگه داشتن او در کالیفرنیا، سهام کلاس C را منتشر می کند. در صورتی که مارک زاکربرگ به‌عنوان مدیر عامل شرکت متا به‌طور مطلق آن را شکست دهد، سهامداران متا قرار است سهام رایگان دریافت کنند. این غول رسانه های اجتماعی در یک پرونده چهارشنبه فاش کرد که اگر سهام کلاس C آینده آن از قیمت پایه 580.60 دلار به کمی بیش از 1161 دلار دو برابر شود و بازده سالانه ترکیبی آنها از 10 سپتامبر حداقل 10 درصد باشد، سهامداران سود سهام دریافت خواهند کرد: یک سهم کلاس C برای هر سهم Meta که دارند. اگر سهام متا - مخصوصاً قیمت میانگین وزنی حجمی 30 روزه آن - دوباره دو برابر شود و به حدود 2322 دلار برسد و به طور متوسط ​​حداقل 10 درصد در سال افزایش یابد، سهامداران دوباره همان سود تقسیمی را دریافت خواهند کرد و غیره. متا که مالک فیس‌بوک، واتس‌اپ، اینستاگرام و عامل هوش مصنوعی Muse است، تصدیق کرد که باز کردن این سود سهام چقدر دشوار خواهد بود و اهداف قیمت سهام را در پرونده خود \"فوق العاده\" توصیف کرد. سهام آن در حال حاضر بیش از هفت برابر از پایین ترین سطح خود در نوامبر 2022 افزایش یافته است و به متا نزدیک به 1.8 تریلیون دلار سرمایه بازار می دهد که آن را در بین 10 شرکت با ارزش جهان قرار می دهد. سودهای اضافی علاوه بر سود اولیه اعلام شده توسط هیئت مدیره متا در روز چهارشنبه پرداخت"}, {"source": "Business Insider", "title": "I visited Utah in the winter for the first time and made 4 mistakes I won't repeat", "link": "https://www.businessinsider.com/park-city-salt-lake-city-utah-travel-mistakes-to-avoid-2026-10", "summary": "Business Insider s reporter traveled to Salt Lake City and Park City, Utah, during the peak winter season. Joey Hadden/Business Insider Visiting Utah in the winter isn't for everyone. I learned that the hard way in January 2025. My first mistake led to the rest. Gazing out my window at the snowcapped mountains on the train to Utah, I had no idea that I'd already set myself up for regret. Some mistakes were set in motion before I'd even left my apartment. In January 2025, I flew from my home in NYC to Denver and hopped on a 15-hour Amtrak train to Utah's Silicon Slopes — a tech hub lining the Wasatch Front that includes Salt Lake City , Park City , and the surrounding suburbs. I spent three days exploring Utah's pocket of luxury amid ski season and left with four regrets. My first mistake was booking my trip in the peak winter season as a non-skier. Joey Hadden/Business Insider As a first-time visitor to Salt Lake City and Park City, I thought seeing the mountains blanketed in snow would be awe-inspiring — and it really was. I knew winter would be a popular time to visit Utah since it's a ski hub , but I underestimated how busy it would be. Park City was packed with winter sports enthusiasts. Skiers and snowboarders crowded the sidewalks lining congested streets in downtown Park City, all suited up — some with gear in tow. I stopped by the slopes at Deer Valley Resort and spotted long lines of skiers waiting for lifts. I waited in line to ride a funicular up and down the mountain. Maybe seeing the snow was worth the crowds — I won't know for sure until I visit during another season. But had I realized I'd be visiting during the busiest time of year, I would have pushed my trip to the spring, during the shoulder season . I didn t pack enough clothing. The author enjoys Downtown Salt Lake City. Joey Hadden/Business Insider Overpacking is a rookie mistake when traveling, so I go to great lengths to avoid stuffing too many outfits into my bag. But this time, I overcorrected. When packing for a trip that's less than a week long, I typically only bring layers I can wear all at once when needed or mix and match. Since I was traveling in winter, I brought a couple of extra shirts, one additional pair of pants, and zero extra outer layers. But in January along Utah's Wasatch Front, when temperatures ranged from 24 to 44 degrees Fahrenheit, I needed to wear most of my layers daily. After bundling up for a flight and a train ride, I felt desperate for fresh layers whe", "date_str": "2026-10-22T12:46:02+00:00", "hash": "19f70836ff1d3873", "title_fa": "من برای اولین بار در زمستان از یوتا بازدید کردم و 4 اشتباه مرتکب شدم که تکرار نمی کنم", "summary_fa": "خبرنگار Business Insider در فصل اوج زمستان به سالت لیک سیتی و پارک سیتی در یوتا سفر کرد. جوی هادن/ بازدید از یوتا در زمستان برای همه مناسب نیست. من این راه سخت را در ژانویه 2025 یاد گرفتم. اولین اشتباه من منجر به بقیه شد. وقتی از پنجره به کوه های پوشیده از برف قطار به یوتا خیره شدم، نمی دانستم که از قبل پشیمان شده ام. برخی از اشتباهات قبل از اینکه من حتی آپارتمانم را ترک کنم، شروع شد. در ژانویه 2025، از خانه‌ام در نیویورک به دنور پرواز کردم و با قطار 15 ساعته آمتراک به سمت دامنه‌های سیلیکون یوتا رفتم - یک مرکز فناوری که در جبهه Wasatch که شامل سالت لیک سیتی، پارک سیتی و حومه‌های اطراف است. من سه روز را صرف کاوش در جیب لوکس یوتا در بحبوحه فصل اسکی کردم و با چهار پشیمانی آنجا را ترک کردم. اولین اشتباه من رزرو سفرم در فصل اوج زمستان به عنوان غیر اسکی بود. جوی هادن/Business Insider به‌عنوان اولین بازدیدکننده از سالت لیک سیتی و پارک سیتی، فکر می‌کردم دیدن کوه‌های پوشیده از برف حیرت‌انگیز خواهد بود - و واقعا هم همینطور بود. می دانستم که زمستان زمان محبوبی برای بازدید از یوتا خواهد بود، زیرا این یک مرکز اسکی است، اما میزان شلوغ بودن آن را دست کم گرفتم. پارک سیتی مملو از علاقه مندان به ورزش های زمستانی بود. اسکی‌بازان و اسنوبورد سواران در پیاده‌روهایی که خیابان‌های شلوغ مرکز شهر پارک سیتی را پوشانده بودند، شلوغ می‌شدند. در کنار شیب‌های Deer Valley Resort توقف کردم و صف‌های طولانی اسکی‌بازانی را دیدم که منتظر آسانسور بودند. در صف منتظر ماندم تا با فونیکولور از کوه بالا و پایین بروم. شاید دیدن برف ارزش ازدحام جمعیت را داشت - تا زمانی که در فصل دیگری از آن بازدید نکنم، مطمئناً نمی دانم. اما"}, {"source": "Business Insider", "title": "Jensen Huang says neocloud demand is 'off the charts' as CoreWeave stock continues to slide", "link": "https://www.businessinsider.com/jensen-huang-neocloud-demand-soaring-coreweave-stock-slides-2026-10", "summary": "Nvidia CEO Jensen Huang said AI cloud providers face a shortage of capital rather than customers. Alex Kraus/Bloomberg via Getty Images Jensen Huang defended demand for neocloud services as concerns grow about debt in the sector. \"The demand for the neoclouds is off the charts,\" Nvidia CEO Huang said in a CNBC interview. Shares in CoreWeave, one of the biggest neocloud players, have dropped 50% over six months. Nvidia CEO Jensen Huang says demand for AI cloud infrastructure is \"off the charts,\" even as investors grow increasingly nervous about the industry's debt-fueled expansion . Speaking in an interview on CNBC's \"Morning Call\" on Thursday, Huang pushed back against concerns about the business models of so-called neoclouds, companies that provide specialized computing infrastructure for artificial intelligence. \"The demand for the neoclouds is off the charts,\" Huang said. \"Their capabilities are extraordinary.\" His comments came as CoreWeave, one of the largest publicly traded neoclouds , faces heavy scrutiny over its finances. Analysts from both HSBC and Bernstein have issued negative research notes on CoreWeave in recent days. Its stock has dropped 50% over the past six months, and was down as much as 4% in premarket trading on Thursday. HSBC said this week it sees CoreWeave's stock price dropping another 35% or more. Investors have grown increasingly concerned about the debt financing the AI boom, as companies borrow heavily to build data centers and acquire chips. Rising bond yields are adding to financing costs, while interconnected investments between AI companies have raised fears of a bubble. Futures in the tech-focused Nasdaq were under pressure on Thursday, dropping 1.7%. A risky AI bet? CoreWeave has become a focal point of concerns about the AI trade, having taken on substantial debt — $35.6 billion as of June, per its regulatory filings — to finance its rapid expansion. Nvidia, which invested another $2 billion in CoreWeave in January, is both a major investor in and supplier to CoreWeave, highlighting the close financial ties that underpin parts of the AI industry. Huang did not mention CoreWeave by name on Thursday, but argued that the broader sector's biggest challenge was access to capital, rather than demand. \"Because there's just so much demand across so many sectors of AI, there's a scarcity of capital,\" Huang said. \"That's going to get solved,\" he added. Huang specifically defended CoreWeave last week, telling Bloomberg that its \"st", "date_str": "2026-10-22T12:44:27+00:00", "hash": "745125dd80637688", "title_fa": "جنسن هوانگ می‌گوید که تقاضای نئوکلاد از نمودار خارج شده است زیرا سهام CoreWeave همچنان به کاهش می‌یابد.", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا گفت که ارائه دهندگان ابر هوش مصنوعی به جای مشتریان با کمبود سرمایه مواجه هستند. الکس کراوس/ بلومبرگ از طریق گتی ایماژ، جنسن هوانگ از تقاضای خدمات نئوکلاد با افزایش نگرانی ها در مورد بدهی در این بخش دفاع کرد. هوانگ، مدیرعامل انویدیا در مصاحبه‌ای با CNBC گفت: «تقاضا برای نئوکلادها خارج از نمودار است. سهام CoreWeave، یکی از بزرگترین بازیکنان نئوکلاد، طی شش ماه 50 درصد کاهش یافته است. جنسن هوانگ، مدیر عامل انویدیا، می‌گوید تقاضا برای زیرساخت‌های ابری هوش مصنوعی «خارج از نمودار» است، حتی وقتی سرمایه‌گذاران به طور فزاینده‌ای نسبت به توسعه ناشی از بدهی صنعت نگران می‌شوند. هوانگ در مصاحبه‌ای در روز پنجشنبه در CNBC \"تماس صبحگاهی\" نسبت به نگرانی‌ها در مورد مدل‌های تجاری به اصطلاح نئوکلادها، شرکت‌هایی که زیرساخت‌های محاسباتی تخصصی برای هوش مصنوعی ارائه می‌کنند، عقب‌نشینی کرد. هوانگ گفت: «تقاضا برای نئوکلادها خارج از نمودار است. توانایی های آنها فوق العاده است.» نظرات او در حالی مطرح شد که CoreWeave، یکی از بزرگ‌ترین شرکت‌های نئوکلودی که به صورت عمومی معامله می‌شود، با نظارت شدیدی بر امور مالی خود مواجه است. تحلیلگران HSBC و Bernstein در روزهای اخیر یادداشت های تحقیقاتی منفی در مورد CoreWeave منتشر کرده اند. سهام آن طی شش ماه گذشته 50 درصد کاهش یافته است و در معاملات پیش از بازار در روز پنجشنبه تا 4 درصد کاهش یافت. HSBC در این هفته اعلام کرد که شاهد کاهش 35 درصدی دیگر یا بیشتر قیمت سهام CoreWeave است. سرمایه گذاران به طور فزاینده ای در مورد بدهی های تامین مالی رونق هوش مصنوعی نگران شده اند، زیرا شرکت ها برای ساخت مراکز داده و به دست آوردن تراشه ها وام های زیادی می گیرند. افزایش بازده اوراق قرضه به هزینه های تامین مالی می افزاید، در حالی که سرمایه گذاری های به هم پیوسته بین شرکت های هوش"}, {"source": "Business Insider", "title": "I make my kids skip school for a long weekend. I wish they had personal days so they didn't stress over it.", "link": "https://www.businessinsider.com/family-travel-kids-school-weekend-trip-stress-2026-10", "summary": "When the author and her family vacation in the Catskills, her sons take a day or two off school. Courtesy of Lindsay Karp I love the fall, and every year, my family and I visit the Catskill Mountains. To make the most of the trip, my two sons usually take a day or two off school. However, missing the time sometimes causes stress, and I wish they had personal days. Fall is my favorite time of year, and it just so happens that our most loved destination — the Catskill Mountains — is breathtaking in October. When we first started our Catskill family getaways in 2020, we went in the summer when the landscape was lush and green. We've been there in winter to witness snow-covered mountains and in spring, when the ground is thawing. However, my favorite time to visit is during peak foliage in autumn. I refuse to miss the colorful mountainscape simply because my kids don't get a fall break. But taking a couple of days off is not as simple as it should be. Making up the work can be daunting This year, my boys are in middle and high school, and we wanted to take two days off school to extend a weekend; however, a hefty workload left them uneasy about missing more than one day. I encouraged them to ask their teachers for work ahead of time so they wouldn't be scrambling to catch up later, but most teachers didn't have lesson plans completed in advance. While away, they logged in to their school program in between activities to complete some work remotely . When we returned home on Sunday, they finished some lingering assignments, but they weren't completely caught up from the one missed school day until later that week. My 15-year-old is less fazed by having to complete makeup work. A day away from school doesn't stress him all that much. But my 12-year-old reminds me of myself when I was a student; he worries about the work until it's completed. I wish we could escape for a day or two without the stress of math worksheets and language arts passages looming over his head. Kids deserve a few days away from school each year, no questions asked. There's value in spending time with family This year, again, we escaped to a fall wonderland that my children will never forget. We took a short walk to an overlook to see the foliage from above, visited the Sundown Wild Forest where a yellow canopy covered Peekamoose Blue Hole, and continued our yearly tradition of visiting the Bethel Woods Center for their Peace, Love and Pumpkins festival after dark. The next day, we took a s", "date_str": "2026-10-22T12:43:01+00:00", "hash": "84dcb5b8d69d6c06", "title_fa": "من بچه هایم را مجبور می کنم برای یک آخر هفته طولانی مدرسه را ترک کنند. ای کاش روزهای شخصی داشتند تا استرس نداشته باشند.", "summary_fa": "وقتی نویسنده و خانواده اش در کتسکیلز تعطیلات را می گذرانند، پسرانش یک یا دو روز از مدرسه مرخصی می گیرند. به لطف لیندزی کارپ من عاشق پاییز هستم و هر سال من و خانواده ام از کوه های Catskill دیدن می کنیم. برای استفاده بیشتر از سفر، دو پسرم معمولاً یک یا دو روز از مدرسه مرخصی می گیرند. با این حال، از دست دادن زمان گاهی اوقات باعث استرس می شود و ای کاش روزهای شخصی داشتند. پاییز زمان مورد علاقه من از سال است، و اتفاقاً دوست‌داشتنی‌ترین مقصد ما - کوه‌های Catskill - در ماه اکتبر خیره‌کننده است. هنگامی که ما برای اولین بار در سال 2020 تعطیلات خانوادگی Catskill خود را شروع کردیم، در تابستان زمانی که منظره سرسبز و سرسبز بود به آنجا رفتیم. ما در زمستان آنجا بوده ایم تا شاهد کوه های پوشیده از برف و در بهار، زمانی که زمین در حال آب شدن است. با این حال، زمان مورد علاقه من برای بازدید در زمان اوج شاخ و برگ در پاییز است. من از دست دادن منظره های رنگارنگ کوهستانی خودداری می کنم فقط به این دلیل که بچه هایم استراحتی برای پاییز ندارند. اما چند روز مرخصی آنطور که باید ساده نیست. ساختن کار می تواند دلهره آور باشد امسال، پسران من در دبیرستان و دبیرستان هستند و ما می خواستیم برای تمدید تعطیلات آخر هفته، دو روز از مدرسه مرخصی بگیریم. با این حال، حجم کاری سنگین باعث شد که آنها در مورد غیبت بیش از یک روز نگران نباشند. من آنها را تشویق کردم که از معلمان خود قبل از موعد کار بخواهند تا بعداً در تقلا نباشند، اما اکثر معلمان برنامه های درسی را از قبل تکمیل نکرده بودند. زمانی که دور بودند، در بین فعالیت‌ها وارد برنامه مدرسه خود شدند تا برخی از کارها را از"}, {"source": "Business Insider", "title": "For years, I paid someone $150 a month to batch-cook meals for my busy family of 4", "link": "https://www.businessinsider.com/pay-someone-to-cook-meals-for-family-monthly-worth-it-2026-10", "summary": "Outsourcing some of the cooking meant my husband and I could spend more time with our kids and have delicious meals ready to reheat on our busiest days. Elizabeth Wong After our second child, my husband and I were struggling to balance our jobs and household admin. To outsource some of the cooking, I found a local chef to batch-cook meals for us once a month. Having a freezer packed with homemade meals saved us time, and I learned a lot from the chef. When I returned to work after my second maternity leave , our family of four found ourselves very short on free time. Back then, my husband and I had jobs in finance in London. We were working long hours, with video calls stretching from seven in the morning to nine at night. On weekdays, like most families with young children, we felt like we were in a never-ending cycle of rushing everywhere. Our plates were filled with nursery drop-offs and pickups, Teams calls, making dinner, cleaning up, and getting the kids ready for bed and baths, with household chores and personal admin to be completed in what was left of our free time. Though we had full-time childcare , we had little else in the way of daily support, as our families were not local. In our social circle, we knew that dual-career parents with young children often bought supermarket-ready meals or ordered takeout. However, these options often felt too high in salt and sugar, and limited in their selection. That was how I found myself posting in a Facebook group for Malaysian moms in the UK, desperately trying to find someone to cook for us. I wasn't envisioning a personal chef who would shop and make three meals a day — our budget didn't stretch that far — rather, I hoped to find a decent home cook and had a few hours to make big, batch meals that we could freeze, then reheat on our busy weekdays. That was how we found Evelyn. For $150 a visit, we paid for someone to batch-cook meals for our family The meals had to freeze well and be easy to reheat. Elizabeth Wong Evelyn was an experienced pastry chef on furlough, like many in the food-service industry at the time — we connected in 2020, amid the COVID-19 pandemic. She lived in a neighboring borough in London, which made our arrangement convenient. Equally as important, she was good at cooking Chinese-Malaysian dishes. She would visit once a month, for about four to six hours. Our arrangement cost us around $150 per visit at the time. Before she arrived, we would discuss the menu over WhatsApp. Crucial", "date_str": "2026-10-22T12:02:01+00:00", "hash": "63013da0e2bf873e", "title_fa": "سال‌ها، ماهیانه ۱۵۰ دلار به شخصی پرداخت می‌کردم تا برای خانواده پرمشغله‌ام ۴ نفره غذا بپزد.", "summary_fa": "برون سپاری برخی از آشپزی به این معنی بود که من و شوهرم می توانستیم زمان بیشتری را با بچه هایمان بگذرانیم و در شلوغ ترین روزهایمان غذای خوشمزه آماده کنیم. الیزابت وانگ پس از فرزند دوممان، من و شوهرم در تلاش بودیم تا بین شغل و سرپرست خانه خود تعادل ایجاد کنیم. برای برون سپاری بخشی از آشپزی، یک سرآشپز محلی پیدا کردم تا یک بار در ماه برای ما غذا بپزد. داشتن یک فریزر مملو از غذاهای خانگی باعث صرفه جویی در وقت ما شد و من از سرآشپز چیزهای زیادی یاد گرفتم. وقتی بعد از مرخصی دوم زایمانم به سر کار برگشتم، خانواده چهار نفره ما وقت آزاد بسیار کمی داشتیم. در آن زمان، من و شوهرم در لندن شغلی در زمینه مالی داشتیم. ساعت‌های طولانی کار می‌کردیم، با تماس‌های ویدیویی از هفت صبح تا نه شب. در روزهای هفته، مانند اکثر خانواده‌هایی که بچه‌های کوچک دارند، احساس می‌کردیم در یک چرخه بی‌پایان عجله به همه جا هستیم. بشقاب‌های ما پر بود از مهدکودک‌ها و پیکاپ‌ها، تماس‌های تیم‌ها، درست کردن شام، تمیز کردن و آماده کردن بچه‌ها برای رختخواب و حمام کردن، با کارهای خانه و سرپرست شخصی که باید در زمان آزادمان تکمیل شود. اگرچه ما مراقبت تمام وقت از کودک داشتیم، اما از آنجایی که خانواده‌های ما محلی نبودند، چیز دیگری در راه حمایت روزانه نداشتیم. در حلقه اجتماعی خود، می‌دانستیم که والدین دو شغله با فرزندان خردسال اغلب وعده‌های غذایی آماده برای سوپرمارکت می‌خرند یا غذای بیرون‌بر سفارش می‌دهند. با این حال، این گزینه ها اغلب نمک و شکر زیادی دارند و در انتخاب آنها محدود است. اینگونه بود که متوجه شدم در یک گروه فیس بوک برای مادران مالزیایی در بریتانیا پست می گذاشتم و به شدت در تلاش بودم کسی را پیدا کنم که برای ما غذا درست کند. من سرآشپز شخصی"}, {"source": "Business Insider", "title": "We got the first look at Target's revamped SoHo store where the retailer is all-in on style", "link": "https://www.businessinsider.com/target-revamped-soho-store-in-new-york-photos-2026-10", "summary": "Target s mascot Bullseye greets visitors at the retailer s newly remodeled SoHo store. Dominick Reuter/Business Insider Target just remodeled its SoHo store with a larger emphasis on style and design. The store showcases a curated sample from Target's full merchandise assortment. Target invited Business Insider for an exclusive first look ahead of the location's reopening. Target is doubling down on its SoHo concept store. Less than a year after remodeling the store's main floor, the bullseye retailer went back in to reimagine the rest of the footprint that anchors Target in one of the world's top shopping districts. \"It was probably more of a glorified convenience store,\" Target's chief brand officer Michelle Mesenberg told Business Insider during an exclusive walkthrough ahead of Thursday's reopening. Located at the corner of Broadway and East Houston Street, the SoHo store shares the block with trendy shops like Prada, Arc'teryx, and Allsaints. While last year's renovation bumped up the store's aesthetics, Mesenberg said it was still more of a spot for people to grab essentials on their way to somewhere else. \"Nearly 70,000 people cross this corner every single day,\" she said. \"We wanted to make sure that we were putting our best foot forward when it came to our brand.\" Last year s remodel featured an extended entrance experience that calls to mind a deconstructed Target logo. Dominick Reuter/Business Insider It's now stocked with apparel-forward displays that also feature select merchandise from other categories. \"It's focused on apparel, but you'll see us mix in the best of beauty, the best of home, and so we're really completing the picture for a guest,\" Target's director of curation, Matthew Arrington, told Business Insider. Further back on the main floor, a new section features a more immersive presentation of seasonal merchandise. Dominick Reuter/Business Insider \"What this space does is it puts a point of view on our edit for the season, and that allows people to come in and see our product through a different lens,\" Mesenberg said. Last year s remodel of the SoHo store s beauty section also set the tone for this year s broader launch of Target s Beauty Studio, which has replaced the retailer s partnership with Ulta. Dominick Reuter/Business Insider \"We've been able to also bring in other beauty founders and creators and celebrity makeup artists to the space, and so it gives them a place to continue to tell that beauty story across Target,\" Arrin", "date_str": "2026-10-22T12:00:01+00:00", "hash": "3423e20d35d173b4", "title_fa": "اولین نگاهی به فروشگاه نوسازی شده SoHo Target داشتیم که در آن خرده‌فروش کاملاً سبک است.", "summary_fa": "طلسم هدف Bullseye به بازدیدکنندگان در فروشگاه SoHo که به تازگی بازسازی شده است، استقبال می کند. Dominick Reuter/Business Insider Target به تازگی فروشگاه SoHo خود را با تاکید بیشتر بر سبک و طراحی بازسازی کرده است. این فروشگاه یک نمونه انتخاب شده از مجموعه کامل کالاهای Target را به نمایش می گذارد. Target از Business Insider دعوت کرد تا قبل از بازگشایی مکان، اولین نگاهی منحصر به فرد داشته باشد. Target در حال افزایش دو برابری فروشگاه مفهومی SoHo خود است. کمتر از یک سال پس از بازسازی طبقه اصلی فروشگاه، خرده فروش bullseye دوباره به آنجا رفت تا بقیه ردپایی که Target را در یکی از برترین مناطق خرید جهان لنگر انداخته است، دوباره تصور کند. میشل مسنبرگ، مدیر ارشد برند تارگت، در جریان یک بررسی انحصاری پیش از بازگشایی روز پنجشنبه به Business Insider گفت: «این احتمالاً بیشتر یک فروشگاه رفاهی با شکوه بود. فروشگاه سوهو که در گوشه خیابان برادوی و شرق هیوستون قرار دارد، این بلوک را با فروشگاه‌های مد روز مانند پرادا، آرکتریکس، و آل سینتس مشترک است. در حالی که بازسازی سال گذشته زیبایی‌شناسی فروشگاه را افزایش داد، مسنبرگ گفت که هنوز مکان بیشتری برای مردم است تا وسایل ضروری را در مسیر خود به جای دیگری ببرند. او گفت: \"تقریبا 70000 نفر در هر روز از این گوشه عبور می کنند.\" ما می‌خواستیم مطمئن شویم که وقتی نوبت به برندمان می‌رسد، بهترین عملکرد خود را به کار می‌گیریم.» بازسازی سال گذشته تجربه ورودی گسترده‌ای را به نمایش گذاشت که لوگوی Destructed Target را به یاد می‌آورد. Dominick Reuter/Business Insider اکنون مجهز به نمایشگرهای رو به جلو پوشاک است که کالاهای انتخابی از دسته های دیگر را نیز نشان می دهد. متیو آرینگتون، مدیر سرپرستی تارگت، به Business Insider گفت: \"این بر روی پوشاک متمرکز شده است، اما ما را خواهید دید که"}, {"source": "Business Insider", "title": "As a former flight attendant, I hate when passengers keep the window shades open — and I've got good reasons", "link": "https://www.businessinsider.com/should-i-leave-windows-closed-flight-attendant-explains-why-2026-10", "summary": "After working as a flight attendant for almost a decade, I (not pictured) encourage passengers to keep the window shades shut when we re in the air. YakobchukOlena/Getty Images I used to work as a flight attendant , and I prefer passengers keep the shades closed during flights. Passengers are typically calmer and sleepier when the cabin is dark, which worked well for us. Shades should only be open during takeoff and landing, which is the best time for photos anyway. There's a long-standing, quiet battle happening in airplane cabins around the world, and it's all about window shades. Who actually owns control of the shade — the person sitting in the window seat, the cabin crew, or the row as a collective? ( Opinions remain fairly divided .) Is it better for the shade to stay open or closed throughout the flight? Between viral social media debates and endless discussions on flight etiquette , everyone seems to have an opinion, and so do I. For nearly a decade, I worked as a flight attendant with an international airline. That means I've examined thousands of window shades before takeoff and landing to ensure they were open, just as I checked seatbacks were upright. Many airlines require the shades to be open during these times, which makes sense to me from a safety standpoint. It's helpful to have a clear view outside in an emergency, and in case ground rescue teams need to see inside the plane. However, once we hit cruising altitude , those safety rules pause, and my personal one kicks in: The window shades should be closed while we're in the air. I've found that open shades can ruin sleep cycles and make a cabin rowdier Windows should be open for takeoff and landing, but that s about it. Mateusz Wlodarczyk/NurPhoto via Getty Images I honestly hate it when passengers keep their shades wide open, and it's especially bad on long, international flights . I know firsthand how crossing multiple time zones can be exhausting for the body. Often, the best way to save passengers from severe jet lag is to help them get quality sleep in the air — and let's be honest, as a flight attendant, I definitely had a vested interest in keeping everyone happy and well-rested. So, on long flights, my crew and I would intentionally dim the cabin lights to simulate nighttime and encourage everyone to rest. Even so, it only took one open window shade to ruin that peaceful environment for an entire section of the plane. When blinding sunlight poured in, it didn't just wake sleeping ", "date_str": "2026-10-22T11:58:01+00:00", "hash": "640454fa750ab6d1", "title_fa": "به عنوان یک مهماندار سابق هواپیما، از زمانی که مسافران پنجره‌ها را باز نگه می‌دارند متنفرم - و دلایل خوبی هم دارم", "summary_fa": "پس از تقریباً یک دهه کار به عنوان مهماندار هواپیما، من (در تصویر نیست) مسافران را تشویق می‌کنم که وقتی در هوا هستیم، پنجره‌ها را بسته نگه دارند. YakobchukOlena/Getty Images من قبلاً به عنوان مهماندار کار می‌کردم و ترجیح می‌دهم مسافران در طول پرواز سایه‌بان را بسته نگه دارند. مسافران معمولاً وقتی کابین تاریک است آرام‌تر و خواب‌آلودتر هستند که برای ما خوب عمل کرد. سایه ها فقط در هنگام برخاستن و فرود باید باز باشند که به هر حال بهترین زمان برای عکس است. یک نبرد آرام و طولانی مدت در کابین هواپیما در سراسر جهان در حال وقوع است و همه چیز در مورد سایه پنجره ها است. در واقع چه کسی کنترل سایه را در اختیار دارد - شخصی که روی صندلی پنجره نشسته، خدمه کابین یا ردیف به عنوان یک گروه؟ (نظرات تقریباً تقسیم شده است.) آیا بهتر است سایه در طول پرواز باز بماند یا بسته؟ بین بحث‌های رسانه‌های اجتماعی ویروسی و بحث‌های بی‌پایان در مورد آداب پرواز، به نظر می‌رسد همه نظری دارند و من هم همین‌طور. نزدیک به یک دهه به عنوان مهماندار هواپیما با یک شرکت هواپیمایی بین المللی کار کردم. این بدان معناست که من هزاران سایه پنجره را قبل از برخاستن و فرود بررسی کرده‌ام تا از باز بودن آن‌ها اطمینان حاصل کنم، درست همانطور که پشتی صندلی‌ها را بررسی کردم. بسیاری از خطوط هوایی در این مواقع نیاز به باز بودن سایبان ها دارند، که از نظر ایمنی برای من منطقی است. داشتن دید واضح از بیرون در مواقع اضطراری و در صورتی که تیم های امداد زمینی نیاز به دیدن داخل هواپیما داشته باشند، مفید است. با این حال، هنگامی که به ارتفاع کروز رسیدیم، آن قوانین ایمنی متوقف می‌شود و قوانین شخصی من شروع به کار می‌کند: تا زمانی که در هوا هستیم، پنجره‌ها باید بسته شوند."}, {"source": "Business Insider", "title": "Ukraine's new armored assaults show the tank isn't dead, but the rules have changed", "link": "https://www.businessinsider.com/ukraine-operation-vivaldi-armored-vehicle-win-shows-mechanized-still-possible-2026-10", "summary": "Ukraine s Third Army Corps said it carried out successful mechanized assaults behind Russian lines in its Operation Vivaldi. Yevhen Kotenko/ Ukrinform/Future Publishing via Getty Images Mechanized assaults have been rare in Ukraine, but amid a major offensive, its forces pulled off two. The Ukrainian commander behind the operation doubted the assaults would succeed. He said using armored vehicles now needs extensive planning and support, much like a special operation. A massive Ukrainian operation retaking territory from Russian forces has shown that assaults with tanks and armored vehicles are still possible in a drone-heavy war, but far more support and planning are now necessary to execute them. Tanks and other armored vehicles have faced serious challenges on battlefields dominated by drones, mines, and artillery, prompting both sides to move away, tactically speaking, from large-scale mechanized assaults. Those decisions have led observers to question whether tanks still have a role in modern warfare. Those discussions have taken a new turn in the wake of recent Ukrainian combat operations. Ukrainian forces involved in Operation Vivaldi, a counteroffensive that has so far taken back 277 square kilometers of territory, carried out two successful mechanized assaults behind Russian lines this week, Brigadier General Andrii Biletskyi, the commander of Ukraine's Third Army Corps, the unit conducting the operation, told the Ukrainian outlet Militarnyi. George Barros, the director of innovation at the Institute for the Study of War, a US think tank, told Business Insider that this appears to be \"the first successful mechanized tactical level breakthrough in a drone-dominated battlefield.\" Sharing details of the operation, Biletskyi said he had been skeptical it could be done, remaining unsure until the last minute whether armored vehicles could be used successfully, but he decided to allow brigade commanders to try. The assaults required extensive preparation and coordination. \"Today, the use of armored vehicles is effectively a special operation. It requires extremely detailed planning and the coordination of a huge number of assets,\" Biletskyi told Militarnyi, a Ukrainian military news site. Tanks have struggled in Ukraine, leading to their reduced role in large assaults and reassessments about how they can be used in modern warfare. SERGEI CHUZAVKOV/AFP via Getty Images Barros said that while the assault's territorial gains were limited, he believes it is", "date_str": "2026-10-22T11:37:04+00:00", "hash": "3796971b1a8bcc34", "title_fa": "حملات زرهی جدید اوکراین نشان می دهد که تانک نمرده است، اما قوانین تغییر کرده است", "summary_fa": "سپاه سوم ارتش اوکراین گفت که در عملیات ویوالدی، حملات مکانیزه موفقی را پشت خطوط روسیه انجام داده است. یوهن کوتنکو/ Ukrinform/ انتشارات آینده از طریق گتی ایمیجز حملات مکانیزه در اوکراین نادر بوده است، اما در میان یک حمله بزرگ، نیروهای آن دو را از بین بردند. فرمانده اوکراینی پشت این عملیات تردید داشت که حملات به موفقیت برسد. او گفت که استفاده از خودروهای زرهی در حال حاضر نیاز به برنامه ریزی و پشتیبانی گسترده دارد، مانند یک عملیات ویژه. عملیات گسترده اوکراین برای بازپس گیری اراضی از نیروهای روسی نشان داده است که حملات با تانک ها و خودروهای زرهی هنوز در یک جنگ سنگین پهپادی امکان پذیر است، اما اکنون برای اجرای آنها حمایت و برنامه ریزی بسیار بیشتری لازم است. تانک‌ها و سایر خودروهای زرهی با چالش‌های جدی در میدان‌های نبرد تحت سلطه پهپادها، مین‌ها و توپخانه‌ها مواجه شده‌اند که باعث شده هر دو طرف از حملات مکانیزه در مقیاس بزرگ دور شوند. این تصمیمات ناظران را به این سوال سوق داده است که آیا تانک ها هنوز نقشی در جنگ های مدرن دارند یا خیر. پس از عملیات‌های رزمی اخیر اوکراین، این بحث‌ها چرخش جدیدی به خود گرفته است. سرتیپ آندری بیلتسکی، فرمانده سپاه سوم ارتش اوکراین، واحدی که این عملیات را انجام می‌دهد، به شبکه اوکراینی Militarnyi گفت که نیروهای اوکراینی درگیر در عملیات ویوالدی، یک ضد حمله که تاکنون 277 کیلومتر مربع از خاک را پس گرفته است، این هفته دو حمله مکانیزه موفق را پشت خطوط روسیه انجام دادند. جورج باروس، مدیر نوآوری در مؤسسه مطالعات جنگ، یک اندیشکده آمریکایی، به Business Insider گفت که به نظر می رسد این \"اولین پیشرفت موفقیت آمیز سطح تاکتیکی مکانیزه در میدان نبرد تحت سلطه هواپیماهای بدون سرنشین\" باشد. بیلتسکی با به اشتراک گذاشتن جزئیات عملیات گفت که در انجام آن تردید داشت و"}, {"source": "Business Insider", "title": "Elon Musk says training Tesla's Optimus robot is like raising a toddler", "link": "https://www.businessinsider.com/optimus-training-academy-elon-musk-raising-toddler-2026-10", "summary": "Elon Musk compared training Optimus to raising a toddler. Riccardo De Luca/Anadolu via Getty Images Elon Musk said a shortage of training data meant teaching Tesla's Optimus robot is like raising a toddler. Tesla has built an \"Optimus Academy\" where robots can learn through \"self-play,\" Musk told investors. The EV giant said on Wednesday that it had begun production of Optimus. Tesla is sending its Optimus humanoid robot back to school. Speaking on the company's earnings call on Wednesday, CEO Elon Musk compared training the EV maker's humanoid robot to raising a toddler. Musk said that while Tesla's autonomous driving models can learn from data collected by its massive fleet of vehicles, its Optimus robot has to learn by watching people do tasks and practicing them itself, a process similar to how humans learn. \"You can see this when you have a toddler, and they initially are sort of wobbly, and they don't know how to do things, and eventually, they learn to wipe their own ass, which is a big milestone,\" Musk told investors. \"They learn to read and do all sorts of things, and they learn this by playing. And we actually need Optimus to play at scale in order to have it be really good at tasks in the real world,\" Musk said. Musk said Tesla expects to begin delivering Optimus to consumers by the end of 2027. Bloomberg/Getty Images The Tesla CEO added that the company was building out an \"Optimus Academy\" where prototypes can practice a wide range of tasks and generate training data to teach future versions of Optimus. \"For Optimus to get the training data we need, we actually need to make a lot of Optimi. So we need to make, I think, on the order of 10,000 or 20,000 bots and then have them do self-play,\" said Musk. Tesla said on Wednesday that it had begun production of Optimus at its Fremont factory, with Musk saying the company expects to begin delivering Optimus to customers by the end of next year. The near-trillionaire cautioned that production would be \"somewhat bumpy\" and that development of the humanoid robot still has some way to go. Read more of Business Insider's robotics coverage: Inside the global race to train robots on human work Techies are throwing billions at robots; the 'hardware tourists' are piling in He listed the challenges of designing durable yet responsive robotic hands , as well as AI capable of handling open-ended tasks, among the main hurdles Tesla faces. Tesla is not alone in setting up robot academies to provide training data f", "date_str": "2026-10-22T10:33:17+00:00", "hash": "659cff8449677b94", "title_fa": "ایلان ماسک می گوید آموزش ربات Optimus تسلا مانند بزرگ کردن یک کودک نوپا است", "summary_fa": "ایلان ماسک آموزش Optimus را با بزرگ کردن کودک نوپا مقایسه کرد. Riccardo De Luca/Anadolu از طریق Getty Images ایلان ماسک گفت کمبود داده های آموزشی به این معنی است که آموزش ربات Optimus تسلا مانند بزرگ کردن یک کودک نوپا است. ماسک به سرمایه گذاران گفت: تسلا یک \"آکادمی Optimus\" ساخته است که در آن ربات ها می توانند از طریق \"خودبازی\" یاد بگیرند. غول EV روز چهارشنبه اعلام کرد که تولید Optimus را آغاز کرده است. تسلا ربات انسان نمای Optimus خود را به مدرسه می فرستد. ایلان ماسک، مدیرعامل این شرکت، روز چهارشنبه، در صحبت‌های مربوط به درآمد شرکت، آموزش ربات انسان‌نمای سازنده خودروهای الکتریکی را با بزرگ کردن کودک نوپا مقایسه کرد. ماسک گفت در حالی که مدل‌های رانندگی خودران تسلا می‌توانند از داده‌های جمع‌آوری‌شده توسط ناوگان عظیم وسایل نقلیه آن بیاموزند، ربات Optimus آن باید با تماشای افراد در انجام وظایف و تمرین آنها بیاموزد، فرآیندی مشابه نحوه یادگیری انسان. ماسک به سرمایه گذاران گفت: \"شما می توانید این را زمانی ببینید که یک کودک نوپا دارید، و آنها در ابتدا به نوعی متزلزل هستند، و نمی دانند چگونه کارها را انجام دهند، و در نهایت، یاد می گیرند که الاغ خود را پاک کنند، که یک نقطه عطف بزرگ است.\" ماسک گفت: \"آنها خواندن و انجام انواع کارها را یاد می گیرند، و این را با بازی یاد می گیرند. و ما در واقع به Optimus برای بازی در مقیاس نیاز داریم تا در انجام وظایف در دنیای واقعی واقعاً خوب باشد.\" ماسک گفت که تسلا انتظار دارد تا پایان سال 2027 عرضه Optimus را به مصرف کنندگان آغاز کند. بلومبرگ/گتی ایماژ مدیر عامل تسلا افزود که این شرکت در حال ساخت یک \"آکادمی Optimus\" است که در آن نمونه های اولیه می توانند طیف گسترده ای از وظایف را تمرین کنند و داده"}, {"source": "Business Insider", "title": "Trump says Google's CEO rejected his plan to change the Atlantic's name to the 'Trump Ocean'", "link": "https://www.businessinsider.com/trump-google-ceo-rejected-request-to-rename-atlantic-ocean-2026-10", "summary": "After changing the names of the Gulf of Mexico and Lake Ontario, Trump has set his sights on a bigger body of water. Anna Moneymaker/Getty Images Google CEO Sundar Pichai said no when Trump asked him to rename the Atlantic Ocean, the president said. Trump has floated the idea of renaming either the Atlantic or the Pacific to the \"Trump Ocean.\" Earlier this year, he issued orders to change the names of the Gulf of Mexico and Lake Ontario. President Donald Trump's plan to rename the Atlantic Ocean hit choppy waters when he took it to Google. At a Wednesday rally in South Carolina, Trump said he considered putting his name or \"America\" on one of the two oceans that flank the US: the Atlantic and the Pacific. \"I’m not going to put either Trump or America on any other ocean but these two,\" he told the crowd. Then, he said, he called Google to ask about making the change on Google Maps. The tech giant had previously changed its US labels for the Gulf of Mexico and Lake Ontario to the Gulf of America and Lake America after executive orders from the president. \"I spoke to a brilliant guy, Sundar. He heads all of Google,\" Trump said, referring to CEO Sundar Pichai . He also praised Google cofounder Sergey Brin , calling both men \"totally brilliant guys,\" before joking that they were \"still rattled from the Gulf.\" Trump recounted putting his idea directly to Pichai: \"Sundar, I’m thinking of the Atlantic Ocean. Can you handle it?\" \"No, no, no. This time I’m not doing it,\" Trump quoted Pichai as replying. \"Oceans are different, sir. They cover really a lot of countries. Please don't ask us to do that.\" \"So I'll probably pass,\" Trump told the crowd. \"Should I pass it?\" He then answered his own question: \"I think let's keep it the Atlantic Ocean.\" Google did not immediately respond to a request for comment. It was not Trump's first ocean pitch . At a Tennessee rally in early October, he floated \"Trump Ocean\" or \"Ocean of the Americas\" for the Atlantic or Pacific. He has also mused about renaming a river, calling New Mexico \"New America,\" and rechristening the Strait of Hormuz the \"Trump Strait.\" While those ideas remain proposals, Google Maps did adopt \"Gulf of America\" and \"Lake America\" for US users after the names changed in federal records. Users in Mexico and Canada still see the original names for the gulf and lake, respectively. Users in the rest of the world see the original names, followed by Trump's new names in brackets. The changes have created a dilemma for", "date_str": "2026-10-22T09:55:40+00:00", "hash": "5a47d9ba1e432bf7", "title_fa": "ترامپ می گوید مدیر عامل گوگل طرح او برای تغییر نام اقیانوس اطلس به \"اقیانوس ترامپ\" را رد کرده است.", "summary_fa": "ترامپ پس از تغییر نام خلیج مکزیک و دریاچه انتاریو، چشمان خود را به حجم بزرگتری از آب معطوف کرده است. رئیس جمهور گفت، ساندار پیچای، مدیر عامل گوگل آنا مانی میکر/ گتی ایماژ زمانی که ترامپ از او خواست نام اقیانوس اطلس را تغییر دهد، پاسخ منفی داد. ترامپ ایده تغییر نام اقیانوس اطلس یا اقیانوس آرام به \"اقیانوس ترامپ\" را مطرح کرده است. اوایل سال جاری دستور تغییر نام خلیج مکزیک و دریاچه انتاریو را صادر کرد. طرح دونالد ترامپ، رئیس جمهور آمریکا برای تغییر نام اقیانوس اطلس، زمانی که آن را به گوگل برد، با آب های متلاطم مواجه شد. ترامپ در راهپیمایی روز چهارشنبه در کارولینای جنوبی گفت که در نظر دارد نام خود یا \"آمریکا\" را بر روی یکی از دو اقیانوسی که در کنار ایالات متحده قرار دارند، بگذارد: اقیانوس اطلس و اقیانوس آرام. او خطاب به جمعیت گفت: من ترامپ یا آمریکا را در هیچ اقیانوس دیگری جز این دو قرار نمی دهم. سپس، او گفت، او با گوگل تماس گرفت تا در مورد ایجاد تغییر در Google Maps سوال کند. این غول فناوری پیش از این پس از دستور اجرایی رئیس جمهور، برچسب های آمریکایی خود را برای خلیج مکزیک و دریاچه انتاریو به خلیج آمریکا و دریاچه آمریکا تغییر داده بود. ترامپ با اشاره به مدیرعامل ساندار پیچای گفت: \"من با مردی باهوش، ساندار صحبت کردم. او رئیس کل گوگل است.\" او همچنین سرگئی برین، یکی از بنیانگذاران گوگل را تمجید کرد و هر دو مرد را «مردان کاملاً باهوش» خواند، قبل از اینکه به شوخی گفت که «هنوز از خلیج سرکوب می‌شوند». ترامپ درباره طرح مستقیم ایده‌اش به پیچای گفت: «ساندار، من به اقیانوس اطلس فکر می‌کنم. آیا می‌توانی آن را تحمل کنی؟» ترامپ در پاسخ پیچای گفت: \"نه، نه، نه. این بار این کار را انجام نمی دهم.\" \"اقیانوس"}, {"source": "Business Insider", "title": "The pros and cons investors will have to weigh if Tesla and SpaceX tie the knot", "link": "https://www.businessinsider.com/tesla-spacex-merger-pros-cons-investors-shareholders-deal-risks-upside-2026-10", "summary": "Mario Tama/Getty Images Tesla and SpaceX are talking merger, putting Musk's biggest ambitions under one very big roof. The tricky part is figuring out which shareholders get a deal — and which ones get the baggage. Sign up for First Trade , Business Insider's daily markets newsletter. Ok people, this thing could actually be for real. On the heels of long-percolating rumors, formal steps are now underway toward a potential merger of Tesla and SpaceX. The two crown jewels of Elon Musk's trillionaire empire could eventually combine to create an EV-and-AI mega-conglomerate in what would be by far the biggest deal of all time. The progress toward a deal comes at an interesting time for shareholders of both companies. Through Tuesday's close, Tesla shares were 24% below their late-2025 record high, as investors have grown less patient with slowing car sales and a still-unproven robotaxi business. SpaceX , meanwhile, had gained about 10% since IPOing in June. (Tesla rose 3% on Wednesday after the news, while SpaceX spiked 8%.) That disconnect creates one of the merger's biggest questions: How should the deal be priced to fairly compensate both sides? On one side, Tesla could gain a piece of SpaceX's hottest growth engines. SpaceX could gain scale and a broader AI-and-hardware platform. But both would inherit each other's risks as well. Here's a full breakdown of the pros and cons for investors in both companies: Tesla: A bigger claim on Musk's future Pros Tesla shareholders would get direct exposure to businesses they currently can only admire from the sidelines: Starlink , rocket launches , and SpaceX's booming AI operation . It would add weight to Tesla's long-running \" physical AI \" pitch. Instead of just promising robotaxis and robots, Tesla could be part of a company that also controls satellites, computing, and AI models. The deal could further reduce Tesla's reliance on its auto business, which has become the least intriguing part of its valuation story. (Although the company is still dominating the EV space. More on that lower in the newsletter.) Cons Tesla may be trying to buy its way into SpaceX just after earnings made shares more expensive. It would tie Tesla even more tightly to giant capital-spending plans. Tesla investors would have an even harder time knowing what they own. An automaker ? Robotics company? AI giant? Satellite operator? All of the above? SpaceX: Bigger financing power, but more baggage Pros Tesla brings something SpaceX cannot easi", "date_str": "2026-10-22T09:50:01+00:00", "hash": "228ba8d033304c60", "title_fa": "در صورتی که تسلا و اسپیس ایکس به هم بپیوندند، سرمایه گذاران موافق و مخالف باید ارزیابی کنند", "summary_fa": "Mario Tama/Getty Images تسلا و اسپیس ایکس در حال ادغام هستند و بزرگترین جاه طلبی های ماسک را زیر یک سقف بسیار بزرگ قرار می دهند. بخش دشوار این است که بفهمید کدام سهامداران معامله می شوند - و کدام یک چمدان را دریافت می کنند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. خوب مردم، این چیز در واقع می تواند واقعی باشد. با توجه به شایعات طولانی مدت، اکنون مراحل رسمی به سمت ادغام احتمالی تسلا و اسپیس ایکس در حال انجام است. دو تاج جواهرات امپراتوری تریلیونر ایلان ماسک در نهایت می توانند با هم ترکیب شوند و یک شرکت بزرگ EV-و-AI ایجاد کنند که بزرگترین معامله تاریخ خواهد بود. پیشرفت به سوی معامله در زمان جالبی برای سهامداران هر دو شرکت اتفاق می افتد. تا پایان روز سه‌شنبه، سهام تسلا 24 درصد کمتر از رکورد اواخر سال 2025 بود، زیرا سرمایه‌گذاران نسبت به کاهش فروش خودرو و کسب‌وکار روبات‌اکسی هنوز اثبات نشده صبر کمتری نشان دادند. در همین حال، SpaceX از زمان عرضه اولیه سهام در ژوئن، حدود 10 درصد افزایش یافته بود. (تسلا در روز چهارشنبه پس از انتشار این خبر 3 درصد رشد کرد، در حالی که اسپیس ایکس 8 درصد افزایش یافت.) این قطع ارتباط یکی از بزرگترین سؤالات ادغام را ایجاد می کند: قیمت معامله چگونه باید باشد تا به طور عادلانه ای برای هر دو طرف جبران شود؟ از یک طرف، تسلا می تواند بخشی از داغ ترین موتورهای رشد اسپیس ایکس را به دست آورد. اسپیس ایکس می تواند مقیاس و پلتفرم هوش مصنوعی و سخت افزاری گسترده تری پیدا کند. اما هر دو خطرات یکدیگر را نیز به ارث خواهند برد. در اینجا به تفکیک کامل از مزایا و معایب سرمایه گذاران در هر دو شرکت می پردازیم: تسلا: یک ادعای بزرگتر در مورد سهامداران حرفه"}, {"source": "Business Insider", "title": "Elon Musk wants to give every American kid a piece of SpaceX. History shows what happens when millions become shareholders overnight.", "link": "https://www.businessinsider.com/musk-wants-kids-spacex-shareholders-offering-kids-stocks-isnt-new-2026-10", "summary": "Elon Musk says he ll give every child in the US a piece of his space company, SpaceX. Kent NISHIMURA / AFP via Getty Images Elon Musk said he's going to give every child in the US a share of his space company, SpaceX. That would amount to $10.7 billion, based on SpaceX's stock price and the 72 million US children. Governments and billionaires have previously explored ways to spread corporate ownership. Christmas came early: Elon Musk wants American children to own stock in his space company, SpaceX , next year. Musk wrote on X around 1 a.m. Monday that he planned to make the donation next year — \"the first of many,\" he said. SpaceX went public this summer. Giving one share to each of the estimated 72 million US children would cost roughly $10.7 billion at SpaceX's closing price of $147.92 on Friday. Musk's 4.77 billion SpaceX shares were worth about $706 billion at that price, so the gift would reduce his holdings by about 1.5%. President Donald Trump said on Truth Social on Monday that the shares would be transferred through Trump Accounts , tax-advantaged investment accounts for eligible American kids launched this summer. Under temporary Treasury rules, donated shares generally cannot be sold for five years . \"This is exactly what was envisioned when we created TRUMP ACCOUNTS,\" Trump said. \"Bringing together the GREAT PRIVATE SECTOR, Elon and so many more, to invest in our children.\" The White House said nearly 70 million Trump Accounts have been created. Numerous entities have agreed to contribute, including a $6.25 billion donation from billionaire couple Michael and Susan Dell for children in lower-income zip codes. In July, SpaceX President Gwynne Shotwell and her husband pledged personal SpaceX shares worth at least $321 million, prioritizing lower-income communities. The White House, Elon Musk, and SpaceX did not immediately respond to a request for comment from Business Insider. Musk's plan to give away SpaceX stock raises questions about a new kind of billionaire philanthropy: Gifting people shares in a company instead of cash. Giving millions of children a stake in SpaceX could give them money to use later in life — but the value is tied to a single company's stock. And history shows that efforts to spread corporate ownership can yield uneven results, from big investment returns to stakes being sold for quick cash. Here are other historical efforts to share wealth or spread corporate ownership among everyday people. US Sen. Mike Gravel's 1978 s", "date_str": "2026-10-22T09:49:01+00:00", "hash": "77e9bf4a94766c7c", "title_fa": "ایلان ماسک می خواهد به هر بچه آمریکایی یک قطعه اسپیس ایکس بدهد. تاریخ نشان می دهد که وقتی میلیون ها نفر یک شبه سهامدار می شوند چه اتفاقی می افتد.", "summary_fa": "ایلان ماسک می‌گوید که به هر کودک آمریکایی بخشی از شرکت فضایی خود، اسپیس‌ایکس را می‌دهد. کنت نیشیمورا / خبرگزاری فرانسه از طریق گتی ایماژ ایلان ماسک گفت که به هر کودک در ایالات متحده سهمی از شرکت فضایی خود، SpaceX می دهد. این مبلغ بر اساس قیمت سهام اسپیس ایکس و 72 میلیون کودک آمریکایی به 10.7 میلیارد دلار می رسد. دولت‌ها و میلیاردرها قبلاً راه‌هایی را برای گسترش مالکیت شرکت‌ها بررسی کرده‌اند. کریسمس زود فرا رسید: ایلان ماسک از کودکان آمریکایی می خواهد که سهام شرکت فضایی او، اسپیس ایکس، را در سال آینده داشته باشند. ماسک در حوالی ساعت 1 بامداد دوشنبه در روز X نوشت که قصد دارد سال آینده این کمک مالی را انجام دهد - او گفت: \"اولین از بسیاری\". اسپیس ایکس تابستان امسال عمومی شد. اعطای یک سهم به هر یک از 72 میلیون کودک آمریکایی تقریباً 10.7 میلیارد دلار با قیمت پایانی SpaceX 147.92 دلار در روز جمعه هزینه خواهد داشت. ارزش 4.77 میلیارد سهام اسپیس ایکس ماسک با این قیمت حدود 706 میلیارد دلار بود، بنابراین این هدیه حدود 1.5 درصد از دارایی های او را کاهش می دهد. دونالد ترامپ، رئیس‌جمهور آمریکا روز دوشنبه در شبکه Truth Social گفت که این سهام از طریق حساب‌های ترامپ، حساب‌های سرمایه‌گذاری دارای مزیت مالیاتی برای بچه‌های آمریکایی واجد شرایط که تابستان امسال راه‌اندازی شد، منتقل خواهد شد. طبق قوانین موقت خزانه داری، سهام اهدایی معمولاً به مدت پنج سال قابل فروش نیست. ترامپ گفت: «این دقیقاً همان چیزی است که هنگام ایجاد حساب های ترامپ تصور می شد. \"با گرد هم آوردن بخش خصوصی بزرگ، ایلان و بسیاری دیگر، برای سرمایه گذاری روی فرزندانمان.\" کاخ سفید اعلام کرد نزدیک به 70 میلیون حساب کاربری ترامپ ایجاد شده است. نهادهای متعددی موافقت کرده اند که کمک کنند، از جمله کمک مالی 6.25 میلیارد دلاری"}, {"source": "Business Insider", "title": "Here's the exact portfolio mix JPMorgan says will outperform in the next decade", "link": "https://www.businessinsider.com/where-to-invest-best-portfolio-stocks-bonds-private-credit-equity-2026-10", "summary": "NYSE JPMorgan is suggesting a broader portfolio mix for optimal returns in the coming 10-15 years. The new portfolio has 30% in alternatives, including 7.5% in real estate and 4.5% in private credit. Economic nationalism, tech adoption, and capital rewiring are key themes influencing future returns. Should you ditch the 60/40 ? For optimal returns over the next 10-15 years, the answer might be yes, according to JPMorgan Asset Management. In its \"2027 Long-Term Capital Market Assumptions\" report published this week, the firm offered another portfolio structure to consider in place of the classic 60% stocks and 40% bonds. Instead, the firm outlined a portfolio containing a whopping 30% allocation to alternative investments. Here's exactly how the portfolio looks: Allocation Asset 42% Global stocks 28% Global bonds 7.5% Real estate 7.5% Other real assets (gold, infrastructure, commodities) 7.5% Private equity 4.5% Private credit 3% Hedge funds JPMorgan says this mix is set to deliver 7.5% average annual returns over the next 10-15 years, while the 60/40 will return 7%. But it's not just the return outlook that makes JPMorgan's portfolio suggestion more optimal. It's also more diversified, less risky, and less prone to moving in lockstep. The firm's portfolio has a 21% higher Sharpe ratio than the 60/40, meaning it delivers better returns relative to its risk profile. The 60/40 stock and bond positions were initially designed to be natural hedges, with one making up for the other in times of volatility. Historically, when the stocks have fallen, bonds have outperformed as investors have sought refuge in safe-haven assets. In the current inflationary environment, however, bonds have weather a bleak stretch of losses as investors demand higher yields, while inflation has also weighed on stocks. \"The volatility of inflation, rates and equities will likely move higher over our investment horizon. Meanwhile, we expect the stock-bond correlation to be more positive and unstable,\" a team of strategists at the bank wrote. \"A resilient portfolio can lean into opportunities while drawing on diversifiers to cushion the impact of different types of shocks.\" In the report, JPMorgan highlighted three big themes that will drive returns over the next decade-plus and impact assets in different ways. First is the rise in economic nationalism, which will be inflationary as countries become more protectionist and reshore industries. This will be bad for bonds but good for real as", "date_str": "2026-10-22T09:45:01+00:00", "hash": "20729fb10e076901", "title_fa": "در اینجا ترکیب دقیق پورتفولیو آمده است که JPMorgan می گوید در دهه آینده عملکرد بهتری خواهد داشت", "summary_fa": "NYSE JPMorgan ترکیب پرتفوی گسترده تری را برای بازدهی مطلوب در 10 تا 15 سال آینده پیشنهاد می کند. پرتفوی جدید 30 درصد در گزینه‌های جایگزین، شامل 7.5 درصد در املاک و 4.5 درصد در اعتبار خصوصی دارد. ملی گرایی اقتصادی، پذیرش فناوری، و سیم کشی مجدد سرمایه، موضوعات کلیدی تاثیرگذار بر بازده آینده هستند. آیا باید 60/40 را کنار بگذارید؟ به گفته مدیریت دارایی JPMo
