easured in equivalent album units, compiled by Luminate. Units comprise album sales, track equivalent albums (TEA) and streaming equivalent albums (SEA). Each unit equals one album sale, or 10 individual tracks sold from an album, or 2,500 ad-supported or 1,000 paid/subscription on-demand official audio and video streams generated by songs from an album. The new Nov. 14, 2026-dated chart will be posted in full on Billboard s website on Nov. 10. For all chart news, follow @billboard and @billboardcharts on both X and Instagram. In the tracking week of Oct. 30 through Nov. 5 — thus, including Halloween — Thriller earned 55,000 equivalent album units (up 89%), boosted by seasonal spooky streams of the set’s title track, as well as new physical versions of the album that were released. Of that unit total, SEA units comprise 32,000 (up 37%, equaling 34.34 million on-demand official streams of the set’s songs; it moves 14-5 on Top Streaming Albums), album sales comprise 22,000 (up 335%; it rises 14-3 on Top Album Sales) and TEA units comprise 1,000 (up 30%). On Oct. 30, Thriller was reissued across three new vinyl variants (two color editions and a liquid-filled version) and a cassette tape. The album’s 22,000 sales for the week mark its largest single-week sales sum in nearly four years, since it shifted 23,000 (Dec. 31, 2022-dated list). Notably, of Thriller ’s 22,000 sold in the latest tracking week, vinyl purchases account for 19,000 — the album’s largest sales week on vinyl since Luminate began electronically tracking sales in 1991. With Thriller ’s jump to No. 2, Jackson has his highest rank on the Billboard 200 in more than a decade, since the posthumous album Xscape debuted and peaked at No.", "date_str": "2026-11-08T20:02:24+00:00", "hash": "a9f27f7d4d919ff9", "title_fa": "«هیجان‌انگیز» مایکل جکسون بالاترین رتبه را در بیلبورد 200 آلبوم در بیش از 40 سال کسب کرده است.", "summary_fa": "خرک هیجان انگیز مایکل جکسون 13-2 در بیلبورد 200 (مورخ 14 نوامبر) قرار می گیرد و ب  "hash": "05ff6a20b77c0470", "title_fa": "Alycia Baumgardner در مقابل Elif Nur Turhan در ESPN Unlimited: اینجا جایی است که مسابقه عنوان را به صورت زنده آنلاین تماشا کنید", "summary_fa": "بهترین بوکسورهای جهان برای رویداد بوکس با ارزش ترین تبلیغات به تگزاس سفر می کنند. برای مسابقه اصلی، آلیسیا باومگاردنر آمریکایی (18-1-0) به مصاف الیف نور تورهان بوکسور ترکیه ای (14-0-0) می رود. مسابقه عنوان قهرمانی در 10 راند برنامه ریزی شده است. کمربند قهرمانی نور تورهان IBF در خط است، بنابراین برنده [ ] بازی Baumgardner مقابل Nur Turhan در روز یکشنبه، 8 نوامبر از سالن کالج پارک سنتر در آرلینگتون، تگزاس برگزار می شود. این رویداد از ساعت 17:30 شروع می شود. ET/2:30 بعد از ظهر PT، با شروع کارت اصلی حدود ساعت 20:30. ET/5:30 بعد از ظهر PT. رویداد بوکس MVP برای مسابقات مقدماتی و کارت اصلی برای تماشای ESPN Unlimited در دسترس است. داستان های مرتبط اسکارهای عزیز: اجازه ندهید لایکا و «وایلد وود» شکست بخورند. هیچ پشتیبان استاپ موشن استودیو Waiting in the Wings وجود ندارد از آنجایی که مسابقه در تگزاس برگزار می شود، ممکن است افراد مشهوری برای تماشای مسابقه عنوان حضور داشته باشند. مبارزات قبلی MVP ستاره هایی مانند لیل کیم، فلوید می ودر جونیور، جیک پل، آماندا سرانو و دیگران را به نمایش گذاشته است. برای اینکه بفهمید چه کسی در مسابقه حضور دارد، پخش زنده را تماشا کنید. در همین حال، با محبوبیت ورزش زنان، این احتمال وجود دارد که این مسابقه برای ESPN امتیازی باشد. همه شبکه‌های ESPN را با یک سرویس پخش دریافت کنید، اشتراک نامحدود ESPN را با قیمت 31.99 دلار در ماه در اینجا دریافت کنید، که به شما امکان دسترسی فوری به پخش آنلاین آنلاین را می‌دهد. برخلاف رویدادهای پرداخت به ازای مشاهده، Baumgardner vs. Nur Turhan برای پخش آنلاین رایگان برای مشترکین ESPN Unlimited در دسترس است. برای مشترکین جدید، بسته ESPN Unlimited با Disney+ و Hulu با قیمت 35.99 دلار در ماه ارائه می شود. این بسته با ESPN Unlimited و همچنین Disney+", "image_url": "https://variety.com/wp-content/uploads/2026/11/Boxing-MVP-Alycia-Baumgardner-Getty-VR-Featured.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", " ‌پردازد، زمانی که گاز اشک‌آور با برخی از شرکت‌کنندگان پانل در حالی که از دانشگاه خارج می‌شدند برخورد کرد. دانشجویان به اقدام اخیر دولت جناح راست پرزیدنت کاست، که کاهش بودجه در کل سیستم شامل آموزش و پرورش می شود، اعتراض داشتند. آنها همچنین خواستار استعفای فرناندو رباط وزیر دادگستری به دلیل کاهش مجازات وی برای مجرمان جنسی کودکان و ناقضان حقوق بشر شدند. در میان 9 عکس شیلیایی حاضر در رقابت، جایزه بهترین فیلم به مستند \"مونگوئن\" ساخته مرحوم آنتونیو کارو تعلق گرفت که او نیز در حین کار بر روی فیلمش به طور ناگهانی درگذشت که باعث شد تهیه کننده او مسئولیت را بر عهده بگیرد. للیو در حال فیلمبرداری اقتباسی از رمان «شاعر شیلیایی» الخاندرو زامبرا برای Fabula بود و همچنین در مرحله پیش تولید فیلم «Voyagers» با حضور اندرو گارفیلد و دیزی ادگار جونز بود. \"فکر می‌کنم این یک قدردانی شایسته برای \"Monguen\" است، فیلمی که داستان‌ها را از حاشیه بررسی می‌کند. این فیلم به موضوعی می‌پردازد که در سینمای شیلی به ندرت به آن پرداخته می‌شود: فرهنگ ماپوچه، فرهنگ جنوب و شخصیت‌هایی که اغلب در صفحه نمایش نمایش داده نمی‌شوند. در این فیلم، آنتونیو کارو آن دنیاها را زنده می‌کند و به ما اجازه می‌دهد تا به مردم جنوب، فرهنگ عمیق‌تری را به دست آوریم.\" تنوع.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Monguen_Still-3-Mariella-Chavez.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۷ آبان • ۲۱:۵۷"}, {"source": "Billboard", "title": "Celine Dion Shares Metallica Backstage Photos After Rocking Out at Sphere: ‘Loved the Show’", "link": "https://www.billboard.com/music/music-news/celine-dion-metallica-backstage-photos-sphere-1236377038/", "summary": "Celine Dion embraced her inner metalhead at Metallica s Sphere show in Las Vegas. After going viral for playing air bass during the band s Nov. 5 performance at Sphere in Las Vegas, the superstar singer returned for Metallica s Life Burns Faster residency show on Saturday (Nov. 7), where she was spotted enjoying the concert alongside Jack Black before meeting the heavy metal legends backstage. isorder that causes muscle stiffness and spasms and forced her to step away from touring. Metallica lau", "date_str": "2026-11-08T18:58:39+00:00", "hash": "6284bd6239d43862", "title_fa": "سلین دیون عکس‌های بک استیج متالیکا را پس از بازی در Sphere به اشتراک گذاشت: «عاشق نمایش»", "summary_fa": "سلین دیون در نمایشگاه Metallica s Sphere در لاس وگاس، متالد درونی خود را در آغوش گرفت. این خواننده فوق ستاره پس از پخش شدن به خاطر نواختن ایرباس در حین اجرای گروه در 5 نوامبر در Sphere در لاس وگاس، برای نمایش اقامتی متالیکا زندگی می سوزد سریعتر در روز شنبه (7 نوامبر) بازگشت، جایی که او در حال لذت بردن از کنسرت در کنار جک بلک قبل از ملاقات با اسطوره های هوی متال در پشت صحنه دیده شد. در ویدئویی که توسط TMZ از برنامه شنبه به دست آمده است، دیون در حالی که متالیکا آهنگ نمادین خود را در سال 1991 \"Enter Sandman\" را اجرا می کند، در حالی که مهارت های گیتار هوایی خود را نیز به نمایش می گذارد، دیون دست های خود را به هوا پرتاب کرد و سرش را کوبید. بلک در کنار دیون ایستاده بود و در حین تکنوازی گیتار بالای سرش کف می زد و با اشتیاق در برنامه شرکت می کرد. پس از کنسرت، دیون به پشت صحنه رفت تا با جیمز هتفیلد، لارس اولریش، کرک همت و رابرت تروجیلو، اعضای متالیکا را ملاقات کند. او مجموعه‌ای از عکس‌های پشت صحنه این برخورد را در اینستاگرام به اشتراک گذاشت، از جمله لحظاتی با پسرانش ادی و نلسون آنجلیل، که آنها را با همسر فقیدش، رنه آنجلیل به اشتراک می‌گذارد. از جیمز، لارس، کرک و راب و همه اعضای سازمان @Metallica برای استقبال گرم متشکریم! دیون برای گالری توضیح داد. با دیدن شما در Sphere لحظات فوق العاده ای داشتیم. ما کاملاً برنامه را دوست داشتیم.🤘 چرخ فلک دارای یک عکس دسته جمعی از دیون است که با پسرانش و گروه ژست گرفته است، به همراه عکس های بازیگوشی از خواننده در کنار تروخیلو نوازنده بیس و یک عکس سیاه و سفید از گپ زدن او با آهنگساز هتفیلد. در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/celine-dion-plentitude-arena-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۷ آبان • ۲۲:۲۸"}, {"source": "Deadline", "title": "Benito Skinner مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۷ آبان • ۲۱:۴۹"}, {"source": "Variety", "title": "Andy Serkis Says He Was ‘Evangelical’ About Performance Capture After Playing Gollum in ‘Lord of the Rings’ but Now Accepts It’s ‘Misunderstood’: ‘If You Get It? Great’", "link": "https://variety.com/2026/film/news/andy-serkis-motion-capture-gollum-1236942445/", "summary": "Andy Serkis, who played an instrumental role in bringing the on-screen version of Gollum (also known as Sméagol) to life in “The Lord of the Rings” franchise, is reflecting on the technology that helped him do so. Gollum, a central character in the films, is the result of both Serkis performance and computer-generated elements through [ ]", "date_str": "2026-11-08T18:58:21+00:00", "hash": "56a2975360c0624c", "title_fa": "اندی سرکیس می‌گوید پس از بازی در نقش گولوم در «ارباب حلقه‌ها» درباره پرفورمنس کپچر «انجیلی» بود، اما اکنون می‌پذیرد که «سوءتفاهم شده است»: «اگر آن را دریافت کنی؟ عالی", "summary_fa": "اندی سرکیس، که نقش مهمی در زنده کردن نسخه روی صفحه گولوم (همچنین با نام اسماگول) در فرنچایز «ارباب حلقه‌ها» ایفا کرد، در حال انعکاس فناوری است که به او کمک کرده است. گولوم، یکی از شخصیت‌های اصلی فیلم‌ها، نتیجه عملکرد سرکیس و عناصر تولید شده توسط کامپیوتر از طریق [] اندی سرکیس است که نقش مهمی در زنده کردن نسخه روی پرده گولوم (همچنین با نام اسماگل) در فرنچایز «ارباب حلقه‌ها» ایفا کرد، در حال انعکاس فناوری است که به او در انجام این کار کمک کرد. \"چون این فناوری خیلی اشتباه فهمیده شده است. من قبلا انجیلی بودم. من ساعت ها در مورد نحوه بازیگری فیلمبرداری از پرفورمنس صحبت کرده ام و تماشای چشمانی که خیره می شوند، اما زندگی خیلی کوتاه است. آرام شدم. حالا من فقط فکر می کنم، \"اگر آن را دریافت کنید؟ عالی،» او گفت. نمایش‌هایی مانند گولوم توسط بازیگری نوشته می‌شود، همان‌طور که یک تیم پروتز جان هرت را در «مرد فیل‌مرد» مهندسی کرد. اما بنا به دلایلی، اجرای زیر یک ماسک فیزیکی برای برخی قابل درک‌تر از این است که یک ماسک دیجیتال است.» در ماه مه، پیتر جکسون، فیلمساز «ارباب حلقه‌ها» به گفت‌وگوی موشن کپچر اشاره کرد و گفت که بحث‌های فزاینده درباره هوش مصنوعی در فیلم یکی از دلایلی است که سرکیس برای بازی در نقش گولوم جوایزی را کسب نکرده - و احتمالاً هرگز نخواهد گرفت. او در آن زمان گفت: «بسیاری از محیط کنونی، همه نگران هوش مصنوعی هستند... من فکر نمی‌کنم یک شخصیت از نوع گولوم یا یک شخصیت ساخته شده امیدی به برنده شدن جوایزی داشته باشد.» \"که کمی ناعادلانه است، به خصوص در مورد اندی سرکیس که در آن یک عملکرد تولید شده توسط هوش مصنوعی نیست. این یک عملکرد تولید شده توسط انسان 100٪ است.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/GettyImages-1247589803.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما"], "datetime_fa": "۱۷ آبان • ۲۲:۲۸"}, {"source": "Variety", "title": "Sanfic Prizes: ‘Monguen’ and ‘Narciso” Win at Pared-Back Ceremony Due to Sudden Demise of ‘A Fantastic Woman’ Director Sebastian Lelio", "link": "https://variety.com/2026/film/global/sanfic-prizes-monguen-narciso-sebastian-lelio-remembered-1236942162/", "summary": "The unexpected demise Nov. 6 of Chile’s Oscar-winning Sebastián Lelio (“A Fantastic Woman”) cast a pall over the closing ceremonies of both the festival and industry section of the Santiago Film Festival (Sanfic), which wraps Nov. 8. The red carpet portions of the industry and festival ceremonies held Nov. 6 and 7, respectively, were cancelled. [ ]", "date_str": "2026-11-08T18:27:06+00:00", "hash": "8db14588321999dd", "title_fa": "جوایز سانفیک: «Monguen» و «Narciso» به دلیل درگذشت ناگهانی کارگردان «یک زن شگفت‌انگیز»، سباستین للیو، در مراسم رقص برنده شدند.", "summary_fa": "درگذشت غیرمنتظره 6 نوامبر برنده اسکار شیلیایی سباستین للیو («یک زن شگفت‌انگیز») مراسم اختتامیه جشنواره و بخش صنعتی جشنواره فیلم سانتیاگو (سانفیک) را که در 8 نوامبر به پایان می‌رسد، تحت تأثیر قرار داد. [ ] خانواده للیو اعلام کردند که Cineteca Nacional (کتابخانه ملی فیلم) برای همه کسانی که مایل به ادای احترام در این آخر هفته هستند باز خواهد بود. زندگی واقعی برخی از تماشاگران جشنواره را به یاد آخرین فیلم للیو، موزیکال «موج» («لا اولا») انداخت، که به اعتراضات خشونت‌آمیز دانشجویان شیلی در سال 2018 می‌پردازد، زمانی که گاز اشک‌آور با برخی از شرکت‌کنندگان پانل در حالی که از دانشگاه خارج می‌شدند برخورد کرد. دانشجویان به اقدام اخیر دولت جناح راست پرزیدنت کاست، که کاهش بودجه در کل سیستم شامل آموزش و پرورش می شود، اعتراض داشتند. آنها همچنین خواستار استعفای فرناندو رباط وزیر دادگستری به دلیل کاهش مجازات وی برای مجرمان جنسی کودکان و ناقضان حقوق بشر شدند. در میان 9 عکس شیلیایی حاضر در رقابت، جایزه بهترین فیلم به مستند \"مونگوئن\" ساخته مرحوم آنتونیو کارو تعلق گرفت که او نیز در حین کار بر روی فیلمش به طور ناگهانی درگذشت که باعث شد تهیه کننده او مسئولیت را بر عهده بگیرد. للیو در حال فیلمبرداری اقتباسی از رمان «شاعر شیلیایی» الخاندرو زامبرا برای Fabula بود و همچنین در مرحله پیش تولید فیلم «Voyagers» با حضور اندرو گارفیلد و دیزی ادگار جونز بود. \"فکر می‌کنم این یک قدردانی شایسته برای \"Monguen\" است، فیلمی که داستان‌ها را از حاشیه بررسی می‌کند. این فیلم به موضوعی می‌پردازد که در سینمای شیلی به ندرت به آن پرداخته می‌شود: فرهنگ ماپوچه، فرهنگ جنوب و شخصیت‌هایی که اغلب در صفحه نمایش نمایش داده نمی‌شوند. در این فیلم، آنتونیو کارو آن دنیاها را زنده می‌کند و به ما اجازه می‌دهد تا به مردم جنوب، فرهنگ عمیق‌تری را به دست آوریم.\" تنوع.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Monguen_Still-3-Mariella-Chavez.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۷ آبان • ۲۱:۵۷"}, {"source": "Variety", "title": "Judi Dench Says Vin Diesel Sent Her Flowers ‘the Length of a Kayak’ to Persuade Her to Join ‘The Chronicles of Riddick’: I’m ‘Far Too Easily Wooed’", "link": "https://variety.com/2026/film/news/judi-dench-reveals-she-was-wooed-1236942417/", "summary": "Judi Dench can’t say no to a big bouquet of flowers, especially if they’re kayak-sized and come from Vin Diesel. “He came to see me at the Haymarket Theatre to ask if I’d be in ‘The Chronicles of Riddick,’” Dench wrote in her new memoir, “Is It Too Late to Make a Run for It?” [ ]", "date_str": "2026-11-08T18:08:07+00:00", "hash": "99525193377b01b6", "title_fa": "جودی دنچ می‌گوید وین دیزل گل‌هایش را «طول یک کایاک» فرستاد تا او را متقاعد کند که به «تواریخ‌های ریدیک» بپیوندد: من «خیلی راحت دلخورم»", "summary_fa": "جودی دنچ نمی تواند به یک دسته گل بزرگ نه بگوید، به خصوص اگر اندازه کایاک باشد و از وین دیزل آمده باشد. دنچ در کتاب خاطرات جدید خود با عنوان «آیا برای دویدن خیلی دیر است؟» می‌نویسد: «او به تماشای من در تئاتر های مارکت آمد تا از من بپرسد که آیا در «سرگذشت ریدیک» حضور دارم یا خیر. [ ] جودی دنچ نمی تواند به یک دسته گل بزرگ نه بگوید، به خصوص اگر اندازه کایاک باشد و از وین دیزل آمده باشد. دنچ در کتاب خاطرات جدید خود با عنوان «آیا برای دویدن خیلی دیر است؟» می‌نویسد: «او به تماشای من در تئاتر های مارکت آمد تا از من بپرسد که آیا در «سرگذشت ریدیک» حضور دارم یا خیر. \"قبل از رسیدن او، او چنین دسته گل عظیمی را برای من فرستاد. آنها نتوانستند آنها را از پله ها به اتاق رختکن من ببرند، بنابراین مجبور شدند آنها را در درب صحنه بگذارند. آنها به راحتی به اندازه یک کایاک بودند. و به اندازه عرض.» داستان های مرتبط مطالعه مخاطبان تایوان فرصت های IP بین پلتفرمی را برجسته می کند زیرا هوش مصنوعی خطرات جدیدی را برای صنعت محتوا ایجاد می کند. او به شوخی گفت: «من مثل چیپس ارزان هستم. خیلی راحت وسوسه می شود.» دنچ که از این ژست متقاعد شد، در فیلم سال 2004 نقش ایرئون را بازی کرد، سفیر اصلی که ریدیک (دیزل) را در سفرهای پر فراز و نشیب خود راهنمایی می کند تا متحدان قدیمی خود را نجات دهد و با رئیس امپراتوری نکرومونگر مقابله کند. این اولین باری نبود که هدایایی این بازیگر 91 ساله را جذب یک نقش می کرد. او همچنین فاش کرد که کنت برانا وقتی از من خواست در [قتل در قطار سریع السیر شرق] حضور داشته باشم، شگفت‌انگیزترین دستمال گلدوزی شده را به او داد", "image_url": "https://variety.com/wp-content/uploads/2026/11/MCDCHOF_EC042.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما"], "datetime_fa": "۱۷ آبان • ۲۱:۳۸"}, {"source": "Billboard", "title": "The Strokes Get a Surprise Visit From Walton Goggins During ‘SNL’ Performance: Watch", "link": "https://www.billboard.com/music/rock/the-strokes-snl-walton-goggins-cameo-performance-video-1236377034/", "summary": "The Strokes rocked Saturday Night Live with two new songs and a surprise appearance by Walton Goggins. The New York City rock band appeared during the Druski-hosted episode on Nov. 7, performing “Lonely in the Future” and “Going Shopping,” both featured on its seventh studio album, Reality Awaits , which arrived in July. Related The Strokes Better Look Out: Druski Is Coming for Their Musical Guest Gig in New SNL Promos Simple Plan Are Meeting a Whole New Generation of Fans, 25 Years In Deep Purple s Ian Gillan Shares Encouraging News After Undergoing Surgery For their first performance, the Julian Casablancas -led quintet delivered “Lonely in the Future” against a backdrop of psychedelic visuals and elaborate lighting. Following the performance, the band released the song’s official music video , which features a cast of handcrafted puppets created in collaboration with the team behind the British satirical series Spitting Image . The group closed its SNL musical guest appearance with “Going Shopping,” which featured a surprise appearance by actor Goggins. Dressed in an all-black suit and sunglasses, the Fallout star joined the band on bongos, reprising his role in the song’s music video. Saturday s appearance marked The Strokes’ fourth time as musical guests on SNL . The band made its debut on the NBC sketch comedy show in January 2002, followed by performances in 2006 and 2011. The Strokes are currently promoting Reality Awaits , which debuted at No. 13 on the all-genre Billboard 200 and No. 5 on the Top Rock Alternative Albums chart. The nine-track set was recorded in Costa Rica with legendary producer Rick Rubin, who previously worked with the act on its 2020 album, The New Abnormal . SNL is back Nov. 14 with fan favorite John Mulaney returning to host and Phoebe Bridgers taking the stage as musical guest. Watch The Strokes perform “Lonely in the Future” and “Goi     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
