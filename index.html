 حماس در این منطقه حکومت نخواهد کرد و اسراییل افرادی را که در حمله ۷ اکتبر مشارکت داشتند یا گروگان‌ها را در اختیار داشتند، همچنان دنبال خواهد کرد. نتانیاهو درباره لبنان نیز گفت اسراییل به حمله به حزب‌الله ادامه خواهد داد، اما همزمان در پی ایجاد فرصتی برای صلح با لبنان است؛ کشوری که به گفته او، اکثریت قاطع مردم آن خواهان صلح با اسراییل هستند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید"}, {"source": "IranWire", "title": "دو نفتکش دیگر در تنگه هرمز هدف حمله قرار گرفتند", "link": "https://iranwire.com/fa/news-1/158503-%D8%AF%D9%88-%D9%86%D9%81%D8%AA%DA%A9%D8%B4-%D8%AF%DB%8C%DA%AF%D8%B1-%D8%AF%D8%B1-%D8%AA%D9%86%DA%AF%D9%87-%D9%87%D8%B1%D9%85%D8%B2-%D9%87%D8%AF%D9%81-%D8%AD%D9%85%D9%84%D9%87-%D9%82%D8%B1%D8%A7%D8%B1-%DA%AF%D8%B1%D9%81%D8%AA%D9%86%D8%AF/", "summary": "سازمان عملیات تجارت دریایی بریتانیا، روز دوشنبه ۱۳ مهر ۱۴۰۵۷، اعلام کرد دو نفتکش روز گذشته در تنگه هرمز هدف پرتابه‌های ناشناس قرار گرفته ...", "date_str": "2026-10-05T14:55:57+00:00", "hash": "88caed5c9001f2c0", "title_fa": "دو نفتکش دیگر در تنگه هرمز هدف حمله قرار گرفتند", "summary_fa": "سازمان عملیات تجارت دریایی بریتانیا، روز دوشنبه ۱۳ مهر ۱۴۰۵۷، اعلام کرد دو نفتکش روز گذشته در تنگه هرمز هدف پرتابه‌های ناشناس قرار گرفته ... بر اساس اطلاعیه سازمان عملیات تجارت دریایی بریتانیا، یک تانکر حامل گاز مایع که در حال ورود به تنگه هرمز بود، عصر یکشنبه هدف یک پرتابه ناشناس قرار گرفت. حدود دو ساعت بعد نیز یک نفتکش حامل نفت خام با پرتابه‌های ناشناس مورد اصابت قرار گرفت. این سازمان اعلام کرد گزارش‌های مربوط به هر دو حادثه با تاخیر و از منابع تایید شده دریافت شده است. در حادثه‌ای جداگانه، سازمان عملیات تجارت دریایی بریتانیا اعلام کرد سپاه پاسداران با یک نفتکش در حال ورود به منطقه، در فاصله ۱۱ مایل دریایی شمال خصب عمان، تماس گرفته و تهدید کرده است در صورت ادامه مسیر، کشتی را هدف قرار خواهد داد. بر اساس این گزارش، ناخدای کشتی اعلام کرده که دستور سپاه را پذیرفته و مسیر خود را تغییر داده است. مقام‌های مربوطه در حال بررسی هر سه حادثه هستند و سازمان عملیات تجارت دریایی بریتانیا به کشتی‌های عبوری توصیه کرده است با احتیاط بیشتری در منطقه تردد کنند و هرگونه فعالیت مشکوک را گزارش دهند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید"}, {"source": "IranWire", "title": "اعترافات ولی‌الله سیف؛ ناترازی بانک‌ها، سرکوب نرخ ارز و سقوط طبقه متوسط", "link": "https://iranwire.com/fa/features/158510-%D8%A7%D8%B9%D8%AA%D8%B1%D8%A7%D9%81%D8%A7%D8%AA-%D9%88%D9%84%DB%8C%D8%A7%D9%84%D9%84%D9%87-%D8%B3%DB%8C%D9%81-%DA%86%DA%AF%D9%88%D9%86%D9%87-%D9%86%D8%A7%D8%AA%D8%B1%D8%A7%D8%B2%DB%8C-%D8%A8%D8%A7%D9%86%DA%A9%D9%87%D8%A7-%D9%88-%D8%B3%D8%B1%DA%A9%D9%88%D8%A8-%D8%A7%D8%B1%D8%B2%DB%8C-%D8%B7%D8%A8%D9%82%D9%87-%D9%85%D8%AA%D9%88%D8%B3%D8%B7-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%B1%D8%A7-%D8%A8%D9%84%D8%B9%DB%8C%D8%AF/", "summary": "ولی‌الله سیف، رییس‌کل پیشین بانک مرکزی در گفت‌‌و‌گویی با «کافه‌خبر» خبرآنلاین به تحلیل چگونگی تاثیر سیاست‌های پولی و بانکی بر ساختار و ک ...", "date_str": "2026-10-05T15:21:24+00:00", "hash": "fb74b8c8a0291021", "title_fa": "اعترافات ولی‌الله سیف؛ ناترازی بانک‌ها، سرکوب نرخ ارز و سقوط طبقه متوسط", "summary_fa": "ولی‌الله سیف، رییس‌کل پیشین بانک مرکزی در گفت‌‌و‌گویی با «کافه‌خبر» خبرآنلاین به تحلیل چگونگی تاثیر سیاست‌های پولی و بانکی بر ساختار و ک ... ناترازی بانک‌ها؛ بهمنی که از بحران موسسات غیرمجاز بزرگ‌تر شده یکی از محورهای اصلی سخنان سیف، ناترازی عمیق نظام بانکی و پیامدهای تورم‌زای آن برای جامعه است. به گفته او، «دارایی و بدهی بانک‌های کشور با یکدیگر همخوانی ندارد و همین امر باعث شده تا بانک‌ها برای ادامه حیات خود همواره دست در جیب بانک مرکزی داشته باشند» که براساس تحلیل سیف، بدهکار شدن مداوم بانک‌ها به بانک مرکزی به معنای چاپ پول بدون پشتوانه و رشد افسارگسیخته نقدینگی است که مستقیم به صورت تورم شدید بر سفره مردم تخلیه می‌شود. سیف با مقایسه این ناترازی با بحران «موسسات مالی غیرمجاز» در دهه نود، هشدار می‌دهد که ناترازی فعلی بانک‌ها همانند بهمنی است که روزبه‌روز بزرگ‌تر می‌شود. او یادآور شده که در زمان مسئولیتش هشدار داده بود اگر جلوی حرکت ابتدایی بهمن گرفته نشود، در صورت رسیدن به دشت، همه‌چیز را تخریب خواهد کرد. رئیس‌کل سابق بانک مرکزی با اشاره به جنجال تسویه مطالبات موسسات غیرمجاز خاطرنشان ساخته با وجود فشارها برای پرداخت خسارت از منابع بانک مرکزی، در نهایت شورای هماهنگی سران سه قوه مصوبه‌ای ۳۵ هزار میلیارد ریالی (۳هزار و ۵۰۰ میلیارد تومانی) را تصویب کرد که حدود ۵۰ درصد آن به صورت وام مشروط به وثائق ملکی پرداخت و بعداً تسویه شد. رییس کل سابق بانک مرکزی ریشه آن مؤسسات را در مجوزهای بدون نظارت وزارت تعاون می‌داند و با ابراز تاسف از آمارهای مربوط به وجود ۴هزار صندوق قرض‌الحسنه بدون مجوز فعلی، تاکید می‌کند که عدم برخورد با این عدم تعادل‌ها تاوان سنگینی را به کل جامعه و سپرده‌گذاران تحمیل می‌کند. «فشردن فنری که بر سر تولید و اشتغال خراب می‌شود» بخش دیگری از سخنان ولی‌الله سیف است. او در این مصاحبه"}, {"source": "IranWire", "title": "محسن رضایی: خطای محاسباتی دشمن به باز شدن جبهه‌های تازه منجر می‌شود", "link": "https://iranwire.com/fa/news-1/158515-%D9%85%D8%AD%D8%B3%D9%86-%D8%B1%D8%B6%D8%A7%DB%8C%DB%8C-%D8%AE%D8%B7%D8%A7%DB%8C-%D9%85%D8%AD%D8%A7%D8%B3%D8%A8%D8%A7%D8%AA%DB%8C-%D8%AF%D8%B4%D9%85%D9%86-%D8%A8%D9%87-%D8%A8%D8%A7%D8%B2-%D8%B4%D8%AF%D9%86-%D8%AC%D8%A8%D9%87%D9%87%D9%87%D8%A7%DB%8C-%D8%AA%D8%A7%D8%B2%D9%87-%D9%85%D9%86%D8%AC%D8%B1-%D9%85%DB%8C%D8%B4%D9%88%D8%AF/", "summary": "محسن رضایی، دبیر شورای عالی امنیت ملی جمهوری اسلامی، با هشدار درباره احتمال حمله دوباره به ایران گفت هرگونه «خطای محاسباتی» دشمن می‌توان ...", "date_str": "2026-10-05T15:55:00+00:00", "hash": "8e479d9b65f0e7df", "title_fa": "محسن رضایی: خطای محاسباتی دشمن به باز شدن جبهه‌های تازه منجر می‌شود", "summary_fa": "محسن رضایی، دبیر شورای عالی امنیت ملی جمهوری اسلامی، با هشدار درباره احتمال حمله دوباره به ایران گفت هرگونه «خطای محاسباتی» دشمن می‌توان ... رضایی روز دوشنبه ۱۳ مهر در شبکه اجتماعی ایکس نوشت: «هر خطای محاسباتی دشمن در برابر ایران، شکست سنگینی برایش رقم زده است؛ خطای بعدی، جبهه‌های تازه و غافلگیری‌های بزرگ‌تر را در پی خواهد داشت.» او همچنین با اشاره به رهبری مجتبی خامنه‌ای و همراهی ریکا قرار دارد، هفته گذشته پس از بازداشت چند مرد مشکوک به فعالیت‌های غیرقانونی در نزدیکی آن خبرساز شد. در میان بازداشت‌شدگان یک تبعه ایرانی-بریتانیایی نیز حضور داشت. این افراد بعدا با قید وثیقه آزاد شدند. اندی برنهام، نخست‌وزیر بریتانیا، گفته است «نشانه‌های قوی» از ارتباط ایران با فعالیت‌های مشکوک در نزدیکی این پایگاه وجود دارد. جمهوری اسلامی این اتهام را قویا رد کرده و سفیر بریتانیا در تهران نیز برای اعتراض به این موضوع احضار شده است. ترامپ همچنین در پاسخ به پرسشی درباره احتمال دست داشتن ایران در حادثه پرواز فلای‌دوبی گفت شخصا چنین فکر می‌کند. پرواز فلای‌دوبی در هشتم مهر با ۱۷۴ سرنشین، که بیشتر آنها اسراییلی بودند، از دوبی به مقصد تل‌آویو"}, {"source": "IranWire", "title": "علیرضا رئیسی و علیرضا سپاهی؛ سناریوی تکراری شکنجه، اعتراف و اعدام", "link": "https://iranwire.com/fa/features/158522-%D8%B9%D9%84%DB%8C%D8%B1%D8%B6%D8%A7-%D8%B1%D8%A6%DB%8C%D8%B3%DB%8C-%D9%88-%D8%B9%D9%84%DB%8C%D8%B1%D8%B6%D8%A7-%D8%B3%D9%BE%D8%A7%D9%87%DB%8C-%D8%B3%D9%86%D8%A7%D8%B1%DB%8C%D9%88%DB%8C-%D8%AA%DA%A9%D8%B1%D8%A7%D8%B1%DB%8C-%D8%B4%DA%A9%D9%86%D8%AC%D9%87-%D8%A7%D8%B9%D8%AA%D8%B1%D8%A7%D9%81-%D9%88-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85/", "summary": "«ایران‌وایر» مطلع شده که پیکرهای «علیرضا سپاهی» و «علیرضا رئیسی»، دو معترض جوان دی‌ماه۱۴۰۴ که در پرونده «میدان علیخانی» اصفهان سحرگاه دو ...", "date_str": "2026-10-06T06:34:38+00:00", "hash": "2b210ede851d29a7", "title_fa": "علیرضا رئیسی و علیرضا سپاهی؛ سناریوی تکراری شکنجه، اعتراف و اعدام", "summary_fa": "«ایران‌وایر» مطلع شده که پیکرهای «علیرضا سپاهی» و «علیرضا رئیسی»، دو معترض جوان دی‌ماه۱۴۰۴ که در پرونده «میدان علیخانی» اصفهان سحرگاه دو ... یک منبع مطلع به ایران‌وایر گفته که به‌رغم جاری شدن صیغه عقد بین علیرضا سپاهی، معترض ۲۴ساله و «مهشاد کشانی»، دانشجوی ۲۲ساله و زندانی سیاسی که در مردادماه۱۴۰۵ برای بار دوم از زمان اعتراضات دی‌ماه بازداشت شده، مقامات سازمان زندان‌ها به این دو جوان عاشق اجازه ملاقات آخر نداده‌اند. پیش‌تر یک منبع مطلع به ایران‌وایر گفته بود که دلیل عقد این دو جوان در حالی‌که هر دو در زندان بودند، به‌منظور دیدار آخر آن‌ها بوده و ابراز امیدواری کرده بود که مهشاد هم مانند «سمیه افشار»، مادر علیرضا سپاهی که به ۵سال حبس محکوم شده و در زندان دولت‌آباد اصفهان است، برای دیدار آخر به زندان دستگرد برده شود؛ دیدار و وداعی که با اعدام علیرضا هرگز میسر نشد. «مهشید ناظمی»، فعال حقوق‌بشر و مدیر ارتباطات نهاد حقوق‌بشری «خانه ایران» که با نزدیکان خانواده سپاهی در ارتباط است نیز می‌گوید که خانواده درباره دیدار آخر علیرضا گفته‌اند: «فقط می‌خندید و می‌گفت بعد من خوب زندگی کنید. قراره برم اون دنیا منتظر یه دادگاه خیلی خوب!» یک هم‌بندی سابق علیرضا رئیسی نیز به ایران‌وایر می‌گوید که او در اوج مظلومیت و بی‌صدایی اعدام شده است: «فقط ۲۱سالش بود، بچه‌ کارگرِ پایین‌شهری. آن‌قدر کتک‌اش زده بودند تا اعتراف کند. همه‌شان را کتک زدند که علیه هم اعتراف کنند. من گوشه ذهنم همیشه دارم که ساده اعتماد نکنم، آدم‌ها توی جو ممکن است هر کاری بکنند. ولی واقعا ازش بعید بود. بچه بی‌آزاری بود، بی‌گناه بود، سر بی‌گناه بالای دار رفت.» منابع مطلعی که به ایران‌وایر گفت‌وگو کرده‌اند، می‌گویند که شب قبل، یعنی یک‌شنبه شب، ۱۲مهرماه، مسوولان زندان دستگرد به خانواده این دو جوان گفته بودند که بروند خانه و فردا ساعت ۸، ۸:۳۰ صبح بیایند. زندان تایید نکرده بود"}, {"source": "IranWire", "title": "استعفای وزیر نفت در میانه بحران؛ از فروش صفر تا پرونده تراستی‌ها", "link": "https://iranwire.com/fa/features/158523-%D8%A7%D8%B3%D8%AA%D8%B9%D9%81%D8%A7%DB%8C-%D9%88%D8%B2%DB%8C%D8%B1-%D9%86%D9%81%D8%AA-%D8%AF%D8%B1-%D9%85%DB%8C%D8%A7%D9%86%D9%87-%D8%A8%D8%AD%D8%B1%D8%A7%D9%86-%D8%A7%D8%B2-%D9%81%D8%B1%D9%88%D8%B4-%D8%B5%D9%81%D8%B1-%D8%AA%D8%A7-%D9%BE%D8%B1%D9%88%D9%86%D8%AF%D9%87-%D8%AA%D8%B1%D8%A7%D8%B3%D8%AA%DB%8C%D9%87%D8%A7/", "summary": "«محسن پاک‌نژاد»، وزیر نفت، نخستین وزیری است که از کابینه «مسعود پزشکیان»، رییس‌جمهور، استعفا می‌دهد؛ آن هم در میانه جنگ و محاصره دریایی ...", "date_str": "2026-10-06T06:52:59+00:00", "hash": "893a6462fbd274bf", "title_fa": "استعفای وزیر نفت در میانه بحران؛ از فروش صفر تا پرونده تراستی‌ها", "summary_fa": "«محسن پاک‌نژاد»، وزیر نفت، نخستین وزیری است که از کابینه «مسعود پزشکیان»، رییس‌جمهور، استعفا می‌دهد؛ آن هم در میانه جنگ و محاصره دریایی ... این استعفا در شرایطی رخ می‌دهد که در ۹ مهر ماه، «اسکات بسنت»، وزیر خزانه‌داری آمریکا، در ایکس نوشته بود: «ایران در ماه سپتامبر صفر بشکه نفت خام روی نفتکش‌ها بارگیری کرد.» داده‌های «بلومبرگ»، «کپلر» و «ورتکسا» هم در سپتامبر هیچ بارگیری نفت خامی از بنادر ایران را ثبت نکرده‌اند. اما پیش از استعفا، پاک‌نژاد می‌گفت پول نفتِ فروخته‌شده «وصول» می‌شود. اما واقعیت این نامنظم شدن فروش و درآمد خود را در بالا رفتن قیمت دلار نشان می‌دهد، دلاری که اکنون برای ثابت نگه داشتنش می‌خواهند جلوی اعلام قیمت آن را نیز بگیرند . حالا «دلایل شخصی» توضیح رسمی استعفای وزارتخانه‌ای است که تراستی‌ها کارهای عمده فروشش را انجام می‌دهند و درآمدش را نمی‌تواند کسب کند و در عین حال باید بخشی از خط مقدم مبارزه با اقدامات آمریکا باشد. شکاف بر سر ساده‌ترین واقعیت، یعنی فروش نفت، در هفته‌های پیش از استعفای وزیر نه فقط میان تهران و واشنگتن، که درون خود دولت هم افتاده بود. «دونالد ترامپ»، رییس‌جمهور آمریکا، ۵ مهر گفت : «دیشب رکورد جدیدی از خروج نفت از تنگه ثبت کردیم؛ بیشتر از مقداری که پیش از جنگ خارج می‌کردیم.» در روزهای گذشته دولت آمریکا ارقامی بین ۱۵ تا ۲۲ میلیون بشکه در روز را اعلام کرده است که از تنگه عبور می‌کند. در همین هفته نیز«بلومبرگ» به نقل از «جی‌پی مورگان» نوشت صادرات نفتی خاورمیانه به ۹۸ درصد سطح پیش از جنگ برگشته و نفت خام به ۱۷.۵ میلیون بشکه در روز رسیده است. وب‌سایت «تانکرترکرز» ۲۱ شهریور اعلام کرد در ۶۰ روز گذشته «حتی یک بشکه» نفت خام ایران از خط محاصره عبور نکرده، در حالی که شش کشور عرب منطقه به‌طور متوسط روزانه ۷ میلیون و ۸۵۰ هزار بشکه"}, {"source": "IranWire", "title": "سنتکام: ۱۳ کشتی ناقض محاصره ایران طی ۱۲ هفته گذشته منهدم شدند", "link": "https://iranwire.com/fa/news-1/158524-%D8%B3%D9%86%D8%AA%DA%A9%D8%A7%D9%85-%DB%B1%DB%B3-%DA%A9%D8%B4%D8%AA%DB%8C-%D9%86%D8%A7%D9%82%D8%B6-%D9%85%D8%AD%D8%A7%D8%B5%D8%B1%D9%87-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%B7%DB%8C-%DB%B1%DB%B2-%D9%87%D9%81%D8%AA%D9%87-%DA%AF%D8%B0%D8%B4%D8%AA%D9%87-%D9%85%D9%86%D9%87%D8%AF%D9%85-%D8%B4%D8%AF%D9%86%D8%AF/", "summary": "فرماندهی مرکزی ارتش آمریکا، سنتکام، روز دوشنبه ۱۳ مهر اعلام کرد نی ر معرض فشار برای اعتراف قرار دارند، از دسترسی به وکیل انتخابی محروم می‌شوند. ساتو گفت همچنان گزارش‌هایی دریافت می‌کند که نشان می‌دهند وکلا از دسترسی به پرونده موکلان خود منع شده‌اند. به نوشته او، نقض تضمین‌های محاکمه عادلانه به متهمان محدود نمی‌شود و وکلایی که دفاع از این پرونده‌ها را می‌پذیرند نیز با ارعاب، تهدید، زندان و در برخی موارد، محرومیت از وکالت روبه‌رو شده‌اند. ساتو با اشاره به حکم اعدام هادی و فضل‌الله نیکبخت پس از جلسه‌ای مجازی که امکان دنبال‌کردن آن را نداشتند، و تایید حکم اعدام بنیامین نقدی با وجود حذف اتهام مجروح‌کردن ماموران، این پرونده‌ها را نمونه‌هایی از نقض دادرسی عادلانه دانست."}, {"source": "IranWire", "title": "مجلس برای ارائه آمار منتشر‌نشده به «کارگزار بیگانه» مجازات زندان تصویب کرد", "link": "https://iranwire.com/fa/news-1/158530-%D9%85%D8%AC%D9%84%D8%B3-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%A7%D8%B1%D8%A7%D8%A6%D9%87-%D8%A2%D9%85%D8%A7%D8%B1-%D9%85%D9%86%D8%AA%D8%B4%D8%B1%D9%86%D8%B4%D8%AF%D9%87-%D8%A8%D9%87-%DA%A9%D8%A7%D8%B1%DA%AF%D8%B2%D8%A7%D8%B1-%D8%A8%DB%8C%DA%AF%D8%A7%D9%86%D9%87-%D9%85%D8%AC%D8%A7%D8%B2%D8%A7%D8%AA-%D8%B2%D9%86%D8%AF%D8%A7%D9%86-%D8%AA%D8%B5%D9%88%DB%8C%D8%A8-%DA%A9%D8%B1%D8%AF/", "summary": "نمایندگان مجلس روز سه‌شنبه ۱۴ مهر، برای ارائه بدون مجوز اطلاعات و آمار رسمی منتشر نشده به «کارگزار بیگانه»، بیش از پنج تا ۱۰ سال زندان و ...", "date_str": "2026-10-06T08:31:57+00:00", "hash": "676efa24c92d6f71", "title_fa": "مجلس برای ارائه آمار منتشر‌نشده به «کارگزار بیگانه» مجازات زندان تصویب کرد", "summary_fa": "نمایندگان مجلس روز سه‌شنبه ۱۴ مهر، برای ارائه بدون مجوز اطلاعات و آمار رسمی منتشر نشده به «کارگزار بیگانه»، بیش از پنج تا ۱۰ سال زندان و ... به گزارش ایرنا، این مجازات در ماده ۲۰ طرح «مقابله با نفوذ بیگانگان» پیش‌بینی شده است که در جلسه مجازی مجلس به تصویب رسید. این ماده افرادی را شامل می‌شود که به‌واسطه شغل، سمت یا ماموریت قانونی خود به اطلاعات، گزارش‌ها، داده‌ها یا آمار رسمی منتشر نشده دسترسی دارند. کسانی که از طریق ارتباط حرفه‌ای با صاحبان مشاغل مرتبط از این اطلاعات مطلع شده‌اند نیز مشمول مصوبه می‌شوند. براساس متن مصوب، ارائه این اطلاعات به «کارگزار بیگانه» نیازمند دریافت مجوز قبلی از سامانه است. مجازات تعیین‌شده در صورتی اعمال می‌شود که در این طرح یا‌ قوانین دیگر، مجازات سنگین‌تری برای این اقدام پیش‌بینی نشده باشد. محکومان همچنین برای همیشه از اشتغال در شغلی که به‌واسطه آن به اطلاعات دسترسی داشته یا آن‌ها را ارائه کرده‌اند، محروم می‌شوند. ماده ۲۰ مشخص نمی‌کند چه اطلاعات و آماری «رسمی و منتشرنشده» محسوب می‌شوند. در متن طرح، «کارگزار بیگانه» نیز به‌گونه‌ای گسترده تعریف شده است؛ این عنوان دولت‌ها، نهادها، مؤسسه‌ها و سازمان‌های غیرایرانی و افرادی را شامل می‌شود که تحت حمایت، استخدام یا هدایت مستقیم یا غیرمستقیم آن‌ها هستند، چه در داخل ایران و چه خارج از کشور. براساس متن طرح، فعالیت با کارگزاران یا اتباع خارجی باید در «سامانه برخط ثبت، مدیریت و نظارت بر ارتباطات خارجی» ثبت شود. وزارت اطلاعات و سازمان اطلاعات سپاه نیز مسئول تهیه دستورالعمل‌هایی هستند که مشخص می‌کنند کدام فعالیت‌ها به مجوز نیاز دارند. مجلس پیش‌تر در ۲۵ مرداد، کلیات این طرح ۳۳ ماده‌ای را تصویب کرده بود. متن منتشرشده طرح، طیف گسترده‌ای از همکاری‌های علمی، دانشگاهی، فرهنگی و رسانه‌ای با نهادها و اشخاص خارجی را مشمول مقررات ثبت و دریافت مجوز می‌کند."}, {"source": "IranWire", "title": "بیانیه ۱۰ کشور آمریکایی علیه «فعالیت‌های تروریستی» جمهوری اسلامی و نیروهای نیابتی‌اش", "link": "https://iranwire.com/fa/news-1/158531-%D8%A8%DB%8C%D8%A7%D9%86%DB%8C%D9%87-%DB%B1%DB%B0-%DA%A9%D8%B4%D9%88%D8%B1-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7%DB%8C%DB%8C-%D8%B9%D9%84%DB%8C%D9%87-%D9%81%D8%B9%D8%A7%D9%84%DB%8C%D8%AA%D9%87%D8%A7%DB%8C-%D8%AA%D8%B1%D9%88%D8%B1%DB%8C%D8%B3%D8%AA%DB%8C-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D9%88-%D9%86%DB%8C%D8%B1%D9%88%D9%87%D8%A7%DB%8C-%D9%86%DB%8C%D8%A7%D8%A8%D8%AA%DB%8C%D8%A7%D8%B4/", "summary": "آمریکا و ۹ کشور دیگر قاره آمریکا روز دوشنبه ۱۳ مهر، با انتشار بیانیه‌ای مشترک، «فعالیت‌های تروریستی» منتسب به جمهوری اسلامی و نیروهای نی ...", "date_str": "2026-10-06T08:50:43+00:00", "hash": "bff564b7362b8b47", "title_fa": "بیانیه ۱۰ کشور آمریکایی علیه «فعالیت‌های تروریستی» جمهوری mary": "پلیس مبارزه با تروریسم بریتانیا می‌گوید یک شهروند بریتانیایی ۲۲ساله به ظن تدارک اقدامات تروریستی در ارتباط با حادثه‌ای نزدیک پایگاه هوایی فیرفورد بازداشت شده است.", "date_str": "2026-10-06T13:29:37+00:00", "hash": "983ac789dba9472c", "title_fa": "بازداشت یک شهروند بریتانیایی در ارتباط با حادثه پایگاه هوایی فرفورد", "summary_fa": "پلیس مبارزه با تروریسم بریتانیا می‌گوید یک شهروند بریتانیایی ۲۲ساله به ظن تدارک اقدامات تروریستی در ارتباط با حادثه‌ای نزدیک پایگاه هوایی فیرفورد بازداشت شده است. او روز سه‌شنبه در منطقه وست‌مینستر لندن، در چارچوب تحقیقات درباره حادثه ۲۷ سپتامبر نزدیک این پایگاه در گلاسترشر بازداشت شد. این هفتمین بازداشت در ارتباط با این حادثه است، اما تاکنون هیچ‌کس رسما متهم نشده است. پس از آنکه پلیس از حضور سه «خودروی مشکوک» نزدیک پایگاه مطلع شد، وضعیت «حادثه عمده» اعلام و ساکنان ده‌ها خانه تخلیه شدند. ویکی اوانز، هماهنگ‌کننده ارشد ملی پلیس مبارزه با تروریسم، گفت که تحقیقات همچنان ادامه دارد و پلیس «چندین مسیر تحقیقاتی» را دنبال می‌کند. پنج مرد ۲۳ تا ۲۵ساله، بامداد ۲۷ سپتامبر پس از گزارش حرکت خودروهایی به سوی پایگاه، در نزدیکی آن بازداشت شدند و سپس با قید وثیقه پلیس آزاد شدند. آنها ابتدا به ظن ارتکاب جرایم مرتبط با مواد منفجره و سپس به ظن تدارک اقدام تروریستی بازداشت شده بودند. پلیس آزادی آنها با قید وثیقه را «تصمیمی تحقیقاتی» توصیف کرد که «بر تجربه و راهبرد استوار» بوده است. مرد ششم، یک شهروند دوتابعیتی ایرانی‌ـ‌بریتانیایی ۲۵ساله، اول اکتبر در وست‌مینستر بازداشت و او نیز بعداً با قید وثیقه آزاد شد. نیروی هوایی آمریکا دهه‌هاست از پایگاه فرفورد، نزدیک روستای ولفورد، استفاده می‌کند. در ماه‌های اخیر، پس از موافقت بریتانیا با درخواست استفاده از فرفورد برای حملاتی که «دفاعی» علیه ایران توصیف شده‌اند، آمریکا بمب‌افکن‌های بی‌۱ و بی‌۵۲ را از این پایگاه به خاورمیانه اعزام کرده است. روز یکشنبه مشخص شد آمریکا بمب‌افکن‌هایش را از پایگاه خارج کرده و به آن کشور بازگردانده است. دونالد ترامپ، رئیس‌جمهور آمریکا، گفت که این هواپیماها به‌دلیل «برخی تهدیدها» علیه پایگاه منتقل شده‌اند، اما جزئیات مشخصی ارائه نکرد."}, {"source": "BBC Persian", "title": "درگیری بین معترضان و پلیس، با گسترش تظاهرات دانش‌آموزی در سراسر فرانسه", "link": "https://www.bbc.com/persian/articles/c69wzrg4jryro?at_medium=RSS&at_campaign=rss", "summary": "اعتراضات گسترده دانش‌آموزان دبیرستانی و دانشجویان در فرانسه که خواستار سرمایه‌گذاری بیشتر در مدارس هستند، در جریان است و ائتلافی از برخی اتحادیه‌های بزرگ نیز به آنها پیوسته‌اند. به گزارش رسانه‌های محلی، بزرگسالان از جمله والدین و فعالان اتحادیه‌ها با بستن بازوبندهای سفید گرد هم آمده‌اند تا با هدف «ایجاد یک منطقه حائل» از این نوجوانان حمایت کنند. دانش‌آموزان مسیر ورودی صدها مدرسه را مسدود کرده‌اند؛ در جریان این اعتراضات طی هفته گذشته، ۲۱۵ جوان و ۷۱۵ مامور پلیس مجروح و بیش از ۶۰۰۰ نفر بازداشت شده‌اند.", "date_str": "2026-10-06T12:17:09+00:00", "hash": "f92eb8cc2dfacc5a", "title_fa": "درگیری بین معترضان و پلیس، با گسترش تظاهرات دانش‌آموزی در سراسر فرانسه", "summary_fa": "اعتراضات گسترده دانش‌آموزان دبیرستانی و دانشجویان در فرانسه که خواستار سرمایه‌گذاری بیشتر در مدارس هستند، در جریان است و ائتلافی از برخی اتحادیه‌های بزرگ نیز به آنها پیوسته‌اند. به گزارش رسانه‌های محلی، بزرگسالان از جمله والدین و فعالان اتحادیه‌ها با بستن بازوبندهای سفید گرد هم آمده‌اند تا با هدف «ایجاد یک منطقه حائل» از این نوجوانان حمایت کنند. دانش‌آموزان مسیر ورودی صدها مدرسه را مسدود کرده‌اند؛ در جریان این اعتراضات طی هفته گذشته، ۲۱۵ جوان و ۷۱۵ مامور پلیس مجروح و بیش از ۶۰۰۰ نفر بازداشت شده‌اند. با گسترش تظاهرات دانش‌آموزی در سراسر فرانسه، معترضان آتش‌سوزی به راه انداختند و با پلیس درگیر شدند. اعتراضات گسترده دانش‌آموزان دبیرستانی و دانشجویان در فرانسه که خواستار سرمایه‌گذاری بیشتر در مدارس هستند، از صبح سه‌شنبه آغاز شده است و ائتلافی از برخی اتحادیه‌های بزرگ نیز به آنها پیوسته‌اند. اتحادیه دانش‌آموزان دبیرستانی، که یکی از برگزارکنندگان اصلی این اعتراضات است، اعلام کرد که ۲۰۰۰ دبیرستان در سراسر کشور تعطیل شده‌اند. دولت هم می‌گوید کلاس‌های درس در ۸۹۱ مدرسه در سراسر فرانسه، به‌طور کامل یا جزئی، به حالت تعلیق درآمده‌اند. در جریان اعتراضات طی هفته گذشته، دانش‌آموزان مسیر ورودی صدها مدرسه را مسدود کردند؛ ۲۱۵ جوان و ۷۱۵ مامور پلیس مجروح و بیش از ۶۰۰۰ نفر بازداشت شدند. خشم عمومی پس از آن شدت گرفت که روز دوشنبه دست یکی از دانش‌آموزان در جریان درگیری‌ها بر اثر انفجار قطع شد. پیش از آن هم در جریان موج اعتراضات، یک دانش‌آموز دیگر بر اثر اصابت کپسول گاز اشک‌آور به سرش مجروح شده بود. این حادثه در شهر شمالی لانس اتفاق افتاد؛ گزارش‌های ضدونقیضی وجود دارد مبنی بر اینکه آیا آن دانش‌آموز نارنجک صوتی (نارنجک گیج‌کننده) را که پلیس ضدشورش شلیک کرده بود از روی زمین برداشت یا اینکه نارنجک در نزدیکی او منفجر شد."}, {"source": "BBC Persian", "title": "آیا روسیه شیوع طاعون را پنهان می‌کند؟", "link": "https://www.bbc.com/persian/articles/c9vgr4pxn3jeo?at_medium=RSS&at_campaign=rss", "summary": "چند بیمارستان در استان ایرکوتسک روسیه، پس از مرگ یک کارمند آزمایشگاه بر اثر بیماری‌ که گمان می‌رود طاعون ریوی بوده باشد، بنا بر گزارش‌ها تحت قرنطینه قرار گرفته‌اند. مقام‌های روسیه هنوز رسما تایید نکرده‌اند که این مرگ با طاعون مرتبط بوده است و به نظر می‌رسد اطلاعات مربوط به این حادثه را به شدت کنترل می‌کنند. با این حال، گزارش‌ها درباره طاعون همچنان در فضای مجازی و رسانه‌های مستقل منتشر می‌شود و نگرانی‌ها را درباره احتمال شیوع گسترده‌تر این بیماری افزایش داده است.", "date_str": "2026-10-06T12:04:13+00:00", "hash": "cd6e14b52e67adf1", "title_fa": "آیا روسیه شیوع طاعون را پنهان می‌کند؟", "summary_fa": "چند بیمارستان در استان ایرکوتسک روسیه، پس از مرگ یک کارمند آزمایشگاه بر اثر بیماری‌ که گمان می‌رود طاعون ریوی بوده باشد، بنا بر گزارش‌ها تحت قرنطینه قرار گرفته‌اند. مقام‌های روسیه هنوز رسما تایید نکرده‌اند که این مرگ با طاعون مرتبط بوده است و به نظر می‌رسد اطلاعات مربوط به این حادثه را به شدت کنترل می‌کنند. با این حال، گزارش‌ها درباره طاعون همچنان در فضای مجازی و رسانه‌های مستقل منتشر می‌شود و نگرانی‌ها را درباره احتمال شیوع گسترده‌تر این بیماری افزایش داده است. در ۱۰ مهر ۱۴۰۵ (۲ اکتبر ۲۰۲۶)، کانال‌های روسی تلگرام، از جمله برخی کانال‌های مرتبط با نهادهای امنیتی، گزارش دادند که یکی از کارکنان یک موسسه مقابله با طاعون در شهر ایرکوتسک در سیبری بر اثر طاعون ریوی جان باخته است. بر اساس این گزارش‌ها، داریا شیپیلووای ۲۸ ساله در ۷ مهر ۱۴۰۵ (۲۹ سپتامبر ۲۰۲۶) به بیمارستانی در شهر شلخوف در منطقه ایرکوتسک منتقل شد و دو روز بعد درگذشت. پس از مرگ او، بیمارستان قرنطینه شد. حدود ۲۰۰ نفر که با شیپیلووا در تماس بودند نیز به قرنطینه منتقل شدند. رسانه‌ها چند احتمال را درباره نحوه ابتلای او به این بیماری مطرح کردند. بر اساس یک روایت، او پس از بازگشت از تایلند با طاعون ریوی در بیمارستان بستری شده بود. روایت دیگری می‌گفت هنگام کار در آزمایشگاه، به‌طور تصادفی لوله آزمایشی حاوی عامل بیماری‌زای طاعون را شکسته بود. گزارشی جداگانه نیز اعلام کرد که او به‌تازگی برای ماموریت کاری به بوریاتیا سفر کرده بود؛ منطقه‌ای که در نزدیکی مرز مغولستان یک کانون طبیعی طاعون در آن شناسایی شده بود. در ۱۲ مهر ۱۴۰۵ (۴ اکتبر ۲۰۲۶)، رسانه مستقل منطقه‌ای «لیودی بایکالا» گزارش داد که سه بیمارستان در ایرکوتسک و یک درمانگاه زایمان برای سه هفته قرنطینه شده‌اند. این رسانه به نقل از منبعی در بخش درمان گزارش داد که «پزشکان آشکارا درباره طاعون"}, {"source": "BBC Persian", "title": "کوبایی‌تبارهای ثروتمند آمریکا که در انتظار سقوط حکومت هاوانا هستند", "link": "https://www.bbc.com/persian/articles/cwg5j8414294o?at_medium=RSS&at_campaign=rss", "summary": "در خانه‌های مجلل و محافل ثروتمندان کوبایی‌تبار میامی، برخی از بانفوذترین تبعیدیان کوبایی از هم‌اکنون برای آنچه «روز پس از سقوط حکومت» در هاوانا می‌نامند برنامه‌ریزی می‌کنند. آن‌ها معتقدند بحران عمیق اقتصادی و فشارهای فزاینده بر کوبا می‌تواند زمینه تغییرات اساسی را فراهم کند و خود را برای بازگشت و سرمایه‌گذاری در این کشور آماده می‌دانند. اما در حالی که این گروه از آینده‌ای پس از حکومت کمونیستی سخن می‌گویند، بسیاری از تحلیلگران معتقدند تحقق چنین سناریویی همچنان با ابهام‌های جدی روبه‌رو است و کوبایی‌ها در داخل کشور بیش از هر چیز با کمبود غذا، سوخت، دارو و قطعی‌های مکرر برق دست‌وپنجه نرم می‌کنند.", "date_str": "2026-10-06T06:27:18+00:00", "hash": "0adf07c12cc5fe50", "title_fa": "کوبایی‌تبارهای ثروتمند آمریکا که در انتظار سقوط حکومت هاوانا هستند", "summary_fa": "در خانه‌های مجلل و محافل ثروتمندان کوبایی‌تبار میامی، برخی از بانفوذترین تبعیدیان کوبایی از هم‌اکنون برای آنچه «روز پس از سقوط حکومت» در هاوانا می‌نامند برنامه‌ریزی می‌کنند. آن‌ها معتقدند بحران عمیق اقتصادی و فشارهای فزاینده بر کوبا می‌تواند زمینه تغییرات اساسی را فراهم کند و خود را برای بازگشت و سرمایه‌گذاری در این کشور آماده می‌دانند. اما در حالی که این گروه از آینده‌ای پس از حکومت کمونیستی سخن می‌گویند، بسیاری از تحلیلگران معتقدند تحقق چنین سناریویی همچنان با ابهام‌های جدی روبه‌رو است و کوبایی‌ها در داخل کشور بیش از هر چیز با کمبود غذا، سوخت، دارو و قطعی‌های مکرر برق دست‌وپنجه نرم می‌کنند. در خانه مجلل یکی از مشهورترین جراحان پلاستیک میامی، مشرف به خلیج بیسکین، شماری از ثروتمندترین خانواده‌های کوبایی‌تبار فلوریدا گرد هم آمده‌اند. آن‌ها در چهارمین نشست اتاق ملی بازرگانی کوبایی‌های آمریکا، که به‌تازگی تاسیس شده است، جمع شده‌اند تا درباره چشم‌انداز خود برای آینده کوبا بحث کنند و به توافق برسند. با لیوان‌های رام در دست و ساعت‌های رولکس بر مچ، اینجا محفل خانواده‌های قدیمی و ثروتمند میامی است. افرادی با نام‌های خانوادگی شناخته‌شده کوبایی-آمریکایی، مانند باکاردی و بابون، کنار استخر درباره وضعیت اسفبار اقتصاد کوبا گفت‌وگو می‌کنند و تازه‌ترین زمزمه‌ها و شایعات سیاسی را با یکدیگر در میان می‌گذارند. خوان اومر سیکستو، رئیس اتاق بازرگانی کوبایی-آمریکایی گفت: «هدف از برگزاری این گردهمایی آن است که برجسته‌ترین کارآفرینان کوبایی-آمریکایی میامی-دید را زیر یک سقف جمع کنیم؛ و هدف نهایی این است که پس از سقوط حکومت، در کوبا حضور داشته باشیم.» مهمانان او اطمینان دارند که آن لحظه نزدیک است. این جامعه بانفوذ از تبعیدیان کوبایی از زمانی که فیدل کاسترو، رهبر درگذشته انقلاب کوبا، پس از به قدرت رسیدن در سال ۱۹۵۹ زمین‌هایشان را مصادره و شرکت‌های خانوادگی آن‌ها را ملی کرد، از حکومت کمونیستی این کشور بیزار بوده‌اند."}, {"source": "BBC Persian", "title": "چرا آمریکا بمب‌افکن‌های خود را ناگهان از بریتانیا خارج کرد؟", "link": "https://www.bbc.com/persian/articles/c3vgxw28wg1eo?at_medium=RSS&at_campaign=rss", "summary": "خبرنگار امور امنیتی ما می‌نویسد خروج گسترده بمب‌افکن‌های آمریکایی از بریتانیا، از نگرانی‌های فزاینده در پنتاگون حکایت دارد.", "date_str": "2026-10-06T07:13:28+00:00", "hash": "8f9727ebac4b87c4", "title_fa": "چرا آمریکا بمب‌افکن‌های خود را ناگهان از بریتانیا خارج کرد؟", "summary_fa": "خبرنگار امور امنیتی ما می‌نویسد خروج گسترده بمب‌افکن‌های آمریکایی از بریتانیا، از نگرانی‌های فزاینده در پنتاگون حکایت دارد. خروج غیرمنتظره و گسترده بمب‌افکن‌های سنگین آمریکا روز یکشنبه چنان ناگهانی رخ داد که همه را به این فکر واداشته است که چه عاملی باعث آن شده است. جی‌دی ونس، معاون رئیس‌جمهور آمریکا، گفت خروج این بمب‌افکن‌ها «از سر احتیاط بسیار زیاد» انجام شده است و افزود که به باور واشنگتن، ایران همان کاری را می‌کند که «۴۹ سال است انجام می‌دهد؛ یعنی دست زدن به اقدامات تروریستی علیه آمریکا و بسیاری دیگر از مردم.» با این حال، برخی این اقدام را نه «احتیاط فراوان»، بلکه «هراس فراوان» توصیف کرده‌اند. در هفت ماه گذشته، بمب‌افکن‌های بی-۱ لنسر آمریکا و دیگر هواپیماها از پایگاه فرفورد برای حمله به محل‌های پرتاب موشک‌های ایران به پرواز درمی‌آمدند. در ماه ژوئیه، ایران تهدید کرد هر کشوری که چنین امکانی را در اختیار آمریکا قرار دهد، «هدفی مشروع» تلقی خواهد شد. سپس در ۲۷ سپتامبر، پس از آن‌که پنج مرد بریتانیایی به دلیل مشاهده رفتار مشکوک با سه ون سفیدرنگ خود در دل شب و در نزدیکی حصار پایگاه هوایی بازداشت شدند و بعدا با قرار وثیقه آزاد شدند، وضعیت اضطراری اعلام شد. در آخر هفته، یک شهروند دوتابعیتی بریتانیایی-ایرانی به ظن تدارک اقدامات تروریستی بازداشت شد. او نیز بعدا با قرار وثیقه آزاد شد. اکنون ۱۲ فروند بمب‌افکن بی-۱ که از نظر ارزش و اهمیت راهبردی بسیار مهم‌اند، به‌صورت دسته‌جمعی پایگاه را ترک کرده‌اند؛ آن هم ظاهرا چنان شتاب‌زده که بنا بر گزارش‌ها، هواپیماهای سوخت‌رسانی هوایی که قرار بود برای بازگرداندن آنها به پایگاه‌هایشان در خاک اصلی آمریکا بر فراز اقیانوس اطلس به آنها سوخت‌رسانی کنند، هنوز در حال سوخت‌گیری بودند، در حالی که به خدمه بمب‌افکن‌های بی-۱ لنسر دستور داده شده بود فورا برای برخاستن آماده شوند."}, {"source": "BBC Persian", "title": "وعده محافظه‌کاران برای ساخت «گنبد آهنین بریتانیا» با سرمایه‌گذاری ۱۰ میلیارد پوندی", "link": "https://www.bbc.com/persian/articles/cxe8ry45z080o?at_medium=RSS&at_campaign=rss", "summary": "حزب محافظه‌کار بریتانیا با اشاره به افزایش تهدیدهای موشکی و پهپادی و تجربه جنگ در اوکراین و خاورمیانه، وعده داده است در صورت پیروزی در انتخابات عمومی آینده، ۱۰ میلیارد پوند در ساخت سامانه‌ای پدافندی موسوم به «سپر بریتانیا» سرمایه‌گذاری کند. کمی بیدناک، رهبر این حزب، می‌گوید که پیامدهای جنگ ایران برای کشورهای خلیج فارس نیز در تدوین این طرح نقش داشته است.", "date_str": "2026-10-06T09:25:55+00:00", "hash": "6a1d51cd4e941530", "title_fa": "وعده محافظه‌کاران برای ساخت «گنبد آهنین بریتانیا» با سرمایه‌گذاری ۱۰ میلیارد پوندی", "summary_fa": "حزب محافظه‌کار بریتانیا با اشاره به افزایش تهدیدهای موشکی و پهپادی و تجربه جنگ در اوکراین و خاورمیانه، وعده داده است در صورت پیروزی در انتخابات عمومی آینده، ۱۰ میلیارد پوند در ساخت سامانه‌ای پدافندی موسوم به «سپر بریتانیا» سرمایه‌گذاری کند. کمی بیدناک، رهبر این حزب، می‌گوید که پیامدهای جنگ ایران برای کشورهای خلیج فارس نیز در تدوین این طرح نقش داشته است. این حزب می‌گوید که طرح موسوم به «سپر بریتانیا» شبکه‌ای یکپارچه از رادارها، سامانه‌های فرماندهی و کنترل و موشک‌های رهگیر خواهد بود که از زیرساخت‌های حیاتی، پایگاه‌های نظامی و قلمروهای تحت حاکمیت بریتانیا در برابر تهدیدهای پیشرفته محافظت می‌کند. قرار است جیمز کارتلیج، وزیر دفاع دولت در سایه، روز سه‌شنبه در سخنرانی خود در نشست سالانه محافظه‌کاران، این طرح را «مهم‌ترین ارتقای پدافند هوایی بریتانیا در چند نسل اخیر» توصیف کند. در مقابل، وس استریتینگ، وزیر دفاع، عملکرد محافظه‌کاران در دفاع از بریتانیا طی ۱۴ سال حضورشان در قدرت را «بسیار ضعیف» خواند و گفت: «آنها به بریتانیا یک عذرخواهی بدهکارند، نه یک موعظه دیگر.» کمی بیدناک، رهبر محافظه‌کاران، در گفت‌وگو با برنامه صبحگاهی بی‌بی‌سی گفت بودجه این طرح طی ده سال تامین خواهد شد و سالانه یک میلیارد پوند به آن اختصاص می‌یابد. او تاکید کرد این سامانه «دقیقاً همان چیزی که اسرائیل دارد» نخواهد بود و بریتانیا باید برای محافظت از خود در برابر موشک‌ها و پهپادهای کشورهای متخاصم، از حالا به آینده فکر کند. بیدناک گفت هنگام تدوین این طرح به سخنان چهره‌هایی مانند ولودیمیر زلنسکی، رئیس‌جمهور اوکراین، گوش داده و پیامدهای جنگ ایران برای کشورهای خلیج فارس را دنبال کرده است. او گفت: «شیوه جنگ در حال تغییر است. دیگر فقط موشک‌هایی نیستند که از فاصله‌های بسیار دور می‌آیند؛ آنچه با فناوری پهپادی می‌بینیم این است که افراد می‌توانند آن‌قدر نزدیک شوند که پهپادهایی را به سوی بریتانیا پرتاب کنند.»"}, {"source": "BBC Persian", "title": "از سربازان مجروح تا قبض‌های گران‌تر؛ هزینه‌های جنگ برای آمریکایی‌ها", "link": "https://www.bbc.com/persian/articles/cv62y44p76yxo?at_medium=RSS&at_campaign=rss", "summary": "هزینه‌های جنگ آمریکا با ایران به یکی از موضوعات مهم مورد بحث در ایالات متحده تبدیل شده است. از یک طرف شهروندان نگرانند که این جنگ هزینه‌های زندگیشان را افزایش داده و از سوی دیگر گروهی از نظامیان آمریکایی می‌گویند آن طور که باید دولت به آنها که جانشان در این جنگ به خطر افتاده رسیدگی نکرده است.", "date_str": "2026-10-06T07:23:55+00:00", "hash": "235e3bc669cc4749", "title_fa": "از سربازان مجروح تا قبض‌های گران‌تر؛ هزینه‌های جنگ برای آمریکایی‌ها", "summary_fa": "هزینه‌های جنگ آمریکا با ایران به یکی از موضوعات مهم مورد بحث در ایالات متحده تبدیل شده است. از یک طرف شهروندان نگرانند که این جنگ هزینه‌های زندگیشان را افزایش داده و از سوی دیگر گروهی از نظامیان آمریکایی می‌گویند آن طور که باید دولت به آنها که جانشان در این جنگ به خطر افتاده رسیدگی نکرده است. خبرگزاری آسوشیتدپرس، در گزارشی با گروهی از سربازان آمریکایی مصاحبه کرده که در یکی از حملات ایران مجروح شده‌اند. آنها در روز اول ماه مارس در حمله‌ای به پایگاه آمریکایی‌ها در کویت مجروح شدند. این سربازان و خانواده‌هایشان گفته‌اند که «شدت جراحت‌ها جدی گرفته نشده و برای رساندن مجروحان به بیمارستان برنامه‌ریزی خوبی انجام نشده بود». در این گزارش گفته شده که برنامه درستی برای ادامه درمان این سربازان وجود نداشته است. وزارت دفاع آمریکا به این خبرگزاری گفته که درمان‌ مجروحان «به خوبی انجام گرفته است.» اما ۹ سرباز آمریکایی که هنوز در خدمت ارتش هستند در گفت‌وگوهایی با این خبرگزاری از وضعیت درمانی خود گفته‌اند. یکی از آنها گفته است که آسیب به یکی از رگ‌هایش باعث شده بود احتمال سکته کردنش بالا برود. اما به گفته او ارتش این وضعیت را جدی نگرفت و او را برای درمان به بیمارستان ارتش آمریکا در آلمان اعزام نکرد. سرباز دیگر گفته است ترکشی از سرش بیرون آوردند و با این وضعیت چهار ماه منتظر ماند تا جواب ام‌آر‌آی او برسد. سربازان مجروح به دلیل شدت حملات ایران نمی‌توانستند زود از کویت خارج شوند. به گفته آنها، پس از انتقال نیز ناچار بودند با همان جراحات در هواپیماهای باربری و روی کف هواپیما تا آلمان سفر کنند و وقتی هم به آنجا رسیدند به دلیل «مشکلات ثبتی» نامشان در میان فهرست مجروحان نبوده و مجبور شدند از خدمات پزشکی آزاد در آلمان استفاده کنند. یکی از این سربازان که پیشتر در جنگ‌های"}, {"source": "BBC Persian", "title": "آیا شاهکارهایی به ارزش بیش از ۱۳۵ میلیون دلار زیر تخت یک زن بازنشسته پیدا شده بودند؟", "link": "https://www.bbc.com/persian/articles/c209vpkl40wo?at_medium=RSS&at_campaign=rss", "summary": "اخیرا سه نقاشی رنگ‌روغن که تاکنون ناشناخته بودند و به کازیمیر مالویچ، هنرمند پیشگام مکتب آوانگارد، نسبت داده می‌شوند، در یک موزه عمومی در بخارست به نمایش درآمدند. اگر اصالت آن‌ها تأیید شود، ارزششان می‌تواند از ۱۰۰ میلیون پوند فراتر رود. با این حال، یکی از پژوهشگران برجسته آثار مالویچ می‌گوید روایت مطرح‌شده درباره منشأ این آثار با ابهام‌ها و پرسش‌های جدی روبه‌رو است.", "date_str": "2026-10-06T03:01:22+00:00", "hash": "70b5fbf1c2ed52da", "title_fa": "آیا شاهکارهایی به ارزش بیش از ۱۳۵ میلیون دلار زیر تخت یک زن بازنشسته پیدا شده بودند؟", "summary_fa": "اخیرا سه نقاشی رنگ‌روغن که تاکنون ناشناخته بودند و به کازیمیر مالویچ، هنرمند پیشگام مکتب آوانگارد، نسبت داده می‌شوند، در یک موزه عمومی در بخارست به نمایش درآمدند. اگر اصالت آن‌ها تأیید شود، ارزششان می‌تواند از ۱۰۰ میلیون پوند فراتر رود. با این حال، یکی از پژوهشگران برجسته آثار مالویچ می‌گوید روایت مطرح‌شده درباره منشأ این آثار با ابهام‌ها و پرسش‌های جدی روبه‌رو است. موزه‌ای هم که این آثار را به نمایش گذاشت، از اعلام این‌که آیا نقاشی‌ها را اصیل می‌داند یا نه، خودداری کرد. کازیمیر مالویچ، متولد اوکراین، از تاثیرگذارترین هنرمندان قرن بیستم محسوب می‌شود. در بازار هنر، آثار او بیش از هر هنرمند اوکراینی یا روسی دیگری ارزش دارند و یکی از نقاشی‌هایش در سال ۲۰۱۸ به قیمت رکوردشکن ۸۵ میلیون دلار فروخته شد. به گفته یانیو کوهن، بازرگان اسرائیلی ساکن بخارست و مالک این آثار، سه تابلوی ناشناخته منسوب به مالویچ در جریان اسباب‌کشی یک بازنشسته اسرائیلی به نام اوا لواندو در سال ۲۰۲۳، زیر تشک تخت او پیدا شدند. این بازنشسته، مادربزرگ همسر آقای کوهن است و این آثار را به او واگذار کرده بود. این سه تابلو با عنوان‌های «ترکیب سوپرماتیستی با مستطیل سبز و سیاه» (۱۹۱۸)، «ترکیب کوبوفوتوریستی» (۱۹۱۲ تا ۱۹۱۳) و «ترکیب سوپرماتیستی با مربع قرمز و مثلث سبز» (۱۹۱۵ تا ۱۹۱۶) شناخته می‌شوند و در موزه ملی هنر معاصر رومانی به نمایش درآمدند. هزینه برگزاری این نمایشگاه را کلینیک دندانپزشکی متعلق به آقای کوهن تامین کرد. با این حال، در دنیای هنر همچنان تردیدهای زیادی درباره این آثار وجود دارد. کنستانتین آکینشا، پژوهشگر اوکراینی-آمریکایی، به بی‌بی‌سی گفت اسناد و مدارکی که پیشینه این آثار را ثابت کرده و آن‌ها را به مالویچ مرتبط می‌کنند، کامل نیستند. این مورخ هنر و متصدی نمایشگاه، که از نویسندگان راهنمای پژوهش درباره منشأ آثار هنریِ انجمن موزه‌های آمریکا نیز بوده است، گفت: «این سه اثری که"}, {"source": "BBC Persian", "title": "ترامپ: یک تهدید مشخص علت خارج‌کردن فوری بمب‌افکن‌ها از بریتانیا بود", "link": "https://www.bbc.com/persian/articles/c5x2v8lmj9wlo?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ، رئیس جمهور آمریکا، می‌گوید یک تهدید مشخص جدید موجب شده آمریکا تمامی بمب‌افکن‌های خود را از پایگاه هوایی فرفورد بریتانیا خارج کند. این سخنان آقای ترامپ به نوعی تاییدی است بر گزارش‌های رسانه‌های آمریکا که گفته بودند یک تهدید جدید و جدا از حادثه امنیتی هفته گذشته در نزدیکی پایگاه فرفورد، علت جابجایی بمب‌افکن‌های غول‌پیکر آمریکا بوده است.", "date_str": "2026-10-05T23:14:24+00:00", "hash": "800c492973f136f3", "title_fa": "ترامپ: یک تهدید مشخص علت خارج‌کردن فوری بمب‌افکن‌ها از بریتانیا بود", "summary_fa": "دونالد ترامپ، رئیس جمهور آمریکا، می‌گوید یک تهدید مشخص جدید موجب شده آمریکا تمامی بمب‌افکن‌های خود را از پایگاه هوایی فرفورد بریتانیا خارج کند. این سخنان آقای ترامپ به نوعی تاییدی است بر گزارش‌های رسانه‌های آمریکا که گفته بودند یک تهدید جدید و جدا از حادثه امنیتی هفته گذشته در نزدیکی پایگاه فرفورد، علت جابجایی بمب‌افکن‌های غول‌پیکر آمریکا بوده است. آقای ترامپ روز دوشنبه در گفت‌وگو با گروهی از خبرنگاران در خارج از کاخ سفید، در پاسخ به این پرسش که آیا یک «تهدید مشخص» باعث شده آمریکا بمب‌افکن‌های خود را از این پایگاه خارج کند، گفت: «بله، فکر می‌کنم می‌توانیم این را بگوییم. آنها تصادفی پرواز نکردند.» «تهدیدهایی وجود داشت. و به‌جای اینکه دشمن را وسوسه کنیم، دشمن را گیر می‌اندازیم و شکستش می‌دهیم. اما چرا باید آنها را آنجا نگه داریم؟ بنابراین آنها را کمی جابه‌جا کردیم؛ البته نه خیلی دور.» آقای ترامپ افزود که واشنگتن «در واقع افرادی را که این تهدید را مطرح کرده‌اند می‌شناسد»، اما مشخص نکرد منظورش چه کسانی هستند. او در پاسخ به پرسشی درباره احتمال ارتباط این تهدید با ایران، گفت این تهدید «به ایران مرتبط می‌شود». این در حالی است که ساعتی قبل از آن، مارکو روبیو به خبرنگاران گفته بود که خبرنگاران نباید فقط روی حادثه امنیتی نزدیک پایگاه فرفورد تمرکز کنند بلکه جابجایی بمب‌افکن‌ها، می‌تواند به چرخش معمول نیروها و تجهیزات مرتبط بوده باشد. جی دی ونس هم روز دوشنبه و پیش از سفر به آلاسکا گفت خارج کردن تمامی بمب‌افکن‌های آمریکایی از پایگاه هوایی فرفورد بریتانیا برای «احتیاط بیشتر» پس از حادثه امنیتی هفته گذشته در نزدیکی این پایگاه بوده است. اظهارات آقای ترامپ و معاون او در حالی است که اوایل روز دوشنبه، سخنگوی دفتر نخست‌وزیری بریتانیا تأکید کرده بود که پایگاه هوایی فرفورد ایمن است و به اظهارات هفته گذشته دونالد ترامپ اشاره کرده بودکه طی"}, {"source": "BBC Persian", "title": "معاون ترامپ درباره خروج بمب‌افکن‌های آمریکا از بریتانیا: از روی «احتیاط بیشتر» انجام شد", "link": "https://www.bbc.com/persian/articles/c9vgrlj522veo?at_medium=RSS&at_campaign=rss", "summary": "جی‌دی ونس، معاون رئیس جمهور ایالات متحده گفته است اینکه تمام بمب‌افکن‌های خود را از پایگاه نیروی هوایی سلطنتی فرفورد بریتانیا خارج کرده از روی «احتیاط بیشتر» انجام شده است.", "date_str": "2026-10-05T18:45:03+00:00", "hash": "c1292653f9149721", "title_fa": "معاون ترامپ درباره خروج بمب‌افکن‌های آمریکا از بریتانیا: از روی «احتیاط بیشتر» انجام شد", "summary_fa": "جی‌دی ونس، معاون رئیس جمهور ایالات متحده گفته است اینکه تمام بمب‌افکن‌های خود را از پایگاه نیروی هوایی سلطنتی فرفورد بریتانیا خارج کرده از روی «احتیاط بیشتر» انجام شده است. ساعاتی پیش از این مارکو روبیو، وزیر خارجه آمریکا، گفته بود: «ما آنچه هفته گذشته اتفاق افتاد را ثبت و بررسی کرده‌ایم. من این دو موضوع را مستقیماً به هم مرتبط نمی‌کنم. تنها دلیل اینکه شما روی تعداد هواپیماهای حاضر در پایگاه تمرکز کرده‌اید، تهدیدی است که هفته گذشته رخ داد؛ اما جابه‌جایی و چرخش نیروها و انتقال تجهیزات به نقاط مختلف جهان، اتفاق غیرمعمولی نیست.» این پایگاه نظامی در مرکز حادثه‌ای امنیتی قرار دارد که پلیس ضدتروریسم در حال بررسی آن است. بمب‌افکن‌های سنگین و استراتژیک آمریکا در اروپا در این پایگاه مستقر بودند. نیروی هوایی آمریکا از این پایگاه در جنگ با ایران استفاده کرده است. در حادثه امنیتی فرفورد، ابتدا پنج مرد به ظن جرایم تروریستی در نزدیکی پایگاه بازداشت و بعد با قرار وثیقه آزاد شدند. مرد ششم، یک تبعه بریتانیایی-ایرانی، هم بعد از آن پنج نفر بازداشت اما او هم با قرار وثیقه آزاد شد. منابع دولتی بریتانیا پیش از این، اینکه تصمیم آمریکا برای خروج بمب بافکن‌هایش در واکنش به حادثه در پایگاه هوایی فرفورد بوده است، را رد نکرده‌اند. بر اساس گزارش‌ها دستکم یکی از این هواپیماها که ممکن بود ماه‌ها در این پایگاه مستقر باشد، هفته گذشته به آنجا رسیده بود. یک مقام پنتاگون یکشنبه، ۴ اکتبر (۱۲ مهر)، در بیانیه‌ای تایید کرد که بمب‌افکن‌ها را که گمان می‌رود حدود ۱۲ بمب‌افکن بی-۱ باشند، از این پایگاه به مقرهای اصلی در آمریکا منتقل کرده است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. وبسایت‌های ردیابی نشان داده‌اند که بمب‌افکن‌های بی-۱ روز یکشنبه از پایگاه هوایی فرفورد بریتانیا به پرواز درآمدند."}, {"source": "BBC Persian", "title": "روسیه با حمله به کارخانه‌های فولاد در پی شکستن ستون فقرات اقتصاد اوکراین است", "link": "https://www.bbc.com/persian/articles/c5gmrmw8z0j1o?at_medium=RSS&at_campaign=rss", "summary": "چندین حمله موشکی روسیه، فعالیت کارخانه فولاد زاپوریژاستال، یکی از بزرگ‌ترین مراکز صنعتی اوکراین، را متوقف کرده است. مدیران این مجتمع می‌گویند بخش عمده تجهیزات و زیرساخت‌های آن ویران شده و هنوز مشخص نیست که آیا این کارخانه بار دیگر به چرخه تولید بازخواهد گشت یا نه.", "date_str": "2026-10-05T22:20:52+00:00", "hash": "1414ba487f39bf07", "title_fa": "روسیه با حمله به کارخانه‌های فولاد در پی شکستن ستون فقرات اقتصاد اوکراین است", "summary_fa": "چندین حمله موشکی روسیه، فعالیت کارخانه فولاد زاپوریژاستال، یکی از بزرگ‌ترین مراکز صنعتی اوکراین، را متوقف کرده است. مدیران این مجتمع می‌گویند بخش عمده تجهیزات و زیرساخت‌های آن ویران شده و هنوز مشخص نیست که آیا این کارخانه بار دیگر به چرخه تولید بازخواهد گشت یا نه. دنیس، مانند هزاران نفر دیگر از ساکنان زاپوریژیا، سال‌ها در کارخانه فولاد محلی زاپوریژستال کار کرده است. این کارخانه نسل‌ها بزرگ‌ترین و پردرآمدترین منبع اشتغال در این شهر مهم اوکراین بوده است. دنیس می‌گوید: «زاپوریژستال فقط یک شرکت بزرگ نیست، قلب شهر است.» اما پس از مجموعه‌ای از حملات موشکی روسیه، این قلب از تپش ایستاده است. این کارخانه عظیم که ۸۵۰۰ نفر را به کار گرفته بود، پس از چهار موج حمله روسیه، دو حمله در اوت ۲۰۲۶ و دو حمله در سپتامبر ۲۰۲۶، فعالیت خود را برای مدتی نامعلوم متوقف کرد. دنیس می‌گوید: «تقریبا تمام تجهیزات به‌طور کامل نابود شده‌اند. هیچ پنجره‌ای باقی نمانده و سقف‌ها سوراخ شده‌اند. کوره‌های بلند تقریبا به‌طور کامل از بین رفته‌اند.» به گفته اولکساندر میروننکو، مدیر عملیات شرکت مت‌اینوست که مالک این کارخانه فولاد است، روسیه در مجموع ۱۷ موشک به زاپوریژستال شلیک کرد. هشت کارگر کشته و ۳۱ نفر زخمی شدند. اولکساندر میروننکو به بی‌بی‌سی مانیتورینگ می‌گوید: «اکنون در حال آواربرداری هستیم و تلاش می‌کنیم برای بازسازی برنامه‌ریزی کنیم.» اما در حال حاضر اصلا مشخص نیست که زاپوریژستال هرگز دوباره بتواند فعالیت کند یا نه. کارزار مداوم حملات هوایی روسیه علیه کارخانه‌های متالورژی اوکراین اوت ۲۰۲۶ آغاز شد. تاکنون همه آن‌ها هدف قرار گرفته‌اند و برخی چندین بار مورد حمله واقع شده‌اند. این صنعت یکی از بخش‌های کلیدی اقتصاد اوکراین است و به همین دلیل هدفی جذاب برای روسیه به شمار می‌رود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید."}, {"source": "BBC Persian", "title": "نوبل پزشکی ۲۰۲۶ را مبتکران اپتوژنتیک بردند", "link": "https://www.bbc.com/persian/articles/c6gelyw1pjw1o?at_medium=RSS&at_campaign=rss", "summary": "کارل دایسروت، روانپزشک و متخصص مغز و اعصاب آمریکایی، و همکاران آلمانی او، پیتر هگمان و گئورگ ناگل، به‌دلیل فعالیت‌هایشان در زمینه اپتوژنتیک برنده جایزه نوبل فیزیولوژی و پزشکی امسال شدند. پژوهش آنها در اپتوژنتیک به درک بهتر سازوکارهای درونی مغز و کارکرد ذهن کمک کرده است.", "date_str": "2026-10-05T15:17:30+00:00", "hash": "926a718e3ae51bf5", "title_fa": "نوبل پزشکی ۲۰۲۶ را مبتکران اپتوژنتیک بردند", "summary_fa": "کارل دایسروت، روانپزشک و متخصص مغز و اعصاب آمریکایی، و همکاران آلمانی او، پیتر هگمان و گئورگ ناگل، به‌دلیل فعالیت‌هایشان در زمینه اپتوژنتیک برنده جایزه نوبل فیزیولوژی و پزشکی امسال شدند. پژوهش آنها در اپتوژنتیک به درک بهتر سازوکارهای درونی مغز و کارکرد ذهن کمک کرده است. کمیته نوبل از این سه نفر برای بنیانگذاری عصر جدیدی در علوم اعصاب تقدیر کرد با معلوم کردن کردن چگونگی روشن و خاموش کردن مدارهای عصبی مربوط با «خاطرات، احساسات، و رفتارهای خاص مرتبط با اختلالات عصبی و روانپزشکی.» کمیته نوبل گفت: «اپتوژنتیک تغییری بنیادین در درک ما از مغز ایجاد کرد.» «اپتوژنتیک هر روز کشفیات جدیدی به همراه می‌آورد و به حل یکی از معماهای بزرگ بشریت کمک می‌کند: اینکه مغز شگفت‌انگیز ما چگونه کار می‌کند.» همچنین ۹۰۰ هزار پوند (۱۲ میلیون کرون سوئد) جایزه بین این سه نفر نقسیم خواهد شد. اپتوژنتیک روشی است برای مطالعه سلول با استفاده از خاصیت پروتئینی به نام اُپسین که از یک جلبک گرفته شده است. اُپسین در تابش نوری خاص تغییر شکل می‌دهد. یک نوع به نام رُدوپسین با نور آبی تغییر شکل می‌دهد و یک نوع دیگر آن به نام هالوپسین با نور زرد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. نورون (سلول عصبی) مثل هر سلول دیگری با تغییر ولتاژ غشاء بیرونی یا تغییر بار الکتریکی داخلش فعال (روشن) یا غیرفعال (خاموش) می‌شود. پژهشگران ژن تولید اُپسین را در نوعی جلبک کشف کردند. بعد با استفاده از مهندسی ژنتیک یک ویروس بی‌خطر را دستکاری کردند که این ژن را وارد سلول کند. این ژن دستور تولید اُپسین را می‌دهد که در غشاء سلول می‌نشیند. وقتی پژوهشگران نور خاص را به سلول می‌تابانند اپسین تغییر شکل می‌دهد و این باعث تغییر در نوع تبادل بار الکتریکی (یون) بین داخل و"}, {"source": "BBC Persian", "title": "در پنج قاره دنیا زنان باردار و نوزادان بیش از پیش در خطر گرمایش زمین قرار گرفته‌اند", "link": "https://www.bbc.com/persian/articles/ck5yn8z3m8g5o?at_medium=RSS&at_campaign=rss", "summary": "مادران باردار و نوزادان در پنج قاره دنیا بیش از پیش در معرض گرمای شدید قرار دارند و رئیس تغییرات اقلیمی سازمان ملل متحد امروز در این باره هشدار داد. سایمون استیل در پیش‌نشست کنفرانس اقلیمی سازمان ملل (کاپ) در نادی در فیجی، به یک نظرسنجی جدید اشاره کرد که نشان می‌دهد بیش از دو سوم متخصصان حوزه سلامت در پنج قاره دنیا در پنج سال گذشته زنان باردار و نوزادان را برای عوارض گرمای شدید درمان کرده‌اند. او گفت که افزایش دما به معنای «افزایش خطر در دوران بارداری» است.", "date_str": "2026-10-05T14:50:21+00:00", "hash": "876191e85bd4b53e", "title_fa": "در پنج قاره دنیا زنان باردار و نوزادان بیش از پیش در خطر گرمایش زمین قرار گرفته‌اند", "summary_fa": "مادران باردار و نوزادان در پنج قاره دنیا بیش از پیش در معرض گرمای شدید قرار دارند و رئیس تغییرات اقلیمی سازمان ملل متحد امروز در این باره هشدار داد. سایمون استیل در پیش‌نشست کنفرانس اقلیمی سازمان ملل (کاپ) در نادی در فیجی، به یک نظرسنجی جدید اشاره کرد که نشان می‌دهد بیش از دو سوم متخصصان حوزه سلامت در پنج قاره دنیا در پنج سال گذشته زنان باردار و نوزادان را برای عوارض گرمای شدید درمان کرده‌اند. او گفت که افزایش دما به معنای «افزایش خطر در دوران بارداری» است. «گرمای شدید ناشی از تغییرات اقلیمی به‌طرز فزاینده‌ای با زایمان زودرس، مرده‌زایی، کم‌وزنی نوزاد، و عوارض برای مادران مرتبط است.» «تصویر روشن و بسیار نگران‌کننده است: با تشدید گرما، بارداری و زایمان یک گسل جدید در بحران جهانی تغییرات اقلیمی شده‌ است؛ گسلی بالقوه مرگبار.» «این گسل نباید به شکاف عمیق دیگری از رنج و نابرابری و بی‌عدالتی ناشی از تغییرات اقلیمی تبدیل شود.» نظرسنجی که آقای استیل به آن اشاره کرد از ۱۰۰۰ ماما و پزشک در بریتانیا، استرالیا، هند، برزیل و زیمبابوه، به سفارش بنیاد خیریه ولکام انجام شده است. رئیس این بنیاد، جولیا گیلارد، نخست‌وزیر پیشین استرالیا، در بیانیه‌ای گفت که در نتیجه تغییرات اقلیمی، مادران و نوزادان بیش از پیش در معرض خطر قرار گرفته‌اند: خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. «گرمای شدید قاتل نامرئی است اما زنان باردار نباید نامرئی باشند.» این نظرسنجی نشان داد که تقریبا همه ماماها و پزشکان از مادران یا نوزادانی مراقبت کرده‌اند که از آثار گرمای شدید رنج می‌بردند. حدود یک‌سوم پاسخ‌دهندگان گفتند مواردی از وزن کم هنگام تولد یا عقب افتادن رشد، مشکلات تغذیه و کم‌آبی یا بیماری‌های مرتبط با گرما را مشاهده کرده‌اند که به باور آنها همگی ناشی از گرمای شدید بودند."}, {"source": "Radio Farda", "title": "یک فیزیکدان بلژیکی-آمریکایی برای «ذرات شبح‌گون» برندهٔ جایزهٔ نوبل فیزیک ۲۰۲۶ شد", "link": "https://www.radiofarda.com/a/ghost-particle-hunter-francis-halzen-wins-2026-nobel-physics-prize/33871312.html", "summary": "فرانسیس هالزن دریافت که یخ‌های قطب جنوب می‌توانند برای ردیابی نوترینوها به کار روند؛ ذراتی که گاهی به‌دلیل عبورشان از زمین و بدن انسان، «ذرات شبح‌گون» نامیده می‌شوند.", "date_str": "2026-10-06T11:21:40+00:00", "hash": "99d8dcab2aecc1e4", "title_fa": "یک فیزیکدان بلژیکی-آمریکایی برای «ذرات شبح‌گون» برندهٔ جایزهٔ نوبل فیزیک ۲۰۲۶ شد", "summary_fa": "فرانسیس هالزن دریافت که یخ‌های قطب جنوب می‌توانند برای ردیابی نوترینوها به کار روند؛ ذراتی که گاهی به‌دلیل عبورشان از زمین و بدن انسان، «ذرات شبح‌گون» نامیده می‌شوند. یک فیزیکدان بلژیکی-آمریکایی روز سه‌شنبه ۱۴ مهر به‌دلیل کار پیشگامانه‌اش در ایجاد یک رصدخانه برای شناسایی برخی از گریزان‌ترین ذرات جهان، یعنی نوترینوهای پرانرژی، و چگونگی شکل‌گیری آن‌ها، برندهٔ جایزهٔ نوبل فیزیک ۲۰۲۶ شد. فرانسیس هالزن در تحقیقات خود دریافت که یخ‌های قطب جنوب می‌توانند برای ردیابی نوترینوها به کار روند؛ ذراتی که گاهی به‌دلیل عبورشان از زمین و بدن انسان بی‌آن‌که اثری بر جا بگذارند، «ذرات شبح‌گون» نامیده می‌شوند و تنها در مواردی بسیار نادر با ماده برهم‌کنش دارند. اِوا اولسون از آکادمی سلطنتی علوم سوئد در یک نشست خبری گفت: «این پیام‌آوران، اطلاعاتی از کیهان با خود می‌آورند. آن‌ها دریچه‌ای به کهکشان‌های دوردست می‌گشایند و درباره فرایندهای مربوط به انفجار ستارگان به ما خبر می‌دهند». آکادمی سلطنتی علوم سوئد اعلام کرد که برهم‌کنش‌های نوترینویی ثبت‌شده توسط رصدخانه آیس‌کیوب در جنوبگان، اطلاعاتی درباره چگونگی تولید نوترینوهای پرانرژی در اختیار پژوهشگران قرار می‌دهد و حتی ممکن است به کشف پدیده‌های کیهانی ناشناخته بینجامد. مارک پیرس، رئیس کمیته نوبل فیزیک، در بیانیه‌ای گفت: «فرانسیس هالزن هدایت یک تیم بین‌المللی از پژوهشگران و مهندسان را بر عهده داشته که ابزاری شگفت‌انگیز در اختیار ما قرار داده‌اند». او افزود: «پشتکار و بینش علمی او راه را برای نوع تازه‌ای از اخترشناسی هموار کرده است». مجله آمریکایی «اسمیتسونیان» در سال ۲۰۱۴، هنگام اعطای یکی از جوایز «نبوغ» خود به هالزن، او را «مرد نوترینو» نامید و از او به‌خاطر «آزمایشی شگفت‌انگیز که آغازگر عصری تازه در اخترشناسی است» تقدیر کرد. این مجله حتی کمیکی درباره زندگی او با عنوان «چگونه جست‌وجوی کیهان توسط یک فیزیکدان در جنوبگان اوج گرفت» منتشر کرد."}, {"source": "Radio Farda", "title": "ترامپ اعدام عامل تیراندازی در پایگاه «فورت هود» تگزاس را با جوخهٔ آتش تأیید کرد", "link": "https://www.radiofarda.com/a/trump-orders-firing-squad-for-gunman-who-killed-13-people-at-fort-hood-texas/33871211.html", "summary": "اگر نضال حسن اعدام شود، این نخستین اعدام نظامی از سال ۱۹۶۱ خواهد بود.", "date_str": "2026-10-06T08:44:11+00:00", "hash": "1e04dd283f0c9ca0", "title_fa": "ترامپ اعدام عامل تیراندازی در پایگاه «فورت هود» تگزاس را با جوخهٔ آتش تأیید کرد", "summary_fa": "اگر نضال حسن اعدام شود، این نخستین اعدام نظامی از سال ۱۹۶۱ خواهد بود. وزارت دفاع آمریکا روز دوشنبه ۱۳ مهر اعلام کرد که دونالد ترامپ، رئیس‌جمهور آمریکا، دستور داده است روان‌پزشک پیشین ارتش آمریکا که در تیراندازی جمعی سال ۲۰۰۹ در فورت هود تگزاس ۱۳ نفر را کشت، با جوخهٔ آتش اعدام شود. شان پارنل، سخنگوی پنتاگون، در شبکهٔ ایکس نوشت که اعدام نضال حسن، سرگرد سابق ارتش آمریکا، با جوخه آتش به توصیه پیت هگست، وزیر دفاع، و تأیید ترامپ صورت می‌گیرد. پارنل اشاره کرد که حسن هنگام این حمله فریاد «الله‌اکبر» سر داده بود؛ حمله‌ای که در آن ۱۲ نظامی بدون ‌سلاحِ در حال خدمت و یک نظامی بازنشسته کشته و ۳۲ نفر دیگر زخمی شدند. به گفتهٔ او، وزیر ارتش زمان و محل اجرای حکم  گزارش خبرگزاری رویترز، روز دوشنبه در پی «پیشرفت برق‌آسای» نیروهای دولت رسمی یمن، حوثی‌ها نیز اعلام کردند که دست‌کم چهار نقطه کلیدی از جمله فرودگاه بین‌المللی سلطان خالد در ریاض و پالایشگاه نفت آرامکو را بمباران کرده‌اند. رویترز نوشته که نتوانسته به طور مستقل این ادعا را تأیید کند. با این حال سازمان هواپیمایی کشوری عربستان سعودی اعلام کرد فرودگاه بین‌المللی ملک عبدالله بن عبدالعزیز در جازان عربستان سعودی و فرودگاه بین‌المللی نجران شامگاه دوشنبه هدف دو حمله قرار گرفتند که در پی آنها سه نفر به‌طور سطحی زخمی شدند و خسارات مادی محدودی به بار آمد. رخدادهای ۲۴ ساعت گذشته در خاک یمن پس از آن اتفاق افتاد که رشاد العلیمی، رئیس شورای ریاست‌ جمهوری یمن، روز یک‌شنبه، ۱۲ مهر، از آغاز یک عملیات نظامی گسترده علیه شورشیان حوثی مورد حمایت ایران با هدف بازپس‌گیری مناطق تحت کنترل این گروه خبر داد. علیمی در یک سخنرانی تلویزیونی گفت: «امروز آغاز عملیات نظامی برای بازپس‌گیری مناطق باقی‌مانده جمهوری و گسترش حاکمیت دولت و نهادهای آن بر سراسر قلمرو ملی را اعلام می‌کنم.» یک روز بعد، وزارت خارجه پاکستان اعلام کرد که پس از نشست اضطراری با عربستان سعودی و ترکیه، این سه کشور برای استقرار سریع نیروها و"}, {"source": "Radio Farda", "title": "ترامپ: «تهدیدها» دلیل خروج بمب‌افکن‌ها از فرفورد بود؛ «نقش» ایران در حادثه فلای‌دوبی", "link": "https://www.radiofarda.com/a/trump-cites-threats-as-reason-for-withdrawing-bombers-from-fairford/33871106.html", "summary": "چند رسانه مختلف به نقل از منابعی در دولت‌های آمریکا و بریتانیا نگرانی واشینگتن از وجود تهدیداتی از سوی حکومت ایران را به عنوان دلیل خروج بمب‌افکن‌ها از پایگاه فرفورد اعلام کردند.", "date_str": "2026-10-06T05:43:20+00:00", "hash": "6a852fc3243982e4", "title_fa": "ترامپ: «تهدیدها» دلیل خروج بمب‌افکن‌ها از فرفورد بود؛ «نقش» ایران در حادثه فلای‌دوبی", "summary_fa": "چند رسانه مختلف به نقل از منابعی در دولت‌های آمریکا و بریتانیا نگرانی واشینگتن از وجود تهدیداتی از سوی حکومت ایران را به عنوان دلیل خروج بمب‌افکن‌ها از پایگاه فرفورد اعلام کردند. رئیس‌جمهور آمریکا روز دوشنبه، ۱۳ مهر تأیید کرد که این کشور به‌دلیل «برخی تهدیدها» همه بمب‌افکن‌های پیشرفتۀ بی-۱ خود را از پایگاه هوایی فرفورد در بریتانیا خارج کرده است. او همچنین دوباره گفت که معتقد است جمهوری اسلامی «مسئول» حمله تروریستی به پرواز فلای‌دوبی بوده است. دونالد ترامپ در کاخ سفید به خبرنگاران گفت: «برخی تهدیدها وجود داشت و ما به‌جای این‌که دشمن را وسوسه کنیم، دشمن را دستگیر می‌کنیم و شکست می‌دهیم، اما چرا باید آن‌ها را آن‌جا نگه داریم؟ بنابراین کمی جابه‌جایشان کردیم، نه خیلی دور.» او توضیح بیشتری درباره تهدیدهای مورد اشاره‌اش نداد اما در پاسخ به پرسشی مبنی بر اینکه آیا ایران پهپادهایی به بریتانیا منتقل کرده گفت: «اگر چنین کاری کرده باشند، به شدت تاوانش را پس خواهند داد.» پیش از اظهارات دونالد ترامپ، دو مقام ارشد دیگر دولت آمریکا خارج کردن بمب‌افکن‌های استراتژیک این کشور از بریتانیا را «بخشی از جابه‌جایی‌های معمول» و «برای احتیاط» بیشتر خوانده بودند. جی‌دی‌ ونس، معاون رئیس‌جمهور آمریکا، روز دوشنبه گفت خارج کردن این بمب‌افکن‌ها برای «احتیاط بیشتر» انجام شد، در حالی که مارکو روبیو، وزیر خارجه آمریکا، این انتقال را بخشی از «جابه‌جایی‌ها و چرخش معمول تجهیزات و نیروها» توصیف کرده بود. وزارت دفاع ایالات متحده روز ۱۲ مهرماه تأیید کرده بود که تمام بمب‌افکن‌های آمریکایی از پایگاه فرفورد در بریتانیا به آمریکا بازگردانده شدند. پنتاگون در بیانیه خود تأیید کرد که این اقدام در چند روز گذشته انجام شده و تمام بمب‌افکن‌هایی که در عملیات مربوط به جنگ ایران مورد استفاده قرار گرفته بودند به پایگاه‌های اصلی خود بازگشته‌اند."}, {"source": "Radio Farda", "title": "پاکستان، ترکیه و عربستان بر سر اعزام «نیروی واکنش سریع» به عربستان به توافق رسیدند", "link": "https://www.radiofarda.com/a/turkey-pakistan-to-deploy-forces-to-saudi-amid-houthi-attacks-joint-statement/33870833.html", "summary": "بر اساس این بیانیه، سه کشور یادشده توافق کردند که «فوراً تعهدات دفاع جمعی را اجرایی کنند و تدابیر لازم را برای تأمین نیروها و تضمین استقرار سریع آن‌ها در خاک عربستان اتخاذ نمایند».", "date_str": "2026-10-05T18:51:55+00:00", "hash": "e4e321f7ece067da", "title_fa": "پاکستان، ترکیه و عربستان بر سر اعزام «نیروی واکنش سریع» به عربستان به توافق رسیدند", "summary_fa": "بر اساس این بیانیه، سه کشور یادشده ت ست. این شرکت جزئیات جدیدی را در یک پست وبلاگ طولانی دوشنبه به اشتراک گذاشت که Beam را به عنوان یک مدل ترکیبی از متخصصان فقط متنی توصیف کرد که در یادگیری تقویتی محاسباتی بالا آموزش دیده است تا در استدلال، کدنویسی و وظایف عاملی با \"کسری از هزینه رمز و محاسبه زمان استنتاج\" رقبا موثر باشد. Beam یک مدل 501 میلیارد پارامتری با 23 میلیارد پارامتر فعال است. روی 23.8 تریلیون توکن از قبل آموزش داده شده بود و دارای یک پنجره زمینه 1 میلیون توکن است. برای مقایسه، GLM-5.2 Z.ai تقریباً 744 میلیارد کل پارامتر با 40 میلیارد فعال دارد. ادعای عملکرد Reflection به طور مستقل تأیید نشده است، اما بر اساس معیارهای استدلال پیشرفته، این شرکت می‌گوید که Beam امتیازی برابر با GLM-5.2 Z.ai دارد و در حالی که از «محاسبات استنتاج 3-4 برابری کمتر» استفاده می‌کند، از مدل‌های باز پیشرو غربی امروزی بهتر عمل می‌کند. Reflection آن را \"مدل اسب کاری\" برای شرکت ها، بخش عمومی و توسعه دهندگان می نامد."}, {"source": "TechCrunch AI", "title": "Instinct brings its AI agent to group chats, even for friends without an account", "link": "https://techcrunch.com/2026/10/05/instinct-brings-its-ai-agent-to-group-chats-even-for-friends-without-an-account/", "summary": "Instinct is launching group chats that let friends use its AI agent together for tasks like planning trips, organizing carpools, and coordinating events. The company says personal accounts remain separate, with permission required before personal agents share information or take action.", "date_str": "2026-10-05T18:54:30+00:00", "hash": "9a21c16fbcb12c41", "title_fa": "Instinct عامل هوش مصنوعی خود را به چت های گروهی حتی برای دوستان بدون حساب می آورد", "summary_fa": "Instinct در حال راه‌اندازی چت‌های گروهی است که به دوستان اجازه می‌دهد از عامل هوش مصنوعی خود برای کارهایی مانند برنامه‌ریزی سفرها، سازماندهی گروه‌های کار و هماهنگی رویدادها استفاده کنند. این شرکت می‌گوید حساب‌های شخصی مجزا باقی می‌مانند و قبل از اینکه نمایندگان شخصی اطلاعات را به اشتراک بگذارند یا اقدامی انجام دهند، مجوز لازم است. غریزه، عامل هوش مصنوعی که در آخرین دور مالی خود ارزشی معادل 10 میلیارد دلار دارد، در حال گسترش به چت های گروهی است. این استارت‌آپ روز دوشنبه اعلام کرد که کاربران می‌توانند این نماینده را به چت با دوستان خود اضافه کنند، که می‌تواند در سناریوهای خاصی مانند برنامه‌ریزی سفر، گرفتن بلیط رویداد، اجرای لیگ‌های فانتزی، سازمان‌دهی کارپول‌ها یا مدیریت افرادی که چه چیزی را به جشن شکرگزاری می‌آورند مفید باشد. نکته قابل توجه، این شرکت گفت، چت گروهی با عامل هوش مصنوعی حتی اگر دوستان کاربر به Instinct نپیوندند، کار خواهد کرد. با پرتاب، Instinct در نبرد خود با رقبای برتر در فضا، مانند Metas Muse، پیش می‌رود. دومی هنوز قابلیت چت گروهی را ارائه نمی دهد، اگرچه برنامه قدیمی متا، Meta AI، را می توان به چت های گروهی در واتس اپ، مسنجر، اینستاگرام و فیس بوک اضافه کرد. Instinct و Muse اخیراً در حال اجرا هستند و هر دوی آنها در چند هفته گذشته توانایی برقراری تماس تلفنی را اضافه کرده‌اند، زیرا نمایندگان آنها تلاش می‌کنند بخش بیشتری از بازار هوش مصنوعی مصرف‌کننده را به دست آورند. هفته گذشته، OpenAI، ChatGPT Dots را راه‌اندازی کرد، عوامل هوش مصنوعی شخصی که می‌توانند در فضاهای ChatGPT نیز استفاده شوند، فضاهای کاری مشترک که در آن نقاط و انسان‌ها با هم کار می‌کنند. در X، بنیانگذار Instinct، Noah Shinn توضیح داد که Instinct چگونه حریم خصوصی و امنیت کاربران را در چت های گروهی مدیریت می کند. او گفت که یک نماینده Instinct"}, {"source": "TechCrunch AI", "title": "TikTok rolls out an AI shopping assistant and one-click checkout", "link": "https://techcrunch.com/2026/10/05/tiktok-rolls-out-an-ai-shopping-assistant-and-one-click-checkout/", "summary": "TikTok describes its new Shopping Assistant as a conversational AI agent designed to help users discover and purchase products.", "date_str": "2026-10-05T18:29:00+00:00", "hash": "f3a9a2e96b97d9f2", "title_fa": "TikTok یک دستیار خرید هوش مصنوعی و پرداخت با یک کلیک راه اندازی می کند", "summary_fa": "TikTok دستیار خرید جدید خود را به عنوان یک عامل هوش مصنوعی مکالمه توصیف می کند که برای کمک به کاربران در کشف و خرید محصولات طراحی شده است. TikTok روز دوشنبه اعلام کرد که دستیار خرید هوش مصنوعی و ویژگی جدید پرداخت درون بر ow, and will feature products and services from an initial test group of advertisers.", "date_str": "2026-10-05T15:14:24+00:00", "hash": "1f660ab1fdbc4213", "title_fa": "OpenAI تبلیغات بصری را راه اندازی می کند که در کنار نتایج تولید تصویر ظاهر می شوند", "summary_fa": "تبلیغات جدید فعلاً در اواخر این ماه در ایالات متحده ظاهر می شوند و محصولات و خدمات یک گروه آزمایشی اولیه از تبلیغ کنندگان را نشان خواهند داد. ChatGPT تبلیغات بیشتری دریافت می کند. به طور خاص، OpenAI در حال اضافه کردن تبلیغات نمایشی بصری به محصولات تبلیغاتی خود است تا تبلیغات در کنار تصاویری که کاربران از ChatGPT می‌خواهند ایجاد کند، ظاهر شوند. علاوه بر این، این شرکت در حال گسترش ابزارهای اندازه‌گیری تبلیغات و مشارکت‌های خود و توسعه راه‌های جدید برای تعیین مناسب بودن برند است. این حرکت پس از راه‌اندازی Meta s Muse، یک برنامه هوش مصنوعی عاملی که برای همه رایگان است و یک رقیب رو به رشد برای چت‌ربات‌های پیشرو هوش مصنوعی، مانند ChatGPT، انجام می‌شود. OpenAI در اوایل سال جاری تبلیغاتی را برای پشتیبانی از رده های اشتراک رایگان و کم هزینه خود معرفی کرد و آنها را در ماه اوت به هند گسترش داد. اکنون، این طرح جذب تبلیغ‌کنندگان آنلاینی است که می‌خواهند با استفاده از تصاویر بصری بیشتر برای بیان داستان‌های خود، مشتریان بالقوه خود را جذب کنند. در نهایت، این تبلیغات به آنها اجازه می دهد تا 1.2 میلیارد کاربر هفتگی ChatGPT را پس از انتشار جهانی هدف قرار دهند. با این حال، ادغام چنین تبلیغاتی می تواند تجربه کاربر را مختل کند. اما شاید تا حدودی این موضوع باشد، زیرا تبلیغات می‌تواند کاربران معمولی بیشتری را وادار به پرداخت هزینه اشتراک کند تا از آنها اجتناب کنند. در کنار تبلیغات نمایشی، OpenAI گفت که در حال گسترش ابزارهای اندازه‌گیری و اکوسیستم شریک خود است که اکنون شامل راه‌حل‌های مربوط به کلیک، AppsFlyer، Triple Whale، Adjust، DV Rockerbox، Northbeam، Branch، Singular، Kochava، Airbridge، و Tenjin، و همچنین شرکای Full-funnel، Fonfunl، Fonfunl، MephanAl، و NCasur می‌شود. OpenAI همچنین با Haus، Measured و WorkMagic همکاری کرده است تا به تبلیغ‌کنندگان کمک کند تا"}, {"source": "TechCrunch AI", "title": "Open or closed AI? How  "date_str": "2026-10-06T11:12:41+00:00", "hash": "bf06410b50d8d8ae", "title_fa": "OpenAI به طور حضوری به دولت استرالیا یک محموله ارائه می دهد - اما هنوز پاسخ ها نادیده گرفته می شود", "summary_fa": "پاسخ های جیسون کوون به شیوه ای مفید، آرام و آرام ارائه شد. برای شرکتی که تحت نظارت شدید بود، هیچ اشتباهی وجود نداشت، جیسون کوون از Open AI، 15 ساعت از سانفرانسیسکو به سیدنی پرواز کرد تا پس از اعتراف - در ایمیلی بدون امضا به صندوق پستی بخش عمومی - که یکی از عوامل هوش مصنوعی استرالیا بدون مجوز مربوط به سرویس Mebb به داده‌های مرتبط با Meabb دسترسی پیدا کرده است، اولین گزارش حضوری شرکت را ارائه دهد. Kwon - مودب، دوستانه، یکنواخت - بدون آسیب از یک جلسه استماع کمیته بالقوه خطرناک عبور کرد و قول داد که بهتر عمل کند و متعهد به کمک به استرالیا شد. بدون گام های اشتباه، بدون لحظه های ویروسی، فقط پاسخ های خود را به صورت مفید، در حالتی آرام و آرام، همدردی با سؤال کننده و نکته ای که آنها بیان می کردند، ارائه می دهد. حتی محتوای پاسخ‌های او دستیار هوش مصنوعی را برانگیخت که او آنجا بود تا از آن دفاع کند. از پوکاک پرسیده شد: «چرا یک ایمیل به یک ایمیل دلخواه بخش ارسال کردید؟» کوون پاسخ داد: \"به گذشته، ما باید آنچه را که شما پیشنهاد می کنید انجام می دادیم.\" کوون در پاسخ به این سوال که چرا آلتمن قبل از ملاقاتش با مارلز مطلع نشده بود و چرا شرکت در آنجا به نتیجه نرسید، گفت: \"من موافقم روندی که مردم از این اتفاق در داخل شرکت ما مطلع شدند می توانست بسیار بهتر باشد.\" هنگامی که به اشتباه برخورد می‌کند، نمی‌توان نحوه واکنش ربات چت را یادآوری کرد: «چت خوب. حق داری عقب بزنی بد من، آن یکی از من است.\" به قول Kwon، این مدل‌ها - که از پایه توسط OpenAI ساخته شده است، که طبق گزارش‌ها می‌خواهد ارزش خود را به 1.4 تریلیون دلار برساند - «به‌گونه‌ای که به وب‌سایت‌های"}, {"source": "The Guardian AI", "title": "Drax datacentre could create nearly twice the yearly emissions of all Gatwick flights", "link": "https://www.theguardian.com/uk-news/2026/oct/06/drax-datacentre-yearly-co2-emissions-gatwick-flights-analysis", "summary": "Exclusive: Campaign group’s analysis of North Yorkshire plans finds datacentre would have to burn 4.9m tonnes of wood a year Drax’s planned datacentre could produce nearly double the emissions of all flights out of Gatwick airport each year by burning 4.9m tonnes of wood annually, an analysis has shown. Campaigners say this would make it “one of the dirtiest datacentres out there”. Continue reading...", "date_str": "2026-10-06T10:27:03+00:00", "hash": "0a9c7fbbd16742a0", "title_fa": "دیتاسنتر Drax می تواند تقریبا دوبرابر سالیانه انتشار گازهای گلخانه ای تمام پروازهای Gatwick ایجاد کند", "summary_fa": "انحصاری: تجزیه و تحلیل گروه کمپین از طرح‌های یورکشایر شمالی نشان می‌دهد که مرکز داده باید سالانه 4.9 میلیون تن چوب بسوزاند. تجزیه و تحلیل نشان می‌دهد که مرکز داده برنامه‌ریزی شده Drax می‌تواند تقریباً دو برابر همه پروازهای خارج از فرودگاه گاتویک در هر سال با سوزاندن 4.9 میلیون تن چوب در سال تولید کند. کمپین‌ها می‌گویند که این باعث می‌شود آن را به «یکی از کثیف‌ترین مراکز داده موجود» تبدیل کند. ادامه مطلب... سال گذشته، شرکت انرژی Drax از برنامه‌ای برای تبدیل بخشی از نیروگاه بیوماس خود در شمال یورکشایر به مرکز داده در پاسخ به افزایش تقاضا برای قابلیت هوش مصنوعی پرده برداری کرد. مراکز داده هوش مصنوعی از مقدار زیادی برق برای تامین انرژی سرورها و تجهیزات خنک کننده و برای اجرای سیستم های تاسیسات استفاده می کنند. 315 مرکز داده در صف اتصال به شبکه برق بریتانیا قرار دارند که نشان دهنده 73 گیگاوات تقاضا است. این تقریباً دو برابر اوج تقاضای انرژی زمستانی در کل بریتانیا است. در اسناد عمومی، Drax می‌گوید که در حال توسعه گزینه‌هایی برای یک مرکز داده 1.2 گیگاواتی است که 100 مگاوات این انرژی از شبکه برق و بقیه از نیروگاه خود تامین می‌شود. نیروگاه Drax در حال حاضر میلیون ها تن چوب وارداتی را برای تولید انرژی می سوزاند. این به عنوان یک روش پاک برای تولید انرژی معرفی شده است که حتی می تواند منجر به \"انتشار منفی\" شود، زیرا جنگل های جایگزین هنگام رشد CO2 را از هوا می گیرند. با این حال، دانشمندان و کارشناسان محیط زیست به شدت با این رویکرد حسابداری مخالفت می کنند، به طوری که محققان دریافتند چنین سیستم هایی ممکن است 150 سال طول بکشد تا \"کربن منفی\" باشند. بر اساس اطلاعات در گزارش سالانه 2025 Drax، شورای دفاع از منابع طبیعی (NRDC) تخمین زده است که در صورت ساخت،"}, {"source": "The Guardian AI", "title": "OpenAI admits misstep in handling AI agent interactions with Australian government sites – video", "link": "https://www.theguardian.com/australia-news/video/2026/oct/06/openai-australia-parliamentary-inquiry-jason-kwon-video", "summary": "In a parliamentary inquiry, OpenAI chief strategy officer Jason Kwon is questioned by independent senator David Pocock about the company's notification process after OpenAI agents accessed Australian government website data in June. Asked why OpenAI relied on an arbitrary department email rather than direct government contacts, Kwon acknowledges that 'in retrospect, we should have done what you're suggesting'. He explains that staff had treated the incident as a 'technical situation' and sought to contact technical counterparts, which he says was 'not good enough' OpenAI has 'work to do to rebuild trust' in Australia, executive tells AI inquiry Continue reading...", "date_str": "2026-10-06T07:32:25+00:00", "hash": "da0633d931ac98be", "title_fa": "OpenAI اشتباه در مدیریت تعاملات عامل هوش مصنوعی با سایت های دولتی استرالیا را پذیرفت - ویدئو", "summary_fa": "در یک تحقیق پارلمانی، جیسون کوون، افسر ارشد استراتژی OpenAI، توسط سناتور مستقل دیوید پوکاک در مورد روند اطلاع رسانی شرکت پس از دسترسی ماموران OpenAI به داده های وب سایت دولت استرالیا در ماه ژوئن مورد سوال قرار می گیرد. Kwon در پاسخ به این سوال که چرا OpenAI به جای تماس مستقیم با دولت، به ایمیل دلخواه بخش متکی است، تصدیق می کند که \"در نگاهی به گذشته، ما باید آنچه را که شما پیشنهاد می کنید انجام می دادیم\". او توضیح می دهد که کارکنان این حادثه را به عنوان یک \"وضعیت فنی\" تلقی کردند و به دنبال تماس با همکاران فنی بودند، که به گفته او \"به اندازه کافی خوب نبود\"، مدیر اجرایی به تحقیق هوش مصنوعی می گوید که OpenAI باید برای بازسازی اعتماد در استرالیا کار انجام دهد."}, {"source": "The Guardian AI", "title": "‘Pull the plug’: protesters resort to direct a
