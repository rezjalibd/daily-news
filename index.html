/2026/10/apple_watch_series_10.png\", productImageAlt: \"Apple Watch Series 10\", productTitle: \"Apple Watch Series 10\", shortDescription: \"Save on a refurbished Apple Watch Series 10\", longDescription: \"Get an Apple Watch Series 10 with a 46mm aluminum case and GPS connectivity for a fraction of its listed new price. Shop refurbished options at Back Market with a one-year warranty.\", purchaseUrl: \"https://www.awin1.com/cread.php?awinmid=18275 awinaffid=299513 platform=dl ued=https%3A%2F%2Fwww.backmarket.com%2Fen-us%2Fp%2Fapple-watch-series-10%3Futm_source%3Dchatgpt.com\", purchaseLinkText: \"Shop At Back M", "date_str": "2026-10-27T15:34:16+00:00", "hash": "cc9a0e5f95464e02", "title_fa": "آخرین AirTag اپل ارزان‌ترین AirTag است", "summary_fa": "کمتر از یک ماه دیگر به روز شکرگزاری باقی مانده است، بنابراین اکنون زمان خوبی برای شروع آماده سازی قبل از عجله است. خوشبختانه، آخرین AirTag اپل می تواند به شما کمک کند تا در میان هرج و مرج تعطیلات، چمدان ها و سایر وسایل خود را کنترل کنید، و در حال حاضر به کمترین قیمت 23 دلاری (6 دلار تخفیف) در آمازون و والمارت رسیده است. Apple AirTag (نسل دوم) از کجا بخریم: ۲۹ دلار ۲۳ دلار در آمازون ۲۹ دلار ۲۳ دلار در Walmart اگر آیفون دارید، نسل دوم AirTag بهترین ردیاب بلوتوثی است که می توانید بخرید. این تا حد زیادی به دلیل تراشه باند فوق العاده اپل است که جستجوی دقیق را فعال می کند و شما را با فلش های روی صفحه، لرزش ها و صداها به مکان دقیق یک شی راهنمایی می کند. مدل نسل دوم همچنین می‌تواند به شما کمک کند چیزها را سریع‌تر از نسل قبلی پیدا کنید، زیرا به شما امکان می‌دهد آن نشانه‌های جهت را تا 50 درصد دورتر انتخاب کنید (همچنین برد بلوتوث بیشتری ارائه می‌دهد). در آزمایش‌های ما، این به معنای اتصالات سریع‌تر و عملکرد بهتر در چندین طبقه بود که اگر چیزی را در هتل رها کرده باشید، می‌تواند مفید باشد. حتی می‌توانید دستورالعمل‌های اپل واچ سری 9 یا جدیدتر را دنبال کنید و امکان ردیابی موارد خود را بدون بیرون کشیدن گوشی فراهم کنید. آخرین AirTag چند امتیاز دیگر را نیز برای مسافران ارائه می دهد. می توانید آن را با حداکثر پنج نفر دیگر به اشتراک بگذارید، که اگر با اعضای خانواده سفر می کنید مفید است. اگر چمدانتان گم شد، می‌توانید به‌طور موقت مکان آن را با خطوط هوایی شرکت‌کننده، از جمله یونایتد و دلتا، به اشتراک بگذارید. این بدان معناست که اگر چمدان شما گم شود، کارکنان خطوط هوایی می توانند مکان گزارش", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/10/AirTagVergeDailyDeals.png?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["Apple", "تراشه"], "datetime_fa": "۵ آبان • ۱۹:۰۴"}, {"source": "Ars Technica", "title": "Apple iPhone Duo review: Two screens, two experiences, two thousand dollars", "link": "https://arstechnica.com/gadgets/2026/10/apple-iphone-duo-review-two-screens-two-experiences-two-thousand-dollars/", "summary": "I understand the appeal of foldable phones—they let manufacturers keep expanding screen sizes while still producing devices that can reasonably fit in a pocket. In practice, though, every foldable Android phone I've seen in public has had a ridiculously visible seam between the two halves of the screen, often with what looks like delamination from the underlying surface, giving the display an ugly, bubbly appearance. Back when Android phones began shipping with bigger and bigger screens and the iPhone was stuck at a miserly four inches, I was jealous. But I've never looked at anyone using a chunky, fragile-looking foldable phone in public and pined for Apple's take on the idea. Nevertheless, that take has arrived, in the form of the iPhone Duo . This $1,999-and-up foldable is the biggest change to the iPhone in years, with both hardware and software updates that dramatically change how you interact with the device. Read full article Comments", "date_str": "2026-10-27T14:20:26+00:00", "hash": "48c33d93ed6cee38", "title_fa": "بررسی Apple iPhone Duo: دو صفحه نمایش، دو تجربه، دو هزار دلار", "summary_fa": "من جذابیت تلفن‌های تاشو را درک می‌کنم—آنها به تولیدکنندگان اجازه می‌دهند تا اندازه صفحه نمایش را افزایش دهند و در عین حال دستگاه‌هایی تولید کنند که به طور منطقی در جیب جا شوند. با این حال، در عمل، هر گوشی اندرویدی تاشوی که در انظار عمومی دیده‌ام، بین دو نیمه صفحه‌نمایش درز به‌طور مسخره‌ای قابل مشاهده است، که اغلب به نظر می‌رسد که از سطح زیرین لایه لایه شده است و ظاهری زشت و حباب‌دار به نمایشگر می‌دهد. زمانی که گوشی‌های اندرویدی با صفحه‌نمایش بزرگ‌تر و بزرگ‌تر عرضه می‌شدند و آیفون در چهار اینچ خسیسی گیر کرده بود، حسادت می‌کردم. اما من هرگز به کسی نگاه نکرده‌ام که از یک تلفن تاشو با ظاهری شکننده و درشت استفاده می‌کند و به دنبال برداشت اپل از این ایده بودم. با این وجود، این برداشت به شکل iPhone Duo وارد شده است. این قابلیت تاشو با قیمت 1999 دلار و بالاتر، بزرگ‌ترین تغییر در آیفون در سال‌های اخیر است، با به‌روزرسانی‌های سخت‌افزاری و نرم‌افزاری که نحوه تعامل شما با دستگاه را به طرز چشمگیری تغییر می‌دهد. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش من جذابیت تلفن های تاشو را درک می کنم—آنها به سازندگان اجازه می دهند اندازه صفحه نمایش را افزایش دهند در حالی که هنوز دستگاه هایی تولید می کنند که به طور منطقی در جیب قرار گیرند. با این حال، در عمل، هر گوشی اندرویدی تاشوی که در انظار عمومی دیده‌ام، بین دو نیمه صفحه‌نمایش درز به‌طور مسخره‌ای قابل مشاهده است، که اغلب به نظر می‌رسد که از سطح زیرین لایه لایه شده است و ظاهری زشت و حباب‌دار به نمایشگر می‌دهد.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/IMG_3790-1152x648.jpeg", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۵ آبان • ۱۷:۵۰"}, {"source": "Ars Technica", "title": "Some iPhone Duo screens are already failing, Apple says only a \"small number\" are affected", "link": "https://arstechnica.com/gadgets/2026/10/some-iphone-duo-screens-are-already-failing/", "summary": "The iPhone Duo launched last week, offering anyone willing to spend $2,000 a chance to experience Apple's first foldable phone. For some early buyers, the morning after isn't going great. Despite the company's big talk about its \"precision-engineered\" hinge, some devices appear to have a hardware flaw that destroys the device's impressive internal display within hours (or minutes) of use. The Internet is currently overflowing with images of busted iPhone Duos, all sporting almost identical damage. The OLED is marred by several bright lines originating just below the midpoint of the display. These bands of damaged pixels extend all the way to the bottom and right edges. Some units also show lines of dead pixels following the crease from the top to the area where the bright lines begin. Anyone who has seen a damaged OLED panel will be familiar with this type of defect. When the layers of the display are damaged, the pixels no longer receive the correct voltage to illuminate them. Instead, they get the full driving voltage and are permanently on at maximum brightness. Some pixels can get no voltage, leaving them totally black. The only fix is to replace the OLED, but swapping the iPhone Duo's screen reportedly costs half as much as the device itself. Read full article Comments", "date_str": "2026-10-27T14:00:49+00:00", "hash": "15cf88f9276968b7", "title_fa": "برخی از صفحه‌نمایش‌های iPhone Duo در حال حاضر از کار می‌افتند، اپل می‌گوید که تنها تعداد کمی تحت تأثیر قرار می‌گیرند", "summary_fa": "آیفون Duo هفته گذشته راه اندازی شد و به هر کسی که مایل به خرج کردن 2000 دلار است فرصتی برای تجربه اولین گوشی تاشو اپل ارائه می دهد. برای برخی از خریداران اولیه، صبح بعد از آن خیلی خوب نیست. علیرغم صحبت های بزرگ این شرکت در مورد لولای \"مهندسی دقیق\" آن، به نظر می رسد برخی از دستگاه ها دارای نقص سخت افزاری هستند که نمایشگر داخلی چشمگیر دستگاه را ظرف چند ساعت (یا چند دقیقه) پس از استفاده از بین می برد. اینترنت در حال حاضر مملو از تصاویر آیفون Duos شکسته شده است که همگی آسیب تقریباً یکسانی دارند. OLED با چندین خط روشن که دقیقاً زیر نقطه میانی نمایشگر منشا می گیرند، مخدوش می شود. این نوارهای پیکسل های آسیب دیده تا لبه های پایین و سمت راست گسترش می یابند. برخی از واحدها همچنین خطوطی از پیکسل های مرده را به دنبال چین از بالا تا ناحیه ای که خطوط روشن شروع می شود نشان می دهند. هرکسی که پنل OLED آسیب دیده را دیده باشد با این نوع نقص آشنا خواهد بود. وقتی لایه‌های نمایشگر آسیب می‌بینند، پیکسل‌ها دیگر ولتاژ مناسبی برای روشن کردن آنها دریافت نمی‌کنند. در عوض، آنها ولتاژ رانندگی کامل را دریافت می کنند و به طور دائم در حداکثر روشنایی روشن هستند. برخی از پیکسل ها نمی توانند ولتاژ دریافت کنند و کاملا سیاه می شوند. تنها راه حل تعویض OLED است، اما طبق گزارش ها، تعویض صفحه نمایش آیفون Duo نصف خود دستگاه هزینه دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید iPhone Duo هفته گذشته راه اندازی شد و به هر کسی که مایل به خرج کردن 2000 دلار است فرصتی برای تجربه اولین", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/iphone-duo-oops-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۵ آبان • ۱۷:۳۰"}, {"source": "Ars Technica", "title": "Sculpture recreates odd optical effects of famed Lycurgus Cup", "link": "https://arstechnica.com/science/2026/10/scientists-recreate-the-1600-year-old-recipe-of-lycurgus-cup/", "summary": "Dating back to around 400 CE and made of dichroic glass, the Lycurgus Cup is notable for exhibiting different colors depending on the light. (It gets its name from the scene depicted on its surface, of King Lycurgus of Thrace.) Light it from the front, and the cup looks green; light it from behind, and the color changes to a deep red. University of Sheffield scientists have recreated the original recipe to produce a contemporary glass sculpture with the same optical effect. The cup is considered one of the seven glass wonders of the world, one of just 40 glass cage cups that survived. Exactly why the unusual color effects of the Lycurgus Cup occurred was a mystery until 2007 , when a team of scientists discovered the color shifts were due to the presence of nanoparticles in the glass—the result of Roman artisans adding finely ground gold and silver into the mix. Those nanoparticles change how the electrons in the cup vibrate in response to light so that the color one sees shifts with the observer’s vantage point. As we reported in 2019, it’s a similar phenomenon to the one responsible for the shifting colors of 19th-century daguerreotypes due to the scattering properties of nanoparticles. The Romans added salt when they melted the silicon (sand) to make the glass, and those salts contained gold atoms. In the melting process, those atoms aggregate and produce nanoparticles, which in turn produce the colors. It’s how any stained glass is made. It's also similar to how the precise lattice-like structure of photonic crystals produces iridescent colors in nature, like the wings of butterflies, or opals. Read full article Comments", "date_str": "2026-10-27T13:32:35+00:00", "hash": "89c94a610809fbb3", "title_fa": "مجسمه سازی جلوه های نوری عجیب جام لیکورگوس مشهور را بازسازی می کند", "summary_fa": "جام لیکورگوس که قدمت آن به حدود 400 سال پس از میلاد برمی گردد و از شیشه دو رنگ ساخته شده است، به دلیل نمایش رنگ های مختلف بسته به نور قابل توجه است. (نام خود را از صحنه ای که روی سطح آن به تصویر کشیده شده است، از پادشاه لیکورگوس تراکیه گرفته شده است.) آن را از جلو روشن کنید، و جام سبز به نظر می رسد. آن را از پشت روشن کنید و رنگ آن به قرمز تیره تغییر می کند. دانشمندان دانشگاه شفیلد دستور اصلی را برای تولید مجسمه شیشه ای معاصر با همان جلوه نوری بازسازی کردند. این فنجان یکی از هفت عجایب شیشه‌ای جهان است، یکی از تنها ۴۰ فنجان قفس شیشه‌ای که باقی مانده است. این که چرا اثرات رنگی غیرمعمول جام لیکورگوس رخ داد تا سال 2007 یک راز بود، زمانی که تیمی از دانشمندان دریافتند که تغییر رنگ به دلیل وجود نانوذرات در شیشه است - نتیجه‌ی اضافه کردن طلا و نقره ریز آسیاب شده توسط صنعتگران رومی به این مخلوط. این نانوذرات نحوه ارتعاش الکترون‌های جام در پاسخ به نور را تغییر می‌دهند به طوری که رنگی که فرد می‌بیند با نقطه دید ناظر تغییر می‌کند. همانطور که در سال 2019 گزارش دادیم، این پدیده مشابه پدیده ای است که به دلیل خواص پراکندگی نانوذرات مسئول تغییر رنگ دگرئوتیپ های قرن نوزدهمی است. رومی ها وقتی سیلیکون (ماسه) را برای ساختن شیشه ذوب کردند نمک اضافه کردند و این نمک ها حاوی اتم های طلا بودند. در فرآیند ذوب، آن اتم‌ها تجمع کرده و نانوذرات تولید می‌کنند که به نوبه خود رنگ‌ها را تولید می‌کنند. هر شیشه رنگی اینگونه ساخته می شود. همچنین شبیه به این است که چگونه ساختار دقیق شبکه مانند بلورهای فوتونی رنگ های رنگین کمانی مانند بال های پروانه ها یا عقیق ها را در طبیعت", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/lycurgusTOP-1152x648-1793103945.jpg", "category": "هوش مصنوعی مولد", "tags": ["بورس و طلا"], "datetime_fa": "۵ آبان • ۱۷:۰۲"}, {"source": "Ars Technica", "title": "US officials want Section 702 renewed before damaging court ruling goes public", "link": "https://arstechnica.com/tech-policy/2026/10/us-officials-want-section-702-renewed-before-damaging-court-ruling-goes-public/", "summary": "Two Democratic senators who have long overseen US intelligence say the Trump administration is illegally withholding a secret court’s findings from Congress until lawmakers renew a program that lets federal agents read Americans’ communications without a warrant. Seven months ago, the Foreign Intelligence Surveillance Court objected to search filters that let intelligence analysts pull Americans’ messages from intercepted data without the approvals, written justifications, or records the law requires. The court approved another year of surveillance anyway. The ruling has never been made public, and Senators Ron Wyden of Oregon and Adam Schiff of California say the administration’s own deadline for releasing it passed in September. The program, Section 702 of the Foreign Intelligence Surveillance Act (FISA), lapsed in June after Congress failed to renew it, though collection continues under the court’s March approval. The administration’s own public documentation says rulings like links on this page. Following the events of WandaVision (and, slightly more tangentially, Agatha All Along ), VisionQuest returns to the story of Marvel's favorite synthic being, an artificial creation who fights supervillains and ponders the nature of his own existence, rather than more typical AI pursuits like creating deep fakes. White Vision (the character, not the political agenda) is a copy of the Vision who died two Avengers movies ago. He's living within his own mind on a fantasy country estate while on the run from bounty hunters and in pursuit of his semi-fictional son. In that spirit, here are 10 more science fiction shows that involve artificial people and/or elaborate constructed realities. Humans (2015 2018) In the near-future world, highly advanced synths are commonplace, doing the work that regular humans can t be bothered with. These beings are treated as entirely disposable sources of cheap labor, despite their apparent burgeoning humanity. The first season introduces the Hawkins family, who buy (on sale) a domestic servant synth named Anita (Gemma Chan); mom Laura is a little uncomfortable with the arrangement, especially when she finds her husband having sex with Anita, who has her own complicated backstory. Humans interrogates the ways humans always seem to find excuses to dehumanize others, which is just the type of thing that sci-fi is pretty great at. Stream Humans on Peacock , Prime Video , and Tubi . Humans (2015 2018) at Peacock Learn More Learn More at Peacock Murderbot (2025 ) One of the smartest recent shows is a dark comedy based on the Hugo-Award winning book series by Martha Wells. Alexander Skarsg rd is the title's hilariously deadpan robot, a private \"security construct\" who's managed to hack its way through its own programming and gain free will which it mostly wants to use to binge its favorite streaming shows. It can't just run off for fear of drawing attention, but the self-named Murderbot (it's being ironic, kinda) is conten ime Video و Tubi پخش کنید. Humans (2015 2018) در Peacock بیشتر بدانید در Peacock Murderbot (2025) یکی از هوشمندانه‌ترین نمایش‌های اخیر، یک کمدی سیاه بر اساس مجموعه کتاب‌های برنده جایزه هوگو اثر مارتا ولز است. Alexander Skarsg rd ربات مرده خنده دار", "image_url": "https://lifehacker.com/imagery/articles/01M5T0FT42D7HE80VHAD3AV7JX/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple", "امنیت سایبری", "سینما"], "datetime_fa": "۵ آبان • ۱۹:۰۰"}, {"source": "Lifehacker", "title": "10 Hacks Every Google Messages User Should Know", "link": "https://lifehacker.com/tech/best-google-messages-hacks?utm_medium=RSS", "summary": "Google Messages is Google's official texting app, and while it hasn't always been first to roll out useful features, it has caught up to what other messaging services offer and has a handful of hidden hacks to make communicating and coordinating with contacts easier and safer. Here are the best tips and tricks that every Google Messages user should know. Use the Keep integration to coordinate group events directly in Google Messages Google Messages recently got a Google Keep integration, which allows group chat participants to collaborate on notes and checklists directly in the message thread without having to click over to a separate app. This also centralizes ideas in one place rather than spread across a thread with dozens of separate text messages. Changes to Keep Notes sync automatically for all users. Tap the plus icon in the message compose bar in Google Messages, select Keep Notes , and either choose an existing note or tap to create a new one to be shared in the chat. Turn on advanced scam detection to protect against security threats Over the last few years, Google has rolled out a number of security features for identifying and defending against scams and fraud spread via calls and text messages. These work by detecting suspected spam and either preventing it from being delivered or hiding it in a separate folder, as well as flagging suspicious links. A newer opt-in enhanced protection mode for Google Messages uses AI to catch more complex threats and alert you if a conversation or unfamiliar link that looks legit might put you at risk. Standard protection is on by default, but you can turn on enhanced protection under Messages settings Protection Safety Spam and scam protection . Use scheduled send to draft texts while maintaining good boundaries If you have an idea you want to write down but not send immediately because it's outside of work hours or late at night you can draft it in Google Messages and schedule it for later. \"Send later\" features in messaging and chat apps are useful for maintaining good boundaries without having to remember to type and send at a different time. Once you've entered your message in the text field, touch and hold Send , choose from the suggested actions, then tap Send again. Customize swipe actions for Google Messages inbox triage Swiping left or right on your conversations in Google Messages will either archive or delete them. You can customize which swipe maps onto which action for quick inbox triaging or disa", "date_str": "2026-10-27T15:00:05+00:00", "hash": "9afca4fc41c2e9ef", "title_fa": "10 هک که هر کاربر پیام های گوگل باید بداند", "summary_fa": "Google Messages برنامه رسمی پیامک Google است و اگرچه همیشه اولین بار نبوده است که ویژگی های مفیدی را ارائه کرده است، اما به آنچه که سایر سرویس های پیام رسانی ارائه می دهند پی برده است و تعداد انگشت شماری هک پنهان برای برقراری ارتباط و هماهنگی با مخاطبین آسان تر و ایمن تر است. در اینجا بهترین نکات و ترفندهایی وجود دارد که هر کاربر پیام های Google باید بداند. از ادغام Keep برای هماهنگ کردن رویدادهای گروهی به طور مستقیم در پیام‌های Google استفاده کنید. پیام‌های Google اخیراً یک ادغام Google Keep را دریافت کرده است که به شرکت‌کنندگان چت گروهی اجازه می‌دهد بدون نیاز به کلیک کردن روی یک برنامه جداگانه روی یادداشت‌ها و چک لیست‌ها مستقیماً در رشته پیام با یکدیگر همکاری کنند. این همچنی نه و جالب شراب را در رستوران‌ها تهیه کنند. اگر می‌توانید شراب را از خواربارفروشی یا هر خرده‌فروشی که به آن سر می‌زنید تهیه کنید، وقتی بیرون هستید از آن صرفنظر کنید. ناهار خوری زمانی برای کشف و کشف چیزهای جدید است. این می‌تواند انگوری باشد که هرگز نخورده‌اید، تولیدکننده‌ای باشد که هرگز نامش را نشنیده‌اید، یا شرابی از منطقه‌ای باشد که تازه به آن دست یافته‌اید. مطمئناً، شما یک شراب قرمز توسکانی مصرف کرده‌اید، اما آیا شراب قرمزی از Oltrepò Pavese که از انگور پینو نوآر ساخته شده بود، خورده‌اید؟ در رستوران های ایتالیایی، من همیشه به دنبال بطری های La Genisia pinot هستم. به طور انحصاری چسبیدن به بطری های گران قیمت از مناطق عمده شراب Ritu Manoj Jethani/Shutterstock Bordeaux به طور گسترده", "image_url": "https://i.insider.com/66e1d196cfb7f307e5708f54?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۵ آبان • ۱۶:۴۵"}, {"source": "Lifehacker", "title": "These Retro-Chic Nothing Headphones Are $100 Off Right Now", "link": "https://lifehacker.com/tech/nothing-headphones-1-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. In a crowded market of over-ear noise-canceling headphones, it can be tricky to find a pair with a distinctive style that stands out from the rest. Enter the retro-futuristic line of statement-making Nothing headphones. One of the brand s popular pairs, the Nothing Headphone (1) , is 33% off and down to $199 (originally $299), marking a record-low price. Nothing Headphone (1) $199.00 at Amazon $299.00 Save $100.00 Get Deal Get Deal $199.00 at Amazon $299.00 Save $100.00 The Nothing Headphone (1) pairs spatial head tracking audio with adaptive ANC, providing up to 80 hours of playback with ANC off and 35 hours with ANC on. A five-minute charge delivers up to five hours of playback, though this figure will vary based on volume and feature use. The headphones support Bluetooth multipoint, high-resolution LDAC, AAC, and SBC, but can also be played through a 3.5mm or USB-C cable. Volume is controlled using a scroll wheel, while pressable controls let you skip tracks. PCMag notes in their review that despite how distinctive the controls are, they re easy to use. Sound is adjustable using the presets and advanced equalizer in the Nothing app, and the ANC is reliable at neutralizing background noise. If you still want to remain aware of your surroundings, you can turn on transparency mode. Despite the unusual rectangular shape of the outer earcups, they re round on the inside with ample padding and have an IP52 rating that can handle light splashes but otherwise shouldn t get wet. While you can get stronger audio and ANC, you ll be hard-pressed to find it at the $200 price point, often having to jump into the $400 range for premium options from Sony or Bose. Still, if you don t mind fiddling with the EQ and your priorities are a cool-looking aesthetic and plush, sizable earcups, the Nothing Headphone (1) is worth considering . Our Best Editor-Vetted Tech Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $199.99 (List Price $249.00) Apple HomeView Smart Display (Silver, 2026 Release) $299.00 (List Price $299.00) Apple TV 4K 4th Gen 128GB Streaming Player (2026 Model) $289.99 (List Price $299.00) TCL Tab 10 Gen 4 128GB 10.1\" Tablet (Dark Blue/Gray) $149.98 (List Price $199.99) Apple iPad 11\" 128GB A16 WiFi Tablet (Blue, 2025) $399.00 (List Price $449.00) Amazon Ember 50\" 4-Series with Fire TV (newest model) $309.", "date_str": "2026-10-27T14:30:00+00:00", "hash": "9e3a7daacaa14ee8", "title_fa": "این هدفون رترو شیک Nothing در حال حاضر 100 دلار تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. در بازار شلوغ هدفون‌های حذف نویز بیش از حد گوش، پیدا کردن یک جفت با استایل متمایز و متمایز از بقیه دشوار است. وارد خط عقب‌نمای آینده‌نگر هدفون‌های بیانیه‌سازی Nothing شوید. یکی از جفت‌های محبوب این برند، هدفون Nothing (1) با 33 درصد تخفیف و به 199 دلار (در اصل 299 دلار) کاهش یافته است که قیمتی بی‌سابقه را نشان می‌دهد. هدفون Nothing (1) 199.00 دلار در آمازون 299.00 دلار صرفه جویی 100.00 دلار دریافت معامله دریافت معامله 199.00 دلار در آمازون 299.00 دلار پس انداز 100.00 دلار هدفون Nothing (1) صدای ردیابی سر فضایی را با ANC با ANC تطبیقی ​​جفت می کند و تا 3 ساعت پخش با ANC تطبیقی ​​را ارائه می دهد. شارژ پنج دقیقه‌ای تا پنج ساعت پخش می‌شود، اگرچه این رقم بر اساس میزان صدا و استفاده از ویژگی متفاوت است. این هدفون از بلوتوث چند نقطه ای، LDAC، AAC و SBC با وضوح بالا پشتیبانی می کند، اما می تواند از طریق کابل 3.5 میلی متری یا USB-C نیز پخش شود. میزان صدا با استفاده از چرخ اسکرول کنترل می‌شود، در حالی که کنترل‌های قابل فشار دادن به شما امکان می‌دهند آهنگ‌ها را رد کنید. PCMag در بررسی خود خاطرنشان می کند که علی رغم متمایز بودن کنترل ها، استفاده از آنها آسان است. صدا با استفاده از تنظیمات از پیش تنظیم شده و اکولایزر پیشرفته در برنامه Nothing قابل تنظیم است و ANC در خنثی کردن نویز پس زمینه قابل اعتماد است. اگر همچنان می‌خواهید از محیط اطراف خود آگاه باشید، می‌توانید حالت شفافیت را روشن کنید. علیرغم شکل مستطیلی غیرعادی گوشواره‌های بیرونی، آنها از داخل با لایه‌بندی فراوان گرد می‌شوند و دارای استاندارد IP52 هستند که", "image_url": "https://lifehacker.com/imagery/articles/01M5X2SWE81DDF2G6GXFBYZ9D1/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "موسیقی"], "datetime_fa": "۵ آبان • ۱۸:۰۰"}, {"source": "Lifehacker", "title": "How to Export Your Arc Data to a New Browser", "link": "https://lifehacker.com/tech/how-to-export-arc-data-to-new-browser?utm_medium=RSS", "summary": "If you've been a dedicated Arc browser user, the time has finally come to say goodbye. The Browser Company paused development of Arc in 2025, continuing only with security updates. As announced late last week, Arc will officially sunset on Dec. 22, 2026, giving users two months to transition their data to an alternative. One option is to move to the company's new AI-focused Dia browser , though there are other (potentially better) choices depending on what you're looking for. Most data from Arc including Spaces, Favorites, pinned tabs, and folders as well as passwords, bookmarks, extensions, and history will transition automatically over to Dia, but if you're switching to a different platform entirely, you'll need to take what you can with you before Dec. 22. How to export your Arc data to a new browser Officially, Arc supports exporting Spaces and tabs only , and the resulting Export.md plain-text file is simply a list of links that you can open and bookmark in your new browser. MacOS users can initiate this process via Arc Settings Advanced Export Data and saving the file to a preferred location. On Windows, open the Arc menu, select Settings , and go to Export Spaces and tabs Export Data . To simply copy and paste every link from one folder, right-click the folder, select Copy All Links , and paste them wherever you'd like (select Copy All Links as Markdown to keep link titles on macOS). You can also save Easels as images by tapping the share icon Share Via... and selecting PNG . There's no formal process to export other Arc data. If you saved logins in Arc, now is a good time to start moving credentials over to a different platform. (Our top picks for password managers aren't tied to a single browser.) There are a few alternatives to Arc's official export process, which is highly manual and doesn't keep your folder structure intact. There are several third-party scripts available (for free) that can facilitate the transition as well as a paid extension called ArcEscape that can export folders and pinned tabs and import into another browser. The extension is available for Chrome, Edge, Brave, Vivaldi, and Firefox. According to Arc's FAQ, all user accounts will be deactivated on Dec. 22, and personal data will be deleted within 30 days of deactivation.", "date_str": "2026-10-27T14:00:00+00:00", "hash": "11cd747a7189c3ff", "title_fa": "چگونه داده های Arc خود را به یک مرورگر جدید صادر کنیم", "summary_fa": "اگر کاربر اختصاصی مرورگر Arc بوده اید، بالاخره زمان خداحافظی فرا رسیده است. شرکت مرورگر توسعه Arc را در سال 2025 متوقف کرد و تنها با به‌روزرسانی‌های امنیتی ادامه داد. همانطور که در اواخر هفته گذشته اعلام شد، Arc به طور رسمی در 22 دسامبر 2026 غروب می کند و به کاربران دو ماه فرصت می دهد تا داده های خود را به یک جایگزین انتقال دهند. یکی از گزینه ها این است که به مرورگر جدید Dia متمرکز بر هوش مصنوعی شرکت بروید، اگرچه بسته به آنچه به دنبال آن هستید، انتخاب های دیگری (به طور بالقوه بهتر) وجود دارد. بیشتر داده‌های Arc از جمله Spaces، Favorites، برگه‌ها و پوشه‌های پین‌شده، همچنین گذرواژه‌ها، نشانک‌ها، برنامه‌های افزودنی و تاریخچه به‌طور خودکار به Dia منتقل می‌شوند، اما اگر به طور کامل به پلتفرم دیگری تغییر مکان می‌دهید، باید قبل از ۲۲ دسامبر هر آنچه را که می‌توانید با خود ببرید. چگونه داده‌های Arc خود را به یک مرورگر جدید صادر کنیم به طور رسمی، Arc فقط از صادرات Spaces و برگه‌ها پشتیبانی می‌کند و فایل متنی ساده Export.md به سادگی فهرستی از پیوندهایی است که می‌توانید آن‌ها را باز کرده و در مرورگر جدید خود نشانک‌گذاری کنید. کاربران MacOS می توانند این فرآیند را از طریق Arc Settings Advanced Export Data و ذخیره فایل در مکان دلخواه آغاز کنند. در ویندوز، منوی Arc را باز کنید، تنظیمات را انتخاب کنید و به Export Spaces و برگه‌ها Export Data بروید. برای اینکه به سادگی هر پیوند را از یک پوشه کپی و جایگذاری کنید، روی پوشه کلیک راست کنید، Copy All Links را انتخاب کنید و هر کجا که می‌خواهید آن‌ها را جای‌گذاری کنید (برای حفظ عنوان پیوندها در macOS، Copy All Links را به‌عنوان Markdown انتخاب کنید). همچنین می توانید Easels را به عنوان تصویر با ضربه زدن روی نماد اشتراک", "image_url": "https://lifehacker.com/imagery/articles/01M5WZWMBKPBPF8NPFNMQ2MY91/hero-image.fill.size_1200x675.png", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۵ آبان • ۱۷:۳۰"}],
      media: [{"source": "Billboard", "title": "The Best 2026 Halloween Costumes, From Paris Hilton as Britney Spears to Kim Kardashian as North West", "link": "https://www.billboard.com/lists/best-halloween-costumes-paris-hilton-kim-kardashian/", "summary": "It s that time of year again: Halloween, which means a trick-or-treat bag s worth of celebrity costumes ranging from spooky to cutesy to pop culture-referencing. That includes the usual suspects, stars who ve long been showcasing their love of the holiday with increasingly elaborate looks. Paris Hilton returned with another Halloween tribute to her friend and pop icon Britney Spears which she premiered in photos shared exclusively with Billboard as well as a wholesome family dress-up borrowed from a beloved Disney princess movie. Janelle Monáe has also gone all out once again ahead of her annual Wondaween festival, and a costume triangle of sorts has emerged between Kim Kardashian, her daughter North West and Natalie Nunn. As for costumes specifically honoring something that happened in 2026, Owen Thiele and Benito Skinner are arguably the front runners with a two-person look that recreated one of the year s buzziest pop collaborations. (Whether you re a celebrity or not, there s still time to pull together a 2026-specific Halloween look here s some ideas Billboard put together recently referencing Bad Bunny s Super Bowl performance, Taylor Swift watching the New York Knicks and more.) With the next few days bringing more and more stumes leading up to the main event on Saturday (Oct. 31), Billboard is keeping track of all of the best celebrity looks. Whether you re searching for some last-minute inspo or simply want to check out what the biggest names in entertainment are doing for the holiday this year, keep reading to learn about the best Halloween costumes we ve seen below and keep checking back for updates!", "date_str": "2026-10-27T18:56:11+00:00", "hash": "edb12ba853160647", "title_fa": "بهترین لباس هالووین 2026، از پاریس هیلتون در نقش بریتنی اسپیرز تا کیم کارداشیان در نقش نورث وست", "summary_fa": "دوباره آن زمان از سال است: هالووین، که به معنای یک کیف با ارزش لباس های افراد مشهور است، از شبح وار گرفته تا جذاب و ارجاع به فرهنگ پاپ. این شامل مظنونان معمولی نیز می شود، ستاره هایی که مدت هاست عشق خود را به تعطیلات با ظاهری مفصل به نمایش می گذارند. پاریس هیلتون با یکی دیگر از ادای احترام هالووین به دوست و نماد پاپ خود بریتنی اسپیرز بازگشت که اولین بار در عکس هایی که به طور انحصاری با بیلبورد به اشتراک گذاشته شده بود و همچنین یک لباس خانوادگی سالم وام گرفته از یک فیلم شاهزاده خانم محبوب دیزنی. ژانل مونه همچنین یک بار دیگر قبل از جشنواره سالانه Wondaween خود تمام تلاش خود را کرده است و یک مثلث لباس بین کیم کارداشیان، دخترش نورث وست و ناتالی نون به وجود آمده است. در مورد لباس هایی که به طور خاص به افتخار اتفاقی که در سال 2026 رخ داده است، اوون تیله و بنیتو اسکینر مسلماً دونده های پیشرو با ظاهری دو نفره هستند که یکی از شلوغ ترین همکاری های پاپ سال را بازسازی کرده است. (چه یک سلبریتی باشید و چه نباشید، هنوز زمان برای جمع آوری یک نگاه ویژه به هالووین 2026 وجود دارد، اینجا چند ایده بیلبورد که اخیراً به اجرای Super Bowl Bad Bunny، تیلور سویفت در حال تماشای New York Knicks و غیره اشاره می کند.) با توجه به اینکه چند روز آینده رویداد اصلی بیشتر و بیشتر در مورد 3 شنبه برگزار می شود. همه از بهترین چهره های مشهور. چه در حال جستجو برای اطلاعات لحظه آخری هستید یا صرفاً می‌خواهید ببینید که بزرگترین نام‌های سرگرمی برای تعطیلات امسال چه می‌کنند، به خواندن ادامه دهید تا در مورد بهترین لباس‌های هالووین که در زیر دیده‌ایم بیاموزید و همچنان برای به‌روزرسانی‌ها بررسی کنید! پاریس هیلتون سنت", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/01-paris-hilton-halloween-2026-cr-brian-ziff-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۲۲:۲۶"}, {"source": "Billboard", "title": "Chvrches Drop New Single ‘Overthinker’ From First Album in Nearly 6 Years: Listen", "link": "https://www.billboard.com/music/music-news/chvrches-overthinker-all-the-kings-men-1236368874/", "summary": "Chvrches has released “Overthinker,” the second single from the band s upcoming fifth album, All the King’s Men , which is set to arrive Jan. 22 via independent label group Futures. Driven by propulsive synths, “Overthinker” explores complicated family relationships and depression. While lead single “Roses” tackled social issues, the new track takes a more personal approach: “Should I lie to you, keep my thoughts from you?” sings lead vocalist Lauren Mayberry at one point. “Not sure how you raised such a chronic overthinker.” Its release follows an invite-only, phone-free charity show at Assumption Studios the converted church which served as the recording location for the new album in Glasgow, Scotland, on Monday (Oct. 26). The band was joined on stage by Biffy Clyro frontman Simon Neil for three tracks, including a cover of Biffy’s 2007 single “Machines.” The band debuted eight new songs from All the King’s Men on stage, alongside performing 2013 breakthrough hit “The Mother We Share” and 2015’s “Clearest Blue,” which enjoyed a second wind four years ago when it soundtracked a pivotal scene in Netflix’s LGBTQ+ comedy-drama Heartstopper. Chvrches will perform another intimate gig at London s St Matthias Church on Thursday (Oct. 29). All the King’s Men will mark Chvrches’ first album in almost six years. The Scottish synthpop trio Mayberry, Iain Cook and Martin Doherty went on hiatus after their 2021 LP Screen Violence , which featured “How Not to Drown,” a collaboration with The Cure frontman Robert Smith. Chvrches will support the new record with an extensive North American tour beginning in February, followed by a run of shows across the U.K. and Ireland, wrapping up at London’s O2 Shepherd’s Bush Empire on May 6. The full list of dates and further ticketing information can be found via the band s website . All four of Chvrches’ previous records have landed in the top 10 of the U.K. s Official Albums Chart , with Screen Violence and 2015’s Every Open Eye both peaking at No. 4. The band s biggest U.S. chart success to date has been as the featured artist on Marshmello’s 2019 track “Here With Me,” which reached No. 31 on the Billboard Hot 100 . Listen to Chvurches Overthinker below:", "date_str": "2026-10-27T18:55:42+00:00", "hash": "bef9ea6a1fb6cabe", "title_fa": "Chvrches تک آهنگ جدید Overthinker را از اولین آلبوم پس از نزدیک به 6 سال منتشر کرد: گوش کنید", "summary_fa": "Chvrches \"Overthinker\" دومین تک آهنگ از پنجمین آلبوم آتی گروه، All the King's Men را منتشر کرده است که قرار است در 22 ژانویه از طریق گروه مستقل Futures منتشر شود. \"Overthinker\" که توسط ترکیبات پیشران هدایت می شود، روابط پیچیده خانوادگی و افسردگی را بررسی می کند. در حالی که تک آهنگ اصلی «رز» به مسائل اجتماعی می‌پردازد، آهنگ جدید رویکرد شخصی‌تری دارد: «آیا باید به شما دروغ بگویم، افکارم را از شما دور نگه دارم؟» لورن مایبری خواننده اصلی را در یک نقطه می خواند. \"مطمئن نیستم که چگونه چنین بیش از حد متفکر مزمنی را بزرگ کردی.\" انتشار آن به دنبال یک نمایش خیریه بدون تلفن و بدون دعوت در استودیو Assumption کلیسای تبدیل شده است که به عنوان محل ضبط آلبوم جدید در گلاسکو، اسکاتلند، در روز دوشنبه (26 اکتبر) عمل کرد. سایمون نیل، خواننده بیفی کلیرو، برای سه قطعه، از جمله کاور تک آهنگ Biffy «Machines» در سال 2007، به گروه روی صحنه پیوست. گروه هشت آهنگ جدید از All the King’s Men را روی صحنه اجرا کرد، در کنار اجرای موفقیت‌آمیز موفقیت‌آمیز سال ۲۰۱۳ «The Mother We Share» و «Clearest Blue» در سال ۲۰۱۵، که چهار سال پیش با موسیقی متن یک صحنه محوری در کمدی-درام LGBTQ+ نتفلیکس، از باد دوم لذت برد. چورچس روز پنجشنبه (29 اکتبر) یک کنسرت صمیمی دیگر را در کلیسای سنت ماتیاس لندن اجرا خواهد کرد. All the King’s Men اولین آلبوم چورچس پس از تقریباً شش سال است. سه گروه سینث پاپ اسکاتلندی میبری، ایین کوک و مارتین دوهرتی پس از LP Screen Violence در سال 2021، که «How Not To Drown» را که با همکاری رابرت اسمیت، خواننده گروه The Cure پخش می‌کرد، وقفه گرفتند. Chvrches با یک تور گسترده در آمریکای شمالی که از فوریه آغاز می شود، و پس از آن اجرای برنامه هایی در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/chvrches-cr-jody-evans-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "نتفلیکس"], "datetime_fa": "۵ آبان • ۲۲:۲۵"}, {"source": "Billboard", "title": "KATSEYE, MAZZEL Producer Taka Perry Talks Career From Sydney to Tokyo & Appeal of Japanese Music: Unbound Japan Interview", "link": "https://www.billboard.com/music/music-news/taka-perry-unbound-japan-interview-katseye-mazzel-producer-1236369084/", "summary": "Unbound Japan is an interview series featuring entertainment industry professionals based outside the country and those sending Japan’s music out into the world. This instalment features music producer Taka Perry. Born and raised in Australia to an American father and a Japanese mother, he built his career as a producer there before expanding his work to Japan. In 2024, “Touch” by global girl group KATSEYE, which he wrote and produced, became a massive hit. The 28-year-old producer spoke about his career and creative process in this interview with Billboard Japan and shared how Japanese music looks to him as someone born in Australia and raised on Western music culture. Your launched your career in Australia, where you’re from. I was born and raised in Canberra and lived there all the way through high school. Canberra is the capital, but it has a relatively small population. I’d wanted to do music ever since high school, but in Australia, most people who want to pursue music go to Sydney or Melbourne in order to do it. I chose Sydney and moved there shortly after graduating high school. When did you first become interested in music production? I played clarinet from elementary school, but in junior high I started teaching myself guitar because I wanted to be in a rock n roll band. From there I branched out into bass and piano, and formed a band with friends covering Red Hot Chilli Peppers and Nirvana. I wanted to record our own songs, and after my parents bought me a DAW for my 12th birthday, I got hooked on songwriting and production. I then gradually became more drawn to working behind the scenes than to being in a band. When did you start branching out to Japan? I started seriously thinking about working in Japan around 2019–20, right before COVID. I’d been a producer in Australia for four or five years by then and was getting some great results. But the industry there is limited in size, so once your career reaches a certain point, a lot of people move to L.A. or London, or more recently, South Korea. I speak Japanese and I’m familiar with Japanese culture, so I felt it would be a waste not to get involved in the Japanese scene. Back then, I looked up to JP THE WAVY and WILYWNKA, and started doing sessions in Japan with the goal of becoming a hip-hop beat-maker. I’d come to Japan three or four times a year, for three or four weeks each time. I’d DM artists, do sessions with them, then fly home. As I kept that up, I ended up with more work from Japan th", "date_str": "2026-10-27T18:49:19+00:00", "hash": "8b34394c31a14d54", "title_fa": "KATSEYE، تهیه کننده MAZZEL تاکا پری از سیدنی تا توکیو و جذابیت موسیقی ژاپنی: مصاحبه بی بند و بار در ژاپن صحبت می کند", "summary_fa": "Unbound Japan یک مجموعه مصاحبه است که متخصصان صنعت سرگرمی مستقر در خارج از کشور و کسانی که موسیقی ژاپن را به جهان می فرستند را نشان می دهد. این قسمت شامل تاکا پری، تهیه کننده موسیقی است. او که در استرالیا از پدری آمریکایی و مادری ژاپنی به دنیا آمد و بزرگ شد، پیش از گسترش کار خود به ژاپن، حرفه خود را به عنوان تهیه کننده در آنجا آغاز کرد. در سال 2024، \"لمس\" توسط گروه جهانی دختران KATSEYE، که او نوشت و تهیه کرد، به موفقیت بزرگی تبدیل شد. این تهیه کننده 28 ساله در این مصاحبه با بیلبورد ژاپن در مورد حرفه و روند خلاقیت خود صحبت کرد و به اشتراک گذاشت که چگونه موسیقی ژاپنی از نظر او به عنوان فردی متولد استرالیا و بزرگ شده با فرهنگ موسیقی غربی به نظر می رسد. شما کار خود را در استرالیا، جایی که اهل آن هستید، آغاز کردید. من در کانبرا به دنیا آمدم و بزرگ شدم و تا پایان دبیرستان در آنجا زندگی کردم. کانبرا پایتخت است، اما جمعیت نسبتا کمی دارد. من از دوران دبیرستان می خواستم موسیقی کار کنم، اما در استرالیا، اکثر افرادی که می خواهند موسیقی را دنبال کنند، برای انجام آن به سیدنی یا ملبورن می روند. سیدنی را انتخاب کردم و مدت کوتاهی پس از پایان دبیرستان به آنجا نقل مکان کردم. اولین بار از چه زمانی به تولید موسیقی علاقه مند شدید؟ من از دوران دبستان کلارینت می‌نواختم، اما در دوره راهنمایی شروع کردم به آموزش گیتار برای خودم چون می‌خواستم در یک گروه راک اند رول باشم. از آنجا به باس و پیانو منشعب شدم و با دوستان گروهی تشکیل دادم که Red Hot Chilli Peppers و Nirvana را پوشش می دادند. من می‌خواستم آهنگ‌های خودمان را ضبط کنم، و بعد از اینکه والدینم برای تولد 12", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Taka-Perry-Photo-Maho-Korogi.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۲۲:۱۹"}, {"source": "Billboard", "title": "Drake Lawsuit Over ‘Janice STFU’ Dropped By Accuser Less Than Two Weeks Later", "link": "https://www.billboard.com/pro/drake-janice-stfu-lawsuit-dropped-accuser/", "summary": "A high-profile lawsuit that accused Drake of stealing the chorus of his chart-topping single “Janice STFU” has been abruptly dropped by the accuser less than two weeks after it was filed. In a court filing on Tuesday (Oct. 27) obtained by Billboard , attorneys for Aviel Calev Hirschfield moved to voluntarily dismiss the stunning case , which claimed the smash hit Iceman track “shamelessly” copies an unpublished demo he allegedly sent to the song’s producers. Related Drake Sued Over ‘Janice STFU’: Songwriter Claims Chorus Is ‘Literally Identical’ to His Demo Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania No explanation was given in court filings, and the case was dropped “without prejudice,” meaning Hirschfield could refile it at some point in the future. Neither his attorneys nor Drake’s reps immediately returned requests for comment. The move came after Drake vehemently denied the accusations, calling them a “manufactured and baseless attempt to exploit Drake’s name.” Court documents show that the star’s reps believe Hirschfield fabricated evidence to support his claims. “Let us be absolutely clear: These allegations are categorically, unequivocally and completely denied, his reps wrote at the time. There is not one iota of truth to these accusations, and we reject every attempt to portray these claims as established facts.” The lawsuit, filed Oct. 16, was a big deal because “Janice STFU” was a big deal, spending two weeks atop the Billboard Hot 100 and 20 weeks at No. 1 on Billboard ‘s Hot Rap Songs tally, his longest-running reign on that chart. It was also an unusually egregious claim of infringement. Where some lawsuits claim a song merely sounds similar, Hirschfield s case claimed that he had hard proof he had written eight lines of lyrics that appeared verbatim in Drake’s song. He claimed Drake s track chorus was “literally identical” to his — “word-for-word, note-for-note, beat-by-beat, the exact same chorus.” But just 11 days after those claims were filed, they have now been dismissed.", "date_str": "2026-10-27T18:41:53+00:00", "hash": "41154994d0f319aa", "title_fa": "شکایت دریک در مورد «جانیس STFU» کمتر از دو هفته بعد توسط متهم رد شد", "summary_fa": "شکایتی پرمخاطب که دریک را متهم به دزدیدن گروه کر تک آهنگی «جانیس STFU» کرده بود که در صدر جدول قرار گرفته بود، کمتر از دو هفته پس از تشکیل آن، به طور ناگهانی توسط متهم کنار گذاشته شد. در یک پرونده دادگاه در روز سه شنبه (27 اکتبر) که توسط بیلبورد به دست آمد، وکلای آویل کالف هیرشفیلد به طور داوطلبانه اقدام به رد این پرونده خیره کننده کردند، که ادعا می کرد آهنگ موفق Iceman \"بی شرمانه\" یک نسخه نمایشی منتشر نشده را کپی می کند که گفته می شود او برای تهیه کنندگان آهنگ ارسال کرده است. دریک مرتبط به دلیل «جانیس STFU» شکایت کرد: ترانه‌سرا ادعا می‌کند که گروه کر «به معنای واقعی کلمه مشابه» نسخه نمایشی او است، کنی مک‌فرسون، ناشر کهنه‌کار موسیقی و یکی از بنیان‌گذاران Big Deal Music، در 71 سالگی درگذشت. \"بدون پیش داوری\"، به این معنی که هیرشفیلد می تواند آن را در مقطعی در آینده دوباره پر کند. نه وکلای او و نه نمایندگان دریک فوراً درخواست اظهار نظر نکردند. این اقدام پس از آن صورت گرفت که دریک به شدت این اتهامات را رد کرد و آنها را \"تلاشی ساختگی و بی اساس برای سوء استفاده از نام دریک\" خواند. اسناد دادگاه نشان می دهد که نمایندگان ستاره بر این باورند که هیرشفیلد شواهدی را برای حمایت از ادعاهای خود ساخته است. نمایندگان او در آن زمان نوشتند: «اجازه دهید کاملاً واضح بگوییم: این اتهامات به طور قاطع، صریح و کاملاً رد شده است. این اتهامات یک ذره حقیقت ندارد و ما هر تلاشی برای نشان دادن این ادعاها به عنوان حقایق ثابت را رد می کنیم. شکایتی که در 16 اکتبر ثبت شد، یک معامله بزرگ بود، زیرا \"Janice STFU\" یک معامله بزرگ بود، و دو هفته در صدر 100 بیلبورد داغ و 20 هفته در رتبه اول", "image_url": "https://www.billboard.com/wp-content/uploads/2026/02/2089852875-e1770920504696.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "موسیقی"], "datetime_fa": "۵ آبان • ۲۲:۱۱"}, {"source": "Billboard", "title": "ABC’s ‘Celebration’ of Dolly Parton and Her ‘Eternal’ Contributions", "link": "https://www.billboard.com/music/country/abcs-celebration-of-dolly-parton-1236369068/", "summary": "When Dolly Parton decided against having a memorial at her death, it meant the world had to find other ways to remember her. Dolly Parton Day on Sept. 25, in honor of “9 to 5”; a parade of artists covering her songs in concert; and an expected run on Parton costumes for Halloween all accomplish that, as did ABC’s Oct. 21 special, CMA Presents I Will Always Love You: A Celebration of Dolly Parton . With her trademark butterfly imagery weaved into the set and graphics, it provided viewers — and her fellow artists — an opportunity to embrace Parton in all her glory: a music superstar, but also one of country music’s best global ambassadors, a singular vocal stylist, a vivid songcrafter, a multi-faceted entertainer, a limitless dreamer — and, for many, a moral compass. “Somewhere along the way, Dolly became more than a singer or a songwriter or an entertainer,” Reba McEntire said. “She became hope. She became possibility — to the little girl growing up with nothing, who dared to dream about something bigger; to the person who felt different and wondered if there was a place in this world for them; to the dreamer who was told their dreams were too big. She made people believe there was room for them. She just made you feel welcome. She made you feel seen.” A cavalcade of artists, including McEntire, Vince Gill, Ella Langley, Brad Paisley, Carly Pearce, Kristin Chenoweth, Carrie Underwood, Lady A, Darius Rucker and more joined forces to honor the life, career and philanthropic impact Parton’s career has had. The 14-song set list provided a nifty overview of the breadth of her musical influences, veering from mountain music to her key country efforts to her crossover material and to the spiritual themes that invariably informed her work. “This was a celebration of an undeniable force of nature,” Gill said. “Her ability to bring people together from all walks of life is so needed these days.” Beyond the evening’s performers and presenters, video tributes poured in from Oprah Winfrey, Julia Roberts, Sabrina Carpenter, Goldie Hawn and U2’s Bono, who recalled hearing her performance of “Torn,” a track that appears on the band’s Carnaval de Luz , due Nov. 13. It proved to be the final recording of her career. “When I heard her vocal, I was speechless, which is rare for an Irishman,” Bono said. “It was like she was singing herself to somewhere else. She once told me when our schedules didn’t align, ‘Unfortunately, Bono, I have more love than time.’ More love than time ", "date_str": "2026-10-27T18:40:27+00:00", "hash": "96a839b676428638", "title_fa": "\"جشن\" دالی پارتون و مشارکت های \"ابدی\" او از شبکه ABC", "summary_fa": "وقتی دالی پارتون تصمیم گرفت در هنگام مرگش یک یادبود برگزار نکند، به این معنی بود که جهان باید راه‌های دیگری برای یادآوری او پیدا می‌کرد. روز دالی پارتون در 25 سپتامبر، به افتخار \"9 تا 5\"؛ رژه هنرمندانی که آهنگ های او را در کنسرت پوشش می دهند. و اجرای پیش‌بینی‌شده لباس‌های پارتون برای هالووین همگی این کار را انجام می‌دهند، همانطور که ویژه برنامه ABC در 21 اکتبر، CMA Presents I Will Always Love You: A Celebration of Dolly Parton. با تصاویر پروانه‌ای علامت تجاری او که در صحنه و گرافیک قرار گرفته بود، به بینندگان - و هنرمندان همکارش - فرصتی داد تا پارتون را با تمام شکوهش در آغوش بگیرند: یک سوپراستار موسیقی، اما همچنین یکی از بهترین سفیران موسیقی کانتری، یک سبک آواز بی‌نظیر، یک ترانه‌سرا سرزنده، یک هنرمند چندوجهی، یک سرگرم‌کننده بی‌محدودیت، یک سرگرم‌کننده با اخلاق، و یک سرگرم‌کننده بی‌حساب. ربا مک انتایر گفت: «در طول مسیر، دالی بیش از یک خواننده، ترانه سرا یا سرگرم کننده شد. او به امید تبدیل شد. او به امکان تبدیل شد - برای دختر کوچکی که بدون هیچ چیز بزرگ شده بود، که جرات داشت در مورد چیزی بزرگتر رویاپردازی کند؛ برای کسی که احساس متفاوتی داشت و فکر می کرد آیا جایی در این دنیا برای آنها وجود دارد یا خیر؛ برای رویاپردازی که به او گفته شده بود رویاهایش خیلی بزرگ هستند. او باعث شد مردم باور کنند که جایی برای آنها وجود دارد. او فقط باعث می شد احساس کنید که خوش آمدید. او باعث شد احساس کنید دیده شده اید.» مجموعه ای از هنرمندان، از جمله مک انتایر، وینس گیل، الا لنگلی، برد پیزلی، کارلی پیرس، کریستین چنووث، کری آندروود، لیدی A، داریوس راکر و افراد دیگر برای ارج نهادن به زندگی، حرفه و تأثیر بشردوستانه حرفه پارتون به هم پیوستند. فهرست مجموعه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Dolly-Parton-Glastonbury-Getty-Images.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۲۲:۱۰"}, {"source": "Billboard", "title": "John Anderson’s Music Surges in Streams, Airplay & Sales Following His Death", "link": "https://www.billboard.com/music/chart-beat/john-anderson-music-surges-streams-airplay-sales-after-death-1236369076/", "summary": "John Anderson s unmistakable voice is back in the spotlight following the country legend s death Oct. 21 at age 71. With fans revisiting the Country Music Hall of Famer’s nearly five-decade catalog, three of his signature hits land on Billboard ’s Digital Song Sales chart, while his music has also made sharp gains in streaming and at country radio. Related John Anderson’s Biggest Billboard Hits: ‘Swingin’,’ ‘Straight Tequila Night’ More John Anderson, Country Music Hall of Fame Inductee, Dies at 71 The Great And Unmatched’: John Anderson Remembered by Blake Shelton, Tim McGraw More “Seminole Wind,” which reached No. 2 on Hot Country Songs in 1992, leads Anderson’s three entries on the Oct. 31-dated Digital Song Sales chart, landing at No. 9 with 2,000 copies sold in the United States Oct. 16-22, according to Luminate. Two former Hot Country Songs No. 1s join it on the sales list: 1992’s “Straight Tequila Night,” at No. 14, and 1983’s “Swingin’,” at No. 20. (All are up from nominal sums the week before.) The renewed interest extends to streaming, where Anderson’s catalog generated 7.2 million plays in the tracking week, nearly doubling its sum the previous week. On-demand streams more than doubled, while programmed streams rose 14%. “Seminole Wind” led in the metric, with 1.5 million streams (up 56%), followed by “Straight Tequila Night” (1.4 million, up 49%) and “Swingin’” (1.2 million, up 44%). Two more ‘90s hits surged — “Money in the Bank” (up 230%) and “I Wish I Could Have Been There” (184%) — while 1982’s “Wild and Blue,” Anderson’s first of five Hot Country Songs No. 1, jumped 165%. (Oct. 16-22 includes five days before Anderson’s passing, so totals reflect activity that entire week rather than solely the response to his death.) Country radio has also paid tribute to Anderson. Across Billboard ’s Country Airplay panel, his songs drew 357 spins Oct. 16-22, up 166%, according to Mediabase. The number of titles receiving airplay swelled from seven to 18, while stations playing at least one song of his increased from 72 to 94. “Straight Tequila Night” led with 138 spins, nearly quadrupling its previous-week total, while “Seminole Wind” followed with 79, up more than fivefold. Radio’s remembrance wasn t limited to the familiar favorites. Eleven Anderson recordings that went unplayed on the panel the previous week returned, including “Black Sheep,” “Chicken Truck,” “1959” and “I Just Came Home to Count the Memories.” The strongest response came from statio", "date_str": "2026-10-27T18:40:07+00:00", "hash": "e59535e0c19caca0", "title_fa": "موسیقی جان اندرسون پس از مرگش در جریان، پخش و فروش افزایش یافت", "summary_fa": "صدای غیرقابل انکار جان اندرسون پس از مرگ اسطوره کانتری در 21 اکتبر در سن 71 سالگی دوباره در کانون توجه قرار گرفت. با بازدید مجدد طرفداران از کاتالوگ تقریباً پنج دهه ای تالار موسیقی کانتری، سه مورد از امضاهای او در نمودار فروش آهنگ دیجیتال بیلبورد قرار گرفتند، در حالی که موسیقی او در رادیو کانتری نیز پیشرفت چشمگیری داشته است. مرتبط‌ترین پرفروش‌های بیلبورد جان اندرسون: «Swingin»، «Straight Tequila Night» بیشتر جان اندرسون، عضو تالار مشاهیر موسیقی کانتری، در سن 71 سالگی درگذشت بزرگ و بی‌همتا: جان اندرسون به یاد بلیک شلتون، تیم مک‌گرو. بر اساس گزارش Luminate، سه اثر اندرسون در جدول فروش آهنگ دیجیتال با تاریخ 31 اکتبر، پیشتاز است و با فروش 2000 نسخه در ایالات متحده در 16 تا 22 اکتبر در رتبه نهم قرار دارد. دو آهنگ سابق Hot Country Songs در لیست فروش به آن می‌پیوندند: «شب تکیلا مستقیم» در سال 1992، در رتبه 14، و «Swingin» در سال 1983، در رتبه 20. (همه از مبالغ اسمی هفته قبل افزایش یافته‌اند.) میلیون‌ها نفر از پخش‌کننده‌ها و علاقه‌مندی‌ها به پخش‌های جدید افزایش می‌یابد. هفته ردیابی، که مجموع آن را در هفته قبل تقریبا دو برابر کرده است. جریان های درخواستی بیش از دو برابر شد، در حالی که جریان های برنامه ریزی شده 14 درصد افزایش یافتند. «Seminole Wind» با 1.5 میلیون استریم (افزایش 56 درصد) در رتبه اول قرار گرفت و پس از آن «Straight Tequila Night» (1.4 میلیون، 49 درصد افزایش) و «Swingin» (1.2 میلیون، 44 درصد افزایش) قرار گرفتند. دو آهنگ دیگر در دهه 90 افزایش یافت - \"Money in the Bank\" (230٪ افزایش) و \"I Wish I Could Have Been There\" (184٪) - در حالی که \"Wild and Blue\" محصول 1982، اولین آهنگ از پنج آهنگ Hot Country، شماره 1 اندرسون، 165٪ افزایش یافت. (اکتبر 16-22 شامل پنج روز قبل", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/john-anderson-2026-1800-cr-alysse-gafkjen.jpg?w=945", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۲۲:۱۰"}, {"source": "Deadline", "title": "Emma Parks, Peyton Elizabeth Lee, Conor Sherry & Lesley Ann Warren Wrap On Coming-Of-Age Film ‘Dirty Towel’", "link": "https://deadline.com/2026/10/emma-parks-peyton-elizabeth-lee-conor-sherry-star-dirty-towel-1237206375/", "summary": "EXCLUSIVE: Cousin filmmakers Callie Carpinteri and Emma Parks have wrapped on Dirty Towel, a feature expansion of their same-name Tribeca short, starring Parks (The Short Game), Kristen Connolly (The Summer I Turned Pretty), Peyton Elizabeth Lee (Prom Pact), Conor Sherry (Snack Shack), Sandrine Holt (Your Friends and Neighbors), and Oscar nominee Lesley Ann Warren (Victor/Victoria). [ ]", "date_str": "2026-10-27T18:42:46+00:00", "hash": "d199e1f4eece1886", "title_fa": "اما پارکس، پیتون الیزابت لی، کانر شری و لسلی آن وارن در فیلم «حوله کثیف» به سن بلوغ می‌رسند.", "summary_fa": "انحصاری: کالی کارپینتری و اما پارکس، فیلمسازان پسر عموی خود، فیلم «حوله کثیف» را به تصویر کشیده اند، که بسط فیلم کوتاهی به همین نام «ترایبکا» است، با بازی پارکس (بازی کوتاه)، کریستن کانولی (تابستان که زیبا شدم)، پیتون الیزابت لی (پروم پکت)، اس فریناک شری (اس فریناک شری)، اس. Neighbors) و نامزد اسکار لسلی آن وارن (ویکتور/ویکتوریا). [ ] این فیلم مستقل به بلوغ توسط این دو نفر نوشته و تهیه شده است و اولین کارگردانی بلند کارپینتری را نشان می دهد. در هفته های منتهی به فارغ التحصیلی دبیرستان اتفاق می افتد و رابطه پیچیده بین چارلی (پارک) و مادرش الیزابت را دنبال می کند. در حالی که چارلی به دنبال رابطه جنسی، استقلال و شرم نسلی است که او را شکل داده است، الیزابت مجبور می شود با آسیب های روح ه آن را تفسیر می‌کنند. این حکم اهمیت دارد زیرا جایزه ویژه DGA یکی از معتبرترین بازیگران اسکار", "image_url": "https://variety.com/wp-content/uploads/2026/10/MCDYOCA_EC147.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۵ آبان • ۲۱:۴۵"}, {"source": "Variety", "title": "Led by ‘Money Heist’ Star Itziar Ituño, Eco-Thriller ‘Patagonia’ Has Movistar Plus Betting on a Latin America-Spain Creative Bridge", "link": "https://variety.com/2026/film/global/itziar-ituno-movistar-latin-america-patagonia-eco-thriller-1236931263/", "summary": "Spain’s Movistar Plus continues to double down on its strategies to further amplify Spanish series and storytelling internationally with the world premiere of the highly anticipated eco-thriller “Patagonia.” Bowing at the upcoming South International Series Festival in Cádiz, the series is the latest major co-production to be boosted by the Spanish streamer and the fruit [ ]", "date_str": "2026-10-27T18:09:44+00:00", "hash": "d03058dbf7a8d201", "title_fa": "به رهبری ایتزیار ایتونو، ستاره «سرقت پول»، اکو هیجان انگیز «پاتاگونیا» موویستار پلاس روی پل خلاق آمریکای لاتین-اسپانیا شرط بندی کرده است.", "summary_fa": "موویستار پلاس اسپانیا همچنان استراتژی‌های خود را برای تقویت بیشتر سریال‌های اسپانیایی و داستان سرایی در سطح بین‌المللی با اکران جهانی فیلم موردانتظار اکو هیجان‌انگیز «پاتاگونیا» ادامه می‌دهد. این مجموعه با تعظیم در جشنواره بین‌المللی سریال‌های جنوبی آتی در کادیز، آخرین محصول مشترک بزرگی است که توسط استریمر اسپانیایی تقویت می‌شود. در سطح بین المللی با اولین نمایش جهانی فیلم موردانتظار اکو هیجان انگیز \"پاتاگونیا\". «پاتاگونیا» به رهبری ایتزیار ایتونو، ستاره «سرقت پول»، سریالی شش قسمتی است که از آلیشیا ایتونیو، مادری مستاصل است که از کشور باسک به منطقه اصلی شیلی سفر می کند تا پسر نوجوان گمشده خود، نوح (یونای آرانا) را پیدا کند. همانطور که جستجو ادامه دارد، آلیسیا باید درگیری های خانوادگی خود را در حین برخورد با اسرار جنگل باستانی و یک شبکه خطرناک چوب بری غیرقانونی هدایت کند. این سریال توسط نویسندگان شیلیایی ماریا النا وود و پاتریسیو پریرا ساخته شده است. اولی پشت سر برندگان جایزه پلاتینو بهترین سریال «News of a Kidnapping» و «Dignity» قرار دارد، در حالی که دومی تهیه‌کننده «مری مایک» است. او می افزاید: «نمی خواستم سریال بحران آب و هوا را توضیح دهد. من ترجیح می‌دهم این کار باعث ایجاد حس ناراحتی طولانی‌مدت در بینندگان شود. شاید سوال واقعی این نباشد که ما با جنگل چه می‌کنیم، بلکه سوال اصلی این است که چه بخشی از ما همراه با آن ناپدید می‌شود.»", "image_url": "https://variety.com/wp-content/uploads/2026/10/VARIETY-SIZING-29.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۲۱:۳۹"}, {"source": "Variety", "title": "South International Series Festival: ‘American Hostage,’ Ronan Bennett, Great European Series and Andalusia’s TV Build", "link": "https://variety.com/2026/tv/global/sisf-american-hostage-ronan-bennett-alvaro-morte-1236932199/", "summary": "Opening on Oct. 30 with “American Hostage,” honoring “Toy Boy” showrunner Ronan Bennett and “Money Heist” star Alvaro Morte, the fourth edition of South International Series Festival weighs in with a mouthwatering fiction competition, dominated by series from Europe, and an ever stronger Andalusian presence. “The aim of the festival is to keep growing,” says [ ]", "date_str": "2026-10-27T18:04:48+00:00", "hash": "f85052da62416af4", "title_fa": "جشنواره بین‌المللی سریال‌های جنوبی: گروگان آمریکایی، رونان بنت، سریال بزرگ اروپایی و ساخت تلویزیون اندلس", "summary_fa": "چهارمین دوره جشنواره بین‌المللی مجموعه‌های جنوبی که در 30 اکتبر با «گروگان آمریکایی»، به افتخار رونان بنت، مجری برنامه «پسر اسباب‌بازی» و آلوارو مورته، ستاره «سرقت پول» افتتاح می‌شود، با یک رقابت داستانی مهیج، تحت سلطه سریال‌هایی از اروپا، و حضور قوی‌تر آندلسی همراه است. [ ] که از 30 اکتبر تا نوامبر برگزار می شود، می گوید: «هدف جشنواره ادامه رشد است. 4، SISF به Movistar Plus، «Patagonia» و «The Center Season 2»، «Infamy» از HBO Max و «Stepping Up» از Channel 4 که در 30 اکتبر با «گروگان آمریکایی» افتتاح می‌شود، به افتخار رونان بنت، مجری برنامه «پسر اسباب‌بازی» و ستاره «Money Heist» از چهار جشنواره بین‌المللی موریتی، ادای احترام می‌کند. مسابقه داستانی مهیج، تحت سلطه سریال های اروپایی، و حضور قوی تر آندلس. کارلز مونتیل کارگردان می گوید: «هدف جشنواره ادامه رشد است. یکی از محورهای رشد «حوزه بین المللی» است و دیگری «ارتباط صنعت اندلس با بقیه اسپانیا و خارج از کشور». داستان های مرتبط مایکلا جائه رودریگز جایزه صدای دید APLA Health را در AIDS Walk Los Angeles دریافت می کند (اختصاصی) Rosie O Donnell و Kristin Chenoweth Join Dance Moms Parody Musical Reading (اختصاصی) در حال حاضر در هر دو مورد بسیار دیده شده است، در حالی که به نظر می رسد از Spain حمایت شده است. مونتیل می افزاید: «ما قبلاً به سطح مشخصی از شناخت از سوی تولیدکنندگان اسپانیایی، پخش کننده های اسپانیایی، پلتفرم های اسپانیایی و سرویس های استریم رسیده ایم که ما را جشنواره ای جذاب می دانند.", "image_url": "https://variety.com/wp-content/uploads/2025/05/Still-Breathing-Credit-Erik-Svensson_-photo-Agnete-Brun-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۵ آبان • ۲۱:۳۴"}, {"source": "Billboard", "title": "Malcolm Spellman & Glasses Malone Talk ‘The Drop: A Snowfall Saga,’ The Importance of Authenticity & What to Expect in the Season Finale", "link": "https://www.billboard.com/culture/tv-film/malcolm-spellman-glasses-malone-the-drop-interview-1236366514/", "summary": "Spin-offs of popular television shows rarely work, but The Drop: A Snowfall Saga is an exception. The eight-episode series picks up about four years after its predecessor left off, but now instead of following the crew as they navigate the 80s crack epidemic, we follow them as they try to conquer the rap game during the early days of the genre s commercial viability. The story follows Wanda (played by Gail Bean) after her and Leon (played by Isaiah John) get back from Ghana. She s cleaned herself up after being addicted to crack and is working on fixing her reputation by legitimizing herself as a record executive during the early 90s. But what makes The Drop impressive is that it s also a family drama, and highlights the nuances of L.A. gang culture. During a specific scene, the audience sees Artillery (played by Simmie Buddy Sims III) holing up in a Crip hood after bring chased by the cops — something consultant Glasses Malone commended showrunner Malcolm Spellman for being able to pull off on screen. Spellman understands that a Blood could be in a house with Crips, like when Artillery s grandparents live in a Crip neighborhood, he tells me over Zoom. You see him in a house full of Crips, and it s all love. That situation isn t this astronomical end of the world thing. Malcolm Spellman hails from the Bay, but has been in the L.A. area for about 30 years, and is old enough to remember 90s Southern California — which, of course, influenced his perspective. Motherf—kers were not around to see what it was like to be a big time D-Boy in 1991; even Glasses is too young to have seen what the f—k it was like, he says about those days. I m old enough that I was hanging out with them dudes. They was motherf—king stars. The D-boys was for real bigger stars than the rappers. Most of America was still not really f—king with hip-hop. The Drop: A Snowfall Saga will surprise you. It s more than just a show about L.A. s rap scene during the early 90s. It s also a show with a lot of heart. Check out Billboard s conversation with Spellman and Malone below, before tonight s (Oct. 27) finale airs. I gotta be honest, The Drop has been better than I expected it to be. You never really know if you re going to like a spin-off or not. I originally thought it was going to be about Leon and Wanda s experience in Ghana — so how did we instead get to the story of the record industry during early 90s L.A.? Malcolm Spellman: So, before I even came on, the original showrunners and FX wan", "date_str": "2026-10-27T17:53:25+00:00", "hash": "4eab5c479f9012ac", "title_fa": "Malcolm Spellman & Glasses Malone Talk «The Drop: A Snow Fall Saga»، اهمیت اصالت و آنچه در فصل پایانی باید انتظار داشت", "summary_fa": "اسپین آف برنامه های تلویزیونی محبوب به ندرت کار می کند، اما The Drop: A Snowfall Saga یک استثنا است. این مجموعه هشت قسمتی حدوداً چهار سال پس از پایان نسخه قبلی خود شروع می‌شود، اما اکنون به‌جای تعقیب خدمه در جریان اپیدمی کرک دهه 80، آنها را دنبال می‌کنیم، زیرا آنها سعی می‌کنند بازی رپ را در روزهای اولیه توسعه تجاری این ژانر تسخیر کنند. داستان به این صورت است که واندا (با بازی گیل بین) پس از بازگشت او و لئون (با بازی آیزایا جان) از غنا. او پس از معتاد شدن به کراک، خود را پاکسازی کرده است و با مشروعیت بخشیدن به خود به عنوان یک مدیر اجرایی در اوایل دهه 90، روی بهبود شهرت خود کار می کند. اما چیزی که The Drop را چشمگیر می کند این است که یک درام خانوادگی نیز هست و تفاوت های ظریف فرهنگ باند لس آنجلس را برجسته می کند. در طول یک صحنه خاص، تماشاگران توپخانه (با بازی سیمی بادی سیمز III) را می‌بینند که پس از تعقیب پلیس، در یک کلاه کریپ فرو رفته است - چیزی که مشاور گلس مالون از مالکوم اسپلمن مجری برنامه تمجید کرد که می‌توانست آن را روی صفحه نمایش دهد. اسپلمن می‌داند که یک خون می‌تواند در خانه‌ای با کریپس باشد، مانند زمانی که پدربزرگ و مادربزرگ توپخانه در محله کریپ زندگی می‌کنند، او از طریق زوم به من می‌گوید. شما او را در خانه ای پر از کریپس می بینید و همه اش عشق است. این وضعیت این پایان نجومی جهان نیست. مالکوم اسپلمن اهل خلیج است، اما حدود 30 سال در منطقه لس آنجلس بوده است و به اندازه کافی بزرگ است که دهه 90 کالیفرنیای جنوبی را به یاد بیاورد - که البته بر دیدگاه او تأثیر گذاشت. مادرف-کرها در اطراف نبودند تا ببینند که در سال", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/the-drop-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۵ آبان • ۲۱:۲۳"}, {"source": "Billboard", "title": "NFL Commissioner Roger Goodell Says He Requested Jay-Z Take Super Bowl Stage ‘Whenever the Moment Felt Right’", "link": "https://www.billboard.com/music/rb-hip-hop/jay-z-super-bowl-halftime-show-headliner-roger-goodell-request-1236368900/", "summary": "GOAT s out the bag. Jay-Z will headline the Super Bowl LXI Halftime Show for the first time in his historic career on Feb. 14, 2027, at SoFi Stadium in Los Angeles. But in the NFL s announcement on Monday (Oct. 26), commissioner Roger Goodell revealed Jay-Z headlining was going to happen sooner or later. Related Jay-Z Will Be the Same Age as This Rock Legend When He Headlines the Super Bowl LXI Halftime Show Jay-Z s Super Bowl LXI Halftime Show: Our Dream Setlist Here s How Fans Are Reacting to Rumors of Jay-Z Headlining Super Bowl LXI Halftime Show: He Just Pulled a Dick Cheney In the league s press release, Goodell shared that when the NFL entered a partnership with Roc Nation to serve as the live music entertainment strategist in 2019, his one request was that Jay eventually take the Super Bowl stage. When we first reached an agreement with Roc Nation to produce the show, I had just one request: that Jay-Z take the stage himself one day, whenever the moment felt right to him, Goodell said in a statement. I couldn t be more excited for fans around the world to experience the artistry, creativity and cultural impact he will bring to the Super Bowl stage. View this post on Instagram Jay has played an integral role in reshaping the Super Bowl Halftime Show lineup, including sets from Rihanna , The Weeknd, Kendrick Lamar, Usher , Bad Bunny, Dr. Dre and Snoop Dogg and more under his reign, which has netted Jay three Primetime Emmy Award wins for codirecting the halftime shows. Hov and Roc Nation signed an extension with the NFL in 2024 to continue the partnership with the league. The NFL s announcement was made during halftime of Monday Night Football s matchup between the Philadelphia Eagles and Dallas Cowboys on Monday, which was soundtracked by Jay s Public Service Announcement (Interlude). Prior to that, there had been mounting speculation that Jay-Z would be the pick for the Super Bowl LXI Halftime Show , which was first reported by Puck on Oct. 20. The Brooklyn rap deity has been back outside this year. He performed a star-studded Yankee Stadium trifecta in July, which was followed by shows in Paris, London and a pair of concerts in Los Angeles on Oct. 23 and Oct. 24.", "date_str": "2026-10-27T17:49:15+00:00", "hash": "a73ba5b7d4533474", "title_fa": "راجر گودل، کمیسر NFL می‌گوید که از جی زی درخواست کرده است که در مرحله سوپربول حضور داشته باشد «هر زمان که لحظه مناسبی بود»", "summary_fa": "بز از کیسه خارج شد. Jay-Z در 14 فوریه 2027، در استادیوم SoFi در لس آنجلس، برای اولین بار در کار تاریخی خود، سریال Super Bowl LXI Halftime Show را تیتر خواهد کرد. اما در اعلامیه NFL در روز دوشنبه (26 اکتبر)، کمیسر راجر گودل فاش کرد که عنوان Jay-Z دیر یا زود اتفاق می‌افتد. Jay-Z مرتبط با این افسانه راک هم سن و سالی خواهد بود وقتی که او در نیمه اول Super Bowl LXI Super Bowl LXI Halftime Show Jay-Z s Super Bowl LXI Halftime Show: مجموعه رویای ما در اینجا نحوه واکنش طرفداران به شایعات Jay-Z Headlining Super Bowl LXI LXI Halftime Show Good in the Lick Dick, Dis Chellney NFL با Roc Nation وارد همکاری شد تا به عنوان استراتژیست سرگرمی موسیقی زنده در سال 2019 خدمت کند، یکی از درخواست های او این بود که جی در نهایت روی صحنه Super Bowl برود. گودل در بیانیه‌ای گفت: وقتی برای اولین بار با راک نیشن برای تهیه‌کنندگی برنامه به توافق رسیدیم، من فقط یک درخواست داشتم: اینکه جی زی خودش روزی روی صحنه برود، هر زمان که برای او مناسب بود. من نمی‌توانم برای طرفداران در سراسر جهان هیجان‌زده‌تر باشم تا هنر، خلاقیت و تأثیر فرهنگی را که او در صحنه Super Bowl به ارمغان می‌آورد، تجربه کنند. مشاهده این پست در اینستاگرام جی نقش مهمی در شکل‌دهی مجدد مجموعه Super Bowl Halftime Show، از جمله مجموعه‌هایی از Rihanna، The Weeknd، Kendrick Lamar، Usher، Bad Bunny، دکتر Dre و Snoop Dogg و موارد دیگر تحت سلطنت او داشته است، که باعث شده است Jay سه نمایش نیمه‌وقت امی را برای کارگردانی مشترک برنده شود. Hov and Roc Nation در سال 2024 با NFL تمدید کردند تا به همکاری با لیگ ادامه دهند. اعلام NFL در نیمه بازی دوشنبه شب فوتبال بین فیلادلفیا ایگلز و دالاس کابوی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/1465385202-e1793119164729.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۲۱:۱۹"}, {"source": "Billboard", "title": "Shane McAnally Reflects on His Record-Breaking 11 CMA Song of the Year Nominations: ‘For a Songwriter, There’s No Bigger Acknowledgement’", "link": "https://www.billboard.com/lists/shane-mcanally-cma-song-of-the-year-nominations-record/", "summary": "Shane McAnally , who has written hits for Sam Hunt, Kenny Chesney, Old Dominion, Kacey Musgraves and many more, can pinpoint the exact moment when he knows a song is a keeper, as he shifts through snippets of lyrics and melodies, piecing them together in a way that he hopes will grab listeners’ heartstrings. “There s always a phrase or something in a write where I go, ‘Okay, we’ve got it,’” McAnally tells Billboard. “It’s almost always indicative of whether or not a song is going to get recorded, or if anyone’s going to care. In all the songs we’ve done, I know those moments. In [Chesney’s] ‘American Kids,’ it was definitely the line, ‘A little messed up, but we re all alright.’ Once we had that, the rest just came together.” McAnally’s instincts have been spot-on. This year, McAnally earned his 11th CMA song of the year nomination, for Musgraves’ “Dry Spell” — and in the process, broke a tie for the record he previously held alongside Country Music Hall of Famer Alan Jackson. It marks a full-circle moment for the Texas creative who grew up immersed in country music, and who launched his country music career as an artist before finding success as a songwriter. “It’s such an honor,” McAnally says of roping his 11th CMA song of the year nomination. “It’s very cool, especially because I grew up obsessed with the CMAs, and so, for a songwriter, there’s not really a bigger acknowledgement than song of the year.” “That’s where I first remember seeing songwriters,” he adds. “I remember when Cindy Walker was inducted into the [Country Music] Hall of Fame [in 1997]. That’s so emblazoned into my brain because I thought, ‘Oh, she wrote “You Don’t Know Me.” She wrote these songs.’ They did a big Hall of Fame induction for her, and she had this famous speech, and I remember thinking, ‘Wow, that’s a job, songwriting.’” McAnally’s first major cut as a songwriter was a stone-cold country ballad recorded by Lee Ann Womack, “Last Call,” which became a top 15 hit on Billboard ’s Hot Country Songs chart in 2008. By contrast, his first Billboard No. 1 on that same chart was Kenny Chesney’s brooding, pop-polished 2010 single “Somewhere With You.” He’s continued showcasing his musical range as a writer on songs for artists including OneRepublic, Aloe Blacc, Midland and Dierks Bentley. In 2013, the first year McNally was nominated for CMA song of the year, he scored not one, but two nominations, for Musgraves’ “Merry Go ‘Round” and Miranda Lambert’s “Mama’s Broken Heart.” This ye", "date_str": "2026-10-27T17:38:44+00:00", "hash": "2ce5e2d0b56ab7f3", "title_fa": "شین مک‌آنالی در مورد 11 نامزدی آهنگ سال CMA که رکوردشکن است، فکر می‌کند: «برای یک ترانه‌سرا، قدردانی بزرگ‌تری وجود ندارد».", "summary_fa": "شین مک‌آنالی، که برای سام هانت، کنی چسنی، Old Dominion، Kacey Musgraves و بسیاری دیگر آهنگ‌های موفق نوشته است، می‌تواند دقیقاً لحظه‌ای را مشخص کند که می‌داند آهنگی نگهبان است، زیرا او در میان قطعاتی از اشعار و ملودی‌ها جابه‌جا می‌شود و آنها را به گونه‌ای کنار هم می‌چسباند که امیدوار است قلب شنوندگان را جذب کند. مک‌آنالی به بیلبورد می‌گوید: «همیشه یک عبارت یا چیزی در نوشته‌ای که من می‌روم وجود دارد، «باشه، متوجه شدیم». \"تقریبا همیشه نشان دهنده این است که آیا قرار است آهنگی ضبط شود یا نه، یا کسی به آن اهمیت می دهد. در تمام آهنگ هایی که ما اجرا کرده ایم، من آن لحظات را می شناسم. در \"بچه های آمریکایی\" [چسنی] قطعاً این جمله بود: \"کمی بهم ریخته، اما همه ما خوب هستیم.\" وقتی این کار را انجام دادیم، بقیه به هم رسیدند.\" غرایز مک آنالی کاملاً مشخص بوده است. امسال، مک‌آنالی یازدهمین آهنگ سال خود را در CMA برای «طلسم خشک» ماسگریوز به دست آورد - و در این روند، رکوردی را که قبلاً در کنار تالار مشاهیر کانتری آلن جکسون داشت، شکست. این یک لحظه کامل برای خلاق تگزاسی است که غوطه ور در موسیقی کانتری بزرگ شد و پیش از موفقیت به عنوان یک ترانه سرا، حرفه موسیقی کانتری خود را به عنوان یک هنرمند آغاز کرد. مک آنالی در مورد یازدهمین نامزدی آهنگ CMA سال خود می گوید: «این یک افتخار است. \"خیلی جالب است، به خصوص به این دلیل که من با وسواس CMA بزرگ شدم، و بنابراین، برای یک ترانه سرا، واقعاً قدردانی بزرگتر از آهنگ سال وجود ندارد.\" او می افزاید: «این جایی است که برای اولین بار به یاد می آورم که ترانه سراها را دیدم. زمانی را به یاد می‌آورم که سیندی واکر در سال 1997 به تالار مشاهیر [کانتری موزیک] راه یافت. این", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Shane-McAnally-CR-Robby-Klein.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۲۱:۰۸"}, {"source": "Billboard", "title": "Deezer’s Subscriber Growth at Home in France Helps Drive Quarterly Revenue Increase", "link": "https://www.billboard.com/pro/deezer-subscriber-growth-drives-revenue-rise/", "summary": "Deezer reported on Tuesday (Oct. 27) third-quarter revenue rose as the Paris-based streamer grew subscribers in France and revenue from direct subscribers by more than 6% in constant currency, leading the company to raise its full-year revenue forecast. Overall revenue rose 1% in constant currency, which neutralizes foreign exchange rate currency fluctuations, to 133.8 million euros ($153.9 million). That increase was driven by a 6.4% increase to 94.1 million euros ($108.3 million) in revenue from subscribers who sign up to the streaming service directly, as opposed to subscribers who arrive by way of partnerships, such as with telecom service providers Orange or TIM. Related Spotify Subscriber Gains Beat Expectations, Driving Double-Digit Revenue Growth in Q3 Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Direct subscribers are more lucrative for the company, and Deezer says it grew direct subscribers by 6.5% in France and by 4% in other markets for a total of 5.8 million direct subscribers — the result of successful family plans in France and improvements in retention elsewhere. That helped offset a 17% decline in subscribers from partnerships as some legacy distribution deals wound down. The company revised its prior guidance for stable revenue in 2026, saying it now expects to grow revenue slightly. Deezer projected it will generate 10 million euros ($11.5 million) or more in adjusted earnings before income, tax, depreciation and amortization (EBITDA) for a third straight year of positive free cash flow. We delivered revenue growth for a second consecutive quarter, supported by the continued expansion of our direct business, Deezer CEO Alexis Lanternier said in a statement. Our continued operational progress and disciplined execution gives us the confidence to raise our full-year revenue outlook and strengthen our profitability outlook. Deezer said average revenue per user (ARPU) from its partnerships rose by nearly 16.7% to 3.7 euros ($4.26) a month, while ARPU from direct subscribers held flat at 5.4 euros ($6.21). Other revenue from advertising and other services fell 20.6% to 7.9 million euros ($9 million), mainly due to the end of a content licensing agreement last year. In July, Deezer signed a new partnership with Winamp, which will result in Winamp launching a streaming subscription offering using a white-labeled version of Deezer’s techn", "date_str": "2026-10-27T17:23:38+00:00", "hash": "89cd12767c24c02c", "title_fa": "رشد مشترکین Deezer در خانه در فرانسه به افزایش درآمد فصلی کمک می کند", "summary_fa": "دیزر روز سه شنبه (27 اکتبر) گزارش داد که درآمد سه ماهه سوم با افزایش مشترکین استریمر مستقر در پاریس در فرانسه و درآمد حاصل از مشترکین مستقیم با ارز ثابت بیش ا
