"title": "بهای بنزین آزاد در ایران دو برابر شد؛ هر لیتر ۱۰ هزار تومان", "link": "http://parsi.euronews.com/2026/09/06/iran-gasoline-price-hike-10k-toman-economic-crisis-sep-2026", "summary": "تنها دو هفته پس از آغاز «عملیات طرد اقتصادی» آمریکا علیه ایران و هم‌زمان با ادامه محاصره دریایی ایران از سوی آمریکا، دولت ایران نرخ بنزین آزاد در جایگاه‌های سوخت را از پنج هزار تومان به ۱۰ هزار تومان افزایش داد. این اقدام یادآور افزایش ناگهانی بهای سوخت در آبان ۹۸ و اعتراضات گسترده در پی آن است.", "date_str": "2026-09-06T21:37:57+00:00", "hash": "9c59048341dac437aa379c5022dc7cf0d91363f81716d6a14cce5edab71388f6"}, {"source": "Euronews Persian", "title": "کشف مزیت جدید شیر مادر در مقابله با مقاومت آنتی‌بیوتیکی", "link": "http://parsi.euronews.com/health/2026/09/06/they-discover-a-benefit-of-breast-milk-against-antibiotic-resistance", "summary": "مطالعه‌ای به رهبری مرکز تحقیقاتی CSIC نشان میدهد برخی اجزای شیر مادر با کاهش ژنهای مقاومت به آنتی‌بیوتیک در روده نوزادان مرتبط است.", "date_str": "2026-09-06T21:30:56+00:00", "hash": "a6a606f765b73831ea5a0854cd0914658ad797e0379dba6892bd7ad251ca99ee"}, {"source": "Euronews Persian", "title": "خیز اینفانتینو برای بقا در قدرت؛ رئیس فیفا نامزد انتخابات ۲۰۲۷ می‌شود", "link": "http://parsi.euronews.com/2026/09/06/infantinos-fifa-president-to-run-for-2027-election", "summary": "جیانی اینفانتینو، رئیس فدراسیون بین‌المللی فوتبال که به دلیل طرح جنجالی و پس گرفته شده فروش سهام جام جهانی به شدت زیر تیغ انتقادات قرار گرفت برای انتخاب مجدد در این سمت نامزد خواهد شد.", "date_str": "2026-09-06T18:14:13+00:00", "hash": "e2da05f6f6f802977ab636eea5ddeeccf82ccf444834cb66edfd771571c18715"}, {"source": "Euronews Persian", "title": "رئیس اشتیل: اصلاحات برای حفظ رفاه و دولت رفاه", "link": "http://parsi.euronews.com/business/2026/09/06/boss-of-stihl-time-for-reforms-this-is-how-we-will-save-prosperity-and-the-welfare-state", "summary": "نیکولاس اشتیل در یادداشتی برای یورونیوز می‌نویسد: اقتصاد آلمان سال‌هاست در بحران است. او معتقد است بهبود محیط کسب‌وکار کلید پایا 42386ab5980f80b6633c2da90"}, {"source": "BBC Persian", "title": "جنگ و محاصره دریایی با اقتصاد ایران چه کرده است؟", "link": "https://www.bbc.com/persian/articles/ckg72xv3xr3o?at_medium=RSS&at_campaign=rss", "summary": "اقتصاد ایران در حالی هفتمین ماه جنگ را پشت سر می‌گذارد که همزمان با تحریم‌ها و محدودیت‌های دریایی، صادرات نفت و تجارت خارجی با افت قابل توجهی مواجه شده است. هرچند مسیرهای جایگزین همچنان بخشی از مبادلات کشور را حفظ کرده‌اند، اما افزایش هزینه واردات و اختلال در زنجیره تامین، آثار خود را بیش از پیش بر زندگی روزمره مردم نشان می‌دهد.", "date_str": "2026-09-07T05:07:57+00:00", "hash": "c28f7356bb54cb8a295b80f82cbb44e8f93d4b5148a25a8c13a44c14624cae6e"}, {"source": "BBC Persian", "title": "چرا اعلام کنترل ارتفاعات علی‌ طاهر برای اسرائیل اهمیت دارد؟", "link": "https://www.bbc.com/persian/articles/c0re1eexn01o?at_medium=RSS&at_campaign=rss", "summary": "اعلام اسرائیل مبنی بر کنترل تپه راهبردی علی‌ طاهر، توجه‌ها را به یکی از مهم‌ترین تحولات نظامی ماه‌های اخیر در جنوب لبنان جلب کرده است. این ارتفاعات که بر بخش گسترده‌ای از جنوب لبنان اشراف دارد، اکنون تنها یک موقعیت نظامی نیست، بلکه به نمادی از رقابت سیاسی و رسانه‌ای میان اسرائیل و حزب‌الله نیز تبدیل شده است؛ آن هم در شرایطی که گمانه‌زنی‌ها درباره آینده حضور اسرائیل در جنوب لبنان و احتمال ازسرگیری ", "date_str": "2026-09-07T04:18:55+00:00", "hash": "3c2c3f55a10940da58ac4244ae95431f5c18c75ff034396bb2179f2a9dcd3175"}, {"source": "BBC Persian", "title": "درباره بانک گلدن گلوبال ترکیه که آمریکا تحریم کرد چه می‌دانیم؟", "link": "https://www.bbc.com/persian/articles/ckg8r4nd5kqo?at_medium=RSS&at_campaign=rss", "summary": "بانک «گلدن گلوبال» ترکیه به تازه‌ترین هدف کارزار فشار اقتصادی آمریکا علیه ایران تبدیل شده است. واشنگتن این بانک و چند شرکت وابسته به آن را به تسهیل معاملات مالی مرتبط با سپاه پاسداران متهم کرده و در فهرست تحریم‌های خود قرار داده است. این بانک اتهام‌ها را رد کرده، اما این اقدام بار دیگر توجه‌ها را به نقش نهادهای مالی منطقه در مبادلات ایران و دامنه فشارهای اقتصادی آمریکا جلب کرده است.", "date_str": "2026-09-07T03:20:01+00:00", "hash": "44b5e92c66db06d0b444671b2262a7c9ea2695312281061277fce11da9a35e8d"}, {"source": "BBC Persian", "title": "سخنگوی دولت: نرخ سوم بنزین از سه‌شنبه ۱۰ هزار تومان می‌شود", "link": "https://www.bbc.com/persian/articles/ce9exj4nkyyo?at_medium=RSS&at_campaign=rss", "summary": "فاطمه مهاجرانی، سخنگوی دولت ایران، گفته است نرخ سوم بنزین که بعد از مصرف سهمیه ۶۰ لیتر ۱۵۰۰ تومان و ۵۰ لیتر ۳۰۰۰ هزار تومان، با کارت جایگاه سوخت اعمال می‌شود از روز سه‌شنبه ۱۷ شهریور به هر لیتر ۱۰ هزار تومان افزایش خواهد یافت. قیمت فعلی این نرخ بنزین برای هر لیتر ۵ هزار تومان است.", "date_str": "2026-09-06T21:26:12+00:00", "hash": "e0575cb887d4622cad5e256856522874cd1afa65e5217be09418941cef66d5fd"}, {"source": "BBC Persian", "title": "آیا ترامپ ادعای آرژانتین بر جزایر فالکلند را تقویت می‌کند؟", "link": "https://www.bbc.com/persian/articles/cx2zxvgv0w4o?at_medium=RSS&at_campaign=rss", "summary": "اظهارات اخیر دونالد ترامپ درباره بازنگری در موضع آمریکا نسبت به جزایر فالکلند، بار دیگر این مناقشه قدیمی را در کانون توجه قرار داده است. در حالی که خاویر میلی این تحولات را نشانه‌ای از تقویت ادعای آرژانتین می‌داند، این پرسش مطرح شده که آیا واشنگتن حاضر است در این پرونده از موضع سنتی خود فاصله بگیرد و بهای آن را در روابط دیرینه با بریتانیا بپردازد.", "date_str": "2026-09-06T20:44:09+00:00", "hash": "658d50da4f08e835818959f7fcbce77fe0d044db48ec452404764c60a438ef39"}, {"source": "BBC Persian", "title": "دختری که دل ایرلندی‌ها را برد؛ «پایان رویایی کیتی تیلور پس از دورانی طلایی»", "link": "https://www.bbc.com/persian/articles/cgk5dv8n6r7o?at_medium=RSS&at_campaign=rss", "summary": "کیتی تیلور هنگام قدردانی از مادرش برجیت، این سخنان را خطاب به جمعیت حاضر در ورزشگاه کروک پارک بر زبان آورد، اما خانواده بزرگ ۸۳ هزار نفری او در داخل ورزشگاه و افراد بسیاری که از دور نظاره‌گر بودند، می‌دانستند این ادای احترام به آن‌ها نیز مربوط می‌شود.", "date_str": "2026-09-06T19:24:57+00:00", "hash": "3d193202eaf5804e3fabd720427839d5c71532b1b26deea6fa50e376c377c1ea"}, {"source": "Radio Farda", "title": "کمیسر حقوق بشر سازمان ملل: هوش مصنوعی می‌تواند خطری «وجودی» برای بشریت ایجاد کند", "link": "https://www.radiofarda.com/a/ai-could-pose-existential-risk-to-humanity-un-rights-chief-warns/33849254.html", "summary": "فولکر تورک، کمیسر حقوق بشر سازمان ملل، هشدار داد که تنها «چند مرد قدرتی تقریباً نامحدود» بر هوش مصنوعی دارند.", "date_str": "2026-09-07T13:03:18+00:00", "hash": "b731ad55c4f517829b56aa1d7a1a6e095fd23f93acb1a48eec68f18589b2e8b4"}, {"source": "Radio Farda", "title": "امارات می‌گوید بازسازی اعتماد به ایران ممکن است دهه‌ها طول بکشد", "link": "https://www.radiofarda.com/a/senior-uae-official-says-re-establishing-iran-trust-important-but-difficult/33849096.html", "summary": "قرقاش می‌گوید امارات در حال ساخت مسیرهای جایگزین برای صادرات و تجارت انرژی خود است تا اطمینان حاصل کند که در جنگ با ایران «گروگان» گرفته نخواهند شد.", "date_str": "2026-09-07T10:00:25+00:00", "hash": "d973a7bd651caccef922f709e400ee70caa4243b68f8e6b79ac243ea69bf6c98"}, {"source": "Radio Farda", "title": "منابع رادیو فردا: کامران حکمتی، شهروند ایرانی آمریکایی، از اوین «آزاد شد»", "link": "https://www.radiofarda.com/a/kamran-hekmati-has-been-released-from-evin-prison-/33848390.html", "summary": "کامران حکمتی، از جمله شهروندان آمریکایی بازداشت‌شده توسط حکومت ایران است که از سوی مارکو روبیو، وزیر خارجه آمریکا، به‌عنوان فردی که به‌طور ناعادلانه بازداشت شده، معرفی شده است.", "date_str": "2026-09-07T07:43:44+00:00", "hash": "ba2e3e0847e2cfa491cc8463e64fbeb96558c70d119c39fa7b64d950894a54e8"}, {"source": "Radio Farda", "title": "حزب راست افراطی «آلترناتیو برای آلمان» در انتخابات ایالتی زاکسن-آنهالت پیروز شد", "link": "https://www.radiofarda.com/a/germany-s-merz-under-pressure-from-far-right-election-triumph/33848349.html", "summary": "این پیروزی انتخاباتی، حزب آ.‌اف‌.د. را که طرفدار دونالد ترامپ و نزدیک به مسکو است، به تشکیل نخستین دولت ایالتی خود نزدیک کرد.", "date_str": "2026-09-07T06:28:50+00:00", "hash": "a236926d7a046b12f8931b235f3cdcdb207be38a30b1cf349f12df358b1b2c3b"}, {"source": "Radio Farda", "title": "محسن رضایی پاکسازی تپه‌های «علی الطاهر» در جنوب لبنان را به‌طور ضمنی تأیید کرد", "link": "https://www.radiofarda.com/a/mohsen-rezaei-on-lebanon-and-hurmoz/33848335.html", "summary": "محسن رضایی با این حال مدعی «دست برتر» حزب‌الله در جنگ با اسرائیل شد و گفت: «مطمئنم لبنان دوباره سر بلند خواهد کرد. این دفعه... نمی‌گذارد چیزی از اسرائیل بماند.»", "date_str": "2026-09-07T06:00:51+00:00", "hash": "7d6ac13096dc0a69b38b3526d6911f11793de32d7046fae281bbf4ac2c6ec934"}, {"source": "Radio Farda", "title": "همزمان با اعلام نرخ تازه، یک مقام وزارت نفت از کسری ۱۰ میلیون لیتری بنزین خبر داد", "link": "https://www.radiofarda.com/a/iran-increase-petrol-price/33848320.html", "summary": "کاهش شدید ظرفیت تولید بنزین در ماه‌های اخیر در اثر حملات آمریکا به تأسیسات نفتی ایران و مشکلات دولت برای واردات، باعث افزایش شدید تقاضا برای بنزین شده است.", "date_str": "2026-09-07T05:26:06+00:00", "hash": "b29af94c7e3dbfa628c745e1910e8cdf71f3c22e87d6300fd34c7b7b6610f409"}, {"source": "Radio Farda", "title": "سخنگوی دولت: قیمت «سهمیه سوم» بنزین از ۱۷ شهریور ۱۰ هزار تومان خواهد شد", "link": "https://www.radiofarda.com/a/iran-government-increase-petrol-price/33848043.html", "summary": "فاطمه مهاجرانی، سخنگوی دولت جمهوری اسلامی، شامگاه یکشنبه ۱۵ شهریور اعلام کرد که قیمت «سهمیه سوم» بنزین برای خودروها از روز ۱۷ شهریور دو برابر خواهد شد و به ۱۰ هزار تومان می‌رسد.", "date_str": "2026-09-06T18:31:16+00:00", "hash": "89b638be7c49075f8113d6536b063ddf2fd6ee58b144c152aff0c4e2a14c5b03"}, {"source": "Radio Farda", "title": "وزیر انرژی آمریکا: انتقال نفت از خاورمیانه به دوسوم سطح پیش از جنگ با ایران رسیده است", "link": "https://www.radiofarda.com/a/us-says-oil-shipments-from-the-middle-east-reached-two-thirds-of-pre-war-levels/33848012.html", "summary": ".", "date_str": "2026-09-06T16:03:43+00:00", "hash": "33ded7e0862ccd666e749f3d8986e03490b1600158b8c91786d292eaa154b789"}]
    };

    let currentTab = 'tech';
    let searchQuery = '';

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const items = data[currentTab] || [];
      const filtered = items.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبر جدیدی در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = filtered.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card">
            <div class="news-header">
              <span class="news-num">${num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderNews();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
