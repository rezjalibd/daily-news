م که باید تمامش کنیم.» او همچنین تاکید کرد آمریکا و اسرائیل اجازه دستیابی جمهوری اسلامی به سلاح هسته‌ای را نخواهند"}, {"source": "IranWire", "title": "اکسیوس: ده‌ها جنگنده اسراییلی تا نزدیکی مرز ایران پرواز کردند", "link": "https://iranwire.com/fa/news-1/159169-%D8%A7%DA%A9%D8%B3%DB%8C%D9%88%D8%B3-%D8%AF%D9%87%D9%87%D8%A7-%D8%AC%D9%86%DA%AF%D9%86%D8%AF%D9%87-%D8%A7%D8%B3%D8%B1%D8%A7%DB%8C%DB%8C%D9%84%DB%8C-%D8%AA%D8%A7-%D9%86%D8%B2%D8%AF%DB%8C%DA%A9%DB%8C-%D9%85%D8%B1%D8%B2-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D9%BE%D8%B1%D9%88%D8%A7%D8%B2-%DA%A9%D8%B1%D8%AF%D9%86%D8%AF/", "summary": "وب‌سایت اکسیوس به نقل از مقام‌های اسراییلی و آمریکایی گزارش داد ده‌ها جنگنده نیروی هوایی اسراییل روز دوشنبه ۲۷ مهر ۱۴۰۵، در عملیاتی که ت ...", "date_str": "2026-10-21T19:14:04+00:00", "hash": "581e23e5f3a855f6", "title_fa": "اکسیوس: ده‌ها جنگنده اسراییلی تا نزدیکی مرز ایران پرواز کردند", "summary_fa": "وب‌سایت اکسیوس به نقل از مقام‌های اسراییلی و آمریکایی گزارش داد ده‌ها جنگنده نیروی هوایی اسراییل روز دوشنبه ۲۷ مهر ۱۴۰۵، در عملیاتی که ت ... به گفته برخی مقام‌های آمریکایی، این عملیات ممکن بود به محاسبه اشتباه و واکنش نظامی ایران و در نتیجه از سرگیری جنگ منجر شود. بر اساس این گزارش، در این عملیات ده‌ها جنگنده و هواپیمای سوخت‌رسان شرکت داشتند. هواپیماها از حریم هوایی سوریه و عراق عبور کردند و پس از نزدیک‌شدن به مرز ایران، مسیر خود را تغییر دادند و به اسراییل بازگشتند. اکسیوس نوشت این پرواز بیش از ۸۰۰ مایل از اسراییل فاصله داشت و یک هفته پیش از انتخابات این کشور انجام شد. این عملیات همچنین هم‌زمان با دیدار پیت هگست، وزیر دفاع آمریکا، با بنیامین نتانیاهو، نخست‌وزیر اسراییل، در پایگاه هوایی عوودا صورت گرفت، اما به گفته منابع، ارتباطی با سفر هگست نداشت. به گفته مقام‌های اسراییلی و آمریکایی، این پرواز اقدامی غیرمعمول نبوده و با هدف بازدارندگی در برابر ایران انجام شده است. مقام‌های اسراییلی پیشاپیش آمریکا را از این عملیات مطلع کرده و آن را تمرینی برای نمایش قدرت و جلوگیری از حملات احتمالی ایران پیش از انتخابات توصیف کرده بودند. با این حال، برخی منابع آمریکایی به اکسیوس گفته‌اند این برداشت را داشته‌ا ند کاهش آن سرعت گرفت. حجم این ذخایر که در مقطعی به حدود ۹۰ میلیون بشکه رسیده بود، تا پنجم اکتبر به کمتر از یک میلیون بشکه کاهش یافت. بااین‌حال، شرکت «ورتکسا» حجم نفت ایران در آب‌های نزدیک سنگاپور را در نهم اکتبر حدود شش میلیون بشکه برآورد کرده است؛ اختلافی که نشان‌دهنده دشواری ردیابی محموله‌های نفتی ایران است. پیش‌تر بلومبرگ در گزارشی به تاریخ ۱۹ اکتبر اعلام کرده بود که از اواخر اوت هیچ نفتکشی برای بارگیری نفت خام در پایانه‌های اصلی جزیره خارک پهلو نگرفته و نشانه‌ای از بارگیری در پایانه جاسک نیز مشاهده نشده است. در مقابل، رویترز ۱۶ اکتبر گزارش داد که دست‌کم هشت نفتکش حامل گاز مایع ایران، با مجموع محموله‌ای حدود ۴٫۱ میلیون بشکه، از اواسط ژوئیه توانسته‌اند از دریای عمان خارج شوند."}, {"source": "IranWire", "title": "توسعه نفتی در شمال هورالعظیم؛ هشدار درباره تهدید زیستگاه‌ها", "link": "https://iranwire.com/fa/news-1/159190-%D8%AA%D9%88%D8%B3%D8%B9%D9%87-%D9%86%D9%81%D8%AA%DB%8C-%D8%AF%D8%B1-%D8%B4%D9%85%D8%A7%D9%84-%D9%87%D9%88%D8%B1%D8%A7%D9%84%D8%B9%D8%B8%DB%8C%D9%85-%D9%87%D8%B4%D8%AF%D8%A7%D8%B1-%D8%AF%D8%B1%D8%A8%D8%A7%D8%B1%D9%87-%D8%AA%D9%87%D8%AF%DB%8C%D8%AF-%D8%B2%DB%8C%D8%B3%D8%AA%DA%AF%D8%A7%D9%87%D9%87%D8%A7/", "summary": "سازمان حفاظت محیط‌‌ زیست برای توسعه میدان نفتی سهراب در بخش شمالی و نسبتاً دست‌نخورده هورالعظیم مجوز صادر کرده است؛ اقدامی که اعتراض دان ...", "date_str": "2026-10-22T10:57:57+00:00", "hash": "b280e966600f8144", "title_fa": "توسعه نفتی در شمال هورالعظیم؛ هشدار درباره تهدید زیستگاه‌ها", "summary_fa": "سازمان حفاظت محیط‌‌ زیست برای توسعه میدان نفتی سهراب در بخش شمالی و نسبتاً دست‌نخورده هورالعظیم مجوز صادر کرده است؛ اقدامی که اعتراض دان ... به گزارش «آوش»، شرکت مهندسی و توسعه نفت روز ۲۸ مرداد از دریافت مجوز نهایی خبر داده بود. سازمان محیط‌زیست نیز در پی انتقادها، روز ۲۲ مهر خواستار بازنگری مطالعات اجتماعی پروژه توسط یک مشاور مستقل شد و ادامه اجرای طرح را به ارائه نتایج این بررسی مشروط کرد. سهراب پنجمین میدان نفتی هورالعظیم است که توسعه آن این‌بار بخش شمالی تالاب، یکی از پهنه‌های پرآب و زیستگاه‌های باقی‌مانده آن، را درگیر می‌کند. پیش از این tle_fa": "«ورشکسته و غرق در بدهی»؛ آخرین سلطان امپراتوری عثمانی چگونه درگذشت؟", "summary_fa": "برای برخی، حتی تصور این‌که آخرین سلطان دودمانی که فرمانروایان قدرتمندی چون سلیمان یکم، محمد دوم ملقب به فاتح و سلیم یکم را در خود پرورده بود، چنان بدهکار از دنیا رفت که تابوتش را تا زمان تسویه بدهی‌ها توقیف کردند، دشوار است. محمد ششم، سلطان وحیدالدین، آخرین سلطان امپراتوری عثمانی، گفته بود: «من بر بالش نرم تخت سلطنت ننشستم، بر خاکسترهای آتش نشستم.» او پس از مرگ برادرش محمد پنجم رشاد، در سال ۱۹۱۸ به سلطنت رسید. او وارث امپراتوری‌ شده بود که در آستانه فروپاشی قرار داشت و نزدیک به ۶۰۰ سال تاریخ دودمان عثمانی با آن رو به پایان می‌رفت. او آخرین فرمانروای امپراتوری قدرتمندی بود که قلمروش، در دوران اوج خود، در سه قاره گسترده بود. کایا گنچ، نویسنده ترک، به بی‌بی‌سی موندو می‌گوید: «قرعه سلطنت در زمان بدی به نام او افتاد.» تصور آخرین روزهای محمد ششم در استانبول سال ۱۹۲۲ دشوار است. رایان جینجراس، تاریخ‌نگار، به بی‌بی‌سی می‌گوید: «برای او لحظه‌ای واقعا تکان‌دهنده و تراژیک بود؛ تنها بود، دوستی نداشت و کاخش خالی مانده بود.» او سوار یک کشتی بریتانیایی می‌شود و کشور را ترک می‌کند، در حالی که لزوما نمی‌داند مقصد نهایی‌اش کجاست. محمد ششم در ۱۶ مه ۱۹۲۶، پس از ابتلا به عارضه‌ای قلبی، در ایتالیا، جایی که دوران تبعید خود را می‌گذراند، درگذشت. وب‌سایت خبری ترکیه تودی در سال ۲۰۲۵ مقاله‌ای با عنوان «مروری بر زندگی سلطان محمد ششم وحیدالدین: آخرین پادشاه عثمانی» منتشر کرد. اکرم بوغرا اکینجی، پژوهشگر ترک، می‌گوید سلطان «دیگر پولی نداشت» و حتی ناچار شد مدال‌ها و نشان‌های افتخار خود را بفروشد، چون زیر بالش او نسخه داروهایی بود که توان پرداخت هزینه‌شان را نداشت. به دلیل بدهی‌هایی که بالا آورده بود، «طلبکاران تابوت او را توقیف کردند» و همین موضوع مراسم تشییع و خاکسپاری او را به تاخیر انداخت. اما به گفته آقای گنچ، یکی از"}, {"source": "BBC Persian", "title": "آیا یک عکس ساده از چهره می‌تواند نشان دهد چقدر بیمار هستید؟", "link": "https://www.bbc.com/persian/articles/cv0ld7044gz3o?at_medium=RSS&at_campaign=rss", "summary": "پژوهشگران آمریکایی می‌گویند هوش مصنوعی ممکن است بتواند تنها با استفاده از یک عکس از چهره، به پزشکان در ارزیابی شدت بیماری و وضعیت جسمی بیماران کمک کند.", "date_str": "2026-10-22T04:31:42+00:00", "hash": "89b254af68dbbd58", "title_fa": "آیا یک عکس ساده از چهره می‌تواند نشان دهد چقدر بیمار هستید؟", "summary_fa": "پژوهشگران آمریکایی می‌گویند هوش مصنوعی ممکن است بتواند تنها با استفاده از یک عکس از چهره، به پزشکان در ارزیابی شدت بیماری و وضعیت جسمی بیماران کمک کند. به گفته این پژوهشگران، این سامانه که با میلیون‌ها تصویر از افراد سالم و ۳۵ هزار عکس از بیماران مبتلا به سرطان آموزش دیده، با بررسی دقیق ویژگی‌های صورت، به‌ویژه ناحیه اطراف چشم‌ها، می‌تواند برآوردی از وضعیت سلامت بیمار ارائه دهد. با این حال، محققان تاکید می‌کنند که این فناوری هنوز تا رسیدن به مرحله استفاده در بیمارستان‌ها فاصله زیادی دارد. آنها می‌گویند هدف نهایی، کمک به پزشکان برای انتخاب مناسب‌ترین روش درمانی برای هر بیمار است. یافته‌های اولیه این پژوهش در نشریه لنست دیجیتال هلث منتشر شده است. ابزار هوش مصنوعی «فیس‌سوروایول» نشان می‌دهد ناحیه زیر چشم‌ها و اطراف پل بینی از مهم‌ترین بخش‌های چهره برای برآورد احتمال بقا و تخمین مدت زمانی هستند که ممکن است یک بیمار در قید حیات بماند. این شاخص‌ها در انواع مختلف سرطان، با درجات متفاوت پیشرفت بیماری، از جمله سرطان‌هایی که به استخوان یا مغز گسترش یافته‌اند نیز کاربرد داشتند. بیشتر بیماران سرطانی شرکت‌کننده در این پژوهش از آمریکا و هلند و در دهه‌های پنجم و ششم زندگی خود بودند، هرچند این مطالعه بیماران کودک و همچنین افراد بالای ۹۰ سال را نیز دربر می‌گرفت. پزشکان هم‌اکنون با معاینه بیماران و انجام آزمایش‌ها و ارزیابی‌های جامع، شدت بیماری و چشم‌انداز درمانی آنها را بررسی می‌کنند. پژوهشگران تأکید می‌کنند که این ابزار هوش مصنوعی، که درخواست ثبت اختراع آن ارائه شده، برای کمک به پزشکان در این فرایند طراحی شده و قرار نیست جایگزین قضاوت و تشخیص پزشکی شود. ریموند مک، پژوهشگر ارشد این مطالعه از بیمارستان «مس جنرال بریگم» در بوستون، می‌گوید: «با افزایش سن جمعیت، پزشکان به روش‌های بهتری برای ارزیابی توان جسمی و میزان آسیب‌پذیری بیماران پیش از توصیه درمان‌های سنگینی مانند"}, {"source": "BBC Persian", "title": "چرا روسیه دوباره به جنبش‌های جدایی‌طلب در اروپا علاقه‌مند شده است؟", "link": "https://www.bbc.com/persian/articles/c574pjzx13vgo?at_medium=RSS&at_campaign=rss", "summary": "برای کرملین، حمایت لفظی از جنبش‌های جدایی‌طلب در غرب موضوع تازه‌ای نیست. اما در ماه‌های اخیر، رسانه‌های دولتی روسیه توجه ویژه‌ای به جنبش‌های استقلال‌طلب در بریتانیا نشان داده‌اند؛ از راهپیمایی هواداران استقلال ولز گرفته تا نشست رهبران ملی‌گرای ولز، اسکاتلند و ایرلند شمالی. تحلیلگران می‌گویند این پوشش بخشی از تلاش روسیه برای نمایش اروپا به عنوان قاره‌ای دچار شکاف و بحران سیاسی است.", "date_str": "2026-10-22T00:19:42+00:00", "hash": "9b63b38fe81ec186", "title_fa": "چرا روسیه دوباره به جنبش‌های جدایی‌طلب در اروپا علاقه‌مند شده است؟", "summary_fa": "برای کرملین، حمایت لفظی از جنبش‌های جدایی‌طلب در غرب موضوع تازه‌ای نیست. اما در ماه‌های اخیر، رسانه‌های دولتی روسیه توجه ویژه‌ای به جنبش‌های استقلال‌طلب در بریتانیا نشان داده‌اند؛ از راهپیمایی هواداران استقلال ولز گرفته تا نشست رهبران ملی‌گرای ولز، اسکاتلند و ایرلند شمالی. تحلیلگران می‌گویند این پوشش بخشی از تلاش روسیه برای نمایش اروپا به عنوان قاره‌ای دچار شکاف و بحران سیاسی است. هر روز پیش نمی‌آید که یک تیم تلویزیونی روسیه به شهر ساحلی ابریستویث در ولز برود. اما در ۲۶ سپتامبر، گروهی از شبکه روسیا ۱، پربیننده‌ترین شبکه تلویزیونی داخلی روسیه، آنجا بود. چرا؟ برای پوشش «راهپیمایی استقلال»؛ تجمعی ملی‌گرایانه در ولز که در آن طرفداران استقلال در خیابان‌های شهر راهپیمایی کردند. با وجود این‌که این رویداد هر سال برگزار می‌شود و جمعیت نسبتا محدودی، حدود ۸ هزار نفر، در آن شرکت کردند، راهپیمایی در روسیه به خبری مهم تبدیل شد. گزارش الکساندر خاباروف، خبرنگار این شبکه در بریتانیا، روز بعد از جمله خبرهای اصلی برنامه «وستی ندلی» یا «اخبار هفته» بود؛ برنامه شاخص خبری عصر یکشنبه در روسیه. پوشش این تجمع ملی‌گرایان ولزی بخشی از روند گسترده‌تری است که بی‌بی‌سی مانیتورینگ در ماه‌های اخیر دنبال کرده است: افزایش اشاره‌های تلویزیون دولتی روسیه به جنبش‌های جدایی‌طلب در بریتانیا. برای کرملین، پررنگ کردن جنبش‌های جدایی‌طلب در بریتانیا و دیگر کشورها موضوع تازه‌ای نیست و تمایز گذاشتن میان حمایت لفظی روسیه از این جنبش‌ها و افزایش واقعی دید ز آنتیموان، سرب یا دیگر مواد معدنی ساخته می‌شد، اما در محصولات امروزیِ سرمه از ترکیبات دیگری نیز استفاده می‌شود. این ماده آرایشی جایگاه ویژه‌ای برای خانم حنکیر نویسنده لبنانی‌ـ‌بریتانیایی دارد که خانواده‌اش در هنگامه جنگ داخلی ۱۹۷۵ در لبنان به انگلستان نقل مکان کرده‌اند. او توضیح می‌دهد: «وقتی دور از وطن زندگی می‌کردیم، مادرم را تماشا می‌کردم که آرایش می‌کرد. احساس می‌کردم او از این طریق با چیزی بسیار عمیق پیوند برقرار می‌کند.» او می‌گوید همان پیوندی را که در آن لحظه در مادرش می‌دید، هنگام کشیدن خط چشم خود نیز احساس می‌کند. خانم حنکیر، نویسنده کتاب تاریخچه فرهنگی خط‌چشم می‌گوید به رسمیت شناختن سرمه به عنوان میراث فرهنگی ناملموس «نه تکیه بر مارک و محصول خاص بلکه تاکید بر این رفتار فرهنگی دارد که شایسته مراقبت و"}, {"source": "BBC Persian", "title": "سفر اعلام‌نشده مکرون به ریاض و گزارش‌ها از حمله حوثی‌ها به عدن", "link": "https://www.bbc.com/persian/articles/cq1j38rd00zjo?at_medium=RSS&at_campaign=rss", "summary": "درحالی‌که خبرگزاری‌ها از انفجار و ستون دود در نزدیکی فرودگاه عدن خبر می‌دهند، حوثی‌های یمن می‌گویند که به یک پایگاه نظامی عربستان سعودی در بندر عدن حمله کرده است. در همین حال رئیس‌جمهور فرانسه در سفری اعلام‌نشده برای اعلام «همبستگی» وارد ریاض شده است.", "date_str": "2026-10-21T15:25:46+00:00", "hash": "3fa3466b2fcf2a51", "title_fa": "سفر اعلام‌نشده مکرون به ریاض و گزارش‌ها از حمله حوثی‌ها به عدن", "summary_fa": "درحالی‌که خبرگزاری‌ها از انفجار و ستون دود در نزدیکی فرودگاه عدن خبر می‌دهند، حوثی‌های یمن می‌گویند که به یک پایگاه نظامی عربستان سعودی در بندر عدن حمله کرده است. در همین حال رئیس‌جمهور فرانسه در سفری اعلام‌نشده برای اعلام «همبستگی» وارد ریاض شده است. امانوئل مکرون، رئیس‌جمهور فرانسه، در سفری اعلام نشده برای ابراز «همبستگی»، وارد ریاض شد. او نخستین رهبر غربی است که از زمان تشدید حملات حوثی‌های متحد ایران وارد عربستان سعودی شد و با محمد بن سلمان ولیعهد دیدار کرد. این بخشی از سفر رئیس‌جمهور فرانسه به کشورهای خلیج فارس است که با هدف تأمین نفت و گازوئیل و کاهش قیمت‌ها پس از اعتراضات خشونت‌آمیز بر سر افزایش سرسام‌آور هزینه‌های زندگی در فرانسه صورت می‌گی های یمن به این کشور، دستور تخلیۀ ساختمان مرکزی خود در شهر ظهران را صادر کرده است. این اقدام پس از حملۀ مرگبار به فرودگاه دمام و در میانه گزارش‌ها از حملات تازه به تأسیسات نفتی و نظامی عربستان صورت می‌گیرد. خبرگزاری رویترز روز پنج‌شنبه ۳۰ مهر به نقل از شش منبع آگاه گزارش داد که به کارکنان ساختمان مرکزی آرامکو در شهر ظهران، واقع در شرق عربستان سعودی، دستور داده شده ساختمان را تخلیه کنند و فعالیت خود را از راه دور ادامه دهند. دلیل دقیق صدور این دستور هنوز روشن نیست و شرکت آرامکو نیز به درخواست رویترز برای اظهارنظر پاسخ نداده است. این نخستین بار از زمان آغاز جنگ ایران در ۹ اسفند است که دستور تخلیۀ ساختمان مرکزی آرامکو صادر می‌شود. حوثی‌های مورد حمایت جمهوری اسلامی اوایل ماه جاری نیز ساختمان مرکزی آرامکو را هدف حمله قرار داده بودند. این حمله‌ به آتش‌سوزی در چند طبقۀ ساختمان و خسارات گسترده منجر شد. انتشار خبر تخلیۀ ساختمان مرکزی آرامکو روز پنج‌شنبه با افت ۲.۵ درصدی شاخص اصلی بورس عربستان سعودی همراه شد. هم‌زمان با تشدید درگیری‌ها، قیمت نفت در بازارهای جهانی روز پنج‌شنبه به بالاترین سطح خود از ماه مه رسید. بهای هر بشکه نفت برنت با افزایش ۲.۸۱ درصدی به ۱۱۱ دلار و ۸۸ سنت رسید و در جریان معاملات تا ۱۱۲ دلار و ۵۵ سنت نیز بالا رفت. از سوی دیگر، یحیی سریع، سخنگوی نظامی حوثی‌ها، مدعی شد حملات عربستان سعودی به یمن از اواسط ژوئیه تاکنون ۵۶۲ کشته و زخمی بر جای گذاشته است. این آمار به‌طور مستقل تأیید نشده است. این تحولات پس از آن"}, {"source": "Radio Farda", "title": "دادگاه کیفری بین‌المللی، در بحبوحه تحریم‌های آمریکا، برنده جایزه حقوق بشری ساخاروف شد", "link": "https://www.radiofarda.com/a/icc-wins-sakharov-prize-us-sanctions-iranian-sisters/33881581.html", "summary": "دادگاه کیفری بین‌المللی در بیانیه‌ای از پارلمان اروپا قدردانی کرد و گفت این جایزه در شرایطی به این نهاد اعطا می‌شود که دادگاه و مقام‌های آن با «چالش‌هایی بی‌سابقه» روبه‌رو هستند.", "date_str": "2026-10-22T11:11:25+00:00", "hash": "425d493cada831b9", "title_fa": "دادگاه کیفری بین‌المللی، در بحبوحه تحریم‌های آمریکا، برنده جایزه حقوق بشری ساخاروف شد", "summary_fa": "دادگاه کیفری بین‌المللی در بیانیه‌ای از پارلمان اروپا قدردانی کرد و گفت این جایزه در شرایطی به این نهاد اعطا می‌شود که دادگاه و مقام‌های آن با «چالش‌هایی بی‌سابقه» روبه‌رو هستند. دادگاه کیفری بین‌المللی که به‌دلیل صدور حکم بازداشت بنیامین نتانیاهو، نخست‌وزیر اسرائیل، هدف تحریم‌های دولت آمریکا قرار گرفته، برنده جایزه ساخاروف سال ۲۰۲۶، شد که مهم‌ترین جایزه حقوق بشری اتحادیه اروپا است. روبرتا متسولا، رئیس پارلمان اروپا، روز پنجشنبه ۳۰ مهر هنگام اعلام برندهٔ جایزه گفت: «اتحادیه اروپا بر پایهٔ احترام به چندجانبه‌گرایی و نهادهای بین‌المللی بنا شده و این جایزه نقش مهم دادگاه در پاسداری از حقوق بین‌الملل و عدالت را به رسمیت می‌شناسد.» دادگاه کیفری بین‌المللی نیز در بیانیه‌ای از پارلمان اروپا قدردانی کرد و گفت این جایزه در شرایطی به این نهاد اعطا می‌شود که دادگاه و مقام‌های آن با «چالش‌هایی بی‌سابقه» روبه‌رو هستند. توموکو آکانه، رئیس این دادگاه، با اشاره به تحریم‌های آمریکا که به گفتهٔ او با هدف مختل کردن مأموریت قضایی این نهاد اعمال شده‌اند، تأکید کرد که جایزهٔ ساخاروف در چنین شرایطی «اهمیتی ویژه» دارد. او افزود: «این جایزه بار دیگر بر اهمیت نهادهای قضایی مستقل و کسانی که برای پاسداری از حقوق بین‌الملل تلاش می‌کنند، تأکید می‌کند.» رئیس دادگاه کیفری بین‌المللی همچنین گفت که این انتخاب، به رسمیت شناختن نقش عدالت بین‌المللی به‌عنوان یکی از پایه‌های صلح پایدار است و تأکید کرد: «در جهانی که با افزایش درگیری‌ها روبه‌رو است، بدون عدالت صلحی وجود ندارد و بدون قانون، امنیتی برقرار نخواهد شد.» اعطای جایزهٔ ساخاروف کمتر از دو هفته پس از آن صورت می‌گیرد که دولت دونالد ترامپ تحریم‌های تازه‌ای علیه دادگاه کیفری بین‌المللی اعلام کرد. این تحریم‌ها با هدف مختل کردن فعالیت‌های روزمرهٔ دادگاه وضع شده‌اند و قرار است شش ماه دیگر اجرایی شوند."}, {"source": "Radio Farda", "title": "وزیر دارایی یونان آغاز اِعمال تحریم‌های مربوط به ایران را رسماً اعلام کرد", "link": "https://www.radiofarda.com/a/greece-says-it-is-implementing-sanctions-linked-to-iran/33881525.html", "summary": "در ادامه فشار اقتصادی و مالی بر حکومت ایران به دلیل تحریم‌های گسترده آمریکا، دولت یونان هم روز پنج‌شنبه، ۳۰ مهرماه، رسما اعلام کرد که اجرای این تحریم‌ها را آغاز کرده است.", "date_str": "2026-10-22T10:04:58+00:00", "hash": "b571ef6f1c3f70f5", "title_fa": "وزیر دارایی یونان آغاز اِعمال تحریم‌های مربوط به ایران را رسماً اعلام کرد", "summary_fa": "در ادامه فشار اقتصادی و مالی بر حکومت ایران به دلیل تحریم‌های گسترده آمریکا، دولت یونان هم روز پنج‌شنبه، ۳۰ مهرماه، رسما اعلام کرد که اجرای این تحریم‌ها را آغاز کرده است. به گزارش خبرگزاری رویترز، وزارت دارایی یونان روز پنج‌شنبه اعلام کرده است که اجرای تحریم‌های اقتصادی و مالی مربوط به جمهوری اسلامی را آغاز کرده و همچنین از تلاش‌ها برای مبارزه با پول‌شویی و تأمین مالی تروریسم حمایت می‌کند. این خبر یک روز پس از آن منتشر می‌شود که وزارت خزانه‌داری ایالات متحده در بیانیه‌ای خبر داد که شرکت حقوقی «کارناکیس و کارناکیس»،‌ مستقر در یونان و پاناما را به دلیل سال‌ها مراوده با نهادهای مالی جمهوری اسلامی تحریم کرده است. در بیانیه وزارت خزانه‌داری همچنین اشاره شده بود که برای انجام تحقیقات دربارهٔ یک بانک یونانی نیز حکمی صادر شده است؛ در بیانیه به نام این بانک اشاره نشده بود. نزدیک به هشت ماه پس از آغاز جنگ آمریکا و اسرائیل با ایران، روز به روز حلقهٔ تحریم‌ها علیه تهران تنگ‌تر می‌شود. علاوه بر ادامه محاصره دریایی ایران که از ۲۳ تیرماه توسط ارتش آمریکا اعمال شده و جریان دارد، وزارت خزانه‌داری این کشور از ابتدای شهریور تشدید تحریم‌های ایران را با عنوان «عملیات طرد اقتصادی» آغاز کرده است. در قالب همین طرح بود که ایالات متحده تمامی شرکت‌های هواپیمایی ایران را تحریم کرد و در پی آن، از ابتدای مهرماه شماری از کشورها اجازه ورود و خروج پروازهای ایرانی از فرودگاه‌های خود را ممنوع کردند. در زمان آغاز این عملیات اقتصادی، اسکات بسنت، وزیر خزانه‌داری آمریکا، به تمام متحدان واشینگتن هشدار داد که در موضوع انزوای اقتصادی ایران باید میان «همراهی با آمریکا یا قرار گرفتن در برابر آن» یکی را انتخاب کنند. او دربارهٔ پیام خود به متحدان آمریکا گفت: «این بزرگ‌ترین انزوای اقتصادی هماهنگ‌شده در تاریخ جهان خواهد بود. ما به آنها می‌گوییم که"}, {"source": "Radio Farda", "title": "لانا نسیبه، دیپلمات ارشد امارات، نامزد دبیرکلی سازمان ملل شد", "link": "https://www.radiofarda.com/a/uae-lana-nusseibeh-un-secretary-general-candidate/33881526.html", "summary": "ورود این دیپلمات ۴۸ ساله به رقابت برای جانشینی آنتونیو گوترش در شرایطی است که شورای امنیت سازمان ملل هنوز نتوانسته بر سر نامزدی مورد توافق اعضای دائم خود به اجماع برسد.", "date_str": "2026-10-22T09:56:52+00:00", "hash": "8a58e3683344158c", "title_fa": "لانا نسیبه، دیپلمات ارشد امارات، نامزد دبیرکلی سازمان ملل شد", "summary_fa": "ورود این دیپلمات ۴۸ ساله به رقابت برای جانشینی آنتونیو گوترش در شرایطی است که شورای امنیت سازمان ملل هنوز نتوانسته بر سر نامزدی مورد توافق اعضای دائم خود به اجماع برسد. امارات متحده عربی، لانا نسیبه، دیپلمات ارشد این کشور و نمایندهٔ پیشین این کشور در سازمان ملل متحد را رسماً برای تصدی سمت دبیرکلی این سازمان نامزد کرد. خبرگزاری رسمی امارات روز چهارشنبه ۲۹ مهر اعلام کرد که محمد بن زاید آل نهیان، رئیس این کشور، در نامه‌ای به رؤسای مجمع عمومی و شورای امنیت سازمان ملل، نامزدی لانا نسیبه را اعلام کرده است. خانم نسیبه که اکنون وزیر مشاور در امور خارجهٔ امارات است، از سال ۲۰۱۳ تا ۲۰۲۴ نمایندهٔ دائم این کشور در سازمان ملل متحد بود و در دورهٔ عضویت امارات در شورای امنیت در سال‌های ۲۰۲۲ و ۲۰۲۳، دو بار ریاست دوره‌ای این شورا را بر عهده داشت. نسیبه اندکی پیش از اعلام رسمی نامزدی خود در گفت‌وگو با خبرگزاری رویترز گفت که قصد دارد نقش سازمان ملل را در حل‌وفصل بحران‌های بین‌المللی تقویت کند. این دیپلمات اماراتی تأکید کرد که جهان امروز به دبیرکلی نیاز دارد که سازمان ملل را از «تماشاگر بحران‌های جهانی» به نهادی فعال برای یافتن راه‌حل‌های دیپلماتیک تبدیل کند. لانا نسیبه از خانواده‌ای فلسطینی با ریشه‌هایی در بیت‌المقدس است. پدر او، زکی نسیبه، از چهره‌های باسابقهٔ دستگاه حکومتی امارات و مشاور فرهنگی رئیس این کشور است. او تحصیلات خود را در دانشگاه‌های کمبریج و لندن گذرانده و پیش از ورود به وزارت خارجهٔ امارات، در سازمان یونسکو و مراکز پژوهشی فعالیت کرده است. یکی از مهم‌ترین سوابق دیپلماتیک او به جنگ غزه در سال ۲۰۲۳ بازمی‌گردد که در جریان آن، نقش کلیدی در تصویب قطعنامهٔ ۲۷۲۰ شورای امنیت دربارهٔ تسهیل ارسال کمک‌های بشردوستانه به غزه ایفا کرد. با وجود سابقهٔ دیپلماتیک لانا نسیبه، نامزدی او با پرسش‌هایی دربارهٔ سیاست"}, {"source": "Radio Farda", "titl  از رابط Plaids برای فعال کردن خرید نمایندگی استفاده می‌کند. علاوه بر خرید، زاکربرگ گفت که سایر کاربردهای محبوب Muse شامل وظایف بهره وری شخصی، مانند اتصال عامل هوش مصنوعی به ایمیل یا تقویم کاربران است. مدیر اجرایی تاکید کرد که این نشان می‌دهد که کاربران به تنظیمات امنیتی Muse اعتماد دارند، که شامل قابلیتی به نام Muse Secure VM است که برای محافظت از داده‌ها و حریم خصوصی آنها طراحی شده است. او همچنین اشاره کرد که Muse Confidential VM آینده حتی متا را نیز از دیدن محتوای کاربران جلوگیری می کند."}, {"source": "TechCrunch AI", "title": "Recursive launches Flint, a laptop coding model it says was largely built by AI", "link": "https://techcrunch.com/2026/10/21/recursive-launches-flint-a-laptop-coding-model-it-says-was-largely-built-by-ai/", "summary": "Startup Recursive has released Flint, a free, laptop-sized coding model built largely by its own AI research system, as an early test of AI that improves itself.", "date_str": "2026-10-21T20:27:41+00:00", "hash": "c3712ffc30200f1c", "title_fa": "Recursive Flint را راه‌اندازی کرد، یک مدل کدگذاری لپ‌تاپ که می‌گوید عمدتاً توسط هوش مصنوعی ساخته شده است", "summary_fa": "Startup Recursive Flint را منتشر کرده است، یک مدل برنامه نویسی رایگان با اندازه لپ تاپ که عمدتا توسط سیستم تحقیقاتی هوش مصنوعی خود ساخته شده است، به عنوان یک آزمایش اولیه هوش مصنوعی که خود را بهبود می بخشد. Recursive، یک استارت‌آپ هوش مصنوعی که سال گذشته تأسیس شد، شروع به عمل به نام خود کرده است. این شرکت که در تلاش است تا هوش مصنوعی بسازد که بتواند خود را بهبود بخشد، اولین مدل خود با نام Flint را روز چهارشنبه عرضه کرد. Flint یک مدل کدنویسی رایگان است که می تواند روی لپ تاپ اجرا شود و عمدتاً با کمک هوش مصنوعی ساخته شده است. این شرکت می‌گوید سیستم تحقیقاتی خودکار Recursive که آن را Eureka Machine می‌نامد، تقریباً در هر مرحله از توسعه Flint کمک کرده است. این به یک تیم کوچک اجازه داد تا این مدل را در کمتر از چهار ماه از ابتدا بسازند. Flint یک آزمایش عمومی اولیه برای بهبود خود بازگشتی است: این ایده که هوش مصنوعی می تواند هوش مصنوعی بهتری بسازد، که به نوبه خود هوش مصنوعی حتی بهتری را ایجاد می کند. همچنین یکی از ایده های مورد بحث در صنعت است. برخی از محققان نگرانند که بهبود هوش مصنوعی از کنترل انسان خارج شود. در حال حاضر، نسخه بازگشتی محدودتر است: یک دستیار تحقیقاتی هوش مصنوعی که توسط افرادی نظارت می شود که مدلی به اندازه کافی کوچک برای لپ تاپ تولید کرده اند. این شرکت در ماه می با سرمایه گذاری 650 میلیون دلاری به ارزش 4.65 میلیارد دلار از پشتیبانانی از جمله GV، Nvidia و AMD Ventures از مخفی کاری خارج شد. Recursive توسط مدیرعامل ریچارد سوچر، دانشمند ارشد سابق Salesforce هدایت می شود. از آنجایی که Flint به جای سرورهای ابری یک شرکت، روی رایانه شخصی کاربر اجرا می‌شود، توسعه‌دهندگان می‌توانند از آن به صورت"}, {"source": "TechCrunch AI", "title": "While Amazon blocks AI agents, Walmart rolls out the welcome mat", "link": "https://techcrunch.com/2026/10/21/while-amazon-blocks-ai-agents-walmart-rolls-out-the-welcome-mat/", "summary": "As Amazon blocks AI agents from shopping on its site, Walmart is taking the opposite approach, introducing new technology that lets AI agents make purchases on customers' behalf, with controls over spending and transaction approvals.", "date_str": "2026-10-21T19:30:00+00:00", "hash": "c52b93f9c52345e4", "title_fa": "در حالی که آمازون عوامل هوش مصنوعی را مسدود می کند، والمارت تشک خوشامدگویی را عرضه می کند", "summary_fa": "از آنجایی که آمازون مانع از خرید عوامل هوش مصنوعی در سایت خود می شود، والمارت رویکردی مخالف را در پیش گرفته است و فناوری جدیدی را معرفی می کند که به عوامل هوش مصنوعی اجازه می دهد از طرف مشتریان خرید کنند، با کنترل هزینه ها و تایید تراکنش ها. این خرده‌فروش روز چهارشنبه اعلام کرد والمارت با راه‌اندازی Agent Gateway خود برای مدیریت تراکنش‌ها و سایر ویژگی‌های جدید با هدف مشتریانی که از عوامل هوش مصنوعی استفاده می‌کنند، تجارت نمایندگی را پذیرفته است. این اقدام اندکی پس از آن صورت گرفت که رقیب اصلی والمارت، آمازون، مانع از خرید عوامل هوش مصنوعی از طرف خریداران آنلاین شد. استقبال این شرکت از فناوری هوش مصنوعی، آن را از سایر مشاغل آنلاین متمایز می کند، از جمله نه تنها آمازون، بلکه سایت های مختلف مسا and stars talk ayahuasca ceremonies, mining kids for data – and punching CEOs Showrunner Jonathan Glatzer wanted the tagline of his latest TV creation to be: “We’re so fucked.” He laughs. “Sadly it got rejected by the network. Hey, maybe I can use it for season two!” The show in question is The Audacity, his darkly comic drama about AI tech titans. Instead, it went with the more PG tagline “Move fast and break people” – a twist on “Move fast and break things”, the Facebook motto coined by Mark Zuckerberg. The Audacity promises to do for tech bros what Succession did for legacy media. Considering Glatzer is a former writer on Succession, that is no empty threat. This acerbic and all-too-timely Silicon Valley satire follows CEO Duncan Park (played by Billy Magnussen), the obscenely wealthy founder of a data analytics company. He’s a self-proclaimed “inventor of the future” who also happens to be a morally bankrupt man-baby. “Duncan is worth about half a billion,” says Glatzer. “Naturally, that’s not enough. He desperately wants to be a billionaire and ascend to what we call ‘God Mountain’. But he’s no God.” Continue reading...", "date_str": "2026-10-22T12:34:33+00:00", "hash": "049e68cb117a14af", "title_fa": "«باشگاه مبارزه برادران فناوری واقعی است!» غول‌های هوش مصنوعی در یک برنامه تلویزیونی جدید وحشیانه درمان جانشینی را دریافت می‌کنند.", "summary_fa": "The Audacity یک طنز بی باک است که به «عجیب‌های خودمانیک» سیلیکون ولی می‌پردازد. خالق و ستارگان آن در مراسم آیاهوااسکا صحبت می‌کنند، بچه‌ها برای داده‌ها استخراج می‌کنند – و مدیران اجرایی را مشت می‌کنند، جاناتان گلاتزر، مجری برنامه، می‌خواست شعار آخرین ساخته تلویزیونی‌اش این باشد: «ما خیلی لعنتی‌ایم». او می خندد. \"متاسفانه توسط شبکه رد شد. سلام، شاید بتوانم از آن برای فصل دوم استفاده کنم!\" نمایش مورد بحث The Audacity است، درام کمیک تاریک او درباره غول های فناوری هوش مصنوعی. در عوض، با شعار بیشتر PG \"سریع حرکت کنید و مردم را بشکنید\" همراه شد - یک پیچش در \"سریع حرکت کنید و چیزها را بشکنید\"، شعار فیس بوک که توسط مارک زاکربرگ ابداع شد. Audacity قول می دهد همان کاری را که Succession برای رسانه های قدیمی انجام داد، برای برادران فناوری انجام دهد. با توجه به اینکه گلاتزر نویسنده سابق کتاب جانشینی است، این تهدیدی خالی نیست. این طنز هجوآمیز و بسیار به موقع دره سیلیکون از مدیرعامل دانکن پارک (با بازی بیلی مگنوسن)، بنیانگذار ثروتمند وقیحانه یک شرکت تجزیه و تحلیل داده پیروی می کند. او یک خودخوانده «مخترع آینده» است که از نظر اخلاقی نیز یک مرد-کودک ورشکسته است. گلاتزر می گوید: «دانکن حدود نیم میلیارد ارزش دارد. طبیعتاً این کافی نیست. او شدیداً می‌خواهد میلیاردر شود و به جایی که ما «کوه خدا» می‌گوییم صعود کند. اما او خدا نیست.» به خواندن ادامه دهید... جاناتان گلاتزر، بازیگر داستان فیلم، می‌خواست شعار آخرین ساخته تلویزیونی‌اش این باشد: «ما خیلی لعنتی‌ایم». او می خندد. متأسفانه توسط شبکه رد شد. هی، شاید بتوانم از آن برای فصل دوم استفاده کنم!» نمایش مورد بحث The Audacity است، درام کمیک تاریک او درباره غول های فناوری هوش مصنوعی. در عوض، با شعار بیشتر PG \"سریع حرکت کنید و مردم را بشکنید\" همراه شد - یک پیچش در"}, {"source": "The Guardian AI", "title": "How tech became the villain of the US midterms", "link": "https://www.theguardian.com/us-news/ng-interactive/2026/oct/22/us-midterms-tech-datacenters-ai", "summary": "Datacenters, AI and distaste for the billionaires developing it has soured Americans on big tech How will Trump’s mass deportation agenda shape the US midterm elections? Our reporters answer your questions The campaign ad begins with a clear, idyllic stream that suddenly turns sludge-brown as two concrete datacenters slam onto its banks. Another facility thuds down on a peaceful suburban park, and two more crush-green pastures as an ominous soundtrack to a disaster movie blares overtop. “They’re coming for our rivers. Our neighborhoods. Our farmland,” a deep-voiced narrator says. “Because Brent Taylor wrote the law allowing datacenters to take over Tennessee.” Continue reading...", "date_str": "2026-10-22T12:00:44+00:00", "hash": "69ffa1b3d49f748f", "title_fa": "چگونه فناوری به شرور میان دوره ای ایالات متحده تبدیل شد", "summary_fa": "دیتاسنترها، هوش مصنوعی و بیزاری از میلیاردرهایی که در حال توسعه آن هستند، آمریکایی ها را در زمینه فناوری بزرگ عصبانی کرده است، برنامه اخراج دسته جمعی ترامپ چگونه انتخابات میان دوره ای ایالات متحده را شکل خواهد داد؟ خبرنگاران ما به پرسش‌های شما پاسخ می‌دهند. تبلیغ کمپین با جریانی روشن و ایده‌آل آغاز می‌شود که ناگهان با برخورد دو دیتاسنتر بتنی به سمت کرانه‌های آن، به رنگ قهوه‌ای لجنی در می‌آید. یکی دیگر از امکاناتی که در یک پارک آرام حومه شهر به صدا در می آید، و دو مرتع سرسبز دیگر به عنوان موسیقی متن شوم یک فیلم فاجعه آمیز از بالای سر به صدا در می آید. یک راوی با صدای عمیق می گوید: \"آنها برای رودخانه های ما می آیند. محله های ما. زمین های کشاورزی ما.\" \"زیرا برنت تیلور قانونی را نوشت که به دیتاسنترها اجازه می دهد تا تنسی را تصرف کنند.\" به خواندن ادامه دهید... آگهی حمله که توسط «Three Star Pac» همسو با دموکرات ها پرداخت شده و یک نامزد جمهوری خواه کنگره تنسی را هدف قرار می دهد، یکی از بیش از 150 آگهی تبلیغاتی کمپین انتخاباتی میان دوره ای در سراسر ایالات متحده است که بر مراکز داده یا صنعت هوش مصنوعی متمرکز شده است. در مناظره‌ها و گردهمایی‌ها، در پست‌ها و تبلیغات آنلاین، صنعت رو به رشد هوش مصنوعی در کانون توجه قرار گرفته است، زیرا نامزدهای جمهوری‌خواه و دموکرات تلاش می‌کنند رای‌دهندگان را متقاعد کنند که مخالفان آنها امکانات نامطلوب را در حیاط خلوت رای‌دهندگان قرار خواهند داد. و این فقط مراکز داده نیستند - نگرانی عمومی از هوش مصنوعی و بیزاری از میلیاردرهایی که آن را توسعه می دهند، و همچنین واکنش شدید نسبت به تجاوز به فناوری مانند دوربین های نظارتی، صنعت فناوری را به یک شرور همه جا در این دوره از انتخابات تبدیل کرده"}, {"source": "The Guardian AI", "title": "‘Pure arrogance’: anger in Finland as Google illegally fells 250,000 trees for datacentre", "link": "https://www.theguardian.com/environment/ng-interactive/2026/oct/22/finland-google-felling-trees-datacentre", "summary": "Company ordered to stop work at two sites in country, which has found itself at forefront of tech firms’ latest push Behind a wire fence lies a vast gaping wound of earth. Before Google’s arrival a few months ago, an estimated quarter of a million trees occupied the 330 hectares (815 acres) of forest near the town of Muhos in rural northern Finland. Now they are all gone. After the tech company illegally stripped the entire area to build a datacentre – taking even the top soil with it – all that remains is a vast expanse of mud indented with the trail marks of machinery, puddles and mounds of earth, roots and branches. Residents say that brown water flowing off the site is going into a stream that feeds the Oulujoki River. Continue reading...", "date_str": "2026-10-22T11:22:23+00:00", "hash": "15c85ec7041c6b30", "title_fa": "\"غرور محض\": خشم فنلاند به دلیل قطع غیرقانونی 250000 درخت توسط گوگل برای مرکز داده", "summary_fa": "به شرکت دستور داده شد تا کار در دو سایت در کشور را متوقف کند، که خود را در خط مقدم آخرین فشار شرکت های فناوری قرار داده است. قبل از ورود گوگل چند ماه پیش، تخمین زده می شود که یک چهارم میلیون درخت 330 هکتار (815 هکتار) از جنگل را در نزدیکی شهر Muhos در روستایی شمال فنلاند اشغال کرده بودند. حالا همه آنها رفته اند. پس از اینکه شرکت فناوری به‌طور غیرقانونی کل منطقه را برای ساخت یک مرکز داده از بین برد - حتی خاک بالایی را با خود برد - تنها چیزی که باقی می‌ماند گستره وسیعی از گل است که با آثار ماشین‌آلات، گودال‌ها و تپه‌های زمین، ریشه‌ها و شاخه‌ها فرورفته است. ساکنان می‌گویند که آب قهوه‌ای رنگی که از محل خارج می‌شود به نهری می‌رود که رودخانه اولوجوکی را تغذیه می‌کند. به خواندن ادامه دهید... «این پایان نمی یابد. ماری آنالا، بوم‌شناس انجمن فنلاند برای حفاظت از طبیعت (SLL) می‌گوید: «این جنگل پیشین را از اطراف به تماشای فیلم‌های هواپیماهای بدون سرنشین از جنگل سابق می‌اندازد. فنلاند با 145 مرکز داده جدید در مراحل مختلف برنامه‌ریزی، خود را در خط مقدم آخرین تلاش‌های شرکت‌های فناوری قرار داده است. همچنین قابلیت ژئوپلیتیک نسبی، جذابیت ژئوپلیتیکی و آب و هوای فوق‌العاده آن را به ارمغان می‌آورد. در مورد هزینه های انرژی در اوایل این ماه، Google توسط سازمان مجوز و نظارت فنلاند (LVV) دستور داده شد تا به طور موقت کار روی Muhos و سایت دیگری در حدود 100 کیلومتری جنوب شرقی در روستای Otanmäki را متوقف کند، زیرا نتوانست ارزیابی‌های لازم را برای اثرات زیست محیطی قبل از پاکسازی زمین انجام دهد. این خبر باعث اعتراض گسترده و یک حسابرسی ملی در مورد اینکه این کشور در صورت وجود چه نقشی باید در عجله جهانی برای ساخت مراکز داده برای همگام شدن با توسعه"}, {"source": "The Guardian AI", "title": "Barclays to cut 5,000 jobs as bank’s bosses hail AI productivity advances", "link": "https://www.theguardian.com/business/2026/oct/22/barclays-profits-up-as-uk-banks-brace-for-tax-increase-in-budget", "summary": "Equating to the loss of 5% of its 93,000 global staff, job cuts come as bank announces jump in quarterly profits Business live – latest updates Barclays is cutting 5,000 jobs as part of wider cost-saving plans that its bosses say are being driven by advances in AI. The job cuts will mean losing about 5% of the bank’s 93,000 global staff, with executives confirming they had already cut 1,000 workers since the start of the year. Continue reading...", "date_str": "2026-10-22T08:40:42+00:00", "hash": "e160c2e448abdca9", "title_fa": "بارکلیز 5000 شغل را اخراج می کند زیرا روسای بانک از پیشرفت بهره وری هوش مصنوعی استقبال می کنند", "summary_fa": "کاهش شغل برابر با از دست دادن 5 درصد از 93000 کارمند جهانی خود، همزمان با اعلام افزایش سود سه ماهه توسط بانک انجام می شود. این تعدیل مشاغل به معنای از دست دادن حدود 5 درصد از 93000 کارمند جهانی بانک خواهد بود و مدیران اجرایی تایید کرده اند که از ابتدای سال تاکنون 1000 کارگر خود را اخراج کرده اند. ادامه مطلب... مدیر مالی بانک، آنا کراس، روز پنجشنبه به خبرنگاران گفت که کاهش مشاغل بخشی از برنامه‌هایی برای صرفه‌جویی بیش از 1.1 میلیارد پوند در سال 2027 است. «این اقدامات شامل کاهش انتظاری حدود 5000 کارمند تمام وقت است. حدود 60 درصد از اقدامات گروهی مربوط به عملکردهای پشتیبانی، از جمله توسعه دهندگان کمتر است، زیرا هوش مصنوعی باعث بهره وری بیشتر افراد می شود. مدیر اجرایی سی‌اس ونکاتاکریشنان، در پاسخ به این سوال که چه تعداد از کل کاهش‌های شغلی مستقیماً با پیشرفت‌های هوش مصنوعی مرتبط است، گفت که بانک در حال انجام «سرمایه‌گذاری عمیق» در فناوری و ساده‌سازی فرآیندهای خود بوده است. «این باعث می‌شود بخش عمده‌ای از بهره‌وری‌هایی که تاکنون دیده‌اید، ایجاد شود. ونکاتاکریشنان با بیان اینکه هوش مصنوعی نقش مهمی برای نوسازی فناوری بانک دارد، گفت: \"هوش مصنوعی نقش مهمی را ایفا می کند و ممکن است نقش مهم تری در آینده ایفا کند.\" این خبر ماه‌ها پس از آن منتشر می‌شود که یکی دیگر از بانک‌های مستقر در بریتانیا به نام Standard Chartered اعلام کرد که قصد دارد بیش از 7000 شغل را در چهار سال آینده کاهش دهد زیرا استفاده از هوش مصنوعی را افزایش می‌دهد. این بدان معناست که تا سال 2030 حدود 15 درصد از نقش های پشتیبان خود را کاهش می دهد."}, {"source": "The Guardian AI", "title": "AI firms say UK has a year to head off datacentre protests before construction is threatened", "link": "https://www.theguardian.com/uk-news/2026/oct/22/ai-firms-say-uk-has-a-year-to-head-off-datacentre-protests-before-construction-is-threatened", "summary": "Exclusive: Nvidia, Microsoft and Cisco taskforce urges ministers to offer areas greater benefits from tech infrastructure amid fears of US-style opposition AI companies have told ministers they have 12 months to head off public opposition to datacentres in the UK or risk US-style protests that could threaten their construction. Successive dry summers and rising energy bills are increasing public scrutiny of plans for the huge computer warehouses that are used to train and run AI models, says a submission to the Labour government from a group including the AI infrastructure companies Nvidia, Microsoft and Cisco. Continue reading...", "date_str": "2026-10-22T05:00:08+00:00", "hash": "cf4a6720a51c24d6", "title_fa": "شرکت‌های هوش مصنوعی می‌گویند که بریتانیا یک سال فرصت دارد تا قبل از تهدید ساخت‌وساز، اعتراضات مرکز داده را متوقف کند", "summary_fa": "انحصاری: گروه کاری انویدیا، مایکروسافت و سیسکو از وزرای خود می‌خواهند که در میان ترس از مخالفت‌های آمریکایی، به وزرا پیشنهاد دهند تا مزایای بیشتری از زیرساخت‌های فناوری ارائه دهند، شرکت‌های هوش مصنوعی به وزرا گفته‌اند که 12 ماه فرصت دارند تا از مخالفت عمومی با مراکز داده در بریتانیا جلوگیری کنند یا خطر اعتراضات مشابه آمریکایی را که می‌تواند ساخت آن‌ها را تهدید کند. بر اساس گزارش گروهی از جمله شرکت‌های زیرساخت هوش مصنوعی انویدیا، مایکروسافت و سیسکو، تابستان‌های خشک پی در پی و افزایش قبوض انرژی، نظارت عمومی بر برنامه‌های انبارهای رایانه‌ای عظیم را که برای آموزش و اجرای مدل‌های هوش مصنوعی استفاده می‌شوند، افزایش می‌دهد. ادامه مطلب... در میان افزایش فعالیت‌های ضد مرکز داده در ایالات متحده و اروپا، آنها از وزرا می‌خواهند «فشرده‌ای» ایجاد کنند که نشان دهد جوامع چگونه می‌توانند از میزبانی مراکز داده بهره ببرند، از جمله به شوراهایی که میزبان آنها هستند اجازه می‌دهد درآمدهای مالیاتی بیشتری را حفظ کنند. این اقدام توسط گروه ویژه رهبری هوش مصنوعی (SAIL) منعکس کننده نگرانی فزاینده در بین شرکت های فناوری است که استدلال هایی که مانع توسعه مرکز داده در بخش هایی از ایالات متحده شده است در بریتانیا وجود دارد. مایکروسافت قول داده است 30 میلیارد دلار (22 میلیارد پوند) در زیرساخت هوش مصنوعی بریتانیا سرمایه گذاری کند. مایکروسافت یک مرکز داده در اکتون لندن ساخته است و مرکز دیگری در نیوپورت در دست ساخت است، اما می‌خواهد چندین تأسیسات دیگر بسازد و با رهبران محلی و ملی، از جمله نخست‌وزیر، اندی برنهام، بر سر توازن بین مزایای بالقوه هوش مصنوعی برای اقتصاد و مخالفت عمومی با مراکز داده تعامل دارد. گروه SAIL گفت: «در ایالات متحده، مخالفان محلی سازمان‌یافته پروژه‌های مرکز داده کاملاً مجاز را متوقف کرده‌اند و حتی در ایالت‌هایی که طرفدار رشد هستند، تعلیق‌ها اعلام شده است."}, {"source": "The Guardian AI", "title": "‘I’d consider replacing one of my children’: Taika Waititi on robot kids, his cheese-o-meter and Klara and the Sun", "link": "https://www.theguardian.com/film/2026/oct/22/taika-waititi-kazuo-ishiguro-robot-friend-klara-and-the-sun", "summary": "The director has turned Kazuo Ishiguro’s acclaimed novel about an ailing adolescent and her glitchy robot friend into a thought-provoking film. What do the pair think this story says about tech, love and grief? In the wings of the London film festival, a group of young influencers are discussing their personal highlights. Klara and the Sun, says one, and her colleagues agree. It’s not just that the film is still so fresh in their memory, or that they have gathered today to meet its creators and stars. Klara is funny and moving; it’s their festival favourite so far. I relay this exchange to Taika Waititi, the film’s director, who is sipping bottled water in a room down the hall. His gaze widens. He almost chokes. “Thank God!” he exclaims with just a bit too much heat. Everybody has a perfect film, just as everybody has a perfect friend, and they vary because everybody is different. In the film, sick 14-year-old Josie loves her discontinued robot doll Klara, whereas most kids her age opt for brighter, shinier models. And the young influencers love Klara and the Sun – Waititi’s adaptation of Kazuo Ishiguro’s acclaimed novel – while most older critics vehemently, violently disagree . All of which shows that there’s no accounting for taste, that people are confounding, and that our hearts and our brains are not always in sync. That keeps life interesting. It’s partly what the film is about. “The emotions that we give very simple labels to are really complex,” says Ishiguro, who is seated alongside the director. “The thing we call love, for example, is incredibly noisy and multifaceted. Nobody knows what the hell love is.” Continue reading...", "date_str": "2026-10-22T04:00:06+00:00", "hash": "cbd0693dc11353d5", "title_fa": "«من می‌خواهم یکی از فرزندانم را جایگزین کنم»: تایکا وایتیتی روی بچه‌های روباتی، پنیر او متر و کلارا و خورشید", "summary_fa": "کارگردان، رمان تحسین‌شده کازوئو ایشی‌گورو درباره یک نوجوان بیمار و دوست ربات پر زرق و برق او را به فیلمی قابل تامل تبدیل کرده است. این جفت فکر می کنند این داستان در مورد فناوری، عشق و غم چه می گوید؟ در بال‌های جشنواره فیلم لندن، گروهی از اینفلوئنسرهای جوان در حال بحث و گفتگو درباره نکات برجسته شخصی خود هستند. یکی می‌گوید کلارا و سان و همکارانش موافقند. این فقط این نیست که این فیلم هنوز در خاطره آنها بسیار تازه است، یا آنها امروز برای دیدار با سازندگان و ستاره های آن گرد هم آمده اند. کلارا خنده دار و متحرک است. این جشنواره مورد علاقه آنها تاکنون است. این تبادل نظر را به تایکا وایتیتی، کارگردان فیلم، که در اتاقی پایین راهرو در حال نوشیدن آب بطری است، می‌رسانم. نگاهش گشاد می شود. تقریباً خفه می شود. \"خدایا شکرت!\" فقط با کمی حرارت زیاد فریاد می زند. هر کس یک فیلم کامل دارد، همانطور که همه یک دوست کامل دارند، و آنها متفاوت هستند زیرا همه افراد متفاوت هستند. در این فیلم، جوزی 14 ساله بیمار، عروسک روباتی متوقف شده خود، کلارا را دوست دارد، در حالی که اکثر بچه های هم سن او مدل های درخشان تر و درخشان تر را انتخاب می کنند. و اینفلوئنسرهای جوان عاشق کلارا و خورشید هستند – اقتباس وایتیتی از رمان تحسین‌شده کازوئو ایشی‌گورو – در حالی که اکثر منتقدان مسن‌تر به شدت و به شدت مخالف هستند. همه این‌ها نشان می‌دهند که هیچ حسابی برای سلیقه وجود ندارد، مردم گیج‌کننده هستند و قلب و مغز ما همیشه با هم هماهنگ نیستند. که زندگی را جذاب نگه می دارد. تا حدودی این موضوع در مورد فیلم است. ایشی گورو که در کنار کارگردان نشسته است، می‌گوید: «احساساتی که ما به آنها برچسب‌های خیلی ساده می‌دهیم، واقعاً پیچیده هستند. برای مثال،"}, {"source": "The Guardian AI", "title": "Canadian publisher Boréal ends relationship with novelist Thélyson Orélien over alleged use of AI", "link": "https://www.theguardian.com/culture/2026/oct/22/canadian-publisher-boreal-ends-relationship-author-thelyson-orelien-over-ai", "summary": "Author withdrawn from France’s Prix Goncourt last month has repeatedly denied using artificial intelligence to write novel The publisher of top-selling Haitian Canadian writer Thélyson Orélien, who was removed from France’s most prestigious literary prize list last month, has confirmed the author used artificial intelligence to help write his novel C’était ça ou mourir (It Was Either That or Die). Orélien has denied allegations that he used AI on his breakthrough novel and, last week, Canadian publisher Les Éditions du Boréal said it was standing by the 38-year-old writer. Continue reading...", "date_str": "2026-10-22T01:13:01+00:00", "hash": "30a1262851a71c76", "title_fa": "ناشر کانادایی Boreal به دلیل استفاده ادعایی از هوش مصنوعی به رابطه خود با رمان نویس Thélyson Orélien پایان داد.", "summary_fa": "نویسنده ای که ماه گذشته از جایزه گنکور فرانسه کنار رفت، استفاده از هوش مصنوعی برای نوشتن رمان را بارها رد کرده است. اورلین ادعاهایی مبنی بر استفاده از هوش مصنوعی در رمان موفق خود را رد کرده است و هفته گذشته، ناشر کانادایی Les Éditions du Boréal گفت که در کنار نویسنده 38 ساله است. به خواندن ادامه دهید... اما روز چهارشنبه، Boreal گفت که تحقیقات بیشتری در مورد این اتهامات انجام داده است. در بیانیه بورئال آمده است: «اطلاعات جدیدی که طی چند روز گذشته تأیید شده است، نشان می‌دهد که از هوش مصنوعی در فرآیند نوشتن این رمان استفاده شده است». ناشر اعلام کرد که در حال \"پایان دادن به رابطه حرفه ای خود\" با اورلین است. Boreal گفت که از میزان استفاده از هوش مصنوعی در فرآیند نوشتن اطلاعی ندارد \"و ما احتمالا هرگز پاسخ قطعی نخواهیم داشت\". گفت که تمام نسخه‌های کاری رمان را جمع‌آوری کرده و یک طرف خارجی را برای تحلیل پیش‌نویس‌های مختلف استخدام کرده است. بورئال گفت: «نتایج به‌دست‌آمده در این هفته ردپای برچسب‌های هوش مصنوعی را در فراداده‌های برخی اسناد نشان داد. قبل از انجام این تحلیل، ناشر گفت که سعی کرده با اورلین برای جمع آوری شواهد لازم برای اثبات بی گناهی او همکاری کند. ناشر گفت که این تلاش بی نتیجه بود و اورلین \"متعاقبا اعلام کرد که اطلاعات بیشتری ارائه نخواهد کرد.\" این رمان در مورد مهاجرت برای ترجمه در بیش از 20 کشور برنامه ریزی شده بود."}, {"source": "The Guardian AI", "title": "In the age of AI, learning maths is even more vital | Letters", "link": "https://www.theguardian.com/education/2026/oct/21/in-the-age-of-ai-learning-maths-is-even-more-vital", "summary": "Readers react to Simon Jenkins’ article that said it’s more important for children to learn how to speak fluently than study mathematics Simon Jenkins must have had a deeply unpleasant experience of learning maths at school because he seems to have a pathological antipathy towards it ( We are teaching children maths they will never use. Isn’t it better to help them speak fluently?, 16 October ). I have no qualms with his insistence on the importance of oracy. But his argument breaks down with the claim that it is either oracy or maths, but not both. This is nonsense. Oracy and maths skills should exist side by side. Both contribute to a person’s ability to realise their full potential, and to employment opportunities. Maths drives the understanding of the natural world and contributes vastly to the solutions of problems that humanity needs to solve to exist. It is fundamental to science and technology, health and medicine, communications, the study of the Earth, finance and economics, distribution of resources and supply chains, architecture, warfare, and much else besides. Continue reading...", "date_str": "2026-10-21T16:33:12+00:00", "hash": "460ec08ba8de33c5", "title_fa": "در عصر هوش مصنوعی، یادگیری ریاضی از اهمیت بیشتری برخوردار است | نامه ها", "summary_fa": "خوانندگان به مقاله سایمون جنکینز واکنش نشان می‌دهند که می‌گوید یادگیری روان صحبت کردن برای کودکان مهم‌تر از مطالعه ریاضیات است. من از اصرار او بر اهمیت سخنوری ابایی ندارم. اما استدلال او با این ادعا شکسته می‌شود که یا سخنوری است یا ریاضی، اما نه هر دو. این مزخرف است. فن بیان و ریاضیات باید در کنار هم وجود داشته باشند. هر دو به توانایی فرد برای تحقق کامل پتانسیل خود و فرصت های شغلی کمک می کنند. ریاضیات درک جهان طبیعی را هدایت می کند و کمک زیادی به راه حل مسائلی می کند که بشر برای وجود آنها نیاز به حل آنها دارد. این امر برای علم و فناوری، بهداشت و پزشکی، ارتباطات، مطالعه زمین، امور مالی و اقتصاد، توزیع منابع و زنجیره تامین، معماری، جنگ و بسیاری موارد دیگر ضروری است. ادامه مطلب... اثرات منفی اقتصادی، اجتماعی و سلامتی و سلامتی مهارت‌های ریاضی ضعیف در بزرگسالی به خوبی شناخته شده است، با این حال شکاف مهارت‌های ریاضی - تفاوت بین تعداد افراد با سواد ریاضی مورد نیاز و تعداد ما - در بریتانیا بسیار زیاد است. بسیاری از جوانان از اضطراب ریاضی رنج می برند، اما این دلیلی بر و هوا آشنا خواهد بود. پیش‌بینی‌های گروه طیفی از نتایج ممکن را بررسی می‌کنند و سیستم‌هایی مانند گروه چند مدل آمریکای شمالی مدل‌های مختلف را برای پیش‌بینی فصلی ترکیب می‌کنند. مزایای پیش‌بینی سری‌های زمانی به روشی مشابه: مدل‌های تکمیلی دیدگاه‌های متفاوتی از آنچه بعداً می‌آید ارائه می‌دهند، و یک مجموعه آن دیدگاه‌ها را در یک پیش‌بینی ادغام می‌کند."}, {"source": "HuggingFace Blog", "title": "NVIDIA Kumo Relational Outperforms Supervised Machine Learning on Relational Data, No Training Required", "link": "https://huggingface.co/blog/nvidia/kumo-relational", "summary": "", "date_str": "2026-10-21T18:26:30+00:00", "hash": "e1b4c253902a9212", "title_fa": "عملکرد NVIDIA Kumo Relational از یادگیری ماشینی تحت نظارت در داده های رابطه ای بهتر است، بدون نیاز به آموزش", "summary_fa": "بازگشت به مقالات a]:hidden\"> عملکرد NVIDIA Kumo Relational بهتر از یادگیری ماشینی تحت نظارت در مورد داده‌های رابطه‌ای است، بدون نیاز به آموزش سازمانی + مقاله منتشر شده در 21 اکتبر 2026 رأی مثبت 16 +10 Joshua Przybylko jprzybylko دنبال کنید nvidia فدریکو لوپز flopeznv nvidia Valter Hudovernik valterh-nv را دنبال کنید nvidia Akihiro Nitta akihironitta-nv را دنبال کنید Ramona Bendias RBendiasN nvidia را دنبال کنید آردریان وونگ aw777 دنبال کنید nvidia :last-moll-iDr. مدل پایه رابطه ای از پیش آموزش دیده که پیش بینی ها را مستقیماً در پایگاه های داده سازمانی انجام می دهد. با توجه به یک پرس و جو پیش بینی، تا 10000 نمونه تاریخی را به عنوان زمینه جمع آوری می کند و نتایجی مانند انحراف، تقاضا یا تقلب را در یک پاس رو به جلو پیش بینی می کند. نیازی به آموزش خاص کار، مهندسی ویژگی، و صاف کردن جداول ندارد. Kumo Relational اولین مدل پایه چند شات است که از یادگیری ماشینی نظارت شده در معیارهای رابطه ای رایج بهتر عمل می کند. در میان 41 وظیفه در 15 پایگاه داده، مدل‌های یادگیری عمیق رابطه‌ای نظارت شده و خطوط لوله درختی تقویت‌شده با گرادیان مهندسی شده توسط متخصصان را شکست می‌دهد و در معیار سازمانی SAP SALT از نظر میانگین رتبه متقابل (MRR) 8 درصد از مجموعه‌های AutoGluon پیشی می‌گیرد. به پایگاه‌های داده با ردیف‌های 500B+ مقیاس می‌شود و برای انسان‌ها و عوامل به طور یکسان، از طریق کتابخانه مدل‌های داده‌های ساختاریافته منبع باز NVIDIA یا به عنوان NIM NVIDIA کار می‌کند. مدل‌های بنیادی Shift to Structured Data Foundations Models قبلاً کتاب بازی را برای زبان و بینش بازنویسی کرده‌اند. چندی پیش، تولید NLP به معنای یک مدل اختصاصی برای هر کار بود، که هر کدام از خط لوله‌های توکن‌سازی، lemmatization و n-گرم تغذیه می‌شد. LLMها به سه دلیل این پشته را تا حد"}, {"source": "HuggingFace Blog", "title": "How Specializing the Vocabulary of SLMs Can Cut Inference Cost by 77% in Real Applications", "link": "https://huggingface.co/blog/Dharma-AI/vocabx-vocabulary-specialization", "summary": "", "date_str": "2026-10-21T17:35:36+00:00", "hash": "2c9832e7f2fed87b", "title_fa": "چگونه تخصصی کردن واژگان SLM می تواند هزینه استنتاج را تا 77 درصد در برنامه های واقعی کاهش دهد؟", "summary_fa": "بازگشت به مقالات a]:hidden\"> چگونه تخصصی کردن واژگان SLM می تواند هزینه استنتاج را تا 77% در تیم برنامه های واقعی کاهش دهد. Duarte brunoduarte01 Dharma-AI Francisco de Almeida Rocha Alves falves9101 دنبال کنید Dharma-AI :last-child]:mb-0\"> مدل های تخصصی برای یک دامنه یا یک کار با تنظیم دقیق مدل های منبع باز عمومی، مانند Qwen و Gemma، یک واژگان و برنامه های عمومی ساخته شده برای بسیاری از دامنه ها را به ارث می برند. در یک کلاس نویسی که ما در مرحله تولید اجرا می کنیم، آن واژگان متنی را که مدل بیشتر می نویسد به چندین نشانه تقسیم می کند. این مقاله برخی از نتایج مقاله VocabX را پیش‌نمایش می‌کند که به زودی منتشر خواهیم کرد: چگونه واژگان را در مورد هزینه هر توکن به جای فرکانس آن تخصصی کردیم و هزینه استنتاج اندازه‌گیری شده را تا 77 درصد بدون تغییر مدل پایه کاهش دادیم. توکنایزر معمولاً به عنوان یک ویژگی ثابت مدل پایه در نظر گرفته می شود که به ارث رسیده و به حال خود رها می شود. برای یک مدل تخصصی در یک دامنه، می تواند یکی از بزرگترین اهرم های هزینه باشد و قبل از هر مرحله آموزشی تنظیم می شود. یکی از سیستم‌هایی که ما در تولید اجرا می‌کنیم، یک گریدر خودکار برای مقالات پرتغالی است که بر اساس Qwen3-4B ساخته شده است. مقاله، درخواست و متون پشتیبان اده می کند. این مکانیسم به یک شتاب دهنده اجازه می دهد بدون افزودن یک کلید ارسال اختصاصی مانند cuda با چارچوب یکپارچه شود. بسته torch_neuronx با PyTorch بالادست کار می کند تا Neuron را به عنوان یک پشتیبان بومی برای کد PyTorch ثبت کند. برای جزئیات بیشتر در مورد این مکانیسم توسعه، به تسهیل یکپارچه سازی Backend جدید توسط PrivateUse1 مراجعه کنید. تنظیم نمایه‌گر شما از دو شیء برای نمایه کردن حجم"}, {"source": "HuggingFace Blog", "title": "Granite Speech 5.0: Transcribe, Translate, and Attribute more Accurately and Faster", "link": "https://huggingface.co/blog/ibm-granite/granite-speech-5", "summary": "", "date_str": "2026-10-21T14:58:18+00:00", "hash": "c9d3e93bb4ed6a88", "title_fa": "Granite Speech 5.0: رونویسی، ترجمه و مشخص کردن دقیق تر و سریعتر", "summary_fa": "بازگشت به مقالات a]:hidden\"> Granite Speech 5.0: رونویسی، ترجمه و مشخص کردن با دقت بیشتر و سریعتر مقاله سازمانی منتشر شده در 21 اکتبر 2026 رای مثبت 18 +12 George Saon gsaon دنبال کنید ibm-granite Brian Kingsbury bedkingsbury را دنبال کنید. Sunder vishalsunder دنبال کنید ibm-granite Zvi Kons konszvi دنبال کنید ibm-granite Jeff Kuo ibm-jeffkuo دنبال کنید ibm-granite Samuel Thomas sthomas12 دنبال کنید ibm-granite Avihu Dekel Avihu دنبال کنید ibm-granite Hagai Aronowitz hagaia دنبال کنید ibm-granite دنبال کنید. Nagano tohru3 ibm-granite را دنبال کنید Sashi Novitasari sasnov ibm-granite Masayuki Suzuki szuk را دنبال کنید ibm-granite را دنبال کنید Madison Lee kristunlee را دنبال کنید ibm-granite را دنبال کنید :last-child]:mb-0\"> ما خوشحالیم که سه به‌روزرسانی در مجموعه‌های IBM Speaker-Grainte جدید به اشتراک می‌گذاریم: granite-speech-5.0-2b و نسخه های اصلاح شده دو مدلی که جامعه از قبل استفاده می کند، granite-speech-5.0-470m-turboctc و granite-speech-4.1-2b-plus. آنها با هم طیف کاملی از کارهای گفتاری سازمانی را پوشش می‌دهند: رونویسی و ترجمه با دقت بالا، رونویسی بسیار سریع در لبه، و ضبط‌هایی که چه کسی و چه زمانی صحبت کرده است، به اندازه آنچه گفته شده اهمیت دارد. Granite Speech 5.0 2B: دقیق تر، قوی تر، کنترل بیشتر granit
