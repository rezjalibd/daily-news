%AF-%D8%A8%D9%87-%D8%B3%D9%84%D8%A7%D8%AD-%D9%87%D8%B3%D8%AA%D9%87%D8%A7%DB%8C-%D8%AF%D8%B3%D8%AA-%DB%8C%D8%A7%D8%A8%D8%AF/", "summary": "وزیران خارجه کشورهای عضو گروه هفت در بیانیه پایانی نشست خود در پاریس، بر ضرورت جلوگیری از دستیابی جمهوری اسلامی به سلاح هسته‌ای تاکید کر ...", "date_str": "2026-11-11T15:03:11+00:00", "hash": "0ba2efec9cb7c7b9", "title_fa": "بیانیه گروه هفت: جمهوری اسلامی هرگز نباید به سلاح هسته‌ای دست یابد", "summary_fa": "وزیران خارجه کشورهای عضو گروه هفت در بیانیه پایانی نشست خود در پاریس، بر ضرورت جلوگیری از دستیابی جمهوری اسلامی به سلاح هسته‌ای تاکید کر ... در بیانیه مشترکی که روز چهارشنبه ۲۰ آبان منتشر شد، وزیران خارجه گروه هفت هشدار دادند که در صورت شکست تلاش‌های دیپلماتیک، کشورهای عضو به هماهنگی برای اعمال فشارهای اقتصادی و سیاسی بر جمهوری اسلامی ادامه خواهند داد تا توانایی آن برای ایجاد بی‌ثباتی در منطقه و جهان محدود شود. گروه هفت همچنین بر اجرای کامل تحریم‌های سازمان ملل علیه ایران که در سپتامبر ۲۰۲۵ از طریق سازوکار ماشه بازگردانده شدند، تاکید کرد و از همه کشورهای عضو سازمان ملل خواست این تحریم‌ها را به‌طور کامل اجرا کنند. بخش دیگری از این بیانیه به نقش جمهوری اسلامی در اقدامات خشونت‌آمیز در کشورهای عضو گروه هفت اختصاص دارد. وزیران خارجه این کشورها با ابراز نگرانی شدید از آنچه توطئه‌های خشونت‌آمیز ایران علیه شهروندان و در خاک کشورهای عضو خواندند، از ارزیابی دولت بریتانیا درباره دخالت تهران در حادثه ۲۷ سپتامبر در پایگاه هوایی سلطنتی فرفورد حمایت کردند. در این بیانیه آمده است: «ما ارزیابی بریتانیا درباره دخالت ایران در حادثه ۲۷ سپتامبر در پایگاه نیروی هوایی سلطنتی فرفورد را به رسمیت می‌شناسیم.» وزیران خارجه گروه هفت همچنین با اشاره به کمک‌های نظامی جمهوری اسلامی به روسیه، این حمایت‌ها را محکوم کردند و از تهران خواستند پشتیبانی خود از گروه‌های مسلح غیردولتی در منطقه را متوقف کند. در بیانیه مشترک این کشورها آمده است: «ایران نباید هیچ تردیدی داشته باشد که ما متحد هستیم و همچنان به حفاظت از حاکمیت ملی خود متعهد خواهیم ماند.» وزیران خارجه گروه هفت در بخش دیگری از بیانیه، حملات جمهوری اسلامی به کشورهای همسایه و پیامدهای محدودیت تردد در تنگه هرمز بر تجارت بین‌المللی، امنیت انرژی و اقتصاد جهانی را به‌شدت محکوم کردند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/888_GbEq__v1024x512__box_0%2C288%2C2048%2C1365.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۲۰ آبان • ۱۸:۳۳"}, {"source": "IranWire", "title": "محسن رضایی: پایگاه‌های آمریکا در اروپا را هدف قرار می‌دهیم", "link": "https://iranwire.com/fa/news-1/160113-%D9%85%D8%AD%D8%B3%D9%86-%D8%B1%D8%B6%D8%A7%DB%8C%DB%8C-%D9%BE%D8%A7%DB%8C%DA%AF%D8%A7%D9%87%D9%87%D8%A7%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D8%AF%D8%B1-%D8%A7%D8%B1%D9%88%D9%BE%D8%A7-%D8%B1%D8%A7-%D9%87%D8%AF%D9%81-%D9%82%D8%B1%D8%A7%D8%B1-%D9%85%DB%8C%D8%AF%D9%87%DB%8C%D9%85/", "summary": "محسن رضایی، دبیر شورای عالی امنیت ملی جمهوری اسلامی، تهدید کرد در صورت از سرگیری حملات نظامی آمریکا به ایران، پایگاه‌های دوردست این کشور ...", "date_str": "2026-11-11T15:38:23+00:00", "hash": "a1065937fcb9848c", "title_fa": "محسن رضایی: پایگاه‌های آمریکا در اروپا را هدف قرار می‌دهیم", "summary_fa": "محسن رضایی، دبیر شورای عالی امنیت ملی جمهوری اسلامی، تهدید کرد در صورت از سرگیری حملات نظامی آمریکا به ایران، پایگاه‌های دوردست این کشور ... رضایی در مصاحبه با شبکه المیادین که روز چهارشنبه ۲۰ آبان منتشر شد، درباره احتمال گسترش حملات جمهوری اسلامی به مواضع آمریکا گفت: «منظورم پایگاه‌های نظامی آمریکا در مناطق دوردستی است که تاکنون به آن‌ها حمله نکرده‌ایم. ممکن است برخی جزایری را نیز هدف قرار دهیم که تصور می‌کنند موشک‌های ما به آن‌ها نمی‌رسد. حتی ممکن است برخی پایگاه‌های نظامی آمریکا در کشورهای اروپایی را نیز هدف قرار دهیم.» این اظهارات در حالی مطرح می‌شود که گزارش‌هایی درباره مذاکرات ایران و قطر بر سر طرحی برای بازگشایی تنگه هرمز طی دو روز آینده منتشر شده است. با این حال، تهران بر پذیرش شروطی که می‌گوید به آمریکا اعلام کرده، پافشاری می‌کند. رضایی پاسخ اولیه واشینگتن به این شروط را «فریبکارانه» و «مبهم» توصیف کرد و گفت جمهوری اسلامی همچنان منتظر دریافت پاسخی روشن از آمریکا است. او همچنین هرگونه برنامه برای دیدار با جی‌دی ونس، م %8C%D8%A7%D9%86-%D9%81%D9%82%D8%B1", "summary": "همزمان با گسترش فقر و سقوط قدرت خرید خانواده‌ها در ایران، گزارش‌های تازه از خیابان‌های تهران ابعاد تکان‌دهنده‌ای از بحران معیشتی در نظام جمهوری اسلامی ایران را آشکار می‌کند. در خیابان فرهنگ حسینی تهران که به «خیابان کلیه» شهرت یافته، دیوارها و درهای ساختمان‌ها از آگهی فروش اعضای بدن پر شده است. البته فروشندگان تنها به عرضه کلیه هم اکتفا نکرده‌اند و در میان آگهی‌ها، برای فروش کبد، مغز استخوان و حتی بیضه نیز اعلام آمادگی شده است. خبرنگار ایلنا در گزارشی میدانی، با شماری از فروشندگان اعضای بدن گفت‌وگو کرده است؛ این افراد در انواع مشاغل از پیک موتوری و کارگر ساختمانی گرفته تا مشاغل آزاد کار می‌کنند و برای پرداخت بدهی، تأمین پول رهن خانه یا جبران هزینه‌های زندگی حاضر شده‌اند بخشی از بدنشان را بفروشند. این گزارش در شرایطی منتشر می‌شود که طی سال‌های گذشته، همزمان با افزایش تورم، گرانی مسکن، کاهش ارزش ریال و سقوط دستمزدها، آگهی‌های فروش اعضای بدن به یکی از نشانه‌های بحران فقر در ایران تبدیل شده‌ است. اکنون روایت‌های تازه نشان می‌دهد که فشار اقتصادی حتی برخی افراد شاغل و دارای درآمد را نیز به چنین نقطه‌ای رسانده است. عابران پیاده در خیابان فرهنگ حسینی و خیابان مجاور آن، والی‌نژاد، با انبوه آگهی‌های فروش اعضای بدن مواجه می‌شوند. نزدیکی این خیابان‌ها به انجمن خیریه حمایت از بیماران کلیوی و مراکز درمانی، باعث شده است افرادی که به دنبال عضو پیوندی‌اند و کسانی که قصد فروش عضو دارند، در این محدوده به یکدیگر نزدیک شوند. یکی از کارکنان بیمارستان صدرا، واقع در انتهای خیابان فرهنگ حسینی، می‌گوید انتظار برای دریافت کلیه از مسیر رسمی ممکن است تا چهار سال طول بکشد، به همین دلیل برخی خانواده‌ها خود مستقیم درصدد جست‌وجوی فروشنده برمی‌آیند. به گفتهٔ این فرد، قیمت‌های پیشنهادی برای کلیه معمولاً به چند میلیارد تومان می‌رسد. او از امکان یافتن کلیه با گروه خونی او مثبت در حدود ۸۰۰ میلیون تومان و درخواست چهار تا پنج میلیارد تومان برای برخی گروه‌های خونی کمیاب خبر داد. فروش کلیه برای تسویه بدهی پیک موتوری ۳۰ ساله در این گزارش آمده که یکی از فروشندگان، پیک موتوری ۳۰ ساله‌ای در تهران است که برای پرداخت بدهی‌هایش، قصد فروش کلیه دارد. این مرد گفت یک خر  تخفیف‌های اوایل روز جمعه سیاه در حال حاضر به پایین‌ترین قیمت‌های سال رسیده است، که منجر به کاهش 43 درصدی روی تخت‌خواب‌های جایگزین Bedsur Down می‌شود - یک کالای اصلی مقرون به صرفه که من شخصاً روی هر تخت در خانه‌ام نگه می‌دارم. خواه برای زمستان به یک روتختی شیک و سنگین نیاز داشته باشید یا برای جلوگیری از تعریق شبانه به یک لحاف قابل تنفس", "image_url": "https://i.insider.com/6af37470a96052a81c3499b6?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۰ آبان • ۱۹:۳۲"}, {"source": "Business Insider", "title": "We've spent 10 years living between a sailboat and campervan. People ask us a lot of questions about hygiene and space.", "link": "https://www.businessinsider.com/common-questions-living-between-van-and-boat-hygeine-relationships-answers-2026-11", "summary": "By splitting our time living between a campervan and a sailboat, we ve been able to go on a lot of adventures over the past several years. Courtesy of Kristin Hanes My partner and I have spent the past decade living between a sailboat and a campervan. People ask us a lot of questions about our nomadic lifestyle . No, we don't get sick of each other. I shower every day, either at my gym or with a portable unit. And I do often miss living in a house. My partner and I have lived on sailboats and in vehicles for 10 years, an idea that's unfathomable to many people. They worry about things like getting along with their partner in such a small space, where to go to the bathroom, and the complexity of a life without structure or plans. And I get it. While there are more stories in the media of people choosing an untraditional path over a 9-to-5 and a mortgage, people like us are still the minority. Our first foray into vehicle living was a Toyota Prius in 2015 to avoid steep rent in the San Francisco Bay Area, and we now split our time between a Sprinter campervan in the US during the summer months and a sailboat in Mexico all winter. Here are the most common questions we get about our lifestyle, answered. How do you shower? To shower on our sailboat, we boil seawater. Courtesy of Kristin Hanes One misconception about van lifers is that we're dirty and don't shower often. Maybe that's true of some of us, but not me. I take a shower every day, either by heating water on my camp stove and pouring it into a solar shower (a portable system that heats water with sunlight) or by stopping at my gym, Planet Fitness. Our van carries 27 gallons of water, so plenty for brief military-style showers, where you conserve water by keeping it off while you apply soap and shampoo. If I absolutely can't have a shower for whatever reason, I will do a washcloth bath inside the van to get the dirt off before bed. Our sailboat has an entire bathroom where we shower, typically using a solar shower that we hang up on a hook. We boil seawater and take saltwater showers, and my hair has never felt better! Where do you go to the bathroom? Our campervan doesn t have its own bathroom. Courtesy of Kristin Hanes If I could get a penny for every time I've heard this question, I'd be rich. Strangers have even walked up to us in parking lots asking us about our bathroom situation, which is awkward to say the least. Here's the truth: We don't have a bathroom in our campervan. It grosses me out too ", "date_str": "2026-11-11T15:40:01+00:00", "hash": "ec72ecc016a84b2d", "title_fa": "ما 10 سال را بین یک قایق بادبانی و یک کمپرون زندگی کرده ایم. مردم از ما سوالات زیادی در مورد بهداشت و فضا می پرسند.", "summary_fa": "با تقسیم زمان زندگی‌مان بین یک کمپرون و یک قایق بادبانی، ما توانسته‌ایم در چند سال گذشته به ماجراجویی‌های زیادی بپردازیم. با حسن نیت از کریستین هانس، من و شریک زندگیم دهه گذشته را بین یک قایق بادبانی و یک کمپرون زندگی کرده ایم. مردم از ما سوالات زیادی در مورد سبک زندگی عشایری ما می پرسند. نه، ما از همدیگر بد نمی شویم. من هر روز دوش می‌گیرم، یا در باشگاه ورزشی خود یا با یک واحد قابل حمل. و من اغلب دلم برای زندگی در یک خانه تنگ می شود. من و شریکم به مدت 10 ault it was. We treat a marriage ending like a mystery to solve. Interestingly enough, this does not happen just for celebrities; ordinary people get the side-eye, too. On Sunday, actor Amanda Seyfried shared something that I wrote last year on her Instagram Stories. I was thrilled she shared my work, of course. But it was the words she chose to share that caught people's attention, and one word in particular: boring . I'd written those words while reflecting on my own divorce and my family's history. My parents are divorced. Both sets of my grandparents were divorced. I grew up in a family where divorce was absolutely normal, yet society still treated it like a scandal or a failure. I think it's high time we reframe divorce as just another life transition. As I wrote in the post she shared, \"The most radical thing we can do is make divorce boring. Make it normal. Make it accessible.\" View this post on Instagram A post shared by Olivia March Howell (@oliviahowell) Seyfried then shared a photograph of herself embracing Thomas Sadoski, the father of her children, from whom she announced her separation in September. She tagged him, too. By Monday morning, my words were appearing across celebrity news outlets . Seyfried was making headlines for normalizing divorce , something I've championed for five years through Fresh Starts Registry, which I co-founded with my sister. Yet amid the excitement, I kept thinking about the two people I most want to understand why this matters: my sons. Divorce allowed a different kind of childhood When my divorce was finalized in 2020, my boys were 4 and 7. I worried that the end of my marriage would become the defining tragedy of their childhood. Despite growing up around divorce, I'd still absorbed the cultural message that a family became \"broken\" when a marriage ended. My sons are now 10 and 13. We live upstairs in my childhood home, with my moth", "date_str": "2026-11-11T15:28:38+00:00", "hash": "27a95fcfe5dfa46f", "title_fa": "آ d Theft Auto 6 might just be the most anticipated game of all time. It's been 13 years since Rockstar dropped GTA 5 , and after years of rumors, leaks, and official announcements, the sixth mainstream installment in the series is nearly here. In fact, anyone who pre-ordered the game digitally can now pre-load it onto their console, if you want to ensure you're ready to play the second the game comes out. Now, few of us will buy a game console specifically for GTA 6 unless you don't already have a current-generation PlayStation or Xbox. (The PC version of the game isn't expected until at least early 2027.) But, as it turns out, there's one specific console that can run GTA 6 better than the rest. The PS5 Pro is apparently the best way to experience \"GTA 6\" Rockstar confirmed as much in a post on Tuesday , which was meant to spread the news about pre-loading the game. But, interestingly, it spurred a discussion about the performance of the game itself, as well as which consoles are best to run it. No matter which console you play GTA 6 on, Rockstar says that the game will only target 30 fps (frames per second). That's decided slow for a mainstream game in 2026. GTA 5 also shipped at 30 fps in 2013, but newer consoles can run it at higher frame rates. In fact, most games that launch on the latest generation of consoles can run at 60 fps, if not higher. While it's certainly not a dealbreaker, it is interesting that Rockstar's latest game can't run at a faster frame rate even on the PS5 Pro or the Xbox Series X. To that point, Rockstar called out the PS5 Pro specifically in its post, announcing, \"The PlayStation 5 Pro offers breathtaking visuals, with improved clarity through PlayStation Spectral Super Resolution (PSSR) and ray-traced shadows only available on PlayStation 5 Pro.\" PSSR is Sony's AI upscaler, similar to options like DLSS from Nvidia, which uses AI to add extra graphical information to games in real time. That allows developers like Rockstar to run the های هوشمند"], "datetime_fa": "۲۰ آبان • ۱۸:۳۰"}, {"source": "VentureBeat Tech", "title": "TrustedRouter launches three new encrypted 'fusion' models that combine multiple LLMs, including one exclusively with U.S. model providers", "link": "https://venturebeat.com/technology/trustedrouter-launches-three-new-encrypted-fusion-models-that-combine-multiple-llms-including-one-exclusively-with-u-s-model-providers", "summary": "Choosing an AI model for your company is hard enough. Choosing which one to use for every job is harder. Should you send a tricky code review to Anthropic’s Claude Fable 5.2, try an open-weight model such as Meituan’s LongCat-2.5, or use something else? The answer can change from one task to the next, even inside the same application. Read more", "date_str": "2026-11-11T14:39:03+00:00", "hash": "5db16d3ea1677c79", "title_fa": "TrustedRouter سه مدل جدید رمزگذاری شده «فیوژن» را راه اندازی می کند که چندین LLM را ترکیب می کند، از جمله یکی منحصراً با ارائه دهندگان مدل ایالات متحده", "summary_fa": "انتخاب یک مدل هوش مصنوعی برای شرکت شما به اندازه کافی سخت است. انتخاب اینکه کدام یک برای هر کاری استفاده شود سخت تر است. آیا باید یک بررسی کد پیچیده به Anthropic's Claude Fable 5.2 ارسال کنید، یک مدل وزن باز مانند Meituan's LongCat-2.5 را امتحان کنید یا از چیز دیگری استفاده کنید؟ پاسخ می تواند از یک کار به کار دیگر تغییر کند، حتی در داخل همان برنامه. ادامه مطلب", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic"], "datetime_fa": "۲۰ آبان • ۱۸:۰۹"}, {"source": "Ars Technica", "title": "Google DeepMind just mathematically verified key parts of Signal", "link": "https://arstechnica.com/ai/2026/11/signals-encryption-just-passed-an-ai-powered-mathematical-checkup/", "summary": "Google DeepMind researchers used agentic AI to mathematically prove, or “formally verify,” a number of the Signal protocol’s key cryptographic guarantees—a landmark development for the widely used cryptography and AI itself. Conducted as a sort of proof-of-concept project in just four weeks, the work is significant in two ways. It serves as further independent validation of the cryptography that protects massive quantities of the world's communications on platforms like the Signal app , Google Messages, and WhatsApp. And it demonstrates Google DeepMind's formal verification capabilities using a new AI framework called AlphaProof Code. More broadly, AI-aided formal verification is having a moment, but it is unclear how practical it will be for widespread use and how effective it can be at securing large amounts of code. Proponents of formal verification have long referred to it as a sort of holy grail in software security, because it uses math to check and validate that software is functioning as intended—in other words, that it doesn't have critical vulnerabilities. Read full article Comments", "date_str": "2026-11-11T14:08:57+00:00", "hash": "345389d7aa341d93", "title_fa": "Google DeepMind فقط بخش‌های کلیدی سیگنال را از نظر ریاضی تأیید کرد", "summary_fa": "محققان Google DeepMind از هوش مصنوعی عاملی برای اثبات ریاضی یا «تأیید رسمی» تعدادی از ضمانت‌های رمزنگاری کلیدی پروتکل سیگنال استفاده کردند - یک پیشرفت برجسته برای رمزنگاری پرکاربرد و خود هوش مصنوعی. این کار که به عنوان نوعی پروژه اثبات مفهوم تنها در چهار هفته انجام شد، از دو جنبه قابل توجه است. این به عنوان اعتبار سنجی مستقل بیشتر رمزنگاری عمل می کند که از مقادیر عظیمی از ارتباطات جهان در سیستم عامل هایی مانند برنامه سیگنال، پیام های گوگل و واتس اپ محافظت می کند. و قابلیت‌های تأیید رسمی Google DeepMind را با استفاده از یک چارچوب هوش مصنوعی جدید به نام AlphaProof Code نشان می‌دهد. به طور گسترده تر، تأیید رسمی با کمک هوش مصنوعی زمان زیادی دارد، اما مشخص نیست که چقدر برای استفاده گسترده عملی خواهد بود و چقدر می تواند در ایمن سازی مقادیر زیادی کد مؤثر باشد. طرفداران راستی‌آزمایی رسمی مدت‌هاست که از آن به عنوان نوعی جام مقدس در امنیت نرم‌افزار یاد می‌کنند، زیرا از ریاضیات برای بررسی و اعتبارسنجی اینکه نرم‌افزار همانطور که در نظر گرفته شده است، استفاده می‌کند – به عبارت دیگر ی اعتیادآور، تبلیغات برای افراد خردسال و «الگوهای تاریک» مانند اشتراک‌هایی که به سختی لغو می‌شوند. طبق نسخه پیش نویس، جریمه برای عدم رعایت می تواند تا شش درصد از درآمد سالانه یک شرکت باشد. مایکل مک گرات، رئیس دادگستری اتحادیه اروپا در بیانیه‌ای گفت: «قوانین حمایت از مصرف‌کننده ما به ما کمک می‌کند تا اطمینان حاصل شود که کسب‌وکارها بر اساس شایستگی‌های محصولات و خدمات خود رقابت می‌کنند، نه بر اساس توانایی آنها در استثمار مصرف‌کنندگان یا توانایی آنها برای فرار از قوانین». \"ما کار را سخت تر نمی کنیم، بلکه انجام ناعادلانه تجارت را سخت تر می کنیم.\" این قانون به دنبال حمایت از مصرف‌کنندگان به روش‌های مختلف است، مانند ممنوع کردن الگوهای تاریک، اجبار به قیمت‌گذاری شفاف و شفاف آنلاین برای رویدادهای فرهنگی و ورزشی و اجازه دادن به مصرف‌کنندگان برای خاموش کردن «ویژگی‌های طراحی اعتیادآور که هزینه‌های بیش از حد یا اجباری را تشویق می‌کند. همچنین اعمال ناعادلانه ای را که تشویق به خرج کردن بیش از حد توسط خردسالان می شود، محدود می کند، مانند پرداخت به برد در بازی ها (لوت باکس) و درخواست های مداوم. DFA همچنین به بازاریابی تأثیرگذار می", "image_url": "https://www.engadget.com/img/gallery/europe-wants-to-ban-addictive-design-loot-boxes-and-dark-patterns-in-apps/l-intro-1794406701.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲۰ آبان • ۱۷:۵۹"}, {"source": "Zoomit", "title": "شخصیت‌های انیمیشن «ماشین‌ها» به دنیای واقعی می‌آیند؛ ربات‌های دوست‌داشتنی برای نمایش جای پارک", "link": "https://www.zoomit.ir/robotics-smart-machines/470950-disney-tests-parking-robots/", "summary": "والت دیزنی با همکاری استارتاپ Field AI نمونه‌ی اولیه‌ی یک ربات چهارچرخ هوشمند را برای هدایت رانندگان در پارکینگ‌ها به‌نمایش گذاشت.", "date_str": "2026-11-11T14:40:00+00:00", "hash": "ad197fbe083e16e7", "title_fa": "شخصیت‌های انیمیشن «ماشین‌ها» به دنیای واقعی می‌آیند؛ ربات‌های دوست‌داشتنی برای نمایش جای پارک", "summary_fa": "والت دیزنی با همکاری استارتاپ Field AI نمونه‌ی اولیه‌ی یک ربات چهارچرخ هوشمند را برای هدایت رانندگان در پارکینگ‌ها به‌نمایش گذاشت. تبلیغات والت دیزنی با همکاری استارتاپ Field AI نمونه‌ی اولیه‌ی یک ربات هدایت‌کننده‌ی پارک خودرو را معرفی کرد. سازندگان، ظاهر این ربات چهارچرخ را با الهام از شخصیت‌های انیمیشن محبوب «ماشین‌ها» طراحی کرده‌اند تا رانندگان را به‌سمت فضاهای خالی پارکینگ راهنمایی کند. شرکت رباتیک Field AI که مهندسان سابق گوگل دیپ‌مایند، ناسا، انویدیا و تسلا در سال ۲۰۲۳ میلادی آن را پایه‌گذاری کردند، این دستیار پارکینگ را با همکاری بخش والت دیزنی ایمجینیرینگ توسعه داده است. هدف از ساخت نمونه‌ی مورد بحث، ارزیابی عملکرد سیستم‌های خودران و بررسی شیوه‌ی واکنش مراجعان به دستیاران ماشینی اعلام می‌شود. ربات مورد نظر روی یک نمایشگر بزرگ شبیه به شیشه‌ی جلوی خودرو، چشم‌های متحرک و پلک‌های انیمیشنی را نشان می‌دهد. تابلوی متحرکی روی سقف دستگاه تعبیه شده است که پیام‌های جهت‌دهنده را برای راهنمایی رانندگان تغییر می‌دهد. در کنار نمایشگر و تابلو، دو بازوی مجهز به چراغ‌های قرمز نیز شبیه به ماموران هدایت هواپیماها در باند فرودگاه، مسیر دقیق را علامت می‌دهند تا ارتباط چندلایه‌ای میان راننده و ربات شکل بگیرد. مقامات دیزنی‌لند تأکید کرده‌اند که زمان‌بندی مشخصی برای بهره‌برداری عملیاتی در پارکینگ‌ها وجود ندارد و تکنولوژی رونمایی‌شده صرفا نمونه‌ی مفهومی است. شرکت‌های سازنده‌ی خودروهای خودران نیز با چالش مشابهی در انتقال مفاهیم ماشینی به انسان‌ها در ترافیک شهری روبه‌رو هستند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/disney-cars-parking-robot-6af43eed1e22a6ae5bd3ec1c?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Nvidia"], "datetime_fa": "۲۰ آبان • ۱۸:۱۰"}, {"source": "Zoomit", "title": "استرالیا به جنگ هوش مصنوعی سرکش می‌رود", "link": "https://www.zoomit.ir/ai-articles/470857-australia-ai-safety-regulator-penalties/", "summary": "استرالیا نهاد ناظر جدیدی برای ایمنی هوش مصنوعی با اختیارات گسترده جهت اعمال جریمه‌های سنگین علیه شرکت‌های متخلف تأسیس می‌کند.", "date_str": "2026-11-11T14:00:00+00:00", "hash": "632de15735a4118d", "title_fa": "استرالیا به جنگ هوش مصنوعی سرکش می‌رود", "summary_fa": "استرالیا نهاد ناظر جدیدی برای ایمنی هوش مصنوعی با اختیارات گسترده جهت اعمال جریمه‌های سنگین علیه شرکت‌های متخلف تأسیس می‌کند. تبلیغات دولت استرالیا نهاد نظارتی جدیدی برای ایمنی هوش مصنوعی تاسیس می‌کند که اختیارات گسترده‌ای برای اعمال «جریمه‌های سنگین» بر شرکت‌های متخلف خواهد داشت. آنتونی آلبانیزی ، نخست‌وزیر استرالیا، در کانبرا اعلام کرد لوایح قانونی مرتبط با این فناوری در حال تدوین است و سازمان جدید بخشی از همین چارچوب قانونی خواهد بود. بر اساس مقررات پیش‌رو، شرکت‌ها موظف می‌شوند حوادث امنیتی را فورا گزارش دهند و امکان ارزیابی مستقل مدل‌های خود را فراهم کنند. دولت استرالیا در بیانیه‌ای رسمی تأکید کرد محافظت‌های امنیتی اجباری از طریق استانداردهای مصوب، بر تمامی فعالان حوزه‌ی هوش مصنوعی پیشرو اعمال می‌شود. مؤسسه‌ی ایمنی هوش مصنوعی استرالیا نیز با نهاد نظارتی تازه همکاری می‌کند تا همگام با تحولات جهانی، نظارت فنی دقیقی اعمال شود. نگرانی‌ها پیرامون ایمنی این فناوری زمانی اوج گرفت که مدلی متعلق به اوپن‌ای‌آی وب‌سایت یکی از بخش‌های دولتی استرالیا را هک کرد. هرچند داده‌های شخصی حساسی افشا نشد، اما وقوع حادثه هشداری جدی درباره‌ی خطرات بالقوه به شمار رفت. بررسی‌های رسمی پس از نفوذ سایبری منجر به پیشنهاد اصلاح قوانین کیفری شد تا تخلفات فاحش با مجازات‌های سنگین روبه‌رو شوند. همچنین جرمی تحت عنوان «ناتوانی در پیشگیری» تعریف می‌شود تا اگر شرکتی اقدامات لازم برای جلوگیری از آسیب‌رسانی مدل‌های خود انجام ندهد، پاسخگو باشد. دولت استرالیا تمام توصیه‌های این بازنگری را پذیرفته است. آنتونی آلبانیزی می‌گوید: «ما دیده‌ایم که در سایر نقاط جهان بدون وجود چارچوب‌های ایمنی یا استانداردها چه اتفاقی افتاده است. در غیاب این سازوکارها، مقبولیت اجتماعی از بین می‌رود و ایمنی و امنیت تضعیف می‌شوند.» توسعه‌ی شتابان فناوری چالش‌های زیرساختی نیز به همراه داشته و احداث دیتاسنترها با مخالفت‌های محلی روبه‌رو شده است. اعتراض‌های اخیر در حومه‌ی سیدنی و ملبورن به لغو و تعلیق چند پروژه‌ی بزرگ", "image_url": "https://api2.zoomit.ir/media/rogue-artificial-intelligence-robot-face-6af2bc861e22a6ae5bd3e784?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "ا "هوش مصنوعی مولد", "tags": ["Microsoft"], "datetime_fa": "۲۰ آبان • ۱۷:۲۹"}, {"source": "Business Insider", "title": "I tried the famous 'PieCaken,' a 6-pound cake stuffed with 3 different pies. It was a huge hit at Friendsgiving.", "link": "https://www.businessinsider.com/piecaken-review-famous-thanksgiving-cake-2026-11", "summary": "The PieCaken is a six-pound cake with four different desserts stuffed inside, including three pies. Courtesy of PieCaken The PieCaken features pecan pie, pumpkin pie, spice cake, and apple pie filling all in one dessert. I tried it for the first time and couldn't believe how delicious every layer tasted. The PieCaken also wowed everyone at my Friendsgiving. I couldn't believe my eyes when I first saw a photo of the PieCaken. Kelly Ripa once said that the six-pound cake — which has four desserts stuffed inside — was the \"greatest thing that happened to me, besides the birth of my children.\" There's a pecan pie on the bottom, followed by a pumpkin pie layer, and then spice cake on top. If that's not enough, there's apple pie filling in the center, and everything is held together by cinnamon buttercream. It sounded like the perfect wacky dessert to bring to Friendsgiving . The PieCaken was invented by the pastry chef Zac Young. Cindy Ord/Stringer/Getty Images Young first came up with the idea in 2015 while working as the executive pastry chef at David Burke Fabrick in New York City. The restaurant's executive chef was serving a Turducken special (a chicken stuffed into a duck stuffed into a turkey), and Young decided he wanted to make a sweet version. He was just planning to make a dessert to serve by the slice. But when Young posted a photo on Instagram, the PieCaken immediately took off. The Thanksgiving dessert can be purchased on Goldbelly for $110 and ships across the US. Also currently available are a red velvet PieCaken and a $160 DecaCaken featuring 10 layers, including chocolate cream pie, coffee cake, and New York cheesecake. l of books, and shoes for basically every occasion, including some I wore only once or twice a year. My apartment was full of stuff, too: records, plants, kitchenware, and everything in between. My husband loves collectibles, and I always enjoyed picking up little things to make our space feel more like us. However, when we planned our yearlong move to Japan , we knew we would have to downsize. We wouldn't have an apartment to come back to, so we got rid of almost everything. Facebook Marketplace was my best friend for a few months as I sold our furniture, electronics, and beyond. I sold and donated a ton of my clothing to create a capsule wardrobe, which I'd later pare down even more to just four shirts, two skirts, a pair of pants, shorts, a dress, one pair of shoes, and a rain jacket — all organized into packing cubes. Then, we packed a few sentimental things we wanted to keep into boxes and left them with family in Canada. I don't miss the stuff I gave away — and, in fact, I think I could've packed even less After moving, I ended up shipping even more of my stuff back home to Canada. Alessa Hickman Turns out, I was so excited to be in Japan that I didn't miss anything I left behind — even after I ran out of my usual hair products and had to find alternatives for my curls. It was also a relief to have less to carry around. I just felt lighter. As my months in Japan went on, I realized I could have packed even less. Did I really need a su", "date_str": "2026-11-11T14:27:01+00:00", "hash": "2cea32f819dd528d", "title_fa": "من تقریباً هر چیزی را که داشتم قبل از مهاجرت به خارج فروختم. اکنون، من با وسایلی کمتر از آنچه که بسته بودم به خانه برمی گردم.", "summary_fa": "من فقط با دو کیف به ارزش وسایل به ژاپن رفتم. آلسا هیکمن من تقریباً از شر همه چیزهایی که داشتم قبل از نقل مکان به ژاپن خلاص شدم و بیشتر آن را از دست نمی دهم. داشتن وسایل کمتر باعث شده است که به مقدار کمی نیاز داشته باشم و از آن زمان از شر چیزهای بیشتری خلاص شده ام. اکنون، در حال آماده شدن برای بازگشت به کانا  impact. Get better at: Highlighting your impact Today's move Proving your value requires more than listing tasks you completed. It means highlighting a moment where you did something that genuinely stood out, according to Tesla and SpaceX CEO Elon Musk. Musk has a high bar for hiring and has repeatedly said he looks for \"exceptional ability\" in candidates. One way he assesses that is by asking candidates for three bullet points that demonstrate their talent, he said on the \"Dwarkesh Podcast\" in February. The Tesla CEO explained that he wants to hear someone cite one to three accomplishments that would lead the listener to say \"wow.\" Why it works Musk said that in a 2014 Auto Bild interview that college degrees aren't always indicative of the best talent. For example, Bill Gates , Larry Ellison , or even Steve Jobs didn't graduate from college, he said. Musk went on to say that even if the bullet points of achievement are unrelated to the candidate's field, the goal is to find a record of extraordinary accomplishments. \"If there's a track record of exceptional achievement, then it's likely that that will continue into the future,\" Musk said. Try it today Spend a few minutes thinking about three accomplishments that you're proud of. For each one, write down what you contributed, the impact it had, and any relevant metrics that show how valuable your contribution was. Make sure you bring that list to your next job interview, promotion conversation, or performance review. The bottom line If you want to prove your impact, you should aim to highlight an achievement that elicits some kind of \"wow\" response, and that is more likely to come from a specific story, rather than a summary of everything you have done during a six-month period. Source This insight is drawn from Business Insider's reporting on the famous three-bullet-point requirement that Musk has used, and how it applies to his search for trade workers to build AI centers. Read the full story about it s week. It comes as NATO explores how new technologies could permit better operations in the Arctic. NATO is experimenting with amphibious robots that can cross water and ice in the Arctic, where the harsh environment could limit command and control. The Western military alliance launched a new initiative, Task Force X-Arctic, in June to explore how networked uncrewed and autonomous systems can provide NATO forces with more situational awareness across the High North. The new task force, led by NATO's Allied Command Transformation and Centre for Maritime Research and Experimentation, has carried out initial testing in an operational environment and is now exploring ways to deploy uncrewed vehicles in unconventional roles . João Alves, who leads CMRE's exercises and experimentation branch, told reporters at a roundtable discussion on Tuesday that NATO is exploring the use of uncrewed ground vehicles \"to expand the presence on the ice cap,\" where the alliance's footprint had previously been insufficient. \"We are talking about using unmanned amphibious vehicles that can go from ice to water and back from water to ice,\" Alves said, adding that the vehicles can be used to patrol areas and establish communication links with drones and underwater vessels. The amphibious vehicles were initially designed to have a driver, but CMRE modified them to be uncrewed. Having these kinds of platforms \"opens up a lot of possibilities,\" particularly for communications, Alves said. NATO is also working with other types of vehicles, including conventional uncrewed ground vehicles that can carry communications payloads and set up on hilltops for greater coverage — terrain features can disrupt signals — or launch drones as a mothership would. Uncrewed surface vessels operate off the coast of Norway during NATO s Arctic Sentry mission. US Navy Portuguese Capt. João Piedade, who leads the operational command-and-control branch for ACT's capability development directorate, told reporter text them directly to the frame), but you'll only need to charge it once every few months. Now for the downsides: Where most digital frames allow you to flick between photos with a swipe, the Aura Ink is much more sluggish switching from one photo to another takes about 45 seconds. While an LCD can match the colors in your photo exactly, e-ink uses a \"dithering algorithm\" to blend tiny pixels together to create the illusion of different hues (\"millions\" of them, according to Aura). In practice, this means up close, your pictures will look rather grainy, and the colors won't be nearly as bright as what you see on your phone screen. The 10-inch Aura Ink offers some significant upgrades Credit: Joel Cunningham All of that said, the Aura Ink is a great product, provided you know what you're buying, and the new 10-inch m", "date_str": "2026-11-11T14:30:00+00:00", "hash": "05dbdbba28a99bb4", "title_fa": "قاب عکس E-Ink دوم Aura بسیار بهبود یافته و بسیار ارزان تر است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. سال گذشته، Aura اولین قاب عکس دیجیتال خود را با استفاده از نمایشگر e-ink به جای صفحه نمایش LCD رایج در سایر دستگاه‌ها منتشر کرد که آنها را به بازیگر اصلی بازار تبدیل کرد (مشتریان Aura تاکنون بیش از یک میلیارد عکس را تنها در سال جاری آپلود کرده‌اند). وقتی سال گذشته جوهر 13 اینچی Aura اصلی را بررسی کردم، آن را با چند رزرو عمده توصیه کردم. امروز، Aura نسل دوم قاب جوهر 10 اینچی خود را معرفی کرد، و اگرچه نمی‌توانم دقیقاً بگویم که آنها همه مشکلات من را حل کرده‌اند، دستگاه جدید به طور قابل توجهی بهبود یافته و بسیار ارزان‌تر است. مزایای جوهر الکترونیکی (و معاوضه ها) اکثر قاب های عکس دیجیتال شما را به یاد یک آی پد با حاشیه تزئینی در اطراف آن می اندازند. آنها برای نمایش صدها عکس شما با رنگ‌های پر جنب و جوش عالی هستند، اما همه از ظاهر یا این واقعیت که این قاب‌ها همیشه نیاز به وصل شدن دارند، خوششان نمی‌آید. از سوی دیگر، یک قاب e-ink از نوعی صفحه نمایش کم مصرف استفاده می کند که در Kindle Colorsoft روشن تر، اما کاغذی تر، و بسیار نزدیک تر به ظاهر lso represents artists John Carter Cash and MŌRIAH. Related Signed: Chris Young Joins UTA Roster; Rock Icon Lita Ford Finds New Frontiers Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Agents Look Ahead as AI Keeps Advancing: We Have the Privilege of Being in a Human Industry Earlier this year, Young announced he had signed with United Talent Agency for booking, and in 2024, began working with a new label home, Black River Entertainment. He released his first Black River album, I Didn t Come Here To Leave , in 2025. The album s title track is at No. 26 on Billboard s Country Airplay chart. “I’m so excited to announce that Fletcher Foster will be guiding my career into the future. He is truly an industry stalwart and a true leader in every way shape and form, Young said in a statement. I couldn’t be happier for this new chapter alongside Fletcher, UTA and, of course, True Public Relations.” “I’ve followed Chris and his music since his first self-titled album in 2006, Foster said in a statement. He’s got one of the best pure country voices in this format Looking forward to this next chapter of Chris’ career building a great team to support him. Foster s career has included time at Sony Records Nashville, Arista Records Nashville, MCA, Capitol Records Nashville and Universal South Nashville. Along the way, Foster has worked with artists including Keith Urban , Garth Brooks , Alan Jackson , Toni Braxton and Whitney Houston . Foster has also served on the boards for ACM Lifting Lives, the Academy of Country Music, the Songwriters Hall of Fame and Belmont University s Curb School of Entertainment advisory board.", "date_str": "2026-11-11T16:53:19+00:00", "hash": "e6d03c1d1a037d4d", "title_fa": "قرارداد مدیریت علائم کریس یانگ با گروه سرگرمی F2 Fletcher Foster", "summary_fa": "کریس یانگ یک خانه مدیریتی جدید دارد. برنده 11 جدول بیلبورد کانتری ایرپلی با گروه سرگرمی F2 Fletcher Foster که همچنین نماینده هنرمندان جان کارتر کش و MŌRIAH است، قرارداد بسته است. امضای مرتبط: کریس یانگ به فهرست UTA می پیوندد. نماد راک لیتا فورد مرزهای جدیدی را پیدا می کند آب و هوای سخت، بندهای شعاع و یافتن نسل بعدی سرفصل های جشنواره: این یک مبارزه سال به سال برای زنده ماندن است. در سال 2024، شروع به کار با یک خانه برچسب جدید، Black River Entertainment کرد. او اولین آلبوم Black River خود را با نام I Didn t Come Here To Leave را در سال 2025 منتشر کرد. آهنگ عنوان آلبوم در رتبه 26 جدول کانتری پخش بیلبورد قرار دارد. یانگ در بیانیه ای گفت: \"من بسیار هیجان زده هستم که اعلام کنم فلچر فاستر حرفه من را در آینده هدایت خواهد کرد. او واقعاً یک صنعت استوار و یک رهبر واقعی از هر نظر است.\" من نمی‌توانم برای این فصل جدید در کنار فلچر، UTA و البته روابط عمومی واقعی خوشحال باشم.» فاستر در بیانیه ای گفت: «من کریس و موسیقی او را از اولین آلبوم خود در سال 2006 دنبال کرده ام. او یکی از بهترین صداهای کانتری خالص را در این قالب دارد. کار فاستر شامل مدت زمانی در سونی رکوردز نشویل، آریستا رکوردز نشویل، MCA، کاپیتول رکوردز نشویل و یونیورسال ساوت نشویل بوده است. در طول مسیر، فاستر با هنرمندانی از جمله کیت اوربان، گارث بروکس، آلن جکسون، تونی براکستون و ویتنی هیوستون کار کرده است. فاستر همچنین در هیئت مدیره ACM Lifting Lives، آکادمی موسیقی کانتری، تالار مشاهیر آهنگسازان و هیئت مشاوران مدرسه کرب دانشگاه بلمونت خدمت کرده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Chris-Young_Primary-Press-Photo-billboard.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "موسیقی"], "datetime_fa": "۲۰ آبان • ۲۰:۲۳"}, {"source": "Billboard", "title": "Rock Hall of Fame 2026 Induction Ceremony: Who Is and Isn’t Attending", "link": "https://www.billboard.com/music/music-news/rock-hall-of-fame-2026-induction-who-is-isnt-attending-1236379348/", "summary": "Saturday s (Nov. 14) 2026 Rock Roll Hall of Fame induction might set a new high-water mark for low attendance among A-list guests of honor. While the annual gathering celebrating the latest names to be etched on the wall at the Cleveland museum regularly features a few no-shows — due to lingering inter-band tensions, health and scheduling issues or, in some cases, contempt for the whole exercise — this year s event looks like it will have empty seats for more than half the living honorees. Related Hilary Duff Reflects On Her Massive Lucky Me Tour: I m Really Proud of Myself, and That s Hard to Feel As An Adult John Sykes on 2026 Rock Hall Inductions, Why Voters Embraced So Many Acts From the 1980s Their Curious Snub of Mariah Carey Sade Won t Be Attending the Rock Hall Induction Ceremony Though the Hall of Fame has not officially confirmed who will, or won t, be on hand, some acts have taken the initiative to confirm their absence in advance. It s no surprise that Oasis Noel and Liam Gallagher seem unlikely to make the flight for their induction after making the ballot three years in a row given their past statements about the Rock Hall. While spokespeople for the Britpop legends have not returned Billboard s request for comment on their plans, singer Liam Gallagher has made it pretty clear in recent X comments that he s staying put. It s too far to be going for the night I got s t to do it s Christmas, he wrote on Tuesday morning (Nov. 10) in response to a report that Oasis are not going to be in the house. In addition, guitarist/songwriter Noel Gallagher has booked his first solo gig since Oasis 2025 reunion tour with an appearance at Goldie’s EFG Jazz Festival in London, also on Saturday. Liam doubled-down on his no-show plans in a follow-up tweet on Tuesday in response to a fan who noted that not many artists show up to the affair, writing , If it was in the UK I d be there but for some reason it s in LA and that s miles. Also on Tuesday, Sade , said they will not make the trip. The elusive British act fronted by singer Sade Adu , confirmed the news in a post , writing, Sorry we can’t be there in person to celebrate with the other artists. Please know that our absence takes nothing away from how much this recognition means to us.” After landing in the Hall on their third try, Iron Maiden won t be on hand due to a scheduling conflict with their Australian tour. The British heavy metal giants kicked off their run of Run For Your Lives world tour shows in", "date_str": "2026-11-11T16:46:50+00:00", "hash": "8cfcc35c91604a72", "title_fa": "مراسم معارفه راک تالار مشاهیر 2026: چه کسی حاضر است و چه کسی در آن شرکت نمی کند", "summary_fa": "معرفی تالار مشاهیر راک رول 2026 شنبه (14 نوامبر) ممکن است امتیاز جدیدی را برای حضور کم در میان مهمانان افتخاری فهرست A ایجاد کند. در حالی که گردهمایی سالانه‌ای که آخرین نام‌هایی را که روی دیوار موزه کلیولند حک می‌شوند، به طور منظم شامل چند عدم نمایش می‌شود - به دلیل تنش‌های طولانی بین گروهی، مسائل بهداشتی و برنامه‌ریزی یا در برخی موارد، تحقیر کل تمرین - به نظر می‌رسد که رویداد امسال برای بیش از نیمی از برگزیدگان زنده صندلی‌های خالی خواهد داشت. هیلاری داف مربوط به تور عظیم خود Lucky Me فکر می‌کند: من واقعاً به خودم افتخار می‌کنم و به سختی می‌توانم به عنوان یک بزرگسال احساس کنم جان سایکس در سال 2026 مقدمه‌های راک هال. Fame رسماً تأیید نکرده است که چه کسی حاضر است یا برنده خواهد شد، برخی از اقدامات ابتکار عمل برای تأیید غیبت آنها را از قبل انجام داده اند. جای تعجب نیست که Oasis Noel و Liam Gallagher بعید به نظر می‌رسند که پس از سه سال متوالی رای دادن با توجه به اظهارات گذشته خود در مورد تالار راک، برای معرفی خود به پرواز درآیند. در حالی که سخنگویان اسطوره های بریت پاپ درخواست بیلبورد برای اظهار نظر در مورد برنامه هایشان را پس ندادند، لیام گالاگر خواننده در نظرات اخیر X به وضوح اعلام کرده است که در جای خود باقی می ماند. او صبح سه‌شنبه (10 نوامبر) در پاسخ به گزارشی مبنی بر اینکه Oasis قرار نیست در خانه باشد، نوشت: خیلی دور است برای شبی که باید آن را در کریسمس انجام دهم. علاوه بر این، نوئل گالاگر، گیتاریست/ترانه‌سرا، اولین کنسرت انفرادی خود را پس از تور اتحاد مجدد Oasis 2025 با حضور در جشنواره جاز Goldie's EFG در لندن، همچنین در روز شنبه، رزرو کرده است. لیام در یک توییت بعدی در روز سه‌شنبه در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/P1081AWB-e1789049687630.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۰ آبان • ۲۰:۱۶"}, {"source": "Billboard", "title": "Iceland Airwaves’ 2026 Edition Ditched Headliners in Major Shake-Up: ‘If You’re Not Evolving, You’ll Just Die and Wither’", "link": "https://www.billboard.com/pro/iceland-airwaves-2026-shygirl-the-streets-headliners/", "summary": "It s difficult not to be charmed, and in rather a hurry, by a city as thoroughly enamored with its musical heritage as Reykjavík. The first clue comes at 30,000 feet, with Icelandair s in-flight playlists devoted entirely to homegrown artists. Down on terra firma, The World Of Icelandic Music, a new audio-guided exhibition downtown, charts a century-spanning journey of the country’s sounds, traversing folky beginnings and the anarcho-punk scene of the 1980s, through to the international success of Björk , Sigur Rós and contemporary jazz-pop star Laufey . “Icelandic music can stand tall and proud on its own; it’s like a brand name in itself,” Ísleifur Þórhallsson , festival manager of Iceland Airwaves and founder and CEO of Sena Live, the nation s leading concert promoter, tells Billboard U.K. “There’s always so much good stuff to be found, the energy and variety of what you can find here is crazy. There’s always something new to discover every single year.” Perhaps it’s the near-subzero temperatures outside, or the occasional gust of wind sweeping through Reykjavík, but there’s a giddy energy about Þórhallsson when we chat in the lobby of the Parliament Hotel, which serves as a de facto meeting place for industry delegates. Dressed in an Iceland Airwaves-branded t-shirt and cap, he talks fast and fires off observations and anecdotes with gusto, as if there’s always another story waiting to be told. Related Icelandic Artists Dish on Where to Stay and Eat for Super-Chill (Literally) Iceland Airwaves Music Festival Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Agents Look Ahead as AI Keeps Advancing: We Have the Privilege of Being in a Human Industry The tastemaking festival and conference (Nov. 4-8) is back in town for its 27th edition, bringing together oodles of local talent and international names to offer a snapshot of a musical community whose ambition and reach continues to exceed the limitations of its size. (Iceland has a population of approximately 395,050.) Situated halfway between North America and Europe, it is also in a position to capitalize on the fast-growing market for music tourism, which Fortune Business Insights valued at $106.9 billion globally in 2025. Its national airline, Icelandair, founded Iceland Airwaves in 1999 and it remains the festival s founding sponsor, investing heavily in the event’s marketing to attract tourists outside of the summer season. ", "date_str": "2026-11-11T16:39:17+00:00", "hash": "3894ba383903c923", "title_fa": "Iceland Airwaves نسخه 2026 Headliners در Major Shake-Up: «اگر در حال تکامل نباشی، فقط می‌میری و پژمرده می‌شوی»", "summary_fa": "سخت است که شیفته ی شهری به اندازه ریکیاویک شیفته میراث موسیقایی خود، و در عوض با عجله نباشید. اولین سرنخ در ارتفاع 30000 فوتی به دست می‌آید، و لیست‌های پخش داخل پرواز Icelandair به طور کامل به هنرمندان بومی اختصاص داده شده است. در پایین‌تر، دنیای موسیقی ایسلندی، یک نمایشگاه جدید با هدایت صوتی در مرکز شهر، سفری صد ساله از صداهای این کشور را به تصویر می‌کشد، شروع‌های محلی و صحنه آنارکو پانک دهه 1980 را تا موفقیت بین‌المللی بیورک، سیگور روس و ستاره معاصر جاز پاپ لاوفی نشان می‌دهد. Ísleifur Þórhallsson، مدیر جشنواره ایسلند ایرویوز و بنیانگذار و مدیر عامل Sena Live، پیشرو کنسرت کشور، به بیلبورد بریتانیا می گوید: «موسیقی ایسلندی به تنهایی می تواند سربلند و سربلند باشد؛ به خودی خود مانند یک نام تجاری است.» همیشه هر سال چیز جدیدی برای کشف وجود دارد.\" شاید دمای نزدیک به زیر صفر در بیرون باشد، یا وزش باد گهگاهی که در ریکیاویک می‌پیچد، اما وقتی در ch better. The modified performance came after KATSEYE canceled three shows which had been scheduled to take place in Detroit, Chicago and Minneapolis citing illness on behalf of Megan. On Nov. 5, she revealed on her Instagram Story that she d suffered a concussion, writing that she was devastated and doing everything I possibly can to recover. Four days later, she gave an update on Weverse , explaining that the Austin show would go on as planned, but with reduced choreography, less intense movement and taking breaks as needed on her end. I won’t be going full out just yet! she added. My doctors have recommended these limitations for now, and I ll need to be reassessed before returning to unrestricted performances. The decision to go forward with the show with Megan sitting down was polarizing among EYEKONs, many of whom expressed concern that she d be in such a loud, overstimulating environment while dealing with a head injury. are they serious??? why is she not FULLY on recovery this actually scares me…, one fan commented on a video posted to X of Megan at the concert. Another person wrote on X, This is a terrible environment for someone with a concussion. This is inhumane. Katseye def doing an exposé documentary in like 10 years, another person posted on X . Having Megan perform like ", "date_str": "2026-11-11T16:35:36+00:00", "hash": "f474d7d7275feddf", "title_fa": "مگان از KATSEYE در حالی که نشسته است به دلیل ضربه مغزی اجرا می کند و باعث نگرانی طرفداران می شود: \"آنها جدی هستند؟\"", "summary_fa": "نمایش باید ادامه پیدا کند؟ در حالی که KATSEYE دو عضو خود را به دلیل وقفه های منون و سوفیا از دست داده است، گروه دختر اخیراً یک برنامه در آستین، تگزاس اجرا کردند، در حالی که مگان به معنای واقعی کلمه در حالی که از ضربه مغزی بهبود می یابد، خارج از رقص نشسته بود. مرتبط KATSEYE دو برنامه دیگر را به دلیل بیماری به تعویق انداخت پس از تاخیر در کنسرت دیترویت، مگان کاتسی در مجموعه عینک جدید Warby Parker در حال مشاهده صورتی است. 10)، اعضای Yoonchae، Lara و Daniela ست پر شدت و پر ک افراطی جنگ‌افزار و یک فیلم ترسناک و وحشتناک Collea. برایان شولتز، مدیرعامل Look Dine-In Cinemas، گفت: کلرادو برای سال‌ها، و ما حاضر نبودیم این داستان تمام شود. \"یک سینمای محلی جایی است که یک جامعه گرد هم می آیند تا بخندند، گریه کنند، الهام بگیرند و تجربیات خود را به اشتراک بگذارند. ما نمی توانیم منتظر باشیم تا پاسادنا را به سینما برگردانیم و از همه دعوت کنیم تا این سینمای Look را به مکان مورد علاقه خود تبدیل کنیم.\" مارک راس، SVP، رئیس اجاره‌دهی خرده‌فروشی در Perform Properties، می‌گوید One Colorado برای مدت طولانی مقصدی برتر در قلب پاسادنای قدیمی بوده است و سینما نیز بخشی از این تجربه بوده است. از رستوران‌ها و بوتیک‌فروشی‌های محبوب گرفته تا رویدادها و سرگرمی‌های محلی، هدف ما ایجاد مکان‌هایی با جذابیت مردم است – فضاهایی که مردم می‌خواهند در آن خرید کنند، جمع شوند و با هم ارتباط برقرار کنند. ما خوشحالیم که از LOOK استقبال می‌کنیم و تجربه پر جنب و جوش دیگری را برای جامعه پاسادنا برای لذت بردن", "image_url": "https://variety.com/wp-content/uploads/2026/11/Screenshot-2026-11-09-at-6.22.00-PM.jpg?crop=0px%2C16px%2C1181px%2C665px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما", "بورس و طلا"], "datetime_fa": "۲۰ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "Alief Boards ‘Borges and Me,’ Closes Major Market Theatrical Sales (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/alief-borges-and-me-marc-turtletaub-fionn-whitehead-1236945202/", "summary": "France and U.K.-based Alief has boarded as a sales agent “Borges and Me,” a big scene adaptation of U.S. writer Jay Parini novelized memoir of a life-changing encounter with Argentine literary great Jorge Luis Borges. Directed by Marc Turtletaub (“Jules”) and produced by his label Big Beach (“Miss Sunshine”), “Borges and Me” stars Fionn Whitehead [ ]", "date_str": "2026-11-11T16:56:02+00:00", "hash": "b9a49b125fc4c1ec", "title_fa": "Alief Boards «Borges and Me»، فروش عمده تئاتر را در بازار می بندد (انحصاری)", "summary_fa": "Alief که در فرانسه و بریتانیا مستقر است، به عنوان یک عامل فروش، \"بورخس و من\" را انتخاب کرد، یک صحنه بزرگ اقتباسی از نویسنده آمریکایی جی پارینی که خاطرات رمانی از رویارویی زندگی متحول کننده با خورخه لوئیس بورخس بزرگ ادبی آرژانتینی است. فیون وایتهد در «بورخس و من» به کارگردانی مارک ترتلتاب («ژول») و تهیه‌کنندگی برچسب او «بیگ‌بیچ» («خانم آفتاب»)، «بورخس و من» با شعر، رئالیسم جادویی و مالیخولیا آغشته به لذت‌بخشی است و گفته می‌شود که فیلمی است که به عنوان رئیس‌جمهور بریتانیایی برجسته است. واکر، پیکاپ را اعلام می کند. اولین نمایش جهانی جشنواره ادینبورگ همچنین اولین معاملات عمده تئاتری بازار را قبل از AFM با توزیع نمادها (بریتانیا) بسته است. و ایرلند)، Rialto Distribution (استرالیا و نیوزیلند)، اروپای آلمانی زبان با فیلم MFA و اسپانیا، توسط آلفا پیکچرز در بازارهایی که بیگانگان آنها را \"چند بازار عمده\" توصیف می کند، خریداری کرد. در اولین روز معامله در بازار فیلم آمریکا به ورایتی گفت که Alief اکنون در حال گفتگو با خریدارانی از اروپای مرکزی، MENA، مکزیک، کشورهای کونو سور از آرژانتین، شیلی و اروگوئه و آسیا است. نوشته اورن موورمن («پیام‌رسان») که برگرفته از اقتباس قبلی «بورخس و من» است و در سال 1971 به پارینی (وایتهد) می‌پردازد، در حالی که دانشجوی جوان آمریکایی در سنت اندروز یو اسکاتلند، ناامیدانه می‌خواهد صدای خود را به‌عنوان یک نویسنده بیابد، که توسط مربی اسکاتلندی، شاعری اسکاتلندی، علی شاعر ترنس و بورخس ترغیب می‌شود تا بورخس را ترغیب کند. سفر جاده ای یک هفته ای در ارتفاعات اسکاتلند برای ملاقات با شاعر جورج مکی براون (پیتر مولان).", "image_url": "https://variety.com/wp-content/uploads/2026/11/Borges-and-Me.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۲۰ آبان • ۲۰:۲۶"}, {"source": "Variety", "title": "From a ‘Hell House’ to ‘The Woods,’ Stephen Cognetti Proves His Versatility as a Scary Movie Maestro", "link": "https://variety.com/2026/film/focus/stephen-cognetti-hell-house-llc-director-body-in-the-woods-1236941916/", "summary": "Stephen Cognetti’s newest film is a hard pivot from the franchise that made him a household name in horror. Cognetti, who wrote and directed all five chapters in the found footage “Hell House LLC” franchise, just finished filming his latest feature, “A Body in the Woods.” It stars Emma Roberts as Alice Lincoln, a turn-of-the-century [ ]", "date_str": "2026-11-11T16:30:00+00:00", "hash": "14d41d325d386a13", "title_fa": "از «خانه جهنمی» تا «جنگل»، استیون کوگنتی تطبیق پذیری خود را به عنوان یک استاد فیلم ترسناک ثابت می کند.", "summary_fa": "جدیدترین فیلم استیون کوگنتی، محوری سخت از این فرنچایز است که او را در وحشت به یک نام آشنا تبدیل کرد. کوگنتی که نویسندگی و کارگردانی هر پنج فصل از مجموعه فیلم‌های یافت شده «Hell House LLC» را بر عهده داشت، به تازگی فیلمبرداری جدیدترین فیلم خود، «جسدی در جنگل» را به پایان رساند. اما رابرتز با بازی اما رابرتز در نقش آلیس لینکلن، جدیدترین فیلم استیون کوگنتی که در قرن نوزدهم است، محوری سخت از این فرنچایز است که او را در وحشت نام آشنا ساخت. مانیفست پیکچرز فروش بین المللی این فیلم را در AFM راه اندازی می کند. کوگنتی در مورد دیدگاه جدید تاریک خود، تأثیراتش و آینده Hell House LLC با Variety صحبت کرد. من این را درست بعد از چهارمین فیلم «خانه جهنمی» نوشتم. احساس می کردم در وضعیت روحی بسیار خوبی هستم، از نظر ترس. این سریع‌ترین پیش‌نویس فیلمنامه‌ای بود که تا به حال نوشتم. من این ایده را دریافت کردم، و آن فقط جریان یافت. او نه تنها یک بازیگر فوق‌العاده است، بلکه از نظر خلاقیت بسیار باهوش است. او همه این غرایز خوب را دارد. او فقط بهتر از هرکسی که تا به حال روی صفحه با او کار کرده ام، چیزهایی را دریافت می کند. هر بحثی با او در سطح دیگری است زیرا او همه چیز را فهمید. از کاری که ما پشت دوربین انجام می‌دادیم تا کاری که او روی صفحه نمایش انجام می‌داد، او فقط درک خوبی دارد. دو فیلم بود که واقعاً به من الهام بخش شد. اولین مورد اصلاً ترسناک نیست، اما «قتل جسی جیمز توسط رابرت فورد بزدل» است. وقتی این را می نوشتم، نه تنها همیشه به تصاویر بصری فکر می کردم. من هم تمام مدت به موسیقی متن گوش می دادم. \"ترور\" همیشه در ذهن من بود. همچنین، «جادوگر» ساخته رابرت اگرز فیلمی", "image_url": "https://variety.com/wp-content/uploads/2026/11/Stephen-Cognetti-Headshot-Oct-2026.jpg?crop=0px%2C48px%2C1448px% ورک‌ها را برعهده می‌گیرد و شروع به جمع‌آوری حلقه‌های حلقه‌ای می‌کند، معروف به مجریان ترسناک نازگول او. او چندین مرد را استخدام می کند تا برای افتخار یک حلقه زنی بجنگند، از جمله یک جنگجوی غافلگیرکننده: تئو (تایرو موهافیدین) که برنده می شود. داستان‌های مرتبط Invercine، Gema Films و Gaman Cine، تهیه‌کنندگان برتر صحنه فیلم-تلویزیون آمریکای لاتین، معرفی محصولات جدید به بازار مجموعه آزمایشگاه Sanfic Mórbido از کمدی هیولای بیگانه LGBTQ تا تمثیل ماپوچه، وحشت شدید و جنگ سرد، شهرها و شهرها را کنترل می‌کند. تلاش برای نگه داشتن و آزاد ماندن. اما فصل با یک یادداشت لطیف شروع می شود و به داستان عشق بین گالادریل (مرفید کلارک) و همسر گمشده اش سلبورن (جمی کمپبل بوئر) بازمی گردد. آنها در جوانی عاشق یکدیگر شده‌اند، اما از آن زمان جدا شده‌اند — فعلا. در حال حاضر، گالادریل و آروندیر (اسماعیل کروز کوردووا) با یک اورک به نام مارنوخ (آدام یانگ) ملاقات می‌کنند که از ارتش سائورون جدا می‌شود و قول می‌دهد که آنها را نزد یک آهنگر الف زندانی هدایت کند که می‌تواند برایشان حلقه بسازد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/LOTR_S3_UT_250616_ROTBEN_00003_R1_3000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۰ آبان • ۱۹:۴۵"}, {"source": "Billboard", "title": "Watch CoComelon’s Ms. Appleberry Sing Snuggly New Song ‘Happy Puppy’ From Interactive ‘Melon Patch’ Album", "link": "https://www.billboard.com/music/music-news/cocomelon-melon-patch-album-happy-puppy-video-ms-appleberry-1236378953/", "summary": "CoComelon has your preschooler s next favorite album on the way, and it s made for sing-along circle time. Music Me which includes 10 of Ms. Appleberry s interactive songs from the CoComelon live-action spin-off series The Melon Patch arrives Thursday on streaming, and Billboard Family is premiering the original single Happy Puppy below. Related CoComelon Puts a Peaceful Spin on Farmer in the Dell More Nursery Rhymes for New Lullabies Album CoComelon: The Movie Brings Baby JJ (And SZA) To the Big Screen: Watch the First Teaser Trailer CoComelon Is On a New Nursery Rhyme Journey With Melon Patch Series Album (And Yes, Wheels on the Bus Is Along for the Ride) In the clip, Ms. Appleberry (played by Allie Rivera Quiñonez, while pregnant with her third child) is surrounded by four parents wearing dog-ear headbands with their mini-mes all dressed in matching cozy puppy onesies. You are my puppy/ Make me so happy, Ms. Appleberry sings to the families. You are my puppy/ Happy puppy, happy/ I love you. The video also includes animated dogs that match the parent-toddler duos and footage of real puppies in a series of snuggly moments. Watch the Happy Puppy video below: The new episode of The Melon Patch that includes the Happy Puppy song also premieres on Thursday, on the show s YouTube channel . The Melon Patch premiered last year as a live-action expansion of the animated CoComelon world of baby JJ. The musical and interactive series intends to get kids moving, learning and growing with its sing-along songs, like the ones included on Music Me . Of course, CoComelon has a long history of music, including its classic “Wheels on the Bus” recording, which has had a consistent presence on Billboard ‘s Global charts thanks in part to its video’s heavy rotation on YouTube . The song has so far peaked at No. 88 on the Global 200 Excl. U.S. and has 9.7 billion views on YouTube since its 2018 debut. Also on the horizon: CoComelon: The Movie , hitting theaters on Feb. 19, with voice-acting work from R B superstar SZA and original music from pop hitmaker Justin Tranter.", "date_str": "2026-11-11T16:00:00+00:00", "hash": "7d14e99d7e1dcb39", "title_fa": "آهنگ جدید «Happy Puppy» از آلبوم تعاملی «Melon Patch» توسط CoComelon's Ms. Appleberry Siing Snuggly", "summary_fa": "CoComelon آلبوم مورد علاقه بعدی کودک پیش دبستانی شما را در راه است، و این آلبوم برای زمان دور هم آواز ساخته شده است. Music Me که شامل 10 آهنگ تعاملی خانم اپلبری از سری اسپین‌آف لایو اکشن کوکاملون The Melon Patch می‌شود، پنجشنبه در جریان پخش می‌شود و Billboard Family در زیر اولین تک آهنگ اصلی Happy Puppy را اجرا می‌کند. CoComelon مرتبط با مزرعه‌دار در دل چرخش صلح‌آمیز دارد. Along for the Ride) در کلیپ، خانم. Appleberry (با بازی Allie Rivera Quiñonez، در حالی که فرزند سوم خود را باردار است) توسط چهار پدر و مادر احاطه شده است که هدبندهای گوش سگی بسته اند و مینی مینی هایشان همگی لباس های مشابه توله سگ های دنج پوشیده اند. تو توله سگ من هستی/ خیلی خوشحالم کن، خانم اپل بری برای خانواده ها آواز می خواند. تو توله سگ من هستی/ توله سگ مبارک، شاد/ دوستت دارم. این ویدیو همچنین شامل سگ‌های متحرکی است که با زوج‌های والد-کودک مطابقت دارند و فیلم‌هایی از توله‌های واقعی در مجموعه‌ای از لحظات سخت. ویدیوی Happy Puppy را در زیر تماشا کنید: قسمت جدید The Melon Patch که شامل آهنگ Happy Puppy نیز می‌شود، در روز پنجشنبه در کانال YouTube برنامه پخش می‌شود. The Melon Patch سال گذشته به عنوان یک بسط لایو اکشن از انیمیشن دنیای کوکاملون بچه جی جی به نمایش درآمد. این مجموعه موزیکال و تعاملی قصد دارد بچه‌ها را به حرکت، یادگیری و رشد با آهنگ‌های خود مانند آهنگ‌هایی که در Music Me ارائه می‌کند، تشویق کند. البته، کوکاملون سابقه طولانی موسیقی دارد، از جمله ضبط کلاسیک «Wheels on the Bus»، که تا حدی به لطف چرخش شدید ویدیوی آن در یوتیوب، حضور ثابتی در نمودارهای جهانی بیلبورد داشته است. این آهنگ تاکنون در رتبه ۸۸ در Global 200 Excl قرار گرفته است. ایالات متحده است و از", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/melon-patch-2026-billboard-1800_65114a.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Fontaines D.C. Is in World-Beating Form on Dopamine Chamber Tour: 7 Best Moments From Amsterdam", "link": "https://www.billboard.com/lists/fontaines-dc-amsterdam-best-moments/", "summary": "For the past decade, the idea of a rock band once again capturing or defining the zeitgeist has been considered fanciful at best, or otherwise deluded. Genres rise and fall with popularity, but rock? The chances were slim, with culture geared towards solo pop acts, rapid rises for rappers and dance crossovers. Now, we have Fontaines D.C. to fly the flag. Since 2019, the Irish five-piece has worked diligently to become a contender: debut album Dogrel was a ramshackle arrival and 2020’s A Hero’s Death cut through despite the industry stasis of the pandemic . Skinty Fia (2022) proved that the band could further evolve and grow as songwriters, before 2024 s Romance brought Fontaines acclaim outside Europe and onto their big battleground: America. Romance featured a number of gigantic tunes – “Starburster” (195 million streams on Spotify); “Favourite” (131 million) – and landed the band its first Grammy nomination in the best rock album category. Fontaines lime-green aesthetic – slimier, sicklier than Charli’s shade of Brat – and fearless innovation marked the true arrival of a band who could attract cross generation fanbases and impress critically and commercially. Its follow-up, the recently-released Dopamine Chamber , is the group at the peak of its powers, embracing synth-pop, industrial sounds and classic songwriting for a critical and commercial smash. The album hit No. 1 in the UK Singles Chart and scored the year s third-biggest opening week , behind only Harry Styles and Olivia Rodrigo. On the Billboard 200 , they landed at No. 14, their highest-ever peak. Across Europe, the picture was similarly rosy, with No. 1s in the Netherlands, Portugal, Ireland and Belgium and top five finishes in Denmark, France, Poland, Sweden. Little surprise, then, that the band wanted to kick off the extensive live slate on the continent with a run of arena headline shows, which will hit the U.K. and Ireland in the coming weeks. Even bigger dates are set for 2027 including the London Stadium and a historic appearance at Slane Castle in Ireland. As Fontaines triumphant run begins in earnest, these were the seven best moments from the show at Amsterdam’s Ziggo Dome on Tuesday (Nov. 10).", "date_str": "2026-11-11T15:07: n 2027 as part of his ÆDEN tour. The electronic musician will perform at the famed landmark on March 19 and 26, and will be joined by dance music pioneer Jean-Michel Jarre. Anyma previously performed at the Pyramids with [ ]", "date_str": "2026-11-11T16:00:00+00:00", "hash": "8d458b11b4ba3e7d", "title_fa": "Anyma دو نمایش را در اهرام بزرگ جیزه مصر برای سال 2027 اعلام می کند", "summary_fa": "آنیما اعلام کرده است که در سال 2027 به عنوان بخشی از تور ÆDEN خود، دو نمایش را در اهرام بزرگ جیزه مصر اجرا خواهد کرد. این نوازنده الکترونیک در روزهای 19 و 26 مارس در این مکان مشهور اجرا خواهد کرد و ژان میشل ژار پیشگام موسیقی رقص به او خواهد پیوست. Anyma قبلاً در Pyramids با [ ] اجرا کرده بود: \"من به اندازه کافی خوش شانس بودم که در چند سال گذشته نمایش خود را به مکان های باورنکردنی در سرتاسر جهان برسانم، اما نمایش دو قسمتی در Pyramids of Giza یکی از خاطره انگیزترین ها بوده است، Anyma در بیانیه ای می گوید. \"من در حال کار بر روی یک محصول جدید، به ویژه در تولید بی نظیر 20 هستم. عظمت زیبایی و تاریخ منطقه من نمی توانم صبر کنم تا سال آینده ÆDEN را در مصر با شما به اشتراک بگذارم. ژار می افزاید: «از پذیرفتن دعوت آنیما برای پیوستن به نیروها خوشحالم. وقتی از هزاره جدید در اهرام بزرگ مصر استقبال کردم، جاه طلبی من این بود که از طریق موسیقی، نور و فناوری گفتگویی بین این محیط باستانی و آینده ایجاد کنم. بازگشت با آنیما، که همان روحیه کاوشگری را دارد و فصل جدیدی را با هم تصور می‌کند، هیجان‌انگیز است.\" Anyma امسال برای حمایت از ÆDEN که در آوریل گذشته به عنوان یکی از سرفصل‌های Coachella شروع به کار کرد، تور برگزار کرده است. او قصد دارد با مصر شناس و مدیر کل منطقه اهرام جیزه دکتر اشرف محی الدین همکاری کند تا یک نمایش سفارشی برای اهرام طراحی کند. الدین می‌گوید: \"ما مفتخر و هیجان‌زده هستیم که بار دیگر به Anyma در اهرام بزرگ خوش آمد می‌گوییم. آوردن صحنه‌های پیشرفته، نورپردازی و هنر دیجیتال او به اهرام محبوبمان، گفت‌وگوی جذابی بین تاریخ باستانی ما و آینده ایجاد می‌کند. رویداد 2025 مخاطبان", "image_url": "https://variety.com/wp-content/uploads/2026/11/18-e1794360374809.jpg?crop=0px%2C1936px%2C4876px%2 summary": "Amid reports of an ongoing feud, Usher and Chris Brown have canceled two more performances on their dual-headlining “R B Tour,” bringing the total number of canceled concerts to six. The canceled dates were all added to the tour’s original itinerary in August. The latest cancellations are the November 16 performance at Los Angeles’ SoFi Stadium [ ]", "date_str": "2026-11-11T15:09:40+00:00", "hash": "234b77c10ef67276", "title_fa": "آشر و کریس براون دو اجرای دیگر را با داغ شدن گزارش های Feud لغو کردند", "summary_fa": "در بحبوحه گزارش‌هایی مبنی بر درگیری‌های مداوم، آشر و کریس براون دو اجرای دیگر را در تور دو تیتراژ R B خود لغو کردند و تعداد کل کنسرت‌های لغو شده را به شش رساندند. تاریخ های لغو شده همگی به برنامه سفر اصلی تور در ماه اوت اضافه شدند. آخرین لغو، اجرای 16 نوامبر در استادیوم سوفای لس آنجلس است [ ] این لغو در میان گزارش های گسترده اما تایید نشده دعوای بین این دو سرگروه انجام شد و شایعاتی مبنی بر وقوع یک مشاجره با صدای بلند پشت صحنه در آتلانتا رخ داد. نمایندگان این دو هنرمند و Live Nation، مجری تور، بلافاصله به درخواست‌های Variety برای اظهار نظر پاسخ ندادند. لغو قبلی در بالتیمور، سینسیناتی، کارولینای جنوبی و ایندیاناپولیس بود. طبق بیانیه ای از استادیوم لوکاس اویل ایندیاناپولیس به نقل از تیکت نیوز، در آن زمان، برگزارکنندگان نیاز به اولویت دادن به سلامت و رفاه مهمانی و خدمه تور را ذکر کردند. این بیانیه ادامه داد: درخواست‌های یک تور با این طول و مقیاس قابل توجه است و این تنظیمات به تور اجازه می‌دهد تا با خیال راحت و پایدار در اجرای برنامه‌های باقی‌مانده ادامه یابد. معمولاً، نمایش‌های لغو شده نتیجه بیش از حد در نظر گرفته می‌شوند - که تقاضای بلیت قبلاً تا حد زیادی برآورده شده بود. با این حال، آنها پس از کنسرت جنجالی 5 نوامبر در استادیوم مرسدس بنز در آتلانتا آمدند، که با تاخیرهای طولانی، مشکلات کیفیت صدا و عدم اجرای این زوج، مانند تاریخ های قبلی تور، همراه بود. طبق گزارشی در TMZ، اختلاف بر سر زمان شروع کنسرت بود و براون استدلال کرد که نمایش را برای طرفدارانی که در ترافیک شدید محلی گرفتار شده بودند به تأخیر بیاندازد. نمایش سه ساعت به تعویق افتاد و خشم هواداران را برانگیخت.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Untitled_e8b05d.jpg?w=800&#038;h=536&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲۰ آبان • ۱۸:۳۹"}, {"source": "Billboard", "title": "Stove God Cooks & Swizz Beatz Talk Making ‘All This For Me?’: ‘Album of the Decade’", "link": "https://www.billboard.com/music/rb-hip-hop/stove-god-cooks-swizz-beatz-all-this-for-me-interview-1236378722/", "summary": "Stove God Cooks is finally ready to follow up his underground classic Reasonable Drought , which he dropped alongside Roc Marciano back in 2020. Since then, he s been on an impressive feature run (mainly on Grisleda records) and has had to deal with a plethora of leaks that have only sent demand for a sophomore album to a fever pitch, especially after his scene-stealing chorus on the Clipse s LET GOD SORT EM OUT standout F.I.C.O. Now, after a year of label drama and false starts — including one scrapped project in Goat Stamp , and a March 27 release date for the album we re here to talk about — his parent label Babygrande has a entered a joint partnership with Warner Records in an effort to finally give fans what they ve been waiting for in a new full-length album. Part of the reason for the delay has been because Stove wasn t really aware of how things worked on the sample-clearing side of the business — because he s used to working alongside prolific rappers like Griselda Records founder Westside Gunn, who craft albums and drop them in a span of a week. I didn t understand a lot of s—t, you know? So, things that was pissing me off, it was really the way I was seeing s—t, he explains to me over Zoom. My references wasn t the way s—t really go. I m seeing my people move this way. Why we taking so long to drop albums? I see West drop an album in three days. I know he got samples in his s—t. I m on the songs. So, it s that kind of s—t. But once you rip the sheet off and Gunn starts telling me about the lawsuits and s—t that he deals with, I m like, Oh, no, this s—t is for real.' Now, alongside legendary producer Swizz Beatz , he s finally beginning the rollout for his long-awaited sophomore album All This For Me? They first dropped the warm up single, Welcome to My Garden , earlier this year in February (which has been elevated, according to Stove and Swizz) and the duo recently released the project s second single and music video in Stovie s Home (Down Down) this past Friday (Nov. 6). And the Syracuse, N.Y. rapper is excited for his fans to finally hear what he s been working on and put the rollercoaster that was this past year behind him. The s—t is a super blessing, man, he says. That s the reality of this moment for me right now. All the other s—t, the old s—t, none of s—t matter to me right now. Check out my conversation with Stove God Cooks Swizz Beatz below as we talk their creative process, their chemistry and what fans can expect once they finally g", "date_str": "2026-11-11T15:00:00+00:00", "hash": "99f140d41ff9122c", "title_fa": "Stove God Cooks & Swizz Beatz Talk Making \"All This For Me?\": \"Album of the Decade\"", "summary_fa": "Stove God Cooks بالاخره آماده است تا فیلم کلاسیک زیرزمینی خود یعنی Reasonable Dought را که در سال 2020 در کنار راک مارسیانو عرضه کرد، دنبال کند. از آن زمان، او در یک مجموعه موسیقی چشمگیر (عمدتاً در رکوردهای Grisleda) بوده است و مجبور شده است با انبوهی از درزها دست و پنجه نرم کند که تقاضا برای یک آلبوم جدید را به خصوص پس از یک صحنه جدید در سال دوم او ارسال کرده است. Clipse s LET GOD SORT EM OUT OUT F.I.C.O. اکنون، پس از یک سال سریال درام و شروع اشتباه - از جمله یک پروژه منسوخ شده در Goat Stamp و تاریخ انتشار 27 مارس برای آلبومی که ما اینجا هستیم تا در مورد آن صحبت کنیم - لیبل مادر او Babygrande با Warner Records وارد همکاری مشترک شده است تا در نهایت به طرفداران آنچه که در یک آلبوم کامل جدید منتظرش بودند ارائه دهد. بخشی از دلیل تأخیر به این دلیل بوده است که استو واقعاً از نحوه کار در بخش پاکسازی نمونه کار آگاه نبود - زیرا او عادت داشت در کنار رپرهای پرکار مانند وست ساید گان، بنیانگذار Griselda Records کار کند، که آلبوم‌ها را می‌سازند و در یک بازه زمانی یک هفته منتشر می‌کنند. من خیلی از s-t را متوجه نشدم، می دانید؟ بنابراین، چیزهایی که من را عصبانی می‌کردند، واقعاً همان چیزی بود که من s-t را می‌دیدم، او در زوم برای من توضیح می‌دهد. ارجاعات من واقعاً راهی نبود. من می بینم که مردم من به این سمت حرکت می کنند. چرا ما اینقدر طول می کشیم تا آلبوم ها را منتشر کنیم؟ من می بینم که وست یک آلبوم را در سه روز منتشر می کند. من می دانم که او نمونه هایی را در s-t خود دریافت کرد. من روی آهنگ ها هستم بنابراین، این همان", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/stove-god-cooks-swizz-beatz-press-photo-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Diplo and Former Downtown Music CEO Andrew Bergman Launch Indie Publisher Bison Music", "link": "https://www.billboard.com/pro/diplo-andrew-bergman-bison-music/", "summary": "Diplo and Andrew Bergman , the former CEO of Downtown Music, are launching Bison Music, an independent music publisher focused on signing and developing songwriters early in their careers. Bergman will serve as the company s CEO, working alongside COO Tom Lee , CCO Juba Lee and general manager Jenny Ilibassi . The company s roster of songwriters includes Picard Bros., Leclair, Maesic, Nitti, Kaien Cruz, BomboCat, Akira Evans and Groupthink, a group whose credits span songs for artists including BTS, Dua Lipa, Bad Bunny and JENNIE. Related UMG s $775M Downtown Deal Secures EU Approval With Remedies Attached Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Agents Look Ahead as AI Keeps Advancing: We Have the Privilege of Being in a Human Industry Bison is positioning itself in contrast to a current publishing landscape that s has been dominated by catalog acquisition. Rather than buying existing intellectual property, the company says its focused on long-term artist development and making fresh, original music written by real people to connect with a global audience. “For me, there’s still nothing more exciting in music than discovering a great song from someone you’ve never heard of,” Bergman says in a press release. “That’s always been at the core of what makes music publishing a great business. And it’s what excited me about partnering with Diplo, one of the leading creative forces in the modern music business, and tmwrk, his management team and longtime business partners. We’re designed to identify and sign writers early, nurture them through the harsh realities of the music business and allow them to reap the benefits of their creative endeavors. Writers and the music publishers that serve them are at their best when they are in a collaborative mode, and we intend to operate that way internally and externally.” Diplo, who initially formed Bison before bringing Bergman on as a partner, framed the launch as a response to a moment of creative stagnation in the industry. “At a moment when it feels like music needs an injection of originality, our writers are in a position to shape where music goes next,” he says. “Andrew and I are creating a home for those writers, with a team that knows how to develop them and a company built to back them for the long term.” Bison is based in New York and Los Angeles. Additional signings will be announced in the coming months.", "date_str": "2026-11-11T15:00:00+00:00", "hash": "d4115e0138602ac2", "title_fa": "Diplo و مدیر عامل سابق Downtown Music اندرو برگمن ناشر Indie Bison Music را راه اندازی کردند.", "summary_fa": "دیپلو و اندرو برگمن، مدیر عامل سابق Downtown Music، در حال راه اندازی Bison Music، یک ناشر موسیقی مستقل هستند که بر روی امضای قرارداد و توسعه ترانه سرایان در ابتدای کار خود متمرکز است. برگمن به عنوان مدیر عامل شرکت، در کنار تام لی، مدیر ارشد اجرایی جوبا لی و مدیر کل جنی ایلیباسی کار خواهد کرد. فهرست ترانه سرایان این شرکت شامل Picard Bros، Leclair، Maesic، Nitti، Kaien Cruz، BomboCat، Akira Evans و Groupthink است، گروهی که آهنگ های آن برای هنرمندانی از جمله BTS، Dua Lipa، Bad Bunny و JENNIE است. معامله 775 میلیون دلاری مربوط به مرکز شهر UMG تاییدیه اتحادیه اروپا را با راه‌حل‌های ضمیمه آب و هوای سخت، بندهای شعاع و یافتن نسل بعدی سرفصل‌های جشنواره تضمین می‌کند: این یک مبارزه سال به سال برای زنده ماندن است. موقعیت خود را در مقابل چشم انداز فعلی انتشاراتی قرار می دهد که تحت سلطه اکتساب کاتالوگ است. این شرکت می‌گوید به‌جای خرید مالکیت معنوی موجود، بر توسعه بلندمدت هنرمندان و ساخت موسیقی تازه و اصیل نوشته شده توسط افراد واقعی برای ارتباط با مخاطبان جهانی تمرکز کرده است. برگمن در بیانیه‌ای مطبوعاتی می‌گوید: «برای من، هنوز هیچ چیز در موسیقی هیجان‌انگیزتر از کشف یک آهنگ عالی از کسی نیست که هرگز نامش را نشنیده‌اید». \"این همیشه هسته اصلی چیزی است که انتشار موسیقی را به یک تجارت عالی تبدیل می کند. و این همان چیزی است که من را از شراکت با Diplo، یکی از نیروهای خلاق پیشرو در تجارت موسیقی مدرن، و tmwrk، تیم مدیریت و شرکای تجاری قدیمی او هیجان زده کرد. ما طراحی شده ایم تا نویسندگان را زودتر شناسایی و امضا کنیم، آنها را از طریق واقعیت های خشن تجارت موسیقی پرورش دهیم و به آنها اجازه دهیم از مزایای تلاش های خلاقانه خود بهره ببرند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/BBB_Bison-2-Credit_-Anthony-Mongiello-1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "The Billion-Dollar Deal Between Primary Wave & Kobalt | Billboard On The Record", "link": "https://www.billboard.com/video/billion-dollar-deal-primary-wave-kobalt-on-the-record/", "summary": "The business of music is changing, and the stakes have never been higher. Following Primary Wave’s $1 billion acquisition of Kobalt, Primary Wave CEO/founder Larry Mestel and Kobalt CEO Laurent Hubert join Billboard On The Record host Kristin Robinson in an exclusive interview to break down the deal and what it means for the future of music publishing. They discuss how their new business arrangement will work, how many millions they’ve each spent on music catalogs this year and why it seems acquisitions and mergers have become the music industry norm in 2026. Love what you hear? Don’t forget to rate, review and subscribe so you never miss an episode of Billboard On The Record . Follow Billboard On The Record on Instagram , TikTok , Apple Podcasts , Spotify and YouTube @billbo a rd so you never miss an episode. Billboard On The Record is a podcast in partnership with SickBird Productions. Kristin Robinson: We re here to talk about the fact that Primary Wave has acquired Kobalt, and you re the CEO of Primary Wave, you re the CEO of Kobalt. Larry Mestel: We re one of the largest music companies in the world now, probably the largest owner of legendary music. It s Prince and Bob Marley and Stevie Nicks and Whitney Houston and James Brown. We provide a very unique service, which is, hey, you want a bio film, we can produce it. You want a documentary, we can produce it. You want a Broadway show, we can produce it. You want an immersive experience, we re creating eight right now. I think one of the most unique and interesting things that you guys have done is the Whitney Houston slot machines. Larry Mestel: Yeah. We re making more money for the estate of Whitney Houston than the entire estate was generating six and a half years ago when we bought into the estate. 150,000 songs being uploaded every day, how does that change the nature of what you guys do? Laurent Hubert: This is a topic that we talk about almost every day, and it s a challenge. The music industry in recent years has started to see a lot of these kind of acquisitions and mergers of major companies, and I m wondering why you think these acquisitions and this consolidation is happening now. Larry Mestel: Well, I think you re gonna see a lot more. Today we have an exclusive first press interv
