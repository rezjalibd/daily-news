samsung-delays-one-ui-9-android-17-rollout/", "summary": "سامسونگ انتشار به‌روزرسانی پایدار One UI 9 مبتنی‌بر اندروید ۱۷ را برای خانواده‌ی گلکسی S26 به تعویق انداخت.", "date_str": "2026-09-22T15:08:25+00:00", "hash": "15a724fe2f2862d0", "title_fa": "آپدیت One UI 9 گوشی‌های سامسونگ تأخیر خورد", "summary_fa": "سامسونگ انتشار به‌روزرسانی پایدار One UI 9 مبتنی‌بر اندروید ۱۷ را برای خانواده‌ی گلکسی S26 به تعویق انداخت. تبلیغات سامسونگ ظاهرا انتشار سراسری به‌روزرسانی One UI 9 مبتنی‌بر اندروید ۱۷ را دست‌کم در برخی مناطق عقب انداخته تا روند انتشار با احتیاط بیشتری پیش برود . بر اساس یافته‌های وب‌سایت SammyGuru، پرچمدار کنونی سامسونگ یعنی گلکسی S26 قرار بود نخستین دریافت‌کننده‌ی رابط کاربری جدید باشد اما بررسی‌ها نشان می‌دهد تاکنون هیچ کاربری موفق به دریافت بیلد نهایی نشده است. نشانه‌های تعویق ابتدا در اطلاعیه‌ی رسمی وبگاه خبری سامسونگ در تایلند مشاهده شد. متن اطلاعیه ابتدا تاریخ ۲۱ سپتامبر (۳۰ شهریور) را برای انتشار مشخص کرده بود، سپس موعد انتشار به ۲۸ سپتامبر (۶ مهر) موکول شد و در نهایت تاریخ دقیق به‌طور کامل از متن حذف شد تا صرفا عبارت کلی «سپتامبر ۲۰۲۶» (شهریور و مهر ۱۴۰۵) باقی بماند. چنین تغییراتی در تقویم نرم‌افزاری سامسونگ بی‌سابقه به شمار نمی‌رود و در گذشته نیز نسخه‌های مختلف در سکوت خبری به تعویق افتاده بودند. با وجود این‌که آغاز مسیر One UI 9 با چالش روبه‌رو شده، انتظار می‌رود موانع فنی در کوتاه‌ترین زمان برطرف شوند. آیا نشانه‌ای از دریافت به‌روزرسانی جدید روی گوشی خود مشاهده کرده‌اید؟ نظرات خود را با ما در میان بگذارید. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری مبین احمدی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "نرم‌افزار قدرتمند پریمیر به اندروید آمد؛ رایگان و مجهز به قالب‌های آماده یوتیوب", "link": "https://www.zoomit.ir/software-news/467696-adobe-premiere-android-free-launch/", "summary": "نرم‌افزار قدرتمند ادوبی پریمیر پس از ماه‌ها انتظار برای سیستم‌عامل اندروید منتشر شد؛ بدون تبلیغات، واترمارک یا نیاز به خرید اشتراک.", "date_str": "2026-09-22T15:02:32+00:00", "hash": "e87c4d2fb831dfd7", "title_fa": "نرم‌افزار قدرتمند پریمیر به اندروید آمد؛ رایگان و مجهز به قالب‌های آماده یوتیوب", "summary_fa": "نرم‌افزار قدرتمند ادوبی پریمیر پس از ماه‌ها انتظار برای سیستم‌عامل اندروید منتشر شد؛ بدون تبلیغات، واترمارک یا نیاز به خرید اشتراک. تبلیغات کاربران سیستم‌عامل اندروید سال‌ها در انتظار یک ابزار تدوین ویدیویی تمام‌عیار از سوی ادوبی بودند و ماه‌ها پس از انتشار نسخه‌ی بازطراحی‌شده‌ی ادوبی پریمیر برای گوشی‌های آیفون حالا نوبت به اکوسیستم گوگل رسیده است تا میزبان یکی از توانمندترین برنامه‌های ویرایش ویدیو روی گوشی‌های هوشمند باشد. ادوبی نسخه‌ی جدید پریمیر را با امکانات کم‌نظیری مثل تایم‌لاین چندلایه، بهینه‌سازی اختصاصی برای گوشی‌های تاشو و قالب‌های آماده برای تولیدکنندگان محتوای ویدیویی منتشر کرده است. نرم‌افزار جدید با رویکردی کاملا متفاوت نسبت به نسخه‌های قدیمی موبایلی توسعه یافته و تجربه‌ای نزدیک به نسخه‌ی دسکتاپ Premiere Pro را روی نمایشگرهای کوچک بازآفرینی می‌کند. لایک توسعه‌دهندگان در این ویرایشگر موبایلی مجموعه‌ای از ابزارهای هوشمند و حرفه‌ای را گرد هم آورده‌اند که روند تدوین ویدیو را برای تولیدکنندگان محتوا و ولاگرها به‌شدت تسریع می‌کند. بهینه‌سازی برای گوشی‌های تاشو یکی از جذاب‌ترین بخش‌های این نرم‌افزار محسوب می‌شود؛ به‌طوری که رابط کاربری به‌طور خودکار با تغییر زاویه‌ی نمایشگر و فرم‌فکتور دستگاه هماهنگ خواهد شد. شگفت‌انگیزترین بخش انتشار پریمیر برای اندروید، ساختار پرداخت و دسترسی آن است. کاربران برای استفاده از تمام قابلیت‌های اصلی نرم‌افزار نیازی به تهیه‌ی اشتراک پولی Creative Cloud ندارند. ویدیوهای خروجی هیچ‌گونه واترمارکی دریافت نمی‌کنند و محیط کاربری نیز کاملا عاری از تبلیغات آزاردهنده طراحی شده است. خریدهای درون‌برنامه‌ای صرفا محدود به دریافت فضای ذخیره‌سازی ابری بیشتر و کردیت‌های هوش مصنوعی مولد خواهد بود که کاملا اختیاری هستند. اجرای روان پریمیر روی دستگاه‌های اندرویدی نیازمند سخت‌افزار نسبتا متعادلی است. دستگاه مورد نظر باید حداقل به ۵ گیگابایت رم و سیستم‌عامل اندروید ۱۳ یا نسخه‌های جدیدتر مجهز باشد."}, {"source": "Zoomit", "title": "بیتس ۳۶۰ رونمایی شد؛ هدفون کوبنده اپل با قابلیت شخصی‌سازی بالشتک‌ها", "link": "https://www.zoomit.ir/headset/467695-beats-360-over-ear-headphones-announced/", "summary": "اپل با معرفی هدفون دورگوشی بیتس ۳۶۰، معماری آکوستیک بازطراحی‌شده، بالشتک‌های ماژولار و ساختار سخت‌افزاری دوگانه را به نمایش گذاشت.", "date_str": "2026-09-22T14:54:21+00:00", "hash": "99c3f9be346f454c", "title_fa": "بیتس ۳۶۰ رونمایی شد؛ هدفون کوبنده اپل با قابلیت شخصی‌سازی بالشتک‌ها", "summary_fa": "اپل با معرفی هدفون دورگوشی بیتس ۳۶۰، معماری آکوستیک بازطراحی‌شده، بالشتک‌های ماژولار و ساختار سخت‌افزاری دوگانه را به نمایش گذاشت. تبلیغات بیتس، یکی از سرشناس‌ترین زیرمجموعه‌های اپل، پس از ماه‌ها انتشار تیزرها و افشای اطلاعات غیررسمی، سرانجام پرچمدار جدید خود را با نام بیتس ۳۶۰ رونمایی کرد . بر اساس آنچه بیتس می‌گوید، قیمت هدفون ۳۴۹٫۹۹ دلار است. طراحی جدید بیتس ۳۶۰ گواهی بر دگرگونی رویکرد این برند در تولید هدفون‌های دورگوشی (Over-Ear) به شمار می‌رود. این محصول، به گفته‌ی بیتس، تمرکز ویژه‌ای بر کیفیت صدا، راحتی و شخصی‌سازی دارد. بیتس ۳۶۰ جایگزین هدفون نام‌آشنای بیتس استودیو پرو نخواهد شد و آن محصول با کاهش قیمت به ۲۹۹٫۹۹ دلار همچنان در سبد محصولات باقی می‌ماند. در مقایسه با نسل‌های پیشین، هدفون جدید یک معماری آکوستیک کاملا تازه دارد که تا ۱٫۷۵ برابر حذف نویز فعال (ANC) قدرتمندتر و ۱۲ دسی‌بل افزایش حجم صدای خروجی را در کنار حفظ شفافیت در تمام فرکانس‌ها به ارمغان می‌آورد. سیستم حذف نویز فعال هدفون با تکیه بر هشت میکروفون، محیط صوتی درون و بیرون کاپ‌ها را تحلیل می‌کند. حالت شفافیت (Transparency) امکان شنیدن صدای محیط را بدون برداشتن هدفون فراهم می‌آورد و در صورت خاموش بودن هر دو حالت، فناوری اکولایزر تطبیقی (Adaptive EQ) به شکل پویا عملکرد صوتی را تنظیم خواهد کرد. پشتیبانی از صدای سه‌بعدی شخصی‌سازی‌شده همراه با ردیابی پویای حرکات سر، امکان بهره‌گیری کامل از بستر دالبی اتموس (Dolby Atmos) را با حس غوطه‌وری ۳۶۰ درجه برای کاربران مهیا می‌سازد. اولیور شوسر ، معاون ارشد بخش موسیقی، ورزش و بیتس در اپل، درباره‌ی فلسفه‌ی تولید هدفون جدید می‌گوید: «بیتس نه‌تنها در اوج‌گیری هدفون‌های دورگوشی نقش داشت، بلکه به تعریف این دسته از محصولات کمک کرد. بیتس ۳۶۰ فصل بعدی این داستان است؛ تلفیقی از پیشرفته‌ترین عملکرد آکوستیک ما با طراحی متعادلی که هماهنگ با کاربر حرکت می‌کند.»"}, {"source": "Zoomit", "title": "شوالیه تاریکی؛ مدل ۱٬۰۰۱ اسب‌بخاری لامبورگینی رونمایی شد", "link": "https://www.zoomit.ir/car/467675-lamborghini-revuelto-voltoro-v1-revealed/", "summary": "تیونر اسپانیایی با رونمایی از بسته‌ی ارتقای ویژه، ظاهر لامبورگینی روئلتو را کاملا تهاجمی‌تر کرد.", "date_str": "2026-09-22T14:40:00+00:00", "hash": "22d6d6c7a5dd1fc2", "title_fa": "شوالیه تاریکی؛ مدل ۱٬۰۰۱ اسب‌بخاری لامبورگینی رونمایی شد", "summary_fa": "تیونر اسپانیایی با رونمایی از بسته‌ی ارتقای ویژه، ظاهر لامبورگینی روئلتو را کاملا تهاجمی‌تر کرد. تبلیغات تیونر اسپانیایی ونوم بلک از پروژه‌ی جدید خود بر پایه سوپر اسپرت هیبریدی لامبورگینی روئلتو پرده برداشت . نام این نسخه‌ی اختصاصی Voltoro V1 است و چهره‌ی خودرو را با قطعات فیبر کربنی و تم تاریک دگرگون می‌کند. تغییرات ظاهری شامل کیت بدنه عریض، اسپلیتر بزرگ جلو، کاپوت بازطراحی‌شده با خروجی‌های هوای بیشتر و یک بالچه ثابت در بخش عقب می‌شود. رینگ‌های طلایی توربینی در تضاد با رنگ تمام مشکی بدنه، جلوه‌ای متفاوت به نمای جانبی بخشیده‌اند. ونوم بلک بخش فنی خودرو را بدون تغییر نگه داشته است. پیشرانه هیبریدی شامل موتور ۶٫۵ لیتری دوازده سیلندر تنفس طبیعی به همراه سه موتور الکتریکی، خروجی کلی ۱۰۰۱ اسب بخار تولید می‌کند. جعبه‌دنده هشت سرعته دوکلاچه نیروی تولیدی را به چرخ‌ها منتقل می‌سازد. فضای داخلی خودرو نیز با تریم تاریک و هماهنگ با نمای بیرونی شخصی‌سازی شده است. قیمت نهایی پکیج تیونینگ Voltoro V1 هنوز اعلام نشده، اما اعمال چنین تغییراتی روی خودرویی با قیمت پایه بیش از ۶۰۰ هزار دلار، هزینه‌ی قابل توجهی برای مالکان خواهد داشت. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "مایکروسافت در اقدامی تاریخی، مجموعه Halo را به ناشر بازی‌های Call of Duty واگذار کرد", "link": "https://www.zoomit.ir/gaming/467693-activision-takes-over-halo-xbox-restructuring-layoffs/", "summary": "مایکروسافت در تحولی ساختاری، توسعه‌ی نسخه‌ی بعدی بازی Halo را به اکتیویژن سپرد و ۲۶۸ کارمند ایکس‌باکس را اخراج کرد.", "date_str": "2026-09-22T14:39:06+00:00", "hash": "665397d702b2abcd", "title_fa": "مایکروسافت در اقدامی تاریخی، مجموعه Halo را به ناشر بازی‌های Call of Duty واگذار کرد", "summary_fa": "مایکروسافت در تحولی ساختاری، توسعه‌ی نسخه‌ی بعدی بازی Halo را به اکتیویژن سپرد و ۲۶۸ کارمند ایکس‌باکس را اخراج کرد. تبلیغات مایکروسافت در اقدامی تاریخی و غافلگیرکننده، ساختار مدیریتی بخش بازی‌سازی خود را دستخوش تغییری بنیادین کرد تا سکان هدایت بزرگ‌ترین مجموعه‌هایش را به بازوی تازه‌نفس خود واگذار کند. مهم‌ترین محور این تصمیم‌گیری، انتقال توسعه‌ی نسخه‌ی بعدی مجموعه‌ی Halo به اکتیویژن است؛ تصمیمی که مرزهای میان استودیوهای زیرمجموعه را بازتعریف می‌کند. دامنه‌ی تغییرات، فراتر از مجموعه‌ی Halo رفته و بازی‌هایی مانند Sea of Thieves و Age of Empires نیز تحت مدیریت اکتیویژن قرار گرفته‌اند. بخشی از این بازنگری با تعدیل ۲۶۸ فرصت شغلی در ایکس باکس همراه شده و حتی استودیوی نام‌آشنای Ninja Theory را در آستانه‌ی تعطیلی کامل قرار داده است. شرکت Halo Studios که پیش‌تر با نام 343Industries شناخته می‌شد، تحت‌تاثیر این تحولات قرار گرفته است. این استودیو همچنان به پشتیبانی از بازی‌های فعلی نظیر Halo Infinite و Halo: Campaign Evolved ادامه خواهد داد، اما وظیفه‌ی ساخت نسخه‌ی بعدی این جهان حماسی به‌طور کامل به تیمی مستقل در اکتیویژن سپرده شده است. مت بوتی ، مدیر ارشد محتوای ایکس‌باکس، در یادداشتی داخلی خطاب به کارکنان نوشت: «اکتیویژن نسخه‌ی بعدی Halo را با هدایت تیمی تازه و تخصصی توسعه خواهد داد که کاملا مستقل از فرآیند توسعه و برنامه‌های Call of Duty فعالیت می‌کند. گروهی کوچک در Halo Studios نیز به پشتیبانی از جامعه‌ی مخاطبان و بازی‌های فعال در بازار ادامه می‌دهد.» رئیس اکتیویژن درباره‌ی چشم‌انداز آینده بیان کرد: «هدف ما برای Halo مشخص است؛ ساخت برترین بازی تاریخ این مجموعه که شایسته‌ی عظمت و میراث آن باشد و هم‌زمان به ریشه‌های اصیلی که بازیکنان را شیفته‌ی خود کرد، وفادار بماند. این جاه‌طلبی بزرگی محسوب می‌شود که مجموعه‌ی مذکور لیاقتش را دارد و گردهم‌آوری تیمی متشکل از استعدادهای کم‌نظیر برای ارائه‌ی فصل بعدی آغاز شده است.»"}, {"source": "Zoomit", "title": "فرصت ویژه برای سرمایه‌گذاری؛ کارمزد خرید طلا و نقره در «وال‌گلد» صفر شد", "link": "https://www.zoomit.ir/iran-news/467692-wallgold-zero-/", "summary": "پلتفرم وال‌گلد در طرحی ویژه، کارمزد خرید طلا و نقره را برای مدت‌زمانی محدود به صفر رساند.", "date_str": "2026-09-22T14:32:16+00:00", "hash": "af74582fdde7941b", "title_fa": "فرصت ویژه برای سرمایه‌گذاری؛ کارمزد خرید طلا و نقره در «وال‌گلد» صفر شد", "summary_fa": "پلتفرم وال‌گلد در طرحی ویژه، کارمزد خرید طلا و نقره را برای مدت‌زمانی محدود به صفر رساند. تبلیغات با رسیدن به روزهای پایانی و ابتدایی هر ماه و واریز حقوق‌ها، بسیاری از افراد به دنبال راه‌های هوشمندانه برای مدیریت «نقدینگی مازاد» و حفظ ارزش دارایی‌های خود هستند. بررسی بازار نشان می‌دهد در ۱۰ ماه گذشته قیمت طلا به‌طور میانگین ماهانه ۱۱.۸ درصد رشد داشته است. همین امر باعث شده که پس‌انداز و سرمایه‌گذاری در فلزات گران‌بها به یکی از جذاب‌ترین گزینه‌ها برای سرمایه‌گذاران تبدیل شود. در همین راستا، پلتفرم «وال‌گلد» طرح ویژه‌ای را برای کاربران و فعالان بازار فراهم کرده است. در این طرح، کارمزد خرید طلا و نقره در وال‌گلد تا ساعت ۲۴ روز دوم مهرماه به صفر رسیده است. با اجرای این کمپین، هزینه کارمزد از فرآیند خرید حذف شده و تمام مبلغ پرداختی کاربر، مستقیما به خرید اصل طلا یا نقره اختصاص می‌یابد. این ویژگی به‌ویژه برای افرادی که قصد دارند بخشی از حقوق و درآمد این ماه خود را به دارایی‌های امن و سودآور تبدیل کنند، یک مزیت رقابتی و اقتصادی مهم محسوب می‌شود. نکته حائز اهمیت دیگر درباره وال‌گلد، توسعه زیرساخت‌های اعتباری آن است. این پلتفرم در یک همکاری رسمی با بانک کارآفرین، سرویس‌های اعتباری ویژه‌ای به کاربرانش اهدا می‌کند. این همکاری در کنار صفر شدن کارمزد خرید، وال‌گلد را به گزینه‌ای امن و قابل‌اعتماد برای سرمایه‌گذاران خرد و کلان تبدیل کرده است. اگر قصد دارید بخشی از درآمد این ماه خود را به طلا یا نقره تبدیل کنید، تنها تا پایان روز پنج‌شنبه، ۲ مهرماه فرصت دارید تا از این پنجره سرمایه‌گذاری بدون کارمزد استفاده کنید. برای بهره‌مندی از این طرح و ثبت سفارش، می‌توانید همین حالا به وال‌گلد مراجعه کرده و خرید خود را نهایی کنید. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری فاطمه محمدی دنبال کردن به محتوای این مطلب چه امتیازی"}, {"source": "Business Insider", "title": "I thought, 'What's more valuable than the family dog?' That question became a company with nearly $100M in sales.", "link": "https://www.businessinsider.com/ken-ehrman-gps-halo-collar-dog-business-idea-2026-9", "summary": "Ken Ehrman created the Halo collar. Courtesy of Ken Ehrman Ken Ehrman created a GPS dog fence after his niece's dog was killed. He uses the product daily with his own dog, Reese's. He holds more than 40 patents, but says this one has been the most impactful. This as-told-to essay is based on a conversation with Ken Ehrman , co-founder and CEO of Halo Collar . It has been edited for length and clarity . Back in 2017, my niece's dog, Ruby, escaped from their yard and was hit by a car. My niece was only 11, and this was her first experience with death. She had just rescued Ruby the year before, and the dog had become a huge part of the family. We were all hysterical. I used the same sort of invisible dog fence that had failed Ruby, and I worried about my own dog, Reese's. One day, a lightbulb went off for me. My brother and I had already built a company that used GPS tracking to monitor high-value assets for companies: items like forklifts for Walmart, and rental cars for Avis. I knew the capabilities of GPS, and I thought, what more high-value asset is there than the family dog ? The idea had been right there in front of me, but I didn't see it until tragedy struck. My patent attorney asked me to invest right away I immediately called my patent attorney . He did some research and shared that I was likely to get a patent on the device. He also told me he wanted to invest. That stopped me in my tracks. My brother and I hold more than 40 patents. We'd worked with this attorney a lot, but he'd never asked about investing in one of our products. When I pointed that out to him, he explained he also used an invisible fence for his dog. He could immediately see the benefit of replacing that with a GPS collar. He thought my idea was an incredible product with a huge opportunity. I built a team with my brother and Cesar Millan My second call was to my brother, Michael. I knew I wanted him on the team. I'm a pretty smart guy, but I pale in comparison to Michael. Our skills are like peanut butter and chocolate: when you put those together, it's a great combination. I had moved on from the previous company I founded, but Michael was still working there. He was hesitant to leave the security of a salary. So, I turned my attention to the other person I knew I needed to get on board: Cesar Millan . I knew from my previous experience that I needed a subject matter expert, and Cesar is the best dog trainer in the world. But he's a very hard man to get hold of. It seemed next ", "date_str": "2026-09-23T13:43:01+00:00", "hash": "e0c8aee29dea3d16", "title_fa": "فکر کردم، \"چه چیزی ارزشمندتر از سگ خانواده؟\" این سوال به شرکتی با فروش نزدیک به 100 میلیون دلار تبدیل شد.", "summary_fa": "کن ارمن یقه Halo را ساخت. با حسن نیت از Ken Ehrman Ken Ehrman پس از کشته شدن سگ خواهرزاده خود یک حصار سگ GPS ایجاد کرد. او روزانه از این محصول با سگ خود، Reese's استفاده می کند. او بیش از 40 حق ثبت اختراع دارد، اما می گوید که این یکی تاثیرگذارترین بوده است. این مقاله گفته شده بر اساس گفتگو با کن ارمن، یکی از بنیانگذاران و مدیرعامل Halo Collar است. برای طول و وضوح ویرایش شده است. در سال 2017، سگ خواهرزاده من، روبی، از حیاط خانه آنها فرار کرد و با یک ماشین برخورد کرد. خواهرزاده من فقط 11 سال داشت و این اولین تجربه او با مرگ بود. او به تازگی روبی را سال قبل نجات داده بود و سگ بخش بزرگی از خانواده شده بود. همه ما هیستریک بودیم. من از همان حصار سگ نامرئی استفاده کردم که روبی شکست خورده بود، و نگران سگ خودم، ریس بودم. یک روز برای من یک لامپ خاموش شد. من و برادرم قبلاً شرکتی ساخته بودیم که از ردیابی GPS برای نظارت بر دارایی های با ارزش شرکت ها استفاده می کرد: مواردی مانند لیفتراک برای والمارت و اتومبیل های اجاره ای برای Avis. من قابلیت‌های GPS را می‌دانستم و فکر می‌کردم، چه دارایی با ارزش‌تری از سگ خانواده وجود دارد؟ این ایده درست در مقابل من بود، اما من آن را تا زمانی که فاجعه رخ داد ندیدم. وکیل ثبت اختراع من از من خواست که فوراً سرمایه گذاری کنم من بلافاصله با وکیل ثبت اختراع خود تماس گرفتم. او تحقیقاتی انجام داد و به اشتراک گذاشت که من به احتمال زیاد حق ثبت اختراع دستگاه را دریافت خواهم کرد. او همچنین به من گفت که می خواهد سرمایه گذاری کند. که من را در مسیر من متوقف کرد. من و برادرم بیش از 40"}, {"source": "Business Insider", "title": "McDonald's is spending $8.5 billion on restaurant refreshes and bringing diners back", "link": "https://www.businessinsider.com/mcdonalds-revamps-with-8-5b-investment-in-tech-and-training-2026-9", "summary": "McDonald s unveiled McDonald s Next, a plan to improve its results, on Wednesday. Gene J. Puskar/AP McDonald's is planning to spend billions to lure customers back. The chain's McDonald's Next plan calls for changes from employee training to store tech. McDonald's is facing stiff competition from rivals and increasingly value-sensitive customers. McDonald's is spending big to bring customers back to its restaurants. The fast-food chain plans to devote $8.5 billion over the next 10 years to improvements to its restaurants, it said on Wednesday. The plan, called McDonald's Next, includes adding more technology to stores, new training for employees, and increasing the burger chain 's market share of chicken menu items and beverages. The goal is \"to be the first choice for more customers, more often - while making our restaurants stronger and easier to run,\" McDonald's CEO Chris Kempczinski said . \"We are confident that executing across the key components of NEXT will unlock stronger restaurant economics, generate attractive returns for the Company, our franchisees and shareholders, and increase capacity to keep investing in growth,\" Kempczinski said. The plan comes as McDonald's faces challenges both within the company and from rivals. The burger chain reported slowing comparable sales growth for its most recent quarter, pointing to trouble it faced rolling out a new value menu featuring items that cost $3 or less. The company didn't offer any details on prices or fixing its value menu. It also didn't provide an answer to customers who used to head to the Golden Arches for a cheap, quick meal and are now going to other restaurants, from Burger King to Chili's . Executives from McDonald's will discuss the plan at an event on Wednesday morning. McDonald's Next will make restaurants more efficient with AI and other operational improvements, the company said. Those types of changes will improve cash flow per restaurant by about $100,000 annually, it said. McDonald's plan also includes an effort \"to elevate the customer experience through great food and great hospitality,\" which the company calls Make It Golden. In addition to maintaining its share of the burger market, the plan also calls for McDonald's to increase its share of the beverage and chicken market by 1.5 percentage points each by 2030. Do you have a story idea about McDonald's? Contact this reporter at abitter@businessinsider.com or via encrypted messaging app Signal at 808-854-4501. Use a personal em", "date_str": "2026-09-23T13:37:20+00:00", "hash": "1e784943b8fb7d31", "title_fa": "مک دونالد 8.5 میلیارد دلار برای تازه کردن رستوران ها و بازگرداندن غذاخوری ها هزینه می کند", "summary_fa": "مک دونالد روز چهارشنبه از McDonalds Next، طرحی برای بهبود نتایج خود، رونمایی کرد. Gene J. Puskar/AP McDonald's قصد دارد میلیاردها دلار برای جذب مشتریان خرج کند. طرح بعدی مک‌دونالد زنجیره‌ای خواستار تغییراتی از آموزش کارکنان به فناوری فروشگاه است. مک دونالد با رقابت سختی از سوی رقبا و مشتریان حساس به ارزش روبه رو است. مک دونالد برای بازگرداندن مشتریان به رستوران هایش هزینه های زیادی می کند. روز چهارشنبه اعلام کرد که این فست فود زنجیره ای قصد دارد در 10 سال آینده 8.5 میلیارد دلار به بهبود رستوران های خود اختصاص دهد. این طرح که McDonald's Next نام دارد شامل افزودن فناوری بیشتر به فروشگاه‌ها، آموزش جدید برای کارمندان و افزایش سهم بازار زنجیره‌ای برگر از اقلام و نوشیدنی‌های منوی مرغ است. کریس کمپچینسکی، مدیرعامل مک‌دونالد، گفت: هدف این است که \"اولین انتخاب برای مشتریان بیشتر، اغلب اوقات - در حالی که رستوران‌هایمان را قوی‌تر و آسان‌تر می‌کنیم.\" کمپچینسکی گفت: «ما مطمئن هستیم که اجرای اجزای کلیدی NEXT اقتصاد رستوران قوی‌تری را باز می‌کند، بازده جذابی را برای شرکت، صاحبان امتیاز و سهامداران ما ایجاد می‌کند و ظرفیت سرمایه‌گذاری در رشد را افزایش می‌دهد. این طرح در حالی انجام می شود که مک دونالد با چالش هایی در داخل شرکت و رقبای خود مواجه است. زنجیره همبرگر کاهش رشد فروش قابل مقایسه در سه ماهه اخیر خود را گزارش داد و به مشکلاتی اشاره کرد که با عرضه منوی ارزش جدید حاوی اقلامی با قیمت 3 دلار یا کمتر مواجه شد. این شرکت هیچ جزئیاتی در مورد قیمت ها یا اصلاح منوی ارزش خود ارائه نکرد. همچنین پاسخی به مشتریانی که قبلاً برای یک غذای ارزان و سریع به طاق طلایی می‌رفتند و اکنون به رستوران‌های دیگر، از برگر کینگ گرفته تا چیلی، می‌روند، نداد. مدیران مک دونالد در رویدادی در صبح چهارشنبه در مورد این طرح"}, {"source": "Business Insider", "title": "I spent 2 nights at an all-inclusive resort. My biggest regret was going alone.", "link": "https://www.businessinsider.com/traveling-solo-all-inclusive-resort-regrets-2026-9", "summary": "Business Insider s reporter traveled solo to Mohonk Mountain House, an all-inclusive resort in New York. Joey Hadden/Business Insider I didn't think twice about booking a solo stay at an all-inclusive resort, but I should have. Even though I travel alone most of the time, my stay would have been more fun with a companion. From the dining room to archery class, I was vacationing among families and groups. When my arrow went straight into the woods while trying archery for the first time, it should have been hilarious. If I'd had family or friends around, they would have teased me for ages and probably come up with some funny nickname, like Joey \"The Arm\" Hadden. But as a lone wolf surrounded by groups of vacationers, it was just awkward. This was in July, when I spent two nights at the all-inclusive Mohonk Mountain House in New Paltz, New York. With a starting rate of $1,400 a night for double occupancy (though Business Insider received a media rate), my booking included meals and access to most of the hotel's activities. The author at Mohonk Mountain House. Joey Hadden/Business Insider Overall, I had a blast at Mohonk Mountain House. The dramatic natural landscape, historic architecture, and abundance of activities blew me away. Still, I'd never been to an all-inclusive resort alone before, even though I'm an avid solo traveler , and I left wishing I'd brought someone to share the experience with. I was surrounded by families Mohonk Mountain House has been ranked among the top all-inclusive resorts for families in the US, and it was easy for me to see why. The property was filled with activities geared toward them, including sports, outdoor movies, and more. Sporting facilities at Mohonk Mountain House. Joey Hadden/Business Insider From meals in the dining room to activities like hiking and archery, I appeared to be the only person vacationing at Mohonk Mountain House alone. This felt isolating, but it's not always the case. A representative of Mohonk Mountain House told Business Insider that the resort often hosts solo travelers, adding that I may not have seen any because summer is the most popular time for families. The property offers activities that can be enjoyed alone or used as a way to connect with others. For solo travelers looking to socialize, the resort recommends joining group sporting matches, fitness classes, and walking tours. Those seeking solitude can take garden strolls, meditate by the lake, and enjoy spa treatments. The author takes a", "date_str": "2026-09-23T13:32:01+00:00", "hash": "92d4f86584116688", "title_fa": "من 2 شب را در یک استراحتگاه جامع گذراندم. بزرگترین حسرت من تنها رفتن بود.", "summary_fa": "خبرنگار بیزینس اینسایدر به تنهایی به خانه کوهانک موهونک، یک استراحتگاه جامع در نیویورک سفر کرد. Joey Hadden/Business Insider من دوبار به رزرو اقامت انفرادی در یک استراحتگاه جامع فکر نکردم، اما باید می‌کردم. حتی اگر بیشتر اوقات به تنهایی سفر می کنم، اقامت من با یک همراه لذت بخش تر بود. از اتاق غذاخوری گرفته تا کلاس تیراندازی با کمان، در میان خانواده ها و گروهی تعطیلات را می گذراندم. وقتی تیر من برای اولین بار در حالی که تیراندازی با کمان را امتحان می کردم مستقیماً به داخل جنگل رفت، باید خنده دار می بود. اگر خانواده یا دوستانی در اطرافم داشتم، آن‌ها مدت‌ها مرا مسخره می‌کردند و احتمالاً نام مستعار خنده‌داری مانند جوی «بازو» هادن به ذهنم می‌رسید. اما به عنوان یک گرگ تنها که توسط گروه هایی از تعطیلات احاطه شده بود، بسیار ناخوشایند بود. این در ژوئیه بود، زمانی که من دو شب را در خانه همه جانبه کوهانک موهونک در نیوپالتز، نیویورک گذراندم. با نرخ شروع 1400 دلار در شب برای دو نفر (اگرچه Business Insider نرخ رسانه ای دریافت کرد)، رزرو من شامل وعده های غذایی و دسترسی به بیشتر فعالیت های هتل بود. نویسنده در خانه کوه موهونک. جوی هدن/ بیزینس اینسایدر در مجموع، من در موهونک مونتین هاوس خیلی خوشحال شدم. چشم انداز طبیعی چشمگیر، معماری تاریخی، و فعالیت های فراوان، مرا غافلگیر کرد. با این حال، من هرگز به تنهایی به یک استراحتگاه جامع نرفته بودم، حتی اگر یک مسافر انفرادی مشتاق هستم، و با آرزوی اینکه کسی را بیاورم تا تجربه را با او به اشتراک بگذارم، آنجا را ترک کردم. من توسط خانواده‌هایی احاطه شده‌ام Mohonk Mountain House در میان برترین استراحتگاه‌های فراگیر برای خانواده‌ها در ایالات متحده رتبه‌بندی شده است، و فهمیدن دلیل آن برای من آسان بود. این ملک مملو از فعالیت‌هایی بود که برای آنها"}, {"source": "Business Insider", "title": "More and more middle-income Americans are struggling to make rent", "link": "https://www.businessinsider.com/more-middle-income-renters-struggling-rent-feeling-bad-stacking-jobs-2026-9", "summary": "Middle-income renters are struggling. Alex Potemkin/Getty Images Middle-income renters are struggling to pay rent on time, if at all. A fifth of Americans reported having trouble paying rent in 2025, a new Urban Institute report finds. Rent troubles rose the most for middle-income Americans, from around 14.3% in 2024 to 21.6% in 2025. When the rent was due in 2025, a fifth of Americans weren't able to pay on time. According to a new report from the Urban Institute, 20% of surveyed Americans aged 18 to 64 said that, at some point in 2025, they couldn't pay their full rent on time. That's the highest share of rent troubles recorded since the Urban Institute's Well-Being and Basic Needs Survey began asking this question in 2019, and a marked increase from 2024. Lurking under that bleak rent outlook is another signal of a flailing middle class : In the year leading up to December 2025, middle-income renters, who earn between 200% to 400% of the federal poverty line, were much more likely to say they were struggling to pay rent. The lowest-income renters surveyed, earning below 200% of the federal poverty line, or $53,300 for a family of three, remain the most likely to have trouble paying their rents. Yet the middle-income share reporting rent payment problems rose from around 14.3% in 2024 to 21.6% in 2025, the biggest jump among all income brackets. Recent research shows middle-income workers increasingly identify as working class , as they struggle to pay bills and stack multiple jobs in hopes of stability. A separate analysis from the Richmond Federal Reserve found that middle-income Americans are now more likely to hold multiple jobs than their lower-earning counterparts, and college-educated Americans now make up half of the multiple jobholder workforce. And middle-income Americans' consumer sentiment has switched from tracking with their higher-income peers to mirroring lower-income earners, suggesting that they're feeling similar economic pressures. When middle-income workers are locked into financial situations generally associated with lower earners, like renting instead of owning their home, it can put downward pressure on the poorest Americans. \"We used to have a lot of moderate and middle-income households entering into home ownership and not competing for the same rental units,\" said Kathryn Reynolds, one of the Urban Institute report's authors. While lower-income households still struggle the most, a layer of struggling middle-income households ", "date_str": "2026-09-23T13:31:01+00:00", "hash": "01ac28244441ce9b", "title_fa": "بیشتر و بیشتر آمریکایی‌های با درآمد متوسط ​​در تلاش برای اجاره خانه هستند", "summary_fa": "اجاره نشینان با درآمد متوسط ​​با مشکل مواجه هستند. الکس پوتمکین/ گتی ایماژ اجاره کنندگان با درآمد متوسط ​​در پرداخت به موقع اجاره بها مشکل دارند. گزارش جدید موسسه Urban نشان می دهد که یک پنجم آمریکایی ها در سال 2025 در پرداخت اجاره بها مشکل داشتند. مشکلات اجاره بها برای آمریکایی‌های با درآمد متوسط ​​بیشترین افزایش را داشته است، از حدود 14.3 درصد در سال 2024 به 21.6 درصد در سال 2025. زمانی که سررسید اجاره در سال 2025 بود، یک پنجم آمریکایی‌ها قادر به پرداخت به موقع نبودند. بر اساس گزارش جدیدی از موسسه Urban، 20 درصد از آمریکایی‌های 18 تا 64 ساله مورد بررسی گفتند که در مقطعی در سال 2025، نمی‌توانند اجاره کامل خود را به موقع بپردازند. این بالاترین سهم از مشکلات اجاره‌بها است که از زمانی که بررسی رفاه و نیازهای اساسی مؤسسه شهری شروع به پرسیدن این سؤال در سال 2019 کرد، و نسبت به سال 2024 افزایش قابل توجهی داشته است. در کمین این چشم انداز تیره اجاره، نشانه دیگری از ضعیف شدن طبقه متوسط ​​است: در سال منتهی به دسامبر 2025، مستأجران با درآمد متوسط ​​که بین 200 تا 400 درصد خط فقر فدرال درآمد دارند، به احتمال زیاد می گویند که برای پرداخت اجاره بها مشکل دارند. کمترین درآمد مستاجر مورد بررسی، که کمتر از 200 درصد خط فقر فدرال یا 53300 دلار برای یک خانواده سه نفره درآمد دارند، بیشترین احتمال را دارند که در پرداخت اجاره بهای خود دچار مشکل شوند. با این حال، مشکلات پرداخت اجاره بها گزارش‌دهنده سهم درآمد متوسط ​​از حدود 14.3 درصد در سال 2024 به 21.6 درصد در سال 2025 رسیده است که بزرگترین جهش در میان تمام گروه‌های درآمدی است. تحقیقات اخیر نشان می دهد که کارگران با درآمد متوسط ​​به طور فزاینده ای به عنوان طبقه کارگر شناخته می شوند، زیرا"}, {"source": "Business Insider", "title": "I'm heading back to Canada after living in Japan for a year. I'm excited to return, but there are a few things I'll miss.", "link": "https://www.businessinsider.com/leaving-japan-after-year-things-miss-convenience-affordability-2026-9", "summary": "I moved to Japan nearly a year ago, and now, I m getting ready to head home. Alessa Hickman I'm a Canadian who lived in Japan for a year — and now, I'm getting ready to head home. I'll miss Japan's transportation system and how affordable it is to have a quality dinner out here. However, I'm excited to reunite with my friends and explore my home country like a tourist. When I moved to Japan in 2025, I knew I wouldn't be here forever — but having a full year ahead of me felt like an infinite amount of time. Now I'm getting ready to head back to my hometown in Canada , and I can't believe how quickly my year passed. Since moving here, I've been lucky enough to live in Tokyo, Osaka, and Kumamoto, visit more than a dozen cities and towns, and become a version of myself I really love. I'm excited to go home and see the people I've missed, but saying goodbye to the life I've built here feels a lot harder than I expected. I m going to miss how affordable my life has felt here. I ve found quality food to be more affordable here than it is in Canada. Alessa Hickman One of the biggest things I've noticed during my time in Japan is how much less financial stress I've felt on a day-to-day basis. Before moving here, my husband and I paid almost 2,000 Canadian dollars a month for our apartment in Ottawa. In Japan, I've been living in Airbnbs and generally spending roughly 20% to 30% less on rent alone. High-quality food has also been noticeably cheaper in Japan's major cities than in my home in Ottawa. Sure, some fruit, like apples and strawberries, can be pricey, but I've found basics like meat, eggs, milk, and bread to generally be more affordable. Then, there's eating out. A nicer date-night meal that would cost us anywhere from CA$60 to CA$100 back home might be around CA$30 or CA$40 here. Since tipping isn't really part of Japanese culture, my meals are even cheaper. I'm definitely looking forward to getting back into a bigger kitchen, but I've eaten very, very well in Japan, and I'll miss how easy and affordable it is to do so. Japan has seriously spoiled me with convenience. In Japan, I ve found it easy to locate conveniences like printers. Alessa Hickman I've been surprised by how much you can actually do at a convenience store in Japan . At a 7-Eleven, you can find bathrooms and ATMs, order hot meals and smoothies, and even pay your bills. In Ottawa, I was much more used to gas-station convenience stores where I could only go in to pay for gas, buy a lottery ti", "date_str": "2026-09-23T13:30:01+00:00", "hash": "b7b38ceb2dbdbdbb", "title_fa": "من بعد از یک سال زندگی در ژاپن به کانادا برمی گردم. من برای بازگشت هیجان زده هستم، اما چند چیز وجود دارد که از دست خواهم داد.", "summary_fa": "من تقریبا یک سال پیش به ژاپن نقل مکان کردم، و اکنون، آماده رفتن به خانه هستم. السا هیکمن من یک کانادایی هستم که یک سال در ژاپن زندگی کردم - و اکنون، آماده رفتن به خانه هستم. دلم برای سیستم حمل و نقل ژاپن و اینکه چقدر مقرون به صرفه است برای صرف یک شام با کیفیت در اینجا تنگ شده است. با این حال، من هیجان زده هستم که دوباره با دوستانم متحد شوم و مانند یک گردشگر کشور خود را کشف کنم. زمانی که در سال 2025 به ژاپن نقل مکان کردم، می‌دانستم که برای همیشه اینجا نخواهم بود - اما داشتن یک سال کامل در پیش رویم احساس زمان بی‌نهایتی می‌کردم. اکنون دارم آماده بازگشت به زادگاهم در کانادا هستم و نمی توانم باور کنم که سال من چقدر زود گذشت. از زمانی که به اینجا نقل مکان کردم، به اندازه کافی خوش شانس بودم که در توکیو، اوزاکا و کوماموتو زندگی کنم، از بیش از ده ها شهر و شهرک دیدن کردم و تبدیل به نسخه ای از خودم شدم که واقعاً دوستش دارم. من هیجان زده هستم که به خانه بروم و کسانی را که دلم برایشان تنگ شده بود ببینم، اما خداحافظی با زندگی ای که اینجا ساخته ام بسیار سخت تر از آن چیزی است که انتظار داشتم. دلم برای مقرون به صرفه
