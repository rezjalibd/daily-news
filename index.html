  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

زند", "link": "https://www.independentpersian.com/node/423369/%D8%A8%D9%87%D8%AF%D8%A7%D8%B4%D8%AA-%D9%88-%D8%AF%D8%B1%D9%85%D8%A7%D9%86/%D8%A7%D8%B2-%D8%B4%DA%A9%D9%84%D8%A7%D8%AA-%D8%AA%D9%84%D8%AE-%D8%AA%D8%A7-%D8%AF%D9%85%D9%86%D9%88%D8%B4-%D9%86%D8%B9%D9%86%D8%A7%D8%9B-%D8%AE%D9%88%D8%B1%D8%A7%DA%A9%DB%8C%E2%80%8C%D9%87%D8%A7%DB%8C-%D8%B3%D8%A7%D9%84%D9%85%DB%8C-%DA%A9%D9%87-%D9%85%D8%B9%D8%AF%D9%87-%D8%B1%D8%A7-%D8%A8%D9%87-%D8%AF%D8%B1%D8%AF%D8%B3%D8%B1-%D9%85%DB%8C", "summary": "شراب قرمز، قهوه و غذاهای چرب از محرک‌های شناخته‌شده در مشکل بازگشت اسید معده‌ به مری یا اصطلاحاً ترش‌کردن‌اند، با این حال بعضی خوراکی‌هایی که سالم می‌دانیم، از نوشیدنی‌های میوه‌ای گرفته تا دمنوش نعنا هم می‌توانند سوزش سر دل را تشدید کنند. بازگشت اسید معده یا مشکل رفلاکس زمانی رخ می‌دهد که اسید و دیگر محتویات معده به مری و گاهی تا گلو بازگردند. سوزش سر دل یعنی احساس سوزش در قفسه سینه، یکی از علائم آن است. تهوع، سکسکهٔ مداوم و گاهی درد شدید نیز از دیگر علائم آزاردهنده این بیماری‌اند که معمولاً پس از صرف غذا رخ می‌دهند و بر اساس آمارها حدود یک نفر از هر چهار نفر را گرفتار می‌کنند. با این حال اخیراً نگرانی‌های دیگری نیز مطرح و دربارهٔ مصرف طولانی‌مدت برخی داروهای رایج برای درمان ترش کردن هشدارهایی داده شده است. برای مثال سازمان خدمات ملی سلامت بریتانیا (NHS) سال گذشته دربارهٔ خطرات احتمالی مصرف طولانی‌مدت مهارکننده‌های پمپ پروتون مانند امپرازول و لانزوپرازول هشدار داد. از جمله این خطرات عفونت‌های باکتریایی روده‌اند که می‌توانند تعادل میکروب‌های مفید روده را به هم بزنند. برخی پزشکان هم به خطرات احتمالی دیگری نیز اشاره کرده‌اند، از جمله کمبود جدی برخی مواد مغذی که ممکن است به ضعف استخوان‌ها بینجامد. به همین دلیل است که اکنون شناسایی خوراکی‌های محرک و کاهش مصرف آن‌ها که می‌تواند علائم را به میزان قابل‌توجهی بهبود دهد یا حتی برطرف کند، به‌گونه‌ای که فرد به مصرف طولانی‌مدت دارو نیاز نداشته باشد، اهمیت بیشتری یافته است. دیلی میل‌ در مطلبی به تعدادی این محرک‌ها اشاره کرده است، هرچند احتمالاً دیدن نام برخی از آنها جمله بعضی میوه‌ها و حتی دمنوش نعنا، ممکن است برای ما غیرمنتظره باشند. مراقب خوراک مکتوب منتسب به مجتبی خامنه‌ای منتشر کردند که در آن آمده است بسیجیان برای ضربه زدن به «دشمنان اسلام و نظام اسلامی» از هیچ فرصتی چشم‌پوشی نمی‌کنند. در این پیام که به مناسبت هفتهٔ بسیج منتشر شد، از این سازمان خواسته شده است «تحول و تولدی جدید» را تجربه کند و برای تحقق شعار «هر ایرانی، یک بسیجی» گام بردارد. در متن پیام، مصداق «دشمنان نظام اسلامی» مشخص نشده، اما مخاطب آن سازمانی زیرمجموعه سپاه پاسداران است که گردان‌هایش در سرکوب خونین خیزش ملی دی‌ماه نقش مهمی داشتند. تأکید بر ضربه زدن به «دشمنان نظام اسلامی» در پیامی خطاب به بسیج، با توجه به نقش محوری این نیرو در کشتار دی‌ماه، نشانه‌ای از آمادگی حکومت برای سرکوب دوباره اعتراض‌های احتمالی است. انتشار پیام تنها چند هفته مانده به سالگرد کشته‌شدگان، در شرایطی که بحران معیشت به اعتصاب و اعتراض در شهرهای مختلف دامن زده است، به این بخش از متن اهمیت بیشتری می‌دهد. از کشتار دی‌ماه تا طرح «محله‌محور» طائب اعتراض‌های دی‌ماه سال گذشته از دل نارضایتی‌های اقتصادی و با حمایت از شاهزاده رضا پهلوی در بازار تهران آغاز شد و به‌سرعت به خیزشی سراسری علیه جمهوری اسلامی در سراسر ایران تبدیل شد. ایندیپندنت فارسی بر اساس تصاویر راستی‌آزمایی‌شده و شهادت شاهدان، مشارکت سپاه پاسداران، گردان‌های بسیج، واحدهای فرماندهی انتظامی و نیروهای لباس‌شخصی را در سرکوب‌ها ثبت کرده است. حکومت همزمان اینترنت را قطع کرد و ده‌ها هزار نفر، عمدتاً در روزهای ۱۸ و ۱۹ دی کشته شدند. بازگشت حسین طائب به ریاست سازمان بسیج در مردادماه، جهت‌گیری این نهاد رادر برابر اعتراض‌های احتمالی روشن‌تر می‌کند. طائب که پیش‌تر ریاست سازمان اطلاعات سپاه را بر عهده داشت، پس از کشته شدن غلامرضا سلیمانی، رئیس پیشین بسیج در جنگ، به این سمت منصوب شد. او در هفته‌های اخیر «حکمرانی محله‌محور و مسجد‌محور» را از اولویت‌های بسیج خواند و بر افزایش نقش این سازمان در تأمین امنیت محله‌ها تأکید کرد. از منظر امنیتی، چنین رویکردی به حکومت امکان می‌دهد برای مهار تجمع‌ها در همان محله‌ها، پیش از گسترش آن‌ها به دیگر نقاط شهر، به شبکه پایگاه‌های بسیج متکی باشد. شعار «هر ایرانی، یک بسیجی» در همین چارچوب معنا پیدا می‌کند. در پیام تازه از سازمان بسیج خواسته شده است از ظرفیت کسانی که با این نهاد همسو هستند و عضو رسمی آن نیستند، استفاده کند. جمهوری اسلامی ایران از آغاز جنگ در اسفندماه، برای برگزاری تجمع‌های حکومتی در شهرهای مختلف به نیروهای بسیج متکی بود. اکنون تلاش برای گسترش این شبکه در جامعه‌ای صورت می‌گیرد که نقش سپاه و بسیج در کشتار دی‌ماه، نفرت بخش بزرگی از مردم را از این دو نهاد عمیق‌تر کرده است. سالگرد کشته‌شدگان در اوج بحران معیشت بخشی از فشار اقتصادی که معترضان سال گذشته را به خیابان کشان", "date_str": "2026-11-27T14:56:19+00:00", "hash": "8a086c96b844a7aa", "title_fa": "پیام منتسب به مجتبی خامنه‌ای؛ هراس از بازگشت اعتراض‌ها در سالگرد خیزش ملی دی‌ماه", "summary_fa": "در آستانهٔ نخستین سالگرد انقلاب ملی ایرانیان در دی‌ماه ۱۴۰۴ و کشتار بی‌سابقهٔ معترضان، رسانه‌های حکومتی پیامی مکتوب منتسب به مجتبی خامنه‌ای منتشر کردند که در آن آمده است بسیجیان برای ضربه زدن به «دشمنان اسلام و نظام اسلامی» از هیچ فرصتی چشم‌پوشی نمی‌کنند. در این پیام که به مناسبت هفتهٔ بسیج منتشر شد، از این سازمان خواسته شده است «تحول و تولدی جدید» را تجربه کند و برای تحقق شعار «هر ایرانی، یک بسیجی» گام بردارد. در متن پیام، مصداق «دشمنان نظام اسلامی» مشخص نشده، اما مخاطب آن سازمانی زیرمجموعه سپاه پاسداران است که گردان‌هایش در سرکوب خونین خیزش ملی دی‌ماه نقش مهمی داشتند. تأکید بر ضربه زدن به «دشمنان نظام اسلامی» در پیامی خطاب به بسیج، با توجه به نقش محوری این نیرو در کشتار دی‌ماه، نشانه‌ای از آمادگی حکومت برای سرکوب دوباره اعتراض‌های احتمالی است. انتشار پیام تنها چند هفته مانده به سالگرد کشته‌شدگان، در شرایطی که بحران معیشت به اعتصاب و اعتراض در شهرهای مختلف دامن زده است، به این بخش از متن اهمیت بیشتری می‌دهد. از کشتار دی‌ماه تا طرح «محله‌محور» طائب اعتراض‌های دی‌ماه سال گذشته از دل نارضایتی‌های اقتصادی و با حمایت از شاهزاده رضا پهلوی در بازار تهران آغاز شد و به‌سرعت به خیزشی سراسری علیه جمهوری اسلامی در سراسر ایران تبدیل شد. ایندیپندنت فارسی بر اساس تصاویر راستی‌آزمایی‌شده و شهادت شاهدان، مشارکت سپاه پاسداران، گردان‌های بسیج، واحدهای فرماندهی انتظامی و نیروهای لباس‌شخصی را در سرکوب‌ها ثبت کرده است. حکومت همزمان اینترنت را قطع کرد و ده‌ها هزار نفر، عمدتاً در روزهای ۱۸ و ۱۹ دی کشته شدند. بازگشت حسین طائب ب icy,\" Hanke told Business Insider. Huang resigned as Nvidia's CEO on November 12 following reports that he had extramarital affairs with a suspected Chinese spy and a direct report. He was reinstated 11 days later, on November 23, after President Donald Trump urged the company's board to bring him back. The news sent Nvidia stock up 31% on the day, adding nearly $1 trillion to the AI chipmaker's market capitalization, but it has since given up some of those gains. The conduct of Silicon Valley types like Huang \"flouts the moral sentiments and rules that govern and control most people's behavior,\" fueling public bitterness toward \"this new class of big players,\" Hanke said. The professor of applied economics at Johns Hopkins University, who served on President Ronald Reagan's Council of Economic Advisers, said many onlookers are indignant because they feel they've been \"treated unfairly\" by comparison, and have been \"slighted, or abandoned, or humiliated.\" In other words, they see a lack of accountability for the likes of Huang and believe they can break the rules without any lasting consequences. A big reason for the push to bring back Huang was that he's widely considered the face of AI and integral to US success in the budding sector, given Nvidia's central role in powering and financing it. But as the industry's champion, he also represents all that's wrong with AI in skeptics' eyes. Their concerns span from the safety of the tech to its impact on jobs to the immense resource demands of the data-center buildout. Steve Hanke warned of an age of resentment. Steve Hanke Hanke warned that depth of resentment can be polarizing, spurring people on the right to embrace fascism, and those on the left to champion socialism. Indeed, Americans who felt resentful of wealthy elites", "date_str": "2026-11-27T16:04:05+00:00", "hash": "bb8be8633f263965", "title_fa": "استیو هانکه، اقتصاددان برجسته می‌گوید بازگشت جنسن هوانگ به انویدیا ممکن است نوید دهنده «عصر خشم» باشد.", th-it-2026-11", "summary": "I book trips with my kids instead of buying them physical Christmas gifts. Megan Mack Instead of buying my kids toys for Christmas, I take them on trips. Sometimes we do one-on-one trips with the kids, and other times, we go on full-family adventures. They've loved taking trips to places like Disneyland, Great Wolf Lodge , and Toronto. December in our household is full of gifts, parties, and stress. That's because both of our daughters' birthdays fall right between Thanksgiving and Christmas. Year after year, the gifts pile up and so does the overwhelm. A few months later, when my husband and I are organizing the playroom and I suggest getting rid of something, he inevitably asks, \"Why did we even buy this?\" After hearing that question year after year, I decided to put our gift budget toward something that wouldn't end up in a donation bin. Now, instead of gifts, our family goes on trips. What started as a one-time gift continued into a beloved tradition I took my oldest daughter to Toronto to see Taylor Swift in concert. Megan Mack It all started with a Taylor Swift concert in 2024. My aunt and I thought it would be fun to take our girls, but I couldn't really justify the price as something we did \"just because.\" So, the trip from Boston to Toronto (and the concert) became my daughter's birthday and Christmas gifts. The experience created memories in a way that toys never could. Watching the girls sing along to every song in the show was the purest joy I had felt in a while, and I knew this was a tradition we had to continue. Sometimes, we go on full-family affairs, and other times, we take each girl on a separate excursion so they get their own special time with us. The following year, for my youngest daughter's birthday, my husband and I took her on a trip to Disneyland . She loved being the center of attention and deciding exactly what we did. My youngest daughter loved meeting Chewbacca at Disneyland. Megan Mack Another time, we el 11 Pro XL یا Razr Plus 2026) و ساعت هوشمند مربوطه را به سبد خرید خود اضافه کنید. از آنجا، یک طرح Simplicity واجد شرایط را انتخاب کنید و بررسی کنید تا ایمیلی حاوی جزئیات در مورد نحوه استفاده از هدفون رایگان خود پس از آن دریافت کنید. به خاطر داشته باشید که باید هزینه ساعت خود را از قبل پرداخت کنید، اما بعداً از طریق اعتبار صورتحساب بازپرداخت خواهید شد. مشاهده همه پیشنهادات برتر جمعه سیاه ما نحوه دریافت AirPods 5 رایگان و Apple Watch SE3 Sarah Saril/Business Insider امتیاز دادن به Apple Watch SE3 و AirPods 5 رایگان به سادگی افزودن تلفن و ساعت به سبد خرید با طرح واجد شرایط Verizon Simplicity است. پس از پردازش خرید، ایمیلی حاوی دستورالعمل‌هایی درباره نحوه امتیاز دهی به هدفون رایگان دریافت خواهید کرد. نحوه شروع به این صورت است: رنگ iPhone 18 Pro، ظرفیت ذخیره سازی و روش پرداخت مورد نظر خود را (ماهانه یا کامل) انتخاب کنید، سپس روی مراحل بعدی کلیک کنید. قبل از کلیک کردن بر روی پذیرش ادامه، شرایط Simplicity Pro را با دقت بخوانید. اگر یک پاپ آپ ظاهر شد که ساعت هوشمند را نشان", "image_url": "https://i.insider.com/6aece652c54bfafa65abf75c?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple"], "datetime_fa": "۶ آذر • ۱۹:۰۸"}, {"source": "Business Insider", "title": "Stocks rise as traders try to close out a wild Thanksgiving week on a high note", "link": "https://www.businessinsider.com/stock-market-news-thanksgiving-ai-spending-tech-rates-regulation-2026-11", "summary": "Global markets were a sea of green on Friday. Tim Boyle/Bloomberg via Getty Images US investors were likely thankful on Friday to be done with a hugely volatile week of trading. Indexes were rising, with tech stocks leading the gains in the shortened trading session. Anthropic spiked firmly above its IPO price, while Nvidia shares struggled. While shoppers grab bargains on Black Friday , investors were also buying stocks to end the week. Major indexes gave back some premarket gains but were firmly higher in morning trading. Tech shares led the market. SpaceX rose 2%, memory chip maker Sandisk gained 8%, and Anthropic stock jumped 9%, trading well-above its $83 IPO price after days of volatility brought it below the threshold. Notably, Nvidia shares were still struggling after the week's jitters, with the stock lower by about 2%. Here's where major indexes stood around 10:20 a.m. ET: S P 500 : 7,240.74, up 0.8% Dow Jones Industrial Average : 50,545.51, up 0.72% (+362.56 points) Nasdaq 100 : 26,349.81, up 1.1% \"Investors will be counting their blessings that the pre-Thanksgiving recovery in global tech stocks looks like it's being sustained after the turkey has been cleared from people's plates,\" Russ Mould, AJ Bell's investment director, said in a morning note. \"After a tumultuous week, there will be hopes this uptick can be sustained and that the momentum can carry over into the remainder of the year, despite worries about the sustainability of AI spending , rising borrowing costs and a renewed tariff threat,\" he added. Stocks were on a roller coaster this week as investors fretted about whether tech giants' huge investments in microchips and data centers would generate positive returns. The reinstatement of Jensen Huang as Nvidia CEO on Monday sent the Nasdaq 100 up 7%, but the rally faded as investors continued to worry about the company's prospects in light of potentially tighter controls on exports to Asia. Investors are also concerned about the Federal Reserve hiking interest rates to combat stubborn inflation, newly elected Democratic lawmakers clamping down on the data-center buildout, and new tariffs proposed by the Trump administration this week. European stocks rallied, with Britain's FTSE 100 rising 0.7%, Germany's DAX climbing 0.4%, and the Euro Stoxx 50 advancing 0.8%. It was a similar story in Asia, where Japan's Nikkei 225 and Hong Kong's Hang Seng both closed over 2% higher, while South Korea's Kospi bounced 4.3%. Several key commodities we", "date_str": "2026-11-27T15:30:07+00:00", "hash": "2af76ff0feda6b03", "title_fa": "در حالی که معامله گران تلاش می کنند تا هفته شکرگزاری وحشیانه را با نرخ بالایی به پایان برسانند، سهام افزایش می یابد", "summary_fa": "بازارهای جهانی روز جمعه دریای سبز بودند. تیم بویل/ بلومبرگ از طریق گتی ایماژ سرمایه گذاران آمریکایی احتمالاً در روز جمعه از انجام یک هفته معاملاتی بسیار پرنوسان سپاسگزار بودند. شاخص‌ها در حال افزایش بودند و سهام‌های فناوری در جلسه معاملات کوتاه‌تر رشد کردند. Anthropic به شدت بالاتر از قیمت IPO خود بود، در حالی که سهام Nvidia با مشکل مواجه شد. در حالی که خریداران در جمعه سیاه چانه زنی می کنند، سرمایه گذاران نیز برای پایان هفته اقدام به خرید سهام می کردند. شاخص‌های اصلی برخی از سودهای قبل از بازار را پس دادند، اما در معاملات صبح به شدت بالاتر بودند. سهام فناوری بازار را رهبری کرد. SpaceX 2٪ افزایش یافت، Sandisk سازنده تراشه های حافظه 8٪ رشد کرد و سهام Anthropic 9٪ جهش کرد، معاملات بسیار بالاتر از قیمت IPO 83 دلاری خود پس از روزهای بی ثباتی که آن را به زیر آستانه رساند. شایان ذکر است، سهام انویدیا پس از بی‌حرکتی هفته همچنان با مشکل مواجه بودند و سهام حدود 2 درصد کاهش یافت. اینجا جایی است که شاخص های اصلی حدود ساعت 10:20 صبح ایستادند. ET: S P 500: 7240.74، 0.8% افزایش میانگین صنعتی داوجونز: 50،545.51، افزایش 0.72% (+362.56 امتیاز) نزدک 100: 26،349.81، افزایش 1.1% راس مولد، مدیر سرمایه گذاری AJ Bell در یادداشتی صبحگاهی گفت: به نظر می رسد بهبود سهام جهانی فناوری پس از پاکسازی بوقلمون از بشقاب مردم ادامه داشته باشد. وی افزود: «پس از یک هفته پر فراز و نشیب، با وجود نگرانی‌ها در مورد پایداری هزینه‌های هوش مصنوعی، افزایش هزینه‌های استقراض و تهدید تعرفه‌های جدید، امیدواری‌ها می‌توان این افزایش را تداوم بخشید و این حرکت را تا پایان سال ادامه داد.» سهام در این هفته با نگرانی سرمایه‌گذاران در مورد اینکه آیا سرمایه‌گذاری عظیم غول‌های فناوری در ریزتراشه‌ها و مراکز داده بازدهی مثبتی را به همراه خواهد داشت،", "image_url": "https://i.insider.com/6b095887d6c5d341c9b4dafc?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Nvidia", "تراشه"], "datetime_fa": "۶ آذر • ۱۹:۰۰"}, {"source": "Business Insider", "title": "Booking my first cruise was harder than I expected. 7 things surprised me before I even set foot on the ship.", "link": "https://www.businessinsider.com/booking-first-cruise-tips-what-to-know-2026-11", "summary": "The author booked her first cruise with Royal Caribbean. Joey Hadden/Business Insider, Denis Thaust/SOPA Images/LightRocket via Getty Images Window or no window? Tip now or later? Do I really need to book a hotel too? I had no clue I'd be asking myself these questions when I decided to take my first cruise. This is going to be so easy. That was my exact thought when I sat down to book a seven-day cruise aboard Royal Caribbean's Wonder of the Seas . Although I'd never been on a cruise before, the process seemed pretty straightforward — one ticket to cover food, accommodation, and entertainment on a round-trip voyage from Fort Lauderdale, Florida, to Honduras, Mexico, and the cruise line's private island in the Bahamas. I quickly learned that there's so much you have to know about cruising before embarking on your trip. Cruisers recommend booking your flight for the day before the ship leaves. Joey Hadden/Business Insider Since my cruise ship left from Florida and I live in New York, I had to fly there. When I started searching for flights, I looked for reservations on the same day as my cruise departure. After a little research, though, I learned that seasoned cruisers recommend flying into your port city at least one day before your cruise ship departs to leave room for potential delays. So I booked a flight that arrived the night before my trip, stayed at a hotel near the port, and had a stress-free embarkation day. Similarly, when choosing my flight home, I learned that the scheduled port arrival time wasn t exactly when I d be off the ship. Passengers disembark a cruise ship. Lisa Maree Williams/Getty Images The ship's scheduled arrival time is when the ship docks at the port, a cruise ship employee previously told Business Insider. Before passengers ons to the menu are the Christmas Cookie shake, the Butterscotch Crème Brûlée shake, and the Hazelnut Chocolate shake. I tried these to see how they compared to other Shake Shack flavors — in total, I've tried 19 of the shakes, each made with frozen custard. The flavors include classics such as chocolate and vanilla, as well as limited-edition shakes like the Dubai Chocolate Pistachio, which was introduced last summer and brought back this year due to popular demand. Here's how I ranked them all, from my least favorite to my favorite. Shake Shack did not respond to a request for comment. In last place came the strawberry shake. Gabbi Shaw/Business Insider A strawberry shake costs $6 at my nearest Shake Shack in New York. It's made with vanilla custard and \"real strawberry,\" according to the website. There are 690 calories in a 16-ounce cup, Shake Shack's standard shake size. It was doomed from the start — I almost couldn t get past its strong strawberry fumes. Inside the strawberry shake. Gabbi Shaw/Business Insider This could just be personal bias, as I would never order a strawberry shake under any circumstances, but when I took the lid off and sniffed the shake, I felt like I was sniffing a strawberry-scented candle. After tasting a sip, I was able to appreciate that this was one of the thickest shakes I tried. But it was just too sweet for me — I could only take a couple sips before feeling like I was rapidly developing a cavity. In 18th place was the limited-edition Campfire S mores shake. Gabbi Shaw/Business Insider The Campfire S'mores shake, which was available during summer 2025, was made with vanilla frozen custard, graham crackers, \"chocolate and toasted marshmallow fudge chunks,\" and finished off with whipped cream and s'mores crumbles, per Shake Shack's website description. It cost $6.99 and had 1,090 calories. You can see how many of the ingredients were sitting at the bottom, making this hard to drink. Gabbi", "date_str": "2026-11-27T14:52:01+00:0 rways Boeing 787. PATRICK T. FALLON/AFP via Getty Images Norse Atlantic's Norwegian operating unit filed for bankruptcy as it fights to stay in business. It also grounded its flights and received notices terminating the lease agreements for its fleet. Norse had been losing millions since fuel prices surged due to the Iran war. Cheap transatlantic flights are on the brink as Norse Atlantic filed for bankruptcy. The budget airline, which has previously offered one-way New York-to-London tickets for as little as $99, warned on Wednesday that its \"financial situation is critical.\" On Friday, it announced that its Norwegian operating unit had filed for bankruptcy. All Norse flights are canceled, and ticket sales have been discontinued, it added. \"We are deeply sorry for the impact this has on our passengers, employees and partners,\" said CEO Eivind Roald. He added that the board, management, and its advisors are \"working to find a solution for the remaining part of the business to continue operations.\" Earlier on Friday, Norse said that it received notices terminating the lease agreements for all 12 of its airplanes. It added that while it was contesting these and is still continuing discussions over short-term financing, \"there can be no assurance that a viable solution will be found.\" Shares in the airline, which trade on the Norwegian stock exchange, are trading at 1 cent, down 40% over the past five days, and 98.5% since the start of the year. The airline reported a net loss of $94.6 million for the first half of the year. It also noted that fuel prices had nearly doubled compared to last year. Before this week, Norse had already been looking for ways to shore up its finances. In May, it announced a cost-cutting plan aimed at saving $50 million a year, including the elimination of 75 jobs. And last August, it axed half of its US-to-Europe routes . Norse was founded in 2021 after fellow Scandinavian carrier Norwegian Air abandoned its transatlantic routes as i ص داده نشده است. در ددلاین تماشا کنید یک سخنگوی نتفلیکس گفت که این صحنه از سند حذف شده است که امروز حذف شد. او اضافه کرد که به دنبال اطلاعات جدیدی که خانواده در رابطه با تشخیص رسمی سلامت روان تایسون به اشتراک گذاشته اند، ما در کنار آنها برای به روز رسانی مستند قبل از انتشار کار کرده ایم. به دنبال اظهارات مربوط به اسکیزوفرنی، که در یک بیانیه مطبوعاتی نتفلیکس در مورد این سند در روز دوشنبه نیز گنجانده شد، هیئت کنترل بوکس بریتانیا گفت که در حال بررسی است که آیا آنچه که تصور می‌شد تشخیص فیوری باشد مانع مبارزه طولانی مدت او با بوکسور بریتانیایی، جاشوا می‌شود یا خیر.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Tyson_Fury_n_00_57_11_23.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۶ آذر • ۱۸:۲۶"}, {"source": "Rolling Stone", "title": "Watch ‘Sesame Street’ Pay Homage to Mariah Carey’s ‘All I Want for Christmas Is You’", "link": "https://www.rollingstone.com/music/music-news/sesame-street-mariah-carey-christmas-song-homage-1235665152/", "summary": "This year the characters need the letter \"U\" to help the holidays stay festive and bright", "date_str": "2026-11-27T14:57:04+00:00", "hash": "9772e983cb0be016", "title_fa": "«خیابان کنجد» را تماشا کنید که به آهنگ «همه چیزی که برای کریسمس می‌خواهم تو هستی» ماریا کری", "summary_fa": "امسال کاراکترها به حرف \"U\" نیاز دارند تا به تعطیلات کمک کند تا در تعطیلات جشن و شادی داشته باشند. امسال، شخصیت‌های Sesame Street با نسخه عجیب و غریب خود، با عنوان All I Want for Christmas Is U به آهنگ تعطیلات ادای احترام کردند. در کلیپ که امروز به اشتراک گذاشته شد، Abby Cadabby، Grover، Elmo و Cookie Monster درباره حرف بسیار مهم U می خوانند، که آرزوی اصلی آنها در کریسمس است. ماپت های رنگارنگ می خوانند: \"اگر ما برای کریسمس U نداشتیم، هیچ کلمه ای وجود نداشت.\" «ما نمی‌توانیم هدایا را زیر درخت کریسمس باز کنیم/ بدون کلماتی که با U شروع می‌شوند، تعطیلات احساس درستی نمی‌کند/ ما حتی نمی‌توانیم روبان‌ها را باز کنیم/ یا چراغ‌های کریسمس را باز کنیم/ می‌خواهیم جعبه کریسمس را باز کنیم، ا     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
