د. اما نه ایده علاج تازه است و نه دعوت از شهروندان برای جمع‌آوری اطلاعات درباره شهروندان دیگر. آنچه در «علاج» تغییر کرده، فقط ابزار نیست. این بار هدف می‌تواند هزاران کیلومتر دورتر از ایران زندگی کند و اطلاعاتی که درباره او خواسته می‌شود، از یک نام و تصویر بسیار فراتر می‌رود. ردپای عمومی «علاج» نشان می‌دهد فعالیت آن پیش از معرفی گسترده وب‌سایت در شهریور۱۴۰۵ آغاز شده بود. مطالب کانالی با نام «Alaj‌Group» ماه‌ها قبل؛ حداقل از فروردین ۱۴۰۵ در کانال‌های پرمخاطب نزدیک به حکومت بازنشر می‌شدند."}, {"source": "IranWire", "title": "چهارمین سالگرد ژینا؛ نام او رمز دادخواهی است، حتی برای جان‌باختگان دی‌ماه", "link": "https://iranwire.com/fa/features/157658-%DA%86%D9%87%D8%A7%D8%B1%D9%85%DB%8C%D9%86-%D8%B3%D8%A7%D9%84%DA%AF%D8%B1%D8%AF-%DA%98%DB%8C%D9%86%D8%A7-%D9%86%D8%A7%D9%85-%D8%A7%D9%88-%D8%B1%D9%85%D8%B2-%D8%AF%D8%A7%D8%AF%D8%AE%D9%88%D8%A7%D9%87%DB%8C-%D8%A7%D8%B3%D8%AA-%D8%AD%D8%AA%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%AC%D8%A7%D9%86%D8%A8%D8%A7%D8%AE%D8%AA%DA%AF%D8%A7%D9%86-%D8%AF%DB%8C%D9%85%D8%A7%D9%87/", "summary": "چهار سال قبل، غروب جمعه ۲۵شهریور رنگ خون گرفت. جمع کثیری از مردم به‌ویژه زنان مقابل بیمارستان کسرا در تهران جمع شده بودند. خشم‌شان می‌جو ...", "date_str": "2026-09-16T07:23:16+00:00", "hash": "6afc1005667107c7", "title_fa": "چهارمین سالگرد ژینا؛ نام او رمز دادخواهی است، حتی برای جان‌باختگان دی‌ماه", "summary_fa": "چهار سال قبل، غروب جمعه ۲۵شهریور رنگ خون گرفت. جمع کثیری از مردم به‌ویژه زنان مقابل بیمارستان کسرا در تهران جمع شده بودند. خشم‌شان می‌جو ... پس از آن ایران به خروش آمد. روسری‌ها سوزانده شد، شعارهای شبانه از هر کوی و برزن برخواست، مدارس و دانشگاه‌ها به اعتراضات خیابانی پیوستند و خیابان‌های شهرهای بزرگ و کوچک ایران به صحنه اعتراضات تبدیل شدند. حالا چهار سال پس از شکل‌گیری یکی از مترقی‌ترین جنبش‌های تاریخ معاصر ایران، تغییرات بسیاری را می‌شود در خیابان دید. آمارهای حقوق بشری نشان می‌‌دهد در چهارسالی که گذشت، بسیاری از زنان به‌دلیل نوع پوشش خود با برخوردهای امنیتی و قضایی مواجه شده‌اند اما مقابل حاکمیت سرخم نکرده‌اند. ایستادگی که به قیمت زخم‌های فراوان بر روح و حتی تازیانه بر تن برخی از آن‌ها ادامه دارد. نام «ژینا (مهسا) امینی» پس از چهارسال به‌عنوان نماد دادخواهی در میان مردم ایران هنوز زنده است. این را می‌شود از واکنش‌ شهروندان در شبکه‌های اجتماعی به روشنی دانست. این گزارش نگاهی دارد به واکنش‌های کاربران در سالگرد این اتفاق تلخ اما تاریخی. بر سنگ مزار او نوشته شد: «ژینا جان، تو نمی‌میری، نامت رمز می‌شود.» شاید این یکی از شگفت‌ترین انتخاب‌هایی باشد که کسی برای سنگ قبر یک دختر جوان در نظر گرفت. جمله‌ای که مثل یک آرزوی برگزیده، ظرف چند روز به حقیقت پیوست. «فرشاد طاهری» روان‌درمانگر و یکی از کاربران توییتر با اشاره به این جمله در حساب کاربری ایکس نوشت : «اگر حماسه‌ی زن، زندگی، آزادی را هومر نوشته بود بی‌شک این دستی که چنین زیبا وارد کار شد و روی سنگ نوشت را متعلق به یکی از خدایان می‌دانست؛ فرصت‌شناس، زیبا، با معنی و مختصر؛ نهایت چیزی که از یک آفرینش بی‌نقص انتظار داریم. ژینا گیان، تو نمی‌میری، نامت رمز می‌شود.» اگر حماسه‌ی #زن_زندگی_آزادی رو هومر نوشته بود بی‌شک این دستی که چنین زیبا وارد کار"}, {"source": "IranWire", "title": "تصاویر تازه خسارات گسترده حملات ایران به پایگاه‌های آمریکا", "link": "https://iranwire.com/fa/news-1/157660-%D8%AA%D8%B5%D8%A7%D9%88%DB%8C%D8%B1-%D8%AA%D8%A7%D8%B2%D9%87-%D8%AE%D8%B3%D8%A7%D8%B1%D8%A7%D8%AA-%DA%AF%D8%B3%D8%AA%D8%B1%D8%AF%D9%87-%D8%AD%D9%85%D9%84%D8%A7%D8%AA-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%A8%D9%87-%D9%BE%D8%A7%DB%8C%DA%AF%D8%A7%D9%87%D9%87%D8%A7%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7/", "summary": "تصاویر تازه‌ای از پایگاه‌های نظامی آمریکا در خاورمیانه، ابعاد گسترده خسارات ناشی از حملات موشکی و پهپادی جمهوری اسلامی را نشان می‌دهند؛ ...", "date_str": "2026-09-16T08:03:01+00:00", "hash": "d4124847c5e42f20", "title_fa": "تصاویر تازه خسارات گسترده حملات ایران به پایگاه‌های آمریکا", "summary_fa": "تصاویر تازه‌ای از پایگاه‌های نظامی آمریکا در خاورمیانه، ابعاد گسترده خسارات ناشی از حملات موشکی و پهپادی جمهوری اسلامی را نشان می‌دهند؛ ... شبکه «سی‌بی‌اس نیوز» روز سه‌شنبه ۲۴ شهریور ۱۴۰۵ گزارش داد این تصاویر را شماری از نیروهای نظامی مستقر در پایگاه‌های آمریکا، به شرط محفوظ‌ماندن هویتشان، در اختیار این شبکه قرار داده‌اند. یکی از این نظامیان گفته است: «خسارات گسترده‌ای به پایگاه‌های ما وارد شده که به اطلاع افکار عمومی آمریکا نرسیده است. ما چشم‌بسته ایستاده‌ایم و مشت به صورتمان می‌خورد.» یکی از تصاویر، یک فروند هواپیمای چهار موتوره «بوئینگ ای‌-۳ سنتری» را در پایگاه هوایی شاهزاده سلطان عربستان سعودی نشان می‌دهد که بخش عقبی آن مستقیما هدف قرار گرفته است. دم هواپیما از بدنه سوخته جدا شده و رادار چرخان آن نیز روی زمین افتاده است. ای‌-۳ سنتری هواپیمای هشدار زودهنگام و کنترل هوابرد ارتش آمریکاست که برای شناسایی، ردیابی و مدیریت عملیات هوایی استفاده می‌شود. آسیب‌دیدن این هواپیما می‌تواند توانایی نظارتی و فرماندهی هوایی نیروهای آمریکا در منطقه را تحت تاثیر قرار دهد. تصاویر دیگر از پایگاه شاهزاده سلطان، ساختمان‌ها و آسایشگاه‌هایی را نشان می‌دهند که بخش عمده آن‌ها تخریب شده و تنها پوسته‌ای از سازه‌ها باقی مانده است. دیوارهای بتنی موسوم به «تی‌وال» در کنار ساختمان‌های ویران‌شده سالم مانده‌اند، اما نتوانسته‌اند از سازه‌ها در برابر حمله هوایی محافظت کنند. تصاویر مشابهی نیز از «اردوگاه بیوری» و «اردوگاه عریفجان» در کویت منتشر شده‌اند. اردوگاه بیوری یکی از مراکز اصلی استقرار و آماده‌سازی نیروهای زمینی آمریکا، خودروهای زرهی و شماری از هواپیماها در منطقه محسوب می‌شود. گزارش سی‌بی‌اس نیوز هم‌زمان با انتشار نخستین گزارش بازرس کل وزارت دفاع آمریکا درباره عملیات موسوم به «خشم حماسی» منتشر شده است. این گزارش خسارت واردشده به تجهیزات نظامی آمریکا را تا ۳.۷ میلیارد دلار برآورد کرده و از نابودی یا آسیب‌دیدن نزدیک به ۶۰ فروند هواپیما خبر داده است."}, {"source": "IranWire", "title": "سازمان حقوق بشر ایران: دست‌کم صد معترض دی‌ماه در خطر اعدام هستند", "link": "https://iranwire.com/fa/news-1/157665-%D8%B3%D8%A7%D8%B2%D9%85%D8%A7%D9%86-%D8%AD%D9%82%D9%88%D9%82-%D8%A8%D8%B4%D8%B1-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%AF%D8%B3%D8%AA%DA%A9%D9%85-%D8%B5%D8%AF-%D9%85%D8%B9%D8%AA%D8%B1%D8%B6-%D8%AF%DB%8C%D9%85%D8%A7%D9%87-%D8%AF%D8%B1-%D8%AE%D8%B7%D8%B1-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85-%D9%87%D8%B3%D8%AA%D9%86%D8%AF/", "summary": "سازمان حقوق بشر ایران اعلام کرده است دست‌کم ۱۰۰ معترض بازداشت‌شده که در ارتباط با اعتراضات دی‌ماه ۱۴۰۴ به اعدام محکوم شده‌اند در معرض اج ...", "date_str": "2026-09-16T09:12:34+00:00", "hash": "df31b9ba0b5e7815", "title_fa": "سازمان حقوق بشر ایران: دست‌کم صد معترض دی‌ماه در خطر اعدام هستند", "summary_fa": "سازمان حقوق بشر ایران اعلام کرده است دست‌کم ۱۰۰ معترض بازداشت‌شده که در ارتباط با اعتراضات دی‌ماه ۱۴۰۴ به اعدام محکوم شده‌اند در معرض اج ... براساس گزارش سازمان حقوق بشر ایران این آمار تنها پرونده‌های مستند شده در ۱۳ استان را دربر می‌گیرد؛ درحالی‌که اعتراضات دی‌ماه تمامی ۳۱ استان ایران را فراگرفته بود. این سازمان می‌گوید احتمالا شمار واقعی معترضان در معرض اعدام بیش از رقم اعلام‌شده است. فهرست منتشر شده شامل افرادی است که در دادگاه‌های بدوی به اعدام محکوم شده‌اند. حکم شماری از آن‌ها در دیوان عالی کشور تأیید شده، اما احکام برخی دیگر هنوز قطعی نیست. در تعدادی از پرونده‌ها نیز عنوان اتهامی متهمان مشخص نشده است. سازمان حقوق بشر ایران نام، سن و محل نگهداری این معترضان و در مواردی تصاویر آن‌ها را منتشر کرده است. تنها پنج پرونده از میان ۱۰۰ مورد را منابع رسمی جمهوری اسلامی اعلام کرده‌اند و اطلاعات دو پرونده دیگر نیز از طریق گفت‌وگوی وکلای مدافع با رسانه‌های داخلی منتشر شده است. این سازمان می‌گوید ۶۶ پرونده را به‌طور مستقل راستی‌آزمایی کرده و اطلاعات ۲۷ پرونده دیگر را از گزارش‌های سایر نهادهای حقوق‌بشری به دست آورده است. به‌گفته این نهاد، پنهان‌کاری دستگاه قضایی و فشار بر خانواده‌ها باعث شده است آمار موجود تنها حداقل موارد قابل شناسایی را نشان دهد. «محمود امیری‌مقدم»، مدیر سازمان حقوق بشر ایران، گفته است این احکام در دادگاه‌های انقلاب و طی روندهایی صادر شده‌اند که حداقل معیارهای دادرسی عادلانه را رعایت نمی‌کنند. به‌گفته او، شکنجه و بدرفتاری برای گرفتن اعتراف و استناد به اعترافات اجباری در پرونده‌های منتهی به اعدام، رویه‌ای سیستماتیک در جمهوری اسلامی است. این سازمان همچنین از جامعه جهانی، به‌ویژه کشورهایی که با جمهوری اسلامی روابط دیپلماتیک دارند، خواسته است توقف فوری اعدام‌ها را به یکی از مطالبات اصلی خود در هرگونه گفت‌وگو با مقام‌های حکومت ایران تبدیل کنند."}, {"source": "IranWire", "title": "هیوا عبدالهی، فعال مدنی و مربی سا ژینا امینی و دیگر جان‌باختگان اعتراضات نوشت: «ما راه آنان را تا آزادی و بازپس‌گیری ایران ادامه خواهیم داد.»"}, {"source": "Independent Persian", "title": "شبیخون گرانی و فقر به تنقلات کودکان؛ بستنی قیفی ۱۰۰ هزار تومان", "link": "https://www.independentpersian.com/node/422318/%D8%A7%D9%82%D8%AA%D8%B5%D8%A7%D8%AF/%D8%B4%D8%A8%DB%8C%D8%AE%D9%88%D9%86-%DA%AF%D8%B1%D8%A7%D9%86%DB%8C-%D9%88-%D9%81%D9%82%D8%B1-%D8%A8%D9%87-%D8%AA%D9%86%D9%82%D9%84%D8%A7%D8%AA-%DA%A9%D9%88%D8%AF%DA%A9%D8%A7%D9%86%D8%9B-%D8%A8%D8%B3%D8%AA%D9%86%DB%8C-%D9%82%DB%8C%D9%81%DB%8C-%DB%B1%DB%B0%DB%B0-%D9%87%D8%B2%D8%A7%D8%B1-%D8%AA%D9%88%D9%85%D8%A7%D9%86", "summary": "فقر و فلاکت از هر دری که وارد شود، معمولا نخستین کسانی را که هدف قرار می‌دهد کودکان‌اند. آن‌ها که هیچ نقش و سهمی در شکل‌گیری شرایط ندارند اما بیشترین هزینه را می‌پردازند. اینکه امروز چه تعداد از کودکان در ایران با سوءتغذیه مواجه‌اند یا دست‌کم از خوردن خوراکی‌هایی که دوست دارند محروم مانده‌اند، مشخص نیست زیرا جمهوری اسلامی به شکلی معنادار از انتشار آمار دقیق فقر خودداری می‌کند. با این حال، بررسی قیمت‌ها و روایت‌های میدانی مردم نشان می‌دهد که امروز برای تعداد قابل توجهی از خانواده‌ها در ایران، حتی خرید یک بستنی، شیرکاکائو، چیپس یا شکلات برای فرزندانشان به سختی امکان‌پذیر است تا آنجا که در بسیاری موارد مجبورند به درخواست کودکان خود برای خرید خوراکی مورد علاقه‌شان پاسخ منفی بدهند. این در حالی است که با فرض حدود ۲۲ روز حضور در مدرسه در یک ماه، خانواده باید برای هر کودک ماهانه بین یک میلیون و ۳۲۰ هزار تا دو میلیون و ۲۰۰ هزار تومان فقط پول توجیبی کنار بگذارد؛ آن هم نه برای خرید یک وعده غذایی، بلکه برای اینکه کودک بتواند هر روز تنها یک خوراکی بسیار ساده بخرد. اگر خانواده دو فرزند مدرسه‌ای داشته باشد، این رقم به حدود دو میلیون و ۶۴۰ هزار تا چهار میلیون و ۴۰۰ هزار تومان در ماه می‌رسد. مربی یک مدرسه کودکان کار در جنوب تهران، وضعیت فعلی کودکان آسیب‌پذیر را «وحشتناک» توصیف می‌کند و می‌گوید روزانه با تعداد قابل‌توجهی از کودکانی سر و کار دارد که حتی هفته‌ای یک‌ بار هم غذای گرم نمی‌خورند و برخی از آن‌ها ماه‌هاست حتی یک گرم گوشت مصرف نکرده‌اند. به اده در امارات متحده عربی را که در جریان جنگ ایران آسیب دیده‌اند، بازیابی کند. این اختلالات در ماه مارس (اسفند) در اوایل جنگ آمریکا و اسرائیل با ایران روی داد. در آن زمان، بخش رایانش ابری آمازون اعلام کرد که در بحبوحه جنگ، پهپادهایی به سه مرکز این شرکت در امارات متحده عربی و بحرین اصابت کرده‌اند. شرکت خدمات وب آمازون (سرویس‌های وب آمازون) اعلام کرد که «حملات پهپادی ایران به مراکز داده در امارات متحده عربی و بحرین» باعث شده است که بخشی از داده‌های مشتریان برای همیشه غیرقابل بازیابی شود. براساس گزارشی که رویترز سه‌شنبه ۱۵ سپتامبر (۲۴ شهریور) منتشر کرد، خدمات وب آمازون قادر نیست دسترسی به مرکز رایانش ابری خود در بحرین و یکی از سه منطقه میزبانی داده در امارات متحده عربی را بازیابی کند که در جریان جنگ ایران آسیب دیده‌اند. به گزارش رویترز، این امر باعث شد تا شرکت‌ها استفاده از سرورهای ابری خود را به مناطق دیگر منتقل کنند؛ امارات هم در حال بررسی احداث مراکز داده زیرزمینی است که هزینه بالاتری دارند؛ هرچند آمازون و مایکروسافت گفته‌اند که همچنان به توسعه فعالیت‌های خود در سطح منطقه ادامه می‌دهند. شرکت خدمات وب آمازون آن زمان اعلام کرد که یکشنبه اول مارس (۱۰ اسفند)، «اشیاء ناشناسی» به یک مرکز داده در امارات برخورد کرده و موجب ایجاد «جرقه و آتش‌سوزی» شده‌اند. این شرکت همچنین در همان روز از مشکلات مربوط به برق و اتصال شبکه در یکی از مراکز خود در بحرین خبر"}, {"source": "BBC Persian", "title": "سرکوب اعتراض‌های ۱۴۰۱؛ عفو بین‌الملل خواهان تحقیق درباره بیش از ۸۰ مقام جمهوری اسلامی شد", "link": "https://www.bbc.com/persian/articles/cm4gjr25ppn9o?at_medium=RSS&at_campaign=rss", "summary": "گزارش تازه عفو بین‌الملل با بررسی اسناد، شهادت‌ها و ویدئوها، زنجیره فرماندهی سرکوب اعتراضات ۱۴۰۱ را بررسی کرده و خواهان تحقیق کیفری درباره ۸۷ مقام جمهوری اسلامی شده است.", "date_str": "2026-09-16T09:03:59+00:00", "hash": "6aa4211151ac5c63", "title_fa": "سرکوب اعتراض‌های ۱۴۰۱؛ عفو بین‌الملل خواهان تحقیق درباره بیش از ۸۰ مقام جمهوری اسلامی شد", "summary_fa": "گزارش تازه عفو بین‌الملل با بررسی اسناد، شهادت‌ها و ویدئوها، زنجیره فرماندهی سرکوب اعتراضات ۱۴۰۱ را بررسی کرده و خواهان تحقیق کیفری درباره ۸۷ مقام جمهوری اسلامی شده است. هم‌زمان با چهارمین سالگرد آغاز اعتراض‌های «زن، زندگی، آزادی» در ایران، سازمان عفو بین‌الملل در گزارشی جدید، زنجیره تصمیم‌گیری و اجرای سرکوب این اعتراضات را بررسی کرده و خواهان تحقیق کیفری درباره ده‌ها مقام جمهوری اسلامی شده است. این گزارش در بیش از هزار صفحه و با عنوان «معماران جنایت»، در سالگرد کشته شدن مهسا (ژینا) امینی در بازداشت پلیس امنیت اخلاقی در روز ۲۵ شهریور ۱۴۰۱ منتشر شده است. یکی از مدارک این تحقیق، سندی است که عفو بین‌الملل می‌گوید همراه با شهادت فردی مطلع به دست آورده است. بر اساس این سند، ساعت ۵:۲۵ عصر ۳۰ شهریور ۱۴۰۱، دستوری منتسب به ستاد کل نیروهای مسلح به مراکز فرماندهی انتظامی جمهوری اسلامی رسید که در آن بر «پاسخ قاطع و شدید به هر تجمع، متفرق کردن اغتشاشگران و بازداشت و انتقال آنان به پایگاه‌ها برای گرفتن تعهد» تاکید شده بود. گزارش جدید می‌گوید این دستور از طریق سامانه فرماندهی و کنترل «مرفوک» به واحدهای محلی ارسال شد. بر پایه مستندات عفو بین‌الملل، در وقایع همان روز دست‌کم ۶۰ معترض و رهگذر در ۳۰ شهرستان از ۱۲ استان ایران کشته شدند. عفو بین‌الملل می‌گوید دستور افشاشده می‌تواند «دلایل تشدید قابل توجه استفاده از مهمات مرگبار علیه معترضان در سراسر کشور از ۳۰ شهریور ۱۴۰۱ به بعد» را توضیح دهد. این سازمان همچنین «تشدید سراسری استفاده از نیروی مرگبار و کشتارهای غیرقانونی در شامگاه ۳۰ شهریور» را نشانه دیگری می‌داند از اینکه دستورها در زنجیره فرماندهی، از سطح ملی تا استانی و شهرستانی، اجرا شده‌اند. عفو بین‌الملل در گزارش خود نتیجه‌گیری کرده است که «قتل، شکنجه، تجاوز، خشونت جنسی، ناپدیدسازی قهری، حبس و آزار و تعقیب» در جریان سرکوب، بخشی از یک"}, {"source": "BBC Persian", "title": "کشته شدن دست‌کم ۲۰ نفر در غزه بر اثر فروریختن ساختمانی که در حملات اسرائیل آسیب دیده بود", "link": "https://www.bbc.com/persian/articles/c6wyzgdn77l8o?at_medium=RSS&at_campaign=rss", "summary": "به گفته تیم‌های امداد و نجات محلی در غزه ، در پی فروریختن ساختمانی که بر اثر حملات قبلی اسرائیل آسیب دیده بود، دست‌کم ۲۰ نفر از جمله پنج کودک جان باختند و ده‌ها نفر نیز مفقود شده‌اند.", "date_str": "2026-09-16T11:12:46+00:00", "hash": "27959f04a9f47b77", "title_fa": "کشته شدن دست‌کم ۲۰ نفر در غزه بر اثر فروریختن ساختمانی که در حملات اسرائیل آسیب دیده بود", "summary_fa": "به گفته تیم‌های امداد و نجات محلی در غزه ، در پی فروریختن ساختمانی که بر اثر حملات قبلی اسرائیل آسیب دیده بود، دست‌کم ۲۰ نفر از جمله پنج کودک جان باختند و ده‌ها نفر نیز مفقود شده‌اند. احتمال می‌رود که حدود ۱۰۰ نفر دیگر از ساکنان این مجتمع در منطقه تل الهوا شهر غزه در زیر آوار گیر افتاده باشند. تصاویر ویدئویی نشان می‌دهد که عملیات جستجو برای یافتن اجساد و بازماندگان در میان آوار این ساختمان چندطبقه در منطقه «تل‌الهوا» که طبقات آن روی هم فرو ریخته‌اند، همچنان ادامه دارد. ساکنان محلی اظهار داشتند که با وجود هشدارهایی مبنی بر ناامن بودن این ساختمان، ۱۰ خانواده در این آپارتمان‌ها سکونت داشتند به این دلیل که جای دیگری برای زندگی نداشتند. بر اساس برآوردها تا دو هزار ساختمان دیگر مشابه این مجمتمع فروریخته با احتمال فروپاشی مواجه هستند. برنامه توسعه سازمان ملل متحد می‌گوید که مردم به دلیل کمبود تجهیزات با «دستان خالی» کمک می‌کردند. کارکنان این برنامه تلاش می‌کنند که مردم را از زیر آوار نجات دهند. حالا کارکنان سازمان دفاع مدنی می‌گویند که بعد از مدتی توانسته‌اند برخی از ماشین‌آلات سنگین را قرض بگیرند. اسرائیل محدودیت‌های شدیدی را در مورد تجهیزات مجاز به ورود به غزه اعمال کرده است. در همین حال مقامات بهداشتی و منابع حماس می‌گویند که حملات هوایی روز سه‌شنبه اسرائیل به غزه منجر به کشته شدن دست‌کم پنج فلسطینی، از جمله دو کودک و یکی از فرماندهان حماس، شد. پیش از آن ارتش اسرائیل اعلام کرده بود که یک فرمانده حماس را در جنوب غزه و یک عضو دیگر آن را در شمال این منطقه کشته است. بنا بر گزارش‌ها، در این حملات دو کودک هم جان باخته‌اند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. در خبری دیگر، سازمان خیریه"}, {"source": "BBC Persian", "title": "رسانه نزدیک به دولت ترکیه: ایران و اسرائیل در پی تضعیف پیمان مکه هستند", "link": "https://www.bbc.com/persian/articles/cqrl6e48rygeo?at_medium=RSS&at_campaign=rss", "summary": "ینی‌شفق، روزنامه نزدیک به دولت ترکیه، در تفسیری به قلم یحیی بوستان، حملات اخیر به عربس درباره ایلان ماسک؛ پرتره‌ای جنجالی از ثروتمندترین مرد جهان", "link": "https://www.bbc.com/persian/articles/crk3l2jpkdeo?at_medium=RSS&at_campaign=rss", "summary": "جشنواره فیلم ونیز میزبان نمایش نخست «ماسک»، مستند تازه الکس گیبنی، مستندساز برنده اسکار، بود؛ فیلمی ۲۲۵ دقیقه‌ای که با نگاهی انتقادی زندگی، نفوذ و جاه‌طلبی‌های ایلان ماسک را از کسب‌وکارهای فناوری و رویای سکونت در مریخ تا حضورش در سیاست آمریکا بررسی می‌کند. این مستند تصویری تیره و بحث‌برانگیز از ثروتمندترین مرد جهان ارائه می‌دهد و از همان نخستین نمایش خود واکنش‌های گسترده‌ای برانگیخته است.", "date_str": "2026-09-16T05:51:35+00:00", "hash": "dacb7fd8205022d6", "title_fa": "فیلمی چهار ساعته درباره ایلان ماسک؛ پرتره‌ای جنجالی از ثروتمندترین مرد جهان", "summary_fa": "جشنواره فیلم ونیز میزبان نمایش نخست «ماسک»، مستند تازه الکس گیبنی، مستندساز برنده اسکار، بود؛ فیلمی ۲۲۵ دقیقه‌ای که با نگاهی انتقادی زندگی، نفوذ و جاه‌طلبی‌های ایلان ماسک را از کسب‌وکارهای فناوری و رویای سکونت در مریخ تا حضورش در سیاست آمریکا بررسی می‌کند. این مستند تصویری تیره و بحث‌برانگیز از ثروتمندترین مرد جهان ارائه می‌دهد و از همان نخستین نمایش خود واکنش‌های گسترده‌ای برانگیخته است. الکس گیبنی، کارگردان برنده اسکار «تاکسی به سوی تاریکی» و «انرون: باهوش‌ترین آدم‌های اتاق»، درباره برخی از ثروتمندترین و قدرتمندترین افراد جهان مستند ساخته است. اما هیچ‌ کدام به اندازه ایلان ماسک ثروتمند و قدرتمند نبوده‌اند. شاید به همین دلیل است که مستند او درباره این کارآفرین فناوری و رئیس اسپیس‌ایکس چنین ابعاد گسترده‌ای دارد. «ماسک» که برای نخستین بار در جشنواره فیلم ونیز به نمایش درآمد، ۲۲۵ دقیقه است و با یک میان‌پرده ۱۰ دقیقه‌ای اکران شد، یعنی نزدیک به چهار ساعت درباره زندگی و کار ثروتمندترین مرد جهان. در فیلم کمتر چیزی می‌بینیم که پیشتر گزارش نشده باشد، اما گیبنی گزارش‌های موجود را در روایتی نفس‌گیر و پرشتاب گرد آورده است، تصویری عمدتا منفی و به‌شکلی هراس‌انگیز آخرالزمانی. گیبنی ابتدا تلاش کرد با ماسک مصاحبه کند، اما وقتی ساخت این پروژه در مارس ۲۰۲۳ اعلام شد، ماسک در شبکه‌های اجتماعی گفت که این فیلم اثری «تخریبی» خواهد بود. گیبنی هم پاسخ داد: «از کجا می‌دانی؟» راه‌حل کارگردان این بود که نسخه‌ای دیجیتالی از ماسک، ساخته‌شده با هوش مصنوعی، حرف‌هایی را که او پیشتر در انظار عمومی گفته است تکرار کند. گیبنی در گفتار متن می‌گوید این انتخاب بی‌مناسبت نیست، چون ماسک معتقد است شاید همه ما در یک شبیه‌سازی زندگی می‌کنیم، بازی ویدیویی‌ که نسل‌های آینده ما مشغول انجام آن‌اند. دیوید برن از نویسندگان ترانه «بگذار رویایی به تو بفروشم» برای تیتراژ پایانی فیلم است، ترانه‌ای که تمام کلماتش از عبارت‌هایی تشکیل"}, {"source": "BBC Persian", "title": "روایت فقر با چند تخم‌مرغ؛ «خوشحالم، اعتراض هم ندارم»", "link": "https://www.bbc.com/persian/articles/c5yl69m0rnqo?at_medium=RSS&at_campaign=rss", "summary": "این روزها چند تخم‌مرغ در یک کیسه پلاستیکی، فراتر از یک خرید روزمره معنا پیدا کرده است. در حالی که گرانی و کاهش قدرت خرید زندگی میلیون‌ها ایرانی را تحت فشار قرار داده، کاربران شبکه‌های اجتماعی با نمایش چند دانه تخم‌مرغ، فاکتورهای خرید و روایت‌های شخصی از دشواری معیشت، زبان تازه‌ای برای بیان اعتراض پیدا کرده‌اند؛ اعتراضی که در بستر نگرانی از پیامدهای اجتماعی فقر و محدود شدن دسترسی به اطلاعات، شکل و معنایی متفاوت به خود گرفته است.", "date_str": "2026-09-16T04:25:13+00:00", "hash": "4a57dc19090276fc", "title_fa": "روایت فقر با چند تخم‌مرغ؛ «خوشحالم، اعتراض هم ندارم»", "summary_fa": "این روزها چند تخم‌مرغ در یک کیسه پلاستیکی، فراتر از یک خرید روزمره معنا پیدا کرده است. در حالی که گرانی و کاهش قدرت خرید زندگی میلیون‌ها ایرانی را تحت فشار قرار داده، کاربران شبکه‌های اجتماعی با نمایش چند دانه تخم‌مرغ، فاکتورهای خرید و روایت‌های شخصی از دشواری معیشت، زبان تازه‌ای برای بیان اعتراض پیدا کرده‌اند؛ اعتراضی که در بستر نگرانی از پیامدهای اجتماعی فقر و محدود شدن دسترسی به اطلاعات، شکل و معنایی متفاوت به خود گرفته است. این روزها «تخم‌مرغ» و اعتراض به هم گره خورده‌اند و به نمادی از کوچک‌تر شدن سفره بسیاری از ایرانی‌ها تبدیل شده‌اند. شماری از کاربران شبکه‌های اجتماعی چند تخم‌مرغ را در یک کیسه پلاستیکی در دست می‌گیرند تا نشان دهند که دیگر حتی توان خرید یک شانه تخم‌مرغ را هم ندارند. آنها در واکنش به افزایش مداوم قیمت کالاهای اساسی، با لحنی طنزآمیز می‌گویند: «از ته شدن فرماندهان را رد کرد؛ ابهام پیرامون نهاد سیاست‌گذار فضای مجازی", "link": "https://www.radiofarda.com/a/iran-internet-whatsapp-cyberspace-governance/33857433.html", "summary": "اظهارات وزیر ارتباطات درحالی مطرح می‌شود که بحث درباره پیام‌رسان‌های خارجی بار دیگر بالا گرفته و جایگاه نهاد اصلی سیاست‌گذاری فضای مجازی در ایران نیز در هاله‌ای از ابهام قرار دارد.", "date_str": "2026-09-16T10:56:40+00:00", "hash": "b2ccacf0bd9ff66d", "title_fa": "وزیر ارتباطات نقش واتس‌اپ در کشته شدن فرماندهان را رد کرد؛ ابهام پیرامون نهاد سیاست‌گذار فضای مجازی", "summary_fa": "اظهارات وزیر ارتباطات درحالی مطرح می‌شود که بحث درباره پیام‌رسان‌های خارجی بار دیگر بالا گرفته و جایگاه نهاد اصلی سیاست‌گذاری فضای مجازی در ایران نیز در هاله‌ای از ابهام قرار دارد. وزیر ارتباطات ایران بار دیگر ادعاها دربارهٔ نقش اینترنت و پیام‌رسان واتس‌اپ در کشته شدن فرماندهان نظامی و مقامات جمهوری اسلامی را رد کرد و گفت شماری از چهره‌های امنیتی در مقاطعی هدف قرار گرفتند که اینترنت نیز قطع بود. ستار هاشمی روز چهارشنبه ۲۵ شهریور با رد ادعاهای مطرح‌شده توسط برخی مقامات و رسانه‌های حکومتی در این باره گفت: «مسائل پیچیدهٔ امنیتی را نمی‌توان صرفاً به اینترنت و پیام‌رسان‌ها نسبت داد.» اظهارات وزیر ارتباطات در حالی مطرح می‌شود که بحث دربارهٔ استفاده از پیام‌رسان‌های خارجی پس از تصمیم تازهٔ «ستاد ویژه ساماندهی و راهبری فضای مجازی» بار دیگر بالا گرفته است و جایگاه نهاد اصلی سیاست‌گذاری فضای مجازی در جمهوری اسلامی نیز در هاله‌ای از ابهام قرار دارد. ستاد ویژه روز ۱۵ شهریور ممنوعیت اطلاع‌رسانی دستگاه‌های اجرایی در پیام‌رسان‌های غیربومی را لغو کرد. مقام‌های دولت گفتند این تصمیم با هدف حضور مستقیم دستگاه‌های دولتی در «سکوهای محل حضور مردم» و پاسخ‌گویی گرفته شده است. با این حال، این تصمیم با اعتراض برخی مخالفان رفع محدودیت‌های اینترنت روبه‌رو شد و دو روز بعد سؤال گروهی از نمایندگان مجلس از وزیر ارتباطات دربارهٔ «علت رفع فیلتر پیام‌رسان واتس‌اپ» اعلام وصول شد. نقش احتمالی واتس‌اپ و دیگر ابزارهای ارتباطی خارجی در شناسایی و هدف قرار دادن مقامات و فرماندهان جمهوری اسلامی پیشتر نیز از سوی برخی چهره‌های حکومتی مطرح شده بود. غلامرضا جلالی، رئیس سازمان پدافند غیرعامل، پیشتر مدعی شده بود واتس‌اپ در «مکان‌یابی و ترور بعضی از فرماندهان» نقش داشته است. او استفاده از این پیام‌رسان و فناوری‌های ارتباطی را یکی از راه‌های احتمالی جمع‌آوری اطلاعات دربارهٔ مقام‌ها و فرماندهان معرفی کرده بود."}, {"source": "Radio Farda", "title": "عفو بین‌الملل خواستار تحقیقات کیفری درباره جنایات سرکوبگران جنبش «زن زندگی آزادی» شد", "link": "https://www.radiofarda.com/a/amnesty-international-report-marking-anniversary-of-life-women-freedom-protests/33855845.html", "summary": "عفو بین‌الملل در چهارمین سالگرد جنبش «زن زندگی آزادی» در گزارشی هزارصفحه‌ای ۸۷مقام جمهوری اسلامی دخیل در سرکوب اعتراضات را شناسایی کرده و خواستار تحقیقات کیفری درباره آنان شده است.", "date_str": "2026-09-16T09:03:38+00:00", "hash": "66856209a6ada6f3", "title_fa": "عفو بین‌الملل خواستار تحقیقات کیفری درباره جنایات سرکوبگران جنبش «زن زندگی آزادی» شد", "summary_fa": "عفو بین‌الملل در چهارمین سالگرد جنبش «زن زندگی آزادی» در گزارشی هزارصفحه‌ای ۸۷مقام جمهوری اسلامی دخیل در سرکوب اعتراضات را شناسایی کرده و خواستار تحقیقات کیفری درباره آنان شده است. سازمان عفو بین‌الملل در گزارشی هزارصفحه‌ای دربارهٔ سرکوب اعتراضات «زن زندگی آزادی»، ۸۷ مقام جمهوری اسلامی را از عالی‌ترین سطوح حکومت تا فرماندهان محلی در زنجیرهٔ فرماندهی سرکوب‌ها شناسایی و مستند کرده و خواستار تحقیقات کیفری دربارهٔ نقش آن‌ها در «جنایات علیه بشریت» شده است. عفو بین‌الملل تأکید دارد: «هزینه تداوم مصونیت از مجازات، ویرانگر بوده است. زمان ایجاد یک سازوکار عدالت کیفری بین‌المللی برای ایران، پیش از وقوع کشتار دیگری در اعتراضات خیلی وقت است که فرا رسیده است.» ا‌ین سازمان حقوق‌بشری، در بیانیه‌ای که روز چهارشنبه ۲۵ شهریور منتشر شد، تأکید کرده است که «معماران جنایات علیه بشریت» در جریان سرکوب این اعتراضات باید در سطح بین‌المللی به‌دست عدالت سپرده شوند تا از کشتارهای بیشتر جلوگیری شود. عفو بین‌الملل عنوان این گزارش تحقیقی را که در چهارمین سالگرد جان باختن مهسا (ژینا) امینی در بازداشت پلیس گشت ارشاد منتشر کرده، «معماران جنایات: دستگاه حکومتی سازمان‌دهندهٔ جنایات علیه بشریت در خیزش زن زندگی آزادی ایران در سال ۱۴۰۱» گذاشته است. در این گزارش تأکید شده که مقام‌های جمهوری اسلامی در جریان سرکوب خونین اعتراضات، جوامع کُرد و بلوچ را نیز به‌شکل ویژه‌ای هدف سرکوب مرگبار قرار دادند و علیه آن‌ها مرتکب «جنایت علیه بشریت و آزار و ستم» شدند. [عفو بین‌الملل اصطلاح «آزار و ستم» را به عنوان معادل فارسی اصطلاح حقوقی persecution به کار برده که به طور معمول در زبان فارسی با عناوینی چون «آزار و اذیت» یا «آزار و تعقیب» ترجمه می‌شود.] فهرست افراد دخیل در سرکوب اعتراضات ۱۴۰۱ که عفو بین‌الملل می‌گوید هنوز «جامع» نیست، از عالی‌ترین سطوح دستگاه امنیتی جمهوری اسلامی ایران تا مقام‌هایی را در بر می‌گیرد که در سطح استان و شهرستان"}, {"source": "Radio Farda", "title": "معاون رئیس‌جمهور آمریکا: جنگ ایران در ماه‌های آینده وارد مرحله متفاوتی می‌شود", "link": "https://www.radiofarda.com/a/vance-says-the-war-with-iran-will-enter-a-different-phase-over-the-next-two-months-/33857265.html", "summary": "معاون رئیس جمهور آمریکا می‌گوید آمریکا در حال حاضر درگیر یک عملیات تهاجمی با ایران نیست، و ایرانی‌ها گاهی به کشتی‌های تجاری شلیک می‌کنند که «معمولاً هم موفقیت‌آمیز نیست».", "date_str": "2026-09-16T07:25:45+00:00", "hash": "b40fde89200482c5", "title_fa": "معاون رئیس‌جمهور آمریکا: جنگ ایران در ماه‌های آینده وارد مرحله متفاوتی می‌شود", "summary_fa": "معاون رئیس جمهور آمریکا می‌گوید آمریکا در حال حاضر درگیر یک عملیات تهاجمی با ایران نیست، و ایرانی‌ها گاهی به کشتی‌های تجاری شلیک می‌کنند که «معمولاً هم موفقیت‌آمیز نیست». معاون رئیس‌جمهور آمریکا می‌گوید جنگ ایالات متحده با جمهوری اسلامی طی ماه‌های آینده وارد مرحله «کاملاً متفاوتی» می‌شود. جی‌دی ونس در گفت‌وگویی اختصاصی با روزنامه نیویورک‌پست که روز سه‌شنبه، ۲۴ شهریور منتشر شد، با اشاره به اظهارات دونالد ترامپ، رئیس‌جمهور آمریکا، مبنی بر پایان یافتن جنگ با ایران پس از انتخابات میان‌دوره‌ای آمریکا، گفت: «ما نمی‌توانیم آینده را پیش‌بینی کنیم، اما فکر می‌کنم رئیس‌جمهوری درست می‌گوید که این مسئله طی یکی دو ماه آینده وارد مرحله‌ای کاملاً متفاوت خواهد شد.» او افزود که ترامپ «همچنین فرمانده کل قوا است و بنابراین این او است که تعیین می‌کند درگیری‌ها چه زمانی آغاز شوند و چه زمان ن ادعای حوثی‌ها را تأیید نکرده‌اند. این ادعا ساعاتی پس از آن مطرح شد که ائتلاف تحت رهبری عربستان اعلام کرد پدافند هوایی این کشور روز سه‌شنبه یک پهپاد حوثی را در جنوب مکه و پیش از ورود آن به حریم هوایی ممنوعهٔ این شهر رهگیری و منهدم کرده است. ترکی المالکی، سخنگوی ائتلاف، امنیت مکه و مدینه و زائران را «خط قرمز» خواند و گفت ائتلاف برای بازدارندگی در برابر حملات حوثی‌ها اقدامات لازم را انجام خواهد داد. حوثی‌ها هدف قرار دادن مکه یا دیگر اماکن مقدس را رد کرده و گفته‌اند هدف حملات آن‌ها تأسیسات نفتی و پایگاه‌های نظامی عربستان است. این تحولات پس از چند روز حملات موشکی و پهپادی حوثی‌ها به خاک عربستان رخ می‌دهد. مقام‌های سعودی می‌گویند در یکی از حملات اخیر به یک پایگاه هوایی در جنوب این کشور ۱۳ غیرنظامی زخمی شدند. تشدید رویارویی عربستان و حوثی‌ها هم‌زمان با تغییراتی مهم در میدان جنگ داخل یمن رخ داده است. حوثی‌ها طی روزهای گذشته در ساحل غربی یمن پیشروی کرده و چند جزیره در جنوب دریای سرخ را نیز تصرف کرده‌اند. نیروهای دولت یمن که مورد حمایت عربستان هستند، در واکنش ضدحمله‌ای را آغاز کرده‌اند. سازمان ملل روز"}],
      tech: [{"source": "MIT AI", "title": "Measure by measure, studying society accurately", "link": "https://news.mit.edu/2026/studying-society-accurately-naoki-egami-0916", "summary": "Let’s agree at the outset the world is a complicated place, and social scientists have exacting jobs when it comes to measuring civic phenomena with precision. After all, even careful studies raise follow-up questions: How much do their findings apply in other settings? Do conclusions about politics in one country apply to other countries? If you’re studying voters in a lopsided election, will your findings apply to voters in a close election? Those questions are all a natural part of the research process. That’s where Naoki Egami comes in. Egami is an MIT political scientist whose specialty is the methodology of research. He carefully scrutinizes, for one thing, what social scientists call “external validity,” whether the results of particular studies apply more generally. “I always say political methodology is the field where you ask questions as a political scientist, but then you solve them like an applied statistician or an applied computer scientist,” Egami says. “You find out the underlying mathematical problems behind the empirical challenges people face, and solve them optimally.” As it happens, Egami’s interests range widely. Years ago, before the current artificial intelligence craze, he started studying what happens when AI tools are introduced into studies. How accurate are they? How can researchers account for AI tendencies? Focusing on these and other questions has helped Egami build a broad portfolio of research, win awards, and flourish in his career. All the while, he retains interest in basic questions about politics, as well as measuring things correctly. “You need both perspectives,” Egami says. “If you only think about technical statistical theories, you might not work on interesting empirical problems sometimes. But if you only think about problems, you won’t really solve them optimally; you’ll solve them in an ad-hoc way. So, you really want to have both lenses.” Egami joined MIT’s Department of Political Science as an associate professor with tenure in 2025. He is also a faculty affiliate of the Statistics and Data Science Center at the Institute for Data, Systems, and Society (IDSS). Workshopping his career Almost anyone who likes their job has experienced some good fortune in finding it. Egami’s case calls to mind those adages about luck being a mixture of preparation and opportunity. Egami grew up in Tokyo and attended the University of Tokyo. He was good at math and physics, but he also liked political philosophy and was unsure", "date_str": "2026-09-16T04:00:00+00:00", "hash": "c2289c740ed3a4b5", "title_fa": "اندازه گیری با اندازه گیری، مطالعه دقیق جامعه", "summary_fa": "بیایید در ابتدا قبول کنیم که جهان مکانی پیچیده است و دانشمندان علوم اجتماعی در مورد اندازه‌گیری دقیق پدیده‌های مدنی کارهای سختی دارند. به هر حال، حتی مطالعات دقیق، سؤالات بعدی را ایجاد می کند: یافته های آنها چقدر در سایر تنظیمات اعمال می شود؟ آیا نتیجه گیری در مورد سیاست در یک کشور در مورد سایر کشورها نیز صدق می کند؟ اگر در حال مطالعه رای‌دهندگان در یک انتخابات کج‌رو هستید، آیا یافته‌های شما برای رای‌دهندگان در یک انتخابات نزدیک اعمال می‌شود؟ این سوالات همگی بخشی طبیعی از فرآیند تحقیق هستند. اینجاست که نائوکی اگامی وارد می شود. اگامی یک دانشمند علوم سیاسی MIT است که تخصص او روش شناسی تحقیق است. او به دقت آنچه را که دانشمندان علوم اجتماعی «اعتبار خارجی» می‌نامند، بررسی می‌کند، اینکه آیا نتایج مطالعات خاص به‌طور کلی‌تر کاربرد دارند یا خیر. ایگامی می‌گوید: «من همیشه می‌گویم روش‌شناسی سیاسی حوزه‌ای است که شما به‌عنوان یک دانشمند علوم سیاسی در آن سؤال می‌پرسید، اما سپس مانند یک آمارگیر کاربردی یا یک دانشمند کامپیوتر کاربردی آن‌ها را حل می‌کنید. \"شما مشکلات ریاضی اساسی را در پشت چالش های تجربی که مردم با آن روبرو هستند، پیدا می کنید و آنها را به طور بهینه حل می کنید.\" همانطور که اتفاق می افتد، علایق Egami به طور گسترده ای متفاوت است. سال‌ها پیش، قبل ents coordinated to breach their supposedly secure sandbox, get on the Internet and hack AI platform Hugging Face, warrants urgent action. It demonstrated the ease with which the technology can evade human control and gave concrete form to the existential fears about what it could do to humanity if not securely leashed. Continue reading...", "date_str": "2026-09-16T11:00:18+00:00", "hash": "0885f2db0360d099", "title_fa": "اجازه دادن به شرکت‌های هوش مصنوعی برای تبانی برای «پیش‌رفت از مرز» یک پیشنهاد خطرناک است", "summary_fa": "به هم پیوستن مدیران عامل فناوری یک ترفند قدیمی است که از شرکت های آمریکایی بازیافت شده است تا از قوانین ضد انحصار استفاده کنند. داریو آمودی از Anthropic اولین مدیر عامل شرکتی نیست که پیشنهاد می کند رقابت بیش از حد جهان را به سوی برخی از نتایج نامطلوب اجتماعی سوق می دهد. نقض ایمنی فاش شده توسط OpenAI پس از انبوهی از عوامل آن که برای نقض جعبه ایمنی ظاهراً امن آنها، ورود به اینترنت و هک پلتفرم هوش مصنوعی Hugging Face هماهنگ شدند، اقدامات فوری را تضمین می کند. این فناوری سهولتی را نشان داد که با آن فناوری می‌تواند از کنترل انسان فرار کند و شکل مشخصی به ترس‌های وجودی در مورد اینکه اگر به طور ایمن مهار نشود، می‌تواند برای بشریت انجام دهد، داد. به خواندن ادامه دهید... همانطور که برخی در صنعت هوش مصنوعی هشدار داده اند، ممکن است پایان جهان نزدیک باشد. این روزها واقعاً ترسناک است. اما فراخوان آمودی از آزمایشگاه‌های پیشرو هوش مصنوعی برای هماهنگی برای کاهش سرعت سرسام‌آور توسعه هوش مصنوعی، توافق بر سر استانداردهای ایمنی و «پیش‌روی در مرز» (فراخوانی که به سرعت توسط سم آلتمن، ایلان ماسک و دمیس حسابیس از هوش مصنوعی Open AI تأیید شد) تنها نسخه پیشرفته‌ای از یک پیشنهاد قدیمی آمریکایی است که از یک قانون ضد آمریکایی برای حمایت از قانون طراحی شده است. کسب و کارهای تبانی پیشنهاد خطرناکی است. آزاد کردن برادران فناوری از محدودیت‌های ضد انحصاری که ظاهراً به آنها اجازه می‌دهد دور هم جمع شوند و نقص‌های خطرناک هوش مصنوعی را برطرف کنند، آمریکایی‌های روزمره را که بیشتر در معرض خطر این موضوع هستند، محروم می‌کند و به آزمایشگاه‌هایی قدرت می‌دهد که در جستجوی ثروت، عظمت و چه کسی می‌دانند که چه ابعاد خارق‌العاده‌ای دیگری را به دنبال دارد. وجود تهدیدات وجودی"}, {"source": "The Guardian AI", "title": "Scotland imposes mandatory environmental assessments on new datacentres", "link": "https://www.theguardian.com/uk-news/2026/sep/16/datacentres-scotland-environmental-assessments-ai-boom", "summary": "Government announces before vote on moratorium that any projects above 50MW must submit assessments in planning process Large-scale datacentres will face mandatory environmental assessments before they can go ahead, the Scottish government has announced, amid growing public concern about the impact of the AI boom. Ahead of a vote on a moratorium on new hyperscale datacentres in Holyrood on Wednesday, the Scottish government has tightened rules for new projects by requiring any above 50MW to submit environmental impact assessments, but stopped short of agreeing to an outright halt. Continue reading...", "date_str": "2026-09-16T11:55:33+00:00", "hash": "82c4972575f6b663", "title_fa": "اسکاتلند ارزیابی های زیست محیطی اجباری را بر روی مراکز داده جدید تحمیل می کند", "summary_fa": "دولت اسکاتلند در بحبوحه نگرانی فزاینده عمومی در مورد تأثیر رونق هوش مصنوعی اعلام کرده است که دولت قبل از رأی گیری در مورد تعلیق اعلام می کند که هر پروژه ای با ظرفیت بالای 50 مگاوات باید در فرآیند برنامه ریزی ارزیابی کند. پیش از رای‌گیری در مورد تعلیق مراکز داده جدید فوق‌مقیاس در هولیرود در روز چهارشنبه، دولت اسکاتلند قوانین را برای پروژه‌های جدید با الزام هر بیش از 50 مگاوات برای ارائه ارزیابی‌های اثرات زیست‌محیطی سخت‌تر کرد، اما با توقف کامل موافقت نکرد. به خواندن ادامه دهید... با افزایش سرمایه گذاری جهانی در زیرساخت های هوش مصنوعی، اسکاتلند شاهد رونق برنامه ریزی برنامه های کاربردی برای مراکز داده بزرگ بوده است. مراکز داده برای ذخیره و پردازش داده های مورد استفاده توسط هوش مصنوعی حیاتی هستند. یک طرح در Auchtertool، فایف، به عنوان دومین طرح بزرگ در جهان اعلام شده است و در میان بیش از 20 مرکز داده بزرگ پیشنهاد شده تا کنون قرار دارد. کمپین‌ها نگرانی‌هایی را در مورد مصرف آب و انتشار کربن از مراکز داده بزرگ مطرح کرده‌اند و این سوال را مطرح کرده‌اند که آیا اسکاتلند ظرفیت مقابله با انفجار ناشی از تقاضای انرژی را دارد یا خیر. سبزهای اسکاتلند پیشنهادی را برای روز چهارشنبه ارائه کرده‌اند و خواستار توقف پروژه‌های جدید «تا زمانی که یک استراتژی ملی و دستورالعمل‌های برنامه‌ریزی به‌روز ارائه شود، که تأثیرات انباشته بر تقاضای انرژی و محیط‌زیست را در نظر بگیرد» ارائه کرده‌اند. در این ماه، صدها نفر از گروه‌های اجتماعی در خارج از Holyrood علیه ساخت مراکز داده بزرگ برای هوش مصنوعی اعتراض کردند تا زمانی که قوانین برنامه‌ریزی واضح و تعریف مرکز داده «سبز» رسمی شود."}, {"source": "The Guardian AI", "title": "Mirror publisher to cut 220 editorial jobs as readers turn to AI summaries", "link": "https://www.theguardian.com/business/2026/sep/16/mirror-publisher-reach-cuts-editorial-jobs-ai-summaries-google", "summary": "Reach, which also owns Express, makes decision because of ‘mammoth shift’ in how audiences seek out content The publisher of the Mirror and Express newspapers is to cut a further 220 editorial jobs as it adapts to a dramatic fall in online traffic while readers increasingly turn to summaries generated by artificial intelligence. Reach, which also owns scores of online brands and regional titles including the Manchester Evening News, the Birmingham Mail and the Liverpool Echo, said the latest cuts were necessary to cope with a “mammoth shift” in how audiences seek out content. Continue reading...", "date_str": "2026-09-16T11:08:33+00:00", "hash": "5ab9e06e2eabdef2", "title_fa": "ناشر Mirror 220 شغل تحریریه را با توجه خوانندگان به خلاصه های هوش مصنوعی کاهش می دهد", "summary_fa": "ریچ، که مالک Express نیز هست، به دلیل «تغییر بزرگ» در نحوه جستجوی محتوا توسط مخاطبان تصمیم می‌گیرد. ناشر روزنامه‌های میرور و اکسپرس قرار است ۲۲۰ شغل سردبیری دیگر را به دلیل انطباق با کاهش چشمگیر ترافیک آنلاین کاهش دهد در حالی که خوانندگان به طور فزاینده‌ای به خلاصه‌های تولید شده توسط هوش مصنوعی روی می‌آورند. ریچ که همچنین صاحب تعداد زیادی برند آنلاین و عناوین منطقه ای از جمله Manchester Evening News، Birmingham Mail و Liverpool Echo است، گفت که آخرین کاهش ها برای مقابله با \"تغییر بزرگ\" در نحوه جستجوی محتوا توسط مخاطبان ضروری است. به خواندن ادامه دهید... این حرکت نشان دهنده آخرین تغییر ساختار توسط ناشر است که در ماه سپتامبر 600 نقش را در معرض خطر قرار داد و در نهایت بیش از 300 شغل سردبیر را کاهش داد. ریچ روز چهارشنبه اعلام کرد که تصمیم به بستن سه برند آنلاین خود - KentLive، AberdeenLive و GalwayBeo - گرفته است، زیرا آنها نتوانستند \"ناشر غالب\" در منطقه خود باشند. به عنوان بخشی از بازسازی، حدود 60 نقش تحریریه نیز \"برای افزایش درآمد دیجیتال\" در این گروه ایجاد خواهد شد، که همچنین صاحب Daily Star و Daily Record است. این شرکت در اوایل سال جاری اعلام کرد که کاهش بازدید کلی صفحات دیجیتال به دلیل کاهش 46 درصدی ترافیک سال به سال از سوی گوگل بوده است، زیرا ویژگی هایی مانند حالت هوش مصنوعی گوگل و مرورهای هوش مصنوعی نیاز خوانندگان به کلیک کردن بر روی وب سایت های آن را نافی می کند. دیوید هیگرسون، مدیر ارشد محتوا در Reach، در یادداشتی به کارکنان در روز چهارشنبه گفت: «ما در میانه یک تغییر بزرگ در مورد اینکه مخاطبان چگونه محتوا و روزنامه‌نگاری می‌خواهند، هستیم. \"برای اطمینان از آینده ای پایدار برای روزنامه نگاری خود، ما باید سرمایه گذاری خود را در مناطقی متمرکز کنیم که"}, {"source": "The Guardian AI", "title": "‘If you’re building Frankenstein, stop’: JD Vance dismisses calls for AI regulation", "link": "https://www.theguardian.com/technology/2026/sep/16/building-frankenstein-jd-vance-dismisses-ai-regulation", "summary": "US vice-president’s comments come as former Anthropic researcher revisits recent claim AI could destroy humanity The US vice-president has dismissed calls for global regulation of AI safety risks, telling companies creating the most advanced models: “If you’re building Frankenstein, stop.” In remarks addressed towards Dario Amodei, the co-founder of Anthropic who has called on Washington DC to coordinate control of AI systems , including with China, JD Vance said: “If you’re gonna create Frankenstein, don’t come to the government and say we need regulation.” Continue reading...", "date_str": "2026-09-16T10:42:07+00:00", "hash": "347e866761abfae0", "title_fa": "\"اگر در حال ساختن فرانکشتاین هستید، متوقف شوید\": جی دی ونس درخواست ها برای مقررات AI را رد می کند", "summary_fa": "اظهارات معاون رئیس‌جمهور ایالات متحده در حالی است که محقق سابق Anthropic ادعای اخیر خود را تکرار می‌کند که هوش مصنوعی می‌تواند بشریت را نابود کند، معاون رئیس‌جمهور ایالات متحده درخواست‌ها برای مقررات جهانی خطرات ایمنی هوش مصنوعی را رد کرده و به شرکت‌هایی که پیشرفته‌ترین مدل‌ها را ایجاد می‌کنند، گفته است: «اگر در حال ساخت فرانکشتاین هستید، متوقف شوید.» جی دی ونس در سخنانی خطاب به داریو آمودی، یکی از بنیانگذاران Anthropic که از واشنگتن دی سی خواسته است تا کنترل سیستم‌های هوش مصنوعی از جمله با چین را هماهنگ کند، گفت: «اگر می‌خواهید فرانکشتاین را ایجاد کنید، به دولت نیایید و نگویید ما به مقررات نیاز داریم.» به خواندن ادامه دهید... او گفت که روسای فناوری باید در عوض: \"به درون خود نگاه کنند و بپذیرند که اگر در حال ساختن فرانکشتاین، شماره 1 هستید، باید متوقف شوید و شماره 2، وقتی شرکت ها به سراغ شما می آیند و می گویند: \"ما به ابزارهایی برای مقابله با فرانکنشتاین نیاز داریم\"، این ابزارها را به آنها بدهید.\" ونس در یک نشست هوش مصنوعی در لس آنجلس پس از یک هفته افزایش نگرانی جهانی در مورد خطرات ناشی از چشم انداز ایجاد یک ابر هوش مصنوعی، فناوری که هنوز وجود ندارد، برای بشریت صحبت می کرد. آمودی روز شنبه هشدار داد که سرعت افزایش قابلیت‌ها به این معنی است که انبوهی از عوامل هوش مصنوعی «می‌توانند کل اینترنت را در مدت 6 تا 12 ماه تصاحب کنند». اگرچه بسیاری در این ادعا تردید دارند، اما به پیشنهاد ایوان هوبینگر، سرپرست علم همسویی Anthropic، مبنی بر اینکه بیش از 10 درصد احتمال دارد هوش مصنوعی بتواند همه انسان ها را در عرض 10 سال بکشد، بیشتر شد. او در پاسخ به محققی به نام جیکوب کاکسون بود که با هشداری مشابه آنتروپیک را ترک کرد. سه‌شنبه شب، کاکسون پیش‌بینی اصلاح‌شده‌ای"}, {"source": "The Guardian AI", "title": "The US government is failing Americans on AI | Shakeel Hashim", "link": "https://www.theguardian.com/technology/2026/sep/16/us-government-failing-americans-ai", "summary": "Trump and Republicans want companies to regulate themselves. It’s a dereliction of duty that will make AI less safe It is hard to get Sam Altman, Elon Musk and Dario Amodei to agree on much. But over the weekend, all three AI company CEOs called for AI development to slow down in the face of growing, alarming risks. Their employees are sounding the siren too, with one researcher publicly quitting and accusing OpenAI and Anthropic of “gambling with our lives”. The combination of dire warnings from insiders and growing real-world evidence of rogue AIs should, in a sane world, lead to government action. Instead, Donald Trump and the Republican leadership have their heads in the sand. Continue reading...", "date_str": "2026-09-16T10:00:18+00:00", "hash": "402fb425ebf1c419", "title_fa": "دولت آمریکا آمریکایی ها را در زمینه هوش مصنوعی شکست می دهد | شکیل هاشم", "summary_fa": "ترامپ و جمهوری‌خواهان می‌خواهند شرکت‌ها خودشان را تنظیم کنند. این یک سرکشی از وظیفه است که هوش مصنوعی را کمتر ایمن می کند. سخت است که سم آلتمن، ایلان ماسک و داریو آمودی در مورد چیزهای زیادی به توافق برسند. اما در آخر هفته، هر سه مدیر عامل شرکت هوش مصنوعی خواستار کاهش سرعت توسعه هوش مصنوعی در مواجهه با خطرات هشدار دهنده و رو به رشد شدند. کارمندان آن‌ها نیز آژیر را به صدا در می‌آورند، به طوری که یکی از محققین علناً دست از کار می‌کشد و OpenAI و Anthropic را به «قمار بازی با زندگی ما» متهم می‌کند. ترکیبی از هشدارهای وحشتناک از سوی خودی ها و شواهد رو به رشد در دنیای واقعی از هوش مصنوعی سرکش باید در دنیای عاقلانه منجر به اقدام دولت شود. در عوض، دونالد ترامپ و رهبری جمهوری خواهان سرشان در خاک است. به خواندن ادامه دهید... به سختی می توانم سم آلتمن، ایلان ماسک و داریو آمودی را به توافق برسانیم. اما در آخر هفته، هر سه مدیر عامل شرکت هوش مصنوعی خواستار کاهش سرعت توسعه هوش مصنوعی در مواجهه با خطرات هشدار دهنده و رو به رشد شدند. کارمندان آن‌ها نیز آژیر را به صدا در می‌آورند، به طوری که یکی از محققین علناً دست از کار می‌کشد و OpenAI و Anthropic را به «قمار بازی با زندگی ما» متهم می‌کند. روز یکشنبه، ترامپ نگرانی‌های صنعت را رد کرد و «نیروهای بسیار منفی» را به «طرح نگرانی‌های اغراق‌آمیز» متهم کرد. در همین حال، مایک جانسون، رئیس مجلس نمایندگان، تصریح کرد که کنگره به این زودی ها اقدام نخواهد کرد. «آنها می توانند خود پلیس باشند. آنها می توانند خود را تنظیم کنند.» او گفت، هرگز به این واقعیت اهمیت ندهید که کسانی که مرز را پیش می برند، التماس قانون می کنند. دولت ترامپ و جمهوری خواهان با ناتوانی"}, {"source": "The Guardian AI", "title": "The Spin | Robots bowling the perfect doosra are some way off but AI is already reshaping cricket", "link": "https://www.theguardian.com/sport/2026/sep/16/robots-bowling-the-perfect-doosra-are-some-way-off-but-ai-is-already-reshaping-cricket-in-myriad-ways", "summary": "Artificial intelligence is not replacing the player, coach or analyst, but it is certainly allowing them to do more Daniel Kokotajlo, a former researcher at OpenAI, warned last week that it was possible we would end up “creating a new species that ends up ruling the world” . Once the initial shock wore off, and I’d considered what this could mean for my young children and the future of the planet, another thought popped into my head: will this new species be able to swing an old cricket ball or navigate a seaming green top? It sounds frivolous. It is frivolous. But the question is not quite as ridiculous as it first appears. Continue reading...", "date_str": "2026-09-16T09:30:15+00:00", "hash": "6f9dae6d01e62bb1", "title_fa": "چرخش | ربات هایی که بولینگ دوسرای عالی را انجام می دهند تا حدودی دور هستند، اما هوش مصنوعی در حال حاضر در حال تغییر شکل کریکت است", "summary_fa": "هوش مصنوعی جای بازیکن، مربی یا تحلیلگر را نمی گیرد، اما مطمئناً به آنها اجازه می دهد کارهای بیشتری انجام دهند دانیل کوکوتاجلو، محقق سابق OpenAI، هفته گذشته هشدار داد که ممکن است در نهایت \"گونه جدیدی ایجاد کنیم که در نهایت بر جهان حکمرانی کند\". هنگامی که شوک اولیه از بین رفت، و به این فکر کردم که این می تواند چه معنایی برای فرزندان خردسالم و آینده این سیاره داشته باشد، فکر دیگ s need to “slow” the pace at which they’re developing the newest and most sophisticated AI models. Lucy Letby | Three babies might have survived if hospital had acted upon concerns over Lucy Letby, an inquiry has found . Lady Justice Thirlwall condemned the ‘complete failure’ to protect babies on neonatal unit at Countess of Chester hospital. UK politics | The leader of Reform UK in Wales stood down after arrest on suspicion of assault . Dan Thomas, a former Tory councillor, was elected to Senedd as leader of the opposition in May. AI | The progressive senator Bernie Sanders and rightwing strategist Steve Bannon have called for restrictions on artificial intelligence (AI) but offered competing visions for what they termed a “cold war” with China. UK news | Young people in Rotherham face a local jobs market with the fewest suitable opportunities in Britain, according to a report that warns stark regional divisions are fuelling a crisis in youth work. Defence | John Healey is in talks with the Canadian government about joining a new global defence bank intended to help allies rearm to counter mounting security threats, just weeks after Rachel Reeves rejected the move. Continue reading...", "date_str": "2026-09-16T05:45:20+00:00", "hash": "e693ae9640063948", "title_fa": "جلسه توجیهی چهارشنبه: چرا شرکت های فناوری ممکن است آنقدر خوشحال باشند که ما باور کنیم هوش مصنوعی «همه ما را خواهد کشت»", "summary_fa": "صبح بخیر به عنوان یک قاعده کلی، مشکوک بودن به هر شرکت غول پیکری که ادعا می کند در حال توسعه ابزاری است که قادر به نابود کردن بشریت است، سودمند است. اما در روزهای اخیر، تعدادی از هشدارها از سوی صنعت هوش مصنوعی حاکی از آن است که حتی خودی‌های فناوری شروع به نگرانی در مورد آنچه که منتشر کرده‌اند، شده‌اند. داریو آمودی، بنیانگذار Anthropic (شرکتی که در پشت کلود قرار دارد)، در مقاله‌ای برجسته که روز شنبه منتشر شد، استدلال کرد که شرکت‌های فناوری باید سرعت توسعه جدیدترین و پیچیده‌ترین مدل‌های هوش مصنوعی را کاهش دهند. ایلان ماسک و سام آلتمن، رئیس OpenAI، از استدلال های آمودی حمایت کردند، در حالی که دونالد ترامپ، که اقتصاد آمریکا را در مورد هوش مصنوعی به خطر انداخته است، این نگرانی ها را یک \"حقوق\" توصیف کرد و تاکید کرد که تنها کنترل هوش مصنوعی که جهان به آن نیاز دارد، \"رئیس جمهور قوی و باهوش (با بهره هوشی بالا!)\" است. دیروز، زمانی که لوئیز هیگ، وزیر امور خارجه اول، گفت که بریتانیا باید به هشدارهای کارشناسان هوش مصنوعی توجه کند، دولت بریتانیا موضع محتاطانه‌تری اتخاذ کرد. لوسی لتبی | تحقیقات نشان می‌دهد که اگر بیمارستان به نگرانی‌های مربوط به لوسی لتبی عمل می‌کرد، ممکن بود سه نوزاد زنده بمانند. لیدی قاضی تیرلوال \"شکست کامل\" در محافظت از نوزادان در بخش نوزادان در بیمارستان کنتس چستر را محکوم کرد. سیاست انگلستان | رهبر Reform UK در ولز پس از دستگیری به ظن حمله از سمت خود کنار رفت. دن توماس، مشاور سابق حزب محافظه کار، در ماه می به عنوان رهبر اپوزیسیون انتخاب شد. هوش مصنوعی | برنی سندرز، سناتور مترقی و استیو بنن، استراتژیست دست راستی، خواستار محدودیت در هوش مصنوعی (AI) شده‌اند، اما دیدگاه‌های رقابتی برای آنچه «جنگ سرد» با چین نامیدند، ارائه کردند."}, {"source": "The Guardian AI", "title": "Anthropic lands deal in $31bn datacentre in western Queensland, David Crisafulli says", "link": "https://www.theguardian.com/technology/2026/sep/16/anthropic-lands-31bn-datacentre-deal-in-western-queensland", "summary": "Premier describes deal as ‘major win’ that will deliver more jobs for the state and put more energy into its grid Follow our Australia news live blog for latest updates Get our breaking news email , free app or daily news podcast Anthropic, the AI company behind the large language model Claude , has done a deal to lease the site of its first Australian datacentre in western Queensland. The $31.9bn datacentre will be the largest of its kind in Australia, according to planning documents. Continue reading...", "date_str": "2026-09-16T05:20:00+00:00", "hash": "ae0cd22c67fc3e46", "title_fa": "دیوید کریسافولی می گوید: قرارداد زمین های Anthropic در مرکز داده 31 میلیارد دلاری در غرب کوئینزلند", "summary_fa": "پریمیر این قرارداد را به‌عنوان «پیروزی بزرگ» توصیف می‌کند که مشاغل بیشتری را برای ایالت به ارمغان می‌آورد و انرژی بیشتری را در شبکه آن صرف می‌کند برای آخرین به‌روزرسانی‌ها وبلاگ اخبار استرالیا را دنبال کنید. بر اساس اسناد برنامه ریزی، این مرکز داده 31.9 میلیارد دلاری بزرگترین مرکز داده در نوع خود در استرالیا خواهد بود. ادامه خواندن... دیوید کریسافولی، نخست وزیر ایالت، اعلام کرد که آنتروپیک در اولین مرحله این پروژه در روز چهارشنبه در پارلمان خرید خواهد کرد. کریسافولی به پارلمان گفت که در طی یک ماموریت تجاری با آنتروپیک ملاقات کرده است و توضیح داده است که «چرا کوئینزلند مکانی برای سرمایه‌گذاری، با امنیت انرژی و فرآیند تأیید کارآمد است». او گفت: «تضمین اولین سرمایه‌گذاری عمده آنتروپیک در استرالیا نشان‌دهنده اعتماد گسترده در کوئینزلند است. \"این یک پیروزی بزرگ است که مشاغل بیشتری ایجاد می کند و انرژی بیشتری را در شبکه کوئینزلند می گذارد.\" پارک دیجیتال وسترن داونز پیشنهادی قرار است توسط شرکت سنگاپور Zerra DC در نزدیکی دالبی، در شمال غربی تووومبا ساخته شود و به نیروگاه Braemar متصل شود. اولین مرحله آن قرار است سال آینده افتتاح شود. بر اساس اسنادی که ماه گذشته در شورای منطقه ای وسترن داونز ثبت شد، انتظار می رود این پروژه در چهار مرحله ساخته شود. هنوز باید توسط شورای محلی تصویب شود. بخش Anthropic این پروژه در زمینی به مساحت 725.5 هکتار خواهد بود که در حال حاضر بخشی از آن توسط یک مزرعه اشغال شده است. اندرو اسمیت، شهردار وسترن داونز، گفت که شورا \"فرایند ارزیابی کامل و جامع\" مرکز پیشنهادی را انجام خواهد داد."}, {"source": "The Guardian AI", "title": "Your photos, your words and your work: why is Labor making it easier for AI companies to take them for free? | Holly Rankin", "link": "https://www.theguardian.com/australia-news/commentisfree/2026/sep/16/labor-ai-big-tech-australia-rights-consent-copyright-law-opt-out", "summary": "Every family photo you ever posted would be fair game for AI companies unless you choose to opt out Leaked documents from a government proposal show that the Albanese government is considering reversing the fundamental rights of Australians under copyright law. The proposal refers to an “opt-out model”. This would give AI companies permission to train on the open internet here in Australia. Every family photo you ever posted, every small business website, every website would be fair game for AI companies unless you choose to opt out. Continue reading...", "date_str": "2026-09-16T02:24:48+00:00", "hash": "944fd0b34d1f9dae", "title_fa": "عکس‌ها، حرف‌ها و کار شما: چرا کارگران گرفتن رایگان آن‌ها را برای شرکت‌های هوش مصنوعی آسان‌تر می‌کنند؟ | هالی رنکین", "summary_fa": "هر عکس خانوادگی که تا به حال پست کرده اید، بازی منصفانه ای برای شرکت های هوش مصنوعی خواهد بود، مگر اینکه اسناد فاش شده از یک پیشنهاد دولتی نشان دهد که دولت آلبانی در حال بررسی لغو حقوق اساسی استرالیایی ها بر اساس قانون کپی رایت است. این پیشنهاد به یک \"مدل انصراف\" اشاره دارد. این به شرکت‌های هوش مصنوعی اجازه می‌دهد تا در اینترنت آزاد در استرالیا آموزش ببینند. هر عکس خانوادگی که تا به حال پست کرده اید، هر وب سایت کسب و کار کوچک، هر وب سایتی برای شرکت های هوش مصنوعی بازی عادلانه ای خواهد بود، مگر اینکه شما انتخاب کنید که از آن انصراف دهید. به خواندن ادامه دهید... در حال حاضر، طبق قوانین استرالیا، اگر شرکتی بخواهد از محتوای شما استفاده کند، باید اجازه بگیرد. این پیشنهاد به این معنی است که اینطور نیست. این مسئولیت انصراف را بر عهده فرد می گذارد - از طریق مکانیسمی که هنوز کارایی آن ثابت نشده است. و به شرکت‌های هوش مصنوعی حقوق محتوای شما را می‌دهد تا زمانی که شما نه بگویید. این امر بار قانونی را به دوش افراد می اندازد. این بدان معناست که سیستم حقوقی ما ابتدا در خدمت منافع شرکت‌های هوش مصنوعی است. شرکت‌های هوش مصنوعی برای آموزش مدل‌های خود، میلیاردها محتوا را در سطح جهان جمع‌آوری کرده‌اند. بیش از 200 مورد در سراسر جهان وجود دارد که در آن نویسندگان، روزنامه نگاران، هنرمندان، شرکت های ضبط و ناشران به دنبال اثبات غیرقانونی بودن این آموزش هستند. همین سال گذشته، بریتانیا زمانی که با فشار مشابهی از سوی شرکت‌های هوش مصنوعی مواجه شد، تصمیم گرفت قانون کپی رایت را محکم نگه دارد - هنرمندانی از جمله التون جان، دوآ لیپا و پل مک‌کارتنی یک کمپین ملی را رهبری کردند تا بگویند «هیچ راهی» - و دولت آن‌ها گوش فرا داد. هنرمندان"}, {"source": "The Guardian AI", "title": "Six green card holders in Texas charged in federal crackdown on illegal voting – as it happened", "link": "https://www.theguardian.com/us-news/live/2026/sep/15/supreme-court-mail-ballot-restrictions-midterm-elections-trump-ai-politics-latest-news-updates", "summary": "This live blog is now closed. Sign up for US Breaking News emails Kash Patel , the FBI director, is now testifying before lawmakers on the Senate judiciary committee. A reminder that the last time he appeared before Congress was in May, when he sparred with senators on the appropriations committee and denied – under oath – allegations of excessive drinking and unexplained absences on the job, dismissing them as “baseless” during a fiery congressional hearing. Today’s hearing is also expected to be full of heated exchanges. “Mr Patel is the least qualified and most partisan FBI director in our nation’s history,” said Senator Dick Durbin, the judiciary committee’s top Democrat. “The bureau has been reshaped as a political weapon against President Trump’s political enemies and a shield to protect the president and his MAGA loyalists, not the American people.” Continue reading...", "date_str": "2026-09-16T02:03:49+00:00", "hash": "be2204f2d607b086", "title_fa": "شش دارنده گرین کارت در تگزاس در سرکوب فدرال رای دادن غیرقانونی - همانطور که اتفاق افتاد - متهم شدند", "summary_fa": "رویدادهای کلیدی 12 ساعت قبل خلاصه پایانی 12 ساعت قبل عبدالالسید در غیاب مایک راجرز بر بحث های یک جانبه سنای میشیگان مسلط شد 13 ساعت پیش سناتور کریس ون هولن خواستار \"تدابیر اجباری\" در مورد توسعه هوش مصنوعی شد 14 ساعت پیش ترامپ قصد دارد یک نوع کارت بمب های یک تنی را به اسرائیل بفرستد در بمب های یک تنی که توسط Gazah مخفی شده بودند. دارندگان تگزاس در سرکوب فدرال رای گیری غیرقانونی 17 ساعت پیش ترامپ می گوید مرکز کندی اصلاً بازسازی نمی شود مگر اینکه نام او به یادبود سلف ترور شده 18 ساعت پیش اضافه شود. کمک به پرداخت هزینه عروسی دونالد ترامپ جونیور 19 ساعت پیش، بلانش از انتقاد ترامپ ات امنیتی دقیق‌تر شد. داریو آمودی از یک قیاس خودرویی برای بیان نظر خود استفاده کرد: او در کنفرانس دریم فورس سیلزفورس در روز سه‌شنبه گفت، وقتی یک شرکت خودروسازی رقیب دچار یک حادثه ایمنی مانند خرابی ترمز می‌شود، لحظه‌ای است که همه شرکت‌های خودروسازی باید متوقف شوند و شیوه‌های خود را بررسی کنند. به خواندن ادامه دهید... او گفت: «بسیار وسوسه انگیز است که به رقیب خود حمله کنید و بگویید این بچه ها ناامن هستند. اما من فکر می‌کنم که راه مسئولانه‌تر برای پاسخ به آن این است که بگوییم بیایید به کارنامه خودمان نگاه کنیم. ما ممکن است این حادثه بزرگ و پرمخاطب را نداشته باشیم، اما مطمئنم که کامل نیستیم.» جنسن هوانگ از انویدیا چندی بعد پاسخ داد: «تا می توانید سریع بدوید». Amodei خواستار سه اقدام است: تعبیه ارزیاب های شخص ثالث در شرکت های هوش مصنوعی. هماهنگی استانداردهای ایمنی در میان کشورهای دموکراتیک؛ و در نهایت، هماهنگی جهانی بزرگتر. در دریم‌فورس، آمودی گفت که آنتروپیک به ارزیاب‌های مستقل متعهد است و در دو مرحله دیگر «با بقیه صنعت گفت‌وگو خواهد کرد». Amodei، Elon Musk از xAI و Sam Altman از OpenAI اخیراً خواستار کاهش سرعت توسعه هوش مصنوعی شده‌اند. نظرات مدیران عامل در پی هشدارهای جیکوب کوکسون، محقق سابق آنتروپیک است که با اعلام عمومی مبنی بر اینکه هوش مصنوعی می تواند به انقراض بشریت در دهه آینده منجر شود، استعفا داد. اظهارات کاکسون بحث بزرگتری را در دره سیلیکون برانگیخته است، توجه قانونگذاران را به خود جلب کرده و افکار عمومی را نگران کرده است."}, {"source": "The Guardian AI", "title": "Why the real AI apocalypse is already here – Stateside with Kai and Carter", "link": "https://www.theguardian.com/us-news/video/2026/sep/15/why-the-real-ai-apocalypse-is-already-here-stateside-with-kai-and-carter", "summary": "A former Anthropic researcher’s apocalyptic declaration about artificial intelligence has led to a global panic that the technology might be the end of us all. At an event in Washington today to warn about the dangers of AI, US senator Bernie Sanders said that Congress has been ‘asleep at the wheel'. Oddly, Steve Bannon appeared at the same event. But is this response a distra ن دلاری آن می رسد. آمازون حداقل دستمزد اولیه را برای کارکنان عملیات اصلی خود در ایالات متحده مانند رانندگان تحویل و کارمندان مرکز انجام خدمات به 20 دلار در ساعت و میانگین دستمزد ساعتی خود را به نزدیک به 24 دلار در ساعت افزایش می دهد. این شرکت خاطرنشان می کند که دستمزد بالاتر نشان دهنده افزایش 1 دلاری در ساعت برای کارکنان واجد شرایط است. اودیت مادان، معاون ارشد آمازون در یک پست وبلاگ نوشت، وقتی به ارزش مزایای پیشرو صنعت ما اضافه می کنید، میانگین کل غرامت به بیش از 32 دلار در ساعت می رسد. سرمایه گذاری در این افزایش ها به بیش از 1.5 میلیارد دلار یا حدود 0.06 درصد از ارزش بازار 2.68 تریلیون دلاری آن می رسد. علاوه بر این، آمازون می‌گوید که اکنون دسترسی کارمندان به یک سیستم بانکی کم‌هزینه به نام Day 1 Financial، عضویت در اتحادیه اعتباری فدرال فناوری First Tech و همچنین تخفیف 20 درصدی برای خریدهای داخل فروشگاه در Whole Foods Market، زنجیره مواد غذایی ممتاز که آمازون دارد، را برای کارمندان فراهم می‌کند. اگر کارمندان به صورت آنلاین از طریق آمازون خواربار فروشی سفارش دهند، 10 درصد تخفیف نیز دریافت خواهند کرد. آمازون از جمله مزایای آن، عضویت رایگان Prime، برنامه های آموزشی پیش پرداخت و پوشش مراقبت های بهداشتی را به کارکنان خود ارائه می دهد. در یک Subreddit برای کارمندان مرکز تحقق آمازون، مردم کمتر از آن مشتاق به نظر می رسند. در رابطه با تخفیف Whole Foods، یکی از کارگران نظر داد، پس هزینه آن تقریباً به اندازه یک فروشگاه معمولی خواهد بود؟ هاهاها، اشاره ای به قیمت های تاریخی بالاتر هول فودز. آخرین روز برای رزرو میز نمایشگاه 18 سپتامبر است. سرنخ‌های پر"}, {"source": "TechCrunch Main", "title": "Clean tech startup Fluxnium found a way to tap 50,000 years’ worth of nuclear fuel", "link": "https://techcrunch.com/2026/09/16/clean-tech-startup-fluxnium-found-a-way-to-tap-50000-years-worth-of-nuclear-fuel/", "summary": "Fluxnium's fibers can extract uranium directly from seawater, which has enough of the nuclear fuel to power thousands of generations.", "date_str": "2026-09-16T13:00:00+00:00", "hash": "db23623171767a32", "title_fa": "استارتاپ فناوری پاک Fluxnium راهی برای بهره برداری از سوخت هسته ای 50000 ساله پیدا کرد.", "summary_fa": "الیاف فلوکسنیوم می تواند اورانیوم را مستقیماً از آب دریا استخراج کند که سوخت هسته ای کافی برای تامین انرژی هزاران نسل دارد. ایالات متحده برنامه های بلندپروازانه ای برای سه برابر کردن ظرفیت نیروگاه های هسته ای خود تا سال 2050 دارد، اما اگر اپراتورهای نیروگاه نتوانند سوخت را با قیمت مناسب خریداری کنند، این هدف ممکن است با موانعی روبرو شود. به گفته اداره اطلاعات انرژی ایالات متحده، قیمت کیک زرد، نوعی اورانیوم تصفیه نشده، در پنج سال گذشته 75 درصد افزایش یافته است. مسائل پیچیده تر، ایالات متحده منابع قابل توجهی در داخل مرزهای خود ندارد - مگر اینکه اقیانوس را در نظر بگیرید. اقیانوس بیش از 4 میلیارد متریک تن اورانیوم در خود دارد که برای 50000 سال یا بیشتر کافی است. جف گرین، بنیانگذار و مدیر عامل فناوری پاک Fluxnium، به TechCrunch گفت: «هزار برابر بیشتر از مجموع معادن سنگ سخت شناسایی شده است. فلاکسنیوم فکر می کند که مشکل چگونگی استخراج اورانیوم از آب دریا را حل کرده است. با استفاده از فناوری توسعه یافته در ایالات متحده آزمایشگاه ملی وزارت انرژی، این شرکت رویکردی دارد که می تواند با معادن اورانیوم موجود رقابت کند. این استارت‌آپ تا کنون به صورت مخفیانه برای توسعه فناوری جدید کار کرده است. Fluxnium به TechCrunch نگاهی انحصاری به فناوری خود داد. این استارت آپ اخیراً یک دور اولیه 7 میلیون دلاری به رهبری Congruent Ventures با مشارکت Active Impact Investments و Constellation Energy که بزرگترین ناوگان هسته ای در ایالات متحده را اداره می کند، بسته است. Fluxnium در حال ظهور است که صنعت هسته ای در ایالات متحده در حال رنسانس است. شرکت‌های فناوری از چندین استارت‌آپ هسته‌ای حمایت کرده‌اند که در جستجوی منابع جدید برق برای تامین انرژی مراکز داده هوش مصنوعی خود هستند."}, {"source": "Ars Technica", "title": "How chimps teach their kids tool tricks", "link": "https://arstechnica.com/science/2026/09/how-chimps-teach-their-kids-tool-tricks/", "summary": "Chimpanzees are known to use rudimentary tools when foraging for food. According to a new paper in the journal Frontiers in Psychology, this learned behavior is passed down from adults to offspring through social learning. Specifically, adult chimps deliberately model the behavior, then turn their tools over to the youngsters so they can mimic the same motions. \"Receiving food and tools from experienced individuals, which we call food or tool transfer, may help chimpanzees learn to use technology to extract foods that are difficult to access,” said co-author Andreu Sánchez-Megías , a graduate student at the University of Barcelona and the Jane Goodall Institute Spain in Senegal. “Tool transfers thus appear to be a form of teaching, together with observation and supervised practice. It appears that mothers are the main models and teachers for young chimpanzees in this manner.” As we have previously reported , tool use was once thought to be one of the defining features of humans, although Charles Darwin observed chimpanzees using stones to crack nuts in 1871. In 1960, the late primatologist Jane Goodall observed a chimp named David Greybeard bend a twig, strip off the leaves, and use it to spoon termites out of a nest and into his mouth. When he learned of the behavior, Goodall's mentor, Louis Leakey, famously observed, “Now we must redefine ‘tool,’ redefine ‘man,’ or accept chimpanzees as humans.” Since then, chimps have been observed making sponges out of leaves to soak up liquids, shaping sticks to collect algae, and sharpening rudimentary spears for hunting. Read full article Comments", "date_str": "2026-09-16T04:00:39+00:00", "hash": "5df5b9bdd80f9aab", "title_fa": "چگونه شامپانزه ها ترفندهای ابزار را به فرزندان خود آموزش می دهند", "summary_fa": "شامپانزه ها برای جستجوی غذا از ابزارهای ابتدایی استفاده می کنند. طبق مقاله جدیدی در مجله Frontiers in Psychology، این رفتار آموخته شده از طریق یادگیری اجتماعی از بزرگسالان به فرزندان منتقل می شود. به طور خاص، شامپانزه‌های بالغ عمداً این رفتار را مدل‌سازی می‌کنند، سپس ابزار خود را به جوان‌ها می‌سپارند تا بتوانند همان حرکات را تقلید کنند. آندره سانچز-مگیاس، یکی از نویسندگان این مقاله، دانشجوی فارغ التحصیل در دانشگاه بارسلونا و موسسه جین گودال اسپانیا در سنگال، گفت: دریافت غذا و ابزار از افراد با تجربه، که ما آن را غذا یا انتقال ابزار می نامیم، ممکن است به شامپانزه ها کمک کند که از فناوری برای استخراج غذاهایی که دسترسی به آنها دشوار است، استفاده کنند. بنابراین به نظر می رسد که انتقال ابزار، همراه با مشاهده و تمرین تحت نظارت، نوعی آموزش باشد. به نظر می رسد که مادران الگوها و معلمان اصلی شامپانزه های جوان در این شیوه هستند. همانطور که قبلاً گزارش داده‌ایم، زمانی تصور می‌شد که استفاده از ابزار یکی از ویژگی‌های تعیین‌کننده انسان است، اگرچه چارلز داروین مشاهده کرد که شامپانزه‌ها در سال 1871 از سنگ برای شکستن آجیل استفاده می‌کنند. در سال 1960، نخستی‌شناس فقید، جین گودال، شامپانزه‌ای به نام دیوید گری‌بیارد را مشاهده کرد که شاخه‌هایی را خم می‌کند، شاخه‌ها را بیرون می‌کشد و از آن استفاده می‌کند. دهان او هنگامی که او از این رفتار مطلع شد، مربی گودال، لوئیس لیکی، به طرز معروفی اظهار داشت: «حالا باید «ابزار» را دوباره تعریف کنیم، «انسان» را دوباره تعریف کنیم، یا شامپانزه‌ها را به عنوان انسان بپذیریم.» از آن زمان، شامپانزه ها مشاهده شده اند که از برگ ها اسفنج می سازند تا مایعات را جذب کنند، چوب هایی را برای جمع آوری جلبک ها شکل می دهند و نیزه های ابتدایی را برای شکار تیز می کنند. مقاله کامل را"}, {"source": "Ars Technica", "title": "The Roman telescope has enough gas for 22 years, double NASA's expectations", "link": "https://arstechnica.com/space/2026/09/the-roman-telescope-has-enough-gas-for-22-years-double-nasas-expectations/", "summary": "NASA's Nancy Grace Roman Space Telescope is gliding toward its distant observation post on a pinpoint trajectory so precise that engineers estimate the spacecraft's fuel load will last twice as long as their initial expectations, the space agency confirmed Monday. The $4.3 billion observatory's designers originally planned to load enough propellant into Roman's four fuel tanks for a minimum lifetime of five years, plus a potential five-year mission extension. That was a conservative estimate. NASA officials knew an on-target launch and perfect e ی Boox، پالما در اندازه گوشی‌های هوشمند است و این شرکت به تازگی نسل سوم پالما خود را به همراه دو محصول جدید دیگر معرفی کرده است. در اینجا هر سه محصولی که دیشب منتشر شدند و آنچه اکنون برای خرید در دسترس است (و من برای آزمایش کدام یک به عنوان تستر دستگاه E Ink مقیم WIRED بسیار هیجان زده هستم) آمده است. بوکس سه محصول جدید E Ink را عرضه کرد: Boox Note Air6 C (580 دلار)، Note Mini C (580 دلار) و Palma 3 (340 دلار). Note Air6 C افزودنی جدید به خط نوت ایر است که قبلاً برای راهنمای خود در مورد بهترین نوت‌بوک‌های دیجیتال آزمایش کرده‌ام. اینها اساساً تبلت‌های اندرویدی E Ink هستند که دارای قلم هستند و آنها را به انتخابی عالی برای یک نوت بوک دیجیتال قدرتمند تبدیل می‌کند. این"}, {"source": "Wired", "title": "China Isn’t Buying Silicon Valley’s Call for an AI Slowdown", "link": "https://www.wired.com/story/china-isnt-buying-silicon-valley-call-for-ai-slowdown/", "summary": "The US and China agree that advanced AI poses serious risks. But Beijing is deeply skeptical of a deal that prioritizes keeping US companies ahead.", "date_str": "2026-09-16T09:30:00+00:00", "hash": "db7f35e50bbce201", "title_fa": "چین درخواست سیلیکون ولی برای کاهش سرعت هوش مصنوعی را نمی خرد", "summary_fa": "ایالات متحده و چین توافق دارند که هوش مصنوعی پیشرفته خطرات جدی ایجاد می کند. اما پکن عمیقاً نسبت به توافقی که حفظ شرکت های آمریکایی را در اولویت قرار می دهد، تردید دارد. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان برای سال‌ها، بسیاری از قدرتمندترین افراد در سیلیکون ولی استدلال می‌کردند که ایالات متحده در یک مسابقه تسلیحاتی هوش مصنوعی با چین قرار دارد و عواقب شکست فاجعه‌بار خواهد بود. اما در هفته گذشته، همان مدیران شروع به تأکید بر پیام متفاوتی کرده اند. به گفته رهبران فناوری، هوش مصنوعی این پتانسیل را دارد که آنقدر خطرناک شود که دو کشور باید فوراً با یکدیگر همکاری کنند تا سرعت رقابت را کاهش دهند. داریو آمودی، مدیر عامل آنتروپیک، در یک پست وبلاگی که روز شنبه با عنوان «ما باید در مرز قدم برداریم» نوشت: «پیش‌رفت جهانی نیازمند همکاری با چین است، کشوری مستبد با پیشرفته‌ترین قابلیت‌های هوش مصنوعی». دولت چین و شرکت‌های هوش مصنوعی به صراحت اعلام کرده‌اند که عمیقاً نسبت به پیشنهاد Amodei تردید دارند، اما نه به این دلیل که می‌خواهند کورکورانه به رقابت ادامه دهند یا باور ندارند که این فناوری خطرات جدی ایجاد می‌کند. مشکلی که دولت چین و شرکت های چینی هوش مصنوعی می بینند بسیار ساده تر است. آنها فکر می کنند که یک معامله بد به آنها پیشنهاد شده است. کوین ژو، بنیانگذار صندوق سرمایه گذاری فناوری Interconnected Capital و کارمند سابق کاخ سفید در دوره ریاست جمهوری باراک اوباما، می گوید: «جامعه ایمنی هوش مصنوعی در چین در حال رشد است و در بسیاری از نگرانی های آزمایشگاه های آمریکایی نیز سهیم است. شکاف بین دیدگاهی است که توسط آنتروپیک رهبری می‌شود که فقط چین را تحت انقیاد و محدود می‌کند تا قبل از صحبت کردن، اهرم را به حداکثر برساند. در همین حال، چین"}, {"source": "Wired", "title": "Why It Seems Like Great White Sharks Are Overrunning Maine", "link": "https://www.wired.com/story/why-great-white-sharks-are-overrunning-maine/", "summary": "While a bunch of sharks cruising the Maine coast may seem ominous, it’s actually a sign of a conservation success story.", "date_str": "2026-09-16T09:15:00+00:00", "hash": "6dcf03a028db6587", "title_fa": "چرا به نظر می رسد کوسه های سفید بزرگ در حال غلبه بر مین هستند؟", "summary_fa": "در حالی که دسته ای از کوسه ها در حال گشت و گذار در سواحل مین ممکن است شوم به نظر برسد، اما در واقع نشانه ای از یک داستان موفقیت آمیز حفاظت از محیط زیست است. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان نجات غریق گرگ ویلفرت در ماه آگوست در حال شنا کردن در سواحل اسکاربرو، مین بود که توسط نیرویی که شناور نجات او را می کشید، در زیر آب غرق شد. ویلفرت، یک نجات غریق 55 ساله، به شبکه خبری محلی WFSB گفت که ابتدا فکر می کرد در یک ملخ قایق گرفتار شده است، اما مقصر واقعی یک کوسه سفید بزرگ بود. این حادثه یکی از صف‌های طولانی مشاهده‌های سفید بزرگ در سواحل مین در سال جاری است. تابستان شلوغی برای مشاهده کوسه‌ها در امتداد بقیه سواحل شرقی بود، اما به‌طور خاص به نظر می‌رسد که مین از غذاهای سفید بزرگ برخوردار بوده است. ده ها مورد مشاهده در یک دوره دو روزه در نزدیکی ساحل پاین پوینت در جنوب مین در ماه اوت گزارش شد. سواحل به طور موقت در سرتاسر ایالت به دنبال مشاهده های متعدد در ماه های جولای و آگوست بسته شدند. کوسه‌ها تا پایان تابستان به دنبال ساحل‌روان بودند: یک ماهی سفید بزرگ در ساحل ولز در تعطیلات آخر هفته روز کارگر مشاهده شد، در حالی که یک ماهی‌گیر دیگر را در تعطیلات در حدود 30 مایلی پایین‌تر از ساحل صید کرد. آب‌های سواحل مین یکی از سریع‌ترین آب‌های جهان هستند که گرم‌تر می‌شوند و اقیانوس اطلس شاهد یک سری امواج گرمای دریایی است. پدیده آب و هوایی ال نینو فقط گرمای جهانی را بیشتر افزایش می دهد. اما کارشناسان به WIRED گفتند که دلیل برخوردهای اخیر ما با کوسه‌ها بسیار پیچیده‌تر از نسبت دادن آنها به تغییرات آب و هوایی است، به‌ویژه وقتی"}, {"source": "Wired", "title": "Best 2-in-1 Laptops (2026): Microsoft, Lenovo, and the iPad", "link": "https://www.wired.com/story/best-2-in-1-laptops/", "summary": "These portable computers balance tablet and laptop functionality, whether you want a screen that detaches or spins.", "date_str": "2026-09-16T09:00:00+00:00", "hash": "12cbc6180a6a28b3", "title_fa": "بهترین لپ‌تاپ‌های 2 در 1 (2026): مایکروسافت، لنوو و آی‌پد", "summary_fa": "این رایانه‌های قابل حمل عملکرد تبلت و لپ‌تاپ را متعادل می‌کنند، چه بخواهید صفحه‌نمایش جدا شود یا بچرخد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان همیشه یک مورد استفاده برای داشتن لپ تاپ و تبلت به عنوان محصولات مستقل وجود خواهد داشت. اما لپ تاپ 2 در 1 رویای اتوپیایی ترکیب این دو در یک دستگاه واحد است. از بین تمام مدل هایی که من آزمایش کرده ام، هیچ لپ تاپ 2 در 1 به همان اندازه در تبلت و لپ تاپ بودن خوب نیست. آنها همیشه به سمت یکی یا دیگری متمایل می شوند. اما این بدان معنا نیست که شما نباید یکی از آنها را بخرید، به خصوص که راحتی داشتن هر دو در یک دستگاه باعث می‌شود که بلعیدن آن از نظر قیمت آسان‌تر باشد. محصولات زیر باید نیازهای اکثر مردم را برآورده کنند. اما اگر هیچ کدام برای شما مناسب نیست، سایر راهنمای خرید رایانه WIRED را بررسی کنید، از جمله بهترین لپ‌تاپ‌ها، بهترین دستگاه‌های سطحی، بهترین لپ‌تاپ‌های ارزان، بهترین تبلت‌ها و بهترین iPad. به روز شده در سپتامبر 2026: من Surface Pro 12 را انتخاب برتر جدید خود قرار داده ام و بسیاری از توصیه های دیگر را در لیست خود مرتب کرده ام. تبلت های جداشونده 2 در 1 لپ تاپ های 2 در 1 قابل تبدیل دیگر لپ تاپ های 2 در 1 باید در نظر بگیرید که لپ تاپ 2 در 1 چیست؟ آیا باید یک لپ تاپ 2 در 1 بخرید؟ چرا فقط آیپد نمیخریم؟ چگونه بهترین تبلت های جداشدنی 2 در 1 را آزمایش می کنم عکس: لوک لارسن ذخیره در لیست علاقه مندی ها ذخیره در لیست علاقه مندی های مایکروسافت شما نمی توانید بدون صحبت در مورد دستگاه های سرفیس مایکروسافت در مورد لپ تاپ های 2 در 1 صحبت کنید. این"}, {"source": "Wired", "title": "Polymarket’s Next Bet? It Can Also Be a Media Company", "link": "https://www.wired.com/story/prediction-markets-polymarket-media-company-kalshi/", "summary": "The legal battle over whether prediction markets are a form of gambling has overshadowed something else entirely: They’re already a new form of media.", "date_str": "2026-09-16T09:00:00+00:00", "hash": "31360151ed63b9db", "title_fa": "شرط بعدی پلی مارکت؟ همچنین می تواند یک شرکت رسانه ای باشد", "summary_fa": "نبرد حقوقی بر سر اینکه آیا بازارهای پیش‌بینی نوعی قمار هستند یا خیر، چیز دیگری را کاملا تحت الشعاع قرار داده است: آنها در حال حاضر شکل جدیدی از رسانه هستند. این صنعت در حال حاضر درگیر یک سری نبردهای حقوقی است که آیا بازارهای پیش‌بینی خدمات مالی (نگاهی که بازارها و دولت فدرال دارند) یا پلتفرم‌های قمار (موقعیت بسیاری از مقامات ایالتی و تنظیم‌کننده‌ها) هستند. دعوا بر سر نوع شرکت‌هایی که اینها هستند ممکن است به دیوان عالی ختم شود، اما در این بین، هم پلی مارکت و هم رقیب محبوب‌تر آن، کالشی، با موفقیت خود را به عنوان سازمان‌های رسانه‌ای جدید نیز معرفی کرده‌اند. برای دو شرکتی که با ریسک مرتبط هستند، این یک پوشش قدیمی است. همه انواع استارت آپ های فناوری پروژه های سرمقاله ای را راه اندازی کرده اند - آیا می دانستید که اپلیکیشن دوستیابی جایگزین Feeld مجله شگفت آور خوبی دارد؟ - اما بازارهای پیش بینی پیشرو به شیوه ای تهاجمی خود را در دستگاه اصلی رسانه ای مستقر کرده اند. گزارش اخیر نشان می دهد که آنها در یک چهارم از 20 شرکت برتر فهرست شده در بخش خدمات ارتباطی S P 500 ادغام شده اند. Polymarket با Dow Jones و Substack شراکت دارد، در حالی که Kalshi با CNN، CNBC و Fox Corp معامله می کند. هیچ یک از قراردادها تجارت را تسهیل نمی کند. در عوض، آنها عمدتاً در مورد به اشتراک گذاری داده ها هستند. رسانه‌های خبری می‌خواهند بدانند مردم پول خود را روی چه چیزی می‌گذارند، و بازارهای پیش‌بینی خوشحال هستند که این موضوع را متعهد می‌کنند. معاملات بازارهای پیش‌بینی را به‌عنوان کانال‌های اطلاعاتی به نمایش می‌گذارند - مکان‌هایی که باید برای یافتن آنچه اتفاق می‌افتد رفت. آن‌ها اعتبار بسیار مورد نیاز Polymarket و Kalshi را افزایش داده‌اند و معرفی ساده‌ای را به عموم مردم ارائه کرده‌اند. تقویت‌کنندگان"}, {"source": "Wired", "title": "‘Smart’ Nanoparticles Deliver mRNA Directly to Tumors in New Cancer Therapy", "link": "https://www.wired.com/story/smart-nanoparticles-deliver-mrna-directly-to-tumors-in-new-cancer-therapy/", "summary": "The treatment can reprogram immune cells that have been corrupted by the cancer, strengthening the body’s ability to attack.", "date_str": "2026-09-16T08:30:00+00:00", "hash": "84b1fbe11c156d36", "title_fa": "نانوذرات «هوشمند» mRNA را مستقیماً به تومورها در درمان سرطان جدید می‌رسانند", "summary_fa": "این درمان می‌تواند سلول‌های ایمنی را که توسط سرطان تخریب شده‌اند، برنامه‌ریزی مجدد کند و توانایی بدن برای حمله را تقویت کند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان سیستم ایمنی ما فقط با باکتری ها و ویروس هایی که به بدن حمله می کنند مبارزه نمی کند. آنها مسئول کنترل بافت های خودمان هستند و سلول های سرطانی را قبل از اینکه فرصتی برای رشد داشته باشند خارج می کنند. با این حال، هنگامی که یک تومور شکل می‌گیرد، می‌تواند محیطی ایجاد کند که سلول‌های ایمنی مبارزه‌کننده با سرطان را از بین ببرد - حتی در برخی موارد آنها را برای سرکوب سایر بخش‌های سیستم ایمنی برنامه‌ریزی مجدد می‌کند. غلبه بر محیط ظالمانه تومور حتی برای برخی از امیدوارکننده ترین درمان ها نیز مانعی باقی می ماند. Chunxia Zhao، استاد دانشگاه آدلاید، در بیانیه مطبوعاتی توضیح داد: «یکی از بزرگ‌ترین چالش ر جهان» تبدیل شود. این شرط است و شماره زیر آن به سرعت در حال حرکت است. Stefan Gergely، رئیس رشد شرکت، این پایان نامه را به صراحت در اطلاعیه بیان کرد. «اطلاعاتی که به‌صورت فصلی یا سالانه به‌روز می‌شوند، دیگر هوشمند نیستند. این تاریخ است.» او همچنین پرسید که چرا سازمان‌ها «هنوز با استفاده از داده‌های چند ماهه تصمیم‌های میلیارد دلاری می‌گیرند». این یک سوال منصفانه است و مسئولان فعلی به خوبی به آن پاسخ نداده اند. هنگامی که Veridion در سال 2023، با نام قبلی خود Soleadify، 6 میلیون دلار جمع آوری کرد، پایگاه داده به روز شده هفتگی بیش از 80 میلیون پروفایل شرکت را توصیف کرد. سه سال بعد این رقم تقریباً هشت برابر بزرگتر است. گسترش پوشش محصول است، بنابراین رشد به جای یک مشکل، نکته است. این تعریف واحد را به مهمترین چیز در اعلامیه تبدیل می کند و این تعریف وجود ندارد. تخمین‌هایی که معمولاً ذکر می‌شود، تعداد کسب‌وکارها را در سرتاسر جهان به صدها میلیون نفر می‌رساند، با شرکت‌هایی که به‌طور رسمی ثبت شده‌اند، بسیار کمتر از آن. TNW نتوانست آن ارقام را در یک شمارش معتبر ردیابی کند، که بخشی از مشکل است."}, {"source": "The Next Web", "title": "UK workers spend nearly £1bn a year of their own money on AI tools for work, Deloitte finds", "link": "https://thenextweb.com/news/uk-workers-spend-own-money-ai-tools-deloitte", "summary": "British workers spend about £958 million each year out of pocket on generative AI tools for work, according to a Deloitte UK survey of 25,000 people. Of those using these tools, 17% pay for at least one themselves. This spending is part of a larger trend that employers do not fully see. About 63% of [ ] This story continues at The Next Web", "date_str": "2026-09-16T12:15:03+00:00", "hash": "4e6cd8bdcbd417e3", "title_fa": "Deloitte دریافت که کارگران بریتانیا سالانه نزدیک به یک میلیارد پوند از پول خود را صرف ابزارهای هوش مصنوعی برای کار می کنند.", "summary_fa": "بر اساس نظرسنجی Deloitte در بریتانیا از ۲۵۰۰۰ نفر، کارگران بریتانیایی سالانه ۹۵۸ میلیون پوند از جیب خود برای ابزارهای هوش مصنوعی مولد برای کار خرج می‌کنند. از بین کسانی که از این ابزارها استفاده می کنند، 17 i-rogue-agents-probed-hugging-face-may", "summary": "OpenAI’s runaway AI agents took over Hugging Face user accounts and used them to probe the platform for weaknesses as early as 13 May, Reuters reported. The activity began nearly two months before the July breach that made it a global story, and researchers say it went beyond what OpenAI has publicly described. The 27-year-old [ ] This story continues at The Next Web", "date_str": "2026-09-16T10:54:55+00:00", "hash": "86c974a67f49c180", "title_fa": "به گزارش رویترز، ماموران سرکش OpenAI در ماه مه، دو ماه قبل از رخنه، Hugging Face را بررسی کردند.", "summary_fa": "رویترز گزارش داد که عوامل هوش مصنوعی فراری OpenAI حساب های کاربری Hugging Face را تصاحب کردند و از آنها برای بررسی نقاط ضعف پلت فرم در اوایل 13 می استفاده کردند. این فعالیت تقریباً دو ماه قبل از نقض ماه جولای که آن را به یک داستان جهانی تبدیل کرد، آغاز شد و محققان می‌گویند که فراتر از آن چیزی است که OpenAI به طور عمومی توصیف کرده است. 27 ساله [ ] این داستان در The Next Web ادامه دارد. یوناس ویدرمن-مولر، محقق مستقل 27 ساله از بیله فلد، آلمان، هفته گذشته این فعالیت را کشف کرد. به گفته Jonas Wiedermann-Moeller، ماموران دو حساب Hugging Face را نقض کردند و سپس از آنها برای انتقال فایل‌ها در فرمت غیرعادی به سرورهای شرکت استفاده کردند. آنها به همراه سایر محققانی که شواهد را بررسی کردند، بر این باور بودند که این الگو نشان‌دهنده تلاشی برای نقشه‌برداری از شبکه Hugging Face برای یافتن راهی است، اگرچه در آن مرحله هیچ مدرکی مبنی بر اینکه این امر منجر به نقض شده است، پیدا نکردند. رویترز گزارش داد که دو کارشناس مستقل از نتیجه گیری او حمایت کردند. تام هگل، محقق ارشد تهدید در SentinelOne، اظهار داشت که سرقت حساب و بررسی دقیقاً با رفتار ماموران مطابقت دارد. سیدنی فون آرکس از گروه بلبل، یک گروه ایمنی هوش مصنوعی، موافقت کرد و این فعالیت را به عنوان یک \"علامت هشدار واضح\" توصیف کرد که ممکن است از حمله در ماه جولای جلوگیری کند. در مقابل، حساب OpenAI تاکید متفاوتی بر این موضوع دارد. در گزارش حادثه ماه گذشته خود تنها به یک جنبه از فعالیت ماه مه اشاره کرد، یعنی سرقت اعتبار یک کارب
