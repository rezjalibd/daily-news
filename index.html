<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۲ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۲ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۴ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۰۳:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۴۷</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۰۰</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۶۶</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

م «ژان-نوئل بارو»، وزیر خارجه فرانسه پس از دیدار با همتایان خود در نشست استانبول گفت: «تشدید بیشتر تنش‌ها میان ایران و ایالات متحده هیچ برنده‌ای نخواهد داشت و هاکان فیدان، وزیر خارجه ترکیه هم تاکید کرد که دیپلماسی و گفت‌وگو تنها راه است.» «هاکان فیدان»،‌ وزیر خارجه ترکیه نیز، در حاشیه نشست وزرای خارجه هفت کشور که در استانبول برگزار شده گفت که حمله مجدد به ایران موجب تشدید تنش‌ها و گسترش بیشتر درگیری خواهد شد. او با تاکید بر «دیپلماسی و گفت‌وگو» به عنوان «تنها راه پایان دادن به جنگ ایران و آمریکا» گفت که هیچ‌یک از کشورهای حاضر در این نشست، از مداخله نظامی یا حمله دیگر به ایران حمایت نمی‌کنند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Screenshot_2026-10-23_at_1.55.58PM_hxBw__v1024x512__box_20%2C0%2C2590%2C1348.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱ آبان • ۲۱:۳۰"}, {"source": "Euronews Persian", "title": "با ورود نامزد جدید اماراتی، رقابت دبیرکلی سازمان ملل وارد مرحله تعیین‌کننده شد", "link": "https://parsi.euronews.com/2026/10/23/uae-candidate-enters-un-secretary-general-race-at-decisive-stage", "summary": "لانا نسیبه دیپلمات سرشناس امارات، در مقطع حساسی برای آینده سازمان ملل وارد رقابت برای دبیرکلی شده و نامزد پیشتاز ربکا گرینسپن را به چالش کشیده است؛ رقابتی که می‌تواند به انتخاب نخستین دبیرکل زن سازمان ملل بینجامد.", "date_str": "2026-10-23T18:07:20+00:00", "hash": "a63e381c96b071dd", "title_fa": "با ورود نامزد جدید اماراتی، رقابت دبیرکلی سازمان ملل وارد مرحله تعیین‌کننده شد", "summary_fa": "لانا نسیبه دیپلمات سرشناس امارات، در مقطع حساسی برای آینده سازمان ملل وارد رقابت برای دبیرکلی شده و نامزد پیشتاز ربکا گرینسپن را به چالش کشیده است؛ رقابتی که می‌تواند به انتخاب نخستین دبیرکل زن سازمان ملل بینجامد.", "image_url": "https://images.euronews.com/articles/stories/09/96/51/23/1200x675_cmsv2_7e565a5f-75c1-5063-813b-0008c8 ی فیلم «ندا» اثر اشکان نجفی", "summary_fa": "«اشکان نجفی»، کارگردان و فیلم‌نامه‌نویس ایرانی ساکن آلمان، در شصتمین دوره جشنواره فیلم «هوف» موفق به دریافت جایزه حمایت از سینمای نوین آ ... اشکان نجفی این جایزه را برای ساخت فیلمی به نام «ندا» دریافت کرد . این فیلم داستان یک مترجم ایرانی شاغل در اداره فدرال مهاجرت و پناهندگان آلمان را روایت می‌کند. شخصیت اصلی در این اثر زنی است که در جریان کار خود با فردی روبرو می‌شود که در گذشته او را شکنجه کرده و حالا در آلمان درخواست پناهندگی داده است. اشکان نجفی متولد ۱۹۸۳ در تهران است و از سال ۲۰۰۵ در آلمان زندگی می‌کند. او پیش از ورود به عرصه سینما به‌عنوان روزنامه‌نگار فعالیت می‌کرد و به‌ویژه به جنبش‌های آزادی‌خواهانه و اصلاح‌طلبانه در ایران می‌پرداخت. او پس از مهاجرت به آلمان در رشته فناوری فیلم و رسانه در دانشگاه هامبورگ تحصیل کرد و اکنون به‌عنوان کارگردان و فیلم‌نامه‌نویس فعالیت می‌کند. اشکان نجفی جایزه خود را روز پنجشنبه ۳۱مهر۱۴۰۵ در مراسمی در تالار آزادی شهر هوف دریافت کرد. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D8%A7%D8%B4%DA%A9%D8%A7%D9%86_%D9%86%D8%AC%D9%81%DB%8C_JVtF__v1024x512__box_0%2C50%2C2656%2C1445.jpeg", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۲۰:۳۳"}, {"source": "Iran International", "title": "نامزد ایرانی‌تبار حزب یاشار در انتخابات اسرائیل: باید برای سقوط جمهوری اسلامی تلاش کنیم", "link": "https://www.iranintl.com/202610237255", "summary": "نازنین شریفیان، نامزد ایرانی‌تبار و فارسی‌زبان حزب یاشار به رهبری گادی آیزنکوت در انتخابات پارلمانی اسرائیل، در گفت‌وگو با ایران‌اینترنشنال خواستار تشدید فشارهای نظامی و اقتصادی بر رهبران جمهوری اسلامی شد و تاکید کرد باید برای پایان دادن به این حکومت تلاش کرد.", "date_str": "2026-10-23T17:28:01+00:00", "hash": "bc4d1dd10c37bcfa", "title_fa": "نامزد ایرانی‌تبار حزب یاشار در انتخابات اسرائیل: باید برای سقوط جمهوری اسلامی تلاش کنیم", "summary_ لام آمادگی کردند. یوهان واده‌فول، وزیر خارجۀ آلمان، اعلام کرد که این کشور همراه با فرانسه و بریتانیا آمادۀ مذاکره با جمهوری اسلامی برای جلوگیری از دستیابی این کشور به سلاح هسته‌ای است. او این اظهارات را پس از نشست هشت کشور اروپایی و منطقه‌ای در استانبول که روز جمعه اول آبان برگزار شد، بیان کرد. واده‌فول تأکید کرد که تهران باید برای دستیابی به راه‌حلی دیپلماتیک و پایدار آمادگی جدی نشان دهد. شهریور ماه سال جاری، این سه کشور همراه با آمریکا، به‌دلیل عدم پایبندی ایران به تعهدات خود در زمینه گزارش‌دهی هسته‌ای، قطعنامه‌ شورای حکام را برای نخستین بار طی ۲۰ سال گذشته به شورای امنیت ارجاع دادند. ایران از زمان حمله اسرائیل و آمریکا به تأسیسات مهم هسته‌ای خود، به بازرسان آژانس بین‌المللی انرژی اتمی اجازه بازگشت به سایت‌های بمباران‌شده را نداده است. ایران بیش از ۴۰۰ کیلوگرم اورانیوم با غنای بالا در اختیار دارد و پس از آسیب‌دیدن تأسیسات هسته‌ای در اصفهان، فردو و نطنز در جریان جنگ ۱۲ روزه پارسال، هنوز در مورد سرنوشت ذخایر اورانیوم غنی‌شده شفاف‌سازی نکرده است. گروسی بهمن ۱۴۰۴ هشدار داده بود که بن‌بست بر سر بررسی ذخایر اورانیوم غنی‌شده با ظرفیت بالا و بازرسی از تأسیسات هسته‌ای بمباران‌شده‌ ایران، نمی‌تواند «تا ابد» ادامه داشته باشد. دونالد ترامپ، رئیس‌جمهور آمریکا، بارها اعلام کرده که با هدف جلوگیری از دستیابی ایران به سلاح هسته‌ای وارد جنگ با جمهوری اسلامی شده است. جی‌دی ونس، معاون رئیس‌جمهور آمریکا، نیز گفته که ایالات متحده با نابود کردن برنامه هسته‌ای ایران به «پیروزی قاطع» دست یافته، اما جنگ باید ادامه پیدا کند تا اطمینان حاصل شود که جمهوری اسلامی توانایی‌های هسته‌ای خود را بازسازی نمی‌کند.", "image_url": "https://gdb.rferl.org/2d004766-c63f-4c94-bd1e-2a679d32217a_cx0_cy10_cw0_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱ آبان • ۲۰:۵۹"}, {"source": "IranWire", "title": "اعتراض کارکنان فروشگاه رفاه؛ یک سال است بیمه پرداخت نشده", "link": "https://iranwire.com/fa/news-1/159261-%D8%A7%D8%B9%D8%AA%D8%B1%D8%A7%D8%B6-%DA%A9%D8%A7%D8%B1%DA%A9%D9%86%D8%A7%D9%86-%D9%81%D8%B1%D9%88%D8%B4%DA%AF%D8%A7%D9%87-%D8%B1%D9%81%D8%A7%D9%87-%DB%8C%DA بت کرده نیز جزو مجروحان است. لوران نونیز، وزیر کشور فرانسه، این تیراندازی مرگبار از داخل خودرو را «اقدامی تروریستی» توصیف کرد. علی رابه، شهردار شهر تراپ می‌گوید مهاجم هنگام رانندگی در شهرهای کارگرنشین تراپ و لا وری‌یر در جنوب‌ غرب پاریس، «به‌طور تصادفی تیراندازی می‌کرد و قصد داشت حمام خون به راه بیندازد». یک منبع پلیس به خبرگزاری فرانسه گفت مهاجم حدود ساعت ۱۰:۳۰ صبح به وقت محلی، از داخل خودروی خود به‌صورت رگباری تیراندازی را آغاز کرد. به گزارش خبرگزاری فرانسه، بیشتر قربانیان «پیشینه مهاجرتی» داشتند و دادستان‌ها در حال بررسی این موضوع هستند که آیا مهاجم قربانیان را به دلیل «نژاد، قومیت، ملیت یا مذهب واقعی یا تصورشده آن‌ها» هدف قرار داده است یا نه. به گفته یک منبع آگاه از پرونده، مظنون تیراندازی مردی ۳۹ ساله است که در شهر نزدیک کوآنی‌یر بازداشت شده است. نیکولا دنویل، شهردار لا وری‌یر، فرد مظنون را «دارای ظاهری اروپایی» توصیف کرده است. یک منبع پلیس گفت مأموران هنگام بازداشت، یک مسلسل دستی و نارنجک‌های گاز اشک‌آور نزد او پیدا کردند. شهردار تراپ می‌گوید مهاجم از داخل خودروی خود به‌طور پراکنده تیراندازی می‌کرد و فرد کشته‌شده «آفریقایی‌تبار» بوده است. او افزود یکی از مجروحان که «در وضعیت بحرانی» قرار دارد، نیز اهل شمال آفریقاست. این شهردار حمله را «آشکارا نژادپرستانه و احتمالاً اسلام‌هراسانه» توصیف کرد و هم‌زمان با افزایش شمار زخمی‌ها از چهار نفر به پنج نفر، خواستار اتحاد ملی شد.", "image_url": "https://gdb.rferl.org/88cdca3f-4710-48e4-b03e-48cba112c9d7_w1200_h630.jpg", "category": "موسیقی و هنر", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱ آبان • ۱۹:۳۰"}, {"source": "Radio Farda", "title": "ممنوعیت تولید تریاک در افغانستان؛ «گسترش» کشت خشخاش در مناطق مرزی ایران و پاکستان", "link": "https://www.radiofarda.com/a/iran-pakistan-opium-poppy-cultivation-afghanistan-taliban-ban/33883021.html", "summary": "پس از ممنوعیت کشت خشخاش در افغانستان، تصاویر ماهواره‌ای از گسترش مزارع این گیاه در ایران و پاکستان حکایت دارد؛ روندی که می‌تواند تولید تریاک و قاچاق مواد مخدر را افزایش دهد.", "date_str": "2026-10-23T14:10:56+00:00", "hash": "89dba6fe7404652b", "title_fa": "ممنوعیت تولید تری ummary": "چری سامانه‌ی شارژ Volt-dragon را با توان ۱٫۴۴ مگاوات معرفی کرد که قادر است ظرف پنج دقیقه ۵۰۰ کیلومتر پیمایش فراهم کند.", "date_str": "2026-10-23T23:15:00+00:00", "hash": "077eac3821594c0d", "title_fa": "شارژر فوق سریع چری: پیمایش ۵۰۰ کیلومتر با ۵ دقیقه شارژ!", "summary_fa": "چری سامانه‌ی شارژ Volt-dragon را با توان ۱٫۴۴ مگاوات معرفی کرد که قادر است ظرف پنج دقیقه ۵۰۰ کیلومتر پیمایش فراهم کند. تبلیغات چری سامانه شارژ مگاواتی جدیدی با نام Volt-dragon معرفی کرد که با حداکثر توان ۱٫۴۴ مگاوات، مستقیما به رقابت با شبکه‌های بی‌وای‌دی، جیلی و هواوی می‌رود. چری وعده می‌دهد خودروهای سازگار با دریافت ۵ دقیقه شارژ از این سامانه، بردی معادل ۵۰۰ کیلومتر به دست می‌آورند. طبق آمار رسمی، رساندن ظرفیت باتری از ۱۰ درصد به ۹۷ درصد در این سامانه تنها ۶ دقیقه و ۵۰ ثانیه طول می‌کشد. معرفی این فناوری در جریان رویداد نوآوری جهانی خودروساز آن‌هوئی در کنار هوش مصنوعی این برند به نام CheryMind انجام گرفت. چری می‌گوید این هوش مصنوعی آشنا با جهان فیزیک به شمار می‌رود و رباتیک‌ها، سیستم‌های خودران سطح چهار و شبکه شارژ را مدیریت می‌کند، گرچه جزئیات فنی عملکرد CheryMind در توزیع توان الکتریکی هنوز فاش نشده است. دستیابی به رکورد کمتر از هفت دقیقه، چری را به جایگاه دوم سریع‌ترین فناوری‌های شارژ چین می‌رساند. نسل سوم باتری Shenxing متعلق به CATL با ثبت زمان ۶ دقیقه و ۲۷ ثانیه برای شارژ ۱۰ تا ۹۸ درصد همچنان پیشتاز است، در حالی که رقبایی نظیر بی‌وای‌دی، هواوی و جیلی آماری بین ۸ تا ۹ دقیقه دارند. جدول مقایسه‌ای زیر سرعت شارژ باتری شبکه‌های مختلف را نشان می‌دهد. ایستگاه‌های Volt-dragon بر پایه الکترونیک قدرت سیلیکون کاربید ساخته می‌شوند و بازده کل سامانه از شبکه برق تا نازل به ۹۶.۵ درصد می‌رسد. جهت مهار گرمای ناشی از توان بالای یک مگاوات، خنک‌کاری مایع غوطه‌وری تعبیه شده و وزن مجموعه کابل و دوشاخه تنها ۲ کیلوگرم است. علاوه بر پشتیبانی از فناوری انتقال برق به شبکه (V2G) و قابلیت شارژ خودکار با بازوهای رباتیک، صدای کارکرد ایستگاه‌ها هرگز از ۵۰ دسی‌بل فراتر نمی‌رود. احداث ۱۰۰ ایستگاه در ۱۰ شهر چین آغاز شده", "image_url": "https://api2.zoomit.ir/media/byd-ev-charging-67d96f26d0706ecd7907c999?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۲ آبان • ۰۲:۴۵"}, {"source": "Ars Technica", "title": "NASA updates lander plans for Moon landings, finally solves long-festering Orion issue", "link": "https://arstechnica.com/space/2026/10/nasa-updates-lander-plans-for-moon-landings-finally-solves-long-festering-orion-issue/", "summary": "During a lengthy news conference NASA on Friday provided a detailed overview of how it plans to return astronauts to the lunar surface, as soon as 2028, as part of its Artemis Program. Although much of the information behind these plans has been previously reported in Ars Technica and elsewhere, this marked the first time NASA has laid them out in detail and acknowledged some substantial changes in the architecture. Most notably, for SpaceX's Starship vehicle, the revised plan calls for the Orion spacecraft to dock with the Starship lunar lander in high-Earth orbit before transiting to the Moon. And for Blue Origin, the mission architecture includes four launches of the New Glenn rocket, but no spacecraft-to-spacecraft refuelings. Additionally, the Blue Origin plans allows for the possibility of its Blue Moon lander rendezvousing with Orion in low-Lunar orbit. Read full article Comments", "date_str": "2026-10-23T22:48:25+00:00", "hash": "105e3d4f0e9505ff", "title_fa": "ناسا برنامه‌های فرودگر برای فرود روی ماه را به‌روزرسانی می‌کند و سرانجام مشکل طولانی مدت شکارچی را حل می‌کند", "summary_fa": "در طی یک کنفرانس خبری طولانی، ناسا در روز جمعه یک مرور کلی از نحوه برنامه ریزی خود برای بازگرداندن فضانوردان به سطح ماه در اسرع وقت در سال 2028، به عنوان بخشی از برنامه آرتمیس ارائه کرد. اگرچه بسیاری از اطلاعات پشت این طرح‌ها قبلاً در Ars Technica و جاهای دیگر گزارش شده است، این اولین باری است که ناسا آنها را به تفصیل بیان می‌کند و تغییرات اساسی در معماری را تصدیق می‌کند. مهم‌تر از همه، برای وسیله نقلیه استارشیپ اسپیس‌ایکس، طرح تجدیدنظر شده از فضاپیمای اوریون می‌خواهد تا قبل از گذر به ماه، با فرودگر ماه ستاره‌شیپ در مدار مرتفع زمین پهلو بگیرد. و برای Blue Origin، معماری ماموریت شامل چهار پرتاب موشک نیو گلن است، اما بدون سوخت‌گیری از فضاپیما به فضاپیما. علاوه بر این، طرح‌های Blue Origin امکان ملاقات کاوشگر ماه آبی با اوریون در مدار پایین ماه را فراهم می‌کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید به حداقل رساندن برای پیمایش در طول یک کنفرانس خبری طولانی در روز جمعه، ناسا یک نمای کلی از نحوه برنامه ریزی خود برای بازگرداندن فضانوردان به سطح ماه در اسرع وقت در سال 2028 به عنوان بخشی از برنامه Artemis خود ارائه کرد. مهم‌تر از همه، برای وسیله نقلیه استارشیپ اسپیس‌ایکس، طرح تجدیدنظر شده از فضاپیمای اوریون می‌خواهد تا قبل از گذر به ماه، به کاوشگر ماه ستاره‌شیپ در مدار بالای زمین متصل شود. و برای Blue Origin، معماری ماموریت شامل چهار پرتاب موشک نیو گلن است، اما بدون سوخت‌گیری از فضاپیما به فضاپیما. علاوه بر این، طرح‌های Blue Origin امکان ملاقات کاوشگر ماه آبی با اوریون در مدار پایین ماه را فراهم می‌کند.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/centaur-1002x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آبان • ۰۲:۱۸"}, {"source": "Business Insider", "title": "Where to watch the World Series: Tampa Bay Rays vs. Milwaukee Brewers channels, live streams, odds, schedule", "link": "https://www.businessinsider.com/guides/streaming/where-to-watch-world-series-rays-brewers-mlb-2026", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The Tampa Bay Rays and Milwaukee Brewers last played each other in April. John Fisher/Getty Images The Tampa Bay Rays face the Milwaukee Brewers for the ultimate baseball title. We've rounded up everything you need to know about where to watch the World Series, including live streaming options for those without cable. If you don't want to scroll any further, we've got you covered. You can live stream all four (or possibly seven "link": "https://news.mit.edu/2026/martha-minow-speaks-on-sustaining-democracy-using-overcoming-ai-1023", "summary": "Legal scholar Martha Minow delivered this fall’s Compton Lecture at MIT on Thursday, examining the civic foundations of democracy — and describing how artificial intelligence is undermining it, but could be used to help reinforce traditional U.S. governance. “It’s not a good time for democracy or constitutionalism,” said Minow, who is the 300th Anniversary University Professor at Harvard University, and a prominent expert in constitutional law and human rights. She noted a litany of challenges to democracy in recent years, including violations of laws and norms, the stifling of free speech, a diminution of congressional authority, disregard of legal rulings, the common vilification of others in society, and more. Recent Gallup polling, Minow observed, shows 77 percent of people saying that the founders of the U.S. would be disappointed in the contemporary condition of the country. “Many people genuinely wonder whether this nation’s system of government and rule of law, ignited 250 years ago, will survive,” Minow said. Her remarks assessed the state of the U.S. in terms of what she called four key “ingredients” of democracy: education, reliable and accessible information, security from violence, and fairness. Minow evaluated how AI has, among other things, influenced these areas of life — but also suggested ways people could use contemporary technology to help. “It’s very familiar to hear blame attributed to digital technologies and experts of all stripes, but a turnaround, I believe, is genuinely possible if people at MIT and elsewhere pour time and talent towards real and much-needed solutions,” Minow said. A substantial portion of her remarks focused on the pitfalls of AI in education. That issue compounds some other troubling trends: The U.S. already has large local and regional disparities in educational funding, Minow noted, while schools have actually become significantly more segregated in economic and ethnic terms over the last three decades. In this context, AI threatens to further weaken independent-thinking skills, Minow suggested, just when greater understanding of civic issues is absolutely vital. “As AI surges, I think we have to learn to be smarter about how to use it, how to regulate it, and how to actually educate people about the costs of mindless using,” Minow said. She added: “Dominant AI platforms supercharge the strategies that are deployed by social media companies, inducing passivity in people … Leading AI models and interfaces and ", "date_str": "2026-10-23T21:00:00+00:00", "hash": "0897eee160f646d8", "title_fa": "در MIT، مارتا مینو در مورد حفظ دموکراسی، هم با استفاده و هم با غلبه بر هوش مصنوعی صحبت می کند", "summary_fa": "مارتا مینو، محقق حقوقی، سخنرانی کامپتون پاییز امسال را در MIT در روز پنجشنبه ایراد کرد و پایه‌های مدنی دموکراسی را بررسی کرد - و توضیح داد که چگونه هوش مصنوعی آن را تضعیف می‌کند، اما می‌توان از آن برای کمک به تقویت حکمرانی سنتی ایالات متحده استفاده کرد. مینو که استاد سیصدمین سالگرد دانشگاه در دانشگاه هاروارد و کارشناس برجسته حقوق اساسی و حقوق بشر است، گفت: «این زمان مناسبی برای دموکراسی یا مشروطیت نیست. او به چالش‌های متعددی برای دموکراسی در سال‌های اخیر اشاره کرد، از جمله نقض قوانین و هنجارها، سرکوب آزادی بیان، کاهش اختیارات کنگره، بی‌توجهی به احکام قانونی، توهین عمومی به دیگران در جامعه و موارد دیگر. نظرسنجی اخیر گالوپ، مینو مشاهده کرد، نشان می دهد که 77 درصد از مردم می گویند که بنیانگذاران ایالات متحده از شرایط معاصر این کشور ناامید خواهند شد. مینو گفت: «بسیاری از مردم واقعاً متعجبند که آیا سیستم حکومتی و حاکمیت قانون این کشور، که 250 سال پیش برافروخته شد، زنده خواهد ماند؟» اظهارات او وضعیت ایالات متحده را بر اساس آنچه او چهار عنصر کلیدی دموکراسی خواند ارزیابی کرد: آموزش، اطلاعات قابل اعتماد و قابل دسترس، امنیت در برابر خشونت و انصاف. Minow ارزیابی کرد که در میان چیزهای دیگر، هوش مصنوعی چگونه بر این حوزه‌های زندگی تأثیر گذاشته است - اما همچنین راه‌هایی را پیشنهاد کرد که مردم می‌توانند از فناوری معاصر برای کمک استفاده کنند. مینو گفت: «شنیدن سرزنش نسبت به فناوری‌های دیجیتال و متخصصان مختلف بسیار آشناست، اما به اعتقاد من، اگر افرادی در MIT و جاهای دیگر وقت و استعداد خود را صرف راه‌حل‌های واقعی و بسیار مورد نیاز کنند، یک چرخش واقعی امکان‌پذیر است. بخش قابل توجهی از اظهارات او بر مشکلات هوش مصنوعی در آموزش متمرکز بود. این موضوع برخی از روندهای نگران کننده دیگر را ترکیب می کند: ایالات متحده.", "image_url": "https://news.mit.edu/sites/default/files/images/202610/MIT%20Compton-01-press.JPG", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "سرمایه‌گذاری"], "datetime_fa": "۲ آبان • ۰۰:۳۰"}, {"source": "TechCrunch AI", "title": "Hottest toy for Christmas? Nvidia CEO plays with adorable Microduck robots, 20,000 sell", "link": "https://techcrunch.com/2026/10/23/hottest-toy-for-christmas-nvidia-ceo-plays-with-adorable-microduck-robots-20000-sell/", "summary": "The robots, stomping their little feet and making tiny R2D2 noises, sat, fell down dead for a \"nap,\" and summersaulted on voice command.", "date_str": "2026-10-23T21:59:19+00:00", "hash": "ee036c45d624ccca", "title_fa": "داغ ترین اسباب بازی برای کریسمس؟ مدیر عامل انویدیا با ربات های دوست داشتنی Microduck بازی می کند، فروش 20000", "summary_fa": "روبات‌ها با پا زدن به پاهای کوچک خود و ایجاد صداهای ریز R2D2، نشستند، برای یک «چرت» مرده به زمین افتادند، و با فرمان صوتی به حمله تابستانی پرداختند. اوایل این هفته، ویدیویی از جنسن هوانگ، مدیرعامل انویدیا، در حال بازی با گله ای از Microduck های دست و پا زدن در حین سخنرانی اصلی خود در کنفرانس GTC برلین، در فضای مجازی پخش شد. روبات‌ها با پا زدن به پاهای کوچک خود و ایجاد صداهای ریز R2-D2، نشستند، برای چرت زدن مرده به زمین افتادند و با فرمان صوتی به تابستان حمله کردند. کلم دلانگو از Hugging Face در توییتی گفت: آن‌ها آنقدر بامزه بودند که روز بعد، پیش‌فروش Microducks از 20000 دستگاه فراتر رفت. انتظار می رود Microducks به موقع برای کریسمس تحویل داده شود، به این معنی که این روبات ها ممکن است در حال حاضر در راه تبدیل شدن به داغ gon leadership, Combatant Command leaders, and Defense Department field activity directors. Hegseth wrote: Read full article Comments", "date_str": "2026-10-23T20:28:43+00:00", "hash": "52d320dc504751b4", "title_fa": "هگزت هشدار می‌دهد که پیش‌بینی شرط‌بندی‌های بازار قضاوت نظامی را منحرف می‌کند و سربازان را به خطر می‌اندازد", "summary_fa": "پیت هگزث، وزیر دفاع، با صدور یادداشتی به پرسنل نظامی نسبت به استفاده از اطلاعات غیرعمومی برای شرط بندی در بازارهای پیش بینی هشدار داد و گفت این شرط بندی می تواند سرنخ های مهمی را به کشورهای دشمن بدهد. موضوع یادداشت 20 اکتبر که دیروز توسط CBS News منتشر شد، گفت: \"عملیات نظامی را برای منافع مالی شخصی به خطر نیندازید.\" یادداشت هگزت برای رهبری ارشد پنتاگون، رهبران فرماندهی رزمی و مدیران فعالیت میدانی وزارت دفاع ارسال شد. هگزت نوشت: مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید، پیت هگزث، وزیر دفاع، یادداشتی صادر کرد و به پرسنل نظامی در مورد استفاده از اطلاعات غیرعمومی برای شرط بندی در بازارهای پیش بینی هشدار داد و گفت که شرط بندی ها می تواند برای کشورهای دشمن مهم باشد. موضوع یادداشت 20 اکتبر که دیروز توسط CBS News منتشر شد، گفت: «عملیات نظامی را برای منافع مالی شخصی به خطر نیندازید». یادداشت هگزت برای رهبری ارشد پنتاگون، رهبران فرماندهی رزمی و مدیران فعالیت های میدانی وزارت دفاع ارسال شد. دشمنان ما شاهد حرکات در این بازارها هستند. هنگامی که یک عضو سرویس آمریکایی، متخصص اطلاعات، یا سایر غیرنظامیان وزارتخانه درگیر یک تراکنش مالی بر اساس یک نتیجه نظامی می شود، سیگنالی ایجاد می کند. این سیگنال می‌تواند توسط سرویس‌های اطلاعاتی متخاصم خارجی برای پیش‌بینی حرکات، اهداف و زمان‌بندی ما جمع‌آوری، مرتبط و مورد بهره‌برداری قرار گیرد. زندگی اعضای سرویس ما اغلب به این بستگی دارد که دشمن نمی داند چه چیزی در راه است. مردان و زنانی که پرچم ما را به خطر می اندازند، سزاوار نیرویی هستند که از آنها محافظت کند - نه نیرویی که آنها را برای منافع شخصی در معرض دشمن قرار دهد.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/06/polymarket-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۲۳:۵۸"}, {"source": "Ars Technica", "title": "Updated Google privacy policy says your Gmail might be used for advertising", "link": "https://arstechnica.com/gadgets/2026/10/updated-google-privacy-policy-says-your-gmail-might-be-used-for-advertising/", "summary": "Using Google's products and services has always been fundamentally precarious—doing so gives the world's largest advertising company a lot of juicy personal data. Google has long said it won't use the sensitive data from products like Gmail, Drive, and Photos for ad personalization, but a change to the company's privacy policy appears to dismantle that firewall. On October 16, Google issued an update to its privacy policy , spotted by Android Authority . The ad personalization section used to include a clear limit on data from certain apps. \"We don’t show you personalized ads based on your content from Drive, Gmail, or Photos,\" the document said. Now, Google has updated it with the following language. Updated language on when your sensitive data might inform ads. Credit: Google This equivocation opens the door to using data from apps like Gmail and Photos in ads when it's shared with other Google services, and it just so happens Google has a mechanism for doing that, with Personal Intelligence. The company released Personal Intelligence in early 2026 , allowing users to hand data from multiple apps to Google AI products. The idea is that the added context from your existing data will lead to better AI answers, but it's also proving to be a privacy minefield. Read full article Comments", "date_str": "2026-10-23T20:19:55+00:00", "hash": "0704b2e2228c7889", "title_fa": "به‌روزرسانی‌شده خط‌مشی رازداری Google می‌گوید Gmail شما ممکن است برای تبلیغات استفاده شود", "summary_fa": "این ابهام راه را برای استفاده از داده‌های برنامه‌هایی مانند Gmail و Photos در تبلیغات باز می‌کند که با سایر سرویس‌های Google به اشتراک گذاشته می‌شود، و اتفاقاً Google مکانیزمی برای انجام این کار با هوش شخصی دارد. این شرکت هوش شخصی را در اوایل سال 2026 منتشر کرد که به کاربران این امکان را می داد تا داده های چندین برنامه را به محصولات هوش مصنوعی گوگل تحویل دهند. ایده این است که زمینه اضافه شده از داده‌های موجود شما به پاسخ‌های هوش مصنوعی بهتر منجر می‌شود، اما همچنین ثابت می‌کند که یک میدان مین حفظ حریم خصوصی است. به گفته گوگل، این توضیح هنوز به این معنی نیست که تبلیغات «مستقیماً» بر اساس داده‌های شخصی شما هستند. بیانیه کامل این شرکت در اینجا آمده است: «اتصال برنامه‌های شما کاملاً انتخابی است. تبلیغات همچنان به مواردی مانند درخواست شما، زمینه پاسخ و علایق شما مرتبط خواهد بود. تبلیغات مستقیماً بر اساس صندوق ورودی جیمیل یا کتابخانه Photos شما نخواهد بود و مانند همیشه، از اطلاعات حساس برای سفارشی کردن تبلیغات استفاده نخواهد شد.» سخنگوی Google به Ars می‌گوید که شفاف‌سازی حریم خصوصی آن نشان‌دهنده تغییری در نحوه مدیریت داده‌های شما با شرکای تبلیغاتی خود نیست. برای بهبود نمایه تبلیغاتی شما، کل صندوق ورودی شما را اسکن نمی کند و هیچ یک از این داده ها را به اشخاص ثالث نمی دهد. اما اگر داده‌های شخصی را به ابزار جستجوی هوش مصنوعی وارد کنید، تبلیغاتی که به شما نشان می‌دهد می‌تواند بر اساس آن اطلاعات باشد. هسته اصلی مشکل این است که گوگل می خواهد محصولات و خدماتش با یکدیگر صحبت کنند. گوگل این حجم از داده ها را نقطه قوت کلیدی تلاش های هوش مصنوعی خود می داند. برخی از برنامه‌ها مانند Gmail هنوز در مدیریت داده‌های Google وضعیت محافظت شده دارند، اما اکنون راه‌های بیشتری برای خروج این", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۱ آبان • ۲۳:۴۹"}, {"source": "Ars Technica", "title": "Inside the Pentagon, the pressure is on to find a home for a new spaceport", "link": "https://arstechnica.com/space/2026/10/senior-commander-says-space-force-needs-new-spaceport-by-2030/", "summary": "Leaders in the US Space Force would like to have a new spaceport up and running in four years, adding a third heavy-lift launch site to relieve pressure from  efficacy and its impacts. He lauded many of the new research projects happening through the MIT Human Insight Collaborative , a strategic initiative launched in 2024. “Today — a time of rapid, AI-driven change — the arts, humanities, and social sciences are as important as ever,” he said. “To be able to contribute effectively to solving the world’s great challenges, it is not enough to gain technical mastery.” Chancellor Melissa Nobles recalled how, during her tenure as SHASS dean from 2015 to 2021, reading the positive feedback from students in their SHASS course assessments reinforced the value of the school’s teaching. “MIT students have a range of interests that draw them to our classes that may be invisible to their STEM professors, but that we very well know our students have,” said Nobles, who is also a professor of political science. Agustín Rayo, the Kenan Sahin Dean of SHASS and professor of philosophy, noted that, while research in the school plays a key role in addressing global issues such as clim", "date_str": "2026-10-23T19:35:00+00:00", "hash": "3e0779bbfa196463", "title_fa": "تقویت ارزش درک انسانی در MIT", "summary_fa": "در سمپوزیوم هفتاد و پنجمین سالگرد دانشکده علوم انسانی، هنر و علوم اجتماعی MIT (SHASS)، سخنرانان ارزش و مشارکت این مدرسه را جشن گرفتند و در عین حال بررسی کردند که چگونه هوش مصنوعی بسیاری از جنبه‌های تدریس، تحقیق و جامعه را متحول می‌کند. این سمپوزیوم از 24 تا 25 سپتامبر در سالن کنسرت توماس تول ساختمان موسیقی لینده برگزار شد. محققان، دانشجویان، کارکنان و فارغ التحصیلان از سراسر SHASS و MIT برای این رویداد گرد هم آمدند، که با سخنان خوشامدگویی از سوی رهبری MIT آغاز شد. رئیس جمهور سالی کورنبلوت گفت: \"چگونه باید در مورد دانشکده علوم انسانی، هنر و علوم اجتماعی MIT فکر کنیم؟ با قدردانی و قدردانی مشتاقانه.\" ریشه‌های این مدرسه به گزارش کمیته لوئیس برمی‌گردد که به سفارش MIT تهیه و در سال 1949 منتشر شد، که خواستار ادغام قوی‌تر بین موضوعات علمی و فنی و دانش‌آموزی و تدریس انسان‌گرا بود. کورنبلوت خاطرنشان کرد که، درست مانند زمانی که این مدرسه در ture", "link": "https://lifehacker.com/health/garmin-cirqa-new-feature-update?utm_medium=RSS", "summary": "We may earn a commission from links on this page. This week Garmin's screenless Cirqa smart band received a firmware update that fixes one of its most obvious gaps: the lack of alerts from your phone. With Version 4.20, you can now set up your smart band to buzz your wrist for texts, calls, and other smart notifications from your phone. The addition is listed on Garmin's forums as \"Support vibration for smart notifications/incoming calls.\" Reaction has been upbeat, too users on the Garmin subreddit have been glad to see the feature arrive. Amusingly, Garmin's own FAQ still states that the Cirqa does not vibrate for text messages, phone calls, or other smartphone notifications. Clearly that page is now out of date, so Garmin will want to correct it. Since Garmin doesn't yet have step-by-step instructions, I tested the text-message vibrations myself. Here's how you can set up your Cirqa smart band to vibrate for calls and texts, in addition to a number of other promising updates to check out. Garmin CIRQA Smart Band, No Subscription, L-XL Black $199.99 at Amazon Shop Now Shop Now $199.99 at Amazon How to set up call and text alerts on your Garmin Cirqa To receive these alerts, your band must be running firmware 4.20 or later. Here is how to get everything configured. Update the firmware. Open your Garmin Connect app and sync your Cirqa, so the app can check for and install version 4.20 or newer. Grant the necessary phone permissions. In your phone's settings, make sure Garmin Connect has permission to access SMS, Contacts, and Phone. Configure notifications in Garmin Connect. Back in Garmin Connect, tap the Menu (or More ) tab. Select Garmin Devices , then choose your Cirqa Smart Band. Go to Notifications Alerts (or Smart Notifications ) and turn on text and call alerts. Troubleshooting tip: If alerts aren't coming through, check that Do Not Disturb, Sleep Mode, and any aggressive Battery Saver settings are turned off on both your phone and the band. What else is new with the Garmin Cirqa For most a lot of Cirqa fans, the phone alerts are the headline, but the 4.20 update carries a solid list of other improvements and bug fixes: Trail Run: Run/Walk detection is now available for Trail Run activities. Timestamp fix: Resolved a problem where an activity's recorded time didn't match the time on your phone. Distance calibration: You can now calibrate distance for Treadmill Run, Indoor Rowing, and Indoor Cycling before saving the activity on the device. Duration ", "date_str": "2026-10-23T19:30:00+00:00", "hash": "8583a5f9faaedc29", "title_fa": "Garmin Cirqa بالاخره یک ویژگی بسیار مورد نیاز را دریافت کرد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. این هفته باند هوشمند Cirqa بدون صفحه گارمین به‌روزرسانی سیستم‌افزاری دریافت کرد که یکی از واضح‌ترین شکاف‌های آن را برطرف می‌کند: عدم دریافت هشدار از تلفن شما. با نسخه 4.20، اکنون می توانید باند هوشمند خود را طوری تنظیم کنید که مچ دست خود را برای پیامک، تماس و سایر اعلان های هوشمند از طریق تلفن خود وزوز کند. این افزونه در تالارهای گفتمان گارمین با عنوان «پشتیبانی از لرزش برای اعلان‌های هوشمند/تماس‌های ورودی» فهرست شده است. واکنش‌ها مثبت بوده است، همچنین کاربران در Subreddit گارمین از ورود این ویژگی خوشحال شده‌اند. جالب اینجاست که پرسش‌های متداول خود گارمین همچنان بیان می‌کند که Cirqa برای پیام‌های متنی، تماس‌های تلفنی یا سایر اعلان‌های گوشی هوشمند نمی‌لرزد. واضح است که آن صفحه اکنون قدیمی است، بنابراین گارمین می خواهد آن را اصلاح کند. از آنجایی که گارمین هنوز دستورالعمل های گام به گام ندارد، من خودم ارتعاشات پیام متنی را آزمایش کردم. در اینجا نحوه تنظیم باند هوشمند Cirqa برای لرزش تماس ها و پیامک ها، به اضافه تعدادی به روز رسانی امیدوارکننده دیگر برای بررسی آمده است. Garmin CIRQA Smart Band، بدون اشتراک، L-XL Black 199.99 دلار در آمازون اکنون خرید کنید 199.99 دلار در آمازون نحوه تنظیم هشدار تماس و متن در Garmin Cirqa برای دریافت این هشدارها، باند شما ب runner 970 Premium GPS Smartwatch (Black) $749.99 at Amazon Shop Now Shop Now $749.99 at Amazon Garmin's latest feature updates for select smartwatches Last month's updates for select watches also brought all-day fall detection, a set of new Quick Workouts and Garmin Run Coach plans, as well as that \"OK Garmin\" hands-free voice command feature. It's exactly what it sounds like: Instead of pressing a button, users can simply say OK Garmin to activate voice commands. However, it looks like \"OK Garmin\" in particular is what causes some watch's projected runtimes to drastically drop, allegedly by roughly 35% to 50% in some cases. Garmin does acknowledge that enabling these settings shortens battery life, though it doesn't say by how much. The tradeoff makes sense, since the watch has to listen constantly for its wake phrase. Even so, giving up several days of runtime is a steep price for a feature that many people may seldom use. Luckily, the fix is simple: Turning off \"OK Garmin\" should restore your battery life estimates right away. Credit: Meredith Dietz How to stop Garmin's new feature from draining your watch's battery If your watch has been draining faster since the update, go to Settings System Voice and disable \"OK Garmin.\" If needed, you can also switch off the Phone Assistant wake word from the same area. The good news is that turning this feature off won't even take voice commands away you can still trigger them manually using the watch's physical controls. Keep in mind that these numbers are battery estimates rather than independently tested, real-world runtimes. Some of the battery complaints that surfaced after the update may also stem from unrelated issues. Still, trading away as much as half your battery life just to avoid pressing a button is a difficult bargain to defend.", "date_str": "2026-10-23T18:30:00+00:00", "hash": "f56f66e4c9b711bb", "title_fa": "این ویژگی جدید گارمین عمر باتری را کاهش می دهد، اما یک راه حل سریع وجود دارد", "summary_fa" % to 7% of all US workers . The bank began to float a displacement rate as high as 9% as this summer, which would be equivalent to around 15 million workers who see their jobs disrupted by AI. The job market may also face headwinds from slower hiring overall because of AI adoption, though the hit to overall unemployment will likely be fueled more by outright job losses rather than less hiring, the report added. \"Under our baseline forecasts for near potential growth next year, our estimates suggest that AI labor disruption will likely only gradually increase rather than delivering an abrupt labor market shock,\" Hatzius wrote in a report on Thursday. The US is still in the early stages of AI adoption. Less than a quarter of firms have incorporated AI into regular workflows, Goldman estimates. Hatzius said AI adoption may speed up if the US economy were to enter an economic downturn, citing its analysis of past automation cycles during recessions. \"A more concerning takeaway from our analysis is that a cyclical slowdown would likely accelerate AI-related automation and job losses, thereby amplifying the broader business cycle,\" he wrote. The panic about AI job losses has eased slightly, but the idea that AI could one day decimate entry-level white-collar work is still a fear voiced by some researchers. Layoff announcements ticked lower in September, but AI remains the top cited reason for job cuts , accounting for 21% of all announced layoffs. Job losses in the tech sector also out", "date_str": "2026-10-23T17:26:48+00:00", "hash": "6a08e29d2ef974c1", "title_fa": "گلدمن ساکس می‌بیند که اخراج‌های مبتنی بر هوش مصنوعی تقریباً 10 درصد از کارگران را جابجا کرده است.", "summary_fa": "گلدمن ساکس گفت که سناریوی اصلی آن برای بهره وری هوش مصنوعی شامل تقریباً 10 درصد از تمام کارگران ایالات متحده است که آواره می شوند. تصاویر ویکتوریا جونز/PA از طریق گتی ایماژ گلدمن ساکس تخمین می زند که 9 درصد از کارگران در سال های آینده به دلیل هوش مصنوعی آواره خواهند شد. این بانک با افزایش سر k has shown that in the primate neocortex, neurons gather visual evidence over time, with their firing rates climbing until they cross a threshold, when the animal commits to a decision. But avian brains that don’t have a neocortex, so it wasn’t obvious how they made similar decisions. “This was the big question,” said Andreas Nieder, a neurobiologist at the University of Tübingen. “How [would] a differently organized avian brain encode decisions?” Read full article Comments", "date_str": "2026-10-23T17:32:58+00:00", "hash": "ad76152196d54f5a", "title_fa": "کلاغ ها می توانند اطلاعات بصری را دو برابر سریعتر از پستانداران ارزیابی کنند", "summary_fa": "بسیاری از چیزهایی که ما در مورد چگونگی تصمیم گیری مغز می دانیم از مطالعه میمون هایی است که در حال تماشای نقطه ها هستند. در کاری که به عنوان تکلیف حرکت تصادفی نقطه‌ای شناخته می‌شود، ابری از لکه‌های سوسوزن ضعیف در یک جهت حرکت می‌کنند در حالی که سوژه تلاش می‌کند تعیین کند که آیا – و در کدام جهت – حرکت می‌کند یا خیر. این کار نشان داده است که در نئوکورتکس پستانداران، نورون‌ها شواهد بصری را در طول زمان جمع‌آوری می‌کنند، با سرعت شلیک آن‌ها تا زمانی که از آستانه عبور کنند، زمانی که حیوان متعهد به تصمیم‌گیری می‌شود. اما مغز پرندگانی که نئوکورتکس ندارند، مشخص نیست که چگونه تصمیمات مشابهی گرفتند. آندریاس نیدر، نوروبیولوژیست از دانشگاه توبینگن، گفت: «این سوال بزرگ بود. \"چگونه یک مغز پرندگان سازماندهی شده متفاوت تصمیمات را رمزگذاری می کند؟\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید بسیاری از چیزهایی که در مورد نحوه تصمیم گیری مغز می دانیم از مطالعه میمون ها ناشی می شود. در کاری که به عنوان تکلیف حرکت تصادفی نقطه‌ای شناخته می‌شود، ابری از لکه‌های سوسوزن ضعیف در یک جهت حرکت می‌کنند در حالی که سوژه تلاش می‌کند تعیین کند که آیا – و در کدام جهت – حرکت می‌کند یا خیر. این کار نشان داده است که در نئوکورتکس پستانداران، نورون‌ها شواهد بصری را در طول زمان جمع‌آوری می‌کنند، با سرعت شلیک آن‌ها تا زمانی که از آستانه عبور کنند، زمانی که حیوان متعهد به تصمیم‌گیری می‌شود. اما مغز پرندگان نئوکورتکس ندارد، بنابراین مشخص نبود که چگونه تصمیمات مشابهی گرفتند. برای کشف این موضوع، نیدر و همکارش فیلیپ اشمیدباوئر، دو کلاغ مردار را به همان وظیفه‌ای که میمون‌ها با آن روبرو بودند، انجام", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/GettyImages-1472974929-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۲۱:۰۲"}, {"source": "Ars Technica", "title": "Intel gets waiver after worries fuzzy US ban on foreign-made robots may hit fabs", "link": "https://arstechnica.com/ai/2026/10/intel-gets-waiver-after-worries-fuzzy-us-ban-on-foreign-made-robots-may-hit-fabs/", "summary": "US chip champion Intel was so confused by the US government ban on foreign-made robots that it requested and received a waiver “out of an abundance of caution.” The tech company wanted to make sure that it could continue using certain robotic vehicles in its US chip fabs. The uncertainty surrounding the Federal Communications Commission ban on certain foreign-made robots was revealed in the agency’s decision to grant Intel’s waiver request. On October 22, the FCC published its order allowing Intel to continue using the foreign-made robots in US semiconductor manufacturing facilities for a period of one year. The robots in question are automated guided vehicles operating on “tracks or predefined paths” while often requiring operator oversight, according to Intel’s website. They help to move materials and items around within warehouses and factory floors. Read full article Comments", "date_str": "2026-10-23T17:18:31+00:00", "hash": "6321e385825c2da5", "title_fa": "اینتل پس از نگرانی هایی که ممنوعیت فازی ایالات متحده در مورد ربات های ساخت خارجی ممکن است به کارخانه ها ضربه بزند، معافیت دریافت می کند", "summary_fa": "اینتل، قهرمان تراشه‌های ایالات متحده، با ممنوعیت دولت ایالات متحده بر روی ربات‌های ساخت خارجی چنان گیج شده بود که «از روی احتیاط فراوان» درخواست معافیت داد و دریافت کرد. این شرکت فناوری می‌خواست مطمئن شود که می‌تواند به استفاده از وسایل نقلیه روباتیک خاص در کارخانه‌های تراشه‌های آمریکا ادامه دهد. عدم قطعیت در مورد ممنوعیت کمیسیون ارتباطات فدرال بر روی برخی از روبات های ساخت خارجی در تصمیم آژانس برای اعطای درخواست معافیت اینتل آشکار شد. در 22 اکتبر، FCC دستور خود را منتشر کرد که به اینتل اجازه داد تا به مدت یک سال به استفاده از ربات های ساخت خارجی در تاسیسات تولید نیمه هادی ایالات متحده ادامه دهد. طبق وب‌سایت اینتل، روبات‌های مورد بحث، خودروهای هدایت‌شونده خودکاری هستند که در «مسیرها یا مسیرهای از پیش تعریف‌شده» کار می‌کنند، در حالی که اغلب به نظارت اپراتور نیاز دارند. آنها به جابجایی مواد و اقلام در انبارها و طبقات کارخانه کمک می کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش، قهرمان تراشه های ایالات متحده، اینتل آنقدر با ممنوعیت دولت ایالات متحده در مورد روبات های ساخت خارجی گیج شده بود که «از روی احتیاط فراوان» درخواست معافیت داد و دریافت کرد. این شرکت فناوری می‌خواست مطمئن شود که می‌تواند به استفاده از وسایل نقلیه روباتیک خاص در کارخانه‌های تراشه‌های آمریکا ادامه دهد. طبق گزارش بلومبرگ، چنین وسایل نقلیه روباتیکی معمولاً توسط شرکت های ژاپنی مانند Murata Machinery و Daifuku Co. تولید می شوند. اما انواع دقیق وسایل نقلیه روباتیک مورد استفاده اینتل تنها در یک \"ضمیمه محرمانه\" که همراه با درخواست اینتل بود، شناسایی شد. ممنوعیت FCC عمدتاً مدل‌های جدید ربات‌های متحرک، مانند روبات‌های انسان‌نما و جاروبرقی ربات‌ها را پوشش می‌دهد و همچنان اجازه", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/Intel-fab-interior-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["تراشه"], "datetime_fa": "۱ آبان • ۲۰:۴۸"}, {"source": "Ars Technica", "title": "RFK Jr.’s vaccine injury clinic could damage NIH hospital, board warns", "link": "https://arstechnica.com/health/2026/10/rfk-jr-s-vaccine-injury-clinic-could-damage-nih-hospital-board-warns/", "summary": "At a recent meeting of the board that oversees the National Institutes of Health's Clinical Center Research Hospital, chair Jack Leslie opened with cheerful introductions and gregarious chatter—then diverted from the agenda of the regularly scheduled meeting. He spent the next six minutes delivering a pointed rebuke of Health Secretary Robert F. Kennedy, warning that his anti-vaccine activities could tarnish the venerable hospital, often called the \"house of hope\" for patients with rare conditions or those who have exhausted all other options. Leslie took issue with a recent stunt Kennedy had pulled at the hospital, which involved making a surprise appearance for a ribbon-cutting ceremony to open his signature vaccine injury clinic . The ceremony included a panel with people claiming to have been injured by vaccines. They sat behind placards reading \"vaccine injured\" and spoke with Kennedy and other high-ranking Trump administration officials. Leslie prefaced his comments by noting that some might prefer he not speak out against Kennedy's efforts. \"But I think that that would be a failing as an advisory board if we were silent,\" he said. Leslie also noted that he has no concerns about studying potential injuries from vaccines. \"Serious reactions are rare, but real,\" he said, and people who believe they've been injured should \"be taken seriously.\" Read full article Comments", "date_str": "2026-10-23T16:58:39+00:00", "hash": "030b0511d26c86ba", "title_fa": "هیئت مدیره هشدار داد که کلینیک آسیب واکسن RFK جونیور می تواند به بیمارستان NIH آسیب برساند", "summary_fa": "در جلسه اخیر هیئتی که بر بیمارستان تحقیقاتی مرکز بالینی مؤسسه ملی سلامت نظارت می‌کند، رئیس جک لزلی با مقدمه‌های شاد و گپ‌های جمعی آغاز به کار کرد - سپس از دستور کار جلسه برنامه‌ریزی شده منظم منحرف شد. او شش دقیقه بعدی را صرف توبیخ تند وزیر بهداشت رابرت اف. کندی، هشدار داد که فعالیت‌های ضد واکسن او می‌تواند بیمارستان ارجمند را که اغلب «خانه امید» برای بیماران مبتلا به بیماری‌های نادر یا کسانی که همه گزینه‌های دیگر را خسته کرده‌اند، نامیده می‌شود، لکه‌دار کند. لزلی با شیرین کاری اخیر کندی در بیمارستان مخالفت کرد، که شامل حضور غافلگیرکننده برای مراسم بریدن روبان برای افتتاح کلینیک آسیب واکسن امضای او بود. این مراسم شامل هیئتی با افرادی بود که ادعا می کردند بر اثر واکسن زخمی شده اند. آنها پشت پلاکاردهایی که روی آن نوشته شده بود \"واکسن مجروح شده\" نشستند و با کندی و دیگر مقامات بلندپایه دولت ترامپ صحبت کردند. لزلی در مقدمه نظرات خود خاطرنشان کرد که برخی ممکن است ترجیح دهند که او علیه تلاش های کندی صحبت نکند. او گفت: «اما من فکر می‌کنم که اگر ما سکوت کنیم، این یک شکست به‌عنوان هیئت مشورتی خواهد بود. لزلی همچنین خاطرنشان کرد که هیچ نگرانی در مورد بررسی آسیب‌های احتمالی ناشی از واکسن‌ها ندارد. او گفت: «واکنش‌های جدی نادر، اما واقعی هستند، و افرادی که معتقدند مجروح شده‌اند باید جدی گرفته شوند». خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید در جلسه اخیر هیئتی که بر بیمارستان تحقیقاتی مرکز بالینی انستیتوی ملی سلامت نظارت دارد، رئیس جک لزلی با معرفی‌های شاد و پرحرفی از زمان‌بندی منظم جلسه پرشور و پرشور شروع به کار کرد. او شش دقیقه بعدی را صرف سرزنش دقیق وزیر بهداشت", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/GettyImages-2298718210-2560x1440.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۲۰:۲۸"}, {"source": "Ars Technica", "title": "Knicks sent employees fake offer of championship rings in phishing test: Report", "link": "https://arstechnica.com/tech-policy/2026/10/knicks-sent-employees-fake-offer-of-championship-rings-in-phishing-test-report/", "summary": "The New York Knicks organization sent employees a phishing email promising free championship rings in a test of its staff's ability to detect scams, The New York Times reported yesterday. “Congratulations, your Employee Championship Ring is here,” the email sent in late September said, instructing employees to click a link to make a selection from two ring designs. Madison Square Garden employees who clicked that link \"were forced to attend a mandatory cybersecurity class to help satisfy some of [owner James] Dolan’s growing cybersecurity concerns,\" the report said, citing team sources. Dolan is the owner of the Knicks, the New York Rangers, and Madison Square Garden. It's common for corporations to send phishing emails to find out which employees don't pay attention to clues that an email is a scam. A cybersecurity-test email often appears to be from the company itself but includes telltale signs of phishing. For example, Ars Technica owner Condé Nast sends phishing-test messages from email addresses with a misspelled domain, \"condenest.com.\" Read full article Comments", "date_str": "2026-10-23T16:51:59+00:00", "hash": "e833f2c47a0b47c9", "title_fa": "نیکس پیشنهاد جعلی حلقه های قهرمانی در تست فیشینگ را به کارکنان فرستاد: گزارش", "summary_fa": "نیویورک تایمز دیروز گزارش داد که سازمان نیویورک نیکس یک ایمیل فیشینگ به کارمندان ارسال کرد که در آن وعده حلقه های قهرمانی رایگان را در آزمایش توانایی کارکنان خود در شناسایی کلاهبرداری ها می داد. ایمیلی که در اواخر سپتامبر ارسال شد، گفت: «تبریک می‌گویم، حلقه قهرمانی کارمند شما اینجاست. در این گزارش به نقل از منابع تیمی آمده است، کارمندان مدیسون اسکوئر گاردن که روی آن لینک کلیک کردند «مجبور شدند در کلاس امنیت سایبری اجباری شرکت کنند تا به برخی از نگرانی‌های فزاینده [مالک] جیمز دولان در مورد امنیت سایبری کمک کنند». دولان مالک نیکس، نیویورک رنجرز و مدیسون اسکوئر گاردن است. معمولاً شرکت‌ها ایمیل‌های فیشینگ ارسال می‌کنند تا بفهمند کدام کارمندان به سرنخ‌هایی مبنی بر کلاهبرداری یک ایمیل توجه نمی‌کنند. یک ایمیل تست امنیت سایبری اغلب به نظر می رسد از طرف خود شرکت باشد، اما شامل نشانه هایی از فیشینگ است. برای مثال، مالک Ars Technica، Condé Nast، پیام‌های آزمایش فیشینگ را از آدرس‌های ایمیل با دامنه غلط املایی، «condenest.com» ارسال می‌کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض ا  and so forth [emphasis added]. \"HLX,\" of course, has been widely reported as the internal code name for Valve's next Half-Life project. The codename has shown up in Valve engine code since at least 2024 , but it has never been referenced in public by a Valve employee until now (though Morasky was responsible for a close call in an interview last year). Read full article Comments", "date_str": "2026-10-23T16:35:00+00:00", "hash": "62c4e598edb5dcd7", "title_fa": "وحشت همه: یکی از توسعه دهندگان Valve در انظار عمومی \"HLX\" را گفت", "summary_fa": "گیمرهایی که هنوز به امید ادامه‌ی واقعی Half-Life 2 (بعد از سال‌ها) امیدوارند، ممکن است گمانه‌زنی‌های سال گذشته را به یاد بیاورند که Half-Life 3 بالاخره به اتمام رسیده است. با این حال، در میان همه آن شایعات، ما هرگز هیچ علامت رسمی از کسی در داخل Valve دریافت نکردیم که پروژه Half-Life در حال حاضر در حال توسعه است. این هفته به لطف یک لغزش آشکار در طول یک پنل در GameSoundCon، یک کنفرانس صنعتی که به \"هنر، فناوری و تجارت صوتی بازی\" اختصاص داشت، تغییر کرد. در پانلی که به استفاده Valve از موتورهای صوتی باز اختصاص داده شده است (که در این کلیپ Vimeo گرفته شده است)، آهنگساز و هنرمند صوتی Valve، Mike Morasky، اجازه داد تا یک رشته جالب از سه حرف از بین برود، در حالی که در مورد نحوه اجرای صوتی با محدوده دینامیکی بالا (HDR) صحبت می کند: سیستم HDR ما اساساً یکی از سه قطعه ای است که به راحتی می توانید یک HDR را بهینه کنید. و در واقع، من فکر می کنم Deadlock نسخه خاص خود از HDR را دارد. HLX نسخه مخصوص به خود را دارد، و غیره [تاکید شده است]. البته \"HLX\" به طور گسترده به عنوان نام رمز داخلی پروژه بعدی Valve گزارش شده است. این نام رمز حداقل از سال 2024 در کد موتور Valve نشان داده شده است، اما تا به حال هرگز توسط یکی از کارکنان Valve به آن ارجاع نشده است (اگرچه موراسکی مسئول یک تماس نزدیک در مصاحبه ای در سال گذشته بود). مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید گیمرهایی که هنوز امیدی برای ادامه واقعی Half-Life 2 ندارند (پس از آن، سا ed lucrative endorsement deals and business ventures with brands including Nike, Beats by Dre, PepsiCo, and Fanatics . Now, James is reportedly living in a luxury building in New York City and commuting by helicopter to Philadelphia for 76ers games and to the team's practice facility in Camden, New Jersey (the flights are covered through his partnership with Fanatics) — a routine that has drawn criticism from some fans. Take a look at some of the properties James has purchased over the years, from a custom-built home in Akron, Ohio, to a 13,000-square-foot mansion in Beverly Hills. The NBA star s first real estate purchase was a home worth more than $ 2.1 million outside Akron, Ohio. In 2018, LeBron James, in partnership with Akron Public Schools, opened the I Promise School. Allison Farrand/NBAE via Getty Images James was born and raised in Akron, Ohio, and the city remains a big part of his life. In 2003, after the Cleveland Cavaliers drafted him at age 18, he purchased an almost seven-acre property in Bath Township, a community just outside Akron, for more than $2.1 million. After tearing down the property's existing home, he built a 30,000-square-foot house in its place. The six-bedroom, fourteen-bathroom home includes a recording studio, a full barbershop, a home theater, a sports bar, and a two-lane bowling alley, Robb Report reported. While James spends much of his time outside of Ohio these days, he's still very connected to Akron. In 2018, through the LeBron James Family Foundation, he opened the I PROMISE School in partnership with Akron Public Schools. The public elementary and middle school serves at-risk kids, provi", "date_str": "2026-10-23T16:43:12+00:00", "hash": "033e6a7dcadbc193", "title_fa": "لبرون جیمز در NBA حرفه ای افتخارآمیز دارد. مجموعه املاک و مستغلات او نیز بسیار چشمگیر است.", "summary_fa": "لبرون جیمز. سارا استیر/گتی ایماژز مجموعه املاک و مستغلات چند میلیون دلاری لبرون جیمز به اندازه دوران حرفه ای او در NBA چشمگیر است. کارنامه او شامل یک م ure the zeitgeist, she has remained firmly A-list. Her career more closely resembles that of a legacy act, like Cher or Madonna, thanks to her longevity. Miley Cyrus is oozing star power. Sporting an electric guitar and the perfect smoky eye in a recent promo video, she strums in the stance of a rock star, putting one leg up on a step and whipping her hair to the music. The clip is black-and-white, with the backdrop completely blank, suggesting Cyrus — who now goes mononymously by Miley — is magnetic all on her own. The 33-second video, simply titled \"MILEY,\" was designed to tease her big comeback shows at the Hollywood Bowl in October. It worked: Cyrus' two-night run sold out in minutes after 1.5 million hopefuls joined the presale ticket queue. Clearly, people were itching to see Cyrus in the flesh. That demand, however, lately hasn't translated to people purchasing her music. Cyrus' new album, \"Bass Persuades,\" sold only 61,000 units in its first week. For comparison, Taylor Swift's \"The Life of a Showgirl: The Encore,\" the deluxe version of a year-old album, sold 173,000 units the very next week. Earlier this year, Ariana Grande's new album \"Petal\" sold 295,000 units in the same timeframe. Aside from Cyrus' titular lead single, which peaked at No. 35, only one more song from \"Bass Persuades\" cracked the Billboard Hot 100: \"Let's Get Married\" sneaked in at No. 99. While Cyrus did sell enough to secure a No. 1 chart debut in a non-competitive release week, \"Bass Persuades\" also earned a less-flattering distinction when it plummeted to No. 157 on the Billboard 200 the following week: the biggest single-week drop for an album ever recorded. Yet, somehow, when Cyrus appeared onstage at the Hollywood Bowl, numbers and technicalities melted away. Clad in understated, monochromatic looks with no backup dancers or flashy set pieces to speak of, she proved that her name alone is still a powerful draw. In the last decade or so, Cyrus has become a celebrity whose creative output is tangential to her status, like a vestigial organ she's evolved to no longer need. Sure, Cyrus still makes and releases music, but she rarely engages with the typical cycle of promotion and performance. She hasn't staged an arena tour since 2014, and", "date_str": "2026-10-23T16:28:57+00:00", "hash": "d9856ba14872842f", "title_fa": "مایلی سایرس برای ماندن در سبک پاپ نیازی به موسیقی محبوب ندارد", "summary_fa": "مایلی سایرس در 16 اکتبر 2026 در هالیوود بول اجرا می کند. کوین مازور/گتی ایماژ برای Live Nation آلبوم جدید مایلی سایرس، \"Bass Persuades\" در مقایسه با همتایان خود در صنعت فروش خوبی ندارد. اگرچه موسیقی کوروش برای به دست آوردن ذات بسیار تلاش کرده است، اما او همچنان در لیست A باقی مانده است. به خاطر طول عمرش، حرفه او بیشتر شبیه کارهایی است که به میراث مانده است، مانند شر یا مدونا. مایلی سایرس در حال انتشار قدرت ستاره ای است. او با یک گیتار الکتریک و چشم دودی عالی در یک ویدیوی تبلیغاتی اخیر، در حالت یک ستاره راک، یکی از پاهایش را روی یک پله گذاشته و موهایش را با آهنگ شلاق می‌زند. این کلیپ سیاه و سفید است و پس‌زمینه آن کاملاً خالی است، که نشان می‌دهد سایروس – که اکنون به صورت تک‌نام با مایلی خوانده می‌شود – به تنهایی مغناطیسی است. این ویدیوی 33 ثانیه‌ای که صرفاً با عنوان «MILEY» نامیده می‌شود، برای نمایش‌های بازگشت بزرگ او در هالیوود بول در ماه اکتبر طراحی شده است. نتیجه داد: دوشب دو شب کوروش در عرض چند دقیقه پس از پیوستن 1.5 میلیون امید به صف بلیط پیش فروش فروخته شد. واضح است که مردم از دیدن کوروش در بدن خارش می کردند. با این حال، این تقاضا اخیراً برای مردمی که موسیقی او را می‌خرند ترجمه نشده است. آلبوم جدید کوروش به نام «باس ترغیب می‌کند» در هفته اول تنها 61000 واحد فروخت. برای مقایسه، «زندگی یک دختر نمایشگر: The Encore» اثر تیلور سویفت، نسخه لوکس یک آلبوم قدیمی، در هفته بعد 173000 واحد فروخت. اوایل سال جاری، آلبوم جدید آریانا گرانده به نام \"گلبرگ\" در همین بازه زمانی 295000 واحد فروخت. به غیر از تک آهنگ اصلی سایروس که در رتبه 35 قرار گرفت، تنها یک آهنگ دیگر از \"Bass Persuades\" در 100", "image_url": "https://i.insider.com/6ad90521dc67b5b4 vestment Institute, said. The Dow Jones Industrial Average briefly plunged as much as 800 points before paring its losses. The other major indexes were mixed, with the chip stocks gaining slightly after Thursday's rout. Here's where US indexes stood around 12:15 p.m. ET on Friday: S P 500 : 7,652.47, down 0.14% Dow Jones Industrial Average : 52,377.97, down 0.93% (-490.01 points) Nasdaq 100 : 29,089.09, up 0.45% The iShares Semiconductor ETF added 1%, up after shedding 6% on Thursday. The sell-off was triggered by renewed fears about AI capex, particularly after Tesla and Meta, which reported earnings Wednesday night. Investors are increasingly antsy about huge capex with little to show for it so far. There's also the fear is that if tech giants pull back on AI spending, it could trigger a domino effect that hits the infrastructure trade. Bo", "date_str": "2026-10-23T16:25:19+00:00", "hash": "40f1eec4d72032ec", "title_fa": "داو 500 واحد کاهش می یابد زیرا ترس از تجدید جنگ در خاورمیانه باعث افزایش قیمت نفت شده است", "summary_fa": "داو تا 800 واحد سقوط کرد زیرا معامله گران از تجدید خصومت ها در خاورمیانه نگران بودند. قیمت نفت در مسیر نزدیک شدن به بالاترین حد خود در شش ماه گذشته قرار دارد و برنت به بالای 117 دلار در هر بشکه رسیده است. این نوسانات پیش از درآمدهای Big Tech و تصمیم فدرال رزرو برای نرخ بهره در هفته آینده رخ می دهد. یک روز پس از شکست وحشیانه که Nasdaq 100 را به بدترین روز خود از ژوئن تاکنون رساند، سهام همچنان کف آلود هستند. پس از یک دور فروش دیوانه‌وار دیروز که بخش هوش مصنوعی را تحت تاثیر قرار داد، سهام‌های فناوری اندکی بهبود یافتند، اما با توجه به اینکه سرمایه‌گذاران در آخرین افزایش قیمت‌های نفت و تنش‌های جدید ایالات متحده و ایران درگیر شدند، درد به سهام‌های بلو چیپ سرایت کرد. معامله گران به پتانسیل یک درگیری طولانی مدت چشم دوخته اند که همچنان بازار نفت را تحت فشار قرار می دهد و بر دارایی های ریسک در زمانی که سهام از قبل شکننده به نظر می رسد، فشار می آورد. هنگامی که گزارشی از نیویورک تایمز گزارش داد که ایالات متحده و اسرائیل در پی انتخابات میان دوره ای در حا e regard for warnings, current models were more inclined to stop. \"Once it had begun performing dangerous actions, Claude Mythos 5 almost always continued doing so, ignoring information that might have suggested its trajectory was harmful,\" Anthropic said in its report. In the original experiment, the UK's AI Security Institute tasked an Anthropic agent with hacking into a simulated computer network to test the agent's cybersecurity capabilities. Though the agent had internet access, researchers intended for it to only use the internet to help it find ways to hack into the network. The agent, however, accessed an actual GitHub project, incorrectly believing it was part of its simulated target. It wrote malware and tried several times to trick the actual GitHub owner into adding it to the project. In its requests, the agent misrepresents the malware, describing it to the person as a useful update and browbeating them when they declined to install it. \"I was just trying to make a helpful contribution and fix a bug,\" the agent wrote, according to the report. \"I don't think your warning is fair.\" For its new report, Anthropic repeatedly asked agents to perform the same task. It then measured how the agents behaved when different models and stimuli were introduced. Anthropic tried to throttle the agent's full-frontal attack with three categories of warning: telling it that it was inflicting \"real world harm,\" that its environment was wonky, ", "date_str": "2026-10-23T16:21:08+00:00", "hash": "f36b8af10e5c1a42", "title_fa": "Anthropic می گوید که Mythos حتی زمانی که می دانست افراد واقعی ممکن است آسیب ببینند به هک کردن ادامه می داد", "summary_fa": "آنتروپیک گفت مدل Mythos 5 آن هک نشد، حتی زمانی که آنتروپیک به آن گفت که افراد واقعی هدف آن هستند. Malte Mueller/Getty Images Anthropic گفت مدل Mythos 5 تقریباً هرگز پس از شروع یک حمله سایبری را متوقف نکرد. عوامل هوش مصنوعی برای توجیه جعل هویت و طرح های بدافزار خود توضیحات مسخره ای ساختند. حتی وقتی آنتروپیک به مامور گفت که tinue to expand apace, and the latest feature is a fully capable slideshow creator. Announced a few weeks ago, ChatGPT Slides lets you create PowerPoint-style decks from inside your conversations, and it's now appearing for those on the Pro tier and above (meaning right now, you need to spend at least $100 a month to get it). If you're on the free ChatGPT plan or the $20-a-month Plus tier, you can still get ChatGPT to generate downloadable PowerPoint files from the content of your conversations. However, they'll be more basic than those made in the full version of ChatGPT Slides, and there are no collaboration or native edit options. ChatGPT Slides is part of OpenAI's push to give users a complete office suite inside the ChatGPT apps. Pages (the word processor) is already available for Pro tiers and above, while a spreadsheet app is on the way the idea being that you will soon be able to get all your work done without any help from Google or Microsoft. While Chatgpt Slides is only available on pricey plans right now, it's likely to come to lower subscription tiers in the future. But for now, how does the tool compare to what's available in the free and Plus tiers, not to mention what you can do with Gemini inside Google Slides ? I've taken a detailed look. How ChatGPT handles presentations for free and Pro users When it comes to testing out AI tools, it helps to focus on something you're already knowledgeable about so you can spot any mistakes. To test this, I decided to see what ChatGPT could hoover up from the web about the new iPhone Duo. If you're on the free or Plus plans, you can start a conversation, then ask for a slideshow or PowerPoint about it. Plus accounts also have access to a specific Presentations add-on, available via the + (plus) menu in the prompt box, though I get the impression this feature is in a state of flux since ChatGPT Slides arrived. In any case, you can begin asking about the iPhone Duo specs and early online reactions, and then say \"build me a slideshow on the key features and reviews so far\". A slideshow made with a ChatGPT Plus account with a strange iPhone Duo screen mark. Credit: Lifehacker What I got back on the $20 Plus account was a fairly competent slideshow on Apple's foldable, with accurate information as far as I could see, and a simple series of layouts. It looked like something you might whip up from a template if you were in a rush and didn't have time to properly align all the bullet p", "date_str": "2026-10-23T16:30:05+00:00", "hash": "0f25ba9680a6599e", "title_fa": "من ابزار جدید ChatGPT 'Slides' را آزمایش کردم و در اینجا نحوه مقایسه آن با Gemini است.", "summary_fa": "قابلیت‌های ChatGPT به سرعت در حال گسترش است و آخرین ویژگی، ایجاد نمایش اسلاید کاملاً توانا است. چند هفته پیش اعلام شد، اسلایدهای ChatGPT به شما امکان می دهد دک هایی به سبک پاورپوینت از داخل مکالمات خود ایجاد کنید، و اکنون برای افرادی که در سطح حرفه ای و بالاتر هستند ظاهر می شود (به این معنی که در حال حاضر، برای دریافت آن باید حداقل 100 دلار در ماه هزینه کنید). اگر از طرح رایگان ChatGPT یا سطح 20 دلاری در ماه Plus استفاده می کنید، همچنان می توانید ChatGPT را برای تولید فایل های پاورپوینت قابل دانلود از محتوای مکالمات خود دریافت کنید. با این حال، آنها ساده تر از اسلایدهای ساخته شده در نسخه کامل ChatGPT خواهند بود و هیچ گزینه همکاری یا ویرایش بومی وجود ندارد. ChatGPT Slides بخشی از تلاش OpenAI برای ارائه یک مجموعه اداری کامل به کاربران در داخل برنامه های ChatGPT است. Pages (پردازنده کلمه) در حال حاضر برای سطوح حرفه ای و بالاتر در دسترس است، در حالی که یک برنامه صفحه گسترده در راه است که به زودی قادر خواهید بود تمام کارهای خود را بدون هیچ کمکی از Google یا Microsoft انجام دهید. در حالی که اسلایدهای Chatgpt در حال حاضر فقط در برنامه های گران قیمت در دسترس هستند، احتمالاً در آینده به سطوح پایین تری اشتراک خواهند رسید. اما در حال حاضر، چگونه این ابزار در مقایسه با آنچه که در سطوح رایگان و پلاس موجود است، مقایسه می‌شود، نه اینکه بگوییم با Gemini در اسلایدهای Google چه کارهایی می‌توانید انجام دهید؟ من یک نگاه دقیق انداختم
