  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root[data-theme="dark"] {

      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

g tool. We’ve included a few of our favorites below, many of which we use daily here at The Verge . Each can help you track deals at various retailers — including Amazon, Walmart, Best Buy, and Target — but they each do so differently and come with their own set of advantages / disadvantages. All of them are free to use, and once you’ve added the products you’re interested in keeping an eye on, you can rest easy knowing that you don’t need to take any action until it comes time to make a purchase. Just make sure you keep your email notifications on so you see the alerts as they come in. CamelCamelCamel CamelCamelCamel is arguably the most popular price-tracking tool at The Verge , and for good reason: it’s incredibly useful since it tracks the price of every product sold on Amazon and can send you alerts when an item falls to a customizable price threshold. Once a product reaches the desired price you’ve set (or lower), you’ll get an email about it. You can use the extension’s price graph to determine what price is likely to happen based on historical data, but it’s always a shot in the dark. To track prices and get alerts via email, you’ll need to create a free CamelCamelCamel account. Additionally, we suggest installing the site’s browser extension , The Camelizer, which works with Go", "date_str": "2026-11-09T15:00:00+00:00", "hash": "9476857e4fff7f7c", "title_fa": "چگونه مانند یک حرفه ای در جمعه سیاه و دوشنبه سایبری خرید کنیم", "summary_fa": "علیرغم اینکه آمازون و سایر خرده فروشان ماه های تابستان و پاییز را با فروش بیشتری نسبت به قبل پر می کنند، جمعه سیاه و دوشنبه سایبری بزرگترین روزهای خرید سال هستند. و در سال‌های اخیر، دوره‌های فروش زودتر شروع شده است و به شما فرصت بیشتری برای استفاده از معاملات می‌دهد. ما در حال حاضر سخت در تلاش هستیم تا بهترین قیمت‌ها را برای تلفن‌ها، لوازم جانبی، تلویزیون‌های 4K، هدفون‌های کاهش‌دهنده نویز، تجهیزات بازی و سایر فناوری‌ها در طول هفته‌های پرمعامله که به رویدادهای بزرگ ختم می‌شود، پیدا کنیم، چه قصد خرید حضوری یا آنلاین را داشته  it’s especially helpful during the weeks of deals leading up to Black Friday and Cyber Monday. Below are the price-matching policies for several major retailers. A few things to note: First, each retailer has its own set of rules and restrictions. We’ve summarized some of them here, but we recommend visiting the provided links and reading the policies carefully. Second, most retailers that serve as marketplaces for other sellers, including wholesale retailers like Costco, don’t offer protections, and many traditional stores won’t match their prices. Lastly, there are always exceptions to the rules. If you’re looking for a deal on a product and you know it’s available for a lower price elsewhere (or it was previously offered at the same retailer), it never hurts to call or chat with a customer service rep and ask if they’ll match the price. You have nothing to lose but time, and there’s always a chance they may find a loophole or make a special exception. Amazon Amazon doesn’t offer price matching. Full stop. You can contact customer support, but even if you’re an Amazon Prime customer, they likely won’t help. That said, the online retailer does offer a liberal return policy , meaning you can often return an item you purchased from Amazon if it’s available for less elsewhere (or at Amazon). Then, you can just repurchase the product wherever it’s cheapest. Target Target used to let shoppers price match identical items sold by select retailers, including Amazon, but no longer does so. Under its current policy, shoppers can only request a price adjustment if they find an identical qualifying item for less than they paid on Target.com, at their local Target store, or through an eligible Target Circle deal. Target will also price match Target Plus Partner (the retailer’s name for third-party sellers) items if the same Target Plus Partner on Target.com has it for less, or with a Target Circle deal. Price matches can be requested at the time of purchase or within 14 days after purchase. For the 2026 holiday season, Target has extended the aforementioned price-match wi", "date_str": "2026-11-09T15:00:00+00:00", "hash": "2fb3b7089b83e268", "title_fa": "در اینجا خط‌مشی‌های تطبیق قیمت برای Best Buy، Walmart و موارد دیگر آمده است", "summary_fa": "هیچ چیز ناامید کننده تر از خرید یک جفت هدفون جدید یا یک تلویزیون OLED نیست، فقط برای اینکه متوجه شوید چند روز یا چند هفته بعد می توانستید آن را در جای دیگری ارزان تر تهیه کنید. به همین دلیل است که برای راضی نگه داشتن مشتریان و جلوگیری از خرید آن‌ها از جای دیگر، برخی از خرده‌فروشان سیاست‌های تطبیق قیمت را ارائه می‌کنند که قول می‌دهند با قیمت پایین‌تری مطابقت داشته باشند. این نوع اطلاعات در تمام طول سال مفید است، اما به ویژه در هفته های معاملات منتهی به جمعه سیاه و دوشنبه سایبری مفید است. در زیر سیاست‌های تطبیق قیمت برای چندین خرده‌فروش بزرگ آورده شده است. چند نکته قابل توجه: اولاً، هر خرده فروش مجموعه ای از قوانین و محدودیت های خاص خود را دارد. ما برخی از آنها را در اینجا خلاصه کرده ایم، اما توصیه می کنیم از پیوندهای ارائه شده بازدید کنید و خط مشی ها را با دقت بخوانید. دوم، بیشتر خرده‌فروش‌هایی که به عنوان بازار برای فروشندگان دیگر، از جمله خرده‌فروش‌های عمده‌فروشی مانند Costco، خدمات حفاظتی ارائه نمی‌کنند، و بسیاری از فروشگاه‌های سنتی با قیمت‌هایشان مطابقت ندارند. در نهایت، همیشه استثناهایی از قوانین وجود دارد. اگر به دنبال یک معامله برای یک محصول هستید و می‌دانید که در جای دیگری با قیمت پایین‌تری در دسترس است (یا قبلاً در همان خرده‌فروش ارائه شده است)، تماس یا چت با یک نماینده خدمات مشتری و پرسیدن اینکه آیا با قیمت مطابقت دارد یا خیر، ضرری ندارد. شما چیزی برای از دست دادن ندارید جز زمان، و همیشه این احتمال وجود دارد که آنها یک راه گریز پیدا کنند یا استثناء خاصی ایجاد کنند. آمازون تطبیق قیمت را ارائه نمی دهد. توقف کامل می توانید با پشتیبانی مشتری تماس بگیرید، اما حتی اگر مشتری آمازون پرایم باشید، احتمالا کمکی نخواهند کرد. با این", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/11/258010_Black_friday_cyber_monday_CVirginia_BF3.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "The Verge", "title": "Here’s when the Black Friday sales start at Walmart, Target, and other retailers", "link": "https://www.theverge.com/21569881/black-friday-deals-start-time-hours-cyber-monday-stores", "summary": "Black Friday officially kicks off on November 27th, but if you plan to make that the only day you buy gifts this holiday season, you’re missing out. Several prominent retailers, including Best Buy and Walmart, are preparing to roll out their holiday discounts both in-store and online. Best Buy is even offering price protection through the holiday shopping season on select goods, so if you buy early and the same item drops in price, you can get the better deal retroactively. That being said, it’s important to know how every major retailer is handling the shopping event this year, whether you plan to take advantage of the slew of early holiday deals or hold off until the day after Thanksgiving. If you plan to spend some cash, here are the schedules and expectations for Amazon, Walmart, Best Buy, and all the major retailers we know of. Amazon Amazon has yet to announce its full Black Friday playbook, but the online retailer has dropped a few early deals in its so-called Holiday Shop , including steep discounts on Sony’s WH-1000XM6 headphones, the Google Pixel 11 Pro XL , and fitness trackers like the Fitbit Inspire 3 . Just be aware that Amazon does not offer price matching, so price “protection” for many Amazon shoppers means buying the item at the lower price point and returning the original — which, unfortunately, is pretty wasteful. Walmart Like in previous years, Walmart plans to roll out its Black Friday deals in three distinct waves. The first runs from November 12th through November 15th, starting online at 12:01AM ET and in stores at 6AM local time. Walmart Plus members will also get early access to some deals beginning at 12:01AM ET on November 12th, with the sale opening up to everyone at 12:01AM ET on November 13th. Walmart’s official Black Friday sale then kicks off at 12:01AM on Monday, November 23rd, with Walmart Plus members once again getting early access to select deals online. Whatever “hot Deal drops” remain will then be available to non-members at 12:01AM ET on November 24th. Walmart’s in-store Black Friday sale will then kick off at 6AM local time on November 27th. The retailer’s Cyber Monday sale, meanwhile, will kick off online at 12:01AM ET on November 30th and run through December 2nd. The retailer hasn’t shared many deal specifics yet, but did offer a sneak peek in a recent press release promising discounts across a range of categories, including toys, fashion, beauty, and home goods. Best Buy Best Buy officially kicked off its Blac", "date_str": "2026-11-09T15:00:00+00:00", "hash": "8c3391a092db85a1", "title_fa": "در اینجا زمانی است که فروش جمعه سیاه در Walmart، Target و سایر خرده فروشان شروع می شود", "summary_fa": "بلک فرایدی رسماً در 27 نوامبر آغاز می شود، اما اگر قصد دارید این تنها روزی باشد که در این فصل تعطیلات هدیه می خرید، فرصت را از دست می دهید. چندین خرده فروش برجسته، از جمله Best Buy و Walmart، در حال آماده شدن برای ارائه تخفیف های تعطیلات خود در فروشگاه و آنلاین هستند. Best Buy حتی در طول فصل خرید تعطیلات برای کالاهای منتخب محافظت از قیمت را ارائه می‌کند، بنابراین اگر زودتر خرید کنید و همان کالا کاهش یافت، می‌توانید معامله بهتری را به ماسبق دریافت کنید. همانطور که گفته شد، مهم است که بدانید هر خرده‌فروش بزرگ امسال رویداد خرید را چگونه مدیریت می‌کند، چه قصد دارید از انبوه معاملات اولیه تعطیلات استفاده کنید یا تا روز بعد از روز شکرگزاری متوقف شوید. اگر قصد دارید مقداری پول نقد خرج کنید، در اینجا برنامه‌ها و انتظارات برای آمازون، والمارت، بهترین خرید و همه خرده‌فروش‌های بزرگی که می‌شناسیم آمده است. آمازون هنوز کتاب جمعه سیاه کامل خود را اعلام نکرده است، اما این خرده‌فروش آنلاین چند پیشنهاد اولیه را در فروشگاه تعطیلات خود حذف کرده است، از جمله تخفیف‌های شدید روی هدفون‌های WH-1000XM6 سونی، Google Pixel 11 Pro XL و ردیاب‌های تناسب اندام مانند Fitbit Inspire 3. فقط توجه داشته باشید که آمازون تطبیق قیمت را ارائه نمی دهد، بنابراین \"محافظت\" از قیمت برای بسیاری از خریداران آمازون به معنای خرید کالا با قیمت پایین تر و برگرداندن اصل است - که متأسفانه بسیار ضایع کننده است. Walmart مانند سال های گذشته، والمارت قصد دارد معاملات جمعه سیاه خود را در سه موج مجزا عرضه کند. اولین دوره از 12 نوامبر تا 15 نوامبر اجرا می شود، به صورت آنلاین از ساعت 12:01 صبح به وقت شرقی و در فروشگاه ها در ساعت 6 صبح به وقت محلی شروع می شود. اعضای Walmart Plus همچنین دسترسی", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/10/258010_Black_friday_cyber_monday_CVirginia_BF2.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "The Verge", "title": "Here are the shipping and return policies for all the big-name retailers", "link": "https://www.theverge.com/21570161/holiday-shipping-return-policy-apple-google-microsoft-amazon", "summary": "With the holidays quickly appro aching, everyone will soon be on the hunt for gifts and the fastest way to get them. Thankfully, many retailers offer generous shipping policies, with some even providing free two-day shipping or same-day delivery if you’re willing to pay a little extra. And just in case the gift you choose isn’t quite right, many retailers offer extended return policies so your giftee can get something more to their liking. For your convenience, we’ve compiled the current shipping and return policies for all the big-name retailers, from Amazon to Walmart. A few already have holiday policies in place, but we’ll be keeping tabs on them and updating our list accordingly. Hopefully, knowing more about how much leeway you have to make a return will help lessen that inevitable holiday angst (fingers crossed). Amazon Shipping : Same-day delivery is not available on Thanksgiving, Christmas, or New Year’s (it’s also limited on Black Friday). However, Prime members get free same-day delivery on qualifying orders in qualifying ZIP codes provided they meet the “minimum qualifying dollar threshold” ( which varies by location) of eligible items in their cart. One-Day and Two-Day Delivery with no minimum purchase amount required is also available to Prime members for qualifying products. Non-Prime buyers will find shipping options on the order page of each specific product. Returns : As part of its holiday promotional period, Amazon says most items purchased between November 1st and December 31st can be returned until January 31st, 2027. Apple products, however, must be returned by January 15th, 2027. Note that this policy applies to both Prime and non-Prime buyers. Apple Shipping : Apple has yet to provide details on its holiday shipping policy; however, last year, it offered free delivery of in-stock items that hadn’t been engraved by Christmas Eve if you ordered before 9PM ET on December 21st. Apple also offers free next-day or two-hour delivery from local stores in most metro areas for an additional fee, or you can opt to pick up purchases yourself by visiting your local Apple Store. Returns : Apple is offering an extended return period for online orders received between November 6th and December 25th, allowing you to return items until January 8th, 2027. Purchases made after December 25th are generally subject to the usual terms and conditions, and must be returned within 14 calendar days of your initial purchase date. Target Shipping : Target offers", "date_str": "2026-11-09T15:00:00+00:00", "hash": "83d126377a255dab", "title_fa": "در اینجا سیاست های حمل و نقل و بازگشت برای همه خرده فروشان معروف آمده است", "summary_fa": "با نزدیک شدن به تعطیلات، همه به زودی به دنبال هدایا و سریع ترین راه برای دریافت آنها خواهند بود. خوشبختانه، بسیاری از خرده فروشان سیاست های حمل و نقل سخاوتمندانه ای را ارائه می دهند، حتی برخی از آنها ارسال رایگان دو روزه یا تحویل یک روزه را در صورت تمایل به پرداخت کمی بیشتر ارائه می دهند. و فقط در صورتی که هدیه ای که انتخاب می کنید کاملاً مناسب نباشد، بسیاری از خرده فروشان سیاست های بازگشت گسترده ای را ارائه می دهند تا هدیه گیرنده شما بتواند چیزی بیشتر به میل خود دریافت کند. برای راحتی شما، ما سیاست‌های حمل و نقل و بازگشت را برای همه خرده‌فروشان بزرگ، از آمازون تا والمارت، گردآوری کرده‌ایم. برخی از آنها در حال حاضر خط‌مشی‌های تعطیلات را اعمال کرده‌اند، اما ما آن‌ها را بررسی می‌کنیم و فهرست خود را بر این اساس به‌روزرسانی می‌کنیم. امیدواریم دانستن بیشتر در مورد میزان آزادی عملی که برای بازگشت دارید، به کاهش آن اضطراب اجتناب‌ناپذیر تعطیلات (انگشت‌های دست دراز) کمک کند. حمل و نقل آمازون: تحویل همان روز در روز شکرگزاری، کریسمس یا سال نو در دسترس نیست (در جمعه سیاه نیز محدود است). با این حال، اعضای Prime برای سفارش‌های واجد شرایط در کد پستی واجد شرایط، تحویل رایگان همان روز دریافت می‌کنند، مشروط بر اینکه «حداقل آستانه دلار واجد شرایط» (که بسته به مکان متفاوت است) اقلام واجد شرایط در سبد خرید خود را داشته باشند. تحویل یک روزه و دو روزه بدون نیاز به حداقل مبلغ خرید نیز برای اعضای Prime برای محصولات واجد شرایط در دسترس است. خریداران غیر اصلی گزینه های حمل و نقل را در صفحه سفارش هر محصول خاص پیدا می کنند. بازگشت: به عنوان بخشی از دوره تبلیغاتی تعطیلات خود، آمازون می‌گوید که اکثر اقلام خریداری‌شده بین 1 نوامبر و 31 دسامبر را می‌توان تا", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2024/12/Amazon-warehouse.webp?quality=90&strip=all&crop=0,11.135722915828,100,77.728554168345", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "The Verge", "title": "We’re giving away a bag filled with almost $900 worth of tech for Black Friday", "link": "https://www.theverge.com/gadgets/1024433/black-friday-2026-giveaway-sweepstakes", "summary": "As we inch toward the gift-giving season, which officially kicks off with Black Friday, we thought it’d be the perfect time for another giveaway. As b21a7a8c38e1c", "title_fa": "رقیب استارلینک دیگر نمی‌خواهد منتظر موشک‌های ایلان ماسک بماند؛ بلک‌لیفت در راه است", "summary_fa": "ای‌اس‌تی اسپیس‌موبایل برای پایان‌دادن به وابستگی پرتاب ماهواره‌های خود، موشک چندبارمصرف بلک‌لیفت را با بودجه‌ی ۱٫۳ میلیارد دلاری می‌سازد. تبلیغات شرکت AST SpaceMobile که از رقبای مستقیم سامانه‌ی ماهواره‌ای استارلینک به شمار می‌رود، اعلام کرد پروژه‌ی ساخت یک موشک اختصاصی به نام بلک‌لیفت را با تکیه بر پیشرانه‌های ساخت فایرفلای ایرواسپیس آغاز کرده است. فایرفلای قرار است طی قراردادی به ارزش ۱٫۳ میلیارد دلار، ۳۶ موتور موشک در اختیار این مجموعه‌ی ماهواره‌ای قرار دهد تا پروازهای فضایی بلک‌لیفت از سال ۲۰۲۸ میلادی آغاز شود. مالکیت پرتابگر اختصاصی، مزیتی راهبردی محسوب می‌شود که اسپیس‌ایکس سال‌هاست با تکیه بر ناوگان Falcon 9 از آن دارد و توانسته بیش از ۱۱ هزار ماهواره را در مدار مستقر کند. اسکات ویشنفسکی ، مدیر ارشد ای‌اس‌تی اسپیس‌موبایل، گفت: «موتور Miranda به ما امکان می‌دهد هنگام ساخت بلک‌لیفت، چرخه‌ی توسعه‌ی سنتی پنج تا ۱۰ ساله را پشت سر بگذاریم. با این توانمندی داخلی، می‌توانیم به مشتریان تجاری و دولتی خود در بازاری گسترده‌تر، فراتر از ارتباط مستقیم با دستگاه‌ها، خدمات بهتری ارائه دهیم.» طبق توافق صورت‌گرفته، ۲۷ موتور از نوع میراندا که برای پرتابگر جدید اکلیپس فایرفلای توسعه می‌یابند، به همراه ۹ موتور خلاء Vira به این پروژه اختصاص پیدا می‌کنند. ای‌اس‌تی اسپیس‌موبایل که پیش‌تر محموله‌های خود را با موشک‌های هندی، اسپیس‌ایکس و راکت نیو گلن متعلق به بلو اوریجین پرتاب می‌کرد، پس از بروز خطای مداری در پرتاب نیو گلن و همچنین توقف پذیرش سفارش‌های تجاری فالکون ۹ پس از سال ۲۰۲۸، تصمیم گرفت زنجیره‌ی تامین و پرتاب ماهواره‌هایش را به‌طور مستقل مدیریت کند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/blacklift-rocket-launch-spacecraft-6af020ce354e588119e484c2?w=1920&q=75", "category": "موسیقی و هنر", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۸:۴۵"}, {"source": "Business Insider", "title": "I've been to all 64 US national parks and ranked them from my least favorite to my top pick for travelers", "link": "https://www.businessinsider.com/every-major-us-national-park-ranked-traveler-who-visited-all-2026-11", "summary": "I visited and ranked all 64 US national parks. Emily Hart I've been to all 64 US national parks and ranked them from my least favorite to my top pick. I think parks like Congaree, Petrified Forest, and Channel Islands are best suited for a day trip. Visiting Badlands, White Sands, and Olympic national parks feels like stepping onto another planet. Ranking all 64 major US national parks feels like an impossible task because each one offers something uniquely beautiful. However, as a solo traveler who's visited them all, I've learned that not all parks leave the same impression. Some are grand and awe-inspiring, embodying the vision of what a national park likely looks like in your mind. Others, although still worth visiting, don't quite reach that same iconic standard. That said, all of the major national parks are undoubtedly some of the most scenic and unique places in the US , so even a bottom spot on my ranking is not a dig. Here's how I'd rank all the US national parks based on personal preference and things like scenic beauty, accessibility, and crowd sizes. 64. Hot Springs National Park in Arkansas schristinephoto/Shutterstock In the grand scheme of things, coming in last on a list of what I consider to be the most beautiful places in the US is not too shabby — and I had to pick one. That said, I don't dislike Hot Springs National Park at all — in fact, I'd love to visit again. However, it's last on this list because it doesn't have the same natural scenic beauty and outdoor opportunities as the other parks. Hot Springs is in the middle of a town, where the main attraction is Bathhouse Row — eight historic bathhouses built between 1892 and 1923. Although it's a fun and interesting place, I think it would be better suited as a national historic park. 63. Gateway Arch National Park in Missouri Jonathan_Densford/Shutterstock Gateway Arch National Park in St. Louis is another place I love visiting. I just don't think it makes sense as a \"national park.\" Once known as the Jefferson National Expansion Memorial, this spot was designated a national park and renamed in 2018. It's also the smallest of the 64 national parks. Like Hot Springs, I ranked it lower because the main attraction, the 630-foot-tall Gateway Arch, is man-made. In my opinion, the park would be better designated as a National Monument. 62. Mammoth Cave National Park in Kentucky Emily Hart I'm not a fan of caves, so national parks primarily focused on cave tours are not for me. However, if y", "date_str": "2026-11-09T15:21:12+00:00", "hash": "55c800e0834387bf", "title_fa": "من به تمام 64 پارک ملی ایالات متحده رفته ام و آنها را از کمترین علاقه تا بهترین انتخاب برای مسافران رتبه بندی کرده ام.", "summary_fa": "من از تمام 64 پارک ملی ایالات متحده بازدید و رتبه بندی کردم. امیلی هارت من در تمام 64 پارک ملی ایالات متحده بوده ام و آنها را از کمترین علاقه تا انتخاب برتر خود رتبه بندی کرده ام. فکر می‌کنم پارک‌هایی مانند Congaree، جنگل سنگ‌شده، و جزایر کانال برای یک سفر یک روزه مناسب‌تر هستند. بازدید از Badlands، White Sands و پارک های ملی المپیک مانند قدم گذاشتن به سیاره ای دیگر است. رتبه بندی تمام 64 پارک ملی بزرگ ایالات متحده امری غیرممکن به نظر می رسد زیرا هر یک چیز منحصر به فرد زیبایی ارائه می دهد. با این حال، به عنوان یک مسافر انفرادی که همه آنها را بازدید کرده ام، آموخته ام که همه پارک ها یک تصور را به جا نمی گذارند. برخی از آنها بزرگ و الهام‌بخش هستند و این تصور را که احتمالاً یک پارک ملی در ذهن شما به نظر می‌رسد، تجسم می‌دهند. برخی دیگر، اگرچه هنوز ارزش بازدید دارند، اما به همان استاندارد نمادین نمی رسند. با این اوصاف، همه پارک‌های ملی بزرگ بدون شک برخی از دیدنی‌ترین و منحصربه‌فردترین مکان‌های ایالات متحده هستند، بنابراین حتی یک رتبه پایین در رتبه‌بندی من حفاری نیست. در اینجا نحوه رتبه‌بندی همه پارک‌های ملی ایالات متحده بر اساس ترجیحات شخصی و مواردی مانند زیبایی منظره، دسترسی، و تعداد جمعیت آمده است. 64. پارک ملی هات اسپرینگز در آرکانزاس schristinephoto/Shutterstock در طرح بزرگ همه چیز، جایگاه آخر در فهرست مکان‌هایی که به نظر من زیباترین مکان‌های ایالات متحده هستند، خیلی کثیف نیست - و مجبور شدم یکی را انتخاب کنم. با این حال، من اصلاً از پارک ملی هات اسپرینگز متنفر نیستم - در واقع، دوست دارم دوباره از آن دیدن کنم. با این حال، آخرین رتبه در این لیست است زیرا مانند سایر پارک ها زیبایی منظره طبیعی و فرصت های فضای باز", "image_url": "https://i.insider.com/6af1e48e80d4b24f183478ba?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۸:۵۱"}, {"source": "Business Insider", "title": "I'm an interior designer who works with wealthy clients. Here are 10 things I rarely see in their living rooms.", "link": "https://www.businessinsider.com/what-rich-people-never-have-living-rooms-interior-designer-luxury-2026-11", "summary": "I ve found that wealthy, high-profile clients tend to avoid a few mistakes when designing and decorating their living rooms. Getty Images; BI In my years as an interior designer, I've worked with many wealthy, high-profile clients. Their living rooms typically don't have too-small rugs, visible TVs, or a single overhead light. It's also rare to find mass-produced artwork, matching furniture sets, and cluttered surfaces. As an interior designer who's worked with high-profile clients for over a decade, I've learned that a luxurious living room is rarely defined by how much money has been spent putting it together. Rather, some of the nicest high-end spaces I've worked on are thoughtfully designed and curated for the people living in them. Although everyone's personal style is different, I've noticed a few common design choices that my wealthier clients tend to avoid. Here are 10 things that I rarely see in their living rooms. Matching furniture sets are rarely a part of the design. sheilasay/Getty Images When designing a high-end living room , I never purchase an entire matching furniture collection from one place. Instead, I mix different silhouettes, materials, and eras so the room feels more special, as if the furniture has been carefully collected and put together over time. After all, a sofa, an accent chair, and a loveseat in the same fabric and style can create a generic feel, as if they were all pulled directly from a furniture showroom. A rug that s too small can cheapen the entire living room. Sometimes, no rug is better than one that s too small for a space. RapidEye/Getty Images When in doubt, it's better to go bigger for rugs. Rugs that are too small can make even the most expensive furniture look cheap and create a space that feels disconnected or incomplete. In my clients' homes, I typically select oversized rugs that anchor the seating arrangement. At the very least, I want the front legs of all major seating pieces to rest on the rug. A correctly sized rug makes a room feel more substantial, cohesive, and well-designed. Generic, mass-produced artwork is usually nowhere to be found. When decorating, prioritize finding unique artwork that s meaningful to you. Curly_photo/Getty Images Artwork is one of the biggest opportunities to give a space personality . So, I rarely see wealthy clients displaying generic, mass-produced canvas prints that could be found in thousands of other homes. Instead, many invest in original paintings, limited-edition ", "date_str": "2026-11-09T15:03:01+00:00", "hash": "1498e37fd7bc5566", "title_fa": "من یک طراح داخلی هستم که با مشتریان ثروتمند کار می کنم. در اینجا 10 چیزی است که من به ندرت در اتاق نشیمن آنها می بینم.", "summary_fa": "من متوجه شده ام که مشتریان ثروتمند و پرمخاطب هنگام طراحی و تزئین اتاق نشیمن خود از چند اشتباه اجتناب می کنند. گتی ایماژ; BI در سال‌هایی که به عنوان طراح داخلی کار می‌کردم، با بسیاری از مشتریان ثروتمند و با مشخصات بالا کار کرده‌ام. اتاق‌های نشیمن آنها معمولاً فرش‌های خیلی کوچک، تلویزیون‌های قابل مشاهده یا یک چراغ سقفی ندارند. همچنین به ندرت می‌توان آثار هنری تولید انبوه، مجموعه‌های مبلمان همسان و سطوح به هم ریخته را پیدا کرد. به عنوان یک طراح داخلی که بیش از یک دهه با مشتریان برجسته کار کرده است، آموخته ام که یک اتاق نشیمن مجلل به ندرت با مقدار پولی که برای جمع آوری آن هزینه شده است تعریف می شود. در عوض، برخی از زیباترین فضاهای سطح بالا که من روی آنها کار کرده‌ام، برای افرادی که در آنها زندگی می‌کنند، طراحی و مدیریت شده‌اند. اگرچه سبک شخصی هر کس متفاوت است، من متوجه چند انتخاب رایج طراحی شده ام که مشتریان ثروتمندتر من تمایل دارند از آنها اجتناب کنند. در اینجا 10 چیز وجود دارد که من به ندرت در اتاق نشیمن آنها می بینم. ست مبلمان همسان به ندرت بخشی از طراحی است. sheilasay/Getty Images هنگام طراحی یک اتاق نشیمن سطح بالا، من هرگز کل مجموعه مبلمان را از یک مکان خریداری نمی کنم. در عوض، من شبح‌ها، مواد و دوره‌های مختلف را با هم ترکیب می‌کنم تا اتاق خاص‌تر به نظر برسد، گویی که مبلمان با دقت جمع‌آوری شده و در طول زمان کنار هم قرار گرفته‌اند. به هر حال، یک مبل، یک صندلی تاکیدی، و یک صندلی عاشقانه در همان پارچه و سبک می‌توانند حسی کلی ایجاد کنند، گویی که همه آنها مستقیماً از یک نمایشگاه مبلمان بیرون کشیده شده‌اند. یک فرش خیلی کوچک می تواند کل اتاق نشیمن را ارزان کند. گاهی اوقات، هیچ فرشی بهتر از", "image_url": "https://i.insider.com/6ad0da49adb77227909a5e7d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۳"}, {"source": "Business Insider", "title": "Meet the legal startup generating $150 million in revenue without chasing Big Law", "link": "https://www.businessinsider.com/evenup-hits-150-million-recurring-revenue-legal-ai-2026-11", "summary": "EvenUp cofounder and CEO Rami Karabibar. EvenUp EvenUp, a quiet giant of the legal tech space, has reached $150 million in contracted revenue. The company sells AI software to personal injury law firms. It's expanding into new products and reaching new customers as it also faces increased competition. While Harvey and Legora battle for Big Law, another legal tech startup is carving out a sizable business in Small Law. EvenUp, a seven-year-old company that sells AI software to plaintiff-side law firms, has grown to $150 million in recurring revenue under contract, Rami Karabibar, EvenUp's cofounder and chief executive, told Business Insider. The milestone is a reminder that some of the biggest opportunities in legal AI lie beyond the white-shoe firms now adopting it. For traditional law firms that bill by the hour, AI presents a dilemma. Software that makes lawyers more efficient could also eat into their revenue. But personal injury firms typically work on contingency, taking a cut of what their clients win. The faster they can move cases along, the sooner they get paid. For much of its existence, EvenUp was something of a one-trick pony. The company got its start automating demand letters, the detailed documents personal injury lawyers send to insurers making the case for a financial settlement. It's a valuable business, but one that competitors can imitate. Over the past 18 months, EvenUp has expanded into AI software that helps lawyers manage cases from start to finish. Its newest offering goes a step further, combining AI agents with human case managers to handle much of the work that happens before a lawsuit is filed. The expansion has transformed EvenUp's business. In early 2025, demand letters accounted for more than 90% of revenue, Karabibar said. Today, revenue is spread more evenly across its products, and demand letters represent less than a quarter of the business. EvenUp now serves more than 2,000 personal injury firms and supports 20,000 cases each week. Law firms pay a fixed price per case and sign annual contracts committing to a certain volume of cases. EvenUp may have barely scratched the surface. Most law firms still use only one of its products, Karabibar said. The company sees an opportunity to land customers with one offering, then expand into other parts of their business. To make that happen, EvenUp has hired Stevie Case, the former chief revenue officer of Vanta , as president of field operations. She will oversee sales, marketing,", "date_str": "2026-11-09T14:50:01+00:00", "hash": "8166788a41125798", "title_fa": "با استارتاپ قانونی آشنا شوید که 150 میلیون دلار درآمد ایجاد می کند بدون اینکه قانون بزرگ را دنبال کنید", "summary_fa": "رامی کارابیبار، بنیانگذار و مدیرعامل EvenUp. EvenUp EvenUp، غول آرام در فضای فناوری قانونی، به درآمد قراردادی ۱۵۰ میلیون دلاری رسیده است. این شرکت نرم افزار هوش مصنوعی را به شرکت های حقوقی آسیب های شخصی می فروشد. در حال گسترش به محصولات جدید و دستیابی به مشتریان جدید است زیرا با افزایش رقابت نیز مواجه است. در حالی که هاروی و لگورا برای قانون بزرگ مبارزه می کنند، یک استارتاپ حقوقی دیگر در زمینه فناوری در حال ایجاد یک تجارت قابل توجه در Small Law است. رامی کارابیبار، بنیانگذار و مدیر اجرایی EvenUp، به Business Insider گفت که EvenUp، یک شرکت هفت ساله که نرم‌افزار هوش مصنوعی را به شرکت‌های حقوقی طرف شاکی می‌فروشد، درآمد مداوم طبق قرارداد به 150 میلیون دلار رسیده است. این نقطه عطف یادآوری است که برخی از بزرگترین فرصت‌ها در هوش مصنوعی قانونی فراتر از شرکت‌های کفش سفید است که اکنون آن را اتخاذ می‌کنند. برای شرکت‌های حقوقی سنتی که هر ساعت صورت‌حساب می‌دهند، هوش مصنوعی یک معضل ایجاد می‌کند. نرم‌افزاری که وکلا را کارآمدتر می‌کند، می‌تواند به درآمد آنها نیز کمک کند. اما شرکت‌های آسیب‌های شخصی معمولاً روی موارد احتمالی کار می‌کنند و از آنچه مشتریانشان برنده می‌شوند، کوتاهی می‌کنند. هرچه سریع‌تر پرونده‌ها را جابه‌جا کنند، زودتر حقوق دریافت می‌کنند. EvenUp در بیشتر زمان وجود خود چیزی شبیه به یک تسویه حساب بود. این شرکت شروع به خودکارسازی نامه‌های تقاضا کرد، اسناد مفصلی که وکلای آسیب‌های شخصی برای بیمه‌گران ارسال می‌کنند تا برای تسویه حساب مالی اقدام کنند. این یک تجارت ارزشمند است، اما کسب و کاری که رقبا می توانند از آن تقلید کنند. در طول 18 ماه گذشته، EvenUp به نرم افزار هوش مصنوعی گسترش یافته است که به وکلا در مدیریت پرونده ها از ابتدا تا انتها کمک می کند. جدیدترین پیشنهاد آن یک قدم فراتر می رود و عوامل", "image_url": "https://i.insider.com/6aee2e5eeaa5e46dca227c22?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۱۸ آبان • ۱۸:۲۰"}, {"source": "Business Insider", "title": "Before I moved abroad, I built an affordable, detailed care plan for my 78-year-old mom in the US", "link": "https://www.businessinsider.com/built-care-plan-for-mom-in-us-before-moving-abroad-2026-11", "summary": "Relocating outside the US had been my dream for a long time, but I wanted to make sure my mom had a solid plan in place before I left. Ivy Ge Before I relocated abroad, I set up a care plan for my aging mother, who'd be staying in California. We spent years securing affordable housing that met her needs, and we planned my visits and calls. I also made her a wallet-sized emergency card with her medications and other crucial info. For a long time, I'd wanted to retire early from my career as a pharmacist in California and move abroad to Mexico. However, I worried about leaving behind my aging mom, who was in her late 70s. As the child who lived close by, I considered it my responsibility to take care of her. Determined to find a solution that would let me leave with confidence that my mom would be well cared for, I began building a long-distance care plan before I moved to Mexico at age 50 in 2023. The plan included three essential parts: secure, affordable housing; a remote caregiving system ; and a way to stay connected from abroad. It took us years to secure affordable housing that fit my mother's needs I first started researching senior housing options in 2016. My mom wanted to live independently in a rental near public transportation without leaving San Francisco, where her friends lived. I initially looked at private-pay, independent-living senior apartments , but the monthly costs were well beyond her budget. Depending on the unit size and services provided, these options often started at several thousand dollars a month. Frustrated, I began looking into income-based senior housing . I researched nonprofit housing providers in the city, scanned affordable housing listings, and helped my mom apply for buildings she was eligible for. These properties often come with age and income limits and charge rent on an income-based sliding scale. Some offer a first-come, first-served waitlist; others operate on a lottery system. San Francisco's affordable senior housing waitlists are notoriously long. That is why it was so important for us to apply early and submit applications to every eligible building we found. In 2021, five years after I started the research, my mom moved into an income-based senior-housing apartment building with a staffed front desk, security cameras, and around-the-clock on-call support. Her rent is set at 30% of her monthly income. The piece that had worried me most was finally in place. Around this time, I also began planning and budgeti", "date_str": "2026-11-09T14:36:01+00:00", "hash": "859c0be2ca848c22", "title_fa": "قبل از نقل مکان به خارج از کشور، یک برنامه مراقبت دقیق و مقرون به صرفه برای مادر 78 ساله ام در ایالات متحده ایجاد کردم.", "summary_fa": "جابجایی در خارج از ایالات متحده برای مدت طولانی آرزوی من بود، اما می‌خواستم مطمئن شوم که مادرم قبل از رفتن من برنامه‌ای محکم در پیش گرفته است. آیوی جی قبل از نقل مکان به خارج از کشور، برای مادر پیرم که در کالیفرنیا می ماند، برنامه مراقبتی تنظیم کردم. ما سال‌ها صرف تأمین مسکن مقرون به صرفه‌ای که نیازهای او را برآورده می‌کرد، داشتیم، و ملاقات‌ها و تماس‌های من را برنامه‌ریزی کردیم. من همچنین برای او یک کارت اورژانسی به اندازه کیف پول با داروهای او و سایر اطلاعات مهم درست کردم. مدت‌ها بود که می‌خواستم از حرفه‌ام به عنوان داروساز در کالیفرنیا بازنشسته شوم و به مکزیک مهاجرت کنم. با این حال، من نگران این بودم که مادر پیرم را که در اواخر دهه 70 زندگی اش بود، پشت سر بگذارم. به عنوان کودکی که در نزدیکی زندگی می کردم، مراقبت از او را مسئولیت خود می دانستم. تصمیم گرفتم راه حلی بیابم که به من اجازه دهد با اطمینان خاطر از اینکه مادرم به خوبی از او مراقبت خواهد شد، شروع به ساختن یک برنامه م  with Russia, Ukraine has already turned to this approach on the battlefield, using relay drones to extend the connection between a pilot and a mission drone. Similar to how WiFi extenders work, these airborne signal repeaters are typically small quadcopters that can fly higher than ground-based antennas, allowing the mission drone to fly farther. Roughly 50 Ukrainian soldiers participated in Combined Resolve, a recurring large-scale US Army exercise held last month at the Joint Multinational Readiness Center in Bavaria, north of Munich. Business Insider spent two days observing the training exercise, a kind of stress test for the Army as the service integrates drones, electronic warfare, and other emerging technologies into its armor operations to make tanks and infantry fighting vehicles more survivable on modern battlefields. Army officers said that the US is learning many lessons from Ukraine and from its visiting soldiers, who participated in the exercise alongside the 1st Armored Division's 1st Armored Brigade Combat Team (1/1 ABCT) as it fought an opposition force simulating an enemy. One of these lessons is how to use relay drones for extended range, said Capt. Kevin Rincon, the troop commander of the multifunctional reconnaissance company, 1/1 ABCT's action arm. Ukraine uses relay drones to extend the range of other drones on strike and surveillance missions. Jake Epstein/Business Insider Speaking in the dense forest surrounded by armored vehicles, Rincon said fine-tuning the ability to operate relay drones and extend the range of mi", "date_str": "2026-11-09T14:14:26+00:00", "hash": "625ef55bfb36cd00", "title_fa": "سربازان ارتش ایالات متحده در حال گرفتن صفحه ای از کتاب بازی اوکراین برای پرواز پهپادهای دورتر هستند", "summary_fa": "یک سرباز آمریکایی در حال شبیه سازی یک دشمن یک پهپاد را در جریان تمرین اخیر برمی دارد. جیک اپستاین/Business Insider سربازان ارتش ایالات متحده که در آلمان آموزش می بینند از پهپادهای رله برای گسترش دامنه عملیات خود استفاده می کنند. ر Canadian neofirm has raised a $6 million seed round led by Lerer Hippeau. The founders think it can avoid Weil's fate by building a system that learns from past work. Artificial intelligence has forced Big Law to rethink how legal work gets done and how clients pay for it. The collapse of law firm Weil Gotshal shows how quickly the traditional model can come apart. The founders of Blackletter, a new Canadian neofirm, say artificial intelligence offers a way to build something sturdier. Blackletter has raised a $6 million seed round led by Lerer Hippeau, its cofounder and chief executive, Jonathan Rosenbluth, told Business Insider. The firm combines technology and lawyers to offer businesses legal services for flat fees. The investment marks Lerer Hippeau's first check in legal, a firm spokesperson said. Other Blackletter backers include Seven Stars, Maple VC, Garage Ventures, and Ripple Ventures, as well as Cohere's founders, Aidan Gomez, Nick Frosst, and Ivan Zhang. Rosenbluth saw Weil as a reminder of the existential risk facing legacy firms. Rainmakers can walk at any time. Clients can follow. And a partnership can collapse with the speed of a bank run. Blackletter is betting its clients will come back not because of the relationship with one partner, but because Blackletter understands their business and does the work well. Its lawyers use software built on large language models to draft and negotiate routine corporate contracts and guide transactions from term sheet through diligence and signing. The firm says it has more than 75 clients, including Fanatics, TwelveLabs, and Ada, which has just agreed to merge with fellow customer service agent company Dialpad in a $600 million deal. The lessons from each matter Blackletter works on are meant to inform the next, Rosenbluth said. Lawyers refine how they use the tools, while engineers adapt the technology to help them get better results. Rosenbluth spent a summer during law school at Skadden , where he watched associates a decade his senior grind through menial work. He felt drawn to the legal industry, he said, but the experience convinced him that traditional practice was not the career for him. Before starting Blackletter, he rose through the ranks at Cohere , the fast-growing artificial intelligence model maker, where he led par", "date_str": "2026-11-09T14:00:01+00:00", "hash": "ded9a384c0211f91", "title_fa": "آنها از Cohere خارج شدند تا وارد قانون شوند. آنها می گویند که شرکت جدیدشان می تواند از سرنوشت ویل جلوگیری کند.", "summary_fa": "بنیانگذاران Blackletter، آوی برودنر، دیوید استوارت و جاناتان روزنبلوت. Blackletter Blackletter جدیدترین شرکت حقوقی استارتاپی است که سعی دارد مشتریان را از قانون بزرگ دور کند. شرکت نئوفیرمای کانادایی مبلغ 6 میلیون دلاری را به رهبری لرر هیپو جمع آوری کرده است. بنیانگذاران فکر می کنند که می تواند با ساختن سیستمی که از کارهای گذشته درس می گیرد، از سرنوشت ویل جلوگیری کند. هوش مصنوعی بیگ لاو را وادار کرده است تا درباره نحوه انجام کارهای قانونی و نحوه پرداخت هزینه های مشتریان تجدیدنظر کند. فروپاشی شرکت حقوقی ویل گوتشال نشان می دهد که مدل سنتی چقدر سریع می تواند از هم پاشیده شود. بنیان‌گذاران Blackletter، یک شرکت جدید کانادایی، می‌گویند هوش مصنوعی راهی برای ساختن چیزی قوی‌تر ارائه می‌کند. جاناتان روزن‌بلوت، بنیانگذار و مدیر اجرایی بلک‌لتتر، سرمایه‌گذاری 6 میلیون دلاری به رهبری لرر هیپو، به بیزینس اینسایدر گفت. این شرکت فناوری و وکلا را برای ارائه خدمات حقوقی به مشاغل با هزینه های ثابت ترکیب می کند. سخنگوی این شرکت گفت که این سرمایه گذاری اولین بررسی قانونی لرر هیپو است. سایر حامیان Blackletter عبارتند از Seven Stars، Maple VC، Garage Ventures و Ripple Ventures و همچنین بنیانگذاران Cohere، آیدان گومز، نیک فراست و ایوان ژانگ. روزن بلوث ویل را یادآور خطر وجودی پیش روی شرکت های قدیمی می دانست. باران‌سازان می‌توانند در هر زمانی راه بروند. مشتریان می توانند دنبال کنند. و یک مشارکت می تواند با سرعت یک بانک از بین برود. بلک‌لتتر شرط می‌بندد که مشتریانش نه به خاطر رابطه با یک شریک، بلکه به این دلیل که بلک‌لت کسب‌وکار آنها را درک می‌کند و کار را به خوبی ان       media: [{"source": "Billboard", "title": "Meet the 2026 Latin Grammy Best New Artist Nominees: Aria Vega, Macario Martínez, Delilah & More", "link": "https://www.billboard.com/lists/meet-latin-grammys-2026-best-new-artists-nominees-category/", "summary": "Best New Artist is one of the Latin Grammys’ four General Field categories, placing a newcomer conversation alongside Record, Album and Song of the Year. It is also the category that asks voters to make a bet: not about who had a breakthrough year, but whose voice, point of view or musical world feels like the beginning of something. The award has a history of recognizing artists before they became fixtures. Juanes won in 2001, Calle 13 took the honor in 2006 before becoming one of the most audacious and decorated acts in Latin music, and Karol G won in 2018, years before her global stadium era. Those names are not a forecast for any one nominee, of course, but they underline the category’s particular thrill: sometimes the “new” artist is the next artist who changes the conversation. For 2026, the Latin Recording Academy has assembled 11 nominees across a striking range of geographies and approaches: Mexican indie folk, coastal Colombian rhythms, Brazilian R B, dream-pop, singer-songwriter confessionals and more. The spread is part of the story. Macario Martínez’s roots-minded songs and viral rise sit in a very different lane from maye’s hazy, finely layered pop. Arath Herce’s songwriter craft shares the ballot with ARIA VEGA’s Caribbean-facing pop, while three Brazilian nominees bring distinct perspectives from one of Latin America’s most influential music cultures. Two of those artists, Loulu Gilberto and Zeca Veloso, are also the children of bossa nova and tropicalia icons João Gilberto and Caetano Veloso, respectively — a notable family footnote, but not a substitute for hearing what they make on their own. Here’s a closer introduction to all 11 nominees — what they sound like, the moments that brought them here, and where Billboard readers may already have encountered them — in alphabetical order.", "date_str": "2026-11-09T16:00:00+00:00", "hash": "daaa0c903bd82808", "title_fa": "با نامزدهای بهترین هنرمند جدید جایزه گرمی لاتین 2026 آشنا شوید: آریا وگا، ماکاریو مارتینز، دلیلا و غیره", "summary_fa": "بهترین هنرمند جدید یکی از چهار دسته بخش عمومی گرمی لاتین است که یک مکالمه تازه وارد را در کنار ضبط، آلبوم و آهنگ سال قرار می دهد. همچنین این مقوله ای است که از رای دهندگان می خواهد که شرط بندی کنند: نه در مورد اینکه چه کسی سال موفقیت آمیز داشته است، بلکه در مورد صدا، دیدگاه یا دنیای موسیقی که به نظر می رسد شروع چیزی است. این جایزه سابقه ای در شناخت هنرمندان قبل از تبدیل شدن به فیکسچر دارد. Juanes در سال 2001 برنده شد، Calle 13 در سال 2006 قبل از تبدیل شدن به یکی از جسورانه ترین و آراسته ترین بازیگران موسیقی لاتین این افتخار را به دست آورد، و Karol G در سال 2018، سال ها قبل از دوران استادیوم جهانی او، برنده شد. البته این نام‌ها برای هیچ یک از نامزدها پیش‌بینی نمی‌شوند، اما بر هیجان خاص این دسته تأکید می‌کنند: گاهی اوقات هنرمند «جدید» هنرمند بعدی است که گفتگو را تغییر می‌دهد. برای سال 2026، آکادمی ضبط لاتین 11 نامزد را در طیف وسیعی از جغرافیاها و رویکردها جمع آوری کرده است: موسیقی محلی مکزیکی، ریتم های ساحلی کلمبیایی، R B برزیلی، پاپ رویایی، اعترافات خواننده و ترانه سرا و غیره. گسترش بخشی از داستان است. آهنگ‌های ماکاریو مارتینز که ریشه‌دار هستند و ظهور ویروسی در مسیری بسیار متفاوت از پاپ مه‌آلود و لایه‌های ظریف Maye قرار دارند. هنر ترانه سرای آرات هرس رأی را با موسیقی پاپ کارائیب آریا وگا به اشتراک می گذارد، در حالی که سه نامزد برزیلی دیدگاه های متفاوتی از یکی از تأثیرگذارترین فرهنگ های موسیقی آمریکای لاتین به ارمغان می آورند. دو تن از این هنرمندان، لولو گیلبرتو و زکا ولوسو، به ترتیب فرزندان نمادهای بوسا نوا و ژائو ژیلبرتو و کائتانو ولوسو نیز هستند - یک پاورقی قابل توجه خانوادگی، اما نه جایگزینی", "image_url": "https://www.billboard.com/wp-content/uploads/2025/10/Macario-Martinez-Credit-daviddbarajas-billboard-1800.jpg?w=1024", "category": "سینما و سریال", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Paul Anka, Stevie Wonder, Cher & More Kennedy Center Honorees Who Were Teenagers When They First Hit the Billboard Hot 100 (Full List)", "link": "https://www.billboard.com/lists/kennedy-center-honorees-teenagers-when-first-hit-full-list/", "summary": "Paul Anka was just 15 – two weeks away from turning 16 – when he first made Billboard ’s pop chart in July 1957 with the smash “Diana.” (This was more than a year before Billboard introduced the Hot 100.) Last week, Anka was announced as a 2026 recipient of the Kennedy Center Honors, one of the most prestigious career cappers in the entertainment field. Anka is the 11th artist who later received the Kennedy Center Honors who first hit the Hot 100 as a teenager. Anka was a bona-fide teen idol when he started out, with such teen-targeted hits as “Put Your Head on My Shoulder” and “Puppy Love,” but most of the artists on this list weren’t teen idols, as such. They simply knew what they wanted to do from an early age and got off to a fast start. Related Paul Anka, David Foster Barbara Mandrell Are Among 2026 Kennedy Center Honorees: Complete List In addition to these 11 artists who received Kennedy Center Honors as individuals, two artists who received the Honors as part of a group first made the Hot 100 as teenagers. Pete Townshend was 19 when The Who first made the Hot 100 with “I Can’t Explain” in March 1965. The Who received the Kennedy Center Honors in 2008. Verdine White was 19 when Earth, Wind Fire first made the Hot 100 with “Love Is Life” in July 1971. EWF received the Kennedy Center Honors in 2019. This year’s other Kennedy Center Honorees are songwriter/producer David Foster , actor/director Andy Garcia, playwright David Mamet, and country star Barbara Mandrell . The awards will be presented on Dec. 7 at Capitol One Arena in Washington, D.C. Here’s a complete list of artists who went on to receive the Kennedy Center Honors who first hit the Hot 100 as teenagers. They are listed in chronological order by the year they received the Kennedy Center Honors.", "date_str": "2026-11-09T15:37:02+00:00", "hash": "58629c302f368c88", "title_fa": "پل آنکا، استیوی واندر، شر و دیگر برگزیدگان مرکز کندی که برای اولین بار در بیلبورد هات 100 نوجوان بودند (فهرست کامل)", "summary_fa": "پل آنکا تنها 15 سال داشت - دو هفته تا 16 سالگی - وقتی برای اولین بار در ژوئیه 1957 با آهنگ فوق العاده \"دیانا\" در جدول پاپ بیلبورد قرار گرفت. (این بیش از یک سال قبل از معرفی Billboard Hot 100 بود.) هفته گذشته، Anka به عنوان دریافت کننده افتخارات مرکز کندی در سال 2026 معرفی شد، یکی از معتبرترین بازیگران حرفه ای در زمینه سرگرمی. آنکا یازدهمین هنرمندی است که بعداً افتخارات مرکز کندی را دریافت کرد و اولین بار در نوجوانی موفق به کسب رتبه 100 شد. آنکا زمانی که شروع به کار کرد، یک بت نوجوان خوب بود، با آثاری مانند «سرت را روی شانه من بگذار» و «عشق توله سگ»، اما اکثر هنرمندان این فهرست به این ترتیب بت های نوجوان نبودند. آنها به سادگی می دانستند که چه کاری می خواهند انجام دهند و به سرعت شروع کردند. مرتبط پل آنکا، دیوید فاستر باربارا ماندرل در میان برگزیدگان سال 2026 مرکز کندی هستند: فهرست کامل علاوه بر این 11 هنرمندی که به صورت انفرادی جوایز مرکز کندی را دریافت کردند، دو هنرمندی که به عنوان بخشی از یک گروه این افتخارات را دریافت کردند، ابتدا در نوجوانی موفق به کسب جایزه Hot 100 شدند. پیت تاونشند ۱۹ ساله بود که اولین بار The Who با «I Can't Explain» در مارس 1965، Hot 100 را ساخت. The Who در سال 2008 افتخارات مرکز کندی را دریافت کرد. وردین وایت 19 ساله بود که Earth, Wind Fire برای اولین بار با «Love Is Life» در ژوئیه 1971 به فیلم Hot 100 رسید. EWF در سال 2019 جوایز افتخاری مرکز کندی را دریافت کرد. دیگر افتخارآفرینان مرکز کندی امسال دیوید فاستر، ترانه‌سرا/تهیه‌کننده، بازیگر/کارگردان اندی گارسیا، و رایت گارسیا کانتری، بازیگر و کارگردان، اندی گارسیا، پلی‌و هستند. جوایز در 7 دسامبر در Capitol One Arena در واشنگتن دی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2153366021-e1794190647291.jpg?w=1024", "category": "هوش مصنوعی مولد", " ix Entertainment، با Established Artists قرارداد امضا کرده است. این در حالی است که او فصل 2 پادکست خود را با نام The A-List با آندریا لوگان راه اندازی می کند، با مهمانانی از فیلم، موسیقی، ایمان، موسیقی، سلامتی و فرهنگ که به تازگی برای اجرا تایید شده اند. آنها عبارتند از I Can Only Imagine تهیه کننده [ ] انحصاری: آندریا لوگان، بازیگر، پادکست و مالک سابق Pure Flix Entertainment، با Established Artists قرارداد امضا کرده است. تیتراژ بازیگری لوگان عبارتند از: Moms' Night Out، God's Not Dead، The Space Between Us، Revelation Road، Double Threat و Christmas Manger و او یک سریال معمولی در Malibu Dan و Hitting the Breaks بود. او همچنین تهیه کننده فیلم و برنامه های تلویزیونی بود. داستان‌های مرتبط آژانس‌ها بلا گلانویل با آژانس‌های هنرمندان معتبر امضا می‌کند ناتاشا اوفیلی با مدیریت هنرمندان تثبیت شده امضا می‌کند Pure Flix، سرویس استریم مبتنی بر ایمان که او با همسر سابقش، دیوید A.R، تأسیس کرد. وایت و دیگران در سال 2020 در یک معامله 100 میلیون دلاری به سونی پیکچرز فروخته شدند. این یکی از بزرگترین معاملات M A در رسانه های مذهبی M A بود و همچنان ادامه دارد. این قرارداد را در Deadline For Established Artists تماشا کنید، چند روز پس از امضای بلا گلنویل، مدل بریتانیایی و هنرپیشه گیک گرل انجام شد. در ماه‌های اخیر، ناتاشا اوفیلی بازیگر، نویسنده، کارگردان و تهیه‌کننده، بازیگر فیلم Creed III و The Politician و آن ماری مک‌کی، نویسنده و تهیه‌کننده کهنه‌کار و یکی از بنیان‌گذاران پروپاگاندا فیلمز را نیز برای مدیریت اضافه کرده است. پاتریک هاورن در سال 2021 هنرمندان تاسیس شده را به عنوان یک شرکت مدیریت استعداد با خدمات کامل راه اندازی کرد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Andrea-Logan-1-e1793980548711.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۸ آبان • ۱۹:۳۰"}, {"source": "Deadline", "title": "Japanese Horror Manga ‘Noah Of The Blood Sea’ Set For Feature Adaptation As Tyrus Pictures Options Rights", "link": "https://deadline.com/2026/11/japanese-horror-manga-noah-blood-adaptation-tyrus-pictures-1237215366/", "summary": y-top-music-publisher-rankings-q3/", "summary": "This year, Sony Music Publishing keeps topping its own record-breaking performances as measured by Billboard ’s 20-year-long history of ranking music publishers by market share for hit songs. After scoring the highest-ever market share for the Hot 100 in the second quarter with 37.32%, Sony has now become the first publisher ever to surpass the 40% market share milestone with 42.86% in the just-completed third quarter, setting a new record for that chart. Related 2026 Q3 Record Label Market Share: UMG Rebounds, Columbia Climbs Michael Sanft, Attorney Who Represented Keffe D in 2Pac Murder Trial, Dies at 54 Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 That performance makes Sony the top-ranked publisher for the Hot 100 chart, while it was also the No. 1 publisher on the Top Radio Airplay chart, with a 36.02% tally, thus keeping its No. 1 streak going on both charts for the sixth consecutive quarter. To accomplish that feat, Sony claimed 76 songs on the Hot 100 chart and 74 songs on the Radio Airplay Songs list, including Ella Langley ’s “Choosin’ Texas,” which finished at No. 1 and No. 2, respectively. Also helping Sony maintain its No. 1 ranking was its role as the administrator for the top songwriter on the Radio Airplay chart, Shane “ sombr ” Boose, who placed three songs on that chart, including the No. 30 tune “Back To Friends.” Perhaps the most astounding part of Sony’s performance on the Hot 100 publisher rankings this quarter is that it beat out the No. 2 publisher by 25 percentage points. Coming in second place this quarter was Warner Chappell Music, which turned in a 17.86% market share on the Hot 100 rankings. On the Top Radio Airplay rankings, Warner Chappell was also the No. 2-ranked publisher with a stronger showing, where it tallied a 23.07% market share. On the Top Radio Airplay song list, Warner Chappell snared a stake in 55 songs, with its top song being the No.  tier, taking the place of RAYE ’s This Music May Contain Hope., which is competing with a more commercially successful album by another classy English pop-soul singer, Olivia Dean . Both albums could make it, of course, but with many strong albums vying for just eight slots on the final ballot, something’s gotta give. Related Categories With the Most Fewest Entries for 2027 Grammys Paul McCartney and Taylor Swift are both going for history. If McCartney is nominated for The Boys of Dungeon Lane , it will be his record-extending 10th career nomination in this category. If Swift is nominated for The Life of a Showgirl , it will be her eighth nod in this category — more than anyone else in Grammy history for strictly solo albums. Swift is a better bet: She has been nominated in this category with each of her last four regular studio albums. McCartney was last nominated here in 2006. We show the deluxe editions of hit albums by Noah Kahan and Rosalía because those are the ones that were entered in the Grammy competition. A total of 683 albums were on the eligibility list in this category. Here are our best ", "date_str": "2026-11-09T15:00:00+00:00", "hash": "fc9b46bdc978d0e1", "title_fa": "پیش بینی های نهایی نامزدهای گرمی 2027: آلبوم سال", "summary_fa": "زمانی که نامزدهای شصت و نهمین جوایز سالانه گرمی در روز دوشنبه (16 نوامبر) اعلام شود، احتمالاً سال رویایی الا لنگلی به اوج خود می رسد. به لطف تغییر قانون در رده بهترین هنرمند جدید که در ماه ژوئن اعلام شد، که به یک هنرمند اجازه می‌دهد به جای سه بار، چهار بار وارد شود، لنگلی می‌تواند در چهار مورد از شش دسته کلی رشته - آلبوم، ضبط و آهنگ سال به علاوه بهترین هنرمند جدید نامزد شود. اگر این اتفاق بیفتد، لنگلی اولین هنرمند متقاطع کانتری خواهد بود که پس از بابی جنتری در سال 1968 به این شاهکار دست یافته است. ما برای اولین بار در ماه جولای پیش نمایش نامزدهای گرمی را در این دسته های خیمه شب بازی مشاهده کردیم. از امروز، در صورت لزوم، آن پیش‌بینی‌ها را به‌روزرسانی می‌کنیم. اول، آلبوم سال، احتمالاً معتبرترین و مورد علاقه‌ترین آلبوم در بین 100 جایزه گرمی. روز سه‌شنبه، آهنگ و آهنگ سال را بررسی خواهیم کرد. روز چهارشنبه، بهترین هنرمند جدید را بازی خواهیم کرد. موارد مرتبط اینجاست که آلبوم‌های ژانرآمیز از Rosalía، Noah Kahan، Charli xcx بیشتر در رای گیری گرمی 2027 فرود آمدند برای چهارمین سال متوالی، هشت نامزد در هر یک از این دسته‌ها وجود خواهد داشت. دوره صلاحیت برای شصت و نهمین دوره جوایز سالانه گرمی از 31 اوت 2025 تا 28 اوت 2026 ادامه داشت. زمینه رقبای احتمالی آلبوم سال از زمانی که برای اولین بار در جولای پیش نمایش آنها را مشاهده کردیم، تغییر چندانی نکرده است. من اکتان Don Toliver را از \"Within Reach\" به بالاترین سطح رساندم و جای آلبوم RAYE's This Music May Contain Hope را گرفتم، که با آلبوم موفق‌تر تجاری‌تر از خواننده باکلاس پاپ سول انگلیسی، اولیویا دین رقابت می‌کند. البته هر دو آلبوم می‌توانند به آن برسند، اما با وجود بسیاری از آلبوم‌های قوی که فقط", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2293220773-e1793989817474.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Justin Timberlake Makes Rare Public Appearance With Sons and Niece on Runway at Down Syndrome Foundation Fashion Show", "link": "https://www.billboard.com/music/pop/justin-timberlake-sons-niece-down-syndrome-foundation-show-1236377886/", "summary": "Justin Timberlake made a rare public appearance with his two young sons, 11-year-old Silas and 6-year-old Phineas, as the family gathered in Denver on Saturday (Nov.7) to help celebrate the Global Down Syndrome Foundation s 19th annual fashion show. Related Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City Justin Timberlake Crowns This FutureSex/LoveSounds Hit as the Best Song He s Ever Made: Written in Damn Near 20 Minutes Michael Jackson s Thriller Scares Up Highest Rank on Billboard 200 Albums Chart in More Than 40 Years According to People magazine, Timberlake walked the runway with his 7-year-old niece, Zaya, while attending the nonprofit s Be Beautiful Be Yourself fashion show in the Mile High city in support of brother-in-law Justin Biel and his wife Rose s daughter, who has Down syndrome. “Jessica and I adore Zaya, and we couldn’t be prouder of the remarkable difference she is making in the world,” Timberlake said in a statement shared with the organization, the magazine reported. “Every person with Down syndrome deserves the opportunity to reach their full potential, and that’s why GLOBAL’s work means so much to our family.” In an Instagram Story featuring a picture of the singer, his sons and Zaya, he wrote , We walked my beautiful niece Zaya down the @globaldownsyndrome runway last night ❤️. He followed that with a slide in which he held a smiling Zaya in his arms on the red carpet, with the caption Proud uncle! In photos from the night, Zaya held her uncle and cousin Silas hands as she walked down the catwalk with a big smile. The Timberlake men came dressed to impress, with Justin rocking a roomy black suit, while Phineas matched his dad s energy in all black and Silas opted for black pants with a black leather jacket over a white shirt and black tie, accented by sunglasses. Zaya made her own statement in a black-and-white polka dot cress and fringe boots. In a video from the event , JT and Silas bust some moves as Zaya gets a boost up onto the singer s hip as they wave to the crowd. She has some moves. Maybe her uncle Justin has taught her some moves and her auntie Jessica, says the show s announcer to cheers from the audience. The organization teased the appearance last week, posting a pic of Timberlake and wife Jessica Biel with her brother and his wife, writing, 🎉 BIG NEWS! Grammy and Emmy Award-winning superstar @justintimberlake will rock the runway with his beautiful niece, #GLOBALAmbassador alum Zaya Biel @", "date_str": "2026-11-09T14:21:20+00:00", "hash": "b5c07c1ca0a26513", "title_fa": "حضور نادر جاستین تیمبرلیک با پسران و خواهرزاده‌اش در ران وی در فشن شوی بنیاد سندروم داون", "summary_fa": "جاستین تیمبرلیک با دو پسر خردسال خود، سیلاس 11 ساله و فینیاس 6 ساله، در حالی که خانواده در روز شنبه (7 نوامبر) در دنور گرد هم آمدند تا نوزدهمین نمایشگاه مد سالانه بنیاد جهانی سندروم داون را جشن بگیرند، حضور نادری در عموم داشت. تیلور سوئیفت و کارلی کلوس مرتبط در بازی تراویس کلس در کانزاس سیتی حضور دارند. بیش از 40 سال به نقل از مجله People، تیمبرلیک در حالی که برای حمایت از برادر شوهر جاستین بیل و همسرش دخترش رز مبتلا به سندروم داون در نمایشگاه مد غیرانتفاعی Beautiful Be Yourself در شهر مایل بالا شرکت می کرد، همراه با خواهرزاده 7 ساله خود، زایا، روی باند فرودگاه رفت. تیمبرلیک در بیانیه‌ای که با این سازمان به اشتراک گذاشته شد، گفت: من و جسیکا زایا را می‌پرستیم و نمی‌توانیم به تفاوت قابل توجهی که او در جهان ایجاد می‌کند افتخار کنیم. هر فرد مبتلا به سندرم داون سزاوار این فرصت است که به پتانسیل کامل خود دست یابد و به همین دلیل است که کار GLOBAL برای خانواده ما بسیار مهم است. او در استوری اینستاگرامی با تصویری از این خواننده، پسرانش و زایا، نوشت: دیشب خواهرزاده زیبایم زایا را در باند فرودگاه @globaldownsyndrome پیاده کردیم. او آن را با یک اسلاید دنبال کرد که در آن زایا خندان را روی فرش قرمز در آغوش گرفته بود، با نوشته عموی مغرور! در عکس‌هایی از شب، زایا در حالی که با لبخندی بزرگ از سکوی راه می‌رفت، دست عمو و پسر عمویش سیلاس را گرفته بود. مردان تیمبرلیک با لباس پوشیدن آمدند تا تحت تأثیر قرار بگیرند، جاستین یک کت و شلوار مشکی جادار را تکان می داد، در حالی که فینیاس با انرژی پدرش به رنگ مشکی کاملاً هماهنگ می شد و سیلاس شلوار مشکی را با کت چرمی مشکی روی پیراهن سفید و کراوات مشکی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2304072901-e1794234332591.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۱۷:۵۱"}, {"source": "Billboard", "title": "NCT DREAM Takes a Nostalgic Trip With ‘Boogie Woogie’ Video: Exclusive Behind-the-Scenes Photos", "link": "https://www.billboard.com/photos/nct-dream-boogie-woogie-video-behind-the-scenes-photos-1236375284/", "summary": "RENJUN, JENO, HAECHAN, JAEMIN, CHENLE and JISUNG wer
