5,000, while the 45-54 group saw its median edge down from around $270,000 to $255,000. And so, the generational wealth gap might be playing out not ", "date_str": "2026-10-10T09:00:02+00:00", "hash": "e0d9b192ed01c27f", "title_fa": "ژنرال X عمیق‌تر به بدهی‌های کارت اعتباری می‌رود - حتی با وجود اینکه آنها بیشتر از همیشه درآمد کسب می‌کنند", "summary_fa": "Gen Xers با افزایش بدهی کارت اعتباری سروکار دارد. d3sign/Getty Images Gen X، فرزند وسط اقتصاد، با افزایش بدهی کارت اعتباری دست و پنجه نرم می کند. آخرین حسابداری فدرال رزرو از امور مالی مصرف کنندگان نشان داد که تعادل آنها افزایش یافته است. این در حالی است که Gen X پول بیشتری به دست می آورد، اما ارزش خالص کاهش یافته است. Gen Xers کارت های اعتباری خود را به کار می گیرند. آخرین حسابداری فدرال رزرو از امور مالی مصرف کننده نشان می دهد که از سال 2025، افراد 45 تا 54 ساله دارای بیشترین موجودی کارت اعتباری در بین گروه های سنی بودند و از 64 تا 75 سال پیشی گرفتند. در همان زمان، همسالان هزاره جوان‌ترشان بدهی‌های خود را پرداخت می‌کنند و موجودی افراد 35 تا 44 ساله کاهش می‌یابد. آخرین داده ها در حالی منتشر می شود که نسل کودکان وسط فراموش شده کشور با ثروت های مالی مختلط خود دست و پنجه نرم می کند. بر اساس شاخص دانشگاه میشیگان، احساسات مصرف‌کننده در میان آمریکایی‌های 35 تا 54 ساله کمترین میزان را دارد، و احساسات در میان نسل هزاره نسل X در همان دوره‌ای که موجودی کارت اعتباری‌شان شروع به بالا رفتن کرد، به پایین‌تر از همتایان جوان‌تر و مسن‌ترشان نزول کرد. برای افراد 45 تا 54 ساله، ترازهای تعدیل شده بر اساس تورم از حدود 3300 دلار در سال 2022 به حدود 5100 دلار در سال 2025 افزایش یافت و آنها را بالاتر از همتایان مسن خود قرار داد که قبلاً بالاترین بدهی را داشتند. با این حال، گروه 45 تا 54 ساله همچنان پردرآمدترین گروه در اقتصاد است. بر اساس نظرسنجی از امور مالی مصرف کننده، متوسط ​​درآمد قبل از مالیات آنها نزدیک به 109000 دلار است که بالاترین میزان در میان تمام گروه های سنی است. این همچنین بزرگترین درآمد متوسطی"}, {"source": "Business Insider", "title": "I tried OpenAI's new AI agent at work. Cue the corporate IT headaches.", "link": "https://www.businessinsider.com/openai-dots-ai-agent-corporate-it-workplace-test-2026-10", "summary": "Sam Altman, CEO of OpenAI, introduces Dots at the company s developer conference Reuters OpenAI's new AI agent built me a website in five minutes, but I couldn't share it. My Dot performed way better on a more complex work task, though. Corporate IT limitations make AI agents feel less magical, and OpenAI is being cautious. I attended a training at OpenAI 's office in San Francisco recently. It was all about Dots , the company's new AI agent offering. I sat in a room with about 30 other tech journalists, OpenAI PR reps, and a developer rep. Alexander Embiricos , the Dots product lead, popped in too. If you had the correct ChatGPT account, at least a Pro subscription, your Dot was there waiting. Mine was because Business Insider has an enterprise account. I fired mine up and called it alidot, with a cute wise owl as the avatar. Then… we had to think of something to do with our Dot. This is the challenge for a bunch of journalists who are not the most technical people on the planet — even tech journos. A website! I decided to have alidot make a website that I've been thinking about doing for years. My wife is obsessed with strange deaths, especially when the person dying has done something silly and knows it. She regularly finds news on these unfortunate and regretful endings, and I've always thought she should create a Tumblr-style site to collect the gruesome yarns. But, you know, we've been busy bringing up kids and doing work and stuff. So, I never got around to it. Thank god because making a website is so easy now. I put alidot to work with this request: \"Search the web for strange deaths that happen in the real world. especially when the person has time to regret having done something stupid or silly. For instance, going down a chimney to spy on your former partner and getting stuck and dying in the chimney. That was a real story, btw, from a few years ago. Keep track of all these and check that they are real. Then add them to the website and keep it up to date. Style it like a Tumblr page on this topic.\" Alidot replied: \"I'll research verified cases and build a Tumblr-style site with source links. It will take a few minutes, and I'll send the link when it's ready. I'll stick to documented facts rather than guessing what someone felt before they died.\" About five minutes later, the website appeared: \"Strange Endings\" went live with six source-checked cases, including the chimney story, in a Tumblr-style feed. \"Update endpoint\" \"It's private to you; you", "date_str": "2026-10-10T09:00:01+00:00", "hash": "9649d78b91262fb8", "title_fa": "من عامل جدید هوش مصنوعی OpenAI را در محل کار امتحان کردم. سردردهای IT شرکتی را برطرف کنید.", "summary_fa": "سم آلتمن، مدیر عامل OpenAI، Dots را در کنفرانس توسعه دهندگان شرکت معرفی می کند. عامل جدید هوش مصنوعی رویترز OpenAI برای من یک وب سایت در پنج دقیقه ساخت، اما من نتوانستم آن را به اشتراک بگذارم. با این حال، My Dot در یک کار کاری پیچیده‌تر عملکرد بهتری داشت. محدودیت‌های IT شرکت باعث می‌شود که عوامل هوش مصنوعی کمتر احساس جادو کنند و OpenAI محتاط است. من اخیراً در یک دوره آموزشی در دفتر OpenAI در سانفرانسیسکو شرکت کردم. همه چیز در مورد Dots بود، پیشنهاد جدید عامل هوش مصنوعی این شرکت. من با حدود 30 روزنامه‌نگار فناوری دیگر، نمایندگان روابط عمومی OpenAI و یک نماینده توسعه‌دهنده در اتاقی نشستم. الکساندر امبیریکوس، پیشرو محصول Dots نیز وارد بازار شد. اگر حساب ChatGPT درستی داشتید، حداقل یک اشتراک حرفه ای، Dot شما در آنجا منتظر بود. مال من به این دلیل بود که Business Insider یک حساب سازمانی دارد. من جغد خود را روشن کردم و آن را alidot نامیدم، با یک جغد عاقل زیبا به عنوان آواتار. سپس… باید به چیزی فکر می‌کردیم که با Dot خود انجام دهیم. این چالش برای گروهی از روزنامه‌نگاران است که فنی‌ترین افراد روی کره زمین نیستند - حتی ژورنال‌های فناوری. یک وب سایت! من تصمیم گرفتم که alidot وب سایتی بسازم که سال هاست در مورد آن فکر می کنم. همسرم در مورد مرگ های عجیب و غریب وسواس دارد، به خصوص زمانی که فرد در حال مرگ کار احمقانه ای انجام داده است و آن را می داند. او مرتباً اخباری درباره این پایان‌های تأسف‌آور و تأسف‌آور پیدا می‌کند، و من همیشه فکر می‌کردم که باید یک سایت به سبک Tumblr برای جمع‌آوری نخ‌های وحشتناک ایجاد کند. اما، می دانید، ما مشغول بزرگ کردن بچه ها و انجام کار و چیزهای دیگر بوده ایم. بنابراین، من هرگز به آن نزدیک"}, {"source": "Business Insider", "title": "He needed a caregiver as his body shut down. AI found him the one.", "link": "https://www.businessinsider.com/caregiving-ai-long-term-care-als-honor-home-instead-2026-10", "summary": "Merrill Hale has relied on technology for his caregiving. Jordan Gale for BI Christina Evers, 42, watches on, holding the back of Merrill Hale's motorized wheelchair, as he controls his screen with his eyes. It's the only way Hale, 57, has found to effectively communicate with Evers, his caregiver . Hale was diagnosed with ALS a decade ago and has slowly lost the ability to speak, eat, and move. \"Tech is essential to my survival,\" Hale says, read aloud by a computerized voice. \"He's the brightest guy in the world,\" his mom, Judy, says as she watches him in their Oregon home. Hale uses advanced eye gaze technology to communicate. Jordan Gale for BI Evers and Hale have formed an incredibly tight bond, Judy says. That's by design. They were matched, in part, by AI. The two were connected through Home Instead, a home healthcare services company that operates in 1,200 locations across six countries. Home Instead was acquired in 2021 by Honor Technology, which has integrated AI algorithms and machine learning tools to match eldercare workers with clients. Are you paying for your own or your loved one's long-term care? Do you have thoughts to share about long-term care in the US? To share your story with a reporter, please fill out this quick form . Honor's tech has allowed for \"smart matching,\" using algorithms to analyze caregiver availability, personality traits, skill sets, and prior client familiarity. The algorithms target patterns in how people work, such as ideal schedules or locations for caregivers, based on thousands of data points. The algorithms also anticipate future events, such as identifying when a caregiver may be at risk of missing a shift before it happens. \"I was lucky to have found her,\" Hale says. \"Caregiving, I feel, is deeply personal, and you spend so much time with people at the most difficult time of their lives. I look forward to her visits every time.\" Up until 10 years ago, Hale said life was rich and fulfilling. He played sports in high school and held jobs as a drafter, then an engineer, for a railcar manufacturer. He left his two-decade career to pursue music, playing drums in a Led Zeppelin tribute band. He raised two children and had been healthy and active, aside from minor back and knee pain , until his mid-40s, when his body began to shut down. ALS destroys motor neurons, leading to muscle weakness and loss of movement. Hale and his caregiver Christina Evers were connected in part through AI. Jordan Gale for BI \"The change i", "date_str": "2026-10-10T08:30:01+00:00", "hash": "8f622845f19a5da1", "title_fa": "او به یک مراقب نیاز داشت که بدنش بسته شد. هوش مصنوعی او را پیدا کرد.", "summary_fa": "مریل هیل برای مراقبت از خود به فناوری تکیه کرده است. جردن گیل برای BI کریستینا اورز، 42 ساله، در حالی که پشت ویلچر موتوری مریل هیل را نگه می دارد، نگاه می کند و او صفحه نمایش خود را با چشمانش کنترل می کند. این تنها راهی است که هیل 57 ساله برای برقراری ارتباط مؤثر با اورز، مراقب خود پیدا کرده است. هیل یک دهه پیش به بیماری ALS مبتلا شد و به تدریج توانایی صحبت کردن، غذا خوردن و حرکت را از دست داد. هیل می گوید: \"تکنولوژی برای بقای من ضروری است.\" مادرش جودی در حالی که او را در خانه شان در اورگان تماشا می کند، می گوید: \"او باهوش ترین مرد جهان است.\" هیل از فناوری پیشرفته نگاه چشم برای برقراری ارتباط استفاده می کند. جودی می‌گوید جردن گیل برای BI Evers و هیل پیوند بسیار محکمی ایجاد کرده‌اند. که با طراحی است. آنها تا حدی با هوش مصنوعی مطابقت داشتند. این دو از طریق Home Instead، یک شرکت خدمات بهداشتی خانگی که در 1200 مکان در شش کشور فعالیت می کند، به هم متصل شدند. Home Instead در سال 2021 توسط Honor Technology خریداری شد که الگوریتم‌های هوش مصنوعی و ابزارهای یادگیری ماشین را برای تطبیق کارکنان مراقبت از سالمندان با مشتریان یکپارچه کرده است. آیا برای مراقبت طولانی مدت خود یا عزیزتان هزینه می کنید؟ آیا فکری برای به اشتراک گذاشتن در مورد مراقبت طولانی مدت در ایالات متحده دارید؟ برای به اشتراک گذاشتن داستان خود با یک خبرنگار، لطفاً این فرم سریع را پر کنید. فناوری Honor امکان «تطبیق هوشمند» را فراهم کرده است، با استفاده از الگوریتم‌هایی برای تجزیه و تحلیل در دسترس بودن مراقب، ویژگی‌های شخصیتی، مجموعه مهارت‌ها و آشنایی قبلی با مشتری. الگوریتم‌ها الگوهایی را در نحوه کار افراد، مانند برنامه‌ها یا مکان‌های ایده‌آل برای مراقبین، بر اساس"}, {"source": "Business Insider", "title": "I’m an HR strategist, and here's how I hire differently as AI reshapes the career ladder", "link": "https://www.businessinsider.com/how-my-interview-questions-changed-ai-reshapes-the-career-ladder-2026-10", "summary": "Toshiba s HR leader, Jason Desentz, discusses how his job interview questions and recruitment processes are changing because of AI. Courtesy of Toshiba Toshiba's HR leader, Jason Desentz, discusses AI's role in transforming recruitment processes. Desentz emphasizes adaptability and problem-solving over specific skills in recruitment interviews. Desentz said HR leaders should acknowledge AI anxiety and work on AI training. This as-told-to essay is based on a conversation with Jason Richard Desentz, Toshiba’s chief human resources officer for the Americas. Desentz has been in the HR industry for nearly 30 years and joined Toshiba more than two years ago. The essay has been edited for length and clarity. When I first got into HR, not everyone had a computer. People had notepads and paper in front of their desks, and they still worked. Now people are asking: How can I become a recruiter if an AI automation goes through the résumés? How am I going to learn to screen a candidate and move up the career ladder? I don’t approach this as an AI story. It’s an adaptability story, and AI is another chapter. Having AI doesn’t mean I won’t still have junior-level employees. The junior job will just be different, and I will be hiring differently, too. Junior recruiters can become consultants sooner For a lower-level job at a company like Toshiba, a junior-level HR could face a thousand résumés. Am I actually going to go through the full thousand? No. I would be here all day, seven days a week, reading résumés . Typically, you’ll go through the first 50, and if you get 10 good résumés, you’ll stop. You could be missing a gem in the rest. We’ve built AI bots, including one for recruiting. The aim is to surface stronger candidates and free recruiters to enhance other parts of the process. Instead of reading résumés one by one, they can focus more on the intake: How can I make my questions for managers better? I also want to put more effort into onboarding and that first-day magical experience: Employees walk in, have everything they need, and are trained. We use AI to create interview guides from a résumé, job description, and manager’s intake form. These can be personalized to the candidate, identifying areas where we should ask more questions without eliminating someone who may be able to learn. Even in a junior role, your job becomes more of a consultant rather than a transactional, “Here’s a résumé.” I ask how you think more than what you can do Rather than saying, “Can ", "date_str": "2026-10-10T08:11:01+00:00", "hash": "677f7f7172ba695d", "title_fa": "من یک استراتژیست منابع انسانی هستم و در اینجا نحوه استخدام متفاوت است زیرا هوش مصنوعی نردبان شغلی را تغییر می دهد", "summary_fa": "رهبر منابع انسانی توشیبا، جیسون دسنتز، درباره چگونگی تغییر سوالات مصاحبه شغلی و فرآیندهای استخدام او به دلیل هوش مصنوعی صحبت می کند. با حسن نیت از توشیبا، رهبر منابع انسانی توشیبا، جیسون دسنتز، در مورد نقش هوش مصنوعی در تغییر فرآیندهای استخدام بحث می کند. دسنتز بر انطباق پذیری و حل مسئله بر مهارت های خاص در مصاحبه های استخدامی تاکید می کند. دسنتز گفت که رهبران منابع انسانی باید اضطراب هوش مصنوعی را بپذیرند و روی آموزش هوش مصنوعی کار کنند. این مقاله گفته شده بر اساس گفتگو با جیسون ریچارد دسنتز، مدیر ارشد منابع انسانی توشیبا برای قاره آمریکا است. دسنتز نزدیک به 30 سال است که در صنعت منابع انسانی فعالیت می کند و بیش از دو سال پیش به توشیبا پیوست. مقاله برای طولانی بودن و وضوح ویرایش شده است. وقتی برای اولین بار وارد رشته منابع انسانی شدم، همه کامپیوتر نداشتند. مردم در جلوی میز خود دفترچه و کاغذ داشتند و همچنان کار می کردند. اکنون مردم می پرسند: اگر یک اتوماسیون هوش مصنوعی رزومه را طی کند، چگونه می توانم استخدام کننده شوم؟ چگونه می توانم یاد بگیرم که یک نامزد را بررسی کنم و از نردبان شغلی بالا بروم؟ من به این موضوع به عنوان یک داستان هوش مصنوعی نگاه نمی کنم. این یک داستان سازگاری است و هوش مصنوعی فصل دیگری است. داشتن هوش مصنوعی به این معنی نیست که من هنوز کارمندان سطح پایینی نخواهم داشت. شغل جوان فقط متفاوت خواهد بود، و من نیز متفاوت استخدام خواهم کرد. استخدام‌کنندگان جوان می‌توانند زودتر مشاور شوند برای یک شغل سطح پایین در شرکتی مانند توشیبا، یک نیروی انسانی سطح پایین ممکن است با هزاران رزومه روبرو شود. آیا من واقعاً از هزاران کامل عبور خواهم کرد؟ نه. من تمام روز، هفت روز هفته، اینجا بودم و رزومه می خواندم. معمولاً 50"}, {"source": "Business Insider", "title": "A recipe developer with Greek heritage shares her 2 favorite Mediterranean diet recipes", "link": "https://www.businessinsider.com/favorite-mediterranean-diet-recipes-from-greek-recipe-developer-2026-10", "summary": "Maria Koutsogiannis is a recipe developer and author of the cookbook Greek Out. Andrei Barb Maria Koutsogiannis, a recipe developer, draws inspiration from her summers spent in Greece. Koutsogiannis follows a Mediterranean-style diet focused on veggies, lean protein, and legumes. She shared two of her favorite Greek-inspired recipes. Maria Koutsogiannis remembers her yiayia making makaronia me kima — a Greek-style spaghetti with meat sauce — for her and her siblings on repeat as a child. Each summer, she'd spend three months in her parents' home country, Greece, and soak up the aromas of classic Mediterranean dishes. Growing up in Saskatchewan, Canada, these yearly trips were her introduction to the Mediterranean diet and lifestyle. \"We had homes in the city of Astros, which is a coastal city, where we'd go to the beach, and we were lucky enough to just bathe in the sun all day. And it was really just eat, ocean, sleep, eat, hang out, repeat daily,\" Koutsogiannis told Business Insider. Now a Greek \"food obsessive,\" recipe developer, and author of the cookbook \"Greek Out,\" Koutsogiannis spends hours every week making, eating, and thinking about the diet of some of the world's longest-living people . Can't get enough healthy-eating tips? Check out more coverage on Business Insider: A colorectal dietitian shares 2 foods she eats regularly and 1 she avoids to lower her cancer risk A gut health scientist shared 3 recipes that help her eat 30 grams of fiber a day, from noodles to chocolate slices A cook who grew up on the Mediterranean Diet shares what she eats in a day, including sweet potatoes at breakfast The Mediterranean diet centers on fresh produce , whole grains, legumes, nuts, seeds, and lean protein sources. It has been linked to a lower risk of type two diabetes, cardiovascular disease, cancer, and dementia. It's recommended by GI doctors , cardiologists, and dietitians for its health benefits, but also because it's flexible and unrestrictive, making it easier to follow and maintain than many other diets. Koutsogiannis shared two of her favorite Mediterranean diet-style recipes . Bifteki (baked beef patties) with Greek-style fries Koutsogiannis s bifteki (baked beef patties) recipe from Greek Out. Linda Xiao Ingredients For the bifteki: 1 large white or yellow onion, peeled 2 Roma tomatoes 1½ pounds 90 percent lean ground beef ¾ cup plain breadcrumbs 1 large egg ¼ cup packed chopped f nd-elon-musk-marc-benioff-2026-10", "summary": "Marc Benioff said Salesforce s AIForce platform will be renamed SIForce. Bloomberg/Getty Images Trump called those who don't adopt the term super intelligence \"the enemy.\" Marc Benioff said Salesforce's AIForce platform is becoming SIForce. Elon Musk also pledged to rename SpaceXAI as SpaceXSI. Donald Trump wants two letters scrubbed from the tech industry’s vocabulary, and some executives are already reaching for replacements. Salesforce CEO Marc Benioff said Friday that his company’s AIForce platform is getting a new name. “The era of Super Intelligence is here. AIForce is officially SIForce,” Benioff wrote on X. The announcement follows Elon Musk’s pledge Sunday to rename SpaceXAI to SpaceXSI, giving Trump’s campaign to replace “artificial intelligence” with “ super intelligence ” traction beyond Washington. Salesforce’s change concerns its agent platform, rather than the company’s corporate name. Trump, meanwhile, is turning his terminology preference into a test. “The White House considers anyone that uses the term, ‘Artificial Intelligence,’ as opposed to the highly accepted new and more accurate term, ‘Super Intelligence,’ THE ENEMY!” Trump wrote on Truth Social on Thursday. The warning escalates a push Trump formalized in a September 29 executive order directing federal agencies to substitute “Super Intelligence” and “SI” for “ Artificial Intelligence ” and “AI” in official communications, websites, reports, and policy documents, to the extent permitted by law. Private companies aren’t required by the order to follow suit. But Benioff’s announcement and Musk’s proposed rebrand show how the president’s preferred language is making its way into corporate branding. The administration’s argument is that AI has outgrown its name. The executive order says today’s systems increasingly amplify human creativity and that “Super Intelligence” better captures their potential. The rebranding push complicates matters for c ن قیمتی است که در طول سال در Airwrap ردیابی کرده‌ایم، و در حالی که من انتظار قیمت‌گذاری مشابهی را در جمعه سیاه دارم، اگر به این فکر می‌کنید که صبر کنید، آیا نمی‌خواهید با یک انفجار عالی در جشن شکرگزاری شرکت کنید؟ همه معاملات زیبایی Dyson را ببینید. چرا Dyson Airwrap i.d. یک خرید عالی است Jaclyn Turner/Business Insider Dyson Airwrap سشوار، برس خشک کن، و اتو فرکننده من است. اگر اخطار ندهم که دستگاه منحنی یادگیری دارد، به خصوص یاد گرفتن نحوه پیچیدن موها توسط جریان هوای کوآندا، نادیده می‌گیرم، اما کمی صبر و تمرین منجر به روزهای ثابت و با کیفیت آرایشگاهی در خانه می‌شود. فراتر از جایگزینی یک کشوی کامل از ابزارهای داغ، به همین دلیل Airwrap i.d. ارزش سرمایه گذاری را دارد: طراحی بدون آسیب شدید گرما: برخلاف اتوها و چوب های سنتی که از حرارت مستقیم"}, {"source": "Business Insider", "title": "The 6 best shoe polishes in 2026", "link": "https://www.businessinsider.com/guides/style/best-shoe-polish", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Tarrago These days, a shoe-shine stand is more of an anachronism than a modern convenience. It's up to you to invest in the best shoe polish to keep your shoes looking sharp and presentable. Leather dress shoes can easily run upwards of $400, but you can justify the splurge if you're committed to making them last. Our top recommendation is the Saphir Renovateur , which is a rich conditioning shoe cream that effectively moisturizes leather and is available in either a mink or macadamia oil formula. Meanwhile, a cream polish leaves a thin layer of cream that helps blend scratches and scuffs and gives the shoe a medium shine. For a more affordable option that manages this, we recommend the Leather Spa Leather Cream . The three categories of shoe polishes covered in this guide are cream polish, wax polish, and conditioner. I spoke to Tony Pecorella, the owner of Manhattan's Modern Leather Goods , a storied leather care and repair business with history dating back to the 1940s , who explained to me what each product does to make the best leather dress boots last. He advises that the highest shine comes from wax polish, which also works best for covering scuffs and scratches. For more on our conversation, see the FAQ section below. A quick look at the top shoe polishes in 2026 Best conditioner: Saphir Renovateur Saphir Sizing options: 75 mL Modern Leather Goods almost exclusively uses Saphir products, and they're not alone. Of the many guides I've read on shoe care by various industry professionals, nearly all of them list Saphir as the top leather product company and the brand's Renovateur as the best conditioner. I put it to the test on a pair of old cowboy boots I've had for 20 years that have seen a lot of wear and tear, and much less care. The leather greedily soaked in the Renovateur and I could see the results quickly. The leather had a more regular color, a light shine, and took on a richer brown. According to a company rep, Saphir, a French company founded in 1920, continues to manufacture its products in the same way it did when it was first founded. The ingredient list (and the smell, which is quite pleasant) is closer to what you might find in a skincare product than what you'd expect to rub on your shoes. The list includes lanolin, beeswax, and mink oil. While more expensive at around $30 for a 75 mL jar, a little goes a long way and it doesn't need to be a", "date_str": "2026-10-09T21:07:34+00:00", "hash": "64ab51c38fc6653a", "title_fa": "6 بهترین واکس کفش در سال 2026", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید تاراگو این روزها، پایه براق کفش بیش از آنکه یک وسیله مدرن مدرن باشد، یک امر نابهنگام است. این به شما بستگی دارد که روی بهترین پولیش کفش سرمایه گذاری کنید تا کفش های خود را تیز و ظاهری نگه دارید. کفش‌های مجلسی چرمی به راحتی می‌توانند تا 400 دلار قیمت داشته باشند، اما اگر متعهد به ماندگاری آن‌ها باشید، می‌توانید این گرانی را توجیه کنید. توصیه اصلی d with tiger shrimp. It ended with fluffy French toast and a berry compote. These are just two of the 10 best things I ate on Royal Caribbean's Wonder of the Seas. I thought I'd get sick of the food by the end of my seven-day voyage in April 2022. I'd never been on a cruise before, but I imagined my dining options would be limited at sea. And they might have been if I weren't on board Royal Caribbean's Wonder of the Seas , one of the largest cruise ships in the world. The megaship has 20 eateries, from coffee shops and buffets to fast-food joints and upscale restaurants. I was overwhelmed with options every time I got hungry on my Caribbean cruise . I ate at as many different restaurants as I could — more than half of them. There were 10 standout dishes that I still think about when my stomach grumbles. Some of the best meals were included in the cruise rate. Others came from specialty restaurants. Joey Hadden/Business Insider Wonder of the Seas has some restaurants that are complimentary as part of the cruise rate , while specialty dining incurs an additional cost. For the latter, guests often pay a cover charge for a three-course meal. I made reservations at five specialty restaurants . I recommend booking your reservation as soon as possible, because the cost tends to rise the longer you wait. Two of my favorite dishes came from the main dining room. Joey Hadden/Business Insider The main dining room is complimentary for guests and serves breakfast and a three-course dinner each day. One was a dinner entrée — garlic tiger shrimp with jasmine rice, seasonal veggies, and herb butter. Joey Hadden/Business Insider The shrimp was juicy and had great flavor. The rice was sticky, which I like, and the asparagus and tomatoes were well-seasoned. The other was a French toast breakfast. The bread was thick, crispy on the outside, and fluffy on the inside. Joey Hadden/Business Insider A delicious berry compote on top paired nicely with maple syrup. Two crispy strips of bacon added a savory crunch to each bite. This was my favorite breakfast of the whole trip. I also particularly enjoyed El Loco Fresh, an outdoor DIY taco bar. Joey Hadden/Business Insider It's included for guests and serves a selection of meats, cheeses, and toppings, like pico de gallo, guacamole, and sour cream. I grabbed a ", "date_str": "2026-10-09T19:44:04+00:00", "hash": "d154bd800fcf97a9", "title_fa": "من یک هفته را صرف غذا خوردن در یکی از بزرگترین کشتی های تفریحی جهان کردم. بعد از سالها، هنوز هوس این 10 غذا را دارم.", "summary_fa": "خبرنگار Business Insider در طول سفر دریایی خود با کشتی شگفت انگیز دریاهای رویال کارائیب در چندین رستوران شام خورد. جوی هادن/Business Insider سفر هفت روزه من با میگوی ببری آغاز شد. با نان تست فرانسوی کرکی و کمپوت توت به پایان رسید. اینها فقط دو مورد از 10 بهترین چیزی است که من در Wonder of the Seas از رویال کارائیب خوردم. فکر می کردم تا پایان سفر هفت روزه ام در آوریل 2022 از غذا خسته می شوم. من قبلاً هرگز در سفر دریایی نرفته بودم، اما تصور می کردم گزینه های غذاخوری من در دریا محدود می شود. و اگر من در کشتی رویال کارائیب Wonder of the Seas، یکی از بزرگترین کشتی‌های کروز جهان، نبودم، ممکن بود همینطور باشند. این کشتی بزرگ 20 غذاخوری دارد، از کافی‌شاپ‌ها و بوفه‌ها گرفته تا فست‌فودها و رستوران‌های مجلل. هر بار که در سفر دریایی کارائیب گرسنه می شدم، غرق گزینه ها بودم. من تا جایی که می توانستم در رستوران های مختلف غذا خوردم - بیش از نیمی از آنها. 10 غذای برجسته وجود داشت که هنوز وقتی شکمم غرغر می کند به آنها فکر می کنم. برخی از بهترین وعده های غذایی در نرخ کروز گنجانده شده است. دیگران از رستوران های خاص آمده بودند. Joey Hadden/Business Insider Wonder of the Seas رستوران‌هایی دارد که به‌عنوان بخشی از نرخ کروز رایگان هستند، در حالی که غذاخوری‌های ویژه با هزینه اضافی همراه است. برای دومی، مهمانان اغلب برای یک وعده غذایی سه وعده هزینه پوشش می پردازند. من در پنج رستوران تخصصی رزرو کردم. توصیه می‌کنم در اسرع وقت رزرو خود را رزرو کنید، زیرا هر چه بیشتر منتظر بمانید هزینه آن افزایش می‌یابد. دو تا از غذاهای مورد علاقه من از اتاق غذاخوری اصلی تهیه شد. Joey Hadden/Business Insider اتاق غذاخوری اصلی برای مهمانان رایگان است و هر"}, {"source": "Business Insider", "title": "I'm 61 and can't find a job. I've drained my savings and started a GoFundMe to help pay the bills.", "link": "https://www.businessinsider.com/software-engineer-quit-tech-job-search-unemployed-gig-work-dallas-2026-10", "summary": "Gautam Dev turned to gig work after struggling to find another full-time tech job. Gautam Dev Gautam Dev worked in tech for more than two decades before quitting his job in 2024. Two years of job hunting later, he's still without a full-time role. The 61-year-old is struggling to afford rent and is considering leaving the US. This as-told-to essay is based on a conversation with Gautam Dev, a 61-year-old job seeker in Dallas. He previously worked as a software engineer before resigning in 2024. The following has been edited for length and clarity. In 2024, while working as a software engineer for an IT company in Dallas, I was told I'd have to relocate to another state to keep my job. That September, I decided to quit my job, stay in Dallas, and look for a new role . That decision became a disaster. I didn't realize how difficult finding another job would be I'd worked in the IT industry for more than two decades and had gaps of a few months between jobs before, but I was always able to find another one. This time has been completely different. I never expected to still be without full-time work nearly two years later. After I resigned, I didn't immediately start seriously searching for another job, but I soon began applying, mostly to jobs through LinkedIn. I also tried networking, but it wasn't much help. Most of the people I talked to said their companies weren't hiring . Some told me their jobs had gotten tougher, but that they were afraid to quit because they might not find another one. Still, I've managed to land some interviews over the course of my search, including multiple with the same company. I thought some went well, but I never received an offer. I thought my significant experience in the IT industry would help me find a job. However, I think being in my 60s could be working against me. And after being out of work for so long, I also think the employment gap is making things even more difficult. It seems like AI can do some of the things software engineers used to do manually. I've seen job postings for AI engineering positions , but I don't have much of an AI background, so I'm not sure they're a good fit. Between my age, the long gap, and the state of the IT industry, my expectations for finding another job have fallen. Jacob Zinkula writes about how workers in tech and other industries are navigating their careers. Share your story with him by filling out this form , emailing him , or reaching out via Signal at jzinkula.29. Follow his wor", "date_str": "2026-10-09T19:40:54+00:00", "hash": "7c965bf9642726b9", "title_fa": "من 61 سالمه و نمیتونم کار پیدا کنم. پس اندازم را تمام کرده ام و یک GoFundMe راه اندازی کرده ام تا به پرداخت صورتحساب ها کمک کنم.", "summary_fa": "Gautam Dev پس از تلاش برای یافتن شغل تمام وقت فناوری دیگری به کار کنسرت روی آورد. Gautam Dev Gautam Dev قبل از اینکه در سال 2024 شغل خود را ترک کند، بیش از دو دهه در فناوری کار کرد. دو سال بعد از شکار شغل، او هنوز هیچ نقشی تمام وقت ندارد. این مرد 61 ساله برای تامین هزینه اجاره خانه با مشکل مواجه است و در حال بررسی ترک آمریکا است. این مقاله گفته شده بر اساس گفتگو با گوتام دیو، یک جویای کار 61 ساله در دالاس است. او قبل از استعفا در سال 2024 به عنوان مهندس نرم افزار کار می کرد. موارد زیر برای طول و وضوح ویرایش شده است. در سال 2024، زمانی که به عنوان مهندس نرم افزار برای یک شرکت فناوری اطلاعات در دالاس کار می کردم، به من گفتند که برای حفظ شغل خود باید به ایالت دیگری نقل مکان کنم. آن سپتامبر، تصمیم گرفتم کارم را رها کنم، در دالاس بمانم و به دنبال یک نقش جدید باشم. این تصمیم به یک فاجعه تبدیل شد. نمی‌دانستم یافتن شغل دیگری چقدر دشوار است، بیش از دو دهه در صنعت فناوری اطلاعات کار کرده بودم و قبل از آن چند ماه فاصله بین شغل‌ها داشتم، اما همیشه می‌توانستم شغل دیگری پیدا کنم. این بار کاملا متفاوت بوده است. هرگز انتظار نداشتم که تقریباً دو سال بعد همچنان بدون کار تمام وقت بمانم. پس از استعفا، بلافاصله شروع به جستجوی جدی برای شغل دیگری نکردم، اما خیلی زود شروع به درخواست کردم، بیشتر برای مشاغل از طریق لینکدین. شبکه را هم امتحان کردم، اما فایده چندانی نداشت. اکثر افرادی که با آنها صحبت کردم گفتند که شرکت آنها استخدام نمی کند. برخی به من گفتند که کارشان سخت‌تر شده است، اما می‌ترسند کار را ترک کنند، زیرا ممکن است شغل دیگری پیدا نکنند."}, {"source": "Lifehacker", "title": "Five New Features Coming to Your iPhone in iOS 27.2", "link": "https://lifehacker.com/tech/new-features-coming-to-iphone-ios-272?utm_medium=RSS", "summary": "If you're like most people, you might still be getting used to iOS 27 on your iPhone. Perhaps you haven't even installed it yet, or maybe you're confused about why iOS 27.0.1 exists. (The short answer: The iPhone 18 Pro is a bit glitchy .) But there's a new iPhone update on the horizon that adds even more new features and changes to the mix: iOS 27.2. While this update isn't nearly as big of an overhaul as iOS 27 itself, it's still impactful, especially for Health app users. Here's what's new. The update is currently in testing, so if you want to try it out early, y ou can enroll your iPhone in Apple's beta and check these features out today. Just know that all betas come with some level of risk, so if you decide to go down this path, create a proper backup of all important data before installing the beta. iOS 27.2's new Health app Credit: Beth Skwarecki With iOS 27.2, Apple is totally overhauling the Health app . This is perhaps the biggest change coming with Apple's update, and fitness users will likely welcome many of these new features. With the new Health app, you'll be able to see your Fitness rings within the Health app, rather than the Fitness app; there's a new \"Longevity\" tab that gives you insights into key aspects of your long-term health, including mental wellbeing, nutrition, daily movement, heart health, metabolic health, sleep, and hearing health. There are also new assessments you can take to analyze your current overall health and where you can improve, including a new \"Health Age\" feature . You can even allow your iPhone's camera to watch you exercise in order to rate your fitness in categories like flexibility, balance, VO2max, and strength. This is by far the Health app's biggest revamp in years, and I'm looking forward to exploring the new features when the update drops. For more on what's new with the Health app in iOS 27.2, check out Lifehacker senior health editor Beth Skwarecki's guide here . (Beth is particularly fond of the new step count that appears at the top of both the Health and Fitness apps.) iOS 27.2 expands \"Call Context\" Call Context is an excellent use of Apple Intelligence. When you're on a phone call, Apple Intelligence checks if the phone number you're calling is related to a business that you have relevant information for elsewhere on your device. If so, it fetches that information for you and displays it on the call screen. For example, if you're talking with your airline's customer service line, Call Context can", "date_str": "2026-10-09T19:30:00+00:00", "hash": "83c62c4fefa3b37f", "title_fa": "پنج ویژگی جدید در iOS 27.2 به آیفون شما می آید", "summary_fa": "اگر شما هم مانند اکثر مردم هستید، ممکن است همچنان به iOS 27 در آیفون خود عادت کنید. شاید حتی هنوز آن را نصب نکرده باشید، یا شاید در مورد دلیل وجود iOS 27.0.1 سردرگم شده باشید. (پاسخ کوتاه: آیفون 18 پرو کمی پرگل است.) اما به‌روزرسانی جدید آیفون در افق وجود دارد که ویژگی‌ها و تغییرات جدید بیشتری را به ترکیب اضافه می‌کند: iOS 27.2. در حالی که این به روز رسانی تقریباً به اندازه خود iOS 27 یک تغییر اساسی نیست، اما همچنان تأثیرگذار است، به ویژه برای کاربران برنامه Health. در اینجا چه چیزی جدید است. این به‌روزرسانی در حال حاضر در مرحله آزمایش است، بنابراین اگر می‌خواهید زودتر آن را امتحان کنید، می‌توانید آیفون خود را در نسخه بتا اپل ثبت کنید و امروز این ویژگی‌ها را بررسی کنید. فقط بدانید که همه نسخه های بتا با سطحی از خطر همراه هستند، بنابراین اگر تصمیم دارید این مسیر را طی کنید، قبل از نصب نسخه بتا یک نسخه پشتیبان مناسب از تمام داده های مهم ایجاد کنید. برنامه سلامت جدید iOS 27.2 اعتبار: Beth Skwarecki با iOS 27.2، اپل به طور کامل برنامه Health را بازسازی می کند. این شاید بزرگ‌ترین تغییری باشد که با به‌روزرسانی اپل رخ می‌دهد و کاربران تناسب اندام احتمالاً از بسیاری از این ویژگی‌های جدید استقبال خواهند کرد. با برنامه جدید Health، می‌توانید حلقه‌های تناسب اندام خود را به جای برنامه تناسب اندام در برنامه Health ببینید. یک برگه جدید \"طول عمر\" وجود دارد که به شما اطلاعاتی در مورد جنبه های کلیدی سلامت طولانی مدت شما می دهد، از جمله سلامت روان، تغذیه، حرکت روزانه، سلامت قلب، سلامت متابولیک، خواب و سلامت شنوایی. همچنین ارزیابی‌های جدیدی وجود دارد که می‌توانید برای تجزیه و تحلیل سلامت کلی فعلی خود و مکان‌هایی که می‌توانید بهبود ببخشید، از جمله ویژگی جدید \"عصر سلامتی\""}, {"source": "Lifehacker", "title": "There's Now a Better Way to Turn Off AI 'Insights' in the Google Health App", "link": "https://lifehacker.com/health/how-to-turn-off-the-ai-coach-in-the-google-health-app?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Ever since the Fitbit app became the Google Health app , the app s AI features became impossible to avoid for Premium users or at least it may seem that way. There are two ways to avoid the long-winded, sometimes judgy insights that pop up on your screen multiple times a day. I'll show you both: a way to turn off the AI entirely, and a way to get those insights to go away without turning off all the AI-enabled features. Google Fitbit Air - Obsidian $99.99 at Amazon Shop Now Shop Now $99.99 at Amazon Why you may want to turn off the Google Health Coach The AI-based Health Coach is the centerpiece of the Google Health app, at least if you have a premium subscription. You may have accepted a three-month free trial of Google Health Premium when you connected a new device, or you may pay for Google AI Pro or Ultra, which includes the Health Coach. When the Coach is enabled, it updates the main screen of the app with a few paragraphs of text several times a day. (You ll also get a notification with each of these updates). The Coach will tell you how well you slept, congratulate you on a hard workout, or suggest workouts for the day given how recovered you seem to be. But, as I wrote in my Fitbit Air review , the Coach hallucinates pretty often, misreporting your workout data or misunderstanding what you ve told it are your goals. One user, returning to their normal routine after surgery, posted to Reddit that the Coach keeps trying to talk them out of doing workouts. They called it a Demotivation Coach. Others have pointed out that the Coach doesn t seem to be reading its own data correctly . On a more personal note, the Coach uses a tone that I find insufferable: arrogant and excessively positive, except when it s being unnecessarily negative. I d prefer neutral, factual feedback or none at all. To be fair to Google, the team has been hard at work on the Coach, and I've noticed its insights become a little more readable and a little less random since the feature first launched. But I'm still not always in the mood to see the Coach's chipper little pep talks. How to turn off the Coach \"insights\" without losing other AI features Left: the Today screen with no insights. Right: asking the Coach for an insight on-demand still works. Credit: Beth Skwarecki Those unprompted pep talks are what the Google Health app calls \"insights.\" Google quietly added a setting to turn them off in the August 2026 feature update . Tap ", "date_str": "2026-10-09T18:00:00+00:00", "hash": "02ab599d45be7780", "title_fa": "اکنون راه بهتری برای غیرفعال کردن «Insights» هوش مصنوعی در برنامه Google Health وجود دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. از زمانی که برنامه Fitbit به برنامه Google Health تبدیل شد، اجتناب از ویژگی‌های هوش مصنوعی برنامه برای کاربران Premium غیرممکن شد یا حداقل ممکن است اینطور به نظر برسد. دو راه برای جلوگیری از بینش‌های طولانی و گاه مبهم وجود دارد که چندین بار در روز روی صفحه نمایش شما ظاهر می‌شوند. من هر دو را به شما نشان خواهم داد: راهی برای خاموش کردن کامل هوش مصنوعی، و راهی برای از بین بردن این بینش ها بدون خاموش کردن همه ویژگی های دارای هوش مصنوعی. Google Fitbit Air - Obsidian 99.99 دلار در آمازون همین حالا خرید کنید اکنون 99.99 دلار در آمازون خرید کنید چرا ممکن است بخواهید Google Health Coach را خاموش کنید؟ ممکن است با اتصال یک دستگاه جدید، یک دوره آزمایشی رایگان سه ماهه Google Health Premium را پذیرفته باشید، یا ممکن است برای Google AI Pro یا Ultra، که شامل Health Coach می‌شود، پرداخت کنید. هنگامی که Coach فعال است، صفحه اصلی برنامه را با چند پاراگراف متن چندین بار در روز به روز می کند. (همچنین با هر یک از این به روز رسانی ها یک اعلان دریافت خواهید کرد). مربی به شما می‌گوید که چقدر خوب خوابیده‌اید، به شما برای یک تمرین سخت تبریک می‌گوید، یا با توجه به اینکه چقدر بهبود یافته‌اید، تمرین‌هایی را برای آن روز پیشنهاد می‌کند. اما، همانطور که در بررسی Fitbit Air نوشتم، مربی اغلب دچار توهم می شود، داده های تمرینی شما را اشتباه گزارش می کند یا آنچه را که به آن گفته اید اهداف خود را درک نمی کند. یکی از کاربران که پس از جراحی به روال عادی خود بازگشته بود، در Reddit پست کرد که مربی سعی می کند آنها را از انجام تمرینات منصرف کند. اسمش را گذاشتند مربی"}, {"source": "Lifehacker", "title": "I Tried the At-Home Flu Vaccine, and It Was Great", "link": "https://lifehacker.com/health/how-to-order-flu-mist-at-home-flu-vaccine?utm_medium=RSS", "summary": "If I ever skip my flu shot, or fail to get one for my kids, it's because I didn't find time to get to the pharmacy during flu shot season. But that changed with FluMist at Home, a mail order flu vaccine (covered by insurance!) that I've used two years running. The vaccine comes in the form of a nasal spray, so you don't have to inject anything. The at-home version of the vaccine was approved in 2024 , and became available for the first time in 2025. I used it then, and the process was so painless I did it again this year. I placed an order online, and one day a refrigerated box of vaccines showed up at my doorstep, one for each member of the family. We administered them in minutes, and could check \"get flu shot\" off our to-do lists. How to get the at-home flu vaccine The nasal spray vaccine, called FluMist , still needs to be prescribed by a medical provider. But since nearly everyone aged 2 through 49 is eligible, FluMist s maker (AstraZeneca) has a created a telehealth website that bundles the provider's approval with an order to an online pharmacy. The process takes about five minutes on average, the company says, and I found that to be accurate. The first time I ordered, last year, I had already gotten a flu shot, so I ordered just for my kids. The website allowed me to add multiple people to the same order, so I filled out the questionnaire for each child, giving their names, ages, allergies, and so on. The website then reached into some big data cloud out there and told me it already knew their insurance information (existentially frightening, yet convenient!) and presented me with my bill: an $8.99 fee, which included $2.50 for physician evaluation and $6.49 for shipping and processing. Insurance covers the cost of the vaccine itself. This year was similar, except that I ordered the vaccine for five people in total, one of whom had a different insurance plan than the rest. It took some extra time to manually enter that person's info, but otherwise the process was the same. The $8.99 fee only covers up to four vaccines, so in total I had to pay $17.98 for all five. Who can use the at-home flu vaccine? The at-home vaccine is the same as regular FluMist, which is approved for ages 2 through 49. That means babies and older adults will still need to visit a provider for the regular, injectable flu vaccine. Children can get flu shots starting at the age of six months. FluMist uses a live, weakened virus. It can't give you the actual flu, but it can cause ", "date_str": "2026-10-09T17:30:00+00:00", "hash": "7f96b3cedf6bff45", "title_fa": "من واکسن آنفولانزای خانگی را امتحان کردم و عالی بود", "summary_fa": "اگر من هرگز واکسن آنفولانزای خود را رها کردم، یا نتوانستم برای فرزندانم واکسن بزنم، به این دلیل است که در فصل واکسن آنفولانزا، زمانی را برای رفتن به داروخانه پیدا نکردم. اما این با FluMist at Home تغییر کرد، یک واکسن آنفولانزای پستی (که تحت پوشش بیمه است!) که من دو سال متوالی از آن استفاده کردم. این واکسن به شکل اسپری بینی است، بنابراین نیازی به تزریق چیزی ندارید. نسخه خانگی این واکسن در سال 2024 تایید شد و برای اولین بار در سال 2025 در دسترس قرار گرفت. من آن زمان از آن استفاده کردم و این روند آنقدر بدون درد بود که امسال دوباره آن را انجام دادم. من سفارش آنلاین دادم و یک روز یک جعبه واکسن یخچالی در آستان من ظاهر شد، یکی برای هر یک از اعضای خانواده. ما آنها را در عرض چند دقیقه تجویز کردیم و می‌توانستیم \"واکسن آنفولانزا\" را در لیست کارهایمان بررسی کنیم. نحوه دریافت واکسن آنفولانزا در خانه واکسن اسپری بینی، به نام FluMist، هنوز باید توسط یک ارائه دهنده پزشکی تجویز شود. اما از آنجایی که تقریباً همه افراد 2 تا 49 ساله واجد شرایط هستند، سازنده FluMist (AstraZeneca) یک وب‌سایت سلامت از راه دور ایجاد کرده است که تأیید ارائه‌دهنده را با سفارش به یک داروخانه آنلاین همراه می‌کند. شرکت می‌گوید این فرآیند به طور متوسط ​​حدود پنج دقیقه طول می‌کشد، و من متوجه شدم که دقیق است. اولین باری که سفارش دادم، سال گذشته، قبلا واکسن آنفولانزا زده بودم، بنابراین فقط برای بچه هایم سفارش دادم. این وب‌سایت به من اجازه داد تا چندین نفر را به یک سفارش اضافه کنم، بنابراین پرسشنامه مربوط به هر کودک را پر کردم و نام، سن، آلرژی‌ها و غیره را در آن وارد کردم. سپس وب‌سایت به یک ابر داده بزرگ دسترسی پیدا کرد و به من گفت"}, {"source": "Lifehacker", "title": "I Tested Google’s New AI Image Detector, and It’s Difficult (but Not Impossible) to Trick", "link": "https://lifehacker.com/tech/i-tested-googles-new-ai-image-detector-and-its-difficult-but-not-impossible?utm_medium=RSS", "summary": "An abundance of AI imagery is something we all have to live with these days from school posters to restaurant menus and while there are still certain tells that indicate something was made with AI , they're not always present. In a lot of cases, it can be almost impossible to distinguish an AI image from a real one. This is a problem for all kinds of reasons, and, as such, the AI companies are attempting to address it. Images produced by Gemini and ChatGPT come with an invisible watermark called SynthID . That way, AI-generated images don't need visible branding in order to identify their origins. Of course, you need access to a detector to know whether this watermark is present. As it happens, Google just launched a standalone SynthID checker tool on the web, free for anyone to use. I gave \"SynthID Detector\" a shot, and while it largely works as expected, it isn't perfect. How Google's SynthID Detector works SynthID doesn't promise to always detect AI. Credit: Lifehacker For a while now, Gemini has let you upload an image and ask if it is AI-generated. With the new online portal, it's even easier to check though you do still need to sign in with your Google account. Once in, you can check a wide variety of files. This checker supports JPG, JPEG, PNG, BMP, WEBP, AVIF, HEIC, HEIF, TIFF, TIF, and GIF image formats; MP4, MOV, and WEBM for videos, and WAV, MP3, OGG, FLAC, AAC, and M4A for audio. As long as a file was made by a SynthID-supporting AI, it should have a watermark. (The SynthID watermark is a standard supported by Nvidia, OpenAI, Kakao, and Google, though OpenAI has its own detection tool .) Google doesn't say exactly how SynthID works, presumably to make it more difficult to get around, but does confirm the watermark is \"robust against common transformations.\" It also says the watermark is \"woven into the content itself\", which means pixels for images and video, and frequency components for audio. The company also admits its detection tool isn't infallible. What it calls \"heavy modifications\" can degrade the watermark sign, as can multiple \"transformations\" applied to the same image. The recommendation is to use files that are as high quality as possible, so it seems to me that more data makes detection more reliable (similar to AI text detectors). Google also says the SynthID watermarks are \"imperceptible\" to humans, so you don't need to look or listen out for them they're only revealed by an AI detector tool like this. If you're generating image", "date_str": "2026-10-09T17:00:00+00:00", "hash": "b181dc7dd825a06d", "title_fa": "من آشکارساز تصویر هوش مصنوعی جدید گوگل را آزمایش کردم و فریب دادن آن دشوار (اما غیرممکن است)", "summary_fa": "انبوهی از تصاویر هوش مصنوعی چیزی است که همه ما این روزها مجبوریم با آن زندگی کنیم، از پوسترهای مدرسه گرفته تا منوی رستوران ها، و در حالی که هنوز نکات خاصی وجود دارد که نشان می دهد چیزی با هوش مصنوعی ساخته شده است، اما همیشه وجود ندارند. در بسیاری از موارد، تشخیص تصویر هوش مصنوعی از یک تصویر واقعی تقریباً غیرممکن است. این یک مشکل به دلایل مختلف است و به همین دلیل، شرکت‌های هوش مصنوعی در تلاش برای رفع آن هستند. تصاویر تولید شده توسط Gemini و ChatGPT با یک واترمارک نامرئی به نام SynthID همراه هستند. به این ترتیب، تصاویر تولید شده توسط هوش مصنوعی برای شناسایی منشاء خود نیازی به برند قابل مشاهده ندارند. البته برای اینکه بدانید این واترمارک وجود دارد یا خیر، باید به یک آشکارساز دسترسی داشته باشید. همانطور که اتفاق می افتد، گوگل به تازگی یک ابزار بررسی کننده SynthID مستقل را در وب راه اندازی کرده است که استفاده از آن برای همه رایگان است. من از \"SynthID Detector\" عکس گرفتم، و در حالی که تا حد زیادی همانطور که انتظار می رفت کار می کند، بی نقص نیست. چگونه آشکارساز SynthID گوگل کار می کند SynthID قول نمی دهد همیشه هوش مصنوعی را تشخیص دهد. اعتبار: Lifehacker مدتی است که Gemini به شما اجازه می‌دهد تصویری را آپلود کنید و بپرسید که آیا این تصویر توسط هوش مصنوعی تولید شده است یا خیر. با پورتال آنلاین جدید، بررسی آن آسان تر است، اگرچه هنوز باید با حساب Google خود وارد شوید. پس از ورود، می توانید طیف گسترده ای از فایل ها را بررسی کنید. این جستجوگر از فرمت های تصویری JPG، JPEG، PNG، BMP، WEBP، AVIF، HEIC، HEIF، TIFF، TIF و GIF پشتیبانی می کند. MP4، MOV، و WEBM برای ویدیوها، و WAV، MP3، OGG، FLAC، AAC و"}, {"source": "Lifehacker", "title": "10 Shows Like 'Monster: The Lizzie Borden Story' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-monster-lizzie-borden?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The Ian Brennan/Ryan Murphy true crime anthology series Monster is back with its first trip into the more distant past, taking us back to 1892 to examine one of the most famous and discussed murderers in American history: Lizzie Borden, a woman said to have killed her father and stepmother with an axe. Borden was never convicted; controversy and conspiracy theories linger; and though it happened more than a century ago, the crime was recent enough that we can pore over police files and crime-scene photos and argue over the facts, which makes for thrilling dramatic television. After all, while a story about an evil killer is one thing, one following an ambiguous, possibly sympathetic killer? That's the stuff of truly juicy true crime. If you're looking for more in the same violent vein, here are 10 shows to stream next. Candy (2022) The real-life Candy Montgomery has been portrayed multiple times by Barbara Hershey in a 1990 CBS movie, by Jessica Biel in this Hulu miniseries, and, more recently, by Elizabeth Olsen in HBO Max's Love Death . Like Lizzie Borden, Candy is a woman killer (maybe?) who we can't seem to get enough of. Jessica Biel is so good here, though, that this one earns extra points. In an impeccably reproduced 1980, Candy was accused of murdering her neighbor, Betty Gore (Melanie Lynskey), following the woman's affair with Candy's husband, Allan (Pablo Schreiber). And with an axe, no less. Was it cold-blooded murder, or self-defense? Stream Candy on Hulu . Candy (2022) at Hulu Learn More Learn More at Hulu The Lizzie Borden Chronicles (2015) This TV movie could be described as speculative it plays a bit like high-end Lizzie Borden fan fiction (or perhaps a fever dream), with a phenomenal cast led by Christina Ricci. Set after Lizzie Borden's acquittal for crimes that, the movie makes clear, she absolutely did commit, we find Lizzie and Emma (Clea DuVall) trying to get on with their lives, even as a Pinkerton agent (Cole Hauser) dogs their every move. A trip to New York City finds Lizzie in a love triangle involving a playwright and a sex worker, a woman whose pimp tries to extort our young murderer. That turns out to be every bit as bad an idea as you might expect. Stream The Lizzie Borden Chronicles on Prime Video . The Lizzie Borden Chronicles (2015) at Prime Video Learn More Learn More at Prime Video The Staircase (2022) Inspired by a documentary of the same name, The Staircase sidesteps tr", "date_str": "2026-10-09T16:30:00+00:00", "hash": "5c4a78502fd370cc", "title_fa": "10 نمایش مانند «هیولا: داستان لیزی بوردن» که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. سریال گلچین جنایی واقعی یان برنان/رایان مورفی Monster با اولین سفر خود به گذشته های دورتر بازگشته است، و ما را به سال 1892 می برد تا یکی از مشهورترین و مورد بحث ترین قاتلان تاریخ آمریکا را بررسی کنیم: لیزی بوردن، زنی که گفته می شود پدر و نامادری خود را با تبر کشته است. بوردن هرگز محکوم نشد. بحث و جدل و تئوری های توطئه ادامه دارد. و اگرچه بیش از یک قرن پیش اتفاق افتاد، این جنایت به اندازه‌ای جدید بود که می‌توانیم پرونده‌های پلیس و عکس‌های صحنه جرم را بررسی کنیم و بر سر حقایق بحث کنیم، که تلویزیون دراماتیک هیجان‌انگیزی را ایجاد می‌کند. به هر حال، در حالی که داستان در مورد یک قاتل شیطانی یک چیز است، یکی دنبال یک قاتل مبهم و احتمالاً دلسوز است؟ این همان جنایات واقعی است. اگر به دنبال چیزهای بیشتری در همان مسیر خشونت آمیز هستید، در اینجا 10 نمایش برای پخش در ادامه آورده شده است. Candy (2022) Candy Montgomery در زندگی واقعی چندین بار توسط باربارا هرشی در یک فیلم CBS محصول 1990، توسط جسیکا بیل در این مینی سریال Hulu، و اخیراً توسط الیزابت اولسن در HBO Max's Love Death به تصویر کشیده شده است. مانند لیزی بوردن، کندی یک قاتل زن است (شاید؟) که به نظر نمی رسد از او سیر شویم. جسیکا بیل در اینجا آنقدر خوب است که این یکی امتیاز بیشتری کسب می کند. در یک بازتولید بی عیب و نقص در سال 1980، کندی متهم به قتل همسایه خود، بتی گور (ملانی لینسکی) در پی رابطه زناشویی زن با همسر کندی، آلن (پابلو شرایبر) شد. و با تبر، نه کمتر. آیا این قتل خونسرد بود یا دفاع از خود؟ آب نبات را در Hulu پخش کنید. Candy (2022) در"}, {"source": "Lifehacker", "title": "You Can Use Your iPhone As an ID in These 16 States", "link": "https://lifehacker.com/you-can-use-your-iphone-as-an-id-in-these-states?utm_medium=RSS", "summary": "Since iOS 15.4 , Apple has allowed you to add a driver s license or other state ID to your iPhone s digital wallet. That was a while ago, seeing as we just got iOS 27 (or what would've been iOS 20, had Apple not changed how it names the updates ) last month. But that doesn t mean you ve been needlessly carrying your ID around since then some participating states have been slow to roll out support for the feature, and most have yet to sign on at all. When I first covered this feature in 2022, only two states actively allowed you to add your ID to your iPhone , while 10 more (plus Puerto Rico) had confirmed plans to offer the option eventually, on a loose timeline of soon. Fast forward four years, and just 16 states and one territory now officially allow you to add IDs to Wallet. These states support digital ID now Here s the full list as it stands in October 2026: Arizona Arkansas California Colorado Georgia Hawaii Illinois Iowa Maryland Montana New Mexico North Dakota Ohio Oklahoma Puerto Rico Virginia West Virginia In addition, the U.S. supports adding your password to the Wallet app as a digital ID. Support is still \"coming soon\" in these states These states had originally pledged that support was \"coming soon,\" but after four years, still haven't committed: Connecticut Kentucky Mississippi Utah States that will not support digital ID I am not surprised that some states are delaying support for digital IDs, but up until recently, none had rejected the features outright. That changed this week, as reported by 9to5Mac , as officials from both Florida and Rhode Island independently rejected digital IDs for their states. Governor Ron DeSantis of Florida posted his dismissal on X: This Tweet is currently unavailable. It might be loading or has been removed. Meanwhile, Walter Craddock, Chair of the American Association of Motor Vehicle Administrators (AAMVA) International Board of Directors, said the following on a podcast: I want to see more universal adoption or need for an MDL [mobile drivers license]. I had one of my senators approach and try to talk me into doing it. I had to give him the old Heisman move and push him back the main user right now is TSA. Up until recently, there was no airport in New England area that could accept an MDL. So why would I spend the money in the development of it? And also, I m looking to do a solution that is across all platforms. Instead of just doing one for Apple or the Google Wallets, I don t want to replicate and dupli", "date_str": "2026-10-09T16:00:00+00:00", "hash": "09c6a77edd26947a", "title_fa": "در این 16 ایالت می توانید از آیفون خود به عنوان شناسه استفاده کنید", "summary_fa": "از زمان iOS 15.4، اپل به شما این امکان را داده است که گواهینامه رانندگی یا سایر شناسه های دولتی را به کیف پول دیجیتال آیفون خود اضافه کنید. این مدتی پیش بود، وقتی دیدیم که ما به تازگی iOS 27 را دریافت کرده‌ایم (یا اگر اپل نحوه نام‌گذاری به‌روزرسانی‌ها را تغییر نمی‌داد، چه چیزی می‌شد iOS 20 بود). اما این بدان معنا نیست که از آن زمان به بعد بی جهت شناسه خود را حمل کرده اید، برخی از ایالت های شرکت کننده در ارائه پشتیبانی از این ویژگی کند بوده اند و اکثر آنها هنوز اصلاً وارد سیستم نشده اند. زمانی که من برای اولین بار این ویژگی را در سال 2022 پوشش دادم، فقط دو ایالت به طور فعال به شما اجازه دادند شناسه خود را به آیفون خود اضافه کنید، در حالی که 10 ایالت دیگر (به علاوه پورتوریکو) برنامه‌های خود را برای ارائه این گزینه در یک جدول زمانی محدود به زودی تأیید کرده بودند. چهار سال به جلو، و فقط 16 ایالت و یک قلمرو اکنون به طور رسمی به شما امکان می دهند شناسه ها را به کیف پول اضافه کنید. این ایالت‌ها اکنون از شناسه دیجیتال پشتیبانی می‌کنند در اینجا لیست کاملی که در اکتبر 2026 وجود دارد آمده است: آریزونا آرکانزاس کالیفرنیا کلرادو جورجیا هاوایی ایلینوی آیووا مریلند مونتانا نیومکزیکو داکوتای شمالی اوهایو اوکلاهما پورتوریکو ویرجینیا ویرجینیای غربی علاوه بر این، ایالات متحده از افزودن رمز عبور شما به برنامه کیف پول به‌عنوان شناسه دیجیتال پشتیبانی می‌کند. پشتیبانی هنوز در این ایالت ها \"به زودی\" است این ایالت ها در ابتدا متعهد شده بودند که پشتیبانی \"به زودی ارائه می شود\"، اما پس از چهار سال، هنوز متعهد نشده اند: ایالت کنتیکت کنتاکی می سی سی پی یوتا که از شناسه دیجیتال پشتیبانی نمی کند تعجب نمی کنم که برخی از"}],
      media: [{"source": "Billboard", "title": "‘Saturday Night Live U.K.’: Here’s Where to Watch Season 2 Online for Free", "link": "https://www.billboard.com/culture/product-recommendations/saturday-night-live-uk-season-2-watch-stream-online-free-1236338739/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Live from London, it s Saturday Night! Saturday Night Live U.K. season one was a big hit in the United Kingdom and United States, alike, when it first aired in late 2025. And now, for this weekend, the sketch comedy show features with actor Danny Dyer to host, while singer-songwriter Sasha Keable is booked to perform as musical guest . Although SNL U.K. season two broadcasts live on Saturday (Oct. 10) at 10 p.m. BST on British broadcaster Sky UK, it drops in the U.S. on the following day on Sunday (Oct. 11) at 9 p.m. ET/6 p.m. PT on Peacock . Peacock Get Peacock Want to watch SNL U.K. online for nearly free? Your easiest bet is a clever workaround to sign up with seven-day free trial via Prime Video on Amazon . The streaming service is available as a channel add-on, as it s the only way to get a free trial to Peacock Premium Plus on the internet. After the free trial is over, the price auto-renews to $19.99 per month for the no-ads plan, but you can cancel anymore with your Prime membership. Not a member? Sign up for a 30-day free trial to take advantage of all that Amazon Prime has to offer, including access to Prime Video, Prime Gaming and Amazon Photos; fast free shipping in less than two days with Prime Delivery; in-store discounts at Whole Foods Market and access to exclusive shopping savings during Black Friday in November, as well as other perks. Learn more about Amazon Prime and its benefits here . Alternatively, you can subscribe to Peacock directly, which is the official NBCUniversal streamer, starting at $12.99 per month. Peacock gives you access to NBC, Bravo, USA Network, CNBC, NBC Sports and Peacock Originals, like SNL U.K . Get Peacock In addition, if you d like to watch SNL U.K. live, which airs at 5 p.m. ET/2 p.m. PT in the U.S., you can livestream the sketch comedy show if you re a Sky Stream subscriber and paired with ExpressVPN in the U.S. The virtual private network starts at just $2.99 per month with an annual plan. There s even a 30-day money back guarantee for first time subscribers too. Learn more about ExpressVPN here . Meanwhile, Danny Dyer stars in the hit period drama/comedy Rivals and the second half of season two returns in November. It s streamable on Disney+ and Hulu . As for Sasha Keable, th", "date_str": "2026-10-10T12:45:12+00:00", "hash": "e1ad811686610227", "title_fa": "«Saturday Night Live U.K.»: اینجا جایی است که فصل 2 را به صورت آنلاین و رایگان تماشا کنیم", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. پخش زنده از لندن، شنبه شب است! سریال Saturday Night Live U.K فصل یک موفقیت بزرگی در بریتانیا و ایالات متحده بود، زمانی که برای اولین بار در اواخر سال 2025 پخش شد. و حالا، برای این آخر هفته، این برنامه کمدی با اجرای بازیگر دنی دایر برگزار می‌شود، در حالی که ساشا کیبل، خواننده و ترانه‌سرا، به عنوان مهمان موسیقی برنامه را اجرا خواهد کرد. به بیلبورد سر بزنید و جدیدترین ویدیوها، نمودارها و اخبار را ببینید. اگرچه فصل دوم SNL UK به صورت زنده در روز شنبه (10 اکتبر) ساعت 10 شب به وقت BST از شبکه بریتانیایی Sky UK پخش می‌شود، اما در ایالات متحده روز بعد، یکشنبه (11 اکتبر) ساعت 9 شب به وقت ET/6 بعد از ظهر به وقت PT از شبکه Peacock پخش خواهد شد. مربوط به John Mayer Live at Sphere 2027: در اینجا می‌توانید بلیط‌های مقرون‌به‌صرفه آنلاین خرید کنید. ساده ترین شرط شما یک راه حل هوشمندانه برای ثبت نام با استفاده آزمایشی رایگان هفت روزه از طریق Prime Video در آمازون است. سرویس پخش جریانی به عنوان یک افزونه کانال در دسترس است، زیرا تنها راه برای دریافت نسخه آزمایشی رایگان Peacock Premium Plus در اینترنت است. پس از پایان دوره آزمایشی رایگان، قیمت به طور خودکار به 19.99 دلار در ماه برای طرح بدون تبلیغات تمدید می شود، اما دیگر می توانید با عضویت Prime خود لغو کنید. علاوه بر این، اگر دوست دارید SNL U.K را به صورت زنده تماشا کنید که ساعت 5 بعد از ظهر پخش می شود. ET/2 بعد از"}, {"source": "Billboard", "title": "Ashnikko Covers Gwen Stefani’s ‘What You Waiting For?’ for Like A Version", "link": "https://www.billboard.com/music/music-news/ashnikko-gwen-stefani-what-you-waiting-for-like-a-version-1236358578/", "summary": "Ashnikko has made her Like A Version debut on triple j, taking on Gwen Stefani ’s 2004 solo hit “What You Waiting For?” Performing in the triple j studio while on her Australian tour, Ashnikko brought a full backing band — including a harpist — for a theatrical, electropop-leaning take that stayed largely faithful to Stefani’s original while adding her own flair. For her own song, she performed “Sticky Fingers.” The cover was a personal choice. Ashnikko described “What You Waiting For?” as “the song of my childhood” and the track that inspired her to pursue music, crediting Stefani’s debut solo album Love. Angel. Music. Baby. as a formative influence on her own artistry. In the accompanying interview with hosts Abby Butler and Tyrone Pynor, she also chatted about bird watching and the importance of choreography to her performances. “What You Waiting For?” was the lead single from Stefani’s 2004 debut solo album and reached No. 47 on the Billboard Hot 100 , while Love. Angel. Music. Baby. peaked at No. 7 on the Billboard 200 , spawning the hits “Hollaback Girl” — Stefani’s first Hot 100 No. 1 — and “Rich Girl.” Stefani is also a four-time Grammy winner and the longtime frontwoman of No Doubt . American artist Ashnikko broke through in 2019 with “Stupid,” a viral TikTok hit that reached No. 90 on the Billboard Hot 100 and has been certified platinum. Her 2023 debut album Weedkiller reached the Billboard 200, and she has built a devoted following with her genre-blurring blend of hyperpop, rap and alternative. The Like A Version appearance adds to a long line of memorable covers from the triple j segment, which has become an Australian institution.", "date_str": "2026-10-10T08:25:05+00:00", "hash": "47f4d10cc8b64da5", "title_fa": "Ashnikko پوشش گوئن استفانی \"What You Waiting For؟\" را برای Like A Version می کند.", "summary_fa": "اشنیکو اولین بازی خود را با عنوان Like A Version در تریپل جی انجام داد و در سال 2004 با آهنگ انفرادی گوئن استفانی \"What You Waiting For\" روبرو شد. اشنیکو هنگام اجرای تور استرالیایی خود در استودیو تریپل جی، گروهی از جمله یک نوازنده تار را به همراه داشت تا نمایشی تئاتری و متمایل به الکتروپاپ داشته باشد که تا حد زیادی به اصل استفانی وفادار ماند و در عین حال استعداد خود را اضافه کرد. او برای آهنگ خودش «انگشتان چسبنده» را اجرا کرد. پوشش یک انتخاب شخصی بود. اشنیکو توضیح داد: «منتظر چه هستی؟» به‌عنوان «آهنگ کودکی‌ام» و آهنگی که الهام‌بخش او برای دنبال کردن موسیقی بود و اولین آلبوم انفرادی استفانی به نام Love را به آن اختصاص داد. فرشته موسیقی. عزیزم به عنوان تأثیری سازنده بر هنر خودش. در مصاحبه همراه با مجریان برنامه ابی باتلر و تایرون پینور، او همچنین در مورد تماشای پرنده و اهمیت طراحی رقص برای اجراهایش صحبت کرد. \"منتظر چی هستی؟\" تک آهنگ اصلی اولین آلبوم انفرادی استفانی در سال 2004 بود و به شماره شماره 2 رسید. 47 در بیلبورد داغ 100، در حالی که عشق. فرشته موسیقی. عزیزم در بیلبورد 200 به رتبه 7 رسید و موفق شد «دختر هول‌باز» - اولین فیلم داغ 100 استفانی - و «دختر پولدار» را به‌وجود آورد. استفانی همچنین چهار بار برنده گرمی و خواننده قدیمی No Doubt است. هنرمند آمریکایی اشنیکو در سال 2019 با «Stupid»، یک موفقیت ویروسی TikTok که به رتبه 90 در Billboard Hot 100 رسید و گواهی پلاتین دریافت کرد، به موفقیت دست یافت. اولین آلبوم او در سال 2023 به نام Weedkiller به بیلبورد 200 رسید و او با ترکیبی از هایپرپاپ، رپ و آلترناتیو که ژانر محو کننده‌اش است، طرفدارانی را به خود اختصاص داده است. ظاهر Like A Version به مجموعه ای طولانی از"}, {"source": "Billboard", "title": "Lance Bass Says He Earned Just $35 a Day at the Height of *NSYNC’s Fame", "link": "https://www.billboard.com/music/music-news/lance-bass-nsync-fame-1236358572/", "summary": "Lance Bass has detailed just how little he says he earned during *NSYNC ’s rise, claiming he was paid a per diem of $35 a day while the group was one of the biggest acts in the world. Speaking on The Zach Sang Show , the 47-year-old singer said the money didn’t match the band’s success. “We had a per diem: $35 a day,” Bass said. “Our first check was a $10,000 check after years of No. 1 albums, sellout tours. I don’t know how many millions I made off of merchandise, because merchandise was insane.” He recalled being told to be grateful for the $10,000: “You should be grateful for that. You’ve been working for free for two, three years now.” Bass — who rose to fame alongside Justin Timberlake , JC Chasez , Chris Kirkpatrick and Joey Fatone — pushed back on the perception that the group made him wealthy. “People think I’m so filthy rich from *NSYNC, but no,” he said. “Not at all. I didn’t make money with *NSYNC, like, hardly at all.” He said he still receives residuals, but “it’s not much,” and that he earned far more after the band went on hiatus in 2002. He alleged that the bulk of the money went elsewhere, claiming “the label” and the group’s late manager, Lou Pearlman, “made a f–k ton.” Pearlman, the impresario behind *NSYNC and the Backstreet Boys , was convicted in 2008 of money laundering, conspiracy and bankruptcy fraud in connection with a long-running Ponzi scheme; he died in prison in 2016. Asked whether he still carried resentment, Bass said “not anymore,” though he maintained he had been shortchanged. “No one set us up for life after that,” he said. The claims stand in stark contrast to *NSYNC’s commercial record. The group remains one of the best-selling acts in Billboard history: their 2000 album No Strings Attached sold a then-record 2.4 million copies in its first week — a mark that stood for 15 years — and spent eight weeks at No. 1 on the Billboard 200 . Its lead single “Bye Bye Bye” became a signature hit, and the follow-up “It’s Gonna Be Me” gave the group its only Billboard Hot 100 No. 1 that summer. Their 2001 album Celebrity also debuted at No. 1, while the No Strings Attached tour grossed more than $70 million. *NSYNC reunited briefly for a new single, “Better Place,” in 2023. It isn’t the first time Bass has spoken about the band’s finances. “We were famous, but we were not rich,” he said during a 2023 appearance on SiriusXM’s The Jess Cagle Show .", "date_str": "2026-10-10T08:09:09+00:00", "hash": "aae3e67a4c8adbbe", "title_fa": "لنس باس می گوید در اوج شهرت *NSYNC روزانه فقط 35 دلار درآمد داشت", "summary_fa": "لنس باس توضیح داد که چقدر در طول ظهور *NSYNC درآمد کمی داشته است و ادعا می کند که در حالی که این گروه یکی از بزرگترین بازیگران جهان بود، روزانه 35 دلار حقوق دریافت می کرد. این خواننده 47 ساله که در برنامه The Zach Sang Show صحبت می کرد، گفت که این پول با موفقیت گروه مطابقت ندارد. باس گفت: \"ما روزی 35 دلار در روز داشتیم.\" اولین چک ما یک چک 10000 دلاری پس از سالها آلبوم شماره 1 بود، تورهای فروش رفته. نمی‌دانم چند میلیون دلار از کالا به دست آوردم، زیرا کالاها دیوانه‌کننده بودند.» او به یاد می آورد که به او گفته شده برای 10000 دلار سپاسگزار باشید: «شما باید برای آن سپاسگزار باشید. الان دو، سه سال است که مجانی کار می‌کنی.» باس - که در کنار جاستین تیمبرلیک، جی سی چیزز، کریس کرک پاتریک و جوی فاتون به شهرت رسید - این تصور را که گروه او را ثروتمند کرده است، کنار زد. او گفت: «مردم فکر می‌کنند من از *NSYNC خیلی پولدار هستم، اما نه. «به هیچ وجه. من به ندرت با *NSYNC پول درآوردم.\" او گفت که هنوز باقیمانده‌ها را دریافت می‌کند، اما «خیلی زیاد نیست» و پس از وقفه گروه در سال 2002، درآمد بسیار بیشتری کسب کرده است. او مدعی شد که بخش عمده‌ای از پول به جای دیگری رفته و ادعا می‌کند که «برچسب» و مدیر فقید گروه، لو پرلمن، «یک تن تولید کرده است». پرلمن، امپرساریو پشت *NSYNC و Backstreet Boys، در سال 2008 به جرم پولشویی، توطئه و کلاهبرداری ورشکستگی در ارتباط با یک طرح طولانی مدت پونزی محکوم شد. او در سال 2016 در زندان درگذشت. باس در پاسخ به این سوال که آیا هنوز هم خشمگین است یا خیر، گفت: \"دیگر نه\"، اگرچه او معتقد بود که او دچار کوتاهی شده است. او"}, {"source": "Billboard", "title": "Phil Wickham, Josiah Queen, Brandon Lake, Tasha Cobbs Leonard Top GMA Dove Awards Winners", "link": "https://www.billboard.com/music/awards/phil-wickham-josiah-queen-gma-dove-awards-winners-1236358562/", "summary": "On Friday night (Oct. 9), the 57th annual GMA Dove Awards aired on TBN and TBN+, as those in the Christian and Gospel music community gathered to honor some of the year’s top artists, songs, albums and more. Hosted for the fourth consecutive year by singer-songwriter Tauren Wells, the event was held on Oct. 6 at Nashville’s Bridgestone Arena. Among the top winners were Phil Wickham , Josiah Queen and Brandon Lake , with three wins each, while Tasha Cobbs Leonard took home two honors. Wickham was named artist of the year, while his album Song of the Saints was named worship album of the year and he won children’s recorded song of the year for his work on “Follow The Light.” “God has given us reason after reason to worship him,” Wickham said in accepting the worship album of the year honor, adding, “To be able to write songs with amazing people and to think that people sing them to Jesus blows my mind. That I get to write a song to Jesus and I have the honor of filling the mouths of believers with these songs…I don’t take one moment for granted. He is so worthy.” Queen earned accolades in categories including song of the year and pop/contemporary recorded song of the year (both for “Dusty Bibles”) and recorded music packaging of the year (for his album Mt. Zion ). Taking the stage to accept the song of the year honor for “Dusty Bibles,” Queen thanked his co-writers on the song, John Michael Howell, Zac Lawson, and Dylan Thomas. “We wrote this song two Dove Awards ago, so it’s an honor to be here,” Queen said. “I grew up following the Dove Awards because I looked up to so many of you writers and musicians. In saying that and getting this, it’s a huge honor. The greatest honor I can have as a human is to serve Jesus.” He added that faith helped him through hard times, saying, “It was opening up my Bible and spending time with Him that he completely changed my life.” Lake earned accolades including songwriter of the year (artist), pop/contemporary album of the year ( King of Hearts ), and country/roots recorded song of the year, for “The Jesus I Know Now,” with Lainey Wilson. Taking the stage to accept the win for The Jesus I Know Now, Wilson said, “There’s a line in the song that says, ‘He says who I am and it ain’t what I do.’ I want to remind all the creators, we are not just singers. We’re not just songwriters, we are connectors.” Lake added, “I’m so thankful for you Lainey, and [co-writers] Emily [Weisband] and Luke [Laird] that we wrote the song with .I’m", "date_str": "2026-10-10T04:27:34+00:00", "hash": "3223d85c4b892525", "title_fa": "فیل ویکهام، جوزیا کوئین، براندون لیک، تاشا کابز لئونارد برندگان برتر جوایز GMA Dove", "summary_fa": "جمعه شب (9 اکتبر)، پنجاه و هفتمین دوره جوایز سالانه GMA Dove در TBN و TBN+ پخش شد، زیرا اعضای جامعه موسیقی مسیحی و انجیل گرد هم آمدند تا از برخی از هنرمندان، آهنگ‌ها، آلبوم‌ها و موارد دیگر تقدیر کنند. این رویداد برای چهارمین سال متوالی توسط Tauren Wells خواننده و ترانه سرا میزبانی شد، این رویداد در 6 اکتبر در Bridgestone Arena در نشویل برگزار شد. در میان برندگان برتر فیل ویکهام، جوزیا کوئین و براندون لیک، هر کدام با سه برد بودند، در حالی که تاشا کابز لئونارد دو افتخار را به خانه برد. ویکهام به عنوان هنرمند سال انتخاب شد، در حالی که آلبوم او Song of the Saints به عنوان آلبوم عبادی سال انتخاب شد و او برای کارش در \"Follow The Light\" برنده آهنگ سال ضبط شده کودکان شد. ویکهام در پذیرفتن افتخار آلبوم پرستش سال گفت: «خدا به ما دلیل پس از عقل داده است تا او را بپرستیم. اینکه می‌توانم برای عیسی آهنگ بنویسم و ​​این افتخار را دارم که دهان مؤمنان را با این آهنگ‌ها پر کنم... یک لحظه را هم بدیهی نمی‌دانم. او بسیار شایسته است.» کوئین در دسته بندی هایی از جمله آهنگ سال و آهنگ ضبط شده پاپ/معاصر سال (هر دو برای \"Dusty Bibles\") و بسته بندی موسیقی سال ضبط شده (برای آلبوم Mt. Zion) تحسین برانگیز به دست آورد. کوئین با حضور در صحنه برای پذیرفتن جایزه بهترین آهنگ سال برای «انجیل های گرد و خاکی»، از نویسندگان همکار خود در این آهنگ، جان مایکل هاول، زک لاوسون و دیلن توماس تشکر کرد. کوئین گفت: «ما این آهنگ را دو جایزه Dove پیش نوشتیم، بنابراین حضور در اینجا باعث افتخار است. \"من به دنبال جوایز Dove بزرگ شدم زیرا به بسیاری از شما نویسندگان و نوازندگان نگاه کردم. گفتن این جمله و گرفتن این افتخار بزرگی است. بزرگترین"}, {"source": "Billboard", "title": "ADÉLA Makes Her Case For Pop Stardom at Sold-Out Los Angeles Show: ‘I’m an Immigrant’", "link": "https://www.billboard.com/music/concerts/adela-sold-out-los-angeles-concert-the-fonda-theatre-review-1236358527/", "summary": "ADÉLA had a few things to get off of her chest in Los Angeles and she did so with a little ballet, fiery hair choreography, some spicy dancing and a song that might have put her in some hot water with the local crowd. Related ADÉLA Reunites With KATSEYE Members Owns the Stage at Red Bottoms Tour Stop in LA: Exclusive Photos ADÉLA Reunites With KATSEYE Members Owns the Stage at Red Bottoms Tour Stop in LA: Exclusive Photos 10 Billboard Hot 100 Hits Named After Movie Stars, From ADÉLA s Nicole Kidman to Taylor Swift s Elizabeth Taylor The Slovak pop singer brought her Red Bottoms Tour to the Fonda Theatre on Thursday night (Oct. 8) for the first of two Los Angeles dates, delivering a 16-song set that highlighted why she s quickly becoming one of pop music s most compelling emerging names. The demand for ADÉLA in Los Angeles continues tonight (Oct. 9), when she returns to the Fonda Theatre for a second sold-out show. With her signature bright pink hair, a hot pink ballet rail and pink and red lighting setting the tone, ADÉLA leaned into the vigorous performance style that has helped distinguish her since her days on The Debut: Dream Academy , the competition series that introduced her to a wider audience. The sold-out show comes just weeks after the release of her debut album, PRIMA , which debuted at No. 4 on the Billboard 200 . Two of its singles have also made their way onto the Billboard Hot 100 : Ain t in LA, which peaked at No. 27, and Nicole Kidman, which recently climbed to No. 11. At the Fonda, she brought those chart successes to life alongside other songs in the setlist that moved between the brash confidence of KGB, Boys and NastyDirtyGross and the more provocative pop of Starving Artist, SexOnTheBeat and Superscar. A trained ballerina, ADÉLA has the flawless movement and performance instincts to make choreography feel very central to her artistry instead of just an accessory to it. Her fashion choices are just as much a part of the package, with a wardrobe of sparkling, barely-there separates and statement boots complementing her signature bright pink hair. The look also fits the visual identity of her collaboration with 5 Gum, which brought its Stimulating Style Collection to select stops on the Red Bottoms Tour. A hot pink rail served as a focal point for her ballet segment and other choreographed moments, recalling the setup from her opening dates for Demi Lovato. The production itself was relatively stripped back, relying largely on the rail ", "date_str": "2026-10-10T04:27:14+00:00", "hash": "2ceb7084481b6e8a", "title_fa": "ADÉLA برای ستاره شدن پاپ در نمایشگاه لس آنجلس به فروش رسیده است: \"من یک مهاجر هستم\"", "summary_fa": "ADÉLA در لس آنجلس چیزهایی داشت که باید از سینه‌اش بیرون بیاید و این کار را با کمی باله، رقص موهای آتشین، رقص تند و آهنگی انجام داد که ممکن بود او را با جمعیت محلی در آب داغ قرار دهد. ADÉLA دوباره با اعضای KA
