اربرانی باشند که این نرم‌افزار را اجرا می‌کنند. (اسپویل: قصدش این نبود.) همانطور که اتفاق می افتد، این شرکت به طور رسمی تاریخ راه اندازی به روز رسانی را اعلام کرد، اگرچه آن را به شدت تبلیغ نکرد. این شرکت در انتهای پست های اتاق خبر خود برای هر یک از اعلامیه های محصول جدید خود، تأیید کرد که iOS 27 در روز دوشنبه، 14 سپتامبر راه اندازی می شود. توسعه دهندگان از ژوئن نسخه بتای iOS 27 را آزمایش کردند و اپل یک ماه بعد نسخه بتای عمومی را باز کرد. از آن زمان، داوطلبان ویژگی‌های آتی اپل، از جمله هوش مصنوعی سیری، ابزارهای جدید ویرایش تصویر، و ضبط دوگانه در طول تماس‌های FaceTime را آزمایش می‌کنند."}, {"source": "Lifehacker", "title": "iPhones Are Getting More Expensive, but AirPods Are Cheaper Than Ever", "link": "https://lifehacker.com/tech/apple-pricing-iphone-18-pro-airpods-5?utm_medium=RSS", "summary": "RAMageddon is real, and it s finally come for the iPhone. Thanks to the ever-increasing costs of memory and storage , the prices of virtually all tech products are going up. A couple of months ago, Apple increased the pricing for the Mac and the iPad , by a couple of hundred dollars. Now, it s the iPhone s turn: Suddenly, all the iPhones are now $100 more expensive than they were yesterday, and the newly announced models are $100 more expensive than last year. But it s not all doom and gloom. The new AirPods are actually cheaper, and mercifully, some Apple products remain the same price. The $100 iPhone bump Credit: Khamosh Pathak At the September keynote event, Apple introduced the iPhone 18 Pro and the iPhone 18 Pro Max. The 18 Pro starts at $1,199 for 256GB storage, and the iPhone 18 Pro Max is now $1,399. Both of them are $100 more than the starting price of comparable iPhone 17 Pro/Max models. The price bump doesn't stop with the new phones: Apple has flipped a switch and bumped prices on all existing iPhone models by $100. While Apple did not introduce an iPhone 18, the price of the iPhone 17 has quietly gone up; it now starts at $899 for the 256GB model instead of $799. The older iPhone 16 model is now $799, while the \"budget\" iPhone 17e now sells for $699. Even the iPhone Air has gone up to $1099. Apple Watch pricing stays the same Surprisingly, the RAM and storage costs haven t hit the Apple Watch yet, or, at least, Apple is willing to absorb those increases for these smaller devices. The Series 12 Apple Watch with a new S11 processor and on-device Apple Intelligence features starts at the same $399 price as the Apple Watch 11. The new Apple Watch Ultra 4 also remains at the same $799 introductory price as the Ultra 3. AirPods are now cheaper (and better) than ever One popular product escaped the price bump: I was surprised to see a new standard AirPods model at the iPhone 18 Pro keynote, but the price drop was even more unexpected. The base AirPods 5 now come with built-in ANC (which used to cost extra), along with better transparency and improved sound features, and they are just $129, the cost of the outgoing AirPods 4 without ANC. Apple does have a more expensive model of AirPods 5 that comes with a wireless charging case, better battery life, and an on-stem voice control feature for $149, or $30 cheaper than the outgoing AirPods 4 with ANC model.", "date_str": "2026-09-09T19:00:00+00:00", "hash": "26e75bfa18c990e5", "title_fa": "آیفون‌ها گران‌تر می‌شوند، اما AirPods ارزان‌تر از همیشه هستند", "summary_fa": "RAMagedon واقعی است و بالاخره برای آیفون آمده است. به لطف هزینه های فزاینده حافظه و ذخیره سازی، قیمت تقریباً همه محصولات فناوری در حال افزایش است. چند ماه پیش، اپل قیمت مک و آیپد را چند صد دلار افزایش داد. حالا نوبت آیفون است: ناگهان همه آیفون‌ها ۱۰۰ دلار گران‌تر از دیروز هستند و مدل‌های جدید معرفی‌شده ۱۰۰ دلار گران‌تر از سال گذشته هستند. اما این همه عذاب و تاریکی نیست. ایرپادهای جدید در واقع ارزان‌تر هستند، و متأسفانه، برخی از محصولات اپل همان قیمت هستند. قیمت 100 دلاری آیفون اعتبار: خاموش پاتک در رویداد اصلی سپتامبر، اپل آیفون 18 پرو و ​​آیفون 18 پرو مکس را معرفی کرد. قیمت 18 پرو از 1199 دلار برای حافظه 256 گیگابایتی شروع می شود و آیفون 18 پرو مکس اکنون 1399 دلار است. هر دوی آنها 100 دلار بیشتر از قیمت اولیه مدل های مشابه آیفون 17 پرو/مکس هستند. افزایش قیمت با گوشی‌های جدید متوقف نمی‌شود: اپل سوئیچ را باز کرده و قیمت تمام مدل‌های آیفون موجود را ۱۰۰ دلار افزایش داده است. در حالی که اپل آیفون 18 را معرفی نکرد، قیمت آیفون 17 بی سر و صدا بالا رفته است. اکنون قیمت آن از 899 دلار برای مدل 256 گیگابایتی به جای 799 دلار شروع می شود. مدل قدیمی آیفون 16 اکنون 799 دلار است، در حالی که آیفون 17e \"بودجه\" اکنون با قیمت 699 دلار به فروش می رسد. حتی آیفون ایر نیز به 1099 دلار رسیده است. قیمت اپل واچ ثابت می ماند. در کمال تعجب، رم و هزینه های ذخیره سازی هنوز به اپل واچ نرسیده است، یا حداقل، اپل مایل است این افزایش ها را برای این دستگاه های کوچکتر جذب کند. اپل واچ سری 12 با پردازنده جدید S11 و ویژگی‌های هوشمند هوشمند اپل با قیمت 399 دلاری اپل واچ 11 شروع می‌شود. اپل"}, {"source": "Lifehacker", "title": "Why the Apple Health App's Redesign Is a Big Deal", "link": "https://lifehacker.com/health/apple-health-app-redesign?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Apple announced new watches today a Series 12 and an Ultra 4 which you can read more about here . But alongside the watch features, Apple announced a revamped Health app. We ll soon have a proper dashboard for health data and insights, rivaling what you can get from the companion apps for other wearables like Whoop, Garmin, and Fitbit. Apple Watch Series 12 Pre-order Here Pre-order Here Why Apple needed a better health dashboard Apple was an early trendsetter when it came to health-focused watches, but it quickly fell behind as all the other devices began adding sleep scores, recovery scores, and customized insights based on your day s data. If you open up a good wearable app, you ll instantly know what s going on with your body s data and what you should probably do about it. I m often skeptical of the specifics you shouldn t read too much into any app s metrics but it s good to have something to look at. The Apple Health app has existed for years, but it s mostly a dry listing of data from different sources. Which is a shame, because it has access to an incredible amount of data, not to mention powerful hidden features that most of us never manage to discover. Last year, Apple finally revamped its Fitness app to match what other wearables give us in terms of activity tracking. This year, we finally get the other half: a Health app that can tell you how well you slept, how recovered you are, and how your long-term health seems to be shaping up. What s coming to the redesigned Health app Although Apple showed these features in the context of an Apple Watch upgrade (more on that below), the things that intrigue me most are likely to be software updates that roll out to iPhones in general. That s my guess, in any case I ll watch Apple s announcements for more details as they become available. Apple showed a new Readiness score, which can tell you whether you need to recover, should pace yourself, are ready, or should go for it. (That s in order from worst to best.) This score can update during the day, making it a more readable version of something like Garmin s Body Battery. When you open your Health app, it looks like relevant insights will show up at the top of the screen, including your sleep, recovery, and rings, and the main screen can show your sleep from the past night along with a sleep score. The app includes text summaries and guidance that are generated by Apple Intelligence, suggesting that you'l", "date_str": "2026-09-09T19:00:00+00:00", "hash": "f0c1b5b9ab8040fd", "title_fa": "چرا طراحی مجدد اپلیکیشن سلامت اپل یک معامله بزرگ است؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اپل امروز ساعت‌های جدید خود را با نام‌های سری 12 و اولترا 4 معرفی کرد که می‌توانید در اینجا اطلاعات بیشتری درباره آنها بخوانید. اما در کنار ویژگی‌های ساعت، اپل یک اپلیکیشن بهداشتی اصلاح‌شده را معرفی کرد. ما به زودی یک داشبورد مناسب برای داده‌ها و بینش‌های سلامت خواهیم داشت که با آنچه می‌توانید از برنامه‌های همراه برای سایر پوشیدنی‌ها مانند Whoop، Garmin و Fitbit دریافت کنید، رقابت می‌کند. Apple Watch Series 12 پیش‌سفارش اینجا پیش‌سفارش اینجا پیش‌سفارش اینجا پیش‌سفارش چرا اپل به داشبورد سلامتی بهتری نیاز داشت اپل در زمینه ساعت‌های متمرکز بر سلامتی اولین ترند بود، اما به سرعت عقب افتاد زیرا همه دستگاه‌های دیگر شروع به اضافه کردن امتیاز خواب، امتیازات بازیابی و بینش سفارشی‌شده بر اساس داده‌های روز شما کردند. اگر یک برنامه پوشیدنی خوب باز کنید، فوراً متوجه خواهید شد که در مورد داده های بدن شما چه می گذرد و احتمالاً باید در مورد آن چه کاری انجام دهید. من اغلب در مورد جزئیاتی که نباید بیش از حد در معیارهای هیچ برنامه ای بخوانید شک دارم، اما خوب است که چیزی برای بررسی داشته باشید. اپلیکیشن Apple Health سال‌هاست که وجود دارد، اما عمدتاً فهرستی خشک از داده‌ها از منابع مختلف است. این مایه شرمساری است، زیرا به حجم باورنکردنی داده دسترسی دارد، البته به ویژگی های پنهان قدرتمندی که اکثر ما هرگز موفق به کشف آنها نمی شویم. سال گذشته، اپل سرانجام برنامه تناسب اندام خود را اصلاح کرد تا با آنچه دیگر پوشیدنی ها از نظر ردیابی فعالیت به ما می دهند، مطابقت داشته باشد. امسال، سرانجام نصف دیگر را دریافت کردیم: یک برنامه Health که می تواند به شما بگوید چقدر خوب خوابیده اید، چقدر بهبود یافته اید و به نظر می رسد سلامت بلندمدت شما چگونه شکل می"}, {"source": "Lifehacker", "title": "Apple's 'Reference Image' Preserves Your Original Photos (Even After You Edit Them)", "link": "https://lifehacker.com/tech/apple-reference-image-tool-explainer?utm_medium=RSS", "summary": "Figuring out what s real online is only getting harder, and AI watermarks can only go so far to identify fakes. But today, Apple introduced a new standard to at least help identify real images taken directly on an iPhone: Apple Reference Image. It won t solve the problem of finding the truth online, but it could be a helpful tool towards that goal. The new feature will be available on iPhone 18 Pro models to start. It works by taking signed sensor data from the camera and using it to create a reference picture that can t be edited, alongside a version that can be changed. The idea here is to give you a version of the picture that s authenticated at the moment of capture, which you can compare against any modified versions later. Credit: Credit: Apple This provenance metadata can be preserved through certain supported sharing methods, which for now means select other Apple devices can check their verification status. That doesn t mean that anyone can check the veracity of an image especially if the version that gets posted and shared is an edited variant but it provides a tool for the person or organization that took the picture originally to offer proof of verification. This tool comes alongside the announcement that Apple will soon add support for the SynthID standard. This will potentially help users identify when an image has been created or modified with AI. Apple joins a long (though not exactly comprehensive) list of major tech companies to support the standard, including OpenAI, Nvidia, and obviously Google, the original creator of SynthID. We re still in the midst of a scattershot image verification ecosystem. Apple s Reference Image is a clever implementation that gives the end user a signed original to compare a picture against, which is a step up from C2PA metadata that merely embeds information about an image s origin. It s still unclear how widely these verification tools will be implemented and how easy it will be for users to trace where an image comes from and how, precisely, it was modified, but still, something is better than nothing.", "date_str": "2026-09-09T18:45:25+00:00", "hash": "be8255671a6e103b", "title_fa": "\"تصویر مرجع\" اپل عکس های اصلی شما را حفظ می کند (حتی پس از ویرایش آنها)", "summary_fa": "فهمیدن اینکه چه چیزی آنلاین واقعی است سخت‌تر می‌شود و واترمارک‌های هوش مصنوعی تنها می‌توانند برای شناسایی تقلبی‌ها تا آنجا پیش بروند. اما امروز، اپل استاندارد جدیدی را معرفی کرد تا حداقل به شناسایی تصاویر واقعی که مستقیماً روی آیفون گرفته شده اند کمک کند: Apple Reference Image. مشکل یافتن حقیقت آنلاین را حل نمی کند، اما می تواند ابزار مفیدی برای رسیدن به این هدف باشد. ویژگی جدید برای شروع در آیفون 18 پرو در دسترس خواهد بود. با گرفتن داده‌های سنسور امضا شده از دوربین و استفاده از آن برای ایجاد یک تصویر مرجع که قابل ویرایش نیست، در کنار نسخه‌ای که قابل تغییر است، کار می‌کند. ایده در اینجا این است که نسخه ای از تصویر را در اختیار شما قرار دهیم که در لحظه ثبت احراز هویت شده باشد، که بعداً می توانید آن را با هر نسخه اصلاح شده مقایسه کنید. اعتبار: اعتبار: Apple این ابرداده منشأ را می توان از طریق روش های اشتراک گذاری پشتیبانی شده خاصی حفظ کرد، که در حال حاضر به این معنی است که سایر دستگاه های اپل می توانند وضعیت تأیید خود را بررسی کنند. این بدان معنا نیست که هر کسی می تواند صحت یک تصویر را بررسی کند، به خصوص اگر نسخه ای که پست می شود و به اشتراک گذاشته می شود، یک نسخه ویرایش شده باشد، اما ابزاری را برای شخص یا سازمانی که در ابتدا تصویر را گرفته است، ارائه می دهد تا مدرک تأیید صحت ارائه دهد. این ابزار در کنار اعلامیه ای ارائه می شود که اپل به زودی پشتیبانی از استاندارد SynthID را اضافه خواهد کرد. این به طور بالقوه به کاربران کمک می کند تشخیص دهند که چه زمانی یک تصویر با هوش مصنوعی ایجاد یا اصلاح شده است. اپل به لیست طولانی (اگرچه نه دقیقاً جامع) از شرکت‌های"}, {"source": "Lifehacker", "title": "Where’s the iPhone 18?", "link": "https://lifehacker.com/tech/why-apple-didnt-announce-the-iphone-18?utm_medium=RSS", "summary": "There was something different about today's \"Surprise and Shine\" launch event from Apple: We didn't get the unveiling of the iPhone 18. For the first time since Apple started releasing multiple iPhones per year, which was 2013 with the arrival of the iPhone 5c and the iPhone 5s (simpler times), we have several pro-level handsets without the standard version to accompany them. So what's behind the shift? And is the iPhone 18 canceled? Apple, predictably, isn't saying, but we've got enough clues to make an informed guess. Why Apple didn't announce an iPhone 18 The iPhone Duo was the star of today's show, as predicted. Credit: Apple If you've been keeping up with Apple rumors since the launch of the iPhone 17, you'll know that this has long been predicted notably by the most respected purveyor of Apple leaks in the business, reporter Mark Gurman. Gurman was predicting in Bloomberg as far back as November 2025 that we would only get the iPhone 18 Pro, iPhone 18 Pro Max, and the folding iPhone Duo in 2026. The reason? According to Gurman, it's to spread out revenue more evenly across the year, rather than having most of the iPhones unveiled every September. It also takes some of the pressure off Apple's marketing teams and reduces the likelihood of mishaps like that Siri AI upgrade which was announced way before it was ready . Gurman also went on record as saying that this is likely to be the norm for \"years to come,\" so get used to it. However, Gurman wasn't the first to break the news. In May of 2025, Wayne Ma at The Information reported that Apple would hold the standard iPhone 18 model over until 2027, based on conversations with anonymous supply chain sources. As per that report, one of the motivations behind the shift was to make more space for the folding iPhone, which makes sense considering it's Apple's first attempt at the form factor. Just a day later, well-known and usually well-informed Apple analyst Ming-Chi Kuo backed up the story, saying that we'd see the foldable iPhone, the iPhone 18 Pro, the iPhone 18 Pro Max, and the iPhone Air 2 (then called the iPhone 18 Slim) in September 2026. Apart from that last handset, he was right. Kuo added an extra reason for the shift as well: Competition from phone manufacturers based in Asia. A lot of these manufacturers release their flagship handsets during the first half of the year, including Samsung, and as far as Apple is concerned, that can leave it playing catch-up by the time September rolls around. He", "date_str": "2026-09-09T18:33:19+00:00", "hash": "9a26ae313b1435af", "title_fa": "آیفون 18 کجاست؟", "summary_fa": "چیزی متفاوت در مورد رویداد معرفی امروز \"سورپرایز و درخشش\" از سوی اپل وجود داشت: ما رونمایی از آیفون 18 را دریافت نکردیم. برای اولین بار از زمانی که اپل شروع به عرضه چندین آیفون در سال کرد، که در سال 2013 با ورود iPhone 5c و iPhone 5s (زمان ساده تر) بود، ما چندین گوشی حرفه ای را بدون نسخه استاندارد داریم. پس چه چیزی پشت این شیفت است؟ و آیا آیفون 18 کنسل شده است؟ اپل، به طور قابل پیش بینی، نمی گوید، اما ما سرنخ های کافی برای حدس زدن آگاهانه داریم. چرا اپل آیفون 18 را معرفی نکرد آیفون Duo همانطور که پیش بینی می شد ستاره نمایش امروز بود. اعتبار: اپل اگر از زمان عرضه آیفون 17، شایعات اپل را دنبال کرده باشید، می‌دانید که این موضوع مدت‌هاست که توسط معتبرترین تامین‌کننده افشای اطلاعات اپل در تجارت، گزارشگر مارک گورمن، پیش‌بینی شده است. گورمن در نوامبر 2025 در بلومبرگ پیش بینی می کرد که ما فقط آیفون 18 پرو، آیفون 18 پرو مکس و آیفون دو تاشو را در سال 2026 دریافت خواهیم کرد. دلیل؟ به گفته Gurman، به جای اینکه اکثر آیفون‌ها در سپتامبر هر سال رونمایی شوند، باید درآمد را به طور مساوی در طول سال توزیع کنیم. همچنین برخی از فشارها را از روی تیم های بازاریابی اپل برداشته و احتمال بروز حوادث ناگوار مانند ارتقاء هوش مصنوعی سیری را که قبل از آماده شدن اعلام شده بود کاهش می دهد. گورمن همچنین گفت که این احتمالاً برای «سال‌های آینده» عادی خواهد بود، بنابراین به آن عادت کنید. با این حال، گورمن اولین کسی نبود که این خبر را منتشر کرد. در ماه مه 2025، وین ما در The Information گزارش داد که اپل بر اساس گفتگو با منابع ناشناس زنجیره تامین، مدل استاندارد آیفون 18 را تا سال 2027 حفظ خواهد"}, {"source": "Lifehacker", "title": "The iPhone 18 Pro Series Comes With Big Gains in Battery Life", "link": "https://lifehacker.com/tech/iphone-18-pro-series-battery-life-updates?utm_medium=RSS", "summary": "While the iPhone 18 Pro looks similar to last year's model, the internals are a different story. The new A20 Pro processor with 32 Neural Engine cores will go a long way helping with on-device AI tasks but you might not feel those differences all the time. The new updates to battery life and charging, however, will make an actual difference in daily use on the iPhone 18 Pro and iPhone 18 Pro Max. Apple is promising the best battery life on an iPhone yet, and is finally supporting faster wired charging. Credit: Apple According to Apple, the regular sized iPhone 18 Pro will have the same battery life as the outgoing, larger iPhone 17 Pro Max model, which is quite a big deal. Apple is combining the efficiency gains in the A20 Pro chip with new battery technology to deliver this large leap in battery life. You will get 45 hours of video playback on the iPhone 18 Pro Max, and 36 hours on the iPhone 18 Pro model. The iPhone 18 Pro will last 24 hours per charge, while the 18 Pro Max can go up to 30 hours. According to Apple, this is based on tests performed with Apple's 40W Dynamic Power Adapter with a 60W max charging speed. Wired fast charging is also supported with 60W-capable USB-C cables and USB PD 3.1 adapters that support Adjustable Voltage Supply. Faster wired charging finally comes to the iPhone The world of Android flagships is filled with quick-charging smartphones, and some of that clout will now come over to the iPhone as well. A quick five-minute wired charge will give you up to six hours of video playback, and more importantly, you get 50% charging in just 15 minutes. Even wireless charging is faster, with 50% charging in around 30 minutes.", "date_str": "2026-09-09T18:30:00+00:00", "hash": "33774a228fdfed06", "title_fa": "سری iPhone 18 Pro با افزایش عمر باتری همراه است", "summary_fa": "در حالی که آیفون 18 پرو شبیه مدل سال گذشته به نظر می رسد، قسمت داخلی آن داستان متفاوتی دارد. پردازنده جدید A20 Pro با 32 هسته موتور عصبی کمک زیادی به وظایف هوش مصنوعی روی دستگاه خواهد کرد، اما ممکن است شما همیشه این تفاوت ها را احساس نکنید. با این حال، به‌روزرسانی‌های جدید در مورد عمر باتری و شارژ، تفاوت واقعی در استفاده روزانه در آیفون 18 پرو و ​​آیفون 18 پرو مکس ایجاد خواهد کرد. اپل وعده بهترین عمر باتری را در آیفون تا کنون داده است و در نهایت از شارژ سیمی سریعتر پشتیبانی می کند. اعتبار: اپل طبق گفته اپل، آیفون 18 پرو با اندازه معمولی عمر باتری مشابهی با مدل قبلی و بزرگتر آیفون 17 پرو مکس خواهد داشت، که بسیار مهم است. اپل در حال ترکیب دستاوردهای بهره وری در تراشه A20 Pro با فناوری جدید باتری است تا این جهش بزرگ را در عمر باتری ارائه دهد. در آیفون 18 پرو مکس 45 ساعت و در مدل آیفون 18 پرو 36 ساعت پخش ویدیو خواهید داشت. آیفون 18 پرو با هر بار شارژ 24 ساعت دوام می آورد، در حالی که 18 پرو مکس می تواند تا 30 ساعت دوام بیاورد. به گفته اپل، این بر اساس آزمایش‌هایی است که با آداپتور برق دینامیک ۴۰ واتی اپل با حداکثر سرعت شارژ ۶۰ وات انجام شده است. شارژ سریع سیمی با کابل‌های USB-C با توان ۶۰ وات و آداپتورهای USB PD 3.1 که از منبع ولتاژ قابل تنظیم پشتیبانی می‌کنند نیز پشتیبانی می‌شود. شارژ سریع‌تر سیمی بالاخره به آیفون می‌رسد دنیای پرچم‌داران اندرویدی مملو از تلفن‌های هوشمند با شارژ سریع است و بخشی از این تأثیر اکنون به آیفون نیز خواهد رسید. شارژ سریع سیمی پنج دقیقه ای تا شش ساعت پخش ویدیو را برای شما فراهم می کند و مهمتر از آن،"}, {"source": "Lifehacker", "title": "Microsoft's Record-Setting Patch Tuesday Update Fixes Nearly 1,000 Flaws", "link": "https://lifehacker.com/tech/microsofts-record-setting-patch-tuesday-update-fixes-nearly-1000-flaws?utm_medium=RSS", "summary": "Security updates have been trending larger, and Microsoft's Patch Tuesday for September is no exception. The company just released fixes for nearly 1,000 bugs, which is approaching double the number of flaws patched in July (the previous record). Two of the vulnerabilities addressed this month are zero-days that have been exploited in the wild. This massive jump is in large part due to AI , which is making it easier for bad actors to develop tools to exploit vulnerabilities while also allowing developers to find and fix them more quickly. This means we're likely to continue seeing sizeable updates on shorter release cycles , ideally reducing the time hackers have to take advantage of these flaws. Microsoft has typically pushed Patch Tuesday fixes around 10 a.m. PT on the second Tuesday of every month. It's always been important to install security updates as soon as they're available, but it's even more critical now with a larger number of flaws open to exploitation. PC users should receive Patch Tuesday updates automatically, but you can check the status via Start Settings Windows Update Check for Windows updates . September's Patch Tuesday addresses 966 flaws with two zero-days As BleepingComputer reports , the 966 flaws fixed this month are broken down across the following categories: 438 elevation-of-privilege vulnerabilities, 19 security feature bypass vulnerabilities, 258 remote-code-execution vulnerabilities, 173 information disclosure vulnerabilities, 16 spoofing vulnerabilities, and 56 denial-of-service vulnerabilities. These figures do not include other vulnerabilities (204 in total across other Microsoft products) patched earlier this month. One of the zero-days addressed in September is an elevation of privilege vulnerability in the Windows Update Stack. CVE-2026-81963 allows attackers to gain SYSTEM privileges via improper link resolution before file access. The bug discovery has been attributed to Romain Deperne and the Microsoft Threat Intelligence Centre. The other zero-day is also an elevation of privilege vulnerability. CVE-2026-85880 is a flaw in the Windows Advanced Local Procedure an attacker could execute code in a low-privilege AppContainer, and the vulnerability could escape the sandbox and gain SYSTEM privileges locally. The bug was discovered by Volexity, as well as Mark Kelly, David Galazin, and Jeremy Hedges with Proofpoint. Both zero-days have been actively exploited in the wild, though Microsoft has not provided any details as", "date_str": "2026-09-09T18:00:51+00:00", "hash": "b29cf1d1439f8918", "title_fa": "به روز رسانی سه شنبه ثبت رکورد مایکروسافت نزدیک به 1000 نقص را برطرف کرد", "summary_fa": "به‌روزرسانی‌های امنیتی روند بزرگ‌تری داشته‌اند، و پچ سه‌شنبه مایکروسافت برای سپتامبر نیز از این قاعده مستثنی نیست. این شرکت به تازگی اصلاحاتی را برای نزدیک به 1000 باگ منتشر کرده است که به دو برابر تعداد نقص های اصلاح شده در جولای (رکورد قبلی) نزدیک می شود. دو مورد از آسیب‌پذیری‌هایی که در این ماه مورد بررسی قرار گرفته‌اند، روزهای صفر هستند که در طبیعت مورد سوء استفاده قرار گرفته‌اند. این جهش عظیم تا حد زیادی به دلیل هوش مصنوعی است، که توسعه ابزارهایی برای سوء استفاده از آسیب‌پذیری‌ها را برای بازیگران بد آسان‌تر می‌کند و در عین حال به توسعه‌دهندگان اجازه می‌دهد تا سریع‌تر آنها را پیدا و برطرف کنند. این بدان معناست که ما احتمالاً همچنان شاهد به‌روزرسانی‌های قابل توجهی در چرخه‌های انتشار کوتاه‌تر خواهیم بود، که در حالت ایده‌آل زمان استفاده هکرها از این نقص‌ها را کاهش می‌دهد. مایکروسافت معمولاً اصلاحات پچ سه‌شنبه را حدود ساعت 10 صبح سه‌شنبه دوم هر ماه انجام می‌دهد. نصب به‌روزرسانی‌های امنیتی به محض در دسترس بودن همیشه مهم بوده است، اما در حال حاضر با تعداد بیشتری از نقص‌ها که قابل بهره‌برداری هستند، بسیار مهم‌تر است. کاربران رایانه شخصی باید به‌روزرسانی‌های Patch Tuesday را به‌طور خودکار دریافت کنند، اما می‌توانید وضعیت را از طریق تنظیمات شروع به‌روزرسانی بررسی ویندوز برای به‌روزرسانی‌های ویندوز بررسی کنید. وصله سه‌شنبه سپتامبر 966 نقص را با دو روز صفر برطرف می‌کند همانطور که BleepingComputer گزارش می‌دهد، 966 نقص رفع شده در این ماه در دسته‌های زیر تقسیم‌بندی می‌شوند: 438 آسیب‌پذیری ارتقای امتیاز، 19 آسیب‌پذیری بای پس از ویژگی‌های امنیتی، 258 اطلاعات remote-code-code-execution. آسیب‌پذیری، 16 آسیب‌پذیری جعل و 56 آسیب‌پذیری انکار سرویس. این ارقام شامل آسیب‌پذیری‌های دیگر (در مجموع 204 در سایر محصولات مایکروسافت) که در اوایل این ماه وصله شده‌اند، نمی‌شود. یکی از روزهای صفر که در سپتامبر به آن پرداخته شد، افزایش آسیب‌پذیری امتیاز در"}, {"source": "Lifehacker", "title": "Apple Just Announced the iPhone 18 Pro and iPhone 18 Pro Max", "link": "https://lifehacker.com/tech/apple-iphone-18-pro-and-iphone-18-pro-max-announcement?utm_medium=RSS", "summary": "The iPhone Duo will inevitably steal tech headlines this week. After all, Apple finally made a foldable iPhone to compete with options from Samsung and Google. But while an iPhone with two displays is novel and exciting, it's also going to be expensive. I imagine there are many in the market for a new iPhone who aren't interested in spending as much as $2,000. There are also likely customers who don't want a foldable iPhone, and would prefer the standard smartphone design they're used to. That's where the iPhone 18 Pro comes in. iPhone 18 Pro: Design If you have an iPhone 17 Pro, you might confuse it for the iPhone 18 Pro. Indeed, Apple hasn't changed the overall design much this year, which is to be expected. The iPhone 17 Pro refreshed the Pro iPhone design with its large camera bump and plane of glass for MagSafe charging. The 18 Pro and 18 Pro Max aren't much different though now the metal is color-matched to the back glass. That being said, there are some changes here you may notice upon closer examination. Perhaps first you'd notice the 18 Pro's Dynamic Island is smaller than it has been on previous Pro iPhones. With it, you're able to run three tasks at once, rather than two. That may prove useful depending on what you're doing, or it may end up cluttering the top of your iPhone. 18 Pro users will have to be the judge. You'd also notice some new color options not available on the iPhone 17 Pro, which I'll cover below. The displays will remain the same sizes as last year 6.3 inches on the iPhone 18 Pro, and 6.9 inches on the iPhone 18 Pro Max. But now, these displays use a more efficient LPTO+ technology. iPhone 18 Pro: Processor Like the iPhone Duo, the iPhone 18 Pros come with Apple's new A20 Pro chip built on 2nm technology. The company touts how the new chip is great for processing AI on-device, with a six-core CPU, seven-core GPU, new Neural Accelerators, and a second Neural Engine. Apple focused on the A20 Pro's thermal cooling with the new vapor chamber in the 18 Pro. Apple says this means there are significant sustained performance improvements over the iPhone 17 Pro. Apple says this chip has the fastest CPU in a smartphone, with 50% better memory bandwidth. But, as with all performance claims, we'll have to wait until testers try out the A20 Pro for themselves. Still, Apple's newest chips always improve on the previous generation by some degree, so it's safe to say the 18 Pro (and the Duo at that) will be the fastest iPhones yet. Apple also ", "date_str": "2026-09-09T17:39:20+00:00", "hash": "4041e47c260fe692", "title_fa": "اپل به تازگی آیفون 18 پرو و ​​آیفون 18 پرو مکس را معرفی کرد", "summary_fa": "آیفون Duo به ناچار سرفصل های فناوری را در این هفته به سرقت خواهد برد. بالاخره اپل بالاخره یک آیفون تاشو ساخت تا با گزینه های سامسونگ و گوگل رقابت کند. اما در حالی که یک آیفون با دو نمایشگر جدید و هیجان انگیز است، گران نیز خواهد بود. تصور می‌کنم بسیاری از آیفون‌های جدید در بازار هستند که علاقه‌ای به خرج کردن 2000 دلار ندارند. احتمالاً مشتریانی نیز وجود دارند که آیفون تاشو نمی خواهند و طراحی استاندارد گوشی هوشمندی را که به آن عادت کرده اند ترجیح می دهند. اینجاست که آیفون 18 پرو وارد می شود. آیفون 18 پرو: طراحی اگر آیفون 17 پرو دارید، ممکن است آن را با آیفون 18 پرو اشتباه بگیرید. در واقع، اپل طراحی کلی را در سال جاری تغییر چندانی نداده است که قابل انتظار است. آیفون 17 پرو با برآمدگی دوربین بزرگ و صفحه شیشه ای برای شارژ MagSafe، طراحی آیفون پرو را تازه کرد. 18 پرو و ​​18 پرو مکس تفاوت چندانی با هم ندارند، اگرچه اکنون فلز با شیشه پشتی مطابقت دارد. همانطور که گفته شد، تغییراتی در اینجا وجود دارد که ممکن است با بررسی دقیق تر متوجه آن شوید. شاید ابتدا متوجه شوید که جزیره پویا 18 پرو کوچکتر از آیفون های قبلی پرو است. با استفاده از آن، می‌توانید سه کار را همزمان به جای دو کار انجام دهید. این ممکن است بسته به کاری که انجام می‌دهید مفید باشد، یا ممکن است بالای آیفون شما را به هم ریخته باشد. 18 کاربر حرفه ای باید قضاوت کنند. همچنین متوجه می‌شوید که برخی از گزینه‌های رنگی جدید در آیفون 17 پرو موجود نیستند، که در زیر به آنها خواهم پرداخت. اندازه نمایشگرها در آیفون 18 پرو 6.3 اینچ و در آیفون 18 پرو مکس 6.9 اینچ است. wall, where you ll have to pay to read even one article. Paywalls are mostly a thing with news websites, largely because relying on advertising income alone isn t a viable strategy anymore, forcing these companies to pursue direct revenue sources like monthly subscriptions. In that sense, paywalls aren't a bad thing it s wonderful to support journalism you find valuable. If nothing else, I hope you support the websites that you read regularly especially your local news outlet. But sometimes, you just need to get around a paywall quickly. Maybe you've lost your password, haven t saved it on your phone, are in a rush, or are strapped for cash and swear to yourself that you ll subscribe later. If one of these exceptions applies, there are many ways to bypass paywalls on the internet though not nearly as many as there used to be. Many once-reliable methods of bypassing paywalls have stopped working almost entirely (pour one out for pasting the headline into Google and opening the link in a private browsing window). The methods discussed below are more robust and thus, more likely to work. I'll start with my favorite, which has served me well for the past few years. But a word of caution: You may be able to use one of these methods successfully today, but that could change in the future as websites clamp down on bypass methods. (This article is regularly updated as some methods stop working and others pop up.) Archive.today is the best, most reliable option for bypassing paywalls Credit: Screenshot by Joel Cunningham Archive.today is the fastest, most reliable way I've found to quickly bypass a paywall, and I've been using it successfully for years across a wide range of sites, even as other options have come and gone. It's a site that will create an archived version of any website you paste into the search bar. (Think of an archived version like taking a screenshot of any website, complete with a timestamp a self-described time capsule, if you will.) Archive.today saves a text and a graphical copy of the page for", "date_str": "2026-09-09T13:44:00+00:00", "hash": "2acc629cf906d22e", "title_fa": "بهترین راه برای عبور از Paywall یک مقاله", "summary_fa": "دوران اینترنت رایگان مدت‌هاست به پایان رسیده است: از آنجایی که بازار تبلیغات آنلاین در سال‌های اخیر سقوط کرده است، عمدتاً به لطف تغییراتی که گوگل در خلاصه‌های مقدماتی هوش مصنوعی ایجاد کرده است، وب‌سایت‌های بی‌شماری دیوارهای پرداخت اضافه کرده‌اند. این بدان معناست که اگر می خواهید مقالات آنها را بخوانید، باید ثبت نام کنید و هزینه اشتراک ماهانه بپردازید. برخی از سایت‌ها دارای یک دیوار پرداخت اندازه‌گیری هستند به این معنی که شما می‌توانید تعداد معینی از مقاله‌ها را قبل از درخواست پول به صورت رایگان بخوانید و برخی دیگر یک دیوار پرداخت سخت دارند، جایی که برای خواندن حتی یک مقاله باید هزینه بپردازید. Paywalls بیشتر موردی برای وب سایت های خبری است، عمدتاً به این دلیل که اتکا به درآمد تبلیغاتی به تنهایی دیگر استراتژی قابل قبولی نیست و این شرکت ها را مجبور می کند منابع درآمد مستقیم مانند اشتراک ماهانه را دنبال کنند. از این نظر، دیوارهای پرداخت چیز بدی نیستند، حمایت از روزنامه نگاری که به نظر شما ارزشمند است، فوق العاده است. اگر هیچ چیز دیگری نیست، امیدوارم از وب سایت هایی که مرتباً می خوانید، به ویژه رسانه محلی خود حمایت کنید. اما گاهی اوقات، شما فقط نیاز دارید که به سرعت یک دیوار پرداخت را دور بزنید. شاید رمز عبور خود را گم کرده اید، آن را در تلفن خود ذخیره نکرده اید، عجله دارید، یا پول نقد در بند شده اید و به خودتان قسم می خورید که بعداً مشترک می شوید. اگر یکی از این استثناها اعمال شود، راه‌های زیادی برای دور زدن دیوارهای پرداخت در اینترنت وجود دارد، البته نه تقریباً به اندازه گذشته. بسیاری از روش‌های قابل اعتماد دور زدن دیوارهای پرداخت تقریباً به طور کامل کار نمی‌کنند (یکی را برای چسباندن عنوان در Google و باز کردن پیوند در یک پنجره مرور خصوصی بریزید). روش‌هایی که"}, {"source": "Lifehacker", "title": "This Meta Quest Pro Is Over $370 Off Right Now", "link": "https://lifehacker.com/tech/meta-quest-pro-sale-september-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. The Meta Quest Pro launched as Meta s vision of what high-end virtual and mixed reality could look like without dragging a gaming PC into the equation and Woot currently has an open-box unit for $626.61, which is a little over $370 below its original $999 price and more than $140 cheaper than Amazon s listed like-new option at the time of writing. The deal is set to run for another two days or until it sells out, with free standard shipping for Prime members and a $6 shipping fee for everyone else. Woot also notes that open box here means the packaging may have been opened for display or testing, while the headset itself is new. Meta Quest Pro $626.61 at Woot $999.99 Save $373.38 Get Deal Get Deal $626.61 at Woot $999.99 Save $373.38 This headset won PCMag s Best VR Headset award in 2022, and while it s no longer the newest thing Meta sells, it s still positioned well above many entry-level VR sets. The newer Meta Quest 3 offers faster performance and more advanced mixed-reality features at a lower price, but the Quest Pro still holds its ground if you prioritize comfort, tracking accuracy, and its more premium build over raw power. The Quest Pro uses a balanced halo-style strap with the battery placed at the back, which spreads the weight more evenly than front-heavy headsets. That makes longer sessions more tolerable, though long is relative the battery lasts around two hours, which can feel limiting if you re deep into work or creative apps. Inside, you get a Snapdragon XR2+ chip, 12GB of RAM, and 256GB of storage, which is generous for a standalone headset. The displays push 1,920 by 1,800 pixels per eye, with better contrast and richer colors thanks to local dimming. In practice, this means sharper text, deeper blacks, and fewer washed-out scenes compared to older Quest models , especially in mixed-reality apps. The controllers are another upgrade. Meta removed the tracking ring right) a cheeseburger, six nuggets, a box of fries, and a Coke. Make the pictures look as photorealistic as possible with natural lighting, but add variations and imperfections to give the impression of real food.\" ChatGPT is on the left and Gemini on the right. Both do a decent job of producing menu items that look realistic and actually edible, albeit with the usual AI tendency towards the generic. Personally, I'd say the ChatGPT images look slightly more like real food, though Gemini has done better on the backgrounds and wider scene (the Burger King logo would cause trouble, though). How ChatGPT Image 2.5's Sketch tool compares to Google Nano Banana 2 From left: Human creativity, ChatGPT, Gemini. Credit: Lifehacker One of the key new features in ChatGPT Images 2.5 is a new Sketch tool, which lets you turn your basic", "date_str": "2026-09-09T13:00:00+00:00", "hash": "82ed6f3635bce56c", "title_fa": "OpenAI به تازگی ChatGPT Images 2.5 را معرفی کرد و در اینجا نحوه مقایسه آن با Nano Banana 2 گوگل است.", "summary_fa": "در میان گرداب هر چیز دیگری که در حال حاضر با هوش مصنوعی اتفاق می‌افتد، OpenAI ChatGPT Images 2.5 را منتشر کرده است که آن را سریع‌تر، واضح‌تر و هوشمندتر توصیف می‌کند و «ابزارهای بهتری برای ایجاد هر آنچه که می‌توانید رویای آن را داشته باشید» توصیف می‌کند. این ابزارهای جدید شامل قالب‌ها، ویژگی‌های ویرایش دقیق‌تر و روشی برای تبدیل doodles روی صفحه به تصاویر کاملاً واقعی است. این توییت در حال حاضر در دسترس نیست. ممکن است در حال بارگیری باشد یا حذف شده باشد. آیا همه اینها به این معنی است که ChatGPT Images 2.5 ما را از بلای تصاویر بد غذایی با هوش مصنوعی در منوها و پوسترها نجات می دهد؟ آیا می تواند جایگزین یک ویرایشگر عکس سنتی شود؟ و چگونه آن را با به روز رسانی چشمگیر Nano Banana 2 که گوگل در فوریه ارائه کرد مقایسه می کند؟ برای پاسخ به همه این سؤالات و بیشتر، من مولد تصویر جدید را در ChatGPT راه اندازی کردم تا ببینم چه توانایی هایی دارد. همه می‌دانند که اکنون برای همه کاربران در سراسر وب، برنامه‌های دسکتاپ و برنامه‌های تلفن همراه منتشر می‌شود، اگرچه طبق معمول محدودیت‌های استفاده متفاوتی (که ChatGPT فقط به طور مبهم تعریف می‌کند) در هر طرح وجود دارد. چگونه تصاویر غذا در ChatGPT Images 2.5 و Gemini Nano Banana 2 تصاویر ChatGPT 2.5 را در سمت چپ مقایسه می کنند. Gemini Nano Banana 2 در سمت راست. اعتبار: Lifehacker یکسان بودن و ظاهر عجیب و غریب غذاهای تولید شده توسط هوش مصنوعی در تابلوها و منوهای رستوران در حال تبدیل شدن به یک مسئله واقعی است، بنابراین به نظر می رسد این مکان خوبی برای شروع باشد. منصفانه است که بگوییم تصاویر تبلیغاتی غذا همیشه مجوز هنری گرفته اند، اما هوش مصنوعی مشکل را بدتر می کند. آیا ChatGPT Images 2.5 می تواند"}, {"source": "Lifehacker", "title": "Lifehacker Labor Day Sale Live Blog: Your Last Chance for These Labor Day Deals Before They End", "link": "https://lifehacker.com/tech/labor-day-sales-live-blog-09-08-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Labor Day is more than a celebration of American workers or the unofficial mark of the end of summer; it's also a time when retailers put a lot of stuff on sale. If you're moving, need supplies for the new school year, are looking to upgrade your tech, or are hoping for a good deal on tools or household items, it's a good time to start poking around. The deals are in full swing, and more will continue to pop up until Sept. 8, the day after the holiday, when most of the action will end. With this live blog, you can keep up with the best Labor Day deals as the Lifehacker team finds them, throughout this long sale, and all in one place. As always, we use price-tracking tools to suss out the deals that are actually worth paying attention to, not just hype designed to instill a false sense of urgency .", "date_str": "2026-09-08T21:13:02+00:00", "hash": "ae34e33554bc01af", "title_fa": "لایف هکر فروش لایو لایو روز کارگر: آخرین فرصت شما برای این معاملات روز کارگر قبل از پایان آنها", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت ک       media: [{"source": "Billboard", "title": "Universal Music Group & Warner Chappell Launch Ecuadorian Music Company Sonido Distrito Sur", "link": "https://www.billboard.com/pro/universal-music-warner-chappell-ecuadorian-music-company/", "summary": "Universal Music Group (UMG) and Warner Chappell Music (WCM) have teamed up to launch Sonido Distrito Sur (SDS), Billboard can exclusively announce. SDS, which brings together UMG s record label infrastructure and WCM s publishing infrastructure, is designed to help amplify the Ecuadorian music scene by connecting the country’s artists with the global music industry. The company will integrate investment, production, distribution, marketing, promotion, A R, international collaborations and new growth opportunities for Ecuadorian artists. A press release notes that the company will also strike a future international partnership to develop its booking operations on the touring front. Related Here s the Date of the 2026 Billboard Latin Music Awards Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction The new venture will be led by Juan Fernando Velasco , an Ecuadorian singer-songwriter, and music executive Ricardo Ordóñez . At the heart of SDS is Artist Elevation, a proprietary model that seeks to comprehensively strengthen each artist’s career through the development of their repertoire, image, positioning, collaborations, platform presence, and the artistic, technical, visual, and commercial evolution of their live performances, the release reads. “Ecuador has never lacked talent,” Velasco said in a statement. “What has been missing is a structure capable of connecting that talent with opportunities in the international music industry. Sonido Distrito Sur was created to build that bridge and help our artists gain the recognition they truly deserve.” SDS officially launched at an intimate gathering during Sayce Music Week, which took place earlier this month in Ecuador. With Velasco and Ordóñez s leadership, Sonido Distrito Sur hopes to become a major player in the Andean region and to launch Ecuadorian artists into new markets such as Peru, Colombia and Central America.", "date_str": "2026-09-09T19:47:46+00:00", "hash": "9348c5ad2478cf1d", "title_fa": "گروه موسیقی یونیورسال و وارنر چاپل شرکت موسیقی اکوادوری Sonido Distrito Sur را راه اندازی کردند", "summary_fa": "گروه موسیقی یونیورسال (UMG) و وارنر چاپل موزیک (WCM) برای راه‌اندازی Sonido Distrito Sur (SDS) با هم همکاری کرده‌اند، بیلبورد می‌تواند به طور انحصاری اعلام کند. SDS که زیرساخت‌های لیبل ضبط UMG و زیرساخت انتشارات WCM را گرد هم می‌آورد، برای کمک به تقویت صحنه موسیقی اکوادور از طریق اتصال هنرمندان این کشور با صنعت موسیقی جهانی طراحی شده است. این شرکت سرمایه گذاری، تولید، توزیع، بازاریابی، تبلیغات، A R، همکاری های بین المللی و فرصت های رشد جدید را برای هنرمندان اکوادوری یکپارچه خواهد کرد. یک بیانیه مطبوعاتی اشاره می کند که این شرکت همچنین یک شراکت بین المللی آینده را برای توسعه عملیات رزرو خود در جبهه تور ایجاد خواهد کرد. در اینجا تاریخ برگزاری جوایز موسیقی لاتین بیلبورد 2026 بیلبورد برای افزودن آلبوم های رسانه های هوشمند به عنوان فرمت های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل Tupac Shakur انجام می دهد. سرمایه گذاری جدید توسط خوان فرناندو ولاسکو، خواننده اجرایی اکوادوریایی و خوانندگان اکوادورایی اکوادوری انجام می شود. در قلب SDS Artist Elevation قرار دارد، مدلی اختصاصی که به دنبال تقویت همه جانبه حرفه هر هنرمند از طریق توسعه رپرتوار، تصویر، موقعیت، همکاری، حضور در پلتفرم و تکامل هنری، فنی، بصری و تجاری اجراهای زنده آنهاست. ولاسکو در بیانیه ای گفت: «اکوادور هیچگاه فاقد استعداد نبوده است. \"آنچه گم شده است ساختاری است که می تواند آن استعداد را با فرصت ها در صنعت موسیقی بین المللی مرتبط کند. Sonido Distrito Sur برای ساختن این پل و کمک به هنرمندان ما ایجاد شد تا به شناختی که واقعاً سزاوار آن هستند، برسند.\" SDS رسماً در یک گردهمایی صمیمی در هفته موسیقی Sayce که در اوایل ماه جاری در اکوادور برگزار شد، راه اندازی شد."}, {"source": "Billboard", "title": "Barclays Center 2026-2027: Here’s Where to Get Affordable Concert and Event Tickets Online (Updating)", "link": "https://www.billboard.com/culture/product-recommendations/barclays-center-concert-tickets-buy-online-1236059754/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Barclays Center is one of the biggest venues in New York City, with recording artists coming to Brooklyn to perform in front of its impressive 17,000-seat capacity. For 2026, massive recording artists, like Robyn, Charli xcx, Weezer, Teddy Swims and others are set to perform at the venue. Plus, Olivia Rodrigo is set with a 10-concert residency in early 2027. Shop Barclays Center Tickets at Ticketmaster Want to attend Barclays Center for a concert in person? Tickets to the venue are on sale through Live Nation and Ticketmaster , while the retailer s Face Value Exchange program is an option for fans to resell tickets. You can even get tickets to the venue s basketball teams, WNBA s New York Liberty and NBA s Brooklyn Nets, here . However, dates are quickly, or are very close to, selling out, so one of the best ways to find Barclays Center tickets online is through third-party sites, including StubHub , SeatGeek , Vivid Seats , TicketNetwork , Gametime , Event Tickets Center and others all of which guarantee authentic tickets in time for the event. Prices may also be above or below face value at times. Where to Find Barclays Center Tickets Online Looking for cheap seats to attended Barclays Center? Here s where to find tickets still available and on sale online. TOP PICK Find Barclays Center Tickets at StubHub SEE TICKETS HERE Top choice for concert tickets in 2026. StubHub has Barclays Center tickets available . Stubhub s Fan Protect Guarantee ensures valid tickets or your money back. And if your event is canceled and not rescheduled, you ll receive 120% in credit or be given the option of a full refund. BEST PRICES Find Barclays Center Tickets at SeatGeek FIND TICKETS HERE One of the lowest prices we re seeing for Barclays Center tickets is at SeatGeek , which has stubs from $50 and up. Use our discount code BILLBOARD10 to save an additional $10 at checkout. EARN REWARDS Find Barclays Center Tickets at Vivid Seats FIND TICKETS HERE You can find Barclays Center tickets online at Vivid Seats , which lets you search by price, location and Super Sellers, which denotes reputable sellers with the best deals on tickets. Vivid Seats is great for group tickets: The site has a rewards program that gives you your eleventh ticket free (i", "date_str": "2026-09-09T19:33:29+00:00", "hash": "a8f61dd59fa03d0a", "title_fa": "Barclays Center 2026-2027: اینجاست که از کجا می توان بلیط های کنسرت و رویدادهای مقرون به صرفه را به صورت آنلاین دریافت کرد (در حال به روز رسانی)", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. مرکز بارکلیز یکی از بزرگ‌ترین مکان‌ها در شهر نیویورک است که هنرمندان ضبط صدا به بروکلین می‌آیند تا در مقابل ظرفیت خیره‌کننده 17000 صندلی آن اجرا کنند. برای سال 2026، هنرمندان ضبط عظیمی مانند Robyn، Charli xcx، Weezer، Teddy Swims و دیگران قرار است در این مکان اجرا کنند. بعلاوه، اولیویا رودریگو در اوایل سال 2027 دارای اقامتگاه 10 کنسرتی است. خرید بلیط های مرکز بارکلیز در Ticketmaster آیا می خواهید شخصاً برای یک کنسرت در مرکز بارکلیز شرکت کنید؟ بلیط‌های محل برگزاری از طریق Live Nation و Ticketmaster فروخته می‌شوند، در حالی که برنامه تبادل ارزش چهره خرده‌فروش گزینه‌ای برای طرفداران برای فروش مجدد بلیط است. حتی می‌توانید بلیط‌های تیم‌های بسکتبال محل برگزاری، نیویورک لیبرتی WNBA و بروکلین نتز NBA را در اینجا تهیه کنید. با این حال، تاریخ‌ها به سرعت فروخته می‌شوند یا بسیار نزدیک به آن هستند، بنابراین یکی از بهترین راه‌ها برای یافتن آنلاین بلیط‌های Barclays Center از طریق سایت‌های شخص ثالث، از جمله StubHub، SeatGeek، Vivid Seat، TicketNetwork، Gametime، مرکز بلیط رویداد و سایر موارد است که همگی بلیط‌های معتبر را به موقع برای رویداد تضمین می‌کنند. همچنین ممکن است گاهی اوقات قیمت ها بالاتر یا کمتر از ارزش اسمی باشد. بلیط های آنلاین بارکلیز را از کجا می توان پیدا کرد آیا به دنبال صندلی های ارزان برای حضور در مرکز بارکلیز هستید؟ در اینجا می‌توان بلیط‌هایی را که هنوز در دسترس و فروش آنلاین هستند پیدا کرد. انتخاب برتر بلیت‌های مرکز بارکلیز را در StubHub بیابید، بلیت‌ها را در اینجا ببینید بهترین انتخاب برای بلیت‌های کنسرت در"}, {"source": "Billboard", "title": "ERNEST Gets Candid About His Mental Health After Leaving Ella Langley’s Tour: ‘I Was Lost’", "link": "https://www.billboard.com/music/country/ernest-mental-health-leaving-ella-langley-tour-1236336574/", "summary": "ERNEST is opening up after leaving his opening slot on Ella Langley s The Dandelion Tour in August. In a post on Instagram on Monday (Sept. 7), ERNEST, 34, offered up thanks to his fans for their constant support and shared an update. Bottom line is I was LOST i recon I still am but the search is on . And that s new to me, he captioned his carousel post. if anything, through this time, I am really starting to touch back in with my relationship with God… growing up in the church / Christian school, I would say I got a bit burnt out on it all. The post included video of a rainbow stretching over the wilderness, as well as photos of wildflowers, deer and turkeys, as well as a shot of ERNEST sitting on a chair on a deck and puffing on a cigarette. He added, have spent far too long relying on my own (dumbass) way and thinking I can outsmart my better judgement…. That’s not the case…. I don’t have many answers at all…. But I do know where it’s starting…. A dialogue with something greater than ME. I can’t define it and don’t know if anyone really can… I just know that I have a beautiful life, family and friends that deserve me at my best. I deserve that for me too…. I’m not preaching by any means…. But I just wanted to let yall know I’m taking this time to dig and discover. He also offered up reassurances to fans, writing, I love yall… and I love country music… Il be back to both soon! ERNEST who boasts four songs on the Billboard Hot 100 so far revealed on his Instagram Stories Aug. 28 that he would no longer be part of Langley s tour, writing that it had taken a toll on his mental and physical health. Hey y’all. The road has been dragging me down in a bad way. From mental to physical health, he wrote at the time, saying he had planned to only be off the road for a few weeks in order to focus on myself and my priorities. “I want to thank Ella for having me out on tour and wishing her the BEST in Auburn tonight and the rest of the tour, he wrote at the time. I look forward to coming back better and stronger. I owe it to myself and those affected by my actions. That starts now. Love y’all. In addition to previously holding down an opening slot on Langley s The Dandelion Tour, ERNEST is also a cowriter on Langley s song Loving Life Again, from her album Dandelion . He s also a cowriter on Langley s recently Koe Wetzel collab Jaded.", "date_str": "2026-09-09T18:29:23+00:00", "hash": "2972490092de8690", "title_fa": "ارنست پس از ترک تور الا لنگلی درباره سلامت روانی خود صادقانه می گوید: \"I Was Lost\"", "summary_fa": "ارنست پس از ترک محل افتتاحیه خود در تور قاصدک به کارگردانی الا لنگلی در ماه اوت شروع به کار کرد. ارنست 34 ساله در پستی در اینستاگرام روز دوشنبه (7 سپتامبر) از طرفدارانش به خاطر حمایت همیشگی آنها تشکر کرد و یک به روز رسانی را به اشتراک گذاشت. خط آخر این است که من گم شده بودم، فکر می کنم هنوز هستم اما جستجو ادامه دارد. و این برای من جدید است، او پست چرخ فلک خود را شرح داد. در هر صورت، در این زمان، من واقعاً شروع به بازگرداندن رابطه خود با خدا کرده‌ام. این پست شامل ویدئویی از یک رنگین کمان است که بر فراز بیابان کشیده شده است، همچنین عکس‌هایی از گل‌های وحشی، گوزن‌ها و بوقلمون‌ها، و همچنین عکسی از ارنست که روی صندلی روی عرشه نشسته و سیگار می‌کشد. او افزود، مدت زیادی را صرف اتکا به روش (احمقانه) خودم کرده‌ام و فکر می‌کنم می‌توانم از قضاوت بهترم پیشی بگیرم…. اینطور نیست…. من اصلا جواب زیادی ندارم…. ولی میدونم از کجا شروع میشه… دیالوگ با چیزی بزرگتر از من. من نمی توانم آن را تعریف کنم و نمی دانم که آیا واقعاً کسی می تواند ... من فقط می دانم که من زندگی زیبا، خانواده و دوستانی دارم که در بهترین حالت لیاقت من را دارند. من هم برای خودم لیاقتش را دارم…. من به هیچ وجه موعظه نمی کنم…. اما من فقط می خواستم به شما بگویم که این زمان را برای حفاری و کشف صرف می کنم. او همچنین به طرفداران اطمینان داد، نوشتن، I love yall... و من عاشق موسیقی کانتری هستم... به زودی به هر دو بازخواهم گشت! ارنست که تاکنون به چهار آهنگ در بیلبورد Hot 100 افتخار می کند، در تاریخ 28 آگوست در استوری اینستاگرام خود فاش کرد که دیگر بخشی از تور لنگلی نخواهد بود"}, {"source": "Billboard", "title": "‘KPop Demon Hunters’ Has Led Billboard’s Top Soundtracks Chart for 59 Weeks: Only One Soundtrack Has Led Longer (Full List)", "link": "https://www.billboard.com/lists/billboard-top-soundtracks-chart-most-weeks-no-1-full-list/", "summary": "KPop Demon Hunters has slayed on Billboard ’s Top Soundtracks chart, having led the list for 59 weeks – just three weeks shy of the record. This chart was introduced a little more than 25 years ago – on June 30, 2001 – which means it doesn’t include blockbuster soundtracks of previous eras, such as West Side Story, The Sound of Music, Doctor Zhivago, Saturday Night Fever and Purple Rain . Actually, it does include one – The Vince Guaraldi Trio ’s 1965 TV soundtrack, A Charlie Brown Christmas – but only because of its chart success since 2001. KPop Demon Hunters has been No. 1 for all but four of its 63 weeks on Top Soundtracks, having yielded for one week each to Wicked: For Good , the holiday perennial A Charlie Brown Christmas , Charli xcx ’s Wuthering Heights and the soundtrack to this year’s most-talked about TV miniseries, Heated Rivalry . Related Golden From KPop Demon Hunters Wins Best Original Song at 2026 Oscars, But Speech Is Cut Short With KPop Demon Hunters likely to set a new record for the most weeks at No. 1 on Top Soundtracks, we thought it would be a good time to look at the 12 soundtracks that have led the chart for 25 weeks or more. The list includes two TV soundtracks and 10 film soundtracks. Notably, the five soundtracks with the most weeks at No. 1 are all from animated films. Here are the 12 soundtracks that have logged the most weeks at No. 1 on Billboard ’s Top Soundtracks chart since the chart was introduced on June 30, 2001. The number in each header is the number of weeks the album has spent at No. 1. They are listed in ascending order.", "date_str": "2026-09-09T18:26:00+00:00", "hash": "7a0de0f47f0e3dd1", "title_fa": "«KPop Demon Hunters» به مدت 59 هفته در جدول موسیقی‌های متن برتر بیلبورد قرار گرفته است: تنها یک موسیقی متن فیلم طولانی‌تر شده است (فهرست کامل)", "summary_fa": "KPop Demon Hunters در چارت موسیقی متن برتر بیلبورد شکست خورده است و به مدت 59 هفته رهبری این لیست را داشته است - تنها سه هفته کمتر از رکورد. این نمودار کمی بیش از 25 سال پیش - در 30 ژوئن 2001 - معرفی شد - به این معنی که شامل موسیقی متن های پرفروش دوره های قبلی، مانند داستان West Side، The Sound of Music، Doctor Zhivago، Saturday Night Fever و Purple Rain نیست. در واقع، شامل یکی - موسیقی متن فیلم تلویزیونی وینس گوارالدی سه‌گانه در سال 1965، کریسمس چارلی براون - اما فقط به دلیل موفقیت در نمودار از سال 2001. KPop Demon Hunters برای همه به جز چهار هفته از 63 هفته‌اش در Top Soundtracks شماره 1 بوده است. ارتفاعات بادگیر Charli xcx و موسیقی متن مینی سریال تلویزیونی پرمحبوب ترین سریال امسال، Heated Rivalry. طلایی مرتبط از KPop Demon Hunters برنده بهترین آهنگ اصلی در اسکار 2026 شد، اما گفتار کوتاه شده است. این لیست شامل دو موسیقی متن تلویزیون و 10 موسیقی متن فیلم است. قابل ذکر است، پنج موسیقی متن با بیشترین هفته در رتبه 1، همه از فیلم های انیمیشن هستند. در اینجا 12 موسیقی متنی است که از زمان معرفی نمودار در 30 ژوئن 2001، بیشترین هفته ها را در رتبه 1 در جدول موسیقی متن برتر بیلبورد ثبت کرده اند. تعداد در هر سرصفحه تعداد هفته هایی است که آلبوم در شماره 1 سپری کرده است. آنها به ترتیب صعودی فهرست شده اند."}, {"source": "Billboard", "title": "Here’s the Host & Musical Guest for Every ‘Saturday Night Live’ Season Premiere", "link": "https://www.billboard.com/lists/saturday-night-live-host-and-musical-guest-every-season-premiere-episode/", "summary": "When host Jalen Brunson and musical guest KATSEYE take the stage at Studio 8H in New York for Saturday Night Live ’s Season 52 opener on Saturday (Sept. 26), they’ll join a long and star-studded lineage. We took a look back to see who was booked as host and musical guest on the first episodes of every previous season of the show. These are considered plum bookings: Viewers often make an extra effort to check out the first episode of a season. As a result, producers go all out to open the season with a strong episode. For SNL , that means booking a hot host and musical guest. Related KATSEYE, Turnstile, Rosalía and Gracie Abrams Tapped as Musical Guests For Saturday Night Live Season 52 They have definitely done that this year. KATSEYE has logged six top 40 hits on the Billboard Hot 100, topped by “Gabriela,” which reached No. 21. They received two Grammy nods for the ceremony earlier this year: best new artist and best pop duo/group performance for “Gabriela.” KATSEYE will become the first all-female group to be the musical guest on a season-opening episode of SNL. Brunson, the New York Knicks All-Star point guard and 2026 NBA Finals MVP, will become the third basketball star to host a season-opener, following Charles Barkley (1993) and LeBron James (2007). Legendary comedian George Carlin was host of the first episode on Oct. 11, 1975. There were two musical guests that night Billy Preston and Janis Ian both of whom had had big recent hits on the Billboard Hot 100 . Steve Martin has hosted four season-openers, more than anyone else. Tom Hanks is in second place, having hosted two season-openers. Ye (formerly Kanye West ) has been the musical guest on three season-openers, more than anyone else. The Rolling Stones and Miley Cyrus are the only performers who were both host and musical guest on a season-opener. If you’re ready to go back in time, here are the hosts and musical guests on the first episode of every SNL season.", "date_str": "2026-09-09T18:25:00+00:00", "hash": "e1a37e8f6d90fb63", "title_fa": "در اینجا میزبان و مهمان موزیکال برای هر اولین فصل «Saturday Night Live» است", "summary_fa": "وقتی Jalen Brunson میزبان و مهمان موسیقی KATSEYE در استودیو 8H در نیویورک برای افتتاحیه فصل 52 Saturday Night Live در روز شنبه (26 سپتامبر) روی صحنه می روند، آنها به یک سلسله طولانی و پر ستاره می پیوندند. نگاهی به گذشته انداختیم تا ببینیم چه کسی به عنوان میزبان و مهمان موزیکال در قسمت های اول هر فصل قبلی برنامه رزرو شده است. این‌ها رزرو آلو در نظر گرفته می‌شوند: بینندگان اغلب تلاش بیشتری برای تماشای قسمت اول یک فصل انجام می‌دهند. در نتیجه، تهیه کنندگان تمام تلاش خود را می کنند تا فصل را با یک قسمت قوی باز کنند. برای SNL، این به معنای رزرو یک میزبان داغ و مهمان موسیقی است. مرتبط KATSEYE، Turnstile، Rosalía و Gracie Abrams به عنوان مهمانان موزیکال برای Saturday Night Live فصل 52 آنها قطعا امسال این کار را انجام داده اند. KATSEYE شش 40 بازدید برتر را در Billboard Hot 100 به ثبت رسانده است که در صدر آن \"Gabriela\" قرار دارد که به رتبه 21 رسیده است. آنها در اوایل سال جاری دو جایزه گرمی دریافت کردند: بهترین هنرمند جدید و بهترین اجرای دو نفره/گروهی پاپ برای «گابریلا». KATSEYE اولین گروه کاملاً زن خواهد بود که مهمان موزیکال یک قسمت افتتاحیه فصل SNL خواهد بود. برانسون، گارد ستاره نیویورک نیکس و MVP فینال های NBA در سال 2026، پس از چارلز بارکلی (1993) و لبرون جیمز (2007) سومین ستاره بسکتبالی خواهد شد که میزبان یک فصل افتتاحیه است. جورج کارلین، کمدین افسانه ای، مجری قسمت اول در 11 اکتبر 1975 بود. در آن شب دو مهمان موسیقی حضور داشتند که بیلی پرستون و جانیس ایان هر دو موفق به کسب موفقیت های اخیر در Billboard Hot 100 شده بودند. استیو مارتین بیش از هر کس دیگری میزبان چهار فصل افتتاحیه بوده است. تام هنکس با میزبانی دو فصل افتتاحیه"}, {"source": "Billboard", "title": "A Full List of Current 2026-2027 Las Vegas Residencies (Updating)", "link": "https://www.billboard.com/culture/product-recommendations/current-las-vegas-residencies-shows-9654876/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. It s been a great year in live music with a number of hot tours and music festivals in the books. However, there s still plenty of time this year to go out and take in great live music performances and experiences, and there s no place hotter than Las Vegas. Some of music s biggest stars, such as Backstreet Boys , have extended their Las Vegas Sphere residencies with new dates, as well as other hot recording artists, including BLACKPINK S Lisa , Car n Le n, Metallica, Marc Anthony and others heading to Sin City in 2026. In fact, even The Eagles are back for one last run again. Related 25 Biggest Concert Residencies of All Time Here's How to Watch the 2026-27 NFL Season Live Online for Free 'SNL UK' Announces Musical Guests, Hosts For Opening Weeks of Season 2 Shop Las Vegas Residency Tickets at Ticketmaster Tickets to Las Vegas residencies first went on sale through Ticketmaster , while the retailer s Face Value Exchange program is an option for fans to resell tickets if they re unable to attend. However, residency dates have either sold out, or are very close to selling out, so one of the best ways to find tickets online is through third-party retailers, such as StubHub , SeatGeek , Vivid Seats , TicketNetwork , Gametime , Event Tickets Center and others. All retailers guarantee authentic tickets delivered in time before concerts start. Prices may also be above or below face value at times. Where to Find 2026-27 Las Vegas Residencies Tickets Online EDITOR'S PICK Find Las Vegas Residency Tickets at StubHub Buy TICKETS HERE Top choice for concert tickets in 2026. StubHub has Las Vegas residency tickets available . StubHub ensures that all tickets are valid and authentic, but for whatever reason, if they re not, you ll get your money back. In addition, if concerts are canceled and not rescheduled, you ll receive 120% in StubHub credit or be given the option of a full refund without the extra credit. BEST PRICES Find Las Vegas Residency Tickets at SeatGeek Buy TICKETS HERE use our discount code BILLBOARD10 to save an additional $10 at checkout. One of the lowest prices for Las Vegas residency tickets is at SeatGeek . Tickets are delivered digitally via email, so they re available on your phone before you go through security. An", "date_str": "2026-09-09T17:54:02+00:00", "hash": "b1303e6754d2100b", "title_fa": "فهرست کامل اقامتگاه های فعلی لاس وگاس 2026-2027 (در حال به روز رسانی)", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. سال بسیار خوبی در موسیقی زنده با تعدادی تورهای داغ و جشنواره های موسیقی در کتاب بود. با این حال، امسال هنوز زمان زیادی برای بیرون رفتن و اجرای موسیقی زنده و تجربه‌های عالی وجود دارد، و هیچ جایی داغ‌تر از لاس وگاس نیست. برخی از بزرگ‌ترین ستاره‌های موسیقی، مانند Backstreet Boys، اقامتگاه‌های خود در لاس‌وگاس Sphere را با تاریخ‌های جدید گسترش داده‌اند، و همچنین دیگر هنرمندان ضبط صدا، از جمله BLACKPINK S Lisa، Car n Le n، Metallica، Marc Anthony و دیگرانی که در سال 2026 به شهر گناه می‌روند. در واقع، دوباره برای The One Run بازگشته‌اند. مربوط به 25 بزرگترین اقامتگاه های کنسرت در تمام دوران در اینجا نحوه تماشای آنلاین فصل NFL 2026-27 به صورت زنده به صورت رایگان آمده است 'SNL UK' مهمانان موزیکال را اعلام می کند، میزبانان هفته های افتتاحیه فصل 2 بلیط های اقامتی لاس وگاس را بخرید، در حالی که اولین فروش Ticketmaster Tickets to Las از طریق Ticketmaster Tickets to Las انجام شد. برنامه تبادل ارزش اسمی خرده‌فروشان گزینه‌ای برای طرفداران است که اگر نتوانند در آن شرکت کنند، بلیت‌ها را بفروشند. با این حال، تاریخ های اقامت یا فروخته شده اند یا بسیار نزدیک به فروش هستند، بنابراین یکی از بهترین راه ها برای یافتن بلیط آنلاین از طریق خرده فروشان شخص ثالث است، مانند StubHub، SeatGeek، Vivid Seats، TicketNetwork، Gametime، مرکز بلیط رویداد و سایر موارد. همه خرده فروشان بلیط های معتبر را تضمین می کنند که به موقع قبل از شروع کنسرت تحویل داده می شوند. همچنین ممکن است گاهی اوقات"}, {"source": "Billboard", "title": "Karol G, Rod Wave, Ella Langley & More: Highlights of This Week’s Billboard Charts", "link": "https://www.billboard.com/lists/karol-g-rod-wave-ella-langley-chart-highlights-sept-12-2026/", "summary": "Today is new Billboard chart day! As all charts update each Tuesday, and on Wednesdays during holiday weeks, here’s a look at highlights of the latest rankings, dated Sept. 12 and reflecting the Aug. 28-Sept. 3 measurement week, according to data tracker Luminate. Among this week’s chart stars are Karol G , Rod Wave, Ella Langley, Ariana Grande, Shakira and Burna Boy. As previously reported , Karol G, Judeline and rusowsky’s “BbY WOW” hits No. 1 on both the Billboard Global 200 and Billboard Global Excl. U.S. charts. Karol G adds her second leader on the lists, after “TQG,” with fellow Colombian superstar Shakira, led in its debut week in March 2023. Judeline and rusowsky rule the charts for the first time. “BbY WOW” concurrently crowns Hot Latin Songs for a third week, marking Karol G’s longest-leading hit since “Si Antes Te Hubiera Conocido” tallied a personal-best 14 weeks at No. 1 beginning in July 2024. On the Billboard Hot 100 , “BbY WOW” bounds 29-16. It becomes Karol G’s third top 20 hit on the chart, following “TQG” (No. 7 peak, 2023) and “Mamiii,” with Becky G (No. 15, 2022). Meanwhile, “BbY WOW” parent album No Me Arrepiento de Sentir Tanto notches a fourth week at No. 1 on Top Latin Albums , having become Karol G’s fifth total and consecutive leading set. Check out more key highlights from this week’s Billboard charts below. For a deeper dive into all of the above and more, go to Billboard ’s Chart Beat hub, sign up for the weekly Chart Beat newsletter , among other e-blasts, and browse the full menu of Billboard ’s charts.", "date_str": "2026-09-09T17:31:46+00:00", "hash": "ea9aa7cfb89dfb48", "title_fa": "کارول جی، راد ویو، الا لنگلی و موارد دیگر: نکات برجسته نمودارهای بیلبورد این هفته", "summary_fa": "امروز روز جدید نمودار بیلبورد است! از آنجایی که همه نمودارها هر سه‌شنبه و چهارشنبه‌ها در هفته‌های تعطیل به‌روزرسانی می‌شوند، در اینجا نگاهی به نکات مهم آخرین رتبه‌بندی، در تاریخ 12 سپتامبر و منعکس‌کننده 28 اوت تا سپتامبر است. 3 هفته اندازه گیری، طبق ردیاب داده Luminate. از جمله ستارگان چارت این هفته می توان به کارول جی، راد ویو، الا لنگلی، آریانا گرانده، شکیرا و برنا بوی اشاره کرد. همانطور که قبلاً گزارش شده بود، \"BbY WOW\" کارول جی، جودلین و روسوفسکی به شماره شماره رسید. 1 در Billboard Global 200 و Billboard Global Excl. نمودارهای ایالات متحده کارول جی دومین رهبر خود را بعد از «TQG» به فهرست اضافه می‌کند، همراه با سوپراستار کلمبیایی شکیرا، که در هفته اول آن در مارس 2023 پیشتاز بود. جودلین و روسوفسکی برای اولین بار بر چارت‌ها حکمرانی می‌کنند. \"BbY WOW\" به طور همزمان برای سومین هفته تاج آهنگ Hot Latin Songs را به خود اختصاص داد و طولانی‌ترین موفقیت کارول جی را از زمانی که \"Si Antes Te Hubiera Conocido\" در ژوئیه 2024 در رده اول 14 هفته قرار گرفت را به خود اختصاص داد. در Billboard Hot 100، «BbY WOW» 29-16 کران دارد. پس از «TQG» (نمره 7 پیک، 2023) و «Mamiii» با بکی جی (شماره 15، 2022). در همین حال، آلبوم مادر «BbY WOW» No Me Arrepiento de Sentir Tanto برای چهارمین هفته در رتبه اول آلبوم‌های لاتین برتر قرار گرفت و به پنجمین مجموعه اصلی و متوالی کارول جی تبدیل شد. نکات مهم بیشتر از نمودارهای بیلبورد این هفته را در زیر بررسی کنید. برای بررسی عمیق‌تر همه موارد بالا و موارد دیگر، به مرکز بیلبورد Chart Beat بروید، در خبرنامه هفتگی Chart Beat، در میان دیگر e-blasts، ثبت‌نام کنید و منوی کامل نمودارهای Billboard را مرور کنید."}, {"source": "Billboard", "title": "EBiDAN’s ‘Yes! Tokyo’ Reclaims No. 1 on Japan Hot 100 as Sakanaction’s ‘Kaiju’ Surges on Single Release", "link": "https://www.billboard.com/music/chart-beat/ebidan-yes-tokyo-reclaims-number-1-japan-hot-100-1236336558/", "summary": "EBiDAN s Yes! Tokyo returns to No. 1 after three weeks to log its second week atop the Billboard Japan Hot 100 , on the chart released Sep. 9. Yes! Tokyo is EBiDAN’s 15th-anniversary single which features nine of its acts including Bullet Train, M!LK, and SUPER★DRAGON. Released Aug. 11, the track first topped the Japan Hot 100 on the list released Aug. 19. This week, the song moves 3-1 after topping sales for the second time with 87,129 copies sold. Cumulative sales have now surpassed 1.48 million copies. Yes! Tokyo also continues to rule video views and comes in at No. 2 for streaming. A run of television music program appearances, including NHK s Venue101 , helped push the overall point total to approximately 141% of last week s figure. Motoki Ohmori s Haiiro rises 12-2. The theme song for Hakucho to Komori — the film adaptation of Keigo Higashino s novel, starring Hokuto Matsumura and Mio Imada — received a boost from the release of special footage and a music video timed to the film s nationwide opening on Sep. 4, lifting the track to No. 1 for radio airplay and No. 4 for downloads. fav me s Nyan te Zurui no! debuts at No. 3 with No. 2 for sales. Last week s No. 1, =LOVE s Koi, Hajimemashita., falls to No. 4, and The World Standard (Wasuta) debuts at No. 5 with their new track Watta Life! King Prince s So Honey enters at No. 6 after the CD dropped Sep. 2. The track hits No. 2 on radio and tops downloads. Sakanaction s Kaiju surges 97-11 on the strength of the newly released CD single “Kaiju / Iranai” — with remixes by Cornelius and Takkyu Ishino (Denki Groove) — posting No. 6 on sales. Mrs. GREEN APPLE s Brand New sits at No. 7, continuing to lead streaming, followed by TOMORROW X TOGETHER s Setsuna Hanabi at No. 8, M!LK s Sukisugite Metsu! at No. 9, and Spitz s Mishiranu Ito at No. 10. The chart s mid-tier remained largely unchanged from last week, making this a notable week for turnover at the top. The Billboard Japan Hot 100 combines physical and digital sales, audio streams, radio airplay, video views and karaoke data. See the full Billboard Japan Hot 100 chart, tallying the week from Aug. 31 to Sept. 6, here . For more on Japanese music and charts, visit Billboard Japan’s English X account .", "date_str": "2026-09-09T17:18:37+00:00", "hash": "38c45594b12a3464", "title_fa": "EBiDAN 'بله! توکیو رتبه 1 را در هات 100 ژاپن به دست می‌آورد زیرا «کایجو» ساکاناکشن در تک‌ریشه افزایش می‌یابد.", "summary_fa": "EBiDAN بله! توکیو پس از سه هفته به رتبه 1 بازگشت تا دومین هفته خود را در صدر 100 بیلبورد داغ ژاپن، در نمودار منتشر شده در 9 سپتامبر ثبت کند. بله! توکیو تک آهنگ پانزدهمین سالگرد EBiDAN است که شامل 9 آهنگ از جمله Bullet Train، M!LK و SUPER★DRAGON است. این آهنگ که در 11 آگوست منتشر شد، برای اولین بار در صدر 100 آهنگ داغ ژاپن در لیست منتشر شده در 19 اوت قرار گرفت. این هفته، این آهنگ پس از فروش بالای 87129 نسخه برای دومین بار، 3-1 حرکت کرد. فروش تجمعی اکنون از 1.48 میلیون نسخه فراتر رفته است. بله! توکیو همچنان بر بازدیدهای ویدیویی حاکم است و در جایگاه دوم برای پخش است. مجموعه ای از برنامه های موسیقی تلویزیونی، از جمله NHKs Venue101، به افزایش امتیاز کلی به تقریباً 141 درصد از رقم هفته گذشته کمک کرد. Motoki Ohmori s Haiiro 12-2 صعود کرد. تم آهنگ Hakucho to Komori - اقتباس سینمایی از رمان کیگو هیگاشینو، با بازی هوکوتو ماتسومورا و میو ایمادا - با انتشار فیلم ویژه و یک موزیک ویدئو که زمان افتتاحیه فیلم در سراسر کشور در 4 سپتامبر بود، تقویت شد و آهنگ را به شماره 1 برای پخش رادیویی و شماره 4 برای دانلود ارتقا داد. دوست من s Nyan te Zurui نه! اولین بار در شماره 3 با شماره 2 برای فروش. هفته گذشته شماره 1، = LOVE s Koi، Hajimemashita.، به شماره 4 سقوط کرد و The World Standard (Wasuta) در رتبه اول قرار گرفت. 5 با آهنگ جدیدشان Watta Life! پس از انتشار CD در 2 سپتامبر، King Princes So Honey در شماره 6 قرار می گیرد. Sakanaction s Kaiju با قدرت تک‌آهنگ سی‌دی جدید منتشر شده «Kaiju / Iranai» - با ریمیکس‌هایی از Cornelius و Takkyu Ishino (Denki Groove) 97-11 افزایش یافت - شماره 6"}, {"source": "Billboard", "title": "KATSEYE, Turnstile, Rosalía and Gracie Abrams Tapped as Musical Guests For ‘Saturday Night Live’ Season 52", "link": "https://www.billboard.com/culture/tv-film/saturday-night-live-season-52-music-guests-katseye-turnstile-1236336442/", "summary": "KATSEYE are gearing up to make their debut as the musical guest on the first episode of Saturday Night Live s upcoming 52nd season. The show announced the lineup for the first four shows of the run on Wednesday morning (Sept. 9), revealing that 2026 NBA Finals MVP and New York Knicks star point guard Jalen Brunson will also notch a first when he hosts the Sept. 26 season debut. Related Here s the Host Musical Guest for Every Saturday Night Live Season Premiere Travis Garland Delivers Breathtaking Cover Of Ariana Grande s Dangerous Woman For AGT Quarterfinals: Watch From Candid to Iconic, Discover the Latest Collection of Rare Dolly Parton Photos Made for Your Wall Gallery It will be the K-pop girl group s first go-round performing in Studio 8H, but at press time it was unclear whether currently on-hiatus members Manon and Sophia will take the stage alongside Lara, Megan, Daniela and Yoonchae. Next up on Oct. 3 will be Dakota Johnson ( Verity ), returning for her third SNL hosting gig along with another first-time musical guest, Turnstile . Also gearing up for his third hosting slot is comedian Shane Gillis ( Tires ), who will anchor an episode featuring musical guest Rosalía , who last appeared on the show in March 2022. After a two-week break, the show will return for an October 31 Halloween episode hosted by first-timer Inde Navarrette, the breakout star of the indie horror film Obsession , who is also slated to star as Rogue in the upcoming X-Men movie and the Apple Studios sci-fi thriller The Waffle House Index . That episode will feature the second musical guest spot from Gracie Abrams . SNL received 11 Emmy nominations for its 51st season, extending its record as the most Emmy-nominated show in TV history (360) and most Emmy wins (114). The news about the upcoming SNL season came on the same day as its year-old spinoff, Saturday Night Live U.K., also set its host/musical guest lineup for the launch of its next season . The British version will kick off its second season on Saturday (Sept. 12) with host Jeff Goldblum and musical guest CMAT. The Sept. 19 episode will feature actor-comedian Jamie Demetriou ( Fleabag ) with rock duo Royal Blood, followed by Chicken Soup Date host Amelia Dimoldenberg and U.K. singer Rachel Chinouriri on Sept. 26. SNL is broadcast on NBC at 11:30 p.m. ET and streams live on Peacock.", "date_str": "2026-09-09T17:00:48+00:00", "hash": "5cfbc818f7ec7f9b", "title_fa": "KATSEYE، Turnstile، Rosalía و Gracie Abrams به عنوان مهمانان موزیکال فصل 52 «Saturday Night Live» انتخاب شدند", "summary_fa": "KATSEYE در حال آماده شدن برای اولین حضور خود به عنوان مهمان موزیکال در اولین قسمت از پنجاه و دومین فصل آینده Saturday Night Live هستند. این برنامه صبح روز چهارشنبه (9 سپتامبر) ترکیب چهار برنامه اول این دوره را اعلام کرد و فاش کرد که جالن برانسون، بهترین بازیکن فینال NBA 2026 و پوینت گارد ستاره نیویورک نیکس، اولین بار در اولین میزبانی فصل 26 سپتامبر خواهد بود. مرتبط در اینجا مهمان موزیکال میزبان برای هر شنبه شب است اولین فصل پخش زنده تراویس گارلند جلد نفس گیر از زن خطرناک آریانا گرانده برای مرحله یک چهارم نهایی AGT: تماشا کنید از Candid تا Iconic، کشف جدیدترین مجموعه عکس های کمیاب دالی پارتون. 8H، اما در زمان انتشار مشخص نبود که آیا اعضایی که در حال حاضر تعطیل هستند، Manon و Sophia در کنار لارا، مگان، دانیلا و یونچای روی صحنه خواهند رفت یا خیر. بعدی در 3 اکتبر داکوتا جانسون (Verity) خواهد بود که برای سومین کنسرت میزبانی SNL خود همراه با مهمان موسیقی دیگری به نام Turnstile که اولین بار است، بازخواهد گشت. همچنین کمدین شین گیلیس (تایرها) برای سومین میزبانی خود آماده می شود، که اپیزودی را با مهمان موزیکال روزالیا که آخرین بار در مارس 2022 در برنامه ظاهر شد، گوینده خواهد کرد. پس از یک وقفه دو هفته ای، سریال برای یک قسمت هالووین در 31 اکتبر به میزبانی ایند ناوارت، ستاره اصلی فیلم ترسناک مستقل Obsession، بازخواهد گشت که همچنین قرار است در نقش Rogue در فیلم آینده X-Men و تریلر علمی تخیلی استودیو اپل The Waffle House Index بازی کند. در آن قسمت دومین مهمان موسیقی از گریسی آبرامز پخش خواهد شد. SNL برای پنجاه و یکمین فصل خود 11 نامزدی امی دریافت کرد و رکورد خود را به عنوان بیشترین نامزدی امی در تاریخ تلویزیون (360) و بیشترین برنده امی (114)"}, {"source": "Deadline", "title": "Emmys Poised For ‘Charlie’s Angels’ & ‘Buffy’ Reunions’; First Batch Of Presenters Also Includes Zendaya & Sally Field", "link": "https://deadline.com/2026/09/emmy-presenters-2026-charlies-angels-buffy-reunions-zendaya-1237072654/", "summary": "NBC and the Television Academy have announced the first group of presenters set to join host Mariska Hargitay on stage at the 78th Emmy Awards on September 14. It includes Kate Jackson, Jaclyn Smith and Cheryl Ladd, stars of the classic 1976 series Charlie s Angels, likely reuniting to mark the show s 50th anniversary. The list [ ]", "date_str": "2026-09-09T20:00:51+00:00", "hash": "cc684652fcaae159", "title_fa": "امی آماده برای «فرشتگان چارلی» و «بافی» تجدید دیدار»؛ اولین دسته از ارائه دهندگان همچنین شامل Zendaya & Sally Field است", "summary_fa": "NBC و آکادمی تلویزیون اولین گروه از مجریان را اعلام کردند که قرار است در هفتاد و هشتمین دوره جوایز امی در 14 سپتامبر به مجری برنامه ماریسکا هارگیتای روی صحنه بپیوندند. این گروه شامل کیت جکسون، جاکلین اسمیت و شریل لد، ستارگان سریال کلاسیک فرشتگان
