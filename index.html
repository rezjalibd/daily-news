s, Republic Records, Capitol Records and more — a continuation of its layoffs, which kicked off back in 2024. Still, Universal is far from the only music company culling employees this year. “We need to dive into the fact that layoffs have become common in this industry,” Maiale tells Billboard. At the jump.global summit, which focuses on executive development, mental health and leadership skills for music professionals, Maiale preaches the gospel that every modern careerist should be in the “business of your first and last name.” At the conference, his name tags are just that — name tags. No company names and no titles are listed to create a level playing field. Related Universal Music Shakeup: Def Jam, Polydor, Interscope Execs to Exit as Company Completes 2024 Restructure Plan Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Instead, he wants attendees to be focused on getting to know each other on a human level. Even his panelists, some of whom bear impressively high ranking titles at major companies, don’t tout their credentials either. Every speaker is vaguely listed on the jump.global website as simply a “music business human.” Those who attend the three-day affair, which is part conference and part leadership retreat, are treated to a mix of small group break outs and panel, featuring names like Janelle Lopez Genzink, Stephen Brower, Jason Feinberg, Lexi Todd and Moody Jones. And while the summit has always been known to hand out free badges for people who have newly been laid off as a courtesy, Maiale says that, due to increased demand for these comped badges, he’s now upping the supply. This year, he estimates that 30% of attendees are laid-off employees looking for their next move. The other 70% are a mix of folks sent by their companies, folks who buy badges themselves and executive coaches. While Maiale is going to address layoffs and how work in the music industry is changing, he clarifies: “The conference is definitely not a place where people come simply to complain about how the music industry is doing. What we want to do is be solutions-focused and opp", "date_str": "2026-10-26T16:00:00+00:00", "hash": "2a751eddc5e9a76b", "title_fa": "اخراج ها در حال تغییر شکل صنعت موسیقی هستند. jump.global می‌خواهد مدیران اجرایی را برای آینده آموزش دهد", "summary_fa": "چهارمین اجلاس سالانه jump.global در لس آنجلس تنها چند هفته باقی مانده است، در تاریخ 8 تا 10 نوامبر و بنیانگذار آن، نیک مایال، متقاعد شده است که زمان بندی آن نمی تواند ضروری تر باشد. همین چند هفته پیش، گروه موسیقی یونیورسال کاهش قابل توجهی در کارکنان خود در شرکت‌های ضبط موسیقی مانند MCA، Def Jam Records، Republic Records، Capitol Records و موارد دیگر ایجاد کرد - ادامه اخراج‌هایش که در سال 2024 آغاز شد. Maiale به Billboard می گوید: «ما باید به این واقعیت بپردازیم که اخراج کارکنان در این صنعت رایج شده است. در اجلاس jump.global، که بر توسعه اجرایی، سلامت روان و مهارت‌های رهبری برای متخصصان موسیقی تمرکز دارد، Maiale این انجیل را موعظه می‌کند که هر حرفه‌ای مدرن باید در \"کسب و کار نام و نام خانوادگی شما\" باشد. در کنفرانس، برچسب‌های نام او دقیقاً همین است - برچسب‌های نام. هیچ نام شرکت و هیچ عنوانی برای ایجاد یک زمین بازی درج نشده است. تکان دادن موسیقی جهانی مرتبط: مدیران دف جم، پلی‌دور، اینترسکوپ با تکمیل طرح بازسازی سال 2024 از شرکت خارج می‌شوند. دیگر در سطح انسانی حتی اعضای میزگرد او، که برخی از آنها عناوین فوق‌العاده بالایی در شرکت‌های بزرگ دارند، اعتبار خود را نیز تبلیغ نمی‌کنند. هر سخنران به طور مبهم در وب سایت jump.global به عنوان یک \"انسان تجارت موسیقی\" فهرست شده است. کسانی که در این ماجرای سه روزه شرکت می‌کنند، که بخشی از کنفرانس و بخشی از نشست رهبری است، با ترکیبی از گروه‌های کوچک استراحت و میزگرد، با نام‌هایی مانند جانل لوپز گنزینک، استفان بروور، جیسون فاینبرگ، لکسی تاد و مودی جونز پذیرفته می‌شوند. و در حالی که اجلاس همیشه به اهدای نشان های رایگان برای افرادی که به تازگی اخراج شده اند، شناخته شده است، Maiale می گوید که به دلیل افزایش تقاضا برای این ن Light, the theme song for the James Bond video game of the same name. She hasn t been doing many live performances as she continues perfecting her highly anticipated country album Stove , but Del Rey did recently perform at the F1 Grand Prix in Singapore. I can’t even tell you how happy we were to be there, thank you so much for showing up and getting us so excited, she wrote Friday (Oct. 23) on Instagram after the show. And to my amazing crew, band, singers dancers, etc. we really did it. I loved our rehearsals loved the show and everything that we did afterwards. Hope everybody is doing well, sending love.", "date_str": "2026-10-26T15:32:09+00:00", "hash": "8baa5381e56d648c", "title_fa": "لانا دل ری هنگام گوش دادن به تیت مک‌ری به غریبه کمک می‌کند «تلاش می‌کند از یک رابطه توهین‌آمیز دور بماند»", "summary_fa": "لانا دل ری در یک لحظه اخیر با موسیقی متن فیلم تیت مک ری به یک غریبه در لس آنجلس کمک کرد. مطالب مرتبط لانا دل ری با تم سورپرایز 007 برای اولین بازی ویدیویی لایت پس از کنسرت F1 سنگاپور به دنیای جیمز باند می پیوندد، لانا دل ری به بازدیدی دیگر از آسیا اشاره می کند لانا دل ری آهنگ جدیدی را که با همسر جرمی دوفرن نوشته شده درباره وودو در ازدواجشان منتشر شده است. 25) در استوری اینستاگرام خود نشان می دهد که در هنگام رانندگی شبانه در ماشین در حال گوش دادن به موسیقی است. دل ری در حالی که آهنگ 2021 رابربند مک‌ری را به صدا در می‌آورد، متوجه شخصی بیرون از پنجره می‌شود. وقتی در حال گوش دادن به آهنگ تیت در مورد هایلند هستید، وقتی پشت چراغ هایلند نشسته اید و زنی تابلویی را روی پنجره شما می چسباند که می گوید سعی می کنید از یک رابطه توهین آمیز دوری کنید، او در متنی که روی کلیپ تایپ شده توضیح داد. سپس این ویدئو نشان می‌دهد که دل ری دستش را در کیفش می‌برد و مبلغی معادل 100 دلار برای آن زن می‌دهد. از پنجره باز می گوید، وقتی داشتم فیلم می گرفتم، مرا گرفتی. سعی کن دوری کنی مراقب باشید. Rubberband در EP Too Young to Be Sad McRae ظاهر می شود. رانندگی در نیمه‌شب، دویدن در هایلند/ آیا این مرا مجرم می‌کند؟/ که تو را رها کردم/ که ما را شکستم و رفتم، او در پیست می‌خواند. تعامل دل ری با غریبه نیازمند در حالی صورت می گیرد که خواننده و ترانه سرای آلت پاپ در حال ستایش Lies است، همکاری جدید او با زک برایان که در 15 اکتبر در پروژه هشت آهنگی مرد جوانی و سایر اعضای اهدایی او به پایان رسید. دل ری همچنین به تازگی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/02/P101SEZ1-e1770489259722.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۴ آبان • ۱۹:۰۲"}, {"source": "Billboard", "title": "Sharon Osbourne Visits Late Husband Ozzy’s Grave Every Day: ‘You Never Get Over It’", "link": "https://www.billboard.com/music/rock/sharon-osbourne-visits-ozzy-osbourne-grave-every-day-1236367859/", "summary": "It s been more than a year since Ozzy Osbourne shuffled off this mortal coil. But according to the late heavy metal icon s wife/manager, Sharon Osbourne, she still visits the Blizzard of Oz every day. You ve lost the love of your life, so you don t just wake up and go, I m fine now. I m cured. You never get over it. But you learn to live with it, and that s what I m trying to do. So you either sit in a room and don t come out, or you accept it, befriend it, and that s it, Sharon Osbourne told the BBC . Sharon said the family collected all the cards and messages left at public memorials in Ozzy s hometown of Birmingham, England, as well as the floral tributes left behind by the thousands who attended the Rock Roll Hall of Famer s public funeral procession in his hometown on July 30, 2025 following his death on July 22 at age 76. The items have been sorted and photographed, while the flowers were composted into the family garden at their 250-acre private estate, Welders House, in Buckinghamshire. There was no way I could put Ozzy in a public graveyard, said Sharon. I ve seen what happens to other people in the public eye. There s no peace because people want to come and they want to pay their respects. That s an ongoing thing, and I wanted Ozzy to rest and just be. Asked how often she visit s Ozzy s grave, Sharon said, of course, every day. I can see him from my window. Sharon said she also talks to her late husband of half a century regularly, though she declined to reveal what they discuss. Sharon also described the elation Ozzy felt when, against his doctor s wishes, he was able to play one last triumphal show, the all-star Back to the Beginning blow-out , at his beloved Villa park football pitch in his hometown of Birmingham. Though back problems and Parkinson s disease symptoms had made it impossible for Ozzy to tour in his later years, Sharon said after the one-off swan song gig the Prince of Darkness was riding high. He was just so, so happy, she said of his mood after the 11-hour show that featured him performing solo and with Black Sabbath, as well as tributes from Metallica, Slayer, Guns N Roses, Pantera, Tool and many more. He was online going through the reviews and saying, There s something terribly wrong, and I m like, why? , she remembered. He goes, I didn t get slagged by anybody. Why are people being nice to me? And I m like, Because they like you,' she told him.", "date_str": "2026-10-26T15:15:43+00:00", "hash": "6a91e5bec96e0846", "title_fa": "شارون آزبورن هر روز از قبر همسر مرحوم آزی بازدید می کند: \"تو هرگز از آن عبور نمی کنی\"", "summary_fa": "بیش از یک سال از زمانی که آزی آزبورن این سیم پیچ فانی را کنار زد، می گذرد. اما به گفته همسر/مدیر مرحوم هوی متال، شارون آزبورن، او همچنان هر روز از بلیزارد آز بازدید می کند. تو عشق زندگیت را از دست دادی، پس بیدار نشو و برو، من الان خوبم. من درمان شده ام شما هرگز از آن عبور نمی کنید. اما شما یاد می گیرید که با آن زندگی کنید، و این چیزی است که من سعی می کنم انجام دهم. شارون آزبورن به بی‌بی‌سی گفت، پس یا در یک اتاق می‌نشینید و بیرون نمی‌آیید، یا آن را می‌پذیرید، با آن دوست می‌شوید، و همین. شارون گفت که خانواده تمام کارت‌ها و پیام‌هایی را که در یادبودهای عمومی در زادگاه اوزی در بیرمنگام، انگلستان به جا مانده بود، و همچنین ادای احترام به گل‌هایی که هزاران نفر در مراسم تشییع جنازه عمومی راک رول تالار مشاهیر در زادگاهش در 30 ژوئیه 2025 پس از مرگ او در 22 ژوئیه در سن 76 سالگی به جا مانده بودند، جمع آوری کردند. این اقلام مرتب شده و از آنها عکس گرفته شده است، در حالی که گل ها در باغ خانوادگی در املاک خصوصی 250 هکتاری آنها، Welders House، در باکینگهامشر کمپوست شده اند. شارون گفت، هیچ راهی وجود نداشت که بتوانم آزی را در یک قبرستان عمومی قرار دهم. من دیده ام که چه اتفاقی برای افراد دیگر در چشمان عمومی می افتد. هیچ آرامشی وجود ندارد زیرا مردم می خواهند بیایند و می خواهند به آنها احترام بگذارند. این یک چیز مداوم است، و من می خواستم آزی استراحت کند و فقط باشد. شارون در پاسخ به این سوال که چند بار به قبر اوزی می‌رود، گفت که البته هر روز. من می توانم او را از پنجره ام ببینم. شارون گفت که او همچنین به طور", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/458700520-e1793025876222.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۴ آبان • ۱۸:۴۵"}, {"source": "Billboard", "title": "‘CMA Presents I Will Always Love You: A Celebration of Dolly Parton’ Earns Nearly 5 Million Viewers", "link": "https://www.billboard.com/culture/tv-film/cma-dolly-parton-tribute-show-viewers-1236367786/", "summary": "Several artists joined forces for CMA Presents I Will Always Love You: A Celebration of Dolly Parton on Oct. 21 to pay homage to the late Country Music Hall of Famer (and Dollywood s Dreamer in Chief) Dolly Parton , who passed away in August. The star-studded event featured performances from artists including Reba McEntire, Brad Paisley, Ella Langley, Darius Rucker, Lady A and Zac Brown, delivered 4.74 million total viewers on ABC and Disney+. According to a press release, the presentation ranked No. 1 in total viewers from 9 to 11 p.m. with 4.74 million. The music special also earned ABC its best Wednesday 9-11 p.m. performance in 2026, based on entertainment programming. The event was held at Belmont University s Fisher Center for the Performing Arts in Nashville. Following the special s airing, the CMA, in collaboration with Belmont University, The Walt ه است، با توجه به تورم در 33 سال تنظیم شده است.) این اولین پروژه تحت قرارداد جدید Robinov با نتفلیکس است. رئیس سابق کمپانی برادران وارنر، فرنچایزهای میلیارد دلاری مانند سه گانه شوالیه تاریکی و خماری را پشت سر گذاشته است. ریوز موقعیت خود را به عنوان یک ستاره اکشن از طریق فرنچایزهایی مانند The Matrix و John Wick تثبیت کرده است. سال گذشته، او اولین بازی خود را در برادوی در Waiting for Gadot در کنار الکس وینتر، همبازی اش در بیل تد انجام داد. او در حال حاضر در حال مذاکره برای رهبری فیلم بعدی جیمز وان «The Gangster, The Cop, The Devil» برای پارامونت است و در سال 2027 در «Sonic the Hedgehog 4» نقش صدای خود را در نقش Shadow تکرار خواهد کرد.", "image_url": "https://variety.com/wp-content/uploads/2025/10/P102KIRG.jpg?crop=0px%2C51px%2C2000px%2C1125px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما", "نتفلیکس"], "datetime_fa": "۴ آبان • ۱۹:۱۶"}, {"source": "Variety", "title": "‘The Mandalorian and Grogu’ Gets Behind-the-Scenes Book Featuring Original Sketches, Concept Art and Cast Interviews", "link": "https://variety.com/2026/shopping/news/mandalorian-and-grogu-book-sketches-concept-art-buy-online-1236931239/", "summary": "Star Wars fans are getting a closer look at how Din Djarin and Grogu made the jump from Disney+ to the big screen. The Art of Star Wars: The Mandalorian and Grogu, a new 256-page hardcover from Abrams Books, arrives Nov. 3, offering an inside look at the creative process behind Lucasfilm s latest theatrical release. [ ]", "date_str": "2026-10-26T15:29:09+00:00", "hash": "9fae93f20f2f4042", "title_fa": "کتاب «ماندالوریان و گروگو» با طرح‌های اصلی، هنر مفهومی و مصاحبه‌های بازیگران در پشت صحنه قرار می‌گیرد.", "summary_fa": "طرفداران جنگ ستارگان در حال بررسی دقیق‌تر نحوه پرش دین جارین و گروگو از دیزنی پلاس به صفحه نمایش بزرگ هستند. The Art of Star Wars: The Mandalorian and Grogu، جلد گالینگور جدید 256 صفحه ای از Abrams Books، در 3 نوامبر وارد بازار می شود و نگاهی درونی به فرآیند خلاقانه پشت آخرین اکران سینمایی Lucasfilm it arts and culture organization that is focused on championing independent filmmakers and content creators are: Beverly Hills-based entertainment [ ]", "date_str": "2026-10-26T15:22:50+00:00", "hash": "d6e275d9b59d2751", "title_fa": "NewFilmmakers L.A. اعضای جدید هیئت مدیره را به عنوان شرکای غیرانتفاعی جشنواره فیلم شارجه معرفی کرد (انحصاری)", "summary_fa": "NewFilmmakers لس آنجلس چهار عضو هیئت مدیره جدید را معرفی کرده و یک شراکت استراتژیک در امارات متحده عربی با شارجه بین المللی ایجاد کرده است. جشنواره فیلم کودک و نوجوان. پیوستن به هیئت مدیره سازمان غیرانتفاعی هنری و فرهنگی که بر حمایت از فیلمسازان مستقل و تولیدکنندگان محتوا متمرکز است عبارتند از: سرگرمی مبتنی بر بورلی هیلز [ ] NFMLA در حال گسترش دامنه بین المللی خود به امارات متحده عربی است. لری لابو، یکی از بنیانگذاران و مدیر اجرایی NFMLA در بیانیه ای. محبوب در تنوع، هر یک از این افراد در حالی که درک عمیقی از فرصت‌ها و چالش‌هایی که صنعت ما را شکل می‌دهند، شغلی چشمگیر ایجاد کرده‌اند. همزمان با این انتصابات هیئت مدیره، NFMLA همکاری جدیدی با شارجه بین المللی ایجاد کرده است. جشنواره فیلم کودکان و نوجوانان، در اقدامی که برنامه‌های بین‌المللی و مبادلات فرهنگی خود را در امارات متحده عربی گسترش می‌دهد. این مشارکت در طول دوره جاری جشنواره در سال 2026، که از 25 اکتبر تا 1 نوامبر در شارجه، که به عنوان پایتخت فرهنگی امارات متحده عربی شناخته می شود، برگزار می شود. این جشنواره که اکنون در سیزدهمین دوره خود قرار دارد، فیلم هایی را از تایلند، برزیل، هند، ایتالیا و سراسر جهان عرب با فهرستی از عناوین جشنواره های بین المللی، فیلمسازان نوظهور و استعدادهای اماراتی به امارات آورده است. Laboe اظهار داشت: یکی از جذاب‌ترین جنبه‌های کار ما در NFMLA این است که ببینیم فیلمسازان از پیشینه‌ها و بخش‌های مختلف جهان چگونه از طریق داستان‌هایشان با هم ارتباط برقرار می‌کنند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/NFMLA-New-Board-Graphic-2026-1000x677-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آبان • ۱۸:۵۲"}, {"source": "Variety", "title": "How ‘You Can See Everyt to hear which of them will take home the award for new artist of the year, they should keep in mind that this is just the start of their journey. If they’re lucky, their careers will continue for decades, and if they’re really lucky, they’ll one day be enshrined in the Country Music Hall of Fame. The CMA introduced the Horizon Award – the award’s original name — in 1981; it was renamed new artist of the year in 2008. Since then, 14 artists who were nominated in that category have gone on to be inducted into the Country Music Hall of Fame. The most recent case is Tim McGraw , who was nominated for the Horizon Award in 1994 and was elected to the Country Music Hall of Fame this year. Related Tim McGraw, Paul Overstreet Stanley Brothers Inducted Into Country Music Hall of Fame You may have noticed that I said McGraw was nominated for the Horizon Award. He didn’t win. He’s not alone in that. Nine of the 14 artists who were nominated for the Horizon Award and went on to be inducted into the Hall of Fame didn’t win the newcomer award. Patty Loveless was nominated twice and lost both times – to Ricky Van Shelton in 1988 and to Clint Black in 1989. (Neither of those men has yet been inducted into the Country Music HOF, though they may be in the future.) Moral of the story: If you’re nominated for a new artist award and don’t win, keep going. There are many chapters ahead of you. Garth Brooks was inducted into the Country Music Hall of Fame just 22 years after he was nominated for (and won) the Horizon Award – the fastest climb of any artist. Other artists who made this climb quickly are George Strait (23 years), Kenny Chesney (26 years) and Alan Jackson and Brooks Dunn (27 years each). Here’s a complete list of the 14 artists who were nominated for the CMA’s Horizon Award and went on to be inducted into the Country Music Hall of Fame. We show the year they were nominated for (and in some cases, won) the award; the year they were inducted into the Country Music Hall of Fame, their number of CMA Awards to date; their number of No. 1 hits on Billboard ’s Hot Country Songs chart to date; and their number of No. 1 albums on Billboard ’s Top Country Albums chart to date. We’ll update this list in years to come as more Horizon Award, and eventually new artist of the year", "date_str": "2026-10-26T14:58:04+00:00", "hash": "8bc776e70d54994c", "title_fa": "از نامزدهای جایزه هنرمند جدید CMA تا تالار مشاهیر موسیقی کشور: 14 هنرمندی که سفر را انجام دادند", "summary_fa": "در حالی که اوری آنا، کارتر فیث، امیلی آن رابرتز، تاکر وتمور و استفن ویلسون جونیور در 18 نوامبر در سالن بریجستون نشویل آرنا برای جوایز CMA امسال نشسته‌اند و مشتاقانه منتظر شنیدن این هستند که کدام یک از آنها جایزه هنرمند جدید سال را به خانه می‌برند. اگر آنها خوش شانس باشند، کارشان برای دهه ها ادامه خواهد داشت، و اگر واقعا خوش شانس باشند، روزی در تالار مشاهیر موسیقی کانتری ثبت خواهند شد. CMA جایزه Horizon - نام اصلی جایزه - را در سال 1981 معرفی کرد. در سال 2008 به عنوان هنرمند جدید سال تغییر نام داد. از آن زمان، 14 هنرمندی که در آن بخش نامزد شده بودند، به تالار مشاهیر موسیقی کشور راه یافتند. جدیدترین مورد تیم مک‌گرو است که در سال 1994 نامزد جایزه Horizon شد و امسال به عنوان تالار مشاهیر موسیقی کشور انتخاب شد. مرتبط تیم مک‌گرو، پل اورستریت برادران استنلی به تالار مشاهیر موسیقی کانتری راه یافتند شاید متوجه شده باشید که گفتم مک‌گرو نامزد جایزه Horizon شده است. او برنده نشد او در آن تنها نیست. 9 هنرمند از 14 هنرمندی که برای جایزه Horizon نامزد شده بودند و به تالار مشاهیر راه یافتند، جایزه تازه وارد را دریافت نکردند. پتی لاولس دو بار نامزد شد و هر دو بار شکست خورد - به ریکی ون شلتون در سال 1988 و به کلینت بلک در سال 1989. (هیچ‌کدام از آن‌ها هنوز به HOF موسیقی کانتری معرفی نشده‌اند، اگرچه ممکن است در آینده باشند.) اخلاقیات داستان: اگر نامزد جایزه هنرمند جدیدی هستید و برنده نمی‌شوید، ادامه دهید. فصل های زیادی پیش روی شماست. گارث بروکس تنها 22 سال پس از نامزدی (و برنده شدن) جایزه Horizon - سریعترین صعود در بین هر هنرمندی - وارد تالار مشاهیر موسیقی کانتری شد. هنرمندان دیگری که به سرعت این صعود gh — Dictionary.com’s Word of the Year Is Maxxing", "link": "https://www.rollingstone.com/culture/culture-news/maxxing-dictionary-word-of-the-year-online-slang-1235645450/", "summary": "Representatives for the online thesaurus say they chose the word to \"capture a society that’s deeply online and focused on optimization in all forms\"", "date_str": "2026-10-26T12:15:00+00:00", "hash": "44cd66f7db213058", "title_fa": "چون همه ما به اندازه کافی خسته نبودیم - کلمه سال Dictionary.com Maxxing است", "summary_fa": "نمایندگان اصطلاحنامه آنلاین می گویند که آنها این کلمه را برای \"تسخیر جامعه ای عمیقا آنلاین و متمرکز بر بهینه سازی در همه اشکال\" انتخاب کرده اند. Dictionary.com در حال افزایش است. اصطلاحنامه آنلاین روز دوشنبه اعلام کرد که بر روی کلمه سال خود قرار گرفته است: \"maxxing\". این شرکت می‌گوید این کلمه برای «تسخیر جامعه‌ای که عمیقاً آنلاین است و بر بهینه‌سازی در همه اشکال تمرکز دارد» انتخاب شده است. بر اساس داده های تجزیه و تحلیل شده توسط Dictionary.com، استفاده از جمله جستجوی این عبارت در سال 2026 1000 درصد افزایش یافته است. برندگان گذشته شامل روند ویروسی \"6-7\"، \"دمور\" و \"توهم\" بودند. استیو جانسون، مدیر فرهنگ‌شناسی گروه رسانه دیکشنری، در بیانیه‌ای گفت: «Maxxing به دلیل تطبیق‌پذیری‌اش منحصربه‌فرد است و به عنوان یک فعل مستقل و یک اصلاح‌کننده محبوب است. \"این نشان دهنده تمایل سال 2026 برای پیشبرد همه چیز و نیاز به مسخره کردن خودمان در زمانی که بهینه سازی زندگی شروع به احساس پوچ می کند.\" این اصطلاح برای اولین بار در محافل بازی با \"min-maxing\" استفاده شد، یک استراتژی که در آن گیمرهای رومیزی و نقش آفرینی (RPG) تمام تمرکز خود را بر بهینه سازی یکی از مهارت های خاص شخصیت خود، مانند قدرت یا سرعت، به حداقل رساندن نیاز به سایر ویژگی های اضافی مانند عقل یا شانس می گذارند. این محبوبیت - و املای تفسیری آن - در محافل incel و manosphere از دهه 2010 به دست آورد، جایی که مردان جوان اغلب بهترین شیوه‌ها را برای \"looksmaxx\" مورد بحث قرار می‌دهند، یا خود را جذاب‌تر می‌کنند و تعداد شرکای جنسی خود را افزایش می‌دهند.", "image_url": "https://www.rollingstone.com/wp-content/uploads/     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
