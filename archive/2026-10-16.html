ست اظهار نظر پاسخ نداد. علی‌رغم تمام توجه‌هایی که به هک OpenAI از Hugging Face و بسیاری از"}, {"source": "Wired", "title": "Upgrade Your Thermostat for Winter With This Ecobee Deal for $120", "link": "https://www.wired.com/story/ecobee-fall-sale-2026/", "summary": "You don’t need the fanciest model to make your heating routine smarter. A refurbished Ecobee we love is just $120 through October 21.", "date_str": "2026-10-15T19:00:49+00:00", "hash": "010f86765f827a61", "title_fa": "با این تخفیف Ecobee به قیمت 120 دلار، ترموستات خود را برای زمستان ارتقا دهید", "summary_fa": "برای هوشمندتر کردن روال گرمایشی خود به شیک ترین مدل نیاز ندارید. یک Ecobee مرمت شده که دوستش داریم تا 21 اکتبر فقط 120 دلار است. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان Psst—من به عنوان یک ویرایشگر خانه هوشمند به شما اجازه می دهم در مورد یک راز کوچک صحبت کنید. با وجود اینکه اکنون صاحب ترموستات هوشمند Ecobee Premium (260 دلار) هستم که بسیار مورد تحسین قرار گرفته است، من هشت سال یک Ecobee3 Lite داشتم و به همان اندازه آن را دوست داشتم. این همه آن چیزی است که برای داشتن یک ترموستات هوشمند نیاز دارید، بدون افزودنی‌های عجیب و غریب که هرگز از آنها استفاده نخواهید کرد، مانند تشخیص اشغال و یک بلندگوی داخلی برای پخش پادکست. (مگر اینکه مرتباً در ترموستات خود به Uncanny Valley گوش دهید، در این صورت، این کار را می کنید.) اگر می خواهید اختلاف دما را در طبقات خانه خود تقسیم کنید، Ecobee3 Lite دارای صفحه نمایش لمسی و کنترل برنامه است و با سنسورهای Ecobee سازگار است. با این حال، بسیاری از مردم به سادگی می خواهند بتوانند ترموستات خود را از تلفن خود روشن و خاموش کنند و توانایی تنظیم زمان بندی را داشته باشند. برای این کار، Lite شما را تحت پوشش قرار داده است. عکس: Kat Merck ذخیره در لیست علاقه مندی ها ذخیره در لیست علاقه مندی ها Ecobee اگرچه به طور رسمی به Essential تغییر نام داده است و اکنون 140 دلار قیمت دارد، OG Lite هنوز مستقیماً از Ecobee بازسازی شده در دسترس است. در طول فروش پاییز این برند، فقط 120 دلار با ارسال رایگان قیمت دارد - و با همان ضمانت سه ساله مدل جدید ارائه می شود. اگر می‌خواهید ترموستات خود را ارتقا دهید اما Prime Day را از دست داده‌اید و نمی‌خواهید تا"}, {"source": "Wired", "title": "White House Press Secretary Katie Zacharia Was an Affiliate Marketer for a Fitness MLM", "link": "https://www.wired.com/story/white-house-press-secretary-katie-zacharia-was-an-affiliate-marketer-for-a-fitness-mlm/", "summary": "Trump’s newly installed press secretary tells WIRED that in the early 2010s, she promoted a product for a company then called Beachbody, which she described as “sort of a pyramid scheme.”", "date_str": "2026-10-15T17:05:19+00:00", "hash": "575df0ab1af29482", "title_fa": "کتی زاخاریا، سخنگوی کاخ سفید، یک بازاریاب وابسته برای یک فیتنس MLM بود.", "summary_fa": "منشی مطبوعاتی تازه نصب شده ترامپ به WIRED می‌گوید که در اوایل دهه 2010، او محصولی را برای شرکتی به نام Beachbody تبلیغ کرد که به‌عنوان «یک نوع طرح هرمی» توصیف کرد. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان از اولین حضورش در پشت تریبون این هفته، گذشته کیتی زاخاریا، سخنگوی کاخ سفید، روز به روز تیره‌تر شده است. بررسی سیمی شبکه های اجتماعی حذف شده و پروفایل های شبکه های حرفه ای به روشن شدن حداقل یک راز کمک کرده است. رزومه آنلاین زکریا شکافی را از سال 2013 تا اواخر سال 2023 نشان می دهد. برای بخشی از آن زمان، او به عنوان یک شرکت وابسته به Beachbody، یک شرکت تناسب اندام که یک عملیات بازاریابی چند سطحی را اجرا می کرد، کار می کرد که او به WIRED به عنوان «نوعی طرح هرمی» توصیف می کند. پیشینه زکریا قبل از ظهور او به عنوان یک عامل جناح راست و کارشناس در سال های اخیر موضوع کنجکاوی شدید بوده است. او قبل از پیوستن به تیم مطبوعاتی کاخ سفید، سخنگوی وزارت امنیت داخلی، مشاور ارتباطات در شرکت رسانه ای رئیس جمهور دونالد ترامپ و مفسر در نیوزمکس و فاکس نیوز بود. بخش‌های دیگری از سوابق حرفه‌ای او، به‌ویژه کار حقوقی‌اش، مورد بررسی قرار گرفته است. به گفته لینکدین او، زاخاریا در بین سال‌های 2011 تا 2013 یکی از همکاران شرکت حقوقی ژونگ لون، که در چین به عنوان یک شرکت رده بالای \"دایره قرمز\" شناخته می‌شود، بوده است. او همچنین در لینکدین خود را به عنوان مشاور عمومی برای سازمان غیرانتفاعی فیکس کالیفرنیا معرفی می کند. با این حال، پرونده‌های مالیاتی بررسی‌شده توسط WIRED نشان می‌دهد که زکریا به جای کار کردن به‌عنوان مشاور عمومی فیکس کالیفرنیا، در واقع یک جمع‌آوری کمک مالی برای سازمان غیرانتفاعی بوده است."}, {"source": "MIT Tech Review", "title": "The Download: failed social media bans, and extending pets’ lives", "link": "https://www.technologyreview.com/2026/10/16/1146864/the-download-failed-social-media-bans-and-extending-pets-lives/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. Kids are outsmarting social media bans. That’s not a problem we need to solve. —Michal Luria, Aliya Bhatia, and Danah Boyd Social media bans are stacking up. In July, France joined Australia in restricting minors from accessing social media—barring children under 15 from major platforms, before the ban was blocked by the country’s top court on human rights grounds. The UK aims to forbid kids under 16 from accessing Facebook, TikTok, and other platforms in early 2027, and the EU has announced its own plan to prohibit social media for kids under 15. But early lessons from Australia, which enacted a ban in 2024, show that these sorts of age restrictions are easily circumvented. Here’s what we ought to do instead to keep kids safe . Can’t bear to say goodbye to your pet? Biotech’s got you covered. —Jessica Hamzelou I don’t remember much about Peppy, my first and only pet cat. What I do vividly remember, though, is the day she went missing. I was 10 years old, and I searched everywhere for her, scouting nearby fields and woods until sunset. I made posters. We never found her. I was devastated. Almost 30 years later, pet owners have an expanding set of options to potentially prolong their years with their furry companions. The possibilities include drugs, cloning, and even cryonics. But is that a good thing? Read the full story on the promises and pitfalls of pet life extension . This story is from The Checkup, our weekly biotech newsletter. Sign up to receive it in your inbox every Thursday. 10 Climate Tech Companies to Watch: Form Energy and its iron batteries Form Energy is one of MIT Technology Review’s 10 Climate Tech Companies to Watch 2026 , available exclusively to subscribers . As wind and solar power grow, utilities need cheaper ways to store electricity for longer periods. Form Energy aims to meet that need with batteries that can store energy for 100 hours. The company has developed a new type of battery using iron, a far more abundant and cheaper metal than those used in many existing batteries. It uses a process that Form calls “reversible rusting,” in which iron turns to rust as the battery discharges and back to iron when it charges. See how Form Energy hopes to make renewable power more reliable . —Jonathan W. Rosen Subscribers can now access the full 10 Climate Tech Companies to Watch , spanning everything f", "date_str": "2026-10-16T12:10:00+00:00", "hash": "1869bed8eb6c85ab", "title_fa": "دانلود: ممنوعیت های ناموفق رسانه های اجتماعی و افزایش عمر حیوانات خانگی", "summary_fa": "ممنوعیت های رسانه های اجتماعی در حال افزایش است. در ماه ژوئیه، فرانسه در محدود کردن دسترسی کودکان زیر 15 سال به رسانه‌های اجتماعی به استرالیا پیوست - قبل از اینکه این ممنوعیت توسط دادگاه عالی کشور به دلایل حقوق بشر مسدود شود. بریتانیا قصد دارد در اوایل سال 2027 دسترسی کودکان زیر 16 سال به فیس بوک، تیک تاک و سایر پلتفرم ها را ممنوع کند و اتحادیه اروپا نیز برنامه خود را برای ممنوعیت رسانه های اجتماعی برای کودکان زیر 15 سال اعلام کرده است. اما درس های اولیه استرالیا که در سال 2024 ممنوعیتی را تصویب کرد، نشان می دهد که این نوع محدودیت های سنی به راحتی قابل دور زدن هستند. در اینجا چیزی است که ما باید به جای آن برای ایمن نگه داشتن کودکان انجام دهیم. من چیز زیادی از پپی، اولین و تنها گربه خانگی من به یاد ندارم. با این حال، چیزی که من به وضوح به یاد دارم، روزی است که او گم شد. من 10 ساله بودم و همه جا را به دنبال او گشتم و تا غروب آفتاب در مزارع و جنگل های اطراف جستجو کردم. پوستر درست کردم ما هرگز او را پیدا نکردیم. من ویران شده بودم. تقریباً 30 سال بعد، صاحبان حیوانات خانگی مجموعه گسترده‌ای از گزینه‌ها برای طولانی‌تر کردن سال‌های زندگی با همراهان پشمالو خود دارند. این امکانات شامل داروها، شبیه سازی و حتی کرایونیک می شود. اما آیا این چیز خوبی است؟ داستان کامل در مورد وعده ها و مشکلات افزایش عمر حیوان خانگی را بخوانید. Form Energy یکی از 10 شرکت فناوری اقلیم MIT Technology Review برای تماشای 2026 است که منحصراً برای مشترکین در دسترس است. با رشد انرژی بادی و خورشیدی، شرکت‌های برق به روش‌های ارزان‌تری برای ذخیره‌سازی برق برای دوره‌های طولانی‌تر نیاز دارند. هدف Form Energy رفع این نیاز با"}, {"source": "MIT Tech Review", "title": "This implant can restore sight for patients with macular degeneration", "link": "https://www.technologyreview.com/2026/10/16/1145840/prima-implant-restores-sight-macular-degeneration-patients/", "summary": "Age-related macular degeneration (AMD) affects more than 5 million people around the world. And until now, no treatment could restore their vision. The Prima system, which was approved in Europe in July and is awaiting FDA clearance in the US, changes that. It combines a retinal implant with camera-­equipped eyeglasses to improve sight in patients who develop a blind spot in the middle of their vision due to advanced AMD. After training sessions, more than 80% of recipients were able to read, do crosswords, and use their phones. The retina processes light in three layers of cells: Photoreceptors convert light into electricity, bipolar cells process that signal, and ganglion cells transmit the signal to the optic nerve and the brain. Prima replaces the photoreceptors. BROWN BIRD DESIGN Developed by the California-based Science Corporation, the system takes advantage of the fact that AMD doesn’t damage all retinal circuitry; only photoreceptors—the cells that convert light into an electrical signal—die off. Prima’s implant mimics those cells and transmits visual information directly to healthy eye circuitry and on to the brain. “We’re leveraging all of the body’s own natural functions to process and transmit the information,” says Frank Brodie, an ophthalmologist at the University of California, San Francisco, and medical director for Prima. BROWN BIRD DESIGN CAPTURE Glasses outfitted with a miniature front-facing camera capture what someone is seeing in real time. The video feed is roughly five megapixels running at 30 frames per second, which is similar to TV. The raw video is transmitted to a connected processor via a fiber-optic cable . CONVERT A small, handheld processor, which can be set on a table or tucked in a pocket, converts the video feed into infrared light signals that route back to the glasses. The device also includes physical buttons that let the wearer adjust contrast, brightness, and zoom. BROWN BIRD DESIGN DISPLAY A laser projector on the glasses faces the wearer and shines pulses of near-infrared light directly at the eye at 880 nanometers—an invisible wavelength. This signal passes through the pupil and on to the retinal implant in the back of the eye. SEE The implant is made up of 378 pixels, each with an electrode and two photovoltaic cells , which do double duty. They convert the light into a current that healthy bipolar and ganglion cells pass on to the brain. They also act as solar cells to power the chip, eliminating the need for ", "date_str": "2026-10-16T09:00:00+00:00", "hash": "8784e139e4dcac13", "title_fa": "این ایمپلنت می تواند بینایی را به بیماران مبتلا به دژنراسیون ماکولا بازگرداند", "summary_fa": "دژنراسیون ماکولا وابسته به سن (AMD) بیش از 5 میلیون نفر را در سراسر جهان تحت تاثیر قرار می دهد. و تاکنون هیچ درمانی نتوانست بینایی آنها را بازگرداند. سیستم Prima که در ماه جولای در اروپا تایید شد و در انتظار تایید FDA در ایالات متحده است، آن را تغییر می دهد. این ایمپلنت شبکیه را با عینک های مجهز به دوربین ترکیب می کند تا بینایی را در بیمارانی که به دلیل AMD پیشرفته دچار یک نقطه کور در وسط بینایی خود می شوند، بهبود بخشد. پس از جلسات آموزشی، بیش از 80 درصد از دریافت کنندگان قادر به خواندن، جدول کلمات متقاطع و استفاده از تلفن خود بودند. شبکیه نور را در سه لایه سلول پردازش می کند: گیرنده های نوری نور را به الکتریسیته تبدیل می کنند، سلول های دوقطبی سیگنال را پردازش می کنند و سلول های گانگلیونی سیگنال را به عصب بینایی و مغز منتقل می کنند. پریما جایگزین گیرنده های نوری می شود. طراحی پرنده قهوه ای که توسط شرکت علوم مستقر در کالیفرنیا توسعه یافته است، این سیستم از این واقعیت بهره می برد که AMD به تمام مدارهای شبکیه آسیب نمی رساند. فقط گیرنده های نوری - سلول هایی که نور را به سیگنال الکتریکی تبدیل می کنند - از بین می روند. ایمپلنت پریما از آن سلول ها تقلید می کند و اطلاعات بصری را مستقیماً به مدارهای چشم سالم و به مغز منتقل می کند. فرانک برودی، چشم‌پزشک دانشگاه کالیفرنیا، سانفرانسیسکو و مدیر پزشکی پریما، می‌گوید: «ما از تمام عملکردهای طبیعی بدن برای پردازش و انتقال اطلاعات استفاده می‌کنیم. عکاسی با طراحی پرنده قهوه ای عینک های مجهز به دوربین جلوی مینیاتوری آنچه را که یک نفر در زمان واقعی می بیند ثبت می کند. فید ویدیو تقریباً پنج مگاپیکسل است که با سرعت 30 فریم در ثانیه اجرا"}, {"source": "MIT Tech Review", "title": "Love is infrastructure", "link": "https://www.technologyreview.com/2026/10/16/1145845/love-is-infrastructure-fiction-charlie-jane-anders/", "summary": "I. Meet cute Barnabas and Mainspring grew up near at hand, about an hour apart with good traffic, but for a long time they weren’t close. They traded glimpses and occasional hellos and then went about their business. Both of them carried on livelier conversations with farther-flung neighbors, who were richer and had more to offer. When Mainspring did interact with Barnabas, it was cringe. Mainspring liked to puff themself up, to strut around like a big deal—an innovator, a titan of industry—but they would turn shy at the worst moments, especially in any intimate conversation. Barnabas, meanwhile, had a dancer’s flair, an artsy, enigmatic glamour, except that when they tried to talk about real life, they’d blurt out hundreds of rapid-fire words—overtalking, overthinking, and generally overwhelming whomever they were trying to impress. So when Barnabas and Mainspring were young, they minded their own business. Until they’d both come into their own, and they saw each other properly. A group of geographers got together every year in a different place to talk about everything they had learned, and they were considering coming to visit either Mainspring or Barnabas. Both of them put on their best faces and tried to coax the geographers into choosing them as host. “Uh, hi-hello,” Mainspring said haltingly to Barnabas, whose full official name was St. Barnabas. “I really think it would be better if those geographers came to my place. I have more space, you see, and … and I am a titan of industry. I can show them practical applications of their research. It just makes more sense.” “Oh, really?” Barnabas laughed, making Mainspring more antsy. “Well, I can give them an elevated, artisanal experience. I have fresh croissants that were just written up in the Times . And I have plenty of space! I have so many friends who are great thinkers and architects. It’ll be lovely.” Barnabas carried on, basically calling Mainspring uncultured. Mainspring had a prickly feeling, like the worst heat dome of midsummer. For their part, Barnabas couldn’t bear the meanness they were inculcating inside themself. This feeling that they were small-time, no-account, a dilettante. They couldn’t stop aiming a flood of nervous words at Mainspring. At last, Mainspring had had enough—with the help of their city council and mayor, they offered the geographers a much-too-lavish deal that Barnabas could never hope to match. Totally worth it to hear Barnabas’s stream of self-aggrandizing nonsense pe", "date_str": "2026-10-16T09:00:00+00:00", "hash": "fb2091cd3dd3bb19", "title_fa": "عشق زیرساخت است", "summary_fa": "I. Meet ناز بارناباس و مین اسپرینگ نزدیک به هم بزرگ شدند، با فاصله تقریباً یک ساعت با ترافیک خوب، اما برای مدت طولانی نزدیک نبودند. آنها اجمالی و گاه به گاه سلام می کردند و سپس به کار خود ادامه می دادند. هر دوی آنها با همسایگان دورتر، که ثروتمندتر بودند و چیزهای بیشتری برای ارائه داشتند، گفتگوهای زنده تری داشتند. زمانی که مین اسپرینگ با بارناباس تعامل داشت، بسیار متزلزل بود. مین اسپرینگ دوست داشت خود را پف کند، مثل یک معامله بزرگ - یک مبتکر، یک غول صنعت - بچرخد، اما در بدترین لحظات خجالتی می‌شد، به خصوص در هر مکالمه صمیمی. در همین حال، بارناباس دارای استعداد رقصنده، زرق و برق هنری و معمایی بود، با این تفاوت که وقتی می خواستند در مورد زندگی واقعی صحبت کنند، صدها کلمه تند تند را به زبان می آوردند - بیش از حد صحبت کردن، بیش از حد فکر کردن، و به طور کلی هر کسی را که می خواستند تحت تاثیر قرار دهند. بنابراین زمانی که بارناباس و مین اسپرینگ جوان بودند، به کار خود فکر کردند. تا اینکه هر دو به خود آمدند و یکدیگر را به درستی دیدند. گروهی از جغرافیدانان هر سال در مکانی متفاوت دور هم جمع می‌شدند تا درباره همه چیزهایی که آموخته‌اند صحبت کنند، و در فکر آمدن به دیدار مین اسپرینگ یا بارناباس بودند. هر دوی آنها بهترین چهره خود را نشان دادند و سعی کردند جغرافیدانان را به انتخاب آنها به عنوان میزبان تشویق کنند. مین اسپرینگ با وقفه به بارناباس که نام رسمی کاملش سنت بارناباس بود گفت: \"اوه، سلام.\" \"من واقعا فکر می کنم اگر آن جغرافیدانان به جای من بیایند بهتر است. من فضای بیشتری دارم، می بینید، و ... و من یک غول صنعت هستم. می توانم کاربردهای عملی تحقیقات آنها را به آنها نشان"}, {"source": "MIT Tech Review", "title": "Can’t bear to say goodbye to your pet? Biotech’s got you covered.", "link": "https://www.technologyreview.com/2026/10/16/1146766/pet-biotech-longevity-cloning-cryonics/", "summary": "I don’t remember much about Peppy, my first and only pet cat. I can conjure the sensation of stroking her while she purred, recall how she used to get stuck in trees (just like in cartoons!), and chuckle about the time she pooed in my baby sister’s cot. That’s about it. What I do vividly remember, though, is the day she went missing. I was 10 years old, and I searched everywhere for her, scouting nearby fields and woods until sunset. I made posters. We never found her. I was devastated. There was no way to get more time with Peppy, but almost 30 years later, pet owners are being offered an ever-expanding set of options to potentially prolong their years with their furry companions. The possibilities include drugs, cloning, and even cryonics. But is that a good thing? There’s certainly a market for pet preservation. And a growing number of biotech companies have their sights set on pet longevity. Loyal, a company that is currently working on three potential longevity drugs for dogs, is trialing one designed to improve metabolic health in around 1,300 pet dogs across the US. Others are testing dog drugs that aim to combat both age-related diseases, including conditions like obesity and osteoarthritis , and aging itself. There’s even a company focused on longevity medicines for domesticated cats. I don’t know how or when Peppy died. But if there had been a drug that might have protected her from diabetes or arthritis, there’s no doubt I would have tried to get my hands on it. That’s about where my enthusiasm for pet life extension ends, though. I’m far less interested in cloning, a relatively new option for people mourning a pet and seeking a replacement. In most cases, this technology involves taking the DNA of a pet, putting it into an egg cell from another animal of the same species, and growing the resulting embryo in a surrogate animal. It worked for Dolly the sheep, who was born the year before Peppy went missing. It has since worked for other mammals, including cattle, horses, and ferrets—and cats and dogs. In the US, a company called Viagen Pets offers to clone cats and dogs for $50,000 a go. This doesn’t result in an exact replica of the animal but a genetic twin. Still, there are lots of reasons why a person might want to clone a pet. On its website, Viagen explicitly offers customers “a way to hold on.” Lori Kogan, a professor of clinical sciences at Colorado State University who has studied human-animal relationships for decades, doesn’t have a pr", "date_str": "2026-10-16T09:00:00+00:00", "hash": "9100044aab47ee21", "title_fa": "طاقت خداحافظی با حیوان خانگی خود را ندارید؟ Biotech شما را تحت پوشش قرار داده است.", "summary_fa": "من چیز زیادی از پپی، اولین و تنها گربه خانگی من به یاد ندارم. می‌توانم حس نوازش او را در حالی که خرخر می‌کرد تداعی کنم، به یاد بیاورم که چگونه در میان درختان گیر می‌کرد (درست مثل کارتون‌ها!)، و در مورد زمانی که در تخت نوزاد خواهرم قلاب می‌کرد بخندم. این در مورد آن است. با این حال، چیزی که من به وضوح به یاد دارم، روزی است که او گم شد. من 10 ساله بودم و همه جا را به دنبال او گشتم و تا غروب آفتاب در مزارع و جنگل های اطراف جستجو کردم. پوستر درست کردم ما هرگز او را پیدا نکردیم. من ویران شده بودم. هیچ راهی برای داشتن زمان بیشتری با Peppy وجود نداشت، اما تقریباً 30 سال بعد، به صاحبان حیوانات خانگی مجموعه‌ای از گزینه‌های در حال گسترش پیشنهاد می‌شود تا به طور بالقوه سال‌های خود را با همراهان پشمالو خود طولانی کنند. این امکانات شامل داروها، شبیه سازی و حتی کرایونیک می شود. اما آیا این چیز خوبی است؟ مطمئناً بازاری برای نگهداری حیوانات خانگی وجود دارد. و تعداد فزاینده ای از شرکت های بیوتکنولوژیکی به طول عمر حیوانات خانگی توجه دارند. Loyal، شرکتی که در حال حاضر روی سه داروی بالقوه طول عمر برای سگ ها کار می کند، در حال آزمایش دارویی است که برای بهبود سلامت متابولیک در حدود 1300 سگ خانگی در سراسر ایالات متحده طراحی شده است. برخی دیگر در حال آزمایش داروهای سگ هستند که هدف آنها مبارزه با بیماری های مرتبط با افزایش سن، از جمله شرایطی مانند چاقی و آرتروز و خود پیری است. حتی شرکتی وجود دارد که روی داروهای طول عمر برای گربه های اهلی متمرکز شده است. نمی‌دانم پپی چگونه و کی مرد. اما اگر دارویی وجود داشت که او را از دیابت یا آرتریت محافظت می کرد، بدون شک سعی"}, {"source": "MIT Tech Review", "title": "Kids are outsmarting social media bans. That’s not a problem we need to solve.", "link": "https://www.technologyreview.com/2026/10/16/1146834/kids-are-outsmarting-social-media-bans-thats-not-a-problem-we-need-to-solve/", "summary": "Social media bans are stacking up. In July, France joined Australia in restricting minors from accessing social media—barring children under 15 from major platforms, before the ban was blocked by the country’s top court on human rights grounds. The UK aims to forbid kids under 16 from accessing Facebook, TikTok, and other platforms in early 2027, and the EU has announced its own plan to prohibit social media for kids under 15. But early lessons from Australia, which enacted a ban in 2024, show that these sorts of age restrictions are easily circumvented. A study published earlier this year found that four in five teens under 16 made their way onto barred platforms. Teens have successfully explored many tactics for bypassing bans, from using a sibling’s face for ID to drawing fake facial hair. Some proponents of bans have called for an increased focus on enforcement that blocks these workarounds. But circumvention is a signal, not a nuisance or something to be simply deterred. The fact that kids are actively looking for ways to outwit the bans highlights their limitations. Social media bans suppress kids’ access to information, including information that’s essential to their development, identity formation, and socialization, especially during adolescence. Worse, further restriction is likely to backfire. Closing loopholes in age gates could harm kids by pushing them toward less-moderated, higher-risk corners of the web. It also degrades privacy and security for everyone by forcing people to submit sensitive personal information to prove their age. In our work , we’ve found that parents and kids both want smarter, more nuanced policies that protect children, families, and their rights. That can take the form of mandating stronger limits on data collection by companies, or giving families flexible tools to control content and access on their own terms. Age gates won’t bring about the desired change, nor will they simplify parenting in the digital world. At best, they will only raise thornier questions and postpone the conversation to a child’s 16th birthday. At worst, they’ll leave kids with no guidance as they make their way through the online world. A less safe internet for kids When young people circumvent restrictions, they are often doing what we want developing minds to do and what we celebrate in other contexts: lean into curiosity, problem-solve, and exercise independence. It’s important for kids to do this online, an arena where they often develop s", "date_str": "2026-10-16T07:56:32+00:00", "hash": "5487193965a73aec", "title_fa": "بچه ها از ممنوعیت های رسانه های اجتماعی پیشی می گیرند. این مشکلی نیست که ما باید آن را حل کنیم.", "summary_fa": "ممنوعیت های رسانه های اجتماعی در حال افزایش است. در ماه ژوئیه، فرانسه در محدود کردن دسترسی کودکان زیر 15 سال به رسانه‌های اجتماعی به استرالیا پیوست - قبل از اینکه این ممنوعیت توسط دادگاه عالی کشور به دلایل حقوق بشر مسدود شود. بریتانیا قصد دارد در اوایل سال 2027 دسترسی کودکان زیر 16 سال به فیس بوک، تیک تاک و سایر پلتفرم ها را ممنوع کند و اتحادیه اروپا نیز برنامه خود را برای ممنوعیت رسانه های اجتماعی برای کودکان زیر 15 سال اعلام کرده است. اما درس های اولیه استرالیا که در سال 2024 ممنوعیتی را تصویب کرد، نشان می دهد که این نوع محدودیت های سنی به راحتی قابل دور زدن هستند. مطالعه‌ای که در اوایل سال جاری منتشر شد نشان داد که از هر پنج نوجوان زیر 16 سال، چهار نفر به سکوهای ممنوعه راه پیدا کردند. نوجوانان با موفقیت بسیاری از تاکتیک‌ها را برای دور زدن ممنوعیت‌ها کشف کرده‌اند، از استفاده از چهره خواهر یا برادر برای شناسایی تا کشیدن موهای تقلبی صورت. برخی از حامیان ممنوعیت ها خواستار تمرکز بیشتر بر اجرای قانون شده اند که این راه حل ها را مسدود می کند. اما دور زدن یک سیگنال است، نه یک مزاحمت یا چیزی که به سادگی باید از آن جلوگیری کرد. این واقعیت که بچه ها فعالانه به دنبال راه هایی برای غلبه بر ممنوعیت ها هستند، محدودیت های آنها را برجسته می کند. ممنوعیت‌های رسانه‌های اجتماعی، دسترسی کودکان به اطلاعات، از جمله اطلاعاتی که برای رشد، شکل‌گیری هویت و اجتماعی شدن آن‌ها ضروری است، به ویژه در دوران نوجوانی سرکوب می‌کند. بدتر از آن، محدودیت بیشتر احتمالا نتیجه معکوس خواهد داشت. بستن حفره‌ها در دروازه‌های سنی می‌تواند با سوق دادن کودکان به سمت گوشه‌های کمتر تعدیل‌شده و پرخطر از وب به آنها آسیب برساند. همچنین با وادار کردن افراد به ارائه"}, {"source": "Business Insider", "title": "As a Texas local, I skip the crowds in Austin and head west to a charming nearby city with amazing wineries", "link": "https://www.businessinsider.com/texas-favorite-small-city-to-visit-fredericksburg-local-recommendations-2026-10", "summary": "Fredericksburg, Texas, and its surrounding areas have some incredible scenery and wineries. Malachi Jacobs/Shutterstock I've lived in Texas for many years, and Fredericksburg is one of my favorite places to visit . Fredericksburg has incredible wineries, and I like that it isn't too far from Austin or San Antonio. The small city has a charming, walkable Main Street with some great shops and restaurants. After more than 15 years of driving between San Antonio and Austin as a longtime Texas local, I've found my favorite detour: Fredericksburg. Part of the scenic Texas Hill Country, it's a walkable city with German roots, popular for its array of wineries, boutique hotels, and lively downtown. Although I love Austin and San Antonio , Fredericksburg provides a small-town feel that the aforementioned cities — with populations close to a million each — could never quite achieve. In my opinion, Fredericksburg's small population of about 12,000 people only lends to its charm. It's a great break from bigger Texas cities, as it's less than a two-hour drive from Austin or San Antonio. Here are a few reasons I visit Fredericksburg twice a year and highly recommend it as a travel destination. In this area, wine is a huge draw Main Street has restaurants, wine-tasting rooms, coffee shops, and bars. Little Vignettes Photo/Shutterstock Fredericksburg is situated in the heart of Texas wine country , so visiting without enjoying one of its many wineries is like a crime in Texas. (Another crime? Dry brisket.) In Fredericksburg, you can either stop by a multitude of tasting rooms on Main Street or drive out past a ranch or two to find Tuscan-style wineries hidden in plain sight. One of my favorite wineries is Augusta Vin Winery — and it's worth the extra drive. I always enjoy sipping reds in the spacious tasting room, with large open windows perfect for taking in the Texas sunshine. A few other wineries worth visiting in Fredericksburg include the Rhinory for the unique experience of drinking at a rhino reserve, Slate Theory for a touch of modernity, and Grape Creek Vineyards or Barons Creek for classic experiences with beautiful views. There's no shortage of great places to grab a meal in Fredericksburg The Restaurant at The Albert Hotel is beautiful. Kat Stinson Consider leaning into the city's German heritage at The Auslander, one of the many locally owned restaurants on Main Street. Reminiscent of a classic Bavarian beer hall, it has beer, a whole section of schnitzel ent", "date_str": "2026-10-16T13:37:47+00:00", "hash": "975ee19c86544f67", "title_fa": "به عنوان یک محلی تگزاس، از جمعیت در آستین رد می‌شوم و به سمت غرب به شهر جذاب نزدیک با شراب‌خانه‌های شگفت‌انگیز می‌روم.", "summary_fa": "فردریکزبورگ، تگزاس، و مناطق اطراف آن دارای مناظر و شراب سازی های باورنکردنی هستند. Malachi Jacobs/Shutterstock من سال ها در تگزاس زندگی کرده ام و فردریکزبورگ یکی از مکان های مورد علاقه من برای بازدید است. Fredericksburg شراب‌سازی‌های باورنکردنی دارد، و من دوست دارم که خیلی دور از آستین یا سن آنتونیو نیست. این شهر کوچک دارای یک خیابان اصلی جذاب و قابل پیاده روی با چند فروشگاه و رستوران عالی است. پس از بیش از 15 سال رانندگی بین سن آنتونیو و آستین به عنوان یک منطقه قدیمی تگزاس، من مسیر انحرافی مورد علاقه خود را پیدا کردم: فردریکزبورگ. این شهر که بخشی از منطقه دیدنی تگزاس هیل کانتری است، شهری قابل پیاده‌روی با ریشه آلمانی است که به‌خاطر مجموعه‌ای از شراب‌خانه‌ها، هتل‌های بوتیک، و مرکز شهر پرجنب‌وجوش مشهور است. اگرچه من عاشق آستین و سن آنتونیو هستم، فردریکزبورگ احساس شهری کوچکی را به وجود می‌آورد که شهرهای فوق‌الذکر - با جمعیتی نزدیک به یک میلیون نفر - هرگز نمی‌توانستند به آن برسند. به نظر من، جمعیت اندک فردریکزبورگ با حدود 12000 نفر تنها به جذابیت آن کمک می کند. این یک استراحت عالی از شهرهای بزرگتر تگزاس است، زیرا کمتر از دو ساعت با آستین یا سن آنتونیو فاصله دارد. در اینجا چند دلیل است که من دو بار در سال از فردریکزبورگ بازدید می کنم و آن را به عنوان یک مقصد سفر به شدت توصیه می کنم. در این منطقه، شراب بسیار جذاب است. خیابان اصلی دارای رستوران‌ها، اتاق‌های مزه شراب، کافی‌شاپ‌ها و بارها است. Little Vignettes Photo/Shutterstock Fredericksburg در قلب کشور شراب تگزاس واقع شده است، بنابراین بازدید بدون لذت بردن از یکی از شراب سازی های متعدد آن مانند یک جنایت در تگزاس است. (جنایتی دیگر؟ پستان خشک.) در فردریکزبورگ، می‌توانید در کنار تعداد زیادی از اتاق‌های چشیدن غذا در خیابان اصلی توقف کنید"}, {"source": "Business Insider", "title": "I'm not scared of aging. I'm having more fun in my 60s than I did in my 20s.", "link": "https://www.businessinsider.com/having-more-fun-as-i-get-older-2026-10", "summary": "I m having more fun in my 60s than I did in my 20s. Krista Buckner; Visuals By Christina I'm in my 60s and I'm enjoying life more than I did in my 20s. At this point in my life, I'm more confident in my fashion choices and friendships. Plus, I've finally stopped questioning whether I'm where I'm \"supposed to be\" in life. At 62, my life looks almost nothing like the one my 20-year-old self pictured. It's better. Sure, I'm divorced and don't have grandchildren , but I have adult children I adore and friendships with decades of history. Plus, I'm doing something I never imagined: building a career on social media. Every day, I talk to over 200,000 followers on TikTok and 135,000 on Instagram about hope, finding your purpose, and remembering that life doesn't have an expiration date. At an age when many people are winding down, I seem to just be getting started. And I wouldn't change a thing. I dress for myself, not my age I love experimenting with bold fashion choices. Visuals By Christina I've always loved fashion, from jeans and flip-flops to high heels and designer gowns. But these days, I have more confidence in my choices and a lot less interest in anyone else's opinion of them. When I look at clothes, I don't see an age requirement. I see something I either love or don't. Whether it's a bold print , an unexpected silhouette, or a statement piece, my decision on what to wear comes down to how it looks and feels on me, not how old I am. Fashion has always been a form of self-expression for me, and getting older hasn't changed that. I don't think women should have to trade their sense of style for something more \"age-appropriate\" every time they celebrate another birthday. Plus, my goal isn't to look 30. It's to make 30-year-olds excited to turn 60. After all, why would I want to turn back the clock? I've spent six decades learning who I am. I wouldn't trade that wisdom just to have younger-looking skin . My friendships don't require me to be anyone but myself My friends and I are there for each other during life s best and worst moments. Krista Buckner One of the most beautiful parts of getting older is having friendships that have stood the test of time. There's something special about sitting across from someone who knows the chapters of your life you'd rather forget and realizing you have absolutely nothing to prove. My friends and I have stood by one another through divorces, financial struggles , challenges with our children, and some of life's most ", "date_str": "2026-10-16T13:34:19+00:00", "hash": "ee08fafd4228088f", "title_fa": "من از پیری نمی ترسم من در 60 سالگی بیشتر از 20 سالگی سرگرم می شوم.", "summary_fa": "من در دهه 60م بیشتر از 20 سالگی سرگرم هستم. کریستا باکنر; تصاویری نوشته کریستینا من در دهه 60م هستم و بیشتر از 20 سالگی از زندگی لذت می برم. در این مرحله از زندگی، من به انتخاب های مد و دوستی هایم اطمینان بیشتری دارم. بعلاوه، من در نهایت از این سوال که آیا در جایی هستم که «قرار است» در زندگی باشم، دست برداشتم. در 62 سالگی، زندگی من تقریباً شبیه زندگی 20 ساله ام نیست. بهتر است. مطمئنا، من طلاق گرفته ام و نوه ندارم، اما فرزندان بزرگسالی دارم که دوستشان دارم و دوستی هایی با چندین دهه سابقه. به علاوه، کاری را انجام می‌دهم که هرگز تصورش را نمی‌کردم: ایجاد شغل در رسانه‌های اجتماعی. من هر روز با بیش از 200000 دنبال کننده در TikTok و 135000 دنبال کننده در اینستاگرام در مورد امید، یافتن هدف خود و یادآوری اینکه زندگی تاریخ انقضا ندارد صحبت می کنم. در سنی که بسیاری از مردم در حال تعطیل شدن هستند، به نظر می رسد من تازه شروع کرده ام. و من چیزی را تغییر نمی دهم. من برای خودم لباس می پوشم، نه برای سنم، دوست دارم با انتخاب های مد جسورانه آزمایش کنم. تصاویری نوشته کریستینا من همیشه مد را دوست داشتم، از شلوار جین و دمپایی گرفته تا کفش های پاشنه بلند و لباس های مجلسی طراحان. اما این روزها به انتخاب هایم اعتماد بیشتری دارم و علاقه کمتری به نظر دیگران درباره آنها دارم. وقتی به لباس نگاه می کنم، شرط سنی نمی بینم. چیزی را می بینم که یا دوستش دارم یا نه. چه یک چاپ پررنگ باشد، چه یک سیلوئت غیرمنتظره، یا یک قطعه بیانیه، تصمیم من در مورد اینکه چه بپوشم به ظاهر و احساس من بستگی دارد، نه سن من. مد همیشه برای من نوعی ابراز وجود بوده است و پیر"}, {"source": "Business Insider", "title": "iPhone Duo preorder deals: Trade-ins, free iPads, Apple Watches, and other carrier offers compared", "link": "https://www.businessinsider.com/guides/deals/iphone-duo-preorders-prices-features", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Apple/Business Insider Apple is turning up to the foldable smartphone game fashionably late, and fans of the brand are excited as iPhone Duo preorders are now live. Learn how to secure your device now, before stock dwindles and ship dates are pushed further. The iPhone Duo combines a compact outer display with a larger foldable screen inside, giving you more room when you need it without making the phone feel obtuse all the time. It also brin 0", "hash": "cc504a7830898c87", "title_fa": "معاملات پیش‌سفارش آیفون Duo: معاملات، آی‌پدهای رایگان، ساعت‌های اپل و سایر پیشنهادات شرکت مخابراتی در مقایسه با یکدیگر", "summary_fa": "اولین آیفون تاشو اپل، Duo، دارای صفحه‌نمایش بیرونی جمع‌وجور ۵.۴ اینچی است که در یک صفحه نمایش ۷.۶ اینچی بسیار بزرگ‌تر برای انجام چند کار، بازی و استریم باز می‌شود. همچنین دارای تراشه A20 Pro، سیستم دوربین دوگانه 48 مگاپیکسلی و عمر باتری تمام روز است که آن را به یک گزینه عالی برای هرکسی که بدون حمل تبلت صفحه نمایش بیشتری می‌خواهد تبدیل می‌کند."}, {"source": "Business Insider", "title": "3 fine-print disclaimers from Musk and Tesla about the new flying Roadster you should probably know about", "link": "https://www.businessinsider.com/buy-tesla-flying-roadster-read-fine-print-road-legal-delivery-2026-10", "summary": "Tesla s Roadster fires its cold-gas thrusters. Tesla Elon Musk unveiled Tesla's flying, thrust-powered Roadster with a jaw-dropping demo. Tesla fans about to shell out as much as $250,000 to reserve it should probably read the fine print. Tesla said it can't guarantee the Roadster will be delivered, and it's unclear if the rocket-powered version is street-legal. Where Tesla's going, you might not need roads — but you still need to read the terms and conditions. Tesla's thruster-powered, midair flip-kicking, flying supercar was a wow moment even by the standards of the company's famously off-the-rails product unveilings. But Tesla fans lining up to pay as much as $250,000 to reserve the new Roadster , which can do 0-60 mph in under a second thanks to a system of cold-gas thrusters, should probably take a close look at the fine print. Tesla s Roadster executes a gravity-defying flip. Tesla The company's T Cs make it clear that the final price of the bleeding-edge EV — which comes in Performance, Thrust, and Rocket variants — has yet to be determined and state that there are no guarantees the Roadster will ever be delivered. Meanwhile, it is unclear whether the two thruster-powered versions of the Roadster will actually be road-legal. After combing through the Roadster's reservation agreement and Musk's comments at its unveiling, here's what you should know before splashing out on Tesla's most outlandish vehicle yet. 1. It's not clear where you can actually drive it As the dust cleared on the jaw-dropping Roadster showcase , one key question remained unanswered: where exactly will you be able to drive it? At the event, Musk said the cold air thruster-powered flying Roadster would be an actual \"car that someone can own,\" not just a one-off concept demonstration. But the Tesla CEO added that he was \"not sure it's necessarily legal in all jurisdictions,\" and when an audience member asked if it would be street-legal, Musk was vague. Elon Musk said the Roadster would enter production in 2028. Tesla \"Depends on your street. But it'll be a viable car,\" the billionaire said. The flying Rocket variant shown in the demo is invite-only. It's listed on Tesla's website with the caveat that it is \"not approved for public road use.\" The gravity-defying stunts, flips, and barrel rolls shown off at Thursday's unveiling were performed without a driver in the car for safety reasons, and Musk described the vehicle as \"not necessarily a safety-optimized car.\" By contrast, Tesla d", "date_str": "2026-10-16T12:20:28+00:00", "hash": "d8c5799e43440168", "title_fa": "3 سلب مسئولیت دقیق از ماسک و تسلا در مورد رودستر پرنده جدید که احتمالاً باید درباره آنها بدانید", "summary_fa": "تسلا رودستر پیشرانه های گاز سرد خود را به کار می اندازد. تسلا ایلان ماسک از رودستر پرنده تسلا با پیشرانه رانش پرده برداری کرد. طرفداران تسلا که قصد دارند تا 250000 دلار برای رزرو آن هزینه کنند، احتمالاً باید چاپ دقیق آن را مطالعه کنند. تسلا گفت که نمی‌تواند تضمین کند که رودستر تحویل داده می‌شود و مشخص نیست که آیا نسخه‌ای که از موشک استفاده می‌کند، قانونی است یا خیر. جایی که تسلا می رود، ممکن است نیازی به جاده نداشته باشید - اما همچنان باید شرایط و ضوابط را بخوانید. ابرخودروی پرنده تسلا که با پیشرانه پیشرانه و تلنگر در هوا حرکت می کرد، حتی با استانداردهای رونمایی از محصولات معروف خارج از ریل این شرکت، لحظه شگفت انگیزی بود. اما طرفداران تسلا که برای رزرو رودستر جدید که می تواند در کمتر از یک ثانیه صفر تا 60 مایل در ساعت را بپردازد، صف می کشند تا 250000 دلار بپردازند، احتمالا باید نگاهی دقیق به چاپ ریز داشته باشند. رودستر تسلا یک چرخش گرانش را اجرا می کند. تسلا T Cهای این شرکت روشن می‌کند که قیمت نهایی خودروی الکتریکی پیشرفته - که در انواع Performance، Thrust و Rocket عرضه می‌شود - هنوز مشخص نشده است و بیان می‌کند که هیچ تضمینی برای تحویل رودستر وجود ندارد. در همین حال، مشخص نیست که آیا دو نسخه پیشرانه رودستر واقعاً قانونی خواهند بود یا خیر. پس از بررسی قرارداد رزرو رودستر و نظرات ماسک در زمان رونمایی از آن، در اینجا چیزی است که باید قبل از خرید عجیب‌ترین وسیله نقلیه تسلا بدانید. 1. مشخص نیست واقعاً کجا می‌توانید آن را رانندگی کنید، همانطور که گرد و غبار روی ویترین غول‌پیکر رودستر پاک شد، یک سوال کلیدی بی‌پاسخ ماند: دقیقاً کجا می‌توانید آن را رانندگی کنید؟ در این رویداد، ماسک گفت که رودستر پرنده با پیشرانه هوای"}, {"source": "Business Insider", "title": "We spend 7 months a year near our grandkids in Texas. The other 5 are for us in Florida.", "link": "https://www.businessinsider.com/grandparents-split-time-texas-florida-grandchildren-2026-10", "summary": "Valerie and Glenn Cherry split their time between Tampa and Florida. Courtesy of Valerie Cherry Valerie Cherry was thrilled when her first grandchild was born. She wanted to be a hands-on grandma. The mom-of-one yearned to be closer to the young family but was reluctant to leave her hometown. With 1,000 miles between them, she found a \"middle ground\" by renting nearby for half of the year. This story is based on an interview with Valerie Cherry, 68, a clinical psychologist from Tampa, Florida. It has been edited for length and clarity. My husband, Glenn, 68, and I were delighted when our first grandchild — a little girl —was born four years ago. Our son, Jamal, is an only child, and we are a very close-knit family. We rushed from our home in Tampa to help him and our daughter-in-law, Sierra, who had settled 1,000 miles away in Houston, with the demands of a baby. Do you have an interesting arrangement for caring for your grandchildren? Please send details to Jane Ridley at jridley@businessinsider.com if you'd like to share your story. Our trips lasted between a month and six weeks, and there was a lot of to-ing and fro-ing between the two cities. We'd either stay with the family or rent Airbnbs to give everyone a bit of space. The Cherrys enjoy an active social life in Tampa. Courtesy of Valerie Cherry. It felt great to be hands-on and useful, especially because Jamal and Sierra work very hard in finance and forensic psychology, respectively. Back home in Florida, though, we lived life to the full in our gated, suburban community. Glenn, a relief veterinarian , and I had meaningful friendships there. We knew lots of people, particularly fellow alumni from our colleges in Georgia . There was always something going on, like book clubs and fundraising activities. Then our grandson was born two years ago. We continued our long visits to care for him and his sister, flying between the two cities. We started to look at places in Houston Soon after his birth, Jamal and Sierra approached us about what it felt like when we weren't there. They were a bit nervous and wanted to know whether we'd consider moving close by. We were torn. As much as we wanted to be with our grandchildren, we valued our time in Tampa. Still, we started to look at places in Houston. The trouble was that if we were to purchase something in Houston, it would have had to be in the suburbs . Traffic is terrible, so it would have been around a 40-minute drive to my son's. The Cherrys dressed as ", "date_str": "2026-10-16T12:18:03+00:00", "hash": "ea5ea7cc17b8d612", "title_fa": "ما 7 ماه در سال را در نزدیکی نوه های خود در تگزاس می گذرانیم. 5 تای دیگر برای ما در فلوریدا هستند.", "summary_fa": "والری و گلن چری زمان خود را بین تامپا و فلوریدا تقسیم کردند. با حسن نیت والری گیلاس والری گیلاس زمانی که اولین نوه اش به دنیا آمد بسیار هیجان زده شد. او می خواست یک مادربزرگ دستی شود. مادر یک فرزند دوست داشت به خانواده جوان نزدیک تر باشد اما تمایلی به ترک زادگاهش نداشت. با 1000 مایل فاصله بین آنها، او با اجاره دادن در همان نزدیکی برای نیمی از سال، \"محلی میانی\" پیدا کرد. این داستان بر اساس مصاحبه ای با والری چری، 68 ساله، روانشناس بالینی از تامپا، فلوریدا است. برای طول و وضوح ویرایش شده است. من و همسرم، گلن، 68 ساله، وقتی چهار سال پیش اولین نوه ما - یک دختر کوچک - به دنیا آمد، خوشحال شدیم. پسرمان جمال تک فرزند است و خانواده بسیار صمیمی هستیم. ما با عجله از خانه خود در تامپا برای کمک به او و عروسمان، سیرا، که 1000 مایل دورتر در هیوستون ساکن شده بود، با تقاضای یک نوزاد کمک کردیم. آیا ترتیب جالبی برای نگهداری از نوه های خود دارید؟ لطفاً اگر مایلید داستان خود را به اشتراک بگذارید، جزئیات را به جین ریدلی به آدرس jridley@businessinsider.com ارسال کنید. سفرهای ما بین یک ماه تا شش هفته به طول انجامید و رفت و آمدهای زیادی بین دو شهر وجود داشت. ما یا با خانواده می‌مانیم یا Airbnbs را اجاره می‌کنیم تا به همه کمی فضا بدهیم. گیلاس ها از یک زندگی اجتماعی فعال در تامپا لذت می برند. با حسن نیت از والری گیلاس. عملی بودن و مفید بودن احساس بسیار خوبی بود، به خصوص به این دلیل که جمال و سیرا به ترتیب در امور مالی و روانشناسی قانونی بسیار سخت کار می کنند. با این حال، در بازگشت به خانه در فلوریدا، ما زندگی کاملی را در جامعه‌ی حومه‌ای و سرپوشیده خود داشتیم. گلن،"}, {"source": "Business Insider", "title": "Tesla's new flying Roadster did exactly what Elon Musk said it would in a post 8 years ago", "link": "https://www.businessinsider.com/elon-musk-described-tesla-flying-roadster-tech-8-years-ago-2026-10", "summary": "Elon Musk may have been years late on his Roadster deadline, but the tech Tesla showed off was just as described eight years ago. Win McNamee/Getty Images Musk described his plans for the Tesla Roadster during a 2019 exchange with YouTuber MKBHD. On Thursday, the Roadster did exactly as Musk promised nearly eight years ago, leaping into the air. While Musk missed his own deadline by years, the technology on display was just as he described it. It's been a long time coming. Almost eight years ago, in January 2019, Elon Musk shared plans on Twitter for Tesla's Roadster to lift off using cold-gas thrusters and ultra-high-pressure air. On Thursday, the much-anticipated Roadster did exactly that. Musk's 2019 assertion came in response to a user sharing a GIF of the DeLorean from \"Back to the Future\" hovering in midair. \"The new Roadster will actually do something like this,\" he wrote. Tech YouTuber Marques Brownlee responded: \"The thing is I feel like you’re not joking.\" \"I'm not,\" Musk said. I’m not. Will use SpaceX cold gas thruster system with ultra high pressure air in a composite over-wrapped pressure vessel in place of the 2 rear seats. — Elon Musk (@elonmusk) January 9, 2019 He then described a SpaceX-made cold-gas thruster system that uses high-pressure air stored in a composite pressure vessel. At a SpaceX test site in Texas on Thursday, almost 8 years later, a Roadster climbed a curved ramp, dropped, rolled through the air and landed on its wheels. It used the same basic technology: cold-gas thrusters fed by high-pressure air stored in composite pressure vessels. The 2019 exchange was not Musk’s first mention of thrusters. In June 2018, he said the Roadster would include roughly 10 of them and suggested they might allow the car to fly. Using the config you describe, plus an electric pump to replenish air in COPV, when car power draw drops below max pack power output, makes sense. But we are going to go a lot further. — Elon Musk (@elonmusk) June 9, 2018 When another user proposed compressed-air cold-gas thrusters, Musk said that configuration made sense and described a pump to replenish the air. Musk's account of the technology has proved more consistent than his production timetable. Tesla unveiled plans for the second-generation Roadster in 2017 and originally targeted production for 2020. After repeated delays, Musk said in the reveal that production will begin in 2028. The Roadster is not Tesla’s only vehicle to miss an ambitious release target. W", "date_str": "2026-10-16T11:58:49+00:00", "hash": "677b142153e017ab", "title_fa": "رودستر پرنده جدید تسلا دقیقاً همان کاری را انجام داد که ایلان ماسک 8 سال پیش در پستی گفته بود.", "summary_fa": "ایلان ماسک ممکن است سال ها در ضرب الاجل رودستر خود تاخیر داشته باشد، اما فناوری ای که تسلا به نمایش گذاشت دقیقاً همان چیزی بود که هشت سال پیش توصیف شد. Win McNamee/Getty Images ماسک برنامه‌های خود را برای تسلا رودستر طی مبادله سال 2019 با YouTuber MKBHD شرح داد. روز پنجشنبه، رودستر دقیقاً همان کاری را انجام داد که ماسک تقریباً هشت سال پیش وعده داده بود و به هوا پرید. در حالی که ماسک سال ها ضرب الاجل خود را از دست داد، فناوری نمایش داده شده دقیقاً همان چیزی بود که او آن را توصیف کرد. خیلی وقته که اومده تقریباً هشت سال پیش، در ژانویه 2019، ایلان ماسک برنامه‌هایی را در توییتر به اشتراک گذاشت که رودستر تسلا با استفاده از پیشرانه‌های گاز سرد و هوای فوق‌فشار بالا برود. روز پنجشنبه، رودستر مورد انتظار دقیقاً همین کار را کرد. ادعای ماسک در سال 2019 در پاسخ به کاربری ارائه شد که یک GIF از DeLorean از «بازگشت به آینده» در هوا معلق بود. او نوشت: «رودستر جدید در واقع چیزی شبیه به این را انجام خواهد داد. مارکز براونلی، یوتیوب‌بر فناوری پاسخ داد: «امکان این است که احساس می‌کنم شما شوخی نمی‌کنید.» ماسک گفت: من نیستم. من نیستم از سیستم رانشگر گاز سرد SpaceX با هوای فوق‌العاده پرفشار در یک مخزن تحت فشار کامپوزیت به جای 2 صندلی عقب استفاده خواهد کرد. — ایلان ماسک (@elonmusk) 9 ژانویه 2019 او سپس یک سیستم رانشگر گاز سرد ساخت SpaceX را توصیف کرد که از هوای پرفشار ذخیره شده در یک مخزن تحت فشار کامپوزیتی استفاده می کند. در روز پنجشنبه، تقریباً 8 سال بعد، در سایت آزمایش SpaceX در تگزاس، یک رودستر از یک رمپ منحنی بالا رفت، سقوط کرد، در هوا غلتید و روی چرخ‌هایش فرود آمد. از همان فناوری اولیه استفاده می کرد: رانشگرهای"}, {"source": "Business Insider", "title": "New details about Khaby Lame's $975 million deal deepen the mystery", "link": "https://www.businessinsider.com/khaby-lames-975-million-deal-limbo-months-after-announcement-2026-10", "summary": "Khaby Lame has been pursuing other partnerships as his big payday remains in question. Simon Galloway/LAT Images Khaby Lame's splashy $975 million deal is still on ice nine months after it was announced. Lame's plan to merge his business with a publicly traded firm was celebrated by creator economy insiders. The public company's stock price has fallen 99% since its January high. A new financial filing provides fresh details — and more questions — about a mysterious $975 million deal struck by TikTok's top star, Khaby Lame . On January 9, Lame — who has over 160 million followers — entered into an agreement that would theoretically net him a major payday and take his company public. The mechanism: a merger with the publicly traded Rich Sparkle Holdings , a financial printing firm based in Hong Kong. Then, in late January, Lame went silent on the merger. Now, we have an update: the deal is still on ice. A Rich Sparkle financial filing on September 30, its first since March, described the deal as conditional on a due diligence process, a minimum valuation of Lame's company, and stock exchange approval. That's the same language that has appeared in previous filings. While the deal has been in limbo, Rich Sparkle's stock has plummeted 99% from its peak. In the wake of the announcement of the deal with Lame's company in January, the stock shot up to a high of about $180. On Thursday, it closed at $1.93. Several prominent brokerages had restricted or blocked trading in the stock , Business Insider exclusively reported in April. The original deal announcement was celebrated throughout the creator economy , since such rich valuations are rare among influencer-founded companies, and it would give everyday investors an unusual opportunity to directly bet on a creator. The high profile of Lame, a Senegalese-Italian creator who rose to fame from dialogue-free comedy videos, means the outcome of the deal could impact how investors assess the viability of backing businesses centered on individual creators. The January deal terms promised Lame's company 75 million shares, which would be worth about $145 million at Thursday's closing share price. The initial agreement had valued that stake at $975 million. Rich Sparkle and Lame did not respond to multiple requests for comment. At the time of the original announcement, Rich Sparkle said that it planned to create an AI avatar of Lame to do brand deals and sell products on social media. It projected this business could drive ", "date_str": "2026-10-16T11:45:01+00:00", "hash": "07f2cfdf674c63ab", "title_fa": "جزئیات جدید در مورد معامله 975 میلیون دلاری Khaby Lame معما را عمیق تر می کند", "summary_fa": "Khaby Lame شراکت های دیگری را دنبال می کند زیرا حقوق بزرگ او همچنان زیر سوال است. Simon Galloway/LAT Images قرارداد پرشور 975 میلیون دلاری Khaby Lame با گذشت 9 ماه از اعلام آن هنوز روی یخ باقی مانده است. برنامه لِم برای ادغام کسب و کارش با یک شرکت سهامی عام مورد تجلیل صاحبان اقتصاد خلاق قرار گرفت. قیمت سهام شرکت سهامی عام از اوج خود در ژانویه 99 درصد کاهش یافته است. یک پرونده مالی جدید جزئیات تازه - و سؤالات بیشتری - در مورد معامله مرموز 975 میلیون دلاری توسط خابی لم، ستاره برتر TikTok ارائه می دهد. در 9 ژانویه، لم - که بیش از 160 میلیون فالوور دارد - قراردادی را امضا کرد که از نظر تئوری، درآمد بزرگی را برای او به ارمغان می‌آورد و شرکتش را عمومی می‌کند. مکانیسم: ادغام با شرکت سهامی عام Rich Sparkle Holdings، یک شرکت چاپ مالی مستقر در هنگ کنگ. سپس، در اواخر ژانویه، Lame در مورد ادغام سکوت کرد. اکنون، ما یک به‌روزرسانی داریم: معامله هنوز روی کار است. یک پرونده مالی Rich Sparkle در 30 سپتامبر، که اولین آن از ماه مارس بود، این معامله را مشروط به فرآیند بررسی دقیق، حداقل ارزش گذاری شرکت Lame و تایید بورس اوراق بهادار توصیف کرد. این همان زبانی است که در پرونده های قبلی آمده است. در حالی که معامله در هاله ای از ابهام قرار داشت، سهام Rich Sparkle نسبت به اوج خود 99 درصد سقوط کرد. در پی اعلام معامله با شرکت Lame در ژانویه، ارزش سهام به بالای حدود 180 دلار رسید. در روز پنجشنبه، قیمت 1.93 دلار بسته شد. بیزینس اینسایدر به طور انحصاری در ماه آوریل گزارش داد که چندین کارگزاری برجسته معاملات سهام را محدود یا مسدود کرده بودند. اعلام معامله اولیه در سراسر اقتصاد سازنده جشن گرفته شد، زیرا چنین ارزش‌گذاری‌های"}, {"source": "Business Insider", "title": "26% of Americans say influencers have swayed their vote. Political campaigns are racing to win them over.", "link": "https://www.businessinsider.com/one-in-four-americans-say-creator-content-influenced-their-vote-2026-10", "summary": "YouTuber Jake Paul joined President Trump for an Ohio rally ahead of the midterm elections. Aaron Schwartz/Stringer/Getty; BI The battle for voters in the 2026 midterm elections is playing out on the TikTok For You Page. One in four Americans say creator content has influenced who they voted for. Political candidates are scrambling to connect with more creators in order to reach voters. Content creators are influencing much more than our coffee orders and skincare routines. About one in four Americans (26%) say influencer content has affected who they've voted for, according to a survey of around 2,000 US adults conducted by Morning Consult in September, commissioned by Business Insider. Creator content is an \"underestimated avenue\" for political campaigns, said Nicole Dunger, a founding partner at the marketing firm People First, which works with candidates and advocacy groups on their creator strategies. \"It is a real player and a big player in this space now.\" If 2024 was the podcast election , 2026 is shaping up to be the influencer one. Instagram and TikTok creators have joined Fox News hosts and personalities like Joe Rogan as go-to sources of information for voters. Influencers like Jake Paul and Hasan Piker have emerged as main characters in politics this year. Paul recently joined President Donald Trump in Ohio for a midterm rally, posting TikTok clips of his Air Force One flight. Piker, meanwhile, has become a campaign ally for progressives like Michigan's Abdul El-Sayed and a negative talking point for Fox News commentators. As online attention has become a key asset in politics , influencers are helping candidates break through the noise. A little over half of US adults (56%) told Morning Consult that creator content had affected their views on political or social issues to some degree. That figure jumped among Gen Z respondents, where close to three in four respondents said their views had been swayed by influencer posts. For campaigns, the challenge is identifying the right creators to work with, particularly when many influencers don't regularly talk about politics. \"You have to have your base of people, your core supporters, and then you have to have a broader cultural space of people who don't always talk about politics,\" said Parker Butler, a managing partner at the digital strategy firm Luminary Strategies, which works on social strategy with Democratic candidates like James Talarico. \"It's worth having different pockets of creators for ", "date_str": "2026-10-16T11:30:01+00:00", "hash": "121f9cb62b6f6e98", "title_fa": "26 درصد از آمریکایی ها می گویند اینفلوئنسرها رای آنها را تحت تاثیر قرار داده اند. مبارزات سیاسی برای جلب نظر آنها در حال رقابت هستند.", "summary_fa": "جیک پل، یوتیوب‌بر، به پرزیدنت ترامپ برای گردهمایی اوهایو پیش از انتخابات میان‌دوره‌ای پیوست. آرون شوارتز/استرینگر/گتی; BI نبرد برای رأی دهندگان در انتخابات میان دوره ای 2026 در صفحه TikTok For You در حال انجام است. از هر چهار آمریکایی، یک نفر می‌گوید محتوای سازندگان روی افرادی که به آنها رأی داده‌اند، تأثیر گذاشته است. نامزدهای سیاسی در تلاش هستند تا با سازندگان بیشتری ارتباط برقرار کنند تا به رای دهندگان دست یابند. سازندگان محتوا بسیار بیشتر از سفارشات قهوه و روتین های مراقبت از پوست ما تأثیر می گذارند. بر اساس نظرسنجی انجام شده توسط Morning Consult در ماه سپتامبر، به سفارش Business Insider، از هر چهار آمریکایی یک نفر (26٪) می گویند محتوای اینفلوئنسر روی افرادی که به آنها رای داده اند تأثیر گذاشته است. نیکول دانگر، شریک موسس در شرکت بازاریابی People First که با نامزدها و گروه‌های مدافع در مورد استراتژی‌های سازنده‌شان کار می‌کند، گفت: محتوای خالق یک «مسیر دست کم‌گرفته‌شده» برای کمپین‌های سیاسی است. اکنون در این فضا یک بازیکن واقعی و یک بازیکن بزرگ است. اگر سال 2024 انتخابات پادکست بود، سال 2026 در حال شکل گیری یک تأثیرگذار است. خالقان اینستاگرام و TikTok به مجریان فاکس نیوز و شخصیت هایی مانند جو روگان پیوسته اند تا منبع اطلاعاتی برای رای دهندگان باشند. اینفلوئنسرهایی مانند جیک پل و حسن پیکر به عنوان شخصیت های اصلی سیاست امسال ظاهر شده اند. پل اخیراً برای یک گردهمایی میان دوره ای به دونالد ترامپ رئیس جمهور آمریکا در اوهایو پیوست و کلیپ های TikTok از پرواز Air Force One خود را منتشر کرد. در همین حال، Piker به متحد کمپین مترقیانی مانند عبدالالسید از میشیگان و نقطه بحث منفی برای مفسران فاکس نیوز تبدیل شده است. از آنجایی که توجه آنلاین به یک دارایی کلیدی در سیاست تبدیل شده است، تأثیرگذاران به نامزدها کمک می کنند تا"}, {"source": "Business Insider", "title": "AI's need for data could breathe new life into a once-buzzy corner of Wall Street", "link": "https://www.businessinsider.com/ai-companies-race-to-acquire-workplace-data-for-models-2026-10", "summary": "Personal AI agents like Instinct are taking over the tech world. Dado Ruvic/REUTERS This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . The future of AI might rely on getting your Slack DMs. It's not just your DMs, to be clear. It's internal memos, transaction records, contracts, and even that onboarding guide you probably didn't read when you started your job. Basically, if it's work-related and has been documented, AI companies are interested. The rationale is straightforward: If AI tools are going to automate work, they need a deep understanding of what the work is. BI did a deep dive on AI companies' race to scoop up as much data as possible in its series \" The AI Data Grab .\" BI's Charles Rollet, Tom Carter, and Stephen Council first unpacked the wild market that's sprung up for this data. Things move quickly, including \"exploding offers.\" Others are figuring out how to leverage their databases. Law firms, which often have detailed archives, are a great example. BI's Melia Robinson has more on that . And sometimes it's about actually creating the data yourself. That's the case in robotics, writes BI's Rya Jetha. Companies are shelling out big to have people record everyday tasks like cooking and cleaning . AI's data push could renew interest in a space that's already navigated an info-hungry industry. Alternative data, unstructured datasets such as satellite imagery and card transactions, became a hot commodity on Wall Street in the mid-2010s. These non-traditional datasets are supposed to give investors an edge. Want to know if Home Depot will beat earnings estimates? Analyze satellite images of its parking lots to see whether foot traffic is rising or declining. When I covered the space closely with my colleague Bradley Saacks, the data providers often highlighted that the real market opportunity was selling into big corporates . Hedge funds might be rich, but there are only so many of them to go around. The market also has a ceiling. If too many people are trading off the same datasets, you lose your potential edge. AI's data needs can fill the gap alt-data providers hoped corporates would. And unlike hedge funds interested in real-time, market-relevant data, these firms benefit from a wider, deeper catalog. Some players already see an opportunity. When former Point72 data wizard Kirk McKeown launched a data startup last year, he told Bradley it aimed to package data", "date_str": "2026-10-16T11:18:06+00:00", "hash": "e5f36c106fa2465c", "title_fa": "نیاز هوش مصنوعی به داده ها می تواند جان تازه ای به گوشه ای از وال استریت که زمانی پر هیاهو بود، بدهد", "summary_fa": "عوامل هوش مصنوعی شخصی مانند Instinct در حال تسلط بر دنیای فناوری هستند. Dado Ruvic/REUTERS این پست در اصل در خبرنامه Business Insider Today منتشر شده است. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. آینده هوش مصنوعی ممکن است متکی به دریافت Slack DM شما باشد. برای روشن شدن موضوع فقط DM شما نیست. این یادداشت‌های داخلی، سوابق تراکنش‌ها، قراردادها و حتی آن راهنمای ورود به سیستم است که احتمالاً هنگام شروع کارتان آن را نخوانده‌اید. اساساً، اگر مربوط به کار باشد و مستند شده باشد، شرکت های هوش مصنوعی علاقه مند هستند. منطق ساده است: اگر ابزارهای هوش مصنوعی می‌خواهند کار را خودکار کنند، به درک عمیقی از کار نیاز دارند. BI در سری خود \"The AI ​​Data Grab\" در مسابقه شرکت‌های هوش مصنوعی برای جمع‌آوری هرچه بیشتر داده‌های ممکن تحقیق کرد. چارلز رولت، تام کارتر و شورای استفان از BI ابتدا بازار وحشی را که برای این داده‌ها به وجود آمده بود، باز کردند. همه چیز به سرعت پیش می رود، از جمله \"انفجار پیشنهادات\". دیگران در حال کشف چگونگی استفاده از پایگاه داده خود هستند. شرکت های حقوقی، که اغلب دارای آرشیوهای دقیق هستند، نمونه بسیار خوبی هستند. ملیا رابینسون از BI اطلاعات بیشتری در این مورد دارد. و گاهی اوقات این در مورد ایجاد داده ها توسط خودتان است. Rya Jetha از BI می نویسد که این مورد در رباتیک است. شرکت ها هزینه های زیادی می کنند تا مردم کارهای روزمره مانند پخت و پز و نظافت را ضبط کنند. فشار داده‌های هوش مصنوعی می‌تواند علاقه‌مندی به فضایی را که قبلاً در یک صنعت تشنه اطلاعات حرکت کرده است، تجدید کند. داده های جایگزین، مجموعه داده های بدون ساختار مانند تصاویر ماهواره ای و تراکنش های کارت، در اواسط دهه 2010 به کالایی داغ در وال استریت تبدیل شد. قرار"}, {"source": "Business Insider", "title": "The world reacts to Elon Musk’s flying car", "link": "https://www.businessinsider.com/reactions-elon-musk-roadster-flying-car-2026-10", "summary": "Tesla unveiled a new iteration of the Roadster that can travel upside down. Tesla Elon Musk's Tesla unveiled its new car, the Roadster, on Thursday. In its demonstration, the car took flight using thrusters and performed kickflips. Here's what smart people in tech and business have to say about it. Tesla’s long-delayed Roadster finally made an entrance — by flying off a ramp. At a livestreamed event Thursday night, the sports car climbed a curved ramp until it was upside down, launched into the air, flipped, and landed on its wheels, apparently aided by thrusters beneath the vehicle. “Well, it worked,” Elon Musk said during the livestream. Musk said Tesla and SpaceX engineers collaborated on the car, which uses high-pressure air and thrusters to lift itself off the ground. Tesla also showed a recorded demonstration in which the Roadster reached 60 mph in 0.81 seconds. While the legality of such a device on public roads remains in question, the tech world is reacting to Musk's new creation with awe. Here is what the leading voices in business and tech are saying about the new Roadster. Jason Calacanis Bloomberg/Getty Images Angel investor Jason Calacanis said in an X post that the videos of the flying car looked like \"science fiction,\" and they're real, although they don't seem to be. He seemed enthused by the demonstration, asking that while the car was only airborne for a couple of seconds, \"what if it could keep you in the air for five minutes? Or ten? Or 30?\" Gene Munster Brian Ach/Getty Images for LocationWorld 2016 Gene Munster , the managing partner at Deepwater Asset Management and a longtime tech analyst, wrote his two takeaways from the Roadster event on X. First, that \"it was an engineering flex with no commercial value beyond embarrassing traditional car makers.\" And the second was that it signaled Musk's ambition to merge his two publicly traded companies, SpaceX and Tesla. John Carmack John Carmack said he s happy to get the Roadster without the thrusters. credit should read GABRIELLE LURIE/AFP via Getty Images John Carmack , the former CTO of Meta's virtual reality division, politely rejected the flying car. \"That demo involved a non trivial chance of embarrassing failure!\" he wrote on X. He added, \"I'm only going for the baseline model. At this point in my life, rocket bunny hops are out of my comfort zone.\" Marques Brownlee MKBHD Chance Yeh/Getty Images for HubSpot Tech YouTuber Marques Brownlee , better known as MKBHD, appeared incredulous", "date_str": "2026-10-16T11:01:07+00:00", "hash": "bda3e894f3ea5bd2", "title_fa": "واکنش جهان به ماشین پرنده ایلان ماسک", "summary_fa": "تسلا از نسخه جدیدی از رودستر رونمایی کرد که می تواند وارونه حرکت کند. تسلا ایلان ماسک از خودروی جدید خود، رودستر، روز پنجشنبه رونمایی کرد. در نمایش خود، این خودرو با استفاده از رانشگرها پرواز کرد و ضربات پا را انجام داد. در اینجا آنچه افراد باهوش در زمینه فناوری و تجارت در مورد آن می گویند، آمده است. رودستر تسلا که مدت ها تأخیر داشت، سرانجام با پرواز از یک سطح شیب دار وارد شد. در یک رویداد پخش زنده پنجشنبه شب، خودروی اسپرت از یک سطح شیبدار خمیده بالا رفت تا اینکه وارونه شد، به هوا پرتاب شد، واژگون شد و روی چرخ‌هایش فرود آمد، ظاهراً با کمک رانشگرهای زیر خودرو. ایلان ماسک در جریان پخش زنده گفت: \"خب، کار کرد.\" ماسک گفت مهندسان تسلا و اسپیس ایکس در ساخت این خودرو که از هوای پرفشار و رانشگرها برای بلند کردن خود از روی زمین استفاده می کند، همکاری کردند. تسلا همچنین یک نمایش ضبط شده را نشان داد که در آن رودستر در 0.81 ثانیه به سرعت 60 مایل در ساعت رسید. در حالی که قانونی بودن چنین وسیله ای در جاده های عمومی زیر سوال است، دنیای فناوری با هیبت به ساخته جدید ماسک واکنش نشان می دهد. این چیزی است که صداهای پیشرو در تجارت و فناوری در مورد رودستر جدید می گویند. جیسون کالاکانیس بلومبرگ/گتی ایماژ، سرمایه گذار فرشته، جیسون کالاکانیس، در پست ایکس گفت که ویدیوهای این خودروی پرنده شبیه \"علمی تخیلی\" هستند و واقعی هستند، اگرچه به نظر نمی رسد. به نظر می رسید که او از تظاهرات مشتاق شده بود، و از او پرسید که در حالی که ماشین فقط چند ثانیه در هوا بود، \"اگر بتواند شما را به مدت پنج دقیقه در هوا نگه دارد؟ یا ده دقیقه؟ یا 30؟ Gene Munster Brian Ach/Getty Images for LocationWorld 2016"}, {"source": "Business Insider", "title": "Microsoft president warns Trump's immigration crackdown could drive top AI talent abroad", "link": "https://www.businessinsider.com/microsoft-president-pushes-back-trump-immigration-crackdown-ai-talent-visas-2026-10", "summary": "Brad Smith, the president of Microsoft, defended the company s use of visas and green cards. Paulo Nunes dos Santos/Bloomberg via Getty Images Microsoft President Brad Smith warned that US immigration policies could drive AI talent overseas. \"Let's not put that at risk,\" Smith said. The Trump administration recently suspended Microsoft and other tech firms from a green card program. If America wants to win the AI race, sending the world's brightest engineers packing might not be a winning strategy. That's the warning from Microsoft President Brad Smith, who said the Trump administration's immigration crackdown risks driving the next generation of AI talent away from the United States. \"I think we should all be worried about sending intentionally or inadvertently or otherwise, signals that send the most talented next wave of AI software engineers to other countries rather than the United States,\" Smith said in an episode of Politico's \"The Decoded Podcast\" that aired on Thursday. His comments come after the Trump administration announced last week that it was suspending Microsoft, Adobe, and several other technology companies from a federal program that sponsors foreign workers for permanent residency. Vice President JD Vance accused Microsoft of abusing the Permanent Labor Certification, or PERM, program by laying off American employees while hiring lower-paid foreign workers. Smith, who Business Insider reported was recently put in charge of Microsoft's communications , pushed back against those allegations, saying the administration had presented a misleading picture of Microsoft's hiring practices. US Vice President JD Vance has criticized Microsoft s use of visa programs. Daniel Heuer-Pool/Getty Images \"What was presented as Microsoft replacing 6,000 people who lost their jobs with 9,000 foreigners was frankly completely off base,\" he said. Smith said most of the company's visa and green card applications concerned existing employees rather than new hires, adding that Microsoft had hired 9,200 American workers in its last fiscal year. \"That was left out of the narrative,\" he said. He also rejected suggestions that Microsoft pays foreign workers less than their American counterparts, saying employees are compensated under the same system regardless of immigration status. The American dream, on hold The dispute comes amid growing uncertainty for skilled foreign workers in the US. As part of our ongoing H-1B Fallout series , Business Insider previously re", "date_str": "2026-10-16T10:46:42+00:00", "hash": "0fabb1efc16666b0", "title_fa": "رئیس مایکروسافت هشدار داد که سرکوب مهاجرت ترامپ می تواند استعدادهای برتر هوش مصنوعی را به خارج از کشور هدایت کند", "summary_fa": "برد اسمیت، رئیس مایکروسافت، از استفاده این شرکت از ویزا و گرین کارت دفاع کرد. پائولو نونس دوس سانتوس/ بلومبرگ از طریق گتی ایماژ، رئیس مایکروسافت، برد اسمیت هشدار داد که سیاست های مهاجرتی ایالات متحده می تواند استعدادهای هوش مصنوعی را به خارج از کشور سوق دهد. اسمیت گفت: «بیایید آن را در معرض خطر قرار ندهیم. دولت ترامپ اخیراً مایکروسافت و سایر شرکت های فناوری را از برنامه گرین کارت تعلیق کرد. اگر آمریکا بخواهد در مسابقه هوش مصنوعی پیروز شود، فرستادن باهوش ترین مهندسان جهان برای بسته بندی ممکن است یک استراتژی برنده نباشد. این هشدار برد اسمیت رئیس مایکروسافت است که گفت سرکوب مهاجرت توسط دولت ترامپ خطر فرار نسل بعدی استعدادهای هوش مصنوعی را از ایالات متحده دارد. اسمیت در قسمتی از پادکست رمزگشایی شده پولیتیکو که روز پنجشنبه پخش شد، گفت: \"من فکر می کنم همه ما باید نگران ارسال عمدی یا سهوی یا غیرعمد سیگنال هایی باشیم که مستعدترین موج بعدی مهندسین نرم افزار هوش مصنوعی را به جای ایالات متحده به کشورهای دیگر می فرستد.\" اظهارات وی پس از آن بیان شد که دولت ترامپ هفته گذشته اعلام کرد که مایکروسافت، ادوبی و چندین شرکت فناوری دیگر را از برنامه فدرال که حامی مالی کارگران خارجی برای اقامت دائم است، معلق می کند. معاون رئیس جمهور جی دی ونس مایکروسافت را به سوء استفاده از برنامه گواهینامه کار دائم یا PERM با اخراج کارمندان آمریکایی در حالی که کارگران خارجی با حقوق کمتری استخدام می کند، متهم کرد. اسمیت، که Business Insider گزارش داد اخیراً مسئول ارتباطات مایکروسافت شده است، از این اتهامات عقب نشینی کرد و گفت که دولت تصویری گمراه کننده از شیوه های استخدام مایکروسافت ارائه کرده است. معاون رئیس جمهور ایالات متحده جی دی ونس از استفاده مایکروسافت از برنامه های ویزا انتقاد کرده است. دانیل هویرپول/ گتی"}, {"source": "Business Insider", "title": "I took a 20% pay cut for 8 months so I could spend an entire summer with my kids. It was worth it.", "link": "https://www.businessinsider.com/took-pay-cut-time-off-summer-with-kids-2026-10", "summary": "The author took a 20% pay cut for more time off with her kids. Courtesy of Natalia Costa As my maternity leave after having my fourth child was ending, summer was starting. I wanted to spend the summer with my kids, and I looked for a solution. I ended up taking a 20% pay cut for 8 months for another 73 days off. Our fourth child was a happy surprise, and arrived on the scene when we were busy putting out metaphorical fires with our 4-year-old twins and our 2-year-old daughter, who seemed to spend most of their time playing and fighting. We felt like we already had a lot of kids. Not too many, but enough. When I learned I was pregnant, we asked ourselves, what was one more? As my maternity leave was ending, I still wanted more time Nine months later, the real party began. My maternity leave started coming to an end just as we were facing a very long summer: 12 weeks, from June 20 to September 8, with no school. We live in Spain, and were about to face one of those eternal Spanish summers I remember so well from my own childhood: long, hot days full of sand, sea, salt, swimming pools, and, yes, boredom. Our monthly expenses were already higher than ever (diapers, onesies, baby food, and all those brand-new baby things I'd previously gotten rid of because I thought we were done having kids). Still, I decided to take a 20% pay cut in exchange for more time, simply so I could get us through the summer. That decision meant more time with the baby, obviously, but also with the rest of my kids, who are still just older than babies themselves. The difference is that 40 years ago, in many families, one salary — usually the man's — could support a household . Today, both parents often need full-time jobs and want to have professional lives of their own. This is the case for us, and it's not particularly compatible with looking after four very young children for 12 weeks. Taking a pay cut gave me an extra 73 days off By agreeing to a 20% pay cut for eight months, I was able to combine my reduced working hours into 73 full days off instead of working shorter days each week. Together with my maternity leave, weekends, and public holidays, those extra days allowed me to stay home with my children much longer than I ever expected. I didn't have to return to work until my baby was 10 months old. It was a financial sacrifice, but it gave me something I couldn't put a price on: more time with my children. Face to face. It sounded stressful when I thought about it. In realit", "date_str": "2026-10-16T10:41:01+00:00", "hash": "d008e6ec094e4a55", "title_fa": "من به مدت 8 ماه حقوق خود را 20 درصد کاهش دادم تا بتوانم یک تابستان کامل را با بچه هایم بگذرانم. ارزشش را داشت.", "summary_fa": "نویسنده برای مرخصی بیشتر با فرزندانش 20 درصد دستمزد را کاهش داد. با حسن نیت از ناتالیا کاستا با پایان یافتن مرخصی زایمان من پس از تولد چهارمین فرزندم، تابستان شروع شد. می خواستم تابستان را با بچه هایم بگذرانم و دنبال راه حلی می گشتم. من در نهایت به مدت 8 ماه برای 73 روز دیگر مرخصی 20٪ حقوق دریافت کردم. فرزند چهارم ما یک سورپرایز خوشحال کننده بود و زمانی به صحنه رسید که ما با دوقلوهای 4 ساله و دختر 2 ساله مان که به نظر می رسید بیشتر وقت خود را صرف بازی و دعوا می کردند، مشغول خاموش کردن آتش استعاری بودیم. ما احساس می کردیم که قبلاً بچه های زیادی داریم. زیاد نیست، اما کافی است. وقتی فهمیدم باردار هستم از خود پرسیدیم یکی دیگر چیست؟ از آنجایی که مرخصی زایمانم تمام می شد، هنوز زمان بیشتری می خواستم نه ماه بعد، جشن واقعی شروع شد. مرخصی زایمان من درست زمانی که با یک تابستان بسیار طولانی روبرو بودیم به پایان رسید: 12 هفته، از 20 ژوئن تا 8 سپتامبر، بدون مدرسه. ما در اسپانیا زندگی می کنیم و نزدیک بود با یکی از آن تابستان های ابدی اسپانیا روبرو شویم که از دوران کودکی خود به خوبی به یاد دارم: روزهای طولانی و گرم پر از شن، دریا، نمک، استخر، و بله، خستگی. مخارج ماهانه ما قبلاً بیشتر از همیشه بود (پوشک، پوشک، غذای کودک، و همه آن چیزهای کاملاً جدید نوزادی که قبلاً از شر آنها خلاص شده بودم، زیرا فکر می کردم بچه دار شدن ما تمام شده است). با این حال، تصمیم گرفتم در ازای زمان بیشتر، 20 درصد از حقوق خود را کاهش دهم، تا بتوانم تابستان را پشت سر بگذارم. بدیهی است که این تصمیم به معنای زمان بیشتری با کودک بود، اما همچنین با بقیه بچه های"}, {"source": "Business Insider", "title": "Tesla's new Roadster will be a tiny part of its business, but its launch sent the stock higher. Here's why.", "link": "https://www.businessinsider.com/tesla-share-price-jumps-after-roadster-reveal-boosts-investor-interest-2026-10", "summary": "Tesla s Roadster launch sent the stock flying — even if the car itself may barely move the earnings needle. Illustration by Budrul Chukrut/SOPA Images/LightRocket via Getty Images Tesla stock jumped in premarket trade after it unveiled its much-hyped new Roadster. The car won't drive big sales, but it does show off Tesla's tech chops. Gene Munster, a longtime Tesla bull, called the launch \"an engineering flex.\" Tesla stock popped after hours as Elon Musk unveiled its new Roadster — but not because investors expect big sales of the futuristic supercar. As a low-volume, high-end car, the Roadster won't be a major earnings driver and will be a tiny part of Tesla's business. Musk has long been clear that he doesn't see Tesla's future success in traditional cars, but in autonomous driving and humanoid robots. Tesla stock has rarely traded solely on near-term car sales. Tesla trades at about 215 times forward adjusted earnings, a valuation that reflects investor expectations for growth beyond its core car business. The demo of the Roadster's sci-fi features — like briefly lifting off the ground and performing aerial maneuvers using SpaceX-inspired cold-gas thrusters — was more about showing off the company's engineering muscles than attracting mass buyer interest. At SpaceX's test site in Texas, Tesla showed the Roadster performing jumps, rolls, and a controlled landing using cold-gas thrusters. The system uses high-pressure compressed air to generate short bursts of thrust and control, a technology that could have much wider applications, and appears to have piqued the interest of investors. Gene Munster, a longtime Tesla bull, said in an X post that the launch was \"an engineering flex with no commercial value beyond embarrassing traditional car makers.\" \"The Roadster event is the latest example of why Elon can't wait to bring Tesla and SpaceX together,\" Munster added. It is widely expected that Tesla and SpaceX, Musk's rocket company, will merge in the coming years, building on the world's richest man's plans to create a super company. Having traded more than 5% higher premarket, the stock was marginally up after Friday's open, gaining 1% in the minutes after the open. A departure from past product launches Tesla's previous product launches have not always impressed investors. Shares fell about 6% after the 2019 Cybertruck unveiling, when the vehicle's supposedly shatterproof windows cracked during a live demonstration. They also dropped 9% after Tesla's 2024 ", "date_str": "2026-10-16T10:38:04+00:00", "hash": "fdcf81d0e902762d", "title_fa": "رودستر جدید تسلا بخش کوچکی از تجارت آن خواهد بود، اما عرضه آن باعث افزایش سهام شد. در اینجا دلیل آن است.", "summary_fa": "پرتاب رودستر تسلا باعث شد سهام به پرواز درآید - حتی اگر خود خودرو به سختی سوزن درآمد را حرکت دهد. تصویر
