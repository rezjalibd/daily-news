80x853.jpg?rect=0,91,1280,672&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۵ آبان • ۱۸:۳۶"}, {"source": "Radio Farda", "title": "گسترش دامنه تهدید بمب‌گذاری در اروپا؛ تحریریه چند رسانه ایمیل تهدیدآمیز دریافت کردند", "link": "https://www.radiofarda.com/a/bomb-threats-warning-the-clock-is-ticking-disrupt-tv-channels-across-europe/33892423.html", "summary": "شبکه رادیو و تلویزیون ملی ایرلند، شبکه اسکای بریتانیا، شبکه خصوصی نووا در بلغارستان و چند رسانه دیگر اعلام کردند که پیام‌های تهدیدآمیز دریافت کرده‌اند.", "date_str": "2026-11-06T15:35:10+00:00", "hash": "9ebaddf13cbdcb10", "title_fa": "گسترش دامنه تهدید بمب‌گذاری در اروپا؛ تحریریه چند رسانه ایمیل تهدیدآمیز دریافت کردند", "summary_fa": "شبکه رادیو و تلویزیون ملی ایرلند، شبکه اسکای بریتانیا، شبکه خصوصی نووا در بلغارستان و چند رسانه دیگر اعلام کردند که پیام‌های تهدیدآمیز دریافت کرده‌اند. دامنه تهدیدهای بمب‌گذاری در قاره اروپا روز جمعه ۱۵ آبان به اهداف تازه‌ای گسترش یافت و پس از ارسال ایمیل‌های حاوی تهدید بمب‌گذاری به تحریریه چند رسانه، کارکنان این رسانه‌ها تخلیه شدند. تهدیدهای بمب‌گذاری با هشدار «زمان در حال سپری‌شدن است»، روز جمعه برای شبکه‌های تلویزیونی در سراسر اروپا ارسال شد و به تخلیه ساختمان‌ها و توقف پخش برنامه‌های برخی از این شبکه‌ها انجامید. پخش برنامه‌های شبکه رادیو و تلویزیون ملی ایرلند با موسیقی و پیام‌های از پیش ضبط‌شده جایگزین شد و پخش برخی برنامه‌ها تا سه ساعت متوقف ماند. این هشدارها پس از موجی از تهدیدهای دروغین بمب‌گذاری مطرح شده‌اند که در روزهای اخیر پروازهای مسافربری را از صربستان تا فنلاند، اسپانیا و دیگر کشورهای اروپایی مختل کرده‌اند. این تهدیدها موجب تغییر مسیر پروازها، فرودهای اضطراری و بازرسی‌های امنیتی شده‌اند، هرچند تاکنون هیچ ماده منفجره‌ای کشف نشده است. این حوادث همچنین در شرایطی رخ می‌دهد که نگرانی‌ها درباره کلاهبرداری‌های اینترنتی و حملات سایبری در هفته‌های اخیر، از جمله حملات به فروشگاه‌های زنجیره‌ای، افزایش یافته است. در یکی از ایمیل‌هایی که روز جمعه به شبکه‌های نووا و آر‌تی‌ای ارسال شد، آمده بود: «می‌خواهیم تمام جهان درباره ما بداند. به همین دلیل، یکی از عوامل ما یک وسیله انفجاری در ساختمان شما کار گذاشته است.» در ادامه این پیام نوشته شده بود: «این وسیله تا ۴۵ دقیقه دیگر منفجر خواهد شد. زمان در حال سپری‌شدن است.» با این حال هنوز مشخص نیست چه کسی پشت تهدیدهای دروغین روز جمعه قرار دارد. ایمیل‌های ارسال‌شده به شبکه‌های رادیو و تلویزیون ایرلند و نووا با نام «میخائیل آندروپوف» امضا شده بودند. نویسنده این پیام‌ها مدعی شده بود که یکی از رهبران گروهی است که مسئول تهدیدهای دروغین علیه هواپیماها", "image_url": "https://gdb.rferl.org/38565a8a-4cfe-4964-4f98-08df13aec0bb_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۱۹:۰۵"}, {"source": "IranWire", "title": "علی باقری کنی: جمهوری اسلامی این‌بار به تعهدات کاغذی آمریکا اکتفا نمی‌کند", "link": "https://iranwire.com/fa/news-1/159888-%D8%B9%D9%84%DB%8C-%D8%A8%D8%A7%D9%82%D8%B1%DB%8C-%DA%A9%D9%86%DB%8C-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D8%A7%DB%8C%D9%86%D8%A8%D8%A7%D8%B1-%D8%A8%D9%87-%D8%AA%D8%B9%D9%87%D8%AF%D8%A7%D8%AA-%DA%A9%D8%A7%D8%BA%D8%B0%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D8%A7%DA%A9%D8%AA%D9%81%D8%A7-%D9%86%D9%85%DB%8C%DA%A9%D9%86%D8%AF/", "summary": "«علی باقری کنی» معاون دبیر شورای عالی امنیت ملی ایران می‌گوید جمهوری اسلامی برای ورود به مرحله تازه‌ای از دیپلماسی با آمریکا قرار نیست ب ...", "date_str": "2026-11-06T14:31:12+00:00", "hash": "3f7ca95f7649aaa9", "title_fa": "علی باقری کنی: جمهوری اسلامی این‌بار به تعهدات کاغذی آمریکا اکتفا نمی‌کند", "summary_fa": "«علی باقری کنی» معاون دبیر شورای عالی امنیت ملی ایران می‌گوید جمهوری اسلامی برای ورود به مرحله تازه‌ای از دیپلماسی با آمریکا قرار نیست ب ... این مقام عالی جمهوری اسلامی روز جمعه ۱۵ آبان۱۴۰۵ در گفت‌وگو با خبرگزاری صداوسیما، آمریکا را متهم کرد که طی یک سال‌ونیم گذشته، چهار بار روند مذاکرات با جمهوری اسلامی را با «اقدامات خصمانه و نقض عهد» بر هم زده و در ادامه گفت: «این حق جمهوری اسلامی است که برای ورود به یک عرصهٔ دیپلماسی جدید، دیگر به تعهدات کاغذی آمریکایی‌ها اکتفا نکند.» باقری کنی بر این‌که حکومت ایران باید «اقدامات عملی را از سوی آمریکایی‌ها» ببیند تاکید کرد و گفت در صورت تحقق این اقدامات، زمینه برای «گشایش سرفصل جدید» در روند دیپلماسی فراهم خواهد شد. این اظهارات در شرایطی مطرح می‌شود که تماس‌های غیر مستقیم تهران و واشنگتن با میانجی‌گری کشورهای منطقه از جمله قطر ادامه دارد، اما اختلاف بر سر ترتیب اجرای تعهدات و شروط ایران برای ازسرگیری مذاکرات همچنان پابرجاست. قطر، میانجی گفت‌وگوهای دیپلماتیک میان ایران و آمریکا، روز ۱۵آبان سال جاری اعلام کرد که «تمیم بن حمد آل ثانی»، امیر این کشور، در گفت‌وگوی تلفنی با «دونالد ترامپ»، رییس‌جمهور آمریکا، دربارهٔ تلاش‌های میانجی‌گرانه برای پایان دادن به بحران منطقه رایزنی کرده است. خبرگزاری رسمی قطر گزارش داده که هر دو طرف درباره ابتکارهای دوحه برای نزدیک کردن مواضع طرف‌های درگیر و پیشبرد مذاکرات با هدف دستیابی به توافقی جامع گفت‌وگو کردند. امیر قطر همچنین بر اهمیت ادامه گفت‌وگو و استفاده از راهکارهای دیپلماتیک برای حل اختلافات و جلوگیری از تشدید تنش‌ها تأکید کرد. همزمان تهدیدهای نظامی تهران و واشنگتن علیه هم شدت گرفته است. شامگاه پنجشنبه ۱۴آبان۱۴۰۵ دونالد ترامپ از احتمال از سرگیری حملات گسترده به ایران سخن گفت و تأکید کرد که تصمیم خود را به‌زودی اعلام می‌کند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/1848668_632_MzUT__v1024x512__box_0%2C22%2C1199%2C653.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۱۵ آبان • ۱۸:۰۱"}, {"source": "Independent Persian", "title": "رامایانا بالیوود را وارد رقابت فیلم‌های حماسی عظیم کرد", "link": "https://www.independentpersian.com/node/423071/%D9%81%D8%B1%D9%87%D9%86%DA%AF-%D9%88-%D9%87%D9%86%D8%B1/%D9%81%DB%8C%D9%84%D9%85/%D8%B1%D8%A7%D9%85%D8%A7%DB%8C%D8%A7%D9%86%D8%A7-%D8%A8%D8%A7%D9%84%DB%8C%D9%88%D9%88%D8%AF-%D8%B1%D8%A7-%D9%88%D8%A7%D8%B1%D8%AF-%D8%B1%D9%82%D8%A7%D8%A8%D8%AA-%D9%81%DB%8C%D9%84%D9%85%E2%80%8C%D9%87%D8%A7%DB%8C-%D8%AD%D9%85%D8%A7%D8%B3%DB%8C-%D8%B9%D8%B8%DB%8C%D9%85-%DA%A9%D8%B1%D8%AF", "summary": "در آستانهٔ جشن دیوالی، جشن نور و یکی از مهم‌ترین مناسبت‌های مذهبی و       tech: [{"source": "TechCrunch AI", "title": "Ramp data shows AI spending stalling just as Anthropic nears its IPO", "link": "https://techcrunch.com/2026/11/06/ramp-data-shows-ai-spending-stalling-just-as-anthropic-nears-its-ipo/", "summary": "AI usage keeps climbing, but spending has stalled. Price cuts and smarter cost controls among the biggest spenders could challenge investor assumptions about AI hypergrowth.", "date_str": "2026-11-06T15:54:47+00:00", "hash": "eeb0a9b3b7fb8c12", "title_fa": "داده‌های Ramp نشان می‌دهد که هزینه‌های هوش مصنوعی درست زمانی که آنتروپیک به عرضه اولیه اولیه خود نزدیک می‌شود، متوقف شده است", "summary_fa": "استفاده از هوش مصنوعی همچنان در حال افزایش است، اما هزینه ها متوقف شده است. کاهش قیمت و کنترل هوشمندانه‌تر هزینه در میان بزرگ‌ترین هزینه‌کنندگان می‌تواند فرضیات سرمایه‌گذاران در مورد رشد بیش از حد هوش مصنوعی را به چالش بکشد. شرکت‌ها بیشتر از همیشه از هوش مصنوعی استفاده می‌کنند، اما هزینه بیشتری برای آن نمی‌کنند. گزارش جدیدی از Ramp نشان می‌دهد که هزینه‌های هوش مصنوعی در اواخر تابستان حتی با افزایش حجم توکن‌ها کاهش یافته است، نشانه‌ای از این که رقابت قیمت و مشتریان باهوش‌تر ممکن است درآمد را برای OpenAI و Anthropic محدود کنند. طبق داده های Ramp، هزینه توکن در ماه های آگوست و سپتامبر تنها 1.5 درصد رشد داشته است. برای مقایسه، در ماه جولای نسبت به ماه قبل 42 درصد رشد داشته است. همانطور که آنتروپیک برای عرضه اولیه سهام خود آماده می شود، داده ها نشان می دهد که سرمایه گذاران ممکن است اشتباه کنند که شرکت های هوش مصنوعی با سرعت سرسام آوری به رشد خود ادامه دهند. آرا خرازیان، اقتصاددان ارشد Ramp به TechCrunch گفت: «تقریباً کل هزینه‌های مربوط به هوش مصنوعی از سوی شرکت‌های فناوری با پشتوانه سرمایه‌گذاری و با رشد بالا است. تا زمانی که هزینه‌های هوش مصنوعی به افزایش خود ادامه دهد، خوب است، اما اگر به دلیل چیزی در بازار یا عامل دیگری شروع به کاهش کند، همه آنها به طور همزمان شروع به کاهش می‌کنند و این می‌تواند به اثرات آبشاری دیگری منجر شود.» خرازیان گفت که در حال حاضر شواهدی را می‌بیند که نشان می‌دهد 1 درصد از شرکت‌ها - که بیشترین \"تقویت هوش مصنوعی\" را دارند - در مخارج خود در ماه آگوست و سپتامبر اندکی لکنت داشته‌اند و به کمتر از 10000 دلار برای هر کارمندی رسیده‌اند که در اوج تابستان خود داشتند. او گفت، با وجود این واقعیت که ما شاهد افزایش حجم هستیم،", "image_url": "https://techcrunch.com/wp-content/uploads/2026/11/ara-stripe-5.png?resize=1200,779", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "سرمایه‌گذاری"], "datetime_fa": "۱۵ آبان • ۱۹:۲۴"}, {"source": "The Verge", "title": "This see-through camera lets photographers maintain eye contact with their subjects", "link": "https://www.theverge.com/tech/1028632/lutra-humans-of-authenticity-hoa-a1-transparent-digital-camera", "summary": "Lutra, a South Korean startup, has debuted a new brand called Humans of Authenticity (HOA) that's launching another screen-free digital camera that incorporates a large open viewfinder into its design, as spotted by PetaPixel . The camera is reminiscent of the Godox C100 but the HOA A1 positions its lens and sensor close to the center of its large viewfinder window so that a photographer can maintain eye contact with their subject, or feel more in the moment while framing a shot without staring at a screen. The HOA A1 First Edition is expected to launch on December 1st in a very limited run of just 100 units. Preorders haven't started yet, b … Read the full story at The Verge.", "date_str": "2026-11-06T15:33:03+00:00", "hash": "b6b96e74e58185ae", "title_fa": "این دوربین شفاف به عکاسان اجازه می‌دهد با سوژه‌های خود ارتباط چشمی داشته باشند", "summary_fa": "Lutra، یک استارت آپ کره جنوبی، نام تجاری جدیدی به نام Humans of Authenticity (HOA) معرفی کرده است که در حال راه اندازی یک دوربین دیجیتال بدون صفحه نمایش دیگر است که یک منظره یاب باز بزرگ را در طراحی خود گنجانده است، همانطور که توسط PetaPixel مشاهده شده است. این دوربین یادآور Godox C100 است، اما HOA A1 لنز و سنسور خود را نزدیک به مرکز پنجره بزرگ منظره یاب خود قرار می‌دهد تا عکاس بتواند تماس چشمی با سوژه خود داشته باشد، یا هنگام کادربندی عکس بدون n economists anticipated. While that's good news for the economy, it points to tighter financial conditions on the horizon, which could be negative for risk assets like stocks. Investors see about an 80% chance the Fed will raise rates another quarter-point next month, up from 73% before the jobs report, according to CME FedWatch. Treasury yields rose after the data. US Treasury Yield Change (in basis points) 2 year 4.53% +6 5 year 4.65% +5 10 year 4.86% +3 30 year 5.27% +2 Investors, however, are taking the positive labor data as a sign of economic strength, a welcome indicator as fears rise that a slowdown in AI development could hobble growth. \"Friday's stronger-than-expected jobs report is a relief, and suggests that the labor market", "date_str": "2026-11-06T15:16:39+00:00", "hash": "1ce9c6ec778d07e9", "title_fa": "پس از ترس از هوش مصنوعی که بدترین شکست در 19 ماه گذشته را به وجود آورد، سهام فناوری دوباره بازگشت", "summary_fa": "تیموتی آ. کلاری / خبرگزاری فرانسه از طریق گتی ایماژ، با افزایش شاخص های ایالات متحده، غوغا در مورد سهام هوش مصنوعی در روز جمعه کاهش یافت. برخی از سرمایه‌گذاران پس از بدترین روز فروش خرده‌فروشی از زمان همه‌گیری، کاهش تولید تراشه‌ها را خریداری می‌کنند. بازارها حتی گزارش قوی مشاغل ماه اکتبر را کنار گذاشتند، با دستاوردهای قوی که حاکی از افزایش احتمالی نرخ بهره است. حمام خون در سهام هوش مصنوعی روز جمعه متوقف شد. بخش فناوری در جلسه روز پنجشنبه تحت فشار قرار گرفت زیرا سرمایه گذاران در میان دوره ای پیروزی دموکرات ها را به دست آوردند و از احتمال توقف مرکز داده در ایالت های کلیدی وحشت داشتند. با پایان یافتن هفته، سرمایه‌گذاران کمی راحت‌تر نفس می‌کشیدند، و نام‌های فناوری صبح روز جمعه افزایش یافت، زیرا برخی از سرمایه‌گذاران کاهش تولید تراشه‌ها و سایر بخش‌های آسیب دیده تجارت هوش مصنوعی را خریدند. Nasdaq 100 بیش از 1% رشد کرد و S P 500 نیز افزایش یافت. سهام بلو چیپ، یک نقطه پرت، افت خود را افزایش دادند و داو پس از سقوط 1800 واحدی دیروز، 500 واحد دیگر افت کرد. این جایی است که شاخص های ایالات متحده در حدود ساعت 10 صبح ایستاده بودند. ET: SP 500: 7,429.57، افزایش 1٪ میانگین صنعتی داو جونز: 51,456.95، کاهش 0.13٪ (-66 واحد) نزدک 100: 27,230.89، افزایش 2.26٪ در اینجا برخی از حرکات قابل توجه در فناوری آمده است: شاخص شرکت حرکت امروز IREN IREN +20٪ Sandisk SNDK +10٪ Nebius NBIS +9٪ Roundhill Neocloud ETF NCLD +9٪ Vertiv VRT +8٪ Roundhill Memory ETF DRAM +7٪ Micron MU +7٪ Nvidia NVDA +6٪ CoreWeave CRWV +6٪ SpaceX SPCX +6٪ Intel INTC +5٪ iShares Semiconductor ETF SOXX +5٪ Broadco اقتصاد ایالات متحده در ماه گذشته 165000 حقوق و دستمزد اضافه کرد که بسیار بیشتر از پیش بینی اقتصاددانان است. اگرچه این خبر", "image_url": "https://i.insider.com/6aede7108f37e8e0b5baaa9f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "Meta", "تراشه"], "datetime_fa": "۱۵ آبان • ۱۸:۴۶"}, {"source": "Business Insider", "title": "I watched AI recreate a childhood video game in 5 seconds. It showed me what's next for AI agents.", "link": "https://www.businessinsider.com/fireworks-ai-asteroids-demo-faster-agents-2026-11", "summary": "The Fireworks AI conference in San Francisco Alistair Barr/Business Insider A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . I attended the Fireworks AI conference in San Francisco on Tuesday and met the company's VP of technology and strategy, Rob Ferguson. He showed me a stunning demo in which an AI model running on Fireworks' systems created a video game from scratch in about five seconds. (A LOT faster than Claude Code , by the way.) The game was Asteroids. Watching Rob play it brought childhood memories flooding back. I used to play Asteroids on my Oric-1 computer. My dad bought it because it was cheaper than a Commodore 64. (Yes, I'm still bitter.) I had to load the game using a cassette tape player, a process that took about 10 minutes. Now, an AI model can create the game, not just load it, in seconds. Why does this matter? Rob explained that speed is crucial if AI agents are going to handle tasks efficiently on our behalf. Today, working with AI agents often means waiting for them to finish something, occasionally nudging them along. It's called botsitting , and it's a drag. Faster AI models could change that. Instead of waiting around, we could watch agents complete tasks in seconds, without interrupting our flow of work. That's exactly what happened with Rob's demo. Asteroids appeared so quickly that he could immediately ask the AI to improve it, turning the game into 3-D and adding new weapons, including colorful lasers. He didn't just use AI to create Asteroids from scratch. He made it better, too. All in about 15 seconds. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-11-06T15:11:01+00:00", "hash": "c26dfb3ee276f53d", "title_fa": "من دیدم که هوش مصنوعی یک بازی ویدیویی دوران کودکی را در 5 ثانیه بازسازی کرد. این به من نشان داد که چه اتفاقی برای عوامل هوش مصنوعی خواهد افتاد.", "summary_fa": "", "image_url": "https://i.insider.com/6aed177e9270da3cc6668ab7?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۱۵ آبان • ۱۸:۴۱"}, {"source": "Business Insider", "title": "I thought staying in my college town after graduation would spare me the postgrad growing pains. It didn't.", "link": "https://www.businessinsider.com/stayed-in-college-town-after-graduating-still-lonely-postgrad-living-2026-11", "summary": "Postgrad life is still hard, even though I stayed in my college town after graduating. Siena Frolich I didn't feel ready to leave my college town after graduation, so I decided to stay. Surprisingly, living close to my friends didn't make the postgrad transition any easier. Even though staying in the same place doesn't freeze time, I've learned to love this new chapter. When I graduated from Texas Christian University last year, I didn't want to leave. I enjoyed my time at school so much, and the thought of parting ways with the community, the people, and the routine I had settled into over the past four years didn't sit right with me. I didn't want to stop visiting the Stockyards for group dinners and rodeos, walking along the Trinity River at sunset, or attending the church I'd frequented for so many years. Plus, I felt there was more to experience in Fort Worth beyond my campus bubble, and I didn't want to return to my hometown in California. So, I thought staying in the city I had come to love so much would make the transition after graduating easier and ease my anxieties about postgrad life. My boyfriend was still in school at TCU, and all of my closest friends decided to stick around as well, either by getting jobs nearby or by continuing their studies, which made my decision even easier. I expected us to hang out all the time, go out to dinner, and show up at each other's apartments unannounced, just like when we were in school. It seemed like I had created the most seamless transition into this next phase of adulthood — or so I thought. I stayed close to the people I loved, but still felt lonely Because of our different schedules, I felt out of sync with my friends. Siena Frolich In the months after graduation, I started to feel a loneliness creep in that I couldn't make sense of. I was living with two of my best friends , the rest of them lived in the same apartment complex as us, and my boyfriend and I had just celebrated our first anniversary. Yet, I still felt isolated. I was the only one out of our group of friends with a standard 9-to-5 job — everyone else had more flexible roles or was continuing their education. I felt completely out of sync with them: while I sat in an office all day, some of them bounced from class to class or didn't have to work much at all. When I came home from work tired and wanting to stay home for the night, some of them were desperate to go out. Along with our routines being nothing alike "datetime_fa": "۱۵ آبان • ۱۸:۳۷"}, {"source": "Business Insider", "title": "A guide to every real-life historical figure on 'The Gilded Age'", "link": "https://www.businessinsider.com/the-gilded-age-cast-hbo-real-life-historical-figures", "summary": "Bertha and George Russell are based on different figures from the real Gilded Age. Karolina Wojtasik/HBO Season four of \"The Gilded Age\" premiered on November 1. While some of its characters are fictional, the show is populated with real people from the era. Grover Cleveland, Booker T. Washington, Oscar Wilde, and Clara Barton have all popped up. Few eras have captivated people more than the Gilded Age , a period in the late 19th century characterized by extreme wealth (and wealth inequality), progress, immigration, and a certain ruthlessness among the age's businessmen. And now, any history buff can tune into HBO's \" The Gilded Age \" to see this iconic time period brought to life. The show is populated by a mix of entirely fictional creations and a few characters who differ only in name from real people of the time. Here's a guide to every real person who made the jump from history books to HBO in \"The Gilded Age.\" Warning: There are some season three and four spoilers ahead. Carrie Coon plays Bertha Russell, who s based on Alva Vanderbilt. HBO; Heritage Art/Heritage Images/Getty Images Alva Vanderbilt Belmont was a Gilded Age socialite who married William K. Vanderbilt, a Vanderbilt railroad heir. In 1882, the couple built a mansion that took up a whole city block on Fifth Avenue in New York City — much like the mansion the Russells move into in the series premiere. Bertha isn't exactly Alva, but the similarities are there, including Alva's hunger and determination to be accepted by the upper crust of New York society, her strong personality, and love of the opera. Taissa Farmiga plays Bertha s daughter Gladys, based on Alva s daughter Consuelo. HBO; Gilliam Press Syndicate/PhotoQuest/Getty Images If there was any doubt that Bertha and Gladys were based on Alva and Consuelo , that doubt ended when Gladys married off to a British duke against her will, in order to elevate her family's status and credibility. While Gladys and Hector's relationship was at a high point at the end of season three — though, after the season four premiere, there seems to be a major conflict incoming — if you don't want to know what could happen to Gladys, skip ahead. In real life, Consuelo's marriage to Charles Spencer-Churchill, 9th Duke of Marlborough, was largely an unhappy one, though she and her husband mostly lived separately. They separated in 1906 and were officially divorced in 1921. The marriage was annulled in 1926. However, Bertha s husband George (Morgan Spector) i", "date_str": "2026-11-06T14:58:37+00:00", "hash": "9ac998ce8d78fdfc", "title_fa": "راهنمای هر شخصیت تاریخی زندگی واقعی در \"عصر طلایی\"", "summary_fa": "برتا و جورج راسل بر اساس چهره های متفاوتی از عصر طلایی واقعی ساخته شده اند. Karolina Wojtasik/HBO فصل چهارم «عصر طلایی» در اول نوامبر به نمایش درآمد. در حالی که برخی از شخصیت‌های آن تخیلی هستند، سریال مملو از افراد واقعی آن دوره است. گروور کلیولند، بوکر تی واشنگتن، اسکار وایلد، و کلارا بارتون همگی ظاهر شده اند. کمتر دوره ای مردم را بیش از عصر طلایی مجذوب خود کرده است، دوره ای در اواخر قرن نوزدهم که با ثروت شدید (و نابرابری ثروت)، پیشرفت، مهاجرت، و ظلم خاصی در میان تجار عصر مشخص می شود. و اکنون، هر علاقه‌مند به تاریخ می‌تواند با «عصر طلایی» HBO هماهنگ شود تا زنده شدن این دوره زمانی نمادین را ببیند. نمایش با ترکیبی از خلاقیت‌های کاملاً تخیلی و چند شخصیت که فقط از نظر نام با افراد واقعی آن زمان متفاوت هستند، پر شده است. در اینجا راهنمای هر شخص واقعی است که از کتاب های تاریخ به HBO در «عصر طلایی» جهش کرده است. هشدار: چند فصل سوم و چهارم اسپویلر در پیش است. کری کون نقش برتا راسل را بازی می کند که بر اساس آلوا واندربیلت ساخته شده است. HBO; هنر میراث/تصاویر میراث/گتی ایماژ آلوا واندربیلت بلمونت یک فرد اجتماعی عصر طلاکاری بود که با ویلیام کی واندربیلت، وارث راه آهن واندربیلت ازدو rship in the US than Netflix or NBCUniversal, according to Nielsen. Roku's connected TV platform is in over 100 million households. It drove over $727 million in advertising revenue in its September quarter, up 23% from the year before, the company said on Monday. Fox said in its deal announcement on Friday that it expects to generate about $400 million in annual cost savings within two years by buying Roku. \"Our top priority for the combined company is to continue to relentlessly serve audiences and partners,\" Fox CEO Lachlan Murdoch said in a statement. Gaining The Roku Channel gives Fox another asset in a hot area. As paid streamers raise prices , consumers have been increasingly turning to free services for their TV viewing. Read the original article on Business Insider", "date_str": "2026-11-06T14:55:37+00:00", "hash": "d47777d64a86dd77", "title_fa": "فاکس خرید Roku خود را خیلی زودتر از موعد مقرر نهایی کرده است و یک غول پخش رایگان را تشکیل داده است", "summary_fa": "فاکس Roku را در یک حرکت استراتژیک بزرگ تحت مدیریت Lachlan Murdoch خریداری کرده است. تصویر توسط توماس فولر/SOPA Images/LightRocket از طریق Getty Images. Jon Kopaloff/WireImage Fox قرارداد Roku خود را در روز جمعه، ماه‌ها زودتر از موعد مقرر نهایی کرد. مالکیت Roku به فاکس امکان کنترل دو پخش کننده رایگان برتر را می دهد. فاکس به سرمایه گذاران گفت که انتظار دارد سالانه 400 میلیون دلار از این معامله ظرف دو سال پس انداز کند. فاکس Roku را در معامله ای خرید که می تواند غول تلویزیون را به یک نیروگاه پخش رایگان تبدیل کند. زمان قرارداد 22 میلیارد دلاری غافلگیر کننده است. فاکس در ابتدا گفت که انتظار دارد خرید Roku در نیمه اول سال 2027 نهایی شود. فاکس در ماه سپتامبر گفته بود که وزارت دادگستری ایالات متحده اطلاعات بیشتری در مورد قرارداد Roku خود درخواست کرده است، اگرچه تایتان پخش گفت که این اقدام \"منتظر می شود\". خرید Roku به فاکس کمک می کند تا تجارت تبلیغاتی خود را گسترش دهد و در عین حال کنترل کانال Roku را علاوه بر Tubi، دومین و سومین سرویس پخش رایگان بزرگ بین بینندگان تلویزیون ایالات متحده، به آن می دهد. یوتیوب aa5e46dca2278e0?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "سرمایه‌گذاری", "بورس و طلا"], "datetime_fa": "۱۵ آبان • ۱۸:۱۱"}, {"source": "Business Insider", "title": "I tried Ina Garten's chocolate pecan pie recipe. It's the easiest Thanksgiving dessert I've ever made.", "link": "https://www.businessinsider.com/ina-garten-bourbon-chocolate-pecan-pie-recipe-2026-11", "summary": "I tried Ina Garten s bourbon chocolate pecan pie with store-bought crust. Anneta Konstantinides/Business Insider I tried Ina Garten's bourbon chocolate pecan pie recipe for Thanksgiving. The recipe has barely any steps or prep and uses a store-bought pie crust. I thought the pie was super easy to make, and it was deliciously crunchy and creamy. I love making Ina Garten's recipes, especially during the holidays. Whether it's her delicious brown-butter skillet cornbread or creamy potato gratin , Garten has never let me down on Christmas and Thanksgiving. But I'd never tried making one of Garten's desserts for my family's festivities. So when I saw a recipe for bourbon chocolate pecan pie in her \"Go-To Dinners\" cookbook, which includes a store-bought pie crust, I knew it'd be an easy addition to my Thanksgiving menu. Ina Garten s pecan pie includes a store-bought crust, chocolate chips, and bourbon. Anneta Konstantinides/Business Insider To make Garten's bourbon chocolate pecan pie, which serves six to eight people, you'll need: 1 9-inch store-bought frozen pie crust (make sure you defrost it the night before baking) 2 extra-large eggs 1 cup of whole pecans, large-diced 1 stick (8 tablespoons) of unsalted butter, melted and slightly cooled 1 ¼ cups of semisweet chocolate chips (Garten recommends Nestlé) ½ cup of light brown sugar, lightly packed ½ cup of granulated sugar ½ cup of all-purpose flour 2 ½ tablespoons of good bourbon (Garten recommends Maker's Mark) 1 teaspoon of pure vanilla extract Good vanilla ice cream for serving (Garten recommends Häagen-Dazs) First, I prepped my pecans. Anneta Konstantinides/Business Insider Garten's recipe calls for whole pecans to be \" large-diced .\" To save time, I bought pecans that had already been halved and gave them a quick, rough chop to get them down to size. Then I added all of my dry ingredients into a bowl. Anneta Konstantinides/Business Insider I threw in the brown sugar, granulated sugar, and flour, along with one teaspoon of salt, before mixing everything together. I whisked the liquid ingredients together. Anneta Konstantinides/Business Insider I threw in the eggs, melted butter, vanilla, and bourbon and whisked everything together. I poured my wet ingredients into the bowl with my dry ingredients. Anneta Konstantinides/Business Insider I stirred the ingredients with a rubber spatula until they were combined. Then I stirred in my chocolate chips and pecans. Anneta Konstantinides/Business Insider And just li", "date_str": "2026-11-06T14:29:02+00:00", "hash": "77f8a6c722834c68", "title_fa": "من دستور پای اسپند شکلاتی اینا گارتن را امتحان کردم. این ساده ترین دسر شکرگزاری است که تا به حال درست کرده ام.", "summary_fa": "من پای اسپند شکلاتی بوربن اینا گارتن را با پوسته فروشگاهی امتحان کردم. Anneta Konstantinides/Business Insider من دستور پای اسپند بوربن شکلاتی Ina Garten را برای روز شکرگزاری امتحان کردم. این دستور تقریباً هیچ مرحله یا آماده سازی ندارد و از پوسته پای خریداری شده در فروشگاه استفاده می کند. من فکر می کردم که پای فوق العاده آسان درست می شود و به طرز خوشمزه ای ترد و خامه ای بود. من عاشق درست کردن دستور العمل های اینا گارتن هستم، مخصوصاً در تعطیلات. گارتن چه نان ذرت تابه‌ای خوشمزه با کره قهوه‌ای یا گراتن سیب‌زمینی خامه‌ای، هرگز در کریسمس و روز شکرگزاری من را ناامید نکرده است. اما من هرگز سعی نکردم یکی از دسرهای گارتن را برای جشن های خانواده ام درست کنم. بنابراین وقتی در کتاب آشپزی او «Go-To Dinners» دستور تهیه پای اسپند شکلاتی بوربون را دیدم، که شامل یک پوسته پای خریداری شده در فروشگاه است، می دانستم که افزودن آسانی به منوی شکرگزاری من خواهد بود. پای اس t Foods are turning to artificial intelligence to help keep bees healthy. They use AI detection devices to monitor the sounds hives make. And they've employed a robotic hive, which helps determine if mites are spreading. But can these technologies actually help the US make more honey? Read the original article on Business Insider", "date_str": "2026-11-06T14:05:12+00:00", "hash": "cc6f6f1a98fc314d", "title_fa": "چگونه Nate's Honey از هوش مصنوعی برای محافظت از 6 میلیارد زنبور خود استفاده می کند", "summary_fa": "آمریکایی ها سالانه بیش از 600 میلیون پوند عسل مصرف می کنند، به طوری که برای تامین نیاز باید عسل وارد کرد. عسل به زنبورهای سالم وابسته است که در داخل کشور با نبرد سختی روبرو هستند و هر ساله 50 درصد کلنی های زنبور عسل در ایالات متحده می میرند. آفاتی مانند کنه واروآ و حرکت مداوم کهیر را در معرض خطر قرار می دهد. بنابراین عسل و غذاهای شیرین نیت برای کمک به حفظ سلامت زنبورها به هوش مصنوعی روی می آورند. آنها از دستگاه های تشخیص هوش مصنوعی برای نظارت بر صداهایی که کندوها تولید می کنند استفاده می کنند. و آنها از کندوی روباتیکی استفاده کرده اند که به تعیین اینکه آیا کنه ها در حال گسترش هستند یا خیر کمک می کند. اما آیا این فناوری ها واقعا می توانند به ایالات متحده کمک کنند تا عسل بیشتری تولید کند؟ مقاله اصلی در مورد هوش مصنوعی ویدیوی Business Insider را بخوانید چگونه عسل نیت از هوش مصنوعی برای محافظت از 6 میلیارد زنبور خود استفاده می کند نماد اشتراک گذاری یک فلش منحنی که به سمت راست اشاره می کند. X LinkedIn کپی پیوند نماد فیس بوک حرف F. Olivia Nemec، Daniel Gessner، Yuelei Song و A.C. Fowler 2026-11-06T14:05:12.837Z نماد اشتراک گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند فیس بوک نماد حرف F. توضیحات Angle down icon نمادی به شکل زاویه ای که به سمت پایین است. آمریکا سالانه بیش از 6 میلیارد دلار مواد بازیافتی را هدر می دهد. آیا ربات ها و هوش مصنوعی می توانند کمک کنند؟ نماد پخش مثلثی که به سمت راست اشاره می کند که نشان می دهد این نوع رسانه قابل پخش است.", "image_url": "https://i.insider.com/6aeb66fec54bfafa65abef06?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۵ آبان • ۱۷:۳۵"}, {"source": "Lifehacker", "title": "ChatGPT's New GIF Generator Is Fun, but Won't Replace Us Humans (Yet)", "link": "https://lifehacker.com/tech/chatgpts-new-gif-generator-is-fun-but-wont-replace-us-humans?utm_medium=RSS", "summary": "When it comes to generating AI images, both Gemini and ChatGPT do a passable job. In most cases, the results will look AI-generated, but they likely won t have glaring spelling issues or missing limbs. Now, OpenAI is trying something new, introducing GIF support for ChatGPT . It's the company's first \"moving images\" feature since OpenAI shut down Sora , and while you can generate hyper-realistic videos in Gemini , this new ChatGPT feature is trying to fill in the gap, in a small way. How to make animated GIFs using ChatGPT Credit: Khamosh Pathak OpenAI is pitching the new feature as an animation tool, not exactly as a way to create looping videos though that s how I ended up using it. You give ChatGPT a prompt, as detailed as you can make it, and the chatbot produces a GIF in just a few seconds. You can start with your own drawings or images, too. ChatGPT uses sketches as the base for animations, though it can turn any still image into animated GIFs. Like other AI editing tools, you can edit it if ChatGPT didn't quite get it right: You can ask ChatGPT to make the GIF longer or shorter, remove certain objects, change the style, slow down transitions, among other edits. Credit: Khamosh Pathak AI art can be quite sterile, but I was surprised by how adding motion and animation to the mix makes generating images a lot more fun. Unlike traditional GIFs, which usually pull from existing video clips, you can turn anything you want into a GIF, which is especially cool if you're using your own art. In my testing, I found this to be the most rewarding part. It s not always possible to one-shot a GIF with a single prompt. But after a few rounds of edits, I ended up creating some GIFs that I actually wanted to share in my WhatsApp groups. ChatGPT can t beat regular GIFs That being said, I think human-made GIFs are still the gold standard here. For example, I asked ChatGPT to generate a video of someone brewing a pour-over, with a gooseneck kettle, showing the coffee blooming process. It did okay, but it s nothing like actually making a pour-over. The kettle doesn t move in circles, the water doesn t rise evenly, there are no bubbles, and the steam is all over the place. Credit: Khamosh Pathak Compare that to the GIF below, which comes from a royalty-free video. Even though it s a compressed, low-quality, and noisy GIF, it still shows the movement of the pour, the water rising, and even the bubbles. The details captured by a real video just aren t there in ChatGPT GIFs.", "date_str": "2026-11-06T15:00:00+00:00", "hash": "495b909fa8abc752", "title_fa": "تولید کننده GIF جدید ChatGPT سرگرم کننده است، اما جایگزین ما انسان ها نخواهد شد (هنوز)", "summary_fa": "وقتی نوبت به تولید تصاویر هوش مصنوعی می رسد، Gemini و ChatGPT هر دو کار قابل قبولی را انجام می دهند. در بیشتر موارد، نتایج به‌نظر می‌آیند که توسط هوش مصنوعی تولید شده‌اند، اما احتمالاً مشکلات املایی فاحش یا از دست دادن اندام‌ها ندارند. اکنون، OpenAI در حال آزمایش چیز جدیدی است و پشتیبانی GIF را برای ChatGPT معرفی می کند. این اولین ویژگی «تصاویر متحرک» این شرکت از زمانی است که OpenAI Sora را تعطیل کرد، و در حالی که می‌توانید ویدیوهای فوق‌العاده واقعی در Gemini تولید کنید، این ویژگی جدید ChatGPT تلاش می‌کند تا شکاف را به روشی کوچک پر کند. نحوه ساخت گیف های متحرک با استفاده از ChatGPT Credit: Khamosh Pathak OpenAI این ویژگی جدید را به عنوان یک ابزار انیمیشن ارائه می کند، نه دقیقاً به عنوان راهی برای ایجاد ویدیوهای حلقه ای، اگرچه من در نهایت از آن استفاده کردم. شما به ChatGPT یک اعلان می‌دهید، تا جایی که می‌توانید جزئیات آن را بسازید، و چت بات تنها در چند ثانیه یک GIF تولید می‌کند. می توانید با نقاشی ها یا تصاویر خود نیز شروع کنید. ChatGPT از طرح‌ها به عنوان پایه انیمیشن‌ها استفاده می‌کند، اگرچه می‌تو ون حذف خواهد شد، اما دکمه‌ی کنترل دوربین همچنان باقی می‌ماند. مطابق اطلاعات منتشرشده، در طراحی جدید، فشاردادن کوتاه دکمه‌ی کنترل دوربین، مانند گذشته، اپلیکیشن دوربین را باز می‌کند؛ اما نگه‌داشتن طولانی همان دکمه، عملکردی را فعال خواهد کرد که کاربر برای دکمه‌ی اکشن تعیین کرده است. به‌این‌ترتیب، یک دکمه می‌تواند وظایف دو کنترل جداگانه را انجام دهد. این تغییر با شیوه‌ی فعلی عملکرد دکمه‌ها نیز سازگاری دارد. در آیفون‌های کنونی، کاربران برای اجرای فرمان اختصاصی دکمه‌ی اکشن باید آن را چند لحظه نگه دارند؛ درحالی‌که دکمه‌ی کنترل دوربین با یک فشار کوتاه امکان دسترسی سریع به دوربین را فراهم می‌کند. بنابراین، ادغام دو دکمه لزوماً به معنای تغییر عادت‌های کاربران نخواهد بود. البته در طراحی کنونی آیفون، نگه‌داشتن دکمه‌ی کنترل دوربین برای اجرای قابلیت هوش بصری (Visual Intelligence) استفاده می‌شود. این قابلیت به کاربران اجازه می‌دهد با استفاده از دوربین گوشی، اطلاعات بیشتری درباره‌ی اشیا و محیط اطراف خود دریافت کنند. اپل در iOS 27 امکان استفاده از هوش بصری را در قالب حالت سیری (Siri Mode) به اپلیکیشن دوربین اضافه کرده است. چنین تغییری می‌تواند زمینه را برای اختصاص عملکرد دیگری به نگه‌داشتن دکمه‌ی کنترل دوربین فراهم کند. بااین‌حال، هنوز مشخص", "image_url": "https://api2.zoomit.ir/media/iphone-15-pro-15-pro-max-finger-stain-651d69d0357ee5d088dc67f4?w=1920&q=75", "category": "تراشه و سخت‌افزار", "tags": ["Apple"], "datetime_fa": "۱۵ آبان • ۱۸:۰۲"}, {"source": "Zoomit", "title": "زلزله در بورس کره جنوبی؛ سقوط ۹ درصدی بازار و توقف اضطراری معاملات", "link": "https://www.zoomit.ir/economics/470598-south-korea-kospi-ai-selloff/", "summary": "پیروزی دموکرات‌ها در انتخابات میان‌دوره‌ای آمریکا و نگرانی از کندشدن سرمایه‌گذاری در هوش مصنوعی، شاخص بورس کره‌ی جنوبی را به شدت کاهش داد.", "date_str": "2026-11-06T14:10:00+00:00", "hash": "e5f1cf3ebde049a1", "title_fa": "زلزله در بورس کره جنوبی؛ سقوط ۹ درصدی بازار و توقف اضطراری معاملات", "summary_fa": "پیروزی دموکرات‌ها در انتخابات میان‌دوره‌ای آمریکا و نگرانی از کندشدن سرمایه‌گذاری در هوش مصنوعی، شاخص بورس کره‌ی جنوبی را به شدت کاهش داد. تبلیغات شاخ und tour — which was originally scheduled for Oct. 26 and then postponed after Jones contracted the flu — Jones, 86, revealed that his latest health scare had him fearing the worst. [I thought], Oh, well, this is it,' he told the crowd at the Greek, according to BBC News . You ve had a wonderful life, Tommy, but it s over right now. Jones reportedly spent a week at the Ronald Reagan UCLA Medical Center in Los Angeles due to the illness described at the time as a bad case of the flu , which resulted in the rescheduling of shows in L.A. and San Diego. He later had to reschedule another California show as doctors ordered more rest and then postponed gigs in Sacramento and San Francisco as well on doctor s advice. I must say this, in the UCLA, they really did a wonderful job. So I m here, he told the L.A. audience. [The medical staff said] What do you want to do now? I was there for a week. And I said, I ve got to get back on the stage. This is where I belong. I can t live without this, believe me.' Jones next scheduled show is a rescheduled gig at the Yaamava Theater in Highland, Calif. on Friday night (Nov. 6).", "date_str": "2026-11-06T14:29:16+00:00", "hash": "c2791f01ef95eb7d", "title_fa": "تام جونز فکر می کرد که زندگی او پس از نبرد اخیر با آنفولانزا به پایان رسیده است: \"شما زندگی شگفت انگیزی داشته اید\"", "summary_fa": "هنگامی که در ماه ژوئیه سر تی ام جونز دچار عفونت تنفسی فوقانی شد که او را مجبور به تعویق یک نمایش در آلمان کرد، از طرفداران ناامید عذرخواهی کرد و قول داد که آن را جبران کند. اما چهارشنبه شب (4 نوامبر) در طول نمایش برنامه ریزی شده خود در تئاتر یونانی در لس آنجلس در تور Come Gather Round خود - که در ابتدا برای 26 اکتبر برنامه ریزی شده بود و سپس پس از ابتلای جونز به آنفولانزا به تعویق افتاد - جونز، 86 ساله، فاش کرد که آخرین ترس از سلامتی او باعث شده است که از بدترین حالت می ترسد. به گزارش بی بی سی نیوز، او به جمعیت یونانی گفت، اوه، خوب، همین است. تو زندگی فوق‌العاده‌ای داشتی، تامی، اما الان تمام شده است. جونز یک هفته را در مرکز پزشکی رونالد ریگان UCLA در لس آنجلس گذراند به دلیل بیماری که در آن زمان به عنوان یک مورد بد آنفولانزا توصیف شد، که منجر به برنامه ریزی مجدد نمایش ها در لس آنجلس و سن دیگو شد. او بعداً مجبور شد یک برنامه دیگر در کالیفرنیا را برنامه ریزی کند زیرا پزشکان دستور استراحت بیشتری دادند و سپس اجرای برنامه در ساکرامنتو و سانفرانسیسکو و همچنین به توصیه پزشک به تعویق افتاد. این را باید بگویم، در UCLA، آنها واقعاً کار فوق العاده ای انجام دادند. او به مخاطبان لس آنجلس گفت پس من اینجا هستم. [کارکنان پزشکی گفتند] حالا می‌خواهی چه کار کنی؟ یک هفته آنجا بودم. و من گفتم، باید به صحنه برگردم. این جایی است که من به آن تعلق دارم. من نمی توانم بدون این زندگی کنم، باور کنید. نمایش برنامه ریزی شده بعدی جونز، یک کنسرت برنامه ریزی شده در تئاتر یااماوا در هایلند، کالیفرنیا در جمعه شب (6 نوامبر) است. آدرس ایمیل شما منتشر نخواهد شد. فیلدهای", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/1486427880-e1793973539408.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۵ آبان • ۱۷:۵۹"}, {"source": "Billboard", "title": "Splice Reimagines the DAW With ‘Create’ — Its Agentic AI-Powered Platform for Newcomers", "link": "https://www.billboard.com/pro/splice-daw-create-agentic-ai-powered-platform/", "summary": "Splice has launched its first-ever digital audio workstation (DAW), featuring agentic and assistive AI features to help new producers learn the program and finish songs. Most notably, the DAW features a chatbot, offering production tips and following instructions from a producer s voice or text prompts. It also offers a way to mix and match samples from the Splice library with greater ease. The company, known best for its library of more than three million human-made, licensed samples and loops, enters the DAW market at a time of disruption. While incumbent DAWs, like Ableton, Logic, ProTools and FL Studio, remain the market s top players, new browser-based applications, like BandLab, have grown a fanbase in recent years, offering a simpler and cheaper option for the novice producer. Plus, as generative AI has taken hold, AI platforms like Suno and Moises have also leaned in to DAW features to provide users with more optionality after a track is generated. Related AI’s Second Wave, From Anxiety to Imagination (Guest Column) Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Meanwhile, remixing and DJ-like features — which also encourage fans to customize their favorite songs — have never been of greater interest. Spotify , Udio, Klay and more are working on AI-powered music remix features. Both Spotify and Apple Music include DJ features in-app, and start-ups like Hook are working on licensed remix concepts for the TikTok generation. Despite all the buzz of generative AI, Splice has held steadfast on its commitment to providing only human-created samples, loops and instruments, instead, opting to use AI to better tailor and customize those samples by using it to better shift timbre, key, tempo and more. In 2023, Splice s CEO, Kakul Srivastava , said in an interview with Billboard : One of the things that we find disturbing about a lot of the work that is happening in generative AI is that it is push button creativity, she said. For us, that’s eliminating the creative as opposed to putting tools into the creatives’ hands. In that interview, she discussed Splice s Create in its first form: an AI-powered tool to mix and match Splice samples to, hopefully, help producers begin the song creation process and help them find the perfect sample faster. Now, Create has morphed into a full-fledged DAW, thanks to its acquisition of Kits AI at the start of the year. ", "date_str": "2026-11-06T14:24:20+00:00", "hash": "6400dc645f5b3f49", "title_fa": "Splice DAW را با «Create» دوباره تصور می کند - پلتفرم عاملی با هوش مصنوعی آن برای تازه واردان", "summary_fa": "Splice اولین ایستگاه کاری صوتی دیجیتال خود (DAW) را راه اندازی کرده است که دارای ویژگی های هوش مصنوعی عاملی و کمکی است تا به تولیدکنندگان جدید کمک کند برنامه را یاد بگیرند و آهنگ ها را به پایان برسانند. مهمتر از همه، DAW دارای یک ربات چت است که نکات تولید را ارائه می دهد و دستورالعمل های صوتی یا متنی تولید کننده را دنبال می کند. همچنین راهی برای ترکیب و تطبیق نمونه ها از کتابخانه Splice با سهولت بیشتر ارائه می دهد. این شرکت که به خاطر کتابخانه‌ای با بیش از سه میلیون نمونه و حلقه‌های دارای مجوز ساخت بشر شناخته می‌شود، در زمان اختلال وارد بازار DAW می‌شود. در حالی که DAWهای فعلی مانند Ableton، Logic، ProTools و FL Studio همچنان برترین بازیکنان بازار هستند، برنامه های کاربردی جدید مبتنی بر مرورگر، مانند BandLab، در سال های اخیر پایگاه طرفداران خود را افزایش داده اند و گزینه ساده تر و ارزان تری را برای تولیدکنندگان تازه کار ارائه می دهند. به‌علاوه، با فراگیر شدن هوش مصنوعی، پلتفرم‌های هوش مصنوعی مانند Suno و Moises نیز به ویژگی‌های DAW متمایل شده‌اند تا پس از ایجاد آهنگ، اختیارات بیشتری را در اختیار کاربران قرار دهند. موج دوم هوش مصنوعی مرتبط، از اضطراب تا تخیل (ستون مهمان) کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در ۷۱ سالگی درگذشت. از علاقه بیشتر Spotify، Udio، Klay و موارد دیگر روی ویژگی‌های ریمیکس موسیقی مبتنی بر هوش مصنوعی کار می‌کنند. هر دو اسپاتیفای و اپل موزیک دارای ویژگی‌های DJ درون برنامه‌ای هستند و استارت‌آپ‌هایی مانند هوک در حال کار بر روی مفاهیم ریمیکس مجاز برای نسل TikTok هستند. علیرغم همه هیاهوی هوش مصنوعی مولد، اسپلایس بر تعهد خود مبنی بر ارائه نمونه‌ها، حلقه‌ها و ابزارهای ساخته شده توسط انسان ثابت قدم است، در عوض، استفاده از", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple", "موسیقی"], "datetime_fa": "۱۵ آبان • ۱۷:۵۴"}, {"source": "Billboard", "title": "WME Signs BLACKPINK’s JISOO for Worldwide Representation", "link": "https://www.billboard.com/pro/wme-blackpink-jisoo-worldwide-representation/", "summary": "BLACKPINK s JISOO has signed with WME for worldwide representation. Announced Friday (Nov. 6), the K-pop superstar joins the WME roster just days after the release of “Addicted,” the second pre-release single from her forthcoming debut solo album. Earlier, in September, she dropped the single “ Click ,” and a third solo song is expected in the weeks ahead, “Sun Showers,” an original number that will appear on the The Angry Birds Movie 3 soundtrack, according to The Hollywood Reporter . As a member of the record-busting BLACKPINK, JISOO completed the sold-out Deadline World Tour earlier this year, a trek that stopped in major stadiums across North America, Europe and Asia. Adjacent to her pop career, the in-demand South Korean artist has a growing profile in film and fashion. She’s the global ambassador for Dior, Cartier, Tommy Hilfiger and Salomon; was appointed the face of ALO Yoga, and in 2024 became the first musician to be the face of the London fashion house Self-Portrait ; she landed a starring role in the Netflix romcom Boyfriend on Demand , which premiered in March; and recently launched brand collaborations with Off-White and Pokémon. It’s been full speed ahead for JISOO, who teased her new solo chapter last year with “ EYES CLOSED,” a collaboration with ex-One Direction star Zayn . The single reached No. 72 on the Billboard Hot 100. With that effort, BLACKPINK became the first girl group to have every member enter the Hot 100 as a solo artist. BLACKPINK released the DEADLINE EP in February of this year, after completing the tour of the same name. DEADLINE opened at No. 8 on the Billboard 200, and marked their first major music release since hitting No. 1 on the all-genres albums tally with 2022 s Born Pink . JISOO began her solo journey in 2023, with the release of her debut EP, ME , which became the first album by a female solo artist in South Korea to surpass one million sales. Its single, “꽃(FLOWER),” powered to No. 2 on the Billboard Global 200 in April of that year, and No. 1 on the Global Excl. US chart. A debut mini album arrived in 2025, AMORTAGE , and included songs “earthquake” and “Your Love. When her album ور مانند نیوانگلند و ساحل غربی متمرکز شده اند. پیروزی تاریخی حزب دموکرات در انتخابات میان دوره ای این هفته می تواند آن را تغییر دهد. دموکرات‌ها کنترل اتاق‌های قانونگذاری ایالتی و عمارت فرماندار - که به عنوان \"تریفکتا\" نیز شناخته می‌شود - در آریزونا، پنسیلوانیا و ویسکانسین، سه ایالت که سال‌ها یا دهه‌ها را تحت کنترل جمهوری‌خواهان یا تقسیم‌شده سپری کرده‌اند، تضمین کرده‌اند. سه ایالت نیز در حمایت از انرژی پاک عقب مانده اند. دموکرات‌ها این هفته همچنین trifectas را در مینه‌سوتا، میشیگان و نوادا احیا کردند، اما این ایالت‌ها ایالت‌هایی هستند که آخرین بار در اوایل این دهه کنترل یکپارچه را داشتند. دیوید ویسکوپف، مدیر ارشد سیاست در Climate Cabinet، یک سازمان غیرانتفاعی که برای انتخاب نامزدهای متمرکز بر آب و هوا و تصویب سیاست آب و هوای ایالتی کار می کند، گفت: «غالغه کردن اینکه چقدر این نتایج چشمگیر هستند، غیرممکن است. او گفت که شش ایالتی که دموکرات‌ها در آن‌ها از trifectas محافظت کرده‌اند، اگر کشور خود را تشکیل دهند، یکی از بزرگترین تولیدکنندگان گازهای گلخانه‌ای در جهان خواهند بود و رقیب کانادا و عربستان سعودی هستند. \"این فقط یک فرصت بزرگ برای پیشرفت است.\"", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/midterms-climate-action.jpg?crop=0px%2C0px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۵ آبان • ۱۸:۳۰"}, {"source": "Rolling Stone", "title": "What’s Next for Tom Petty’s Heartbreakers? Benmont Tench and Ron Blair Get Candid", "link": "https://www.rollingstone.com/music/music-features/tom-petty-heartbreakers-reunion-benmont-tench-ron-blair-1235651489/", "summary": "Two of the Heartbreakers dissect the new Origins 1971-1978 box set and open up about their recent onstage reunion in Nashville. \"I wanted to do that forever,\" Tench says", "date_str": "2026-11-06T14:50:17+00:00", "hash": "4c9a97c3e3b17ac1", "title_fa": "بعدی برای تام پتی's Heartbreakers چیست؟ بنمونت تنچ و ران بلر صریح می شوند", "summary_fa": "دو نفر از Heartbreakers مجموعه باکس جدید Origins 1971-1978 را تشریح کردند و روع کردیم تا راه بهتری برای تماشای تلویزیون به مردم بدهیم و این ماموریت امروز تغییر نمی کند. چیزی که تغییر می کند دسترسی و منابع ماست. فاکس برای فرهنگ Roku احترام عمیقی قائل است و کاملاً تعهد ما را برای باز ماندن برای هر شریک محتوایی به اشتراک می‌گذارد. تیم‌های ما با پشتیبانی و قابلیت‌های فاکس مانند همیشه به ساخت و نوآوری ادامه خواهند داد. من به آنچه کارمندان Roku ساخته‌اند افتخار می‌کنم و از آنچه در آینده می‌آید هیجان‌زده هستم.» این قرارداد، فاکس را به یک بازیگر اصلی در جریان تبدیل می‌کند، با دو تا از بزرگترین پلت‌فرم‌های پخش ویدیوی رایگان در بازار در Tubi و Roku Channel، یک سرویس استریم ممتاز در Fox One، و شاید مهم‌تر از همه،", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Blank-2000-x-1127.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۱۵ آبان • ۱۷:۵۳"}, {"source": "Hollywood Reporter", "title": "Netflix Orders ‘Stranger Things’ Spinoff Series ‘Other Worlds’ Set in the 1950s", "link": "https://www.hollywoodreporter.com/tv/tv-news/netflix-stranger-things-spinoff-other-worlds-1236748971/", "summary": "The live-action prequel series will have a different showrunner and all-new characters and story.", "date_str": "2026-11-06T14:00:00+00:00", "hash": "55a5844529d82635", "title_fa": "نت‌فلیکس سفارش می‌دهد سری اسپین‌آف «چیزهای عجیب» و «دنیای دیگر» که در دهه 1950 اتفاق می‌افتد.", "summary_fa": "سریال پیش درآمد لایو اکشن دارای یک برنامه نمایش متفاوت و شخصیت ها و داستان کاملاً جدید خواهد بود. متن لوگو Stranger Things به نتفلیکس باز می گردد. این استریمر رسما یک سریال پیش درآمد لایو اکشن برای موفقیت عظیم علمی تخیلی خود سفارش داده است. سری جدید با عنوان Other Worlds: A Stranger Things Adventure، در دهه 1950 و تولید آن در نیومکزیکو اتفاق می‌افتد. خالقان و گردانندگان سریال اصلی، برادران دافر به عنوان یکی از سازندگان کار خواهند کرد، اما در غیر این صورت وظایف خلاقانه را به نویسنده قدیمی Stranger Things، کیت ترفری، که همچنین نمایشنامه صحنه ای Stranger Things: The First Shadow و کارگردان برنده گلدن گلوب، جو رایت (Aonement) را بر عهده دارد، واگذار کرده اند که سه قسمت اول را بر عهده خواهد داشت. داستان‌های مرتبط کسب و کار نتفلیکس به روبرتو استانیچی از Mattel ضربه می‌زند تا محصولات و تجربیات مصرف‌کننده را رهبری کند. جزئیات مخفی نگه داشته می شوند، اما عنوان، محیط دهه 1950 نیومکزیکو، و یک اشاره توسط دافرها در بیانیه خود (آسمان را تماشا کنید) مطمئناً نشان می دهد که این نمایش دارای تم یوفو/بیگانگان/فضای بیرونی است. مت و راس دافر در بیانیه‌ای گفتند: ما سال‌هاست که رویای Worlds: A Stranger Things Adventure را در سر می‌پرورانیم، و دیدن آن به واقعیت سورئال و هیجان‌انگیز است. ما از تیم خارق‌العاده‌ی همکارانمان بسیار سپاسگزاریم: کیت ترفری، مجری برنامه، که از فصل دوم در کنار ما بوده و Stranger Things: The First Shadow را نوشته است. و کارگردان ما، جو رایت، هنرمندی درخشان که مدت‌ها کار او را تحسین می‌کردیم. ما نمی توانیم منتظر باشیم تا ببینیم آنها در حال پختن چه چیزی هستند. It's Stranger Things است، اما به طرز هیجان انگیزی تازه است، با یک محیط جدید، قهرمانان و شروران جدید، و جدید... در واقع، ما اجازه نداریم چیز بیشتری", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2025/12/StrangerThings_S5_0697_R.jpg?crop=206px%2C0px%2C3428px%2C1916px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۱۵ آبان • ۱۷:۳۰"}, {"source": "Variety", "title": "‘Avatar: Fire and Ash’ Sets Collectors Edition Featuring Miley Cyrus Q&A and Deleted Scenes", "link": "https://variety.com/2026/shopping/news/avatar-fire-and-ash-collectors-edition-deleted-scenes-1236941277/", "summary": "James Cameron is inviting audiences back to Pandora with a new collector’s edition of “Avatar: Fire and Ash,” arriving on digital platforms and 4K Ultra HD on Dec. 8. The special release, available on Prime Video, will feature more than nine hours of bonus material, including deleted and extended scenes, behind-the-scenes footage and an awards-season [ ]", "date_str": "2026-11-06T15:00:00+00:00", "hash": "e701e65b769a44be", "title_fa": "«آواتار: آتش و خاکستر» مجموعه‌های نسخه مجموعه‌ای با پرسش و پاسخ مایلی سایرس و صحنه‌های حذف شده", "summary_fa": "جیمز کامرون با نسخه کلکسیونی «آواتار: آتش و خاکستر» که در 8 دسامبر روی پلتفرم‌های دیجیتال و کیفیت 4K Ultra HD عرضه می‌شود، مخاطبان را به پاندورا دعوت می‌کند. محصول یا خدمات از طریق پیوند در وب سایت ما، Variety ممکن است کمیسیون وابسته دریافت کند. فیلم تازه منتشر شده شامل صحنه‌هایی است که رابطه بین جیک سالی (سام ورثینگتون) و نیتیری (زوئه سالدانا) را بررسی می‌کند، و همچنین داستان‌های بیشتری را شامل می‌شود که فرزندان آنها و آنتاگونیست بازگشته، سرهنگ مایلز کواریچ (استیون لانگ) را درگیر می‌کند. یکی از سکانس‌های حذف شده، جیک و اسپایدر را می‌بیند که در تاسیسات بریج‌هد RDA اسیر می‌شوند، در حالی که بقیه دنباله‌روی لواک برای پیاکان، فرار خانواده سالی از مردم خاکستر و مرگ جایگزین برای ژنرال آردمور هستند. این نسخه همچنین شامل «آتش و آب: ساخت فیلم‌های آواتار»، یک مستند پشت صحنه دو قسمتی، همراه با نمایش‌های تصویربرداری از اجرا با حضور ورتینگتون، سیگورنی ویور، لانگ و اونا چاپلین خواهد بود. موارد اضافی دیگر شامل خرابی صحنه، گروه بازیگران و فیلمساز، و ادای احترام به جان لاندو، تهیه کننده فقید «آواتار» است. نسخه فیزیکی همچنین شامل مطالب آرشیوی از جمله فیلمنامه و هنر تولید خواهد بود. «آواتار: آتش و خاکستر» که در دسامبر 2025 در سینما اکران شد، سومین قسمت از مجموعه پرفروش کامرون پس از «آواتار» در سال 2009 و «آواتار: راه آب» محصول سال 2022 بود. این فیلم جیک و نیتیری را دنبال می‌کند که در جریان عواقب تلفات خانواده‌شان در حال رویارویی با یک قبیله ناوی جدید به نام مردم خاکستر به رهبری وارنگ چاپلین هستند.", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۵ آبان • ۱۸:۳۰"}, {"source": "Variety", "title": "Motorhead’s Classic ‘Orgasmatron’ Gets a Mighty 40th Anniversary Sonic Upgrade and Deluxe Edition: Album Review", "link": "https://variety.com/2026/music/reviews/motorheads-orgasmatron-deluxe-edition-album-review-1236939607/", "summary": "The best rock bands create their greatest work with their backs against the wall — witness the Rolling Stones — and the legendary British hard-rock powerhouse Motorhead was no exception. Forty years ago, the band had seen the dissolution of its classic “No Sleep ‘Til Hammersmith” lineup accompanied by a pair of sub-par studio albums, [ ]", "date_str": "2026-11-06T15:00:00+00:00", "hash": "cda722052a2206a7", "title_fa": "«ارگاسماترون» کلاسیک موتورهد در چهلمین سالگرد ارتقاء سونیک و نسخه دلوکس قدرتمندی دریافت کرد: نقد آلبوم", "summary_fa": "بهترین گروه‌های راک بزرگ‌ترین آثار خود را با پشت به دیوار خلق می‌کنند - شاهد رولینگ استونز هستند - و موتورهد، نیروگاه افسانه‌ای هارد راک بریتانیایی نیز از این قاعده مستثنی نبود. چهل سال پیش، گروه شاهد انحلال ترکیب کلاسیک خود «No Sleep ‘Til Hammersmith» همراه با یک جفت آلبوم استودیویی پایین‌تر از همتا بود. و همچنین آلبوم آتشین Public Image Ltd.، که لیدون را با گروه وسیعی از جمله استیو وای جادوگر گیتار، جینجر بیکر درامر سابق Cream و برنی وورل از Funkadelic متحد کرد. نتیجه این اتحاد بعید \"Orgasmatron\" بود، مطمئناً تجربی ترین آلبوم موتورهد و آلبومی که واکنش قطبی بسیاری از طرفداران و خود گروه را برانگیخت - در مواد مطبوعاتی این انتشار مجدد به طور مبهمی آمده است: \"تولید آلبوم موضوع بحث های زیادی در بین گروه و طرفداران آنها بود\" - که می گفتند ترکیب آن بیش از حد درهم و برهم بود و از گروه فاصله داشت. اما به شخصه، من آن را دوست داشتم و دارم. در دورانی که طرفداران موسیقی بسیار قبیله‌تر از امروز بودند، Motorhead یکی از گروه‌های کمیاب بود که هم در محافل پانک و هم در محافل هوی متال مورد احترام بود. مانند AC/DC، موسیقی قبلی آن‌ها راک اند رول بدون عضله و استخوان بود - گیتارهای سوزان، درام‌های انباشته‌شده و صدای غرش لمی - مانند نسخه ترمیناتور چاک بری. و در \"Orgasmatron\"، ما همه اینها را در یک محیط صوتی ماجراجویانه تر دریافت کردیم: آهنگ ها موتورهد کلاسیک هستند، اما آوازهای مه آلود گیتار، سازهای کوبه ای و جلوه ها به داخل و خارج از میکس وارد می شوند، به خصوص در آهنگ پایانی، دیگ گیتارهای خروشان، رانندگی درام ها و صدای لمی با افکت هایی شبیه به لمی. با هم", "image_url": "https://variety.com/wp-content/uploads/2026/11/albumcovertreatment-15-1.jpg?w=1000&#038;h=562&#038;crop=1",     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
