      media: [{"source": "Billboard", "title": "Suki Waterhouse, Australian Crawl Join Sydney Opera House’s On The Steps Series", "link": "https://www.billboard.com/music/concerts/suki-waterhouse-australian-crawl-sydney-opera-houses-on-the-steps-1236371837/", "summary": "Live Nation Australia has rounded out the 2026 lineup for On The Steps , its summer concert series on the Forecourt of the Sydney Opera House, which now runs 12 nights from Nov. 28 to Dec. 12. Rise Against play Dec. 1 with Dropkick Murphys and Haywire, followed by Mercury Prize winner James Blake on Dec. 2 with support from Xmunashe. Wolf Alice , fresh off winning group of the year at the 2026 BRIT Awards, headline Dec. 4. Dizzee Rascal’s Dec. 5 show, with Example, ArrDee and Swaglord Savannah, has already sold out, while Texas singer-songwriter Dylan Gossett plays Dec. 6. The newly added dates include the series opener on Nov. 28 from veteran Australian rock band Australian Crawl, supported by Boom Crash Opera, and a Nov. 29 edition of Pub Choir, the mass sing-along event, with Ben Lee, Miles Phillips and the Australian Youth Orchestra. Suki Waterhouse launches the Australian leg of her Loveland tour on Dec. 8. Australian acts fill out the rest of the bill. Sydney band DMA’S play Dec. 3, which they say is the biggest show they’ve put together. “It’s a great stage with a lot of history,” the band said in a statement. Indie favorites Spacey Jane have sold out both of their Dec. 10 and 11 shows, and post-hardcore band the Amity Affliction close the season on Dec. 12. Now in its fifth year under Live Nation, the series has increased capacity to as many as 7,000 people per show, with more than 50,000 expected across the run. All proceeds from official merchandise will go to Support Act, the Australian music industry’s charity, which funds short-term financial help and mental health support for music workers in crisis. Fans can also add a donation when buying tickets to any Live Nation show in Australia ، مورد علاقه‌های مستقل، هر دو نمایش 10 و 11 دسامبر خود را به فروش رسانده است و گروه پسا هاردکور Amity Affliction فصل را در 12 دسامبر به پایان می‌رساند. در حال حاضر در پنجمین سال خود تحت عنوان Live Nation، این مجموعه ظرفیت خود را به 7000 نفر در هر نمایش افزایش داده است و انتظار می‌رود بیش از 50000 نفر در طول اجرا حضور داشته باشند. تمام درآمدهای حاصل از کالاهای رسمی به حمایت قانون، خیریه صنعت موسیقی استرالیا، که کمک مالی کوتاه مدت و حمایت از سلامت روان برای کارگران موسیقی در شرایط بحرانی را تأمین می کند،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/18-suki-waterhouse-lollapalooza-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۱ آبان • ۱۰:۱۵"}, {"source": "Hollywood Reporter", "title": "Tallinn Black Nights Fest Turns 30 With New Artistic Director, a Latin American Streak and a Baltic Boom", "link": "https://www.hollywoodreporter.com/movies/movie-news/tallinn-2026-poff-30-preview-baltics-focus-oscars-scandinavia-1236741690/", "summary": "In her first year at the programming helm, Triin Tramberg is making few changes and watching closely to see what works: \"I made the decision that this year is really observational for me.\"", "date_str": "2026-11-02T07:00:00+00:00", "hash": "d139e8a4a5fd7563", "title_fa": "جشنواره شب‌های سیاه تالین 30 ساله شد با مدیر هنری جدید، یک سریال آمریکای لاتین و رونق بالتیک", "summary_fa": "تریین ترامبرگ در اولین سال مدیریت برنامه‌نویسی خود، تغییرات کمی ایجاد می‌کند و از نزدیک دنبال می‌کند تا ببیند چه کار می‌کند: \"تصمیم گرفتم که امسال برای من واقعاً مشاهده‌کننده است.\" جشنواره فیلم شب های سیاه تالین استونی (PÖFF) سی امین دوره خود را در روز جمعه آغاز می کند، اولین دوره تحت رهبری خلاقانه کارگردان هنری Triin Tramberg. این ترکیب نوید ترکیبی از اکتشافات و جواهرات جدید، فیلم‌های پرطرفدار و بهترین‌های جشنواره سال را می‌دهد. کیوریتور فیلم که بیش از 15 سال در کنار PÖFF رشد کرده است، قبل از تبدیل شدن به یک هماهنگ کننده برنامه و ایفای نقش کلیدی در شکل دادن به نمایه بین المللی تالین، کار خود را در جشنواره به عنوان دستیار برنامه آغاز کرد. بنیانگذار PÖFF و مدیر قدیمی جشنواره Tiina Lokk، که مدیرعامل باقی مانده است، تمرکز خود را به مسیر کلی استراتژیک و توسعه تغییر داده است. داستان‌های مرتبط فیلم‌ها گودزیلا منهای صفر به جشنواره فیلم توکیو سقوط کرد با ستارگان ریونوسوکه کامیکی، مینامی هامابه در موسیقی دو، مکلمور تور رایگان فلسطین را در لندن به پایان می‌رساند: سکوت برای من ناراحت‌کننده‌تر بود سی‌امین سالگرد PÖFF، که از 22 نوامبر تا 25 نوامبر اکران می‌شود. از 87 کشور PÖFF، جشنواره فیلم جوانان و کودکان آن Just Film و PÖFF Shorts که به فیلم های کوتاه اختصاص دارد، با هم 107 اولین نمایش جهانی و 47 اولین نمایش بین المللی را ارائه خواهند کرد. مجموعه برنامه‌نویسی جشنواره تالین به طور فزاینده‌ای فیلم‌هایی را از سراسر جهان به نمایش گذاشته است، و آمریکای لاتین امسال حضور پررنگی دارد. ترامبرگ می گوید، اما سی امین PÖFF همچنین با افتخار سینمای بالتیک را مورد توجه قرار خواهد داد و خانه جشنواره استونی را در کنار لیتوانی و لتونی که همیشه بخش مهمی از PÖFF بوده است، پوشش می دهد. از سال 2008، جشنواره مسابقه فیلم", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/01/Tallinn-Film-Festival-artistic-director-Triin-Tramberg-Erlend-Staub-H-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۱ آبان • ۱۰:۳۰"}, {"source": "Deadline", "title": "New Japanese Drama Series ‘The Employee’ Is Smashing Stereotypes About Women In The Workplace, Says NHK Producer", "link": "https://deadline.com/2026/11/nhk-the-employee-japan-women-in-workplace-stereotypes-1237208248/", "summary": "EXCLUSIVE: A new Japanese drama series is turning stereotypes around women in the workplace on their head, according to one of the top producers at public broadcaster NHK. The Employee launched a fortnight ago and has got Japanese people talking about the double bind women face as they progress up the career ladder, Akiko Ueda, [ ]", "date_str": "2026-11-02T06:00:00+00:00", "hash": "f04af245fedd2689", "title_fa": "تهیه‌کننده NHK می‌گوید سریال درام ژاپنی جدید «کارمند» کلیشه‌های مربوط به زنان را در محل کار شکست می‌دهد.", "summary_fa": "انحصاری: به گفته یکی از تولیدکنندگان برتر در پخش عمومی NHK، یک سریال درام ژاپنی جدید، کلیشه‌های مربوط به زنان در محل کار را بر سر آنها تغییر می‌دهد. The Employee دو هفته پیش راه اندازی شد و ژاپنی ها را وادار کرد که در مورد دوگانه ای که زنان هنگام پیشرفت در نردبان حرفه ای با آن روبرو می شوند صحبت کنند، آکیکو اوئدا [ ] با بازی یوه یوشیدا و سارا مینامی، The Employee دومین نمایش ژاپنی است که از اتاق توسعه نویسندگان NHK (WDR) بیرون آمد، اولین نمایش آن در 300000، 300000، 3000000000000000 بود. ستون شکست در سال گذشته. اخبار مرتبط اخبار Disney+ Netflix خریدهای غیرانگلیسی را افزایش می‌دهد به‌عنوان شور و شوق برای محتوای کره‌ای ژاپنی - Ampere News Cannes Marché TIFFCOM متعهد به برگزاری نسخه دوم بازار IP ژاپن در سال 2027 ما عمیقاً مجذوب این سؤال شدیم: آیا شخصی که ارزش‌های یک سازمان را به طور واقعی درونی کرده است، می‌تواند آزاد شود؟ اوئدا گفت. در ژاپن، زنان در محل کار گاهی اوقات خود را در چیزی می‌بینند که می‌توان آن را به عنوان یک پیوند دوگانه توصیف کرد. حتی زمانی که توانایی‌ها و جاه‌طلبی‌های بالایی دارند، ممکن است از آن‌ها انتظار می‌رود که این ویژگی‌ها را به شدت ابراز نکنند. در چنین محیطی، افراد به راحتی می توانند احساس ارزشمندی خود را به نحوه ارزیابی آنها توسط سازمانشان گره بزنند و نیاز قدرتمندی برای شناسایی و تایید ایجاد کنند. در Deadline For Ueda تماشا کنید، این یک موقعیت محدودکننده و غیرمنطقی است و نویسندگان با ساختن نمایشی که در آن زنی که اجازه داده ارزشش توسط سازمانش تعریف شود، در نهایت با آن سیستم مبارزه می‌کند تا خود را پس بگیرد، آن را از هم جدا کنند.", "image_url": "https://deadline.com/wp-content/uploads/2026/10/The-Employee_4_watermarked.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۱۱ آبان • ۰۹:۳۰"}, {"source": "Variety", "title": "Haley Stevens’ Unsettling CNN Interview Proves Why She’s Unfit for Public Office", "link": "https://variety.com/2026/politics/columns/haley-stevens-anderson-cooper-interview-column-1236937200/", "summary": "Watching Congresswoman Haley Stevens attempt to explain her 11th-hour endorsement of Republican Mike Rogers over her fellow Democrat Abdul El-Sayed in Tuesday’s election to become the next United States Senator from Michigan, my primary feeling was one of relief. Thank God this person didn’t beat El-Sayed in the primary, despite outspending him in a landslide. [ ]", "date_str": "2026-11-02T05:31:54+00:00", "hash": "ccc098321f0ce041", "title_fa": "مصاحبه ناراحت کننده هیلی استیونز با سی ان ان ثابت می کند که چرا او برای مشاغل دولتی مناسب نیست", "summary_fa": "با تماشای هیلی استیونز، زن کنگره که تلاش می‌کند تا حمایت ساعت یازدهم خود از مایک راجرز جمهوری‌خواه را بر همکار دموکرات‌اش عبدالالسید در انتخابات روز سه‌شنبه برای انتخاب سناتور بعدی ایالات متحده از میشیگان توضیح دهد، احساس اصلی من احساس آرامش بود. خدا را شکر که این شخص علیرغم اینکه السید را در انتخابات مقدماتی خرج کرده بود، او را شکست نداد. [ ] استیونز یکشنبه شب در سی ان ان برای یک گفتگوی 15 دقیقه ای دردناک با اندرسون کوپر ظاهر شد که آرام و بی سر و صدا در سئوالاتش بی باور بود. کوپر به ادعای همکار استیونز، دبی دینگل، دولتمرد ارشد هیئت میشیگان، مبنی بر اینکه استیونز به دینگل اطمینان داده بود تا ساعاتی قبل از حضور در کنار راجرز در کلیسایی در دیترویت، حمایت فراحزبی ارائه نشده بود، پاسخ داد. چه چیزی بین آن تماس تلفنی و صبح روز بعد تغییر کرد؟ عامل تعیین کننده در چهره استیونز چه بود؟ ثابت شد که استیونز قادر به پاسخگویی به این سوالات ساده و مستقیم نیست. (دینگل خود این بخش را دقایقی بعد در همان برنامه «یکی از دردناک‌ترین مصاحبه‌هایی که تا به حال تماشا کرده‌ام» نامید.) رفتار استیونز، که از زمان فروپاشی مناظره معروف ریچارد نیکسون در سال 1960 در حضورهای تلویزیونی بسیار مهم بود، برعکس بود. استیونز قبل از اینکه نتواند یک نکته منسجم را بیان کند، هر پاسخ را به طور انعکاسی با «نگاه کن...» شروع می‌کند، چشمک می‌زند، اخم می‌کند و پیشانی‌اش را از میان یک سری پاسخ‌های طفره‌آمیز درهم می‌کشد. یکی از نکات مورد علاقه او شکایت غیر اختصاصی در مورد خشم السید بود، اما السید نبود که خشم آشکارش نسبت به حریف اصلی‌شان کاملاً نمایان بود.", "image_url": "https://variety.com/wp-content/uploads/2026/11/HaleyStevens.AndersonCooper.jpg?crop=58px%2C0px%2C1748px%2C983px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۱ آبان • ۰۹:۰۱"}, {"source": "Variety", "title": "Siddhant Chaturvedi, Alizeh, Jimmy Shergill’s 1990s British Punjabi Music Drama ‘Bolo Bolo Bolo,’ Directed by Vikas Bahl, Wraps U.K. Shoot (EXCLUSIVE)", "link": "https://variety.com/2026/film/news/siddhant-chaturvedi-jimmy-shergill-bolo-bolo-bolo-uk-shoot-wrap-1236937033/", "summary": "Bollywood filmmaker Vikas Bahl has finished filming in the U.K. on “Bolo Bolo Bolo,” a coming-of-age musical drama set during the boom in Punjabi music across Britain in the early 1990s. Jimmy Shergill, Siddhant Chaturvedi, Mona Singh and Alizeh lead the cast. Katha Studios is producing the film alongside Good Co, Fusion Flicks and Monk [ ]", "date_str": "2026-11-02T05:30:00+00:00", "hash": "dcbb985a6102e70d", "title_fa": "سیدانت چاتورودی، آلیزه، درام موسیقی پنجابی بریتانیایی دهه 1990 جیمی شرگیل «بولو بولو بولو» به کارگردانی ویکاس باهل، Wraps U.K. Shoot (اختصاصی)", "summary_fa": "ویکاس باهل، فیلمساز بالیوودی، فیلمبرداری «Bolo Bolo Bolo» را در بریتانیا به پایان رسانده است. جیمی شرگیل، سیدانت چاتورودی، مونا سینگ و آلیزه بازیگران این فیلم را بر عهده دارند. استودیو Katha در کنار Good Co، Fusion Flicks و Monk [ ] Jimmy Shergill، Siddhant Chaturvedi، Mona Singh و Alizeh بازیگران این فیلم را تولید می کند. استودیو کاتا در کنار Good Co، Fusion Flicks و Monk Films این فیلم را تولید می کند. این فیلم در سال 2027 در سینماها اکران خواهد شد. داستان در زمانی اتفاق می‌افتد که نوازندگان جوان بریتانیایی آهنگ‌های پنجابی را با تولید مدرن و باس‌های سنگین ترکیب می‌کردند. آن‌ها این صدا را در فضاهای موقتی، از گاراژ گرفته تا برنامه‌های رادیویی بدون مجوز و نمایش‌های دور از جریان اصلی تولید کردند. در کنار موسیقی، فیلم به پیوندهای خانوادگی، دوستی، هویت و جستجوی تعلق می پردازد، در پس زمینه فرهنگ در حال تغییر بریتانیا در آن زمان. داستان‌  mind, and two-thirds could name the song. But only 27% say they have streamed an Australian artist in the past 12 months. Earlier research in Music Australia’s Listening In series found 71% feel pride hearing local music, 62% feel a connection to it and rate it as good as international music, and 66% want more of it. “These positive attitudes are not translating into listening, sharing, attendance and advocacy,” the campaign said in its launch material, pointing to availability, discoverability and default listener behaviors “often influenced by streaming algorithms and dwarfed by artists from larger English-speaking markets.” Where last year’s campaign asked listeners to “Ausify” their algorithms, this year’s pitch is visibility: Ausify is calling for “Public Displays of Ausify,” from social posts and tour merch to singing along in public. The month-long run launched with seven Australian artists performing a karaoke version of “Love Is in the Air,” and the artists backing it include Ben Lee, Fanny Lumsden, Astrid Jorgensen, aleksiah, Ayesha Madon, Becca Hatch, Budjerah, Conor Jacob Smith of Midnight Til Morning, Georgia Maq, ISHAN, Missy Higgins, Nooky, Ruel and Vv Pete. Lee, an ambassador for the campaign, said the goal has shifted. “The Ausify campaign this year isn’t about convincing people that Aussie music is incredible — ev", "date_str": "2026-11-02T03:50:58+00:00", "hash": "f0472ad35a108e8d", "title_fa": "کمپین Ausify به عنوان آهنگ پخش جریانی موسیقی استرالیایی به پایین باز می گردد", "summary_fa": "Ausify، کمپین ملی برای افزایش دید موسیقی استرالیایی در خانه، دومین سال خود را از دوشنبه (2 نوامبر) در شرایطی بدتر آغاز کرد: موسیقی محلی اکنون تنها 8.5٪ از کل صدای پخش شده در استرالیا را تشکیل می دهد. این رقم برگرفته از آخرین سال بررسی APRA AMCOS است که در ماه اکتبر منتشر شد، که در طی پنج سال 37.5 درصد کاهش در سهم جریان محتوای محلی ثبت کرد که از 13.6 درصد در سال مالی 21 کاهش یافته است. مدیر عامل سازمان حقوق بشر، دین اورمستون، هشدار داده است که این سهم ممکن است طی otiated giving her creative control on her repertoire and album covers, an unprecedented contract for a first-timer. “Although Marty lived a long and full life, nothing can prepare you for the reality of losing someone so dear, Streisand said in a statement following Erlichman s passing. I truly thought he would live forever. In my eyes, he was simply indestructible — always by my side, through everything. And we never even had a contract. Marty can never be replaced, and I will be forever grateful for his friendship, loyalty, and unwavering support.” Streisand also said, “A few weeks ago, he was trying to convince me to go on tour, and told me he’d be there every step of the way. I know it’s extremely rare for show business relationships to endure for as long as mine did with Marty. He trusted me, and I trusted him. This is a challenging business, but I always felt protected with Marty by my side.” A statement from Erlichman s family reads, “To the world, he was a giant of Hollywood; to us, he was a deeply devoted and loving father, husband, grandfather, and rock. We feel his loss deeply but are endlessly proud of the life he lived and the indelible mark he left on the world. Throughout his career in management with The Clancy Brothers, Tommy Makem and Gary Puckett The Union Gap among h", "date_str": "2026-11-02T01:12:50+00:00", "hash": "224f3084e9efdaaf", "title_fa": "مارتی ارلیچمن، مدیر قدیمی باربارا استرایسند، در ۹۷ سالگی درگذشت", "summary_fa": "مارتین لی «مارتی» ارلیچمن، مدیر باربارا استرایسند برای بیش از شش دهه، در 31 اکتبر درگذشت. او 97 سال داشت. در بیانیه مطبوعاتی منتشر شده در روز یکشنبه (1 نوامبر) آمده است که مرگ ارلیشمن به دلایلی مرتبط با سن بود. به عنوان یک مدیر سرگرمی، ارلیشمن با کشف استرایسند و کمک به شکل دادن و هدایت حرفه او از اوایل دهه 1960 اعتبار دارد. ارلیچمن در 13 سپتامبر 1929 در بروکلین، نیویورک متولد شد و فارغ التحصیل دانشگاه دریک در د موین، آیووا است. او هر دو جایزه امی و جایزه Peabody را برای کارش به عنوان تهیه کننده اجرایی برنامه ویژه تلویزیو » اوچیاما تاکویا را در بازار مالی گپ توکیو هدایت می کند.", "summary_fa": "مردی که از طریق اهدای اسپرم آبستن شده است، و از جایگاه خود در جهان مطمئن نیست، در «آبی می شکند»، اقتباسی از رمان ماچیا ریوهی در سال 2016 توسط فیلمساز ژاپنی اوچیاما تاکویا («بی حس») راهی کره می شود. تولید مشترک ژاپن و ایتالیا از جمله پروژه های امسال در بازار مالی گپ توکیو بود. قهرمان داستان، شوکیچی، [ ] است. او بعداً با توکو، زن جوانی آشنا می‌شود که بیمار لاعلاج است، اما با وجود زمان کمی که از او باقی مانده، به آرامی خودش را حمل می‌کند، سیگار می‌کشد و لبخند می‌زند. نگاه او به تدریج روی او اثر می گذارد. در نهایت شوکیچی و اطرافیانش با هم به کره سفر می کنند، جایی که زندگی و مرگ یکدیگر را حساب می کنند. اوچیاما، که قبلاً فیلمنامه‌های خود را بر اساس تجربه شخصی نوشته است، گفت که تا حدودی به این دلیل که در سالی که فیلم‌سازی را شروع کرد منتشر شد، و به این دلیل که ماچیا آن را در سنی که اکنون اوچیاما می‌نویسد، به این کتاب کشیده است. اوچیاما می‌گوید: «شوکیچی، قهرمان داستان، با بخشی از خود مبارزه می‌کند که هرگز کاملاً «مردانه» نشد. من همچنین بیشتر عمرم را با احساس ناراحتی نسبت به آنچه جامعه از یک مرد انتظار دارد، گذرانده‌ام. او شخصیت‌ها را افرادی توصیف کرد که زندگی‌شان بسیار متفاوت از زندگی یکدیگر به نظر می‌رسد و گفت ژاپن همچنان انتظار دارد که همه شبیه هم باشند. «تنوع چیز جدیدی نیست. اوچیاما گفت: \"این همیشه وجود داشته است، حتی اگر ما همیشه آن را تصدیق نکرده باشیم.\" تهیه کننده ژاپنی ساتو نائومی از Differentia پشت این پروژه است و Parsifal Reparato از شرکت ایتالیایی Antropica به عنوان تهیه کننده مشترک. این تیم در حال کار بر روی فیلمنامه، بازیگری و تامین مالی است و فیلمبرداری آن برای سال 2027 و تکمیل آن", "image_url": "https://variety.com/wp-content/uploads/2026/11/The-Blue-Breaks-poster.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "بورس و طلا"], "datetime_fa": "۱۱ آبان • ۰۱:۵۴"}, {"source": "Variety", "title": "Hilary Duff Says She Was ‘F—ing Done’ With ‘Lizzie McGuire’ When It Ended and Never Wanted to Sing ‘What Dreams Are Made Of’ Again: I Was ‘Exhausted By It’", "l  بخواند: «از آن خسته شدم»", "summary_fa": "هیلاری داف به این فکر می‌کند که این کار را انجام داده است» با بازی لیزی مک‌گوایر پس از پایان فیلم سال 2003، نمایش دو فصلی کانال دیزنی که او را به یک ستاره تبدیل کرد. «فیلم لیزی مک‌گوایر» دارای فیلم امروزی نمادین «What Dreams Are Made Of» است، که داف آن را برای EP «(Mine)» خود در سال 2026 دوباره ضبط کرد و برای اولین بار در «فیلم لیزی مک‌گوایر» به‌طور زنده خواند. امسال برای اولین بار در تور Small Rooms, Big Nerves به صورت زنده خواند. داف در مصاحبه اخیر با مجله Paper درباره فیلمبرداری این فیلم گفت: «در آن زمان کار من با لیزی کاملاً تمام شده بود. من یک سال 30 قسمت و سال بعد 35 قسمت فیلمبرداری کرده بودم. تبدیل به یک ستاره بزرگ شدم. همه مرا لیزی صدا می زدند. و سپس برای فیلمبرداری آن فیلم به ایتالیا رفتم و فکر می کنم دقیقاً کارم با تو تمام شده بود. می خواهم مردم مرا ببینند. این دیگر سرگرم کننده نیست.» داستان‌های مرتبط سکس، عشق و جنگ: چگونه حماسه همجنس‌گرای نژادپرستانه «La Bola Negra» توانست اولین اسکار بهترین فیلم نتفلیکس را برنده شود، معاون داگ بلگراد، معاون فیلم نت‌فلیکس، در میان اخراج‌ها کنار گذاشته شد. «نمی‌خواهم برای انجام آن ناسپاس به نظر بیایم، اما در آن زمان، از این کار بسیار خسته بودم. من سعی می‌کردم هیلاری داف را جدا از لیزی بسازم، بنابراین درست در نقطه‌ای بود که من هرگز آن آهنگ را نمی‌خوانم. و من حتی مالک آن نبودم. این آهنگ من برای خواندن نبود. اما اکنون احساس می کنم که اینطور است.»", "image_url": "https://variety.com/wp-content/uploads/2026/11/TCDLIMC_EC006.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۱۱ آبان • ۰۰:۴۶"}, {"source": "Billboard", "title": "Morgan Wallen, Garth Brooks, Taylor Swift & More Artists With Most Weeks at No. 1 on Top Country Albums Chart: Full List", "link": "https://www.billboard.com/lists/top-country-albums-number-ones-biggest/", "summary": "Morgan Wallen ’s I m the Problem leads Billboard s Top Country Albums chart (dated Nov. 7) for the 51st nonconsecutive week. This ups Wallen s career tally of weeks at No. 1 to 237, allowing him to extend his lead as the artist with the most weeks at No. 1 in the chart s 62-year history. Wallen’s achievement is especially impressive because he has amassed this hefty total of weeks at No. 1 in such a short amount of time. He first topped the chart a little more than six years ago on Aug. 15, 2020. Top Country Albums originated as Hot Country Albums in the Jan. 11, 1964 issue of Billboard . Johnny Cash ’s Ring of Fire (The Best of Johnny Cash) headed the inaugural chart. The compilation was well-timed: “Ring of Fire” had headed Hot Country Songs for seven weeks the previous summer and had crossed over to reach the top 20 on the Billboard Hot 100. The chart was named Hot Country LP’s from 1968 to 1984, when vinyl LPs were king. Twenty-one artists have logged 50 or more weeks at No. 1 on Top Country Albums. Male solo artists dominate, as you might expect, though three female solo artists have achieved the feat, as have two groups. (One of those groups is an all-female group.) Only one Black artist has amassed 50 or more weeks at No. 1, though that may change as country becomes more inclusive. Here’s a look at all artists who have topped Top Country Albums for 50 or more weeks.", "date_str": "2026-11-01T20:49:13+00:00", "hash": "6c199b50d93df3b5", "title_fa": "مورگان والن، گارث بروکس، تیلور سویفت و هنرمندان دیگر با بیشترین هفته‌ها در رتبه اول جدول آلبوم‌های کشور برتر: فهرست کامل", "summary_fa": "آلبوم من مشکل مورگان والن برای پنجاه و یکمین هفته متوالی در جدول آلبوم‌های کشور برتر بیلبورد (به تاریخ 7 نوامبر) پیشرو است. این آمار هفته‌های حرفه‌ای والن را در رتبه 1 به 237 افزایش می‌دهد، و به او این امکان را می‌دهد تا به عنوان هنرمندی که بیشترین هفته‌ها را در رتبه اول در تاریخ 62 ساله چارت داشته، برتری خود را افزایش دهد. دستاورد والن به ویژه چشمگیر است زیرا او این مجموع هفته های سنگین را در مدت زمان کوتاهی در رتبه اول به دست آورده است. او برای اولین بار کمی بیش از شش سال پیش در اوت در صدر جدول قرار گرفت. 15، 2020. آلبوم های برتر کانتری به عنوان آلبوم ans Schafer Redefined Latin Touring s Global Potential: It s Not One-Size-Fits-All The beloved trippy-pop band started their performance on the main stage, featuring a backdrop screen alternating tropical visuals with imagery inspired by the songs they were performing, accompanied by smoke columns and confetti. They later moved to a second stage in the middle of the audience, truly igniting the party with tracks like Si Te Pica Es Porque Eres Tú, Que Rico PR and Veneka, undoubtedly among the most enthusiastically sung along tracks of the night. For the latter, in collaboration with Akapellah, Beto proudly carried the Latin Grammy for best Latin electronic music performance they received in 2025. As part of this set, two special guests thrilled the crowd: Cheo Pardo, a former member of Los Amigos Invisibles whom Beto introduced as one of our great heroes, great influencers in our musical history, delivered a masterful DJ set dressed as a priest, keeping the crowd’s energy at its peak with classics like Qué Es Lo Que Tiene Esa Nena by El General and El Tiburón by Proyecto Uno. Then there was Yorghaki, who initially went unnoticed wearing a Spider-Man costume until he removed his mask to reveal his identity, before performing his collab with Beéle abusadOra. Among the close to 12,000-people crowd, Venezuelan flags were prominently waved, with many fans wearing outfits referencing the South American country, such as jerseys from the Leones del Caracas baseball team as well as from the national soccer team, known as La Vinotinto. Flags from Mexico, Puerto Rico and the Dominican Republic, among other Latin American nations, were also spotted. But it wasn’t all about the party. In a particularly heartfelt moment, Beto sat among the crowd with his guitar to perform Tonada Por Ella, dedicating the moment to those affected by the twin earthquakes that struck Venezuela last June. He invite", "date_str": "2026-11-01T20:10:08+00:00", "hash": "705d16f53c4adb72", "title_fa": "راوی قی و صنعت خستگی ناپذیر است. در انتخاب عکس خود برای شماره اول این مجله، سردبیر با این واقعیت تحریک شد که او رهبر شناخته شده، اولین و مهمترین و برجسته ترین مرد در زمینه ای است که ما قصد داریم به آن بپردازیم. پاور پلیرهای مرتبط لاتین: فهرست بیلبورد 2026 فاش شد که گریسی آبرامز از ژولیت به رومئو در طول اجراهای هالووین SNL بازآفرینی می کند لیزو جولین نمادین دالی پارتون را بازسازی می کند به دنبال هالووین نمودارها باشید همانطور که 132 سال گذشته است (و کمپبل اخیراً فوربورد را به بی بورد واگذار کرده است)", "image_url": "https://www.billboard.com/wp-content/uploads/2022/11/billboard-issue-1-bw-1260-2.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "موسیقی"], "datetime_fa": "۱۰ آبان • ۲۲:۲۸"}, {"source": "Deadline", "title": "‘Clayface’ Still Boss With Near $23M WW; ‘Resident Evil’ Racks Up $400M WW Poised To Scare Away ‘Backrooms’ – Global Box Office Update", "link": "https://deadline.com/2026/11/box-office-global-clayface-resident-evil-1237210872/", "summary": "It was an awful weekend at the global box office, but a lot of that has to do with the fact that there s no major wide Hollywood release (or China local blockbuster title for that matter) more than the Halloween holiday itself impacting worldwide ticket sales. If there s any indication of how bad the weekend [ ]", "date_str": "2026-11-01T18:14:45+00:00", "hash": "7b7f4f2d5e557eef", "title_fa": "\"Clayface\" هنوز رئیس با نزدیک به 23 میلیون دلار WW; فروش 400 میلیون دلاری «رزیدنت اویل» در دبلیو دبلیو و آماده برای ترساندن «پشت‌خانه‌ها» - به‌روزرسانی باکس آفیس جهانی", "summary_fa": "آخر هفته افتضاحی در باکس آفیس جهانی بود، اما بسیاری از آن به این واقعیت مربوط می‌شوند که هیچ اکران گسترده‌ای در هالیوود (یا عنوان بلاک‌باستر محلی چین برای آن موضوع) بیشتر از خود تعطیلات هالووین که بر فروش بلیت‌های جهانی تأثیر بگذارد، وجود ندارد. اگر نشانه‌ای وجود داشته باشد که آخر هفته چقدر بد است [ ] در حالی که هالووین به گیشه داخلی ضربه می‌زند، لزوماً در سراسر جهان اینطور نیست. تعطیلات در بریتانیا بزرگ است، نه چندان در tps://rezjalibd.github.io/daily-news/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
