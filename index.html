 سبک زندگی اساسی DINK (با درآمد دوگانه، بدون بچه) را داشتم. من و شریکم مشاغلی ایجاد کرده بودیم، هیچ فرزندی نداشتیم و PTO برای سوزاندن. در طول یک دوره 12 ماهه، ما به طور میانگین هر ماه یک بار سفر می کردیم. در پارک ملی آکادیا و آریزونا به پیاده روی رفتیم. خانه ای با استخر اجاره کردیم و در جزیره سانیبل در فلوریدا دوچرخه سواری کردیم. ما پارک ملی جاشوا تری را کاوش کردیم، در کلرادو یک 14er را امتحان کردیم و از چهار پارک ملی مختلف در ایالت واشنگتن بازدید کردیم. من و شوهرم همیشه در مورد خواستن یک فرزند، در نهایت، همدل بودیم، اما نگران بودم که داشتن خانواده سبک زندگی پرماجرا ما را متوقف کند. خوشبختانه اشتباه کردم فکر می‌کردم بچه‌دار شدن ماجراهای ما را به پایان می‌رساند. ما در سراسر مکزیک سفر کردیم، خرابه‌های باستانی مایاها را کاوش کردیم، در سنوت‌ها شنا کردیم و نوشیدنی‌های مختلف آگاو را نوشیدنیم. قبل از بچه دار شدن، نویسنده و همسرش از سفر بسیار لذت می بردند. در اینجا آنها در طول یک سفر جاده ای در اطراف اسپانیا و پرتغال نشان داده شده اند. با حسن نیت از Renate Flanagan. چند ماه بعد باردار شدم. یک بار که انتظار داشتم، نگران بودم که تاریخ سررسید من تاریخ انقضای آزادی باشد."}, {"source": "Business Insider", "title": "I bought a condo in a mountain resort, sight unseen. After 5 years of perks and many drawbacks, I'm ready to leave.", "link": "https://www.businessinsider.com/bought-condo-mountains-moved-there-full-time-cons-pros-2026-9", "summary": "My dog and I made the best of things and found almost everything we could want in the mountains, but we re now pursuing another path. Diana Kightlinger A home in a resort high in the Blue Ridge Mountains seemed like a perfect refuge for my dog and me. Although I made friends, the isolation, limited dating pool, and high resort prices are tough. Eventually, I realized I couldn't live the life I had in mind here. Now, I plan to move to Maine. In late spring 2021, I sat on the couch adrift in my living room and asked Cody, \"What are we doing here?\" He didn't know — he would never have traded a life in Montana, complete with a farmhouse, acreage, and a doggie hiking group, to live on a Blue Ridge mountaintop where we knew no one. The plan was to care for my mother , but nine days after I closed on the condo that was now home, she died. I didn't just grieve her but also the loss of purpose. I'd uprooted my life, and there was no plan B. I bought my unit in a mountain resort sight unseen, congratulating myself on securing a historically low mortgage rate and a price that would have been a steal in the Rockies. But when I looked at my condo building on evening strolls with Cody, I'd see one light. Mine. I realized I lived full-time in a community with 2,000 properties, most of them second homes and short-term rentals that sat empty much of the time, just as I'd expected mine to be. Still, the views of Virginia's Blue Ridge Mountains pulled me out of bed in the morning and distracted me until the light faded. But beauty alone doesn't make a place feel like home. In time, I found a community and perks to living here The view from my Blue Ridge home is one of the reasons I fell in love with mountain life. Courtesy of Diana Kightlinger My home is about an hour southwest of the Charlottesville metro area and a 20-minute drive from the nearest town with any services. Surrounding mountains and easy access to hiking trails are about all my new place had in common with Missoula, the vibrant university town where I'd previously lived for a dozen years. My dog and I moved about a year into the COVID-19 pandemic and, even with more vaccine availability, socializing still took place outside … if you had friends. We didn't. Cody, who gained fame in the 2014 \"Puppy Love\" Super Bowl commercial for his heart-rending look, used that expression to make my failure clear. As an introvert, I could handle solitude, plus I had connections through remote work . As a pack animal, Cody str", "date_str": "2026-09-09T14:35:01+00:00", "hash": "6ece4857bac6d32e", "title_fa": "من یک آپارتمان در یک استراحتگاه کوهستانی خریدم، منظره ای n Italy are Barga, which has amazing views and wine, and Termoli. Elsewhere, Pizzo is my favorite beach town in Calabria, and Torre di Palme has a bit of everything. As much as I love visiting new places, it never takes more than a twist of my arm to go back to Italy. I've visited every Italian region , most of them at least twice. As I've had the great privilege of exploring Italy in greater depth, I've also gotten a bit jaded about the major hot spots and grown more fond of classic Italian small-town charm. Don't get me wrong: Those major cities like Rome and Florence are iconic for a reason. Whenever I return to them, though, I find myself getting frustrated about the overpriced food and crowds so rampant that I find myself clutching onto my bag for dear life. When you visit small towns in Italy , though, being one of the few tourists around can help you get a taste of the locals' everyday life, which — in my opinion — creates a meaningful and more personal experience. So, if you're looking to get out of the major cities and have an unforgettable experience, head to one of these towns instead. Pizzo has tons of local charm and delicious desserts Instead of sticking with the crowds in Tropea, I usually head to Pizzo instead. Kaitlyn Rosati Calabria's Tropea has become quite the popular beach haven in recent years, and for good reason. The coasts of Calabria are some of the most picturesque in all of Italy, with rocky white marbled sand and seas so blue they might as well be on a postcard. As much as I love Tropea, it's often packed with tourists, so if you're looking for a beach town in Calabria that still preserves local charm, nearby Pizzo ought to do the trick. It's not just the beaches that make Pizzo such a great spot, though. Pizzo is home to the tartufo di Pizzo, a decadent chocolate gelato-filled dessert coated in cocoa powder. You can try one at Gelateria Dante, the famed sweet shop that's credited with creating it. While walking around, you'll also want  که به کاهش هزینه‌ها تقریباً به نصف کمک می‌کند، حدود ۵۰ سنت کمتر در هر پوند برای غذای خشک و ۷۰ سنت کمتر در هر قوطی برای غذای مرطوب. همچنین می‌توانید گزینه‌های مقرون‌به‌صرفه‌ای را که برای اندازه نژاد یا نیازهای سلامتی خاص، مانند معده‌های حساس، فرموله شده‌اند، پیدا کنید. بهترین انتخاب غذای خشک ما دستور غذای مرغ، جو و برنج قهوه ای است. این کیبل ترد یک گزینه مقرون به صرفه است که غذاهای غنی از مواد مغذی گوشت و گوشت را با یک وعده غذایی سالم از فیبر ترکیب می کند تا سگ ها را بین"}, {"source": "Business Insider", "title": "I let my 5-year-old walk half a mile alone. Four days later, there was a warrant for my arrest.", "link": "https://www.businessinsider.com/mom-cps-child-walk-alone-neighborhood-pond-2026-9", "summary": "Karyann Parkinson and her son, Sam, age 5. Courtesy of Karyann Parkinson Karyann Parkinson let her 5-year-old son walk half a mile on his own in their gated community. The mom was shocked when police showed up at her door, followed by child protection officers. She was convicted of contributing to the delinquency of a minor and received six-months suspended. This story is based on an interview with Karyann Parkinson, 36, a prospective attorney from Northern Virginia awaiting bar qualification. It has been edited for length and clarity. My life was turned upside down in early June 2026 — two weeks before the birth of my fifth child. I was eight-and-a-half months pregnant when I opened the front door to a security guard from our gated community . He was standing behind my 5-year-old son, Sam. Have you got a story about childhood independence? Please email Jane Ridley at jridley@businessinsider.com if you'd like to be interviewed by Business Insider. Sam, who looked scared, was clutching a handful of goose feathers he'd gathered from a pond inside our HOA, about half a mile from our house. Our neighborhood was close-knit I allowed him to go alone because he wanted to gather more feathers after we'd returned from our daily walk and bike ride there. Everyone in our neighborhood was close-knit and knew each other. There was 24-hour security, a 25-mph speed limit, sidewalks, and wide grass verges. Parkinson s son, Sam, proudly shows off his collection of goose feathers. Courtesy of Karyann Parkinson Sam was a responsible and independent kid. He'd made that journey hundreds of times with me, my husband, Dallin, 37, and our other children, now 7, 11, and 14. However, the security guard thought it was dangerous. He said that a passerby had alerted him after spotting Sam. He said that it was \"against the rules\" for him to be out and about on his own, and the association didn't permit it. I said I didn't know of an HOA bylaw that prohibited children from being alone. He said it was \"against the law\" and that he was contacting the police. A police officer knocked on our door I continued making lunch. \"The guy is being overzealous,\" I thought. I imagined the police had better things to do and nothing would come of it. Sam was shaken up, saying the guard said we broke the rules and there were bad people in our neighborhood. I told him it wasn't the case — that our neighbors were good people and that he didn't need to be afraid. Ten minutes later, a police officer knocked", "date_str": "2026-09-09T14:19:45+00:00", "hash": "b87f184582d95e6c", "title_fa": "به کودک 5 ساله ام اجازه دادم نیم مایل به تنهایی راه برود. چهار روز بعد حکم بازداشت من صادر شد.", "summary_fa": "کاریان پارکینسون و پسرش، سام، 5 ساله. به لطف کاریان پارکینسون، کاریان پارکینسون به پسر 5 ساله خود اجازه داد نیم مایل را به تنهایی در محله آنها راه برود. وقتی پلیس در خانه او ظاهر شد و به دنبال آن افسران حفاظت از کودکان، مادر شوکه شد. او به اتهام مشارکت در بزهکاری یک خردسال محکوم شد و به مدت شش ماه به تعلیق درآمد. این داستان بر اساس مصاحبه ای با کاریان پارکینسون، 36 ساله، یک وکیل بالقوه از ویرجینیای شمالی است که در انتظار صلاحیت وکالت است. برای طول و وضوح ویرایش شده است. زندگی من در اوایل ژوئن 2026 - دو هفته قبل از تولد پنجمین فرزندم - زیر و رو شد. من هشت ماه و نیم باردار بودم که در ورودی را به روی یک نگهبان از محله دردارمان باز کردم. او پشت سر پسر 5 ساله من، سام ایستاده بود. آیا داستانی در مورد استقلال دوران کودکی دارید؟ اگر می‌خواهید با Business Insider مصاحبه کنید، لطفاً به جین ریدلی به آدرس jridley@businessinsider.com ایمیل بزنید. سام که ترسیده به نظر می رسید، مشتی پر غاز را که از برکه ای در داخل HOA ما جمع کرده بود، در حدود نیم مایلی خانه ما، در دست گرفته بود. محله ما به هم نزدیک بود، من به او اجازه دادم تنها برود، زیرا می‌خواست بعد از اینکه از پیاده‌روی روزانه و دوچرخه‌سواری به آنجا برگشتیم، پرهای بیشتری جمع کند. همه در محله ما صمیمی بودند و همدیگر را می شناختند. امنیت 24 ساعته، محدودیت سرعت 25 مایل در ساعت، پیاده روها و حاشیه های وسیع چمن وجود داشت. پسر پارکینسون، سم، با افتخار مجموعه پرهای غاز خود را به نمایش می گذارد. با حسن نیت از Karyann Parkinson سام یک بچه مسئول و مستقل بود. او صدها بار با من، شوهرم، دالین، 37 ساله، و دیگر فرزندانمان"}, {"source": "Business Insider", "title": "Apple CEO John Ternus posts teaser video hours before the company's annual launch event", "link": "https://www.businessinsider.com/apple-teaser-video-launch-event-ceo-john-ternus-iphone-airpods-2026-9", "summary": "Newly inaugurated Apple CEO John Ternus posted a cryptic teaser video ahead of Apple s product launch on Thursday. Michael Buckner/Variety via Getty Images Apple CEO John Ternus posted a cryptic teaser hours before the company's launch event. The unusual teaser could signal a glitzier marketing strategy under Ternus. Apple is widely expected to unveil its first foldable iPhone on Wednesday. John Ternus is stoking the hype. The recently inaugurated Apple CEO took to X on Wednesday to post a cryptic, 14-second teaser video ahead of the company's hotly anticipated launch event this afternoon. pic.twitter.com/CLu9eRDP5b — John Ternus (@johnternus) September 9, 2026 In the short clip, a small spotlight shines down on a dome-shaped, slightly translucent orb that X users speculated could be anything from an iPhone camera to an Apple-branded flashlight. The teaser, the first of its kind for Apple, which typically doesn't publicize its product launches in such amorphous ways, signals a possible new, more glitzy direction Ternus intends to take the company. Ternus officially replaced Tim Cook as CEO on September 1. Formerly a products guy, Ternus has represented Apple in numerous public speaking appearances and helped design the AirPods, among other products. Recently, the ambiguous teaser video has become a popular method for tech companies to garner publicity for upcoming product launches. This summer, Samsung previewed a new line of foldable phones with a video of someone cutting a pizza. Apple is widely expected to unveil a foldable iPhone during Wednesday's launch. Business Insider is set to live blog the launch event from gavel to gavel. Check back on the website at 1 p.m. ET for more updates. Read the original article on Business Insider", "date_str": "2026-09-09T14:18:20+00:00", "hash": "b82dceaa489fd683", "title_fa": "مدیر عامل اپل، جان ترنوس، چند ساعت قبل از مراسم راه اندازی سالانه این شرکت، تیزر ویدئویی را منتشر می کند", "summary_fa": "جان ترنوس، مدیر عامل جدید اپل، پیش از معرفی محصول اپل در روز پنج‌شنبه، یک تیزر ویدیویی مرموز منتشر کرد. مایکل باکنر/ورایتی از طریق گتی ایماژ، جان ترنوس، مدیر عامل اپل، چند ساعت قبل از مراسم راه اندازی این شرکت، تیزر مرموزی را منتشر کرد. این تیزر غیرمعمول می تواند نشان دهنده یک استراتژی بازاریابی درخشان تر تحت ترنوس باشد. انتظار می رود اپل اولین آیفون تاشو خود را در روز چهارشنبه رونمایی کند. جان ترنوس در حال دامن زدن به هیاهو است. مدیرعامل اپل که اخیراً افتتاح شده است، روز چهارشنبه به ایکس رفت تا یک تیزر ویدیویی 14 ثانیه‌ای را قبل از مراسم رونمایی این شرکت بعد از ظهر امروز منتشر کند. pic.twitter.com/CLu9eRDP5b — جان ترنوس (@johnternus) 9 سپتامبر 2026 در این کلیپ کوتاه، یک نورافکن کوچک بر روی یک گوی گنبدی شکل و کمی نیمه شفاف می تابد که کاربران X گمان می کردند می تواند هر چیزی باشد، از دوربین آیفون گرفته تا چراغ قوه با برند اپل. این تیزر، اولین تیزر در نوع خود برای اپل، که معمولاً عرضه محصولات خود را به روش‌های بی‌شکل منتشر نمی‌کند، نشان‌دهنده مسیری جدید و درخشان‌تر احتمالی ترنوس است که قصد دارد شرکت را در پیش بگیرد. ترنوس رسماً در 1 سپتامبر جایگزین تیم کوک به عنوان مدیر عامل شد. ترنوس که قبلاً یک شرکت تولید کننده محصولات بود، نماینده اپل در سخنرانی های عمومی متعددی بوده و در طراحی ایرپادها، در میان محصولات دیگر، کمک کرده است. اخیراً، تیزر ویدیوی مبهم به روشی محبوب برای شرکت‌های فناوری تبدیل شده است تا تبلیغاتی را برای معرفی محصولات آینده به دست آورند. تابستان امسال، سامسونگ خط جدیدی از تلفن‌های تاشو را با ویدیویی از کسی که در حال بریدن پیتزا است، پیش‌نمایش کرد. انتظار می رود اپل در روز چهارشنبه از یک آیفون تاشو رونمایی کند. Business Insider قرار است"}, {"source": "Business Insider", "title": "How much US presidents have been paid since George Washington", "link": "https://www.businessinsider.com/how-much-is-the-us-president-paid", "summary": "Trump is one of three presidents who donated their presidential salaries. Kevin Dietsch/Getty Images Can you put a price tag on being the president of the United States of America? The founding fathers had to in 1789 — how does $25,000 a year sound? Now, the president makes $400,000, though Trump has donated his. How much do you get paid to be the leader of the free world? Since 2001, the president of the United States has been paid $400,000 a year. Compare that to 1789, when the US elected its first president, and the presidential salary was $25,000 a year. While that may sound like a fraction of today's paycheck, the salary's value has actually decreased by about half when adjusted for inflation. In the 237 years since, the president has only received a handful of raises, although, of course, the office comes with plenty of other perks . Here's how the president's annual compensation has changed since America's founding. For the first 84 years of the United States existence, the president earned $25,000 a year. Portrait of George Washington at age 64 renouncing his third term as president, by Gilbert Stuart (American, 1755-1828) (oil on canvas from the White House Collection), 1779. GraphicaArtis/Getty Images When Washington was elected in 1789, the task fell to Congress to decide what the presidential compensation should be. In 2026 dollars, that $25,000 salary would be equal to approximately $949,000, according to the Bureau of Labor Statistics' consumer price index. In all, Washington, John Adams, Thomas Jefferson, James Madison, James Monroe, John Quincy Adams, Andrew Jackson, Martin Van Buren, William Henry Harrison, John Tyler, James K. Polk, Zachary Taylor, Millard Fillmore, Franklin Pierce, James Buchanan, Abraham Lincoln, and Andrew Johnson all made $25,000. The first change came in 1873, when Ulysses S. Grant was the president. The annual salary was raised to $50,000. General Ulysses Simpson Grant, later the 18th President of the United States. Hulton Archive/Getty Images By 1873, that $25,000 had depreciated to about $696,000 in today's money. A sizable bump to $50,000 a year made the salary worth almost $1.4 million in 2026 dollars. Grant, Rutherford B. Hayes, James A. Garfield, Chester A. Arthur, Grover Cleveland, Benjamin Harrison, William McKinley, and Theodore Roosevelt all made $50,000. That lasted for 36 years, until 1909, during William Howard Taft s term. It was raised to $75,000. circa 1910: American Republican politician and the 27t", "date_str": "2026-09-09T14:09:39+00:00", "hash": "f777bdc0f6b74ed6", "title_fa": "رؤسای جمهور آمریکا از زمان جورج واشنگتن چقدر حقوق دریافت کرده اند", "summary_fa": "ترامپ یکی از سه رئیس جمهوری است که حقوق ریاست جمهوری خود را اهدا کرده است. کوین دیچ/ گتی ایماژ آیا می توانید برای رئیس جمهور شدن ایالات متحده قیمت گذاری کنید؟ بنیانگذاران در سال 1789 مجبور بودند - 25000 دلار در سال چگونه به نظر می رسد؟ در حال حاضر، رئیس جمهور 400،000 دلار درآمد دارد، اگرچه ترامپ پول خود را اهدا کرده است. برای اینکه رهبر دنیای آزاد باشید چقدر دستمزد می گیرید؟ از سال 2001، رئیس جمهور ایالات متحده سالانه 400000 دلار حقوق دریافت می کند. آن را با سال 1789 مقایسه کنید، زمانی که ایالات متحده اولین رئیس جمهور خود را انتخاب کرد و حقوق رئیس جمهور 25000 دلار در سال بود. در حالی که ممکن است کسری از حقوق امروز به نظر برسد، ارزش حقوق در واقع با تعدیل تورم حدوداً به نصف کاهش یافته است. در 237 سال پس از آن، رئیس جمهور تنها تعداد انگشت شماری حقوق دریافت کرده است، اگرچه، البته، این دفتر با مزایای فراوان دیگری نیز همراه است. در اینجا نحوه پرداخت غرامت سالانه رئیس جمهور از زمان تأسیس آمریکا تغییر کرده است. در 84 سال اول زندگی ایالات متحده، رئیس جمهور سالانه 25000 دلار درآمد داشت. پرتره جورج واشنگتن در سن 64 سالگی که سومین دوره ریاست جمهوری خود را کنار می گذارد، توسط گیلبرت استوارت (آمریکایی، 1755-1828) (روغن روی بوم از مجموعه کاخ سفید)، 1779. GraphicaArtis/Getty Images هنگامی که واشنگتن در سال 1789 انتخاب شد، این وظیفه بر عهده کنگره قرار گرفت. بر اساس شاخص قیمت مصرف کننده اداره آمار کار، در دلار 2026، این حقوق 25000 دلار برابر با 949000 دلار خواهد بود. در مجموع، واشنگتن، جان آدامز، توماس جفرسون، جیمز مدیسون، جیمز مونرو، جان کوئینسی آدامز، اندرو جکسون، مارتین ون بورن، ویلیام هنری هریسون، جان تایلر، جیمز کی پولک، زکری تیلور، میلارد فیلمور، فرانکلین پیرس، جیمز"}, {"source": "Business Insider", "title": "Oil jumps above $100 a barrel as US-Iran fighting raises Strait of Hormuz disruption fears", "link": "https://www.businessinsider.com/oil-price-passes-100-per-barrel-us-iran-fighting-resumes-2026-9", "summary": "Oil prices passed $100 per barrel for the first time since July. PDVSA Oil prices surged over $100 amid Middle East conflicts affecting global supply concerns. Brent crude, the international benchmark, passed the milestone in European trade on Wednesday. Fresh fighting between the US and Iran has raised fears of disruption in the Strait of Hormuz. Oil jumped above $100 per barrel on Wednesday as escalating fighting in the Middle East raised fears of further supply disruptions. Early in European trading, Brent crude, the global benchmark, tipped above $100, and by around 9:40 a.m. ET, was trading at $100.90 per barrel. The move above $100 was the first since July 24. At the same time, WTI, the US benchmark, was at just below $96 per barrel. Brent has climbed about 25% since early August as hopes for a lasting end to the six-month US-Iran conflict have faded. American forces attacked Iranian tankers after Tehran tried to strike a US Navy warship with ballistic missiles, the US military said on Wednesday. Attacks by Iran-backed Houthi militants this week also set Saudi energy facilities on fire, adding to concerns about oil shipments through the Red Sea and the Strait of Hormuz. The international benchmark previously peaked at $126 a barrel in April before falling back as hopes of a ceasefire grew. The Strait of Hormuz remains central to traders' concerns. Flows through the waterway recently fell below 2 million barrels a day, Rystad Energy estimated, down from 8 million to 9 million barrels a day in the week before fighting resumed on August 30. Although producers including the US, Canada, and Guyana have increased output, the International Energy Agency said last month that global oil supply was expected to fall by 4.3 million barrels a day this year, or roughly 4%. Major banks have responded to the worsening supply picture by lifting their price forecasts. Goldman Sachs, Bank of America, and HSBC are among the firms that have raised their outlooks in recent days. Higher oil prices can filter through the economy by increasing gasoline, shipping, and manufacturing costs. A sustained move near or above $100 could add to inflation pressure and complicate the outlook for interest rates. Read the original article on Business Insider", "date_str": "2026-09-09T13:40:04+00:00", "hash": "e9a2fc9469f76dc5", "title_fa": "قیمت نفت به بالای 100 دلار در هر بشکه رسید زیرا درگیری‌های آمریکا و ایران نگرانی‌ها از اختلال در تنگه هرمز را افزایش داده است.", "summary_fa": "قیمت نفت برای اولین بار از ماه جولای از 100 دلار در هر بشکه عبور کرد. PDVSA قیمت نفت بیش از 100 دلار در بحبوحه درگیری های خاورمیانه که بر نگرانی های عرضه جهانی تأثیر می گذارد، افزایش یافت. نفت برنت، معیار بین المللی، روز چهارشنبه از نقطه عطف تجارت اروپا عبور کرد. درگیری‌های تازه بین آمریکا و ایران نگرانی‌ها از اختلال در تنگه هرمز را افزایش داده است. در حالی که تشدید درگیری ها در خاورمیانه نگرانی ها از اختلالات بیشتر در عرضه را افزایش داده است، قیمت نفت روز چهارشنبه به بالای 100 دلار در هر بشکه رسید. در اوایل معاملات اروپا، نفت خام برنت، معیار جهانی، به بالای 100 دلار رسید و در حدود ساعت 9:40 صبح به وقت شرق اروپا، 100.90 دلار در هر بشکه معامله شد. این حرکت به بالای 100 دلار اولین حرکت از 24 جولای بود. در همان زمان، WTI، معیار ایالات متحده، کمی زیر 96 دلار در هر بشکه بود. برنت از اوایل آگوست تا کنون حدود 25 درصد افزایش داشته است زیرا امیدها برای پایان پایدار درگیری شش ماهه ایران و آمریکا کم رنگ شده است. ارتش آمریکا روز چهارشنبه اعلام کرد که نیروهای آمریکایی پس از آن که تهران تلاش کرد با موشک های بالستیک به کشتی جنگی نیروی دریایی آمریکا حمله کند، به نفتکش های ایرانی حمله کردند. حملات شبه‌نظامیان حوثی مورد حمایت ایران در این هفته همچنین تاسیسات انرژی عربستان را به آتش کشید و بر نگرانی‌ها در مورد ارسال نفت از طریق دریای سرخ و تنگه هرمز افزود. شاخص بین المللی پیش از این در آوریل به 126 دلار در هر بشکه رسیده بود و با افزایش امیدها به آتش بس، کاهش یافت. تنگه هرمز همچنان محور نگرانی های تجار است. ریستاد انرژی تخمین زد که جریان آب از طریق این آبراه اخیراً به کمتر از 2"}, {"source": "Business Insider", "title": "I've eaten most of Trader Joe's seasonal fall foods. These are the 10 you actually must try.", "link": "https://www.businessinsider.com/best-trader-joes-fall-foods-seasonal-shopping-list-snacks-2026-9", "summary": "I ve eaten almost all of Trader Joe s fall offerings, but there are only some things I ll keep buying. Savanna Swain-Wilson I've spent years eating my way through Trader Joe's seasonal fall products . Some of the best things to buy this season are the pumpkin-spice Pretzel Slims and pepita salsa. I really enjoy Trader Joe's pumpkin rolls and pumpkin-spice hum er disruption because many airplanes and flight crews were left in unexpected cities. British Airways said on Wednesday morning that its staff worked through the night to build a new flight schedule, but 190 flights still had to be canceled. According to data from the aviation analytics firm Cirium, 1,746 flights to and from the UK were canceled or did not depart on Tuesday. That's about 30% of the day's schedule. As of Wednesday lunchtime, another 291 flights had been canceled, representing 5% of the schedule, per Cirium. A typical cancellation rate is between 1% and 2%. Almost half of Heathrow's scheduled departures were canceled on Tuesday, per Cirium's data. In total, more than 700 flights in and out of Heathrow had been canceled as of Wednesday lunchtime. Heathrow has one of the most international schedules of any airport globally, with passengers able to fly to over 200 cities in more than 80 countries this month, so the impact of cancellations is global in scope. Alongside cancellations, Business Insider analyzed Flightradar24 data showing that 70 flights bound for Heathrow were diverted elsewhere on Tuesday. 11 of those ended up at Paris' Charles de Gaulle Airport, while six went to Edinburgh and Frankfurt. Not pictured in this map is Air Canada Flight 2080, from Halifax, Nova Scotia. Data from Flightradar24 showed the Boeing 737 Max was midway across the Atlantic before it U-turned and diverted to Newfoundland. Six flights operated by a double-decker Airbus A380 — the world's largest passenger jet— were among the diversions. Half were operated ", "date_str": "2026-09-09T13:12:10+00:00", "hash": "10ea67f07bd11f0e", "title_fa": "نقشه برداری: هرج و مرج سفر به دلیل فروپاشی ترافیک هوایی بریتانیا باعث هزاران پرواز در سراسر جهان شده است", "summary_fa": "مسافرانی که روز سه شنبه در میان هرج و مرج فرودگاه هیترو لندن منتظر بودند. هنری نیکولز / خبرگزاری فرانسه از طریق گتی ایماژ بیش از 2000 پرواز در داخل و خارج از بریتانیا پس از یک قطع بزرگ کنترل ترافیک هوایی لغو شد. هیترو لندن، یکی از شلوغ ترین فرودگاه های جهان، بدترین آسیب را دید. Business Insider نقشه 70 پرواز منحرف شده از هرج و مرج را ترسیم کرد. پرواز به بزرگ‌ترین فرودگاه اروپا در این هفته یک اتفاق عجیب است. بیش از 2000 پرواز در بریتانیا پس از اینکه ارائه دهنده کنترل ترافیک هوایی این کشور، NATS، بعد از ظهر سه شنبه اعلام کرد که با یک \"مشکل فنی\" مواجه شده است، لغو شد. فرودگاه هیترو لندن، شلوغ‌ترین فرودگاه اروپا از نظر تعداد مسافران و یکی از مهم‌ترین قطب‌های ترانزیت جهان، بدترین آسیب را دید. آسمان لندن به طرز وحشتناکی خالی بود زیرا صدها هزار مسافر در سرتاسر کشور در انتظار روی آسفالت یا ترمینال های پر هرج و مرج فرودگاه مانده بودند. هجوم روز سه شنبه باعث اختلال بیشتر شده است زیرا بسیاری از هواپیماها و خدمه پرواز در شهرهای غیرمنتظره مانده اند. بریتیش ایرویز صبح روز چهارشنبه گفت که کارکنان آن در طول شب برای ایجاد برنامه پروازی جدید کار می کردند، اما هنوز 190 پرواز باید لغو می شد. بر اساس داده های شرکت تجزیه و تحلیل هوانوردی Cirium، 1746 پرواز به و از بریتانیا در روز سه شنبه لغو شده یا انجام نشده است. این حدود 30 درصد از برنامه روزانه است. از زمان ناهار چهارشنبه، 291 پرواز دیگر لغو شده است که نشان دهنده 5 درصد برنامه، به ازای هر سیریوم است. نرخ لغو معمول بین 1٪ تا 2٪ است. بر اساس داده‌های سیریوم، تقریباً نیمی از پروازهای برنامه‌ریزی شده هیترو در روز سه‌شنبه لغو شدند. در مجموع، بیش از 700 پرواز"}, {"source": "Business Insider", "title": "Mark Zuckerberg laid out what he uses Meta's new AI agent for — kid-friendly cake recipes and MMA advice", "link": "https://www.businessinsider.com/mark-zuckerberg-muse-ai-meta-baking-tips-mma-advice-2026-9", "summary": "Mark Zuckerberg shared on a podcast how he is using Muse, Meta s new AI agent. Bloomberg/Getty Images Mark Zuckerberg says he tested Meta's AI agent Muse by asking it for baking advice for his kids. In a podcast appearance, Zuckerberg also said Muse had given him tips on his MMA training. Muse, which launched on Tuesday, is the newest in a growing number of publicly available AI agents. Mark Zuckerberg is testing Meta's new personal AI agent with a decidedly low-stakes assignment: helping him bake with his 3-year-old daughter. Speaking on the \"Sources\" podcast released on Tuesday, the Meta CEO said he set up the agent, called Muse, to plan a baking project for them every weekend. Its job is to pick something manageable for a toddler and an adult who knows little about baking, then use a service such as Instacart to make sure the ingredients are ready. The early verdict? Muse may need to adjust its difficulty settings. \"Cake pops, really difficult, surprisingly difficult,\" Zuckerberg said. \"Don't start with cake pops.\" Zuckerberg said he reports back after each project so the agent can learn what worked and what didn't. \"You give it projects, or you give it goals,\" Zuckerberg said. \"And then it just works, and it works 24-7, and it doesn't stop until it's helped achieve the goal.\" You can see Zuckerberg's comments below: The example reflects one of Meta's broader claims about Muse . Unlike a chatbot that simply responds to a prompt, it is designed to pursue longer-term tasks, work in the background, and retain information about a user's preferences. He said he is also using Muse for other family-related tasks . The agent watches for mountain-climbing permits for his older daughter and alerts him when one becomes available. It also created a guide to \"Civilization\" — a video game about building societies — for another of his daughters, then suggested turning it into a history lesson. Away from parenting, Zuckerberg uses Muse to review footage from cameras in his MMA gym. Its feedback can be blunt: \"It looks like you really gave up,\" he said the agent once told him. \"I was like, yeah, I did. I was really tired right there,\" Zuckerberg said. Meta plans to offer Muse with what Zuckerberg described as a large free allowance — about 100 million tokens a week — alongside a paid subscription option. The company says the agent could eventually help users run small businesses, manage ad campaigns, and handle other tasks that require access to outside services. That a", "date_str": "2026-09-09T13:01:03+00:00", "hash": "aacd6ed8cff86451", "title_fa": "مارک زاکربرگ توضیح داد که برای چه چیزی از عامل هوش مصنوعی جدید متا استفاده می کند - دستور پخت کیک مناسب برای بچه ها و توصیه های MMA", "summary_fa": "مارک زاکربرگ در یک پادکست نحوه استفاده از Muse، عامل جدید هوش مصنوعی متا را به اشتراک گذاشت. بلومبرگ/گتی ایماژز مارک زاکربرگ می‌گوید که مامور هوش مصنوعی متا، Muse را با درخواست از او برای مشاوره پختن غذا برای بچه‌هایش آزمایش کرده است. در یک پادکست، زاکربرگ همچنین گفت که میوز نکاتی را در مورد آموزش MMA به او داده است. Muse که روز سه‌شنبه راه‌اندازی شد، جدیدترین در میان تعداد فزاینده‌ای از عوامل هوش مصنوعی در دسترس عموم است. مارک زاکربرگ در حال آزمایش عامل هوش مصنوعی شخصی جدید متا با یک وظیفه کاملاً کم ریسک است: به او کمک می کند تا با دختر 3 ساله اش در پخت غذا بپزد. مدیر عامل متا در صحبت در پادکست \"Sources\" که روز سه شنبه منتشر شد، گفت که او عاملی به نام Muse را راه اندازی کرده است تا هر آخر هفته یک پروژه پخت برای آنها برنامه ریزی کند. وظیفه آن انتخاب چیزی قابل کنترل برای یک کودک نوپا و بزرگسالی است که اطلاعات کمی در مورد پخت دارد، سپس از سرویسی مانند Instacart برای اطمینان از آماده بودن مواد استفاده کنید. حکم اولیه؟ Muse ممکن است نیاز به تنظیم تنظیمات دشواری خود داشته باشد. زاکربرگ گفت: \"کیک پاپ، واقعا سخت است، به طرز شگفت آوری سخت است.\" \"با کیک پاپ شروع نکنید.\" زاکربرگ گفت که او پس از هر پروژه گزارش می دهد تا نماینده بتواند بفهمد چه چیزی موثر بوده و چه چیزی کار نکرده است. زاکربرگ می‌گوید: «شما به آن پروژه می‌دهید یا به آن هدف می‌دهید». \"و سپس فقط کار می کند، و 24-7 کار می کند، و تا زمانی که به رسیدن به هدف کمک نشود متوقف نمی شود.\" می‌توانید نظرات زاکربرگ را در زیر ببینید: این مثال یکی از ادعاهای گسترده‌تر متا در مورد Muse را منعکس می‌کند. برخلاف یک ربات چت"}, {"source": "Business Insider", "title": "My mom got cancer, and I became her caregiver at 34. It showed me I still need my mom.", "link": "https://www.businessinsider.com/caring-for-mom-cancer-caregiver-health-2026-9", "summary": "The author became her mom s caregiver when she was diagnosed with cancer. Courtesy of the author My mom was diagnosed with uterine cancer, which later progressed to Stage 4. I became her sole caregiver, attending every chemotherapy session and putting a move on hold. I developed health problems myself, and I realized caregiving didn't mean our roles disappeared. For years, my mom and I were likened to the Gilmore Girls because of our bond. But there's no episode where Rory has to tell Lorelai she has cancer. It was a reality I was forced to confront in early 2025, when my mom had to have a hysterectomy due to a large tumor pressing on her uterus. Her surgical oncologist informed me over the phone that it was cancerous while she was still in the operating room. Initially, I felt optimistic, assuming that the cancer must be gone after the tumor removal . He explained that they had biopsied some other concerning lymph nodes in her body and wouldn't be able to rule out cancer entirely until those were tested. When my mom woke up from the procedure, I assumed the surgical oncologist would return to inform her of the news. He never came back, so I had to tell my mom — the woman who gave me life — that she did, in fact, have a cancerous tumor , and that we both had to wait several weeks to find out if there was any cancer left in her body. The roles were reversed that day. I became my mom's sole caregiver . Three weeks later, we found out she had a rare form of uterine cancer — Stage 3 adenocarcinoma. I didn't miss any of my mom's appointments Even though it was traumatizing to hear my mom's diagnosis, I'm grateful I was there by her side. She credited me afterward for being able to think of informative questions to ask during the appointment, as she was in pure shock — one way I never anticipated my journalistic skills to come into good use. The author doesn t miss any of her mom s appointments. Courtesy of the author I knew my mom was a very straightforward woman, having spent 20 years in the Air Force as an aircraft maintenance technician. I understood how she found comfort in stressful situations — and that was actually understanding what she was dealing with, the truth that wasn't sugarcoated. Turning on my journalist side honestly helped me cope as well, so I went straight into question mode. What did adenocarcinoma mean? Why didn't it go away when they removed my mom's uterus and the large tumor that led to this situation in the first place? Adenocarcinoma", "date_str": "2026-09-09T12:38:01+00:00", "hash": "f7b8653dbd56f1c5", "title_fa": "مادرم سرطان گرفت و من در 34 سالگی مراقب او شدم. این به من نشان داد که هنوز به مادرم نیاز دارم.", "summary_fa": "نویسنده هنگامی که به سرطان مبتلا شد، مراقب مادرش شد. با حسن نیت نویسنده مادرم مبتلا به سرطان رحم تشخیص داده شد که بعداً به مرحله 4 پیشرفت کرد. من تنها مراقب او شدم و در هر جلسه شیمی درمانی شرکت می کردم و حرکت را به حالت تعلیق در می آوردم. من خودم دچار مشکلات سلامتی شدم و متوجه شدم که مراقبت به معنای ناپدید شدن نقش ما نیست. سال‌ها من و مادرم را به خاطر پیوندمان به دختران گیلمور تشبیه می‌کردند. اما هیچ قسمتی وجود ندارد که روری مجبور شود به لورلای بگوید که سرطان دارد. این واقعیتی بود که در اوایل سال 2025 مجبور شدم با آن روبرو شوم، زمانی که مادرم به دلیل فشار دادن تومور بزرگ روی رحمش مجبور به هیسترکتومی شد. انکولوژیست جراحی او در حالی که هنوز در اتاق عمل بود از طریق تلفن به من اطلاع داد که سرطانی است. در ابتدا، با این فرض که سرطان باید پس از برداشتن تومور از بین برود، خوشبین بودم. او توضیح داد که آنها برخی غدد لنفاوی دیگر را در بدن او بیوپسی کرده اند و تا زمانی که آزمایش نشوند نمی توانند سرطان را به طور کامل رد کنند. وقتی مادرم از عمل بیدار شد، تصور می‌کردم انکولوژیست جراحی برمی‌گردد تا او را از این خبر مطلع کند. او هرگز برنگشت، بنابراین من مجبور شدم به مادرم - زنی که به من زندگی داد - بگویم که او در واقع یک تومور سرطانی دارد و هر دو باید چندین هفته منتظر بمانیم تا بفهمیم آیا سرطانی در بدن او باقی مانده است یا خیر. آن روز نقش ها برعکس شد. من تنها مراقب مادرم شدم. سه هفته بعد، متوجه شدیم که او دارای یک نوع نادر سرطان رحم است - مرحله 3 آدنوکارسینوم. من هیچ یک از قرارهای ملاقات مادرم را از دست"}, {"source": "Business Insider", "title": "Why Pepsi's surprise $1.7 billion Publicis deal has Madison Avenue reeling", "link": "https://www.businessinsider.com/pepsi-publicis-deal-underscores-realities-of-agency-consolidation-2026-9", "summary": "Kevin Carter/Getty Images A version of this post appears in the CMO Insider newsletter. Sign up for Business Insider's weekly marketing newsletter . Forget the Jets and the Sharks, the Yankees and the Red Sox, or Arsenal v. Spurs (on my side of the pond). Few rivalries run as deep as Coca-Cola and Pepsi . That explains why Madison Avenue was so stunned by last week's news: Publicis Groupe had won PepsiCo's $1.7 billion global media, data, and tech account without a traditional pitch. (Omnicom was Pepsi's global media partner for more than 25 years, though Publicis media agencies did already work with the beverage and snacks giant in some markets in Asia.) The context: Publicis handles Coca-Cola's media in North America — and was competing against incumbent WPP for Coke's global business. \"I was gobsmacked and shellshocked all week,\" one marketing consultant told me. Another sent me an unprintable expletive. Two people familiar with the matter told me Publicis has withdrawn from Coke's global pitch and is set to resign the North America account — a business it had won from WPP last year. The Coke North America business is estimated to be worth $805 million, while the global business amounts to $1.8 billion in spending, per the research company COMvergence. AdAge reported on Tuesday that Coke is now planning to put its North American media business back under review. Publicis' coup is widely viewed as a masterstroke by Arthur Sadoun's company , which similarly clinched Microsoft's media business in April without a formal pitch. It also shows how consolidation of the agency landscape is reshaping CMOs' options — particularly for marketers who demand category exclusivity. Madison Avenue's review culture When Coca-Cola confirmed its global media review in June, Pepsi's marketing team quickly seized the opportunity to strike before it was too late. If Publicis had won Coke, Pepsi would have had few obvious alternatives to retaining Omnicom as its global media partner. WPP and Publicis' relationship with Coke would have made those agencies off-limits, and Omnicom's acquisition of IPG , as well as Dentsu's international struggles , left few other scaled global media operations in the market for a company of PepsiCo's size. \"Top-to-top dealmaking is getting more prevalent vis-a-vis running a process with guarantees on people, remuneration, and media cost,\" said Ruben Schreurs, CEO of the marketing consultancy Ebiquity. \"Is this a sign of the times to come?\" It's an", "date_str": "2026-09-09T12:30:23+00:00", "hash": "8470285190871bb7", "title_fa": "چرا قرارداد غافلگیرکننده 1.7 میلیارد دلاری پپسی با Publicis، خیابان مدیسون را متحول کرده است", "summary_fa": "کوین کارتر/گتی ایماژ نسخه ای از این پست در خبرنامه CMO Insider ظاهر می شود. برای خبرنامه بازاریابی هفتگی Business Insider ثبت نام کنید. جت‌ها و کوسه‌ها، یانکی‌ها و رد ساکس، یا آرسنال مقابل اسپرز (در کنار برکه) را فراموش کنید. تعداد کمی از رقابت ها به عمق کوکاکولا و پپسی هستند. این توضیح می‌دهد که چرا خیابان مدیسون از اخبار هفته گذشته بسیار متحیر شده بود: Publicis Groupe 1.7 میلیارد دلار حساب رسانه‌ها، داده‌ها و فناوری جهانی PepsiCo را بدون پیش‌فرض سنتی برنده شده بود. (Omnicom بیش از 25 سال شریک رسانه ای جهانی پپسی بود، اگرچه آژانس های رسانه ای Publicis قبلاً با غول نوشیدنی و تنقلات در برخی از بازارهای آسیا کار می کردند.) زمینه: Publicis رسانه های کوکاکولا در آمریکای شمالی را مدیریت می کند - و با WPP فعلی برای تجارت جهانی Coke رقابت می کرد. یکی از مشاوران بازاریابی به من گفت: «تمام هفته شوکه بودم و شوکه بودم. دیگری برای من یک اکسپلیت غیر قابل چاپ فرستاد. دو نفر از افراد آشنا به این موضوع به من گفتند Publicis از فعالیت جهانی Coke کناره‌گیری کرده و قرار است از حساب آمریکای شمالی کناره‌گیری کند - تجارتی که سال گذشته از WPP برنده شده بود. ارزش تجارت کک در آمریکای شمالی 805 میلیون دلار تخمین زده می شود، در حالی که بر اساس شرکت تحقیقاتی COMvergence، تجارت جهانی 1.8 میلیارد دلار هزینه دارد. AdAge روز سه‌شنبه گزارش داد که Coke اکنون در حال برنامه‌ریزی برای بازنگری تجارت رسانه‌ای خود در آمریکای شمالی است. کودتای Publicis به طور گسترده به عنوان یک شاهکار توسط شرکت آرتور سادون تلقی می شود که به طور مشابه تجارت رسانه ای مایکروسافت را در ماه آوریل بدون ارائه رسمی قطعی کرد. همچنین نشان می‌دهد که چگونه یکپارچه‌سازی چشم‌انداز آژانس، گزینه‌های CMOs را تغییر شکل می‌دهد - به‌ویژه برای بازاریاب‌هایی"}, {"source": "Business Insider", "title": "Gap taps a new exec to find its next act beyond fashion", "link": "https://www.businessinsider.com/gap-hired-paramount-exec-to-help-take-brands-beyond-clothes-2026-9", "summary": "Jamie Drew, Gap Inc. s new head of strategic partnerships and growth, wants to move Gap beyond apparel. Gap Inc. Gap Inc. just made a big hire to help the company move beyond clothes. Jamie Drew will seek out partnerships and new businesses in areas that could include travel, sports, and gaming. Gap has made notable forays into music, but it's risky for brands to go into non-core areas. Gap Inc. wants to be in the middle of the cultural conversation — and just tapped a new exec to grow its business beyond clothes. Gap has hired Jamie Drew as its new head of strategic partnerships and growth, reporting to chief entertainment officer Pam Kaufman, the company exclusively told Business Insider. Drew is tasked with helping push Gap's brands — including Old Navy, Banana Republic, and Athleta, as well as Gap — beyond apparel to other consumer touchpoints. Her mandate is to look beyond traditional fashion partnerships to areas where the parent company or its individual brands could reach new audiences and create new businesses. The company said those areas could include experiences and destinations, hospitality or travel, sports and fitness communities, gaming, and food and beverage. Drew was most recently EVP of consumer products and experiences at Paramount Global, also Kaufman's alma mater, following 15 years at its kids channel Nickelodeon. She helped build the kids' franchise Paw Patrol into a retail business, acquire Teenage Mutant Ninja Turtles, take SpongeBob SquarePants to Broadway, and open the first Nickelodeon Hotel. Drew said her most successful initiatives embodied the brand's DNA. \"Brand partnerships only work when they're truly authentic to the brand's ethos and extend its consumer relevance,\" she said. Reimagining Gap has been a top priority for Richard Dickson, who has revived the retail giant since becoming CEO in 2023. This year, Gap tapped Kaufman for its first chief entertainment role, Walmart alum Justin Breton to drive original content, and Paramount alum Lourdes Arocho to head up licensing. Gap has made headlines for its cultural marketing The company has already been inserting itself into culture — and the Gap brand is its star. Over the past year, the Gap brand has tapped into celebrities and cultural events to draw attention. It cast global pop girl group Katseye in an ad, produced a video with Puerto Rican artist Young Miko around Bad Bunny's Super Bowl halftime show, became Coachella's exclusive apparel sponsor and merch partner, and ", "date_str": "2026-09-09T12:30:01+00:00", "hash": "3db8d71a4f77c942", "title_fa": "Gap به یک مدیر اجرایی جدید ضربه می زند تا عمل بعدی خود را فراتر از مد پیدا کند", "summary_fa": "جیمی درو، رئیس جدید مشارکت های استراتژیک و رشد شرکت گپ، می خواهد گپ را فراتر از پوشاک حرکت دهد. Gap Inc. Gap Inc به تازگی استخدام بزرگی کرده است تا به شرکت کمک کند فراتر از لباس حرکت کند. جیمی درو به دنبال مشارکت و کسب و کارهای جدید در زمینه هایی است که می تواند شامل سفر، ورزش و بازی باشد. Gap هجوم‌های قابل توجهی به موسیقی داشته است، اما رفتن برندها به حوزه‌های غیر اصلی خطرناک است. Gap Inc. می‌خواهد در میانه گفتگوی فرهنگی باشد - و فقط یک مدیر اجرایی جدید را انتخاب کرده تا تجارت خود را فراتر از لباس توسعه دهد. شرکت Gap به طور انحصاری به Business Insider گفت که Gap جیمی درو را به عنوان رئیس جدید مشارکت‌های استراتژیک و رشد استخدام کرده است و به مدیر ارشد سرگرمی Pam Kaufman گزارش می‌دهد. Drew وظیفه دارد به برندهای Gap - از جمله Old Navy، Banana Republic، و Athleta، و همچنین Gap - فراتر از پوشاک به سایر نقاط تماس مصرف‌کننده کمک کند. وظیفه او این است که فراتر از مشارکت های مد سنتی به مناطقی نگاه کند که شرکت مادر یا برندهای فردی آن بتوانند مخاطبان جدیدی را جذب کنند و کسب و کارهای جدیدی ایجاد کنند. این شرکت گفت که این حوزه ها می تواند شامل تجربیات و مقاصد، مهمان نوازی یا مسافرت، اجتماعات ورزش و تناسب اندام، بازی و غذا و نوشیدنی باشد. Drew اخیراً EVP محصولات مصرفی و تجربیات خود را در Paramount Global، همچنین دانشگاه کافمن، پس از 15 سال در کانال بچه‌های Nickelodeon انجام داد. او کمک کرد تا امتیاز بچه‌ها Paw Patrol را به یک تجارت خرده‌فروشی تبدیل کند، لاک‌پشت‌های نینجا جهش یافته نوجوان را به دست آورد، باب اسفنجی را به برادوی برد و اولین هتل نیکلودئون را افتتاح کرد. درو گفت که موفق ترین"}, {"source": "Business Insider", "title": "This startup raised $10 million to bring AI to existing factories", "link": "https://www.businessinsider.com/this-startup-raised-10-million-to-bring-ai-old-factories-2026-9", "summary": "Harmoni cofounders David Caputo and Adam Ellis David Caputo and Adam Ellis Harmoni has raised $10 million from Bessemer Venture Partners to modernize factory floors. The funding comes as the US tries to reindustrialize after years of offshoring. Harmoni's new AI product, HAL, is designed to help workers automate routine tasks. Silicon Valley wants to build highly automated factories from scratch. This startup is betting on the ones America already has. Harmoni, which makes custom tablets and AI software for factory floors, has raised $10 million in Series A funding led by Bessemer Venture Partners, the company told Business Insider exclusively. It declined to disclose its valuation. Harmoni has around 40 customers and expects to add another 10 this month, with aerospace and defense making up its largest customer segment. The funding comes as the US tries to reindustrialize after years of offshoring. Some startups, including Hadrian and Machina Labs , are building new factories designed to rely heavily on robots and automation. Harmoni, by contrast, is targeting the roughly 280,000 American factories filled with traditional machinery and workers. \"We've built this specifically to arm these guys to compete with these autonomous factories,\" cofounder David Caputo told Business Insider. Harmoni, which was founded in 2023, is competing in a crowded market where manufacturers already rely on a patchwork of software. Companies, including MachineMetrics and Datanomix, track machines and production, while other tools track workers, machine maintenance, and the steps required for specific jobs. Harmoni's pitch is that factories should not have to stitch all those systems together themselves — a problem Caputo and his cofounder, Adam Ellis, a longtime manufacturing consultant, said they repeatedly encountered while working with factories. At the center of Harmoni's system are custom tablets that attach magnetically to factory machines and can connect with equipment ranging from modern systems to machines built during World War II. Workers can use the tablets to clock in, pull up instructions, track jobs, and report problems from one place. A Harmoni tablet Harmoni Shokoufeh Mirzaei, chair and professor of industrial and manufacturing engineering at Cal Poly Pomona, said large companies like Amazon are far ahead on automation, while many small and midsize US factories lack basic analytics and run on technology that predates the internet. \"We find the average factory i", "date_str": "2026-09-09T12:01:01+00:00", "hash": "4aa3d1e7e62bb6ab", "title_fa": "این استارت آپ 10 میلیون دلار برای آوردن هوش مصنوعی به کارخانه های موجود جمع آوری کرد", "summary_fa": "بنیانگذاران هارمونی دیوید کاپوتو و آدام الیس دیوید کاپوتو و آدام الیس هارمونی 10 میلیون دلار از Bessemer Venture Partners جمع آوری کرده اند تا کف کارخانه ها را مدرن کنند. این بودجه زمانی به دست می آید که ایالات متحده پس از سال ها تلاش برای صنعتی شدن مجدد دارد. محصول جدید هوش مصنوعی هارمونی، HAL، برای کمک به کارگران در خودکارسازی وظایف روتین طراحی شده است. سیلیکون ولی می خواهد کارخانه های بسیار خودکار را از ابتدا بسازد. این استارت‌آپ روی استارت‌آپ‌هایی شرط‌بندی می‌کند که آمریکا از قبل دارد. این شرکت به طور انحصاری به Business Insider گفت که Harmoni که تبلت‌های سفارشی و نرم‌افزارهای هوش مصنوعی را برای کف کارخانه‌ها تولید می‌کند، 10 میلیون دلار بودجه سری A به رهبری Bessemer Venture Partners جمع‌آوری کرده است. از افشای ارزش خود خودداری کرد. هارمونی حدود 40 مشتری دارد و انتظار دارد در این ماه 10 مشتری دیگر اضافه کند که بخش هوافضا و دفاع بزرگترین بخش مشتریان آن را تشکیل می دهند. این بودجه زمانی به دست می آید که ایالات متحده پس از سال ها تلاش برای صنعتی شدن مجدد دارد. برخی از استارت آپ ها، از جمله آزمایشگاه هادریان و ماشینا، در حال ساخت کارخانه های جدیدی هستند که به شدت به ربات ها و اتوماسیون تکیه دارند. در مقابل، هارمونی تقریباً 280000 کارخانه آمریکایی پر از ماشین آلات و کارگران سنتی را هدف قرار داده است. دیوید کاپوتو، یکی از بنیانگذاران، به Business Insider گفت: \"ما این را به طور خاص برای مسلح کردن این افراد برای رقابت با این کارخانه های خودمختار ساخته ایم.\" هارمونی، که در سال 2023 تأسیس شد، در بازار شلوغی رقابت می کند که تولیدکنندگان از قبل به مجموعه ای از نرم افزارها متکی هستند. شرکت‌هایی، از جمله MachineMetrics و Datanomix، ماشین‌ها و تولید را ردیابی می‌کنند، در حالی که"}, {"source": "Business Insider", "title": "Brands are pushing influencers to hide their paid deals", "link": "https://www.businessinsider.com/brands-asking-creators-not-disclose-paid-partnerships-influencer-marketing-study-2026-9", "summary": "Influencer marketing has a surprisingly persistent #ad disclosure problem. fotostorm/Getty Images Influencer marketing is booming. So is its ad disclosure problem. New research shared with BI found that brands are asking creators not to disclose paid partnerships. The SheSpeaks survey also found 14% of creators said they didn't always disclose brand ties. Brands have a proposition for influencers: What if you didn't make those pesky #ad disclosures? The Utah-based wellness influencer Sharon Johnson, who describes herself in her Instagram bio as a \"Reformed Tradwife,\" said a supplement company recently asked her not to include an #ad disclosure in posts showing her receiving and opening the company's product. Johnson said she labeled the posts anyway, wary of losing her audience's trust and of a potential penalty from the Federal Trade Commission, which mandates clear labeling . The brand's request also rubbed her the wrong way. \"It almost feels like these companies are taking advantage of us because we are doing this for our livelihood,\" she said. That request from the supplement brand was part of a broader trend. A survey of 365 creators conducted for Business Insider by the influencer marketing company SheSpeaks found nearly one in five (18%) said a brand had explicitly requested that they not disclose a partnership in the past year. It's not just brands that are flouting the FTC rules . In the survey, 14% of creators said they didn't always disclose partnerships, up from 2% when SheSpeaks conducted a similar survey a decade ago. Eighty-four percent said they \"always or almost always\" made their brand partnerships clear, down from 95% in the prior survey. \"The fact that disclosure went down was very surprising — we expected everyone to say, or at least know to say, yes,\" said Aliza Freud, CEO of SheSpeaks. \"Paradoxically, it's a little bit more like the Wild West\" now than a decade ago, Freud added. The FTC states that influencers should ensure people see and understand ad disclosures using \"simple and clear language,\" such as by thanking the brand for sending a free product or by using terms like \"advertisement,\" \"ad,\" or \"sponsored.\" The FTC doesn't mandate specific wording, but says the relationship must be displayed \"clearly and conspicuously\" to the viewer. Several creators and talent reps said requests to forgo disclosures were rare and tended to come from smaller brands rather than from big public companies. Leila Marsh, chief talent officer of Th", "date_str": "2026-09-09T11:41:24+00:00", "hash": "3d16ca91d7c5f7fb", "title_fa": "برندها اینفلوئنسرها را تحت فشار قرار می دهند تا معاملات پولی خود را پنهان کنند", "summary_fa": "اینفلوئنسر مارکتینگ یک مشکل دائمی #افشای آگهی دارد. fotostorm/Getty Images اینفلوئنسر مارکتینگ در حال رونق است. مشکل افشای آگهی آن نیز همینطور است. تحقیقات جدیدی که با BI به اشتراک گذاشته شده است نشان می‌دهد که برندها از سازندگان می‌خواهند که مشارکت‌های پولی را افشا نکنند. نظرسنجی SheSpeaks همچنین نشان داد که 14 درصد از سازندگان گفته‌اند که همیشه روابط برند را فاش نمی‌کنند. برندها پیشنهادی برای اینفلوئنسرها دارند: اگر این افشای #تبلیغات مزاحم را انجام نمی دادید، چه؟ شارون جانسون، اینفلوئنسر سلامتی ساکن یوتا، که خود را در بیوگرافی اینستاگرام خود به عنوان یک \"بازرگان اصلاح شده\" معرفی می کند، گفت که یک شرکت مکمل اخیراً از او خواسته است که در پست هایی که نشان می دهد او محصول شرکت را دریافت و باز می کند، افشای #تبلیغ را وارد نکند. جانسون گفت که به هر حال پست‌ها را برچسب زده است، زیرا نگران از دست دادن اعتماد مخاطبانش و مجازات احتمالی کمیسیون تجارت فدرال است که برچسب‌گذاری واضح را الزامی می‌کند. درخواست برند نیز او را به راه نادرستی مالش داد. او گفت: «تقریباً احساس می‌شود که این شرکت‌ها از ما سوء استفاده می‌کنند، زیرا ما این کار را برای امرار معاش خود انجام می‌دهیم. این درخواست از سوی برند مکمل بخشی از یک روند گسترده تر بود. نظرسنجی از 365 سازنده که توسط شرکت اینفلوئنسر مارکتینگ SheSpeaks برای Business Insider انجام شد، نشان داد که تقریباً از هر پنج نفر یک نفر (18٪) می‌گویند که یک برند صراحتاً درخواست کرده است که در سال گذشته شراکت را فاش نکنند. فقط برندها نیستند که قوانین FTC را زیر پا می گذارند. در این نظرسنجی، 14 درصد از سازندگان گفتند که همیشه شراکت‌هایشان را فاش نمی‌کنند، در حالی که یک دهه پیش SheSpeaks یک نظرسنجی مشابه را انجام داد، این رقم 2 درصد بود. هشتاد و چهار درصد"}, {"source": "Business Insider", "title": "The uncomfortable question behind OpenAI's math fight", "link": "https://www.businessinsider.com/openai-math-fight-ai-front-run-user-ideas-data-safe-2026-9", "summary": "OpenAI CEO Sam Altman said the economy had so much inertia. Chip Somodevilla/Getty Images This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . Could using AI to help you with your next big idea ultimately lead AI giants to beat you to the punch? A professor and OpenAI are trading jabs over the progress made on a math problem so difficult to solve that there's a $1 million prize for doing it. The entire saga raises questions about credit for AI-powered work and the data used to train models , writes BI's Ben Shimkus. NYU math professor Tristan Buckmaster announced major progress related to the Navier-Stokes problem only to be followed less than 24 hours later by OpenAI, which proposed a full-blown solution. (Even if you skipped algebra in high school, stay with me here. I'll keep it high level.) Buckmaster was first to post about advancements he made tackling the problem with the help of AI models, including OpenAI's. His post also detailed a tense back-and-forth with OpenAI about their competing research. According to Buckmaster, OpenAI suggested coordinating any announcements and not mentioning Buckmaster's partner, Levent Alpöge, who works for (wait for it) Anthropic. ( You can read Buckmaster's whole post here .) OpenAI computer scientist Sebastien Bubeck pushed back against parts of Buckmaster's post, saying he \"never ever asked Levent to be removed from authorship of his own work.\" Buckmaster said OpenAI acknowledged working on the problem after it learned of his research, but told him \"the model did not look up user data.\" On Tuesday, OpenAI published what it says is a solution to the Navier-Stokes problem . The company said it didn't see Buckmaster and Alpöge's work before they publicly released it, but also couldn't rule out that \"de-identified data derived from their usage of our products helped improve our models⁠.\" You don't have to understand long division to see some potential issues here. Mainly, does using AI models mean you risk their owners front-running your idea? According to OpenAI, its proof is very different from Buckmaster and Alpöge's work. And Buckmaster didn't accuse OpenAI of anything specifically, instead saying he just wanted to lay out the timeline of events. But let's say you had a killer idea for bridesmaid dresses you're toying with in ChatGPT. Right before you're ready to launch, OpenAI announces it's releasing its own app focused on bridesma", "date_str": "2026-09-09T11:32:58+00:00", "hash": "db2a82608978aa86", "title_fa": "سوال ناراحت کننده پشت مبارزه ریاضی OpenAI", "summary_fa": "سام آلتمن، مدیر عامل OpenAI گفت که اقتصاد اینرسی بسیار دارد. Chip Somodevilla/Getty Images این پست در اصل در خبرنامه Business Insider Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. آیا استفاده از هوش مصنوعی برای کمک به ایده بزرگ بعدی‌تان می‌تواند در نهایت غول‌های هوش مصنوعی را به شکست شما سوق دهد؟ یک پروفسور و OpenAI در حال معامله در مورد پیشرفت های حاصل شده در یک مسئله ریاضی هستند که حل آن به قدری دشوار است که برای انجام آن یک میلیون دلار جایزه در نظر گرفته شده است. بن شیمکوس از BI می نویسد: کل حماسه سوالاتی را در مورد اعتبار کار مبتنی بر هوش مصنوعی و داده های مورد استفاده برای آموزش مدل ها ایجاد می کند. تریستان باکمستر، استاد ریاضی دانشگاه نیویورک، پیشرفت بزرگی را در رابطه با مسئله ناویر-استوکس اعلام کرد که کمتر از 24 ساعت بعد توسط OpenAI، که یک راه حل کامل پیشنهاد کرد، دنبال شد. (حتی اگر در دبیرستان جبر را رد کردید، اینجا با من بمانید. من آن را در سطح بالا نگه خواهم داشت.) Buckmaster اولین بار بود که در مورد پیشرفت هایی که برای حل این مشکل با کمک مدل های هوش مصنوعی از جمله OpenAI ایجاد کرده بود پست کرد. پست او همچنین به تفصیل یک رفت و برگشت پر تنش با OpenAI در مورد تحقیقات رقیب آنها را توضیح داد. به گفته Buckmaster، OpenAI پیشنهاد کرده است که هر گونه اطلاعیه را هماهنگ کرده و از شریک Buckmaster، Levent Alpöge، که برای (منتظر آن) Anthropic کار می کند، نام نبرد. (شما می توانید کل پست Buckmaster را در اینجا بخوانید.) سباستین بابک، دانشمند کامپیوتر OpenAI، بخش هایی از پست Buckmaster را عقب نشینی کرد و گفت که \"هیچ وقت از لونت نخواسته است که از نویسندگی کار خود حذف"}, {"source": "Business Insider", "title": "TikTok star Vivian Tu is bringing her ‘Your Rich BFF’ persona to a new finance app", "link": "https://www.businessinsider.com/tiktoker-vivian-tu-bringing-voice-to-new-ai-finance-app-2026-9", "summary": "Vivian Tu says she wants to make financial advice accessible with her new app. Jenny Anderson TikTok star Vivian Tu has a new financial app that gives customized advice in her distinctive voice. Ask Dolly charges $19 a month or $59 a month for a human expert. The app trades on her popularity, but Tu said she hopes it'll become an independent success. TikTok and Instagram star Vivian Tu , the popular financial creator who goes by \"Your Rich BFF,\" has a new way for fans to talk to her. On Wednesday, Tu is launching out of beta a new iOS app, Ask Dolly, which provides customized markets news and financial info — all in her signature relatable voice, Business Insider exclusively learned. For example, here's how the app describes \"The Cost of Borrowing Money\" in a section that tracks 10-year treasuries, 30-year mortgages, and other financial information: \"When Fed Daddy changes interest rates, mortgages, credit cards, and savings accounts all feel it.\" Meanwhile, the app takes its name from a shorthand for dollars. To Tu, personal touches like these are what set Ask Dolly apart from other finance apps. \"I hope that it shines through in this app that it's a lot less suit-and-tie and a lot more everyday person,\" Tu said. Ask Dolly has two paid tiers. For $19 a month, users can get unlimited conversations with an AI financial tool, Pocket Dolly, that's based on Tu and other sources. They also get personalized portfolio \"recipes,\" spending tips, and economic news. Those paying $59 a month get three monthly conversations with a (human) certified financial planner and early access to new features. The app doesn't hold users' funds. Outside the paid tiers, several features are available for free, including economy explainers and an account balance tracking tool. Beyond subscriptions, Ask Dolly seeks to make money from brand partnerships that it says are vetted by certified financial planners and disclosed to users, and from affiliate fees from vendors who are featured in a Marketplace section. Consumers have a multitude of personal finance and budgeting apps to choose from. Other creators have gotten into the space, including Caleb Hammer with DollarWise ($14.99 a month) and MrBeast, whose company this year acquired Step Financial , a banking app geared toward teens. Then there are robo advisors like Betterment (fees starting at $5 a month) and Fidelity Go (0.35% for balances over $25,000) that provide automated money management, while legacy players like Chase and Ba", "date_str": "2026-09-09T11:15:01+00:00", "hash": "1372a7c4a4bede6d", "title_fa": "ویویان تو، ستاره TikTok، شخصیت \"Your Rich BFF\" خود را به یک برنامه مالی جدید می آورد.", "summary_fa": "ویویان تو می‌گوید که می‌خواهد با اپلیکیشن جدیدش مشاوره‌های مالی را در دسترس قرار دهد. ویویان تو، ستاره TikTok، جنی اندرسون، یک برنامه مالی جدید دارد که با صدای متمایز خود توصیه های سفارشی را ارائه می دهد. Ask Dolly 19 دلار در ماه یا 59 دلار در ماه برای یک متخصص انسانی دریافت می کند. این برنامه با محبوبیت او معامله می کند، اما تو گفت امیدوار است که به یک موفقیت مستقل تبدیل شود. ویویان تو، ستاره تیک تاک و اینستاگرام، خالق محبوب مالی که با نام «Your Rich BFF» شناخته می‌شود، روش جدیدی برای طرفداران دارد تا با او صحبت کنند. بیزینس اینسایدر به طور انحصاری آموخته است که در روز چهارشنبه، Tu در حال راه اندازی از نسخه بتا یک برنامه جدید iOS به نام Ask Dolly است که اخبار بازار و اطلاعات مالی سفارشی شده را ارائه می دهد - همه اینها با صدای قابل ارتباط با امضای او. برای مثال، در اینجا نحوه توصیف برنامه «هزینه وام گرفتن پول» در بخشی که خزانه‌های 10 ساله، وام‌های مسکن 30 ساله و سایر اطلاعات مالی را دنبال می‌کند، توضیح داده می‌شود: «وقتی Fed Daddy نرخ‌های بهره، وام‌های مسکن، کارت‌های اعتباری و حساب‌های پس‌انداز را تغییر می‌دهد، همه آن را احساس می‌کنند.» در همین حال، این برنامه نام خود را از یک مخفف دلار گرفته است. برای Tu، کارهای شخصی مانند این مواردی است که Ask Dolly را از سایر برنامه های مالی متمایز می کند. تو گفت: \"امیدوارم که در این برنامه بدرخشد که کت و شلوار و کراوات بسیار کمتری داشته باشد و افراد روزمره بسیار بیشتری داشته باشند.\" Ask Dolly دو طبقه پولی دارد. با 19 دلار در ماه، کاربران می توانند مکالمات نامحدودی را با ابزار مالی هوش مصنوعی، Pocket Dolly، که بر اساس Tu و منابع دیگر است، دریافت کنند. آنها همچنین"}, {"source": "Business Insider", "title": "An Anthropic researcher just quit, saying OpenAI and Anthropic are 'gambling with our lives'", "link": "https://www.businessinsider.com/anthropic-researcher-quits-over-ai-safety-concerns-2026-9", "summary": "Neither company is acting responsibly, Jacob Coxon wrote on X. Imen Ben Youssef / Hans Lucas / AFP via Getty Images An AI researcher said he has left Anthropic, warning that AI labs have been reckless towards safety risks. \"Neither company is acting responsibly,\" he wrote in a departure note. OpenAI and Anthropic have been facing resignations over concerns about AI advancement safety. An Anthropic researcher who previously worked at OpenAI said he quit — and warned that the AI race has become dangerously reckless . Jacob Coxon announced his resignation from Anthropic on Tuesday, saying he had spent the past three years doing pre-training research at the two AI giants. \"Neither company is acting responsibly,\" Coxon wrote on X. \"They are racing straight to self-improving superintelligence and gambling with our lives.\" Coxon was a member of OpenAI's technical staff from 2023 until July 2026, when he moved to Anthropic as a researcher. His research at OpenAI included work on GPT-4o. In Tuesday's post, Coxon said the two labs have not been transparent about their fears regarding AI. \"The people building AI earnestly believe that it could kill us all by the end of the decade. This is not a marketing stunt,\" he wrote. \"If anything, many executives and senior researchers will couch their phrasing in the press to sound sensible — but I hear the same people express fear privately.\" There is one difference between the two companies, he said. \"At OpenAI, many have not deeply internalized the civilizational stakes ,\" Coxon wrote. \"At Anthropic, the stakes are well-understood, but they are locked in a race to get there first — they believe no one else will act responsibly, so they must do it themselves, despite the risk.\" OpenAI and Anthropic did not respond to requests for comment from Business Insider. 'AI could kill all humans' Some of Coxon's former colleagues agreed with him. \"Jacob is correct here—we really do earnestly believe AI could kill all humans!\" wrote Evan Hubinger, a current Anthropic employee who leads the lab's alignment stress testing team, in a reply on X. \"I personally think it is 10% within the next decade.\" He added: \"I believe Anthropic is trying its best, but we do not yet have a plan to solve alignment for superintelligence and are not clearly on track to.\" Samuel Marks, an Anthropic safety researcher who said he was speaking in a personal capacity, also backed Coxon's broader warning. He wrote that some AI developers believe their technology c", "date_str": "2026-09-09T10:58:28+00:00", "hash": "2fbe2d13a1461759", "title_fa": "یک محقق Anthropic به تازگی ترک کرد و گفت OpenAI و Anthropic با زندگی ما قمار می کنند.", "summary_fa": "Jacob Coxon در X. Imen Ben Youssef / Hans Lucas / AFP از طریق Getty Images نوشت هیچ یک از این دو شرکت مسئولانه عمل نمی کنند. او در یادداشت خروج خود نوشت: «هیچ یک از این شرکت‌ها مسئولانه عمل نمی‌کنند. OpenAI و Anthropic به دلیل نگرانی در مورد ایمنی پیشرفت هوش مصنوعی با استعفا مواجه شده اند. یک محقق Anthropic که قبلاً در OpenAI کار می کرد گفت که این کار را ترک کرد - و هشدار داد که مسابقه هوش مصنوعی به طور خطرناکی بی پروا شده است. جیکوب کوکسون روز سه شنبه استعفای خود را از آنتروپیک اعلام کرد و گفت که سه سال گذشته را صرف انجام تحقیقات پیش از آموزش در این دو غول هوش مصنوعی کرده است. کاکسون در X نوشت: «هیچکدام از شرکت‌ها مسئولانه عمل نمی‌کنند. \"آنها مستقیماً به سمت سوپرهوش خودسازی و قمار با زندگی ما مسابقه می دهند.\" کاکسون از سال 2023 تا ژوئیه 2026 یکی از اعضای کادر فنی OpenAI بود که به عنوان محقق به آنتروپیک نقل مکان کرد. تحقیقات او در OpenAI شامل کار بر روی GPT-4o بود. در پست روز سه‌شنبه، کاکسون گفت که این دو آزمایشگاه در مورد ترس‌هایشان در مورد هوش مصنوعی شفاف نبوده‌اند. او نوشت: \"افرادی که هوش مصنوعی می‌سازند، عمیقاً معتقدند که می‌تواند تا پایان دهه همه ما را بکشد. این یک شیرین کاری بازاریابی نیست.\" \"در هر صورت، بسیاری از مدیران و محققان ارشد عبارات خود را در مطبوعات بیان می کنند تا معقول به نظر برسند - اما من می شنوم که همان افراد به طور خصوصی ترس خود را ابراز می کنند.\" او گفت که یک تفاوت بین این دو شرکت وجود دارد. کاکسون نوشت: \"در OpenAI، بسیاری از مخاطرات تمدنی را عمیقاً درونی نکرده اند.\" در آنتروپیک، مخاطرات به خوبی درک شده است، اما آنها در یک مسابقه برای"}, {"source": "Business Insider", "title": "We've been to Kauai 3 times. I want to show my son new places, but I can't help booking a vacation there.", "link": "https://www.businessinsider.com/family-vacation-same-place-kauai-2026-9", "summary": "The author and her family have been to Kauai three times in six years. Courtesy of Nicole Findlay My family loves to travel, and I want to show my son, 9, as many new places as possible. However, I just can't help myself — I love going to Kauai. We've been three times in six years, and I know we'll go again. Every year, I ask my family the same question, \"Where should we go this summer?\" I want to pick somewhere new. Choosing a place we've already been to seems like a waste of an opportunity for my 9-year-old son to experience different places , cultures, and people. Plus, I want to see new countries and continents, too. But I keep booking Kauai — we just can't stay away. Over the last six years, my little family of three has flown from California to Kauai three times to visit the sea turtles at Poipu Beach, hike gorgeous coastal trails, drink Mai Tais at hotel bars, and watch the sunset from our lanai. It s easy to enjoy the outdoors in Kauai. Courtesy of Nicole Findlay I want to show my son the world, but there's something about The Garden Isle Every time we arrive at Lihue Airport, we're greeted by chickens. I love them — my camera roll is full of the feathered locals. Palm trees sway outside the terminal, and the air smells fresh and feels soft, especially after five hours on an airplane. And with the windows down and Hawaiian music on the radio, the drive to our hotel always marks the official start to a week of swimming, snorkeling, hiking, and relaxing beachside. We are a family that loves spending time outdoors , and Kauai makes it easy. The author and her family enjoy visiting the beach and seeing sea turtles while on vacation. Courtesy of Nicole Findlay We have a favorite hotel I don't usually book the same hotel twice, but the Koloa Landing Resort on Kauai truly stole my son's heart, and he's only young once. Here, tropical greenery is everywhere, broken up by pops of red, orange, and white. Plumeria flowers cover the ground, and the floral scent is more relaxing than any candle I have at home. On more than one occasion, I've followed my son over a teak bridge, past a cascading infinity edge and waterslides tucked into the landscape, until he spots exactly what he's looking for: the lava grotto. There's no easy way in if you're trying to keep your hair dry. You either swim underwater or go straight through a waterfall. It's my son's favorite part of the massive 350,000-gallon main pool. Long after we've left Kauai, my son always asks when we get", "date_str": "2026-09-09T10:21:01+00:00", "hash": "64b03b8f56ed02cc", "title_fa": "ما 3 بار به Kauai رفته ایم. می‌خواهم مکان‌های جدیدی را به پسرم نشان دهم، اما نمی‌توانم تعطیلات را در آنجا رزرو کنم.", "summary_fa": "نویسنده و خانواده اش در شش سال سه بار به کائوآی رفته اند. با حسن نیت نیکول فایندلی خانواده من عاشق سفر هستند، و من می خواهم به پسرم، 9 ساله، مکان های جدید را تا حد امکان نشان دهم. با این حال، من نمی توانم جلوی خودم را بگیرم - من عاشق رفتن به کائوآی هستم. ما در شش سال سه بار رفته‌ایم و می‌دانم که دوباره خواهیم رفت. هر سال از خانواده ام همین سوال را می پرسم که تابستان امسال کجا برویم؟ میخوام یه جای جدید انتخاب کنم به نظر می رسد انتخاب مکانی که قبلاً در آن بوده ایم، برای پسر 9 ساله من هدر دادن فرصت است تا مکان ها، فرهنگ ها و مردم مختلف را تجربه کند. به علاوه، من می خواهم کشورها و قاره های جدیدی را نیز ببینم. اما من به رزرو Kauai ادامه می‌دهم - نمی‌توانیم دور باشیم. طی شش سال گذشته، خانواده کوچک سه نفره من سه بار از کالیفرنیا به کائوآی پرواز کرده اند تا از لاک پشت های دریایی در ساحل پویپو دیدن کنند، مسیرهای ساحلی باشکوه را پیاده روی کنند، در بارهای هتل مای تایس بنوشند، و غروب آفتاب را از لانای ما تماشا کنند. لذت بردن از فضای باز در Kauai آسان است. با حسن نیت نیکول فایندلی من می خواهم به پسرم دنیا را نشان دهم، اما چیزی در مورد جزیره باغ وجود دارد هر بار که به فرودگاه لیهو می رسیم، جوجه ها از ما استقبال می کنند. من آنها را دوست دارم - رول دوربین من پر از مردم محلی پر است. درختان نخل بیرون ترمینال تاب می‌خورند و هوا بوی تازه و لطیف می‌دهد، به خصوص پس از پنج ساعت در هواپیما. و با پنجره‌ها پایین و موسیقی هاوایی در رادیو، رانندگی به سمت هتل ما همیشه شروع رسمی یک هفته شنا،"}, {"source": "Lifehacker", "title": "Why the iPhone 18 Pro's Variable Aperture Is a Big Development for Smartphone Photography", "link": "https://lifehacker.com/tech/iphone-18-pro-variable-aperture-explained?utm_medium=RSS", "summary": "Every year, Apple claims its newly launched iPhones have the best cameras ever, and those improvements usually revolve around improved sensors, lenses, and software updates. This year, though, there's an unusual camera upgrade that's going to make a massive difference to your photos and videos: The iPhone 18 Pro and the iPhone 18 Pro Max have a variable-aperture lens, a feature unavailable on the much more expensive iPhone Duo . Variable aperture gives you far greater control over lighting in your iPhone photos. What does \"camera aperture\" mean? A camera's aperture lets you control how much light reaches the lens. For a brighter photo, you want to let in more light; for a darker one, you'd ideally let in less. This system is similar to the pupils of your eyes, which constrict when the light is too bright and dilate when you suddenly go from bright sunshine to a dark room. In DSLR cameras, you can see overlapping blades that partially cover the lens. This opening increases or decreases in size depending on the aperture value. This technology is expensive to implement in a smartphone lens, and so far, the improvement in photos hasn't been good enough to justify the investment. That's why it's rare to find the feature in most phones. Apple added variable aperture to its smartphones for the first time with the launch of the iPhone 18 Pro series . (Note that aperture values are denoted in f-numbers, which means that when you adjust a camera's aperture, the value looks something like f/1.8, f/4.0, etc. The lower the f-number, the brighter the image becomes.) How variable aperture changes photos and videos The iPhone 18 Pro has three rear cameras, but only the main camera offers a variable aperture. It's a 48-megapixel sensor with four aperture f-numbers supported. You can pick an aperture value from f/1.48, f/1.8, f/2.8, and f/4.0m, which should make it significantly easier to get the exposure just right in difficult lighting conditions. You'll also be able to take better photos in low light and try a few additional creative shots with your iPhone 18 Pro. Having a variable aperture is great for controlling depth of field, so you can easily blur the background or keep it in sharp focus when you take photos. With a larger aperture (f/1.48), you'll be able to reduce the depth of field and blur the background for shots that require focus on a single subject. You can use a smaller aperture (f/4.0) to capture stunning landscapes, where you want the entire photo to be ", "date_str": "2026-09-09T19:43:53+00:00", "hash": "0cfd315fda61dc4f", "title_fa": "چرا دیافراگم متغیر آیفون 18 پرو پیشرفت بزرگی برای عکاسی با گوشی های هوشمند است؟", "summary_fa": "هر سال، اپل ادعا می‌کند که آیفون‌های تازه راه‌اندازی شده‌اش بهترین دوربین‌ها را دارند و این پیشرفت‌ها معمولاً حول محور بهبود سنسورها، لنزها و به‌روزرسانی‌های نرم‌افزاری می‌چرخند. با این حال، امسال یک ارتقاء غیرمعمول دوربین وجود دارد که تفاوت زیادی در عکس‌ها و ویدیوهای شما ایجاد می‌کند: آیفون 18 پرو و ​​آیفون 18 پرو مکس دارای لنز با دیافراگم متغیر هستند، این ویژگی در آیفون گران‌تر آیفون Duo در دسترس نیست. دیافراگم متغیر به شما کنترل بسیار بیشتری بر نور در عکس های آیفون شما می دهد. \"دیافراگم دوربین\" به چه معناست؟ دیافراگم دوربین به شما امکان می دهد میزان نوری که به لنز می رسد را کنترل کنید. برای یک عکس روشن تر، می خواهید نور بیشتری وارد کنید. برای یک تیره تر، شما در حالت ایده آل کمتر اجازه ورود خواهید داد. این سیستم شبیه مردمک های چشم شما است که وقتی نور خیلی روشن است منقبض می شود و وقتی ناگهان از آفتاب روشن به یک اتاق تاریک می روید گشاد می شود. در دوربین‌های DSLR، می‌توانید تیغه‌های همپوشانی را ببینید که تا حدی لنز را می‌پوشاند. اندازه این باز شدن بسته به مقدار دیافراگم افزایش یا کاهش می یابد. پیاده سازی این فناوری در لنز گوشی های هوشمند گران است و تاکنون، بهبود عکس ها به اندازه کافی برای توجیه این سرمایه گذاری خوب نبوده است. به همین دلیل است که به ندرت می توان این ویژگی را در اکثر گوشی ها پیدا کرد. اپل برای اولین بار با عرضه سری آیفون 18 پرو، دیافراگم متغیر را به گوشی های هوشمند خود اضافه کرد. (توجه داشته باشید که مقادیر دیافراگم با اعداد f نشان داده می شوند، به این معنی که وقتی دیافراگم دوربین را تنظیم می کنید، مقدار چیزی شبیه f/1.8، f/4.0 و غیره به نظر می رسد. هرچه عدد f کمتر باشد، تصویر روشن"}, {"source": "Lifehacker", "title": "We Finally Know iOS 27's Release Date", "link": "https://lifehacker.com/tech/ios-27-release-date?utm_medium=RSS", "summary": "Apple's September event was a big one. The company announced the new iPhone 18 Pro , Apple Watch Series 12 and Ultra 4, AirPods 5, and the foldable iPhone Duo . While the company certainly highlighted numerous software features for each of these devices, including some never-before-seen health features for Apple Watch , this was very much a hardware event. That's no surprise, of course: Apple reserves the vast majority of its software news for WWDC in June. But despite that fact, there was one particularly big piece of software news to come out of September's keynote: iOS 27's release date. Since Apple is using iOS 27 to advertise many of the capabilities of its upcoming devices, it makes sense that the company would need to give an ETA for the update. After all, the iPhone 18 Pro launches on Friday, Sept. 18, running iOS 27. The update would presumably need to be out by then, unless Apple intended iPhone 18 Pro users to be the first of its user base to run the software. (Spoilers: it did not intend that.) As it happens, the company officially announced the update's launch date, though it didn't advertise it heavily. At the bottom of its newsroom posts for each of its new product announcements, the company confirmed that iOS 27 will launch on Monday, Sept. 14. Developers have been beta testing iOS 27 since June, and Apple opened up the public beta one month later . Since then, volunteers have been trialing Apple's upcoming features, including Siri AI, new image editing tools, and dual-capture during FaceTime calls. Apple also confirmed that watchOS 27 will launch on Sept. 14 as well. However, at this time, it isn't clear whether Apple's other software updates, such as macOS 27 Golden Gate and iPadOS 27, will also launch at this time. If I had to guess, I would say these updates will arrive in tandem, especially iPadOS 27, but we'll have to wait for Apple's confirmation to know for sure. Which iPhones are compatible with iOS 27? Apple is supporting a long list of iPhones with iOS 27, going all the way back to 2019's iPhone 11 series. The full list is as follows: iPhone Duo iPhone 18 Pro iPhone 18 Pro Max iPhone 17e iPhone 17 iPhone 17 Pro iPhone 17 Pro Max iPhone Air iPhone 16e iPhone 16 iPhone 16 Plus iPhone 16 Pro iPhone 16 Pro Max iPhone 15 iPhone 15 Plus iPhone 15 Pro iPhone 15 Pro Max iPhone 14 iPhone 14 Plus iPhone 14 Pro iPhone 14 Pro Max iPhone 13 iPhone 13 mini iPhone 13 Pro iPhone 13 Pro Max iPhone 12 iPhone 12 mini iPhone 12 Pro iPhone 12 Pro Max", "date_str": "2026-09-09T19:15:00+00:00", "hash": "67a7a604cff7223b", "title_fa": "ما بالاخره تاریخ انتشار iOS 27 را می دانیم", "summary_fa": "رویداد سپتامبر اپل رویداد بزرگی بود. این شرکت آیفون 18 پرو جدید، اپل واچ سری 12 و اولترا 4، ایرپاد 5 و آیفون تاشو دوو را معرفی کرد. در حالی که این شرکت مطمئناً ویژگی‌های نرم‌افزاری متعددی را برای هر یک از این دستگاه‌ها برجسته کرده است، از جمله برخی از ویژگی‌های سلامتی که قبلاً دیده نشده بود برای Apple Watch، این یک رویداد سخت‌افزاری بود. البته این جای تعجب نیست: اپل اکثریت قریب به اتفاق اخبار نرم افزاری خود را برای WWDC در ماه ژوئن ذخیره می کند. اما علی‌رغم این واقعیت، یک خبر نرم‌افزاری به‌ویژه بزرگ از سخنرانی ماه سپتامبر منتشر شد: تاریخ انتشار iOS 27. از آنجایی که اپل از iOS 27 برای تبلیغ بسیاری از قابلیت های دستگاه های آینده خود استفاده می کند، منطقی است که این شرکت باید برای به روز رسانی یک ETA ارائه دهد. به هر حال، آیفون 18 پرو در روز جمعه، 18 سپتامبر با سیستم عامل iOS 27 عرضه می شود. احتمالاً این به‌روزرسانی باید تا آن زمان منتشر شود، مگر اینکه اپل قصد داشته باشد که کاربران آیفون 18 پرو اولین ک
