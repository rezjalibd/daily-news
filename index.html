als Prison Break en Vis a Vis en Orange is the New Black, noem ze allemaal maar op. The Riot is hier echter een uitzondering op: deze show vertelt wel degelijk een waargebeurd verhaal. Waargebeurde gevangenisserie The Riot The Riot (de Poolse titel luidt Bunt) is een Poolse historische misdaad- en dramaserie uit 2026, zoals gezegd gebaseerd op waargebeurde gebeurtenissen. Het verhaal speelt zich af in 1989, wanneer Polen midden in een ingrijpende politieke verandering zit. Terwijl het land langzaam afscheid neemt van het communistische regime en de bevolking steeds meer vrijheid krijgt, groeit achter de muren van verschillende gevangenissen juist de onrust. Eigenlijk speelt de Mroki-gevangenis, waar gevangenen zich steeds feller verzetten tegen hun behandeling, de hoofdrol. De spanningen lopen vooral op wanneer de Poolse overheid een amnestieregeling invoert, waardoor bepaalde gevangenen eerder kunnen vrijkomen. Veel gedetineerden blijken echter buiten deze regeling te vallen. Hun woede richt zich op het gevangenispersoneel en uiteindelijk mondt de situatie uit in een grootschalige en gewelddadige gevangenisopstand. Reagan en Janek Het verhaal volgt voornamelijk Reagan (Borys Szyc) en Janek (Filip Pławiak), twee mannen die vroeger samen in de gevangenis zaten. Inmiddels hebben ze ieder een andere weg gekozen en bevinden ze zich aan tegenovergestelde kanten van de gevangenismuren. Wanneer de opstand uitbreekt, worden ze opnieuw met elkaar geconfronteerd. Ondanks hun ingewikkelde verleden besluiten ze samen te werken om de situatie onder controle te krijgen. Hun belangrijkste doel is om amnestie voor de gevangenen te regelen en een bloedbad te voorkomen. Dat blijkt bijzonder ingewikkeld, omdat het vertrouwen tussen de gedetineerden en de autoriteiten vrijwel volledig verdwenen is. Reagan en Janek moeten daardoor niet alleen proberen de opstand te beëindigen, maar ook afrekenen met gebeurtenissen uit hun gezamenlijke verleden. Ondertussen wordt de situatie binnen de ge ی کنند تا اوضاع را تحت کنترل درآورند. هدف اصلی آنها عفو"}, {"source": "Netflix NL", "title": "Dit is waarom Below zo’n ‘gek’ einde heeft", "link": "https://www.netflix-nederland.nl/dit-is-waarom-below-zon-gek-einde-heeft/", "summary": "Hoogstwaarschijnlijk heb jij alle afleveringen van de nieuwe serie Below met Josh Hartnett er al doorheen gejaagd. En misschien denk je ook wel: hé, dat einde dat was toch wel een beetje gek. Waarom heeft Below een open einde? Het einde van Below op Netflix uitgelegd Laten we eerst eventjes een deep dive doen, vol spoilers, dus pas op: Calvin Penney en wetenschapper Fonda Howander hebben lange tijd nodig om te ontdekken wat er werkelijk speelt in Snook s Arm. Gaandeweg komen ze erachter dat het mysterieuze wezen in het water een gigantische inktvis is. Bovendien blijkt het dier veel ouder, groter en gevaarlijker te zijn dan ze aanvankelijk vermoedden. Oude bekenden van Calvin geven het wezen uiteindelijk de naam Mudder. Toch kiest Calvin ervoor om de reuzeninktvis te redden. Fonda ontdekt namelijk dat de enorme ijsberg voor de kust geen gewone ijsmassa is, maar dienstdoet als nest voor het dier. Daar bevinden zich haar eieren, die door het warme en ondiepe water niet kunnen uitkomen. Wanneer Jim Crocker samen met het leger van plan is het gebied vanuit de lucht aan te vallen, besluit Calvin in te grijpen. Hij zorgt ervoor dat de ijsberg verder de oceaan in wordt gesleept, waar de omstandigheden voor de eieren beter zijn. Daarmee helpt Calvin niet alleen Mudder, maar voorkomt hij ook dat de inwoners van Snook s Arm hun woonplaats moeten verlaten. Achter de geplande hervestiging blijken Crocker en zijn dochter Jan namelijk hun eigen financiële belangen te hebben. Onder het gebied bevinden zich waardevolle voorraden kobalt en koper. Door de bewoners te laten vertrekken voordat zij daarvan op de hoogte zijn, zouden Crocker en Jan goedkoop de controle over de waardevolle grond kunnen krijgen. De dood van Mudder Ondanks Calvins reddingsacti ی تخم مرغ ها بهتر است. با انجام این کار، کالوین نه تنها به مادر کمک می کند، بلکه از ساکنان اسنوک آرم نیز جلوگیری می کند تا شهر خود را ترک کنند. در پس اسکان مجدد برنامه ریزی شده، کراکر و دخترش جان به نظر می رسد منافع مالی خود را دارند. در زیر این منطقه ذخایر ارزشمند کبالت و مس وجود دارد. کراکر و"}, {"source": "Netflix NL", "title": "Nieuwe ziekenhuisserie op Netflix brengt veel chaos", "link": "https://www.netflix-nederland.nl/nieuwe-ziekenhuisserie-op-netflix-brengt-veel-chaos/", "summary": "Ziekenhuisseries zijn meestal nogal chaotisch. Zeker niet rustgevend! Maar ze blijven ook boeien, toch? Daarom komt Netflix heel binnenkort met een nieuwe ziekenhuisserie, genaamd Miracles of the ER! Miracles of the ER Miracles of the ER is een Taiwanese (eigenlijk luidt de titel 急診室的奇蹟) medische dramaserie uit 2026 die zich afspeelt op de drukke spoedeisende hulp van het Yang-Da University Hospital. De serie volgt een groep artsen die dagelijks onder enorme tijdsdruk levens proberen te redden en daarbij voortdurend voor moeilijke beslissingen komen te staan. Het verhaal draait voornamelijk om Lin Geng-ming (Kent Tsai), een jonge arts die tijdens zijn studie geen bijzonder goede resultaten behaalde. Toch krijgt hij onverwachts een kans van Chou Cheng-jun (Wallace Huo), het plaatsvervangend hoofd van de spoedeisende hulp. Hij besluit Lin toe te laten tot zijn team, ondanks diens gebrek aan indrukwekkende studieresultaten. Medische kennis Eenmaal op de afdeling moet Lin zich zien te bewijzen tussen twee bijzonder getalenteerde jonge collega s: Tang Hsi en Chiang Tung-yen. Terwijl zij over meer medische kennis en zelfvertrouwen beschikken, moet Lin vooral vertrouwen op zijn doorzettingsvermogen en zijn sterke motivatie om patiënten te helpen. Onder begeleiding van de ervaren artsen Chou Cheng-jun en He Yu-hua (Cheryl Yang) krijgen de jonge dokters te maken met, nou ja, je kunt het eigenlijk wel uittekenen: ernstige ongelukken, levensbedreigende medische situaties, de grillen van patiënten en hun families, noem het allemaal maar op. Tegelijkertijd zorgen conflicten binnen het ziekenhuis voor extra spanningen Dat komt er nog eens bovenop! Langzaam ontdekken de jonge artsen dat een goede dokter zijn veel meer vraagt dan alleen medische kennis. Miracles of the ER bestaat uit acht afleveringen en verschijnt op 12 november 2026 op Netflix. De serie heeft al een trailer, die je hieronder kunt bekijken. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Nieuwe ziekenhuisserie op Netflix brengt veel chaos appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-12T14:42:17+00:00", "hash": "dd987f72de567177", "title_fa": "سریال بیمارستانی جدید در نتفلیکس هرج و مرج زیادی را به همراه دارد", "summary_fa": "سریال های بیمارستانی معمولاً کاملاً آشفته هستند. قطعا آرامش نمی دهد! اما آنها همچنان جذاب هستند، درست است؟ به همین دلیل نتفلیکس به زودی سریال بیمارستانی جدیدی به نام Miracles of the ER را منتشر خواهد کرد! Miracles of the ER معجزات ER یک سریال درام پزشکی تایوانی (در واقع عنوان 急診室的奇蹟) محصول 2026 است که در بخش شلوغ اورژانس بیمارستان دانشگاه یانگ دا اتفاق می‌افتد. این سریال مجموعه ای از پزشکان را دنبال می کند که هر روز تحت فشار زمان بسیار زیاد سعی در نجات جان خود دارند و دائماً با تصمیمات دشوار روبرو می شوند. داستان عمدتاً حول محور لین گنگ مینگ (کنت تسای)، دکتر جوانی است که در طول تحصیل به نتایج خوبی نرسید. با این حال به طور غیرمنتظره ای توسط چو چنگ جون (والاس هوو)، معاون بخش اورژانس به او فرصت داده می شود. او تصمیم می گیرد تا لین را در تیمش بپذیرد، علیرغم عدم نتایج تحصیلی چشمگیرش. دانش پزشکی هنگامی که لین وارد بخش می شود، باید خود را بین دو همکار جوان فوق العاده با استعداد ثابت کند: تانگ هسی و چیانگ تونگ ین. در حالی که آنها دانش پزشکی و اعتماد به نفس بیشتری دارند، لین باید عمدتاً بر پشتکار و انگیزه قوی خود برای کمک به بیماران تکیه کند. پزشکان جوان تحت راهنمایی پزشکان با تجربه چو چنگ جون و هه یو هوا (چریل یانگ) باید با آن دست و پنجه نرم کنند. در عین حال، درگیری های داخل بیمارستان باعث ایجاد تنش اضافی می شود. این در بالای آن است! پزشکان جوان کم کم متوجه می شوند که یک پزشک خوب به چیزی بیش از دانش پزشکی نیاز دارد. Miracles of the ER شامل هشت قسمت است و در 12 نوامبر 2026 در نتفلیکس منتشر خواهد شد. این سریال قبلاً یک تریلر دارد که می توانید آن را"}, {"source": "Pitchfork", "title": "Doechii Revives Her “Swamp Sessions” Series With New Song “Bombs”", "link": "https://pitchfork.com/story/doechii-revives-her-swamp-sessions-series-with-new-song-bombs/", "summary": "“A mission is brewing inside of me,” the rapper wrote in a letter to fans, “to see Black Womanhood exist at the center of Hip-Hop AND Pop”", "date_str": "2026-10-12T18:38:25+00:00", "hash": "04d50034656256df", "title_fa": "Doechii سریال Swamp Sessions خود را با آهنگ جدید Bombs احیا کرد", "summary_fa": "رپر در نامه‌ای به طرفدارانش نوشت: «ماموریتی در درون من در حال شکل‌گیری است، تا ببینم زن سیاه‌پوست در مرکز هیپ‌هاپ و پاپ وجود دارد. در سال 2024 که نیش تمساح هرگز شفا نمی‌یابد، این خواننده رپ تکه‌هایی از آهنگ‌ها و سبک‌های آزاد هفتگی را در یوتیوب به اشتراک می‌گذارد که چندین آهنگ، از جمله «نیسان آلتیما» و «گربه‌ماهی» به میکس تیپ نهایی می‌رسند. پس از سال 2026 آرام، Doechii همچنین نامه ای دست نویس به طرفداران نوشته است. او در یادداشتی که در اینستاگرام منتشر کرد، می‌نویسد: «چند سال گذشته را به عنوان دانشجوی هیپ‌هاپ دوباره یاد گرفتم. زبان، تاریخچه و ریشه‌های آن را مطالعه کردم. \"اکنون، من احساس می کنم الهام گرفته شده است تا در تکامل آن مشارکت کنم. تا آن را در ژانرهای مختلف، صداهای مختلف و بخش‌های مختلف خودم گسترش دهم.» دوچی ادامه می‌دهد: «ماموریتی در درون من در حال شکل‌گیری است (یک مسئولیت واقعاً) تا ببینم زن سیاه‌پوست در مرکز هیپ‌هاپ و پاپ وجود دارد. من می ترسم که اکنون تعهد من تبدیل شدن به هنرمندی باشد که آرزو می کردم در زمان بزرگ شدن وجود داشته باشد. سرانجام به نماد پوست تیره تبدیل شد که چشمان دختر کوچکم می خواستند ببینند. ساختن موسیقی ای که می خواهم بشنوم و تجسم وضعیت تو STAR! چراغی در صنعت من من در هر چیز لعنتی هنر می خواهم.» او نامه را با این جمله قاطعانه به پایان می‌رساند: «من چیز دیگری ندارم که بخواهم بیهوش کنم». متن کامل را در زیر بخوانید. از سال 2019، Doechii چندین EP و برنده گرمی تمساح Bites را منتشر کرده است، اما او هنوز اولین آلبوم رسمی را منتشر نکرده است. اوایل امسال او با لیدی گاگا برای آهنگی اصلی از The Devil Wears Prada 2 با لیدی گاگا همکاری کرد. Doechii همچنین (با رنگ بدن صورتی سر تا پا)"}, {"source": "Pitchfork", "title": "Fontaines D.C. Recruit Rosalía for New Song “Where Is Gone?”", "link": "https://pitchfork.com/story/fontaines-dc-recruit-rosalia-for-new-song-where-is-gone/", "summary": "“She was keeping a Spanish tradition of music alive, which in a spiritual way felt akin to what we’ve tried to do with Irish music,” says the band’s Carlos O’Connell", "date_str": "2026-10-12T17:32:37+00:00", "hash": "b92e1609cfbabfb6", "title_fa": "فونتینز دی سی روزالیا را برای آهنگ جدید «Where Is Gone?» به خدمت گرفت.", "summary_fa": "کارلوس اوکانل لودر از گروه می‌گوید: «او سنت اسپانیایی موسیقی را زنده نگه می‌داشت، که از نظر معنوی شبیه کاری بود که ما سعی کردیم با موسیقی ایرلندی انجام دهیم.» همکاری Rosalía از آلبوم جدید گروه ایرلندی Dopamine Chamber. آن را در زیر بررسی کنید. کارلوس اوکانل، گیتاریست Fontaines، که در مادرید با فرهنگ‌های اسپانیایی و ایرلندی بزرگ شد، در یک بیانیه مطبوعاتی گفت: \"من از اولین آلبوم ROSALÍA که کاملاً زیبا بود، طرفدار آن بودم. چیزی که واقعاً من را هیجان زده کرد این بود که چگونه او سنت اسپانیایی موسیقی را زنده نگه می‌داشت، که از نظر معنوی در هر دو کشور تلاش می‌کرد تا آن را با موسیقی ما انجام دهد. دیدنش زیبا بود او هنرمندی است که از آن زمان در هر مرحله مرا شگفت زده کرده است.\" اتاق دوپامین تولید شده توسط جیمز فورد در 16 اکتبر از طریق XL عرضه می شود. روزالیا به انجام دورهای پشت سر لوکس ادامه می دهد و اخیراً در شنبه شب زنده برای بازی \"Reliquia\" و \"Magnolias\" و در قالب یک طرح کوتاه ظاهر شد."}, {"source": "Rolling Stone", "title": "Larry David Saw O.J. Simpson at a Country Club the Day Nicole Brown Simpson Was Killed", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/larry-david-oj-simpson-nicole-brown-simpson-1235641211/", "summary": "According to a new biography, Seinfeld showrunner and Simpson both ate breakfast at Riviera Country Club on June 12, 1994", "date_str": "2026-10-13T14:19:57+00:00", "hash": "31effc5f9b4ff990", "title_fa": "لری دیوید Saw O.J. سیمپسون در یک باشگاه کانتری روزی که نیکول براون سیمپسون کشته شد", "summary_fa": "طبق یک بیوگرافی جدید، مجری برنامه سینفلد و سیمپسون هر دو در 12 ژوئن 1994 در باشگاه Riviera Country Club صبحانه خوردند. با خواندن بیوگرافی آینده دیوید، امپراطور هیچ چیز، بلیک جی. هریس، سخت است که چند صفحه را بدون حکایت یا داستانی که موسیقی تم Curb Your Enthusiasm را در ذهن شما راه اندازی کند، مرور کنید. با این حال، شاید ناراحت‌کننده‌ترین مثال این باشد: لری دیوید با O.J. سیمپسون روزی که نیکول براون سیمپسون و ران گلدمن کشته شدند. همانطور که در Emperor of Nothing بیان شد، این برخورد تصادفی عجیب در 12 ژوئن 1994 در کلوپ شیک Riviera Country در لس آنجلس رخ داد که دیوید پس از موفقیت سینفلد به آن پیوست. آن روز صبح، دیوید از دوست و همکار کمدی نویس خود، آلن زوایبل و همسر زوایبل، رابین، دعوت کرده بود تا به دیوید، همسرش لوری و نوزاد جدیدشان کازی برای صرف صبحانه در کلوپ بپیوندند. همانطور که اتفاق افتاد، همان روز صبح، سیمپسون در کلوپ کانتری ریویرا نیز مشغول صرف صبحانه بود. [ما] او را در اتاق غذاخوری روز قتل دیدیم! دیوید در کتاب فریاد می زند. در واقع این زوایبل است که خاطرات واضح تری از آن ملاقات دارد. او آن روز صبح، پس از اینکه سیمپسون او را در اتاق غذاخوری شناخت، با سیمپسون صحبت کرد. این دو در سال 1978 ملاقات کرده بودند، زمانی که سیمپسون میزبان برنامه Saturday Night Live بود، جایی که زوایبل یک نویسنده بود. زوایبل که از طرفداران پرشمار سیمپسون از دوران ستاره‌ای که برای بوفالو بیلز می‌دوید، در آن هفته زمان زیادی را با سیمپسون گذراند و مجموعه‌ای از طرح‌ها برای او نوشت. سال ها بعد، آنها در لس آنجلس دوست مشترکی داشتند و گهگاه در مهمانی ها با یکدیگر برخورد می کردند."}, {"source": "Rolling Stone", "title": "‘Republicans Are F–ked’: GOP Strategists Process Trump’s Impact Ahead of Midterms", "link": "https://www.rollingstone.com/politics/politics-features/republican-strategists-process-trump-midterms-1235640385/", "summary": "Conservatives are scrambling to find a silver lining in the chaos that the president's second term unleashed.", "date_str": "2026-10-13T14:00:00+00:00", "hash": "c0111358f1e56825", "title_fa": "\"جمهوری خواهان مخالف هستند\": استراتژیست های جمهوری خواه تاثیر ترامپ را پیش از انتخابات میان دوره ای بررسی می کنند", "summary_fa": "محافظه کاران در تلاش هستند تا در هرج و مرجی که در دوره دوم ریاست جمهوری به راه انداخت، یک خط نقره ای پیدا کنند. این روزها از یک جمهوری خواه در مورد میان دوره ای بپرسید و احتمالاً پاسخی دریافت خواهید کرد که در پنج مرحله غم و اندوه قرار دارد. خشم وجود دارد، البته بیشتر آن نسبت به رئیس‌جمهور به شدت نامحبوب، اما انکار، چانه‌زنی، افسردگی و بیش از اندکی پذیرش نیز وجود دارد. جمهوری‌خواهان قبلاً ضررهایی را متحمل شده‌اند، و اگر دو دوره استبداد دونالد ترامپ نشانه‌ای باشد، آنها در بازگشت بسیار خوب هستند. ممکن است مجبور شوند دوباره این کار را انجام دهند. با توجه به اینکه تعداد نظرسنجی‌های حزب در ایالت‌هایی که معمولاً جمهوری‌خواهان در آن حضور دارند، تیره و تار به نظر می‌رسد، خودی‌های حزب جمهوری‌خواه می‌گویند با وجود اینکه همچنان امیدوارند پس از شمارش آخرین آرا در اوایل نوامبر، مجلس سنا را حفظ کنند، خود را برای شکست بزرگ در مجلس نمایندگان آماده می‌کنند. این می تواند یک دستور بلند باشد: یک نظرسنجی NPR/Marist در اواخر سپتامبر نشان داد که در سراسر کشور، رای دهندگان ترجیح می دهند یک دموکرات را به کنگره انتخاب کنند تا یک جمهوری خواه با اختلاف 12 درصد. یک استراتژیست و فعال محافظه کار عصبانی به من می گوید که جمهوری خواهان لعنت شده اند، زیرا آنها هنوز با نامزدهای جمهوری خواه کار می کنند. همه فساد ترامپ را می بینند. ما تگزاس را به یک نامزد وحشتناک از دست خواهیم داد، فقط به این دلیل که همه پرسی در مورد فساد ترامپ است و پکستون به همان اندازه ترامپ فاسد است. رقابت در سنای تگزاس، جایی که جیمز تالاریکو، سمینار سابق، آماده است تا اولین کرسی سراسری ایالتی خود را در دهه‌های اخیر به دموکرات‌ها بدهد، اساساً برای شکست میان‌دوره‌ای حزب جمهوری‌خواه، نقطه صفر است. همچنین جایی"}, {"source": "Rolling Stone", "title": "How Jenni  چقدر می توانند انتظار پرداخت کنند. بلیت نمایش 29 اکتبر گروه از حدود 230 دلار برای بالاترین بخش شروع می شود. نمایش 1 نوامبر گرانتر از این جفت است و بلیط آن از حدود 300 دلار شروع می شود."}, {"source": "Rolling Stone", "title": "‘Stupid Canadian Wolf Bird’ Quote From ‘Heated Rivalry’ Inspires Unlikely Merch", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/heated-rivalry-canadian-wolf-bird-merch-buy-online-1235641355/", "summary": "Collectible company Youtooz dropped a plush loon toy based on the fan-favorite line from the series", "date_str": "2026-10-13T00:00:00+00:00", "hash": "0fdcb90c7d6df4d6", "title_fa": "نقل قول «پرنده گرگ احمق کانادایی» از «رقابت شدید» الهام‌بخش کالای بعید است", "summary_fa": "شرکت کلکسیونی Youtooz یک اسباب بازی لون مخمل خواب دار را بر اساس خط مورد علاقه طرفداران از این مجموعه حذف کرد. در میان تمام لحظات و خطوط به یاد ماندنی در فصل اول Heated Rivalry، یک خط خارج از کاف در کلبه اکنون در یک کالای جدید به یادگار مانده است. ایلیا روزانوف (کانر استوری) در حالی که در کلبه دوست پسرش، شین هالندر (هادسون ویلیامز) می گذرد، صدای ترسناکی را می شنود که از جنگل می آید و بلافاصله در مورد اینکه چه موجودی قرار است از سایه ها بیرون بیاید وحشت می کند. همانطور که معلوم است، این فقط یک پرنده یا به طور خاص تر، یک لون معمولی کانادایی است. با این حال، ایلیا تحت تأثیر قرار نگرفته و آن را یک پرنده گرگ احمق کانادایی می نامد. اکنون، طرفداران رقابت داغ و آن صحنه نمادین می توانند پرنده گرگ کانادایی خودشان را به لطف همکاری رسمی با برند کلکسیونی Youtooz انتخاب کنند. انتشار جدید Youtooz Heated Rivalry Canadian Wolf Bird Hot Topic 36.90 دلاری در حال فروش یک پارچه مخملی 9 اینچی با الهام از پرنده در رقابت داغ است. این اسباب بازی مخمل خواب دار که از مواد پلی استر نرم و صاف ساخته شده است، بیشتر از اینکه ترسناک باشد، محکم است. این یک نسخه رسمی با مجوز از Youtooz، Hot Topic و Crave است، استودیوی کانادایی پشت سری هاکی موفق. صحنه پرنده گرگ نیز در رمان ریچل رید به همین نام در سال 2019 ظاهر می شود که الهام بخش سریال تلویزیونی بود. Heated Rivalry دومین کتاب از سری بازی‌های تغییردهنده پرفروش‌ترین کتاب رید است. شیک پوشی Canadian Wolf Bird با مجموعه جدیدی از تی شرت های Heated Rivalry در Hot Topic وارد می شود."}, {"source": "Rolling Stone", "title": "My Morning Jacket Connect the Grateful Dead Dots in Faithful San Francisco Residency", "link": "https://www.rollingstone.com/music/music-live-reviews/my-morning-jacket-grateful-dead-san-francisco-fillmore-1235641598/", "summary": "The band concluded a seven-night run at the Fillmore that corresponded to the seven colors of the rainbow", "date_str": "2026-10-12T23:09:21+00:00", "hash": "c0612abefddd3265", "title_fa": "ژاکت صبحگاهی من نقاط مرده سپاسگزار را در محل اقامت وفادار سانفرانسیسکو وصل می کند", "summary_fa": "گروه یک دوره هفت شبه را در فیلمور به پایان رساند که با هفت رنگ رنگین کمان مطابقت داشت، یک یکشنبه شب در سانفرانسیسکو است، و جیم جیمز، بازیگر My Morning Jacket، همه چیز را به خود اختصاص داده است. او به رولینگ استون اعتراف می کند که من در دوره عمیقی از مردگان سپاسگزار زندگی ام بوده ام. از زمانی که بابی [ویر] درگذشت، درگاهی باز شد و من از آن وارد سرزمین مردگان سپاسگزار شدم. این مکان بسیار زیبایی است و من زمان زیادی را اینجا می گذرانم! در واقع، همان شب، فینال یک اجرا هفت شبه در فیلمور اصلی بود، و به اشتراک گذاشتن صحنه با روح گروه در چندین آهنگ انجام می شود. مطمئنا، Grateful Dead در آنجا بازی می‌کردند، اما همچنین در مورد نمایش نسلی از هنرمندان وفادار به صدا و ذات Dead بود. این اقامتگاه هفت ماه پیش، زمانی که ژاکت صبحگاهی من از آثار هنری با تم رنگین کمان برای رونمایی از تاریخ های برنامه ریزی شده برای کاخ صخره ای برجسته کشور استفاده کرد، فاش شد. گروه فقط فاش کرد که هفت برنامه با کد رنگی مطابق با هر یک از هفت رنگ رنگین کمان خواهند بود و نمایش های پشت سر هم بدون تکرار خواهند بود. به طور ضمنی گفته می شد که محل اقامت از چندین اوراق قرضه استفاده می کند که گروه در طول سال ها با محل برگزاری، شهر و پایگاه هواداران منطقه خلیج اطراف ایجاد کرده است. در پیامی در شبکه های اجتماعی MMJ آمده است: ما مشتاقانه منتظر خندیدن، رقصیدن و آواز خواندن با هم هستیم و در عین حال هر رنگ رنگین کمان و زیبایی، تنوع و جادو را در این دنیای وحشی و شگفت انگیز جشن می گیریم! جایی در طول مسیر، ژاکت تصمیم گرفت قوس روایت اجرا را بر جشنی از مردگان سپاسگزار"}, {"source": "Hollywood Reporter", "title": "Six Flags Closes 9 Coasters After Rider Dies in “Gruesome” Fall", "link": "https://www.hollywoodreporter.com/news/general-news/six-flags-closes-coasters-goliath-death-1236728681/", "summary": "More coasters are temporarily shut down in \"abundance of caution\" following a rider reportedly falling from Goliath in Georgia.", "date_str": "2026-10-13T14:19:58+00:00", "hash": "86a5cd996c543acd", "title_fa": "Six Flags 9 Coasters را پس از مرگ رایدر در پاییز وحشتناک می بندد", "summary_fa": "به دنبال سقوط سواری از جالوت در جورجیا، ترن‌های دریایی بیشتری به‌عنوان «احتیاط فراوان» موقتاً تعطیل می‌شوند. به دنبال مرگ سواری که بنا بر گزارش‌ها روز دوشنبه از سواری در Six Flags بر فراز جورجیا سقوط کرد، زنجیره پارک موضوعی به طور موقت 9 ترن هوایی دیگر را در شش پارک تعطیل می‌کند. در حالی که جزئیات مرگ به طور رسمی تایید نشده است، گزارش های رسانه های محلی می گویند که یک سوار از ساحل 200 فوتی 70 مایل در ساعت جالوت سقوط کرده یا به پایین پرتاب شده است. شاهدان صحنه ای وحشتناک را برای 11Alive وابسته به NBC آتلانتا تعریف کردند و گفتند که سوارکار هنگام سقوط چندین بار به زیر لیوانی برخورد کرد. یکی از سواران گفت که مرد در حال سقوط حتی در عکس یادگاری آنها که به طور خودکار گرفته شده و برای فروش در فروشگاه هدیه سواری عرضه می شود، گرفته شده است. شاهد گفت او در تصاویر ما بود. سه بار زمین خورد و با ماشین برخورد کرد. به گفته پلیس، چندین سرنشین دیگر نیز زخمی شدند. دو سوار گفتند که کارگران طبق پروتکل، مهاربندهای ایمنی خود را قبل از شروع سواری بررسی کرده اند. به گزارش آسوشیتدپرس، سخنگوی Six Flags در بیانیه‌ای گفت، به دلیل احتیاط فراوان، جاذبه‌های مشابه را در سراسر پارک‌های خود به طور موقت تعطیل کرده‌ایم. ایمنی مهمانان و اعضای تیم ما همچنان یکی از بالاترین اولویت های ما است. ویدئویی در زیر نشان می‌دهد که سوارکاران پس از این حادثه از جالوت اسکورت می‌شوند. نه سواری اضافی مشابه نسخه پارک جورجیا از Goliath به طور موقت تعطیل شده اند، از جمله Goliath در Magic Mountain در والنسیا، کالیفرنیا، Nitro در Six Flags Great Adventure در نیوجرسی، و Orion و Diamondback در Kings Island در اوهایو."}, {"source": "Hollywood Reporter", "title": "Bethenny Frankel Reveals New Business Venture: A Media, Content, Brand and Commerce Company", "link": "https://www.hollywoodreporter.com/business/business-news/bethenny-frankel-media-content-brand-viral-influencer-1236726681/", "summary": "According to a series of new posts on LinkedIn, the reality TV veteran is staffing up the company with senior executives — including hiring a former staffer from Reese Witherspoon's Hello Sunshine.", "date_str": "2026-10-13T14:15:00+00:00", "hash": "b35246128bc4b829", "title_fa": "بتنی فرانکل سرمایه گذاری تجاری جدیدی را نشان می دهد: یک شرکت رسانه ای، محتوا، برند و تجارت", "summary_fa": "طبق یک سری پست‌های جدید در لینکدین، این کهنه‌کار تلویزیون واقعیت در حال کار با مدیران ارشد شرکت است - از جمله استخدام یک کارمند سابق از Hello Sunshine ریس ویترسپون. بتنی فرانکل در حال نهایی کردن راه اندازی یک سرمایه گذاری تجاری جدید است. Bethenny Media مدل سرگرمی مستقیم به مصرف‌کننده است که من سال‌ها به‌سوی آن ساخته‌ام: محتوای ارتباطی ناب، سریع، خلاقانه و تجاری، تجارت، مارک‌ها و ارزش سهام در یک مکان. فرانکل در لینکدین توضیح داد: Bethenny Media جایی است که محتوا و برندها در کنار هم قرار می گیرند. داستان‌های مرتبط سبک زندگی بتنی فرانکل راه‌اندازی پلت‌فرم جدید دوستیابی خصوصی را جشن می‌گیرد هسته اصلی: همه می‌خواهند همه دیگران برنده شوند (انحصاری) تلویزیون رامونا سینگر توسط بازیگران نام‌برده نمی‌شود در طول پنل BravoCon زنان خانه‌دار واقعی نیویورک، همچنین تا حدی با مدیران ارشد تشکیل شده است. فرانکل استخدام کارینا تیتونه به عنوان افسر ارشد عملیات را تایید کرد. تیتون، که خلاصه‌ای از آنچه که با این مدل جدید ساخته شده برای روش مدرن فرانکل برای جذب مخاطبان و تبدیل آن به درآمد ساخته شده است را در لینکدین منتشر کرد، قبلاً به عنوان معاون و رئیس مجوز و مشارکت برای Hello Sunshine ریس ویترسپون خدمت می‌کرد. بر اساس لینکدین، او از فوریه 2026 با فرانکل بوده است. همچنین در تیم Bethenny Media، لاریسا باخمن حضور دارد که پس از نزدیک به پنج سال به عنوان مدیر خلاق در Conair به عنوان مدیر تجاری و خلاق می‌پیوندد. پس چگونه کار خواهد کرد؟ فرانکل خودش آن را با دوبله کردن برخی از کارهایی که آنها انجام می دهند به عنوان تبلیغات مشخص کرد، و کسانی که تأثیر او را در TikTok دنبال کرده اند، منظور او را از آن درک خواهند کرد. اما Bethenny Media در تجارت دیگر سازندگان نیز خواهد بود."}, {"source": "Hollywood Reporter", "title": "Discovery+ Is Raising Its Prices Under Skydance", "link": "https://www.hollywoodreporter.com/tv/tv-news/discovery-is-raising-its-prices-under-skydance-1236728701/", "summary": "The streamer is upping its ad-free and ad-supported plan by $2 and $1 respectively.", "date_str": "2026-10-13T14:02:06+00:00", "hash": "d39e1d10a780a211", "title_fa": "Discovery+ قیمت های خود را تحت Skydance افزایش می دهد", "summary_fa": "پخش کننده برنامه بدون آگهی و پشتیبانی شده از تبلیغات خود را به ترتیب 2 و 1 دلار افزایش می دهد. Discovery در حال افزایش قیمت برای سرویس استریم خود است، در حالی که سرنوشت آن در Skydance ناشناخته باقی مانده است. Discovery+ طرح تبلیغاتی خود را با 1 دلار به 6.99 دلار در ماه و طرح بدون آگهی خود را با 2 دلار به 11.99 دلار در ماه در ایالات متحده افزایش می دهد. این قیمت ها بلافاصله برای اشتراک های جدید اعمال می شوند. مشترکین موجود 30 روز قبل اطلاعیه دریافت خواهند کرد. این حرکت در حالی انجام می شود که دیوید الیسون، رئیس و مدیر عامل Skydance، برنامه هایی را برای ترکیب HBO Max و Paramount+ در یک برنامه استریم ارائه کرده است. او خاطرنشان کرد که این ممکن است مدتی طول بکشد، بنابراین احتمالاً در این مدت یک گزینه بسته‌بندی از این دو برنامه وجود خواهد داشت. با این حال، حتی در یک اکتبر در 7 کنفرانس مطبوعاتی که در آن الیسون و سایر مدیران چشم‌انداز خود را برای پارامونت و برادران وارنر که به تازگی ادغام شده‌اند، بیان کردند، مدیران به Discovery+ و اینکه چه اتفاقی برای پلتفرم استریم در امپراتوری جدید خواهد افتاد اشاره نکردند. استریمر خانه برنامه‌های خطی در کانال Discovery، HGTV، Food Network، TLC، ID، Animal Planet و Magnolia و همچنین برخی از برنامه‌های ویژه CNN است. این شرکت آخرین بار در مارس 2022، قبل از ادغام برادران وارنر و دیسکاوری، 24 میلیون مشترک جهانی را گزارش کرد. از آگوست 2026، Antenna تخمین زد که 4.9 میلیون مشترک Discovery+ پرداختی در ایالات متحده وجود دارد که حدود نیمی از آنها اعضای پشتیبانی شده از تبلیغات هستند. مدیران اجرایی قبلاً استریمر را یک تجارت سودآور توصیف کرده بودند."}, {"source": "Hollywood Reporter", "title": "Rosé Set to Perform at LACMA’s Art+Film Gala", "link": "https://www.hollywoodreporter.com/music/music-news/rose-perform-lacma-art-film-gala-2026-1236726347/", "summary": "Denis Villeneuve and Artist Vija Celmins will be feted at the 15th annual event, presented once again by Gucci and held at the museum on Nov. 7. Also back: Co-chairs Leonardo DiCaprio and Eva Chow.", "date_str": "2026-10-13T14:00:00+00:00", "hash": "aba3bc30620546d3", "title_fa": "رز قرار است در گالا هنر+فیلم LACMA اجرا کند", "summary_fa": "دنیس ویلنوو و هنرمند ویجا سلمینز در پانزدهمین رویداد سالانه که بار دیگر توسط گوچی ارائه شد و در 7 نوامبر در موزه برگزار شد، مورد تجلیل قرار خواهند گرفت. سوپراستار Blackpink به عنوان مهمان موسیقی در گالا هنر+فیلم LACMA انتخاب شده است. همانطور که قبلاً اعلام شده بود، پانزدهمین گردآوری کمک مالی سالانه در مؤسسه لس آنجلس در نوامبر برگزار خواهد شد. 7، و از ویجا سلمینز از طرف هنر و دنیس ویلنوو از بیننده Dune برای مجموعه فیلم تقدیر کنید. این جشن بار دیگر توسط گوچی برگزار می شود و لئوناردو دی کاپریو و ایوا چاو ریاست آن را بر عهده دارند. چاو در بیانیه‌ای گفت: جشن LACMA Art+Film Gala نمادهای خلاقانه و ارتباط بین انواع خلاقیت در سراسر جهان را جشن می‌گیرد. راس به عنوان یک سوپراستار پاپ جهانی، روحیه شب را با استعداد و سبک بی نظیر خود تقویت خواهد کرد. داستان های مرتبط فلش بک هالیوودی به یاد رومئو + ژولیت: وقتی باز لورمن لئو را در پیراهن هاوایی پوشاند موسیقی لیزا و کارگردان سو کیم در مستندسازی ستاره ها از سیستم کی پاپ در Always Lalisa خواننده راه اجراکنندگان قبلی Art+Film Gala مانند Doja cat سورپرایز سال گذشته (who headlin XTrowith) را دنبال می کند. Sivan)، Celeste، Anderson.Paak، Annie Lennox، Sam Smith، Lenny Kravitz و غیره. او همچنین می‌داند که با روی صحنه رفتن در جمع‌آوری کمک مالی پر زرق و برق به چه چیزی وارد می‌شود، زیرا راس در سال‌های گذشته در این جشن شرکت کرده است، و در سال‌های 2022 و 2023 پشت سر هم ظاهر می‌شود. که سه نامزدی جایزه گرمی را به دست آورد. او همچنین با اجرای کنسرت‌های سفیر با Saint Laurent، Tiffany Co.، Rimowa، Puma، YSL Beauty، Levi s و غیره، نیرویی در سمت برند است. او یک ترفند تک آهنگ جدید را در 17 سپتامبر منتشر کرد،"}, {"source": "Hollywood Reporter", "title": "A Very Good+ Night of Comedy Benefit Books Jerry Seinfeld, Louis C.K. and Marcello Hernandez", "link": "https://www.hollywoodreporter.com/news/general-news/a-very-good-night-comedy-benefit-jerry-seinfeld-louis-ck-1236727940/", "summary": "The fundraiser, set to take place at New York's Beacon Theatre on Nov. 17, will also feature the talents of Leanne Morgan and George Wallace.", "date_str": "2026-10-13T14:00:00+00:00", "hash": "321750bfcf38a348", "title_fa": "یک شب بسیار خوب + کتاب‌های کمدی سودمند جری سینفلد، لوئیس سی.کی. و مارچلو هرناندز", "summary_fa": "جمع آوری کمک مالی که قرار است در 17 نوامبر در تئاتر بیکن نیویورک برگزار شود، استعدادهای لیان مورگان و جورج والاس را نیز به نمایش خواهند گذاشت. بنیاد Good+Foundation در حال آماده شدن برای یک شب بسیار خوب استندآپ به مناسبت بیست و پنجمین سالگرد این سازمان است. این بنیاد که توسط جسیکا سینفلد راه‌اندازی شده است، جمع‌آوری کمک مالی خود را با نام A Very Good+ Night of Comedy در تئاتر بیکن نیویورک در 17 نوامبر ارائه خواهد کرد. عنوان اصلی رویداد جری سینفلد در کنار لیان مورگان، لوئیس سی کی. مارچلو هرناندز و جورج والاس. انتظار می‌رود این رویداد ویژه میزبان حامیان، شرکا و رهبران جامعه برای یک شب فراموش‌نشدنی با خنده و هدف باشد که جمع‌آوری بودجه برای حمایت از کار Good+s با خانواده‌ها را جمع‌آوری می‌کند. داستان های مرتبط تلویزیون مارچلو هرناندز دعوت ویژه ای برای زندایا و تام هالند در Emmys News 2026 داشت. هنرمندان پرتغالی از جشنواره با تیتر جری ساینفلد کنار رفتند وقتی 25 سال پیش Good+ را شروع کردم، هرگز نمی توانستم تصور کنم که این جامعه با هم به انجام خواهند رساند. در طول سال‌ها، کمدی بخش ویژه‌ای از رویدادهای مفید Good+s بوده است، و مردم را از طریق خنده دور هم جمع می‌کند و در عین حال سرمایه‌های حیاتی را برای خانواده‌ها جمع‌آوری می‌کند. جشن گرفتن این نقطه عطف با جری و این گروه کمدین باورنکردنی بخصوص مناسب است. جسیکا سینفلد، که به عنوان موسس و رئیس هیئت مدیره این سازمان خدمت می کند، گفت: من از همه کسانی که در 25 سال گذشته بخشی از Good+ بوده اند و به انجام این کار کمک کرده اند بسیار سپاسگزارم. این بنیاد در نیویورک و لس آنجلس با تمرکز بر کمک به شکستن فقر چند نسلی از طریق جفت کردن کالاها و خدمات برای خانواده‌هایی که منابع کافی ندارند، فعالیت"}, {"source": "Hollywood Reporter", "title": "Hillary Clinton, Kara Swisher to Launch Political Podcast ‘High Stakes’", "link": "https://www.hollywoodreporter.com/business/business-news/hillary-rodham-clinton-kara-swisher-1236728675/", "summary": "The partnership with Vox Media will kick off Oct. 14 to catch a wave of election interest; future collaborations are anticipated.", "date_str": "2026-10-13T13:37:05+00:00", "hash": "4d1d7057beb85d5e", "title_fa": "هیلاری کلینتون و کارا سویشر پادکست سیاسی «High Stakes» را راه اندازی می کنند", "summary_fa": "همکاری با Vox Media از 14 اکتبر آغاز خواهد شد تا موجی از علاقه انتخابات را جلب کند. همکاری های آینده پیش بینی می شود. هیلاری رادهام کلینتون و کارا سویشر پادکست خود را با مضمون سیاسی به موقع برای انتخابات میان دوره ای ایالات متحده راه اندازی می کنند. وزیر امور خارجه سابق ایالات متحده و روزنامه نگار کهنه کار دیجیتال از برنامه های High Stakes با مشارکت Vox Media پرده برداری کردند تا در 14 اکتبر به عنوان سومین قسمت On With Kara Swisher، پادکستی برای مجله نیویورک آغاز شود. این دو در مورد مسائل سیاسی کلیدی مانند هزینه های زندگی، مراقبت های بهداشتی و فناوری در آستانه انتخابات میان دوره ای 3 نوامبر، با حضور طرف های مخالف در میان کسانی که بحث می کنند، بحث خواهند کرد. کلینتون درباره شراکت خود گفت: فکر نمی کنم خطرات برای کشور ما و جهان هرگز بالاتر از آنچه در نوامبر بود، نبوده است. مردم تشنه گفتگوی واقعی در مورد آنچه در دموکراسی ما رخ می دهد و برای خانواده هایشان چه خواهد بود، هستند، و من نمی توانم شریکی بهتر از کارا برای آن فکر کنم. مقداری بحث، بحث و مناظره و امیدوارم خنده زیادی وجود داشته باشد. همکاری های آینده بین کلینتون، سویشر و وکس مدیا پیش بینی می شود. این در حالی است که سویشر اخیراً اعلام کرد که CNN را پس از تکمیل قرارداد پارامونت اسکای‌دنس برای خرید برادران وارنر، ترک خواهد کرد. دیسکاوری و قرارداد او اواخر امسال برای تمدید می‌آیند. جیم بانکوف، یکی از بنیانگذاران و مدیر عامل شرکت وکس مدیا، در بیانیه ای گفت: من بسیار مفتخرم که وزیر کلینتون را قهرمانی برای میلیون ها نفر آورد که تأثیر عمیقی در ساختن جهان به مکان بهتری برای Vox Media داشته است. او و کارا نیروهای طبیعت هستند و شیمی غیرقابل انکاری به عنوان"}, {"source": "Hollywood Reporter", "title": "The Asylum Is Bringing ‘Z Nation’ Back From the Dead (Exclusive)", "link": "https://www.hollywoodreporter.com/tv/tv-news/the-asylum-rebooting-z-nation-1236728663/", "summary": "The cult zombie series is getting a sequel, with fan favorites Warren, Murphy, Doc and Citizen Z are in talks to return to the zombie apocalypse.", "date_str": "2026-10-13T13:17:35+00:00", "hash": "7c848801e4b6d0e0", "title_fa": "پناهندگی \"ملت Z\" را از مردگان باز می گرداند (اختصاصی)", "summary_fa": "سری زامبی‌های فرقه‌ای دنباله‌ای پیدا می‌کند، با طرفداران مورد علاقه وارن، مورفی، داک و شهروند Z در حال مذاکره برای بازگشت به آخرالزمان زامبی‌ها هستند. تهیه‌کنندگان شارکنادو و اسلواک میسترهای مورد علاقه همه، سریال‌های زامبی ترسناک/کمدی کالت خود را با دنباله‌ای راه‌اندازی مجدد دوباره احیا می‌کنند. Z Nation: Ressurection چندین سال پس از وقایع سری اصلی در همان دنیای پر از زامبی‌ها مانند Z Nation اتفاق می‌افتد. جهان با یک تهدید نامرده جدید روبرو است که جمعیت انسانی باقیمانده جهان را تهدید می کند. Asylum می‌گوید Z Nation: Ressurection نسل جدیدی از بازماندگان را به نمایش می‌گذارد، با افراد مورد علاقه طرفداران سریال اصلی، از جمله وارن (کلیتا اسمیت)، مورفی (کیت آلن)، داک (راسل هاجکینسون) و شهروند Z (دی‌جی کوالز) در حال مذاکره برای پیوستن به سری جدید در نقش‌های مکمل هستند. داستان فتاد. Les Films du Jeudi بازسازی 4K را با همکاری Cin math que Fran aise و با حمایت هیئت ملی فیلم فرانسه (CNC) انجام داد. این شرکت مستقر در پاریس نیز به مناسبت بزرگداشت پنجاهمین سالگرد مرگ ستاره ژان گابین، Miroir (1946)، اثر ریموند لامی را به صف می کند. گابن نقش موسیو لوساک را بازی می‌کند که زندگی دوگانه‌ای دارد: روز، او یک سرمایه‌دار ثروتمند، باهوش و قابل احترام است، اما در شب تبدیل به Mirror، یک رهبر باند بی‌رحم در مارسی می‌شود."}, {"source": "Variety", "title": "Qatar to Bow Domestic Feature Productions at Upcoming Doha Film Festival in ‘Watershed Moment’", "link": "https://variety.com/2026/film/festivals/qatar-feature-productions-doha-film-festival-1236909109/", "summary": "The upcoming Doha Film Festival will feature the world premieres of four feature films from Qatar, in what is being touted as a milestone. The tiny Arab state, which is rich in oil and gas, is branching out from the energy sector into the media and entertainment sphere. The revamped fest, now at its second [ ]", "date_str": "2026-10-13T14:05:01+00:00", "hash": "0039139824c7a6c1", "title_fa": "قطر در «لحظه آبخیز» تولیدات داخلی خود را در جشنواره فیلم دوحه تقدیم می کند", "summary_fa": "در جشنواره آتی فیلم دوحه، اولین نمایش جهانی چهار فیلم بلند از قطر برگزار می شود که به عنوان نقطه عطفی از آن یاد می شود. این کشور کوچک عربی که سرشار از نفت و گاز است، از بخش انرژی به حوزه رسانه و سرگرمی منشعب می شود. این جشنواره بازسازی‌شده که اکنون در دومین دوره خود است [ ] شامل مستند الهام‌بخش First to Fly (تصویر بالا) اثر رودریگو وازکز سالسی، درباره دو ژیمناستیک جوان عرب است که اولین ورزشکاران تاریخ قطر بودند که در مسابقات جهانی ژیمناستیک ریتمیک شرکت کردند. محصول مشترک قطر و مراکش A Very Ordinary Life، درام به کارگردانی محمد دنیز، درباره یک خلبان بازنشسته قطری و یک معلم هنر جوان مراکشی که ناخودآگاه پدر و دختر هستند. مستند جوداری منو، فیلمساز قطری، غواص آزاد و ماهیگیر نیزه ای جمال الخنجی، درباره تلاش کارگردان برای فرود آوردن یک ماهی تن دندان سگ رکورددار جهانی. و هنگامی که اخبار شما را می‌رساند، مستندی از حمد الحجری، فیلمساز قطری، که چالش‌های پیش روی روزنامه‌نگارانی را که در مناطق جنگی خاورمیانه کار می‌کنند، بررسی می‌کند. پرطرفدار در Variety Rounding out the قطری اپیزود ویژه ای از Elzam است، مجموعه ای مستند که توسط استودیوی کاتارا تهیه شده است و گروهی از شاهین داران را در سفرهای شکار دنبال می کند و در سنت هایی که مایه افتخار قطر و جهان عرب گسترده تر است، می کاود. فاطما حسن الرمایحی، مدیرعامل موسسه فیلم دوحه، که همچنین مدیر جشنواره فیلم دوحه است، در بیانیه‌ای گفت: این لحظه نقطه عطفی برای فیلم و صنایع خلاق قطر است. ارائه چهار فیلم بلند و یک مجموعه اصلی از قطر در جشنواره فیلم دوحه، بازتابی قدرتمند از پیشرفت اکوسیستم خلاق ما است."}, {"source": "Variety", "title": "Ex-HBO Max and Legendary Execs Launch Twin Pines Entertainment, Studio Focused on Pro-Sports Movies and Series for America’s ‘Overlooked’ Heartland", "link": "https://variety.com/2026/tv/news/twin-pines-entertainment-clint-sean-kisker-jason-kandar-1236906722/", "summary": "The founders of Twin Pines Entertainment see an opportunity to make movies and TV shows geared around professional sports teams aimed at the millions of people in America’s heartland which they argue are often dismissed by Hollywood. Twin Pines was founded by twin brothers Clint Kisker (a Legendary Entertainment alum) and Sean Kisker (a [ ]", "date_str": "2026-10-13T14:00:00+00:00", "hash": "ce265febeda9b96f", "title_fa": "مکس سابق HBO و مدیران افسانه‌ای، سرگرمی Twin Pines را راه‌اندازی کردند، استودیو با تمرکز بر فیلم‌ها و سریال‌های ورزشی حرفه‌ای برای هارتلند «Overlooked» آمریکا", "summary_fa": "بنیانگذاران Twin Pines Entertainment فرصتی برای ساخت فیلم‌ها و برنامه‌های تلویزیونی با محوریت تیم‌های ورزشی حرفه‌ای با هدف میلیون‌ها نفر در قلب آمریکا می‌بینند که به گفته آنها اغلب توسط هالیوود طرد می‌شوند. Twin Pines توسط برادران دوقلوی کلینت کیسکر (یک دانشمند سرگرمی افسانه ای) و شان کیسکر (یک [ ] بنیانگذاران کلینت کیسکر، شان کیسکر و جیسون کاندر تاپ تهیه کننده تاد لیبرمن به عنوان مشاور، کلینت کیسکر به عنوان مدیر عامل، شان کیسکر به عنوان مدیر عامل، شان کیسکر به عنوان رئیس شرکت سرگرمی مستقر است. کانزاس سیتی، میسوری، با دفاتر در لس آنجلس. محبوب در Variety این سه نفر، Twin Pines را برای تولید پروژه‌هایی که ریشه در روایت‌های غیر متعارف دارند، اغلب از دیدگاه تیم‌های ورزشی و طرفداران آن‌ها آغاز کردند: افراد حاضر در جایگاه‌ها، خانواده‌هایی که یک تیم را در طول نسل‌ها منتقل می‌کنند، و شهرهایی که با هر فصل بالا و پایین می‌روند. به گفته کلینت کیسکر، این شرکت قصد دارد برنامه‌نویسی را با مأموریت بازنویسی داستان سرزمین قلب تولید کند. نام این شرکت اشاره‌ای به مرکز خرید Twin Pines از سال 1985 کلاسیک بازگشت به آینده است و همچنین اشاره ای به دوقلوهای Kisker است. Twin Pines چندین پروژه بدون اسکریپت، اسکریپت و پادکست دارد که در حال حاضر با همکاری تیم های ورزشی حرفه ای در حال توسعه هستند، اما کلینت کیسکر هنوز آماده افشای آن ها نیست. کلینت کیسکر می گوید: ما یک شرکت داستان سرایی هستیم که ساخته شده تا میانه نادیده گرفته شده آمریکا را به جهان بیاوریم. برای یک نسل، صنعت سرگرمی یا قلب سرزمین را نادیده گرفته یا آن را کاریکاتوری کرده است، و یکی از بزرگترین مخاطبان کشور را تحت پوشش قرار داده است. ما از نزدیک می دانیم که چقدر با خالقان، خرده فرهنگ ها و داستان ها غنی است. و هواداران تیم های ورزشی"}, {"source": "Variety", "title": "How AI Is Used by Netflix at Its VFX Eyeline Studios, Revealed by VP Mohsen Mousavi at View Conference", "link": "https://variety.com/2026/artisans/global/ai-use-netflix-eyeline-studios-vfx-mohsen-mousavi-view-1236910043/", "summary": "Netflix-owned Eyeline Studios is using generative AI to replace locations, rebuild crowds and change lighting after filming, while developing tools that could even let directors reposition the camera once an actor’s performance has been captured. “We’re not prompting our way into shots and movies. That’s not who we are,” Mohsen Mousavi, Eyeline’s VP of Virtual [ ]", "date_str": "2026-10-13T13:55:51+00:00", "hash": "e596556443a8f644", "title_fa": "نحوه استفاده از هوش مصنوعی توسط نتفلیکس در استودیو VFX Eyeline، توسط معاون محسن موسوی در کنفرانس View فاش شد", "summary_fa": "استودیو Eyeline متعلق به     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
