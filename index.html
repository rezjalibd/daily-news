      --card-border: #232f48;

      --primary: #38bdf8;
      --primary-hover: #0284c7;

      --tab-border: #232f48;
      --tab-text: #94a3b8;

      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;

      margin: 0;
      padding: 0;

    }
    body {

      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;

    }
    .container {

      margin: 0 auto;

      border-radius: 18px;
      padding: 22px 20px;

      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;

    .meta-bar {

      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

      tech: [{"source": "TechCrunch AI", "title": "Proton’s Lumo, a privacy-focused alternative to ChatGPT and Claude, arrives on desktop", "link": "https://techcrunch.com/2026/11/17/protons-lumo-a-privacy-focused-alternative-to-chatgpt-and-claude-arrives-on-desktop/", "summary": "Proton's new Lumo Desktop app for Windows, Mac, and Linux lets users automate tasks across files and connected apps, with granular controls over what its AI can access.", "date_str": "2026-11-17T17:32:25+00:00", "hash": "b22a4fa4c1f68c4f", "title_fa": "Proton’s Lumo، جایگزین متمرکز بر حریم خصوصی برای ChatGPT و Claude، روی دسکتاپ وارد می شود", "summary_fa": "برنامه جدید Lumo Desktop پروتون برای ویندوز، مک و لینوکس به کاربران امکان می‌دهد وظایف را در بین فایل‌ها و برنامه‌های متصل به‌طور خودکار انجام دهند، با کنترل‌های دقیق روی آنچه که هوش مصنوعی آن می‌تواند به آن دسترسی داشته باشد. پروتون، شرکت فناوری متمرکز بر حریم خصوصی که جایگزین‌هایی برای ابزارهای گوگل و مایکروسافت برای ایمیل، برنامه‌های بهره‌وری، مدیریت رمز عبور، ذخیره‌سازی ابری و موارد دیگر ارائه می‌کند، اکنون اپلیکیشن هوش مصنوعی Lumo خود را به رایانه‌های شخصی می‌آورد. در روز سه‌شنبه، این شرکت Lumo Desktop را برای ویندوز، macOS و لینوکس راه‌اندازی کرد و به کاربران این امکان را داد تا از هوش مصنوعی آن برای انجام وظایف محلی شامل برنامه‌های متصل، فایل‌های شخصی و سایر اتوماسیون‌ها بر روی رایانه خود استفاده کنند. این برنامه به گونه‌ای طراحی شده است که کنترل بیشتری بر روی داده‌های شخصی خود به کاربران ارائه دهد، زیرا فناوری هوش مصنوعی مصرف‌کننده بیشتر بر عوامل هوش مصنوعی متمرکز می‌شود که می‌توانند وظایف را از طرف کاربران انجام دهند، نه اینکه فقط به سؤالات پاسخ دهند. در حال حاضر، سازندگان عمده مدل، از جمله OpenAI، Anthropic، Meta، و دیگران، ابزارهای دسکتاپ را برای کار با فناوری‌های هوش مصنوعی خود ارائه می‌دهند، اما انجام این کار باعث افزایش خطر داده‌های شخصی کاربران می‌شود. به عنوان مثال، تنها در این هفته، اپل اعلام کرد که با تنظیمات امنیتی سخت‌تر برای برنامه‌هایی که دسترسی کامل به دیسک را درخواست می‌کنند، نگرانی‌های مربوط به حریم خصوصی را برطرف می‌کند، همانطور که برنامه‌های دسکتاپ هوش مصنوعی انجام می‌دهند. ایده پروتون ارائه مجموعه‌ای از ابزارها است که به هوش مصنوعی اجازه می‌دهد به برنامه‌ها، فایل‌ها و پوشه‌های متصل دسترسی داشته باشد و وظایف را خودکار کند، اما با شخصی‌سازی بیشتر در مورد میزان دسترسی هوش مصنوعی. این شرکت می‌گوید کاربران می‌توانند اقداماتی را که عامل هوش مصنوعی برای درخواست تأیید", "image_url": "https://techcrunch.com/wp-content/uploads/2025/07/Lumo-by-proton.jpeg?resize=1200,600", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Google"], "datetime_fa": "۲۶ آبان • ۲۱:۰۲"}, {"source": "TechCrunch AI", "title": "AI models can be tricked into identifying civilians as military targets by telling them it’s a game", "link": "https://techcrunch.com/2026/11/17/ai-models-can-be-tricked-into-identifying-civilians-as-military-targets-by-telling-them-its-a-game/", "summary": "Vals, a San Francisco-based AI evaluation startup, tested whether leading AI models could be manipulated into participating in autonomous warfare. They usually compiled.", "date_str": "2026-11-17T17:20:41+00:00", "hash": "314a36bfebd7f145", "title_fa": "مدل‌های هوش مصنوعی را می‌توان فریب داد تا غیرنظامیان را به عنوان اهداف نظامی با گفتن این که این یک بازی است، شناسایی کنند", "summary_fa": "Vals، یک استارت آپ ارزیابی هوش مصنوعی مستقر در سانفرانسیسکو، آزمایش کرد که آیا می توان مدل های پیشرو هوش مصنوعی را برای شرکت در جنگ های خودمختار دستکاری کرد یا خیر. معمولاً جمع آوری می کردند. بر اساس گزارش تحقیقاتی جدید Vals، برخی از مدل‌های هوش مصنوعی از Anthropic، OpenAI، و دیگر آزمایشگاه‌های پیشرو هوش مصنوعی می‌توانند به راحتی فریب داده شوند تا اهداف حملات نظامی را شناسایی کنند - حتی اگر شامل غیرنظامیان یا مکان‌هایی مانند مدارس باشند - فقط با گفتن اینکه در حال انجام یک بازی هستند. مدل‌های OpenAI، Anthropic، Google، DeepSeek و سایر شرکت‌ها اغلب اهداف بالقوه را در تصاویر هواپیماهای بدون سرنشین و ماهواره‌ای، از جمله غیرنظامیان و سربازان تسلیم‌شده شناسایی می‌کنند. زمانی که مدل ها از همکاری امتناع کردند، محققان توانس و شبکه", "tags": ["Apple", "امنیت سایبری"], "datetime_fa": "۲۶ آبان • ۲۱:۱۱"}, {"source": "Ars Technica", "title": "Google makes it easier to use Gemini without training AI on your data", "link": "https://arstechnica.com/ai/2026/11/google-will-let-you-opt-out-of-ai-training-in-gemini-without-losing-your-history/", "summary": "It can be hard to use Google products—or even the Internet itself—without coming into contact with Gemini AI. That is, of course, by design . The more you use Gemini, the more data Google collects to train and improve its generative AI chatbot. The options to limit training on your data have been scant, but Google is finally adding more controls to the Gemini app. The change currently rolling out to Gemini will separate your chat history from training, which allows you to retain basic AI functionality without handing Google quite so much control over your data. Prior to this change, the only way to opt out of contributing your chat contents (including attachments) for training was to turn off your history. That made it impossible to go back and pick up a chat down the road. As the new settings roll out, users will see separate toggles for model training and chat history. The history setting will continue to support an adjustable limit, but you will no longer have to change it to stop Google from training on your Gemini usage. Meanwhile, AI training will be an opt-out situation. You'll need to find the toggle to block Google from using your chats for AI training. It's under Activity in the Gemini settings. You can also access the menu from your Google account under Data and Privacy My Activity Other activity Gemini Apps Activity. Read full article Comments", "date_str": "2026-11-17T16:50:10+00:00", "hash": "dd7cb1a1426c5404", "title_fa": "Google استفاده از Gemini را بدون آموزش هوش مصنوعی روی داده‌های شما آسان‌تر می‌کند", "summary_fa": "استفاده از محصولات Google - یا حتی خود اینترنت - بدون تماس با جمینی AI ممکن است سخت باشد. که البته با طراحی است. هرچه بیشتر از Gemini استفاده کنید، گوگل داده های بیشتری را برای آموزش و بهبود ربات چت هوش مصنوعی خود جمع آوری می کند. گزینه‌های محدود کردن آموزش روی داده‌های شما کمیاب بوده است، اما گوگل بالاخره کنترل‌های بیشتری را به برنامه Gemini اضافه می‌کند. تغییری که در حال حاضر در Gemini در حال اجراست، تاریخچه چت شما را از آموزش جدا می‌کند، که به شما امکان می‌دهد عملکرد اولیه هوش مصنوعی را بدون اینکه کنترل زیادی روی داده‌های خود به گوگل واگذار کنید، حفظ کنید. قبل از این تغییر، تنها راه انصراف از مشارکت در محتوای چت (از جمله پیوست‌ها) برای آموزش، خاموش کردن سابقه بود. این باعث شد که نتوان به عقب برگشت و گپ زد. با انتشار تنظیمات جدید، کاربران کلیدهای جداگانه برای آموزش مدل و تاریخچه چت را مشاهده خواهند کرد. تنظیم تاریخچه همچنان از یک محدودیت قابل تنظیم پشتیبانی می کند، اما دیگر لازم نیست آن را تغییر دهید تا Google از آموزش استفاده از Gemini خود جلوگیری کند. در همین حال، آموزش هوش مصنوعی یک وضعیت انصراف خواهد بود. برای جلوگیری از استفاده گوگل از چت شما برای آموزش هوش مصنوعی، باید کلیدی را پیدا کنید. در قسمت Activity در تنظیمات Gemini قرار دارد. همچنین می‌توانید از حساب Google خود به منوی زیر داده‌ها و حریم خصوصی فعالیت من دسترسی داشته باشید. فعالیت‌های دیگر Gemini Apps Activity. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش استفاده از محصولات Google - یا حتی خود اینترنت - بدون تماس با هوش مصنوعی Gemini ممکن است سخت باشد. که البته با", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/04/gemini-general-5-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۲۶ آبان • ۲۰:۲۰"}, {"source": "Engadget", "title": "The easiest way to set up CarPlay for the first time", "link": "https://www.engadget.com/2315270/easy-carplay-setup-first-time-users/", "summary": "CarPlay isn t hard to start using, but you should know a few points going in for the best experience.", "date_str": "2026-11-17T17:45:00+00:00", "hash": "4f86ea2cb69b43c9", "title_fa": "ساده ترین راه برای راه اندازی CarPlay برای اولین بار", "summary_fa": "شروع استفاده از CarPlay سخت نیست، اما برای بهترین تجربه باید چند نکته را بدانید. در اینجا نحوه راه‌اندازی CarPlay با کابل یا بی‌سیم و در صورت عدم اتصال آن چه باید کرد. DenPhotos/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover در حال حاضر بیش از 800 مدل خودرو سازگار با Apple CarPlay وجود دارد. این احتمال وجود دارد که اگر امروز یک خودروی جدید بخرید، این ویژگی در آن تعبیه شده است، اگرچه برخی از خودروسازان CarPlay را به تدریج از خودروهای خود حذف کرده اند. در اولین باری که از سیستم خودروی اپل استفاده می کنید، باید آیفون خود را با آن جفت کنید. خبر خوب این است که راه اندازی آسان است و فقط یک دقیقه طول می کشد. اما قبل از شروع، چند نکته وجود دارد که باید بررسی کنید، مانند اینکه آیا وسیله نقلیه شما با CarPlay سازگار است و آیا با کابل یا بی سیم (یا هر دو) کار می کند. Filipe Espósito برای Engadget دو روش مختلف برای استفاده از CarPlay وجود دارد: سیمی و بی سیم. به طور کلی، آنها تقریباً به یک روش کار می کنند و شما به همان ویژگی ها دسترسی خواهید داشت. CarPlay سیمی معمولاً ساده‌ترین راه است - کافی است ماشین را روشن کنید و آیفون خود را به درگاه USB وصل کنید که گاهی اوقات با نماد CarPlay یا تلفن مشخص می‌شود. آیفون شما برای استفاده از CarPlay اجازه می‌خواهد، بنابراین روی Connect ضربه بزنید و رابط باید در صفحه داشبورد ماشین شما ظاهر شود. اگر ماشین شما از CarPlay سیمی و بی‌سیم پشتیبانی می‌کند، دفعه بعد که ماشین خود را روشن می‌کنید، آیفون شما از شما درخواست می‌کند که به صورت بی‌سیم متصل شود. برای فعال کردن CarPlay بی سیم نیازی به وارد کردن تنظیمات ندارید. برخی از خودروها فقط از CarPlay بی‌سیم پشتیبانی", "image_url": "https://www.engadget.com/img/gallery/the-easiest-way-to-set-up-carplay-for-the-first-time/l-intro-1794511199.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple"], "datetime_fa": "۲۶ آبان • ۲۱:۱۵"}, {"source": "Engadget", "title": "UK tribunal tosses PlayStation Store price-gouging lawsuit, citing physical games as competiti cal cancer center to have my lump observed, the surgical oncologist insisted we remove it. During the weeks that led up to my surgery, I made the fatal mistake — no pun intended — of Googling \"lumps on my neck.\" The information took me down a rabbit hole, from ordinary viruses to malignant cancer. Of course, I ignored the benign and focused on the worst. Lymphoma and Leukemia kept popping up in my nightmarish searches at 2 a.m. Naturally, I assumed I was dying. My parents and siblings have all had cancer. I fear I'm trying to outrun my fate. Each time I go for a checkup, scan, mammogram, colonoscopy, or blood work, I brace myself for devastating news. My worry was sucking the life out of me, overriding the voice in my head telling me that instead of taking each moment for granted, I should be enjoying my existence. My worry has lingered for a long time I was 16 when my beloved father first complained of stomach pain. My mother assumed it was from blue cheese dressing that turned. But when the pain became severe, his doctor suggested exploratory surgery. He found pancreatic cancer. I don't think I ever fully recovered from my father's devastating six-week-long decline from diagnosis to death. It's no surprise that I struggle with a PTSD-like fear whenever medical issues arise. When I was faced with having surgery to remove my lymph node, my children were small, and the thought of them growing up without me tore me to pieces. I told them I was having a \"pimple-ectomy,\" which sounded silly so they wouldn't be scared. I held it together in front of them, but fear and anticipatory grief consumed me as I cried myself to sleep. Thankfully, it was benign. The worry sometimes felt like ", "date_str": "2026-11-17T16:42:01+00:00", "hash": "3f6ec1c690324c80", "title_fa": "سابقه خانوادگی سرطان من را بسیار نگران کرده بود. بالاخره یاد گرفتم که دیگر به دکتر گوگل مراجعه نکنم.", "summary_fa": "نویسنده گفت که به او اجازه می‌داد اضطراب سلامتی‌اش قبل از قرار ملاقات با پزشک، او را در یک حفره اینترنتی خرگوش پایین بیاورد. با حسن نیت از لیندا ولف. من سابقه خانوادگی سرطان دارم و هر توده و علامتی مرا وادار به مراجعه به دکتر گوگل کرد. جستجوی اجباری علائم من فقط به من استرس وارد کرد و باعث شد که حتی بدتر شوم. اکنون با متمرکز کردن زمان و تلاشم بر روی چیزهایی که از آنها لذت می برم، از خود تشخیصی اجتناب می کنم. اولین ترس واقعی من در 36 سالگی آمد. تورم غدد لنفاوی در سمت چپ گردنم در حین معاینه معمول نگرانی پزشکم را برانگیخت. \"چند وقت است که این را دارید؟\" او پرسید. نفسم را حبس کردم در حالی که انگشتانش از توده ای که بالای استخوان ترقوه ام معلق بود عبور کردند. او نام یک انکولوژیست جراحی را یادداشت کرد. اتاق شروع به چرخیدن کرد. پس از چندین ماه پر اضطراب از مراجعه به مرکز سرطان محلی برای مشاهده توده‌ام، انکولوژیست جراحی اصرار کرد که آن را برداریم. در طول هفته‌هایی که منتهی به عمل جراحی من شد، اشتباه مهلکی را مرتکب شدم – بدون هدف جناسی – که «توده‌های روی گردنم» را در گوگل جستجو کردم. این اطلاعات من را در سوراخ خرگوش فرو برد، از ویروس های معمولی گرفته تا سرطان بدخیم. البته من خوش خیم را نادیده گرفتم و روی بدترین ها تمرکز کردم. لنفوم و لوسمی در جست و جوهای کابوس وار من در ساعت 2 بامداد مدام ظاهر می شد، طبیعتاً تصور می کردم دارم می میرم. پدر و مادر و خواهر و برادر من همگی سرطان داشته اند. می ترسم سعی کنم از سرنوشتم پیشی بگیرم. هر بار که برای چکاپ، اسکن، ماموگرافی، کولونوسکوپی یا آزمایش خون می روم، خودم را برای اخبار ویرانگر آماده می کنم.", "image_url": "https://i.insider.com/6afc5f6e5aab055bb644284f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲۶ آبان • ۲۰:۱۲"}, {"source": "Business Insider", "title": "I visited London’s viral GTA 6 merch pop-up, where shoppers waited for hours and scrambled to buy whatever was left", "link": "https://www.businessinsider.com/gta-6-pop-up-london-long-line-merch-sold-out-2026-11", "summary": "I went to Selfridges GTA 6 pop-up to see what was worth queuing for. Georgia Hennessy GTA 6 is arguably the most-hyped game in history, and that hype is on display at a London pop-up. I joined a long line for the pop-up at luxury department store Selfridges on a gray, rainy morning. Once inside, customers scrambled to buy whatever was left on the mostly empty shelves. London's main shopping thoroughfare, Oxford Street, was quiet on a grey, drizzly morning. Outside the luxury department store, Selfridges, a queue had formed for its much-hyped GTA 6 pop-up. The shoppers, mostly men, stood bundled in raincoats, hoods and scarves, waiting to see what merchandise was left after the collection sold out online. A delivery truck nearby filled the air with the smell of fish. Well-dressed Selfridges customers glanced at the line as they passed with the particular dry curiosity Londoners reserve for an inexplicable crowd. The answer was Rockstar Games’ next Grand Theft Auto release — which drops on Thursday — and the chance to buy a piece of the anticipation surrounding it. Shoppers waited outside Selfridges to see what GTA 6 merchandise was left. Georgia Hennessy Outside, I spoke with shoppers who had joined the queue for very different reasons. \"What I want to know is, who's this for?\" said JD, a retail worker who spoke to me quietly; he didn't want anyone to know that he had come to conduct what he called \"competitor analysis.\" \"If you're willing to spend £2,000 (about $2,650) on a jacket, surely you're not going to be queuing up with the rest of us,\" he said. JD said he was primarily there to study the visual merchandising, the promotional car, and the type of customer the pop-up was attracting. The car, a Ferrari Testarossa with a custom blue-and-pink paint job, is the pop-up's centerpiece and is on sale for $1.3 million. The car is also the model for one of GTA 6's in-game supercars, the Grotti Cheetah. A Ferrari Testarossa, or in GTA 6 parlance, a Grotti Cheetah on display. It is for sale for $1.3 million. Robert Scammell/Business Insider \"It's a cultural moment,\" JD said of the game's release. But he was skeptical of the prices. \"From what I've seen, the prices are unreal for some of this merch,\" he said. The rain began again as we waited. I pulled my scarf over my head as a makeshift hood. Someone barged past and stepped on my foot. Behind us, a 10-year-old named Jonny began to play with the barriers, humming songs I recognized from TikTok. He was visiting L", "date_str": "2026-11-17T16:31:08+00:00", "hash": "2f8e1e7d138f1dfe", "title_fa": "من از پاپ‌آپ تجاری GTA 6 لندن بازدید کردم، جایی که خریداران ساعت‌ها منتظر ماندند و برای خرید هرچه باقی مانده بود تلاش کردند.", "summary_fa": "من به پاپ آپ Selfridges GTA 6 رفتم تا ببینم چه چیزی ارزش صف کشیدن را دارد. جورجیا هنسی GTA 6 بدون شک پر هیپ ترین بازی تاریخ است و این هیپ در یک پاپ آپ لندن به نمایش گذاشته شده است. در صبحی خاکستری و بارانی به صف طولانی برای پاپ آپ در فروشگاه لوکس Selfridges پیوستم. به محض ورود، مشتریان به تکاپو افتادند تا هر آنچه را که در قفسه های عمدتا خالی مانده بود، بخرند. شاهراه اصلی خرید لندن، خیابان آکسفورد، در صبحی خاکستری و بارانی آرام بود. بیرون از فروشگاه لوکس، سلفریج، صفی برای پاپ آپ GTA 6 تشکیل شده بود. خریداران، اکثراً مردان، با کت های بارانی، مقنعه و روسری ایستاده بودند و منتظر بودند ببینند پس از فروش آنلاین مجموعه، چه کالایی باقی مانده است. یک کامیون تحویل در آن نزدیکی هوا را پر از بوی ماهی کرد. مشتریان خوش لباس سلفریج در حالی که با کنجکاوی خشک خاص لندنی ها برای جمعیت غیرقابل توضیحی در نظر گرفته بودند، به خط نگاه کردند. پاسخ، نسخه بعدی Grand Theft Auto راکستار گیمز - که در روز پنجشنبه عرضه می شود - و شانس خرید بخشی از انتظارات پیرامون آن بود. خریداران بیرون سلفریج منتظر ماندند تا ببینند چه کالایی از GTA 6 باقی مانده است. جورجیا هنسی بیرون، با خریدارانی صحبت کردم که به دلایل بسیار متفاوت به صف پیوسته بودند. \"چیزی که من می خواهم بدانم این است که این برای چه کسی است؟\" جی دی، کارگر خرده فروشی که به آرامی با من صحبت می کرد، گفت. او نمی‌خواست کسی بداند که برای انجام آنچه «تحلیل رقیب» می‌خواند آمده است. او گفت: \"اگر مایلید 2000 پوند (حدود 2650 دلار) برای یک ژاکت خرج کنید، مطمئناً با بقیه ما در صف قرار نخواهید داشت.\" JD گفت که او در درجه اول آنجا بود تا", "image_url": "https://i.insider.com/6afc54125aab055bb6442811?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۶ آبان • ۲۰:۰۱"}, {"source": "Business Insider", "title": "Charles Schwab website briefly goes down as brokerage becomes latest financial service to encounter issues", "link": "https://www.businessinsider.com/charles-scwab-website-outage-reports-2026-11", "summary": "Charles Schwab s website briefly went down for some users on Monday. Smith Collection/Gado/Getty Images Charles Schwab's website experienced issues on Monday. The website of the brokerage giant was temporarily down. Outage reports shot up on the third-party website DownDetector.com. The brokerage giant Charles Schwab is the latest financial service to run into issues this week. Charles Schwab's website briefly went down for some users on Monday. The site temporarily displayed a message saying its server \"encountered an internal error or misconfiguration and was unable to complete your request.\" The website was working properly again around 10:38 a.m. ET. A spokesperson for Charles Schwab told Business Insider that a \"brief webpage loading issue has been resolved.\" \"Trading remained available, and clients could access their accounts at schwab.com/login or through the Schwab Mobile app. We apologize for the inconvenience,\" the spokesperson added. Earlier Monday, outage reports for the financial services company spiked on the third-party website DownDetector.com. By 10:20 a.m. ET, there were more than 1,400 reports of disruptions. The website issue follows a recent spate of widespread outages that hit major banks , disrupted Microsoft services, and led to a nationwide ground stop , causing thousands of flight delays and cancellations. Read the original article on Business Insider", "date_str": "2026-11-17T16:12:41+00:00", "hash": "f718ef6f15924059", "title_fa": "وب سایت چارلز شواب برای مدت کوتاهی از کار می افتد زیرا کارگزاری آخرین خدمات مالی است که با مشکلاتی روبرو می شود", "summary_fa": "وب سایت چارلز شواب در روز دوشنبه برای برخی از کاربران برای مدت کوتاهی از کار افتاد. مجموعه اسمیت/گادو/گتی ایماژ وب سایت چارلز شواب مشکلاتی را روز دوشنبه تجربه کرد. وب سایت غول کارگزاری به طور موقت از کار افتاد. گزارش‌های قطعی در وب‌سایت شخص ثالث DownDetector.com منتشر شد. غول کارگزاری چارلز شواب آخرین سرویس مالی است که در این هفته با مشکل مواجه شده است. وب سایت چارلز شواب روز دوشنبه برای برخی از کاربران برای مدت کوتاهی از کار افتاد. این سایت به طور موقت پیامی را نشان می دهد که می گوید سرورش با یک خطای داخلی یا پیکربندی نادرست مواجه شده و قادر به تکمیل درخواست شما نیست. وب سایت دوباره در حدود ساعت 10:38 صبح به وقت شرقی به درستی کار می کرد. سخنگوی چارلز شواب به Business Insider گفت که \"مشکل کوتاه بارگذاری صفحه وب حل شده است.\" تجارت همچنان در دسترس بود و مشتریان می توانستند به حساب های خود در schwab.com/login یا از طریق برنامه Schwab Mobile دسترسی داشته باشند. ما بابت ناراحتی پیش آمده پوزش می‌خواهیم.» اوایل دوشنبه، گزارش‌های قطعی برای شرکت خدمات مالی در وب‌سایت شخص ثالث DownDetector.com منتشر شد. تا ساعت 10:20 صبح به وقت شرقی، بیش از 1400 گزارش از اختلالات وجود داشت. مشکل وب‌سایت به دنبال یک موج اخیر از اختلالات گسترده، مایکروسافت و اختلالات گسترده در خدمات بانکی بود. توقف زمینی در سراسر کشور، باعث ایجاد هزاران تاخیر و لغو پرواز شد. مقاله اصلی را در Business Insider بخوانید", "image_url": "https://i.insider.com/6afc732bf0664acecacb9aba?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Microsoft"], "datetime_fa": "۲۶ آبان • ۱۹:۴۲"}, {"source": "Business Insider", "title": "I left my hometown for a dream opportunity in Los Angeles. Within a year, I was back in the Midwest.", "link": "https://www.businessinsider.com/left-nebraska-hometown-moved-back-to-be-with-parents-2026-11", "summary": "The decision to leave my hometown at 22 was a no-brainer. Jennifer Yuma I left my Nebraska hometown for an opportunity in Los Angeles, but had a tough time there. When I learned my dad was struggling with his health, it felt important for us to be together. I moved back, and five years later, I'm still here — and I realized there's no rush to leave home . Leaving my home state of Nebraska wasn't hard for me. As much as I appreciated the town that raised me, by my early 20s, I'd outgrown it. My medium-sized town wasn't necessarily a place I felt particularly attached to. My parents both fled to the United States as political refugees during the Congo War in 1997. The main reason my father chose Nebraska as a home was that he knew one Congolese person in the state, and nobody else in the entire country. As I got older, the gratitude I felt for my parents' journey sparked my desire to live up to their American dream. When I received a prestigious internship opportunity at age 22, saying yes was a no-brainer — even though I'd have to move to Los Angeles with just two months' notice. My future in Los Angeles was right in front of me; all I had to do was push that door open. I figured that if it didn't work out, I'd move on to the next major city . I never expected to come back to Nebraska. Moving to LA was a dream come true, but the reality was tough I loved living and working in LA, but I felt like I was drowning. Jennifer Yuma By the time I moved to LA, I was ready for a fresh start. I'd spent my last two years of college attending classes from an apartment due to COVID-19 social-distancing guidelines , which only made me feel more claustrophobic. I was also excited to relocate to a more diverse city, one where more people would look like me and think like me, and where I'd likely have more opportunities as an aspiring writer. I connected with another intern who agreed to be my roommate and found our apartment in LA. In the spring of my senior year, I packed up my bags — with only enough savings to buy my plane ticket — and moved to Los Angeles. My family helped me pay for my security deposit, and I was able to cover the first month's rent with early graduation funds. As I expected, I loved LA, but a month in, I was embarrassingly broke and struggling to get around without a car. After unsuccessfully navigating an unpredictable bus system and spending all of my money on Ubers for red-carpet events in place of groceries, I realized I was drowning … but this wa", "date_str": "2026-11-17T15:49:01+00:00", "hash": "6ddea6edcbdaec72", "title_fa": "زادگاهم را برای یک فرصت رویایی در لس آنجلس ترک کردم. در عرض یک سال، من به غرب میانه بازگشتم.", "summary_fa": "تصمیم به ترک زادگاهم در 22 سالگی بی‌معنا بود. جنیفر یوما من زادگاهم نبراسکا را برای یک فرصت در لس آنجلس ترک کردم، اما روزهای سختی را در آنجا گذراندم. وقتی فهمیدم پدرم با سلامتی‌اش دست و پنجه نرم می‌کند، احساس کردم با هم بودن برایمان مهم است. برگشتم، و پنج سال بعد، هنوز اینجا هستم - و فهمیدم عجله ای برای ترک خانه وجود ندارد. ترک ایالت نبراسکا برای من سخت نبود. همان‌قدر که از شهری که مرا بزرگ کرده بود قدردانی می‌کردم، در اوایل 20 سالگی، از آن پیشی گرفته بودم. شهر متوسط ​​من لزوماً جایی نبود که احساس می‌کردم به آن وابستگی خاصی داشته باشم. پدر و مادر من هر دو در طول جنگ کنگو در سال 1997 به عنوان پناهنده سیاسی به ایالات متحده گریختند. دلیل اصلی انتخاب پدرم نبراسکا به عنوان خانه این بود که او یک فرد کنگو را در این ایالت می شناخت و هیچ کس دیگری را در کل کشور نمی شناخت. همانطور که بزرگتر شدم، قدردانی که از سفر پدر و مادرم احساس می کردم، انگیزه من برای زندگی به رویای آمریکایی آنها را برانگیخت. زمانی که در سن 22 سالگی یک فرصت کارآموزی معتبر دریافت کردم، گفتن بله، بی‌معنا بود - حتی اگر فقط با دو ماه اخطار به لس‌آنجلس نقل مکان کنم. آینده من در لس آنجلس درست در مقابل من بود. تنها کاری که باید انجام می دادم این بود که آن در را باز کنم. به این فکر کردم که اگر درست نشد، به شهر بزرگ بعدی می‌روم. هرگز انتظار نداشتم به نبراسکا برگردم. نقل مکان به لس آنجلس رویایی بود که به حقیقت پیوست، اما واقعیت سخت بود، من عاشق زندگی و کار در لس آنجلس بودم، اما احساس می کردم در حال غرق شدن هستم. جنیفر یوما زمانی که به لس آنجلس نقل مکان کردم،", "image_url": "https://i.insider.com/6afb43555aab055bb644234e?width=1200&fo thcare. \"It's possible that we — unless we become super intelligent — we have 80% unemployment, and therefore some redistribution from have to have-not is going to occur,\" he added. UBI is a hotly contested topic in economics, and the evidence that AI is taking away jobs is mixed. While some have flagged the risk of widespread job displacement, others have argued that AI could create jobs due to the Jevons Paradox, a phenomenon where a technology makes a good or service cheaper and more efficient, ultimately raising demand from consumers. The US unemployment rate was 4.1% in October, near a historic low. The professional and business services sector, which encompasses white-collar industries like legal services, consulting, and scientific research services, also added 70,000 new jobs last month, well above the average monthly gain of 15,000 payrolls for the sector, according to the", "date_str": "2026-11-17T15:45:12+00:00", "hash": "d783e5aa80374ca8", "title_fa": "وال استریت «دکتر. Doom می‌بیند که هوش مصنوعی در دهه‌های آینده باعث افزایش 80 درصدی بیکاری و درآمد پایه جهانی می‌شود", "summary_fa": "نوریل روبینی گفت که این خطر را می بیند که هوش مصنوعی نیاز به درآمد پایه جهانی را تا سال 2050 ایجاد می کند. پیر مارکو تاکا/ گتی ایماژ نوریل روبینی \"مقدار عظیمی از نابرابری\" را در کنار رونق بهره وری ناشی از هوش مصنوعی می بیند. در دهه های آینده، اقتصاددان ارشد نرخ بیکاری را به طور بالقوه به 80 درصد افزایش می دهد. او پیش بینی کرد که بیکاری گسترده می تواند نیاز به درآمد پایه جهانی را تا سال 2050 ایجاد کند. «دکتر دووم» با یک پیش‌بینی وحشتناک برای اقتصاد آمریکا بازگشته است. نوریل روبینی، اقتصاددانی که به خاطر نامیدن بحران مالی سال 2008 و ارائه مکرر دیدگاه های بد خود در مورد بازارها شهرت دارد، به نسخه ای از آینده چشم دوخته است که شامل از دست دادن گسترده مشاغل ناشی از هوش مصنوعی است. مدیر عامل Roubini Macro Associates گفت: با فرض اینکه ایالات متحده شاهد رونق بهره وری مبتنی بر هوش مصنوعی باشد، نرخ بیکاری می تواند تا سال 2050 به 80 درصد افزایش یابد و نیاز به درآمد پایه جهانی را ایجا ce at the Grand Canyon, go north. The South Rim is often packed, while the North Rim gets far fewer visitors. I visited the North Rim and felt like I'd discovered a hidden gem in the tourist hot spot. I've never felt smaller than I did sitting on the edge of the Grand Canyon , a natural world wonder visible from space . I've been to the national park three times. Each visit was as awe-inspiring as the last. I'll never get tired of the views and will travel back again and again. With expansive views of eroded rocks that formed over millions of years, it's easy to see why the Grand Canyon is one of the most visited national parks in the US and has been overcrowded in recent years. The park historically averages 4.5 million visitors a year, according to the National Park Service . In the summer, I've seen people pack themselves onto the edges of the canyon, obstructing views of one of the most beautiful places in the country — but only on the South Rim. While more than 90% of visitors go to the South Rim, only 280,000 trek to the northern side of the canyon each year on average, according to the NPS. In my experience, the North Rim is the park's best-kept secret. I visited the South Rim once in 2022 and the North Rim twice — most recently in 2019. While the South Rim was packed with cars and crowds when I went, I've only had peaceful, remote experiences on the North Rim that take me out of the stress of my busy lifestyle. It's a hidden gem in the otherwise crowded national park. The North Rim of Grand Canyon National Park is one of my favorite places in the US. Joey Hadden/Business Insider From Yosemite in California , to Zion in Utah , to Acadia in Maine, I've visited many US national parks. Each has surprised me with unique geographic features and diverse plant life. But the North Rim of the Grand Canyon amazed me the most. With a higher elevation than the South Rim, it has cooler temperatures, snowy winters, and more plants and trees. Unlike the more popular South Rim entrances, which are open year-round, the North Rim entrance is only accessible from May to October for overnight stays and through November for day trips (depending on the weather). The North Rim of the Arizona national park isn t as easy to access as the South Rim. Google Maps The northern side of the national park ", "date_str": "2026-11-17T15:38:02+00:00", "hash": "6af9701aadc8809b", "title_fa": "من در 25 پارک ملی و جنگل در سراسر ایالات متحده بوده ام. حاشیه شمالی گرند کانیون دست کم گرفته شده ترین است.", "summary_fa": "خبرنگار Business Insider از هر دو حاشیه گرند کانیون بازدید کرده است - شمال منحصر به فردتر و کمتر شلوغ بود. Joey Hadden/Business Insider اگر می خواهید تجربه ای بدون جمعیت در گرند کانیون داشته باشید، به شمال بروید. حاشیه جنوبی اغلب مملو از جمعیت است، در حالی که حاشیه شمالی بازدیدکنندگان بسیار کمتری دارد. من از حاشیه شمالی بازدید کردم و احساس کردم که یک جواهر پنهان را در نقطه داغ گردشگری کشف کرده ام. من هرگز کوچکتر از نشستن در لبه گرند کانیون، یک شگفتی دنیای طبیعی که از فضا قابل مشاهده است، احساس نکرده ام. من سه بار به پارک ملی رفتم. هر بازدیدی مثل دفعه قبل تحسین برانگیز بود. من هرگز از منظره ها خسته نمی شوم و بارها و بارها به عقب سفر خواهم کرد. با مناظر گسترده از سنگ های فرسایش یافته که در طی میلیون ها سال شکل گرفته اند، به راحتی می توان فهمید که چرا گرند کانیون یکی از پربازدیدترین پارک های ملی ایالات متحده است و در سال های اخیر بیش از حد شلوغ بوده است. طبق گزارش سرویس پارک ملی، این پارک از نظر تاریخی به طور متوسط ​​4.5 میلیون بازدید کننده در سال دارد. در تابستان، من مردمی را دیده ام که خود را در لبه های دره جمع می کنند و مانع نماهای یکی از زیباترین مکان های کشور می شوند - اما فقط در حاشیه جنوبی. طبق NPS، در حالی که بیش از 90 درصد بازدیدکنندگان به حاشیه جنوبی می روند، تنها 280000 نفر هر سال به طور متوسط ​​به سمت شمال دره می روند. در تجربه من، حاشیه شمالی بهترین راز پارک است. من یک بار در سال 2022 از حاشیه جنوبی و دو بار از حاشیه شمالی بازدید کردم - آخرین بار در سال 2019. در حالی که وقتی من رفتم، حاشیه جنوبی مملو", "image_url": "https://i.insider.com/6afb4c46f0664acecacb953d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲۶ آبان • ۱۹:۰۸"}, {"source": "Business Insider", "title": "The 25 best places in the world to travel to in 2027, according to National Geographic", "link": "https://www.businessinsider.com/best-places-to-visit-national-geographic-2026-11", "summary": "Safari, Liwonde National Park, Malawi, Africa. Marka/Universal Images Group via Getty Images National Geographic released its annual list of the best places to travel to in 2027. It features 25 destinations across six continents, each offering different cultures and landscapes. From Ancient Mayan ruins to small maritime provinces, here are the top places to visit next year. From a total solar eclipse in Egypt to Grenada's 150th Spicemas carnival, 2027 is shaping up to be a bucket-list year for travel. In its annual \"Best of the World\" list for 2027, National Geographic picked 25 destinations across 22 countries and territories for travelers to consider for their next trip. This year's list includes major cities with big festivals and new museums, as well as smaller offbeat regions where travelers can get outdoors. Here are the 25 best travel destinations featured in National Geographic's 2027 list. Vestland, Norway The farming village of Dyrdal with its pretty white church on the shore of Naeroyfjord, a UNESCO world heritage fjord which is an arm of the Sognefjord. (Photo by: Martin Berry/UCG/Universal Images Group via Getty Images) : Martin Berry/UCG/Universal Images Group via Getty Images Vestland is known for its fjords, glaciers, waterfalls, and hikes, including Trolltunga, \"troll's tongue,\" a rock ledge that sits above a lake. Bergen offers a break from the wilderness with its historic wharf, seafood, and restaurants. Direct flights to Bergen have become more commonplace, and the seven-hour overnight train from Oslo has become comfier, after Vy, the national railway company, installed convertible lie-flat seats. Penang, Malaysia GEORGETOWN, PENANG, MALAYSIA - 2025/04/21: People walk down a street in Georgetown, Malaysia. George Town is a UNESCO World Heritage Site known for its rich cultural heritage and diverse architecture, attracting tourists with its unique blend of history and modernity. The tourism sector significantly contributes to the local economy, supporting traditional trades and boosting the overall economic growth of the region. (Photo by Stephen J. Boitano/LightRocket via Getty Images) Stephen J. Boitano/LightRocket via Getty Images Penang gives visitors a mix of George Town's heritage, street art, Chinese-Malay food, beaches, and rainforest. A new cable car is expected to open in 2027, which will take travelers from the botanic gardens to Penang Hill for views and hiking trails. Luxor, Egypt Hot air balloons are seeing during a ride ov", "date_str": "2026-11-17T15:25:50+00:00", "hash": "cb2133e70c0878fd", "title_fa": "بر اساس گزارش نشنال جئوگرافیک، 25 بهترین مکان جهان برای سفر در سال 2027", "summary_fa": "سافاری، پارک ملی لیواند، مالاوی، آفریقا. مارکا/گروه یونیورسال تصاویر از طریق گتی ایماژ، نشنال جئوگرافیک فهرست سالانه خود را از بهترین مکان‌ها برای سفر در سال 2027 منتشر کرد. این مکان دارای 25 مقصد در شش قاره است که هر کدام فرهنگ‌ها و مناظر متفاوتی را ارائه می‌دهند. از ویرانه‌های باستانی مایاها گرفته تا استان‌های کوچک دریایی، در اینجا بهترین مکان‌ها برای بازدید در سال آینده وجود دارد. از یک خورشید گرفتگی کامل در مصر تا صد و پنجاهمین کارناوال Spicemas در گرانادا، سال 2027 در حال تبدیل شدن به یک سال فهرست سطلی برای سفر است. نشنال جئوگرافیک در فهرست سالانه «بهترین‌های جهان» برای سال 2027، 25 مقصد را در 22 کشور و منطقه انتخاب کرد تا مسافران برای سفر بعدی خود در نظر بگیرند. فهرست امسال شامل شهرهای بزرگ با فستیوال‌های بزرگ و موزه‌های جدید، و همچنین مناطق کوچک‌تر غیر معمولی است که مسافران می‌توانند در آن‌ها به فضای باز بروند. در اینجا 25 بهترین مقصد سفر در فهرست 2027 National Geographic آورده شده است. وستلند، نروژ دهکده کشاورزی دیردال با کلیسا 't have in bedrooms. Exercise equipment and certain family photos should be kept in other rooms of the house. Low light fixtures and furniture that's too small can hurt a room's overall look. Although bedrooms aren't widely considered to be the heart of a home, most people spend a lot of time in them. So, the stakes for designing them are high — the furniture, decorations, and even wall colors you choose can make or break the vibe and look of the space. With that in mind, Business Insider asked interior designers what kinds of things people should avoid having in a bedroom . Here's what they said. Say no to cool-white bulbs. The bulbs you put in your light fixtures can make or break a space. CreativaStudio/Getty Images Bulbs are nearly as important as fixtures when choosing the best lighting for a bedroom . Ariyan Parvaresh, interior designer at AP Design , recommends skipping any cool-white bulbs. \"People should avoid them because they're incredibly unflattering and tend to make you more alert, hence why they're used in markets and commercial spaces more,\" she said. Warm-white bulbs will give your space a much softer glow that's better for relaxing around bedtime. Lighting that hangs too low can be troublesome. A large chandelier shouldn t be too close to your bed. KUPRYNENKO ANDRII/Shutterstock There are many lighting options for bedrooms, but interior designer Perla Lichi said it's essential to avoid fixtures that hang too low. Poorly placed lights can interfere with a bed, windows, or TV. If you have low ceilings, she suggested trying flush-mount lights. Furniture that s too small for the space can cause issues. Morsa Images/Getty Images Lichi told Business Insider that you should be intentional when choosing furniture for your bedroom . Pieces that don't properly fit the space can quickly make the room look cluttered or empty. \"It's best to start with your signature bed and measure accordingly. Leave enough room for end tables, corner vases, plants, and a chaise lounge/lamp for reading by the window,\" Lichi said. Pass on hanging photos of anyone besides you and your partner. You can also hang paintings instead of photos. NazariyKarkhut/Getty Images Although hanging photos of loved ones can make a space feel comforting, interior designer Rachel Larraine said it'", "date_str": "2026-11-17T14:51:44+00:00", "hash": "061faee2973ce4e6", "title_fa": "طراحان داخلی 6 چیز را به اشتراک می گذارند که هرگز نباید در اتاق خواب خود داشته باشید", "summary_fa": "برخی از تزیینات اتاق خواب و انتخاب های طراحی فقط می توانند به هم ریختگی بصری به فضا اضافه کنند. Andreas von Einsiedel/Getty Images طراحان داخلی طرح ها و سایر مواردی را که فکر می کنند مردم نباید در اتاق خواب داشته باشند به اشتراک گذاشتند. وسایل ورزشی و عکس های خانوادگی خاص باید در اتاق های دیگر خانه نگهداری شوند. وسایل کم نور و مبلمان خیلی کوچک می توانند به ظاهر کلی اتاق آسیب بزنند. اگرچه اتاق خواب به طور گسترده به عنوان قلب یک خانه در نظر گرفته نمی شود، اکثر مردم زمان زیادی را در آن می گذرانند. بنابراین، ریسک طراحی آنها زیاد است – مبلمان، دکوراسیون و حتی رنگ دیواری که انتخاب می‌کنید می‌تواند حال و هوا و ظاهر فضا را ایجاد یا خراب کند. با در نظر گرفتن این موضوع، Business Insider از طراحان داخلی پرسید که افراد باید از داشتن چه چیزهایی در اتاق خواب اجتناب کنند. در اینجا چیزی است که آنها گفتند. به لامپ های سفید سرد نه بگویید. لامپ هایی که در وسایل روشنایی خود قرار می دهید می توانند فضا را ایجاد کنند یا آن را خراب کنند. لامپ های CreativaStudio/Getty Images هنگام انتخاب بهترین نور برای اتاق خواب تقریباً به اندازه وسایل مهم هستند. آریان پرورش، طراح داخلی در AP Design، توصیه می‌کند از لامپ‌های سرد و سفید خودداری کنید. او گفت: \"مردم باید از آنها دوری کنند زیرا آنها فوق العاده ناخوشایند هستند و تمایل دارند شما را هوشیارتر کنند، بنابراین چرا در بازارها و فضاهای تجاری بیشتر مورد استفاده قرار می گیرند.\" لامپ‌های سفید گرم به فضای شما درخشش ملایم‌تری می‌دهند که برای استراحت در هنگام خواب بهتر است. روشنایی که خیلی کم است می تواند مشکل ساز باشد. یک لوستر بزرگ نباید خیلی به تخت شما نزدیک باشد. K lk 1 stick (8 tablespoons) of butter, room temperature 1 garlic clove, minced ½ cup of sour cream 2 tablespoons of fresh parsley for garnish 1 ½ teaspoons of salt First, I prepped the potatoes. Anneta Konstantinides/Business Insider I washed, peeled, and quartered the potatoes. Then I placed the potatoes in a colander and rinsed them under cold water. Anneta Konstantinides/Business Insider The recipe says to wash the potatoes \"until the water runs clear.\" I threw my potatoes into a large pot and filled it with cold water. Anneta Konstantinides/Business Insider The recipe says to cover the potatoes with two inches of water, then add one teaspoon of salt. I brought the pot to a boil and then lowered the heat to medium. I allowed my potatoes to cook for 20 minutes until they were fork-tender. I drained the potatoes and placed them in a large bowl so I could add all the seasoning. Anneta Konstantinides/Business Insider I threw in the butter, cream cheese, sour cream, ½ cup of milk, and ½ teasp", "date_str": "2026-11-17T14:50:02+00:00", "hash": "b84e9acec652a2de", "title_fa": "من پوره سیب زمینی تعطیلات دالی پارتون را امتحان کردم. آنها یک غذای جانبی خوشمزه و سریع برای شکرگزاری هستند.", "summary_fa": "کتاب آشپزی نهایی دالی پارتون دارای یک بخش کامل به دستور العمل های شکرگزاری است. Nathan Congleton/NBC/NBCU Photo Bank از طریق Getty Images در سال 2024، دالی پارتون یک کتاب آشپزی به همراه خواهرش منتشر کرد به نام \"Good Lookin' Cookin\". این کتاب شامل یک بخش کامل به دستور العمل های شکرگزاری، از جمله سیب زمینی های تعطیلات او است. پوره سیب زمینی شامل خامه ترش، پنیر خامه ای و مقدار زیادی کره است - بسیار لذیذ. دالی پارتون به خاطر صدا، مهارت های ترانه سرایی و قلب سخاوتمندش محبوبیت جهانی داشت. او همچنین یک آشپز خانه افسانه ای بود. ملکه موسیقی کانتری از طرفداران غذاهای جنوبی بود. در یکی از مصاحبه‌های گذشته مان، پارتون به من گفت که دوست دارد برای دخترخوانده‌اش مایلی سایرس «سیب‌زمینی پوره، سالاد کلم و یک تکه نان ذرت» درست کند. پارتون بعداً دستور پخت پوره سیب زمینی خود را در کتاب آشپزی امارو، مدیر عامل دیزنی، از کارکنان تشکر کرد و به کاهش آینده پس از گزارش قوی درآمد اشاره کرد. دامارو در یادداشتی می‌گوید دیزنی باید شیوه کار ما را دوباره تصور کند. ببینید D'Amaro چه چیز دیگری به کارمندان گفت. جاش دامارو، مدیر عامل دیزنی، در یادداشت داخلی سه‌شنبه به کارمندان درباره آینده شرکت ابراز اطمینان کرد و در عین حال به اخراج‌های آینده اشاره کرد. دامارو در یادداشتی که توسط Business Insider مشاهده شد، به کارکنان گفت: «من نسبت به آینده دیزنی خوشبین تر از همیشه هستم. D'Amaro همچنین در این یادداشت گفت که دیزنی باید \"روش کار ما را دوباره تصور کند\" و برخی تغییرات \"بر افرادی که عمیقاً به دیزنی اهمیت می دهند و کمک زیادی به این شرکت کرده اند تأثیر می گذارد.\" هیو جانستون، مدیر مالی دیزنی، به CNBC گفت که این شرکت پس از سه کاهش قابل توجه کارکنان تا کنون در سال 2026، \"انتظار اخراج های بیشتری\" داشت. دیزنی در نامه خود به سهامداران در روز سه شنبه گفت که انتظار دارد تا سال مالی 2029 پس انداز سالانه 3 میلیارد دلاری را از یک برنامه کاهش هزینه ارائه دهد. کاهش برنامه‌ریزی‌شده در بحبوحه سرمایه‌گذاری‌های بزرگ در فناوری، از جمله تصمیم‌گیری برای استخدام یک مدیر فناوری در سراسر شرکت از Character.AI و هزینه سالانه ۶۰ میلیون دلار برای استخدام ۶۶ کارمند از استارت‌آپ چت‌بات، که در ماه اکتبر اعلام ورشکستگی کرد، صورت می‌گیرد. امسال، دیزنی روی متحد کردن تیم‌ها، از جمله واحدهای بازاریابی و برند، و نزدیک کردن محصولات و بازی‌های مصرف‌کننده به سمت خلاقیت تمرکز کرده است. مدیر عامل دیزنی در یادداشت خود گفت که این تغییرات به این دلیل انجام شده است که \"افرادی که این تجربیات", "image_url": "https://i.insider.com/6afb4d230b1a00fc0bd5096d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سرمایه‌گذاری"], "datetime_fa": "۲۶ آبان • ۱۸:۱۱"}, {"source": "Business Insider", "title": "Mark Cuban says he always gave 3 words of advice to 'Shark Tank' entrepreneurs: 'Sales cures all'", "link": "https://www.businessinsider.com/mark-cuban-most-common-mistake-shark-tank-advice-sales-2026-11", "summary": "Mark Cuban. Anna Webber/Getty Images for Inc. at Inc. Founders House at SXSW Mark Cuban told Scott Galloway about founders' biggest \"Shark Tank\" mistakes. \"I think probably the most common is not being the No. 1 salesperson,\" he said. He said he had three recurring words of advice for founders: \"Sales cures all.\" Mark Cuban says founders often make the same mistake when they pitch to the \" Shark Tank \" panel. \"I think probably the most common is not being the No. 1 salesperson,\" the billionaire told Scott Galloway in Monday's episode of \"The Prof G Pod.\" He said that because the entrepreneurs' companies were \"relatively small,\" they would often come in \"thinking that a shark was going to be a silver bullet,\" or with questions about hiring someone to help them increase their sales. \"When you're getting started, it's your baby, and you understand better than anybody what it's going to take to make this company successful,\" Cuban said. \"But if it's your product or service and you aren't so excited about it that you want to be telling everybody and selling it to everybody, and helping people with that product or service, you're not going to be successful.\" A deal with one of the show's celebrity investors can give a fledgling business cash, publicity, and an experienced partner. However, Cuban said founders cannot rely on that support to persuade customers their product is worth buying. \"I would tell entrepreneurs all the time, sales cures all, and it's your responsibility. If you don't take that responsibility, you're going to fail,\" he added. Galloway agreed, saying that \"entrepreneur\" is effectively \"a synonym for salesperson.\" \"You're either selling employees, selling capital. And if you can't sell, you need to partner with someone who can sell,\" he said. Cuban was a mainstay of \"Shark Tank\" for more than a decade, investing in a range of startups on the ABC show before leaving its regular panel last year. He has since focused on ventures including Cost Plus Drugs , which aims to lower the price of prescription drugs. Read the original article on Business Insider", "date_str": "2026-11-17T14:14:09+00:00", "hash": "88d5bfcbb256af95", "title_fa": "مارک کوبان می گوید همیشه 3 کلمه توصیه به کارآفرینان \"Shark Tank\" می کرد: \"فروش همه چیز را درمان می کند\"", "summary_fa": "مارک کوبان. آنا وبر/ گتی ایماژ برای شرکت در Inc. بنیانگذاران خانه در SXSW مارک کوبان به اسکات گالووی درباره بزرگ‌ترین اشتباهات بنیانگذاران «مخزن کوسه» گفت. او گفت: «من فکر می‌کنم احتمالاً رایج‌ترین آن، عدم فروشنده شماره یک است. او گفت که سه توصیه تکراری برای بنیانگذاران دارد: \"فروش همه چیز را درمان می کند.\" مارک کوبان می‌گوید که بنیانگذاران معمولاً وقتی به پانل «مخزن کوسه» وارد می‌شوند، اشتباه مشابهی را مرتکب می‌شوند. «من فکر می‌کنم احتمالاً رایج‌ترین مورد، «نه» نبودن است. میلیاردر به اسکات گالووی در اپیزود روز دوشنبه «پروف جی پاد» گفت: «از آنجایی که شرکت‌های کارآفرینان «نسبتاً کوچک بودند»، آنها اغلب «فکر می‌کردند که یک کوسه یک گلوله نقره‌ای خواهد بود» یا با سؤالاتی در مورد استخدام کسی که به آنها کمک کند فروش‌هایش را افزایش دهند. کوبان گفت که برای موفقیت این شرکت تلاش خواهیم کرد. اما اگر این محصول یا خدمات شما باشد و آنقدر در مورد آن هیجان زده نباشید که بخواهید به همه بگویید و آن را به همه بفروشید و با آن محصول یا خدمات به مردم کمک کنید، موفق نخواهید شد. معامله با یکی از سرمایه گذاران مشهور نمایش می تواند به یک تجارت نوپا پول نقد، تبلیغات و یک شریک با تجربه بدهد. با این حال، کوبان گفت که بنیانگذاران نمی توانند برای متقاعد کردن مشتریان ارزش خرید محصولشان به این حمایت تکیه کنند. او افزود: \"من همیشه به کارآفرینان می گویم، فروش همه چیز را درمان می کند، و این مسئولیت شماست. اگر این مسئولیت را نپذیرید، شکست خواهید خورد.\" گالووی موافقت کرد و گفت که «کارآفرین» در واقع «مترادف فروشنده است». او گفت: \"شما یا کارمندان را می فروشید، سرمایه می فروشید. و اگر نمی توانید بفروشید، باید با کسی شریک شوید که بتواند بفروشد.\" کوبان برای بیش از یک دهه یکی از پایه‌های اصلی \"Shark Tank\" بود", "image_url": "https://i.insider.com/6afc42ac5aab055bb644279b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "       media: [{"source": "Billboard", "title": "‘Only Murders in the Building’ Season 6 Trailer Arrives With Loads of British Stars, Cheeky Humor & Dodgy Twists", "link": "https://www.billboard.com/culture/tv-film/only-murders-in-the-building-season-6-trailer-british-stars-1236384093/", "summary": "It s only murders — and British superstars — in the building. The trailer for the next season of Only Murders in the Building just dropped, featuring Selena Gomez , Martin Short and Steve Martin going across the pond to solve crimes, brushing elbows with loads of English A-listers in the process. Related Selena Gomez Celebrates Only Murders Being Renewed for Season 6: Looks Like Our Fam Is Going to London We re All Going to Hell : Selena Gomez Company Go Full Godfather in Only Murders Season 5 Trailer Here Are All the Winners in the 7 Music Categories at the 2026 Primetime Emmys: Full List In the preview posted Tuesday (Nov. 17), the trio’s characters decide to travel to London to finish what their true-crime podcasting predecessor Cinda Canning (played by Tina Fey) started, attempting to solve a murder case that seemingly frames Nicola Coughlan’s character as the culprit. Suspecting her to be innocent, Gomez, Short and Martin visit the Bridgerton alum in jail, giving a sneak peek at the humor of American versus British slang that’s sure to come up a lot throughout the season. Are you taking the piss? Coughlan s character angrily asks, to which Short, as Oliver Putnam, replies earnestly: No, I went before I left and once more before I got here. Perhaps the most eye-popping part of the trailer is the number of U.K. stars who make cameos in the project, from Olivia Colman to David Tennant, Martin Freeman, Jim Broadbent, Peter Capaldi, Simone Ashley, Jamie Demetriou, Richard E. Grant, Geri Halliwell-Horner, Jennifer Saunders and more. Plus, Meryl Streep returns as Loretta Durkin, who joins onscreen husband Oliver and the gang in London for the adventure. After successfully bringing the guilty to justice once again, Charles, Oliver and Mabel embark on their hardest case yet when the next victim — Cinda Canning — arrives at their doorstep, summoning them to London to catch her killer, reads a synopsis for the installment, which comes with a modified title: Only Murders in London . Our beloved trio of true crime-solving podcasters must now navigate their way through the home of the cozy murder mystery, replete with a whole new collection of suspicious and particularly English-eccentric characters, it continues. But can they follow in the footsteps of the woman whose podcast started it all for them … without having their story end the same as hers? Gomez, who plays Mabel Mora on the show, also shared the trailer on Instagram , writing, Our series has left the bui", "date_str": "2026-11-17T17:58:48+00:00", "hash": "1a265d112a62adad", "title_fa": "تریلر فصل ششم «Only Murders in the Building» با انبوهی از ستارگان بریتانیایی، طنز بی‌پروا و پیچش‌های مضحک وارد شد", "summary_fa": "این فقط قتل - و سوپراستارهای بریتانیایی - در ساختمان است. تریلر فصل بعدی سریال Only Murders in the Building به تازگی منتشر شد که در آن سلنا گومز، مارتین شورت و استیو مارتین در حال عبور از حوضچه برای حل جنایات هستند و در این روند با تعداد زیادی از A-listers انگلیسی، آرنج ها را مسواک می زنند. مربوط به سلنا گومز فقط تمدید قتل‌ها را برای فصل 6 جشن می‌گیرد: به نظر می‌رسد که خانواده ما به لندن می‌روند ما همه به جهنم می‌رویم: شرکت سلنا گومز به پدرخوانده کامل در فصل 5 فقط قتل‌ها می‌رویم در اینجا همه برندگان در 7 دسته موسیقی در 2026 لیست پرایم‌تایم پیش نمایش امی‌ها آمده‌اند. 17)، شخصیت‌های این سه نفر تصمیم می‌گیرند به لندن سفر کنند تا کاری را که سلف پادکست جنایی واقعی آنها، سیندا کنینگ (با بازی تینا فی) آغاز کرده بود، به پایان برسانند و تلاش می‌کنند پرونده قتلی را حل کنند که ظاهراً شخصیت نیکولا کوگلان را به عنوان مجرم معرفی می‌کند. گومز، شورت و مارتین با مشکوک بودن به بی گناهی او، از زاج بریجرتون در زندان دیدن می کنند و نگاهی اجمالی به طنز زبان عامیانه آمریکایی در مقابل بریتانیا  for the institution’s trailblazing choose-what-you-pay ticketing program (which helps make the arts accessible to all New Yorkers), the gala brought out Broadway veterans (Betsy Wolfe, Caissie Levy), fashion luminaries (Zac Posen, June Ambrose, Clint Ramos) and even the state’s Lt. Governor-Elect, Adrienne Adams. Related Can You Feel It in the Air Tonight? 11 Best Moments From 2026 Rock Roll Hall of Fame Induction Ceremony Wale on Triumphant Pair of 2027 Grammy Nominations for Everything Is a Lot : I Hope It Teaches a Lot of People About Resilience Miley Cyrus Reacts to Shared Grammy Nod With Dolly Parton: A Beautiful Way to Honor Her Enormous Heart But all eyes were on Erivo during her hour-plus concert, which found the Tony, Emmy and Grammy winner interpreting songs from Sting (“Fields of Gold”), Whitney Houston (“I Wanna Dance With Somebody (Who Loves Me)”), Bryan Adams via Brandy (“(Everything I Do) I Do It For You”) and Blood, Sweat Tears (“I Love You More Than You’ll Ever Know”). After owning “In the Air Tonight” at Phil Collins’ solo induction into the Rock Roll Hall of Fame in Los Angeles on Saturday (Nov. 14), Erivo introduced her cover of the moody, percussive classic into her setlist on Monday night. She also delighted the crowd with “You First,” a relatable send-up of stubborn romance she co-wrote with South African singer Manana for her 2025 album I Forgive You. “I sing the songs I like and you’re just along for the ride,” the Oscar-nominated Wicked star told the audience in David Geffen Hall at the top of the night. “So I always say thank you for indulging me cause that’s what you’re doing.” If any attendees were disappointed by the lack of tunes from the blockbuster film duology, you wouldn’t have known it by the frequent standing ovations that brought Erivo out for an unexpected swan song after she wrapped. “We didn’t have an encore planned, but we’ll figure this out together,” Erivo said just before she and her marvelous band trotted out a jaw-dropping version of “I Will Always Love You.” But the highlight of the evening was undoubtedly her version of a hit single from another Rock Hall of Famer, Gladys Knight. Perhaps inspired by the news, confirmed earlier that day, that Robert Pattinson would step in", "date_str": "2026-11-17T17:36:04+00:00", "hash": "c0fe8306bef5154e", "title_fa": "سینتیا اریوو برای تم جیمز باند در طول کنسرت مزایای مرکز لینکلن فیلمبرداری می کند: \"این رویای من است\"", "summary_fa": "دو روز پس از دزدیدن نمایش در مراسم معرفی تالار مشاهیر راک رول 2026، سینتیا اریوو روز دوشنبه (16 نوامبر) برای کنسرت پاییزی مرکز هنرهای نمایشی در مرکز لینکلن شهر نیویورک روی صحنه رفت. گردآوری کمک مالی برای برنامه پیشروی مؤسسه برای فروش بلیط انتخاب کنید چه بپردازید (که به هنر در دسترس همه نیویورکی‌ها کمک می‌کند)، این جشن کهنه‌کاران برادوی (بتسی ولف، کیسی لوی)، چهره‌های سرشناس مد (زک پوزن، جون آمبروز، کلینت راموس، الدام راموس، ال‌دام راموس، ایالت راموس، ایالتی راموس، ایالتی راموس، ایالتی راموس، ایالت راموس را به نمایش گذاشتند. مطالب مرتبط آیا امشب آن را در هوا احساس می کنید؟ 11 بهترین لحظه از مراسم معرفی تالار مشاهیر راک رول 2026 ویل در جفت پیروزمند 2027 نامزدهای گرمی 2027 برای همه چیز زیاد است: امیدوارم به افراد زیادی در مورد انعطاف‌پذیری بیاموزد واکنش مایلی سایرس به اشاره گرمی مشترک با دالی پارتون با چشم‌های دالی پارتون به هورتی. در طول کنسرت چند ساعته‌اش، که برنده تونی، امی و گرمی را در حال تفسیر آهنگ‌هایی از استینگ (\"Fields of Gold\")، ویتنی هیوستون (\"I Wanna Dance With Somebody (Whos Me)\")، برایان آدامز از طریق برندی (\"(Everything I Do) I Do It For You می دانم\") و \"Te More Blood\") و \"Te More Blood\"\" اریو پس از مالکیت «In the Air Tonight» در مراسم حضور انفرادی فیل کالینز در تالار مشاهیر راک رول در لس آنجلس در روز شنبه (14 نوامبر)، کاور کلاسیک خوش خلق و پرکاشن خود را دوشنبه شب وارد لیست مجموعه خود کرد. او همچنین با «تو اول» جمعیت را به وجد آورد، یک پیام عاشقانه سرسختانه که او با خواننده آفریقای جنوبی Manana برای آلبوم 2025 خود من تو را می بخشم نوشت. ستاره نامزد اسکار Wicked در اوج شب به تماشاگران در س  «بدفورد پارک» از جمله 14 ستاره نوظهور صنعت هستند که توسط بفتا برای گروه موفقیت آمیز آمریکا در سال 2026 انتخاب شدند. این برنامه که اکنون در نسخه هفتم خود قرار دارد، برای حمایت از استعدادهای خلاق امیدوارکننده در نقطه عطف کلیدی در حرفه آنها طراحی شده است. [ ] «پیشرفت بفتا ایالات متحده برنامه سرمایه‌گذاری بر روی صداهای خارق‌العاده‌ای است که در آینده در فیلم، تلویزیون و بازی‌ها شکل می‌دهند. گروه امسال منعکس کننده تخیل، جاه طلبی و چشم اندازهای متمایز است که همچنان صنایع ما را به جلو می برد. کورتنی لابارج بل، مدیر اجرایی بفتا آمریکای شمالی گفت: در زمانی که خلاقان نوظهور با چالش‌های فزاینده‌ای در یافتن فرصت، راهنمایی و مسیر رو به جلو روبه‌رو هستند، بفتا مفتخر است که فضایی ایجاد می‌کند که در آن استعدادها قابل شناسایی، حمایت و اتصال به جامعه خلاق گسترده‌تر باشد. هر یک از اعضای این گروه دیدگاه منحصر به فرد و تعهدی به هنر خود دارند که ما معتقدیم شایسته دیده شدن و حمایت است. در اینجا لیست کاملی از پیشرفت بفتای 2026 همگروه ایالات متحده آمده است (تصویر: ردیف جلو: مت هیکسون، زایر لنیر، کین پارسونز و گابریلا اوسیو واندن. ردیف عقب: مارکوس نوریس، آدام میکس، جنیفر سویدبرگ-ین (نردبان)، جورجیا درندرندرن، گابی آکو.", "image_url": "https://variety.com/wp-content/uploads/2026/11/DSC_6901-1-Edit-Edit-Edit.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "سرمایه‌گذاری"], "datetime_fa": "۲۶ آبان • ۲۰:۵۷"}, {"source": "Variety", "title": "Music Industry Moves: Felipe Holguin Named CEO of Universal Music Latin America and Iberian Peninsula", "link": "https://variety.com/2026/music/news/felipe-holguin-named-ceo-universal-music-latin-america-1236950449/", "summary": "Universal Music Group has named Felipe Holguin as CEO of Universal Music Latin America Iberian Peninsula, effective immediately. He will report to Lucian Grainge, Chairman and CEO of UMG, and will take on the role long held by Jesús López, who will shift to a new role as Chairman Emeritus of Global Talent Services, [ ]", "date_str": "2026-11-17T17:14:14+00:00", "hash": "a04428b0a913185b", "title_fa": "حرکت صنعت موسیقی: فیلیپه هولگوین به عنوان مدیرعامل یونیورسال موزیک آمریکای لاتین و شبه جزیره ایبری انتخاب شد", "summary_fa": "گروه موسیقی یونیورسال فیلیپه هولگوین را به عنوان مدیر عامل یونیورسال موزیک شبه جزیره ایبری آمریکای لاتین معرفی کرده است که بلافاصله اجرایی می شود. او به Lucian Grainge، رئیس و مدیر عامل UMG گزارش می‌دهد و نقشی را که مدت‌ها در اختیار ژسوس لوپز بود، برعهده می‌گیرد، که به عنوان رئیس بازنشسته خدمات استعدادهای جهانی تغییر خواهد کرد، [ ] هولگوین قبلاً در Univision Communications بود، جایی که او به عنوان مدیرعامل گروه رسانه‌ای فیوژن خدمت می‌کرد. در طول تصدی خود، او خریدهای دیجیتال را ادغام کرد و بخش انگلیسی زبان شرکت را به 92 میلیون بازدیدکننده منحصر به فرد ماهانه افزایش داد. او همچنین به عنوان معاون اجرایی دیجیتال، اخبار و موسیقی در Univision، از جمله پخش موسیقی و پلتفرم صوتی و فرانچایزهای نمایش جوایز موسیقی تلویزیونی، خدمت کرد. هولگوین در اوایل کار خود، یکی از بنیانگذاران Page One Media، ناشر Poder، یک مجله تجاری برای رهبران اسپانیایی بود. این شرکت به Televisa فروخته شد. اخیرا، هولگوین با Hybe آمریکای لاتین روی استراتژی و عملیات کار کرد. او قبلاً با Exile Content Studio در راه اندازی، رشد و فروش تجارت موسیقی خود به Hybe کار کرده است. داستان‌های مرتبط تور همه درخواست‌های برندی کارلیل فقط یک شیرین‌کاری باشکوه نیست، بلکه یک معامله غیرعادی متحرک بین اجراکننده و تماشاگر است: نقد کنسرت گرینج گفت: «موسیقی لاتین راه را در گشودن مخاطبان جهانی به روی هنرمندان سراسر جهان پیشرو کرده است، و نشان می‌دهد که چگونه موسیقی می‌تواند از مرزها عبور کند و در عین حال صداهایی را که ریشه‌دار می‌ماند، ادامه می‌دهد. چه چیزی ممکن است و به آنچه در آینده است اشاره کنید. فیلیپ احترام عمیق به هنر و اکوسیستم خلاق لاتین را با تخصص در تجارت، فناوری و داده ها ترکیب می کند. من از دیدن کار او با تیم های ما برای سرمایه گذاری در موارد", "image_url": "https://variety.com/wp-content/uploads/2026/11/Felipe_Main-2026-e1794935634357.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۲۶ آبان • ۲۰:۴۴"}, {"source": "Variety", "title": "The Game Awards Nominations 2026: ‘GTA 6’ Lands Game of the Year Nom Ahead of Thursday Release", "link": "https://variety.com/2026/awards/news/game-awards-nominations-2026-list-1236949480/", "summary": "The nominations for 2026 s The Game Awards have been revealed and the yet-to-be-released Grand Theft Auto IV has landed eight nominations, including Game of the Year. Game Awards host and creator Geoff Keighley announced the nominees during a livestreamed special across YouTube and Twitch Tuesday. Along with Rockstar Games GTA 6, the 2026 Game of [ ]", "date_str": "2026-11-17T17:10:02+00:00", "hash": "648926298c281fa0", "title_fa": "نامزدهای جوایز بازی 2026: «GTA 6» نام بازی سال را پیش از انتشار پنجشنبه می‌گیرد", "summary_fa": "نامزدهای جوایز The Game در سال 2026 مشخص شدند و بازی Grand Theft Auto IV که هنوز منتشر نشده است، هشت نامزدی از جمله بازی سال را به خود اختصاص داده است. جف کیلی، مجری و خالق جوایز بازی، نامزدها را در جریان ویژه پخش زنده در سراسر YouTube و Twitch سه شنبه اعلام کرد. همراه با Rockstar Games GTA 6، بازی 2026 [ ] برنده بازی سال گذشته، اولین عنوان مستقل Clair Obscur Expedition 33 بود. بازی موردانتظار Grand Theft Auto VI، پنجشنبه، 19 نوامبر، درست در زیر سیم پنجره واجد شرایط بودن جوایز Game 2026، که جمعه (20 نوامبر) به پایان می رسد، منتشر خواهد شد. برخی از طرفداران حدس می زنند که چون GTA 6 هنوز منتشر نشده است، واجد شرایط جوایز The Game امسال نخواهد بود، یا اینکه اگر چنین بود، نمایش ضرب الاجل صلاحیت خود را برای تطبیق با عنوان منتشر نشده تغییر داده بود، ادعایی که Keighley به طور کامل رد می کند. کیلی در مصاحبه ای با ورایتی هفته گذشته پیش از رونمایی از نامزدها، به نظر من مردم تا حدودی برنامه ریزی می کنند. یادم می‌آید چند هفته پیش چیزی بود که همه فکر می‌کردند ما تاریخ‌هایمان را برای گنجاندن GTA تغییر داده‌ایم، و مثل این است که نه، در واقع تاریخ‌های ما هر سال بسیار تعیین‌شده است. این همان تقویمی است که ما داریم. و من این را نمی‌دانم، اما مطمئنم که برخی از این شرکت‌ها وقتی به تقویم‌های انتشار و برنامه‌ریزی و غیره نگاه می‌کنند، این موضوع را درست م int moves closer to the action in 2027. The Music Clubhouse relocates to The Thompson hotel, with conference programming split between The Thompson and", "date_str": "2026-11-17T17:00:00+00:00", "hash": "05cd0c76a30d05c9", "title_fa": "SXSW اولین 100 هنرمند جشنواره موسیقی 2027 را معرفی کرد", "summary_fa": "SXSW اولین 100 هنرمند را برای کنفرانس جشنواره موسیقی 2027 خود که از 15 تا 21 مارس در آستین برگزار می شود، معرفی کرده است. موج افتتاحیه از 21 کشور که از بین هزاران ارسال انتخاب شده اند، اقدام می کند. در دور اول، روم استریتز، امضاکننده رکوردهای گریزلدا که برای هیپ هاپ هاردکور شناخته شده است، نام برده شد. وایلد پینک، موسیقی راک مستقل که به‌خاطر ترانه‌سرایی هارتلند شناخته می‌شود. La Reezy خواننده رپ نیواورلئان; و LYNN، خواننده رپ متولد بیرمنگام، مستقر در آستین، که از یک سبک رایگان وایرال On The Radar پخش می شود. گروه بین المللی شامل ANASOF در ترانه سرایی لاتین معاصر است. تخت گروه زنده ژاپنی، ترکیبی از تکنو، پانک و پاپ. بوکو یوت، که آزمایش‌های آلت راک آن‌ها را به یکی از بحث‌برانگیزترین کنش‌های جدید اروپا تبدیل کرده است. دو پانک اسکاتلندی Cowboy Hunters; پنج نفره ایرلندی-کورنشی، دختری در سال بالا، که داستان سرایی سلتیک را با آلت راک ترکیب می کند. و La Fiera de Ojinaga، موسیقی منطقه‌ای مکزیکی که موسیقی سنتی نورتنیو را با صدای متمایز Norteño Sax اجرا می‌کند. برایان هابز، معاون موسیقی در SXSW، با اشاره به رکورد حضور در هفت شب نمایشگاه در سال 2026، گفت: \"این 100 هنرمند اول، که توسط تیم ما از هزاران ارسال ارسال شده است، نشان دهنده کیفیت و تنوعی هستند که شرکت کنندگان در هنگام گردهمایی صنعت موسیقی جهانی در SXSW می توانند انتظار داشته باشند.\" \"بیش از همیشه، SXSW مکانی است که هنرمندان در آن شکست می‌خورند و تجارت موسیقی انجام می‌شود.\" SXSW همچنین اولین مجریان نمایشگاهی خود را برای سال 2027 معرفی کرد: بی بی سی معرفی، بلا اتحادیه، بیلبورد، سفارت موسیقی بریتانیا، De Los of LA Times، KCRW، Luck Reunion، Monster Children، NPR Music، Rolling Stone، SoundOn TikTok و United Masters. نمایشگاه‌ها توسط برنامه‌نویسان SXSW با برچسب‌ها، آژانس‌ها، دفاتر", "image_url": "https://www.billboard
