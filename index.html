  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {

      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {

      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

می اضافه شد", "summary_fa": "با الکترونیکی‌شدن مکاتبات سازمان ثبت، زمان استعلام توقیف سیم‌کارت به یک روز کاهش یافت و استعلام چک صیادی و مهریه نیز به سامانه اجرا افزوده شد. تبلیغات سازمان ثبت اسناد و املاک کشور سه قابلیت تازه به «سامانه اجرای اسناد رسمی» اضافه کرده است: ارسال الکترونیکی درخواست توقیف و رفع توقیف خطوط موبایل، استعلام برخط چک‌های صیادی و بازیابی اطلاعات سند ازدواج برای پرونده‌های مهریه. شناسایی و توقیف برخط دارایی‌های بورسی بدهکاران نیز در دست آماده‌سازی است. محسن طاهریان، معاون توسعه فناوری و خدمات الکترونیک ثبتی سازمان ثبت، گفت پیش از این، اداره اجرا درخواست توقیف خط موبایل را با نامه کاغذی برای اپراتور می‌فرستاد و دریافت پاسخ گاهی حدود دو هفته طول می‌کشید. در این فاصله، بدهکار فرصت داشت خط را به شخص دیگری منتقل کند. به گفته طاهریان، با الکترونیکی‌شدن مکاتبات، زمان دریافت پاسخ اپراتور به حدود ۲۴ ساعت رسیده است. توقیف و رفع توقیف مستقیم و برخط خط موبایل به مرحله بعد موکول شده و به فراهم‌ شدن این امکان از سوی اپراتور بستگی دارد. کپی لینک استعلام آخرین دارنده چک و بازیابی سند ازدواج در پرونده‌های چک، با وارد کردن شماره چک صیادی و رمز مربوط، سامانه اطلاعات چک را بازیابی و اصالت آن و وضعیت گواهی عدم پرداخت را بررسی می‌کند. اگر چک چند بار واگذار شده باشد، سامانه زنجیره انتقال و آخرین دارنده آن را نیز مشخص می‌کند تا اجرائیه به نفع دارنده نهایی صادر شود. در پرونده‌های مهریه نیز دفترخانه صادرکننده اجرائیه می‌تواند با واردکردن شماره سند ازدواج و رمز تصدیق، اطلاعات سند را مستقیماً از سامانه وقایع ازدواج و طلاق دریافت کند. به این ترتیب، نیازی به ورود دوباره اطلاعات نیست. این قابلیت فقط برای سندهای ازدواج دارای رمز تصدیق در دسترس است. کپی لینک توقیف برخط سهام بدهکاران هنوز آغاز نشده است به گفته طاهریان، در حال حاضر درخواست توقیف سهام", "image_url": "https://api2.zoomit.ir/media/sim-card-and-smartphone-6ae8900c9569ab33f6874f53?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["بورس و طلا"], "datetime_fa": "۱۱ آبان • ۱۷:۴۵"}, {"source": "Zoomit", "title": "هوش مصنوعی کلاد حالا از مهندسی معکوس بازی‌ها جلوگیری می‌کند", "link": "https://www.zoomit.ir/ai-articles/470270-anthropic-claude-blocks-game-reverse-engineering/", "summary": "مدل‌های جدید هوش مصنوعی آنتروپیک، از جمله کلاد کد، درخواست‌های مهندسی معکوس و بازسازی بازی‌های ویدیویی را به دلایل امنیتی و حقوقی رد می‌کنند.", "date_str": "2026-11-02T14:00:00+00:00", "hash": "6f110ce37b231179", "title_fa": "هوش مصنوعی کلاد حالا از مهندسی معکوس بازی‌ها جلوگیری می‌کند", "summary_fa": "مدل‌های جدید هوش مصنوعی آنتروپیک، از جمله کلاد کد، درخواست‌های مهندسی معکوس و بازسازی بازی‌های ویدیویی را به دلایل امنیتی و حقوقی رد می‌کنند. تبلیغات مدل‌های هوش مصنوعی آنتروپیک از جمله ابزار کلاد کد و مدل Opus 5.5 روند رسیدگی به درخواست‌های مرتبط با مهندسی معکوس و بازسازی کدهای بازی‌های ویدیویی را متوقف کرده‌اند. گزارش‌های متعددی از سوی توسعه‌دهندگان نشان می‌دهد که سامانه‌های هوش مصنوعی حتی از اجرای پروژه‌های بی‌خطر با ابزارهای محبوبی مانند Reverse Engineer Anything موسوم به REA سر باز می‌زنند. شواهد حاکی از اعمال دستورالعمل‌های متنی سخت‌گیرانه‌ای است که مدل را صراحتا از بازآفرینی بازی‌های موجود منع می‌کند. پلتفرم گیت‌هابِ Claude Code با موجی از گزارش‌های خطا و اعتراض برنامه‌نویسان مواجه شده است که از توقف ناگهانی امور روزمره مانند پیاده‌سازی مکانیک‌های ساده یا به‌روزرسانی بازی‌های رومیزی شکایت دارند. یکی از کاربران شبکه‌ی اجتماعی ایکس متنی منتسب به قوانین داخلی مدل را منتشر کرد و نوشت: «بازی‌های اصیل، بازی‌های متناسب با یک سبک خاص و بازی‌های مبتنی‌بر طراحی‌ها و دارایی‌های شخصی خود کاربر را بسازید. از ساخت بازآفرینی یک بازی خاص و موجود خودداری کنید، حتی اگر نام آن تغییر کرده باشد یا اصیل نامیده شود.» محدودیت‌های تازه تنها به عناوین ویدئویی ختم نمی‌شود و دامنه‌ی امنیتی گسترده‌تری را هدف گرفته است. کاربران در ردیت گزارش داده‌اند که کلاد از تحلیل فایل‌های عیب‌یابی ویندوز، پاکسازی نرم‌افزارهای زائد تلویزیون‌های سامسونگ و بررسی آسیب‌پذیری‌های سیستم‌های ضدتقلب بازی‌ها خودداری می‌کند. آنتروپیک پیش‌تر برنامه‌ی Cyber Verification Program را معرفی کرد که طبق آن، دسترسی به قابلیت‌های پیشرفته امنیت سایبری تنها به مجموعه‌های تحت پوشش Project Glasswing محدود شده است. کارشناسان معتقدند این اقدامات پیشگیرانه برای جلوگیری از شکایت‌های سنگین حقوقی از سوی استودیوهای بزرگ بازیسازی و ناشران نرم‌افزاری علیه توسعه‌دهندگان هوش مصنوعی صورت می‌گیرد.", "image_url": "https://api2.zoomit.ir/media/cover-6a4a07a561303fad17559378?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "امنیت سایبری"], "datetime_fa": "۱۱ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I moved to Greece 4 years ago. My lifestyle and habits have changed more than I expected.", "link": "https://www.businessinsider.com/american-moved-to-greece-lifestyle-habits-changes-shopping-culture-2026-11", "summary": "Living in Greece has changed the way I shop, eat, and dress. Kathleen O Donnell I've lived in Greece for over four years now, and my lifestyle and routine have changed a lot. I used to wear athleisure to run errands, but now I dress up every time I leave the house. I also eat meals later and have a different grocery-shopping routine. After more than four years of living in Athens, Greece , I've still retained a few very American habits. For instance, I love sleeping with my AC on at 70 degrees Fahrenheit in the summer, and waking up to make a big breakfast of waffles with maple syrup. I still don't take a two-week vacation in August, although I dream of doing it someday. I grew up in Boston and lived in the US for the first 33 years of my life, so it makes sense that I've stuck with a few American tendencies despite my years abroad. But whenever I visit back home, I realize how much I've adjusted to many Greek-inspired habits. These are the ones that have become an integral part of my lifestyle now. The way I dress has changed I no longer wear athleisure to run errands. Kathleen O Donnell In the US, I'd think nothing of leaving my house in athleisure clothes to run errands — stretchy leggings, a zip-up sweatshirt, hair scraped into a messy bun. Here in Greece, however, I don't even go to the grocery store dressed like that anymore. I pull on a proper pair of jeans and a top, tie up my leopard-print Converse sneakers or step into my pink Birkenstock sandals, and arrange my hair into a French twist if it's too messy to wear it down. I also take at least a minute or two to pull my face together before I go — brushing my eyebrows into place and slicking on a little lip color to look a bit more presentable. In my experience, it's very uncommon here to see people outside their homes looking unpolished or untidy. This doesn't mean everyone runs errands in formal attire (hence my Converse and jeans), but it's seen as bad manners to leave the house looking like you just rolled out of bed. Now, the only time I wear gym clothes is when I'm actually on my way to the gym. My grocery shopping routine looks very different Farmers markets in Athens look very different from what I m used to. Kathleen O Donnell When I lived in downtown Boston, I had a routine: I'd walk a mile to the nearest Whole Foods and buy everything I needed for the week ahead, lugging my overstuffed backpack home. Now, in Athens, I shop quite differently. On Friday mornings I go to the laiki agora, or", "date_str": "2026-11-02T14:52:01+00:00", "hash": "822e3437230e975c", "title_fa": "من 4 سال پیش به یونان نقل مکان کردم. سبک زندگی و عادات من بیش از آنچه انتظار داشتم تغییر کرده است.", "summary_fa": "زندگی در یونان نحوه خرید، غذا خوردن و لباس پوشیدن من را تغییر داده است. Kathleen O Donnell من بیش از چهار سال است که در یونان زندگی می کنم و سبک زندگی و روال زندگی من بسیار تغییر کرده است. من قبلاً برای انجام کارها لباس ورزشی می پوشیدم، اما اکنون هر بار که از خانه بیرون می روم لباس می پوشم. من همچنین بعداً غذا می‌خورم و روال خرید مواد غذایی متفاوتی دارم. پس از بیش از چهار سال زندگی در آتن، یونان، من هنوز چند عادت آمریکایی را حفظ کرده ام. برای مثال، من عاشق این هستم که در تابستان با AC روشن با دمای 70 درجه فارنهایت بخوابم و از خواب بیدار شوم تا یک صبحانه بزرگ از وافل با شربت افرا درست کنم. من هنوز یک تعطیلات دو هفته ای در ماه اوت نمی گیرم، اگرچه آرزو دارم روزی آن را انجام دهم. من در بوستون بزرگ شدم و 33 سال اول زندگی ام را در ایالات متحده زندگی کردم، بنابراین منطقی است که علیرغم سال‌هایی که در خارج از کشور بودم، به چند گرایش آمریکایی پایبند بوده‌ام. اما هر زمان که به خانه باز می گردم، متوجه می شوم که چقدر با بسیاری از عادات یونانی الهام گرفته شده ام. اینها همان هایی هستند که اکنون به بخشی جدایی ناپذیر از سبک زندگی من تبدیل شده اند. نحوه لباس پوشیدن من تغییر کرده است، دیگر برای انجام کارهای ورزشی لباس ورزشی نمی پوشم. Kathleen O Donnell در ایالات متحده، فکر نمی‌کنم از خانه‌ام با لباس‌های ورزشی برای انجام امور خارج شوم - شلوارهای شلوار چسبان، یک سویشرت زیپ‌دار، موهایی که به صورت یک موی درهم کشیده شده است. با این حال، اینجا در یونان، من دیگر حتی با آن لباس به خواربار فروشی نمی روم. یک شلوار جین مناسب و یک تاپ می‌پوشم، کفش‌های", "image_url": "https://i.insider.com/6ae4b2078bd5d6547af340f9?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۸:۲۲"}, {"source": "Business Insider", "title": "The suburbs were an escape from city life. Now, millennials want them to become more like cities.", "link": "https://www.businessinsider.com/millennials-want-walkable-suburbs-third-spaces-2026-11", "summary": "A NAR report found that homebuyers are willing to pay more to live in walkable neighborhoods. Tony Anderson/Getty Images Cities were once the main option for living within walking distance of parks, cafés, and shops. Now, the suburbs are getting the same treatment as developers build walkable, amenity-rich communities. A NAR survey found that buyers will even pay more to live in these types of neighborhoods. Joseph Hajjar and his wife had spent years living in big cities , where they enjoyed the fast-paced lifestyle and endless options for things to do. So when they decided to settle in the suburbs and raise their two young daughters, they had a few non-negotiables. \"We had a spreadsheet going, and the towns that checked a lot of boxes were the ones with walkability and a good restaurant scene,\" Hajjar, 40, told Business Insider. \"We were also looking for a strong sense of community.\" They ultimately chose Summit, New Jersey , a small commuter suburb about 22 miles from New York City. They paid $1.4 million for a roughly 3,500-square-foot home — far larger than their two-bedroom condo in Jersey City. It even came with an upstairs attic they use to host guests, a yard, and a garden, features they could only have dreamed of having in the city. Sure, they're paying more than when they were living in the city. But one of the home's biggest perks is its proximity to Summit's historic downtown, where the family can walk to shops, cafés, and restaurants. It is also close to the train station, where Hajjar's wife catches the New Jersey Transit to work in New York City. \"We only wanted to do this once, versus buying a starter home ,\" Hajjar said. \"Summit has a lot of great stuff. There's a really good YMCA right downtown, so I can walk to the gym. My wife and I can have a date night and walk into town.\" For decades, people looking for a home have faced a choice between two distinct lifestyles: either large, walkable cities rich in \"third places,\" gathering places outside the home and workplace, like cafés and parks; or the more self-contained, car-dependent suburbs. As Americans place greater value on connection and convenience, home buyers like the Hajjars are asking more of their neighborhoods — and, in turn, homebuilders are reimagining suburbia. People want to live in walkable neighborhoods with things to do NAR's 2026 Community and Transportation Preference Survey polled 2,000 adults in the nation's 50 largest metro areas and found that 63% of respondents woul", "date_str": "2026-11-02T14:42:01+00:00", "hash": "eb8cc5cece28916f", "title_fa": "حومه شهر فرار از زندگی شهری بود. اکنون، هزاره ها می خواهند که آنها بیشتر شبیه شهرها شوند.", "summary_fa": "گزارش NAR نشان داد که خریداران خانه حاضرند برای زندگی در محله‌های قابل پیاده‌روی هزینه بیشتری بپردازند. تونی اندرسون/ گتی ایماژ شهرها زمانی گزینه اصلی برای زندگی در فاصله کمی از پارک ها، کافه ها و مغازه ها بودند. اکنون، حومه‌ها همان رفتاری را دارند که توسعه‌دهندگان جوامعی قابل پیاده‌روی و غنی از امکانات می‌سازند. یک نظرسنجی NAR نشان داد که خریداران حتی برای زندگی در این نوع محله‌ها هزینه بیشتری می‌پردازند. جوزف حجار و همسرش سال‌ها در شهرهای بزرگ زندگی می‌کردند، جایی که از سبک زندگی سریع و گزینه‌های بی‌پایان برای انجام دادن لذت می‌بردند. بنابراین وقتی تصمیم گرفتند در حومه شهر مستقر شوند و دو دختر کوچک خود را بزرگ کنند، چند چیز غیرقابل مذاکره داشتند. حجار، 40 ساله، به Business Insider گفت: «ما یک صفحه گسترده داشتیم، و شهرهایی که تعداد زیادی جعبه را بررسی می‌کردند، شهرهایی بودند که قابلیت پیاده‌روی و رستوران خوبی داشتند. ما همچنین به دنبال یک حس قوی از جامعه بودیم. آنها در نهایت سامیت، نیوجرسی را انتخاب کردند، یک حومه کوچک برای رفت و آمد در حدود 22 مایلی شهر نیویورک. آنها 1.4 میلیون دلار برای خانه ای به مساحت 3500 فوت مربع پرداخت کردند - بسیار بزرگتر از آپارتمان دو خوابه آنها در جرسی سیتی. حتی با یک اتاق زیر شیروانی طبقه بالا که برای میزبانی از مهمانان از آن استفاده می کنند، یک حیاط و یک باغ، ویژگی هایی که فقط می توانستند در شهر آرزوی داشتن آن را داشته باشند، ارائه شد. مطمئناً، آنها بیشتر از زمانی که در شهر زندگی می کردند، پرداخت می کنند. اما یکی از بزرگ‌ترین مزیت‌های خانه، نزدیکی آن به مرکز شهر تاریخی سامیت است، جایی که خانواده می‌توانند پیاده به مغازه‌ها، کافه‌ها و رستوران‌ها بروند. همچنین به ایستگاه قطار نزدیک است، جایی که همسر حجار با ترانزیت نیوجرسی می‌رود تا در شهر نیویورک", "image_url": "https://i.insider.com/6ae4d2d4d8cc18cf7950f996?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۸:۱۲"}, {"source": "Business Insider", "title": "Ukraine has put thousands of new war robots into the fight. Fall and winter will test how they handle mud and snow.", "link": "https://www.businessinsider.com/ukraine-war-ground-robot-army-swelled-autumn-winter-test-2026-11", "summary": "Ukraine s ground robot fleet has grown since last winter. Chris McGrath/Getty Images Ukraine's war robot fleet has grown rapidly, with new models and capabilities entering the fight. But Ukraine's fall and winter will test how well the robots handle mud, snow, and freezing temperatures. \"We will be able to assess how much they have evolved compared to last autumn,\" a Ukrainian officer told BI. Ukraine's ground robot fleet has swelled , but new tests lie ahead, specifically the thick autumn mud and the winter cold and snow that can make battlefield movement more difficult and stress certain systems. Over the last year, the country's military and industry have prioritized fielding an army of robots to attack, gather intelligence, carry gear, and evacuate the wounded. The purpose is to replace as many human soldiers as possible in the war's most dangerous sectors. The fleet has expanded significantly and advanced technologically since last winter. Now it faces seasonal tests. \"These ground robotic systems are constantly being improved,\" Oleksandr Yabchanka, head of robotic systems for Ukraine's Da Vinci Wolves Battalion, told Business Insider. \"Their operational range and off-road mobility are increasing.\" \"Now that autumn has arrived, we will be able to assess how much they have evolved compared to last autumn,\" he said. \"After all, operating in the summer on dry ground is one thing, but in the autumn — when the ground turns to mud and movement becomes significantly more difficult — it is quite another.\" Mud and other autumn and winter conditions make it harder for robots to travel. John Moore/Getty Images In March, Ukraine's defense ministry said that since the beginning of the year, more than 20,000 ground robotic systems had been contracted, which it said was almost twice as many as in all of 2025. It said their use was \"rapidly expanding.\" \"There are more of them now,\" Yabchanka, also a cofounder of the nonprofit Defence Robotics UA, said. \"Throughout 2026, many units have begun employing UGVs.\ ee productivity and identifies opportunities for better adoption. The software integrates with companies' internal systems to analyze employees' AI usage, including their prompts to different AI tools, and determine who is using AI effectively, who needs more training, and how much time they're saving. Cofounder and CTO Ameya Kanitkar said the platform protects employee privacy by analyzing their AI interactions without storing their contents, instead generating scores and high-level insights. Always a need for a third-party measurement platform Russell Fradin, CEO and cofounder of Larridin, previously worked at Comscore, a media and advertising measurement platform. He said that, in his experience, whenever a lot of money moves into a category, someone builds a third-party measurement platform for that category, evidenced by Comscore, Nielsen, or Datadog. \"We said, look, there's going to be a ton of AI spend ,\" Fradin said. \"There's going to be a third-party audit measurement company, and let's try and be that company.\" The company has a third cofounder, Jim Larrison, who worked with Fradin at Comscore. Larridin's $30 million Series A was led by Pelion Ventures, Andre", "date_str": "2026-11-02T14:00:01+00:00", "hash": "493203c312a84eaf", "title_fa": "لایحه هوش مصنوعی شرکت های آمریکایی در حال افزایش است. این استارت‌آپ 30 میلیون دلار جمع‌آوری کرد تا بفهمد این پول به کجا می‌رود.", "summary_fa": "آمیا کانیتکار، راسل فرادین و استارت‌آپ جیم لاریسون به تازگی 30 میلیون دلار سری A جمع‌آوری کرده‌اند. هوش مصنوعی Larridin از یک هزینه کوچک تجاری به یکی از گران‌ترین اقلام در دفتر کل شرکت‌ها تبدیل شده است. استارت‌آپ سانفرانسیسکو Larridin 30 میلیون دلار جمع‌آوری کرد تا مشخص کند آیا شرکت‌ها ارزش پول خود را دارند یا خیر. Larridin's Series A در پی عصر tokenmaxxing عرضه می شود، زیرا شرکت ها نگران AI ROI هستند. شرکت‌ها امسال همه چیز را روی هوش مصنوعی وارد کردند و اکنون با صورت‌حساب‌های سنگین حساب می‌کنند. یک استارت‌آپ می‌خواهد زیر کاپوت قرار بگیرد و بفهمد که کدام یک ارزشش را دارند.  she moved from Paris to New York City for my dad's job, with two young kids, she needed a way to keep us warm in the stroller so she could go about her day. She still tells stories about wrapping me in layers and layers of blankets. As soon as we'd get into a shop, I'd strip them off, and she'd have to do it all again. My mom is utilitarian, so she created a stroller blanket with a zipper that was quick and easy to get me in and out of. Chana Campora s mom invented a blanket for her stroller. Courtesy of Chana Campora She was just trying to lighten her load. Little did we know at the time that she was creating a genius product that would serve so many parents for years to come. More than 20 years later, her business has expanded, but we still use the original five blanket silhouettes she created. It's amazing to see that they're as relevant as ever, and still what parents want and need . I grew up helping with the company, but I wasn't sure I'd join The company was my mom's fourth child, and as the oldest daughter , I helped her care for it. At first, she would sew her designs at home; later, we attended trade shows together. I learned the value of hard work from watching my mom. It was meaningful to know that my siblings and I were her source of inspiration. Her premise with 7AM Enfant was simple: to keep us safe and warm, and keep her day going. That's something she's never stopped fighting for. Chana Campora helps run 7AM Enfant with her mother. Courtesy of Chana Campora Although I loved the company, I wasn't sure I'd join the business. I spent five years in LA, studying Spanish and French literature, and getting a master's in anthropology. Being the daughter of immigrants — and speaking four languages — is central to who I am. My mom and I have fun designing together When I returned to New York , it was clear to me that my mom needed a partner. She'd been a one-woman show for too long. I'd dabbled in other jobs, but realized I needed to join my m", "date_str": "2026-11-02T13:57:01+00:00", "hash": "27f7dd193276dbd5", "title_fa": "یک پتوی کالسکه زندگی مادرم را تغییر داد. اکنون به او کمک می کنم تا 7AM Enfant را اداره کند، کسب و کاری که الهام گرفته از آن است.", "summary_fa": "چانا کامپورا 7 صبح نوزاد را با مادرش اجرا می کند. به لطف چانا کامپورا، مادر چانا کامپورا، ربکا، زمانی که چانا پیش دبستانی بود، یک پتوی کالسکه درست کرد. چانا با کمک به شرکت بزرگ شد، اما مطمئن نبود که در آنجا کار کند. او می‌گوید تماشای والدین مهاجرش که به دنبال رویاهایشان هستند، شغل او را شکل داده است. این مقاله گفته شده بر اساس گفتگو با چانا کامپورا، نایب رئیس 7AM Enfant است. برای طول و وضوح ویرایش شده است. مادر من فردی شیک پوش و بسیار کاربردی است. هنگامی که او از پاریس به نیویورک سیتی برای کار پدرم نقل مکان کرد، با دو بچه خردسال، به راهی نیاز داشت که ما را در کالسکه گرم نگه دارد تا بتواند روز خود را بگذراند. او هنوز داستان هایی درباره پیچیدن من در لایه ها و لایه های پتو می گوید. به محض اینکه وارد یک مغازه می‌شدیم، آنها را بیرون می‌کشیدم، و او باید همه کارها را دوباره انجام می‌داد. مادر من سودمند است، بنابراین او یک پتوی کالسکه با زیپ ایجاد کرد که به سرعت و به آسانی من را داخل و خارج کرد. مادر چانا کامپورا یک پتو برای کالسکه خود اختراع کرد. با حسن نیت از Chana Campora او فقط سعی می کرد بار خود را سبک کند. در آن زمان نمی‌دانستیم که او در حال ایجاد یک محصول نابغه است که برای سال‌های آینده به بسیاری از والدین خدمت می‌کند. بیش از 20 سال بعد، کسب و کار او گسترش یافته است، اما ما هنوز از 5 سیلوئت اصلی که او خلق کرده است استفاده می کنیم. شگفت‌انگیز است که می‌بینیم آن‌ها مثل همیشه مرتبط هستند، و همچنان آنچه والدین می‌خواهند و نیاز دارند. من با کمک به شرکت بزرگ شدم، اما مطمئن نبودم که به شرکت بپیوندم. شرکت چهارمین فرزند مادرم", "image_url": "https://i.insider.com/6ada44d02a1b5bc156b1b0d2?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۷:۲۷"}, {"source": "Business Insider", "title": "My tennis buddy has an AI agent. It's changing his life.", "link": "https://www.businessinsider.com/openai-dot-ai-agent-tennis-buddy-everyday-tasks-2026-10", "summary": "Tennis balls Yomiuri Shimbun/Reuters A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . My Thursday evening tennis league started again recently, and something unusual happened. The emails organizing our weekly games began arriving with a new sign-off. \"See you on the court! Nathan's agent.\" My tennis buddy Nathan Czubaj has organized this league for years. It's a lot of work involving spreadsheets, scheduling, endless reminders, and chasing players who forget to confirm whether they're coming. Now he's outsourced much of that work to an AI agent . Naturally, when we gathered on court, everyone wanted to know what Nathan was using. This is Silicon Valley , after all. We can't even play tennis without talking about AI . Nathan explained that he'd started using OpenAI's Dots , a personal AI assistant that can handle tasks over time and work with other apps. Every Monday, Dot checks a spreadsheet containing our availability and emails players who might be able to play that Thursday. It asks us to confirm. On Thursday morning, another email reminds the confirmed players to show up at 7 pm. It's been working remarkably well for several weeks, saving Nathan considerable time. But here's what makes his experience particularly interesting: Nathan isn't a technology expert. \"I'm one of the least technical people I know,\" he told me. Nathan runs Mindset Unlimited , a business that helps professionals become better communicators and leaders through coaching and training. From Claude Code to Dots He's enthusiastic about AI, but his journey hasn't been entirely smooth. A few months ago, he experimented with Anthropic's Claude Code , a tool that can write software and carry out complicated computer tasks. He found it frustrating and stopped using it. \"It was not easy to manage and it took much longer than it would take to do it yourself,\" he said. Dots has been different. Nathan can describe what he wants in ordinary language, and his Dot can work with services he already uses. He started with tennis scheduling. Now he's handing his Dot tasks throughout his personal and professional life. On one recent day, he asked it to help with guitar practice, a workout routine, shopping lists, selling things on eBay, finding a birthday present, and creating a family book of memories. He also uses it to remember to call friends, recommend books, find workshops, and develop longer-term goals. A", "date_str": "2026-11-02T13:53:02+00:00", "hash": "c7b67ec56a127ab4", "title_fa": "دوست تنیس من یک عامل هوش مصنوعی دارد. زندگی او را تغییر می دهد.", "summary_fa": "", "image_url": "https://i.insider.com/6ae516068bd5d6547af3450a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۱۱ آبان • ۱۷:۲۳"}, {"source": "Business Insider", "title": "I tried Chipotle's $52 family meal. It was plenty of food for 6 … and really great meal prep for 2.", "link": "https://www.businessinsider.com/tried-chipotle-family-meal-what-i-got-worth-it-review-2026-11", "summary": "I ordered Chipotle s family meal to see what I d get and whether it would be a great value. Savannah Born I tried Chipotle's chicken family meal , which cost $52 and is meant to serve four to six. Although I wish we'd gotten more salad and that my chips hadn't been missing, I was impressed. Ultimately, we were able to make six well-portioned, tasty meals at home for less than $10 each. Even though I usually cook at home and avoid fast (and fast-casual) food whenever possible, I have a hard time turning down Chipotle. I build the same salad bowl every time I go, so I don't pay much attention to the rest of the menu. It wasn't until I saw Chipotle's strange fever-dream of an advertising campaign that I learned about its family meals. Simply put, it involved a 3-foot reusable version of its takeout bag. Bizarre, yes, but it worked. Curious about the details (and the \"big ass\" bag mentioned in the advertisement), I did some Googling. Turns out, Chipotle launched its family meals in August 2025. The build-your-own experience is a major appeal. Per Chipotle , \"People can create any bowl, salad, or soft taco to their liking and dietary preferences.\" Nachos were also suggested. Since I love salads and my partner prefers bowls, it seemed like the perfect setup. Plus, family meals are designed to serve four to six people — which, in my two-person household , could mean dinners for days. So, I ordered a chicken family meal online, complete with all the default items. Here's how it shook out. My local Chipotle had a few options for family meals. Savannah Born Even though I set my sights on its $52 chicken meal, Chipotle also offered steak and sofritas meals featuring the same standard fixings: rice (white or brown) beans (black or pinto) cheese romaine lettuce large chips 10 soft-flour tortillas three dips (choices included sour cream and four different salsas) one premium side (either guacamole or queso). The meals ranged from $52 to $63, depending on the protein. It's worth noting that these family meals are all digital-only, so they have to be ordered through the app or website. Ordering online felt seamless. Savannah Born Since I stuck with the baseline, customization-free spread, ordering took only a few clicks. My lineup included white rice, black beans , cheese, romaine lettuce, large chips, and 10 flour tortillas, plus sour cream, pico de gallo, and hot salsa as toppings. Then, I scrolled to the \"extras\" section. I could add another protein and up to seven ext", "date_str": "2026-11-02T13:44:01+00:00", "hash": "85f0155aa0a58db7", "title_fa": "من غذای خانوادگی 52 دلاری Chipotle را امتحان کردم. برای 6 نفر غذای زیادی بود... و برای 2 نفر غذای بسیار عالی تهیه کرد.", "summary_fa": "من غذای خانوادگی چیپوتل را سفارش دادم تا ببینم چه چیزی می‌گیرم و آیا ارزش زیادی دارد یا خیر. Savannah Born من غذای خانوادگی مرغ چیپوتل را امتحان کردم که 52 دلار قیمت داشت و قرار است چهار تا شش سرو شود. اگرچه ای کاش سالاد بیشتری می‌خوردیم و چیپس‌هایم از دست نمی‌رفت، اما تحت تأثیر قرار گرفتم. در نهایت، ما توانستیم شش غذای خوش طعم و خوش طعم را در خانه برای هر کدام کمتر از 10 دلار درست کنیم. اگرچه من معمولاً در خانه آشپزی می‌کنم و تا حد امکان از غذاهای سریع (و سریع) اجتناب می‌کنم، برای رد کردن Chipotle مشکل دارم. من هر بار که می روم همان کاسه سالاد را درست می کنم، بنابراین به بقیه منو توجه زیادی نمی کنم. تا زمانی که تب و رویای عجیب چیپوتل در مورد یک کمپین تبلیغاتی را دیدم که از غذاهای خانوادگی آن مطلع شدم. به عبارت ساده، این شامل یک نسخه قابل استفاده مجدد 3 فوتی از کیسه بیرون‌کش آن بود. عجیب است، بله، اما کار کرد. کنجکاو در مورد جزئیات (و کیف \"الاغ بزرگ\" ذکر شده در آگهی)، کمی گوگل را جستجو کردم. به نظر می رسد، Chipotle غذاهای خانوادگی خود را در آگوست 2025 راه اندازی کرد. تجربه خود را بسازید جذابیت اصلی است. به گفته چیپوتل، \"مردم می توانند هر کاسه، سالاد یا تاکوی نرمی را به دلخواه و ترجیحات غذایی خود درست کنند.\" Nachos نیز پیشنهاد شد. از آنجایی که من عاشق سالاد هستم و شریک زندگی من کاسه ها را ترجیح می دهد، به نظر می رسد که چیدمان عالی است. بعلاوه، وعده های غذایی خانوادگی برای خدمت به چهار تا شش نفر طراحی شده است - که در خانواده دو نفره من می تواند به معنای شام برای روزها باشد. بنابراین، من یک غذای خانواده مرغ را به صورت آنلاین", "image_url": "https://i.insider.com/6ae36082fdfd5d46e952a97e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۱ آبان • ۱۷:۱۴"}, {"source": "Business Insider", "title": "'If we can annoy him again, so much the better': Ryanair's CEO poured fuel on the fire of his beef with Elon Musk", "link": "https://www.businessinsider.com/ryanair-ceo-michael-oleary-elon-musk-starlink-fight-2026-11", "summary": "Ryanair CEO Michael O Leary promoted a sale after feuding with Elon Musk over Starlink in January. Brian Lawless/PA Images via Getty Images Ryanair's CEO won't back down in his fight with Elon Musk, saying he wants to \"annoy\" him. Michael O'Leary and Musk have clashed over the airline choosing not to install Starlink on its planes. \"I have no intention of making up with him,\" O'Leary told Bloomberg TV after earnings on Monday. Ryanair's CEO isn't done bickering with the world's richest man. Michael O'Leary, the budget airline's billionaire boss, said on Monday that talks with Elon Musk's Starlink broke down because the SpaceX subsidiary thought the budget airline's passengers would pay for internet access. Speaking on an earnings call on Monday, O'Leary said the airline had \"extensive discussions\" with Starlink, which he said was willing to cover the costs of installing WiFi terminals on Ryanair's airplanes. However, the typically outspoken businessman then added: \"Where the discussions broke down was they believe 60% of our passengers will pay for free WiFi, to which we said, 'You have obviously never met a Ryanair fucking passenger in your life.'\" Ryanair's decision not to install Starlink led to a very public fallout between Musk and O'Leary, and at least one of the men isn't yet ready to bury the hatchet. \"I have no intention of making up with him,\" O'Leary told Bloomberg TV after the call. \"He thinks I'm an idiot. I know he's an idiot.\" \"If we can annoy him again, so much the better,\" O'Leary said. Musk hasn't responded publicly to O'Leary on Monday, and SpaceX did not immediately respond to a request for comment. Ryanair is the world's third-largest carrier by passenger numbers, and the largest in Europe, attracting customers with fares as low as 15 euros ($17). Its no-frills business model relies on operating a high volume of flights and enticing customers with cheap fares, but charging for virtually everything else. Starlink's surge in popularity with airlines Starlink has soared in popularity with airlines over the past year, and has signed deals with nearly 50 carriers. Its high-speed internet service is usually offered free to passengers who only have to sign up for the airline's loyalty program. However, O'Leary cast doubt on this regarding easyJet, the British budget airline that announced a Starlink deal last Monday. \"It is not clear to us whether they are going to give it away for free,\" O'Leary said. \"I understand the briefing is that they ", "date_str": "2026-11-02T13:32:52+00:00", "hash": "4818aaa96ebb145c", "title_fa": "\"اگر دوباره بتوانیم او را اذیت کنیم، خیلی بهتر\": مدیرعامل رایان ایر با ایلان ماسک روی آتش گوشت گاو خود سوخت ریخت.", "summary_fa": "", "image_url": "https://i.insider.com/6ae88687f3bee449b3d2a222?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۷:۰۲"}, {"source": "Lifehacker", "title": "The Top 10 Movies Right Now, According to Streaming Data", "link": "https://lifehacker.com/entertainment/the-top-10-movies-right-now-according-to-streaming-data?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The most streamed movie in October was Steven Spielberg's Disclosure Day , but half of the month's top ten is made up of season-appropriate horror movies. This year's two most successful horror movies, Backrooms and Obsession, made the list; so did a classic ( Halloween from 1978) and an art movie about the genre that Halloween created, Teenage Sex and Death at Camp Miasma. Perfect double feature. Rounding out the list is the all-around-excellent Hokum . If you're not into horror, you might like Golden Arm , a comedy that refused to die, star-studded comedy The Invite , or ultimate crowd-pleaser Project Hail Mary . Disclosure Day (2026) Legendary director Steven Spielberg returns to the extraterrestrials he loves so much with a thriller that's a spiritual sequel to Close Encounters of the Third Kind . Disclosure Day details the events that lead up to the revelation that aliens are among us. Josh O Connor plays Dr. Daniel Kellner, a cybersecurity expert for a government contractor who un       media: [{"source": "Billboard", "title": "Adam Levine Talks ‘The Voice’ Cut Week Twist & Calls Riley Green a ‘Younger, Funnier, Better-Looking Blake’", "link": "https://www.billboard.com/culture/tv-film/adam-levine-the-voice-cut-week-interview-riley-green-blake-1236357468/", "summary": "Adam Levine has been sitting in The Voice s big red chairs long enough to remember when they seemed downright strange. When we started this show, there was no Voice , Levine tells Billboard . The format had already become a become a major success overseas in Holland, but when the show came to the U.S., even the coaches weren t sure what they were getting into. I remember day one we thought, What are these big red goofy chairs and what are we supposed to do?' Related ‘The Voice’: Four-Chair Turn Cade Mower Moves on After Battle Round ‘The Voice’ Winners: Which Coach Singer Won Each Season? Adam Levine Is Floored by a Black Sabbath Cover on The Voice The Voice is now in its 30th season, and those chairs are one of the most recognizable set pieces in music television and Levine is back in one of them. For season 30, Levine joins returning coach Kelly Clarkson and first-time coaches Riley Green and Queen Latifah for a new era of The Voice , which includes the Cut Week twist that kicks off on tonight s episode (Nov. 2). Cut Week will mark the biggest elimination in The Voice history, when each coach will send two singers straight through to Live Shows as five more contestants battle for one remaining spot on each team. Viewers can get in the mix too, because once the top 12 is set, fans can vote via text and TikTok to send one final artist to the Live Shows. While Levine has been through the process many times before, he says he s surprised by just how much fun he s still having. The chemistry between the four of us is insane, he says. You never know with those types of things what it ll be. Levine already knew Clarkson and Queen Latifah, but Green was a new addition to his Voice buddies. The two, however, clicked almost immediately. We got along kind of from the jump super well, Levine says. I love Queen and obviously I love Kelly. So it was just easy and fun. The easy chemistry translates into the competition itself, where Levine notes that the four coaches are all fiercely competitive, but without the kind of animosity that can sometimes come with fighting over artists. We were all really competitive, but in such a respectful way, he says. I really respect the guys I m working with. I love this foursome. It s really great. That doesn t mean the competition isn t intense. We fought hard, Levine says. Like, you know, it gets your heart beating fast and you re competing [at the end of the day]. There s no doubt about that, but it s all done with respect and lov", "date_str": "2026-11-02T16:00:00+00:00", "hash": "67b03950a7aea7b3", "title_fa": "آدام لوین در فیلم The Voice در کات ویک هفته صحبت می‌کند و رایلی گرین را «بلیک جوان‌تر، خنده‌دارتر و خوش‌نظرتر» می‌خواند.", "summary_fa": "آدام لوین آنقدر روی صندلی های قرمز بزرگ The Voice نشسته است تا به یاد بیاورد که چه زمانی کاملاً عجیب به نظر می رسیدند. لوین به بیلبورد می گوید وقتی ما این نمایش را شروع کردیم، صدایی وجود نداشت. این قالب قبلاً به موفقیت بزرگی در خارج از کشور در هلند تبدیل شده بود، اما زمانی که نمایش به ایالات متحده آمد، حتی مربیان هم مطمئن نبودند که وارد چه چیزی می شوند. به یاد دارم روز اولی که فکر می کردیم، این صندلی های بزرگ قرمز و احمقانه چیست و ما باید چه کار کنیم؟ The Voice مرتبط: Mower Cade Turn Four-Cair Turn Cade Mower بعد از دور نبرد ادامه می دهد برندگان The Voice: کدام مربی خواننده هر فصل برنده می شد؟ آدام لوین توسط کاور Black Sabbath در The Voice پخش می شود The Voice اکنون در سی امین فصل خود است و آن صندلی ها یکی از شناخته شده ترین قطعات در تلویزیون موسیقی هستند و لوین در یکی از آنها بازگشته است. برای فصل 30، لوین به کلی کلارکسون مربی بازگشته و رایلی گرین و کوئین لطیفه برای اولین بار مربیان برای دوره جدیدی از The Voice می‌پیوندد، که شامل پیچ و تاب هفته Cut است که از قسمت امشب d on Jan. 21. The 17th annual Hollywood Music in Media Awards (HMMA) will be held on Wednesday, Nov. 18 at the historic Avalon Hollywood in Hollywood. Composers Daniel Pemberton and Mina Samy received the most individual nominations with four each. Pemberton is nominated for his scores for the films Project Hail Mary and The Drama , the series Slow Horses, and for the song “Let Me Sell You a Dream” from Musk, which he co-wrote with David Byrne. Samy is nominated for his scores for the film Ezma and the short film Stopped and received nods for both the score and main title theme for the foreign-language TV series The Death Ward . Legendary songwriter Diane Warren received a nomination for “One Right Here” from Maserati: The Brothers , performed by Andrea Bocelli and Jennifer Hudson . Last year, Warren won her second HMMA for song documentary film for “Dear Me” from Diane Warren: Relentless, which also won an HMMA for documentary. The films Behemoth!, The Odyssey, Michael, Brother Verses Brother and Linda Perry: Let It Die Here received the most nominations, with three each. The HMMAs honor composers, songwriters, music supervisors and artists for outstanding contributions to music in film, television, video games, and other visual media. Last year, HMMA winners included “Golden” from K-Pop Demon Hunters and the original score for Sinners ; both went on to win Oscars. Special performances at the Nov. 18 s", "date_str": "2026-11-02T16:00:00+00:00", "hash": "6828de228506aa17", "title_fa": "تیلور سوئیفت و جک آنتونوف و لودویگ گورانسون نامزدهای موسیقی هالیوود در جوایز رسانه: فهرست کامل", "summary_fa": "من آن را می دانستم، تو را می شناختم» که تیلور سویفت و جک آنتونوف برای داستان اسباب بازی 5 نوشتند، نامزد آهنگ – فیلم انیمیشن در جوایز هالیوود موسیقی در رسانه ها (HMMA) 2026 است. لودویگ گورانسون برای کارش در The Odyssey سه جایزه دریافت کرد - یکی برای موسیقی، یکی برای آهنگ \"When I'm Home\" (نوشته شده با نامزدهای دیگر جیمز بلیک، تراویس اسکات و کریستوفر نولان)، و یکی برای موزیک ویدیوی آهنگ. سال گذشته، گورانسون دو جایزه HMMA را برای کارش در فیلم گناهکاران دریافت کرد و در ادامه هر دو جایزه اسکار و گلدن گلوب را برای بهترین موسیقی اورجینال دریافت کرد. تصور می‌شود که «I Knew It, I Knew You» و The Odyssey به ترتیب نامزدهای دریافت جایزه اسکار برای بهترین آهنگ اصلی و بهترین موسیقی متن هستند، اگرچه راه طولانی در پیش است. مربوط به داستان اسباب بازی 5 اولین نمایش جهانی: دوئت دوستانه تیلور سویفت رندی نیومن، لحظات جادویی بیشتر جوایز هالیوود موسیقی در رسانه (HMMA) فهرست نامزدهای سال 2026 خود را برای موسیقی و آهنگ در دسته های فیلم و سایر رسانه های تصویری در روز دوشنبه (2 نوامبر) اعلام کرد. تقریباً سه ماه قبل از مراسم سالانه موسیقی در 1 ژانویه، نامزدی سالانه موسیقی هالیوود در 1 ژانویه اعلام شد. جوایز (HMMA) چهارشنبه 18 نوامبر در سالن تاریخی آوالون هالیوود در هالیوود برگزار می شود. آهنگسازان دانیل پمبرتون و مینا سامی هر کدام با چهار نامزدی بیشترین نامزدی را دریافت کردند. پمبرتون برای آهنگ‌هایش برای فیلم‌های Project Hail Mary و The Drama، سریال Slow Horses، و برای آهنگ Let Me Sell You a Dream از ماسک، که با همکاری دیوید برن نوشته شده، نامزد شده است. سامی برای موسیقی‌هایش برای فیلم ازما و فیلم کوتاه متوقف شد، نامزد دریافت موسیقی متن و موضوع اصلی سریال خارجی زبان The Death Ward شد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/06/taylor-swift-jessie-toy-story-5-premiere-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۱ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "‘The Hunger Games: Sunrise on the Reaping (The Album)’ to Feature Ella Langley, Tyler Childers, Stevie Nicks & More: ‘Great Artists & Great Music’", "link": "https://www.billboard.com/music/music-news/the-hunger-games-sunrise-on-the-reaping-album-ella-langley-1236371836/", "summary": "When The Hunger Games: Sunrise on the Reaping (The Album) arrives Nov. 13 on MCA, with a slate of songs inspired by the upcoming latest film in The Hunger Games franchise, the 29-song album will feature an eclectic lineup of artists spanning rock, country, Americana, pop and more. Ella Langley joins on “Here Then We’re Gone,” with the star-studded album also featuring Stephen Wilson Jr. ( First in Line ), Stevie Nicks ( Doing The Best That I Can (Arena Mix) ), Tyler Childers (“Old Money”), The Smashing Pumpkins (“Black Stars”) and Noah Kahan (“Draw You Out”), among others. “We got to live the fantasy league of dream artists we wanted to work with,” Dave Cobb, the project s Grammy-winning executive producer, tells Billboard . “And the through line of all of it is honesty. I think people listen to music in such a varied way. So this is really all the things we love about great artists and great music.” The Lionsgate film Hunger Games: Sunrise on the Reaping will release in theaters on Nov. 20. Spearheaded by director Francis Lawrence, the film centers on 16-year-old Haymitch Abernathy from District 12, and begins the morning of the reaping for the 50th annual Hunger Games. Set 24 years prior to the events in the original Hunger Games trilogy, the movie follows Abernathy as he attempts to put a stop to the Hunger Games from inside the arena. Accordingly, the soundtrack weaves in a myriad of emotional profiles. “The record has so many layers. It has triumph, sadness, and it has loss and it has love,” Cobb says. “I think that s the way we looked at everything, songs that would fit every emotion that the movie has. Definitely, we talked to some of the artists about what we were looking for. Most of the artists, they loved the franchise already. They d read the book. It was incredible to see how excited people were.” Some artists, like Noah Cyrus (“Ash and Snow”), were inspired by specific characters from the franchise. Cobb recalled that Gigi Perez ( Favor ) was the first to send in music for the project. Gigi Perez was the first person we got a song back from, and she had been such a massive fan [of The Hunger Games ], knew every detail, Cobb recalls. One of the many highlights for Cobb on the album لد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۱ آبان • ۱۹:۳۰"}, {"source": "Variety", "title": "Daddy Yankee Partners with aTwist and Visa for Original Microseries to Promote His Album ‘La Postal’", "link": "https://variety.com/2026/music/news/daddy-yankee-la-postal-atwist-visa-youtube-microseries-1236936398/", "summary": "Global reggaeton star Daddy Yankee has joined forces with vertical media studio aTwist and Visa to launch an original microseries “La Postal: Written in the Dance” to promote his latest album. The microseries will be released on Daddy Yankee’s YouTube channel and on aTwist on Nov. 3. The series is designed as a cinematic extension [ ]", "date_str": "2026-11-02T16:00:00+00:00", "hash": "7be2711321527dff", "title_fa": "Daddy Yankee با aTwist و Visa برای Microseries Original شریک می شود تا آلبوم La Postal خود را تبلیغ کند.", "summary_fa": "بابا یانکی، ستاره جهانی رگیتون، با استودیوی رسانه عمودی aTwist و Visa به نیروها پیوست تا یک میکروسریال اصلی \"La Postal: Written in the Dance\" را برای تبلیغ آخرین آلبوم خود راه اندازی کند. این میکروسریال در کانال یوتیوب Daddy Yankee و در 3 نوامبر در aTwist منتشر خواهد شد. این مجموعه به عنوان یک پسوند سینمایی طراحی شده است [ ] «نوشته شده در رقص» حول یک مسابقه رقص پرمخاطره می چرخد ​​که در سراسر پورتوریکو شعله ور می شود، جایی که دو عاشق سابق - اکنون با شرکای دیگر و در حال مبارزه با گروه های رقص رقیب - دوباره متحد می شوند. بابا یانکی در بیانیه‌ای گفت: «تلنوولاها نحوه تجربه نسل‌های لاتین تبار داستان‌های عشق را شکل داده‌اند. با «La Postal: Written in the Dance» می‌خواستم این سنت را در آغوش بگیرم و با استفاده از موسیقی و رقص آن را در قالبی جدید بیاورم. این ریزدرام دنیای آلبوم جدید من \"La Postal\" را از طریق داستانی عاشقانه که در سن خوان اتفاق می‌افتد، زنده می‌کند، که شامل رقص اصلی و تیمی باورنکردنی از استعدادهای محلی جوان پورتوریکو، رقصندگان، بازیگران و خلاقانی است که انرژی و اشتیاق خود را به پروژه آورده‌اند. در کنار سریال و آلبوم جدید، محتوای اضافی نیز فقط از طریق aTwist در دسترس خواهد بود، از جمله نگاهی به پشت صح می‌کند که برای زوج ثروتمند نیویورکی، نینا و اندرو وینچستر (آماندا سیفرید و برانند اسکل) کار می‌کند. در خانه آنها، او به زودی شبکه ای از فریب را کشف می کند. داستان‌های مرتبط KPop Demon Hunters، ستاره‌های بازی ماهی مرکب با دهه نتفلیکس در کره در حالی که تد ساراندوس با «وسواس» فصل ۲ را متلک می‌کند، آیا مسابقه کمدی گلدن گلوب خانه جدیدی برای تقلب در دسته‌بندی می‌شود؟ ربکا سوننشاین فیلمنامه این فیلم را نوشته است که توسط فیگ، تاد لیبرمن و لورا فیشر تهیه شده است. دنباله فیلم سینمایی «راز خدمتکار خانه» در حال تولید است و برای اکران جهانی در دسامبر سال آینده برنامه ریزی شده است. بکا برانستتر (آخر هفته پنج ستاره، آژیرها) در حال اقتباس از رمان پرفروش فریدا مک فادن است و متیو دانستر (2:22 A Ghost Story، The Hunger Games: On Stage) اقتباس بریتانیایی را کارگردانی می کند.", "image_url": "https://variety.com/wp-content/uploads/2026/02/MCDHOUS_LG041-e1771449190131.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۱۱ آبان • ۱۹:۰۶"}, {"source": "Variety", "title": "Mariah Carey Dons Fur and Shades in Gucci’s ‘All I Want for Christmas Is You’ Holiday Campaign", "link": "https://variety.com/2026/shopping/news/mariah-carey-gucci-campaign-all-i-want-for-christmas-is-you-1236937517/", "summary": "Mariah Carey is officially back on Christmas duty, and this year she s bringing Gucci along for the festivities. The luxury fashion house has tapped the self-proclaimed Queen of Christmas to star in its 2026 holiday campaign, directed by filmmaker Harmony Korine and set to Carey s perennial holiday hit, “All I Want for Christmas Is You.” [ ]", "date_str": "2026-11-02T15:24:28+00:00", "hash": "3cec031de9808741", "title_fa": "ماریا کری دونز خز و سایه در کمپین تعطیلات گوچی «همه چیزی که برای کریسمس می خواهم تو هستی» گوچی", "summary_fa": "ماریا کری رسماً به وظیفه کریسمس بازگشته است و امسال گوچی را برای جشن ها همراه می کند. این خانه مد مجلل، ملکه کریسمس خودخوانده را برای بازی در کمپین تعطیلات سال 2026 خود، به کارگردانی هارمونی کورین، فیلمساز و فیلم موفقیت آمیز همیشگی کری، \"همه چیزی که برای کریسمس می خواهم، تو هستی\" انتخاب کرده است. [ ] نقطه کریسمس توسط هارمونی کورین هلمر Spring Breakers کارگردانی شده است. اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. فیلم کمپین جدید در داخل یک هتل مجلل اتفاق می‌افتد، جایی که کارکنان مشغول آماده‌سازی برای ورود ستاره پاپ هستند. تزیینات دقیق و آماده سازی بیش از حد برای تعطیلات، صحنه را برای کری، که ظاهراً با پوشیدن قطعاتی از کلکسیون ویژه پروانه جدید گوچی، به نشانه علاقه دیرینه خواننده به حشره بالدار و آلبوم او به همین نام در سال 1997، آماده کرد. داستان‌های مرتبط KPop Demon Hunters، ستاره‌های بازی ماهی مرکب در دهه کرۀ نتفلیکس در نقش تد ساراندوس به تانتارا، همه ما مرده‌ایم فصل دوم مایکل: گلدن گلوب ارسال را رد می‌کند تا در دسته‌های کمدی/موزیکال رقابت کند. سلطنت چندین دهه در فصل تعطیلات. این دومی به بخش ویژه ای از کارنامه خواننده تبدیل شده است، با تک آهنگ او در سال 1994 \"All I Want for Christmas Is You\" تقریبا هر ماه دسامبر، بیش از سه دهه پس از انتشار، به صدر جدول بازمی گردد. در این میان کورین یک انتخاب غیر متعارف برای تبلیغات سنتی تعطیلات است.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Screenshot-2026-11-02-at-2.43.38-PM.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۱۱ آبان • ۱۸:۵۴"}, {"source": "Variety", "title": "Inside NBC News’ Bid to Break Out From Election-Night Pack", "link": "https://variety.com/2026/tv/news/inside-nbc-news-midterm-election-night-break-out-tv-1236937405/", "summary": "Tom Llamas says that on Election Night, he’ll stay up late by sipping espresso that he takes the same way he likes his news without sugar. Hard facts are likely to surface quickly as different precincts, counties and states tabulate their votes in an election that could change control of Congress. The espresso may [ ]", "date_str": "2026-11-02T15:20:00+00:00", "hash": "12d5358d9d28784e", "title_fa": "پیشنهاد NBC News برای خروج از بسته شب انتخابات", "summary_fa": "تام لاماس می‌گوید که در شب انتخابات، با نوشیدن اسپرسو تا دیروقت بیدار می‌ماند، همان‌طور که اخبارش را بدون شکر دوست دارد. حقایق سخت احتمالاً به سرعت آشکار می شوند زیرا حوزه ها، شهرستان ها و ایالت های مختلف آرای خود را در یک انتخابات جدول بندی می کنند که می تواند کنترل کنگره را تغییر دهد. اسپرسو ممکن است [ ] در مجموع، NBC 13 ساعت پوشش خبری انتخابات را فقط در تلویزیون، از ساعت 5 بعد از ظهر، پخش خواهد کرد. زمانی که جکسون پوشش خبری را آغاز می کند و تا ساعت 6 صبح ادامه می یابد. با حضور کریگ ملوین و کیت اسنو در ساعات اولیه صبح. این نوع تناژ محض معمولاً برای رقابت های ریاست جمهوری در نظر گرفته می شود. لاماس که هر روز چندین جلسه مطالعه برگزار می‌کند تا مطمئن شود از عواملی که ممکن است بر نحوه رأی‌دهی ایالت‌های مختلف تأثیر بگذارد، می‌گوید: «این زمانی است که بینندگان بیشترین نیاز را به ما دارند. او در یک مصاحبه اخیر می‌گوید: «این یکی از مهم‌ترین شغل‌های ماست، اگر نگوییم مهم‌ترین شغل». مارک گرینشتاین، معاون اجرایی NBC News که بر بسیاری از عناصر مرتبط با پخش انتخابات نظارت می‌کند، می‌گوید: «بدیهی است که افراد زیادی در حال حاضر محتوای زیادی تولید می‌کنند، اما ما سطحی از اعتبار و مقیاس داریم. NBC می تواند در دورانی که بسیاری از شرکت های رسانه سنتی با مالکیت جدید دست و پنجه نرم می کنند، به دنبال دستیابی به زمین جدید باشد. CBS News و CNN اکنون بخشی از Skydance هستند، جایی که حامیان روزنامه نگاری به حرکت های خانواده کنترل کننده الیسون در اطراف CBS با شک و تردید نگاه می کنند. MS NOW با استفاده از نامی که تنها یک سال از عمر آن می گذرد، از NBCU جدا شده و اکنون بخشی از شرکت رسانه", "image_url": "https://variety.com/wp-content/uploads/2026/10/NBC-News-Tom-Llamas-Steve-Kornacki-Kristen-Welker.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۱ آبان • ۱۸:۵۰"}, {"source": "Variety", "title": "Can Abuse Allegations Against a Celebrity Be Silenced Over Mental Health Claims? A Defamation Lawyer Explains the Unusual Case Gripping the U.K.", "link": "https://variety.com/2026/global/global/anonymous-celebrity-abuse-allegations-uk-court-explained-1236936658/", "summary": "As has been widely reported on both side of the Atlantic, a well-known individual in the U.K. is currently waiting to hear whether his legal effort to block two media outlets from publishing allegations of inappropriate and exploitative sexual activity with girls and young women has been successful. Lawyers for the individual — who denies the [ ]", "date_str": "2026-11-02T15:09:26+00:00", "hash": "819afc41865db633", "title_fa": "آیا می توان اتهامات سوء استفاده علیه یک سلبریتی را نسبت به ادعاهای مربوط به سلامت روان ساکت کرد؟ یک وکیل افترا درباره پرونده غیرمعمولی که در بریتانیا گرفتار شده است توضیح می دهد", "summary_fa": "همانطور که به طور گسترده در دو طرف اقیانوس اطلس گزارش شده است، یک فرد شناخته شده در بریتانیا در حال حاضر منتظر است تا بشنود آیا تلاش قانونی او برای جلوگیری از انتشار اتهامات جنسی نامناسب و استثمارگرانه با دختران و زنان جوان توسط دو رسانه موفق بوده است یا خیر. وکلای این فرد - که [ ] را انکار می کند، استدلال تیم حقوقی استدلالی است که خودشان اذعان کرده اند که بسیار استثنایی است - که انتشار اتهامات علیه فرد و افشای هویت او به احتمال زیاد او را به خودکشی سوق می دهد. این پرونده غیرمعمول در میان گمانه زنی های گسترده در رسانه های اجتماعی در مورد هویت افراد مشهور به کانون اصلی بحث در بریتانیا تبدیل شده است. اما آیا این استدلال - این که انتشار یک تأثیر بالقوه کشنده خواهد داشت - واقعاً از نظر قانونی پابرجاست؟ به گفته پل توید - یک وکیل مشهور افترا از ایرلند شمالی که وکالت تعدادی از مشتریان مشهور از جمله هریسون فورد، بریتنی اسپیرز، جنیفر لوپز و جاستین تیمبرلیک را داشته است. توید اذعان می‌کند که چنین احکام حفظ حریم خصوصی افراد مشهور، که زمانی در رسانه‌های بریتانیا بدنام بود (اغلب از آنها به عنوان دستورات فوق‌العاده یاد می‌شد، اگرچه این، از نظر فنی، گزارش در مورد وجود خود دستور را نیز ممنوع می‌کند)، به امری نادر تبدیل شده است. اما او می گوید که ادعای حقوقی این فرد در دادگاه قابل قبول است. او ادعا می کند که تهدید جانی، در صورت وجود خطر واقعی خودکشی، یکی از معدود دلایل اصلی است که برای حکمی مانند این در دنیای امروز باقی مانده است. اما این باید توسط یک روانپزشک صالح و هر گونه حمایت پزشکی دیگری که دادگاه به آن نیاز دارد تأیید شود.", "image_url": "https://variety.com/wp-content/uploads/2026/11/GettyImages-2285045132.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۱ آبان • ۱۸:۳۹"}, {"source": "Variety", "title": "Dominic West, John Cleese, Portia de Rossi Join Jeff Daniels in Trudie Styler’s Comedy ‘The Reception’ (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/dominic-west-john-cleese-trudie-stylers-the-reception-1236937454/", "summary": "Dominic West (“The Crown”), John Cleese (“A Fish Called Wanda”) and Portia de Rossi (“Arrested Development”) have joined Jeff Daniels in “The Reception,” Trudie Styler s ensemble comedy. Beta Cinema is launching international sales on the project at the American Film Market, which kicks off Nov. 10. CAA is representing domestic rights. The cast also includes [ ]", "date_str": "2026-11-02T15:07:04+00:00", "hash": "3f0eb58d4b5f8b44", "title_fa": "دومینیک وست، جان کلیز، پورتیا د روسی به جف دانیلز در کمدی «پذیرایی» اثر ترودی استایلر (اختصاصی) می‌پیوندند.", "summary_fa": "دومینیک وست («تاج»)، جان کلیس («ماهی به نام واندا») و پورتیا دی روسی («توسعه دستگیر شده») به جف دانیلز در «پذیرایی»، کمدی گروه ترودی استایلر پیوستند. سینمای بتا فروش بین‌المللی این پروژه را در بازار فیلم آمریکا آغاز می‌کند، که از 10 نوامبر آغاز می‌شود. CAA نماینده حقوق داخلی است. بازیگران همچنین شامل [ ] سینمای بتا فروش خود را در بازار فیلم آمریکا راه اندازی خواهد کرد، در حالی که CAA نماینده حقوق داخلی است. دومینیک وست («تاج»)، جان کلیس («ماهی به نام واندا») و پورتیا دی روسی («توسعه دستگیر شده») به جف دانیلز در «پذیرایی»، کمدی گروه ترودی استایلر پیوستند. برونسون پینچوت (پلیس بورلی هیلز)، نیکلاس موری (با مامور من تماس بگیرید)، آلیت راس (السینور)، الیوت سامنر (حس و حس)، لوئیس فلمینگ، ویل مریک (پوست)، باربارا مارتن (دانیل دی سینار) و دانیل دی انگلند، و دانیل دِنِسیار: داستان‌های مرتبط با «وسواس»، آیا مسابقه کمدی گلدن گلوب خانه جدیدی برای تقلب در دسته‌بندی است؟ KPop Demon Hunters به ​​زودی در برنامه بازی Toca Boca World که در یک ملک بزرگ اسکاتلندی تنظیم شده است، \"The Reception\" یک جشن عروسی را دنبال می کند که با وجود غیبت عروس و داماد برگزار می شود. پس از اینکه فلیکس ویکتوریا را در محراب رها می‌کند، خانواده‌ها و دوستان آن‌ها مجبور می‌شوند یک پذیرایی عجیب و غریب را انجام دهند که به سرعت از کنترل خارج می‌شود. در حالی که مهمانان تلاش می کنند تا ظاهر خود را حفظ کنند، جشن ها جای خود را به مجموعه ای از بلایا، حوادث کمیک و ارتباطات غیرمنتظره می دهند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Berlin-International-Filmfestival-Berlinale-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "سینما و سریال", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۱۱ آبان • ۱۸:۳۷"}, {"source": "Billboard", "title": "Emilia Talks New Era, ‘Bodypainting’ Song, Her Next Album & How Zara Larsson Collab ‘Girl’s Girl’ Happened | Cafecito Con", "link": "https://www.billboard.com/video/emilia-bodypainting-next-album/", "summary": "Emilia sits down with Billboard News over coffee in Miami to talk about her new single “Bodypainting,” the pressure of leveling up after MP3 , and what fans can expect from her next album era. She also shares how her collab with Zara Larsson, “Girl s Girl (Girls Trip), came together, reflects on performing at Coachella with Luísa Sonza, and explains why Miami has become a key place for studio sessions and finishing album details. Plus, Emilia opens up about staying grounded in Nogoyá, Argentina, her fitness routine as therapy, fashion week moments and answers unexpected “Hot Coffee Pot” questions—like whether she gets jealous and if she uses a hotel alias. Emilia You don t know. We got an email from Zara Larsson s team that wants to do a song with you and me [laughs] What? No. Wow. I don t know if you re sure about this information you re giving me. Don t get my hopes up. Jessica Roiz Hi, friend, how are you? It s been so long. Emilia Very well, and you? Jessica Roiz So happy to be catching up here over a little coffee. Emilia Me too. Jessica Roiz I see you with your flow. We re here today at Studio 24 Coffee. First time I ve been here. Emilia Me too. Jessica Roiz [laughs] OK. Welcome. Emilia I want to say a matcha girl. Emilia Jessica Roiz Matcha girl. [they laugh] Emilia I got into that, I got in. What do you want? I think are you for coffee or for matcha? Jessica Roiz I m going to try the tiramisu latte. Emilia Me too. Jessica Roiz But can you make it skinny? Cashier Yes, of course. Emilia Very good choice. I m going to go a bit more traditional, I think. Um, the iced matcha latte. Cashier Yes. Emilia Can it be with oat milk? Cashier Of course. Emilia Perfect. Cashier Right away, I ll bring them to you. Emilia Jessica Roiz Thank you so much. Watch the full video above!", "date_str": "2026-11-02T15:00:00+00:00", "hash": "3a9bf6168659c72a", "title_fa": "Emilia Talks New Era، آهنگ «Bodypainting»، آلبوم بعدی او و چگونه Zara Larsson Collab «Girl's Girl» اتفاق افتاد | Cafecito Con", "summary_fa": "امیلیا در میامی با بیلبورد نیوز سر خوردن قهوه می نشیند تا در مورد تک آهنگ جدیدش «Bodypainting»، فشار بالا رفتن سطح بعد از MP3 و آنچه طرفداران می توانند از دوره آلبوم بعدی او انتظار داشته باشند صحبت کند. او همچنین به اشتراک می گذارد که چگونه همکاری خود با زارا لارسون، \"Girl s Girl (Girls Trip) گرد هم آمد، درباره اجرای کواچلا با لوئیزا سونزا فکر می کند، و توضیح می دهد که چرا میامی به مکانی کلیدی برای جلسات استودیو و تکمیل جزئیات آلبوم تبدیل شده است. به علاوه، امیلیا در مورد ماندن در نوگویا، آرژانتین، برنامه تناسب اندام خود به عنوان درمان، لحظات هفته مد و پاسخ به سؤالات غیرمنتظره «قهوه داغ» صحبت می کند - مانند اینکه آیا حسادت می کند و آیا از نام مستعار هتل استفاده می کند یا خیر. امیلیا تو نمی دانی ما یک ایمیل از تیم زارا لارسون دریافت کردیم که می‌خواهد با من و شما آهنگی بسازد [می‌خندد] چه؟ نه عجب نمی دانم در مورد این اطلاعاتی که به من می دهید مطمئن هستید یا خیر. امیدم را از دست نده جسیکا رویز سلام، دوست، خوبی؟ خیلی طولانی شده امیلیا خیلی خوب، و شما؟ جسیکا رویز خیلی خوشحالم که با یک قهوه به اینجا می رسم. امیلیا من هم همینطور جسیکا رویز من شما را با جریان خود می بینم. ما امروز اینجا در استودیو 24 قهوه هستیم. اولین بار است که اینجا هستم امیلیا من هم همینطور جسیکا رویز [با خنده] باشه. خوش آمدید. امیلیا می خواهم بگویم یک دختر ماچا. امیلیا جسیکا رویز ماچا دختر. [می خندند] امیلیا من وارد آن شدم، وارد شدم. چه می خواهی؟ فکر کنم قهوه میخوری یا ماچا؟ جسیکا رویز من قصد دارم لاته تیرامیسو را امتحان کنم. امیلیا من هم همینطور جسیکا رویز اما آیا می توانید آن را لاغر کنید؟", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Cafecito-Con-Thumbnails-Emilia-1920x1080-V2.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۱ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "My Chemical Romance’s ‘The Black Parade’ at 20: Every Track Ranked", "link": "https://www.billboard.com/lists/my-chemical-romances-the-black-parade-best-songs-ranked/", "summary": "Where do we go when we die? The pharaohs thought we’d need our earthly possessions, so they got buried along with them; today, surveys suggest a solid third of Americans believe in ghosts. My Chemical Romance frontman Gerard Way thought death transported us to a poignant moment from our lives — like when his father took him into the city to see a marching band. When My Chemical Romance — Way, his bassist brother Mikey, guitarists Frank Iero and Ray Toro, and drummer Bob Bryar — released The Black Parade on October 23, 2006, they were emo up-and-comers seeking to be the world’s greatest rock band. They were fresh off playing Warped Tour parking lots with Fall Out Boy, and opening arenas for Green Day while they toured on their smash rock opera, American Idiot . To follow their 2004 breakthrough Three Cheers for Sweet Revenge , the Jersey quintet escaped to L.A. s long-rumored-to-be-haunted Paramour Mansion with Idiot producer Rob Cavallo to record their magnum opus. Commercially, The Black Parade performed well: It sold 240,000 copies its opening week, but ultimately finished second on the Billboard 200 to the Hannah Montana soundtrack’s 281,000. But this week, two decades later, My Chemical Romance finishes the job by reaching the top of the Billboard 200 (on the chart dated Nov. 6) for the first time. Their 20th anniversary deluxe edition of The Black Parade (released Oct. 23 on Reprise) propels the set to No. 1, backed by an ongoing reunion tour that’s earned them an army of new fans. There’s a strong argument that MCR is even bigger today than at their MySpace-era apex. Let’s have some fun, and revisit the legacy of arguably the most resonant rock album since Nevermind . We’ve ranked all 14 original Black Parade tracks, along with the four additional B-sides included on the 2026 re-release.", "date_str": "2026-11-02T14:27:12+00:00", "hash": "72b4fd481bd215ae", "title_fa": "«رژه سیاه» از My Chemical Romance در 20: هر آهنگ رتبه‌بندی شده است", "summary_fa": "وقتی می میریم کجا بریم؟ فراعنه فکر می کردند که ما به دارایی های زمینی خود نیاز داریم، بنابراین همراه با آنها دفن شدند. امروزه، نظرسنجی‌ها نشان می‌دهد که یک سوم آمریکایی‌ها به ارواح اعتقاد دارند. جرارد وی، خواننده My Chemical Romance فکر می‌کرد که مرگ ما را به لحظه‌ای دردناک از زندگی‌مان منتقل می‌کند - مانند زمانی که پدرش او را برای دیدن یک گروه موسیقی به شهر برد. هنگامی که My Chemical Romance - Way، برادر بیس‌اش Mikey، گیتاریست‌ها Frank Iero و Ray Toro، و درامر Bob Bryar - The Black Parade را در 23 اکتبر 2006 منتشر کردند، آن‌ها افراد ایمویی بودند که به دنبال تبدیل شدن به بزرگترین گروه راک جهان بودند. آن‌ها تازه به بازی در پارکینگ‌های Warped Tour با Fall Out Boy، و باز کردن عرصه‌هایی برای Green Day مشغول بودند، در حالی که در اپرای راک خود، American Idiot، تور می‌کردند. برای دنبال کردن موفقیت خود در سال 2004، سه تشویق برای انتقام شیرین، گروه پنج نفری جرسی به همراه راب کاوالو، تهیه‌کننده احمق، به عمارت پارامور که مدت‌ها شایعه شده بود در لس‌آنجلس گریختند تا کارهای بزرگ خود oney Deluge", "link": "https://www.rollingstone.com/politics/politics-features/elon-musk-dark-money-texas-senate-race-1235651216/", "summary": "The richest man in the world dumped more than $400 million into the 2026 midterms. Will it buy him a win?", "date_str": "2026-11-02T15:00:15+00:00", "hash": "a7986e31cdae1d6e", "title_fa": "\"پول با چمدان می آید\": چگونه دمکرات تگزاس در برابر طوفان تاریک پول ایلان مقاومت می کنند", "summary_fa": "ثروتمندترین مرد جهان بیش از 400 میلیون دلار در میان دوره ای 2026 سرمایه گذاری کرد. آیا برای او برنده خواهد شد؟ برای ماه‌ها، جمهوری‌خواهان می‌دانستند که یک راه برای جلوگیری از موج آبی در انتخابات میان‌دوره‌ای ۲۰۲۶ دارند. دموکرات ها در نظرسنجی، در افکار عمومی، در مشخصات نامزدها و بسیج رای دهندگان برتری دارند. اما حزب جمهوری خواه، همانطور که اغلب انجام می دهد، پول دارد. چند هفته پیش یکی از حامیان جمهوری خواه به من گفت: \"ماسک پول را خرج خواهد کرد.\" او اشتباه نمی‌کرد: در چرخه سال 2026، ایلان ماسک، اهداکننده بزرگ جمهوری‌خواه، بیش از 400 میلیون دلار در رقابت‌های سراسری کاهش داد که 158 میلیون دلار از آن به سمت ابر PAC‌های حمایتی از حریف تالاریکو، دادستان کل تگزاس، کن پکستون، خرج شد. اما اکنون، در آستانه انتخابات، مشاوران دموکرات فکر می‌کنند که بهترین روش ماسک در خارج کردن آنها از رقابت ناکام مانده است. آنها می گویند، به نظر نمی رسد که پول سیاه تالاریکو را دفن کرده باشد - و به نظر می رسد سایر نامزدها در سراسر کشور نیز در مواجهه با هجوم هزینه های محافظه کارانه خود را حفظ کرده اند. لوک وارفورد، استراتژیست دموکرات تگزاس و یکی از بنیانگذاران صندوق زیرساخت دموکراتیک آگاو، می گوید: «تا جایی که می توانیم احساس خوبی داریم. با این حال، مت آنگل، مدیر پروژه ستاره تنها، یک گروه استراتژی دموکرات، می‌گوید حجم انبوه نقدینگی یک نگرانی فوری بود. آنگل می گوید: «من هم مثل بقیه نگران آن بودم. هیچ کدام از ما توهمی نداشتیم که به اندازه جمهوری خواهان داشته باشیم.»", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/elon-musk-dark-money.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "
