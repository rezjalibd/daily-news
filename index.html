he same year. With 14 wins and 63 career nominations to date, Swift is going into the 2027 awards — which will take place on Feb. 7 at Crypto.com Arena in Los Angeles with a total of five nods. Her 15-week Billboard 200 -topping LP The Life of a Showgirl is in the race for AOTY, while The Fate of Ophelia and Toy Story 5 soundtrack contribution I Knew It, I Knew You both of which spent multiple weeks at No. 1 on the Billboard Hot 100 will compete for record of the year and song of the year, respectively. The Eras Tour headliner is also up for best pop duo/group performance thanks to her Sabrina Carpenter duet “The Life of a Showgirl, as well as best song written for visual media for “I Knew It, I Knew You, a co-write with frequent collaborator Jack Antonoff that s also been garnering Oscar buzz. Swift won her first Grammys back in 2010, taking home best country song and best female country vocal performance for White Horse, as well as best country album for Fearless . That same year was also the first time she was nominated for album, song and record in the same year, ultimately winning the album award with her sophomore full-length, but losing both song categories with You Belong With Me. Six years later, Swift would earn spots in the three major races again, winning AOTY for 2014 blockbuster 1989 but losing song and record of the year for Blank Space. She saw the same results in 2024 when she took home album for Midnights but lost song and record for Anti-Hero. In 2025, she was again nominated for the trio with The Tortured Poets Department and Post Malone duet Fortnight, but did not win. Her latest feat isn t the first time she s broken Grammys ground, though. She is the only person who has ever won AOTY four times, and up until Billie Eilish s win in 2020, Swift was also the youngest person to ever win the prize. This year, Swift s ma", "date_str": "2026-11-16T16:43:00+00:00", "hash": "a761012d2e0d5c0d", "title_fa": "تیلور سوئیفت با 5 سال نامزدی در رده های اصلی، رکورد جدید گرمی را به نام خود ثبت کرد.", "summary_fa": "نمایش جایزه برای چند ماه نیست، اما تیلور سویفت قبلاً تاریخ گرمی را در سال 2027 ثبت کرده است. مرتبط نامزدهای گرمی 2027 RAYE Rosalía به عنوان زنان تاریخ ساز نامزدهای گرمی 2027: لیست کامل را مشاهده کنید تیلور سویفت برای اجرا در مراسم CMA1 برای اولین بار در مراسم سال بعد در روز دوشنبه اعلام شد. (16 نوامبر)، نشان می دهد که سوپراستار پاپ یک بار دیگر برای آلبوم، ضبط و آهنگ سال در همان سال آماده است. این پنجمین باری است که او این کار را انجام می دهد و رکورد جدیدی را برای بیشترین دفعاتی که هر هنرمندی تا به حال در سه دسته بزرگ همه ژانر در یک سال سر زده است، ثبت می کند. سوئیفت با 14 پیروزی و 63 نامزدی شغلی تا به امروز، به جوایز 2027 می رود - که در 7 فوریه در Crypto.com Arena در لس آنجلس با مجموع پنج نوبت برگزار می شود. آلبوم 15 هفته‌ای او که برترین آلبوم بیلبورد 200 را به نام «زندگی یک دختر نمایشگر» دارد در رقابت برای AOTY است، در حالی که سهم موسیقی متن The Fate of Ophelia و Toy Story 5 I Knew It, I Knew You که هر دو چندین هفته در رتبه 1 بیلبورد Hot 100 حضور داشتند، به ترتیب برای آهنگ سال رقابت خواهند کرد. تیتر لاین تور Eras همچنین به لطف دوئت سابرینا کارپنتر «زندگی یک دختر نمایشی» و همچنین بهترین آهنگ نوشته شده برای رسانه های تصویری برای «I Knew It, I Knew You» که با همکار مکرر جک آنتونوف نوشته شده بود، برای بهترین اجرای موسیقی پاپ یا گروهی قرار دارد. سوئیفت اولین جایزه گرمی خود را در سال 2010 برنده شد و بهترین آهنگ کانتری و بهترین اجرای کانتری زن برای اسب سفید و همچنین بهترین آلبوم کانتری برای Fearless را به خانه برد. در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/02/P101EK5W-e1770405149962.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۲۰:۱۳"}, {"source": "Billboard", "title": "Beyoncé Makes History As First Artist With 100 Grammy Nominations", "link": "https://www.billboard.com/music/awards/beyonce-history-first-artist-100-grammy-nominations-1236382979/", "summary": "Beyoncé passed a major milestone on Monday morning (Nov. 16) when she became the first artist in history to land 100 lifetime Grammy nominations. When the full list for the 2027 nominees was announced, Queen Bey found herself crossing into historic territory when the B Day 20th anniversary reissue bonus track, Morning Dew (Donk), snagged a nomination for best R B solo performance. The previously unreleased song that was released on July 4 was co-written by Bey, Pharrell Williams, The-Dream and Darius Dixon and produced by the singer and Pharrell. It will face competition in the best R B solo performance category from Kehlani ( Out the Window ), Victoria Monét ( Let Me ), Jill Scott ( Pressha ) and Tems ( What You Need ). In addition to be the most-awarded artist in Grammy history with 35 wins to date — surpassing late conductor Georg Solti s 32 Grammys — Beyoncé is well ahead in the most-nominations category, safely in front of husband Jay-Z at 89 (with 25 wins), Paul McCartney at 86 (with 19 wins), producer Quincy Jones at 80 (with 28 wins) and Star Wars composer John Williams at 79 (with 27 wins). Queen Bey also set the high bar for most nominations in a year she she earned 11 noms for her Cowboy Carter album at the 2025 Grammy Awards. Her three wins at the 2025 Grammys boosted her total to date to 35, making her the most-honored Grammy winner ever, among female musicians and all artists overall. In 2025, Cowboy Carter also early Beyoncé her first album of the year win, as well as her first best country album trophy. This year s Grammy nominees are led by RAYE, who tied Beyoncé s record of 11 nominations by a woman in one year. Also, for the first time in Grammy history, all six artists with the most nominations are all women, with RAYE joined by Rosalía with nine, then Phoebe Bridgers , Miranda Lambert , Ella Langley and Olivia Rodrigo with seven each.", "date_str": "2026-11-16T16:26:56+00:00", "hash": "5ee05cd96d0fe2a9", "title_fa": "بیانسه با 100 نامزدی جایزه گرمی به عنوان اولین هنرمند تاریخ ساز شد", "summary_fa": "بیانسه صبح روز دوشنبه (16 نوامبر) زمانی که اولین هنرمند تاریخ شد که 100 نامزدی مادام‌العمر جایزه گرمی را کسب کرد، یک نقطه عطف مهم را پشت سر گذاشت. وقتی فهرست کامل نامزدهای 2027 اعلام شد، ملکه بی خود را در حال عبور از قلمروی تاریخی دید که آهنگ جایزه بازنشر سالگرد بیستمین سالگرد B Day، Morning Dew (دانک)، نامزد بهترین اجرای انفرادی R B شد. آهنگی که قبلا منتشر نشده بود که در 4 جولای منتشر شد توسط Bey، Pharrell Williams، The-Dream و Darius Dixon نوشته شده بود و توسط خواننده و Pharrell تهیه شده بود. در بخش بهترین اجرای انفرادی R B از کهلانی (از پنجره)، ویکتوریا مونه (بگذارم)، جیل اسکات (پرسشا) و تمز (آنچه تو نیاز داری) با رقابت روبرو خواهد شد. بیانسه علاوه بر این که با 35 بار برنده شدن تا به امروز پر جایزه ترین هنرمند تاریخ گرمی است - پیشی گرفتن از 32 گرمی رهبر ارکستر فقید جورج سولتی - بیانسه در رده بیشترین نامزدی به خوبی جلوتر است، با خیال راحت در مقابل همسر جی زی در 89 سالگی (با 25 برنده)، پل مک کارتنی (تهیه کننده 896 جونزی) 28 برد) و جان ویلیامز آهنگساز جنگ ستارگان در 79 سال (با 27 برد). ملکه بی همچنین در سال 11 نامزدی را برای آلبوم کابوی کارتر خود در جوایز گرمی 2025 به دست آورد. سه برد او در گرمی 2025، مجموع او را تا به امروز به 35 رساند و او را به پرافتخارترین برنده گرمی تاریخ، در میان نوازندگان زن و به طور کلی همه هنرمندان تبدیل کرد. در سال 2025، کابوی کارتر همچنین اولین آلبوم سال خود و همچنین اولین جایزه بهترین آلبوم کانتری بیانسه را برنده شد. نامزدهای جایزه گرمی امسال توسط RAYE رهبری می‌شوند که رکورد بیانسه را با 11 نامزدی توسط یک زن در یک سال به دست", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/P10783DB-e1785772703344.jpg?w=1024", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۹:۵۶"}, {"source": "Billboard", "title": "Rosalía, Shakira & More: These Are the Latino Artists Nominated for the 2027 Grammys", "link": "https://www.billboard.com/music/latin/rosalia-shakira-latino-artists-nominated-2027-grammys-1236382976/", "summary": "Less than a week after emerging as one of the biggest winners at the Latin Grammys, Rosalía is making history at the Grammys as one of the most nominated artists for the 2027 edition. The Spanish superstar received nine nominations on Monday (Nov. 16) for her acclaimed LUX , including album of the year, as well as song of the year and record of the year for “Berghain” featuring Björk and Yves Tumor. She becomes the the first Hispanic woman and the second Latin artist to achieve this milestone, following Bad Bunny, who last year became the first to be nominated in all three major categories. The Puerto Rican superstar went on to win the night s top honor, album of the year, for DeBÍ TiRAR MáS FOToS , a victory that mirrored his Latin Grammy victory in the same category. Last Thursday, Rosalía also won that latter accolade for LUX (as well as song of the year for La Perla featuring Yahritza y Su Esencia). Related Grammy Nominations 2027: See the Complete List RAYE Rosalía Lead 2027 Grammy Nominations as Women Make History Rosalía and Milo J Sweep the 2026 Latin Grammys: Full List of Winners With her eclectic production — recorded with the London Symphony Orchestra and featuring songs richly layered both musically and lyrically, sung in 13 different languages — Rosalía not only redefined what a pop album can be; she also reached new vocal heights with an impressive operatic performance. On Monday, she was nominated in categories as diverse as best pop solo performance for “Sauvignon Blanc,” best alternative music performance for “Reliquia,” best global music performance for “Porcelana” featuring Dougie F, and best Latin song for La Perla. Also in the main categories, Mexican hitmaker Edgar Barrera received his fourth nomination for songwriter of the year, non-classical, this time for writing or cowriting hits for artists including Gracie Abrams, Rauw Alejandro, Karol G, Carín León and Peso Pluma. He is, once again, the only nominee for the award for writing songs in Spanish. Last Thursday (Nov. 12), after winning the equivalent recognition three consecutive years at the Latin Grammys erla نامزد شد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Rosalia-2026-Latin-Grammys-gettyimages.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۹:۵۱"}, {"source": "Billboard", "title": "Morgan Wallen, Garth Brooks, Taylor Swift & More Artists With Most Weeks at No. 1 on Top Country Albums Chart: Full List", "link": "https://www.billboard.com/lists/top-country-albums-number-ones-biggest/", "summary": "Morgan Wallen ’s I m the Problem leads Billboard s Top Country Albums chart (dated Nov. 21) for the 53rd nonconsecutive week. This ups Wallen s career tally of weeks at No. 1 to 239, allowing him to extend his lead as the artist with the most weeks at No. 1 in the chart s 62-year history. Wallen’s achievement is especially impressive because he has amassed this hefty total of weeks at No. 1 in such a short amount of time. He first topped the chart a little more than six years ago on Aug. 15, 2020. I m the Problem is Wallen s third album to log a full year at No. 1 on Top Country Albums. Dangerous: The Double Album clung to the top spot for 97 weeks from 2021-23. One Thing at a Time led for 87 weeks from 2023-25. No other artist has spent 52 weeks on top with one album, much less three. Top Country Albums originated as Hot Country Albums in the Jan. 11, 1964 issue of Billboard . Johnny Cash ’s Ring of Fire (The Best of Johnny Cash) headed the inaugural chart. The compilation was well-timed: “Ring of Fire” had headed Hot Country Songs for seven weeks the previous summer and had crossed over to reach the top 20 on the Billboard Hot 100. The chart was named Hot Country LP’s from 1968 to 1984, when vinyl LPs were king. Twenty-one artists have logged 50 or more weeks at No. 1 on Top Country Albums. Male solo artists dominate, as you might expect, though three female solo artists have achieved the feat, as have two groups. (One of those groups is an all-female group.) Only one Black artist has amassed 50 or رد و به آرامی از او بپرسد که آیا نباید روی پاسخ به توقف زمینی تمرکز کند یا خیر. همانطور که آتلانتیک می گوید، \"ترامپ اهانت کرد.\"", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Duffy-FAA.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "سینما", "سرمایه‌گذاری"], "datetime_fa": "۲۵ آبان • ۱۹:۴۹"}, {"source": "Rolling Stone", "title": "Gérard Depardieu Drops Appeal, Admits to Groping Two Women on French Film Set", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/gerard-depardieu-drops-sexual-assault-appeal-admit-guilt-1235658959/", "summary": "French actor was originally convicted in May 2025", "date_str": "2026-11-16T15:26:15+00:00", "hash": "c2656f727accc105", "title_fa": "ژرار دوپاردیو درخواست تجدید نظر را انصراف داد و پذیرفت که دو زن را در مجموعه فیلم فرانسوی مورد آزار و اذیت قرار داده است.", "summary_fa": "به گزارش لوموند، ژرار دوپاردیو، هنرپیشه فرانسوی، درخواست تجدیدنظر خود را در مورد حکم تجاوز جنسی اخیر انصراف داد و اعتراف کرد که دو زن را در یک فیلم سینمایی در سال 2021 مورد آزار و اذیت قرار داده است. دادگاه تجدید نظر دوپاردیو قرار بود امروز، ۱۶ نوامبر، در پاریس آغاز شود، اما صبح امروز، وکیل او با انتشار بیانیه ای تصمیم این بازیگر را اعلام کرد. دوپاردیو در این بیانیه اذعان کرد که «عدالت صحبت کرده است» و «من مقصر شناخته شده‌ام». او گفت که \"این جمله را می پذیرد\" و \"پای آن می ایستد.\" این بازیگر همچنین \"عذرخواهی عمیق و صمیمانه\" خود را از کسانی که \"ممکن است در نتیجه\" رفتار او متضرر شده اند، ارائه کرد. او ادامه داد: «من هرگز قصد آزار زنانی که با آنها مواجه شدم را نداشتم. اما فهمیده ام که نیت چیزی را در مورد زخم تغییر نمی دهد. تمام این ماجرا باعث رنج زیادی شده است. من قدرت این را ندارم که زمان را به عقب برگردانم.» دو زنی که دوپاردیو را متهم به دست زدن به آنها کردند، با این بازیگر در فیلم شاترهای سبز کار کردند. در دادگاه، آنها به عنوان آملی، دکوراتور و سارا، دستیار کارگردان شناخته شدند. پس از تصمیم دوپاردیو برای پس گرفتن درخواست خود، آملی به مطبوعات فرانسوی گفت: \"این پیروزی ما است و ما آن را با سر بالا می پذیریم. این نهایی است.\" سارا افزود: \"یک عنصر ناامیدی وجود دارد. ما خودمان را از نظر روانی آماده کرده بودیم... و این کناره گیری لحظه آخری ما را از بازگشت به مبارزه باز می دارد. اما آرامش زیادی نیز وجود دارد، زیرا نبرد پیروز شده است. هیولای سینما سقوط کرده است.\"", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/GettyImages-2206815758.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۵ آبان • ۱۸:۵۶"}, {"source": "Hollywood Reporter", "title": "‘Love Island USA’ Stars Gal Tshnieder and Corey Sawyer Jr. Sign With UnderCurrent Talent (Exclusive)", "link": "https://www.hollywoodreporter.com/business/digital/love-island-usa-gal-tshnieder-corey-sawyer-jr-sign-undercurrent-1236755638/", "summary": "UnderCurrent, founded by Eric Bogard, Adam Bogard and Aaron Hoffman, has also promoted Tiffany Ariany as its first non-founder partner.", "date_str": "2026-11-16T17:00:00+00:00", "hash": "24c0d0b8835fd639", "title_fa": "ستاره‌های «Love Island USA» گال تشنیدر و کوری ساویر جونیور با استعداد UnderCurrent (انحصاری)", "summary_fa": "UnderCurrent که توسط اریک بوگارد، آدام بوگارد و آرون هافمن تأسیس شد، تیفانی آریانی را به عنوان اولین شریک غیر بنیانگذار خود نیز معرفی کرده است. ستاره های Love Island USA، گال تشنیدر و کوری سایر جونیور، با UnderCurrent Talent قرارداد امضا کردند. این آژانس با تشنیدر و سایر جونیور همکاری خواهد کرد. - که در فصل هشتم سریال واقعیت پرطرفدار Peacock پس از ورود به Casa Amor ظاهر شد - بر اساس یک انتشار، برای گسترش فراتر از نمایه های تلویزیونی خود از طریق فرصت هایی در سراسر سرگرمی، مشارکت با برندها و سرمایه گذاری های تجاری. UnderCurrent همچنین از تشنیدر با گسترش کافی شاپ خود در لس آنجلس، Saba Coffee حمایت خواهد کرد. اریک بوگارد، یکی از بنیانگذاران و مدیرعامل UnderCurrent Talent، در بیانیه ای گفت: ما به استعدادها به عنوان افرادی نگاه می کنیم که می توانند کسب و کارهای پایداری را حول علایق، تخصص و ارتباط با مخاطبان خود ایجاد کنند. نقش ما کمک به تبدیل این پتانسیل به حرفه ا  با شان کانری متفاوت بود، و تیموتی دالتون از راجر مور، و دنیل کریگ از پیرس برازنان بود، همه آنها در همان تاکسیدی که به صورت متعارف طراحی شده بود زندگی می کردند. داستان‌های مرتبط فیلم‌های جیمز باند یافت شده: رابرت پتینسون برای بازی 007 فیلم‌ها از کرم‌های شنی تا 007: جو واکر در تپه‌های شنی: قسمت سوم، ویلنوو، مک‌کوئین و باند، از سوی دیگر، شروران باند برای هر فیلمی منحصربه‌فرد هستند –", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/20col_Bond-Villians_Final-SPLASH-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۵ آبان • ۱۹:۳۰"}, {"source": "Variety", "title": "‘Hunger Games’ Costume Designer Teams With Depop on Vintage Fashion Collection, Including Edits for Effie and Haymitch", "link": "https://variety.com/2026/shopping/news/hunger-games-depop-collection-costume-designer-shop-online-1236948930/", "summary": "Depop is bringing the fashion of Panem to the resale market. Ahead of the Nov. 20 theatrical release of &#x201C;The Hunger Games: Sunrise on the Reaping,&#x201D; the secondhand fashion marketplace has teamed up with Lionsgate and the film&#x2019;s costume designer, Bina Daigeler, on a series of shoppable edits inspired by four of the prequel&#x2019;s central [ ]", "date_str": "2026-11-16T17:00:00+00:00", "hash": "396b70da3dbc723a", "title_fa": "تیم‌های طراح لباس «Hunger Games» با Depop در مجموعه مد قدیمی، شامل ویرایش‌هایی برای افی و هیمیچ", "summary_fa": "Depop مد پانم را به بازار فروش مجدد می آورد. پیش از نوامبر 20 اکران سینمایی «بازی‌های گرسنگی: طلوع آفتاب در درو»، بازار مد دست دوم با لاینزگیت و طراح لباس فیلم، بینا دایگلر، در مجموعه‌ای از ویرایش‌های قابل خرید با الهام از چهار قسمت اصلی پیش درآمد [ ] همکاری کرده است. این همکاری که روز دوشنبه آغاز به کار کرد، شامل مجموعه‌ای از لباس‌های قدیمی و دست دوم با الهام از هایمیچ آبرناتی (جوزف زادا)، لنور داو بیرد (ویتنی پیک)، میسیلی دانر (مکنا گریس) و افی ترینکت (ال فانینگ) است. این مشارکت به جای تولید کالاهای جدید، از موجودی موجود از oard ’s Dance Airplay chart, Steve Aoki earns his first No. 1, as “Gravity,” with Ely Oaks and SACHA, rises one place on the Nov. 21-dated chart. Released in July via Dim Mak Records, the song reaches the summit thanks to a 20% increase in plays at the format in the Nov. 6-12 tracking week, according to Luminate. The Dance Airplay chart measures songs’ weekly plays, as tabulated by Mediabase and provided to Billboard by Luminate, on a panel of dance-formatted radio stations in the United States. “Gravity” also earns Ely Oaks his first Dance Airplay No. 1 and SACHA, her second, after “Set Me Free” with Armin van Buuren in January. Aoki first appeared on Dance Airplay in April 2010 with “I’m in the House,” featuring Zuper Blahq (a pseudonym of will.i.am). He has since earned nine top 10s. Steve Aoki’s Dance Airplay Top 10s: Peak Position, Title, Peak Date No. 1, “Gravity,” with Ely Oaks and SACHA, Nov. 21, 2026 No. 7, “Heartless,” with Mia Takarabe, Oct. 17, 2026 No. 2, “I’m Going Out,” with Sam Feldt and Xandra (Nile Rodgers Zak Abel), March 22, 2025 No. 4, “Hungry Heart,” with Galantis and Hayley Kiyoko, June 24, 2023 No. 3, “Save Me,” with HRVY, Sept. 17, 2022 No. 6, “Imagine,” with Frank Walker feat. AJ Mitchell, Nov. 7, 2020 No. 4, “Let It Be Me,” feat. Backstreet Boys, Dec. 7, 2019 No. 4, “Waste It on Me,” feat. BTS, Dec. 22, 2018 No. 5, “Just Hold On,” with Louis Tomlinson, March 4, 2017 “Gravity” is Aoki’s second chart-topping song of 2026, following “YAPAQUE,” with Farruko and Greeicy. That track led both Latin Airplay and Latin Rhythm Airplay in August, giving Aoki his first No. 1s on any Latin chart. On the albums side, Aoki has topped the Top Dance Albums chart twice: Neon Future I in 2014 and Neon Future III in 2018. “Gravity” also marks the second Dance Airplay No. 1 for Dim Mak Records, the independent Los Angeles-based label and lifestyle brand that Aoki founded in 1996 as a student at UC Santa Barbara. The label first led the chart in 2021 with Aviella’s “Tell Me What You’re Thinking” and had most recently reached the top 10 with Z3LLA’s No. 8-peaking “Supernova” in February.", "date_str": "2026-11-16T15:59:24+00:00", "hash": "bc18c685641cf6e1", "title_fa": "استیو آئوکی اولین نمایش رقص شماره 1 خود را با الی اوکس و ساچا کولب \"Gravity\" به دست آورد.", "summary_fa": "شانزده سال پس از اولین حضورش در جدول رقص ایرپلی بیلبورد، استیو آئوکی اولین شماره 1 خود را به دست آورد، زیرا \"جاذبه\" با الی اوکس و ساچا یک پله در جدول تاریخ 21 نوامبر صعود کرد. طبق گزارش Luminate، این آهنگ که در ماه جولای از طریق Dim Mak Records منتشر شد، به لطف افزایش 20 درصدی پخش در قالب در هفته پیگیری 6 تا 12 نوامبر به قله رسید. نمودار Dance Airplay پخش هفتگی آهنگ‌ها را اندازه‌گیری می‌کند، همانطور که توسط Mediabase جدول‌بندی شده و توسط Luminate در پانل ایستگاه‌های رادیویی با فرمت رقص در ایالات متحده ارائه شده است. \"جاذبه\" همچنین اولین نمایش رقص شماره 1 را برای الی اوکس به ارمغان می آورد و بعد از \"مرا آزاد کن\" با آرمین ون بورن در ژانویه، ساچا دومین نمایشنامه اوست. آئوکی اولین بار در آوریل 2010 در Dance Airplay با \"I'm in the House\" با حضور Zuper Blahq (نام مستعار will.i.am) ظاهر شد. او از آن زمان تاکنون موفق به کسب 9 رتبه برتر 10 شده است. 10های برتر پخش رقص استیو آئوکی: موقعیت اوج، عنوان، تاریخ اوج شماره 1، «جاذبه» با الی اوکس و ساچا، 21 نوامبر 2026، شماره 7، «بی دل»، با میا تاکارابه، 17 اکتبر، 2026، سام فِه‌لد، 2026، سم. (نیل راجرز زاک آبل)، 22 مارس 2025 شماره 4، «قلب گرسنه»، با گالانتیس و هیلی کیوکو، 24 ژوئن 2023، شماره 3، «نجات من،» با HRVY، 17 سپتامبر 2022 شماره 6، «Imagine feet» با فرانک فید. ای جی میچل، شماره 4، 7 نوامبر 2020، «بگذار من باشم» شاهکار. بک استریت بویز، دسامبر 7، 2019 شماره 4، «این را روی من هدر بده،» شاهکار. BTS، 22 دسامبر 2018 شماره 5، \"Just Hold On\"، با لوئیس تاملینسون، 4 مارس 2017 \"Gravity\" دومین آهنگ برتر جدول آئوکی در سال 2026 است، پس از \"YAPAQUE\" با Farruko و Greeicy.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/P1148N9P-e1768247982923.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۹:۲۹"}, {"source": "Billboard", "title": "Dominic Fike Earns His Second Alternative Airplay No. 1 With ‘Babydoll’", "link": "https://www.billboard.com/music/chart-beat/dominic-fike-babydoll-number-1-alternative-airplay-chart-1236382968/", "summary": "Dominic Fike scores his second No. 1 on Billboard ’s Alternative Airplay chart (dated Nov. 21) as “Babydoll” rises two spots. Fike first topped the chart in 2019 with his breakthrough single, “3 Nights.” He returned to the list once after that, before “Babydoll,” with “Chicken Tenders” (No. 34 peak in 2020). Both of his leaders come from the same project: “Babydoll” and “3 Nights” were each introduced on his 2018 EP, Don’t Forget About Me, Demos , the project that preceded his three studio albums. “Babydoll” found a new audience in early 2026 when it became a popular sound on TikTok, eight years after its original release. The song was then newly promoted, along with 2025 track “White Keys.” The run of “Babydoll” at alternative radio accompanies its broader success. Earlier this month, “Babydoll” became Fike’s first No. 1 on Pop Airplay. In October, it reached No. 10 on the multimetric Billboard Hot 100 , giving Fike his first top 10. It was also a top three hit on both the Billboard Global 200 and the Billboard Global Excl. U.S. charts in April. (“White Keys” hit No. 32 on the Hot 100 the same month.) “Babydoll,” released via Sandy Boys/Columbia/Legacy, is the second Alternative Airplay No. 1 for Columbia Records in 2026, following Tame Impala’s “Dracula” in February. The Alternative Airplay chart measures songs’ weekly plays, as tabulated by Mediabase and provided to Billboard by Luminate, on 60 U.S. alternative radio stations. “Babydoll” hits No. 1 with support on stations including WTBV Tampa, Fla.; KYRK Corpus Christi, Texas; and KRAT Reno, Nev. Fike released his third studio album, How to Quit Smoking , on Oct. 30. The set reached No. 14 on the Alternative Airplay chart and No. 69 on the Billboard 200 . All charts dated Nov. 21 will update Tuesday, Nov. 17, on Billboard.com.", "date_str": "2026-11-16T15:51:15+00:00", "hash": "0e1d88010f25fad2", "title_fa": "دومینیک فیک دومین بازی جایگزین شماره 1 خود را با «Babydoll» به دست آورد.", "summary_fa": "دومینیک فیک دومین شماره 1 خود را در جدول پخش جایگزین بیلبورد (مورخ 21 نوامبر) به دست آورد که «Babydoll» دو پله صعود کرد. فیک اولین بار در سال 2019 با آهنگ موفقیت آمیز خود \"3 Nights\" در صدر جدول قرار گرفت. او یک بار بعد از آن، قبل از «Babydoll» با «مراقصه مرغ» (نمره 34 قله در سال 2020) به لیست بازگشت. هر دو رهبر او از یک پروژه می آیند: \"Babydoll\" و \"3 Nights\" هر کدام در EP 2018 او، Don't Forget About Me, Demos، پروژه ای که قبل از سه آلبوم استودیویی او بود، معرفی شدند. «Babydoll» در اوایل سال 2026، زمانی که هشت سال پس از انتشار اولیه‌اش به یک صدای محبوب در TikTok تبدیل شد، مخاطبان جدیدی پیدا کرد. سپس این آهنگ به همراه آهنگ 2025 \"White Keys\" به تازگی تبلیغ شد. اجرای \"Babydoll\" در رادیو جایگزین موفقیت گسترده تر آن را همراهی می کند. اوایل این ماه، «Babydoll» اولین شماره 1 فیک در پاپ ایرپلی شد. در ماه اکتبر، به رتبه 10 در 100 بیلبورد داغ چند متری رسید و اولین 10 رتبه برتر را برای فیک به ارمغان آورد. همچنین در Billboard Global 200 و Billboard Global Excl جزو سه مورد برتر بود. نمودارهای ایالات متحده در ماه آوریل. («White Keys» شماره 32 را در Hot 100 در همان ماه به دست آورد.) «Babydoll» که از طریق Sandy Boys/Columbia/Legacy منتشر شد، دومین پخش Alternative Airplay No. 1 برای Columbia Records در سال 2026، پس از Tame Impala \"Dracula\" در فوریه. نمودار Alternative Airplay پخش هفتگی آهنگ‌ها را که توسط Mediabase جدول‌بندی شده و توسط Luminate در اختیار بیلبورد قرار گرفته است، در 60 ایستگاه رادیویی جایگزین ایالات متحده اندازه‌گیری می‌کند. \"Babydoll\" با پشتیبانی در ایستگاه هایی از جمله WTBV Tampa، Fla. به شماره 1 می رسد. KYRK Corpus Christi، تگزاس؛ و KRAT Reno،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/dominic-fike-clayborne-bujoria-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۹:۲۱"}, {"source": "Billboard", "title": "John Summit Says He’s ‘Never Submitting to the Grammys Again,’ Calls Dance Category Nominations ‘A F–king Joke’", "link": "https://www.billboard.com/music/awards/john-summit-never-submitting-grammys-again-dance-category-joke-1236382922/", "summary": "John Summit had a lot to say about the list of nominees for the 69th annual Grammy Awards. After the full roster of nominees for the Feb. 7, 2026 awards was announced on Monday morning (Nov. 16) Summit took to X to share his very candid thoughts on what he thought of the contenders. Related Westlife Sets 2027 North America Tour: Exclusive Madonna Slayyyter Lead 2027 Dance/Electronic Grammy Nominations Lily Collins Pays Tribute to Phil Collins After Rock Hall Induction Summit, who was not nominated in any dance category, wrote, Never submitting to the grammys again unless s t changes, it s all a f king joke . He continued, i m not just talking about myself either there s zero respect for real electronic dance music and dj s. the whole dance category is just music industry fueled pop stars. While Summit did not name names, his own was absent from the roster of nominees for best dance/electronic recording, which included tunes from Fred Again.. ( Lights Burn Dimmer ), Madonna ( I Feel So Free ), Slayyyter ( Crank ), Tame Impala ( My Old Ways ), Tinashe ( Melatonin ) and Underscores ( Music ). He was also not listed on the best dance pop recording list, which included Zara Larsson ( Blue Moon ), Madonna ( Danceteria ), Raye ( Life Boat ), Slayyyter ( Dance ) and Tinashe ( Too Easy ), nor did he get noticed in the best dance/electronic album category, which featured another nomination for Madonna for her Confessions II LP, as well as nods for Robyn ( Sexistential ), Skrillex ( Soma ), Slayyyter ( Wor$t Girl in America ) and Tame Impala ( Deadbeat ). In a follow-up post, Summit added, not saying the artists nominated aren t good, they re just not dance music, they re pop, predicting, here come all the lil teeny bopper pop stan accounts with zero real world life experience to attack me. Billboard counted Summit among the snubees on Monday when the full nominations list was revealed, noting that his sophomore album, CTRL Escape , was totally blanked after his team submitted the album for best dance/electronic album and two other tracks in other categories: Lights Go Out for best dance/electronic recording and Don t Believe It for best dance pop recording. At press time a spokesperson for the Recording Academy had not returned Billboard s request for comment on Summit s posts. The 69th annual Grammy Awards will air on Sunday, Feb. 7, at a new time – 7 p.m. ET/ 4 p.m. PT. The move was designed to let Grammy watchers on the East Coast watch the full show without havi", "date_str": "2026-11-16T15:26:00+00:00", "hash": "9e9c33ea5ebd883d", "title_fa": "جان سامیت می‌گوید که «دیگر برای گرمی حاضر نمی‌شود»، نامزدهای رده‌های رقص را «جوک اف‌کینگ» می‌خواند.", "summary_fa": "جان سامیت در مورد لیست نامزدهای شصت و نهمین دوره جوایز گرمی حرف های زیادی برای گفتن داشت. پس از اعلام فهرست کامل نامزدهای جوایز 7 فوریه 2026 در صبح روز دوشنبه (16 نوامبر)، Summit به X رفت تا افکار بسیار صریح خود را در مورد نظرش در مورد رقبا به اشتراک بگذارد. مجموعه‌های مرتبط Westlife 2027 تور آمریکای شمالی: انحصاری Madonna Slayyyter، نامزدهای رقص/الکترونیک گرمی 2027، لیلی کالینز به فیل کالینز ادای احترام می‌کند، پس از اجلاس راک هال که در هیچ رشته رقص نامزد نشده بود، نوشت: «هرگز دوباره به آن تغییری نداده‌ام، بدون اینکه یک گرام را تغییر دهم». . او ادامه داد، من فقط در مورد خودم صحبت نمی‌کنم و برای موسیقی رقص الکترونیکی واقعی و دی‌جی‌ها نیز احترام قائل نیستم. کل دسته رقص فقط صنعت موسیقی است که به ستاره های پاپ دامن زده است. در حالی که سامیت نامی را ذکر نکرد، نام او در فهرست نامزدهای بهترین ضبط رقص/الکترونیک، که شامل آهنگ‌هایی از Fred Again.. (Lights Burn Dimmer)، Madonna (I Feel So Free)، Slayyyter (Crank)، Tame Impala (My Old Ways)، Tinashe (Melatscore) بود. او همچنین در فهرست بهترین آلبوم های رقص پاپ که شامل زارا لارسون (ماه آبی)، مدونا (Danceteria)، رای (قایق نجات)، اسلایتر (رقص) و تیناشه (خیلی آسان) بود، قرار نگرفت، و همچنین در رده بهترین آلبوم رقص/الکترونیک مورد توجه قرار نگرفت، که نامزد دیگری برای هرف پی پی و همچنین جایزه مدونا بود. (جنسیتی)، Skrillex (سوما)، Slayyyter (دختر Wor$t در آمریکا) و Tame Impala (Deadbeat). در یک پست بعدی، سامیت اضافه کرد، نگفت که هنرمندان نامزد شده خوب نیستند، آنها فقط موسیقی رقصی ندارند، آنها پاپ هستند و پیش‌بینی می‌کنند، در اینجا تمام اکانت‌های لیل تینی بوپر پاپ استن با تجربه‌ی صفر در زندگی واقعی به من حمله می‌کنند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P107EPAY-e1794840100687.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۵۶"}, {"source": "Billboard", "title": "ASCAP Names Samantha Saturn as General Manager, ASCAP Nashville", "link": "https://www.billboard.com/pro/ascap-names-samantha-saturn-general-manager-nashville/", "summary": "The American Society of Composers, Authors and Publishers (ASCAP) has appointed music executive and Nashville native Samantha Saturn as general manager, ASCAP Nashville, effective Dec. 1, 2026. In the newly established role, Saturn will direct day-to-day operations in the Nashville office. She will dual-report directly to ASCAP chief operating officer and chief financial officer Brian Roberts and executive vp and head of creative membership Nicole George-Middleton , both based in ASCAP’s New York City headquarters. Related ASCAP Unveils Mental Health Initiative for Members in Partnership With Project Healthy Minds CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Most recently, Saturn served for nearly eight years as chief marketing officer of SESAC Music Group, leading global brand strategy, corporate communications, affiliate engagement and digital licensing modernization across multiple entities. Saturn s career has also included time at Columbia Records as senior vp of digital marketing, where she built digital sales and marketing platforms for artists including Adele, The Chicks, Beyoncé, John Legend, AC/DC, Bruce Springsteen and more. She is an alumna of Leadership Music (Class of 2024) and a former board member at Gilda’s Club of Middle Tennessee and Watkins College of Art at Belmont University. Related Five Reasons Country Has the Top 5 Songs on the Billboard Hot 100 for the First Time “Creating this new role reflects our commitment to Music City and our vibrant new Nashville office in Wedgewood-Houston,” Elizabeth Matthews , ASCAP CEO, said in a statement. “As a native Nashvillian who is widely respected and deeply connected across creative and music industry circles, Samantha brings the relationships and strategic vision needed to effectively represent ASCAP and champion our members. We are excited to welcome her to the team.” “Nashville has become a global destination for music creation, with songwriters and composers collaborating across genres and boundaries every day,” Saturn said in a statement. “I’m honored to join Elizabeth Matthews, Brian Roberts, Nicole George-Middleton and the entire ASCAP team to support our members, build partnerships across the city’s creative community, and make our Wedgewood-Houston office a true home for ASCAP creators.”", "date_str": "2026-11-16T15:24:52+00:00", "hash": "cd01a0cbf6f24979", "title_fa": "ASCAP از سامانتا زحل به عنوان مدیر کل ASCAP نشویل نام می برد", "summary_fa": "انجمن آهنگسازان، نویسندگان و ناشران آمریکا (ASCAP) مدیر اجرایی موسیقی و سامانتا ساترن بومی نشویل را به عنوان مدیر کل ASCAP Nashville منصوب کرده است که از 1 دسامبر 2026 اجرایی می شود. در این نقش تازه تاسیس، Saturn عملیات روزانه را در دفتر نشویل هدایت خواهد کرد. او مستقیماً به مدیر عامل و مدیر مالی ASCAP برایان رابرتز و معاون اجرایی و رئیس عضویت خلاق نیکول جورج میدلتون، که هر دو در مقر ASCAP در شهر نیویورک مستقر هستند، گزارش خواهد داد. ASCAP مرتبط از ابتکار بهداشت روانی برای اعضا در مشارکت با پروژه Healthy Minds Signs CL با THEBLACKLABEL، اتحاد مجدد با تهیه کننده قدیمی تدی برای لحظات کامل در شرایط جوی شدید، شعاع بندها و یافتن نسل بعدی از عناوین جشنواره: اخیراً یک سال تمام شده است، رونمایی می کند. برای نزدیک به هشت سال به عنوان مدیر بازاریابی گروه موسیقی SESAC، استراتژی برند جهانی، ارتباطات شرکتی، مشارکت وابسته و نوسازی صدور مجوز دیجیتال در چندین نهاد. کار زحل همچنین شامل حضور در کلمبیا رکوردز به عنوان معاون ارشد بازاریابی دیجیتال است، جایی که او پلتفرم‌های فروش دیجیتال و بازاریابی را برای هنرمندانی از جمله آدل، چیکس، بیانسه، جان لجند، AC/DC، بروس اسپرینگستین و غیره ساخت. او فارغ التحصیل موسیقی رهبری (کلاس سال 2024) و عضو سابق هیئت مدیره در باشگاه گیلدا در تنسی میانه و کالج هنر واتکینز در دانشگاه بلمونت است. Related Five Reasons Country برای اولین بار 5 آهنگ برتر را در 100 آهنگ داغ بیلبورد دارد الیزابت متیوز، مدیر عامل ASCAP در بیانیه ای گفت: «ایجاد این نقش جدید نشان دهنده تعهد ما به شهر موسیقی و دفتر پر جنب و جوش ما در نشویل در Wedgewood-Houston است. سامانتا به‌عنوان یک نشویلیان بومی که به طور گسترده مورد احترام است و عمیقاً در میان محافل خلاق و صنعت موسیقی در ارتباط است، روابط", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/samantha-saturn-CR-anthony-romano-1500.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۵۴"}, {"source": "Deadline", "title": "Alex Baskin’s 32 Flavors Strikes Overall Deal With Hi Mom Productions", "link": "https://deadline.com/2026/11/alex-baskin-32-flavors-overall-deal-hi-mom-productions-1237224567/", "summary": "EXCLUSIVE: 32 Flavors, the Sony-owned production company behind series such as The Real Housewives of Beverly Hills and Vanderpump Rules, has struck an overall deal with Hi Mom Productions. It marks the first overall deal struck by Alex Baskin’s company and comes only a few months after Sony acqu vist Ben McKenzie to Moderate ‘The Altruists’ Premiere Q&A With Julia Garner, Anthony Boyle, Graham Moore (EXCLUSIVE)", "link": "https://variety.com/2026/tv/news/ben-mckenzie-the-altruists-julia-garner-anthony-boyle-1236947738/", "summary": "Ben McKenzie will moderate the premiere Q A for Netflix’s “The Altruists” with stars Julia Garner and Anthony Boyle and showrunner Graham Moore on Nov. 19 in New York, the same day the series premieres on the streamer. Known now as an anti-crypto activist as well as an actor, McKenzie followed his successful runs on television [ ]", "date_str": "2026-11-16T15:30:00+00:00", "hash": "1e8dbd5f63701b1b", "title_fa": "بن مک‌کنزی، فعال ضد رمزنگاری، پرسش و پاسخ نخست «نوخواهان» با جولیا گارنر، آنتونی بویل، گراهام مور را تعدیل می‌کند (اختصاصی)", "summary_fa": "بن مک‌کنزی اولین نمایش QA را برای «نودوکاران» نتفلیکس با حضور ستارگان جولیا گارنر و آنتونی بویل و گراهام مور مجری برنامه در 19 نوامبر در نیویورک، در همان روزی که این سریال برای اولین بار در استریمر پخش می‌شود، مدیریت خواهد کرد. مک کنزی که اکنون به عنوان یک فعال ضد رمزنگاری و همچنین بازیگر شناخته می شود، اجرای موفق خود را در تلویزیون دنبال کرد [ ] \"همه به خاطر پول به شما دروغ می گویند\" در ژوئن 2025 در SXSW لندن نمایش داده شد و در چندین جشنواره دیگر بازی کرد. توزیع‌کننده مستقل The Forge در مارس 2025 حقوق توزیع و فروش را به دست آورد، و فیلم از آوریل 2026 اکران محدودی داشت. اوون گلیبرمن از Variety فیلم را به‌عنوان «سرزنده، تیز، بی‌عیب و نقص» توصیف کرد و گفت: «به هر سوالی پاسخ می‌دهد که شریکی برای شما قابل تصور است، اما هنوز هم به دنبال یک شریک است. در حال حاضر برای اجاره از طریق Eventive، C5.now، Amazon و Kanopy در ایالات متحده موجود است. بویل و گارنر در فیلم «نوخواهان» در نقش کارولین الیسون بازی می‌کنند. سریال محدود نتفلیکس که در 19 نوامبر برای اولین بار به نمایش در می آید، رمزارز بانی و کلاید را از طریق ظهور و سقوط FTX، صرافی ارزهای دیجیتال و صندوق تامینی که توسط Bankman-Fried تأسیس شده است، دنبال می کند. بانکمن-فرید در اوج خود، چهل و یکمین آمریکایی ثروتمند در فهرست فوربس 400 بود. nge، رئیس هیئت مدیره و مدیر عامل UMG، برای ایجاد یک طرح جانشینی، با جزئیات که در هفته‌های آینده اعلام می‌شود، کار کرده است. داستان‌های مرتبط تایکا وایتیتی منتقدان «کلارا و خورشید» را به‌عنوان «بی‌ربط»، «ارواح گمشده غم‌انگیز» مورد انتقاد قرار می‌دهد و می‌گوید که ۱۵ سال است «نقدی نخوانده است: اما من به مردم گوش می‌دهم» که توسط لوپز طراحی شده است، GTS در سال ۲۰۰۷ راه‌اندازی شد، یک هنرمند برجسته، با تمرکز بر خدمات لاتین، به یک کتاب تبلیغاتی برجسته تبدیل شد. مشارکت، با دفاتر در هشت کشور، و Narcís Rebollo به عنوان رئیس و مدیرعامل آن - و اکنون لوپز به عنوان رئیس بازنشسته. لوپز همچنین به کار خود با خانه هنر جولیو ریس کوپلو ادامه خواهد داد. همکاری UMG با هنرستان آکادمی ترکیبی از آموزش، مربیگری، و توسعه هنرمندان است و به پرورش استعدادها کمک می کند، از جمله برندگان متوالی جایزه لاتین بهترین هنرمند جدید، Joaquina (2023) و Ela Taubert (2024).", "image_url": "https://variety.com/wp-content/uploads/2022/04/Jesus-Lopez-e1794841562256.jpg?w=958&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۳۸"}, {"source": "Variety", "title": "‘Survivor’ Season 52 Premiere Date Set at CBS in Midseason Slate", "link": "https://variety.com/2026/tv/news/survivor-season-52-premiere-date-cbs-1236948922/", "summary": "Survivor returns with Season 52 with a two-hour premiere on Feb. 24, CBS announced alongside a slate of midseason premieres. New series Einstein, Stacks of Cash and the reimagined Undercover Boss with Drew Carey have been given early 2027 dates, as well as the Golden Globes, hosted by Nikki Glaser. View CBS full midseason schedule [ ]", "date_str": "2026-11-16T15:00:00+00:00", "hash": "b7c7ec390d34e6e4", "title_fa": "تاریخ پخش فصل 52 \"Survivor\" در CBS در Midseason Slate تنظیم شده است.", "summary_fa": "شبکه سی بی اس اعلام کرد که در کنار برنامه ای برای اولین بار در میانه فصل، Survivor با فصل 52 با پخش دو ساعته در 24 فوریه باز می گردد. سریال‌های جدید انیشتین، پشته‌های پول نقد و رئیس مخفی بازسازی‌شده با درو کری تاریخ‌های اوایل سال ۲۰۲۷ و همچنین گلدن گلوب به میزبانی نیکی گلاسر داده شده‌اند. مشاهده برنامه کامل نیم فصل CBS [ ]", "image_url": "https://variety.com/wp-content/uploads/2026/08/Survivor.jpg?w=1000&#038;h=563&#038;crop=1", "category": "سینما و سریال", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Jesús López Steps Down as Head of Universal Music Latin America/Iberian Penninsula, Named Chairman Emeritus of UMG’s Global Talent Services", "link": "https://www.billboard.com/pro/jesus-lopez-leaves-universal-music-latin-shifts-to-gts/", "summary": "Jesús López , the longtime head of Universal Music’s entire Latin music business and one of the most iconic and influential executives in Latin music, will step down from his longtime position as chairman/CEO of Universal Music Latin America/Iberian Penninsula, Billboard can officially announce. López will take on a new role as chairman emeritus for Global Talent Services (GTS), the UMG artist management, booking, promotion and services company that he launched in 2007 and which today has offices in eight countries. In his new capacity, he will continue to provide his longtime expertise and knowledge of the Spanish-language music market and its artists. Narcis Rebollo will remain as president/CEO of GTS. Related Universal Music Latin America Unveils Executive Appointments for its Next Phase of Evolution’ CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive On the label side, López has been working with Sir Lucian Grainge , chairman and CEO of UMG, to put in place a succession plan, “with details to be announced in due course,” according to a Universal release. No further information about a successor was available at press time. “Jesús is an industry icon who has helped change the course of Latin music on the world stage,” said Grainge in a statement. “Throughout our industry’s evolution he has been a tireless advocate for the creative community, building a team that has advanced the careers of countless superstars. I’m grateful for the care he’s taken to prepare the business for the future and delighted that he’ll help shape the future of GTS, a company born of his own vision for serving artists. I look forward to continuing our work together.” López added: “As I begin this next chapter within UMG, I’m incredibly proud of what we’ve built together: a company that believes in artists early, stays with them and helps their music travel further than anyone imagined. I look forward to welcoming my successor and supporting our teams as they build on that success. As Chairman of GTS, I will continue pursuing a passion that has guided my entire career: helping artists realize the full scope of their ambitions. I’m grateful to Lucian for his trust and support over so many years, and excited to continue working with him and our teams to create new opportunities for artists.” Related Universal Music Lat", "date_str": "2026-11-16T15:00:00+00:00", "hash": "290c84d0c456529a", "title_fa": "ژسوس لوپز به عنوان رئیس یونیورسال موسیقی آمریکای لاتین/شبه‌جزیره ایبری کناره‌گیری کرد و به عنوان رئیس بازنشسته خدمات استعدادهای جهانی UMG معرفی شد.", "summary_fa": "بیلبورد می‌تواند رسماً اعلام کند، ژسوس لوپز، رئیس قدیمی کل تجارت موسیقی لاتین یونیورسال موزیک و یکی از نمادین‌ترین و تأثیرگذارترین مدیران در موسیقی لاتین، از سمت طولانی‌مدت خود به‌عنوان رئیس/مدیرعامل یونیورسال موزیک آمریکای لاتین/شبه‌جزیره ایبری کناره‌گیری می‌کند. لوپز نقش جدیدی را به عنوان رئیس بازنشسته برای خدمات استعدادهای جهانی (GTS)، شرکت مدیریت، رزرو، ارتقاء و خدمات هنرمندان UMG که در سال 2007 راه‌اندازی کرد و امروز در هشت کشور دفاتر دارد، برعهده خواهد گرفت. در سمت جدید، او به ارائه تخصص و دانش دیرینه خود در مورد بازار موسیقی اسپانیایی زبان و هنرمندان آن ادامه خواهد داد. نارسیس ربولو به عنوان رئیس/مدیرعامل GTS باقی خواهد ماند. موسیقی یونیورسال مرتبط آمریکای لاتین از قرارهای اجرایی برای فاز بعدی تکامل خود رونمایی می‌کند. نشانه‌های CL با THEBLACKLABEL، اتحاد مجدد با تدی، تهیه‌کننده قدیمی، برای لحظه‌ای کامل، شرایط جوی شدید، بندهای شعاع و یافتن نسل بعدی از عناوین جشنواره: لوپز با سر Lucian Grainge، رئیس و مدیر عامل UMG همکاری کرده است تا یک طرح جانشینی را اجرا کند، \"با جزئیات که در زمان مناسب اعلام خواهد شد\"، طبق یک نسخه یونیورسال. هیچ اطلاعات بیشتری در مورد جانشین در زمان انتشار در دسترس نبود. Grainge در بیانیه ای گفت: «Jesús یک نماد صنعتی است که به تغییر مسیر موسیقی لاتین در صحنه جهانی کمک کرده است. \"در طول تکامل صنعت ما، او یک مدافع خستگی ناپذیر برای جامعه خلاق بوده است، و تیمی را ایجاد می کند که مشاغل فوق ستاره های بی شماری را ارتقا داده است. من از مراقبتی که او برای آماده کردن کسب و کار برای آینده انجام داد سپاسگزارم و خوشحالم که او به شکل دادن به آینده GTS کمک خواهد کرد، شرکتی که برگرفته از دیدگاه خودش برای خدمت به هنرمندان است. من مشتاقانه منتظر ادامه کار مشترکمان هستم.» لوپز اضافه کرد: «همانطور که فصل بعدی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Jesus-Lopez-cr-Universal-Music-Group-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Greeicy Talks About Her No. 1 Hit ‘YAPAQUE,’ Karol G and Motherhood | Cafecito Con", "link": "https://www.billboard.com/video/greeicy-talks-about-no-1-hit-yapaque-karol-g-motherhood/", "summary": "Greeicy brings laughs and a very special surprise guest to “Cafecito Con,” and shares how acting alongside Karol G inspired her to “dream bigger.” In a warm, candid conversation, she talks about her life, career, and the people who inspire her. She also looks back on her first No. 1 on the Billboard charts with “YAPAQUE,” alongside Farruko and Steve Aoki. The singer and actress discusses how her relationship with social media has changed and what it means to share personal moments with her fans, including her experience as a mom. She also reflects on her childhood dreams and the creative journey that led her to music and acting, and explains why she loves connecting with fans while traveling and performing. Plus, she shares what makes creating music with Mike Bahía so special. Jessica Roiz: Hey, Greeicy. Oh, welcome to Cafecito Con. So happy to have you here. Greeicy: It’s been a while. Jessica Roiz: Yes, it’s true, it’s true. It’s been a while, like a few days. Well, Greeicy, we’re here at Macondo Coffee Roasters in Downtown. Barista: Well, welcome, welcome. Greeicy: Thank you so much. Barista: This is your home. Are you a café con leche person? Greeicy: Bitter. Jessica Roiz: Yes. And you don’t add sugar? Greeicy: No. I added sugar for many years, but they taught me that coffee is drunk without sugar. Barista: Whoever taught you that, I think it’s very good. Jessica Roiz: So, I’m going to get the seasonal one, which is the banana milk pumpkin pie latte. Barista: That’s my favorite. Divine. Greeicy: And that one has milk? Barista: Banana. Greeicy: Oh, banana milk? From which banana? Barista: They squeeze the milk from the banana. Greeicy: From which banana? Barista: Banana milk. I wish it were like that. Greeicy: That coffee is… I want it. Barista: Oh, my goodness. Perfect. So we have the order ready. Enjoy your super coffee. Greeicy: Thank you. Jessica Roiz: Well, actually, I heard somewhere that you’re bringing us a little surprise today, but… Greeicy: Oh, yes, a little surprise. Jessica Roiz: Yes? Greeicy: And I’ve had it by my side all day. Jessica Roiz: Oh. Ooh, okay, let’s see what it is, but later, while we wait for the coffee. And I want you to tell me a bit about what was happening in these posts. They’re… Okay? Keep watching for more!", "date_str": "2026-11-16T15:00:00+00:00", "hash": "a79aa6ab08fbc6f9", "title_fa": "Greeicy درباره آهنگ شماره 1 خود 'YAPAQUE'، Karol G و Motherhood صحبت می کند | Cafecito Con", "summary_fa": "Greeicy خنده و یک مهمان غافلگیرکننده بسیار ویژه را برای Cafecito Con به ارمغان می‌آورد و به اشتراک می‌گذارد که چگونه بازی در کنار کارول جی الهام بخش او برای «رویاهای بزرگ‌تر» شده است. در یک گفتگوی صمیمانه و گرم، او در مورد زندگی، حرفه و افرادی که به او الهام می‌دهند صحبت می‌کند. او همچنین با «YAPAQUE» در کنار Farruko و Steve Aoki به اولین شماره 1 خود در نمودارهای بیلبورد نگاه می کند. این خواننده و بازیگر درباره چگونگی تغییر رابطه اش با رسانه های اجتماعی و به اشتراک گذاشتن لحظات شخصی با طرفدارانش، از جمله تجربه خود به عنوان مادر، صحبت می کند. او همچنین در مورد رویاهای دوران کودکی خود و سفر خلاقانه ای که او را به سمت موسیقی و بازیگری سوق داد منعکس می کند و توضیح می دهد که چرا دوست دارد در سفر و اجرا با طرفداران ارتباط برقرار کند. به علاوه، او آنچه را که خلق موسیقی را با مایک باهیا بسیار خاص می‌کند، به اشتراک می‌گذارد. جسیکا رویز: هی، گریسی. اوه، به Cafecito Con خوش آمدید. خیلی خوشحالم که اینجا هستید گریسی: مدتی گذشت. جسیکا رویز: بله، درست است، درست است. مدتی گذشت، مثل چند روز. خوب، گریسی، ما اینجا در Macondo Coffee Roasters در مرکز شهر هستیم. باریستا: خوب، خوش آمدید، خوش آمدید. گریسی: خیلی ممنون. باریستا: اینجا خانه شماست. آیا شما یک آدم کافه دار هستید؟ گریسی: تلخ. جسیکا رویز: بله. و شکر اضافه نمیکنید؟ گریسی: نه. من سالها شکر اضافه کردم، اما به من یاد دادند که قهوه بدون شکر نوشیده می شود. باریستا: هر کسی که این را به شما آموخت، فکر می کنم خیلی خوب است. جسیکا رویز: بنابراین، من می‌خواهم آن فصلی را تهیه کنم، که لاته پای کدو حلوایی شیر موز است. باریستا: این مورد علاقه من است. الهی. گریسی: و اون یکی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Artboard-1-copy-9.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Madonna & Slayyyter Lead 2027 Dance/Electronic Grammy Nominations", "link": "https://www.billboard.com/music/awards/2027-grammy-nominees-dance-electronic-madonna-slayyyter-1236382910/", "summary": "Madonna , Slayyyter , Tame Impala and Tinashe lead the nominees in the dance/electronic categories at the 2027 Grammy Awards. Related Grammy Nominations 2027: See the Complete List RAYE Rosalía Lead 2027 Grammy Nominations as Women Make History Snubs Surprises In the 2027 Grammy Nominations Nominees were announced early on Monday (Nov. 16), setting up the race for the awards ceremony happening Feb. 7 in Los Angeles. As widely predicted, Madonna leads the pack, with nominations in all four of the dance electronic categories. Her July album Confessions II generated nods for best dance/electronic album, best dance/electronic recording, best dance pop recording and best remixed recording. Meanwhile, Slayyyter comes in second on the list, with her March album Wor$t Girl In America getting nods in the best dance/electronic album category along with best dance/electronic recording and best dance pop recording. Tame Impala and Tinashe follow, each getting a pair of nominations in the dance fields. See the complete list of nominees across the dance/electronic categories below. Best Dance/Electronic Album Madonna, Confessions II Robyn, Sexistential Skrillex, Soma Slayyyter, Wor$t Girl In America Tame Impala, Deadbeat Best Dance/Electronic Recording Fred again.., Lights Burn Dimmer Madonna, I Feel So Free Slayyyter, Crank Tame Impala, My Old Ways Tinashe, Melatonin Underscores, Music Best Dance Pop Recording Zara Larsson, Blue Moon Madonna, Danceteria Raye, Life Boat. Slayyyter, Dance Tinashe, Too Easy Best Remixed Recording Fred again.., Ca7riel Paco Amoroso, Beto s Horns (Fred remix) Bruno Mars, I Just Might (Austin Millz Remix) Madonna, Love Sensation (Stuart Price Remix with Madonna Kylie Minogue) Taylor Swift, Opalite (Chris Lake Remix) Nine Inch Nails Boys Noize, A Question of Trust (Boys Noize Remix) Raye, Where Is My Husband! (David Guetta Remix)", "date_str": "2026-11-16T14:46:40+00:00", "hash": "edcac19c030eb87c", "title_fa": "مدونا و اسلایتر، نامزدهای رقص/الکترونیک گرمی 2027", "summary_fa": "مدونا، اسلایتر، تم ایمپالا و تیناشه نامزدهای بخش رقص/الکترونیک در جوایز گرمی 2027 هستند. نامزدهای مربوط به گرمی 2027: فهرست کامل را ببینید نامزدهای گرمی 2027 RAYE Rosalía پیشتاز به عنوان زنان تاریخ ساز را غافلگیر می کند نامزدهای گرمی 2027 در اوایل روز دوشنبه (16 نوامبر) معرفی شدند و مسابقه برای مراسم اهدای جوایز در Lob برگزار شد. همانطور که به طور گسترده پیش بینی شده بود، مدونا با نامزدی در هر چهار دسته الکترونیکی رقص، رهبری گروه را بر عهده دارد. آلبوم ژوئیه او Confessions II برای بهترین آلبوم رقص/الکترونیک، بهترین رقص/ضبط الکترونیکی، بهترین ضبط پاپ رقص و بهترین ضبط ریمیکس تمجید کرد. در همین حال، Slayyyter با آلبوم مارس Wor$t Girl In America در رتبه دوم لیست قرار می گیرد و در رده بهترین آلبوم رقص/الکترونیک به همراه بهترین رقص/ضبط الکترونیکی و بهترین ضبط پاپ رقص رتبه اول را کسب کرد. Tame Impala و Tinashe دنبال می‌شوند و هر کدام یک جفت نامزدی در زمینه رقص دریافت می‌کنند. فهرست کامل نامزدها در دسته‌های رقص/الکترونیک را در زیر ببینید. بهترین آلبوم رقص/الکترونیک مدونا، Confessions II Robyn، Sexistential Skrillex، Soma Slayyyter، Wor$t Girl In America Tame Impala، Deadbeat بهترین رقص/ضبط الکترونیکی Fred..، Lights Burn Dimmer Madonna، I Feel So Free Old Slayyyter، Cranslatin موسیقی بهترین رقص پاپ ضبط شده زارا لارسون، مدونا ماه آبی، دانستریا ری، قایق نجات. Slayyyter, Dance Tinashe, Too Easy Best Remixed Remixed Fred again.., Ca7riel Paco Amoroso, Beto s Horns (Remix Fred) Bruno Mars, I Just Might ( Austin Millz Remix) Madonna, Love Sensation ( استوارت پرایس ریمیکس با مدونا تالیور مینویکس ) نه اینچ میخ پسران نویز، سوال اعتماد (ریمیکس پسران نویز) ری، شوهرم کجاست! (ریمیکس دیوید گتا)", "image_url": "https://www.billboard.com/wp-content/uploads/2026/06/madonna-press-2026-credit-Rafael-Pavarotti-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۱۶"}, {"source": "Billboard", "title": "LCD Soundsystem to Headline First of Manchester’s New Platt Fields Park Concerts in 2027", "link": "https://www.billboard.com/music/music-news/lcd-soundsystem-manchester-platt-fields-park-show-2027-1236382887/", "summary": "LCD Soundsystem will headline Manchester’s Platt Fields Park next summer, marking the return of live music at the venue for the first time in more than 15 years. The show, announced on Monday (Nov. 16) will take place on July 30 and be the first of a new series of 25,000-capacity outdoor gigs planned at the venue next year, with further headline acts set to be revealed in the coming weeks. The legendary New York band, led by James Murphy, will be joined by a slate of support acts including Mercury Prize-winning Scottish group Young Fathers, rising duo Cowboy Hunters and DJs Erol Alkan and Luke Una. Tickets will go live at 10 a.m. GMT on Nov. 20 and will be available via Plattform , where further information can be found. The park s last major shows took place in 2011, when the Parklife Weekender brought a host of acts to Platt Fields, including Chase Status, Kelis, Two Door Cinema Club, Mark Ronson, Jamie xx and Skrillex, among others. The festival later moved to Heaton Park, its current home, in 2013 as it expanded. Sam Kandel, event director and founder of promoters The Warehouse Project, said in a statement: We re so proud to be part of the team delivering the return of live music events to Platt Fields Park. Everyone in the city knows Platt Fields has its own unique character, shaped by its fantastic location and the diverse communities who live alongside it, and we re planning to create some truly special moments and memories there for everyone. He added: The return of LCD Soundsystem to Manchester, performing in the beautiful surrounds of Platt Fields Park, after nearly a decade away is, we think, the perfect place to start! The event will run as a collaboration between The Warehouse Project, Live Nation and SJM Concerts. Councilor Shazia Butt, executive member for culture, leisure and libraries for Manchester City Council, added: “With 2027 already set to be yet another massive year of live music in the city bringing with it huge benefits for the city’s economy, local businesses and our residents we’re looking forward to adding to this next summer with the return once more of live music to our amazing Platt Fields Park, and to welcoming even more visitors to our fantastic city. We ll be working closely with concert organizers to ensure maximum benefit for Platt Fields and for the local community from the gigs, both in the run-up to, during and after they ve taken place, and we look forward to sharing more information on this in the coming months. LC", "date_str": "2026-11-16T14:36:06+00:00", "hash": "314788e0919b0abf", "title_fa": "ال سی دی ساوندسیستم به عنوان اولین کنسرت جدید پارک پلات فیلدز منچستر در سال 2027 سرلوحه قرار خواهد گرفت.", "summary_fa": "ال سی دی ساوندسیستم تابستان آینده در پارک پلات فیلدز منچستر قرار خواهد گرفت و برای اولین بار در بیش از 15 سال، بازگشت موسیقی زنده به این مکان را رقم خواهد زد. این نمایش که در روز دوشنبه (16 نوامبر) اعلام شد در 30 جولای برگزار می شود و اولین سری از کنسرت های فضای باز با ظرفیت 25000 نفر خواهد بود که در سال آینده در محل برنامه ریزی شده است، با تیترهای بعدی که قرار است در هفته های آینده فاش شوند. گروه افسانه‌ای نیویورکی به رهبری جیمز مورفی به گروهی از حامیان از جمله گروه اسکاتلندی Young Fathers برنده جایزه مرکوری، دوتای نوظهور Cowboy Hunters و دی‌جی‌های Erol Alkan و Luke Una ملحق خواهند شد. بلیت‌ها در ساعت 10 صبح به وقت گرینویچ در 20 نوامبر پخش می‌شوند و از طریق Plattform در دسترس خواهند بود، جایی که اطلاعات بیشتر را می‌توانید پیدا کنید. آخرین نمایش های مهم پارک در سال 2011 برگزار شد، زمانی که Parklife Weekender مجموعه ای از نمایش ها را به Platt Fields آورد، از جمله Chase Status، Kelis، Two Door Cinema Club، Mark Ronson، Jamie xx و Skrillex و غیره. این جشنواره بعداً در سال 2013 با گسترش آن به پارک هیتون، خانه فعلی آن منتقل شد. سام کندل، مدیر رویداد و موسس پروموترهای The Warehouse Project، در بیانیه‌ای گفت: ما بسیار مفتخریم که بخشی از تیمی هستیم که رویدادهای موسیقی زنده را به پارک پلات فیلدز ارائه می‌دهد. همه در شهر می‌دانند که پلات فیلدز شخصیت منحصربه‌فرد خود را دارد که با موقعیت فوق‌العاده و جوامع متنوعی که در کنار آن زندگی می‌ک or America’s multiracial [ ]", "date_str": "2026-11-16T14:30:00+00:00", "hash": "c00cb2addbdb0611", "title_fa": "تریلر «چهاردهم»: آوا دوورنی درباره تهدیدات اصلاحیه اساسی قانون اساسی هشدار می دهد: «ما همه در خطر هستیم»", "summary_fa": "نتفلیکس تریلر مستند قانع‌کننده و فوری ۱۴th Ava DuVernay را قبل از اکران در ۲۷ نوامبر و اولین نمایش آن در ۴ دسامبر در پلتفرم استریم منتشر کرده است. آن را در بالا تماشا کنید. شریلین ایفیل، استاد حقوق، در تریلر توضیح می دهد که فیلم مدعی اسکار استدلال می کند که چهاردهمین متمم قانون اساسی، که در پی جنگ داخلی تصویب شد، زمینه را برای چند نژادی آمریکا [ ] ایجاد کرد: «ما همه در خطر هستیم». \"اگر فکر نمی کنیم که برای ما پیش می آید، سخت در اشتباهیم.\" استیسی آبرامز، نماینده سابق ایالت جورجیا خاطرنشان می کند، \"کل چهاردهم مورد حمله قرار گرفته است. اگر 14 ام سقوط کند، هر حق دیگری که تضمین می کند اکنون در خطر است.\" یکی از پنج ماده اصلاحیه، شهروندی حق تولد را الزامی می کند - به این معنی که هر کسی که در ایالات متحده متولد شود شهروند محسوب می شود. دولت ترامپ به عنوان بخشی از حمله گسترده‌تر خود به مهاجرت، تلاش کرده است تا آن را دور بزند. در تریلر، معاون رئیس جمهور JD Vance می گوید: \"مفهوم شهروندی حق تولد یک امر پوچ است.\" در ماه ژوئن، دادگاه عالی ایالات متحده فرمان اجرایی رئیس جمهور را که طبق آن کودکانی که در ایالات متحده از والدینشان در این کشور به طور غیرقانونی متولد شده بودند، حق شهروندی حق تولد را ندارند، لغو کرد. اما این تصمیم به هیچ وجه متفق القول نبود. کلارنس توماس، ساموئل آلیتو و نیل گورسوش، قضات محافظه‌کار مخالف بودند. 14th در ماه اکتبر در جشنواره فیلم نیویورک به نمایش درآمد و این آخر هفته در IDFA در آمستردام، بزرگترین جشنواره مستند جهان به نمایش درآمد. ما یکشنبه شب قبل از IDFA Q A دوورنی به طور خلاصه با دوورنی صحبت کردیم و او به ما گفت که امیدوار است مردم تهدیدات اصلاحیه", "image_url": "https://deadline.com/wp-content/uploads/2026/11/19_B008ROWN_B008C001_241123_ROWN_S000_sRGB_20260930_1.22.1-1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۲۵ آبان • ۱۸:۰۰"}, {"source": "Netflix NL", "title": "Dit is wat het einde van The Body betekent", "link": "https://www.netflix-nederland.nl/dit-is-wat-het-einde-van-the-body-betekent/", "summary": "De nieuwe Netflix-serie The Body heeft een opmerkelijk einde. De show eindigt met een soort cliffhanger en misschien zie jij door de bomen het bos niet meer. Wij helpen je een handje, wij leggen je uit wat er aan de hand is. The Body Het verhaal van The Body begint op Halloweenavond in 2004, wanneer de meisjes van het dansteam van een katholieke school een feest organiseren in het zogenoemde Devil s House. Teamcaptain Anya (Kristina Bogic) en de andere meiden gebruiken het feest ook om een nieuw teamlid, Grace (Sofia Wylie), officieel in de groep op te nemen. Wanneer Grace drugs gebruikt, krijgt ze een heftige reactie. Anya en Lisbeth (Geena Meszaros), een buitenbeentje dat er alles aan doet om bij het dansteam te horen, besluiten haar naar het ziekenhuis te brengen. Onderweg stopt Grace echter met ademen en houdt haar hart op met kloppen. Omdat Anya degene is die de drugs op het feest heeft verstrekt, besluiten de twee meisjes Grace naar huis te brengen om Anya s betrokkenheid te verbergen. Het verhaal neemt vervolgens een onverwachte wending wanneer Leo (Jackson Kelly), de broer van Lisbeth, Grace aantreft. Tot zijn verbazing blijkt ze nog in leven te zijn en zelfstandig te ademen, hoewel ze nergens op reageert. De serie draait om het onderzoek naar wat er die bewuste Halloweenavond werkelijk met Grace is gebeurd. Ondertussen proberen Anya en Lisbeth hun geheim verborgen te houden, terwijl steeds meer aanwijzingen erop wijzen dat er mogelijk iets bovennatuurlijks aan de hand is. Dit is wat het einde van The Body betekent In de laatste aflevering van The Body vallen tijdens het debutantenbal eindelijk verschillende puzzelstukjes op hun plaats. Steven (Orlando Norman), de vriend van Anya, vertelt haar dat hij vermoedt dat hij iets te maken heeft met wat Grace is overkomen. Hoewel zijn herinneringen aan die avond ontbreken, heeft ns II، بهترین آلبوم رقص/الکترونیک برای \"I Feel So Free\" و بهترین ضبط پاپ رقص برای Danceteria را از میان رای دهندگان آکادمی ضبط دریافت کرد. داستان های مرتبط موسیقی آریانا گرانده چهار نامزدی گرمی، از جمله آهنگ سال نود، پس از برداشتن یک قدم از Visibility Music، هری استایلز از نامزدی های گرمی 2027 خارج شد، مدونا همچنین برای آلبوم «Love Sensation, Mine-Confeed» نامزدی جایزه گرمی برای بهترین ضبط ریمیکس شد. و نامزد بهترین اجرای دو نفره/گروهی پاپ به همراه سابرینا کارپنتر برای Bring Your Love. اما با وجود سر و صدایی که در صبح دوشنبه در مورد نامزدهای گرمی منتشر شد، Confessions II از رکورد مهم سال، آهنگ سال و دسته بندی آلبوم سال حذف شد. با این حال، این پنج نامزدی به خشکسالی مدونا پایان داد زیرا آخرین جایزه گرمی او در سال 2010 با «Celebration» برنده بهترین ضبط رقص شد. 28 نامزدی گرمی و هفت جایزه او در طول دوران حرفه‌ای‌اش بیشتر در دسته‌های آهنگ رقص و آلبوم‌های الکترونیکی به دست آمده است، جایی که مدونا در روز دوشنبه بیشترین موفقیت خود را داشت.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/06/GettyImages-223814709012.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۷:۵۲"}, {"source": "Hollywood Reporter", "title": "Ariana Grande Lands Four Grammy Nominations, Including Song of the Year Nod, After “Taking a Step Back From Visibility”", "link": "https://www.hollywoodreporter.com/music/music-news/ariana-grande-grammy-nominations-2027-1236755362/", "summary": "The nominations come months after the 'Wicked' star released her eighth studio album, 'Petal,' and wrapped up her Eternal Sunshine Tour.", "date_str": "2026-11-16T14:02:19+00:00", "hash": "08f8e154c24d64a2", "title_fa": "آریانا گرانده پس از «برداشتن یک قدم به عقب از دید» چهار نامزدی گرمی، از جمله آهنگ سال نود را به دست آورد.", "summary_fa": "این نامزدی ماه‌ها پس از انتشار هشتمین آلبوم استودیویی خود به نام «گلبرگ» و پایان تور «آفتاب ابدی» توسط ستاره «شیطان» صورت گرفت. آریانا گرانده چهار نامزدی جایزه گرمی 2027 را دریافت کرده است. نامزدها     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
