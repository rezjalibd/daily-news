      align-items: center;

      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>

ews.com/2026/11/10/how-ai-glasses-are-changing-the-way-people-communicate", "summary": "عینک‌های مجهز به هوش مصنوعی که بیش از نیمی از آنها در چین ساخته می‌شوند، در حال تبدیل شدن از یک گجت به ابزاری روزمره برای مسافران و افراد کم‌شنوا هستند، چرا که سازندگانشان امیدوارند آن‌ها روزی جایگزین گوشی‌های هوشمند شوند.", "date_str": "2026-11-10T14:00:45+00:00", "hash": "afefa198d3231ed0", "title_fa": "چگونه عینک‌های مجهز به هوش مصنوعی در حال تغییر نحوه ارتباط مردم هستند", "summary_fa": "عینک‌های مجهز به هوش مصنوعی که بیش از نیمی از آنها در چین ساخته می‌شوند، در حال تبدیل شدن از یک گجت به ابزاری روزمره برای مسافران و افراد کم‌شنوا هستند، چرا که سازندگانشان امیدوارند آن‌ها روزی جایگزین گوشی‌های هوشمند شوند.", "image_url": "https://images.euronews.com/articles/stories/09/95/86/39/1200x675_cmsv2_07d0a06f-f455-53cf-998c-fb2ee901a9e8-9958639.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۹ آبان • ۱۷:۳۰"}, {"source": "BBC Persian", "title": "همراه داشتن موبایل در مدرسه در انگلستان ممنوع شد", "link": "https://www.bbc.com/persian/articles/cw98z8v1z82jo?at_medium=RSS&at_campaign=rss", "summary": "بر اساس دستورالعمل سخت‌گیرانه‌تر دولت، دانش‌آموزان در انگلستان به هیچ وجه اجازه نخواهند داشت تلفن همراهشان را در مدرسه با خود داشته باشند.", "date_str": "2026-11-10T15:42:24+00:00", "hash": "b598a94b735d352e", "title_fa": "همراه داشتن موبایل در مدرسه در انگلستان ممنوع شد", "summary_fa": "بر اساس دستورالعمل سخت‌گیرانه‌تر دولت، دانش‌آموزان در انگلستان به هیچ وجه اجازه نخواهند داشت تلفن همراهشان را در مدرسه با خود داشته باشند. یک دستورالعمل قانونی که از ژوئن اجرایی شد، مدارس و بنیادهای آموزشی را ملزم می‌کند که در تمام طول روز مدرسه را عاری از تلفن همراه نگه دارند. حالا مسئولان می‌گویند تغییراتی که در این دستورالعمل داده می‌شود و از سپتامبر ۲۰۲۷ اجرایی خواهد شد، از سیاست‌های فعلی «دیده نشود، شنیده نشود» فراتر می‌رود؛ سیاستی که در برخی مدارس اجرا می‌شود و به دانش‌آموزان اجازه می‌دهد تا زمانی که تلفنشان دیده یا شنیده نشود، می‌توانند آن را در کیفشان با خود نگه دارند. این در حالی است که اتحادیه‌های مدیران مدارس می‌گویند که مدارس بدون بودجه اضافی از سوی دولت، برای اجرای سیاست‌های جدید و سخت‌گیرانه‌تر به مشکل می‌خورند. لوسی پاول، وزیر آموزش بریتانیا، گفت که «پیام روشن» دولت به والدین و دانش‌آموزان این است که «مدرسه جای یادگیری و دوستی است، نه اسکرول کردن». به گفته دولت، دسترسی به تلفن همراه «ممکن است بچه‌ها را از یادگیری و از همدیگر دور کند.» مدارس می‌توانند خودشان تصمیم بگیرند چطور این دستورالعمل را اجرا کنند. برخی مدارس برای کیسه‌های دربسته یا کمدهای قفل‌دار هزینه کرده‌اند. برخی دیگر تلفن‌ها را اول روز جمع می‌کنند یا آوردن آنها به مدرسه را به کلی ممنوع کرده‌اند. پل وایتمن، دبیرکل اتحادیه مدیران مدارس، گفت که تلفن همراه می‌تواند در طول روز مدرسه «مشکلات ایمنی» ایجاد کند و «عامل حواس‌پرتی بی‌فایده‌ای» باشد؛ به گفته او، اما اقدامات محکم‌تری که در دستورالعمل جدید توصیه شده است «هزینه خواهد داشت». خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. پپه دی‌یاسیو، دبیرکل انجمن مدیران مدارس و کالج‌ها، گفت که تازه‌ترین دستورالعمل «دست‌کم تا حدی موضوع را روشن می‌کند»، ولی مدیران مدارس «نمی‌توانند تلفن‌های همراه", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/0adc/live/5154e720-dceb-11f1-a701-fddedf244c16.jpg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۹ آبان • ۱۹:۱۲"}, {"source": "Iran International", "title": "مدیر روابط عمومی وزارت ورزش: با فشار آمریکا، عراق مجوز پرواز مستقیم تیم ملی را باطل کرد", "link": "https://www.iranintl.com/202611102219", "summary": "محسن معتمدکیا، مدیر روابط عمومی وزارت ورزش در شبکه اجتماعی ایکس نوشت که عراق با فشار آمریکا، مجوز پرواز مستقیم تیم ملی فوتبال از تهران به بصره عراق را که از قبل صادر شده بود، «در دقیقه ۹۰ لغو کرد.»", "date_str": "2026-11-10T15:47:15+00:00", "hash": "428eac35a647ad87", "title_fa": "مدیر روابط عمومی وزارت ورزش: با فشار آمریکا، عراق مجوز پرواز مستقیم تیم ملی را باطل کرد", "summary_fa": "محسن معتمدکیا، مدیر روابط عمومی وزارت ورزش در شبکه اجتماعی ایکس نوشت که عراق ب کرات دو روزه با میانجی‌گری آمریکا را با هدف یافتن راهی برای پایان دادن به جنگ روسیه علیه اوکراین به پایان رساندند؛ با این حال، هنوز مشخص نیست که این گفت‌وگوها تا چه اندازه پیشرفت داشته است. این مذاکرات در ابوظبی، پایتخت امارات متحده عربی؟ نخستین دیدار رودرروی مقام‌های روسیه و اوکراین از زمستان گذشته تاکنون بود و در شرایطی برگزار شد که کاخ سفید تلاش‌های تازه‌ای را برای شکستن بن‌بست در جنگی آغاز کرده است که از زمان جنگ جهانی دوم تاکنون، بزرگ‌ترین و خونین‌ترین جنگ زمینی اروپا به شمار می‌رود. مارکو روبیو، وزیر امور خارجه آمریکا، که در حاشیه نشست گروه هفت در پاریس با همتای اوکراینی خود دیدار کرده بود، مذاکرات را «بسیار سازنده» توصیف کرد. او گفت: «ما معتقدیم که قالب سه‌جانبه مذاکرات در نهایت باید شرکای اروپایی ما را نیز دربر بگیرد، زیرا آنها هم بخشی از راه‌حل بلندمدت این مسئله هستند.» پیش از آغاز مذاکرات، مقام‌های آمریکایی نسبت به دستیابی به پیشرفتی اساسی ابراز خوش‌بینی کرده بودند. استیو ویتکاف، فرستاده ارشد کاخ سفید، گفته بود که احتمالاً در این گفت‌وگوها موضوع بهره‌گیری از «نهادهای امنیتی موجود اروپا» نیز مطرح خواهد شد. جرد کوشنر، داماد دونالد ترامپ، رئیس‌جمهوری آمریکا، و دیگر فرستاده اصلی واشینگتن در این روند، نیز در آغاز نشست گفت که آمریکا برای دستیابی به «راه‌حلی که امیدواریم به جنگ پایان دهد»، اختلاف‌ها را محدودتر کرده است. او جزئیات بیشتری در این زمینه ارائه نکرد. جرد کوشنر از رویکرد کاخ سفید برای ایجاد یک چارچوب امنیتی جدید با اروپا خبر داد با این حال، مقام‌های روسیه تاکنون هیچ نشانه‌ای از آمادگی برای عقب‌نشینی از مطالبات سرسختانه‌ای که از پیش از آغاز تهاجم تمام‌عیار کرملین به اوکراین در فوریه ۲۰۲۲ مطرح بوده‌اند، نشان نداده‌اند.", "image_url": "https://gdb.rferl.org/2e986cd9-d285-4809-be13-dacc2a100f44_cx0_cy4_cw0_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۹ آبان • ۱۹:۱۴"}, {"source": "IranWire", "title": "سه‌شنبه‌های نه به اعدام؛ هشدار درباره موج تازه اعدام‌ها", "link": "https://iranwire.com/fa/news-1/160056-%D8%B3%D9%87%D8%B4%D9%86%D8%A8%D9%87%D9%87%D8%A7%DB%8C-%D9%86%D9%87-%D8%A8%D9%87-%D8%A7%D8%B9%D8%AF%D8% زی به حمله نظامی گسترده نیست", "summary_fa": "مارکو روبیو، وزیر امور خارجه آمریکا، روز سه‌شنبه ۱۹ آبان گفت که به متحدان واشنگتن در گروه هفت اعلام کرده است تحریم‌های اقتصادی و محاصره دریایی آمریکا چنان مؤثر عمل می‌کنند که دونالد ترامپ، رئیس‌جمهور آمریکا، نیازی به انجام عملیات نظامی گسترده در ایران ندارد. روبیو پس از دو روز نشست با متحدان آمریکا در گروه هفت، در گفت‌وگو با خبرنگاران در پاریس، بارها این ادعا را رد کرد که خودداری از بازگشت به اقدام نظامی به معنای بن‌بست یا حفظ وضع موجود است. او گفت: «فشار اقتصادی که در حال حاضر به ایران وارد می‌شود، فوق‌العاده است و این فشار به‌طور فزاینده‌ای تشدید می‌شود. هر روز بر شدت آن افزوده می‌شود.» وزیر امور خارجه آمریکا همچنین افزود که دونالد ترامپ از متحدان منطقه‌ای واشنگتن در خاورمیانه نیز اطلاعات و ارزیابی‌هایی دریافت کرده است که این دیدگاه را تأیید می‌کنند. او در عین حال تأکید کرد که آمریکا همچنان آماده دستیابی به یک «توافق واقعی» است، اما شرایطی که تهران همچنان مطرح می‌کند، «پوچ و غیرمنطقی» است. روبیو: خواسته‌های ایران در مذاکرات مضحک و غیرواقع‌بینانه است وزیر خارجه ایالات متحده یک روز پیش نیز درباره نتیجه‌بخش بودن تلاش‌های دیپلماتیک جاری ابراز بدبینی کرده و گفته بود خواسته‌های ایران نه‌تنها غیرقابل قبول، بلکه در برخی موارد «گستاخانه، مضحک و واقعاً غیرواقع‌بینانه» است. حکومت ایران پیش‌تر پایان محاصره دریایی بنادر خود در خلیج فارس و لغو تحریم‌های آمریکا را از پیش‌شرط‌های مذاکرات صلح اعلام کرده بود. در مقابل، واشینگتن خواستار بازگشایی تنگهٔ هرمز و پذیرش امتیازهایی از سوی تهران درباره برنامه هسته‌ای جمهوری اسلامی است. این در حالی است که دونالد ترامپ روز دوشنبه در شبکه اجتماعی خود گفت که کشورهای منطقه ترجیح می‌دهند به جای حمله دوباره به ایران محاصره دریایی و زمینی تهران ادامه یابد. رئیس‌جمهور آمریکا نوشت: «قطر، عربستان سعودی، امارات متحده عربی، بحرین، کویت و دیگر کشورها ترجیح", "image_url": "https://gdb.rferl.org/6362acb3-1bf7-4e4c-a316-68d87e51ee35_cx0_cy3_cw0_w1200_h630.jpg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۹ آبان • ۱۷:۴۷"}],

ray-tracing-support-on-ps5-pro/", "summary": "Xbox Cloud Gaming support means you'll be able to stream GTA6 on Xbox One.", "date_str": "2026-11-10T16:12:44+00:00", "hash": "2deb7df0a367626a", "title_fa": "GTA 6 سرعت 30 فریم در ثانیه را هدف قرار می دهد و از ردیابی پرتو در PS5 Pro پشتیبانی می کند", "summary_fa": "پشتیبانی از بازی Xbox Cloud به این معنی است که می‌توانید GTA6 را در ایکس باکس وان استریم کنید. Rockstar Games افزودن Engadget به Google: منبع برگزیده Google Discover همراه با در دسترس قرار دادن Grand Theft Auto 6 برای پیش‌بارگذاری روی Xbox Series X/S و PlayStation 5، Rockstar Games فاش کرده است که طرفداران از نظر عملکرد چه انتظاراتی دارند که بازی در 19 نوامبر منتشر شود. این استودیو گفت که 30 فریم در ثانیه را هدف قرار داده است \"در حالی که هر دو پلتفرم را به حد مطلق خود می رساند تا دنیای وسیع و غنی لئونیدا را زنده کند - در حالی که تراکم و وفاداری بصری تمام محیط ها و ساکنان آن را حفظ می کند.\" در پست وبلاگ Rockstar هیچ اشاره ای به پشتیبانی از 40 فریم در ثانیه یا 60 فریم در ثانیه در PS5 Pro نشده است، اما شاید این موضوع کاهش یابد. با این حال، این بازی در کنسول رده بالاتر سونی چند تقویت خواهد داشت. این فناوری ارتقاء مقیاس سونی پلی استیشن Spectral Super Resolution را پشتیبانی خواهد کرد. در آینده‌ای قابل پیش‌بینی، PS5 Pro تنها راه برای اجرای بازی با سایه‌های ردیابی پرتو خواهد بود، اما مطمئناً زمانی که GTA 6 به ناچار روی رایانه شخصی فرود آمد، تغییر خواهد کرد. Rockstar اضافه کرد که \"بازخورد لمسی با کیفیت بالا به طور کامل در سراسر بازی یکپارچه شده است\" برای کنترلرهای DualSense، به همراه \"صدای فضایی بهبود یافته\" برای استفاده کامل از Tempest 3D Audio در PS5. علاوه بر این، استودیو گفت که زمان بارگذاری بهتری روی کنسول‌های سونی نیز وجود دارد. همانطور که انتظار می رفت، پشتیبانی از بازی از راه دور برای پلی استیشن و ایکس باکس وجود دارد. شما می‌توانید GTA 6 را از طریق Xbox Cloud Gaming روی کنسول‌ها (از جمله Xbox One) نیز بازی", "image_url": "https://www.engadget.com/img/gallery/gta-6-is-targeting-30-fps-and-has-ray-tracing-support-on-ps5-pro/l-intro-1794327030.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۹ آبان • ۱۹:۴۲"}, {"source": "Engadget", "title": "Google's Gemini 4 Carbon is now widely available around the world", "link": "https://www.engadget.com/2311855/gemini-4-carbon-now-available-worldwide/", "summary": "Google is rolling out Gemini 4 Carbon after a limited release to cybersecurity companies.", "date_str": "2026-11-10T16:00:00+00:00", "hash": "c5ffb11ed974520c", "title_fa": "Gemini 4 Carbon گوگل اکنون به طور گسترده در سراسر جهان در دسترس است", "summary_fa": "گوگل پس از انتشار محدود برای شرکت های امنیت سایبری، Gemini 4 Carbon را عرضه می کند. این شرکت می‌گوید که می‌توان از آن برای پیچیده‌ترین وظایف، مانند کدنویسی چند مرحله‌ای و تحقیقات علمی استفاده کرد. Google Add Engadget در Google: منبع ترجیحی Google Discover Google Gemini 4 Carbon را پس از انتشار اولیه آن برای انتخاب شرکت‌های دفاع امنیت سایبری در اواخر اکتبر در دسترس کاربران بیشتری قرار می‌دهد. Gemini 4 Carbon نوید یک جهش قابل توجه در کدنویسی هوش مصنوعی و امنیت سایبری و همچنین در تحقیقات علمی را می دهد. این شرکت گفت که برای اکثر کارهای معمولی و حتی اکثر کارهای مهندسی نرم افزار، Gemini 4 Argon همچنان انتخاب بهتری است. آرگون اولین مدل Gemini 4 بود و کمتر از کربن پیشرفته در نظر گرفته می شود. در همین حال، از آنجایی که کربن برای آزمایش محدودیت‌های هوشمندی یک مدل طراحی شده است، بهتر است برای کدگذاری چند مرحله‌ای، تحقیقات علمی و کشف و همچنین سایر کارهای پیچیده‌تر استفاده شود. این شرکت گفت که کربن به اولین کاربران خود کمک کرده است تا آسیب پذیری های روز صفر را در مدت زمان کوتاهی کشف کنند. همچنین پیشرفت هایی در پیش بینی ساختار پروتئین ایجاد کرده است که برای تولید داروها ضروری است. گوگل به 10000 دانشمند اجازه دسترسی رایگان به کربن را به مدت شش ماه برای کمک به تحقیقات آنها می دهد - ابتکاری که احتمالاً به نوبه خود به آموزش مدل های آن کمک می کند - و تاکنون هزاران نفر را وارد کرده است. Gemini 4 Carbon اکنون در Google AI Studio و Gemini برای تجارت در دسترس است. مشترکین Google AI Ultra که ماهیانه 100 دلار برای عضویت پرداخت می کنند، همچنین به کربن در برنامه Gemini، AI Model in Search و Antigravity، توسعه نرم افزار عامل گوگل و پلت فرم کدنویسی", "image_url": "https://www.engadget.com/img/gallery/googles-gemini-4-carbon-is-now-widely-available-around-the-world/l-intro-1794310699.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "امنیت سایبری"], "datetime_fa": "۱۹ آبان • ۱۹:۳۰"}, {"source": "Engadget", "title": "Apple brings Sign Language interpretation to a selection of original Apple TV titles", "link": "https://www.engadget.com/2311778/apple-sign-language-interpretation-original-apple-tv-titles/", "summary": "You ll be able to watch Being Heumann, F1 and other original titles with sign language interpretation.", "date_str": "2026-11-10T16:00:00+00:00", "hash": "17095dbecc888d85", "title_fa": "اپل تفسیر زبان اشاره را به مجموعه ای از عناوین اصلی Apple TV می آورد", "summary_fa": "شما می توانید Being Heumann، F1 و دیگر عناوین اصلی را با تفسیر زبان اشاره تماشا کنید. این تجربه توسط امضاکنندگان ناشنوا و بومی طراحی و آزمایش شد. Apple Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover اپل یک ویژگی دسترسی جدید را به Apple TV می آورد. با شروع اکران آخرین فیلم اصلی خود Being Heumann در 13 نوامبر، تفسیر زبان اشاره را بر روی منتخبی از عناوین اصلی خود ارائه خواهد کرد. علاوه بر Being Heumann که داستان جودی هیومن، فعال حقوق معلولیت را روایت می‌کند، فیلم F1 همچنین برای زبان اشاره آمریکایی (ASL) و زبان اشاره بریتانیا (BSL) ترجمه می‌کند. این شرکت اضافه کرد که این تفاسیر نیز اواخر امسال برای فیلم‌های Greyhound و Way of the Warrior Kid در دسترس خواهد بود و عناوین بیشتری از Apple Original در ادامه خواهند آمد. اپل می گوید که هر تفسیر زبان اشاره \"به دقت ساخته شده است تا با فیلم Apple Original که تفسیر می کند مطابقت داشته باشد و تکمیل شود.\" برای مشاهده این عملکردها، باید مطمئن شوید که از برنامه Apple TV در دستگاهی با iOS 27.2، iPadOS 27.2، macOS 27.2، tvOS 27.2 یا visionOS 27.2 استفاده می‌کنید. همچنین روی دستگاه‌های شخص ثالث پشتیبانی‌شده «که آخرین نرم‌افزار برنامه را اجرا می‌کنند» کار می‌کند. هنگامی که مطمئن شدید از نسخه مناسب استفاده می کنید، به تنظیمات برنامه Apple TV بروید تا ویژگی زبان اشاره را روشن کنید. پس از آن، هنگامی که در حال مرور یا جستجوی چیزی برای تماشا هستید، باید آن را به عنوان یک گزینه در عناوین پشتیبانی شده ببینید. برای مثال، نماد زبان اشاره، که شبیه دست کمی مایل یا تکان دهنده است، در کنار سایر نمادها مانند AD برای توضیحات صوتی ظاهر می شود.", "image_url": "https://www.engadget.com/img/gallery/apple-brings-sign-language-interpretation-to-a-selection-of-original-apple-tv-titles/l-intro-1794283507.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "سینما"], "datetime_fa": "۱۹ آبان • ۱۹:۳۰"}, {"source": "Wired", "title": "‘We Have to Take Over’: Far-Right Extremists Want to Seize Control of the GOP", "link": "https://www.wired.com/story/we-have-to-take-over-far-right-extremists-want-to-seize-control-of-the-gop/", "summary": "MAGA failed because it didn't go far enough, right-wing extremists say—and following devastating midterm losses, they see an opportunity to take over.", "date_str": "2026-11-10T16:40:19+00:00", "hash": "ec65e97b2d5974ec", "title_fa": "\"ما باید کنترل کنیم\": افراط گرایان راست افراطی می خواهند کنترل جمهوری خواهان را در دست بگیرند", "summary_fa": "افراط گرایان راست می گویند MAGA شکست خورد زیرا به اندازه کافی پیش نرفت - و پس از شکست های ویرانگر میان دوره ای، آنها فرصتی را برای تصاحب آن می بینند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان در روز انتخابات هفته گذشته، نیک فوئنتس ملی‌گرای سفیدپوست از حامیان خود در X خواست که «امروز بیرون بروید و به دموکرات رأی دهید». این پست بیش از 12 میلیون بازدید داشت. ساعاتی بعد، در پی پیروزی دموکرات ها، فوئنتس اعتبار این پیروزی را بر عهده گرفت. او در تلگرام نوشت: «دوباره این کار را انجام دادیم» و بعداً این پدیده را «اثر گرایپر» نامید که اشاره‌ای به لقبی است که به دنبال‌کنندگانش داده‌اند. فوئنتس در روزهای اخیر مدعی شده است که نتایج انتخابات فرصتی برای او و متحدانش در راست افراطی است. فوئنتس در جریان پخش زنده هفته گذشته گفت: «اجازه دهید دموکرات ها حکومت کنند، ببینید . ماجرا به نحوه‌ی کار موتور بستگی دارد. وقتی خودرو را خلاص می‌کنید، ارتباط موتور با چرخ‌ها قطع می‌شود و موتور برای روشن‌ماندن باید همچنان در دور آرام کار کند. در این وضعیت، واحد کنترل الکترونیکی موتور (ECU) سوخت تزریق می‌کند تا موتور خاموش نشود. اما وقتی خودرو در دنده قرار دارد و پای راننده از روی گاز برداشته می‌شود، چرخ‌ها از طریق گیربکس همچنان موتور را می‌چرخانند. در خودروهای انژکتوری مجهز به این قابلیت، ECU در شرایط مشخصی تزریق سوخت را متوقف می‌کند و موتور بدون مصرف سوخت به چرخش ادامه می‌دهد. کپی لینک سیستم قطع سوخت هنگام کاهش سرعت چگونه کار می‌کند؟ این سیستم معمولاً زمانی فعال می‌شود که چند شرط هم‌زمان برقرار باشند: موتور به دمای کاری رسیده باشد، پدال گاز رها شده باشد و دور موتور از محدوده‌ی دور آرام بالاتر باشد. در چنین شرایطی، ECU دستور قطع پاشش سوخت را به انژکتورها می‌دهد. به‌محض اینکه راننده دوباره پدال گاز را فشار دهد یا دور موتور به محدوده‌ی نزدیک دور آرام برسد، تزریق سوخت از سر گرفته می‌شود. به این ترتیب، موتور هم در کاهش سرعت سوخت مصرف نمی‌کند و هم هنگام نیاز دوباره آماده‌ی شتاب‌گیری است. البته این قابلیت در همه‌ی خودروها دقیقاً با شرایط یکسانی فعال نمی‌شود و آستانه‌ی دور موتور و دمای", "image_url": "https://api2.zoomit.ir/media/car-fuel-consumption-downhill-6af3264c1e22a6ae5bd3e93f?w=1920&q=75", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۲۰:۰۰"}, {"source": "Zoomit", "title": "گوشت‌خواری برخلاف باور رایج موجب افزایش تستوسترون نمی‌شود", "link": "https://www.zoomit.ir/health-medical/470836-meat-diet-testosterone-protein-study/", "summary": "برخلاف باور رایج، مصرف بیشتر گوشت و پروتئین حیوانی لزوماً تستوسترون را افزایش نمی‌دهد و حتی ممکن است با کاهش آن مرتبط باشد.", "date_str": "2026-11-10T16:20:00+00:00", "hash": "d1950089422d06c7", "title_fa": "گوشت‌خواری برخلاف باور رایج موجب افزایش تستوسترون نمی‌شود", "summary_fa": "برخلاف باور رایج، مصرف بیشتر گوشت و پروتئین حیوانی لزوماً تستوسترون را افزایش نمی‌دهد و حتی ممکن است با کاهش آن مرتبط باشد. تبلیغات در سال‌های اخیر، برخی اینفلوئنسرهای شبکه‌های اجتماعی رژیم گوشت‌خواری را راهکاری برای افزایش تستوسترون معرفی کرده‌اند. در این رژیم، افراد عمدتاً گوشت و سایر محصولات حیوانی مصرف می‌کنند و بسیاری از مواد غذایی گیاهی را کنار می‌گذارند. بااین‌حال، شواهد علمی معتبری وجود ندارد که نشان دهد مصرف بیشتر گوشت به افزایش تستوسترون منجر می‌شود. به‌گزارش ساینس‌آلرت ، پژوهشگران دانشگاه فنلاند شرقی با بررسی رژیم غذایی و سطح هورمون‌های ۲۵۴۶ مرد ۴۲ تا ۶۰ ساله دریافتند افرادی که نسبت بیشتری از پروتئین موردنیاز خود را از منابع حیوانی دریافت می‌کردند، سطح تستوسترون پایین‌تری داشتند. تستوسترون یکی از هورمون‌های اصلی جنسی مردانه است که در حفظ توده‌ی عضلانی، سلامت استخوان‌ها و عملکرد جنسی نقش دارد. با وجود ارتباط پروتئین حیوانی با رشد عضلات، یافته‌های جدید نشان می‌دهد که این ارتباط لزوماً به معنای افزایش تستوسترون نیست. در مطالعه‌ی جدید، شرکت‌کنندگان خوراکی‌های مصرف‌شده‌ی خود را در طول چهار روز ثبت کردند. پژوهشگران سپس ارتباط میان منابع مختلف پروتئین و سطح تستوسترون خون آن‌ها را بررسی کردند. مردانی که پروتئین گیاهی بیشتری از منابعی مانند حبوبات، سبزیجات و مغزها دریافت می‌کردند، سطح تستوسترون آزاد بالاتری داشتند نتایج نشان داد مردانی که نسبت پروتئین حیوانی به گیاهی در رژیم غذایی‌شان بالاتر بود، سطح تستوسترون کل پایین‌تری داشتند. همچنین بیشترین نسبت مصرف پروتئین حیوانی به گیاهی با پایین‌ترین سطح تستوسترون آزاد همراه بود. در مقابل، مصرف بیشتر پروتئین گیاهی از منابعی غیر از غلات، مانند حبوبات، سبزیجات و مغزها، با سطح بالاتر تستوسترون آزاد ارتباط داشت. تستوسترون آزاد بخشی از این هورمون است که به پروتئین‌های خون متصل نیست و برای استفاده‌ی بافت‌های بدن در دسترس قرار دارد. اندازه‌گیری آن می‌تواند اطلاعات تکمیلی درباره‌ی وضعیت هورمونی فرد ارائه دهد.", "image_url": "https://api2.zoomit.ir/media/man-grilling-meat-outdoor-6af296c01e22a6ae5bd3e728?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۱۹:۵۰"}, {"source": "Zoomit", "title": "چرا تابلو جاده در تاریکی می‌درخشد؟", "link": "https://www.zoomit.ir/zoomplus/470751-how-road-signs-glow-night/", "summary": "تابلوهای جاده با بهره‌گیری از یک فناوری ساده اما کاربردی، در تاریکی هم می‌درخشند و به لامپ نیاز ندارند.", "date_str": "2026-11-10T16:10:00+00:00", "hash": "adbf4a30e4fb5475", "title_fa": "چرا تابلو جاده در تاریکی می‌درخشد؟", "summary_fa": "تابلوهای جاده با بهره‌گیری از یک فناوری ساده اما کاربردی، در تاریکی هم می‌درخشند و به لامپ نیاز ندارند. تبلیغات احتمالاً هنگام رانندگی در شب متوجه شده‌اید که تابلوهای راهنمایی و رانندگی با نزدیک‌شدن خودرو ناگهان روشن و درخشان به نظر می‌رسند. این تابلوها معمولاً نه چراغ دارند و نه به برق متصل‌اند؛ راز درخشش آن‌ها در پوشش مخصوصی است که نور چراغ خودرو را به سمت راننده برمی‌گرداند. تصور کنید شب در جاده‌ای تاریک رانندگی می‌کنید. هیچ چراغ خیابانی در اطراف نیست؛ اما تابلوی محدودیت سرعت یا خروجی بزرگراه از فاصله‌ی نسبتاً دور کاملاً مشخص است. جالب اینکه اگر همان تابلو را از زاویه‌ای متفاوت نگاه کنید، ممکن است دیگر آن‌قدر درخشان به نظر نرسد. این ویژگی به فناوری خاصی به نام «بازتاب بازگشتی نور» یا رترورفلکشن مربوط می‌شود؛ فناوری ساده اما دقیقی که برای افزایش دید رانندگان در تاریکی به کار می‌رود. کپی لینک تابلوهای جاده چگونه نور را بازتاب می‌دهند؟ در بیشتر تابلوهای جاده‌ای که شب‌ها بدون روشنایی مستقل دیده می‌شوند، سطح تابلو با لایه‌ای مخصوص پوشانده شده است. این لایه به‌جای پراکنده‌کردن نور در جهت‌های مختلف، بخش زیادی از نور دریافتی را تقریباً به همان سمتی برمی‌گرداند که از آن آمده است. به‌گزارش اداره‌ی فدرال بزرگراه‌های آمریکا (FHWA) ، همین ویژگی باعث می‌شود نور چراغ‌های جلو پس از برخورد با تابلو، به سمت خودرو بازگردد و نوشته‌ها و علائم برای راننده روشن‌تر دیده شوند. اما این پوشش چگونه نور را برمی‌گرداند؟ سازندگان معمولاً از دو فناوری استفاده می‌کنند: دانه‌های شیشه‌ای بسیار ریز یا منشورهای میکروسکوپی. دانه‌های شیشه‌ای مانند عدسی‌های کوچکی عمل می‌کنند. نور وارد آن‌ها می‌شود، مسیرش تغییر می‌کند و پس از بازتاب، به سمت منبع نور برمی‌گردد. در پوشش‌های منشوری نیز ساختارهای بسیار کوچکی وجود دارند که با چند بار بازتاب، نور را به جهت اولیه هدایت می‌کنند.", "image_url": "https://api2.zoomit.ir/media/stop-sign-night-road-6af15acc354e588119e486e2?w=1920&q=75", "category": "موسیقی و هنر", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۱۹:۴۰"}, {"source": "Business Insider", "title": "Almost nobody uses AI agents to order food or rides on apps like Uber", "link": "https://www.businessinsider.com/ai-agents-drive-few-uber-doordash-orders-despite-hype-2026-11", "summary": "AI agents were the source of four ride-hailing trips during one of the company s busiest weeks. David Paul Morris/Bloomberg via Getty Images AI agents aren't taking off on apps like Uber and DoorDash. The AI tools have generated hundreds of food and ride-hailing orders, the companies said. Shoppers have said that agents can make mistakes and need guardrails to be useful. AI agents aren't getting much love from restaurant patrons or ride-hailing passengers. Despite predictions that agents will revolutionize ordering stuff online, both Uber and DoorDash mentioned on their latest earnings calls that they've received hundreds of orders through AI agents like Meta's Muse or Instinct. Those are tiny numbers compared to the millions of rides and deliveries that the companies complete each day. For example, Uber provided 320 million ride-hailing and delivery trips during the last week of October, CFO Balaji Krishnamurthy said on Uber's third-quarter earnings call on Wednesday. It was \"one of our largest weeks\" thanks to Halloween orders , Krishnamurthy said. Only about 500 of those Uber Eats orders came from AI agents, he said. And agents were the source of four ride-hailing trips during the week. \"It is very, very early, and very limited traction that we have seen so far,\" Krishnamurthy said. The comments came a week after DoorDash CEO Tony Xu said that his company had received \"several hundred orders in total\" from AI agents. That's a sliver of the billions of orders that DoorDash delivers annually. Some AI users have put agents in charge of buying everything from plane tickets to groceries for them. Shoppers have also said the tools are useful for monitoring prices. Ordering errors and fears about the agents going rogue with credit card details have led others to use them more cautiously, Business Insider previously reported. Even with limited usage, both Uber and DoorDash are moving ahead with AI tools on their own apps. DoorDash said in September that it was testing a text-to-order feature that allows users to bypass the company's app, for instance. Do you have a story idea about the gig economy? Contact this reporter at abitter@businessinsider.com or via encrypted messaging app Signal at 808-854-4501. Use a personal email address, a nonwork WiFi network, and a nonwork device; here ' s our guide to sharing information securely. Read the original article on Business Insider", "date_str": "2026-11-10T16:09:21+00:00", "hash": "a6be2fa68281a511", "title_fa": "تقریباً هیچ کس از عوامل هوش مصنوعی برای سفارش غذا یا سوار شدن بر برنامه هایی مانند اوبر استفاده نمی کند", "summary_fa": "ماموران هوش مصنوعی در یکی از شلوغ‌ترین هفته‌های شرکت، منشأ چهار سفر سواری بودند. دیوید پل موریس/ بلومبرگ از طریق گتی ایمیجز عوامل هوش مصنوعی در برنامه هایی مانند Uber و DoorDash کار نمی کنند. این شرکت ها گفتند که ابزارهای هوش مصنوعی صدها سفارش غذا و سواری را تولید کرده اند. خریداران گفته اند که نمایندگان ممکن است اشتباه کنند و برای مفید بودن به نرده های محافظ نیاز دارند. عوامل هوش مصنوعی علاقه چندانی از مشتریان رستوران یا مسافران سواری دریافت نمی کنند. علی‌رغم پیش‌بینی‌ها مبنی بر اینکه نمایندگان انقلابی در سفارش کالاهای آنلاین ایجاد خواهند کرد، هر دو Uber و DoorDash در آخرین تماس‌های درآمدی خود اشاره کردند که صدها سفارش را از طریق عوامل هوش مصنوعی مانند Meta's Muse یا Instinct دریافت کرده‌اند. این اعداد در مقایسه با میلیون ها سواری و تحویلی که شرکت ها هر روز انجام می دهند، بسیار ناچیز است. بالاجی کریشنامورتی، مدیر مالی مالی اوبر در روز چهارشنبه در تماس با درآمد سه ماهه سوم اوبر گفت، برای مثال، اوبر 320 میلیون سفر حمل و نقل و تحویل در هفته آخر اکتبر ارائه کرده است. کریشنامورتی گفت که به لطف سفارشات هالووین \"یکی از بزرگترین هفته های ما\" بود. او گفت که تنها حدود 500 مورد از این سفارشات Uber Eats از سوی عوامل هوش مصنوعی بوده است. و ماموران منبع چهار سفر سواری در طول هفته بودند. کریشنامورتی گفت: «کشش بسیار بسیار زود و بسیار محدودی است که تاکنون دیده‌ایم. این اظهارات یک هفته پس از آن بیان شد که مدیر عامل DoorDash تونی زو گفت که شرکت او \"در مجموع چند صد سفارش\" از عوامل هوش مصنوعی دریافت کرده است. این برشی از میلیاردها سفارشی است که DoorDash سالانه تحویل می دهد. برخی از کاربران هوش مصنوعی ماموران را مسئول خرید همه چیز از بلیط هواپیما گرفته تا مواد", "image_url": "https://i.insider.com/6af32b098f37e8e0b5babbf6?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "عامل‌های هوشمند"], "datetime_fa": "۱۹ آبان • ۱۹:۳۹"}, {"source": "Business Insider", "title": "The most iconic Italian restaurant in every US state", "link": "https://www.businessinsider.com/most-iconic-famous-italian-restaurant-every-state", "summary": "From historic pizza joints to elevated pasta spots, these are the most iconic Italian restaurants in every state. OlyaSolodenko/Getty Images Italian restaurants nationwide are often rich in history and beloved by their local communities. Fior d'Italia in San Francisco is widely recognized as the oldest Italian restaurant in the country. We found iconic Italian restaurants based on customer reviews, their reputations, and local history. Few meals feel more suited to a cozy autumn night out than dinner at a beloved local Italian restaurant. From red-sauce institutions to hole-in-the-wall pizza joints, Italian restaurants remain some of the most enduring gathering places in communities across the US. We identified an iconic Italian restaurant in every state, weighing local legacy, longtime popularity, cultural impact, customer feedback, and the signature dishes that have earned each spot a devoted following. The list includes historic institutions like Fior d'Italia in San Francisco — widely believed to be the oldest Italian restaurant in the country, dating back to 1886 — and beloved neighborhood staples like and carry out multistep tasks. But they can still lose track of past conversations and struggle to make sense of huge, changing troves of company information. San Francisco-based Graphon is trying to solve that problem with software that lets agents store and retrieve information over time. Now, it has raised $35 million to further build and sell its technology. The company’s name comes from “graphons,” a mathematical framework founder and CEO Arbaaz Khan used during his Ph.D. research into coordinating swarms of robots . Rather than treating a company’s documents, videos, and images as isolated snippets, Graphon maps the connections among them — including where information came from and when it changed. Khan compared common AI search systems to tearing pages out of a book, crumpling them up, and tossing them into a bin. “Now when you go searching that trash can, you’re just trying to find the pieces to answer,” he told Business Insider. “You’ve basically lost all that information because each piece is living on its own.” Graphon, he said, instead creates a connected “fabric” of information. The company says it has two groups of customers in mind: individual developers and companies with enormous stores of technical and operational data like industrial businesses, financial services, and healthcare companies. “You can basically point your Claude or GPT or whatever to Graphon,” Khan said about the product being compatible with any off-the-shelf agents. “You can push in any amount of data in this, and we literally mean any.” Graphon says its software is already used by the San Francisco 49ers and HP. The company's $35 million Series A round was led by RRE Ventures, with participation from Energy Impact Partners, Hitachi Ventures, Gaia VC, and HP. The company closed a roughly $8 million seed round earlier this year. Graphon, which has 20 employees, plans to use the cash injection primarily to hire engineers and researchers, as well as some sales and go-to-market staff. e a high degree of dexterity. The model was evaluated across more than 200 activities, including serving food with tongs and using a pipette, as you would see in a laboratory. Google also showed that Apptronik’s Apollo 2 humanoid robot with Gemini Robotics 2.5 can now tie a bow with its five-fingered hands, a notable feat, because deformable objects (like ribbon) are notoriously difficult for robots to manipulate. Read full article Comments", "date_str": "2026-11-10T15:00:39+00:00", "hash": "93a37857bde4969a", "title_fa": "DeepMind از Gemini Robotics 2.5 و معیار ایمنی باز \"ASIMOV-jailbreak\" رونمایی کرد.", "summary_fa": "Google DeepMind نسل جدیدی از پلتفرم Gemini Robotics مجهز به هوش مصنوعی را معرفی کرده است. در نسخه 2.5، گوگل می گوید که هوش مصنوعی رباتیک آن به طرز وسوسه انگیزی به انجام وظایف دنیای واقعی و همچنین انسان ها نزدیک شده است. در واقع، برخی از ربات‌های جمینی توانستند کار واقعی را در کارخانه‌های مرسدس بنز انجام دهند و تیم در حال آماده شدن برای روزی است که روبات‌ها در کنار انسان‌ها با معیار ایمنی منبع باز کار کنند. پلتفرم هوش مصنوعی فیزیکی DeepMind دارای چندین لایه محاسباتی بین ورودی کاربر و عملکرد روباتیک است. قطعه مدل زبان بینایی وجود دارد که جمینی تجسم یافته است. اساساً، دستورالعمل‌های شما را می‌گیرد و از ویدیوی زنده برای برنامه‌ریزی چگونگی انجام این کار توسط ربات استفاده می‌کند. مؤلفه اصلی دیگر، زبان بینایی-عملی (VLA) است که در واقع اقدامات ربات را ایجاد می کند، مانند حرکت دادن یک محرک - این Gemini Robotics است که به نسخه 2.5 رسیده است. DeepMind می گوید که Gemini Robotics 2.5 در کارهایی که نیاز به مهارت بالایی دارند، بسیار بهتر است. این مدل در بیش از 200 فعالیت مورد ارزیابی قرار گرفت، از جمله سرو غذا با انبر و استفاده از پیپت، همانطور که در آزمایشگاه می بینید. گوگل همچنین نشان داد که ربات انسان نمای آپترونیک آپولو 2 با Gemini Robotics 2.5 اکنون می تواند با دستان پنج انگشت خود کمان ببندد، این یک شاهکار قابل توجه است، زیرا دستکاری اشیاء تغییر شکل پذیر (مانند روبان) برای روبات ها بسیار دشوار است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش Google DeepMind نسل جدیدی از پلتفرم Gemini Robotics مجهز به هوش مصنوعی را معرفی کرده است. در نسخه 2.5، گوگل می گوید", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/Credit_-Apptronik_-Mercedes-Benz-Apollo-2-using-Gemini-Robotics-2.5-to-autonomously-perform-automotive-kitting-at-a-Mercedes-Benz-factory-2560x1440.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۱۹ آبان • ۱۸:۳۰"}, {"source": "Ars Technica", "title": "Nvidia has a Jensen Huang problem—and no obvious successor", "link": "https://arstechnica.com/gadgets/2026/11/nvidia-has-a-jensen-huang-problem-and-no-obvious-successor/", "summary": "The investigation of Jensen Huang by Nvidia’s board threatens the future of one of Silicon Valley’s longest-serving executives and a key enabler of the AI boom, who has no obvious successor as leader of the world’s second-most-valuable company. Huang is fighting for survival after admitting to an extramarital affair, believed to be with an executive at a large Nvidia customer whom US officials also allege was working as a Chinese spy. The prospect that Huang could be forced out as chief executive of the US chipmaker he co-founded more than 30 years ago has alarmed investors and allies in the tech industry. Shares in Nvidia, which late last month ceded its position as the world’s most valuable to Apple amid a broader sell-off in AI stocks, had fallen more than 5 percent by midday trading on Monday. Read full article Comments", "date_str": "2026-11-10T14:53:05+00:00", "hash": "61cd548ca881f6cd", "title_fa": "انویدیا یک مشکل جنسن هوانگ دارد و جانشین مشخصی ندارد", "summary_fa": "تحقیقات جنسن هوانگ توسط هیئت مدیره انویدیا، آینده یکی از باسابقه‌ترین مدیران سیلیکون ولی و یکی از عوامل کلیدی رونق هوش مصنوعی را تهدید می‌کند، کسی که جانشین آشکاری به عنوان رهبر دومین شرکت ارزشمند جهان ندارد. هوانگ پس از اعتراف به رابطه خارج از ازدواج با یکی از مدیران اجرایی یکی از مشتریان بزرگ انویدیا که مقامات آمریکایی همچنین ادعا می کنند به عنوان جاسوس چینی کار می کرد، برای زنده ماندن می جنگد. دورنمای اخراج هوانگ به عنوان مدیر اجرایی تراشه‌ساز آمریکایی که بیش از 30 سال پیش تأسیس کرد، سرمایه‌گذاران و متحدان صنعت فناوری را نگران کرده است. سهام انویدیا که اواخر ماه گذشته در بحبوحه فروش گسترده سهام هوش مصنوعی جایگاه خود را به عنوان با ارزش ترین سهام جهان به اپل واگذار کرد، تا معاملات ظهر روز دوشنبه بیش از 5 درصد کاهش یافت. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید تحقیق درباره جنسن هوانگ توسط هیئت مدیره انویدیا، آینده یکی از باسابقه‌ترین مدیران سیلیکون ولی و یک عامل کلیدی برای دومین شرکت بی‌نظیر هوش مصنوعی، که دومین شرکت بدون موفقیت در جهان است، تهدید می‌کند. شان مگوایر، شریک سرمایه گذار اولیه انویدیا Sequoia Capital، در یک پست رسانه اجتماعی گفت: \"جنسن برای رهبری هوش مصنوعی آمریکا غیرقابل جایگزین است.\" تراشه های انویدیا در ایجاد ابزارهای مولد هوش مصنوعی مانند ChatGPT نقش مهمی داشتند و اکنون در مرکز دیوانگی زیرساخت های هوش مصنوعی یک تریلیون دلاری Big Tech قرار دارند. هوانگ شخصا پشت سرمایه‌گذاری‌ها و تضمین‌های صدها میلیارد دلاری برای ده‌ها استارت‌آپ و ارائه‌دهنده مراکز داده هوش مصنوعی ایستاده است، و همچنین از دونالد ترامپ رئیس‌جمهور ایالات متحده برای مقررات ضعیف‌تر هوش مصنوعی لابی کرده است.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2024/11/jensen_huang-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Nvidia", "Apple"], "datetime_fa": "۱۹ آبان • ۱۸:۲۳"}, {"source": "Ars Technica", "title": "FDA warns GLP-1 drugs may pose risk of rare condition that causes vision loss", "link": "https://arstechnica.com/health/2026/11/glp-1-drugs-may-increase-risk-of-vision-loss-from-rare-condition-fda-warns/", "summary": "The Food and Drug Administration is warning that popular obesity drugs—including Ozempic, Wegovy, Zepbound, and Mounjaro—may carry a \"potential increased risk\" of a rare eye condition that can lead to permanent vision loss. In a drug safety communication Monday , the FDA said it will now require makers of GLP-1 receptor agonist drugs to add a warning about that risk on their drug labels. The specific eye condition it warns of is called non-arteritic anterior ischemic optic neuropathy or NAION . The condition is caused by restricted blood flow to the optic nerve, which leads to swelling and cell death and ultimately damages the nerve, causing abrupt vision loss that can often be permanent. It's unknown how GLP-1 drugs may cause NAION. The condition is rare overall, occurring in somewhere between two and 10 people in 100,000 in the general population, according to the American Academy of Ophthalmologists. These small numbers have made it more difficult to determine with certainty if there is a connection. Further complicating the potential link is the fact that the risk factors for developing NAION are common among patients taking GLP-1 drugs. The risk factors include diabetes, cardiovascular disease, high blood pressure, high cholesterol, metabolic syndrome, and obstructive sleep apnea. Read full article Comments", "date_str": "2026-11-10T14:43:49+00:00", "hash": "5b1365dc95bcfd1f", "title_fa": "FDA هشدار می دهد که داروهای GLP-1 ممکن است خطر بیماری نادری را ایجاد کنند که باعث از دست دادن بینایی می شود", "summary_fa": "سازمان غذا و دارو هشدار می دهد که داروهای رایج چاقی - از جمله Ozempic، Wegovy، Zepbound و Mounjaro - ممکن است \"خطر افزایش بالقوه\" یک بیماری نادر چشمی را داشته باشند که می تواند منجر به از دست دادن دائمی بینایی شود. در یک ارتباط ایمنی دارو در روز دوشنبه، FDA گفت که اکنون از سازندگان داروهای آگونیست گیرنده GLP-1 می خواهد تا هشداری در مورد این خطر روی برچسب دارویی خود اضافه کنند. بیماری خاص چشمی که هشدار می دهد نوروپاتی ایسکمیک اپتیک غیر شریانی یا NAION نامیده می شود. این عارضه به دلیل محدود شدن جریان خون به عصب بینایی ایجاد می شود که منجر به تورم و مرگ سلولی می شود و در نهایت به عصب آسیب می رساند و باعث از دست دادن ناگهانی بینایی می شود که اغلب می تواند دائمی باشد. ناشناخته است که چگونه داروهای GLP-1 ممکن است باعث NAION شوند. به گفته آکادمی چشم پزشکان آمریکا، این وضعیت به طور کلی نادر است و در بین دو تا 10 نفر از 100000 نفر در جمعیت عمومی رخ می دهد. این اعداد کوچک تشخیص قطعی در مورد وجود ارتباط را دشوارتر کرده است. پیچیدگی بیشتر پیوند بالقوه این واقعیت است که عوامل خطر برای ایجاد NAION در بین بیمارانی که داروهای GLP-1 مصرف می کنند رایج است. عوامل خطر عبارتند از دیابت، بیماری های قلبی عروقی، فشار خون بالا، کلسترول بالا، سندرم متابولیک و آپنه انسدادی خواب. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید سازمان غذا و دارو هشدار می‌دهد که داروهای رایج چاقی - از جمله Ozempic، Wegovy، Zepbound و Mounjaro - ممکن است منجر به \"از دست دادن چشم بالقوه\" شود.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/02/GettyImages-1716643505-2560x1440.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۱۸:۱۳"}, {"source": "Ars Technica", "title": "Polestar has a new look with its Formula 2030 concept", "link": "https://arstechnica.com/cars/2026/11/polestar-has-a-new-look-with-its-formula-2030-concept/", "summary": "Perhaps only a small percentage of Ars readers will care about the Polestar 2030 concept, debuted today by the electric automaker. Spun out of Volvo—once upon a time, Polestar was a racing team—the brand has leveraged the resources of parent-automaker Geely to create electric vehicles that marry a modern minimalist style with rewarding driving dynamics . But you now can’t buy any Polestars in the US , since Geely is Chinese, and banning Chinese-owned car brands enjoys remarkable bipartisan support in Congress. The Formula 2030 is about the same length as a Polestar 2 but with a very low roofline. If anything, the two-b ow I originally pictured spending my 30s. But when I found myself single, without the commitments I'd expected to have at this age, I started thinking about what I could do with the freedom. I'd always wanted to see more of the world, and with my 4-year-old dog Maple beside me, I decided to stop waiting. Up until then, I'd worked as a financial advisor, spending my days in the corporate world, helping people plan for their futures. It made me think about all the things I wanted to do before I retired. I wanted to travel while I was fit and healthy enough to climb mountains and enjoy the places I'd dreamed of visiting. So, I sold my belongings, packed up my car, and set off with Maple in April 2025. We spent three months traveling between Greece and my native UK. I was nervous about going alone, but that experience showed me I could manage more than I'd given myself credit for. By the time we got back, I wanted to keep exploring. A trial trip convinced me to buy a van, but our early days were tough I'd seen people on social media post about van life , and I knew that was the freedom I was looking for. Two months after our first trip, before committing fully, I rented a van for two weeks and traveled around the Welsh coast. I really enjoyed living in a van ; traveling with Maple was much easier when we had somewhere familiar to sleep, cook, and retreat to at the end of the day. I decided to bite the bullet and buy our very own. I ended up spending more than I intended, but comfort mattered if this van was going to be our home. I picked it up in September 2025 and drove straight to Scotland, excited about what was ahead. The first few days weren't what I imagined. The electrics failed, the boiler broke, and the skylights leaked, all while I was dealing with Scottish storms alone. I kept driving back and forth from remote parts of the Highlands, trying to find someone trustworthy who could help. Instead of enjoying our new home (and the beautiful sights of Scotland ), I pically brings winds from the Northeast, per the National Weather Service . The weekend is harder to predict Meteorologists said the weekend is more difficult to predict so many days out. Some forecasts indicate strong winds and coastal flooding along parts of the East Coast, as well as heavier rain near the coast and snow farther inland. Other forecasts suggest lighter precipitation and winds, but with some risk of coastal flooding. The mountains of northern New England, upstate New York, and the Appalachians could see accumulating snow, marking the season's first snowfall in many areas. The Weather Channel's forecast indicates that major cities along the East Coast, such as New York and Boston, are not expected to receive any snow, as temperatures will remain above freezing. The last nor'easter occurred in September and brought heavy rainfall and strong winds, causing coastal flooding and power outages for tens of thousands of households. This is a developing story. Check back for updates. Read the original article on Business Insider", "date_str": "2026-11-10T14:49:00+00:00", "hash": "c188c075c5706d3c", "title_fa": "آنچه ما در مورد عید نوروز بالقوه می دانیم که می تواند اولین بارش برف فصل را در این آخر هفته به بخش هایی از ایالات متحده بیاورد.", "summary_fa": "آخرین و نه عید پاک در سپتامبر، گرفته شده در Scituate، ماساچوست. جوزف پرزیوسو / خبرگزاری فرانسه از طریق گتی ایماژ پیش بینی می شود هوای سرد پیش از عید نوروز در سراسر شرق ایالات متحده باشد. پیش بینی آب و هوای آخر هفته برای این همه روز دشوارتر است. برف ممکن است در شمال نیوانگلند، شمال نیویورک و آپالاچیان انباشته شود. یک عید نوروز احتمالی در اواخر این هفته می تواند اولین بارش برف فصل را به همراه داشته باشد، همراه با باران، سیل ساحلی و دمای یخ زدگی از دریاچه های بزرگ تا ساحل خلیج فلوریدا. هواشناسان در The Weather Channel پیش بینی می کنند دمای بالای روز از شیکاگو تا آتلانتا بین چهارشنبه و جمعه 20 درجه کاهش یابد. همچنین تا چهارشنبه شب از جورجیا تا میشیگان باران انتظار می‌رود و تا پنجشنبه شب در شمال شرق داخلی، باران می‌بارد که می‌تواند با برف مرطوب مخلوط شود یا تبدیل به برف مرطوب شود. هواشناسان می گویند تا آخر هفته دمای هوا می تواند به 30 درجه کاهش یابد و تا جنوب فلوریدا گسترش یابد. طبق سرویس ملی هواشناسی، معمولاً بین سپتامبر و آوریل، نور عید پاک نوعی طوفان است که در امتداد ساحل شرقی ایالات متحده شکل می گیرد و معمولاً بادهایی از شمال شرقی می آورد. پیش‌بینی آخر هفته سخت‌تر است هواشناسان گفتند که پیش‌بینی روزهای آخر هفته دشوارتر است. برخی پیش‌بینی‌ها حاکی از وزش باد شدید و جاری شدن سیل در بخش‌هایی از سواحل شرقی و همچنین بارش شدید باران در نزدیکی ساحل و برف دورتر در داخل کشور است. پیش‌بینی‌های دیگر حاکی از بارش‌ها و وزش بادهای خفیف‌تر است، اما با خطر سیلاب‌های ساحلی. کوه‌های شمال نیوانگلند، شمال ایالت نیویورک، و آپالاچی‌ها می‌توانند شاهد انباشت برف باشند که اولین بارش برف فصل را در بسیاری از مناطق نشان می‌دهد. پیش‌بینی کانال هواشناسی نشان می‌دهد", "image_url": "https://i.insider.com/6af2fe768f37e8e0b5babb6f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۱۸:۱۹"}, {"source": "Business Insider", "title": "I gave up my career to raise 4 kids. Now they're grown, I'm 57, and I'm starting my life over.", "link": "https://www.businessinsider.com/stay-at-home-mom-30-years-no-retirement-empty-nest-2026-11", "summary": "The author raised her four kids and is now an empty nester. Courtesy of the author I spent 30 years raising four children, and being their mom became the center of my identity. When my last child moved out, I cried over the memories, mistakes, and years that had passed. At 57, I'm learning to put myself first and figure out what I want from the next chapter. It was a morning like most others. Rise with the sun, kiss my husband, feed the cat and dogs, make my coffee , and sit out back to greet the day. Except that this morning, the house was empty for the first time in 30 years. As I sat down to drink my coffee, I whispered, \"I can't believe it's actually here.\" Fat, warm tears began making their way down my face, and my heart felt like it was breaking into a thousand tiny pieces. I closed my eyes, took a slow, deep breath , and reflected back through the years that now felt like one long, beautiful dream that I was trying not to wake from. I raised 4 kids I saw each of their four faces at different ages and seasons, felt the warmth of their snuggles, heard the echoes of their little voices bouncing off the walls of our home, and remembered rocking them to sleep and kissing away their tears . I smiled, thinking of the giggles and knock-knock jokes, the farts at dinner that made at least one of us spit out our food, the endless silly games and stories meant to distract them on long car rides, and the refrigerator covered with their drawings. At 57, the author became an empty nester Courtesy of the author Memories of the teenage years held a different tone of overriding fear and worry in the midst of helping each of them navigate learning to drive, friendships and dating, substance use, grades, college prep, and a few excruciatingly traumatic experiences that at one point I was sure would destroy us all. The tears that came from these memories were those of deep relief and gratitude that we not only survived, but we also raised four children into adulthood who were now out in this big world creating their own amazing adventures. Unfortunately, I still judged myself for the moments I felt resentful, irritated, and exhausted from the endless needs and responsibilities of raising four children and of my deep insecurity of not feeling good enough as a mom. As I sat in these memories, regret churned in my gut and the tears turned into sobs. This sadness was not just because I hated thinking about how I had hurt my children in these moments, but also for the younge", "date_str": "2026-11-10T14:36:24+00:00", "hash": "65d7f48f05432d49", "title_fa": "من حرفه ام را رها کردم تا 4 بچه بزرگ کنم. حالا آنها بزرگ شده اند، من 57 ساله هستم و زندگی ام را از نو شروع می کنم.", "summary_fa": "نویسنده چهار فرزند خود را بزرگ کرد و اکنون یک آشیانه خالی است. با حسن نیت نویسنده من 30 سال را صرف بزرگ کردن چهار فرزند کردم و مادر بودن آنها مرکز هویت من شد. وقتی آخرین فرزندم از خانه نقل مکان کرد، به خاطر خاطرات، اشتباهات و سال هایی که گذشت گریه کردم. در 57 سالگی یاد می‌گیرم که خودم را در اولویت قرار دهم و بفهمم که از فصل بعدی چه می‌خواهم. مثل بقیه صبح ها بود. با خورشید طلوع کن، شوهرم را ببوس، به گربه و سگ غذا بده، قهوه ام را درست کن، و بیرون بشین تا به آن روز خوشامد بگویم. با این تفاوت که امروز صبح خانه برای اولین بار پس از 30 سال خالی بود. وقتی نشستم قهوه ام را بنوشم، زمزمه کردم: \"باورم نمی شود که واقعا اینجاست.\" اشک های چاق و گرم شروع به راه افتادن روی صورتم کردند و قلبم احساس می کردم که دارد به هزار تکه ریز می شکند. چشمانم را بستم، نفسی آهسته و عمیق کشیدم و به سال هایی فکر کردم که حالا مثل یک رویای طولانی و زیبا بود که سعی می کردم از آن بیدار نشم. من 4 بچه بزرگ کردم که هر کدام از چهار چهره آنها را در سنین و فصول مختلف دیدم، گرمای آغوششان را حس کردم، پژواک صدای کوچکشان را که از دیوارهای خانه مان می پرید، شنیدم، و به یاد آوردم که آنها را به خواب تاب می دادم و اشک هایشان را می بوسیدم. لبخندی زدم، به قهقهه ها و شوخی های کوبنده، گوزهای هنگام شام که باعث شد حداقل یکی از ما غذایمان را تف کند، بازی ها و داستان های بی پایان احمقانه که قصد داشتند حواسشان را در ماشین سواری های طولانی پرت کنند، و یخچالی که با نقاشی هایشان پوشیده شده بود، فکر کردم.", "image_url": "https://i.insider.com/6ae8d06fd8cc18cf795102da?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۱۸:۰۶"}, {"source": "Business Insider", "title": "This startup raised $20 million to keep AI agents in line with more AI agents. Read the pitch deck.", "link": "https://www.businessinsider.com/whitematter-startup-ai-agent-cybersecurity-funding-pitch-deck-2026-11", "summary": "WhiteMatter s executive team is betting that more AI agents are the answer to rogue AI agents. WhiteMatter WhiteMatter has raised $20 million to keep a company's AI agents in check. The startup spawns \"guardian agents\" for every AI agent in an enterprise to ensure it does what it's supposed to. Business Insider got an exclusive look at the pitch deck WhiteMatter used to raise its Series A round. A startup using AI agents to keep rogue AI in line has raised $20 million. WhiteMatter, founded in 2024 and formerly known as QuilrAI, has built agents that oversee what a company's existing AI agents can access, do, and share. The startup spawns one \"guardian agent\" for each AI agent in an enterprise, which ensures the original agent acts as intended. Before a company lets an agent access files, use software, make a decision, or trigger an action, WhiteMatter's agent checks whether that's allowed. The so-called guardian also monitors outcomes. Guardian agents scale automatically — when an enterprise creates a new AI agent, a new guardian agent pops up, too. \"Our existing stack wasn't built for agents being the main actor in the story,\" Vidit Arora, the startup's 35-year-old founder and CEO, told Business Insider. \"Organizations are going now from humans being the core actor to agents being the core actor, and our entire tool stack wasn't built for that.\" Arora said that his company has helped customers transition from human-first to agent-first organizations. He says we're \"not even at the tip of the iceberg\" when it comes to agent attacks and compromises, both from external and internal agents. Agentic security has become an increasingly important topic as enterprises grant more non-technical employees access to AI agents capable of completing tasks. A recent string of agent-powered security incidents has pumped new urgency into the cybersecurity space that WhiteMatter operates in. Other startups have pounced on the business opportunity in agent security, and WhiteMatter's competitors include Onyx Security, Zenity, and Noma. The guardian agents don't run on customers' tokens , but rather on WhiteMatter's self-hosted AI model and GPUs. The compa
