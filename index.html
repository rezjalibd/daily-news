ج در حال ساخت یک دستگاه همجوشی کوچک با انرژی لیزر است تا موج آینده نیروگاه‌های همجوشی را تامین کند. نیروی فیوژن معمولاً تصاویری از تأسیسات صنعتی عظیم با لیزر یا آهنرباهای بزرگ را تداعی می کند، اما یک استارتاپ در کمبریج، ماساچوست، بی سر و صدا در حال ساخت دستگاهی است که می تواند روی میز قرار گیرد. اپتیک دستگاه پشت یون کای، یکی از بنیانگذاران و مدیرعامل صنایع سنگین کمبریج، در حالی که او در یک تماس ویدیویی با من چت می کرد، به نمایش گذاشته شد. این شرکت به صورت مخفیانه در آزمایشگاه کوچکی در نزدیکی MIT فعالیت می کند و کای به TechCrunch نگاهی انحصاری به فناوری در حال توسعه خود ارائه کرد. او به من گفت: \"ما عمدا یک راکتور مدولار کوچک ساختیم. کوچک است، روی میز است.\" \"چون کوچک است، همه چیز را آسان تر می کند.\" اندازه کوچک به کمبریج هوی امکان آزمایش و تکرار سریع را داده است. او گفت: \"ماهیت ماژول کوچک می تواند 50 تا 80 آزمایش، 50 تا 80 عکس در روز را فعال کند.\" داده های این آزمایش ها شبیه سازی هایی را تغذیه می کند که از هوش مصنوعی برای بهینه سازی طراحی استفاده می کنند. این رویکرد زیرک توجه سرمایه گذاران را به خود جلب کرده است. این استارت‌آپ اخیراً با مشارکت Overlay، Neta Foundation، P3A، MassCEC و خانواده Rothrock، یک دور اولیه 6.2 میلیون دلاری به رهبری Azolla Ventures جمع آوری کرده است. راکتور همجوشی کمبریج هوی از لیزر برای فشرده‌سازی یک هدف سوخت استفاده می‌کند، مشابه آزمایش پیشگامانه‌ای که ثابت کرد واکنش‌های همجوشی کنترل‌شده می‌توانند بیش از مصرف انرژی تولید کنند. اما بر خلاف سایر طرح‌های محصورسازی اینرسی، کمبریج هوی تعداد لیزرهای مورد نیاز برای جرقه زدن همجوشی را به حداقل می‌رساند. این سیستم از دو لیزر اصلی برای"}, {"source": "TechCrunch Main", "title": "Licube wants to be the fuel provider to the fusion power industry — see how at TechCrunch Disrupt", "link": "https://techcrunch.com/2026/10/13/licube-wants-to-be-the-fuel-provider-to-the-fusion-power-industry-see-how-at-techcrunch-disrupt/", "summary": "Fusion power plants will need a lot of lithium, and Licube is preparing to be a key supplier.", "date_str": "2026-10-13T20:00:00+00:00", "hash": "640c8688142dd37b", "title_fa": "Licube می‌خواهد تامین‌کننده سوخت صنعت برق فیوژن باشد - نحوه کار را در TechCrunch Disrupt ببینید", "summary_fa": "نیروگاه های فیوژن به مقدار زیادی لیتیوم نیاز دارند و Licube در حال آماده شدن برای تامین کننده کلیدی است. اگر برق همجوشی قطع شود، و نشانه‌هایی وجود داشته باشد که چنین خواهد شد، جهان به لیتیوم بسیار بیشتری نیاز خواهد داشت. این شرط پشت Licube است، استارت‌آپی که دارای مجوز فناوری از دانشگاه هیروساکی در ژاپن است تا لیتیوم-6، شکلی از لیتیوم را که کارخانه‌های همجوشی برای تولید سوخت خود از لیتیوم طبیعی نیاز دارند، خالص کند. دلیل آن به تامین سوخت برمی گردد. خیلی چیزها باید درست پیش برود تا برق فیوژن به شبکه برسد و یکی از آنها سوخت است. اکثر نیروگاه های برنامه ریزی شده با ترکیبی از دو سوخت، دوتریوم و تریتیوم کار می کنند. یافتن دوتریوم آسان است، اما تریتیوم در طبیعت بسیار کمیاب است، و این یک راز آشکار در دنیای همجوشی است که به اندازه کافی برای تامین انرژی هر گیاه برنامه ریزی شده وجود ندارد. راه حل پیشنهادی ساخت تریتیوم در محل، در داخل خود نیروگاه است. یک واکنش همجوشی جریانی از ذرات سریع به نام نوترون را تولید می کند. استارت‌آپ‌ها قصد دارند دور راکتور را با پوششی از لیتیوم احاطه کنند، به طوری که وقتی یک نوترون به اتم لیتیوم برخورد می‌کند، اتم به هلیوم و تریتیوم تقسیم می‌شود. سپس تریتیوم را می توان جمع آوری، خالص کرد و به عنوان سوخت به راکتور برگرداند. همه لیتیوم ها این کار را به یک اندازه خوب انجام نمی دهند. این در دو شکل کمی متفاوت وجود دارد، لیتیوم-6 و لیتیوم-7 که به دلیل وزن آنها نامگذاری شده است. لیتیوم-6 در گرفتن نوترون و تولید تریتیوم به مراتب بهتر است، اما تنها حدود 7.5 درصد از لیتیوم طبیعی را تشکیل می دهد و بقیه لیتیوم-7 سنگین تر است. جداسازی این دو دشوار است، و امروزه ظرفیت کمی برای انجام آن وجود"}, {"source": "TechCrunch Main", "title": "Niobia takes the guesswork out of some of tech’s most expensive mistakes", "link": "https://techcrunch.com/2026/10/13/niobia-takes-the-guesswork-out-of-some-of-techs-most-expensive-mistakes/", "summary": "The San Francisco startup aims to help battery and chip manufacturers identify defects on production lines, reducing downtime and costly mistakes.", "date_str": "2026-10-13T19:00:00+00:00", "hash": "c075562accc38a7a", "title_fa": "Niobia حدس و گمان را از برخی از گران ترین اشتباهات فناوری حذف می کند", "summary_fa": "هدف استارت‌آپ سانفرانسیسکو کمک به تولیدکنندگان باتری و تراشه در شناسایی نقص‌های خطوط تولید، کاهش زمان خرابی و اشتباهات پرهزینه است. استارت‌آپ Niobia مستقر در سانفرانسیسکو روی یک بخش مهم اما اغلب نادیده گرفته شده در ساخت باتری و تراشه شرط‌بندی می‌کند: به مهندسان کمک می‌کند بفهمند چگونه و چرا همه چیز اشتباه می‌شود. نرم‌افزار هوش مصنوعی آن نقص‌های تولید را مشخص می‌کند و به مهندسان اجازه می‌دهد تا از چت‌بات بپرسند که چه چیزی باعث آن‌ها شده است، با هدف ارائه پاسخ‌ها در عرض چند دقیقه به جای چند روز. چگونه کار می کند (به طور کلی): مشتریان این شرکت عوامل هوش مصنوعی را در خطوط تولید خود قرار می دهند تا به دنبال عیوب باشند، سپس مهندسان انسانی را حلقه می زنند تا بفهمند چه چیزی ممکن است باعث شکست یک محصول شود. این عوامل بر روی پردازنده‌های گرافیکی مستقلی که مستقیماً بر روی تجهیزات تولیدی نصب شده‌اند، کار می‌کنند، بسیار شبیه به یک حسگر. آنها می توانند ایرادهایی به اندازه سوراخ سوزنی مانند خراش را تشخیص دهند. هوش مصنوعی Niobia همچنین تمام داده‌ها را در یک مکان جمع‌آوری می‌کند تا مهندسان بتوانند از یک ربات چت بپرسند که چه مشکلی رخ داده است و علت را عمیق‌تر بررسی کنند. سرعت بسیار مهم است زیرا تراشه ها و باتری ها برخی از مهم ترین محصولات جهان هستند، در حالی که به طور فزاینده ای با کمبود مواجه هستند. از آنجایی که تولیدکنندگان به توسعه و بهبود فناوری های خود ادامه می دهند، در طول تحقیق و توسعه همه چیز به ناچار خراب می شود. سپس مهندسان روزها یا بیشتر را صرف یافتن راه حلی قبل از شروع مجدد تولید می کنند. هر نقص یا اشتباهی می‌تواند هزینه‌بر باشد و گاهی به میلیون‌ها دلار می‌رسد و زمان‌بندی تولید را به عقب می‌اندازد. این بسیار طاقچه است. جاها در مورد"}, {"source": "TechCrunch Main", "title": "Rivian’s startup Mind Robotics hires former Ford EV chief Doug Field", "link": "https://techcrunch.com/2026/10/13/rivians-startup-mind-robotics-hires-former-ford-ev-chief-doug-field/", "summary": "Field also worked on Apple's secretive car project and oversaw development of the Tesla Model 3.", "date_str": "2026-10-13T18:30:03+00:00", "hash": "a266ceae9384c526", "title_fa": "استارت آپ مایند رباتیک ریویان، داگ فیلد، رئیس سابق فورد خودروهای برقی را استخدام می کند", "summary_fa": "فیلد همچنین بر روی پروژه ماشین مخفی اپل کار کرد و بر توسعه تسلا مدل 3 نظارت داشت. داگ فیلد روی خودروهای برقی در فورد و تسلا، پروژه نه چندان محرمانه خودرو در اپل کار کرده است و کارمند شماره 1 Segway بود. اکنون مدیر اجرایی توجه خود را به آخرین پروژه RJ Scaringe مدیرعامل Rivian معطوف کرده است: Mind Robotics. Scaringe همچنان با Mind Robotics درگیر خواهد بود، اما جنبه های روزمره کسب و کار، از جمله محصول، مهندسی و عملیات، توسط Field انجام می شود. Mind Robotics که تاکنون بیش از یک میلیارد دلار از Accel، Andreessen Horowitz، Eclipse، Kleiner Perkins و بازوهای سرمایه گذاری فولکس واگن و Salesforce جمع آوری کرده است، در حال ساخت مجموعه کاملی برای تولید صنعتی است. ربات‌های ساخته شده بر روی مدل‌های پایه با هدف خودکارسازی وظایف صنعتی و تولیدی در مقیاس اجرا می‌شوند. برخلاف روبات‌های انسان‌نما که توسط تسلا و دیگران ساخته می‌شوند، اسکارینگ می‌گوید که Mind Robotics تلاشی برای تقلید از تمام بیومکانیک‌های یک انسان نخواهد کرد. این استارت‌آپ همچنین از Rivian به‌عنوان یک محیط تولید زنده و با حجم بالا برای آموزش و استقرار مدل‌ها استفاده می‌کند و ریویان اولین مشتری مایند رباتیک است. Scaringe در Disrupt Stage سه‌شنبه گفت که از شخصی مانند فیلد می‌خواهد که به اجرای Mind Robotics کمک کند، و به همین دلیل با او تماس گرفت تا توصیه‌ای بخواهد. سپس من و او واقعاً شروع به بررسی این موضوع کردیم که چقدر مهم است که ما واقعاً عمیقاً و بسیار عامدانه در مورد اینکه چگونه رباتیک را توسعه می‌دهیم و رباتیک را در جامعه و اقتصاد خود به کار می‌بریم، چنین همسویی را در نحوه تفکر ما در مورد این موضوع از ماموریت کلی کسب و کار پیدا کردیم، اما مهم‌تر این است که ما همسویی واقعاً عمیقی را در نحوه کار هر دو"}, {"source": "TechCrunch Main", "title": "Forget rockets — Longshot wants to fire cargo into space from a gun. See it at TechCrunch Disrupt 2026", "link": "https://techcrunch.com/2026/10/13/forget-rockets-longshot-wants-to-fire-cargo-into-space-from-a-gun-see-it-at-techcrunch-disrupt-2026/", "summary": "Longshot is trying to build a gun big enough to make space data centers a reality.", "date_str": "2026-10-13T18:05:00+00:00", "hash": "2585781eac2dcd2f", "title_fa": "راکت‌ها را فراموش کنید - لانگ‌شات می‌خواهد محموله‌ای را از تفنگ به فضا شلیک کند. آن را در TechCrunch Disrupt 2026 ببینید", "summary_fa": "لانگ شات در تلاش است تا تفنگی بسازد که به اندازه کافی بزرگ باشد تا مراکز داده فضایی را به واقعیت تبدیل کند. راکت ها، بدنام، یک درد واقعی هستند. دوست قدیمی ما، فیزیک، موشک‌ها را مجبور می‌کند تقریباً بدون هیچ جایی برای خطا ساخته شوند، و حتی در آن صورت تنها کسر کوچکی از وزن آن‌ها را به مدار می‌رساند. حداقل در تئوری، راه‌های دیگری برای انجام این کار وجود دارد - آسانسورهای فضایی، سانتریفیوژها، یا یک زنجیره بزرگ که از ماهواره در فضا آویزان شده و محموله‌ها را از زمین جمع‌آوری می‌کند. (Blue Origin قبل از اینکه ایده در رمان نیل استفنسون به پایان برسد، مدتی را صرف فکر کردن در مورد آن کرد.) و سپس ایده ای وجود دارد که به ژول ورن برمی گردد: از یک تفنگ بزرگ برای شلیک یک پرتابه به فضا استفاده کنید. Longshot Space Technology، یک استارت آپ مستقر در آلامدا، کالیفرنیا، دقیقاً روی همین موضوع کار می کند. بنیانگذاران، مدیرعامل مایک گریس و ناتو سایچک مدیر ارشد فناوری، فرصتی را می بینند تا از فناوری استفاده کنند که قبلاً ارزش خود را ثابت کرده است و آن را برای نیاز مبرم به پرتاب فضایی به کار می برند. این استارت آپ حدود 20 میلیون دلار از سرمایه گذاران مخاطره آمیز در خدمت ماموریت خود جمع آوری کرده است. گریس می‌گوید وقتی نوبت به فناوری مرزی می‌رسد، می‌توانید چیزی بسازید که تازگی‌های زیادی داشته باشد، یا می‌توانید کاری واقعاً سخت انجام دهید. شما نمی توانید هر دو را انجام دهید او به اسپیس ایکس به عنوان نمونه‌ای از شرکتی اشاره می‌کند که فناوری کلاسیک بدون ریسک را در نظر گرفته و آن را به شدت افزایش داده است. او می‌گوید کاری که اسپیس ایکس با تحقیقات موشکی ناسا انجام داد، لانگ‌شات با طرح‌های تفنگ‌های چند تزریقی انجام می‌دهد که به پرتابه در"}, {"source": "VentureBeat Tech", "title": "Google makes Gemini 4 Argon broadly available with limited-time low API pricing of $2/$10 per 1M token", "link": "https://venturebeat.com/technology/google-makes-gemini-4-argon-broadly-available-with-limited-time-low-api-pricing-of-2-10-per-1m-token", "summary": "Google is making its new, flagship Gemini 4 Argon multimodal language AI model broadly available today, October 13. Read more", "date_str": "2026-10-13T16:08:53+00:00", "hash": "bd98f05956c29ef8", "title_fa": "گوگل Gemini 4 Argon را با قیمت محدود API در مدت زمان محدود 2/10 دلار به ازای هر 1 میلیون توکن در دسترس قرار می دهد.", "summary_fa": "گوگل امروز، 13 اکتبر، مدل جدید و پرچمدار جدید خود را با زبان چندوجهی Gemini 4 Argon به طور گسترده در دسترس قرار می دهد. بیشتر بخوانید"}, {"source": "Ars Technica", "title": "Anthropic warns small AI models could self-replicate through IoT devices", "link": "https://arstechnica.com/security/2026/10/anthropic-warns-small-ai-models-could-self-replicate-through-iot-devices/", "summary": "AI company Anthropic is warning that advances in small AI models could soon usher in a new era of self-replicating malware that’s capable of infecting smart fridges, vacuum cleaners, and a wide range of other Internet-of-things devices and is more resistant to takedown. By next year, smaller AI models may be able to autonomously self-replicate on all kinds of IoT devices, the company said. Eventually, the capability could enable computer worms, which propagate without requiring human interaction and are capable of infecting unfamiliar IoT devices. An experiment the company performed recently revealed significant challenges in bringing such an AI malware replicator to fruition, so the finding is necessarily tempered. Still, the results do raise concerns about the possibility of new forms of computer worms. Challenging to shut down Anthropic further warned not only about the new potential malware, but also that it could be difficult to stop. In its blog post, it wrote that “a replicator like this would be challenging to shut down, since there’s no centralized point to shut off—though it may be slow (with a doubling time of days). Unlike non-AI malware, it could also figure out unfamiliar devices on its own.” Read full article Comments", "date_str": "2026-10-14T12:55:06+00:00", "hash": "15dc6ddd5508ee6d", "title_fa": "آنتروپیک هشدار می‌دهد که مدل‌های کوچک هوش مصنوعی می‌توانند از طریق دستگاه‌های اینترنت اشیاء خود تکرار شوند", "summary_fa": "شرکت هوش مصنوعی Anthropic هشدار می دهد که پیشرفت در مدل های کوچک هوش مصنوعی می تواند به زودی دوره جدیدی از بدافزارهای خود-تکثیر شونده را آغاز کند که می تواند یخچال های هوشمند، جاروبرقی ها و طیف گسترده ای از سایر دستگاه های اینترنت اشیاء را آلوده کند و در برابر حذف مقاوم تر است. به گفته این شرکت، تا سال آینده، مدل‌های کوچک‌تر هوش مصنوعی ممکن است بتوانند به‌طور خودکار روی انواع دستگاه‌های اینترنت اشیا تکثیر شوند. در نهایت، این قابلیت می‌تواند کرم‌های رایانه‌ای را فعال کند که بدون نیاز به تعامل انسانی منتشر می‌شوند و می‌توانند دستگاه‌های اینترنت اشیا ناآشنا را آلوده کنند. آزمایشی که این شرکت اخیرا انجام داد، چالش‌های مهمی را در به ثمر رساندن چنین بدافزاری مشابه هوش مصنوعی نشان داد، بنابراین این یافته لزوماً تعدیل می‌شود. با این حال، نتایج نگرانی‌هایی را در مورد امکان شکل‌های جدیدی از کرم‌های کامپیوتری ایجاد می‌کند. چالش برای خاموش کردن Anthropic نه تنها در مورد بدافزار جدید بالقوه هشدار می دهد، بلکه همچنین می تواند متوقف کردن آن دشوار باشد. در پست وبلاگ خود نوشت که «تعویض کننده ای مانند این برای خاموش شدن چالش برانگیز است، زیرا هیچ نقطه متمرکزی برای خاموش کردن وجود ندارد – اگرچه ممکن است کند باشد (با دو برابر شدن زمان روزها). برخلاف بدافزارهای غیر هوش مصنوعی، می‌تواند دستگاه‌های ناآشنا را نیز به تنهایی کشف کند. خواندن مقاله کامل نظرات تنظیمات متن اندازه متن داستان کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش هوش مصنوعی شرکت Anthropic هشدار می دهد که پیشرفت در مدل های کوچک هوش مصنوعی می تواند به زودی آغازگر دوره جدیدی از بدافزارهای خود-تکثیر شونده باشد که قادر به آلوده کردن دستگاه های پاک کننده هوشمند اینترنت و گستره وسیع تری از دستگاه های پاک کننده اینترنت، و"}, {"source": "Ars Technica", "title": "The Internet’s undersea backbone is slipping into the danger zone", "link": "https://arstechnica.com/gadgets/2026/10/the-internets-undersea-backbone-is-slipping-into-to-the-danger-zone/", "summary": "Despite the expansion of Starlink and other communications satellite services, most of the world’s Internet traffic still travels through subsea cables crisscrossing the ocean floors. Those fiber-optic cables coexist with a network of oil and gas pipelines and submarine power cables—and all these crucial links connecting countries and continents now face growing sabotage risks as gray-zone warfare and open conflicts have become widespread. The rising risks to the world’s invisible infrastructure beneath the waves are the main subject of a new book by Elisabeth Braw , a senior fellow at the Atlantic Council who leads the Threats to the Global Maritime Order Initiative . Her book, titled Undersea War , explores the modern rise in suspicious incidents in which ships dragging their anchors for unusually long periods have cut or damaged undersea cables and pipelines from the Baltic Sea to the Pacific Ocean. Braw acknowledges that about 60 percent of undersea cable damage is primarily due to human error during fishing and shipping activities, when weighted nets or anchors drag across the seabed. Natural hazards such as storms and undersea landslides also account for a smaller proportion of such incidents. In total, between 150 and 200 cables are damaged each year and usually repaired quickly. Read full article Comments", "date_str": "2026-10-14T11:15:24+00:00", "hash": "caba42751513e02a", "title_fa": "ستون فقرات زیردریایی اینترنت در حال لغزش به منطقه خطر است", "summary_fa": "علیرغم گسترش Starlink و سایر خدمات ماهواره ای ارتباطی، بیشتر ترافیک اینترنت جهان همچنان از طریق کابل های زیر دریا که از کف اقیانوس ها عبور می کنند، عبور می کند. این کابل‌های فیبر نوری با شبکه‌ای از خطوط لوله نفت و گاز و کابل‌های برق زیردریایی همزیستی دارند - و همه این پیوندهای حیاتی که کشورها و قاره‌ها را به هم متصل می‌کنند، اکنون با گسترش گسترده جنگ‌های منطقه خاکستری و درگیری‌های آشکار با خطرات خرابکاری رو به رشد روبرو هستند. خطرات فزاینده برای زیرساخت های نامرئی جهان در زیر امواج موضوع اصلی کتاب جدید الیزابت براو، یکی از اعضای ارشد شورای آتلانتیک است که تهدیدات به ابتکار نظم جهانی دریایی را رهبری می کند. کتاب او با عنوان جنگ زیردریایی، افزایش مدرن حوادث مشکوک را بررسی می‌کند که در آن کشتی‌هایی که لنگرهای خود را برای دوره‌های غیرعادی طولانی می‌کشند کابل‌ها و خطوط لوله زیردریایی از دریای بالتیک به اقیانوس آرام را قطع یا آسیب می‌رسانند. براو اذعان می‌کند که حدود 60 درصد آسیب کابل‌های زیردریایی عمدتاً به دلیل خطای انسانی در طول فعالیت‌های ماهیگیری و کشتی‌رانی است، زمانی که تورهای سنگین یا لنگرها از بستر دریا می‌کشند. خطرات طبیعی مانند طوفان و رانش زمین در زیر دریا نیز سهم کمتری از چنین حوادثی را تشکیل می دهند. در مجموع سالانه بین 150 تا 200 کابل آسیب می بینند و معمولاً به سرعت تعمیر می شوند. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید با وجود گسترش Starlink و سایر سرویس های ماهواره ای ارتباطی، بیشتر ترافیک اینترنت جهان همچنان از طریق کابل های زیردریایی عبور می کند که از کف اقیانوس ها عبور می کنند. این کابل‌های فیبر نوری با شبکه‌ای از خطوط لوله نفت و گاز و کابل‌های برق زیردریایی"}, {"source": "Ars Technica", "title": "OpenAI, Google pushing new AI models easily tricked into making nudes, researchers say", "link": "https://arstechnica.com/tech-policy/2026/10/openai-google-pushing-new-ai-models-easily-tricked-into-making-nudes-researchers-say/", "summary": "Safety researchers continue to warn that a large volume of AI-generated explicit content is spreading unchecked, while regulators do little to meaningfully stop it. This non-consensual content is commonly shared in text and direct messages or stored in private clouds where it’s less likely to be detected or reported, a Google co-authored study of Internet users across the United States, Australia, and the United Kingdom found this July. That’s why the “most critical intervention point” remains at the source: the harmful AI tools used to make the fake sexual images, Google researchers concluded. Yet red-teaming in recent months suggests that as some of the leading AI image generators from Google and OpenAI become more capable, they may be getting worse at blocking explicit outputs. Read full article Comments", "date_str": "2026-10-14T11:00:30+00:00", "hash": "3b97e9d3ae34d8f2", "title_fa": "محققان می گویند OpenAI، گوگل مدل های جدید هوش مصنوعی را به راحتی فریب داد تا برهنه شوند", "summary_fa": "محققان ایمنی همچنان هشدار می‌دهند که حجم زیادی از محتوای صریح تولید شده توسط هوش مصنوعی بدون کنترل منتشر می‌شود، در حالی که تنظیم‌کننده‌ها کاری برای متوقف کردن معنی‌دار آن انجام نمی‌دهند. این محتوای غیر توافقی معمولاً در پیام‌های متنی و مستقیم به اشتراک گذاشته می‌شود یا در ابرهای خصوصی ذخیره می‌شود، جایی که احتمال شناسایی یا گزارش آن کمتر است، مطالعه‌ای که توسط Google در ژوئیه امسال روی کاربران اینترنت در سراسر ایالات متحده، استرالیا و بریتانیا انجام شد نشان داد. به همین دلیل است که \"بحرانی ترین نقطه مداخله\" در منبع باقی می ماند: ابزارهای مضر هوش مصنوعی که برای ساختن تصاویر جنسی جعلی استفاده می شود، محققان گوگل نتیجه گرفتند. با این حال، تیم قرمز در ماه‌های اخیر نشان می‌دهد که وقتی برخی از تولیدکننده‌های تصویر هوش مصنوعی گوگل و OpenAI توانمندتر می‌شوند، ممکن است در مسدود کردن خروجی‌های صریح بدتر شوند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید محققان ایمنی همچنان به هشدار می دهند که حجم زیادی از محتوای صریح تولید شده توسط هوش مصنوعی کنترل نشده منتشر می شود، در حالی که تنظیم کننده ها برای متوقف کردن معنی دار آن کاری انجام نمی دهند. محققان در White Circle، یک شرکت عام المنفعه با حمایت رهبران و محققان ارشد Anthropic، DeepMind، Hugging Face و OpenAI پرچم قرمز را برافراشتند. این شرکت پس از آن تأسیس شد که دنیس شیلوف، یکی از معروف‌ترین جیلبریک‌های جهانی مدل‌های پیشرو را در اکتبر 2024 منتشر کرد. White Circle به دنبال شکستن مدل‌ها برای انجام آزمایش‌های ایمنی کامل، به شرکت‌ها کمک می‌کند تا هنگام پیاده‌سازی سیستم‌های هوش مصنوعی پیشرفته که ممکن است همیشه آن‌طور که انتظار می‌رود رفتار نکنند، تهدیدات را شناسایی کرده و از آن"}, {"source": "Ars Technica", "title": "Martin Shkreli livestreamed himself violating lifetime pharma ban, FTC says", "link": "https://arstechnica.com/health/2026/10/martin-shkreli-livestreamed-himself-violating-lifetime-pharma-ban-ftc-says/", "summary": "Martin Shkreli—the ex-pharmaceutical executive infamous for illegally hiking the price of a lifesaving anti-parasitic drug by more than 4,000 percent and getting a seven-year prison sentence for the fraudulent scheme he used to do it— has been under a lifetime ban from the pharmaceutical industry since 2022. However, according to the Federal Trade Commission and the attorneys general of seven states, Shkreli has \"flagrantly and repeatedly\" violated that ban nearly the entire time—allegedly by trading stock in dozens of drug companies and discussing the industry during livestreams on social media. On Tuesday, the FTC and the seven states asked a federal judge to hold Shkreli in contempt for the alleged violations. The states include New York, California, Illinois, North Carolina, Ohio, Pennsylvania, and Virginia—the same states that joined the FTC in suing Shkreli in 2020 over the \"elaborate anticompetitive scheme\" involving the anti-parasitic drug, Daraprim. The scheme raised the price from $17.50 per pill to $750 per pill virtually overnight, while blocking generic competitors from entering the market. Read full article Comments", "date_str": "2026-10-13T22:48:12+00:00", "hash": "f2e3b1302e7fc07c", "title_fa": "FTC می‌گوید مارتین شکرلی پخش زنده خود را در حال نقض ممنوعیت مادام العمر داروسازی پخش کرد", "summary_fa": "مارتین شکرلی - مدیر سابق داروسازی بدنام به دلیل افزایش غیرقانونی قیمت یک داروی ضد انگلی نجات دهنده برای بیش از 4000 درصد و صدور حکم هفت سال زندان به دلیل طرح کلاهبرداری که انجام می داد - از سال 2022 تحت تحریم مادام العمر صنعت داروسازی قرار دارد. با این حال، به گفته کمیسیون تجارت فدرال و دادستان‌های کل هفت ایالت، شکرلی تقریباً در تمام مدت این ممنوعیت را \"به طور مکرر و آشکار\" نقض کرده است - ظاهراً با معامله سهام در ده‌ها شرکت دارویی و بحث در مورد صنعت در جریان پخش زنده در رسانه‌های اجتماعی. روز سه‌شنبه، FTC و هفت ایالت از یک قاضی فدرال خواستند تا شرلی را به خاطر نقض‌های ادعایی تحقیر کند. این ایالت ها شامل نیویورک، کالیفرنیا، ایلینویز، کارولینای شمالی، اوهایو، پنسیلوانیا و ویرجینیا هستند - همان ایالت هایی که در سال 2020 به FTC در شکایت از شرلی به دلیل \"طرح پیچیده ضد رقابتی\" مربوط به داروی ضد انگلی داراپریم پیوستند. این طرح تقریباً یک شبه قیمت را از 17.50 دلار به ازای هر قرص به 750 دلار در هر قرص افزایش داد و در عین حال مانع از ورود رقبای ژنریک به بازار شد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید مارتین شکرلی را به حداقل برسانید—مدیر سابق داروسازی بدنام به افزایش غیرقانونی قیمت یک داروی ضد انگلی نجات دهنده تا بیش از 4000 درصد—و محکوم به هفت سال حبس برای استفاده از آن شده است. ممنوعیت مادام العمر از صنعت داروسازی از سال 2022. در سال 2022، دادگاه فدرال «جدی بودن» صدور چنین ممنوعیتی مادام‌العمر را به رسمیت شناخت، اما حکم داد که «رفتار غیرقانونی فاحش، عمدی، تکراری، طولانی‌مدت و در نهایت خطرناک شرلی، حکمی را در این محدوده صادر می‌کند»."}, {"source": "Ars Technica", "title": "ESA targets Anbernic emulation handhelds as \"superfake\" piracy enablers", "link": "https://arstechnica.com/gaming/2026/10/esa-targets-anbernic-emulation-handhelds-as-superfake-piracy-enablers/", "summary": "For years, Chinese hardware manufacturers have carved out a market niche with an array of handheld Android gaming devices focused on retro emulation and/or more modern game-streaming capabilities. Now, though, a major game industry trade group is targeting one of those manufacturers, Anbernic, asking the US Trade Representative (USTR) to add the company to its list of \"Notorious Markets\" that \"engage in or facilitate substantial copyright piracy or trademark counterfeiting.\" TorrentFreak was among the first to notice the request from the Entertainment Software Association (ESA), which was submitted to the USTR last week. In it, the US trade group—which represents major publishers including Nintendo, Microsoft, PlayStation, Amazon, Epic, EA, Ubisoft, and more —notes that Anbernic devices \"are routinely offered or shipped with removable memory cards preloaded with hundreds or thousands of unauthorized copies of copyright-protected video games published by ESA members.\" While many online sellers do include an SD card full of ROMs alongside emulation hardware of all types, Anbernic itself does not appear to do the same when selling directly from its website. Regardless, the ESA argues that these ROM-laden Anbernic devices selling through \"normal retail channels\" help to \"normalize hardware-based piracy by delivering illicit catalogues through a polished consumer product.\" This, the ESA says, meets the threshold for a \"superfake,\" an ill-defined designation that applies to \"high-quality counterfeit trademark goods ... on a commercial scale.\" Read full article Comments", "date_str": "2026-10-13T21:55:49+00:00", "hash": "6c367b346cb6610b", "title_fa": "ESA دستگاه‌های شبیه‌سازی Anbernic را به‌عنوان فعال‌کننده‌های دزدی دریایی «سوپرجعلی» هدف قرار می‌دهد", "summary_fa": "برای سال‌ها، سازندگان سخت‌افزار چینی با مجموعه‌ای از دستگاه‌های بازی اندرویدی دستی که بر شبیه‌سازی یکپارچه‌سازی با سیستم‌عامل و/یا قابلیت‌های مدرن‌تر پخش بازی متمرکز شده‌اند، جایگاهی در بازار ایجاد کرده‌اند. با این حال، اکنون یک گروه تجاری بزرگ صنعت بازی یکی از آن تولیدکنندگان به نام Anbernic را هدف قرار داده است و از نماینده تجاری ایالات متحده (USTR) می خواهد که این شرکت را به لیست \"بازارهای بدنام\" خود اضافه کند که \"در دزدی حقوق کپی رایت یا جعل علائم تجاری شرکت می کنند یا تسهیل می کنند.\" TorrentFreak جزو اولین کسانی بود که متوجه درخواست انجمن نرم افزار سرگرمی (ESA) شد که هفته گذشته به USTR ارسال شد. در آن، گروه تجاری ایالات متحده - که نماینده ناشران اصلی از جمله نینتندو، مایکروسافت، پلی استیشن، آمازون، اپیک، EA، یوبی‌سافت و غیره است- خاطرنشان می‌کند که دستگاه‌های Anbernic \"به طور معمول با کارت‌های حافظه قابل جابجایی ارائه یا ارسال می‌شوند که با صدها یا هزاران کپی غیرمجاز از بازی‌های ویدیویی محافظت‌شده ESA منتشر شده‌اند.\" در حالی که بسیاری از فروشندگان آنلاین دارای یک کارت SD پر از رام در کنار سخت‌افزار شبیه‌سازی از همه نوع هستند، به نظر نمی‌رسد که Anbernic هنگام فروش مستقیم از وب‌سایت خود، همین کار را انجام دهد. صرف نظر از این، ESA استدلال می‌کند که این دستگاه‌های Anbernic مملو از رام که از طریق «کانال‌های خرده‌فروشی معمولی» به فروش می‌رسند، به «عادی‌سازی دزدی دریایی مبتنی بر سخت‌افزار با ارائه کاتالوگ‌های غیرقانونی از طریق یک محصول مصرفی صیقلی» کمک می‌کنند. ESA می‌گوید که این به آستانه یک «سوپر جعلی» می‌رسد، یک نام نامشخص که برای «کالاهای با علامت تجاری تقلبی با کیفیت بالا... در مقیاس تجاری.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای ناوبری به حداقل"}, {"source": "Ars Technica", "title": "Topgolf saved over $11.3 million after leaving VMware", "link": "https://arstechnica.com/information-technology/2026/10/topgolf-saved-over-11-3-million-after-leaving-vmware/", "summary": "Topgolf’s VMware costs were going to increase by 400 percent under Broadcom. To avoid that cost, the sports entertainment company moved 12,000 virtual machines (VMs) to VergeIO’s VergeOS and has saved over $11 million so far. Before migrating, Topgolf’s VMware connection “ran very deep,” Scott Forehand, Topgolf’s global infrastructure manager, told Ars Technica. Topgolf has over 100 locations worldwide featuring interactive golf games with real-time shot tracking and digital analytics. The company used vSphere and ESXi for decades and started using VxRail, the hyperconverged infrastructure (HCI) platform that VMware co-engineered with Dell, in 2017. Topgolf employees previously participated in numerous VMware customer councils and have been interviewed for books on how Topgolf used vSphere and Horizon (now Omnissa Horizon), per Forehand, who is a leader of the Dallas/Ft. Worth VMware User Group . Read full article Comments", "date_str": "2026-10-13T21:33:43+00:00", "hash": "7c7464626dbc298e", "title_fa": "Topgolf پس از ترک VMware بیش از 11.3 میلیون دلار پس انداز کرد", "summary_fa": "هزینه‌های VMware Topgolf تحت برودکام 400 درصد افزایش می‌یابد. برای جلوگیری از این هزینه، شرکت سرگرمی های ورزشی 12000 ماشین مجازی (VM) را به VergeOS VergeOS منتقل کرد و تاکنون بیش از 11 میلیون دلار صرفه جویی کرده است. اسکات فورهند، مدیر زیرساخت جهانی تاپ گلف، به Ars Technica گفت، قبل از مهاجرت، اتصال VMware Topgolf \"بسیار عمیق بود\". Topgolf بیش از 100 مکان در سراسر جهان دارد که دارای بازی‌های گلف تعاملی با ردیابی ضربه‌های لحظه‌ای و تجزیه و تحلیل دیجیتال است. این شرکت برای چندین دهه از vSphere و ESXi استفاده کرد و شروع به استفاده از VxRail، پلتفرم زیرساخت های فوق همگرا (HCI) کرد که VMware با همکاری Dell در سال 2017 مهندسی کرد. کارمندان Topgolf قبلاً در بسیاری از شوراهای مشتریان VMware شرکت کرده بودند و برای کتاب هایی در مورد نحوه استفاده Topgolf از vSphere و Horizoneh، یکی از رهبران، از Horizonowm و Horizoneh مصاحبه شده اند. دالاس/فوت ارزش گروه کاربری VMware . مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش هزینه های VMware Topgolf تا 400 درصد تحت Broadcom افزایش می یابد. برای جلوگیری از این هزینه، شرکت سرگرمی های ورزشی 12000 ماشین مجازی (VM) را به VergeOS VergeOS منتقل کرد و تاکنون بیش از 11 میلیون دلار صرفه جویی کرده است. اما تصمیم Broadcom برای توقف فروش مجوزهای دائمی VMware و بسته‌بندی محصولات VMware به SKUهای کمتر، بزرگ‌تر و گران‌تر باعث شد تا Topgolf و همچنین بسیاری از مشتریان VMware به جای دیگری نگاه کنند. با تغییرات استراتژیک VMware که برنامه‌ریزی‌های آینده را پیچیده می‌کند، Topgolf تصمیم گرفت تا حجم‌های کاری درون محل خود، از جمله موارد مربوط به مکان‌ها، دفاتر، آزمایشگاه‌ها و مراکز داده خود را تغییر دهد."}, {"source": "Ars Technica", "title": "Trump commercial railing against his enemies kept airing after court blocked it", "link": "https://arstechnica.com/tech-policy/2026/10/trumps-taxpayer-funded-ads-kept-airing-on-tv-the-day-after-judge-blocked-them/", "summary": "Trump commercials paid for by the US government continued airing on TV the day after a judge blocked the ads because they likely violate a US law against government-funded publicity or propaganda. In the most widely aired commercial, Trump railed against his perceived enemies and said he would \"liberate America from these villains once and for all.” The campaign also included a commercial praising Trump's record as president, another in which Trump calls the US the \"most exceptional nation ever to exist in human history,\" and commercials related to the Iran war and the capture of Venezuelan President Nicolás Maduro. US District Judge Jennifer Rochon issued a temporary restraining order (TRO) blocking the ads on Sunday, October 11, which took effect at 6:45 pm that night. The order said the government must cancel the ads, \"including those placements for the evening of October 11, 2026.\" Read full article Comments", "date_str": "2026-10-13T19:50:37+00:00", "hash": "588ec2167bda61e8", "title_fa": "نرده های تجاری ترامپ علیه دشمنانش پس از ممانعت دادگاه همچنان پخش می شد", "summary_fa": "آگهی‌های تبلیغاتی ترامپ که دولت ایالات متحده هزینه آن را پرداخت کرده بود، یک روز پس از اینکه قاضی تبلیغات را مسدود کرد، به پخش تلویزیونی ادامه داد، زیرا احتمالاً قوانین ایالات متحده علیه تبلیغات یا تبلیغات دولتی را نقض می‌کند. ترامپ در پخش گسترده‌ترین تبلیغات بازرگانی، دشمنان خود را مورد انتقاد قرار داد و گفت که «آمریکا را یک بار برای همیشه از شر این شروران آزاد می‌کند». این کمپین همچنین شامل تبلیغاتی بود که از سوابق ترامپ به عنوان رئیس جمهور تمجید می کرد، دیگری که در آن ترامپ ایالات متحده را «استثنایی ترین ملتی است که تا به حال در تاریخ بشریت وجود داشته است» و تبلیغات مربوط به جنگ ایران و دستگیری نیکلاس مادورو، رئیس جمهور ونزوئلا. قاضی ناحیه ایالات متحده جنیفر روچون دستور منع موقت (TRO) را برای مسدود کردن تبلیغات در روز یکشنبه 11 اکتبر صادر کرد که در ساعت 6:45 بعد از ظهر همان شب اجرایی شد. در این دستور آمده است که دولت باید تبلیغات را لغو کند، «از جمله آن قرار دادن‌ها برای عصر 11 اکتبر 2026». مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش آگهی های تبلیغاتی ترامپ که توسط دولت ایالات متحده پرداخت شده است، پخش آن از تلویزیون ادامه پیدا کرد، روز بعد از اینکه قاضی تبلیغات را مسدود کرد، زیرا احتمالاً قوانین ایالات متحده را علیه تبلیغات یا تبلیغات با بودجه دولت نقض می کند. دولت ترامپ در 10 اکتبر به دادگاه گفته بود که خرید تبلیغاتی وزارت امنیت داخلی (DHS) قرار است در 11 اکتبر به پایان برسد و تمدید نخواهد شد. با وجود آن، پخش تبلیغات در شب 11 اکتبر و در بخشی از 12 اکتبر ادامه یافت. این نیز یک هفته پس از بیانیه 5"}, {"source": "Ars Technica", "title": "Disney offers $20M for Character.AI’s scandal-plagued chatbot tech", "link": "https://arstechnica.com/tech-policy/2026/10/disney-offers-20m-for-character-ais-scandal-plagued-chatbot-tech/", "summary": "In a bankruptcy proceeding that kicked off yesterday, Disney has offered to buy some of the technology that powers the controversy-plagued chatbot Character.AI. Disney is willing to pay $20 million for “a non-exclusive perpetual license” of certain Character Technologies intellectual property, the chatbot maker said in a press release that did not go into much further detail on which assets Disney wanted. The move may be surprising. In September 2025, Disney joined others in publicly criticizing Character.AI for stealing content and harming kids. Specifically, Disney sent a strongly worded cease-and-desist letter that accused Character Technologies of weaponizing Disney characters “in a way that could damage its brand long term,” Axios reported . Read full article Comments", "date_str": "2026-10-13T18:23:33+00:00", "hash": "7d39b9c5d5289228", "title_fa": "دیزنی 20 میلیون دلار برای فناوری ربات چت Character.AI ارائه می دهد", "summary_fa": "در یک روند ورشکستگی که دیروز آغاز شد، دیزنی پیشنهاد خرید برخی از فناوری‌هایی را داده است که به ربات گفتگوی جنجالی Character.AI کمک می‌کند. سازنده چت بات در بیانیه‌ای مطبوعاتی که به جزئیات بیشتر در مورد دارایی‌هایی که دیزنی می‌خواهد اشاره نکرد، گفت که دیزنی مایل است ۲۰ میلیون دلار برای «مجوز دائمی غیر انحصاری» مالکیت معنوی خاصی از Character Technologies بپردازد. این حرکت ممکن است تعجب آور باشد. در سپتامبر 2025، دیزنی در انتقاد علنی از Character.AI به دلیل سرقت محتوا و آسیب رساندن به کودکان، به دیگران پیوست. به‌طور خاص، دیزنی نامه‌ای با عنوان توقف و توقف ارسال کرد که Character Technologies را متهم کرد که شخصیت‌های دیزنی را «به نحوی که می‌تواند به برند آن در درازمدت آسیب برساند» متهم کرده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید در یک روند ورشکستگی که دیروز آغاز شد، دیزنی پیشنهاد خرید برخی از فناوری هایی را داده است که ربات گفتگوی جنجالی Character.AI را تقویت می کند. دیزنی در آن زمان نوشت: «چت‌ربات‌های متخلف Character.AI، در برخی موارد، به‌عنوان استثمار جنسی شناخته می‌شوند و برای کودکان مضر و خطرناک هستند، مشتریان دیزنی را توهین می‌کنند و به شدت به اعتبار و حسن نیت دیزنی آسیب می‌زنند». ددلاین گزارش داد که این رسوایی با پاک کردن شخصیت های متعلق به دیزنی توسط Character Technologies از پلتفرم خود به پایان رسید، اما از آن زمان، دیزنی رئیس سابق Character.AI کاراندیپ آناند را به عنوان اولین مدیر ارشد فناوری خود استخدام کرده است. دیزنی به درخواست Ars برای اظهار نظر در مورد اینکه آیا این شرکت قصد دارد از فناوری Character.AI در محصولات کودکان استفاده کند یا خیر، پاسخی نداد."}, {"source": "Ars Technica", "title": "Skydance’s Discovery+ prices increase by up to 20 percent", "link": "https://arstechnica.com/gadgets/2026/10/skydances-discovery-prices-increase-by-up-to-20-percent/", "summary": "Discovery+ subscription prices went up today. Ad-free plans for new subscribers went from $10 per month to $12/month. Ad-based plans went from $6 to $7. The new prices take effect for new subscribers immediately. Current subscribers to the streaming service, which primarily features unscripted content, like reality shows and documentaries, will receive 30 days’ notice before the new prices take effect, starting with bills issued as of November 12. Read full article Comments", "date_str": "2026-10-13T18:06:06+00:00", "hash": "f56b92338816d876", "title_fa": "قیمت Skydance's Discovery+ تا 20 درصد افزایش می یابد", "summary_fa": "قیمت اشتراک Discovery+ امروز افزایش یافت. برنامه های بدون آگهی برای مشترکین جدید از 10 دلار در ماه به 12 دلار در ماه رسید. برنامه های مبتنی بر آگهی از 6 دلار به 7 دلار رسید. قیمت های جدید بلافاصله برای مشترکین جدید اعمال می شود. مشترکین فعلی سرویس پخش، که عمدتاً دارای محتوای بدون اسکریپت، مانند نمایش های واقعیت و مستند است، 30 روز قبل از اعمال قیمت های جدید اخطار دریافت خواهند کرد که از تاریخ 12 نوامبر شروع می شود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش Discovery+ قیمت اشتراک امروز افزایش یافت. قیمت‌های بالاتر یک هفته پس از خرید پارامونت اسکای‌دنس، شرکت مادر دیسکاوری+ برادران وارنر دیسکاوری (WBD) است که Skydance را تشکیل داد. با این حال، یکی از سخنگویان Skydance به Ars Technica گفت که تغییرات قیمت‌گذاری قبل از اینکه Discovery+ از تاریخ پایان ادغام مطلع شود در حال انجام است و برای ادغام برنامه‌ریزی نشده است. سخنگوی گفت که قیمت‌های Discovery+ به طور مرتب ارزیابی می‌شوند تا اطمینان حاصل شود که مطابق با محتوا و تجربه‌ای است که سرویس ارائه می‌دهد و قیمت‌های جدید منعکس کننده آن هستند. Discovery+ از زمان عرضه در سال 2012، قیمت های خود را سه برابر افزایش داده است. قبل از امروز، جدیدترین افزایش قیمت در ژانویه 2025 اتفاق افتاد، زمانی که اشتراک ماهانه مبتنی بر آگهی از 5 دلار به 6 دلار افزایش یافت و برنامه های بدون آگهی از 9 دلار به 10 دلار رسید. Discovery+ یک سرمایه‌گذاری کوچک‌تر برای WBD است که سرویس پخش اصلی آن HBO Max بود. با این حال، این سرویس حداقل از سال 2023 سودآور بوده است و مدیران به نرخ پایین لغو آن اشاره کرده اند. جی بی"}, {"source": "Ars Technica", "title": "The Paris Auto Show is full of interesting cars Americans can’t have", "link": "https://arstechnica.com/cars/2026/10/europe-shows-a-better-alternative-to-big-suvs-at-the-paris-auto-show/", "summary": "Perhaps the days when auto shows debuted new models aren’t entirely over. The big trade shows for cars were a gateway drug for many, expos where you could see the newest models of today and the concepts of tomorrow. But automakers increasingly got tired of sharing the spotlight with each other. New reveals moved offsite to events the night or even the week before the show itself. One by one, brands pulled out of auto show after auto show until there was little left to see . And then the pandemic hit. But the news out of Paris, where its auto show held media day yesterday, seems like we stepped back into a time when automakers would debut new cars aplenty. That retro vibe extends to the cars themselves, with plenty of familiar nameplates reimagined. France’s Renault has a long and glorious history of delightful concept cars, and more on what it brought to Paris later. But the star of the show was arguably Stellantis, with strong work from Citroen, Peugeot, and Fiat, to name but three. But this article is meant to irritate you, because I’m pretty sure none of the stuff you’re seeing here will come to the United States. And it’s doubly irritating considering what Stellantis’ brands do offer us over here, doubling down on the same malign trends I saw back in 2020 : did you know they’re about to relaunch a V8 Hellcat-powered Charger ? Read full article Comments", "date_str": "2026-10-13T17:33:20+00:00", "hash": "5eaa3e4379e917ca", "title_fa": "نمایشگاه خودرو پاریس مملو از خودروهای جالبی است که آمریکایی ها نمی توانند داشته باشند", "summary_fa": "شاید روزهایی که نمایشگاه‌های خودکار مدل‌های جدید را معرفی می‌کردند، کاملاً به پایان نرسیده باشند. نمایشگاه‌های بزرگ اتومبیل‌ها برای بسیاری دروازه‌ای دارو بود، نمایشگاه‌هایی که می‌توانستید جدیدترین مدل‌های امروز و مفاهیم فردا را ببینید. اما خودروسازان به طور فزاینده ای از به اشتراک گذاشتن کانون توجه با یکدیگر خسته شدند. افشاگرهای جدید شب یا حتی هفته قبل از خود نمایش خارج از سایت به رویدادها منتقل شدند. یکی یکی، برندها بعد از نمایشگاه خودرو از نمایشگاه خودرو خارج شدند تا جایی که چیز زیادی برای دیدن باقی نمانده بود. و سپس همه گیری شیوع پیدا کرد. اما اخبار منتشر شده از پاریس، جایی که نمایشگاه خودروی آن دیروز در روز رسانه ای برگزار شد، به نظر می رسد که ما به زمانی بازگشته ایم که خودروسازان به وفور خودروهای جدید را عرضه می کردند. این حال و هوای یکپارچهسازی با سیستمعامل به خود خودروها نیز گسترش می یابد، با تعداد زیادی از پلاک های آشنا که دوباره تجسم شده اند. رنو فرانسه دارای تاریخچه طولانی و باشکوهی از خودروهای مفهومی لذت بخش است و بیشتر در مورد آنچه که بعداً به پاریس آورد. اما ستاره این نمایشگاه مسلماً Stellantis بود، با کارهای قوی از سیتروئن، پژو و فیات، به جز سه مورد. اما این مقاله قصد دارد شما را آزار دهد، زیرا مطمئنم هیچ یک از مطالبی که در اینجا می‌بینید به ایالات متحده نمی‌آیند. و با توجه به آنچه که مارک‌های Stellantis در اینجا به ما ارائه می‌دهند، دو برابر آزاردهنده است، با دو برابر شدن روند بدی که در سال 2020 دیدم: آیا می‌دانستید که آن‌ها در شرف راه‌اندازی مجدد شارژر V8 Hellcat هستند؟ مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید شاید روزهایی که نمایش‌های"}, {"source": "Ars Technica", "title": "Google wants to host your personal vibe-coded apps in the Play Store", "link": "https://arstechnica.com/google/2026/10/google-wants-to-host-your-personal-vibe-coded-apps-in-the-play-store/", "summary": "Google has already added a few AI features to the Play Store, but a lot more are coming . The previously released Ask Play feature is expanding to offer more AI-powered discovery options in Google's app store, and Google is also using AI to build a recommendation engine called Game Finder. For people who have embraced AI to build their own apps, the Play Store will soon offer a way to privately host and share those creations. Google rolled out Ask Play in 2025 as a small chatbot interface on Play Store listings. It lets you ask questions about an app or game, either by typing it in manually or choosing from a list of suggested queries. Starting today, Ask Play is expanding into a more general way to search for apps and games. You ask the robot questions, and it generates recommendations that can include detailed comparison charts. Gemini will roll out a similar capability soon. Google's other AI discovery announcement focuses on games. The new Game Finder feature leans on all the usage data Google's app platform has hoovered up over the years, featuring insights into the way 1.2 billion people play games on Android. It builds a profile called Gamer DNA and matches you with players who have similar DNA. Read full article Comments", "date_str": "2026-10-13T17:00:39+00:00", "hash": "f7d001ecd28700e1", "title_fa": "Google می‌خواهد برنامه‌های شخصی شما با کد ویبر را در Play Store میزبانی کند", "summary_fa": "گوگل قبلاً چند ویژگی هوش مصنوعی را به Play Store اضافه کرده است، اما موارد بسیار بیشتری در راه است. ویژگی Ask Play که قبلاً منتشر شده بود در حال گسترش است تا گزینه‌های اکتشاف مبتنی بر هوش مصنوعی بیشتری را در فروشگاه برنامه Google ارائه دهد، و Google همچنین از هوش مصنوعی برای ساخت موتور توصیه‌ای به نام Game Finder استفاده می‌کند. برای افرادی که از هوش مصنوعی استقبال کرده اند تا برنامه های خود را بسازند، Play Store به زودی راهی برای میزبانی خصوصی و اشتراک گذاری آن آثار ارائه می دهد. گوگل Ask Play را در سال 2025 به عنوان یک رابط چت بات کوچک در لیست های فروشگاه Play عرضه کرد. این به شما امکان می‌دهد با تایپ دستی آن یا انتخاب از فهرست درخواست‌های پیشنهادی، درباره یک برنامه یا بازی سؤال بپرسید. از امروز، Ask Play در حال گسترش به یک روش کلی تر برای جستجوی برنامه ها و بازی ها است. شما از ربات سوالاتی می‌پرسید و توصیه‌هایی ایجاد می‌کند که می‌تواند شامل نمودارهای مقایسه دقیق باشد. جمینی به زودی قابلیت مشابهی را ارائه خواهد کرد. دیگر اعلامیه کشف هوش مصنوعی گوگل بر روی بازی ها تمرکز دارد. ویژگی جدید Game Finder مبتنی بر تمام داده‌های استفاده است که پلتفرم برنامه Google در طول سال‌ها به آن افزوده است و بینش‌هایی را در مورد نحوه بازی ۱.۲ میلیارد نفر در اندروید ارائه می‌کند. این یک پروفایل به نام Gamer DNA می سازد و شما را با بازیکنانی که DNA مشابهی دارند مطابقت می دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش Google قبلاً چند ویژگی هوش مصنوعی را به فروشگاه Play اضافه کرده است، اما موارد بیشتری در راه است. ویژگی"}, {"source": "Ars Technica", "title": "Gemini 4 Argon begins rolling out in Gemini app and Antigravity, but only if you pay", "link": "https://arstechnica.com/ai/2026/10/gemini-4-argon-begins-rolling-out-in-gemini-app-and-antigravity-but-only-if-you-pay/", "summary": "Google revealed Gemini 4 Argon a few weeks ago, saying that it needed to move cautiously toward a full release because of the potential for nefarious use. Google seems to have worked all that out pretty quickly, though. Argon is beginning its wide rollout today , but it's only coming to paying users at this time, and even those on lower-tier plans won't have full access. Nothing about Gemini 4 Argon's capabilities has changed. Google still points to the benchmarks it published late last month as evidence of the model's advanced reasoning and agentic coding capabilities. The model is supposedly trained to refuse malicious instructions, and an automated misalignment monitor can stop processing if it detects an unintended workflow. Google claims Argon needs that because it's so capable. The company has a few new examples of how Argon has helped inside Google, where it has been used by thousands of Googlers. Argon has reportedly been instrumental in making YouTube's comment system more efficient. Argon identified redundant emoji rendering that, when eliminated, dropped server load by 45 percent. Engineers also turned Gemini 4 loose on the proprietary drone physics simulator used in Project Wing, and the AI found critical bugs that had been in the codebase since 2018. Google also notes that Argon has advanced its robotics program, showing a measurable step increase in embodied reasoning. Read full article Comments", "date_str": "2026-10-13T16:00:02+00:00", "hash": "6044a96df7dd91e2", "title_fa": "Gemini 4 Argon در اپلیکیشن Gemini و Antigravity عرضه می‌شود، اما فقط در صورت پرداخت", "summary_fa": "گوگل چند هفته پیش Gemini 4 Argon را معرفی کرد و گفت که باید با احتیاط به سمت انتشار کامل حرکت کند زیرا احتمال استفاده نادرست وجود دارد. با این حال، به نظر می رسد گوگل همه این موارد را خیلی سریع حل کرده است. آرگون از امروز عرضه گسترده خود را آغاز می کند، اما در حال حاضر فقط به کاربران پولی ارائه می شود و حتی کسانی که برنامه های سطح پایین تر دارند دسترسی کامل نخواهند داشت. هیچ چیز در مورد قابلیت های Gemini 4 Argon تغییر نکرده است. گوگل همچنان به معیارهایی که در اواخر ماه گذشته منتشر کرد به عنوان شواهدی از استدلال پیشرفته و قابلیت های کدگذاری عاملی مدل اشاره می کند. ظاهراً این مدل برای امتناع از دستورالعمل‌های مخرب آموزش دیده است، و یک مانیتور خودکار اشتباه می‌تواند پردازش را در صورت تشخیص یک گردش کار ناخواسته متوقف کند. گوگل ادعا می کند که آرگون به آن نیاز دارد زیرا بسیار توانایی دارد. این شرکت چند نمونه جدید از نحوه کمک آرگون به داخل گوگل دارد، جایی که هزاران کاربر گوگل از آن استفاده کرده اند. طبق گزارش‌ها، آرگون در کارآمدتر کردن سیستم نظرات یوتیوب مؤثر بوده است. آرگون ایموجی‌های اضافی را شناسایی کرد که وقتی حذف شدند، بار سرور را تا 45 درصد کاهش می‌دادند. مهندسان همچنین Gemini 4 را روی شبیه‌ساز فیزیک پهپاد اختصاصی مورد استفاده در Project Wing آزاد کردند و هوش مصنوعی باگ‌های مهمی را پیدا کرد که از سال 2018 در پایگاه کد وجود داشت. Google همچنین خاطرنشان می‌کند که Argon برنامه رباتیک خود را پیشرفته کرده است و یک افزایش گام قابل اندازه‌گیری در استدلال تجسم یافته نشان می‌دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن"}, {"source": "Ars Technica", "title": "Apple’s first smart display is the 7-inch HomeView for $299", "link": "https://arstechnica.com/apple/2026/10/apple-homeview-smart-home-hub-opens-for-preorders-at-299/", "summary": "Apple opened preorders for the HomeView smart home hub today. The HomeView is a 7-inch smart display and speaker that aims to be a central access point for up to six members of a family to access and control Apple’s ecosystem of devices, apps, and the Siri generative AI chatbot that's currently in beta. Users can speak to HomeView to control smart home devices, such as, for example, telling Siri to close the smart blinds or activate smart locks. HomeView can also show a livestream for up to nine video feeds simultaneously. Read full article Comments", "date_str": "2026-10-13T15:29:17+00:00", "hash": "ac27fcf40bec37e0", "title_fa": "اولین نمایشگر هوشمند اپل صفحه نمایش ۷ اینچی HomeView با قیمت ۲۹۹ دلار است", "summary_fa": "اپل امروز پیش خرید هاب خانه هوشمند HomeView را آغاز کرد. HomeView یک صفحه نمایش و بلندگوی هوشمند 7 اینچی است که هدف آن یک نقطه دسترسی مرکزی برای حداکثر شش عضو یک خانواده برای دسترسی و کنترل اکوسیستم دستگاه‌ها، برنامه‌ها و چت ربات هوش مصنوعی Siri است که در حال حاضر در نسخه بتا است. کاربران می‌توانند برای کنترل دستگاه‌های خانه هوشمند با HomeView صحبت کنند، مثلاً به Siri بگویند پرده‌های هوشمند را ببندد یا قفل‌های هوشمند را فعال کند. HomeView همچنین می‌تواند یک جریان زنده برای حداکثر نه فید ویدیویی به طور همزمان نمایش دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل رساندن پیش‌سفارش‌های باز شده توسط اپل برای هاب خانه هوشمند HomeView امروز. «با اشتراک پشتیبانی‌شده iCloud+، HomeView با دوربین‌های سازگار کار می‌کند تا تشخیص رمزگذاری‌شده هوشمند و سرتاسر افراد، چهره‌های آشنا، حیوانات خانگی، بسته‌ها و وسایل نقلیه را ارائه دهد و از لحظه‌ای که شخصی به جلوی در می‌آید به خانواده اطلاع می‌دهد. با توضیحات ویدیویی برای HomeKit Secure به کاربران کمک می‌کند تا به سرعت بدون تماشای فیلم ویدیوی ویدیویی، HomeVilip درک کنند که چه اتفاقی افتاده است». در اطلاعیه اپل آمده است. در رقابت با دستگاه‌هایی مانند Amazon Echo Show، HomeView از دوربین یکپارچه خود برای شناسایی افرادی که از آن استفاده می‌کنند استفاده می‌کند و نمایه‌شان را به آن‌ها نشان می‌دهد، که کاربران می‌توانند با برنامه‌ها و ویجت‌های دلخواه خود آن را شخصی‌سازی کنند. کاربران می‌توانند نمایه HomeView خود را به آیفون یا آی‌پد پشتیبانی‌کننده هوش اپل متصل کنند و از هاب برای دسترسی به پیام‌ها، تقویم، یادآوری‌ها و FaceTime استفاده کنند. در اعلامیه اپل آمده است: «با یک آیفون یا آی‌پد مجهز به هوش اپل، هوش مصنوعی سیری کارهای بیشتری"}, {"source": "Ars Technica", "title": "They war-gamed dimming the Sun. It went even worse than you think.", "link": "https://arstechnica.com/science/2026/10/they-war-gamed-dimming-the-sun-it-went-even-worse-than-you-think/", "summary": "When it comes to deciding the fate of the planet, Colleen Golja always thought science and reason would have a seat at the table. That was until one morning last September in London, when the climate researcher took part in the first in a series of war games. The goal: to prevent an uncontrolled global race to develop a technology aimed at cooling the planet but that comes with vast, unknown risks that could reshape life on Earth. “I thought that would be such an easy thing. Like, we can all agree to do ethical research and make sure it's for the better of all humans,” she told WIRED. “And boy, was I wrong.” The simulation, titled Exploring Geopolitical Tipping Points and Climate Cooling Strategies, saw a couple dozen foreign-relations experts, scientists, military personnel, and former government officials from across the world convene in a meeting room at Queen Mary University of London. After making introductions over coffee and little yogurts, they sat at tables arranged in a square with the name of the country or organization each person was playing: national governments, climate NGOs and nonprofits, indigenous groups, and tech companies. Golja was assigned to provide technical advice to help participants make scientifically literate decisions. Read full article Comments", "date_str": "2026-10-13T15:17:59+00:00", "hash": "0e6c6399d5c49e92", "title_fa": "آنها با کم نور کردن خورشید بازی جنگی کردند. حتی بدتر از آن چیزی که فکر می کنید پیش رفت.", "summary_fa": "وقتی نوبت به تصمیم‌گیری درباره سرنوشت سیاره می‌رسد، کالین گلجا همیشه فکر می‌کرد که علم و عقل بر سر میز خواهند نشست. این تا یک روز صبح در سپتامبر گذشته در لندن بود، زمانی که محقق آب و هوا در اولین سری از بازی های جنگی شرکت کرد. هدف: جلوگیری از یک مسابقه جهانی کنترل نشده برای توسعه فناوری با هدف خنک کردن سیاره، اما خطرات گسترده و ناشناخته ای دارد که می تواند زندگی روی زمین را تغییر دهد. «فکر می‌کردم که چنین چیزی آسان است. مانند، همه ما می‌توانیم با انجام تحقیقات اخلاقی موافقت کنیم و مطمئن شویم که برای همه انسان‌ها بهتر است.» او به WIRED گفت: «و پسر، آیا اشتباه می‌کردم؟» این شبیه‌سازی، با عنوان بررسی نقاط اوج ژئوپلیتیک و استراتژی‌های خنک‌کننده آب‌وهوایی، شاهد برگزاری دوجین کارشناس روابط خارجی، دانشمند، پرسنل نظامی و مقامات دولتی سابق از سراسر جهان در یک اتاق جلسه در دانشگاه کوئین مری لندن بود. پس از معرفی قهوه و ماست‌های کوچک، پشت میزهایی که در میدانی چیده شده بودند، با نام کشور یا سازمانی که هر فرد در آن بازی می‌کرد، می‌نشستند: دولت‌های ملی، سازمان‌های غیردولتی آب‌وهوایی و سازمان‌های غیرانتفاعی، گروه‌های بومی، و شرکت‌های فناوری. گلجا به ارائه مشاوره فنی برای کمک به شرکت کنندگان در تصمیم گیری با سواد علمی سپرده شد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش وقتی نوبت به تصمیم گیری درباره سرنوشت سیاره می رسد، کالین گلجا همیشه فکر می کرد علم و عقل پشت میز خواهند بود. این تا یک روز صبح در سپتامبر گذشته در لندن بود، زمانی که محقق آب و هوا در اولین سری از بازی های جنگی شرکت کرد. هدف: جلوگیری از یک مسابقه جهانی کنترل نشده برای"}, {"source": "Wired", "title": "Earth’s Condition Is ‘Serious and Getting Worse’ as Climate Change Intensifies", "link": "https://www.wired.com/story/climate-change-is-getting-worse-el-nino-looms/", "summary": "Seven of 16 planetary vital signs are in their most extreme state ever recorded, and El Niño is here to make matters even worse.", "date_str": "2026-10-14T14:00:00+00:00", "hash": "dff9e5f5817cfc6d", "title_fa": "با تشدید تغییرات اقلیمی، وضعیت زمین \"جدی و بدتر\" است", "summary_fa": "هفت مورد از 16 علامت حیاتی سیاره ای در شدیدترین حالت ثبت شده خود قرار دارند و ال نینو اینجاست تا اوضاع را بدتر کند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان آب و هوا به تازگی بررسی سالانه خود را انجام داده است و نتایج چندان گرم به نظر نمی رسند. بیل ریپل، محقق دانشگاه ایالتی اورگان، می‌گوید: «اگر زمین یک بیمار بود که برای معاینه فیزیکی سالانه به زمین می‌آمد، می‌توانستم بگویم که وضعیت آن وخیم است و بدتر می‌شود. ریپل نویسنده اصلی مقاله جدیدی است که وضعیت آب و هوا را شرح می دهد که در روز چهارشنبه در BioScience منتشر شد. یافته ها نشان می دهد که هفت مورد از 16 علامت حیاتی سیاره ای که توسط محققان ردیابی شده اند، هرگز در حالت شدیدتر قرار نداشته اند. این شامل میزان دی اکسید کربن در جو می شود که به دلیل سوزاندن سوخت های فسیلی و همچنین علائم سوزاندن تمام آن نفت، زغال سنگ و گاز، 50 درصد بیشتر
