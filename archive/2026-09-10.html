bd3f4bd32", "title_fa": "اسلایتر در «Crank 2» بی نهایت عصبانی تر است", "summary_fa": "اسلایتر در ضربه برجسته خود به کرانک یک هشدار ساده داد: من را عصبانی نکن. وگرنه چی؟ ظاهراً میل لنگ 2 Slayyyter آهنگی دنباله‌دار برای تک‌آهنگ Wor$t Girl in America به اشتراک گذاشته است که بر اساس غم‌انگیز Crank ساخته شده است، فقط این آهنگ کمی شوم‌تر و بی‌نهایت عصبانی‌تر است. من یک مادر لعنتی زیبا هستم، صد دلاری برای راننده کامیون/شرط می بندم که در مخفیانه، عوضی های زشت را روی دیک خود نگه داری/او مریض ترین عوضی را داشت، لعنتش کرد، چه بدجنس است/او فکر می کند فرهنگ را اداره می کند، اما، عوضی، من آن را اجرا می کنم، اسلایتر به روی تولیدات تلو تلو تلو تلوق زدن در بیت آغازین تف می اندازد. این آهنگ در کنار یک موزیک ویدیوی جدید مبارز و تک رنگ می آید. در Crank اصلی، Slayyyter آنقدر پیچ می خورد که نمی تواند هیچ جمله ای درست بگوید. در اینجا، او می‌خواهد هدفش با صدای بلند، تاکید بلند و واضح او را بشنود. به اسلایتر لعنتی میزنی؟ او می پرسد. عوضی، بعداً بلیک را خواهم آورد. Crank 2 دومین نسخه از دنیای وارونه و گسترده Wor$t Girl در آمریکا است که نام آزمایشی Wor$t Man در آمریکا دارد. این به دنبال تلنگر Beat Up Chanel$ با نام تجاری جدید Chanel$ است که به خیانت و خیانت نیز می‌پردازد. اسلایتر در اوایل امسال به رولینگ استون گفت، من می‌خواهم کمی بیشتر در اینجا زندگی کنم، بنابراین اگر بخواهید یک آلبوم معکوس می‌سازم. من فقط می خواهم هسته همه چیز شبیه من باشد، زیرا در نهایت این احساس را دارد. داستان‌های پرطرفدار جیمی کیمل می‌گوید که مصاحبه جیمز تالاریکو پس از تهدید FCC ترامپ از تلویزیون پخش نمی‌شود. اولین آهنگ پس از مرگ دالی پارتون را بشنوید - از آلبوم جدید ادای احترام برادران استنلی، هری استایلز سال 2027 را اعلام می‌کند با"}, {"source": "Rolling Stone", "title": "Noel Enjoys Rehearsing, Liam Not So Much — And 6 More Takeaways From New Oasis Doc", "link": "https://www.rollingstone.com/music/music-features/oasis-dont-look-back-in-anger-documentary-takeaways-1235622674/", "summary": "The Gallaghers let fans behind the curtain in Don't Look Back in Anger , a film that starts at tense rehearsals and ends with brotherly respect. “I forgot how funny he was,” Noel says of Liam", "date_str": "2026-09-10T13:55:24+00:00", "hash": "dcbe3caa4db44f96", "title_fa": "نوئل از تمرین کردن لذت می برد، لیام نه چندان - و 6 نکته دیگر از Oasis Doc جدید", "summary_fa": "قبل از کنسرت‌های افسانه‌ای Knebworth، جلسات ضبط سرسام‌آور، نزاع‌های متماد، نبرد بریت‌پاپ و هولیگانیسم عمومی، Oasis Liam و Noel Gallagher تنها دو برادر بودند که تلاش می‌کردند بیتل‌های بعدی شوند. سی و پنج سال پس از تأسیس گروه، گالاگرها از بلوک‌های طبقه کارگر به خدایان راک بریتانیایی در Oasis تبدیل شده‌اند که به اسطوره موسیقی تبدیل شده‌اند. اما حتی با وجود اینکه آنها رکوردهای تعیین کننده نسل را پشت سر هم منتشر کردند، قطعا شاید شاید و 1995 (داستان چیست)، Morning Glory؟ رابطه خاردار گالاگرها گروه را مشخص کرد. رویاهای ستاره راک اند رول آنها همیشه در آستانه فروپاشی به نظر می رسید. در بهترین حالت، شیطنت‌های موش و گربه گالاگر با یکدیگر چیزهای جالبی برای گفتن به دوستانتان در میخانه بود (یادتان هست وقتی نوئل لیام را مردی با چنگال در دنیایی از سوپ صدا کرد؟). اما در بدترین حالت، تف‌های نابالغ به غوغاهای خونین تبدیل شدند. تحریکات آنها در صحنه و خارج از صحنه سرانجام آنها را از هم جدا کرد و در سال 2009 از هم جدا شدند. نوئل در سال 2017 با دیمون آلبارن، رهبر گروه Blur، با پرش در آهنگ گوریلاز، همه چیز را حل کرد و لیام در سال 2024 برای آلبومی با جان اسکوایر (قبلاً از استون رزها) همراه شد. طبق گزارش ها، برادران تقریباً 15 سال را بدون قدم گذاشتن در اتاق دیگری سپری کردند. بنابراین وقتی Oasis دو سال پیش اعلام کرد که برای یک تور جهانی دوباره گرد هم می آیند، هیجان ملموس و در عین حال مضطرب بود. با سابقه تورهایی که بدترین‌ها را در گالاگرها به نمایش می‌گذارند، چگونه می‌توانند این کار را انجام دهند؟ حتی زمانی که نمایش افتتاحیه تور در ولز آماده شروع بود، این ترس دائمی وجود داشت که نتوانند کینه های قدیمی را از بین ببرند. و بعد این اتفاق افتاد. زمانی که سران"}, {"source": "Rolling Stone", "title": "Taylor Swift Earns First CMA Awards Nomination in 4 Years for ‘I Knew It, I Knew You’", "link": "https://www.rollingstone.com/music/music-country/taylor-swift-cma-nomination-i-knew-it-i-knew-you-1235624103/", "summary": "The pop superstar received a nod for Single of the Year", "date_str": "2026-09-10T13:35:28+00:00", "hash": "b8720578c50f2121", "title_fa": "تیلور سوئیفت اولین نامزدی جوایز CMA را پس از 4 سال برای «می دانستم، تو را می شناختم» به دست آورد.", "summary_fa": "بازگشت تیلور سویفت به موسیقی کانتری همچنان با آغوش باز جشن گرفته می شود. این سوپراستار موسیقی پاپ نامزد جوایز انجمن موسیقی کانتری برای آهنگ سال برای انتشارش در سال 2026 به نام I Knew It, I Knew You شده است. این اولین نامزدی سوئیفت در CMA از سال 2022 است، زمانی که او به دلیل همکاری با کریس استپلتون، شرط می بندم که در مورد من فکر می کنی، در رده بهترین ویدیوی سال قرار گرفت. سوئیفت از سال 2017 که آهنگ سال را به عنوان ترانه سرا برای مرد بهتر از شهر کوچک کوچک به خانه برد، جایزه CMA را دریافت نکرده است. (او بعداً نسخه خود را از این آهنگ در Red (نسخه تیلور) در سال 2022 منتشر کرد.) همچنین از سال 2013 که 13 سال پیش برای همکاری با تیم مک‌گرو و کیث اوربان، Highway Don t Care نامزد شد، در رده تک‌آهنگ سال شناخته نشد. این سوپراستار با تک‌آهنگ‌های بزرگ موسیقی کانتری در رده تک‌آهنگ سال، مانند آهنگ موفقیت‌ناپذیر الا لنگلی، Choosin Texas و آخرین نسخه Be Her، ستاره در حال ظهور، مبارزه خواهد کرد. این رده توسط لینی ویلسون برای فیلم Somewhere Over Laredo و کودی جانسون برای The Fall تکمیل شده است. سویفت I Knew It, I Knew You را در ماه ژوئن به عنوان بخشی از موسیقی متن Toy Story 5 منتشر کرد. از آن زمان، آن را به یک موفقیت تاریخی در رادیو کشور، و فراتر از آن تبدیل شده است. این آهنگ در صدر جدول آهنگ های کانتری قرار گرفت، به رتبه هشتم در نمودار کانتری ایرپلی رسید و به شماره یک در بیلبورد هات 100 رسید. این آهنگ همچنین اولین آهنگ از یک زن بود که هر ایستگاه رادیویی کانتری که به Mediabase گزارش می داد با پخش آهنگ در هفته اول موافقت می کرد. داستان‌های پرطرفدار جیمی کیمل"}, {"source": "Rolling Stone", "title": "How Gaslight Anthem’s Brian Fallon Found His Inner Eighties Rock Star", "link": "https://www.rollingstone.com/music/music-features/brian-fallon-interview-not-bad-for-new-jersey-eighties-rock-1235623064/", "summary": "The singer goes full Bryan Adams on his new solo album, Not Bad for New Jersey : “Songs with a lot of attitude were really big for me”", "date_str": "2026-09-10T13:30:00+00:00", "hash": "eceb634793a7c0ad", "title_fa": "چگونه برایان فالون از Gaslight Anthem ستاره راک درونی خود را در دهه هشتاد پیدا کرد", "summary_fa": "برایان فالون درست قبل از اینکه قرار باشد با Gaslight Anthem در تور سال 2024 آنها وارد جاده شود، دخترش را به مدرسه می برد و به این فکر می کرد که گروه راک نیوجرسی چه آهنگ جدیدی را می تواند به عنوان کاور کار کند. او از چیزی که فرزندش به آن اشاره کرده بود، الهام گرفت. این آهنگ زیبا چیست؟ من پرسیدم. و او گفت: \"بیلی آیلیش است، فالون می گوید در پشت صحنه در زیرزمین شرق در شرق نشویل، جایی که او برای یک کنسرت در یک شب ژوئن آماده می شود.\" این آهنگ Ocean Eyes، اولین تک آهنگ آیلیش در سال 2016 بود، و او آن را مقاومت ناپذیر و کمی شبیه به سرود دهه هشتاد یافت. او به خاطر می‌آورد که در تمام مسیر خانه به آن گوش دادم. من می توانستم کمی از Skid Row در آن آهنگ بشنوم. وقتی که خواننده گروه Gaslight Anthem با دوست دیرینه‌اش بوچ واکر، که اولین انفرادی Painkillers را در سال 2016 تهیه کرد، گرد هم آمدند تا یک EP آکوستیک را برای Gaslight ضبط کنند تا قبل از تور آن‌ها پخش شود، فالون تصمیم گرفت که نقش خودش را روی تصنیف رویایی ایلیش بگذارد. در نهایت از آن جلسه ضبط گذشته بود. او می‌گوید اکنون کاملاً می‌شنیدم که شاید «چشم‌های اقیانوس» همان جایی بود که جوانه این آلبوم شروع شد. این آلبوم برای نیوجرسی بد نیست، آلبوم انفرادی جدید فالون اکنون در حال پخش است (نسخه فیزیکی آن جمعه منتشر می شود). این فیلم که توسط واکر تهیه شده است، نشان می‌دهد که این دو مرد به خاطر قدردانی مشترکشان از راک رول براق، از تام پتی گرفته تا تینا ترنر، و به‌ویژه برایان آدامز 1984، Reckless، به هم پیوند می‌خورند. فالون می‌گوید آهنگ‌هایی با نگرش زیاد، مانند اوایل ملیسا اتریج و Missing You اثر جان ویت،"}, {"source": "Rolling Stone", "title": "Ella Langley Is the Top Nominee at the 2026 CMA Awards", "link": "https://www.rollingstone.com/music/music-country/2026-cma-awards-nominations-ella-lang ights leave from Boston. On Sept. 11, two planes left Logan heading for the Twin Towers", "date_str": "2026-09-10T12:00:00+00:00", "hash": "03379712a21c32bf", "title_fa": "تماشای پرواز هواپیماها از فرودگاه لوگان", "summary_fa": "در 11 سپتامبر، من در ناهانت، ماساچوست، یک دهکده ساحلی عجیب و ترسناک در حدود شش مایلی فرودگاه بین المللی لوگان بوستون زندگی می کردم. من از 17 سالگی در شهرهای بزرگ زندگی می کردم، اما اکنون که اخیراً ازدواج کرده ام، متقاعد شدم که خانه ای در ناهانت بخرم، جایی که نقاط برجسته مرکز شهر به پیتزا فروشی Captain s Seaside و Enzo s Nahant Garage محدود می شد. در آن زمان ایده خوبی به نظر می رسید. گاهی اوقات بعدازظهرهای خاکستری را به پرسه زدن در جاده های شهر می گذرانم، دو بار توسط یک ماشین پلیس محلی با یک سارق اشتباه گرفته می شوم. یک روز در میان، هوندا آکورد در حال تجزیه خود را به YMCA در لین همسایه می‌رانم. من دور شنا می کنم، سونا می گیرم و سعی می کنم علامت زیر دوش را تجزیه کنم: برخی از شیوه های حمام کردن که در خانه قابل قبول هستند در اینجا قابل قبول نیستند. به خانه برمی گردم، از پنجره به بیرون خیره می شوم و به انتخاب هایم فکر می کنم. حواس پرتی وجود داشت. هر چند دقیقه، می‌توانم به برود ساوند نگاه کنم و لکه‌ای از گرما و حرکت ارتعاشی را ببینم که لوگان را ترک می‌کند و به آرامی به یک جت مسافربری تبدیل می‌شود. برای چند لحظه به نظر می رسید که هواپیما قبل از چرخش مستقیماً به سمت من هدف قرار گرفته است و زیر شکم نقره ای خود را نشان می دهد و به سمت غرب حرکت می کند. این مسیری بود که پرواز 11 خطوط هوایی امریکن، یک بوئینگ 767، پس از ترک لوگان در ساعت 7:59 صبح روز 11 سپتامبر 2001 طی کرد. من بیدار بودم اما گیج بودم، در رختخواب دراز کشیده بودم و به NPR گوش می دادم در حالی که همسرم برای کارش در"}, {"source": "Hollywood Reporter", "title": "‘Chad Powers’ Star Perry Mattfeld Breaks Down Ricky and Chad’s Forbidden Romance, Gerry’s Threat and That Season 2 Cliffhanger", "link": "https://www.hollywoodreporter.com/tv/tv-features/chad-powers-perry-mattfeld-ricky-chad-romance-season-2-1236694915/", "summary": "The actress behind Ricky talks to The Hollywood Reporter about that steamy final scene with Glen Powell, what the season-ending ultimatum could mean for a third season and her character's growth.", "date_str": "2026-09-10T14:15:00+00:00", "hash": "878a1ac4c0eefe80", "title_fa": "پری متفلد، ستاره «چاد پاورز»، عاشقانه های ممنوعه ریکی و چاد، تهدید گری و آن فصل 2 کلیف هنجر را شکست می دهد.", "summary_fa": "متن لوگو [این داستان حاوی اسپویل‌هایی از فصل دوم پایانی Chad Power s، 12th Quarter است. ] پس از افشای نقاب پایانی فصل اول چاد پاورز، ریکی (پری متفلد) متوجه می‌شود که مدافع ستاره گربه‌ماهی جورجیا جنوبی در واقع بازیکن سابق فوتبال راس هالیدی (گلن پاول) در لباس مبدل بدنام شده است. او موافقت می کند که راز او را حفظ کند تا تیم آنها بتواند به پیروزی ادامه دهد، اما محافظت از این راز در فصل دوم دشوارتر می شود. جری (کولتون رایان)، کوارتربک اصلی اصلی که چاد جایگزین او شد، به رفتار عجیب چاد مشکوک می شود و در نهایت هویت واقعی خود را کشف می کند. زمانی که ریکی به دفاع از چاد می‌آید، گری متوجه می‌شود که او در این نقشه شرکت کرده و هر دوی آنها را در معرض خطر قرار می‌دهد. در همین حال، مربی هادسون (استیو زان) همچنان به مبارزه با سلامتی خود ادامه می دهد در حالی که سرمربی گربه ماهی باقی می ماند، حتی با نزدیک شدن به چاد. ماتفلد به هالیوود ریپورتر درباره پدرش در صفحه نمایش می گوید که او واقعاً هیچ جناسی در این فصل قلبش را نمی برد. ریکی همچنین در حال بررسی یک فرصت شغلی جدید به عنوان مربی کوارتربک در دانشگاه سیراکیوز است، در حالی که دوستی او با چاد/راس شروع به از بین بردن مرز بین افلاطونی و رمانتیک می کند. داستان‌های مرتبط تلویزیون چگونه قدرت‌های چاد را بنویسیم: با اولین، احمقانه‌ترین فکر خود پیش بروید جریان کسب‌وکار سریع‌تر از کابل قیمت‌ها را افزایش می‌دهد این تنش‌ها در پایان فصل دوم، زمانی که گری تهدید می‌کند راز چاد را پس از کشف انبارهای پروتز در زیرزمین فاش می‌کند، به اوج رسید. اما پس از اینکه چاد از پیروی از خواسته های گری در بازی آخر تیم امتناع می ورزد، گری وارد زمین می شود"}, {"source": "Hollywood Reporter", "title": "Elon Musk Threatens Legal Action Over Alex Gibney Documentary, Blasts “Boring Hit Piece”", "link": "https://www.hollywoodreporter.com/movies 47", "title_fa": "موزیکال «و ژولیت» در ژانویه به اجرای برادوی پایان می‌دهد", "summary_fa": "موزیکال ژولیت پس از بیش از چهار سال حضور در برادوی، در ژانویه به اجرای برادوی خود پایان می دهد. این نمایش که توسط دیوید وست رید ساخته شد، تراژدی شکسپیر را دوباره به تصویر می‌کشد تا ژولیت زنده بماند و موسیقی پاپ از مکس مارتین با آهنگ‌هایی از جمله Since U Been Gone، Roar و I Want It That Way ساخته شود. این موزیکال که قرار است در 3 ژانویه 2027 به پایان برسد، آخرین نمایش باقی مانده در برادوی از فصل 2022-2023 است. نمایش در بریتانیا قبل از اکران در برادوی در تئاتر استفان ساندهیم در 17 نوامبر 2022 آغاز شد. موزیکال برادوی در سال 2024 سرمایه 17 میلیون دلاری خود را پس گرفت (و تور در سال 2025 جبران شد) و از آن زمان تاکنون بیش از 175 میلیون دلار فروش داشته است. اگرچه ظرفیت در طول دوره نسبتاً قوی باقی مانده است، درآمدهای ناخالص طی دو سال گذشته روند نزولی را آغاز کرده است. با اعلام تاریخ پایانی ژانویه، به Six، موزیکال طولانی‌تر دیگری که در سال 2021 افتتاح شد، می‌پیوندد. در طول اجرای خود، این موزیکال از تعدادی از افراد مشهور که اولین حضور خود را در برادوی انجام داده اند، استقبال کرده است، از جمله کریسی متز و جوی فاتون که هر دو در حال حاضر بازیگر هستند، و همچنین چارلی دی آملیو، لوری هرناندز، کندی بوروس و شریل پورتر. کتانجی براون جکسون، قاضی دیوان عالی کشور نیز در این نمایش موزیکال یک شب نقش آفرینی داشت. قبل از اینکه نمایش در برادوی به پایان برسد، از کنزی زیگلر، آلی میچالکا، اسپنسر ساترلند، آنتونی گارگیولا و غیره استقبال خواهد کرد. این موزیکال توسط مکس مارتین، تیم هدینگتون، ترزا استیل پیج، جنی پترسون، مارتین داد و اوا پرایس در برادوی تهیه شده است."}, {"source": "Hollywood Reporter", "title": "Belmont Cameli and NHL Phenom Macklin Celebrini Talk ‘Off Campus,’ Olympic Heartbreak and Handling the Hype", "link": "https://www.hollywoodreporter.com/business/business-news/off-campus-belmont-cameli-nhl-macklin-celebrini-interview-1236678553/", "summary": "In THR’s new series, the breakout actor and the $94 million Sharks superstar get candid about fan obsession, tuning out the noise, newfound wealth ss-news/ms-now-member-lounge-subscription-membership-push-1236694921/", "summary": "The news brand is betting that wellness features, physical membership lounges and direct relationships with talent can help it stand out in a crowded subscription market.", "date_str": "2026-09-10T13:00:00+00:00", "hash": "4e5fdfa6a358e8b2", "title_fa": "دسترسی لنگر، نمایش های اصلی و سالن زندگی واقعی: داخل فشار عضویت MS NOW", "summary_fa": "در اواخر این ماه، چند هزار نفر از بزرگترین طرفداران MS NOW به مرکز کالج پارک در دانشگاه تگزاس در آرلینگتون خواهند آمد تا به گفته این برند خبری بزرگترین رویداد آن تا کنون باشد: MS NOW Live: Together in Texas. این رویداد در یک لحظه حساس برای MS NOW، که این هفته اولین پیشنهاد اشتراک خود، عضویت MS NOW را راه اندازی کرد، برگزار می شود. به نظر می رسد که رویداد تگزاس از چندین جهت یک میدان آزمایش خواهد بود. اعضای MS NOW که در رویداد زنده شرکت می‌کنند، یک سالن اختصاصی برای اعضا، با یک بار، صندلی راحت، و فرصتی برای معاشرت با دیگر طرفداران فوق‌العاده و همچنین برخی از استعدادهای کانال پیدا می‌کنند. مارکوس مابری، معاون ارشد استراتژی محتوا MS NOW می‌گوید: از زمانی که مدت‌ها در کسب‌وکار ما بوده‌ایم، احساس می‌کنم که واقعاً، واقعاً متفاوت است، من هرگز چنین چیزی را در هیچ فضای خبری دیگری که در آن حضور داشته‌ام نداشته‌ام، در واقع می‌خواهیم بر کنار هم بودن افراد تأکید کنیم، و این واقعاً قدرتمند است. او اضافه می کند که ما انسانیت را به دلایلی نادیده گرفته ایم. بنابراین، حتی در دکور، ارائه غذا و نوشیدنی، حتی در مورد گرما و جشن است، و دموکراسی ما را جشن می‌گیرد، کاری که این روزها در کشورمان زیاد انجام نمی‌دهیم. مابری می‌گوید که MS NOW قصد دارد تا سالن‌های عضو را در طول سال به نمایش بگذارد، احتمالاً مرتبط با رویدادهای زنده یا رویدادهای خبری MS NOW، یک مزیت واقعی برای اشتراک دیجیتال، و یکی از بسیاری از ویژگی‌هایی که مدیران کانال کابلی امیدوارند به آن کمک کند در فضای شلوغ برای اشتراک‌ها برجسته شود. ربکا کاتلر، رئیس MS NOW، در پاسخ به سوالی که هالیوود ریپورتر در دفتر مرکزی شرکت در نیویورک درمورد ورود به بازاری می‌گوید، چالش ما این است که به مخاطبانمان"}, {"source": "Hollywood Reporter", "title": "Noah Kahan Drops “Orbiter” Music Video on Spotify", "link": "https://www.hollywoodreporter.com/music/music-news/noah-kahan-orbiter-music-video-spotify-exclusive-1236696094/", "summary": "The 'Great Divide' singer just wrapped his North American tour, where he filmed the new music video.", "date_str": "2026-09-10T13:00:00+00:00", "hash": "48a4aa064ae3cf69", "title_fa": "نوح کاهان موزیک ویدیوی Orbiter را در Spotify منتشر کرد", "summary_fa": "نوح کاهان، خواننده و ترانه سرا، موزیک ویدیوی آهنگ صعودی خود به نام Orbiter را در Spotify منتشر کرده است. این موزیک ویدیو در چندین نمایش استادیوم کاهان در طول دوره پرفروش تور آمریکای شمالی او در The Great Divide فیلمبرداری شد. این به معنای جشن گرفتن تور است و لحظه ای صمیمی را در طول برنامه زنده خواننده ثبت می کند. او شروع به خواندن آهنگ به تنهایی در مرکز هر استادیوم تنها با گیتار آکوستیک خود قبل از پیوستن گروه کامل می کند. ویدیوی Orbiter به طور انحصاری در Spotify برای 48 ساعت اول پخش خواهد شد. مشترکین ممتاز در بازارهای بتا برنامه می‌توانند پلتفرم را در تلویزیون، دسکتاپ یا دستگاه‌های تلفن همراه خود باز کنند، آهنگ را انتخاب کنند و برای تماشا روی ویدیو کلیک کنند. داستان‌های مرتبط موسیقی خرگوش بد به سلین دیون تا پسران پشت خیابان: اقامتگاه‌های موزیکال جهانی می‌شوند - افزایش گردشگری، کسب میلیون‌ها نفر و بهبودی طرفداران اخبار هاروی لوین از TMZ کات ستایش هیتلر کانیه وست از مصاحبه 2018، کارمند سابق می‌گوید کاهان در یک سال رکورددار است. این بازیکن 29 ساله ماه گذشته اولین شماره 1 خود را در بیلبورد 200 به دست آورد. یکی از موردانتظارترین آلبوم‌های سال 2026، The Great Divide، امسال با انتشار سومین هفته بزرگ یک آلبوم را پشت سر گذاشت. The Great Divide به‌عنوان دنباله‌ای بر آلبوم موفق کاهان، Stick Season عمل می‌کند، که به تبدیل این شهروند بومی ورمونت از یک بازی باشگاهی به یک تیتر یک استادیوم کمک کرد. این خواننده در اواخر ژانویه این آلبوم را اعلام کرد و موزیک ویدیوی اولین تک آهنگ خود را که آهنگ اصلی بود در خلال یک استراحت تبلیغاتی در جوایز گرمی 2026 رها کرد. کمتر از 24 ساعت پس از انتشار آلبوم 17 آهنگی، کاهان نسخه توسعه یافته The Great Divide: The Last of the Bugs"}, {"source": "Hollywood Reporter", "title": "Oscars: Australia Picks ‘First Light’ as International Feature Contender (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/oscars-2027-australia-first-light-international-feature-film-1236696323/", "summary": "James J. Robinson's debut feature is the country's first-ever Tagalog-language submission for the Oscars.", "date_str": "2026-09-10T12:18:12+00:00", "hash": "e5f9948dff22c0b8", "title_fa": "اسکار: استرالیا «نور اول» را به عنوان رقیب بین‌المللی فیلم انتخاب می‌کند (اختصاصی)", "summary_fa": "هالیوود ریپورتر به طور انحصاری اعلام کرده است که استرالیا اولین فیلم بلند جیمز جی رابینسون را به عنوان فیلم ارسالی رسمی خود برای بهترین فیلم بلند بین المللی در نود و نهمین دوره جوایز اسکار انتخاب کرده است. اولین فیلم مشترک فیلیپینی و استرالیایی، First Light اولین فیلم تاگالوگ زبان است که استرالیا برای اسکار ارسال کرده است. این درام یک راهبه سالخورده (با بازی روبی روئیز معمولی برلیانت مندوزا) را روایت می کند که زندگی او بر اساس نظم، خدمات و اعتقاد شکل گرفته است که پس از مرگ یک کارگر جوان ساختمانی در شرایط مشکوک، به دنیایی از جنایت و فساد کشیده می شود. ماریسل سوریانو، رز کورتز و کیدلات تاهیمیک همبازی هستند. داستان‌های مرتبط TV RuPauls Drag Race UK توسط فیلم‌های بی‌بی‌سی حذف شد مرسدس ران درباره فیلم هیجان‌انگیز رمانتیک جدید YA که با هم ترسیم شده و چه اتفاقی می‌افتد بحث می‌کند کمیته انتخاب اسکار استرالیا در توضیح تصمیم خود، First Light را اثری مراقبه درباره زنی سالخورده نامید که ایمان خود را زیر سوال می‌برد، زیرا دنیایش شروع به فرو ریختن آثاری در اطراف او می‌کند. آنها گفتند که فیلم رابینسون اولین فیلم تاثیرگذار بود که نمونه درخشانی از فیلمسازی استرالیایی است. First Light توسط Gabrielle Pearson از Majella Productions و Christelle Lou Dychangco و Jane Pe Aguirre از Clou Media Productions تهیه شده است. این فیلم در سینماهای فیلیپین توسط Clou Media Productions و در سینماهای استرالیا توسط Bonsai Films اکران شد. Independent Entertainment فروش بین المللی را مدیریت می کند. رابینسون، عکاسی که به کارگردانی تبدیل شده است، سال گذشته قبل از سفر به مراکش و جشنواره بین المللی فیلم روتردام، اولین حضور بلند خود را به جشنواره فیلم ملبورن آورد. First Light از نظر منتقدان مورد استقبال قرار گرفته است، اما به دلیل نداشتن پلتفرم در یکی از جشنواره های درجه"}, {"source": "Variety", "title": "Universal Music Group and ElevenLabs to Launch AI-Powered Music Platform in Expansive Licensing Deal", "link": "https://variety.com/2026/music/news/umg-elevenlabs-ai-powered-music-platform-licensing-1236857240/", "summary": "Universal Music Group and ElevenLabs are getting into business. The label has struck an expansive licensing agreement with the AI audio startup that will see ElevenLabs launch an AI-powered music platform built on UMG s catalog of artists. The platform will allow fans to remix and mashup artist tracks along with creating “new track interpretations” and “personalized vocal [ ]", "date_str": "2026-09-10T14:18:20+00:00", "hash": "697eacdf254936fd", "title_fa": "گروه موسیقی یونیورسال و ElevenLabs پلتفرم موسیقی مبتنی بر هوش مصنوعی را در یک قرارداد مجوز گسترده راه اندازی می کنند", "summary_fa": "گروه موسیقی جهانی و ElevenLabs در حال وارد شدن به تجارت هستند. این لیبل با استارتاپ صوتی هوش مصنوعی قرارداد مجوز گسترده ای منعقد کرده است که باعث می شود ElevenLabs یک پلتفرم موسیقی مبتنی بر هوش مصنوعی را راه اندازی کند که بر اساس کاتالوگ هنرمندان UMG ساخته شده است. این پلتفرم به طرفداران این امکان را می‌دهد که آهنگ‌های هنرمند را به همراه ایجاد «تفسیر آهنگ جدید» و «آواز شخصی‌سازی شده [ ] ریمیکس و ترکیب کنند."}, {"source": "Variety", "title": "‘The Zone of Interest’ Producer Ewa Puszczyńska and Director Jan Holoubek Say ‘Wild Wild East’ No Longer Feels Like a Period Drama: ‘It Can Happen Again. It Already Is’", "link": "https://variety.com/2026/film/global/the-zone-of-interest-puszczynska-holoubek-wild-wild-east-1236852583/", "summary": "Jan Holoubek’s TIFF premiere “Wild Wild East” is set in 1943, but it no longer feels safely stored away in the past. “When I first read the script 12 years ago, it felt like a period drama. It was about something that happened a long time ago and wouldn’t happen again. Today, I think it’s [ ]", "date_str": "2026-09-10T14:15:00+00:00", "hash": "9bac2a3ae719e82e", "title_fa": "اوا پوشچینسکا، تهیه کننده «منطقه مورد علاقه» و کارگردان یان هولوبک می گویند «شرق وحشی وحشی» دیگر شبیه درام دوره ای نیست: «می تواند دوباره اتفاق بیفتد. از قبل هست", "summary_fa": "اولین نمایش هیجان‌انگیز جنگ جهانی دوم لهستانی در TIFF آغاز می‌شود. اولین نمایش TIFF یان هولوبک در سال 1943 اتفاق می‌افتد، اما دیگر احساس نمی‌شود که در گذشته به‌طور امن ذخیره شده باشد. زمانی که 12 سال پیش برای اولین بار فیلمنامه را خواندم، شبیه یک درام دورهمی بود. این در مورد چیزی بود که خیلی وقت پیش اتفاق افتاد و دیگر تکرار نمی شد. امروز، من فکر می کنم در مورد چیزی است که ممکن است دوباره اتفاق بیفتد. کارگردان لهستانی به Variety می گوید که همین الان هم هست. داستان‌های مرتبط درآمد صنعت بازی‌های ویدیویی در سال 2026 به 214 میلیارد دلار می‌رسد با انتشار GTA 6، گزارش جدید نشان می‌دهد که آفتابگردان سیاه جیمز مارکوس هنی توسط Charades و CAA Media Finance سوار شده است. قرار بود از ثروت یک خانواده یهودی محافظت کند. او خیلی زود متوجه می شود که همه اطرافیان او چیزی را پنهان می کنند. محبوب در Variety ما می دانیم که با ظهور جنبش های جناح راست ملی در اروپا چه می گذرد. هولوبک می‌گوید، یا در اوکراین، جایی که روس‌ها وحشت‌های جنگ جهانی دوم را با قتل غیرنظامیان، ربودن کودکان و شکنجه مردم تکرار می‌کنند. من می‌خواهم این فیلم را نه فقط به نسل خودم، که توسط پدربزرگ‌ها و مادربزرگ‌هایی که از جنگ جان سالم به در برده‌اند، بزرگ شده‌اند، بلکه به بسیاری از جوانانی که شاید نمی‌دانند ناسیونالیسم می‌تواند منجر به چه چیزی شود، نشان دهم."}, {"source": "Variety", "title": "Mohsen Gharaei’s Iranian Drama ‘Falling House’ Sells Across Europe After Venice Festival Premiere (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/mohsen-gharaeis-iranian-drama-falling-house-venice-festival-1236857223/", "summary": "Iranian filmmaker Mohsen Gharaei’s “Falling House” has sold to a raft of international territories following its world premiere at the Venice Film Festival. Paris-based company Paradise City Sales has closed a first batch of deals with Jokers Films for France, Wanted Cinema for Italy and Karma Films for Spain, with negotiations underway in several other [ ]", "date_str": "2026-09-10T14:14:11+00:00", "hash": "c5ac682949a7a1a2", "title_fa": "درام ایرانی «خانه سقوط» محسن قرایی پس از اکران جشنواره ونیز در سراسر اروپا به فروش رفت (اختصاصی)", "summary_fa": "«خانه سقوط» ساخته محسن قرایی، فیلمساز ایرانی پس از نمایش جهانی خود در جشنواره فیلم ونیز، به تعداد زیادی از مناطق بین المللی فروخته شد. شرکت پاریسی Paradise City Sales اولین دسته از معاملات را با Jokers Films برای فرانسه، Wanted Cinema برای ایتالیا و Karma Films برای اسپانیا بسته است و مذاکرات در چندین مورد دیگر در جریان است [ ]"}, {"source": "Variety", "title": "‘American Horror Story: 13’ Trailer: Jessica Lange, Sarah Paulson and Evan Peters Reprise Iconic Roles in Ryan Murphy’s Horror Anthology", "link": "https://variety.com/2026/tv/news/american-horror-story-13-trailer-jessica-lange-sarah-paulson-1236833134/", "summary": "Ryan Murphy s long-running anthology series American Horror Story is back for Season 13, and the new trailer teases Jessica Lange, Sarah Paulson and Evan Peters returns in the all-star season. While Lange will be reprising all four of her former AHS characters, Peters will play five different people and Paulson will play six. Lange was [ ]", "date_str": "2026-09-10T14:09:50+00:00", "hash": "ef2085824cf6d455", "title_fa": "تریلر «داستان ترسناک آمریکایی: 13»: جسیکا لنگ، سارا پالسون و ایوان پیترز نقش‌های نمادین را در گلچین ترسناک رایان مورفی تکرار می‌کنند.", "summary_fa": "مجموعه طولانی‌مدت آنتولوژی آمریکایی «داستان ترسناک آمریکایی» رایان مورفی برای فصل 13 بازگشته است و تریلر جدید جسیکا لانژ، سارا پالسون و ایوان پیترز را در فصل پر ستاره بازمی‌گرداند. در حالی که لانژ هر چهار شخصیت قبلی خود در AHS را تکرار خواهد کرد، پیترز در نقش پنج شخصیت مختلف و پالسون نقش شش نفر را بازی خواهند کرد. Lange آخرین بار بیش از یک دهه پیش در Freak Show دیده شد، در حالی که پیترز و پالسون هر دو آخرین بار در فیلم Double Feature ظاهر شدند. داستان‌های مرتبط، نیک محمد، ستاره تد لسو، میزبان بازی The Traitors Stage Play در لندن، رئیس Dreamkite Yoko Higuchi-Zitzmann درباره فرصت‌ها و نگرانی‌های صنعت هوش مصنوعی: تولید هوش مصنوعی بسیاری از مشاغل جدید برای انسان ایجاد خواهد کرد. آخرالزمان و جیمی بروئر در نقش آدلاید لنگدون بازمی‌گردند که تا آخر عمر در فیلم Murder House ظاهر شد. بازیگران جدید عبارتند از پل آنتونی کلی، ستاره داستان عشق، جان واترز کارگردان فلامینگوهای صورتی، آوانتیکا وانداناپو ستاره فیلم‌های دختر بد، جوی پولاری معمولی سریال جنایی آمریکایی و الکس کونسانی مدل. محبوب در Variety از زمانی که در سال 2011 با فیلم Murder House شروع به کار کرد، American Horror Story سبک گلچینی را پذیرفت و هر فصل با اعضای جدید بازیگران و هیولاهای قاتل جدید همراه بود. در تمام 13 فصل، این سریال نامزد بیش از 50 جایزه امی شده است و بازیگرانی مانند کتی بیتس و لانژ جوایز خود را دریافت کردند. مورفی به Variety درباره بازگشت بازیگران طعنه زد، برخی از آنها در یک صحنه دو شخصیت از دو فصل مختلف را بازی خواهند کرد. ایوان [پیترز] در یک نقطه، نقش دو شخصیت متفاوت را بازی می کرد و با خودش صحبت می کرد. بنابراین ساختن آن واقعا سرگرم کننده و دشوار بود و من آن را دوست داشتم. من تقریباً"}, {"source": "Variety", "title": "New York Games Week to Launch in October as First Citywide Video Game Industry Event", "link": "https://variety.com/2026/gaming/news/new-york-games-week-launches-2026-1236857222/", "summary": "The first New York Games Week will take place Oct. 4-11 with video game industry-themed events, showcases, conferences, tournaments, summits, professional mixers and meetups across the five boroughs of New York City. From gaming industry vets Guy Blomberg (Games Industry Gathering), Krysti Pryde (PlayNYC), and Amit Hossain (IGDA NYC) and with support from NYC Mayor’s [ ]", "date_str": "2026-09-10T14:04:56+00:00", "hash": "b7e0f57719ff267e", "title_fa": "هفته بازی های نیویورک در اکتبر به عنوان اولین ر     function renderNews() {

      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();

        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';

        const source = item.source || 'منبع خبر';

        const isRead = readArticles.has(item.hash);

    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
