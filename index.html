-disease/", "summary": "پژوهشی تازه می‌گوید سطح بالاتر پیام‌رسان عصبی اورکسین، عامل تنظیم خواب و بیداری در مایع مغزی‌نخاعی، می‌تواند با پیشرفت سریع‌تر آلزایمر مرتبط باشد.", "date_str": "2026-09-10T18:25:00+00:00", "hash": "a44f6f6a2131602a", "title_fa": "ارتباط امواج خواب عمیق با آلزایمر؛ پیام‌رسان اورکسین شاید سرعت زوال عقل را افزایش دهد", "summary_fa": "پژوهشی تازه می‌گوید سطح بالاتر پیام‌رسان عصبی اورکسین، عامل تنظیم خواب و بیداری در مایع مغزی‌نخاعی، می‌تواند با پیشرفت سریع‌تر آلزایمر مرتبط باشد. تبلیغات ارتباط میان خواب و بیماری آلزایمر از مدت‌ها پیش شناخته شده، اما سازوکار دقیق اثرگذاری همچنان موضوعی جذاب برای پژوهش است. اکنون، دانشمندان در مطالعه‌ای تازه به بررسی ارتباط میان فعالیت‌های الکتریکی خاص در طول خواب عمیق، یک پپتید پیام‌رسان عصبی به نام اورکسین و میزان پیشرفت بیماری آلزایمر پرداخته‌اند. به‌گزارش ساینس‌آلرت ، پژوهشگران در ابتدا ۶۰ نفر را که به‌تازگی ابتلایشان به آلزایمر خفیف تا متوسط ​​تشخیص داده شده بود، برای مطالعه انتخاب کردند. این افراد ۶۰ سال یا بیشتر سن داشتند و هیچ‌گونه دارویی که بر فعالیت امواج مغزی تأثیر بگذارد، مصرف نمی‌کردند. شرکت‌کنندگان یک شب در آزمایشگاه تحت پایش دستگاه‌های ثبت خواب قرار گرفتند و صبح روز بعد، نمونه‌ی مایع مغزی‌نخاعی (CSF) آن‌ها جمع‌آوری شد؛ مایعی بی‌رنگ که مغز و نخاع را در بر می‌گیرد و مولکول‌ها را در سیستم عصبی جابه‌جا می‌کند. سپس تیم مطالعه روند پیشرفت علائم آلزایمر در این افراد را به مدت سه سال زیر نظر گرفت. هدف اصلی از آزمایش نمونه‌های مایع مغزی‌نخاعی، اندازه‌گیری سطح پیام‌رسان شیمیایی اورکسین بود؛ ماده‌ای که در تنظیم چرخه‌ی خواب و بیداری نقش دارد. برای نمونه، در نارکولپسی نوع یک (حمله خواب)، کمبود اورکسین در مغز باعث خواب‌آلودگی شدید و ضعف ناگهانی عضلات می‌شود. پژوهشگران قصد داشتند بدانند آیا اورکسین با آلزایمر نیز ارتباط دارد یا خیر، به‌ویژه از این رو که در حال حاضر داروهای فعال‌کننده یا مهارکننده‌ی اورکسین در بازار موجود است. سطح اورکسین در مبتلایان به آلزایمر ممکن است دچار اختلال باشد"}, {"source": "Zoomit", "title": "مدل ۲۰۲۸ ولوو XC40 رونمایی شد؛ خودرو جذاب سوئدی با چهره جدید", "link": "https://www.zoomit.ir/car/466947-2028-volvo-xc40-details-specs/", "summary": "ولوو از مدل ۲۰۲۸ شاسی‌بلند XC40 با طراحی بازنگری‌شده، پیشرانه‌ی هیبریدی ملایم و امکانات ایمنی پیشرفته رونمایی کرد.", "date_str": "2026-09-10T18:10:00+00:00", "hash": "def3c1fac350f0ce", "title_fa": "مدل ۲۰۲۸ ولوو XC40 رونمایی شد؛ خودرو جذاب سوئدی با چهره جدید", "summary_fa": "ولوو از مدل ۲۰۲۸ شاسی‌بلند XC40 با طراحی بازنگری‌شده، پیشرانه‌ی هیبریدی ملایم و امکانات ایمنی پیشرفته رونمایی کرد. تبلیغات ولوو XC40 مدل ۲۰۲۸ با مجموعه‌ای از به‌روزرسانی‌های ظاهری، کابین ارتقایافته و پیشرانه‌ی جدید معرفی شد . کوچک‌ترین شاسی‌بلند ولوو پس از نزدیک به یک دهه حضور در بازار، اکنون با چهره‌ای تازه و تغییراتی در بخش فنی عرضه می‌شود. نمای جلوی خودرو به چراغ‌های جدید با طرح چکش ثور، جلوپنجره‌ی باریک‌تر و کاپوت حجیم‌تر مزین شده است. رینگ‌های ۱۸ اینچی به‌صورت استاندارد ارائه می‌شوند و خریداران امکان سفارش رینگ‌های ۱۹ و ۲۰ اینچی را هم دارند. چراغ‌های بازطراحی‌شده‌ی عقب نمای مدرن‌تری به بخش پشتی بخشیده‌اند. کابین میزبان نمایشگر لمسی ۱۱٫۲ اینچی با زاویه‌ی متمایل به سمت راننده است که از سیستم‌عامل اختصاصی و هوش مصنوعی جمنای گوگل بهره می‌برد. طراحان میزان استفاده از پلاستیک مشکی پیانویی را در دریچه‌های هوا و بخش‌هایی از داشبورد کاهش داده‌اند و متریال نرم، چوب زبان‌گنجشک قهوه‌ای و تودوزی چرمی سفارشی را جایگزین کرده‌اند. بخش ایمنی شامل سیستم دوربین ۳۶۰ درجه با نمای سه‌بعدی، هشدار بازشدن درها برای جلوگیری از برخورد با دوچرخه‌سواران و سامانه‌ی ارتقایافته‌ی کمکی راننده با قابلیت تغییر خودکار خطوط حرکتی است. سایر مشخصات به شرح زیر است:"}, {"source": "Zoomit", "title": "جادوی هوش مصنوعی؛ پل واکر به فیلم‌های «سریع و خشن» برمی‌گردد؟", "link": "https://www.zoomit.ir/ai-articles/466973-paul-walker-brother-ai-fast-forever/", "summary": "هوش مصنوعی ممکن است پل واکر را به فیلم‌های «سریع و خشن» برگرداند؛ اما برادر واکر با این کار موافق نیست.", "date_str": "2026-09-10T18:07:56+00:00", "hash": "b12c02a75d0a95e9", "title_fa": "جادوی هوش مصنوعی؛ پل واکر به فیلم‌های «سریع و خشن» برمی‌گردد؟", "summary_fa": "هوش مصنوعی ممکن است پل واکر را به فیلم‌های «سریع و خشن» برگرداند؛ اما برادر واکر با این کار موافق نیست. تبلیغات بحث بازگرداندن پل واکر به دنیای سریع و خشن (Fast and Furious) دوباره بالا گرفته، اما خانواده‌ی او دست‌کم در یک بخش موضع روشنی دارند. کودی واکر می‌گوید علاقه‌ای ندارد در بازسازی حضور برادر فقیدش برای قسمت پایانی این مجموعه نقشی داشته باشد، حتی اگر فناوری امروز چنین امکانی را فراهم کرده باشد. پل واکر که زمانی یکی از شخصیت‌های اصلی سریع و خشن بود و نقش برایان اوکانر را بازی می‌کرد، در سال ۲۰۱۳ پس از برخورد خودرویش به یک تیر چراغ برق، درگذشت. کودی واکر توضیح داده که هوش مصنوعی می‌تواند برای بازآفرینی شخصیت برایان اوکانر به کار گرفته شود، چون از ۲۰۱۴ تاکنون حجم زیادی از تصاویر استفاده‌نشده از فیلم‌های قبلی سریع و خشن باقی مانده است. او گفته سازندگان این مجموعه توان فنی چنین کاری را دارند، اما پرسش اصلی برایش «آیا باید انجام شود یا نه» باقی می‌ماند. واکنش او صریح بود. کودی واکر گفت که «مشتاق» نیست بار دیگر به‌عنوان بدل‌کار وارد پروژه شود و ترجیح می‌دهد تصمیم نهایی به میلود واکر ، دختر پل واکر، سپرده شود. او تأکید کرد که پایان شخصیت برایان در سریع و خشن ۷ از نگاه او درست و محترمانه بوده، چون شخصیت کشته نشد و در مسیری آرام از مجموعه بیرون رفت. کودی واکر در ادامه اضافه کرد که حاضر نیست دوباره همان نقش را ایفا کند و اگر قرار باشد پروژه‌ای در این مسیر شکل بگیرد، «لازم نیست» از او یا کیلب واکر کمک بگیرند. به بیان دیگر، از نگاه او وزن تصمیم بیش از آن‌که فنی باشد، خانوادگی و اخلاقی است."}, {"source": "Zoomit", "title": "مدل بعدی هیوندای النترا بزرگ‌تر و قدرتمندتر می‌شود", "link": "https://www.zoomit.ir/car/466835-next-hyundai-elantra-hybrid-efficiency/", "summary": "نسل هشتم هیوندای النترا هیبرید با وجود افزایش ابعاد و قدرت، ۱۰ درصد مصرف سوخت کمتری خواهد داشت.", "date_str": "2026-09-10T17:40:00+00:00", "hash": "353c1ebe48f961c7", "title_fa": "مدل بعدی هیوندای النترا بزرگ‌تر و قدرتمندتر می‌شود", "summary_fa": "نسل هشتم هیوندای النترا هیبرید با وجود افزایش ابعاد و قدرت، ۱۰ درصد مصرف سوخت کمتری خواهد داشت. تبلیغات هیوندای نسل هشتم هیوندای النترا را که در بازار کره‌ی جنوبی با نام آوانته شناخته می‌شود، با تغییراتی بنیادین در طراحی، ابعاد و پیشرانه راهی بازار می‌کند. با وجود افزایش وزن، جثه و توان خروجی، مدل هیبریدی این سدان کره‌ای مصرف سوخت بهتری را نسبت‌به گذشته ارائه می‌دهد. به گفته‌ی منابع کره‌ای ، بازدهی مصرف سوخت مدل هیبریدی نسل جدید ۱۰ درصد بهبود یافته است. پیشرانه‌ی چهار سیلندر ۱٫۶ لیتری هیبریدی همراه با رینگ‌های ۱۷ اینچی، رکورد ۲۱٫۲ کیلومتر به ازای هر لیتر بنزین (معادل۴٫۷۲ لیتر در صد کیلومتر) را به ثبت رساند. نسل پیشین با رینگ‌های ۱۷ اینچی مصرف سوخت ۵٫۲۱ لیتر در صد کیلومتر داشت که نشان‌دهنده‌ی برتری آشکار نسل تازه است. پیشرانه‌ی هیبریدی جدید ۱۵۵ اسب‌بخار قدرت تولید می‌کند که ۱۶ اسب‌بخار از مدل قبلی بیشتر خواهد بود. هیوندای هنوز نسخه‌ی مخصوص بازار آمریکای شمالی را رونمایی نکرده و احتمال دارد برخی مشخصات فنی برای تطابق با استانداردهای محلی تغییر کنند. رونمایی رسمی این خودرو برای بازارهای جهانی به‌زودی انجام خواهد شد."}, {"source": "Zoomit", "title": "از یافتن بازمانده تا تزریق دارو؛ سوسک‌های سایبورگ به عملیات نجات کمک می‌کنند", "link": "https://www.zoomit.ir/fundamental-science/466972-cyborg-cockroach-paramedic-rescue/", "summary": "سوسک‌ها به سایبورگ امدادگر تبدیل می‌شوند؛ این حشرات می‌توانند با حرکت زیر آوار، بازماندگان را بیابند و پیش از رسیدن امدادگران دارو تزریق کنند.", "date_str": "2026-09-10T17:20:00+00:00", "hash": "a95096cdd866a027", "title_fa": "از یافتن بازمانده تا تزریق دارو؛ سوسک‌های سایبورگ به عملیات نجات کمک می‌کنند", "summary_fa": "سوسک‌ها به سایبورگ امدادگر تبدیل می‌شوند؛ این حشرات می‌توانند با حرکت زیر آوار، بازماندگان را بیابند و پیش از رسیدن امدادگران دارو تزریق کنند. تبلیغات اگر سوسک‌ها را موجوداتی چندش‌آور و بی‌فایده می‌دانید، شاید وقتش رسیده باشد که در قضاوتتان تجدیدنظر کنید. پژوهشگران در سال‌های اخیر از سوسک‌ها برای ایفای نقشی مهم در عملیات جست‌وجو و نجات استفاده کرده‌اند. مهندسان با نصب سامانه‌های الکترونیکی کوچک و دوربین‌های کنترل از راه دور روی پشت سوسک‌ها، آن‌ها را به سایبورگ تبدیل کرده‌اند. سوسک‌ها به‌دلیل جثه کوچک و چابکی می‌توانند به مکان‌هایی وارد شوند که ربات‌ها یا پهپادهای معمولی نمی‌توانند به آن‌ها دسترسی پیدا کنند. آزمایش‌های قبلی، قابلیت‌های مختلفی به سوسک‌های سایبورگ داده‌اند. پژوهشگران سایبورگ‌ها را به سامانه تنفس زیر آب مجهز کردند، مهارت‌های مسیریابی‌شان را بهبود دادند و حتی دستگاهی ساختند که می‌تواند سوسک‌ها را ظرف چند ثانیه به سایبورگ تبدیل کند. به‌گزارش نیواطلس ، اکنون پژوهشگران دانشگاه کوئینزلند با همکاری دانشگاه نیوساوث‌ولز ایده را یک گام فراتر برده و سوسک‌ها را به چیزی تبدیل کرده‌اند که آن را «پارابورگ» یا سایبورگ‌های امدادگر می‌نامند. اعصاب سوسک در سامانه نقش سیستم هدایت را بر عهده دارد توانایی سوسک‌ها برای عبور از شکاف‌های میان آوار زلزله، پیدا کردن بازماندگان و کمک به نجات جان، کاربرد این حشرات را در عملیات امداد و نجات جدی‌تر می‌کند. سوسک‌ها البته به‌طور مستقل نمی‌دانند به کجا بروند و اپراتورهای انسانی باید حرکاتشان را کنترل کنند. اپراتورها با ارسال تحریک الکتریکی به الکترودهای کاشته‌شده در نزدیکی شاخک‌های سوسک، مسیر حرکت را تعیین می‌کنند. اعصاب سوسک در این سامانه عملاً نقش سیستم هدایت را بر عهده دارند. پژوهشگران برای حفظ رفاه سوسک‌ها، هنگام نصب مهار الکترونیکی به آن‌ها داروی بیهوشی می‌دهند. سوسک‌ها پس از جداشدن تجهیزات به زندگی عادی خود برمی‌گردند و مانند سایر سوسک‌ها به عمرشان ادامه می‌دهند؛ بنابراین پژوهشگران ملاحظات اخلاقی مربوط به استفاده از حشرات را نیز"}, {"source": "Zoomit", "title": "چطور با فلش مموری، مودم را به فضای ذخیره‌سازی تحت شبکه تبدیل کنیم؟", "link": "https://www.zoomit.ir/howto/466860-turn-usb-storage-nas/", "summary": "اگر مودم شما پورت USB دارد، احتمالا می‌توانید از آن برای ساخت فضای ذخیره‌سازی تحت شبکه استفاده کنید.", "date_str": "2026-09-10T17:00:00+00:00", "hash": "353744d458be0288", "title_fa": "چطور با فلش مموری، مودم را به فضای ذخیره‌سازی تحت شبکه تبدیل کنیم؟", "summary_fa": "اگر مودم شما پورت USB دارد، احتمالا می‌توانید از آن برای ساخت فضای ذخیره‌سازی تحت شبکه استفاده کنید. تبلیغات علاقه‌مندی به تکنولوژی هیچ‌وقت سرگرمی ارزانی نبوده و این روزها قیمت تجهیزات شبکه و ذخیره‌سازی از همیشه بیشتر شده است. به همین دلیل، پیش از خرید دستگاه جدید، بررسی کنید که آیا می‌توان از همان چیزی که در خانه است استفاده‌ی بهتری کرد یا نه. یکی از بهترین نمونه‌های این موضوع، تبدیل روتر خانگی انش استفاده کند. به گفته‌ی او، مهم‌ترین نکته این است که بچه‌هایش ببینند نباید آسایش مالی را به گفتن حقیقت ترجیح داد. سنت‌کلر همچنین گفت خطرِ حرف‌زدن را آگاهانه پذیرفته، حتی اگر این خطر هزینه داشته باشد."}, {"source": "Zoomit", "title": "آیا درون‌گراها و برون‌گراها باید به‌شکلی متفاوت از هوش مصنوعی استفاده کنند؟", "link": "https://www.zoomit.ir/human-science/466804-personality-types-ai-usage/", "summary": "تیپ شخصیتی شما، از درون‌گرایی تا برون‌گرایی، شیوه تعامل و بهره‌گیری از ابزارهای هوش مصنوعی را تغییر می‌دهد؛ اما شخصی‌سازی بیش‌ازحد نیز پیامدهایی دارد.", "date_str": "2026-09-10T14:40:00+00:00", "hash": "cfa7b59c7ff1ec32", "title_fa": "آیا درون‌گراها و برون‌گراها باید به‌شکلی متفاوت از هوش مصنوعی استفاده کنند؟", "summary_fa": "تیپ شخصیتی شما، از درون‌گرایی تا برون‌گرایی، شیوه تعامل و بهره‌گیری از ابزارهای هوش مصنوعی را تغییر می‌دهد؛ اما شخصی‌سازی بیش‌ازحد نیز پیامدهایی دارد. تبلیغات بیش از یک قرن پیش، کارل یونگ، روان‌پزشک سوئیسی، در نظریه‌ی خود درباره‌ی تیپ‌های روان‌شناختی، درون‌گرایی و برون‌گرایی را به دو شیوه‌ی متفاوت برای جهت‌گیری ذهنی انسان نسبت به دنیای درون و بیرون نسبت داد. امروز این دو واژه بیشتر برای توصیف میزان اجتماعی‌بودن افراد به کار می‌روند، اما منظور یونگ فراتر از علاقه به مهمانی یا وقت‌گذرانی در کنار دیگران بود. تمایز اصلی نظریه‌ی یونگ، یعنی تفاوت دیدگاه، در عصر هوش مصنوعی مولد پرسش جالبی ایجاد می‌کند: اگر انسان‌ها در نحوه‌ی جهت‌گیری طبیعی خود به دنیای درون و بیرون متفاوت‌اند، آیا باید از هوش مصنوعی هم به شکل متفاوتی استفاده کنند؟ یونگ در کتاب «تیپ‌های روان‌شناختی» که در سال ۱۹۲۱ منتشر شد، درون‌گرایی و برون‌گرایی را دو جهت‌گیری متفاوت می‌دانست. درون‌گرایی بیشتر به دنیای ذهنی و درونی، برون‌گرایی به اشیا و رویدادهای بیرونی مربوط می‌شد. البته پژوهش‌های امروزی شخصیت دقیقاً از مدل یونگ پیروی نمی‌کنند و معمولاً برون‌گرایی را به‌عنوان یکی از پنج ویژگی اصلی شخصیت، در مدل پنج‌عاملی شخصیت (FFM) یا همان بیگ‌فایو (Big Five) مورد بررسی قرار می‌دهند که طیف زیر را شامل می‌شود: بنابراین، نباید پژوهش‌های جدید درباره‌ی شخصیت و هوش مصنوعی را آزمون مستقیم نظریه‌ی اصلی یونگ دانست."}, {"source": "Google AI Blog", "title": "3 ways to prep for your next big race with Search", "link": "https://blog.google/products-and-platforms/products/search/running-race-training-tips/", "summary": "Search can help runners get race-day ready with registration alerts, tailored training plans, and more.", "date_str": "2026-09-10T16:00:00+00:00", "hash": "22ac43e0cf1bd153", "title_fa": "3 روش برای آماده شدن برای مسابقه بزرگ بعدی خود با جستجو", "summary_fa": "3 راه برای آماده شدن برای مسابقه بزرگ بعدی خود با جستجوی 10 سپتامبر 2026 می تواند به شما کمک کند تا با برنامه های آموزشی مناسب، لیست های پخش سفارشی و موارد دیگر، روز مسابقه را آماده کنید. مرورگر شما از عنصر صوتی پشتیبانی نمی کند. محبوبیت دویدن در حال افزایش است و شما می توانید از ابزارهای هوش مصنوعی جستجوی گوگل برای ساده سازی آمادگی مسابقه خود استفاده کنید. از ابزار Canvas برای ایجاد یک برنامه تمرینی شخصی‌سازی شده استفاده کنید، حساب YouTube Music خود را برای ایجاد لیست‌های پخش انگیزشی وصل کنید و ابزار خاصی را که متناسب با بودجه و نیازهای شما است جستجو کنید. با درخواست جستجو برای یک طرح سفارشی متناسب با مسیرهای محلی و سطح تناسب اندام فعلی شروع کنید. از آنجایی که مردم به دنبال راه‌هایی برای جدا کردن و لمس چمن هستند، جستجوهای مرتبط با دویدن افزایش می‌یابد: جستجوهایی مانند «باشگاه دویدن»، «نحوه انتخاب کفش‌های دویدن» و «چگونه برای ماراتن تمرین کنیم» امسال به بالاترین حد خود رسیده است. دویدن یک مسابقه به قدرت، قدرت و (میزان شگفت انگیز) سازماندهی نیاز دارد. خوشبختانه، ویژگی‌های هوش مصنوعی Search، جمع‌آوری برنامه مسابقه خود را آسان‌تر از همیشه می‌کند. در اینجا سه ​​راه وجود دارد که جستجو می تواند به شما کمک کند تا از خط پایان عبور کنید."}, {"source": "Business Insider", "title": "I work at Trader Joe's. I swear by these 12 purchases every time.", "link": "https://www.businessinsider.com/best-things-trader-joes-employee-reccomendations-workers-2026-9", "summary": "As a Trader Joe s employee, I am familiar with a lot of the chain s products. However, only a few are staples in my cart each week. Heather Leith I work at Trader Joe's and regularly swear by a lot of the chain's products. In the freezer aisle, I love the fiocchetti, diner mac 'n cheese, and bulgogi beef fried rice. I also love Trader Joe's apple-cinnamon sourdough bread and non-dairy brown-sugar oat creamer. If you come through my line at Trader Joe's, you'll hear me cheerfully recommending many items — the seasonal popcorns, the newest dip, the most expensive-tasting wines under $6. However, only a few items are always in my basket during my post-shift shopping sesh. My partner and I make most meals from scratch using Trader Joe's ingredients, but I am no stranger to a microwave meal or a salad kit. For lunches and breakfasts especially, I typically mix and match items to put together a meal that requires just enough effort to make me feel like I did something. When I'm not answering questions about when the mini tote bags will be back in stock, I'm talking passionately about these — the 12 purchases I swear by. I have bought hundreds of Joe s Diner mac n cheese meals over the years. Heather Leith Mac and cheese is my favorite food. This frozen version beats every other store-bought mac and cheese — it even ranks higher for me than restaurant dishes. It has actual shredded cheese, so you get a nice cheese pull on every bite. I mix in a small spoonful of Trader Joe's Crunchy Chili Onion to add depth of flavor and a bit of heat. Trader Joe s sliced apple-cinnamon sourdough bread is incredible. Heather Leith This sweet sourdough with actual apple pieces was so popular this fall that Trader Joe's has made it a year-round member of the bread family. Thank goodness it's no longer a seasonal fall food , because I was suffering without it. I like to spread an ungodly amount of butter onto two freshly toasted pieces, then ascend to another planet as I eat. Pro tip from someone who often works in the bread section: Store this one on the counter to preserve its soft, chewy texture. Don t skip the cheese-filled fiocchetti with pink sauce. Heather Leith This stuffed fiocchetti pasta dish is severely underrated. I'm always recommending it to customers as they browse Trader Joe's frozen pasta section. The little bundles are filled with a ricotta cheese mix, and the pink sauce is creamy and dotted with basil. You can prepare it on the stove, but take the microwave short", "date_str": "2026-09-11T12:54:01+00:00", "hash": "6c714c75232e461f", "title_fa": "من در Trader Joe کار می کنم. هر بار به این 12 خرید قسم می خورم.", "summary_fa": "من به عنوان یک کارمند Trader Joe با بسیاری از محصولات زنجیره ای آشنا هستم. با این حال، فقط تعداد کمی از آنها هر هفته در سبد خرید من کالای اصلی هستند. هدر لیث من در Trader Joe کار می کنم و مرتباً روی بسیاری از محصولات زنجیره ای قسم می خورم. در راهروی فریزر، من عاشق فیوچتی، پنیر مک ان، و برنج سرخ شده با گوشت گاو بولگوگی هستم. من همچنین عاشق نان خمیر ترش سیب و دارچین Trader Joe و خامه جو دوسر قهوه ای شکری غیرلبنی هستم. اگر به خط من در Trader Joe مراجعه کنید، می شنوید که من با خوشحالی اقلام زیادی را توصیه می کنم - پاپ کورن های فصلی، جدیدترین دیپ، گران ترین شراب های زیر 6 دلار. با این حال، فقط چند کالا همیشه در سبد خرید من پس از شیفت خرید وجود دارد. من و شریکم اکثر وعده‌های غذایی را از ابتدا با استفاده از مواد سازنده Trader Joe درست می‌کنیم، اما من با یک وعده غذایی مایکروویو یا کیت سالاد غریبه نیستم. مخصوصاً برای ناهار و صبحانه، من معمولاً اقلامی را با هم ترکیب می‌کنم تا یک وعده غذایی درست کنم که به تلاش کافی نیاز دارد تا احساس کنم کاری انجام داده‌ام. وقتی به سؤالات مربوط به زمان عرضه مجدد کیف‌های کوچک پاسخ نمی‌دهم، مشتاقانه در مورد اینها صحبت می‌کنم - 12 خریدی که به آنها قسم می‌خورم. من در طول سال ها صدها وعده غذایی پنیر Mac n Joe Diner خریداری کرده ام. هدر لیث مک و پنیر غذای مورد علاقه من است. این نسخه منجمد از هر مک و پنیر دیگری که در فروشگاه ها خریداری می شود شکست می خورد - حتی برای من از غذاهای رستورانی بالاتر است. پنیر رنده شده واقعی دارد، بنابراین در هر لقمه پنیر خوبی خواهید داشت. من یک قاشق کوچک"}, {"source": "Business Insider", "title": "25 years later, 9/11 still shapes the way we fly. Here's how air travel changed after the attacks.", "link": "https://www.businessinsider.com/september-11-attacks-how-flying-airport-security-airline-changes-2026-9", "summary": "A TSA security checkpoint at John Wayne Airport in Santa Ana, California. Jeff Gritchen/MediaNews Group/Orange County Register via Getty Images Aviation security was completely overhauled after the terrorist attacks of September 11, 2001. The TSA, which federalized airport security, was established in November 2001. After 9/11, only ticketed flyers were allowed past security, and cockpit doors were bulletproofed. Flying has completely changed since Al Qaeda hijackers carried out the terrorist attacks of September 11, 2001, 25 years ago. The newly created Transportation Security Administration replaced the private screening checkpoints that flyers were used to and introduced a new normal at airports — one where water bottles are emptied, bodies are scanned, and goodbyes are said before reaching the gate. The planes were similarly hardened with bulletproof doors and the strictest protocols for cockpit access; pilots and flight attendants also received additional training to handle terrorists. Arik Arad, who advised the President's Commission on Aviation Security and Terrorism following the 1988 bombing of Pan Am Flight 103 and served as head of security at Israel's Ben Gurion Airport , said that these changes were part of a post-9/11 paradigm shift favoring a layered approach to security. \"The principle is simple — if one layer fails, another should detect or stop the threat,\" Arad, who now operates an aviation cybersecurity company , told Business Insider. \"Intelligence, passenger assessment, screening, baggage security, airport access control, aircraft protection, trained personnel, and law enforcement all became parts of an interconnected security system. That change in philosophy was, in my view, more important than any individual technology introduced after the attacks.\" Here are the biggest ways flying has changed since 9/11. After the September 11 attacks, airport security was federalized through the establishment of the Transportation Security Administration. CHICAGO - SEPTEMBER 10: A security worker with the Transportation Security Administration (TSA) screens a travelers belongings September 10, 2002 in Terminal 1 at O Hare International Airport in Chicago, Illinois. Over 500 new federally trained security workers took over the screening work today at security checkpoints in the airport s largest terminal, replacing workers from Argenbright Security. Tim Boyle/Getty Images Before 9/11, airport security was handled by numerous private companies. In ", "date_str": "2026-09-11T12:52:01+00:00", "hash": "b9136e29713029fe", "title_fa": "25 سال بعد، 11 سپتامبر هنوز نحوه پرواز ما را شکل می دهد. در اینجا نحوه تغییر سفرهای هوایی پس از حملات آمده است.", "summary_fa": "یک ایست بازرسی امنیتی TSA در فرودگاه جان وین در سانتا آنا، کالیفرنیا. جف گریچن/گروه رسانه نیوز/ ثبت نام اورنج کانتی از طریق گتی ایماژ امنیت هوانوردی پس از حملات تروریستی 11 سپتامبر 2001 به طور کامل بازنگری شد. TSA، که امنیت فرودگاه را فدرال کرد، در نوامبر 2001 تأسیس شد. پس از 11 سپتامبر، فقط پروازهای بلیتی مجاز به عبور از امنیت بودند و درهای کابین خلبان ضد گلوله بودند. از زمانی که هواپیماربایان القاعده 25 سال پیش، حملات تروریستی 11 سپتامبر 2001 را انجام دادند، پرواز کاملاً تغییر کرده است. اداره امنیت حمل و نقل تازه ایجاد شده، ایست های بازرسی خصوصی را که پروازها به آن ها عادت داشتند، جایگزین کرد و حالت عادی جدیدی را در فرودگاه ها معرفی کرد - جایی که بطری های آب خالی می شوند، اجساد اسکن می شوند و قبل از رسیدن به دروازه خداحافظی می شود. هواپیماها به طور مشابه با درهای ضد گلوله و سخت ترین پروتکل ها برای دسترسی به کابین خلبان سخت شده بودند. خلبانان و مهمانداران هواپیما نیز آموزش های بیشتری برای مقابله با تروریست ها دریافت کردند. آریک آراد، که پس از بمباران پرواز 103 پان ام در سال 1988 به کمیسیون امنیت هوانوردی و تروریسم رئیس جمهور مشاوره می داد و به عنوان رئیس امنیت فرودگاه بن گوریون اسرائیل خدمت می کرد، گفت که این تغییرات بخشی از تغییر پارادایم پس از 11 سپتامبر است که به نفع رویکرد لایه ای به امنیت است. آراد که اکنون یک شرکت امنیت سایبری هوانوردی را اداره می کند، به Business Insider گفت: «اصل ساده است – اگر یک لایه از کار بیفتد، دیگری باید تهدید را شناسایی یا متوقف کند. «اطلاعات، ارزیابی مسافران، غربالگری، امنیت چمدان، کنترل دسترسی به فرودگاه، حفاظت از هواپیما، پرسنل آموزش دیده و اجرای قانون، همه به بخشی از یک سیستم امنیتی"}, {"source": "Business Insider", "title": "Lovable's CEO weighed in on warnings that AI could wipe out humanity", "link": "https://www.businessinsider.com/lovables-ceo-on-warning-ai-could-wipe-out-humanity-2026-9", "summary": "Lovable CEO Anton Osika spoke out, while the CEOs of Anthropic and OpenAI have stayed quiet. Justin Sullivan/Getty Images; Big Event Media/Getty Images for HumanX Conference; WEF Former Anthropic researcher Jacob Coxon has found a tech executive who shares his fears over AI. Lovable CEO Anton Osika said AI development should slow while safety cannot be guaranteed. OpenAI and Anthropic's leaders have not publicly addressed Coxon's warning, which sparked a big debate. Most AI leaders have stayed quiet since Jacob Coxon accused OpenAI and Anthropic of \" gambling with our lives \" — except for one: Lovable CEO Anton Osika. The founder of the Swedish vibe-coding startup wrote in a LinkedIn post on Thursday that warnings such as Coxon's \"deserve to be taken seriously,\" and backed slowing AI development. Coxon, a 27-year-old who spent around three years as a researcher at OpenAI and Anthropic, quit the latter this week. He warned the two labs were racing toward self-improving superintelligence without acting responsibly. \"The people building AI earnestly believe that it could kill us all by the end of the decade,\" he wrote on X on Wednesday. \"This is not a marketing stunt.\" It set off a fierce debate among AI researchers , policymakers, and tech observers. Several current and former Anthropic employees publicly endorsed parts of Coxon's warning. Others like Gary Marcus, an AI researcher and author, said there was \"no realistic scenario\" for near-term human extinction, and Melanie Mitchell, a professor at the Santa Fe Institute, similarly called extinction fears \"far-fetched.\" On Thursday, Osika wrote in the post, which featured screenshots of Coxon's X thread: \"Decisions that could affect everyone deserve public accountability. The people building the most powerful systems should have to demonstrate that they can keep them under control.\" Osika added: \"As a European founder, I want our leaders to hear this: you have my support in pushing for international coordination, including slowing dangerous development when safety cannot be demonstrated.\" Evan Hubinger, who leads Anthropic's alignment team, which tests if superintelligent AI follows human values, said he personally believed there was a greater-than-10% chance that AI could kill all humans within the next decade. He added that Anthropic did not yet have a plan to solve alignment for superintelligence, although it was trying its best. OpenAI and Anthropic leaders, meanwhile, have remained silent, but have issu", "date_str": "2026-09-11T12:49:28+00:00", "hash": "ef3dbf50d7430b61", "title_fa": "مدیر عامل شرکت Lovable هشدارهایی مبنی بر اینکه هوش مصنوعی می تواند بشریت را از بین ببرد، بررسی کرد", "summary_fa": "مدیر عامل دوست داشتنی آنتون اوسیکا صحبت کرد، در حالی که مدیران عامل Anthropic و OpenAI ساکت ماندند. جاستین سالیوان/گتی ایماژ; رویداد بزرگ رسانه/گتی ایماژ برای کنفرانس HumanX. جیکوب کوکسون، محقق سابق آنتروپیک WEF، یک مدیر فناوری پیدا کرده است که ترس های خود را در مورد هوش مصنوعی به اشتراک می گذارد. مدیر عامل دوست داشتنی آنتون اوسیکا گفت که توسعه هوش مصنوعی باید کند شود در حالی که ایمنی نمی تواند تضمین شود. رهبران OpenAI و Anthropic به طور علنی به هشدار Coxon که بحث بزرگی را برانگیخت، توجه نکرده اند. بیشتر رهبران هوش مصنوعی از زمانی که جیکوب کوکسون OpenAI و Anthropic را به \"قمار با زندگی ما\" متهم کرد، سکوت کرده اند - به جز یکی: مدیر عامل دوست داشتنی آنتون اوسیکا. بنیانگذار استارت‌آپ سوئدی کدنویسی vibe در روز پنجشنبه در پستی در لینکدین نوشت که هشدارهایی مانند هشدارهای Coxon «شایسته جدی گرفتن است» و از کند شدن توسعه هوش مصنوعی حمایت می‌کند. کوکسون، یک جوان 27 ساله که حدود سه سال را به عنوان محقق در OpenAI و Anthropic گذراند، این هفته دوم را ترک کرد. او هشدار داد که این دو آزمایشگاه بدون اینکه مسئولانه عمل کنند، به سمت سوپرهوشی خودساز می‌جنگند. او در روز چهارشنبه در X نوشت: «افرادی که هوش مصنوعی می‌سازند، عمیقاً معتقدند که می‌تواند تا پایان دهه همه ما را بکشد». \"این یک شیرین کاری بازاریابی نیست.\" این موضوع بحث‌های شدیدی را بین محققان هوش مصنوعی، سیاست‌گذاران و ناظران فناوری به راه انداخت. چندین کارمند فعلی و سابق آنتروپیک بخش‌هایی از هشدار کاکسون را تایید کردند. دیگرانی مانند گری مارکوس، محقق و نویسنده هوش مصنوعی، گفت که \"هیچ سناریوی واقعی\" برای انقراض کوتاه مدت انسان وجود ندارد و ملانی میچل، استاد موسسه سانتافه، به طور مشابه ترس از انقراض را \"دورآمیز\" خواند. روز پنجشنبه، اوسیکا در این پست که اسکرین"}, {"source": "Business Insider", "title": "The US Army can rush Patriot batteries off to global hot spots in days. Here's what the scramble looks like.", "link": "https://www.businessinsider.com/how-us-army-deploys-patriot-missiles-around-world-in-days-2026-9", "summary": "The US Army can move a Patriot battery across the world in a matter of days. US Army photo The MIM-104 Patriot is a cornerstone of the Army's air defense capabilities. The Army has surged Patriot batteries across continents and around the world in response to crises. Army officers told Business Insider how Patriot crews quickly deploy into combat. The US Army's Patriot surface-to-air missile system has emerged as a cornerstone of its air defense operations in recent years, protecting American forces and allies from missile and drone threats. Getting one of the most in-demand air defense systems into position in a crisis is a massive logistical undertaking, but Army officers involved in past Patriot deployments told Business Insider that the US military can fly the crews, launchers, radars, and interceptors off to whatever hot spot needs them in just a matter of days. Deploying a Patriot battery in an emergency situation means soldiers may be sent with little warning, often with no clear sense of when they will return. These abrupt departures can be difficult for soldiers and their families. \"Ultimately, we're first responders,\" said Capt. Morgan Lloyd, a Patriot battery commander. \"We needed to go, so we went,\" he said of a past deployment. \"Soldiers were proud to do it.\" The first 48 hours after orders are given The Army has repeatedly had to surge Patriot batteries into hot spots in response to global crises in recent years, including Russia's full-scale invasion of Ukraine and the various conflicts in the Middle East . Deployments have differed in destination, but the Army officers Business Insider spoke with said the process was remarkably similar in execution. The calls came with little warning, triggering a scramble. Days later, though, the Patriots were in position, ready to defend the skies against airborne threats — everything from crewed planes to missiles to drones. The US has deployed Patriot batteries to Eastern Europe and the Middle East in recent years. US Army photo Lloyd recalled a deployment in support of Middle East operations. He was stationed in Germany when the call came in on a Wednesday evening informing him that he needed to head out. That started the clock on a 48-hour rush to determine who was going — he could take just 80 soldiers and only the equipment that was absolutely necessary — and then get them through deployment processing and aboard a Boeing C-17 Globemaster III transport plane that would take them where they were need", "date_str": "2026-09-11T12:47:21+00:00", "hash": "dad102ca8601bb1c", "title_fa": "ارتش ایالات متحده می تواند باتری های پاتریوت را در چند روز به نقاط داغ جهانی منتقل کند. در اینجا تقلا به نظر می رسد.", "summary_fa": "ارتش ایالات متحده می تواند یک باتری پاتریوت را در عرض چند روز در سراسر جهان جابجا کند. عکس ارتش ایالات متحده MIM-104 Patriot سنگ بنای قابلیت های دفاع هوایی ارتش است. ارتش در پاسخ به بحران ها، باتری های پاتریوت را در سراسر قاره ها و سراسر جهان افزایش داده است. افسران ارتش به Business Insider گفتند که چگونه خدمه پاتریوت به سرعت وارد نبرد می شوند. سامانه موشکی زمین به هوای پاتریوت ارتش آمریکا به عنوان سنگ بنای عملیات پدافند هوایی این کشور در سال های اخیر ظاهر شده است و از نیروهای آمریکایی و متحدانش در برابر تهدیدات موشکی و پهپادی محافظت می کند. قرار دادن یکی از پرتقاضاترین سامانه‌های پدافند هوایی در موقعیت بحران، یک اقدام لجستیکی عظیم است، اما افسران ارتش درگیر در استقرار پاتریوت‌های گذشته به Business Insider گفتند که ارتش ایالات متحده می‌تواند خدمه، پرتابگرها، رادارها و رهگیرها را در عرض چند روز به هر نقطه داغی که به آنها نیاز دارد پرواز دهد. استقرار یک باتری پاتریوت در شرایط اضطراری به این معنی است که سربازان ممکن است با اخطار کمی فرستاده شوند، اغلب بدون درک روشنی از زمان بازگشت. این خروج های ناگهانی می تواند برای سربازان و خانواده های آنها دشوار باشد. سروان مورگان لوید، یکی از فرماندهان باتری پاتریوت، گفت: \"در نهایت، ما اولین پاسخ دهنده هستیم.\" او در مورد یک استقرار گذشته گفت: «ما باید می رفتیم، بنابراین رفتیم. سربازان به انجام این کار افتخار می کردند. 48 ساعت اول پس از صدور دستور، ارتش در پاسخ به بحران‌های جهانی در سال‌های اخیر، از جمله تهاجم تمام‌مقیاس روسیه به اوکراین و درگیری‌های مختلف در خاورمیانه، بارها مجبور شده است باتری‌های پاتریوت را به نقاط داغ منتقل کند. استقرارها در مقصد متفاوت بوده است، اما افسران ارتش Business Insider با آنها صحبت کرد گفت که این روند به طور"}, {"source": "Business Insider", "title": "Photos show the moment President George W. Bush first learned of the 9/11 attacks — and how the president's day unfolded", "link": "https://www.businessinsider.com/photos-show-bush-learn-9-11-attacks-white-house-response-2026-9", "summary": "President George W. Bush on September 11, 2001. US National Archives After the 9/11 terrorist attacks, heart-wrenching images surfaced and stirred the world. Photos from the National Archives show exactly when President George W. Bush learned of the attacks. See how Bush responded to what would be the defining moment of his presidency. On Tuesday, September 11, 2001, President George W. Bush was visiting an elementary school and reading to the children when the second plane hit the World Trade Center in New York City. The school turned into a makeshift command center, and the president addressed the nation from the school before boarding Air Force One to get to a secure location. These photos from the US National Archives show how the 43rd president's day unfolded on 9/11. President George W. Bush participated in a reading demonstration on the morning of Tuesday, September 11, 2001, at Emma E. Booker Elementary School in Sarasota, Florida. President George W. Bush participates in a reading demonstration the morning of Tuesday, Sept. 11, 2001, at Emma E. Booker Elementary School in Sarasota, Fla. US National Archives Dan Bartlett, deputy assistant to the president, pointed to news footage of the attacks while Bush listened to new security information. US National Archives Bush watched television coverage of the attacks on the World Trade Center during a briefing in the classroom. President George W. Bush watches television coverage of the attacks on the World Trade Center during a briefing in a classroom at Emma E. Booker Elementary School in Sarasota, Florida. US National Archives Bush took notes as he listened to news coverage of the World Trade Center terrorist attacks. President George W. Bush takes notes as he listens to news coverage of the World Trade Center terrorist attacks Tuesday, Sept. 11, 2001, during a visit to Emma E. Booker Elementary School in Sarasota, Fla. US National Archives Bush called New York Gov. George Pataki, FBI Director Robert Mueller, and Vice President Dick Cheney. White House Chief of Staff Andy Card spoke on a cellphone. President George W. Bush calls New York Governor George Pataki, FBI Director Robert Mueller and Vice President Dick Cheney Tuesday, Sept. 11, 2001, from Emma E. Booker Elementary School in Sarasota, Fla. White House Chief of Staff Andy Card talks on a cell phone. US National Archives Bush delivered one of his first remarks to the nation after the attacks from the Florida elementary school. President George W", "date_str": "2026-09-11T12:18:02+00:00", "hash": "14abe8090aec2a01", "title_fa": "عکس‌ها لحظه‌ای را نشان می‌دهند که رئیس‌جمهور جورج دبلیو بوش برای اولین بار از حملات 11 سپتامبر مطلع شد - و چگونه روز رئیس‌جمهور گذشت.", "summary_fa": "پرزیدنت جورج دبلیو بوش در 11 سپتامبر 2001. آرشیو ملی ایالات متحده پس از حملات تروریستی 11 سپتامبر، تصاویری دلخراش ظاهر شد و جهان را به هیجان آورد. عکس‌های آرشیو ملی نشان می‌دهد که رئیس‌جمهور جورج دبلیو بوش دقیقاً چه زمانی از این حملات باخبر شد. ببینید بوش چه واکنشی به لحظه تعیین کننده ریاست جمهوری او نشان داد. در روز سه شنبه 11 سپتامبر 2001، رئیس جمهور جورج دبلیو. بوش در حال بازدید از یک مدرسه ابتدایی بود و برای بچه ها کتاب می خواند که هواپیمای دوم به مرکز تجارت جهانی در شهر نیویورک برخورد کرد. مدرسه به یک مرکز فرماندهی موقت تبدیل شد و رئیس جمهور قبل از سوار شدن به ایر فورس وان از مدرسه برای مردم خطاب کرد تا به مکانی امن برسند. این عکس ها از آرشیو ملی ایالات متحده نشان می دهد که چگونه روز چهل و سومین رئیس جمهور در 11 سپتامبر گذشت. رئیس جمهور جورج دبلیو. بوش در صبح روز سه شنبه 11 سپتامبر 2001 در تظاهرات کتابخوانی در مدرسه ابتدایی اما ای بوکر در ساراسوتا، فلوریدا شرکت کرد. پرزیدنت جورج دبلیو بوش در تظاهرات کتابخوانی صبح روز سه شنبه 11 سپتامبر 2001 در مدرسه ابتدایی اما ای بوکر در ساراسوتا، فلوریدا شرکت کرد. آرشیو ملی ایالات متحده دان بارتلت، معاون دستیار رئیس جمهور، در حالی که بوش به اطلاعات امنیتی جدید گوش می داد، به تصاویر خبری از حملات اشاره کرد. آرشیو ملی ایالات متحده، بوش در جریان یک جلسه توجیهی در کلاس درس، پوشش تلویزیونی حملات به مرکز تجارت جهانی را تماشا کرد. پرزیدنت جورج دبلیو بوش پوشش تلویزیونی حملات به مرکز تجارت جهانی را در طی یک جلسه توجیهی در کلاسی در مدرسه ابتدایی اما ای بوکر در ساراسوتا، فلوریدا تماشا می کند. بایگانی ملی ایالات متحده، بوش هنگام گوش دادن به اخبار مربوط به حملات تروریستی مرکز"}, {"source": "Business Insider", "title": "Vintage photos show what airport security was like before 9/11", "link": "https://www.businessinsider.com/vintage-photos-show-airport-security-before-9-11-tsa-2026-9", "summary": "Airport security in the 1970s. Duane Howell/Denver Post via Getty Images Airport security used to be far more relaxed with fewer screenings and restrictions. People didn't need plane tickets to get through security, and knives were allowed on flights. The Transportation Security Administration wasn't established until after 9/11. Before 9/11, airport security was far more relaxed than it is today. Friends and family could accompany travelers through security without a boarding pass. Knives and blades were allowed in carry-on bags as long as they were smaller than 4 inches. Private companies, not the government-run Transportation Security Administration , handled screenings. Airport security did evolve over the decades in response to bombings — like the Pan Am bombing over Lockerbie, Scotland, in 1988 — as well as hijackings and other threats. X-ray machines and metal detectors slowly became familiar features, but the experience was vastly different compared to modern air travel. In the aftermath of September 11 , airport security transformed almost overnight. These vintage photos show how travelers once navigated a system that now seems unrecognizable. Before 9/11, checked luggage was not subject to universal explosives screening. The conveyor belt took baggage to the bus docks at New York s East Side Airlines Terminal. Orlando /Three Lions/Getty Images X-ray baggage screenings weren t introduced until the 1950s. Early airport security X-ray. One of the first X- rays ever taken of the interior of a suitcase, using X-ray surveillance at an airport. Two hand guns have been exposed, with a grenade tucked into the shoe at lower left. This late 1950s image was taken at an airport in the United Kingdom. X-ray fluoroscopy was the process, used by a security device manufactured by Pantak. X-ray checks have since become more sophisticated, but are still only as efficient as the guards analysing these X- rays. In this case the grenade could easily be mistaken for a sock in the shoe, and a gun seen from end on is much harder to recognise.No use: BBC, Pearson, Oxford University Press, Springer Nature, Dorling Kindersley, Cambridge University Press Assessment, New Scientist, Bonnier Publications, John Wiley Sons, The Lancet, BMJ Science Photo Library via Reuters Connect Signs warned passengers from bringing weapons and explosives, but screenings were lax by today s standards. Airport officials view are introduced to new signage warning passengers of penalties for makin", "date_str": "2026-09-11T11:51:01+00:00", "hash": "2effd9aecbd95462", "title_fa": "عکس های قدیمی نشان می دهد که امنیت فرودگاه قبل از 11 سپتامبر چگونه بوده است", "summary_fa": "امنیت فرودگاه در دهه 1970. Duane Howell/Denver Post از طریق Getty Images امنیت فرودگاه با نمایش‌ها و محدودیت‌های کمتر بسیار آرام‌تر بود. مردم برای عبور از امنیت نیازی به بلیط هواپیما نداشتند و چاقو در پروازها مجاز بود. اداره امنیت حمل و نقل تا پس از 11 سپتامبر ایجاد نشد. قبل از 11 سپتامبر، امنیت فرودگاه بسیار راحت تر از امروز بود. دوستان و خانواده می توانند مسافران را از طریق امنیت بدون کارت پرواز همراهی کنند. چاقوها و تیغه ها تا زمانی که کوچکتر از 4 اینچ باشند در کیف های دستی مجاز بودند. شرکت های خصوصی، نه اداره امنیت حمل و نقل دولتی، غربالگری را انجام دادند. امنیت فرودگاه طی دهه‌ها در پاسخ به بمب‌گذاری‌ها - مانند بمب‌گذاری Pan Am بر فراز لاکربی، اسکاتلند، در سال 1988 - و همچنین هواپیماربایی و سایر تهدیدها تکامل یافت. ماشین‌های اشعه ایکس و فلزیاب‌ها به تدریج به ویژگی‌های آشنا تبدیل شدند، اما تجربه در مقایسه با سفرهای هوایی مدرن بسیار متفاوت بود. پس از 11 سپتامبر، امنیت فرودگاه تقریباً یک شبه تغییر کرد. این عکس‌های قدیمی نشان می‌دهند که چگونه مسافران زمانی در سیستمی حرکت می‌کردند که اکنون غیرقابل تشخیص به نظر می‌رسد. قبل از 11 سپتامبر، چمدان‌های چک شده تحت بازرسی جهانی مواد منفجره نبودند. تسمه نقاله بارها را به اسکله اتوبوس در ترمینال خطوط هوایی ایست ساید نیویورک برد. اورلاندو / سه شیر / گتی ایماژ غربالگری چمدان با اشعه ایکس تا دهه 1950 معرفی نشد. اشعه ایکس امنیتی اولیه فرودگاه. یکی از اولین پرتوهای ایکس که تا کنون از داخل یک چمدان گرفته شده است، با استفاده از نظارت اشعه ایکس در فرودگاه. دو اسلحه دستی با یک نارنجک در کفش در پایین سمت چپ قرار گرفته است. این تصویر اواخر دهه 1950 در فرودگاهی در بریتانیا گرفته شده است. فلوروسکوپی اشعه ایکس فرآیندی بود که توسط یک"}, {"source": "Business Insider", "title": "2 Stanford professors explained why telling people to 'follow your passion' is a bad idea", "link": "https://www.businessinsider.com/stanford-experts-challenge-follow-your-passion-advice-2026-9", "summary": "Burnett and Evans say the pressure to find one all-consuming passion can make career uncertainty worse. Eric Thayer/Los Angeles Times via Getty Images Stanford professors Bill Burnett and Dave Evans argue that \"follow your passion\" is bad advice. Most people don't have a single passion so the advice is often confusing, they say. On the \"Prof G Podcast,\" Burnett also questioned the idea of your college degree setting your life's direction. \"Follow your passion\" has become one of the most repeated pieces of career advice. But Bill Burnett and Dave Evans, Stanford professors and the authors of 'Designing Your Life,' think it can send people in the wrong direction. \"It's probably the worst advice you can give somebody,\" Burnett said during a live recording of the \" Prof G Podcast\" with Scott Galloway released on Thursday. The issue, he said, is that many people don't have a single, obvious passion to follow. Citing research by fellow Stanford scholar Bill Damon, Burnett said: \"Less than 20% of people have a singular identifiable passion.\" For everyone else, the message can be alienating. \"Eight out of 10 people go, 'I don't know what you're talking about,'\" Burnett said. Others may have \"lots of things\" that interest them and no clear way to choose between them. That can turn a supposedly inspiring instruction into a source of self-doubt. Burnett said that advising people to follow their passion can leave most people feeling: \"'I don't know what's wrong with me.'\" Later in the conversation, Burnett offered a different way to approach uncertainty: start with curiosity and run small experiments. \"Even if you're really at the lowest of low, there's something you're curious about,\" he said. The pair call this approach \"prototyping.\" Rather than making a high-stakes, permanent career decision, people can test an interest by speaking with someone in the field, trying a project, or getting firsthand exposure to the work. This is especially relevant for workers who feel trapped by an existing degree or career path. Burnett called the idea that people must choose the \"right\" major a \"dysfunctional belief,\" arguing that a college major is \"the way you organize college,\" not \"the way you organize your life.\" Evans also pushed back on the idea that work must supply both income and meaning, saying that \"meaning-making and money-making don't have to be the same.\" The goal, he said, is not to discover a fixed answer to the question of purpose. \"There is no figuring it out,\" ", "date_str": "2026-09-11T11:30:56+00:00", "hash": "3de9bb3ddc9c0283", "title_fa": "2 استاد دانشگاه استنفورد توضیح دادند که چرا گفتن به مردم که \"علاقه خود را دنبال کنید\" ایده بدی است", "summary_fa": "برنت و ایوانز می گویند فشار برای یافتن یک علاقه همه جانبه می تواند عدم اطمینان شغلی را بدتر کند. اریک تایر/ لس آنجلس تایمز از طریق گتی ایماژ، بیل برنت و دیو ایوانز، استادان دانشگاه استنفورد، استدلال می‌کنند که \"علاقه خود را دنبال کنید\" توصیه بدی است. آنها می گویند که اکثر مردم یک علاقه واحد ندارند، بنابراین توصیه ها اغلب گیج کننده است. در «پادکست پروفسور جی»، برنت همچنین این ایده که مدرک دانشگاهی شما مسیر زندگی شما را تعیین می کند، زیر سوال برد. \"علاقه خود را دنبال کنید\" به یکی از تکراری ترین توصیه های شغلی تبدیل شده است. اما بیل برنت و دیو ایوانز، اساتید دانشگاه استنفورد و نویسندگان «طراحی زندگی شما»، فکر می‌کنند که می‌تواند مردم را به مسیر اشتباهی سوق دهد. برنت در جریان ضبط زنده «پادکست پروفسور جی» به همراه اسکات گالووی که روز پنجشنبه منتشر شد، گفت: «احتمالاً این بدترین توصیه‌ای است که می‌توانید به کسی بدهید. او گفت، مسئله این است که بسیاری از مردم یک اشتیاق مشخص و مشخصی برای دنبال کردن ندارند. برنت با استناد به تحقیقات محقق دانشگاه استنفورد، بیل دیمون، گفت: «کمتر از 20 درصد از مردم شور و اشتیاق قابل شناسایی دارند.» برای هر کس دیگری، پیام می تواند بیگانه باشد. برنت گفت: «از هر 10 نفر هشت نفر می‌گویند: «نمی‌دانم در مورد چه چیزی صحبت می‌کنی». دیگران ممکن است «چیزهای زیادی» داشته باشند که به آنها علاقه دارد و هیچ راه روشنی برای انتخاب بین آنها وجود نداشته باشد. این می تواند یک دستورالعمل ظاهراً الهام بخش را به منبع شک و تردید در خود تبدیل کند. برنت گفت که توصیه به افراد برای پیروی از اشتیاقشان می‌تواند باعث شود بیشتر مردم احساس کنند: «من نمی‌دانم چه مشکلی دارم.» بعداً در مکالمه، برنت روش متفاوتی را برای نزدیک شدن به عدم قطعیت ارائه کرد:"}, {"source": "Business Insider", "title": "AI might take us all down, just not the way you think", "link": "https://www.businessinsider.com/ai-apocalypse-can-artificial-intelligence-really-destroy-humanity-2026-9", "summary": "Neither company is acting responsibly, Coxon wrote on X. Imen Ben Youssef / Hans Lucas / AFP via Getty Images This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . Please read this newsletter before the end of the world. I don't mean to be dramatic — ok, maybe a little — but there's a lot of AI apocalypse talk these days. An Anthropic researcher's resignation and warning earlier this week that AI giants are \" gambling with our lives \" sparked a wider conversation. Mainly: Is AI actually going to kill us all? The debate quickly broke into the mainstream, with billionaire hedge fund investor Paul Tudor Jones calling AI a \"Category 6 hurricane.\" Even my 71-year-old mom texted me about whether this was \"truth or hysteria.\" Let's start with the basics: Can AI really wipe us out? And if so, how would it do it? BI's Thibault Spirlet posed those questions to senior AI researchers . They outlined short-term risks, like AI fueling human attacks, and wider concerns as we cede more control to AI. Hollywood has also spent decades imagining how it would all go down . As for the odds of all this happening, that's a mixed bag. One notable mention is Geoffrey Hinton, known as the \"Godfather of AI,\" who said there's a 10% chance AI wipes out humanity in a decade . Daniel Kokotajlo, a former OpenAI researcher, also spoke to BI about why \" AI is not loyal to us .\" But why not go straight to the source? We decided to ask AI how it would go about destroying humanity . It turns we'll ultimately be the ones to blame. Not everyone is taking such a somber view. The internet is poking fun at some of the alarmist language . AI companies have made a habit of talking out of both sides of their mouths . Warnings about the tech's \"threats\" also help them market the power of their products and the important role they play. That doesn't mean there isn't cause for concern. Many in the AI community have acknowledged they can't slow down even if they wanted to. Losing ground to rivals, or China, isn't an option with so much money at stake. That still doesn't mean we're on the cusp of something terrible. Fear sells. And dramatic, high-stakes storylines pitched to investors reinforce the idea that these companies are on the frontlines of a revolution, and worth the high price tag. Because if people stop buying the AI hype, that could pose a real problem for a stock market basically built on it. Fitch Ratings alread", "date_str": "2026-09-11T11:20:52+00:00", "hash": "dc777912c3206f9c", "title_fa": "هوش مصنوعی ممکن است همه ما را از بین ببرد، نه آن طور که شما فکر می کنید", "summary_fa": "Coxon در X. Imen Ben Youssef / Hans Lucas / AFP از طریق Getty Images نوشت، هیچ یک از این شرکت‌ها مسئولانه عمل نمی‌کنند. این پست در اصل در خبرنامه Business Insider Today منتشر شده است. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. لطفا قبل از پایان جهان این خبرنامه را بخوانید. من قصد ندارم دراماتیک باشم - خوب، شاید کمی - اما این روزها صحبت های زیادی درباره آخرالزمان هوش مصنوعی وجود دارد. استعفای یک محقق Anthropic و هشدار اوایل این هفته مبنی بر اینکه غول های هوش مصنوعی \"با زندگی ما قمار می کنند\" بحث گسترده تری را برانگیخت. به طور عمده: آیا هوش مصنوعی واقعاً همه ما را می کشد؟ این بحث به سرعت در جریان اصلی قرار گرفت و سرمایه گذار میلیاردر صندوق سرمایه گذاری، پل تودور جونز، هوش مصنوعی را \"طوفان رده 6\" نامید. حتی مادر 71 ساله ام به من پیام داد که آیا این \"حقیقت است یا هیستری\". بیایید با اصول اولیه شروع کنیم: آیا هوش مصنوعی واقعا می تواند ما را از بین ببرد؟ و اگر چنین است، چگونه این کار را انجام می دهد؟ Thibault Spirlet از BI این سوالات را برای محققان ارشد هوش مصنوعی مطرح کرد. آن‌ها خطرات کوتاه‌مدتی، مانند تقویت هوش مصنوعی حملات انسانی، و نگرانی‌های گسترده‌تر را با واگذاری کنترل بیشتر به هوش مصنوعی، تشریح کردند. هالیوود همچنین دهه ها را صرف تصور اینکه چگونه همه چیز سقوط خواهد کرد. در مورد احتمال وقوع همه این اتفاقات، این یک چیز مختلط است. یکی از موارد قابل توجه جفری هینتون، معروف به \"پدرخوانده هوش مصنوعی\" است که گفت به احتمال 10 درصد هوش مصنوعی بشریت را در یک دهه از بین می برد. دانیل کوکوتاجلو، محقق سابق OpenAI نیز با BI در مورد اینکه چرا هوش مصنوعی به ما وفادار نیست صحبت کرد."}, {"source": "Business Insider", "title": "SpaceX has struck a $1 billion a month compute deal with a mystery customer", "link": "https://www.businessinsider.com/spacex-strikes-billion-a-month-compute-deal-with-mystery-customer-2026-9", "summary": "SpaceX is targeting $100 billion in annual recurring revenue by the end of the year. Spencer Platt/Getty Images SpaceX has closed yet another AI compute deal with a mystery customer. The agreement is worth over $1 billion a month, SpaceX's CFO said on Thursday. It follows similar deals with Anthropic and Google as Elon Musk's rocket company cashes in on its Colossus data centers. SpaceX is cashing in on the surging demand for AI compute. CFO Bret Johnsen told a Goldman Sachs conference on Thursday that SpaceX had clinched another major data center deal worth over $1 billion a month. \"Just earlier this month, we closed another hosting deal, and that translates into about $1.11 billion a month starting December 1st of this year,\" Johnsen said. Johnsen did not say who the customer was, but added that the deal gave him \"even more conviction\" that SpaceX would hit its target of $100 billion in annual recurring revenue by the end of the year. The latest deal adds to agreements SpaceX has struck with Google and Anthropic to rent out capacity in its massive Colossus data centers in Mississippi and Tennessee. Anthropic agreed to pay SpaceX $1.25 billion a month through to May 2029 as it battled to meet growing demand for its Claude AI model, while the deal Google, which is a major SpaceX shareholder, agreed in June is worth $920 million a month . Securing compute to run and train the most powerful AI models has become a huge bottleneck for AI companies, with the likes of OpenAI and Meta embarking on multibillion-dollar data center building sprees that have sparked significant public backlash. The race to gain access to cutting-edge GPUs and data centers has turned into a major revenue opportunity for SpaceX, which acquired a significant amount of unused data center capacity when it merged with Musk's AI startup xAI in February. Johnsen told investors in the company's Q2 earnings last month that SpaceX had already signed $6.7 billion in cloud services revenue in the first few weeks of the third quarter. The influx of revenue comes as ای اجرا و آموزش قدرتمندترین مدل‌های هوش مصنوعی به گلوگاه بزرگی برای شرکت‌های هوش مصنوعی تبدیل شده است، زیرا شرکت‌هایی مانند OpenAI و Meta دست به ولگردی‌های چند میلیارد دلاری در"}, {"source": "Business Insider", "title": "Trump snapped at a reporter after a question about his $5,000 promise to voters: 'You're the worst'", "link": "https://www.businessinsider.com/trump-snaps-reporter-questioned-5000-checks-voters-2026-9", "summary": "President Donald Trump speaks to reporters on the tarmac before boarding Air Force One after attending the Republican Midterm Convention. Andrew Harnik/Getty Images A reporter asked Trump why he needed to give voters $5,000 if his economic policies were working. It didn't go well. He blamed Biden, and leaned forward and glared at her when she tried a follow-up question. A reporter asked President Donald Trump why he needed to incentivize voters with a $5,000 check if his economic policies were working, and it seemed to strike a nerve. On Wednesday, Trump told the Republican Party's midterm convention that every US citizen would receive a $5,000 \"Trump dividend\" if Republicans retain control of both chambers of Congress in November's midterms. The proposal could cost upward of $1.3 trillion if every US citizen received the payment, though Vice President JD Vance later said wealthy people would be excluded. Joe Lonsdale, the cofounder of Palantir , was among the critics of the pledge and said the payment would be akin to a \"bribe.\" When a reporter questioned Trump about the proposal on the airport tarmac in Dallas on Thursday night, the president appeared to snap. After noting that the US has $40 trillion in debt, the reporter asked: \"If your economic policies are working, why do you need an incentive for people to turn out and vote?\" Trump responded: \"I didn't do it for turning out the vote. I'm doing it as a reward for people having to put up with five years, and four years, of a horrible, horrible situation caused by Biden.\" He r
