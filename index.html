      media: [{"source": "Billboard", "title": "Elvis AI Voice Lawsuit, Olivia Rodrigo’s ‘Take Me Home,’ BTS Song Case & More Top Music Law News", "link": "https://www.billboard.com/pro/elvis-lawsuit-olivia-rodrigo-take-me-home-bts-music-law/", "summary": "THE BIG STORY: Two weeks after the owners of Elvis Presley ’s intellectual property sued Anthropic, they’re back with a new case against Suno — and this one is way more interesting. In a lawsuit filed last week, Elvis Presley Enterprises accused Suno, the leading AI music firm, of stealing Presley’s likeness by allowing users to clone his unmistakable and iconic singing voice: All of the humanity, history, despair, and triumph that constitutes Elvis’ identity was stolen and is stored on servers and harnessed by Suno to make massive amounts of money, the lawsuit reads. Related Elvis Presley Rights Owners Sue Suno Over AI Voice Cloning: Elvis’ Identity Was Stolen Michael Sanft, Attorney Who Represented Keffe D in 2Pac Murder Trial, Dies at 54 Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 That’s markedly different from the earlier Presley case against Anthropic and the many others filed against Suno by music firms, which all center on the use of copyrighted materials to train AI models. The new case invokes likeness rights — state-level protections designed to protect someone’s name, image and voice from commercial exploitation. For more — about the new lawsuit, the ELVIS Act it’s citing and Suno’s potential counter-arguments — go read the full Billboard story here or watch me break it all down here . You’re reading Legal Beat , a weekly newsletter about music law from Billboard Pro , offering you a one-stop cheat sheet of big new cases, important rulings and all the fun stuff in between. To get the newsletter in your inbox every Tuesday, subscribe here or follow me on Instagram and X for daily legal updates on the music business. Other top stories this week… — A lawsuit against HYBE claiming the chart-topping BTS smash Swim ripped off an earlier song was dropped by the accusers less than four months after it was filed. — Aerosmith singer Steven Tyler got a new trial date in the long-running case claiming he groomed an underage girl in the 70s and then admitted in a memoir that he almost took a teen bride. — Robbie Williams defended Olivia Rodrigo after some fans claimed her holiday song Take Me Home (4 Christmas) sounds like his track Candy. If only Stella Lefty had that kind of support … — Dolly Parton ’s estate dropped its case against Bryan Seaver, the late star’s nephew and head of security, whom it had accused of trying to extort money with threats of violence. — Dua Lipa reached a settlement to end a copyright case", "date_str": "2026-11-10T18:55:18+00:00", "hash": "c26e9a6a92bf9d86", "title_fa": "دعوی صدای الویس AI، «Take Me Home» از اولیویا رودریگو، پرونده آهنگ BTS و اخبار برتر قانون موسیقی", "summary_fa": "داستان بزرگ: دو هفته پس از شکایت صاحبان مالکیت معنوی الویس پریسلی از Anthropic، آنها با یک پرونده جدید علیه Suno بازگشته اند - و این مورد بسیار جالب تر است. الویس پریسلی انترپرایز در شکایتی که هفته گذشته ارائه شد، Suno، شرکت پیشرو موسیقی هوش مصنوعی را متهم کرد که شباهت پریسلی را با اجازه دادن به کاربران برای شبیه‌سازی صدای آواز بی‌نظیر و نمادین او دزدیده است: تمام انسانیت، تاریخ، ناامیدی و پیروزی که الویس را تشکیل می‌دهد، به سرقت رفته است و به‌طور انبوهی در سرور ذخیره می‌شود. دادخواست خوانده شده است. این به طور قابل توجهی با پرونده قبلی پریسلی علیه Anthropic و بسیاری دیگر که شرکت های موسیقی علیه Suno تشکیل داده بودند، متفاوت است، که همگی بر استفاده از مواد دارای حق چاپ برای آموزش مدل های هوش مصنوعی متمرکز هستند. مورد جدید از حقوق تشبیه استفاده می کند - حفاظت در سطح ایالت که برای محافظت از نام، تصویر و صدای شخصی در برابر بهره برداری تجاری طراحی شده است. برای اطلاعات بیشتر - در مورد شکایت جدید، قانون ELVIS که به آن استناد می‌کند و استدلال‌های متقابل احتمالی Suno - به خواندن داستان کامل بیلبورد در اینجا بروید یا تماشا کنید که همه چیز را اینجا توضیح می‌دهم. - شکایتی علیه HYBE که ادعا می‌کرد آهنگ Swim Smash Swim که در صدر جدول قرار گرفته بود، یک آهنگ قبلی را پاره کرده بود، کمتر از چهار ماه پس از تشکیل آن توسط شاکیان رد شد. - استیون تایلر، خواننده Aerosmith، تاریخ محاکمه جدیدی در این پرونده طولانی مدت دریافت کرد که ادعا می کرد در دهه 70 یک دختر زیر سن قانونی را اصلاح کرده و سپس در خاطرات خود اعتراف کرد که تقریباً یک عروس نوجوان می گرفت. - رابی ویلیامز پس از اینکه برخی از طرفداران ادعا کردند آهنگ تعطیلات", "image_url": "https://www.billboard.com/wp-content/uploads/2024/11/Elvis-Presley-Performing-1956-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "موسیقی"], "datetime_fa": "۱۹ آبان • ۲۲:۲۵"}, {"source": "Billboard", "title": "Latin Grammy Awards 2026: How to Watch, Plus All the Performers & Presenters", "link": "https://www.billboard.com/music/awards/latin-grammys-2026-how-to-watch-performers-presenters-1236378824/", "summary": "The Latin Recording Academy has unveiled a new batch of stars confirmed for the 2026 Latin Grammy Awards set for Thursday (Nov. 12) in Las Vegas. Related Latin Grammy Awards 2026 Predictions: Who Will Win the Top Honors? Edgar Barrera Leads 2026 Latin Grammy Nominations: Full List Meet the 2026 Latin Grammy Best New Artist Nominees: Aria Vega, Macario Martínez, Delilah More Camila Cabello , Howie D from The Backstreet Boys, Greeicy, Pablo Alborán, Ryan Castro and Mexican soccer star Memo Ochoa are all confirmed as presenters. They join previously announced performers including Anitta, Carín León, Cristian Castro, Feid, Grupo Frontera, Karol G, Milo J, Rawayana and Xavi. The televised ceremony will pay homage to the salsa pioneer Willie Colón, with a tribute helmed by Colón s musical director and bandleader, Ennio Gatti, together with Colón s original 13-member band. It will also celebrate the legacy of José Alfredo Jiménez with a tribute in honor of the 100th anniversary of his birth, produced by Edgar Barrera, who leads this year’s nominees with 10 nods, including record of the year, album of the year and song of the year, mostly for his work on projects by Karol G and Carín León. Additionally, The Latin Recording Academy s 2026 Person of the Year is Daddy Yankee , who is also confirmed as a performer. Below, see the full list of performers and presenters, and how to watch. Performers Ángel “Cucco” Peña Anitta Baby Ranks Bad Gyal Banda Los Recoditos Bizarrap Camila Fernández Carín León Cristian Castro Daddy Yankee Divino DJ Premier Diljit Dosanjh Elena Rose Feid French Montana Fonseca Grupo Frontera Grupo Niche Jay Wheeler Jorge Drexler Juanes Kany García Karol G Lil Supa Luis Enrique Luis Figueroa Miguel Colón Milo J Mon Laferte Nathy Peluso Niña Pastori Rawayana Reik Rosalía Silvana Estrada Sofía Reyes The Warning Xavi Yami Safdie Presenters Anthony Ramos Camila Cabello Daniela Mercury Debi Nova Greeicy Howie D Joaquina Lila Downs Luísa Sonza Memo Ochoa Pablo Alborán Ryan Castro Sara Schell Trueno William Contreras How to Watch The 2026 gala will air live on Thursday, Nov. 12, from the MGM Grand Garden Arena in Las Vegas via Univision, UNIMÁS, Galavisión and streaming on ViX beginning at 8 p.m. ET. The telecast will be preceded by the Latin Grammy Premiere — where the majority of the categories are awarded — via a live stream starting at 3 p.m. ET on The Latin Recording Academy digital platforms and social channels (including YouTube, Facebook and X).", "date_str": "2026-11-10T18:48:21+00:00", "hash": "b93e92cef44991f7", "title_fa": "جوایز گرمی لاتین 2026: چگونه تماشا کنیم، به علاوه همه مجریان و مجریان", "summary_fa": "آکادمی ضبط لاتین از دسته جدیدی از ستاره های تایید شده برای جوایز گرمی لاتین 2026 که قرار است پنجشنبه (12 نوامبر) در لاس وگاس برگزار شود، پرده برداری کرده است. پیش‌بینی‌های مرتبط جوایز گرمی لاتین ۲۰۲۶: چه کسی برترین افتخارات را خواهد برد؟ ادگار باررا پیشتاز نامزدهای گرمی لاتین 2026: لیست کامل با گرمی لاتین 2026 آشنا شوید نامزدهای بهترین هنرمند جدید: آریا وگا، ماکاریو مارتینز، دلیلا مور کامیلا کابلو، هاوی دی از The Backstreet Boys، Greeicy، Pablo Alborán و Meximocho Castro همگی تایید می‌کنند. مجریان آنها به اجراکنندگان اعلام شده قبلی از جمله آنیتا، کارین لئون، کریستین کاسترو، فید، گروپو فرانترا، کارول جی، میلو جی، راویانا و ژاوی می پیوندند. مراسم پخش تلویزیونی با ادای احترام به ویلی کولون، پیشگام سالسا، با ادای احترامی که توسط مدیر موسیقی و رهبر گروه کولون، انیو گاتی، همراه با گروه 13 نفره اصلی کولون برگزار می‌شود. همچنین میراث خوزه آلفردو خیمنز را با ادای احترام به صدمین سالگرد تولد او، به تهیه کنندگی ادگار باررا، که با 10 نوبت، از جمله رکورد سال، آلبوم سال و آهنگ سال، بیشتر برای کارهایش بر روی پروژه های کارول جی و کارین، رهبری نامزدهای امسال را بر عهده دارد، تجلیل خواهد شد. علاوه بر این، شخصیت سال 2026 آکادمی ضبط لاتین، بابا یانکی است که او نیز به عنوان یک مجری تایید شده است. در زیر لیست کامل مجریان و مجریان و نحوه تماشا را مشاهده کنید.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/camila-cabello-cr-mikayla-lobasso-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۲:۱۸"}, {"source": "Billboard", "title": "D.C. Defends Ticket Resale Cap Amid Lawsuit from SeatGeek, Vivid Seats, TickPick & Gametime", "link": "https://www.billboard.com/pro/dc-defends-ticket-resale-cap-lawsuit-seatgeek/", "summary": "The District of Columbia says it should be allowed to cap concert ticket resale prices in the face of a legal challenge brought by a coalition of secondary marketplace operators. Resale trade group Ticket Policy Forum, along with its members SeatGeek, Vivid Seats, TickPick and Gametime, sued last month to block D.C.’s newly enacted Restricting Egregious Scalping Against Live Entertainment (RESALE) Act as unconstitutional. Scheduled to become enforceable in 2027, the RESALE Act limits secondary ticket price markups at 10% above face value. Related D.C. Cracks Down on Ticket Resellers: Council Passes Bill to Protect Fans From Scammers, Inflated Prices Michael Sanft, Attorney Who Represented Keffe D in 2Pac Murder Trial, Dies at 54 Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 The resellers argue that a 10% cap would force them to operate at a loss and actually raise consumer prices by driving ticket sales to the black market. They want a judge to issue an immediate injunction barring enforcement of the law. But in a response brief on Monday (Nov. 9), the D.C. Attorney General’s Office says that is both unnecessary and unfair. The will of the people plus their interests in protecting consumers and a vital, cultural industry far outweigh the pecuniary interests of a handful of corporations, write the government lawyers. Plaintiffs include multi-billion-dollar companies that can easily absorb any hypothesized losses from complying with one city’s law while litigation proceeds. Plaintiffs may later be able to recover those losses, but the harms to the district and its people from a preliminary injunction are truly irreparable. D.C.’s attorneys say their resale cap was properly enacted after residents became fed up with soaring ticket prices, and that the bill sailed through both local government and congressional approval even as ticket resellers lobbied hard to kill it. Striking out with the democratic process, Plaintiffs dressed their policy objections up in constitutional garb and turned to this court for a judicial veto, reads Monday’s response brief. According to D.C., there’s simply no merit to the ticketing companies’ claims that the RESALE Act is unconstitutional. Among other arguments, the resellers have said there’s a First Amendment issue with a portion of the law that requires them to list a ticket’s original, face value cost next to the resale rate. The companies claim this is unlawful compelled speech — but D.C", "date_str": "2026-11-10T18:40:40+00:00", "hash": "00c706939793d1f5", "title_fa": "D.C از سقف فروش مجدد بلیط در میان شکایت از SeatGeek، Vivid Seats، TickPick و Gametime دفاع می کند.", "summary_fa": "ناحیه کلمبیا می‌گوید که باید به آن اجازه داده شود تا قیمت‌های فروش مجدد بلیت کنسرت را در مواجهه با چالش قانونی که توسط ائتلافی از اپراتورهای بازار ثانویه ایجاد می‌شود، محدود کند. گروه تجاری فروش مجدد Ticket Policy Forum، همراه با اعضایش SeatGeek، Vivid Seats، TickPick و Gametime، ماه گذشته شکایت کردند تا قانون جدید محدودکننده اسکالپینگ شدید علیه سرگرمی های زنده (RESALE) را که به تازگی تصویب شده است، غیرقانونی بداند. قانون RESALE که قرار است در سال 2027 قابل اجرا شود، نشانه‌گذاری قیمت بلیت ثانویه را 10 درصد بالاتر از ارزش اسمی محدود می‌کند. مرتبط D.C. سرکوب فروشندگان بلیط: شورا لایحه ای را برای محافظت از طرفداران در برابر کلاهبرداران تصویب می کند، قیمت های گران شده مایکل سانفت، وکیل مدافع Keffe D در دادگاه قتل 2Pac، در سن 54 سالگی جان خود را از دست می دهد، کنی مک فرسون، ناشر کهنه کار موسیقی و Big Deal، بنیانگذار موسیقی، 70% آنها را مجبور می کند. با زیان کار کند و در واقع با هدایت فروش بلیت به بازار سیاه، قیمت مصرف کننده را افزایش دهد. آنها از یک قاضی می خواهند که دستور منع اجرای قانون را فوری صادر کند. اما دفتر دادستان کل دی سی در پاسخی کوتاه در روز دوشنبه (9 نوامبر) می گوید که این هم غیرضروری و هم ناعادلانه است. وکلای دولتی می نویسند که اراده مردم و منافع آنها در حمایت از مصرف کنندگان و یک صنعت حیاتی و فرهنگی بسیار بیشتر از منافع مالی تعداد انگشت شماری از شرکت هاست. شاکیان شامل شرکت‌های چند میلیارد دلاری هستند که می‌توانند به راحتی هر گونه ضرر احتمالی ناشی از پیروی از قانون یک شهر را در حین رسیدگی به دعوا جذب کنند. شاکیان ممکن است بعداً بتوانند این خسارات را جبران کنند، اما صدمات وارده به منطقه و مردم آن از یک", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2297594629-e1794334315571.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۲:۱۰"}, {"source": "Billboard", "title": "How to Shop Affordable Tickets to ‘Christmas Spectacular’ Starring the Radio City Rockettes Online", "link": "https://www.billboard.com/culture/product-recommendations/rockettes-christmas-spectacular-tickets-buy-online-1236105496/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Kicking off their 101st anniversary, the Rockettes are set to headline their annual Christmas Spectacular showcase this holiday season. Performances go until Monday (Jan. 4) at Radio City Music Hall in New York City. Shop 'Christmas Spectacular' Tickets at Ticketmaster Tickets first went on sale through Live Nation and Ticketmaster , while the retailer&#x2019;s Face Value Exchange program is an option for fans to resell tickets. However, many of the dates have either sold out or are very close to selling out, so one of the best ways to find Christmas Spectacular tickets online is through third-party sites, such as StubHub , Vivid Seats , SeatGeek , TicketNetwork , Gametime , Event Tickets Center and others. All online retailers guarantee authentic tickets in time for your performance. Prices may be above or below face value at times. Where to Find &#x2018;Christmas Spectacular&#x2019; Starring the Radio City Rockettes Tickets Online EDITOR'S PICK Find 'Christmas Spectacular' Tickets at StubHub find tickets at StubHub Top choice for performance tickets. StubHub has all-in pricing, so all fees are listed upfront. The site&#x2019;s &#x201C;FanProtect Guarantee&#x201D; ensures that tickets are valid and delivered in time for the performance. If not, you&#x2019;ll get your money back. In addition, if the performance is canceled and not rescheduled, you&#x2019;ll receive 120% credit or be offered a full refund without the extra credit. At the time of publishing, Christmas Spectacular tickets start at $93. EARN REWARDS Find 'Christmas Spectacular' Tickets at Vivid Seats FIND TICKETS at Vivid Seats Vivid Seats lets you search by type of seat, such as suite, standing room, front of section or the VIP section, while the retailer prioritizes &#x201C;Super Sellers&#x201D; who are &#x201C;experienced, highly rated sellers.&#x201D; With Vivid Seats, your purchase is protected with the company&#x2019;s &#x201C;100% Buyer Guarantee,&#x201D; which ensures that you receive legitimate tickets in time for your performance or your money back. Meanwhile, you can save an additional 10% off your first purchase when you sign up for the company&#x2019;s email list. As a bonus, you can use our exclusive promo code&#xA0; BB30 &#xA0;to take $30 off your", "date_str": "2026-11-10T18:33:22+00:00", "hash": "145c11d22fd62a17", "title_fa": "چگونه می توان بلیط های مقرون به صرفه برای \"کریسمس Spectacular\" با بازی Rockettes Radio City را آنلاین خرید", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. با شروع صد و یکمین سالگرد خود، Rockettes قرار است در این فصل تعطیلات، ویترین سالانه کریسمس Spectacular خود را عنوان کند. اجراها تا دوشنبه (4 ژانویه) در رادیو سیتی موزیک هال در شهر نیویورک ادامه دارد. بیلبورد را کاوش کنید آخرین ویدیوها، نمودارها و اخبار را ببینید بلیت‌ها ابتدا از طریق Live Nation و Ticketmaster به فروش رفتند، در حالی که برنامه تبادل ارزش اسمی خرده‌فروش گزینه‌ای برای طرفداران برای فروش مجدد بلیط است. آریانا گرانده دوپ رابرت دنیرو بن استیلر با بدترین دروغ درباره دوران کودکی اش آریانا گرانده با رابرت دنیرو بن استیلر در برنامه امشب آواز می خواند، درخت کریسمس را می خواند: پیش نمایش اختصاصی بهترین طرح های SNL دروسکی در حال آواز خواندن از طریق یک پیشنهاد بود. بنابراین یکی از بهترین راه‌ها برای یافتن آنلاین بلیط‌های کریسمس Spectacular از طریق سایت‌های شخص ثالث مانند StubHub، Vivid Seat، SeatGeek، TicketNetwork، Gametime، مرکز بلیط‌های رویداد و سایر موارد است. همه خرده فروشان آنلاین بلیط های معتبر را به موقع برای عملکرد شما تضمین می کنند. قیمت ها ممکن است در مواقعی بالاتر یا کمتر از ارزش اسمی باشند. StubHub دارای قیمت گذاری همه جانبه است، بنابراین همه هزینه ها از قبل فهرست می شوند. \"ضمانت FanProtect\" سایت تضمین می کند که بلیط ها معتبر هستند و به موقع برای اجرا تحویل داده می شوند. اگر نه، پول خود را پس خواهید گرفت. علاوه بر این، اگر عملکرد لغو شود و دوباره برنامه ریزی نشود، 120٪ اعتبار دریافت خواهید کرد یا به شما بازپرداخت کامل بدون اعتبار اضافی ارائه می", "image_url": "https://www.billboard.com/wp-content/uploads/2025/11/Radio-City-Rockettes-Billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۲:۰۳"}, {"source": "Billboard", "title": "ROSALÍA, Shakira, Destin Conrad & Davido: Our Predictions for the Global, Reggae & African Music Races at the 2027 Grammys", "link": "https://www.billboard.com/music/awards/2027-grammys-nominations-predictions-global-reggae-african-1236378103/", "summary": "With the addition of best Latin song, there are now 11 categories in the Latin, Global, Reggae New Age, Ambient or Chant Field at the Grammys. Below, we assess the state of the race in four of those categories — best global music album, best global music performance, best African music performance and best reggae album. Related Shaggy Celebrates Four Decades of Wins With New ‘Lottery’ LP: ‘I’ve Always Bet on Myself’ Davido Opens Up About 15 Years in Music, ‘ORIADÉ’ Taking Afrobeats Back Home | Billboard News Silvana Estrada presenta 10 formas de decir adiós sin esconder el dolor en Vendrán Suaves Lluvias Best Global Music Album African artists have been a formidable presence in this category for decades, and that will likely remain the case for the 2027 ceremony. In fact, African artists may snatch four spots in the final line-up of nominees, thanks to strong submissions from Angélique Kidjo ( Hope!!! ), Tems ( Love Is a Kingdom ), Davido ( Oriadé ) and Asake ( M$NEY ). Aside from Asake, each of those four artists has previously been nominated in this category (Kidjo has won five times, with four victories coming in the past decade). Nonetheless, Asake has remained a vital presence this year with his arena-headlining North American tour. At the 2026 ceremony, Brazilian musicians Caetano Veloso and Maria Bethânia won this category with their Caetano e Bethânia Ao Vivo live album. Anitta, a Brazilian pop powerhouse who has made real global crossover strides for the country s contemporary music scene, could follow in their footsteps with a nod for her Equilibirum album, which picked up an album of the year nomination at the 2027 Latin Grammys. Matt B and the Royal Philharmonic Orchestra won this category in 2025 for their Alkebulan II album, and its follow-up, Alkebulan III: The Water Remembers , could also earn a nomination. Susana Baca, who was nominated here in 2024, could also reap a bid with El Viaje de la Lengua . Our Fearless Forecast We re predicting: Equilibrium (Anitta); Love Is A Kingdom (Tems); Hope!!! (Angélique Kidjo); Alkebulan III: The Water Remembers (Matt B The Royal Philharmonic Orchestra); Oriadé (Davido) Best Global Music Performance Honoring international performers exhibiting non-European, indigenous traditions,' this category became quite controversial at the 2026 Grammys, when the Recording Academy ruled Shake It to the Max — the pop-dancehall crossover smash from MOLIY, Silent Addy, Disco Neil, Shenseea and Skillibeng — ineligible fo", "date_str": "2026-11-10T18:30:13+00:00", "hash": "8707cbe501686e41", "title_fa": "رزالیا، شکیرا، دستین کنراد و دیودو: پیش‌بینی‌های ما برای مسابقات جهانی، رگی و موسیقی آفریقایی در گرمی 2027", "summary_fa": "با اضافه شدن بهترین آهنگ لاتین، اکنون 11 دسته در لاتین، جهانی، Reggae New Age، Ambient یا Chant Field در گرمی وجود دارد. در زیر، وضعیت مسابقه را در چهار مورد از این دسته‌ها ارزیابی می‌کنیم - بهترین آلبوم موسیقی جهانی، بهترین اجرای موسیقی جهانی، بهترین اجرای موسیقی آفریقایی و بهترین آلبوم رگی. Related Shaggy چهار دهه برد را با LP جدید «لاتاری» جشن می‌گیرد: «من همیشه روی خودم شرط می‌بندم» Davido حدود 15 سال است که در موسیقی باز می‌شود، «ORIADÉ» در بازگشت به خانه Afrobeats | بیلبورد اخبار Silvana Estrada ارائه 10 فرم از decir adiós sin esconder el dolor en Vendrán Suaves Lluvias بهترین آلبوم موسیقی جهانی هنرمندان آفریقایی برای دهه ها حضور چشمگیری در این دسته داشته اند و احتمالاً برای مراسم 2027 نیز همین گونه باقی خواهد ماند. در واقع، هنرمندان آفریقایی به لطف ارسال‌های قوی آنجلیک کیجو (امید!!!)، Tems (عشق یک پادشاهی است)، Davido (Oriadé) و Asake (M$NEY) ممکن است چهار جایگاه را در فهرست نهایی نامزدها کسب کنند. به غیر از Asake، هر یک از این چهار هنرمند قبلاً در این بخش نامزد شده بودند (Kidjo پنج بار برنده شده است، با چهار پیروزی در دهه گذشته). با این وجود، آساکه امسال با تور پرمخاطب خود در آمریکای شمالی، حضوری حیاتی باقی مانده است. در مراسم 2026، کائتانو ولوسو و ماریا بتانیا، نوازندگان برزیلی با آلبوم زنده خود Caetano e Bethânia Ao Vivo برنده این بخش شدند. آنیتا، یک نیروگاه پاپ برزیلی که گام‌های متقاطع جهانی واقعی برای صحنه موسیقی معاصر این کشور برداشته است، می‌تواند راه آنها را با سر زدن برای آلبوم Equilibirum خود که نامزد دریافت آلبوم سال در گرمی لاتین 2027 شد، دنبال کند. مت بی و ارکستر فیلارمونیک سلطنتی در سال 2025 برای آلبوم Alkebulan II برنده این بخش شدند و ادامه آن، Alkebulan III: The Water Remembers", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/destin-conrad-2026-press-biz3-cr-Sage6-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۲:۰۰"}, {"source": "Billboard", "title": "The Hits With the Most Weeks at No. 1 on Billboard’s ‘Hot’ Songs Charts: ‘You Say,’ ‘Choosin’ Texas’ & More", "link": "https://www.billboard.com/lists/songs-most-weeks-number-1-hot-songs-charts/", "summary": "Ella Langley ’s “Choosin’ Texas” is the newly minted record holder for the most weeks at No. 1 in the history of the Billboard Hot 100 , with its reign now up to 27 weeks . “Just thank you so much. It’s changing my life, it’s changing the lives of the writers of this song,” Langley marveled Sept. 22 on Instagram about “Choosin’ Texas,” which she co-penned with Luke Dick, Miranda Lambert and Joybeth Taylor. “It’s changing the lives of my family and it is truly growing an atmosphere for something I’m gonna be able to do the rest of my life.” Related The Longest-Leading Billboard Hot 100 No. 1s: ‘Choosin’ Texas’ More What are the leaders on Billboard ’s other multimetric song surveys? In addition to the Hot 100, Billboard publishes weekly “Hot”-named charts that measure songs’ U.S. streams, radio airplay and sales in genres covering Christian, country, dance, gospel, Latin, R B/hip-hop and rock/alternative. Plus, the Holiday 100 does the same for festive songs during the holiday season each year. Among those rankings, the Hot 100’s history dates to Aug. 4, 1958. Hot Country Songs and Hot R B/Hip-Hop Songs became the respective genres’ singular listings in October 1958, following beginnings in various forms in the 1940s. Hot Latin Songs (October 1986) and Hot Rap Songs (March 1989) also trace back before this century (with all charts below having shared the Hot 100’s current methodology since October 2012). Below, Billboard runs down the longest-leading hit on every “Hot”-branded songs chart (through rankings dated Nov. 14). In the cases of the top titles on Christian, country, dance/electronic, R B/hip-hop and rock/alternative lists, songs’ crossover success at multiple radio formats helped them reach historic runs at No. 1.", "date_str": "2026-11-10T18:27:22+00:00", "hash": "43271879e7be9385", "title_fa": "پربازدیدهای با بیشترین هفته در رتبه 1 جدول آهنگ های داغ بیلبورد: \"شما می گویید\"، \"انتخاب تگزاس\" و بیشتر", "summary_fa": "\"Choosin' Texas\" از الا لنگلی رکورددار جدیدترین رکورد برای بیشترین هفته ها در شماره 1 در تاریخ بیلبورد Hot 100 است، و اکنون تا 27 هفته سلطنت می کند. لنگلی در 22 سپتامبر در اینستاگرام درباره آهنگ Choosin' Texas که با همکاری لوک دیک، میراندا لمبرت و جویبت تیلور نوشته بود، اظهار داشت: \"فقط خیلی از شما متشکرم. این زندگی من را تغییر می دهد، زندگی نویسندگان این آهنگ را تغییر می دهد.\" \"این زندگی خانواده من را تغییر می دهد و واقعاً فضایی را برای کاری که من می توانم تا پایان عمر انجام دهم افزایش می دهد.\" مرتبط‌ترین شماره 100 پرطرفدار بیلبورد: «انتخاب تگزاس» بیشتر پیشروهای دیگر نظرسنجی‌های آهنگ چندمتری بیلبورد چیست؟ علاوه بر هات 100، بیلبورد به صورت هفتگی نمودارهایی را با نام «هات» منتشر می کند که ایالات متحده آهنگ ها را می سنجد. استریم‌ها، پخش رادیویی و فروش در ژانرهای مسیحی، کانتری، رقص، انجیل، لاتین، R B/Hip-Hop و Rock/Alternative. به علاوه، Holiday 100 هر ساله در فصل تعطیلات برای آهنگ های جشن همین کار را انجام می دهد. در میان این رتبه‌بندی‌ها، تاریخچه Hot 100 به 4 آگوست 1958 بازمی‌گردد. آهنگ‌های Hot Country و Hot R B/Hip-Hop Songs در اکتبر 1958، پس از شروع به اشکال مختلف در دهه 1940، فهرست‌های منحصر به فرد ژانرهای مربوطه شدند. آهنگ‌های لاتین داغ (اکتبر 1986) و آهنگ‌های رپ داغ (مارس 1989) نیز به قبل از این قرن بازمی‌گردند (با همه نمودارهای زیر که از اکتبر 2012 روش فعلی Hot 100 را به اشتراک گذاشته‌اند). در زیر، بیلبورد طولانی‌ترین موفقیت را در هر نمودار آهنگ‌های با برند «Hot» (از طریق رتبه‌بندی مورخ 14 نوامبر) ارائه می‌کند. در مورد عناوین برتر در لیست های مسیحی، کانتری، رقص/الکترونیک، آر بی/هیپ هاپ و راک/ آلترناتیو، موفقیت متقاطع آهنگ ها در فرمت های مختلف رادیویی به آنها کمک کرد تا به رتبه های", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/1145929022-e1790301469770.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۱:۵۷"}, {"source": "Billboard", "title": "Sabrina Carpenter Teams Up With ‘La La Land’ Director for ‘Playful, Unexpected’ Whiskey Campaign", "link": "https://www.billboard.com/music/music-news/sabrina-carpenter-johnnie-walker-damien-chazelle-ad-1236378794/", "summary": "Sabrina Carpenter has a new favorite Go Go Juice. The pop singer stars in a new campaign by La La Land director Damien Chazelle for her ongoing partnership with Johnnie Walker, as revealed on Tuesday (Nov. 10). Related Sabrina Carpenter Channels Stevie Nicks This Hairspray Character in Dual Halloween Looks Madonna Jokingly Calls Out Sabrina Carpenter for Taking 5 Days to Respond in Best Collab Speech at 2026 VMAs Sabrina Carpenter Margaret Qualley Join Fred Astaire Biopic Cast Taking inspiration from French New Wave cinema, the visual shows Carpenter walking into a jazzy nightclub and grabbing a drink made with Johnnie Walker at the bar. The party kicks into gear only as the singer struts through the venue, with confetti flying through the air over her head as she finds a couple of friends and clinks glasses with them. Keep walking, Carpenter says into the camera. In a statement about the campaign, the Grammy winner said that she and the Oscar-winning director wanted to create a true cinematic experience that was playful, unexpected and full of personality, adding, I’m a longtime fan of Damien’s work, so it was exciting to bring this visual world to life alongside him. In an interview with Elle alongside the Johnnie Walker collab, Carpenter highlighted why it was particularly special working with a director known for music-driven movies such as La La Land and Whiplash . Acting and music have always gone hand in hand for me, the musician who was recently cast as Ginger Rogers in an upcoming Fred Astaire biopic explained. With music, I get to tell stories through my own perspective, and with acting I get to step into someone else’s world and bring their story to life, and that is always an exhilarating feeling for me. As for which movie musical she d like to star in someday, Carpenter who made her acting debut on Law Order: Special Victims Unit in 2011 told the publication, I just rewatched 9 to 5 , and you know I’m the biggest Dolly [Parton] fan. So that would be a fun one. The Girl Meets World alum last released music in 2025, scoring her second No. 1 album on the Billboard 200 with Man s Best Friend . The album spawned Billboard Hot 100 -topping single Manchild. Watch Carpenter in Johnnie Walker s new campaign directed by Damien Chazelle below.", "date_str": "2026-11-10T18:17:58+00:00", "hash": "733120821d11dadb", "title_fa": "سابرینا کارپنتر با کارگردان «لا لا لند» برای کمپین ویسکی «بازیگوش، غیرمنتظره» همکاری می کند.", "summary_fa": "سابرینا کارپنتر یک Go Go Juice جدید مورد علاقه دارد. همانطور که در روز سه شنبه (10 نوامبر) فاش شد، این خواننده پاپ در کمپین جدیدی توسط کارگردان La La Land، Damien Chazelle، به دلیل همکاری مداوم خود با جانی واکر، ایفای نقش می کند. کانال های مرتبط سابرینا کارپنتر Stevie Nicks این شخصیت اسپری مو در هالووین دوگانه به نظر می رسد مدونا به شوخی از سابرینا کارپنتر برای پاسخگویی به بهترین سخنرانی در سال 2026 دعوت می کند سابرینا کارپنتر مارگارت کوالی. وارد یک کلوپ شبانه جذاب و خوردن یک نوشیدنی ساخته شده با جانی واکر در بار. مهمانی تنها زمانی شروع می‌شود که خواننده با قدم زدن در محل برگزار می‌شود، در حالی که او چند دوست را پیدا می‌کند و با آن‌ها لیوان را به هم می‌زند. کارپنتر در مقابل دوربین می گوید به راه رفتن ادامه دهید. در بیانیه ای درباره کمپین، برنده گرمی گفت که او و کارگردان برنده اسکار می خواستند یک تجربه سینمایی واقعی را خلق کنند که بازیگوش، غیرمنتظره و پر از شخصیت باشد، و افزود، من از طرفداران دیرینه آثار دیمین هستم، بنابراین هیجان انگیز است که این دنیای بصری را در کنار او زنده کنم. کارپنتر در مصاحبه‌ای با Elle در کنار همکاری جانی واکر، به این نکته اشاره کرد که چرا کار کردن با کارگردانی که به خاطر فیلم‌های موسیقی محور مانند La La Land و Whiplash شناخته می‌شود، خاص بوده است. نوازنده‌ای که اخیراً در فیلم زندگی‌نامه‌ای فرد آستر برای نقش جینجر راجرز انتخاب شد، بازیگری و موسیقی همیشه برای من دست به دست هم داده‌اند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/sabrina-carpenter-johnnie-walker-billboard-1800-1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۹ آبان • ۲۱:۴۷"}, {"source": "Billboard", "title": "‘The Voice’ Contestant Lillie Kolich Completely Transforms This Britney Spears Top 10 Dance Pop Hit Into a Sultry Seduction: Watch", "link": "https://www.billboard.com/music/pop/lillie-kolich-the-voice-britney-spears-drive-me-crazy-watch-1236378784/", "summary": "One way to definitely stand out on The Voice is to take a beloved pop hit and completely make it your own. That s what 25-year-old New Mexico native Lillie Kolich did on The Voice on Monday night s (Nov. 9) first live show of season 30 on a Y2K-themed episode. The Team Queen singer who made the cut in the top 13, told the studio audience before her performance that she loved Britney Spears and that as a shy kid she looked to Brit for inspiration while pursuing her pop star dreams. Then she hit the stage in a very Spears-coded blood red outfit featuring a low-cut, lingerie-like slip dress, deep red fur shrug and matching leather purse to sing a meditative, slowed-down version of Spears 1999 No. 10 Billboard Hot 100 pop banger (You Drive Me) Crazy. Unlike the seductive, mid-tempo Baby One More Time original, Kolich slowed the beat way down, opting for a sultry ballad approach, singing the longing lyrics to a spare backing track, accompanied by two electric guitar players on the revamp that finally took off in an approximation of the original near the end. Despite the attempt to shake things up, though, the season 30 contestant who d earlier been saved by Latifah during Cut Week ended up on the chopping block. Coach Riley Green called her rendition awesome, and said it s a challenge to take such a popular song and make it your own, while Latifah said her charge had Nailed it! But on the night when six singers from Team Queen and Team Adam faced off to move to the next round — Team Kelly and Team Riley performers will sing next Monday (Nov. 16) — Kolich was sent home. Going through to the next round are Team Queen members Mia Knight, BigCountry and Team Adam singers Dakota Cohen, Connor Closs and Lexi Stephens. The Voice airs on NBC on Mondays at 9 p.m. ET and streams the next day on Peacock. Watch Kolich on The Voice below.", "date_str": "2026-11-10T18:15:24+00:00", "hash": "f52f48c5a54181db", "title_fa": "لیلی کولیچ، شرکت کننده «The Voice» این 10 آهنگ برتر رقص پاپ بریتنی اسپیرز را به طور کامل به یک اغوای وحشتناک تبدیل کرده است: تماشا کنید", "summary_fa": "یکی از راه‌های برجسته شدن در The Voice این است که یک آهنگ پاپ محبوب را بگیرید و آن را کاملاً متعلق به خودتان کنید. این همان کاری است که لیلی کولیچ، 25 ساله اهل نیومکزیکو، در اولین برنامه زنده فصل 30 دوشنبه شب (9 نوامبر) در The Voice در یک قسمت با موضوع Y2K انجام داد. خواننده تیم کوئین که در بین 13 آهنگ برتر قرار گرفت، قبل از اجرای خود به تماشاگران استودیو گفت که عاشق بریتنی اسپیرز است و به عنوان یک بچه خجالتی برای الهام گرفتن از بریت در حالی که رویاهای ستاره پاپ خود را دنبال می کرد، نگاه می کرد. سپس او با لباس قرمز خونی کاملاً با کد اسپیرز روی صحنه آمد که شامل لباسی کوتاه و شبیه به لباس زیر زنانه بود، شانه‌های خزدار قرمز تیره را بالا می‌اندازد و کیف چرمی همسان را برای خواندن نسخه‌ای مراقبه‌آمیز و آهسته از Spears 1999 Billboard Hot 100 Pop Banger C (You Drive Me) C. برخلاف آهنگ اصلی Baby One More Time اغواکننده و میانه، کولیچ آهنگ آهنگ را آهسته کرد، یک روش تصنیف خشن را انتخاب کرد، اشعار حسرت‌انگیز را برای یک آهنگ پشتیبان یدکی خواند، همراه با دو نوازنده گیتار الکتریک در بازسازی که در نهایت تقریباً تقریباً در انتهای کار شروع شد. با وجود تلاش برای تغییر اوضاع، مسابقه‌دهنده فصل 30 که قبلاً توسط لطیفه در طول هفته کات نجات داده شده بود، به پایان رسید. مربی رایلی گرین اجرای او را فوق‌العاده خواند و گفت که گرفتن چنین آهنگ محبوبی و ساختن آن از آن خود یک چالش است، در حالی که لطیفه گفت که اتهام او آن را نادیده گرفته است! اما در شبی که شش خواننده از تیم کوئین و تیم آدام برای رفتن به دور بعدی روبرو شدند - اجراکنندگان تیم کلی و تیم رایلی دوشنبه آینده", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/lillie-kolich-the-voice-spears-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۱:۴۵"}, {"source": "Deadline", "title": "HBO’s ‘It’s Florida, Man’ Sets Season 3 Return, Unveils Trailer", "link": "https://deadline.com/2026/11/its-florida-man ن پاک کند. Odd Dot همچنین مجموعه‌ای از سه کتاب منتشر خواهد کرد که جهان Bloodsuckers را از سازندگان دیجیتال Rock Squad s گسترش می‌دهد. سریال درجه متوسط ​​که ماجراهای عاشقانه، فانتزی و خون آشام را در هم می آمیزد. این کتاب‌ها بر اساس سری دیجیتالی گروه، شخصیت‌ها و دنیای آن‌ها را عمیق‌تر بررسی می‌کنند و یک ویژگی سرگرمی تثبیت شده را به قالب داستان‌سرایی جدید می‌آورند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/GettyImages-2298795120.jpg?crop=475px%2C360px%2C1233px%2C692px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۹ آبان • ۲۱:۳۰"}, {"source": "Hollywood Reporter", "title": "Skye From ‘Paw Patrol’ Is Getting Her Own Spinoff", "link": "https://www.hollywoodreporter.com/tv/tv-news/skye-from-paw-patrol-nickelodeon-spinoff-1236750929/", "summary": "And she's bringing her girls with her.", "date_str": "2026-11-10T18:00:00+00:00", "hash": "3575b8c61f392054", "title_fa": "Skye از \"Paw Patrol\" در حال دریافت اسپین آف خودش است", "summary_fa": "اسپین مستر روز سه‌شنبه اعلام کرد که Skye از Paw Patrol در حال ساخت سری اسپین‌آف خود است، Skye s Pup Squad. (اسپین مستر اسباب‌بازی صاحب نام تجاری Paw Patrol است.) خلبان کاکائو بامزه دخترانش را با خود می‌آورد: اورست و لیبرتی همچنین حیوانات را در مجموعه انیمیشن دوبعدی جدید که در مارس 2027 در Nickelodeon پخش خواهد شد، نجات خواهند داد. ویشنو آتریا، رئیس اسپین مستر اینترتینمنت، گفت: «عشق به Paw Patrol باورنکردنی است، و بخش بزرگی از آن به این دلیل است که بچه‌ها فقط Skye را دوست دارند. او از روز اول یک قهرمان بوده است و زمان آن فرا رسیده است که لحظه‌های خاص خود را داشته باشد. Skye's Pup Squad به ما این امکان را می‌دهد تا عمیق‌تر در روحیه شجاع و همدل او با ماجراجویی‌های تازه و سرگرم‌کننده شیرجه بزنیم. ما نمی توانیم منتظر بمانیم تا بچه ها با Skye و تیم توله سگش وارد این ماموریت های جدید نجات شوند. داستان‌های مرتبط تلویزیون کریس پرت برای دریافت جایزه پادشاه کمدی در سال 2026 فیلم‌های جوایز انتخاب بچه‌ها از اریک باوزا به‌عنوان یک استعداد یک بار در یک نسل یاد می‌شود که صدای جدیدی به لونی تیونز داده است. رئیس استودیوی انیمیشن نیکلودئون \"به دنبال موفقیت Rubble Crew، ما دیدیم که بچه ها و خانواده ها چقدر مشتاق هستند که زمان بیشتری را با شخصیت هایی که دوستشان دارند بگذرانند. Skye's Pup Squad از طریق ماجراجویی های جدید، دوستی و کار گروهی، این امتیاز را به گونه ای گسترش می دهد که به قلب خود وفادار می ماند. Skye's Pup Squad در مسیرهای Ridge و توضیحات Rescue گشت می زند. چه یک بچه بزی باشد که خیلی بالا می رود یا یک بچه گربه گربه گربه ای باشد که در یک قایق رانی فراری روی تپه های خشمگین شناور است، تیم توله سگ Skye", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/PP-FF-051-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۹ آبان • ۲۱:۳۰"}, {"source": "Hollywood Reporter", "title": "Netflix Launches New Brand Advertising Campaign In Engagement Push", "link": "https://www.hollywoodreporter.com/business/digital/netflix-launches-new-advertising-campaign-find-thing-1236751618/", "summary": "The streaming giant launched the campaign, 'Find The Thing You Never Knew You Needed,' in the U.S., Canada, Brazil and Spain.", "date_str": "2026-11-10T17:29:03+00:00", "hash": "f3fd91c50323548b", "title_fa": "نتفلیکس کمپین تبلیغاتی جدید برند را در Engagement Push راه اندازی می کند", "summary_fa": "این غول استریم کمپین «چیزی را که هرگز نمی‌دانستید به آن نیاز دارید را بیابید» در ایالات متحده، کانادا، برزیل و اسپانیا راه‌اندازی کرد. در حالی که نتفلیکس در حال آماده شدن برای بازنگری کلی پیشنهادات فیلم و تلویزیون خود زیر نظر مدیر محتوای جدید پیتر رایس است، این غول استریم یک کمپین برند جدید راه اندازی می کند تا سعی کند کاربران خود را متقاعد کند که به هماهنگی ادامه دهند. این کمپین با عنوان چیزی را که هرگز نمی دانستید نیاز دارید را پیدا کنید، روز سه شنبه در ایالات متحده، کانادا، برزیل و اسپانیا راه اندازی شد. این سه نقطه هر کدام مانند یک فیلم ساخته شده‌اند (و با 35 میلی‌متر فیلمبرداری شده‌اند!)، و هر کدام یک شخصیت اصلی را به شکل فضانورد، یک خون‌آشام و یک آکسولوتل (دوزیست بومی مکزیک) نشان می‌دهند، با داستانی حماسی که در یافتن نمایش بعدی خود در نتفلیکس به اوج می‌رسد. این کمپین در حالی برگزار می‌شود که نت‌فلیکس با محتوای خود در نقطه عطف قرار دارد و انتظار می‌رود رایس استراتژی خود را تغییر دهد و بیشتر بر بازار ایالات متحده و کانادا تمرکز کند. این تغییر در صدر محتوا در حالی رخ داد که تعامل نتفلیکس آنقدر که دوست داشت قوی نبوده است، چیزی که تد ساراندوس، یکی از مدیران اجرایی، علناً در مورد آن صحبت کرده است. آرتی تیاگاراجان، مدیر ارشد استودیوی خلاقانه برند نتفلیکس، گفت: «مردم به نتفلیکس می‌آیند و اعتماد دارند که چیز جدیدی را برای دوست‌داشتن کشف خواهند کرد، اغلب چیزی را که نمی‌بینند در راه است. بنابراین ما با کارهایی که طرفداران واقعی انجام می‌دهند، شروع کردیم، مانند بیدار ماندن برای یک قسمت دیگر یا منفجر کردن گفتگوی گروهی درباره یک وسواس جدید، و آنها را به کمپینی سرگرم‌کننده تبدیل کردیم که به اندازه نمایش‌ها و فیلم‌هایی که الهام‌بخش آنها هستند. زیرا هنگامی که", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Hero-Image.jpg?crop=0px%2C34px%2C1766px%2C989px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۱۹ آبان • ۲۰:۵۹"}, {"source": "Variety", "title": "Indie Game Publisher Vendetta Unveils 2027 Release Slate, Including ‘Surfpunk,’ as It Sets New Advisory Board (EXCLUSIVE)", "link": "https://variety.com/2026/gaming/news/surfpunk-game-publisher-vendetta-2027-releases-1236944116/", "summary": "Indie games publisher Vendetta has unveiled its 2027 release slate, from the much-hyped “Surfpunk,” to high-energy co-op experiences like “Killing Things with Your Friends,” to cozy single-player adventure games with a twist like “The Mailroom. Additionally, Vendetta has announced a new advisory board that includes leaders from music, Hollywood communications, anime and game development, like [ ]", "date_str": "2026-11-10T18:00:00+00:00", "hash": "5c58117c40bd6847", "title_fa": "ناشر بازی Indie Vendetta از نسخه 2027، از جمله Surfpunk، با تشکیل هیئت مشاوره جدید رونمایی کرد (انحصاری)", "summa y. As the co-chair and chief content officer of Skydance Direct-To-Consumer, Bloys oversees original programming for HBO Max and Paramount+, as well as the company’s strategy, operations, [ ]", "date_str": "2026-11-10T18:00:00+00:00", "hash": "280c1957af4c5d7a", "title_fa": "کیسی بلویز از Skydance در جوایز انجمن تهیه کنندگان تجلیل خواهد شد", "summary_fa": "کیسی بلویز در سی و هشتمین دوره جوایز سالانه انجمن تولیدکنندگان با جایزه Milestone مورد تقدیر قرار خواهد گرفت و از خلاقانی که سهم قابل توجهی در صنعت سرگرمی داشته اند، تقدیر خواهد شد. بلویز به عنوان رئیس مشترک و مدیر محتوای Skydance Direct-To-Consumer بر برنامه‌ریزی اصلی HBO Max و Paramount+ و همچنین استراتژی، عملیات شرکت نظارت می‌کند. من همیشه بر این باور بودم که وظیفه ما ایجاد محیطی است که در آن افراد با استعداد بتوانند ریسک کنند، داستان های بلندپروازانه بگویند و بهترین کار خود را انجام دهند. من از انجمن تهیه کنندگان برای این شناخت و از همه تهیه کنندگان، داستان نویسان و همکارانی که بخشی از آن سفر بوده اند، بی نهایت سپاسگزارم.» تحت رهبری بلویز، برنامه های تلویزیونی اصلی HBO و HBO Max در سال گذشته 21 جایزه امی دریافت کردند و هفت سریال اصلی او به طور متوسط ​​15 میلیون بیننده آمریکایی در هر قسمت در سراسر سیستم عامل ها داشت. دونا گیگلیوتی، رئیس شرکت مایک فارادوک، رئیس شرکت آمریکا، گفت: \"با توجه به تاریخ اخیر هالیوود، هیچ کس به اندازه کیسی بلویز شایسته دریافت جایزه Milestone نیست. در دهه گذشته، کیسی در ردیف اول همه اختلالات و تحکیم پیش روی صنعت ما قرار داشته است. در تمام مدت او یک قهرمان واقعی و ثابت قدم در فرآیند خلاقیت باقی مانده است.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/Casey-Headshot.png?crop=88px%2C329px%2C1373px%2C771px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۹ آبان • ۲۱:۳۰"}, {"source": "Variety", "title": "‘PAW Patrol’ Spinoff Series ‘Skye’s Pup Squad’ Set for 2027 Release", "link": "https://variety.com/2026/tv/news/paw-patrol-spinoff-series-skyes-pup-squad-release-date-1236943216/", "summary": "The “PAW Patrol” universe continues to grow. Spin Master announced Tuesday a new spinoff series called “Skye’s Pup Squad” will debut on Nickelodeon in March 2027. “Skye’s Pup Squad” is an animated 2D series focusing on the fearless cockapoo Skye and her two pals, Everest and Liberty, on their missions to rescue animals in need. [ ]", "date_str": "2026-11-10T18:00:00+00:00", "hash": "9c241f5a528a9a2b", "title_fa": "مجموعه اسپین‌اف سری «PAW Patrol» «Skye's Pup Squad» برای اکران در سال 2027", "summary_fa": "جهان \"PAW Patrol\" به رشد خود ادامه می دهد. Spin Master روز سه‌شنبه اعلام کرد که یک سری اسپین‌آف جدید به نام «Skye's Pup Squad» در مارس 2027 در Nickelodeon پخش می‌شود. «Skye's Pup Squad» یک مجموعه انیمیشن دوبعدی است که بر روی کاکائو بی‌باک Skye و دو رفیق او، اورست و لیبرتی، در ماموریت‌های خود برای حیوانات نیازمند تمرکز دارد. [ ] جهان \"PAW Patrol\" به رشد خود ادامه می دهد. اسپین مستر روز سه‌شنبه اعلام کرد که یک سری اسپین‌آف جدید به نام «جوخه سگ‌های اسکای» در مارس ۲۰۲۷ در نیکلودئون عرضه می‌شود. این اسپین‌آف پس از سومین قسمت از مجموعه فیلم «گشت پنجه» (Paw Patrol) منتشر می‌شود که در ماه سپتامبر به سینماها می‌رود. سریال اصلی «PAW Patrol» 2013 و «Rubble Crew» در سال 2023 نیز هر دو در ماه می برای دو فصل دیگر در Nickelodeon تمدید شدند. \"Skye's Pup Squad\" آخرین تکرار پس از توله های نجات است. Vishnu Athreya، رئیس EVP Spin Master Entertainment، گفت: «عشق به PAW Patrol باورنکردنی است، و بخش بزرگی از آن به این دلیل است که بچه‌ها فقط Skye را دوست دارند. او از روز اول یک قهرمان بوده است و زمان آن فرا رسیده است که لحظه‌های خاص خود را داشته باشد. Skye's Pup Squad به ما این امکان را می‌دهد تا عمیق‌تر در روحیه شجاع و همدل او با ماجراجویی‌های تازه و سرگرم‌کننده شیرجه بزنیم. ما نمی توانیم منتظر بمانیم تا بچه ها با Skye و تیم توله سگش وارد این ماموریت های نجات کاملاً جدید شوند.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/Skyes-Pup-Squad.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۹ آبان • ۲۱:۳۰"}, {"source": "Variety", "title": "Disne
