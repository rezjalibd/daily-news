own drones that enter alliance airspace, but alliance leaders say more cost-effective measures are needed. JOHN THYS/AFP via Getty Images Fighter jets have been NATO's costly answer to incoming drones. Latvia is building an automated anti-drone border defense to stop them with cheaper weapons. Its defense minister told Business Insider that jets will be the \"secondary means\" of stopping drones. Fighter jets armed with expensive air-to-air missiles have led the way in the fight to take down the cheap drones that breach NATO airspace, a costly dynamic officials say needs to change. NATO ally Latvia is building a Ukraine-inspired automated anti-drone wall along its entire eastern border with Russia. It is designed to make fighter jets a last line of defense, not the first, Latvian Defense Minister Raivis Melnis told Business Insider. The system is expected to be completed by the end of September. The system, Melnis said, aims to detect and neutralize \"any drone which flies in.\" Fighter jets will work instead as \"the secondary means\" of stopping drones, he said. If a drone penetrates the wall, NATO jets will then be used to intercept it. Latvia's approach is aimed at addressing a problem facing NATO more broadly: relying on fighter jets such as F-35s, F-16s, and Rafales to shoot down cheap drones with air-to-air missiles can prove expensive. Surface-to-air missiles can be even more costly, putting defenders in an unsustainable situation. NATO Secretary General Mark Rutte said in June that \"long-term we cannot continue by shooting down drones with very costly interceptors, so we have to find interception techniques which are of the same costs as the drones.\" It's a problem the US has worried about in its war with Iran, where some Iranian drones were stopped by very expensive interceptor missiles. Melnis said it's important that drones are stopped by a \"cheap but reliable system.\" He described interceptor drones , which the Ukrainians have pioneered as a cost-effective defense, as \"a cheap technology in comparison with a missile.\" A border that stops drones Melnis said that the new anti-drone border is key because ultimately, the \"border is not a Russian-Latvian border. It is a Russia-NATO, Russia-Europe border.\" He said that while this segment of Russia's border is shared specifically with Latvia, \"we are NATO, and we are a European Union country.\" Any drone that crosses the border, he said, \"that's the drone coming into NATO airspace . Th", "date_str": "2026-09-28T12:40:02+00:00", "hash": "d37c21ac5c552b55", "title_fa": "ناتو از جت های جنگنده برای متوقف کردن هواپیماهای بدون سرنشین استفاده می کند. یکی از متحدان می گوید که یک دیوار ضد پهپاد جدید با الهام از اوکراین ابتدا آنها را مدیریت می کند.", "summary_fa": "جت های ناتو در حال سرنگونی پهپادهایی هستند که وارد حریم هوایی اتحاد می شوند، اما رهبران ائتلاف می گویند اقدامات مقرون به صرفه تری لازم است. JOHN THYS/AFP از طریق Getty Images جت های جنگنده پاسخ پرهزینه ناتو به پهپادهای ورودی بوده اند. لتونی در حال ساخت یک دفاع مرزی خودکار ضد پهپاد است تا آنها را با سلاح های ارزان تر متوقف کند. وزیر دفاع این کشور به Business Insider گفت که جت ها \"وسیله ثانویه\" برای متوقف کردن هواپیماهای بدون سرنشین خواهند بود. جت‌های جنگنده مجهز به موشک‌های هوا به هوای گران‌قیمت راه را در مبارزه برای سرنگونی پهپادهای ارزان‌قیمتی که حریم هوایی ناتو را نقض می‌کنند، رهبری کرده‌اند، که مقامات پویا و پرهزینه می‌گویند باید تغییر کند. لتونی، متحد ناتو، در حال ساخت یک دیوار ضد پهپاد خودکار با الهام از اوکراین در سراسر مرز شرقی خود با روسیه است. رایویس ملنیس وزیر دفاع لتونی به Business Insider گفت که این هواپیما به گونه ای طراحی شده است که جت های جنگنده را به آخرین خط دفاعی تبدیل کند، نه اولین. انتظار می رود این سیستم تا پایان شهریور تکمیل شود. ملنیس گفت که هدف این سیستم شناسایی و خنثی کردن هر هواپیمای بدون سرنشینی است که به داخل پرواز می کند. او گفت که جت های جنگنده در عوض به عنوان \"وسیله ثانویه\" برای توقف هواپیماهای بدون سرنشین کار خواهند کرد. اگر یک پهپاد به دیوار نفوذ کند، جت های ناتو برای رهگیری آن استفاده خواهند شد. هدف رویکرد لتونی رسیدگی به مشکلی است که ناتو با آن روبه‌رو است: تکیه بر جت‌های جنگنده مانند F-35، F-16 و Rafales برای سرنگونی هواپیماهای بدون سرنشین ارزان قیمت با موشک‌های هوا به هوا می‌تواند گران باشد. موشک‌های زمین به هوا می‌توانند حتی گران‌تر باشند و مدافعان را در وضعیت ناپایداری قرار دهند. مارک روته، دبیرکل ناتو در"}, {"source": "Business Insider", "title": "The risk that comes from outsourcing our brains to AI", "link": "https://www.businessinsider.com/ai-creep-writing-jobs-skill-atrophy-2026-9", "summary": "Siri AI is the headline improvement on the iPhone s latest update. Users must join a waitlist. Artur Widak/NurPhoto via Getty Images This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . With AI seeping into every corner of our lives, a BI writer had a nagging question: Did AI write this? BI's Aki Ito donned her detective cap and went hunting, unleashing an AI detector on every aspect of her professional and personal life. The results were eye-opening and, in at least one case, heartbreaking . But it also led to a bigger question, one worth considering as our new AI overlords companions take on a bigger part of our lives: Why does it matter so much to us whether AI or a human created it? When it comes to writing, people like Stanley Druckenmiller don't see a debate. And to be honest, I get it. People like Aki and me, who've built our livelihoods around writing, are understandably sensitive about farming out writing to AI. When you've made billions of dollars investing, why worry about outsourcing your writing to the robots? Of course, when AI hits a little closer to home, tunes tend to change. A 2025 survey of quants, Wall Street's most data-obsessed investors, found the majority didn't use AI for investing. Last year, a lot of them told BI they were unimpressed by the tech. Even Marc Andreessen, the famed VC investor and AI optimist, sees AI falling short in one specific area: doing his job . There's a simple reason all of us should be sensitive to AI creep. The tech can quickly go from a handy tool to something you're at the mercy of. Look no further than engineers, the group hardest hit by AI thus far . A software engineer's post about how AI coding has made the job \"soul-sucking\" recently went viral . \"People are working 12 to 13 hours a day just to press enter,\" he said. \"Nobody is thinking anymore.\" It doesn't take long for those skills you're handing off to AI to deteriorate. Think of it like AI atrophy. I realize I sound a bit like someone pitching horses after Henry Ford just unveiled the Model T. Becoming an AI luddite isn't a realistic route for most of us who want to keep our jobs. The use of AI, on some level, is essentially a requirement. Like Aki, I find it a useful sounding board while working through drafts. It hates my dad jokes, but so do a lot of you. But there are real risks to completely handing over the keys to AI companies, especially as they're still t", "date_str": "2026-09-28T12:25:31+00:00", "hash": "f22683cf21caa6f5", "title_fa": "خطری که از برون سپاری مغز ما به هوش مصنوعی ناشی می شود", "summary_fa": "هوش مصنوعی سیری عنوان پیشرفت در آخرین به روز رسانی آیفون است. کاربران باید به لیست انتظار بپیوندند. Artur Widak/NurPhoto از طریق Getty Images این پست در اصل در خبرنامه Business Insider Today منتشر شده است. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. با نفوذ هوش مصنوعی به هر گوشه از زندگی ما، یک نویسنده BI یک سوال آزاردهنده داشت: آیا هوش مصنوعی این را نوشته است؟ آکی ایتو از BI کلاه پلیسی خود را پوشید و به شکار رفت و یک آشکارساز هوش مصنوعی را در تمام جنبه های زندگی حرفه ای و شخصی خود آزاد کرد. نتایج چشمگیر و حداقل در یک مورد دلخراش بود. اما به یک سوال بزرگ‌تر نیز منجر شد، سوالی که ارزش آن را دارد چرا که همراهان جدید هوش مصنوعی بخش بزرگ‌تری از زندگی ما را به عهده می‌گیرند: چرا اینقدر برای ما مهم است که هوش مصنوعی آن را ایجاد کرده باشد یا انسان؟ وقتی صحبت از نوشتن می شود، افرادی مانند استنلی دراکن میلر بحثی را نمی بینند. و صادقانه بگویم، متوجه شدم. افرادی مانند آکی و من، که معیشت خود را حول محور نوشتن ساخته‌ایم، به طور قابل‌توجهی در مورد پرورش نوشتن با هوش مصنوعی حساس هستیم. وقتی میلیاردها دلار سرمایه گذاری کرده اید، چرا نگران برون سپاری نوشته های خود به روبات ها باشید؟ البته، وقتی هوش مصنوعی کمی به خانه نزدیک‌تر می‌شود، آهنگ‌ها تغییر می‌کنند. یک نظرسنجی در سال 2025 از کوانت ها، که بیشترین وسواس سرمایه گذاران وال استریت را دارند، نشان داد که اکثریت آنها از هوش مصنوعی برای سرمایه گذاری استفاده نمی کنند. سال گذشته، بسیاری از آنها به BI گفتند که تحت تأثیر این فناوری قرار نگرفتند. حتی Marc Andreessen، سرمایه‌گذار مشهور VC و خوش‌بین هوش مصنوعی، هوش مصنوعی را در یک زمینه خاص کوتاه می‌بیند: انجام کارش. یک"}, {"source": "Business Insider", "title": "I asked Instinct to plan 2 trips for me — and it sucked all the joy out of traveling", "link": "https://www.businessinsider.com/instinct-ai-agent-plan-travel-dull-mistake-vacation-work-trip-2026-9", "summary": "I felt much more excited planning a vacation to Amsterdam myself than when the agent took nearly an hour figuring it out. Andrey Danilovich/Getty Images I used Instinct's AI agent to plan a work trip and a European vacation. For the work trip, it quickly created a solid itinerary but suggested an impossible flight. When I asked for help with a vacation, it took much longer and sucked out the excitement of travel. Ask around: AI agents are the Next Big Thing. You can give them tasks via iMessage or WhatsApp, and they can search the internet or use software to complete them. It's a bit like having a concierge or assistant who can book restaurants or reply to emails for you. When I used one to plan a trip , I was underwhelmed to say the least. In fact, it had me questioning the point of travel. Is it to check another country off your list and follow a set itinerary, or to explore somewhere new and connect with different people? I put two scenarios to the test: a business trip and a European city break . The agent was far more useful for the former, but it still slipped up with a pretty obvious mistake. I live in London, and since Meta's Muse isn't yet available outside the US, I asked a colleague for an invite to use Instinct's AI agent . I decided on a hypothetical three-night trip to Business Insider's headquarters in New York. I would check a bag and avoid flying overnight (sleeping on an airplane is a tantalizing, if impossible, goal for me). First, I picked the dates and planned the trip out myself. After half an hour on Google Flights and Booking.com — plus checking public transit costs and the company policy on meal expenses — I had a rudimentary document calculating a roughly $2,000 budget. Instinct only took about 10 minutes to create a four-page doc replete with details. Each section included a paragraph explaining its reasoning, a brief schedule, and links to sources at the end. However, the agent committed a basic error with the flights. It suggested I fly from London to New York with Delta Air Lines, but return with British Airways to avoid a red-eye. It's impossible to book these two airlines on the same ticket — the sort of thing that's obvious when you're researching flights yourself. Pete Syme/Business Insider Instinct took six minutes to rectify the mistake and update the doc with a daytime return flight on Virgin Atlantic for about $130 extra. (Delta has a 49% stake in Virgin Atlantic, so flights with either airline can be booked through th", "date_str": "2026-09-28T10:58:18+00:00", "hash": "1d2601d2b8a160ba", "title_fa": "از Instinct خواستم که برای من 2 سفر برنامه ریزی کند - و این همه لذت سفر را از بین برد", "summary_fa": "خیلی هیجان‌زده‌تر بودم که خودم برای تعطیلات به آمستردام برنامه‌ریزی کنم تا زمانی که مامور نزدیک به یک ساعت طول کشید تا آن را بفهمد. آندری دانیلوویچ/ گتی ایماژز من از عامل هوش مصنوعی Instinct برای برنامه ریزی یک سفر کاری و تعطیلات اروپایی استفاده کردم. برای سفر کاری، به سرعت یک برنامه سفر کامل ایجاد کرد اما یک پرواز غیرممکن را پیشنهاد کرد. وقتی برای تعطیلات کمک خواستم، خیلی بیشتر طول کشید و هیجان سفر را از بین برد. از اطراف بپرسید: عوامل هوش مصنوعی چیز بزرگ بعدی هستند. می توانید از طریق iMessage یا WhatsApp به آنها وظایف بدهید و آنها می توانند در اینترنت جستجو کنند یا از نرم افزار برای تکمیل آنها استفاده کنند. این کمی شبیه داشتن یک دربان یا دستیار است که می تواند رستوران ها را رزرو کند یا به ایمیل شما پاسخ دهد. وقتی از یکی برای برنامه ریزی سفر استفاده کردم، دست کم ناراحت شدم. در واقع، باعث شد که هدف سفر را زیر سوال ببرم. آیا این است که کشور دیگری را از لیست خود بررسی کنید و یک برنامه سفر مشخص را دنبال کنید یا برای کاوش در یک مکان جدید و ارتباط با افراد مختلف؟ من دو سناریو را آزمایش کردم: یک سفر کاری و یک تعطیلات شهری اروپایی. این عامل برای اولی بسیار مفیدتر بود، اما باز هم با یک اشتباه کاملاً آشکار از بین رفت. من در لندن زندگی می کنم و از آنجایی که Meta's Muse هنوز در خارج از ایالات متحده در دسترس نیست، از یکی از همکارانم دعوت کردم تا از عامل هوش مصنوعی Instinct استفاده کنم. تصمیم گرفتم یک سفر سه شبه فرضی به دفتر مرکزی Business Insider در نیویورک داشته باشم. چمدان را چک می‌کردم و از پرواز در طول شب اجتناب می‌کردم (خوابیدن در هواپیما برای من یک هدف وسوسه‌انگیز،"}, {"source": "Business Insider", "title": "My startup is profitable and made over $100M in 6 months. I still worry it could all disappear.", "link": "https://www.businessinsider.com/david-rabie-tovala-meal-prep-startup-founder-2026-9", "summary": "David Rabie was raised to be an entrepreneur. Courtesy of David Rabie David Rabie's family had many entrepreneurs, including his dad. His ability to tolerate risk helped him weather challenges, including a bank collapse. Today, his company has done more than $100 million in sales in the past six months. This as-told-to essay is based on a conversation with David Rabie , founder of Tovala . It has been edited for length and clarity . When I was in business school , I was cooking dinner for myself one day, prepping meals for the week. I was using my oven, the stovetop, and a countertop steam machine, spending hours turning dials and pushing buttons. I thought, couldn't this be automated? That was the seed of the idea for my company, Tovala, which launched in 2015. Tovala is a meal service that allows users to cook at home, simply. Once you purchase a Tovala oven, you get fresh meals delivered weekly. You scan a code, and have a home-cooked meal in 20 minutes. I wanted to provide a solution that lets busy people like me create a home-cooked meal without spending hours in the kitchen. The product evolved over time, but we stuck to that core tenet: a meal made with raw ingredients, but without the fuss. My family's immigration story shaped my outlook Before I created Tovala , I was looking for business opportunities. I knew I wanted to be an entrepreneur; I just didn't know what my business would be. My family immigrated from Iran , and almost all of them became entrepreneurs, including my dad, who developed properties. My family — like many immigrants who find success in the US — is a big believer in the American dream . I was raised on the idea that if you have an idea in this country and the resilience and grit to pursue it, you can achieve success. Since that was instilled in me from a very young age, I always thought I would achieve my goal of being an entrepreneur. My family's experience also gave me a higher tolerance for risk. I was colored by the stories I heard growing up. Compared to what my extended family had to go through leaving Iran, figuring out life and business in this country felt easy. Creating the product with a small team was difficult I would need that risk tolerance more than I realized. Tovala had early successes, including winning a $70,000 prize in a new venture challenge at the University of Chicago . And yet, even with that funding, launching the company was difficult. I needed money to hire a team and develop the product. And yet,", "date_str": "2026-09-28T10:52:01+00:00", "hash": "8a869720e84c8afd", "title_fa": "استارتاپ من سودآور است و در 6 ماه بیش از 100 میلیون دلار درآمد داشته است. من هنوز نگرانم که همه چیز ناپدید شود.", "summary_fa": "دیوید رابی به عنوان یک کارآفرین بزرگ شد. به لطف دیوید ربی، خانواده دیوید ربی کارآفرینان زیادی از جمله پدرش داشتند. توانایی او در تحمل ریسک به او کمک کرد تا با چالش‌ها، از جمله سقوط بانک، مقابله کند. امروز، شرکت او در شش ماه گذشته بیش از 100 میلیون دلار فروش داشته است. این مقاله گفته شده بر اساس گفتگو با دیوید رابی، بنیانگذار تووالا است. برای طول و وضوح ویرایش شده است. وقتی در مدرسه بازرگانی بودم، یک روز برای خودم شام درست می‌کردم و برای هفته غذا درست می‌کردم. من از اجاق، اجاق گاز و دستگاه بخار روی صفحه استفاده می‌کردم، ساعت‌ها صرف چرخاندن صفحه و فشار دادن دکمه‌ها می‌کردم. من فکر کردم، آیا این نمی تواند خودکار باشد؟ این نطفه ایده شرکت من، تووالا بود که در سال 2015 راه اندازی شد. تووالا یک سرویس غذایی است که به کاربران امکان می دهد به سادگی در خانه آشپزی کنند. پس از خرید یک اجاق گاز تووالا، وعده های غذایی تازه به صورت هفتگی تحویل داده می شود. شما یک کد را اسکن می کنید و ظرف 20 دقیقه یک غذای خانگی میل می کنید. من می‌خواستم راه‌حلی ارائه کنم که به افراد پرمشغله‌ای مثل من اجازه دهد بدون صرف ساعت‌ها در آشپزخانه یک غذای خانگی درست کنند. محصول با گذشت زمان تکامل یافت، اما ما به آن اصل اصلی پایبند بودیم: غذایی که با مواد خام تهیه شده بود، اما بدون سر و صدا. داستان مهاجرت خانواده من دیدگاه من را شکل داد قبل از اینکه تووالا را ایجاد کنم، به دنبال فرصت های تجاری بودم. من می دانستم که می خواهم یک کارآفرین باشم. فقط نمیدونستم کارم چی میشه خانواده من از ایران مهاجرت کردند و تقریباً همه آنها کارآفرین شدند، از جمله پدرم که املاک توسعه داد. خانواده من - مانند بسیاری از مهاجرانی"}, {"source": "Business Insider", "title": "The CEO of Affinity started doing Ironmans in his 40s. Here are 3 ways fitness ties into his career success.", "link": "https://www.businessinsider.com/affinity-ceo-triathlon-ironman-training-helps-career-2026-9", "summary": "Fine said his triathlon training routine helped him learn how to better strategize and deal with setbacks. Leah Fine Affinity CEO Ken Fine grew up running and only learned to swim in his 40s. He started completing triathlons in his 40s and partly attributes training to his career success. He said training taught him to better strategize and also deal with setbacks. For a triathlete with a rigorous training schedule, Ken Fine's introduction to fitness was a little more happenstance. \"I was the type of kid who would, instead of walking to school, run just because I wanted to,\" Fine, 58, told Business Insider. The CEO of Affinity, an AI-first private capital CRM , or customer management system, eventually went from challenging his friends to races to competing in track and field events throughout his youth, including his time in the Navy. He later discovered triathlons in his early 40s, when he first learned to swim in his community pool. Spending time with triathletes encouraged him to sign up for his first; he's now done about 40 triathlons of varying lengths, including 140.6-mile Ironman races . Fine balances his role as a CEO with daily training sessions. Ben Chrisman/Ben Chrisman When he first transitioned from running to triathlons (which involve running, biking, and swimming) in 2012, he was an investor. Because \"triathlons are longer, more complex and more challenging to execute well,\" he said, training strengthened his growth mindset . Over the years, he held CEO positions at Symphony Commerce, Heap, and, since 2024, Affinity. While training for Ironmans requires a lot of energy and planning that would presumably make it challenging to simultaneously lead a company, Fine sees a \"strong connection\" between his fitness routine and career success. \"The characteristics that are required and behaviors to be successful in the athletic portion of my life are very similar to the behaviors and skills you need to be successful as an executive,\" he said. Fine shared the three reasons he believes his fitness routine has helped his career. A boon for his brain — and overall health Fine said regular exercise benefits all aspects of his life. Leah Fine Cardiovascular workouts like running , biking, and swimming are linked to increased focus, improved mood, better sleep, lower stress, and reduced chances of cognitive decline as you age — all of which can boost work performance. Plenty of successful business leaders also boast intensive exercise routines, from hours-", "date_str": "2026-09-28T10:38:01+00:00", "hash": "409577a1677283c2", "title_fa": "مدیرعامل Affinity در 40 سالگی فعالیت Ironmans را آغاز کرد. در اینجا 3 روشی که تناسب اندام با موفقیت شغلی او ارتباط دارد آورده شده است.", "summary_fa": "یک مراسم صبحگاهی ساده و ثابت بسازید که از انرژی، ریکاوری و بازی طولانی پشتیبانی می کند."}, {"source": "Business Insider", "title": "The 25 billionaires and millionaires who have already spent roughly $850 million ahead of the midterms", "link": "https://www.businessinsider.com/billionaire-donors-midterm-elections-2026-9", "summary": "Olivier Hoslet/Getty; Bloomberg/Getty; Getty Images; Tyler Le/BI The biggest donors have already given roughly $850 million ahead of November's midterm elections. Financier George Soros and his family have given more than $103 million. Other big donors include Elon Musk, Jeff Yass, Miriam Adelson, and more. Billionaires and millionaires are spending big money ahead of November's midterm elections. A Business Insider review of federal campaign data found that roughly $849 million has already been donated, including by some of the world's wealthiest individuals, such as SpaceX CEO Elon Musk , Walmart heir Jim Walton, and Wall Street financier Jeff Yass. Here are some of the biggest names. George, Alex, and Jonathan Soros: $103.3 million George Soros is seen during an event in 2022 Jason Alden/Bloomberg via Getty Images For decades, financier George Soros has been one of the biggest megadonors in US politics. If you take into account his donations, those of his sons Alex and Jonathan, and organizations aligned with the Soros family, they are the biggest donors ahead of the midterms at over $103.3 million thus far. Geosor, which Soros owns, has donated $62 million to Democracy PAC, an allied super PAC that Soros uses as a clearinghouse for donations. The Fund for Democracy, another Soros-aligned group, kicked in another $50 million to Democracy PAC. Directly, George Soros has donated just under $1 million thus far to the Democratic Senatorial Campaign Committee and the Democratic Congressional Campaign Committee, the Democratic Party's two main national arms for congressional races. Alex Soros, who took over leadership of Soros' Open Society Foundation in 2023, has directly given roughly $125,000 so far, the biggest recipient of which is a joint fundraising committee led by Sen. Raphael Warnock, a Democrat from Georgia. Jonathan Soros has directly given over $325,000 thus far, with the largest recipients being the Alaska and Iowa state Democratic Parties. George Soros is worth an estimated $9.7 billion, per Bloomberg. Jeff Yass: $95.3 million Billionaire Jeff Yass cofounded Susquehanna International Group. Illustration by Thomas Fuller/SOPA Images/LightRocket via Getty Images Wall Street veteran Jeff Yass, who has described himself as a libertarian, has donated roughly $92.6 million. Yass' largest recipient is V-PAC: Victors, Not Victims, a super PAC backing Vivek Ramaswamy's run for Ohio governor, to which he has given $20 million. Yass is also a big supporte", "date_str": "2026-09-28T10:00:01+00:00", "hash": "f8adabd7f12a69d2", "title_fa": "25 میلیاردر و میلیونر که در حال حاضر حدود 850 میلیون دلار قبل از انتخابات میان دوره ای هزینه کرده اند.", "summary_fa": "اولیویه هاسلت/گتی؛ بلومبرگ/گتی؛ گتی ایماژ; Tyler Le/BI بزرگترین اهداکنندگان در حال حاضر حدود 850 میلیون دلار پیش از انتخابات میان دوره ای نوامبر اهدا کرده اند. جورج سوروس سرمایه دار و خانواده اش بیش از 103 میلیون دلار کمک کرده اند. سایر اهداکنندگان بزرگ شامل الون ماسک، جف یاس، میریام ادلسون و غیره هستند. میلیاردرها و میلیونرها در آستانه انتخابات میان دوره ای نوامبر پول های کلانی خرج می کنند. یک بررسی Business Insider از داده‌های کمپین فدرال نشان داد که تقریباً 849 میلیون دلار قبلاً اهدا شده است، از جمله توسط برخی از ثروتمندترین افراد جهان مانند ایلان ماسک، مدیرعامل اسپیس ایکس، جیم والتون، وارث والمارت، و جف یاس، سرمایه‌دار وال استریت. در اینجا تعدادی از بزرگترین نام ها آورده شده است. جورج، الکس و جاناتان سوروس: 103.3 میلیون دلار جورج سوروس در جریان رویدادی در سال 2022 جیسون آلدن/بلومبرگ از طریق گتی ایماژ دیده می‌شود. اگر کمک‌های او، پسرانش الکس و جاناتان، و سازمان‌های همسو با خانواده سوروس را در نظر بگیرید، آن‌ها با بیش از 103.3 میلیون دلار تا کنون، بزرگ‌ترین اهداکنندگان پیش از دوره میان‌دوره‌ای هستند. Geosor، که سوروس مالک آن است، 62 میلیون دلار به Democracy PAC، یک ابر PAC متحد که سوروس از آن به عنوان مرکز تهاتر برای کمک‌های مالی استفاده می‌کند، اهدا کرده است. صندوق برای دموکراسی، یکی دیگر از گروه های همسو با سوروس، 50 میلیون دلار دیگر به Democracy PAC کمک کرد. جورج سوروس مستقیماً کمتر از یک میلیون دلار تاکنون به کمیته مبارزات انتخاباتی سناتورهای دموکرات و کمیته مبارزات انتخاباتی کنگره دموکرات، دو سلاح اصلی ملی حزب دموکرات برای رقابت های کنگره کمک کرده است. الکس سوروس، که رهبری بنیاد جامعه باز سوروس را در سال 2023 بر عهده گرفت، تاکنون تقریباً 125000 دلار به طور مستقیم اهدا کرده است که بزرگترین دریافت کننده آن یک کمیته مشترک جمع"}, {"source": "Business Insider", "title": "The hidden sacrifices of chasing an H-1B career in America", "link": "https://www.businessinsider.com/h-1b-visa-hidden-sacrifices-career-costs-american-dream-2026-9", "summary": "H-1B visa holders and hopefuls told us about the career, financial, and family costs they encountered while pursuing this visa route. Rob Dobi for BI In the five years Madhur Mehta has spent in the US, he's earned a master's degree, landed a program manager job at Amazon, and been selected for an H-1B visa . But at 35, Mehta still doesn't feel able to plan his life very far ahead. He and his fiancée explored buying a house last year, but couldn't bring themselves to commit. They're both from India, and she has one remaining attempt at the H-1B lottery cycle before her work authorization expires. \"It's hard, you know, obviously you can't plan,\" Mehta told Business Insider, adding, \"unless we are both very clear on what our visa status is.\" Madhur Mehta said he feels like he s been in a race since he moved to the US. Chona Kasinger for BI His experience captures a contradiction facing many highly skilled foreign workers in America: The visa that allows them to build a career in the US can also make it difficult to know how firmly to establish a life here. The H-1B program has come under the spotlight over the past year, as the Trump administration has moved to clamp down on legal immigration, including with a contested $100,000 fee for certain H-1B petitions. The fee was tied up in court, adding layers of unpredictability to a system that can already make long-term planning difficult. As part of our H-1B Fallout series, marking a year of heightened uncertainty hanging over this visa program, Business Insider spoke to more than 20 people who moved to America and either received an H-1B visa or attempted to pursue this route. The first story in the series dug into the question of where foreign talent is going , if not to the US. In this installment, we examine the theme of costs, asking visa holders and hopefuls about the financial, career, and personal sacrifices they have made as they've navigated a visa pathway that comes with an expiration date and no guarantees. A spokesperson for the White House said in a statement that the Trump administration's agenda is designed to prioritize American workers. A USCIS spokesperson said the agency's goal is to make sure employment-based visa programs are used to \"supplement, not supplant American workers.\" A State Department spokesperson said the proposed H-1B visa fees are designed to address \"abuse of the program\" and to protect American interests. Shreya Mishra Reddy, now 34, came to the US from India for her master", "date_str": "2026-09-28T09:56:46+00:00", "hash": "c457a0619130cddd", "title_fa": "فداکاری های پنهان تعقیب شغل H-1B در آمریکا", "summary_fa": "دارندگان و امیدواران ویزای H-1B در مورد هزینه های شغلی، مالی و خانوادگی که هنگام پیگیری این مسیر روادید با آن مواجه شده اند به ما گفتند. راب دوبی برای BI در پنج سالی که مدهور مهتا در ایالات متحده گذرانده است، مدرک کارشناسی ارشد گرفت، به عنوان مدیر برنامه در آمازون مشغول به کار شد و برای ویزای H-1B انتخاب شد. اما مهتا در 35 سالگی هنوز احساس نمی کند که بتواند زندگی خود را خیلی دورتر برنامه ریزی کند. او و نامزدش سال گذشته به دنبال خرید خانه بودند، اما نتوانستند خود را متعهد کنند. آنها هر دو اهل هند هستند، و او قبل از پایان مجوز کارش، یک بار دیگر در چرخه قرعه کشی H-1B باقی مانده است. مهتا به بیزینس اینسایدر گفت: «سخت است، می‌دانی، بدیهی است که نمی‌توانی برنامه‌ریزی کنی، مگر اینکه هر دوی ما در مورد وضعیت ویزای خود کاملاً روشن باشیم.» مدهور مهتا گفت که از زمانی که به ایالات متحده نقل مکان کرده احساس می کند در یک مسابقه بوده است. Chona Kasinger برای BI تجربه او تضادی را به تصویر می‌کشد که بسیاری از کارگران بسیار ماهر خارجی در آمریکا با آن روبرو هستند: ویزا که به آنها اجازه می‌دهد در ایالات متحده شغلی ایجاد کنند، همچنین می‌تواند دانستن چگونگی استواری زندگی در اینجا را دشوار کند. برنامه H-1B در طول سال گذشته مورد توجه قرار گرفته است، زیرا دولت ترامپ در تلاش برای جلوگیری از مهاجرت قانونی، از جمله هزینه 100000 دلاری مورد بحث برای برخی از درخواست های H-1B است. این هزینه در دادگاه گره خورده و لایه‌هایی از غیرقابل پیش‌بینی بودن را به سیستم اضافه می‌کند که می‌تواند برنامه‌ریزی بلندمدت را دشوار کند. به عنوان بخشی از سری H-1B Fallout ما، به مناسبت یک سال عدم اطمینان بیشتر در مورد این برنامه ویزا، Business Insider با بیش از"}, {"source": "Business Insider", "title": "3 overlooked ways higher bond yields could be felt by everyday Americans", "link": "https://www.businessinsider.com/how-higher-bond-yields-affect-electric-bills-apartment-rents-taxes-2026-9", "summary": "Aaron Schwartz / AFP via Getty Images Mortgage rates are just the appetizer. Higher bond yields could also push up power bills, rents, and taxes. The bond market is a quiet tax on the future. Eventually, someone has to pick up that tab. Sign up for First Trade , Business Insider's daily markets newsletter. On average, the public's awareness of markets begins and ends with stocks. Something really notable has to happen for bonds to enter the conversation. We appear to have finally reached that point. The fact that soaring bond yields have hit the market mainstream shows just how critical the situation is. Investors and market-watchers know the drill at this point. Higher oil prices have revived inflation fears, pushing yields higher. But traders are also grappling with breakneck AI spending — and the growing pile of debt needed to finance it — along with the US government's yawning budget deficits. And that pressure could intensify if the Fed raises rates at least once more this year, as currently expected . People know the broad strokes of what to expect from higher yields : pricier mortgages, car loans, and credit-card debt. The average 30-year fixed mortgage rate has already climbed back above 7% for the first time since early 2025. But the bond market's reach extends well beyond anyone actively applying for a loan. Higher yields raise the cost of financing all of the capital-heavy things people rely on daily. It's not just more expensive to borrow — it's more expensive to make the world run. Here are three not-so-obvious areas where higher bond yields could be felt by everyday Americans: 1. Electric bills Wait a second, isn't the AI data-center buildout supposed to be the bogeyman hiking utility bills? You're telling me there's another force pushing them higher? Unfortunately, yes. While rising electricity demand is a direct driver, so are higher bond yields. After all, utilities need immense upfront capital to build new plants, upgrade their grids, and run the transmission lines data centers need in the first place. Because utilities can generally recover those financing costs through rates approved by regulators, pricier borrowing can eventually find its way onto customers' bills. This doesn't mean a rising 10-year yield will instantly appear on next month's statement. But higher-for-longer yields are adding to upward pressure on electricity prices at a time when they're already under scrutiny. 2. Apartment rents This isn't as simple as \"landlord's mo", "date_str": "2026-09-28T09:50:02+00:00", "hash": "f402fba957ca9f7e", "title_fa": "3 روش نادیده گرفته شده بازده بالاتر اوراق قرضه توسط آمریکایی های روزمره", "summary_fa": "آرون شوارتز / خبرگزاری فرانسه از طریق Getty Images نرخ وام مسکن فقط پیش غذا است. بازده اوراق قرضه بالاتر همچنین می تواند قبوض برق، اجاره و مالیات را افزایش دهد. بازار اوراق قرضه مالیاتی آرام بر آینده است. در نهایت، کسی باید آن برگه را بردارد. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. به طور متوسط، آگاهی عمومی از بازارها با سهام شروع می شود و به پایان می رسد. واقعاً باید چیز قابل توجهی اتفاق بیفتد تا باندها وارد گفتگو شوند. به نظر می رسد بالاخره به آن نقطه رسیده ایم. این واقعیت که افزایش بازده اوراق قرضه به جریان اصلی بازار رسیده است نشان می دهد که وضعیت چقدر بحرانی است. سرمایه‌گذاران و ناظران بازار در این مرحله از این کار آگاه هستند. افزایش قیمت نفت ترس از تورم را احیا کرده و بازدهی را بالاتر برده است. اما تاجران همچنین با مخارج سرسام آور هوش مصنوعی – و توده رو به رشد بدهی مورد نیاز برای تامین مالی آن – همراه با کسری بودجه دولت ایالات متحده دست و پنجه نرم می کنند. و این فشار می تواند تشدید شود اگر فدرال رزرو حداقل یک بار دیگر در سال جاری، همانطور که در حال حاضر انتظار می رود، نرخ بهره را افزایش دهد. مردم می دانند که چه چیزی از بازدهی بالاتر انتظار دارند: وام مسکن گرانتر، وام خودرو، و بدهی کارت اعتباری. میانگین نرخ وام مسکن ثابت 30 ساله برای اولین بار از اوایل سال 2025 به بالای 7 درصد رسیده است. اما دامنه بازار اوراق قرضه فراتر از هر کسی است که فعالانه برای وام درخواست می کند. بازدهی بالاتر، هزینه تامین مالی همه چیزهایی را که مردم روزانه به آنها تکیه می کنند، افزایش می دهد. وام گرفتن نه تنها گران‌تر است، بلکه اداره کردن جهان گران‌تر است. در"}, {"source": "Business Insider", "title": "‘Below Deck’ Captain Kerry says watching himself on TV made him a better boss", "link": "https://www.businessinsider.com/below-deck-captain-kerry-titheradge-leadership-lessons-2026-9", "summary": "Captain Kerry Titheradge said watching himself on the Bravo reality show Below Deck has helped him become a better leader. Courtesy of Kerry Titheradge The Bravo show's cameras have given Captain Kerry Titheradge surprising insights into his leadership. That's helped make him a better boss, he said, particularly when it comes to managing his mostly Gen Z team. Titheradge, 50, said leaders should question what seems obvious before faulting younger workers for mistakes. Captain Kerry Titheradge has something few leaders ever get: game film of his own management style. As a cast member of the longtime Bravo show \" Below Deck ,\" cameras follow Titheradge and his mostly Gen Z crew through every mistake, conflict, and high-pressure moment aboard luxury yacht charters. Watching those interactions back, he told Business Insider, has made him a better leader, particularly when it comes to managing younger workers . When the show is being filmed, \"I don't know what's going on, other than my intuition and just being observant,\" said Titheradge, a native of Australia who now lives in Florida. \"If you're the employee or the employer, you only see your side.\" The cameras, however, capture what he misses. Titheradge doesn't see other scenes where crew members air their grievances about him until the show airs. \"It's quite good for me because I'm like, 'Man, I thought I read that situation really, really well.'\" Give them that 'attaboy' One of the first lessons Titheradge said he gleaned from watching himself on TV was that his facial expressions often undermined his words. He now takes a moment to compose himself before dishing out critical feedback . \"When I am pissed off, and I'm trying to be nice, my face is still pissed off,\" he said. \"So it doesn't matter that I'm speaking softly.\" Titheradge has also changed how often he weighs in on employees' performance. Instead of unloading a litany of criticisms in an annual review , he said he's learned that it's better to space out corrections. \"If I wait till the end of the year, how are they going to course correct?\" Titheradge said. He tries to be just as quick with praise. If a crew member does something well, he'll say so right away rather than wait until the end of the charter. \"Just do it at the moment,\" he said. \"Give them that 'attaboy,' and you'll see that'll help spur on their confidence.\" Earning respect Titheradge's approach to managing managers , the bosuns and chief stews on a yacht, has evolved, too. He said ", "date_str": "2026-09-28T09:50:01+00:00", "hash": "5efcc5fa7799cd6f", "title_fa": "کاپیتان کری «زیر عرشه» می‌گوید تماشای خودش در تلویزیون او را رئیس بهتری کرده است", "summary_fa": "کاپیتان کری تیتریج گفت که تماشای خود در نمایش واقعیت Bravo در زیر عرشه به او کمک کرده تا رهبر بهتری شود. با حسن نیت از کری تیتریج دوربین های نمایش براوو به کاپیتان کری تیتریج بینش شگفت انگیزی در مورد رهبری او داده است. او گفت که این به او کمک کرد تا رئیس بهتری شود، به ویژه وقتی صحبت از مدیریت تیم عمدتاً Gen Z او می شود. تیتراج 50 ساله گفت که رهبران قبل از اینکه کارگران جوان را به خاطر اشتباهاتشان مقصر بدانند باید آنچه را که بدیهی به نظر می رسد زیر سوال ببرند. کاپیتان کری تیتریج چیزی را دارد که رهبران کمی به آن دست یافته اند: فیلم بازی با سبک مدیریتی خودش. به عنوان یکی از بازیگران نمایش طولانی مدت براوو \"زیر عرشه\"، دوربین ها تیتریج و خدمه عمدتا ژنرال Z او را در هر اشتباه، درگیری و لحظه فشار بالا در اجاره قایق های تفریحی لوکس دنبال می کنند. او به Business Insider گفت که تماشای این تعاملات از او به رهبر بهتری تبدیل شده است، به ویژه در مورد مدیریت کارگران جوانتر. تیتریج، اهل استرالیا که اکنون در فلوریدا زندگی می‌کند، گفت: وقتی سریال در حال فیلم‌برداری است، \"من نمی‌دانم چه اتفاقی می‌افتد، به جز شهودم و فقط مراقب هستم.\" \"اگر کارمند یا کارفرما باشید، فقط طرف خود را می بینید.\" دوربین ها اما آنچه را که او از دست می دهد ثبت می کنند. Titheradge صحنه های دیگری را نمی بیند که در آن اعضای خدمه نارضایتی خود را از او ابراز می کنند تا زمانی که برنامه پخش شود. این برای من بسیار خوب است، زیرا من می‌گویم: «مرد، فکر می‌کردم آن موقعیت را واقعاً خیلی خوب خوانده‌ام.» به آن‌ها این «آتابوی» را بدهید. او اکنون قبل از ارائه بازخوردهای انتقادی، لحظه ای را صرف می کند تا خود"}, {"source": "Business Insider", "title": "The CEO of language-learning startup Preply asks job candidates these questions", "link": "https://www.businessinsider.com/preply-ceo-shares-interview-questions-strategy-2026-9", "summary": "Preply CEO Kirill Bigai said this quarter, he is spending 50% to 60% of his time on hiring. Preply Kirill Bigai, CEO of language-learning startup Preply, said he currently spends 50% to 60% of his time hiring. He said he asks a range of questions, including why a candidate is leaving their current job. Bigai said the startup looks to hire around three categories: ambition, boldness, and collaboration. As CEO of language-learning startup Preply , Kirill Bigai said he's spending much of his time these days building out his team. \"This quarter, I'm spending 50% to 60% of my time on hiring,\" Bigai told Business Insider. Bigai, who cofounded the company in 2012, said Preply is scaling quickly and bringing on new leaders. The startup, which has more than 800 employees and was valued at $1.2 billion in January, lists 118 open roles on its website. That includes senior engineering positions focused on building architectures and agents, as well as AI research jobs. The CEO said that, for him, hiring is a constant part of leadership, and he said he's spent a lot of time refining his interview process. Bigai said he has a number of questions he typically asks that help him build a fuller picture of a candidate. \"I have my playbook,\" Bigai said. Running away — or running toward something? The CEO said he first wants to understand why someone is leaving their current role, what they hope to find next, and why. Bigai said that job seekers tend to have a prepared answer about why they're leaving, so that question typically reveals very little. However, after a few follow-ups, he can get a much clearer sense of who the person is. \"Do they own the decision, or do they blame the manager, the company, the market?\" Bigai added in a follow-up email. \"Are they running away from something or toward something?\" Bigai said Preply looks to hire people who talk about their ambition and what they want to prove, rather than what went wrong. He said if they're looking for something that Preply can't offer, it's best that both parties find out in the interview rather than later. Bigai said he also asks about the candidate's relationship with their previous manager, how they worked together, and what that manager would identify as the candidate's strengths. Depending on the role he's hiring for, Bigai said he then goes through behavioral interview questions. He said he typically looks for candidates to respond using a STAR framework , in which they lay out a situation, task, action, and ", "date_str": "2026-09-28T09:45:01+00:00", "hash": "44b374db496e9b9b", "title_fa": "مدیر عامل استارتاپ آموزش زبان Preply این سوالات را از داوطلبان شغل می پرسد", "summary_fa": "کریل بیگی، مدیرعامل Preply در این سه ماهه گفت، او 50 تا 60 درصد از زمان خود را صرف استخدام می کند. Preply Kirill Bigai، مدیرعامل استارت‌آپ یادگیری زبان Preply، گفت که در حال حاضر 50 تا 60 درصد از وقت خود را صرف استخدام می‌کند. او گفت که طیف وسیعی از سوالات را می پرسد، از جمله اینکه چرا یک نامزد شغل فعلی خود را ترک می کند. Bigai گفت که این استارتاپ به نظر می رسد در سه دسته استخدام کند: جاه طلبی، جسارت و همکاری. کریل بیگی به عنوان مدیرعامل استارت‌آپ یادگیری زبان Preply گفت که این روزها بیشتر وقت خود را صرف ساختن تیمش می‌کند. بیگی به Business Insider گفت: «این سه ماهه، 50 تا 60 درصد از وقتم را صرف استخدام می‌کنم. Bigai، که شرکت را در سال 2012 تأسیس کرد، گفت که Preply به سرعت در حال گسترش است و رهبران جدیدی را به ارمغان می آورد. این استارت آپ که بیش از 800 کارمند دارد و در ژانویه 1.2 میلیارد دلار ارزش داشت، 118 نقش باز را در وب سایت خود فهرست کرده است. این شامل موقعیت‌های مهندسی ارشد متمرکز بر معماری و عوامل ساختمان و همچنین مشاغل تحقیقاتی هوش مصنوعی می‌شود. مدیرعامل گفت که برای او استخدام بخشی ثابت رهبری است و او گفت که زمان زیادی را صرف اصلاح فرآیند مصاحبه خود کرده است. بیگی گفت که تعدادی سوال دارد که معمولاً می پرسد که به او کمک می کند تصویر کامل تری از یک نامزد بسازد. بیگایی گفت: «من کتاب بازی ام را دارم. فرار - یا دویدن به سمت چیزی؟ مدیرعامل گفت که او ابتدا می‌خواهد بفهمد که چرا کسی نقش فعلی خود را ترک می‌کند، امیدوار است در آینده چه چیزی پیدا کند و چرا. بیگی گفت که جویندگان کار تمایل دارند که پاسخی آماده در مورد دلیل"}, {"source": "Business Insider", "title": "Morgan Stanley shares 12 AI bottleneck stocks with at least 40% upside as Big Tech capex continues to boom", "link": "https://www.businessinsider.com/ai-stock-picks-to-buy-data-center-bottleneck-high-upside-2026-9", "summary": "Brandon Bell/Getty Images Morgan Stanley says the hot AI infrastructure trade still has legs. Limited power supply and labor constraints is creating a bottleneck in the trade, MS says. The bank shared a list of stocks exposed to the trade, including NextEra and GE Vernova. The AI picks and shovels trade is still hot, Morgan Stanley says. While it's a good time to start buying AI adopters and software stocks to prepare for the next wave of AI gains, the bank told clients in a September 24 note to stick with stocks at the heart of the data center energy bottleneck as well. \"We believe demand for compute is likely to significantly exceed supply for years to come,\" a team of analysts led by Stephen Byrd wrote in a note. Morgan Stanley sees a few factors slowing the buildout, including limited power supply, a tight supply of laborers able to construct data centers, and regulatory barriers. Historically, during technology development cycles, the infrastructure trade starts to underperform once the focus shifts to companies benefiting from its adoption. But constraints around the buildout and the ongoing strength in demand will continue to propel the trade this time around, the bank said. \"We don't expect the same linear handoff in market leadership seen in prior computing cycles. Instead, we are calling for a 'barbell' of outperformance over the next 6-12 months\" between adopters and the AI picks and shovels, the bank said. To ride the upside, Morgan Stanley listed out the AI power bottleneck stocks that its analysts rate \"Overweight,\" similar to \"Buy.\" We've listed below the 12 US stocks on the list that have at least 40% upside to their Morgan Stanley price targets. NextEra Energy BI Ticker: NEE Industry: Renewable Energy Developers / IPPs Price target: $111.00 Upside to price target: 40.0% GE Vernova BI Ticker: GEV Industry: Off-Grid Power Generation Price target: $1,350.00 Upside to price target: 42.1% Cummins BI Ticker: CMI Industry: Energy Storage Price target: $761.00 Upside to price target: 44.6% Williams Companies BI Ticker: WMB Industry: Midstream Energy Price target: $103.00 Upside to price target: 45.1% Liberty Energy BI Ticker: LBRT Industry: Off-Grid Power Generation Price target: $30.00 Upside to price target: 66.3% Riot Platforms BI Ticker: RIOT Industry: Powered Shell Providers (PSPs) Price target: $43.00 Upside to price target: 72.5% Erock BI Ticker: EROC Industry: Off-Grid Power Generation Price target: $23.00 Upside to price target: 79.3% Cle", "date_str": "2026-09-28T09:30:01+00:00", "hash": "0d258f11534ca24b", "title_fa": "مورگان استنلی 12 سهام تنگنای هوش مصنوعی را با حداقل 40 درصد افزایش به اشتراک می گذارد، زیرا سرمایه فناوری بزرگ همچنان به رونق خود ادامه می دهد.", "summary_fa": "براندون بل/ گتی ایماژ مورگان استنلی می‌گوید تجارت زیرساخت‌های هوش مصنوعی همچنان پابرجاست. MS می‌گوید محدودیت‌های عرضه برق و نیروی کار باعث ایجاد گلوگاه در تجارت می‌شود. این بانک فهرستی از سهام در معرض معامله را به اشتراک گذاشت، از جمله NextEra و GE Vernova. مورگان استنلی می‌گوید تجارت بیل و بیل‌های هوش مصنوعی همچنان داغ است. در حالی که زمان خوبی برای شروع خرید پذیرندگان هوش مصنوعی و سهام نرم افزار برای آماده شدن برای موج بعدی افزایش هوش مصنوعی است، بانک در یادداشتی در 24 سپتامبر به مشتریان خود گفت که در قلب گلوگاه انرژی مرکز داده نیز سهام را حفظ کنند. تیمی از تحلیلگران به رهبری استفان برد در یادداشتی نوشت: «ما معتقدیم تقاضا برای محاسبات احتمالاً در سال‌های آینده به میزان قابل توجهی از عرضه فراتر خواهد رفت». مورگان استنلی چند عامل را کاهش می‌دهد، از جمله منبع تغذیه محدود، تعداد کم کارگرانی که قادر به ساخت مراکز داده هستند و موانع نظارتی. از لحاظ تاریخی، در طول چرخه‌های توسعه فناوری، زمانی که تمرکز به سمت شرکت‌هایی که از پذیرش آن سود می‌برند تغییر می‌کند، تجارت زیرساخت شروع به عملکرد ضعیف می‌کند. این بانک گفت، اما محدودیت‌ها در حول و حوش افزایش و افزایش تقاضا همچنان به پیشبرد تجارت این بار ادامه خواهد داد. بانک گفت: \"ما انتظار نداریم که در چرخه‌های محاسباتی قبلی شاهد انتقال خطی یکسانی در رهبری بازار باشیم. در عوض، ما خواستار یک \"هالتر\" عملکرد بهتر طی 6 تا 12 ماه آینده\" بین پذیرندگان و بیل‌ها و بیل‌های هوش مصنوعی هستیم. مورگان استنلی برای افزایش این وضعیت، سهام تنگنای قدرت هوش مصنوعی را فهرست کرد که تحلیلگرانش به آن‌ها «اضافه وزن» را مشابه «خرید» ارزیابی می‌کنند. ما در زیر 12 سهم ایالات متحده در این فهرست را فهرست کرده ایم که حداقل 40 درصد نسبت به اهداف قیمتی مورگان استنلی صعودی دارند."}, {"source": "Business Insider", "title": "Raising 4 kids is wearing me down. I'm looking forward to connecting with them as adults.", "link": "https://www.businessinsider.com/love-kids-dont-love-parenting-hot-take-2026-9", "summary": "The author (not pictured) said that having four kids within five years took a toll on her. Now she s focusing on the future and raising her kids to be people she would want to be friends with. NataliaDeriabina/Getty Images I had four kids in under five years, and that took a toll on me. If I'm being honest, I've realized that loving your kids doesn't necessarily mean loving parenthood. Instead, I've found peace by focusing on the future and who my kids will become. I had four kids before I realized parenting wasn't for me . I'm kidding, of course, but there is some truth to that sentiment, too. During my teens, I was the go-to babysitter for my tight-knit Midwestern neighborhood, and I loved every minute of it. But no matter how much you love kids, even your own, nothing can prepare you for full-time parenthood . I wasn't set up for success I wasn't exactly set up for parenting success. My mother was a stay-at-home mom who believed marrying and having babies should come sooner rather than later. She married at 21 and started her family a year later. She had no idea that the human brain may not be fully developed until one reaches their early 30s, but even if she had, it probably wouldn't have changed her choices or opinions. The author said she is looking forward to connecting with her four kids as adults. Courtesy of Liz Dupont. I followed her lead at first. I got married at 23, gave birth to my first child that same year, then had three more kids — each about 18 months apart . Because of this spacing, I spent five solid years either pregnant, breastfeeding, or both at once. My husband at the time saw his primary role as providing for our family, while most childcare and housekeeping fell to me. I was buried in 24/7 mess-cleaning, meal-planning, budget-keeping, fight-defusing, and potty training. My disillusionment deepened as time passed. I was existentially tired, my nerves raw. I loved my children deeply, but I absolutely hated the role of a mother. The days were long, and my fuse was short Memories of my kids' early years are now interwoven with grief . During the years I should have been figuring out my own ambitions, I was instead wrangling four toddlers, while navigating a marriage in which I didn't feel like an equal. Do you have a hot take on a common parenting belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. When my babies were little, elderly women often approached me in public to f", "date_str": "2026-09-28T09:19:01+00:00", "hash": "0cd071becb21328d", "title_fa": "بزرگ کردن 4 بچه من را خسته می کند. من مشتاقانه منتظر ارتباط با آنها در بزرگسالی هستم.", "summary_fa": "نویسنده (در تصویر نیست) گفت که داشتن چهار فرزند در عرض پنج سال به او آسیب وارد کرد. اکنون او روی آینده تمرکز می کند و فرزندانش را به گونه ای تربیت می کند که دوست دارد با آنها دوست شود. NataliaDeriabina/Getty Images من در کمتر از 5 سال چهار فرزند داشتم و این برایم ضرر کرد. اگر صادق باشم، متوجه شده ام که دوست داشتن فرزندانتان لزوماً به معنای دوست داشتن پدر و مادر نیست. در عوض، با تمرکز بر آینده و اینکه فرزندانم چه کسانی خواهند شد، آرامش پیدا کرده ام. قبل از اینکه بفهمم پدر و مادر شدن برای من نیست، چهار بچه داشتم. من شوخی می کنم، البته، اما حقیقتی نیز در این احساس وجود دارد. در دوران نوجوانی، من پرستار بچه محله تنگ میدوسترن خود بودم و هر دقیقه آن را دوست داشتم. اما مهم نیست که چقدر بچه‌ها را دوست دارید، حتی خودتان، هیچ چیز نمی‌تواند شما را برای پدر و مادر شدن تمام وقت آماده کند. من برای موفقیت آماده نشده بودم، دقیقاً برای موفقیت والدین آماده نشده بودم. مادرم یک مادر خانه نشین بود که معتقد بود ازدواج و بچه دار شدن باید زودتر از این اتفاق بیفتد. او در 21 سالگی ازدواج کرد و یک سال بعد خانواده خود را تشکیل داد. او نمی‌دانست که مغز انسان ممکن است تا اوایل 30 سالگی به طور کامل رشد نکرده باشد، اما حتی اگر هم داشت، احتمالاً انتخاب‌ها یا نظرات او را تغییر نمی‌داد. نویسنده گفت که مشتاقانه منتظر است تا با چهار فرزندش در بزرگسالی ارتباط برقرار کند. با حسن نیت از لیز دوپون. من در ابتدا از او پیروی کردم. من در 23 سالگی ازدواج کردم، اولین فرزندم را در همان سال به دنیا آوردم، سپس سه فرزند دیگر به دنیا آوردم - هر کدام به فاصله 18 ماه. به دلیل"}, {"source": "Business Insider", "title": "I thought my team at Block had gotten too big, then I was laid off. My job search took months to turn around.", "link": "https://www.businessinsider.com/block-layoff-overhiring-job-search-fintech-relocation-remote-job-2026-9", "summary": "Sneh Hira spent months looking for a job after being laid off from Block. Sneh Hira Sneh Hira saw her team at Block expand during the four years she worked there as an operations manager. In February 2026, she was laid off, which she attributed partially to overhiring. While her job search was difficult, she said people's willingness to help restored her faith in humanity. This as-told-to essay is based on a conversation with Sneh Hira, who joined Block's Afterpay business in 2022 and was laid off in February. She's in her early 40s and lives in Chicago. The following has been edited for length and clarity. I joined Block's Afterpay business in 2022 as an operations manager. When I went on maternity leave in May 2023, I was the only operations manager on my team. Over the course of the next several years, I noticed we were hiring more operations managers than the workload seemed to warrant. All the work that I'd been doing as one human was split across multiple people. Then one day in February of this year, I checked my email and learned I'd been laid off. I remember wondering if it was a joke, and everything that followed was a blur. I later learned that many other employees had been affected . Looking back, I thought the overhiring at Block and its efforts to integrate its different businesses may also have contributed to the layoffs. Once the initial shock wore off, I knew I needed to figure out what came next. My job search was difficult The following week, I made some minor tweaks to my résumé and started applying. Even with about 20 years of professional experience, though, I wasn't getting anywhere. I was applying to so many jobs that I couldn't even remember what I'd applied for the day before, so I eventually created a spreadsheet to track my applications, rejections, and interviews. I got a few interviews early on, but I felt like I shot myself in the foot with two opportunities. Both would have required me to relocate — one to California and the other to New York. At the time, I wasn't ready to commit to moving, so I effectively took myself out of consideration. Afterward, my husband and I talked and decided we'd be willing to move for the right opportunity, even if it meant selling our house . I reached back out to one of the recruiters, but it was too late. Another opportunity came up that I viewed as a backup option if nothing else worked out because the pay wasn't ideal. I made it through several interviews but didn't receive an offer. I fou", "date_str": "2026-09-28T09:15:01+00:00", "hash": "0527c4f952d3c827", "title_fa": "فکر می‌کردم تیم من در بلاک خیلی بزرگ شده است، سپس اخراج شدم. جستجوی کار من ماه ها طول کشید تا تغییر کند.", "summary_fa": "سنه هیرا پس از اخراج شدن از بلوک ماه ها به دنبال کار بود. Sneh Hira Sneh Hira شاهد گسترش تیم خود در Block در طول چهار سالی بود که در آنجا به عنوان مدیر عملیات کار می کرد. در فوریه 2026، او از کار اخراج شد که تا حدی آن را به استخدام بیش از حد نسبت داد. در حالی که جستجوی شغل او دشوار بود، او گفت که تمایل مردم به کمک، ایمان او را به انسانیت بازگرداند. این مقاله گفته شده بر اساس گفتگو با اسنه هیرا است که در سال 2022 به کسب و کار Afterpay Block پیوست و در فوریه اخراج شد. او در اوایل 40 سالگی است و در شیکاگو زندگی می کند. موارد زیر برای طول و وضوح ویرایش شده است. من در سال 2022 به عنوان مدیر عملیات به کسب و کار Afterpay Block پیوستم. زمانی که در می 2023 به مرخصی زایمان رفتم، تنها مدیر عملیات تیمم بودم. در طول چندین سال بعد، متوجه شدم که ما مدیران عملیاتی بیشتری نسبت به حجم کاری که به نظر می‌رسید ضمانت می‌کرد، استخدام می‌کردیم. تمام کارهایی که من به عنوان یک انسان انجام می دادم بین چند نفر تقسیم شده بود. سپس یک روز در فوریه امسال، ایمیلم را چک کردم و متوجه شدم که از کار بیکار شده ام. یادم می‌آید فکر می‌کردم که آیا این یک شوخی بود یا نه، و همه چیزهایی که به دنبالش آمد یک تار بود. بعداً فهمیدم که بسیاری از کارمندان دیگر تحت تأثیر قرار گرفته اند. با نگاهی به گذشته، فکر کردم استخدام بیش از حد در Block و تلاش‌های آن برای ادغام مشاغل مختلف آن نیز ممکن است به اخراج‌ها کمک کرده باشد. هنگامی که شوک اولیه از بین رفت، می دانستم که باید بفهمم چه اتفاقی می افتد. جستجوی شغل من دشوار بود"}, {"source": "Business Insider", "title": "Noa Argamani is venturing out", "link": "https://www.businessinsider.com/why-noa-argamani-is-joining-israel-focused-fund-vine-ventures-2026-9", "summary": "Noa Argamani on a rooftop in New York. Sydney Krantz for BI A fter 246 days in Hamas captivity, Israeli special forces rescued Noa Argamani and carried her by helicopter to a hospital outside Tel Aviv. There, a doctor turned to her and said, \"Noa, we're really happy that you're here with us.\" Argamani was confused. \"The first thing I asked is, 'How do you know my name?'\" she recalls. \"I didn't realize the whole world knew who I was.\" At 25, Argamani had become one of the faces of the October 7, 2023, attack on Israel. On the morning of her kidnapping, she was a college student about to begin her third year studying artificial intelligence. She imagined becoming a software engineer . Maybe she would start a company someday. Argamani started a new role at Vine Ventures in September. Sydney Krantz for BI This month, she started a new job. Argamani has joined the venture capital firm Vine Ventures, which backs early-stage startups, especially in artificial intelligence, cybersecurity, and defense tech . She's working with Israeli founders and companies looking to grow their business in the United States. Her new role puts her contact list to work: Her ordeal thrust her onto a global stage, connecting her to world leaders and business titans alike. \"In this moment, if I want to learn and make an impact, VC is the right place for me,\" she says. \"I want to be surrounded by people who dream big.\" For Israeli founders , America is often the market that determines whether a promising startup becomes merely successful or truly enormous. Argamani sees herself as a potential bridge between the two countries — someone who can help Israeli founders turn their companies into global category leaders. \"My mission is to help Israeli startups go to market and really break this border,\" she says. If she succeeds, she could bring more of the world's best technology, networks, and business know-how back to her home country. Argamani at Vine Ventures s New York office. Sydney Krantz for BI On an early fall morning, Argamani, now 28, met me in the lobby of Vine's New York office, clutching an iced matcha. She is willowy, her long dark hair falling down her back. In a blue button-down, faded jeans, and mules, she could be any West Village twenty-something on her way to work. She speaks softly and deliberately, holding unbroken eye contact. She flew into town for this interview before heading to San Francisco for meetings. Argamani has spent much of the past two years being asked to", "date_str": "2026-09-28T08:30:01+00:00", "hash": "001325252d33e2c7", "title_fa": "نوآ آرگامانی در حال خروج است", "summary_fa": "نوآ آرگامانی روی پشت بامی در نیویورک. سیدنی کرانتز برای BI پس از 246 روز اسارت حماس، نیروهای ویژه اسرائیلی نوآ آرگامانی را نجات دادند و او را با هلیکوپتر به بیمارستانی در خارج از تل آویو منتقل کردند. در آنجا دکتری رو به او کرد و گفت: \"نوآ، ما واقعاً خوشحالیم که شما اینجا با ما هستید.\" ارگامانی گیج شده بود. او به یاد می آورد: \"اولین چیزی که پرسیدم این بود که \"از کجا نام من را می دانی؟\" \"من متوجه نشدم که تمام دنیا می دانند من کی هستم.\" ارگامانی در 25 سالگی به یکی از چهره های حمله 7 اکتبر 2023 به اسرائیل تبدیل شده بود. صبح روز ربوده شدنش، او دانشجوی کالج بود که در آستانه شروع سال سوم تحصیل در رشته هوش مصنوعی بود. او تصور می کرد که یک مهندس نرم افزار شود. شاید او روزی یک شرکت راه اندازی کند. ارگامانی نقش جدیدی را در Vine Ventures در سپتامبر آغاز کرد. سیدنی کرانتز برای BI این ماه، او کار جدیدی را آغاز کرد. ارگامانی به شرکت سرمایه‌گذاری خطرپذیر Vine Ventures پیوسته است که از استارت‌آپ‌های در مراحل اولیه، به ویژه در زمینه هوش مصنوعی، امنیت سایبری و فناوری دفاعی حمایت می‌کند. او با بنیان‌گذاران و شرکت‌های اسرائیلی کار می‌کند که به دنبال توسعه تجارت خود در ایالات متحده هستند. نقش جدید او فهرست تماس‌های او را به کار می‌اندازد: مصیبت‌های او او را به صحنه جهانی سوق داد و او را به رهبران جهان و غول‌های تجاری به طور یکسان متصل کرد. او می گوید: «در این لحظه، اگر بخواهم یاد بگیرم و تأثیر بگذارم، VC مکان مناسبی برای من است. \"من می خواهم توسط افرادی احاطه شوم که آرزوهای بزرگ دارند.\" برای بنیان‌گذاران اسرائیلی، آمریکا اغلب بازاری است که تعیین می‌کند یک استارت‌آپ امیدوارکننده صرفاً موفق شود یا واقعاً عظیم. آرگامانی"}, {"source": "Business Insider", "title": "Who actually wrote this? My strange, horrifying month fighting the AI slopocalypse", "link": "https://www.businessinsider.com/ai-detector-writing-experiment-what-i-learned-2026-9", "summary": "iStock; Getty Images; Tyler Le/BI Recently, I've found myself asking the same question over and over again: Did AI write this? If you spend any amount of time online, you probably have, too. Just a few short years since the advent of ChatGPT, the internet has devolved into a bot-generated wasteland. Experts warned us that the slopocalypse was coming, and it is here. The world isn't taking this lying down. Publishers are canceling book contracts. Op-eds by billionaires and professors and politicians are getting outed. The uproar has become so intense that companies are scrambling to respond. LinkedIn is encouraging users to flag suspicious posts . Substack is tagging suspected AI writing with a label. Google is building tools to help people check whether the images and videos they see were made with AI. Anthropic is now watermarking the text Claude generates. That has stirred up its own backlash, mounted by people who say these efforts to identify and root out AI authorship are antiquated, punitive, and defamatory. We're now all trying to figure out just how much of our writing we want to cede to AI. Maybe you think it should be used to write everything. Maybe you think it should be used to write absolutely nothing. Chances are, you're probably like me, drifting somewhere in between these two shores, uneasy with its ubiquity and also eager to get its help. Every single one of us has drawn and redrawn our own lines, clashing with everyone else's, making us incredibly mad in the process. To have any hope of reaching a shared norm, we need to answer a deeper question: Why does it matter so much to us in the first place whether something originated from a human mind or an AI ? We don't think twice about all kinds of things that were once made by people and are now made by machines — textiles, furniture, the box of chocolate chip cookies I couldn't resist buying at the store. So why is writing — or for that matter, drawing or composing music or creating videos — any different? Who cares, as long as it's good? I cared. Why else was I squinting at every suspicious passage I encountered, like a detective manically swabbing for the bot's fingerprints? So I turned to an AI detector. Study after study has shown that most people are actually bad at spotting machine-generated writing , and Pangram — the leading AI detection tool on the market — claims to be 99.7% accurate. By seeing clearly who or what wrote every single sentence I consumed for a few weeks, I thought I'", "date_str": "2026-09-28T08:11:01+00:00", "hash": "18c81a4e04c0cd35", "title_fa": "واقعا کی اینو نوشته؟ ماه عجیب و وحشتناک من در مبارزه با slopocalypse هوش مصنوعی", "summary_fa": "آی استوک؛ گتی ایماژ; Tyler Le/BI اخیراً متوجه شده ام که بارها و بارها همین سوال را می پرسم: آیا هوش مصنوعی این را نوشته است؟ اگر زمان زیادی را به صورت آنلاین سپری می کنید، احتمالاً این کار را نیز دارید. تنها چند سال از ظهور ChatGPT می گذرد، اینترنت به یک سرزمین بایر تولید شده توسط ربات ها تبدیل شده است. کارشناسان به ما هشدار دادند که slopocalypse در حال آمدن است و اینجاست. دنیا این را دراز کشیدن نمی پذیرد. ناشران قراردادهای کتاب را لغو می کنند. نظرات میلیاردرها و اساتید و سیاستمداران در حال پخش شدن است. این غوغا به حدی شدید شده است که شرکت ها در تلاش برای پاسخگویی هستند. لینکدین کاربران را تشویق می کند که پست های مشکوک را پرچم گذاری کنند. Substack نوشته های مشکوک به هوش مصنوعی را با یک برچسب برچسب گذاری می کند. گوگل در حال ساخت ابزارهایی است که به افراد کمک می کند بررسی کنند که آیا تصاویر و ویدیوهایی که می بینند با هوش مصنوعی ساخته شده اند یا خیر. Anthropic اکنون متنی را که کلود تولید می کند واترمارکینگ می کند. این موضوع واکنش‌های منفی خود را برانگیخته است، افرادی که می‌گویند این تلاش‌ها برای شناسایی و ریشه‌کن کردن نویسندگی هوش مصنوعی قدیمی، تنبیهی و افتراآمیز است. اکنون همه ما در تلاشیم تا بفهمیم که چقدر از نوشته هایمان را می خواهیم به هوش مصنوعی واگذار کنیم. شاید فکر می کنید باید از آن برای نوشتن همه چیز استفاده شود. شاید فکر می کنید که باید از آن برای نوشتن مطلقاً چیزی استفاده کرد. به احتمال زیاد، شما احتمالاً مانند من هستید که در جایی در بین این دو ساحل در حال حرکت هستید، از همه جا بودن آن ناراحت هستید و همچنین مشتاق دریافت کمک آن هستید. هر یک از ما خطوط خود"}, {"source": "Business Insider", "title": "I left my job as Five Below's top lawyer and started my own practice. I spend around 20 hours a week training AI.", "link": "https://www.businessinsider.com/lawyer-ai-training-left-corporate-micro1-revenue-private-practice-2026-9", "summary": "Ron Masciantonio said AI training has been intellectually fulfilling and made him a better lawyer. Ron Masciantonio Ron Masciantonio left the corporate world and started his own law practice. Masciantonio said AI training has been a fulfilling and useful additional revenue stream. He also said AI training has made him a better lawyer. This is an as-told-essay based on a conversation with Ron Masciantonio, who previously was executive vice president and general counsel at Five Below. He founded his own practice, Masciantonio Law, and does specialist AI training through the company Micro1. This story has been edited for length and clarity. I've been practicing law for over 25 years and was most recently the general counsel and executive vice president at Five Below , a retailer with about 2,000 stores nationwide. I left at the end of last year after about seven years. I was ready to do something different. After leaving, I started my own private practice, where I provide legal services to entertainers and small businesses, and I also manage recording artists who make pop and R B music. I was introduced to AI training after recruiters contacted me seeking people with legal expertise. When my practice started to hit the ground running a few months ago, and I was looking for more revenue opportunities, I decided to interview and sign up with Micro1. I've been doing this for about a couple of months and see it as a tremendous opportunity to augment my practice. It's also intellectually fulfilling. The work feels more academic, scientific, and creative. I come from corporate environments where we wake up every day looking at the stock price and the prior day's sales and reacting, and this is about making something that will endure and be improved over time. I'm teaching AI how lawyers make decisions Lately, I've spent between 20 and 30 hours a week training AI . It ebbs and flows depending on what's happening in the rest of my practice. I can see weeks when I'll go up to 40 hours and weeks when I'm doing 10 to 20 hours. A huge advantage of the work is that it's asynchronous. If you have a solo practice and you're operating on hourly or on single engagements, you're going to have gaps in your work. AI training is fantastic to fill those gaps. One morning, I might start working for a client, then shift to Micro1 work, and then shift back to more client work. For me, AI training is like a mentoring activity. It's just that the AI is the mentee. The tasks varied, but", "date_str": "2026-09-28T08:06:01+00:00", "hash": "5eec0cd458950949", "title_fa": "من شغلم را به عنوان وکیل برتر Five Below ترک کردم و کار خود را شروع کردم. من حدود 20 ساعت در هفته را صرف آموزش هوش مصنوعی می کنم.", "summary_fa": "رون ماسکانتونیو گفت آموزش هوش مصنوعی از نظر فکری کامل بوده و او را به وکیلی بهتر تبدیل کرده است. Ron Masciantonio ران Masciantonio دنیای شرکت ها را ترک کرد و وکالت خود را شروع کرد. Masciantonio گفت آموزش هوش مصنوعی یک جریان درآمد اضافی مفید و کامل بوده است. او همچنین گفت که آموزش هوش مصنوعی او را به وکیل بهتری تبدیل کرده است. این مقاله‌ای است که گفته می‌شود بر اساس گفتگو با ران ماسکیانتونیو، که قبلا معاون اجرایی و مشاور عمومی در Five Below بود. او دفتر خود را با نام Masciantonio Law تأسیس کرد و آموزش های تخصصی هوش مصنوعی را از طریق شرکت Micro1 انجام می دهد. این داستان برای طولانی بودن و وضوح ویرایش شده است. من بیش از 25 سال است که وکالت می‌کنم و اخیراً مشاور عمومی و معاون اجرایی در Five Below بودم، یک خرده‌فروش با حدود 2000 فروشگاه در سراسر کشور. اواخر سال گذشته بعد از حدود هفت سال رفتم. من آماده بودم تا کار متفاوتی انجام دهم. پس از ترک، دفتر خصوصی خودم را راه‌اندازی کردم، جایی که خدمات حقوقی به هنرمندان و مشاغل کوچک ارائه می‌دهم و همچنین ضبط هنرمندانی را که موسیقی پاپ و آر بی می‌سازند، مدیریت می‌کنم. بعد از اینکه استخدام کنندگان با من تماس گرفتند و به دنبال افرادی با تخصص حقوقی بودند، با آموزش هوش مصنوعی آشنا شدم. وقتی چند ماه پیش تمرین من شروع به کار کرد و به دنبال فرصت های درآمد بیشتری بودم، تصمیم گرفتم با Micro1 مصاحبه و ثبت نام کنم. من حدود دو ماه است که این کار را انجام می دهم و آن را فرصتی فوق العاده برای تقویت تمرین خود می بینم. از نظر فکری نیز رضایت بخش است. کار بیشتر آکادمیک، علمی و خلاقانه است. من از محیط‌های شرکتی می‌آیم که هر روز از خواب"}, {"source": "Business Insider", "title": "A Ukrainian commander tells us why troops attack in the day and roll out their war 'robots' at night", "link": "https://www.businessinsider.com/ukraine-commander-troops-attack-day-ground-drones-robots-night-mines-2026-9", "summary": "A soldier of NC13, a unit of Ukraine s Third Army Corps that specializes in the combat use of unmanned ground vehicles, uses a laptop connected to a ground drone. Thomas Peter/REUTERS A Ukrainian corps has been using ground and aerial drones for sapping missions on the front lines. One commander said visibility plays a key role in when these drones are deployed. His unit is also using bomber drones to disperse up to 40 anti-personnel mines per sortie. In northern Donetsk, Ukraine's Third Army Corps has been using a network of aerial and ground drones to deploy and clear minefields while attacking Russian lines. These missions are part of its recent high-profile offensive, Operation Vivaldi , which it's said has seized about 50 square miles around the city of Lyman so far. The corps has said that ground drones, capable of carrying heavy payloads and operating in more dangerous areas, are dramatically cutting the time for mine-laying. A single drone can deploy a minefield over 1,300 feet deep in two days, while a human crew would have taken two weeks. A commander of the corps' 96th Support Battalion, Maj. Serhii Tischenko, told Business Insider how the operation works, including how troops prefer to split sapper and attack operations by time of day. \"It is definitely better to mine at night, because the enemy cannot see our UGVs,\" said Tischenko, whose battalion supports the 125th Separate Heavy Mechanized Brigade and the 60th Mechanized Brigade. Ground drones, or uncrewed ground vehicles , are most commonly tracked or wheeled platforms, designed to carry up to 400 kg, or about 880 pounds. They're quiet on the battlefield, Tischenko said, so it's common for the Third Army Corps to clear mines at night, then launch assaults in the day. \"It is more practical to carry out assault operations during the day because the enemy uses a lot of FPV drones, and during daylight we can detect them more easily,\" he added. Ground drones play a critical role here, Tischenko said, because an assault soldier seeing one ahead of them provides clarity and confidence that the path is clear. \" rn in my side,\" Stallone said. \"But it just forced us to keep moving — higher, bigger guns, louder movies, more action, more bodies, everything — until I think we really carved out a niche that'll never quite come around again: that certain '80s over-the-top action genre that he and I sort of pioneered.\" Stallone said their relationship brought out a side of each of them that few others could, and that it was not rooted in hatred. \"I dream about him. It's like I'm on his mind. He's on my mind,\" Stallone said. \"It's very rare.\" They later worked together on \"The Expendables.\" Stallone said Schwarzenegger also invited him to a political event, which helped the two grow closer. \"At first I thought, come on, actors in politics? This is oil and water, because actors are very, very self-absorbed, and politicians, if they're really good, should be just the opposite, publicly absorbed,\" he said. \"But he was defin", "date_str": "2026-09-28T07:04:14+00:00", "hash": "748706bfd41e66a9", "title_fa": "سیلوستر استالونه می‌گوید راز برتری یک رقیب شغلی این است که شما را به جلو نگه می‌دارند", "summary_fa": "سیلوستر استالونه گفت رقابت شدید او با آرنولد شوارتزنگر به شکل گیری دوره ای از فیلم های اکشن کمک کرد. تاد اویونگ/NBC از طریق گتی ایماژ، سیلوستر استالونه گفت که بزرگترین رقیبش او را تحت فشار قرار داد تا به هدف گیری بالاتر ادامه دهد. ستاره «راکی» گفت که او و آرنولد شوارتزنگر به شیوه ای خلاقانه با یکدیگر دشمنی کردند. رقابت آنها به شکل گیری دوره ای از فیلم های اکشن بیش از حد کمک کرد. سیلوستر استالونه 80 ساله گفت رقابت او با آرنولد شوارتزنگر او را مجبور کرد که به بالا بردن سطح امتیاز ادامه دهد. در اپیزود روز شنبه «مصاحبه»، استالونه به رابطه رقابتی که سال‌ها با شوارتزنگر داشت، قبل از اینکه این دو با هم دوست شوند، منعکس کرد. استالونه و شوارتزنگر به ستارگان اکشن تعیین کننده دهه 1980 تبدیل شدند، و پیشروترین فرنچایزهای پرفروش بودند که به تعریف این دهه کمک کردند. ستاره \"راکی\" گفت که او به سرعت شوارتزنگر را به عنوان یک رقیب قدرتمند شناخت. استالونه گفت: «او یک چالش بود. استالونه گف
