      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;

      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;

      --read-bg: #f1f5f9;

      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;

    body {

    .container {

      text-align: center;

    }
    .header-actions {

      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;

      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;

      from { transform: scale(0.95); opacity: 0; }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;

    .btn-close:hover {
      color: var(--text);

    .modal-body {

      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;

      border: 1px solid var(--card-border);

      padding: 12px 16px;

      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

      header { padding: 18px 14px; padding-top: 56px; }

      .btn-action { font-size: 0.78rem; padding: 6px 9px; }

      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

ی در بحرین را محکوم کردند و ... اتحادیه عرب یک‌شنبه اول آذر ۱۴۰۵، در بیانیه‌ای اعلام کرد این حمله نقض حاکمیت بحرین و قوانین بین‌المللی است و می‌تواند به افزایش تنش‌ها در منطقه منجر شود. این اتحادیه با اعلام همبستگی با دولت و مردم بحرین، از اقدامات این کشور برای حفاظت از امنیت و تمامیت ارضی خود حمایت کرد و از جامعه بین‌المللی خواست با محکوم کردن حمله و تلاش برای توقف اقدامات تنش‌زا، مانع گسترش بحران و تهدید صلح منطقه‌ای شود. وزارت خارجه عربستان نیز حملات ایران به بحرین را به «شدیدترین لحن ممکن» محکوم کرد و در بیانیه‌ای در شبکه اجتماعی ایکس، بر همبستگی کامل ریاض با بحرین در اقدامات این کشور برای حفظ امنیت و ثبات تاکید کرد. این وزارتخانه همچنین تهران را به تضعیف امنیت و ثبات منطقه‌ای متهم کرد. وزارت خارجه امارات متحده عربی نیز حملات اخیر را نقض آشکار حاکمیت بحرین خواند و بر حمایت کامل خود از این کشور و تمامی اقدامات آن برای حفظ امنیت و ثبات تاکید کرد. قطر هم در بیانیه‌ای جداگانه، حمله ایران به یک تاسیسات صنعتی غیرنظامی در بحرین را محکوم کرد و مخالفت قاطع خود با حملات به تاسیسات اقتصادی، اماکن غیرنظامی و غیرنظامیان را اعلام کرد. وزارت خارجه قطر هشدار داد ادامه این حملات به تشدید خطرناک تنش‌ها منجر می‌شود و امنیت و ثبات منطقه را تهدید می‌کند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/image_RlPq__v1024x512__box_0%2C311%2C576%2C614.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱ آذر • ۱۸:۴۰"}, {"source": "Iran International", "title": "بارسلونا ۳-۲ ویارئال؛ کامبک بارسا در نیوکمپ پس از یک‌نیمه ناامیدکننده", "link": "https://www.iranintl.com/202611222810", "summary": "تیم فوتبال بارسلونا در هفته سیزدهم لالیگای اسپانیا، پس از دریافت دو گل در هفت دقیقه ابتدایی مقابل ویارئال، نتیجه را برگرداند و تا دقیقه ۹۲ با نتیجه ۳ بر ۲ از حریف پیش افتاده است.", "date_str": "2026-11-22T14:58:00+00:00", "hash": "a5e20c437ecf2cf6", "title_fa": "بارسلونا ۳ -%D8%A7%D9%81%D8%B2%D8%A7%DB%8C%D8%B4-%D8%B4%D9%85%D8%A7%D8%B1-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B4%D8%AA%D8%B4%D8%AF%DA%AF%D8%A7%D9%86-%D8%A7%DB%8C%D9%84%D8%A7%D9%85-%D8%A8%D9%87-%DB%B2%DB%B0%D9%86%D9%81%D8%B1/", "summary": "با بازداشت چهار شهروند کُرد دیگر در شهرستان دره‌شهر توسط نیروهای امنیتی، شمار بازداشت‌شدگان اخیر در استان ایلام به دست‌کم ۲۰ نفر افزایش ...", "date_str": "2026-11-22T14:37:49+00:00", "hash": "377395b2ed266c47", "title_fa": "بازداشت چهار شهروند کرد در دره‌شهر؛ افزایش شمار بازداشت‌شدگان ایلام به ۲۰نفر", "summary_fa": "با بازداشت چهار شهروند کُرد دیگر در شهرستان دره‌شهر توسط نیروهای امنیتی، شمار بازداشت‌شدگان اخیر در استان ایلام به دست‌کم ۲۰ نفر افزایش ... هویت چهار شهروند بازداشت شده، «عرفان اسماعیلی»، «امیر گراوند»، «علی والی» و «آرین ایمانی» در شهرستان دره‌شهر احراز شده است. در موج اخیر بازداشت‌ها در شهرهای آبدانان، مورموری، دره‌شهر و دهلران تاکنون دست‌کم ۲۰ نفر بازداشت و به مکان‌های نامعلوم منتقل شده‌اند. شب گذشته «علی حسینی»، از معترضان آبدانان بازداشت شد. این بازداشت‌ در پی اعتراض به جان‌باختن ۱۳ نفر از کارکنان پتروپالایش دهلران در حادثه واژگونی اتوبوس صورت گرفت. تا کنون شمار معترضان بازداشت‌شده که هویتشان احراز شده است، به ۱۴ نفر رسیده است. کُردپا خبر داد نیروهای امنیتی روز شنبه ۳۰ آبان ۱۴۰۵ به دامداری خانواده حسینی در آبدانان، محل کار این شهروند، یورش بردند و او را بدون ارائه حکم قضایی و با ضرب‌وشتم بازداشت کردند. «اسدالله چراغی»، نماینده دهلران، دره‌شهر و آبدانان در مجلس در گفت‌وگو با خبرگزاری «تسنیم»، وابسته به سپاه پاسداران، بازداشت شهروندان در جریان اعتراضات آبدانان را انکار کرد. «امرالله میسائی‌»، دادستان آبدانان، نیز به خبرگزاری «میزان»، وابسته به قوه قضاییه، گفت با افرادی که به گفته او «قصد بر هم زدن نظم عمومی و تحریک احساسات مردم را داشته باشند»، برخورد «قاطع» خواهد شد. بعدازظهر سه‌شنبه ۲۶ آبان ۱۴۰۵، صدها نفر در آبدانان در اعتراض به جان‌باختن ۱۳ کارگر در واژگونی اتوبوس کارکنان پتروپالایش دهلران تجمع کردند. معترضان با سردادن شعارهایی علیه مقام‌های حکومتی، به وضعیت جاده‌ها، کمبود زیرساخت‌ها در استان ایلام و سوء مدیریت اعتراض کردند. بخش بزرگی از بازار آبدانان نیز در همراهی با معترضان و خانواده‌های جان‌باختگان اعتصاب کرد. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/WhatsApp_Image_2026-11-22_at_9.26.29_AM_MWDf__v1024x512__box_0%2C52%2C1300%2C736.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱ آذر • ۱۸:۰۷"}, {"source": "Independent Persian", "title": "قمار پرمخاطرهٔ ایران در خلیج فارس؛ نفتکش‌ها در مسیر تقابل با نیروی دریایی آمریکا", "link": "https://www.independentpersian.com/node/423307/%D8%AF%DB%8C%D8%AF%DA%AF%D8%A7%D9%87/%D9%82%D9%85%D8%A7%D8%B1-%D9%BE%D8%B1%D9%85%D8%AE%D8%A7%D8%B7%D8%B1%D9%87%D9%94-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%AF%D8%B1-%D8%AE%D9%84%DB%8C%D8%AC-%D9%81%D8%A7%D8%B1%D8%B3%D8%9B-%D9%86%D9%81%D8%AA%DA%A9%D8%B4%E2%80%8C%D9%87%D8%A7-%D8%AF%D8%B1-%D9%85%D8%B3%DB%8C%D8%B1-%D8%AA%D9%82%D8%A7%D8%A8%D9%84-%D8%A8%D8%A7-%D9%86%DB%8C%D8%B1%D9%88%DB%8C-%D8%AF%D8%B1%DB%8C%D8%A7%DB%8C%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7", "summary": "جمهوری اسلامی ایران خود را برای اقدامی احتمالی آماده می‌کند تا محاصرهٔ دریایی آمریکا علیه صادرات نفتش را بشکند. بر اساس این طرح، قرار است کاروانی از بیش از ۱۴ نفتکش از تنگهٔ هرمز عبور کند؛ اقدامی که می‌تواند به رویارویی با نیروی دریایی آمریکا بینجامد و چه بسا حملات ایران به تأسیسات انرژی در سراسر خلیج فارس را در پی داشته باشد. بر اساس اطلاعاتی که دستگاه‌های اطلاعاتی غرب طی روزهای اخیر جمع‌آوری کرده‌اند، ایران در حال آماده‌سازی این کشتی‌ها برای خروج از خلیج فارس و ورود به دریای عمان است. مقصد نهایی این کشتی‌هایی ظاهراً چین خواهد بود. بر اساس گزارش‌ها، بیش از ۱۴ نفتکش در نزدیکی پایانهٔ اصلی صادرات نفت ایران در جزیرهٔ خارگ گرد آمده‌اند. این نفتکش‌ها نفت بارگیری کرده‌اند، خدمه‌شان مشخص شده و پرچم ایران بر فرازشان برافراشته شده است. این تدارکات می‌تواند نشانهٔ تلاش قریب‌الوقوع ایران برای به چالش کشیدن محاصرهٔ دریایی آمریکا باشد، اما ممکن است برای وادار کردن واشنگتن و کشاندن آن به مذا ings, and the ones at Burger King were mostly breading. Ultimately, Dairy Queen was the clear winner, with a crunchy onion ring that was packed with flavor. Whenever I enter a fast-food restaurant , there's always one question lingering in the back of my mind: Should I get french fries or onion rings? Although french fries are a great side to any fast-food meal, onion rings can be a delicious alternative — if they're done right. Usually, I can tell how decent fries will be just by looking at them, but there's more uncertainty with onion rings. How crunchy is the batter? Will the onion inside add flavor and texture, or will it simply slither out of its breading on the first bite? So, I found fast-food chains near me that had onion rings on the menu — Dairy Queen, Sonic, and Burger King — and set out to see which served the best version of the side. I started at Dairy Queen. Ted Berg The first fast-food chain I went to was Dairy Queen, a restaurant founded as an ice-cream shop that now has over 7,800 locations worldwide. Because there are no Dairy Queen locations in New York City , where I live, I went to a DQ Grill Chill in Middletown, New York, instead, which features a full menu in addition to the chain's trademark desserts. I ordered a \"regular\" size of onion rings — the smallest on the menu — which cost almost $5 and included eight fairly hearty-looking rings stacked neatly into a cardboard container. They were served piping hot and were lightly greasy. I loved the texture of Dairy Queen s onion rings. Ted Berg The onion rings at Dairy Queen had a pronounced crunch to the outer breading, which was mildly salty. The texture was great: the onions inside weren't slimy, and the batter clung nicely when I bit into them. There was a hint of sweetness to the onions as well. In general, these seemed surprisingly upscale for a fast-food onion ring — on par with something you might get at a decent pub, where you'd spend way more than $5 for them. Next, I visited Sonic. T ory": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آذر • ۱۹:۴۸"}, {"source": "Business Insider", "title": "I've traveled to over 100 countries. I'd recommend these 5 destinations for a festive holiday trip.", "link": "https://www.businessinsider.com/best-cities-to-visit-for-holidays-christmas-winter-travel-2026-11", "summary": "One of my favorite destinations to visit during the holiday season is Bolzano, which is home to a historic Christmas market. Kaitlyn Rosati I'm a frequent solo traveler who loves the holiday season. After traveling to 100 countries , there are a few destinations I love visiting around Christmas. My favorite Christmas market is in Italy, and I think winter is an underrated time to visit Tokyo. I have been solo traveling for a decade, and if there's one thing I love more than traveling alone, it's traveling during the holidays . What can I say? I'm a big kid at heart who loves all things merry and bright. Christmas has always been one of my favorite times of the year, not just because of holiday cheer, but because it provides a unique way to learn about destinations and cultures around the globe. If you're like me and want an epic festive holiday trip, after years of field research, here are five destinations that do it best, from someone who's traveled around the globe. Rovaniemi, Finland, is a winter wonderland. captiontk Kaitlyn Rosati When I first started solo traveling, I was enamored with the idea of sleeping in an igloo at the Arctic Circle. Pair that with my love for the holidays, and it was a no-brainer to book a flight to Rovaniemi, Finland, for December, where the airport has a welcome sign that reads, \"Santa's Official Home Airport.\" Rovaniemi really is a winter wonderland: Here, you can ride a husky-led sled, visit a reindeer farm, and even meet the man himself at Santa Claus Village. It's home to Santa Claus' Post Office, a real running postal service. Though I arrived by plane, there's also the Santa Claus Express , a 12-hour overnight sleeper train from Helsinki to Rovaniemi that zips through the snow-capped Finnish countryside. If you're lucky, you might even catch sight of the northern lights — the Arctic Circle is one of the best places in the world to see them. Christmas in Tokyo might not be a traditional choice, but it s one of the most fun. captiontk Kaitlyn Rosati Although Christmas isn't a designated national holiday in Japan, Tokyo still goes big. Throughout the months of November and December, holiday markets pop-up all around the city, with some offering that European market feel. The Roppongi Hills Christmas Market, for example, offers rows and rows of sparkling lights which perfectly frame the Tokyo Tower. On the fourth floor of Tokyo Skytree, you can visit a Christmas market that feels like one you'd find in Austria or Germany:", "date_str": "2026-11-22T16:09:01+00:00", "hash": "dc6ab52c363bd721", "title_fa": "من به بیش از 100 کشور سفر کرده ام. من این 5 مقصد را برای یک سفر تعطیلات جشن توصیه می کنم.", "summary_fa": "یکی از مقاصد مورد علاقه من برای بازدید در فصل تعطیلات بولزانو است که بازار تاریخی کریسمس را در خود جای داده است. Kaitlyn Rosati من یک مسافر انفرادی مکرر هستم که عاشق فصل تعطیلات هستم. پس از سفر به 100 کشور، چند مقصد وجود دارد که دوست دارم در حوالی کریسمس از آنها دیدن کنم. بازار کریسمس مورد علاقه من در ایتالیا است و فکر می کنم زمستان زمان دست کم گرفته شده ای برای بازدید از توکیو است. من یک دهه است که به تنهایی سفر می کنم، و اگر چیزی وجود دارد که بیشتر از سفر به تنهایی دوست دارم، آن سفر در تعطیلات است. چه بگویم؟ من در قلب بچه بزرگی هستم که همه چیز شاد و درخشان را دوست دارم. کریسمس همیشه یکی از زمان‌های مورد علاقه من در سال بوده است، نه فقط به دلیل شادی تعطیلات، بلکه به این دلیل که راهی منحصر به فرد برای یادگیری مقاصد و فرهنگ‌های سراسر جهان است. اگر شما هم مانند من هستید و می خواهید یک سفر تعطیلات جشن حماسی داشته باشید، پس از سال ها تحقیق میدانی، در اینجا پنج مقصدی که این کار را به بهترین شکل انجام می دهند، از طرف شخصی که به سراسر جهان سفر کرده است، آورده شده است. رووانیمی، فنلاند، سرزمین عجایب زمستانی است. captiontk کیتلین روزاتی وقتی برای اولین بار سفر انفرادی را شروع کردم، شیفته این بودم که در یک ایگلو در دایره قطب شمال بخوابم. این را با عشق من برای تعطیلات جفت کنید، و رزرو پرواز به رووانیمی، فنلاند، برای ماه دسامبر، جایی که فرودگاه دارای تابلوی خوشامدگویی است که روی آن نوشته شده است، \"فرودگاه رسمی خانه بابا نوئل\"، بی خیال بود. رووانیمی واقعاً یک سرزمین عجایب زمستانی است: در اینجا، می‌توانید سوار سورتمه‌های هاسکی شوید، از مزرعه گوزن شمالی بازدید کنید و حتی", "image_url": "https://i.insider.com/6afdda0ed6c5d341c9b4a875?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آذر • ۱۹:۳۹"}, {"source": "Business Insider", "title": "A couple in their 50s spent $1 million building their forever home. It has a gym, pool, and aging-in-place features.", "link": "https://www.businessinsider.com/couple-50s-built-million-dollar-home-aging-in-place-2026-11", "summary": "Carla and Tony Stamper built their dream house. Mike Belleme for BI In 2022, Tony and Carla Stamper were on the cusp of becoming empty nesters . At the time, Tony, 55, and Carla, 54, lived in the North Carolina home where they had raised their four kids for about a decade. As their youngest was preparing for college and they began thinking about retirement, they wondered whether it was time to move. First, they looked at condos, thinking they might want something low maintenance so they could focus on travel . \"It didn't take us too long to figure out that's just not something that's conducive to what we like,\" Carla, a content creator, told Business Insider about herself and her husband Tony, a construction manager in the commercial industry. \"We like to work outside, and we like projects.\" The more they talked, the more they wondered if it were time to bring to life a dream they'd had for almost the entirety of their 30-year marriage: building a forever home. The Stampers wanted to create a space they could grow old in as they look toward retirement, which they plan to do in 2029, and beyond. Business Insider's Retirement, Remodeled series takes readers inside the homes people are transforming for their retirement years, from practical aging-in-place upgrades to major overhauls. Reach out to Samantha Pettyjohn to share your renovation story. The Stampers decided to build their dream house instead of downsizing. Mike Belleme for BI Because of Tony's work in construction, building a home was always something the Stampers spoke about, with Carla describing it as a \"pipe dream\" for much of their marriage. When they realized it would be financially feasible to build their home with the proceeds from the sale of their house and a loan, it felt like fate. \"We were like, 'This is our time. Our kids are grown. They're almost out of the house. Let's do it,'\" Carla said. \"And I wasn't getting any younger,\" Tony agreed. \"It was going to be now or never.\" In May 2022, they bought an acre of land in Fort Mill, South Carolina, for $110,000, giving them a suburban environment and an easy commute to Charlotte, North Carolina . The Stampers liked the idea of living somewhere that balanced a quiet feel with proximity to a city. They wanted their home to serve them now and down the line. Mike Belleme for BI Carla and Tony intended for their new house to be their forever home, where they could entertain their children and two grandchildren, and age in place safely. That long", "date_str": "2026-11-22T16:06:01+00:00", "hash": "7b4e8d8de006fc0d", "title_fa": "زوجی در دهه ۵۰ زندگی خود ۱ میلیون دلار برای ساختن خانه ابدی خود هزینه کردند. دارای سالن بدنسازی، استخر، و ویژگی‌های مربوط به پیری در محل است.", "summary_fa": "کارلا و تونی استمپر خانه رویایی خود را ساختند. مایک بلم برای BI در سال 2022، تونی و کارلا استمپر در آستانه تبدیل شدن به آشیانه‌های خالی بودند. در آن زمان تونی 55 ساله و کارلا 54 ساله در خانه ای در کارولینای شمالی زندگی می کردند که حدود یک دهه در آنجا چهار فر bought his first property at 23. He eventually earned enough rental income to quit his job as a pharmacist in 2023. Chaw expanded outside his home state of California, and hopes to keep buying more homes. This as-told-to essay is based on a conversation with Ryan Chaw, a 34-year-old who quit his job as a pharmacist and now lives off rental income from his 12 properties. Chaw, who lives in Sacramento, California, bought his first property at 23 years old and rented it out by the room. The following has been edited for length and clarity. Early in life, I realized that investing in real estate was the best way to create generational wealth. My grandpa bought a set of flats in the San Francisco Bay Area, and not only was he able to retire early , but he also was able to support me and my brother through college. Back in the 1950s, the properties were dirt cheap, but as time went on, those properties went up in value tremendously, and the rents went up as well. When my parents eventually sold my grandpa's properties after he passed away, they sold them for about $3.6 million. That was more money than they made in their entire lives. They worked 40 hours a week, essentially, for 30 years while this single set of flats in San Francisco sat for the same amount of time, and they made more with the flats. It put things into perspective for me: work smarter, not harder. So I became obsessed with that concept, and I had a really good example. Still, it was scary to dive into real estate investing . It's intimidating to get into something you've never done before and know nothing about. I wasn't taking much action on buying a house. I was talking about buying rentals a lot, and my dad called me out and said, \"Hey Ryan, you seem to be talking about rentals, but I haven't seen you even contact a real estate agent yet. Isn't that the first step?\" I remember at the time I kind of got angry, more at myself. That same day, I called a real estate agent, drove down to Stockton, California, which is about an hour away from me, and saw three or four properties. I put an offer on one of the properties that same day. I didn't know what I was doing. It was a $262,000 house, but I put down $100,000 for my down payment because I didn't know that the normal down payment people put down is 20%. Chaw outside his first rental home in Stockton, California. Courtesy of Rya", "date_str": "2026-11-22T15:22:01+00:00", "hash": "f69b3a44a49d19c5", "title_fa": "من اولین ملک اجاره ای خود را در 23 سالگی خریدم. اکنون 12 خانه دارم و آنقدر پول دارم که بتوانم کار روزانه ام را رها کنم.", "summary_fa": "رایان چاو در خارج از یکی از املاک خود در استاکتون، کالیفرنیا. با حسن نیت از رایان چاو، سرمایه گذار املاک و مستغلات، رایان چاو اولین ملک خود را در 23 سالگی خرید. او در نهایت درآمد کافی از اجاره به دست آورد تا شغل خود را به عنوان داروساز در سال 2023 ترک کند. چاو به خارج از ایالت زادگاهش کالیفرنیا گسترش یافت و امیدوار است به خرید خانه های بیشتری ادامه دهد. این مقاله گفته شده بر اساس گفتگو با رایان چاو، 34 ساله ای است که شغل خود را به عنوان داروساز ترک کرد و اکنون از درآمد اجاره 12 ملک خود زندگی می کند. چاو که در ساکرامنتو، کالیفرنیا زندگی می کند، اولین ملک خود را در 23 سالگی خرید و آن را در کنار اتاق اجاره کرد. موارد زیر برای طول و وضوح ویرایش شده است. در اوایل زندگی، متوجه شدم که سرمایه گذاری در املاک و مستغلات بهترین راه برای ایجاد ثروت نسلی است. پدربزرگ من یک مجموعه آپارتمان در منطقه خلیج سانفرانسیسکو خرید و نه تنها توانست زودتر بازنشسته شود، بلکه توانست از من و برادرم در دانشگاه حمایت کند. در دهه 1950، املاک ارزان بودند، اما با گذشت زمان، ارزش آن املاک به شدت افزایش یافت و اجاره ها نیز افزایش یافت. هنگامی که والدینم در نهایت املاک پدربزرگم را پس از درگذشت او فروختند، آنها را به قیمت حدود 3.6 میلیون دلار فروختند. این پول بیشتر از آن چیزی بود که در کل زندگی خود به دست آوردند. آنها اساساً به مدت 30 سال 40 ساعت در هفته کار می کردند در حالی که این واحد آپارتمان در سانفرانسیسکو مدت زمان مشابهی را می نشیند، و با آپارتمان ها بیشتر درآمد داشتند. همه چیز را برای من در نظر گرفت: هو d cheaper than buying chicken breasts and boiling them myself. I find that the rotisserie chicken also packs much more flavor, and saves me from having to do any actual cooking. Then I shred the rotisserie chicken. Erin McDowell/Business Insider I usually do this step by hand, but you can also use two forks to shred your chicken. By the end, you should have about 3 cups of shredded rotisserie chicken. I put the cream cheese in the slow cooker and cut it into cubes with a knife. Erin McDowell/Business Insider This helps ensure the cream cheese melts evenly and is well-distributed throughout the dip. You can use full-fat or low-fat cream cheese for this dip, depending on your preference — I've had success using both. I then add the rotisserie chicken to the slow cooker and season it. Erin McDowell/Business Insider I usually eyeball how much seasoning I use, but typically go for about a tablespoon of garlic powder, a tablespoon of salt, and a few dashes of pepper. I add the two types of ", "date_str": "2026-11-22T15:12:01+00:00", "hash": "bb3bb0f42b3ca6fb", "title_fa": "من این دیپ مرغ آهسته پز بوفالو را هر روز شکرگزاری درست می کنم. همیشه برای جمعیت خوشایند است.", "summary_fa": "دیپ مرغ بوفالو تنها به شش ماده نیاز دارد. ارین مک داول/Business Insider من هر روز شکرگزاری همان دیپ مرغ بوفالو را درست می کنم. این فقط شش ماده به اضافه چاشنی ها نیاز دارد و در یک اجاق آهسته با هم می آید. این برای جمعیت خوشایندتر است و ساختن آن به طرز باورنکردنی آسان است. روز شکرگزاری به معنای دور هم جمع شدن دور میز با دوستان و خانواده است، و این غذای آهسته پز مرغ بوفالو به شما امکان می دهد زمان کمتری را در آشپزخانه و زمان بیشتری را با هم بگذرانید. به علاوه، خوشمزه است. هر زمان که سرگرمی می کنم، چه برای روز شکرگزاری، روز بازی، یا یک گردهمایی معمولی، دوستان همیشه می پرسند که آیا می خواهم دیپ مرغ بوفالو را درست کنم. در طول سال‌ها، من دستور العمل‌هایی را از سراسر اینترنت در این نسخه خوشایند اقتباس کرده‌ام که فقط شش ماده اصلی را به اضافه چند چاشنی آشپزی نیاز دارد. در اینجا طرز تهیه دیپ مرغ بوفالو آهس getild, wat dus een (gedeeld) record is! Call your knitting circle! Virgin River has been officially renewed for a 9th season! Season 8 premieres in 2027! https://t.co/DGpbEyzDgM — Netflix (@netflix) November 13, 2026 Showrunner Patrick Sean Smith reageert op de verlenging van zijn kindje : We zijn allemaal ontzettend dankbaar voor onze samenwerking met Netflix en enorm trots dat we deel mogen uitmaken van hun geschiedenis. In een wereld waarin mensen zich soms steeds minder met elkaar verbonden voelen, is het bijzonder om een plek te hebben waar ze graag naar terugkeren. Ik ben ongelooflijk trots op wat we samen hebben opgebouwd en nog altijd verder ontwikkelen. Daarnaast ben ik de acteurs, de crew, de schrijvers en de fans enorm dankbaar. Dankzij hen voelt Virgin River voor mensen over de hele wereld als thuiskomen. En ook Martin Henderson (die de rol van Jack speelt) heeft wel wat te zeggen over het nieuws: Het is bijna niet te bevatten dat we na al die jaren nog steeds Virgin River maken. Ik ben ontzettend blij dat ik voor het negende seizoen op rij in de huid van Jack mag kruipen! Het betekent enorm veel voor me dat fans zich zo sterk en vol passie verbonden voelen met wat we maken. Zonder hen waren we nooit zover gekomen. Dus BEDANKT allemaal! Zolang jullie de serie willen blijven zien, zullen wij ons uiterste best doen om er iets moois van te maken! Het achtste seizoen van Virgin River komt in 2027 uit op Netflix en daarna is het dus tijd voor seizoen 9. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Historisch seizoen Virgin River in aantocht op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-11-22T18:37:55+00:00", "hash": "57be6e7d333415d6", "title_fa": "فصل تاریخی ویرجین ریور به نتفلیکس می رسد", "summary_fa": "مطبوعات را متوقف کنید! اخبار تاریخی برای گزارش داریم! ویرجین ریور فصل نهم را نیز دریافت خواهد کرد و سریال را به همراه گریس و فرانکی با بیشترین قسمت در نتف     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
