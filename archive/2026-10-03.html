جه حضور تنها روی پرده شد که توانست از این آشفتگی یک فیلم فراتر رود. از قضا، تیتراژها نامی از مجری فیلم نمی‌برند که عملکردش واقعا مورد تشویق قرار گرفت. او نوشت که یک دختر سیاهپوست جوان به نام Tinashe Kachingwe بود که The Times They Are A-Changin را با چنان شیرینی و اعتقادی می خواند که مانند یک استاد کلاس است. اگر از من خواسته می شد که به عنوان مشاور در این تصویر خدمت کنم، توصیه من به سه کلمه می رسید: بیشتر Tinashe Kachingwe. دو دهه طول کشیده است، اما بقیه دنیا به راجر ایبرت رسیده اند. هشتمین آلبوم استودیویی تیناشه، Popstar، در 25 سپتامبر منتشر شد و فوراً به یکی از مشهورترین آلبوم های پاپ امسال تبدیل شد. Singles Too Easy، Crash Out، Melatonin، و Pillow Fight همه جا بوده اند، و همینطور خود Tinashe، به شکلی به یاد ماندنی با طرفداران آنلاین تعامل می کند و به اوج هنری می رسد که مدتی است برای رسیدن به آن تلاش"}, {"source": "Rolling Stone", "title": "See AC/DC Bring Out Dave Grohl for ‘Highway to Hell’ at Power Up Tour’s Final Show", "link": "https://www.rollingstone.com/music/music-news/ac-dc-out-dave-grohl-highway-to-hell-power-up-tour-finale-1235636450/", "summary": "Foo Fighters served as openers at New Jersey's MetLife Stadium, the last show on AC/DC's itinerary for the foreseeable future, and maybe longer", "date_str": "2026-10-03T13:41:17+00:00", "hash": "da9571fb40d733ca", "title_fa": "AC/DC Bring Out Dave Grohl را برای «Highway to Hell» در نمایش نهایی Power Up Tour ببینید.", "summary_fa": "Foo Fighters به ​​عنوان افتتاحیه در استادیوم MetLife نیوجرسی خدمت کرد، آخرین برنامه در برنامه سفر AC/DC برای آینده قابل پیش‌بینی، و شاید AC/DC طولانی‌تر دیو گرول را بیرون آورد تا در بزرگراه به جهنم در طول کنسرت گروه در روز جمعه در ایست رادرفورد، نیوجرسی، آخرین نمایش MetLife، Powerly و Powerly. کنسرت MetLife در ابتدا برای 25 سپتامبر برنامه ریزی شده بود، اما نه عید پاک در امتداد ساحل شرقی تاریخ را به جمعه رساند و آن را به آخرین تاریخ تور دو ساله Power Up AC/DC تبدیل کرد. زمانی که برنامه دوباره برنامه ریزی شد، همچنین اعلام شد که Foo Fighters افتتاحیه غافلگیرکننده کنسرت خواهد بود. با وجود دیو گرول در ساختمان، کاملا طبیعی بود که خواننده ای که با AC/DC در نقش بزرگراه به جهنم ظاهر شد، رویای کودکی خود را برآورده کرد. سلام به همه، ما چیزی داریم که به شما بگوییم. بهتره الان از نزدیک گوش کن یکی از دوستان بسیار خوب ما امروز از ما پرسید که آیا می تواند بیاید و برای بزرگراه برای جهنم به ما بپیوندد. برایان جانسون از AC/DC به جمعیت گفت و ما گفتیم، بله دیو، تو می‌توانی. دیوید گرول. موسیقی فوق العاده است، اینطور نیست؟ در طول مجموعه افتتاحیه Foo Fighters، گرول در مورد اینکه AC/DC چقدر برای او ارزش دارد و چرا از فرصت دیگری برای باز کردن برای گروه استفاده کرد صحبت کرد. Foo Fighters همچنین برای AC/DC در St. لویی در 8 سپتامبر، در حال پر کردن برای افتتاحیه معمول تور، Pretty Reckless. وقتی 11 ساله بودم و به یک فیلم نیمه شب رفتم و فیلم Let There Be Rock را در سینمای لعنتی دیدم، در 11 سالگی نمی دانستم که راک اند رول می تواند اینطور باشد. گرول به مخاطبان MetLife گفت، من نمی دانستم که راک اند رول عرق و خون و اشک"}, {"source": "Rolling Stone", "title": "Noah Kahan Producer Gabe Simon Is More Than Just a ‘Stomp-Clap’ Guy", "link": "https://www.rollingstone.com/music/music-features/noah-kahan-producer-gabe-simon-interview-1235634924/", "summary": "\"I have no desire to do one thing,\" says the architect of Stick Season , The Great Divide , and albums by country rocker Koe Wetzel", "date_str": "2026-10-03T13:30:00+00:00", "hash": "4be4805fc8d87da5", "title_fa": "گیب سایمون، تهیه کننده نوح کاهان، چیزی فراتر از یک «دست زدن با دست زدن» است", "summary_fa": "معمار فصل Stick، The Great Divide و آلبوم‌های راک‌کننده کانتری، کو وتزل، می‌گوید: «من هیچ تمایلی به انجام یک کار ندارم. اگرچه، همانطور که یکی از پرتقاضاترین تهیه کنندگانی که در حال حاضر در موسیقی عامه پسند کار می کند، اذعان می کند، او دقیقاً چنین برنامه ریزی کرده است. سایمون می‌گوید که ما در حال حاضر در یک ماجراجویی هستیم، که اخیراً خانواده‌اش را از زندگی راحت‌ای که برای بیش از دو دهه در نشویل ساخته بود جدا کرد تا در آن سوی حوض جابجا شود و مغازه‌ای را به‌عنوان تهیه‌کننده در محل اقامت در استودیو معروف RAK لندن راه‌اندازی کند. می خواستم ناراحت باشم شنیدن اعتراف او به سختی شوکه کننده است: از بسیاری جهات، خارج شدن از منطقه راحتی و به طور خاص خود را به چالش کشیدن برای تفکر فراتر از محدودیت های ژانر موسیقی، سکوی پرشی برای موفقیت اخیر سایمون و تحسین منتقدان بوده است. سایمون به رولینگ استون می گوید من عاشق انجام کارهایی هستم که احساس می کنم کاری ندارم. او بیشتر به عنوان گورو تولید نوح کاهان، یکی از معماران سونیک اصلی فیلم‌های فولکلور پاپ مگا-ستارگان ال‌پی 2022، Stick Seaso n، و همچنین ادامه‌ی تحسین‌برانگیز امسال، The Great Divide شناخته می‌شود. اما چیزی که شاید در مورد سایمون تاثیرگذارتر باشد، سازگاری موسیقیایی اوست. در زمان‌های اخیر، تهیه‌کننده، ترانه‌سرا و نوازنده چند ساز که دندان‌هایش را بریده و آهنگ‌هایی برای دوآ لیپا و لانا دل ری می‌نویسد، مسئولیت تولید آلبوم‌هایی را برای هنرمندان مختلفی مانند کاهان، کوئه وتزل، ستاره سبک کانتری، جیمز بی راکر، نوازنده-بازیگر، سوکی واترهاوس، مایلز کن اسمیت و درموت بر عهده داشته است. سایمون اذعان می‌کند که من سعی می‌کنم روی ژانرهای [موسیقی] کار کنم که چیز زیادی درباره‌شان نمی‌دانم. زمانی که فصل استیک را اجرا کردم، قبلاً هرگز یک آلبوم موسیقی محلی نساخته بودم."}, {"source": "Rolling Stone", "title": "Tom Morello: ‘If It Kills Like Fascism, Brothers and Sisters, It’s Fascism’", "link": "https://www.rollingstone.com/music/music-features/tom-morello-interview-album-sheeran-springsteen-audioslave-1235635303/", "summary": "The musician-activist dropped a heavy new album, toured with Springsteen, and is launching the Power to the People festival — and he’s got a lot more to say", "date_str": "2026-10-03T13:00:00+00:00", "hash": "f0218ab4bcc3ec25", "title_fa": "تام مورلو: \"اگر مانند فاشیسم، برادران و خواهران را بکشد، فاشیسم است\"", "summary_fa": "این نوازنده-فعال آلبوم سنگین جدیدی را منتشر کرد، همراه با اسپرینگستین تور برگزار کرد و جشنواره Power to the People را راه اندازی می کند - و می توان گفت که تام مورلو سال را با یک کنسرت اعتراضی در مینیاپولیس آغاز کرد و تا ماه مارس، با بروس اسپرینگستین و گروه E Street برای یک تور ضد ترامپ روی صحنه رفت. در ماه اکتبر، او فستیوال پر ستاره خود را به نام Power to the People درست پس از انتشار سنگین‌ترین آلبوم خود در سال‌های اخیر، یعنی Everyone Gets Everything They Want، برگزار کرد. اگر اخیراً در سن 62 سالگی به طور غیرعادی از کار افتاده است، خوب، برای چه چیزی نباید اخراج شود؟ او می پرسد. مورلو با رولینگ استون به گفتگو درباره سیاست، جنجال اد شیران و آلبومش نشست. او می‌گوید: این رکوردی است که کلیت آنچه من به عنوان یک هنرمند هستم و آنچه که به عنوان یک نوازنده گیتار می‌توانم انجام دهم را در بر می‌گیرد. بنابراین شما اولین آلبوم راک انفرادی خود را دارید و سپس جشنواره خود را دارید، Power to the People. تو طبق معمول مرد شلوغی هستی اوه، این بسیار، بسیار درست است. با توجه به رکورد، این احتمالا آخرین رکوردی است که قبل از اینکه همه ما را به زندان بیندازند، ثبت خواهم کرد. پس بیایید از آن نهایت استفاده را ببریم. و سپس این جشنواره نیز در یک چهارراه تاریخی در دموکراسی ما قرار می گیرد و آنچه را که می توانیم با آنچه داریم انجام می دهیم. در آلبوم، شما به حضور در لیست سیاه اشاره کرده اید. آیا واقعاً احساس می کنید در لیست سیاه هستید؟ حضور در لیست سیاه در این مرحله باعث افتخار خواهد بود، و من فکر می کنم ما در زمانی زندگی می کنیم که اگر به نظر می رسد فاشیسم است، اگر"}, {"source": "Rolling Stone", "title": "New York Knicks Home Opener Ticket Prices Soar: Here’s Where to Find the Best Prices Online", "link": "https://www.rollingstone.com/product-recommendations/tickets/where-to-buy-2026-new-york-knicks-tickets-online-deals-discounts-1235634675/", "summary": "NY Knicks ticket prices are skyrocketing as the team raises the first NBA Finals championship banner at MSG in 53 years", "date_str": "2026-10-03T11:48:00+00:00", "hash": "7db5edf64dc98935", "title_fa": "قیمت بلیط بازکن خانه نیویورک نیکس افزایش یافت: در اینجا بهترین قیمت ها را به صورت آنلاین پیدا کنید", "summary_fa": "قیمت بلیط های نیویورک نیکز به طور سرسام آوری بالا می رود زیرا این تیم اولین بنر قهرمانی فینال NBA را در MSG در 53 سال اخیر برافراشته است. پس از پیروزی در فینال های NBA در ماه ژوئن، جالن برانسون و نیویورک نیکس داغ ترین چیزهای این شهر بوده اند. با حضور قانه منتظر لذت"}, {"source": "Hollywood Reporter", "title": "George Cheeks May Level Up in David Ellison’s TV Empire", "link": "https://www.hollywoodreporter.com/business/business-news/george-cheeks-skydance-david-ellison-tv-empire-1236721367/", "summary": "The CBS networks chief is poised to expand his oversight with the Warner Bros. Discovery assets arriving onboard the Skydance train.", "date_str": "2026-10-03T01:02:14+00:00", "hash": "099fd8ddfe30b598", "title_fa": "جورج چیکس ممکن است در امپراتوری تلویزیونی دیوید الیسون به سطح بالایی برسد", "summary_fa": "رئیس شبکه CBS آماده است تا نظارت خود را با دارایی‌های Warner Bros. Discovery که به قطار Skydance می‌رسند گسترش دهد. آخرین بازمانده مدیرعامل پارامونت گلوبال احتمالاً در فصل جدیدی از این شرکت صعود خواهد کرد. جورج چیکس، که در حال حاضر بر مجموعه استودیو CBS و کانال های تلویزیونی خطی پارامونت نظارت می کند، گفته می شود که آماده است نظارت بر استودیوهای تلویزیونی Skydance از جمله استودیوهای تلویزیونی برادران وارنر و استودیوهای تلویزیونی پارامونت را در هفته آینده اضافه کند. در نوامبر سال گذشته، پارامونت اسکای‌دنس کسب‌وکار تلویزیونی خطی خود را تحت عنوان Cheeks بازسازی کرد و شبکه‌های کابلی BET، Comedy Central، MTV و Nickelodeon را در کنار CBS به مجموعه مدیران اجرایی اضافه کرد. در رژیم قبلی شری رداستون، Cheeks بخشی از یک سه نفر تحت عنوان دفتر مدیرعامل به همراه برایان رابینز و کریس مک کارتی به صورت موقت پس از برکناری باب باکیش مدیر عامل شرکت در بحبوحه فرآیند فروش بود که در نهایت به سمت رسانه Skydance دیوید الیسون رفت. هدف Cheeks اکنون ثبات، سازماندهی مجدد و دوشیدن آن عناوین به صورت نقدی خواهد بود و انتظار می رود کاهش های گسترده ای در سراسر این شرکت وجود داشته باشد زیرا به دنبال برداشت درآمد از هزینه های حمل و نقل و توزیع مجدد به اولویت های دیگر مانند پخش جریانی و پرداخت بدهی است. این شرکت ترکیبی، به ویژه، باید از یک فرمان رضایت که با 12 ایالتی که از تیم الیسون شکایت کرده‌اند، پایبند باشد. این شامل این می شود که کانال های کابلی پارامونت و وارنر (به ترتیب Comedy Central-MTV-BET-Nick و HGTV-Food Network-TNT-CNN-Discovery) به ط ارت صیقلی آن. غول پیکر! خط پایین Adagio زمانی که نیاز به agitato است. مکان: جشنواره فیلم نیویورک (مرکز - تخته سنگ اصلی) تاریخ اکران: جمعه، دسامبر. 4 بازیگران: پدرو پاسکال، اولیویا وایلد، ایوا ویکتور، الکسا سوینتون، کایا رالز، اریک گریفین، جوبت ویلیامز، مارگاریتا لویوا، هنک آزاریا، ویل آرنت کارگردان فیلمنامه نویس: تونی گیلروی 2 ساعت و 7 دقیقه"}, {"source": "Hollywood Reporter", "title": "Ouster Rumors and a Tense Phone Call: Mike De Luca and Pam Abdy’s Final Weeks at Warners", "link": "https://www.hollywoodreporter.com/movies/movie-news/mike-de-luca-pam-abdy-final-weeks-at-warners-1236721241/", "summary": "The exiting Warner Bros. chiefs are in search of a next act (Netflix?) as insiders debate their legacy.", "date_str": "2026-10-02T22:40:36+00:00", "hash": "e4e7a58724c6b912", "title_fa": "برکناری شایعات و یک تماس تلفنی پرتنش: هفته های پایانی مایک دی لوکا و پم عبدی در Warners", "summary_fa": "روسای در حال خروج برادران وارنر در جست‌وجوی اقدام بعدی (نتفلیکس؟) هستند، زیرا خودی‌ها درباره میراث آنها بحث می‌کنند. توسط Borys Kit، Mia Galuppo، Aaron Couch، 2 اکتبر 2026، ساعت 3:40 بعدازظهر مایک دی لوکا بیش از یک ماه پیش شروع به شنیدن این شایعه کرد: او و یکی از کارگردانان فیلم برادران وارنر، پم عبدی، در بلوک برش بودند. منبع این شایعه دیوید الیسون نبود که این دو ماه ها قبل با او ملاقات کرده بودند و به نظر می رسید نشان می داد که در دنیای پس از ادغام باقی خواهند ماند. نه، د لوکا شنیده بود که این از جاش گرینشتاین، رئیس مشترک پارامونت پیکچرز می‌آید. به گفته منابع آگاه، گرینشتاین در یک درگیری بین شهری به مدیران دیگر گفته است که می خواهد از شر عبدی و دی لوکا خلاص شود. منابع دیگر، همچنین با آگاهی مستقیم از گفتگو، مخالفت کردند که این اظهارات به سمت ثبات عمومی برادران وارنر است و در زمینه رقابت گرینشتاین برای یک پروژه و طاووس کردن ثبات و مدیران برتر خود پارامونت بیان شده است. بدون توجه به این، د لوکا، که هرگز روی دستانش نمی نشست، تصمیم گرفت سر به راه شود و با گرینشتاین تماس گرفت. اینو جدی میگی؟ به گفته منابع آگاه، او خواستار دانستن این موضوع شد. گرینشتاین این اتهامات را رد کرد و دلیل آ ل، پلت فرم صنعتی جشنواره بین المللی فیلم سائوپائولو دریافت خواهد کرد. این جایزه به تعهد همیشگی او برای پیشبرد سینمای برزیل و ارتقای سطح بین‌المللی فیلم و استعداد برزیلی از طریق همکاری با Projeto Paradiso افتخار می‌کند. [ ] افتخار افتتاحیه کار رابینوویچ را در حمایت از توسعه و دسترسی بین المللی استعدادهای فیلم برزیل از طریق Projeto Paradiso به رسمیت می شناسد. جایزه Encounters برای برجسته کردن نقش تحول آفرین سرمایه گذاری خصوصی در فرهنگ، گرد هم آوردن سرمایه گذاران خصوصی و متخصصان خلاق در پشت تولیدات سمعی و بصری ایجاد شد. افتخار افتتاحیه به رابینوویچ در مراسم افتتاحیه جشن در اکتبر اعطا خواهد شد. 14 و قبل از یک رویداد گفتگو با رئیس نئون جف دوچمن. داستان‌های مرتبط SNL U.K. سینتیا اریوو، دنی دایر و جیمز نورتون را به عنوان میزبان‌های بعدی می‌گذارد. اجرای پرچین «Prima Facie» سینتیا اریوو مورد تشویق ایستاده TIFF است. در سال 2018، او مؤسسه اولگا رابینوویچ را تأسیس کرد و به زودی Projeto Paradiso را راه اندازی کرد. این ابتکار به پیشرفت بخش سمعی و بصری برزیل اختصاص دارد و از اعتقاد او به این موضوع که داستان ها می توانند جهان را تغییر دهند و همچنین تصمیم به سرمایه گذاری روی افرادی که آنها را ایجاد می کنند و می خواهند آنها را با مخاطبان در سراسر جهان به اشتراک بگذارند، رشد کرده است. رناتا دی آلمیدا، مدیر جشنواره بین‌المللی فیلم اس و پائولو، گفت: اولگا رابینوویچ که در ورایتی پرطرفدار است، اولین دریافت‌کننده فیلم جدید Pr mio Encontros است، زیرا او الهام‌بخش این جایزه بود. من اولین بار نام اولگا را در اوایل سال 2018 شنیدم، زمانی که ژوزفین بورگوآ به دیدن من آمد در مورد شخصی از بخش خصوصی که می خواست یک موسسه اختصاصی"}, {"source": "Variety", "title": "Skydance Blasts Off: Can David Ellison Make Paramount-Warner Bros. Merger Fly?", "link": "https://variety.com/2026/film/news/skydance-david-ellison-paramount-warner-bros-merger-debt-1236898108/", "summary": "David Ellison has emerged victorious. And he’s boldly — or arrogantly, if you prefer — decided to name the entertainment giant that he’s bolted together Skydance Corp., nodding to the original name of his film production firm that has swallowed up two Hollywood studios over the past 14 months. Defying skeptics and beating back opponents, [ ]", "date_str": "2026-10-03T13:00:00+00:00", "hash": "f095b10eeb0b7f89", "title_fa": "Skydance Blasts Off: آیا دیوید الیسون می تواند پارامونت-وارنر برادران Merger Fly را بسازد؟", "summary_fa": "دیوید الیسون پیروز ظاهر شد. و او با جسارت - یا اگر ترجیح می دهید متکبرانه - تصمیم گرفت نام غول سرگرمی را که با هم ساخته شده است، Skydance Corp.، با اشاره به نام اصلی شرکت تولید فیلم خود که در 14 ماه گذشته دو استودیو هالیوود را بلعیده است، نام برد. سرپیچی از شکاکان و شکست دادن مخالفان، [ ] در حالی که بسته شدن معامله قرار است روز سه شنبه، اکتبر اتفاق بیفتد. 6 به یک قطعیت تبدیل شد، خودی های صنعت سرگرمی شروع به درک این واقعیت کردند که شرکت بزرگ شده یک نیروی جدید و غیرقابل پیش بینی در شهر است. این معامله برای جامعه خلاق دو قطبی شده است، به طوری که بسیاری از نام‌های پررنگ در مخالفت خود با ادغام، علنی می‌شوند. تیم رهبری جدیدی که Skydance تحت هدایت الیسون و ینون کریز جمع آوری می کند، که به تازگی از Mattel به عنوان مدیر عامل مشترک استخدام شده اند، باید این پویایی را دنبال کنند. و آنها باید این کار را در حالی انجام دهند که در وال استریت روی طناب می‌روند تا بدهی خود را بپردازند و سود خود را از طریق فیلم، تلویزیون خطی و استریم افزایش دهند. محبوب در Variety، جواد حسین، مدیر عامل S P Global می گوید: آنها باید هر چه سریعتر حرکت کنند تا اهرم را پایین بیاورند. بزرگترین مانع و بزرگترین چیزی که ما باید به آن توجه داشته باشیم، ادغام و اجرا است. حسین می گوید دو سال پیش، Skydance Meida یک شرکت کوچک بود که چند فیلم در سال پخش می کرد. اکنون یکی از بزرگترین شرکت های رسانه ای را مدیریت می کند. لزوماً کار آسانی نیست. Skydance Shuffle: دیوید الیسون به سربازان درباره نام جدید خطاب می‌کند، با مایک و پم خداحافظی می‌کند و برای باربی 2 میز می‌گذارد نام جدید"}, {"source": "Variety", "title": "‘April X’ Review: Connor Storrie Bides His Time in a Generic Sci-Fi Clone", "link": "https://variety.com/2026/film/news/april-x-review-connor-storrie-1236898072/", "summary": "It would be nice to say that Connor Storrie burns up the screen in April X, the star s first film vehicle released since TV s Heated Rivalry made him hot property, but it would be overstating the case. Appropriating Harrison Ford s Blade Runner frown, among a few other things nicked from that sci-fi classic in this [ ]", "date_str": "2026-10-03T08:17:50+00:00", "hash": "a06f3dc74738ab66", "title_fa": "نقد و بررسی \"April X\": Connor Storrie زمان خود را در یک کلون علمی تخیلی عمومی صرف می کند", "summary_fa": "خوب است که بگوییم کانر استوری در آوریل X صفحه را می سوزاند، اولین وسیله نقلیه فیلم ستاره ای که از زمانی که رقابت داغ تلویزیون او را دارای خاصیت داغ کرد، منتشر شد، اما این موضوع اغراق آمیز است. اخم کردن بلید رانر هریسون فورد، از جمله موارد دیگری که از آن کلاسیک علمی تخیلی در این [ ] گرفته شده است، قبل از اینکه رقابت داغ، مرد پیشرو خود را به سوی ستاره شدن، میشل کی. تریلر آینده‌نگر مبهم پارندی - اگر اصلاً باشد - فقط به خاطر آن کودتای خوش شانس بازیگران به یاد می‌ماند. مطمئناً فقط متعهدترین طرفداران جدید استوری برای دیدن این جرأت می کنند، هرچند: این لکه خجالت آور در مجموع او نیست، اما مدت ها قبل از اولین نمایش فصل دوم پدیده هاکی عجیب و غریب فراموش خواهد شد. برای نویسنده و کارگردان Michel K. پرندی که اولین فیلم بلند خود را انجام می دهد، آوریل X کارت تلفن حساس تری خواهد بود و به درستی برخی از توانایی های فنی مدبرانه خود را با بودجه محدود نشان می دهد. اما فیلمنامه او، که با همکار همیشگی جک کولتر نوشته شده، کمتر تاثیرگذار است و تکه‌های داستانی از فیلم‌های بهتر را به هم می‌چسباند تا جلوه‌ای مبهم و بی‌ربط. فضای ژانری مشابهی را اشغال می‌کند که اخیراً Hot Spot منتشر شده است. آن فیلم یک اشتباه بود، اما معیاری از غیرمرکزی بودن تخیلی آن هنوز در اینجا مورد استقبال قرار می گیرد. پرطرفدار در Variety سال نامشخص است، اما بلوک‌های مسکونی وحشیانه خسته در خارج از بخارست همچنان پابرجا هستند: اگرچه مکان خاصی را هم مشخص نمی‌کند، آوریل X از فرسودگی پایتخت رومانی، جایی که فیلم در لوکیشن فیلمبرداری شده است، به‌عنوان خلاصه‌نویسی برای جهانی در حال فروریختن به ویرانه‌های بتنی استفاده می‌کند."}, {"source": "Variety", "title": "New York’s Inaugural Muslim Film Festival Aims to Move Past Counter-Narratives, Unveils Lineup, Jury (EXCLUSIVE)", "link": "https://variety.com/2026/film/festivals/new-yorks-muslim-film-festival-counter-narratives-1236898067/", "summary": "A festival launching Oct. 11 at Manhattan s SVA Theatre is positioning itself as an answer to the flattened, stereotyped picture of Muslims Western media often traffics in. The New York Muslim Film Festival (NYMFF), billed as the city s first for Muslim filmmakers, wants them telling their own stories. Hassan Babar, the festival s artistic director, said [ ]", "date_str": "2026-10-03T03:00:56+00:00", "hash": "c7c3b9ae11bc6ae9", "title_fa": "افتتاحیه جشنواره فیلم مسلمان نیویورک با هدف حرکت ضدروایت های گذشته، رونمایی از ترکیب، هیئت داوران (انحصاری)", "summary_fa": "جشنواره ای که در 11 اکتبر در تئاتر SVA منهتن راه اندازی می شود، خود را پاسخی به تصویر مسطح و کلیشه ای مسلمانان می داند که رسانه های غربی اغلب وارد آن می شوند. جشنواره فیلم مسلمان نیویورک (NYMFF) که به عنوان اولین شهر برای فیلمسازان مسلمان در این شهر به حساب می آید، از آنها می خواهد که داستان های خودشان را تعریف کنند. حسن بابر، مدیر هنری جشنواره، گفت [ ] در این رویداد یک روزه 12 فیلم کوتاه از هفت کشور به نمایش در می آید که در آن فیلم های مستند، درام، کمدی، انیمیشن و قطعات تجربی در ترکیب قرار دارند. زنان اکثریت مدیران برنامه را تشکیل می دهند. محبوب در ورایتی نوال مبین، یکی از بنیانگذاران و کارگردان جشنواره، گفت: این جشنواره به این دلیل وجود دارد که آن داستان ها سزاوار صحنه ای در این شهر هستند، نه در حاشیه دیگران. این روز با پذیرایی از فیلمسازان و مهمانان صنعت آغاز خواهد شد. دو بلوک از شش فیلم که هر کدام تقریباً یک ساعت اجرا می شوند، قبل از جوایز و اعلام هیئت داوران خواهند بود. آصف مندوی، برنده امی، خبرنگار قدیمی دیلی شو که در سریال ایول + پارامونت نیز بازی کرد، در هیئت داوران شش نفره حضور دارد. دارین هوتایت، نویسنده و کارگردان عرب-آمریکایی، بنیانگذار Cinephilia Productions، که فیلم های کوتاه او از HBO، AMC، SundanceTV و BBC پخش شده است، به او پیوست. منیر آتالا، رئیس تولید و خرید در شتر از دیگران از آن لذت بردم، حتی با وجود اینکه در آن تعداد زیادی مطالب درباره لئونارد برنشتاین (مثلاً قلب حرفه رهبری او در دهه‌های 50 و 60!) کنار گذاشته شد، زیرا من به طور غریزی تمام آن‌ها را برای استودی آرا در دان‌آرای هندی انتخاب کردم. آزمایشگاه افتتاحیه ونکوور (اختصاصی) در این مقیاس مشاهده شد، Behemoth! درام تونی گیلروی درباره یک نوازنده ویولن سل حرفه ای که پدرو پاسکال با رمز و راز گیج کننده ای نواخته است، در سطحی از اصالت نمره می گیرد. شخصیت پاسکال، یک موسیقیدان مشهور به نام الکس سریان، عضو ارکسترهای سمفونیک مختلف"}, {"source": "Variety", "title": "George Cheeks May Be Poised for Expanded TV Role at Skydance Post Paramount-Warner Bros. Merger", "link": "https://variety.com/2026/tv/news/george-cheeks-tv-role-skydance-paramount-warner-bros-merger-1236897948/", "summary": "Paramount TV media chair George Cheeks, whose domain has included all of CBS in addition to the Paramount cable networks, is said to be in line for an expanded oversight at the newly merged Paramount-Warner Bros. entity (which will be named “Skydance,” the company revealed Friday). Skydance would not comment, but Cheeks has been seen [ ]", "date_str": "2026-10-02T23:40:19+00:00", "hash": "4b884eb1f39b2017", "title_fa": "جورج چیکس ممکن است برای نقش تلویزیونی گسترده در Skydance Post Paramount-Warner Bros. Merger آماده شود.", "summary_fa": "جورج چیکس، رئیس رسانه تلویزیونی پارامونت، که دامنه آن علاوه بر شبکه های کابلی پارامونت، تمام شبکه CBS را نیز شامل می شود، گفته می شود که در صف نظارت گسترده بر نهاد تازه ادغام شده پارامونت-وارنر برادران (که «اسکای دنس» نامیده می شود، است. Skydance اظهار نظر نمی کند، اما Cheeks دیده شده است [ ] گمانه زنی ها و شایعات در مورد اینکه ساختار شبکه تلویزیونی و سمت استودیو چگونه ممکن است اجرا شود، در چند روز گذشته سنگین بوده است، حالا که این سوال که ساختار پخش در شرکت ادغام شده چگونه حل شده است (با رئیس HBO، کیسی بلویز و رئیس پارامونت مستقیم به مصرف کننده، سیندی). پرطرفدار در ورایتی بسیاری از سوالات در دنیای سنتی تر شبکه های تلویزیونی و استودیوهای هالیوودی که هنوز یک محرک بر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
