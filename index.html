ی بدون دخالت دست در بزرگراه‌ها و ناوبری شهری نقطه به نقطه هستند و قرار است از سال ۲۰۲۷ میلادی به‌صورت گسترده عرضه شوند. خودروساز آلمانی پس از تعلیق توسعه‌ی سامانه‌ی سطح ۳، تمرکز خود را به سیستم‌های سطح ۲ معطوف کرده است. سیستم هدایت شهری مرسدس بنز با نام MB.Drive Assist Pro، بیشتر وظایف رانندگی در معابر محلی و ترافیک سنگین شهری را بر عهده می‌گیرد. رانندگان بر خلاف سامانه‌ی رانندگی تمام خودران تسلا FSD، موظف به نگه‌داشتن دست‌های خود روی فرمان در مسیرهای شهری خواهند بود. تجهیزات سخت‌افزاری این سامانه شامل ۲۷ حسگر متشکل از ۱۰ دوربین، ۵ رادار و ۱۲ حسگر فراصوت می‌شود. پردازش داده‌ها از طریق یک کامپیوتر قدرتمند با توان ۲۵۴ تریلیون‌عملیات‌برثانیه بر بستر معماری نرم‌افزاری MB.OS انجام می‌شود. پردازشگر خودرو روی پشته‌ی نرم‌افزاری Drive AV متعلق به انویدیا عمل می‌کند و هوش مصنوعی خالص را با لایه‌ی ایمنی Halos در هم می‌آمیزد. سیستم کمکی بزرگراه قابلیت هدایت خودرو با سرعت حداکثر ۱۳۶ کیلومتربرساعت را در مسیرهای مجاز و کنترل‌شده فراهم می‌آورد. تغییر خط خودکار برای عبور از خودروهای کندتر یا خروج از بزرگراه نیز بخشی از این سازوکار است. مرسدس بنز ماه آینده برنامه‌ی دسترسی زودهنگام را در کالیفرنیا کلید می‌زند و خودروهای مرسدس بنز CLA، مرسدس بنز GLC، مرسدس بنز GLE، مرسدس بنز GLS و مرسدس بنز اس کلاس پشتیبانی از قابلیت‌های مذکور را دریافت خواهند کرد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/mercedes-benz-autonomous-driving-system-6afbf2262314debea39c0ad5?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia"], "datetime_fa": "۲۷ آبان • ۱۸:۴۵"}, {"source": "Zoomit", "title": "آیفون دوئو ۲ احتمالاً بدون فیس آیدی عرضه می‌شود و به تاچ آیدی وفادار می‌ماند", "link": "https://www.zoomit.ir/mobile/471431-iphone-duo-2-touch-id-face-id-rumor/", "summary": "گوشی آیفون دوئو ۲ احتمالاً با حسگر تاچ آیدی عرضه می‌شود و اضافه‌شدن فیس آیدی ممکن است تا نسل سوم به تعویق بیفتد.", "date_str": "2026-11-18T15:08:47+00:00", "hash": "3e980e8d28443811", "title_fa": "آیفون دوئو ۲ احتمالاً بدون فیس آیدی عرضه می‌شود و به تاچ آیدی وفادار می‌ماند", "summary_fa": "گوشی آیفون دوئو ۲ احتمالاً با حسگر تاچ آیدی عرضه می‌شود و اضافه‌شدن فیس آیدی ممکن است تا نسل سوم به تعویق بیفتد. تبلیغات افشاگری با نام Digital Chat Station در شبکه‌ی اجتماعی ویبو اعلام کرده است که نمونه‌های مهندسی آیفون دوئو ۲ همچنان به نمایشگر داخلی ۷٫۶ اینچی، نمایشگر بیرونی ۵٫۴ اینچی و حسگر اثر انگشت تعبیه‌شده در دکمه‌ی کناری مجهز هستند. این مشخصات با نسل اول آیفون دوئو تفاوتی ندارند و تاکنون نشانه‌ی مشخصی از اضافه‌شدن سیستم تشخیص چهره‌ی فیس آیدی به نسل دوم دیده نشده است. اپل در نخستین آیفون تاشدنی خود، برخلاف بیشتر آیفون‌های پرچم‌دار، از فیس آیدی استفاده نکرد و حسگر اثر انگشت تاچ آیدی را در دکمه‌ی پاور قرار داد. این تصمیم تا حد زیادی به محدودیت فضای داخلی گوشی و طراحی متفاوت آن مربوط می‌شود. در گوشی‌های معمولی، دوربین‌ها و حسگرهای فیس آیدی همواره در موقعیتی قرار دارند که هنگام استفاده از نمایشگر به سمت صورت کاربر باشند؛ اما طراحی تاشدنی آیفون دوئو چنین شرایطی را پیچیده‌تر می‌کند. به‌گفته‌ی Digital Chat Station، حتی اگر اپل بتواند حسگرهای فیس آیدی را در نمایشگر بیرونی قرار دهد، هنگام بازشدن گوشی این نمایشگر پشت دستگاه قرار می‌گیرد و دیگر رو به کاربر نخواهد بود. در چنین شرایطی، کاربر برای احراز هویت هنگام استفاده از نمایشگر داخلی باید گوشی را برگرداند یا دوباره از تاچ آیدی استفاده کند. این موضوع می‌تواند تجربه‌ی کاربری نامنسجمی ایجاد کند؛ به‌خصوص در کارهایی مانند تأیید پرداخت‌ها، ورود به حساب‌های کاربری و استفاده از برنامه‌های بانکی. تاچ آیدی در مقابل، بدون توجه به باز یا بسته‌بودن گوشی در دسترس است و با یک حسگر می‌تواند نیاز هر دو نمایشگر را برطرف کند. با وجود گزارش جدید، اپل ظاهراً توسعه‌ی فیس آیدی برای آیفون‌های تاشدنی را کنار نگذاشته است. مارک گرمن ، خبرنگار بلومبرگ، پیش‌تر گزارش داده بود که اپل نمونه‌های آزمایشی آیفون", "image_url": "https://api2.zoomit.ir/media/iphone-duo-apple-smartphone-6af33c1b1e22a6ae5bd3e98d?w=1920&q=75", "category": "موبایل و گجت‌ها", "tags": ["Apple"], "datetime_fa": "۲۷ آبان • ۱۸:۳۸"}, {"source": "Business Insider", "title": "I'm a professional baker who attended pastry school in France. Here are 7 tips for making the best pies.", "link": "https://www.businessinsider.com/tips-for-making-best-pies-from-professional-baker-2026-11", "summary": "As a professional baker who attended pastry school, I ve learned which techniques help create the best pies. jenifoto/Getty Images After attending pastry school in France, I've learned the secrets to making the best pies. I've found that using the coldest butter possible for the dough creates the flakiest crust. For busy baking seasons, I assemble and freeze fruit pies, so they're ready to bake weeks later. I'm a full-time baker who attended pastry school in France and worked in several bakeries in New York City. Pies are one of my favorite desserts to make for family and friends, no matter the occasion. Although they can seem intimidating, achieving a perfectly flaky crust and delicious filling comes down to a few simple techniques. Here are seven tips for making the best pies. For a flaky pie crust, I keep my butter cold. Allison Chen One of the most important things about making pie dough is keeping the butter as cold as possible. When the dough bakes, the water in the butter turns into steam, separating the crust into flaky layers. But if the butter melts at all before going into the oven, you won't get the same light, crisp texture. To ensure my crust is perfectly flaky, I always use cold butter straight from the fridge and try to work quickly when incorporating it into the flour. Instead of using my palms to break up the butter, I like to use my fingertips, since they conduct less heat. Luckily, the butter doesn't need to be fully mixed into the crust, since any visible chunks will turn into crispy flakes in the oven. I always chill the dough to prevent the crust from shrinking. 2GreenEyes/iStock One of the most common pie-baking problems is crust shrinkage, which can occur when overworked dough develops excessive gluten and contracts in the oven. To prevent this, I never stretch the dough to fit it into a pan. Instead, I lift it and let it settle into the corners — and if it isn't large enough, I gently roll it out a little. Additionally, I always refrigerate my pie dough after placing it in the pan, since that allows the gluten to relax while the butter firms up. Blind baking the crust helps avoid a soggy bottom. Allison Chen For pies with particularly wet fillings, like custard or pumpkin, I like to blind bake, or partially bake, the crust before adding the filling. This process gives the bottom of the crust a head start in the oven so it has time to develop structure and crisp up before coming into contact with the filling. Once the dough is in t", "date_str": "2026-11-18T15:03:01+00:00", "hash": "f9fae0733ae9cc2a", "title_fa": "من یک نانوای حرفه ای هستم که در مدرسه شیرینی در فرانسه تحصیل کردم. در اینجا 7 نکته برای درست کردن بهترین کیک ها وجود دارد.", "summary_fa": "به‌عنوان یک نانوای حرفه‌ای که در مدرسه شیرینی‌پزی تحصیل کرده‌ام، آموخته‌ام که کدام تکنیک‌ها به ایجاد بهترین کیک‌ها کمک می‌کنند. jenifoto/Getty Images پس از حضور در مدرسه شیرینی در فرانسه، اسرار درست کردن بهترین کیک ها را آموختم. من متوجه شده ام که استفاده از سردترین کره ممکن برای خمیر، پوسته پوسته ترین پوسته را ایجاد می کند. برای فصل‌های شلوغ پخت، پای میوه‌ها را جمع‌آوری و فریز می‌کنم، تا هفته‌ها بعد آماده پخت شوند. من یک نانوایی تمام وقت هستم که در مدرسه شیرینی در فرانسه تحصیل کردم و در چندین نانوایی در شهر نیویورک کار کردم. کیک ها یکی از دسرهای مورد علاقه من است که برای خانواده و دوستان، بدون توجه به موقعیت، درست می کنم. اگرچه آنها می توانند ترسناک به نظر برسند، اما دستیابی به یک پوسته کاملاً پوسته پوسته و پر کردن خوشمزه به چند تکنیک ساده بستگی دارد. در اینجا هفت نکته برای درست کردن بهترین کیک ها آورده شده است. برای پوسته پوسته پای، کره خود را سرد نگه می دارم. آلیسون چن یکی از مهمترین نکات در مورد تهیه خمیر پای سرد نگه داشتن کره تا حد امکان است. وقتی خمیر پخت، آب موجود در کره به بخار تبدیل می شود و پوسته را به لایه های پوسته پوسته جدا می کند. اما اگر کره قبل از رفتن به فر ذوب شود، همان بافت سبک و ترد را نخواهید داشت. برای اطمینان از اینکه پوسته من کاملاً پوسته پوسته است، من همیشه از کره سرد مستقیماً از یخچال استفاده می کنم و سعی می کنم هنگام اضافه کردن آن به آرد سریع عمل کند. به جای استفاده از کف دستم برای شکستن کره، دوست دارم از نوک انگشتانم استفاده کنم، زیرا حرارت کمتری را منتقل می کنند. خوشبختانه، کره نیازی به مخلوط کردن کامل با پوسته ندارد، زیرا هر تکه قابل", "image_url": "https://i.insider.com/6aee133f80d4b24f18346fd5?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۷ آبان • ۱۸:۳۳"}, {"source": "Business Insider", "title": "Another short-seller announces a bet against Nvidia over possible ties to China", "link": "https://www.businessinsider.com/short-seller-nvidia-china-smci-gpu-sales-nvda-earnings-2026-11", "summary": "David Paul Morris/Bloomberg via Getty Images Muddy Waters revealed a bet against Nvidia head of its latest earnings report. Its thesis centered around the potential ties to an executive at SMCI. Muddy Waters pointed to a lawsuit that said Cenly Chen was involved in illicit GPU sales. Another short-seller is betting against Nvidia over problems it sees with alleged ties to China. Muddy Waters, the activist short-seller run by Carson Block, unveiled a bearish bet ahead of the chip giant's earnings on Tuesday . The firm's report centers around alleged ties between former company executive Ajay Puri and Cenly Chen, an executive at Super Micro Computer with whom he had been repeatedly photographed during his time at Nvidia. The report cites a class-action lawsuit against Super Micro Computer that says a woman named Cenly Chen managed the acquisition and distribution of Nvidia GPUs. Muddy Waters shared several photos of Puri and with a woman identified as Cenly Chen, taken between 2024 and 2026. It noted that Super Micro Computer did not respond to requests to confirm if the woman photographed was the sa rs، فعالی که توسط کارسون بلاک اداره می شود، پیش از درآمد غول تراشه در روز سه شنبه از یک شرط نزولی رونمایی کرد. گزارش این شرکت حول روابط ادعایی بین آجی پوری، مدیر اجرایی سابق شرکت و سنلی چن، یکی از مدیران شرکت Super Micro Computer که در طول مدت حضورش در انویدیا بارها از او عکس گرفته شده است، متمرکز است. این گزارش به یک شکایت دسته جمعی علیه Super Micro Computer اشاره می کند که می گوید زنی به نام Cenly Chen خرید و توزیع پردازنده های گرافیکی Nvidia را مدیریت کرده است. Muddy Waters چندین عکس از پوری و با زنی به نام Cenly Chen را که بین سال‌های 2024 و 2026 گرفته شده‌اند به اشتراک گذاشت. اشاره کرد که Super Micro Computer به درخواست‌ها برای تأیید اینکه آیا زن عکس‌برداری شده همان Cenly Chen است که در آنجا نقش‌هایی از جمله مدیر ارشد رشد و مدیر عامل داشت یا خیر پاسخ نداد. Super Micro Computer، یک زیرساخت و تولید سخت افزار هوش مصنوعی، در گذشته تحت نظارت قانونی قرار گرفته است. در مارس 2026، یکی از بنیانگذاران آن بخشی از گروهی بود که به دلیل قاچاق غیرقانونی قطعات تراشه هوش مصنوعی به چین دستگیر شد. «در ماه مارس سال جاری، ایالات متحده گزارش مادی واترز خاطرنشان کرد که سه فرد مرتبط با SMCI، از جمله یکی از", "image_url": "https://i.insider.com/6afcd2db68dc6b6660b83fad?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه"], "datetime_fa": "۲۷ آبان • ۱۸:۰۴"}, {"source": "Business Insider", "title": "I'm a travel advisor who plans luxury trips to Italy. Here are 5 mistakes I see travelers make again and again.", "link": "https://www.businessinsider.com/italy-trip-things-you-should-never-do-travel-advisor-tips-2026-11", "summary": "As a travel advisor, I know there are a few things you should never do when traveling to Italy. Vanessa Kromer I've worked as a travel advisor for 16 years and have sent clients on luxury Italian vacations. As someone who also loves traveling to Italy, I've seen my fair share of common tourist mistakes . In my experience, overpacking or changing hotels too many times can ruin a trip. As a luxury travel advisor, I've sent hundreds of clients to Italy over the past 16 years. Plus, as someone who loves traveling there myself (I typically take two or three trips to Italy each year), I've seen many tourists make the same mistakes repeatedly. Here are the things I always tell clients to avoid when traveling to Italy. Changing hotels too many times can ruin a trip. Vanessa Kromer Many travelers I work with want to visit three to five Italian cities in nine days, changing hotels every two nights or less. In my opinion, though, the only souvenirs these travelers will come home with are extreme sleep deprivation and zero memory of what they actually did or saw. Instead, I recommend two or three hotel changes at the most. This way, they're not living out of a suitcase for the entire trip and can really enjoy each destination. Many travelers feel obligated to visit famous attractions, regardless of their personal interests. Vanessa Kromer I find that many travelers add popular tourist destinations to their itineraries just to check them off their travel bucket lists. In my opinion, though, this is a waste of valuable vacation time. For example, if you have zero desire to see The Vatican or the Colosseum, you can fill that time with something totally amazing in Rome that piques your interest. Or, if you don't drink wine, I recommend spending free time in smaller Tuscan cities like Siena or Lucca instead of at a winery. At the end of the day, it's important to craft your Italian vacation itinerary around your desires. Because trust me — there's something for everyone. Overpacking makes travel less convenient. Vanessa Kromer Less is always more when it comes to packing for an international trip , and Italy is no exception. Far too many times, I've gone to Venice and seen people with large checked bags trying to drag them up and over hundreds of steps to their hotels. Plus, there are sometimes luggage limits on taxis, trains, and ferries. That's why I always aim to travel with just a carry-on. To do this, I alway recommend packing layers and a combination of mix-and-match", "date_str": "2026-11-18T14:33:39+00:00", "hash": "5ae98e2ef876a65e", "title_fa": "من یک مشاور سفر هستم که برای سفرهای لوکس به ایتالیا برنامه ریزی می کنم. در اینجا 5 اشتباهی وجود دارد که می بینم مسافران بارها و بارها مرتکب می شوند.", "summary_fa": "به عنوان یک مشاور سفر، می دانم چند کار وجود دارد که هرگز نباید در سفر به ایتالیا انجام دهید. ونسا کرومر من به مدت 16 سال به عنوان مشاور سفر کار کرده ام و مشتریان خود را به تعطیلات لوکس ایتالیایی فرستاده ام. من به عنوان کسی که عاشق سفر به ایتالیا هستم، اشتباهات رایج توریستی را دیده ام. در تجربه من، بسته بندی بیش از حد یا تغییر چندباره هتل می تواند یک سفر را خراب کند. من به عنوان یک مشاور سفرهای لوکس، صدها مشتری را در 16 سال گذشته به ایتالیا فرستاده ام. به‌علاوه، به‌عنوان کسی که خودم عاشق سفر به آنجا هستم (معمولاً هر سال دو یا سه سفر به ایتالیا می‌روم)، توریست‌های زیادی را دیده‌ام که به طور مکرر اشتباهات مشابهی را مرتکب می‌شوند. در اینجا چیزهایی است که من همیشه به مشتریان می گویم که هنگام سفر به ایتالیا از آن اجتناب کنند. تغییر مکرر هتل می تواند یک سفر را خراب کند. ونسا کرومر بسیاری از مسافرانی که با آنها کار می‌کنم می‌خواهند از سه تا پنج شهر ایتالیا در 9 روز بازدید کنند و هر دو شب یا کمتر هتل را عوض کنند. با این حال، به نظر من، تنها سوغاتی‌هایی که این مسافران با آن به خانه می‌آیند، محرومیت شدید از خواب و حافظه صفر از آنچه واقعاً انجام داده‌اند یا دیده‌اند است. در عوض، من حداکثر دو یا سه تغییر هتل را توصیه می کنم. به این ترتیب، آنها در تمام طول سفر از چمدان زندگی نمی کنند و می توانند واقعاً از هر مقصد لذت ببرند. بسیاری از مسافران خود را موظف به بازدید از جاذبه های معروف بدون توجه به علایق شخصی خود می دانند. ونسا کرومر من متوجه شده‌ام که بسیاری از مسافران مقصدهای توریستی محبوب را فقط برای اینکه از لیست آرزوهای سفرشان خط بزنند،", "image_url": "https://i.insider.com/6afcc82168dc6b6660b83f1a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۷ آبان • ۱۸:۰۳"}, {"source": "Business Insider", "title": "States where people spend the most on college education, ranked", "link": "https://www.businessinsider.com/states-college-education-costs-ranked", "summary": "Rhode Island has the highest cost of attending college in the US, when measured by the share of household income. Wolterk/Getty Images On average, a college education in the US accounts for more than half of a year's household income. Several US colleges have annual costs of attendance of over $100,000 in 2026. Rhode Island has the highest cost of education as a share of income, while Utah has the lowest. The cost of higher education is rising across the board, but in some states, getting a college degree is more expensive than in others. A recent WalletHub study examined how the cost of an in-state college education compares across US states and ranked them on affordability. The study examined each state's average cost of attending an in-state public college full-time and compared it to the state's median annual household income , using data from the US Census Bureau and the National Center for Education Statistics. The study doesn't include Alaska and Wyoming due to data limitations. In states like Rhode Island, which was ranked as the state with the highest college education costs, a $79,194-a-year undergraduate degree can cost up to 90.2% of the median household income. Meanwhile, in Utah, which has the lowest cost of education as a percentage of median income , a degree costs only 27.58% of an annual household income. Even in the most affordable state, a college education costs more than a quarter of a year's income, and in 21 states, it costs more than half a year's income. See how each state ranks in terms of how a median household income compares to the average public in-state college's cost of attendance . 48. Utah University of Utah in Salt Lake City, Utah. Ladanifer/Getty Images College costs as a percentage of median household income: 27.58% 47. Hawaii University of Hawaii at Manoa in Honolulu. m سط ​​خانوار هزینه داشته باشد. در همین حال، در یوتا، که کمترین هزینه تحصیل را به عنوان درصد درآمد متوسط ​​دارد، یک مدرک تنها 27.58 درصد از درآمد سالانه خانواده هزینه دارد. حتی در مقرون به صرفه ترین ایالت، هزینه تحصیل در دانشگاه بیش از یک چهارم درآمد سال است و در 21 ایالت، بیش از نیمی از درآمد یک سال هزینه دارد. ببینید که هر ایالت از نظر نحوه مقایسه درآمد متوسط ​​خانوار با میانگین هزینه", "image_url": "https://i.insider.com/6afb255e5aab055bb6442241?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۷ آبان • ۱۷:۱۷"}, {"source": "Business Insider", "title": "Cruises sound pretty awful. People are still booking them more than ever.", "link": "https://www.businessinsider.com/why-cruises-popular-sound-awful-experts-2026-11", "summary": "Headlines may seem like they re scaring away potential cruisers, but a lot of people are still setting sail. Britt Erlanson/Getty Images Before 2019, the last place you'd see Mark Jessup was on a cruise ship. As the long-standing stereotype goes, \"I thought it was just for old people,\" the 47-year-old skincare company owner recalled thinking. The fear of seasickness certainly didn't entice him either. Actually, nothing did — until his coworkers dragged him, then an unwilling 39-year-old post-office worker, on his first vacation at sea in late 2019 aboard Carnival Sunshine. \"The rest was history,\" Jessup, who's now a travel content creator known on social media as Mark J, told Business Insider. Since then (and even following an industry-wide pause amid the COVID-19 pandemic), the cynic-turned-fan has been on 56 floating resorts. Jessup cruises every month, usually on four- to seven-day voyages, and even relocated from Massachusetts to Florida three years ago, both for the weather and to be closer to cruise ports. He enjoys the convenience of the onboard gym and food, as well as the ability to unplug from his phone. \"I like traveling, and I realized it was just so much easier for me to       media: [{"source": "Billboard", "title": "The New Mariah Carey Barbie Signature Doll Looks Identical to the ‘All I Want for Christmas Is You’ Singer: Shop Here", "link": "https://www.billboard.com/culture/product-recommendations/mariah-carey-2026-christmas-barbie-doll-shop-online-1236384511/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Mariah Carey defrosted and walked straight out of Mattel headquarters. Just in time for the holidays, the Queen of Christmas is adding to her Christmas merch with another Barbie Signature Mariah Carey Doll, one that looks almost eerily identical to the pop superstar herself. The festive collectible is dressed in the singer&#x2019;s iconic look from 1994&#x2019;s &#x201C;All I Want for Christmas Is You&#x201D; music video. This isn&#x2019;t Carey&#x2019;s first time getting the Barbie treatment. Her 2023 Christmas doll was such a hit that its initial release sold out in less than 24 hours. While fans can still hunt down that original edition from Walmart via online resellers, this year&#x2019;s new must-have brings the &#x2019;90s music video, in particular, to life. The 2026 doll will be available Nov. 18 for $80 at Amazon , Target and other major retailers. CHRISTMAS EDITION Barbie Signature Mariah Carey Christmas Doll $80 Buy Now at amazon $80 Buy Now at target The doll is fitted with a red Santa Claus-esque jumpsuit, belt, black ankle boots, dazzling jewelry and ultra-long hair. Released 32 years ago, &#x201C;All I Want for Christmas Is You&#x201D; has grown from a festive pop hit into one of the most recognizable Christmas songs of all time. The track continues to dominate holiday playlists and make its annual return to the Billboard Hot 100 every year, even reaching No. 1 for the first time in 2019 . Jason Tidwell/Mattel Of course, the song&#x2019;s cultural staying power extends well beyond the charts. Every Halloween, the Internet eagerly anticipates the moment Carey officially comes out of hibernation, with fans joking that the singer defrosts at the stroke of midnight on Nov. 1. Carey has fully embraced the tradition, making her annual transition into the Christmas season an event of its own through playful social media videos and festive marketing campaigns, like her yearly &#x201C;It&#x2019;s time&#x201D; video announcements . Now, she&#x2019;s bringing that unmistakable holiday energy to Barbie once again, giving fans another reason to celebrate the most wonderful time of the year. Cody Tatro/Mattel", "date_str": "2026-11-18T16:00:00+00:00", "hash": "28ab0bd9ede33bd3", "title_fa": "عروسک امضاکننده باربی جدید ماریا کری شبیه به خواننده \"همه چیزی که برای کریسمس می خواهم تو هستی\" است: از اینجا خرید کنید", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. ماریا کری یخ زدایی کرد و مستقیماً از دفتر مرکزی متل خارج شد. درست در زمان تعطیلات، ملکه کریسمس با یک عروسک امضاکننده باربی دیگر ماریا کری به کالاهای کریسمس خود اضافه می کند، عروسکی که تقریباً به طرز وحشتناکی شبیه به خود سوپراستار پاپ است. این کلکسیون جشن با ظاهر نمادین این خواننده از موزیک ویدیوی \"All I Want for Christmas Is You\" محصول 1994 پوشیده شده است. این اولین باری نیست که کری تحت درمان باربی قرار می گیرد. عروسک کریسمس 2023 او چنان موفق بود که عرضه اولیه آن در کمتر از 24 ساعت به فروش رفت. در حالی که طرفداران هنوز هم می توانند نسخه اصلی والمارت را از طریق فروشندگان آنلاین دنبال کنند، موزیک ویدیوی جدید امسال به ویژه موزیک ویدیوی دهه 90 را زنده می کند. عروسک 2026 در 18 نوامبر با قیمت 80 دلار در آمازون، تارگت و سایر خرده فروشان بزرگ در دسترس خواهد بود. نسخه کریسمس عروسک کریسمس باربی سیگنیچر ماریا کری 80 دلار همین حالا از آمازون بخرید 80 دلار همین حالا از تارگت بخرید این عروسک یک لباس یک‌سره قرمز شبیه لباس بابانوئل، کمربند، نیم‌بوت‌های مشکی، جواهرات خیره‌کننده و موهای بسیار بلند دارد. «All I Want for Christmas Is You» که 32 سال پیش منتشر شد، از یک آهنگ پاپ شاد به یکی از شناخته‌شده‌ترین آهنگ‌های کریسمس در تمام دوران تبدیل شده است. این آهنگ همچنان بر لیست‌های پخش تعطیلات تسلط دارد و هر سال به بیلبورد Hot 100 بازمی‌گردد، حتی برای اولین بار در سال 2019 به رتبه 1 می‌رسد. جیسون تیدول/متل", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Shop-Mariah-Carey-Christmas-Barbie-Signature-doll-online.png?w=720", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "As the 2026 CMA Awards Are Presented Tonight, Here Are the Races We’re Watching", "link": "https://www.billboard.com/lists/2026-cma-awards-races-to-watch/", "summary": "Many records could be set when the 60th annual CMA Awards are presented tonight (Nov. 18) at Bridgestone Arena in Nashville. One already was set was this morning, with the announcement of winners in two categories on Good Morning America . Tim McGraw won musical event of the year for a record fifth time for “McArthur,” a collab with HARDY , Eric Church and Morgan Wallen . McGraw’s previous wins in the category are for “It’s Your Love” (with Faith Hill); “Find Out Who Your Friends Are (with Tracy Lawrence and Kenny Chesney); “Feel Like a Rock Star” (with Chesney); and “Highway Don’t Care” (with Taylor Swift and Keith Urban). McGraw’s fifth win in the category allows him to break out of a tie with Brad Paisley, Urban, Chesney and Vince Gill, who have won four times each. Related 2026 CMA Awards Predictions: Who Will Win? The 60th annual CMA Awards will air live on ABC tonight at 8:00 p.m. and will stream simultaneously on Disney+ for the first time. (It will be available the next day on Hulu.) Lainey Wilson is set to host the show for the second year in a row. She’ll become the first woman to solo-host the show twice. Dolly Parton and Reba McEntire each did the honors once, in 1988 and 1991, respectively. The CMA Awards present awards to music creators in just 12 categories, compared to a whopping 100 categories at the upcoming Grammy Awards. If you don’t watch the CMA Awards faithfully, this would be a very good year to check in. Three of the five nominees for single of the year made the top five on the Billboard Hot 100, the first time in more than 50 years that that has happened. Here are various records that could be set at the 60th annual CMA Awards.", "date_str": "2026-11-18T15:50:00+00:00", "hash": "0f8f9b135a5da4b5", "title_fa": "با اهدای جوایز CMA 2026 امشب، در اینجا مسابقاتی هستند که ما تماشا می کنیم", "summary_fa": "هنگامی که شصتمین جوایز سالانه CMA امشب (18 نوامبر) در Bridgestone Arena در نشویل برگزار می شود، می توان رکوردهای بسیاری را ثبت کرد. یکی از این رویدادها امروز صبح با اعلام برندگان در دو دسته در صبح بخیر آمریکا تنظیم شده بود. تیم مک‌گرو برای پنجمین بار برای «مک آرتور» که همکاری با هاردی، اریک چرچ و مورگان والن بود، برنده رویداد موسیقی سال شد. برنده های قبلی مک گرو در این رده برای «این عشق توست» (با Faith Hill) است. «پیدا کن که دوستانت چه کسانی هستند (با تریسی لارنس و کنی چسنی)؛ «احساس مثل ستاره راک» (با چسنی)؛ و «بزرگراه مهم نیست» (با تیلور سویفت و کیت اوربان). پنجمین برد مک‌گرو در این رده به او اجازه می‌دهد تا از یک تساوی با اوربانین وی، چهار بار برنده، چنی و براد پیس برنده شود. پیش‌بینی‌های مربوط به جوایز CMA 2026: چه کسی برنده خواهد شد؟ شصتمین دوره جوایز سالانه CMA امشب ساعت 20:00 به صورت زنده از شبکه ABC پخش خواهد شد. و برای اولین بار به طور همزمان در دیزنی + پخش خواهد شد. (روز بعد در Hulu در دسترس خواهد بود.) Lainey Wilson قرار است برای دومین سال متوالی میزبان این برنامه باشد. او اولین زنی خواهد بود که دو بار مجری انفرادی این نمایش را بر عهده دارد. دالی پارتون و ربا مک انتایر هر کدام یک بار به ترتیب در سال های 1988 و 1991 این افتخارات را کسب کردند. جوایز CMA به سازندگان موسیقی تنها در 12 دسته جایزه می‌دهند، در حالی که جوایز گرمی پیش‌رو در 100 دسته جایزه اهدا می‌کند. اگر جوایز CMA را به طور منظم تماشا نمی‌کنید، امسال سال بسیار خوبی برای تماشای آن است. سه نفر از پنج نامزد دریافت جایزه تک‌آهنگ سال، در فهرست پنج آهنگ برتر Billboard Hot 100 قرار گرفتند، که برای اولین بار", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/2247566252-e1790701452269.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۹:۲۰"}, {"source": "Billboard", "title": "Rod Wave Indicted on Drug & Gun Charges for Items Allegedly Found in Car After Speeding Stop", "link": "https://www.billboard.com/business/legal/rod-wave-indicted-drug-gun-charges-reckless-driving-stop-1236384773/", "summary": "Rod Wave has been indicted on felony gun and drug charges in Atlanta. In an indictment obtained by Billboard , Fulton County prosecutors accuse the 28-year old hitmaker (born Rodarius Green) of unlawfully possessing oxycodone and a pistol when he was pulled over last year for reckless driving. His attorney did not immediately return a request for comment. The charges filed in October and unsealed this week – stem from the Nov. 7, 2025, incident in which Wave was arrested for allegedly speeding though a stop sign. Atlanta police said he had a .40 caliber Glock with a high-capacity magazine in his waistband as well as drugs and a 9mm handgun in the car, according to Atlanta News First . That arrest happened on the very same day that Wave received his first Grammy nomination for his title track from the critically acclaimed 2025 film Sinners . The rapper was quickly released on $8,000 bail the next day. In a statement to Billboard at the time, Rod Wave’s attorney Drew Findling said his client had been “unjustly profiled and unlawfully arrested” by a controversial Atlanta police unit known for its allegedly “aggressive tactics and emphasis on high arrest numbers.” “Mr. Green was targeted as part of this quota-driven approach, a practice that undermines y leader, would make history as the first Black speaker of the chamber. He also would be second in line for the presidency, after Vice President JD Vance. The [ ]", "date_str": "2026-11-18T15:56:28+00:00", "hash": "4b306a2c2426a722", "title_fa": "حکیم جفریس پس از جلب حمایت قاطع گروه دموکرات، آماده است تا رئیس مجلس بعدی شود", "summary_fa": "پس از آنکه دموکرات‌ها در رای گیری گروهی در روز چهارشنبه او را نامزد کردند، حکیم جفریس در آستانه تبدیل شدن به رئیس بعدی مجلس است. جفریس که در حال حاضر رهبر اقلیت مجلس نمایندگان است، به عنوان اولین سخنران سیاه پوست این مجلس تاریخ را ثبت کرد. او همچنین پس از معاون رئیس جمهور جی دی ونس، در ردیف دوم ریاست جمهوری قرار خواهد گرفت. انتخابات [ ] زمانی برگزار خواهد شد که اعضای جدید در ژانویه سوگند یاد کنند. سی ان ان و سایر رسانه ها گزارش دادند که رای نزدیک نبود: جفریس 251 رای بله و 11 رای منفی به دست آورد. انتظار می‌رود که دموکرات‌ها حدود 260 کرسی را در زمان شروع کنگره بعدی در اختیار داشته باشند، در مقابل جمهوری‌خواهان 175 کرسی. در سنا، تلاش چاک شومر، رهبر اقلیت برای بازگشت به رهبر اکثریت، زمانی که دموکرات‌ها کنترل را در دست گرفتند، توسط سناتور کریس ون هولن (D-MD) به چالش کشیده شد، که گفته است نتایج میان دوره‌ای نشان داد که رای‌دهندگان به دنبال تغییر هستند. شومر تاکید کرده است که در نبرد رهبری که انتظار می رود ماه آینده برگزار شود، پیروز خواهد شد. در صورت انتخاب شدن در ژانویه، جفریس جانشین مایک جانسون جمهوری‌خواه خواهد شد که پس از انتخابات میان‌دوره‌ای، رهبری حزب جمهوری‌خواه را ترک کرد. هفته گذشته، گروه حزب جمهوریخواه، نماینده جیم جردن (R-OH) را به عنوان رهبر اقلیت در کنگره بعدی انتخاب کردند. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید.", "image_url": "https://deadline.com/wp-content/uploads/2025/03/GettyImages-2203037679.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲۷ آبان • ۱۹:۲۶"}, {"source": "Deadline", "title": "Democrats Boycott Senate Commerce Committee Vote To Advance Republican FCC Nominee", "link": "https://deadline.com/2026/11/fcc-nominee-democrats-boycott-trump-1237227971/", "summary": "Democrats boycotted a Senate Commerce Committee markup on Wednesday in protest of efforts to advance the nomination of a sole Republican to the FCC. Danielle Thumann Severs was nominated by Donald Trump to fill a vacancy on the commission, which is currently split 2-1 with a Republican majority. Democrats objected that the nomination was not [ ]", "date_str": "2026-11-18T15:43:47+00:00", "hash": "ec2e77b31acf170b", "title_fa": "دموکرات ها رای کمیته بازرگانی سنا را به پیشبرد نامزد جمهوری خواه FCC تحریم کردند", "summary_fa": "دموکرات‌ها روز چهارشنبه در اعتراض به تلاش‌ها برای پیشبرد نامزدی تنها یک جمهوری‌خواه برای FCC، یک کمیته بازرگانی سنا را تحریم کردند. دانیل تومان سیورز توسط دونالد ترامپ برای پر کردن جای خالی کمیسیون که در حال حاضر با اکثریت جمهوریخواهان 2-1 تقسیم شده است، نامزد شد. دموکرات‌ها مخالفت کردند که نامزدی [ ] نیست. سناتور ماریا کانتول (D-WA)، دموکرات ارشد کمیته، در بیانیه‌ای گفت که آنها برای رئیس فعلی کمیته، سناتور، شفاف‌سازی کردند. تد کروز (R-TX) که ما نگرانی هایی در مورد معرفی نامزد داشتیم و درخواست کردیم که او از نشانه گذاری خارج شود. اخبار مرتبط: آزمایش سیستم پخش اضطراری اخبار هنوز برای امروز ادامه دارد، امنیت داخلی می‌گوید اخبار یک روز دیگر، یک قطعی دیگر: همانطور که CNN گزارش می‌دهد شبکه NSA از کار افتاده است، رسانه‌ها حوادث پشت سر هم هرج و مرج سایبری را تصاحب می‌کنند. این مشکلی نیست که ما ایجاد کرده ایم، بلکه مشکلی است که کاخ سفید باید آن را حل کند. دموکرات‌ها می‌ترسند که با تایید تومان سیورز، ترامپ گومز را اخراج کند و حزب هیچ نماینده‌ای در کمیسیون نداشته باشد. اگر ترامپ اکنون گومز را اخراج می کرد، FCC فقط دو عضو داشت و بدون حد نصاب می ماند. گومز از منتقدان صریح برندان کار، رئیس FCC، منصوب ترامپ بوده است و مدعی است که او درگیر یک کمپین سانسور و کنترل برای محدود کردن سخنرانی صدا و سیما و روزنامه نگاران منتقد دولت بوده است. کمیته بازرگانی سنا تنها با آرای جمهوری خواهان، نامزدی سرورهای تومن را مثبت گزارش کرد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/GettyImages-2261281095.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۲۷ آبان • ۱۹:۱۳"}, {"source": "Deadline", "title": "‘Grand Theft Auto VI’: Could Video Game Franchise Become Film Or TV Show? “We’re Very, Very Selective,” Says Take-Two CEO", "link": "https://deadline.com/2026/11/grand-theft-auto-6-could-be-tv-show-film-1237227890/", "summary": "The world is currently being swept up by the latest Grand Theft Auto video game, but could the record-setting franchise one day be a TV series or movie? The answer, according to Take-Two CEO Strauss Zelnick: Maybe, in the right circumstances. Prior to Grand Theft Auto VI breaking pre-sales records ahead of its official global [ ]", "date_str": "2026-11-18T15:10:34+00:00", "hash": "f7e4bec0bd07e80a", "title_fa": "\"Grand Theft Auto VI\": آیا فرانچایز بازی های ویدئویی می تواند به فیلم یا نمایش تلویزیونی تبدیل شود؟ مدیرعامل Take-Two می‌گوید: «ما بسیار، بسیار انتخابی هستیم».", "summary_fa": "جهان در حال حاضر توسط جدیدترین بازی ویدیویی Grand Theft Auto در حال غرق شدن است، اما آیا این فرانچایز رکورددار روزی یک سریال یا فیلم تلویزیونی است؟ پاسخ به گفته استراوس زلنیک، مدیرعامل Take-Two: شاید در شرایط مناسب. زلنیک گفت: قبل از اینکه Grand Theft Auto VI رکوردهای پیش فروش را پیش از رسمی جهانی خود بشکند [ ] ما در مورد توسعه خطوط بسیار مراقب هستیم زیرا این شرکت خلاقانه است و هدف ما ایجاد بهترین سرگرمی روی زمین است – سرگرمی هایی که همیشه به آن افتخار می کنیم. اگر تیم‌های خلاق ما به آن علاقه داشتند - اگر فکر می‌کردند به نحوی مشتریان ما را درگیر می‌کنند و خوشحال می‌شوند، یک فیلم یا برنامه تلویزیونی بر اساس مالکیت معنوی خود می‌سازیم. انجام این کار یک نوار بالاست و البته همیشه خطر شکست وجود دارد. بنابراین ما آن را رد نمی کنیم، اما ما بسیار بسیار انتخابی هستیم. Watch on Deadline جک بلک قبلاً تمایل خود را برای حضور در یک عنوان Grand Theft Auto یا یکی دیگر از بازی‌های Rockstar ابراز کرده بود، اگرچه Dan Houser، یکی از بازیگران کلیدی در توسعه این فرنچایز، قبلاً هشدار داده بود که فیلمی بعید است که هرگز ساخته شود. بازی‌های ویدیویی پرفروش به پایگاه‌های محکمی برای اقتباس‌های تلویزیونی و سینمایی تبدیل شده‌اند، با نتفلیکس که The Witcher را به چندین فصل می‌برد، HBO برای نسخه‌اش The Last of Us مورد تحسین منتقدان قرار گرفت و فیلم‌هایی مانند Super Mario Bros، Sonic the Hedgehog و Minecraft همگی دارای فیلم‌های موفقی بودند که در سال‌های اخیر اکران شده‌اند. حلقه های الدن اخیراً در بازار فیلم آمریکا خرید می شد. با این حال، Grand Theft Auto هرگز اقتباس نشده است، شاید به دلیل طبیعت گسترده و وحشی آن و هر بازی که قهرمانان و شهرهای جدیدی را معرفی می کند.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Grand-Theft-Auto-6-e1795013202522.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۲۷ آبان • ۱۸:۴۰"}, {"source": "Deadline", "title": "‘Grand Theft Auto VI’: What The Critics Are Saying As The Rockstar Games Series Finally Returns", "link": "https://deadline.com/2026/11/grand-theft-auto-6-what-the-critics-reviews-1237227874/", "summary": "Grand Theft Auto is finally back. The sixth edition in the long-running Rockstar Games series returned this morning, and it has earned rave reviews from critics. In a glowing New York Times review titled Grand Theft Auto VI Will Steal Your Heart, writer Yussef Cole said the game showed “surprising depth,” anchored by its two [ ]", "date_str": "2026-11-18T15:02:55+00:00", "hash": "24cf15faee78a237", "title_fa": "\"Grand Theft Auto VI\": آنچه منتقدان می گویند به عنوان سری بازی های Rockstar در نهایت بازگشت", "summary_fa": "Grand Theft Auto بالاخره بازگشت. ششمین نسخه از سری طولانی‌مدت بازی Rockstar Games امروز صبح بازگشت و نقدهای مثبتی را از سوی منتقدان دریافت کرد. یوسف کول، نویسنده، در یک بررسی درخشان نیویورک تایمز با عنوان Grand Theft Auto VI Will Your Heart گفت که بازی «عمق شگفت‌انگیزی» را نشان می‌دهد، که توسط دو آن تثبیت می‌شود [ ] «ماهیت روایت به جای داستانی در مورد استیصال و بقا، و تنش ناشی از پرتاب کردن همه چیز بی‌ارزش و بی‌ارزش است. کول اضافه کرد که این بازی \"تا حد زیادی انتظارات فوق العاده خود را برآورده می کند.\" Watch on Deadline در یک بررسی پنج ستاره، گاردین گفت که Rockstar «فوق‌العاده‌ترین و پرجزئیات‌ترین دنیای مجازی را که تاکنون دیده‌ایم ایجاد کرده است». منتقد به شوخی گفت: «بازبینی آن کمی شبیه تلاش برای مرور، مثلاً پاریس است: آنقدر تجربیات بالقوه دارد که سخت است بدانید از کجا شروع کنید. واشنگتن پست در بررسی درخشان دیگری GTA VI را یک «حماسه شگفت‌انگیز آمریکایی» توصیف کرد. این روزنامه می‌گوید: «Grand Theft Auto VI که توسط ده‌ها هزار نفر نوشته، برنامه‌ریزی و اجرا شده است، بیش از یک بازی ویدیویی معمولی است؛ این مجموعه بزرگی از اشکال هنری و استعدادها، یک اطلس فرهنگی سرکش و جامع از زندگی و آداب آمریکایی است». \"پیروزی آن در برخوردهایی است که من توضیح دادم، جایی که نژاد، طبقه، جنسیت، پول و توجه شرایط ما و تصمیمی که در مورد آنها انجام می دهیم را شکل می دهند.\" بلومبرگ گفته است که این بازی یک «شاهکار» است که چنان «وفاداری گرافیکی واقعی» را به تصویر می‌کشد که تشخیص این بازی ویدیویی از فیلم‌های واقعی دشوار است.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/GettyImages-2305520238.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۷ آبان • ۱۸:۳۲"}, {"source": "Netflix NL", "title": "Serie van 300 miljoen eindelijk terug op Netflix", "link": "https://www.netflix-nederland.nl/serie-van-300-miljoen-eindelijk-terug-op-netflix/", "summary": "Het kost tegenwoordig nogal wat om een serie te maken, maar dan heb je natuurlijk altijd baas boven baas. En seizoen 1 van 3 Body Problem was zo n baas boven baas , want daar werd bijna 300 miljoen dollar voor uitgetrokken. 3 Body Problem keert terug op Netflix Toen 3 Body Problem op Netflix uitkwam in 2024 was deze show de op één na duurste serie in de geschiedenis van de streamingdienst, na het vierde seizoen van Stranger Things. Inmiddels heeft seizoen 5 van die show dat record al weer verbroken, met een budget van 60 miljoen euro per aflevering. Nu keert 3 Body Problem terug op Netflix met een tweede seizoen, waarvan de kosten overigens nog niet bekend zijn. Binnenkort kun je aan de slag gaan met nieuwe afleveringen! Verhaal 3 Body Problem Omdat het goed mogelijk is dat je niet meer weet hoe de serie in kwestie precies in elkaar steekt, helpen we je een handje. Het verhaal draait om Ye Wenjie, een briljante Chinese astrofysicus die in de jaren zestig getuige is van de gewelddadige dood van haar vader. Ze wordt vervolgens naar een afgelegen militaire basis gestuurd, waar wetenschappers in het geheim experimenteren met het versturen van signalen naar de ruimte. Wat Ye daar ontdekt en besluit te doen, zet een reeks gebeurtenissen in gang die pas veel later duidelijk worden. In het heden worden wetenschappers over de hele wereld geconfronteerd met onverklaarbare verschijnselen. Natuurkundige experimenten leveren plotseling onmogelijke resultaten op en verschillende vooraanstaande onderzoekers sterven onder mysterieuze omstandigheden. Ook beginnen sommige wetenschappers vreemde aftellingen te zien die niemand anders kan waarnemen. Wanneer een groep voormalige studievrienden uit Oxford bij de gebeurtenissen betrokken raakt, proberen ze te achterhalen wat er aan de hand is. Een van hen, Jin Cheng, krijgt toegang tot een bijzonder geavanceerd virtualrealityspel waarin ze een buitenaardse wereld moet zien te redden. Op deze planeet zorgen drie zonnen voor extreme en onvoorspelbare omstandigheden, waardoor beschavingen telkens opnieuw worden vernietigd. Langzaam ontdekken de vrienden dat het spel veel meer is dan een vorm van entertainment. Het blijkt verbonden te zijn met een buitenaardse beschaving die contact heeft gelegd met de aarde. Bovendien zijn er mensen die deze buitenaardse bezoekers als de redding van de mensheid beschouwen, terwijl anderen vrezen dat hun komst het einde van de menselijke beschaving zal betekenen. Ondertussen probeert een internation", "date_str": "2026-11-18T15:13:53+00:00", "hash": "3dc26397ff1f7734", "title_fa": "سریال 300 میلیونی بالاخره به نتفلیکس بازگشت", "summary_fa": "امروزه ساخت یک سریال هزینه زیادی دارد، اما مطمئناً شما همیشه رئیس بالاتر از رئیس دارید. و فصل 1 از 3 Body Problem چنین رئیسی بود، زیرا تقریباً 300 میلیون دلار برای آن اختصاص داده شد. 3 Body Problem به نتفلیکس بازگشت هنگامی که 3 Body Problem در سال 2024 در نتفلیکس منتشر شد، این سریال پس از فصل چهارم Stranger Things دومین سریال گران قیمت در تاریخ این سرویس پخش بود. فصل 5 این سریال قبلاً با بودجه 60 میلیون یورویی برای هر قسمت، دوباره آن رکورد را شکسته است. Now 3 Body Problem با فصل دوم به نتفلیکس باز می گردد که هزینه آن هنوز مشخص نیست. به زودی می توانید با قسمت های جدید شروع کنید! مشکل بدن داستان 3 از آنجایی که ممکن است دیگر ندانید سریال مورد نظر دقیقا چگونه کار می کند، ما به شما کمک خواهیم کرد. داستان درباره Ye Wenjie، یک اخترفیزیکدان برجسته چینی است که شاهد مرگ خشونت آمیز پدرش در دهه 1960 است. سپس او به یک پایگاه نظامی دورافتاده فرستاده می شود، جایی که دانشمندان مخفیانه در حال آزمایش ارسال سیگنال به فضا هستند. چیزی که Ye در آنجا کشف می‌کند و تصمیم می‌گیرد انجام دهد، مجموعه‌ای از رویدادها را به حرکت در می‌آورد که بعداً مشخص می‌شوند. در حال حاضر، دانشمندان در سراسر جهان با پدیده های غیرقابل توضیحی مواجه هستند. آزمایش‌های فیزیک به طور ناگهانی نتایج غیرممکنی را تولید می‌کنند و چندین محقق برجسته در شرایط مرموز می‌میرند. همچنین، برخی از دانشمندان شروع به دیدن شمارش معکوس های عجیبی کرده اند که هیچ کس دیگری نمی تواند آنها را مشاهده کند. هنگامی که گروهی از دوستان سابق کالج از آکسفورد درگیر این رویدادها می شوند، سعی می کنند بفهمند که چه اتفاقی در حال رخ دادن است. یکی از آنها، جین چنگ، به یک بازی واقعیت مجازی", "image_url": "https://www.netflix-nederland.nl/wp-content/uploads/2026/11/3-Body-Problems-Netflix.jpg", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۲۷ آبان • ۱۸:۴۳"}, {"source": "Pitchfork", "title": "Listen to Erika de Casier’s New Song “Whispers”", "link": "https://pitchfork.com/story/listen-to-erika-de-casiers-new-song-whispers/", "summary": "The track was co-produced by Bladee and Yung Lean col ws: Critics Hail “The Most Impressive Video Game Ever”", "link": "https://www.hollywoodreporter.com/business/digital/grand-theft-auto-6-review-1236758379/", "summary": "The reviews are here for GTA IV, and they're pretty incredible, with 100 percent of critics recommending the game: \"I never want to leave.\"", "date_str": "2026-11-18T15:36:39+00:00", "hash": "64f42a480d5fcbdb", "title_fa": "نقدهای \"Grand Theft Auto 6\": منتقدان \"مطلوب ترین بازی ویدئویی تا کنون\" را تحسین می کنند", "summary_fa": "نقدها در اینجا برای GTA IV هستند، و بسیار باورنکردنی هستند، و 100 درصد از منتقدان این بازی را توصیه می کنند: \"من هرگز نمی خواهم آن را ترک کنم.\" متن لوگو پس از 13 سال انتظار، سرانجام Grand Theft Auto VI از راه رسید. و بررسی ها؟ تا آنجا که ممکن است درخشان باشند. درست خارج از دروازه، عنوان مورد انتظار Rockstar Games دارای امتیاز 99 از 100 در متاکریتیک است که با بازی The Legend of Zelda: Ocarina of Time در سال 1998 برای بالاترین امتیاز سایت جمع‌آوری کننده نقد، برابری می‌کند. در واقع، 100 درصد منتقدان بازی را توصیه می کنند. در میان ده‌ها نقد، بهترین‌ها همچنان می‌آیند: شاهکار، اپوس بزرگ، انقلابی، بی‌سابقه، نفس‌گیر، خیره‌کننده، شگفت‌انگیز. داستان‌های مرتبط Business GTA 6 در مقابل هالیوود: صنعت برای راه‌اندازی بزرگترین سرگرمی در تاریخ کسب‌وکار ۲۱۰ گیگابایت یدکی ندارید؟ GTA VI در زمان عرضه به Xbox Cloud Gaming (و Xbox One) می‌آید. یک منتقد IGN می‌نویسد: من معمولاً عاشق بازی‌های ویدیویی هستم، اما به‌ندرت پیش می‌آید که کاملاً مجذوب آنها شوم. به زبان ساده، Grand Theft Auto 6 تأثیرگذارترین بازی ویدیویی است که تا به حال بازی کرده‌ام. در حالی که Eurogamer می‌نویسد، GTA 6 باورپذیرترین و باورنکردنی‌ترین بازی عمر شماست. منتقدان داستان را به عنوان یک عاشقانه بانی و کلاید به دنبال دو عاشق به نام های جیسون دووال و لوسیا کامینووس می خوانند که سعی می کنند در یک نسخه خیالی از فلوریدا از زندگی جنایی فرار کنند. طبق گزارش واشنگتن پست، که این بازی را یک حماسه شگفت‌انگیز آمریکایی می‌نامد، فضای بازی مملو از 33000 شخصیت منحصربه‌فرد غیرقابل بازی است که بازتاب ده‌ها هزار نفری است که در نویسندگی، برنامه  2014 (121 میلیون دلار) و «Mockingjay» در سال 2015، «هفته افتتاحیه هفته آخر هفته دوم» (High-end weekend 2) در سال 2015، به فروش 152 میلیون دلاری دست یافتند. به عنوان یک فرنچایز، «بازی‌های گرسنگی» بیش از 3.3 میلیارد دلار در باکس آفیس جهانی فروش داشته است و «آتش گرفتن» با 865 میلیون دلار پرفروش‌ترین فیلم است. فیلم Sunrise on the Reaping بر اساس رمان سوزان کالینز 25 سال قبل از سریال اصلی اتفاق می افتد. در صبح روز درو پنجاهمین بازی گرسنگی، معروف به کوارتر دوم، شروع می‌شود و هیمیچ آبرناتی (جوزف زادا) را دنبال می‌کند که مجبور می‌شود وارد", "image_url": "https://variety.com/wp-content/uploads/2026/11/MCDHUGA_LG071.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۷ آبان • ۱۹:۱۷"}, {"source": "Variety", "title": "Bruce Springsteen Concert Doc ‘When the Walls Came Down’ in the Works from Legendary Entertainment, Passion Pictures and Sony Music Vision", "link": "https://variety.com/2026/film/news/bruce-springsteen-concert-doc-when-the-walls-came-down-1236950655/", "summary": "When the Walls Came Down, a documentary about Bruce Springsteen and The E Street Band s 1988 East Berlin concert, is in the works from Legendary Entertainment, Passion Pictures and Sony Music Vision. Nicholas de Taranto and Danielle Peck serve as co-directors and produce alongside Passion Pictures. James Marsh, the Oscar-winning director of 2008 s Man on [ ]", "date_str": "2026-11-18T15:30:00+00:00", "hash": "4c4ca12c4331a2a1", "title_fa": "مستند کنسرت بروس اسپرینگستین با نام «When the Walls Came Down» از کمپانی Legendary Entertainment، Passion Pictures و Sony Music Vision ساخته شده است.", "summary_fa": "هنگامی که دیوارها فرو ریختند، مستندی درباره کنسرت بروس اسپرینگستین و گروه ای استریت بند در سال 1988 در برلین شرقی، توسط کمپانی Legendary Entertainment، Passion Pictures و Sony Music Vision در دست ساخت است. نیکلاس دی تارانتو و دانیل پک به عنوان کارگردان و تهیه کننده در کنار Passion Pictures فعالیت می کنند. جیمز مارش، کارگردان برنده اسکار سال 2008 مرد در [ ] وقتی دیوارها فرو ریختند، اسپرینگستین را از اولین دیدارش از برلین شرقی در سال 1981 تا اجرای سال 1988 دنبال می کند و شامل مصاحبه هایی با اسپرینگستین، جان لاندو و اعضای گروه ای استریت، از جمله روی بیتان، پتی اسکیالبرگ، استوی وان زانین است. طبق توضیحات رسمی، نمایش برلین بزرگترین کنسرتی است که اسپرینگستین و گروه ای استریت در کارنامه خود اجرا کرده اند. برای نسلی که تحت یک رژیم کمونیستی به شدت سرکوبگر به بلوغ رسیدند، کنسرت به یک کاتالیزور برای تغییر تبدیل شد. سال بعد، بسیاری از همین جوانان به فرو ریختن خود دیوار کمک کردند. اسپرینگستین گفت: \"به یاد دارم که دیوار را دیدم و گفتم: \"این درست نیست. این یک توهین علیه بشریت است.\" آن روز سعی می کردیم با کل کشور برقصیم. مارش افزود: \"این فیلم لحظه ای منحصر به فرد و پرمخاطب در فرهنگ پاپ و قدرت باورنکردنی آن بر ژئوپلیتیک را بررسی می کند. سخنان بروس از آن شب اکنون بیش از هر زمان دیگری طنین انداز شده است و ما را به یاد قدرت پایدار و متحد کننده موسیقی می اندازد.\" اسپرینگستین، رویاپرداز راک اند رول پشت متولد شدن برای دویدن و متولد شدن در ایالات متحده، اخیراً تجدید حیات در فرهنگ موسیقی پاپ را تجربه کرده است. داستان پشت ششمین آلبوم استودیویی او نبراسکا در آلبوم اسکات کوپر مرا از ناکجاآباد تحویل بده، که جرمی آلن وایت در نقش رئیس نقش اصلی را ایفا کرد،", "image_url": "https://variety.com/wp-content/uploads/2026/11/Unknown_633f86.jpeg?crop=0px%2C33px%2C947px%2C532px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۷ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "‘Bad Boys for Life’ Directors Adil El Arbi and Bilall Fallah Invest in ‘Sound of Metal’ Producer Caviar (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/bad-boys-for-life-adil-el-arbi-bilall-fallah-invest-caviar-1236951660/", "summary": "Adil El Arbi and Bilall Fallah, the Belgian directing duo behind 2020 s smash hit sequel Bad Boys for Life starring Will Smith and Martin Lawrence, have invested in award-winning production company Caviar. The two have taken a minority stake in the fellow Belgian outfit, joining as shareholders through their banner Los Morros. Over the last [ ]", "date_str": "2026-11-18T15:15:00+00:00", "hash": "636db88c284bbc1e", "title_fa": "کارگردانان «پسران بد برای همیشه» عادل العربی و بلال فلاح در شرکت تهیه‌کننده «صدای فلز» یعنی Caviar سرمایه‌گذاری می‌کنند (اختصاصی)", "summary_fa": "عادل الاربی و بلال فلاح، دو کارگردان بلژیکی که دنباله فیلم موفق فیلم پسران بد برای زندگی در سال 2020 با بازی ویل اسمیت و مارتین لارنس در آن نقش آفرینی کرده اند، در شرکت تولید برنده جایزه Caviar سرمایه گذاری کرده اند. این دو سهام اقلیت در لباس بلژیکی دیگر را به خود اختصاص داده اند و به عنوان سهامدار از طریق بنر خود Los Morros به آن ملحق شده اند. در طول 20 سال گذشته، خاویار، همچنین مستقر در بلژیک، در هر دو فضای فیلمنامه، بدون فیلمنامه و برند کار کرده است و بیشتر برای Sound of Metal که نامزد شش جایزه اسکار در سال 2020 بود، از جمله بهترین فیلم، برنده بهترین صدا و بهترین تدوین فیلم شناخته شده است. پروژه‌های دیگر عبارتند از زک وودز، فیلم The Accompanist که برای اولین بار در Tribeca نمایش داده شد، و The Best Immigrant که توسط Arbi و Fallah تهیه شده است. این شرکت در حال حاضر حدود 200 میلیون یورو (219 میلیون دلار) درآمد سالانه دارد و قصد دارد این میزان را در سال های آینده دو برابر کند. داستان‌های مرتبط پیش‌بینی‌های اسکار: تدوین فیلم - «شما می‌توانید همه چیز را ببینید» به نظر می‌رسد در مسابقه برندگان گذشته شکست بخورد و به سومین مستندی تبدیل شود که تا به حال نامزد دریافت جایزه اسکار شده است. مشکی. از آن زمان، این زوج کارگردان فیلم «پسران بد برای زندگی» (426 میلیون دلار در سراسر جهان) و دنباله آن «پسران بد سوار یا بمیرند» (405 میلیون دلار)، به‌علاوه «خانم مارول» برای دیزنی پلاس، «بارش برف» برای FX و Rebel که در کن نمایش داده شد. آنها همچنین Batgirl را کارگردانی کردند، که در زمان پس از تولید در برادران وارنر و به عنوان بخشی از کاهش هزینه های دیوید زاسلاو، به طور بحث انگیزی کنار گذاشته شد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Copyright-Maureen-De-Wit-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "سرمایه‌گذاری", "بورس و طلا ». داستان‌های مرتبط Avengers: Doomsday رایان رینولدز و هیو جکمن را در میان 10 نویسنده فهرست می‌کند. پیش‌بینی‌های اسکار: تدوین فیلم - «شما می‌توانید همه چیز را ببینید» به نظر می‌رسد در مسابقه برندگان گذشته شکست بخورد و به سومین مستندی تبدیل شود که تا به حال نامزد شده است توسط Amann Mann و Kirabbit Senaks تهیه شده است. این جایزه، که «پروژه‌هایی را که به یک مسئله فوری زمان ما می‌پردازند» که در دسته‌های Pitch یا Roundtable ارائه می‌شوند به رسمیت می‌شناسد، با یک جایزه 25000 دلاری همراه است. اعضای هیئت منصفه محمد المانگی و بریجید او شیا گفتند این پروژه که آنها آن را \"از لحاظ سیاسی و خلاقانه پیچیده\" توصیف کردند، \"آسیب پذیری جوامعی را که از طریق خشونت های دولتی خطرناک و اشتباه تلقی می شوند\" بررسی می کند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/How-Love-Moves.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۷ آبان • ۱۸:۳۵"}, {"source": "Billboard", "title": "Ella Langley Is Already a Winner at 2026 CMA Awards; Tim McGraw Sets a Record in Musical Event Category", "link": "https://www.billboard.com/music/awards/cma-awards-2026-ella-langley-tim-mcgraw-win-early-awards-1236384751/", "summary": "Ella Langley ’s expected sweep of the 2026 CMA Awards began early, with the announcement of her win for music video of the year for her megahit “Choosin’ Texas.” And Tim McGraw made CMA history, becoming the first five-time winner of musical event of the year for “McArthur,” a collab with HARDY , Eric Church and Morgan Wallen . Related Here Are the Performers Presenters for the 2026 CMA Awards 2026 CMA Awards Predictions: Who Will Win? How to Watch Billboard s 2026 CMA Awards Red Carpet Livestream The awards were announced live on ABC’s Good Morning America on Wednesday (Nov. 18), with Lara Spencer sharing the news from Honky Tonk Central in downtown Nashville. GMA also took a look inside Bridgestone Arena with Lainey Wilson, who is hosting the show for the third year in a row. Langley won music video of the year as both artist and director. She shares the award with co-directors Caylee Robillard and Wales Toney. Langley also won in this category last year (again as both artist and co-director) for “You Look Like You Love Me,” her sexy duet with Riley Green. HARDY, Church, Wallen and McGraw share the award for musical event of the year with producer Jay Joyce. McGraw’s previous wins in the category are for “It’s Your Love” (with Faith Hill); “Find Out Who Your Friends Are (with Tracy Lawrence and Kenny Chesney); “Feel Like a Rock Star” (with Chesney); and “Highway Don’t Care” (with Taylor Swift and Keith Urban). McGraw’s fifth win in the category allows him to break out of a tie with Brad Paisley, Urban, Chesney and Vince Gill, who have won four times each. The 60th Annual CMA Awards is a production of the Country Music Association. Robert Deaton serves as executive producer, Alan Carter is director, and Jon Macks is head writer. The awards show will take place in Bridgestone Arena in Nashville on Wednesday night.", "date_str": "2026-11-18T14:36:22+00:00", "hash": "e8d6f94e30d7554a", "title_fa": "الا لنگلی در حال حاضر برنده جوایز CMA 2026 است. تیم مک‌گرو رکوردی را در رده رویدادهای موسیقی ثبت کرد", "summary_fa": "حرکت مورد انتظار الا لنگلی در جوایز CMA 2026 با اعلام برنده شدن وی برای موزیک ویدیوی سال برای مگاهیتش \"Choosin' Texas\" زود آغاز شد. و تیم مک‌گرا تاریخ CMA را ثبت کرد و اولین برنده پنج رویداد موسیقی سال برای «مک آرتور» شد، همکاری با هاردی، اریک چرچ و مورگان والن. موارد مرتبط در اینجا مجریان ارائه کننده جوایز 2026 جوایز CMA 2026 پیش بینی جوایز CMA هستند: چه کسی برنده خواهد شد؟ نحوه تماشای بیلبورد 2026 CMA Awards Red Carpet Livestream جوایز به صورت زنده در صبح بخیر آمریکا در شبکه ABC در روز چهارشنبه (18 نوامبر) اعلام شد و لارا اسپنسر اخبار را از Honky Tonk Central در مرکز شهر نشویل به اشتراک گذاشت. GMA همچنین با Lainey Wilson که برای سومین سال متوالی میزبان این برنامه است، به داخل بریجستون آرنا نگاهی انداخت. لنگلی هم به عنوان هنرمند و هم کارگردان برنده موزیک ویدیوی سال شد. او این جایزه را با کارگردانان دیگر کیلی روبیلارد و ولز تونی به اشتراک می گذارد. لنگلی همچنین سال گذشته در این بخش (دوباره به عنوان هنرمند و کارگردان) برای «تو به نظر می‌رسی که عاشق من هستی»، دوئت سکسی او با رایلی گرین، برنده شد. هاردی، چرچ، والن و مک گراو جایزه رویداد موسیقی سال را با تهیه کننده جی جویس به اشتراک می گذارند. برنده های قبلی مک گرو در این رده برای «این عشق توست» (با Faith Hill) است. «پیدا کن که دوستانت چه کسانی هستند (با تریسی لارنس و کنی چسنی)؛ «احساس مثل ستاره راک» (با چسنی)؛ و «بزرگراه مهم نیست» (با تیلور سویفت و کیت اوربان). پنجمین برد مک‌گرو در این رده به او اجازه می‌دهد تا از یک تساوی با اوربانین وی، چهار بار برنده، چنی و براد پیس برنده شود. شصتمین جوایز سالانه CMA محصول انجمن موسیقی کشور است. رابرت دیتون به‌عنوان تهیه‌کننده", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/P106DWOP-e1779074142437.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۸:۰۶"}, {"source": "Billboard", "title": "Boston Museum of Fine Arts Announces Expansive ‘Taylor Swift: The Eras Collection’ Exhibition", "link": "https://www.billboard.com/music/pop/taylor-swift-eras-collection-boston-museum-fine-arts-details-1236384740/", "summary": "Get ready to spend a night at the museum with Taylor Swift . Boston s Museum of Fine Arts announced on Tuesday (Nov. 17) that it will mount the Taylor Swift: the Eras Collection exhibition in the spring. The career-spanning show promises to display more than 50 iconic costumes, instruments and objects from Swift s archive, celebrating two decades of her art. Related Noah Kahan Reacts to 2027 Grammy Nominations Snub: I Was In My Feelings for a Sec Taylor Swift s Song of the Year Grammy Quip Was Likely No Accident Grand Theft Auto VI Revs Its Engines Leads 2026 Game Awards Nominations: Full List According to the announcement, the exhibition will feature a vignette dedicated to each of Swift s 12 eras to date, bookended by the videos for the Tim McGraw single from her 2006 self-titled debut album through The Fate of Ophelia from last year s The Life of a Showgirl . Also included will be objects from Swift s record-setting Eras Tour (2023-2024), including a custom red Alberta Ferretti gown worn during the folklore and evermore sets on the global stadium outing. Among the other objects on display will be the bejeweled Midnights bodysuit designed by Zuhair Murad, as well as the tinsel-fringed jacket from the show s Karma finale and a recreation of the Fortnight video set from The Tortured Poets Department era featuring Swift s Victorian-inspired dress and typewriter. The Boston museum will be the only venue for the exhibit, which will also include a number of Swift s signature instruments, including a Deering banjo from the Speak Now tour, a mandolin from the Willow video and the shell of a pink-and-gold piano from Swift s Lover performance at the 2019 American Music Awards. “This is the first exhibition in the MFA’s history devoted to a musician, and we’re thrilled to invite visitors for an up-close look at the fashion and instruments of one of the most influential cultural figures of our time,” MFA director of public programs Kristen Hoskins said in a statement about the show that opens on April 10 and is slated to run through Aug. 15. “I’m excited to welcome audiences across generations to this unique experience at the Museum.” Tickets for the exhibition ($40) will go on sale to the general public on Swift s birthday, Dec. 13, at 6 p.m. ET; click here for ticketing details. On Monday, Swift made Grammy history when the nominations for next year s ceremony were announced and she once again got nods for album, record and song of the year , marking the fifth tim", "date_str": "2026-11-18T14:20:03+00:00", "hash": "9bef524b1532ed86", "title_fa": "موزه هنرهای زیبای بوستون نمایشگاه گسترده «تیلور سویفت: مجموعه دوره‌ها» را اعلام کرد.", "summary_fa": "برای گذراندن یک شب در موزه با تیلور سویفت آماده شوید. موزه هنرهای زیبای بوستون روز سه شنبه (17 نوامبر) اعلام کرد که نمایشگاه تیلور سویفت: مجموعه ایراس را در بهار برگزار خواهد کرد. این نمایش حرفه ای وعده می دهد که بیش از 50 لباس، ابزار و اشیاء نمادین را از آرشیو سوئیفت به نمایش بگذارد و دو دهه هنر او را جشن بگیرد. واکنش‌های مرتبط نوح کاهان به نامزدهای گرمی 2027 اسنوب: من در احساساتم برای یک ثانیه بودم آهنگ سال تیلور سویفت احتمالاً بدون تصادف بود 12 دوره تا به امروز، توسط ویدئوهای تک آهنگ تیم مک گرو از اولین آلبوم او در سال 2006 از طریق The Fate of Ophelia از سال گذشته The Life of a Showgirl رزرو شده است. همچنین شامل اشیایی از تور Eras Swift (2023-2024) خواهد بود که رکورد ثبت کرده است، از جمله لباس قرمز سفارشی آلبرتا فرتی که در طول مراسم فولکلور پوشیده شده است و ست های همیشه در ورزشگاه جهانی. در میان دیگر اشیاء به نمایش گذاشته شده، لباس بدن نیم‌نیت‌های نگین‌دار طراحی شده توسط زهیر مراد، و همچنین ژاکت لبه‌دار از فینال نمایش کارما و بازسازی مجموعه ویدئویی فورتنایت از دوره انجمن شاعران شکنجه‌شده با لباس و ماشین تحریر ویکتوریایی سوئیفت است. موزه بوستون تنها محل برگزاری این نمایشگاه خواهد بود که شامل تعدادی از سازهای سوئیفت از جمله بانجو Deering از تور Speak Now، ماندولین از ویدیوی Willow و پوسته پیانوی صورتی و طلایی از اجرای Swifts Lover در جوایز موسیقی آمریکا 2019 خواهد بود.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2297459109-e1795009744688.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۷:۵۰"}, {"source": "Deadline", "title": "Ella Langley, Morgan Wallen & Tim McGraw Among Early CMA Award Winners", "link": "https://deadline.com/2026/11/cma-awards-winners-ella-langley-1237227915/", "summary": "Ella Langley and her “Choosin Texas took the CMA Music Video of the Year honor this morning as the Country Music Association revealed early winners in two categories ahead of the full ceremony tonight. The other winner for CMA Musical Event of the Year went to McArthur, the song by Hardy, Eric Church, [ ]", "date_str": "2026-11-18T14:32:24+00:00", "hash": "017022342af01a0b", "title_fa": "الا لنگلی، مورگ     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
