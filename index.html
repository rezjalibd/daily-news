d in Higüey in 1978 by the Rosario brothers — Toño, Pepe, Rafael (“Rafa”), Ramon Antonio (“Tony”) and Luis — is currently led by Luis, Rafa, and Tony. Related Billboard Latin Music Week 2026: 5 Trends to Discover Hilary Duff to Receive Outstanding Pop Tour of the Year Award at 2026 Billboard Live Music Summit Judge Rules Woman Accused of Shooting at Rihanna A$AP Rocky s Home Mentally Fit to Stand Trial “It’s an honor and a tremendous privilege,” Clavell, a 2026 Billboard Latin Women in Music Executive honoree, said in a press statement. “We are talking about an institution — pillars of Dominican merengue — and a family whose music has been a part of so many people s lives. I accept this opportunity with deep gratitude, but also with the responsibility of contributing to a legacy that deserves to keep growing and being celebrated; I am thankful for the trust placed in me and for the chance to work alongside René, who has dedicated so many years to this great institution. It is a truly rewarding experience to join forces with someone who has such a deep understanding of the history and has played a fundamental role in the group s development. I am here to add value, to work with dedication, and to contribute everything within my power so that, together, we can achieve great things for Los Hermanos Rosario.” Solís added: “We are thrilled to welcome Sonia Clavell to our team. She is a true professional with extensive industry experience and someone we ve known for a long time. Her arrival marks a new chapter for us, as she brings fresh ideas and a different perspective to help us continue our growth and bring our music to new generations.” Los Hermanos Rosario have various Billboard chart entries, including five Top 10 hits on Tropical Airplay: “La Dueña del Swing,” “Rompecintura,” “Siento,” “Alo” and “Esa Muchacha.” Eight of their albums have charted on Top Tropical Albums, including Y es Facil, which peaked at No. 1 in 1997. Currently, they are making the rounds with their 2026 set Identidad (Live) . In 2028, they will be celebrating their 50-year trajectory.", "date_str": "2026-10-06T14:00:00+00:00", "hash": "aeb22a878409bbf6", "title_fa": "سونیا کلاول به تیم مدیریت لوس هرمانوس روزاریو پیوست: \"من اینجا هستم تا ارزش بیافزایم\"", "summary_fa": "سونیا کلاول به تیم مدیریتی در لوس هرمانوس روزاریو می‌پیوندد، بیلبورد می‌تواند به طور انحصاری در روز سه‌شنبه (6 اکتبر) اعلام کند. کلاول که مدیر آیوی کویین و رئیس Bravas Entertainment است، با مدیر قدیمی گروه مرنگ، رنه سولیس، به عنوان مشاور استراتژی بازاریابی و مدیریت همکاری خواهد کرد. گروه دومینیکن که در هیگوئی در سال 1978 توسط برادران روزاریو - تونو، پپه، رافائل (\"رافا\")، رامون آنتونیو (\"تونی\") و لوئیس تأسیس شد - در حال حاضر توسط لوئیس، رافا و تونی رهبری می شود. هفته موسیقی لاتین بیلبورد مرتبط 2026: 5 گرایش برای کشف هیلاری داف برای دریافت جایزه بهترین تور پاپ سال در اجلاس موسیقی زنده بیلبورد در سال 2026 قاضی حکم می‌دهد زن متهم به تیراندازی در ریانا راکی در خانه است. در بیانیه‌ای مطبوعاتی گفت: برگزیدگان اجرایی بیلبورد لاتین زنان در موسیقی 2026. ما در مورد یک مؤسسه - ستون‌های مرنگ دومینیکن - و خانواده‌ای صحبت می‌کنیم که موسیقی آن بخشی از زندگی بسیاری از مردم بوده است. من این فرصت را با سپاس عمیق می‌پذیرم، اما همچنین با مسئولیت مشارکت در میراثی که شایسته رشد و تجلیل است؛ از اعتمادی که به من شد و فرصتی برای کار در کنار این مؤسسه بزرگ که سال‌های زیادی را وقف رنه کرده است، سپاسگزارم. پیوستن به نیروها با کسی که درک عمیقی از تاریخ دارد و نقش اساسی در توسعه گروه ایفا کرده است، یک تجربه واقعاً ارزشمند است. من اینجا هستم تا ارزش بیافزاییم، با فداکاری کار کنم، و هر چیزی را که در توانم است به کار ببرم تا با هم بتوانیم دستاوردهای بزرگی برای لوس هرمانوس روزاریو به دست آوریم.\" سولیس افزود: \"ما از استقبال از سونیا کلاول به تیم خود بسیار هیجان زده هستیم."}, {"source": "Billboard", "title": "Amy Grant & Chris Isaak Among Honorees at Save the Music’s 2026 Hometown to Hometown Fundraiser in Nashville", "link": "https://www.billboard.com/music/music-news/hometown-to-hometown-fundraiser-2026-amy-grant-chris-isaak-1236354613/", "summary": "Amy Grant and Chris Isaak will be among the honorees at Save the Music’s seventh annual “Hometown to Hometown” event taking place Nov. 10 at City Winery in Nashville. The event will also honor industry executives Cesar Gueikian (Gibson Guitars) and Nat Zilkha (Firebird Music) for their contributions to the music industry and their support of music education. Co-hosted by Leslie Fram and Caylee Hammack , the fundraising event will also feature special acoustic performances from Grant, Isaak, Hammack and Amanda Shires . All funds raised from this year’s “Hometown to Hometown” event will support music education programs in under-resourced public high schools in Nashville, New York City and across California. Related Amy Grant Opens Up About Her First Album in 13 Years, The Me That Remains : In a Beautiful Way, Our Limitations Create Our Path Executive of the Year Leslie Fram on Making Country Music a Big, Beautiful Tent For All Underrepresented Voices Amanda Shires Reclaims Her Voice on New Take It Like a Man Album: You Gotta Be an Advocate for Yourself Every musician we serve started somewhere, and for a lot of our friends that somewhere was a music room in a public school, Mike Clem, CEO of online music retailer Sweetwater, said in a statement. Save the Music makes sure those rooms exist and are inspiring. Supporting Hometown to Hometown is one of the most direct ways we can put instruments in the hands of students who might not otherwise get the chance.” “We are incredibly grateful to this year’s Hometown to Hometown sponsors – Firebird Music, Gibson Gives, SiriusXM and Sweetwater – and to our extraordinary honorees … for rallying behind the power of music education,” added Danielle Zalaznick, chief development officer and deputy executive director at Save The Music. “Alongside our hosts, Leslie Fram and Caylee Hammack, they represent what makes Nashville’s music community so special: artists, executives, and industry partners coming together to invest in the next generation of music makers.” Since launching in 2019, Hometown to Hometown has raised more than $1 million to support music education. Save the Music Foundation is a 501(c)(3) nonprofit that helps students, schools, and communities reach their full potential through the power of making music. For 27 years, Save the Music has addressed systemic inequities in music education. Since its inception, STM has donated $75M worth of instruments and technology to over 2,800 schools – impacting millions of ", "date_str": "2026-10-06T14:00:00+00:00", "hash": "3d816de1125ecec2", "title_fa": "امی گرانت و کریس آیزاک در میان برگزیدگان مراسم جمع‌آوری کمک مالی سال 2026 در Save the Music's Hometown to Hometown در نشویل", "summary_fa": "امی گرانت و کریس آیزاک از جمله برگزیدگان در هفتمین رویداد سالانه Save the Music \"Hometown to Hometown\" هستند که در 10 نوامبر در City Winery در نشویل برگزار می شود. این رویداد همچنین از مدیران این صنعت سزار گوئیکیان (گیتار گیبسون) و نات زیلخا (موسیقی فایربرد) به دلیل مشارکت در صنعت موسیقی و حمایت از آموزش موسیقی تجلیل خواهد کرد. این رویداد جمع آوری کمک های مالی با میزبانی مشترک Leslie Fram و Caylee Hammack، اجراهای آکوستیک ویژه ای از Grant، Isaak، Hammack و Amanda Shires را به نمایش خواهد گذاشت. تمام سرمایه‌های جمع‌آوری‌شده از رویداد امسال «شهر به زادگاه» از برنامه‌های آموزش موسیقی در دبیرستان‌های دولتی با منابع کم در نشویل، شهر نیویورک و در سراسر کالیفرنیا حمایت می‌کند. امی گرانت مرتبط درباره اولین آلبومش پس از 13 سال صحبت می کند، من که باقی می ماند: به روشی زیبا، محدودیت های ما مسیر ما را ایجاد می کند. مایک کلم، مدیر عامل خرده‌فروش موسیقی آنلاین Sweetwater، در بیانیه‌ای گفت: مایک کلم، مدیر عامل خرده‌فروشی آنلاین موسیقی Sweetwater، در بیانیه‌ای گفت: هر نوازنده‌ای که ما به آن‌ها خدمت می‌کنیم، از جایی شروع کردند، و برای بسیاری از دوستان ما که جایی یک اتاق موسیقی در یک مدرسه دولتی بود. Save the Music مطمئن می شود که این اتاق ها وجود دارند و الهام بخش هستند. حمایت از زادگاه به شهر یکی از مستقیم‌ترین راه‌هایی است که می‌توانیم سازها را در دستان دانش‌آموزانی قرار دهیم که در غیر این صورت ممکن است این فرصت را نداشته باشند.» دانیل زالازنیک، مدیر ارشد توسعه و معاون مدیر اجرایی Save The Music، افزود: «ما از حامیان مالی امسال Hometown to Hometown - Firebird Music، Gibson Gives، SiriusXM و Sweetwater - و از افتخارآفرینان خارق‌العاده‌مان برای حمایت از قدرت آموزش موسیقی بسیار سپاسگزاریم."}, {"source": "Billboard", "title": "Carson Daly Returned to ‘TRL’ Times Square Studio For Reunion Special, But It Won’t Air on MTV", "link": "https://www.billboard.com/culture/tv-film/carson-daly-returned-trl-studio-reunion-special-roku-1236354903/", "summary": "As it turns out, you can go home again. According to an EW report, Today Show featured anchor and The Voice host Carson Daly recently returned to the iconic Total Request Live studio in New York s Times Square to film a TRL reunion special that is reportedly slated to air sometime next year. Related Here s Everything You Need to Know About Amazon s Prime Big Deal Days An Oral History of TRL : Trump s Demands, Mariah s Meltdown and Anthrax Scares Taylor Swift Surprised Dakota Johnson With a Birthday Cake on SNL : Here s How the Baker Reacted But in a twist, the reboot will not air on the show s original network, MTV, but rather as a special on digital streamer Roku; at press time, spokespeople for Roku and MTV had not returned Billboard s request for confirmation on the report. Daly, 53, who, along with Toby Amies and Ananda Lewis, was an original co-host of TRL , made the pilgrimage to the show s Manhattan studio last week for the special he will reportedly produce alongside the countdown show s original series creator, Tony DiSanto. EW reported that some vintage TRL -era stars were spotted near the studio last week, including JoJo, Mya, Ashanti, *NSYNC s JC Chasez and Nelly. TRL premiered on the once formidable music-video-turned-reality-TV network in 1998 and became must-see-TV for a generation of millennials, hosting daily countdowns of the top 10 most popular fan-voted music videos of the day, as well as in-studio performances, interviews and appearances by the biggest stars of the day, including *NSYNC, Britney Spears, Christina Aguilera, Eminem, the Backstreet Boys, Limp Bizkit and more. After paring back his participation in 2002 to host his late-night talk show Last Call with Carson Daly , Daly formally stepped down from TRL in 2005 and was replaced by a series of other hosts, including Vanessa Minnillo, Quddus, Hilarie Burton, La La Vasquez and others. Like the network that hosted it, by 2007, TRL had significantly faded in popularity and influence and was canceled in September 2008. A final, three-hour Total Finale Live special that aired on Nov. 16, 2008 featured appearances from Snoop Dogg, Nelly, Beyoncé, 50 Cent, Justin Timberlake, Aguilera, Taylor Swift, Eminem and many more. MTV has attempted to reboot the franchise several times over the years, including for specials in 2014 and 2016, as well as in a shortened half-hour version in 2017 with hosts Liza Koshy, Eva Gutowski, Gigi Gorgeous, and others and later, ironically, as a prerecorded ho", "date_str": "2026-10-06T13:25:08+00:00", "hash": "9d0f068b1ace9da4", "title_fa": "کارسون دالی به استودیوی «TRL» تایمز اسکوئر برای ویژه‌ی اتحاد مجدد بازگشت، اما از MTV پخش نخواهد شد.", "summary_fa": "همانطور که معلوم است، شما می توانید دوباره به خانه بروید. بر اساس گزارش EW، Today Show مجری و کارسون دالی مجری The Voice اخیراً به استودیوی نمادین Total Request Live در میدان تایمز نیویورک بازگشته تا از یک ویژه‌ی اتحاد مجدد TRL فیلمبرداری کند که طبق گزارش‌ها قرار است سال آینده پخش شود. مطالب مرتبط در اینجا همه چیزهایی است که باید در مورد روزهای معاملات بزرگ آمازون بدانید تاریخ شفاهی TRL: خواسته های ترامپ، بحران ماریا و ترس از سیاه زخم تیلور سویفت داکوتا جانسون را با کیک تولد در SNL شگفت زده کرد: در اینجا نشان می دهد که چگونه Bakerw در شبکه اصلی واکنش نشان نداد، اما در یک شبکه اصلی پخش نشد. MTV، بلکه به عنوان یک برنامه ویژه در پخش کننده دیجیتال Roku. در زمان انتشار، سخنگویان Roku و MTV درخواست بیلبورد برای تایید گزارش را پس نداده بودند. دالی، 53 ساله، که همراه با توبی آمیز و آناندا لوئیس، یکی از مجریان اصلی TRL بود، هفته گذشته برای برنامه ویژه ای که ظاهراً در کنار سازنده سریال اصلی سریال شمارش معکوس، تونی دیسانتو، تهیه خواهد کرد، به استودیوی برنامه منهتن رفت. EW گزارش داد که چند ستاره قدیمی دوران TRL هفته گذشته در نزدیکی استودیو دیده شدند، از جمله JoJo، Mya، Ashanti، *NSYNCs JC Chasez و Nelly. TRL در سال 1998 در شبکه تلویزیونی واقعی موسیقی-ویدئویی قدرتمند پخش شد و برای نسلی از نسل هزاره به تلویزیونی تبدیل شد که باید دید. آگیلرا، امینم، بک استریت بویز، لیمپ بیزکیت و غیره. دالی پس از پایان حضورش در سال 2002 برای میزبانی برنامه گفتگوی آخر شب خود، آخرین تماس با کارسون دالی، در سال 2005 رسما از TRL کنار رفت و با یک سری از مجریان دیگر، از جمله ونسا مینیلو، قدوس، هیلاری برتون، لالا واسکوئز و دیگران جایگزین شد. مانند شبکه ای که"}, {"source": "Billboard", "title": "A$AP Rocky Announces Full-Tuition Scholarship for Roc Nation School of Music Students: ‘Turn That Vision Into Something Real’", "link": "https://www.billboard.com/music/rb-hip-hop/asap-rocky-scholarship-roc-nation-school-1236354537/", "summary": "A$AP Rocky never went to college, but he s giving an aspiring creative a chance to earn a degree tuition-free. Billboard can exclusively reveal on Tuesday (Oct. 6) that the Harlem native has launched a scholarship for an incoming freshman enrolling at LIU Brooklyn s Roc Nation School of Music, Sports and Entertainment. Applications for first-time freshmen for the fall 2027 semester are now open through Dec. 15. One student will be awarded a full-tuition four-year scholarship courtesy of Rocky. Related LIU s Roc Nation School Unveils State-of-the-Art Dolby Atmos Studio for Students A Day in the Life at LIU Brooklyn’s Roc Nation School of Music: Culture, Class Camaraderie Megan Thee Stallion Is Giving One Lucky College Student a Full-Ride Scholarship I m a big believer in creating your own lane and giving people the opportunity to do the same,” said A$AP Rocky in a statement to Billboard . There are so many talented young people with ideas, ambition and something important to say. This scholarship is about helping one of them turn that vision into something real. The Roc Nation School boasts about 300 students on campus in Brooklyn through six different bachelor of arts programs (three from music: applied music, vocal performance and music technology, entrepreneurship and production). As of 2024, tuition costs $32,000, while 25 percent of incoming freshmen are granted Hope Scholarships. 99 percent of the program s student body also receives some form of financial aid. DJ Khaled, Megan Thee Stallion, Gimel Young Guru Keaton and NBA star LaMelo Ball have all previously launched celebrity scholarships at the Roc Nation School. Jay-Z s longtime engineer, Guru, came on board as the school s Director of the Music Technology, Entrepreneurship Production program in 2022. On the music front, A$AP Rocky delivered his long-awaited Don t Be Dumb album in January, which debuted at No. 1 on the Billboard 200. Courtesy of Roc Nation School of Music, Sports Entertainment", "date_str": "2026-10-06T13:00:00+00:00", "hash": "e9b7360b019d0015", "title_fa": "A$AP Rocky بورسیه تحصیلی کامل را برای دانشجویان دانشکده موسیقی Roc Nation اعلام کرد: \"این دیدگاه را به چیزی واقعی تبدیل کنید\"", "summary_fa": "A$AP Rocky هرگز به کالج نرفت، اما به یک خلاق مشتاق فرصتی می‌دهد تا مدرک تحصیلی خود را بدون شهریه دریافت کند. بیلبورد می‌تواند به طور انحصاری در روز سه‌شنبه (6 اکتبر) فاش کند که بومی هارلم برای یک دانشجوی سال اولی که در مدرسه موسیقی، ورزش و سرگرمی Roc Nation LIU Brooklyn ثبت‌نام می‌کند، بورسیه تحصیلی راه‌اندازی کرده است. درخواست برای اولین بار برای ترم پاییز 2027 اکنون تا 15 دسامبر باز است. به یک دانش آموز بورسیه تحصیلی چهار ساله کامل توسط راکی ​​تعلق می گیرد. مرتبط با LIU s Roc Nation استودیو پیشرفته Dolby Atmos را برای دانش آموزان رونمایی کرد یک روز از زندگی در LIU Brooklyn's Roc Nation School of Music: Culture, Class Camaraderie Megan Thee Stallion به یک دانشجوی خوش شانس کالج کمک هزینه تحصیلی کامل می دهد. راکی در بیانیه‌ای برای بیلبورد، جوانان با استعداد زیادی با ایده‌ها، جاه‌طلبی‌ها و چیزهای مهمی برای گفتن وجود دارند. این بورسیه در مورد کمک به یکی از آنها است که این دیدگاه را به چیزی واقعی تبدیل کند. مدرسه Roc Nation دارای حدود 300 دانش آموز در پردیس در بروکلین از طریق شش برنامه مختلف لیسانس هنر (سه برنامه از موسیقی: موسیقی کاربردی، اجرای آواز و فناوری موسیقی، کارآفرینی و تولید) است. از سال 2024، هزینه تحصیل 32000 دلار است، در حالی که به 25 درصد از دانشجویان سال اول ورودی بورسیه Hope اعطا می شود. 99 درصد از دانشجویان این برنامه نیز نوعی کمک مالی دریافت می کنند. دی جی خالد، مگان تی استالیون، گیمل یانگ گورو کیتون و ستاره NBA، LaMelo Ball، همگی قبلاً بورسیه تحصیلی افراد مشهور را در مدرسه Roc Nation راه اندازی کرده اند. مهندس قدیمی جی زی، گورو، در سال 2022 به عنوان مدیر برنامه تولید فناوری موسیقی، کارآفرینی مدرسه وارد هیئت شد. در بخش موسیقی، A$AP Rocky آلبوم موردانتظار"}, {"source": "Billboard", "title": "Billboard Latin Music Week 2026 Adds Rubén Blades, Anthony Ramos, Lenny Tavárez, Tito Nieves & More to Lineup", "link": "https://www.billboard.com/lists/billboard-latin-music-week-2026-final-lineup/", "summary": "A final round of names, including Rubén Blades , Anthony Ramos , Lenny Tavárez and Tito Nieves , have joined the 2026 Billboard Latin Music Week programming, Billboard can today (Oct. 6). Among other newly-added confirmed participating talent are: Alex Rose, ANASOF, Amigo de Artistas, Baby Rasta Gringo, Brray, Carlos Sanson Jr., Dale Pututi, Dany Ome Kevincito el 13, Dome, EP The Latino, Exti, FLVCKKA, Grupo Duelo, ISADORA, Javi Crespo, Jey One, La Gabi, Natasha Nazario, Los Dos De Tamaulipas, Luis Figueroa, Lyanno, Micro TDH, Nailah Blackman, Na’vi, Nesty, Ramma and Vius. Additional executive featured guests include Alejandra Olea, Bruno Duque, Camila Yepes, Eduardo Basagaña, Gabo Llano, Goldie Harris, Hans Schafer, Marcela Moreira, Maria Gracia, Melanie García Vélez, Paz Aparicio, Scott Budnick, Sebastian Bastidas, Vicky Rivas and Yasmin Dastmalchi. These participants will join previously announced artists such as Ana Mena, Anuel AA, Aria Vega, Bebeshito, Becky G, Carlos Rivera, Clave Especial, Conep, DJ Conds, Ela Taubert, Emmanuel Cortes, Erick Brian, Fuerza Regida, Greeicy, Grupo Cañaveral, Grupo Frontera, Grupo Niche, Hermanos Espinoza, Jay Wheeler, Jessi Uribe, Kany García, Kidd Voodoo, Kristina, Lali, Lola Indigo, LOrna, Maluma, Mar Solís, Mau y Ricky, Paola Jara, Pitbull, Quevedo, RaiNao, Rawayana, Rey Tony Helabusador, Ryan Castro, SANTOS BRAVOS, Trueno, Wow Popy and Zhamira. Executive panelists previously confirmed include Claudia Ochoa, Cristina Perpiñá-Robert, Ghazi, Jorge Pepo Ferradas, Miguel Ramírez, Nat Pastor, Paz Aparicio, Rebeca Leon, Rob Jonas, Tommy Mottola, Víctor González and Walter Kolm. “Latin music has never been so global, so rich, so nuanced and so widely listened to as right now,” Leila Cobo, co-chief content officer for Billboard , said last month at a press conference where most of the program was revealed. “Unveiling this program in the capital of Latin music, alongside the mayor of Miami-Dade, gives me enormous pride. Together, we have built a cultural movement and we are eager to share with everyone in the city and the world.” Taking place from Oct. 19-22 at the Faena Forum Miami Beach, the 2026 Billboard Latin Music Week will once again serve as a dynamic platform celebrating the heartbeat of Latin music and culture, with a packed week of programming that includes artist conversations, panels, live performances, hands-on workshops, brand activations, networking opportunities and more. Latin Music Week also coincides with", "date_str": "2026-10-06T13:00:00+00:00", "hash": "5b5f18e8519e7153", "title_fa": "هفته موسیقی لاتین بیلبورد 2026 روبن بلیدز، آنتونی راموس، لنی تاورز، تیتو نیوز و غیره را به ترکیب اضافه می‌کند", "summary_fa": "آخرین دور از نام‌ها، از جمله روبن بلیدز، آنتونی راموس، لنی تاورز و تیتو نیوز، امروز (6 اکتبر) به برنامه‌های هفته موسیقی لاتین بیلبورد 2026 پیوستند. از دیگر استعدادهای شرکت کننده تایید شده جدید اضافه شده عبارتند از: الکس رز، ANASOF، دوست هنرمندان، بیبی راستا گرینگو، برایی، کارلوس سانسون جونیور، دیل پوتوتی، دنی اومه کوینسیتو el 13، Dome، EP The Latino، Exti، FLVCCKA، Grupo Gadorapo، Javi، Grupo Lapo, Javi، Natasha Nazario, Los Luis Figueroa - Micro TDH (موزیک ویدیوی رسمی) Nailah Blackman - Na'vi (موزیک ویدیوی رسمی) مهمانان برجسته اجرایی دیگر عبارتند از: آلخاندرا اولئا، برونو دوکه، کامیلا یپس، ادواردو باساگانا، گابو لیانو، گلدی هریس، هانس شفر، مارسلا موریرا، ماریا گراسیا، ملانی گارسیا ولز، پاز آپاریسیو، اسکات بودنیک، سباستین ویستیمال باستیواست، و سباستین ویستیمال. این شرکت کنندگان به هنرمندان اعلام شده قبلی مانند Ana Mena، Anuel AA، Aria Vega، Bebeshito، Becky G، Carlos Rivera، Special Key، Conep، DJ Conds، Ela Taubert، Emmanuel Cortes، Erick Brian، Force Regida، Greeicy، Canaveral Group، Border Group، Niche Broheelers، Espino می پیوندند. کانی گارسیا، کید وودو، کریستینا، لالی، لولا نیلی، LOrna، Maluma، Mar Solis، Mau and Ricky، Paola Jara، Pitbull، Quevedo، RaiNao، Rawayana، King Tony Freezer، Ryan Castro، SANTOS BRAVOS، Thunder، Wow Popy و Zhami. اعضای پنل اجرایی که قبلا تایید شده بودند عبارتند از کلودیا اوچوا، کریستینا پرپینا رابرت، قاضی، خورخه پپو فراداس، میگل رامیرز، نات پاستور، پاز آپاریسیو، ربکا لئون، راب جوناس، تامی موتولا، ویکتور گونزالس و والتر کلم. لیلا کوبو، مدیر ارشد محتوای بیلبورد، ماه گذشته در یک کنفرانس مطبوعاتی که در آن بیشتر برنامه فاش شد، گفت: «موسیقی لاتین هرگز آنقدر جهانی، غنی، ظریف و به‌طور گسترده‌ای مثل الان نبوده است."}, {"source": "Billboard", "title": "‘The Last Dance’: Shakira Announces Maluma Among Guests for the Finale of Her Madrid Residency", "link": "https://www.billboard.com/music/latin/shakira-madrid-residency-adds-show-date-1236354168/", "summary": "UPDATE (Oct. 6): For the final date of her residency in Madrid on Oct. 12, Shakira will be joined by Maluma , Beéle and Dani Martín , although the guest list might not yet be finalized. “We’ll be sharing more news in the coming days because we want to surprise everyone little by little, not all at once,” Pino Sagliocco, president of Live Nation Spain, said during a press conference on Tuesday (Oct. 6) in Madrid. Related Shakira s Madrid Concert Sets an Amazon Music Livestreaming Record All the Guests at Shakira s Madrid Residency (Updating) Madrid Howls With Shakira as She Kicks Off 12-Date Residency: Tonight We Are One Announced on Monday (Oct. 5) as “The Last Dance,” the concert will bring Shakira’s residency to a total of 13 dates in the Spanish capital. Additionally, with this new show, Shakira will perform for four consecutive nights, from Oct. 9 to Oct. 12. Sagliocco acknowledged that this will be an extra challenge for the artist, but assured that it was Shakira herself who decided to add the date due to high demand. “The She-Wolf, as always, has thrown herself into the ring,” he said. “She decided she was willing to make the sacrifice and do four consecutive days.” The Oct. 12 program will go beyond the main stage, including a tribute to Federico García Lorca at Macondo Park. This tribute, marking 90 years since his death, will focus on flamenco and the poet s legacy. Among the announced participants are Israel Fernández, Kiki Morente and Antonio Carbonell, as well as designer Juana Martín. There will also be a performance centered on Omega , the album by Enrique Morente and Lagartija Nick inspired by Lorca’s work, featuring part of its original lineup and the participation of Morente. During the concert, Shakira and Maluma will reunite on stage after a history of collaborations such as “Chantaje” and, more recently, “Agua,” which they will perform live together for the first time. Beéle will also join the night after collaborating with the Colombian superstar on “Algo Tú” and a new version of “Hips Don’t Lie” released this year to celebrate the song’s 20th anniversary. Dani Martín, meanwhile, will represent Spain as one of the night’s guests artists. PREVIOUSLY (Oct. 5): Shakira announced a new date on Monday (Oct. 5) for her residency in Madrid, which will now extend until Oct. 12, one day after what was initially planned to be her final concert in the Spanish capital. Dubbed El Último Baile (The Last Dance), the show will take place on Spain s H", "date_str": "2026-10-06T12:41:41+00:00", "hash": "cf923179b17a2115", "title_fa": "\"آخرین رقص\": شکیرا مالوما را در میان مهمانان فینال اقامت مادرید خود اعلام کرد", "summary_fa": "به روز رسانی (6 اکتبر): برای تاریخ نهایی اقامت او در مادرید در 12 اکتبر، شکیرا با Maluma، Beéle و Dani Martín همراه خواهد شد، اگرچه فهرست مهمانان ممکن است هنوز نهایی نشده باشد. پینو ساگلیوکو، رئیس Live Nation اسپانیا، طی یک کنفرانس مطبوعاتی در روز سه شنبه (6 اکتبر) در مادرید گفت: \"ما در روزهای آینده اخبار بیشتری را به اشتراک خواهیم گذاشت زیرا می خواهیم همه را کم کم غافلگیر کنیم، نه یکباره.\" کنسرت مادرید مرتبط با موسیقی آمازون رکورد پخش زنده موسیقی آمازون را ثبت می‌کند همه مهمان‌های Shakira s Madrid Residency (در حال به‌روزرسانی) مادرید با شکیرا زوزه می‌کشد در حالی که او 12-Date Residency را شروع می‌کند: امشب ما یکی هستیم دوشنبه (5 اکتبر) به عنوان «آخرین رقص در اسپانیایی» اعلام شد. سرمایه علاوه بر این، با این نمایش جدید، شکیرا برای چهار شب متوالی از 9 اکتبر تا 12 اکتبر اجرا خواهد کرد. ساگلیوکو اذعان کرد که این یک چالش اضافی برای هنرمند خواهد بود، اما اطمینان داد که این خود شکیرا بود که به دلیل تقاضای زیاد تصمیم گرفت تاریخ را اضافه کند. او گفت: \"گرگ، مثل همیشه، خود را به رینگ انداخته است.\" او تصمیم گرفت که حاضر است این فداکاری را انجام دهد و چهار روز متوالی انجام دهد. برنامه 12 اکتبر فراتر از صحنه اصلی خواهد بود، از جمله ادای احترام به فدریکو گارسیا لورکا در پارک ماکوندو. این ادای احترام، به مناسبت 90 سال از مرگ او، بر فلامنکو و میراث شاعر متمرکز است. در میان شرکت کنندگان اعلام شده اسرائیل فرناندز، کیکی مورنته و آنتونیو کاربونل و همچنین طراح خوانا مارتین هستند. همچنین اجرایی با محوریت امگا، آلبومی از انریکه مورنته و لاگارتیا نیک با الهام از آثار لورکا برگزار می‌شود که بخشی از ترکیب اصلی آن و مشارکت مورنته را به نمایش می‌گذارد. در طول این کنسرت،"}, {"source": "Billboard", "title": "Marcus Mumford & Carey Mulligan Raised $7.65 Million For Children in War Zones at Annual Wassail Benefit Charity Show", "link": "https://www.billboard.com/music/rock/marcus-mumford-carey-mulligan-raise-7-million-benefit-concert-1236354876/", "summary": "Marcus Mumford and Carey Mulligan raised more than $7.6 million at their annual Wassail benefit show at the El Rey Theatre in Los Angeles on Sunday night (Oct. 4). The first L.A. edition of the show benefiting the nonprofit Children in Conflict — which works to protect, educate and provide mental health support for children in war zones and high-conflict areas — featured emcee comedian Jack Whitehall, as well as performances from Mumford Sons , Brandi Carlile, Sierra Ferrell and Jensen McRae. Mumford and wife actress Mulligan have been global ambassadors for Children in Conflict for more than a decade and on Jimmy Kimmel Live! on Monday night (Oct. 5), Mumford said the show was amazing, and noted the huge amount of money raised for the organization. I think we asked you to host it but you were unavailable, he joked to Kimmel, who was just returning to the West Coast after taking his late-night talk show to Brooklyn last week. You would have raised less had I been there, Kimmel joked, suggesting Mumford try again in the future. According to Variety , the show featured readings from actresses Viola Davis and Octavia Spencer, tableside magic from Pete Heat, as well as guests Daisy Edgar-Jones, Emma Watson, Courteney Cox, Kristen Bell, Dax Shepard, David Chang, Kathleen Kennedy, Lee Sung Jin, Sarah Polley, Dede Gardner, Jeremy Kleiner and Simon Kinberg, among others. Mumford and Mulligan travel to war zones to see the charity s programs on the ground each year and according to the magazine, when The Ballad of Wallis Island star Mulligan announced the huge amount raised this year on Sunday night there was an audible gasp in the room as she noted, This is more money then we have ever raised before. Mumford told the crowd that the money will help the organization bring support to over one million children in war zones. Mumford also stuck around on Kimmel to perform Here from his band s sixth album, Prizefighter , with Nickel Creek/Punch Brothers member singer/mandolin player Chris Thile filling in for Chris Stapleton, who appears on the recorded version of the track. Watch the performance below.", "date_str": "2026-10-06T12:36:55+00:00", "hash": "0af3a3fffa0fd2b8", "title_fa": "مارکوس مامفورد و کری مولیگان در نمایشگاه سالانه خیریه Wassail Benefit 7.65 میلیون دلار برای کودکان در مناطق جنگی جمع آوری کردند.", "summary_fa": "مارکوس مامفورد و کری مولیگان بیش از 7.6 میلیون دلار در نمایش سود سالانه Wassail در تئاتر ال ری در لس آنجلس یکشنبه شب (4 اکتبر) جمع آوری کردند. اولین نسخه لس‌آنجلس از این نمایش که به نفع سازمان غیرانتفاعی Children in Conflict بود - که برای محافظت، آموزش و حمایت از سلامت روان برای کودکان در مناطق جنگی و مناطق پر درگیری کار می‌کند - کمدین emcee جک وایت‌هال و همچنین اجراهایی از پسران مامفورد، برندی کارلیل، سیرا فرل و جنسن مک‌ری را به نمایش گذاشت. مامفورد و همسرش، بازیگر مولیگان، بیش از یک دهه است که سفیران جهانی کودکان در تضاد و در برنامه زنده جیمی کیمل بوده اند! دوشنبه شب (5 اکتبر)، مامفورد گفت که نمایش فوق العاده بود و به مقدار زیادی پول جمع آوری شده برای سازمان اشاره کرد. فکر می‌کنم از شما خواستیم که میزبان آن باشید، اما شما در دسترس نبودید، او با کیمل، که پس از شرکت در برنامه گفتگوی آخر شب خود در بروکلین، به تازگی به ساحل غربی بازمی‌گشت، شوخی کرد. کیمل با شوخی به مامفورد پیشنهاد داد که در آینده دوباره تلاش کند، اگر من آنجا بودم، کمتر پول جمع می‌کردی. به گزارش ورایتی، این نمایش شامل خواندنی از بازیگران زن ویولا دیویس و اکتاویا اسپنسر، جادوی کنار میز از پیت هیت، و همچنین مهمانان دیزی ادگار جونز، اما واتسون، کورتنی کاکس، کریستن بل، داکس شپرد، دیوید چانگ، کاتلین کندی، لی سونگ، سینر سیندی، سارا کینبرگ، در میان دیگران. مامفورد و مولیگان هر سال به مناطق جنگی سفر می‌کنند تا برنامه‌های خیریه را روی زمین ببینند و به گفته این مجله، وقتی مولیگان، ستاره The Ballad of Wallis Island، مبلغ هنگفت جمع‌آوری شده امسال را در یکشنبه شب اعلام کرد، صدای نفس کشیدن در اتاق شنیده می‌شد، همانطور که او خاطرنشان کرد، این پولی است که ما قبلاً جمع‌آوری"}, {"source": "Deadline", "title": "David Ellison, Ynon Kreiz Praise Staff, Lay Out Priorities For New Skydance: “Getting Here Has Been Quite A Journey”", "link": "https://deadline.com/2026/10/david-ellison-skydance-merger-staff-memo-1237147828/", "summary": "Skydance CEO David Ellison, having just closed the historic merger of Paramount and Warner Bros. Discovery after fierce opposition, sought to rally the troops Tuesday in a memo to employees. In the lengthy message (read it below), Ellison and Co-CEO Ynon Kreiz thanked staffers for their patience during the year-long process, and outlined top priorities [ ]", "date_str": "2026-10-06T14:15:44+00:00", "hash": "d6f47f8787ad13f9", "title_fa": "دیوید الیسون، کارکنان ستایش Ynon Kreiz، اولویت‌ها را برای Skydance جدید مشخص می‌کنند: «دسترسی به اینجا یک سفر کاملاً بوده است»", "summary_fa": "دیوید الیسون، مدیرعامل Skydance، که به تازگی ادغام پارامونت و برادران وارنر را پس از مخالفت شدید بسته بود، روز سه‌شنبه در یادداشتی برای کارمندان به دنبال جمع‌آوری نیروها بود. در این پیام طولانی (آن را در زیر بخوانید)، الیسون و مدیر عامل شرکت ینون کریز از کارکنان به خاطر صبرشان در طول فرآیند یکساله تشکر کردند و اولویت‌های اصلی را تشریح کردند. در طول یک سال گذشته و بعد از آن، کار سخت، پشتکار و تعهد همراه با چالش‌های زیادی در طول راه بوده است، اما ما آن را انجام دادیم! داستان‌های مرتبط اخبار Skydancing در نهایت: ادغام 110 میلیارد دلاری پارامونت و برادران وارنر دیسکاوری رسماً قرارداد مدیران را با کیسی بلویز مجدداً می‌بندد در حالی که او شروع به یکپارچه‌سازی تیم‌های HBO Max Paramount+ می‌کند. تماشای ددلاین معامله Skydance چشم‌انداز رسانه‌ای را تغییر می‌دهد و رقیبی با پتانسیل رقابت با نتفلیکس، دیزنی و آمازون ایجاد می‌کند. با این حال، این تراکنش همچنین 80 م uced by Jaggi Entertainment, will debut exclusively on The Roku Channel in 2027. Written by [ ]", "date_str": "2026-10-06T13:00:00+00:00", "hash": "9114da876c7dc3b2", "title_fa": "لوسی هیل برای تیتر سریال محدود «اسکارلت هلمز» در Roku", "summary_fa": "Roku به اسکارلت هولمز، سری جدید محدود Roku Original، چراغ سبز نشان داده است که لوسی هیل قرار است بازیگر و تهیه کننده اجرایی آن باشد. اسکارلت هولمز که توسط Jaggi Entertainment تهیه شده است، گفته می شود یک چرخش تازه و رمانتیک در دنیای افسانه ای شرلوک هلمز ایجاد می کند، در سال 2027 به طور انحصاری در کانال Roku پخش خواهد شد. نوشته [ ] نوشته پاریس هربرت تیلور و کتی ویلبرت، اسکارلت هولمز حول شخصیت اصلی با بازی هیل، از نوادگان مدرن شرلوک هلمز که قدرت افسانه ای خود را در مشاهده به ارث برده است، می چرخد، اما به جای حل جنایات، او به سراغ اسرار دوستی و روابط عاشقانه می رود. داستان‌های مرتبط News Roku 30 باندل جدید به اشتراک‌های پرمیوم اضافه می‌کند، ارائه ترکیب‌های ترکیبی با HBO Max، AMC+، Fox One News. به اسکارلت در هر قسمت ملحق می‌شود، دستیار قابل اعتماد او، جین واتسون، (بازیگر TBA) زیرا به مشتریان کمک می‌کند سیگنال‌های مختلط، شکست‌های مخفی، دوراهی‌های عاشقانه و همه چیز را در بین آن‌ها هدایت کنند. اما در حالی که اسکارلت ممکن است در حل مشکلات عاشقانه دیگران متخصص باشد، رمزگشایی زندگی عاشقانه او بسیار دشوارتر است. هنگامی که او عاشق اولی موریاریتی (بازیگر بازیگری TBA) می شود، یک تهیه کننده جذاب پادکست مخفیانه یک نمایشگاه در مورد روش های خود برنامه ریزی می کند، او با سخت ترین مورد از همه روبرو می شود: خودش. برایان تاننبام، رئیس Roku Originals، گفت: لوسی هیل شوخ طبعی، گرمی و غرایز کمدی دارد که او را به شریک خلاق عالی برای زنده کردن اسکارلت هلمز تبدیل می کند. این مجموعه هوشمند و پیچیده دو ژانر را که پخش‌کننده‌های ما عاشقانه و رازآلود هستند از طریق برداشتی تازه و بازیگوش از یکی از شناخته‌شده‌ترین میراث در داستان‌گویی تجلیل می‌کند."}, {"source": "Deadline", "title": "Amazon Strikes Six-Year Global Deal For Emmys Worth More Than $20M Per Year, Will Make Event Free To View", "link": "https://deadline.com/2026/10/amazon-emmys-six-year-global-deal-1237147189/", "summary": "The Emmys officially have a new rights holder. Amazon on Tuesday closed its deal with the Television Academy, as previewed last month, and it’s a significant pact. The partnership gives Prime Video the right to stream the annual TV awards ceremony for the next six years and is thought to be worth north of $120 [ ]", "date_str": "2026-10-06T13:00:00+00:00", "hash": "db045b02f7598670", "title_fa": "آمازون یک قرارداد جهانی شش ساله برای جایزه امی به ارزش بیش از 20 میلیون دلار در سال منعقد می کند و مشاهده رویداد را رایگان می کند.", "summary_fa": "جوایز امی رسما یک دارنده حقوق جدید دارند. آمازون روز سه‌شنبه قرارداد خود را با آکادمی تلویزیون، همانطور که در ماه گذشته پیش‌بینی شده بود، بست، و این یک توافق مهم است. این مشارکت به Prime Video این حق را می دهد که مراسم سالانه جوایز تلویزیونی را برای شش سال آینده پخش کند و تصور می شود ارزش آن تقریباً 120 دلار باشد [ ] پخش کننده حقوق جهانی این رویداد را گرفته است اما تماشای آن را در سرویس Prime Video خود در سپتامبر هر سال رایگان می کند. ددلاین می‌داند که ارزش این معامله بین 20 تا 25 میلیون دلار در سال است و یک منبع ارزش آن را 24 میلیون دلار در سال می‌داند. Watch on Deadline این معامله موفق به چرخ پخش می شود، که شاهد بود شبکه های پخش ABC، CBS، Fox و NBC هر سال حق پخش مراسم را تغییر می دهند. این سیستم برای بیش از 30 سال، از سال 1995، برقرار بوده است. مایک هاپکینز، رئیس Prime Video و Amazon MGM Studios، به Deadline گفت که می‌خواهد یک رویداد جهانی در Prime Video ایجاد کند. او گفت که ما فکر می‌کردیم می‌توانیم بینندگان را افزایش دهیم، مخاطبان جوان‌تری را جذب کنیم، با آکادمی کار کنیم تا انرژی بیشتری بگذاریم، و شاید به خود تولید نگاه کنیم تا نوآوری کنیم. من احساس می‌کنم که می‌توانیم جوایز امی را در مسیری به سمت رشد و ارتباط جهانی قرار دهیم که احتمالاً زمانی که از شبکه‌ای به شبکه‌ای دیگر می‌چرخید و سپس به روش‌های مختلف در سراسر جهان توزیع می‌شد، سخت‌تر بود. ماهیت جهانی این معامله جالب است، به ویژه با توجه به افزایش هزینه ای که آکادمی تلویزیون تضمین کرده است. شبکه های پخش بین 8 تا 10 میلیون دلار در سال برای پخش در ایالات متحده پرداخت می کنند، اما مشخص نیست"}, {"source": "Deadline", "title": "Skydancing At Last: $110B Merger Of Paramount And Warner Bros Discovery Officially Closes", "link": "https://deadline.com/2026/10/skydance-merger-paramount-warner-bros-discovery-1237147750/", "summary": "The long-gestating merger of Paramount and Warner Bros. Discovery officially closed Tuesday, yielding a new major player in media. Shares in the combined company, Skydance, will start trading later in the day on the New York Stock Exchange. Shares of Paramount and Warner Bros. Discovery have been discontinued on the Nasdaq. The closing brings to [ ]", "date_str": "2026-10-06T12:59:57+00:00", "hash": "ec40207031d55e1f", "title_fa": "Skydancing At Last: ادغام 110 میلیارد دلاری Paramount و Warner Bros Discovery رسما بسته شد", "summary_fa": "ادغام دیرینه پارامونت و برادران وارنر دیسکاوری روز سه شنبه رسماً بسته شد و یک بازیگر اصلی جدید در رسانه ها به وجود آورد. سهام این شرکت ترکیبی، Skydance، در اواخر روز در بورس نیویورک شروع به معامله خواهد کرد. سهام پارامونت و برادران وارنر دیسکاوری در نزدک متوقف شده است. پایان به [ ] می انجامد. با پایان دادن به یک حماسه یک ساله درباره اینکه چه کسی استودیوهای فیلمسازی دو قرنی را به همراه مجموعه ای از استودیوهای تلویزیونی، سرویس های پخش جریانی و شبکه هایی از جمله HBO و CNN کنترل خواهد کرد. اکنون توجه به اقتصاد دشواری که شرکت جدید با آن مواجه است معطوف خواهد شد. شروع آن با حدود 80 میلیارد دلار بدهی و یک برنامه بلندپروازانه برای تبدیل یک شرکت رسانه سنتی به یک عملیات فناوری محور است که قادر به اندازه گیری نتفلیکس، آمازون و دیزنی است. لری الیسون، یکی از بنیانگذاران میلیاردر اوراکل، یکی از حامیان اصلی Skydance است. پسر او، دیوید الیسون، بازیگری که تبدیل به تهیه‌کننده شده است و تنها در 43 سالگی وارد صحنه شرکت‌های هالیوود شده است، شرکت را به عنوان رئیس هیئت مدیره و مدیرعامل اداره می‌کند. دیوید الیسون در بیانیه ای گفت: امروز یک روز تاریخی است، نه فقط برای Skydance بلکه برای کل صنعت ما. از همان ابتدا، جاه طلبی ما این بود که این دو استودیو داستانی را به هم نزدیک کنیم و رقیبی قوی‌تر، با استعداد، منابع، و دستیابی به گفتن داستان‌های عالی در هر سبک، در هر پلتفرم، برای مخاطبان در همه جا ایجاد کنیم. اکنون این جاه طلبی یک واقعیت است. ما از همه کسانی که این امکان را فراهم کردند، کارمندان، استعدادهای خلاق و تیم های تولید هر دو شرکت که خستگی ناپذیر برای رسیدن ما به اینجا و الهام بخشیدن به مخاطبان در سراسر جهان هر روز تلاش"}, {"source": "Deadline", "title": "FilmNation Strikes Deal With High Road Over TV Slate", "link": "https://deadline.com/2026/10/filmnation-strikes-deal-high-road-portrait-of-a-lady-1237147754/", "summary": "EXCLUSIVE: FilmNation has partnered with nascent British indie High Road Entertainment. The two outfits will seek to co-produce projects and High Road will support them through financing and international market strategy, while also providing executive production expertise from development through production. The pair said Anora studio FilmNation s internationally focused approach to producing and financing ambitious [ ]", "date_str": "2026-10-06T12:57:03+00:00", "hash": "8417c58b9a1cab35", "title_fa": "فیلم ملت با جاده بلند بر سر تخته تلویزیونی معامله می کند", "summary_fa": "اختصاصی: FilmNation با High Road Entertainment مستقل نوپای بریتانیایی همکاری کرده است. این دو شرکت به دنبال تولید مشترک پروژه‌ها خواهند بود و High Road از طریق تامین مالی و استراتژی بازار بین‌المللی از آنها حمایت می‌کند و در عین حال تخصص تولید اجرایی را از توسعه تا تولید ارائه می‌کند. این زوج گفتند که رویکرد متمرکز بین‌المللی Anora FilmNation برای تولید و تامین مالی پروژه‌های تلویزیونی بلندپروازانه بین‌المللی FilmNation شامل اقتباس Prime Video از The House of the Spirits اثر ایزابل آلنده و اقتباس آتی از کتاب Graham Norton Forever Home for Skydance UK 5 است. جیمز دوری، تالک هارت و رئیس سابق سینفلیکس فیلمنامه تلویزیونی. FilmNation و High Road گفتند که اطلاعیه های بیشتر در مورد کمیسیون هایی که قبلاً وجود داشته است، متعاقباً خواهد آمد. کرستی مک دونالد، رئیس تلویزیون FilmNation، High Road را شریک ایده آلی برای تخته سنگ نامید. او افزود که درک آن‌ها از چشم‌انداز تلویزیون بین‌المللی، همراه با توانایی‌های تامین مالی، توزیع و تولید اجرایی، آن‌ها را به شریکی عالی برای ایجاد موفقیت‌هایی که تاکنون به دست آمده تبدیل می‌کند. ما مشتاقانه منتظر همکاری با یکدیگر هستیم تا این پروژه های بلندپروازانه را به زندگی و برای مخاطبان در سطح جهان بیاوریم. تالک هارت و دوری در بیانیه‌ای افزودند: FilmNation برای شناسایی و حمایت از داستان‌ها و فیلمسازان متمایز و جسور، شهرت استثنایی ایجاد کرده است. ما از شراکت با تیم و کمک به رساندن این فهرست به مخاطبان در سراسر جهان و ساختن بر اساس نمایش هایی که قبلاً در حال تولید بوده ایم، هیجان زده هستیم. تمرکز ما بر حمایت از کار خلاقانه بزرگی است که کرستی مک‌دونالد و تیمش تا به امروز با تامین مالی، تخصص تولید و استراتژی بازار مورد نیاز برای تحقق این پروژه‌ها در بالاترین سطح ساخته‌اند."}, {"source": "Deadline", "title": "ESPN & HBO Vet Bomani Jones Teams With Playmaker For Long-Running Podcast ‘The Right Time’", "link": "https://deadline.com/2026/10/espn-hbo-bomani-jones-playmaker-podcast-the-right-time-1237146725/", "summary": "EXCLUSIVE: Bomani Jones, best known for his stints at ESPN and HBO, is teaming with podcast firm Playmaker for his long-running show The Right Time. The New York-based Playmaker, which is owned by Danish digital sports media company Better Collective, has built an estimable roster of podcasts with a eye toward the increasing cross-over to [ ]", "date_str": "2026-10-06T12:46:57+00:00", "hash": "b05b20964ecb5a15", "title_fa": "ESPN و HBO Vet Bomani Jones با Playmaker برای پادکست طولانی مدت \"زمان مناسب\" همکاری می کنند", "summary_fa": "اختصاصی: بومانی جونز، که بیشتر به خاطر حضور در ESPN و HBO شناخته می شود، با شرکت پادکست Playmaker برای برنامه طولانی مدت خود The Right Time همکاری می کند. Playmaker مستقر در نیویورک، که متعلق به شرکت رسانه‌های ورزشی دیجیتال دانمارکی Better Collective است، فهرست قابل‌توجهی از پادکست‌ها را با چشم‌اندازی به سوی تقاطع فزاینده به [ ] ساخته است. انحصاری: بومانی جونز، که بیشتر به‌خاطر حضورش در ESPN و HBO شناخته می‌شود، با شرکت پادکست Playmaker-Runnight برای نمایش طولانی خود همکاری می‌کند. The Right Time در سال 2018 تحت نظارت ESPN راه اندازی شد و جونز حقوق آن را در سال 2021 به دست آورد. او میزبان آن بود تا اینکه ESPN در سال 2023 را ترک کرد و اولین مجری سریال Game Theory بود که در اواخر شب از HBO در سال های 2022 و 23 پخش شد. اخبار مربوط به ددلاین را تماشا کنید راج شامانی، خالق محتوای هندی میزبان Figuring Out Pod، با مدیران WME، کیسی بلویز، قرارداد را دوباره امضا کرد، در حالی که او شروع به ادغام تیم‌های HBO Max Paramount+ کرد. NY. او همچنین به تغییر سریع اکوسیستم رسانه‌های ورزشی، ظهور ورزشکاران به‌عنوان خالق رسانه و اینکه چگونه تجربه اولیه‌اش در رادیو او را برای عصر پادکست آماده کرد، اهمیت داد. گفتگو برای وضوح و طولانی بودن فشرده و ویرایش شده است. مهلت: نمایش چگونه با انتقال به Playmaker تغییر می کند؟ BOMANI JONES: در این مرحله، مخاطبان خیلی بیشتر روی خود محصول سرمایه گذاری می کنند تا جایی که آن محصول از آنجا آمده است. مانند زمانی که ESPN را ترک کردم، فکر می‌کنم که می‌توانم با نوعی عصبانیت به مردم پاسخ دهم، زیرا برای من در آن مرحله، دیگر فقط پادکست را برای آنها انجام می‌دادم. من تلویزیون کار نمی کردم بنابراین مهم نبود ESPN باشد یا نه. ESPN در"}, {"source": "Deadline", "title": "James Corden & Ruth Jones’ Apple Show ‘The Choir’ Reveals Cast & Guest Stars Hannah Waddingham, James McAvoy & Jim Broadbent", "link": "https://deadline.com/2026/10/corden-jones-the-choir-apple-cast-hannah-waddingham-1237147052/", "summary": "EXCLUSIVE: Hannah Waddingham, James McAvoy and Jim Broadbent will guest star in The Choir, the highly-anticipated Apple TV series from Gavin Stacey creators James Corden and Ruth Jones. The trio will be joined by an ensemble featuring Tom Davis, Rosie Sheehy, Susan Brown, Jason Watkins, David Harewood, Alexandria Riley, Sylvestra Le Touzel, Tom Edden, [ ]", "date_str": "2026-10-06T12:30:00+00:00", "hash": "b99a2866ef451862", "title_fa": "نمایش اپل جیمز کوردن و روث جونز، گروه کر، بازیگران و مهمان ستاره‌های هانا وادینگهام، جیمز مک آووی و جیم برادبنت را نشان می‌دهد.", "summary_fa": "اختصاصی: هانا وادینگهام، جیمز مک‌آوی و جیم برادبنت به عنوان مهمان در The Choir، سریال موردانتظار Apple TV ساخته جیمز کوردن و روث جونز، خالقان گاوین استیسی، بازی خواهند کرد. گروهی با حضور تام دیویس، رزی شیهی، سوزان براون، جیسون واتکینز، دیوید هاروود، الکساندریا رایلی، سیلوسترا لو توزل، تام اددن، [ ] همچنین می‌توانیم فاش کنیم که نمایش توسط سازنده I May Destroy You یعنی Various Artists Limited با TidyTwo تولید خواهد شد. این جدایی از گاوین استیسی است که توسط گاو بچه استیو کوگان و فولول اینترتینمنت کوردن ساخته شده است. اخبار مرتبط اخبار زنان ناقص برای فصل 2 تمدید شده توسط اپل با محوریت شخصیت کری واشنگتن النور اخبار مارتین فریمن جیم برودبنت برای داستان ارواح کریسمس دیکنزی The Bride's Chamber در بی بی سی گروه کر برادر و خواهر بن (کوردن) و لیزا (جونز) را دنبال می کند که چندین سال است که یکدیگر را ندیده اند. بن در خارج از کشور زندگی می‌کرده است، در حالی که لیزا در شهر کوچک انگلیسی آنها زندگی می‌کند، جایی که هیچ اتفاقی نمی‌افتد. اما وقتی وقایع تغییر می کند، بن مجبور می شود به زندگی ای که هرگز نمی خواست بازگردد، شهری که هرگز دوستش نداشت و خانواده ای که از آن جدا شده است. تماشا در Deadline The Choir، که دوربین‌هایش را به نمایش درآورده و سال آینده پخش خواهد شد، جدیدترین اثر از دو نفر پشت سر Gavin Stacey، کمدی کمدی بریتانیایی نمادین است که دو سال پیش به عنوان پربیننده‌ترین نمایش بریتانیا در سال 2024 پایان یافت. این نمایش تعداد بالایی از ستاره های مهمان را به خود جلب کرده است. وادینگهام برای بازی در سریال تلویزیونی متفاوت اپل، تد لسو، که به تازگی فصل 4 را منتشر کرده است، شهرت جهانی پیدا کرد."}, {"source": "Deadline", "title": "France Appoints 99th Academy Awards Season Tzar", "link": "https://deadline.com/2026/10/france-appoints-academy-awards-season-tzar-1237147745/", "summary": "France’s National Cinema Centre (CNC) has appointed Sébastien Cauchon as its first ever dedicated Academy Awards liaison to support French candidates in the running across the various categories of the 99th edition. The newly created position will see him provide guidance and expertise to French film teams lining up for an awards season run. He [ ]", "date_str": "2026-10-06T12:28:50+00:00", "hash": "ff7359465c7f3149", "title_fa": "فرانسه نود و نهمین فصل جوایز اسکار را تعیین کرد", "summary_fa": "مرکز ملی سینمای فرانسه (CNC) سباستین کوچون را به عنوان اولین رابط اختصاصی جوایز اسکار برای حمایت از نامزدهای فرانسوی در رقابت در بخش‌های مختلف دوره نود و نهم انتخاب کرده است. موقعیت تازه ایجاد شده باعث می شود که او به تیم های فیلم فرانسوی که برای یک دوره جوایز آماده می شوند، راهنمایی و تخصص ارائه دهد. او [ ] مرکز ملی سینمای فرانسه (CNC) S bastien Cauchon را به عنوان اولین رابط اختصاصی جوایز اسکار برای حمایت از نامزدهای فرانسوی در رقابت در بخش‌های مختلف دوره 99 منصوب کرد. او تمرکز ویژه‌ای بر فیلم «مینوتور» آندری زویاگینتسف خواهد داشت، فیلمی که امسال برای فرانسه در بخش بهترین فیلم بلند بین‌المللی انتخاب شده است. CNC در بیانیه ای که این انتصاب را اعلام کرد، گفت: در هفته های آینده، ابتکاراتی برای افزایش آگاهی در مورد فرآیندها و استراتژی های کمپین آکادمی، در کنار مجموعه ای از رویدادها که فیلم های فرانسوی در حال رقابت را به نمایش می گذارند، سازماندهی خواهد شد. تماشای آخرین مهلت داستان‌های مرتبط اسکار مستند: سوریه، فیلم ترکیبی زندان سیدنایا را انتخاب می‌کند، طرف دیگر خورشید در اولین اخبار ورود پس از اسد اسکار: اردن سینک زین دورایی را برای بهترین فیلم بلند بین‌المللی انتخاب می‌کند. به عنوان جوایز مستقل و مشاور استراتژی بین‌المللی تحت عنوان Cinema Collectors. او قبلاً از کمپین های جوایز The Father، The Substance و Deux حمایت کرده است و امسال نیز به Bunker وابسته است. فرانسه رابطه پیچیده ای با اسکار دارد."}, {"source": "Netflix NL", "title": "Netflix-kijkers smullen massaal van rechtbankserie", "link": "https://www.netflix-nederland.nl/netflix-kijkers-smullen-massaal-van-rechtbankserie/", "summary": "Jij bent vandaag toe aan een goede rechtbankserie! Hold up , horen we Netflix roepen, wij hebben iets voor je! Matlock uit 2024 staat sinds kort op de streamingdienst en dat hoef je de abonnees (in ons land in ieder geval) geen twee keer te zeggen! Matlock stormt top 10 op Netflix binnen De desbetreffende show heeft zijn weg naar de top 10 met meest bekeken series op Netflix namelijk al gevonden! Momenteel staat Matlock op nummer zes, maar wie weet gaat deze serie nog wat klimmen! Dan wat uitleg, want Matlock (2024) is een soort reboot. In 1986 kwam het allereerste seizoen van het originele Matlock uit, en die serie liep tot 1995. In 2024 ging een moderne herinterpretatie van die show in première op de Amerikaanse zender CBS, géén vervolg waarin het verhaal van Ben Matlock wordt voortgezet. Die herinterpretatie is nu te zien op Netflix. Dramaserie Matlock (de versie waar we het over hebben) is een Amerikaanse juridische dramaserie uit 2024, met Kathy Bates als Madeline Matty Matlock. Ze is een briljante advocate van in de zeventig die na een lange afwezigheid weer aan de slag gaat bij een prestigieus advocatenkantoor in New York. Matty lijkt op het eerste gezicht een vriendelijke, wat ouderwetse vrouw die niet helemaal thuishoort in de moderne advocatenwereld. Haar collega’s en tegenstanders onderschatten haar daardoor regelmatig. In werkelijkheid is ze bijzonder scherp en weet ze haar onschuldige uitstraling slim te gebruiken om informatie te verzamelen en rechtszaken te winnen. De serie draait niet alleen om de juridische zaken die ze samen met haar collega’s behandelt. Matty heeft namelijk ook een verborgen persoonlijke agenda en is niet zomaar bij het kantoor komen werken. Langzaam wordt duidelijk dat ze op zoek is naar antwoorden over iets uit haar verleden. Daarnaast speelt de onderlinge dynamiek op het kantoor een belangrijke rol. Matty moet het vertrouwen winnen van haar collega’s, terwijl ze tegelijkertijd haar geheimen verborgen probeert te houden. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep ! The post Netflix-kijkers smullen massaal van rechtbankserie appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-06T13:47:48+00:00", "hash": "99aef13d5ff8a936", "title_fa": "بینندگان نتفلیکس به طور انبوه از سریال های دادگاه لذت می برند", "summary_fa": "امروز برای یک سریال دادگاه خوب آماده اید! صبر کنید، صدای فریاد نتفلیکس را می شنویم، ما چیزی برای شما داریم! Matlock از سال 2024 اخیراً به سرویس استریم اضافه شده است و لازم نیست دو بار (به هر حال در کشور ما) به مشترکان بگویید! متلاک به 10 تای برتر نتفلیکس راه یافت. سریال مورد بحث قبلاً به 10 سریال برتر نتفلیکس راه پیدا کرده است! Matlock در حال حاضر در رتبه ششم قرار دارد، اما چه کسی می‌داند، این سری ممکن است بیشتر صعود کند! سپس کمی توضیح، زیرا Matlock (2024) نوعی راه اندازی مجدد است. اولین فصل سریال اصلی Matlock در سال 1986 منتشر شد و این سریال تا سال 1995 ادامه داشت. در سال 2024، تفسیری مدرن از آن سریال در کانال آمریکایی CBS به نمایش درآمد، نه دنباله‌ای که داستان بن متلاک را ادامه دهد. این تفسیر مجدد اکنون در نتفلیکس قابل مشاهده است. سریال درام Matlock (نسخه ای که در مورد آن صحبت می کنیم) یک سریال درام حقوقی آمریکایی محصول سال 2024 است که کتی بیتس در نقش مدلین متی متلوک بازی می کند. او یک وکیل باهوش در دهه هفتاد خود است که پس از مدت ها غیبت برای کار در یک شرکت حقوقی معتبر در نیویورک باز می گردد. در نگاه اول، متی مانند یک زن دوستانه و تا حدودی قدیمی به نظر می رسد که کاملاً در دنیای حقوقی مدرن نمی گنجد. در نتیجه همکاران و مخالفان او مرتباً او را دست کم می گیرند. در واقعیت، او بسیار تیزبین است و می داند که چگونه از ظاهر بی گناه خود برای جمع آوری اطلاعات و پیروز شدن در دعواهای قضایی هوشمندانه استفاده کند. این سریال فقط به پرونده های حقوقی که او با همکارانش رسیدگی می کند نیست. متی همچنین یک برنامه شخصی پنهان دارد و فقط به دفتر"}, {"source": "Netflix NL", "title": "Vijf (!) Disney-films veroveren Netflix wereldwijd", "link": "https://www.netflix-nederland.nl/vijf-disney-films-veroveren-netflix-wereldwijd/", "summary": "Netflix en Disney hebben een tijdje geleden een grote contentdeal gesloten, waardoor de ene streamingdienst nu over films en series van de andere beschikt. En dat hoef je de abonnee geen twee keer te zeggen. Ice Age-films veroveren Netflix Pak de top 10 met meest bekeken films op Netflix er maar eens bij. De nummers vijf, zes, acht, negen én tien zijn allemaal films uit dezelfde franchise. En de streamingdienst wordt niet alleen in Nederland, maar wereldwijd veroverd door de desbetreffende titels. Het gaat om de Ice Age-films, die voornamelijk de mammoet Manny, de luiaard Sid en de sabeltandtijger Diego volgen. Iedere film heeft een nieuw avontuur, maar tegelijkertijd zie je de personages ouder worden en hun groep steeds meer uitgroeien tot een soort familie. Ice Age (2002) De eerste film speelt zich af tijdens de ijstijd. Manny is een eenzame mammoet die het liefst met rust gelaten wordt, maar hij krijgt onverwacht gezelschap van de irritante maar goedbedoelende Sid. Niet veel later vinden ze een menselijke baby die van zijn familie is gescheiden. Samen met Diego, een sabeltandtijger die aanvankelijk zijn eigen verborgen plannen heeft, proberen Manny en Sid de baby terug te brengen naar zijn vader. Tijdens de reis ontstaat er langzaam een bijzondere vriendschap tussen de drie. Ondertussen probeert Scrat, de bekende eekhoorn, voortdurend zijn eikel veilig te stellen. Ice Age 2: The Meltdown (2006) Manny, Sid en Diego leven inmiddels samen met andere dieren in een grote vallei. Dan ontdekken ze dat het ijs rondom de vallei aan het smelten is en dat er een enorme hoeveelheid water dreigt vrij te komen. De dieren moeten zo snel mogelijk een veilige plek zien te bereiken. Tijdens de reis ontmoet Manny Ellie, een vrouwelijke mammoet die ervan overtuigd is dat ze eigenlijk een opossum is. Ze reist samen met haar broers Crash en Eddie. Manny dacht dat hij misschien de laatste mammoet op aarde was, waardoor zijn ontmoeting met Ellie zijn leven behoorlijk verandert. Ice Age 3: Dawn of the Dinosaurs (2009) In de derde film verwachten Manny en Ellie hun eerste kind. Manny is volledig bezig met het voorbereiden op het vaderschap, terwijl Diego zich afvraagt of hij door zijn rustige leven niet te soft is geworden. Sid voelt zich ondertussen een beetje buitengesloten. Wanne : "I Will Find You is officieel een van de populairste Netflix-series aller tijden, en dus wordt er eens in de zoveel tijd gesteld dat deze serie een tweede seizoen moet krijgen. Harlan Coben reageert daar nu zelf op! Krijgt I Will Find You van Harlan Coben toch een tweede seizoen? In een interview met Collider wordt de thrillerschrijver gevraagd naar een eventueel seizoen 2 van I Will Find You: De afspraak die Netflix me heeft aangeboden, is dat ik geen tweede seizoen ga maken tenzij ik denk dat het beter kan worden dan het eerste seizoen. Hoe kan ik overtreffen dat je wordt gearresteerd voor de moord op je eigen kind? Dat betekent dat de deur dus wel op een kier staat! En dat is opmerkelijk, I Will Find You is immers gebaseerd op de gelijknamige thriller van Coben, en die is door de schrijver geschreven als een zelfstandige thriller en niet als het begin van een reeks. Op zijn officiële website wordt het boek ook expliciet omschreven als een stand-alone novel . Coben kreeg al eerder de vraag of hoofdpersonage David Burroughs ooit nog terugkeert, maar zijn antwoord was probably not (hoogstwaarschijnlijk niet). De schrijver legde uit dat hij zijn verhalen (voor Netflix-series of gewoon boeken) inricht met het idee dat het verhaal in één keer wordt afgerond. Binnenkort gaat dat wel veranderen, met de komst van Myron Bolitar, waarover de schrijver zei: Mijn hart ligt zeker bij Myron Bolitar. Ik heb 34 boeken geschreven, waarvan een derde over Myron Bolitar gaat. Hij is mijn dierbaarste creatie en ik ben erg blij dat hij nu bij Netflix ondergebracht is, zodat we er alles aan kunnen doen om de serie goed te maken. Het is een van de verhalen waar ik altijd extra zorgvuldig mee ben omgegaan. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Krijgt I Will Find You tweede seizoen? Harlan Coben reageert appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-05T16:11:49+00:00", "hash": "cca5b70f447a59f1", "title_fa": "آیا می توانم تو را پیدا کنم فصل دوم دریافت می کنم؟ هارلان کوبن پاسخ می دهد", "summary_fa": "I Will Find You رسما یکی از محبوب ترین سریال های نتفلیکس در تمام دوران است و به همین دلیل هر از چند گاهی گفته می شود که این سریال باید فصل دوم داشته باشد. اکنون هارلان کوبن خودش به این موضوع پاسخ می دهد! آیا می توانم تو را پیدا کنم اثر هارلان کوبن فصل دوم دارد؟ در مصاحبه ای با Collider، از نویسنده تریلر درباره فصل دوم سریال I Will Find You پرسیده می شود: توافقی که نتفلیکس به من پیشنهاد کرده این است که فصل دوم را نمی سازم مگر اینکه فکر کنم می تواند بهتر از فصل اول باشد. چگونه می توانم از دستگیری شما برای قتل فرزند خود برتری بگیرم؟ یعنی در باز است! و این قابل توجه است، بالاخره I Will Find You بر اساس فیلم هیجان انگیزی به همین نام اثر کوبن است که توسط نویسنده به عنوان یک تریلر مستقل نوشته شده است و نه به عنوان شروع یک سریال. در وب سایت رسمی آن، این کتاب نیز به صراحت به عنوان یک رمان مستقل توصیف شده است. قبلاً از کوبن سؤال شده بود که آیا شخصیت اصلی دیوید باروز هرگز بازخواهد گشت، اما احتمالاً پاسخ او نبود. نویسنده توضیح داد که داستان های خود را (برای سریال های نتفلیکس یا فقط کتاب ها) با این ایده که داستان در یک حرکت کامل می شود، سازماندهی می کند. این موضوع به زودی با آمدن مایرون بولیتر تغییر خواهد کرد که نویسنده درباره آن گفت: مطمئناً قلب من متعلق به مایرون بولیتر است. من 34 کتاب نوشته ام که یک سوم آن ها درباره مایرون بولیتر است. او عزیزترین ساخته من است و من بسیار خوشحالم که او اکنون در نتفلیکس است تا بتوانیم هر کاری که از دستمان بر می آید انجام دهیم تا سریال خوب شود. این یکی از داستان هایی"}, {"source": "Pitchfork", "title": "Lorenzo Senni Returns With First Album in Six Years", "link": "https://pitchfork.com/story/lorenzo-senni-returns-with-first-album-in-six-years/", "summary": "“Art Life & Skateboarding” leads the producer’s Warp comeback All Ages, which features Xiu Xiu’s Jamie Stewart", "date_str": "2026-10-06T14:18:49+00:00", "hash": "56b2207ac53d7bdc", "title_fa": "لورنزو سنی با اولین آلبوم پس از شش سال بازگشت", "summary_fa": "«زندگی هنری و اسکیت‌بو برای Big Ears 2027 با هم متحد شدند", "summary_fa": "نیروستا استیل، روتس، جف تویدی، رابرت گلاسپر، و ویز بلاد نیز در جشنواره ناکسویل بازی خواهند کرد. Loader Save Story ذخیره این داستان نظرات Loader Save Story ذخیره این داستان Big Ears قرار است در آوریل آینده دوباره مرکز شهر ناکسویل، تنسی را تصاحب کند. جف تویدی، رابرت گلاسپر، ویز بلاد، Oneohtrix Point Never، بیل فریزل، و مهمانی شام - سوپرگروه گلاسپر، تراس مارتین، کاماسی واشنگتن، و 9th Wonder - در صدر فهرست جشنواره موسیقی، هنر و فیلم قرار دارند. اعلامیه دوم شامل اولین برنامه برنامه ریزی شده از سال 2019 توسط بازیکنان اصلی Deerhunter برادفورد کاکس و لاکت پاندت بود، پس از بازگشت کاکس با Atlas Sound در Making Time ∞ ماه گذشته. این رویداد از 1 تا 4 آوریل برگزار می شود. تاندرکت، ریشه ها، مارینا هرلوپ، نیروستا استیل، اندی استات، چهارشنبه، @، آنا روکسان، آوی تار، جف پارکر، ماویس استیپلز، کورتنی بارنت، سیلوان اسو، جیم جیمز و کوین موربی در فهرست اولین بازیگران قرار گرفتند. Shabaka و Rosali نیز در میان جدیدترین اضافه‌شده‌ها هستند، اولی در چندین گروه بازی می‌کند، در حالی که Peter Stampfel از Holy Modal Rounders پروژه جدیدی به نام Atomic Meta-Pagans را معرفی خواهد کرد. در مجموع، جشنواره بیش از 250 اجرا را در 22 سالن اجرا می کند. پوستر به روز شده ترکیب را در زیر مشاهده کنید. Big Ears 2027 از 1 تا 4 آوریل برگزار می شود. اکنون در چهاردهمین سال خود، Big Ears از لحاظ تاریخی بر «گوش دادن عمیق» تأکید کرده است، اصطلاحی که توسط آهنگساز پیشگام الکترونیک قرن بیستم، پائولین اولیوروس ابداع شد. در ستونی در سال 2019 برای Pitchfork، اندرو فریسیکانو خاطرنشان کرد که رویداد ناکسویل نقش مهمی در پیشروی یک تغییر دریایی گسترده‌تر به سمت ترکیب‌بندی‌های بسیار دقیق - البته نه لزوماً مختصر - و \"تمرکز بر تجربیات مراقبه\" ایفا کرده است."}, {"source": "Pitchfork", "title": "Slayyyter Announces Wor$t Man in America", "link": "https://pitchfork.com/story/slayyyter-reveals-worst-man-in-america-album/", "summary": "The companion to her 2026 standout Wor$t Girl in America", "date_str": "2026-10-05T18:38:32+00:00", "hash": "df216c816c8d2e96", "title_fa": "Slayyyter م ردم! بیایید دیوانه شویم.\" روز و شب هشتمین آلبوم جپسن بود که پس از LP او در سال 2023، The Loveliest Time، آخرین انتشار B-side او بود. در سال 2027، او یک تور در آمریکای شمالی را آغاز خواهد کرد. سمت A (روز) 01 رسیدن به یک ستاره 02 شانزدهم و طلوع 03 فصل عروسی 04 لالایی سمت B (شب) 01 بله 02 بازیابی عضلانی 03 عشق افسرده 04 در ایمان خالص"}, {"source": "Pitchfork", "title": "L7 Reunite With Former Bassist on New Song “Loma Linda”", "link": "https://pitchfork.com/story/l7-reunite-with-former-bassist-on-new-song-loma-linda/", "summary": "Janis Tanaka will replace the late Jennifer Finch on the feminist grunge icons’ imminent Last Hurrah Tour", "date_str": "2026-10-05T17:44:45+00:00", "hash": "720eeb40bb98e3a3", "title_fa": "L7 دوباره با بیسیست سابق آهنگ جدید \"لوما لیندا\" متحد شد", "summary_fa": "جانیس تاناکا جایگزین جنیفر فینچ فقید خواهد شد. آیکون‌های فمینیستی گرانج L7 اولین آهنگ جدید خود را در سه سال اخیر به اشتراک گذاشته‌اند. \"لوما لیندا\" به سال 2003 باز می گردد، زمانی که گروه دمو اصلی را در کنار جنیس تاناکا، نوازنده باس ضبط کرد. برای هفته آینده به صورت دانلود رایگان در وب سایت آنها و برای پخش در YouTube در زیر در دسترس است. دونیتا اسپارکس در مطالب مطبوعاتی گفت: \"من در حال جستجو در آرشیو گروه بودم و با این آهنگ ناتمام از زمانی که جنیس در گروه بود، برخورد کردم.\" \"هنوز به نظر تازه و بسیار L7 بود، بنابراین ما آوازهای جدید را با اشعار جدید و چند آهنگ اضافی دیگر ضبط کردیم و آن را در چند روز قبل از این تور آینده منتشر کردیم. باید به شما هشدار بدهم، ما آن را حفاری می کنیم و امیدواریم شما هم این کار را انجام دهید.\" جنیفر فینچ، نوازنده باسابقه L7، اوایل سال جاری پس از تشخیص نوع تهاجمی سرطان مغز درگذشت. تاناکا از آن زمان به اسپارکس، سوزی گاردنر، و دی پلاکاس قبل از مرحله آمریکای شمالی تور Last Hurray خود که فردا، 6 اکتبر، در سن دیگو راه اندازی می شود، پیوسته است. خاطرات فینچ، Shooting Up and Making Out، قرار است پس از مرگش در اوایل سال 2027 منتشر شود. درباره تک‌آهنگ L7 در سال 1992 با عنوان Pretend We're Dead در شماره شماره 1992 بخوانید. 197 در 250 بهترین آهنگ دهه 1990."}, {"s
