فاب چهارم، چوی هی رین، افسر ایمنی 35 ساله را ملاقات می کنم که پیشانی خود را با دستمال پاک می کند. در سحرگاه، او سوار یکی از اتوبوس‌های شاتل شد که کارگران را"}, {"source": "MIT Tech Review", "title": "These startups hope “blended” food will cut our appetite for red meat", "link": "https://www.technologyreview.com/2026/10/20/1145927/blended-meat-food-startups-building-bridge-to-ditch-red-meat/", "summary": "In the fall of 2025, Jeff Dodge set up a six-foot folding table in the cafeteria of Cane Bay High School in Summerville, South Carolina, to conduct a taste test. When the first rush of about 150 hungry students hit, he was waiting with slow cookers filled with steaming marinara sauce and meatballs. Kids love a taste test, but they’re also discerning, and Dodge wasn’t sure what they would make of his product, a blend featuring both meat and mushrooms. As students swarmed the table and tapped out their opinions on an iPad or scanned a QR code to use their phones, Dodge asked those who lingered to guess what kind of vegetable might have been mixed into the meat. Few of them could—the meatballs had tasted like moist, flavorful beef. The school enrolls a few thousand students, and Dodge estimates that the majority of them came by. In the end, the survey showed that 92% of those who tried the meatballs wanted them on the menu; they easily cleared the bar to be added for the 2026–2027 school year. Comments described their flavor as “bussin’.” Through his consulting company, K–12 Food Solutions, Dodge was testing a new product called 50/Cut from the company Joyn. The proprietary blend of seemingly simple ingredients—available as meatballs, burgers, and ground meat—could help solve one of the most intractable challenges of the climate crisis, at least on the individual level: getting people to eat less meat, particularly beef. Livestock production accounts for somewhere between 10% and 20% of all greenhouse-gas emissions related to human activity, and nearly two-thirds of that comes from ruminants like cows raised for meat and dairy products. Beef herds create four times the emissions of dairy herds per kilo of food produced. And for US households, food makes up as much as 30% of emissions . Unlike other polluting sectors, such as electricity and transportation, cattle farming has little potential for a big fix. Ruminants produce about 30% of the methane associated with human activity, and this gas has 28 times more global-­warming potential than carbon dioxide. What’s more, it would be virtually impossible to raise them in a perfectly climate-­neutral manner. “We don’t have a technical solution to change the stomach of a ruminant,” says Fredrik Hedenus, a professor in sustainability and systems analysis at Chalmers University of Technology in Sweden. Technologies to dampen the impact of their burps have been in the works for a while but have yet to scale. They als", "date_str": "2026-10-20T09:00:00+00:00", "hash": "209ec40a05111ae2", "title_fa": "این استارت‌آپ‌ها امیدوارند که غذای «ترکیب» اشتهای ما را برای گوشت قرمز کاهش دهد", "summary_fa": "در پاییز سال 2025، جف دوج یک میز تاشو شش فوتی را در کافه تریا دبیرستان کین بی در سامرویل، کارولینای جنوبی، برای انجام تست چشایی برپا کرد. هنگامی که اولین هجوم حدود 150 دانش آموز گرسنه برخورد کرد، او با اجاق های آرام پر از سس مارینارا بخار پز و کوفته منتظر بود. بچه‌ها تست طعم را دوست دارند، اما در عین حال دقیق هستند، و دوج مطمئن نبود که از محصولش چه می‌سازند، ترکیبی که هم گوشت و هم قارچ دارد. در حالی که دانش‌آموزان روی میز جمع می‌شدند و نظرات خود را روی آی‌پد می‌چشیدند یا برای استفاده از تلفن‌هایشان یک کد QR را اسکن می‌کردند، دوج از کسانی که معطل می‌شدند خواست حدس بزنند چه نوع سبزی ممکن است در گوشت مخلوط شده باشد. تعداد کمی از آنها می توانستند - کوفته ها طعمی شبیه گوشت گاو مرطوب و خوش طعم داشتند. این مدرسه چند هزار دانش آموز را ثبت نام می کند، و دوج تخمین می زند که اکثریت آنها از آنجا آمده اند. در پایان، نظرسنجی نشان داد که 92 درصد از کسانی که کوفته‌ها را امتحان کردند، آن‌ها را در منو می‌خواستند. آنها به راحتی نوار اضافه شده برای سال تحصیلی 2026-2027 را پاک کردند. نظرات طعم آنها را به عنوان \"bussin\" توصیف کردند. دوج از طریق شرکت مشاوره خود، K-12 Food Solutions، محصول جدیدی به نام 50/Cut از شرکت Joyn را آزمایش کرد. ترکیب اختصاصی مواد به ظاهر ساده - موجود به عنوان کوفته، همبرگر و گوشت چرخ کرده - می تواند به حل یکی از دشوارترین چالش های بحران آب و هوا، حداقل در سطح فردی کمک کند: وادار کردن مردم به خوردن گوشت کمتر، به ویژه گوشت گاو. تولید دام بین 10 تا 20 درصد از انتشار گازهای گلخانه ای مربوط به فعالیت های انسانی را تشکیل می دهد و"}, {"source": "MIT Tech Review", "title": "Making the internet better for AI agents might make it worse for everyone else", "link": "https://www.technologyreview.com/2026/10/19/1147186/making-the-internet-better-for-ai-agents-might-make-it-worse-for-everyone-else/", "summary": "This story originally appeared in The Algorithm, our weekly newsletter on AI. To get stories like this in your inbox first, sign up here . Until recently, you could divide internet users into just two categories: bots and people. Websites have long allowed bots to perform automated tasks, like capturing the content of web pages, but rules govern what they can access and how they behave. The web, after all, is designed primarily for people, even if we occasionally have to solve puzzles and captchas to prove we are not bots. But this is being entirely upended by the release of personal AI agents, which can do things for you online, like booking flights or hotel rooms. They have recently been unleashed at scale by the launch of apps like OpenAI’s Dots and Meta’s Muse. Muse was downloaded 5 million times in its first month, and agentic web traffic tripled from August to September. The mingling of these agents with human visitors—on an internet designed largely to prioritize people—has gone poorly, with many websites blocking AI agents that consumers have sent to negotiate prices or plan vacations. Still, if the demand for agents keeps going up, the internet will be increasingly redesigned for them instead of us. Such changes are coming because agents really do mark a third category of web visitor. They’re not humans, of course, and they use the internet at machine speed. But they’re not quite bots, either, because they’re acting on behalf of individual people to do tasks that can be perfectly legitimate and useful. They just work faster than a person would. Since agents don’t fit into the systems we have for differentiating bots from people, some platforms (especially the more security-conscious ones) have opted to just ban them entirely. TechCrunch recently reported people having trouble deploying their agents to websites ranging from Pizza Hut to Yelp, which doesn’t allow AI to book restaurant reservations. Amazon has blocked Muse’s agents and is waging a court battle against the AI startup Perplexity to block its agents too. Though a judge recently ruled in favor of Perplexity, Amazon has filed an appeal in which it argues that AI agents threaten its advertising business by making it harder to distinguish between ads seen by humans and those served to bots. These blocks are annoying for early adopters, but Ethan Mollick, an associate professor at the Wharton School of the University of Pennsylvania, predicts it will soon affect the whole web. Once it become", "date_str": "2026-10-19T18:22:47+00:00", "hash": "1d94faf9d0cf3921", "title_fa": "بهتر کردن اینترنت برای عوامل هوش مصنوعی ممکن است اوضاع را برای دیگران بدتر کند", "summary_fa": "تا همین اواخر، کاربران اینترنت را فقط به دو دسته تقسیم می‌کردید: ربات‌ها و افراد. وب‌سایت‌ها مدت‌هاست که به ربات‌ها اجازه می‌دادند کارهای خودکاری مانند ضبط محتوای صفحات وب را انجام دهند، اما قوانینی که می‌توانند به آن‌ها دسترسی داشته باشند و نحوه رفتارشان را کنترل می‌کنند. به هر حال، وب اساساً برای مردم طراحی شده است، حتی اگر گاهی مجبور شویم پازل ها و کپچاها را حل کنیم تا ثابت کنیم ربات نیستیم. اما این به طور کامل با انتشار عوامل هوش مصنوعی شخصی که می توانند کارهایی را به صورت آنلاین برای شما انجام دهند، مانند رزرو پرواز یا اتاق هتل، کاملاً تغییر می کند. آنها اخیراً با راه‌اندازی برنامه‌هایی مانند OpenAI's Dots و Meta's Muse در مقیاس وسیع منتشر شده‌اند. Muse در ماه اول 5 میلیون بار دانلود شد و ترافیک وب عاملی از آگوست تا سپتامبر سه برابر شد. اختلاط این عوامل با بازدیدکنندگان انسانی - در اینترنت که عمدتاً برای اولویت‌بندی افراد طراحی شده است - ضعیف بوده است، به طوری که بسیاری از وب‌سایت‌ها عوامل هوش مصنوعی را که مصرف‌کنندگان برای مذاکره در مورد قیمت‌ها یا برنامه‌ریزی تعطیلات فرستاده‌اند مسدود کرده‌اند. با این حال، اگر تقاضا برای نمایندگان همچنان افزایش یابد، اینترنت به‌طور فزاینده‌ای برای آنها به جای ما طراحی می‌شود. چنین تغییراتی به این دلیل است که نمایندگان واقعاً دسته سوم بازدیدکنندگان وب را مشخص می کنند. البته آنها انسان نیستند و با سرعت ماشین از اینترنت استفاده می کنند. اما آنها کاملاً ربات نیستند، زیرا آنها از طرف افراد خاص برای انجام وظایفی که می توانند کاملاً مشروع و مفید باشند عمل می کنند. آنها فقط سریعتر از یک شخص کار می کنند. از آنجایی که عامل‌ها در سیستم‌هایی که ما برای متمایز کردن ربات‌ها از افراد داریم، جا نمی‌شوند، برخی از پلت‌فرم‌ها (به‌ویژه پلتفرم‌هایی که از امنیت بیشتری برخوردار هستند) تصمیم"}, {"source": "MIT Tech Review", "title": "“We were looking at it wrong”: The explosive claim that’s upended the AI world", "link": "https://www.technologyreview.com/2026/10/19/1147149/we-were-looking-at-it-wrong-the-explosive-claim-thats-upended-the-ai-world/", "summary": "“I think I have good news about the nature of neural networks.” With those simple words of optimism, Nick Cammarata, a researcher at the AI startup Goodfire, kicked off a 26,000-word blog post that has knocked the AI world on its head, sparking wild speculation as well as cautious (and not-so-cautious) celebration. Cammarata’s claim is that LLMs might in fact be far easier to understand—and thus to monitor and control—than people previously thought. If true (and we’ll come back to that), it’s a huge deal. After a summer filled with revelations that swarms of agents built by top firms like OpenAI and Anthropic have been breaking their containment and causing havoc on the public internet—often while those companies weren’t aware of what their agents were up to—the AI industry is desperate to get a better handle on the technology it has built. That’s one reason the blog post landed with such force. “I think this may be remembered as a major moment in scientific history,” one AI researcher posted on X : “I feel like my understanding of what a neural net is has been catapulted into the future by five years or something.” Another called it “the most important AI paper of the year.” Not everyone is convinced, however. What Cammarata has shared is little more than a hunch, says Chris Potts at Stanford University, who leads a team that is trying to understand how LLMs work. “As far as I can tell, nothing about this blog post makes the problems any easier,” he says. “It would not have occurred to me to say this at all, but very prominent people on social media seem to believe that it is an all-encompassing breakthrough.” I talked to Cammarata the day after his post blew up. He says he was surprised by the response: “I didn’t expect people to update [their beliefs about AI] quite as much as they did.” “I just really enjoy looking at neural networks,” he says. “Honestly, I really like doing this stuff. And after looking a lot, I have a hopeful story.” Knotted networks It has long been accepted that the mechanisms inside neural networks, the software that underpins most AI models, are very hard—perhaps impossible—to unpick fully. That’s because when the networks are trained, they appear to take on weird, tangled structures that make no sense to a human. Researchers like to say today’s AI is grown like a garden, not built like a bridge. Cammarata has done more than most to establish that view. He previously worked at OpenAI, where he helped pioneer techniques that allow", "date_str": "2026-10-19T17:45:55+00:00", "hash": "4a21d4d996fe64c3", "title_fa": "\"ما اشتباه به آن نگاه می کردیم\": ادعای انفجاری که دنیای هوش مصنوعی را متحول کرد", "summary_fa": "فکر می‌کنم خبرهای خوبی در مورد ماهیت شبکه‌های عصبی دارم.» نیک کامماراتا، محقق در استارت‌آپ گودفایر هوش مصنوعی، با همین کلمات ساده خوش‌بینانه، یک پست وبلاگی 26000 کلمه‌ای را آغاز کرد که دنیای هوش مصنوعی را به هم ریخته و باعث گمانه‌زنی‌های وحشیانه و همچنین جشنی محتاطانه (و نه چندان محتاطانه) شد. ادعای Cammarata این است که درک LLMها در واقع بسیار ساده تر از آنچه مردم قبلاً فکر می کردند - و بنابراین نظارت و کنترل هستند. اگر درست باشد (و ما به آن باز خواهیم گشت)، یک معامله بزرگ است. پس از یک تابستان مملو از افشاگری ها مبنی بر اینکه انبوهی از عوامل ساخته شده توسط شرکت های برتر مانند OpenAI و Anthropic کنترل خود را شکسته و اینترنت عمومی را خراب کرده اند - اغلب در حالی که آن شرکت ها از آنچه نمایندگان آنها در حال انجام هستند آگاه نبودند - صنعت هوش مصنوعی به دنبال دستیابی بهتر به فناوری ساخته شده است. این یکی از دلایلی است که پست وبلاگ با چنین قدرتی فرود آمد. یکی از محققین هوش مصنوعی در X نوشته است: «فکر می‌کنم ممکن است این لحظه به‌عنوان یک لحظه مهم در تاریخ علمی به یاد بیاوریم.» «احساس می‌کنم درک من از چیستی شبکه عصبی تا پنج سال یا چیزی بیشتر به آینده منجنیق شده است.» دیگری آن را \"مهم ترین مقاله هوش مصنوعی سال\" نامید. با این حال همه متقاعد نشده اند. کریس پاتس از دانشگاه استنفورد که تیمی را رهبری می‌کند که در تلاش برای درک نحوه عملکرد LLM است، می‌گوید آنچه کامماراتا به اشتراک گذاشته است، کمی بیش از حدس و گمان است. او می‌گوید: «تا آنجا که من می‌توانم بگویم، هیچ چیز در مورد این پست وبلاگ مشکلات را آسان‌تر نمی‌کند. اصلاً به ذهنم خطور نمی کرد که این را بگویم، اما به نظر می رسد افراد"}, {"source": "Business Insider", "title": "The 10 safest cities in the US — and the 10 least safe", "link": "https://www.businessinsider.com/safest-cities-us-least-safe-wallethub-ranking-2026-10", "summary": "Juneau, Alaska, was named the safest city in the US by WalletHub. chaolik/Getty Images/iStockphoto WalletHub released a report ranking the safest cities in the US. The ranking analyzed 182 US cities based on 41 safety indicators across three categories. Juneau, Alaska, was ranked the safest city in the US, while New Orleans was ranked the least safe. American cities face a range of safety concerns, and the risks can vary significantly depending on location. In some cities, natural disasters such as hurricanes, tornadoes, and floods pose the greatest threats to locals. In others, safety concerns may instead center on financial security or the overall safety of homes and communities. WalletHub compared a total of 182 cities — the 150 largest cities in the US, plus at least two of the most populous cities in every state — to determine the safest and least-safe cities in the US. WalletHub examined 41 safety indicators across three categories: home and community safety, natural-disaster risk, and financial safety. To evaluate home and community safety, WalletHub looked at factors including crime rates, traffic and pedestrian fatalities, and the number of emergency responders per capita. The natural-disaster risk ranking was determined by cities' risk-index scores for natural disasters such as earthquakes, tornadoes, and wildfires. The financial safety ranking considered factors such as poverty and unemployment rates, as well as identity theft complaints per capita. To conduct its analysis, WalletHub looked at data from sources including the US Census Bureau, the Bureau of Labor Statistics, the Federal Emergency Management Agency, and the Federal Bureau of Investigation. Here are the top 10 safest and least-safe cities in the US. 1. Juneau, Alaska Juneau, Alaska. Lana2011/Getty Images Out of the 182 cities WalletHub examined, Juneau was ranked the safest city in the US. It ranked 46th in home and community safety, fourth in financial safety, and first in natural-disaster risk. Juneau featured the lowest murder rate and lowest pedestrian fatality rate, and there have been no recorded terrorist attacks or terrorist-related incidents in the past decade. The risk of natural disasters in Juneau is particularly low, with the second-lowest risk of flooding and tornadoes. Financially, Juneau has the 21st-lowest percentage of residents below the poverty line. 2. Warwick, Rhode Island Warwick, Rhode Island. DenisTangneyJr/Getty Images As the second-safest city in the US, ", "date_str": "2026-10-20T12:54:28+00:00", "hash": "a9bac77fe7dc21d7", "title_fa": "10 شهر امن در ایالات متحده - و 10 شهر کمتر امن", "summary_fa": "جونو، آلاسکا، توسط WalletHub به عنوان امن ترین شهر ایالات متحده انتخاب شد. chaolik/Getty Images/iStockphoto WalletHub گزارشی در رتبه بندی امن ترین شهرهای ایالات متحده منتشر کرد. این رتبه بندی 182 شهر ایالات متحده را بر اساس 41 شاخص ایمنی در سه دسته تجزیه و تحلیل کرد. جونو، آلاسکا، امن ترین شهر ایالات متحده و نیواورلئان در رتبه بندی کم امن ترین شهر قرار گرفتند. شهرهای آمریکا با طیف وسیعی از نگرانی های ایمنی روبرو هستند و خطرات آن بسته به موقعیت مکانی می تواند به طور قابل توجهی متفاوت باشد. در برخی از شهرها، بلایای طبیعی مانند طوفان، گردباد و سیل بزرگترین تهدید را برای مردم محلی ایجاد می کند. در برخی دیگر، نگرانی های ایمنی ممکن است به جای آن بر امنیت مالی یا ایمنی کلی خانه ها و جوامع متمرکز شود. WalletHub در مجموع 182 شهر - 150 شهر بزرگ ایالات متحده، به علاوه حداقل دو شهر از پرجمعیت ترین شهرها در هر ایالت - را برای تعیین امن ترین و کم امن ترین شهرهای ایالات متحده مقایسه کرد. WalletHub 41 شاخص ایمنی را در سه دسته بررسی کرد: ایمنی خانه و جامعه، خطر بلایای طبیعی و ایمنی مالی. برای ارزیابی ایمنی خانه و جامعه، WalletHub به عواملی از جمله میزان جرم و جنایت، تلفات ترافیکی و عابران پیاده، و تعداد سرانه پاسخ دهندگان اضطراری توجه کرد. رتبه بندی خطر بلایای طبیعی با امتیازهای شاخص خطر شهرها برای بلایای طبیعی مانند زلزله، گردباد و آتش سوزی تعیین شد. رتبه بندی ایمنی مالی عواملی مانند نرخ فقر و بیکاری و همچنین شکایات مربوط به سرقت هویت سرانه را در نظر گرفته است. WalletHub برای انجام تجزیه و تحلیل خود به داده های منابعی از جمله اداره سرشماری ایالات متحده، اداره آمار کار، آژانس مدیریت اضطراری فدرال و اداره تحقیقات فدرال نگاه کرد. در اینجا 10 شهر برتر در"}, {"source": "Business Insider", "title": "I'm Gen Z and thought retirement was the goal. My 86-year-old grandfather changed my mind.", "link": "https://www.businessinsider.com/gen-z-grandfather-work-ethic-refuses-retirement-2026-10", "summary": "The author s grandfather doesn t want to retire. Courtesy of the author I'm Gen Z and have always valued rest, leisure, and finding balance in my life. My 86-year-old grandfather has worked as a doctor for 60 years and refuses to retire. His dedication has changed how I think about ambition, purpose, and growing older. As a Gen Z, I have struggled with my work ethic . I have learned to optimize leisure, travel, and rest, and to get into a flow state. However, my grandfather's work ethic has made me rethink my approach. At 86, my grandfather refuses to retire . For the past 60 years, he has woken up at the same time every morning, showered, dressed immaculately, had breakfast, and left for his work as a general physician in his private clinic. Barring sickness and rare travel, he has never taken a day off , never deviated from schedule, and has an enviable work ethic that I have not seen in anyone. My grandmother, who was 70, died last year, and he was back to work in a week. He is the eldest son Born in 1940 in the small town of Gonda in North India , he was the eldest of six younger siblings. In 1966, at the age of 26, he began his medical practice after completing his MBBS. From the beginning, he has been focused on his career and his responsibilities as the eldest son of a South Asian family. He worked in big hospitals, then opened a private practice a few years later, and he also established a Rotary Club Chapter in his city, leading it many times in the decades that followed. The author s grandparents in the 80s. Courtesy of the author There has always been a deep sense of empathy in him, which has made him a very considerate doctor for those who are economically marginalized. Because he charged less, took his time to understand each patient's issue, and prescribed medicines with great care, he gained popularity in his city very soon. After six decades, the patients who were once young men and women bring their grandchildren from different cities to be treated by him. Only two years ago, he scaled back his work, working only till lunch. So now many patients come home in an emergency. \"I don't like turning them away. Helping them makes me feel elated,\" he told me in one of our weekly phone calls. He doesn't want to retire From his work, he built a home for his parents and siblings, and another for his wife and children. He paid for the education of most of his siblings and put down a significant sum when it was time for them to get married. In short, h", "date_str": "2026-10-20T12:15:01+00:00", "hash": "8ff426bbe3d5d858", "title_fa": "من ژنرال Z هستم و فکر می کردم بازنشستگی هدف است. پدربزرگ 86 ساله ام نظرم را عوض کرد.", "summary_fa": "پدربزرگ نویسنده نمی خواهد بازنشسته شود. با حسن نیت از نویسنده من ژنرال Z هستم و همیشه برای استراحت، اوقات فراغت و یافتن تعادل در زندگی ام ارزش قائل بوده ام. پدربزرگ 86 ساله من 60 سال است که به عنوان پزشک کار می کند و حاضر به بازنشستگی نیست. فداکاری او طرز فکر من را در مورد جاه طلبی، هدف و افزایش سن تغییر داده است. به عنوان یک ژنرال Z، من با اخلاق کاری خود مبارزه کرده ام. من یاد گرفته ام که اوقات فراغت، مسافرت و استراحت را بهینه کنم و وارد حالت جریان شوم. با این حال، اخلاق کاری پدربزرگم مرا وادار کرد در رویکردم تجدید نظر کنم. در 86 سالگی، پدربزرگم از بازنشستگی امتناع می کند. در 60 سال گذشته، او هر روز صبح در یک ساعت از خواب بیدار شده، دوش گرفته، لباس های بی عیب و نقص می پوشد، صبحانه می خورد و به عنوان پزشک عمومی در کلینیک خصوصی خود راهی محل کارش شده است. به جز بیماری و سفرهای نادر، او هرگز یک روز مرخصی نگرفته، هرگز از برنامه منحرف نشده است، و اخلاق کاری غبطه‌انگیزی دارد که من در هیچ‌کس ندیده‌ام. مادربزرگم که 70 ساله بود پارسال فوت کرد و یک هفته دیگر سر کار برگشت. او بزرگترین پسر است که در سال 1940 در شهر کوچک گوندا در شمال هند به دنیا آمد، او بزرگترین پسر از شش خواهر و برادر کوچکتر بود. در سال 1966، در سن 26 سالگی، پس از تکمیل MBBS، طبابت خود را آغاز کرد. او از ابتدا بر روی حرفه و مسئولیت های خود به عنوان پسر ارشد یک خانواده جنوب آسیا متمرکز بوده است. او در بیمارستان‌های بزرگ کار کرد، سپس چند سال بعد یک مطب خصوصی افتتاح کرد، و همچنین یک شعبه باشگاه روتاری را در شهر خود تأسیس کرد که در"}, {"source": "Business Insider", "title": "Revolut and other banking apps go down as Google Cloud suffers UK outage", "link": "https://www.businessinsider.com/google-cloud-outage-revolut-halifax-emma-uk-london-2026-10", "summary": "Google s cloud division competes with Amazon and Microsoft for enterprise customers. Bloomberg/Getty Images Multiple banking apps in the UK, including Revolut, faced disruptions on Tuesday morning. Google Cloud is also experiencing issues with its London-based cloud region. Revolut said in a statement that customers' money is safe while it investigates the disruption. Google Cloud is experiencing outages in London that appear to have knocked out a number of banking services. An update on Google Cloud's status dashboard states that it's seeing service issues at its europe-west2 region, which is based in London. A handful of banking apps and services, including Halifax and Revolut, reported issues on Tuesday that coincided with Google Cloud's disruptions. Some companies said that the Google Cloud outage was the cause, while others attributed it to an unnamed third-party provider. Users of some affected banking apps have said in social media posts that they can't make card payments, log in to the app, or transfer money. \"We can confirm that all our customers' money and data are safe. We've been working to fix the issue since it was identified this morning and apologize to anyone affected and for any inconvenience caused,\" Revolut said in a statement. The outage is due to Google Cloud, a person familiar with the matter said. \"We're aware some customers are having issues with our app and online. We're sorry about this and are working hard to fix it,\" Halifax posted on X. Emma, a popular UK budgeting app, also reported outages on Tuesday. \"Emma is currently down due to a Google Cloud outage affecting services in London since 7 a.m. This is a technical outage, not a security issue,\" the company said on X . A Google spokesperson said the company was investigating the issue and referred Business Insider to the status dashboard, which said a \"power event\" caused the issue but has since been \"mitigated.\" Google was seeing some \"recovery of services\" by around 8 a.m. ET, and \"tentatively\" expected a full recovery by 9 a.m. ET, according to the dashboard. Emma is currently down due to a Google Cloud outage affecting services in London since 7am. This is a technical outage, not a security issue. We're monitoring closely and will update here as soon as the app is back. Sorry for the disruption 🙏 — Emma (@emma_finance) October 20, 2026 Some have taken to X to share how the outage was disrupting their lives. One person said they've had to cancel their beauty appointments i", "date_str": "2026-10-20T11:53:39+00:00", "hash": "a1ff18026a9d7621", "title_fa": "Revolut و سایر برنامه‌های بانکی با آسیب Google Cloud در بریتانیا از کار می‌افتند", "summary_fa": "بخش ابری گوگل برای مشتریان سازمانی با آمازون و مایکروسافت رقابت می کند. بلومبرگ/گتی ایماژ چندین اپلیکیشن بانکی در بریتانیا، از جمله Revolut، صبح روز سه شنبه با اختلال مواجه شدند. Google Cloud همچنین با منطقه ابری مستقر در لندن خود با مشکلاتی مواجه است. Revolut در بیانیه ای اعلام کرد که پول مشتریان در حالی که اختلال را بررسی می کند امن است. Google Cloud در لندن با قطعی هایی مواجه است که به نظر می رسد تعدادی از خدمات بانکی را از بین برده است. یک به‌روزرسانی در داشبورد وضعیت Google Cloud بیان می‌کند که در منطقه اروپا-west2 خود، که در لندن مستقر است، مشکلات خدماتی را مشاهده می‌کند. تعداد معدودی از اپلیکیشن‌ها و سرویس‌های بانکی، از جمله Halifax و Revolut، مشکلاتی را در روز سه‌شنبه گزارش کردند که همزمان با اختلالات Google Cloud بود. برخی از شرکت ها می گویند که قطع شدن Google Cloud علت آن بوده است، در حالی که برخی دیگر آن را به یک ارائه دهنده شخص ثالث ناشناس نسبت می دهند. کاربران برخی از برنامه‌های بانکی آسیب‌دیده در پست‌های رسانه‌های اجتماعی گفته‌اند که نمی‌توانند پرداخت‌های کارتی، ورود به برنامه یا انتقال پول را انجام دهند. Revolut در بیانیه ای گفت: \"ما می توانیم تأیید کنیم که همه پول و داده های مشتریان ما ایمن است. از زمانی که امروز صبح شناسایی شد برای رفع این مشکل تلاش کرده ایم و از هر کسی که آسیب دیده و برای هر گونه ناراحتی ایجاد شده عذرخواهی می کنیم.\" یکی از افراد آشنا به این موضوع گفت که این قطع به دلیل Google Cloud است. Halifax در X. Emma، یک برنامه بودجه بندی محبوب در بریتانیا، در روز سه شنبه گزارش داد: \"ما می دانیم که برخی از مشتریان با برنامه و آنلاین ما مشکل دارند. از این بابت متأسفیم و سخت برای رفع آن"}, {"source": "Business Insider", "title": "The US Army is learning hard lessons from Ukraine and the Middle East on how to prepare and protect air defenders", "link": "https://www.businessinsider.com/us-army-learning-air-defense-lessons-from-ukraine-middle-east-2026-10", "summary": "Recent and ongoing conflicts have tested air defense systems and crews. US Army photo by Sgt. David Rincon The US Army is applying lessons from Ukraine and Iran to better prepare its air defenders. Forward-deployed air defense units are bringing back lessons from combat. Combat simulations are evolving to reflect new battlefield threats and tactics. Intense missile and drone attacks in global conflicts are showing the US Army how it needs to train its air defenders, as well as how to protect them from threats, Army officials said. Lessons on protecting MIM-104 Patriot surface-to-air missile systems and crews are coming in, and Army leaders say those observations are being quickly incorporated into training to help troops keep pace with evolving threats and tactics. In their war against Ukraine, Russian forces have hunted Patriot batteries and other air-defense systems while also trying to overwhelm them with complex barrages of one-way attack drones alongside ballistic and cruise missiles, providing lessons in mobility, concealment, deception, and dispersal. The war with Iran, meanwhile, has exposed American and allied air defenders to the challenge of defending against large-scale drone and missile bombardments while managing interceptor stocks. The Army is learning those lessons, officials say. Lt. Gen. John Rafferty, the head of Army Space and Missile Defense Command , told reporters at the Association of the United States Army conference last week that air defenders have been \"probably the most aggressive community in the Army for learning lessons from Ukraine,\" with an emphasis on survivability and the protection of critical assets. \"How have we embraced those observations from Ukraine and then put them into action?\" Rafferty said this was one of the first questions he asked when he took command earlier this year. He said that he has seen how command teams have \"put those lessons in place and how they are taking steps to protect their soldiers, to protect the critical systems of Patriots and sensors, protection, camouflage, deception, all of that.\" Officials with the 32nd Army Air and Missile Defense Command told Business Insider that observations and lessons from Ukraine are shared with its headquarters at Fort Bliss, Texas, where training materials for air defense soldiers are updated. The information is also shared with the larger Army and industry partners. The 32nd Army Air and Missile Defense Command recently transferred to Army Space and Missil", "date_str": "2026-10-20T11:21:01+00:00", "hash": "6ee8f9d91e35f742", "title_fa": "ارتش ایالات متحده در حال آموختن درس های سخت از اوکراین و خاورمیانه در مورد چگونگی آماده سازی و محافظت از مدافعان هوایی است", "summary_fa": "درگیری های اخیر و جاری سیستم ها و خدمه دفاع هوایی را آزمایش کرده اند. عکس ارتش ایالات متحده توسط گروهبان. دیوید رینکن ارتش ایالات متحده در حال استفاده از درس های اوکراین و ایران برای آماده سازی بهتر مدافعان هوایی خود است. یگان‌های پدافند هوایی مستقر در جلو درس‌هایی را از نبرد به ارمغان می‌آورند. شبیه‌سازی‌های رزمی در حال تکامل هستند تا تهدیدها و تاکتیک‌های جدید میدان نبرد را منعکس کنند. مقامات ارتش گفتند که حملات موشکی و پهپادی شدید در درگیری های جهانی به ارتش ایالات متحده نشان می دهد که چگونه باید مدافعان هوایی خود را آموزش دهد و همچنین چگونه از آنها در برابر تهدیدات محافظت کند. درس‌هایی درباره حفاظت از سامانه‌های موشکی زمین به هوای MIM-104 پاتریوت و خدمه‌ها در حال ارائه است و رهبران ارتش می‌گویند که این مشاهدات به سرعت در آموزش گنجانده می‌شوند تا به سربازان کمک کنند تا با تهدیدها و تاکتیک‌های در حال تحول همگام شوند. نیروهای روسی در جنگ خود علیه اوکراین، باتری‌های پاتریوت و سایر سامانه‌های دفاع هوایی را شکار کرده‌اند و در عین حال تلاش می‌کنند آنها را با رگبارهای پیچیده پهپادهای تهاجمی یک طرفه در کنار موشک‌های بالستیک و کروز تحت کنترل خود درآورند و درس‌هایی در زمینه تحرک، پنهان‌سازی، فریب و پراکندگی ارائه می‌دهند. در همین حال، جنگ با ایران، مدافعان هوایی آمریکا و متحدانش را در معرض چالش دفاع در برابر بمباران‌های موشکی و پهپادی بزرگ در حین مدیریت انبارهای رهگیر قرار داده است. مقامات می گویند که ارتش این درس ها را می آموزد. سپهبد جان رافرتی، رئیس فرماندهی فضایی و دفاع موشکی ارتش، هفته گذشته در کنفرانس انجمن ارتش ایالات متحده به خبرنگاران گفت که مدافعان هوایی \"احتمالاً تهاجمی ترین جامعه ارتش برای درس گرفتن از اوکراین\" بوده اند، با تاکید بر بقا و حفاظت از دارایی های حیاتی. ما چگونه آن"}, {"source": "Business Insider", "title": "We got my older son a phone at 12, and I regretted it. We still got my younger son a phone at the same age.", "link": "https://www.businessinsider.com/worried-about-getting-kid-phone-no-regrets-2026-10", "summary": "The author got her son a phone at 12, the same age his brother got one. Jordan Lye/Getty Images My older son got a phone when he turned 12. I ended up regretting it and wishing we'd waited another year. Still, our younger son got a phone at the same age, and I was glad we got it for him. When our older son was 12, getting a phone seemed to be the trend. Many of his friends had phones before 6 th grade, but those who didn't received one at the start of middle school, so we purchased one too. Looking back, I regretted our decision, and wished we'd waited another year. He didn't truly need one until school sports began in 7 th grade, when he was staying after school for practice and traveling around our county for track meets. Without a true need, a phone simply felt like another connection to the dangers of the internet ; protecting him felt impossible. Our younger son started middle school in September, and ever since his brother got his phone three years ago, he's expected to receive one at the same age. I didn't want to give in \"He doesn't need it,\" I told my husband in August. \"We know that now,\" I reminded him. He takes the bus to and from school, and I can track his morning and afternoon bus routes with the Here Comes the Bus app. School sports don't begin until next year, so we are responsible for transporting him to rec soccer practice and games ourselves; we don't yet need to communicate about exact locations or pickup times. But like with our older son, his friends either had phones or were getting one, and he felt left out. I've found that much of parenting today involves striking a balance between what I feel is safe for my children and giving them the freedom to feel they belong. I was concerned about him having consistent access to the internet and worried he wasn't responsible enough to keep track of a phone. Remembering the time he'd left his backpack on the bus, I pleaded with my husband, \"He might misplace it — and then what?\" But that was two years ago, and I wanted to believe that he was maturing. For his mental health, I also didn't want him to feel left out. My son convinced his dad, who then convinced me Convincingly, my son argued that it wasn't fair that his brother got a phone at 12, but he would have to wait. \"I want to be able to text you if soccer is ending early and let you know when I'm on the bus in the afternoon,\" he reasoned. I thought these were simply persuasive tactics. I didn't believe he'd follow through, but he did. Ul", "date_str": "2026-10-20T11:03:01+00:00", "hash": "1351edf38490f49c", "title_fa": "ما برای پسر بزرگترم در 12 سالگی تلفن گرفتیم و من پشیمان شدم. ما هنوز در همان سن و سال برای پسر کوچکترم یک تلفن گرفتیم.", "summary_fa": "نویسنده در 12 سالگی برای پسرش گوشی گرفت، در همان سنی که برادرش یک تلفن گرفت. Jordan Lye/Getty Images پسر بزرگتر من وقتی 12 ساله شد یک تلفن دریافت کرد. در نهایت پشیمان شدم و آرزو کردم یک سال دیگر منتظر بمانیم. با این حال، پسر کوچکتر ما در همان سن یک تلفن دریافت کرد و من خوشحالم که آن را برای او گرفتیم. وقتی پسر بزرگتر ما 12 ساله بود، به نظر می رسید که خرید یک تلفن یک روند معمول باشد. بسیاری از دوستان او قبل از کلاس ششم تلفن داشتند، اما آنهایی که در ابتدای راهنمایی دریافت نکردند، بنابراین ما هم یکی خریدیم. با نگاهی به گذشته، از تصمیم خود پشیمان شدم و آرزو کردم که ای کاش یک سال دیگر صبر می کردیم. او واقعاً به یکی نیاز نداشت تا اینکه ورزش های مدرسه در کلاس هفتم شروع شد، زمانی که او بعد از مدرسه برای تمرین می ماند و برای دیدارهای پیست در سراسر شهرستان ما سفر می کرد. بدون نیاز واقعی، یک تلفن به سادگی مانند یک اتصال دیگر به خطرات اینترنت احساس می شود. محافظت از او غیرممکن به نظر می رسید. پسر کوچکتر ما در ماه سپتامبر مدرسه راهنمایی را شروع کرد و از زمانی که برادرش سه سال پیش تلفنش را دریافت کرد، انتظار می‌رود که در همان سن و سال گوشی خود را دریافت کند. من نمی خواستم تسلیم شوم \"او به آن نیاز ندارد\" به شوهرم در ماه اوت گفتم. به او یادآوری کردم: «ما الان این را می دانیم. او با اتوبوس به مدرسه می رود و برمی گردد، و من می توانم مسیرهای اتوبوس صبح و بعدازظهر او را با برنامه Here Comes the Bus دنبال کنم. ورزش های مدرسه تا سال آینده شروع نمی شود، بنابراین ما خودمان مسئول انتقال او به تمرینات و بازی های"}, {"source": "Business Insider", "title": "Trump praises Elon Musk's 'incredible generosity' over $10 billion SpaceX stock pledge for kids", "link": "https://www.businessinsider.com/trump-praises-elon-musk-10-billion-spacex-stock-pledge-kids-2026-10", "summary": "President Donald Trump praised Elon Musk s pledge to give SpaceX shares to children through Trump Accounts. Kent NISHIMURA / AFP via Getty Images Trump praised Elon Musk's plan to give one SpaceX share to every child in America next year. The pledge could be worth about $10.6 billion at SpaceX's current price. Musk and Trump have a rocky relationship, but appear to be back on the same page in recent months. Elon Musk’s pledge to give every child in America a share in SpaceX has already paid one dividend: effusive praise from President Donald Trump. \"A BIG THANK YOU to our legendary friend, Elon Musk,\" Trump wrote Monday, calling the proposed gift an act of \"incredible generosity.\" He said the shares would go to children through Trump Accounts, the investment accounts created under his administration. A BIG THANK YOU to our legendary friend, @ElonMusk, for his incredible generosity in giving SpaceX Stock to millions of American children through TRUMP ACCOUNTS! This is exactly what was envisioned when we created TRUMP ACCOUNTS — Bringing together the GREAT PRIVATE SECTOR, Elon and so many more, to invest in our children, by far our greatest and most important asset, and give every American Child a piece of the American Dream. Thank you Elon! President DONALD J. TRUMP — Donald J. Trump (@realDonaldTrump) October 19, 2026 It was an enthusiastic response to Musk's commitment earlier in the day. \"Next year, I will give one of my SpaceX shares to every kid in America,\" he wrote on X. \"This will be the first of many.\" Significantly, Trump shared his praise in a post on X, a platform he has eschewed in recent years since launching his social network, Truth Social. Trump was barred from Twitter in 2021 after the Capitol riot, and while his account was reinstated after Musk bought and renamed the platform, the president has been an infrequent poster since then. Musk's $10 billion donation promise There are roughly 72 million children in the US, and SpaceX stock closed Monday at about $148 a share. At that price, one share apiece would put the gift's value at around $10.6 billion. Its eventual value will depend on SpaceX’s share price at the time the stock is transferred. Trump has been waiting for this particular contribution. In July, he said he thought Musk would donate SpaceX stock to Trump Accounts, even as he referred to their very public falling-out as a \"little dispute.\" SpaceX President Gwynne Shotwell and her husband had already pledged shares for more than ", "date_str": "2026-10-20T10:51:09+00:00", "hash": "84c76e96675d05cb", "title_fa": "ترامپ از \"سخاوت باورنکردنی\" ایلان ماسک به بیش از 10 میلیارد دلار تعهد سهام اسپیس ایکس برای کودکان تمجید کرد.", "summary_fa": "دونالد ترامپ، رئیس جمهور آمریکا از قول ایلان ماسک برای دادن سهام اسپیس ایکس به کودکان از طریق حساب های ترامپ تمجید کرد. کنت نیشیمورا / خبرگزاری فرانسه از طریق گتی ایماژ ترامپ از طرح ایلان ماسک برای اعطای یک سهم اسپیس ایکس به هر کودک در آمریکا در سال آینده تمجید کرد. این تعهد می تواند با قیمت فعلی اسپیس ایکس حدود 10.6 میلیارد دلار ارزش داشته باشد. ماسک و ترامپ روابط سختی دارند، اما به نظر می‌رسد در ماه‌های اخیر به همان صفحه بازگشته‌اند. تعهد ایلان ماسک مبنی بر دادن سهمی در اسپیس ایکس به هر کودک آمریکایی قبلاً یک سود مالی را به همراه داشته است: تمجید و تمجید گسترده از رئیس جمهور دونالد ترامپ. ترامپ روز دوشنبه نوشت: «یک تشکر بزرگ از دوست افسانه‌ای ما، ایلان ماسک» و این هدیه پیشنهادی را اقدامی «سخاوتمندانه باورنکردنی» خواند. او گفت که این سهام از طریق حساب‌های ترامپ، حساب‌های سرمایه‌گذاری ایجاد شده در دولت او، به دست کودکان می‌رسد. یک تشکر بزرگ از دوست افسانه‌ای ما، @ElonMusk، به خاطر سخاوت باورنکردنی‌اش در دادن سهام SpaceX به میلیون‌ها کودک آمریکایی از طریق حساب‌های ترامپ! این دقیقاً همان چیزی است که هنگام ایجاد حساب‌های ترامپ تصور می‌شد - بخش خصوصی بزرگ، ایلان و بسیاری دیگر را گرد هم می‌آوریم تا روی فرزندانمان سرمایه‌گذاری کنیم، بزرگترین و مهم‌ترین دارایی ما، و به هر کودک آمریکایی بخشی از رویای آمریکایی بدهیم. ممنون ایلان! رئیس جمهور دونالد جی. ترامپ - دونالد جی. ترامپ (@realDonaldTrump) 19 اکتبر 2026 این پاسخ مشتاقانه به تعهد ماسک در اوایل روز بود. او در X نوشت: \"سال آینده، من یکی از سهام اسپیس ایکس خود را به هر بچه ای در آمریکا خواهم داد.\" به طور قابل توجهی، ترامپ ستایش خود را در پستی در X به اشتراک گذاشت، پلتفرمی که در سال‌های اخیر از زمان راه‌اندازی شبکه اجتماعی"}, {"source": "Business Insider", "title": "SpaceX earnings put Elon Musk's Starlink cash cow to the test", "link": "https://www.businessinsider.com/spacex-starlink-elon-musk-earnings-stocks-shares-trump-accounts", "summary": "SpaceX CEO Elon Musk Bloomberg/Getty Images This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . The SpaceX business helping to fund Elon Musk's biggest bets is taking a swing of its own just in time for earnings. SpaceX reports earnings after the bell today, and Musk's goal of turning Starlink into a major mobile carrier is expected to be a focus. Taking on Verizon, AT T, and T-Mobile is a huge endeavor. And it requires significant investment from a company that already has a long list of expensive bets. As a bit of a refresher, SpaceX is made up of three key parts: connectivity (Starlink), space (reusable rockets like Starship), and AI (Grok, X, and data centers). Among the three, connectivity is the only one generating an operating profit . That makes it incredibly valuable not only as a stand-alone business but as a way to offset the expensive investments made by SpaceX's space and AI segments. Turning Starlink into a mobile carrier complicates that arrangement. To offer service in more densely populated areas, SpaceX will need to launch more satellites into space and establish a ground footprint. How much SpaceX plans to set aside for that buildout and the impact it'll have on the bottom line are key questions analysts will have. Musk is no stranger to talking a big game. He recently said SpaceX could one day be worth more than Earth's economy . He's backed it up by accomplishing things others thought were impossible, like self-landing rockets . Just don't expect him to hit his self-imposed deadlines. (Case in point: Tesla Roadster , which has faced numerous delays and is now targeting production in 2028.) There's less at stake when you're starting from scratch. But with Starlink, it's also about Musk avoiding turning his cash cow into another capital drain. According to another Musk proclamation, a lot of us will have a vested interest in SpaceX's success. Early Monday morning, Musk said he'll give one of his SpaceX shares to every kid in America next year . \"This will be the first of many,\" he added . Details on how that would work weren't clear, but many people immediately thought of the recently launched Trump Accounts . President Donald Trump predicted Musk would donate SpaceX stock to the accounts . And SpaceX president Gwynne Shotwell already said she'd gift a share of her company stock to Trump Accounts . If that's how the shares are distributed, it's an example ", "date_str": "2026-10-20T10:31:00+00:00", "hash": "369e81005c2e94ea", "title_fa": "درآمد SpaceX گاو نقدی Starlink ایلان ماسک را در معرض آزمایش قرار داد", "summary_fa": "ایلان ماسک، مدیر عامل اسپیس ایکس بلومبرگ/گتی ایماژ این پست در اصل در خبرنامه Business Insider Today منتشر شده است. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. کسب‌وکار SpaceX که به تامین مالی بزرگترین شرط‌بندی‌های ایلان ماسک کمک می‌کند، به‌موقع درآمد خود را تغییر می‌دهد. اسپیس ایکس درآمدهای خود را پس از زنگ امروز گزارش می دهد و انتظار می رود که هدف ماسک برای تبدیل Starlink به یک اپراتور تلفن همراه بزرگ باشد. مقابله با Verizon، AT T، و T-Mobile یک تلاش بزرگ است. و نیاز به سرمایه گذاری قابل توجهی از سوی شرکتی دارد که در حال حاضر فهرست طولانی از شرط بندی های گران قیمت دارد. به عنوان کمی تجدید، SpaceX از سه بخش کلیدی تشکیل شده است: اتصال (Starlink)، فضا (موشک های قابل استفاده مجدد مانند Starship) و AI (Grok، X و مراکز داده). در میان این سه، اتصال تنها چیزی است که سود عملیاتی ایجاد می کند. این باعث می شود نه تنها به عنوان یک تجارت مستقل، بلکه به عنوان راهی برای جبران سرمایه گذاری های گران قیمت انجام شده توسط بخش های فضایی و هوش مصنوعی SpaceX، بسیار ارزشمند باشد. تبدیل Starlink به یک اپراتور تلفن همراه این ترتیب را پیچیده می کند. برای ارائه خدمات در مناطق پرجمعیت تر، اسپیس ایکس نیاز به پرتاب ماهواره های بیشتری به فضا و ایجاد ردپای زمینی دارد. این که اسپیس ایکس چقدر قصد دارد برای این ساخت و ساز و تأثیری که بر نتیجه خواهد داشت، بگذارد، سؤالات کلیدی است که تحلیلگران خواهند داشت. ماسک با صحبت کردن در مورد یک بازی بزرگ غریبه نیست. او اخیراً گفت که SpaceX می تواند روزی بیشتر از اقتصاد زمین ارزش داشته باشد. او با انجام کارهایی که دیگران فکر می‌کردند غیرممکن هستند، مانند موشک‌های خود فرود، از آن حمایت کرده است. فقط"}, {"source": "Business Insider", "title": "I drove Toyota's new RAV4. It's boringly good — and buyers are scrambling for it.", "link": "https://www.businessinsider.com/toyota-rav4-review-hybrid-new-cars-2026-10", "summary": "Buyers can t keep scooping up the Toyota RAV4. Is it worth the hype? Ben Shimkus/Business Insider Want to buy a RAV4? Good luck finding one! I drove the longtime favorite vehicle for a week. It's boringly good — and that's a huge compliment. Toyota is ramping up its electric powertrains. The new RAV4 is the next great example. Think of that awkward highway moment: You've accidentally cut someone off or made an obvious driving mistake. You wish you could sink into automotive oblivion before the other driver gets a good look at you. The Toyota RAV4 is perfect for that situation. The crossover SUV is good at nearly everything — efficient, comfortable, reasonably priced, and backed by Toyota's reputation for reliability — while wrapped in a package that looks like pretty much every other grocery getter on the road. The Toyota RAV4 s very conventional-looking side profile. Ben Shimkus I spent a week and about 200 miles in a 2026 RAV4 Limited AWD, driving through New York City and the Catskills region. The fully-loaded tester stickered at $46,883. I found the RAV4 to be aggressively competent. Its performance won't get your adrenaline pumping, and its looks won't turn many heads. Instead, it'll get occupants comfortably from point A to point B while barely sipping fuel. And consumers can't get enough of that. RAV4 gets a facelift — and some fresh electric motivation Toyota s RAV4 has some Prius in its soul — and those are some words of endearment. Ben Shimkus/Business Insider The RAV4 , America's third-best-selling vehicle last year, is fresh out of the design studio. It's the sixth generation of the SUV: Unlike its curvier predecessors , it's squared off and upright. The front and rear are nearly perpendicular to the ground and are finished off with LED head and taillights. The more consequential change is under the hood. For 2026, Toyota killed the gas-only RAV4. Every version now comes with a battery in the powertrain; the only remaining choice for RAV4 hopefuls is between a conventional hybrid and a pricier plug-in hybrid . The RAV4 s liftgate gets a more modern, squared-off look for 2026. Ben Shimkus/Business Insider That puts one of America's most popular vehicles squarely behind the hybrid strategy Toyota has spent years defending. While rivals poured billions into all-electric lineups , Toyota kept betting that hybrids — which combine a gas engine with electric motors and a small battery that recharges as you drive — would be easier for mainstream buyers", "date_str": "2026-10-20T10:03:01+00:00", "hash": "fa8787c38ba622c4", "title_fa": "من تویوتا راو4 جدید سوار کردم. به طرز خسته کننده ای خوب است - و خریداران برای آن تلاش می کنند.", "summary_fa": "خریداران نمی توانند به خرید تویوتا RAV4 ادامه دهند. آیا ارزش تبلیغات را دارد؟ بن شیمکوس/بیزینس اینسایدر آیا می خواهید یک RAV4 بخرید؟ موفق باشید یکی را پیدا کنید! من یک هفته با وسیله نقلیه محبوب قدیمی رانندگی کردم. این به طرز خسته کننده ای خوب است - و این یک تعریف بزرگ است. تویوتا قوای محرکه الکتریکی خود را افزایش می دهد. RAV4 جدید نمونه عالی بعدی است. به آن لحظه ناخوشایند بزرگراه فکر کنید: به طور تصادفی ارتباط شخصی را قطع کرده اید یا یک اشتباه آشکار در رانندگی مرتکب شده اید. ای کاش می توانستید قبل از اینکه راننده دیگر شما را خوب ببیند، در فراموشی خودرو غرق شوید. تویوتا RAV4 برای چنین شرایطی عالی است. کراس اوور SUV تقریباً در همه چیز خوب است - کارآمد، راحت، قیمت مناسب و با پشتوانه شهرت تویوتا برای قابلیت اطمینان - در حالی که در بسته‌ای پیچیده شده است که تقریباً شبیه هر خواربارفروش دیگری در جاده است. نمای جانبی تویوتا RAV4 بسیار معمولی است. بن شیمکوس من یک هفته و حدود 200 مایل را در یک RAV4 Limited AWD مدل 2026 گذراندم و در شهر نیویورک و منطقه Catskills رانندگی کردم. تستر با بارگذاری کامل 46883 دلار برچسب خورده است. من متوجه شدم RAV4 به شدت توانمند است. عملکرد آن آدرنالین شما را افزایش نمی‌دهد و ظاهر آن نظر بسیاری را به خود جلب نخواهد کرد. در عوض، سرنشینان را به راحتی از نقطه A به نقطه B می‌رساند در حالی که به سختی سوخت می‌نوشند. و مصرف کنندگان نمی توانند از آن سیر شوند. RAV4 فیس لیفت می شود - و برخی انگیزه های الکتریکی جدید تویوتا RAV4 دارای مقداری پریوس در روح خود است - و اینها برخی از کلمات دوست داشتنی هستند. بن شیمکوس/Business Insider RAV4، سومین خودروی پرفروش آمریکا در سال گذشته، تازه وارد"}, {"source": "Business Insider", "title": "Internal docs reveal how Google is shaking up its interview process with AI", "link": "https://www.businessinsider.com/google-interview-process-ai-gemini-coding-comprehension-software-engineer-2026-10", "summary": "Google CEO Sundar Pichai. Bloomberg/Getty Images Google is injecting more AI into the interview process. The company has been testing a new format that tests candidates on their AI fluency. The pilot has recently rolled out more broadly across Google, internal docs show. AI is changing how Google employees work — and how Google hires them. The company has been testing several AI-related changes to its hiring process for software engineers, according to documents reviewed by Business Insider. These changes, which Google has been rolling out in phases throughout this year, include allowing the use of AI in coding interviews and permitting interviewers to use Gemini to give candidates feedback. Many engineers are also now expected to show some degree of AI fluency as a bare minimum, the documents show. In May, Business Insider reported that Google was piloting ways to integrate AI into the interview process with a small handful of orgs. This included a new \"code comprehension\" interview in which candidates are assessed on AI fluency and prompt engineering. Candidates can also use Google's Gemini AI as an assistant during the interview. The new formats have since been rolled out more broadly across the company, according to the internal documents. However, a spokesperson said they were still considered to be in the pilot phase for now. \"We're piloting updates to our interview process for software engineers, including evaluating for AI fluency, to be more reflective of how our teams are operating,\" Brian Ong, vice president of recruiting at Google, told Business Insider in a statement. Like other companies, Google is adapting its hiring process to keep pace with the huge transformation AI is having on software engineering . As developers increasingly rely on AI coding assistants, hiring companies want to know how competent they are with these tools. In April, Google said that three-quarters of new code created at the company is generated by AI and reviewed by humans, a trend that has since continued across the tech industry. Google has said that its employees are increasingly using the company's own Gemini models to both improve other Google products and to build the next generation of Gemini . The documents say that for some roles, including software engineering, AI fluency and AI product integration are now used as measures of a candidate's abilities. A Google spokesperson said that AI fluency is a requirement for all software engineering jobs, while AI produ", "date_str": "2026-10-20T09:58:44+00:00", "hash": "c78190d1f8916bef", "title_fa": "اسناد داخلی نشان می دهد که چگونه گوگل روند مصاحبه خود را با هوش مصنوعی متزلزل می کند", "summary_fa": "ساندار پیچای، مدیر عامل گوگل. بلومبرگ/گتی ایماژ گوگل هوش مصنوعی بیشتری را به فرآیند مصاحبه تزریق می کند. این شرکت در حال آزمایش فرمت جدیدی است که داوطلبان را بر اساس تسلط هوش مصنوعی آزمایش می کند. اسناد داخلی نشان می‌دهد که آزمایشی اخیراً به طور گسترده‌تری در سراسر Google منتشر شده است. هوش مصنوعی نحوه کار کارکنان گوگل و نحوه استخدام آنها را تغییر می دهد. طبق اسناد بررسی شده توسط Business Insider، این شرکت چندین تغییر مرتبط با هوش مصنوعی را در فرآیند استخدام مهندسان نرم افزار آزمایش کرده است. این تغییرات، که گوگل در طول سال جاری در مراحل مختلف اجرا کرده است، شامل اجازه استفاده از هوش مصنوعی در کدنویسی مصاحبه ها و اجازه دادن به مصاحبه کنندگان برای استفاده از Gemini برای ارائه بازخورد به نامزدها است. این اسناد نشان می دهد که بسیاری از مهندسان نیز اکنون انتظار می رود تا حدی از تسلط بر هوش مصنوعی را به عنوان حداقل حداقل نشان دهند. در ماه مه، Business Insider گزارش داد که گوگل در حال اجرای آزمایشی راه‌هایی برای ادغام هوش مصنوعی در فرآیند مصاحبه با تعداد کمی از سازمان‌ها است. این شامل یک مصاحبه جدید \"درک کد\" بود که در آن نامزدها از نظر تسلط هوش مصنوعی و مهندسی سریع ارزیابی می شوند. داوطلبان همچنین می توانند از هوش مصنوعی Gemini گوگل به عنوان دستیار در طول مصاحبه استفاده کنند. طبق اسناد داخلی، قالب‌های جدید از آن زمان به‌طور گسترده‌تری در سراسر شرکت عرضه شده‌اند. با این حال، یک سخنگوی گفت که آنها در حال حاضر هنوز در مرحله آزمایشی هستند. برایان اونگ، معاون استخدام در گوگل در بیانیه ای به Business Insider گفت: «ما در حال به روز رسانی های آزمایشی در فرآیند مصاحبه خود برای مهندسان نرم افزار، از جمله ارزیابی تسلط بر هوش مصنوعی، هستیم تا بیشتر منعکس کننده نحوه"}, {"source": "Business Insider", "title": "What Brevan Howard's crypto CIO is betting on to bounce back", "link": "https://www.businessinsider.com/brevan-howard-digital-assets-new-hires-strategies-chris-rayner-cook-2026-10", "summary": "Chris Rayner-Cook once traded for Citadel and Millennium before diving into the digital-asset space. Brevan Howard The crypto-focused unit of the $34 billion asset manager lost nearly 30% in its flagship fund last year. Business Insider spoke with Chris Rayner-Cook, who took over as the chief investment officer in 2025. The firm is hiring new talent and adding new strategies, including a new stablecoin-focused offering. Last year was a struggle for Brevan Howard Digital, the crypto-investing unit of the $34 billion asset manager. The Brevan Howard Digital Asset fund, its flagship multi-strategy offering that invests in public and private companies, as well as digital assets, lost nearly 30%. The unit's leader since it launched in 2021, Gautam Sharma, left the firm. Assets in the business declined from $2.5 billion earlier in the year to roughly $2 billion by the end of the summer. Now, under the leadership of former Coinbase executive Chris Rayner-Cook, the digital asset group is bringing in new talent, rolling out new strategies, and receiving interest from sovereign wealth funds. The goal is to take advantage of what Brevan believes is a structural shift in the crypto and blockchain industry. \"There are more opportunities in the applications on blockchain, there are more opportunities in equities, there are more opportunities in late-stage companies,\" Rayner-Cook said in an interview with Business Insider. His thesis on the changing nature of the industry is that the space has evolved from one that moves a group based on broader macro trends to one that has specific winners and losers. Active managers looking for alpha should be able to find opportunities in the coming \"dispersion,\" he said, and Brevan's leadership expects its platform to help PMs take advantage. The digital assets space has moved from the installation phase, where companies and industry advocates focused on building infrastructure and explaining the technology, to the application phase, when mainstream businesses use the tech without necessarily becoming a crypto or blockchain company themselves. He pointed to Visa, Mastercard, and PayPal rolling out new stablecoin products this year as examples. Rayner-Cook said the unit's broader investable universe will grow quickly, especially in public stocks. Right now, there are more than 80 listed equities that fit into their criteria, but he expects that number to more than double over the next 18 months as more companies use crypto tech. \"We w", "date_str": "2026-10-20T09:58:01+00:00", "hash": "ccf3cfbd7b636346", "title_fa": "چیزی که مدیر رمز ارزهای بروان هاوارد روی آن شرط بندی می کند تا بازگردد", "summary_fa": "کریس رینر کوک یک بار قبل از اینکه وارد فضای دارایی دیجیتال شود، برای سیتادل و هزاره معامله کرد. Brevan Howard واحد متمرکز بر رمزنگاری مدیر دارایی 34 میلیارد دلاری سال گذشته نزدیک به 30 درصد از صندوق اصلی خود را از دست داد. Business Insider با کریس راینر کوک که در سال 2025 به عنوان مدیر ارشد سرمایه گذاری انتخاب شد صحبت کرد. این شرکت در حال استخدام استعدادهای جدید و اضافه کردن استراتژی های جدید از جمله پیشنهاد جدید متمرکز بر استیبل کوین است. سال گذشته برای Brevan Howard Digital، واحد سرمایه گذاری رمزنگاری مدیر دارایی 34 میلیارد دلاری، مبارزه بود. صندوق دارایی دیجیتال Brevan Howard، پیشنهاد چند استراتژی شاخص آن که در شرکت‌های دولتی و خصوصی و همچنین دارایی‌های دیجیتال سرمایه‌گذاری می‌کند، نزدیک به 30 درصد از دست داد. رهبر این واحد از زمان راه اندازی آن در سال 2021، گوتام شارما، شرکت را ترک کرد. دارایی های این تجارت از 2.5 میلیارد دلار در اوایل سال به حدود 2 میلیارد دلار در پایان تابستان کاهش یافت. اکنون، تحت رهبری کریس رینر کوک، مدیر اجرایی سابق کوین‌بیس، گروه دارایی‌های دیجیتال استعدادهای جدیدی را وارد می‌کند، استراتژی‌های جدیدی را ارائه می‌کند و از صندوق‌های دارایی مستقل بهره می‌گیرد. هدف استفاده از آنچه بروان معتقد است یک تغییر ساختاری در صنعت کریپتو و بلاک چین است. رینر کوک در مصاحبه ای با Business Insider گفت: فرصت های بیشتری در برنامه های کاربردی در بلاک چین وجود دارد، فرصت های بیشتری در سهام، فرصت های بیشتری در شرکت های مرحله آخر وجود دارد. تز او در مورد ماهیت در حال تغییر صنعت این است که فضا از فضایی که گروهی را بر اساس روندهای کلان گسترده تر به فضایی که برندگان و بازندگان خاصی دارد، تبدیل شده است. او گفت که مدیران فعالی که به دنبال آلفا هستند باید بتوانند"}, {"source": "Business Insider", "title": "Big Tech's earnings gauntlet starts today. Here’s what investors need to see.", "link": "https://www.businessinsider.com/netflix-spacex-meta-tesla-q3-earnings-investor-stock-price-outlook-2026-10", "summary": "Samuel Boivin/NurPhoto via Getty Images Welcome to tech's earnings gauntlet. Netflix, SpaceX, Meta, and Tesla report over the next two days. Wall Street has heard the big promises. Now it wants actual progress from each company. Sign up for First Trade , Business Insider's daily markets newsletter. Big Tech is about to run a two-day gauntlet featuring some of the market's heaviest hitters. Netflix and SpaceX report after the closing bell today. Meta and Tesla follow on Wednesday. All four are, in their own ways, expensive growth stories, and their earnings arrive at a difficult moment for markets. The AI trade has taken a beating of late from investors turning skeptical of immense spending plans . The companies tapping debt markets to finance that spending are getting even more of a side eye from traders. That ramps up the stakes for this week's reports. For years, these tech giants have been rewarded for their future growth stories. Now, investors are increasingly looking for receipts. Here's what each company needs to prove: Netflix (Oct. 20) Netflix's ouster of Chief Content Officer Bela Bajaria underscores its push for more original hits. After missing out on Warner Bros. Discovery, investors want the streamer to find them on its own — and soon. That puts extra weight on Netflix's content slate, especially as it competes for eyeballs against free competitors like YouTube and TikTok. What investors want to see: A credible pipeline of must-watch shows, steadier engagement, and growth in advertising and live programming. SpaceX (Oct. 20) SpaceX has a lot going on. Starlink , launches, Starship , satellites, and a growing AI business . That means there's a lot to spend money on. That sets up today's report as a useful public-market check on the company's sprawling ambitions. Traders will want a clearer sense of which parts of the business are actually gaining real commercial traction, and — most importantly — how much it's all going to cost. What investors want to see: Strong Starlink growth, a healthy pace of launches, and tangible progress toward cheaper, reusable Starship launches. Meta (Oct. 21) Meta's stock has surged since the release of Muse , its new agentic-AI platform. The bull case is that agents can open a new growth lane while making Meta's enormous advertising business even more valuable. But shares have been hit by AI jitters in recent days. And the higher Meta stock rises on the grand promise of agentic-AI earnings growth , the more evidenc", "date_str": "2026-10-20T09:50:01+00:00", "hash": "7dc67ac57bc20034", "title_fa": "دستکش درآمدی Big Tech از امروز آغاز می شود. در اینجا چیزی است که سرمایه گذاران باید ببینند.", "summary_fa": "Samuel Boivin/NurPhoto via Getty Images به دستکش درآمد فناوری خوش آمدید. نتفلیکس، اسپیس ایکس، متا و تسلا در دو روز آینده گزارش می دهند. وال استریت وعده های بزرگ را شنیده است. اکنون از هر شرکتی پیشرفت واقعی می خواهد. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. Big Tech در شرف اجرای یک دستکش دو روزه است که برخی از سنگین ترین مهاجمان بازار را به نمایش می گذارد. نتفلیکس و اسپیس ایکس پس از زنگ پایان امروز گزارش دادند. متا و تسلا در روز چهارشنبه دنبال می شوند. هر چهار مورد، به روش خاص خود، داستان های رشد گرانی هستند و درآمد آنها در لحظه ای دشوار برای بازارها می رسد. تجارت هوش مصنوعی با تأخیر سرمایه‌گذارانی را که نسبت به برنامه‌های هزینه‌های عظیم بدبین شده‌اند، شکست خورده است. شرکت‌هایی که از بازارهای بدهی برای تامین مالی این هزینه‌ها استفاده می‌کنند، بیشتر مورد توجه معامله‌گران قرار می‌گیرند. این ریسک را برای گزارش های این هفته افزایش می دهد. برای سال‌ها، این غول‌های فناوری برای داستان‌های رشد آینده‌شان پاداش دریافت می‌کنند. در حال حاضر، سرمایه گذاران به طور فزاینده ای به دنبال دریافت هستند. این چیزی است که هر شرکت باید ثابت کند: نتفلیکس (20 اکتبر) برکناری نتفلیکس از مدیر ارشد محتوای بلا باجاریا تاکیدی بر تلاش آن برای بازدیدهای اصلی بیشتر است. پس از از دست دادن Warner Bros. Discovery، سرمایه‌گذاران از پخش‌کننده می‌خواهند که آنها را خودش پیدا کند - و به زودی. این امر وزن بیشتری را بر فهرست محتوای نتفلیکس وارد می‌کند، به‌ویژه که در رقابت بر سر چشم‌ها با رقبای رایگانی مانند YouTube و TikTok است. آنچه سرمایه‌گذاران می‌خواهند ببینند: خط لوله معتبری از نمایش‌های ضروری، مشارکت پایدارتر، و رشد در تبلیغات و برنامه‌نویسی زنده. SpaceX (20 اکتبر) SpaceX چیزهای زیادی در حال انجام است. Starlink، پرتاب‌ها، Starship، ماهواره‌ها و یک"}, {"source": "Business Insider", "title": "The 10 longest-serving senators currently in office", "link": "https://www.businessinsider.com/longest-serving-senators-congress-midterms-2026-10", "summary": "From left to right: Sen. Chuck Grassley, Sen. Susan Collins, and Sen. Mitch McConnell. Finn Gomez/Getty Images ; Charly Triballeau/AFP via Getty Images ; Pete Kiehart/Bloomberg via Getty Images There are no term limits for Senate members, and some have served for decades. Sen. Susan Collins, 73, is running for her sixth Senate term in a high-profile race in the midterms. Sen. Chuck Grassley, 93, is the longest-serving current senator with 45 years in the Senate. Unlike the White House , where US presidents can serve only two terms, members of Congress have no term limits. In the US Senate, some members have served for decades. Senators are also getting older, on average. In the 119th Congress, which began in 2025, the median age of US senators was 64. That marks an increase from the 113th Congress in 2013, when the median age in the Senate was 61, per Ballotpedia . Of the 10 longest-serving senators, two are running for reelection in the 2026 midterm elections . Here are the current senators who have held office the longest — and how many years they've served. Sen. Maria Cantwell — 25 years UNITED STATES - SEPTEMBER 14: Sen. Maria Cantwell, D-Wash., ranking member of the Senate Commerce, Science, conducts a news conference with student-athletes and coaches outside the U.S. Capitol on the Protect College Sports Act, on Monday, September 14, 2026. (Tom Williams/CQ-Roll Call, Inc via Getty Images) Tom Williams/CQ-Roll Call, Inc via Getty Images Cantwell, a 68-year-old Democrat from Washington, has served as a US senator since January 3, 2001. She won her fifth term in 2024 and will be up for reelection in 2030. Sen. Chuck Schumer — 27 years UNITED STATES - SEPTEMBER 29: Senate Minority Leader Charles Schumer, D-N.Y., arrives for a news conference after the Senate luncheons in the U.S. Capitol on Tuesday, September 29, 2026. (Tom Williams/CQ-Roll Call, Inc via Getty Images) Tom Williams/CQ-Roll Call, Inc via Getty Images Schumer, a Democrat from New York, was sworn in on January 3, 1999. Schumer, 75, will be up for reelection in 2028. Sen. Mike Crapo — 27 years WASHINGTON, DC - MAY 20: U.S. Sen. Mike Crapo (R-ID) arrives to a business meeting with the Senate Committee on the Budget in the Dirksen Senate Office Building on May 20, 2026 in Washington, DC. The committee held the meeting to discuss the upcoming congressional budget for the United States Government. (Photo by Anna Moneymaker/Getty Images) Anna Moneymaker/Getty Images Crapo, 75, is a Republican who ", "date_str": "2026-10-20T09:49:01+00:00", "hash": "1adad52a6d4491cd", "title_fa": "10 سناتور با سابقه ترین سناتور در حال حاضر", "summary_fa": "از چپ به راست: سناتور چاک گراسلی، سناتور سوزان کالینز و سناتور میچ مک کانل. فین گومز/گتی ایماژ; Charly Triballeau/AFP از طریق Getty Images. پیت کیهارت/ بلومبرگ از طریق گتی ایمیجز هیچ محدودیتی برای اعضای سنا وجود ندارد و برخی از آنها برای چندین دهه خدمت کرده اند. سناتور سوزان کالینز، 73 ساله، برای ششمین دوره مجلس سنا در رقابت های میان دوره ای نامزد می شود. سناتور چاک گراسلی 93 ساله با 45 سال حضور در سنا طولانی ترین سناتور فعلی است. برخلاف کاخ سفید، که در آن روسای جمهور ایالات متحده فقط دو دوره می توانند خدمت کنند، اعضای کنگره هیچ محدودیتی برای دوره ندارند. در سنای ایالات متحده، برخی از اعضا برای چندین دهه خدمت کرده اند. سناتورها نیز به طور متوسط ​​در حال افزایش سن هستند. در کنگره 119، که در سال 2025 آغاز شد، میانگین سنی سناتورهای ایالات متحده 64 سال بود. این افزایش نسبت به کنگره 113 در سال 2013، زمانی که میانگین سنی در سنا 61 سال بود، افزایش یافته است. از 10 سناتور با سابقه طولانی مدت، دو نفر برای انتخاب مجدد در انتخابات میان دوره ای 2026 نامزد می شوند. در اینجا سناتورهای فعلی که بیشترین مدت را در این سمت داشته اند و چند سال خدمت کرده اند آورده شده است. سناتور ماریا کانتول - 25 سال ایالات متحده - 14 سپتامبر: سناتور ماریا کانتول، D-Wash.، عضو رتبه بندی بازرگانی، علوم سنا، یک کنفرانس خبری با دانشجویان ورزشکار و مربیان خارج از ساختمان کنگره ایالات متحده در مورد قانون ورزش کالج محافظت در روز دوشنبه، 14 سپتامبر برگزار می کند. (تام ویلیامز/CQ-Roll Call, Inc از طریق Getty Images) Tom Williams/CQ-Roll Call, Inc از طریق Getty Images Cantwell، یک دموکرات 68 ساله از واشنگتن، از 3 ژانویه 2001 به عنوان سناتور ایالات متحده خدمت کرده است. او پنجمین دوره خود را"}, {"source": "Business Insider", "title": "The life-changing leadership advice Uber's CEO gave GoDaddy's CEO", "link": "https://www.businessinsider.com/leadership-advice-uber-ceo-gave-godaddy-ceo-2026-10", "summary": "Aman Bhutani (left) said Dara Khosrowshahi gave him career advice that changed his career. WEF/Vipin Kumar/Hindustan Times via Getty Images GoDaddy's CEO said Dara Khosrowshahi once gave him career advice that changed his leadership. Aman Bhutani said Khosrowshahi told him he'd never gain ad experience if he didn't start speaking up about it. The advice prompted Bhutani to push through the discomfort of learning new functions. Getting a seat at the leadership table is a challenge in itself — but speaking up confidently once you get there is a different beast. Aman Bhutani, CEO of the domain registrar and web-hosting company GoDaddy, said he received advice on navigating those moments from Uber's current CEO Dara Khosrowshahi , who at the time led Expedia and served as president of the brand. Bhutani was then the company's head of technology, and reported to Khosrowshahi. Khosrowshahi gave him a chance to discuss advertising in a senior-level meeting they were both attending. While Bhutani was initially excited about the opportunity, he said that eagerness didn't come through. \"Sitting in this room of leaders, where there were people that had way more experience and expertise than I did, I didn't speak up,\" Bhutani told Business Insider. Bhutani said he regularly spoke up in meetings about product, engineering, and other areas where he felt confident about. However, while advertising was a core interest, he hesitated to weigh in. After several meetings, Khosrowshahi pulled Bhutani aside and gave him feedback that the GoDaddy CEO said changed his career. Khosrowshahi asked why Bhutani didn't share his perspective on functional marketing, since the topic was so critical for the business. Bhutani explained he didn't have \"any actual experience\" in marketing. Khosrowshahi's response, Bhutani said, was simple. \"'And if you don't talk about it, you never will,'\" Bhutani said, recounting Khosrowshahi's reply. \"'If you don't talk and make mistakes and say the wrong things and get beat up by the CMO , how are you going to learn?\" Khosrowshahi reminded Bhutani that Bhutani wasn't afraid to be wrong on the product-tech side. He told Bhutani that he should approach marketing the same way, even if he didn't have the same background. That advice has since taken Bhutani far, he said. Bhutani later took over presidency of the Expedia brand from Khosrowshahi in July 2015, with marketing and advertising teams reporting to him. Bhutani said that in his last job and current po", "date_str": "2026-10-20T09:48:01+00:00", "hash": "3abb6340192e53c5", "title_fa": "توصیه هایی که مدیر عامل Uber به مدیر عامل GoDaddy داده است", "summary_fa": "امان بوتانی (چپ) گفت که دارا خسروشاهی به او توصیه های شغلی کرد که باعث تغییر شغل او شد. WEF/Vipin Kumar/Hindustan Times از طریق گتی ایماژ مدیر عامل GoDaddy گفت که دارا خسروشاهی زمانی به او توصیه های شغلی کرد که رهبری او را تغییر داد. امان بوتانی گفت که خسروشاهی به او گفته است که اگر شروع به صحبت در مورد آن نکند، هرگز تجربه تبلیغاتی کسب نخواهد کرد. این توصیه، بوتانی را بر آن داشت تا ناراحتی ناشی از یادگیری عملکردهای جدید را از بین ببرد. گرفتن یک صندلی در میز رهبری به خودی خود یک چالش است - اما صحبت کردن با اطمینان پس از رسیدن به آنجا چیز دیگری است. امان بوتانی، مدیر عامل شرکت ثبت دامنه و میزبانی وب GoDaddy، گفت که او برای هدایت آن لحظات از دارا خسروشاهی، مدیرعامل فعلی اوبر، که در آن زمان رهبری Expedia را بر عهده داشت و به عنوان رئیس این برند خدمت می کرد، مشاوره دریافت کرد. بوتانی در آن زمان رئیس فناوری شرکت بود و به خسروشاهی گزارش داد. خسروشاهی به او این فرصت را داد تا در جلسه ای در سطح ارشد که هر دو در آن حضور داشتند، درباره تبلیغات بحث کند. در حالی که بوتانی در ابتدا از این فرصت هیجان زده بود، گفت که اشتیاق از بین نرفت. بوتانی به Business Insider گفت: «در این اتاق رهبران نشسته بودم، جایی که افرادی بودند که تجربه و تخصص بیشتری نسبت به من داشتند، صحبت نکردم. بوتانی گفت که او مرتباً در جلسات در مورد محصول، مهندسی و سایر زمینه هایی که در آنها احساس اطمینان می کرد صحبت می کرد. با این حال، در حالی که تبلیغات یکی از علایق اصلی بود، او تردید داشت. پس از چندین جلسه، خسروشاهی بوتانی را کنار کشید و به او بازخورد داد که مدیرعامل GoDaddy گفت"}, {"source": "Business Insider", "title": "I visited a coworking space where startup founders with tiny teams pay $9K a month to be around each other", "link": "https://www.businessinsider.com/gen-z-founders-million-dollar-ai-startups-coworkers-tiny-teams-2026-10", "summary": "Inside the Series HQ office. Agnes Applegate/BI I visited an NYC coworking space, where startups spend up to $9,000 a month for a spot. There was a private chef, a robot, and a love for in-person work. The overall vibe more closely resembled a college campus than a midtown office. I've been following and interviewing tiny team founders for the last year. As part of my ongoing research, I popped into the Series HQ workspace last month to observe how these founders are running their small teams. As the elevator doors opened on the top floor of the Chelsea office building, the Series HQ office manager, a 21-year-old NYU student, greeted me. Balancing on a skateboard, the tall, young, and very casually dressed Gen Zer fit right in among the cohort of founders he works for. Most of the founders at Series HQ are either straight out of college or under 30, with many of their startups being in early funding rounds. \"I do honestly think if you're 35 or 40 thinking about starting a company now, it's probably too late,\" Nathaneo Johnson, the 22-year-old Series cofounder, said. He recognizes that as a \"harsh belief\" but believes the average founder age at Series HQ reflects a growing community of young entrepreneurs . Series itself was launched in 2024 by Johnson and Sean Hargrow as an AI social networking app for iMessage. After they both graduated from Yale and raised $5.1 million in pre-seed funding , the pair signed a lease for over 10,000 square feet of office space. They tacked on \"HQ\" to distinguish between the coworking space and the business. When they moved their company into the building last October, they had roughly eight to 10 people on their team. The pair was preparing for growth, but AI has helped to keep their head count lean, and their tenants operate with similarly sized staff. As I scanned the still mostly empty office, it seemed the tiny teams didn't require much to function. What stood out to me — more than the young, mostly male office demographic — was each company's desire to be around more people, despite operating with as few employees as possible. Business Insider wants to talk to founders of AI-powered companies with fewer than 10 workers, and employees working alongside AI agents, to understand what the \"Tiny Teams\" era really feels like — the wins, the fears, and the human skills that stand out. Share your story by filling out this quick form . The tiny teams here can spend up to $9,000 a month for shared space I was at the office aroun", "date_str": "2026-10-20T09:23:06+00:00", "hash": "e9899d05187e48b9", "title_fa": "من از یک فضای همکاری بازدید کردم که در آن بنیانگذاران استارت آپ با تیم های کوچک ماهیانه 9 هزار دلار برای دور هم بودن پرداخت می کنند.", "summary_fa": "داخل دفتر مرکزی سری. اگنس اپلگیت/BI من از یک فضای کار مشترک در نیویورک بازدید کردم، جایی که استارت آپ ها ماهانه 9000 دلار خرج می کنند. یک آشپز خصوصی، یک ربات و عشق به کار حضوری وجود داشت. حال و هوای کلی بیشتر شبیه محوطه دانشگاه بود تا دفتر مرکزی. من در سال گذشته بنیانگذاران تیم کوچک را دنبال کرده و با آنها مصاحبه کرده ام. به عنوان بخشی از تحقیقات مداوم خود، ماه گذشته به فضای کاری سری HQ مراجعه کردم تا ببینم این بنیانگذاران چگونه تیم های کوچک خود را اداره می کنند. هنگامی که درهای آسانسور در طبقه بالای ساختمان اداری چلسی باز شد، مدیر دفتر سری HQ، یک دانشجوی 21 ساله دانشگاه نیویورک، به من سلام کرد. ژنرال زر که روی یک اسکیت بورد متعادل می شود، قد بلند، جوان و خیلی معمولی لباس می پوشد، درست در میان گروهی از بنیانگذارانی که او برای آنها کار می کند، قرار می گیرد. اکثر بنیانگذاران سری HQ یا مستقیماً کالج را ترک کرده‌اند یا زیر 30 سال دارند و بسیاری از استارت‌آپ‌های آنها در مراحل اولیه تأمین مالی هستند. ناتانئو جانسون، بنیانگذار 22 ساله سری گفت: صادقانه فکر می کنم اگر اکنون 35 یا 40 ساله هستید که به راه اندازی یک شرکت فکر می کنید، احتمالاً خیلی دیر شده است. او این را به عنوان یک «باور خشن» می‌داند، اما معتقد است که میانگین سنی بنیان‌گذاران در سری HQ نشان‌دهنده جامعه رو به رشد کارآفرینان جوان است. خود سری در سال 2024 توسط جانسون و شان هارگرو به عنوان یک برنامه شبکه اجتماعی هوش مصنوعی برای iMessage راه اندازی شد. پس از اینکه هر دو از دانشگاه ییل فارغ التحصیل شدند و 5.1 میلیون دلار سرمایه اولیه را جمع آوری کردند، این زوج قراردادی را برای بیش از 10000 فوت مربع فضای اداری امضا کردند."}, {"source": "Business Insider", "title": "Wall Street analysts love this corner of the stock market as AI fears cause the bull rally to falter", "link": "https://www.businessinsider.com/where-to-invest-now-quality-stocks-ai-capex-interest-rates-2026-10", "summary": "TIMOTHY A. CLARY / AFP via Getty Images Wall Street analysts are increasingly touting quality stocks amid AI trade volatility. Morgan Stanley, Piper Sandler, Goldman Sachs, and others have all highlighted the theme recently. Some of the stocks they highlight include Visa, Nvidia, Hershey, and CVS. Financial markets have been navigating rocky seas in recent weeks , and a growing number of Wall Street analysts are telling investors to find a port to wait out the storm. That proverbial port is quality stocks, commonly defined as companies with a long track record of growing earnings, a durable competitive advantage, low debt levels, and proven management teams. Rising interest rates — thanks to sticky inflation, government borrowing, and huge demand for capital to build out AI infrastructure — have pummeled many stocks tied to the AI trade over the last few weeks, including chip firms and cloud companies. Investors have bid up their prices to astronomical levels on expected future growth, but now worry that a potential decline in AI spending could lower those expectations . Quality stocks, meanwhile, tend to have more established businesses and a history of earnings growth, and are therefore less volatile. Given fears around the staying power of the AI buildout trade, Wall Street thinks it's a great time to have exposure to the quality factor. Morgan Stanley has been highlighting the factor for weeks in its client notes, and again endorsed the trade on Monday. It pointed to the spread in earnings revisions breadth between high-quality and low-quality stocks. High-quality stocks are increasingly seeing better earnings growth relative to low-quality stocks. \"The revisions spread has tended to lead relative performance by roughly 6—12 months. When it has been in the top quintile of its historical revisions range, as it is today, high quality has outperformed low quality by an average of ~8%% over the following 12 months,\" Mike Wilson, the bank's top US equity strategist, said in a note. The bank recently shared a list of stocks to quality stocks to buy , including Visa, Nvidia, ServiceNow, Apple, and more. Goldman Sachs also touted the factor in a client note on Monday. The bank shared a screen of \"defensive stocks with quality attributes\" for investors to consider, like CVS, Kroger, Hershey, Tyson Foods, and more . In an October 16 client note, Piper Sandler said quality stocks were likely on the brink of outperformance. The firm pointed out that the performanc", "date_str": "2026-10-20T09:20:01+00:00", "hash": "fe4082c3e5484986", "title_fa": "تحلیلگران وال استریت این گوشه از بازار سهام را دوست دارند، زیرا ترس از هوش مصنوعی باعث می‌شود که روند صعودی گاو نر به عقب بیفتد", "summary_fa": "TIMOTHY A. CLARY / AFP از طریق Getty Images تحلیلگران وال استریت به طور فزاینده ای از سهام با کیفیت در میان نوسانات تجارت هوش مصنوعی تبلیغ می کنند. مورگان استنلی، پایپر سندلر، گلدمن ساکس و دیگران همگی اخیراً این موضوع را برجسته کرده‌اند. برخی از سهامی که آنها برجسته می کنند عبارتند از Visa، Nvidia، Hershey و CVS. بازارهای مالی در هفته‌های اخیر در حال حرکت در دریاهای صخره‌ای بوده‌اند و تعداد فزاینده‌ای از تحلیلگران وال استریت به سرمایه‌گذاران می‌گویند که بندری پیدا کنند تا منتظر طوفان باشند. آن بندر ضرب المثلی سهام با کیفیت است که معمولاً به عنوان شرکت هایی با سابقه طولانی درآمد در حال رشد، مزیت رقابتی بادوام، سطح بدهی پایین و تیم های مدیریتی اثبات شده تعریف می شود. افزایش نرخ بهره - به لطف تورم ثابت، استقراض دولت و تقاضای عظیم برای سرمای
