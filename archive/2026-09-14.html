th. \"We are building the future of skin health,\" Lady Gaga, whose real name is Stefani Germanotta, wrote on X on August 21. \"Welcome from Michael, Me and the entire team at Outer Bio.\" Meet @outerbio and YUNA. We are building the future of skin health. https://t.co/0PsbHPTIAX Welcome from Michael, Me and the entire team at Outer Bio. — Lady Gaga (@ladygaga) August 22, 2026 Founded in 2020, Outer Bio is a Massachusetts-based company that studies human skin to discover new bioactive ingredients, or compounds that can affect living tissue. Ideally, for Outer Bio, those ingredients could be used across a variety of industries, from pharmaceutical to beauty. Lady Gaga sits on the board of directors. \"If you imagine products in Ulta or CVS, they have all sorts of active ingredients in them,\" Polansky said. \"We would have proprietary active ingredients in products that were sold by other people.\" Outer Bio's research Studying human skin is tricky. Conducting tests on living people is highly regulated and an ethical minefield, while options like artificial skin and lab-grown organoids don't provide the same insights as actual skin. Plus, skin living outside the body can die quickly, making it difficult to conduct long-term studies. That's where Yuna, a research and development system Outer Bio developed in 2022, comes into play. It can keep living, full-thickness human skin observable for four weeks, the company says. The", "date_str": "2026-09-14T09:31:01+00:00", "hash": "dd5d8b74a7893ead", "title_fa": "نامزد مدیرعامل لیدی گاگا در حال آموزش یک مدل هوش مصنوعی بر روی داده های جمع آوری شده از پوست انسان است.", "summary_fa": "مایکل پولانسکی یکی از بنیانگذاران Outer Bio، یک شرکت بیوتکنولوژی است که با Lady Gaga's Haus Labs شریک است. Theo Wargo/NBC/Getty Images مایکل پولانسکی یکی از بنیانگذاران Outer Bio، یک شرکت بیوتکنولوژیکی است که روی پوست انسان تحقیق می کند. نامزد او، لیدی گاگا، در هیئت مدیره این شرکت حضور دارد. Outer Bio در حال آموزش مدل های هوش مصنوعی بر روی داده های جمع آوری شده از نمونه های پوست است. مایکل پولانسکی مشغول است. در دهه گذشته، او یک موسسه غیرانتفاعی بشردوستانه را تأسیس کرد، یک شرکت سرمایه گذاری خطرپذیر در مراحل اولیه راه اندازی کرد، یک شرکت مدیریت دارایی را هدایت کرد، با لیدی گاگا نامزد کرد، و به نوعی فرصت داشت تا به عنوان یک هنرمند نامزد جایزه گرمی برای نوشتن هفت آهنگ در ششمین آلبوم استودیویی نامزدش، \"May\" نامزد جایزه گرمی شود. او و لیدی گاگا نیز به تازگی به اولین فرزند خود خوش آمد گفتند. او با کانون توجه غریبه نیست، اما یکی از جاه طلبانه ترین پروژه های او تا به امروز برای عموم ناشناخته مانده است. پولانسکی به بیزینس اینسایدر گفت: «ما در داخل تصمیم گرفتیم که در مورد کاری که انجام می‌دهیم صحبت نکنیم تا زمانی که داده‌های تولید شده ارزش انتشار نداشته باشند. آن لحظه اواخر ماه گذشته فرا رسید. لیدی گاگا با نام اصلی استفانی جرمنوتا در تاریخ 21 اوت در X نوشت: \"ما در حال ساختن آینده سلامت پوست هستیم.\" با @outerbio و YUNA آشنا شوید. ما در حال ساختن آینده سلامت پوست هستیم. https://t.co/0PsbHPTIAX از مایکل، من و کل تیم در Outer Bio خوش آمدید. — لیدی گاگا (@ladygaga) 22 آگوست 2026، Outer Bio که در سال 2020 تأسیس شد، یک شرکت مستقر در ماساچوست است که پوست انسان را برای کشف مواد فعال زیستی جدید یا ترکیباتی که می توانند بر بافت زنده تأثیر بگذارند، مطالعه"}, {"source": "Business Insider", "title": "He had a gig mowing lawns at 11. By 25, he had turned it into a multimillion-dollar landscaping business.", "link": "https://www.businessinsider.com/landscaping-business-childhood-career-2026-9", "summary": "Cody Kuebler, 25, started mowing his neighbors lawns when he was 11. CLK Landscape Construction He began by cutting neighbors' grass for about $25 a lawn. A move at 14 meant rebuilding his customer base from scratch. He now oversees millions of dollars' worth of equipment — and works six days a week. Some kids mow lawns for pocket money and move on. Cody Kuebler kept at it, turning the childhood gig into a multimillion-dollar business. Now 25, Kuebler said he spent his summers growing up cutting his neighbors' grass for around $25 a job, first with an aging push mower, and later with one his father gave him for his 11th birthday. The gift involved \"a little bit of horse-trading,\" he said: He'd have to cut his dad's lawn. Along the way, he hired friends so he could take on more customers and expand into snow removal during the winter months. Eventually, he earned enough to invest in riding lawn mowers with wagons attached. \"I got a little taste of earning money and being my own boss,\" Kuebler told Business Insider. \"That kind of stuck in my head.\" Business Insider's Young Geniuses series spotlights the next generation of founders, innovators, and thinkers trying to reshape industries and solve global challenges. See more stories from the series here , or reach out to editor Peter Gelling to share your story. Getting to where he is today, though, took grit and determination. Kuebler's parents divorced when he was 10, and a few years later, he moved from his childhood home in a small Iowa town to Des Moines after his father got a new job there. That meant having to start his fledgling business all over again. \"It was frustrating because I had built a decent amount of customers that I lost over a decision I didn't make and couldn't change,\" Kuebler said. He pressed ahead, though as high school graduation approached, Kuebler wasn't sure his business could lead to a career. Since he is a car enthusiast and had already earned enough credits to graduate, he said he spent part of his senior year studying diesel mechanics at a local community college. He dropped out during the first semester, concluding he'd spent enough time in the classroom. Kuebler also considered working in sales. He got a job at a tire shop, but said his boss wasn't interested in pursuing ideas he had to grow the business. That experience clarified his own ambitions. \"I always knew I wanted to do more in life,\" Kuebler said. \"What that was, I didn't know at the time, but what I did know was how", "date_str": "2026-09-14T09:27:01+00:00", "hash": "72e3e3e7b852a7c1", "title_fa": "او در 11 سالگی چمن زنی داشت. در 25 سالگی، آن را به یک تجارت چند میلیون دلاری محوطه سازی تبدیل کرده بود.", "summary_fa": "کودی کوبلر، 25 ساله، از 11 سالگی شروع به دریدن چمن همسایگان خود کرد. حرکت در 14 سالگی به معنای بازسازی پایگاه مشتری او از ابتدا بود. او اکنون بر تجهیزات میلیون ها دلاری نظارت دارد - و شش روز در هفته کار می کند. برخی از بچه ها برای پول جیبی چمن ها را می چینند و ادامه می دهند. کودی کوبلر به آن ادامه داد و کنسرت دوران کودکی را به یک تجارت چند میلیون دلاری تبدیل کرد. کوبلر که اکنون 25 سال دارد، گفت که تابستان‌هایش را با چیدن علف‌های همسایه‌هایش به ازای هر شغل 25 دلار گذرانده است، ابتدا با یک ماشین چمن‌زن قدیمی و بعداً با ماشینی که پدرش برای تولد 11 سالگی به او هدیه داده بود. او گفت: او باید چمن پدرش را ببرد. در طول مسیر، او دوستانی را استخدام کرد تا بتواند مشتریان بیشتری را جذب کند و در ماه های زمستان برف روبی را گسترش دهد. در نهایت، او به اندازه‌ای درآمد کسب کرد که بتواند روی ماشین‌های چمن‌زنی سواری با واگن‌های متصل سرمایه‌گذاری کند. کوبلر به Business Insider گفت: «من کمی طعم کسب درآمد و رئیس خودم بودن را چشیدم. \"این نوع در سر من گیر کرده است.\" مجموعه نابغه‌های جوان Business Insider نسل بعدی بنیان‌گذاران، مبتکران و متفکرانی را که سعی در تغییر شکل صنایع و حل چالش‌های جهانی دارند، به تصویر می‌کشد. داستان‌های بیشتری از این مجموعه را اینجا ببینید، یا با ویرایشگر پیتر گلینگ تماس بگیرید تا داستان خود را به اشتراک بگذارد. با این حال، رسیدن به جایی که او امروز است، عزم و اراده لازم داشت. والدین کوبلر زمانی که او 10 ساله بود از هم جدا شدند و چند سال بعد، پس از اینکه پدرش شغل جدیدی در آنجا پیدا کرد، از خانه دوران کودکی خود در شهر کوچک آیووا به د موین"}, {"source": "Business Insider", "title": "2027 cars are rolling in slower than usual. That's good news for 2026 buyers.", "link": "https://www.businessinsider.com/2027-cars-late-good-news-car-prices-2026-9", "summary": "Fresh-faced 2027 cars are taking their time to reach dealerships. Here s what that means for buyers. Kevin Carter/Getty Images 2027's cars are arriving fashionably late: just 12.4% of new inventory is 2027. Several brands are just getting started with their 2027 model-year shipments. The slower switch could help patient shoppers score a deal on a 2026 model later this fall, analysts say. The auto industry is clinging to 2026. At the end of August, just 12.4% of new-vehicle inventory was 2027 model-year, according to CarGurus data shared with Business Insider. That's a sharp break from recent patterns: At the same point in each of the past three years, roughly one-quarter of new dealership inventory was for the next model year. Kevin Roberts, the director of economic and market intelligence for CarGurus, told Business Insider that the transition looks similar to the period from 2020 through 2022, when the industry was dealing with Covid-era assembly-line shutdowns and chip shortages . This year is different and less existential, he said, because \"a lot of factors all came together to create something kind of unique this year.\" High-volume cars are driving the trend GM s best-selling vehicle, the Silverado, gets a fresh design for 2027. Chevrolet America's most popular cars are showing up late to the 2027 party. Erin Keating, Cox Automotive's executive analyst, told Business Insider that the trend is largely powered by big-name vehicles getting refreshed designs at different times. \"In several cases, what looks like a slowdown at the brand level is really individual models rotating,\" she said. \"It's important not to read this as uniform across a brand's whole lineup.\" GM is the cleanest example. The Detroit automaker has redesigned the Chevrolet Silverado and GMC Sierra for 2027, with assembly of the new trucks expected to begin in October. The pickups are the company's best sellers, so a later handoff keeps an outsize number of 2026 models in the market. Other examples are more idiosyncratic, but still focused on best-sellers. Nissan's high-volume Rogue received a 2026.5 model year. Toyota's ever-popular RAV4 got its 2026 update in calendar 2025, making a quick switch to a 2027 version less likely. Honda is still sending fresh 2026 models to dealerships, too, Roberts said. The car company told Business Insider that some of its best-selling 2027 CR-V SUVs have reached dealerships, but model year changeover \"is not fixed to a specific month, quarter, or time ", "date_str": "2026-09-14T09:23:01+00:00", "hash": "30b4f31019cbbfbf", "title_fa": "خودروهای 2027 کندتر از حد معمول حرکت می کنند. این خبر خوبی برای خریداران 2026 است.", "summary_fa": "خودروهای 2027 با چهره تازه برای رسیدن به نمایندگی ها وقت خود را صرف می کنند. در اینجا به معنای آن برای خریداران است. خودروهای کوین کارتر/گتی ایماژهای 2027 با تاخیر وارد می‌شوند: فقط 12.4 درصد از موجودی جدید در سال 2027 است. چندین برند به تازگی با محموله‌های سال 2027 خود شروع به کار کرده‌اند. تحلیلگران می گویند که تغییر کندتر می تواند به خریداران صبور کمک کند تا در اواخر پاییز امسال روی مدل 2026 معامله کنند. صنعت خودرو به سال 2026 چسبیده است. بر اساس داده های CarGurus که با Business Insider به اشتراک گذاشته شده است، در پایان ماه اوت، تنها 12.4 درصد از موجودی خودروهای جدید مربوط به سال مدل 2027 بوده است. این یک گسست شدید از الگوهای اخیر است: در همان نقطه در هر یک از سه سال گذشته، تقریباً یک چهارم موجودی نمایندگی جدید مربوط به سال مدل بعدی بود. کوین رابرتز، مدیر اطلاعات اقتصادی و بازار CarGurus، به Business Insider گفت که این گذار شبیه به دوره 2020 تا 2022 است، زمانی که صنعت با تعطیلی خطوط مونتاژ در دوران کووید و کمبود تراشه مواجه بود. او گفت که امسال متفاوت است و کمتر وجودی دارد، زیرا \"عوامل زیادی در کنار هم قرار گرفتند تا امسال چیزی منحصر به فرد خلق کنند.\" خودروهای با تیراژ بالا در حال حرکت هستند پرفروش‌ترین خودروی جنرال موتورز، سیلورادو، برای سال 2027 طراحی تازه‌ای پیدا می‌کند. محبوب‌ترین خودروهای شورولت آمریکا تا اواخر مهمانی 2027 نمایش داده می‌شوند. ارین کیتینگ، تحلیلگر اجرایی Cox Automotive، به Business Insider گفت که این روند عمدتاً به وسیله خودروهای نام‌های بزرگی است که در زمان‌های مختلف طرح‌های تازه‌تری دریافت می‌کنند. او گفت: «در چندین مورد، چیزی که شبیه کاهش سرعت در سطح برند به نظر می‌رسد، مدل‌های منفرد در حال چرخش هستند. مهم است که این را در کل مجموعه"}, {"source": "Business Insider", "title": "I'm in my 60s and can't find full-time work. I took Social Security early and filed for bankruptcy to stay afloat.", "link": "https://www.businessinsider.com/laid-off-job-market-search-60s-social-security-bankruptcy-ageism-2026-9", "summary": "Thomas Heep has struggled to land a full-time job for more than a year. Thomas Heep Thomas Heep was laid off last year and thinks age discrimination could be hindering his job search. He's working part time and collecting Social Security, but says he's just scraping by financially. Heep recently filed for bankruptcy and believes it was the right decision. This as-told-to essay is based on conversations with Thomas Heep, a job seeker in his 60s who lives in Denver. He was laid off in April 2025 and is still looking for full-time work. The following has been edited for length and clarity. I was laid off from my job as an operations manager on April 4, 2025. I've been looking for full-time work since then. I'm currently working part-time, delivering prescriptions to patients in the Denver area, and I started collecting Social Security in my 60s, before reaching my full retirement age of 67. Both combined aren't enough to pay all my bills. Earlier this year, I filed for Chapter 7 bankruptcy. I'm an only child and the last living member of my family. Not having a family to turn to definitely increases the pressure in a situation like mine. I recently had an in-person interview for a job that paid $20 an hour. I felt like the interview went well, and I'd be grateful to get the job. But there's always a part of you that thinks: I've worked all my life to maybe get to this. A $20-an-hour job. I feel like I'm basically starting at zero. The job search process feels broken My job search has been 99% online — LinkedIn, Indeed, Glassdoor, and stuff like that. Looking for work primarily online wasn't new to me, as I'd landed my last job only about a year before I was laid off. But this job search has felt different. I think the system is broken. First of all, so many of the companies I apply to don't respond at all. I started working during a time when you could just walk into a business, maybe they had a \"We're hiring\" sign, and you could talk to somebody right there. That doesn't happen anymore. You have to go online and fill everything out, with a very high chance you'll never hear back. It's such a process now, and I don't think it's as effective as people think. Companies can also easily get buried by résumés when they post a job opening. A decent-paying job in a stable field will get hundreds of applications. \"Work from home\" roles are worse. I've seen application numbers in the 2,000s and higher. How is anybody going to get through that number of applicants? I a", "date_str": "2026-09-14T09:13:01+00:00", "hash": "60854501de269573", "title_fa": "من در دهه 60 هستم و نمی توانم کار تمام وقت پیدا کنم. من زودتر از تامین اجتماعی استفاده کردم و برای سرپا ماندن ورشکستگی دادم.", "summary_fa": "توماس هیپ بیش از یک سال است که برای یافتن یک شغل تمام وقت تلاش کرده است. توماس هیپ توماس هیپ سال گذشته اخراج شد و فکر می کند تبعیض سنی می تواند مانع از جستجوی شغل او شود. او پاره وقت کار می کند و تامین اجتماعی را جمع آوری می کند، اما می گوید که فقط از نظر مالی در حال خراش است. هیپ اخیراً اعلام ورشکستگی کرده و معتقد است که این تصمیم درستی بوده است. این مقاله گفته شده بر اساس گفتگو با توماس هیپ، یک جویای کار در دهه 60 زندگی اش که در دنور زندگی می کند، است. او در آوریل 2025 اخراج شد و همچنان به دنبال کار تمام وقت است. موارد زیر برای طول و وضوح ویرایش شده است. من در 4 آوریل 2025 از شغلم به عنوان مدیر عملیات اخراج شدم. از آن زمان به دنبال کار تمام وقت هستم. من در حال حاضر به صورت پاره وقت کار می کنم و نسخه ها را به بیماران در منطقه دنور تحویل می دهم و در 60 سالگی شروع به جمع آوری تامین اجتماعی کردم، قبل از رسیدن به سن بازنشستگی کامل، یعنی 67 سالگی. اوایل امسال، من برای فصل 7 ورشکستگی ثبت نام کردم. من تک فرزند و آخرین عضو خانواده ام هستم. نداشتن خانواده ای که بتوان به آن مراجعه کرد قطعا فشار را در موقعیتی مانند من افزایش می دهد. من اخیراً یک مصاحبه حضوری برای کاری داشتم که ساعتی 20 دلار پرداخت می کرد. احساس می‌کردم که مصاحبه به خوبی پیش رفت، و اگر این کار را به دست بیاورم سپاسگزار خواهم بود. اما همیشه بخشی از شما وجود دارد که فکر می کند: من تمام زندگی ام را کار کرده ام تا شاید به این موضوع برسم. یک کار 20 دلاری در ساعت. احساس می کنم اساساً"}, {"source": "Business Insider", "title": "A legal AI startup has a plan to take on Lexis Nexis and Westlaw", "link": "https://www.businessinsider.com/legora-legal-research-duopoly-lexisnexis-westlaw-2026-9", "summary": "Legora CEO Max Junestrand. Legora Legora says it wants to collect the world's legal data as it deepens its presence in Big Law. The company has hired a team of former attorneys to build an index of legal research. The move puts the unicorn startup in closer competition with incumbents LexisNexis and Westlaw. Legora helped sell lawyers on artificial intelligence. Now it wants to keep bad law out of their files. In legal terms, a case is \"good law\" when a lawyer can still safely rely on it. It has not been overturned, superseded by a new statute, or undercut by a court decision. Getting that wrong can mean citing a rule that no longer applies: an embarrassing mistake at best, and one that could damage a client's case. To help it get there, Legora, one of the highest-valued and best-funded startups building tech for law firms and legal teams inside large companies, is growing its corpus of case law and other legal data. The company has quietly hired a team of former attorneys to collect the law in the jurisdictions it covers, then map how cases and statutes rank and relate to one another. Its push into legal research is chasing two goals. If Legora can link its software to a rich source of verified material, it could reduce the risk of \"hallucinations,\" or wrong information slipping into its system's outputs, said Melanie Brown, Legora's senior director of legal data. The second reason: Legora is fighting for a larger share of a market that has been controlled by a duopoly for decades. For most large firms, access to LexisNexis and Westlaw isn't a nice-to-have. Lawyers turn to these databases to look up cases or statutes, and to make sure the authorities they plan to cite are still good law. In recent years, both conglomerates have invested heavily in technology that can handle the drafting and analysis that follow that research. The quality of those tools is openly debated online — and in Legora's conversations with prospective customers. Brown, who worked at Rlex, which owns LexisNexis, before joining Legora earlier this year, said the frustration she hears most often is that firms feel forced to choose: access to the best legal data, or better technology. Legora's push into legal research aims to turn the Big Two into the Big Three. Melanie Brown, Legora s senior director of legal data, wants the entire legal universe to live on Legora. Legora The Swedish company has already struck licensing deals with \"tens\" of publishers around the world, including Wolte", "date_str": "2026-09-14T09:00:01+00:00", "hash": "622f234d3796200e", "title_fa": "یک استارت آپ قانونی هوش مصنوعی برنامه ای برای مقابله با Lexis Nexis و Westlaw دارد", "summary_fa": "مکس جونستراند، مدیرعامل لگورا. Legora Legora می‌گوید که می‌خواهد داده‌های حقوقی جهان را با افزایش حضور خود در Big Law جمع‌آوری کند. این شرکت تیمی از وکلای سابق را برای ایجاد فهرستی از تحقیقات حقوقی استخدام کرده است. این اقدام استارتاپ یونیکورن را در رقابت تنگاتنگی با شرکت‌های فعلی LexisNexis و Westlaw قرار می‌دهد. لگورا به فروش وکلا در زمینه هوش مصنوعی کمک کرد. حالا می خواهد قانون بد را از پرونده های آنها دور نگه دارد. از نظر حقوقی، یک پرونده زمانی «قانون خوب» است که یک وکیل همچنان بتواند با خیال راحت به آن تکیه کند. این قانون باطل نشده است، توسط یک اساسن bread dish from their native country, Georgia, for their social media channels and website. Penny's Coffee Shop would switch seasonal drinks every few months, and Endeladze would photograph the new items herself, and it would end up being a full-day event. \"You have to time it so the foam doesn't deflate,\" Endeladze explained to Business Insider. View this post on Instagram A post shared by Penny’s Coffee Shop (@pennys_coffeeshop) Then, one of the more artistically gifted baristas would create a chalkboard sign for the new drink menus or promotional specials. Over the years, there had been several employees skilled with lettering and design, and the duty had always rotated among them, always done in-house. But this fall, the aesthetically inclined barista who most recently chalked the signs had moved out of town, Endelaydsze said, and there was no one on staff at the moment who had the skill set to do a chalkboard. So Endelaydsze decided to get a poster printed up instead. She considered doing what she has done in the past: taking her own photos and editing them together with Canva. But with a newborn baby, she figured she could save herself some time and do it with AI. \"I felt like a genius, and made posters using AI and frame them,\" she told me. 'Not knowing how much damage it would cause my coffee shop.\" She used ChatGPT to make an image of the menu, and got the poster professionally printed up for around $150. She also bought a plastic poster holder that cost around $200. Then, she posted a photo of the new menu sign to Instagram. Very soon, the negative comments started rolling in: \"AI Slop.\" \"Really a shame honestly.\" \"Yikes.\" \"SHAME SHAME SHAME.\" Angry DMs, including a threat \"Penny's cus", "date_str": "2026-09-14T08:59:01+00:00", "hash": "71ce6f297c90d67d", "title_fa": "صاحب کافی شاپ از هوش مصنوعی برای تهیه پوستر منو استفاده کرد. سپس DM های عصبانی آمدند.", "summary_fa": "مگی اندلادزه، صاحب کافی شاپ پنی در بوفالو، نیویورک. کافی شاپ مگی اندلادزه eaders of the biggest AI companies publicly agreed that a slowdown is necessary China's spy chief just offered a window into Beijing's priorities when it comes to AI's biggest risks. Chen Yixin, China's minister of state security, published an article Sunday morning in China Cyberspace, a journal run by the Cyberspace Administration of China, the country's internet regulator. In it, Chen identified six major risks AI could pose to Beijing. The first was \"regime security.\" He wrote that \"various hostile forces and malicious individuals abuse generative AI technologies — such as deepfake audio and video, AI-generated images and text, and intelligent online armies — to produce political rumors at low cost and in large quantities.\" Those tools can \"spread harmful information, incite antagonistic emotions, and wage a war of public opinion and cognitive warfare,\" posing direct threats to China's political, institutional, and ideological security, he said. Chen also identified five other major AI risks, including: Dangers to China's critical infrastructure , because cyberattacks can be carried out with extreme efficiency, considering the power of models like Mythos. The risk of large-scale data leaks, where Chinese AI users and foreign intelligence agencies alike could obtain critical national data, trade secrets, or citizens' personal information. An imbalance in technological development caused by monopolies and closed technological systems, as countries can exploit AI's power and fragment supply chains in the name of national security. Challenges to social governance that lead to disruptions in public order. Fundamental shifts in warfare , as AI-powered precision targeting gives adversaries a major advantage on the battlefield. More regulation for the 'wellbeing of all humanity' Chen advocated for strong \"developmental guidelines\" for AI to be put in place — essentially, more government control of AI development. What that involves, per Chen, will be for Beijing to \"accelerate the construction of a security risk prevention and control system.\" China should promote the \"healthy and orderly development\" of AI through \"high-efficiency governance,\" Chen said. Chen also said AI should be developed \"with the wellbeing of all humanity a", "date_str": "2026-09-14T08:34:48+00:00", "hash": "997d601a07036de5", "title_fa": "رئیس اطلاعات چین به تازگی نگاهی آشکار به آنچه پکن در مورد هوش مصنوعی بیشتر از همه می ترسد ارائه داد", "summary_fa": "شی جین پینگ Evan Vucci-Pool/Getty Images رئیس جاسوسی چین نگاهی نادر به آنچه که پکن بزرگترین خطرات هوش مصنوعی می‌داند ارائه کرد. چن ییسین در مقاله‌ای در مجله‌ای که یکشنبه منتشر شد، شش خطر عمده هوش مصنوعی را برای چین شناسایی کرد. هشدار او در حالی است که رهبران بزرگ‌ترین شرکت‌های هوش مصنوعی علناً موافقت کردند که کاهش سرعت ضروری است. چن یی‌شین، وزیر امنیت دولتی چین، صبح یکشنبه مقاله‌ای را در نشریه China Cyberspace، مجله‌ای که توسط اداره فضای مجازی چین، تنظیم‌کننده اینترنت این کشور، اداره می‌شود، منتشر کرد. در آن، چن شش خطر عمده را که هوش مصنوعی می تواند برای پکن ایجاد کند، شناسایی کرد. اولین مورد «امنیت رژیم» بود. او نوشت که «نیروهای متخاصم مختلف و افراد بدخواه از فناوری‌های مولد هوش مصنوعی - مانند صدا و ویدیوی عمیق، تصاویر و متن‌های تولید شده توسط هوش مصنوعی و ارتش‌های آنلاین هوشمند - برای تولید شایعات سیاسی با هزینه کم و در مقادیر زیاد سوء استفاده می‌کنند.» او گفت که این ابزارها می توانند \"اطلاعات مضر را پخش کنند، احساسات متخاصم را تحریک کنند، و جنگ افکار عمومی و جنگ شناختی را به راه بیندازند\" که تهدیدی مستقیم برای امنیت سیاسی، نهادی و ایدئولوژیک چین است. چن همچنین پنج خطر عمده دیگر هوش مصنوعی را شناسایی کرد، از جمله: خطرات برای زیرساخت های حیاتی چین، زیرا با توجه به قدرت مدل هایی مانند Mythos، حملات سایبری را می توان با کارایی فوق العاده انجام داد. خطر نشت داده در مقیاس بزرگ، جایی که کاربران هوش مصنوعی چینی و آژانس های اطلاعاتی خارجی به طور یکسان می توانند داده های مهم ملی، اسرار تجاری یا اطلاعات شخصی شهروندان را به دست آورند. عدم تعادل در توسعه فناوری ناشی از انحصارها و سیستم های فناورانه بسته است، زیرا کشورها می توانند از قدرت هوش مصنوعی سوء استفاده کنند و"}, {"source": "Business Insider", "title": "We know more about Bryan Johnson and Kate Tolo than anyone in human history. But who are they?", "link": "https://www.businessinsider.com/bryan-johnson-kate-tolo-relationship-love-story-2026-9", "summary": "It s all there: primal, love, safety, connection, Bryan says of his sex life with Kate. The couple wants to become a model for how humans successfully co-evolve with AI. Chessa Subbiondo / Courtesy of Bryan Johnson and Kate Tolo As soon as they had sex on July 27, Bryan Johnson tells me, he knew his cofounder and girlfriend, Kate Tolo, was hours away from getting her period. Normally, the couple has sex two to three times a week, most often between 3 and 5 p.m. \"Too close to Bryan's bedtime\" — 8:30 p.m. — \"is a problem,\" says Kate, her knee touching Bryan's thigh on the couch, late afternoon sunlight dappling their pale cheeks. And it's electric, they tell me. \"It's all there: primal, love, safety, connection,\" Bryan says. \"I don't know what the stat is, but some substantial proportion of women never have an orgasm.\" Kate smiles. She is not among this substantial proportion. But on that day they hadn't had sex for some time, because Kate was really, really stressed. \"The highest stress levels I've ever seen her have,\" Bryan says. She was worried about all that it was going to take to become, as Bryan has put it, \"a female Bryan Johnson .\" You may have heard something about Bryan's body, willingly or not. Maybe it's how long his penis is erect each night — 4 hours and 2 minutes, which happens to be the exact length of Kenneth Branagh's film adaptation of \"Hamlet.\" Maybe it's the 2,250 calories Bryan ingests each day, a diet that includes 130 grams of protein , 30 vitamins and supplements (some of which he sells through his health optimization startup Blueprint), and something called nutty pudding, all of it consumed before he stops eating a continue, with some slight alterations, Moreno-Earle and other organizers said they never intended to cause a stir. In their view, they're only trying to ensure that humans remain relevant in a field AI is rapidly uprooting . \"As young mathematicians, we don't necessarily have some of the same luxuries that these older mathematicians do,\" Moreno-Earle said. \"We look to the future, and we don't even know if there's going to be grad school open positions by the time we get to Ph.D.\" The split between pioneering undergraduates and tenured professors over the use of AI is not limited to the math field, but the Caltech clash is especially relevant as American academia wrestles with technology that threatens to put them out of work. Math professors, for their part, told Business Insider that despite the alluring headlines, AI's work in math is often quick and dirty and requires hours of human - led research to make sense of the solutions. \"If the machine understands something new, then there is no progress,\" said Álvaro Lozano-Robledo, a professor at the University of Connecticut. \"The actual progress is when human knowledge advances.\" The mathathon Armed with their idea, Moreno-Earle and another undergraduate organizer shopped it around to various AI companies. They needed mass", "date_str": "2026-09-14T08:06:01+00:00", "hash": "89e0d11a104cb466", "title_fa": "درون تضاد نسلی بر سر هوش مصنوعی در ریاضیات: \"ما تجمل انتظار را نداریم\"", "summary_fa": "برگزارکنندگان دوره کارشناسی یک رویداد ریاضی هوش مصنوعی در Caltech در برابر تماس‌ها برای لغو این رویداد مقاومت کردند. آنها می گویند هرگز مهم تر از این نبوده است که بفهمیم انسان ها و هوش مصنوعی چگونه می توانند در ریاضیات با هم کار کنند. کریستینا هاوس/لس آنجلس تایمز از طریق گتی ایماژ یک رویداد ریاضی هوش مصنوعی Caltech توسط دانش آموزان با واکنش بیش از 700 دانشگاهی مواجه شد. OpenAI سپس پس از هشدار منتقدان درباره \"شیب هوش مصنوعی\"، حمایت مالی یک میلیون دلاری خود را متوقف کرد. سازمان دهندگان گفتند که ریاضیدانان جوان نمی توان s came to a tentative agreement — largely via posts on X — that some sort of slowdown is necessary to save humanity. While they were largely short on details regarding the mechanics of such a thing, and notable China has not weighed in, the American AI industry has reached an inflection point that could impact everything from your phone's chatbot to global politics. \"The stakes are too high for pacing to be an empty exercise — we need to use the time it gives us wisely,\" Anthropic CEO Dario Amodei wrote in an essay entitled \"We must pace the frontier,\" which was published on Saturday. OpenAI CEO Sam Altman , who has made similar calls in the past, agreed in an X post later that day. So did Elon Musk. Google DeepMind founder Demis Hassabis also offered his support for Amodei's proposals. Here's a look at what smart people are saying about the AI apocalypse and the methods the leaders of the leading AI labs say are necessary to stop it. David Sacks, a presidential advisor on science and tech David Sacks, former White House AI czar, expressed some skepticism over Anthropic s mythos warnings. Matt McClain/The Washington Post/Getty Images The Trump administration has repeatedly signaled disinterest in regulating AI development as it seeks to keep pace with China. David Sacks, a presidential advisor on science and tech and the former White House AI Czar, reiterated that stance on Saturday, with a bit of a twist. \"Dario has written that we need to 'pace the frontier,' and Sam has agreed. People may be surprised by my response: go ahead,\" Sacks wrote on X. \"But stop pretending you need anyone else's permission.\" Sacks browbeat OpenAI and Anthropic in his post, saying that the companies didn't want to slow down for altruistic reasons, but to gain favor in the markets. \"If yo", "date_str": "2026-09-14T07:38:54+00:00", "hash": "ad0ce55fd524e81f", "title_fa": "آنچه افراد باهوش در مورد آخرالزمان هوش مصنوعی می گویند و فراخوانی برای کاهش سرعت همه چیز دارند", "summary_fa": "سام آلتمن، مدیر عامل OpenAI و داریو آمودی، مدیر عامل آنتروپیک، این هفته توافق کردند که مانیتورهای ایمنی شخص ثالث را در شرکت های خود قرار دهند. رهبران هوش مصنوعی Getty Images در حال جمع آوری فراخوان هایی برای کاهش سرعت توسعه هوش مصنوعی مرزی به دلیل افزایش نگرانی های ایمنی هستند. داریو آمودی هشدار داد که انبوه هوش مصنوعی می تواند در عرض یک سال اینترنت را تسخیر کند. سام آلتمن، ایلان ماسک و دمیس حسابیس از تلاش آمودی برای حفاظت بیشتر حمایت کردند. امکان نابودی گونه‌ها وجود داشت، اما رهبران هوش مصنوعی این آخر هفته کاری قابل توجه انجام دادند: آنها به یک اجماع رسیدند. پس از هشدارهای جیکوب کوکسون، مهندس سابق آنتروپیک، در مورد یک آرماگدون هوش مصنوعی که طوفانی را در میان فناوران و سیاستمداران روشن کرد، رهبران پیشرفته‌ترین آزمایشگاه‌های هوش مصنوعی - عمدتاً از طریق پست‌هایی در X - به توافقی آزمایشی رسیدند که نوعی کاهش سرعت برای نجات بشریت ضروری است. در حالی که آنها تا حد زیادی از جزئیات مربوط به مکانیزم چنین چیزی کوتاهی می‌کردند، و چین قابل‌توجهی به آن توجه نکرده است، صنعت هوش مصنوعی آمریکا به نقطه عطفی رسیده است که می‌تواند همه چیز را از چت ربات تلفن شما گرفته تا سیاست جهانی تحت تأثیر قرار دهد. داریو آمودی، مدیر عامل آنتروپیک، در مقاله ای با عنوان «ما باید با سرعت پیش برویم» که روز شنبه منتشر شد، نوشت: «مخاطرات برای گام زدن خیلی زیاد است که یک تمرین خالی باشد - ما باید از زمانی که به ما می دهد عاقلانه استفاده کنیم. سام آلتمن، مدیر عامل OpenAI، که تماس های مشابهی در گذشته داشته است، در پست X اواخر همان روز موافقت کرد. ایلان ماسک هم همینطور. موسس Google DeepMind، Demis Hassabis نیز از پیشنهادات Amodei حمایت کرد. در اینجا نگاهی داریم به آنچه افراد باهوش در"}, {"source": "Business Insider", "title": "What smart people are saying about the '60 Minutes' relaunch", "link": "https://www.businessinsider.com/smart-people-reactions-60-minutes-relaunch-cbs-bari-weiss-2026-9", "summary": "CBS s 60 Minutes is back. Mark Seliger/CBS News via Getty Images CBS is back with the 59th season of \"60 Minutes.\" The show was on shaky ground in recent months, following a string of high-profile departures. Media pundits have thoughts on the first episode, released on Sunday. CBS premiered the 59th season of \"60 Minutes\" on Sunday, with familiar faces like Norah O'Donnell, Lesley Stahl, and Jon Wertheim. Sunday's episode included three main segments: an interview with a US Air Force Officer rescued from Iran, a segment about brokers offering felons paths to pardons from President Donald Trump at high cost, and a profile of the Los Angeles Rams. \"We don't often send notes to the whole newsroom. But today calls for it. It's a big moment for 60 Minutes and CBS,\" CBS leadership wrote in a memo to staff on Sunday to promote the latest season. The premiere follows a turbulent few months at \"60 Minutes,\" marked by high-profile exits , such as those of longtime correspondents Scott Pelley and Anderson Cooper, and staff discontent over editor in chief Bari Weiss' direction. Here's what smart people in media are saying about the new season. Brian Steinberg, Variety TV editor Brian Steinberg, a senior TV Editor for Variety, wrote in a Sunday article that the new season, which promised change, \"relied on many elements from the program's past.\" \"Viewers on Sunday night got only a brief glimpse of Ross Douthat, and none of Sebastian Junger, Gianna Toboni, Trevor Phillips or Ariel Levy, but were rather greeted by three correspondents who already have an association with the program,\" Steinberg wrote. Alex Marquardt, Al Jazeera English host Alex Marquadt, the former CNN chief national security correspondent and host of Al Jazeera English's \"This is America,\" wrote about the \"60 Minutes\" segment on X. \"The Pentagon rolled out the red carpet for this 60 Minutes piece: Sec Hegseth, Gen Caine, Adm Cooper + the weapons systems specialist all sat down with Norah O'Donnell,\" he wrote. Tim Miller, host of The Bulwark Podcast Tim Miller, a political commentator and host of The Bulwark Podcast, criticized one segment of Sunday's show hosted by Lesley Stahl: the story about brokers offering people who have committed felonies a path to receiving pardons from President Donald Trump at high cost. \"Doing a story about pardon abuse and making it about Burkman and Wohl is like doing a story about crypto corruption and focusing on Hawk Tuah girl,\" Miller wrote on X. \"Like yeah they are s", "date_str": "2026-09-14T07:09:54+00:00", "hash": "ef7a80d668a6eb1e", "title_fa": "آنچه افراد باهوش در مورد راه اندازی مجدد «60 دقیقه» می گویند", "summary_fa": "CBS s 60 Minutes بازگشته است. مارک سلیگر/اخبار سی‌بی‌اس از طریق گتی ایماژ سی‌بی‌اس با پنجاه و نهمین فصل «60 دقیقه» بازگشته است. این نمایش در ماه‌های اخیر، پس از یک رشته جدایی‌های مطرح، در وضعیت متزلزلی قرار داشت. کارشناسان رسانه در مورد قسمت اول که یکشنبه منتشر شد، نظراتی دارند. شبکه سی‌بی‌اس پنجاه و نهمین فصل «60 دقیقه» را یکشنبه با چهره‌های آشنا مانند نورا اودانل، لسلی استال و جان ورتهایم پخش کرد. اپیزود یکشنبه شامل سه بخش اصلی بود: مصاحبه با یک افسر نیروی هوایی ایالات متحده که از ایران نجات یافته بود، بخشی در مورد دلالانی که راه هایی را برای عفو رئیس جمهور دونالد ترامپ با هزینه های گزاف به جنایتکاران پیشنهاد می کردند، و نمایه ای از رمز لس آنجلس. رهبران CBS در یادداشتی به کارکنان روز یکشنبه برای تبلیغ آخرین فصل نوشتند: \"ما اغلب یادداشت هایی را برای کل اتاق خبر ارسال نمی کنیم. اما امروز به آن نیاز دارد. این یک لحظه بزرگ برای 60 Minutes و CBS است.\" اولین نمایش پس از چند ماه پرتلاطم در «60 دقیقه» انجام می‌شود، که با خروجی‌های برجسته‌ای مانند خروجی‌های قدیمی اسکات پلی و اندرسون کوپر، و نارضایتی کارکنان از کارگردانی باری وایس، سردبیر، مشخص شد. این چیزی است که افراد باهوش در رسانه ها در مورد فصل جدید می گویند. برایان اشتاینبرگ، سردبیر تلویزیون ورایتی برایان استاینبرگ، سردبیر ارشد تلویزیون ورایتی، در مقاله‌ای در روز یکشنبه نوشت که فصل جدید، که نوید تغییر را می‌داد، «بر عناصر بسیاری از گذشته برنامه تکیه داشت». اشتاینبرگ می‌نویسد: «بینندگان یکشنبه شب فقط نگاهی کوتاه به راس دوتات داشتند، و هیچ‌کدام از سباستین یونگر، جیانا توبونی، تروور فیلیپس یا آریل لوی هیچ‌کدام از آنها را دیدند، بلکه سه خبرنگاری که قبلاً با این برنامه ارتباط داشتند، مورد استقبال قرار گرفتند. الکس مارکوارت، مجری انگلیسی الجزیره الکس مارکادت، خبرنگار سابق"}, {"source": "Business Insider", "title": "All eyes are on what Trump and Xi will do amid grim warnings of an AI apocalypse. Here’s what they’ve said.", "link": "https://www.businessinsider.com/trump-xi-ai-apocalypse-warning-anthropic-openai-2026-9", "summary": "All eyes are on what Trump and Xi might do in response to grim warnings about AI. Alex Wong/Getty Images Fears of AI's apocalyptic capabilities have reached a fever pitch. Donald Trump and Xi Jinping, however, have yet to show that they're too concerned. Trump said people in AI are \"bringing up things that won't happen.\" In the face of a grim debate about an AI-fueled apocalypse, both President Donald Trump and Chinese leader Xi Jinping are locked in on keeping up the pace of AI progress, not slowing it down. Trump downplayed concerns about AI employees' warnings that AI could threaten humanity's existence during his visit to Ireland to watch the Irish Open. \"Whoever wins AI, wins,\" Trump told reporters on Sunday from his Doonbeg golf resort. \"And we can put guard rails, we can do this and that, but I think you have a lot of negative forces that are bringing it up that shouldn't be bringing it up, and they're bringing up things that won't happen,\" he added. Meanwhile, Xi has not directly commented on the AI doom-and-gloom yet. Instead, he said during a BRICS summit in New Delhi on Sunday that \"Global South\" countries — developing countries in Asia, Africa, and South America — should work faster to set global AI governance standards. \"We should take a people-centered approach, develop AI for the positive and for good, and work faster to evolve a consensus-based global AI governance framework, so that new technologies can light the way toward shared prosperity,\" Xi said in his speech on Sunday. He also said China would pioneer a BRICS open-source AI community that would support LLM development, host AI seminars, and build an open AI ecosystem. Trump and Xi are scheduled to meet on September 24 at the White House. Pacing the frontier The leaders' comments come as both OpenAI CEO Sam Altman and Anthropic CEO Dario Amodei have called for cooperation between the US and Chinese governments to pace and regulate the development of frontier AI models. Altman said in a Sunday interview with Fortune that Trump and Xi should get the Nobel Peace Prize if they can agree on shared rules on the safe development of AI. \"Even if just the US and China could agree on some shared standards and testing for development of this technology, I think that'd be a wonderful accomplishment that the two of them can deliver,\" Altman said. He didn't specify what those standards would look like, but said it wouldn't be hard to create, calling it akin to a \"one-page document.\" Amodei, in an ", "date_str": "2026-09-14T05:37:02+00:00", "hash": "f6d59697371e4e62", "title_fa": "همه نگاه‌ها به این است که ترامپ و شی در میان هشدارهای تلخ درباره آخرالزمان هوش مصنوعی چه خواهند کرد. در اینجا چیزی است که آنها گفته اند.", "summary_fa": "همه نگاه‌ها به این است که ترامپ و شی در واکنش به هشدارهای وحشتناک در مورد هوش مصنوعی چه کاری انجام دهند. Alex Wong/Getty Images ترس از قابلیت های آخرالزمانی هوش مصنوعی به اوج خود رسیده است. با این حال، دونالد ترامپ و شی جین پینگ هنوز نشان نداده اند که بیش از حد نگران هستند. ترامپ گفت که افراد در هوش مصنوعی \"چیزهایی را مطرح می کنند که اتفاق نمی افتد.\" در مواجهه با یک بحث تلخ در مورد آخرالزمان مبتنی بر هوش مصنوعی، هم دونالد ترامپ، هم رئیس‌جمهور چین و هم شی جین پینگ، رهبر چین، درگیر حفظ سرعت پیشرفت هوش مصنوعی هستند، نه کاهش آن. ترامپ در سفرش به ایرلند برای تماشای مسابقات آزاد ایرلند، نگرانی‌ها درباره هشدارهای کارکنان هوش مصنوعی مبنی بر اینکه هوش مصنوعی می‌تواند موجودیت بشریت را تهدید کند، کم اهمیت جلوه داد. ترامپ روز یکشنبه از استراحتگاه گلف خود در دونبگ به خبرنگاران گفت: «هرکسی که هوش مصنوعی برنده شود، برنده است. او افزود: «و ما می‌توانیم نرده‌های محافظ بگذاریم، می‌توانیم این و آن را انجام دهیم، اما من فکر می‌کنم شما نیروهای منفی زیادی دارید که آن را مطرح می‌کنند که نباید آن را مطرح کنند، و آنها چیزهایی را مطرح می‌کنند که اتفاق نمی‌افتد». در همین حال، شی هنوز به طور مستقیم در مورد نابودی و غم هوش مصنوعی اظهار نظر نکرده است. در عوض، او در جریان نشست بریکس در دهلی نو در روز یکشنبه گفت که کشورهای \"جنوب جهانی\" - کشورهای در حال توسعه در آسیا، آفریقا و آمریکای جنوبی - باید سریعتر برای تعیین استانداردهای جهانی حکمرانی هوش مصنوعی تلاش کنند. شی در سخنرانی روز یکشنبه خود گفت: «ما باید رویکردی مردم محور داشته باشیم، هوش مصنوعی را برای مثبت و خوب توسعه دهیم، و سریعتر برای ایجاد چارچوب حکمرانی جهانی هوش مصنوعی مبتنی بر اجماع تلاش کنیم"}, {"source": "Business Insider", "title": "I moved my family from Utah to Thailand to work remotely. 8 months later, we came home.", "link": "https://www.businessinsider.com/moved-to-asia-with-toddler-back-utah-usa-visa-mistake-2026-9", "summary": "Braydon Barrett moved to Asia with his family in 2024. Eight months later, they decided to move back home to Utah. Provided by Braydon Barrett. Braydon Barrett left Utah for Asia with his wife and their young son in 2024. They set out to build a long-term life in Thailand , but one mistake sent their plans in an unexpected direction. The move gave them a new perspective on what it takes to build a life abroad. This as-told-to essay is based on a conversation with Braydon Barrett, 32, who moved to Asia with his family in 2024 but moved back to Utah eight months later. It's been edited for length and clarity. Living abroad was never really on my radar until I got married. My wife had always wanted to travel and live outside the US, and as I looked into it more, it started to feel like an experience we should try together. We talked about it for years, but never followed through. Then, after our son was born in 2023, we felt it was the right time to finally give it a try. My wife is a stay-at-home mom, and since I run an online fitness coaching business , I could work remotely. Barrett runs an online fitness coaching business, so he was able to work remotely from Asia. Provided by Braydon Barrett. I spent a long time researching where we could go, and Thailand seemed the most feasible in terms of visa options. We did a 10-day scouting trip to Thailand to figure out where we wanted to live, and to get a sense of what life there was actually like. In the end, we decided to settle in Pattaya, about a two-hour drive from Bangkok. Back in Utah, we didn't own any property, so it was easy for us to move. We got rid of most of our belongings, kept some in a storage unit, and packed the rest into six suitcases. Barrett and his wife did a 10-day scouting trip in Thailand to decide where they wanted to live. Provided by Braydon Barrett. On the day our son turned one in April 2024, we said our goodbyes and hopped on the plane. Our plans unraveled at the airport When we arrived in Thailand, I realized I'd made a major mistake with our visas. I had thought we would have 90 days in Thailand to sort out a longer-term option, but we only had 30 days. We had planned to stay in Thailand indefinitely, so suddenly having to figure out where to go next was overwhelming. We spent the next few weeks trying to see if we could make a longer-term visa situation work. When that wasn't possible, we decided to go to Malaysia, where we could stay for three months. Near the end of our time ", "date_str": "2026-09-14T01:49:57+00:00", "hash": "b8a0f2cf202e7c6a", "title_fa": "من خانواده ام را از یوتا به تایلند نقل مکان کردم تا از راه دور کار کنم. 8 ماه بعد اومدیم خونه.", "summary_fa": "برایدون بارت در سال 2024 با خانواده اش به آسیا نقل مکان کرد. هشت ماه بعد، آنها تصمیم گرفتند به خانه خود در یوتا نقل مکان کنند. ارائه شده توسط Braydon Barrett. برایدون بارت در سال 2024 به همراه همسر و پسر کوچکشان یوتا را به مقصد آسیا ترک کرد. آنها تصمیم گرفتند تا زندگی طولانی مدتی را در تایلند بسازند، اما یک اشتباه نقشه های آنها را به سمت و سویی غیرمنتظره سوق داد. این حرکت به آنها دیدگاه جدیدی در مورد آنچه برای ساختن زندگی در خارج از کشور نیاز است داد. این مقاله گفته شده بر اساس گفتگو با برایدون بارت 32 ساله است که در سال 2024 با خانواده اش به آسیا نقل مکان کرد اما هشت ماه بعد به یوتا بازگشت. برای طول و وضوح ویرایش شده است. زندگی در خارج از کشور تا زمانی که ازدواج کردم هرگز در رادار من نبود. همسرم همیشه دوست داشت به خارج از ایالات متحده سفر کند و زندگی کند، و وقتی بیشتر به این موضوع نگاه کردم، احساس کردم تجربه‌ای است که باید با هم تجربه کنیم. ما سال ها در مورد آن صحبت کردیم، اما هرگز دنبال نکردیم. سپس، پس از به دنیا آمدن پسرمان در سال 2023، احساس کردیم که زمان مناسبی است تا در نهایت آن را امتحان کنیم. همسر من یک مادر خانه نشین است و از آنجایی که من یک تجارت آنلاین مربی تناسب اندام را اداره می کنم، می توانم از راه دور کار کنم. بارت یک تجارت آنلاین مربی تناسب اندام را اداره می کند، بنابراین او توانست از راه دور از آسیا کار کند. ارائه شده توسط Braydon Barrett. من مدت زیادی را صرف تحقیق کردم که کجا می توانیم برویم، و تایلند از نظر گزینه های ویزا عملی ترین به نظر می رسید. ما یک سفر پیشاهنگی 10"}, {"source": "Business Insider", "title": "Turns out you really do only have to ask: Trump says he will remove tariffs on Irish whiskey after visit to Ireland", "link": "https://www.businessinsider.com/trump-irish-whiskey-tariffs-2026-9", "summary": "President Donald Trump said on Sunday that he would lift a tariff on Irish whiskey. Andrew Harnik/Getty Images Sometimes you just have to ask, as they say. Trump said Sunday he would lift a 10% tariff on Irish whiskey. The president said he made the decision after the Irish prime minister and a golfer asked him to. Well, that was easy. President Donald Trump on Sunday said he would remove tariffs on Irish whiskey after golfer Shane Lowry and the Irish prime minister did the unthinkable: They asked him. \"Everybody's been bugging me,\" the president said during remarks at the Irish Open. \"They're saying, can you do me a favor? It's so unfair what's going on.\" The crowd cheered wildly after the president said he would lift the tariff, which sits at 10%. Ireland's national public broadcaster said last year that about 45% to 50% of Irish whiskey is exported to the United States, making the US its biggest export market. In May, the Irish whiskey association said the tariffs on whiskey should be removed. \"Reducing the tariff for Irish drinks would benefit the many US companies who have Irish premium products in their portfolio,\" the association said in a press release. \"It would avoid uncertainty for the US consumer and strengthen the cask trade in Kentucky, Tennessee and other US states.\" Trump placed the 10% tariff in February as part of his temporary global tariff on most imports. Popular Irish whiskey brands include Jameson, Bushmills, Tullamore D.E.W., and Redbreast. Trump's tariff policies in his second term have upended markets, thrown business for a loop, and strained relations with long-standing allies, most recently Canada . They've also landed his administration in legal trouble. Trump has said the tariffs are meant to rebalance what he calls unfair trade relations, jump-start American industry, and give the US leverage in international negotiations, like border security and drug trafficking. Read the original article on Business Insider", "date_str": "2026-09-13T21:27:53+00:00", "hash": "16f21f6190291ee8", "title_fa": "معلوم شد واقعاً فقط باید بپرسید: ترامپ می گوید پس از سفر به ایرلند تعرفه های ویسکی ایرلندی را حذف خواهد کرد.", "summary_fa": "دونالد ترامپ، رئیس جمهور آمریکا روز یکشنبه گفت که تعرفه ویسکی ایرلندی را لغو خواهد کرد. اندرو هارنیک/گتی ایماژ گاهی اوقات به قول خودشان فقط باید بپرسید. ترامپ روز یکشنبه گفت که تعرفه 10 درصدی بر ویسکی ایرلندی را لغو خواهد کرد. رئیس جمهور گفت که پس از درخواست نخست وزیر ایرلند و یک گلف باز از او این تصمیم را گرفته است. خوب، این آسان بود. دونالد ترامپ، رئیس جمهور آمریکا روز یکشنبه گفت پس از اینکه شین لوری گلف باز و نخست وزیر ایرلند کارهای غیرقابل تصوری را انجام دادند، تعرفه های ویسکی ایرلندی را حذف خواهد کرد: آنها از او پرسیدند. رئیس جمهور در جریان اظهارات خود در مسابقات آزاد ایرلند گفت: «همه مرا مورد آزار و اذیت قرار دادند. آنها می گویند، می توانید به من لطفی کنید؟ پس از اینکه رئیس جمهور گفت که تعرفه را که 10 درصد است، لغو خواهد کرد، جمعیت به شدت تشویق کردند. پخش عمومی ملی ایرلند سال گذشته اعلام کرد که حدود 45 تا 50 درصد ویسکی ایرلندی به ایالات متحده صادر می شود و این امر ایالات متحده را به بزرگترین بازار صادراتی خود تبدیل می کند. در ماه مه، انجمن ویسکی ایرلندی اعلام کرد که تعرفه های ویسکی باید حذف شود. این انجمن در بیانیه ای مطبوعاتی گفت: کاهش تعرفه برای نوشیدنی های ایرلندی به نفع بسیاری از شرکت های آمریکایی است که محصولات درجه یک ایرلندی را در کارنامه خود دارند. \"این امر از عدم اطمینان برای مصرف کننده آمریکایی جلوگیری می کند و تجارت چلیک در کنتاکی، تنسی و سایر ایالت های ایالات متحده را تقویت می کند.\" ترامپ در ماه فوریه تعرفه 10 درصدی را به عنوان بخشی از تعرفه موقت جهانی خود بر بیشتر کالاهای وارداتی وضع کرد. برندهای معروف ویسکی ایرلندی عبارتند از: Jameson، Bushmills، Tullamore D.E.W.، و Redbreast. سیاست‌های تعرفه‌ای ترامپ"}, {"source": "Business Insider", "title": "Read the memo: CBS News leadership is selling staffers on '60 Minutes' as it relaunches under Bari Weiss", "link": "https://www.businessinsider.com/cbs-news-60-minutes-relaunch-employee-memo-bari-weiss-2026-9", "summary": "This season s 60 Minutes correspondents: Lesley Stahl, Bill Whitaker, Jon Wertheim, Norah O Donnell, and Ross Douthat, with contributors Matt Gutman, Sebastian Junger, Gianna Toboni, Trevor Phillips, and Ariel Levy. Mark Seliger/Mark Seliger/CBS News CBS News is building anticipation for \"60 Minutes\" as it relaunches under Bari Weiss. Weiss and top producer Nick Bilton brought back longtime correspondents and landed Ross Douthat. Read the full memo the newsroom leaders sent to staff celebrating the show's relaunch. CBS News is getting employees hyped about the first full season of \"60 Minutes\" under top editor Bari Weiss , months after a string of high-profile exits. \"We don't often send notes to the whole newsroom. But today calls for it. It's a big moment for 60 Minutes and CBS,\" newsroom leaders, including Weiss, wrote about the new \"60 Minutes\" season in a memo sent to staffers on Sunday. The memo teases an interview — that \"everyone has been chasing\" — with a US Air Force officer who was rescued from Iran in April. The 59th season of \"60 Minutes\" will have 10 regular contributors, including five correspondents: Lesley Stahl, Bill Whitaker, Jon Wertheim, Norah O'Donnell, and Ross Douthat, who joined CBS from The New York Times in July. \"60 Minutes\" is kicking off its highly anticipated season following a turbulent early-summer stretch for the storied news program. Lead producer Nick Bilton , who was handpicked by Weiss in May, started his tenure by firing longtime correspondent Scott Pelley after a noisy confrontation in front of \"60 Minutes\" staffers. Pelley had publicly questioned Bilton's qualifications, pressed his new boss on why fellow correspondents Cecilia Vega and Sharyn Alfonsi were let go, and accused Weiss of \"murdering\" the iconic Sunday night telecast while trying to \"kill\" CBS News. Weiss later addressed the firing , telling staffers she's \"only interested in working in a newsroom that is built on trust and mutual respect.\" Bilton told \"60 Minutes\" employees that his first week had been \"a trying and difficult few days.\" Veteran correspondents Whitaker, Wertheim, and Stahl — who's been with \"60\" since 1991 — decided to return to the program , saying that they \"don't want to see 60 Minutes die.\" They said they're \"working to build trust\" with Bilton and \"heard all the right things\" in his memo. \"If we can continue doing the work that made this show what it is — committing acts of independent, fearless journalism and storytelling — we're h", "date_str": "2026-09-13T17:16:42+00:00", "hash": "f10a5f7eda2f744f", "title_fa": "یادداشت را بخوانید: رهبری سی‌بی‌اس نیوز در «60 دقیقه» کارمندان خود را s out humanity has nothing to worry about. Palantir cofounder Joe Lonsdale said Sunday the world \"is going to be alright, guys.\" His comments came as top AI leaders warn that advanced systems could pose grave risks. Everything's fine! Take it from the cofounder of Palantir. In an X post on Saturday, Joe Lonsdale brushed aside the salient worry that advanced AI systems could cause mass human extinction , a concern that numerous engineers and leaders from frontier AI labs have raised in recent days and weeks. \"The world is going to be alright, guys,\" Lonsdale said. \"Leaders have big responsibilities and challenges ahead, but it doesn't help to scare everyone. We are on top of it.\" That's unlikely enough to calm the nerves of a human population that's been repeatedly told that AI could take control and do all manner of untoward things, including taking everyone's jobs . After Anthropic engineer Jacob Coxon quit the company this week and issued dire warnings that frontier AI companies like Anthropic and OpenAI are \"gambling with our lives,\" numerous leaders echoed his concern in posts and essays. On Saturday, Anthropic CEO Dario Amodei said in a blog post that AI swarms could soon take over the entire internet. He called for more stringent safety regulations and a global, coordinated slowdown on AI development. SpaceX CEO Elon Musk, OpenAI CEO Sam Altman, Google DeepMind founder Demis Hassabis, and Hugging Face CEO Clément Delangue all said they agreed with Amodei. Lonsdale? Not so much. Lonsdale is a famously conservative contrarian. He founded the University of Austin in 2021 alongside now-CBS News editor Bari Weiss, which counts \"the unhindered pursuit of truth without cancel culture\" as one of its core principles. \"It's not as much about the politics as it was about being contrarian. I've always relished standing out from the crowd, standing up and disagreeing with everyone,\" he once told Business Insider in a 2017 interview. The company he helped found زدیل یک مخالف محافظه کار معروف است. او دانشگاه آستین را در سال 2021 در کنار باری وایس، سردبیر کنونی CBS News تأسیس کرد، که «تعقیب بدون مانع"}, {"source": "Business Insider", "title": "I'm 45 and spent months trying to find a new corporate job. Now I'm delivering food to support my 2 kids.", "link": "https://www.businessinsider.com/corporate-executive-job-search-food-delivery-single-mom-2026-9", "summary": "Camila Valim is delivering food to provide for her kids after a corporate career. Courtesy of Camila Valim Camila Valim spent two decades in corporate marketing before becoming a consultant. Valim spent eight months job hunting after her latest contract ended and landed only two interviews. As a single mom, Valim started delivering food by e-bike while pursuing her next career move. This as-told-to essay is based on a conversation with Camila Valim. It has been edited for length and clarity. I spent two decades in corporate as head of marketing for an entertainment group. I left that job due to burnout. I pivoted to becoming a professional organizer and started a successful Instagram account and business. Then I got divorced five years ago and had to return to the corporate world . I went back to what I knew, working as a marketing consultant. My contract ended eight months ago. I expected it, but the job search to find a new marketing client has been tough. I've only had 2 interviews In eight months, I've only had two interviews. I've been carrying my whole household as a single parent and sole provider for two kids, ages 9 and 12. I got very far in an interview process a few weeks ago for a head of brand and communications position. It felt like my last lifeline. I told myself, \"OK, when I get this job, I'll be able to keep my lifestyle as it is; I won't have to sell my house.\" I was picking my kids up at school when I got the call that they loved me, but someone else got the job. Camila Valim s reel about working delivering food after a corporate career went ned more attention last week after a viral tweet from a f ormer Anthropic employee, warning of a greater than 10% human extinction risk. Historically, the New York Stock Exchange has won many of the largest listings, but Nasdaq has remained strong in tech, with large listings including Cerebras and Rivian. Listings on its exchange a prerequisite for inclusion in the Nasdaq 100 Index. In terms of how Anthropic ultimately trades, this decision likely matters little. There isn't a definitive answer on whether companies perform better on one exchange versus another. One key difference between the exchanges concerns market-maker mechanics. They have different processes for determining the opening price on the first day of trading, and high-volume IPOs can cause delays and confusion. Nasdaq experienced technical issues on the first day of Facebook's 2012 IPO. Anthropic's IPO filing has not yet been made public, but the company will need to release its financials at least 15 days before it begins its investor road show. Have a tip? Contact Katie Roof via email at kroof@businessinsider.com or Signal at @kroof.26 Read the original article on Business Insider", "date_str": "2026-09-13T16:01:38+00:00", "hash": "3102b3b6f54e99f4", "title_fa": "Anthropic Nasdaq را برای فهرست IPO خود انتخاب کرده است", "summary_fa": "داریو آمودی، مدیرعامل آنتروپیک بلومبرگ/گتی ایماژ آنتروپیک Nasdaq را برای عرضه اولیه سهام آتی خود انتخاب کرده است، پس از فهرست اخیر SpaceX در بورس، موفقیت IPO فناوری Nasdaq همچنان ادامه دارد و سلطه تاریخی NYSE در فهرست های بزرگ را به چالش می کشد. طرح‌های عرضه اولیه سهام آنتروپیک در میان بحث‌های مربوط به خطرات امنیتی هوش مصنوعی، که توسط کارکنان سابق آنتروپیک رهبری می‌شود، ظاهر می‌شوند. به گفته یک فرد آشنا با برنامه های آنتروپیک، نزدک را برای عرضه اولیه اولیه سهام بالقوه خود انتخاب کرده است. به گفته یکی از افراد آشنا، این شرکت که فهرست ماه اکتبر را هدف قرار داده است، به نزدک یک پیروزی بزرگ دیگر داده است. نزدک در اوایل سال جاری فهرست مورد علاقه SpaceX را تضمین کرد. ارزش ا fore we became a couple. Today, we run an online business together , which allows us to work remotely and travel regularly between our countries. Because we both have children from previous marriages, neither of us plans to move countries anytime soon. There are challenges, but I feel like I get the best of both worlds In my experience, Canada has a more relaxed pace. Catherine Collins As an American, I've gotten used to certain apps, tools, and conveniences that I can't access in Canada. For example, Canada doesn't have Venmo or Cash App, so Andrew and I split costs or pay each other back using Wise. If we start a movie on Hulu, we can only watch it when we're in the States, since the streaming service isn't available in Canada. As inconvenient as that can be, I often feel like I get the best of both worlds. Take food, for instance: Andrew looks forward to getting Chick-fil-A when he visits me, because there isn't a location in Winnipeg. (Although the chain does exist in some bigger Canadian cities, like Toronto.) And, though we have A W here in the US, it doesn't have poutine on the menu, which is the unofficial Canadian national dish . So, I always make sure to order that when I visit him. I've found that the pace and culture feel very different in both places, too. As someone who's been self-employed for almost 15 years, I appreciate being able to surround myself with other motivated entrepreneurs whenever I'm here. In Winnipeg and other Canadian cities I've visited, though, I've been able to slow down more. The pace feels more relaxed, and I often think of Canada as my safe haven. In the future, we might choose both We ", "date_str": "2026-09-13T15:49:01+00:00", "hash": "2529dce58f9ea020", "title_fa": "من و شریکم زندگی خود را بین ایالات متحده و کانادا تقسیم کردیم - و قصد نداریم فقط یک مکان را انتخاب کنیم", "summary_fa": "احساس می کنم می توانم از بهترین نقاط ایالات متحده و کانادا لذت ببرم. کاترین کالینز شریک زندگی من در کانادا زندگی می کند، و من در ایالات متحده reen down, you had to swipe down on the bottom of the display. Credit: Lifehacker Reviewing these things now, it all seems so obvious, even second nature. Nearly another decade has passed since we published that story, and by now, most iOS users are accostumed to a Home button-free life. But looking through the comments on this nearly decade-old piece, it's clear the transition was anything but smooth. One user complained about how smartphone gestures were making everything more confusing. Another bemoaned how switching between their iPhone and iPad meant jumping between two different gesture systems. Fast forward to 2026, and it's near impossible to imagine going back. Apple didn't immediately stop making iPhones with Home buttons it also released the iPhone 8 and 8 Plus the same year as the iPhone X but the writing was on the wall. Soon after, only the SE line shipped with the old design, a", "date_str": "2026-09-14T13:00:00+00:00", "hash": "09b4ed3da1442e7f", "title_fa": "آیفون X به معنای واقعی کلمه نحوه استفاده ما از دستگاه هایمان را تغییر داد", "summary_fa": "به مجموعه جدیدی به نام Apple a Day خوش آمدید، جایی که سایت‌های خانواده CNET هر روز از هم اکنون تا اواخر سپتامبر، بخش‌هایی از محتوای اپل را از آرشیوهای ما، مقاله، بررسی و/یا ویدیو به اشتراک می‌گذارند. علاوه بر Lifehacker، این مجموعه شامل قطعاتی از سایت‌های خواهر و برادر ما PCMag، Mashable، CNET و Popular Science خواهد بود. تا سال 2017، برخی از ما به مدت 10 سال از آیفون‌ها استفاده می‌کردیم و یک دهه تمام حافظه عضلانی ایجاد می‌کردیم، همه اینها بر اساس دکمه Home بود. برای رفتن به خانه یک بار فشار دهید. دوبار فشار دهید تا تغییر دهنده برنامه باز شود. برای فراخوانی سیری طولانی فشار دهید. دکمه پاور را پشت سر هم فشار دهید تا اسکرین شات بگیرید: این اقدامات به قدری ذاتی شدند که حداقل تا زمانی که دکمه Home ناپدید نشد، دو بار به استفاده از آنها فکر نکردید. این سالی بود که اپل آیفون X را عرضه کرد و اساسی‌ترین تغییر دستگاه را از اولین نسخه آن به نمایش گذاشت. (شاید امسال آیفون Duo از آن پیشی گرفته باشد.) امروز فکر کردن به
