    .footer-actions-right {

    .news-link {

      font-weight: 600;
      transition: color 0.2s ease;

      text-decoration: underline;

    .modal-overlay {

      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;

    .modal-overlay.active {

    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;

      max-height: 80vh;

      justify-content: space-between;

    @media (max-width: 640px) {

      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

  <script>

ان، گفته است که برای تغییر دکترین هسته‌ای تصمیم جدیدی گرفته‌ نشده است اما ادامه داده که ملت ایران «دارای مطالباتی است.» سرلشکر محسن رضایی، به تلویزیون ایران گفته است «هنوز در دولت، در حکومت تصمیم جدیدی گرفته نشده. البته این بحث الان مطرح است که اگر دوباره جنگ بشود، آیا ما می‌خواهیم همان دکترین سابق را داشته باشیم یا نداشته باشیم ولی هیچ تصمیم جدیدی به صورت رسمی و حکومتی گرفته نشده است.» در ادبیات سیاسی و موضوعات مرتبط با اشاعه تسلیحات هسته‌ای، بازنگری در دکترین هسته‌ای عموما به معنای تغییر سیاست با هدف دستیابی به سلاح اتمی است. آقای رضایی در اظهارات تازه خود گفته است «ملت ایران دارای مطالباتی است. دنبال یک منطقی هستند. بالاخره آنها می‌بینند دشمن آمده تمام مراکز هسته‌ای ما رو زده است. خب به چه دلیل زده؟ ما که به تمام بازرسی‌های آژانس ما پاسخ مثبت دادیم. در تمام سایت‌های ما دوربین داشتند. وقتی مردم اینها را می‌بینند قاعدتاً خواسته‌شان از ما این است که برای چه می‌خواهید این وضع را ادامه بدهید.» یک روز پیش از این محمدجواد حاج‌علی‌اکبری، امام جمعه موقت تهران، در خطبه های نماز جمعه خواستار بازنگری در دکترین هسته‌ای جمهوری اسلامی ایران شده بود. او گفته بود «این موضوع واکنشی شتاب‌زده و هیجانی نیست، بلکه برآمده از آگاهی و تجربه تاریخی ملت ایران در مواجهه با بدعهدی‌های آمریکاست و ریشه در حق ملت برای برخورداری از امنیت و زندگی عزتمندانه دارد.»ش منتشر نشده است. ایران تاکنون هدف از برنامه اتمی خود را صلح آمیز اعلام کرده است اما کشورهای غربی و آژانس بین‌المللی انرژی اتمی خواهان شفافیت درباره آن هستند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. دوره مدیرکلی آقای گروسی با پس خروج آمریکا از توتفق اتمی برجام همزمان", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/78c0/live/5c940220-d55b-11f1-b937-61b94454a4cf.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۹ آبان • ۲۲:۲۶"}, {"source": "Iran International", "title": "ادامه مذاکرات در قطر در سایه تهدیدهای متقابل و افزایش احتمال جنگ در روزهای آینده", "link": "https://www.iranintl.com/202610312639", "sum ی در تحولات منطقه گفت بی‌ثباتی در لبنان ناشی از حمایت تهران از حزب‌الله است، حملات به عربستان سعودی به حمایت ایران از حوثی‌ها ارتباط دارد و شبه‌نظامیان مورد حمایت جمهوری اسلامی در عراق نیز حکومت این کشور را به چالش می‌کشند. او افزود: «به هر طرف که نگاه کنید، یکی از نیروهای نیابتی ایران را می‌بینید که صلح و ثبات خاورمیانه را تضعیف می‌کند.» روبیو همچنین با اشاره به سرکوب اعتراضات در ایران، جمهوری اسلامی را حکومتی توصیف کرد که مردم خود را قتل‌عام", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B4_Enbw__v1024x512__box_0%2C204%2C2048%2C1280.jpeg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۹ آبان • ۲۱:۰۴"}, {"source": "Euronews Persian", "title": "مسئول سیاست خارجی اتحادیه اروپا: لاوروف در نشست‌های گروه ۲۰ «دروغ‌های زیادی» گفت", "link": "https://parsi.euronews.com/2026/10/31/eu-foreign-policy-chief-lavrov-told-many-lies-at-g20-meetings", "summary": "کایا کالاس، سرگئی لاوروف، را متهم کرد که در جریان گفت‌وگوهای روز جمعه با وزیران گروه جی۲۰ «دروغ‌های زیادی» مطرح کرده است. اد میلیبند، وزیر امور خارجه بریتانیا نیز گفت در نشست عمومی به لاوروف گفته است که «او باید شجاعت داشته باشد به پوتین بگوید روسیه این جنگ را نخواهد برد».", "date_str": "2026-10-31T17:04:26+00:00", "hash": "2c870eb9918126cc", "title_fa": "مسئول سیاست خارجی اتحادیه اروپا: لاوروف در نشست‌های گروه ۲۰ «دروغ‌های زیادی» گفت", "summary_fa": "کایا کالاس، سرگئی لاوروف، را متهم کرد که در جریان گفت‌وگوهای روز جمعه با وزیران گروه جی۲۰ «دروغ‌های زیادی» مطرح کرده است. اد میلیبند، وزیر امور خارجه بریتانیا نیز گفت در نشست عمومی به لاوروف گفته است که «او باید شجاعت داشته باشد به پوتین بگوید روسیه این جنگ را نخواهد برد».", "image_url": "https://images.euronews.com/articles/stories/09/97/48/85/1200x675_cmsv2_81caeb96-7787-5aa3-a447-1ef7077511cb-9974885.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۹ آبان • ۲۰:۳۴"}, {"source": "Euronews Persian", "title": "مجله خبری| ۹ آبان ۱۴۰۵ (۳۱ اکتبر ۲۰۲۶) - شامگاهی", "link": "https://pars  هرگونه توافق باید نگرانی‌های امنیتی آمریکا را برطرف کند. وزیر خارجۀ آمریکا می‌گوید دونالد ترامپ هنوز تصمیمی دربارۀ ازسرگیری عملیات نظامی علیه ایران نگرفته و واشینگتن همچنان برای دستیابی به راه‌حلی دیپلماتیک آمادگی دارد. مارکو روبیو روز شنبه نهم آبان در یک نشست خبری در حاشیۀ اجلاس وزیران خارجۀ گروه ۲۰ در شهر آتلانتا گفت نمی‌داند آیا جدول زمانی مشخصی برای مذاکرات با میانجی‌گری قطر با هدف پایان دادن به درگیری‌ها میان ایران و آمریکا تعیین شده است یا نه. او تأکید کرد که گفت‌وگوها میان دو طرف هرگز به‌طور کامل متوقف نشده و تماس‌های فعالی، گاه به‌صورت مستقیم و بیشتر از طریق میانجی‌ها، در جریان بوده است. وزیر خارجۀ آمریکا گفت ترجیح دونالد ترامپ حل‌وفصل اختلافات از راه‌های دیپلماتیک و مسالمت‌آمیز است، هرچند به گفتۀ او برخی مسائل جهان را نمی‌توان از این راه حل کرد. روبیو افزود: «اگر راه‌حل دیپلماتیکی وجود داشته باشد، ما از آن استقبال می‌کنیم، اما روشن است که چنین راه‌حلی نباید امنیت ملی ما را به خطر بیندازد یا نگرانی‌های اساسی ما را که در ابتدا موجب ورودمان به این درگیری شد، نادیده بگیرد». او یکی از نگرانی‌های اصلی واشینگتن را تلاش جمهوری اسلامی برای دستیابی به سلاح هسته‌ای عنوان کرد و گفت دولت ترامپ هرگز اجازه نخواهد داد ایران به چنین سلاحی دست یابد. این اظهارات در حالی بیان می‌شود که عباس عراقچی، وزیر خارجۀ ایران، روز شنبه در گفت‌وگو با شبکۀ الجزیره اعلام کرد تهران فعلاً نیازی به دیدار با مقام‌های آمریکایی نمی‌بیند و تنها پس از موافقت واشینگتن با شروط جمهوری اسلامی، دربارۀ مستقیم یا غیرمستقیم بودن مذاکرات تصمیم خواهد گرفت. عراقچی همچنین تأیید کرد که هیئتی ایرانی برای ادامۀ رایزنی‌ها به دوحه اعزام شده است.", "image_url": "https://gdb.rferl.org/7713b4e1-99e9-46fd-b0a4-ad692e3ee8b9_cx6_cy5_cw89_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۹ آبان • ۲۱:۰۳"}, {"source": "IranWire", "title": "اموال مالک آموزشکده اینورس به‌ اتهام «اهانت به شیعیان» مصادره می‌شود", "link": "https://iranwire.com/fa/news-1/159628-%D8%A7%D9%85%D9%88%D8%A7%D9%84-%D9%85%D8%A7%D9%84%DA%A9-%D8%A2%D9%85%D9%88%D8%B2%D8%B4%DA%A9%D8%AF%D9%87-%D ی به دلیل مواضع شخصی او صورت گرفته است. او در بخشی از واکنش خود نوشت: «حق کار کردن، یاد گرفتن و زندگی کردن هیچ‌کس نباید به ساکت ماندنش وابسته باشد. مساله‌شان با من است و دارند هزینه‌اش را از مدرسه و آدم‌هایش می‌گیرند.»", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B4_Iznm__v1024x512__box_102%2C0%2C1200%2C576.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۹ آبان • ۱۹:۳۸"}, {"source": "IranWire", "title": "آسوشیتدپرس: حملات ایران به پایگاه‌های آمریکا میلیاردها دلار خسارت به بار آورد", "link": "https://iranwire.com/fa/news-1/159629-%D8%A2%D8%B3%D9%88%D8%B4%DB%8C%D8%AA%D8%AF%D9%BE%D8%B1%D8%B3-%D8%AD%D9%85%D9%84%D8%A7%D8%AA-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%A8%D9%87-%D9%BE%D8%A7%DB%8C%DA%AF%D8%A7%D9%87%D9%87%D8%A7%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D9%85%DB%8C%D9%84%DB%8C%D8%A7%D8%B1%D8%AF%D9%87%D8%A7-%D8%AF%D9%84%D8%A7%D8%B1-%D8%AE%D8%B3%D8%A7%D8%B1%D8%AA-%D8%A8%D9%87-%D8%A8%D8%A7%D8%B1-%D8%A2%D9%88%D8%B1%D8%AF/", "summary": "خبرگزاری آسوشیتدپرس، روز شنبه ۹ آبان ۱۴۰۵، در گزارشی نوشت حملات جمهوری اسلامی به ۲۶ پایگاه و محل استقرار تجهیزات نظامی آمریکا در خاورمیا ...", "date_str": "2026-10-31T16:50:00+00:00", "hash": "cc7bec0b19200393", "title_fa": "آسوشیتدپرس: حملات ایران به پایگاه‌های آمریکا میلیاردها دلار خسارت به بار آورد", "summary_fa": "خبرگزاری آسوشیتدپرس، روز شنبه ۹ آبان ۱۴۰۵، در گزارشی نوشت حملات جمهوری اسلامی به ۲۶ پایگاه و محل استقرار تجهیزات نظامی آمریکا در خاورمیا ... آسوشیتدپرس در این بررسی که تصاویر ماهواره‌ای چند شرکت را به‌طور مستقل ارزیابی کرده و با چهار مقام منطقه‌ای آگاه از خسارات گفت‌وگو کرده است، می‌گوید تا پایان ماه اوت، بیش از ۱۱۵ حمله پهپادی و موشکی که ایران یا گروه‌های مورد حمایت آن مسوولیتشان را بر عهده گرفته‌اند، به ساختمان‌ها و تاسیسات ۲۶ پایگاه نظامی و محل استقرار تجهیزات آمریکایی آسیب زده یا آن‌ها را نابود کرده‌اند. بر اساس این گزارش، ایران در مراحل اولیه جنگ، سامانه‌های شناسایی حملات و آشیانه‌های هواپیما را هدف گرفت تا توان دفاعی آمریکا برای مقابله با حملات بعد ه لمس شما پاسخ ندهد. گاهی اوقات این یک چیز ساده است، مانند مسدود شدن یک برنامه. مواقع دیگر، چیز جدی‌تری است، مانند افتادن گوشی شما وقتی می‌خواهید آن را از جیب خود بیرون بیاورید (همه ما آنجا بوده‌ایم). صرف نظر از «چرا»، اغلب اوقات، یک راه حل ساده می تواند بهترین دوست جیب شما را برای جلسه اسکرول بعدی شما آماده کند. نحوه رفع مشکل به این بستگی دارد که چرا در وهله اول اتفاق افتاده است. به عنوان مثال، اگر علت خرابی یک برنامه باشد، راه اندازی مجدد می تواند این کار را انجام دهد. اگر تعجب می کنید، مسدود شدن یا خراب شدن برنامه می تواند باعث شود صفحه نمایش شما پاسخ ندهد زیرا ورودی لمسی شما باید از پردازنده عبور کند تا به برنامه برسد. یک تصادف می تواند زنجیره های آن عملیات را مسدود کند و روند را متوقف کند. فقط برای واضح بودن، هر صفحه نمایشی که پاسخگو نیست یک مشکل نرم افزاری نیست. برخی نیاز به تعمیر حرفه ای دارند. Da Bali/Getty Images اگر صفحه نمایش تلفن شما به طور ناگهانی به لمس پاسخ نمی دهد، با بررسی آن از نظر ترک یا آسیب های دیگر شروع کنید. اگر موردی را مشاهده کردید، احتمالاً با مشکل سخت افزاری سروکار دارید، نه نرم افزاری. در مرحله بعد، محافظ صفحه را بردارید، زیرا می تواند آسیب را پنهان کند و همچنین می تواند دلیل عدم پاسخگویی صفحه نمایش شما باشد. اگر دستکش می پوشید، آن را در بیاورید. آنچه در اطراف", "image_url": "https://www.engadget.com/img/gallery/how-to-fix-your-phone-screen-when-its-unresponsive-to-touch/l-intro-1793286831.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "تراشه"], "datetime_fa": "۹ آبان • ۲۰:۳۰"}, {"source": "Zoomit", "title": "اسپاتیفای با سرویس ریمیکس موسیقی هوشمند، درآمد خود را افزایش می‌دهد", "link": "https://www.zoomit.ir/software-news/470158-spotify-ai-music-remix-tool/", "summary": "اسپاتیفای در تدارک انتشار ابزاری با هوش مصنوعی تا اوایل ۲۰۲۷ است که امکان بازخوانی و ریمیکس قطعات را به کاربران می‌دهد.", "date_str": "2026-10-31T17:40:00+00:00", "hash": "d99321f63a52c43d", "title_fa": "اسپاتیفای با سرویس ریمیکس موسیقی هوشمند، درآمد خود را افزایش می‌دهد", "summary_fa": "اسپاتیفای در تدارک انتشار ابزاری با هوش مصنوعی تا اوایل ۲۰۲۷ است که امکان بازخوانی و ریمیکس قطعات را به کاربران می‌دهد. تبلیغات پلتفرم اسپاتیفای قصد دارد اوایل سال ۲۰۲۷ از سرویس جدیدی با هوش مصنوعی رونمایی کند که به مشترکان امکان می‌دهد بازخوانی‌ها و ریمیکس‌های اختصاصی خود را از قطعات موسیقی تولید کنند. سازندگان در حال مذاکره برای دریافت مجوزهای لازم و متقاعد کردن هنرمندان جهت بهره‌گیری از فناوری مذکور هستند. به روایت فایننشال تایمز ، راه‌اندازی این قابلیت برای سه‌ماهه‌ی نخست سال آینده با احتمال رونمایی هم‌زمان با مراسم جوایز گرمی در بهمن و اسفند برنامه‌ریزی شده است. گزارش‌ها نشان می‌دهد دسترسی به این ابزار ماهانه ۴ تا ۵ دلار هزینه‌ی اضافی برای مشترکان در پی خواهد داشت، گرچه زمان‌بندی و مبالغ یادشده هنوز نهایی نیستند. قابلیت مورد بحث به کاربران پولی اجازه می‌دهد قطعات نامدار را بازآفرینی کنند؛ برای نمونه، ترانه‌ای فولک را به یک قطعه‌ی موسیقی الکترونیک تبدیل کنند یا صدای خواننده‌ای را روی اثر دیگری قرار دهند. برخلاف ابزارهایی مانند Suno که صرفا بر پایه‌ی متن آهنگ جدید می‌سازند، سازوکار اسپاتیفای امکان دستکاری ترانه‌های موجودِ هنرمندان همکار را فراهم می‌آورد. اسپاتیفای قراردادهایی با Universal Music Group، گروه مرلین و شرکت فرانسوی Believe امضا کرده، در حالی که مذاکره با شرکت‌های سونی موزیک و وارنر موزیک همچنان ادامه دارد. حضور در این طرح حتی در صورت توافق ناشران موسیقی اختیاری خواهد بود و جلب نظر ستاره‌های امروزی سخت‌تر از هنرمندان قدیمی‌تر گزارش می‌شود. برخی هنرمندان جوان مخالفت علنی خود را با فناوری مذکور نشان داده‌اند. اولیویا رودریگو، خواننده سرشناس، گفت: «من هرگز چنین کاری نخواهم کرد. قطعا نه. موضع بسیار سرسختی در این زمینه دارم.» مدیران بر این باورند که عواید حاصل از ریمیکس‌ها نصیب پدیدآورندگان اصلی می‌شود و پخش آنها در رتبه‌بندی‌های رسمی ترانه‌ها محاسبه خواهد شد.", "image_url": "https://api2.zoomit.ir/media/2022-3-samsung-galaxy-a53-sporify-652d0449eb21a6b54f50673f?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۹ آبان • ۲۱:۱۰"}, {"source": "Zoomit", "title": "شناسایی نوعی سلول ایمنی که مرگبارترین سرطان ریه را نابود می‌کند", "link": "https://www.zoomit.ir/health-medical/470139-gamma-delta s after seeing a photo of myself that made me look tired. Over the decades, I spent an estimated $26,000 on hair color and touch-ups every six weeks. I finally decided to embrace my gray after meeting women my age who looked beautiful naturally. My mother had the most gorgeous hair . It was a deep, rich red that looked more like Bordeaux than carrots. My favorite photograph of her is from her modeling days when she posed as one of the original Breck girls. Three of my four grandparents were redheads . My grandmothers had the more common copper color. It was my mother's father who passed down the auburn and my other grandfather's black hair that fated my cousins and me to our very dark brown. In my family, hair was a frequent topic of conversation. For my mother, in her later years, the talk often focused on how hers wasn't turning gray. I never questioned her claim that she was miraculously maintaining her original color , even though it seemed a little incredible that no wispy whites were visible on her 60+-year-old head, while silver streaks started multiplying on mine in my early 40s. My new lighter strands didn't bother me. In fact, I liked them. I thought they added dimension to my flat brown until I looked at a photo of myself and saw a sad, tired woman. I colored my hair because I was curious Maybe I was tired because at 42, I'd become a single mother of five children ranging in age from 8 months to 16 years. Or maybe it was just natural selection. My father started to turn gray in his late 30s. No matter the reason, I decided to abandon my defiant stance of aging naturally and color my hair . I was curious about the process and what the results might be. For years, I booked appointments every six weeks, investing hundreds of dollars in dye jobs and touch-ups. I estimate that over the decades, I've spent about $26,000. But the color never felt authentic. At each visit, I told my stylist to be honest with me when I was too old to keep this up. There's nothing  42 سالگی مادر تنها 5 فرزند از 8 ماهگی تا 16 سالگی شدم. یا شاید فقط", "image_url": "https://i.insider.com/6ad78b05e50b02f612be534b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۹ آبان • ۱۹:۰۸"}, {"source": "Business Insider", "title": "I paid $1.6 million for the Lizzie Borden House. I wasn't prepared for what I found inside.", "link": "https://www.businessinsider.com/living-lalaurie-mansion-new-orleans-haunted-house-2026-10", "summary": "Lance Zaal owns several properties in the US. Courtesy of Lance Zaal Lance Zaal lives in the LaLaurie Mansion, a reportedly haunted property in New Orleans. His foray into ghostly properties began when he purchased the Lizzie Borden house in 2021. He wants these properties to highlight history, not just the paranormal, he says. This as-told-to essay is based on a conversation with Lance Zaal, president of US Ghost Adventures . Zaal was the subject of a recent Business Insider story . It has been edited for length and clarity . When I heard that the Lizzie Borden House was for sale in 2021, I was immediately fascinated. Most people know the famous nursery rhyme: \" Lizzie Borden took an axe…\" But few know the history of the home where the crime occurred. They don't realize that the 1892 case was one of the earliest and most widespread use of crime scene photos. Or that Lizzie was tried by an all-male jury and quickly acquitted, with the case still unsolved . When I took over the property, those weren't the scariest details. What was more terrifying was the state of the place. There were rotten doors I could put my hands through, and a toxic workplace full of employees who couldn't stand each other. Too often, historic properties are treated as cash cows and not reinvested in. I take the opposite approach: I believe these buildings with difficult and uncomfortable histories need to be cared for and accessible to everyone. I started with food tours before buying haunted properti a's main tourist hub, with Catalina Express. There were four departures scheduled that day, a Wednesday in October. I selected 9:50 a.m., the Goldilocks of departure times — not too early or too late. Luckily, I was even able to use my first-ever senior discount and secure $5 off my ticket. For $61 each way (after the discount), I booked an upgraded ticket with priority boarding , access to a special seating area called the Commodore lounge, a drink, and a snack. This was only about $20 more than I would've paid for a standard adult ticket, which I thought seemed like a solid value. Here's what the experience was like. I started my day at the Catalina Landing in Downtown Long Beach. Allison Tibaldi I arrived at the Catalina Express terminal in Long Beach an hour early. I gave myself ample time to get there, since I know how awful Los Angeles traffic can be. Luckily, plenty of indoor seating and clean restrooms made the wait pleasant, and I read the Los Angeles Times to pass the time. About 25 minutes before the ferry was set to depart, I heard the announcement that Commodore lounge passengers could go outside and board first. The process was easy and organized. The Commodore lounge wasn t crowded. Allison Tibaldi Upon entering the lounge, I saw individual packets of Chex Mix and chocolate-chip cookies in a basket. I took one of each and selected a padded window seat; I had the row to myself. The seats were wider than those offered in the standard class of tickets, and I thought they were comfortable. Then, a crew member came by with a drink menu. There were plenty of choices included in the price of the ticket, like beer, wine, coc", "date_str": "2026-10-31T15:07:01+00:00", "hash": "b81a5a4ca20eb01b", "title_fa": "من با یک کشتی رفت و برگشت به جزیره ای خیره کننده در سواحل کالیفرنیا با قیمت 122 دلار رفتم. این سفر یک روزه عالی بود.", "summary_fa": "من به جزیره کاتالینا، واقع در سواحل لس آنجلس سفر کردم. آلیسون تیبالدی I با کشتی کاتالینا اکسپرس به جزیره کاتالینا، نقطه ای rts of the city. Take a look at what life was like in London in the 1920s. Today, London is a bustling, metropolitan city, and the same could be said about the city 100 years ago . Like today, London was known for its attractions such as Piccadilly Circus, Buckingham Palace, and the River Thames. But many photos show parts of the city that are unrecognizable now. From the glamorous fashion all the way to the slum dwellings, take a look at these photos from 1920s London to see how much life has changed. An aerial shot of Trafalgar Square in London shows that parts of the city are still structurally the same 100 years later. DE AGOSTINI PICTURE LIBRARY/Getty Images In the early 1800s, the square was meant to be a cultural center of the city, and it officially got its name in 1830 after several transformations, according to the Greater London Authority . At the time, Trafalgar Square was the perfect place for children to frolic in fountains. Mirrorpix/Getty Images The fountains were built in 1845. Oxford Street no longer has any cars or buses. Fox Photos/Getty Images While Oxford Street remains lined with stores and restaurants, it has recently been pedestrianized. As of October, vehicles are no longer permitted to enter between Orchard Street and Great Portland Street. Piccadilly Circus had a similar scene of hustle and bustle 100 years ago. Topical Press Agency/Getty Images If you look closely, you can see the double-decker buses that are still popular today. Piccadilly Circus has always been a popular destination in London. Universal History Archive/Getty Images Piccadilly Circus was created in 1819, and by 1920, the area had become a popular crossroads. Today, it has become a tourist destination and a must-see when visiting London. There were even traffic jams on the bridges that stretched across the River Thames back in 1920. Fox Photos/Getty Images Today, there are 35 bridges across the River Thames. The pedestrian bridges also got crowded. Fox Photos/Getty Images This image shows men in 1920 crossing a bridge over the River Thames on a windy day. For those who wanted to avoid the road traffic, the London Underground was always an option. Topical Press Agency/Getty Images The London Underground — also know", "date_str": "2026-10-31T14:17:01+00:00", "hash": "4b61ad67cfa4eecc", "title_fa": "عکس های قدیمی نشان می دهد که لندن 100 سال پیش چگونه بوده است", "summary_fa": "فلپرها در بار یک کلوپ شبانه در لندن، در حدود سال 1925. آژانس عکاسی عمومی/گتی ایماژ یک قرن پیش، لندن شهری شلوغ، مملو از فرهنگ و معماری زیبا بود. با این حال، فقر با سکونت گاه های فقیر نشین در بخش هایی از شهر همچنان یک مسئله باقی ماند. نگاهی به زندگی در لندن در دهه 1920 بیندازید. امروزه لندن شهری پرهیاهو و کلان شهری است و همین را می توان در مورد شهر 100 سال پیش نیز گفت. مانند امروز، لندن به خاطر جاذبه هایش مانند سیرک پیکادیلی، کاخ باکینگهام و رودخانه تیمز شناخته شده بود. اما بسیاری از عکس‌ها بخش‌هایی از شهر را نشان می‌دهند که اکنون قابل شناسایی نیستند. از مد پر زرق و برق گرفته تا خانه های فقیر نشین، به این عکس ها از لندن دهه 1920 نگاهی بیندازید تا ببینید چقدر زندگی تغییر کرده است. یک عکس هوایی از میدان ترافالگار در لندن نشان می‌دهد که بخش‌هایی از شهر هنوز از نظر ساختاری 100 سال بعد به همان شکل هستند. کتابخانه عکس DE AGOSTINI/Getty Images در اوایل دهه 1800، بنا به گفته مقامات لندن بزرگ، این میدان مرکز فرهنگی شهر بود و در سال 1830 پس از چندین دگرگونی نام خود را به طور رسمی دریافت کرد. در آن زمان میدان ترافالگار مکان مناسبی برای شادی کودکان در فواره ها بود. Mirrorpix/Getty Images این فواره ها در سال 1845 ساخته شدند. خیابان آکسفورد دیگر هیچ ماشین یا اتوبوسی ندارد. Fox Photos/Getty Images در حالی که خیابان آکسفورد مملو از فروشگاه ها و رستوران ها است، اخیراً عابر پیاده شده است. از اکتبر، وسایل نقلیه دیگر اجازه ورود بین خیابان Orchard و خیابان گریت پورتلند را ندارند. سیرک پیکادلی 100 سال پیش صحنه مشابهی از شلوغی و شلوغی داشت. خبرگزاری تاپیک/ گتی ایماژ اگر دقت کنید، اتوبوس های دوطبقه را می بینید که امروزه هم", "image_url": "https://i.insider.com/6ae33f26e793e12971426998?wid ary, while Gymkhana's second location opened at the ARIA resort in December 2025, becoming the first Indian fine-dining restaurant on the Las Vegas Strip . Gymkhana's British sister has also achieved a couple of historic firsts over the past few years. It's the first Indian restaurant in London to receive two Michelin stars, and one of only four Indian restaurants in the world to hold the distinction. It's also the first Indian restaurant that Kendrick Lamar ever dined at. Travis Kelce, who visited for the first time with Taylor Swift in May, has also sung its praises. \"I would say it was one of the most surprising meals that I've ever had,\" Kelce told his brother Jason on the May 13 episode of their \"New Heights\" podcast. \"It is phenomenal. And now that I know there's one in Vegas, everyone in America needs to go try it.\" Thirteen years on, Gymkhana is still one of the ", "date_str": "2026-10-31T14:12:01+00:00", "hash": "d9429e5e03dbf0ba", "title_fa": "در یکی از معروف ترین رستوران های هندی لندن شام خوردم. این یک ولخرجی بود، اما هر ظرفی یک ضربه بود.", "summary_fa": "Gymkhana یکی از چهار رستوران هندی در جهان است که دارای دو ستاره میشلین است. رستوران های JKS من به Gymkhana، رستوران هندی شلوغ لندن با دو ستاره میشلین رفتم. این رستوران طرفداران معروف را به خود جلب کرده است. تراویس کلس گفت: \"همه در آمریکا باید آن را امتحان کنند.\" ناهار دو ساعته ما یک ولخرجی بود، اما هر ظرفی سر میز ما ضربه خورد. ما قبلاً غذای خود را در Gymkhana شروع کرده بودیم - رستوران دو ستاره میشلن با رولودکس مشهوری که می تواند رقیب Nobu Malibu باشد - زمانی که تصمیم گرفتم ضبط تلفنم را روشن کنم. این بخشی از برنامه نبود. من تصادفاً تعطیلات گذشته‌ام در لندن را ربوده‌ام، و در مورد پیتزا فروشی بی‌پایان گوردون رمزی یا مکان مورد علاقه ایتالیایی پرنسس دایانا نوشته‌ام، زمانی که باید از تیت مدرن بازدید می‌کردم یا در نهایت نمایشی را در وست اند می دیدم. به خودم قول دادم این بار فرق می کرد. در این سفر، من صرفا برای لذت غذا می خورم! وقتی به دور میزمان نگاه کردم، جایی که نامزدم و دوستانمان کاملاً گیج شده بودند  much money as possible.\" We got a handful of clients, and then once we had a handful, it was really just about execution. It's always been my approach to business: get a small handful of customers, ", "date_str": "2026-10-31T13:20:01+00:00", "hash": "a562ca79a4bd0bfa", "title_fa": "مدیریت 64 کرایه تعطیلات یک چیز به من آموخت: من به مهمان نوازی تعلق ندارم", "summary_fa": "پل برک یک نمونه کار 64 خانه اجاره ای از ابتدا در کلرادو ساخت و آن را در دو سال فروخت. با حسن نیت از پل برک پل برک از پیشینه کسب و کار و فناوری خود برای ساختن نمونه کارها برای اجاره تعطیلات در کلرادو استفاده کرد. بورک پس از دو سال از آن خارج شد و گفت که صنعت مهمان‌نوازی به او آسیب وارد کرده است. برک بعداً شرکتی را برای اپراتورهای اجاره تعطیلات تأسیس کرد و از تجربیاتی که به دست آورد استفاده کرد. این مقاله همانطور که گفته شد بر اساس گفتگو با پل برک، 42 ساله، مدیر عامل و بنیانگذار Vantory، یک استارت آپ هوش مصنوعی است که عملیات اجاره تعطیلات را برای مدیران املاک ساده می کند. او قبلاً یک نمونه کار 64 خانه اجاره ای در کلرادو ساخته بود و پس از دو سال در سال 2026 آن را فروخت. موارد زیر برای طول و وضوح ویرایش شده است. اگر دو سال پیش از من می پرسیدید که آیا هرگز یک شرکت مدیریت املاک را اداره می کنم، احتمالاً به شما می گفتم که دیوانه هستید. یکی از خواهران من در وینتر پارک، کلرادو زندگی می کند. او یک مشاور املاک و مستغلات است و من داشتم به او می‌رفتم و با رئیسش که صاحب کارگزاری است ملاقات کردم. او من را در آخر هفته به دفترش دعوت کرد و تمام این زمین پارک زمستانی را به من داد و اینکه چگونه میلیاردها دلار روی آن سرمایه گذاری می شود، و این همه فرصت وجود دارد. فکر می‌کردم می‌خواهد خانه‌ای به من بفروشد، و او می‌گوید: \"ما این کارگزاری را داریم، اما پنج سال است که یک شرکت مدیریت املاک می‌خواهیم، ​​اما شریک مناسبی برای ساختن آن پیدا نکرده‌ایم. ما فکر می‌کنیم شما آن مرد هستید.\" این فرصت‌ها فقط در دامان شما نمی‌افتند.", "image_url": "https://i.insider.com/6ae22fb6e793e12971426502?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۹ آبان • ۱۶:۵۰"}],

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
