<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۲۸ آبان ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۲۸ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۱۹ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۵</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۵</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۷</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>
    const data = {
      persian: [{"source": "Independent Persian", "title": "فشار آمریکا بر بغداد و میانجی‌گری قاآنی؛ سرنوشت پایگاه کتائب حزب‌الله", "link": "https://www.independentpersian.com/node/423268/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D9%81%D8%B4%D8%A7%D8%B1-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D8%A8%D8%B1-%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF-%D9%88-%D9%85%DB%8C%D8%A7%D9%86%D8%AC%DB%8C%E2%80%8C%DA%AF%D8%B1%DB%8C-%D9%82%D8%A7%D8%A2%D9%86%DB%8C%D8%9B-%D8%B3%D8%B1%D9%86%D9%88%D8%B4%D8%AA-%D9%BE%D8%A7%DB%8C%DA%AF%D8%A7%D9%87-%DA%A9%D8%AA%D8%A7%D8%A6%D8%A8-%D8%AD%D8%B2%D8%A8%E2%80%8C%D8%A7%D9%84%D9%84%D9%87", "summary": "دولت عراق به کتائب حزب‌الله، گروه مسلح تحت حمایت جمهوری اسلامی یران مهلت داده است از جرف‌الصخر در استان بابل خارج شود و مسئولیت امنیت منطقه را به نیروهای دولتی واگذار کند. این اقدام در حالی صورت می‌گیرد که دولت دونالد ترامپ از بغداد خواسته است گروه‌های مسلح همسو با تهران را بابت اقداماتی که حاکمیت و اقتصاد عراق را تضعیف می‌کند، پاسخگو کند. روز چهارشنبه ۱۸ نوامبر، دفتر فرمانده کل نیروهای مسلح عراق از بررسی طرح استقرار دوباره نیروها در جرف‌الصخر خبر داد. شبکه کردستان۲۴ هم به نقل از دو منبع در ائتلاف حاکم عراق گزارش داد که علی فالح الزیدی، نخست‌وزیر عراق و اسماعیل قاآنی، فرمانده نیروی قدس سپاه پاسداران، بر سر چارچوبی برای خروج مسالمت‌آمیز کتائب حزب‌الله به تفاهم رسیده‌اند. اگرچه تا زمان انتشار این گزارش، بغداد و تهران این تفاهم را رسما اعلام نکرده‌اند. حیدر العبودی، سخنگوی دولت عراق، دوشنبه ۱۶ نوامبر تایید کرد که نخست‌وزیر دستور ورود نیروهای مسلح به جرف‌الصخر را صادر کرده و برای خروج کتائب حزب‌الله مهلت تعیین شده است. او زمان پایان مهلت را اعلام نکرد، اما روزنامه نشنال به نقل از یک مقام امنیتی عراق نوشت که این مهلت ساعت هشت شب جمعه ۲۰ نوامبر به وقت بغداد پایان می‌یابد. شفق‌نیوز هم چهارشنبه گزارش داد که الزیدی همچنان بر مهلت جمعه پافشاری می‌کند و نیروهای امنیتی عراق حضورشان را در اطراف منطقه تقویت کرده‌اند. فشار واشنگتن ترامپ در ماه مه، پس از گفت‌وگو با الزیدی، علنا از او حمایت کرد و گفت او با کمک آمریکا به این جایگاه رسیده است.  to correct for in our coverage are good deals with inflated discount claims. As in, the original retail amount (the “list” price) is sometimes higher than the usual day-to-day price to make the savings seem more substantial. Sometimes, the manufacturer’s suggested retail price (MSRP) is what’s shown, though that’s not always the case. In a recent statement to investigative journalist Ronan Farrow , an unattributed Amazon spokesperson shared that its “List Price” can also be aggregated from the past 90 to 180 days of prices, not the past 30 days as Groundwork Collaborative’s research states, and is based on prices from Amazon itself and other competing retailers. However, in our experience, the confusing way pricing and discounts are communicated isn’t limited to Amazon. View this post on Instagram The group’s findings show how easy it is to distrust the prices you see, especially online, where dynamic pricing sometimes comes into play. Regardless of retailer practices, we understand the importance of curating what you see on The Verge with care. Vetting deals for coverage consideration is a big, albeit invisible, part of our jobs, even outside of big shopping events. Most of what we’re pitched day to day, or what we see in our respective feeds, never hits the site because it doesn’t meet our standards. Even when the deal is for a product ", "date_str": "2026-11-18T14:00:00+00:00", "hash": "397feb10f56377c7", "title_fa": "چگونه The Verge در حال انتخاب معاملات جمعه سیاه برای به اشتراک گذاشتن است", "summary_fa": "در ماه گذشته، ما غرق معاملات جمعه سیاه شده ایم، که نشان می دهد در بزرگترین روز خرید سال در ایالات متحده چه اتفاقی می افتد. ما به طور معمول روزانه ده ها خبر از برندهای بزرگ و کوچک دریافت می کنیم که امیدوارند این پیشنهادات را به اطلاع عموم برسانیم. البته، شرکت‌ها ترجیح می‌دهند که ما هیچ تحقیقی در مورد این معاملات انجام ندهیم تا ببینیم آیا واقعاً خوب هستند یا خیر، و اکثر آنها هیچ یک از زمینه‌های لازم را که در هنگام بررسی آنها به دنبال آن هستیم، ارائه نمی‌کنند. بیشتر شاخص های یک معامله خوب گیج کننده هستند - نه فقط برای ما، بلکه برای هر کسی که خرید می کند. Groundwork Collaborative اخیرا یافته های خود را در مورد نحوه نامشخص نمایش معاملات آمازون منتشر کرده است. محققان آن مجموعه‌ای از محصولات را پیش از جمعه سیاه و دوشنبه سایبری در سال‌های 2024 و 2025 دنبال کردند و ادعا می‌کنند که تقریباً یک محصول از هر سه محصولی که به عنوان معاملات در آمازون تبلیغ می‌شوند، در طول رویدادهای خرید واقعی پس‌اندازی را ارائه نکرده‌اند. این تحقیقات همچنین نشان داد که تقریباً یک دهم معاملاتی که بررسی کرده بود در طول رویدادهای فروش گران‌تر از برخی روزهای ماه منتهی به آن بودند. چیزی که معمولاً در آمازون می بینیم و سعی می کنیم آن را در پوشش خود اصلاح کنیم، معاملات خوب با ادعاهای تخفیف متورم است. همانطور که قبلاً، مقدار اصلی خرده فروشی (قیمت \"فهرست\") گاهی اوقات بالاتر از قیمت معمول روزانه است تا پس انداز قابل توجه تر به نظر برسد. گاهی اوقات، قیمت خرده فروشی پیشنهادی سازنده (MSRP) چیزی است که نشان داده می شود، اگرچه همیشه اینطور نیست. در بیانیه اخیر به روزنامه‌نگار تحقیقی رونان فارو، یک سخنگوی آمازون نامشخص به اشتراک گذاشت که «فهرست قیمت» آن نیز می‌تواند از قیمت‌های", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/10/258010_Black_friday_cyber_monday_CVirginia_PRICE2.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۲۷ آبان • ۱۷:۳۰"}, {"source": "The Verge", "title": "Will Wright’s next game uses AI to map your memories", "link": "https://www.theverge.com/games/1036140/will-wright-mymems-ai-game-interview", "summary": "Will Wright, the creator of legendary franchises like SimCity and The Sims , is working on a new game - and it's built around AI. The new title, focused on your memories, is called MyMems . Like Wright's other titles, it sounds extremely ambitious, giving players a new way to explore worlds they create on their own. \"We want to take your autobiography and turn it into a toy world,\" he tells The Verge . The       media: [{"source": "Billboard", "title": "Ella Langley Is Already a Winner at 2026 CMA Awards; Tim McGraw Sets a Record in Musical Event Category", "link": "https://www.billboard.com/music/awards/cma-awards-2026-ella-langley-tim-mcgraw-win-early-awards-1236384751/", "summary": "Ella Langley ’s expected sweep of the 2026 CMA Awards began early, with the announcement of her win for music video of the year for her megahit “Choosin’ Texas.” And Tim McGraw made CMA history, becoming the first five-time winner of musical event of the year for “McArthur,” a collab with HARDY , Eric Church and Morgan Wallen . Related Here Are the Performers Presenters for the 2026 CMA Awards 2026 CMA Awards Predictions: Who Will Win? How to Watch Billboard s 2026 CMA Awards Red Carpet Livestream The awards were announced live on ABC’s Good Morning America on Wednesday (Nov. 18), with Lara Spencer sharing the news from Honky Tonk Central in downtown Nashville. GMA also took a look inside Bridgestone Arena with Lainey Wilson, who is hosting the show for the third year in a row. Langley won music video of the year as both artist and director. She shares the award with co-directors Caylee Robillard and Wales Toney. Langley also won in this category last year (again as both artist and co-director) for “You Look Like You Love Me,” her sexy duet with Riley Green. HARDY, Church, Wallen and McGraw share the award for musical event of the year with producer Jay Joyce. McGraw’s previous wins in the category are for “It’s Your Love” (with Faith Hill); “Find Out Who Your Friends Are (with Tracy Lawrence and Kenny Chesney); “Feel Like a Rock Star” (with Chesney); and “Highway Don’t Care” (with Taylor Swift and Keith Urban). McGraw’s fifth win in the category allows him to break out of a tie with Brad Paisley, Urban, Chesney and Vince Gill, who have won four times each. The 60th Annual CMA Awards is a production of the Country Music Association. Robert Deaton serves as executive producer, Alan Carter is director, and Jon Macks is head writer. The awards show will take place in Bridgestone Arena in Nashville on Wednesday night.", "date_str": "2026-11-18T14:36:22+00:00", "hash": "e8d6f94e30d7554a", "title_fa": "الا لنگلی در حال حاضر برنده جوایز CMA 2026 است. تیم مک‌گرو رکوردی را در رده رویدادهای موسیقی ثبت کرد", "summary_fa": "حرکت مورد انتظار الا لنگلی در جوایز CMA 2026 با اعلام برنده شدن وی برای موزیک ویدیوی سال برای مگاهیتش \"Choosin' Texas\" زود آغاز شد. و تیم مک‌گرا تاریخ CMA را ثبت کرد و اولین برنده پنج رویداد موسیقی سال برای «مک آرتور» شد، همکاری با هاردی، اریک چرچ و مورگان والن. موارد مرتبط در اینجا مجریان ارائه کننده جوایز 2026 جوایز CMA 2026 پیش بینی جوایز CMA هستند: چه کسی برنده خواهد شد؟ نحوه تماشای بیلبورد 2026 CMA Awards Red Carpet Livestream جوایز به صورت زنده در صبح بخیر آمریکا در شبکه ABC در روز چهارشنبه (18 نوامبر) اعلام شد و لارا اسپنسر اخبار را از Honky Tonk Central در مرکز شهر نشویل به اشتراک گذاشت. GMA همچنین با Lainey Wilson که برای سومین سال متوالی میزبان این برنامه است، به داخل بریجستون آرنا نگاهی انداخت. لنگلی هم به عنوان هنرمند و هم کارگردان برنده موزیک ویدیوی سال شد. او این جایزه را با کارگردانان دیگر کیلی روبیلارد و ولز تونی به اشتراک می گذارد. لنگلی همچنین سال گذشته در این بخش (دوباره به عنوان هنرمند و کارگردان) برای «تو به نظر می‌رسی که عاشق من هستی»، دوئت سکسی او با رایلی گرین، برنده شد. هاردی، چرچ، والن و مک گراو جایزه رویداد موسیقی سال را با تهیه کننده جی جویس به اشتراک می گذارند. برنده های قبلی مک گرو در این رده برای «این عشق توست» (با Faith Hill) است. «پیدا کن که دوستانت چه کسانی هستند (با تریسی لارنس و کنی چسنی)؛ «احساس مثل ستاره راک» (با چسنی)؛ و «بزرگراه مهم نیست» (با تیلور سویفت و کیت اوربان). پنجمین برد مک‌گرو در این رده به او اجازه می‌دهد تا از یک تساوی با اوربانین وی، چهار بار برنده، چنی و براد پیس برنده شود. شصتمین جوایز سالانه CMA محصول انجمن موسیقی کشور است. رابرت دیتون به‌عنوان تهیه‌کننده", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/P106DWOP-e1779074142437.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۸:۰۶"}, {"source": "Billboard", "title": "Boston Museum of Fine Arts Announces Expansive ‘Taylor Swift: The Eras Collection’ Exhibition", "link": "https://www.billboard.com/music/pop/taylor-swift-eras-collection-boston-museum-fine-arts-details-1236384740/", "summary": "Get ready to spend a night at the museum with Taylor Swift . Boston s Museum of Fine Arts announced on Tuesday (Nov. 17) that it will mount the Taylor Swift: the Eras Collection exhibition in the spring. The career-spanning show promises to display more than 50 iconic costumes, instruments and objects from Swift s archive, celebrating two decades of her art. Related Noah Kahan Reacts to 2027 Grammy Nominations Snub: I Was In My Feelings for a Sec Taylor Swift s Song of the Year Grammy Quip Was Likely No Accident Grand Theft Auto VI Revs Its Engines Leads 2026 Game Awards Nominations: Full List According to the announcement, the exhibition will feature a vignette dedicated to each of Swift s 12 eras to date, bookended by the videos for the Tim McGraw single from her 2006 self-titled debut album through The Fate of Ophelia from last year s The Life of a Showgirl . Also included will be objects from Swift s record-setting Eras Tour (2023-2024), including a custom red Alberta Ferretti gown worn during the folklore and evermore sets on the global stadium outing. Among the other objects on display will be the bejeweled Midnights bodysuit designed by Zuhair Murad, as well as the tinsel-fringed jacket from the show s Karma finale and a recreation of the Fortnight video set from The Tortured Poets Department era featuring Swift s Victorian-inspired dress and typewriter. The Boston museum will be the only venue for the exhibit, which will also include a number of Swift s signature instruments, including a Deering banjo from the Speak Now tour, a mandolin from the Willow video and the shell of a pink-and-gold piano from Swift s Lover performance at the 2019 American Music Awards. “This is the first exhibition in the MFA’s history devoted to a musician, and we’re thrilled to invite visitors for an up-close look at the fashion and instruments of one of the most influential cultural figures of our time,” MFA director of public programs Kristen Hoskins said in a statement about the show that opens on April 10 and is slated to run through Aug. 15. “I’m excited to welcome audiences across generations to this unique experience at the Museum.” Tickets for the exhibition ($40) will go on sale to the general public on Swift s birthday, Dec. 13, at 6 p.m. ET; click here for ticketing details. On Monday, Swift made Grammy history when the nominations for next year s ceremony were announced and she once again got nods for album, record and song of the year , marking the fifth tim", "date_str": "2026-11-18T14:20:03+00:00", "hash": "9bef524b1532ed86", "title_fa": "موزه هنرهای زیبای بوستون نمایشگاه گسترده «تیلور سویفت: مجموعه دوره‌ها» را اعلام کرد.", "summary_fa": "برای گذراندن یک شب در موزه با تیلور سویفت آماده شوید. موزه هنرهای زیبای بوستون روز سه شنبه (17 نوامبر) اعلام کرد که نمایشگاه تیلور سویفت: مجموعه ایراس را در بهار برگزار خواهد کرد. این نمایش حرفه ای وعده می دهد که بیش از 50 لباس، ابزار و اشیاء نمادین را از آرشیو سوئیفت به نمایش بگذارد و دو دهه هنر او را جشن بگیرد. واکنش‌های مرتبط نوح کاهان به نامزدهای گرمی 2027 اسنوب: من در احساساتم برای یک ثانیه بودم آهنگ سال تیلور سویفت احتمالاً بدون تصادف بود 12 دوره تا به امروز، توسط ویدئوهای تک آهنگ تیم مک گرو از اولین آلبوم او در سال 2006 از طریق The Fate of Ophelia از سال گذشته The Life of a Showgirl رزرو شده است. همچنین شامل اشیایی از تور Eras Swift (2023-2024) خواهد بود که رکورد ثبت کرده است، از جمله لباس قرمز سفارشی آلبرتا فرتی که در طول مراسم فولکلور پوشیده شده است و ست های همیشه در ورزشگاه جهانی. در میان دیگر اشیاء به نمایش گذاشته شده، لباس بدن نیم‌نیت‌های نگین‌دار طراحی شده توسط زهیر مراد، و همچنین ژاکت لبه‌دار از فینال نمایش کارما و بازسازی مجموعه ویدئویی فورتنایت از دوره انجمن     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
