tures/grammys-2027-best-rb-album-predictions-nominees-1235639786/", "summary": "Look for Kehlani, Bruno Mars, and Jill Scott to land nominations", "date_str": "2026-10-09T13:48:26+00:00", "hash": "c7dc24b5ebcddf96", "title_fa": "بهترین مسابقه آلبوم R&B در گرمی 2027 باید شامل صداهای جدید و قدیمی باشد", "summary_fa": "به دنبال کهلانی، برونو مارس و جیل اسکات باشید تا نامزد دریافت جایزه شوند. برای هر کدام، نامزدها و همچنین اینکه چه کسی (و چه کسی باید) در شب گرمی برنده شود را پیش‌بینی می‌کنیم. ژانر R B به طور مداوم در حال تکامل است و از هنرمندان جدید استقبال می کند. در چند سال گذشته، گرمی با معرفی دسته‌های جدیدی مانند بهترین آلبوم پیشرو R B به سرعت آن کمک کرد و این فرصت را برای هنرمندان در طیف ریتم اند بلوز فراهم کرد تا آثار خود را شناسایی کنند. نادسکا الکسیس، میزبان Apple Music، که تخصصش در ژانرهای R B و هیپ هاپ است، می گوید: این راهی برای ایجاد فضای بیشتر برای هنرمندان است. تکامل در DNA RB است. یکی از تغییرات مثبت در دوره استریم، خطوط تارتر و فشار کمتر برای قرار گرفتن منظم در جعبه‌های سبک سنتی است. اما دسته بندی اصلی بهترین آلبوم R B هنوز هم حس خاص خود را دارد، و زمینه امسال باید شامل تعدادی آهنگساز به شدت سنگین باشد. برنت فیاض، آیکون کهلانی، کهلانی برونو مارس، جیل اسکات رمانتیک، که این می‌تواند به سامر واکر توجه کند، سرانجام بیش از آن کهلانی، کهلانی از زمان ظهور بیش از یک دهه پیش در صحنه، کهلانی به طور مداوم در صدای موسیقی و سیاسی خود شتاب بیشتری به دست آورده است. آهنگ موفق او Folded به رتبه ششم در بیلبورد Hot 100 رسید و دو جایزه گرمی را برای او در سال گذشته برای بهترین آهنگ R B و بهترین اجرای R B دریافت کرد. اکنون، فولد در پنجمین پروژه استودیویی خود با عنوان خود ظاهر می‌شود و جادوی خود را به آلبوم می‌آورد، ال‌پی که بیش از 500 میلیون استریم در Spotify دریافت کرد و شامل برخی از غول‌های فرهنگ مانند لیل وین، میسی الیوت، آشر و براندی می‌شود. الکسیس می"}, {"source": "Rolling Stone", "title": "Judas Priest’s Longtime Bassist Ian Hill Announces Retirement: ‘Time Has Come’", "link": "https://www.rollingstone.com/music/music-news/judas-priest-longtime-bassist-ian-hill-announces-retirement-1235640174/", "summary": "Longest-serving member of heavy metal legends cites \"evil arthritis,\" other health issues and \"neglect[ing] my family life for 57 years\" as reasons for departure, but Hill will appear on band's upcoming album", "date_str": "2026-10-09T13:35:36+00:00", "hash": "71e81585c26c765f", "title_fa": "ایان هیل، بیسیست قدیمی جوداس پریست، بازنشستگی خود را اعلام کرد: «زمان رسیده است»", "summary_fa": "طولانی‌ترین عضو افسانه‌های هوی متال «آرتریت شیطانی»، سایر مشکلات سلامتی و «بی‌توجهی به زندگی خانوادگی‌ام به مدت ۵۷ سال» را به‌عنوان دلایل ترک عنوان می‌کند، اما هیل در آلبوم آتی گروه Judas Priest، یان هیل، بیسیست، طولانی‌ترین عضو افسانه‌های هوی متال، بازنشستگی خود را اعلام کرده است. هیل روز جمعه در بیانیه ای طولانی جدایی خود را برای هواداران فاش کرد و دلیل خروج خود را آرتریت بد و سایر جراحات ذکر کرد. مدت زیادی است که وقتی از شما می‌پرسند تا کی می‌توانید ادامه دهید، همیشه پاسخ می‌دهم تا زمانی که اجراهایم آسیب ببینند. هیل نوشت: من از گفتن آن متنفرم، اما زمان آن فرا رسیده است. چند سالی است که من با شروع آرتریت بد دست و پنجه نرم می کنم، که اکنون در حالت پیشرفته در شانه چپ و دست راستم است، در شانه راستم ایجاد شده و در هر دو زانو وجود دارد. من با قرص های مسکن، ژل ها و اخیراً با تزریق کورتیزون در شانه و دستم با این مشکل مبارزه کرده ام. هیل گفت که در حالی که می‌توانست ردیف‌های باس را در آلبوم آینده جوداس پریست بنویسد، این نگرانی وجود داشت که آیا او می‌تواند در تور اروپایی اخیر گروه شرکت کند، بنابراین گروه، دیوی ریمر از Uriah Heep را به‌عنوان شاگرد استخدام کرد. ریمر مجبور شد وارد عمل شود که هیل یک تاندون را در شانه چپ من کوبید (انگار که مشکل کافی با آن نداشتم!) درست قبل از مسابقه دو روز قبل در نمایش بروکسل. این باعث شد که نتوانم دستم را آنقدر بلند کنم که به گردن باسم برسد. هیل ادامه داد، من متخصصانی را دیده‌ام که پیشنهاد می‌کنند ممکن است بدون جراحی فرار کنم، اما حتی اگر من به هیچ وجه تضمینی نداشته باشم که قدرت کافی در شانه/بازویم برای تکمیل یک نمایش کامل صحنه‌ای داشته باشم، وجود"}, {"source": "Rolling Stone", "title": "Abdul El-Sayed Wouldn’t Let Mike Rogers Wash Off His MAGA Makeup", "link": "https://www.rollingstone.com/politics/political-commentary/abdul-el-sayed-mike-rogers-michigan-senate-debate-1235640133/", "summary": "The Michigan Senate debate got heated, but the Democrat kept his cool as his opponent leaned on Islamophobic fearmongering", "date_str": "2026-10-09T13:30:00+00:00", "hash": "85537daf963bf505", "title_fa": "عبدالالسید اجازه نمی دهد مایک راجرز آرایش MAGA خود را بشوید", "summary_fa": "مناظره سنای میشیگان داغ شد، اما دموکرات خونسردی خود را حفظ کرد، زیرا رقیبش به ترس افکنی اسلام هراسی تکیه کرده بود. اشاره به مربی و حامی خود، دونالد ترامپ. نماینده سابق کنگره تمام لطف یک فروشنده سهام زمانی فلوریدا را که به طور فزاینده ای قرمز و متزلزل شده بود، نشان داد، زیرا می دانست که او قرارداد را با زوج خوب و مسن از Saginaw نمی بندد. بحث پر هرج و مرج در یک نقطه، مجری با اخم گفت که مایل است در گفتگو شرکت کند، در نهایت به چشمان همیشه کنجکاو دوربین های Flock کشیده شد. السید پیشنهاد داد که برخلاف راجرز، او معتقد است که حریم خصوصی شما ممکن است نقض شود، حتی اگر شما نمی دانستید که حریم خصوصی شما نقض شده است و از مقررات فدرال حمایت می کرد. راجرز راه دیگری را پیش گرفت. او از فایده آنها در مبارزه با تروریسم دفاع کرد و سپس کمی به سمت السید روی آورد. چرا این شما را آزار می دهد؟ راجرز گفت. و سپس قسمت آرام را با صدای بلند گفت. خوب، اگر فردی در خانواده خود دارید که ممکن است در لیست تماشا باشد. السید لبخندی زد یا خم شد. گفتنش سخت بود او به راجرز خیره شد. برو و آن را بگو، تو نوک پا را دور زده ای. افسوس، راجرز آن را نگفت. او نگفت که دکتر عبدالالسید، ستاره فوتبال دبیرستان و فارغ التحصیل بیش از حد مفتخر دانشگاه میشیگان، فرزند معنوی اسامه بن لادن بود که خداوند در اولین دیدار خود برای انفجار کاخ سفید فرستاد."}, {"source": "Rolling Stone", "title": "Don Toliver and Malcolm Todd Talk Going Viral and Staying Sane", "link": "https://www.rollingstone.com/music/music-features/don-toliver-malcolm-todd-musicians-on-musicians-1235635941/", "summary": "Both artists have had massive years, and they have a special connection via a well-placed sample. Now, they link up to talk about songwriting, fame, and how to tap into the right energy", "date_str": "2026-10-09T13:00:00+00:00", "hash": "e8353c9094516cd4", "title_fa": "دون تولیور و مالکوم تاد با هم صحبت می‌کنند و ویروسی می‌شوند و عاقل می‌مانند", "summary_fa": "هر دو هنرمند سال‌های بسیار زیادی را پشت سر گذاشته‌اند و از طریق نمونه‌ای که به خوبی قرار گرفته‌اند، ارتباط ویژه‌ای دارند. اکنون، آنها برای صحبت در مورد ترانه سرایی، شهرت، و چگونگی استفاده از انرژی مناسب در پایان گفتگوی دان تولیور و مالکوم تاد، موسیقیدانان در موزیسین ها، صحبت می کنند، تاد غرق شده است. او می گوید من فقط زیر این ترمه قرمز عرق می کنم. تولیور هم داغ است. تنها پس از قطع دوربین ها، تاد به دور خود می چرخد ​​و متوجه می شود که شومینه پشت سر آنها در یک روز غرق آلود در لس آنجلس می سوزد. به اندازه کافی مناسب است، زیرا این دو تنها یک ساعت را صرف بحث در مورد انرژی کرده اند، یعنی منبع انگیزه های درونی خود برای ایجاد. در حال حاضر، این دو دوستان جوان هستند. تولیور ابتدا متوجه موسیقی تاد به صورت آنلاین شد و قطعاتی از آهنگ های خواننده 22 ساله لس آنجلس را در رسانه های اجتماعی شنید و متوجه شد که به صدایی که در زمان معلق می ماند کشیده شده است. تولیور قبل از اینکه به طور رسمی ملاقات کنند، در نهایت از درد قفسه سینه تاد (I Love) برای 20 اثر برتر E85 خود نمونه برداری کرد. تاد چند سال قبل در اتاق خوابش در لس آنجلس شروع به ساخت موسیقی کرد، در طول همه‌گیری همه‌گیر، مخاطبانی برای آهنگ‌هایی پیدا کرد که جایی بین پاپ مستقل و R B قرار می‌گرفت. خانه هنری و اتاق همرزمانش در سال 2023 به صورت آنلاین مورد توجه قرار گرفت، و او سال بعد با عمر آپولو در جاده بود. تاد و آپولو در آهنگ Bleed با یکدیگر همکاری کردند که به اولین آلبوم تاد با نام خود که در سال 2025 منتشر شد راه یافت. پیگیری امسال، «دوباره آن را انجام بده»، متوجه می‌شود که"}, {"source": "Rolling Stone", "title": "How ‘The Twilight Zone’ Influenced Some of Modern TV’s Greatest Creators", "link": "https://www.rollingstone.com/tv-movies/tv-movie-features/twilight-zone-serling-biography-excerpt-1235637468/", "summary": "An excerpt from the new Rod Serling biography Serling features writers and directors from Vince Gilligan to J.J. Abrams, Rian Johnson, and Jordan Peele talking about the sci-fi giant’s impact", "date_str": "2026-10-09T13:00:00+00:00", "hash": "a4b17940b2023a4b", "title_fa": "چگونه «منطقه گرگ و میش» بر برخی از بزرگترین سازندگان تلویزیون مدرن تأثیر گذاشت", "summary_fa": "گزیده ای از زندگینامه جدید راد سرلینگ، سرلینگ نویسندگان و کارگردانانی از وینس گیلیگان تا جی. آبرامز، ریان جانسون و جردن پیل در مورد تأثیر غول علمی-تخیلی صحبت می‌کنند در پاییز 1959، زمانی که برنامه‌های کمدی (پدر بهتر می‌داند، آن را به بیور بسپارید)، وسترن (Gunsmoke، Rawhide) و برنامه‌های متنوع (The Dinah Shore Chevy Show، The Pat Boone Chevy Showroom) یک برنامه تلویزیونی متفاوت پخش کردند. Twilight Zone آغاز به کار کرد. هر قسمت داستانی کاملا متفاوت و سورئال را روایت می‌کند که اغلب شامل بیگانگان، هیولاها یا نیروهای ماوراء طبیعی غیرقابل توضیح است. این زاییده فکر راد سرلینگ، کهنه سرباز جنگ جهانی دوم بود که پتانسیل تلویزیون را برای گفتن داستان های بلندپروازانه مانند فیلم ها یا رمان ها خیلی قبل از دیگران می دید. کتاب جدید آلن سپین‌وال به نام سرلینگ: سفری به منطقه گرگ و میش با اولین چشم‌انداز تلویزیونی داستان زندگی او را با جزئیات باورنکردنی دنبال می‌کند و مصاحبه‌های جدیدی با استیون اسپیلبرگ، گیرمو دل تورو، جی. آبرامز، بن استیلر، ریان جانسون، وینس گیلیگان، راب مک و دیگر تحسین کنندگان. در این گزیده ی اختصاصی، برخی از آن نویسندگان و برنامه نویسان امروزی درباره تاثیر و میراث The Twilight Zone بحث می کنند. زمانی که راد سرلینگ در اواخر عمرش در کالج ایتاکا نویسندگی خلاق تدریس می کرد، یکی از شاگردانش، هاروی وارن، از پایان های پیچیده معروف The Twilight Zone شگفت زده شد. پرسیدم چطور به این چیزها میرسی؟ وارن می گوید. و او می رود، این O. هنری است. اوه کی؟ شما بچه ها باید بخونید و برگشتم و شروع کردم به خواندن O.Henry و رفتم خدای من داستان های کوتاه با پایان های غافلگیرکننده! بنابراین، نه، سرلینگ مفهوم پایان های پیچشی را اختراع نکرد. اما برای نسلی که در منطقه گرگ و میش بزرگ می‌شوند، او ممکن است چه خوب و چه"}, {"source": "Rolling Stone", "title": "‘I Don’t Think Anybody Can Be Prepared to Listen to the Shaggs’: See New Doc Trailer", "link": "https://www.rollingstone.com/music/music-news/we-are-the-shaggs-documentary-trailer-1235639314/", "summary": "We Are the Shaggs looks at discordant sister group’s story and its surprising impact", "date_str": "2026-10-09T13:00:00+00:00", "hash": "93e0c2d8087bd4c4", "title_fa": "«فکر نمی‌کنم کسی بتواند برای گوش دادن به Shaggs آماده باشد»: تریلر جدید Doc را ببینید", "summary_fa": "We Are the Shaggs به داستان گروه خواهر ناسازگار و تأثیر شگفت‌انگیز آن نگاه می‌کند یک مستند جدید به میراث Shaggs می‌پردازد، گروه ناهماهنگی از خواهران که در سال 1969 Philosophy of the World را ضبط کردند، آلبوم مورد علاقه کرت کوبین و فرانک زاپا. تریلر We Are the Shaggs اولین واکنش مردم را به گوش دادن به موسیقی غیرمعمول گروه با تفسیر نشان می دهد، فکر نمی کنم کسی بتواند آماده گوش دادن به Shaggs باشد. تریلر مستند، دو خواهر از چهار خواهر ویگین را نشان می‌دهد که به راه‌هایی که پدرشان آنها را مجبور به تشکیل گروه کرده است، عواقب رد شدن آلبوم و ارزیابی مجدد شگفت‌انگیز موسیقی‌شان در دهه‌های اخیر را نشان می‌دهد. کن کواپیس، فیلمساز، که رزومه اش شامل Follow That Bird و قسمت هایی از Freaks and Geeks، Malcolm in the Middle و The Office است، این فیلم را کارگردانی کرده است. در ماه مارس در South by Southwest به نمایش درآمد. (تهیه‌کنندگان پیشنهادات پخش‌کننده‌ها را دریافت می‌کنند و امیدوارند فیلم را در اوایل سال آینده به سینماها برسانند.) کوپیس به رولینگ استون می‌گوید از زمانی که برای اولین بار در سال 1980 Philosophy of the Wor ld را شنیدم مجذوب Shaggs بودم و موسیقی آنها مثل همیشه گیج‌کننده و تحریک‌کننده باقی می‌ماند. بسیاری از روایت‌های شاگز [اعضای گروه] دات، بتی و هلن ویگین را به عنوان کنجکاوی یا عروسک‌های یک پدر سلطه‌گر معرفی می‌کنند. قصد من این بود که خواهران را انسان سازی کنم و به آنها احترام بگذارم و موسیقی منحصر به فرد آنها را جدی بگیرم. داستان های پرطرفدار تام یورک و هری استایلز در گفتگوی حماسی با هم می آیند U2 آهنگی درباره روزالیا نوشت. او در مورد آن چه احساسی دارد؟ Journey Drummer Deen Castronovo در طول کنسرت Tulsa دچار اورژانس پزشکی شد. پنتاگون قرار است اجرای زنده جوخه تیراندازی"}, {"source": "Rolling Stone", "title": "Zac Brown Shares Dolly Parton’s Posthumous Video Message to Teachers: ‘Thank You for Your Passion’", "link": "https://www.rollingstone.com/music/music-country/dolly-parton-video-teachers-zac-brown-cma-foundation-1235640120/", "summary": "The singer shared Parton's video during a CMA Foundation event", "date_str": "2026-10-09T04:00:10+00:00", "hash": "2bafc62da3054f2d", "title_fa": "زک براون پیام ویدیویی پس از مرگ دالی پارتون را به معلمان به اشتراک می‌گذارد: \"از علاقه شما متشکرم\"", "summary_fa": "این خواننده ویدیوی پارتون را در یک رویداد بنیاد CMA به اشتراک گذاشت. دالی پارتون، که در طول زندگی خود از آموزش دفاع می کرد، در رویداد معلمان عالی موسیقی بنیاد CMA در روز چهارشنبه پیامی برای معلمان داشت. موزیسین زک براون ویدیو را به اشتراک گذاشت و گفت که نماد موسیقی کانتری پیام ویژه معلمان را در این اتاق ضبط کرده و زمان صرف کرده و مستقیماً با شما صحبت می کند. براون از صحنه گفت: وقتی به میراث فکر می‌کنم، به آنچه خلق می‌کنیم فکر می‌کنم، اما حتی بیشتر از آن، به آنچه هدیه می‌دهیم فکر می‌کنم. اینگونه است که زندگی ما مدت ها پس از گذشت یک لحظه به دست مردم می رسد. کمتر کسی این را بهتر از دالی پارتون درک می کند. در کنار هزاران آهنگ قابل توجه پارتون، زندگی و حرفه خارق العاده این خواننده فراتر از موسیقی بود. براون ادامه داد که او به مردم امید داد. او به کودکان اعتقاد داشت و از هر چیزی که ساخته بود برای ایجاد فرصت برای دیگران استفاده می کرد. داستان های پرطرفدار تام یورک و هری استایلز در گفتگوی حماسی با هم می آیند U2 آهنگی درباره روزالیا نوشت. او در مورد آن چه احساسی دارد؟ درامر سفر، دین کاسترونوو در طول کنسرت تولسا از اورژانس پزشکی رنج می برد. پنتاگون قصد دارد اجرای زنده جوخه تیراندازی را پخش کند. من همیشه معتقد بودم که موسیقی مردم را به هم نزدیک می کند. پارتون با لبخندی گسترده گفت، اما هیچ کدام از اینها بدون معلمان فداکاری که نسل بعدی را تشویق می کنند، الهام می بخشند و به آن ایمان دارند، اتفاق نمی افتد و به همین دلیل است که ما امشب را جشن می گیریم. از همه معلمان موسیقی برتر، می خواهم از شما برای اشتیاق، صبر و مراقبتی که هر روز به هنرجویان"}, {"source": "Hollywood Reporter", "title": "Robby Hoffman Snags Stand-Up Sequel at Netflix", "link": "https://www.hollywoodreporter.com/tv/tv-news/robby-hoffman-netflix-standup-special-2027-1236725897/", "summary": "The Emmy nominee, who debuted her first stand-up special on the streamer in December 2025, has struck a deal to return to Netflix with a new one-hour special set to debut globally in 2027.", "date_str": "2026-10-09T14:30:00+00:00", "hash": "dde871738a926ae8", "title_fa": "رابی هافمن دنباله استندآپ را در نتفلیکس گرفت", "summary_fa": "نامزد امی، که اولین استندآپ ویژه خود را در دسامبر 2025 در استریمر ارائه کرد، با یک مجموعه ویژه یک ساعته جدید برای اولین بار در سال 2027 به نتفلیکس بازگشت. مجری نامزد امی، که اولین استندآپ ویژه خود را در استریمر در دسامبر 2025 اجرا کرد، با Netflix در دسامبر 2025 باز خواهد گشت. یک فیلم ویژه یک ساعته جدید قرار است در سال 2027 در نتفلیکس به نمایش درآید. شرکت سازنده Rotten Science تولیدکننده این فیلم خواهد بود. هیچ جزئیات دیگری از جمله مکان و زمان ضبط این فیلم ویژه فاش نشده است. همانطور که گفته شد، این فیلم پس از اولین مورد، Robby Hoffman: Wake Up است که موضوعاتی مانند تربیت منحصر به فرد او به عنوان بخشی از یک خانواده بزرگ یهودی سابق Hasidic، صحت سیاسی، هویت جنسیتی و ضمایر، ثروت، موفقیت هالیوود و موارد دیگر را پوشش می دهد. همچنین هواگیری زیاد: این راهی برای رفتن به باشگاه برای من است. برای من شکایت لذت بردن، فهمیدن است. این یک کاتارسیس است. اگر سر شما فریاد بزنم، هیجان زده می شوم. من خوشحالم که با شما صحبت می کنم. داستان‌های مرتبط فیلم‌ها بررسی حیوانات: بن افلک کارگردانی می‌کند و ستاره‌های مقابل کری واشنگتن در یک فیلم هیجان‌انگیز پر از عناصر شاداب که باید بسیار خوشمزه‌تر باشد Cyberpunk 2077 فیلم اکشن زنده در پارامونت پیکچرز در حال توسعه است. مولانی در اوایل سال جاری در نتفلیکس که با دیوید لترمن به شوخی ظاهر شد، در مورد هافمن صحبت کرد و او را یک شخصیت اصلی خواند و اولین بازی خود را به سام کینیسون فقید و بزرگ تشبیه کرد، کسی که شما، مثل اینکه من هرگز در مورد کمدینی مانند این نشنیده بودم. من هرگز کسی را به این نترس ندیده ام. او افزود: وقتی او در سن دیگو در یک مکان در فضای باز روی"}, {"source": "Hollywood Reporter", "title": "‘The French Connection’: THR’s 1971 Review", "link": "https://www.hollywoodreporter.com/movies/movie-news/french-connection-review-movie-1236726151/", "summary": "On Oct. 9, 1971, the William Friedkin thriller starring Gene Hackman hit theaters enroute to winning the best picture Oscar.", "date_str": "2026-10-09T12:58:19+00:00", "hash": "733cac3ae28d99dc", "title_fa": "\"ارتباط فرانسوی\": بررسی 1971 THR", "summary_fa": "در 9 اکتبر 1971، فیلم مهیج ویلیام فریدکین با بازی جین هکمن به سینماها راه یافت تا برنده اسکار بهترین فیلم شود. در 9 اکتبر 1971، 20th-Fox فیلم The French Connection از ویلیام فریدکین را در سینماها رونمایی کرد. فیلم مهیج \"جین هکمن\" در چهل و چهارمین دوره جوایز اسکار 8 نامزدی دریافت کرد و برنده پنج جایزه از جمله بهترین بازیگر مرد، کارگردانی، نویسندگی، تدوین و تصویر شد. بررسی اصلی هالیوود ریپورتر، با عنوان فاکس کانکشن فرانسوی یک فیلم هیجان‌انگیز درجه یک است، در زیر آمده است: The French Connection پیش از این به مدت سه هفته در نیویورک باز شده است، جایی که گزارش شده است که در حال انجام کارهای اداری است. فهمیدن دلیل آن آسان است. این تصویر یک فیلم هیجان انگیز درجه یک در مورد تحقیق و سرکوب یک عملیات قاچاق هروئین است که بیشتر در نیویورک اتفاق می افتد و فیلمنامه آن توسط ارنست تیدیمن از کتاب رابین مور نوشته شده است. و کارگردان، ویلیام فریدکین، می‌دانست که در مورد چیست. تقریباً از همان ابتدا، می‌توانید احساس کنید که ماهیچه‌های معده‌تان سفت می‌شوند، زیرا می‌ترسید چیزی را از دست بدهید، و در طول فیلم، می‌توانید حس کنید که تماشاگران روی صندلی‌هایشان به جلو می‌لغزند و تلاش می‌کنند تا همه جزئیات را بگیرند. این یک فیلم فوق‌العاده خوب تدوین شده، با یک سکانس تعقیب و گریز تماشایی است که در آن مارسل بوزوفی، جدیدترین مردی که دوست داری متنفر است (او قاتل همجنس‌باز در Z بود)، در قطاری مرتفع با تپانچه‌اش در سر هادی است در حالی که پلیس با سرعت در حال تعقیب و گریز از زیر او است. عابر پیاده و تکیه گاه پیست و سایر خودروها. (فیلیپ دی آنتونی، تهیه‌کننده، بولیت را نیز تهیه کرده است.) و مملو از تکه‌های تند و خنده‌دار در اکشن و دیالوگ است: بوزوفی در حال پاره"}, {"source": "Hollywood Reporter", "title": "U.K. Box Office Back to Full Health — But What Lessons Do We Learn?", "link": "https://www.hollywoodreporter.com/movies/movie-news/uk-box-office-london-film-festival-odyssey-spider-man-imax-1236726105/", "summary": "Will the IMAX hype hold? Why does A24 deserve credit? Cinema programmers at three major theatrical players put their heads together and agree on the audience appetite for filmmakers with original stories.", "date_str": "2026-10-09T11:34:28+00:00", "hash": "fded1dcff7e05e3c", "title_fa": "بازگشت باکس آفیس بریتانیا به سلامت کامل - اما چه درس هایی می آموزیم؟", "summary_fa": "آیا هیپ IMAX ادامه خواهد داشت؟ چرا A24 مستحق اعتبار است؟ برنامه نویسان سینما در سه بازیگر اصلی تئاتر سرشان را کنار هم می گذارند و روی اشتهای تماشاگران برای فیلمسازانی با داستان های بدیع به توافق می رسند. واقعاً سال صداهای اصلی در گیشه است. فروش سینما در بریتانیا و ایرلند در حال حاضر 21 درصد نسبت به سال 2025 افزایش یافته است. چارلز گانت، سردبیر باکس آفیس اسکرین اینترنشنال، که صبح پنجشنبه میزبان جلسه انجمن صنعت جشنواره فیلم لندن BFI با برنامه نویسان سینما بود، از زمان شیوع بیماری همه گیر چنین رشدی را در سال به سال نداشتیم. نمایندگان سه بازیگر اصلی در بازار تئاتر کشور به او ملحق شدند: بن لیندون رئیس برنامه سینمای کرزن، مدیر برنامه‌نویسی در Picturehouse Carol McKay و مدیر برنامه BFI IMAX، مادلین مالت. این پنل در مورد وضعیت سینما در بریتانیا منعکس شد، بینش هایی را در مورد رفتارهای مخاطبان به اشتراک گذاشت و در مورد اینکه چگونه درس های آموخته شده از نسخه های اخیر می تواند برنامه های آینده آنها را شکل دهد، چه با ویژگی های جریان اصلی و چه مستقل. داستان های مرتبط Business Skydance s Gerhard Zeiler، Warner Bros. رئیس‌جمهور بین‌المللی، با نگاهی به فیلم‌های سیاسی ترک می‌کند سوفیا کاپولا قصد دارد به فیلم روایی بازگردد، اما آیا مادر فقیدش ماری آنتوانت را می‌سازد تا اول ببیند، تماشاگران بریتانیایی و ایرلندی نیز مانند دوستان ما در آن سوی آبگیر، با فیلم‌های موزیکال در فیلم‌های موزیکال: Anger, O Lookasis در فرانسوی (Donger, O Lookasis) به خوبی پاسخ داده‌اند. دنباله‌های (داستان اسباب‌بازی 5، شیطان پرادا 2 می‌پوشد، مرد عنکبوتی: روز کاملاً جدید، جادوی عملی 2)، اقتباس‌های دوره‌ای (ارتفاعات بی‌آب، حس و حساسیت) و فیلم‌های بزرگ و ساخته مولف (اودیسه، روز افشاگری) که در نهایت سال 2026 را تثبیت کردند."}, {"source": "Hollywood Reporter", "title": "Skydance’s Gerhard Zeiler, Warner Bros. Int’l President, to Depart With Eyes on Politics", "link": "https://www.hollywoodreporter.com/business/business-news/skydance-gerhard-zeiler-exit-eyes-political-role-1236726118/", "summary": "\"It is surprisingly difficult to find the right words to say goodbye,\" the Austrian writes in an internal memo obtained by The Hollywood Reporter. \"At the end of next week, I will leave the company.\"", "date_str": "2026-10-09T10:49:07+00:00", "hash": "985306a0913ffc3a", "title_fa": "گرهارد زیلر از اسکای‌دنس، رئیس بین‌المللی برادران وارنر، با نگاهی به سیاست کنار می‌رود", "summary_fa": "این اتریشی در یادداشتی داخلی که به هالیوود ریپورتر رسیده است، می نویسد: «پیدا کردن کلمات مناسب برای خداحافظی به طرز شگفت انگیزی دشوار است. در پایان هفته آینده، شرکت را ترک خواهم کرد. برادران پارامونت-وارنر ادغام شده توسط دیوید الیسون، که اکنون با نام Skydance شناخته می شود، اکنون که این ترکیب بزرگ کامل شده است، در حال دستخوش انواع تغییرات اجرایی است. گرهارد زیلر، که به عنوان رئیس، بین المللی برادران وارنر خدمت کرده است. دیسکاوری، آخرین مدیر اجرایی است که ترک کرده است و ممکن است به یک حرفه جدید در سیاست اتریش چشم دوخته باشد. زیلر اخیراً اعلام کرد که برای رهبری حزب سوسیال دموکرات اتریش که بخشی از دولت ائتلافی کشورش است و رئیس آن با درخواست هایی برای ایجاد راه برای یک رهبر جدید مواجه است، نمایشنامه خواهد ساخت. زیلر قبل از عقب نشینی و حمایت از یک نامزد دیگر، به جایگزینی رئیس فعلی حزب و معاون صدراعظم کشور، آندریاس بابلر، علاقه نشان داد، در حالی که قول داد در گفتمان سیاسی فعال باقی بماند و گفت که مردم در آینده نزدیک چیزهای زیادی از او خواهند شنید. در حالی که او هیچ برنامه سیاسی را مشخص نکرده است، اما این موضوع به بحث در مورد اینکه آیا او Skydance را ترک خواهد کرد یا خیر، انجامیده است. روز جمعه، زیلر خروج خود را رسمی کرد، اما به نقش سیاسی احتمالی خود اشاره نکرد. او در یک یادداشت داخلی شرکت که توسط هالیوود ریپورتر به دست آمده است، نوشت: در پایان هفته آینده، شرکت را ترک خواهم کرد. برخی از شما را چهار سال است که می شناسم. با بسیاری از شما، من هفت سال کار کرده ام. و با برخی از شما، من تقریباً پانزده سال از زندگی حرفه ای خود را به اشتراک گذاشته ام. این مدیر کهنه کار همچنین به اشتراک"}, {"source": "Hollywood Reporter", "title": "Sofia Coppola Plans Return to Narrative Film, But Has Her Late Mother’s ‘Making Marie Antoinette’ to See Off First", "link": "https://www.hollywoodreporter.com/movies/movie-news/sofia-coppola-making-marie-antoinette-eleanor-london-film-1236726091/", "summary": "The filmmaker spoke tenderly about seeing herself \"through her mother's eyes\" in the documentary, though recalled about lead star Kirsten Dunst: \"At the time, people didn't like her performance.\"", "date_str": "2026-10-09T09:46:33+00:00", "hash": "580281ea7d4a92a5", "title_fa": "سوفیا کاپولا قصد دارد به فیلم روایی بازگردد، اما باید ابتدا فیلم «ساخت ماری آنتوانت» از مادر مرحومش را ببیند.", "summary_fa": "این فیلمساز با ملایمت در مورد اینکه خود را از طریق چشمان مادرش در این مستند می بیند صحبت کرد، اگرچه در مورد ستاره اصلی کرستن دانست به یاد آورد: \"در آن زمان، مردم بازی او را دوست نداشتند.\" سوفیا کاپولا بعدازظهر پنجشنبه در جلسه جشنواره فیلم لندن BFI با مهربانی درباره میراث سینمایی مادر فقیدش و خانواده‌شان صحبت کرد. برنده اسکار که بیشتر برای کارگردانی خودکشی‌های باکره (1999)، گمشده در ترجمه (2003) و ماری آنتوانت (2006) شناخته می‌شود، اعتراف کرد که نمی‌توانست فیلم دوم را بدون موفقیت جوایز بیل موری و اسکارلت جوهانسون در ژانر توکیویی بسازد. او به مصاحبه‌گر ادیت بومن در سالن رویال فستیوال لندن گفت که شما به نوعی یک مجوز رایگان دریافت می‌کنید تا هر کاری را که می‌خواهید انجام دهید. من قبلاً نمی توانستم [ماری آنتوانت] را بسازم زیرا فیلمی در مقیاس بزرگ و پرهزینه بود. بنابراین چون [گمشده در ترجمه] موفق بود، مردم [در حال] نزدیک شدن به من بودند، می‌خواهی چه کار کنی؟ داستان‌های مرتبط فیلم‌ها، جان وکس از دیزنی می‌گوید درام پر جنب و جوش امپراتوری که دوباره ازدواج کرده است، موادی برای تطابق با فیلم‌های تماشایی اش دارد. برداشتی بسیار پر جنب و جوش و شیرین از ملکه بدبخت قرن 18 فرانسه با کریستن دانست در نقش اصلی. النور کاپولا که در سال 1971 سوفیا را با فیلمساز همکارش فرانسیس فورد کاپولا داشت، دوربین را روی دخترش چرخاند و بیش از 80 ساعت از پشت صحنه و اکشن سر صحنه فیلمبرداری کرد، در حالی که به معنای تماشای دختر 34 ساله اش در محل کار برای مادر بود. مستند ساختن ماری آنتوانت که توسط سوفیا کاپولا و تدوینگر آرون متیوز با نظرات دوستان نزدیک النور مونتاژ شده است، در هفتادمین جشنواره فیلم لندن، دو سال و نیم پس از مرگ کاپولا، در اینجا نمایش داده می شود."}, {"source": "Hollywood Reporter", "title": "Disney’s Jon Wax Says Buzzy K-Drama ‘The Remarried Empress’ Has Substance to Match Its Spectacle", "link": "https://www.hollywoodreporter.com/movies/movie-news/disney-the-remarried-empress-has-substance-spectacle-1236726072/", "summary": "Speaking at an MPA and Disney+ event during the Busan International Film Festival, the executive surveyed Disney’s Asian originals slate and discussed the trends shaping the region’s streaming business, from Korean co-productions to opportunities in anime.", "date_str": "2026-10-09T08:29:18+00:00", "hash": "d2265185b9f778b5", "title_fa": "جان وکس از دیزنی می گوید درام پر سر و صدا K-Drama «The Remarried Empress» دارای موادی است که با تماشای آن مطابقت دارد.", "summary_fa": "مدیر اجرایی در یک رویداد MPA و Disney+ در طول جشنواره بین‌المللی فیلم بوسان، نسخه‌های اصلی آسیایی دیزنی را مورد بررسی قرار داد و در مورد روندهای شکل‌دهی به تجارت استریم منطقه، از تولید مشترک کره‌ای تا فرصت‌ها در انیمیشن بحث کرد. Jon Wax از دیزنی می گوید The Remarried Empress، درام صحنه و لباس کره ای مجلل که قرار است روز جمعه در بوسان به نمایش درآید، دارای محتوایی است که با تماشای آن مطابقت دارد. این سریال یک شرط بندی با بودجه کلان برای دیزنی + است که یک وبتون بسیار محبوب با حدود 3 میلیارد بازدید در سراسر جهان را به یک سریال عاشقانه مجلل اقتباس می کند. و قبل از پخش جریانی آن، علائم دلگرم کننده هستند. به گزارش مطبوعات محلی، بلیت های پیش نمایش سه قسمتی جشنواره بین المللی فیلم بوسان بلافاصله فروخته شد. ستارگان شین مین آ، جو جی هون، لی جونگ سوک و لی سه یونگ نیز قرار بود در شهر ظاهر شوند. داستان‌های مرتبط فیلم‌هایی که برد برد در فیلم بالاخره ساخت ری گان، اجرای زنده او و وقتی همه چیز در فیلم‌های دیزنی سیاسی شد، کارگردان انیمیشن ماساکی یواسا قرار است سرپرستی نمایشگاه فیلم کلاسیک فست تورنتو وکس، معاون اجرایی تلویزیون اصلی بین‌المللی در دیزنی اینترتینمنت را برعهده بگیرد، این مجموعه با حمایت کاندیو و کاندیشن با حمایت کاندیو و کاندیشن، درباره این مجموعه بحث کرد. شورای فیلم کره جلسه BIFF که توسط پاتریک برزسکی، رئیس دفتر آسیای هالیوود ریپورتر اداره می‌شد، پس از سخنان افتتاحیه اورمیلا ونوگوپالان، نماینده MPA و سرمایه‌گذاری دیزنی پلاس در آثار اصلی آسیا-اقیانوسیه و مشارکت‌های خلاقانه برای کمک به داستان‌های محلی برای رسیدن به مخاطبان جهانی بررسی شد. ملکه ازدواج مجدد دارای برخی از عناصر آشنای دیزنی عاشقانه، درام و لباس های خیره کننده فراوان است، اما همچنان یک درام عمیقاً کره ای است."}, {"source": "Hollywood Reporter", "title": "‘Queer Edward II’ Gives an Inside Look at Derek Jarman’s Film and Timely Historical Snapshot of a Queer Rights Backlash", "link": "https://www.hollywoodreporter.com/movies/movie-news/queer-edward-ii-film-derek-jarman-queer-rights-backlash-lff-1236725662/", "summary": "Theo Rollason discusses his feature directorial debut, exec produced by Tilda Swinton and Sandy Powell, now screening at the London Film Fest, and how “anti-trans rhetoric and attacks on queer rights [are] again intensifying.”", "date_str": "2026-10-09T08:00:00+00:00", "hash": "bf2669a2e8d3cbef", "title_fa": "«دگرباش ادوارد دوم» نگاهی درونی به فیلم درک ژرمن و عکس لحظه‌ای تاریخی از واکنش شدید حقوق کوییر می‌دهد.", "summary_fa": "تئو رولاسون درباره اولین کارگردانی بلند خود به تهیه کنندگی تیلدا سوینتون و سندی پاول که اکنون در جشنواره فیلم لندن نم MEA تبدیل شده است. استودیوی بی‌بی‌سی، بازوی تجاری پخش‌کننده عمومی بریتانیا، در حال افزایش دو برابری در اسپانیا و پرتغال است و اخیراً سه قرار ملاقات برای گسترش فعالیت‌های خود در این کشورها و راه‌اندازی یک مرکز اختصاصی مادرید برای کانال‌ها و کسب‌وکار پخش خود دارد. تیم Channels Streaming Iberia وظیفه دارد از عملیات رو به رشد FAST، پخش جریانی و تبلیغاتی شرکت در سراسر اسپانیا و پرتغال پشتیبانی کند. دیوید اورگل پی رِز، مدیر کشور، رهبری این تیم را بر عهده خواهد داشت. او بر استراتژی تجاری در سراسر منطقه نظارت خواهد کرد، روابط با توزیع، پلتفرم و شرکای تبلیغاتی را گسترش خواهد داد، در حالی که فرصت های تجاری جدید را نیز شناسایی خواهد کرد. او پیش از این پس از ایفای نقش های ارشد در کانال های بین المللی پارامونت و فاکس، به عنوان معاون توزیع و مشارکت در SkyShowtime خدمت می کرد. اخیراً، او مشاور خود، Neos Media را اداره می کرد. داستان‌های مرتبط فیلم‌هایی که برد برد در نهایت ساخت ری گان، اجرای لایو اکشن او و وقتی همه چیز در فیلم‌های دیزنی سیاسی شد، کارگردان انیمیشن، ماساکی یواسا قرار است سرپرستی نمایشگاه فیلم کلاسیک فستیوال تورنتو را برعهده بگیرد، دو نفر دیگر که برای مرکز ایبریا استخدام شده‌اند، کارلوس ام انجین، رئیس بخش بازاریابی، و مدیر برنامه‌نویسی می‌کوه هستند. THR با سه نفر در مورد فرصت مثبت استودیو بی بی سی برای اسپانیا و پرتغال تماس گرفت. در اعلام نقش جدید شما اشاره شد که اسپانیا یکی از بازارهای با رشد سریع ما در جنوب اروپا است و تقاضای زیادی برای محتوای بریتانیایی ممتاز دارد. کدام بخش ها و گرایش های مخاطبان در اسپانیا باعث این علاقه به برنامه نویسی بریتانیا شده است؟"}, {"source": "Hollywood Reporter", "title": "‘Avatar: Seven Havens’ Review: Paramount+’s Promising Addition to a Beloved Fantasy Franchise", "link": "https://www.hollywoodreporter.com/tv/tv-reviews/avatar-seven-havens-review-paramount-1236723958/", "summary": "Co-creators Michael Dante DiMartino and Bryan Konietzko return with a new fantasy series set after the events of 'The Last Airbender' and 'The Legend of Korra.'", "date_str": "2026-10-09T07:00:00+00:00", "hash": "bff2baf7d4626f61", "title_fa": "نقد و بررسی هانی، به یونان افتخار می‌کند و تایوان را مورد توجه قرار می‌دهد.", "summary_fa": "لیون، فرانسه – بازارهای فیلم کلاسیک بین‌المللی‌تر می‌شوند و بازار بین‌المللی فیلم کلاسیک (MIFC)، بخشی از جشنواره لومیر لیون و یکی از جلسات تجاری بسیار نادر در جهان است که برای تجارت فیلم‌های میراثی برگزار می‌شود. به همین ترتیب، فیلم‌های کلاسیک مخاطبان بیشتری را به‌ویژه در بین تماشاگران جوان سینما جذب می‌کنند. هر دو گرایش [ ] شرکت‌هایی که در بازار بین‌المللی فیلم کلاسیک لیون شرکت می‌کنند عبارتند از پارامونت، پارک سیرک، استودیوکانال و برادران وارنر، که مخاطبان را با انتشار مجدد فیلم شیاطین راسل از کن راسل همراهی می‌کنند. برای تجارت فیلم میراثی. به نظر می‌رسد که هر دو روند در MIFC امسال، که در لیون طی 13 تا 16 اکتبر از بین می‌رود، ظاهر شوند. داستان‌های مرتبط ریچارد لینکلیتر می‌گوید «Merily We Roll Along» تا «چند ماه دیگر» دوباره فیلم‌برداری را آغاز می‌کند و «گزارش پیشرفت» را درباره تولید 20 ساله ارائه می‌دهد: «شما را در سال 2040 می‌بینم» در مهم‌ترین رویدادهای بازار فیلم کلاسیک امسال، Charlotte Barker از پارامونت به پنل CE-Daglas-Parcus در Park Axon می‌پیوندد. مدلی برای توزیع فیلم کلاسیک و حقوق. پائولو مورتی، رئیس دپارتمان سینمای دانشگاه ECAL، سینماهای ژنو و صندوق فیلم Fondazione Prada، که در کلاه‌های متنوع پوشیدن محبوب است، در گفتگوی ویژه شرکت خواهد کرد. اسپنسر کولانتس، معاون بخش Clockwork، بخش تخصصی فیلم برادران وارنر، یک مطالعه موردی در مورد اکران مجدد فیلم جنجالی شیاطین محصول 1971 کن راسل ارائه خواهد کرد."}, {"source": "Variety", "title": "Australian Classic ‘Caddie,’ Considered a Landmark Film of Australia’s New Wave, Acquired by Potential Films Ahead of Lumière Film Festival Premiere", "link": "https://variety.com/2026/film/global/australia-classic-caddie-potential-films-lumiere-mifc-1236906437/", "summary": "Potential Films, one of Australia’s leading independent distributors, has acquired worldwide rights to the newly restored 1976 drama “Caddie,” by Donald Crombie. Considered a landmark film of Australia’s New Wave, the film is screening at the Lumière Film Festival in Lyon and wil     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
