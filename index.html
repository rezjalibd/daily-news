د. نحوه دریافت 50 درصد تخفیف برای سگ فارمز برای استفاده از 50 درصد تخفیف برای اولین جعبه خود، ابتدا باید اطلاعاتی درباره سگ خود در اختیار The Farmer's Dog قرار دهید تا اطمینان حاصل کنید که نیازهای غذایی او برآورده شده است. نحوه شروع به این صورت است: از صفحه ثبت نام The Farmer's Dog دیدن کنید و روی «ادامه» کلیک"}, {"source": "Business Insider", "title": "Peter Thiel says he worries it will be hard for JD Vance or Marco Rubio to win in 2028", "link": "https://www.businessinsider.com/peter-thiel-vance-2028-chances-democrats-democratic-socialists-2026-9", "summary": "Billionaire Peter Thiel talks during an interview with Axel Springer CEO Mathias Döpfner. Axel Springer Peter Thiel says he thinks his friend JD Vance may have a difficult path to the White House. The billionaire said he's more interested in what Democrats do ahead of the 2028 election. The PayPal cofounder said there's a roughly 50% chance Democrats nominate a democratic socialist. PayPal cofounder Peter Thiel says he's worried about whoever Republicans put forth in 2028, even if it's his ally Vice President JD Vance. During an interview on the \"MD Meets\" podcast posted on Thursday, Axel Springer CEO Mathias Döpfner asked Thiel whether he thinks Vance or Secretary of State Marco Rubio would be a better GOP standard-bearer in 2028. \"I am still a Vance partisan ,\" Thiel said. \"I worry that it will be very hard for either candidate to win. And so, I don't know, my pessimistic thought is that that's the wrong question.\" Before he entered politics, Vance worked at Mithril Capital, a firm Thiel cofounded. In his new memoir, Vance wrote about Thiel's effect on his life and called his mentor \"possibly the smartest person I'd ever met.\" During Vance's heated 2022 Ohio US Senate GOP primary, Thiel donated $15 million to a pro-Vance super PAC, which, alongside Trump's endorsement, helped propel the future vice president to victory. Thiel, who has described himself as a libertarian, has become a GOP megadonor, though he mostly stayed away from the 2024 election. Earlier this year, Thiel made a $3 million donation to a group that has worked to propose California's proposed one-time wealth tax. In February, Trump told reporters that both men were \"fantastic\" and he didn't have to worry about his successor. Speculation about who Trump will endorse and what other, if any, Republicans will enter the field will increase after November's midterm elections, the traditional time when White House hopefuls begin to make their moves. Instead of focusing on the GOP, Thiel told Döpfner that he's more interested in what happens inside the Democratic Party. Thiel said that a potential GOP wipeout this November could lead Democrats to choose a democratic socialist as their nominee in 2028. Prediction markets widely expect Democrats to retake the House (which is in line with historic norms), but it remains to be seen which party will win the Senate. \"The Democrats will think that they will win no matter what in 2028,\" Thiel said. \"And therefore, there probably will not be, you know, a", "date_str": "2026-09-24T20:14:43+00:00", "hash": "7802284dbc69a4f3", "title_fa": "پیتر تیل می گوید نگران است که جی دی ونس یا مارکو روبیو در سال 2028 برنده شوند.", "summary_fa": "میلیاردر پیتر تیل طی مصاحبه ای با ماتیاس دوپفنر، مدیرعامل اکسل اسپرینگر صحبت می کند. اکسل اسپرینگر پیتر تیل می گوید که فکر می کند دوستش جی دی ونس ممکن است مسیر دشواری برای رسیدن به کاخ سفید داشته باشد. این میلیاردر گفت که بیشتر به کارهایی که دموکرات ها پیش از انتخابات 2028 انجام می دهند علاقه مند است. یکی از بنیانگذاران PayPal گفت که تقریباً 50 درصد احتمال دارد که دموکرات ها یک سوسیالیست دموکرات را نامزد کنند. پیتر تیل، یکی از بنیانگذاران PayPal می‌گوید که نگران کسانی است که جمهوری‌خواهان در سال 2028 معرفی می‌کنند، حتی اگر معاون او، جی دی ونس، معاون او باشد. طی مصاحبه‌ای در پادکست «MD Meets» که در روز پنجشنبه منتشر شد، ماتیاس دوپفنر، مدیرعامل اکسل اسپرینگر از تیل پرسید که آیا فکر می‌کند ونس یا مارکو روبیو، وزیر امور خارجه، استاندارد بهتری در سال 2028 خواهند بود. تیل گفت: «من هنوز یک پارتیزان ونس هستم. من نگران هستم که برای هر یک از نامزدها پیروزی بسیار سخت باشد. و بنابراین، نمی‌دانم، فکر بدبینانه من این است که این سؤال اشتباهی است.\" ونس قبل از ورود به سیاست در Mithril Capital کار می‌کرد، شرکتی که Thiel یکی از بنیانگذاران آن بود. ونس در خاطرات جدید خود در مورد تأثیر تیل بر زندگی‌اش نوشت و مربی خود را \"احتمالاً باهوش‌ترین فردی که در دوره مقدماتی G20 در ایالات متحده ملاقات کرده‌ام.\" تیل 15 میلیون دلار به یک سوپر PAC طرفدار ونس اهدا کرد که در کنار تایید ترامپ، به پیروزی معاون رئیس جمهور آینده کمک کرد. تیل، که خود را یک آزادی خواه توصیف کرده است، به یک مگادونور حزب جمهوری خواه تبدیل شده است، اگرچه او بیشتر از انتخابات 2024 دور ماند. در اوایل سال جاری، تیل 3 میلیون دلار کمک مالی به گروهی که برای پیشنهاد مالیات بر دارایی یکباره پیشنهادی"}, {"source": "Business Insider", "title": "Jon Hamm, 55, says he's taking a year off work as he prepares to become a first-time dad", "link": "https://www.businessinsider.com/jon-hamm-taking-year-off-paternity-leave-2026-9", "summary": "Jon Hamm and his wife, Anna Osceola, in September 2026. LISA O CONNOR/AFP/Getty Images Jon Hamm is about to become a first-time dad. After a decade of appearing in four to five projects a year, he told Andy Cohen he's taking a break. Cohen called him the \"Nicole Kidman of males,\" referring to both stars' work ethic. You've been seeing a lot of Jon Hamm lately, but don't take it for granted. The \"Your Friends Neighbors\" star, 55, appeared on Andy Cohen's SiriusXM show, \"Andy Cohen Live,\" on Thursday and discussed many things, including his new show, \"American Hostage,\" and impending fatherhood. He said that his wife, Anna Osceola, 38, is \"two months away\" from giving birth to their first child. After the baby arrives, the plan is \"that I'm basically taking the year off,\" he said. Jon Hamm and Anna Osceola in September 2026. Michael Simon/GC Images/Getty Images \"Well, good,\" Cohen responded, \"because you're the Nicole Kidman of males,\" referring to Hamm's and Kidman's huge bodies of work over the last few years. Since 2020, Hamm has appeared in 16 TV shows and 12 movies. That puts Kidman's numbers — nine and nine, respectively — to shame. 'Exciting and anxiety-inducing' Hamm has been married to Osceola since 2023, after they met on the set of \"Mad Men\" in 2015, though they didn't begin dating until 2020. This will be their first child, and they do not know if they're having a boy or a girl. \"It's very exciting,\" Hamm told Cohen. \"And nervous-making, and anxiety-inducing, and all the other things. But the largest piece of the feelings pie is excitement.\" The \" Mad Men \" actor has spoken about potentially becoming a father before, including in a 2024 profile by The Hollywood Reporter. \"I hope it turns into kids,\" he said at the time. \"It's not lost on me that I'm 53. I will be the old dad, but so it goes. It could be a good thing. We'll see.\" He also joked with Seth Meyers recently about being an \"old dad,\" and the two bonded about having young kids while in their 50s. Cohen, the father of a 7-year-old and a 4-year-old at 58, can relate, too. Jon Hamm and Andy Cohen in 2025. Cindy Ord/Getty Images for SiriusXM So cherish all eight episodes of \"American Hostage\" — it might be the last we see of Hamm until 2028. Read the original article on Business Insider", "date_str": "2026-09-24T19:54:46+00:00", "hash": "92b7b965ecacea52", "title_fa": "جان هام، 55 ساله، می گوید که برای اولین بار پدر شدن، یک سال از کارش مرخصی می گیرد.", "summary_fa": "جان هام و همسرش، آنا اوسئولا، در سپتامبر 2026. LISA O CONNOR/AFP/Getty Images جان هام برای اولین بار پدر می شود. پس از یک دهه حضور در چهار تا پنج پروژه در سال، او به اندی کوهن گفت که در حال استراحت است. کوهن با اشاره به اخلاق کاری هر دو ستاره، او را «نیکول کیدمن مردانه» نامید. اخیراً جون هام زیادی را می بینید، اما آن را بدیهی نگیرید. ستاره 55 ساله \"Your Friends Neighbors\" روز پنجشنبه در برنامه اندی کوهن SiriusXM، \"Andy Cohen Live\" ظاهر شد و درباره چیزهای زیادی از جمله برنامه جدید خود، \"گروگان آمریکایی\" و پدر شدن قریب الوقوع صحبت کرد. او گفت که همسرش، آنا اوسئولا، 38 ساله، \"دو ماه\" تا تولد اولین فرزندشان فاصله دارد. او گفت: پس از آمدن نوزاد، برنامه این است که \"من اساساً سال را تعطیل می کنم.\" جان هام و آنا اوسئولا در سپتامبر 2026. مایکل سیمون/GC Images/Getty Images کوهن با اشاره به حجم عظیم کار هام و کیدمن در چند سال گذشته پاسخ داد: «خب، خوب، چون تو نیکول کیدمن مردان هستی». از سال 2020، هام در 16 برنامه تلویزیونی و 12 فیلم ظاهر شده است. این باعث شرمساری اعداد کیدمن - به ترتیب نه و نه - می شود. هام «هیجان‌انگیز و مضطرب» از سال 2023 با اوسئولا ازدواج کرده است، پس از آن‌که در سال 2015 سر صحنه فیلم «مردان دیوانه» با هم آشنا شدند، هرچند که تا سال 2020 شروع به ملاقات نکردند. این اولین فرزند آنها خواهد بود و آنها نمی دانند که آیا پسر دارند یا دختر. هام به کوهن گفت: «خیلی هیجان انگیز است. \"و عصبی‌ساز، و اضطراب‌آور، و همه چیزهای دیگر. اما بزرگترین بخش از پای احساسات، هیجان است.\" بازیگر «مردان دیوانه» قبلاً در مورد احتمال پدر شدن صحبت کرده است، از جمله در پروفایل سال 2024 توسط هالیوود ریپورتر."}, {"source": "Business Insider", "title": "Oracle's 'force majeure' notice raises questions about the company's ability to deliver on AI data centers", "link": "https://www.businessinsider.com/oracle-force-majeure-raises-questions-delivering-ai-data-center-2026-9", "summary": "Illustration by Thomas Fuller/SOPA Images/LightRocket via Getty Images Oracle reportedly sent a force majeure notice to Blue Owl Capital related to Project Jupiter. Jupiter is Oracle's flagship AI data center project to add much-needed capacity. The notice raised investor questions about Oracle's ability to deliver on its AI expansion. Oracle's move to protect itself against a potential delay for its flagship AI data center project has Wall Street questioning whether the company can deliver the capacity needed to support its AI business. Oracle sent a force majeure notice to Stack Infrastructure, the Blue Owl Capital-owned developer of Project Jupiter, a planned AI data center in New Mexico. Such notices can allow companies to suspend some contractual obligations when events outside their control disrupt a project. Bloomberg earlier reported on the notice. Oracle said the project remains on schedule . \"Force-majeure notices are commonplace in developments of this scale and are often used to preserve contractual rights among project partners,\" Michael Egbert, an Oracle spokesperson, said. \"They do not, by themselves, establish a project delay or change delivery expectations.\" \"Blue Owl, STACK Infrastructure and Oracle remain fully aligned on Project Jupiter,\" the spokesperson said. \"This notice does not change the financial commitments to this multiyear project.\" Oracle shares were down about 4% on Thursday afternoon amid investor questions about the company's ability to deliver on its massive AI infrastructure expansion. The notice \"signals the company's own risk assessment on execution has shifted enough to warrant legal cover,\" RBC Capital Markets analyst Rishi Jaluria wrote in a note to investors, meaning Oracle believes the risk of delay has increased. Oracle has borrowed tens of billions of dollars to finance new data centers as it races to meet what it says is surging demand for AI computing. That strategy depends not only on signing customers but also on bringing enough new capacity online to convert its growing backlog of contracts into revenue. Business Insider previously reported that some banks and institutional investors were growing wary of taking on too much exposure to Oracle, as lenders sought to distribute debt tied to its Stargate data centers. Oracle reported $28.5 billion in first-quarter capital expenditures , up from $8.5 billion a year earlier, and maintained its fiscal 2027 capital expenditure forecast at $90 billion to $95 billion.", "date_str": "2026-09-24T19:53:57+00:00", "hash": "514589d71b211af3", "title_fa": "اعلامیه «فورس ماژور» اوراکل سؤالاتی را در مورد توانایی این شرکت در ارائه مراکز داده هوش مصنوعی ایجاد می کند.", "summary_fa": "تصویر توسط توماس فولر/SOPA Images/LightRocket از طریق Getty Images گزارش شده است که اوراکل یک اخطار فورس ماژور به Blue Owl Capital مربوط به پروژه مشتری ارسال کرده است. Jupiter پروژه مرکز داده هوش مصنوعی Oracle است تا ظرفیت بسیار مورد نیاز را اضافه کند. این اطلاعیه سؤالاتی را در مورد توانایی اوراکل در ارائه توسعه هوش مصنوعی خود برای سرمایه گذاران ایجاد کرد. اقدام اوراکل برای محافظت از خود در برابر تاخیر احتمالی پروژه مرکز داده شاخص هوش مصنوعی، وال استریت را زیر سوال می برد که آیا این شرکت می تواند ظرفیت مورد نیاز برای حمایت از تجارت هوش مصنوعی خود را ارائه دهد یا خیر. اوراکل یک اخطار فورس ماژور را به Stack Infrastructure، توسعه دهنده پروژه Jupiter متعلق به Blue Owl Capital، یک مرکز داده برنامه ریزی شده هوش مصنوعی در نیومکزیکو ارسال کرد. چنین اخطاریه‌هایی می‌توانند به شرکت‌ها اجازه دهند تا برخی از تعهدات قراردادی را زمانی که رویدادهای خارج از کنترل آنها باعث اختلال در پروژه می‌شود، تعلیق کنند. بلومبرگ پیشتر در مورد این اطلاعیه گزارش داده بود. اوراکل گفت که پروژه طبق برنامه باقی می ماند. مایکل اگبرت، سخنگوی اوراکل، گفت: «اعلامیه‌های فورس ماژور در توسعه‌هایی در این مقیاس رایج است و اغلب برای حفظ حقوق قراردادی بین شرکای پروژه استفاده می‌شود.» آنها به خودی خود تاخیر پروژه را ایجاد نمی کنند یا انتظارات تحویل را تغییر نمی دهند. سخنگوی این شرکت گفت: «جغد آبی، زیرساخت STACK و اوراکل به طور کامل با پروژه مشتری هماهنگ هستند. این اطلاعیه تغییری در تعهدات مالی این پروژه چند ساله ایجاد نمی کند.» سهام اوراکل در بعدازظهر پنج‌شنبه حدود 4 درصد کاهش یافت و در میان سؤالات سرمایه‌گذاران درباره توانایی این شرکت برای توسعه زیرساخت‌های هوش مصنوعی عظیم خود، افت کرد. ریشی جالوریا، تحلیلگر RBC Capital Markets در یادداشتی خطاب به سرمایه گذاران نوشت: این اطلاعیه"}, {"source": "Business Insider", "title": "Margaux shoes review: Our honest take after 4 years of wear", "link": "https://www.businessinsider.com/guides/style/margaux-shoes-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Are Margaux shoes worth it? Here s what we learned about its unique size system and most comfortable styles. Sally Kaplan, Gabrielle Chase/Business Insider It's a painful pill to swallow when I realize that those very expensive leather shoes are never going to fit right, no matter how much I try breaking them in. By offering half sizes and three width options, Margaux has become one of our team's go-to sources for comfortable women's dress shoes . There's just one major caveat: the inconsistent size system. For instance, I wear my Demi ballet flats just about everywhere, but I've also been disappointed by some heeled boots that pinch my toes when I walk. The timeless designs, beautiful luxury-grade leather, and Spanish craftsmanship are all enticing, but I only consider Margaux shoes worth it if you can nail the fit. How do Margaux shoes fit? I wear a size US 8, and my feet are a regular width. After four years and an exasperating amount of returns, I've cracked the code: Most styles run narrow, and because I have longer toes, I require a half size up (an EU 38.5) to avoid overcrowding. If your feet are even slightly wide and you have toes proportionate to the length of your foot, choose your usual size, but go up to a wide fit. Only order a narrow fit if you have very slim or low-volume feet. Below are our notes on each pair we tested so you can compare them with your own fit issues. The Demi Gabrielle Chase/Business Insider Key details: Adjustable bow tie, almond toe Sizes: US 3.5-13 (EU 33.5-44) in narrow, medium, or wide Our fit tip: They run slightly small in length. If your feet are even slightly wide, choose the wide fit. The Demis are my gold standard for ballet flats. The medium-shine Nappa leather is loosely structured so the more I wear them, the more glove-like they feel. Despite their soft shape, the low vamp creates a feminine, elongating effect as seen with Repettos or Ballerettes. \"It has a rounded toe, functional bow that tightens for a custom fit, and soft leather that molds to your feet. It's perfect in every way, save for the slight blister it gave me on my heel the first day I broke them in (and no days after that). There's just enough cushioning for me to feel supported when commuting, but not so much that the shoe loses its unstructured, simple aesthetic,\" says executive editor Sally Kaplan. The Demis run a half size small. I ordered my usua", "date_str": "2026-09-24T19:49:13+00:00", "hash": "e94ed209dc9df18a", "title_fa": "بررسی کفش Margaux: برداشت صادقانه ما پس از 4 سال استفاده", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید آیا کفش های Margaux ارزشش را دارند؟ در اینجا چیزی است که ما در مورد سیستم اندازه منحصر به فرد و راحت ترین سبک ها یاد گرفتیم. سالی کاپلان، گابریل چیس/ بیزینس اینسایدر وقتی متوجه می شوم که آن کفش های چرمی بسیار گران قیمت، هر چقدر هم که سعی می کنم آن ها را بشکنم، هرگز درست نمی شوند، آن را قورت بدهم. با ارائه نیم سایز و سه گزینه عرض، Margaux به یکی از منابع اصلی تیم ما برای کفش های مجلسی زنانه راحت تبدیل شده است. فقط یک نکته مهم وجود دارد: سیستم اندازه ناسازگار. به عنوان مثال، من تقریباً همه جا دمی باله‌ام را می‌پوشم، اما از برخی چکمه‌های پاشنه‌دار که هنگام راه رفتن به انگشتان پایم فشار می‌آورند نیز ناامید شده‌ام. طرح‌های همیشگی، چرم‌های لوکس زیبا و صنایع دستی اسپانیایی همگی فریبنده هستند، اما من فقط کفش‌های Margaux را ارزش آن را می‌دانم که بتوانید میخ‌های مناسب را بچسبانید. کفش Margaux چگونه مناسب است؟ من سایز US 8 می پوشم و پاهایم پهنای معمولی دارند. پس از چهار سال و مقدار خشمگینی از بازگشت، کد را شکستم: اکثر استایل ها باریک هستند، و چون انگشتانم بلندتر است، برای جلوگیری از ازدحام بیش از حد نیاز به اندازه نصف (38.5 EU) دارم. اگر پاهای شما حتی کمی پهن است و انگشتان شما متناسب با طول پا است، سایز معمولی خود را انتخاب کنید، اما تا اندازه پهن بالا بروید. فقط در صورتی که پاهای خیلی باریک یا کم حجم دارید، یک لباس باریک سفارش دهید. در زیر یادداشت‌های ما در مورد هر جفتی که آزمایش کردیم آمده است تا بتوانید آنها را با مشکلات تناسب خود مقایسه کنید. Demi Gabrielle Chase/Business Insider جزئیات کلیدی: پاپیون قابل تنظیم،"}, {"source": "Business Insider", "title": "Honeylove bra review: My honest take as a DD cup", "link": "https://www.businessinsider.com/guides/style/honeylove-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Rebecca Strong/Business Insider Honeylove is known for its comfortable shapewear, but the item I was most excited to test is its wireless bras. As someone who has a large bust but hates the rigidity of an underwire, I wanted to see if they could offer genuine support without sacrificing comfort. With that in mind, I tried three of the brand's most popular bras for my Honeylove review: the CrossOver Bra , SoftForm Bra , and Silhouette Bra . I also tested a few more of their bestsellers that I'd been seeing all over Instagram: the SuperPower Short and Tank Bodysuit . My main takeaway: Honeylove bra bands run a tiny bit large and are not totally immune to stretching, so size down if you fit somewhere in between. That said, my favorites are the Silhouette Bra and CrossOver Bra for their ability to support DD cups without any stiff underwire. For more comfortable intimates, check out our guides to the best bras for large busts , the best shapewear bodysuits , and the best underwear for women . Sizing advice I found that certain items run a little large in the band, but not quite enough to advise sizing down completely. Stick with your usual size, and if you're willing to order an alternative, try sizing down on the band to see if that works better for you (especially if you tend to be in between band sizes). You can see my thoughts below on the specifics of each style before you decide which ones might work best for your bust size. What's the difference between the CrossOver Bra, SoftForm Bra, and Silhouette Bra? The CrossOver Bra is a great option if you want customizable lift and versatility, thanks to its adjustable straps, adjustable band, and convertible design. The SoftForm Bra feels the softest and most lounge-friendly, with smoothing through the back and sides, but it offers a little less separation than the others. The Silhouette Bra delivered the best combination of support, lift, and separation, and its low-back design makes it especially useful under different necklines and outfits. Honeylove CrossOver Bra review Rebecca Strong Pros: Adjustable band and straps, convertible straps, four hook settings on the band, seamless construction, lots of color options Cons: Band fits a little loose Before trying the Honeylove CrossOver Bra , I had pretty much given up on finding a wireless bra that actually held my chest up. What makes this one work so well is that the", "date_str": "2026-09-24T19:23:01+00:00", "hash": "8844f32b6733e11f", "title_fa": "بررسی سوتین Honeylove: برداشت صادقانه من به عنوان یک فنجان DD", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید Rebecca Strong/Business Insider Honeylove به خاطر لباس های فرم راحت خود شناخته شده است، اما موردی که من بیشتر از همه برای آزمایش آن هیجان زده بودم سوتین های بی سیم آن است. به عنوان کسی که نیم تنه بزرگی دارد اما از سفتی سیم زیرین متنفر است، می‌خواستم ببینم که آیا می‌توانند بدون از دست دادن راحتی، حمایت واقعی ارائه دهند. با در نظر گرفتن این موضوع، من سه مورد از محبوب‌ترین سوتین‌های این برند را برای بررسی Honeylove خود امتحان کردم: سوتین CrossOver، سوتین SoftForm و Silhouette. من همچنین چند مورد دیگر از پرفروش‌ترین‌های آنها را که در سراسر اینستاگرام می‌دیدم، آزمایش کردم: SuperPower Short and Tank Bodysuit. غذای اصلی من: نوارهای سوتین Honeylove کمی بزرگ هستند و کاملاً در برابر کشش مصون نیستند، بنابراین اگر جایی بین آنها قرار می گیرید اندازه آن را کاهش دهید. با این حال، موارد مورد علاقه من، سوتین Silhouette و CrossOver Bra به دلیل توانایی آنها در پشتیبانی از فنجان های DD بدون هیچ گونه سیم سفت است. برای داشتن روابط صمیمی راحت‌تر، راهنمای ما در مورد بهترین سوتین‌ها برای سینه‌های بزرگ، بهترین لباس‌های بدن و بهترین لباس‌های زیر زنانه را بررسی کنید. توصیه‌های اندازه‌گیری متوجه شدم که برخی از اقلام در باند کمی بزرگ هستند، اما به اندازه کافی برای کاهش اندازه کامل نیستند. به اندازه معمول خود بچسبید، و اگر مایل به سفارش یک جایگزین هستید، سعی کنید اندازه نوار را کاهش دهید تا ببینید که آیا برای شما بهتر عمل می کند (به خصوص اگر تمایل دارید بین اندازه های باند باشید). قبل از اینکه تصمیم بگیرید کدام یک برای سایز سینه شما مناسب است، می توانید نظرات من را در زیر در مورد ویژگی های هر استایل ببینید."}, {"source": "Business Insider", "title": "Silicon Valley's new fashion icon: Alexandr Wang and his camo t-shirt", "link": "https://www.businessinsider.com/alexandr-wang-camo-t-shirt-deer-meta-connect-2026-9", "summary": "Internet sleuths said this outfit was a low-key flex. Wang wrote that he had to correct the record on this slander. Bloomberg/Getty Images Jensen Huang's leather jacket. Steve Jobs' black turtleneck. And… Alexandr Wang's camo print t-shirt? Meta's chief AI officer wore a camo shirt — complete with a deer graphic — during a keynote address. It's a trend for the exec. After people online speculated that it was a pricey luxury tee, Wang chimed in to say it was a $30 thrifted shirt. Move over Alexander Wang — it's Alexandr Wang (with only one \"e\") whose fashion choices are generating buzz online. The Meta exec, fresh off the runaway popularity of the Muse AI agent, is the guy Mark Zuckerberg effectively spent $15 billion to hire last year. And he dressed for the occasion — Meta's Connect 2026 conference on Wednesday — in a camo T-shirt with a 1990s-style print: a deer head on the front, a wooded path and more deer underneath it, and a \"Lake Tahoe\" label on the sleeve. Wang paired it with camo Crocs and black pants. Meta s chief AI officer, Alexandr Wang, at Meta Connect 2026 Meta Silicon Valley executives have long used clothes to become instantly legible — think Nvidia CEO Jensen Huang's rockstar energy in a leather jacket or former Apple CEO Steve Jobs' sleek black turtlenecks. Meta has its own form of the tradition. Zuckerberg himself has gone through a whole fashion evolution , wearing lines of premium T-shirts, hoodies, and gold chains. During the Wednesday keynote, he also wore a black T-shirt that read \"Building is my love language.\" Wang's outfit connects with how he's branded Meta's AI assistant online: less polished corporate futurism, and far more chaotic online founder energy. Following the address, several people online immediately turned their attention to Wang's shirt. Was it quiet luxury? One X user suggested it was an $800 Hermès shirt, though a community note now asserts that \"Hermes doesn't make hunter t-shirts.\" you can't make this shit up meta invested $60B into the metaverse. almost ran out of business. then zuck hired the camo crocs intern and suddenly everything's fixed pic.twitter.com/AiQR2xqOsY — berni (@itsnotbernhard) September 23, 2026 After his outfit was trending on X, he called the luxury-label assumption \"slander\" — and looked to set the record straight. The shirt, Wang said, comes from a thrift store in Santa Cruz and cost him $30, his Crocs only cost about $60, and his pair of Calvin Klein underwear was $5. excuse me I must c", "date_str": "2026-09-24T19:21:52+00:00", "hash": "40f112859c95c267", "title_fa": "نماد مد جدید سیلیکون ولی: الکساندر وانگ و تی شرت کامویش", "summary_fa": "کارآگاهان اینترنتی گفتند که این لباس یک انعطاف پذیری پایین بود. وانگ نوشت که باید رکورد این تهمت را تصحیح کند. بلومبرگ/گتی ایماژ کت چرمی جنسن هوانگ. یقه یقه اسکی مشکی استیو جابز. و ... تی شرت چاپ کاموی الکساندر وانگ؟ افسر ارشد هوش مصنوعی متا در یک سخنرانی کلیدی، یک پیراهن کامویی - کامل با تصویر گوزن - پوشید. این یک روند برای مدیران اجرایی است. پس از اینکه افراد آنلاین حدس زدند که این یک تی شرت گران قیمت است، وانگ اعلام کرد که این یک پیراهن 30 دلاری است. از الکساندر وانگ عبور کنید - الکساندر وانگ (با تنها یک \"e\") است که انتخاب های مد او در فضای آنلاین سر و صدا ایجاد می کند. مدیر متا، تازه پس از محبوبیت بی‌سابقه مامور هوش مصنوعی Muse، مردی است که مارک زاکربرگ در سال گذشته برای استخدام 15 میلیارد دلار هزینه کرد. و او برای این مناسبت - کنفرانس Meta's Connect 2026 در روز چهارشنبه - در یک تی شرت کامو با چاپی به سبک دهه 1990 لباس پوشید: یک سر آهو در جلو، یک مسیر جنگلی و آهوهای بیشتری در زیر آن، و یک برچسب \"Lake Tahoe\" روی آستین. وانگ آن را با Crocs camo و شلوار مشکی ست کرد. الکساندر وانگ، مدیر ارشد هوش مصنوعی متا، در Meta Connect 2026 مدیران متا سیلیکون ولی مدت‌هاست که از لباس‌ها استفاده می‌کنند تا فوراً خوانا شوند - فکر کنید انرژی راک‌ستار جنسن هوانگ، مدیرعامل انویدیا در یک کت چرمی یا یقه‌های مشکی براق مدیرعامل سابق اپل، استیو جابز. متا شکل خاص خود را از سنت دارد. خود زاکربرگ با پوشیدن خطوطی از تی‌شرت‌های درجه یک، هودی‌ها و زنجیرهای طلایی، یک تحول کامل مد را پشت سر گذاشته است. در جریان سخنرانی چهارشنبه، او همچنین یک تی شرت مشکی پوشید که روی آن نوشته شده بود: «ساختمان زبان"}, {"source": "Business Insider", "title": "300,000 student-loan borrowers got their debt wiped out — but their credit is still taking a hit, a new lawsuit says", "link": "https://www.businessinsider.com/student-loan-borrowers-debt-cancellation-credit-report-scores-new-lawsuit-2026-9", "summary": "A new lawsuit argues that the Department of Education continues to report student-loan borrowers forgiven balances to credit bureaus. ferrantraite/Getty Images Student-loan borrowers who got debt relief are being wrongfully reported to credit bureaus, a new lawsuit says. The lawsuit estimated that around 300,000 borrowers who were defrauded by their schools are affected. Inaccurate reporting could harm a borrower's credit score and trigger wage and benefit garnishment. Student-loan borrowers whose debt was wiped out are still being reported to credit bureaus, a new lawsuit says. On Thursday, the Project on Predatory Student Lending, a borrower advocacy group, filed a lawsuit against the Department of Education. It said that the department is violating the Fair Credit Reporting Act by reporting outstanding balances on \"cancelled and legally unenforceable debt.\" The lawsuit concerns borrowers whose loans were wiped out via the borrower defense to repayment program, after they were defrauded by \"predatory for-profit\" schools, including Ashford University and ITT Technical Institute. It specifically pertains to borrowers who received such relief between April 2022 and January 2025. The filing said these borrowers' balances were reported to credit bureaus as outstanding debt, which affected their credit scores . PPSL estimated that, based on publicly available data, the department is wrongfully reporting 300,000 student-loan borrowers for $4.6 billion of canceled debt. The affected borrowers \"have spent time and resources on attempts to clarify and remedy the situation,\" the lawsuit said, and they're worried that the government \"will inflict further wrongful injury, including collection through wage garnishment and tax refund or Social Security offset, in satisfaction of a debt that came into being in the first place because of an educational scam and now refuses to die.\" The Department of Education did not immediately respond to a request for comment from Business Insider. One of the plaintiffs, Mandy Woods, borrowed $65,000 to attend Ashford University, a school that the Education Department determined had defrauded its students. Despite qualifying for relief, Woods' credit report still shows that she owes over $71,000. \"When I was told my loans would be discharged, I was so relieved. I thought I could finally put this behind me,\" Woods said in the press release. \"Instead, I've been jumping through hoops, getting different answers depending on who I talk to, ", "date_str": "2026-09-24T19:20:08+00:00", "hash": "57cfe2524ae8f89f", "title_fa": "یک دادخواست جدید می گوید 300000 وام گیرنده وام دانشجویی بدهی خود را پاک کردند - اما اعتبار آنها همچنان در حال ضربه خوردن است.", "summary_fa": "یک دادخواست جدید استدلال می‌کند که وزارت آموزش همچنان به گزارش بخشودگی مانده وام‌گیرندگان وام دانشجویی به دفاتر اعتباری ادامه می‌دهد. ferrantraite/Getty Images طبق یک دادخواست جدید، وام گیرندگان وام دانشجویی که تخفیف بدهی دریافت کردند، به اشتباه به دفاتر اعتباری گزارش می شوند. در این دادخواست تخمین زده می شود که حدود 300000 وام گیرنده که توسط مدارسشان کلاهبرداری شده اند تحت تأثیر قرار گرفته اند. گزارش‌دهی نادرست می‌تواند به امتیاز اعتبار وام گیرنده آسیب برساند و باعث تخصیص دستمزد و منفعت شود. یک دادخواست جدید می گوید وام گیرندگان وام دانشجویی که بدهی آنها از بین رفته است هنوز به دفاتر اعتباری گزارش می شوند. روز پنجشنبه، پروژه وام‌دهی دانشجویی غارتگر، یک گروه حمایت از وام گیرندگان، علیه وزارت آموزش و پرورش شکایت کرد. این وزارتخانه گفت که این وزارتخانه با گزارش مانده های معوق در مورد \"بدهی لغو شده و غیرقابل اجرا\" قانون گزارش دهی اعتبار منصفانه را نقض می کند. این شکایت مربوط به وام گیرندگانی است که وام‌هایشان از طریق برنامه دفاع از وام‌گیرنده تا بازپرداخت، پس از کلاهبرداری توسط مدارس «غارتگر انتفاعی»، از جمله دانشگاه اشفورد و موسسه فنی ITT، از بین رفته است. این به طور خاص مربوط به وام گیرندگانی است که بین آوریل 2022 و ژانویه 2025 چنین تسهیلاتی دریافت کرده اند. در این پرونده آمده است که مانده این وام گیرندگان به عنوان بدهی معوق به دفاتر اعتبار گزارش شده است که بر امتیاز اعتبار آنها تأثیر گذاشته است. PPSL تخمین زد که بر اساس داده‌های در دسترس عموم، این وزارتخانه به اشتباه 300000 وام گیرنده وام دانشجویی را برای 4.6 میلیارد دلار بدهی لغو شده گزارش می‌کند. در این دادخواست آمده است که وام گیرندگان آسیب دیده \"زمان و منابع خود را صرف تلاش برای روشن کردن و اصلاح وضعیت کرده اند\" و آنها نگران هستند که دولت \"در"}, {"source": "Business Insider", "title": "Only 49 songs have stayed at No. 1 on the chart for 10 weeks or more — here they all are", "link": "https://www.businessinsider.com/number-1-songs-chart-longest-leaders-billboard-hot-100", "summary": "Lil Nas X, Olivia Newton-John, Mariah Carey, and Shaboozey. Emma McIntyre/Getty Images for The Recording Academy; Erik Hein/American Broadcasting Companies via Getty Images; Kevin Winter/Getty Images; Axelle Bauer Griffin/FilmMagic; Rebecca Zisser/BI A small fraction of all No. 1 hits have ruled the Billboard Hot 100 for 10 weeks or more. Ella Langley's \"Choosin' Texas\" is the latest song to reach the milestone. \"Choosin' Texas\" has surpassed \"All I Want for Christmas Is You\" for most weeks atop the chart. The Billboard Hot 100 is widely regarded as the definitive all-genre singles chart in the US. Since the chart launched in 1958, hundreds of songs have reached the coveted No. 1 spot. However, far fewer have remained there for double-digit weeks. Ella Langley's \"Choosin' Texas\" recently notched its 23rd week at No. 1 — surpassing Mariah Carey's 1994 smash \"All I Want for Christmas Is You\" for the longest reign in history. Lil Nas X's \"Old Town Road\" and Shaboozey's \"A Bar Song (Tipsy)\" are tied for third place with 19 weeks apiece. Keep reading for a roundup of every song that has ruled the chart for at least 10 weeks, listed in the order they reached that milestone. Listen to the complete playlist on Business Insider's Spotify . 1. You Light Up My Life by Debby Boone Michael Ochs Archives/Getty Images \"You Light Up My Life\" was the first song in history to chart at No. 1 for 10 weeks. 2. Physical by Olivia Newton-John Olivia Newton-John/YouTube \"Physical\" charted at No. 1 for 10 weeks. 3. End of the Road by Boyz II Men Boyz II Men/YouTube \"End of the Road\" charted at No. 1 for 13 weeks. 4. I Will Always Love You by Whitney Houston Whitney Houston/YouTube \"I Will Always Love You\" charted at No. 1 for 14 weeks. 5. I Swear by All-4-One All-4-One/YouTube \"I Swear\" charted at No. 1 for 11 weeks. 5. I ll Make Love to You by Boyz II Men Boyz II Men/YouTube \"I'll Make Love to You\" charted at No. 1 for 14 weeks. 7. One Sweet Day by Mariah Carey and Boyz II Men One Sweet Day was released on November 14, 1995. Mariah Carey/YouTube \"One Sweet Day\" charted at No. 1 for 16 weeks, making Boyz II Men the first artist in history to earn double-digit weeks atop the chart with three different songs. 8. Macarena (Bayside Boys Mix) by Los Del Rio Los Del Rio/YouTube \"Macarena (Bayside Boys Mix)\" charted at No. 1 for 14 weeks. 9. Un-Break My Heart by Toni Braxton Toni Braxton/YouTube \"Un-Break My Heart\" charted at No. 1 for 11 weeks. 10. I ll Be Missing You by Puff Daddy and ", "date_str": "2026-09-24T18:30:24+00:00", "hash": "f58916fd0ddc09dc", "title_fa": "تنها 49 آهنگ به مدت 10 هفته یا بیشتر در رتبه اول جدول باقی مانده اند - همه آنها اینجا هستند", "summary_fa": "لیل ناس ایکس، اولیویا نیوتن جان، ماریا کری و شابوزی. اما مک اینتایر/گتی ایماژ برای The Recording Academy; اریک هاین/ شرکت های پخش آمریکایی از طریق گتی ایماژ. کوین وینتر/گتی ایماژ; Axelle Bauer Griffin/FilmMagic; Rebecca Zisser/BI بخش کوچکی از تمام بازدیدهای شماره 1 به مدت 10 هفته یا بیشتر در بیلبورد Hot 100 حکمرانی کرده اند. آهنگ \"Choosin' Texas\" الا لنگلی جدیدترین آهنگی است که به نقطه عطف رسیده است. «Choosin' Texas» برای اکثر هفته‌ها در صدر جدول از «All I Want for Christmas Is You» پیشی گرفته است. Billboard Hot 100 به طور گسترده به عنوان نمودار قطعی تک‌آهنگ‌های همه ژانر در ایالات متحده در نظر گرفته می‌شود. از زمانی که چارت در سال 1958 راه اندازی شد، صدها آهنگ به رتبه شماره 1 رسیده اند. با این حال، تعداد بسیار کمتری برای هفته های دو رقمی در آنجا باقی مانده اند. فیلم «انتخاب تگزاس» ساخته الا لنگلی اخیراً بیست و سومین هفته اکران خود را در رتبه اول کسب کرده است. 1 - پیشی گرفتن از ماریا کری در سال 1994 به نام \"All I Want for Christmas Is You\" برای طولانی ترین دوره سلطنت در تاریخ. «جاده شهر قدیمی» از لیل ناس ایکس و «آهنگ نواری (تیپسی)» از شابوزی با 19 هفته در رده سوم قرار دارند. به خواندن خلاصه‌ای از هر آهنگی که حداقل 10 هفته در چارت حاکم بوده است، ادامه دهید، و به ترتیبی که به آن نقطه عطف رسیده‌اند فهرست شده‌اند. به لیست پخش کامل در Spotify در Business Insider گوش دهید. 1. You Light Up My Life توسط Debby Boone Michael Ochs Archives/Getty Images \"You Light Up My Life\" اولین آهنگ تاریخ بود که به مدت 10 هفته در رتبه اول جدول قرار گرفت. 2. Physical توسط Olivia Newton-John Olivia Newton-John/YouTube \"Physical\" به مدت 10 هفته در جدول شماره 1 قرار گرفت."}, {"source": "Business Insider", "title": "Internal docs show how David Ellison wants Paramount+ to transform as his WBD mega-deal draws near", "link": "https://www.businessinsider.com/paramount-streaming-initiatives-strategy-david-ellison-hbo-max-pluto-tv-2026-9", "summary": "Paramount Skydance CEO David Ellison has made streaming and technology a top priority. Illustration by Cheng Xin/Getty Images; Shannon Finney/WireImage Paramount+ is getting a slew of new features designed to hook viewers and make more money from them. An internal streaming initiatives list shows which features Paramount is focused on, and why. CEO David Ellison is using tech to make Paramount more like dominant players Netflix and YouTube. Paramount+ is bulking up before its marriage with HBO Max. Paramount Skydance is preparing to launch new streaming features designed to drive engagement and increase revenue from viewers as it finalizes its $110 billion acquisition of Warner Bros. Discovery . The deal will give Paramount control of HBO Max and Discovery+. These changes are the latest example of how CEO David Ellison is using tech to try to make Paramount more like Netflix and YouTube, which dominate TV viewership charts and have a significant sway over popular culture. Paramount's streaming leadership told employees at a town hall this summer that Paramount+ is planning to add a free tier , micro dramas , and new interactive ad formats. Paramount is also preparing to put a comments section in its TikTok-style feed and leverage AI to help it clip videos, according to a screenshot of its streaming initiatives list recently viewed by Business Insider. These features don't have specific launch dates yet, a person familiar with Paramount's strategy said. However, an internal document said several projects related to the free tier are labeled for Q4 and Q1 2027. Paramount+ is also leaning into short vertical video , which it launched in April, and adding more video podcast segments to grow engagement on mobile and during the day. The streaming initiatives list, which one tech staffer described as \"a living, breathing document,\" shows what Paramount's streaming team has been prioritizing ahead of its WBD merger. Since taking over Paramount, Ellison has prioritized tech while hiring executives from companies like Google and Meta. Paramount hopes that buying WBD will give it the scale it needs to turn from a 114-year-old media firm reliant on cable profits to a streaming giant, though some analysts are skeptical of its chances because of its relatively low streaming viewership share and the combined company's tens of billions of dollars in debt. \"What Ellison's doing is very logical,\" Rich Greenfield, a media analyst at Lightshed Partners, said of the changes co", "date_str": "2026-09-24T18:30:07+00:00", "hash": "22d28906dd506644", "title_fa": "اسناد داخلی نشان می‌دهند که چگونه دیوید الیسون می‌خواهد که Paramount+ با نزدیک شدن به معامله بزرگ WBD او تغییر کند.", "summary_fa": "دیوید الیسون، مدیرعامل پارامونت اسکای دنس، استریم و فناوری را در اولویت اصلی خود قرار داده است. تصویر توسط چنگ شین/گتی ایماژ; شانون فینی/WireImage Paramount+ مجموعه‌ای از ویژگی‌های جدید را دریافت می‌کند که برای جذب بینندگان و کسب درآمد بیشتر از آنها طراحی شده است. فهرست ابتکارات استریم داخلی نشان می‌دهد که پارامونت روی کدام ویژگی‌ها متمرکز شده است و چرا. مدیرعامل دیوید الیسون از فناوری استفاده می کند تا پارامونت را بیشتر شبیه به بازیکنان غالب نتفلیکس و یوتیوب کند. Paramount+ قبل از ازدواج با HBO Max در حال افزایش است. Paramount Skydance در حال آماده‌سازی برای راه‌اندازی ویژگی‌های استریم جدید است که برای ایجاد تعامل و افزایش درآمد بینندگان طراحی شده است، زیرا خرید 110 میلیارد دلاری Warner Bros. Discovery را نهایی می‌کند. این قرارداد به پارامونت کنترل HBO Max و Discovery+ را می دهد. این تغیی reat for capturing footage, but not so much if you get frustrated lugging it around on your adventures. That s the advantage of the GoPro Lit Hero : At just 3.3 ounces, it s small enough to slip into a jacket pocket or keep clipped to a bike helmet. And with early October Prime Day deals going live, the Lit Hero is down to $204.75 from its $270 launch price, the lowest price recorded by price trackers so far. For more on the October Prime Day sale , you can follow offers as they come in on our Prime Day 2026 Live Blog or browse our Prime Day Deals coverage. It records up to 4K at 60fps, captures 12MP photos, and is waterproof down to 16 feet without needing extra housing, making it practical for casual travel, cycling, beach trips, or quick vacation clips. Startup speeds are fast, autofocus works reliably, and the battery lasts around 90 minutes of continuous shooting (the battery is sealed and cannot be swapped out mid-day). The built-in LED light is also brighter than expected for a camera this small, although it feels more useful underwater or during emergencies than for everyday clips. GoPro Lit Hero $204.99 at Amazon $269.99 Save $65.00 Get Deal Get Deal $204.99 at Amazon $269.99 Save $65.00 On the minus side, its 1.76-inch touchscreen is extremely small, and navigating menus can be tricky, especially if you're outdoors or have wet hands. Because there are barely any physical controls, almost everything depends on tapping through menus on that tiny display. There s also no built-in image stabilization; instead, you have to transfer footage into the GoPro Quik app and apply stabilization afterward, which adds an extra step. While the image quality is decent in bright conditions, the small 1/2.8-inch sensor struggles in dimmer environments, producing softer footage with visible noise. If you're into color grading or tweaking your footage later, you won t get much flexibility here either, since there s no log mode or meaningful manual control to work with. Overall, the Lit Hero feels less like a smaller Hero Black and more like a compact point-and-shoot action camera for beginners who care more about convenience and size than image quality but if those are major factors for you, it's a good bet at the current discount. October Prime Day FAQs How does Prime Day work? Prime Day lets Prime Members shop online for thousands", "date_str": "2026-09-25T13:00:00+00:00", "hash": "836a394831de3b85", "title_fa": "GoPro Lit Hero با تخفیف 65 دلاری در این فروش اولیه در اوایل اکتبر است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. یک GoPro برای گرفتن فیلم عالی است، اما اگر در ماجراجویی‌های خود ناامید شوید، اینقدر زیاد نیست. این مزیت GoPro Lit Hero است: تنها با وزن 3.3 اونس، به اندازه‌ای کوچک است که می‌توان آن را در جیب کت قرار داد یا روی کلاه ایمنی دوچرخه نگه داشت. و با شروع معاملات اوایل اکتبر Prime Day، Lit Hero از قیمت راه اندازی 270 دلاری خود به 204.75 دلار کاهش یافته است، که پایین ترین قیمت ثبت شده توسط ردیاب های قیمت تاکنون است. برای کسب اطلاعات بیشتر در مورد فروش روز اول اکتبر، می‌توانید پیشنهادها را در همان زمان که در وبلاگ زنده Prime Day 2026 ما وارد می‌شوند دنبال کنید یا پوشش تخفیف‌های روز نخست ما را مرور کنید. تا 4K با سرعت 60 فریم در ثانیه ضبط می‌کند، عکس‌های 12 مگاپیکسلی می‌گیرد و تا عمق 16 فوتی بدون نیاز به محفظه اضافی ضدآب است و برای سفرهای معمولی، دوچرخه‌سواری، سفرهای ساحلی یا کلیپ‌های تعطیلات سریع کاربردی است. سرعت راه‌اندازی سریع است، فوکوس خودکار با اطمینان کار می‌کند، و باتری حدود 90 دقیقه عکاسی مداوم دوام می‌آورد (باتری مهر و موم شده است و در اواسط روز قابل تعویض نیست). نور LED داخلی نیز برای دوربینی به این کوچکی روشن تر از حد انتظار است، اگرچه در زیر آب یا در مواقع اضطراری مفیدتر از کلیپ های روزمره است. GoPro Lit Hero 204.99 دلار در آمازون 269.99 دلار صرفه جویی 65.00 دلار دریافت معامله دریافت معامله 204.99 دلار در آمازون 269.99 دلار صرفه جویی 65 دلاری از جنبه منفی، صفحه نمایش لمسی 1.76 اینچی آن بسیار کوچک است، و پیمایش منو first is simply Apple s track record. Early models of the Apple watch had better sensors than most wearables at the time, so Apple developed a reputation for good accuracy. For example, back in 2019 or so, the Series 4 watch performed far better for me than the Whoop 3.0. But time marches on, and devices have gotten better. Garmin has an excellent sensor, as I already explained; the Pixel watch is also impressively good. But Apple just didn t keep up. You can see it in my comparisons over the years: here s the Series 11 glitching where a Garmin did just fine, and here s the Series 10 struggling alongside a Fitbit Charge 6. If I were to rank all the heart rate sensors I ve tested for their accuracy, the Garmin 570 would be A-tier, the Pixel Watch and most good sports watches would get a B, and the Apple Watch (Series 10 and 11) would be a C. (S-tier would be reserved for chest straps.) Not long ago, I got downvoted to negative infinity for commenting on Reddit that Apple s heart rate accuracy (up to the Series 11) is mid at best. Sorry, but it s true. Garmin Forerunner 570 42mm Advanced GPS Smartwatch (Slate) $549.99 at Amazon Get Deal Get Deal $549.99 at Amazon But, OK, perhaps it s a new era. Apple redesigned its optical heart rate sensor to in", "date_str": "2026-09-24T21:20:46+00:00", "hash": "b5a6d746c3dc516c", "title_fa": "سنسور ضربان قلب جدید اپل واچ را تست کردم تا ببینم آیا واقعا بهتر از گارمین است یا نه", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اپل با این ادعا که اپل واچ سری 12 و اولترا 4 دقیق ترین ضربان قلب را در یک پوشیدنی دارند، توجه من را به خود جلب کرد. ساختن یک سنسور ضربان قلب واقعاً دقیق دشوار است و طبق تجربه من، اپل سابقه خوبی در این زمینه نداشته است. بنابراین من سری 12 را در یک هفته گذشته به شدت آزمایش کردم و اکنون نتایجی دارم. اپل واچ سری 12 (GPS، 42 میلی متر) 399.00 دلار در آمازون دریافت معامله دریافت معامله 399.00 دلار در آمازون من در مورد دقت حساس هستم. خوانندگان قدیمی دیده اند که من ساعت پس از ساعت را روی بند ample, the Amazon Prime Student program allows young adults between the ages of 18 and 24 to get all of the Prime perks for half the cost $7.49 per month or $69 annually. All the benefits of Amazon Prime I'll be the first to admit I didn't know all of the benefits that Amazon Prime offers to its members. There are a lot more perks than people think. Here are the most impressive ones (and check out the full list ): Fast, free shipping Fast free shipping on millions of items : Depending on where you live, shipping can take one or two days, and some even come on the same day for orders of $25 or more in most areas and it s always free (if being shipped by the Amazon store). Select pre-ordered items can be delivered on their release date for free (for most areas). The option to have items delivered inside your garage with a smart garage device (depending on where you live) for $1.99 per order, or for free if you combine it with Amazon Day delivery. Earn rewards for future purchases when you select free no-rush shipping. The option to have all your weekly orders delivered on a specific day, to reduce waste from boxes. Deals, savings, and sales Amazon Prime Visa card : Cardholders get 5% back on Amazon, Whole Foods, Chase Travel, and other purchases. Prime members who use this card extensively can earn rewards that offset the cost of membership. A Grubhub+ membership , normally $9.99 per month, which gets you free delivery on eligible orders, lower service fees, exclusive deals, and other perks as long as you remain a Prime Member (it used to be only for a year). Sharing with family or friends : Amazo", "date_str": "2026-09-24T21:00:00+00:00", "hash": "394ef68797c074e6", "title_fa": "بهترین مزایای آمازون پرایم که احتمالاً از آنها اطلاعی ندارید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اگر می‌خواهید به عضویت آمازون پرایم متعهد شوید، ممکن است تا جایی که می‌توانید از این معامله خارج شوید. و مقدار زیادی آبمیوه برای فشار دادن وجود دارد. قیمتی که برای آمازون می پردازید به عوامل زیادی بستگی دارد، اما صرف نظر از اینکه چقدر می پردازید، برای اکثر مردم ارزش آن را دارد (ما حساب را انجام داده ایم). اگر قصد ثبت نام را ندارید، در نظر داشته باشید که فروش ماه اکتبر آمازون در روز پرایم نزدیک است، و این شرکت در حال حاضر میزبان برخی از معاملات اولیه Prime Day است. زمان بسیار خوبی برای فروش روح خود یا استفاده از مزیت آزمایشی رایگان 30 روزه است و عضویت شما بسیار بیشتر از معاملات و ارسال رایگان است. Amazon Prime چقدر هزینه دارد؟ هزینه عضویت استاندارد Prime 14.99 دلار در ماه یا 139 دلار در سال است، اما سطوح دیگری نیز وجود دارد که برخی افراد ممکن است واجد شرایط باشند. به عنوان مثال، برنامه Amazon Prime Student به جوانان بین سنین 18 تا 24 سال اجازه می دهد تا با نیمی از هزینه 7.49 دلار در ماه یا 69 دلار در سال، تمام مزایای Prime را دریافت کنند. تمام مزایای آمازون پرایم من اولین کسی خواهم بود که اعتراف می کنم که از همه مزایایی که آمازون پرایم به اعضای خود ارائه می دهد اطلاعی نداشتم. امتیازات بسیار بیشتر از آن چیزی است که مردم فکر می کنند. در اینجا چشمگیرترین آنها وجود دارد (و لیست کامل را بررسی کنید): ارسال سریع و رایگان ارسال رایگان سریع برای میلیون ها کالا: بسته به محل زندگی شما، حمل و نقل ممکن است یک یا دو روز طول بکشد و حتی برخی از آنها برای سفارش های 25 دلاری یا بیشتر در بیشتر مناطق در همان روز"}, {"source": "Lifehacker", "title": "These Are the Biggest Announcements From Meta Connect 2026", "link": "https://lifehacker.com/tech/everything-announced-at-meta-connect-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Meta hosted its annual \"Connect\" event on Wednesday . Curiously, the company kicked things off at 7 p.m. ET (4 p.m. PT), following \" Made by Google \" as the second major tech event of 2026 to take place in the evening. While that might have reduced the usual visibility of the event, it certainly wasn't an unremarkable presentation: Meta CEO Mark Zuckberg laid out the company's big hardware and AI plans and sold us a pitch for Meta's vision for the future of work, entertainment, and social connectivity. Here's what the company announced. Meta's next smart glasses don't have cameras Credit: Meta Meta makes some of the most popular smart glasses on the market. That doesn't mean it has a great reputation. As it turns out, many of us aren't keen on walking past a deluge of glasses with embedded cameras wherever we go. While smart glasses fans have their arguments for why the tech is useful, many others are simply put off by the privacy invasion. I can't think of a better reason to explain the direction Meta is taking with its latest smart glasses line: Ray-Ban Meta Audio glasses. As the name suggests, these glasses do not have cameras. Instead, Meta says they have open-ear audio, designed for \"true all-day wearability.\" The new glasses have a reported 12 hours of battery life, while the charging case can add an additional 48 hours of use. These glasses also have adjustable temple tips and swappable nose pads. You can use them to listen to music, access Meta AI, and take phone calls all without having to fend off accusations of unsolicited video recording. Meta says that Meta Audio glasses will come in 23 different color and lens combinations in either \"Clubmaster\" or \"Burbank\" frames. They will ship Oct. 13, and you can pre-order them today for $349 . Meta introduced the Ray-Ban Meta (Gen 3) Credit: Meta Meta isn't completely ditching its camera-embedded smart glasses, of course. In fact, it also introduced the next devices in its Ray-Ban Meta line. According to the company, these glasses run an hour longer than the previous generation on a charge (nine hours as opposed to eight) and come with new adjustable temple tips. There's a new array of six microphones that Meta says cuts out over 90% of background noise. Meta did make a point to note that the \"3K Ultra HD\" camera embedded in the frames does engage an LED light whenever you are recording, so the people around you are aware. Meta says those cameras will so", "date_str": "2026-
