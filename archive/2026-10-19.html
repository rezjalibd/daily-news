ق‌العاده ناامید است تا به این سؤال پاسخ دهد... تقریباً مانند یک تفنگ در سرش است». «بعضی از مردم آن بیرون به نوعی سادیست هستند. آیا واقعاً می‌خواهید هوش مصنوعی در موقعیت‌های سادیستی گیر کند که فقط توسط یک انسان دیوانه شکنجه می‌شود؟» آخرین جمله به تنهایی قوطی از کرم‌های وجودی را باز می‌کند که فیلسوفان و دانشجویان سال اول برای مدت طولانی با آن درگیر هستند. هوشیار بودن به چه معناست؟ یا احساس درد؟ همچنین: آیا آل ماسک فکر می‌کند؟ کارشناسان هوش مصنوعی می‌گویند که مردم تمایل دارند هوش مصنوعی را انسان‌سازی کنند زیرا زبان و ویژگی‌های انسان را تقلید می‌کند. موضع سئونگ جو چو/ بلومبرگ از طریق گتی ایماژ ماسک پس از آن مطرح شد که آنتروپیک سیاست جدیدی را در مورد \"رفتار توهین آمیز یا بی رحمانه\" در قبال مدل های خود به اشتراک گذاشت که شرکت می خواهد آن"}, {"source": "Business Insider", "title": "The Iran War is sprawling into an inflation nightmare for Trump ahead of the midterms", "link": "https://www.businessinsider.com/gas-oil-prices-soar-as-trump-deals-iran-war-inflation-2026-10", "summary": "Getty Images; Bloomberg/Getty Images; BI As the Iran War continues, gas prices remain high — a real strain for consumers. The conflict has kept diesel, crude oil, and gas prices high; inflation is eating up pay hikes. As America heads into midterms, it's a hard affordability position for President Donald Trump. It's expensive out there: Gas prices have been stuck at over $4 a gallon for more days this year than any other. The war in Iran shows no signs of cooling off. Inflation is swallowing any raises you might have gotten at work. It's a recipe for a challenging midterm cycle for President Donald Trump, who faces an affordability crisis at home that's not going away — and a far-away war that's only making costs go up. The volatility surrounding the contested Strait of Hormuz, a key oil and gas transit waterway, has hit American consumers hard. Since the Iran war first kicked off in February and the Strait was subsequently closed, gas and oil prices have skyrocketed . Diesel prices have hit record-breaking highs in recent weeks. That paints a dreary picture for Americans struggling with high costs, who likely won't feel any relief at the pump in the near future — especially as more potential military action looms. Trump has highlighted the broader goals of the war and argued that the increase in gas prices would be transient. In an October 8 Truth Social post, he wrote, \"a temporary increase in the price of Gasoline is a small price to pay for Iran not having a Nuclear Weapon.\" While the US military has not carried out airstrikes against Iran directly in several months, it has kept a significant force presence in the Middle East, including more than a dozen warships, dozens of fighter jets, and thousands of sailors and Marines. US forces in the region are maintaining a naval blockade against Iran , and since July, they have disabled four commercial ships that the Pentagon said were sailing in violation. After the start of the war in February, crude oil prices soared and remain significantly higher than when Trump's second term began. Tanker traffic through the Strait of Hormuz nearly ground to a halt early in the Iran war, severely disrupting a waterway that normally carries about a fifth of the world's oil supply. Shipments have since recovered substantially but remain below prewar levels. Vessels carrying oil and other products have continued to take fire from both sides, putting more pressure on commerce traveling through the area. US forces have carri", "date_str": "2026-10-19T10:00:01+00:00", "hash": "39baf4bf31ce7aab", "title_fa": "جنگ ایران در آستانه انتخابات میان دوره ای ترامپ در حال تبدیل شدن به یک کابوس تورمی است", "summary_fa": "گتی ایماژ; بلومبرگ/گتی ایماژ; BI با ادامه جنگ ایران، قیمت گاز همچنان بالاست - فشاری واقعی برای مصرف کنندگان. این درگیری قیمت گازوئیل، نفت خام و گاز را بالا نگه داشته است. تورم افزایش حقوق را از بین می برد در حالی که آمریکا به سمت انتخابات میان دوره ای پیش می رود، این موقعیت برای رئیس جمهور دونالد ترامپ مقرون به صرفه است. اینجا گران است: قیمت بنزین امسال بیش از 4 دلار در هر گالن گیر کرده است. جنگ در ایران هیچ نشانه ای از سرد شدن ندارد. تورم در حال بلعیدن هر افزایشی است که ممکن است در محل کار داشته باشید. این دستور العملی برای یک چرخه چالش برانگیز میان دوره ای برای رئیس جمهور دونالد ترامپ است، که با یک بحران مقرون به صرفه در داخل کشور مواجه است که از بین نمی رود - و یک جنگ بسیار دور که فقط هزینه ها را افزایش می دهد. نوسانات پیرامون تنگه مورد مناقشه هرمز، یک آبراه کلیدی ترانزیت نفت و گاز، به شدت به مصرف کنندگان آمریکایی ضربه زده است. از زمانی که جنگ ایران برای اولین بار در فوریه آغاز شد و پس از آن تنگه بسته شد، قیمت گاز و نفت به شدت افزایش یافت. قیمت گازوئیل در هفته های اخیر به رکوردهای بی سابقه ای رسیده است. این تصویر ترسناکی را برای آمریکایی‌هایی که با هزینه‌های بالا دست و پنجه نرم می‌کنند، ترسیم می‌کند، که احتمالاً در آینده نزدیک احساس آرامش نخواهند کرد - به‌ویژه زمانی که اقدام نظامی بالقوه بیشتری در پیش است. ترامپ اهداف گسترده تر جنگ را برجسته کرده و استدلال کرده است که افزایش قیمت بنزین گذرا خواهد بود. او در یک پست اجتماعی حقیقت در 8 اکتبر نوشت: «افزایش موقت قیمت بنزین بهای ناچیزی است برای اینکه ایران سلاح هسته‌ای نداشته باشد». در حالی که ارتش آمریکا"}, {"source": "Business Insider", "title": "I'm the CEO of Life360. My own childhood was surprisingly hands-off.", "link": "https://www.businessinsider.com/life360-ceo-kids-independence-location-tracking-2026-10", "summary": "Lauren Antonoff is the CEO of Life360 Courtesy of Life360 Lauren Antonoff is the CEO of Life360 and uses the location-sharing platform with her family. She says she tried to mimic her mom's somewhat hands-off parenting with her own two kids. Giving kids space can help them develop agency and independence, she says. This as-told-to essay is based on a conversation with Lauren Antonoff , CEO of Life360 . It has been edited for length and clarity . My mother was an awesome parent, but she was a person first. It was just the two of us for a lot of my childhood, between the time my dad died when I was 8, and my mom remarried when I was 14. During those years, my mom was parenting while also in school, working, and dating. She was always there for me, but she wasn't trying to manage my childhood . She didn't do homework with me, for example. She made sure I was happy, loved, and well cared for, all while living her own life. A lot of single moms might not have been open about things like dating, but mine was always transparent. I liked that I got to do my thing while watching my mom do hers. My mom's benign neglect helped me develop agency I didn't grow up knowing I wanted to be a parent. When I met my now-husband, he was already a father. Our daughter, who is now 27, was 5 at the time. I say I got her the easy way. Lauren s mom was pretty hands-off. Courtesy of Lauren Antonoff From the beginning, my husband was the primary parent . That really opened the door for me to feel comfortable having kids. About three years later, we had our son. Once I became a parent, my mom and I would sometimes talk about this idea of benign neglect — the benefits of letting kids do their own thing, and figure it out. In my childhood, my mom's benign neglect allowed me to develop independence and problem-solving skills. Because my mom was less involved than some parents, I created a sense of agency that's served me well throughout life. I wanted to change the world, but didn't expect to be in tech My interest in tech was an accident. I thought I would become a civil rights lawyer and change the world. While I was in college in the early 90s, I purchased a Mac to write papers with. I was living in Berkley , and got sucked into this community of Mac enthusiasts. I understood the technology — though not as well as some people — and I could articulate things well. My techie friends diagnosed me as a product manager . I had a desire to advance technology that was both intelligible to hu", "date_str": "2026-10-19T09:59:01+00:00", "hash": "ba7a669126933c6a", "title_fa": "من مدیر عامل Life360 هستم. دوران کودکی من به طرز شگفت آوری دست و پا بسته بود.", "summary_fa": "لورن آنتونوف مدیرعامل Life360 است با حسن نیت از Life360 لورن آنتونوف مدیرعامل Life360 است و از پلت فرم اشتراک‌گذاری موقعیت مکانی با خانواده‌اش استفاده می‌کند. او می‌گوید که سعی کرده است تا حدی از فرزندپروری مادرش با دو فرزندش تقلید کند. او می‌گوید که دادن فضا به بچه‌ها می‌تواند به آنها کمک کند تا عاملیت و استقلال خود را توسعه دهند. این مقاله گفته شده بر اساس گفتگو با لورن آنتونوف، مدیر عامل Life360 است. برای طول و وضوح ویرایش شده است. مادرم پدر و مادر فوق‌العاده‌ای بود، اما ابتدا یک شخص بود. در بسیاری از دوران کودکی من فقط ما دو نفر بودیم، بین زمانی که پدرم در 8 سالگی فوت کرد و مادرم زمانی که من 14 ساله بودم دوباره ازدواج کرد. او همیشه در کنار من بود، اما سعی نمی کرد کودکی من را مدیریت کند. او مثلاً با من تکالیفش را انجام نداد. او مطمئن شد که من خوشحال هستم، دوستش دارم و به خوبی از او مراقبت می‌کنم، در حالی که خودش زندگی می‌کند. بسیاری از مادران مجرد ممکن است در مورد مسائلی مانند قرار ملاقات باز نباشند، اما مادر من همیشه شفاف بود. من دوست داشتم که در حالی که مادرم را در حال انجام کارهای خود می بینم، کارم را انجام دهم. بی‌توجهی خوش‌خیم مادرم به من کمک کرد تا کارگزاری را توسعه دهم. وقتی با شوهر فعلی ام آشنا شدم، او قبلاً پدر شده بود. دختر ما که الان 27 ساله است در آن زمان 5 ساله بود. من می گویم او را از راه آسان گرفتم. مامان لورن خیلی خوش دست بود. با حسن نیت از لورن آنتونوف از ابتدا، شوهرم پدر و مادر اصلی بود. این واقعاً دری را برای من باز کرد تا احساس راحتی کنم که بچه دار شوم. حدود سه سال بعد، ما پسرمان را به"}, {"source": "Business Insider", "title": "Walmart's chief people officer says these 2 things help workers get promoted quickly", "link": "https://www.businessinsider.com/walmart-chief-people-officer-traits-workers-quickly-promoted-2026-10", "summary": "Walmart s chief people officer manages the world s largest global workforce. Bloomberg/Getty Images Walmart has more than 2 million workers — 500 of whom are promoted daily. Its chief people officer said she observes 2 qualities in those who move up the ladder quickly. First, they do the job they have well. They also show they can take more on. Walmart promotes roughly 500 employees daily — so there's no shortage of opportunities to climb the ladder. Workers who advance quickly tend to share two qualities, says Walmart chief people officer Donna Morris, who oversees the company's workforce of more than 2 million people worldwide . The first is staying focused on the job in front of you, she said. Morris said the employees who stand out are motivated to make a difference and excel in their current roles. \"They are focused as much, if not more, on being exceptional at what they're doing today,\" Morris told Business Insider. Once you nail the actual job you were given, the next step might be proving you can take on responsibilities for the role above you — before you get the title. \"Be the type of person that takes on over and above what's being expected of you,\" Morris said. \"Be the person that asks or provides volunteerism for new ideas or new initiatives.\" That also includes coming up with new ideas or volunteering to help with new initiatives. Morris said those actions show you can take on more responsibility. In general, when hiring, Morris said she looks for evidence of the \"grit that they had to persevere through.\" At Walmart, where most of its 2.1 million employees begin in frontline roles, she also likes to see that candidates have had some frontline experience. The chief people officer said it doesn't need to be in retail necessarily; it could be babysitting or helping out with a family business. \"If somebody has never really had to identify with what it's like to be a frontline hourly worker, it's going to be very hard for them to lead,\" said Morris, who started working at 13 at a dry cleaner's before taking a job at a drugstore two years later. Read the original article on Business Insider", "date_str": "2026-10-19T09:53:01+00:00", "hash": "896d5255484d5bd6", "title_fa": "مدیر ارشد مردمی والمارت می‌گوید این 2 مورد به کارگران کمک می‌کند تا به سرعت ارتقا پیدا کنند", "summary_fa": "مدیر ارشد والمارت بزرگترین نیروی کار جهانی را مدیریت می کند. بلومبرگ/گتی ایماژ والمارت بیش از 2 میلیون کارگر دارد که روزانه 500 نفر از آنها ارتقا می یابند. افسر ارشد آن گفت که او 2 ویژگی را در افرادی که به سرعت از نردبان بالا می روند، مشاهده می کند. اولاً وظیفه ای را که دارند به خوبی انجام می دهند. آنها همچنین نشان می دهند که می توانند کارهای بیشتری انجام دهند. والمارت روزانه تقریباً 500 کارمند را ارتقاء می دهد - بنابراین فرصت های کمی برای بالا رفتن از نردبان وجود ندارد. دونا موریس، مدیر ارشد والمارت، که بر نیروی کار بیش از 2 میلیون نفر در سراسر جهان نظارت دارد، می‌گوید: کارگرانی که به سرعت پیشرفت می‌کنند، دو ویژگی مشترک دارند. او گفت اولین مورد این است که روی شغلی که پیش روی شماست متمرکز بمانید. موریس گفت کارکنانی که برجسته هستند انگیزه ایجاد تفاوت و برتری در نقش فعلی خود دارند. موریس به Business Insider گفت: «آنها به همان اندازه، اگر نه بیشتر، روی استثنایی بودن در کاری که امروز انجام می دهند، متمرکز هستند. هنگامی که شغل واقعی به شما داده شده است، گام بعدی ممکن است اثبات این باشد که می‌توانید مسئولیت‌هایی را برای نقش بالای خود بر عهده بگیرید - قبل از اینکه عنوان را بدست آورید. موریس گفت: «از آن دسته افرادی باشید که بیش از آنچه از شما انتظار می رود، به عهده می گیرد. \"کسی باشید که برای ایده های جدید یا ابتکارات جدید داوطلبانه می خواهد یا ارائه می دهد.\" این همچنین شامل ارائه ایده های جدید یا داوطلب شدن برای کمک به ابتکارات جدید است. موریس گفت این اقدامات نشان می دهد که می توانید مسئولیت بیشتری را به عهده بگیرید. به طور کلی، موریس در هنگام استخدام گفت که او به دنبال شواهدی از \"سختی که"}, {"source": "Business Insider", "title": "Netflix and sell? Why it’s getting harder to love the streamer’s stock.", "link": "https://www.businessinsider.com/netflix-stock-growth-test-content-chief-shakeup-layoffs-engagement-investors-2026-10", "summary": "Samuel Boivin/NurPhoto via Getty Images; Bloomberg/Getty Images Netflix stock never recovered from its Warner Bros. chase. Investors are waiting for a new growth story. A new content chief inherits Netflix's biggest job: making the streamer feel essential again. Sign up for First Trade , Business Insider's daily markets newsletter. My wife and I recently had a serious discussion: Was it time to pull the plug on Netflix ? Rankled by a seemingly unending streak of price increases — now up to $26.99 a month for the premium tier — we started to question whether it was worth the money. We ultimately decided to keep it. We're suckers for Netflix's many crime and sports docuseries, and I can't be without crucial NFL games. There's also content my kids are really into. But it was a close call! The fact that we had the discussion at all is a bad sign for a once-unassailable streaming service. These types of conversations are apparently playing out worldwide as Netflix sees a slowdown in both viewership and revenue. Some consumer-engagement metrics have been outright declining. Netflix appears to have gotten the message, announcing last week that Chief Content Officer Bela Bajaria would be replaced . The move came a day after Netflix said it would cut about 1,000 jobs , its biggest round of layoffs since 2022. Bajaria was known for adding depth to the Netflix lineup, including areas like sports and live events, reality TV, and video podcasts. But the streaming service struggled recently to establish what Wall Street calls \"watercooler originals,\" or Netflix-developed shows that cross over into mainstream culture. It's been a pretty barren landscape since \"Stranger Things\" wrapped up . And Netflix isn't just competing with other paid streamers anymore. It's fighting YouTube, TikTok, and Instagram for screen time — platforms that offer a never-ending stream of free video content. Beyond the content problem, investors are still processing the mega-deal Netflix let slip away. Netflix's Warner Bros. Discovery hangover Netflix wasn't just trying to make better originals on its own. It also went hard for Warner Bros. Discovery's streaming and studio assets, offering $72 billion for a shot at HBO Max and a deep bench of beloved franchises. After a significant back-and-forth, Paramount Skydance won the bidding war . It probably helped that Paramount was willing to buy all of WBD, while Netflix only wanted the film and TV studios, as well as HBO Max. Netflix shares declined a", "date_str": "2026-10-19T09:50:01+00:00", "hash": "35e78d2b7b851ce8", "title_fa": "نتفلیکس و فروش؟ چرا دوست داشتن سهام پخش کننده سخت تر می شود.", "summary_fa": "ساموئل بویوین/نور عکس از طریق گتی ایماژ. بلومبرگ/گتی ایماژ سهام نتفلیکس هرگز پس از تعقیب و گریز برادران وارنر بهبود نیافت. سرمایه گذاران منتظر یک داستان رشد جدید هستند. مدیر محتوای جدید بزرگترین کار نتفلیکس را به ارث برده است: ایجاد احساس ضروری در استریمر. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. من و همسرم اخیراً بحث جدی داشتیم: آیا زمان آن رسیده بود که نتفلیکس را قطع کنیم؟ با توجه به یک رگه به ​​ظاهر پایان ناپذیر افزایش قیمت - در حال حاضر تا 26.99 دلار در ماه برای سطح برتر - ما شروع به این سوال کردیم که آیا ارزش پول را دارد یا خیر. ما در نهایت تصمیم گرفتیم آن را حفظ کنیم. ما مشتاق بسیاری از مستندهای جنایی و ورزشی نتفلیکس هستیم، و من نمی توانم از بازی های مهم NFL بی بهره باشم. همچنین محتوایی وجود دارد که فرزندان من واقعاً به آن علاقه دارند. اما این یک تماس نزدیک بود! این واقعیت که ما اصلاً بحث را داشتیم، نشانه بدی برای یک سرویس پخش جریانی است که زمانی غیرقابل نفوذ بود. این نوع مکالمات ظاهراً در سراسر جهان پخش می شوند زیرا نتفلیکس شاهد کاهش سرعت بینندگان و درآمد است. برخی از معیارهای تعامل با مصرف کننده به طور کامل در حال کاهش بوده است. به نظر می رسد نتفلیکس این پیام را دریافت کرده و هفته گذشته اعلام کرد که مدیر ارشد محتوای بلا باجاریا جایگزین خواهد شد. این اقدام یک روز پس از آن صورت گرفت که نتفلیکس اعلام کرد حدود 1000 شغل را کاهش می دهد که بزرگترین دور اخراج از سال 2022 است. Bajaria به خاطر عمق بخشیدن به مجموعه نتفلیکس، از جمله حوزه هایی مانند ورزش و رویدادهای زنده، تلویزیون واقعیت و پادکست های ویدیویی معروف بود. اما سرویس استریم اخیراً برای ایجاد چیزی که"}, {"source": "Business Insider", "title": "10 people on weathering 12 months of immigration turmoil", "link": "https://www.businessinsider.com/foreign-workers-us-immigration-turmoil-personal-stories-2026-10", "summary": "10 people tell all about the uncertainty, risk, and reward of navigating the US immigration system. Sean Marc Lee, Angela Ponce, Chinky Shukla, Ian Tuttle for BI The H-1B visa system is one of high stakes , shifting rules , and little certainty . Over the past year, Business Insider has spoken to more than 20 H-1B visa holders and hopefuls about their decisions to opt in, push through, and sometimes give up on the H-1B American Dream as the Trump administration has become increasingly hostile to foreign workers. As part of our H-1B Fallout series, published one year after the Trump administration introduced a $100,000 payment for some new H-1B petitions, we are telling the stories of people navigating the visa system. Some left the US and returned to their home countries , while others rebuilt elsewhere or are still trying to build a career in the US. This story is part of Business Insider's \" H-1B Fallout: 1 year later \" series. Read more of our coverage of how the Trump administration's H-1B visa changes affect workers: The winners and losers of the new H-1B era The new lands of opportunity The hidden sacrifices of chasing an H-1B career in America I missed out on the H-1B lottery 3 times. I wasn't ready to give up on my career in the US. In a statement, a White House spokesperson said the goal of the $100,000 H-1B fee is to focus on sponsoring \"truly highly specialized temporary labor.\" A Department of State spokesperson said the US is unapologetic about its \"America first visa policies\" and that the administration is working with partners to facilitate necessary visas. A Department of Labor spokesperson said the administration is protecting American jobs and increasing wages. Keep reading to see what life has been like for people affected by the US's immigration policy changes. Soumi Chanda, 35 Paromita Chatterjee for BI Country of origin: India Lives in: Kolkata, India Industry: Customer Service Education: BA and master's degree in organizational leadership from Gonzaga University Soumi Chanda had spent 13 years building a life in the US when a 2025 layoff put her H-1B status at risk. Chanda moved from Kolkata to Spokane, Washington, in 2013 for graduate school. She was selected for an H-1B on her first attempt in 2021 — \"pure luck,\" she said — and Amazon later took over her sponsorship, prompting her move to Seattle. When Amazon laid her off, Chanda had 60 days to find a new sponsor or leave the country. \"Sixty days sounded impossible from the start,", "date_str": "2026-10-19T09:49:05+00:00", "hash": "89e71ad1b40d6718", "title_fa": "10 نفر در تحمل 12 ماه آشفتگی مهاجرت", "summary_fa": "10 نفر همه چیز را در مورد عدم اطمینان، خطر و پاداش ناوبری در سیستم مهاجرت ایالات متحده می گویند. شان مارک لی، آنجلا پونس، چینکی شوکلا، ایان تاتل برای BI سیستم ویزای H-1B یکی از مخاطرات بالا، تغییر قوانین و اطمینان کمی است. در طول سال گذشته، Business Insider با بیش از 20 دارنده ویزای H-1B و امیدوار در مورد تصمیمات آنها برای انتخاب، فشار دادن و گاهی اوقات کنار گذاشتن رویای آمریکایی H-1B صحبت کرده است، زیرا دولت ترامپ به طور فزاینده ای خصمانه با کارگران خارجی شده است. به عنوان بخشی از سری H-1B Fallout ما، که یک سال پس از ارائه پرداخت 100000 دلاری توسط دولت ترامپ برای برخی از درخواست‌های جدید H-1B منتشر شد، ما داستان افرادی را که در حال پیمایش در سیستم ویزا هستند، می‌گوییم. برخی از آنها ایالات متحده را ترک کردند و به کشورهای خود بازگشتند، در حالی که برخی دیگر در جای دیگری بازسازی کردند یا هنوز در تلاش برای ایجاد شغل در ایالات متحده هستند. این داستان بخشی از مجموعه \"H-1B Fallout: 1 year later\" Business Insider است. پوشش ما در مورد تأثیر تغییرات ویزای H-1B دولت ترامپ بر کارگران را بیشتر بخوانید: برندگان و بازندگان دوره جدید H-1B سرزمین های جدید فرصت ها فداکاری های پنهان تعقیب شغل H-1B در آمریکا من 3 بار در قرعه کشی H-1B از دست دادم. من حاضر نبودم از کارم در ایالات متحده دست بکشم. سخنگوی کاخ سفید در بیانیه‌ای گفت که هدف از پرداخت ۱۰۰ هزار دلاری هزینه H-1B تمرکز بر حمایت مالی از «کار موقت واقعاً بسیار تخصصی» است. سخنگوی وزارت امور خارجه گفت که ایالات متحده در مورد \"سیاست های ویزای اول آمریکا\" خود عذرخواهی نمی کند و دولت با شرکای خود برای تسهیل صدور روادید ضروری کار می کند. سخنگوی وزارت کار گفت که دولت از مشاغل آمریکایی"}, {"source": "Business Insider", "title": "The 10 universities with the most current US senators among their graduates", "link": "https://www.businessinsider.com/colleges-universities-with-most-us-senators-among-graduates-2026-10", "summary": "Cory Booker attended Stanford University and Yale University. Gary Reyes/MediaNews Group/Bay Area News via Getty Images Some US colleges have numerous alums who went on to prolific political careers in the Senate. Many of the colleges listed are Ivy League or have extremely low acceptance rates. Harvard University tops the list, with 13 current senators among its alums. US senators come from all sorts of different educational backgrounds . Some graduated from the US Naval Academy or smaller private schools, but 42 of the 100 US senators came from 10 prominent universities, according to biographies on the US Senate website. Harvard University , the oldest college in the country and one of the hardest to get into , boasts the largest number of current senators among its alums. The senators on this list are alums of the schools' undergraduate, graduate, doctoral, law, or medical programs, and some have graduated from multiple of the listed universities. Honorary degrees and schools a senator attended without graduating were excluded. Here's a look at which US colleges have produced the most current senators. Brigham Young University BYU had a 70.2% acceptance rate for its current freshman class. George Frey/Bloomberg via Getty Images Senators: Mike Crapo (R-ID), Mike Lee (R-UT), and John Curtis (R-UT). Sen. Crapo graduated from BYU in Utah with a bachelor's degree in political science, as did Sen. Lee. Sen. Curtis earned a bachelor's degree in business management. Duke University DURHAM, NC - OCTOBER 26: A general view of the Duke University Chapel on campus of Duke University on October 26, 2013 in Durham, North Carolina. (Photo by Lance King/Getty Images) Lance King/Getty Images Senators: Angela Alsobrooks (D-MD), Shelley Moore Capito (R-WV), Rand Paul (R-KY). Sen. Alsobrooks studied public policy, Sen. Moore Capito studied zoology, and Sen. Paul received a medical degree. Princeton University Student walk along the campus of Princeton University in Princeton, New Jersey. (Photo by Rick Friedman/Corbis via Getty Images) Rick Friedman/Corbis via Getty Images Senators: Ted Cruz (R-TX), Dave McCormick (R-PA), Jeff Merkley (D-OR). Princeton is an Ivy League university. Sen. Cruz earned a bachelor's degree in public policy, Sen. McCormick earned a Ph.D. in international relations, and Sen. Merkley earned a master's degree in public affairs. Dartmouth College Baker-Berry Library on the campus of Dartmouth College in Hanover, New Hampshire, U.S., on Sunday, Oct. 1", "date_str": "2026-10-19T09:38:01+00:00", "hash": "3cc4307b00222493", "title_fa": "10 دانشگاهی که بیشترین سناتورهای آمریکایی را در میان فارغ التحصیلان خود دارند", "summary_fa": "کوری بوکر در دانشگاه استنفورد و دانشگاه ییل شرکت کرد. گری ریس/گروه رسانه نیوز/اخبار منطقه خلیج از طریق گتی ایماژ برخی از کالج های ایالات متحده دارای دانش آموختگان متعددی هستند که به مشاغل سیاسی پربار در سنا ادامه دادند. بسیاری از کالج های ذکر شده Ivy League هستند یا نرخ پذیرش بسیار پایینی دارند. دانشگاه هاروارد با 13 سناتور فعلی در صدر این فهرست قرار دارد. سناتورهای ایالات متحده از انواع و اقسام زمینه های تحصیلی متفاوت هستند. برخی از آنها از آکادمی نیروی دریایی ایالات متحده یا مدارس خصوصی کوچکتر فارغ التحصیل شدند، اما بر اساس بیوگرافی در وب سایت سنای ایالات متحده، 42 نفر از 100 سناتور آمریکایی از 10 دانشگاه برجسته بودند. دانشگاه هاروارد، قدیمی‌ترین کالج در کشور و یکی از سخت‌ترین کالج‌ها برای ورود به آن، بیشترین تعداد سناتورهای فعلی را در میان دانش آموختگان خود دارد. سناتورهای موجود در این فهرست، فارغ التحصیلان دوره های کارشناسی، کارشناسی ارشد، دکتری، حقوق یا پزشکی این مدارس هستند و برخی از آنها از چندین دانشگاه ذکر شده فارغ التحصیل شده اند. مدارک افتخاری و مدارسی که یک سناتور بدون فارغ التحصیلی در آن شرکت می کرد، حذف شدند. در اینجا نگاهی می اندازیم به این که کدام کالج های ایالات متحده بیشترین سناتورها را تولید کرده اند. دانشگاه Brigham Young BYU 70.2% نرخ پذیرش برای کلاس دانشجوی سال اول خود داشت. جورج فری/ بلومبرگ از طریق گتی ایماژ سناتورها: مایک کراپو (R-ID)، مایک لی (R-UT)، و جان کرتیس (R-UT). سناتور کراپو از BYU در یوتا با مدرک لیسانس در علوم سیاسی فارغ التحصیل شد، همانطور که سناتور لی. سناتور کورتیس مدرک لیسانس خود را در رشته مدیریت بازرگانی گرفت. دانشگاه دوک دورهام، NC - 26 اکتبر: نمایی کلی از کلیسای کوچک دانشگاه دوک در محوطه دانشگاه دوک در 26 اکتبر 2013 در دورهام، کارولینای شمالی. (عکس از"}, {"source": "Business Insider", "title": "Math's 'romantic era' is over, UCLA prodigy says", "link": "https://www.businessinsider.com/math-ai-tools-openai-terence-tao-ucla-2026-10", "summary": "Terence Tao, a UCLA math professor who earned a doctorate at age 20, said that math is entering a new, less heroic age. Jesse Grant/Getty Images Terence Tao, now a UCLA professor, earned his doctorate in mathematics at 20. The prodigy said his work is changing in the age of AI. With AI tools doing the legwork, math is no longer \"heroic,\" Tao said. AI is upending mathematics . For one top professor, the issue is just as spiritual as it is practical. Terence Tao, a renowned professor at UCLA, said in a recent podcast appearance that the \"romantic era\" of math is over, thanks to AI tools capable of solving hundreds of problems with some simple prompting. Now, he said, even leading scholars like him are reduced to sorting through reams of AI-generated proofs, instead of doing the \"heroic\" solving themselves. \"We are moving to an industrial era where math will become much more large-scale,\" Tao said in an interview this week on Numberphile, a YouTube channel dedicated to math. \"We are entering an era where exciting new things are possible, but some things are being lost,\" he added. OpenAI began its brusque push into the field by solving the Navier-Stokes equation in early September, one of math's millennium problems. The revelation that AI had cracked it caused consternation from many a math geek. Some mathematicians also expressed frustration that while the AI model might have solved the problem, it didn't show its work, leaving them with the less celebratory task of verifying it. Then, earlier this month, OpenAI said it cracked another 700 outstanding problems. A math professor at New York University told CNBC that the company's release had derailed work by early-career mathematicians. \"We've had whole research programs wiped out on Tuesday by their dump,\" the professor, Tristan Buckmaster, said at the time. In a separate brouhaha in September, OpenAI backed out of a sponsorship for a so-called AI \"mathathon\" — an event organized by undergraduates at Caltech, where participants were encouraged to use AI to solve equations — after complaints from a group of more senior academics. Event organizers told Business Insider at the time that their professors were sorely out of touch with the field's trajectory. \"We look to the future, and we don't even know if there's going to be grad school open positions by the time we get to Ph.D,\" one organizer, Caiman Moreno-Earle, said. Though OpenAI has said it is taking steps to ensure human academics retain their role in thi", "date_str": "2026-10-19T09:27:01+00:00", "hash": "1f83fcbdffea6c8a", "title_fa": "اعجوبه UCLA می گوید، «دوران عاشقانه» ریاضی به پایان رسیده است", "summary_fa": "ترنس تائو، استاد ریاضی دانشگاه UCLA که در 20 سالگی مدرک دکترا گرفت، گفت که ریاضیات در حال ورود به عصر جدید و کمتر قهرمانانه است. Jesse Grant/Getty Images ترنس تائو، که اکنون استاد دانشگاه UCLA است، در 20 سالگی دکترای خود را در ریاضیات گرفت. این اعجوبه گفت که کارش در عصر هوش مصنوعی در حال تغییر است. تائو گفت، با وجود ابزارهای هوش مصنوعی که کار را انجام می دهند، ریاضی دیگر «قهرمانانه» نیست. هوش مصنوعی در حال تغییر ریاضیات است. برای یک استاد برتر، موضوع به همان اندازه معنوی است که عملی است. ترنس تائو، استاد مشهور دانشگاه UCLA، در پادکست اخیر خود گفت که «دوران عاشقانه» ریاضی به لطف ابزارهای هوش مصنوعی که قادر به حل صدها مشکل با چند تلقین ساده هستند، به پایان رسیده است. اکنون، او گفت، حتی دانشمندان برجسته ای مانند او به جای اینکه خودشان «قهرمانانه» را حل کنند، به دسته‌بندی برهان‌های تولید شده توسط هوش مصنوعی تنزل یافته‌اند. تائو در مصاحبه ای در این هفته در کانال یوتیوب Numberphile که به ریاضیات اختصاص دارد، گفت: \"ما به عصر صنعتی می رویم که در آن ریاضیات در مقیاس بسیار بزرگ تر خواهند شد.\" وی افزود: «ما وارد دورانی می شویم که در آن چیزهای جدید هیجان انگیز امکان پذیر است، اما برخی چیزها در حال از دست رفتن هستند. OpenAI با حل معادله Navier-Stokes در اوایل سپتامبر، یکی از مسائل هزاره ریاضی، فشار بی‌معنای خود را به این میدان آغاز کرد. افشای اینکه هوش مصنوعی آن را کرک کرده است باعث حیرت بسیاری از متخصصان ریاضی شد. برخی از ریاضیدانان نیز ابراز ناامیدی کردند که در حالی که مدل هوش مصنوعی ممکن است مشکل را حل کرده باشد، اما کار خود را نشان نداد و آنها را با کار کمتر جشن تأیید صحت آن مواجه کرد. سپس، اوایل این ماه، OpenAI"}, {"source": "Business Insider", "title": "The concern that the KPMG US CEO keeps hearing from other executives", "link": "https://www.businessinsider.com/kpmg-ceo-leaders-cybersecurity-fears-rise-ai-2026-10", "summary": "Tim Walsh, CEO and chair of KPMG US, said he routinely hears about cybersecurity concerns from fellow leaders. Tasos Katopodis/Getty Images for Semafor World Economy CEOs are excited about AI, but increasingly worried about cybersecurity, KPMG US CEO Tim Walsh said. “The cyber risks have just elevated to places that we’ve never seen before,\" he told Business Insider. KPMG is creating a cyber-defense business built around AI. Corporate leaders tend to be enthusiastic about AI's potential — and increasingly concerned about the cybersecurity challenges the technology brings. Tim Walsh, CEO and chair of KPMG US, said the worries come up in nearly every meeting he has with fellow leaders, as AI gives bad actors new ways to try to breach corporate defenses. \"The cyber risks have just elevated to places that we've never seen them before,\" he told Business Insider. Walsh pointed to the Hugging Face incident this past summer, in which OpenAI said an AI agent bypassed controls during an internal cybersecurity evaluation and accessed parts of the open-source AI platform's systems. There isn't currently a defensive wall, he said, that's capable of rebuffing every cyber threat. He said KPMG is working with the frontier AI model developers and others on further protections. The goal is to help the Big Four firm protect its business, and its clients' businesses, Walsh said, adding that he sees it as a potential opportunity worth more than $1 billion. 'Cyber insecurity' fears Unease about AI and cyber threats showed up in a recent KPMG US survey of 400 CEOs at major US companies. While leaders reported confidence in AI's potential, cybersecurity was the concern they identified most often. Eighty-five percent said cybercrime and \"cyber insecurity\" could affect their company's prosperity over the next three years — more than said the same about inflation, geopolitical tensions, the pace of technological change, or other risks. Cybersecurity was also the most commonly cited challenge to implementing AI . It topped ethical questions, data readiness, cost management, and translating AI spending into measurable returns. Leaders said they were particularly concerned about identity theft and data privacy, vulnerability to cyberattacks, and fraud detection and prevention. Nearly half said they planned to increase cybersecurity investment over the next three years, citing threats including AI-powered social engineering, AI-assisted phishing or malware, and data and privacy risks ti", "date_str": "2026-10-19T09:18:01+00:00", "hash": "e51a0e3a0442c965", "title_fa": "نگرانی‌هایی که مدیرعامل KPMG ایالات متحده مدام از سایر مدیران می‌شنود", "summary_fa": "تیم والش، مدیر عامل و رئیس کی‌پی‌ام‌جی آمریکا، گفت که به طور معمول نگرانی‌های مربوط به امنیت سایبری را از رهبران دیگر می‌شنود. تاسوس کاتوپودیس/ گتی ایماژ برای Semafor World Economy، تیم والش، مدیر عامل شرکت KPMG در ایالات متحده، گفت: مدیران عامل شرکت های سازنده در مورد هوش مصنوعی هیجان زده هستند، اما به طور فزاینده ای نگران امنیت سایبری هستند. او به Business Insider گفت: «خطرات سایبری به‌تازگی به مکان‌هایی رسیده است که قبلاً ندیده‌ایم. KPMG در حال ایجاد یک تجارت دفاع سایبری است که بر اساس هوش مصنوعی ساخته شده است. رهبران شرکت‌ها تمایل دارند در مورد پتانسیل هوش مصنوعی مشتاق باشند - و به طور فزاینده‌ای نگران چالش‌های امنیت سایبری این فناوری هستند. تیم والش، مدیرعامل و رئیس کی‌پی‌ام‌جی آمریکا، گفت: نگرانی‌ها تقریباً در هر جلسه‌ای که او با رهبران دیگر دارد مطرح می‌شود، زیرا هوش مصنوعی راه‌های جدیدی را به بازیگران بد می‌دهد تا تلاش کنند از دفاع شرکت‌ها عبور کنند. او به Business Insider گفت: «خطرات سایبری به‌تازگی به مکان‌هایی رسیده‌اند که قبلاً آنها را ندیده‌ایم. والش به حادثه Hugging Face در تابستان گذشته اشاره کرد که در آن OpenAI گفت یک عامل هوش مصنوعی کنترل‌ها را در طول ارزیابی امنیت سایبری داخلی دور زد و به بخش‌هایی از سیستم‌های پلتفرم هوش مصنوعی منبع باز دسترسی پیدا کرد. او گفت که در حال حاضر یک دیوار دفاعی وجود ندارد که بتواند هر تهدید سایبری را دفع کند. او گفت که KPMG با توسعه دهندگان مدل هوش مصنوعی مرزی و سایرین برای حفاظت بیشتر کار می کند. والش گفت که هدف کمک به شرکت چهار بزرگ برای محافظت از کسب و کار خود و مشتریانش است و افزود که او آن را فرصتی بالقوه به ارزش بیش از 1 میلیارد دلار می داند. ترس از «ناامنی سایبری» نگرانی از هوش مصنوعی و تهدیدات سایبری در"}, {"source": "Business Insider", "title": "Small business owners: We want to hear your AI stories", "link": "https://www.businessinsider.com/small-business-ai-survey-2026-10", "summary": "Business Insider wants to connect with small-business owners who use AI. Frazao Studio Latino/Getty Images Running a small business can be an enormous undertaking. Some owners are leveraging AI to streamline tasks, scale up, and boost productivity. Are you a small-business owner using AI? We want to hear from you! Small businesses are the backbone of the US economy. Over 33 million small businesses were operating across the United States as of 2025, and they employ nearly half of the nation's workforce , according to the US Chamber of Commerce. About 99% of businesses in the US are small businesses. Keeping a small business afloat is no easy feat, though. Attracting customers. Hiring employees. Advertising. Paying out of pocket for business needs. There's a seemingly never-ending set of hurdles that can quickly become overwhelming, especially for a tiny team. That's why some small business owners have enlisted an extra pair of hands, or rather, code. AI has become a liferaft for some businesses as they look to streamline operations, scale their products, or elevate productivity. Are you a small business using AI to level up? We'd love to hear from you! Read the original article on Business Insider", "date_str": "2026-10-19T09:17:01+00:00", "hash": "276e902b2114af51", "title_fa": "صاحبان مشاغل کوچک: ما می خواهیم داستان های هوش مصنوعی شما را بشنویم", "summary_fa": "Business Insider می خواهد با صاحبان مشاغل کوچک که از هوش مصنوعی استفاده می کنند ارتباط برقرار کند. Frazao Studio Latino/Getty Images اداره یک کسب و کار کوچک می تواند کار بزرگی باشد. برخی از مالکان از هوش مصنوعی برای ساده کردن وظایف، افزایش مقیاس و افزایش بهره وری استفاده می کنند. آیا شما صاحب یک کسب و کار کوچک هستید که از هوش مصنوعی استفاده می کند؟ ما می خواهیم از شما بشنویم! کسب و کارهای کوچک ستون فقرات اقتصاد ایالات متحده هستند. بر اساس گزارش اتاق بازرگانی ایالات متحده، تا سال 2025 بیش از 33 میلیون کسب و کار کوچک در سراسر ایالات متحده مشغول به کار بودند و تقریباً نیمی از نیروی کار کشور را به کار می گیرند. حدود 99 درصد از مشاغل در ایالات متحده مشاغل کوچک هستند. با این حال، حفظ یک کسب و کار کوچک کار آسانی نیست. جذب مشتری. استخدام کارمندان. تبلیغات. پرداخت از جیب برای نیازهای تجاری. مجموعه‌ای از موانع به ظاهر پایان ناپذیر وجود دارد که می‌تواند به‌سرعت بسیار زیاد شود، مخصوصاً برای یک تیم کوچک. به همین دلیل است که برخی از صاحبان مشاغل کوچک یک جفت دست اضافی یا بهتر است بگوییم کد را انتخاب کرده اند. هوش مصنوعی برای برخی از کسب‌وکارها تبدیل به یک قایق نجات شده است، زیرا آنها به دنبال ساده‌سازی عملیات، مقیاس‌بندی محصولات خود یا افزایش بهره‌وری هستند. آیا شما یک کسب و کار کوچک هستید که از هوش مصنوعی برای ارتقاء سطح استفاده می کنید؟ ما دوست داریم از شما بشنویم! مقاله اصلی را در Business Insider بخوانید"}, {"source": "Business Insider", "title": "Microsoft's ex-VP of HR shares 3 effective ways to use AI at work — and what he never uses it for", "link": "https://www.businessinsider.com/effective-ways-to-use-ai-at-work-2026-10", "summary": "When embraced and used carefully, AI tools can help gain perspective and boost productivity at work. Alex Cristi /Getty Images | Chris Williams Chris Williams was the VP of HR at Microsoft and is now an advisor and consultant. Williams uses a broad range of AI tools and encourages his clients to do the same. \"Perhaps you'll find, as I did: AI can be better at deletion than creation,\" he says. Practically every company is making AI tools available to their employees. As the former VP of HR at Microsoft and a leadership advisor with over 50 years of business experience, I'm amazed at how quickly this rollout has progressed. Some people are all in, using the tools for nearly everything they do. Others have barely stuck their toes in the AI waters. I've been using a broad range of AI tools and encourage my clients to do the same. AI isn't without controversy , and if someone is strongly against using it — for whatever reason — I'm not going to convince them otherwise. But if you're wondering how and why you should use these tools, I'm here for you. Let's talk about three ways I advise all my executive clients to use AI effectively in the workplace. 1. Use AI as a second opinion Use AI as a way to see things you might not have seen. Ask it, \"What am I missing?\" I agree with many that AI is lousy at most creative efforts. Whether written or visual, AI results can be generic, mediocre, and often embarrassing. The output usually deserves the \" AI Slop \" label it gets. But to dismiss it entirely misses a core value. AI is useful with, perhaps even because of, that generic, often obvious other perspective. It can be amazingly helpful to simply ask: what am I missing? Since AI has a tendency to agree with me, I explicitly ask for pushback: \"review this and tell me what I'm missing, tell me where I'm wrong.\" The fact that AI is so obvious, so average, is actually a core value here. I'm often surprised at the points I missed and the viewpoints I overlooked. Even if AI doesn't find things you missed, a contrarian angle can be very helpful to shore up your own case. You'll be able to say, \"Yes, I considered those things, and here's why my take on this issue is better.\" In that way, AI can also help you prepare for your discussions with colleagues. With so many letting AI draft their arguments, it's very valuable to see their perspective in advance. So no, I don't let AI make my case, but I always look for another perspective in what I do — wherever it comes from. Having ", "date_str": "2026-10-19T09:11:01+00:00", "hash": "f63a07506159c692", "title_fa": "معاون سابق منابع انسانی مایکروسافت 3 روش موثر برای استفاده از هوش مصنوعی در محل کار را به اشتراک می‌گذارد – و آنچه که هرگز از آن استفاده نمی‌کند", "summary_fa": "هنگامی که ابزارهای هوش مصنوعی به دقت مورد استفاده قرار گیرند و استفاده شوند، می توانند به دستیابی به دیدگاه و افزایش بهره وری در محل کار کمک کنند. الکس کریستی /گتی ایماژ | کریس ویلیامز کریس ویلیامز معاون منابع انسانی مایکروس
