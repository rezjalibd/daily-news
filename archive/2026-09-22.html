internet applications for AI agents. Meta s Muse is a big test that could revolutionize browsing, like Apple s App Store. Samuel Boivin/NurPhoto via Getty Images Connectors are all the rage in Silicon Valley. They're like a set of keys for AI agents. They help complete tasks with more accuracy. They could spawn an App Store-like internet remodel — if businesses let agents use their services. The next phase of the internet could rely on a new set of keys for AI agents. They're called connectors. Connectors are links that let an agent — with a user's permission —use an internet service. For example, if someone wants to make dinner plans through an AI assistant, the agent could use a calendar connector to check when everyone is free and a restaurant reservation connector to find a table. After the user approves, it could make the booking. The internet-key-like tool keeps the AI agents cleanly focused on a single task, like getting that perfect dinner reservation. A connector often runs on a service's API, the underlying technical doorway that lets software applications communicate with each other. Silicon Valley executives are sounding increasingly bullish on the idea that connectors could be the next gigantic internet shift. Box CEO Aaron Levie wrote on X that personal agents and connectors could create the \"biggest opportunity and shakeup in consumer tech since the App Store itself,\" which shifted much of the internet from websites in a browser to apps on a phone screen. If he's right, that could change how we build the internet for AI tools. Meta is giving that idea a high-profile early test with Muse, its consumer-focused personal AI agent. Meta says — unlike Claude and ChatGPT, which have largely focused on enterprise applications — Muse can take on annoying errands that require consumers to hop between apps and accounts, like finding the cheapest price for a product or purchasing the right back-to-school supplies for multiple children. On Monday, Muse was the most-downloaded free app in Apple's US App Store. Muse's usefulness largely rests on which services offer those connector keys. So far, reactions from the business community have been mixed. Amazon blocked Muse agents from shopping on its website, citing its terms of use. Shopify's CEO, Tobi Lütke, had a noticeably warmer reaction, announcing a partnership while posting a picture of Muse's snuggly-looking mascot holding a Shopify-branded bag. We are excit", "date_str": "2026-09-22T09:03:01+00:00", "hash": "0b987f0f6dc3a306", "title_fa": "اتصالات هوش مصنوعی می توانند جرقه رونق بعدی به سبک App Store را بزنند. در اینجا نحوه کار آنها آمده است.", "summary_fa": "کانکتورها اساسا کلید برنامه های اینترنتی خاص برای عوامل هوش مصنوعی هستند. Meta s Muse یک آزمایش بزرگ است که می تواند مانند فروشگاه App اپل انقلابی در مرور ایجاد کند. Samuel Boivin/NurPhoto از طریق Getty Images اتصال دهنده ها در دره سیلیکون بسیار محبوب هستند. آنها مانند مجموعه ای از کلیدها برای عوامل هوش مصنوعی هستند. آنها به تکمیل وظایف با دقت بیشتری کمک می کنند. اگر کسب و کارها به نمایندگان اجازه دهند از خدمات آنها استفاده کنند، می توانند یک بازسازی اینترنتی شبیه به فروشگاه App ایجاد کنند. مرحله بعدی اینترنت می تواند بر مجموعه جدیدی از کلیدها برای عوامل هوش مصنوعی تکیه کند. به آنها اتصال دهنده می گویند. رابط‌ها پیوندهایی هستند که به یک نماینده - با اجازه کاربر - اجازه می‌دهند از یک سرویس اینترنت استفاده کنند. برای مثال، اگر شخصی بخواهد از طریق دستیار هوش مصنوعی برنامه‌های شام را تنظیم کند، نماینده می‌تواند از یک رابط تقویم برای بررسی آزاد بودن همه و یک رابط رزرو رستوران برای یافتن میز استفاده کند. پس از تایید کاربر، می تواند رزرو را انجام دهد. ابزاری مانند کلید اینترنت، عوامل هوش مصنوعی را به طور خالص روی یک کار متمرکز می‌کند، مانند رزرو شام عالی. یک رابط اغلب بر روی API یک سرویس اجرا می شود، درگاه فنی زیربنایی که به برنامه های کاربردی نرم افزار اجازه می دهد با یکدیگر ارتباط برقرار کنند. مدیران سیلیکون ولی به طور فزاینده‌ای نسبت به این ایده که کانکتورها می‌توانند تغییر عظیم اینترنتی بعدی باشند، خوش بین هستند. Aaron Levie، مدیرعامل Box در X نوشت که عوامل و رابط‌های شخصی می‌توانند «بزرگ‌ترین فرصت و تغییر در فناوری مصرف‌کننده از زمان خود فروشگاه App» را ایجاد کنند، که بخش زیادی از اینترنت را از وب‌سایت‌های موجود در یک مرورگر به برنامه‌های روی صفحه تلفن تغییر می‌دهد. اگر درست می‌گوید، این"}, {"source": "Business Insider", "title": "Instinct took Silicon Valley by storm. Meet the 'brilliant' 23-year-old college dropout who started it.", "link": "https://www.businessinsider.com/noah-shinn-instinct-ai-competes-meta-muse-2026-9", "summary": "Rebecca Zisser/BI Noah Shinn was publishing influential AI research before he graduated from college. Now, at the ripe age of 23, he's taking on Mark Zuckerberg . Shinn's invite-only AI assistant, Instinct, seemingly came out of nowhere this summer, went viral among Silicon Valley insiders, and raised $250 million at a whopping $2.5 billion valuation. Its breakout has turned the college dropout into one of AI's hottest young founders and put his tiny startup in direct competition with another company started by a college dropout: Meta. Shinn dropped out of Northeastern University in 2023 and quietly developed a reputation as something of an AI wunderkind. He's been publishing high-level research papers on AI agents — exactly what Instinct does — since he was an undergrad, when he stood out to his professors for his drive and independence. He also has a competitive streak from his days as an avid basketball player, to reportedly getting his investors to stop backing a rival startup. Instinct's rapid rise captures a new phase of the AI race. After years of competing over which company could build the smartest chatbot, the battle is shifting toward assistants that can actually get things done, such as booking hotels, scheduling meetings, and handling everyday errands with minimal prompting. Meta and other tech giants have enormous advantages in money, computing power, and distribution. Shinn's unlikely ascent shows how quickly a small startup with the right product can still compete against Big Tech. Shinn didn't respond to interview requests. A spokesperson for Instinct confirmed several biographical details. The undergrad behind a pioneering AI paper Weeks after the November 2022 launch of ChatGPT , Shinn — then a Northeastern undergraduate — answered a LinkedIn post from MIT professor Ashwin Gopinath, who was looking for students to tinker with the new technology over the holidays. Gopinath said he was \"kind of bored\" over Christmas and had an idea. Over the next three months, Gopinath, Shinn, and four others wrote a paper that discussed ways to make AI agents — then a nascent technology — better at learning from their mistakes. The paper's core idea was that an agent can improve by remembering its prior failures, and Gopinath, who went on to found his own AI startup, Sentra, now thinks that Instinct's magic could come from a similar approach. The paper, which was presented at NeurIPS, one of the world's most prestigious AI conferences, laid out a fundamen", "date_str": "2026-09-22T09:00:02+00:00", "hash": "8e9e6a3010868d4a", "title_fa": "غریزه سیلیکون ولی را با طوفان گرفت. با جوان 23 ساله ای که کالج را ترک کرده بود، آشنا شوید.", "summary_fa": "ربکا زیسر/بی‌آی نوح شین قبل از فارغ‌التحصیلی از کالج، پژوهش‌های تاثیرگذار هوش مصنوعی را منتشر می‌کرد. اکنون، در سن 23 سالگی، مارک زاکربرگ را به جان خریده است. دستیار هوش مصنوعی شین، Instinct، ظاهراً در تابستان امسال از ناکجاآباد بیرون آمد، در میان افراد خودی دره سیلیکون منتشر شد و 250 میلیون دلار با ارزش 2.5 میلیارد دلاری به دست آورد. شکست آن باعث شده است که انصراف از دانشگاه به یکی از داغ‌ترین بنیان‌گذاران جوان هوش مصنوعی تبدیل شود و استارت‌آپ کوچک او در رقابت مستقیم با شرکت دیگری قرار بگیرد که توسط یک ترک دانشگاه شروع شده است: Meta. شین در سال 2023 از دانشگاه نورث ایسترن انصراف داد و بی سر و صدا به عنوان چیزی شبیه به واندرکایند هوش مصنوعی شهرت پیدا کرد. او از زمانی که در مقطع لیسانس بود، مقالات تحقیقاتی سطح بالا را در مورد عوامل هوش مصنوعی منتشر می کرد - دقیقاً همان کاری که Instinct انجام می دهد - از زمانی که در مقطع لیسانس بود، زمانی که به دلیل انگیزه و استقلال خود در برابر اساتیدش متمایز بود. او همچنین از روزهایی که به عنوان یک بازیکن مشتاق بسکتبال فعالیت می کرد، تا زمانی که سرمایه گذارانش از حمایت از یک استارتاپ رقیب دست بردارند، یک دوره رقابتی دارد. رشد سریع Instinct مرحله جدیدی از مسابقه هوش مصنوعی را به تصویر می کشد. پس از سال‌ها رقابت بر سر اینکه کدام شرکت می‌تواند هوشمندترین ربات چت را بسازد، نبرد به سمت دستیارانی تغییر می‌کند که واقعاً می‌توانند کارها را انجام دهند، مانند رزرو هتل، برنامه‌ریزی جلسات، و انجام کارهای روزمره با حداقل تذکر. متا و سایر غول‌های فناوری مزایای بسیار زیادی در پول، قدرت محاسباتی و توزیع دارند. صعود بعید شین نشان می دهد که یک استارت آپ کوچک با محصول مناسب چقدر سریع می تواند با فناوری بزرگ رقابت"}, {"source": "Business Insider", "title": "NATO allies in Europe want more commercial satellite imagery to spot threats earlier, CEO says", "link": "https://www.businessinsider.com/nato-militaries-race-gain-satellite-imagery-access-strategic-early-warning-2026-9", "summary": "NATO is showing growing interest in commercial satellite imagery. 2026 Planet Labs PBC/via REUTERS NATO countries in Europe are increasingly interested in access to commercial satellite imagery. An industry executive said that countries see how Ukraine has successfully used this technology. They are also looking to build up their own capabilities as the US signals a shift away from Europe. Demand for commercial satellite imagery is rising across NATO as the alliance seeks greater access to expand its early-warning capabilities, a top industry executive told Business Insider. US satellite imaging company Planet Labs had roughly $4 billion in deals for satellite services in the pipeline as of its early September earnings call, CEO Will Marshall said in an interview last week. Around $1 billion of those are expected to come together in the coming quarters. Surging global interest in satellite imagery is at least partly driven by observations from ongoing conflicts, Marshall said. Commercial satellite imagery , for instance, has been a major advantage for Ukraine on the battlefield. NATO countries in Europe are also looking to strengthen their own intelligence-gathering capabilities as the US signals to European allies that they need to be more responsible for their own collective security . \"Europe needs its own eyes, and it needs them fast,\" Marshall said. An information advantage Space has become an essential domain for military operations, as Russia's full-scale invasion of Ukraine has demonstrated, with access to commercial satellite imagery providing critical intelligence, surveillance, and reconnaissance capabilities. The US and its allies use satellites to monitor adversarial behavior. US Space Force photo From Planet's fleet of Earth-imaging satellites in orbit, customers receive what Marshall described as \"strategic early warning\" — they can track developments such as the expansion of military sites or defense industry facilities and map patterns of life to understand potentially abnormal behavior. \"Space is one of those areas of new technology, along with drones and AI, that have proved themselves to be really significant for Ukraine,\" Marshall said. Specifically, satellite access provides Kyiv with an \"information advantage\" that, like the other emerging technologies , compensates for its smaller conventional fighting force. Much more is said about the role that satellite-based internet, such as SpaceX's Starlink , plays in Ukraine; less publicized", "date_str": "2026-09-22T09:00:01+00:00", "hash": "3112bb39ed81e28e", "title_fa": "مدیرعامل ناتو می گوید که متحدان ناتو در اروپا خواهان تصاویر ماهواره ای تجاری بیشتری هستند تا تهدیدات را زودتر تشخیص دهند", "summary_fa": "ناتو علاقه فزاینده ای به تصاویر ماهواره ای تجاری نشان می دهد. 2026 Planet Labs PBC/از طریق رویترز کشورهای ناتو در اروپا به طور فزاینده ای علاقه مند به دسترسی به تصاویر ماهواره ای تجاری هستند. یکی از مدیران صنعت گفت که کشورها می بینند که چگونه اوکراین با موفقیت از این فناوری استفاده کرده است. آنها همچنین به دنبال تقویت توانایی های خود هستند، زیرا ایالات متحده نشان می دهد که از اروپا دور شده است. یکی از مدیران ارشد صنعت به Business Insider گفت، تقاضا برای تصاویر ماهواره ای تجاری در سراسر ناتو در حال افزایش است زیرا این اتحاد به دنبال دسترسی بیشتر برای گسترش قابلیت های هشدار اولیه است. ویل مارشال، مدیر عامل شرکت آمریکایی Planet Labs در مصاحبه ای در هفته گذشته گفت که شرکت تصویربرداری ماهواره ای ایالات متحده، حدود 4 میلیارد دلار برای خدمات ماهواره ای در حال آماده سازی قرار داده است. انتظار می‌رود که حدود 1 میلیارد دلار از آن‌ها در سه ماهه آینده جمع شوند. مارشال گفت که افزایش علاقه جهانی به تصاویر ماهواره ای حداقل تا حدی ناشی از مشاهدات درگیری های جاری است. برای مثال، تصاویر ماهواره ای تجاری، مزیت بزرگی برای اوکراین در میدان جنگ بوده است. کشورهای ناتو در اروپا نیز به دنبال تقویت قابلیت های جمع آوری اطلاعات خود هستند، زیرا ایالات متحده به متحدان اروپایی سیگنال می دهد که آنها باید مسئولیت بیشتری در قبال امنیت جمعی خود داشته باشند. مارشال گفت: «اروپا به چشمان خود نیاز دارد و سریعاً به آنها نیاز دارد. یک مزیت اطلاعاتی همانطور که تهاجم تمام‌مقیاس روسیه به اوکراین نشان داد فضا به یک حوزه ضروری برای عملیات نظامی تبدیل شده است و دسترسی به تصاویر ماهواره‌ای تجاری که قابلیت‌های اطلاعاتی حیاتی، نظارتی و شناسایی را فراهم می‌کند. ایالات متحده و متحدانش از ماهواره ها برای نظارت بر رفتار"}, {"source": "Business Insider", "title": "Congratulations, you're a manager now! But there's no promotion — or a raise", "link": "https://www.businessinsider.com/workers-managing-ai-agents-bots-promotions-raises-2026-9", "summary": "Getty Images; Tyler Le/BI You entered your profession because you wanted to teach, code, write, create, or design. But thanks to AI — and the immense pressure to use it — you now spend less time practicing your craft and more time managing the technology that's doing the work you wanted to do. For many professionals, that means supervising agents: tools designed to perform tasks autonomously but that, in practice, require workers to set expectations, delegate assignments, evaluate performance, demand revisions, and intervene when things go wrong. Others manage a steady pipeline of AI-generated work, reviewing the output and taking responsibility for what ultimately ships. Congratulations! You're a manager now. You just won't be receiving the title or the raise. The idea that AI will turn everyone into a manager has been floating around for a while. Now companies are building around that premise. Salesforce unveiled earlier this month \"job-ready agents\" designed to do work in sales, customer service, e-commerce, and internal operations, while giving human employees tools to teach agents about their companies, coordinate them, and improve their performance. Meanwhile, Wipro, an Indian IT services company, has increased productivity through AI by the equivalent of 20,000 workers, according to chief technology officer Sandhya Arun, who envisions \"the same engineer managing a bunch of agents.\" At Daytona, a 30-person AI startup, each of the company's 16 engineers manages an average of five AI agents, CEO Ivan Burazin recently told Business Insider . It's to the point where he says no one at the company writes code anymore. For some workers, managing a digital workforce has become a new kind of workplace flex . I'm not being replaced by AI; I rule over AI. But plenty of others never asked to become the boss of the bots. That includes software engineers who pursued the principal or staff track because it offered career advancement without becoming a supervisor, only to find themselves becoming de facto managers of machines anyway. Sinda Khenine became a software engineer because she wanted to build things. Now, as a software and AI engineer at appliance maker Electrolux who is simultaneously building her own AI business, she spends much of her time managing the systems that do the building. Agents have allowed Khenine to produce far more code and build a company by herself — something she says would have been \"10 times harder\" in the past. Now she spends less tim", "date_str": "2026-09-22T08:11:02+00:00", "hash": "05d74afb9f512381", "title_fa": "تبریک می گویم، شما اکنون یک مدیر هستید! اما هیچ ارتقای یا افزایش حقوقی وجود ندارد", "summary_fa": "گتی ایماژ; Tyler Le/BI شما به این دلیل وارد حرفه خود شده اید که می خواهید آموزش دهید، کدنویسی کنید، بنویسید، ایجاد کنید یا طراحی کنید. اما به لطف هوش مصنوعی - و فشار بسیار زیاد برای استفاده از آن - اکنون زمان کمتری را صرف تمرین هنر خود می‌کنید و زمان بیشتری را برای مدیریت فناوری انجام می‌دهید که می‌خواهید انجام دهید. برای بسیاری از متخصصان، این به معنای نظارت بر عوامل است: ابزارهایی که برای انجام وظایف به طور مستقل طراحی شده‌اند، اما در عمل، کارگران را ملزم می‌کنند که انتظارات خود را تعیین کنند، وظایف را محول کنند، عملکرد را ارزیابی کنند، درخواست تجدیدنظر کنند، و در صورت بروز مشکل مداخله کنند. دیگران یک خط لوله ثابت از کارهای تولید شده توسط هوش مصنوعی را مدیریت می کنند، خروجی را بررسی می کنند و مسئولیت آنچه در نهایت ارسال می شود را بر عهده می گیرند. تبریک می گویم! تو الان مدیری شما فقط عنوان یا افزایش حقوق دریافت نخواهید کرد. مدتی است که این ایده که هوش مصنوعی همه را به یک مدیر تبدیل می کند، مطرح شده است. اکنون شرکت‌ها در حال ساختن حول این فرض هستند. Salesforce در اوایل این ماه از \"نمایندگان آماده کار\" رونمایی کرد که برای انجام کار در زمینه فروش، خدمات مشتری، تجارت الکترونیک و عملیات داخلی طراحی شده‌اند و در عین حال ابزارهایی را به کارمندان می‌دهد تا به نمایندگان درباره شرکت‌هایشان آموزش دهند، آنها را هماهنگ کنند و عملکردشان را بهبود بخشند. در همین حال، Wipro، یک شرکت خدمات فناوری اطلاعات هند، بهره‌وری را از طریق هوش مصنوعی به میزان 20000 کارگر افزایش داده است. ایوان بورازین، مدیرعامل این شرکت اخیراً به Business Insider گفته است که در Daytona، یک استارت آپ 30 نفره هوش مصنوعی، هر یک از 16 مهندس این شرکت به طور متوسط ​​پنج عامل"}, {"source": "Business Insider", "title": "The 'AI vibe check' shows Americans haven't completely turned on AI, but it's not getting better.", "link": "https://www.businessinsider.com/ai-superintelligence-doom-or-boom-public-sentiment-surveys-2026-9", "summary": "One daily AI tracker showed that Americans still support continued development of AI, but that sentiment is gradually waning. Vuk Valcic/SOPA Images/LightRocket via Getty Images The tech industry at large is having a frenzied debate about whether AI will kill us all. Surveys suggest public opinion on continued AI development remains unsettled. One \"AI vibe check\" tracker shows that respondents still support AI development. There's infighting among Silicon Valley insiders and elites about whether AI could kill us all and if frontier companies should slow down because of it. How do the normies feel, though? You know, the everyday people whose lives AI leaders say will be forever changed for generations to come? \"Lukewarm\" is how Jason Jones put it. Every day since February 16, 2024, Jones, a computational social scientist at Stony Brook University, has surveyed 11 different Americans to ask whether they agree or disagree with the following statement: \"I support further development of artificial intelligence .\" The sample size was dictated by budget. Jones spends about $10 per day, at around $ 0.80 per respondent, on a third-party platform that collects responses. Jones calls his tracker an \"AI vibe check.\" The professor said the sample size is too small to get an insightful daily read: \"It's kind of a noisy signal, and it ends up looking like a stock chart.\" Instead, Jones said the goal was to find the \"Three Island Mile\" moment, or the critical turning point, in which the US mood on AI completely shifts. That moment has yet to come. \"The major story here is that it doesn't move very much,\" Jones told Business Insider of the tracker. \"I'm capturing the mood, and the mood is ambivalent and has remained ambivalent.\" When the daily responses are pooled by month — roughly 300 responses at a time — Jones's tracker has consistently shown a net-positive support for further AI development. The sentiment, however, is hardly euphoric and is gradually trending downward. Jason Jones time-series chart shows that American sentiment toward the further development of AI is trending downward but remains above neutral. Courtesy Jason Jones Jones' data shows that the monthly average peaked in April 2025 at 1.57 on a seven-point scale running from -3 to 3, where 1 means \"somewhat agree.\" Across the 2026 responses collected so far, the average stood at 0.53 — still above neutral but notably cooler than the previous two years. Jones has collected more than 10,300 responses since ", "date_str": "2026-09-22T08:11:01+00:00", "hash": "eaf384b6b0d5a213", "title_fa": "«بررسی حس هوش مصنوعی» نشان می‌دهد که آمریکایی‌ها هوش مصنوعی را کاملاً روشن نکرده‌اند، اما بهتر نمی‌شود.", "summary_fa": "یک ردیاب روزانه هوش مصنوعی نشان داد که آمریکایی ها همچنان از توسعه مداوم هوش مصنوعی حمایت می کنند، اما این احساسات به تدریج در حال کاهش است. Vuk Valcic/SOPA Images/LightRocket از طریق Getty Images صنعت فناوری در کل بحث‌های دیوانه‌واری در مورد اینکه آیا هوش مصنوعی همه ما را خواهد کشت یا خیر، دارد. نظرسنجی‌ها نشان می‌دهد که افکار عمومی در مورد ادامه توسعه هوش مصنوعی ناآرام است. یکی از ردیاب‌های «بررسی حس هوش مصنوعی» نشان می‌دهد که پاسخ‌دهندگان همچنان از توسعه هوش مصنوعی پشتیبانی می‌کنند. درگیری‌های درونی بین خودی‌ها و نخبگان سیلیکون ولی در مورد اینکه آیا هوش مصنوعی می‌تواند همه ما را بکشد و آیا شرکت‌های مرزی باید به دلیل آن کاهش یابد، وجود دارد. با این حال، هنجارها چه احساسی دارند؟ می دانید، مردم عادی که رهبران هوش مصنوعی می گویند زندگی آنها برای نسل های آینده برای همیشه تغییر خواهد کرد؟ جیسون جونز آن را «ولرم» می‌گوید. از 16 فوریه 2024، جونز، دانشمند علوم اجتماعی محاسباتی در دانشگاه استونی بروک، هر روز از 11 آمریکایی مختلف نظرسنجی می کند تا از آنها بپرسد که آیا آنها با جمله زیر موافق یا مخالف هستند: \"من از توسعه بیشتر هوش مصنوعی حمایت می کنم.\" حجم نمونه بر اساس بودجه تعیین شد. جونز حدود 10 دلار در روز، در حدود 0.80 دلار به ازای هر پاسخ دهنده، بر روی یک پلتفرم شخص ثالث که پاسخ ها را جمع آوری می کند، خرج می کند. جونز ردیاب خود را \"بررسی حس هوش مصنوعی\" می نامد. پروفسور گفت که حجم نمونه برای خواندن روزانه روشن‌تر آن‌قدر کوچک است: \"این یک سیگنال پر سر و صدا است و در نهایت مانند نمودار سهام به نظر می‌رسد.\" در عوض، جونز گفت که هدف یافتن لحظه «سه جزیره مایل» یا نقطه عطف حیاتی است که در آن حال و هوای ایالات متحده در"}, {"source": "Business Insider", "title": "Trump wants potash from Belarus. A Canadian premier warns it would have to go through Russia.", "link": "https://www.businessinsider.com/trump-potash-belarus-canada-trade-war-russia-route-fertilizer-deal-2026-9", "summary": "Canada supplies the vast majority of US potash imports, a key fertilizer ingredient. Heywood Yu/Bloomberg/Getty Images President Donald Trump is seeking cheaper potash from Belarus as his trade fight with Canada continues. A Canadian premier warns that the fertilizer would have to be shipped through Russia. Belarus says it has little additional supply because this year's output is already contracted. President Donald Trump's plan to buy potash from Belarus has drawn a warning from the leader of Canada's biggest potash-producing province, who says the fertilizer would have to be shipped through Russia. His comments came after Trump said Monday that the US is negotiating a \"massive Deal\" to buy potash from Belarus. \"The pricing would be for substantially less than we are currently paying to Canada, very good news for our Farmers and Ranchers.,\" Trump wrote on Truth Social. Potash is a key fertilizer ingredient used to boost crop yields, and Canada supplies the vast majority of US imports. The proposal is the latest front in Trump's trade fight with Canada. His administration has repeatedly targeted Canadian exports, although potash has largely been exempted from tariffs given its importance to US agriculture. Scott Moe, the premier of Saskatchewan, argued that Belarusian potash would have to travel through Russia before reaching US farmers, raising questions about Trump's claim that it would be cheaper. \"Does anyone believe Belarusian blood potash shipped through Russia is going to be more affordable, more sustainable or more ethical than potash shipped from Saskatchewan - right here in North America?\" Moe wrote in a post on X. Belarus is landlocked, and sanctions imposed over its support for Russia's invasion of Ukraine, along with the loss of its main export route through Lithuania, have made its potash more expensive to ship to the US through Russia. Moe has previously warned against using potash as a trade weapon. As Canada weighed retaliatory trade measures last month, he urged Ottawa not to target potash exports, arguing that the move would hurt Canadian producers and encourage US buyers to look elsewhere. Whether Belarus can significantly increase shipments to the US is also unclear. Belarusian leader Alexander Lukashenko said earlier this month that Belarus had resumed selling potash to the US after Washington lifted sanctions on Belarusian potash producers. He also called on Washington to release more than $40 million in Belarusian funds frozen in t", "date_str": "2026-09-22T07:47:40+00:00", "hash": "5bc8e7bf095f432a", "title_fa": "ترامپ از بلاروس پتاس می خواهد. یک نخست‌وزیر کانادا هشدار داد که باید از روسیه عبور کند.", "summary_fa": "کانادا اکثریت قریب به اتفاق واردات پتاس از ایالات متحده را تامین می کند که یک عنصر کلیدی کود است. هیوود یو/ بلومبرگ/ گتی ایماژ، رئیس جمهور دونالد ترامپ در حالی که جنگ تجاری او با کانادا ادامه دارد، به دنبال پتاس ارزان تر از بلاروس است. یک نخست‌وزیر کانادا هشدار می‌دهد که کود باید از طریق روسیه ارسال شود. بلاروس می گوید که عرضه اضافی کمی دارد زیرا تولید امسال در حال حاضر کاهش یافته است. طرح دونالد ترامپ، رئیس جمهور آمریکا برای خرید پتاس از بلاروس، با هشدار رهبر بزرگترین استان تولید کننده پتاس کانادا مواجه شده است که می گوید این کود باید از طریق روسیه ارسال شود. اظهارات وی پس از آن بیان شد که ترامپ روز دوشنبه گفت که ایالات متحده در حال مذاکره برای یک \"توافق بزرگ\" برای خرید پتاس از بلاروس است. ترامپ در سایت Truth Social نوشت: «قیمت‌گذاری بسیار کمتر از آنچه در حال حاضر به کانادا می‌پردازیم، خبر بسیار خوبی برای کشاورزان و دامداران ما خواهد بود.» پتاس یک عنصر کلیدی کود است که برای افزایش عملکرد محصول استفاده می شود و کانادا اکثریت قریب به اتفاق واردات ایالات متحده را تامین می کند. این پیشنهاد آخرین جبهه در جنگ تجاری ترامپ با کانادا است. دولت او بارها صادرات کانادا را هدف قرار داده است، اگرچه پتاس با توجه به اهمیت آن برای کشاورزی ایالات متحده تا حد زیادی از تعرفه ها معاف شده است. اسکات مو، نخست‌وزیر ساسکاچوان، استدلال کرد که پتاس بلاروس قبل از رسیدن به کشاورزان آمریکایی باید از طریق روسیه سفر کند و این پرسش‌هایی را درباره ادعای ترامپ مبنی بر ارزان‌تر بودن آن ایجاد کرد. آیا کسی فکر می‌کند پتاس خون بلاروسی که از طریق روسیه حمل می‌شود، مقرون به صرفه‌تر، پایدارتر یا اخلاقی‌تر از پتاس ارسالی از ساسکاچوان - درست اینجا در آمریکای شمالی- باشد؟"}, {"source": "Business Insider", "title": "The next big question for AI agents is how they'll make money, Goldman says", "link": "https://www.businessinsider.com/meta-muse-ai-agent-how-ai-agents-make-money-goldman-2026-9", "summary": "AI agents are evolving from conversational assistants into software that can complete tasks such as shopping and travel bookings. Dominik Butzmann/Photothek/Getty Images Goldman says AI agents' next big challenge is turning their growing popularity into profits. The bank expects AI agents to make money through ads and premium subscriptions. AI agents are shifting from answering questions to completing real-world tasks. AI agents have quickly become Silicon Valley's latest obsession. Now comes the harder part of figuring out how they'll make money. The attention comes amid Meta's recent launch of Muse, which has brought fresh attention to a new generation of AI software designed to shop online, book travel, and complete tasks on users' behalf. Goldman Sachs says the technology is undergoing a fundamental change. \"I think we are at the beginning of a paradigm shift. We are going from a conversational relationship with these agents to a much more action-oriented relationship,\" Eric Sheridan, business unit leader of Goldman Sachs Research's technology, media, and telecommunications group, said in a post published Friday on the bank's website. For companies building AI agents, the next step is figuring out how to turn those capabilities into a sustainable business, and Sheridan said the answer is likely to look familiar. \"The mass market for AI agents will be monetized with advertising and subscriptions, much like the way the web operates today,\" Sheridan said. He said AI agents would likely offer premium, ad-free subscriptions alongside free, ad-supported versions. Sheridan said AI and machine learning could make digital advertising more efficient by helping automate how ads are created, placed, and measured. That business model will also depend on consumers trusting AI agents with sensitive information such as calendars, passwords, and payment credentials. Sheridan said broader access would allow the software to carry out increasingly complex tasks on the users' behalf. From chatbots to commerce That shift marks AI's move from the infrastructure layer to the platform layer, according to Sheridan. \"We think the advent of consumer-facing, action-oriented agentic commerce marks the emergence of the platform layer,\" he said. The focus on AI agents has intensified in recent weeks as Meta's AI agent, Muse, climbed to the top of Apple's US App Store free app rankings after its launch. The release adds to a growing wave of AI agents from OpenAI, Anthropic, and others", "date_str": "2026-09-22T06:20:34+00:00", "hash": "a4c4c7a51a5fdc0d", "title_fa": "گلدمن می‌گوید سوال بزرگ بعدی برای عوامل هوش مصنوعی این است که چگونه می‌توانند درآمد کسب کنند", "summary_fa": "عوامل هوش مصنوعی از دستیارهای مکالمه به نرم افزاری تبدیل می شوند که می تواند کارهایی مانند خرید و رزرو سفر را انجام دهد. Dominik Butzmann/Photothek/Getty Images گلدمن می گوید چالش بزرگ بعدی عوامل هوش مصنوعی تبدیل محبوبیت روزافزون خود به سود است. این بانک از عوامل هوش مصنوعی انتظار دارد که از طریق تبلیغات و اشتراک های ممتاز درآمد کسب کنند. عوامل هوش مصنوعی از پاسخ دادن به سوالات به تکمیل وظایف دنیای واقعی تغییر می کنند. عوامل هوش مصنوعی به سرعت به آخرین وسواس سیلیکون ولی تبدیل شده اند. اکنون بخش سخت تر این است که بدانیم چگونه آنها پول در می آورند. این توجه در بحبوحه راه‌اندازی اخیر متا از Muse است که توجه تازه‌ای را به نسل جدیدی از نرم‌افزار هوش مصنوعی که برای خرید آنلاین، رزرو سفر و انجام وظایف از جانب کاربران طراحی شده است، جلب کرده است. گلدمن ساکس می گوید این فناوری در حال تغییر اساسی است. \"من فکر می کنم ما در آغاز یک تغییر پارادایم هستیم. اریک شریدان، رهبر واحد تجاری گروه فناوری، رسانه و مخابرات پژوهشی گلدمن ساکس، در پستی که روز جمعه در وب‌سایت بانک منتشر شد، گفت: «ما از یک رابطه مکالمه با این عوامل به یک رابطه بسیار عمل‌محورتر می‌رویم.» برای شرکت‌هایی که عامل‌های هوش مصنوعی می‌سازند، گام بعدی این است که بفهمند چگونه می‌توانند این قابلیت‌ها را به یک کسب‌وکار آشنا تبدیل کنند. شریدان گفت: «بازار انبوه عوامل هوش مصنوعی با تبلیغات و اشتراک درآمدزایی خواهد شد، دقیقاً مانند روشی که امروزه وب کار می کند. او گفت که عوامل هوش مصنوعی احتمالاً اشتراک‌های ممتاز و بدون آگهی را در کنار نسخه‌های رایگان و پشتیبانی‌شده از آگهی ارائه می‌کنند. شریدان گفت هوش مصنوعی و یادگیری ماشینی می توانند تبلیغات دیجیتال را با کمک به خودکارسازی نحوه ایجاد، قرار دادن و اندازه گیری تبلیغات کارآمدتر کنند."}, {"source": "Business Insider", "title": "Alexandr Wang’s #musemoneychallenge pitch says that Meta's new app can 'make you $1,000' almost instantly", "link": "https://www.businessinsider.com/meta-muse-alexandr-wang-save-money-ai-agent-challenge-2026-9", "summary": "Alexandr Wang says using Muse can help people save $1,000 almost instantly. Bloomberg/Getty Images Meta's AI team is trying to persuade people to try saving $1,000 using its new agent, Muse. Alexandr Wang is challenging people to tell Muse to sift through their finances and execute tasks. Some users are posting their wins, though a great number came from Meta's own team. Meta's Alexandr Wang says using his new AI agent can almost instantly \"make you $1,000.\" Or rather, save you $1,000. Wang, Meta's chief AI officer, and his team have been posting on X over the past week about how users can prompt Muse to review their finances and identify ways to claw back cash. Then, the AI agent is supposed to help execute those tasks in the background, à la haggling over the phone with insurance companies for better deals, unsubscribing from that streaming service you never use, and sifting through the web for discounts. Wang has been encouraging users to post financial wins in what he calls the #MuseMoneyChallenge, following the AI agent's September 8 launch. the last thing your unnecessary expenses see before your muse saves you $1000 pic.twitter.com/NwEO7nhmbK — Alexandr Wang (@alexandr_wang) September 19, 2026 Some people are biting. Startup founder Joseph Devoy said he used Muse to find car insurance that cost him $3,500 less a year than his original plan. \"Killer product,\" he wrote while posting a screenshot of his interaction with Muse. One user said the AI agent found an unused book subscription his wife had forgotten to cancel a year ago and secured a refund for the amount spent. IM SICK. @muse just found a monthly book subscription that my wife forgot to cancel, OVER A YEAR AGO. my assistant cancelled the subscription, found their return/refund policy, and was able to get a year's worth of subscription back to me. bonkers — Chris Abraham 🐝 (@chrsabraham) September 15, 2026 Another said Muse discovered an unused $200 Verizon gift card for them. \"So it just paid for itself for the next year or two,\" they wrote. A Coinbase product manager, Nick Prince , posted that he saved $1,250 at a car dealership when Muse helped him dodge upsells and a large fee. However, many of the posts answering Wang's challenge came from Meta's own staff, who were eag ام انتشار تصویری از تعامل خود با میوز نوشت:"}, {"source": "Business Insider", "title": "Def Jam cofounder Rick Rubin says AI art's creativity is in the prompt", "link": "https://www.businessinsider.com/def-jam-rick-rubin-ai-art-creativity-prompt-ideation-2026-9", "summary": "Def Jam cofounder Rick Rubin said that prompting AI has something in common with how great artists have long brought their visions to life. Georgiana Dallas/WWE via Getty Images Rick Rubin says AI could give more people a way to make art, even if they lack traditional artistic skills. The Def Jam cofounder said the final product is only a small part of the creative process. Rubin compared prompting AI to the way artists and Hollywood greats have long brought their visions to life. Def Jam cofounder Rick Rubin said he sees AI as a tool that could help people who don't consider themselves artists make art, including those who can't draw or play instruments. On Monday's episode of \" Diary of a CEO ,\" Rubin shared his thoughts on the role of human creativity in AI art and how prompting fits into the creative process. \"I don't have any talent. I have no way to express my creativity. But I could talk to the AI, and maybe I could prompt the AI into making something beautiful, through iteration and prompting,\" Rubin told podcast host Steven Bartlett . He said AI could enable more people to be creative, calling it \"a beautiful thing.\" However, the finished work, or even the process of making something, is only a small part of what creativity is, Rubin said. \"The things that we make are the reminders that we're creative. They're just the output. The real creativity is the idea that allows this thing to be made,\" Rubin said. The record producer drew parallels between prompting AI and the storyboarding process used by filmmakers such as Alfred Hitchcock and Wes Anderson , who plan their films frame by frame before working with actors to execute their ideas. \"AI could be a great tool to assist in this mocking up, but it's the prompt. The prompt is where the creativity is. The prompt is what Wes is using, and what Alfred Hitchcock is using, to tell the artist what to draw in each frame,\" Rubin said. \"The creativity is there. It's not in the drawing. It's not in the finished movie,\" he continued. When asked how great artists would stand out if anyone could learn to prompt, Rubin said it comes back to \"the same thing\" it always has: whether their work moves people and makes them want to return to it again and again. Still, Bartlett said the human element affects how he experiences art. He recalled liking a Spotify song less after learning it was AI-generated because it no longer felt tied to a real person's experience. Rubin then pointed to Andy Warhol's screen-printed ce", "date_str": "2026-09-22T04:45:17+00:00", "hash": "9137492e3d25309b", "title_fa": "ریک روبین، یکی از بنیانگذاران Def Jam، می گوید خلاقیت هنر هوش مصنوعی به سرعت در حال انجام است", "summary_fa": "ریک روبین، یکی از بنیانگذاران دف جم، گفت که ایجاد هوش مصنوعی وجه مشترکی با این که چگونه هنرمندان بزرگ مدت‌ها دیدگاه‌های خود را زنده کرده‌اند، دارد. جورجیانا دالاس/دبلیو دبلیو دبلیو دبلیو ای از طریق گتی ایماژ ریک روبین می گوید هوش مصنوعی می تواند به افراد بیشتری راهی برای ساختن هنر بدهد، حتی اگر فاقد مهارت های هنری سنتی باشند. یکی از بنیانگذاران Def Jam گفت که محصول نهایی تنها بخش کوچکی از فرآیند خلاقانه است. روبین محرک هوش مصنوعی را با روشی مقایسه کرد که هنرمندان و بزرگان هالیوود مدت‌ها به دیدگاه‌های خود زندگی می‌کردند. ریک روبین، یکی از بنیانگذاران Def Jam، گفت که او هوش مصنوعی را ابزاری می داند که می تواند به افرادی که خود را هنرمند نمی دانند، از جمله کسانی که نمی توانند طراحی کنند یا ساز بنوازند، کمک کند تا هنر کنند. در اپیزود روز دوشنبه «خاطرات یک مدیر عامل»، روبین نظرات خود را در مورد نقش خلاقیت انسان در هنر هوش مصنوعی و چگونگی تطبیق انگیزه در فرآیند خلاقیت به اشتراک گذاشت. \"من هیچ استعدادی ندارم، هیچ راهی برای ابراز خلاقیت ندارم. روبین به مجری پادکست استیون بارتلت گفت، اما می‌توانم با هوش مصنوعی صحبت کنم و شاید بتوانم هوش مصنوعی را وادار کنم تا چیزی زیبا بسازد، از طریق تکرار و تلقین.» او گفت هوش مصنوعی می‌تواند افراد بیشتری را قادر به خلاقیت کند و آن را «یک چیز زیبا» نامید. آنها فقط خروجی هستند. خلاقیت واقعی ایده‌ای است که اجازه می‌دهد این چیز ساخته شود.\" روبین گفت. تهیه‌کننده رکورد شباهت‌هایی بین ایجاد هوش مصنوعی و فرآیند استوری‌بورد مورد استفاده فیلمسازانی مانند آلفرد هیچکاک و وس اندرسون که فیلم‌های خود را فریم به فریم برنامه‌ریزی می‌کنند قبل از همکاری با بازیگران برای اجرای ایده‌هایشان ترسیم کرد. \"هوش مصنوعی می‌تواند ابزاری عالی برای کمک به آن باشد. اعلان جایی است که"}, {"source": "Business Insider", "title": "Why a former Meta distinguished engineer asked for a demotion at the peak of his career", "link": "https://www.businessinsider.com/top-meta-engineer-said-he-enjoyed-work-more-after-demotion-2026-9", "summary": "Philip Su was promoted to distinguished engineer at Meta before seeking a demotion to improve work-life balance and reduce pressure to perform. Klaus Vedfelt/Getty Images Philip Su was promoted to distinguished engineer at Meta before seeking a demotion. Su said higher levels brought pressure that left him exhausted and under scrutiny. Su said that accepting a career ceiling can lead to more enjoyable work. A top engineer for Big Tech asked for a demotion at the peak of his career. Philip Su, who reached the prestigious \" distinguished engineer \" or IC9 level at Meta and OpenAI, said on \"The Peterman Pod\" podcast that promotions lost some of their shine as his career progressed. \"The thrill of the promotion itself was no longer the same as when I was younger,\" Su told show host Ryan Peterman. \"When I was younger, because I sought after those grades, those measurable metrics, I very much felt great every time I got promoted.\" By level seven, however, advancement no longer felt like an unqualified win. \"It wasn't all roses to me anymore, the idea of getting promoted, because I realized that each promotion also came with much higher expectations,\" Su said. \"Expectations that I was no longer positive that I was going to deliver well.\" Su, now the CEO and founder of Superphonic, an AI-powered iOS and iPadOS podcast player, ultimately sought a demotion at Meta from IC9 to IC7. He said that operating at a higher level left him exhausted and like the \"Eye of Sauron\" was constantly scrutinizing his performance. \"The higher level you are, the more that you feel that intensity all the time,\" Su said, adding that companies are entitled to question whether highly paid employees are delivering enough value. At Meta, an IC9, also known as level E9, is one grade above a Principal Engineer and one promotion away from being a Meta Fellow. According to Levels.fyi, a compensation estimate platform, an IC9 engineer at Meta can earn roughly $4.3 million annually, including about $404,500 in base salary, $3.8 million in stock grants, and a bonus of at least $110,000. By comparison, Levels.fyi estimates that an IC7 Meta engineer could make around $1.63 million a year in total. Stepping down was not painless. Su said it was difficult watching people who had once been below him rise past him. Still, he said had come to recognize that a lower-level role could offer work he enjoyed without requiring him to perform indefinitely at the edge of his abilities. Su said people chasing a ma", "date_str": "2026-09-22T04:01:01+00:00", "hash": "fae1298ac82fd85e", "title_fa": "چرا یک مهندس برجسته سابق متا در اوج کار خود درخواست تنزل رتبه کرد؟", "summary_fa": "فیلیپ سو قبل از اینکه به دنبال تنزل رتبه برای بهبود تعادل بین کار و زندگی و کاهش فشار برای عملکرد باشد، به عنوان مهندس برجسته در Meta ارتقا یافت. کلاوس ودفلت/ گتی ایماژ فیلیپ سو قبل از اینکه به دنبال تنزل رتبه باشد به مهندس برجسته در متا ارتقا یافت. سو گفت سطوح بالاتر فشاری را به همراه داشت که او را خسته و تحت نظارت قرار داد. سو گفت که پذیرش سقف شغلی می تواند منجر به کار لذت بخش تر شود. یکی از مهندسان برتر Big Tech در اوج کار خود درخواست تنزل رتبه کرد. فیلیپ سو که در Meta و OpenAI به سطح معتبر \"مهندس ممتاز\" یا IC9 رسیده است، در پادکست \"The Peterman Pod\" گفت که تبلیغات با پیشرفت شغلی او بخشی از درخشش خود را از دست دادند. سو به مجری برنامه رایان پیترمن گفت: «هیجان تبلیغات به خودی خود دیگر مانند دوران جوانی من نبود. وقتی جوان تر بودم، چون به دنبال آن نمرات، آن معیارهای قابل اندازه گیری بودم، هر بار که ترفیع می گرفتم، احساس خوبی داشتم.» با این حال، در سطح هفت، پیشرفت دیگر مانند یک برد بدون صلاحیت احساس نمی شد. سو گفت: \"این دیگر برای من گل رز نبود، ایده ترفیع گرفتن، زیرا متوجه شدم که هر ترفیع با توقعات بسیار بالاتری همراه بود.\" \"انتظارات این است که دیگر مثبت نبودم که قرار است عملکرد خوبی داشته باشم.\" سو که اکنون مدیر عامل و بنیانگذار Superphonic است، یک پخش کننده پادکست iOS و iPadOS مجهز به هوش مصنوعی، در نهایت به دنبال تنزل رتبه در Meta از IC9 به IC7 بود. او گفت که فعالیت در سطح بالاتر او را خسته کرده و مانند \"چشم سائورون\" دائماً عملکرد او را بررسی می کند. سو گفت: «هرچه سطح بالاتری داشته باشید، همیشه آن شدت را بیشتر احساس می کنید."}, {"source": "Business Insider", "title": "Finally something California and Texas can agree on: regulating data centers", "link": "https://www.businessinsider.com/california-texas-data-center-regulation-newsom-abbott-bipartisan-backlash-2026-9", "summary": "Jacquelyn Martin/AP Photo; Nell Redmond/AP Photo California and Texas are both limiting data center development. Gov. Gavin Newsom announced new regulations, while Gov. Greg Abbott has paused new permits. Data centers have drawn bipartisan backlash due to concerns over water use and energy prices. Often used as shorthand for two opposing sides of America, California and Texas have finally found common ground — on data centers breaking ground. The two most populous US states announced limits on data center development on Monday. California Gov. Gavin Newsom , a Democrat, signed a package of new laws regulating data centers. The laws require data centers to disclose information about electricity and water use, make data centers ineligible for environmental exemptions, and aim to ensure consumers aren't saddled with rising energy costs, among other measures. \"While the Trump administration moves toward deregulation, communities are left to deal with the consequences — higher electricity demand, grid constraints, water use, and pollution,\" Newsom said in a statement, adding, \"With these laws, we are ensuring that Californians remain in the driver's seat — and that those profiting from data centers aren't doing so at our expense.\" Meanwhile, in the Lone Star State, Republican Gov. Greg Abbott directed the Texas Commission on Environmental Quality (TCEQ) to halt all new permits for data center development while the group that operates the state's electrical grid carries out an audit. \"Simply put, Texans must come first,\" Abbott said in a statement, adding that \"data centers must pay their own way, protect our grid and water, and complete the ERCOT and TWDB audits,\" referring to the Electric Reliability Council of Texas and the Texas Water Development Board. \"Until they do, TCEQ will issue no permits sought by data center projects,\" he said. The latest order expands on a moratorium that Abbott issued last month on new data center connections to the state's electric grid. It's not exactly surprising to see the two political adversaries set their sights on the same target, given that it's become a nonpartisan political issue. Democrats and Republicans have expressed concerns about the impacts of data centers , and Americans across the country have turned out to protest proposed developments. Critics say data centers consume too much water, drive up electricity bills, and add noise pollution to the communities where they are built. Business Insider's reporting previ", "date_str": "2026-09-22T00:44:54+00:00", "hash": "30e5f604dcff273c", "title_fa": "سرانجام چیزی که کالیفرنیا و تگزاس می توانند در مورد آن به توافق برسند: تنظیم مراکز داده", "summary_fa": "عکس ژاکلین مارتین/AP; Nell Redmond/AP Photo کالیفرنیا و تگزاس هر دو توسعه مرکز داده را محدود می کنند. فرماندار گاوین نیوسام مقررات جدیدی را اعلام کرد، در حالی که فرماندار گرگ ابوت مجوزهای جدید را متوقف کرد. مراکز داده به دلیل نگرانی در مورد مصرف آب و قیمت انرژی با واکنش دو حزبی مواجه شده اند. کالیفرنیا و تگزاس که اغلب به‌عنوان خلاصه‌نویسی برای دو طرف متضاد آمریکا استفاده می‌شوند، سرانجام نقطه مشترکی پیدا کردند - در مورد مراکز داده در حال شکستن. دو ایالت پرجمعیت آمریکا روز دوشنبه محدودیت هایی را برای توسعه مرکز داده اعلام کردند. فرماندار کالیفرنیا، گاوین نیوسام، یک دموکرات، بسته ای از قوانین جدید را برای تنظیم مراکز داده امضا کرد. این قوانین مراکز داده را ملزم می‌کند که اطلاعات مربوط به مصرف برق و آب را افشا کنند، مراکز داده را از معافیت‌های زیست‌محیطی محروم کنند، و هدفشان این است که اطمینان حاصل شود که مصرف‌کنندگان با افزایش هزینه‌های انرژی مواجه نمی‌شوند. نیوسام در بیانیه‌ای گفت: «در حالی که دولت ترامپ به سمت مقررات‌زدایی پیش می‌رود، جوامع باید با پیامدها مقابله کنند - تقاضای برق بیشتر، محدودیت‌های شبکه، مصرف آب و آلودگی» و افزود: «با این قوانین، ما تضمین می‌کنیم که کالیفرنیایی‌ها در صندلی راننده باقی بمانند - و کسانی که از مراکز داده به هزینه ما سود می‌برند، این کار را نمی‌کنند.» در همین حال، در ایالت لون استار، فرماندار جمهوری خواه. گرگ ابوت به کمیسیون کیفیت محیطی تگزاس (TCEQ) دستور داد تا تمام مجوزهای جدید برای توسعه مرکز داده را متوقف کند، در حالی که گروهی که شبکه برق این ایالت را اداره می کند، ممیزی را انجام می دهد. ابوت در بیانیه‌ای گفت: «به عبارت ساده، تگزاسی‌ها باید اول باشند.» با اشاره به شورای قابلیت اطمینان الکتریک تگزاس و هیئت توسعه آب تگزاس، افزود: «مراکز داده باید راه خود را بپردازند،"}, {"source": "Business Insider", "title": "British Columbia files a lawsuit against OpenAI over mass shooting", "link": "https://www.businessinsider.com/british-columbia-files-lawsuit-against-openai-over-school-shooting-2026-9", "summary": "British Columbia filed a lawsuit against OpenAI over the Tumbler Ridge school shooting, alleging that ChatGPT reinforced the shooter s violent ideation. Paige Taylor White / AFP via Getty Images British Columbia filed a lawsuit against OpenAI over the Tumbler Ridge school shooting. The province alleges ChatGPT reinforced the shooter's violent ideation. The lawsuit seeks recovery costs, including for replacing the demolished school. British Columbia is taking OpenAI and CEO Sam Altman to court over the company's alleged role in a mass shooting that shattered a small Canadian community. Niki Sharma, the Deputy Premier and Attorney General of British Columbia, filed a lawsuit Monday in California to hold OpenAI \"accountable for designing a dangerous product, distributing it to every home with internet access, ignoring the warnings of their own safety team , refusing to notify authorities when they knew the shooter was planning gun violence.\" \"OpenAI has confirmed that the conversation between ChatGPT and the shooter was so alarming that it triggered an internal review by OpenAI employees,\" Sharma said in a press conference earlier on Monday. \"This threat was not reported to the RCMP and was subsequently dismissed,\" Sharma added. The Royal Canadian Mounted Police is Canada's federal police force. According to the lawsuit filing, the February 10 Tumbler Ridge Secondary School shooting killed five students and an education assistant and injured more than 25 people. The 18-year-old shooter, Jesse Van Rootselaar, died from a self-inflicted gunshot wound. The lawsuit said that ChatGPT's features \"encouraged, elaborated, and reinforced violent ideation instead of interrupting it or directing the user to real-world help.\" Sharma said that she had not personally reviewed the conversations and said OpenAI is withholding them from the province. \"Publicly, OpenAI has paid lip service to regret, and has promised to make changes,\" the lawsuit said. \"Neither OpenAI nor Ms. O'Leary have followed up on these promises, despite public efforts by the Attorney General of British Columbia to engage with them,\" the lawsuit added of Ann O'Leary, the vice president of global policy at OpenAI. According to the lawsuit, British Columbia is seeking to make OpenAI pay for the cost of replacing Tumbler Ridge Secondary School, which was demolished after the attack. In a statement to Business Insider, an OpenAI spokesperson called the shooting \"an unspeakable tragedy.\" \"OpenAI remains commi", "date_str": "2026-09-22T00:16:43+00:00", "hash": "fad76120da2ca2f1", "title_fa": "بریتیش کلمبیا علیه OpenAI به دلیل تیراندازی جمعی شکایت کرد", "summary_fa": "بریتیش کلمبیا علیه OpenAI به دلیل تیراندازی در مدرسه Tumbler Ridge شکایت کرد و ادعا کرد که ChatGPT افکار خشونت آمیز تیرانداز را تقویت کرده است. پیج تیلور وایت / خبرگزاری فرانسه از طریق Getty Images بریتیش کلمبیا علیه OpenAI به دلیل تیراندازی در مدرسه Tumbler Ridge شکایت کرد. استان ادعا می کند که ChatGPT افکار خشونت آمیز تیرانداز را تقویت کرده است. این شکایت به دنبال هزینه های بازیابی، از جمله برای جایگزینی مدرسه تخریب شده است. بریتیش کلمبیا OpenAI و مدیر عامل شرکت سام آلتمن را به دلیل نقش ادعایی این شرکت در تیراندازی جمعی که جامعه کوچک کانادایی را متلاشی کرد، به دادگاه می کشاند. نیکی شارما، معاون نخست وزیر و دادستان کل بریتیش کلمبیا، روز دوشنبه در کالیفرنیا شکایتی تنظیم کرد تا OpenAI را \"به دلیل طراحی یک محصول خطرناک، توزیع آن در هر خانه با دسترسی به اینترنت، نادیده گرفتن هشدارهای تیم ایمنی خود، و امتناع از اطلاع دادن به مقامات زمانی که می دانستند تیرانداز در حال برنامه ریزی برای خشونت با اسلحه است، پاسخگو باشد.\" شارما اوایل روز دوشنبه در یک کنفرانس مطبوعاتی گفت: \"OpenAI تایید کرده است که مکالمه بین ChatGPT و تیرانداز آنقدر هشدار دهنده بود که باعث بررسی داخلی کارمندان OpenAI شد.\" شارما افزود: \"این تهدید به RCMP گزارش نشد و متعاقبا نادیده گرفته شد.\" پلیس سواره سلطنتی کانادا نیروی پلیس فدرال کانادا است. بر اساس این شکایت، تیراندازی در دبیرستان تامبلر ریج در 10 فوریه منجر به کشته شدن پنج دانش آموز و یک معاون آموزشی و زخمی شدن بیش از 25 نفر شد. تیرانداز 18 ساله، جسی ون روتسلار، بر اثر شلیک گلوله جان خود را از دست داد. در این شکایت آمده است که ویژگی‌های ChatGPT \"به جای قطع کردن آن یا هدایت کاربر به کمک دنیای واقعی، افکار خشونت‌آمیز را تشویق می‌کنند، توضیح می‌دهند و تقویت"}, {"source": "Business Insider", "title": "Meta's Muse gives Zuckerberg another shot at building a real platform", "link": "https://www.businessinsider.com/meta-muse-mark-zuckerberg-platform-opportunity-developers-2026-9", "summary": "Meta CEO Mark Zuckerberg Jeff Chiu/AP Meta's AI agent Muse dominates the App Store, surpassing ChatGPT in downloads. Muse offers a potential new platform for developers, attracting services such as Shopify and Stripe. Muse competes with other AI agents for the \"top of the funnel.\" Meta 's new personal AI agent, Muse, gives Mark Zuckerberg another chance to build the kind of technology platform he has chased for years. Muse jumped to the top of the App Store last week and remained the most downloaded free app on Monday, beating ChatGPT. If enough people use Muse as their main way to get things done online, developers could flock to the nascent platform, and businesses may have little choice but to engage with it. Meta surged 11% on Monday, getting the stock within striking distance of a record it hit last summer. Investors appear to be betting the company has found a new way to sit between consumers and the businesses trying to reach them. This broad idea has been driving Zuckerberg for years. Meta spent tens of billions of dollars trying to build the next major computing platform through virtual reality and, more recently, smart glasses. Part of that ambition came into focus in 2021 when Apple made it harder for Meta to track people across apps and target ads, reminding Zuckerberg how much power platform owners have over companies that depend on them. Developers invited Muse offers a different path. Its swift climb up the app charts gives Meta the kind of early consumer momentum that attracts developers. Last week, the company opened Muse to outside developers through a new connector platform that lets businesses plug their services directly into the AI agent. Those connectors help Muse do useful work on a person's behalf. A travel service can book flights. A calendar app can manage appointments. An email service can send messages. Developers can create their own Muse connectors and submit them to Meta's agent platform for review. No coincidence: The company describes this in very similar terms to how Apple guards its mobile platform. \"We'll review your connector for functional, security, and legal requirements, and complete end to end testing,\" Meta wrote on the Muse developer website. \"Once approved, users will be able to find your connector in Muse. Editors will review connectors for featured placement.\" Adding to the allure for developers: On Monday, Shopify announced support for shopping on Muse through its Shop Pay service, sparking a jump in Shopify", "date_str": "2026-09-21T22:16:36+00:00", "hash": "1fa2e0db5f5391d7", "title_fa": "Meta's Muse به زاکربرگ فرصت دیگری برای ساختن یک پلتفرم واقعی می دهد", "summary_fa": "مدیر عامل متا، مارک زاکربرگ جف چیو/ AP عامل هوش مصنوعی، Muse بر فروشگاه App تسلط دارد و از ChatGPT در دانلودها پیشی می گیرد. Muse یک پلت فرم جدید بالقوه برای توسعه دهندگان ارائه می دهد که خدماتی مانند Shopify و Stripe را جذب می کند. Muse با سایر عوامل هوش مصنوعی برای \"بالای قیف\" رقابت می کند. مامور هوش مصنوعی شخصی جدید متا، Muse، به مارک زاکربرگ فرصتی دیگر می‌دهد تا پلتفرمی را که سال‌ها دنبالش بوده، بسازد. Muse هفته گذشته به بالای اپ استور پرید و با شکست ChatGPT، همچنان پربارترین برنامه رایگان روز دوشنبه باقی ماند. اگر تعداد زیادی از افراد از Muse به عنوان راه اصلی خود برای انجام کارهای آنلاین استفاده کنند، توسعه‌دهندگان می‌توانند به این پلتفرم نوپای هجوم ببرند و کسب‌وکارها ممکن است چاره‌ای جز تعامل با آن نداشته باشند. متا در روز دوشنبه 11 درصد رشد کرد و سهام را در فاصله قابل توجهی از رکوردی که تابستان گذشته به ثبت رساند، رساند. به نظر می‌رسد سرمایه‌گذاران شرط می‌بندند که شرکت راه جدیدی برای نشستن بین مصرف‌کنندگان و کسب‌وکارهایی که در تلاش برای دسترسی به آنها هستند، پیدا کرده است. این ایده گسترده سال‌ها است که زاکربرگ را هدایت کرده است. متا ده ها میلیارد دلار برای ساختن پلتفرم محاسباتی بزرگ بعدی از طریق واقعیت مجازی و اخیراً عینک های هوشمند هزینه کرد. بخشی از این جاه‌طلبی در سال 2021 زمانی که اپل ردیابی افراد در برنامه‌ها و هدف‌گذاری تبلیغات را برای متا سخت‌تر کرد، مورد توجه قرار گرفت و به زاکربرگ یادآوری کرد که صاحبان پلت‌فرم‌ها تا چه اندازه قدرت بیشتری نسبت به شرکت‌هایی دارند که به آنها وابسته هستند. توسعه دهندگان دعوت شده Muse مسیر متفاوتی را ارائه می دهد. بالا رفتن سریع آن در نمودارهای برنامه، به متا نوعی شتاب مصرف کننده اولیه می دهد که توسعه دهندگان را"}, {"source": "Business Insider", "title": "We skipped Switzerland's tourist hubs for a quieter town. It made our family's dream trip even better.", "link": "https://www.businessinsider.com/thun-affordable-quieter-alternative-to-interlaken-swiss-family-trip-2026-9", "summary": "The author (far right) and her family waited years to take a dream trip to Switzerland. Instead of staying in a busy tourist town, they stayed in Thun, which gave them access to nearby destinations, including Mürren. Courtesy of Nishtha Chaudhary. My mom dreamed of visiting Switzerland for years, but the high cost kept us from going sooner. We chose to stay in Thun over Interlaken for its affordability and convenience for day trips. Our time in Thun also gave us scenic views, a quieter pace, and easy access to Interlaken. A trip to Switzerland had been my mother's dream long before it was mine. She'd seen the destination in movies and travel videos for years and always said she wanted to see it in person someday. Every few years, my family would talk about going, compare flights, and then let the idea go. The timing was never right, and the cost was hard to justify for a family of four from India. When we finally planned a trip for December 2024 as a gift for my mom's birthday, I knew I wanted to make the most of it. It was one of the most expensive vacations we'd ever taken, so I spent a lot of time thinking about where we'd stay, knowing our base would shape the whole trip. I had to make some tough decisions when it came to where to stay and what to do to make sure the trip was worthwhile and met all of our expectations, especially my mom's. I'm happy with the choices I made, especially when it came to which town to stay in . We didn't want our dream trip to feel rushed Like most first-time visitors, I started by looking at tourist hubs like Interlaken and Lucerne . Both seemed like obvious choices — close to the attractions we'd planned to visit and easy to build an itinerary around. But we were going to spend most of our days out exploring, not sitting in our hotel, and I wasn't sure it made sense to pay high rates to stay in such a busy tourist town. The author said booking a hotel in a less-busy town allowed her family to explore nearby areas without as steep a price tag. Courtesy of Nishtha Chaudhary. We looked for a quieter base without giving up convenience Through travel articles, Reddit threads, and Instagram, I discovered Thun, a lakeside town in the canton of Bern that many visitors recommended as a day trip from Interlaken. I mapped out how easily we could reach the places we'd planned to visit from Thun. We had a week in Switzerland, with the final two days already set aside for Zurich, so I wanted to make sure we weren't losing too much ti", "date_str": "2026-09-21T22:15:01+00:00", "hash": "d6bf8de6d72be6c2", "title_fa": "ما از مراکز توریستی سوئیس صرف نظر کردیم تا شهر آرامتری داشته باشیم. این سفر رویایی خانواده ما را حتی بهتر کرد.", "summary_fa": "نویسنده (راست راست) و خانواده‌اش سال‌ها منتظر بودند تا سفری رویایی به سوئیس داشته باشند. آنها به جای اقامت در یک شهر توریستی شلوغ، در تون ماندند که به آنها امکان دسترسی به مقاصد نزدیک از جمله مورن را می داد. با حسن نیت از Nishtha Chaudhary. مادرم سال‌ها آرزوی سفر به سوئیس را داشت، اما هزینه‌های زیاد باعث شد که زودتر نرویم. ما به دلیل مقرون به صرفه بودن و راحتی آن برای سفرهای یک روزه، اقامت در تون را در مقابل اینترلاکن انتخاب کردیم. زمان ما در تون همچنین به ما مناظر منظره، سرعتی آرام تر و دسترسی آسان به اینترلاکن را برای ما به ارمغان آورد. سفر به سوئیس آرزوی مادرم خیلی قبل از آن بود که من باشد. او سال‌ها مقصد را در فیلم‌ها و ویدیوهای سفر دیده بود و همیشه می‌گفت که می‌خواهد روزی آن را شخصا ببیند. هر چند سال یک بار، خانواده‌ام درباره رفتن صحبت می‌کردند، پروازها را با هم مقایسه می‌کردند و سپس این ایده را رها می‌کردند. زمان بندی هیچ وقت مناسب نبود و توجیه هزینه برای یک خانواده چهار نفره از هند دشوار بود. وقتی بالاخره برای دسامبر 2024 سفری را به عنوان هدیه برای تولد مادرم برنامه ریزی کردیم، می دانستم که می خواهم از آن نهایت استفاده را ببرم. این یکی از گران ترین تعطیلاتی بود که تا به حال رفته بودیم، بنابراین زمان زیادی را صرف فکر کردن در مورد محل اقامتمان کردم، زیرا می دانستم پایگاه ما کل سفر را شکل می دهد. من باید تصمیمات سختی را در مورد محل اقامت و کارهایی که باید انجام دهم می گرفتم تا مطمئن شوم که سفر ارزشمند بوده و همه انتظارات ما، به خصوص مادرم را برآورده می کند. من از انتخاب هایی که انجام دادم خوشحالم، به خصوص وقتی نوبت به اقامت در کدام شهر می"}, {"source": "Business Insider", "title": "Google Pixel 11 Pro Fold review: Thinner, better cameras, and cool Gemini touches", "link": "https://www.businessinsider.com/guides/tech/google-pixel-11-pro-fold-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Business Insider / Sherri L. Smith Another year, another Google Pixel Fold. This time, it's the Pixel 11 Pro Fold, and Google is absolutely aiming for the top spot in the foldable market. And the company makes a good case for the crown. The phone is visually stunning and looks just as premium as competing phones in the space. It's even managed to slim down a touch, making it Google's thinnest, lightest Fold ever. But that beauty belies the most durable foldable in the business, as the only device with an IP68 rating (until the iPhone Duo launches, that is). Running Android 17 and powered by Google's new Tensor G6 chip, the Pro Fold isn't after benchmark supremacy. Instead, it's putting all that performance into speedier interactions, whether it's multitasking or some AI functionality. And speaking of AI, Google has crammed every AI trick under the sun into this thing, with an attempt to make you wonder how you ever lived without such convenience. Need to make a dinner reservation? Gemini's got it. Need to book a flight? Gemini's got it. Want to watch your favorite Korean drama in English? Gemini's got it. And then there's the cameras. Some incremental changes from last year, but those changes greatly expand what the Pro Fold's capable of. And that's before you throw in all the software tricks, old and new, that Google has up its sleeve. But the brakes get severely pumped when we start talking about the Pro Fold's price. I reviewed the 256GB version of the phone, which costs $1,899 (or $1,299 with an eligible trade). For that price, you can get a reasonably specced laptop and a budget tablet. The 512GB model costs $2,019, and the 1TB version is priced at $2,246. Each iteration is $100 more than last year's model. And that's nothing to sneeze at for an already expensive phone. However, if you're looking for one of the best foldables on the market and want the full Gemini Intelligence experience, the Google Pixel 11 Pro Fold is the only way to go. Specification Details Starting price $1,899 / £1,799 / €1,999 Colors Olive/Obsidian Release date August 20, 2026 Durability rating IP68 Cover display 6.5-inch Super Actua OLED; 1080 × 2342; adaptive 1–120Hz; up to 3,600 nits Folding display 8-inch Super Actua OLED; 2076 × 2152; adaptive 1–120Hz; up to 3,600 nits Resolution 1080 × 2342 (external) / 2076 x 2152 (internal) Refresh rate Adaptive 1–120Hz Peak brightness Up to 3,", "date_str": "2026-09-21T21:33:37+00:00", "hash": "15e379bbb8c005ec", "title_fa": "بررسی Google Pixel 11 Pro Fold: دوربین‌های نازک‌تر، بهتر و لمس‌های جالب Gemini", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Business Insider / Sherri L. Smith یک سال دیگر، Google Pixel Fold دیگری. این بار Pixel 11 Pro Fold است و گوگل کاملاً به دنبال کسب رتبه برتر در بازار تاشو است. و این شرکت یک مورد خوب برای تاج می سازد. این تلفن از نظر بصری خیره کننده است و به همان اندازه گوشی های رقیب در فضا به نظر می رسد. حتی توانسته است با یک لمس لاغر شود و به نازک ترین و سبک ترین فولد گوگل تبدیل شود. اما این زیبایی، بادوام ترین تاشو در این تجارت را رد می کند، به عنوان تنها دستگاه با رتبه IP68 (تا زمانی که iPhone Duo راه اندازی شود). Pro Fold با سیستم عامل اندروید 17 و مجهز به تراشه جدید Tensor G6 گوگل، برتری معیار را ندارد. در عوض، تمام این عملکرد را در تعاملات سریع‌تر قرار می‌دهد، خواه چندوظیفه بودن یا برخی از عملکردهای هوش مصنوعی. و صحبت از هوش مصنوعی، گوگل تمام ترفندهای هوش مصنوعی را در زیر نور خورشید در این مورد جمع کرده است، تا شما را متعجب کند که چگونه بدون چنین راحتی زندگی کرده اید. آیا نیاز به رزرو شام دارید؟ جمینی متوجه شده است. نیاز به رزرو پرواز دارید؟ جمینی متوجه شده است. آیا می خواهید درام کره ای مورد علاقه خود را به زبان انگلیسی تماشا کنید؟ جمینی متوجه شده است. و سپس دوربین ها هستند. برخی تغییرات افزایشی نسبت به سال گذشته، اما این تغییرات توانایی های Pro Fold را تا حد زیادی گسترش می دهد. و این قبل از آن است که تمام ترفندهای نرم افزاری قدیمی و جدید را که گوگل در آستین خود دارد استفاده کنید. اما وقتی صحبت از قیمت Pro Fold شروع می شود، ترمزها"}, {"source": "Business Insider", "title": "Quince washable silk review: Testing how it holds up", "link": "https://www.businessinsider.com/guides/style/quince-washable-silk-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Talia Ergas, Jaclyn Turner/Business Insider At Insider Reviews, we've tested plenty of essentials for our full Quince review over the years, from workwear basics to leather totes , so we were especially curious to see whether the brand's silk pieces lived up to the hype. For this Quince silk review, we wore and washed a range of items from the brand's washable silk collection — including dresses, separates, and pajamas — to find out whether they're actually worth buying. Get to the point: Quince's washable silk is a great gateway to the luxury material, but it is not durable. We've experienced tears and feel like the material doesn't look or drape the same after many washes. It's a good choice for pieces you'll wear once or twice, but don't expect the longevity or sheen you'll get from silk sold by brands that specialize in it, like LilySilk or Clementine . Quince's 100% mulberry silk clothing is notably less expensive than similar styles from many other retailers, and the promise of machine-washable silk makes the line even more appealing. If the brand's claims hold up, these pieces could offer an easier, more affordable way to add silk to your wardrobe without the usual dry-cleaning hassle. After over two years of testing, we found that Quince's silk clothing feels soft, looks polished, and delivers strong value for the price, but durability was inconsistent. Some pieces held up well with repeated wear and washing, while others developed tears at the seams. Overall, we think Quince silk is best for occasional wear, not everyday heavy rotation. For our thoughts on where to get the best silk, see our article on the best silk pajamas . Washable Stretch Silk Tiered Maxi Dress The copper brown color was extremely versatile to dress up or down, but there are four other dark hues to choose from in sizes XS through XL. Talia Ergas/Business Insider This dress has become my most-reached-for item of clothing this summer. While elegant enough to dress up with some heels and a clutch for dinner, I mostly pair it with sneakers for an elevated and comfortable daytime look. (The sneaker look works for me because, at 5-foot-7, the dress hits me right above the ankles, but if you're shorter, it may fall closer to the floor.) I particularly love the tiered A-line silhouette, ob interview. Recruiters have thoughts.", "link": "https://www.businessinsider.com/iced-coffee-job-interview-gen-z-etiquette-career-experts-2026-9", "summary": "TikTok users are debating whether it would be a professional violation to bring an iced coffee to a job interview. time99lek/Getty Images TikTok users are debating whether you should bring an iced coffee to a job interview. A career expert said it highly depends on the role you want and how much risk you can take. A tech recruiter called beverage policing a distraction from performance-based hiring. Iced coffee has become the latest unlikely subject of workplace controversy. TikTok users are debating whether bringing iced coffee to a job interview is a harmless caffeine fix or a frosty professional faux pas . The discourse became heated enough to reach LinkedIn News on Friday, where LinkedIn news editor Rachel Kleinman described it as a \"fiery debate lighting up social media.\" While some recruiters said arriving with a drink in hand could appear distracting or disrespectful, others questioned why a simple attempt to remain caffeinated should have any bearing on a candidate's ability to do the job. Three career experts told Business Insider that the answer depends on whom you ask, and perhaps how much condensation is dripping from the cup. Dr. Colleen Batchelder, founder and CEO of Indiviti, a consulting firm that helps Gen Z break into the workforce, told Business Insider that if iced coffee is really a dealbreaker, a recruiter may need to make it clear in the interview invitation. \"This generation is pushing for workplace boundaries , fair pay, and work-life balance. For them, bringing iced coffee to a job interview isn't a sign of disrespect. It's just a beverage,\" Batchelder said of Gen Zers in the workforce. \"There's a huge gap right now between what Gen Z sees as normal and what hiring managers expect, so the tension is high,\" Batchelder added. Job hunting professionals have mixed opinions Amanda ا ممکن است کدهای تبلیغاتی قبلی کاسپر دارای کدهای تبلیغاتی قبلی هستند. در آینده دوباره فعال می شود. تخفیف"}, {"source": "Business Insider", "title": "A US Army training command says it is updating its drone warfare curriculum every 60 days", "link": "https://www.businessinsider.com/us-army-command-updates-drone-curriculum-regularly-2026-9", "summary": "The changes impact planning courses, instructors, and how drones and counter-drones are employed in exercises. US Army photo by Sgt. Collin Mackall A US Army training command is updating its drone warfare courses every 60 days. The curriculum changes based on takeaways from soldiers and changing tactics. Ongoing conflicts in the Middle East and Ukraine also impact how soldiers learn drone warfare. The US Army's training command in Germany is updating its drone warfare curriculum every 60 days in response to changes in this technology and the way it's used on the battlefield. These changes reflect what soldiers are learning from using drones , as well as ongoing conflicts in the Middle East and Ukraine, and include electronic warfare, or EW, and counter-drone technologies to better replicate the challenges troops could face in future wars. During a media roundtable last week, Army leaders discussed efforts to modernize the force for uncrewed aerial systems, or UAS, including the curriculum for troop training courses, called programs of instruction, or POIs. Brig. Gen. Terry Tillis, the head of 7th Army Training Command, said the command developed drone-related programs of instruction based on its experience. \"We iterate every sixty days to update those POIs, primarily focused on UAS operations ,\" Tillis said on the call, per a transcript, \"whether it's a planning course, an instructor course, or an employment course, and also with EW and other effects.\" Tillis added that the command syncs with the different Centers of Excellence routinely to share updates. The 7th Army Training Command is the Army's largest overseas center for training soldiers. Located in Germany, the command oversees the instruction and courses for soldiers across Europe and Africa and works with Army partners and allies as well. Lessons from the Middle East and Ukraine impact training as well. US Army photo by SPC. Kaleb Lampkin Army officials also shared details on how the 173rd Airborne Brigade, elements of which were involved in the Unmanned Assault Battalion experiment focused on uncrewed systems , and other units had gained experience in drone warfare at the Hohenfels Training Area in Germany. Tillis said that \"over the last three iterations, each rotational unit, including the opposing force, has grown significantly. We have observed units grow in proficiency, lethality, depth, range, and ideas of how to task-organize and employ capability across the depth of the battlefield\" to su", "date_str": "2026-09-21T19:22:19+00:00", "hash": "cc8fcd71ff311b08", "title_fa": "یک فرماندهی آموزشی ارتش ایالات متحده می گوید که برنامه آموزشی جنگ پهپادی خود را هر 60 روز یکبار به روز می کند", "summary_fa": "این تغییرات بر دوره های برنامه ریزی، مربیان و نحوه استفاده از پهپادها و ضد پهپادها در تمرینات تأثیر می گذارد. عکس ارتش ایالات متحده توسط گروهبان. Collin Mackall یک فرماندهی آموزشی ارتش ایالات متحده هر 60 روز یک بار دوره های جنگ پهپادی خود را به روز می کند. برنامه درسی بر اساس نکات اولیه سربازان و تغییر تاکتیک ها تغییر می کند. درگیری‌های جاری در خاورمیانه و اوکراین همچنین بر نحوه یادگیری جنگ با هواپیماهای بدون سرنشین تأثیر می‌گذارد. فرماندهی آموزشی ارتش ایالات متحده در آلمان در پاسخ به تغییرات در این فناوری و نحوه استفاده از آن در میدان نبرد، برنامه آموزشی جنگ پهپادی خود را هر 60 روز یک بار به روز می کند. این تغییرات نشان دهنده آموخته های سربازان از استفاده از پهپادها و همچنین درگیری های جاری در خاورمیانه و اوکراین است و شامل جنگ الکترونیک یا EW و فن آوری های ضد پهپاد برای تکرار بهتر چالش هایی است که سربازان در جنگ های آینده با آن مواجه خواهند شد. در طی یک میزگرد رسانه ای هفته گذشته، رهبران ارتش درباره تلاش ها برای نوسازی نیرو برای سیستم های هوایی بدون خدمه یا UAS، از جمله برنامه درسی دوره های آموزشی نیروها، به نام برنامه های آموزشی، یا POI بحث کردند. سرتیپ ژنرال تری تیلیس، رئیس فرماندهی آموزش ارتش هفتم، گفت که این فرماندهی بر اساس تجربه خود، برنامه های آموزشی مرتبط با پهپادها را توسعه داده است. تیلیس در این تماس گفت: \"ما هر شصت روز یک بار تکرار می کنیم تا آن POI ها را که در درجه اول بر عملیات UAS متمرکز شده اند، به روز کنیم.\" تیلیس افزود که این فرمان به طور معمول با مراکز مختلف تعالی همگام می شود تا به روز رسانی ها را به اشتراک بگذارد. فرماندهی آموزش هفتم ارتش بزرگترین مرکز برون مرزی"}, {"source": "Business Insider", "title": "Of course Larry and David Ellison got their way", "link": "https://www.businessinsider.com/larry-david-ellison-lawsuit-states-power-trump-money-paramont-wbd-2026-9", "summary": "Larry Ellison, one of the richest men in the world, and his son David, wanted to buy Warner Bros. Discovery. A year later, they are getting it. Eric Charbonneau/Getty Images for The Hollywood Reporter California Attorney General Rob Bonta has settled an antitrust suit that sought to stop Paramount from buying Warner Bros. Discovery. That suit gives Larry and David Ellison all but the final go-ahead to finalize the $110 billion deal they started pursuing a year ago. The Ellisons had two key advantages when they started out: Nearly endless money, and a line to the Trump White House. It's not a surprise that they got their way. One of the world's richest men, and his son, wanted to buy one of the most prestigious assets in the media world. Now they have gotten their wish. That's the important part about Monday's news: Larry and David Ellion's Paramount has settled a lawsuit brought by California and several other states, which sought to hold up Paramount's planned acquisition of Warner Bros. Discovery. With that out of the way, there are no longer any serious regulatory challenges to the deal. So the Ellisons can start finalizing their $111 billion acquisition in the very near future. That means the Ellisons will have combined control of major media assets, including two movie studios, HBO, and TV networks, including CBS, CNN, and dozens more. If you want to, you can dig into the details of the settlement to see what the Ellisons gave up to make this go away. The TLDR: Not much. A little longer: Rob Bonta, the California attorney general who led the antitrust case, repeatedly said he wanted \"structural\" changes to clear a Paramount/WBD deal — something that would have required the Ellisons to jettison some part of their combined businesses. He didn't get any of that. Instead, Bonta's main selling point is that he now has an \"enforceable commitment\" that the Ellisons' studios will make at least 30 movies a year — which is a pledge Ellison has been making publicly since April. Perhaps that's why Bonta spent much of his press conference explaining why he was working hard on other antitrust suits, while conceding that he didn't get the outcome he wanted here. \"I didn't believe these two companies should merge,\" he said Monday. \"I still don't.\" It's happening anyway. And it reinforces why many observers thought a year ago that Larry and David Ellison would end up owning Warner Bros. Discovery before they'd even formally announced their plan to buy WBD. The logic w", "date_str": "2026-09-21T18:58:28+00:00", "hash": "7391f71697cf0ad6", "title_fa": "البته لری و دیوید الیسون راه خود را پیدا کردند", "summary_fa": "لری الیسون، یکی از ثروتمندترین مردان جهان و پسرش دیوید، می خواستند کمپانی برادران وارنر دیسکاوری را بخرند. یک سال بعد، آنها آن را دریافت می کنند. Eric Charbonneau/Getty Images برای هالیوود ریپورتر، دادستان کل کالیفرنیا، راب بونتا، یک دعوای ضد انحصار را حل و فصل کرده است که به دنبال آن بود تا پارامونت را از خرید شرکت Warner Bros. این کت و شلوار به لری و دیوید الیسون اجازه می دهد تا معامله 110 میلیارد دلاری را که از یک سال پیش شروع کرده بودند، نهایی کنند. الیسون ها هنگام شروع کار دو مزیت کلیدی داشتند: پول تقریباً بی پایان و یک خط به ک
