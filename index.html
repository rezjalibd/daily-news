    .news-link {

      backdrop-filter: blur(4px);

      align-items: center;

    .modal-overlay.active {

    .modal-card {

    @media (max-width: 640px) {

      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>

ج انتخابات میان‌دوره‌ای رخ داده است. امیدواریم اوضاع خیلی زود تثبیت شود، زیرا هرچند به دلیل نگرانی‌های مطرح‌شده در ایالت‌های مختلف مانند تگزاس ممکن است سرعت ساخت زیرساخت‌های هوش مصنوعی و به‌ویژه دیتاسنترها کمی کند شود، اما روند کلی ادامه دارد.» یک تحلیلگر اقتصادی می‌گوید: «تمرکز بازار در آینده بر این خواهد بود که آیا فروش تهاجمی سرمایه‌گذاران خارجی آرام خواهد گرفت یا خیر، چه میزان از سرمایه‌گذاری واقعی در هوش مصنوعی به تعویق می‌افتد و آیا نگرانی‌های اغراق‌آمیز کنونی برطرف خواهند شد یا نه.» سرمایه‌گذاران خرد در کره‌ی جنوبی که از پیشران‌های اصلی رشد اخیر بازار بودند، موضع انتظار در پیش گرفته‌اند. آن هه‌سونگ، سرمایه‌گذار خرد ۲۶ ساله، گفت: «آیا بازار بیش‌ازحد واکنش نشان نداده است؟ این‌طور نیست که دموکرات‌ها کل ساخت‌وساز دیتاسنترها را متوقف کنند. من باید بخشی از سود سرمایه‌گذاری همه‌جانبه‌ام در فناوری را برداشت می‌کردم. من به", "image_url": "https://api2.zoomit.ir/media/south-korea-stock-market-crash-6aed9a2bb001528ef859d9ec?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سرمایه‌گذاری", "بورس و طلا"], "datetime_fa": "۱۵ آبان • ۱۷:۴۰"}, {"source": "Zoomit", "title": "بازگشت خودرو آریزو ۷ با چهره‌ متفاوت، طراحی لوکس و مصرف سوخت بسیار پایین", "link": "https://www.zoomit.ir/car/470536-chery-arrizo-7-production-specs/", "summary": "مشخصات فنی و ابعاد سدان چری آریزو 7 با برد ترکیبی ۱۷۰۰ کیلومتر در اسناد رسمی چین منتشر شد.", "date_str": "2026-11-06T14:00:00+00:00", "hash": "7a36d4596480f98d", "title_fa": "بازگشت خودرو آریزو ۷ با چهره‌ متفاوت، طراحی لوکس و مصرف سوخت بسیار پایین", "summary_fa": "مشخصات فنی و ابعاد سدان چری آریزو 7 با برد ترکیبی ۱۷۰۰ کیلومتر در اسناد رسمی چین منتشر شد.", "image_url": "", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۵ آبان • ۱۷:۳۰"}, {"source": "Lifehacker", "title": "This 75-inch Hisense Mini-LED TV Is Nearly Half Off Ahead of Black Friday", "link": "https://lifehacker.com/tech/hisense-75-inch-mini-led-u6sf-pro-tv-sale-early-black-friday-2026?utm_medium=RSS", "summary": "We may earn a commissio  the DAW features a chatbot, offering production tips and following instructions from a producer s voice or text prompts. It also offers a way to mix and match samples from the Splice library with greater ease. The company, known best for its library of more than three million human-made, licensed samples and loops, enters the DAW market at a time of disruption. While incumbent DAWs, like Ableton, Logic, ProTools and FL Studio, remain the market s top players, new browser-based applications, like BandLab, have grown a fanbase in recent years, offering a simpler and cheaper option for the novice producer. Plus, as generative AI has taken hold, AI platforms like Suno and Moises have also leaned in to DAW features to provide users with more optionality after a track is generated. Related AI’s Second Wave, From Anxiety to Imagination (Guest Column) Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Meanwhile, remixing and DJ-like features — which also encourage fans to customize their favorite songs — have never been of greater interest. Spotify , Udio, Klay and more are working on AI-powered music remix features. Both Spotify and Apple Music include DJ features in-app, and start-ups like Hook are working on licensed remix concepts for the TikTok generation. Despite all the buzz of generative AI, Splice has held steadfast on its commitment to providing only human-created samples, loops and instruments, instead, opting to use AI to better tailor and customize those samples by using it to better shift timbre, key, tempo and more. In 2023, Splice s CEO, Kakul Srivastava , said in an interview with Billboard : One of the things that we find disturbing about a lot of the work that is happening in generative AI is that it is push button creativity, she said. For us, that’s eliminating the creative as opposed to putting tools into the creatives’ hands. In that interview, she discussed Splice s Create in its first form: an AI-powered tool to mix and match Splice samples to, hopefully, help producers begin the song creation process and help them find the perfect sample faster. Now, Create has morphed into a full-fledged DAW, thanks to its acquisition of Kits AI at the start of the year. ", "date_str": "2026-11-06T14:24:20+00:00", "hash": "6400dc645f5b3f49", "title_fa": "Splice DAW را با «Create» دوباره تصور می کند - پلتفرم عاملی با هوش مصنوعی آن برای تازه واردان", "summary_fa": "Splice اولین ایستگاه کاری صوتی دیجیتال خود (DAW) را راه اندازی کرده است که دارای ویژگی های هوش مصنوعی عاملی و کمکی است تا به تولیدکنندگان جدید کمک کند برنامه را یاد بگیرند و آهنگ ها را به پایان برسانند. مهمتر از همه، DAW دارای یک ربات چت است که نکات تولید را ارائه می دهد و دستورالعمل های صوتی یا متنی تولید کننده را دنبال می کند. همچنین راهی برای ترکیب و تطبیق نمونه ها از کتابخانه Splice با سهولت بیشتر ارائه می دهد. این شرکت که به خاطر کتابخانه‌ای با بیش از سه میلیون نمونه و حلقه‌های دارای مجوز ساخت بشر شناخته می‌شود، در زمان اختلال وارد بازار DAW می‌شود. در حالی که DAWهای فعلی مانند Ableton، Logic، ProTools و FL Studio همچنان برترین بازیکنان بازار هستند، برنامه های کاربردی جدید مبتنی بر مرورگر، مانند BandLab، در سال های اخیر پایگاه طرفداران خود را افزایش داده اند و گزینه ساده تر و ارزان تری را برای تولیدکنندگان تازه کار ارائه می دهند. به‌علاوه، با فراگیر شدن هوش مصنوعی، پلتفرم‌های هوش مصنوعی مانند Suno و Moises نیز به ویژگی‌های DAW متمایل شده‌اند تا پس از ایجاد آهنگ، اختیارات بیشتری را در اختیار کاربران قرار دهند. موج دوم هوش مصنوعی مرتبط، از اضطراب تا تخیل (ستون مهمان) کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در ۷۱ سالگی درگذشت. از علاقه بیشتر Spotify، Udio، Klay و موارد دیگر روی ویژگی‌های ریمیکس موسیقی مبتنی بر هوش مصنوعی کار می‌کنند. هر دو اسپاتیفای و اپل موزیک دارای ویژگی‌های DJ درون برنامه‌ای هستند و استارت‌آپ‌هایی مانند هوک در حال کار بر روی مفاهیم ریمیکس مجاز برای نسل TikTok هستند. علیرغم همه هیاهوی هوش مصنوعی مولد، اسپلایس ب  Self-Portrait بود. او در سریال رامکام نتفلیکس Boyfriend on Demand که در ماه مارس اکران شد، نقش اصلی را ایفا کرد. و اخیراً همکاری های تجاری خود را با Off-White و Pokémon راه اندازی کرده است. JISOO که سال گذشته فصل جدید انفرادی خود را با \"EEYES CLOSED\" که همکاری با ستاره سابق وان دایرکشن، Zayn بود، تمسخر کرد. این تک آهنگ به شماره 72 در بیلبورد Hot 100 رسید. با این تلاش، BLACKPINK اولین گروه دختری شد که هر عضوی را به عنوان یک هنرمند انفرادی وارد Hot 100 کرد. BLACKPINK EP DEADLINE را در فوریه سال جاری پس از تکمیل توری به همین نام منتشر کرد. DEADLINE در شماره افتتاح شد. رتبه 8 در بیلبورد 200، و", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/jisoo-2026-1800-cr-narang-choi.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۱۵ آبان • ۱۷:۳۰"}, {"source": "Deadline", "title": "‘Dune’ Star Chang Chen Introduces Six Rising Taiwanese Actors In Golden Horse & TCCF Showcase", "link": "https://deadline.com/2026/11/chang-chen-golden-horse-awards-taiwan-talent-tccf-1237215415/", "summary": "Taiwanese star Chang Chen introduced six rising actors in a showcase co-organized by the Golden Horse Awards and Taiwan Creative Content Fest (TCCF) at the seventh edition of TCCF today. The event, which marks the first collaboration between TCCF and Taiwan’s Golden Horse Awards, aims to raise the profile of Taiwanese actors at a time [ ]", "date_str": "2026-11-06T14:53:37+00:00", "hash": "c376223e6c587990", "title_fa": "چانگ چن ستاره «تلماسه» شش بازیگر تایوانی در حال ظهور را در اسب طلایی و نمایشگاه TCCF معرفی کرد", "summary_fa": "چانگ چن، ستاره تایوانی، شش بازیگر در حال ظهور را در ویترینی که توسط جوایز اسب طلایی و جشنواره محتوای خلاق تایوان (TCCF) در هفتمین دوره TCCF برگزار شد، معرفی کرد. این رویداد، که اولین همکاری بین TCCF و جوایز اسب طلایی تایوان است، با هدف ارتقای شهرت بازیگران تایوانی در یک زمان است [ ] این شش استعداد شامل بازیگران زن بای شیائو یینگ (دختر)، هو من‌شی (گروه کر زنان آفتاب)، ما شیه یوان (دختر چپ‌دست)، (دخت  لوکیا در حال توسعه هستند، اما هنوز برای فاش شدن آماده نیستند. انتظار نمی رود این گروه به عنوان یک نهاد در AFM خریداری کند، اما این برنامه کمی جلوتر است. شبکه Lokia زاییده فکر مایکل فاول از آژانس فروش استرالیایی Odin’s Eye Entertainment و Odin’s Eye Animation است و با همکاری Heiko Nemmert، سابقاً از شرکت آلمانی Baby Giant، تأسیس و ساخته شد. علاوه بر چالش بازار پیش فروش، بنیانگذاران می گویند که این شبکه برای ارائه راه حلی برای معمای محصولات مصرفی مشتق شده از IP برای ویژگی های انیمیشن مستقل تشکیل شده است.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Lokia-2.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "سرمایه‌گذاری", "بورس و طلا"], "datetime_fa": "۱۵ آبان • ۱۷:۵۷"}, {"source": "Deadline", "title": "Jack Whitehall, Nina Dobrev, Greg Kinnear & Andie MacDowell Set For Rom-Com ‘Honeymooners’; HanWay & CAA Launch For AFM", "link": "https://deadline.com/2026/11/nina-dobrev-jack-whitehall-greg-kinnear-honeymooners-movie-1237215360/", "summary": "EXCLUSIVE: Jack Whitehall (Malice), Nina Dobrev (The Vampire Diaries), Oscar nominee Greg Kinnear (As Good As It Gets) and Golden Globe nominee Andie MacDowell (Four Weddings And A Funeral) are set to star in rom-com Honeymooners. Hanway Films will be launching international sales at the AFM for filmmaker Daryl Wein’s (Something From Tiffany s) feature which [ ]", "date_str": "2026-11-06T14:00:00+00:00", "hash": "eb7f10d9c41ef94a", "title_fa": "جک وایتهال، نینا دوبرو، گرگ کینیر و اندی مک‌داول برای رام کام «ماه عسل»؛ راه اندازی HanWay و CAA برای AFM", "summary_fa": "انحصاری: جک وایتهال (مالیس)، نینا دوبرو (خاطرات خون آشام)، نامزد اسکار، گرگ کینیر (به هر حال خوب) و نامزد گلدن گلوب، اندی مک داول (چهار عروسی و یک تشییع جنازه) قرار است در ماه عسل رام کام بازی کنند. Hanway Films فروش بین‌المللی فیلم Daryl Wein (چیزی از Tiffany s) را در AFM راه‌اندازی می‌کند که [ ] اختصاصی: جک وایتهال (Malice)، نینا دوبرو (The Vampire Diaries)، نامزد اسکار، Greg Kinnear (As Good Goldinee Getswellie) Weddings And A Funeral ": "دموکرات‌ها در ویسکانسین، پنسیلوانیا و آریزونا برنده «trifectas» شدند. آن‌ها برنامه‌های بزرگی برای اقدام اقلیمی دارند هنگامی که ترامپ در سال‌های 2016 و 2024 انتخاب شد و وعده داد که دولت فدرال را با اقدامات اقلیمی دشمنی کند، بسیاری از حامیان آب و هوا اصرار داشتند که دولت‌های ایالتی و محلی لباس فشار آوردن برای انرژی پاک را بر عهده بگیرند. این تز ائتلاف «آمریکا همه‌جانبه است» است که شهرها و ایالت‌هایی را گرد هم می‌آورد که متعهد شده‌اند از «تعهدات اقلیمی آمریکا... در غیاب رهبری فدرال» حمایت کنند. اخطار ناگفته در این ادعاها این است که ایالت های پیشرو در سیاست آب و هوا در چند بخش لیبرال کشور مانند نیوانگلند و ساحل غربی متمرکز شده اند. پیروزی تاریخی حزب دموکرات در انتخابات میان دوره ای این هفته می تواند آن را تغییر دهد. دموکرات‌ها کنترل اتاق‌های قانونگذاری ایالتی و عمارت فرماندار - که به عنوان \"تریفکتا\" نیز شناخته می‌شود - در آریزونا، پنسیلوانیا و ویسکانسین، سه ایالت که سال‌ها یا دهه‌ها را تحت کنترل جمهوری‌خواهان یا تقسیم‌شده سپری کرده‌اند، تضمین کرده‌اند. سه ایالت نیز در حمایت از انرژی پاک عقب مانده اند. دموکرات‌ها این هفته همچنین trifectas را در مینه‌سوتا، میشیگان و نوادا احیا کردند، اما این ایالت‌ها ایالت‌هایی هستند که آخرین بار در اوایل این دهه کنترل یکپارچه را داشتند. دیوید ویسکوپف، مدیر ارشد سیاست در Climate Cabinet، یک سازمان غیرانتفاعی که برای انتخاب نامزدهای متمرکز بر آب و هوا و تصویب سیاست آب و هوای ایالتی کار می کند، گفت: «غالغه کردن اینکه چقدر این نتایج چشمگیر هستند، غیرممکن است. او گفت که شش ایالتی که دموکرات‌ها در آن‌ها از trifectas محافظت کرده‌اند، اگر کشور خود را تشکیل دهند، یکی از بزرگترین تولیدکنندگان گازهای گلخانه‌ای در جهان خواهند بود و رقیب کانادا و عربستان سعودی هستند. \"این فقط یک فرصت بزرگ برای پیشرفت است.\"", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/midterms-climate-action.jpg?crop=0px%2C0px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۵ آبان • ۱۸:۳۰"}, {"source": "Rolling Stone", "title": "What’s Next for Tom Petty’s Heartbreakers? Benmont Ten nes", "link": "https://variety.com/2026/shopping/news/avatar-fire-and-ash-collectors-edition-deleted-scenes-1236941277/", "summary": "James Cameron is inviting audiences back to Pandora with a new collector’s edition of “Avatar: Fire and Ash,” arriving on digital platforms and 4K Ultra HD on Dec. 8. The special release, available on Prime Video, will feature more than nine hours of bonus material, including deleted and extended scenes, behind-the-scenes footage and an awards-season [ ]", "date_str": "2026-11-06T15:00:00+00:00", "hash": "e701e65b769a44be", "title_fa": "«آواتار: آتش و خاکستر» مجموعه‌های نسخه مجموعه‌ای با پرسش و پاسخ مایلی سایرس و صحنه‌های حذف شده", "summary_fa": "جیمز کامرون با نسخه کلکسیونی «آواتار: آتش و خاکستر» که در 8 دسامبر روی پلتفرم‌های دیجیتال و کیفیت 4K Ultra HD عرضه می‌شود، مخاطبان را به پاندورا دعوت می‌کند. محصول یا خدمات از طریق پیوند در وب سایت ما، Variety ممکن است کمیسیون وابسته دریافت کند. فیلم تازه منتشر شده شامل صحنه‌هایی است که رابطه بین جیک سالی (سام ورثینگتون) و نیتیری (زوئه سالدانا) را بررسی می‌کند، و همچنین داستان‌های بیشتری را شامل می‌شود که فرزندان آنها و آنتاگونیست بازگشته، سرهنگ مایلز کواریچ (استیون لانگ) را درگیر می‌کند. یکی از سکانس‌های حذف شده، جیک و اسپایدر را می‌بیند که در تاسیسات بریج‌هد RDA اسیر می‌شوند، در حالی که بقیه دنباله‌روی لواک برای پیاکان، فرار خانواده سالی از مردم خاکستر و مرگ جایگزین برای ژنرال آردمور هستند. این نسخه همچنین شامل «آتش و آب: ساخت فیلم‌های آواتار»، یک مستند پشت صحنه دو قسمتی، همراه با نمایش‌های تصویربرداری از اجرا با حضور ورتینگتون، سیگورنی ویور، لانگ و اونا چاپلین خواهد بود. موارد اضافی دیگر شامل خرابی صحنه، گروه بازیگران و فیلمساز، و ادای احترام به جان لاندو، تهیه کننده فقید «آواتار» است. نسخه فیزیکی همچنین شامل مطالب آرشیوی از جمله فیلمنامه و هنر تولید خواهد بود. «آواتار: آتش و خاکستر» که در دسامبر 2025 در سینما اکران شد، سومین قسمت از مجموعه پرفروش کامرون پس از «آواتار» در سال 2009 و «آواتار: راه آب» محصول سال 2022 بود. این فیلم جیک و نیتیری را دنبال می‌کند که در جریان عواقب تلفات خانواده‌ش     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
