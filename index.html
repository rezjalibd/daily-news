ary_fa": "پس از به دست آوردن یک آواتار تعاملی و آموزش آن برای بحث در مورد کلاهبرداری خطرپذیر، احساسات متفاوتی در مورد ساختن شبیه سازی هوش مصنوعی از خود دارم. هنگامی که الکساندر وویکا، رئیس امور شرکتی در استارتاپ نسل ویدیویی Synthesia، در تابستان امسال پیوندی به جدیدترین عضو تیم روابط عمومی آنها برای من فرستاد، شگفت زده شدم. این یک آواتار مجازی تعاملی از او بود که برای پاسخ دادن به سوالات رایج مطبوعات در مورد Synthesia، مانند آنچه که انجام می دهد و چگونه کار می کند، آموزش دیده بود. روز قبل، من در یک پانل بودم که در آن افراد روابط عمومی از من پرسیدند که آیا به طرح‌هایی که از متن تولید شده توسط هوش مصنوعی استفاده می‌کردند، اهمیت نمی‌دهم. اما آواتار الکساندرو فراتر از این بود - به نظر من این آخرین رئیس استفاده از هوش مصنوعی در روابط عمومی بود. در ماه سپتامبر، Synthesia من را به فضای اداری جدید خود در نیویورک دعوت کرد. Synthesia که در ابتدا در بریتانیا مستقر است، یک استارت آپ آواتار دیجیتال داغ در کنار سایرین مانند D-ID، HeyGen و Colossyan است. ارزش آن در اوایل امسال به 4 میلیارد دلار رسید و سال گذشته گفت که از 100 میلیون دلار در ARR عبور کرده است. Synthesia به شرکت‌ها اجازه می‌دهد ویدیوهای آموزشی تعاملی با آواتارهای هوش مصنوعی بسازند و اخیراً محصولی به نام Roleplay Sessions راه‌اندازی کرده است که به کارمندان اجازه می‌دهد به عنوان مثال، فروش‌ها را با یک آواتار هوش مصنوعی تعاملی که پاسخ می‌دهد و به پاسخ‌های آنها امتیاز می‌دهد، تمرین کنند. وقتی به افتتاحیه دفتر جدید رفتم و آنها از من پرسیدند که آیا آواتار هوش مصنوعی خودم را می خواهم، حتی در پاسخ به این سوال تردید نکردم. البته من دوقلو دیجیتال خودم را دوست دارم. آن روز لباس من زیبا بود و"}, {"source": "TechCrunch Main", "title": "Automattic has a new board after failed attempt to put CEO on leave", "link": "https://techcrunch.com/2026/09/25/automattic-has-a-new-board-after-failed-attempt-to-put-ceo-on-leave/", "summary": "After days of upheaval at Automattic, following a failed attempt to remove CEO Matt Mullenweg, the company has a new board.", "date_str": "2026-09-25T23:04:34+00:00", "hash": "fb6fd353b7865561", "title_fa": "Automattic پس از تلاش ناموفق برای مرخصی دادن مدیرعامل، هیئت مدیره جدیدی دارد", "summary_fa": "پس از روزها آشفتگی در Automattic، پس از تلاش ناموفق برای برکناری مت مولنوگ، مدیرعامل، این شرکت هیئت مدیره جدیدی دارد. مدیرعامل Automattic، Matt Mullenweg، تنها چند هفته پس از تلاش مدیران قبلی برای برکناری او، هیئت مدیره شرکت را بازسازی کرد. TechCrunch آموخته است که TechCrunch و Mullenweg تایید کرده است، هیئت مدیره، که جمعه به کارکنان اعلام شد، یک گروه التقاطی است که شامل یک نویسنده علمی تخیلی پرفروش و دو نفر از بنیانگذاران برنامه اجتماعی منقرض شده IRL است. هیئت مدیره جدید جدیدترین تغییر در مبارزه حاکمیت داخلی در Automattic، شرکت مادر WordPress.com، Tumblr، WooCommerce و دیگران است. در اوایل این ماه، هیئت مدیره قبلی به منظور برکناری مولن‌وگ از هیئت مدیره رای به مرخصی داد، اما تنها 33 ساعت بعد، مدیر عامل شرکت دوباره کنترل را به دست گرفت و استعفای مدیرانی را که در این کار نقش داشتند، برکنار یا قبول کرد. این هفته، مولنوگ در مورد یک جلسه هیئت مدیره پستی منتشر کرد، اما با چه کسانی ملاقات کرده است. اکنون او بالاخره از طریق کانال اطلاعیه های شرکت در اسلک، تغییرات هیئت مدیره را به اطلاع کارکنان Automattic می رساند. منابع به TechCrunch گفتند که برد جدید Automattic شامل موارد زیر است: باید توجه داشته باشیم که IRL پس از بررسی‌ها نشان داد که تقریباً تمام پایگاه کاربران آن از ربات‌ها تشکیل شده بود، بسته شد. بنیانگذاران، که همچنین شامل آبراهام شفیع مدیر عامل شرکت بودند، بعد از آن که سافت بانک به دلیل تقلب در اوراق بهادار شکایت کرد، از سافت بانک و سایر سرمایه گذاران شکایت کردند. مشاوران جدیدی نیز به Automattic ملحق شده اند، از جمله CTO سابق Whoop Jaime Waydo، یکی از بنیانگذاران ژوئن، Matt Van Horn، و یکی از بنیانگذاران KISSmetrics، Hiten Shah. طبق گزارشات، مولن‌وگ در اعلامیه‌ای به کارکنان نوشت که برای اهداف قانون دلاور، من مدیرعامل،"}, {"source": "TechCrunch Main", "title": "The hottest new hangout for middle schoolers is NPR’s comment section?", "link": "https://techcrunch.com/2026/09/25/the-hottest-new-hangout-for-middle-schoolers-is-nprs-comment-section/", "summary": "When NPR staffers flagged strange comments under their podcasts on Spotify as bots, it took a Gen Z colleague to (immediately) figure out the mystery.", "date_str": "2026-09-25T20:33:58+00:00", "hash": "a9f0ece25fa527ea", "title_fa": "داغ‌ترین پاتوق جدید برای دانش‌آموزان راهنمایی، بخش نظرات NPR است؟", "summary_fa": "هنگامی که کارکنان NPR نظرات عجیب و غریب را در زیر پادکست های خود در Spotify به عنوان ربات علامت گذاری کردند، یک همکار Gen Z نیاز داشت تا (فورا) این راز را کشف کند. والدین سال‌ها تلاش کرده‌اند تا فرزندان خود را از رسانه‌های اجتماعی دور نگه دارند، بنابراین برخی از بچه‌ها به جایی می‌روند که هیچ بزرگسالی فکر نمی‌کند به دنبال آنها بگردد: NPR. در این هفته این زندگی آمریکایی، مجری ایرا گلس داستان تیمی را که پشت پادکست وایلد کارت NPR قرار داشت، روایت می‌کند که پاییز گذشته متوجه سیل نظرات گیج‌کننده زیر قسمت‌های Spotify خود شدند. یک تهیه کننده تصور می کرد اختصارات عجیب و غریب و ایموجی های غیرقابل کشف ترافیک ربات هستند و اسکرین شات هایی را در NPR s Slack به اشتراک گذاشته است. سپس آنها پست ها را به Spotify گزارش کردند. اما هانا چین، تهیه کننده صدا و همکار Gen Z، نگاهی به اسکرین شات ها انداخت و تقریباً بلافاصله با گفتن گلس متوجه شد که این ها ربات نیستند. آنها احتمالاً دانش‌آموزان راهنمایی بودند که برای رسانه‌های اجتماعی خیلی جوان بودند و در نظرات پادکست چت گروهی داشتند. (شاید کسی در NPR باید زودتر این را می‌گفت: سال گذشته بچه‌هایی را مشاهده کرد که همین کار را در برنامه ساعت رادیویی TED انجام می‌دادند.) در مورد اینکه چرا NPR به طور خاص، وقتی گلس یکی از بچه‌ها را دنبال می‌کرد تا بپرسد، پاسخی بی‌پرده به او داده شد: اوم، من فکر می‌کنم ما فقط، دوست داشتم، به دنبال پادکست‌های زیادی نبودیم. گلس که سه دهه مجری برنامه این زندگی آمریکایی بوده است، به شما می گویم، رفیق، من یک برنامه رادیویی عمومی اجرا می کنم، و شنیدن آن کمی آزار دهنده است. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را"}, {"source": "TechCrunch Main", "title": "The Aeropod automates soil aeration without robotics — see it at TechCrunch Disrupt", "link": "https://techcrunch.com/2026/09/25/the-aeropod-automates-soil-aeration-without-robotics-see-it-at-techcrunch-disrupt/", "summary": "Muju Earth Technologies has developed a deceptively simply pod that can save farmers money while improving crop yields.", "date_str": "2026-09-25T17:30:00+00:00", "hash": "853b129035e17e96", "title_fa": "Aeropod هوادهی خاک را بدون روباتیک خودکار می کند - آن را در TechCrunch Disrupt ببینید", "summary_fa": "Muju Earth Technologies یک غلاف ساده و فریبنده ایجاد کرده است که می تواند در هزینه کشاورزان صرفه جویی کند و در عین حال عملکرد محصول را بهبود بخشد. کشاورزان در سرتاسر جهان با یک مشکل مبرم روبرو هستند: تجهیزاتی که برای کشت، کاشت و برداشت مزارع خود استفاده می‌کنند، حواشی آنها را از بین می‌برد. مطالعات تخمین زده اند که فشردگی خاک می تواند محصول را بین 20 تا 60 درصد کاهش دهد. شخم زدن می تواند کمک کند، اما این یک کار پر زحمت و پرهزینه است که به طرق مختلف به سلامت خاک آسیب می رساند. Muju Earth یک جایگزین به نام Aeropod ایجاد کرده است که به طور خودکار خاک را بدون ماشین یا روباتیک هوادهی می کند. این استارت‌آپ می‌گوید می‌تواند سلامت بهتر خاک را ارتقا دهد و در عین حال هزینه‌های خاک‌ورزی کشاورزان را به نصف یا بیشتر کاهش دهد. Ifeoluwa Afolayan، یکی از بنیانگذاران و مدیر عامل شرکت، به TechCrunch گفت: این دستگاه مانند یک دانه ساخته شده است، مانند یک دانه می کارد، و مانند یک دانه ارسال می شود. اندازه این دستگاه به اندازه یک ناخن است و کشاورزان با استفاده از همین تجهیزات آن را در کنار بذرهای خود در خاک می ریزند. نیازی به شست و شوی خاک از قبل نیست. افولایان گفت: «این واقعاً بی‌معنی به نظر می‌رسد. پس از اینکه Aeropod در معرض ترکیبی از دما، فشار و رطوبت قرار می گیرد، باز می شود و خاک را شل می کند و کانال های کوچکی ایجاد می کند که به هوا، آب و ریشه ها اجازه می دهد راحت تر در آن حرکت کنند. Muju Earth - یکی از 200 استارت‌آپ در میدان نبرد استارت‌آپ امسال در TechCrunch Disrupt در سانفرانسیسکو در ماه اکتبر - دستگاه‌های خود را در تنظیمات آزمایشگاهی آزمایش کرده است و در پاییز"}, {"source": "TechCrunch Main", "title": "Kiteworks urges customers to shut down their servers amid ‘imminent’ threat of cyberattack", "link": "https://techcrunch.com/2026/09/25/kiteworks-urges-customers-to-shut-down-their-servers-amid-imminent-threat-of-cyberattack/", "summary": "The tech giant, which allows companies to send large datasets over the internet, said it received a \"credible threat\" from law enforcement about an imminent attack.", "date_str": "2026-09-25T15:52:13+00:00", "hash": "03b1cb13704919f3", "title_fa": "Kiteworks از مشتریان می خواهد که سرورهای خود را در میان تهدید \"قریب الوقوع\" حمله سایبری خاموش کنند.", "summary_fa": "این غول فناوری که به شرکت‌ها اجازه می‌دهد مجموعه داده‌های بزرگی را از طریق اینترنت ارسال کنند، گفت که یک \"تهدید معتبر\" از سوی مجری قانون در مورد یک حمله قریب‌الوقوع دریافت کرده است. غول فناوری Kiteworks از مشتریان می خواهد که پس از دریافت اطلاعاتی مبنی بر اینکه هکرها ممکن است آنها را هدف قرار دهند، سیستم های خود را خاموش کنند. Kiteworks (که قبلا Accellion نام داشت)، که ابزارهایی برای انتقال فایل‌های بزرگ و مجموعه داده‌های حساس از طریق اینترنت می‌سازد، به TechCrunch تأیید کرد که مشتریان خود را از یک تهدید بالقوه مطلع کرده است. این خبر اولین بار به طور انحصاری توسط نشریه آلمانی Heise گزارش شد، که به ایمیلی اشاره کرد که Kiteworks برای مشتریان خود در مورد حمله قریب الوقوع ارسال کرده بود که ممکن است در این آخر هفته اتفاق بیفتد. هنگامی که روز جمعه با ایمیل تماس گرفت، فرانک بالونیس، مدیر ارشد امنیت اطلاعات Kiteworks به TechCrunch گفت که این شرکت اطلاعات تهدیدی معتبری را از مجری قانون دریافت کرده است که نشان می دهد یک عامل تهدید ممکن است سعی کند برخی از سیستم های Kiteworks را برای مشتریان هدف قرار دهد. به گفته بالونیس، از روی احتیاط فراوان، ما مستقیماً به مشتریان اطلاع دادیم و در زمانی که ما و شرکای مجری قانون خود در حال انجام این موضوع هستیم، پنجره خاموش شدن احتیاطی را توصیه کردیم. ما از هیچ گونه آسیبی در سیستم های Kiteworks آگاه نیستیم و این توصیه به جای پاسخ به نقض تایید شده، پیشگیرانه است. Kiteworks در پاسخ به این سوال که کدام سازمان مجری قانون به شرکت هشدار داده است یا کدام گروه هکر ممکن است پشت این تهدید باشد، نگفت. FBI از اظهار نظر خودداری کرد. مارکو دی ساندرو، سخنگوی آژانس امنیت سایبری ایالات متحده CISA، هنگامی که از TechCrunch در مورد هشدار"}, {"source": "TechCrunch Main", "title": "Tesla finally moves to electrify trucking after a decade of work and delays", "link": "https://techcrunch.com/2026/09/25/tesla-finally-moves-to-electrify-trucking-after-a-decade-of-work-and-delays/", "summary": "Tesla's Semi truck, with a 500-mile range, is about to hit the road in big numbers, with the company saying it plans to make 50,000 units a year.", "date_str": "2026-09-25T15:24:50+00:00", "hash": "eba85c00122a2ddf", "title_fa": "تسلا سرانجام پس از یک دهه کار و تأخیر به سمت حمل و نقل برقی حرکت می کند", "summary_fa": "کامیون Semi تسلا، با برد 500 مایلی، در آستانه ورود به جاده ها در تعداد زیادی است و این شرکت اعلام کرده است که قصد دارد 50000 دستگاه در سال تولید کند. تسلا بالاخره اولین کامیون نیمه برقی خود را پس از نزدیک به یک دهه تاخیر و اصلاحات در خودرو، که اولین بار در سال 2017 معرفی کرد، به مشتریان تحویل می دهد. مدیران شرکت - به جز ایلان ماسک، مدیر عامل شرکت که در ضیافت شام دولتی پرزیدنت ترامپ با شی جین پینگ، نخست‌وزیر چین حضور داشت - در رویدادی در رنو، نوادا، در پنج‌شنبه شب، مخاطبان مشتریان، کارمندان و اینفلوئنسرها را در بسیاری از جزئیات بررسی کردند. یکی از آشنایان به TechCrunch به شرط ناشناس ماندن به TechCrunch گفت: مشتریان می توانند هر زمان که آماده باشند کامیون را تحویل بگیرند، اگرچه زیرساخت شارژ همچنان یک مانع است. بدون افشای قیمت نهایی برچسب، مدیران قول دادند که این کامیون به صاحبان ناوگان کمک کند تا هزینه کل مالکیت خود را کاهش دهند، انتشار گازهای گلخانه ای را کاهش دهند و از قابلیت اطمینان بیشتر بهره مند شوند. این رویداد در یک کارخانه جدید اختصاص داده شده به Semi برگزار شد که در مجاورت اولین Gigafactory این شرکت در Reno قرار دارد. تسلا قصد دارد سالانه 50000 کامیون یا تقریباً 1000 کامیون در هفته در کارخانه بسازد و 3000 شغل برای اقتصاد محلی ایجاد کند. انتظار می رود که تواناترین نسخه کامیون با یک بار شارژ 500 مایل یا بیشتر را بپیماید (بسته به اندازه بار) و قبل از مشوق ها فقط 300000 دلار هزینه داشته باشد. انواع با برد کوتاه تر نیز وجود خواهد داشت. پرتاب Semi که مدت ها در انتظار آن بودیم در زمان انتقال تسلا انجام می شود. ماسک اکنون تسلا را به عنوان یک شرکت رباتیک و هوش مصنوعی معرفی می کند، اگرچه"}, {"source": "VentureBeat Tech", "title": "Stanford and Nvidia's open CLM-8B caches reusable agent actions and runs up to 9x faster than Jev in tests", "link": "https://venturebeat.com/technology/stanford-and-nvidias-open-clm-8b-caches-reusable-agent-actions-and-runs-up-to-9x-faster-than-jev-in-tests", "summary": "AI agents often use LLMs to choose between a fixed set of tools or rank candidate outputs. In each case, the model processes a prompt and generates tokens even though the application only needs a bounded decision. Read more", "date_str": "2026-09-25T20:13:30+00:00", "hash": "ca267128fb8f43ce", "title_fa": "CLM-8B باز استنفورد و انویدیا اقدامات عامل قابل استفاده مجدد را در حافظه پنهان ذخیره می کند و در آزمایشات تا 9 برابر سریعتر از Jev اجرا می شود.", "summary_fa": "عوامل هوش مصنوعی اغلب از LLM برای انتخاب بین مجموعه ثابتی از ابزارها یا رتبه بندی خروجی های نامزد استفاده می کنند. در هر مورد، مدل یک درخواست را پردازش می‌کند و توکن‌ها را تولید می‌کند، حتی اگر برنامه فقط به یک تصمیم محدود نیاز داشته باشد. ادامه مطلب"}, {"source": "Ars Technica", "title": "Can Trump ever be wrong? His pick to lead FDA refused to say.", "link": "https://arstechnica.com/health/2026/09/can-trump-ever-be-wrong-his-pick-to-lead-fda-refused-to-say/", "summary": "Heidi Overton , President Trump's nominee to lead the Food and Drug Administration, went before the Senate health committee Thursday, facing questions about her stances on vaccines, flavored vapes, birth control, and abortion, among other issues. She spent nearly two hours stonewalling senators, even on softball questions. Overton, a physician with a doctoral degree in clinical investigation, is currently the deputy assistant to the president for domestic policy. She previously worked at a conservative think tank and has taken a clear stance opposing abortion , raising obvious questions about her objectivity. The FDA is currently reviewing the safety of the abortion pill, mifepristone, despite extensive data showing it is extremely safe. Overton also notably stood behind President Trump at a press conference in August during which Trump falsely called the measles, mumps, and rubella (MMR) vaccine \" quite lethal .\" He further claimed that vaccine doses for infants are \"like the size of a soda bottle,\" and called for the MMR vaccine to be split into three separate immunizations, despite no evidence of benefit from such a split and no such individual immunizations being available in the US. Read full article Comments", "date_str": "2026-09-25T23:00:26+00:00", "hash": "87b15a05ff8b7b38", "title_fa": "آیا ترامپ ممکن است اشتباه کند؟ انتخاب او برای رهبری FDA از گفتن این موضوع خودداری کرد.", "summary_fa": "هایدی اورتون، نامزد پرزیدنت ترامپ برای رهبری سازمان غذا و دارو، روز پنجشنبه به کمیته بهداشت سنا رفت و با سوالاتی در مورد مواضع خود در مورد واکسن‌ها، ویپ‌های طعم‌دار، کنترل بارداری و سقط جنین و سایر مسائل مواجه شد. او نزدیک به دو ساعت را صرف سنگ اندازی از سناتورها کرد، حتی در مورد سوالات سافت بال. اورتون، پزشک با مدرک دکترا در تحقیقات بالینی، در حال حاضر معاون دستیار رئیس جمهور در امور سیاست داخلی است. او قبلاً در یک اندیشکده محافظه کار کار می کرد و موضع روشنی در مخالفت با سقط جنین اتخاذ کرد و سؤالات واضحی را در مورد عینیت او ایجاد کرد. FDA در حال حاضر در حال بررسی ایمنی قرص سقط جنین، میفپریستون است، علیرغم اینکه داده های گسترده نشان می دهد که این قرص بسیار ایمن است. اورتون همچنین در یک کنفرانس مطبوعاتی در ماه اوت پشت پرزیدنت ترامپ ایستاد که طی آن ترامپ به دروغ واکسن سرخک، اوریون و سرخجه (MMR) را \"کاملا کشنده\" خواند. وی همچنین ادعا کرد که دوزهای واکسن برای نوزادان \"به اندازه یک بطری نوشابه\" است و خواستار تقسیم واکسن MMR به سه واکسن جداگانه شد، علیرغم اینکه هیچ شواهدی مبنی بر منفعت از چنین تقسیم بندی وجود ندارد و چنین واکسیناسیون فردی در ایالات متحده موجود نیست. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید. او نزدیک به دو ساعت را صرف سنگ اندازی از سناتورها کرد، حتی در مورد سوالات سافت بال."}, {"source": "Ars Technica", "title": "Court rules Pentagon can blacklist Anthropic for refusing to enable Claude features", "link": "https://arstechnica.com/tech-policy/2026/09/court-rules-trump-can-blacklist-anthropic-for-refusing-to-enable-claude-features/", "summary": "A US appeals court today approved the Department of Defense's blacklisting of Anthropic technology. Judges decided the Trump administration had authority to blacklist Anthropic for withholding certain AI features from the military even if Anthropic had no malicious intent. In a 2-1 ruling issued by the US Court of Appeals for the District of Columbia Circuit, a panel of judges said the \"case raises profoundly difficult questions about the appropriate military uses of an almost unimaginably powerful new technology.\" The US \"raises the deeply sobering prospect of overly constrained AI models shutting down unexpectedly and thus causing important military operations to fail. Anthropic raises the deeply sobering prospect of unconstrained AI models hallucinating inappropriate targets for lethal military force,\" the ruling said. Trump and Defense Secretary Pete Hegseth \"must determine how best to balance the competing risks,\" the court said. \"In doing so here, the Secretary did not transgress any limits on his authority under the Supply Chain Security Act or the Constitution. Accordingly, we deny the petitions for review.\" The same court previously denied Anthropic's emergency motion for a stay in April. Read full article Comments", "date_str": "2026-09-25T21:36:20+00:00", "hash": "af07d702683c342e", "title_fa": "دادگاه حکم می‌کند که پنتاگون می‌تواند Anthropic را به دلیل امتناع از فعال کردن ویژگی‌های کلود در لیست سیاه قرار دهد", "summary_fa": "دادگاه استیناف ایالات متحده امروز با قرار دادن فناوری Anthropic در لیست سیاه وزارت دفاع موافقت کرد. قضات به این نتیجه رسیدند که دولت ترامپ این اختیار را دارد که Anthropic را به دلیل پنهان کردن برخی ویژگی‌های هوش مصنوعی از ارتش در لیست سیاه قرار دهد، حتی اگر آنتروپیک هیچ قصد بدی نداشته باشد. در یک حکم 2-1 صادر شده توسط دادگاه استیناف ایالات متحده برای منطقه کلمبیا، هیئتی از قضات گفتند که \"این پرونده سوالات بسیار دشواری را در مورد استفاده نظامی مناسب از یک فناوری جدید تقریباً غیرقابل تصور قدرتمند ایجاد می کند.\" ایالات متحده «چشم انداز عمیقاً نگران کننده ای را مطرح می کند که مدل های هوش مصنوعی بسیار محدود به طور غیرمنتظره خاموش می شوند و در نتیجه باعث شکست عملیات نظامی مهم می شوند. آنتروپیک چشم‌انداز عمیقاً نگران‌کننده مدل‌های هوش مصنوعی بدون محدودیت را مطرح می‌کند که اهداف نامناسب برای نیروی نظامی کشنده را توهم می‌کنند. دادگاه گفت، ترامپ و وزیر دفاع، پیت هگزث، «باید تعیین کنند که چگونه می‌توانند به بهترین نحو ریسک‌های رقیب را متعادل کنند.» با انجام این کار در اینجا، وزیر از هیچ گونه محدودیت یا قانون اساسی بر اساس اختیارات امنیتی خود تجاوز نکرده است. بر این اساس، ما دادخواست‌ها را برای بررسی رد می‌کنیم.\" همان دادگاه قبلاً درخواست اضطراری Anthropic برای توقف در آوریل را رد کرده بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید یک دادگاه تجدیدنظر ایالات متحده امروز لیست سیاه فناوری وزارت دفاع Anthropic را تأیید کرد. قضات به این نتیجه رسیدند که دولت ترامپ این اختیار را دارد که Anthropic را به دلیل پنهان کردن برخی ویژگی‌های هوش مصنوعی از ارتش در لیست سیاه قرار دهد، حتی اگر آنتروپیک هیچ"}, {"source": "Ars Technica", "title": "Tesla workers balk at training Optimus humanoid robots as replacements", "link": "https://arstechnica.com/ai/2026/09/tesla-workers-balk-at-training-optimus-humanoid-robots-as-replacements/", "summary": "Tesla’s pivot from making electric cars to humanoid robots is facing challenges because of complex robot hands and disgruntled employees pushing back against training their robotic replacements. The struggle to scale up production comes as Tesla CEO Elon Musk has bet the company’s future on AI and robotics. As someone who frequently makes claims that fail to materialize, Musk has described the Optimus humanoid robot as potentially “the biggest product ever” during Tesla’s second-quarter 2026 earnings call . But he also acknowledged that making an autonomous humanoid robot capable of handling many different tasks is “one of the hardest things to solve”—and now extensive reporting by The Information has revealed multiple complications that Tesla is trying to tackle while developing general-purpose robots and scaling up for mass production. Tesla’s Fremont factory in California has already stopped making the Model S sedan and Model X SUV as of May 2026, with the company switching both line workers and engineers over to working on Optimus, according to The Information. Read full article Comments", "date_str": "2026-09-25T21:10:51+00:00", "hash": "cef6f550c8e82a4c", "title_fa": "کارگران تسلا از آموزش ربات‌های انسان‌نما Optimus به عنوان جایگزین مخالفت می‌کنند", "summary_fa": "محور تسلا از ساخت خودروهای الکتریکی به ربات‌های انسان‌نما به دلیل دست‌های پیچیده ربات و کارمندان ناراضی که از آموزش جایگزین‌های رباتیک خود عقب‌نشینی می‌کنند، با چالش‌هایی مواجه است. تلاش برای افزایش تولید در حالی رخ می دهد که ایلان ماسک، مدیرعامل تسلا، آینده این شرکت را روی هوش مصنوعی و روباتیک شرط بندی کرده است. ماسک به‌عنوان فردی که مرتباً ادعاهایی را مطرح می‌کند که محقق نمی‌شوند، ربات انسان‌نما Optimus را به‌طور بالقوه «بزرگ‌ترین محصول تاریخ» در جریان تماس درآمد سه‌ماهه دوم تسلا در سال 2026 توصیف کرده است. اما او همچنین اذعان کرد که ساخت یک ربات انسان نما خودگردان که قادر به انجام بسیاری از وظایف مختلف باشد، \"یکی از سخت ترین چیزها برای حل\" است و اکنون گزارش های گسترده توسط The Information عوارض متعددی را نشان داده است که تسلا در تلاش برای مقابله با آنها در حین توسعه ربات های همه منظوره و توسعه برای تولید انبوه است. بر اساس گزارش The Information، کارخانه Fremont تسلا در کالیفرنیا تولید سدان Model S و مدل X SUV را از ماه مه 2026 متوقف کرده است و این شرکت هم کارگران خط تولید و هم مهندسان را به کار بر روی Optimus تغییر داده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید محور تسلا از ساخت خودروهای برقی گرفته تا ربات های انسان نما با چالش هایی روبرو است زیرا دست های پیچیده ربات و کارمندان ناراضی از آموزش جایگزین های رباتیک خود عقب نشینی می کنند. تلاش برای افزایش تولید در حالی رخ می دهد که ایلان ماسک، مدیرعامل تسلا، آینده این شرکت را روی هوش مصنوعی و روباتیک شرط بندی کرده است."}, {"source": "Ars Technica", "title": "Your uncle’s frozen Mac says it’s infected after viewing a Google ad. Now what?", "link": "https://arstechnica.com/security/2026/09/google-ads-caught-delivering-convincing-scareware-ads-to-unsuspecting-users/", "summary": "Researchers say they recently found Google ads delivering a sophisticated tech support scam that freezes the screens of both Windows and Mac devices and displays messages urgently instructing them to phone a bogus call center. The ads were displayed all over the web, including on high-traffic maps, weather, real-estate, document-hosting, and sports sites. Users who called the number were then urged to pay hefty fees, grant remote access to their devices, or divulge personal information. From August 31 to September 14, security firm Netskope observed users from 619 customer organizations click on the malicious ads, although none of them were actually scammed because Netskope blocked the content. Roughly 62 percent of the organizations were based in the US, with Japan and Australia accounting for the Nos. 2 and 3 spots. Since the firm has visibility into only a tiny sliver of Internet activity, the number of people exposed to the ads—including those who fell victim to it—is likely much higher. Netskope tracked more than 250 Google Ads campaign IDs across at least 284 legitimate publisher sites. Read full article Comments", "date_str": "2026-09-25T19:38:59+00:00", "hash": "277e79e0c6e24a69", "title_fa": "Mac یخ زده عموی شما می گوید که پس از مشاهده آگهی Google آلوده شده است. حالا چی؟", "summary_fa": "محققان می گویند اخیراً تبلیغات گوگل را دریافته اند که یک کلاهبرداری پیشرفته از پشتیبانی فنی ارائه می دهد که صفحه نمایش دستگاه های Windows و Mac را مسدود می کند و پیام هایی را نشان می دهد که به آنها دستور می دهد فوری با یک مرکز تماس جعلی تماس بگیرند. تبلیغات در سرتاسر وب، از جمله در نقشه های پر ترافیک، آب و هوا، املاک، میزبانی اسناد و سایت های ورزشی نمایش داده می شد. سپس از کاربرانی که با این شماره تماس گرفته‌اند خواسته شد تا هزینه‌های هنگفتی بپردازند، به دستگاه‌های خود دسترسی از راه دور بدهند یا اطلاعات شخصی خود را فاش کنند. از 31 آگوست تا 14 سپتامبر، شرکت امنیتی Netskope مشاهده کرد که کاربران 619 سازمان مشتری روی تبلیغات مخرب کلیک می کردند، اگرچه هیچ یک از آنها در واقع کلاهبرداری نشدند زیرا Netskope محتوا را مسدود کرد. تقریباً 62 درصد از سازمان ها در ایالات متحده مستقر بودند و ژاپن و استرالیا رتبه های شماره 2 و 3 را به خود اختصاص دادند. از آنجایی که این شرکت تنها به بخش کوچکی از فعالیت های اینترنتی قابل مشاهده است، تعداد افرادی که در معرض تبلیغات قرار می گیرند - از جمله کسانی که قربانی آن شده اند - احتمالاً بسیار بیشتر است. Netskope بیش از 250 شناسه کمپین Google Ads را در حداقل 284 سایت ناشر قانونی ردیابی کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش محققان می گویند اخیراً تبلیغات Google را پیدا کرده اند که یک کلاهبرداری پیشرفته از پشتیبانی فنی ارائه می دهد که صفحه نمایش هر دو دستگاه Windows و Mac را مسدود می کند و پیام هایی را نشان می دهد که به آنها دستور"}, {"source": "Ars Technica", "title": "Review: The iPhone 18 Pro is Apple's coolest smartphone (but only literally)", "link": "https://arstechnica.com/apple/2026/09/review-the-iphone-18-pro-is-apples-coolest-smartphone-but-only-literally/", "summary": "As Apple's Tim Cook era draws to a close, we're seeing more experimentation with the iPhone's design than we've seen in a long time, but you wouldn't know it from the iPhone 18 Pro. This absurdly fast, full-featured handset might be eclipsed by the hype around the iPhone Duo this year, but it's still just as good as its immediate predecessor. Of course, not too much has changed since the iPhone 17 Pro. There's the new variable aperture and other camera controls for those who want to get granular with their mobile photography, a welcome addition given the iPhone's reputation for inflexibly opinionated computational photography. Beyond that, though, all the most important changes are under the hood: a new chip, better battery life, and much-improved thermals that both give the phone better sustained performance and make it cooler to the touch in many situations. Read full article Comments", "date_str": "2026-09-25T19:34:42+00:00", "hash": "57f16de326053832", "title_fa": "بررسی: آیفون 18 پرو جالب‌ترین گوشی هوشمند اپل است (اما فقط به معنای واقعی کلمه)", "summary_fa": "با نزدیک شدن به پایان دوران تیم کوک اپل، ما شاهد آزمایش‌های بیشتری در طراحی آیفون نسبت به مدت‌های طولانی هستیم، اما شما آن را از آیفون 18 پرو نمی‌دانید. این گوشی فوق‌العاده سریع و با ویژگی‌های کامل ممکن است امسال تحت تأثیر هیاهوی آیفون Duo قرار گیرد، اما هنوز هم به خوبی مدل قبلی خود است. البته از آیفون 17 پرو تغییر چندانی نکرده است. دیافراگم متغیر جدید و سایر کنترل‌های دوربین برای کسانی که می‌خواهند با عکس‌های موبایلی خود را به صورت گرانول انجام دهند، وجود دارد. اما فراتر از آن، همه مهم‌ترین تغییرات زیر کاپوت است: یک تراشه جدید، عمر باتری بهتر، و حرارت بسیار بهبود یافته که هم عملکرد پایدار بهتری به گوشی می‌دهد و هم آن را در بسیاری از موقعیت‌ها خنک‌تر می‌کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید همانطور که دوران تیم کوک اپل به پایان می رسد، ما شاهد آزمایشات بیشتری در طراحی آیفون نسبت به مدت طولانی هستیم، اما شما آن را از آیفون نمی شناسید. این گوشی فوق العاده سریع و با امکانات کامل ممکن است امسال زیر سایه هیاهوی آیفون Duo قرار گیرد، اما هنوز هم به خوبی نسل قبلی خود است. من فکر می کنم که ما شاهد تغییری برای آیفون های \"Pro\" هستیم. ممکن است آنها به یک معنا همچنان پرچمداران باشند، اما اپل حداقل در حال حاضر ایده های طراحی درخشان خود را برای محصولات جدیدی مانند iPhone Air سال گذشته یا iPhone Duo امسال حفظ کرده است."}, {"source": "Ars Technica", "title": "AI was supposed to hit new grads hard. So far, unemployment data says otherwise.", "link": "https://arstechnica.com/ai/2026/09/ai-was-supposed-to-hit-new-grads-hard-so-far-unemployment-data-says-otherwise/", "summary": "Last month, we shared word of a Stanford University study that found entry-level employment in so-called \"AI-impacted\" occupations lagging well behind that in other fields. Now, a new working paper from economics researchers at Munich's CESifo finds the opposite, arguing point blank that \"there is no evidence of any significant, widespread displacement or reduction in hiring of recent college graduates in absolute or relative levels.\" In \" The Early Impacts of AI on Employment Among Recent College Graduates ,\" researchers Robert Fairlie and Jane Wu said they decided to focus on recent graduates \"because changes in labor demand may first appear through reductions in hiring.\" As AI gets good enough to at least perform the \"relatively standardized tasks\" in many entry-level office jobs, they argue, firms could reduce new hiring for simpler roles rather than laying off more experienced long-term employees. There's some reason to believe 2026's graduating job seekers might be more at risk of AI displacement than those graduating just a year or two prior. The CESifo researchers point to a recent sharp increase in the number of firms \"replacing a large number of employee tasks with AI\" in a Census survey, as well as broad increases in AI spending per employee and ChatGPT Enterprise token use in the last 12 months. Read full article Comments", "date_str": "2026-09-25T19:11:05+00:00", "hash": "35c4f69ae4ddb161", "title_fa": "قرار بود هوش مصنوعی به فارغ التحصیلان جدید ضربه سختی بزند. تاکنون، داده های بیکاری چیز دیگری می گوید.", "summary_fa": "ماه گذشته، ما اخباری از یک مطالعه دانشگاه استنفورد را به اشتراک گذاشتیم که نشان می‌داد اشتغال سطح پایه در مشاغلی به اصطلاح «متأثر از هوش مصنوعی» بسیار عقب‌تر از سایر زمینه‌ها است. اکنون، یک مقاله کاری جدید از محققان اقتصاد در CESifo مونیخ، خلاف این را می‌یابد و استدلال می‌کند که «هیچ مدرکی دال بر جابه‌جایی گسترده و گسترده یا کاهش استخدام فارغ‌التحصیلان اخیر کالج در سطوح مطلق یا نسبی وجود ندارد». محققین رابرت فیرلی و جین وو در کتاب «تأثیر اولیه هوش مصنوعی بر اشتغال در میان فارغ‌التحصیلان اخیر کالج» گفتند که تصمیم گرفتند بر فارغ‌التحصیلان اخیر تمرکز کنند «زیرا تغییرات در تقاضای نیروی کار ممکن است ابتدا از طریق کاهش استخدام ظاهر شود.» از آنجایی که هوش مصنوعی به اندازه کافی خوب می شود تا حداقل \"وظایف نسبتا استاندارد شده\" را در بسیاری از مشاغل اداری سطح پایه انجام دهد، آنها استدلال می کنند، شرکت ها می توانند استخدام های جدید را برای نقش های ساده تر به جای اخراج کارمندان با تجربه تر طولانی مدت کاهش دهند. دلایلی وجود دارد که باور کنیم جویندگان کار فارغ التحصیل در سال 2026 ممکن است بیشتر از کسانی که یک یا دو سال قبل فارغ التحصیل شده اند در معرض خطر جابجایی هوش مصنوعی باشند. محققان CESifo به افزایش شدید اخیر در تعداد شرکت‌هایی که «تعداد زیادی از وظایف کارکنان را با هوش مصنوعی جایگزین می‌کنند» در نظرسنجی سرشماری، و همچنین افزایش گسترده هزینه‌های هوش مصنوعی به ازای هر کارمند و استفاده از توکن ChatGPT Enterprise در ۱۲ ماه گذشته اشاره می‌کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش ماه گذشته، ما کلمه ای از مطالعه دانشگاه استنفورد را به اشتراک گذاشتیم که نشان داد مشاغل"}, {"source": "Ars Technica", "title": "Paramount/WBD merger conditions give the public \"virtually nothing,\" judge is told", "link": "https://arstechnica.com/tech-policy/2026/09/paramount-wbd-merger-conditions-give-the-public-virtually-nothing-judge-is-told/", "summary": "Free speech and media advocacy groups urged a judge to block a California settlement with Paramount Skydance that would let the company finalize its $111 billion merger with Warner Bros. Discovery. Twelve states led by California sued to block the deal in July and were able to delay it when US District Judge Araceli Martínez-Olguín ruled that Paramount combining with Warner Bros. would likely reduce competition substantially and violate antitrust laws. Despite that initial victory, California Attorney General Rob Bonta announced a settlement with Paramount earlier this week and the other states involved in the lawsuit signed on to the deal. Martínez-Olguín must decide whether to approve the settlement. A coalition of free speech and media advocacy groups told the judge in a filing yesterday that the deal will give residents of the states that sued Paramount \"virtually nothing.\" The filing was submitted by the Committee for the First Amendment, Free Press, Freedom of the Press Foundation, Future Film Coalition, and International Documentary Association. Read full article Comments", "date_str": "2026-09-25T18:42:57+00:00", "hash": "ac16e33f2a15ddce", "title_fa": "به قاضی گفته می‌شود که شرایط ادغام پارامونت/WBD عملاً چیزی به مردم نمی‌دهد", "summary_fa": "گروه‌های حامی آزادی بیان و رسانه از قاضی خواستند تا توافق کالیفرنیا با پارامونت اسکای‌دنس را که به شرکت اجازه می‌دهد ادغام ۱۱۱ میلیارد دلاری خود را با برادران وارنر دیسکاوری نهایی کند، مسدود کند. دوازده ایالت به رهبری کالیفرنیا برای جلوگیری از این معامله در ماه ژوئیه شکایت کردند و زمانی که قاضی منطقه ای ایالات متحده آراسلی مارتینز-اولگوین حکم داد که شرکت پارامونت با برادران وارنر احتمالاً رقابت را به میزان قابل توجهی کاهش می دهد و قوانین ضد تراست را نقض می کند، توانستند آن را به تعویق بیاندازند. علیرغم این پیروزی اولیه، راب بونتا، دادستان کل کالیفرنیا، در اوایل این هفته از توافق با پارامونت خبر داد و سایر ایالت‌های دخیل در این دعوی، قرارداد را امضا کردند. Martínez-Olguín باید تصمیم بگیرد که آیا توافقنامه را تأیید کند یا خیر. ائتلافی از گروه‌های حامی آزادی بیان و رسانه‌ها روز گذشته در پرونده‌ای به قاضی گفت که این معامله به ساکنان ایالت‌هایی که از پارامونت شکایت کرده‌اند «تقریباً چیزی» نمی‌دهد. این پرونده توسط کمیته اصلاحیه اول، مطبوعات آزاد، بنیاد آزادی مطبوعات، ائتلاف فیلم آینده و انجمن بین المللی مستند ارائه شده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش بیان آزاد و گروه های مدافع رسانه از یک قاضی خواستند توافق کالیفرنیا را با پارامونت اسکای دنس که به شرکت اجازه می دهد ادغام 111 میلیارد دلاری خود را با Warner Bros Discovery نهایی کند، مسدود کند. در این پرونده آمده است که بونتا \"علناً از اقدامات رفتاری که طرفین اکنون از دادگاه می خواهند تا تایید کند، انتقاد کرد.\" این اشاره ای است به Bonta که گفته است شرایط ادغام پیشنهادی مانند تعهد پارامونت برای اکران 30 فیلم در سال \"معمولاً به روشی که ما دوست"}, {"source": "Ars Technica", "title": "Is solar's growth finally slowing in the US?", "link": "https://arstechnica.com/science/2026/09/is-solars-growth-finally-slowing-in-the-us/", "summary": "Normally, we try to update you quarterly on what's going on with the US electric grid since it provides a nice view of developing trends and smooths out some month-to-month randomness. Unfortunately, I was out of the office when last month's data was released, so this will be a seven-month update on 2026 trends. The top line item is that energy use is continuing to rise, albeit not as quickly as headlines about data centers might lead people to believe. Beyond data centers, there's a growing electrification—things like EVs and heat pumps—that is shifting energy demands onto the grid. Despite all of this, electricity use has risen by only 2 percent compared to the same period last year. At this time the previous year, demand had risen by 3 percent compared to the year prior. Some of this may be due to continued improvements in efficiency, which had largely kept electricity demand stable throughout the early 2000s. And some of it may be because more data centers are generating their own power so that demand doesn't show up on the grid. So far, the growth in demand hasn't reached apocalyptic levels. Read full article Comments", "date_str": "2026-09-25T18:27:18+00:00", "hash": "e288e3f5b137e22d", "title_fa": "آیا رشد خورشیدی بالاخره در ایالات متحده کند می شود؟", "summary_fa": "به طور معمول، ما سعی می کنیم هر سه ماه شما را در مورد آنچه در شبکه برق ایالات متحده می گذرد به روزرسانی کنیم، زیرا نمای خوبی از روندهای در حال توسعه ارائه می دهد و برخی از تصادفی بودن ماه به ماه را هموار می کند. متأسفانه، زمانی که داده های ماه گذشته منتشر شد، من خارج از دفتر بودم، بنابراین این یک به روز رسانی هفت ماهه در روندهای سال 2026 خواهد بود. نکته اصلی این است که مصرف انرژی همچنان در حال افزایش است، البته نه به آن سرعتی که عناوین مربوط به مراکز داده ممکن است مردم را باور کنند. فراتر از مراکز داده، برق رسانی رو به رشدی وجود دارد - چیزهایی مانند خودروهای الکتریکی و پمپ های حرارتی - که تقاضای انرژی را به شبکه منتقل می کند. با تمام این اوصاف مصرف برق نسبت به مدت مشابه سال گذشته تنها 2 درصد افزایش یافته است. در این زمان در سال گذشته تقاضا نسبت به سال قبل 3 درصد افزایش یافته بود. برخی از این ممکن است به دلیل بهبود مستمر در بهره وری باشد که تا حد زیادی تقاضای برق را در اوایل دهه 2000 ثابت نگه داشته است. و برخی از آن ممکن است به این دلیل باشد که مراکز داده بیشتری در حال تولید برق خود هستند تا تقاضا در شبکه نمایش داده نشود. تاکنون رشد تقاضا به سطوح آخرالزمانی نرسیده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید به طور معمول، ما سعی می کنیم هر سه ماه شما را در مورد آنچه در شبکه برق ایالات متحده می گذرد به روزرسانی کنیم زیرا نمای خوبی از روندهای در حال توسعه ارائه می دهد و برخی"}, {"source": "Ars Technica", "title": "Microsoft stops insisting you need a \"Copilot+ PC\"", "link": "https://arstechnica.com/gadgets/2026/09/microsoft-stops-insisting-you-need-a-copilot-pc/", "summary": "Since 2024 , Microsoft has tried to sell “Copilot+ PC.” The marketing initiative was aimed at making it easy for people to know which Windows systems were approved to run AI-accelerated workloads locally. But Copilot+ PC branding is nowhere to be found on the new Surface PCs Microsoft announced this week. Speaking with Windows Central , Brett Ostrum, corporate VP of Surface, said that the new Surface computers “are not called Copilot+ PCs” despite meeting the label’s requirements. Read full article Comments", "date_str": "2026-09-25T17:57:37+00:00", "hash": "e5b214902eb88fcf", "title_fa": "مایکروسافت اصرار نمی کند که شما به یک \"Copilot+ PC\" نیاز دارید", "summary_fa": "از سال 2024، مایکروسافت سعی کرده است \"Copilot+ PC\" را بفروشد. هدف ابتکار بازاریابی این بود که مردم بدانند کدام سیستم‌های ویندوز برای اجرای بارهای کاری شتاب‌دهی شده با هوش مصنوعی به صورت محلی تأیید شده‌اند. اما نام تجاری رایانه‌های شخصی Copilot+ در رایانه‌های شخصی سرفیس جدیدی که مایکروسافت این هفته معرفی کرد، یافت نمی‌شود. برت اوستروم، معاون شرکت سرفیس، در صحبت با Windows Central، گفت که رایانه‌های سرفیس جدید علیرغم برآورده کردن الزامات برچسب، «کامپیوترهای Copilot+ نامیده نمی‌شوند». مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش از سال 2024، مایکروسافت سعی کرده است \"Copilot+ PC\" را بفروشد. هدف ابتکار بازاریابی این بود که مردم بدانند کدام سیستم‌های ویندوز برای اجرای بارهای کاری شتاب‌دهی شده با هوش مصنوعی به صورت محلی تأیید شده‌اند. آنها تمام الزامات نوار قبلی ما را برای دستگاه های Copilot+ برآورده می کنند. ما همچنان به روایت حول هوش مصنوعی در لبه و توانایی داشتن یک راه‌حل هیبریدی متمایل هستیم.» رایانه‌های شخصی Copilot+ به 16 گیگابایت رم، 256 گیگابایت فضای ذخیره‌سازی و یک واحد پردازش عصبی یکپارچه (NPU) با عملکرد 40 تریلیون عملیات در ثانیه (TOPS) یا بهتر نیاز دارند. 13 اینچی (نسخه دوم) که در 13 اکتبر عرضه می شود، هر دو پردازنده Qualcomm Snapdragon X2 Plus را اجرا می کنند و دارای NPU Qualcomm Hexagon با 80 TOPS هستند. Kedar Kondap، معاون محاسباتی Qualcomm، به Windows Central گفت: «هدف رایانه‌های شخصی Copilot+ این بود که بتوانند تجربه [NPU] را ارائه دهند. بنابراین، این بود که دسته خاصی از دستگاه‌ها را با یک نوار و متریک خاص تعریف کنیم، مثلاً یک NPU 45 TOPS. … بنابراین از این منظر، بیشتر همان تجربیات را ارائه می‌کند، احتمالاً بدون استفاده از اصطلاحات [Copilot+ PC]."}, {"source": "Ars Technica", "title": "After seven years, a spacecraft company is releasing its Otters into the wild", "link": "https://arstechnica.com/space/2026/09/after-seven-years-a-spacecraft-company-is-releasing-its-otters-into-the-wild/", "summary": "Imagine starting a space company in October 2019 with the aim of changing the world. Then, a few months later, a global pandemic shuts the world down. \"Little did we know what the world had in store for us,\" said Trevor Bennett, an engineer who co-founded Starfish Space after a few years at Blue Origin. \"But that's kind of become part of our story, showing some resilience along the way.\" At Blue Origin, he saw, up close, the ambitions of billionaires to build big rockets and put massive numbers of satellites into orbit. Bennett and his co-founder, another engineer from Blue Origin named Austin Link, began to think about the implications. How would humanity deal with that increased volume of satellites in orbit? Could low-Earth orbit be preserved? Read full article Comments", "date_str": "2026-09-25T15:35:23+00:00", "hash": "a8ba0860425125ea", "title_fa": "پس از هفت سال، یک شرکت فضاپیما در حال رهاسازی سمورهای خود در طبیعت است", "summary_fa": "تصور کنید در اکتبر 2019 یک شرکت فضایی را با هدف تغییر جهان راه اندازی کنید. سپس، چند ماه بعد، یک بیماری همه گیر جهانی، جهان را تعطیل می کند. تروور بنت، مهندسي كه پس از چند سال در بلو اوريجين، شركت Starfish Space را بنيانگذاري كرد، مي گويد: «ما نمي دانستيم كه دنيا چه چيزي براي ما در نظر گرفته است. اما این به نوعی تبدیل به بخشی از داستان ما شد و در طول مسیر کمی انعطاف پذیری را نشان داد. در Blue Origin، او از نزدیک، جاه طلبی های میلیاردرها را برای ساخت موشک های بزرگ و قرار دادن تعداد زیادی ماهواره در مدار دید. بنت و هم بنیانگذارش، مهندس دیگری از شرکت Blue Origin به نام آستین لینک، شروع به فکر کردن در مورد پیامدهای آن کردند. چگونه بشریت با حجم افزایش یافته ماهواره ها در مدار برخورد می کند؟ آیا می توان مدار پایین زمین را حفظ کرد؟ مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای ناوبری به حداقل برسانید تصور کنید در اکتبر 2019 یک شرکت فضایی را با هدف تغییر جهان راه اندازی کنید. سپس، چند ماه بعد، یک بیماری همه گیر جهانی، جهان را تعطیل می کند. تروور بنت، مهندسي كه پس از چند سال در Blue Origin بنيانگذار Starfish Space بود، گفت: ما نمي دانستيم كه دنيا براي ما چه چيزي در نظر گرفته است. \"اما این به نوعی تبدیل به بخشی از داستان ما شده است، و در طول مسیر کمی انعطاف پذیری را نشان می دهد.\" ایده هایی مانند استخراج سیارک یا ساخت زیرساخت در ماه در آن زمان کمی دور از دسترس به نظر می رسید، اما بهبود توانایی حرکت در فضا، حذف تهدیدات و افزایش عمر دارایی های موجود"}, {"source": "Ars Technica", "title": "US being left behind in EV charging speeds as China goes sub-5 min to 70%", "link": "https://arstechnica.com/cars/2026/09/us-being-left-behind-in-ev-charging-speeds-as-china-goes-sub-5-min-to-70/", "summary": "Hype merchants have a habit of overdoing it , but there’s no denying that China is making the US look more than a little antiquated when it comes to electric vehicles. Some of that is due to a deep integration of connected services and an extension of the car as part of the owner’s digital life—think additional infotainment screens and AI personal assistants, but with an Android phone-maker’s cadence of updates rather than that of a traditional car company. Other advances sound more appealing. China’s OEMs are in a battle over who can charge the fastest, and this week, Geely fired its latest salvo. China might have a much younger driving culture than North America or Europe, but it has still been long enough to condition those drivers to how long it takes to fill a tank of gas. For all their many improvements over internal combustion engine vehicles—far greater efficiency, instant torque, very little NVH, more reliabiity, and so on—EVs do still take longer to recharge than it takes to refuel a car with a liquid. At least until now, it seems. Read full article Comments", "date_str": "2026-09-25T15:21:55+00:00", "hash": "53bf34224693c9e8", "title_fa": "ایالات متحده در سرعت شارژ خودروهای الکتریکی عقب مانده است زیرا چین زیر 5 دقیقه به 70 درصد رسیده است.", "summary_fa": "تاجران تبلیغاتی عادت دارند در این کار زیاده روی کنند، اما نمی توان انکار کرد که چین در مورد خودروهای الکتریکی، ایالات متحده را بیش از کمی کهنه جلوه می دهد. برخی از آن‌ها به دلیل یکپارچگی عمیق سرویس‌های متصل و گسترش خودرو به عنوان بخشی از زندگی دیجیتالی مالک است-صفحه‌های سرگرمی اضافی و دستیارهای شخصی هوش مصنوعی را در نظر بگیرید، اما با آهنگ به‌روزرسانی‌های یک سازنده تلفن اندرویدی به جای یک شرکت خودروسازی سنتی. پیشرفت های دیگر جذاب تر به نظر می رسند. سازندگان OEM چین در حال نبرد بر سر اینکه چه کسی می‌تواند سریع‌ترین شارژ را داشته باشد، هستند و این هفته، جیلی جدیدترین سلاح خود را اجرا کرد. چین ممکن است فرهنگ رانندگی بسیار جوان تری نسبت به آمریکای شمالی یا اروپا داشته باشد، اما هنوز به اندازه کافی طولانی است تا آن رانندگان را به مدت زمانی که برای پر کردن یک باک بنزین نیاز است، مشروط کند. با وجود همه پیشرفت‌های فراوانی که نسبت به وسایل نقلیه موتور احتراق داخلی دارند - راندمان بسیار بیشتر، گشتاور فوری، NVH بسیار کم، قابلیت اطمینان بیشتر و غیره - هنوز شارژ مجدد خودروهای الکتریکی بیشتر از سوخت‌گیری یک خودرو با مایع طول می‌کشد. حداقل تا الان به نظر می رسد. مقاله کامل را بخوانید نظرات تنظیمات متن  شوخی می آورند، برخی مشروب می آورند تا در امان باشند، و برخی از هدایا برای شما مانند زباله و برای دیگران جواهرات به نظر می رسد. برخی از هدایای مورد علاقه من از فیل سفید شامل یک لیوان قهوه جوشی، یک مجموعه لگو سرگرم کننده و آهنرباهای سوشی شکل است. در اینجا هر هدیه فیل سفیدی است که توصیه می‌کنم همراه داشته باشید، از عجیب و غریب گرفته تا خنک تا واقعا مفید. به دنبال ایده های بیشتر برای هدیه هستید؟ با فرا رسیدن فصل تعطیلات، سایر راهنمای هدایای عالی ما را از دست ندهید."}, {"source": "Wired", "title": "Best Mesh Wi-Fi Systems (2026): I Tested Them All", "link": "https://www.wired.com/story/best-mesh-wifi-routers/", "summary": "Forget about patchy internet connections and dead spots in the house. These WIRED-tested, multi-room mesh Wi-Fi systems will keep your whole house online.", "date_str": "2026-09-26T11:00:00+00:00", "hash": "4f3217993bb07cba", "title_fa": "بهترین سیستم‌های Wi-Fi مش (2026): همه آنها را آزمایش کردم", "summary_fa": "اتصالات ناهموار اینترنت و نقاط مرده در خانه را فراموش کنید. این سیستم‌های Wi-Fi مش چند اتاقه تست‌شده با سیم، کل خانه شما را آنلاین نگه می‌دارند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان روترها به ندرت در یک نقطه ایده آل قرار می گیرند. چه آنها را در کمد قرار دهید و چه در زیر تخت خود قرار دهید، مکان برای پخش اینترنت مطمئن و سریع در کل خانه شما کمتر از حد مطلوب است. روترهای مش قول می دهند که پوشش Wi-Fi را گسترش دهند و به شما امکان می دهند یک گره دوم یا سوم را در هر کجا که نیاز دارید قرار دهید و آنها به عنوان یک شبکه Wi-Fi یکپارچه ظاهر می شوند. دستگاه های شما به طور خودکار به نزدیک ترین گزینه برای بهترین سرعت متصل می شوند. چه بخواهید مناطق مرده را تعمیر کنید، چه بخواهید بافر را در اتاق خواب پشتی متوقف کنید، یا از Wi-Fi مناسب در حیاط خلوت استفاده کنید، یک سیستم Wi-Fi مشبک می تواند پاسخگو باشد. Netgear Orbi 770 Series بهترین سیستم وای فای مش برای اکثر افراد است، اما من گزینه های زیادی برای مناسب برای خانه های مختلف و اتصالات اینترنتی دارم. توجه: ممنوعیت روترهای ساخت خارجی FCC که در ماه مارس اعلام شد، ممکن است هر شرکت  این است که چرا یک محصول برای بزرگسالان - Muse محدود به افراد بالای 18 سال است - دقیقاً مانند یک اسباب بازی کودکانه با طراحی خوب به نظر می رسد. دنیل رابرتز سخنگوی متا به WIRED می گوید: \"این داستانی است در جستجوی یک داستان. مردم می خواهند بتوانند آواتار خود را با شخصیت و سبک منحصر به فرد بسازند، زیرا سرگرم کننده است و آنها را شاد می کند. ما از همه افرادی که از برنامه Muse استفاده می‌کنند می‌خواهیم تاریخ تولد خود را ارائه دهند، افرادی که تشخیص می‌دهیم ممکن است"}, {"source": "Wired", "title": "This Browser Extension Lets You Snooze Open Tabs Until Later", "link": "https://www.wired.com/story/tuck-browser-extension-lets-you-snooze-open-tabs-until-later/", "summary": "The free add-on Tuck brings one of the best features of modern email—the ability to hide something for a bit—to that tangle of tabs in your browser.", "date_str": "2026-09-26T10:00:00+00:00", "hash": "5f7d30cab8ece960", "title_fa": "این برنامه افزودنی مرورگر به شما امکان می‌دهد تا باز کردن برگه‌ها را تا بعد به تعویق بیندازید", "summary_fa": "افزونه رایگان Tuck یکی از بهترین ویژگی‌های ایمیل مدرن - توانایی پنهان کردن چیزی را برای مقداری - به آن دسته از برگه‌ها در مرورگر شما می‌آورد. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان برگه ها بهترین هستند. آنها همچنین بدترین هستند. گاهی اوقات در برگه‌های مرورگر حاوی صفحات وبی که به خاطر ندارم باز کرده‌ام غرق می‌شوم، و گاهی اوقات چند برگه دارم که می‌خواهم آنها را ببندم، اما نمی‌توانم، زیرا می‌دانم بعداً به آنها نیاز خواهم داشت. Tuck یک افزونه مرورگر کاملا رایگان برای همه مرورگرهای اصلی است که به این امر کمک می کند. می‌دانید چگونه در Gmail می‌توانید یک ایمیل را به تعویق بیندازید تا از صندوق ورودی‌تان پنهان بماند؟ این مانند آن است، اما برای برگه های مرورگر شما. Tuck همچنین می‌تواند برگه‌های غیرفعال را پس از مدت زمان مشخصی به‌طور خودکار ببندد و آنها را در فهرستی ذخیره کند تا بتوانید در صورت نیاز دوباره آنها را باز کنید. پس از نصب برنامه افزودنی، نماد - یک جغد پیچیده شده در یک پتو - را در نوار مرورگر خود خواهید دید. روی آن کلیک کنید و گزی auren Kwan، سخنگوی شرکت می گوید: «PlusAI از بارهای شبیه سازی شده در تریلرهای خود برای کمک به آزمایش های تحقیق و توسعه استفاده می کند. تریلرها با \"40000 پوند ماسه دست نخورده\" کشف شدند. کوان می‌گوید، کابین‌های کامیون پلاس‌AI با فناوری - جایی که راننده معمولاً می‌نشیند و وسیله نقلیه را کنترل می‌کند - در داخل انبار آن پارک شده بودند و برده نشدند. تریلرها با قفل های دستی ایمن شده بودند که شکسته بودند. امی گی، سخنگوی اداره پلیس فرمونت می گوید که این پرونده در دست بررسی است و هیچ دستگیری صورت نگرفته"}, {"source": "Wired", "title": "Appeals Court Lets the Pentagon Designate Anthropic a Supply-Chain Risk", "link": "https://www.wired.com/story/appeals-court-lets-the-pentagon-designate-anthropic-a-supply-chain-risk/", "summary": "The AI lab had argued multiple violations of its rights, but a divided panel of judges sided with the Trump administration.", "date_str": "2026-09-25T16:58:20+00:00", "hash": "a4c2faa0a99fcd52", "title_fa": "دادگاه استیناف به پنتاگون اجازه می دهد Anthropic را به عنوان یک خطر زنجیره تامین معرفی کند", "summary_fa": "آزمایشگاه هوش مصنوعی چندین بار نقض حقوق خود را مورد بحث قرار داده بود، اما گروهی متشکل از قضات در کنار دولت ترامپ بودند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Anthropic در نبرد حقوقی برای لغو یکی از برچسب‌های ریسک زنجیره تامین که وزارت دفاع ایالات متحده به این شرکت زده بود، شکست خورد، زیرا دادگاه تجدیدنظر فدرال در دی سی روز جمعه از حدس دوم دولت ترامپ خودداری کرد. قضات در اکثریت نظر خود نوشتند: \"دپارتمان از این نتیجه گیری که ادامه ادغام کلود در سیستم های اطلاعاتی دپارتمان، توسط دپارتمان یا پیمانکاران آن، از نظر قانونی یک خطر امنیتی ملی را ایجاد می کند، حمایت زیادی داشت.\" همانطور که آنتروپیک اعتراف می کند، این شرکت محدودیت هایی را برای کلود کدگذاری می کند که مدل را از انجام وظایفی که آنتروپیک می خواهد جلوگیری کند، باز می دارد. دانیل کوهن، سخنگوی آنتروپیک می گوید که این شرکت به موقعیت خود اطمینان دارد و در حال بررسی همه گزینه ها است. این می تواند شامل درخواست تجدید نظر به هیئت گسترده تری از دادگاه استیناف ر اعماق اقیانوس با محدودیت‌های زیادی همراه است. دمای پایین، فشار بسیار زیاد و کمبود غذا باعث می‌شود هر فرصتی برای صرفه‌جویی در انرژی اهمیت داشته باشد. برای جانوران کوچک، پیداکردن جفت هم دشوار است؛ زیرا فضای زندگی آن‌ها بسیار گسترده و جمعیت‌ها پراکنده‌اند. گونه‌ی مزوپلئوستس ابی‌سوروم (Mesopleustes abyssorum) که در مطالعه دیده شد، از این نظر معمای جالبی برای زیست‌شناسان است. این جانور توانایی شنای زیادی ندارد و برخلاف بسیاری از جانداران دریایی، مرحله‌ی لاروی شناور ندارد تا جریان‌های اقیانوسی آن را به مناطق دور منتقل کنند. بااین‌حال، این گونه در اقیانوس‌های آرام، اطلس، هند و جنوبی مشاهده شده و در عمق حدود ۶۹۰ تا ۳۵۰۰ متر زندگی می‌کند. حیات در ژرف‌ترین گودال‌های زمین؛ کشف اکوسیستمی پیچیده در عمق ۹۵۰۰ متری اقیانوس 11 مرداد 04 مطالعه &#x27; 2 با ۳۲ موجود زنده عجیب در اعماق دریا آشنا شوید 29 شهریور 03 مطالعه &#x27; 25 پژوهشگران مدت‌ها نمی‌دانستند چنین جانور کوچکی چگونه توانسته این محدوده‌ی گسترده را اشغال کند؛ اما اکنون احتمال می‌دهند سوارشدن بر جانداران"}, {"source": "Zoomit", "title": "شکایت تازه از سامسونگ؛ غول کره‌ای به نقض پتنت متهم شد", "link": "https://www.zoomit.ir/tech/467849-samsung-galaxy-connectivity-patent-lawsuit/", "summary": "سامسونگ به نقض ۵ پتنت ارتباطی در محصولات محبوبی مانند Galaxy S23 Ultra و Galaxy Watch Ultra متهم شد.", "date_str": "2026-09-25T19:00:00+00:00", "hash": "73a9f86e62f6a593", "title_fa": "شکایت تازه از سامسونگ؛ غول کره‌ای به نقض پتنت متهم شد", "summary_fa": "سامسونگ به نقض ۵ پتنت ارتباطی در محصولات محبوبی مانند Galaxy S23 Ultra و Galaxy Watch Ultra متهم شد. تبلیغات سامسونگ در دادگاه منطقه‌ای شرق تگزاس با یک پرونده‌ی حقوقی جدید در حوزه‌ی مالکیت فکری روبه‌رو شده است. شرکت آمریکایی IOENGINE با طرح این دادخواست مدعی شد که غول سامسونگ پنج پتنت مربوط به فناوری‌های ارتباطی را بدون مجوز و پرداخت حق‌امتیاز به کار می‌برد. پتنت‌های مورد بحث به معماری ارتباطی امن میان دستگاه‌های همراه مانند ساعت‌های هوشمند یا هدفون‌های بی‌سیم و دستگاه‌های میزبان نظیر گوشی‌ها، تبلت‌ها و کامپیوترها مربوط می‌شوند. شاکی ادعا می کند که سامسونگ این سازوکارها را در شماری از ، کسی که برای شروع هر کاری منتظر انگیزه می‌ماند، هر روز انرژی روانی‌اش را برای تصمیم‌گیری هدر می‌دهد. درحالی‌که کارهایی مثل مسواک‌زدن یا بستن کمربند ایمنی، هیچ نیازی به اراده‌ی پولادین ندارند؛ ما با ظاهرشدن نشانه‌ای آشنا، تقریباً خودکار این کارها را انجام می‌دهیم. مطالعات روان‌شناسی به ما پیشنهاد می‌دهند به‌جای اینکه تلاش کنیم به انسانی با اراده‌ی فوق‌العاده تبدیل شویم، شرایطی فراهم کنیم که نشستن پای کتاب، به پاسخ همیشگی و خودکار ما در برابر یک نشانه‌ی مشخص تبدیل شود. کپی لینک نقطه‌ی صفر عادت؛ چرا هدف‌گذاری‌های رایج جواب نمی‌دهند؟ بیشتر توصیه‌هایی که درباره‌ی مطالعه می‌شنویم، روی خط پایان تمرکز دارند: «روزی دو ساعت درس بخوان» یا «تعداد مشخصی صفحه جلو برو». این هدف‌گذاری‌ها از نتیجه حرف می‌زنند ولی ایده‌ای از نقطه‌ی شروع به ما نمی‌دهند؛ درحالی‌که عادت واقعاً از نقطه‌ی صفر آغاز می‌شود. وقتی کاری را بارها در موقعیتی مشابه انجام می‌دهید، مغزتان به‌تدریج آن موقعیت را به کار بعدی پیوند می‌زند. زمان، مکان یا رویدادی روزمره نقش «نشانه» را پیدا می‌کند و با تکرار، وقتی همان نشانه را می‌بینید، میل شروع‌کردن در شما"}, {"source": "Zoomit", "title": "اینترنت گیگابیتی استارلینک به دریاها می‌رسد", "link": "https://www.zoomit.ir/internet-network/467881-starlink-gigabit-speed-maritime-v3-satellites/", "summary": "اسپیس‌ایکس با پرتاب ماهواره‌های جدید، سرعت اینترنت کاربران دریایی استارلینک را تا پایان سال به مرز یک گیگابیت‌بر‌ثانیه می‌رساند.", "date_str": "2026-09-25T18:17:11+00:00", "hash": "c9e102799ea40ae1", "title_fa": "اینترنت گیگابیتی استارلینک به دریاها می‌رسد", "summary_fa": "اسپیس‌ایکس با پرتاب ماهواره‌های جدید، سرعت اینترنت کاربران دریایی استارلینک را تا پایان سال به مرز یک گیگابیت‌بر‌ثانیه می‌رساند. تبلیغات اسپیس‌ایکس به گروهی از مشترکان سازمانی خود در بخش دریانوردی اعلام کرده است که تا ماه دسامبر (آذر و دی) سرعت اینترنت گیگابیتی دریافت خواهند کرد. گام تازه در بهبود عملکرد شبکه با تکیه بر پرتاب نسل جدید ماهواره‌های V3 برداشته می‌شود و ظرفیت تبادل داده روی پهنه‌ی دریاها را به شکل چشمگیری افزایش می‌دهد. بر اساس گفته‌ی تیم بلفال ، مدیر مجموعه‌ی Westend WiFi در بریتانیا، پهنای باند برای مشتریان دریایی دارنده‌ی بسته‌ی سخت‌افزاری ۲٬۰۰۰ دلاری Performance Gen 3 تا پیش از پایان ماه دسامبر دوبرابر خواهد شد. هنگام معرفی این دیش در سال گذشته، اسپیس‌ایکس وعده‌ی دستیابی به سرعت‌های گیگابیتی را در افق سال ۲۰۲۶ داده بود. درحال‌حاضر حداکثر توان عملیاتی دریافت داده در دیش نسل سوم ۴۷۵ مگابیت‌برثانیه و نرخ آپلود ۷۵ مگابیت‌بر‌ثانیه ثبت شده که با دوبرابر شدن این ظرفیت، سرعت دانلود به حدود ۹۵۰ مگابیت‌بر‌ثانیه خواهد رسید. ارتقاء پهنای باند برای سایر خدمات سازمانی استارلینک در سال ۲۰۲۷ عملیاتی می‌شود. مبنای فنی این جهش به نخستین پرتاب ۲۶ ماهواره‌ی نسل جدید V3 به مدار عملیاتی با فضاپیمای سنگین استارشیپ بازمی‌گردد. پرتابگر غول‌پیکر استارشیپ در برنامه‌ی نهایی برای حمل هم‌زمان حدود ۶۰ ماهواره‌ی V3 در هر مأموریت طراحی شده است. پیام ارسالی به مشتریان تجاری با اظهارات قبلی ایلان ماسک تفاوت‌هایی دارد، زیرا او رسیدن به ظرفیت مناسب ماهواره‌های V3 را منوط به استقرار دست‌کم ۱٬۰۰۰ ماهواره در مدار تا سه‌ماهه‌ی دوم سال آینده دانسته بود. با وجود این، شواهد نشان می‌دهد که تیم فنی تصمیم دارد بهره‌برداری زودهنگام از قابلیت‌های نسل تازه را برای بخش محدودی از شناورها آغاز کند. طبق داده‌های رسمی اسپیس‌ایکس، هر ماهواره‌ی V3 نسبت به ماهواره‌های V2 حدود ۱۰ برابر ظرفیت دانلود و نزدیک به ۲۲ برابر ظرفیت آپلود بیشتری فراهم"}, {"source": "Zoomit", "title": "چرا موهای بور بعضی کودکان به مرور زمان تیره‌تر می‌شود؟", "link": "https://www.zoomit.ir/biology/467576-why-blonde-hair-darkens-with-age/", "summary": "تغییرات هورمونی به‌ویژه در دوران بلوغ با افزایش تولید رنگدانه یوملانین و براساس ژنتیک، موجب تیره شدن موهای بور در طول رشد می‌شود.", "date_str": "2026-09-25T17:55:00+00:00", "hash": "0edf843f3efaf30d", "title_fa": "چرا موهای بور بعضی کودکان به مرور زمان تیره‌تر می‌شود؟", "summary_fa": "تغییرات هورمونی به‌ویژه در دوران بلوغ با افزایش تولید رنگدانه یوملانین و براساس ژنتیک، موجب تیره شدن موهای بور در طول رشد می‌شود. تبلیغات بسیاری از کودکانی که با موهای بور روشن به دنیا می‌آیند، در سال‌های بعد شاهد تغییر رنگ موهایشان هستند. موهایی که در کودکی تقریباً طلایی یا سفید به نظر می‌رسند، ممکن است در دوران نوجوانی و بزرگسالی به تدریج به رنگ‌های قهوه‌ای روشن، قهوه‌ای تیره یا حتی مشکی نزدیک شوند. این تغییر واقعی است و فقط به دلیل تفاوت نور یا تصور افراد اتفاق نمی‌افتد. اما چرا چنین اتفاقی رخ می‌دهد؟ پاسخ کوتاه این است که رنگ مو نتیجه تعامل پیچیده میان ژن‌ها، سلول‌های تولیدکننده رنگدانه و تغییرات هورمونی بدن است. پژوهشگران بسیاری از ژن‌های مؤثر در رنگ مو را شناسایی کرده‌اند، اما هنوز دقیقاً نمی‌دانند چرا برخی کودکان بور در طول رشد موهایشان تیره می‌شود، در حالی که برخی دیگر تا پایان عمر همان رنگ روشن را حفظ می‌کنند. دزموند توبین، استاد علوم پوست در دانشگاه کالج دوبلین، می‌گوید این تفاوت تا حد زیادی به میراث ژنتیکی افراد مربوط است. رنگ مو از ماده‌ای به نام ملانین به دست می‌آید که توسط سلول‌های تخصصی به نام ملانوسیت در فولیکول مو ساخته می‌شود. دو نوع اصلی ملانین وجود دارد: یوملانین که مسئول ایجاد رنگ‌های قهوه‌ای و مشکی است و فئوملانین که رنگ‌های زرد و قرمز را ایجاد می‌کند. مقدار و نسبت این دو نوع رنگدانه تعیین می‌کند تار مویی که از فولیکول رشد می‌کند چه رنگی داشته باشد. به طور کلی، هرچه تولید یوملانین بیشتر باشد، مو تیره‌تر دیده می‌شود. برای مثال، برخی تغییرات هورمونی در بدن می‌توانند تولید یوملانین را افزایش دهند. در دوران بارداری، افزایش سطح هورمون‌هایی مانند استروژن و پروژسترون در بعضی افراد باعث تیره‌تر شدن موها می‌شود. برای بسیاری از کودکان بور، اصلی‌ترین دوره تغییر رنگ مو در زمان بلوغ رخ می‌دهد"}, {"source": "Zoomit", "title": "عضو تازه‌نفس بازار؛ گوشی اقتصادی «میوی وان» در رنگ‌های سرزنده رونمایی شد", "link": "https://www.zoomit.ir/mobile/467855-mivi-one-5g-smartphone-launched/", "summary": "برند هندی میوی با معرفی گوشی اقتصادی Mivi One 5G رسما وارد بازار گوشی‌های هوشمند شد.", "date_str": "2026-09-25T17:45:00+00:00", "hash": "1351f5e83fa70dd5", "title_fa": "عضو تازه‌نفس بازار؛ گوشی اقتصادی «میوی وان» در رنگ‌های سرزنده رونمایی شد", "summary_fa": "برند هندی میوی با معرفی گوشی اقتصادی Mivi One 5G رسما وارد بازار گوشی‌های هوشمند شد. تبلیغات برند هندی میوی (Mivi) که بیش از هر چیز به‌دلیل تولید لوازم صوتی شناخته می‌شود، با رونمایی از میوی وان نخستین گام خود را برای حضور در بازار رقابتی موبایل برداشت. گوشی اقتصادی جدید به نمایشگر ۶٫۷۵ اینچی LCD با نرخ نوسازی ۹۰ هرتز و وضوح تصویر +HD مجهز است. توان پردازشی دستگاه را پردازنده‌ی Snapdragon 4 Gen 2 تامین می‌کند و کاربران امکان انتخاب رم LPDDR4X تا ظرفیت ۸ گیگابایت را در کنار ۱۲۸ گیگابایت قضای ذخیره‌سازی UFS 2.2 خواهند داشت. شیار اختصاصی کارت حافظه‌ی microSD نیز در طراحی گنجانده شده است تا ارتقای فضای ذخیره‌سازی ممکن باشد. بخش پشتی میزبان دوربین اصلی ۵۰ مگاپیکسلی در کنار دوربین کمکی و فلاش LED است و دوربین سلفی ۸ مگاپیکسلی وظیفه‌ی ثبت عکس‌های سلفی و تماس تصویری را برعهده دارد. تامین انرژی دستگاه بر دوش باتری ۶۰۰۰ میلی‌آمپرساعتی قرار گرفته که ظرفیتی چشمگیر برای این رده‌ی قیمتی محسوب می‌شود. گوشی جدید به‌صورت پیش‌فرض نسخه‌ی خام اندروید ۱۶ را اجرا می‌کند و به حسگر اثرانگشت روی لبه‌ی کناری، جک ۳٫۵ میلی‌متری هدفون، گواهی مقاومت در برابر گردوغبار و پاشش آب IP64، بلوتوث ۵٫۱ وای‌فای دوبانده و پورت USB Type-C مجهز است. قیمت گوشی در کانفیگ‌های مختلف به شرح زیر است: لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "گرینلند و جنوبگان در نیم‌قرن اخیر، ۱۲ تریلیون تن یخ از دست داده‌اند", "link": "https://www.zoomit.ir/energy-environment/467772-greenland-antarctica-ice-loss-sea-level/", "summary": "پژوهشی با همکاری ۵۸ دانشمند نشان می‌دهد گرینلند و جنوبگان از ۱۹۷۹ بیش از ۱۲ تریلیون تن یخ از دست داده‌اند و سطح دریاها ۳۱٫۴ میلی‌متر بالا آمده است.", "date_str": "2026-09-25T17:10:00+00:00", "hash": "2a0435fcf9809469", "title_fa": "گرینلند و جنوبگان در نیم‌قرن اخیر، ۱۲ تریلیون تن یخ از دست داده‌اند", "summary_fa": "پژوهشی با همکاری ۵۸ دانشمند نشان می‌دهد گرینلند و جنوبگان از ۱۹۷۹ بیش از ۱۲ تریلیون تن یخ از دست داده‌اند و سطح دریاها ۳۱٫۴ میلی‌متر بالا آمده است. تبلیغات بررسی تازه‌ای از داده‌های ماهواره‌ای نشان می‌دهد دو پهنه یخی بزرگ زمین، یعنی گرینلند و جنوبگان، از سال ۱۹۷۹ تاکنون بیش از ۱۲ تریلیون تن یخ از دست داده‌اند. این کاهش عظیم یخ باعث شده سطح آب دریاه
