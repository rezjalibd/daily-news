<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۱۲ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۱۲ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۳ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۴</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۲۶</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۲۴</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>
    const data = {
      persian: [{"source": "Independent Persian", "title": "هالووین در ایران؛ جشن جوانان زیر فشار ممنوعیت، پلمب و بازداشت", "link": "https://www.independentpersian.com/node/423004/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D9%87%D8%A7%D9%84%D9%88%D9%88%DB%8C%D9%86-%D8%AF%D8%B1-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86%D8%9B-%D8%AC%D8%B4%D9%86-%D8%AC%D9%88%D8%A7%D9%86%D8%A7%D9%86-%D8%B2%DB%8C%D8%B1-%D9%81%D8%B4%D8%A7%D8%B1-%D9%85%D9%85%D9%86%D9%88%D8%B9%DB%8C%D8%AA%D8%8C-%D9%BE%D9%84%D9%85%D8%A8-%D9%88-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B4%D8%AA", "summary": "برگزاری جشن هالووین در شهرهای مختلف ایران، با وجود ممنوعیت و تهدیدهای حکومتی، بار دیگر فاصلهٔ سبک زندگی نسل جوان با الگوهای مورد قبول جمهوری اسلامی ایران را آشکار کرد. انتشار گسترده تصاویر زنان و دختران با پوشش انتخابی و گریم‌های هالووینی، رقص و همخوانی جوانان در خیابان‌ها و حضور مشترک زنان و مردان با واکنش نیروهای امنیتی و برخرودهای قضایی مواجه شد و به بازداشت مردم و پلمب ده‌ها واحد صنفی انجامید. تا دوشنبه ۱۱ آبان، گزارش‌های منتشرشده از برخورد با برگزارکنندگان و کسب‌وکارها در تهران، قزوین، مشهد، یزد، مازندران، اردکان، فردیس و بهارستان حکایت دارد. همزمان، دادستان تهران برای کنترل فروش پوشاک، مسدودسازی دسترسی به پایگاه اینترنتی تورهای گردشگری و افزایش نظارت بر اماکن تفریحی دستورهای تازه‌ای صادر کرده است. رقص خیابانی در برابر باتوم تصاویر منتشرشده در شبکه‌های اجتماعی نشان می‌دهد جوانان در تهران، شیراز، مشهد و بوشهر با لباس‌ها، آرایش‌ها و نمادهای هالووین در فضاهای عمومی حضور یافتند و در میان آنان، زنان بدون حجاب اجباری هم دیده می‌شوند که با وجود تهدیدهای رسمی، پوشش و شیوهٔ حضورشان را به میل خود انتخاب کرده‌اند. در خیابان ایرانشهر تهران، این مناسبت با موسیقی خیابانی و ترانه‌های تهران قدیم پیوند خورد. ویدیوها هم رقص و همخوانی جمعی جوانان با گریم‌های هالووینی را نشان می‌دهد که ترکیبی از یک جشن با خاستگاه خارجی و موسیقی آشنای ایرانی است. بر اساس گزارش‌های رسیده به ایندیپندنت فارسی، شامگاه جمعه هشتم آبان نیروهای بسیجی و لباس‌شخصی با چوب و باتوم به محدوده ایرانشهر و پارک هنرمندان هجوم بردند، کا 53?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["بورس و طلا"], "datetime_fa": "۱۱ آبان • ۱۷:۴۵"}, {"source": "Zoomit", "title": "هوش مصنوعی کلاد حالا از مهندسی معکوس بازی‌ها جلوگیری می‌کند", "link": "https://www.zoomit.ir/ai-articles/470270-anthropic-claude-blocks-game-reverse-engineering/", "summary": "مدل‌های جدید هوش مصنوعی آنتروپیک، از جمله کلاد کد، درخواست‌های مهندسی معکوس و بازسازی بازی‌های ویدیویی را به دلایل امنیتی و حقوقی رد می‌کنند.", "date_str": "2026-11-02T14:00:00+00:00", "hash": "6f110ce37b231179", "title_fa": "هوش مصنوعی کلاد حالا از مهندسی معکوس بازی‌ها جلوگیری می‌کند", "summary_fa": "مدل‌های جدید هوش مصنوعی آنتروپیک، از جمله کلاد کد، درخواست‌های مهندسی معکوس و بازسازی بازی‌های ویدیویی را به دلایل امنیتی و حقوقی رد می‌کنند. تبلیغات مدل‌های هوش مصنوعی آنتروپیک از جمله ابزار کلاد کد و مدل Opus 5.5 روند رسیدگی به درخواست‌های مرتبط با مهندسی معکوس و بازسازی کدهای بازی‌های ویدیویی را متوقف کرده‌اند. گزارش‌های متعددی از سوی توسعه‌دهندگان نشان می‌دهد که سامانه‌های هوش مصنوعی حتی از اجرای پروژه‌های بی‌خطر با ابزارهای محبوبی مانند Reverse Engineer Anything موسوم به REA سر باز می‌زنند. شواهد حاکی از اعمال دستورالعمل‌های متنی سخت‌گیرانه‌ای است که مدل را صراحتا از بازآفرینی بازی‌های موجود منع می‌کند. پلتفرم گیت‌هابِ Claude Code با موجی از گزارش‌های خطا و اعتراض برنامه‌نویسان مواجه شده است که از توقف ناگهانی امور روزمره مانند پیاده‌سازی مکانیک‌های ساده یا به‌روزرسانی بازی‌های رومیزی شکایت دارند. یکی از کاربران شبکه‌ی اجتماعی ایکس متنی منتسب به قوانین داخلی مدل را منتشر کرد و نوشت: «بازی‌های اصیل، بازی‌های متناسب با یک سبک خاص و بازی‌های مبتنی‌بر طراحی‌ها و دارایی‌های شخصی خود کاربر را بسازید. از ساخت بازآفرینی یک بازی خاص و موجود خودداری کنید، حتی اگر نام آن تغییر کرده باشد یا اصیل نامیده شود.» محدودیت‌های تازه تنها به عناوین ویدئویی ختم نمی‌شود و دامنه‌ی امنیتی گسترده‌تری را هدف گرفته است. کاربران در ردیت گزارش داده‌اند که کلاد از تحلیل فایل‌های عیب‌یابی ویندوز، پاکسازی نرم‌افزارهای زائد تلویزیون‌های سامسونگ و بررسی آسیب‌پذیری‌های سیستم‌های ضدتقلب بازی‌ها خودداری می‌کند. آنتروپیک پیش‌تر برنامه‌ی Cyber Verification Program را معرفی کرد که طبق آن، دسترسی به قابلیت‌های پیشرفته امنیت سایبری تنها به مجموعه‌های تحت پوشش Project Glasswing محدود شده است. کارشناسان معتقدند این اقدامات پیشگیرانه برای جلوگیری از شکایت‌های سنگین حقوقی از سوی استودیوهای بزرگ بازیسازی و ناشران نرم‌افزاری علیه توسعه‌دهندگان هوش مصنوعی صورت می‌گیرد.", "image_url": "https://api2.zoomit.ir/media/cover-6a4a07a561303fad17559378?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "امنیت سایبری"], "datetime_fa": "۱۱ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I moved to Greece 4 years ago. My lifestyle and habits have changed more than I expected.", "link": "https://www.businessinsider.com/american-moved-to-greece-lifestyle-habits-changes-shopping-culture-2026-11", "summary": "Living in Greece has changed the way I shop, eat, and dress. Kathleen O Donnell I've lived in Greece for over four years now, and my lifestyle and routine have changed a lot. I used to wear athleisure to run errands, but now I dress up every time I leave the house. I also eat meals later and have a different grocery-shopping routine. After more than four years of living in Athens, Greece , I've still retained a few very American habits. For instance, I love sleeping with my AC on at 70 degrees Fahrenheit in the summer, and waking up to make a big breakfast of waffles with maple syrup. I still don't take a two-week vacation in August, although I dream of doing it someday. I grew up in Boston and lived in the US for the first 33 years of my life, so it makes sense that I've stuck with a few American tendencies despite my years abroad. But whenever I visit back home, I realize how much I've adjusted to many Greek-inspired habits. These are the ones that have become an integral part of my lifestyle now. The way I dress has changed I no longer wear athleisure to run errands. Kathleen O Donnell In the US, I'd think nothing of leaving my house in athleisure clothes to run errands — stretchy leggings, a zip-up sweatshirt, hair scraped into a messy bun. Here in Greece, however, I don't even go to the grocery store dressed like that anymore. I pull on a proper pair of jeans and a top, tie up my leopard-print Converse sneakers or step into my pink Birkenstock sandals, and arrange my hair into a French twist if it's too messy to wear it down. I also take at least a minute or two to pull my face together before I go — brushing my eyebrows into place and slicking on a little lip color to look a bit more presentable. In my experience, it's very uncommon here to see people outside their homes looking unpolished or untidy. This doesn't mean everyone runs errands in formal attire (hence my Converse and jeans), but it's seen as bad manners to leave the house looking like you just rolled out of bed. Now, the only time I wear gym clothes is when I'm actually on my way to the gym. My grocery shopping routine looks very different Farmers markets in Athens look very different from what I m used to. Kathleen O Donnell When I lived in downtown Boston, I had a routine: I'd walk a mile to the nearest Whole Foods and buy everything I needed for the week ahead, lugging my overstuffed backpack home. Now, in Athens, I shop quite differently. On Friday mornings I go to the laiki agora, or", "date_str": "2026-11-02T14:52:01+00:00", "hash": "822e3437230e975c", "title_fa": "من 4 سال پیش به یونان نقل مکان کردم. سبک زندگی و عادات من بیش از آنچه انتظار داشتم تغییر کرده است.", "summary_fa": "زندگی در یونان نحوه خرید، غذا خوردن و لباس پوشیدن من را تغییر داده است. Kathleen O Donnell من بیش از چهار سال است که در یونان زندگی می کنم و سبک زندگی و روال زندگی من بسیار تغییر کرده است. من قبلاً برای انجام کارها لباس ورزشی می پوشیدم، اما اکنون هر بار که از خانه بیرون می روم لباس می پوشم. من همچنین بعداً غذا می‌خورم و روال خرید مواد غذایی متفاوتی دارم. پس از بیش از چهار سال زندگی در آتن، یونان، من هنوز چند عادت آمریکایی را حفظ کرده ام. برای مثال y decided to settle in the suburbs and raise their two young daughters, they had a few non-negotiables. \"We had a spreadsheet going, and the towns that checked a lot of boxes were the ones with walkability and a good restaurant scene,\" Hajjar, 40, told Business Insider. \"We were also looking for a strong sense of community.\" They ultimately chose Summit, New Jersey , a small commuter suburb about 22 miles from New York City. They paid $1.4 million for a roughly 3,500-square-foot home — far larger than their two-bedroom condo in Jersey City. It even came with an upstairs attic they use to host guests, a yard, and a garden, features they could only have dreamed of having in the city. Sure, they're paying more than when they were living in the city. But one of the home's biggest perks is its proximity to Summit's historic downtown, where the family can walk to shops, cafés, and restaurants. It is also close to the train station, where Hajjar's wife catches the New Jersey Transit to work in New York City. \"We only wanted to do this once, versus buying a starter home ,\" Hajjar said. \"Summit has a lot of great stuff. There's a really good YMCA right downtown, so I can walk to the gym. My wife and I can have a date night and walk into town.\" For decades, people looking for a home have faced a choice between two distinct lifestyles: either large, walkable cities rich in \"third places,\" gathering places outside the home and workplace, like cafés and parks; or the more self-contained, car-dependent suburbs. As Americans place greater value on connection and convenience, home buyers like the Hajjars are asking more of their neighborhoods — and, in turn, homebuilders are reimagining suburbia. People want to live in walkable neighborhoods with things to do NAR's 2026 Community and Transportation Preference Survey polled 2,000 adults in the nation's 50 largest metro areas and found that 63% of respondents woul", "date_str": "2026-11-02T14:42:01+00:00", "hash": "eb8cc5cece28916f", "title_fa": "حومه شهر فرار از زندگی شهری بود. اکنون، هزاره ها می خواهند که آنها بیشتر شبیه شهرها شوند.", "summary_fa": "گزارش NAR نشان داد که خریداران خانه حاضرند برای زندگی در محله‌های قابل پیاده‌روی هزینه بیشتری بپردازند. تونی اندرسون/ گتی ایماژ شهرها زمانی گزینه اصلی برای زندگی در فاصله کمی از پارک ها، کافه ها و مغازه ها بودند. اکنون، حومه‌ها همان رفتاری را دارند که توسعه‌دهندگان جوامعی قابل پیاده‌روی و غنی از امکانات می‌سازند. یک نظرسنجی NAR نشان داد که خریداران حتی برای زندگی در این نوع محله‌ها هزینه بیشتری می‌پردازند. جوزف حجار و همسرش سال‌ها در شهرهای بزرگ زندگی می‌کردند، جایی که از سبک زندگی سریع و گزینه‌های بی‌پایان برای انجام دادن لذت می‌بردند. بنابراین وقتی تصمیم گرفتند در حومه شهر مستقر شوند و دو دختر کوچک خود را بزرگ کنند، چند چیز غیرقابل مذاکره داشتند. حجار، 40 ساله، به Business Insider گفت: «ما یک صفحه گسترده داشتیم، و شهرهایی که تعداد زیادی جعبه را بررسی می‌کردند، شهرهایی بودند که قابلیت پیاده‌روی و رستوران خوبی داشتند. ما همچنین به دنبال یک حس قوی از جامعه بودیم. آنها در نهایت سامیت، نیوجرسی را انتخاب کردند، یک حومه کوچک برای رفت و آمد در حدود 22 مایلی شهر نیویورک. آنها 1.4 میلیون دلار برای خانه ای به مساحت 3500 فوت مربع پرداخت کردند - بسیار بزرگتر از آپارتمان دو خوابه آنها در جرسی سیتی. حتی با یک اتاق زیر شیروانی طبقه بالا که برای میزبانی از مهمانان از آن استفاده می کنند، یک حیاط و یک باغ، ویژگی هایی که فقط می توانستند در شهر آرزوی داشتن آن را داشته باشند، ارائه شد. مطمئناً، آنها بیشتر از زمانی که در شهر زندگی می کردند، پرداخت می کنند. اما یکی از بزرگ‌ترین مزیت‌های خانه، نزدیکی آن به مرکز شهر تاریخی سامیت است، جایی که خانواده می‌توانند پیاده به مغازه‌ها، کافه‌ها و رستوران‌ها بروند. همچنین به ایستگاه قطار نزدیک است، جایی که همسر حجار با ترانزیت نیوجرسی می‌رود تا در شهر نیویورک", "image_url": "https://i.insider.com/6ae4d2d4d8cc18cf7950f996?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۸:۱۲"}, {"source": "Business Insider", "title": "Ukraine has put thousands of new war robots into the fight. Fall and winter will test how they handle mud and snow.", "link": "https://www.businessinsider.com/ukraine-war-ground-robot-army-swelled-autumn-winter-test-2026-11", "summary": "Ukraine s ground robot fleet has grown since last winter. Chris McGrath/Getty Images Ukraine's war robot fleet has grown rapidly, with new models and capabilities entering the fight. But Ukraine's fall and winter will test how well the robots handle mud, snow, and freezing temperatures. \"We will be able to assess how much they have evolved compared to last autumn,\" a Ukrainian officer told BI. Ukraine's ground robot fleet has swelled , but new tests lie ahead, specifically the thick autumn mud and the winter cold and snow that can make battlefield movement more difficult and stress certain systems. Over the last year, the country's military and industry have prioritized fielding an army of robots to attack, gather intelligence, carry gear, and evacuate the wounded. The purpose is to replace as many human soldiers as possible in the war's most dangerous sectors. The fleet has expanded significantly and advanced technologically since last winter. Now it faces seasonal tests. \"These ground robotic systems are constantly being improved,\" Oleksandr Yabchanka, head of robotic systems for Ukraine's Da Vinci Wolves Battalion, told Business Insider. \"Their operational range and off-road mobility are increasing.\" \"Now that autumn has arrived, we will be able to assess how much they have evolved compared to last autumn,\" he said. \"After all, operating in the summer on dry ground is one thing, but in the autumn — when the ground turns to mud and movement becomes significantly more difficult — it is quite another.\" Mud and other autumn and winter conditions make it harder for robots to travel. John Moore/Getty Images In March, Ukraine's defense ministry said that since the beginning of the year, more than 20,000 ground robotic systems had been contracted, which it said was almost twice as many as in all of 2025. It said their use was \"rapidly expanding.\" \"There are more of them now,\" Yabchanka, also a cofounder of the nonprofit Defence Robotics UA, said. \"Throughout 2026, many units have begun employing UGVs.\" \"This usage has already become widespread,\" he said, sharing that \"ground-based robotic systems are becoming an integral part of combat operations for most units deployed along the line of contact.\" Autumn and winter have long been a difficult test for Ukraine's military equipment. First, the ground turns into thick mud. Next, the temperatures drop below freezing, snow covers whole sections of the battlefield, and trees go bare, stripping away valuable cover. Win", "date_str": "2026-11-02T14:29:37+00:00", "hash": "34e5b3babc8e0369", "title_fa": "اوکراین هزاران ربات جنگی جدید را وارد مبارزه کرده است. پاییز و زمستان نحوه برخورد آنها با گل و برف را آزمایش خواهند کرد.", "summary_fa": "ناوگان روبات های زمینی اوکراین از زمستان گذشته رشد کرده است. کریس مک گراث/ گتی ایماژ ناوگان ربات های جنگی اوکراین به سرعت رشد کرده است و مدل ها و قابلیت های جدیدی وارد جنگ شده اند. اما پاییز و زمستان اوکراین آزمایش خواهد کرد که ربات ها تا چه اندازه گل، برف و دمای یخ زدگی را تحمل می کنند. یک افسر اوکراینی به BI گفت: «ما می‌توانیم ارزیابی کنیم که آنها در مقایسه با پاییز گذشته چقدر تکامل یافته‌اند. ناوگان روبات‌های زمینی اوکراین متورم شده است، اما آزمایش‌های جدیدی در راه است، به‌ویژه گل غلیظ پاییزی و سرمای زمستان و برف که می‌تواند حرکت میدان نبرد را دشوارتر کند و سیستم‌های خاصی را تحت فشار قرار دهد. در طول سال گذشته، ارتش و صنعت این کشور، ایجاد ارتشی از روبات‌ها را برای حمله، جمع‌آوری اطلاعات، حمل تجهیزات و تخلیه مجروحان در اولویت قرار داده‌اند. هدف این است که تا آنجا که ممکن است سربازان انسانی در خطرناک ترین بخش های جنگ جایگزین شوند. این ناوگان از زمستان گذشته به طور قابل توجهی گسترش یافته و از نظر فناوری پیشرفت کرده است. اکنون با آزمایشات فصلی روبرو است. اولکساندر یابچانکا، رئیس سیستم‌های روباتیک گردان گرگ‌های داوینچی اوکراین، به Business Insider گفت: «این سیستم‌های روباتیک زمینی دائماً در حال بهبود هستند. برد عملیاتی و تحرک خارج از جاده آنها در حال افزایش است.\" او گفت: \"اکنون که پاییز فرا رسیده است، ما می توانیم ارزیابی کنیم که آنها در مقایسه با پاییز گذشته چقدر تکامل یافته اند.\" به هر حال، کار در تابستان در زمین خشک یک چیز است، اما در پاییز - وقتی زمین به گل تبدیل می شود و حرکت به طور قابل توجهی دشوارتر می شود - کاملاً چیز دیگری است. گل و لای و سایر شرایط پاییز و زمستان سفر را برای ربات ها سخت تر", "image_url": "https://i.insider.com/6ae8984ed8cc18cf795100ec?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۷:۵۹"}, {"source": "Business Insider", "title": "Corporate America's AI bill is ballooning. This startup raised $30 million to make sense of where the money is going.", "link": "https://www.businessinsider.com/larridin-ai-spending-measurement-series-a-30-million-2026-11", "summary": "Ameya Kanitkar, Russell Fradin, and Jim Larrison s startup just raised a $30 million Series A. Larridin AI has gone from being a small business expense to one of the priciest items on companies' ledgers. San Francisco startup Larridin raised $30 million to determine whether firms are getting their money's worth. Larridin's Series A comes in the wake of the tokenmaxxing era, as companies grow concerned about AI ROI. Companies went all in on AI this year, and are now reckoning with heavy bills. One startup wants to get under the hood and figure out which ones are worth it. Larridin, a San Francisco-based startup, just raised $30 million in Series A funding to give companies a clear picture of how the money they spent on AI is — or isn't — working for them. Jeff Kearl, a general partner at Pelion Ventures, which led the funding round, told Business Insider that AI has gone from being a small, even \"nonexistent,\" expense for businesses to one of the top five to 10 most expensive items on their ledger. \"All of a sudden they're like, 'Wow, that's a lot of money going to AI. We run a lot of apps. We have a lot of models. Where does it all go, who uses it, and how do I make sense of that?\" Kearl said. Larridin's main product is a measurement platform that tracks the extent to which AI improves employee productivity and identifies opportunities for better adoption. The software integrates with companies' internal systems to analyze employees' AI usage, including their prompts to different AI tools, and determine who is using AI effectively, who needs more training, and how much time they're saving. Cofounder and CTO Ameya Kanitkar said the platform protects employee privacy by analyzing their AI interactions without storing their contents, instead generating scores and high-level insights. Always a need for a third-party measurement platform Russell Fradin, CEO and cofounder of Larridin, previously worked at Comscore, a media and advertising measurement platform. He said that, in his experience, whenever a lot of money moves into a category, someone builds a third-party measurement platform for that category, evidenced by Comscore, Nielsen, or Datadog. \"We said, look, there's going to be a ton of AI spend ,\" Fradin said. \"There's going to be a third-party audit measurement company, and let's try and be that company.\" The company has a third cofounder, Jim Larrison, who worked with Fradin at Comscore. Larridin's $30 million Series A was led by Pelion Ventures, Andre", "date_str": "2026-11-02T14:00:01+00:00", "hash": "493203c312a84eaf", "title_fa": "لایحه هوش مصنوعی شرکت های آمریکایی در حال افزایش است. این استارت‌آپ 30 میلیون دلار جمع‌آوری کرد تا بفهمد این پول به کجا می‌رود.", "summary_fa": "آمیا کانیتکار، راسل فرادین و استارت‌آپ جیم لاریسون به تازگی 30 میلیون دلار سری A جمع‌آوری کرده‌اند. هوش مصنوعی Larridin از یک هزینه کوچک تجاری به یکی از گران‌ترین اقلام در دفتر کل شرکت‌ها تبدیل شده است. استارت‌آپ سانفرانسیسکو Larridin 30 میلیون دلار جمع‌آوری کرد تا مشخص کند آیا شرکت‌ها ارزش پول خود را دارند یا خیر. Larridin's Series their dreams shaped her career, she says. This as-told-to essay is based on a conversation with Chana Campora, vice president of 7AM Enfant . It has been edited for length and clarity . My mom is a very fashionable, very functional person. When she moved from Paris to New York City for my dad's job, with two young kids, she needed a way to keep us warm in the stroller so she could go about her day. She still tells stories about wrapping me in layers and layers of blankets. As soon as we'd get into a shop, I'd strip them off, and she'd have to do it all again. My mom is utilitarian, so she created a stroller blanket with a zipper that was quick and easy to get me in and out of. Chana Campora s mom invented a blanket for her stroller. Courtesy of Chana Campora She was just trying to lighten her load. Little did we know at the time that she was creating a genius product that would serve so many parents for years to come. More than 20 years later, her business has expanded, but we still use the original five blanket silhouettes she created. It's amazing to see that they're as relevant as ever, and still what parents want and need . I grew up helping with the company, but I wasn't sure I'd join The company was my mom's fourth child, and as the oldest daughter , I helped her care for it. At first, she would sew her designs at home; later, we attended trade shows together. I learned the value of hard work from watching my mom. It was meaningful to know that my siblings and I were her source of inspiration. Her premise with 7AM Enfant was simple: to keep us safe and warm, and keep her day going. That's something she's never stopped fighting for. Chana Campora helps run 7AM Enfant with her mother. Courtesy of Chana Campora Although I loved the company, I wasn't sure I'd join the business. I spent five years in LA, studying Spanish and French literature, and getting a master's in anthropology. Being the daughter of immigrants — and speaking four languages — is central to who "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۷:۲۷"}, {"source": "Business Insider", "title": "My tennis buddy has an AI agent. It's changing his life.", "link": "https://www.businessinsider.com/openai-dot-ai-agent-tennis-buddy-everyday-tasks-2026-10", "summary": "Tennis balls Yomiuri Shimbun/Reuters A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . My Thursday evening tennis league started again recently, and something unusual happened. The emails organizing our weekly games began arriving with a new sign-off. \"See you on the court! Nathan's agent.\" My tennis buddy Nathan Czubaj has organized this league for years. It's a lot of work involving spreadsheets, scheduling, endless reminders, and chasing players who forget to confirm whether they're coming. Now he's outsourced much of that work to an AI agent . Naturally, when we gathered on court, everyone wanted to know what Nathan was using. This is Silicon Valley , after all. We can't even play tennis without talking about AI . Nathan explained that he'd started using OpenAI's Dots , a personal AI assistant that can handle tasks over time and work with other apps. Every Monday, Dot checks a spreadsheet containing our availability and emails players who might be able to play that Thursday. It asks us to confirm. On Thursday morning, another email reminds the confirmed players to show up at 7 pm. It's been working remarkably well for several weeks, saving Nathan considerable time. But here's what makes his experience particularly interesting: Nathan isn't a technology expert. \"I'm one of the least technical people I know,\" he told me. Nathan runs Mindset Unlimited , a business that helps professionals become better communicators and leaders through coaching and training. From Claude Code to Dots He's enthusiastic about AI, but his journey hasn't been entirely smooth. A few months ago, he experimented with Anthropic's Claude Code , a tool that can write software and carry out complicated computer tasks. He found it frustrating and stopped using it. \"It was not easy to manage and it took much longer than it would take to do it yourself,\" he said. Dots has been different. Nathan can describe what he wants in ordinary language, and his Dot can work with services he already uses. He started with tennis scheduling. Now he's handing his Dot tasks throughout his personal and professional life. On one recent day, he asked it to help with guitar practice, a workout routine, shopping lists, selling things on eBay, finding a birthday present, and creating a family book of memories. He also uses it to remember to call friends, recommend books, find workshops, and develop longer-term goals. A", "date_str": "2026-11-02T13:53:02+00:00", "hash": "c7b67ec56a127ab4", "title_fa": "دوست تنیس من یک عامل هوش مصنوعی دارد. زندگی او را تغییر می دهد.", "summary_fa": "", "image_url": "https://i.insider.com/6ae516068bd5d6547af3450a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۱۱ آبان • ۱۷:۲۳"}, {"source": "Business Insider", "title": "I tried Chipotle's $52 family meal. It was plenty of food for 6 … and really great meal prep for 2.", "link": "https://www.businessinsider.com/tried-chipotle-family-meal-what-i-got-worth-it-review-2026-11", "summary": "I ordered Chipotle s family meal to see what I d get and whether it would be a great value. Savannah Born I tried Chipotle's chicken family meal , which cost $52 and is meant to serve four to six. Although I wish we'd gotten more salad and that my chips hadn't been missing, I was impressed. Ultimately, we were able to make six well-portioned, tasty meals at home for less than $10 each. Even though I usually cook at home and avoid fast (and fast-casual) food whenever possible, I have a hard time turning down Chipotle. I build the same salad bowl every time I go, so I don't pay much attention to the rest of the menu. It wasn't until I saw Chipotle's strange fever-dream of an advertising campaign that I learned about its family meals. Simply put, it involved a 3-foot reusable version of its takeout bag. Bizarre, yes, but it worked. Curious about the details (and the \"big ass\" bag mentioned in the advertisement), I did some Googling. Turns out, Chipotle launched its family meals in August 2025. The build-your-own experience is a major appeal. Per Chipotle , \"People can create any bowl, salad, or soft taco to their liking and dietary preferences.\" Nachos were also suggested. Since I love salads and my partner prefers bowls, it seemed like the perfect setup. Plus, family meals are designed to serve four to six people — which, in my two-person household , could mean dinners for days. So, I ordered a chicken family meal online, complete with all the default items. Here's how it shook out. My local Chipotle had a few options for family meals. Savannah Born Even though I set my sights on its $52 chicken meal, Chipotle also offered steak and sofritas meals featuring the same standard fixings: rice (white or brown) beans (black or pinto) cheese romaine lettuce large chips 10 soft-flour tortillas three dips (choices included sour cream and four different salsas) one premium side (either guacamole or queso). The meals ranged from $52 to $63, depending on the protein. It's worth noting that these family meals are all digital-only, so they have to be ordered through the app or website. Ordering online felt seamless. Savannah Born Since I stuck with the baseline, customization-free spread, ordering took only a few clicks. My lineup included white rice, black beans , cheese, romaine lettuce, large chips, and 10 flour tortillas, plus sour cream, pico de gallo, and hot salsa as toppings. Then, I scrolled to the \"extras\" section. I could add another protein and up to seven ext", "date_str": "2026-11-02T13:44:01+00:00", "hash": "85f0155aa0a58db7       return n.toString().replace(/\d/g, d => f[d]);

      if (readArticles.has(hash)) {

      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {

        const q = searchQuery.toLowerCase();

        const category = (item.category || '').toLowerCase();

        } else {
          unreadList.push(item);
        }
      });

        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
