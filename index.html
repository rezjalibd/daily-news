<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۶ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>

      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۶ آبان ۱۴۰۵</span>

        <span class="meta-tag">⏰ ساعت انتشار: ۲۲:۳۰</span>

    <div class="search-box">

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">

      <button class="tab-btn" onclick="switchTab('tech', this)">

        <span class="badge" id="badge-media">۱۳۲</span>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">

      <div class="modal-header">

        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

d-turnout/33885348.html", "summary": "انتخابات اسرائیل روز سه‌شنبه پنجم آبان در حالی ادامه دارد که گزارش‌ها حاکی از مشارکت کم‌سابقه مردم این کشور است و بنیامین نتانیاهو، نخست‌وزیر، نیز نگرانی‌هایی درباره نحوه رأی‌گیری مطرح کرده است. نتانیاهو پس از انداختن رأی خود به صندوق در اورشلیم، از مشارکت بالای اقلیت عرب اسرائیل ابراز نگرانی کرد و دربارهٔ تلاش‌هایی برای «سرقت انتخابات» هشدار داد. این اظهارات می‌تواند نشانه‌ای از آغاز مناقشه‌ای طولانی بر سر نتایج انتخابات باشد. کمیته مرکزی انتخابات اسرائیل اعلام کرد میزان مشارکت سراسری تا...", "date_str": "2026-10-27T15:34:11+00:00", "hash": "df993ac5830a7771", "title_fa": "مشارکت کم‌سابقه اسرائیلی‌ها در رأی‌گیری؛ نتانیاهو دربارۀ «سرقت انتخابات» هشدار داد", "summary_fa": "انتخابات اسرائیل روز سه‌شنبه پنجم آبان در حالی ادامه دارد که گزارش‌ها حاکی از مشارکت کم‌سابقه مردم این کشور است و بنیامین نتانیاهو، نخست‌وزیر، نیز نگرانی‌هایی درباره نحوه رأی‌گیری مطرح کرده است. نتانیاهو پس از انداختن رأی خود به صندوق در اورشلیم، از مشارکت بالای اقلیت عرب اسرائیل ابراز نگرانی کرد و دربارهٔ تلاش‌هایی برای «سرقت انتخابات» هشدار داد. این اظهارات می‌تواند نشانه‌ای از آغاز مناقشه‌ای طولانی بر سر نتایج انتخابات باشد. کمیته مرکزی انتخابات اسرائیل اعلام کرد میزان مشارکت سراسری تا... این انتخابات در سایه حملات هفتم اکتبر و جنگ‌های منطقه‌ای چندجبهه‌ای پس از آن، ازجمله دو نوبت جنگ با ایران برگزار می‌شود. این در حالی است که موضوع پاسخ‌گویی مقام‌ها و امنیت کشور به محورهای اصلی کارزار انتخاباتی تبدیل شده است. آخرین نظرسنجی‌های منتشرشده پیش از انتخابات نشان می‌دادند نتانیاهو، باسابقه‌ترین نخست‌وزیر اسرائیل، رقابتی نزدیک با گادی آیزنکوت، رقیب اصلی خود، دارد. آیزنکوت که پیش‌تر رئیس ستاد کل ارتش اسرائیل بوده و تجربه سیاسی کمتری دارد، از چهره‌های میانه‌رو محسوب می‌شود و رفتار او در تقابل با سبک سیاسی نتانیاهو قرار دارد. حزب «یاشار» به رهبری آیزنکوت روز سه‌شنبه هشدار داد که نتانیاهو در حال «زمینه‌سازی برای به چالش کشیدن نتایج انتخابات» است. این نظامی ۶۶ ساله پیش از رأی دادن، در مراسمی خصوصی بر مزار پسرش گال که در جنگ غزه کشته شد حاضر شده بود. آیزنکوت پس از رأی داد lear from this paper exactly how the algorithm works or whether it s likely to be useful in a general population, but apparently Google is betting on it being an interesting factor to track in your Google Health app. Can you really measure blood pressure with a wearable? Credit: Beth Skwarecki Google also published a paper on a blood pressure algorithm, although it is not peer-reviewed. Instead of explaining how the algorithm works, it describes how the researchers tried to figure out what their AI-based model might be looking at. According to this paper, Google's model works about as well as clinical blood pressure measurements, but it's not clear how useful it would be in the real world. For example, the study excluded people with heart disease, but I'd imagine plenty of people with heart disease would be interested in th", "date_str": "2026-10-27T18:30:00+00:00", "hash": "7e8a8ec27fa4e5a7", "title_fa": "«نگهبان سلامت» گوگل اکنون برای فیت بیتز در دسترس است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. ویژگی Google's Health Guardian در اواخر سپتامبر برای Pixel Watches 3، 4 و 5 عرضه شد و اکنون در یک به‌روزرسانی جدید برای کاربران Fitbit Air ارائه می‌شود. گوگل می گوید که ویژگی های جدید شامل گزارش هایی در مورد روند فشار خون و مقاومت به انسولین است که ادعای بزرگی برای یک پوشیدنی است. در اینجا آنچه ما در مورد Health Guardian می دانیم، از جمله نحوه تنظیم آن و آنچه باید انتظار داشته باشیم، آورده شده است. Google Pixel Watch 5 (41mm) - Android Smartwatch - Obsidian - LTE 499.99 دلار در آمازون بیشتر بدانید 499.99 دلار در آمازون آیا واقعاً می توانید مقاومت به انسولین را با یک ابزار پوشیدنی اندازه گیری کنید؟ اعتبار: مقاومت به انسولین Beth Skwarecki با دیابت نوع 2 مرتبط است و می تواند نشانه اولیه ای باشد که شما به سمت پیش دیابت یا دیابت می روید. هنگامی که گیرنده های انسولین بدن شما به شدت به انسولین پاسخ نمی دهند، احتمال افزایش گلوکز خون شما افزایش می یابد. مقاومت به انسولین معمولاً با آزمایش خون اندازه گیری می شود. به عنوان مثال، سطح گلوکز ناشتا و control than Carrie White (Summer H. Howell) because she s more self-possessed (and played by Megan Fox), underneath the hair and makeup, Jennifer is just as naive and confused as Carrie. Both girls endure horrific experiences that set them on a path to horrific violence and those experiences are symbolic of what women everywhere have to deal with all the damn time. Just as in Carrie , Jennifer s Body tracks a teen girl s descent into monstrousness but where Carrie leans into the tragic nature of those themes, Jennifer s Body offers a funnier, more sarcastic take buoyed by Diablo Cody s sharp dialogue and laugh-out-loud moments. The series highlights Carrie s suffocating home life that offers her no relief from the grinding hell of being a 16-year-old girl who doesn t quite fit the expected physical or behavioral norms imposed on teen girls, tracing a slow boil of rage. Jennifer s Body depicts a character who ultimately chooses the dark path, leaning into her newfound destructive power, and has more fun with it, making it the perfect complement to the series. Although the stories take different paths to get there, they both wind up at a cathartic and bloody climax centered on a school dance, where a lot of people die and chaos reigns. The film is the perfect way to examine, from a different angle, the themes that Carrie explores. Stream Jennifer s Body on Hulu or rent it on Prime Video . Jennifer s Body (2009) $3.99 at Pr", "date_str": "2026-10-27T18:00:00+00:00", "hash": "e0b2c7cd3369ad36", "title_fa": "اگر عاشق «کری» بودید، یک فیلم وجود دارد که باید در ادامه ببینید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. کری استفن کینگ یکی از آن داستان های بی پایان قابل راه اندازی مجدد است. در سال 1974، کینگ در یک چیدمان ترسناک تقریباً بی‌نقص بود که به بررسی دیگری شدن، عواقب سلامت روانی و عاطفی قلدری و اینکه دختر نوجوان بودن در دنیای مدرن چقدر می‌تواند تلخ باشد را بررسی کرد. آن مضامین و جلوه‌های بصری نمادینی که کینگ با کلماتش تداعی می‌کند همیشه  at once. And they’re two radically different products from two radically different automakers that I think will reveal a few preferences from the EV-buying public. One is the Blank Slate, from a brand new startup offering a bare-bones two-door that capitalizes on features the Internet says it wants, like no onboard modem, no touchscreens, and no infotainment system. The other is the result of one of Detroit’s big three taking a long, hard look at Chinese EVs and asking itself, “How do we make a car that cheap?” Although the Ford Fathom will cost $5,000 more than a Slate, that money does buy an extra pair of doors, modern conveniences like an infotainment system, CarPlay, electric windows, and a vast dealership network to service the car. That may be helpful given how many recalls Ford issues each year. Read full article Comments", "date_str": "2026-10-27T16:17:58+00:00", "hash": "e9a3b2a44f1101c0", "title_fa": "فورد با Fathom 30 هزار دلاری استفاده از EV شما را به عنوان باتری خانگی ساده کرده است", "summary_fa": "امروز صبح، فورد فاش کرد که خریداران Fathom آینده - وانت برقی زیر 30000 دلاری این شرکت که در سال آینده عرضه می شود - چیزی بیش از یک کامیون خواهند داشت. تاکنون، فناوری وسیله نقلیه به خانه - مانند تنظیماتی که فورد برای F-150 لایتنینگ که اکنون تولیدش متوقف شده است، انرژی DC را از خودروی الکتریکی می گیرد و آن را از طریق یک اینورتر تعبیه شده در جعبه دیواری عبور می دهد تا آن را به AC تبدیل کند که خانه می تواند از آن استفاده کند. اما با Fathom، این اینورتر از ابتدا در کامیون تعبیه شده است. بنابراین هر Fathom می تواند به عنوان یک باتری پشتیبان برای خانه شما عمل کند. معمولی است: شما یک دهه منتظر یک کامیون برقی ارزان می‌شوید، و سپس تقریباً یک بار دو کامیون الکتریکی از راه می‌رسند. و آنها دو محصول کاملاً متفاوت از دو خودروساز کاملاً متفاوت هستند که من فکر می‌کنم ترجیحات کمی را از سوی عموم خریداران خودروهای برقی آشکار خواهد کرد. یکی Blank Slate، از یک استارت‌آپ کاملاً جدید است که یک دو در بدون استخوان ارائه می‌کند که از ویژگی‌هایی که اینترنت می‌خواهد استفاده می‌کند، مانند عدم وجود مودم داخلی، بدون صفحه نمایش لمسی و بدون سیستم سرگرمی. مورد دیگر نتیجه این است که یکی از سه شرکت بزرگ دیترویت، نگاهی طولانی و سخت به خودروهای برقی چینی انداخته و از خود می‌پرسد: «چگونه خودرویی به این قیمت ارزان بسازیم؟» اگرچه فورد فتوم 5000 دلار بیشتر از یک اسلیت قیمت خواهد داشت، اما با این پول یک جفت درب اضافی، امکانات مدرن مانند سیستم اطلاعات سرگرمی، CarPlay، شیشه‌های برقی و شبکه گسترده نمایندگی‌ها برای سرویس خودرو خریداری می‌شود. این ممکن است با توجه به تعداد موارد فراخوان فورد در سال مفید باشد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/UEV_Ebox_1-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۵ آبان • ۱۹:۴۷"}, {"source": "Ars Technica", "title": "DeepMind unveils Genie 4 world model promising more realistic physics and humans", "link": "https://arstechnica.com/google/2026/10/deepminds-genie-4-world-model-adds-audio-and-more-realistic-people-to-simulations/", "summary": "Last year, Google DeepMind sent gaming stocks tumbling with the reveal of its Genie 3 world model . Since then, world models have become a major focus of AI labs around the world, but Google isn't resting on its laurels. Researchers have been hard at work on an updated model that improves on Genie 3 in almost every way. And if you pay Google enough money, you might actually get to use Genie 4 before too long. It's easy to look at the output of Genie 4 and see a video game, which is why Genie 3 caused so much consternation in the gaming industry. DeepMind doesn't think about it that way, though. According to Google , world models are a key element in the march toward artificial general intelligence (AGI). A world model creates a virtual world, but it doesn't require pre-rendering environments or programming interactive elements. You simply tell the model what you want, and it generates the experience frame by frame in real time as you explore it. DeepMind says this technology could create infinite training environments for physical robots or unlock new avenues of rapid prototyping for creative fields. Of course, that requires the model to accurately simulate what you want. Genie 4 has several improvements that make its simulations more useful, and that's thanks in part to Google's updated Gemini models. Read full article Comments", "date_str": "2026-10-27T16:00:22+00:00", "hash": "0253ddea280a9679", "title_fa": "DeepMind از مدل جهانی Genie 4 رونمایی می کند که نویدبخش فیزیک و انسان واقعی تر است", "summary_fa": "سال گذشته، Google DeepMind با رونمایی از مدل جهانی Genie 3، سهام بازی‌ها را کاهش داد. از آن زمان، مدل‌های جهانی به کانون اصلی آزمایشگاه‌های هوش مصنوعی در سرتاسر جهان تبدیل شده‌اند، اما گوگل روی موفقیت‌های خود استراحت نمی‌کند. محققان به سختی روی یک مدل به روز شده کار کرده اند که تقریباً از هر نظر در Genie 3 بهبود می یابد. و اگر پول کافی به گوگل بپردازید، ممکن است در واقع قبل از مدت ها از Genie 4 استفاده کنید. به راحتی می توان به خروجی Genie 4 نگاه کرد و یک بازی ویدیویی را دید، به همین دلیل است که Genie 3 باعث ایجاد حیرت زیادی در صنعت بازی شد. با این حال، DeepMind به این موضوع فکر نمی کند. به گفته گوگل، مدل های جهانی یک عنصر کلیدی در راهپیمایی به سمت هوش عمومی مصنوعی (AGI) هستند. یک مدل جهان یک دنیای مجازی ایجاد می‌کند، اما نیازی به محیط‌های پیش‌رندر یا برنامه‌نویسی عناصر تعاملی ندارد. شما به سادگی به مدل می گویید که چه می خواهید، و این تجربه را فریم به فریم در زمان واقعی ایجاد می کند که آن را کاوش می کنید. DeepMind می‌گوید این فناوری می‌تواند محیط‌های آموزشی بی‌نهایتی را برای ربات‌های فیزیکی ایجاد کند یا راه‌های جدیدی را برای نمونه‌سازی سریع برای زمینه‌های خلاق باز کند. البته، این مستلزم آن است که مدل به طور دقیق چیزی را که می خواهید شبیه سازی کند. Genie 4 چندین پیشرفت دارد که شبیه سازی های آن را مفیدتر می کند و این تا حدی به لطف مدل های Gemini به روز شده گوگل است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر م اقیانوس اطلس به \"اقیانوس آمریکایی\" را مطرح کرد. ابتدا خلیج مکزیک و سپس دریاچه انتاریو. اکنون، رئیس جمهور دونالد ترامپ گفته است که اقیانوس می تواند بعدی باشد. در راهپیمایی روز دوشنبه در می سی سی پی، رئیس جمهور ایده تغییر نام اقیانوس اطلس به \"اقیانوس آمریکایی\" را مطرح کرد و گفت که فکر می کند \"اروپا به وجد خواهد آمد.\" او برای اولین بار این ایده را در یک راهپیمایی تنسی در اوایل اکتبر مطرح کرد و \"اقیانوس ترامپ\" یا \"اقیانوس آمریکا\" را برای اقیانوس اطلس یا اقیانوس آرام مطرح کرد. در یک گردهمایی کارولینای جنوبی در اواسط اکتبر، او گفت که ساندار پیچای، مدیرعامل گوگل به او به تغییر نام اقیانوس‌ها در نقشه‌های گوگل «نه» گفته است، زیرا آنها بسیاری از کشورها را لمس می‌کنند. کاخ سفید Business Insider را به اظهارات رئیس جمهور ارجاع داد. این اولین تغییر نامی نخواهد بود که ترامپ در دومین دوره متوالی ریاست جمهوری خود انجام داده یا پیشنهاد کرده است. در ماه اوت، او دستوری اجرایی برای تغییر نام دریاچه انتاریو - یکی از پنج دریاچه بزرگ، هم مرز با کانادا و ایالات متحده - به دریاچه آمریکا امضا کرد. او همچنین به یک خلیج و یک کوه تغییر نام داده است و در مورد تغییر نام یک رودخانه فکر کرده است، نیومکزیکو را «آمریکای جدید» می‌نامد و نام تنگه هرمز را به «تنگه ترامپ» تغییر می‌دهد. علاوه بر تغییر نام بسیاری", "image_url": "https://i.insider.com/6ae0bf26876163ee6ce5600c?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۵ آبان • ۲۱:۰۳"}, {"source": "Business Insider", "title": "I made $153,000 a year and was miserable. Now I make nothing and wake up excited.", "link": "https://www.businessinsider.com/quit-high-paying-job-mental-health-happiness-2026-10", "summary": "Maria Sentmanat quit her job at 55. Courtesy of Maria Sentmanat Maria Sentmanat, 55, quit her six-figure job this summer without another job to go to. She started Why Not Wild, giving guided tours of the South Florida wilderness. She's not making any money and living off her savings, but says the move has saved her mental health. This as-told-to-essay is based on a conversation with Maria Sentmanat, 55, who is based in Miami, Florida . It has been edited for length and clarity. I'm a high school dropout who came from a single-parent family. My upbringing was filled with chaos and instability. I never thought I'd end up being the type to earn a six-figure salary, but that's exactly what I ended up doing — and walking away from this year. On paper, I was definitely successful. I had a $153,000 paycheck managing one of the largest 5K races in the country, a job I'd held for the past five years. I could have made up to $180,000 next year if I had stayed on. The job was a new opportunity when I really needed one You could argue it was the culmination of the fitness career I had spent 16 years building, after becoming super overweight following the birth of my daughters. I became a personal trainer and ran my own wellness-focused fitness studio. I'd created something special. But then the pandemic happened, and I lost everything. I couldn't run my studio anymore, and struggled to build it back up again once the restrictions were lifted. Maria Sentmanat is not making any money but is happier. Courtesy of Maria Sentmanat The founder of this race event was a friend, so when she told me she needed a new race director, it felt like an opportunity life was giving me. I completed all the required certifications and threw myself into this new role, which was both incredibly stressful and rewarding. But things started to change. I started to dread going to work , and my stomach was always upset. I felt myself going into \"fight or flight\" mode, with the trauma from my childhood resurfacing, that I just didn't need. I felt heavy, and my daughters — who are now 25 and 27 — could see it. I would go out into nature to decompress , but I was always thinking, \"What am I going to do with this massive thing hanging on the side of my neck?\" I got to a state where I just felt numb, even though I was continually asking myself, \"What are you going to do? How are you going  of the original series is up to now.", "link": "https://www.businessinsider.com/star-trek-original-series-cast-then-and-now", "summary": "Walter Koenig died in October 2026, making William Shatner and George Takei the last two living members of the original series cast. Jason LaVeris/FilmMagic/Getty Images \"Star Trek\" debuted 60 years ago on September 8, 1966. After the show, the cast of the original series remained sci-fi icons. Only two main cast members of \"The Original Series\" are alive; Walter Koenig died in October 2026. When Gene Roddenberry popularized the Vulcan phrase, \"Live long and prosper,\" he had no way of knowing that he was predicting the future of his little sci-fi show that premiered on NBC 60 years ago. In the six decades since, \" Star Trek \" has become one of our most enduring franchises , with 13 feature films (plus one direct-to-streaming movie), 13 television shows, and millions of fans all over the world — and perhaps the galaxy. To celebrate \"Star Trek's\" big anniversary, we're reflecting on the original crew of the USS Enterprise, how they changed the world, and what the surviving cast members are doing now. William Shatner led the crew of the USS Enterprise as Captain James T. Kirk. William Shatner as Captain James T. Kirk on the Star Trek: The Original Series episode Space Seed. Original air date February 16, 1967 CBS/Getty Images \"Star Trek\" was originally going to be focused on a different captain, Captain Christopher Pike, played by Jeffrey Hunter. A pilot, called \"The Cage,\" was even filmed, but it didn't make it to airwaves until the '80s. Gene Roddenberry, the creator, eventually retooled the show and cast Shatner as a new captain, Kirk. Some footage from \"The Cage\" was reused for a season one episode called \"The Menagerie.\" Before \"Star Trek,\" Shatner was famous for his role in an iconic \" Twilight Zone \" episode, \"Nightmare at 20,000 Feet,\" in which he played a man recently released from a mental hospital 67 CBS/Getty Images \"Star Trek\" در ابتدا قرار بود بر روی کاپیتان دیگری به نام کاپیتان کریستوفر پایک با بازی جفری هانتر متمرکز شود. حتی یک خلبان به نام «قفس» نیز فیلمبرداری شد، اما تا دهه 80 به آنتن نرسید. Gene Roddenberry، خالق، سرانجام نمایش را از نو ساخت و شاتنر را به عنوان کاپیتان جدید، کرک، انتخاب کرد. برخی از فیلم‌های «قفس» برای فصل اول به نام «مناجری» دوباره استفاده شد. قبل از «پیشتازان فضا»، شتنر برای بازی در قسمت نمادین «منطقه گرگ و میش» به نام", "image_url": "https://i.insider.com/6adfaa348e95884e1ca8363c?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۲۰:۴۸"}, {"source": "Business Insider", "title": "The secret succession rankings that Anthropic shareholders will never see (unless the company is ordered)", "link": "https://www.businessinsider.com/anthropic-founders-llc-secret-succession-lists-rankings-2026-10", "summary": "Anthropic CEO Dario Amodei is among the cofounders who can propose a confidential list of successors to inherit their power and membership in the Founders LLC, which has voting control. Anna Moneymaker/Getty Images Anthropic's IPO paperwork shows the AI giant has some unusual approaches to governance. One of those is an agreement with a separate entity, Anthropic Founders LLC, controlled by seven of its cofounders. Those seven cofounders, including CEO Dario Amodei, can submit a secret list of successors to inherit their voting power. Anthropic has devised an unusual way for its founders to pass on their power. In its IPO filings , Anthropic outlined how seven of its cofounders, who collectively have 50.1% of voting control, will be able to create a ranked list of who they'd like to inherit their power in the event of their death or incapacitation. What's particularly notable is that while the names would be shared with the other LLC members and Anthropic's Nominating Committee, they are otherwise contractually confidential and generally not public. Anthropic CEO Dario Amodei , Anthropic President Daniela Amodei, and the five other LLC members will review and vote on whether to approve their fellow founders' proposed successors, but the names will likely never be seen by other shareholders. (The agreement allows for the publication only in narrow circumstances, such as a court order or other legal requirement.) Under the agreement, which was first highlighted by Forbes , each member of the Founders LLC may name up to 10 potential successors, ranked in order of preference. The other LLC members must then vote to approve the secret lists. While succession plans are not unusual, Anthropic's approach is unusual in how it ranks potential successors. It also underscores how, thanks to the Founders LLC, Anthropic's leaders will be able to maintain control as shareholders begin to offer input post-IPO. Facebook's 2012 IPO paperwork suggested that if Mark Zuckerberg were in control of the company at the time of his death, then control could be transferred to someone he designated. (Meta has since tweaked this plan.) In 2020, Airbnb's three cofounders agreed to transfer their voting power to their other cofounders if one of them died or became disabled, but that arrangement (which still exists) only lasts for nine months. The succession plan does not establish CEO succession. Anthropic's board of directors would handle such a chief executive appointment. There are a", "date_str": "2026-10-27T17:15:38+00:00", "hash": "70854f0ffc4a9915", "title_fa": "رتبه بندی جانشینی مخفی که سهامداران آنتروپیک هرگز نخواهند دید (مگر اینکه به شرکت سفارش داده شود)", "summary_fa": "داریو آمودی، مدیر عامل آنتروپیک، از جمله بنیانگذارانی است که می تواند فهرستی محرمانه از جانشینان را برای به ارث بردن قدرت و عضویت در Founders LLC، که دارای کنترل رای است، پیشنهاد دهد. Anna Moneymaker/Getty Images اسناد IPO Anthropic نشان می دهد که غول هوش مصنوعی رویکردهای غیرمعمولی برای حکومت دارد. یکی از آنها توافق با یک نهاد جداگانه به نام Anthropic Founders LLC است که توسط هفت نفر از بنیانگذاران ungry Jack's buttermilk-pancake mix was classic, but my favorite was the affordable Krusteaz brand. Pancake mix is a pantry staple in most American households, but which one is the best? I set out to determine which boxed pancake mix is the best value based on flavor, texture, and price. To do so, I compared the buttermilk flavor of four different pancake -mix brands: Hungry Jack, Krusteaz, Pearl Milling Company, and Birch Benders. Here's how I ultimately rated the pancake mixes, from worst to best. I tried the buttermilk flavor from four different pancake mix brands: Hungry Jack, Krusteaz, Pearl Milling Company, and Birch Benders. Erin McDowell/Business Insider For each mix, I followed the recipe on the back of the box for the most basic pancakes and the fewest pancakes. Many of the recipes required the same mix-to-water ratio, but one required oil, milk, and an egg. I cooked all the pancakes for 1 1/2 minutes on each side, using about half a tablespoon of butter to grease the pan as needed. I also used about a quarter-cup of batter for each pancake. To keep things as fair as possible, I also served all the pancakes the same way, with a half-tablespoon of butter and a drizzle of Maine maple syrup. My least favorite brand I tried was also the most complicated. Erin McDowell/Business Insider The 32-ounce box cost $4.99 at my local Stop Shop in New York City. Ingredients 1 cup mix 3/4 cup milk 1 tablespoon oil 1 egg Unlike the other pancake mixes, this batter called for milk, oil, and an egg. Erin McDowell/Business Insider Pearl Milling Company has another complete buttermilk pancake mix that only requires adding water, but this kind requires a few extra steps. After I mixed the ingredients, I noticed the batter was slightly thicker than the batter from other pancake mixes I've tried. It took a little extra effort to remove all the clumps and make sure the egg was fully incorporated into the batter. The pancake puffed up slightly and thickened while cooking. Erin McDowell/Business Insider It looked almost cake-like in texture, and it turned a nice golden brown. This pancake was thicker and more cake-like than the others. Erin McDowell/Business Insider The tex", "date_str": "2026-10-27T17:12:05+00:00", "hash": "a8384ae13843fd37", "title_fa": "من 4 مخلوط پنکیک باترمیلک را امتحان کردم. مورد علاقه من هم ارزان ترین بود.", "summary_fa": "من طعم دوغ چهار مارک مخلوط پنکیک را مقایسه کردم: Hungry Jack، Krusteaz، Pearl Milling Company، و Birch Benders. ارین مک داول/Business Insider من چهار برند ملی مخلوط دوغ و پنکیک را آزمایش کردم. میکس هایی که من امتحان کردم عبارت بودند از Hungry Jack، Krusteaz، Pearl Milling Company و Birch Benders. ترکیب دوغ و پنکیک هانگری جک کلاسیک بود، اما مورد علاقه من مارک مقرون به صرفه Krusteaz بود. مخلوط پنکیک یک غذای اصلی در اکثر خانواده های آمریکایی است، اما کدام یک بهترین است؟ من تصمیم گرفتم که بر اساس طعم، بافت و قیمت، تعیین کنم که کدام مخلوط پنکیک بسته بندی شده بهترین ارزش را دارد. برای انجام این کار، طعم دوغ چهار مارک مختلف پنکیک مخلوط را مقایسه کردم: Hungry Jack، Krusteaz، Pearl Milling Company، و Birch Benders. در اینجا این است که چگونه من در نهایت به مخلوط پنکیک از بدترین به بهترین امتیاز دادم. من طعم دوغ را از چهار مارک مختلف مخلوط پنکیک امتحان کردم: Hungry Jack، Krusteaz، Pearl Milling Company و Birch Benders. Erin McDowell/Business Insider برای هر ترکیب، من دستور العمل پشت جعبه را برای ابتدایی ترین پنکیک ها و کمترین پنکیک دنبال کردم. بسیاری از دستور العمل ها به همان نسبت مخلوط به آب نیاز داشتند، اما یکی از آنها به روغن، شیر و یک تخم مرغ نیاز داشت. تمام پنکیک ها را به مدت 1/2 دقیقه از هر طرف پختم، با استفاده از حدود نصف قاشق غذاخوری کره تابه را به میزان لازم چرب کردم. من همچنین برای هر پنکیک از یک چهارم فنجان خمیر استفاده کردم. برای اینکه همه چیز تا حد امکان منصفانه باشد، همه پنکیک ها را نیز به همین ترتیب با نصف قاشق غذاخوری کره و کمی شربت افرای مین سرو کردم. نام تجاری مورد علاقه من که امتحان کردم نیز پیچیده ترین بود. Erin", "image_url": "https://i.insider.com/6adf5f88ab741a2ebdf114a1?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۵ آبان • ۲۰:۴۲"}, {"source": "Business Insider", "title": "Republican voters are getting worried about high costs as inflation stings and the midterms approach", "link": "https://www.businessinsider.com/republicans-feel-inflation-crunch-midterm-elections-consumer-sentiment-2026-10", "summary": "Rising costs are weighing on Republican voters. Lajst/Getty Images Republicans are feeling the strain of rising costs, with more saying it's a drag on their finances. Those voters are feeling generally bad about the economy as key midterm elections loom. Voters not approving of the party in power is common; what's unclear is how it'll play out. Republicans are feeling the high-cost crunch . The latest consumer sentiment reading out of the University of Michigan finds that, across the board, Americans are still feeling bad. While self-identified Republicans still feel better than their Democratic and Independent counterparts, they're increasingly feeling the pinch of rising prices. From January to October 2026, the share of Republicans citing high prices as a drag on their finances rose the most out of all political factions. It's a sign that, even as their party holds Congress and the White House, Republican voters might still be feeling the heat — especially as inflation continues to rise. And, more broadly, Republicans seem to be souring on economic conditions. A Pew Research survey of 5,062 American adults from September 28 to October 4 found that Republicans, and those who lean Republican, were becoming less likely to say that economic conditions in the country are good. Historically, consumer sentiment and surveys asking voters about economic conditions tend to have strong partisan correlations . Democrats are more likely to say that the economy is doing well and they're optimistic about the future when a Democrat is president; Republicans do the same when the GOP holds the White House. D e jobs. At the Association of the United States Army conference in Washington, DC, earlier this month, leaders from Army Human Resources Command discussed how they're modernizing personnel management to get soldiers trained into the jobs where they're needed faster. The data-driven approaches are aimed at connecting what have long been separate processes to better match soldiers to specific locations and jobs based on the Army's needs and scheduling. Part of the challenge for the service is getting \"hundreds of disparate systems\" to talk to each other, said Lt. Gen. Charles Lombardo, who's overseeing the effort. The Army is tackling that problem through a broader technology overhaul touching systems spanning from personnel management to battlefield operations. The Army has described its wider human-resources overhaul as an effort to replace fragmented, paper-based processes with a unified data environment. It says that the effort is intended to improve forecasting, resource management, and real-time personnel services. For training, Army leaders want better scheduling with an approach they're calling People Supply Chain Management. Rather than handling enlistment, basic training , and advanced training as separate events, the service is examining how to better coordinate these processes to reduce downtime and fill empty training seats. The Army announced the initiative last year, saying it recruits, trains, and assigns tens of thousands of people annually across more than 200 specialties. Some of the Army's most in-demand technical specialties, such as military intelligence and air defense , are top of mind ", "date_str": "2026-10-27T16:49:50+00:00", "hash": "db14b10997251a89", "title_fa": "ارتش ایالات متحده می خواهد از اتلاف وقت سربازان با کاهش زمان انتظار برای آموزش و تکالیف شغلی جلوگیری کند", "summary_fa": "سربازان در دوره رهبران پایه آکادمی افسران غیر مأمور ارتش هفتم در منطقه آموزشی Grafenwoehr، آلمان، 27 اکتبر 2026. گروهبان. کولین مکال/ ارتش ایالات متحده ارتش ty Images GTA 6 is set to drop on November 19, and it's set to be a boon for its publisher's stock. Bank of America says Take-Two is poised for a GTA-fueled earnings bonanza. It's not just game sales, but GTA Online that will boost earnings, BofA said. November 19 will mark an event that some gamers have been waiting more than a decade for, but it should also be a date for investors to mark on their own calendars. We're talking about the release of Grand Theft Auto 6, Rockstar Games' sprawling crime epic that's set to be the biggest video-game release in years. Fans are so excited for the new installment that some are already planning to take time off from work to play it on release day. But according to Bank of America, investors should also get ready, as the game's release could be a growth-driving catalyst for Take-Two Interactive , the parent company of GTA's developer. \"We recommend being long TTWO through the GTA 6 launch,\" BofA wrote in a note to investors. \"It remains cheap on the LT growth we believe will soon become apparent.\" It hasn't been a good year for Take-Two so far. The company's portfolio also includes popular sports game franchise 2K, Gearbox Entertainment, and popular mobile game maker Zynga, but shares have dropped 21% year to date. BofA sees the stock's struggle in 2026 setting up an opportunity, citing the growth potential stemming from GTA, particular the monetization of its massively popular online mode, which the analysts say investors may be missing as they assess the company's earnings outlook. In the bank's view, online monetization potential for the GTA franchise is Take-Two's most important earnings driver on a long-term basis. \"Our LT EPS growth forecast is materially stronger than what we've heard, and a GTA Online launch in 1CQ27 should begin providing tangible evidence of that monetization upside,\" BofA noted. \"As that strength becomes apparent, we believe the market will need to revise its long-term EPS growth forecasts higher.\" For that reason, the bank reiterated its Buy rating on TTWO stock, and while it lowered its price target from $380 to $330, the new target still implies 62% upside potential. The release of GTA 6 comes as the video game industry continues to struggle against a complicated market outlook. Microsoft sparked concern about the health of the industry when it scaled back its Xbox divisi", "date_str": "2026-10-27T16:45:41+00:00", "hash": "54030cae454215c0", "title_fa": "BofA می‌گوید قبل از انتشار عظیم GTA 6، سهام Take-Two را خریداری کنید", "summary_fa": "غرفه نمایشگاهی Grand Theft Auto 6 (GTA 6) در توکیو گیم شو 2026. استانیسلاو کوگیکو/SOPA Images/LightRocket via Getty Images GTA 6 قرار است در 19 نوامبر عرضه شود و برای سهام ناشر آن یک امتیاز باشد. بانک آمریکا می‌گوید Take-Two برای کسب درآمد با سوخت GTA آماده است. BofA گفت: این فقط فروش بازی نیست، بلکه GTA Online است که درآمد را افزایش می دهد. 19 نوامبر رویدادی را رقم می زند که برخی از گیمرها بیش از یک دهه منتظر آن بوده اند، اما همچنین باید تاریخی باشد که سرمایه گذاران آن را در تقویم خود ثبت کنند. ما در مورد انتشار Grand Theft Auto 6، حماسه جنایی گسترده Rockstar Games صحبت می کنیم که قرار است بزرگترین عرضه بازی ویدیویی در سال های اخیر باشد. طرفداران آنقدر برای قسمت جدید هیجان زده هستند که برخی از هم اکنون قصد دارند از محل کار خود مرخصی بگیرند تا آن را در روز انتشار پخش کنند. اما طبق گفته بانک آمریکا، سرمایه‌گذاران نیز باید آماده باشند، زیرا انتشار این بازی می‌تواند یک کاتالیزور محرک رشد برای Take-Two Interactive، شرکت مادر توسعه‌دهنده GTA باشد. BofA در یادداشتی خطاب به سرمایه گذاران نوشت: «توصیه می‌کنیم تا زمان عرضه GTA 6 طولانی باشد. ما معتقدیم که رشد LT به زودی آشکار خواهد شد، ارزان است.\" تا کنون سال خوبی برای Take-Two نبوده است. مجموعه این شرکت همچنین شامل فرنچایز بازی های ورزشی محبوب 2K، Gearbox Entertainment و سازنده بازی های موبایل محبوب Zynga می شود، اما سهام تا به امروز 21 درصد کاهش یافته است. BofA با اشاره به پتانسیل رشد ناشی از GTA، به ویژه کسب درآمد از حالت آنلاین بسیار محبوب آن، که به گفته تحلیلگران ممکن , and Ohio Passenger Terminal in Mobile, Alabama, which has Spanish influences with its cream walls and red clay tiles, was designed by P. Thornton Marye. It was completed in 1907 and has undergone restoration since passenger train service ceased in the 1950s. ALASKA: The University of Alaska s Museum of the North pabradyphoto/Getty Images The University of Alaska Museum of the North is home to numerous exhibits showcasing the native cultures , natural wonders , and wildlife of our nation's largest state. It's also a stylish refuge from the cold. ARIZONA: Chapel of the Holy Cross The Chapel of the Holy Cross sits on a hillside. ANNA WILCZYNSKA/Getty Images/iStockphoto The Chapel of the Holy Cross in Sedona was completed in 1956, and it juts majestically from a red stone butte, some 200 feet above the ground. ARKANSAS: Thorncrown Chapel BanyanRanchStudios/Getty Images/iStockphoto The beautiful Thorncrown Chapel in Eureka Springs looks like an open-air structure, but it's actually a serene, glass-enclosed archite", "date_str": "2026-10-27T16:43:10+00:00", "hash": "d799782f1d9e7c1a", "title_fa": "جالب‌ترین ساختمان در هر ایالت ایالات متحده، از املاک تاریخی گرفته تا طرح‌های آینده‌نگر", "summary_fa": "موزه هنر سالوادور دالی در سنت پترزبورگ، فلوریدا، یکی از جالب‌ترین ساختمان‌های آمریکاست. جفری گرینبرگ/گروه یونیورسال تصاویر از طریق گتی ایماژ ایالات متحده دارای معماری و طرح های ساختمانی متنوعی در 50 ایالت است. تاریخ، هنر و زیبایی‌شناسی محلی همگی در برخی از منحصربه‌فردترین ساختمان‌های آمریکا منعکس شده‌اند. از خانه‌های ماقبل تاریخ گرفته تا طراحی‌های زیبا، این ساختمان‌ها جاذبه‌های گردشگری منحصربه‌فردی را ایجاد می‌کنند. در طول تاریخ 250 ساله خود، ایالات متحده معماری منحصر به فردی را تولید کرده است که در هیچ جای دیگری نمی توانید آنها را پیدا کنید - و بسیاری از آنها می توانند در خطوط ایالتی به شدت متفاوت به نظر برسند. تعریف آنچه که ما \"جالب ترین\" را در نظر می گیریم دشوار است. ما هر ایالت را بر اساس شرایط خاص خود ارزیابی کردیم و دریافتیم که معماری در تمام 50 ایالت و واشنگتن دی سی می تواند به اندازه جمعیت کشور متنوع باشد. در ایالت‌هایی مانند کالیفرنیا و ماساچوست، انتخاب برجسته‌ترین ساختمان‌ها به معنای یافتن ساختمان‌هایی بود که آینده‌نگر و زیبا به نظر می‌رسند، مانند چیزی خارج از یک فیلم علمی تخیلی. در ایالت‌های دیگر، مانند مین و کارولینا، متوجه شدیم که جالب‌ترین ساختمان‌ها به دلیل جایگاهشان در تاریخ یا فرهنگ ایالت‌هایشان متمایز هستند. چه به دنبال قطعه‌ای از تاریخ باشید یا نگاهی اجمالی به آینده، این ساختمان‌ها می‌توانند به شما نشان دهند که جهان‌های مختلف چگونه هستند. جیمز گریبی و جیکوب شمسیان در نسخه قبلی این داستان مشارکت داشتند. آلاباما: پایانه مسافربری خلیج، موبایل و اوهایو جورج داد/گتی ایماژ ترمینال مسافربری خلیج، موبایل و اوهایو در موبایل آلاباما، که دارای تأثیرات اسپانیایی با دیوارهای کرم و کاشی‌های سفالی قرمز است، توسط P. Thornton Marye طراحی شده است. در سال 1907 تکمیل شد و از زمان توقف خدمات قطار مسافربری در دهه 1950، تحت بازسازی قرار گرفت. آلاسکا: موزه شمال دانشگاه آلاسکا", "image_url": "https://i.insider.com/69f26707402f8423cd99c12b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۲۰:۱۳"}, {"source": "Business Insider", "title": "'Tactical short-term entry, long-term wait-and-see': What retail investors are saying about buying Anthropic on day one", "link": "https://www.businessinsider.com/anthropic-stock-ant-ipo-finances-retail-investors-2026-10", "summary": "Retail investors are split on whether to invest in Anthropic s IPO, with some raising concerns about the tech giant s finances and sprawling web of billion-dollar deals. Chris Ratcliffe/Bloomberg via Getty Images Retail investors say they're torn about whether to invest in Anthropic's IPO. They raised concerns about the firm's finances, complex web of deals, and a shakier AI trade. Sentiment has whipsawed lately, with fears rising about the pace of AI capex and future demand. On the cusp of a historic IPO from Anthropic , the retail crowd is still mulling whether it makes sense to jump in on day one. The market has been buzzing about Anthropic's debut as investors and AI watchers pore over the company's prospectus. With key details about the its finances available for the first time, retail traders say they're torn over whether to buy early or wait and see how the stock and the wider AI trade fare following the IPO. Anthropic's IPO is different from SpaceX's blockbuster offering this summer in a way that's hugely relevant for self-directed investors: as of the S-1 filing, there's no outsize chunk of stock set aside for retail, unlike SpaceX, which set aside 20%. That might be why investors who spoke with Business Insider are feeling cooler about the offering, though their hesitation can also be chalked up to recent c oncerns about AI that have roiled some of the hottest stocks in the last few weeks. Some investors say they aren't deterred by a potential stock drop, while others plan to stay away from the stock altogether as they hold out for more clarity about Anthropic's finances and its business outlook . Walid Diab, a consultant and investor based in the United Arab Emirates, is among those who said he's looking to put a large amount of cash in Anthropic. He told Business Insider he plans to invest around $30,000 to $50,000 in the AI giant, hoping to ride a wave of forced-buying higher as passive funds, which track indexes like the Nasdaq, purchase shares of the company. But he plans to sell most of the shares not long after, hoping to make a speedy exit when he senses the hype is about to fade. Walid Diab, an investor based in the UAE, says he ll be participating in Anthropic s IPO by making a tactical short-term trade. Courtesy of Walid Diab Diab made a similar move with SpaceX's IPO , and sees a handful of reasons that Anthropic isn't a long term investment for him. For one, the company choosing to go public now looks like a \"calculated window-of-opp", "date_str": "2026-10-27T16:09:51+00:00", "hash": "280d4b4784de3451", "title_fa": "\"ورود کوتاه مدت تاکتیکی، انتظار و دید بلند مدت\": سرمایه گذاران خرده فروشی در مورد خرید آنتروپیک در روز اول چه می گویند", "summary_fa": "سرمایه‌گذاران خرد در مورد سرمایه‌گذاری در IPO آنتروپیک اختلاف نظر دارند، و برخی نگرانی‌ها را در مورد امور مالی غول فناوری و شبکه گسترده معاملات میلیارد دلاری افزایش می‌دهند. کریس رتکلیف/ بلومبرگ از طریق گتی ایماژ سرمایه گذاران خرد می گویند که در مورد سرمایه گذاری در عرضه اولیه سهام آنتروپیک تردید دارند. آنها نگرانی هایی را در مورد امور مالی شرکت، شبکه پیچیده معاملات و تجارت متزلزل تر هوش مصنوعی مطرح کردند. احساسات اخیراً افزایش یافته است و نگرانی ها در مورد سرعت سرمایه گذاری هوش مصنوعی و تقاضای آینده افزایش یافته است. در آستانه عرضه اولیه اولیه سهام آنتروپیک، خرده‌فروشان همچنان در حال بررسی این موضوع هستند که آیا ورود در روز اول منطقی است یا خیر. در حالی که سرمایه گذاران و ناظران هوش مصنوعی بر روی دفترچه این شرکت سر و صدا می کنند، بازار در مورد اولین فعالیت آنتروپیک شلوغ شده است. با توجه به جزئیات کلیدی در مورد امور مالی آن برای اولین بار، معامله گران خرده فروشی می گویند که در مورد خرید زودهنگام یا صبر کردن و اینکه ببینند سهام و کرایه تجارت گسترده تر هوش مصنوعی پس از IPO چگونه است دچار مشکل شده اند. عرضه اولیه سهام آنتروپیک با عرضه پرفروش اسپیس ایکس در تابستان امسال متفاوت است، به گونه ای که برای سرمایه گذاران خودگردان بسیار مرتبط است: از زمان ثبت S-1، برخلاف اسپیس ایکس که 20 درصد را کنار گذاشته بود، هیچ بخش بزرگی از سهام برای خرده فروشی کنار گذاشته نشده است. شاید به همین دلیل است که سرمایه‌گذارانی که با Business Insider صحبت کرده‌اند نسبت به این پیشنهاد خنک‌تر احساس می‌کنند، اگرچه تردید آنها را می‌توان با نگرانی‌های اخیر در مورد هوش مصنوعی که برخی از داغ‌ترین سهام‌ها را در چند هفته اخیر به هم ریخته است، کاهش داد. برخی از سرمایه گذاران می گویند که", "image_url": "https://i.insider.com/6ae09b858e95884e1ca83987?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "سرمایه‌گذاری", "بورس و طلا"], "datetime_fa": "۵ آبان • ۱۹:۳۹"}, {"source": "Business Insider", "title": "United CEO Scott Kirby says he had an 'epiphany' after hiring an AI tutor and vibe-coding a sports betting tool", "link": "https://www.businessinsider.com/united-ceo-scott-kirby-ai-tutor-vibe-coded-gambling-tool-2026-10", "summary": "United Airlines CEO Scott Kirby. Melissa Phillip/Houston Chronicle via Getty Images United CEO Scott Kirby says that so far he has found AI most useful for vibe coding. \"I can read my calendar. I don't need to summarize my day,\" he told the \"Cheeky Pint\" podcast. Kirby said he had an \"epiphany\" after vibe-coding a sports-gambling tool. United Airlines CEO Scott Kirby loves gambling, and now he's using AI as an ace up his sleeve. Speaking on the \"Cheeky Pint\" podcast, Kirby said that over the past eight months, he's had an \"AI epiphany\" about the tech's best uses, which was triggered by one of his favorite pastimes — sports betting. \"Summarizing documents and all that crap, I think it's ridiculous,\" Kirby said. \"I can read my calendar. I don't need to summarize my day.\" Instead, he has found vibe coding far more valuable . Kirby told \"Cheeky Pint\" host and Stripe cofounder John Collison that he hired a tutor for three hourlong sessions, then used AI to make a webpage for sports gambling. \"I've always been into gambling. For better or worse,\" Kirby said. Between sets in a two-and-a-half-hour gym session, he typed prompts on his iPad to vibe-code a page with \"four or five\" drop-down menus for different sports, dates, and bets. Kirby said it links to four sportsbooks and pulls up the best odds; then he can enter a dollar amount, and it places the bet for him. \"I could do it with three hours of tutoring on my own, could write a program to do that, was an epiphany for me,\" Kirby said. \"I think I called them on that Saturday, our team, and like, 'We're all in on this.'\" His appetite for risk has helped Kirby make bets on airline strategy that have paid off. For example, when carriers around the world retired their airplanes during the pandemic , United instead ordered hundreds of new jets — buoying the airline when travel demand boomed after lockdowns ended. The United CEO previously spoke about his love for gambling in an April interview with The Wall Street Journal, where he described being kicked out of casinos for counting cards before he started in the airline industry. He told \"Cheeky Pint\" that he went back to Las Vegas when the Super Bowl was held there in 2024. After setting up a credit line to play poker, he had to hand over his ID. \"It was like 15 years ago that I got barred at the Bellagio last time,\" he said. \"The manager comes over, and he's like, 'Mr. Kirby, you're welcome to play any game in the casino, but just so you know, still no blackjack.'\" ", "date_str": "2026-10-27T16:09:01+00:00", "hash": "4dca256dd910817e", "title_fa": "اسکات کربی، مدیرعامل یونایتد می‌گوید که پس از استخدام یک معلم هوش مصنوعی و کدنویسی یک ابزار شرط‌بندی ورزشی، دچار «تجلی» شده است.", "summary_fa": "مدیر عامل شرکت هواپیمایی یونایتد اسکات کربی. ملیسا فیلیپ/هوستون کرونیکل از طریق گتی ایماژ یونایتد، اسکات کربی، مدیر عامل شرکت می‌گوید که تا کنون هوش مصنوعی را برای برنامه‌نویسی ویبب مفیدتر دانسته است. او به پادکست \"Cheeky Pint\" گفت: \"من می توانم تقویمم را بخوانم. نیازی نیست روزم را خلاصه کنم.\" کربی گفت که پس از کدنویسی یک ابزار ورزشی-قمار، یک \"تجلی\" داشته است. اسکات کربی، مدیرعامل United Airlines عاشق قمار است و اکنون از هوش مصنوعی به عنوان یک آستین در آستین خود استفاده می کند. کربی در صحبت در پادکست \"Cheeky Pint\" گفت که در طول هشت ماه گذشته، او یک \"تصویر هوش مصنوعی\" در مورد بهترین کاربردهای این فناوری داشته است که توسط یکی از سرگرمی های مورد علاقه او - شرط بندی ورزشی - آغاز شده است. کربی گفت: «به نظر من جمع بندی اسناد و این همه مزخرف مسخره است. \"من می توانم تقویمم را بخوانم. نیازی نیست روزم را خلاصه کنم.\" در عوض، او کدنویسی vibe را بسیار ارزشمندتر یافته است. کربی به جان کولیسون مجری و یکی از بنیانگذاران «Cheeky Pint» گفت که یک معلم خصوصی را برای سه جلسه یک ساعته استخدام کرد، سپس از هوش مصنوعی برای ایجاد یک صفحه وب برای قمار ورزشی استفاده کرد. کربی گفت: \"من همیشه به قمار علاقه داشتم. خوب یا بد.\" بین ست‌ها در یک جلسه دو و نیم ساعته ورزشگاه، او پیام‌هایی را در iPad خود تایپ کرد تا صفحه‌ای را با «چهار یا پنج» منوی کشویی برای ورزش‌ها، تاریخ‌ها و شرط‌بندی‌های مختلف کدگذاری کند. کربی گفت که به چهار کتاب ورزشی مرتبط است و بهترین شانس را دارد. سپس او می تواند مبلغ دلاری را وارد کند و شرط را برای او قرار می دهد. کربی می‌گوید: «من می‌توانم این کار را با سه ساعت تدریس خصوصی انجام دهم، می‌توانم برنامه‌ای بنویسم که", "image_url": "https://i.insider.com/6ae0b92d3ae265b597b027ea?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۵ آبان • ۱۹:۳۹"}, {"source": "Business Insider", "title": "At first, moving to the UK felt like a dream come true. Five years in, I realized it wasn't for me.", "link": "https://www.businessinsider.com/dreamed-of-living-europe-moved-to-england-left-2026-10", "summary": "In some ways, the reality of living in the UK was different from what I imagined. Maria Polansky As a Canadian, I dreamed of living in Europe — and then, I finally got the chance to move there. There were parts of my new life I loved, but I missed Canada more than I expected. After five years, I moved back to Canada with a new appreciation for my home. I first fell in love with the idea of Europe when I was 14. My mom and I went on a trip to Russia to visit relatives, and Moscow won me over with its grand boulevards and trendy cafés. We also stopped in London, where we explored the city's central neighborhoods and shopped in stores I'd only read about in fashion magazines back home. I was amazed by everything. I was convinced Europe was better — more aesthetically pleasing, more interesting — than my hometown of Vancouver , and vowed to go back as often as I could. By my early 20s, I was traveling to Europe almost every summer. My sister had moved to France , so I had a great excuse to visit: I'd stay with her in Paris and later Toulouse, and I'd also check out other destinations like Spain and Italy when I could. I became more enamored with the continent with each trip. Like so many North Americans, I considered it somewhat of a utopia where the overall lifestyle is healthier, the food is more delicious, and everything is more beautiful. Love gave me the opportunity to live in Europe After falling in love with a Brit, I was excited to leave Canada for the UK. Maria Polansky In 2018, at age 26, I met and fell in love with a Brit who was living in Vancouver. When his Canadian working-holiday visa expired, we started a long-distance relationship — and I applied for a British visa so we could be together. After years of romanticizing the continent on vacations, my dream was finally coming true. I moved to Birmingham and got a UK-based job. My first year there was great. I loved being surrounded by historic architecture, feeling comfortable dressing up in fancier clothes, and knowing that countries like Spain, Italy, and Greece were just a quick flight away. But eventually, the novelty started wearing off. Things I initially found so charming became mundane after a few years. The old buildings blurred into the background of my daily commute , and I never quite adjusted to certain cultural differences, like the Brits' less direct communication style. I also started to miss the things I took for granted back home, like easy access to the ocean and mountains. Bac", "date_str": "2026-10-27T16:03:01+00:00", "hash": "e61d97ee4b38af8f", "title_fa": "در ابتدا، مهاجرت به انگلستان مانند یک رویا بود. پنج سال بعد، متوجه شدم که این برای من نیست.", "summary_fa": "از برخی جهات، واقعیت زندگی در بریتانیا با آنچه من تصور می کردم متفاوت بود. ماریا پولانسکی به عنوان یک کانادایی، رویای زندگی در اروپا را در سر می پروراندم – و سپس، سرانجام این شانس را پیدا کردم که به آنجا نقل مکان کنم. بخش هایی از زندگی جدیدم بود که دوست داشتم، اما بیش از آنچه انتظار داشتم دلم برای کانادا تنگ شده بود. پس از پنج سال، با قدردانی جدیدی از خانه ام به کانادا بازگشتم. من اولین بار در 14 سالگی عاشق ایده fficers on the street asking me where my parents are. There have been several times when I arrived at a youth support group for my job, but the receptionist assumed I was one of the teen clients. It doesn't exactly inspire confidence. I'm 30, but between my youthful features and my 5-foot-1 height, I am often told I look like a teenager. Many people consider looking young a dream, and it's even a goal for skincare aficionados. In reality, though, I believe it's made parts of my life — especially my professional life — considerably more difficult. I've found it's tough to be taken seriously when you look half your age I don t enjoy regularly being mistaken for a 15-year-old. Courtesy of Ayman Eckford I have several years of experience providing peer support for individuals with autism and ADHD; helping develop mental-health programs; and leading projects addressing issues faced by refugees, the LGBTQ+ community, and people with disabilities in several countries. And yet, because of how I look, I still struggle with confidence and worry about being taken seriously at work . Often, before I've even had the chance to properly introduce myself when interviewing for a job or meeting new people, I'm concerned my appearance has already shaped how I'm perceived. Looking like a teen feels like an even bigger obstacle when I'm applying for higher-level and leadership roles, especially because most of the work I do involves peer support or management. A manager is expected to be wise and knowledgeable — qualities not usually", "date_str": "2026-10-27T15:08:01+00:00", "hash": "fe7c8f650e20f27f", "title_fa": "من 30 ساله هستم اما با 15 اشتباه گرفته می شوم. جوان به نظر رسیدن ممکن است عالی به نظر برسد، اما زندگی حرفه ای و جستجوی شغل من را سخت تر کرده است.", "summary_fa": "اگرچه بسیاری از مردم فکر می کنند جوان به نظر رسیدن عالی است، اما متوجه شدم که این کار برای من چالش هایی ایجاد کرده است. با حسن نیت ایمن اکفورد من 30 سال سن دارم، اما جوان به نظر می رسم و اغلب با نیمی از سنم اشتباه
