ه برای ایجاد زیرساخت های هوش مصنوعی - بسیاری از سهام مرتبط با تجارت هوش مصنوعی، از جمله شرکت های تراشه و شرکت های ابری را در چند هفته گذشته تحت تاثیر قرار داده است. سرمایه‌گذاران قیمت‌های خود را به سطوح نجومی بر اساس رشد مورد انتظار آینده افزایش داده‌اند، اما اکنون نگران هستند که کاهش بالقوه هزینه‌های هوش مصنوعی می‌تواند این انتظارات را کاهش دهد. در همین حال، سهام باکیفیت تمایل به کسب و کارهای تثبیت شده و سابقه رشد درآمد دارند و بنابراین نوسانات کمتری دارند. وال استریت فکر می‌کند با توجه به نگرانی‌ها در مورد قدرت ماندگاری تجارت ساخت هوش مصنوعی، زمان بسیار خوبی برای قرار گرفتن در معرض فاکتور کیفیت است. مورگان استنلی هفته ها است که این عامل را در یادداشت های مشتری خود برجسته کرده است و روز دوشنبه دوباره این معامله را تایید کرد. این به گسترش بازنگری سود بین سهام با کیفیت بالا و سهام با کیفیت پایین اشاره کرد. سهام با کیفیت"}, {"source": "Business Insider", "title": "I created 'Diary of a Wimpy Kid.' A good day is when I get my to-do list under 200 items — here's my routine.", "link": "https://www.businessinsider.com/jeff-kinney-author-diary-of-a-wimpy-kid-power-hours-2026-10", "summary": "Simon Simard for BI This as-told-to essay is based on a conversation with Jeff Kinney, the 55-year-old author of the \"Diary of a Wimpy Kid\" series, who lives in Plainville, Massachusetts. It has been edited for length and clarity. Every year, when a new \"Diary of a Wimpy Kid\" book hits the shelves, I'm surprised that kids keep showing up. I started writing the first book in 1998, while working as a computer programmer and game designer. I wanted to be a newspaper cartoonist, but that didn't work out, so I set out to get my cartoons published somehow. I was inspired by my own childhood experiences. The first generation of kids who read my books is now almost 30 years old. It's wild to me that there's a new generation of kids encountering these books and finding them fresh. Business Insider's Power Hours series gives readers an inside look at how powerful people structure their workday. Reach out to editor Lauryn Haas to share your daily routine. As an author, I work within a few different spheres: books, my bookstore, movies, and development. I hop from one area to another. Here's a day in my life. I wake up before 7 a.m. I don't set an alarm, so I wake up at that time naturally every day. I stay in bed for a while because after an ankle injury, I have some PT to do, like ankle stretches, while I'm in bed. I meditate for about 10 minutes, set my intentions for the day, and organize my digital to-do list before I get out of bed. I do two hours of exercise before breakfast Right after I get up, I do about two hours of PT yoga, then weightlifting. I do that before I eat breakfast, which is often eggs and sausages. I'm really committed to my morning physical routine of PT, PT yoga, and exercise. That's now become non-negotiable. I also do some journaling because it orients me toward the day, and it's a calming mechanism. I've just had my most productive year, during which I wrote two books and two screenplays, so I attribute that to my morning routine. It grounds me. I stay organized with a habit tracker I've tried a million different to-do list apps that didn't work, including the pomodoro method and all sorts of others. Then I found a digital habit tracker . Simon Simard for BI I'm pretty diligent about checking off my daily habits. These include eating enough fiber, drinking enough water, waking up by a certain time, meditating, and doing stretches and yoga. My workday starts at around 9:30 a.m. I have about five or six workspaces, and I like to balance betw", "date_str": "2026-10-20T09:05:01+00:00", "hash": "1aac40b889d9cf0a", "title_fa": "من «دفتر خاطرات یک بچه بی‌نظم» را ساختم. یک روز خوب زمانی است که فهرست کارهایم را کمتر از 200 مورد دریافت کنم - این برنامه روتین من است.", "summary_fa": "سایمون سیمارد برای BI این مقاله گفته شده بر اساس گفتگو با جف کینی، نویسنده 55 ساله مجموعه \"دفترچه خاطرات یک بچه عجول\" است که در پلین ویل، ماساچوست زندگی می کند. برای طول و وضوح ویرایش شده است. هر سال، وقتی کتاب جدیدی با عنوان «دفترچه خاطرات یک بچه بی‌عیب» وارد قفسه‌ها می‌شود، از حضور بچه‌ها متعجب می‌شوم. نوشتن اولین کتاب را در سال 1377 و همزمان با کار برنامه نویس کامپیوتر و طراح بازی شروع کردم. می خواستم کاریکاتوریست روزنامه شوم، اما نشد، بنابراین تصمیم گرفتم کاریکاتورهایم را به نحوی منتشر کنم. من از تجربیات دوران کودکی خودم الهام گرفتم. نسل اول بچه‌هایی که کتاب‌های من را می‌خوانند اکنون تقریباً 30 سال دارند. برای من عجیب است که نسل جدیدی از بچه ها با این کتاب ها روبرو می شوند و آنها را تازه می یابند. مجموعه «ساعت‌های نیرو» Business Insider به خوانندگان نگاهی درونی می‌دهد که چگونه افراد قدرتمند روز کاری خود را ساختار می‌دهند. با ویرایشگر لورین هاس تماس بگیرید تا کارهای روزمره خود را به اشتراک بگذارید. به عنوان یک نویسنده، من در چند حوزه مختلف کار می کنم: کتاب، کتابفروشی، فیلم، و توسعه. من از یک منطقه به منطقه دیگر می پرم. اینجا یک روز از زندگی من است. من قبل از ساعت 7 صبح از خواب بیدار می شوم، زنگ نمی زنم، بنابراین هر روز به طور طبیعی در آن ساعت از خواب بیدار می شوم. من مدتی در رختخواب می مانم زیرا بعد از آسیب دیدگی مچ پا، در حالی که در رختخواب هستم، مقداری PT مانند کشش مچ پا باید انجام دهم. حدود 10 دقیقه مدیتیشن می‌کنم، اهدافم را برای روز تعیین می‌کنم و قبل از بلند شدن از رختخواب فهرست کارهای دیجیتالی خود را مرتب می‌کنم. من دو ساعت قبل از صبحانه ورزش می کنم درست بعد از بیدار شدن،"}, {"source": "Business Insider", "title": "South Korea's stock market is flashing another warning about the AI trade", "link": "https://www.businessinsider.com/kospi-stock-index-price-today-sk-hynix-samsung-elice-ipo-2026-10", "summary": "The Kospi s sharp reversal shows how volatile South Korea s AI-fueled stock rally has become. Chris Jung/NurPhoto/Getty Images South Korea's Kospi sank 4% as Samsung and SK Hynix extended the AI-stock selloff. AI cloud firm Elice crashed 32% in its market debut, despite frenzied demand for its IPO. The rout is another warning that investors are reassessing the AI trade's sky-high valuations. South Korea's AI-stock rout deepened Tuesday as Elice, a cloud-infrastructure company, crashed 32% in its market debut. The benchmark Kospi index closed 4% lower, despite a rebound in Wall Street tech stocks on Monday. Index heavyweights Samsung Electronics and SK Hynix fell 3% and 4%, respectively. South Korean chipmakers are major suppliers of memory used in AI systems, making their shares a closely watched gauge of the global AI boom. The Kospi's latest selloff marks another blow for a market that has swung from boom to a nearly 40% bust in just four months. The turmoil has also hit companies hoping to capitalize on the AI boom. Elice, a South Korean company that rents out computing power for AI workloads, closed at 61,500 won on the Kosdaq, far below its IPO price of 90,500 won. The company raised about 201 billion won, or $151 million, in the Kosdaq's largest IPO this year. The company's disastrous debut came despite overwhelming demand, with institutional and retail subscriptions topping available shares by roughly 400 times. But Elice's IPO valued it far more richly than similar AI cloud companies, whose shares had already lost 20% to 60% over the preceding month, Tan wrote. Similar concerns are rippling through AI infrastructure markets well beyond South Korea. US-listed CoreWeave, which rents AI computing power, saw its shares and bonds tumble last week amid concern about its debt-fueled expansion. Nvidia-backed Firmus, meanwhile, withdrew its planned $5 billion Australian IPO, citing volatile market conditions. Read the original article on Business Insider", "date_str": "2026-10-20T08:49:11+00:00", "hash": "0c536819169b995c", "title_fa": "بازار سهام کره جنوبی هشدار دیگری درباره تجارت هوش مصنوعی دارد", "summary_fa": "معکوس شدن شدید کوسپی نشان می دهد که افزایش سهام کره جنوبی با سوخت هوش مصنوعی تا چه اندازه بی ثبات شده است. کریس جونگ/نورعکس/گتی ایماژز با افزایش فروش سهام هوش مصنوعی سامسونگ و SK Hynix، Kospi کره جنوبی 4 درصد سقوط کرد. شرکت ابر هوش مصنوعی Elice علیرغم تقاضای دیوانه وار برای عرضه اولیه سهام، در اولین بازار خود 32 درصد سقوط کرد. این شکست هشدار دیگری است مبنی بر اینکه سرمایه گذاران در حال ارزیابی مجدد ارزش گذاری های بسیار بالای تجارت هوش مصنوعی هستند. سقوط سهام هوش مصنوعی کره جنوبی روز سه شنبه عمیق تر شد زیرا Elice، یک شرکت زیرساخت ابری، در اولین بازار خود 32 درصد سقوط کرد. علیرغم افزایش مجدد سهام فناوری وال استریت در روز دوشنبه، شاخص کوسپی 4 درصد کاهش یافت. سامسونگ الکترونیکس و SK Hynix به ترتیب 3 و 4 درصد سقوط کردند. تراشه‌سازان کره جنوبی تامین‌کنندگان اصلی حافظه مورد استفاده در سیستم‌های هوش مصنوعی هستند و سهام آنها را به معیاری از رونق جهانی هوش مصنوعی تبدیل می‌کنند. آخرین فروش کوسپی، ضربه دیگری به بازاری است که تنها در چهار ماه از رونق به رکود نزدیک به 40 درصدی رسیده است. این آشفتگی همچنین به شرکت هایی ضربه زده است که امیدوارند از رونق هوش مصنوعی سرمایه گذاری کنند. Elice، یک شرکت کره جنوبی که قدرت محاسباتی را برای بارهای کاری هوش مصنوعی اجاره می‌دهد، در Kosdaq با قیمت 61500 وون بسته شد که بسیار پایین‌تر از قیمت اولیه عرضه اولیه 90500 وون آن است. این شرکت حدود 201 میلیارد وون یا 151 میلیون دلار را در بزرگترین IPO Kosdaq در سال جاری جذب کرد. اولین کار فاجعه‌بار این شرکت علی‌رغم تقاضای بسیار زیاد، با اشتراک نهادی و خرده‌فروشی تقریباً 400 برابر از سهام موجود بالاتر بود. تان نوشت، اما IPO Elice ارزش آن را بسیار بیشتر از شرکت‌های ابری"}, {"source": "Business Insider", "title": "Apple breaks its silence on the privacy crackdown that’s roiled the online ad industry", "link": "https://www.businessinsider.com/apple-explains-new-safari-ad-tracking-privacy-restrictions-2026-10", "summary": "John Ternus Apple is waging war on advertising identifiers. Benjamin Fanjoy/Getty Images Apple roiled the ad industry with an unexpected new crackdown on web trackers. The tech giant has now issued a rationale for why it's stamping out \"identity resolution.\" The ad industry has concerns Apple's latest privacy move may hamper targeting and measurement. Apple's latest privacy crackdown left the online ad industry scrambling for answers. Now, the tech giant has finally offered some. Late on Monday, Apple published a blog post laying out its rationale for new restrictions that block technology used to identify and track consumers across websites. The changes are implemented through WebKit, the browser engine that powers Safari and other browsers on iPhones and iPads. Apple said the change was designed to target \" identity resolution ,\" a method adtech companies use to connect separate data points about users — such as email addresses, phone numbers, IP addresses, browsing history, or information about the device they're using — to identify and track them across devices. The method grew in popularity as many web browsers, including Apple's Safari, began phasing out third-party tracking cookies , the small files dropped on a user's device that were traditionally used for web tracking. The ad industry deploys tracking to precisely target specific audiences and measure whether their campaigns are working. In its blog post , Apple said that while users might readily offer their email address to log in to a website or sign up for a newsletter, most wouldn't expect it to also be shared with other companies for invisible tracking purposes. \"It's not enough to block cross-site cookies to prevent cross-site tracking today because the tracking industry has not stopped trying to track users on the web,\" Apple said. \"They have ushered into what they call the post cookie era and in our latest releases we have put strong protection in place.\" The blog post explains that Apple is implementing \"domain-level\" blocking, a broad intervention designed to ensure that identity providers can't circumvent the restriction by changing how they send data. Apple took the adtech industry by surprise earlier this month when it came to light that it had begun blocking the domains operated by several companies that offer alternative identifiers, without warning. The blocked domains included those operated by The Trade Desk , LiveRamp, ID5, Permutive, and Audigent. The stakes are high for adte", "date_str": "2026-10-20T06:24:00+00:00", "hash": "b9039c873f6bfa1b", "title_fa": "اپل سکوت خود را در قبال سرکوب حریم خصوصی که صنعت تبلیغات آنلاین را تحت تأثیر قرار داده است، شکست", "summary_fa": "جان ترنوس اپل در حال جنگ با شناسه های تبلیغاتی است. بنجامین فانجوی/ گتی ایمیجز اپل صنعت تبلیغات را با یک سرکوب غیرمنتظره جدید در ردیاب های وب به هم ریخت. این غول فناوری اکنون دلیلی برای حذف \"تصویر هویت\" ارائه کرده است. صنعت تبلیغات نگرانی هایی دارد که آخرین اقدام اپل در زمینه حریم خصوصی ممکن است هدف گذاری و اندازه گیری را مختل کند. آخرین سرکوب حریم خصوصی اپل باعث شد صنعت تبلیغات آنلاین به دنبال پاسخ باشد. اکنون، غول فناوری سرانجام برخی از آنها را ارائه کرده است. اواخر روز دوشنبه، اپل یک پست وبلاگی منتشر کرد که در آن دلایل منطقی خود را برای محدودیت‌های جدید که فناوری مورد استفاده برای شناسایی و ردیابی مصرف‌کنندگان در سراسر وب‌سایت‌ها را مسدود می‌کند، منتشر کرد. این تغییرات از طریق WebKit، موتور مرورگری که سافاری و سایر مرورگرها را در آیفون‌ها و آیپدها قدرت می‌دهد، اجرا می‌شوند. اپل گفت که این تغییر برای هدف قرار دادن «تفکیک هویت» طراحی شده است، روشی که شرکت‌های تک‌تک برای اتصال نقاط داده‌ای جداگانه درباره کاربران - مانند آدرس‌های ایمیل، شماره تلفن، آدرس‌های IP، تاریخچه مرور، یا اطلاعات مربوط به دستگاهی که استفاده می‌کنند - برای شناسایی و ردیابی آن‌ها در دستگاه‌ها استفاده می‌کنند. محبوبیت این روش افزایش یافت زیرا بسیاری از مرورگرهای وب، از جمله سافاری اپل، شروع به حذف تدریجی کوکی‌های ردیابی شخص ثالث کردند، فایل‌های کوچکی که روی دستگاه کاربر رها می‌شد و به طور سنتی برای ردیابی وب استفاده می‌شد. صنعت تبلیغات، ردیابی را برای هدف قرار دادن دقیق مخاطبان خاص و اندازه‌گیری اینکه آیا کمپین‌های آنها کار می‌کند یا خیر، به کار می‌گیرد. اپل در پست وبلاگ خود گفت که اگرچه کاربران ممکن است به راحتی آدرس ایمیل خود را برای ورود به یک وب سایت یا ثبت نام در یک خبرنامه ارائه دهند، اکثر آنها انتظار ندارند"}, {"source": "Business Insider", "title": "Bono says U2 has got no problem with charging wealthy fans more to see the band live", "link": "https://www.businessinsider.com/bono-u2-ticket-prices-charging-rich-fans-more-2026-10", "summary": "Bono says U2 has long tried to keep its best concert seats within reach for fans. VALERY HACHE/AFP via Getty Images Bono says U2 has little say over what fans pay to see the band live. Still, the band has long tried to make prime seats more accessible. The band also has no issue with wealthier fans paying a premium, Bono says. For decades, U2 has sold out some of the world's biggest venues. Bono says the band has one longstanding way of making those shows more accessible. On The New York Times' \"The Interview\" podcast, Bono said U2 has \"very little\" say over ticket prices for its live shows. Still, he said, the band has long worked to make some front-row seats less expensive. \"What we do in our band is we take the best seats in the house — we've done this all our life — and make sure that they're often the most affordable,\" Bono said. That doesn't mean U2 objects to charging some fans a premium. \"We also have no problem separating rich people from their money,\" Bono said. \"You know, as we say, rich people have feelings, too. If they want to pay very high prices, we've no problem.\" Bono said the aim is for fans to feel good about what they are paying for. He said U2 shows have \"a level of depth\" where people who don't normally agree politically can \"feel safe.\" \"If they're in America, we want people to feel really good about the choice to pay a ticket — and probably pay too much for it — to see us,\" Bono said. U2 performed 40 nights at the Sphere in Las Vegas from September 2023 through March 2024. The official announcement said tickets for the residency started at $140, and that the venue's larger capacity would allow \"60% of tickets to be priced under $300,\" alongside a \"limited number of premium-priced tickets\" at each show. High ticket prices have become a defining feature of the modern concert experience. The average ticket price for the top 100 tours rose from $96.17 in 2019 to $132.62 in 2025, per data from Pollstar , a music industry trade publication. Dynamic pricing , which allows prices to rise with demand, has helped drive costs higher. On the secondary market , tickets can also be relisted at far higher prices than their original face value. There are also longstanding concerns about consolidation in the ticketing industry. In April, a federal jury found Live Nation liable for antitrust violations , determining that its market monopoly led Ticketmaster to overcharge customers by $1.72 per ticket from May 2020 to 2024. Sports fans are facing the", "date_str": "2026-10-20T05:46:42+00:00", "hash": "1f34ab38e34bf4da", "title_fa": "بونو می‌گوید U2 هیچ مشکلی با دریافت هزینه بیشتر از طرفداران ثروتمند برای دیدن زنده گروه ندارد", "summary_fa": "بونو می‌گوید U2 مدت‌هاست که سعی کرده بهترین صندلی‌های کنسرت خود را در دسترس طرفداران نگه دارد. والری هاچه/ خبرگزاری فرانسه از طریق گتی ایماژ بونو می‌گوید که U2 در مورد هزینه‌هایی که طرفداران برای دیدن زنده گروه پرداخت می‌کنند، نظر کمی دارد. با این حال، گروه مدت‌ها تلاش کرده است که صندلی‌های اصلی را در دسترس‌تر قرار دهد. بونو می‌گوید گروه همچنین با پرداخت حق بیمه طرفداران ثروتمندتر مشکلی ندارد. برای چندین دهه، U2 برخی از بزرگترین سالن های جهان را فروخته است. بونو می گوید که گروه یک راه دیرینه برای قابل دسترس تر کردن این برنامه ها دارد. بونو در پادکست «مصاحبه» نیویورک تایمز گفت که U2 در مورد قیمت بلیت برنامه‌های زنده‌اش حرف بسیار کمی دارد. او گفت که با این حال، گروه مدت‌هاست که برای ارزان‌تر کردن برخی از صندلی‌های ردیف جلو تلاش کرده است. بونو گفت: \"کاری که ما در گروه خود انجام می دهیم این است که بهترین صندلی های خانه را می گیریم - ما در تمام زندگی خود این کار را انجام داده ایم - و مطمئن می شویم که آنها اغلب مقرون به صرفه ترین هستند.\" این بدان معنا نیست که U2 مخالفت با دریافت حق بیمه برای برخی از طرفداران نیست. بونو گفت: «ما همچنین مشکلی برای جدا کردن افراد ثروتمند از پولشان نداریم. می دانید، همانطور که می گوییم، افراد ثروتمند نیز احساساتی دارند. اگر بخواهند قیمت های بسیار بالایی بپردازند، ما مشکلی نداریم. بونو گفت هدف این است که طرفداران احساس خوبی نسبت به چیزی که برای آن پرداخت می کنند داشته باشند. او گفت که نمایش‌های U2 «سطحی از عمق» دارند که در آن افرادی که معمولاً از نظر سیاسی موافق نیستند، می‌توانند «احساس امنیت کنند». بونو گفت: \"اگر آنها در آمریکا هستند، ما می خواهیم مردم در مورد انتخاب پرداخت بلیط - و احتمالاً هزینه"}, {"source": "Business Insider", "title": "An AI bust could come from places investors aren't watching, an economist says", "link": "https://www.businessinsider.com/ai-bubble-burst-stock-market-risks-politics-debt-chips-2026-10", "summary": "Wall Street is grappling with growing concerns about an AI bubble as investors question whether massive spending on the technology will deliver sufficient returns. Michael M. Santiago/Getty Images Concerns about an AI bubble are growing as investors question whether massive capex spending will pay off. TS Lombard warns that debt, a potential chip glut, and political backlash could threaten the AI trade. Much of AI's revenue growth still comes from spending within the industry itself, TS Lombard economist says. As concerns about an AI bubble mount, an economist is warning that investors may be overlooking other vulnerabilities in the boom. \"The trigger doesn't have to be endogenous to the boom. It could be external,\" wrote Dario Perkins, managing director of global macro at Global Data.TS Lombard, in a note on Monday. Perkins argues that much of the industry's revenue growth still comes from spending within the AI ecosystem rather than businesses and consumers paying for AI services. \"The question is whether those revenues are coming from businesses and end-users outside the ecosystem — presumably to pay for productivity-enhancing tools — or from simple capex recycling,\" he wrote. The warning comes after a recent chip-stocks selloff that has intensified concerns about whether massive AI infrastructure spending will pay off. Last week, the Philadelphia Semiconductor Index fell more than 11% before clawing back 2% on Monday. The weak links One potential fault line is debt outside Big Tech. While hyperscalers such as Microsoft, Amazon, and Google have strong balance sheets, smaller cloud providers, model developers, and infrastructure suppliers have been taking on increasing leverage. Perkins estimates that debt across parts of the AI ecosystem could reach $2 trillion by the end of 2027. He doesn't see AI-related debt as a systemic financial risk, but warned that earnings disappointments and canceled orders could ripple across the ecosystem. Even cash-rich hyperscalers could decide not to renew data center leases, leaving weaker companies exposed. Another risk is an unexpected chip glut, as companies reportedly over-order semiconductors to guard against shortages, potentially creating excess supply if demand slows. \"Let's not forget we are talking about tech hardware and chips, notoriously cyclical, and prone to bullwhip effects,\" Perkins wrote. Higher interest rates could further undermine the economics of AI investment, particularly for companies reliant on ", "date_str": "2026-10-20T05:43:42+00:00", "hash": "94ce53c5f294bb4f", "title_fa": "یک اقتصاددان می‌گوید سقوط هوش مصنوعی می‌تواند از مکان‌هایی باشد که سرمایه‌گذاران تماشا نمی‌کنند", "summary_fa": "وال استریت با نگرانی های فزاینده در مورد حباب هوش مصنوعی دست و پنجه نرم می کند زیرا سرمایه گذاران این سوال را مطرح می کنند که آیا هزینه های هنگفت برای این فناوری بازدهی کافی را به همراه خواهد داشت یا خیر. مایکل ام. سانتیاگو/ گتی ایماژ نگرانی ها در مورد حباب هوش مصنوعی در حال افزایش است زیرا سرمایه گذاران این سوال را مطرح می کنند که آیا هزینه های کلان سرمایه به نتیجه خواهد رسید یا خیر. TS Lombard هشدار می دهد که بدهی، مازاد تراشه های بالقوه و واکنش های سیاسی می تواند تجارت هوش مصنوعی را تهدید کند. اقتصاددان TS Lombard می‌گوید که بیشتر رشد درآمد هوش مصنوعی همچنان از هزینه‌های درون صنعت ناشی می‌شود. با توجه به افزایش نگرانی ها در مورد حباب هوش مصنوعی، یک اقتصاددان هشدار می دهد که سرمایه گذاران ممکن است آسیب پذیری های دیگر را در رونق نادیده بگیرند. داریو پرکینز، مدیر کلان جهانی در Global Data.TS Lombard، روز دوشنبه در یادداشتی نوشت: \"محرک نباید درون زا برای رونق باشد. ممکن است خارجی باشد.\" پرکینز استدلال می‌کند که بیشتر رشد درآمد صنعت همچنان از هزینه‌های درون اکوسیستم هوش مصنوعی ناشی می‌شود نه کسب‌وکارها و مصرف‌کنندگان که برای خدمات هوش مصنوعی هزینه می‌کنند. او می‌نویسد: «سوال این است که آیا این درآمدها از کسب‌وکارها و کاربران نهایی خارج از اکوسیستم - احتمالاً برای پرداخت هزینه‌های ابزارهای افزایش بهره‌وری - یا از بازیافت ساده Capex به دست می‌آید. این هشدار پس از فروش اخیر سهام تراشه‌ها منتشر شد که نگرانی‌ها را در مورد اینکه آیا هزینه‌های زیرساختی هنگفت هوش مصنوعی نتیجه خواهد داد یا خیر، تشدید کرد. هفته گذشته، شاخص نیمه هادی فیلادلفیا بیش از 11 درصد کاهش یافت و در روز دوشنبه 2 درصد کاهش یافت. حلقه های ضعیف یکی از خطاهای احتمالی بدهی خارج از فناوری بزرگ است. در"}, {"source": "Business Insider", "title": "Ukraine identified a slew of foreign parts in Russia's anti-jamming tech. Over 75% are American.", "link": "https://www.businessinsider.com/ukraine-foreign-parts-russian-anti-jamming-kometa-us-tech-2026-10", "summary": "The Geran-2 regularly uses the Kometa system to navigate Ukraine s skies and suppress electronic warfare. Sergei Grits/AP Photo A new Ukrainian list of foreign parts in Russia's anti-jamming antenna is filled with US electronics. GUR published a catalog of US digital processors, chips, and other components found in the Kometa. These arrays are used to help Shaheds and Iskander-M missiles navigate and suppress jamming. Over two dozen US processors, chips, and other components have been found in Russia's anti-jamming antenna systems, according to Ukraine's military intelligence. The Ukrainian agency, GUR, published a list of foreign parts on Monday that it said were discovered in 16-element Kometa modules, one of Russia's more advanced systems that help drones and ballistic missiles suppress electronic warfare and navigate the skies. US-headquartered firms produced 28 out of 37 foreign components — or just over three-quarters — listed on Monday, per GUR. Ten American brands and their components were identified in the catalog, posted on GUR's War and Sanctions page. These include digital processors from Intel subsidiary Altera, radio-frequency and precision components from Analog Devices, a memory chip from Micron, and supporting electronics from Texas Instruments. Another three components are built by Chinese companies, while the other six come from Japanese, Taiwanese, and Swiss manufacturers, GUR also indicated. In a statement to Business Insider, a Texas Instruments spokesperson said the company \"strongly opposes the use of our chips in Russian military equipment.\" \"Any shipments of TI chips into Russia are illicit and unauthorized. We devote significant time and resources to developing, implementing, and refining policies and procedures to combat illicit diversion and keep chips out of the hands of bad actors,\" they added. Intel, Analog Devices, and Micron did not immediately respond to requests for comment sent outside regular business hours by Business Insider. The new list from GUR, which regularly publishes information on foreign parts in Russian equipment , comes as the electronic warfare race grows more vital to Ukraine's air defense. Kyiv's forces try to stop Russian drone and missile attacks with a mix of jamming tools and interceptors, but the latter are facing difficulty as Moscow has begun mass-launching faster, jet-powered drones — the slowest of which can fly at about 185 mph. Kometa antenna panels are among the most common anti-jamming tool", "date_str": "2026-10-20T05:10:38+00:00", "hash": "7e44f615f876a5e5", "title_fa": "اوکراین تعداد زیادی از قطعات خارجی را در فناوری ضد پارگی روسیه شناسایی کرد. بیش از 75 درصد آمریکایی هستند.", "summary_fa": "Geran-2 به طور منظم از سیستم کومتا برای حرکت در آسمان اوکراین و سرکوب جنگ الکترونیک استفاده می کند. سرگئی گریتس/عکس AP فهرست جدید اوکراینی قطعات خارجی در آنتن ضد پارگی روسیه با وسایل الکترونیکی ایالات متحده پر شده است. GUR فهرستی از پردازنده‌های دیجیتال ایالات متحده، تراشه‌ها و سایر اجزای موجود در Kometa را منتشر کرد. این آرایه ها برای کمک به موشک های شاهد و اسکندر ام در جهت یابی و سرکوب پارازیت استفاده می شوند. بر اساس اطلاعات نظامی اوکراین، بیش از دوجین پردازنده، تراشه و سایر اجزای آمریکایی در سیستم‌های آنتن ضد پارگی روسیه یافت شده است. آژانس اوکراین، GUR، روز دوشنبه فهرستی از قطعات خارجی را منتشر کرد که گفت در ماژول‌های 16 عنصری کومتا، یکی از سامانه‌های پیشرفته‌تر روسیه که به هواپیماهای بدون سرنشین و موشک‌های بالستیک کمک می‌کند تا جنگ الکترونیک را سرکوب کنند و در آسمان حرکت کنند، کشف شده‌اند. شرکت های مستقر در ایالات متحده 28 قطعه از 37 قطعه خارجی - یا کمی بیش از سه چهارم - را تولید کردند که در روز دوشنبه فهرست شده بود، به ازای هر GUR. ده برند آمریکایی و اجزای آنها در کاتالوگ که در صفحه جنگ و تحریم های GUR منتشر شده است، شناسایی شدند. اینها شامل پردازنده های دیجیتالی از شرکت تابعه اینتل، Altera، قطعات فرکانس رادیویی و دقیق از دستگاه های آنالوگ، یک تراشه حافظه از Micron و لوازم الکترونیکی پشتیبانی از Texas Instruments است. سه قطعه دیگر توسط شرکت های چینی ساخته شده است، در حالی که شش قطعه دیگر از تولیدکنندگان ژاپنی، تایوانی و سوئیسی، GUR نیز اشاره کرد. در بیانیه ای به Business Insider، سخنگوی تگزاس اینسترومنتز گفت که این شرکت \"به شدت با استفاده از تراشه های ما در تجهیزات نظامی روسیه مخالف است.\" «هر گونه ارسال تراشه های TI به روسیه غیرقانونی و غیرمجاز است."}, {"source": "Business Insider", "title": "Cisco's president said he used personal AI agents to screen $9,000 worth of his yearly subscriptions", "link": "https://www.businessinsider.com/cisco-president-jeetu-patel-personal-ai-agents-cancel-subscriptions-2026-10", "summary": "Cisco s president and product chief, Jeetu Patel, shared how he s used personal AI agents. Bloomberg/Getty Images Cisco's president, Jeetu Patel, said he uses four or five of the most popular personal AI agents. One of them, which costs him $20 a month, recently saved him more than $1,000 in subscription bills. But he said it's important not to give personal AI agents access to work tools or resources. If getting mysterious and surprising subscription bills are the bane of your existence, Cisco's president and product chief, Jeetu Patel , is in the same boat. Patel told Business Insider that said he's been using four to five different personal AI agents , like Meta's Muse, Instinct, and OpenAI's Dots, for things like consolidating news, summarizing earnings calls, and even booking his daughter's concert tickets. But recently, he was impressed by how one agent could slash his subscription bills. He said that the first time he gave a personal AI agent access to his email, the agent told him, \"Hey, you've got $9,000 worth of subscriptions that you subscribe to per year. Are you sure you want all of these? It seems like a lot of subscriptions.\" He told the agent to make him a table of all his subscriptions, how much he spends on each, and how long he's had each. After the agent presented him with the table, he picked out two subscriptions that he didn't need and made the agent cancel them, which it did without difficulty, and sent him cancellation emails. \"I'm like, OK, that was kind of creepy how easy it was to do that,\" Patel said. \"And then it saved me 1,000, 1,200 bucks a year just over there. So basically, for the most part, I paid for that agent, at a $20-a-month plan, several times over.\" The agent also managed to cancel part of his Dropbox subscription — an $11.95 plan he had accidentally subscribed to, even though he had already purchased a 2-terabyte plan. Patel is a big fan of AI agents, both at work and outside it. He said he rarely starts any task now without asking an AI agent to do a \"recon job\" and give him research and context. But the important thing to remember, he said, was not to give personal AI agents, which are not vetted by employers, access to work tools and resources. He hasn't linked his email or calendar to his personal agents, instead using his internal work agent for those tasks. \"These are common-sense things that I think most companies implement, which is, 'Don't give your crown jewels of your source code repository to Muse; it", "date_str": "2026-10-20T04:52:19+00:00", "hash": "4bc8ebcb1975bd0b", "title_fa": "رئیس سیسکو گفت که از عوامل هوش مصنوعی شخصی برای بررسی 9000 دلار اشتراک سالانه خود استفاده کرده است.", "summary_fa": "جیتو پاتل، رئیس و مدیر تولید سیسکو، نحوه استفاده او از عوامل هوش مصنوعی شخصی را به اشتراک گذاشت. بلومبرگ/ گتی ایماژ، رئیس سیسکو، جیتو پاتل، گفت که از چهار یا پنج مورد از محبوب ترین عوامل هوش مصنوعی شخصی استفاده می کند. یکی از آنها که 20 دلار در ماه برای او هزینه دارد، اخیراً بیش از 1000 دلار در قبض های اشتراک او پس انداز کرد. اما او گفت مهم است که به عوامل هوش مصنوعی شخصی به ابزارها یا منابع دسترسی ندهیم. اگر دریافت صورت‌حساب‌های مرموز و غافلگیرکننده اشتراک، بلای جان شماست، رئیس و مدیر محصول سیسکو، جیتو پاتل، در همان قایق هستند. پاتل به Business Insider گفت که از چهار تا پنج عامل مختلف هوش مصنوعی مانند Meta's Muse، Instinct و OpenAI's Dots برای مواردی مانند ادغام اخبار، خلاصه کردن تماس های درآمدی و حتی رزرو بلیط کنسرت دخترش استفاده کرده است. اما اخیراً او تحت تأثیر قرار گرفت که چگونه یکی از نمایندگان می تواند قبض های اشتراک او را کاهش دهد. او گفت که اولین باری که به یک نماینده هوش مصنوعی شخصی اجازه دسترسی به ایمیل خود را داد، نماینده به او گفت: \"هی، شما 9000 دلار اشتراک دارید که در سال مشترک آنها می شوید. آیا مطمئن هستید که همه اینها را می خواهید؟ به نظر می رسد اشتراک های زیادی وجود دارد.\" او به نماینده گفت که جدولی از تمام اشتراک‌هایش برای او بسازد، اینکه برای هر کدام چقدر هزینه می‌کند و مدت زمانی که هر کدام را داشته است. بعد از اینکه نماینده جدول را به او داد، او دو اشتراک را که نیازی نداشت انتخاب کرد و نماینده را مجبور کرد آنها را لغو کند، که بدون مشکل انجام شد و برای او ایمیل های لغو ارسال کرد. پاتل گفت: \"باشه، خیلی وحشتناک بود که چقدر انجام این کار"}, {"source": "Business Insider", "title": "I sold my apartment, cashed out my pension, and took on debt to build a semiconductor startup. I'd do it again.", "link": "https://www.businessinsider.com/semiconductor-founder-sold-apartment-cashed-out-pension-financial-crisis-2026-10", "summary": "Hans Hasselby-Andersen spent nearly a year raising his first funding after leaving Texas Instruments during the financial crisis. Hans Hasselby-Andersen/Lotus Microsystems Hans Hasselby-Andersen quit Texas Instruments during the 2008 financial crisis with four young kids at home. He sold his apartment, cashed out his pension, and took on debt to build a semiconductor startup. Nine years later, his company, Merus Audio, was acquired by Infineon. This as-told-to essay is based on a conversation with Hans Hasselby-Andersen, 56, CEO of Danish semiconductor startup Lotus Microsystems and cofounder of Merus Audio, which was acquired by Infineon in 2018. The following has been edited for length and clarity. When I quit my job at Texas Instruments in September 2008 to start a semiconductor company, I had four children between the ages of 5 and 14. It was almost the height of the financial crisis. You had Lehman Brothers going down in flames in the US, and the whole credit market was just freezing up. So to jump out at that point and go into fundraising was a big, big step. My manager was looking at me like I was crazy, basically. Thinking back, probably I should have waited a year or so and just cooled off a little bit. But the thing is, once you have an idea and you're really motivated, you can't really wait. You have to go do something about it. I'm an electrical engineer by training. Earlier in my career, I joined a small startup that was acquired by Texas Instruments about five or six months after I arrived. The whole concept of a company being acquired, an exit and all that, was all new to me. It planted a seed in my head that, if the circumstances were right, this was also a path I could take, and not just build my career in a large company. I stayed at Texas Instruments and worked in the audio semiconductor business. I was picking up things from my interactions in the market where I thought there was actually a need for a much more energy-efficient way to drive speakers in products like portable speakers and soundbars. I saw a market need, but I didn't have the technical solution, so my first task was to go out and find a cofounder who could come up with a technical solution for that market. I think that's actually quite unusual for tech startups. Normally, somebody comes up with some technology, and then they go out and try to see where it can be applied. This was the opposite approach. Four kids, one big decision Just before I resigned, I called my bank a", "date_str": "2026-10-20T04:51:21+00:00", "hash": "06c413fbb30fddb4", "title_fa": "آپارتمانم را فروختم، حقوق بازنشستگی ام را نقد کردم و برای ساخت یک استارتاپ نیمه هادی بدهی گرفتم. دوباره انجامش میدم", "summary_fa": "هانس هاسلبی-اندرسن تقریباً یک سال را صرف جمع آوری اولین سرمایه خود پس از ترک تگزاس اینسترومنتز در طول بحران مالی کرد. Hans Hasselby-Andersen/Lotus Microsystems Hans Hasselby-Andersen در طول بحران مالی سال 2008 از تگزاس اینسترومنتز با چهار بچه در خانه کنار رفت. او آپارتمان خود را فروخت، حقوق بازنشستگی خود را نقد کرد و برای ایجاد یک استارتاپ نیمه هادی بدهی گرفت. نه سال بعد، شرکت او، Merus Audio، توسط Infineon خریداری شد. این مقاله گفته شده بر اساس گفتگو با هانس هاسلبی-آندرسن، 56 ساله، مدیرعامل استارت آپ نیمه هادی دانمارکی Lotus Microsystems و یکی از بنیانگذاران Merus Audio است که توسط Infineon در سال 2018 خریداری شد. موارد زیر برای طولانی و وضوح ویرایش شده است. هنگامی که در سپتامبر 2008 کارم را در تگزاس اینسترومنتز رها کردم تا یک شرکت نیمه هادی راه اندازی کنم، چهار فرزند بین 5 تا 14 ساله داشتم. تقریباً اوج بحران مالی بود. شما Lehman Brothers را در ایالات متحده در آتش گرفتید، و کل بازار اعتبار در حال یخ زدن بود. بنابراین پریدن در آن نقطه و رفتن به جمع آوری کمک های مالی یک گام بزرگ و بزرگ بود. مدیرم در اصل به من نگاه می کرد که من دیوانه هستم. به گذشته فکر می کنم، احتمالاً باید یک سال یا بیشتر صبر می کردم و فقط کمی خنک می شدم. اما مسئله این است که وقتی ایده ای دارید و واقعاً انگیزه دارید، واقعاً نمی توانید صبر کنید. باید بری یه کاری انجام بدی من با آموزش مهندس برق هستم. در اوایل کارم، به یک استارتاپ کوچک پیوستم که حدود پنج یا شش ماه پس از ورودم توسط تگزاس اینسترومنتز خریداری شد. کل مفهوم خرید یک شرکت، خروج و همه اینها برای من جدید بود. این بذری در سرم کاشت که اگر شرایط مساعد بود، این هم راهی بود"}, {"source": "Business Insider", "title": "The best fish oils for joint, skin, and coat health", "link": "https://www.businessinsider.com/guides/pets/best-fish-oils-for-dogs", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The best fish oils for dogs promote joint, skin, immune, and cardiovascular health. Lisa Sabatini/Business Insider The best fish oil for dogs can support your pet's health in several important ways. Studies show it may help with arthritis and joint health, skin allergies, coat health, immune function, and cardiovascular health. The omega-3 fatty acids DHA and EPA in fish oil have even been linked to increased trainability in puppies, says Dr. Emily Luisana, a board-certified veterinary nutritionist and cofounder of Peak Veterinary Specialists. For this guide, I consulted several veterinarians and an expert from the National Animal Supplement Council (NASC) about what defines a high-quality fish oil supplement. Before giving your dog any supplement, even over-the-counter products, talk to your veterinarian. Although the fish oils in this guide come with general dosage guidelines, your vet is the best person to determine the right amount for your dog. Our top pick at a glance After a thorough review of fish oil liquids, softgels, and chews, I selected Nordic Naturals Omega-3 Pet unflavored, nearly odorless liquid formula as my top pick. This liquid supplement delivers high levels of EPA and DHA from sustainably-sourced, wild ssed Death Valley in the middle of summer , and in 2005 set the record for the longest nonstop run — covering 350 miles in 80 hours and 44 minutes. Even that wasn't enough. \"I actually made it 350 miles, which was somewhat of a letdown because I thought maybe I could run 500 miles,\" Karnazes told me. \"That was kind of the ultimate goal.\" His world record still stands today, 21 years later. After decades of ultrarunning , Karnazes says he's learned that doing hard things comes down to a handful of simple habits that anyone can practice. Don't make winning the goal Dean Karnazes has traveled the world, running ultramarathons for more than 30 years. Courtesy of Dean Karnazes Karnazes has finished on the podium plenty of times, but he says that's never been what pulled him to the starting line. \"I do it for the adventure,\" he said. \"Both the inner and the outer adventure. I've never really said I want to win a race. I just thought, be the best Dean that Dean can be on race day.\" He says approaching races that way has changed how he defines success . The podium, if it comes, is just the cherry on top. That mindset, he says, has kept him motivated through hundreds of marathons and ultramarathons, long after chasing trophies stopped being interesting. Redefine what success looks like Karnazes ran 350 miles nonstop, setting the world record for the longest continuous run by any human. Courtesy of Dean Karnazes When Karnazes gives advice to new ultrarunners, he doesn't start with mileage or pace. \"Just set your goal on finishing,\" he said. \"Don't say I want to do it in sub five hours or sub six hours. Just say, 'For me, success is reaching the finish line before the cutoff.'\" Karnazes says that approach has a way of changing how you see your own limits. \"You'll prove to yourself that you're better than you think you are. And you can go further th", "date_str": "2026-10-19T19:02:24+00:00", "hash": "5ffca78e65c3c995", "title_fa": "اسطوره اولتراماراتون که 350 مایل
