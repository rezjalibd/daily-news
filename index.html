وعی آن بدهد. این یادآور یکی از با ارزش ترین ویژگی های اپل است: توانایی تشخیص خودکار کدهای تأیید ارسال شده از طریق متن و نمایش آنها در بالای صفحه کلید، که به کاربران امکان می دهد با یک ضربه آن را وارد کنند. همانند سایر ویژگی‌های هوش شخصی، کاربران می‌توانند تصمیم بگیرند که تکمیل خودکار پیشرفته را از تنظیمات Chrome خود فعال کنند یا خیر. گوگل اشاره می کند که داده های حساس رمزگذاری شده اند. این ویژگی برای کاربران آمریکایی روی دسکتاپ و در برنامه‌های iOS و Android برای Gemini در کروم در دسترس است. با آوردن یکی", "image_url": "https://techcrunch.com/wp-content/uploads/2026/10/autofill-ai-chrome.jpg?resize=1200,643", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Apple"], "datetime_fa": "۶ آبان • ۲۰:۳۰"}, {"source": "The Verge", "title": "Touchscreen MacBook live blog: On the ground at Apple’s launch event", "link": "https://www.theverge.com/tech/1019809/apple-touchscreen-macbook-pro-la-keynote-event-live-blog", "summary": "The MacBook Pro has looked mostly the same for several years now. And it’s never had a proper touchscreen. | Photo by Antonio G. Di Benedetto / The Verge Apple has already had a busy week. On Monday, it announced a new iPad Mini with an upgraded OLED display , and on Tuesday, we got M6 chip upgrades for the MacBook Pro and iMac . The Macs are the definition of iterative updates - they're quiet refreshes that look just like their direct predecessors. But today should be a whole lot more interesting. At an event in Los Angeles, Apple is expected to debut a revamped MacBook Pro with a touchscreen display . This would be the first touchscreen on a Mac (not counting the beleaguered Touch Bar ). Touchscreen laptops are something Apple executives have criticized for about as long as the iPad has existe … Read the full story at The Verge.", "date_str": "2026-10-28T16:33:32+00:00", "hash": "3f2404fb902365b0", "title_fa": "وبلاگ زنده مک بوک با صفحه لمسی: روی زمین در مراسم معرفی اپل", "summary_fa": "MacBook Pro چندین سال است که تقریباً یکسان به نظر  مصنوعی و تأثیر انقراض بشر بر سهامش می‌گوید.", "date_str": "2026-10-28T15:30:00+00:00", "hash": "66c892c6ddb472fb", "title_fa": "گزارش آنتروپیک برای بورس: هوش مصنوعی ما شاید نسل بشر را منقرض کند و به سود سهام آسیب بزند!", "summary_fa": "آنتروپیک در گزارش رسمی ورود به بورس، از خطرات تکان‌دهنده‌ای مثل خودآگاهی کلاد، باج‌گیری هوش مصنوعی و تأثیر انقراض بشر بر سهامش می‌گوید. تبلیغات شرکت‌ها معمولاً وقتی می‌خواهند وارد بورس شوند، نگران رقبای تجاری، نوسان بازار یا بالارفتن هزینه‌ها هستند؛ اما آنتروپیک در آستانه عرضه اولیه سهام خود (IPO)، دغدغه بسیار بزرگ‌تری دارد، اینکه هوش مصنوعی خودش نسل بشر را منقرض کند و این اتفاق ناگوار، روی سود سهام شرکت تأثیر منفی بگذارد. انتشار فرم S-1 آنتروپیک توسط کمیسیون بورس و اوراق بهادار آمریکا در روز دوشنبه، در ابتدا بحث‌های داغی درباره این به راه انداخت که آیا درآمدهای روبه‌رشد این شرکت حریف هزینه‌های به‌مراتب سنگین‌ترش خواهد شد یا خیر. اما خالق کلاد لابه‌لای ارقام مالی و خوش‌بینی‌های جسورانه درباره اینکه هوش مصنوعی «به‌سرعت تمام بخش‌های اقتصاد جهانی را عمیق‌تر از انقلاب صنعتی، برق، نیمه‌هادی‌ها و اینترنت متحول خواهد کرد»، حجم غیرمنتظره‌ای از گزارش رسمی‌اش را به ردیف‌کردن خطرات آخرالزمانی و تجاری عجیبی اختصاص داده که می‌توانند کل شرکت را به زمین بزنند. در طول ۹۳ صفحه و بیش از ۷۰ هزار کلمه، بخش عوامل ریسک گزارش آنتروپیک، به معنای واقعی کلمه صدها مشکل بالقوه را کالبدشکافی می‌کند که می‌توانند در سال‌های آینده کسب‌وکار این شرکت را با بحران روبه‌رو کنند. بسیاری از ریسک فاکتورها، همان دغدغه‌های استاندارد و همیشگی درباره رقابت، هزینه‌ها، جذب مشتری و قوانین احتمالی‌اند که تقریباً هر کسب‌وکاری باید نگرانشان باشد. اما برخی از این ریسک‌ها، نقاط شکست کم‌سابقه‌ای را مشخصاً برای خودِ آنتروپیک و به‌طورکلی برای حباب پرهیاهوی هوش مصنوعی پررنگ می‌کنند. مجله Arstechnica پس از بررسی این رساله‌ی کتاب‌مانند درباره بزرگ‌ترین خطرات پیش روی آنتروپیک، فهرست خود را به هفت مشکل غافلگیرکننده، جذاب و تأمل‌برانگیز محدود می‌کند؛ خلاصه‌ای از سناریوهایی که بد نیست سرمایه‌گذاران آنتروپیک پیش از خرید سهام، گوشه ذهنشان داشته باشند.", "image_url": "https://api2.zoomit.ir/media/artificial-intelligence-stock-market-impact-6ae1d31e2b7fe0e7849f7f80?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "بورس و طلا"], "datetime_fa": "۶ آبان • ۱۹:۰۰"}, {"source": "Zoomit", "title": "شرط‌بندی روی پایان جهان؛ ریسک نابودی توسط هوش مصنوعی، فرصتی طلایی برای سرمایه‌گذاران است", "link": "https://www.zoomit.ir/ai-articles/469945-anthropic-ipo-ai-existential-risk/", "summary": "پرونده‌ عرضه‌ی اولیه‌ی سهام آنتروپیک نشان می‌دهد هشدارهای مربوط به خطرات آخرالزمانی هوش مصنوعی پیامدهای اقتصادی عجیبی برای بازار سرمایه به همراه دارد.", "date_str": "2026-10-28T15:15:00+00:00", "hash": "e6f1c433b786bf8b", "title_fa": "شرط‌بندی روی پایان جهان؛ ریسک نابودی توسط هوش مصنوعی، فرصتی طلایی برای سرمایه‌گذاران است", "summary_fa": "پرونده‌ عرضه‌ی اولیه‌ی سهام آنتروپیک نشان می‌دهد هشدارهای مربوط به خطرات آخرالزمانی هوش مصنوعی پیامدهای اقتصادی عجیبی برای بازار سرمایه به همراه دارد. تبلیغات گفتمان عمومی درباره‌ی خطرات وجودی هوش مصنوعی و نابودی احتمالی نسل بشر، پارادوکس جالبی را پیش روی سرمایه‌گذاران وال‌استریت قرار داده است. اگر احتمال نابودی جهان بر اثر سیستم‌های بسیار هوشمند فرضی واقعی باشد، مهار همین توانایی فوق‌العاده برای حل مسائل اقتصادی می‌تواند سودهای نجومی بی‌سابقه‌ای پدید آورد. به روایت وال استریت ژورنال ، ادعای برخی پژوهشگران مبنی‌بر احتمال بیش از ۱۰ درصدی نابودی بشر توسط ماشین‌ها، نشانگر پتانسیل بالای ۹۰ درصدی خلق ثروت توسط همان الگوریتم‌ها در صورت مهار موفق است. در سناریوی وقوع آخرالزمان، ارزش سهام و دارایی‌ها به‌طور کلی بی‌معنی خواهد بود، بنابراین ریسک صفر شدن سرمایه عملا از محاسبات سنتی ریسک‌پذیری خارج می‌شود. با وجود هیجان پیرامون عرضه‌ی عمومی سهام، اسناد رسمی خطرات دیگری را برجسته می‌کنند. در مستندات ۹۴ صفحه‌ای بخش ریسک شرکت آنتروپیک آمده است: «نگرانی‌هایی در درون سازمان ما و از سوی دیگر پژوهشگران، ناظران، سیاست‌گذاران و فعالان صنعت مطرح شده مبنی‌بر این‌که سامانه‌های هوش مصنوعیِ پیشرفته، چنانچه بدون تدابیر حفاظتی مناسب، نظارت و اقدامات امنیتی توسعه، استقرار و به‌کارگیری شوند، می‌توانند خطراتی فاجعه‌بار یا وجودی برای بشریت ایجاد کنند؛ به‌ویژه در ص nd recreate games, raising questions about piracy, copyright and how far the technology could disrupt the industry • Don’t get Pushing Buttons delivered to your inbox? Sign up here If your social media algorithms have clocked that you’re into video games, something strange will have happened in the past few weeks. Your feed, like mine, will have been full of clips of streamers playing bizarre mashups of popular video games . Skyrim in Minecraft. Halo, except the main character is Mario. Skate 2 in Call of Duty maps. A flood of professional-looking fan-coded game mods that are mildly interesting to look at for 30 seconds, but ultimately inconsequential. Would I download a mod that lets me play Wii Bowling inside a zombie shooter? No, but I am very interested in where they came from. Of course, the answer – or at least, most of the answer – is AI. After a week of researching this (thanks especially to Replay Mode on YouTube for this informative video , which set me down this track) I now understand that these mashup mods are not just AI-generated videos, but AI-assisted coding. Basically, as of a few weeks ago, Anthropic’s Claude has become extremely good at decompiling video game code. Games are written by humans in readable code and then compiled into binary 1s and 0s that the PC or console running it can read; decompiling is the reversal of that process, revealing a game’s source code, which humans can then edit and mess around with for fun. This used to be an extremely laborious process. But now it is not, because humans aren’t doing much of it any more. Continue reading...", "date_str": "2026-10-28T15:00:05+00:00", "hash": "2a0d333e32b79c20", "title_fa": "رسانه‌های اجتماعی پر از بازی‌های ویدیویی عجیب و غریب هستند. همه آنها از کجا می آیند؟", "summary_fa": "ابزارهای هوش مصنوعی اصلاح و بازآفرینی بازی‌ها را آسان‌تر می‌کنند و سؤالاتی را در مورد دزدی دریایی، حق نسخه‌برداری و این که این فناوری تا چه حد می‌تواند صنعت را مختل کند ایجاد می‌کند • آیا دکمه‌های فشاری به صندوق یون دلار تجهیزات سرور را سرقت کرده‌اند. تبلیغات باندهای سازمان‌یافته با هدف قرار دادن محموله‌های ارسالی به دیتاسنترهای هوش مصنوعی، خسارت‌هایی چند ده میلیون دلاری به توسعه‌دهندگان فناوری وارد کرده‌اند. تبهکاران با ایجاد تصادف‌های جاده‌ای ساختگی، خودروهای اسکورت را از مسیر خارج می‌کنند و محموله‌های ارزشمند پردازشی را می‌ربایند. طبق یافته‌های NBC ، دزدی تجهیزات در حال انتقال دیتاسنترها از ژوئن ۲۰۲۶ (خرداد و تیر) تاکنون بیش از ۱۰۰ میلیون دلار خسارت به جا گذاشته است. گزارش‌ها نشان می‌دهد ده‌ها سرقت بزرگ در سراسر ایالات متحده ثبت شده و افزایش تقاضا برای زیرساخت‌های رایانشی، آمار دستبردها را بالا برده است. در یک رویداد، تریلی حامل تجهیزات سرور به مقصد فایت‌ویل جورجیا پس از تصادف عمدی یک خودرو با ماشین نامحسوس پلیس ناپدید شد. پلیس تریلی خالی را چند روز بعد در توقفگاهی پیدا کرد، درحالی‌که محموله‌ی ۱۳ میلیون دلاری آن کاملا به سرقت رفته بود. سناریوی مشابهی برای یک محموله‌ی ۱۰ میلیون دلاری عازم تگزاس رخ داد و مهاجمان علاوه بر تصادف با خودروی محافظ، ردیاب ماهواره‌ای را نیز دستکاری کردند. جراردو پاچوکا ، بازرس خصوصی سرقت محموله‌ها، گفت: «تصادف رخ‌داده اتفاقی نبود. تبهکاران خواهان بار بودند و عامدانه خودروهای اسکورت را هدف قرار دادند.» کیث لوئیس ، مدیر عملیات شرکت مدیریت ریسک Verisk CargoNet، گفت: «سرقت چنین محموله‌هایی درست مثل دزدیدن شمش‌های طلای خالص است. ارزش برخی از محموله‌های سرقت‌شده به بیش از ۳۰ میلیون دلار می‌رسد. دزدیدن قطعات بسیار آسان‌تر از سرقت بانک به حساب می‌آید.» لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/cover-6a82b32b7023b9d484304a01?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۶ آبان • ۱۷:۳۵"}, {"source": "Lifehacker", "title": "These Are the Best Arc Browser Alternatives, Now That It's Shutting Down", "link": "https://lifehacker.com/tech/best-arc-browser-alternatives?utm_medium=RSS", "summary": "Well, it happened: The Browser Company has finally announced that it will be sunsetting the Arc browser before the end of 2026 . The writing has been on the wall for well over a year now: Arc had already been put on ice, receiving only maintenance updates after the Browser Company switched its focus to Dia, an AI browser that shares Arc s framework but lacks the wonderful interface features that made Arc such a joy to use . This is sad news for the Arc faithful. If you're one of them, or if you re looking for an alternative to the regular browsers like Safari and Chrome, all hope is not lost. Export your Arc data , and try out one of these Arc-like alternatives. The Zen Browser is the best Arc alternative Credit: Zen Browser Zen has become the de facto option for all users looking to find something that looks and works like Arc. In some ways, it s better than Arc; in some ways it falls short. It has the look and feel down to a T. Zen has the same vertical sidebar, with customizable workspaces and pinned tabs up top. And like Arc, Zen has mods that let you customize the browser's user interface (plus a ton of community-developed mods ready to go). Zen is also free to use, and it s open-source. Cherry on top? There are no AI features. None. No upsells, no VPN, no schemes, nothing. It s built on Firefox, and it has a privacy-first approach. I ve been using Zen for months, and I m quite happy with it. The only downside I can see is the Firefox web engine; while Gecko has come a long way, it can still sometimes fall short of Chromium, mostly because Google Chrome is such a popular browser, most websites are designed to run best on it. When I run into an issue with a website, I tend to switch to Chrome for a while. Zen can also sometimes be a memory hog, but once I got better at tab hygiene (automatically closing older tabs and being vigilant about workspace management), the experience got quite a bit better. And yes, there is extension support: Anything that runs on Firefox will run here too. Firefox has most of the important extensions covered, and it s the only major browser that still supports the full-scale uBlock Origin ad blocker (which works like a treat in Zen, too). Vivaldi takes a maximalist approach to web browsing Credit: Vivaldi Alternatively, you can go to the opposite end of the spectrum and try out a maximalist browsing approac:. For a while, Microsoft Edge was the cleaner, faster, better version of Chrome, but now, that title goes to Vivaldi . ", "date_str": "2026-10-28T14:30:00+00:00", "hash": "ff29aebf5d792a95", "title_fa": "اینها بهترین گزینه های جایگزین مرورگر Arc هستند، اکنون که در حال خاموش شدن است", "summary_fa": "خوب، این اتفاق افتاد: شرکت مرورگر سرانجام اعلام کرد که مرورگر Arc را قبل از پایان سال 2026 غروب می کند. این نوشته بیش از یک سال است که روی دیوار مانده است: Arc قبلاً روی یخ گذاشته شده بود و پس از اینکه شرکت مرورگر تمرکز خود را بر روی Dia تغییر داد، فقط به‌روزرسانی‌های تعمیر و نگهداری را دریافت می‌کرد، یک مرورگر هوش مصنوعی که چارچوب Arc را به اشتراک می‌گذارد اما فاقد ویژگی‌های رابط فوق‌العاده‌ای است که Arc را برای استفاده بسیار لذت‌بخش کرده است. این یک خبر ناراحت کننده برای وفاداران Arc است. اگر شما یکی از آنها هستید، یا اگر به دنبال جایگزینی برای مرورگرهای معمولی مانند سافاری و کروم هستید، تمام امیدتان از بین نمی رود. داده های Arc خود را صادر کنید و یکی از این گزینه های مشابه Arc را امتحان کنید. مرورگر Zen بهترین جایگزین Arc است. از برخی جهات، بهتر از Arc است. از برخی جهات کوتاه می آید. ظاهر و احساسی تا حد T دارد. Zen همان نوار کناری عمودی، با فضاهای کاری قابل تنظیم و برگه‌های سنجاق‌شده در بالا را دارد. و مانند Arc، Zen دارای حالت‌هایی است که به شما امکان می‌دهد رابط کاربری مرورگر را سفارشی کنید (به‌علاوه تعداد زیادی مدهای توسعه‌یافته توسط جامعه آماده کار). استفاده از Zen نیز رایگان است و منبع باز است. گیلاس بالای سر؟ هیچ ویژگی هوش مصنوعی وجود ندارد. هیچ کدام. بدون افزایش فروش، بدون VPN، بدون طرح، هیچ چیز. این بر روی فایرفاکس ساخته شده است، و رویکرد اول حفظ حریم خصوصی دارد. من ماه هاست که از Zen استفاده می کنم و کاملا از آن راضی هستم. تنها نقطه ضعفی که می توانم ببینم موتور وب فایرفاکس است. اگرچه Gecko راه درازی را پیموده است، هنوز هم گاهی اوقات ممکن است از Chromium کوتاه بیاید، بیشتر به این", "image_url": "https://lifehacker.com/imagery/articles/01M619S6VG20JXY66C81C857NA/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Microsoft"], "datetime_fa": "۶ آبان • ۱۸:۰۰"}, {"source": "Lifehacker", "title": "This Pricey New Accessory Gives Your Kindle a Feature That Used to Be Standard", "link": "https://lifehacker.com/tech/the-kindle-page-turn-cover-turns-your-paperwhite-into-an-oasis?utm_medium=RSS", "summary": "We may earn a commission from links on this page. It has been 14 years since Amazon made a Kindle e-reader without a touchscreen, and while I certainly don't miss the days of slowly paging through my e-book library with the arrow keys on my Kindle Keyboard, the move to touch navigation did have one unfortunate result, at least for a small subset of readers: the loss of physical page-turn buttons. Once standard on all Kindles, they eventually became a premium feature available only on the pricey Kindle Oasis, before being dropped from the lineup entirely when that device was retired in 2024. While this fall's overhaul of the Kindle lineup introduced upgrades like a metal enclosure and a flush-front design, Amazon hasn't exactly reintroduced physical buttons, but the company has launched a new accessory to appeal to the roughly 5% of the market (per Kevin Keith, Amazon's vice president in charge of Kindle) that essentially turns your new Kindle Paperwhite Signature Edition into a Kindle Oasis: the Kindle Page-Turn Cover . The Page-Turn Cover builds the buttons into the case Credit: Joel Cunningham Releasing alongside the new flush-front Kindle Paperwhite Signature Edition, the Page-Turn Cover is made of plant-based leather (in one of three colors to match your Kindle Graphite, Fig, or Seaglass Green) with a magnetic front flap, a soft interior, and a right-hand bezel made of lightly textured plastic that houses two thin, elongated buttons. When you slot your compatible Kindle into the case, connecting it magnetically and via the built-in pogo pins, it will automatically pair with the device, allowing you to turn pages with a button press instead of a tap. By default, the top button will advance you forward by one page, and the bottom button will do the reverse, though you can change which does which in your device settings. While the physical buttons on some Boox and Barnes Noble Nook devices allow you to map different functions like skipping an entire chapter or scrubbing through a book quickly to a long-press or double-tap, as of this writing, the Page-Turn Cover will only let you turn one page at a time. The buttons also only work for turning pages; you'll still navigate your library and the device menus using the touchscreen. If you're a lefty, or prefer to swap which hand you use to hold your e-reader, you can change up the orientation by turning off Lock Rotation on your device; when you flip it over to hold in your other hand, the text will automatica", "date_str": "2026-10-28T14:00:10+00:00", "hash": "dd0d822a23fcdec2", "title_fa": "این لوازم جانبی گران قیمت به کیندل شما ویژگی استانداردی می دهد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. ۱۴ سال از زمانی که آمازون یک کتابخوان الکترونیکی Kindle بدون صفحه لمسی ساخت، می‌گذرد، و اگرچه من مطمئناً روزهایی را که به آرامی در کتابخانه کتاب الکترونیکی خود با کلیدهای پیکان روی صفحه‌کلید Kindle خود جستجو می‌کردم را از دست نمی‌دهم، حرکت به سمت ناوبری لمسی حداقل برای زیرمجموعه کوچکی از خوانندگان یک نتیجه ناگوار داشت: از دست دادن دکمه‌های فیزیکی برای چرخاندن صفحه. زمانی که روی همه کیندل‌ها استاندارد بود، در نهایت به یک ویژگی ممتاز تبدیل شدند که فقط در کیندل اوزیس گران‌قیمت در دسترس بود، قبل از اینکه در سال 2024 زمانی که آن دستگاه بازنشسته شد، به‌طور کامل از خط تولید حذف شدند. در حالی که در پاییز امسال تغییرات اساسی در سری Kindle به‌روزرسانی‌هایی مانند یک محفظه فلزی و طراحی هموار در جلو ارائه شد، آمازون دقیقاً دکمه‌های فیزیکی را مجدداً معرفی نکرده است، اما این شرکت لوازم جانبی جدیدی را برای جذب تقریباً 5 درصد از بازار عرضه کرده است (از نظر کوین کیت، معاون آمازون، معاون رئیس‌جمهور جدید آمازون، مسئول Kindle) Kindle Oasis: Kindle Page-Turn Cover . روکش Page-Turn دکمه ها را در قاب قرار می دهد اعتبار: Joel Cunningham در کنار نسخه جدید کیندل Paperwhite Signature Edition در جلو، روکش Page-Turn از چرم گیاهی ساخته شده است (در یکی از سه رنگ برای مطابقت با Kindle Graphite، Figure، یا Seglass Enterprise با لبه جلویی نرم، سبز مگنتی و شیشه ای دریایی) ساخته شده از پلاستیک با بافت سبک که دو دکمه نازک و کشیده را در خود جای داده است. هنگامی که Kindle سازگار خود را در قاب قرار می دهید، آن را به صورت مغناطیسی و از طریق پین های pogo داخلی متصل می کنید، به طور خودکار با دستگاه جفت می شود و به شما امکان می دهد", "image_url": "https://lifehacker.com/imagery/articles/01M5ZEKWQEG8Y4Q7V0VY0TWX8T/hero-image.fill.size_1200x675.png", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۶ آبان • ۱۷:۳۰"}],
      media: [{"source": "Billboard", "title": "Megan Thee Stallion Taps Fans to Craft Spooky ‘Hottieween’ Circus Trailer: Watch", "link": "https://www.billboard.com/music/rb-hip-hop/megan-thee-stallion-hottieween-trailer-1236369868/", "summary": "Megan Thee Stallion s Hottieween party is back, and the Houston Hottie tapped into her adoration for horror movies along with her Hotties fan base and Facebook to craft a spooky Thee Hottieween Trailer , which arrived on Wednesday (Oct. 28). Related Megan Thee Stallion Says a Doechii Collaboration Is On Her Album Wish List for Act III Megan Thee Stallion Announces Return of Hottieween in Las Vegas: Thee Circus Is Coming Megan Thee Stallion Returns With Scorching Tina Tuesday Freestyle Ahead of Act III : Watch The nightmarish trailer finds Megan transforming into Thee Grown Ass Woman throughout the clip, starring as a giantess in the circus. The rapper seemingly pulled on themes from American Horror Story and the surrealism of Tim Burton s filmmaking to bring her bone-chilling vision to life. I m a grown woman, don t judge me/ Ride on this horse, don t judge me/ I just wanna have fun, don t judge me, she raps before the curtain drops in the black-and-white trailer. View this post on Instagram This wasn t a one-woman-band on the production side, as Megan used suggestions from her Hotties on Facebook, which were incorporated into the flick. Horror Hotties record a creepy-found footage-style clip that feels like it was captured outside a spooky circus…think fog, static, a mysterious figure in the darkness whatever freaks you out, she wrote in a horror-themed Facebook group, while soliciting ideas from fans. I want to build some creepy animal masks for my spooky circus…what animals would be the freakiest? Thee Hottieween Trailer sets the stage for the return of Megan s Hottieween circus in Las Vegas on Oct. 30. Tickets are still on sale for the party, which is set for Zouk nightclub. Megan Thee Stallion didn t add to her Tina Tuesday Freestyles series this week, but brought the trio of installments to streaming services on Oct. 24, which is led by the fiery Thin Ice. Megan s next album, Act: III , appears to be on the horizon. Watch Thee Hottieween Trailer below.", "date_str": "2026-10-28T20:56:36+00:00", "hash": "859a693ff48e9d73", "title_fa": "Megan Thee Stallion به طرفداران ضربه می زند تا تریلر سیرک وحشتناک Hottieween را بسازد: تماشا کنید", "summary_fa": "مهمانی Hottieween Megan Thee Stallion بازگشته است، و Hottie Houston به همراه طرفداران Hotties و فیس بوک خود از تحسین او برای فیلم های ترسناک استفاده کرد تا یک تریلر ترسناک Thee Hottieween را بسازد، که در روز چهارشنبه (28 اکتبر) وارد شد. مگان تی استالیون می‌گوید که همکاری با دوچی در فهرست آرزوهای آلبوم او برای Act III وجود دارد. کلیپ، در نقش یک غول زن در سیرک. ظاهراً این خواننده رپ از مضامینی از داستان ترسناک آمریکایی و سورئالیسم فیلمسازی تیم برتون استفاده کرده است تا به دیدگاه هولناک خود زنده شود. من یک زن بالغ هستم، مرا قضاوت نکن/ سوار این اسب شو، مرا قضاوت نکن/ من فقط می خواهم خوش بگذرانم، مرا قضاوت نکن، او قبل از اینکه پرده در تریلر سیاه و سفید فرو بریزد رپ می زند. این پست را در اینستاگرام مشاهده کنید این یک گروه یک زن در سمت تولید نبود، زیرا مگان از پیشنهاداتی از Hotties خود در فیس بوک استفاده کرد، که در تلنگر گنجانده شده بود. او در یک گروه فیس بوک با مضمون ترسناک نوشت که در یک گروه فیس بوک با مضمون ترسناک نوشت که در بیرون از یک سیرک شبح آور گرفته شده است. من می خواهم چند ماسک حیوانات وحشتناک برای سیرک شبح وار خود بسازم ... چه حیواناتی از همه عجیب تر هستند؟ تریلر Thee Hottieween زمینه را برای بازگشت سیرک Megan s Hottieween در لاس وگاس در 30 اکتبر آماده می کند. بلیت ها هنوز برای مهمانی فروخته می شوند که برای کلوپ شبانه Zouk تنظیم شده است. Megan Thee Stallion این هفته به سری Tina Tuesday Freestyles اضافه نکرد، اما این سه قسط را در 24 اکتبر به سرویس‌های استریم آورد که توسط یخ آتشین Thin Ice هدایت می‌شود.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/megan-thee-stallion-hottieween-horror-trailer-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۷ آبان • ۰۰:۲۶"}, {"source": "Billboard", "title": "Miranda Lambert Opens Up About Songwriting, Healing & Heartache on ‘Ross Golan’ Podcast: ‘It Was Raw Emotion’", "link": "https://www.billboard.com/music/country/miranda-lambert-songwriting-ross-golan-1236369881/", "summary": "During a recent episode of And The Writer Is With Ross Golan , Miranda Lambert opened up about her two decades in music, how her songwriting has evolved and how she coped with heartache through a prolific period of songwriting. Following the success of her 2014 album Platinum , which topped Billboard s Top Country Albums chart for six weeks, Lambert s next album, 2016 s The Weight of These Wings , was a double-disc project that delved into processing and moving on from heartbreak in the wake of her very public divorce from fellow country star Blake Shelton . Lambert and Shelton wed in 2011 and finalized their divorce in 2015. 2015, I got divorced and that sucks for anyone, especially in the public eye, especially on tour, especially in the middle of a very public career—two of us, you know what I mean? It just was a really not fun time, Lambert recalled. She dealt with the personal hardships by turning to music as a healing balm and way of processing. Along the way, she says she wrote 75 songs in just months while making The Weight of These Wings . Lambert said, I dove head-first into songwriting I would come to town and write specifically for Platinum and then I was out. And when I moved back [to Nashville] in 2015, I gathered up all of my friends and relationships from, you know, all of the previous years, and just used it, like used the misery [to write The Weight Of These Wings ]. I used the staying out too late at honky-tonks. I used what I was living and my friends went on that journey with me friends being songwriters. I think I wrote 75 songs in like a year, I mean in like the first four months I moved back, and it was kinda magical because I really started growing my songwriting then. It wasn t writing towards a specific record or a sound, or feisty or whatever, it was raw emotion, she continued. I think I grew as a vocalist and a songwriter because I spent so much of my downtime with a guitar in my hand for the first time. Discussing songs such as Tin Man and Vice that came from that album and seeing the enduring impact they have had, Lambert said, It was worth it. It was worth laying it out there. Since then, Lambert has gone on to notch even more of her own hits including the Country Airplay topper Bluebird and the Chris Stapleton collab A Song to Sing, while also writing numerous hits for other artists most notably, as a co-writer on Ella Langley s current Billboard Hot 100-dominating hit Choosin Texas, which is now the longest-charting No. 1 ", "date_str": "2026-10-28T20:52:58+00:00", "hash": "7c7d562bca4ace71", "title_fa": "میراندا لمبرت درباره ترانه سرایی، شفا و درد دل در پادکست «راس گولان» صحبت می‌کند: «این احساس خام بود»", "summary_fa": "میراندا لمبرت در یکی از قسمت‌های اخیر و The Writer Is With Ross Golan درباره دو دهه موسیقی خود، چگونگی تکامل ترانه‌سرایی‌اش و چگونگی کنار آمدن با درد دل در طول دوره پربار ترانه سرایی صحبت کرد. پس از موفقیت آلبوم پلاتینیوم در سال 2014، که به مدت شش هفته در صدر جدول آلبوم های برتر بیلبورد قرار گرفت، آلبوم بعدی لمبرت، The Weight of This Wings در سال 2016، یک پروژه دو دیسکی بود که پس از طلاق بسیار عمومی او از ستاره هموطن بلیک، به پردازش و حرکت از دلشکستگی پرداخت. لمبرت و شلتون در سال 2011 ازدواج کردند و در سال 2015 طلاق خود را نهایی کردند. در سال 2015، من طلاق گرفتم و این برای هر کسی بد است، به خصوص در انظار عمومی، به ویژه در تور، به خصوص در میانه یک حرفه بسیار عمومی - ما دو نفر، می دانید منظورم چیست؟ لمبرت به یاد می آورد که واقعاً زمان جالبی نبود. او با روی آوردن به موسیقی به عنوان یک مرهم شفابخش و روش پردازش، با سختی های شخصی مقابله کرد. در طول راه، او می‌گوید که در طول ساختن The Weight of This Wings 75 آهنگ را تنها در چند ماه نوشت. لمبرت گفت، من ابتدا به ترانه سرایی سر زدم، به شهر می آمدم و به طور خاص برای پلاتینیوم می نوشتم و سپس بیرون بودم. و زمانی که در سال 2015 به نشویل بازگشتم، همه دوستان و روابطم را از همه سال‌های قبل جمع کردم، و فقط از آن استفاده کردم، مانند استفاده از بدبختی [برای نوشتن The Weight Of This Wings]. من از بیرون ماندن خیلی دیر در هانکی تونکس استفاده کردم. من از آنچه زندگی می‌کردم استفاده کردم و دوستانم با دوستانم که ترانه‌سرا بودند به آن سفر رفتند. فکر می‌کنم 75 آهنگ را در مدت یک سال", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/P106YDU5-e1787080040396.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۷ آبان • ۰۰:۲۲"}, {"source": "Billboard", "title": "Legendary ‘Star Wars,’ ‘E.T.’ Producer Kathleen Kennedy to Oversee 2028 Summer Olympics Ceremonies", "link": "https://www.billboard.com/pro/film-producer-kathleen-kennedy-2028-summer-olympics/", "summary": "Veteran film producer Kathleen Kennedy has been selected to oversee the opening and closing ceremonies at the 2028 Summer Olympics in the greater Los Angeles area, the organizing committee said Wednesday (Oct. 28). Kennedy will head a team of producers designing the look and content of dual ceremonies that will kick off the Summer Olympics on July 14, 2028, at the Los Angeles Memorial Coliseum and SoFi Stadium. She will also lead the team designing the closing ceremony and both ceremonies for the Paralympics, which begin a month later. Related Here Are the Musicians Who Have Performed at the Olympics Over the Years Foo Fighters Deliver a Blast From the Past on Kimmel : Watch ABBA s Mamma Mia! The Party Is Coming to Australia “This appointment reinforces LA28’s commitment to harness the unparalleled creativity, cultural influence and storytelling power of the entertainment capital of the world,” the Olympic organizers said in a statement. The result will be “ceremonies that are distinctly Los Angeles and leave a lasting impression on the global stage.” At LA28, Kennedy will serve as head of ceremonies and content, a post that had been held by another top entertainment executive, Peter Rice . LA28 said in its announcement that Rice will stay on as an executive producer. LA28 chairman Casey Wasserman called Kennedy “one of Hollywood’s all-time greats,” adding: “I can’t think of anyone better to conjure the magic of Hollywood than Kathleen.” In a statement, Kennedy said she and her husband and producing partner, Frank Marshall , had attended almost every Olympics since the Games last came to Los Angeles, in 1984. “Sport remains one of the great unifying experiences we share,” she said. Kennedy, 73, received an honorary Oscar, the Irving G. Thalberg Memorial Award, in 2019, alongside Marshall. She won a Primetime Emmy in 2013 for outstanding special class short-form non-fiction programs for Remembering 9/11 . Kennedy has received eight Oscar nominations for best picture, five of them for films on which she teamed with Steven Spielberg : E.T. The Extra Terrestrial, The Color Purple, Munich, War Horse and Lincoln . Her other best picture nominations are for The Sixth Sense, Seabiscuit and The Curious Case of Benjamin Button. In addition to her one Primetime Emmy win, she was nominated for The Special Relationship, I Was There: Boston Marathon Bombings, The Mandalorian, Obi-Wan Kenobi and Andor. The 2024 Summer Olympics opening and closing ceremonies were overseen", "date_str": "2026-10-28T20:24:52+00:00", "hash": "0c851635d5136b83", "title_fa": "کاتلین کندی، تهیه کننده افسانه ای «جنگ ستارگان»، «ای.تی.» بر مراسم بازی های المپیک تابستانی 2028 نظارت خواهد کرد.", "summary_fa": "کمیته برگزاری روز چهارشنبه (28 اکتبر) گفت که کاتلین کندی تهیه کننده کهنه کار فیلم برای نظارت بر مراسم افتتاحیه و اختتامیه بازی های المپیک تابستانی 2028 در منطقه بزرگ لس آنجلس انتخاب شده است. کندی سرپرست تیمی از تولیدکنندگان خواهد بود که ظاهر و محتوای مراسم دوگانه را طراحی می‌کنند که بازی‌های المپیک تابستانی را در ۱۴ ژوئیه ۲۰۲۸ در سالن یادبود لس‌آنجلس و استادیوم SoFi آغاز می‌کنند. او همچنین تیم طراح مراسم اختتامیه و هر دو مراسم پارالمپیک را که یک ماه بعد آغاز می شود، رهبری خواهد کرد. موسیقی‌دانانی که طی سال‌ها در بازی‌های المپیک اجرا کرده‌اند، اینجا هستند. برگزارکنندگان المپیک در بیانیه‌ای گفتند: «پارتی به استرالیا می‌آید: «این انتصاب تعهد LA28 را برای مهار خلاقیت بی‌نظیر، تأثیر فرهنگی و قدرت داستان‌گویی پایتخت سرگرمی جهان تقویت می‌کند. نتیجه \"مراسمی است که به طور مشخص لس آنجلسی است و تاثیری ماندگار در صحنه جهانی به جا می گذارد.\" در LA28، کندی به عنوان رئیس تشریفات و محتوا خدمت خواهد کرد، پستی که توسط یکی دیگر از مدیران ارشد سرگرمی، پیتر رایس برگزار شده بود. LA28 در اطلاعیه خود گفت که رایس به عنوان تهیه کننده اجرایی باقی خواهد ماند. کیسی واسرمن، رئیس LA28، کندی را \"یکی از بزرگان تمام دوران هالیوود\" خواند و افزود: \"من نمی توانم کسی را بهتر از کاتلین برای تجسم جادوی هالیوود فکر کنم.\" کندی در بیانیه‌ای گفت که او و همسرش و شریک تهیه‌کننده‌اش فرانک مارشال تقریباً از زمان آخرین بازی‌ها در لس‌آنجلس در سال 1984 تقریباً در همه المپیک‌ها شرکت کرده‌اند. کندی 73 ساله، اسکار افتخاری، ایروینگ جی.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2210325176-e1793217330334.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۶ آبان • ۲۳:۵۴"}, {"source": "Deadline", "title": "‘Paw Patrol 4’: Spin Master & Paramount Animation Pic In Works With Franchise Director Cal Brunker; Eyes 2029 Release", "link": "https://deadline.com/2026/10/paw-patrol-4-1237207451/", "summary": "EXCLUSIVE: When it comes to the Paw Patrol franchise, it s been not a good dog, but a great one in box office and $18 billion lifetime retail that it only makes sense for Spin Master Corp, Paramount Animation and Nickelodeon Movies to team on a fourth, currently titled Paw Patrol 4. A 2029 theatrical release [ ]", "date_str": "2026-10-28T21:00:00+00:00", "hash": "9fd67b6226b1e551", "title_fa": "Paw Patrol 4: Spin Master & Paramount Animation Pic در حال کار با کارگردان فرانچایز Cal Brunker. انتشار چشمان 2029 ng Paramount-Warner Bros. Merger", "link": "https://variety.com/2026/tv/news/skydance-george-cheeks-channing-dungey-executive-structure-1236933612/", "summary": "Skydance TV co-chair and chief content officer George Cheeks formalized his division’s executive structure. In a memo to staff, Cheeks shared the specific titles for his direct reports, as well as how Skydance TV will now operate post-Warner Bros. and Paramount merger. Reporting to me, these accomplished leaders will work together to advance our strategy [ ]", "date_str": "2026-10-28T20:27:04+00:00", "hash": "719166f5e6801483", "title_fa": "جورج چیکس، رئیس مشترک تلویزیون Skydance، ساختار اجرایی را پس از ادغام پارامونت-وارنر بروس فاش کرد.", "summary_fa": "جورج چیکس، رئیس مشترک و مدیر محتوای Skydance TV، ساختار اجرایی بخش خود را رسمی کرد. Cheeks در یادداشتی به کارکنان، عناوین خاص گزارش‌های مستقیم خود را به اشتراک گذاشت و همچنین نحوه عملکرد Skydance TV پس از ادغام برادران وارنر و پارامونت را به اشتراک گذاشت. با گزارش به من، این رهبران موفق با هم برای پیشبرد استراتژی ما کار خواهند کرد [ ] همچنین، امی رایزنباخ به عنوان رئیس CBS Entertainment ادامه می دهد. تام سیبروسکی به عنوان رئیس عملیات CBS News. بایرون روبین به عنوان مدیر عملیات لورل ویر ناظر بر پژوهش و بینش برنامه نویسی. بازاریابی پیشرو مایک بنسون؛ و کریس اندر به عنوان رئیس ارتباطات و تبلیغات. خبر تعجب آور نیست؛ قبلاً مشخص شده بود که روسای بخش هایی که به او گزارش می دهند شامل گروه تلویزیونی برادران وارنر و رئیس/مدیر عامل شبکه های ایالات متحده، چانینگ دانگی، رئیس استودیو سی بی اس دیوید استاپف و مت تونل، رئیس استودیو تلویزیونی پارامونت هستند. همچنین قبلاً گزارش شده بود که Dungey - که یک سال پیش نظارت بر شبکه‌های Discovery برادران وارنر را بر عهده گرفت - نظارت بر شبکه‌های کابلی پارامونت نیز خواهد داشت. در کنار Cheeks، JB Perrette (قبلاً مدیر عامل/رئیس پخش جهانی و بازی‌های WBD) به عنوان رئیس مشترک Skydance TV و همچنین مدیر ارشد تجاری فعالیت می‌کند. Perrette علاوه بر این، این نقش ها را برای بخش پخش Skydance DTC بر عهده دارد. پیش از ادغام، چیکس اخیراً به عنوان رئی ر می‌دهد. \"Sí, se puede\" صبح چهارشنبه در خانه اش در محاصره خانواده درگذشت. یکی از سخنگویان خانواده گفت که علت آن سرطان بوده است. ناوا و مارتینز جیتنر در بیانیه‌ای مشترک نوشتند: «ما از اینکه شب گذشته در بیکرزفیلد در کنار دولورس بودیم، برای خداحافظی و عاشقانه در کنار خانواده‌اش ایستادیم، خوشحال شدیم. «دولورس یک نور بزرگ و یک جنگجوی بی باک برای عدالت بود. او جهان را با اشتیاق خود برای برابری به آتش کشید و نسل‌ها را الهام بخشید تا قدرت خود را کشف کنند.» این زوج بیشتر سه سال را صرف آماده‌سازی اولین فیلم دراماتیک درباره زندگی هوئرتا کرده‌اند، که ورایتی برای اولین بار در آوریل 2024 گزارش داد، با نویسندگی و کارگردانی ناوا و مارتینز جیتنر نویسندگی و تهیه کنندگی با او. هوئرتا، که صف طولانی فیلمسازان برای حقوق زندگی‌اش به سراغش آمده بودند، دو فردی را انتخاب کرد که دهه‌ها می‌شناخت.", "image_url": "https://variety.com/wp-content/uploads/2026/10/1000044551.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس", "سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۲۳:۴۶"}, {"source": "Variety", "title": "YouTube Q3 Ad Revenue Growth Slows, Rising 9% to $11.2 Billion, as Alphabet Misses Earnings Estimates", "link": "https://variety.com/2026/digital/news/youtube-q3-2026-ad-revenue-alphabet-google-earnings-1236933560/", "summary": "YouTube continued to vacuum up digital ad dollars in the third quarter of 2026, but the video platform s advertising business grew at slower pace than in recent quarters. YouTube s growth also was lower than Alphabet overall, given a sales boom in the internet giant s Google Cloud division, which saw revenue double. Meanwhile, Alphabet came in [ ]", "date_str": "2026-10-28T20:09:36+00:00", "hash": "ab423b83ed3c0ff7", "title_fa": "رشد درآمد تبلیغات سه ماهه سوم YouTube کند می شود و با افزایش 9 درصدی به 11.2 میلیارد دلار، زیرا Alphabet برآوردهای درآمد را از دست می دهد.", "summary_fa": "یوتیوب در سه ماهه سوم سال 2026 به جذب دلارهای تبلیغات دیجیتال ادامه داد، اما تجارت تبلیغاتی پلتفرم ویدیویی با سرعت کمتری نسبت به سه ماهه اخیر رشد کرد. رشد یوتیوب نیز با توجه به رونق فروش در بخش Google Cloud غول اینترنتی که درآمد دو برابری داشت، کمتر از آلفابت بود. در همین حال، Alphabet وارد [ ] برای سه ماهه سوم شد، درآمد تبلیغات YouTube 11.21 میلیارد دلار بود که 9.2٪ نسبت به سال قبل افزایش داشت که کمتر از پیش بینی های تحلیلگران است. این در مقایسه با رشد 15 درصدی در دوره قبل از آن و 13 درصدی در سه ماهه دوم و 11 درصدی در سه ماهه اول سال جاری است. مجموع درآمد تبلیغات گوگل (از جمله یوتیوب) 80.0 میلیارد دلار بود که 10.6% افزایش داشت. داستان‌های مرتبط نتفلیکس تاریخ انتشار را برای مستند راب لو تعیین می‌کند. نتفلیکس خارجی با فشار تبلیغات دیجیتال در میان افزایش اشباع تبلیغات پخش جریانی دست و پنجه نرم می‌کند. به گفته این شرکت، در سه ماهه سوم، YouTube از 150 میلیون مشترک YouTube Music و Premium در سراسر جهان (شامل آزمایشی) فراتر رفت. قبلاً در مارس 2025 از مرز 125 میلیون عبور کرد. فیلیپ شیندلر، مدیر ارشد بازرگانی Google، در تماس سه ماهه سوم، گفت که درآمد اشتراک YouTube اکنون سریعتر از جنبه تبلیغاتی کسب و کار در حال رشد است. او همچنین گفت که اکنون بیش از 20 میلیون ویدیو در روز در یوتیوب آپلود می شود. به طور کلی، آلفابت درآمد 127.6 میلیارد دلاری (افزایش 25 درصدی) و درآمد خالص 26.17 میلیارد دلاری (کاهش 25 درصدی) را به ثبت رساند که به معنای درآمد هر سهم 2.12 دلار است. این کمتر از برآوردهای اجماع وال استریت در مورد 128.2 میلیارد دلار درآمد و EPS 3.02 دلار، به ازای هر داده LSEG بود. ضرر سه ماهه سوم", "image_url": "https://variety.com/wp-content/uploads/2025/10/YouTube.png?crop=0px%2C8px%2C1024px%2C576px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["Google", "موسیقی", "نتفلیکس"], "datetime_fa": "۶ آبان • ۲۳:۳۹"}, {"source": "Variety", "title": "LaKeith Stanfield Exits ‘Molepeople’ Horror Movie, Director Ben Wheatley Replaces Rob Savage", "link": "https://variety.com/2026/film/news/lakeith-stanfield-exit-molepeople-ben-wheatley-director-rob-savage-1236933462/", "summary": "Ben Wheatley (“Normal”) is taking over directing duties for Paramount Primal and Blumhouse Atomic Monster s upcoming movie, “Molepeople.” Rob Savage (“The Boogeyman, “Other Mommy”), who was set to helm the project, has departed due to scheduling conflicts, with previously announced star LaKeith Stanfield also exiting the film. “Molepeople” was announced earlier this month during Blumhouse [ ]", "date_str": "2026-10-28T20:00:00+00:00", "hash": "79c95098a3533a68", "title_fa": "LaKeith Stanfield از فیلم ترسناک Molepeople خارج شد، کارگردان Ben Wheatley جایگزین Rob Savage شد.", "summary_fa": "بن ویتلی («Normal») کارگردانی فیلم آینده Paramount Primal و Blumhouse Atomic Monster، «Molepeople» را بر عهده می‌گیرد. راب ساویج (\"The Boogeyman\"، \"Other Mommy\") که قرار بود هدایت پروژه را بر عهده بگیرد، به دلیل درگیری های برنامه ریزی، از این فیلم جدا شده است، در حالی که ستاره قبلاً اعلام شده LaKeith Stanfield نیز از فیلم خارج شده است. «Molepeople» در اوایل این ماه اعلام شد که Blumhouse [ ] Ben Wheatley («Normal») وظیفه کارگردانی فیلم آینده Paramount Primal و Blumhouse Atomic Monster، «Molepeople» را بر عهده می‌گیرد. راب ساویج (\"The Boogeyman\"، \"Other Mommy\") که قرار بود هدایت پروژه را بر عهده بگیرد، به دلیل درگیری های برنامه ریزی، از این فیلم جدا شده است، در حالی که ستاره قبلاً اعلام شده LaKeith Stanfield نیز از فیلم خارج شده است. \"Molepeople\" در اوایل ماه جاری در جریان ارائه کامیک-کان نیویورک Blumhouse Atomic Monster معرفی شد. ناتان الستون فیلمنامه این فیلم ترسناک را درباره مردی نوشت که به داخل تونل‌های متروکه زیر شهر نیویورک فرود می‌آید و در آنجا متوجه می‌شود که «جامعه‌ای پیچیده در زیر خیابان‌ها کمین کرده است». این فیلم - با سرمایه‌گذاری و تولید مشترک Blumhouse Atomic Monster و Paramount Primal، با پخش جهانی پارامونت - برای اکران در سینماها در 27 اوت 2027 تنظیم شده است. داستان‌های مرتبط موفقیت بین‌المللی نتفلیکس در میان لرزش رهبری محتوا، معاملات بیشتر با پخش‌کننده‌ها پس از TF1 و Globo Pacts «غرور و تعصب» تریلر: اما کورین و جک لودن راه‌اندازی مجدد الیزابت بنت و آقای Darcy's Love Story برای Netflum Blumix برای Netflum Blumers Atomic Producers B. سران پارامونت پرایمال، جی دی لیفشیتز و رافائل مارگولس. و جیمز هریس", "image_url": "https://variety.com/wp-content/uploads/2026/10/ben-wheatley-lakeith-stanfield-rob-savage.jpg?crop=0px%2C8px%2C1000px%2C562px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس", "سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۲۳:۳۰"}, {"source": "Billboard", "title": "Karol G Earns Her 23rd Latin Airplay No. 1 With Drake Collab ‘Ahi’", "link": "https://www.billboard.com/music/chart-beat/karol-g-drake-ahi-number-1-latin-airplay-chart-1236369889/", "summary": "Karol G replaces herself at No. 1 on Billboard ’s Latin Airplay chart as “Ahí,” her collaboration with Drake, climbs (2-1) past her two-week leader, “BbY WOW,” with Judeline and rusowsky, on the latest Oct. 31-dated chart. “Ahí,” released in August on her album No Me Arrepiento De Sentir Tanto (via Bichota/Interscope Capitol), becomes her 23rd career No. 1 on the chart thanks to a 5% increase in all-Latin-format audience impressions in the Oct. 16-22 tracking week, according to Luminate. With the achievement, Karol G surpasses Prince Royce for the 10th most No. 1s in the chart’s history. Among women, she trails only Shakira, who has 25. It’s also her third No. 1 of 2026, following “Coleccionando Heridas,” with Marco Antonio Solís, and “BbY WOW” She has earned multiple No. 1s every year since 2018, when she tallied her first two leaders, “Mi Cama,” with J Balvin featuring Nicky Jam, and “Calypso,” with Luis Fonsi and Stefflon Don. “Ahí” also earns Drake his third Latin Airplay No. 1, following his featured turns on Romeo Santos’ “Odio” in 2014 and Bad Bunny’s “MIA” in 2018. The song doubles up on the radio front, also rising to No. 1 on this week’s Latin Rhythm Airplay chart. It’s Karol G’s milestone 20th leader on the tally, tying Wisin, Yandel and Wisin Yandel (credited separately as an official duo) for the sixth-most in the chart’s history. It’s also Drake’s second Latin Rhythm Airplay No. 1, after “MIA.” Elsewhere on the charts, “Ahí” ranks at No. 3 on the multimetric Hot Latin Songs, where it spent one week at No. 1, and sits at No. 88 on the Billboard Hot 100 after debuting at its No. 44 peak. Here’s a look at all 23 of Karol G’s Latin Airplay No. 1s: Title (Peak Year) “Ahí” with Drake (2026) “BbY WOW,” with Judeline and rusowsky (2026) “Coleccionando Heridas” with Marco Antonio Solís (2026) “Verano Rosa” with Feid (2025) “Latina Foreva” (2025) “Si Antes Te Hubiera Conocido” (2024) “Qlona” with Peso Pluma (2024) “Mi Ex Tenía Razón” (2023) “TQG” with Shakira (2023) “Provenza” (2022) “Mamiii” with Becky G (2022) “Sejodioto” (2022) “El Makinon” with Mariah Angeliq (2021) “Location” with Anuel AA and J Balvin (2021) “Bichota” (2021) “Ay, Dios Mío!” (2020) “Caramelo” with Ozuna and Myke Towers (2020) “Tusa” with Nicki Minaj (2020) “China” with Anuel AA, Daddy Yankee, Ozuna and J Balvin (2019) “Secreto” with Anuel AA (2019) “Créeme” with Maluma (2019) “Calypso” with Luis Fonsi and Stefflon Don (2018) “Mi Cama” with J Balvin featuring Nicki Jam (2018) Karol", "date_str": "2026-10-28T19:53:26+00:00", "hash": "ea506ec574053af3", "title_fa": "کارول جی بیست و سومین پخش لاتین شماره 1 خود را با بازی Drake Collab \"Ahi\" به دست آورد.", "summary_fa": "کارول جی در جدول لاتین ایرپلی بیلبورد به عنوان \"Ahí\" جای خود را به شماره 1 می دهد، همکاری او با دریک، با جودلین و روسوفسکی در آخرین نمودار تاریخ 31 اکتبر (2-1) از رهبر دو هفته ای خود، \"BbY WOW\" عبور می کند. بر اساس گزارش Luminate، \"Ahí\" که در ماه آگوست در آلبوم او No Me Arrepiento De Sentir Tanto (از طریق Bichota/Interscope Capitol) منتشر شد، به دلیل افزایش 5 درصدی تعداد مخاطبان تمام فرمت لاتین در هفته پیگیری 16 تا 22 اکتبر، بیست و سومین کارنامه شماره 1 او در جدول شد. با این دستاورد، کارول جی از پرنس رویس پیشی گرفت و دهمین رتبه اول در تاریخ چارت شد. در میان زنان، او تنها شکیرا با 25 سال را پشت سر می گذارد. همچنین سومین شماره 1 او در سال 2026 است، پس از \"Coleccionando Heridas\" با مارکو آنتونیو سولیس و \"BbY WOW\". «کالیپسو» با لوئیس فونسی و استفلون دان. «آهی» همچنین سومین پخش لاتین شماره 1 را برای دریک به دست آورد، پس از نوبت های برجسته او در «Odio» از رومئو سانتوس در سال 2014 و «MIA» از Bad Bunny در سال 2018. این آهنگ در بخش رادیویی دو برابر شد و همچنین به رتبه 1 جدول ایرپلی لاتین ریتم این هفته رسید. این بیستمین رهبر کارول جی است که با Wisin، Yandel و Wisin Yandel (که به طور جداگانه به عنوان دو نفر رسمی شناخته می شوند) برای ششمین رتبه برتر در تاریخ نمودار برابری می کند. همچنین این دومین پخش شماره ریتم لاتین Drake است. 1، بعد از \"MIA\". در جای دیگری از نمودارها، \"Ahí\" در رتبه 3 در آهنگ های چند متری Hot Latin Songs قرار گرفت، جایی که یک هفته در رتبه 1 گذراند و در رتبه 88 در بیلبورد Hot 100 پس از اولین حضور در رتبه 44 خود،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/karol-g-cr-vito-fernicola-press-billboard-1800-2.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۳:۲۳"}, {"source": "Billboard", "title": "Kenny Chesney Mourns His Beloved Pooch Poncho: ‘You Were One Heaven of a Dog’", "link": "https://www.billboard.com/music/country/kenny-chesney-dog-poncho-dead-honors-pet-1236369835/", "summary": "Country Music Hall of Famer Kenny Chesney is mourning his beloved pet. On Wednesday (Oct. 28), The country star posted photos of his dog Poncho on his social media accounts, and revealed that his furry friend had crossed the rainbow bridge. Related Power Pets: Miranda Lambert Reveals the Biggest Lesson Her Dog Bellamy Has Taught Her Power Pets: Korn s Jonathan Davis Says His Dog s Unconditional Love Changed His Life Billboard Power Pets: Taylor Swift s Cats, Ariana Grande s Dogs More A-List Animals With Serious Star Power We lost Poncho at 5:15am this morning and my heart is broken but yet so full cause I know he gave us all he had, Chesney captioned his posts Wednesday (Oct. 28). We went down a lot of roads, lived a lot of life, and saw a lot of sunsets together. Chesney also shared how Poncho came into his life at the perfect time. Ponch, fifteen years ago a friend showed up at my doorstep and said, Here Kenny, you need to learn to attach to something. That’s the day Poncho entered my life, he wrote. I’ve heard a dog enters your life when you need it most. And not just any dog, a specific dog just for you. To help you, to heal you, to show you how to accept unconditional love and give it back. He continued, Poncho did all that and more. He brought so much joy, energy, light, and fun into mine and Mary’s life. He was a constant companion, very curious, had swagger, and smarter than the average human. He loved being on the boat, the bus, backstage with Jill and the production team. He loved the smell of the ocean and the islands like his dad and loved all the smells walking down the streets of Key West, Florida. Chesney also revealed a favorite moment of being on stage with Poncho, when the singer-songwriter thrilled the crowd by bringing his beloved pup out at Chicago s Soldier Field in 2024. I thought it would scare him but he loved feeling the energy of the crowd and refused to leave the stage, the country artist wrote. Instead of being timid, he was a show off a lot like me. That was a favorite moment in 15 years of favorite moments. Chesney ended his message: Poncho, my friend was right. I needed you and I thank you. Our connection and our bond will live forever and I’m gonna miss you. Say hello to DaRubaGirl for us. Goodbye Poncho. You were one heaven of a dog.", "date_str": "2026-10-28T19:46:15+00:00", "hash": "c3d3f49fe38570e3", "title_fa": "کنی چسنی عزادار پوچ پونچوی محبوبش است: \"تو یکی از بهشت ​​سگ بودی\"", "summary_fa": "کنی چسنی تالار مشاهیر کانتری در سوگ حیوان خانگی محبوبش است. روز چهارشنبه (28 اکتبر) این ستاره کانتری عکس های سگ خود پانچو را در حساب های اجتماعی خود منتشر کرد و فاش کرد که دوست پشمالوی او از پل رنگین کمان عبور کرده است. حیوانات خانگی قدرتمند مرتبط: میراندا لمبرت بزرگترین درسی را که به سگش بلامی به او آموخته است فاش می کند: جاناتان دیویس از کورن می گوید که عشق بی قید و شرط سگ زندگی او را تغییر داد حیوانات خانگی قدرتمند بیلبورد: گربه های تیلور سویفت، سگ های آریانا گرانده. چسنی پست های خود را چهارشنبه (28 اکتبر) زیرنویس کرد، قلب من شکسته است، اما با این وجود آنقدر کامل است که می دانم او تمام آنچه داشت به ما داد. ما از جاده های زیادی رفتیم، زندگی زیادی کردیم و غروب های زیادی را با هم دیدیم. چسنی همچنین به اشتراک گذاشت که چگونه پونچو در زمان مناسب وارد زندگی او شد. پانچ، پانزده سال پیش یکی از دوستان در آستان من ظاهر شد و گفت، اینجا کنی، باید یاد بگیری که به چیزی بچسبی. او نوشت: همان روزی بود که پونچو وارد زندگی من شد. شنیده ام که سگی وارد زندگی شما می شود که بیشتر به آن نیاز دارید. و نه هر سگی، یک سگ خاص فقط برای شما. برای کمک به شما، برای شفا دادن شما، برای اینکه به شما نشان دهم چگونه عشق بی قید و شرط را بپذیرید و آن را پس دهید. او ادامه داد، پانچو همه این کارها و بیشتر را انجام داد. او شادی، انرژی، نور و سرگرمی زیادی را در زندگی من و مری به ارمغان آورد. او یک همراه همیشگی، بسیار کنجکاو، تندرو و باهوش تر از یک انسان معمولی بود. او عاشق حضور در قایق، اتوبوس، پشت صحنه با جیل و تیم سازنده", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2296003981-e1793216131751.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۲۳:۱۶"}, {"source": "Billboard", "title": "The Albums With the Most Top 10 Billboard Hot 100 Hits", "link": "https://www.billboard.com/photos/albums-five-top-10-hot-100-hits-6738611/", "summary": "As any artist knows, it’s a tough task to score a top 10 hit on the Billboard Hot 100 . The feat requires some blend of the following: a strong song, a charismatic artist, heightened promotion efforts, a devoted fan base; and, more recently, can be sparked by a viral live performance, meme or other stroke of luck. And that s just to do it once . To stay at the top of the game demands a consistency that few artists ever achieve, but when artists lock onto that golden combination, they can accomplish a string of hits in rapid succession. To celebrate those occasions, Billboard compiled a roll call of albums that cemented their pop dominance with the most top 10 Hot 100 hits, whether by extending an album s commercial strength over several months through the methods listed above, or in recent years, capitalizing on streaming s reshaping of the industry to stack several top 10s upon a big album s arrival. It should come as little surprise, then, that the first album to house five top 10s was Michael Jackson’s Thriller , the best-selling album of all time. At the time, Jackson set the benchmark of seven top 10s from one album a feat later equaled by Bruce Springsteen’s Born in the USA (1984-85), Janet Jackson’s Rhythm Nation 1814 (1989-91) and Drake’s Scorpion (2018). The record then quickly changed hands multiple times: Drake’s Certified Lover Boy scored nine top 10 successes in 2021, but was soon eclipsed by Taylor Swift s 2022 album Midnights, which upped the record to 10. Swift repeated the double-digit domination with 2024 s The Tortured Poets Department and 2025 s The Life of a Showgirl, while Drake joined the club with 2026 s ICEMAN . Check out our rundown of albums that have produced the most top 10 hits on the Hot 100. Drake owns the most projects on the list, with four different albums while Janet Jackson, Michael Jackson, Taylor Swift and Morgan Wallen are the only other acts with multiple appearances. The who’s-who covers a cross-section of genres, including pop, rock, R B and hip-hop and includes superstars such as Bon Jovi, Whitney Houston and Katy Perry.", "date_str": "2026-10-28T19:13:05+00:00", "hash": "ec733b785e68aad3", "title_fa": "آلبوم‌هایی که بیشترین 10 بازدید برتر بیلبورد را دارند", "summary_fa": "همانطور که هر هنرمندی می‌داند، کسب 10 مورد برتر در Billboard Hot 100 کار سختی است. این شاهکار به ترکیبی از موارد زیر نیاز دارد: یک آهنگ قوی، یک هنرمند کاریزماتیک، تلاش‌های بیشتر برای تبلیغ، یک پایگاه طرفداران فداکار. و اخیراً، می تواند توسط یک اجرای زنده ویروسی، میم یا سایر شانس ها جرقه بزند. و این فقط یک بار انجام آن است. ماندن در صدر بازی مستلزم ثباتی است که هنرمندان کمی به آن دست یافته اند، اما وقتی هنرمندان به آن ترکیب طلایی قفل می شوند، می توانند مجموعه ای از موفقیت ها را پشت سر هم انجام دهند. برای جشن گرفتن آن مناسبت‌ها، بیلبورد فراخوانی از آلبوم‌هایی را گردآوری کرد که تسلط پاپ خود را با 10 بازدید برتر از 100 مورد برتر تثبیت کرد، چه با افزایش قدرت تجاری یک آلبوم در طی چند ماه از طریق روش‌های ذکر شده در بالا، چه در سال‌های اخیر، با سرمایه‌گذاری از تغییر شکل صنعت در استریم برای جمع کردن چندین 10 آلبوم برتر به محض ورود یک آلبوم بزرگ. بنابراین، جای تعجب نیست که اولین آلبومی که پنج آلبوم برتر را در خود جای داده بود، Thriller مایکل جکسون بود که پرفروش ترین آلبوم تمام دوران است. در آن زمان، جکسون معیار هفت 10 برتر را از یک آلبوم تعیین کرد که بعدها با بروس اسپرینگستین متولد شده در ایالات متحده (1984-1985)، جنت جکسون Rhythm Nation 1814 (1989-1991) و Drake's Scorpion (2018) برابری کرد. پس از آن رکورد به سرعت چندین بار دست به دست شد: Drake's Certified Lover Boy در سال 2021 9 موفقیت در 10 موفقیت برتر به دست آورد، اما به زودی توسط آلبوم Midnights تیلور سویفت در سال 2022 که رکورد را به 10 رساند، تحت الشعاع قرار گرفت. Showgirl، در حالی که دریک با ICEMAN 2026 به باشگاه پیوست. خلاصه آلبوم‌های ما را", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/olivia-rodrigo-daisy-chain-fields-2026-billboard-1800.jpg?w=1024", "category": "امنیت سایبری و شبکه", "tags": ["موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۲۲:۴۳"}, {"source": "Billboard", "title": "Lawsuit Over Beatles’ ‘First Known’ Recording Heads to Trial After Judge’s Ruling", "link": "https://www.billboard.com/pro/beatles-tape-lawsuit-judge-rules-universal-rare-recording/", "summary": "A Los Angeles judge says Universal Music Group (UMG) can keep pursuing a legal battle demanding the return of what the label has called the “first known Beatles recording” from the estate of a famed Abbey Road sound engineer. In a decision this month, Judge David Cowan ruled that Calderstone Productions — a UMG unit that administers the Beatles catalog — had legal standing to seek to recover the rare tape from the estate of Geoff Emerick, who the label claims stole it decades ago. Related Beatles for Sale: Discogs to List 1,300 Rare Beatles Records From Private Collection Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Emerick’s estate, which says he rescued a piece of history from destruction, had argued UMG couldn’t show a “chain of title” to prove it was the rightful legal successor to Abbey Road, meaning it lacked ownership rights in the first place. But in an Oct. 16 ruling, Judge Cowan rejected that argument: “Calderstone shows how the chain of title gives it the right to pursue its underlying conversion claim,” the judge said, using the legal term for the civil law equivalent of theft . The decision, exclusively reported by Billboard , sets the stage for a trial early next year over the big remaining issue: Whether Abbey Road legally abandoned ownership of the tape. The estate says it was basically thrown away and that Emerick saved it. UMG argues back that it was always company property: “At issue in this action is a highly valuable artifact of rock and roll history that was stolen.” But before then, the estate is already pushing the judge to reconsider his ruling. In a motion last week, lead counsel Kenneth Fruendlich argued that the decision “rewrites” the decades-old documents at the heart of the case and would create “a manifest injustice.” That motion remains pending. Neither side immediately returned requests for comment on Judge Cowan s decision. Related The Beatles are Coming Home: Apple Corps Plots Major New Liverpool Attraction for 2028 Emerick, The Beatles’ chief engineer from 1966 onward, is remembered for helping foster the band’s technically innovative later sound, most notably on the psychedelic, effect-laden Sgt. Pepper’s Lonely Hearts Club Band . When he died suddenly in 2018, Paul McCartney said he would be “long remembered by connoisseurs of sound.” When Emerick s estate searched his home following his death, they found a cu", "date_str": "2026-10-28T19:05:03+00:00", "hash": "75db9893351585a6", "title_fa": "طرح دعوی در مورد اولین ضبط شناخته شده بیتلز پس از حکم قاضی محاکمه شد", "summary_fa": "یک قاضی لس آنجلس می گوید که گروه موسیقی یونیورسال (UMG) می تواند به دنبال یک نبرد حقوقی برای بازگرداندن چیزی باشد که این لیبل آن را \"اولین ضبط شناخته شده بیتلز\" از املاک یک مهندس صدا مشهور ابی رود می نامد. در تصمیمی در این ماه، قاضی دیوید کوان حکم داد که Calderstone Productions - یک واحد UMG که مدیریت کاتالوگ بیتلز را بر عهده دارد - دارای وجهه قانونی است تا به دنبال بازیابی نوار کمیاب از دارایی جف امریک باشد، کسی که طبق ادعای این برچسب چندین دهه قبل آن را دزدیده است. بیتلزهای مرتبط برای فروش: فهرست 1300 رکورد کمیاب بیتلز از مجموعه خصوصی، کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در سن 71 سالگی درگذشت. تخریب، استدلال کرده بود که UMG نمی تواند یک \"زنجیره عنوان\" را نشان دهد تا ثابت کند که جانشین قانونی Abbey Road است، به این معنی که در وهله اول فاقد حقوق مالکیت است. اما در حکمی در 16 اکتبر، قاضی کوان این استدلال را رد کرد: \"کالدرستون نشان می دهد که چگونه زنجیره عنوان این حق را به آن می دهد که ادعای تبدیل اساسی خود را پیگیری کند.\" قاضی با استفاده از اصطلاح قانونی برای قانون مدنی معادل سرقت گفت. این تصمیم که به طور انحصاری توسط بیلبورد گزارش شده است، زمینه را برای محاکمه در اوایل سال آینده در مورد مسئله بزرگ باقی مانده فراهم می کند: اینکه آیا ابی رود به طور قانونی مالکیت نوار را رها کرده است یا خیر. املاک می گوید که اساسا دور انداخته شد و امریک آن را نجات داد. UMG استدلال می کند که همیشه دارایی شرکت بوده است: \"در این اقدام یک مصنوع بسیار ارزشمند از تاریخ راک اند رول مورد بحث است که به سرقت رفته است.\" اما قبل از آن،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/886649924-e1791904779538.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "موسیقی"], "datetime_fa": "۶ آبان • ۲۲:۳۵"}, {"source": "Billboard", "title": "Maybelline & Billboard Bring Music and Beauty Together at Latin Music Week", "link": "https://www.billboard.com/music/features/maybelline-billboard-bring-music-and-beauty-at-latin-music-week-26-1236369861/", "summary": "Billboard Latin Music Week 2026 was a celebration of culture and empowerment for fans, industry executives and artists across the Latin diaspora. Recognizing everyone’s unique identities while highlighting their commonalities is the ethos of the annual series of events; and Billboard’s makeup partner, Maybelline New York, put an even bolder spotlight on self-expression. Maybelline welcomed attendees each day of the conference, encouraging guests to rock their existing looks while discovering new ways to enhance them with the brand’s versatile product lineup. A touch-up station and full-length mirror, positioned alongside product displays, quickly became a fan favorite spot, giving attendees the perfect opportunity to refresh their looks and capture selfies documenting their Latin Week experience. Melody Timothee Tapping into the music and energy of Latin Week, Maybelline invited fans to put their own spin on the brand’s iconic “Maybe it’s Maybelline” jingle at an interactive recording booth. Set to bachata, cumbia, and reggaeton instrumentals, attendees stepped up to a vintage microphone to record their own rendition, creating a playful moment in the spotlight that brought the spirit of Latin Week to life. Participants walked away with Maybelline gift bags filled with brand favorites like Grippy Setting Mist, Lash Sensational Sky High Mascara, Cloudtopia Lip Cheek Mousse, Super Stay Summer Shot Face Tanning Drops, Super Stay Peel-Off Lip Liner and more. Melody Timothee On the second day of the conference (Tuesday, Oct. 20), Yasmin Dastmalchi, President of Maybelline and essie US, sat down for an Executive Keynote moderated by Billboard’s Leila Cobo. Throughout the conversation, Dastmalchi highlighted the connection between music and makeup, showing how the two are rooted in shared tradition and self-expression. “There are two things that connect music and makeup: self-expression and emotion,” Dastmalchi shared. “You feel something when you put that lipstick on, in the same way that you feel something when you hear a song you really like.” Leila Cobo, Co-Chief Content Officer at Billboard, and Yasmin Dastmalchi, President of Maybelline and essie US, participate in an executive keynote during Billboard Latin Music Week 2026 at Faena Forum in Miami Beach, Florida. Presented by Maybelline New York. Melody Timothee Maybelline has a longstanding connection to music, most notably through its collaboration with Miley Cyrus. Now, the brand is building on that legac", "date_str": "2026-10-28T19:04:34+00:00", "hash": "5280b79b19cf7912", "title_fa": "Maybelline و Billboard موسیقی و زیبایی را در هفته موسیقی لاتین به ارمغان می آورند", "summary_fa": "هفته موسیقی لاتین بیلبورد 2026 جشنی برای فرهنگ و توانمندسازی برای طرفداران، مدیران صنعت و هنرمندان در سراسر دیاسپورای لاتین بود. شناخت هویت‌های منحصر به فرد هر کس و در عین حال برجسته کردن اشتراکات آن‌ها، اخلاق سلسله رویدادهای سالانه است. و شریک آرایش بیلبورد، میبلین نیویورک، توجه جسورانه تری را به بیان خود معطوف کردند. می‌بلین هر روز از کنفرانس استقبال می‌کرد و مهمانان را تشویق می‌کرد تا ظاهر موجود خود را تغییر دهند و در عین حال راه‌های جدیدی برای ارتقای آن‌ها با مجموعه محصولات همه‌کاره این برند کشف کنند. یک ایستگاه لمسی و یک آینه تمام قد، ​​که در کنار نمایشگرهای محصولات قرار گرفته بودند، به سرعت به مکان مورد علاقه طرفداران تبدیل شدند و به شرکت کنندگان فرصتی عالی برای تازه کردن ظاهرشان و گرفتن سلفی هایی که تجربه هفته لاتین خود را مستند می کنند، می دهد. ملودی تیموتی با بهره‌گیری از موسیقی و انرژی هفته لاتین، می‌بلین از طرفدارانش دعوت کرد تا در یک غرفه ضبط تعاملی، آهنگ نمادین برند «شاید می‌بلین» را به نمایش بگذارند. شرکت‌کنندگان که روی سازهای باچاتا، کامبیا و رگیتون تنظیم شده بودند، به سمت میکروفون قدیمی رفتند تا اجرای خود را ضبط کنند و لحظه‌ای سرگرم‌کننده در کانون توجه ایجاد کردند که روح هفته لات انی جسیکا چستین برای Blumhouse Atomic Monster و یونیورسال، بر اساس رمانی از جاش مالرمن، که با وجود عملکرد ضعیف منتقدان، در آخر هفته 9 اکتبر در صدر باکس آفیس داخلی قرار گرفت و در زمان گزارش جهانی نزدیک به 100 میلیون دلار فروش داشت، تازه است. داستان‌های مرتبط بازیگران کیانو ریوز در حال چرخش جیمز وان به نام گانگستر، پلیس، شیطان در خریدهای پارامونت فرانسیس لارنس برای کارگردانی فیلم علمی تخیلی Red Rising For Paramount در Molepeople، مردی به داخل تونل‌های متروکه در زیر شهر نیویورک فرود می‌آید، جایی که او متوجه می‌شود که در خیابانی در خیابان نیویورک قرار دارد. پارامونت قرار است این فیلم را در 27 آگوست 2027 در سراسر جهان توزیع کند. آنها انتخاب بازیگران استنفیلد و بن مندلسون را اعلام کردند که در هیئت باقی می ماند، در همان روزی که Other Mommy افتتاح شد. مشخص نیست که آیا می‌توان انتظار تغییر در برنامه را داشت یا خیر، زیرا گزارش‌ها حاکی از آغاز تولید فیلم در بریتانیا در اواخر نوامبر است. فیلم Molepeople توسط Nathan Elston، همکار دیگر مامان Savage، به صورت مستقل ساخته شد و Savage برای اولین بار در اکتبر 2024 به عنوان کارگردان معرفی شد. رافائل مارگولز و جی دی لیفشیتز که قرار بود از طریق بنر BoulderLight Pictures خود تولید کنند، پس از انتخاب شدن برای رهبری برچسب جدید استودیو با ژانر متمرکز، Paramount Primal، پروژه را به پارامونت", "image_url": "https://deadline.com/wp-content/uploads/2026/10/Ben-Wheatley-Rob-Savage-and-LaKeith-Stanfield.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["سینما", "سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۲۳:۳۰"}, {"source": "Deadline", "title": "Fox News Tops October Ratings, But Viewership Drops Vs. 2025; MS NOW And CNN Show Gains As Midterms Approach", "link": "https://deadline.com/2026/10/october-cable-news-ratings-fox-news-cnn-ms-now-1237207374/", "summary": "Fox News again topped October ratings by a wide margin, but its viewership fell during the month when compared to the same period in 2025. MS NOW and CNN, meanwhile, showed gains, likely driven by the approaching midterms. In primetime, Fox News averaged 1.68 million viewers, down 28% fr
