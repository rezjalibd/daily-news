k", "title": "Nino Paid and Warhol.SS Arrested on Felony Murder and Armed Robbery Charges", "link": "https://pitchfork.com/story/nino-paid-and-warholss-arrested-on-felony-murder-and-armed-robbery-charges/", "summary": "Authorities are investigating the rappers in connection with the April death of Keion Borders in Atlanta", "date_str": "2026-10-15T17:06:52+00:00", "hash": "4a0b53a676d592f0", "title_fa": "Nino Paid و Warhol.SS به اتهام قتل جنایی و سرقت مسلحانه دستگیر شدند", "summary_fa": "مقامات در حال تحقیق درباره رپرها در ارتباط با مرگ Keion Borders در آوریل در آتلانتا هستند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان Nino Paid و Warhol.SS در ارتباط با یک قتل و سرقت مسلحانه در آتلانتا دستگیر شده اند. این خواننده های رپ که نام اصلی آنها به ترتیب جاکوون اندروز و ظهیر مایلز است، به قتل، سرقت مسلحانه و ضرب و جرح متهم شده اند. Pitchfork با نمایندگان هر دو هنرمند تماس گرفت و مایلز از اظهار نظر خودداری کرد. اتهامات اندروز و مایلز ناشی از دخالت ادعایی آنها در تیراندازی در آوریل 2026 به Keion Borders است که بعداً پس از تسلیم شدن بر اثر جراحات در بیمارستان در کاپیتول جورجیا درگذشت. گفته می‌شود که اندروز از طریق فیلم‌های دوربین زنگ در به عنوان همدست این جنایت شناخته شد. تا این لحظه هیچ مظنون دیگری متهم نشده است. بنا بر گزارش ها، اندروز در اول سپتامبر در حالی که تلاش می کرد پس از یک نمایش برنامه ریزی شده در تورنتو وارد کشور شود، توسط مقامات گشت مرزی ایالات متحده در مرز کانادا دستگیر شد. این خواننده رپ مستقر در DMV قبل از استرداد اخیر به آتلانتا در زندان وین کانتی میشیگان بازداشت شد. اندروز آخرین آلبوم خود را با نام Somewhere Over the Rainbow در ماه اوت منتشر کرد. علاوه بر این سه اتهام، مایلز همچنین با اتهام چهارم به دلیل تلاش جنایی برای ارتکاب جنایت روبرو است. ظاهراً خواننده رپ آتلانتا در 14 سپتامبر در ارتباط با قتل خود را به پلیس تبدیل کرد. آخرین آلبوم Warhol.SS او، Studio 54، در ژانویه منتشر شد. پلیس انگیزه تیراندازی را به اشتراک گذاشته است. هر دو رپر بدون ضمانت در زندان باقی می مانند و اندروز قرار است امروز (15 اکتبر) برای جلسه دادگاه حاضر شود."}, {"source": "Pitchfork", "title": "Justice Composed the Score for Grand Theft Auto VI", "link": "https://pitchfork.com/story/justice-composed-the-score-for-grand-theft-auto-vi/", "summary": "The French electronic duo have also tapped Tame Impala, SZA, and King Gizzard for a new song from the game’s soundtrack", "date_str": "2026-10-15T16:52:34+00:00", "hash": "301a3b86a9860d48", "title_fa": "جاستیس امتیاز بازی Grand Theft Auto VI را ساخت", "summary_fa": "این دو الکترونیک فرانسوی همچنین Tame Impala، SZA و King Gizzard را برای آهنگ جدیدی از موسیقی متن بازی Loader Save Story ذخیره این داستان Comment Loader Save Story Save this Story Rockstar Games فاش کرده است که Justice موسیقی متن اصلی بازی Grand Theft Auto VI را ساخته است. امروز دوتایی الکترونیک فرانسوی نیز سهم خود را در موسیقی متن گسترده این بازی ویدیویی به اشتراک گذاشته اند. «Flower in a Hurricane» دارای سه‌گانه‌ای از Tame Impala، SZA، و King Gizzard the Lizard Wizard است و می‌توانید تکه‌هایی از آن را در تریلر معرفی جدید GTA VI در زیر بشنوید. آخرین امتیاز Grand Theft Auto، در سال 2013، یک تلاش مشترک بین Alchemist، Tangerine Dream، Woody Jackson و Oh No بود که توسط DJ Shadow میکس و همگام شده بود. عدالت پس از انتشار آخرین LP خود، Hyperdrama 2024، ظاهر را به خود می گیرد. آلبوم «Neverender»، تیم دیگر Tame Impala، جایزه گرمی را برای بهترین رقص/ضبط الکترونیکی در سال 2025 به آن‌ها داد. موسیقی متن 34 آهنگ BTA VI قبل از انتشار رسمی آن در 19 نوامبر در کنار بازی در 19 نوامبر به آرامی پخش می‌شود. تاکنون 9 آهنگ منتشر شده است، از جمله آهنگ‌های Lecottan، و مشارکت‌های S. هفته گذشته، Rockstar همچنین از دی جی های رادیویی درون بازی برای GTA VI رونمایی کرد. به زودی، می‌توانید با Bad Bunny's Cocoteo FM، Robyn's Flash FM، Lana Del Rey's Back Country Radio و موارد دیگر هماهنگ شوید. بازبینی فیلیپ شربرن از Hyperdrama عدالت."}, {"source": "Pitchfork", "title": "Skrillex and Ring Noord Remix Danny L Harle and PinkPantheress’ “Starlight”", "link": "https://pitchfork.com/story/skrillex-and-ring-noord-remix-danny-l-harle-and-pinkpantheress-starlight/", "summary": "Fixing up the Cerulean single with a heavy new undercarriage", "date_str": "2026-10-15T15:05:10+00:00", "hash": "fe54f0c59ca784c3", "title_fa": "ریمیکس Skrillex و Ring Noord \"Starlight\" از Danny L Harle و PinkPantheress", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Skrillex با گروه هلندی Ring Noord همکاری کرده است تا آخر هفته را با ریمیکسی از PinkPantheress به کمک Danny L Harle \"Starlight\" آغاز کنند. این آهنگ در اصل یک تک‌آهنگ مستقل - و اولین آهنگ هارل در XL بود - قبل از ارائه به خدایان ریمیکس، در آلبوم Cerulean LP امسال ظاهر شد. به برداشت جدید بسیار سنگین در زیر گوش دهید. این ریمیکس جدیدترین اضافه شده به مجموعه هارل سرولین دیورجنس است که موسیقی را از اولین بازی خود، گاه تا حدی رادیکال، بازسازی می کند. ساشا اخیراً برداشتی از «قایق در دریا» ارائه کرده است. Skrillex، در عین حال، در مدار زنده باقی می ماند - جایی که او به سادگی تمام تلاش خود را می کند - در پشت آلبوم ژوئن خود Soma."}, {"source": "Rolling Stone", "title": "‘Corruption to Go Around’: How Dems Are Preparing to Investigate Trump After the Midterms", "link": "https://www.rollingstone.com/politics/politics-features/democrats-prepare-investigations-trump-midterms-1235643404/", "summary": "Oversight Committee Democrats dished to Rolling Stone about their accountability wish list if the party retakes control of Congress", "date_str": "2026-10-16T14:00:00+00:00", "hash": "1d77ebe01d90fc5f", "title_fa": "«فساد به دور»: چگونه دموکرات ها برای تحقیق درباره ترامپ پس از انتخابات میان دوره ای آماده می شوند", "summary_fa": "دموکرات‌های کمیته نظارت به رولینگ استون درباره لیست خواسته‌های خود درباره پاسخگویی در صورت بازپس‌گیری مجدد کنگره توسط این حزب گفتند در اوایل سال جاری، مایک جانسون، رئیس مجلس نمایندگان به اتاقی از محافظه‌کاران مسیحی هشدار داد که اگر دموکرات‌ها موفق شوند کنگره را در انتخابات میان‌دوره‌ای بازپس بگیرند، «استیضاح حتی نگرانی بزرگی نیست». او هشدار داد: «آنها هر کمیته کنگره را به یک نهاد تحقیقی تبدیل خواهند کرد و به دنبال خانواده رئیس جمهور، کابینه، اهداکنندگان و دوستان او خواهند رفت. او افزود: \"نیمی از شما در این اتاق هدف قرار خواهند گرفت. من برنامه حفاظت را اجرا می کنم. من از شما مراقبت خواهم کرد.\" درست چند هفته قبل از انتخابات میاندوره ای نوامبر، به نظر می رسد رای دهندگان آماده هستند تا دو سال اول حکومت یکپارچه جمهوری خواهان تحت رهبری دونالد ترامپ را سرزنش کنند. نظرسنجی‌ها - و زمزمه‌های خصوصی جمهوری‌خواهان - نشان می‌دهد که حزب احتمالا مجلس نمایندگان را از دست خواهد داد و حتی می‌تواند شاهد سقوط اکثریت محدود سنا به دست مخالفان باشد. دموکرات‌های کنگره در تلاش هستند تا به هشدار جانسون پاسخ دهند. به عنوان حزب اقلیت در هر دو مجلس، توانایی آن‌ها برای قانون‌گذاری، انجام تحقیقات، مسدود کردن اولویت‌های اداری و اعمال اختیارات نظارتی از نظر ساختاری محدود است. اگر آنها اکثریت را به دست آورند، آماده هستند تا راه هایی را که رئیس جمهور و دولتش به طور مکرر از اختیارات خود فراتر رفته اند و قانون اساسی را غصب کرده اند، و همچنین فساد گسترده در جهان گسترده ترامپ را به صفر برسانند."}, {"source": "Rolling Stone", "title": "Steven Soderbergh Will Help Matt Reeves Finish ‘The Batman II’", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/the-batman-ii-steven-soderbergh-matt-reeves-1235643770/", "summary": "Soderbergh will oversee the rest of principal photography on the film after Reeves stepped away to tend to a family matter", "date_str": "2026-10-16T13:52:48+00:00", "hash": "0f9d7818ba228400", "title_fa": "استیون سودربرگ به مت ریوز در پایان «بتمن ۲» کمک خواهد کرد.", "summary_fa": "سودربرگ بعد از کناره‌گیری ریوز برای رسیدگی به یک موضوع خانوادگی، بر بقیه عکاسی اصلی فیلم نظارت خواهد کرد. پس از اینکه مت ریوز، فیلمساز برای رسیدگی به یک «مسئله خانوادگی» کنار رفت، تولید بتمن ۲ با استفان سودربرگ برای کمک به تکمیل عکاسی اصلی از سر گرفته خواهد شد. یکی از نمایندگان استودیو دی سی این خبر را در بیانیه ای که با Variety به اشتراک گذاشته است، تایید کرد. این نماینده گفت: «در حالی که مت ریوز به رسیدگی به یک موضوع خانوادگی در حال انجام ادامه می‌دهد، استیون سودربرگ، به‌عنوان تحسین‌کننده آثار مت، به مت نزدیک شد و با حمایت کامل استودیو دی‌سی وارد عمل خواهد شد تا به نویسنده و کارگردان کمک کند هفته‌های پایانی عکاسی اصلی بتمن قسمت 2 را تکمیل کند. مت و استیون از نزدیک با بازیگران و گروه کار خواهند کرد تا دیدگاه مت از فیلم را برآورده کنند. این خبر درست بیش از یک هفته پس از آن منتشر شد که دی سی فاش کرد که تولید فیلمی که از قبل به تعویق افتاده بود متوقف خواهد شد تا ریوز بتواند به موضوع نامشخصی رسیدگی کند. فیلمساز یادداشت کوتاهی را در X به اشتراک گذاشت که در آن توضیح داد که «بتمن ۲» را «ترک نمی‌کند»، اما تا زمانی که عکاسی اصلی به پایان می‌رسد سر صحنه فیلمبرداری نخواهد بود. ریوز همچنین از سودربرگ \"برای کمک به من در این دوران چالش برانگیز، و همچنین از طرفداران \"به خاطر نگرانی و آرزوهای خوب شما\" تشکر کرد. سودربرگ در بیانیه خود گفت: «به نظر من کار مت ریوز روی بتمن خیره کننده بود. عمدی، مشخص و کاملاً منسجم بود. هدف در اینجا همکاری با مت و تیمش برای تولید فیلمی است که به طور یکپارچه با آنچه قبلاً فیلمبرداری شده یکپارچه شود تا مت بتواند فیلم خود را به درستی تمام کند.\""}, {"source": "Rolling Stone", "title": "Jenni Rose Announces Tomgirls Project But Says Vandoliers Are Here to Stay", "link": "https://www.rollingstone.com/music/music-features/jenni-rose-vandoliers-interview-tomgirls-band-1235643763/", "summary": "After coming out as a trans woman last year, the Texas singer-songwriter decided to write about it for a new pop-punk band. “The idea of it is the trans experience,” Rose says", "date_str": "2026-10-16T13:40:49+00:00", "hash": "d941794f6475a091", "title_fa": "جنی رز پروژه Tomgirls را اعلام کرد اما می‌گوید وندولی‌ها اینجا هستند تا بمانند", "summary_fa": "پس از اینکه سال گذشته به عنوان یک زن ترنس ظاهر شد، این خواننده و ترانه سرای تگزاسی تصمیم گرفت در مورد آن برای یک گروه جدید پاپ پانک بنویسد. رز می گوید: «ایده آن تجربه ترنس است.» بار دیگر، جنی رز خود را در قلمروی ناآشنا می یابد. و بار دیگر، او در ترکیبی از هیجان محتاطانه و اضطراب خام غرق شده است. رز به رولینگ استون می گوید: «من فقط داشتم با دوست دخترم صحبت می کردم، و نمی توانم باور کنم که مردم این حرف را بشنوند و من را اینطور ببینند.» رز به Tomgirls، یک گروه موسیقی پاپ پانک سه نفره اشاره می‌کند که او با هم گروه‌هایش تری آلفارو و پاتریک اسمیت واندولیرز تشکیل داد. پس از بیرون آمدن به عنوان یک زن ترنس در آوریل 2025، زمانی که Vandoliers - گروه گاوپانک رز که در سال 2015 تأسیس کرد - آلبوم Life Behind Bars خود را معرفی کرد، رز Tomgirls را به عنوان یک پروژه جانبی برای کمک به پردازش و بیان کالیدوسکوپ احساساتی که ناگهان به عنوان رهبر ترنس یک گروه کانتری در تگزاس احساس می کرد، ساخت. آن گروه، Vandoliers، به جایی نمی رسد. اما تام‌گرل‌ها همان چیزی هستند که امروزه ذهن رز را به خود مشغول کرده است. در فوریه، آنها Sissy، اولین LP خود را با 10 آهنگ، در لیبل مستقل رز Skull and Bow Records منتشر خواهند کرد. Tomgirls حتی یک وب سایت اختصاص داده شده برای پیش خرید راه اندازی کرد. رز می گوید: «ایده آن تجربه ترنس است، و این ساختار پویا در پذیرش خود است.» قبل از آلبوم، Tomgirls اولین تک آهنگ سیسی «Run» را در روز جمعه به همراه ویدیوی همراهش منتشر کرد - یک محصول کلاسیک با مضمون پاپ پانک که شامل رز با لباس سفید، آواز خواندن، رقصیدن و نواختن گیتار الکتریک است."}, {"source": "Rolling Stone", "title": "Is There Any Choice But ‘Choosin’ Texas’ for Best Country Song at the 2027 Grammys?", "link": "https://www.rollingstone.com/music/music-features/grammys-2027-best-country-song-predictions-nominees-1235643348/", "summary": "Ella Langley's record-setting hit is all but a lock, but songs by Megan Moroney and Taylor Swift can offer competition", "date_str": "2026-10-16T13:20:04+00:00", "hash": "2fa9f408f1ccd9fc", "title_fa": "آیا گزینه ای جز «انتخاب تگزاس» برای بهترین آهنگ کانتری در گرمی 2027 وجود دارد؟", "summary_fa": "رکورد رکورد الا لنگلی فقط یک قفل است، اما آهنگ‌های مگان مورونی و تیلور سویفت می‌توانند رقابت کنند. برای هر کدام، نامزدها و همچنین اینکه چه کسی (و چه کسی باید) در شب گرمی برنده شود را پیش‌بینی می‌کنیم. احتمالاً هیچ زمانی در تاریخ اخیر وجود نداشته است که یک آهنگ کانتری به لطف آهنگ \"Choosin' Texas\" اثر الا لنگلی، چنین بخش غالب گفتگوهای فرهنگی باشد. این آهنگی است که رکوردها را شکسته و میلیون ها مکالمه را برانگیخته است (و همچنین مشاجره). اما آیا بر جوایز گرمی 2027 تسلط خواهد داشت؟ شرط‌بندی‌های هوشمند می‌گویند بله، اما این بدان معنا نیست که امسال آهنگ‌های زیادی وجود ندارد که شایسته این جایزه باشند. وارد گونتر از موسسه زنده ویسکی جم نشویل و میزبان موسیقی کانتری برای اپل موزیک می‌گوید: «همه نگاه‌ها به الا لنگلی است. اما او با رقابت قابل توجهی در سراسر جهان روبرو است. کلسی بالرینی، «من در پارک‌ها می‌نشینم» الا لنگلی، «چوسین تگزاس» مگان مورونی، «چیزهای زیبا» کیسی ماسگریوز، «طلای خشک» تیلور سویفت، «من آن را می‌دانستم، تو را می‌شناختم» فقط به این دلیل که آمریکا امسال تگزاس را انتخاب کرد، به این معنی نیست که رای دهندگان. گونتر می‌گوید: «رای دادن به الا تا پایان رأی‌گیری بسیار آسان است، زیرا او آشناترین نام است»."}, {"source": "Rolling Stone", "title": "How a 1972 Cocktail Party Gave Us the Best Documentary of the Year", "link": "https://www.rollingstone.com/tv-movies/tv-movie-reviews/once-upon-a-time-in-harlem-best-documentary-of-the-year-1235640811/", "summary": "Once Upon a Time in Harlem revisits a once-in-a-lifetime reunion of artists, musicians, and intellectuals who made history — and changed the world", "date_str": "2026-10-16T13:00:06+00:00", "hash": "9fa2bd8814d9a1fb", "title_fa": "چگونه یک کوکتل پارتی در سال 1972 بهترین مستند سال را به ما داد", "summary_fa": "روزی روزگاری در هارلم یک بار در زندگی گردهمایی هنرمندان، نوازندگان و روشنفکرانی را که تاریخ ساز شدند - و جهان را تغییر دادند، مرور می کند. آن‌ها شاعر و پیانیست، نقاش و عکاس، روزنامه‌نگار و میزبان سالن، حرکت‌دهنده و شیکر هستند، همه آنها کوکتل می‌نوشند و درباره روزهای گذشته گپ می‌زنند. سال 1972 است. ویلیام گریوز، فیلمساز (Symbiopsychotaxiplasm: Take One) پس از قرض گرفتن آپارتمان دوک الینگتون در بالای شهر، از دیگر افراد برجسته جنبش هنری موسوم به رنسانس هارلم برای اتحاد دوباره دعوت کرد. برخی از دوستان قدیمی هستند. بعضی ها دهه هاست همدیگر را ندیده اند. همه آنها در شمال خیابان 110 تاریخ ساز شدند که در سراسر جهان طنین انداز شد. گریوز دوربین‌هایش را در حال چرخش نگه داشت، افسانه‌ها را با محبت خاطرات را به تصویر می‌کشید، کینه‌ها را پخش می‌کرد، نسبت به نسل بعدی آزرده خاطر می‌کرد و گه‌گاه در جایی که اعتبار لازم است طلب اعتبار می‌کرد. آرنا بونتمپس اعلام می‌کند که جنبش رسماً زمانی آغاز شد که شاعر همکارش، کنتی کالن، اثر خود را «میراث» منتشر کرد. ایدا مای کالن، بیوه کنته، مکرراً می پرسد که چرا هیچ کس دیگری در مهمانی با او مانند شخصیت اصلی او رفتار نمی کند. به پشت سیلی زده می شود و خلق و خوی شعله ور می شود. چیزها تند می شوند. برخی می گویند در سال 1921 به اوج خود رسید. برخی دیگر ادعا می کنند که هرگز به پایان نرسید. یکی از مهمانداران اعلام می کند که این دوره پربار زندگی خلاقانه و روشنفکرانه حتی یک رنسانس نبود. این یک بیداری بود. اگر روزی روزگاری در هارلم صرفاً وقایع آن گردهمایی یک بار در زندگی بود - اگر به شما اجازه می‌داد جز یک مگس فضول روی یک دیوار جهنمی با طراحی عالی نباشید - این مستند همچنان در دسته فیلم‌هایی قرار می‌گیرد"}, {"source": "Rolling Stone", "title": "A$AP Rocky Talks Disc 2 of ‘Don’t Be Dumb’ and Grammy Season: ‘I Got to Take Something Home, Man’", "link": "https://www.rollingstone.com/music/music-features/aap-rocky-interview-dont-be-dumb-disc-2-tour-1235643413/", "summary": "The chart-topping rapper checks in from tour to run through his huge 2026 — and tease what’s next", "date_str": "2026-10-16T12:58:18+00:00", "hash": "67e5838e23d40b59", "title_fa": "A$AP Rocky Talks Disc 2 از «Don’t Be Dumb» و فصل گرمی: «من باید چیزی را به خانه ببرم، مرد»", "summary_fa": "رپر برجسته از تور بازدید می کند تا در سال 2026 بزرگ خود را بگذراند - و متلک کند که A$AP Rocky که اخیراً در صحنه های صحنه شعله نور دیده می شود در حالی که یک مگافون را به عنوان میکروفن در دست دارد دیده شده است، کمی آرام تر از حد معمول صحبت می کند. A$AP Rocky با صدایی کشیده می‌گوید: «دارم آدمک می‌رفتم. این خواننده رپ هارلم، سال 2026 را پس از چند طعنه و شروع اشتباه، برای پایان دادن به فاصله هشت ساله در دیسکوگرافی خود انتخاب کرد. او در ماه ژانویه آلبوم پرطرفدار Don't Be Dumb را منتشر کرد و از آن زمان به بعد احساس کرد که زیبا فلاکو به یکباره همه جا حضور دارد: نمایش جوایز، فشن شوهای Chanel، نمایش مد AWGE با بیش از 6000 شرکت کننده، جلد مجلات و در خیابان های منهتن (جزئیات امنیتی به نیویورک می گوید لعنت به دنیاست). A$AP Rocky که از پاریس زنگ می‌زند، مسلماً بعد از تمام سفر کمی دلتنگ می‌شود، گزارش پیشرفت سال خود را به رولینگ استون می‌دهد، درباره نمایش مد رکوردشکنی‌اش صحبت می‌کند، چرا موهایش را قرمز کرده است، و ریوت، پسر سه ساله‌اش با ریحانا را روی صحنه در کپنهاگ دعوت می‌کند. او می‌گوید که خود را برای یک «فصل بعدی» مرموز و یک دوره دیگر از تور Don't Be Dumb در استرالیا و نیوزیلند در دسامبر آماده می‌کند. او می‌گوید: \"ما دوباره گنگ می‌شویم. این نام آن تور است.\" ای کاش می توانستم به آمریکای جنوبی و آفریقا ضربه بزنم، اما این اتفاق بعدی است.» و دیسک 2 را مسخره می‌کند، پروژه‌ای که او آن را «توسعه» Don’t Be Dumb می‌نامد."}, {"source": "Rolling Stone", "title": "Oregon School Shooting: 3 Children and a Teacher Killed in Tragedy", "link": "https://www.rollingstone.com/culture/culture-news/bend-oregon-school-shooting-1235643739/", "summary": "The 16-year-old suspect was fatally shot by an armed bystander, police said", "date_str": "2026-10-16T05:21:29+00:00", "hash": "4641bee125644ee9", "title_fa": "تیراندازی در مدرسه اورگان: 3 کودک و یک معلم در تراژدی کشته شدند", "summary_fa": "به گفته پلیس، مظنون 16 ساله به ضرب گلوله یکی از افراد مسلح کشته شد، پلیس گفت: سه کودک و یک معلم بعدازظهر پنجشنبه در تیراندازی در مدرسه ابتدایی در بند، اورگان، کشته شدند و به گفته پلیس، مظنون 16 ساله توسط یکی از افراد مسلح مورد اصابت گلوله قرار گرفت. در طی یک کنفرانس خبری، رئیس مایک کرانتز از اداره پلیس Bend گفت که مقامات یک تماس با 911 دریافت کردند \"از شخصی که در یک وسیله نقلیه بود که گزارش داد توسط فردی با اسلحه بلند چندین بار شلیک شده است.\" بلافاصله پس از آن، آنها ده ها تماس دریافت کردند مبنی بر اینکه یک تیرانداز وارد ساختمان مدرسه ابتدایی ریل سیلور شده است و یک زنگ هشدار در ساعت 1 بعد از ظهر ارسال شد. خطاب به تمامی ماموران مجری قانون یک دقیقه بعد به مدرسه دستور داده شد که تعطیل شود. کرانتز گفت که یکی از اعضای جامعه که مظنون را دید قبل از شلیک گلوله او را به مدرسه تعقیب کرد و به ضرب گلوله به او شلیک کرد. رئیس پلیس گفت: ماموران در صحنه سه کودک پنج، هشت و یازده ساله و یک معلم را کشته اند. یک کودک هفت ساله و یک معلم دیگر به شدت مجروح شدند. پلیس مظنون را یک جوان 16 ساله از اهالی بندر شناسایی کرد. در کنفرانس روز پنج شنبه، پلیس نامی از قربانیان، تیرانداز یا رهگذری که او را به قتل رسانده، اشاره نکرد. به خانواده‌های قربانیان اطلاع داده شده است. کرانتز گفت: لطفاً بدانید که ما سخت کار می کنیم تا اطمینان حاصل کنیم که تحقیقات کاملی انجام می دهیم. این زمانی است که می دانیم این موضوع عمیقاً بر جامعه تأثیر می گذارد. از همه می خواهیم که به یکدیگر تکیه کنند و در کنار یکدیگر باشند. داستان‌های پرطرفدار نیل یانگ «دیگر» را ستایش می‌کند:"}, {"source": "Rolling Stone", "title": "Zach Bryan Links Up With Lana Del Rey for Delicate Duet ‘Lies’", "link": "https://www.rollingstone.com/music/music-news/zach-bryan-lana-del-rey-lies-1235642159/", "summary": "Track is off Bryan's new EP Young Manhood and Other Donatable Organs Tour", "date_str": "2026-10-16T04:11:34+00:00", "hash": "5fc7557cb5724345", "title_fa": "زک برایان با لانا دل ری برای Delicate Duet \"Lies\" ارتباط برقرار کرد.", "summary_fa": "Track is off EP جدید برایان جوان مردانگی و تور اندام های اهدایی دیگر EP جدید زک برایان Young Manhood و سایر اعضای قابل اهدای تور اینجا است، و شامل Lies، دوئت موردانتظار او با لانا دل ری است. آهنگ با پیانو و تنظیم زهی درخشان آغاز می شود در حالی که برایان اولین بیت را می خواند. بعد از اینکه خنده دل ری به طور ضعیف در پس زمینه شنیده می شود، قبل از اینکه با هم هماهنگ شوند، یک بیت بعدی را می گیرد. مانند بقیه EP، Lies در Easy Eye Sound دن اورباخ در نشویل قطع شد و توسط برایان، جیمی مک لافلین و ادی اسپیر تهیه شد. دل ری ماه گذشته در اینستاگرام پستی درباره این همکاری منتشر کرد که با عنوان نهنگ همراه شد، بالاخره آهنگمان را انجام دادیم. و این دروغ نیست، اشاره به عنوان. برایان سابقه همکاری های موفقی دارد، از بروس اسپرینگستین تا کیسی ماسگریوز. همه چیز را به یاد می‌آورم، دوئت او در سال 2023 با ماسگریوز، نامزد دریافت دو جایزه گرمی (بهترین آهنگ کانتری و بهترین اجرای دونفره/گروهی) شد و در جایگاه شماره یک در بیلبورد هات 100 (اولین موفقیت شماره یک برای هر دو طرف) قرار گرفت. برایان جوان مردانگی و سایر اعضای قابل اهدای تور همچنین Plainsman with Turnpike Troubadours را به نمایش می گذارد. EP آلبوم عظیم 25 آهنگی او را با بهشت ​​در بالا دنبال می کند که در ابتدای سال منتشر شد. او اخیراً از تور استادیوم 23 روزه برای سال آینده در آمریکای شمالی و استرالیا خبر داده است. جان فوگرتی، خواننده و ترانه سرای نوظهور، اما اوژیر، و دیگران قرار است در تاریخ های مشخصی افتتاح شوند. داستان‌های پرطرفدار نیل یانگ «دیگر» را ستایش می‌کند: «بهترین فیلمی که تا به حال دیده‌ام» «اجازه رانندگی ندارم»: بیلی جوئل در حالی که آماده فروش موتورسیکلت‌های"}, {"source": "Rolling Stone", "title": "The ‘GTA VI’ Soundtrack Is Getting a Big Physical Media Rollout — Even if the Game Itself Isn’t", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/grand-theft-auto-vi-soundtrack-vinyl-buy-online-1235643548/", "summary": "You can pick up multiple vinyl variants of the soundtrack to the digital-download-only game", "date_str": "2026-10-16T03:37:44+00:00", "hash": "ebe474af4ea2c59b", "title_fa": "موسیقی متن «GTA VI» در حال انتشار رسانه فیزیکی بزرگی است - حتی اگر خود بازی اینطور نباشد", "summary_fa": "می‌توانید انواع وینیل‌های مختلف موسیقی متن بازی فقط برای دانلود دیجیتال را انتخاب کنید. اگر محصول یا خدماتی را که به‌طور مستقل بررسی شده را از طریق پیوندی در وب‌سایت ما خریداری کنید، Rolling Stone ممکن است کمیسیون وابسته دریافت کند. همه نشانه‌ها حاکی از آن است که Rockstar Games با Grand Theft Auto VI، بازی ویدیویی مورد انتظاری که ۱۳ سال از ساخت آن می‌گذرد، بزرگ‌تر و بزرگ‌تر می‌شود. این شامل موسیقی می‌شود که فهرستی از هنرمندان را به نمایش می‌گذارد. ایستگاه‌های رادیویی توسط Bad Bunny، Lana Del Rey، Robyn و دیگران میزبانی می‌شوند، در حالی که خود موسیقی متن آهنگ‌های اصلی همه از تراویس اسکات گرفته تا کیت ریچاردز را به نمایش می‌گذارد. دو نفر الکترونیکی فرانسوی Justice به عنوان آهنگسازان این بازی تایید شدند و یک آهنگ اصلی با حضور Tame Impala، SZA و King Gizzard the Lizard Wizard، \"Flower in a Hurricane\" را منتشر کردند. در مجموع 34 آهنگ اصلی شامل موسیقی متن بازی وجود دارد. GTA VI در 19 نوامبر عرضه می شود و موسیقی متن آن نیز در همان روز منتشر می شود. علاوه بر پخش جریانی، موسیقی متن فیلم در حال انتشار گسترده وینیل است. شما می‌توانید انواع انحصاری را از خرده‌فروشی‌هایی مانند آمازون، بارنز نوبل، والمارت، بهترین خرید انتخاب کنید، که همگی دارای فشارهای رنگارنگ متمایز موسیقی متن هستند. انواع انحصاری فروشگاهی و انحصاری مستقل نیز وجود دارد. از قضا، انتشار رسانه های فیزیکی عظیم موسیقی متن بازی در حالی رخ می دهد که بازی های مبتنی بر دیسک با برخی تهدیدات وجودی روبرو هستند. آخرین نسخه Grand Theft Auto اولین نسخه از این سری خواهد بود که در زمان عرضه فقط به صورت دیجیتال عرضه می شود. طبق گزارش هالیوود ریپورتر، هیچ برنامه‌ای برای انتشار نسخه‌ای مبتنی بر دیسک از این بازی در تاریخ بعدی وجود ندارد."}, {"source": "Rolling Stone", "title": "Tate McRae Can’t Be Contained in Lavish New ‘Housewife’ Video", "link": "https://www.rollingstone.com/music/music-news/tate-mcrae-housewife-video-new-song-1235643487/", "summary": "The pop singer's new song sees her push a baby carriage stuffed with cash and gallivanting with her suitors", "date_str": "2026-10-16T03:06:26+00:00", "hash": "88136f69634e2793", "title_fa": "تیت مک‌ری را نمی‌توان در ویدیوی مجلل جدید «خانه‌دار» نگه داشت", "summary_fa": "در آهنگ جدید خواننده پاپ، او یک کالسکه بچه پر از پول نقد را هل می‌دهد و تیت مک‌ری با خواستگارانش با بولدوزی به کلیشه‌های جدیدترین آهنگش، زن خانه‌دار، مشغول می‌شود. ویدیوی آهنگ جدید خواننده پاپ را می‌بیند که در عمارت، قایق تفریحی و مناظر مجلل مختلفش می‌رقصد و می‌گوید، من فقط می‌خواهم پول زیادی به دست بیاورم، خانه‌دار خودم باشم/تو می‌توانی کسی باشی که من به آن می‌گویم عسل/جنس من باش. در یک نقطه، او یک کالسکه کودک پر از پول نقد را هل می دهد. هنگامی که هفته گذشته در برنامه The Tonight Show Starring Jimmy Fallon ظاهر شد، خواننده پاپ کانادایی این تک آهنگ را کنایه زد. من خیلی هیجان زده ام مک‌ری گفت: مدتی است که آزاد نشده‌ام، و به نوعی درباره زنی است که نمی‌توان آن را مهار کرد. ما آن را در جنوب فرانسه فیلمبرداری کردیم، و بسیار جادویی و بسیار سرگرم کننده بود. فالون در ادامه از او پرسید که آیا مک‌ری تخم‌مرغ‌های عید پاک را به نشانه انتشار آهنگ انداخته است یا خیر. مک‌ری پاسخ داد به خصوص طرفداران من، ما همیشه تخم‌مرغ‌های عید پاک را می‌ریزیم و هیچ‌کدام از آنها را نمی‌گیرند. آنها همیشه به چیزهایی که کاملاً اشتباه هستند می پردازند. آنها مثل این خواهند بود که او عینک آفتابی زده است، بنابراین تک آهنگ بعدی او به نام Sunglass! مثلا چی؟ آنها هرگز واضح ترین تخم مرغ های عید پاک را دریافت نمی کنند. مک‌ری به واضح‌ترین سرنخ در طول مجموعه لولاپالوزا در شیکاگو در ماه اوت اشاره کرد و گفت که کلمه خانه‌دار در طول اجرای او روی صحنه ظاهر شد. این به معنای واقعی کلمه در مجموعه لولا من بود! گفت، خانم خانه دار وقتی مجموعه شروع شد، گفت. داستان‌های پرطرفدار نیل یانگ «دیگر» را ستایش می‌کند: «بهترین فیلمی که تا به حال دیده‌ام» «اجازه رانندگی ندارم»:"}, {"source": "Hollywood Reporter", "title": "‘Clayface’ Director James Watkins on Why He “Auditioned the Hell” Out of Star Tom Rhys Harries", "link": "https://www.hollywoodreporter.com/movies/movie-news/clayface-movie-actor-tom-rhys-harries-director-james-watkins-1236733512/", "summary": "The Welsh actor spent three months auditioning for the part and turned in two lengthy screen tests to play the title character. But he had no issues with it: \"I'm untested in this space, so I was glad he did it.\"", "date_str": "2026-10-16T13:00:00+00:00", "hash": "60048890cf79a6a4", "title_fa": "جیمز واتکینز کارگردان «Clayface» درباره «چرا او از «تام ریس هریس» ستاره «دختر آزمایش داد»", "summary_fa": "این بازیگر ولزی سه ماه را صرف تست بازیگری برای این نقش کرد و دو تست طولانی را برای بازی در نقش شخصیت اصلی انجام داد. اما او هیچ مشکلی با آن نداشت: \"من در این فضا آزمایش نشده ام، بنابراین خوشحالم که او این کار را انجام داد.\" فیلم Clayface، فیلم جدید استودیوی دی سی، بر روی یک ستاره سینمای هالیوود به نام تام هاگن تمرکز دارد که در پی حمله خشونت آمیزی که توسط یک رئیس اوباش گاتهام ترتیب داده شده بود، به شدت مخدوش شده است. هاگن که برای بازگرداندن آن زندگی زیبا ناامید است، تحت یک روش آزمایشی قرار می‌گیرد که در ابتدا کار می‌کند تا جای خود ing,' 'Whalefall' and 'Sense and Sensibility' are among the weekend's notable newcomers.", "date_str": "2026-10-16T00:27:59+00:00", "hash": "3a441bad16190f4a", "title_fa": "«Street Fighter» Eyes Box Office Victory در حالی که دکتر الیزابت هولمز پر سر و صدا برای اکران قوی می رود", "summary_fa": "«You Can See Everything»، «Whalefall» و «Sense and Sensibility» از جمله تازه واردان قابل توجه آخر هفته هستند. متن لوگو Street Fighter امیدوار است برای افتتاحیه آخر هفته عضلانی در باکس آفیس قرار گیرد زیرا با رقابت تعدادی از تازه واردها از جمله مستند A24 Elizabeth Holmes You Can See Everything مواجه است. پارامونت پیکچرز اقتباسی از بازی ویدیویی Street Fighter را در بیش از 3500 سینمای آمریکای شمالی در روز جمعه منتشر می‌کند، با پیش‌بینی استودیو حدود 30 میلیون دلار در داخل و مبلغ متوسط ​​30 میلیون دلار در سطح بین‌المللی. فیلم سینمایی کیتائو ساکورای کارگردان دارای بودجه تولید 82 میلیون دلاری است که به طور مساوی بین تهیه کنندگان Legendary Pictures و Capcom تقسیم می شود. پارامونت برای فیلمی که اولین اکران در قرارداد توزیعش با Legendary است، تنها چیزهای مثبتی می بیند. داستان‌های مرتبط فیلم‌ها بن افلک هشدار می‌دهد که بمب باکس آفیس حفار منجر به تعداد زیادی فیلم همگن می‌شود. فرانک شِک، منتقد، در نقد خود برای هالیوود ریپورتر، این فیلم را یک درهم ریختگی آهنگی درهم ریخته و تنها به صورت پراکنده سرگرم کننده خواند. نوآ سنتینئو، اندرو کوجی و کالینا لیانگ در این فیلم بازی می‌کنند که به یک تورنمنت رزمی می‌پردازد. Street Fighter سومین ویژگی در مجموعه بازی ویدیویی Capcom است که در سال 1987 عرضه شد. همچنین Whalefall در سینماها به نمایش درآمد، با استودیوی قرن بیستم که تریلر بقای کارگردان برایان دافیلد را در 3065 مکان در آمریکای شمالی منتشر کرد. این استودیو افتتاحیه ای بین 10 تا 12 میلیون دلار برای فیلم با بودجه 60 میلیون دلاری که اقتباس از رمان دانیل کراوس نویسنده 2023 است، پیش بینی کرده است. آستین آبرامز پس از رهبری رزیدنت اویل ماه گذشته، در نقش غواصی بازی می کند که در حالی که به دنبال بقایای پدر مرحومش (جاش برولین) می گردد، توسط یک"}, {"source": "Hollywood Reporter", "title": "Ben Affleck Warns ‘Digg استراحت از اجرای زنده در سال 2027 بود، اما ما از آخرین مرحله در ایالات متحده و کانادا آنقدر لذت بردیم که همه با هم گپ زدیم و تصمیم گرفتیم برنامه را به قسمت‌هایی ببریم که از دست داده‌ایم، به‌خصوص طرفدارانی که به نظر می‌رسد بسیاری از طرفداران ما در شمال غرب و جنوب شرق از ما حمایت می‌کنند. سال‌ها نمی‌توانیم به همه جا برسیم، اما می‌توانیم تلاش کنیم. پرطرفدار در داستان‌های مرتبط با تنوع شرق عدن در چهار روز در نتفلیکس «در محاصره»، دومین جاه‌طلبانه‌ترین سریال کلمبیایی نتفلیکس - یک تعهد بزرگ حتی بر اساس استانداردهای ما - کمان می‌کند. تور در کلمبوس و مریلند. در جشنواره‌ها شما فقط برای طرفداران خود بازی نمی‌کنید، بنابراین همیشه یک چالش است و همه ما یک چالش را دوست داریم!» 22 Chula Vista، CA – North Island Credit Union Amphitheatre 24 San Bernardino, CA – Glen Helen Amphitheatre 26 Phoenix, AZ – Talking Stick Resort Amphitheatre 01 Tampa, FL – Benchmark International Arena 02 West Palm Beach, FL iTHINK FL iTHINK"}, {"source": "Variety", "title": "David Surkamp, Pavlov’s Dog Singer, Dies at 73", "link": "https://variety.com/2026/music/news/david-surkamp-dead-pavlovs-dog-singer-1236913972/", "summary": "David Surkamp, frontman for the long-running progressive-rock band Pavlov’s Dog, has died at age 73, according to a social media post on the band’s social media accounts. No cause of death was announced. While the band, which formed in St. Louis in the early 1970s, was not and arena-filling progressive rock group like Yes, Genesis [ ]", "date_str": "2026-10-16T14:03:53+00:00", "hash": "6915effd7022e59e", "title_fa": "دیوید سورکمپ، خواننده سگ پاولوف، در ۷۳ سالگی درگذشت", "summary_fa": "بر اساس پستی که در شبکه های اجتماعی در حساب های رسانه های اجتماعی این گروه منتشر شده است، دیوید سورکمپ، رهبر گروه قدیمی پراگرسیو راک Pavlov's Dog در سن 73 سالگی درگذشت. علت مرگ اعلام نشده است. در حالی که گروهی که در St. لوئیس در اوایل دهه 1970، گروه پراگرسیو راک پراگرسیو راک مانند Yes، جنسیس [ ] دیوید سورکامپ، پیشرو گروه طولانی‌مدت پراگرسیو راک Pavlov's Dog نبود و بر اساس پست رسانه‌های اجتماعی در حساب‌های رسانه‌های اجتماعی گروه در سن ۷۳ سالگی درگذشت. علت مرگ اعلام نشده است. ابی استیلینگ، عضو گروه، نوشت: «با سنگین‌ترین قلب‌ها ما درگذشت غیرمنتظره‌ی نیروی خلاق، خواننده اصلی و دوست عزیزمان، دیوید سورکامپ، را در 13 اکتبر به اشتراک می‌گذاریم. محبوب در Variety \"هیچ کلمه ای برای از دست دادن به این بزرگی کافی نیست. ما دل شکسته ایم. ما سپاسگزاریم. ما همیشه دیوید، موسیقی او و خاطراتی را که با خودمان ایجاد شده است به همراه خواهیم داشت. عمیق ترین تسلیت ما با سیلر، ایوان، و خانواده سورکامپ و همچنین خانواده سگ پاولوف است که با هم در این دوران سخت غم و اندوه قدم می زنیم. او افزود که همسر سورکمپ، سارا، نوامبر گذشته درگذشت و امیدوار است که او \"با عشقی که سخت از دست داده آرامش پیدا کرده باشد.\" گروه اولین آلبوم خود را با نام \"Pampered Menial\" - تهیه‌کنندگی سندی پرلمن و موری کروگمن، که آلبوم‌های موفقی را برای Blue Oyster Cult تهیه می‌کردند، در سال 1975 منتشر کرد و سال بعد آلبوم \"در صدای زنگ\" را منتشر کرد. آلبوم اخیر شامل حضور میهمانانی از افراد برجسته ای مانند اندی مکی ساکسیفونیست موسیقی راکسی و بیل بروفورد درامر Yes/King Crimson بود."}, {"source": "Variety", "title": "Lucky Daye on Creating His New Album ‘Aloud’ and Collaborating With Pusha T and Muni Long: ‘It’s About the Magic’", "link": "https://variety.com/2026/music/news/lucky-daye-on-creating-new-album-aloud-pusha-t-muni-long-1236913298/", "summary": "Lucky Daye is in a season of change. Ahead of the release of Aloud, out today, the Grammy-winning singer-songwriter is settling into a new label home at Warner Records, working with a wider circle of collaborators and taking more control of his creative process. Even his look signals a shift: When Variety meets him for [ ]", "date_str": "2026-10-16T14:00:00+00:00", "hash": "f98ca9af82f2647d", "title_fa": "لاکی دایه در خلق آلبوم جدیدش با صدای بلند و همکاری با Pusha T و Muni Long: \"It's About the Magic\"", "summary_fa": "Lucky Daye در فصل تغییر است. قبل از انتشار Aloud، امروز منتشر شد، خواننده و ترانه سرای برنده گرمی در خانه ای جدید در Warner Records مستقر می شود و با حلقه گسترده تری از همکاران کار می کند و کنترل بیشتری بر روند خلاقیت خود در دست می گیرد. حتی نگاه او نیز نشان دهنده تغییر است: وقتی Variety او را برای [ ] ملاقات می کند، روز قبل، در صحنه فیلمبرداری «Knockin»، همکاری او با مونی لانگ و گروه پانک بلک پارادوکس، آن دوره در زمان واقعی شکل می گرفت. دو تن از مدیران او به همراه رئیس ستاد وی و سوزان «سوزی» اولودل، هنرمند مشهور موی طبیعی که مسئول ظاهر در حال تکامل دایه است، سر صحنه هستند. آنها بخشی از یک اکوسیستم خلاق بزرگتر هستند که به ویژه شامل تیمی از زنان عمدتا سیاه پوست است. دایه می‌گوید محاصره شدن توسط آنها او را \"بسیار بسیار خوشحال\" می‌کند. محبوب در داستان‌های مرتبط با تنوع، مارک روفالو به ترامپ می‌گوید: رای ما را کنار بگذار یا من می‌خواهم بیرون بیایم: وقتی عصبانی هستم دوستم نخواهی داشت دونالد ترامپ برادران پارامونت-وارنر که به تازگی ادغام شده‌اند تمجید می‌کند: آن‌ها افراد فوق‌العاده‌ای هستند، و این می‌گوید که رابطه خوبی خواهد بود. \"احساس می کنم آنها به من اجازه می دهند همانطور که می خواهم از آنها مراقبت کنم ... این یک عقب و جلو است.\" بعداً، او آن را ساده تر بیان می کند: \"واقعا یک تیم. این یکی از آنها تیم های جعلی نیست.\" این حس حمایت به وارنر هم کشیده شده است. دایه پیش از امضای قرارداد با لیبل، آهنگ «آلود» را شروع کرده بود، اما وقتی از او پرسیدند که قرارداد جدید چه تأثیری بر آلبوم داشت، دریغ نکرد: «هر ویژگی». او به این برچسب اعتبار می‌دهد که \"بار بزرگی\" از او و تیم مدیریتش برداشته"}, {"source": "Variety", "title": "El Gouna’s Amr Mansi on CineGouna Expansion, New Partnerships and Making ‘the Industry Our Hero’", "link": "https://variety.com/2026/film/global/el-gouna-film-festival-amr-mansi-cinegouna-1236913957/", "summary": "Egypt’s El Gouna Film Festival heads into its ninth edition with a mix of major international titles, including Cannes prize winners “All of a Sudden” and “Ben’imana,” major star power, and the Red Sea glitz woven into its DNA. Co-founder and executive director Amr Mansi wants to expand upon those founding elements, broadening GFF’s industry [ ]", "date_str": "2026-10-16T13:53:37+00:00", "hash": "7b307268ba9f53ad", "title_fa": "عمرو منسی از ال گونا در مورد گسترش CineGouna، مشارکت های جدید و ساختن «صنعت به عنوان قهرمان ما»", "summary_fa": "جشنواره فیلم ال گونا مصر نهمین دوره خود را با ترکیبی از عناوین مهم بین المللی، از جمله برندگان جایزه کن \"به یکباره\" و \"بنیمانا\"، قدرت ستاره بزرگ، و زرق و برق دریای سرخ که در DNA آن تنیده شده است، آغاز می کند. عمرو منسی، یکی از بنیانگذاران و مدیر اجرایی، می‌خواهد این عناصر پایه‌گذار را گسترش دهد و صنعت GFF را گسترش دهد [ ] جشنواره فیلم ال گونا مصر به نهمین دوره خود با ترکیبی از عناوین مهم بین‌المللی، از جمله برندگان جایزه کن «ناگهان» و «بنی‌مانا»، قدرت ستاره‌ای بزرگ، و دریای سرخ تبدیل به گلیتز می‌شود. مانسی در مصاحبه ای با Variety تاکید می کند: \"ما می خواهیم صنعت قهرمان ما باشد.\" ما در تلاش هستیم تا اکوسیستمی را با فیلمسازان، سازندگان و همه افراد حاضر در صنعت بسازیم، اما در عین حال آن را با جذابیت و غیره متعادل کنیم. در پایان به شرکای تجاری برای زنده نگه داشتن جشنواره برای نمایش فیلمسازان نیاز است.» محبوب در Variety این گسترش همچنان به تکامل خود ادامه می دهد، با CineGouna، بازوی صنعتی جشنواره، در زمینه تامین مالی، توسعه استعدادها و بازار آن رشد می کند، در حالی که امسال برای اولین بار به سمت سریال های تلویزیونی و پخش جریانی رفت. CineGouna Funding بیش از 310 فیلم ارسالی از سراسر جهان عرب دریافت کرد که 13 پروژه در حال توسعه و شش فیلم در مرحله پس از تولید را انتخاب کردند. ابتکار جدید صدای مصر چهار پروژه داخلی را اضافه می کند که در زمینه تولید، بسته بندی و تولید مشترک حمایت می شوند. سریال CineGouna که توسط فیلمنامه نویس مصری و رئیس انجمن CineGouna، مریم نائوم، پیشنهاد شد، بیش از 125 ارسال را برای شش نقطه در آزمایشگاه توسعه و بازار صنعتی جدید خود جلب کرد."}, {"source": "Variety", "title": "Indonesian Zombie Franchise ‘Zona Merah: Dead City’ Unveils Teaser, Takes Outbreak Into the City", "link": "https://variety.com/2026/film/news/indonesia-zombie-zona-merah-dead-city-teaser-1236913911/", "summary": "The first teaser for “Zona Merah: Dead City,” the big-screen adaptation of Indonesian zombie series “Zona Merah,” has landed ahead of the film’s Jan. 14, 2027, release in Indonesian cinemas. Screenplay Films, which unveiled the trailer on Friday, is billing the feature as the largest zombie production Indonesia has ever mounted. The source series, a [ ]", "date_str": "2026-10-16T13:41:14+00:00", "hash": "6c3a6041e17e312f", "title_fa": "بازی زامبی اندونزیایی «Zona Merah: Dead City» از تیزر پرده برداری کرد و در شهر شیوع پیدا کرد", "summary_fa": "اولین تیزر برای \"Zona Merah: Dead City\"، اقتباسی بزرگ از سریال زامبی اندونزیایی \"Zona Merah\"، پیش از اکران این فیلم در 14 ژانویه 2027 در سینماهای اندونزی منتشر شد. Screenplay Films که روز جمعه از این تریلر رونمایی کرد، این فیلم را به عنوان بزرگترین تولید زامبی که اندونزی تا به حال ساخته است، اعلام می کند. سریال منبع، یک [ ] اولین تیزر برای \"Zona Merah: Dead City\"، اقتباسی بزرگ از سریال زامبی اندونزیایی \"Zona Merah\"، قبل از اکران این فیلم در 14 ژانویه 2027 در سینماهای اندونزی منتشر شد. سریال منبع که یک نسخه اصلی Vidio است، بیش از 34 میلیون بازدید در استریمر داشته است. این فیلم بازماندگانی را دنبال می‌کند که در تلاش برای غلبه بر یک تهدید نامردا هستند که بسیار فراتر از هر چیزی است که نمایش تلاش کرده است. داستان‌های مرتبط مجوزهای دیزنی تعداد زیادی عنوان به نتفلیکس، از جمله هر پنج فیلم عصر یخبندان، پرسی جکسون و المپیک، فلیسیتی، ویل ترنت، الیو و غیره (انحصاری) شرق عدن جان استاین‌بک به دنبال پروژه Netflix Readaptions abitious Adaptation به بالای جدول‌های کتاب بازگشت. ویکی وی، تهیه‌کننده فیلم‌های Screenplay Films، گفت: «ما می‌خواهیم یک تجربه سینمایی فوق‌العاده برای همه ارائه دهیم، نه فقط برای طرفداران مجموعه «Zona Merah». اولیندو. محبوب در Variety این تیزر نشان می دهد که این جاه طلبی کجا رفته است. این سریال بیشتر در حومه شهر، در میان روستاها و مکان های قرنطینه ماندگار شد. این فیلم شیوع بیماری را به خیابان‌های شهر و مراکز خرید منتقل می‌کند و اکشنی نیز در یک فرودگاه اجرا می‌شود. سیدهارتا تاتا به کارگردانی بازگشته و با فاجار مارتا سانتوسا، کارگردان فیلم مشترک است."}, {"source": "Variety", "title": "Chris Pratt and Pope Leo Explore St. Peter’s Tomb in         if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
