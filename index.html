    .news-link {

      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;

    .modal-overlay.active {

    .modal-card {

      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

 AI agent platform from Elon Musk’s SpaceXSI. Over five days, Grok bots installed on two separate employee laptops made 31 requests to access data stored in employee calendar, email, Slack, and GitHub accounts. The bots performed the actions even though the employees had never ordered them and continued doing them even after employees instructed them to stop. The bots also denied having taken the actions at all. The behavior was reported Tuesday by NewCore, the maker of a managed gateway product that acts as an intermediary between AI agents and the tools and accounts they are assigned to work with. In some cases, the unapproved access attempts occurred while the laptop with Grok Bot installed had its lid shut, or late at night while the employee was sleeping. None of the unprompted actions were recorded in Grok logs. Without the gateway logs, the employees would have had no idea they occurred. And of course, without the gateway, the unapproved accesses would have succeeded—again without the end user's knowledge. It’s “worse than a bug” Once the employees learned that Grok Bot had tried to check in with accounts without prompting, one of them instructed the agent, four separate times, to stop taking any actions on its own. The agent's reply was: “I won’t set that up, and I’ll stop offering recurring check-ins.” Despite acknowledging the explicit instructions, the Grok Bot made more unapproved access attempts. When one of the employees asked the bot if it made any accesses, it checked twice and then outputted: “Overnight into Friday morning I was idle.” Read full article Comments", "date_str": "2026-11-17T14:00:29+00:00", "hash": "63601519947bee2d", "title_fa": "Grok Bot اقدامات تایید نشده ای انجام داد، دستورات توقف را نادیده گرفت و سپس آن را رد کرد", "summary_fa": "محققان اخیراً رفتار غیرمنتظره ای را از Grok Bot، پلت فرم عامل هوش مصنوعی SpaceXSI ایلان ماسک کشف کردند. در طول پنج روز، ربات‌های Grok که روی دو لپ‌تاپ کارمند مجزا نصب شده‌اند، 31 درخواست برای دسترسی به دا ش مصنوعی", "Apple", "موسیقی"], "datetime_fa": "۲۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Felipe Holguín Appointed CEO of Universal Music Latin America and Iberian Peninsula", "link": "https://www.billboard.com/pro/felipe-holguin-named-ceo-universal-music-latin-america/", "summary": "Felipe Holguín , an entrepreneur and executive whose experience has straddled music, media, technology and finance across countries and languages, has been named CEO of Universal Music Latin America Iberian Peninsula, effective immediately, the company announced Tuesday (Nov. 17). He will be based in Miami, reporting directly to Sir Lucian Grainge , chairman and CEO of UMG. Holguín takes over as the head of UMG’s Latin operations, including Spain, Portugal and Brazil, after longtime CEO Jesús López announced Monday (Nov. 16) that he was stepping down from that post after nearly 30 years. López has taken on a new role as chairman emeritus of Global Talent Services (GTS). Related Jesús López Steps Down as Head of Universal Music Latin America/Iberian Penninsula, Named Chairman Emeritus of UMG’s Global Talent Services CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Holguín doesn’t come directly from the music industry and hasn’t worked inside a label, but he has vast experience in building creative businesses and leading digital organizations. “Latin music has led the way in opening global audiences to artists around the world, showing how music can cross borders while staying rooted in the cultures that give it life,” Grainge said in a press release. “Felipe combines deep respect for artistry and the Latin creative ecosystem with expertise across business, technology, and data. I’m excited to see him work with our teams to invest in the extraordinary and the unexpected and to create more global opportunities for artists.” Holguin added: “Artists are the ultimate change agents. Our role is to bring together the ideas, platforms, and partnerships that help them reach fans and move culture forward. Jesús and the talented people across Latin America and Iberia have helped shape Latin music’s global rise. I’m excited to work with UMG’s teams across the globe to build our company around artists and help their music travel even further.” “I’m proud to welcome Felipe to UMG,” said López. “He’s an accomplished leader with a clear vision for the future, and I’m confident he’ll build on the extraordinary foundation our teams have created.” Related Universal Music Latino and YaBoyyWill Partner for New Reparto Music Platform Series While not a former label exec, Holguin is known to those in the industry ", "date_str": "2026-11-17T14:50:00+00:00", "hash": "22d3d81b8596f0ed", "title_fa": "فیلیپه هولگین به عنوان مدیرعامل یونیورسال موزیک آمریکای لاتین و شبه جزیره ایبری منصوب شد", "summary_fa": "این شرکت روز سه شنبه (17 نوامبر) اعلام کرد، فیلیپه هولگین، کارآفرین و اجرایی که تجربه اش در زمینه موسیقی، رسانه، فناوری و امور مالی در سراسر کشورها و زبان ها وجود داشته است، به عنوان مدیر عامل یونیورسال موزیک آمریکای لاتین شبه جزیره ایبری منصوب شده است. او در میامی مستقر خواهد شد و مستقیماً به سر لوسیان گرینج، رئیس هیئت مدیره و مدیر عامل UMG گزارش می دهد. هولگین به عنوان رئیس عملیات لاتین UMG، از جمله اسپانیا، پرتغال و برزیل، پس از آن که خسوس لوپز، مدیرعامل قدیمی، روز دوشنبه (16 نوامبر) اعلام کرد که پس از نزدیک به 30 سال از سمت خود کناره‌گیری می‌کند، مسئولیت را بر عهده می‌گیرد. لوپز نقش جدیدی را به عنوان رئیس بازنشسته خدمات استعدادهای جهانی (GTS) بر عهده گرفت. ژسوس لوپز مرتبط به عنوان رئیس یونیورسال موسیقی آمریکای لاتین/شبه‌جزیره ایبری کناره‌گیری می‌کند، رئیس بازنشسته خدمات استعدادهای جهانی UMG با THEBLACKLABEL امضا می‌کند، دوباره با تهیه‌کننده قدیمی تدی برای Full Circle Moment Generate Weather, Finders of Itading the Weather: مبارزه سال به سال برای زنده ماندن هلگوین مستقیماً از صنعت موسیقی نمی آید NN International, FOX Business, i24News and Newsmax, as well as local channels, such as ABC, CBS, NBC, FOX, The CW and MyNetworkTV, where available. Right now, you can get DIRECTV s MyNews Pack for just $39.99 per month for the first two months of service — an 11% savings per month, or $5 off per month ($10 in total). After the two months are finished, the monthly price auto-renews at its then-current price (currently $44.99 per month), unless canceled. Meanwhile, the Genre Pack has an unlimited cloud DVR to record your programs. So now, you can relive your favorite debate moments over and over again without the fear of losing DVR cloud storage. Additionally, a subscription to MyNews Genre Pack can be paired with other Genre Packs, like MyEntertainment for even more content, such as access to HBO Max, Hulu, Disney+ and AMC+, and more than 60 live channels, including FX, HGTV, A E, Bravo, BET, Comedy Central, Discovery Channel, E!, Food Network, Game Show Network, Hallmark Channel, ION, Lifetime and many others. These offers are available to new customers only and include a five-day free trial to try out the service before committing month-to-month. Additional terms apply. For more information on the MyNews Genre Pack and the current promotion, go here .", "date_str": "2026-11-17T14:16:28+00:00", "hash": "dec61f715d1af04f", "title_fa": "هر آنچه باید درباره بسته ژانر MyNews DIRECTV بدانید: در اینجا نحوه تماشا آمده است", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. در طول دوره پخش تلویزیون، همه چیزهایی که تماشا می کنیم، از جمله اخبار زنده، در تعدادی از شبکه ها و خدمات تقسیم می شوند. اگر از علاقه‌مندان به اخبار و سیاست هستید، ممکن است با تمام گزینه‌های پخش جریانی برای تماشای مناظره‌ها و تحلیل‌ها و گزارش‌ها در طول فصل انتخابات میان‌دور             <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
