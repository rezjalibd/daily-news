 IQ و HDR10+ به این معنی است که طیف گسترده ای از فیلم ها، نمایش ها و سرویس های پخش را تحت پوشش قرار می دهید. Toshiba Z670R 55 اینچی 548.99 دلار در آمازون 649.99 دلار صرفه جویی 101.00 دلار دریافت معامله دریافت تخفیف 548.99 دلار در آمازون 649.99 دلار صرفه جویی 101 دلاری بازی یکی دیگر از مواردی است که این تلویزیون برای خود قاب محکمی ایجاد می کند و پنل آن می تواند تا حداکثر 144Hz کار کند. AMD FreeSync Premium برای نرم‌تر جلوه دادن حرکت سریع و کاهش پارگی صفحه با یک کنسول سازگار یا رایانه شخصی بازی وجود دارد و آن را برای بازی‌های مسابقه‌ای، شوترها و عناوین ورزشی مناسب می‌کند. شما همچنین دارای چهار ورودی"}, {"source": "Lifehacker", "title": "Over 150 Million Driver's Licenses Have Been Leaked", "link": "https://lifehacker.com/tech/over-150-million-drivers-license-leaked?utm_medium=RSS", "summary": "If you have a driver's license in the U.S or Canada, there's a pretty good chance that your data was recently for sale on the dark web. A massive hack at ID verification company IDScan.net compromised records for more than 150 million drivers, resulting in scans of licenses being made available to bad actors. IDScan.net is a Louisiana-based company that provides identity and age verification services for industries ranging from casinos and cannabis dispensaries to hotels and car rentals. What happened with the IDScan.net breach? According to an incident notice on IDScan's website, the company received information \"on or around\" Sept. 1 that an unauthorized third party was able to gain access to stored customer data, including full names along with driver's license and government-issued ID numbers. This was around the time that a major breach was reported by cybersecurity journalist Brian Krebs, who received a tip that driver's license information including digital scans was available for sale on the dark web via an identity theft service dubbed Nexus. The platform advertised access to more than 153 million driver's licenses, and Krebs and security researcher Zach Edwards verified the data and identified IDScan as the likely source. As TechCrunch reports , the FBI is investigating the breach, and the database has since been taken offline. What to do if your drivers license has been compromised A lost or stolen driver's license creates a high risk of identity theft and fraud, as hackers can use it to open financial accounts and take out loans in your name, commit mail fraud, create a fake ID, and even develop a synthetic identity (which combines both real and fake personal data) that could be used to commit a crime. If thieves have access to your physical license or a scan, as in this latest breach, they have a complete set of information, including your birth date and photo, to assume your identity. Fraudsters can also do a lot of damage with just your driver's license number. If your driver's license information has been compromised in a breach, you should take all the usual steps against identity theft , including pulling your credit reports, monitoring your financial accounts, and setting up fraud alerts. (At this point in the data breach game, your credit should already be frozen unless you are actively applying for a new card or loan, but if you haven't yet, do it immediately.) Because your driver's license is so valuable to identity thieves, Experian ", "date_str": "2026-09-11T12:30:00+00:00", "hash": "560686765b4d9e9c", "title_fa": "بیش از 150 میلیون گواهینامه رانندگی فاش شده است", "summary_fa": "اگر گواهینامه رانندگی در ایالات متحده یا کانادا دارید، احتمال زیادی وجود دارد که داده های شما اخیراً در وب تاریک به فروش رسیده باشد. یک هک گسترده در شرکت تأیید هویت IDScan.net، سوابق بیش از 150 میلیون راننده را به خطر انداخت و در نتیجه اسکن مجوزها در اختیار بازیگران بد قرار گرفت. IDScan.net یک شرکت مستقر در لوئیزیانا است که خدمات تأیید هویت و سن را برای صنایع مختلف از کازینو و داروخانه‌های شاهدانه گرفته تا هتل‌ها و اجاره خودرو ارائه می‌دهد. با رخنه IDScan.net چه اتفاقی افتاد؟ بر اساس یک اطلاعیه حادثه در وب‌سایت IDScan، این شرکت اطلاعاتی را «در یا حوالی» 1 سپتامبر دریافت کرد مبنی بر اینکه یک شخص ثالث غیرمجاز توانسته است به داده‌های ذخیره‌شده مشتری، از جمله نام کامل همراه با گواهینامه رانندگی و شماره‌های شناسایی صادر شده توسط دولت دسترسی پیدا کند. این در همان زمان بود که یک نقض بزرگ توسط روزنامه‌نگار امنیت سایبری برایان کربس گزارش شد، او یک نکته دریافت کرد که اطلاعات گواهینامه رانندگی شامل اسکن‌های دیجیتالی برای فروش در وب تاریک از طریق یک سرویس سرقت هویت به نام Nexus در دسترس است. این پلتفرم دسترسی به بیش از 153 میلیون گواهینامه رانندگی را تبلیغ کرد و کربس و محقق امنیتی زک ادواردز داده ها را تأیید کردند و IDScan را به عنوان منبع احتمالی شناسایی کردند. همانطور که TechCrunch گزارش می دهد، FBI در حال بررسی این نقض است و پایگاه داده از آن زمان آفلاین شده است. اگر گواهینامه رانندگی شما به خطر بیفتد، چه کاری باید انجام دهید مفقود شدن یا دزدیده شدن گواهینامه رانندگی خطر بالای سرقت هویت و کلاهبرداری را ایجاد می کند، زیرا هکرها می توانند از آن برای باز کردن حساب های مالی و گرفتن وام به نام شما، مرتکب کلاهبرداری از طریق نامه، ایجاد یک شناسه جعلی و حتی"}, {"source": "Lifehacker", "title": "10 Hacks Every Libby User Should Know", "link": "https://lifehacker.com/tech/10-hacks-every-libby-user-should-know?utm_medium=RSS", "summary": "Libby is a service that connects users to their local library systems, giving them access to an enormous catalog of digital content, including e-books, audiobooks, and magazines for free. If you're a reader (or listener), you'll want to take advantage of these Libby tips and tricks for borrowing, organizing, and maximizing your loans. Add multiple library cards to see availability across other systems You're not limited to one library system on Libby. The platform allows you to connect to multiple libraries, so you can take advantage of larger catalogs in case one library has more titles or a shorter wait times for books you want to read. You still have to be eligible for a library card at every library you connect to, but you could add your city library, your county library, and a school library to your account (or even take advantage of a friend's or family member's card from a different city). Go to Menu Add Library and search by library name, city, or zip code. Select the library to browse its collection, and follow the prompts to add that library's card if you qualify. Use airplane mode on your Kindle to extend your loan Libby automatically returns titles as soon as your loans expire, so unlike with physical books, you can't take extra time to finish up. But if you're reading on a Kindle, you may be able to borrow the title and immediately set your device to airplane mode to freeze the loan. While your Kindle is offline, you can return the title via the Libby app so the next person can borrow it. Note that there are reports that this workaround, which is unique to Kindle, may no longer be available on newer devices running the latest software, but Reddit users suggest that changing the date on your Kindle to before the return deadline and/or keeping the expired book open could also help avoid this issue. Export your reading data to archive or add it to Goodreads If you like to track your reading history, you can export a timeline of your activity, which can be saved in a personal spreadsheet or uploaded to Goodreads. Tap Shelf Timeline Actions Export Timeline and choose a format Table creates a shareable HTML page, while Spreadsheet downloads an editable sheet to your device (JSON is also an option). Exports include information like the title name, author, borrow date, publisher, and ISBN. If syncing to Goodreads, choose Spreadsheet and follow the platform's import instructions . Create custom tags to organize your reading lists Libby's tag system mak", "date_str": "2026-09-10T21:00:00+00:00", "hash": "ec8dd3079229e2ec", "title_fa": "10 هک که هر کاربر لیبی باید بداند", "summary_fa": "Libby سرویسی است که کاربران را به سیستم های کتابخانه محلی خود متصل می کند و به آنها امکان دسترسی رایگان به فهرست عظیمی از محتوای دیجیتال، از جمله کتاب های الکترونیکی، کتاب های صوتی و مجلات را می دهد. اگر خواننده (یا شنونده) هستید، باید از این نکات و ترفندهای لیبی برای وام گرفتن، سازماندهی و به حداکثر رساندن وام خود استفاده کنید. چند کارت کتابخانه اضافه کنید تا در دسترس بودن در سایر سیستم ها را مشاهده کنید شما به یک سیستم کتابخانه در Libby محدود نمی شوید. این پلتفرم به شما امکان می‌دهد به چندین کتابخانه متصل شوید، بنابراین در صورتی که یک کتابخانه عناوین بیشتری داشته باشد یا زمان انتظار کوتاه‌تری برای کتاب‌هایی که می‌خواهید بخوانید، می‌توانید از فهرست‌های بزرگ‌تر استفاده کنید. شما همچنان باید در هر کتابخانه ای که به آن متصل می شوید واجد شرایط دریافت کارت کتابخانه باشید، اما می توانید کتابخانه شهر، کتابخانه شهرستان خود و کتابخانه مدرسه را به حساب خود اضافه کنید (یا حتی از کارت یکی از دوستان یا اعضای خانواده از شهر دیگری استفاده کنید). به منوی افزودن کتابخانه بروید و بر اساس نام کتابخانه، شهر یا کد پستی جستجو کنید. کتابخانه را برای مرور مجموعه آن انتخاب کنید، و اگر واجد شرایط هستید، برای افزودن کارت آن کتابخانه، از دستورات پیروی کنید. برای تمدید وام خود از حالت هواپیما در کیندل خود استفاده کنید. اما اگر در Kindle در حال مطالعه هستید، ممکن است بتوانید عنوان را قرض بگیرید و بلافاصله دستگاه خود را در حالت هواپیما قرار دهید تا وام را مسدود کنید. وقتی Kindle شما آفلاین است، می توانید عنوان را از طریق برنامه Libby برگردانید تا نفر بعدی بتواند آن را قرض بگیرد. توجه داشته باشید که گزارش‌هایی وجود دارد مبنی بر اینکه این راه‌حل، که مختص Kindle است، ممکن است دیگر در دستگاه‌های"}, {"source": "Lifehacker", "title": "The Best Sales on Headphones and Earbuds Right Now", "link": "https://lifehacker.com/best-deals-on-earbuds-and-headphones-right-now?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Finding a pair of headphones or earbuds that precisely meet your needs whether you re using them at the gym, while working from home, or even when showering doesn t have to mean shelling out a ton of money. The best of them can be really expensive
