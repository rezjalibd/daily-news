گنجینه های دیگری را در قفسه ها مشاهده می کنند. این فروشگاه معمولی شما نیست و اینها خریداران معمولی شما نیستند. ساخته شده از استودیوی خلاق برند نتفلیکس، مینی اپیزود و موارد دیگر در کانال اینستاگرام KShopDemonHunters منتشر خواهد شد. کالای ارزشمند KShop شما در فروشگاه‌های آنلاین Kayou، Mattel، Hasbro، Vans و LEGO منتظر می‌ماند. جفت شدن Megan Thee Stallion با KPop Demon Hunters باید یک ترکیب برنده باشد. مگان یک ستاره در بازی خود با سه نفر شماره 1 در بیلبورد هات 100 و مجموع 45 آهنگ در جدول تک آهنگ است. مجموعه افتخارات او شامل چهار جایزه موسیقی آمریکا، چهار جایزه موسیقی ویدئوی MTV، سه جایزه گرمی، یک جایزه زنان بیلبورد در موسیقی، و در سال 2019، جایزه پاورهاوس در مراسم بیلبورد زنان در موسیقی 2019 است. Houston Hottie قبل از آلبوم Act III خود داغ شده است. او سه سبک آزاد تینا سه‌شنبه را حذف کرده است، از جمله «یخ نازک» برجسته، که در دومین هفته‌اش", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/megan-thee-stallion-1800-2026-netflix-kshop.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۴ آذر • ۲۰:۰۰"}, {"source": "Billboard", "title": "Horacio Palencia Celebrates Historic Billboard Chart Achievements: ‘I Like Making Music That Transcends’", "link": "https://www.billboard.com/music/latin/horacio-palencia-historic-chart-achievements-interview-1236389484/", "summary": "Nearly 20 years ago, Horacio Palencia reached the top of Billboard s Regional Mexican Airplay chart as a songwriter for the first time. Today, the acclaimed Mexican musician has amassed 45 No. 1s on that chart, the most recent being Pa Él by Los Ángeles Azules and Tini, which topped the ranking dated Nov. 14. Palencia s charts journey began on June 16, 2007, with De Ti Exclusivo by La Arrolladora Banda El Limón de René Camacho, which marked the beginning of a golden era for the Sinaloan band and gave a significant boost to the regional Mexican genre. Palencia went on to pen hits for La Arrolladora and other groups, including Banda El Recodo de Cruz Lizárraga ( Me Gusta Todo de Ti ), Banda MS (“Hermosa Experiencia,” “No Me Pidas Perdón”), La Adictiva ( Nada Iguales, El Amor de Mi Vida ) and others. At 44, Palencia — born in El Rosario, a small town near Mazatlán, Sinaloa — boasts one of the most significant repertoires in the regional Mexican genre, with accolades including six Latin Grammy nominations, multiple BMI Latin Awards for songwriter of the year, the 2024 BMI Presidential Award and numerous Billboard Latin Music Awards. I like making music that transcends, that lasts for many years and that people continue to sing for generations, he tells Billboard Español from his studio in Mazatlán, which opened its doors on Nov. 16 the same day his name was added to the Walk of Stars in the Mexican city. Palencia s career has evolved alongside the music industry over two decades. With more than 3,000 songs written, the singer-songwriter s work has also been performed by major artists such as Christian Nodal, Grupo Firme, Calibre 50, Fuerza Regida and, more recently, Ricardo Montaner. (The latter reached the top of Regional Mexican Airplay for the first time in September with Para Que Seas Feliz, co-written by Palencia). About those experiences and others to come, he talks to Billboard . Did you ever think your songs would change the direction of a music genre? There s always the hope of doing great things. Since the beginning of my career, I ve aimed to create songs that endure over time, and fortunately, that s been the case. I m from the old school of regional Mexican music, the traditional style, and for me, it s a blessing to have been part of the boom of banda music from Sinaloa when albums started selling millions of copies. You ve reached No. 1 on the Regional Mexican Airplay chart 45 times with your songs. Was this your expectation as a songwriter? Whe", "date_str": "2026-11-25T16:29:33+00:00", "hash": "9e7b8adc50ae1173", "title_fa": "هوراسیو پالنسیا دستاوردهای نمودار بیلبورد تاریخی را جشن می گیرد: \"من دوست دارم موسیقی فراتر از آن بسازم\"", "summary_fa": "نزدیک به 20 سال پیش، هوراسیو پالنسیا به عنوان آهنگساز برای اولین بار به صدر جدول پخش منطقه ای مکزیکی بیلبورد رسید. امروز، این نوازنده تحسین شده مکزیکی 45 رتبه اول را در آن چارت به دست آورده است که جدیدترین آنها Pa Él توسط Los Ángeles Azules و Tini است که در رده بندی تاریخ 14 نوامبر در صدر قرار گرفت. سفر Palencia در نمودار در 16 ژوئن 2007 با De Ti Exclusivo توسط La Arrolladora Banda El Limón de René Camacho آغاز شد که آغاز یک دوره طلایی برای گروه Sinaloan بود و رونق قابل توجهی به ژانر منطقه ای مکزیکی داد. پالنسیا برای La Arrolladora و سایر گروه‌ها، از جمله Banda El Recodo de Cruz Lizárraga (Me Gusta Todo de Ti)، Banda MS (\"Hermosaexperience\"، \"No Me Pidas Perdón\")، La Adictiva (Nothing Iguales، El Amor de Mi Vida) و دیگران، آهنگ‌های آهنگسازی کرد. پالنسیا در 44 سالگی - متولد ال روزاریو، شهر کوچکی در نزدیکی مازاتلان، سینالوآ - یکی از مهم‌ترین رپرتوارها در ژانر منطقه‌ای مکزیک را به خود اختصاص داده است که شامل شش نامزدی لاتین گرمی، چندین جوایز لاتین BMI برای ترانه‌سرا سال، جوایز متعدد ریاست جمهوری BMI در سال 2024، جایزه لاتین موسیقی هیئت مدیره بی‌ام‌آل است. او از استودیوی خود در Mazatlán به Billboard Español می گوید که در 16 نوامبر در همان روزی که نامش به Walk of Stars در شهر مکزیک اضافه شد، به بیلبورد اسپانیایی می گوید که من موسیقی فراتر از آن را دوست دارم که سال ها طول بکشد و مردم به آواز خواندن نسل ها ادامه دهند. حرفه Palencia در طول دو دهه در کنار صنعت موسیقی تکامل یافته است. با بیش از 3000 آهنگ نوشته شده، آثار این خواننده و ترانه سرا توسط هنرمندان بزرگی مانند کریستین نودال، گروپو فیرم، کالیبر 50، فوئرزا رگیدا و اخیراً ریکاردو", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Horacio-Palencia-cr-Eder-Leos-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آذر • ۱۹:۵۹"}, {"source": "Billboard", "title": "Will Smith Surprises Former ‘Fresh Prince’ Co-Star With ‘DWTS’ Season 35 Finale Cameo: I Am In Awe. I Am Inspired’", "link": "https://www.billboard.com/culture/tv-film/will-smith-surprises-tatyana-ali-dwts-season-35-finale-video-1236389432/", "summary": "Will Smith had nothing but superlatives for his former The Fresh Prince of Bel-Air co-star Tatyana Ali on Tuesday night s (Nov. 24) season 35 finale of Dancing With the Stars . Ali and her professional dance partner, Jan Ravnik, performed three times, earning high marks for their salsa to Hugel Solto s Jamaican (Bam Bam), jive to Wilson Pickett s Land of 1000 Dances and freestyle to Cab Calloway s Minnie the Moocher and Judy Garland s Over the Rainbow. Related AEW Dynamite Collision Thanksgiving Eve Livestream: Where to Watch the Wrestling Event Online Free Colman Domingo Reveals He Will Smith Went to High School Together: He Was the Cool Kid I Was the Nerd These K-Beauty Products Loved by K-Pop Stars Are Up to 43% Off During Black Friday Sales I am amazed , a smiling Smith told Ali in a surprise video that aired before the season s winner was revealed. I am in awe, I am inspired. Keep doing what you re doing. I love you, he added as he blew a kiss to the camera. Ali and Ravnik ended up in fourth place at the end of the night, with Paralympic athlete Ezra Frech and his professional partner Daniella Karagach taking home the mirror ball trophy. After the crowning, Ali and Ravnik spoke to ABC 30 and the professional dancer said he was still blown away by the A-list support the pair got. Elmo? I mean, Will Smith, yes, but Elmo? Ravnik joked after the fuzzy star dropped in to say hello earlier in the episode to his old friend Ali and let the pair know all his friends on Sesame Street were pulling for them. Ali said she was totally taken aback by the shout-outs from Smith, Elmo and the Black Eyed Peas will.i.am. I was surprised by all of them. Did you know? Ali asked Ravnik, who said he got emotional when he saw Ali s family reacting to their performances. Tonight was magical, Ali said. From the first performance all the way through to [the last one] tonight was 1/steve-coogan-trip-to-the-northern-lights-ifc-1237233265/", "summary": "EXCLUSIVE: Independent Film Company (IFC) and Sapan Studio have taken U.S. rights to The Trip to the Northern Lights, the fifth installment in Michael Winterbottom s Steve Coogan and Rob Brydon The Trip franchise. An April 9, 2027 theatrical release has been set. IFC has been the home of the previous four chapters in The Trip [ ]", "date_str": "2026-11-25T16:00:00+00:00", "hash": "c4bb973983fb2422", "title_fa": "«سفر به شفق‌های شمالی»: IFC آخرین‌های مایکل وینترباتم، استیو کوگان و راب برایدون را به دست می‌آورد", "summary_fa": "انحصاری: شرکت فیلم مستقل (IFC) و استودیو ساپان حقوق ایالات متحده را برای The Trip to the Northern Lights، پنجمین قسمت از فرنچایز استیو کوگان به کارگردانی مایکل وینترباتم و راب برایدون، در اختیار گرفتند. برای اکران در 9 آوریل 2027 تنظیم شده است. IFC خانه چهار فصل قبلی در The Trip بوده است [ ] بیش از پنج سال از فرارهای یونانی آنها می گذرد، کوگان نامزد 2 بار جایزه اسکار و راب برایدون نامزد 5 بار جایزه بفتا برای گشت و گذار در زیبایی ناهموار شمال اروپا دوباره متحد شدند. آنچه در ادامه می‌آید، سفری در اسکاندیناوی در جستجوی غذای خوب، گفت‌وگوی عصبانی و نگاهی اجمالی به شفق‌های شمالی گریزان است. این دو در وحشی‌ترین مناطق اروپای شمالی، از هتل‌های مجسمه‌سازی سوئدی گرفته تا جزایر دورافتاده نروژ، در سفرنامه‌ها و محاسبه‌های میانسالی، غرق می‌شوند. اخبار مرتبط: کالین فارل، استیو کوگان، چارلی هیتون، دامنال گلیسون، هیمش پاتل، نیام الگار سیمون کربی به ریچ پپیات با حمایت نتفلیکس اخبار Bad Bridgets اخبار استیو کوگان در مورد اینکه چرا مایک وایت او را در نیلوفر سفید هلنا پارتیچ ریچ ریچ پپیات بازی می کند: Winterbottom برنده بافتا گفت: ما بسیار خوشحالیم که با IFC به جاده بازگشتیم. آنها از اولین سفر در تمام آن سال ها پیش، شرکای درخشانی بوده اند. سفر به شفق شمالی استیو و راب را از مالمو در جنوب سوئد از طریق آبدره های تماشایی نروژ به جزایر لوفوتن در دایره قطب شمال نروژ می برد. امیدوارم مخاطبان هم مانند ما از این سفر لذت ببرند. در ددلاین تماشا کنید شرکت فیلم مستقل از ادامه رابطه دیرینه خود با این گروه ف  برای اظهار نظر تماس گرفته است. هدف صرفه جویی 51 میلیون پوندی BBC News کمکی به هدف کلی پخش کننده برای صرفه جویی 500 میلیون پوندی در سال های آینده است. بی‌بی‌سی حدود 200 میلیون پوند از این پس‌انداز را پرده‌برداری کرده است، که به دلیل خونریزی بیش از دو میلیون نفر از پرداخت‌کنندگان هزینه مجوز از سال 2020، مورد نیاز است. هنگامی که NUJ رای گیری ماه گذشته را اعلام کرد، بی بی سی گفت که این یک \"تحول ناامید کننده\" بود. رودری تالفان دیویس، معاون مدیر کل بی‌بی‌سی، گفت: در ماه‌های اخیر، بحث‌های سازنده و گسترده‌ای با NUJ داشته‌ایم و واضح بوده‌ایم که هر کاری ممکن است برای به حداقل رساندن اخراج‌های اجباری انجام خواهیم داد.", "image_url": "https://deadline.com/wp-content/uploads/2025/06/bbc-news-at-six-in-studio-d-202408-001-01.webp?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۹:۲۲"}, {"source": "Variety", "title": "Peacock Is $2.99 a Month With This Black Friday Deal", "link": "https://variety.com/2026/shopping/news/peacock-black-friday-deal-sign-up-online-1236958024/", "summary": "After sitting out Black Friday last year, Peacock is back with a deal that brings down the price of a subscription to $2.99 a month. From now through Cyber Monday, Nov. 30, new and eligible returning subscribers can sign up for Peacock Select for $2.99 a month for three months (normally $8.99 a month) or [ ]", "date_str": "2026-11-25T15:59:28+00:00", "hash": "a78e8f70af1e3e31", "title_fa": "با این معامله جمعه سیاه، Peacock 2.99 دلار در ماه است", "summary_fa": "اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. پس از نشستن در جمعه سیاه سال گذشته، Peacock با معامله ای بازگشت که قیمت اشتراک را به 2.99 دلار در ماه کاهش داد. این قرارداد درست به موقع برای برنامه‌های تعطیلات فشرده در استریمر متعلق به NBCUniversal که میزبان صدمین رژه سالانه روز شکرگزاری میسی، نمایش سگ‌های ملی و مسابقه شبانه روز شکرگزاری کانزاس سیتی و بوفالو بیل خواهد بود، می‌رسد. انتخاب، گزینه اشت colate-Filled Creation Is Inspired by 24 Luxury Destinations", "link": "https://variety.com/2026/shopping/news/laila-gohar-luxury-advent-calendar-chocolate-travel-1236957983/", "summary": "Egyptian artist Laila Gohar is putting her characteristically whimsical spin on a holiday tradition this year, teaming up with The Luxury Collection on a limited-edition advent calendar that takes its design and culinary cues from 24 destinations around the world. The $218 calendar, available through The Luxury Collection Boutique in the U.S. and Gohar World [ ]", "date_str": "2026-11-25T15:14:15+00:00", "hash": "5ad58dcb7e2e44a8", "title_fa": "تقویم ظهور نهایی برای جت ستترها: خلاقیت هنرمند لیلا گوهر پر از شکلات از 24 مقصد لوکس الهام گرفته شده است.", "summary_fa": "هنرمند مصری لیلا گوهر امسال با مجموعه The Luxury در یک تقویم ظهور محدود که طراحی و اشارات آشپزی خود را از 24 مقصد در سراسر جهان گرفته است، یک سنت تعطیلات را انجام می دهد. تقویم 218 دلاری که از طریق The Luxury Collection Boutique در ایالات متحده موجود است. و گوهر ورلد [ ] اگر از طریق پیوندی در وب سایت ما یک محصول یا خدمات بررسی شده مستقل خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. رافائل پریتو، بنیانگذار کاسا بوسکس، با تیم های آشپزی در مجموعه The Luxury Collection همکاری کرد تا 24 طعم متمایز را توسعه دهد که شامل زعفران الهام گرفته از دبی، کنجد سیاه از کیوتو، نارگیل برشته شده توسط South Caicos و موز و نمک دریا توسط Waikiki است. مقصدهای دیگر با پرالین فندق (پاریس) و کهور دودی (Los Cabos) هستند. گوهر در بیانیه ای گفت: \"من عاشق پیش بینی افتتاح تقویم ظهور، به خصوص در تعطیلات هستم.\" هر کشو برای خودش دنیای کوچکی است که الهام گرفته از طعم‌ها، سنت‌ها و جزئیاتی است که مقصدها را در این زمان از سال بسیار خاص می‌کند. امیدوارم هر کشفی باعث کنجکاوی و شادی شود.» این هنرمند که با نام «گوهر ورلد» در ظروف خانگی به تفاسیر سوررئالیستی اشیای رومیزی سنتی تخصص دارد، با تبدیل غذا به چیدمان‌های پیچیده و اغلب خارق‌العاده، نامی برای خود دست و پا کرده است. به عنوان بخشی از این همکاری، گوهر همچنین مجموعه‌ای از پاپ‌آپ‌های تعطیلات را طراحی کرده است که از شکلات‌فروشی‌های قدیمی پاریس و داروخانه‌های میلانی الگوبرداری شده‌اند. این تاسیسات دارای پنجره‌های نمایشی و ردیفی از کشوها هستند که طرح خود تقویم را منعکس می‌کنند. در هتل پاریس پرنس دو گال، هنرمند و طراح صحنه، آلیکس بورتولی، ویترین های سفارشی با ترکیب مواد خام مورد استفاده در شکلات ها ایجاد کرد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/3.-LG_AC_LC_037_1-3.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۴ آذر • ۱۸:۴۴"}, {"source": "Billboard", "title": "The Chicks & Willie Colón Join AI Music Lawsuit Against Suno: ‘Misappropriated Identities’", "link": "https://www.billboard.com/pro/the-chicks-willie-colon-join-ai-music-lawsuit-against-suno/", "summary": "The Chicks , Willie Colón and Sam Moore are joining the legal fight against AI music. The trio of acts and their estates were among a slew of artists added Tuesday (Nov. 24) to a case filed this summer against Suno, accusing the AI song generator of breaking the law by allowing users to “conjure up a beloved musician’s identity” when they enter a name as a prompt. Related Suno, Anthropic Face $1B Copyright Lawsuits From Round Hill Music Over AI Training Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Rod Wave Indicted on Drug Gun Charges for Items Allegedly Found in Car After Speeding Stop The case, filed by Jason Isbell , was a novel action centered on artists’ likeness rights, unlike earlier lawsuits over AI labs using copyrighted music to train models. Now, that case is backed by the star power of a huge country trio, a Latin music titan and an R B legend. “Suno built and trained a model to index musicians by name,” lawyers for the artists write. “It encoded musicians’ identities into its AI model to create its commercial product without consent, and now exploits those identities by publicly using musicians’ names to Suno’s considerable commercial benefit.” In addition to the members of the Chicks (Natalie Maines, Martie Maguire and Emily Strayer) and the estates of the late Colón and Moore, the lawsuit was also joined by 10 more artists, including David Longstreth of the indie rock band Dirty Projectors; Carl Craig, a pioneering DJ of Detroit techno; Franz Nicolay of rock band The Hold Steady; and Kealiʻi Reichel, a top Hawaiian music artist. Artists as big as Madonna and SZA have spoken out against AI music , and dozens of stars like Billie Eilish, Katy Perry, Luis Fonsi and the estates of Bob Marley and Frank Sinatra joined an open letter in 2024 calling unlicensed music AI an “assault on human creativity” that “must be stopped.” But few have taken actual legal action. An indie country singer named Tony Justice is litigating a class action against Suno, and Isbell’s case was joined by Camper Van Beethoven frontman David Lowery and a handful of others. The biggest case yet came from the owners of Elvis Presley’s intellectual property, who launched landmark cases against Suno and Anthropic this fall. The Chicks, who have a long history of outspoken advocacy , represent by far the biggest living musical act to yet sue over AI. More artists could be added to the case in the future, and since the case was filed a", "date_str": "2026-11-25T15:07:33+00:00", "hash": "eadeb591fbc8b28a", "title_fa": "The Chicks & Willie Colón به شکایت موسیقی هوش مصنوعی علیه Suno می پیوندند: «هویت های اختلاس شده»", "summary_fa": "The Chicks، Willie Colón و Sam Moore در حال پیوستن به مبارزه قانونی علیه موسیقی هوش مصنوعی هستند. این سه بازیگر و دارایی‌های آن‌ها از جمله هنرمندانی بودند که سه شنبه (24 نوامبر) به پرونده‌ای که تابستان امسال علیه سونو تشکیل شده بود، اضافه شدند و تولیدکننده آهنگ هوش مصنوعی را متهم به نقض قانون می‌کند و به کاربران اجازه می‌دهد «هویت یک موسیقیدان محبوب را تداعی کنند» وقتی نامی را به عنوان درخواست وارد می‌کنند. Suno مرتبط، صورت Anthropic $ 1B شکایت حق نسخه برداری از موسیقی Round Hill به دلیل آموزش هوش مصنوعی کریس براون موافقت کرد که در : "2026-11-25T15:00:00+00:00", "hash": "45348e64e444e1e1", "title_fa": "میندی کالینگ با جایزه حقوقی هالیوود ریپورتر در نمایشگاه زنان در اینترتینمنت گالا مفتخر خواهد شد.", "summary_fa": "Maitreyi Ramakrishnan قرار است این جایزه را در رویداد لس آنجلس به کالینگ اهدا کند، جایزه ای که توسط موسس لایف تایم و حامی عنوان لیلی اهدا می شود. مری بث بارون برنامه را باز خواهد کرد. هالیوود ریپورتر روز چهارشنبه اعلام کرد که میندی کالینگ نویسنده، کارگردان، بازیگر و تهیه کننده برنده جایزه جایزه Equity in Entertainment امسال را در مراسم جشن صبحانه سالانه زنان در سرگرمی در لس آنجلس دریافت خواهد کرد. بازیگر Maitreyi Ramakrishnan که در سریال پرطرفدار نتفلیکس Never Have Iver به کالینگ بازی کرد، این جایزه را به کالینگ اهدا خواهد کرد. کالینگ به تیلور سویفت می‌پیوندد که هالیوود ریپورتر قبلاً اعلام کرده بود که جایزه رهبری شری لنسینگ را به عنوان مفتخر در مراسم جشن امسال دریافت می‌کند. خبرهای مرتبط اخبار عمومی تیلور سوئیفت با جایزه رهبری شری لنسینگ هالیوود ریپورتر در مراسم زنان در سرگرمی تجلیل خواهد شد. لیلی لینا پولیمی، مدیر ارشد بازاریابی – مصرف کننده در Eli Lilly and Company، نکاتی را در مورد تقاطع مهم سلامت و سرگرمی به اشتراک خواهد گذاشت. جایزه Equity in Entertainment به افرادی می پردازد که صدای جوامعی را که کمتر در صنعت سرگرمی حضور دارند تقویت می کنند. این جایزه در سال 2016 ایجاد شد و جنیفر لوپز، سلنا گومز، کری واشنگتن، عیسی رای، رایان مورفی، امی پاسکال و نینا جاکوبسون از جمله برگزیدگان قبلی بودند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Mindy-Kaling-Photo-by-Ari-Michelson-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Hollywood Reporter", "title": "Gotham Film & Media Institute Names 2026 Winners of Focus Features Student Short Film Showcase (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/2026-gotham-film-media-institute-focus-student-short-films-1236762790/", "summary": "The five winners will each receive a cash grant and have the opportunity for their short to be shown on Focus Features' digital streaming platform.", "date_str": "2026-11-25T15:00:00+00:00", "hash": "a0f25074eb0dd9a1", "title_fa": "موسسه فیلم و رسانه گاتهام برندگان 2026 نمایشگاه فیلم کوتاه دانشجویی Focus Features را نام برد (اختصاصی)", "summary_fa": "پنج برنده هر کدام یک کمک هزینه نقدی دریافت خواهند کرد و فرصتی برای نمایش کوتاه خود در پلتفرم پخش دیجیتالی Focus Features خواهند داشت. موسسه رسانه فیلم گاتهام برندگان نمایشگاه فیلم کوتاه دانشجویی فوکوس فیچرز ۲۰۲۶ خود را انتخاب کرده است. پنج برنده این برنامه که با مشارکت Decentralized Pictures ارائه شده‌اند، آنا آلپیزار از دانشگاه نیویورک، شیله لیو از CalArts، نیکلاس پالاسیو از کالج شهر نیویورک، راویا رسول از کالج کلمبیا شیکاگو و کینتینگ وانگ از کلمبیا هستند. فیلمسازان برنده که در مراسم جوایز گاتهام 2026 در روز دوشنبه، نوامبر 2026 تجلیل خواهند شد. 30، هر کدام کمک نقدی دریافت خواهند کرد و این فرصت را خواهند داشت که فیلمشان در پلتفرم استریم دیجیتال Focus Features و پلتفرم استریم غیرمتمرکز DCP+ Pictures نمایش داده شود. داستان‌های مرتبط فیلم‌ها کارگردان مارپیچ پائولو استریپولی با تصویر ترسناک اسکار صحبت می‌کند: من سعی می‌کنم انتظارات را پایین بیاورم تلویزیون چرا مایک فلانگان فقط نمی‌توانست کری وایت را بکشد «یکی از هیجان‌انگیزترین بخش‌های کاری که ما در Focus انجام می‌دهیم، کشف استعدادهای جدید است. جیسون کسیدی، نایب رئیس Focus Features، در بیانیه‌ای گفت: «فیلمسازان امسال این روحیه را تجسم می‌دهند و داستان‌های جسورانه، شخصی و دیدگاه‌های تازه‌ای را از سرتاسر جهان به نمایش می‌گذارند.» ما مفتخریم که به همکاری خود با تیم بزرگ The Gotham ادامه می دهیم و این گروه استثنایی از فیلمسازان در حال رشد را جشن می گیریم.\" این نمایشگاه که برای دانشجویان MFA که یک فیلم کوتاه را در سه سال تحصیلی گذشته به پایان رساندند باز است، به دنبال دسترسی گروهی متنوع از فیلمسازان نوظهور به صنعت فیلم و حمایت از توزیع چند پلتفرمی آثارشان است.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/gotham_focus.jpg?crop=116px%2C0px%2C1179px%2C660px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد" د و مقدار زیادی شراب در جعبه حاضر می‌شوم، بنابراین وقتی کالشی از من خواست که نقش عمویی را بازی کنم که توسط خواهرزاده‌اش و کالشی بررسی می‌شود، مجبور نبودم کلی بازیگری انجام دهم. بازگشت به صحنه فیلم‌برداری با دیپ روی همیشه هیجان‌انگیز است. ما احساس می‌کنیم که با دادن سلاح مخفی به همه میزهای شام در آمریکا برای بستن دهان همه اعضای خانواده، خدمات عمومی انجام می‌دهیم.»", "image_url": "https://variety.com/wp-content/uploads/2026/11/Screenshot-2026-11-24-at-4.16.02-PM.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Variety", "title": "Vatican-Produced Doc ‘Green Lava’ Drops Trailer Featuring Justin Bieber’s ‘Everything Hallelujah’ (EXCLUSIVE)", "link": "https://variety.com/2026/awards/global/vatican-doc-trailer-justin-bieber-everything-hallelujah-1236957800/", "summary": "“Green Lava,” an inspirational Vatican-produced documentary short in the running for the Oscars, has unveiled its new global trailer which features Justin Bieber’s song “Everything Hallelujah.” The doc follows a 22-year-old Italian man named Giacomo Mattivi, who lives with Duchenne Muscular Dystrophy. Use of Bieber’s “Everything Hallelujah” was secured through a licensing agreement with Universal [ ]", "date_str": "2026-11-25T15:00:00+00:00", "hash": "f135da6d0dcfa3ec", "title_fa": "تریلر Doc «Green Lava» تولید شده توسط واتیکان با نمایش «همه چیز هاللویا» جاستین بیبر (اختصاصی)", "summary_fa": "«گدازه سبز»، یک مستند کوتاه الهام‌بخش محصول واتیکان که در حال رقابت برای اسکار است، تریلر جهانی جدید خود را با آهنگ «همه چیز هاللویا» جاستین بیبر رونمایی کرد. این مستند درباره یک مرد ۲۲ ساله ایتالیایی به نام جاکومو ماتیوی است که با دیستروفی عضلانی دوشن زندگی می کند. استفاده از \"همه چیز هاللویا\" بیبر از طریق توافق نامه مجوز با یونیورسال تضمین شد. تریلر جهانی جدید خود را که آهنگ جاستین بیبر به نام «Everything Hallelujah» را به نمایش می گذارد، رونمایی کرد. این مستند درباره یک مرد ۲۲ ساله ایتالیایی به نام جاکومو ماتیوی است که ب t.ir/archive/2026-09-15.html"}, {"date_key": "2026-09-14", "p_date": "۲۳ شهریور ۱۴۰۵", "g_date": "۱۴ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-14.html"}, {"date_key": "2026-09-13", "p_date": "۲۲ شهریور ۱۴۰۵", "g_date": "۱۳ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-13.html"}, {"date_key": "2026-09-12", "p_date": "۲۱ شهریور ۱۴۰۵", "g_date": "۱۲ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-12.html"}, {"date_key": "2026-09-11", "p_date": "۲۰ شهریور ۱۴۰۵", "g_date": "۱۱ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
