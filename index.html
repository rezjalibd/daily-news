wo nifty new accessories for page turning: a remote control called the Kindle Click and a case with physical buttons. The remote I have no beef with. Seems nifty. It's the case that I find to be a microaggression — no, perhaps macro — to my existence as a left-handed person. In fact, it makes me wonder: Does Amazon HATE left-handed people? Early Kindles had click buttons on both sides Let me explain with a bit of history. The earliest Kindle models had physical buttons on both sides of the bezel. The top button went page back, the larger lower button went page forward. This meant it was easy to hold the Kindle comfortably in either hand — you had the same buttons on both sides. The original Amazon Kindle. Mel Melcon/Los Angeles Times via Getty Images But by the Kindle Paperwhite's debut in 2012, everything changed. Now, instead of forward and back buttons on both sides, you tapped the left side of the screen to go back, and the right side to go page forward. This means that it's much easier if you're holding the device in your right hand. If you're holding it in your left, you have to either use your other hand or awkwardly stretch over the screen as you hold. Click buttons on both sides made it easier for lefties As a left-handed person, I much prefer holding a phone or Kindle in my left hand. The fact that the older models of Kindles made it easy for lefties to read while holding in their dominant hand was one of the best things about them! Better than physical books, even (there, I said it! I am unashamed!) Here I was, stuck with my crummy fifth-gen Kindle because I never wanted to upgrade to the better, faster, backlit Paperwhite versions with only right/left screen taps. At some point, my screen cracked, and I had to source a replacement on eBay, since they had been discontinued on Amazon years earlier. RIP my old Kindle 5th generation, which had physical buttons on both sides. Katie Notopoulos / Business Insider This a", "date_str": "2026-10-06T10:15:01+00:00", "hash": "0c713ae2483c6f48", "title_fa": "کیند کیندل جدید آمازون توهینی به چپ دستان من است", "summary_fa": "کیف جدید کیندل دارای دکمه های فیزیکی (!!!) برای ورق زدن است. سری جدید کیندل آمازون آمازون دارای لوازم جانبی کیف با دکمه های فیزیکی است. آری اما دکمه ها فقط سمت راست هستند که برای چپ دست هایی مثل من بد است. بو! آمازون، دکمه های دو طرف را بیاور، خدای دنگیت! آمازون هفته گذشته به‌روزرسانی سری کیندل اصلی را اعلام کرد. چند رنگ سرگرم کننده جدید وجود دارد (ube! seaglass!) برای Kindles معمولی، و برخی ارتقاهای جزئی مانند سرعت چرخش صفحه سریعتر در نسخه های Paperwhite و Colorsoft. دو لوازم جانبی جدید برای ورق زدن وجود دارد: یک کنترل از راه دور به نام Kindle Click و یک کیف با دکمه های فیزیکی. کنترلی که گوشت گاو با آن ندارم. باحال به نظر میرسه این موردی است که به نظر من یک تهاجم خرد - نه، شاید کلان - به وجود من به عنوان یک فرد چپ دست است. در واقع، من را متعجب می کند: آیا آمازون از افراد چپ دست متنفر است؟ Kindles اولیه دارای دکمه های کلیک در هر دو طرف بود. بگذارید با کمی تاریخ توضیح دهم. اولین مدل های Kindle دارای دکمه های فیزیکی در دو طرف قاب بودند. دکمه بالا به صفحه برگشت، دکمه پایینی بزرگتر به صفحه جلو رفت. این بدان معناست که به راحتی می توان Kindle را در هر دو دست نگه داشت - دکمه های یکسانی در هر دو طرف داشتید. کیندل اصلی آمازون. مل ملکن / لس آنجلس تایمز از طریق گتی ایماژ اما با اولین حضور Kindle Paperwhite در سال 2012، همه چیز تغییر کرد. اکنون به جای دکمه های جلو و عقب در هر دو طرف، روی سمت چپ صفحه نمایش برای بازگشت به عقب و سمت راست برای رفتن به صفحه به جلو ضربه می زنید. این به این معنی است که اگر دستگاه"}, {"source": "Business Insider", "title": "Instinct joined the chat: The startup is bringing its AI agents to your group DMs", "link": "https://www.businessinsider.com/instincts-ai-agents-are-coming-to-your-group-chat-2026-10", "summary": "Instinct is taking its AI agent from your personal life into your group chat. Thomas Fuller/SOPA Images/LightRocket via Getty Images After your inbox, errands, and shopping list, Instinct is now muscling into the group chat. Its new group agent can plan trips, split ticket costs, coordinate carpools, and more. The launch raises fresh privacy questions after users flagged prior agent missteps. Instinct came for your inbox, your errands, and your shopping list — now it's wading into the wild west of your group chat. Noah Shinn, the CEO of the personal AI agent startup , said in an X post on Monday that early-access users can now add Instinct to group chats, where it can help coordinate plans, settle logistics, and take actions for several people at once. The pitch is to end the familiar group-chat spiral: having to catch up on dozens of unread messages, competing restaurant suggestions, and the one friend who never answers whether they can make it to drinks on Friday. Instinct said its agent can plan a weekend trip around everyone's arrival times, work out roommate logistics, organize carpools, manage fantasy sports leagues, and keep track of who is bringing what to Thanksgiving. It can also try to buy tickets as soon as they go on sale, split the cost, and send one to each person. Unlike in a standard chat with Instinct, not everyone in the group needs an account. A new group-specific Instinct joins the conversation and works for the whole group, Shinn said. \"Your friends don't even need Instinct to join in,\" Shinn wrote. Your group chat is getting a new member The feature comes as Instinct and other personal AI agents face mounting questions from early users about privacy, security, and unwanted actions . Business Insider previously reported that Instinct users had raised concerns about the agent accessing accounts, giving inaccurate explanations of its actions, and sending unsolicited shopping recommendations based on details from earlier conversations. In one case, Veris AI CEO Mehdi Jamei said Instinct read a one-time login code from his connected Gmail account to cancel event RSVPs without first asking him. When he challenged the agent, Jamei said it acknowledged that it had reported an assumption as fact about how it had accessed his Luma account. Another user, Pritak Patel, said the agent appeared to describe a financial document with personal details that did not belong to him after he sent it a text-only link. Shinn later said the incident was a ha", "date_str": "2026-10-06T10:05:47+00:00", "hash": "d4f19a3e022d6114", "title_fa": "Instinct به چت ملحق شد: استارتاپ عوامل هوش مصنوعی خود را به DM های گروه شما می آورد.", "summary_fa": "Instinct عامل هوش مصنوعی خود را از زندگی شخصی شما وارد چت گروهی شما می کند. توماس فولر/تصاویر SOPA/LightRocket از طریق Getty Images پس از صندوق پستی، وظایف و لیست خرید شما، Instinct اکنون به چت گروهی وارد شده است. نماینده گروه جدید آن می‌تواند سفرها را برنامه‌ریزی کند، هزینه‌های بلیط را تقسیم کند، کارپول‌ها را هماهنگ کند و موارد دیگر. این راه‌اندازی پس از اینکه کاربران اشتباهات نماینده قبلی را علامت‌گذاری کردند، سؤالات جدیدی را درباره حریم خصوصی ایجاد می‌کند. Instinct برای صندوق ورودی، وظایف و لیست خرید شما آمد - اکنون به سمت غرب وحشی چت گروهی شما می رود. نوآ شین، مدیر عامل استارت‌آپ عامل هوش مصنوعی شخصی، در پست X روز دوشنبه گفت که کاربران با دسترسی زودهنگام اکنون می‌توانند Instinct را به چت‌های گروهی اضافه کنند، جایی که می‌تواند به هماهنگ کردن برنامه‌ها، حل و فصل تدارکات و انجام اقدامات برای چندین نفر به طور همزمان کمک کند. راه حل برای پایان دادن به مارپیچ آشنای چت گروهی است: نیاز به پیگیری ده ها پیام خوانده نشده، پیشنهادهای رقابتی رستوران، و دوستی که هرگز پاسخ نمی دهد که آیا می تواند روز جمعه به نوشیدنی برود یا خیر. Instinct می‌گوید که نماینده آن می‌تواند یک سفر آخر هفته را در زمان ورود همه برنامه‌ریزی کند، تدارکات هم اتاقی را انجام دهد، گروه‌های هم اتاقی را سازماندهی کند، لیگ‌های ورزشی فانتزی را مدیریت کند، و پیگیری کند که چه کسی چه چیزی را برای روز شکرگزاری آورده است. همچنین می‌تواند سعی کند به محض فروش بلیت‌ها را بخرد، هزینه را تقسیم کند و برای هر نفر یکی بفرستد. برخلاف چت استاندارد با Instinct، همه افراد گروه به یک حساب کاربری نیاز ندارند. Shinn گفت که یک غریزه جدید مخصوص گروه به گفتگو می پیوندد و برای کل گروه کار می کند. شین نوشت: \"دوستان شما حتی"}, {"source": "Business Insider", "title": "Turns out, managing bots is just as annoying as managing people", "link": "https://www.businessinsider.com/ai-agents-managing-more-annoying-managing-people-2026-10", "summary": "Getty Images; Alyssa Powell/BI One member of Sumaiya Noor's customer service team is trying to overachieve — and it's causing her some problems. Her AI agent is trained to loop her in when faced with a task it can't handle. However, she's noticed that over time, it tries to solve problems outside its scope, providing inaccurate answers with great confidence, which leads to dissatisfied and angry customers. So every couple of months, Noor said she has to carve out some time from her work to refresh the agent on what it's supposed to do, and train it on more edge cases. \"Over the period of time, it gets worse rather than getting better,\" said Noor, the chief product officer at a UK-based social-impact investment platform who also manages two other AI agents: a junior product manager and an internal \"chief of staff.\" She said deteriorating performance was a major difference she observed among her three AI agents compared with her seven human reports. Tech leaders sold an enticing vision of AI agents in the workplace. Zoom CEO Eric Yuan painted a picture of digital twins taking his meetings while kicking back at the beach on a four-day workweek. Salesforce teased a similar concept: the ultimate corporate sidekick to fire off sales pitches and run your day. For many workers, that future hasn't quite arrived. Instead, managing bots can be just as difficult as managing people. Workers shared with Business Insider a laundry list of growing pains that come with managing agentic AI: \"rot,\" long-running tasks derailed by a single error, and agents duplicating one another's work. Agents ≠ less work Agentic AI is still far from ubiquitous in the workplace — but adoption is rising. In a Boston Consulting Group report published in June, 30% of respondents said their organizations had integrated AI agents into workflows, up from 13% the year before. Offloading tasks doesn't necessarily mean employees get more time back — and that might be the biggest misconception embedded in the promise of agents. Cisco engineering director Sergio Freitas said agents haven't caused him to work longer hours, but they haven't shortened his days either. While traditional coding required focus, it felt like an immersive craft that many devs enjoyed, he said. Orchestrating agents demands a different kind of attention: more task switching and more oversight. That can make the work feel more intense, he said. \"The fatigue comes from the ability to do more,\" Freitas said. More output doesn't mea", "date_str": "2026-10-06T10:00:01+00:00", "hash": "e9857d69b077de6b", "title_fa": "به نظر می رسد، مدیریت ربات ها به اندازه مدیریت افراد آزاردهنده است", "summary_fa": "گتی ایماژ; Alyssa Powell/BI یکی از اعضای تیم خدمات مشتری سومایا نور در تلاش است تا بیش از حد به موفقیت برسد - و این باعث ایجاد مشکلاتی برای او شده است. عامل هوش مصنوعی او آموزش دیده است که در صورت مواجهه با کاری که نمی تواند از عهده او برآید، او را حلقه کند. با این حال، او متوجه شده است که با گذشت زمان، سعی می کند مشکلات خارج از محدوده خود را حل کند و با اطمینان زیاد پاسخ های نادرست ارائه می دهد که منجر به مشتریان ناراضی و عصبانی می شود. بنابراین هر چند ماه یکبار، نور گفت که باید مدتی از کارش را اختصاص دهد تا نماینده را در مورد کاری که قرار است انجام دهد، تازه کند و آن را در موارد لبه بیشتری آموزش دهد. نور، مدیر ارشد محصول در یک پلتفرم سرمایه گذاری تأثیر اجتماعی مستقر در بریتانیا که همچنین دو عامل دیگر هوش مصنوعی را مدیریت می کند: یک مدیر محصول خردسال و یک «رئیس کارکنان» داخلی، گفت: «در طول زمان، به جای اینکه بهتر شود، بدتر می شود. او گفت که بدتر شدن عملکرد تفاوت عمده ای بود که او بین سه عامل هوش مصنوعی خود در مقایسه با هفت گزارش انسانی خود مشاهده کرد. رهبران فناوری یک چشم انداز فریبنده از عوامل هوش مصنوعی را در محل کار فروختند. اریک یوان، مدیر عامل زوم، تصویری از دوقلوهای دیجیتالی را ترسیم کرد که جلسات خود را در حالی که در ساحل در یک هفته کاری چهار روزه پشت سر می‌گذاشتند. Salesforce مفهوم مشابهی را به اشتراک گذاشته است: یکی از دستیاران شرکتی نهایی که می‌توانند از میدان‌های فروش خارج شوند و روز شما را اداره کنند. برای بسیاری از کارگران، این آینده کاملاً فرا نرسیده است. در عوض، مدیریت ربات‌ها می‌تواند به اندازه مدیریت افراد دشوار باشد. کارگران"}, {"source": "Business Insider", "title": "The Costco conundrum: Packed parking lots and a falling stock", "link": "https://www.businessinsider.com/costco-walmart-stock-price-outlook-earnings-sales-consumer-staples-valuation-2026-10", "summary": "Justin Sullivan/Getty Images Costco and Walmart have packed aisles, but Wall Street wants more. Investors priced them as protection against a weaker consumer, leaving little room for error. Sign up for First Trade , Business Insider's daily markets newsletter. You drive by Costco and see the parking lot teeming with cars. The left-hand turn lane to enter is backed up 50 yards. The gas station is packed with people planning to head inside after they fill up. It's the busiest intersection in town. But then you pull up a stock chart. Shares are down 16% since a peak in May. You're confused. Didn't you just read that earnings were strong this past quarter? The stock underperformance isn't just a Costco issue. Walmart — another retailer that shoppers have historically traded down to when trying to spend less — has an eerily similar recent stock chart despite continuing to add customers. What gives? Aren't these supposed to be all-weather winners of a consumer pullback? In an ironic way, the reputation of Costco and Walmart as defensive plays may have worked against them. As worries about the consumer grew , investors built a premium into their stocks. That, in turn, gave them less room for error, and made them more sensitive to further signs of weaker spending. The chart below shows just how badly both stocks have underperformed the market — and the broader consumer staples sector — since they closed at record highs on May 19. The following day was when President Trump said Iran-war negotiations were in the \"final stages,\" sending oil sharply lower and taking some of the shine off the defensive trade in Costco and Walmart. Then, on May 21, Walmart forecast second-quarter profit below analyst expectations, triggering a sector-wide sell-off. Neither stock has been able to claw those losses back. Good isn't good enough anymore Costco gave investors plenty to like in its quarterly report last month. Both overall and comparable sales were up from a year earlier, and the company said it plans to open 33 additional warehouses over the next fiscal year. But the resulting 3% post-earnings gain was a drop in the bucket compared to how much ground the stock has to make up. There were some minor caveats. Costco's profit beat was partially driven by a one-time tariff refund, while membership-fee growth slowed. When so much has been priced into a stock, investors tend to notice every asterisk. Defensive, but not invincible Walmart's path has been even more directly tied to c", "date_str": "2026-10-06T09:50:01+00:00", "hash": "c284d2b65434d799", "title_fa": "معمای Costco: پارکینگ های شلوغ و سهام در حال سقوط", "summary_fa": "جاستین سالیوان/ گتی ایماژ کاستکو و والمارت راهروهای شلوغی دارند، اما وال استریت بیشتر می خواهد. سرمایه گذاران آنها را به عنوان محافظت در برابر مصرف کننده ضعیف تر قیمت گذاری کردند و جای کمی برای خطا باقی گذاشتند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. شما با Costco رانندگی می کنید و پارکینگ مملو از ماشین ها را می بینید. خط گردش سمت چپ برای ورود 50 یارد پشتیبان دارد. پمپ بنزین مملو از افرادی است که قصد دارند پس از پر شدن به داخل آن بروند. شلوغ ترین تقاطع شهر است. اما سپس نمودار سهام را بالا می برید. سهام از زمان اوج خود در ماه می 16 درصد کاهش یافته است. شما گیج شده اید. آیا به تازگی نخوانده اید که درآمدها در سه ماهه گذشته قوی بوده است؟ عملکرد ضعیف سهام فقط یک مشکل Costco نیست. Walmart - خرده‌فروشی دیگری که خریداران در طول تاریخ با آن معامله می‌کنند و سعی می‌کنند کمتر خرج کنند - علیرغم ادامه افزودن مشتریان، نمودار سهام اخیر مشابهی دارد. چه چیزی می دهد؟ آیا اینها قرار نیست برنده هر شرایط آب و هوایی یک عقب نشینی مصرف کننده باشند؟ به شیوه ای طعنه آمیز، شهرت Costco و Walmart به عنوان بازی های تدافعی ممکن است علیه آنها کار کند. با افزایش نگرانی در مورد مصرف کننده، سرمایه گذاران حق بیمه ای را در سهام خود ایجاد کردند. این به نوبه خود، به آنها فضای کمتری برای خطا داد و آنها را نسبت به نشانه‌های بیشتر مخارج ضعیف‌تر حساس‌تر کرد. نمودار زیر نشان می دهد که هر دو سهم از زمانی که در 19 مه در بالاترین حد خود بسته شدند، تا چه اندازه ضعیف عمل کرده اند. سپس، در 21 می، والمارت سود سه ماهه دوم را کمتر از انتظارات تحلیلگران پیش بینی کرد و باعث"}, {"source": "Business Insider", "title": "Corporate America is putting its staff in layoff limbo", "link": "https://www.businessinsider.com/nike-meta-gitlab-forecast-layoffs-strategy-2026-10", "summary": "Nike CEO Elliott Hill, who recently released a statement forecasting job cuts that will begin in calendar year 2027 and beyond. Bloomberg/Getty Images Some companies are announcing cuts weeks or months before telling workers who'll lose their jobs. Nike is the latest. Meta and GitLab made similar moves earlier this year. The added time can help staffers find new gigs. It can also add stress. Some companies are giving an unusual kind of layoff warning: Cuts are coming, though you might have to wait weeks or months to learn whether your role was affected. Nike did this last week, saying in a statement that it would make decisions about affected roles starting in 2027 and beyond. Earlier this year, Meta and GitLab also announced plans for future cuts before identifying who they would let go. Typically, businesses notify affected employees and the rest of the company on the same day. A lengthy heads-up can give workers time to find a new job. It might also encourage some staffers to leave on their own, potentially saving companies severance costs, workplace observers say. At the same time, anxiety can ripple across a company. 'News like this creates uncertainty' In Nike's statement, CEO Elliott Hill said the sportswear maker will be reducing its head count because it's changing its operating model , and that it doesn't yet know how many roles or which locations will be affected. \"I want to acknowledge that news like this creates uncertainty,\" Hill wrote. \"Throughout this process, we will communicate directly, act with transparency and treat people with respect.\" The announcement coincided with the release of Nike's fiscal first-quarter results, which showed profits declined 2% as revenue fell 4%. The company said it expects revenue to decline by a high-single-digit percentage for its current fiscal year. In a statement, Nike spokeswoman Mary Remuzzi said the company \"remains committed to being transparent with our employees and communicating updates as we have them.\" She also said: \"Some actions will occur over time and, in many locations, applicable local requirements and consultation processes will inform timing and execution.\" Shares in Nike, which is attempting a turnaround , are down about 46% year to date. The company last announced it was eliminating about 1,400 roles in April, though at the time it said those affected would hear directly from their leaders and HR partners starting that same day. Layoff limbo When Meta said in April that it would let go", "date_str": "2026-10-06T09:47:01+00:00", "hash": "da825ab68c9d9730", "title_fa": "شرکت آمریکایی کارکنان خود را در بلاتکلیفی اخراج می کند", "summary_fa": "الیوت هیل، مدیر عامل نایک، که اخیراً بیانیه ای را منتشر کرده است که در آن کاهش مشاغل از سال 2027 و پس از آن آغاز خواهد شد. بلومبرگ/گتی ایماژ برخی از شرکت ها هفته ها یا ماه ها قبل از اینکه به کارگران اعلام کنند شغل خود را از دست خواهند داد، کاهش را اعلام می کنند. نایک جدیدترین است. Meta و GitLab در اوایل سال جاری اقدامات مشابهی انجام دادند. زمان اضافه شده می تواند به کارکنان در یافتن کنسرت های جدید کمک کند. همچنین می تواند استرس را اضافه کند. برخی از شرکت‌ها نوعی هشدار غیرمعمول از اخراج می‌دهند: کاهش در راه است، اگرچه ممکن است مجبور باشید هفته‌ها یا ماه‌ها منتظر بمانید تا بدانید که آیا نقش شما تحت تأثیر قرار گرفته است یا خیر. نایک هفته گذشته این کار را انجام داد و در بیانیه‌ای اعلام کرد که از سال 2027 و پس از آن درباره نقش‌های آسیب‌دیده تصمیم‌گیری خواهد کرد. در اوایل سال جاری، متا و گیت‌لب نیز برنامه‌هایی را برای کاهش‌های آتی پیش از شناسایی افرادی که رها می‌کنند، اعلام کردند. به طور معمول، مشاغل در همان روز به کارکنان آسیب دیده و بقیه شرکت اطلاع می دهند. یک سرکشی طولانی مدت می تواند به کارگران فرصت دهد تا شغل جدید پیدا کنند. به گفته ناظران محل کار، ممکن است برخی از کارکنان را تشویق کند که خودشان را ترک کنند و به طور بالقوه باعث صرفه جویی در هزینه های اخراج شرکت ها شود. در عین حال، اضطراب می تواند در سراسر شرکت موج بزند. در بیانیه نایک، الیوت هیل، مدیر عامل شرکت نایک، گفت که تولیدکننده پوشاک ورزشی تعداد کار خود را کاهش خواهد داد زیرا در حال تغییر مدل عملیاتی خود است و هنوز نمی‌داند چه تعداد نقش یا چه مکان‌هایی تحت تأثیر قرار خواهند گرفت. هیل نوشت: «می‌خواهم اذعان"}, {"source": "Business Insider", "title": "Early users are deleting personal AI agents, citing privacy scares and blunders", "link": "https://www.businessinsider.com/early-users-delete-personal-ai-agents-privacy-scares-blunders-2026-10", "summary": "Early users are deleting AI agents over fears they can t trust them with sensitive data. Smith Collection/Gado/Getty Images Some early users say they deleted Instinct after privacy scares and security worries. Personal AI agents can save time and money, but the access they need is making some users uneasy. \"It's the wild west with these products,\" one user told Business Insider. Personal AI agents aren't for everyone. Many early adopters of Instinct and Meta's Muse have said the digital assistants saved them time and money by searching the web, managing inboxes and calendars, disputing bills, booking travel, and making purchases. For some, blunders and privacy scares from their agents have proven too unnerving. Four early adopters, among dozens of people raising similar concerns on social media, told Business Insider they had deleted or restricted personal AI agents over concerns about the sensitive data and account access the tools need to work effectively. Guto Martino, a cofounder of Hermes Agents Brasil, a community that helps people build and run open-source personal AI agents , told Business Insider he deleted Instinct because he was unsure how the company handled his information. \"I have no clue where my data is going and what kind of privacy I do get from using that agent,\" Martino said. Martino's decision follows a string of troubling episodes involving personal AI agents. Users have reported agents accessing one-time login codes from Gmail without asking, hallucinating personal information from a document that was never sent, and triggering a carrier-account login prompt apparently originating from Iran. Meta said Muse has \"first-of-its-kind privacy, safety, and security protections\" and that its controls put users in charge of what they share. It said users choose which apps Muse connects to and what it can do with services such as email, and can change or remove access, or permanently delete their Muse data. Instinct didn't respond to requests for comment. 'Access to email is everything' While a handful of users are wary, vastly more are experimenting with the technology. Muse shot to the top of the App Store a week after launch, and it continues to attract users. The Information reported that Meta's Muse now has more than 3 million weekly users, including more than 1 million daily active users . Instinct has not disclosed its total user base. But Shinn said on an episode of \"Invest Like The Best\" in late September that the invite-only service ", "date_str": "2026-10-06T09:33:15+00:00", "hash": "d534c3a1deff31f1", "title_fa": "کاربران اولیه عوامل هوش مصنوعی شخصی را حذف می‌کنند و دلیل آن را ترس از حریم خصوصی و اشتباهات می‌دانند", "summary_fa": "کاربران اولیه به دلیل ترس از اینکه نتوانند به اطلاعات حساس به آنها اعتماد کنند، عوامل هوش مصنوعی را حذف می کنند. مجموعه اسمیت/گادو/گتی ایماژ برخی از کاربران اولیه می گویند که Instinct را پس از ترس از حریم خصوصی و نگرانی های امنیتی حذف کرده اند. عوامل هوش مصنوعی شخصی می توانند در زمان و هزینه صرفه جویی کنند، اما دسترسی آنها به آنها باعث ناراحتی برخی از کاربران می شود. یکی از کاربران به Business Insider گفت: «این غرب وحشی با این محصولات است. عوامل هوش مصنوعی شخصی برای همه مناسب نیستند. بسیاری از اولین پذیرندگان Instinct و Meta's Muse گفته‌اند که دستیارهای دیجیتال با جستجو در وب، مدیریت صندوق‌های ورودی و تقویم‌ها، بحث در مورد صورت‌حساب، رزرو سفر و خرید، در زمان و هزینه‌شان صرفه‌جویی می‌کنند. برای برخی، اشتباهات و ترس از حریم خصوصی از سوی عوامل آنها بسیار نگران کننده است. چهار نفر از کاربران اولیه، از میان ده‌ها نفری که نگرانی‌های مشابهی را در رسانه‌های اجتماعی مطرح می‌کنند، به Business Insider گفتند که عوامل هوش مصنوعی شخصی را به دلیل نگرانی در مورد داده‌های حساس و دسترسی به حساب‌ها که ابزارها برای کار مؤثر نیاز دارند، حذف یا محدود کرده‌اند. گوتو مارتینو، یکی از بنیان‌گذاران Hermes Agents Brasil، جامعه‌ای که به افراد کمک می‌کند عوامل هوش مصنوعی شخصی منبع باز بسازند و راه‌اندازی کنند، به Business Insider گفت که Instinct را حذف کرده است زیرا مطمئن نبود که این شرکت چگونه اطلاعات او را مدیریت می‌کند. مارتینو گفت: «من هیچ سرنخی ندارم که داده‌های من به کجا می‌رود و چه نوع حریم خصوصی با استفاده از آن عامل به دست می‌آورم. تصمیم مارتینو به دنبال مجموعه ای از اپیزودهای نگران کننده مربوط به عوامل هوش مصنوعی شخصی است. کاربران گزارش داده‌اند که نمایندگانی بدون درخواست به کدهای ورود به سیستم یکبار مصرف از جی‌میل دسترسی"}, {"source": "Business Insider", "title": "Home prices are dropping the most in these 12 metro areas as inventory piles up", "link": "https://www.businessinsider.com/where-are-home-prices-falling-cities-housing-market-mortgage-rates-2026-10", "summary": "Kevin Carter/Getty Images More sellers are slashing prices on their homes to entice buyers fatigued by rising rates. Around 20% of sellers issued a price cut on an active listing last month, Redfin found. Price cuts are the most common in Denver, Indianapolis, and San Antonio as inventory rises. The housing market is still mired in a slowdown , but there's good news for buyers: home prices are coming down. Price cuts are becoming more common in housing markets across the country, a testament to how the real estate market has increasingly shifted toward buyers mortgage rates have steadily climbed in 2026. Around 21% of sellers with active listings cut their asking price for their home in the four weeks leading up to September 20, according to a recent Redfin analysis. It marks the highest proportion of sellers that have slashed prices in this time of the year since at least 2022, when Redfin began tracking the data, the real estate listings site said last week. The housing market has been anemic in the years following the pandemic buying frenzy, though the freeze appears to have deepened in the last few months as mortgage rates have climbed. The average 30-year fixed mortgage rate broke above the 7% mark for the first time in years in September, reflecting how borrowing costs for consumers have risen dramatically amid the spike in bond yields. On Monday, the rate was close to 7.5%. \"Many are eventually cutting their price as they come to terms with reality: Mortgage rates are sitting above 7%, the economy is uncertain, and many homes are lingering on the market,\" Asad Khan, a senior economist at Redfin, said. Here are the 12 cities in the US that are seeing the most homes with price cuts: Denver, CO Doug Pensinger/Getty Images Share of active listings with a price drop : 30.9% YoY% change : +3.1 percentage points Median sales price (August 2026) : $619,909 Indianapolis, IN Indianapolis, IN shermancahal/Getty Images Share of active listings with a price drop : 29.9% YoY% change : +2.0 percentage points Median sales price (August 2026) : $259,828 San Antonio, TX San Antonio, TX Sean Pavone/Getty Images Share of active listings with a price drop : 26.8% YoY% change : +0.7 percentage points Median sales price (August 2026) : $264,825 Dallas, TX Dallas, TX Chris LaBasco/Getty Images Share of active listings with a price drop : 26.1% YoY% change : +1.1 percentage points Median sales price (August 2026) : $448,703 Austin, TX Austin, TX Art Wager/Getty Images Share", "date_str": "2026-10-06T09:30:01+00:00", "hash": "877a4e2c2b097bee", "title_fa": "با انباشته شدن موجودی، قیمت خانه در این 12 منطقه مترو بیشترین کاهش را دارد", "summary_fa": "کوین کارتر/ گتی ایماژ فروشندگان بیشتری قیمت خانه های خود را کاهش می دهند تا خریدارانی را که از افزایش نرخ ها خسته شده اند را جلب کنند. ردفین دریافت که حدود 20 درصد از فروشندگان در ماه گذشته قیمت یک فهرست فعال را کاهش دادند. کاهش قیمت در دنور، ایندیاناپولیس و سن آنتونیو با افزایش موجودی، رایج ترین است. بازار مسکن همچنان در رکود فرو رفته است، اما خبر خوبی برای خریداران وجود دارد: قیمت مسکن در حال کاهش است. کاهش قیمت‌ها در بازارهای مسکن در سراسر کشور رایج‌تر می‌شود، که نشان می‌دهد چگونه بازار املاک و مستغلات به‌طور فزاینده‌ای به سمت خریداران سوق پیدا کرده است، نرخ‌های وام مسکن به طور پیوسته در سال 2026 افزایش یافته است. طبق تجزیه و تحلیل Redfin، حدود 21 درصد از فروشندگان با فهرست‌های فعال قیمت درخواستی خانه خود را در چهار هفته اخیر منتهی به 20 سپتامبر کاهش دادند. سایت فهرست املاک و مستغلات هفته گذشته اعلام کرد که این بالاترین نسبت فروشندگانی است که قیمت ها را در این زمان از سال حداقل از سال 2022، زمانی که Redfin شروع به ردیابی داده ها کرد، کاهش داده اند. بازار مسکن در سال‌های پس از شورش خرید همه‌گیر دچار کم‌خونی بوده است، اگرچه به نظر می‌رسد که انجماد در چند ماه گذشته با افزایش نرخ‌های وام مسکن عمیق‌تر شده است. متوسط ​​نرخ 30 ساله وام مسکن ثابت برای اولین بار در ماه سپتامبر از مرز 7 درصد عبور کرد که نشان دهنده افزایش چشمگیر هزینه های وام برای مصرف کنندگان در بحبوحه افزایش بازده اوراق قرضه است. روز دوشنبه این نرخ نزدیک به 7.5 درصد بود. اسد خان، اقتصاددان ارشد در Redfin، گفت: \"بسیاری در نهایت قیمت خود را کاهش می دهند، زیرا با واقعیت کنار می آیند: نرخ های وام مسکن بالای 7٪ است، اقتصاد نامطمئن است، و بسیاری از"}, {"source": "Business Insider", "title": "I'm the CEO of Zocdoc. Here's how long showers help me manage hectic days.", "link": "https://www.businessinsider.com/day-in-the-life-oliver-kharraz-ceo-cofounder-zocdoc-2026-10", "summary": "Oliver Kharraz. Zocdoc This as-told-to essay is based on a conversation with Oliver Kharraz , the 53-year-old CEO and cofounder of Zocdoc, based in New York City. It's been edited for length and clarity. I grew up in Germany and attended college in Munich. I got an MD and a doctorate in neuroscience. I became the most recent doctor in a 300-year family tradition, and previously practiced clinically. During college, I built my first company. I provided internet access to a few local companies and offered data storage and remote access solutions. I had the choice to either drop out of college and make it internet-ready or sell it. I sold it in 1994. I then spent seven years at McKinsey as an associate principal, which was great training for me — it was sort of a prelude to some of the things I had to do at Zocdoc later. I worked at the Munich office, then transferred to the New York office in 2004. Business Insider's Power Hours series gives readers an inside look at how powerful people structure their workday. Reach out to editor Lauryn Haas to share your daily routine. I started Zocdoc, an online service that lets people find and book in-person or telehealth appointments for medical or dental care, in 2007 with two cofounders, one of whom I met at McKinsey. We were in the process of starting several companies and discussing our personal experiences with the healthcare system. As we talked, it became clear to us that this was a better opportunity than what we were pursuing separately. I became the CEO in November 2015. Here's a typical day in my life. I wake up naturally at 4:30 a.m. after four to five hours of sleep I've always been an early riser and feel most productive in the hours before sunrise. I grab my phone and look at the company numbers. I have several reports that the system automatically sends, so they're waiting in my inbox. I look at our KPIs, and if something looks off, I might shoot off a couple of questions to the team. I frequently send those out with an 8 a.m. timer, so people don't get scared about why the CEO sends emails in the middle of the night. I then read for half an hour, a mix of history, biography, philosophy, and health industry news. I then exercise for 30 minutes This is a newer addition to my routine, despite my medical background. At my age, I try to alternate between cardio and weights and aim to keep my pulse consistently above 140. After working out, I take a long shower to think and brainstorm Once a week, I dedicate", "date_str": "2026-10-06T09:05:01+00:00", "hash": "800579f584d07096", "title_fa": "من مدیر عامل Zocdoc هستم. در اینجا آمده است که دوش گرفتن طولانی مدت به من کمک می کند روزهای شلوغ را مدیریت کنم.", "summary_fa": "الیور خراز. Zocdoc این مقاله همانطور که گفته شد بر اساس گفتگو با الیور خاراز، مدیرعامل 53 ساله و یکی از بنیانگذاران Zocdoc، مستقر در شهر نیویورک است. برای طول و وضوح ویرایش شده است. من در آلمان بزرگ شدم و در کالج مونیخ تحصیل کردم. من MD و دکترای علوم اعصاب گرفتم. من جدیدترین پزشک در یک سنت خانوادگی 300 ساله شدم و قبلاً به صورت بالینی تمرین می کردم. در دوران کالج، اولین شرکتم را ساختم. من دسترسی به اینترنت را برای چند شرکت محلی فراهم کردم و راه حل های ذخیره سازی داده و دسترسی از راه دور را ارائه دادم. من این انتخاب را داشتم که یا کالج را رها کنم و آن را برای اینترنت آماده کنم یا آن را بفروشم. من آن را در سال 1994 فروختم. سپس هفت سال را در مک‌کینزی به‌عنوان مدیر کاردان گذراندم، که برای من آموزش عالی بود - به نوعی مقدمه‌ای برای برخی از کارهایی بود که بعداً مجبور شدم در Zocdoc انجام دهم. من در دفتر مونیخ کار کردم، سپس در سال 2004 به دفتر نیویورک منتقل شدم. مجموعه «ساعات نیرو» Business Insider به خوانندگان نگاهی درونی می‌دهد که چگونه افراد قدرتمند روز کاری خود را ساختار می‌دهند. با ویرایشگر لورین هاس تماس بگیرید تا کارهای روزمره خود را به اشتراک بگذارید. من Zocdoc را راه اندازی کردم، یک سرویس آنلاین که به مردم اجازه می دهد تا قرار ملاقات حضوری یا از راه دور برای مراقبت های پزشکی یا دندانپزشکی را پیدا کرده و رزرو کنند، در سال 2007 با دو بنیانگذار که یکی از آنها را در مک کینزی ملاقات کردم. ما در حال راه اندازی چندین شرکت و بحث در مورد تجربیات شخصی خود با سیستم مراقبت های بهداشتی بودیم. وقتی صحبت می کردیم، برایمان روشن شد که این فرصت بهتری نسبت به آنچه"}, {"source": "Business Insider", "title": "This CEO wants to challenge Tesla's charging dominance. He's teaching dealerships how to make the EV pitch.", "link": "https://www.businessinsider.com/ionna-ceo-train-dealers-ev-adoption-2026-10", "summary": "Seth Cutler compared EV adoption to the rapid rise of flat-screen televisions. IONNA Ionna plans to train staff at a few hundred dealerships on EV charging. CEO Seth Cutler told Business Insider that Ionna will fail if it can't help drive EV adoption. The Tesla challenger has more than doubled its US charging sites this year. The person selling you an EV may need a crash course in how to charge one. Ionna, a fast-charging network backed by eight large automakers, is preparing to train dealership staff at a few hundred locations, its CEO, Seth Cutler, told Business Insider. The company expects to target dealers in Jacksonville, Orlando, Tampa, Dallas, San Francisco, San Jose, and Raleigh. The program, expected to begin in the first quarter of 2027, will operate at dealers that sell cars made by Ionna's investors: Toyota, Honda, General Motors , Hyundai, Kia, BMW, Mercedes-Benz, and Jeep-maker Stellantis. The stakes are high for Cutler and Ionna. \"I tell people, if at the end of this decade, we haven't helped move the needle along on EV adoption, then Ionna's failed,\" Cutler said. He said the industry has spent years improving EVs themselves — range, performance, and charging speed — while reliable public charging, especially along highways and in urban environments, has remained a stubborn barrier. \"We very much feel that if we can do this right, we can enable EV adoption,\" Cutler added. It all comes as Ionna's attempts to become a contender in the electric-vehicle charging race that Tesla has dominated. This year, Ionna has more than doubled its charging stations across the US — jumping from 90 active stations in January to 191 at the start of October. Cutler expects to cut the ribbon on the 200th location this month. That's still tiny compared to Tesla, which has more than 3,000 across the US. Ionna also has to compete with Walmart, which is rapidly building out its EV fast-charging network, with roughly 300 locations under construction outside its stores. Ionna has focused on pairing its charging stations with amenities. Several charging sites come with window-cleaning squeegees, trash cans, all-day bathrooms, lounges, and, in some cases, convenience stores with Amazon's Just Walk Out tech . JD Power ranked its stations the best fast-charging in the country during its 2026 test. Still, building out the rest of its charging network will come as automakers pare back their EV offerings amid cooling sales growth. Next year, one of Ionna's backers, Honda, won", "date_str": "2026-10-06T09:00:01+00:00", "hash": "de915bd26870c39a", "title_fa": "این مدیر عامل می خواهد سلطه تسلا در زمینه شارژ را به چالش بکشد. او به نمایندگی‌ها آموزش می‌دهد که چگونه زمین برقی را بسازند.", "summary_fa": "ست کاتلر پذیرش EV را با افزایش سریع تلویزیون های صفحه تخت مقایسه کرد. IONNA Ionna قصد دارد کارکنان خود را در چند صد نمایندگی در مورد شارژ EV آموزش دهد. مدیر عامل شرکت ست کاتلر به Business Insider گفت که اگر آیونا نتواند به پذیرش خودروهای برقی کمک کند، شکست خواهد خورد. رقیب تسلا در سال جاری سایت های شارژ خود را در ایالات متحده بیش از دو برابر کرده است. شخصی که به شما یک خودروی برقی می‌فروشد ممکن است به یک دوره آموزشی در مورد نحوه شارژ کردن آن نیاز داشته باشد. مدیر عامل آن، ست کاتلر، به Business Insider گفت: Ionna، یک شبکه شارژ سریع با پشتیبانی هشت خودروساز بزرگ، در حال آماده شدن برای آموزش کارکنان نمایندگی در چند صد مکان است. این شرکت انتظار دارد تا فروشندگان را در جکسونویل، اورلاندو، تامپا، دالاس، سانفرانسیسکو، سن خوزه و رالی هدف قرار دهد. این برنامه که انتظار می‌رود در سه ماهه اول سال 2027 آغاز شود، در نمایندگی‌هایی که خودروهای ساخته شده توسط سرمایه‌گذاران آیونا را می‌فروشند: تویوتا، هوندا، جنرال موتورز، هیوندای، کیا، بی‌ام‌و، مرسدس بنز، و جیپ‌ساز Stellantis فعالیت خواهد کرد. خطرات برای کاتلر و ایونا زیاد است. کاتلر گفت: \"من به مردم می گویم، اگر در پایان این دهه، ما به حرکت سوزن در پذیرش خودروهای الکتریکی کمک نکرده باشیم، ایونا شکست خورده است.\" او گفت که صنعت سال‌ها را صرف بهبود خودروهای الکتریکی کرده است - برد، عملکرد و سرعت شارژ - در حالی که شارژ عمومی قابل اعتماد، به‌ویژه در بزرگراه‌ها و در محیط‌های شهری، یک مانع سرسخت باقی مانده است. کاتلر افزود: \"ما بسیار احساس می کنیم که اگر بتوانیم این کار را به درستی انجام دهیم، می توانیم پذیرش EV را فعال کنیم.\" همه اینها به دلیل تلاش ایونا برای تبدیل شدن به یک مدعی در رقابت شارژ خودروهای الکتریکی"}, {"source": "Business Insider", "title": "The crown jewel in Elon Musk's empire", "link": "https://www.businessinsider.com/starlink-elon-musk-business-empire-crown-jewel-2026-10", "summary": "Finn Gomez/Getty Images; Getty Images; Tyler Le/BI Luke Hartley realized how important Elon Musk's Starlink was to him when it fell overboard. Two weeks into his voyage across the Pacific in October 2023, Hartley's sailboat, Songbird, was hit by an intense squall that knocked the Starlink dish balanced on the front of the boat over the side. It was a major blow for the music teacher turned sailing influencer, who tells me he made far more money posting about his three-year voyage around the world on TikTok via Starlink than he ever had in the US education system. Without satellite internet, he had no way to upload the videos that were funding his voyage, check weather forecasts, or call his family. From the remote Pacific to the front lines of Ukraine, Starlink's network of orbital internet satellites has become indispensable to 13 million people in more than 167 countries. Starlink accounted for more than 60% of the $18.6 billion in revenue SpaceX generated last year, and was the only part of the business to turn a profit. Musk has grander ambitions for the flying crown jewels in his empire. The company plans to launch tens of thousands more satellites in the coming years as it targets new markets, in a push to transform Starlink from a boutique service for rugged survivalists into the world's premier wireless carrier and broadband provider. Many users who like it love it, and have flooded social media with praise for Musk and his creation. Beyond the profits, Starlink has also provided Musk a vital source of influence and soft power that stretches the globe. The world's richest man's attempt to gut government bureaucracy with DOGE, his massive political donations, and his erratic and incendiary posting habits on X have cost him Tesla customers and inspired boycotts and protests against his other companies. But Starlink is so useful in far-flung and war-torn places — and has so few alternatives — that it has granted Musk a rare level of immunity to political gravity. It's also left governments, adventurers, and digital nomads struggling to reconcile their reliance on the technology with the controversies that swirl around Musk. \"We can criticize Musk till the cows come home, but it's an incredible product,\" says Hartley, who has mixed feelings about depending so heavily on Starlink. \"It has a very controversial name behind it, but it is also a way for me to talk to my mom and inspire folks. Both things can be true.\" Nowhere is this dance between reluctanc", "date_str": "2026-10-06T08:15:01+00:00", "hash": "d3ac20fa8673a7d6", "title_fa": "جواهر تاج در امپراتوری ایلان ماسک", "summary_fa": "فین گومز/گتی ایماژ; گتی ایماژ; تایلر لو/بی‌آی لوک هارتلی متوجه شد که Starlink ایلان ماسک چقدر برایش مهم است، زمانی که به دریا افتاد. دو هفته پس از سفر خود به سراسر اقیانوس آرام در اکتبر 2023، قایق بادبانی هارتلی، Songbird، مورد اصابت صدای شدیدی قرار گرفت که دیش استارلینک را که در قسمت جلوی قایق متعادل شده بود، از کناره کوبید. این یک ضربه بزرگ برای معلم موسیقی بود که به اینفلوئنسر قایقرانی تبدیل شده بود و به من می گوید که با ارسال پست در مورد سفر سه ساله خود در سراسر جهان در TikTok از طریق Starlink بسیار بیشتر از همیشه در سیستم آموزشی ایالات متحده درآمد کسب کرده است. بدون اینترنت ماهواره ای، او هیچ راهی برای آپلود ویدیوهایی که هزینه سفر او را تامین می کرد، بررسی پیش بینی آب و هوا یا تماس با خانواده اش نداشت. از اقیانوس آرام از راه دور تا خطوط مقدم اوکراین، شبکه ماهواره های اینترنتی مداری Starlink برای 13 میلیون نفر در بیش از 167 کشور ضروری شده است. استارلینک بیش از 60 درصد از درآمد 18.6 میلیارد دلاری اسپیس ایکس را در سال گذشته به خود اختصاص داد و تنها بخشی از کسب و کار بود که به سود رسید. ماسک جاه طلبی های بزرگ تری برای جواهرات تاج پرنده در امپراتوری خود دارد. این شرکت قصد دارد ده‌ها هزار ماهواره دیگر را در سال‌های آینده پرتاب کند، زیرا بازارهای جدید را هدف قرار می‌دهد تا Starlink را از یک سرویس بوتیک برای بقای سخت‌گیر به برترین حامل بی‌سیم و ارائه‌دهنده پهنای باند در جهان تبدیل کند. بسیاری از کاربرانی که آن را دوست دارند، آن را دوست دارند و رسانه های اجتماعی را با ستایش ماسک و خلقت او پر کرده اند. فراتر از سود، استارلینک منبع حیاتی نفوذ و قدرت نرمی را نیز برای ماسک"}, {"source": "Business Insider", "title": "The Singapore government has entered the dating chat", "link": "https://www.businessinsider.com/singapore-dating-scene-singles-matchmaker-government-algorithm-2026-10", "summary": "Singapore just launched a matchmaking service for government workers. Rawpixel/Getty Images Singapore is testing a government-backed matchmaking service for public officers aged 21 to 35. Three Singapore singles, who aren't part of the pilot, told Business Insider what dating in the city-state is like. Across Asia, governments are trying AI, events, and financial incentives to help people pair up. Singapore's government is trying to play matchmaker for its own workforce. FirstDate, a pilot for eligible public officers ages 21 to 35, uses an algorithm to introduce potential matches. Singapore's public service employs about 158,000 people — roughly four-fifths the size of Google's global workforce. It's an attempt to make dating a little bit easier in a country confronting a record-low fertility rate of 0.87 in 2025. Singapore singles have no shortage of ways to meet people. Alongside apps like Tinder, Hinge, and Coffee Meets Bagel , there are also local matchmaking services such as Kopi Date, which sets up one-on-one coffee meetups, as well as dating agencies including Lunch Actually and GaiGai. For many, finding a partner can have implications beyond romance. Almost 80% of Singapore residents live in public housing , known as HDB flats. Single citizens generally must be 35 to apply to buy one on their own. In a household survey published in November 2025, 66.3% of never-married citizens ages 21 to 34 said they lived with immediate family. GovTech, the government agency running the pilot, declined to share further details with Business Insider. It told The Straits Times that no decision had been made on whether to launch or expand the service beyond the pilot. Applications for the first round closed on Monday, and signups for the next cycle open on October 20. FirstDate, which grew out of a company hackathon, uses a Nobel-prize-winning framework called the Gale-Shapley algorithm to generate potential pairings based on participants' questionnaire responses. Business Insider spoke with three singles in Singapore — who aren't part of the pilot — about what it's like to date in the city-state. Their experiences reflect the tension many navigate while dating: practical expectations alongside the hope of a genuine connection. Tan Jie Hao, 26 Tan Jie Hao has tried dating apps and even joined a dating show. Provided by Tan Jie Hao. Tan Jie Hao, 26, has tried dating apps, singles mixers , and even a dating show. But he says he's comfortable remaining single unless h", "date_str": "2026-10-06T07:25:21+00:00", "hash": "f29e6104904adc89", "title_fa": "دولت سنگاپور وارد چت دوستیابی شده است", "summary_fa": "سنگاپور به تازگی یک سرویس خواستگاری برای کارکنان دولتی راه اندازی کرده است. Rawpixel/Getty Images سنگاپور در حال آزمایش یک سرویس همسریابی تحت حمایت دولت برای افسران عمومی 21 تا 35 ساله است. سه مجرد سنگاپور که بخشی از خلبان نیستند، به Business Insider گفتند که قرار ملاقات در ایالت شهر چگونه است. در سرتاسر آسیا، دولت‌ها از هوش مصنوعی، رویدادها و مشوق‌های مالی برای کمک به افراد در جفت شدن استفاده می‌کنند. دولت سنگاپور در تلاش است تا برای نیروی کار خود خواستگاری کند. FirstDate، آزمایشی برای افسران عمومی واجد شرایط 21 تا 35 ساله، از الگوریتمی برای معرفی موارد بالقوه استفاده می کند. خدمات عمومی سنگاپور حدود 158000 نفر را استخدام می کند - تقریباً چهار پنجم نیروی کار جهانی گوگل. این تلاشی است برای آسان‌تر کردن دوستیابی در کشوری که با نرخ باروری پایین 0.87 در سال 2025 مواجه است. مجردهای سنگاپور هیچ کمبودی برای ملاقات با مردم ندارند. در کنار برنامه‌هایی مانند Tinder، Hinge، و Coffee Meets Bagel، سرویس‌های خواستگاری محلی مانند Kopi Date نیز وجود دارد که جلسات قهوه را یک به یک راه‌اندازی می‌کند، و همچنین آژانس‌های دوستیابی از جمله Lunch Actually و GaiGai. برای بسیاری، یافتن شریک زندگی می تواند پیامدهایی فراتر از روابط عاشقانه داشته باشد. تقریبا 80 درصد از ساکنان سنگاپور در خانه های عمومی زندگی می کنند که به عنوان آپارتمان HDB شناخته می شود. شهروندان مجرد معمولاً باید 35 سال داشته باشند تا بتوانند به تنهایی اقدام به خرید کنند. در یک نظرسنجی خانگی که در نوامبر 2025 منتشر شد، 66.3 درصد از شهروندان 21 تا 34 ساله که هرگز ازدواج نکرده‌اند، گفتند که با خانواده نزدیک خود زندگی می‌کنند. GovTech، آژانس دولتی اجرای آزمایشی، از به اشتراک گذاشتن جزئیات بیشتر با Business Insider خودداری کرد. به استریتس تایمز گفت که هیچ تصمیمی در مورد راه اندازی یا گسترش"}, {"source": "Business Insider", "title": "UFC CEO Dana White says it's 'impossible' to build a successful business while working from home", "link": "https://www.businessinsider.com/ufc-ceo-dana-white-entrepreneurship-work-from-home-career-2026-10", "summary": "UFC CEO Dana White said people who want to protect their free time are better suited to a 9-to-5 than entrepreneurship. Mike Roach/Zuffa LLC Dana White said he doesn't believe successful businesses can be built by working remotely. The UFC CEO said managing a company means tackling new demands at any time of day. He also said aspiring entrepreneurs often get one thing wrong about working for themselves. UFC CEO Dana White said the dream of flexible hours is a trap for aspiring entrepreneurs. Speaking to Steve Bartlett on Monday's episode of \" The Diary of a CEO \" podcast, White spoke about why he doesn't believe that a successful business could be built by working from home. \"It's impossible. You can't do it. I'm in the office from 8:30 in the morning, and I don't leave the office till 7, 8, 9, 10 sometimes,\" White said. Even on days when his schedule was fully planned, spontaneous conversations with colleagues could surface new issues, spark ideas, and change the course of his day. \"A lot of good ideas come from everybody being at work,\" White added. White said entrepreneurship is a poor fit for anyone whose priority is protecting their free time, because business demands can arise at any time. \"There is no such thing as a day off when you run your own business. There are no birthdays, there's no Christmas, there's no Thanksgiving,\" White said. Running a business means dealing with a fresh set of problems every day, \"but when you like what you do, it's fun,\" he added. White said he believed many young people have the wrong idea about what entrepreneurship involves. \"'You know, I'd really like to work for myself, and own my own business because I'd love to plan my schedule.' Oh, you're going the wrong way,\" White said. \"What you need to do is find a 9-to-5 job where you have weekends and holidays off. That's your move.\" White has pushed back on the idea that entrepreneurship offers an easier, more flexible life in past interviews. He said in a March 2024 appearance on the \"Lex Fridman Podcast\" that he works \"just as hard now\" as he did when he was starting out. In a May 2024 appearance on the \" In Search of Excellence \" podcast, White said that entrepreneurs who want their businesses to succeed must be prepared to become \"a slave\" to the company in the early years. Other business leaders have also pushed back on remote work. Skims cofounder Emma Grede , for example, has said that working from home is \"career suicide.\" Jason Lemkin — also known as the \"Godf", "date_str": "2026-10-06T06:45:21+00:00", "hash": "d5c312a4dd45b246", "title_fa": "دانا وایت، مدیر عامل UFC می گوید ایجاد یک کسب و کار موفق در حالی که از خانه کار می کنید، غیرممکن است.", "summary_fa": "مدیر عامل UFC، دانا وایت، گفت افرادی که می خواهند از اوقات فراغت خود محافظت کنند، برای کارآفرینی مناسب ترند. Mike Roach/Zuffa LLC دانا وایت گفت که او معتقد نیست کسب و کارهای موفق با کار از راه دور ایجاد می شوند. مدیر عامل UFC گفت که مدیریت یک شرکت به معنای رسیدگی به خواسته های جدید در هر زمانی از روز است. او همچنین گفت که کارآفرینان مشتاق اغلب در مورد کار کردن برای خود یک چیز اشتباه می کنند. مدیر عامل UFC، دانا وایت، گفت که رویای ساعات کاری انعطاف پذیر تله ای برای کارآفرینان مشتاق است. وایت در اپیزود روز دوشنبه پادکست «خاطرات یک مدیر عامل» با استیو بارتلت صحبت کرد و درباره اینکه چرا معتقد نیست با کار کردن در خانه می توان یک کسب و کار موفق را ساخت. وایت گفت: \"غیرممکن است. شما نمی توانید این کار را انجام دهید. من از ساعت 8:30 صبح در دفتر هستم و گاهی اوقات تا ساعت 7، 8، 9، 10 دفتر را ترک نمی کنم.\" حتی در روزهایی که برنامه او کاملاً برنامه‌ریزی شده بود، گفتگوهای خودجوش با همکاران می‌توانست مسائل جدیدی را آشکار کند، ایده‌ها را جرقه بزند و مسیر روز او را تغییر دهد. وایت افزود: بسیاری از ایده های خوب از هر کسی که در محل کار است نشات می گیرد. وایت گفت که کارآفرینی برای هر کسی که اولویتش حفاظت از اوقات فراغت است مناسب نیست، زیرا خواسته های کسب و کار ممکن است در هر زمانی مطرح شود. وایت گفت: \"هیچ روزی به نام تعطیلی زمانی که کسب و کار خود را اداره می کنید، وجود ندارد. نه تولدی وجود دارد، نه کریسمس، نه روز شکرگزاری.\" او اضافه کرد که اداره یک کسب و کار به این معناست که هر روز با مجموعه جدیدی از مشکلات دست و پنجه نرم کنید، \"اما"}, {"source": "Business Insider", "title": "What is Beam? The buzzy American AI model being called the 'DeepSeek of the West'", "link": "https://www.businessinsider.com/what-is-beam-american-ai-model-deepseek-of-the-west-2026-10", "summary": "Reflection AI is a New York-based AI lab. kolderal/Getty Images Reflection AI's first model is here. Beam is a text-based model designed for coding and reasoning tasks. Beam is being seen as a competitive Western alternative to open weight models. A New York AI startup founded by two former Google DeepMind researchers has released its first major model — and is pitching it as a homegrown answer to China's increasingly powerful open AI systems. Reflection AI on Monday unveiled Beam, an \"open-weight\" model designed for coding, reasoning, and AI-agent tasks. The company says it rivals some of China's leading open models while using far less computing power. Here's what to know. What is Beam? Beam is Reflection AI's first frontier open-weight model. Open-weight means developers can download the model's parameters, run them on their own hardware, and modify or fine-tune them for specific use cases. That is an alternative to using models from companies such as OpenAI and Anthropic, which are generally accessed via their own Application Programming Interfaces (APIs). Reflection says Beam, a text-only model, has 501 billion total parameters, but activates only 23 billion at a time — a design intended to make it cheaper and faster to operate. The model can handle coding, multi-step reasoning, and other agentic work. For now, Beam is in final safety testing and available through a waitlist. Reflection says it will release the model's weights, a technical report, and developer tools later this month. Who is behind Beam? Reflection was founded in 2024 by Misha Laskin and Ioannis Antonoglou, both former DeepMind researchers. \"The only way to own intelligence is, by definition, if it's open — because if it's open, you can run it on your stuff, you can own it, you can control it, you can customize it,\" Laskin, the CEO, said in a podcast released on Monday. The startup has raised billions of dollars and is backed by investors including Nvidia, Sequoia , and Citigroup. In June, it confirmed a funding round at a $25 billion pre-money valuation. How does Beam compare? Reflection said Beam is competitive with Z.ai's GLM-5.2 on coding and agentic tasks, and is approaching Alibaba's Qwen 3.8-Max. It said that Moonshot AI's Kimi K3 remains ahead on raw capability. The startup is pitching itself on efficiency. It said Beam can achieve results comparable to GLM-5.2 on advanced reasoning benchmarks while using three to four times less inference compute — the processing required for", "date_str": "2026-10-06T06:31:01+00:00", "hash": "5428e74a0b981053", "title_fa": "پرتو چیست؟ مدل پرهیاهوی هوش مصنوعی آمریکایی که \"DeepSeek of the West\" نامیده می شود", "summary_fa": "Reflection AI یک آزمایشگاه هوش مصنوعی مستقر در نیویورک است. اولین مدل هوش مصنوعی kolderal/Getty Images Reflection در اینجا آمده است. Beam یک مدل مبتنی بر متن است که برای کارهای کدنویسی و استدلال طراحی شده است. Beam به عنوان یک جایگزین رقابتی غربی برای مدل های وزن باز دیده می شود. یک استارت آپ هوش مصنوعی نیویورکی که توسط دو محقق سابق گوگل دیپ مایند تأسیس شده بود، اولین مدل اصلی خود را منتشر کرد – و آن را به عنوان پاسخی خانگی به سیستم‌های هوش مصنوعی باز قدرتمند چین ارائه می‌کند. Reflection AI روز دوشنبه Beam را معرفی کرد، مدلی با وزن باز که برای کدنویسی، استدلال و وظایف عامل هوش مصنوعی طراحی شده است. این شرکت می‌گوید با برخی از مدل‌های باز پیشرو چین رقابت می‌کند و در عین حال از قدرت محاسباتی بسیار کمتری استفاده می‌کند. در اینجا چیزی است که باید بدانید. پرتو چیست؟ Beam اولین مدل با وزن باز و مرزی Reflection AI است. وزن باز به این معنی است که توسعه دهندگان می توانند پارامترهای مدل را دانلود کنند، آنها را بر روی سخت افزار خود اجرا کنند و آنها را برای موارد استفاده خاص اصلاح یا تنظیم کنند. این جایگزینی برای استفاده از مدل‌های شرکت‌هایی مانند OpenAI و Anthropic است که عموماً از طریق رابط‌های برنامه‌نویسی کاربردی (API) خود به آن‌ها دسترسی دارند. Reflection می‌گوید Beam، یک مدل فقط متنی، دارای 501 میلیارد پارامتر کل است، اما تنها 23 میلیارد پارامتر را در یک زمان فعال می‌کند – طراحی برای ارزان‌تر و سریع‌تر کردن کارکرد آن. این مدل می‌تواند کدنویسی، استدلال چند مرحله‌ای و سایر کارهای عاملی را انجام دهد. در حال حاضر، Beam در تست ایمنی نهایی است و از طریق لیست انتظار در دسترس است. Reflection می‌گوید وزن‌های مدل، گزارش فنی و ابزارهای توسعه‌دهنده را اواخر این ماه منتشر خواهد"}, {"source": "Business Insider", "title": "Best streaming services (2026)", "link": "https://www.businessinsider.com/guides/streaming/best-streaming-services", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Netflix; Disney+; Apple TV; Amazon Prime Video; Disney+; Jenny Chang-Rodriguez/Business Insider It might be hard to remember, but there was once a time when must-have streaming services started and ended with Netflix and Hulu. Now, there's a seemingly endless array of apps to choose from, which can be both helpful and overwhelming. Our team is here to help you find the best streaming services for your household's needs. Every streaming platform brings something different to the table. HBO Max and Apple TV top the charts when it comes to critically acclaimed original programming, while Peacock is by far the best platform for fans of reality TV. Disney Plus is an irreplaceable service for families and fans of Star Wars and Marvel, while ESPN has becom ماه هستند."}, {"source": "Business Insider", "title": "Elon Musk is a trillionaire again", "link": "https://www.businessinsider.com/elon-musk-regains-trillionaire-status-spacex-stock-price-rise-2026-10", "summary": "Elon Musk is once again a trillionaire, a title he first held briefly in June after the SpaceX IPO. Finn Gomez/Getty Images Elon Musk has regained his trillionaire status thanks to a boost in SpaceX's stock price. Musk became the world's first trillionaire after the SpaceX IPO, but the stock price later fell. The stock price has rebounded, along with Musk's net worth. Elon Musk has regained his title as the world's only trillionaire. The Tesla CEO made history earlier this year by becoming the first person worth 13 figures after SpaceX's blockbuster initial public offering in June. Musk's wealth came back down a little closer to Earth after SpaceX's stock price fell following an initial surge. The rocket and AI company's stock price has been creeping back up since early August, reaching $171.09 as of Monday's market close. The nearly 8% boost on Monday brought Musk's net worth back over the trillion-dollar threshold, according to Forbes, which estimated his wealth at $1.046 trillion. Musk's wealth previously peaked on June 16 at $1.32 trillion, according to the Bloomberg Billionaires Index. While Musk had long been counted among the richest people in the world, the SpaceX IPO put him in another stratosphere. The second- and third-wealthiest people in the world as of Monday were Amazon founder Jeff Bezos and Google cofounder Larry Page, worth $371 billion and $284 billion, respectively, according to Forbes. Much of Musk's net worth comes from stakes in SpaceX and Tesla, so it is typically tied to the success of those companies. SpaceX's stock reached its highest level since June on Monday. Read the original article on Business Insider", "date_str": "2026-10-06T00:39:23+00:00", "hash": "3db457304c86a0bd", "title_fa": "ایلان ماسک دوباره یک تریلیونر شد", "summary_fa": "ایلان ماسک بار دیگر یک تریلیونر شد، عنوانی که برای اولین بار در ژوئن پس از عرضه اولیه اولیه اسپیس ایکس به آن دست یافت. فین گومز/گتی ایماژ ایلان ماسک به لطف افزایش قیمت سهام اسپیس ایکس، وضعیت تریلیونر خود را بازیافت. ماسک پس از عرضه اولیه سهام SpaceX به اولین تریلیونر جهان تبدیل شد، اما قیمت سهام بعداً کاهش یافت. قیمت سهام همراه با ارزش خالص ماسک افزایش یافته است. ایلان ماسک عنوان تنها تریلیونر جهان را دوباره به دست آورد. مدیرعامل تسلا در اوایل سال جاری با تبدیل شدن به اولین نفر با ارزش 13 رقمی پس از عرضه اولیه عمومی پرفروش اسپیس ایکس در ماه ژوئن، تاریخ ساز شد. ثروت ماسک پس از کاهش قیمت سهام اسپیس ایکس در پی افزایش اولیه، اندکی به زمین نزدیک شد. قیمت سهام شرکت موشک و هوش مصنوعی از اوایل آگوست افزایش یافته است و تا پایان بازار روز دوشنبه به 171.09 دلار رسیده است. بر اساس گزارش فوربس که ثروت او را 1.046 تریلیون دلار تخمین زد، افزایش تقریبا 8 درصدی در روز دوشنبه، ارزش خالص ماسک را از آستانه تریلیون دلاری بازگرداند. بر اساس شاخص میلیاردرهای بلومبرگ، ثروت ماسک قبلا در 16 ژوئن به 1.32 تریلیون دلار رسیده بود. در حالی که ماسک مدت‌ها در میان ثروتمندترین افراد جهان به حساب می‌آمد، عرضه اولیه سهام SpaceX او را در یک استراتوسفر دیگر قرار داد. طبق گزارش فوربس، جف بزوس، بنیانگذار آمازون و لری پیج، بنیانگذار گوگل، دومین و سومین ثروتمندترین افراد جهان تا روز دوشنبه، به ترتیب با ثروت 371 میلیارد و 284 میلیارد دلار بودند. بیشتر دارایی خالص ماسک از سهام اسپیس ایکس و تسلا به دست می آید، بنابراین معمولاً با موفقیت آن شرکت ها مرتبط است. سهام SpaceX روز دوشنبه به بالاترین سطح خود از ژوئن رسید. مقاله اصلی را در Business Insider بخوانید"}, {"source": "Business Insider", "title": "Google just got a boost in its bid to buy Spirit Airlines’ data for AI training", "link": "https://www.businessinsider.com/google-bid-spirit-airlines-data-ai-boost-official-recommended-approval-2026-10", "summary": "Google s bid to buy Spirit Airlines old data has been challenged by unions representing flight attendants and pilots. Michael Nagle/Bloomberg via Getty Images Google just got a win in its bid to buy Spirit Airlines' old data for $10 million. A court-appointed consumer privacy ombudsman recommended the sale be approved. The official said the companies had addressed consumer privacy concerns. Google just got a win in its effort to buy Spirit Airlines' old data . A court-appointed consumer privacy official recommended the sale be approved in a filing on Monday, citing steps taken by Spirit and Google to address risks to passenger privacy. \"The parties have taken consequential steps to protect the privacy of the personal data of the Spirit consumers,\" Lucy Thomson, the consumer privacy ombudsman, said. The filing said the companies revised the scope of personal consumer data included in the sale, excluded passenger databases, and hired a third party, Tonic.ai, to conduct de-identification of data that could contain consumers' personal information, such as company emails. \"These changes will significantly reduce the potential risk of harm to the 97 million consumers who provided their personal data to Spirit for the purpose of booking airline travel,\" the filing said, adding that any risk of privacy losses to consumers had been \"eliminated or mitigated.\" After Spirit Airlines shut down in May, Google won an auction for its data with a $10 million bid. The sale still requires court approval. Google has said the data would help improve its products and AI models. Unions representing Spirit flight attendants and pilots have filed objections to the sale, saying it would undermine their privacy. The union that represents American Airlines pilots , including some 700 who formerly worked for Spirit, joined the objection in a filing last week, arguing the sale could hinder aviation safety. A representative for Spirit did not provide additional comment when reached by Business Insider. Google did not respond to a request for comment. The company previously said that personally identifying information would not be included in the sale. \"Google is not buying any
