<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۳ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۳ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۴ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۲۰:۲۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۳۸</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۶۷</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۵۴</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

ps://www.bbc.com/persian/articles/c920x1pmy452o?at_medium=RSS&at_campaign=rss", "summary": "شهر مادرید پایتخت اسپانیا میزبان چهارمین دور نشست سالیانهٔ « صدای ما را بشنوید» با هدف بررسی وضعیت زنان افغان است. شعار امسال این نشست «دستیابی به عدالت و صلح از طریق حساب‌دهی» اعلام شده است. خوزه مانوئل آلبارس وزیر خارجه اسپانیا و میزبان اصلی این نشست در سخنرانی اش گفت که پنج سال پس از حاکمیت دوباره طالبان « وضعیت زنان در این کشور همچنان یکی از جدی‌ترین بحران‌های حقوق بشری این دوره است و افغانستان به آشکارترین نمونه‌ای نقض حقوق زنان و حقوق بشر مبدل شده است.»", "date_str": "2026-11-23T16:24:48+00:00", "hash": "a3cf5c2a90409de5", "title_fa": "اسپانیا: حکومت طالبان را هرگز به رسمیت نخواهیم شناخت", "summary_fa": "شهر مادرید پایتخت اسپانیا میزبان چهارمین دور نشست سالیانهٔ « صدای ما را بشنوید» با هدف بررسی وضعیت زنان افغان است. شعار امسال این نشست «دستیابی به عدالت و صلح از طریق حساب‌دهی» اعلام شده است. خوزه مانوئل آلبارس وزیر خارجه اسپانیا و میزبان اصلی این نشست در سخنرانی اش گفت که پنج سال پس از حاکمیت دوباره طالبان « وضعیت زنان در این کشور همچنان یکی از جدی‌ترین بحران‌های حقوق بشری این دوره است و افغانستان به آشکارترین نمونه‌ای نقض حقوق زنان و حقوق بشر مبدل شده است.» خوزه مانوئل آلبارس، وزیر خارجه اسپانیا، در سخنانی گفت که کشورش هیچگاه طالبان را به رسمیت نخواهد شناخت. آقای آلبارس این اظهارات را در نشست که دربخصوص وضعیت زنان در افغانستان در مادرید، پایتخت اسپانیا، برگزار شده بود اظهار کرد. در این نشست با میزبانی وزارت خارجه اسپانیا حدود ۷۰ فعال حقوق زن، نمایندگان جامعهٔ مدنی، دیپلمات‌ها و هیئتی از ملل متحد حضور دارند. او وضعیت زنان و دختران افغانستان را نمادی از «آپارتاید جنسیتی» توصیف کرد و گفت هیچ کشوری با حذف نیمی از جمعیت‌اش، نمی‌تواند آینده‌اش را بسازد. دیپلمات ارشد اسپانیا همچنین گفت که در پنج سال گذشته دنیا شاهد «تبعیض و خشونت» در برابر زنان و دختران افغانستان بوده، زنان و دخترانی که به گفته او از درس، کار، حضور سیاسی و آزادی در گشت و گذار و آزادی بیان محروم شده‌اند. آقای آلبارس گفت: «با نشست امروز می‌خواهیم [به طالبان] بگوییم که شما موفق نشده‌اید. زنان و دختران افغان با صدا، حضور و وقت‌شان در اینجا حضور دارند.» وزیر خارجه اسپانیا تأکید کرد که «ما طالبان را به رسمیت نمی‌شناسیم و نخواهیم شناخت.» و افزود که « ما هرگز نمی‌توانیم حقوق زنان را به عنوان عامل چانه‌زنی برای منافع سیاسی، اقتصادی و مهاجرتی بپذیریم.» فوزیه کوفی رئیس نهاد موسوم به «زنان برای افغانستان» و یکی از برگزارکنندگان", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/0dbd/live/465817c0-e759-11f1-b407-33329b1ec67a.jpg", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲ آذر • ۱۹:۵۴"}, {"source": "BBC Persian", "title": "آکسفام: حملات اسرائیل غزه را به «سرزمینی آلوده و غیرقابل زیست» تبدیل کرده است", "link": "https://www.bbc.com/persian/articles/cqglre1g71n7o?at_medium=RSS&at_campaign=rss", "summary": "این گزارش می‌گوید در نتیجه اقدامات اسرائیل، در تقریبا سراسر غزه نشانه‌هایی از آلودگی احتمالی زیست‌محیطی مشاهده می‌شود.", "date_str": "2026-11-23T16:10:23+00:00", "hash": "63e6620089f5b202", "title_fa": "آکسفام: حملات اسرائیل غزه را به «سرزمینی آلوده و غیرقابل زیست» تبدیل کرده است", "summary_fa": "این گزارش می‌گوید در نتیجه اقدامات اسرائیل، در تقریبا سراسر غزه نشانه‌هایی از آلودگی احتمالی زیست‌محیطی مشاهده می‌شود. گزارشی تازه از سازمان غیرانتفاعی آکسفام می‌گوید غزه به «سرزمینی آلوده و غیرقابل زیست» تبدیل شده است و بیش از ۹۹ درصد زمین‌های فلسطینیان، نشانه‌هایی از آلودگی زیست‌محیطی ناشی از حملات نظامی اسرائیل را در خود دارد. این گزارش می‌گوید فلزات سنگین، بقایای مواد منفجره، آزبست برجای‌مانده از ساختمان‌های ویران‌شده، دیوکسین‌ها و آلودگی‌های زیستی موجود در هوا، خاک و منابع آب، اکنون فلسطینی‌ها را تهدید می‌کنند و ممکن است این تهدید دهه‌ها ادامه داشته باشد. آمیتاب بهار، مدیر اجرایی آکسفام اینترنشنال، اسرائیل را متهم می‌کند که در چارچوب «نسل‌کشیِ در حال وقوع در غزه»، مرتکب «جنایت‌های جنگی زیست‌محیطی» شده است. او می‌گوید: «ویرانی و آلودگی غزه به‌شکلی بنیادین شرایط زیست‌محیطی لازم برای امنیت و بقای انسان را از میان برده است.» از دولت اسرائیل خواسته شده است به این گزارش واکنش نشان دهد. اسرائیل در پرونده‌ای که همچنان در دیوان بین‌المللی دادگستری در جریان است، اتهام‌های مربوط به نسل‌کشی را بی‌اساس و تحریف‌شده دانسته و رد کرده است. اسرائیل تاکید می‌کند که عملیات نظامی‌اش در غزه اقدامی برای دفاع از خود در برابر حماس و در واکنش به حمله مرگبار این گروه به اسرائیل در ۷ اکتبر ۲۰۲۳ (۱۵ مهر ۱۴۰۲) است و می‌گوید برای کاهش آسیب به غیرنظامیان اقداماتی انجام می‌دهد. آکسفام و «مرکز پایش منازعه و محیط زیست» مستقر در بریتانیا، با استفاده از تصاویر ماهواره‌ای، سنجش از دور، تحلیل فضایی و دیگر داده‌های متن‌باز به این نتیجه‌گیری‌ها رسیده‌اند. این یافته‌ها در جامع‌ترین گزارش منتشرشده تاکنون درباره پیامدهای شدید زیست‌محیطی ناشی از سه سال جنگ شدید در غزه ارائه شده است. این گزارش شرح می‌دهد که مهمات به‌کاررفته در بمباران گسترده اسرائیل، و همچنین آوار برجای‌مانده از ساختمان‌ها و زیرساخت‌های ویران‌شده، همگی بر محیط زیست تاثیر می‌گذارند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/810a/live/c0542f80-e73d-11f1-99a1-253766e7ad8b.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۲ آذر • ۱۹:۴۰"}, {"source": "Iran International", "title": "نتانیاهو در مخالفت با آیزنکوت: تهدید جمهوری اسلامی فوری است", "link": "https://www.iranintl.com/202611238873", "summary": "نخست‌وزیر اسرائیل تهدید جمهوری اسلامی علیه این کشور را «فوری» خواند. گادی آیزنکوت، نماینده کنست و رییس حزب «یاشار»، گفته بود تهدیدی نمی‌بیند که اقدام نظامی را پیش از تشکیل دولت جدید، ضروری کند. هم‌زمان رییس پیشین موساد خواستار آغاز جنگی تازه علیه جمهوری اسلامی شد.", "date_str": "2026-11-23T15:43:56+00:00", "hash": "b77034a7d6ec3474", "title_fa": "نتانیاهو در مخالفت با آیزنکوت: تهدید جمهوری اسلامی فوری است", "summary_fa": "نخست‌وزیر اسرائیل تهدید جمهوری اسلامی علیه این کشور را «فوری» خواند. گادی آیزنکوت، نماینده کنست و رییس حزب «یاشار»، گفته بود تهدیدی نمی‌بیند که اقدام نظامی را پیش از تشکیل دولت جدید، ضروری کند. هم‌زمان رییس پیشین موساد خواستار آغاز جنگی تازه علیه جمهوری اسلامی شد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/16763b0fdf7f2f4f384e72827fdd7ca1bc0bac5b-800x544.jpg?rect=0,62,800,420&w=1200&h=630&q=66&fit=max&auto=format", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲ آذر • ۱۹:۱۳"}, {"source": "Radio Farda", "title": "جِنسن هوانگ به عنوان رئیس و مدیر انویدیا برگشت؛ سهام شرکت بیش از ۳۰ درصد جهش کرد", "link": "https://www.radiofarda.com/a/nvidia-reinstates-jensen-huang-as-ceo/33904175.html", "summary": "هیئت مدیرۀ شرکت انویدیا اعلام کرد که جنسن هوانگ را در سمت رئیس و مدیر عامل این غول تراشه‌های هوش مصنوعی ابقا می‌کند؛ موضوعی که با استقبال دونالد ترامپ و بازار سهام روبرو شد.", "date_str": "2026-11-23T14:51:20+00:00", "hash": "06060d482d7efa26", "title_fa": "جِنسن هوانگ به عنوان رئیس و مدیر انویدیا برگشت؛ سهام شرکت بیش از ۳۰ درصد جهش کرد", "summary_fa": "هیئت مدیرۀ شرکت انویدیا اعلام کرد که جنسن هوانگ را در سمت رئیس و مدیر عامل این غول تراشه‌های هوش مصنوعی ابقا می‌کند؛ موضوعی که با استقبال دونالد ترامپ و بازار سهام روبرو شد. هیئت مدیرۀ «اِنویدیا»، غول فناوری و تراشه‌های پیشرفتۀ هوش مصنوعی، روز دوشنبه دوم آذر جنسن هوانگ را به عنوان رئیس، مدیر عامل و رئیس هیئت مدیره ابقا کرد. در بیانیۀ این شرکت تصریح شده که اعضای هیئت مدیره، یک‌صدا به بازگشت جنسن هوانگ به مدیریت شرکت رأی داده و تأکید کرده‌اند که این اقدام هیچ‌گونه خطری برای امنیت ملی ایجاد نخواهد کرد. این بیانیه در عین حال تأکید می‌کند که کمیته‌ای پیرامون تلاش‌ نهادهای اطلاعاتی خارجی برای هدف قرار دادن جنسن هوانگ تشکیل خواهد داد. اعضای هیئت مدیره افزودند که این شرکت به همکاری با تحقیقات دولتی در این زمینه ادامه خواهد داد. جنسن هوانگ بیش از ۳۰ سال در سمت ریاست این شرکت حضور داشته و نقش بسیار پررنگی در رشد و توسعۀ آن داشته است. با وجود این، آقای هوانگ ماه گذشته در پی افشای رابطۀ خارج از ازدواجش با یک زن بازرگان چینی، که برخی منابع، احتمال جاسوس‌بودنش را مطرح کرده بودند، از سمت‌های مدیریتی‌اش در انویدیا کناره‌گیری کرده بود. مدتی بعد، اما دربارۀ جاسوس‌بودن زنی که با آقای هوانگ رابطۀ عاطفی داشته، تردیدهایی مطرح شد و حتی دونالد ترامپ، رئیس‌جمهور ایالات متحده، هم تأکید کرد که سند و مدرکی، حاکی از جاسوسی او ندیده است. دونالد ترامپ در آستانۀ سفر هفتۀ گذشتۀ خود به شنژن برای شرکت در نشست ", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۱۸:۴۶"}, {"source": "BBC Persian", "title": "هیئت مدیره انویدیا بار دیگر جنسن هوانگ را به سمت مدیرعاملی منصوب کرد", "link": "https://www.bbc.com/persian/articles/cjlydn1w35v5o?at_medium=RSS&at_campaign=rss", "summary": "هیئت‌‌مدیره انویدیا، جنسن هوانگ را به سمت مدیرعامل و رئیس این شرکت بازگرداند. بر اساس بیانیه‌ای که در وب‌سایت انویدیا منتشر شده است، هیئت‌مدیره به اتفاق آرا به بازگرداندن جنسن هوانگ رأی داد. در این بیانیه آمده است: «هیئت‌مدیره بر این باور است که جنسن فرد مناسبی برای رهبری انویدیاست و بازگشت او به این سمت، به نفع سهامداران، کارکنان، شرکا و مشتریان ماست.»", "date_str": "2026-11-23T15:13:36+00:00", "hash": "6878e60e482f6c84", "title_fa": "هیئت مدیره انویدیا بار دیگر جنسن هوانگ را به سمت مدیرعاملی منصوب کرد", "summary_fa": "هیئت‌‌مدیره انویدیا، جنسن هوانگ را به سمت مدیرعامل و رئیس این شرکت بازگرداند. بر اساس بیانیه‌ای که در وب‌سایت انویدیا منتشر شده است، هیئت‌مدیره به اتفاق آرا به بازگرداندن جنسن هوانگ رأی داد. در این بیانیه آمده است: «هیئت‌مدیره بر این باور است که جنسن فرد مناسبی برای رهبری انویدیاست و بازگشت او به این سمت، به نفع سهامداران، کارکنان، شرکا و مشتریان ماست.» انویدیا، شرکت تولیدکننده تراشه‌های هوش مصنوعی، کمتر از دو هفته پس از آنکه جنسن هوانگ، مدیرعامل این شرکت به دلیل گزارش‌هایی مبنی بر رابطه با یک زن مظنون به جاسوسی برای چین مجبور به استعفا شد، او را به سمت خود بازگرداند. آقای هوانگ گفت که از بازگشت به سمت خود مفتخر است. انویدیا از سوی دونالد ترامپ تحت فشار قرار گرفته بود تا او را به سمت خود بازگرداند و رئیس‌جمهور آمریکا پس از انتشار این خبر از تصمیم هیئت مدیره تمجید کرد. ارزش سهام این غول فناوری که پس از استعفای جنسن هوانگ صدها میلیارد دلار کاهش یافته بود، پس از انتصاب مجدد او، با باز شدن بازارها به شدت افزایش یافت. آقای هوانگ که در پی جنجال‌های مربوط به رابطه‌اش با یک زن مشکوک به جاسوسی برای چین از مدیرعاملی انویدیا کنار رفته بود، با انتشار بیانیه‌ای از این تصمیم اسنتقبال کرد: «مفتخرم که به انویدیا بازمی‌گردم تا در آغاز یک انقلاب صنعتی جدید، هدایت یکی از تأثیرگذا ی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه"], "datetime_fa": "۲ آذر • ۱۸:۱۲"}, {"source": "Radio Farda", "title": "جِنسن هوانگ به عنوان رئیس و مدیر انویدیا برگشت؛ سهام شرکت ۳۰ درصد جهش کرد", "link": "https://www.radiofarda.com/a/nvidia-reinstates-jensen-huang-as-ceo/33904175.html", "summary": "هیئت مدیرۀ شرکت انویدیا اعلام کرد که جنسن هوانگ را در سمت رئیس و مدیر عامل این غول تراشه‌های هوش مصنوعی ابقا می‌کند؛ موضوعی که با استقبال دونالد ترامپ و بازار سهام روبرو شد.", "date_str": "2026-11-23T14:51:20+00:00", "hash": "4d980f4a1ae59ce0", "title_fa": "جِنسن هوانگ به عنوان رئیس و مدیر انویدیا برگشت؛ سهام شرکت ۳۰ درصد جهش کرد", "summary_fa": "هیئت مدیرۀ شرکت انویدیا اعلام کرد که جنسن هوانگ را در سمت رئیس و مدیر عامل این غول تراشه‌های هوش مصنوعی ابقا می‌کند؛ موضوعی که با استقبال دونالد ترامپ و بازار سهام روبرو شد. هیئت مدیرۀ «اِنویدیا»، غول فناوری و تراشه‌های پیشرفتۀ هوش مصنوعی، روز دوشنبه دوم آذر جنسن هوانگ را به عنوان رئیس، مدیر عامل و رئیس هیئت مدیره ابقا کرد. در بیانیۀ این شرکت تصریح شده که اعضای هیئت مدیره، یک‌صدا به بازگشت جنسن هوانگ به مدیریت شرکت رأی داده و تأکید کرده‌اند که این اقدام هیچ‌گونه خطری برای امنیت ملی ایجاد نخواهد کرد. این بیانیه در عین حال تأکید می‌کند که کمیته‌ای پیرامون تلاش‌ نهادهای اطلاعاتی خارجی برای هدف قرار دادن جنسن هوانگ تشکیل خواهد داد. اعضای هیئت مدیره افزودند که این شرکت به همکاری با تحقیقات دولتی در این زمینه ادامه خواهد داد. جنسن هوانگ بیش از ۳۰ سال در سمت ریاست این شرکت حضور داشته و نقش بسیار پررنگی در رشد و توسعۀ آن داشته است. با وجود این، آقای هوانگ ماه گذشته در پی افشای رابطۀ خارج از ازدواجش با یک زن بازرگان چینی، که برخی منابع، احتمال جاسوس‌بودنش را مطرح کرده بودند، از سمت‌های مدیریتی‌اش در انویدیا کناره‌گیری کرده بود. مدتی بعد، اما دربارۀ جاسوس‌بودن زنی که با آقای هوانگ رابطۀ عاطفی داشته، تردیدهایی مطرح شد و حتی دونالد ترامپ، رئیس‌جمهور ایالات متحده، هم تأکید کرد که سند و مدرکی، حاکی از جاسوسی او ندیده است. دونالد ترامپ در آستانۀ سفر هفتۀ گذشتۀ خود به شنژن برای شرکت در نشست «آسیا-پاسیفیک» در پاسخ به خبرنگاران در ارتباط با این م %2C0%2C1813%2C925.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲ آذر • ۱۸:۰۲"}, {"source": "BBC Persian", "title": "هیئت مدیره انویدیا بار دیگر جنسن هوانگ را به سمت مدیرعاملی این شرکت منصوب کرد", "link": "https://www.bbc.com/persian/articles/cjlydn1w35v5o?at_medium=RSS&at_campaign=rss", "summary": "هیئت‌‌مدیره انویدیا، جنسن هوانگ را به سمت مدیرعامل و رئیس این شرکت بازگرداند. بر اساس بیانیه‌ای که در وب‌سایت انویدیا منتشر شده است، هیئت‌مدیره به اتفاق آرا به بازگرداندن جنسن هوانگ رأی داد. در این بیانیه آمده است: «هیئت‌مدیره بر این باور است که جنسن فرد مناسبی برای رهبری انویدیاست و بازگشت او به این سمت، به نفع سهامداران، کارکنان، شرکا و مشتریان ماست.»", "date_str": "2026-11-23T14:32:29+00:00", "hash": "bc14420c5adc7657", "title_fa": "هیئت مدیره انویدیا بار دیگر جنسن هوانگ را به سمت مدیرعاملی این شرکت منصوب کرد", "summary_fa": "هیئت‌‌مدیره انویدیا، جنسن هوانگ را به سمت مدیرعامل و رئیس این شرکت بازگرداند. بر اساس بیانیه‌ای که در وب‌سایت انویدیا منتشر شده است، هیئت‌مدیره به اتفاق آرا به بازگرداندن جنسن هوانگ رأی داد. در این بیانیه آمده است: «هیئت‌مدیره بر این باور است که جنسن فرد مناسبی برای رهبری انویدیاست و بازگشت او به این سمت، به نفع سهامداران، کارکنان، شرکا و مشتریان ماست.» آقای هوانگ که در پی جنجال‌های مربوط به رابطه‌اش با یک زن مشکوک به جاسوسی برای چین از مدیرعاملی انویدیا کنار رفته بود، با انتشار بیانیه‌ای از این تصمیم اسنتقبال کرد: «مفتخرم که به انویدیا بازمی‌گردم تا در آغاز یک انقلاب صنعتی جدید، هدایت یکی از تأثیرگذارترین شرکت‌های فناوری در جهان را بر عهده بگیرم. من این مسئولیت را با نهایت فروتنی و تعهدی تازه می‌پذیرم.» در بیانیه هیئت‌‌مدیره انویدیا آمده است که آن‌ها اطمینان دارند این تصمیم خطری برای امنیت ملی آمریکا ایجاد نمی‌کند: «هیئت‌مدیره در روند اتخاذ تصمیم خود، نظراتی را از سطوح عالی دولت ایالات متحده دریافت کرد و بر اساس این نظرات، اطمینان دارد که بازگرداندن آقای هوانگ به سمتش، هیچ‌گونه خطری برای امنیت ملی ایجاد نمی‌کند.» دونالد ترامپ، رئیس‌جمهور آمریکا، هم از بازگشت آقای هوانگ به شرکت انویدیا استقبال کرد و آن را «تصمیمی درست و بجا» خواند. او در شبکه اجتماعی تروث سوشال نوشت: «برای تضمین موفقیت و شکوفایی، نه تنها برای این شرکت، بلکه برای اقتصاد آمریکا، کشور به رهبری جنسن در انویدیا نیاز دارد.» او همچنین اظهار داشت که دولت ایالات متحده «هیچ دلیلی ندارد که تصور کند» بازگشت آقای هوانگ «هیچ‌گونه خطری» برای امنیت ملی ایجاد می‌کند. او آقای هوانگ را «یک میهن‌پرست بزرگ و گنجینه‌ای ملی» توصیف کرد.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/987a/live/b26b9cf0-4313-11ed-9ae9-959994b8a64c.png", "category": "هوش مصنوعی مولد", "tags": ["Nvidia", "امنیت سایبری"], "datetime_fa": "۲ آذر • ۱۸:۰۲"}, {"source": "Euronews Persian", "title": "چگونه توسعه صنایع رباتیک نظامی به ایجاد فرصت‌های شغلی در یک شهر کوچک اسپانیا کمک می‌کند؟", "link": "https://parsi.euronews.com/2026/11/23/how-military-robotics-is-creating-jobs-in-rural-spain", "summary": "گسترش فعالیت یک شرکت تولیدکننده تجهیزات و ربات‌های نظامی در شهر کوچک بینیفار در اسپانیا قرار است صدها فرصت شغلی جدید ایجاد کند.", "date_str": "2026-11-23T14:22:43+00:00", "hash": "b87a750061f13c61", "title_fa": "چگونه توسعه صنایع رباتیک نظامی به ایجاد فرصت‌های شغلی در یک شهر کوچک اسپانیا کمک می‌کند؟", "summary_fa": "گسترش فعالیت یک شرکت تولیدکننده تجهیزات و ربات‌های نظامی در شهر کوچک بینیفار در اسپانیا قرار است صدها فرصت شغلی جدید ایجاد کند.", "image_url": "https://images.euronews.com/articles/stories/09/97/42/80/1200x675_cmsv2_f560cd1a-f278-57af-be6d-ac26e65be7bf-9974280.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲ آذر • ۱۷:۵۲"}, {"source": "Euronews Persian", "title": "انویدیا جنسِن هوانگ را ۱۱ روز پس از استعفایش دوباره به‌عنوان مدیرعامل برگرداند", "link": "https://parsi.euronews.com/2026/11/23/nvidia-reinstates-jensen-huang-as-ceo-11-days-after-he-resigned", "summary": "هیئت‌مدیره شرکت سازنده تراشه به‌طور یک‌صدا رأی داد تا یکی از بنیان‌گذارانش را، ۱۱ روز پس از کناره‌گیری او به‌دنبال گزارش‌هایی درباره روابط خارج از ازدواج، دوباره بازگرداند.", "date_str": "2026-11-23T14:15:35+00:00", "hash": "37 د نتیجه‌ی آزمایشی علمی نیست و فقط دیدگاه پزشکان درباره‌ی امکان پیشرفت فناوری در آینده را نشان می‌دهد. درحال‌حاضر هیچ روش اثبات‌شده‌ای برای بازگرداندن ذهن انسان پس از مرگ وجود ندارد. کپی لینک پزشکان درباره‌ی امکان احیای مغز چه می‌گویند؟ پژوهش جدید که در نشریه‌ی علمی PLOS One منتشر شده، نخستین نظرسنجی نظام‌مند از پزشکان آمریکایی درباره‌ی حفظ مغز انسان برای احیای احتمالی در آینده است. پزشکان آمریکایی احتمال حفظ اطلاعات مغز پس از مرگ برای احیای احتمالی در آینده را ۲۵٫۵ درصد برآورد کرده‌اند، اما این رقم هنوز پشتوانه‌ی تجربی ندارد پژوهشگران از پزشکان خواستند شرایط بیماری را تصور کنند که دچار ایست قلبی شده، اما ساختار مغز و ارتباطات میان سلول‌های عصبی او همچنان سالم باقی مانده است. سپس پرسیدند چقدر احتمال دارد بتوان اطلاعات مغز چنین فردی را حفظ کرد و در آینده از آن‌ها برای بازآفرینی ذهن او استفاده کرد. در این نظرسنجی، ۱۵۰ پزشک عمومی و مراقبت‌های اولیه و ۱۸۴ متخصص از رشته‌هایی مانند مغز و اعصاب،", "image_url": "https://api2.zoomit.ir/media/human-brain-frozen-in-ice-6af17fcf354e588119e48757?w=1920&q=75", "category": "اقتصاد و بازرگانی", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آذر • ۱۹:۵۵"}, {"source": "TechCrunch AI", "title": "Trump reportedly called into Nvidia board meeting to advocate for Huang’s return", "link": "https://techcrunch.com/2026/11/23/trump-reportedly-called-into-nvidia-board-meeting-to-advocate-for-huangs-return/", "summary": "\"I spoke to them, let me put it that way... And I convinced them,\" the president told CNBC.", "date_str": "2026-11-23T16:39:10+00:00", "hash": "426cce126d9e84be", "title_fa": "طبق گزارش ها، ترامپ برای حمایت از بازگشت هوانگ به جلسه هیئت مدیره انویدیا دعوت شد", "summary_fa": "رئیس جمهور به CNBC گفت: \"من با آنها صحبت کردم، اجازه دهید اینطور بیان کنم... و آنها را متقاعد کردم.\" سمافور روز دوشنبه گزارش داد، رئیس جمهور دونالد ترامپ، یکی از متحدان نزدیک جنسن هوانگ، یکی از بنیانگذاران انویدیا، گزارش شده است که در جلسه هیئت مدیره انویدیا تماس گرفته است تا برای بازگشت مدیر عامل برکنار شده تلاش کند. ترامپ راهش را گرفت، زیرا انویدیا مد  نزدیکی بنغازی، در حدود 1500 مایلی خط مقدم جنگ قرار داشت، مستقر کردند. یک کشتی ترابری به نام آنگارا نیز مورد حمله قرار گرفت. زلنسکی در پستی در X فیلم ویدئویی از این حمله را به اشتراک گذاشت که نشان می‌دهد پهپادهای نیروی دریایی مستقیماً به داخل هر دو کشتی می‌روند و منفجر می‌شوند. زلنسکی در این پست، این حمله را «یک عملیات نمونه اوکراینی در پاسخ به جنگ روسیه» خواند. یک عملیات نمونه اوکراینی در پاسخ به جنگ روسیه. من از رزمندگان سرویس امنیتی اوکراین و همه نیروهای دفاعی ما در اوکراین که در انجام این وظایف شرکت کردند، تشکر می کنم. من توضیحات مفصلی در مورد مراحل عملیات", "image_url": "https://i.insider.com/6b0455500b69407d788a58ce?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "سینما"], "datetime_fa": "۲ آذر • ۱۹:۳۹"}, {"source": "Business Insider", "title": "8 things you should never have in your bedroom, according to professional organizers", "link": "https://www.businessinsider.com/bedroom-things-you-should-never-have-professional-organizers-2026-11", "summary": "Professional organizers shared their advice on decluttering a bedroom. Catherine Ledner/Getty Images Business Insider spoke to two professional organizers about how to declutter your bedroom. Extra bedding, mismatched socks, and old clothing can take up unnecessary space. Taking things such as mail, dishes, and empty boxes out of the room helps to reduce clutter. As tedious as it is, decluttering is a necessary task that can make a space look and feel bigger. However, figuring out where to start can be difficult, especially when the clutter gets overwhelming. For tips on the process, Business Insider asked two professional organizers who cofounded the organizing service Uncluttered Spaces what people should get rid of in their bedrooms. Here's what the experts said. Exercise equipment should be kept outside the bedroom. BM_27/Getty Images Although home workouts are popular, Uncluttered Spaces' Tina Horan said having equipment in your bedroom could create more clutter and make you feel less relaxed. She recommended moving the equipment to a designated area for working out in order to make the bedroom feel more organized, relaxed, and spacious. Keeping bills, mail, and other documents in the bedroom can make your space look messy. sirtravelalot/Shutterstock Horan advised against opening mail and keeping documents inside your bedroom. \"Having a buildup of mail can cause stress, but it's also messy to have a pile of documents laying around your room,\" she said. Instead, she recommended designating a drawer or basket for your mail to keep the collection nice and tidy. Mismatched socks can take up valuable drawer space. chickaz/Getty Images Uncluttered Spaces' Nancy Yerkes told BI that having a graveyard of mismatched socks takes up a lot of useful drawer space. \"It's time to buy a new pack of matching socks — let go of the misfit ones and reclaim that drawer space,\" Yerkes said. Dishes should either be kept out of the room or cleaned up right away. Cuchulainn Liam Gent/Shutterstock Sometimes a snack in bed is comforting — but Horan advised against letting a pile of dirty dishes build up in your bedroom. \"I'm sure we're all guilty of bringing dishes into our room, but don't wait too long to declutter and remove it to ensure a constantly clean room,\" Horan said. You don’t need a huge collection of extra bedding. AdShooter/Getty Images Having extra bedding sets with different designs is a nice way to decorate, but having too many takes up an annoying amount of spa", "date_str": "2026-11-23T16:07:23+00:00", "hash": "e95e53d61a2d44d1", "title_fa": "به گفته سازمان دهندگان حرفه ای 8 چیزی که هرگز نباید در اتاق خواب خود داشته باشید", "summary_fa": "سازمان دهندگان حرفه ای توصیه های خود را در مورد شلوغ کردن اتاق خواب به اشتراک گذاشتند. کاترین لدنر/Getty Images Business Insider با دو سازمان دهنده حرفه ای در مورد نحوه شلوغ کردن اتاق خواب صحبت کرد. ملافه های اضافی، جوراب های نامتناسب و لباس های قدیمی می توانند فضای غیر ضروری را اشغال کنند. بیرون بردن وسایلی مانند پست، ظروف و جعبه های خالی از اتاق به کاهش شلوغی کمک می کند. هر چقدر هم که خسته کننده باشد، بی نظمی یک کار ضروری است که می تواند فضا را بزرگتر و بزرگتر جلوه دهد. با این حال، فهمیدن اینکه از کجا شروع کنید می تواند دشوار باشد، به خصوص زمانی که درهم و برهمی زیاد شود. برای راهنمایی در مورد این فرآیند، Business Insider از دو سازمان دهنده حرفه ای که سرویس سازماندهی Uncluttered Spaces را پایه گذاری کردند، پرسید که مردم باید از چه چیزی در اتاق خواب خود خلاص شوند. این چیزی است که کارشناسان گفتند. وسایل ورزشی باید بیرون از اتاق خواب نگهداری شوند. BM_27/Getty Images اگرچه تمرینات خانگی محبوب هستند، اما تینا هوران از Uncluttered Spaces می‌گوید داشتن تجهیزات در اتاق خواب می‌تواند به هم ریختگی بیشتری ایجاد کند و احساس آرامش کمتری داشته باشید. او توصیه کرد که وسایل را به یک منطقه مشخص شده برای تمرین منتقل کنید تا اتاق خواب سازماندهی، آرامش و جادارتر به نظر برسد. نگهداری صورتحساب، نامه و سایر اسناد در اتاق خواب می تواند فضای شما را نامرتب نشان دهد. sirtravelalot/Shutterstock Horan توصیه کرد از باز کردن نامه و نگهداری اسناد در داخل اتاق خواب خودداری کنید. او می‌گوید: «انباشته شدن نامه‌ها می‌تواند باعث استرس شود، اما داشتن انبوهی از اسناد در اطراف اتاق شما نیز کثیف است. در عوض، او توصیه کرد که یک کشو یا سبد برای پست خود تعیین کنید تا مجموعه را زیبا", "image_url": "https://i.insider.com/6b046441d6c5d341c9b4c334?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آذر • ۱۹:۳۷"}, {"source": "Business Insider", "title": "Nasdaq surges 7% as the AI trade roars back after Jensen Huang is reinstated as Nvidia CEO", "link": "https://www.businessinsider.com/ai-stock-rally-jensen-huang-nvidia-reinstated-ceo-2026-11", "summary": "Jensen Huang s return stoked a massive recovery in tech stocks on Monday. Heather Diehl/Getty Images Stock investors are cheering Jensen Huang's return to Nvidia. The chipmaker said it reinstated Huang as CEO, removing a huge overhang for the AI trade. Shares of Nvidia soared more than 30%, helping the Nasdaq surge 7% to star the short week. Jensen Huang is back and the stock market couldn't be happier. AI stocks are in the midst of a sharp rebound as traders raced to buy Friday's dip and took in news that Huang was reinstated as Nvidia CEO, removing a huge overhang that pummeled the AI trade last week. The news caps off a wild, weekslong saga that began with reports of Huang having an extramarital affair with a suspected Chinese spy, which led investors to dump Nvidia and the data center suppliers in its orbit. In a statement, the board said it believed Huang was the \"right person to lead Nvidia,\" and that it took input from US government officials, which led it to be confident that Huang would pose no national security risk on the company. In a separate statement, Huang said he was \"honored\" to come back. Shares of Nvidia soared 34% on Monday as investors took in his reinstatement. The stock had plunged as much as 47% from its latest peak, and was down 21% last week. Glen Smith, the chief investment officer at GDS Wealth Management, called the decision to reinstate Huang \"shocking.\" \" Nvidia's stock is understandably surging on the news to reinstate Jensen Huang because much of its decline stemmed from this Nvidia crisis and it appears that the worst is over,\" he wrote in a note. AI stocks took it on the chin when Huang was first ousted . The Nvidia founder is seen as an unofficial poster child for the AI trade, leading his departure to be viewed in an existential light. The tech sector was up across the board. The iShares Semiconductor ETF surged more than 13%, while the Roundhill Neocloud ETF soared 20%. Here's where US indexes stood around 11 a.m. ET on Monday: S P 500 : 7,256.49, up 5.01% Dow Jones Industrial Average : 49,669.61, up 3.16% (+1,522.28 points) Nasdaq 100 : 26,768.96, up 6.95% Investors had been rooting for Huang to make a comeback as he was ousted from Nvidia, though the return, until Monday, looked unlikely. Nvidia's board said they were not considering bringing back Huang on the company's third-quarter earnings call, the first where Huang was absent. The rebound has provided the AI sector some much-needed stability after last week's b", "date_str": "2026-11-23T16:00:47+00:00", "hash": "977fd0be4489d81b", "title_fa": "نزدک 7 درصد افزایش یافت زیرا تجارت هوش مصنوعی پس از بازگرداندن جنسن هوانگ به عنوان مدیر عامل انویدیا بازگشت.", "summary_fa": "بازده جنسن هوانگ در روز دوشنبه باعث بهبود گسترده در سهام فناوری شد. سرمایه گذاران سهام Heather Diehl/Getty Images بازگشت جنسن هوانگ به Nvidia را تشویق می کنند. این سازنده تراشه اعلام کرد که هوانگ را به عنوان مدیرعامل بازگردانده است و مازاد بر تجارت هوش مصنوعی را از بین می برد. سهام انویدیا بیش از 30 درصد افزایش یافت و به Nasdaq کمک کرد تا هفته کوتاه را 7 درصد افزایش دهد. جنسن هوانگ بازگشته است و بازار سهام نمی تواند شادتر از این باشد. سهام هوش مصنوعی در بحبوحه جهش شدیدی قرار دارد زیرا معامله گران برای خرید افت روز جمعه به رقابت پرداختند و اخباری را دریافت کردند که هوانگ به عنوان مدیرعامل انویدیا بازگردانده شده است و یک مازاد عظیم را که هفته گذشته تجارت هوش مصنوعی را تحت تأثیر قرار داده بود، از بین برد. این اخبار حماسه‌ای وحشیانه و چند هفته‌ای را به تصویر می‌کشد که با گزارش‌هایی مبنی بر رابطه خارج از ازدواج هوانگ با یک جاسوس چینی آغاز شد که باعث شد سرمایه‌گذاران انویدیا و تامین‌کنندگان مرکز داده را در مدار آن کنار بگذارند. هیئت مدیره در بیانیه ای اعلام کرد که معتقد است هوانگ \"فرد مناسبی برای رهبری انویدیا\" است و از نظرات مقامات دولت ایالات متحده استفاده کرده است که باعث شده اطمینان داشته باشد که هوانگ هیچ خطری برای امنیت ملی برای شرکت ایجاد نخواهد کرد. هوانگ در بیانیه‌ای جداگانه گفت که بازگشتش به او «افتخار» است. سهام انویدیا در روز دوشنبه 34 درصد افزایش یافت، زیرا سرمایه گذاران بازگرداندن او را به خدمت گرفتند. سهام نسبت به آخرین اوج خود تا 47 درصد سقوط کرده بود و هفته گذشته 21 درصد سقوط کرد. گلن اسمیت، مدیر ارشد سرمایه گذاری در GDS Wealth Management، تصمیم برای بازگرداندن هوانگ را \"تکان دهنده\" خواند. او در یادداشتی نوشت: سهام انویدیا به", "image_url": "https://i.insider.com/6b044fdd73f126f9eccb9728?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۲ آذر • ۱۹:۳۰"}, {"source": "Business Insider", "title": "Zscaler stock leads cybersecurity rally after inking $44 billion mega-deal with CrowdStrike", "link": "https://www.businessinsider.com/zscaler-stock-crowdstrike-cybersecurity-deal-zs-crwd-net-panw-2026-11", "summary": "The logo of Zscaler is displayed on a smartphone screen against a Crowdstrike logo in the background. VCG/VCG via Getty Images Zscaler stock surged on Monday on news that it will be acquired by Crowdstrike. This $44 billion mega deal comes recent outages are putting cybersecurity in full focus. Other top movers in the space include Okta, Cloudflare and Fortinent. Zscaler stock surged on Monday, leading a rally in cybersecurity shares after news that the company will be acquired by CrowdStrike. The stock was up 17% after it was announced that Zscaler would be bought by CrowdStrike in a $44 billion all-stock deal that will combine two of the major players in the space. Crowdstrike CEO George Kurtz said in a statement that the acquisition is part of the company's strategy to stay ahead as AI becomes a bigger part of the cybersecurity landscape. \"With Zscaler, we're building cybersecurity's operating system: a single control plane to deploy AI, control AI, and enable any agentic application to run safely,\" he noted.\"We see a path to become the largest AI safety and security company the world has ever seen.\" Recent outages at banks and airlines have sparked widespread fear of cyber attacks driven by increasingly sophisticated AI capabilities. While this has put cybersecurity firms in full focus, it hasn't sparked much momentum for share prices since AI doomsday fears pushed them up in September. Zscaler's tie-up with CrowdStrike drove several other cybersecurity stocks higher on Monday. Some of the top movers include: Okta : +10% Cloudflare : +9% Fortinet: +5% SentinelOne : +9% Palo Alto Networks : +4% CrowdStrike fell 5% on news of the deal. Dan Ives of Yorkville Ives, maintains an Outperform rating on CrowdStrike stock, citing the edge that it will gain from adding Zscaler's Secure Access Service Edge (SASE) platform to its network. \"We view this as the clearest signal yet that cybersecurity is consolidating into a handful of platforms, with the AI era forcing the hand of vendors who had been content to partner,\" Ives wrote in a note on Monday morning. \"The two already shared more than 2,000 customers and 16 integrations.\" Read the original article on Business Insider", "date_str": "2026-11-23T15:48:55+00:00", "hash": "9f6f6b6c48852ad5", "title_fa": "سهام Zscaler پس از امضای قرارداد 44 میلیارد دلاری با CrowdStrike در امنیت سایبری پیشتاز شد.", "summary_fa": "لوگوی Zscaler بر روی صفحه نمایش گوشی هوشمند در برابر آرم Crowdstrike در پس زمینه نمایش داده می شود. VCG/VCG از طریق Getty Images سهام Zscaler روز دوشنبه با اخباری مبنی بر خرید آن توسط Crowdstrike افزایش یافت. این معامله بزرگ 44 میلیارد دلاری رخ می دهد که قطعی های اخیر امنیت سایبری را در تمرکز کامل قرار داده است. دیگر موتورهای برتر در این فضا عبارتند از Okta، Cloudflare و Fortinent. سهام Zscaler روز دوشنبه افزایش یافت و پس از اخباری مبنی بر خرید این شرکت توسط CrowdStrike، منجر به افزایش سهام امنیت سایبری شد. پس از اینکه اعلام شد Zscaler توسط CrowdStrike در یک معامله 44 میلیارد دلاری که دو بازیگر اصلی در این فضا را ترکیب می کند، 17 درصد افزایش یافت. جورج کورتز، مدیر عامل شرکت Crowdstrike، در بیانیه‌ای گفت که این خرید بخشی از استراتژی این شرکت برای ماندن در آینده است زیرا هوش مصنوعی به بخش بزرگ‌تری از چشم‌انداز امنیت سایبری تبدیل می‌شود. او خاطرنشان کرد: «با Zscaler، ما در حال ساختن سیستم عامل امنیت سایبری هستیم: یک هواپیمای کنترلی واحد برای استقرار هوش مصنوعی، کنترل هوش مصنوعی و فعال کردن هر برنامه عاملی برای اجرای ایمن.» قطعی‌های اخیر در بانک‌ها و خطوط هوایی ترس گسترده‌ای از حملات سایبری ناشی از قابلیت‌های پیشرفته‌تر هوش مصنوعی را برانگیخته است. در حالی که این امر شرکت‌های امنیت سایبری را در کانون توجه کامل قرار داده است، اما از زمانی که ترس از روز رستاخیز هوش مصنوعی در ماه سپتامبر آنها را افزایش داد، حرکت زیادی برای قیمت سهام ایجاد نکرد. پیوند Zscaler با CrowdStrike باعث افزایش چند سهام دیگر در امنیت سایبری در روز دوشنبه شد. برخی از پیشروان برتر عبارتند از: Okta: +10% Cloudflare: +9% Fortinet: +5% SentinelOne: +9% Palo Alto Networks: +4% CrowdStrike با اخبار معامله 5% سقوط کرد. Dan Ives از Yorkville Ives،", "image_url": "https://i.insider.com/6b04524873f126f9eccb9734?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "بورس و طلا"], "datetime_fa": "۲ آذر • ۱۹:۱۸"}, {"source": "Business Insider", "title": "We moved across the country to a more expensive city. I love it, but feel embarrassed when friends from home visit.", "link": "https://www.businessinsider.com/moved-to-more-expensive-city-across-country-better-complicated-feelings-2026-11", "summary": "My husband and I moved from the Southeast US to Olympia, Washington. It s worth the higher cost of living, but I feel self-conscious when friends from home visit. Courtesy of Laura Grace Tarpley We moved across the country from the Southeast US to a more expensive city, Olympia, Washington. The higher cost of living has been worth it, but I'm embarrassed telling friends from home about it. I'm working to stop judging myself for spending more and projecting those insecurities onto others. I grew up in Little Rock, Arkansas, and my husband, Daniel, grew up just south of Atlanta. Aside from brief stints living abroad, we've each spent most of our lives in the Southeast United States. By 2021, though, we were ready to live somewhere else in the US. The weather was one reason. Rather than getting used to slogging through humid Southern summers over the years, my animosity toward the weather only grew. Also, we both love hiking, and it's hard to enjoy the outdoors when you're sweating for roughly five months of the year. Religion was another reason for moving. We were both raised in Evangelical Christian households and had spent nearly all our years in the Bible Belt. However, neither of us was religious anymore. We wanted some space from that part of traditional Southern culture. My job was fully remote, so I could work from anywhere in America. Daniel, on the other hand, worked for the state government. He started applying for jobs out West, and he was finally hired in Olympia, Washington. We had never visited, but we just said, \"Why not?\" The mountains and lifestyle are worth the higher cost of living for us With our new home, we ve got access to tons of incredible outdoor activities on the Puget Sound. Courtesy of Laura Grace Tarpley From the start, life in Washington was more expensive than we were used to. Although we'd lived in several cities down South, I most often compared Olympia prices to those in Little Rock , since that's where I grew up and several of my close friends still live. The cost of living in Olympia is significantly higher than in Little Rock. Groceries and gas cost more, but housing was the biggest sticker shock for us. (Homes tend to cost about 40% more in Olympia, according to estimates from PayScale and Forbes' Cost of Living Calculators.) Daniel and I decided the extra expenses were worth the trade-off of being surrounded by mountains and water, though. Just a year after moving to Olympia, we bought a house where we can see the Puge", "date_str": "2026-11-23T15:32:01+00:00", "hash": "183c57212d9088fb", "title_fa": "ما در سراسر کشور به یک شهر گران تر نقل مکان کردیم. من آن را دوست دارم، اما وقتی دوستان از خانه به آنجا سر می زنند، احساس خجالت می کنم.", "summary_fa": "من و شوهرم از جنوب شرقی ایالات متحده به المپیا، واشنگتن نقل مکان کردیم. این ارزش هزینه بالاتر زندگی را دارد، اما وقتی دوستان از خانه به آن سر می زنند احساس خودآگاهی می کنم. با حسن نیت از لورا گریس تارپلی ما در سراسر کشور از جنوب شرقی ایالات متحده به شهری گرانتر، المپیا، واشنگتن نقل مکان کردیم. هزینه بالاتر زندگی ارزشش را داشته است، اما خجالت می‌کشم این موضوع را به دوستان خود از خانه بگویم. من کار می کنم تا از قضاوت کردن خودم برای خرج کردن بیشتر و فرافکنی این ناامنی ها به دیگران دست بردارم. من در لیتل راک، آرکانزاس بزرگ شدم و شوهرم، دانیل، درست در جنوب آتلانتا بزرگ شد. جدای از دوره های کوتاه زندگی در خارج از کشور، هر یک از ما بیشتر زندگی خود را در جنوب شرقی ایالات متحده گذرانده ایم. با این حال، تا سال 2021، ما آماده بودیم در جای دیگری در ایالات متحده زندگی کنیم. آب و هوا یکی از دلایل بود. در طول سال‌ها، به جای عادت کردن در تابستان‌های مرطوب جنوب، خصومت من نسبت به آب و هوا بیشتر شد. همچنین، هر دوی ما عاشق پیاده‌روی هستیم و زمانی که تقریباً پنج ماه از سال عرق می‌کنید، لذت بردن از فضای باز سخت است. مذهب دلیل دیگری برای حرکت بود. ما هر دو در خانواده های مسیحی انجیلی بزرگ شدیم و تقریباً تمام سال های خود را در کمربند کتاب مقدس گذرانده بودیم. با این حال، هیچ کدام از ما دیگر مذهبی نبودیم. ما فضایی از آن بخش از فرهنگ سنتی جنوب می خواستیم. کار من کاملاً از راه دور بود، بنابراین می‌توانستم از هر کجای آمریکا کار کنم. از سوی دیگر، دانیل برای دولت ایالتی کار می کرد. او شروع به درخواست شغل در غرب کرد و سرانجام در المپیا، واشنگتن استخدام شد. ما", "image_url": "https://i.insider.com/6b007c0e0b69407d788a4fa6?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آذر • ۱۹:۰۲"}, {"source": "Business Insider", "title": "I'm a professional baker. Here are 8 of the best ways to upgrade a box of brownie mix.", "link": "https://www.businessinsider.com/best-ways-upgrade-brownie-mix-professional-baker-tips", "summary": "As a professional baker, I ve learned a lot of easy ways to upgrade a box of brownie mix. Tetra Images/Getty Images As a professional baker, I think it's possible to make brownies from a boxed mix taste gourmet. Extracts, fun mix-ins, and a sprinkle of salt can elevate brownies. Use cream or milk instead of water when making your brownies to make them even more moist. Brownies are easily a top favorite treat for many — and baking a great batch at home is easier than you think. I'm a former bakery owner, now a professional baker and recipe developer, and although I can bake brownies from scratch , I often prefer to use a mix I've doctored up. With a few swaps and additions, you can take a premade blend to the next level and make the brownies your own. Here are some of the best ways to upgrade a box of brownie mix . Make the brownies more moist using milk or cream. Jen Tepp/Getty Images When preparing your boxed mix, try swapping out the water needed for milk or heavy cream. This will still check the liquid off the ingredient list while creating a richer, fudgier, moister brownie. Add mix-ins to play with texture and flavor. natashamam/Getty Images A plain brownie batter is calling for mix-ins, and the possibilities are endless. Consider adding chocolate chips or dark-chocolate chunks. Crushed Oreo cookies, M M's, Reese's Pieces, chopped walnuts, or hazelnuts are excellent options as well. Fold in the mix-ins after the batter is prepped, then transfer to the baking pan and bake as directed. Play with extracts. brazzo/Getty Images Switch up the flavor of boxed brownies with just a few drops of an extract. Even just a teaspoon of vanilla extract can go a long way in enhancing the flavor of this treat. You can also play around with different flavors. For example, adding peppermint extract will offer a chocolate-mint combo that's wonderful for the holiday season. Coconut extract is another fun option to try; you can amplify its flavors by also folding shredded coconut into your brownie batter. Use brewed coffee in place of water for brownies with more depth. Karl Tapales/Getty Images Most brownie mixes call for a few tablespoons of water on the back of the box. To enhance your brownies, swap some of that water out for strong brewed coffee. This can add a more complex depth of flavor. For an even more pronounced coffee flavor, add a teaspoon of instant espresso powder to the dry ingredients as well. Sprinkle them with salty snack foods. KateSmirnova/Getty Images ", "date_str": "2026-11-23T15:24:12+00:00", "hash": "5d61ee6128774a49", "title_fa": "من یک نانوای حرفه ای هستم. در اینجا 8 مورد از بهترین راه ها برای ارتقاء یک جعبه مخلوط براونی آورده شده است.", "summary_fa": "به‌عنوان یک نانوای حرفه‌ای، راه‌های آسان زیادی برای ارتقاء یک جعبه مخلوط براونی آموختم. Tetra Images/Getty Images به عنوان یک نانوای حرفه ای، فکر می کنم می توان براونی ها را از یک غذای خوش طعم مخلوط جعبه درست کرد. عصاره‌ها، مخلوط‌های سرگرم‌کننده و پاشیدن نمک می‌توانند براونی را افزایش دهند. هنگام درست کردن براونی ها به جای آب از خامه یا شیر استفاده کنید تا مرطوب تر شوند. براونی ها به راحتی یکی از بهترین خوراکی های مورد علاقه بسیاری هستند - و پخت یک دسته عالی در خانه آسان تر از آن چیزی است که فکر می کنید. من قبلاً یک نانوایی هستم، اکنون یک نانوای حرفه ای و تهیه کننده دستور پخت هستم، و اگرچه می توانم براونی را از ابتدا بپزم، اغلب ترجیح می دهم از مخلوطی استفاده کنم که قبلاً درست کرده ام. با چند تعویض و اضافه کردن، می توانید یک ترکیب از پیش ساخته شده را به سطح بعدی ببرید و براونی ها را خودتان بسازید. در اینجا برخی از بهترین راه ها برای ارتقاء جعبه مخلوط براونی آورده شده است. براونی ها را با استفاده از شیر یا خامه مرطوب تر کنید. Jen Tepp/Getty Images هنگام تهیه مخلوط جعبه ای خود، سعی کنید آب مورد نیاز را با شیر یا خامه غلیظ عوض کنید. این کار همچنان مایع را از لیست مواد تشکیل می دهد و در عین حال یک براونی غنی تر، مرطوب تر و مرطوب تر ایجاد می کند. میکس این ها را اضافه کنید تا با بافت و طعم بازی کنید. natashamam/Getty Images یک خمیر براونی ساده نیاز به مخلوط کردن دارد، و احتمالات بی پایان است. اضافه کردن چیپس شکلات یا تکه های شکلات تلخ را در نظر بگیرید. کوکی‌های Oreo خرد شده، M M's، Reese's Pieces، گردوی خرد شده یا فندق نیز گزینه‌های عالی هستند. پس از", "image_url": "https://i.insider.com/6b04596973f126f9eccb97aa?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آذر • ۱۸:۵۴"}, {"source": "Business Insider", "title": "Russia makes a new ballistic missile every 5 hours and is picking up the pace, Ukraine warns", "link": "https://www.businessinsider.com/russia-ballistic-missile-production-ramping-up-ukraine-2026-11", "summary": "Russia can produce a ballistic missile every five hours, Ukraine s defense chief warned on Monday. VCG/VCG via Getty Images Russia makes one ballistic missile every five hours, Ukraine's defense minister said on Monday. Yevhenii Khmara warned a NATO assembly that Russia is working to accelerate this pace. Ukrainian intelligence warned recently that Russia has up to 700 ballistic missiles in its stocks. Russia produces one ballistic missile every five hours and is working to accelerate this pace, Ukrainian Defense Minister Yevhenii Khmara said on Monday. Russia is intensifying its ballistic and cruise missile strikes , Khmara revealed during a speech at the NATO Parliamentary Assembly in Berlin, adding that Moscow launched 153 ballistic missiles at Ukraine last month. Over the weekend, Russia launched a massive bombardment against Ukraine using roughly 110 missiles, including over two dozen ballistic missiles, and more than 400 drones. \"Every five hours,\" the defense minister said, \"the enemy produces one ballistic missile and continues to accelerate this pace. Russia's primary targets are the civilian population and civilian infrastructure.\" He added that Russia is \"methodically\" destroying Ukraine's energy sector, a tactic that Kyiv has called out every winter for years. Neither Russia's defense ministry nor its US embassy responded to a request for comment. Earlier this month, Ukraine's military intelligence agency released a new assessment detailing Russian missile stockpiles and production capacity. It said that as of October, Moscow's reserves included up to 700 ballistic missiles and thousands of cruise missiles. Ukrainian intelligence said this month that Russia had stockpiled hundreds of ballistic missiles. Maxym Marusenko/NurPhoto via Getty Images The GUR said Russia can produce up to 110 ballistic missiles a month, roughly one every six-and-a-half hours, including 9M723 Iskander-M and RM-48U models, the latter of which is fired from S-400 air defense launchers and accounts for more than half of Moscow's reserves. Khmara said that Ukraine isn't only trying to down incoming ballistic missiles; it's also going after the Russian launchers. Kyiv has struck 16 Iskander and S-400 systems in recent months, he said. \"We will also work to diminish Russia's capacity to manufacture weapons,\" Khmara said, according to a translation of his remarks at the NATO assembly. \"For this reason, the enemy's defense-industrial facilities are among our targets.\" Ballisti", "date_str": "2026-11-23T15:14:33+00:00", "hash": "cd157b5f310b797c", "title_fa": "اوکراین هشدار داد روسیه هر 5 ساعت یک موشک بالستیک جدید می سازد و سرعت آن را افزایش می دهد", "summary_fa": "رئیس دفاع اوکراین روز دوشنبه هشدار داد روسیه می تواند هر پنج ساعت یک موشک بالستیک تولید کند. وزیر دفاع اوکراین روز دوشنبه گفت که روسیه هر پنج ساعت یک موشک بالستیک تولید می کند. یوهنی خمارا به مجمع ناتو هشدار داد که روسیه در حال تلاش برای تسریع این سرعت است. اطلاعات اوکراین اخیرا هشدار داده است که روسیه تا 700 موشک بالستیک در انبارهای خود دارد. یوهنی خمارا، وزیر دفاع اوکراین روز دوشنبه گفت که روسیه هر پنج ساعت یک موشک بالستیک تولید می کند و در حال تلاش برای تسریع این سرعت است. خمارا در جریان سخنرانی در مجمع پارلمانی ناتو در برلین فاش کرد روسیه در حال تشدید حملات موشکی بالستیک و کروز خود است و افزود که مسکو ماه گذشته 153 موشک بالستیک به سمت اوکراین پرتاب کرد. در آخر هفته، روسیه با استفاده از حدود 110 موشک، از جمله بیش از 22 موشک بالستیک و بیش از 400 پهپاد، بمباران گسترده ای را علیه اوکراین انجام داد. وزیر دفاع گفت: دشمن هر پنج ساعت یک بار یک موشک بالستیک تولید می کند و به این سرعت ادامه می دهد. اهداف اولیه روسیه جمعیت غیرنظامی و زیرساخت های غیرنظامی هستند.\" او افزود که روسیه \"به صورت روشی\" بخش انرژی اوکراین را نابود می کند، تاکتیکی که کیف سال هاست هر زمستان آن را مطرح می کند. نه وزارت دفاع روسیه و نه سفارت آمریکا آن به درخواست برای اظهار نظر پاسخ ندادند. اوایل ماه جاری، آژانس اطلاعات نظامی اوکراین ارزیابی جدیدی از ذخایر ظرفیت تولید موشک روسیه منتشر کرد. در این بیانیه آمده است که تا اکتبر، ذخایر مسکو شامل 700 موشک بالستیک و هزاران موشک کروز بوده است. سازمان اطلاعات اوکراین در ماه جاری اعلام کرد که روسیه صدها موشک بالستیک ذخیره کرده است.", "image_url": "https://i.insider.com/6b0440870b69407d788a5825?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آذر • ۱۸:۴۴"}, {"source": "Business Insider", "title": "My husband and I bought our dream home. We lived in a pop-up camper in the yard to save money during renovations.", "link": "https://www.businessinsider.com/lived-in-pop-up-camper-during-home-renovations-saved-money-2026-11", "summary": "We lived in a pop-up camper in our yard while our home was being renovated. Dee Saale We bought our dream home in Boulder, Colorado , but the older house needed a lot of work. During the renovations, my husband and I lived in a pop-up camper in our yard. The experience wasn't perfect, but we saved a lot of money by staying on the property. This summer, my husband and I took the plunge and bought the fixer-upper we always wanted — a 1950s home in Boulder, Colorado, that had been lovingly maintained by the same family for the last 63 years. The house was structurally sound but hadn't been renovated in decades. We knew we couldn't do everything at once, so we planned to tackle the renovations in stages . The only issue? Figuring out where to live while the construction took place. Since Boulder is a destination for tourists year-round, the cost of staying in local hotels and long-term rentals comes at a premium. So, we got creative and turned to a cost-effective solution — living in the pop-up camper we had bought about 20 years ago for camping trips. The camper was comfortable enough for our needs Even though we had a sink in the camper, we never ended up using it. Dee Saale One of the things that drew us to our home was its large (by Boulder standards) backyard. At over a third of an acre, we had plenty of room to set up the camper. Over the years, we've taken the camper on countless trips, from Canada to the Mexican border. However, living in it for more than a few weeks would be a first for us. It's not large — with both ends pulled out and the roof raised, it measures about 15 feet long, 7 feet tall, and 7 feet wide — but we knew it would be comfortable enough for what we needed. Each end of the camper is equipped with a double-sized bed with a foam mattress that, although not as luxurious as a \"normal\" mattress, is comfortable enough. The camper has two double beds. Dee Saale There's also a small table with booth-like seating, although we typically preferred to eat on our patio instead. Speaking of meals, these were especially tricky to navigate since we didn't have a reliable way to clean the dishes and didn't want to attract unwanted animals. Although there is a sink in the camper, we didn't hook it up out of fear of mold growth. However, once the kitchen was demolished, there was no longer a kitchen sink or any appliances. Luckily, we always had at least one functioning bathroom in the house, so we rinsed fruit and vegetables there and used the showe", "date_str": "2026-11-23T15:13:51+00:00", "hash": "078976eb5ed28c22", "title_fa": "من و شوهرم خانه رویایی خود را خریدیم. ما در یک کمپر پاپ آپ در حیاط زندگی می کردیم تا در زمان بازسازی در هزینه صرفه جویی کنیم.", "summary_fa": "در حالی که خانه مان در حال بازسازی بود، در یک کمپینگ پاپ آپ در حیاطمان زندگی می کردیم. دی سال ما خانه رویایی خود را در بولدر، کلرادو خریدیم، اما خانه قدیمی به کار زیادی نیاز داشت. در طول تعمیرات، من و شوهرم در یک کمپینگ پاپ آپ در حیاطمان زندگی می کردیم. تجربه عالی نبود، اما ما با ماندن در ملک، پول زیادی را پس انداز کردیم. تابستان امسال، من و شوهرم دست به کار شدیم و رویه‌ای را که همیشه می‌خواستیم خریدیم - خانه‌ای در دهه 1950 در بولد د به شبکه یک شرکت محافظت شود. CrowdStrike که رایانه‌ها، لپ‌تاپ‌ها، تلفن‌ها و سایر دستگاه‌های متصل به شبکه یک شرکت را ایمن می‌کند، گفت که این قرارداد نرم‌افزار محافظت نقطه پایانی خود را با پلتفرم اعتماد صفر Zscaler متحد می‌کند تا بهتر از مشتریان خود در برابر نقض داده‌ها دفاع کند. با ترکیب این دو محصول، CrowdStrike و Zscaler می گویند که می توانند از مشتریان خود محافظت بالاتری ارائه دهند. در اظهارات روز دوشنبه، این شرکت ها گفتند که این خرید به مشتریان کمک می کند تا با خیال راحت هوش مصنوعی را اتخاذ کنند. انتظار می رود این معامله که مشروط به تایید رگولاتوری است، در همین زمان در سال آینده بسته شود. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید.", "image_url": "https://techcrunch.com/wp-content/uploads/2026/11/crowdstrike-2162041873.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "عامل‌های هوشمند"], "datetime_fa": "۲ آذر • ۱۹:۵۰"}, {"source": "Engadget", "title": "What the green flashing light on your Roku remote is telling you", "link": "https://www.engadget.com/2321531/what-green-flasing-light-roku-remote-telling-you/", "summary": "Find out what your Roku remote s green light means, when it s harmless and when it signals a problem, plus what to do if your remote isn t working as it should.", "date_str": "2026-11-23T16:15:00+00:00", "hash": "215f9974b936d787", "title_fa": "چراغ چشمک زن سبز روی کنترل از راه دور Roku به شما چه می گوید", "summary_fa": "بفهمید چراغ سبز کنترل از راه دور Roku چه معنایی دارد، چه زمانی بی ضرر است و چه زمانی نشان دهنده مشکل است، به علاوه اگر کنترل از راه دور آنطور که باید کار نمی کند چه کاری باید انجام دهید. یک کنترل از راه دور که همکاری نمی کند می تواند برنامه های پخش جریانی شما را در حالت تعلیق قرار دهد. در اینجا نحوه رفع اشکال و بازگشت به محتوای مورد علاقه شما آمده است. rylansamazingphotography/Shutterstock افزودن Engadget به Google: منبع برگزیده Google Discover صرف نظر از اینکه در مورد تصاحب فاکس چه فکر می‌کنید، Roku همچنان یک نیروی غ d tab, you ll see the location of all remembered items. You can also add items manually here using the Add button. Make sure your Android smartphone is trackable even after it's turned off Some Android smartphones can remain findable for several hours after they've been switched off or their batteries have run out. If you re using a supported device (like the latest Pixel series smartphone), you can use a hardware feature ", "date_str": "2026-11-23T15:30:00+00:00", "hash": "1cef5232cfefe17a", "title_fa": "10 هک Find Hub که هر کاربر اندرویدی باید بداند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اپلیکیشن Find Hub گوگل فقط برای ردیابی گوشی هوشمند گم شده شما نیست. در طول سال گذشته، Google به طور مداوم ویژگی‌هایی را برای مدیریت وسایل شما، اشتراک‌گذاری موقعیت مکانی شما با عزیزان و مکان یابی دستگاه‌های گمشده اضافه کرده است. Find Hub اکنون می تواند وقتی دستگاه یا ردیاب خود را پشت سر گذاشته اید به شما اطلاع دهد. به‌علاوه، می‌توانید از Gemini برای به خاطر سپردن مواردی که در آن جا گذاشته‌اید، حتی بدون ردیاب متصل استفاده کنید. در پشت صحنه، تنظیمات و ویژگی های مخفی تری وجود دارد که به ردیابی دستگاه های شما کمک می کند و در صورت دزدیده شدن یا جابجایی آنها، بازیابی آنها را آسان تر می کند. اگر از Find Hub استفاده می کنید، باید در مورد این 10 هک بدانید. این ویژگی را برای دریافت اعلان‌های Left Behind به سبک AirTag فعال کنید این ماه، Google سرانجام اعلان‌های Left Behind را به ردیاب‌های اندروید اضافه کرد، اما شما باید این ویژگی را به صورت دستی فعال کنید. کاربران AirTags باید از قبل با این ویژگی آشنا باشند. هنگامی که ردیاب یا دستگاه خود را پشت سر می گذارید و از محدوده مکان خارج می شوید، اعلانی دریافت خواهید کرد که بدون مورد رها کرده اید. شما باید این ویژگی را بر اساس هر دستگاه فعال کنید. به Find Hub بروید و یک دستگاه را انتخاب کنید. روی نماد چرخ‌دنده تنظیمات در کنار نام دستگاه ضربه بزنید و وقتی پشت سر گذاشتید Notify را فعال کنید. وقتی اینجا هستید، به افزودن مکان بروید تا مکان‌های آشنا را که نمی‌خواهید در آن‌ها اعلان دریافت کنید (مانند خانه یا فضای کاری خ ام با موسیقی بدرخشد. آخرین به‌روزرسانی هوم پاد اپل باعث می‌شود که بالای بلندگوی شما همگام با موسیقی بدرخشد. Apple Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover HomePod اپل مجموعه‌ای از چراغ‌ها را در بالا دارد که در هنگام گوش دادن سیری یا زمانی که چیزی در حال پخش است، کار دیگری فراتر از درخشان شدن ندارند. اما پس از عرضه HomePod mini 2، اپل قابلیت جدیدی به نام Sound Glow را نیز معرفی کرد که استفاده بهتری از این چراغ ها می کند. وقتی روشن می‌شود، بالای بلندگو به یک نمایش نوری رنگارنگ تبدیل می‌شود که با آهنگی که به آن گوش می‌دهید همگام‌سازی می‌شود - و خبر خوب این است که این اسپیکر منحصر به آخرین HomePod mini نیست. این ویژگی بخشی از نرم افزار HomePod 27.2 است و همچنین با HomePod mini اصلی و HomePod 2 (مدل بزرگتر) کار می کند. در اینجا نحوه عملکرد Sound Glow و نحوه فعال کردن (یا غیرفعال کردن) آن در HomePods توضیح داده شده است. Filipe Espósito برای Engadget HomePods صفحه نمایش سنتی مانند HomeView اپل ندارد. در عوض، اپل مجموعه ای از LED ها را در بالا به همراه یک سطح حساس به لمس قرار داده است که به کاربران امکان می دهد به کنترل های سریع مانند صدا و پخش/مکث دسترسی داشته باشند. با آخرین به‌روزرسانی نرم‌افزار HomePod، این LED‌ها اکنون برای سرگرم‌تر کردن HomePods با Sound Glow استفاده می‌شوند. اکنون، هنگامی که آهنگی را پخش می کنید، بلندگو رنگ ها را از هنر آلبوم بیرون می کشد و به موقع با ضرب آهنگ آن ها را پالس می کند. گوش دادن به The Life of a Showgirl اثر تیلور سوئیفت به نورهای سبز و نارنجی منجر می شود، در حالی که تعطیلات تابستانی", "image_url": "https://www.engadget.com/img/gallery/what-is-sound-glow-on-homepods-and-how-do-you-get-it-on-your-apple-speaker/l-intro-1794947532.jpg", "category": "موبایل و گجت‌ها", "tags": ["Google", "Apple", "موسیقی"], "datetime_fa": "۲ آذر • ۱۹:۱۵"}, {"source": "Zoomit", "title": "اگر قلمرو انسان خردمند در اوراسیا گسترش نمی‌یافت، نئاندرتال‌ها شاید منقرض نمی‌شدند", "link": "https://www.zoomit.ir/human-science/471612-human-expansion-neanderthal-extinction/", "summary": "مدل‌سازی‌های جدید نشان می‌دهد که گسترش انسان مدرن با جلوگیری از احیای جمعیت نئاندرتال‌ها پس از سرمای سخت، عامل اصلی نابودی آن‌ها بوده است.", "date_str": "2026-11-23T15:29:00+00:00", "hash": "49346039cba1aadc", "title_fa": "اگر قلمرو انسان خردمند در اوراسیا گسترش نمی‌یافت، نئاندرتال‌ها شاید منقرض نمی‌شدند", "summary_fa": "مدل‌سازی‌های جدید نشان می‌دهد که گسترش انسان مدرن با جلوگیری از احیای جمعیت نئاندرتال‌ها پس از سرمای سخت، عامل اصلی نابودی آن‌ها بوده است. تبلیغات حدود ۴۰هزار سال پیش، نئاندرتال‌ها پس از صدها هزار سال زندگی در اوراسیا ناپدید شدند؛ درست در دوره‌ای که انسان‌های امروزی در حال گسترش قلمرو خود در این منطقه بودند. دانشمندان مدت‌هاست درباره‌ی علت انقراض این خویشاوندان باستانی ما بحث می‌کنند. آیا تغییرات شدید آب‌وهوایی آن‌ها را از بین برد یا ورود انسان خردمند به زیستگاه‌هایشان سرنوشت آن‌ها را تغییر داد؟ پژوهشی جدید نشان می‌دهد که گسترش انسان خردمند ( Homo sapiens ) احتمالاً نقش تعیین‌کننده‌تری در انقراض نئاندرتال‌ها داشته است. پژوهشگران با شبیه‌سازی تغییرات جمعیتی و اقلیمی اوراسیا دریافتند که بدون حضور انسان‌های مدرن، احتمال انقراض کامل نئاندرتال‌ها بسیار پایین بود. به‌گزارش آی‌اف‌ال‌ساینس ، پژوهشگران برای بررسی رابطه‌ی میان تغییرات اقلیمی، گسترش انسان خردمند و انقراض نئاندرتال‌ها، شرایط اوراسیا را در فاصله‌ی ۵۵هزار تا ۲۷هزار سال پیش مدل‌سازی کردند. کپی لینک تغییرات اقلیمی نئاندرتال‌ها را ضعیف کرد، اما از بین نبرد انسان‌های مدرن حدود ۴۵هزار سال پیش، در دوره‌ای نسبتاً گرم از تاریخ اقلیمی زمین، گسترش خود را در اوراسیا آغاز کردند. در همان زمان، نئاندرتال‌ها نیز در بخش‌های گسترده‌ای از این منطقه زندگی می‌کردند؛ اما با کاهش دما در دوره‌های بعدی، شرایط زیست‌محیطی برای آن‌ها دشوارتر شد. در کمتر از دو درصد شبیه‌سازی‌هایی که فقط تغییرات اقلیمی را در نظر می‌گرفتند، نئاندرتال‌ها به‌طور کامل منقرض شدند پژوهشگران برای بررسی تأثیر این تغییرات از داده‌های اقلیمی باستانی استفاده کردند. آن‌ها ابتدا محاسبه کردند که کاهش دما چگونه می‌توانسته پوشش گیاهی و جمعیت جانوران را تغییر دهد و سپس تأثیر این دگرگونی‌ها را بر منابع غذایی و ظرفیت زیستگاه‌های نئاندرتال‌ها برآورد کردند.", "image_url": "https://api2.zoomit.ir/media/extinction-of-neanderthals-by-humans-6b025bf86c258944521175e1?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آذر • ۱۸:۵۹"}, {"source": "TechCrunch Main", "title": "Dutch privacy authority urges consumers not to buy ‘pervert glasses’", "link": "https://techcrunch.com/2026/11/23/dutch-privacy-authority-urges-consumers-not-to-buy-pervert-glasses/", "summary": "The Netherlands' data protection agency said smart wearables violate people's privacy, get information wrong, and can result in unsafe situations.", "date_str": "2026-11-23T15:29:49+00:00", "hash": "c72e2556eb905b20", "title_fa": "سازمان حفظ حریم خصوصی هلند از مصرف کنندگان می خواهد که «عینک منحرف» نخرند", "summary_fa": "آژانس حفاظت از داده‌های هلند اعلام کرد که پوشیدنی‌های هوشمند حریم خصوصی افراد را نقض می‌کنند، اطلاعات را اشتباه دریافت می‌کنند و می‌توانند منجر به موقعیت‌های ناامن شوند. سازمان حفاظت از داده هلند از مصرف‌کنندگان می‌خواهد که عینک‌های دوربین مجهز به هوش مصنوعی را نخرند و هشدار می‌دهد که این عینک‌ها حریم خصوصی اطرافیان را به خطر می‌اندازند و ایمنی کاربران خود را به خطر می‌اندازند. این مقام، که بیانیه اخیرش کمتر از یک ممنوعیت کامل است، گفت که استفاده از عینک های فعال اینترنت و همیشه روشن برای ضبط افراد در ملاء عام تقریباً همیشه ممنوع است. منتقدان این پوشیدنی‌های هوشمند را عینک منحرف نامیده‌اند، زیرا می‌خواهند از آن‌ها برای فیلمبرداری از افراد بدون اجازه آنها استفاده شود، به‌ویژه برای آزار و اذیت زنان. در حالی که برخی از عینک ها چراغ های هشدار دهنده هنگام ضبط کردن کاربران دارند، طرفداران حریم خصوصی استدلال کرده اند که این هشدارها به اندازه کافی واضح نیستند. برخی از افراد حتی اپلیکیشن‌های تلفنی ساخته‌اند که می‌توانند عینک‌های هوشمند نزدیک خود را شناسایی کنند. توصیه دولت هلند به دنبال اقدام مشابهی از سوی دولت نروژ است که در ماه سپتامبر اعلام کرد در حال بررسی ممنوعیت دستگاه های مجهز به دوربین است. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها ه
