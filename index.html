 است. این نمایش پنج سال جلوتر می‌رود که سائورون (چارلی ویکرز) به قدرت می‌رسد، فرماندهی ارتش عظیم اورک‌ها را برعهده می‌گیرد و شروع به جمع‌آوری حلقه‌های حلقه‌ای می‌کند، معروف به مجریان ترسناک نازگول او. او چندین مرد را استخدام می کند تا برای افتخار یک حلقه زنی بجنگند، از جمله یک جنگجوی غافلگیرکننده: تئو (تایرو موهافیدین) که برنده می شود. داستان‌های مرتبط Invercine، Gema Films و Gaman Cine، تهیه‌کنندگان برتر صحنه فیلم-تلویزیون آمریکای لاتین، معرفی محصولات جدید به بازار مجموعه آزمایشگاه Sanfic Mórbido از کمدی هیولای بیگانه LGBTQ تا تمثیل ماپوچه، وحشت شدید و جنگ سرد، شهرها و شهرها را کنترل می‌کند. تلاش برای نگه داشتن و آزاد ماندن. اما فصل با یک یادداشت لطیف شروع می شود و به داستان عشق بین گالادریل (مرفید کلارک) و همسر گمشده اش سلبورن (جمی کمپبل بوئر) بازمی گردد. آنها در جوانی عاشق یکدیگر شده‌اند، اما از آن زمان جدا شده‌اند — فعلا. در حال حاضر، گالادریل و آروندیر (اسماعیل کروز کوردووا) با یک اورک به نام مارنوخ (آدام یانگ) ملاقات می‌کنند که از ارتش سائورون جدا می‌شود و قول می‌دهد که آنها را نزد یک آهنگر الف زندانی هدایت کند که می‌تواند برایشان حلقه بسازد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/LOTR_S3_UT_250616_ROTBEN_00003_R1_3000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۰ آبان • ۱۹:۴۵"}, {"source": "Billboard", "title": "Watch CoComelon’s Ms. Appleberry Sing Snuggly New Song ‘Happy Puppy’ From Interactive ‘Melon Patch’ Album", "link": "https://www.billboard.com/music/music-news/cocomelon-melon-patch-album-happy-puppy-video-ms-appleberry-1236378953/", "summary": "CoComelon has your preschooler s next favorite album on the way, and it s made for sing-along circle time. Music Me which includes 10 of Ms. Appleberry s interactive songs from the CoComelon live-action spin-off series The Melon Patch arrives Thursday on streaming, and Billboard Family is premiering the original single Happy Puppy below. Related CoComelon Puts a Peaceful Spin on Farmer in the Dell More Nursery Rhymes for New Lullabies Album CoComelon: The Movie Brings Baby JJ (And SZA) To the Big Screen: Watch the First Teaser Trailer CoComelon Is On a New Nursery Rhyme Journey With Melon Patch Series Album (And Yes, Wheels on the Bus Is Along for the Ride) In the clip, Ms. Appleberry (played by Allie Rivera Quiñonez, while pregnant with her third child) is surrounded by four parents wearing dog-ear headbands with their mini-mes all dressed in matching cozy puppy onesies. You are my puppy/ Make me so happy, Ms. Appleberry sings to the families. You are my puppy/ Happy puppy, happy/ I love you. The video also includes animated dogs that match the parent-toddler duos and footage of real puppies in a series of snuggly moments. Watch the Happy Puppy video below: The new episode of The Melon Patch that includes the Happy Puppy song also premieres on Thursday, on the show s YouTube channel . The Melon Patch premiered last year as a live-action expansion of the animated CoComelon world of baby JJ. The musical and interactive series intends to get kids moving, learning and growing with its sing-along songs, like the ones included on Music Me . Of course, CoComelon has a long history of music, including its classic “Wheels on the Bus” recording, which has had a consistent presence on Billboard ‘s Global charts thanks in part to its video’s heavy rotation on YouTube . The song has so far peaked at No. 88 on the Global 200 Excl. U.S. and has 9.7 billion views on YouTube since its 2018 debut. Also on the horizon: CoComelon: The Movie , hitting theaters on Feb. 19, with voice-acting work from R B superstar SZA and original music from pop hitmaker Justin Tranter.", "date_str": "2026-11-11T16:00:00+00:00", "hash": "7d14e99d7e1dcb39", "title_fa": "آهنگ جدید «Happy Puppy» از آلبوم تعاملی «Melon Patch» توسط CoComelon's Ms. Appleberry Siing Snuggly", "summary_fa": "CoComelon آلبوم مورد علاقه بعدی کودک پیش دبستانی شما را در راه است، و این آلبوم برای زمان دور هم آواز ساخته شده است. Music Me که شامل 10 آهنگ تعاملی خانم اپلبری از سری اسپین‌آف لایو اکشن کوکاملون The Melon Patch می‌شود، پنجشنبه در جریان پخش می‌شود و Billboard Family در زیر اولین تک آهنگ اصلی Happy Puppy را اجرا می‌کند. CoComelon مرتبط با مزرعه‌دار در دل چرخش صلح‌آمیز دارد. Along for the Ride) در کلیپ، خانم. Appleberry (با بازی Allie Rivera Quiñonez، در حالی که فرزند سوم خود را باردار است) توسط چهار پدر و مادر احاطه شده است که هدبندهای گوش سگی بسته اند و مینی مینی هایشان همگی لباس های مشابه توله سگ های دنج پوشیده اند. تو توله سگ من هستی/ خیلی خوشحالم کن، خانم اپل بری برای خانواده ها آواز می خواند. تو توله سگ من هستی/ توله سگ مبارک، شاد/ دوستت دارم. این ویدیو همچنین شامل سگ‌های متحرکی است که با زوج‌های والد-کودک مطابقت دارند و فیلم‌هایی از توله‌های واقعی در مجموعه‌ای از لحظات سخت. ویدیوی Happy Puppy را در زیر تماشا کنید: قسمت جدید The Melon Patch که شامل آهنگ Happy Puppy نیز می‌شود، در روز پنجشنبه در کانال YouTube برنامه پخش می‌شود. The Melon Patch سال گذشته به عنوان یک بسط لایو اکشن از انیمیشن دنیای کوکاملون بچه جی جی به نمایش درآمد. این مجموعه موزیکال و تعاملی قصد دارد بچه‌ها را به حرکت، یادگیری و رشد با آهنگ‌های خود مانند آهنگ‌هایی که در Music Me ارائه می‌کند، تشویق کند. البته، کوکاملون سابقه طولانی موسیقی دارد، از جمله ضبط کلاسیک «Wheels on the Bus»، که تا حدی به لطف چرخش شدید ویدیوی آن در یوتیوب، حضور ثابتی در نمودارهای جهانی بیلبورد داشته است. این آهنگ تاکنون در رتبه ۸۸ در Global 200 Excl قرار گرفته است. ایالات متحده است و از", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/melon-patch-2026-billboard-1800_65114a.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Fontaines D.C. Is in World-Beating Form on Dopamine Chamber Tour: 7 Best Moments From Amsterdam", "link": "https://www.billboard.com/lists/fontaines-dc-amsterdam-best-moments/", "summary": "For the past decade, the idea of a rock band once again capturing or defining the zeitgeist has been considered fanciful at best, or otherwise deluded. Genres rise and fall with popularity, but rock? The chances were slim, with culture geared towards solo pop acts, rapid rises for rappers and dance crossovers. Now, we have Fontaines D.C. to fly the flag. Since 2019, the Irish five-piece has worked diligently to become a contender: debut album Dogrel was a ramshackle arrival and 2020’s A Hero’s Death cut through despite the industry stasis of the pandemic . Skinty Fia (2022) proved that the band could further evolve and grow as songwriters, before 2024 s Romance brought Fontaines acclaim outside Europe and onto their big battleground: America. Romance featured a number of gigantic tunes – “Starburster” (195 million streams on Spotify); “Favourite” (131 million) – and landed the band its first Grammy nomination in the best rock album category. Fontaines lime-green aesthetic – slimier, sicklier than Charli’s shade of Brat – and fearless innovation marked the true arrival of a band who could attract cross generation fanbases and impress critically and commercially. Its follow-up, the recently-released Dopamine Chamber , is the group at the peak of its powers, embracing synth-pop, industrial sounds and classic songwriting for a critical and commercial smash. The album hit No. 1 in the UK Singles Chart and scored the year s third-biggest opening week , behind only Harry Styles and Olivia Rodrigo. On the Billboard 200 , they landed at No. 14, their highest-ever peak. Across Europe, the picture was similarly rosy, with No. 1s in the Netherlands, Portugal, Ireland and Belgium and top five finishes in Denmark, France, Poland, Sweden. Little surprise, then, that the band wanted to kick off the extensive live slate on the continent with a run of arena headline shows, which will hit the U.K. and Ireland in the coming weeks. Even bigger dates are set for 2027 including the London Stadium and a historic appearance at Slane Castle in Ireland. As Fontaines triumphant run begins in earnest, these were the seven best moments from the show at Amsterdam’s Ziggo Dome on Tuesday (Nov. 10).", "date_str": "2026-11-11T15:07:54+00:00", "hash": "877ac826e2b62e94", "title_fa": "Fontaines D.C در تور اتاق دوپامین در فرم جهانی است: 7 بهترین لحظه از آمستردام", "summary_fa": "در دهه گذشته، این ایده که یک گروه راک یک بار دیگر به ثبت یا تعریف زیتگیست بپردازد، در بهترین حالت خیالی و یا در غیر این صورت توهم انگاشته شده است. ژانرها با محبوبیت بالا و پایین می روند، اما راک؟ شانس بسیار اندک بود، با فرهنگ به سمت اجرای سولو پاپ، افزایش سریع رپرها و کراس اوورهای رقص. اکنون، ما Fontanes D.C را داریم که پرچم را برافراشته است. از سال 2019، این پنج قطعه ایرلندی سخت کوشید تا به یک رقیب تبدیل شود: اولین آلبوم Dogrel یک ورود سرسام آور بود و A Hero's Death در سال 2020 علیرغم رکود صنعت بیماری همه گیر، از بین رفت. Skinty Fia (2022) ثابت کرد که گروه می تواند به عنوان ترانه سرایان بیشتر تکامل یابد و رشد کند، قبل از اینکه رمانس در سال 2024 باعث تحسین فونتینز در خارج از اروپا و به میدان جنگ بزرگ آنها شد: آمریکا. عاشقانه تعدادی آهنگ غول پیکر را به نمایش گذاشت - \"Starburster\" (195 میلیون استریم در Spotify). \"مورد علاقه\" (131 میلیون) - و اولین نامزدی گرمی خود را در رده بهترین آلبوم راک برای گروه به ارمغان آورد. زیبایی‌شناسی سبز لیمویی فونتینز - باریک‌تر، بیمارگونه‌تر از سایه برات چارلی - و نوآوری بی‌باک، ورود واقعی گروهی را رقم زد که می‌توانست طرفداران بین نسلی را جذب کند و از نظر انتقادی و تجاری تحت تاثیر قرار دهد. دنباله‌ی آن، گروه دوپامین که اخیراً منتشر شده، گروهی است که در اوج قدرت خود قرار دارد و از صداهای سینت پاپ، صنعتی و ترانه‌سرایی کلاسیک برای یک فیلم انتقادی و تجاری استقبال می‌کند. این آلبوم در جدول تک‌آهنگ‌های بریتانیا رتبه 1 را کسب کرد و پس از هری استایلز و اولیویا رودریگو، سومین هفته افتتاحیه بزرگ سال را کسب کرد. در بیلبورد 200، آنها در رتبه 14 قرار گرفتند که بالاترین قله", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/fontaines-dc-oslo-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۸:۳۷"}, {"source": "Deadline", "title": "Paul Wesley Latest To Join Netflix’s ‘Icebreaker’", "link": "https://deadline.com/2026/11/icebreaker-netflix-series-adds-paul-wesley-1237219361/", "summary": "EXCLUSIVE: Paul Wesley, of Star Trek: Strange New Worlds and The Vampire Diaries, is the newest addition to the cast of Netflix s college romance drama series Icebreaker, based on the #1 New York Times bestseller by Hannah Grace. Wesley will play Coach Neil Faulkner. He joins the previously announced Daisy Jelley, Connor Simos, Gabriel Tierney, [ ]", "date_str": "2026-11-11T16:00:00+00:00", "hash": "157d8414ee7e6ce3", "title_fa": "پل وسلی آخرین پیوسته به «یخ شکن» نتفلیکس", "summary_fa": "اختصاصی: پل وسلی، از Star Trek: Strange New Worlds و The Vampire Diaries، جدیدترین اثر اضافه شده به مجموعه بازیگران سریال درام عاشقانه دانشگاهی Icebreaker نتفلیکس است که بر اساس پرفروش‌ترین پرفروش نیویورک تایمز اثر هانا گریس است. وسلی نقش مربی نیل فاکنر را بازی خواهد کرد. او به دیزی جیلی، کانر سیموس، گابریل تیرنی که قبلاً اعلام شده بود، می‌پیوندد، [ ] انحصاری: پل وسلی، از Star Trek: Strange New Worlds و The Vampire Diaries، جدیدترین اضافه شده به مجموعه بازیگران سریال درام عاشقانه دانشگاهی نتفلیکس است که بر اساس بهترین فیلم Hannah Times #1 ساخته شده است. در اینجا لاگ لاین برای Icebreaker است: او توپچی انتقال طلای المپیک است. او ستاره پردیس در تعقیب NHL است. اما وقتی یک تصادف تیم‌هایشان را مجبور می‌کند تا یک پیست را به اشتراک بگذارند، آناستازیا آلن (جلی) و نیت هاوکینز (سایموس) با هم برخورد می‌کنند – و نظم جای خود را به وسواس می‌دهد، زیرا تنها چیزی که خطرناک‌تر از خواستن برنده شدن است، خواستن یکدیگر است. اخبار مرتبط اخبار فصل ششم تریلر Emily In Paris به سمت پایین Memory Lane از فرانسه رم به آخرین داستان در یونان اخبار خالق Empress Katharina Eyssen در مورد احساس ترکیبی از احساسات با پایان یافتن موفقیت نتفلیکس، اسپین آف بالقوه سریال آینده Witches، عنوان اصلی سریال Maplea هیل‌آف Maplea0 هفته های متوالی در فهرست پرفروش ترین های نیویورک تایمز. این رمان که در نوامبر 2022 منتشر شد و در سال 2023 منتشر شد، نزدیک به 5 میلیون نسخه پارسونز، خریداری شده برای ایالات متحده توسط Dark Sky Films (اختصاصی)", "summary_fa": "در سی امین سالگرد تراژدی دروازه بهشت ​​- خودکشی دسته جمعی بدنام اعضای یک فرقه مذهبی کالیفرنیایی - فیلمی با جزئیات داستان در سینماها پخش می شود. The Leader، یک مهیج جنایی جنایی واقعی با بازی ورا فارمیگا، تیم بلیک نلسون و جیم پارسونز، توسط Dark Sky Films برای توزیع در ایالات متحده انتخاب شده است، [ ] The Leader، یک جنایی جنایی واقعی با بازی ورا فارمیگا، تیم بلیک نلسون و جیم پارسونز، برای پخش در ایالات متحده انتخاب شده است. توزیع توسط Dark Sky Films، که قصد دارد فیلم را در اواخر مارس 2027، تا سی امین سالگرد اکران کند. داستان‌های مرتبط بازگشت تام هنکس به برادوی پس از 14 سال برای نمایش جدید This World of Tomorrow شما در برادران وارنر راه‌اندازی مجدد نامه دریافت کردید. از مایکل گالاگر نویسنده و کارگردان و همچنین با بازی گریس کارولین کری و سایمون رکس، این فیلم اولین نمایش جهانی خود را در جشنواره فیلم Tribeca در جشنواره امسال داشت. بررسی Variety می‌گوید این قوی‌ترین درام درباره زندگی درون یک فرقه از زمان مارتا مارسی می مارلن است. Exchange/Voltage مناطق باقی مانده را در AFM مدیریت می کند، با چندین منطقه اصلی که قبلاً به توزیع کنندگان تئاتر فروخته شده است. طبق توضیحات، The Leader در پس زمینه یکی از عجیب ترین و ویرانگرترین فصل های تاریخ آمریکا قرار دارد. داستان مارشال هرف اپل وایت (نلسون)، معلم موسیقی سابق، و بانی لو نتلز (فارمیگا)، پرستاری است که ملاقات تصادفی او در اوایل دهه 1970 جرقه یک شراکت معنوی خارق‌العاده می‌دهد. این زوج که متقاعد شده اند برای هدایت بشریت به سوی سطح بالاتری از هستی انتخاب شده اند، دروازه بهشت ​​را تأسیس می کنند و پیروانی را جذب می کنند که مایل به تسلیم دارایی های خود، ترک خانواده و قطع روابط با دنیای خارج هستند. خلاصه داستان می افزاید:", "image_url": "https://variety.com/wp-content/uploads/2026/11/TheLeader_Applewhite.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۹:۰۰"}, {"source": "Variety", "title": "Usher and Chris Brown Cancel Two More Performances as Feud Reports Heat Up", "link": "https://variety.com/2026/music/news/usher-chris-brown-cancel-two-concerts-feud-1236945101/", "summary": "Amid reports of an ongoing feud, Usher and Chris Brown have canceled two more performances on their dual-headlining “R B Tour,” bringing the total number of canceled concerts to six. The canceled dates were all added to the tour’s original itinerary in August. The latest cancellations are the November 16 performance at Los Angeles’ SoFi Stadium [ ]", "date_str": "2026-11-11T15:09:40+00:00", "hash": "234b77c10ef67276", "title_fa": "آشر و کریس براون دو اجرای دیگر را با داغ شدن گزارش های Feud لغو کردند", "summary_fa": "در بحبوحه گزارش‌هایی مبنی بر درگیری‌های مداوم، آشر و کریس براون دو اجرای دیگر را در تور دو تیتراژ R B خود لغو کردند و تعداد کل کنسرت‌های لغو شده را به شش رساندند. تاریخ های لغو شده همگی به برنامه سفر اصلی تور در ماه اوت اضافه شدند. آخرین لغو، اجرای 16 نوامبر در استادیوم سوفای لس آنجلس است [ ] این لغو در میان گزارش های گسترده اما تایید نشده دعوای بین این دو سرگروه انجام شد و شایعاتی مبنی بر وقوع یک مشاجره با صدای بلند پشت صحنه در آتلانتا رخ داد. نمایندگان این دو هنرمند و Live Nation، مجری تور، بلافاصله به درخواست‌های Variety برای اظهار نظر پاسخ ندادند. لغو قبلی در بالتیمور، سینسیناتی، کارولینای جنوبی و ایندیاناپولیس بود. طبق بیانیه ای از استادیوم لوکاس اویل ایندیاناپولیس به نقل از تیکت نیوز، در آن زمان، برگزارکنندگان نیاز به اولویت دادن به سلامت و رفاه مهمانی و خدمه تور را ذکر کردند. این بیانیه ادامه داد: درخواست‌های یک تور با این طول و مقیاس قابل توجه است و این تنظیمات به تور اجازه می‌دهد تا با خیال راحت و پایدار در اجرای برنامه‌های باقی‌مانده ادامه یابد. معمولاً، نمایش‌های لغو شده نتیجه بیش از حد در نظر گرفته می‌شوند - که تقاضای بلیت قبلاً تا حد زیادی برآورده شده بود. با این حال، آنها پس از کنسرت جنجالی 5 نوامبر در استادیوم مرسدس بنز در آتلانتا آمدند، که با تاخیرهای طولانی، مشکلات کیفیت صدا و عدم اجرای این زوج، مانند تاریخ های قبلی تور، همراه بود. طبق گزارشی در TMZ، اختلاف بر سر زمان شروع کنسرت بود و براون استدلال کرد که نمایش را برای طرفدارانی که در ترافیک شدید محلی گرفتار شده بودند به تأخیر بیاندازد. نمایش سه ساعت به تعویق افتاد و خشم هواداران را برانگیخت.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Untitled_e8b05d.jpg?w=800&#038;h=536&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲۰ آبان • ۱۸:۳۹"}, {"source": "Billboard", "title": "Stove God Cooks & Swizz Beatz Talk Making ‘All This For Me?’: ‘Album of the Decade’", "link": "https://www.billboard.com/music/rb-hip-hop/stove-god-cooks-swizz-beatz-all-this-for-me-interview-1236378722/", "summary": "Stove God Cooks is finally ready to follow up his underground classic Reasonable Drought , which he dropped alongside Roc Marciano back in 2020. Since then, he s been on an impressive feature run (mainly on Grisleda records) and has had to deal with a plethora of leaks that have only sent demand for a sophomore album to a fever pitch, especially after his scene-stealing chorus on the Clipse s LET GOD SORT EM OUT standout F.I.C.O. Now, after a year of label drama and false starts — including one scrapped project in Goat Stamp , and a March 27 release date for the album we re here to talk about — his parent label Babygrande has a entered a joint partnership with Warner Records in an effort to finally give fans what they ve been waiting for in a new full-length album. Part of the reason for the delay has been because Stove wasn t really aware of how things worked on the sample-clearing side of the business — because he s used to working alongside prolific rappers like Griselda Records founder Westside Gunn, who craft albums and drop them in a span of a week. I didn t understand a lot of s—t, you know? So, things that was pissing me off, it was really the way I was seeing s—t, he explains to me over Zoom. My references wasn t the way s—t really go. I m seeing my people move this way. Why we taking so long to drop albums? I see West drop an album in three days. I know he got samples in his s—t. I m on the songs. So, it s that kind of s—t. But once you rip the sheet off and Gunn starts telling me about the lawsuits and s—t that he deals with, I m like, Oh, no, this s—t is for real.' Now, alongside legendary producer Swizz Beatz , he s finally beginning the rollout for his long-awaited sophomore album All This For Me? They first dropped the warm up single, Welcome to My Garden , earlier this year in February (which has been elevated, according to Stove and Swizz) and the duo recently released the project s second single and music video in Stovie s Home (Down Down) this past Friday (Nov. 6). And the Syracuse, N.Y. rapper is excited for his fans to finally hear what he s been working on and put the rollercoaster that was this past year behind him. The s—t is a super blessing, man, he says. That s the reality of this moment for me right now. All the other s—t, the old s—t, none of s—t matter to me right now. Check out my conversation with Stove God Cooks Swizz Beatz below as we talk their creative process, their chemistry and what fans can expect once they finally g", "date_str": "2026-11-11T15:00:00+00:00", "hash": "99f140d41ff9122c", "title_fa": "Stove God Cooks & Swizz Beatz Talk Making \"All This For Me?\": \"Album of the Decade\"", "summary_fa": "Stove God Cooks بالاخره آماده است تا فیلم کلاسیک زیرزمینی خود یعنی Reasonable Dought را که در سال 2020 در کنار راک مارسیانو عرضه کرد، دنبال کند. از آن زمان، او در یک مجموعه موسیقی چشمگیر (عمدتاً در رکوردهای Grisleda) بوده است و مجبور شده است با انبوهی از درزها دست و پنجه نرم کند که تقاضا برای یک آلبوم جدید را به خصوص پس از یک صحنه جدید در سال دوم او ارسال کرده است. Clipse s LET GOD SORT EM OUT OUT F.I.C.O. اکنون، پس از یک سال سریال درام و شروع اشتباه - از جمله یک پروژه منسوخ شده در Goat Stamp و تاریخ انتشار 27 مارس برای آلبومی که ما اینجا هستیم تا در مورد آن صحبت کنیم - لیبل مادر او Babygrande با Warner Records وارد همکاری مشترک شده است تا در نهایت به طرفداران آنچه که در یک آلبوم کامل جدید منتظرش بودند ارائه دهد. بخشی از دلیل تأخیر به این دلیل بوده است که استو واقعاً از نحوه کار در بخش پاکسازی نمونه کار آگاه نبود - زیرا او عادت داشت در کنار رپرهای پرکار مانند وست ساید گان، بنیانگذار Griselda Records کار کند، که آلبوم‌ها را می‌سازند و در یک بازه زمانی یک هفته منتشر می‌کنند. من خیلی از s-t را متوجه نشدم، می دانید؟ بنابراین، چیزهایی که من را عصبانی می‌کردند، واقعاً همان چیزی بود که من s-t را می‌دیدم، او در زوم برای من توضیح می‌دهد. ارجاعات من واقعاً راهی نبود. من می بینم که مردم من به این سمت حرکت می کنند. چرا ما اینقدر طول می کشیم تا آلبوم ها را منتشر کنیم؟ من می بینم که وست یک آلبوم را در سه روز منتشر می کند. من می دانم که او نمونه هایی را در s-t خود دریافت کرد. من روی آهنگ ها هستم بنابراین، این همان", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/stove-god-cooks-swizz-beatz-press-photo-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Diplo and Former Downtown Music CEO Andrew Bergman Launch Indie Publisher Bison Music", "link": "https://www.billboard.com/pro/diplo-andrew-bergman-bison-music/", "summary": "Diplo and Andrew Bergman , the former CEO of Downtown Music, are launching Bison Music, an independent music publisher focused on signing and developing songwriters early in their careers. Bergman will serve as the company s CEO, working alongside COO Tom Lee , CCO Juba Lee and general manager Jenny Ilibassi . The company s roster of songwriters includes Picard Bros., Leclair, Maesic, Nitti, Kaien Cruz, BomboCat, Akira Evans and Groupthink, a group whose credits span songs for artists including BTS, Dua Lipa, Bad Bunny and JENNIE. Related UMG s $775M Downtown Deal Secures EU Approval With Remedies Attached Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Agents Look Ahead as AI Keeps Advancing: We Have the Privilege of Being in a Human Industry Bison is positioning itself in contrast to a current publishing landscape that s has been dominated by catalog acquisition. Rather than buying existing intellectual property, the company says its focused on long-term artist development and making fresh, original music written by real people to connect with a global audience. “For me, there’s still nothing more exciting in music than discovering a great song from someone you’ve never heard of,” Bergman says in a press release. “That’s always been at the core of what makes music publishing a great business. And it’s what excited me about partnering with Diplo, one of the leading creative forces in the modern music business, and tmwrk, his management team and longtime business partners. We’re designed to identify and sign writers early, nurture them through the harsh realities of the music business and allow them to reap the benefits of their creative endeavors. Writers and the music publishers that serve them are at their best when they are in a collaborative mode, and we intend to operate that way internally and externally.” Diplo, who initially formed Bison before bringing Bergman on as a partner, framed the launch as a response to a moment of creative stagnation in the industry. “At a moment when it feels like music needs an injection of originality, our writers are in a position to shape where music goes next,” he says. “Andrew and I are creating a home for those writers, with a team that knows how to develop them and a company built to back them for the long term.” Bison is based in New York and Los Angeles. Additional signings will be announced in the coming months.", "date_str": "2026-11-11T15:00:00+00:00", "hash": "d4115e0138602ac2", "title_fa": "Diplo و مدیر عامل سابق Downtown Music اندرو برگمن ناشر Indie Bison Music را راه اندازی کردند.", "summary_fa": "دیپلو و اندرو برگمن، مدیر عامل سابق Downtown Music، در حال راه اندازی Bison Music، یک ناشر موسیقی مستقل هستند که بر روی امضای قرارداد و توسعه ترانه سرایان در ابتدای کار خود متمرکز است. برگمن به rent Hubert join Billboard On The Record host Kristin Robinson in an exclusive interview to break down the deal and what it means for the future of music publishing. They discuss how their new business arrangement will work, how many millions they’ve each spent on music catalogs this year and why it seems acquisitions and mergers have become the music industry norm in 2026. Love what you hear? Don’t forget to rate, review and subscribe so you never miss an episode of Billboard On The Record . Follow Billboard On The Record on Instagram , TikTok , Apple Podcasts , Spotify and YouTube @billbo a rd so you never miss an episode. Billboard On The Record is a podcast in partnership with SickBird Productions. Kristin Robinson: We re here to talk about the fact that Primary Wave has acquired Kobalt, and you re the CEO of Primary Wave, you re the CEO of Kobalt. Larry Mestel: We re one of the largest music companies in the world now, probably the largest owner of legendary music. It s Prince and Bob Marley and Stevie Nicks and Whitney Houston and James Brown. We provide a very unique service, which is, hey, you want a bio film, we can produce it. You want a documentary, we can produce it. You want a Broadway show, we can produce it. You want an immersive experience, we re creating eight right now. I think one of the most unique and interesting things that you guys have done is the Whitney Houston slot machines. Larry Mestel: Yeah. We re making more money for the estate of Whitney Houston than the entire estate was generating six and a half years ago when we bought into the estate. 150,000 songs being uploaded every day, how does that change the nature of what you guys do? Laurent Hubert: This is a topic that we talk about almost every day, and it s a challenge. The music industry in recent years has started to see a lot of these kind of acquisitions and mergers of major companies, and I m wondering why you think these acquisitions and this consolidation is happening now. Larr ate": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
