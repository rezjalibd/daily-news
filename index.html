      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;

      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }

      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

ان اطلاع", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/ec2d/live/8c3f6e60-e8e8-11f1-8808-1d4222955d7e.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۴ آذر • ۱۹:۵۳"}, {"source": "Radio Farda", "title": "بسنت: ایران دیگر حتی یک قطره نفت روی دریا برای فروش ندارد", "link": "https://www.radiofarda.com/a/bessent-iran-oil-on-water-zero-dollar-292000-economic-crisis/33905806.html", "summary": "بسنت بار دیگر از صفر شدن نفت قابل فروش ایران روی دریا خبر داد؛ هم‌زمان دلار در بازار آزاد از ۲۹۰ هزار تومان گذشت و فشارهای اقتصادی بر ایران افزایش یافت.", "date_str": "2026-11-25T16:11:13+00:00", "hash": "5ed35076652a024e", "title_fa": "بسنت: ایران دیگر حتی یک قطره نفت روی دریا برای فروش ندارد", "summary_fa": "بسنت بار دیگر از صفر شدن نفت قابل فروش ایران روی دریا خبر داد؛ هم‌زمان دلار در بازار آزاد از ۲۹۰ هزار تومان گذشت و فشارهای اقتصادی بر ایران افزایش یافت. اسکات بسنت، وزیر خزانه‌داری آمریکا، اعلام کرد که جمهوری اسلامی از زمان آغاز عملیات «انزوای اقتصادی» آمریکا در ماه اوت تاکنون، موفق به بارگیری حتی یک نفتکش نشده و دیگر هیچ محمولۀ نفتی روی دریا برای فروش ندارد. بسنت روز چهارشنبه چهارم آذر در پیامی در شبکۀ ایکس با اشاره به تأثیر فشارهای اقتصادی آمریکا نوشت: «رژیم ایران یک کشتی در حال غرق شدن است.» او همراه این پیام ویدئویی گرافیکی منتشر کرد که کاهش تدریجی حجم نفت ایران روی آب و رسیدن آن به صفر را نشان می‌دهد. وزیر خزانه‌داری آمریکا پیش‌تر در روز ۲۸ مهر نیز گفته بود که از ماه اوت هیچ نفتکشی در تأسیسات نفتی جزیرۀ خارگ بارگیری نکرده و ایران دیگر محمولۀ نفتی روی دریا ندارد. بسنت اوایل مهرماه اعلام کرده بود که حدود ۱۵ میلیون بشکه نفت ایران همچنان در مسیر تحویل، عمدتاً به چین، قرار دارد و پس از تحویل این محموله‌ها، تهران دیگر نفتی برای فروش نخواهد داشت. داده‌های اولیه ردیابی نفتکش‌ها که پیش‌تر از سوی بلومبرگ و شرکت‌های کپلر و ورتکسا منتشر شده بود نیز نشان می‌داد که در ماه سپتامبر هیچ بارگیری نفت خامی از بنادر ایران ثبت نشده است. وزارت خزانه‌داری آمریکا روز ۲۹ آبان در اطلاعیه‌ای تأکید کرده بود که دیگر نفتی برای فروش در خارج از محدو ریجی حجم نفت ایران در دریا و رسیدن آن به صفر را نشان می‌دهد. وزیر خزانه‌داری آمریکا پیش‌تر نیز گفته بود از ماه اوت هیچ نفتکشی در تاسیسات نفتی جزیره خارگ بارگیری نکرده و ایران دیگر محموله نفتی روی آب برای فروش ندارد. او اوایل مهر اعلام کرده بود حدود ۱۵ میلیون بشکه نفت ایران همچنان در مسیر تحویل، عمدتا به چین، قرار دارد و پس از تحویل این محموله‌ها، تهران نفتی برای فروش نخواهد داشت. داده‌های ردیابی نفتکش‌ها که پیش‌تر بلومبرگ و شرکت‌های کپلر و ورتکسا منتشر کرده بودند نیز از ثبت نشدن بارگیری نفت خام از بنادر ایران در ماه سپتامبر حکایت داشت. دولت آمریکا دوم شهریور عملیات «انزوای اقتصادی» را با هدف قطع مسیرهای درآمدی جمهوری اسلامی از طریق تشدید تحریم‌ها علیه صادرات نفت، شبکه‌های مالی و شرکت‌های مرتبط با دور زدن تحریم‌ها آغاز کرد. وزارت خزانه‌داری آمریکا نیز در روزهای اخیر تحریم‌های تازه‌ای علیه افراد و شبکه‌های مرتبط با فروش نفت ایران و انتقال درآمدهای آن اعمال کرده است. هم‌زمان با تشدید فشارهای اقتصادی و تحریم‌های آمریکا، بازار ارز ایران نیز با افزایش قیمت‌ها روبه‌رو است. بر اساس نرخ‌های ثبت‌شده در سایت نوسان در صبح چهارشنبه، دلار آمریکا از ۲۹۲ هزار تومان عبور کرد، یورو به بیش از ۳۲۰ هزار تومان و پوند بریتانیا به حدود ۳۸۲ هزار تومان رسید. دلار کانادا نیز از ۲۰۴ هزار تومان فراتر رفت. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/-1x-1_MNbD__v1024x512__box_0%2C44%2C2000%2C1095.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["بورس و طلا", "روابط بین‌الملل"], "datetime_fa": "۴ آذر • ۱۹:۱۲"}, {"source": "Euronews Persian", "title": "سوءاستفاده جنسی از کودکان؛ ایتالیا طی دو دهه ۵۷ کشیش را زندانی کرده است", "link": "https://parsi.euronews.com/2026/11/25/child-sexual-abuse-italy-has-imprisoned-57-priests-over-two-decades", "summary": "۳۷۸ پرونده در بازه زمانی ۲۰۰۱ تا ۲۰۲۱ میلادی به مقامات کلیسا گزارش شده‌اند. این پرونده‌ها دربرگیرنده ۸۸۰ مورد جداگانه هستند که در آن‌ها ۳۵۶ فرد متهم به سوءاستفاده و ۳۸۵ قربانی دخیل تان با ورود به ایستگاه فضایی چین تاریخ‌ساز شد", "link": "https://www.radiofarda.com/a/pakistani-astronaut-becomes-first-foreigner-to-board-china-s-tiangong-space-station/33905745.html", "summary": "محمد ذیشان علی به‌عنوان نخستین فضانورد پاکستان در مأموریتی مشترک با دو فضانورد چینی وارد ایستگاه فضایی تیان‌گونگ شد. او همچنین اولین فضانورد غیر چینی است که وارد این ایستگاه می‌شود", "date_str": "2026-11-25T14:42:40+00:00", "hash": "ba113ac1c2956695", "title_fa": "نخستین فضانورد پاکستان با ورود به ایستگاه فضایی چین تاریخ‌ساز شد", "summary_fa": "محمد ذیشان علی به‌عنوان نخستین فضانورد پاکستان در مأموریتی مشترک با دو فضانورد چینی وارد ایستگاه فضایی تیان‌گونگ شد. او همچنین اولین فضانورد غیر چینی است که وارد این ایستگاه می‌شود محمد ذیشان علی، نخستین فضانورد پاکستان، روز چهارشنبه چهارم آذرماه، به نخستین فضانورد غیر چینی تبدیل شد که وارد ایستگاه فضایی «تیانگونگ» چین شده است؛ رویدادی که نه‌تنها لحظه‌ای تاریخی برای بلندپروازی‌های علمی پاکستان را رقم زد، بلکه نشانه‌ای از تلاش‌های پکن برای گسترش دیپلماسی فضایی‌اش هم به‌شمار می‌آید. این خلبان ۴۰ ساله که نخستین پاکستانیِ حاضر در مدار زمین است، به عنوان «متخصص محموله» فعالیت می‌کند و قرار است بین پنج تا ۱۰ روز در این ایستگاه اقامت داشته باشد. خدمۀ سه نفرۀ مأموریت فضایی «شنژو-۲۴»، حدود شش ساعت پس از پرتاب از «مرکز پرتاب ماهواره جیوچوان» در شمال غربی چین، با استفاده از موشک «لانگ مارچ-۲ اف»، در ساعت ۱۴:۳۵ به وقت محلی، مطابق با ۱۰:۰۵ به وقت تهران، وارد ایستگاه تیانگونگ شدند. اعضای جدید، شامل فرمانده چینی «تانگ هونگ‌بو» و مهندس پرواز «وو یی» به همراه محمد ذیشان علی با استقبال گرم سه فضانورد مأموریت «شنژو-۲۳» که از قبل در ایستگاه مستقر بودند، روبه‌رو شدند. محمد ذیشان علی برای آمادگی جهت این پرواز، هفت ماه در پکن تحت آموزش بود. او در این مدت در کلاس‌های فشرده زبان چینی شرکت و حتی روی فرهنگ عمومی چین هم مطالعه کرد؛ موضوعی که به‌گفتۀ خودش، گرچه بزرگترین چالش این دورۀ آموزشی بوده، اما برای ارتباط فعال با فضانوردان چینی و مرکز کنترل زمینیِ ایستگاه، ضروری است. ذیشان علی در طول حضورش در ایستگاه فضایی چین، در انجام آزمایش‌هایی هم مشارکت خواهد کرد؛  بزرگ‌ترین شرکای تجاری خود تعرفه‌های گمرکی جدید اعلام کرد. این تعرفه‌ها پس از «تحقیقات بر اساس بخش ۳۰۱ قانون تجارت آمریکا» اعمال شده‌اند. این نوعی تحقیق تجاری را دولت ایالات متحده برای بررسی اقدامات تجاری کشورهایی انجام می‌دهد که احتمال‌ می‌رود تجارت با آنها ناعادلانه یا ناقض قوانین است. اقتصادهایی که مشمول این تحقیقات قرار گرفته‌اند عبارتند از: چین، اتحادیه اروپا، سنگاپور، سوئیس، اندونزی، مالزی، کامبوج، تایلند، کره جنوبی، ویتنام، تایوان، بنگلادش، ژاپن و هند. بر این اساس، تعرفه‌های متفاوتی برای کشورهای مختلف و محصولات گوناگون اعمال خواهد شد. چین با بالاترین نرخ تعرفه، یعنی «تا سقف ۴۰ درصد»، مواجه است. پس از آن، ویتنام با حداکثر ۳۵ درصد قرار دارد. تعرفه برای سایر کشورها حدود ۲۰ یا ۲۵ درصد خواهد بود. با این حال، نرخ مؤثر تعرفه برای برخی از این کشورها کاهش خواهد یافت، چرا که دونالد ترامپ پیش‌تر برای تعرفه‌ها سقف‌هایی تعریف کرده بود و بر همین اساس میزان آن‌ها از حد مشخصی فراتر نخواهد رفت.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/b0be/live/519ce4e0-e8d9-11f1-a094-5fdc692f3e33.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۴ آذر • ۱۷:۴۶"}],
      tech: [{"source": "TechCrunch Main", "title": "X’s latest update for creators focuses on vertical video", "link": "https://techcrunch.com/2026/11/25/xs-latest-update-for-creators-focuses-on-vertical-video/", "summary": "As short-form video ramps up in popularity, X's new creation tools are part of its effort to compete with YouTube and Instagram.", "date_str": "2026-11-25T17:28:29+00:00", "hash": "22e459fb879c559d", "title_fa": "آخرین به‌روزرسانی X برای سازندگان بر ویدیوی عمودی تمرکز دارد", "summary_fa": "با افزایش محبوبیت ویدیوهای کوتاه، ابزارهای جدید ایجاد X بخشی از تلاش آن برای رقابت با یوتیوب و اینستاگرام است. X روز چهارشنبه ابزارهای ایجاد جدیدی را معرفی کرد که بسیاری از آنها بر روی ویدیوهای عمودی کوتاه متمرکز بودند. به‌روزرسانی‌ها بخشی از تلاش پلتفرم برای رقابت با شبکه‌های اجتماعی مانند یوتیوب و اینستاگرام است زیرا محبوبیت این قالب همچنان در حال افزایش است. این ابزارها برای کمک به سازندگان برای ساخت ویدیوهای عمودی با کیفیت حرفه ای، به اشتراک گذاری آسانتر محتوای اصلی و کسب درآمد بیشتر طراحی شده اند. آنها همچنین به سازندگان راه‌های بیشتری برای ضبط، ویرایش و انتشار مستقیم محتوا در پلتفرم بدون اتکا به برنامه‌های شخص ثالث می‌دهند. یکی دیگر از موارد کلیدی یک ویرایشگر رسانه ارتقا یافته است که به سازندگان اجازه می‌دهد بدون ترک X فیلم‌های عمودی صیقلی تولید کنند. این شرکت گفت که ویژگی‌های ضبط شامل توانایی ضبط ویدیو در بخش‌ها و استفاده از جلوه‌های صفحه سبز است. ویرایشگر همچنین طیف وسیعی از ابزارهای پس از تولید را ارائه می دهد. سازندگان می‌توانند ویدیوهای افقی را به فرمت عمودی تبدیل کنند، به‌طور خودکار زیرنویس تولید کنند، فیلم را کوتاه کنند، پوشش‌های متنی اضافه کنند، تصاویر کوچک سفارشی را انتخاب کنند و عکس‌ها را قبل از انتشار تنظیم کنند. به لطف به‌روزرسانی اخیراً اعلام‌شده، کاربران اکنون می‌توانند تا 20 عکس و ویدیو را به یک پست اضافه کنند، که مخاطبان می‌توانند به صورت افقی روی آن‌ها بکشند. X می گوید این ویژگی برای به اشتراک گذاری خلاصه رویدادها، لحظات پشت صحنه و راه اندازی محصول در نظر گرفته شده است. X گفت که در دسترس بودن ویژگی های جدید بسته به منطقه متفاوت است. در اوایل این ماه، این شرکت یک ویژگی کلیپ را معرفی کرد که به کاربران امکان می‌دهد قطعه‌هایی از ویدیوهای طولانی‌تر بگیرند، نظرات خود را اضافه کنند و کلیپ‌ها", "image_url": "https://techcrunch.com/wp-content/uploads/2026/01/GettyImages-2258168632.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۲۰:۵۸"}, {"source": "Business Insider", "title": "Terence Tao calls for a transition to ‘math 2.0’ in the wake of AI bombshells", "link": "https://www.businessinsider.com/terence-tao-reimann-hypothesis-math-ai-solutions-advice-anthropic-openai-2026-11", "summary": "UCLA math professor Terence Tao says math needs to undergo a transition. Richard Hartog/Los Angeles Times via Getty Images Terence Tao is going scorched-earth as AI unsettles mathematics. The UCLA professor said incentive structures and academic journals need to change — and quickly. Tao laid out his vision before an Anthropic researcher solved math's most famous problem using AI. Terence Tao is calling for radical change. The UCLA math phenom, viewed by many as a thought leader in the field, recently said mathematicians are living in the past if they think they can maintain their old values and stay relevant in the age of AI . \"Math 1.0 is going to have to transition into what I call math 2.0,\" Tao said at Harvard University last week. To start with, Tao said that solving problems should no longer be the lodestar of mathematical research . Now that AI can tackle dense conjectures more efficiently than humans can, dying on that hill would be foolish, he said. \"Further blind optimization of problem-solving alone is now actively harmful to the long-term health of mathematics,\" his slideshow presentation read. Instead, Tao said mathematicians should focus on subjects that humans already excel at, like explaining what AI-generated solutions actually mean and extrapolating new problems from them. And getting work published in academic journals, once a prestigious accolade for mathematicians, is rapidly losing its value, he said. As submission inboxes become flooded with AI-generated research by less and less capable mathematicians, who in many cases don't even understand what they're submitting, Tao said journals need to rethink their values or lose their importance. \"We can't go by just how many papers you have in the top journals anymore,\" he said, adding that mathematicians should earn clout only if they can explain their research before human inquisitors. Tao laid out his vision to a room full of Harvard mathematicians shortly before the math community was once again rocked by a bombshell AI solution — this time for the most famous open question in all of mathematics. On Friday, a mathematician employed by Anthropic said he cracked the Riemann Hypothesis using Claude. Mathematicians told Business Insider that the breakthrough is a huge deal. Steven Strogatz, a professor at Cornell, called the problem the \"white whale\" of the field. In an interview on the \"Numberphile\" podcast last month, Tao said humans working with AI models wouldn't \"make progress\" on the", "date_str": "2026-11-25T16:57:47+00:00", "hash": "3cf767b79b1c96db", "title_fa": "ترنس تائو خواستار انتقال به \"ریاضی 2.0\" در پی بمب‌های هوش مصنوعی است.", "summary_fa": "ترنس تائو، استاد ریاضی دانشگاه UCLA، می گوید که ریاضیات باید یک مرحله گذار را طی کند. ریچارد هارتوگ / لس آنجلس تایمز از طریق گتی ایماژ ترنس تائو در حال سوختن است زیرا هوش مصنوعی ریاضیات را متزلزل می کند. استاد دانشگاه UCLA گفت ساختارهای انگیزشی و مجلات دانشگاهی باید - و به سرعت - تغییر کنند. تائو چشم انداز خود را قبل از اینکه یک محقق Anthropic معروف ترین مسئله ریاضی را با استفاده از هوش مصنوعی حل کند، بیان کرد. ترنس تائو خواستار تغییرات بنیادی است. پدیده ریاضی UCLA، که توسط بسیاری به عنوان یک رهبر فکری در این زمینه تلقی می شود، اخیراً گفت که ریاضیدانان اگر فکر می کنند می توانند ارزش های قدیمی خود را حفظ کنند و در عصر هوش مصنوعی مرتبط بمانند، در گذشته زندگی می کنند. تائو هفته گذشته در دانشگاه هاروارد گفت: \"ریاضی 1.0 باید به چیزی که من ریاضی 2.0 می نامم تبدیل شود.\" برای شروع، تائو گفت که حل مسائل دیگر نباید ستاره تحقیقات ریاضی باشد. او گفت که اکنون که هوش مصنوعی می تواند حدس های متراکم را کارآمدتر از انسان ها کنترل کند، مردن در آن تپه احمقانه خواهد بود. در ارائه نمایش اسلاید وی آمده است: «بهینه سازی کور بیشتر حل مسئله به تنهایی اکنون به طور فعال برای سلامت بلندمدت ریاضیات مضر است. درعوض، تائو گفت که ریاضیدانان باید روی موضوعاتی تمرکز کنند که انسان‌ها در حال حاضر در آنها برتری دارند، مانند توضیح اینکه راه‌حل‌های تولید شده توسط هوش مصنوعی واقعاً چه معنایی دارند و مسائل جدید را از آنها برون‌یابی کنند. او گفت و چاپ کار در مجلات دانشگاهی که زمانی افتخاری معتبر برای ریاضیدانان بود، به سرعت ارزش خود را از دست می دهد. از آنجایی که صندوق‌های ورودی ارسال‌ها مملو از تحقیقات تولید شده توسط هوش مصنوعی توسط ریاضیدانان کمتر", "image_url": "https://i.insider.com/6b06ef1bd6c5d341c9b4d207?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic"], "datetime_fa": "۴ آذر • ۲۰:۲۷"}, {"source": "Ars Technica", "title": "Etsy clarifies AI terms after seller backlash", "link": "https://arstechnica.com/tech-policy/2026/11/etsy-clarifies-ai-terms-after-seller-backlash/", "summary": "After backlash from sellers frustrated by Etsy’s new AI policies, which appeared to allow the company to train AI on user artwork, Etsy has now clarified its stance. In a note published on Monday, CEO Kruti Patel Goyal discussed recent tweaks to the company's terms of service and admitted that her team \"should’ve given you more context on what the updates meant for your creative content.\" “Our recent terms update was meant to reflect the evolving technologies we're using to build better tools and experiences for sellers and the Etsy community,” Goyal wrote this week. “It was not meant to enable us to train AI models for the purpose of creating copycats of your items. We do not and will not do that.” Read full article Comments", "date_str": "2026-11-25T17:12:57+00:00", "hash": "5ade2de  "Zoomit", "title": "ادعای نگران‌کننده: تلویزیون‌های هایسنس، اطلاعات محتوای در حال پخش را به یک شرکت تبلیغاتی ارسال می‌کنند", "link": "https://www.zoomit.ir/tv/471865-hisense-vidaa-tv-alleged-audio-fingerprinting-nexxen-privacy/", "summary": "یکی از کاربران هایسنس مدعی است تلویزیونش هر چند ثانیه اطلاعات صوتی محتوای در حال پخش را برای یک شرکت تبلیغاتی ارسال می‌کند.", "date_str": "2026-11-25T16:43:00+00:00", "hash": "6a3d96b5f3c55c24", "title_fa": "ادعای نگران‌کننده: تلویزیون‌های هایسنس، اطلاعات محتوای در حال پخش را به یک شرکت تبلیغاتی ارسال می‌کنند", "summary_fa": "یکی از کاربران هایسنس مدعی است تلویزیونش هر چند ثانیه اطلاعات صوتی محتوای در حال پخش را برای یک شرکت تبلیغاتی ارسال می‌کند. تبلیغات بررسی فنی مستقل از سوی یک خریدار تلویزیون هایسنس ، پرسش‌های تازه‌ای درباره‌ی حریم خصوصی در تلویزیون‌های هوشمند مطرح کرد. این کاربر مدعی است تلویزیون او، حتی هنگام پخش محتوا از دستگاه‌های متصل به درگاه HDMI، اطلاعاتی درباره‌ی صدای در حال پخش را در فاصله‌های زمانی کوتاه برای یک شرکت تبلیغاتی ارسال می‌کند. گابریل ورنک نتایج بررسی خود را در مخزنی عمومی در گیت‌هاب منتشر کرده است . او می‌گوید با بررسی نرم‌افزار دستگاه و رمزگشایی ارتباطات شبکه، سازوکاری را شناسایی کرده که می‌تواند محتوای در حال تماشا را از روی ویژگی‌های صوتی آن تشخیص دهد. این آزمایش روی تلویزیون Hisense 55U65QEVS، نسخه‌ی عرضه‌شده در بریتانیا با سیستم‌عامل VIDAA U09.60، انجام شده است. کپی لینک ادعای ارسال اطلاعات صوتی هر ۲٫۷ ثانیه ورنک می‌گوید در جریان بررسی فرایندهای پس‌زمینه‌ی تلویزیون، سرویسی به نام HamService را شناسایی کرده که از فناوری «تشخیص خودکار محتوا» یا ACR استفاده می‌کند. این فناوری می‌تواند با تحلیل ویژگی‌های صوتی یا تصویری، برنامه‌ی تلویزیونی، فیلم، تبلیغ یا محتوای دیگری را که کاربر تماشا می‌کند، شناسایی کند. براساس یافته‌های منتشرشده، سرویس موردبحث از صدای خروجی خود تلویزیون استفاده می‌کند؛ یعنی همان سیگنالی که پس از پردازش به بلندگوها فرستاده می‌شود. بنابراین، به ادعای ورنک، شناسایی محتوا به برنامه‌های نصب‌شده روی تلویزیون محدود نیست و می‌تواند هنگام استفاده از کنسول بازی، لپ‌تاپ یا گیرنده‌ی متصل به HDMI نیز انجام شود. به‌گفته‌ی این کاربر، نرم‌افزار تقریباً هر یک‌چهارم ثانیه، یک ثانیه‌ی اخیر صدای خروجی را بررسی می‌کند و آن را به ۷۲ بخش فرکانسی تقسیم می‌کند. سپس از مقایسه‌ی این بخش‌ها، مجموعه‌ای ۷۲ بیتی ساخته می‌شود که نوعی «اثر انگشت صوتی» است.", "image_url": "https://api2.zoomit.ir/media/hisense-launches-e8q-tvs-4-67cea568a15b6baa8bc84343?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۲۰:۱۳"}, {"source": "Business Insider", "title": "Anthropic's 'compute multiplier' is freaking investors out and hammering the AI trade", "link": "https://www.businessinsider.com/anthropic-efficiency-gains-doubt-ai-spending-boom-compute-multiplier-2026-11", "summary": "Dario Amodei (center) at Anthropic s IPO. Michael Nagle/Bloomberg via Getty Images Anthropic's IPO filing spotlights compute multipliers that squeeze more AI from less compute. Investors fear efficient Claude models may slash future demand for data centers and chips. Falling NAND and DRAM memory prices echo doubts that AI growth needs endless hardware buildout. A little-known concept called the \"compute multiplier\" is raising a potentially trillion-dollar question about the AI boom . What if AI becomes so efficient that companies don't need nearly as many data centers, chips, and power plants as investors expect? That's a concern emerging in financial markets following revelations from Anthropic , the company behind the most powerful AI models. It's adding pressure on the AI trade as some investors rethink their bets on the technology. In its IPO filing , Anthropic explained how it's finding ways to get more out of the computing power it already has. The company calls these advances \"compute multipliers\" — breakthroughs that allow its AI systems to accomplish more work using less computing power. Anthropic says these improvements are helping it deliver more value to customers and generate more revenue from its existing computing infrastructure. More AI from less compute That's great for Anthropic. But it has potentially enormous implications for the AI industry's spending plans . Investors have poured hundreds of billions of dollars into companies building data centers, making chips, and supplying electricity to power the AI revolution. Much of that investment is based on forecasts of how quickly AI revenue will grow, and how much computing power will be needed to support that growth. AI demand remains strong. But what if those compute forecasts are wrong? Charles Zvibleman, VP of strategic finance at AlphaSense, recently suggested on X that concerns about future AI infrastructure demand can potentially be traced to what Anthropic discussed with potential investors in the weeks leading up to its IPO. According to Zvibleman, Anthropic told investors it could generate four times as much revenue from a given amount of computing power as previously expected, with further efficiency gains anticipated. If AI companies can generate significantly more revenue from the same computing power, they could meet user demand and achieve their financial targets with less infrastructure than investors previously anticipated. Clues from the IPO filing Anthropic's IPO filing ", "date_str": "2026-11-25T16:38:43+00:00", "hash": "187c0aa7cdef8bc2", "title_fa": "«ضریب محاسباتی» آنتروپیک، سرمایه‌گذاران را به وحشت انداخته و تجارت هوش مصنوعی را تحت تأثیر قرار می‌دهد.", "summary_fa": "داریو آمودی (در مرکز) در IPO آنتروپیک. مایکل ناگل/ بلومبرگ از طریق گتی ایمیجز، نورافکن‌های ثبت IPO آنتروپیک، ضرب‌کننده‌هایی را محاسبه می‌کنند که هوش مصنوعی بیشتری را از محاسبات کمتر فشرده می‌کنند. سرمایه گذاران نگران هستند که مدل های کارآمد کلود ممکن است تقاضای آینده برای مراکز داده و تراشه ها را کاهش دهد. کاهش قیمت حافظه‌های NAND و DRAM این تردید را بازتاب می‌دهد که رشد هوش مصنوعی به ساخت سخت‌افزار بی‌پایانی نیاز دارد. یک مفهوم کمتر شناخته شده به نام \"ضریب محاسباتی\" یک سوال بالقوه تریلیون دلاری در مورد رونق هوش مصنوعی ایجاد می کند. اگر هوش مصنوعی آنقدر کارآمد شود که شرکت‌ها به اندازه‌ای که سرمایه‌گذاران انتظار دارند به مراکز داده، تراشه‌ها و نیروگاه‌ها نیاز نداشته باشند، چه؟ این نگرانی در بازارهای مالی پس از افشاگری از سوی Anthropic، شرکتی که قدرتمندترین مدل‌های هوش مصنوعی را پشت سر می‌گذارد، پدیدار شد. از آنجایی که برخی از سرمایه گذاران در مورد شرط بندی خود روی این فناوری تجدید نظر می کنند، این امر بر تجارت هوش مصنوعی فشار می آورد. آنتروپیک در بایگانی IPO خود توضیح داد که چگونه راه‌هایی را برای استفاده بیشتر از قدرت محاسباتی که در حال حاضر دارد پیدا می‌کند. این شرکت این پیشرفت‌ها را «ضریب‌کننده‌های محاسباتی» می‌نامد - پیشرفت‌هایی که به سیستم‌های هوش مصنوعی این شرکت اجازه می‌دهد تا با استفاده از توان محاسباتی کمتر، کارهای بیشتری را انجام دهند. Anthropic می‌گوید این پیشرفت‌ها به آن کمک می‌کند ارزش بیشتری را به مشتریان ارائه کند و درآمد بیشتری از زیرساخت‌های محاسباتی موجود خود ایجاد کند. هوش مصنوعی بیشتر از محاسبات کمتر این برای Anthropic عالی است. اما پیامدهای بالقوه عظیمی برای برنامه های هزینه صنعت هوش مصنوعی دارد. سرمایه‌گذاران صدها میلیارد دلار به شرکت‌هایی که مراکز داده، ساخت تراشه‌ها و تامین برق برای انقلاب هوش مصنوعی می‌سازند، ریخته‌اند. بخش عمده ای از این", "image_url": "https://i.insider.com/6b05f9de73f126f9eccba347?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "تراشه"], "datetime_fa": "۴ آذر • ۲۰:۰۸"}, {"source": "Business Insider", "title": "‘Big Short’ investor Michael Burry pinpoints the next time he’ll be betting against Nvidia stock", "link": "https://www.businessinsider.com/michael-burry-nvidia-big-short-jensen-huang-nvda-2026-11", "summary": "Michael Burry is gearing up to bet against Nvidia again, following Jensen Huang s reinstatement as CEO. Image 1: James Devaney/WireImage; Image 2: Thomas Koehler/Photothek via Getty Images Michael Burry says he's eyeing another bet against Nvidia, but not just yet. \"The Big Short\" investor wrote this week he'll short the chipmaker when shares hit $200. Jensen Huang's return as CEO hasn't changed his long-term bearish thesis. Jensen Huang although Amazon has since consolidated its Happy Belly and Amazon Fresh brands under the Amazon Grocery name. All were delicious, though some were slightly tastier — and better value — than others. Here's how I ranked them, from my least favorite to my favorite. For me, biscuits are one of the most beloved parts of Thanksgiving dinner. I put eight types of store-bought biscuits (from six different brands) to the test. Karen Warren/Houston Chronicle via Getty Images There are a lot of options in grocery stores, so I decided to try all the biscuit mixes and doughs I could find — both in my local store and online — ahead of my Thanksgiving feast. I was looking for biscuits that were light, flaky, and buttery, with a hint of sweetness. I'm put off by biscuits that are thick and cakey, and seem more like dinner rolls. In my opinion, a good biscuit tastes delicious without butter, so I didn't add any to the ones I bought, except when they came with butter. I ended up with seven tubes of dough and one boxed mix. All the biscuit mixes I used. Gabbi Shaw/Business Insider I bought bake-at-home biscuits from Annie's, Red Lobster, Trader Joe's, Immaculate Organic Biscuits, Pillsbury, and Happy Belly, which is now under the Amazon Grocery name. The Red Lobster biscuits were the only ones to come in a box, and its recipe yielded six to 10 biscuits. The other types, which were all canned, each contained eight. For each tube, I had to peel off the wra", "date_str": "2026-11-25T15:01:11+00:00", "hash": "8e34223850f26811", "title_fa": "من 8 نوع مختلف از بیسکویت های فروشگاهی را امتحان کردم و بهترین آنها در دهان من ذوب شد.", "summary_fa": "من بیسکویت های Annie s، Red Lobster، Trader Joe s، Immaculate Baking، Amazon Fresh و Pillsbury را مقایسه کردم. بیسکویت های Gabbi Shaw/Business Insider یکی از طرفداران مورد علاقه بسیاری از وعده های غذایی شکرگزاری است. من هشت مخلوط بیسکویت و خمیر مختلف را امتحان کردم تا ببینم کدام خوشمزه تر است. بیسکویت اصلی Pillsbury و بیسکویت Red Lobster Cheddar Bay ck most gainst. Nvidia dropped 9% and Anthropic continued its post-IPO decline, dropping another 10%. The AI trade was unraveling on Wednesday days after a parabolic rally sparked by Jensen Huang's reinstatement as Nvidia CEO. US stocks barreled toward another losing session the day before Thanksgiving, as the global stock rally triggered by Huang's comeback fizzled out. The Nasdaq 100 was down nearly 4% and the S P 500 fell 3%. The move attests to how temperamental the AI trade has become, with big events like Huang's return and the Anthropic IPO unable to lift sentiment and restart the bull rally. Chips, neoclouds, and hypserscalers were all down sharply on Wednesday. Nvidia dropped 9% and Anthropic continued its post-IPO decline, dropping another 10%. Nvidia remains down more than 30% from its early October high. Dell , notably, dropped 6%, despite reporting blockbuster results for the third quarter after the bell on Tuesday. \"Dell just put up one of the best quarters of the AI cycle, and the stock barely moved, yet another sign that the market is 'over' the AI trade,\" Luke Lango, an independent tech analyst, wrote in a note. \"That's the AI transition period in a nutshell: the fundamentals are booming, but the market is pricing in a slowdown that hasn't shown up in the numbers yet.\" Here's where US indexes stood around 10 a.m. ET: S P 500 : 7,045.49, down 2.1% Dow Jones Industrial Average : 49,307.49, down 1.42% (-711.21 points) Nasdaq 100 : 25,428.97, down 3.3% Here were the most notable moves in the tech sector in the US: Company Ticker Today's move CoreWeave CRWV -12% IREN IREN -12% Micron MU -11% Nebius NBIS -11% Roundhill Neocloud ETF NCLD -10% Roundhill Memory ETF DRAM -9% iShares Semiconductor ETF SOXX -8% Intel INTC -8% Vertiv VRT -7% Nvidia NVDA -6% SpaceX SPCX -6% Broadcom AVGO -4% Generac GNRC -3% Sandisk SNDK -3% Meanwhile, hot inflation data and the prospect of additional tariffs from the Trump administration were adding to the selling pressure. eg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Nvidia", "تراشه"], "datetime_fa": "۴ آذر • ۱۸:۲۹"}, {"source": "Business Insider", "title": "My best friend and I live on opposite sides of the country. We stay connected by taking joint birthday trips.", "link": "https://www.businessinsider.com/best-friends-take-annual-birthday-trip-together-2026-11", "summary": "My best friend and I stay connected through annual trips. Laura Grace Tarpley My best friend, Heather, and I live on opposite sides of the country. To stay connected, we take annual joint birthday trips together. Our trips have changed over the years, and sometimes, our spouses or families join us. I met my best friend Heather when we were both 6 years old. We attended the same small school from first grade through high school, and as teenagers, we bonded over a shared urge to see the world beyond our little bubble. Our first trip together was a school-sponsored tour of Europe the summer before senior year, where we explored major tourist hubs like London and Paris but really fell in love with under-the-radar spots we found in Lyon, France. We bonded over our love of trying new foods, from escargot to fancy cheeses, and exploring tiny boutiques instead of touristy gift shops. Now, in our mid-30s, our lives look very different from what they did back in high school. My husband and I settled down in Olympia, Washington, and Heather and her family live in Wilmington, North Carolina. Although we live on opposite sides of the country, we've found a way to stay close through our shared love of travel with annual birthday trips . We've kept the tradition alive for 8 years now One year, we backpacked through Great Smoky Mountains National Park. Laura Grace Tarpley The tradition began in July 2018, when Heather wanted to take a long-weekend trip for her 26th birthday. Since I was in Baltimore for the summer while my husband was interning in Washington, DC , we decided she should come visit, and I could show her around both cities. When you live far away from a friend and finally reunite, it's easy to spend time just catching up on what's happening in the other person's life rather than making new memories together. But that wasn't the case this time. We had so much fun trying new things on this trip — from touring landmarks in DC to spending a rainy day in a brewery and tasting seafood dishes we never would've considered when we were kids — that we ended up making it an annual tradition to celebrate both of our birthdays. During our first trip, I showed Heather around Baltimore and DC. Laura Grace Tarpley Heather and I have each changed over the years, in big and small ways. We might be in different phases of life, and we may switch up our travel destinations, but one thing stays the same — we always find ways to spend time together in ways we both enjoy. And that ", "date_str": "2026-11-25T14:57:06+00:00", "hash": "4d12cef0dacc288f", "title_fa": "من و بهترین دوستم در دو طرف کشور زندگی می کنیم. ما با سفرهای مشترک تولد در ارتباط هستیم.", "summary_fa": "من و بهترین دوستم از طریق سفرهای سالانه در ارتباط هستیم. لورا گریس تارپلی بهترین دوستم، هدر، و من در دو طرف کشور زندگی می کنیم. برای اینکه در ارتباط باقی بمانیم، سفرهای مشترک سالانه تولد را با هم انجام می دهیم. سفرهای ما در طول سال ها تغییر کرده است و گاهی اوقات، همسر یا خانواده ما به ما می پیوندند. من بهترین دوستم هدر را زمانی که هر دو 6 ساله بودیم ملاقات کردم. ما از کلاس اول تا دبیرستان در همان مدرسه کوچک درس می‌خواندیم، و در دوران نوجوانی، تمایلی مشترک به دیدن جهان فراتر از حباب کوچکمان داشتیم. اولین سفر ما با هم یک تور اروپایی تحت حمایت مدرسه در تابستان قبل از سال آخر بود که در آن مراکز توریستی مهمی مانند لندن و پاریس را کاوش کردیم اما واقعاً عاشق نقاط زیر رادار که در لیون، فرانسه یافتیم، شدیم. ما علاقه خود را به امتحان غذاهای جدید، از اسکارگوت گرفته تا پنیرهای فانتزی، و کاوش در بوتیک‌های کوچک به جای فروشگاه‌های کادوهای توریستی به هم پیوند زدیم. اکنون، در اواسط 30 سالگی، زندگی ما با آنچه در دوران دبیرستان انجام می‌دادند بسیار متفاوت به نظر می‌رسد. من و شوهرم در المپیا، واشنگتن مستقر شدیم و هدر و خانواده اش در ویلمینگتون، کارولینای شمالی زندگی می کنند. اگرچه ما در دو طرف کشور زندگی می کنیم، اما راهی برای نزدیک ماندن از طریق عشق مشترکمان به سفر با سفرهای سالانه تولد پیدا کرده ایم. ما اکنون 8 سال است که این سنت را زنده نگه داشته ایم. یک سال، از پارک ملی کوه های بزرگ اسموکی کوله پشتی کردیم. لورا گریس تارپلی این سنت در جولای 2018 آغاز شد، زمانی که هدر می خواست برای تولد 26 سالگی خود یک سفر طولانی آخر هفته داشته باشد. از آنجایی که در تابستان در بالتیمور بودم، زمانی", "image_url": "https://i.insider.com/6b0608fdd6c5d341c9b4cf81?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آذر • ۱۸:۲۷"}, {"source": "Business Insider", "title": "I tried 5 kinds of store-bought instant mashed potatoes. The best tasted nearly homemade.", "link": "https://www.businessinsider.com/best-instant-mashed-potatoes-ranked", "summary": "I tried instant mashed potatoes to determine which one is the best for Thanksgiving. Erin McDowell/Business Insider I tried instant mashed potatoes from Idahoan in various flavors. Idahoan nailed it with buttery, flavorful mashed potatoes that were perfectly light and creamy. I liked the brand's Baby Bliss mashed potatoes best. With a mountain of dishes to make for Thanksgiving, sometimes it's necessary to take a shortcut or two. Despite usually swearing by homemade mashed potatoes , I decided to try out a variety of instant mashed-potato brands and flavors to determine the best option at the grocery store, and to see if any were good enough to earn a spot on my Thanksgiving table. I tried five flavors of Idahoan instant mashed potatoes, one of the biggest mashed-potato brands in the US — it reported in January 2026 that it accounts for 80% of the US packaged potato market. It was also the only brand available at my local grocery stores in the Northeast. The flavors included classic butter, roasted garlic, sour cream and chives, baby bliss, and cheddar broccoli. For the comparison, I followed the instructions on each package. Almost every kind of instant mashed potatoes I tried required only a kettle to boil water, a measuring cup, and a bowl. Here's how they compared, from my least favorite to my favorite. Idahoan s classic mashed potatoes required just the mashed potato packets and water. Idahoan classic mashed potatoes. Erin McDowell/Business Insider A 4-ounce bag of Idahoan instant mashed potatoes costs $1.67 and makes 4 servings. I appreciated the ease and not having to take up precious stove space, and I imagine I would appreciate that even more if I were actually cooking these for Thanksgiving. To make each flavor of potatoes, I boiled two cups of water and added it to a large measuring cup. I then added the entire packet of potatoes, covered it with tin foil for five minutes, and then mixed the potatoes before serving in a separate bowl. The potatoes had a good, fluffy consistency. Idahoan classic mashed potatoes. Erin McDowell/Business Insider Despite being made from a powder, they weren't grainy or thick. The classic version of Idahoan instant mashed potatoes looked and tasted like homemade mashed potatoes. Idahoan classic mashed potatoes. Erin McDowell/Business Insider If someone had told me they had come from a packet, I probably wouldn't have believed them. The butter flavor was prominent, in a good way. My only criticism of the classic mashed", "date_str": "2026-11-25T14:55:01+00:00", "hash": "14a7d53bc7d086fd", "title_fa": "من 5 نوع پوره سیب زمینی فوری خریداری شده در فروشگاه را امتحان کردم. بهترین طعم تقریباً خانگی.", "summary_fa": "من پوره سیب زمینی فوری را امتحان کردم تا مشخص کنم کدام یک برای روز شکرگزاری بهترین است. Erin McDowell/Business Insider من پوره سیب زمینی فوری از آیداهوان را در طعم های مختلف امتحان کردم. آیداهان آن را با پوره سیب زمینی کره ای و خوش طعم که کاملا سبک و خامه ای بود، میخکوب کرد. من پوره سیب زمینی بیبی بلیس این برند را بیشتر دوست داش st to have an excuse to eat it. Most years, I cook a full Thanksgiving meal for my family, which leaves us with lots of leftovers in the fridge. Instead of heating up the same dishes all week, I decided to try three recipes that could give our extra turkey (and some sides) new life. From a simple turkey salad to a stacked sandwich, here's how each leftover-utilizing recipe stacked up. For one dish, I tried making a turkey salad. Terri Peters The easiest recipe to follow was for turkey salad , which was similar to chicken versions I've made in the past. I used a recipe from the cooking blog Ahead of Thyme. The ingredients are simple: celery, green onion, paprika, mayo, Dijon mustard, salt, pepper, and finely chopped leftover turkey. I made a few changes to the recipe, but the dish was still good. Terri Peters I don't like the crunch of celery or onion, so for this turkey salad, I made a few adjustments. Instead of adding diced celery, green onions, and salt, I just used celery salt to flavor the salad without adding a harsh crunch. The turkey salad was great on a sandwich, and I d make it again. Terri Peters My turkey-salad sandwich tasted great. It had plenty of flavor from the mustard, paprika, and celery salt. Overall, I thought it was simple to prepare, and as an added bonus, it required ingredients I already had in my pantry and refrigerator. I'd make this turkey salad again if I had leftovers on hand. This warmThanksgiving-inspired sandwich was much harder to make. Terri Peters Our typical Thanksgiving leftovers include things like turkey breast, cranberry sauce, mac and cheese , mashed potatoes, and green-bean casserole. For the first recipe, I gathered them all up to make a sandwich using a recipe from The New York Times . I also grabbed thick sandwich bread and turkey gravy. The stuffing layer was the most labor-intensive part of the sandwich. Terri Peters I began by mixing the mayonnaise and cranberry sauce to create a cranberry mayo. Then, I combined chopped turkey with gravy to make another sauce. Since we didn't have leftover stuffing, I made a box of stuffing , pressed it into a square pan, and refrigerated i", "date_str": "2026-11-25T14:40:50+00:00", "hash": "e794668bd3571f8c", "title_fa": "من 3 روش مختلف برای استفاده از باقی مانده بوقلمون امتحان کردم. یک دستور غذا آنقدر خوب بود که من یک پرنده کامل را درست می کردم تا دوباره درست کنم.", "summary_fa": "با استفاده از باقی مانده بوقلمون از شام شکرگزاری، سالاد، سوپ و ساندویچ درست کردم. تری پیترز در آماده شدن برای روز شکرگزاری، به دنبال راه های عالی برای استفاده از سینه بوقلمون باقی مانده بودم. ساندویچی که با باقی مانده بوقلمون درست کردم بیشتر از ارزشش زحمت کشید. سوپی درست کردم که خیلی خوشمزه بود، فقط برای اینکه بهانه ای برای خوردنش داشته باشم، یک بوقلمون دیگر درست کردم. بیشتر سال‌ها، من یک وعده غذایی کامل برای روز شکرگزاری برای خانواده‌ام درست می‌کنم، که باقیمانده‌های زیادی در یخچال برایمان باقی می‌گذارد. به جای گرم کردن غذاهای یکسان در تمام هفته، تصمیم گرفتم سه دستور غذا را امتحان کنم که می تواند به بوقلمون اضافی ما (و برخی طرف ها) جان تازه ای بدهد. از یک سالاد بوقلمون ساده گرفته تا یک ساندویچ پشته‌ای، در اینجا نحوه انباشته شدن هر دستور غذای باقی‌مانده آمده است. برای یک غذا، سعی کردم سالاد بوقلمون درست کنم. تری پیترز ساده ترین دستور پخت سالاد بوقلمون بود که شبیه به نسخه های مرغی بود که در گذشته درست کرده بودم. من از دستور پخت وبلاگ Ahead of Thyme استفاده کردم. مواد اولیه ساده است: کرفس، پیاز سبز، پاپریکا، مایونز، خردل دیژون، نمک، فلفل و باقی مانده بوقلمون ریز خرد شده. من چند تغییر در دستور غذا دادم، اما غذا هنوز خوب بود. Terri Peters من ترد کرفس یا پیاز را دوست ندارم، بنابراین برای این سالاد بوقلمون، چند تنظیم کردم. به جای اضافه کردن کرفس خرد شده، پیاز سبز و نمک، فقط از نمک کرفس برای طعم دادن به سالاد استفاده کردم بدون اینکه تردی تند اضافه کنم. سالاد بوقلمون روی یک ساندویچ عالی بود و من دوباره آن را درست می کنم. Terri Peters ساندویچ سالاد بوقلمون من طعم فوق العاده ای داشت. طعم زیادی از خردل، پاپریکا و نمک کرفس داشت. به", "image_url": "https://i.insider.com/6b06f3050b       media: [{"source": "Billboard", "title": "Travis Kelce Celebrates 100th Game at Arrowhead Stadium With Taylor Swift-Coded Comment: ‘It’s Pretty Awesome’", "link": "https://www.billboard.com/culture/lifestyle/travis-kelce-celebrates-100th-game-arrowhead-taylor-swift-1236389514/", "summary": "Travis Kelce has plenty of great memories playing at the Kansas City Chiefs home stadium. In fact, on Sunday (Nov. 22), three-time Super Bowl champ Kelce marked a new career milestone in his 14-year journey with the team when he became just the fourth player in franchise history to play 100 regular-season games at Arrowhead. He discussed that major stat on this week s episode of his New Heights podcast with brother Jason Kelce, including passing former Patriots tight end Rob Gronkowski in total career touchdowns (110-to-108) and why his good memories also, of course, include ones tied to his wife Taylor Swift . “One hundred games, dude, it feels pretty awesome right now,” Travis said of his home game high point. “To think about that legacy of that stadium, man and it’s pretty crazy to think they’re moving on from that stadium, because of all the history that’s happened over the years and history of the franchise and everything. The Chiefs have announced plans to leave Arrowhead when their lease expires after the 2030 NFL season. Then Travis dug into what it s been like playing at Arrowhead all those years, adding a subtle nod to Swift, whose Eras Tour touched down at the stadium on July 7 and 8, 2023; Kelce was in attendance on night two. You know it’s been home for me for 14 years, and it’s been one of my favorite places to go to play and to watch not only football, but musical events and I’ve had so much history and so many things that mean so much to me happen at Arrowhead that a hundred games, it’s pretty awesome to hit that milestone, Kelce said in a subtle nod to Swift s history playing at the 55,000-seat venue. Jason, however, questioned Travis cheers to 100 more ple rd-on-the-record-josephine-vaccarello/", "summary": "What does it take to run some of America s most iconic venues? Josephine Vaccarello , president of MSG Entertainment, knows a thing or two about it. Over the last 20 years, Vaccarello has grown up at the company — owner of Madison Square Garden, Radio City Music Hall, Sphere, Beacon Theater and more — rising from being an administrative assistant to CEO James Dolan s right-hand executive. According to Vaccarello, the summer of 2026 has been the busiest the Garden has ever seen, playing host to everyone from Olivia Dean , Bon Jovi and Bush . At the end of the season, the Garden also made headlines with Harry Styles, who locked out 30 dates at the venue for a legendary residency. Related Meet the ‘Unflappable’ Exec Bringing Superstars To Madison Square Garden and Sphere Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Rod Wave Indicted on Drug Gun Charges for Items Allegedly Found in Car After Speeding Stop The residency model is one Vaccarello believes will only continue to grow. Not only does it benefit the artist, who gets to stay put in one location instead of living out their days in a bus or plane, but it also benefits the production value of the show and garners buzz for everyone involved. While not every fan is excited by the growth of the residency model, ushered in by the likes of Beyoncé , Styles, Billy Joel , Bad Bunny and more, it s clear that, despite the high cost and difficulty of doing so, plenty of fans are willing to travel to see their favorite star. This year, Vaccarello was selected as Billboard s touring executive of the year and to celebrate that honor, she joined a special live edition of music business podcast On the Record w/ Kristin Robinson at Billboard s Live Music Summit on Nov. 10 in Los Angeles. To watch this episode of the podcast, check out the YouTube video below or click here for more viewing and listening options. An edited and condensed excerpt of the conversation can also be found below. Sphere, owned by MSG Entertainment, has obviously been part of that larger trend toward more immersive and experiential live experiences. ABBA Voyage is another great example. From your vantage point, why do you think people are searching for these experiential moments in live music now? I don t know the answer to the now of it, but I do feel like people want to be a participant rather than a spectator. I do think that s what is happening now, and that s what everyone is looking to change. We w", "date_str": "2026-11-25T17:03:31+00:00", "hash": "27a7cb31546df757", "title_fa": "داخل اقامتگاه MSG هری استایلز و چرا طرفداران کنسرت های تجربی می خواهند", "summary_fa": "برای اجرای برخی از نمادین ترین مکان های آمریکا چه چیزی لازم است؟ Josephine Vaccarello، رئیس MSG Entertainment، یکی دو چیز در مورد آن می داند. در طول 20 سال گذشته، Vaccarello در این شرکت بزرگ شده است - مالک مدیسون اسکوئر گاردن، رادیو سیتی موزیک هال، Sphere، Beacon Theater و موارد دیگر - از یک دستیار اداری به سمت دست راست مدیر اجرایی جیمز دولان، مدیرعامل، ارتقا یافته است. به گفته Vaccarello، تابستان 2026 شلوغ ترین تابستانی بوده است که باغ تا به حال دیده است و میزبان همه از اولیویا دین، بون جووی و بوش بوده است. در پایان فصل، باغ همچنین با هری استایلز، که 30 قرار ملاقات را در محل برگزاری یک اقامتگاه افسانه ای قفل کرد، خبرساز شد. موارد مرتبط ملاقات با مدیر اجرایی \"غیرقابل\" که سوپراستارها را به مدیسون اسکوئر گاردن و کره می آورد کریس براون با افزایش حمایت از کودک در حال حاضر موافقت می کند تا در حال حاضر دیاموند سابق را در مبارزه تلخ حضانت متهم کند. این نه تنها به نفع هنرمند است، که به جای گذراندن روزهای خود در اتوبوس یا هواپیما، در یک مکان می ماند، بلکه به ارزش تولید نمایش نیز سود می رساند و برای همه دست اندرکاران سر و صدایی ایجاد می کند. در حالی که همه طرفداران از رشد مدل اقامتی که توسط افرادی مانند بیانسه، استایلز، بیلی جوئل، خرگوش بد و غیره به وجود آمده هیجان زده نمی شوند، واضح است که علیرغم هزینه های زیاد و دشواری انجام این کار، بسیاری از طرفداران مایل به سفر برای دیدن ستاره مورد علاقه خود هستند. امسال، Vaccarello به عنوان مدیر اجرایی سال بیلبورد در تور بیلبورد انتخاب شد و برای جشن گرفتن این افتخار، به نسخه زنده ویژه پادکست تجارت موسیقی On the Record با کریستین رابینسون در اجلاس موسیقی زنده بیلبورد در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/harry-styles-msg-billboard-2026-bb12-cr-anthony-pham-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آذر • ۲۰:۳۳"}, {"source": "Billboard", "title": "Ariana Grande Says ‘Insane’ Backlash to ‘Petal’ Music Video Felt Like ‘Black Mirror’", "link": "https://www.billboard.com/music/music-news/ariana-grande-petal-music-video-backlash-black-mirror-1236389456/", "summary": "Ariana Grande never predicted that the response to her Petal music video earlier this year would directly mirror what she was trying to speak out against in the song in the first place. Related Ariana Grande Announces Eternal Sunshine Tour Concert Film Behind-the-Scenes Documentary Ariana Grande Over the Moon About Her Four Grammy Nominations: Such a Sweet and Unexpected Honor Ariana Grande Ricky Alvarez Make Red-Carpet Debut at Focker-in-Law NYC Premiere: See Photos While guesting on the Wednesday (Nov. 25) episode of Las Culturistas , the pop star opened up for the first time about the backlash she received following the visual s release in August. The video found her in and out of auditions for a panel of overly critical men, changing things about her appearance and personality each time in futile attempts to please them. By the end of the video, Grande realizes that none of those things should matter, and that the focus should have always been on her art. So when the public s response to the Petal video ended up having nothing to do with the song or visual design, with people instead overwhelmingly commenting on the Grammy winner s slender appearance, it felt like an episode of Black Mirror , Grande recalled. It was a fun thing that that video — with the intention of really spelling it out — had its own meta insane perception, she told podcast hosts Bowen Yang and Matt Rogers. It s Black Mirror . I really thought it was going to be, like, a reveal, me sharing a vulnerable [part of myself]. Shortly after the Petal video dropped, Grande s rep announced that she d be taking a break from the spotlight due to endless, ongoing public scrutiny. Even so, she stands by the visual. I d put it out again today. I wouldn t change a thing, she said, noting how healing it was to bond with the dancers who played her fellow auditioners in the video over the song s message. We ve all been told some kind of interesting thing about ourselves that has nothing to do with the art or our talent or our work. It was a very beautiful day on set. It has always in the past hurt me a lot, she added of having her intentions distorted by the public, something she explored heavily on her Billboard 200 -topping album petal . Now I really just feel like as long as I m creating from an authentic place let the chips fall where they may. The singer s appearance on the pod comes the day after she announced her Eternal Sunshine Tour documentary and concert film, coming Dec. 11 and 12, respec", "date_str": "2026-11-25T17:01:36+00:00", "hash": "e9faeb5f573a2560", "title_fa": "آریانا گرانده می گوید واکنش دیوانه کننده به موزیک ویدیوی «گلبرگ» مانند «آینه سیاه» بود", "summary_fa": "آریانا گرانده هرگز پیش‌بینی نکرد که پاسخ به موزیک ویدیوی گلبرگ او در اوایل سال جاری، مستقیماً همان چیزی است که او در وهله اول سعی می‌کرد در برابر آن صحبت کند. مرتبط آریانا گرانده فیلم کنسرت Eternal Sunshine Tour را اعلام کرد مستند پشت صحنه آریانا گرانده بر فراز ماه درباره چهار نامزدی جایزه گرمی: افتخاری چنین شیرین و غیرمنتظره آریانا گرانده ریکی آلوارز اولین حضور در فرش قرمز را در چهارشنبه در Focker-in-Law در NYC Premiere:. 25) قسمت Las Culturistas، ستاره پاپ برای اولین بار در مورد واکنش های شدیدی که پس از انتشار ویژوال در ماه اوت دریافت کرد صحبت کرد. این ویدیو او را در داخل و /wp-content/uploads/2026/11/gordon-ramsay-top-gear.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۴ آذر • ۲۰:۲۹"}, {"source": "Billboard", "title": "2027 ACM Awards Changes Include New Criteria for New Artist & Song of the Year", "link": "https://www.billboard.com/music/awards/2027-acm-awards-new-criteria-new-artist-song-1236389300/", "summary": "The Academy of Country Music Awards have amended criteria for a number of categories for both its artist and industry awards. Additionally, the ACM has finalized the submission and voting timeline for the 62nd ACM Awards, which will take place May 16 in Las Vegas. For the artist awards, the changes include broadening the criteria for the new artist of the year awards, which are presented in new male, new female and new duo or group categories. The wording has been altered to “presented to a country music individual artist, duo, or group who gains initial notoriety and demonstrates significant creative growth and development in overall consumption or chart activity, live performance, and/or national media recognition during the eligibility period,” according to the official description of the award. Related Here s the Date of the 2027 ACM Awards – And How to Get Tickets Here Are the 2026 ACM Awards Winners: Full List Every 2026 ACMs Performance, Ranked Previously, a more restrictive definition noted that the recognition occurred “during the promotion of a debut or sophomore album within the eligibility period,” and specifically defined chart activity as “must have released a single that reached the top 50 on Billboard’s Hot Country Songs or the Mediabase Country charts.” Significantly, the new definition removes the album requirement in a nod to how release patterns have changed to focus on consumption. A qualifier that any albums self-released through an independent label operated by the artist would not be counted as a debut or sophomore album unless it produced a top 50 single has also been removed. For song of the year, eligibility is now “limited to newly created compositions recognized as distinct copyrighted works, including those that incorporate elements of existing songs while contributing to substantial original songwriting.” The “newly created compositions” language is new. For songwriter of the year, whose nominees are selected by a professional panel of judges composed of songwriters, publishers, producers and performing rights organization representatives, the panel will now submit 10 nominees, up from the five nominees in years past. The ACM has also amended some of the criteria for its industry awards, most significantly, adding a new category, international event of the year. According to the award language, “This award is presented to an outstanding country music festival, fair, or rodeo held outside the United States.” The event must spa", "date_str": "2026-11-25T17:00:00+00:00", "hash": "ff53dd03b72f7021", "title_fa": "تغییرات جوایز ACM 2027 شامل معیارهای جدید برای هنرمند جدید و آهنگ سال می شود", "summary_fa": "آکادمی جوایز موسیقی کشور معیارهای تعدادی از دسته‌ها را برای جوایز هنرمند و صنعت خود اصلاح کرده است. علاوه بر این، ACM جدول زمانی ارسال و رأی گیری برای شصت و دومین دوره جوایز ACM را که در 16 می در لاس وگاس برگزار می شود، نهایی کرده است. برای جوایز هنرمند، تغییرات شامل گسترش معیارهای جوایز هنرمند جدید سال است که در دسته‌های جدید مرد، زن و گروه جدید دو نفره یا گروهی ارائه می‌شوند. بر اساس توضیحات رسمی جایزه، عبارت به «ارائه شده به یک هنرمند، دو یا گروه موسیقی کانتری که شهرت اولیه پیدا کرده و رشد و توسعه خلاقانه قابل توجهی در مصرف کلی یا فعالیت نمودار، اجرای زنده و/یا به رسمیت شناختن رسانه ملی در طول دوره واجد شرایط بودن نشان می‌دهد» تغییر یافته است. موارد مرتبط در اینجا تاریخ جوایز ACM 2027 است – و نحوه دریافت بلیت در اینجا برندگان جوایز ACM 2026 آمده است: فهرست کامل هر عملکرد ACM در سال 2026، رتبه‌بندی شده قبلی، تعریف محدودتر نشان می‌دهد که این شناخت «در طول تبلیغ یک آلبوم به‌عنوان فعالیت‌هایی که به‌طور خاص به‌عنوان فعالیت‌هایی که به‌طور epholig بیشتر تعریف شده‌اند» رخ داده است. باید آهنگی منتشر کرده باشد که به 50 آهنگ برتر بیلبورد در آهنگ های Hot Country یا چارت Mediabase Country رسیده باشد. به طور قابل توجهی، تعریف جدید الزامات آلبوم را با اشاره به نحوه تغییر الگوهای انتشار برای تمرکز بر مصرف حذف می کند. این شرط که هر آلبومی که توسط یک برچسب مستقل توسط هنرمند منتشر شود به عنوان اولین آلبوم یا آلبوم دوم محسوب نمی شود مگر اینکه 50 تک آهنگ برتر را تولید کند نیز حذف شده باشد. برای آهنگ سال، واجد شرایط بودن اکنون «محدود به آهنگ‌هایی است که به تازگی ایجاد شده‌اند که به‌عنوان آثار متمایز دارای حق چاپ شناخته می‌شوند، از جمله", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/ella-langley-acm-awards-2026-billbaord-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آذر • ۲۰:۳۰"}, {"source": "Billboard", "title": "Rock The Country Fest Organizer Peachtree Entertainment Reportedly Shuts Down", "link": "https://www.billboard.com/pro/rock-the-country-peachtree-entertainment-shuts-down/", "summary": "Nashville-based music promoter Peachtree Entertainment, the organizer behind the Rock The Country festivals, has reportedly shut down and laid off staffers. The news was first reported by Decibel . A statement released Friday (Nov. 20) to Loudwire from the city of Decatur, Ala., which hosted Rock The South, noted that the city had received word that Peachtree Entertainment has decided to cease operations and close its business. This was a significant and unexpected development for City leadership. Related Universal Music Shakeup: Def Jam, Polydor, Interscope Execs to Exit as Company Completes 2024 Restructure Plan Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Rod Wave Indicted on Drug Gun Charges for Items Allegedly Found in Car After Speeding Stop In the statement, the City of Decatur also noted it is reviewing its five-year agreement with Peachtree Entertainment and assessing w ن ارسال رسمی قبرس برای بهترین فیلم بلند بین‌المللی «خوشبختی که پدر نداری» است. در «بر من نگه دار»، اولین فیلم درخشان از نویسنده و کارگردان میرسینی آریستیدو، پدری که آیریس هرگز نمی دانست سایه ای در پشت چشم ها و زخمی در قلب ماریا پترووا با بیان شگفت انگیز است، تازه وارد فوق العاده با استعدادی که نقش این جوان را بازی می کند. پس جای تعجب نیست که وقتی آریس (کریستوس پاسالیس) - نه مرده، فقط بیگانه و بی جنس - به شهر باز می گردد، آیریس نمی تواند به سمت او کشیده شود. حتی زمانی که پدرش چهره واقعی خود را به‌عنوان مردی آشکار می‌کند که ترجیح می‌دهد از دخترش در کلاهبرداری‌هایش استفاده کند تا عشق خانوادگی، آیریس سعی می‌کند او را نگه دارد - که برای هر دو نتیجه خطرناکی دارد. آریستیدو نیز تعهدی پرشور و سرسختانه به فیلمش نشان داد. این فیلمساز قبرسی برای نمایش فیلم «Hold Onto Me» را پشت سر گذاشت، هفت سال توسعه فیلمنامه، چالش‌های مالی، تأخیرهای ناشی از کووید و فشارهای موجود در ارج نهادن به داستان و خانه جزیره‌اش با استخدام غیربازیگران متعدد، به ویژه برای ایفای نقش شخصیت‌های اصلی فرزندش. آریستیدو توضیح می‌دهد: «از قبرس یا یونان، پیدا کردن بچه‌هایی که بازیگر باشند سخت است. ما صنایع بزرگ نداریم. بنابراین می‌دانستم که غیربازیگرانی هستند که نقش آیریس و دانایی [جنی سالو] را بازی می‌کنند.» این فیلمساز در دو فیلم کوتاه «سمله» در سال 2015 و «آریا» در سال 2017 با این", "image_url": "https://variety.com/wp-content/uploads/2026/01/Hold-Onto-Me.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۲۰:۳۰"}, {"source": "Variety", "title": "Hallmark’s New Podcast Push Kicks Off With Interview Series Hosted by Melissa Peterman That ‘Breaks the Fourth Wall,’ With More Shows to Come", "link": "https://variety.com/2026/tv/news/hallmark-podcast-melissa-peterman-1236956991/", "summary": "Hallmark Media is gearing up for new expansion into podcasting aiming to add another vector for connecting with its fanbase. The media company in recent years has stepped up its brand extensions, from cruises and live tours to movies and series centered on heartwarming storylines and holiday themes. Now it wants to engage with [ ]", "date_str": "2026-11-25T17:00:00+00:00", "hash": "47ba1eb5577602fc", "title_fa": "پادکست جدید Hallmark با مجموعه مصاحبه با میزبانی ملیسا پیترمن که \"دیوار چهارم را می شکند\" با برنامه های بیشتر آغاز می شود", "summary_fa": "Hallmark Media در حال آماده شدن برای گسترش جدیدی در پادکست است که هدف آن افزودن وکتور دیگری برای اتصال به پایگاه هواداران خود است. این شرکت رسانه‌ای در سال‌های اخیر توسعه‌های برند خود را افزایش داده است، از سفرهای دریایی و تورهای زنده گرفته تا فیلم‌ها و سریال‌هایی با محوریت داستان‌های دلچسب و مضامین تعطیلات. این شرکت گفت که اکنون می‌خواهد با [] هالمارک تعامل داشته باشد، هفته آینده Hallmark Moments With Melissa Peterman را نمایش می‌دهد، یک پادکست ویدیویی که شامل مکالمات معتبر بین شخصیت تلویزیونی و ستاره‌های خانواده Hallmark و فراتر از آن شکستن دیوار چهارم است. نسخه ویدیویی پادکست در یوتیوب و نسخه صوتی آن در Spotify، Apple Podcasts و دیگر پلتفرم‌های پادکست در دسترس خواهد بود. داستان‌های مرتبط چگونه تیم آرایش «السینور» ستاره‌های اندرو اسکات و اولیویا کولمن را برای زنده کردن داستان ایان چارلسون متحول کرد پترمن در سریال Haul Out the Holly از هالمارک و کمدی کمدی NBC Happy Place بازی کرده است. اولین قسمت از پادکست او که دوشنبه، 30 نوامبر منتشر می شود، گفتگوی او با مهمان Lacey Chabert، یکی دیگر از ستاره های برجسته تولیدات Hallmark را نشان می دهد. قسمت‌های جدید هر دوشنبه تا ۸ فوریه ۲۰۲۷ پخش خواهند شد. قرار است مهمانان دیگری در پادکست شامل شارون لارنس (2025 A Grand Ole Opry Christmas) در 7 دسامبر باشند. جاناتان بنت (تاریخ را برای کریسمس ذخیره کنید) در 14 دسامبر; و B.J. Britt (Hearts All Aglow) و اندرو واکر (کریسمس در Blue Dog Valley) در 21 دسامبر، برای فیلمبرداری در محل در طول جشن کریسمس Hallmark این آخر هفته. یکی از نمایندگان Hallmark Media می گوید که پادکست های اصلی بیشتری در دست ساخت هستند، زیرا نمایش پیترمن سیگنال ورود مجدد شرکت به فضای پادکست را می دهد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Melissa-Peterman.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوع ، بنیانگذار ساندنس و یکی از اعضای هیئت مدیره جشنواره، همدردی خود را با پلانته به اشتراک گذاشت و او را \"روشنگر\" خواند. ردفورد در بیانیه‌ای نوشت: «او از طریق استعداد خارق‌العاده‌اش در کیوریتوری، داستان‌سرایان بی‌شماری را از طریق رسانه‌ی حیاتی فیلم کوتاه راه‌اندازی کرد که بسیاری از آن‌ها به برخی از ماندگارترین هنرمندان جهان تبدیل شدند. مایک اخلاق ساندنس را تجسم بخشید و نقش مهمی در حفظ تداوم ارزش‌های آن داشت. او با زمان و راهنمایی‌هایش سخاوتمندانه بود و در نوع خود خالق با استعدادی بود. اما ماندگارترین میراث مایک مهربانی اوست. این اولین چیزی بود که مردم در مورد او می‌گویند نه تنها صدماتی که مردم به او می‌دهند. به اندازه کافی خوش شانس بودم که او را می شناختم و او را دوست داشتم.»", "image_url": "https://variety.com/wp-content/uploads/2026/11/2023_short_film_party_jen_fairchild_0229_1024-1.jpg?crop=129px%2C87px%2C673px%2C378px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۲۰:۲۲"}, {"source": "Deadline", "title": "Netflix Releases New Peter Berg-Directed Spot Inspired By ‘Friday Night Lights’ Highlighting Thanksgiving Eve Game", "link": "https://deadline.com/2026/11/netflix-peter-berg-directed-friday-night-lights-thanksgiving-eve-game-1237233333/", "summary": "Netflix is streaming its first Thanksgiving Eve Game and has dropped a spot directed by Peter Berg, which was inspired by Friday Night Lights. The new spot titled Thankful for Football is narrated by Kyle Chandler and highlights the game between the Los Angeles Rams and the Green Bay Packers. Life is a collection of [ ]", "date_str": "2026-11-25T16:50:08+00:00", "hash": "0ef4e9b4a845d0c0", "title_fa": "نتفلیکس نقطه جدیدی را به کارگردانی پیتر برگ با الهام از «چراغ‌های شب جمعه» منتشر کرد که برجسته‌ترین بازی شب شکرگزاری بود.", "summary_fa": "نتفلیکس اولین بازی شب شکرگزاری خود را پخش می کند و یک قسمت به کارگردانی پیتر برگ که از «چراغ های شب جمعه» الهام گرفته شده بود، حذف کرده است. نقطه جدید با عنوان سپاسگزار برای فوتبال توسط کایل چندلر روایت می شود و بازی بین لس آنجلس ve Officer at RDF Media, where he produced series such as Wife [ ]", "date_str": "2026-11-25T16:45:00+00:00", "hash": "b87ea5ba498cdc55", "title_fa": "استودیو لمبرت در حال حفاری در آرشیو برای موفقیت بعدی خود به اندازه «خائنان» است.", "summary_fa": "یکی از پیامدهای جالب ادغام بانیجی با All3Media این است که استفان لمبرت، که استودیو لمبرت، تهیه‌کننده The Traitors را اداره می‌کند، دوباره با کارهای اولیه‌اش متحد شد. قبل از اینکه لمبرت، تهیه‌کننده سابق مستند بی‌بی‌سی، استودیو لامبرت را در سال 2008 تأسیس کند، او مدیر ارشد خلاقیت در RDF Media بود، جایی که مجموعه‌هایی مانند Wife [ ] را در نتیجه ادغام تولید کرد که ارزش شرکت را حدود 8 میلیارد دلار می‌کند، که 130 شرکت تولید بانی‌جی را گرد هم می‌آورد. با 40 زونا All3Media، لمبرت و تیمش، که شامل تیم هارکورت مدیر ارشد خلاقیت و U.S. رئیس جمهور جک برگس، اکنون می تواند در بایگانی خود در جستجوی IP برای غارت و نمایش ها برای بازسازی کند. لمبرت به ددلاین گفت: «ما هیجان زده هستیم که بخشی از یک گروه بزرگ هستیم. ما از این واقعیت که به یک کتابخانه حقوقی بسیار مهم دسترسی داریم، از جمله نمایش‌های زیادی که در RDF انجام دادیم و ناگهان به آنها دسترسی پیدا کردیم، هیجان‌زده هستیم.» Watch on Deadline Studio Lambert در حال حاضر دارای فرم هایی برای بازگرداندن و احیای برخی از بزرگترین موفقیت های خود مانند The Circle است که زندگی خود را در Channel 4 در بریتانیا آغاز کرد، قبل از تبدیل شدن به یک سریال Netflix و اکنون در Hulu پخش می شود، و Undercover Boss که برای 11 فصل از شبکه CBS بین سال های 2010 و 2010 پخش شد و در حال حاضر برای پخش در شبکه Sky ساخته شده است. درو کری به عنوان میزبان باید ببینیم آیا زندگی جدیدی برای فرنچایزهایی مانند Wife Swap وجود دارد، که اخیراً به یک وسیله نقلیه Real Housewives تبدیل شده است، Faking It، «پیگمالیون امروزی» که هفت فصل در بریتانیا پخش شد و برای TLC در اوایل نواختی ها اقتباس شد، Secret Millionaire، که برای هر", "image_url": "https://deadline.com/wp-content/uploads/2026/11/NUP_207960_01298.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۴ آذر • ۲۰:۱۵"}, {"source": "Netflix NL", "title": "Netflix verrast met unieke romantische dramaserie", "link": "https://www.netflix-nederland.nl/netflix-verrast-met-unieke-romantische-dramaserie/", "summary": "Kan Netflix ons nog verrassen? Na al die jaren? Het antwoord is ja ! De streamingdienst kom nu namelijk met een unieke serie, de allereerste van zijn soort. De allereerste originele Netflix-serie uit Pakistan! Uniek: romantische dramaserie uit Pakistan op Netflix Het gaat hier om Jo Bachay Hain Sang Samait Lo (All the Love Our Hearts Carry), een Pakistaanse romantische dramaserie en dus tevens de allereerste originele Pakistaanse Netflix-serie. Het verhaal speelt zich af in Pakistan en Europa en volgt zes met elkaar verweven liefdesverhalen, verspreid over drie verschillende generaties. Het verhaal van de show draait om Sikandar Sheheryar (Ahad Raza Mir), een Pakistaanse jurist die aan Harvard heeft gestudeerd en tegenwoordig in Rome woont. Hoewel hij op professioneel vlak succesvol is, gaat hij gebukt onder een traumatische gebeurtenis uit zijn verleden. Hij kampt met slapeloosheid en nachtmerries en heeft zich emotioneel vrijwel volledig afgesloten voor de buitenwereld. Zijn leven neemt een onverwachte wending wanneer hij in Italië kennismaakt met Liza (Iqra Aziz), een getalenteerde kunstenares die eveneens een ingewikkeld verleden met zich meedraagt. Hoewel beiden met hun eigen problemen worstelen, ontstaat er langzaam een bijzondere band tussen de twee. Hun ontmoeting biedt hun de mogelijkheid om het verleden een plaats te geven en opnieuw iemand in vertrouwen te nemen. Ondertussen maken we kennis met Mahmood (Fawad Khan), die door omstandigheden moet terugkeren naar zijn geboortedorp, waar verantwoordelijkheden tegenover zijn familie op hem wachten. Ook zijn ingewikkelde relatie met Vittoria (Sanam Saeed) speelt een belangrijke rol. Daarnaast volgen we Rahat (Mahira Khan), een vrouw die worstelt met onopgeloste gevoelens uit haar romantische verleden. Andere verhaallijnen draaien om de moeizame relatie tusse op Exchange»، سریال دیجیتالی زنده سلبریتی‌ها که توسط جیسون کندی کهنه‌کار «E! News» و بازیگر کاروچه تران میزبانی می‌شد، در ماه اول بیش از ۱۱ میلیون بازدید داشت. این نمایش در 12 اکتبر آغاز شد. مهمانان شامل کریس پرت، پاتریک شوارتزنگر، بلیک گریفین، هدر مک ماهان، دیوید هنری و دالاس جنکینز و دیگران بودند. \"The Pop Exchange\" [ ] مهمانان برنامه شامل کریس پرت، پاتریک شوارتزنگر و بلیک گریفین بودند. «The Pop Exchange»، سریال دیجیتالی زنده سلبریتی‌ها که توسط جیسون کندی کهنه‌کار «E! News» و بازیگر کاروچه تران میزبانی می‌شد، در ماه اول بیش از ۱۱ میلیون بازدید داشت. «The Pop Exchange» هر دوشنبه و جمعه به‌طور زنده در YouTube پخش می‌شود و قسمت‌های کامل آن نیز در Spotify و Apple Podcasts و کلیپ‌های اضافی در YouTube Shorts، Instagram، TikTok و X به اشتراک گذاشته می‌شود. داستان‌های مرتبط به اندرو رانلز گفته شد که از کوین اسپیسی پس از ملاقات پشت صحنه در «کتاب مورمون» «دور بماند». او سپس یک «نامه دست‌نویس» فرستاد، «از من در یک قرار می‌پرسد» هیجان‌انگیز توطئه بیداری، با بازی کوین اسپیسی، در ایالات متحده منتشر می‌شود (اختصاصی) تعداد بینندگان بر اساس بازدیدها از کانال‌های نمایش و بازپست‌های شخص ثالث است. کندی در بیانیه‌ای گفت: «چیزی که این نمایش را بسیار سرگرم‌کننده می‌کند این است که هیچ دو مکالمه‌ای شبیه هم نیستند. ما می‌خواستیم چیزی بسازیم که احساس تازگی و خودانگیختگی داشته باشد، جایی که بتوانیم شخصیت‌ها و تجربیات خود را در ترکیب بیاوریم، دیدگاه‌های مختلف را بشنویم و به آنچه در لحظه اتفاق می‌افتد پاسخ دهیم. همراهی تماشاگران باعث می‌شود هر نمایشی جذاب‌تر شود.»", "image_url": "https://variety.com/wp-content/uploads/2026/11/split-image-1000_07d1c1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۴ آذر • ۲۰:۰۶"}, {"source": "Variety", "title": "Box Office: ‘Hunger Games: Sunrise on the Reaping’ Scores $16 Million on Tuesday, ‘Hexed’ Earns $2 Million in Previews", "link": "https://variety.com/2026/film/box-office/sunrise-on-the-reaping-box-office-hunger-games-prequel-hexed-previews-1236958028/", "summary": "Lionsgate s Hunger Games prequel
