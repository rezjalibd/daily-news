lender accident. Much of Stewart's finest work was on the stage; other performances remain rather shockingly hard to come by (whither I, Claudius ?). Nonetheless, he left a true legacy behind him, well beyond Captain Picard and Professor X. Here are 10 of his most iconic other roles. Jeffrey (1995) A goofy, feel-good gay rom-com with the HIV/AIDS crisis still very much in the foreground, Jeffrey was a near-impossibility in the mid-1990s: a movie that neither villainized its queers nor treated them as pitiable martyrs. Steven Weber and Michael T. Weiss are the leads, joined by a cast that includes Christine Baranski, Victor Garber, Nathan Lane, Olympia Dukakis, and Sigourney Weaver but, for all those names, Stewart is the undeniable standout as Sterling, the irrepressible gay best friend: a swishing, mincing, sassy, high-camp character who steals every scene without ever becoming a caricature. He's the leader of the \"Pink Panthers,\" a squad of queers who defend locals from gay bashers, and that is the key to the character's power: He's as gay as they come, but not ashamed and not even a little weak. This movie, and the presence of Captain Picard himself in it, might have saved my life back in 1995. Stream Jeffrey on Prime Video , Tubi , and The Roku Channel . Jeffrey (1995) at Prime Video Learn More Learn More at Prime Video Excalibur (1981) A sprawling, epic, and appropriately lusty take on the ", "date_str": "2026-10-30T14:00:00+00:00", "hash": "76836fdb752d8cc8", "title_fa": "10 تا از نمادین ترین نقش های پاتریک استوارت فراتر از کاپیتان پیکارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. سر پاتریک استوارت، بازیگری که به همان اندازه در خانه روی صحنه شرکت رویال شکسپیر و بر روی پل کشتی ستاره‌ای اینترپری، در سن 86 سالگی درگذشت. برای بسیاری از ما غیرمنتظره بود، تا حدی به این دلیل که او آخرین بیماری خود را مخفی نگه داشت، اما بیشتر به این دلیل که زمانی به نظر می‌رسید که هیچ چیز نمی‌تواند در ضمیر فرهنگی ما تأثیر بگذارد. مجری متفکر و فرهیخته ای که دوران کودکی پر دردسری را در یورکشایر طبقه کارگر داشت. سوسیالیست متعهد که در نهایت توسط ملکه الیزابت به مقام شوالیه رسید. مدافعی که پول و صدای قابل توجه خود را صرف مبارزه برای پذیرش LGBTQ+ و رفاه حیوانات و علیه خشونت خانگی کرد، حضور و اجرای او برای من و بسیاری دیگر دنیا (حتی کهکشان) معنی داشت. اما کسانی که او را شخصاً می‌شناختند می‌توانند ادای احترام بیشتری ارائه کنند. شاید بهتر باشد به شاه بازیکن شکسپیر که توسط خود استوارت در مقابل هملت دیوید وارنر در سال 1965 اجرا شد: جایی که شادی بیشتر لذت می برد، غم و اندوه بیشتر سوگواری می کند؛ شادی غم، شادی غمگین است، در تصادفی باریک. بسیاری از بهترین کارهای استوارت روی صحنه بود. اجراهای دیگر به‌طور تکان‌دهنده‌ای سخت به دست می‌آیند (من، کلودیوس؟). با این وجود، او میراث واقعی را پشت سر خود به جا گذاشت، بسیار فراتر از کاپیتان پیکارد و پروفسور X. جفری (1995) یک رام همجنسگرای احمق و با احساس خوب با بحران اچ آی وی/ایدز که هنوز در پیش زمینه بود، جفری در اواسط دهه 1990 تقریباً غیرممکن بود: فیلمی که نه افراد عجیب و غریب خود را شرور کرد و نه با آنها به عنوان شهدای رقت انگیز رفتار کرد. استیون وبر و مایکل تی. ویس بازیگرانی هستند که شامل کریستین بارانسکی،", "image_url": "https://lifehacker.com/imagery/articles/01M64QGT3X9KW7BBBZVYSC0ZV4/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۸ آبان • ۱۷:۳۰"}],
      media: [{"source": "Billboard", "title": "Aaron Frazer Doubles Down on Soul with New ‘Corners’ EP: ‘Simple Things Can Be Elegant’", "link": "https://www.billboard.com/music/music-news/aaron-frazer-corners-ep-interview-1236371054/", "summary": "When Aaron Frazer released his first solo album Introducing… in January of 2021, times were drastically different for musicians. He was on a break from his longtime band Durand Jones The Indications , and most of the country was still observing COVID-safety lockdowns that forced everyone to slow down. “My first solo album, it was super cool to put it out at a time when there wasn t actually a ton of other music coming out — and so it spent a lot of time in the spotlight,” says Frazer of the 2021 album, which was produced by Dan Auerbach of The Black Keys. Since then, Frazer has released two Indication albums and a second solo set — and, today, he releases his 6-track EP Corners via Dead Oceans. Frazer — whose musical output has included inspiration from soul, R B, funk, disco and hip-hop — is prolific when it comes to putting out music, but wanted to slow things down for his latest collection, which taps deeper into the rhythmic roots of the 1960s and 1970s. “My initial plan was just to put out 12 singles — because I feel a certain level of, I guess, frustration that when you look at album streams, and you take away the singles, you see a linear decline from the first song to the last song,” he explains. “People don t finish albums, and the stuff that I put on the at the end of albums, I don t put it there because it s my least favorite.” So, Corners is a quick 19-minute collection of songs that any soul-loving crate digger would be ecstatic to find on dusty 45s at a used record store. Lead by singles “It’s a Shame,” a groovy slow-jam, and the call-and-response ballad “Paint a Picture,” the EP is an experiment in releasing independent music in the ever-evolving streaming era. “That s the other thing that s so hard about trying to tweak any sort of formula – there is no control group. Every single variable is changing all the time,” Frazer says. But the one thing he chose not to tweak was the sound. While his other projects have traveled through genres, Corners doubles down on the genre he knows best. Much like the most recent Indications album, 2025’s Flowers , the new EP takes a step back from modern flourishes and seeps itself in simplicity and sincerity of soul’s past. “Rather than always pushing into a new chapter, I wanted to go deep and see if I can put the lessons that happen through this iterative process of an album cycle, apply them to the thing that is at the core of what I do, which is late 60s into 70s soul music,” Frazer says. “It s like how ", "date_str": "2026-10-30T18:57:36+00:00", "hash": "c63a10c2c51ea18c", "title_fa": "آرون فریزر با EP جدید «Corners» روح را دو چندان می کند: «چیزهای ساده می توانند زیبا باشند»", "summary_fa": "هنگامی که آرون فریزر اولین آلبوم انفرادی خود را به نام معرفی… در ژانویه 2021 منتشر کرد، زمان برای نوازندگان به شدت متفاوت بود. او در حال استراحت از گروه قدیمی خود Durand Jones The Indications بود و بیشتر نقاط کشور همچنان قوانین قرنطینه ایمنی ناشی از کووید را رعایت می کردند که همه را مجبور به کاهش سرعت می کرد. فریزر درباره آلبوم 2021 که توسط Dan Auerbach از The Black Keys تهیه شده بود، می گوید: \"اولین آلبوم انفرادی من، بسیار جالب بود که آن را در زمانی منتشر کنم که در واقع تعداد زیادی موسیقی دیگر منتشر نمی شد - و بنابراین زمان زیادی را در کانون توجه سپری کرد.\" از آن زمان، فریزر دو آلبوم Indication و یک مجموعه انفرادی دوم منتشر کرده است - و امروز، او 6 آهنگ EP Corners خود را از طریق Dead Oceans منتشر می کند. فریزر - که خروجی موسیقی او شامل الهام از سول، آر بی، فانک، دیسکو و هیپ هاپ است - در اجرای موسیقی بسیار پربار است، اما می‌خواست سرعت کار را برای آخرین مجموعه‌اش که عمیق‌تر به ریشه‌های ریتمیک دهه‌های 1960 و 1970 می‌خورد، کند کند. او توضیح می‌دهد: «برنامه اولیه من فقط انتشار 12 تک‌آهنگ بود – چون حدس می‌زنم سطح خاصی از ناامیدی را احساس می‌کنم که وقتی به جریان‌های آلبوم نگاه می‌کنید، و تک‌آهنگ‌ها را حذف می‌کنید، یک افت خطی از آهنگ اول تا آخرین آهنگ را مشاهده می‌کنید. مردم آلبوم‌ها را تمام نمی‌کنند، و چیزهایی را که در انتهای آلبوم‌ها می‌گذارم، آن‌ها را آنجا نمی‌گذارم زیرا کمترین مورد علاقه من است.» بنابراین، Corners یک مجموعه سریع 19 دقیقه‌ای از آهنگ‌هایی است که هر حفاری جعبه‌های دوست‌داشتنی از یافتن آن در 45s گرد و غباری در یک فروشگاه ضبط دست دوم لذت می‌برد. EP که توسط تک‌آهنگ‌های «Is a Shame»، یک آهسته‌جم شیک،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Aaron-frazer-2026-press-secretly-group-cr-kalie-johnston-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۲۲:۲۷"}, {"source": "Billboard", "title": "The 25 Biggest Halloween Songs of All Time on the Hot 100", "link": "https://www.billboard.com/lists/biggest-halloween-songs-spooky-music-hits/", "summary": "Halloween songs might not be as beloved or profitable as Christmas music (though that’s changing a bit), but there’s no denying the grave reality that people go batty for spooky songs as Oct. 31 approaches. Simply put, folks who want to avoid spooky songs around All Hallows’ Eve don’t have a ghost of a chance. And while we all have our favorites, there are some seasonally appropriate songs that loom larger in the history of the Billboard Hot 100 than others. We decided to round up the 25 Biggest Halloween Songs based on their Hot 100 chart achievements (see below for a detailed explanation). No bones about it the results might leave some people howling mad. Frightening as it may be to fans of the King of Pop, Michael Jackson’s iconic “Thriller” isn t in the top 10 of this list of 25 songs but as of 2026, it makes the top 20 of this list for the first time, fueled in part by a boost from the 2026 biopic Michael . Regardless of its ranking on this list, it’s inarguably a perennial staple – one as essential to the season as those holding Frankenstein’s Monster together. So what did make the list? No need for us to be cryptic – read on and find out. Billboard’s Biggest Halloween Songs ranking is based on weekly performance on the Hot 100 (through the Oct. 31, 2026-dated charts), and includes Halloween-themed hits or songs with a seasonal word in its title (“spooky,” “devil,” “monster,” “witch,” etc.). Songs are ranked based on an inverse point system, with weeks at No. 1 earning the greatest value and weeks at lower spots earning the least. Due to changes in chart methodology over the years, eras are weighted differently to account for chart turnover rates during various periods. Additional research by Xander Zellner.", "date_str": "2026-10-30T18:53:39+00:00", "hash": "e67e24285799eb13", "title_fa": "25 آهنگ بزرگ هالووین تمام دوران در هات 100", "summary_fa": "آهنگ‌های هالووین ممکن است به اندازه موسیقی کریسمس محبوب یا سودآور نباشند (اگرچه این کمی تغییر کرده است)، اما نمی‌توان این واقعیت بزرگ را انکار کرد که مردم با نزدیک شدن به 31 اکتبر به دنبال آهنگ‌های شبح آور هستند. به زبان ساده، افرادی که می‌خواهند از آهنگ‌های شبح آور در حوالی شب All Hallows اجتناب کنند، شانسی برای شبح ندارند. و در حالی که همه ما آهنگ های مورد علاقه خود را داریم، برخی آهنگ های مناسب فصلی وجود دارند که در تاریخ Billboard Hot 100 بزرگتر از بقیه به نظر می رسند. ما تصمیم گرفتیم 25 آهنگ بزرگ هالووین را بر اساس دستاوردهای 100 نمودار داغ آنها جمع آوری کنیم (برای توضیح دقیق به زیر مراجعه کنید). هیچ چیزی در مورد آن وجود ندارد، نتایج ممکن است برخی از مردم را عصبانی کند. «Thriller» نمادین مایکل جکسون هر چند برای طرفداران پادشاه پاپ ترسناک باشد، در بین 10 آهنگ برتر این فهرست 25 آهنگی قرار ندارد، اما از سال 2026، برای اولین بار در بین 20 آهنگ برتر این فهرست قرار می گیرد، که بخشی از آن با تقویت فیلم بیوگرافی مایکل در سال 2026 تقویت شده است. صرف نظر از رتبه‌بندی آن در این فهرست، بی‌گمان یک کالای اصلی دائمی است - به اندازه کسانی که هیولای فرانکنشتاین را در کنار هم نگه می‌دارند، برای فصل ضروری است. پس چه چیزی فهرست را ساخته است؟ نیازی نیست که ما مرموز باشیم - ادامه دهید و پیدا کنید. رتبه‌بندی بزرگترین آهنگ‌های هالووین بیلبورد بر اساس اجرای هفتگی در Hot 100 (تا نمودارهای تاریخ 31 اکتبر 2026) است و شامل آهنگ‌ها یا آهنگ‌هایی با مضمون هالووین با یک کلمه فصلی در عنوان آن است («شحورآمیز»، «شیطان»، «هیولا»، و غیره. آهنگ‌ها بر اساس یک سیستم امتیاز معکوس رتبه‌بندی می‌شوند که هفته‌ها در رتبه اول بیشترین ارزش را دارند و هفته‌ها", "image_url": "https://www.billboard.com/wp-content/uploads/2023/10/jack-o-lantern-mirror-ball-2023-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۸ آبان • ۲۲:۲۳"}, {"source": "Billboard", "title": "Mizuho Kusanagi’s ‘Akatsuki no Yona’ Vol. 48 Debuts at No. 1 on Billboard Japan Book Hot 100", "link": "https://www.billboard.com/music/chart-beat/mizuho-kusanagi-akatsuki-no-yona-48-japan-book-hot-100-1236371193/", "summary": "Mizuho Kusanagi’s Akatsuki no Yona ( Yona of the Dawn ) Vol. 48 hits No. 1 on the Billboard Japan Book Hot 100 chart released Oct. 29. The final volume of Akatsuki no Yona , which began serialization in Hana to Yume magazine in 2009, debuts at No. 1, landing in the top five across three metrics: brick-and-mortar, e-commerce (EC) and e-books. FANTASTICS member Yusei Yagi’s second photo book Be my enters at No. 2, topping the EC metric. Last week’s No. 1, Gosho Aoyama’s Meitantei Conan Vol. 109 follows at No. 3, staying at No. 1 in brick-and-mortar. At No. 4, Souryu’s Kou Iu no ga Ii Vol. 14 leads the e-books metric, while Yu Nagira’s Nanji, Hoshi no Gotoku comes in at No. 5, topping both subscriptions and social media. This week, chart-topper Akatsuki no Yona scored well-balanced points across the metrics, while each of the titles at Nos. 2 through 5 claimed No. 1 on a metric of its own. Akiko Abe’s Cafuné , whose paperback edition was released Oct. 15, holds at No. 6 and remains in the top 10. The Billboard Japan Book Hot 100 is a comprehensive chart combining physical books, e-books, subscriptions such as library loans, and social media buzz. Below are the top 10 titles on this week’s list, tracking the week from Oct. 19 to 25. (Numbers in parentheses indicate the title’s metric placements for brick-and-mortar, EC, e-books, subscriptions, and social media, top 20 only. English title given if translations or adaptations exist.) 1. Akatsuki no Yona ( Yona of the Dawn ) Vol. 48, Mizuho Kusanagi (2/4/2/–/–) 2, Yagi Yusei 2nd Shashinshuu “Be my , ” Yusei Yagi (–/1/–/–/–) 3. Meitantei Conan ( Detective Conan / Case Closed ) Vol. 109, Gosho Aoyama (1/17/–/–/–) 4. Kou Iu no ga Ii Vol. 14, Souryu (18/–/1/–/–) 5. Nanji, Hoshi no Gotoku ( You, Like a Star ), Yu Nagira (4/–/–/1/1) 6. Cafuné , Akiko Abe (5/–/–/7/2) 7. Hotaru no Yomeiri Gaiden Hitokiri to Youdou Vol. 13, Oreco Tachibana (6/7/5/–/–) 8. Shangri-La Frontier Vol. 28, Katarina, Ryosuke Fuji (3/15/18/–/–) 9. Tsutte Tabetai Gyaru Sawa-san Vol. 7, Kazuki Funatsu (16/–/4/–/–) 10. Hoshi wo Amu , Yu Nagira (13/–/–/19/3)", "date_str": "2026-10-30T18:21:21+00:00", "hash": "2565cebe6a79264b", "title_fa": "میزوهو کوساناگی «آکاتسوکی نو یونا» جلد. 48 اولین بار در رتبه 1 در Billboard Japan Book Hot 100", "summary_fa": "میزوهو کوساناگی آکاتسوکی نو یونا (یونای طلوع) جلد. 48 بازدید شماره 1 در جدول 100 کتاب داغ بیلبورد ژاپن در 29 اکتبر منتشر شد. جلد آخر Akatsuki no Yona که در سال 2009 پخش سریالی در مجله Hana to Yume را آغاز کرد، در رتبه اول قرار گرفت و در سه معیار در پنج معیار برتر قرار گرفت: brick-and-mortar (EC.com) و e-comortar (EC.com) دومین آلبوم عکس یوسی یاگی، عضو FANTASTICS، به من وارد شوید در رتبه 2، بالاتر از معیار EC. شماره 1 هفته گذشته، Gosho Aoyama's Meitantei Conan Vol. شماره 109 در شماره 3 دنبال می شود و در آجر و ملات در شماره 1 باقی می ماند. در شماره 4، Souryu’s Kou Iu no ga Ii Vol. 14 پیشتاز معیار کتاب‌های الکترونیکی است، در حالی که Nanji، Hoshi no Gotoku از Yu Nagira در رتبه پنجم قرار دارد و هم در اشتراک‌ها و هم در شبکه‌های اجتماعی صدرنشین است. این هفته، آکاتسوکی نو یونا، بالاترین جدول، امتیازات متعادلی را در تمام معیارها به دست آورد، در حالی که هر یک از عناوین شماره های 2 تا 5 بر اساس معیارهای خاص خود، رتبه 1 را کسب کردند. Akiko Abe’s Cafuné که نسخه شومیز آن در 15 اکتبر منتشر شد، در رتبه اول قرار دارد. رتبه 6 و همچنان در 10 مورد برتر باقی مانده است. Billboard Japan Book Hot 100 نمودار جامعی است که کتاب های فیزیکی، کتاب های الکترونیکی، اشتراک هایی مانند امانت کتابخانه، و صدای رسانه های اجتماعی را ترکیب می کند. در زیر 10 عنوان برتر در فهرست این هفته وجود دارد که هفته را از 19 تا 25 اکتبر دنبال می‌کند. (اعداد داخل پرانتز نشان‌دهنده مکان‌های متریک عنوان برای آجر و ملات، EC، کتاب‌های الکترونیکی، اشتراک‌ها، و رسانه‌های اجتماعی، تنها 20 عنوان برتر هستند. در صورت وجود ترجمه یا اقتباس، عنوان انگلیسی داده می‌شود.)", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Akatsuki-no-Yona-48.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۲۱:۵۱"}, {"source": "Billboard", "title": "MAZZEL Scores First Japan Hot 100 No. 1 With ‘Touch,’ Naniwa Danshi’s ‘Moonlit’ Follows", "link": "https://www.billboard.com/music/chart-beat/mazzel-japan-hot-100-number-1-touch-naniwa-danshi-moonlit-1236371185/", "summary": "MAZZEL’s “Touch” debuts atop the Billboard Japan Hot 100 chart released Oct. 28. This love song depicting everyday life with a partner is the title song of the group’s fifth single, released Oct. 21. Although it came in at No. 3 for physical sales with 120,498 copies, it placed high across other metrics, with No. 2 on radio, No. 2 on downloads (9,264 units) and No. 3 on video views, while also reaching No. 14 on streaming. Naniwa Danshi’s “Moonlit” bows at No. 2. The title song of the group’s 11th single, released Oct. 21, serves as the theme song for the film Uruwashi no Yoi no Tsuki ( In the Clear Moonlit Dusk ) starring member Shunsuke Michieda. The track launched with 407,879 copies to top sales and also claimed No. 1 on downloads (15,153 units). Lienel’s “Ai no Dabada,” released the same day, soars 38-3. The title song of the group’s second major-label single came in at No. 2 for sales with 358,532 copies and No. 18 for streaming. EBiDAN’s “Yes! Tokyo” follows at No. 4, leading video and coming in at No. 3 for streaming (8,444,959 streams). Ayumu Imazu’s “Musubi” lands at No. 5 on the strength of No. 2 on streaming (8,543,192 streams) and No. 8 on radio. STARISH’s “PRISM FOREVER!” enters at No. 6. Commemorating the 15th anniversary of the Uta no Prince-sama anime series, the new single was released Oct. 21 and sold 107,691 copies to land at No. 4 for sales. Vaundy’s “Shiwaawase” holds at No. 7. The theme song for the film Mama ga Mou Kono Sekai ni Inakutemo: Watashi no Inochi no Nikki ( All Our Tomorrows ) tops streaming (8,645,650 streams). M!LK’s “Sukisugite Metsu!” rises 9-8, posting No. 4 on karaoke. A2O LITE’s “NEON” jumps 45-9, reaching No. 4 on streaming (5,191,353 streams). Mrs. GREEN APPLE’s “Brand New” closes out the top 10 at No. 10, with No. 5 on streaming (5,119,976 streams). Among other new entries, 22/7’s “CALL RESPONSE” debuts at No. 11 and KID PHENOMENON’s “I’m still breathing” at No. 17. GNJB’s “Love Reason” enters at No. 16 with No. 7 on streaming (4,648,127 streams). Rounding out the week’s debuts, Da-iCE’s “Uraraka,” the theme song for the Fuji TV Thursday drama Nami Urarakani, Meoto Biyori , starts at No. 30, and Uru’s “Sorenanoni,” the theme song for the drama Ani Imouto , arrives at No. 39. The Billboard Japan Hot 100 combines physical and digital sales, audio streams, radio airplay, video views and karaoke data. See the full Billboard Japan Hot 100 chart, tallying the week from Oct. 19 to 25, here . For more on Japanese music ", "date_str": "2026-10-30T18:16:55+00:00", "hash": "bccf78332d58d808", "title_fa": "MAZZEL با «لمس» برای اولین بار در رتبه 100 داغ ژاپن قرار گرفت، آهنگ «مهتاب» نانیوا دانشی دنبال می‌شود.", "summary_fa": "اولین آهنگ MAZZEL \"Touch\" در صدر جدول 100 بیلبورد ژاپن منتشر شد. این آهنگ عاشقانه که زندگی روزمره را با شریک زندگی به تصویر می‌کشد، عنوان آهنگ پنجمین تک‌آهنگ گروه است که در 21 اکتبر منتشر شد. اگرچه با 120,498 فروش فیزیکی در رتبه 3 قرار گرفت. دانلودها (9264 واحد) و شماره 3 در بازدیدهای ویدیویی، در حالی که در پخش جریانی نیز به رتبه 14 رسیده است. \"مهتاب\" نانیوا دانشی در شماره 2 تعظیم می کند. آهنگ عنوان یازدهمین تک‌آهنگ گروه که در 21 اکتبر منتشر شد، به عنوان آهنگ تم فیلم Uruwashi no Yoi no Tsuki (در غروب ماه روشن) با بازی عضو Shunsuke Michieda است. این آهنگ با 407,879 نسخه به فروش برتر راه یافت و همچنین رتبه 1 در دانلود (15,153 واحد) را به خود اختصاص داد. آهنگ \"Ai no Dabada\" از Lienel که در همان روز منتشر شد، 38-3 صعود کرد. آهنگ عنوان دومین تک‌آهنگ اصلی این گروه با 358532 نسخه در رتبه دوم فروش و برای پخش در رتبه 18 قرار گرفت. EBiDAN \"بله! توکیو\" در رتبه 4، ویدیوی پیشرو و رتبه 3 برای استریم (8444959 استریم) قرار دارد. \"Musubi\" از Ayumu Imazu با قدرت شماره 2 در استریم (8543192 استریم) و شماره 8 در رادیو \"PRISMVEROREs!\" در رتبه 5 قرار دارد. به مناسبت پانزدهمین سالگرد سری انیمه Uta no Prince-sama، تک‌آهنگ جدید در 21 اکتبر منتشر شد و 107691 نسخه فروخت تا در رتبه 4 فروخته شود. \"Shiwaawase\" از Vaundy در رتبه 7 قرار دارد. آهنگ تم فیلم Mama ga Mou Kono Sekai ni Inakutemo: Watashi no Inochi no Nikki (همه فرداهای ما) در صدر استریم قرار دارد (8,645,650 استریم). M!LK's \"Sukisugite Metsu!\" 9-8 بالا می رود و شماره 4 را در کارائوکه قرار می دهد. «NEON» A2O LITE با جهش 45-9 به رتبه 4 در پخش (5,191,353 استریم) رسید. آهنگ جدید Mrs.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/MAZZEL.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple", "سینما", "موسیقی"], "datetime_fa": "۸ آبان • ۲۱:۴۶"}, {"source": "Billboard", "title": "Executive Turntable: Mel Curey Joins Believe, ACM Names New Board of Directors", "link": "https://www.billboard.com/lists/executive-turntable-mel-curey-acm-board-of-directors/", "summary": "Believe has named Mel Curley as global head of editorial and marketing partnerships at the company. Within her new role, Curley will be based in New York City and report to chief marketing officer Darya Pourshasb . Prior to her new role at Believe, Curley served as global head of independent label relations at Amazon Music. The new role finds Curley assisting with music discovery for Believe’s artists, working alongside the company’s artist services, label and artist solutions, as well as with TuneCore. “I m thrilled to join Believe at such an exciting time for the company and the music industry,” Curley said in a statement. “The way audiences discover and engage with music is evolving rapidly, creating new possibilities for artists and labels across digital platforms. Believe s global reach, strong artist development expertise and commitment to innovation provide a fantastic foundation to build on. I m excited to help strengthen our platform partnerships, explore new promotional opportunities and drive meaningful, measurable impact for artists and labels around the world. Pourshasb added, “As competition for audience attention intensifies, our ability to connect artists and labels with fans across digital platforms has never been more important, which is why editorial and marketing partnerships are a key pillar of our music marketing strategy. Mel brings an exceptional combination of DSP expertise, music industry experience and strategic vision. I’m confident that her distinctive perspective on the evolving relationship between artists, labels and digital music services will be essential as we continue building on the expertise and contribution of our EMP teams worldwide. I’m delighted to welcome her to Believe and look forward to working together to unlock new opportunities for the artists and labels we serve.” — Ariel King See more music industry hires and promotions below.", "date_str": "2026-10-30T18:11:15+00:00", "hash": "6ec7841ff11a752a", "title_fa": "گردان اجرایی: مل کوری به باور ملحق شد، ACM هیئت مدیره جدید را معرفی کرد", "summary_fa": "Believe مل کرلی را به عنوان رئیس جهانی شراکت های تحریریه و بازاریابی در این شرکت معرفی کرده است. کرلی در نقش جدید خود در شهر نیویورک مستقر است و به مدیر ارشد بازاریابی دریا پورشاسب گزارش می دهد. کرلی قبل از نقش جدیدش در Believe به عنوان رئیس جهانی روابط لیبل مستقل در آمازون موزیک خدمت می کرد. نقش جدید کرلی را در کشف موسیقی برای هنرمندان Believe می‌یابد، در کنار خدمات هنرمندان، برچسب‌ها و راه‌حل‌های هنرمندان و همچنین با TuneCore کار می‌کند. کرلی در بیانیه ای گفت: \"من از پیوستن به Believe در چنین زمان هیجان انگیزی برای شرکت و صنعت موسیقی هیجان زده هستم.\" روشی که مخاطبان موسیقی را کشف می‌کنند و با آن درگیر می‌شوند به سرعت در حال تکامل است و امکانات جدیدی را برای هنرمندان و برچسب‌ها در پلتفرم‌های دیجیتال ایجاد می‌کند. باور کنید که دسترسی جهانی، تخصص قوی در توسعه هنرمندان و تعهد به نوآوری، پایه و اساس فوق‌العاده‌ای را برای توسعه ایجاد می‌کند. من برای کمک به تقویت شراکت‌های پلتفرم خود، کشف فرصت‌های تبلیغاتی جدید و ایجاد تأثیر معنادار و قابل اندازه‌گیری برای هنرمندان و برچسب‌ها در سراسر جهان هیجان‌زده هستم. پورشاسب افزود: \"با تشدید رقابت برای جلب توجه مخاطبان، توانایی ما برای ارتباط هنرمندان و برچسب ها با طرفداران در سراسر پلتفرم های دیجیتال هرگز مهم نبوده است، به همین دلیل است که شراکت های تحریریه و بازاریابی ستون اصلی استراتژی بازاریابی موسیقی ما هستند. Mel ترکیبی استثنایی از تخصص DSP، تجربه صنعت موسیقی و دیدگاه استراتژیک را به ارمغان می آورد. من مطمئن هستم که دیدگاه متمایز او در مورد رابطه در حال تکامل بین هنرمندان، برچسب ها و خدمات موسیقی دیجیتال ضروری خواهد بود زیرا ما همچنان بر تخصص و مشارکت تیم های EMP خود در سراسر جهان ادامه می دهیم. من خوشحالم که به او در Believe خوش", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Mel-Curley-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۲۱:۴۱"}, {"source": "Billboard", "title": "Annie Lennox, Tom Morello, Desmond Child & More Honored at 2026 SONA Awards:’The Songwriter Prom’", "link": "https://www.billboard.com/lists/2026-sona-awards-annie-lennox-tom-morello-desmond-child/", "summary": "Annie Lennox , Tom Morello and Desmond Child were among the honorees at the 2026 SONA Awards, which were held on Thursday (Oct. 29) at the Skirball Cultural Center in Los Angeles. The event was hosted by Bonnie McKee and Shane Stevens (the latter, a SONA board member). Laurent Hubert , CEO of Kobalt Music received the executive of the year award. The small army of songwriters who wrote songs for KPop Demon Hunters received the Global Impact Award, which was accepted by Daniel Rojas, Danny Chung, Melanie Fontana and Lindgren. Chris Redding won the 2026 Emerging Songwriter Award presented by YouTube. Michelle Lewis , CEO of SONA and the SONA Foundation, welcomed the audience to the organization’s sixth awards event. “Welcome to the most songwriterly night of the year … the songwriter prom.” Related ‘KPop Demon Hunters’ Extends Record for Most Weeks at No. 1 on Billboard’s Soundtracks Chart: Full List Paul Grein Music played a welcome part of the event. Three songs that were No. 1 hits on the Billboard Hot 100 were performed: McKee and Stevens sang Kenny Rogers Dolly Parton ’s “Islands in the Stream” (written by Barry, Maurice and Robin Gibb ) as a tribute to the beloved Parton, who died in August. The hosts also joined Lennox to sing Eurythmics ’ “Sweet Dreams (Are Made of This)” (written by Lennox and her Eurythmics partner David A. Stewart ) to cap the presentation to Lennox. Susanna Hoffs of The Bangles sang that group’s “Eternal Flame” (which she co-wrote with Tom Kelly and Billy Steinberg) over the In Memoriam segment, which included Steinberg, who died in February. In addition, Child protégé Leo Dante sang Aerosmith ’s 1990 top 10 Hot 100 hit “What It Takes” (which Child co-wrote with Joe Perry and Steven Tyler ) as part of the tribute to Child. SONA, which stands for Songwriters of North America, is a membership-based advocacy organization formed in 2015. The SONA Awards were formerly known as the SONA Warrior Awards. The word Warrior remains in the name of two of their awards. Here are highlights from the acceptance speeches of the award recipients at the 2  در بیانیه ای، سخنگوی NFL گفت: ما از تصمیم امروز در درخواست تجدید نظر NFL Sunday Ticket، آخرین پیشرفت در این پرونده که اکنون بیش از 11 سال است که ادامه دارد، ناامید شده ایم. ما همچنان بر این باوریم که استراتژی توزیع رسانه‌ای ما که 100% بازی‌های NFL را در تلویزیون رایگان پخش می‌شود در بازارهای تیم‌های شرکت‌کننده و توزیع ملی محبوب‌ترین بازی‌های ما، که با انتخاب‌های اضافی بسیاری از جمله RedZone، Sunday Ticket و NFL Plus تکمیل می‌شود، ارائه می‌کند - تا حد زیادی دوست‌دارترین مدل توزیع برای طرفداران در همه ورزش‌ها و سرگرمی‌ها است. نماینده NFL اضافه کرد، ما از توجه هیئت به این پرونده قدردانی می کنیم و گزینه های خود را برای بررسی بیشتر استیناف تصمیم امروز در نظر خواهیم گرفت. در ژوئن 2024، یک هیئت منصفه فدرال در لس آنجلس پس از اینکه متوجه شد لیگ با دایرک تی وی و شرکای شبکه برای افزایش قیمت بسته انحصاری بازی های یکشنبه تیکت توطئه کرده است، به NFL دستور داد تا 4.7 میلیارد دلار غرامت بپردازد. اما قاضی فیلیپ گوتیرز از ایالات متحده دادگاه ناحیه مرکزی ناحیه مرکزی کالیفرنیا حکم غرامت هیئت منصفه را رد کرد و نوشت که", "image_url": "https://variety.com/wp-content/uploads/2024/05/NFL-Netflix.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۸ آبان • ۲۱:۴۶"}, {"source": "Variety", "title": "Patrick Stewart Changed Genre Acting Forever With ‘Star Trek’ and ‘X-Men’", "link": "https://variety.com/2026/tv/columns/patrick-stewart-changed-genre-acting-star-trek-x-men-1236935337/", "summary": "I will never claim to be a true Shakespeare buff, save for having read plays like “Romeo Juliet” or “Julius Caesar” in school many years ago. But ever since I learned of the death of Sir Patrick Stewart, a line from “Hamlet” has been at the forefront of my mind. “He was a man, [ ]", "date_str": "2026-10-30T18:01:44+00:00", "hash": "63216a7e02369703", "title_fa": "پاتریک استوارت با «Star Trek» و «X-Men» ژانر بازیگری را برای همیشه تغییر داد.", "summary_fa": "من هرگز ادعا نمی‌کنم که عاشق شکسپیر واقعی هستم، مگر اینکه سال‌ها پیش نمایشنامه‌هایی مانند «رومئو ژولیت» یا «ژولیوس سزار» را در مدرسه خوانده‌ام. اما از زمانی که از مرگ سر پاتریک استوارت مطلع شدم، خطی از «هملت» در خط مقدم ذهنم بود. «او مرد بود، [ ] «او مرد بود، در کل او را بپذیرید، دیگر به مانند او نگاه نخواهم کرد.» آنها خیلی ساده مردانی را مانند پاتریک استوارت نمی کنند. او مردی با جاذبه های باورنکردنی، مردی با وقار و فضل بود. صدای باریتون او می‌تواند شما را به اندازه یکسان، اغلب در فضای یک صحنه تکان دهد و یا به اشک بریزد. داستان‌های مرتبط، بلا باجاریا، رئیس محتوای نتفلیکس درباره نظارت بر داستان‌سرایی جهانی: قدرت فوق‌العاده من این است که افراد واقعاً عالی را استخدام می‌کنم و به آنها اجازه می‌دهم کارشان را انجام دهند کیانو ریوز در فیلم اکشن نتفلیکس ایفای نقش کند گرداب پس از کناره‌گیری آلن ریچسون، با این حال، او همچنین دارای یک شوخ طبعی غیرقابل توجه یا غیر جدی بود. چیزهایی که با توجه به رفتار شکسپیرانه او، شما را سخت تر می خنداند. من نمی توانم استوارت را در نقش اوری بولاک در سریال انیمیشن «پدر آمریکایی» تصور کنم که جملاتی مانند «تو مرد پیچیده ای هستی، اسمیت. من دوست دارم با تو قارچ بازی کنم» و از خنده منفجر نشود. به بیان ساده، پاتریک استوارت فقط یک بازیگر نبود. او یک هنرپیشه بود، سرمایه A. تمام وجودش وقف دستیابی به کمال در هنرش بود. حتی زمانی که او در سنی بود که می توانست به راحتی از آنجا دور شود و در هر کجای دنیا زندگی راحت و فراغتی داشته باشد، به کار روی صحنه و اکران ادامه داد. چون بازیگری او را به حرکت درآورده و همیشه تلاش می‌کرد بهتر از قبل باشد.", "image_url": "https://variety.com/wp-content/uploads/2020/01/patrick-stewart-1-1000-16x9-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۸ آبان • ۲۱:۳۱"}, {"source": "Billboard", "title": "Jamie Miller’s ‘Babydoll’ Bags Second Consecutive Week as U.K. No. 1", "link": "https://www.billboard.com/music/chart-beat/jamie-miller-babydoll-uk-number-1-second-week-1236371004/", "summary": "Jamie Miller has earned a second consecutive week at No. 1 on the U.K. s Official Singles Chart with breakout hit “Babydoll” (Oct. 30). The Cardiff-born musician first hit the top spot last Friday (Oct. 23), dethroning Taylor Swift s song “Patient Zero.” In doing so, he became the first Welsh act to top the charts in 15 years, since Sian Evans featured on DJ Fresh’s 2011 No. 1 “Louder.” He’s also the first Welsh male solo act in 41 years to achieve the feat after Shakin Steven’s chart-topping holiday hit “Merry Christmas Everyone” in 1985. “Babydoll” has recently peaked at No. 70 on the Billboard Hot 100 . Tate McRae ’s “Housewife” holds its position at No. 2, matching the peak seen on this week’s Billboard Hot 100; the song is her highest-ever placing on the U.K. Singles Chart. Ashe’s “Stop The Wedding” lifts one spot to No. 3, followed by Olivia Rodrigo and Chappell Roan’s “Expectations,” down one at No. 4. Sienna Spiro’s “Great Expectation rounds out the top five as a non-mover. “Angel of My Dreams” by former Little Mix member Jade Thirlwall enjoys a massive week-on-week uplift , reentering the top 40 at No. 13. The track was featured during Kylie Jenner’s runway debut at the Victoria Secret Fashion Show, and saw a 328.8% rise in streams. The song previously peaked at No. 7 back in 2024. Fontaines D.C. see three songs from their latest album Dopamine Chamber land inside the top 40: “Japan” (No. 19), “Marianne” (No. 21), and “Mimesis” (No. 34). The album earned the Irish group a new peak on the Billboard 200, landing at No. 14. Harry Styles’ “Coming Up Roses” surges 24 places following the release of a new music video , closing the week at No. 35.", "date_str": "2026-10-30T18:00:00+00:00", "hash": "d8f4ca5092415956", "title_fa": "کیف های «Babydoll» جیمی میلر برای دومین هفته متوالی به عنوان شماره 1 بریتانیا", "summary_fa": "جیمی میلر برای دومین هفته متوالی در جدول تک‌نفره‌های رسمی بریتانیا با موفقیت «Babydoll» (30 اکتبر) در رتبه اول قرار گرفت. این نوازنده متولد کاردیف برای اولین بار جمعه گذشته (23 اکتبر) به مقام اول رسید و آهنگ «بیمار صفر» تیلور سوئیفت را از سلطنت خلع کرد. با انجام این کار، از زمانی که سیان ایوانز در سال 2011 در آهنگ شماره 2011 دی جی Fresh حضور داشت، او اولین بازیگر ولزی بود که در صدر جدول در 15 سال قرار گرفت. 1 \"بلندتر.\" او همچنین اولین بازیگر انفرادی مرد ولزی در 41 سال گذشته است که پس از موفقیت شاکین استیون با عنوان «کریسمس مبارک همه» در سال 1985 به این شاهکار دست یافته است. «خانم‌دار» از تیت مک‌ری جایگاه خود را در رتبه دوم حفظ می‌کند و با اوج نمایش ۱۰۰ بیلبورد داغ این هفته همخوانی دارد. این آهنگ بالاترین رتبه او در جدول تک آهنگ های بریتانیا است. آهنگ Ashe's Stop The Wedding با یک نقطه به رتبه اول می رسد. 3، و پس از آن اولیویا رودریگو و چاپل روآن \"Expectations\"، در رتبه 4 قرار گرفت. \"انتظار بزرگ\" از Sienna Spiro به عنوان یک غیر متحرک، پنج نفر اول را تکمیل می کند. \"Angel of My Dreams\" اثر جید تیرلوال، عضو سابق Little Mix، از یک هفته به هفته، 30 حلقه مجدد در رده بالای 30 هفته برخوردار است. آهنگ در اولین حضور کایلی جنر در نمایش مد ویکتوریا سیکرت نمایش داده شد و شاهد افزایش 328.8 درصدی در استریم‌ها بود. سه آهنگ از آخرین آلبوم آنها Dopamine Chamber را در بین 40 آهنگ برتر ببینید: \"Japan\" (شماره 19)، \"Marianne\" (شماره 21)، و \"Mimesis\" (شماره 34). این آلبوم اوج جدیدی را برای گروه ایرلندی در بیلبورد 200 به ارمغان آورد و در رتبه 14 قرار گرفت. \"Coming Up Roses\" هری استایلز پس از انتشار موزیک ویدیوی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Jamie-Miller-Matthew-Langlois-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۲۱:۳۰"}, {"source": "Billboard", "title": "My Chemical Romance Score First U.K. No. 1 With 20th Anniversary Edition of ‘The Black Parade’", "link": "https://www.billboard.com/music/chart-beat/my-chemical-romance-uk-number-one-black-parade-1236370977/", "summary": "My Chemical Romance has marched to No. 1 with The Black Parade, the emo icons’ first-ever U.K. chart-topper (Oct. 30). Related Will My Chemical Romance Score Its First No. 1 Album Next Week (With a 20-Year-Old Album)? Selena Gomez Celebrates Ups Downs With Demi Lovato: I m Proud of What We ve Been Through Meet Leah Barylsky, the Woman Behind the Camera And On the Stage During Rüfüs Du Sol s Record-Breaking Tour The 2006 record was recently reissued for its 20th anniversary with unreleased tracks and new live recordings; the album hit a peak of No. 2 back upon its original release. The LP could also be in a shoot-out for the No. 1 spot with Olivia Rodrigo ’s you seem pretty sad for a girl so in love on the Billboard 200 charts this week. Fontaines D.C. ’s Dopamine Chamber falls just one spot to No. 2. In its opening week, the fifth album by the Irish group scored the third-biggest debut of 2026 in the U.K., behind Harry Styles and Rodrigo. The LP also earned a career-high on the Billboard 200, closing at No. 14. Another 2006 classic returns to the top five with Amy Winehouse’s Back to Black rising 112 places week-on-week to end the week at No. 4. The LP was reissued as part of wider celebrations of the late icon, including a special show at London’s Roundhouse which saw her original band reunite and contemporary stars Jorja Smith, Sasha Keable and more perform vocals of the Back to Black songs. Rodrigo’s you seem pretty sad for a girl so in love finishes this week s U.K. s Official Albums Chart rankings at No. 3. Michael Jackson s The Essential greatest hits closes at No. 5. The Manic Street Preachers earn their 16th top 10 album with the release of The Holy Bible Live (No. 10) which includes a live performance at the Roundhouse in London recorded in 2014. Michael Kiwanuka’s fifth LP Fudge lands at No. 13. The album was written and recorded prior to the British soul star suffering a stroke in 2025.", "date_str": "2026-10-30T18:00:00+00:00", "hash": "f08f17458669e486", "title_fa": "امتیاز عاشقانه شیمیایی من اولین شماره 1 در بریتانیا با نسخه بیستمین سالگرد «رژه سیاه»", "summary_fa": "My Chemical Romance با رژه سیاه (The Black Rade) به رتبه 1 رسیده است، اولین نمادهای ایمو emo که در جدول برترین نمودار بریتانیا (30 اکتبر) قرار گرفتند. مطالب مرتبط آیا My Chemical Romance اولین آلبوم شماره 1 خود را در هفته آینده (با یک آلبوم 20 ساله) خواهد گرفت؟ سلنا گومز فرازهای نزولی را با دمی لواتو جشن می‌گیرد: من به آنچه از طریق ملاقات با لی باریلسکی، زن پشت دوربین و روی صحنه در طول تور رکوردشکنی روفوس دو سول روی صحنه رفته‌ایم افتخار می‌کنم. رکورد سال 2006 اخیراً برای بیستمین سالگرد آهنگ‌های ضبط‌شده جدیدش با آهنگ‌های زنده و منتشر نشده منتشر شد. آلبوم پس از انتشار اولیه خود به اوج رتبه 2 رسید. LP همچنین می تواند در تیراندازی برای شماره باشد. 1 نقطه با اولیویا رودریگو، به نظر می رسد برای دختری بسیار عاشق در جدول بیلبورد 200 این هفته غمگین است. آلبوم Dopamine Chamber از Fontanes D.C فقط یک پله به رتبه 2 سقوط کرد. در هفته افتتاحیه، پنجمین آلبوم گروه ایرلندی پس از هری استایلز و رودریگو، سومین آلبوم بزرگ سال 2026 را در بریتانیا به دست آورد. LP همچنین در بیلبورد 200 موفق به کسب رتبه 14 شد. یکی دیگر از کلاسیک های سال 2006 با بازگشت به سیاه از امی واینهاوس به پنج نفر برتر باز می گردد که هفته به هفته 112 مکان افزایش می یابد تا هفته را در رتبه 4 به پایان برساند. آلبوم LP به عنوان بخشی از جشن های گسترده تری از نماد متاخر، از جمله نمایش ویژه در Roundhouse لندن که گروه اصلی او را دوباره متحد کرد و ستارگان معاصری از بک اسمیت را اجرا کرد، دوباره منتشر شد. آهنگ ها رودریگو برای دختری بسیار غمگین به نظر می رسد، بنابراین عاشق این هفته در بریتانیا به پایان می رسد. رتبه بندی آلبوم های رسمی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/My-Chemical-Romance-Bryce-Hall-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۲۱:۳۰"}, {"source": "Billboard", "title": "Nelly Recalls Taylor Swift Flying Him Out to Perform at Her Houston Show for $50,000: ‘I Would’ve Did It for Free’", "link": "https://www.billboard.com/music/rb-hip-hop/nelly-taylor-swift-mcdonalds-houston-2011-just-a-dream-1236371006/", "summary": "Nelly and Ashanti pulled up to Taylor Swift and Travis Kelce s star-studded wedding in NYC over the summer, but many might not know that the St. Louis native and T-Swift s friendship goes back over 15 years. Related Nelly Ashanti Get Ready for Taylor Swift and Travis Kelce s Wedding in Reality Show Trailer: Nelly Is a Swiftie Nelly Regains Cool with Taylor Swift s Help Nelly Says He Married Ashanti Because I Didn t Want Her to Be a Baby Mama During a joint appearance on The Breakfast Club earlier this week, Nelly recalled Swift flying him out to Houston to perform at one of her Houston shows. According to IBT, the concert was in November 2011, which would have been at Minute Maid Park on the pop star s Speak Now World Tour. However, in the interview, Nelly said Swift had him come out to perform his 2002 Billboard Hot 100 No. 1 smash Hot in Herre, but footage that would align with the timing and venue shows the duo performing his 2010 Just a Dream anthem. I m a Swiftie, hell yeah, Nelly said. I ve been knowing her for a long time She s popped out at my shows, she s done Dilemma,' he said. This woman called me one night out the blue, Me and my friends made a routine to Hot in Herre last night. I want to ask you a really big favor.' Swift offered to fly Nelly from St. Louis to Houston along with his family for him to pop out as a special guest at the show. She said her team would have him on her private jet, a presidential suite at the Four Seasons, along with $50,000. We only have like $50,000. I said, Can you put that in a McDonald s bag? I would ve did it for free. So I m like, Yeah, we re good. Sent the G5, not four, he quipped. After the three-minute performance, Nelly was tossed a McDonald s bag with $50,000 in it. He hung out to watch the rest of Swift s show with his kids, but didn t even see the hotel room, as the jet was waiting to take him and the family right back to Houston. Nelly and Swift have remained in contact over the years. The 51-year-old and Ashanti were among the approximately 1,000 special guests at the pop supernova and Travis Kelce s extravagant wedding at Madison Square Garden in July. Nelly s Just a Dream arrived in August 2010 and landed on his 5.0 album later that year. The Jim Jonsin and Rico Love-produced hit reached a peak of No. 3 on the Hot 100 — his highest since 2005 s Grillz — and won top streaming song at the 2011 Billboard Music Awards. The Dilemma artist and Swift reunited in 2013 for a performance of Hey Porsche durin", "date_str": "2026-10-30T17:52:51+00:00", "hash": "44eb277f5e2c0d3b", "title_fa": "نلی به یاد می آورد که تیلور سوئیفت او را برای اجرای نمایش در هیوستون با 50000 دلار پرواز می داد: «این کار را رایگان انجام می دادم»", "summary_fa": "نلی و اشانتی در تابستان به عروسی پر ستاره تیلور سوئیفت و تراویس کلس در نیویورک رفتند، اما بسیاری ممکن است ندانند که دوستی بومی سنت لوئیس و تی سوئیفت به بیش از 15 سال قبل برمی گردد. نلی اشانتی برای عروسی تیلور سوئیفت و تراویس کلس در نمایش واقعی تریلر آماده شوید: نلی سوئیفتی است نلی با کمک تیلور سوئیفت حالش خوب می شود نلی می گوید با اشانتی ازدواج کرده است زیرا من نمی خواستم او این هفته دوباره مادر بچه شود، در طول یک حضور مشترک در کلاب Nelly او را به هوستون برد تا در یکی از نمایش های هیوستون اجرا کند. طبق گزارش IBT، این کنسرت در نوامبر 2011 بود که در تور جهانی Speak Now ستاره پاپ در پارک Minute Maid برگزار می شد. با این حال، در این مصاحبه، نلی گفت که سویفت او را وادار کرد تا آهنگ 2002 Hot 100 Billboard Hot No. 1 را در Herre اجرا کند، اما فیلمی که با زمان و محل برگزاری هماهنگی دارد، نشان می‌دهد که این دو در حال اجرای سرود Just a Dream در سال 2010 هستند. نلی گفت من سوئیفتی هستم، جهنم آره. او گفت: مدت زیادی است که او را می شناسم. این زن یک شب به من زنگ زد. من می خواهم از شما یک لطف بزرگ بخواهم. سوئیفت به نلی پیشنهاد داد که به همراه خانواده اش از سنت لوئیس به هیوستون پرواز کند تا او به عنوان مهمان ویژه در این نمایش بیرون بیاید. او گفت که تیمش او را در جت شخصی خود، سوئیت ریاست جمهوری در فور سیزنز، همراه با 50000 دلار خواهد داشت. ما فقط 50000 دلار داریم. گفتم، می‌توانی آن را در کیف مک‌دونالد بگذاری؟ من آن را به صورت رایگان انجام می دادم بنابراین من می گویم، بله، ما خوب هستیم. او با", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/2251646880-e1779996108392.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۲۱:۲۲"}, {"source": "Billboard", "title": "From Sobremesa to Something New, Walmart Celebrates Latino Flavor at Billboard Latin Music Week", "link": "https://www.billboard.com/music/features/walmart-celebrates-latino-flavor-at-billboard-latin-music-week-2026-1236371106/", "summary": "Latino food culture has never been one to stand still. Familiar recipes find new interpretations, family traditions take on new meaning and entrepreneurs bring the flavors they grew up with to tables far beyond their own. It s a culture shaped as much by the traditions we carry as the new ones we create along the way. At Billboard Latin Music Week, Walmart brought that evolution to life through moments of connection, creativity and discovery. From family stories shared over sobremesa to an unexpected twist on Miami s beloved Cubano, the week celebrated the people, flavors and fresh perspectives keeping Latino food culture moving forward. That connection between past and present came to life through Zhamira, who joined Wednesday s Love Music panel at Faena Forum. The singer also stars in a sobremesa campaign in partnership with Walmart, gathering with her parents in Miami for a meal rooted in Latin flavors and family traditions. Over dishes made with products available at Walmart, the family shares memories, stories and the kind of conversations that keep everyone lingering long after the last bite. It s a familiar ritual with a timeless appeal, reminding us that traditions live on through the people who continue to make them their own. Melody Timothee And while family recipes keep traditions alive, Latino entrepreneurs are finding new ways to bring those flavors into everyday life. Throughout the day, attendees could discover La Monarca wedding cookies and Café Olé coffee, a Latino-founded brand available at Walmart. More than a welcome pick-me-up between panels, the pairing offered a glimpse into the growing landscape of Latino-owned food businesses bringing familiar tastes to new audiences. By making these brands easier to discover, Walmart helps connect their stories and products with kitchens across the country. That spirit of reinvention continued into the evening at Wynwood Marketplace, where Walmart joined forces with Billboard and Eater for El Pre Party, a flavorful lead-in to the night s En Vivo concert. Brandon Todd Miami s own Sanguich put a fresh spin on a hometown favorite with a custom Cubano seasoned with Great Value spices and paired with Pisqueya s guava hot sauce, all available at Walmart. The sweet-and-spicy combination refreshed the beloved classic, showing that even familiar recipes can make room for something new. It also spotlighted Pisqueya, a Latino-founded brand bringing a distinctive perspective to Latin cooking. Creators ChefBru", "date_str": "2026-10-30T17:45:38+00:00", "hash": "27194eb50e92fd4a", "title_fa": "از Sobremesa تا چیزی جدید، Walmart طعم لاتین را در هفته موسیقی لاتین بیلبورد جشن می گیرد", "summary_fa": "فرهنگ غذایی لاتین هیچ گاه ثابت نبوده است. دستور العمل های آشنا تفاسیر جدیدی پیدا می کنند، سنت های خانوادگی معنای جدیدی پیدا می کنند و کارآفرینان طعم هایی را که با آن بزرگ شده اند بسیار فراتر از میزهای خود می آورند. این فرهنگی است که به همان اندازه بر اساس سنت هایی که در طول مسیر ایجاد می کنیم، شکل گرفته است. در هفته موسیقی لاتین بیلبورد، والمارت این تکامل را از طریق لحظات ارتباط، خلاقیت و کشف زنده کرد. از داستان‌های خانوادگی به اشتراک گذاشته شده در سوبرمسا گرفته تا تغییر غیرمنتظره‌ای در کوبانوی محبوب میامی، این هفته مردم، طعم‌ها و چشم‌اندازهای تازه را جشن می‌گرفت که فرهنگ غذایی لاتین را به جلو نگه می‌دارد. این ارتباط بین گذشته و حال از طریق ژامیرا، که به پانل موسیقی عشق چهارشنبه در انجمن Faena پیوست، زنده شد. این خواننده همچنین در یک کمپین سوبرمسا با همکاری والمارت بازی می کند و با والدینش در میامی برای یک وعده غذایی که ریشه در طعم لاتین و سنت های خانوادگی دارد جمع می شود. خانواده در کنار غذاهایی که با محصولات موجود در Walmart تهیه می‌شوند، خاطرات، داستان‌ها و نوع مکالماتی را به اشتراک می‌گذارند که همه را مدت‌ها پس از آخرین لقمه معطل نگه می‌دارد. این یک آیین آشنا با جذابیتی جاودانه است و به ما یادآوری می کند که سنت ها از طریق مردمی که همچنان آنها را از آن خود می کنند زنده می مانند. ملودی تیموتی و در حالی که دستور العمل های خانوادگی سنت ها را زنده نگه می دارند، کارآفرینان لاتین در حال یافتن راه های جدیدی برای آوردن این طعم ها به زندگی روزمره هستند. در طول روز، شرکت‌کنندگان می‌توانند کوکی‌های عروسی La Monarca و قهوه کافه اوله، یک برند لاتینی را که در Walmart وجود دارد، کشف کنند. این جفت‌ها بیش از", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/MEL02210-1-1-e1793380760295.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۲۱:۱۵"}, {"source": "Billboard", "title": "Dominic Fike Nets First No. 1 on Billboard’s Pop Airplay Chart With ‘Babydoll’", "link": "https://www.billboard.com/music/chart-beat/dominic-fike-babydoll-pop-airplay-number-one-1236371119/", "summary": "Dominic Fike claims his first No. 1 on Billboard ’s Pop Airplay chart as “Babydoll” rises a spot to the top of the Nov. 7-dated list. Originally released in 2018, the song, on Sandy Boys/Columbia/Legacy, became a top three hit on both the Billboard Global 200 and Billboard Global Excl. U.S. charts in April. Two weeks ago, it became Fike’s first top 10, reaching No. 10, on the all-genre, multimetric Billboard Hot 100 . Related Dominic Fike s How to Quit Smoking : All 15 Tracks Ranked Dominic Fike, Mariah Carey Queens of the Stone Age: New Music Friday Guide Dominic Fike Talks Rocket Mixtape, Fatherhood Babydoll Resurgence The Pop Airplay chart measures songs’ weekly plays, as tabulated by Mediabase and provided to Billboard by Luminate, on nearly 150 U.S. mainstream top 40 radio stations. “Baybdoll” hits No. 1 with a 1% gain in plays Oct. 23-29, led by support on stations including KIIS-FM Los Angeles, KMVQ San Francisco and KHKS Dallas. From its release through Oct. 29, “Babydoll” has totaled 800 million U.S. streams, 697 million in all-format radio airplay and 11,000 in sales in the United States. Notably, in an era of gains for catalog music , the song is the latest older hit to top Pop Airplay, joining such examples as Chappell Roan’s “Pink Pony Club,” which led in 2025 after originally being released in 2020, and Taylor Swift’s “Cruel Summer” and Miguel’s “Sure Thing,” both No. 1s in 2023 following their releases in 2019 and 2010, respectively. In Billboard Philippines ’ July digital issue cover story , Fike mused about the new attention on “Babydoll,” which was introduced on his 2018 EP Don’t Forget About Me, Demos . “I was making [a new] album in upstate New York, and it was just me and, like, five dudes … we were in a cabin in hoodies, drinking coffee,” he said of the song’s ascent after nearly a decade. “The initial shock of it was very chill … and then I got to live out the reality of it happening, which was cool.” Fike’s third studio album, How To Quit Smoking , arrived Friday (Oct. 30). All charts dated Nov. 7 will update Tuesday, Nov. 3, on Billboard.com.", "date_str": "2026-10-30T17:28:14+00:00", "hash": "4b8bb4903372f465", "title_fa": "دومینیک فیک نتس اولین شماره 1 جدول پخش پاپ بیلبورد با «Babydoll»", "summary_fa": "دومینیک فیک ادعا می کند که اولین شماره 1 خود را در جدول پاپ ایرپلی بیلبورد به عنوان \"Babydoll\" یک نقطه به بالای لیست تاریخ 7 نوامبر صعود می کند. این آهنگ که در ابتدا در سال 2018 منتشر شد، در Sandy Boys/Columbia/Legacy به سه موفقیت برتر در Billboard Global 200 و Billboard Global Excl تبدیل شد. نمودارهای ایالات متحده در ماه آوریل. دو هفته پیش، اولین 10 برتر فیک شد و به رتبه 10 در همه ژانرها و چند متری Billboard Hot 100 رسید. Dominic Fike مرتبط با نحوه ترک سیگار: همه 15 آهنگ رتبه بندی شده Dominic Fike، Mariah Carey Queens of the Stone Age: New Music Friday Guide Dominic Fike Talks Rocket Mixtape، Fatherhood Babydoll Resurgence نمودار Pop Airplay پخش های هفتگی آهنگ ها را اندازه گیری می کند، همانطور که توسط Bi10 به صورت جدولی توسط Mediabase ارائه شده است. 40 ایستگاه رادیویی برتر ایالات متحده. «Baybdoll» با 1 درصد افزایش در نمایش‌های اکتبر به رتبه 1 رسید. 23-29، با پشتیبانی در ایستگاه‌هایی از جمله KIIS-FM لس آنجلس، KMVQ سانفرانسیسکو و KHKS دالاس. از زمان اکران تا 29 اکتبر، «Babydoll» در مجموع 800 میلیون پخش در ایالات متحده، 697 میلیون در پخش رادیویی تمام فرمت و 11000 فروش در ایالات متحده داشته است. قابل‌توجه، در دوره‌ای که موسیقی کاتالوگ دستاوردهای زیادی داشت، این آهنگ جدیدترین آهنگ قدیمی‌تر بر روی پاپ ایرپلی است که به نمونه‌هایی مانند Pink Pony Club از چاپل روآن می‌پیوندد، که در سال ۲۰۲۵ پس از انتشار اولیه در سال ۲۰۲۰، و تیلور سویفت «Cruel Summer» و «S Miguel20» و «S Miguel20» در هر دو گروه، پیشتاز شد. آنها به ترتیب در سال 2019 و 2010 منتشر شدند. در داستان روی جلد شماره دیجیتال بیلبورد فیلیپین در ماه جولای، فیک در مورد توجه جدید به «Babydoll» که در EP 2018 Don't Forget About", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2270482457-e1792425992443.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۲۰:۵۸"}, {"source": "Billboard", "title": "Aerosmith Storm Back to Stage With All-Star Hollywood Bowl Show Featuring Dave Grohl, Guns N’ Roses, Johnny Depp & More", "link": "https://www.billboard.com/music/rock/aerosmith-hollywood-bowl-show-grohl-guns-n-roses-depp-setlist-1236371013/", "summary": "Aerosmith stormed back from a three-year live performance hiatus in style on Thursday night (Oct. 29) with the first of two all-star California Dream On: Aerosmith and Friends shows at the Hollywood Bowl in Los Angeles. In addition to a 45-minute set from the Walk This Way band — their first full performance since singer Steven Tyler s 2023 vocal injury scuttled their planned Peace Out Farewell Tour — they were joined by Foo Fighters drummer Dave Grohl, Guns N Roses, the Black Crowes and guitarist Joe Perry s Hollywood Vampires bandmate actor Johnny Depp. For most of Aerosmith s six-song, show-ending set, Foo Fighters frontman Grohl sat in with Tyler, Perry, guitarist Brad Whitford and bassist Tom Hamilton in place of drummer and band co-founder Joey Kramer, who has been on hiatus from the group since first taking a break due to health issues in 2020. The group played some of their most beloved hits with Grohl, including Toys in the Attic, Back in the Saddle, Sweet Emotion and Dream On, with Depp dipping in on guitar on Train Kept a Rollin . Then, according to Variety , Tyler addressed the elephant in the room and said, Before we say good night, I just want to say what a ride it’s been with my brothers — Joe, Tom, Brad and Joey. Fifty-five f king years, and we’re the same f king band that started fifty-five and a half years ago.” Kramer then walked out and hugged Tyler and sat behind his drum kit, alongside Aerosmith s drum tech, John Douglas, who d filled in for Kramer in his absence, and the band brought it all back home with their 1976 Billboard Hot 100 No. 10 hit Walk This Way. The night also included a five-song set from Guns N Roses, who covered the early Aerosmith songs Nobody s Fault, Last Child and Season of Wither, in addition to their own indelible hits Welcome to the Jungle and Paradise City. The Black Crowes also dipped deep into the Boston-bred band s catalog, with covers of the Joe Perry Project s Let the Music Do the Talking, as well as Write Me a Letter, Combination, No More No More and the 1978 rarity Chip Away the Stone. Heart took on two classics, Aerosmith s take on Aretha Franklin s I Never Loved a Man (The Way I Loved You) (retitled Never Loved a Girl on 2004 s blues covers album Honkin on Bobo ) and Janie s Got a Gun and country star Eric Church also picked a pair of favorites, Rag Doll and the Hot 100 No. 1 power ballad I Don t Want to Miss A Thing. Elsewhere, Sammy Hagar hit Draw the Line and the Beatles-by-way-of-Aerosmith cover ", "date_str": "2026-10-30T17:19:39+00:00", "hash": "f74c2948a2f78e12", "title_fa": "بازگشت به صحنه Aerosmith ://www.billboard.com/pro/behind-turnstile-massive-washington-monument-benefit-show/", "summary": "On Saturday, Oct. 24, Baltimore hardcore band Turnstile pulled off one of the most impressive feats for any act of any genre in recent memory: a free show at the Washington Monument in the nation’s capital for over 60,000 fans that doubled as a fundraiser that brought in more than $260,000 in humanitarian relief funding for those affected by conflict in Palestine, Sudan and Lebanon. It was a massive undertaking, and a massively successful one, for a band that has grown into one of the more critically-acclaimed acts on the music scene right now. In 18 months, the band scored its first top 10 on the Billboard 200 , with 2025’s Never Enough ; won two Grammys, for best metal performance and best rock album; and became the first hardcore band in 45 years to play Saturday Night Live , a slew of milestones that were once hard to imagine. And the show last weekend, within earshot of the power center of the country, constitutes the biggest hardcore headlining show ever, much less one that was also for a good cause. And all that momentum helps earn the band’s manager, Gold Theory Artists founder James Vitalo , the title of Billboard ’s Executive of the Week. Related Turnstile Bring Hardcore Fury (and 60,000 Fans) to Washington Monument: Exclusive Photos Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Here, Vitallo — who also manages Knocked Loose, Boy Harsher, Deafheaven and Show Me The Body — talks about how that show came together, the huge success for the band over the past year-plus, and why the show was such a landmark for the group. “It came together through years of planning with an amazing team, including the rest of our management crew and booking agency,” Vitalo says. “Our road crew helped bring it all to life on the ground and create the kind of environment we wanted for everyone. We worked through every obstacle together, knowing that if we could pull it off, we could bring people together and turn that sense of community into something that could do real good.” Related How Much Did Turnstile Rosalía s SNL Appearances Help Their Streaming Numbers? This past weekend, Turnstile played a free show at the Washington Monument that drew 60,000 people and raised over $260,000 in humanitarian relief for families in Palestine, Sudan and Lebanon — the biggest hardcore headlining show ever. What key decision did you make to help make that happen? The biggest d", "date_str": "2026-10-30T17:01:29+00:00", "hash": "69faf8baa5a47379", "title_fa": "چگونه Turnstile نمایش مزایای عظیم خود در بنای یادبود واشنگتن را به نمایش گذاشت: \"این یک دهکده طول کشید\"", "summary_fa": "روز شنبه، 24 اکتبر، گروه هاردکور بالتیمور Turnstile یکی از تاثیرگذارترین شاهکارها را برای هر نوع ژانری در خاطرات اخیر انجام داد: یک نمایش رایگان در بنای یادبود واشنگتن در پایتخت کشور برای بیش از 60000 طرفدار که به عنوان یک گردآوری کمک مالی دو برابر شد و بیش از 260000 دلار از کمک های مالی مجدد برای افراد متضرر از درگیری های بشردوستانه به ارمغان آورد. لبنان. برای گروهی که در حال حاضر به یکی از تحسین‌شده‌ترین بازیگران در صحنه موسیقی تبدیل شده است، این یک کار بزرگ و موفقیت‌آمیز بود. در 18 ماه، گروه با آلبوم Never Enough در سال 2025، اولین 10 رتبه برتر خود را در بیلبورد 200 به دست آورد. برنده دو جایزه گرمی برای بهترین اجرای متال و بهترین آلبوم راک. و به اولین گروه هاردکور در 45 سال تبدیل شد که شنبه شب زنده را اجرا کرد، مجموعه ای از نقاط عطف که زمانی تصورش سخت بود. و نمایش آخر هفته گذشته، در نزدیکی مرکز قدرت کشور، بزرگترین نمایش سرفصل های هاردکور تا کنون را تشکیل می دهد، بسیار کمتر که برای یک هدف خوب نیز بوده است. و تمام این شتاب به مدیر گروه، جیمز ویتالو، بنیانگذار Gold Theory Artists، کمک می کند تا عنوان مدیر هفته بیلبورد را به خود اختصاص دهد. Turnstile مرتبط Bring Hardcore Fury (و 60000 هوادار) را به بنای یادبود واشنگتن بیاورید: عکس های اختصاصی کنی مک فرسون، ناشر کهنه کار موسیقی isely keeping one eye on the bottom line. Consider their heavy, monolithic turn on Deceiver (2019); 2024’s hypnotic and deeply socio-political shoegaze of Frog In Boiling Water ; and now, a pivot of a different sort: candy-colored art, memorable hooks, bright melodies and wry (and occasionally hopeful) takes on the world abound on the new ZIRP! That comic-book styled acronym of a title stands for Zero Interest Rate Policies, the post-recession cheap money that led to a handful of obscenely rich tech entrepreneurs but left many others poorer, only widening the Western wealth gap. ZIRP! ’s cover art depicts a pink, red and white distorted American flag, the stripes as arrows pointing decidedly downward. DIIV have lost none of the anti-capitalist fervor that fueled Frog , but while that album marinated in soupy polemic, ZIRP! is immediate, kinetic and singalong sweet. When guitarist Colin Caulfield holds a mock Rolling Stone with the headline “DIIV Goes Pop!” in the video for the irresistible “Trillions,” they’re only half kidding. An August announcement of the new LP trumpeted DIIV as avatars of “The New Alternative” – wait for it – “a new genre for music’s optimized VC-funded super deluxe remixed AI-enhanced algorithmically perfected wild west 2020s, where a million streams is great, a billion even better and a trillion well within reach.” So while Smith, Caulfield, Andrew Bailey and Ben Newman are leaning into pop sounds, this is still a wickedly smart, reflexively ironic band who delivers the medicine with a spoonful of sugar. On “Trillions,” Smith, with Auto-Tuned breeze, rattles off a wish list of material dreams that any fan of rich-get-richer capitalism might desire: gold floors, a boat, “some kind of big ol fucking plane,” adding crucially the zero-sum rot of and I win and you lose.” “The Crash,” a power pop rave-up, gleefully calls for billionaires to be thrown in an alligator pit. There’s hope, too, for a societal reset in “Dare Me” and in a redemptive closer, “Idiot In the Sky.” If there is anything underpinning ZIRP! , it’s the notion of rebirth and a reb", "date_str": "2026-10-30T16:16:33+00:00", "hash": "8bc6ae2c8787d967", "title_fa": "DIIV درباره انقلاب، «روح بازسازی» و «بزدلی» هنرمندانی که از صحبت کردن خودداری می کنند صحبت می کند.", "summary_fa": "گذراندن زندگی به عنوان یک گروه راک مستقل به مدت 15 سال، در این قرن، در این اقتصاد، کار کوچکی نیست. اما DIIV که سهم خود را از آشفتگی درونی دیده و بر امواج تغییرات صنعت سوار شده است، نه تنها زنده مانده است. گروهی که توسط زکری کول اسمیت تأسیس و رهبری می‌شود، مسلماً در جالب‌ترین دوران خود تا به امروز است - بی‌قرار خلاق است و مایل است خود (و ما) را به چالش بکشد، در حالی که عاقلانه یک چشم را روی خط پایانی نگه می‌دارد. چرخش سنگین و یکپارچه آنها را روی Deceiver (2019) در نظر بگیرید. نگاه کفش خواب‌آور و عمیقاً اجتماعی-سیاسی 2024 قورباغه در آب جوش؛ و اکنون، محوری از نوع متفاوت: هنری با رنگ آب نبات، قلاب‌های به یاد ماندنی، ملودی‌های روشن و مضحک (و گاهی امیدوارکننده) در جهان به وفور در ZIRP جدید! این نام مخفف یک عنوان به سبک کتاب های مصور مخفف سیاست های نرخ بهره صفر است، پول ارزان پس از رکود که منجر به تعداد انگشت شماری از کارآفرینان فناورانه ثروتمند شد اما بسیاری دیگر را فقیرتر کرد و تنها شکاف ثروت غرب را افزایش داد. ZIRP! روی جلد یک پرچم آمریکا را به رنگ صورتی، قرمز و سفید به تصویر می‌کشد که نوارهای آن به صورت فلش‌هایی مشخص به سمت پایین هستند. DIIV هیچ یک از شور ضد سرمایه داری را که به Frog دامن می زد، از دست نداده اند، اما در حالی که آن آلبوم در یک بحث و جدل آشفته، ZIRP! فوری، جنبشی و شیرین است. وقتی گیتاریست کالین کالفیلد یک رولینگ استون ساختگی با عنوان «DIIV Goes Pop!» در دست می گیرد. در ویدیوی مقاومت ناپذیر \"Trillions\"، آنها فقط نیمی از آنها را شوخی می کنند. اعلامیه اوت LP جدید، DIIV را به عنوان آواتارهای «جایگزین جدید» در بوق و کرنا کرد –", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/diiv-2026-press-orienteer-cr-louie-kovatch-1800-billboard.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۸ آبان • ۱۹:۴۶"},
