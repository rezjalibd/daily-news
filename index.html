al consideration of this deal. Our editorial experts vetted the deal based on our independent expertise. Because we determin", "date_str": "2026-09-17T12:30:00+00:00", "hash": "8bc0757307b88f0b", "title_fa": "این طرح دو ساله پروتون VPN با پهنای باند نامحدود در حال حاضر 70٪ تخفیف دارد", "summary_fa": "قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. آخرین تبلیغ Proton VPN برنامه دو ساله VPN Plus خود را با قیمت 2.99 دلار در ماه (از 9.99 دلار کاهش می دهد) ارائه می دهد، 70٪ تخفیف که در دوره مقدماتی 168 دلار صرفه جویی می کند. در حالی که رقم ماهانه برای مقایسه مفید است، این یک اشتراک ماه به ماه نیست: پروتون هنگام ثبت نام 71.76 دلار کامل دریافت می‌کند، اگرچه 30 روز ضمانت بازگشت پول دریافت می‌کنید، و به شما زمان می‌دهد تا عملکرد آن را با دستگاه‌ها، اتصال اینترنت و خدمات پخش خود بررسی کنید. پس از 24 ماه اولیه، این طرح با 83.88 دلار در سال یا 6.99 دلار در ماه تمدید می شود. برای استفاده روزمره، می‌توانید برنامه را باز کنید و به Proton اجازه دهید سروری را انتخاب کند، یا زمانی که به مکان خاصی نیاز دارید، از بیش از 140 کشور انتخاب کنید. این می تواند به شما در دسترسی به خدمات از خانه در حین سفر کمک کند، اگرچه پلتفرم های پخش همچنان ممکن است اتصالات VPN را مسدود کنند. این اشتراک همچنین 10 دستگاه را به طور همزمان پوشش می دهد (بنابراین فضایی برای تلفن، لپ تاپ و تلویزیون شما بدون جابجایی بین آنها وجود دارد)، با برنامه هایی برای Windows، macOS، Linux، iOS، Android و دستگاه های تلویزیون پشتیبانی شده، از جمله Fire TV. از هر دستگاهی که استفاده می‌کنید، هیچ محدودیتی برای ردیابی پهنای باند وجود ندارد، اگرچه سرعت به اتصال شما و اینکه کدام یک از سرورهای 20000+ پروتون را انتخاب می‌کنید، می‌تواند کمک کند، اما بهبود تبلیغ شده تا 400 درصد برای اتصالات VPN اعمال می‌شود، و نباید به عنوان قولی برای افزایش سرعت باند وسیع شما خوانده شود. فراتر از تغییر مکان ظاهری شما، حفظ حریم خصوصی دلیل قوی تری"}, {"source": "Lifehacker", "title": "10 Hacks Every Audible User Should Know", "link": "https://lifehacker.com/tech/10-hacks-every-audible-user-should-know?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Audible is one of the largest and most popular audiobook services out there, and with good reason, as it gives you access to a huge library at a competitive price. Unlike Libby which is also an excellent audiobook platform you don't have to sit on a wait list for popular titles, and purchases are (mostly) yours to keep. These are the tricks you need to know to get the most out of Audible and save some money along the way. Add narration to Kindle to get audiobooks for free or at a low cost If you like to have the option to either read or listen to your books, you can take advantage of Kindle and Audible crossovers to get the audio version of certain titles for free, or at least less than what you'd pay if you bought them outright on Audible. One option is to add audio upgrades to your purchased Kindle books: you can see which books are eligible and how much the narration add-ons cost using the Matchmaker tool . If you have a Kindle Unlimited subscription, you can also get lots of Prime Reading books with Audible Narration at no additional cost. Finally, when adding a Kindle book to your cart, look for the Add audiobook checkbox to see how much the companion Audible version costs in some cases, it may be cheaper to purchase the bundle than to use an Audible credit or buy them separately. Amazon Kindle Paperwhite Signature Edition $249.99 at Amazon Shop Now Shop Now $249.99 at Amazon Pause your membership instead of canceling to avoid losing credits For users on Audible's monthly subscription plans, credits are use it or lose it if you cancel, your unused credits expire even though you've already paid for them. If you fall behind on your listening or forgot that you've been paying for Audible and want to catch up, you can temporarily pause your membership instead of canceling. This way, you retain your credits without being charged the ongoing fee. You can pause your membership for up to 90 days every 12 months. In the app, go to Profile Membership Manage Pause Membership . Use retention offers to get a free credit or discounted subscription If you threaten to cancel your Audible subscription, Amazon may try to keep you by giving you a discount on your membership or applying a free credit to your account. This one isn't a guarantee, but users report that the cancellation flow frequently includes retention offers. There's no harm in trying, and you don't have to confirm the cancellation if there's no incentive.", "date_str": "2026-09-16T23:00:00+00:00", "hash": "4d4e4b06b662333d", "title_fa": "10 هک که هر کاربر شنیداری باید بداند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. Audible یکی از بزرگ‌ترین و محبوب‌ترین خدمات کتاب‌های صوتی موجود است، و دلیل خوبی هم دارد، زیرا به شما امکان دسترسی به کتابخانه‌ای بزرگ را با قیمت رقابتی می‌دهد. برخلاف Libby که یک پلتفرم کتاب صوتی عالی است، لازم نیست برای عناوین محبوب در لیست انتظار بنشینید و خریدها (بیشتر) با شماست. اینها ترفندهایی هستند که باید بدانید تا از Audible بیشترین بهره را ببرید و در این راه مقداری پول پس انداز کنید. برای دریافت رایگان یا با هزینه کم کتاب‌های صوتی را به Kindle اضافه کنید. اگر دوست دارید کتاب‌های خود را بخوانید یا گوش کنید، می‌توانید از کراس اوورهای Kindle و Audible استفاده کنید تا نسخه صوتی عناوین خاص را به صورت رایگان یا حداقل کمتر از مبلغی که اگر آن‌ها را مستقیماً از Audible خریداری می‌کنید، دریافت کنید. یکی از گزینه‌ها اضافه کردن ارتقاهای صوتی به کتاب‌های Kindle خریداری‌شده‌تان است: می‌توانید با استفاده از ابزار Matchmaker ببینید کدام کتاب‌ها واجد شرایط هستند و هزینه‌های افزودنی روایت چقدر است. اگر اشتراک Kindle Unlimited دارید، می‌توانید تعداد زیادی از کتاب‌های Prime Reading را با روایت شنیداری بدون هزینه اضافی دریافت کنید. در نهایت، هنگام افزودن کتاب Kindle به سبد خرید خود، به دنبال چک باکس افزودن کتاب صوتی باشید تا ببینید در برخی موارد نسخه Audible همراه چقدر هزینه دارد، ممکن است خرید بسته نرم افزاری ارزان تر از استفاده از اعتبار Audible یا خرید جداگانه آنها باشد. Amazon Kindle Paperwhite Signature Edition 249.99 دلار در آمازون اکنون خرید کنید اکنون 249.99 دلار در آمازون خرید کنید به جای لغو عضویت برای جلوگیری از از دست دادن اعتبار، عضویت خود را موقتاً متوقف کنید. اگر از شنیدن خود عقب افتادید یا فراموش کردید که برای Audible پول پرداخت کرده‌اید و می‌خواهید به عقب برگردید، می‌توانید به‌جای لغو"}, {"source": "Lifehacker", "title": "These Are the Best Smart Speakers to Buy in 2026", "link": "https://lifehacker.com/tech/these-are-the-best-smart-speakers?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Smart speakers are a crucial element of any smart home setup. They serve multiple roles: a speaker to play your music, movies, or podcasts; a smart assistant, to answer your questions (or, most likely, set your timers); and a smart home hub that all of your smart home products connect back to. In all likelihood, your best choice for a smart speaker is going to be based on the smart home platform you gravitate toward, as well as the devices you already own, but the decision can sometimes be a bit more complex than that. Best smart speaker for most people: Amazon Echo Dot Max Amazon Echo Dot Max $119.99 at Amazon Shop Now Shop Now $119.99 at Amazon The best smart speaker for most people is the speaker that most people can use. By that, I mean the device should be broadly accessible and not platform-specific. You should be able to buy the speaker and integrate it directly into your home, regardless of your existing devices or subscriptions. To that point, Amazon's Echo line is the most flexible choice. And among Amazon's many Echo devices, the Echo Dot Max is the best bang for your buck. The Echo Dot Max isn't Amazon's most expensive speaker, nor is it the cheapest. Instead, it's a bit of a middle-ground option that offers the features most people are looking for in a smart speaker without costing too much. As PCMag notes in its review , the Echo Dot Max can \"fill a modestly sized room with sound\" and is \"nicely balanced,\" which should be great for casual listening. It might not have the directional audio of Amazon's more powerful speakers, however, so if you're looking for stereo sound or something that delivers more \"oomph,\" you may want to upgrade. The Echo Dot Max should match most tech needs. Because this is an Amazon product, it has Alexa built in including Amazon's Alexa+ AI assistant. It supports Wi-Fi 6E, Bluetooth 5.3, and LE Audio. It also supports several smart platforms, including Matter, Thread, and Zigbee, and comes with smart sensors, such as temperature, ultrasonic, wifi radar, and ambient light. That's part of why this is my top pick: No matter what devices or services you already use, you'll be able to use the Echo Dot Max without issue. You could have a Windows PC, an iPhone, Spotfiy, and a variety of smart home devices, and they should all be able to work with the Echo Dot Max. Best smart speaker for Google users: Google Home Google - Premium Audio Speaker - 360-Degree Sound (Hazel) $99.99", "date_str": "2026-09-16T21:30:00+00:00", "hash": "3b2b98e8baad4345", "title_fa": "اینها بهترین اسپیکرهای هوشمند برای خرید در سال 2026 هستند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. بلندگوهای هوشمند یک عنصر حیاتی در هر راه اندازی خانه هوشمند هستند. آنها چندین نقش را ایفا می کنند: یک بلندگو برای پخش موسیقی، فیلم یا پادکست شما. یک دستیار هوشمند برای پاسخ به سوالات شما (یا به احتمال زیاد تایمرهای خود را تنظیم کنید). و یک مرکز خانه هوشمند که همه محصولات خانه هوشمند شما به آن متصل می شوند. به احتمال زیاد، بهترین انتخاب شما برای بلندگوی هوشمند بر اساس پلتفرم خانه هوشمندی است که به سمت آن جذب می‌شوید، و همچنین دستگاه‌هایی که از قبل دارید، اما تصمیم گاهی اوقات می‌تواند کمی پیچیده‌تر از این باشد. بهترین اسپیکر هوشمند برای اکثر مردم: Amazon Echo Dot Max Amazon Echo Dot Max 119.99 دلار در آمازون اکنون خرید کنید اکنون 119.99 دلار در آمازون خرید کنید بهترین بلندگوی هوشمند برای اکثر مردم، بلندگوی است که اکثر مردم می توانند از آن استفاده کنند. منظور من این است که دستگاه باید به طور گسترده در دسترس باشد و نه برای پلتفرم خاص. شما باید بتوانید بدون در نظر گرفتن دستگاه‌ها یا اشتراک‌های موجود، بلندگو را بخرید و مستقیماً در خانه خود ادغام کنید. تا این مرحله، خط اکو آمازون انعطاف‌پذیرترین انتخاب است. و در میان بسیاری از دستگاه‌های اکو آمازون، Echo Dot Max بهترین گزینه برای شماست. Echo Dot Max نه گران ترین اسپیکر آمازون است و نه ارزان ترین. در عوض، این گزینه کمی میان‌رده است که ویژگی‌هایی را که اکثر مردم به دنبال آن هستند در یک اسپیکر هوشمند ارائه می‌کند، بدون اینکه هزینه زیادی داشته باشد. همانطور که PCMag در بررسی خود اشاره می‌کند، Echo Dot Max می‌تواند \"یک اتاق با اندازه متوسط ​​را با صدا پر کند\" و \"به خوبی متعادل است\" که باید برای گوش دادن معمولی عالی باشد. با این حال، ممکن است"}, {"source": "Lifehacker", "title": "This Three-in-One Foldable Anker Charger Is 34% Off Right Now", "link": "https://lifehacker.com/tech/anker-magsafe-3-in-1-charger-deal-september-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. If you re looking for a foldable Apple charger that fits in the palm of your hand, the Anker Prime Foldable MagSafe Charger , now $99.73 (originally $149.99) is a great pick. It's at its lowest price ever according to price-tracking tools . Compatible with iPhone 12 series and above, AirPods, and the Apple Watch, this three-in-one MagSafe charger lets you securely charge all these devices at once. The foldable design makes it travel-ready, measuring 3.74 x 2.38 x 1.22 inches at its most compact size, so it not only easily fits in a carry-on, but even in your pocket. It weighs around 8 ounces, or about the same as the iPhone 17 Pro Max. Three-in-One Foldable Anker Charger Three-in-One Foldable Anker Charger deal $99.73 at Amazon $149.99 Save $50.26 Get Deal Get Deal $99.73 at Amazon $149.99 Save $50.26 With Qi2.2 technology, this charger delivers 25W of wireless charging, making it five times faster than standard 5W chargers, meaning it can take an iPhone 17 Pro to 50% power in roughly 26 minutes. It also features a cooling system to make sure your phone never gets above 98.6 F while it s charging, helping to prolong the health of the battery. This wireless charging station comes with a 45W USB-C adapter, a five-foot USB-C cable, and anti-slip stickers. It can easily be set up on any nightstand or table for immediate use. Note: Though it can wirelessly charge other devices as well, because it's an Apple-centric charger, it s not compatible with Samsung watches. For under $100, it's a great option for anyone who's all-in on Apple devices. Our Best Editor-Vetted Early Prime Day Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $199.00 (List Price $249.00) Apple iPad 11\" A16 128GB Wi-Fi Tablet (Silver, 2025) $399.99 (List Price $449.00) Sony WH-1000XM5 $298.00 (List Price $399.99) Amazon Fire HD 10 10.1\" Tablet (4GB RAM, 32GB, Black) $76.99 (List Price $154.99) Fire TV Stick 4K Plus Streaming Player With Remote (2025 Model) $39.99 (List Price $49.99) Deals are selected by our commerce team", "date_str": "2026-09-16T20:30:00+00:00", "hash": "17ea7f2b6623f14c", "title_fa": "این شارژر Anker تاشو سه در یک در حال حاضر 34٪ تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اگر به دنبال یک شارژر تاشو اپل هستید که در کف دست شما قرار بگیرد، شارژر MagSafe تاشو Anker Prime، اکنون 99.73 دلار (در اصل 149.99 دلار) انتخاب عالی است. با توجه به ابزارهای ردیابی قیمت، این کمترین قیمت را دارد. این شارژر سه در یک MagSafe که با سری آیفون 12 و بالاتر، ایرپادها و اپل واچ سازگار است، به شما امکان می دهد همه این دستگاه ها را به طور همزمان شارژ کنید. طراحی تاشو آن را برای سفر آماده می‌کند و ابعاد آن 3.74 x 2.38 x 1.22 اینچ در جمع‌وجورترین اندازه آن است، بنابراین نه تنها به راحتی در یک دستمال، بلکه حتی در جیب شما نیز جای می‌گیرد. وزن آن حدود 8 اونس یا تقریباً برابر با آیفون 17 پرو مکس است. شارژر Anker تاشو سه در یک معامله شارژر Anker تاشو 99.73 دلار در آمازون 149.99 دلار صرفه جویی 50.26 دلار دریافت معامله دریافت معامله 99.73 دلار در آمازون 149.99 دلار صرفه جویی 50.26 دلار با فناوری Qi2.2، این شارژر با شارژر بی سیم 5 برابر و 5 برابر شارژ بی سیم استاندارد، شارژر بی سیم 5 برابر وات را شارژ می کند. می تواند یک آیفون 17 پرو را در 26 دقیقه به 50 درصد قدرت برساند. همچنین دارای یک سیستم خنک کننده است تا مطمئن شود تلفن شما در هنگام شارژ شدن هرگز بالاتر از 98.6 درجه فارنهایت نمی رسد و به حفظ سلامت باتری کمک می کند. این ایستگاه شارژ بی‌سیم دارای یک آداپتور USB-C 45 واتی، یک کابل USB-C پنج فوتی و برچسب‌های ضد لغزش است. به راحتی می توان آن را بر روی هر میز یا میز برای استفاده فوری نصب کرد. توجه: اگرچه"}, {"source": "Lifehacker", "title": "How to Eat 'Healthy' in a World Full of Processed Food", "link": "https://lifehacker.com/how-to-eat-healthy-in-a-world-full-of-processed-food?utm_medium=RSS", "summary": "Our world is full of processed food, for better or worse. It would be easy for me to sit at my keyboard and tell you to avoid it and eat foods in forms closest to how they are in nature: apples, not apple pie. But just because something is processed (whatever that means) doesn t automatically make it bad for you. It s time to lose the guilt and own up to eating processed food sometimes and maybe we ll see it s not that bad. Don t obsess over how processed each food is Here s the hard part: defining processed food. Doritos, processed. Not a tough call there. Raw potato with the dirt still on it: unprocessed. So far so good. But if we wash that potato, boil it, maybe peel it too...mix it with butter, and garlic (and then more butter, and more garlic) uh-oh. That s kind of processed, isn t it? But it s not very processed, you might say. There s a spectrum, and if you dig a potato out of the ground and boil it in your own kitchen, that s still on the okay side. The problem comes when you try to draw a line to say these things are processed, and these things aren t. Where would you put a cow that s been chopped up into steaks? Vegetables that are frozen? Beans that are canned? Bread baked by a local baker? Bread baked by a factory? It's a hard job, and no definition is going to make everyone happy. Probably the most popular is the NOVA framework for determining what's processed and what's \"ultra processed.\" I wrote more about NOVA here , and why I think it's flawed. As a tool for studying food systems, it can be useful. But it doesn't tell us which foods are healthiest. Sure, it takes a lot more work and machinery to process sugar than to harvest honeycomb and extract the honey , but that s kind of beside the point of which is healthier for you. There is no major nutritional difference between the two. Taken to an extreme, the processed-is-bad mentality would put plenty of things off-limits that shouldn t be. Frozen veggies are as healthy as fresh, sometimes more so . Pasteurized milk is processed, and better for it . There s no solid nutritional reason to shun jarred pasta sauce, or egg whites in a carton, or rotisserie chicken. But wait, you say. Those are healthy processed foods. What about Twinkies? Doritos? McDonald s? Hungry Man? Decide what you care about in your food, and let the rest go If some of the names in that list scared you, you probably have a reason why: sugar, or chemicals (we re getting to that), or high-calorie portions, or high levels of f", "date_str": "2026-09-16T20:00:00+00:00", "hash": "a1d7b3aba75dc94c", "title_fa": "چگونه در دنیایی پر از غذاهای فرآوری شده \"سالم\" بخوریم؟", "summary_fa": "دنیای ما پر از غذاهای فرآوری شده، چه خوب و چه بد است. برای من آسان است که پشت صفحه کلیدم بنشینم و به شما بگویم که از آن دوری کنید و غذاهایی را به شکلی که در طبیعت هستند بخورید: سیب، نه پای سیب. اما فقط به این دلیل که چیزی پردازش می‌شود (به هر معنی که باشد) به طور خودکار آن را برای شما بد نمی‌کند. وقت آن است که احساس گناه را از دست بدهیم و گاهی اوقات خود را به خوردن غذاهای فرآوری شده قبول کنیم و شاید ببینیم که آنقدرها هم بد نیست. در مورد نحوه فرآوری هر غذا وسواس نداشته باشید در اینجا قسمت سخت است: تعریف غذای فرآوری شده. دوریتوس، پردازش شده. تماس سختی وجود ندارد. سیب زمینی خام با خاک هنوز روی آن: فرآوری نشده. تا اینجای کار خیلی خوبه. اما اگر آن سیب زمینی را شستیم، بجوشانیم، شاید هم پوستش را بکنیم... با کره و سیر (و بعد کره بیشتر و سیر بیشتر) مخلوطش کنیم اوه-اوه. این به نوعی پردازش شده است، اینطور نیست؟ اما ممکن است بگویید خیلی پردازش نشده است. طیفی وجود دارد، و اگر سیب زمینی را از زمین بیرون بیاورید و آن را در آشپزخانه خود بجوشانید، باز هم مشکلی ندارد. مشکل زمانی پیش می‌آید که سعی می‌کنید خطی بکشید تا بگویید این چیزها پردازش شده‌اند، و این چیزها نیست. گاوی را که به صورت استیک خرد شده است را کجا قرار می دهید؟ سبزیجات یخ زده؟ لوبیا که کنسرو شده؟ نان پخته شده توسط نانوای محلی؟ نان پخته شده توسط کارخانه؟ کار سختی است و هیچ تعریفی قرار نیست همه را خوشحال کند. احتمالاً محبوب ترین چارچوب NOVA برای تعیین اینکه چه چیزی پردازش می شود و چه چیزی \"فوق پردازش\" است. من در اینجا بیشتر در مورد NOVA نوشتم و چرا فکر می کنم ناقص"}, {"source": "Lifehacker", "title": "If You Loved 'The Shards,' There's One Movie You Need to Watch Next", "link": "https://lifehacker.com/entertainment/best-movie-for-fans-of-the-shards?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The Shards is a classic Bret Easton Ellis story, populated by sexy, empty monsters and punctuated by horrifying imagery. The man who gave us Less Than Zero and American Psycho knows how to deliver the icy, perverse thrills that only a show set in 1980s Los Angeles (and told from his distinct point-of-view) can give us. Whether it was the hot, dangerous characters, the neon-lit visuals, or the tense mystery and mounting sense of paranoia that you loved best, if you re looking for more of it , there s one movie that s perfect for Shards fans: 2008 s The Informers . The Informers is the perfect movie for fans of The Shards The Informers is also adapted from the fiction of Bret Easton Ellis, it s also set in Los Angeles in the 1980s, and it s got the same kind of sweat-slick, monied vibe as The Shards . Structured as separate narratives about characters who don t always meet or realize how they re connected, The Informers is centered on Graham (Jon Foster), a drifting, bisexual rich kid who deals drugs and hates his film producer father. When Graham s friend Bruce is killed outside a party, Graham carries a trauma he can t quite connect with, crossing paths in ways both direct and indirect with a zonked-out rock star (Mel Raido), a kid trying desperately to survive a soul-killing vacation with his father (Lou Taylor Pucci), and his girlfriend (Amber Heard) and boyfriend (Austin Nichols). Unlike The Shards , there s no central mystery or throughline like the Trawler. But the same sense of existential dread pervades the film in fact, it s easy to imagine that the Trawler is working in the background of the film s stories, but these self-absorbed people don t realize it because it doesn t directly affect them. And the ending of the film is a gut punch a horrifying moment of revelation that tells you that no matter how rich these folks are, or how attractive, or how privileged, they re also all doomed. So, yes, The Informers is bleaker than The Shards , following people who use drugs and bad behavior to avoid the emptiness that threatens to swallow them, but just as in the series, there s something incredibly entertaining about watching these pretty, wealthy people make terrible decisions and do terrible things to each other and themselves. Add in a terrific cast that includes Billy Bob Thornton, Winona Ryder, Kim Basinger, and Mickey Rourke, and you have the ideal movie for fans of the show. Rent The Informers on ", "date_str": "2026-09-16T17:00:00+00:00", "hash": "a3e5d095c1c876f1", "title_fa": "اگر عاشق \"The Shards\" بودید، یک فیلم وجود دارد که باید در ادامه ببینید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. The Shards یک داستان کلاسیک برت ایستون الیس است که پر از هیولاهای سکسی و خالی است و با تصاویر وحشتناک نقطه گذاری شده است. مردی که Less Than Zero و American Psycho را به ما هدیه کرد، می‌داند چگونه هیجان‌های یخی و منحرفی را که فقط نمایشی که در دهه 1980 در لس آنجلس اتفاق می‌افتد (و از دیدگاه متفاوت او روایت می‌شود) می‌تواند به ما ارائه دهد. چه شخصیت‌های داغ و خطرناک، تصاویری با نور نئون، یا رمز و راز پرتنش و حس فزاینده پارانویا که بیشتر از همه دوستش داشتید، اگر بیشتر به دنبال آن هستید، یک فیلم برای طرفداران شاردز عالی است: Informers 2008. Informers فیلمی عالی برای طرفداران The Shards است. Informers همچنین از داستان برت ایستون الیس اقتباس شده است، همچنین در لس آنجلس در دهه 1980 می گذرد، و همان حال و هوای لطیف و ملایم The Shards را دارد. اینفورمرز که به‌عنوان روایت‌های جداگانه درباره شخصیت‌هایی که همیشه ملاقات می‌کنند یا متوجه نمی‌شوند که چگونه با هم ارتباط دارند، ساختار یافته است، بر گراهام (جان فاستر) متمرکز است، یک بچه پولدار دوجنس‌گرا که مواد مخدر می‌فروشد و از پدر تهیه‌کننده فیلمش متنفر است. وقتی دوست گراهام، بروس در خارج از یک مهمانی کشته می‌شود، گراهام ضربه‌ای را تحمل می‌کند که نمی‌تواند کاملاً با آن ارتباط برقرار کند، و از راه‌های مستقیم و غیرمستقیم با یک ستاره راک دور افتاده (مل رایدو)، بچه‌ای که ناامیدانه تلاش می‌کند تا از تعطیلات روح‌کشی با پدرش (لو تیلور پوچی) و دوست دخترش (دوست پسرش، هِی‌چو) جان سالم به در ببرد، می‌رود. برخلاف The Shards، هیچ رمز و راز یا خطی مانند Trawler وجود ندارد. اما همان حس ترس وجودی در فیلم در حقیقت وجود دارد، به راحتی می توان تصور کرد که Trawler در پس"}],
      media: [{"source": "Billboard", "title": "Julia Stiles Pays Glittery Tribute to Dolly Parton With ‘9 to 5’ Quickstep on ‘Dancing With the Stars’: Watch", "link": "https://www.billboard.com/culture/tv-film/julia-stiles-tribute-dolly-parton-9-to-5-quickstep-dwts-watch-1236342551/", "summary": "Julia Stiles paid tribute to late country giant Dolly Parton in a most fitting way on her Wednesday night (Sept. 16) debut on Dancing with the Stars . The Save the Last Dance and Hustlers star hit the dance floor with partner professional dancer and season 34 finalist Ezra Sosa for a high-energy quickstep to Parton s 1980 Billboard Hot 100 No. 1 crossover smash 9 to 5. In a nod to the beloved big screen workplace comedy s feminist dynamic, Stiles began the routine by first hugging Sosa and then dissing him with a too-slow fake-out by pulling her hand back when he went in for a handshake, busting out laughing as he gave the camera a dyspeptic frown. From there, it was all smiles, as the pair — both dressed in sparkling white tuxedos with silver accents — spun, high-kicked and briskly moved across the floor as they kept their upper bodies elegantly straight while their hips and feet did all the talking. The dance was part of this week s season 35 two-night premiere, with Stiles telling the judges that Parton had signed off on the usage of one of her most beloved songs before Parton s death at 80 on August 25 following a brief battle with cancer. “It was only a couple weeks before Dolly passed that she approved this song specifically for me,” Stiles said during the rehearsal package before the dance. “I’m so honored to be dancing to her music and honoring her legacy, and I want to make her proud.” Afterward, co-host Julianne Hough asked Stiles what performing to Parton s song meant to her, with the actress revealing that the thumbs-up from the country icon was super important for her and Sosa. It was the first song we talked about,” Stiles revealed of the song she chose on the night when the theme was No. 1 songs in the year they were born; 9 to 5 topped the Billboard singles chart on Feb. 21, 1981. “I wanted it so badly. We didn’t know what was gonna happen. She cleared it, and I just feel so honored to honor Dolly. She’s such a powerhouse. And the song is so great. Like, it’s such an anthem. And, yeah, what a legend. She was great.” The pair earned a solid score of 18 out of 30, putting her in third place for the night behind No. 1 Maura Higgins of The Traitors , The Rookie star and dancer Jenna Dewan and Olympic gold medal skater Amber Glenn. Watch Stiles Parton tribute below.", "date_str": "2026-09-17T16:43:08+00:00", "hash": "c1880e911816ca45", "title_fa": "جولیا استایلز با 9 تا 5 Quickstep در «Dancing With the Stars» به دالی پارتون ادای احترام می‌کند: تماشا کنید", "summary_fa": "جولیا استایلز در اولین نمایش خود در شب چهارشنبه (16 سپتامبر) در رقص با ستارگان، به غول فقید کانتری، دالی پارتون، ادای احترام کرد. ستاره Save the Last Dance و Hustlers به ​​همراه رقصنده حرفه‌ای شریک و فینالیست فصل 34 ازرا سوسا برای یک گام سریع پرانرژی به کراس اوور 100 شماره 1 بیلبورد پارتون در سال 1980 وارد زمین رقص شد. استایلز با اشاره به پویایی فمینیستی کمدی محبوب در محل کار در محل کار، روال روال را با اول در آغوش گرفتن سوسا و سپس با کشیدن دستش به سمت عقب وقتی که برای دست دادن به داخل خانه می رفت، شروع کرد و در حالی که اخم های سوء هاضمه ای به دوربین نشان می داد از خنده خارج شد. از آنجا، همه لبخندها بود، زیرا این جفت - هر دو با لباس‌های تاکسی سفید درخشان با لهجه‌های نقره‌ای - می‌چرخیدند، با لگد بالا می‌رفتند و به سرعت روی زمین حرکت می‌کردند، در حالی که بالاتنه‌هایشان را صاف نگه می‌داشتند در حالی که باسن و پاهایشان تمام حرف زدن را انجام می‌داد. این رقص بخشی از اولین نمایش دو شبه فصل 35 این هفته بود، با استایلز به داوران گفت که پارتون استفاده از یکی از محبوب‌ترین آهنگ‌هایش را قبل از مرگ پارتون در 80 سالگی در 25 آگوست پس از یک نبرد کوتاه با سرطان امضا کرده بود. استایلز در طول بسته تمرینی قبل از رقص گفت: \"تنها چند هفته قبل از گذشت دالی بود که او این آهنگ را به طور خاص برای من تایید کرد.\" من بسیار مفتخرم که با موسیقی او می رقصم و میراث او را ارج می نهم و می خواهم باعث افتخار او شوم. پس از آن، جولیان هاف، مجری برنامه، از استایلز پرسید که اجرای آهنگ پارتون برای او چه معنایی دارد، و این بازیگر فاش کرد که شست"}, {"source": "Billboard", "title": "Ask Billboard: Which Songs Have the Longest Spans of Charting on the Hot 100?", "link": "https://www.billboard.com/music/chart-beat/hot-100-longest-charting-spans-ask-billboard-1236342305/", "summary": "Submit questions about Billboard charts, as well as general music musings, to askbb@billboard.com . Please include your first and last name, as well as your city, state and country, if outside the United States. Or, reach out on Bluesky . Let’s open the latest mailbag. Related Dolly Parton s Half-Century Hot 100 Legacy: 9 to 5, Islands in the Stream More Fearless, Fabulous Dolly Parton and What We Can All Learn From Her: A Remembrance How TV, Social Media Music Streaming Revived Catalog Music | On the Record Hi Gary, Dolly Parton ’s recent passing has got to be the biggest loss in music this decade. More than a couple weeks later and I still can’t believe she’s gone. She seemed to be so kind, and I hope generations beyond will celebrate her legacy. Which I think they have, because her signature hit “Jolene” returned to the Billboard Hot 100 at No. 16, a new peak for the song. That got me thinking: Which songs have the longest gaps between debut date and peak date, the most time between debut and charting overall, and the longest spans of appearing on the chart? Thanks, Seira Alessanders Jakarta, Java Island, Indonesia Hi Seira, Even this week, heartfelt tributes continue to be shared, as Sally Field, one of Parton’s costars in 1989’s Steel Magnolias , said at the Primetime Emmys , “I adored her from day one. How could you not? She was genuine and humble, supportive and blisteringly funny, with a bawdy sense of humor that would send any rude guy looking for a place to hide. I couldn’t see then what a real giant Dolly was — not just as an artist, but as a human. She was a humanitarian whose contributions had made a profound difference in the lives of so many in her home state of Tennessee and across our country.” As “Jolene” returned, as one of five songs by the legend on the Hot 100 dated Sept. 5, let’s look at enduring hits with both the longest spans of charting on the ranking and the most time between placing on it, through the Sept. 19 tally. Longest Spans of Songs Appearing on the Hot 100: Span / Title, Artist, Peak Pos., Peak Year (Debut date-Most recent week) 45 years, 9 months, 2 weeks / “9 to 5,” Dolly Parton, No. 1 (2 weeks), 1981 (Nov. 29, 1980-Sept. 12, 2026) 46 years, 5 months, 2 weeks / “Margaritaville,” Jimmy Buffett, No. 8, 1977 (April 2, 1977-Sept. 16, 2023) 46 years, 6 months, 3 weeks / “Rock With You,” Michael Jackson, No. 1 (4 weeks), 1980 (Nov. 3, 1979-May 23, 2026) 46 years, 10 months, 3 weeks / “Don’t Stop ‘Til You Get Enough,” Michae", "date_str": "2026-09-17T16:14:04+00:00", "hash": "0ed7103e0166ceb2", "title_fa": "از بیلبورد بپرسید: کدام آهنگ‌ها طولانی‌ترین دوره نمودار را در 100 آهنگ داغ دارند؟", "summary_fa": "سؤالات مربوط به نمودارهای بیلبورد و همچنین موسیقی کلی را به آدرس askbb@billboard.com ارسال کنید. لطفاً نام و نام خانوادگی خود و همچنین شهر، ایالت و کشور خود را در صورتی که خارج از ایالات متحده هستید ذکر کنید. یا با Bluesky تماس بگیرید. بیایید آخرین کیسه پستی را باز کنیم. میراث 100 داغ نیم قرنی دالی پارتون: 9 تا 5، جزایر در جریان، نترس تر، شگفت انگیز دالی پارتون و آنچه همه ما می توانیم از او بیاموزیم: یادگاری که چگونه تلویزیون، پخش موسیقی رسانه های اجتماعی موسیقی زنده شد کاتالوگ موسیقی | در Record Hi Gary، مرگ اخیر دالی پارتون بزرگترین فقدان موسیقی در این دهه بوده است. بیش از چند هفته بعد و من هنوز نمی توانم باور کنم که او رفته است. به نظر می رسید که او بسیار مهربان است و امیدوارم نسل های دیگر میراث او را جشن بگیرند. که فکر می‌کنم آن‌ها داشته‌اند، زیرا آهنگ محبوب او \"Jolene\" به بیلبورد Hot 100 در شماره 16 بازگشت، اوج جدیدی برای آهنگ. این باعث شد به این فکر کنم: کدام آهنگ‌ها طولانی‌ترین فاصله بین تاریخ پخش و تاریخ اوج، بیشترین زمان بین اولین و در مجموع چارت، و طولانی‌ترین فاصله زمانی برای حضور در نمودار را دارند؟ با تشکر، سیرا الساندرز جاکارتا، جزیره جاوا، اندونزی سلام سیرا، حتی این هفته، ادای احترام صمیمانه همچنان به اشتراک گذاشته می شود، زیرا سالی فیلد، یکی از بازیگران پارتون در سال 1989 در Steel Magnolias، در مراسم پرایم تایم امی گفت: \"من از روز اول او را می ستودم. چطور نمی توانستید؟ حس شوخ طبعی که هر مرد بی ادبی را به دنبال مکانی برای مخفی شدن می برد. آن موقع نمی توانستم ببینم دالی چه غول واقعی است – نه فقط به عنوان یک هنرمند، بلکه به عنوان یک انسان. او یک انسان دوست بود که کمک‌هایش"}, {"source": "Billboard", "title": "Cardi B Squashes Rumor That She’s Romantically Involved With Offset Again: ‘Never in This Life’", "link": "https://www.billboard.com/music/rb-hip-hop/cardi-b-denies-rumor-back-with-offset-again-1236342485/", "summary": "Cardi B is shutting down rumors that have her romantically involved with Offset once again. Related A Timeline of Cardi B Offset s Relationship Cardi B Says AH HA Music Video Cost More Than $1M, Claims She Was Overcharged by NYPD for Permits: They Was Doing Too Much Cardi B Jokes to Her Kids They Need to Fight for Her When She s an Old B h : You Got Me? Per Complex , the Grammy-winning rapper hopped on X to squash the speculation fueled by a tabloid account on Wednesday (Sept. 16). “Never in your life never in THIS life… mf’ers could go through that man text, phone, whatever… NEVER would you catch me doing that, she wrote in a since-deleted post. I don’t flirt, I don’t give no inch of possibility. S t put a private investigator on me and I put that on my kids life in the name of Jesus!!! The rumors were sparked by an X user believed to be model Melanie Jayda, who has been linked to Offset in the past. The X user went on a spree resharing posts, calling out an unnamed baby mama for hooking up with the baby daddy again, even though they weren t dating. She later denied that the messages were aimed at anyone specifically. Billboard has reached out to Cardi and Offset s reps, as well as Melanie Jayda for comment. Cardi B filed for divorce for a second time from Offset in July 2024 after seven years together. The former couple shares three children Kulture, Blossom and Wave. Legal hurdles have kept the divorce from being finalized, and it remains tied up in court. I feel like last year, a new person was reborn, Cardi said on an episode of Aspire With Emma Grede in March. I don t know if it was the divorce. I don t know if something woke me up. I feel like I m definitely a new person. Cardi welcomed a fourth child, her first with NFL player Stefon Diggs, in November 2025. However, they appeared to split during the first quarter of this year. The 33-year-old spoke to fans on Spaces on Wednesday as well, during which she teased a massive tour for next year that will take her overseas to Europe, and how she s restructuring her team internally. Next year, I m gonna have a humongous tour, she said. I m going to Europe. This year s going to be really, really, really good for y all. As for Offset, he s launching a new solo era on Friday (Sept. 18), which will see the release of his new song, Something I Need.", "date_str": "2026-09-17T16:05:11+00:00", "hash": "0d9c99c7ec3e7fc1", "title_fa": "کاردی بی شایعه درگیر شدن دوباره او با افست را رد کرد: «در این زندگی هرگز»", "summary_fa": "کاردی بی در حال پایان دادن به شایعاتی است که او را با افست درگیر کرده است. جدول زمانی رابطه Cardi B Offset Cardi B می‌گوید هزینه موزیک ویدیو AH HA بیش از 1 میلیون دلار بوده است، ادعا می‌کند که پلیس نیویورک برای مجوزها بیش از حد هزینه دریافت کرده است: آنها بیش از حد با بچه‌هایش جوک‌های Cardi B می‌کردند، آنها باید برای او بجنگند وقتی او یک B h پیر است: شما می‌خواهید؟ Per Complex، خواننده رپ برنده گرمی روی X پرید تا حدس و گمان هایی را که توسط یک حساب تبلیغاتی در روز چهارشنبه (16 سپتامبر) ایجاد شده بود، از بین ببرد. او در پستی که از آن زمان حذف شده بود نوشت: \"هرگز در زندگی شما هرگز در این زندگی ... افراد نمی توانستند از طریق آن مرد پیامک، تلفن، هر چیز دیگری را بگذرانند ... هرگز نمی توانید مرا در حال انجام این کار گیر بیاورید. من معاشقه نمی کنم، هیچ این احتمال را نمی دهم. یک محقق خصوصی روی من قرار ندادم و من آن را روی زندگی بچه هایم قرار دادم که توسط کاربرانی که به نام عیسی به نام عیسی بودند! جایدا که در گذشته با افست مرتبط بوده است. کاربر X با اشتراک گذاری مجدد پست ها، از یک مادر بچه ناشناس خواست که دوباره با بابای کودک ارتباط برقرار کند، حتی اگر آنها قرار ملاقاتی نداشتند. او بعداً این موضوع را رد کرد که این پیام‌ها به‌طور خاص هدفشان بوده است. بیلبورد برای اظهار نظر با نمایندگان کاردی و افست و همچنین ملانی جایدا تماس گرفته است. کاردی بی پس از هفت سال زندگی مشترک در جولای 2024 برای دومین بار از افست درخواست طلاق داد. این زوج سابق سه فرزند به نام Kulture، Blossom و Wave دارند. موانع قانونی مانع از قطعی شدن طلاق شده است و"}, {"source": "Billboard", "title": "The 2016 MTV Video Music Awards Were Full of Iconic Artists, Videos & Moments — Has It Been Matched Since? Greatest Pop Stars Podcast", "link": "https://www.billboard.com/music/pop/2016-mtv-video-music-awards-greatest-pop-stars-podcast-1236342452/", "summary": "The MTV Video Music Awards of 2016 represented the culmination of an era of pop music and culture, with career-apex-type performances from Beyoncé and Rihanna and huge moments for Drake and Kanye West, among plenty of other on-stage appearances from some of the biggest names of the period. A decade later, it also seems to have been the end of an era for the VMAs, and maybe for music award shows in general, as we moved into a period where it became more and more difficult to get so many superstars in the same building at the same time. Related LISA, RAYE, Sienna Spiro More Added as Performers on 2026 MTV VMAs Madonna to Open 2026 VMAs — Her First Time Performing on the Show in 23 Years Snoop Dogg to Host 2026 MTV VMAs On this Great Moments in Pop Star History episode of the Greatest Pop Stars podcast , we look at one of the most memorable Video Music Awards in the show s history, with moments that continue to delight, fascinate and confuse 10 years on. Host Andrew Unterberger is joined by Billboard deputy editor, digital Katie Atkinson to recall our memories of the event, as well as the new takeaways we now have revisiting the ceremonies a decade later. Along the way, we answer all the most still-pressing questions about the 2016 MTV Video Music Awards — what was the context behind all these A-listers still showing up at the VMAs at once, and why did so many of them decline to show up again? Did it make sense to split the Rihanna Video Vanguard performance into four parts (and which was our favorite)? What impact did her decision to (arguably) curve Drake s kiss attempt when presenting her the award have on both of their mythologies? Was Beyoncé s Lemonade medley a new high point for award-show performances in general? How much is G-Eazy to blame for Britney Spears comeback performance not landing as hoped? Did Nick Jonas Bacon get a raw deal? And perhaps most importantly: Have the VMAs ever managed to match 2016 in the years since? Check it out above, along with a YouTube playlist of some of the most memorable 2016 VMAs moments discussed in our conversation, and subscribe to the Greatest Pop Stars podcast on Apple Music or Spotify (or wherever you get your podcasts ) for weekly discussions every Thursday about all things related to pop stardom! And as we say in every one of these GPS podcast posts — if you have the time and money to spare, please consider donating to any of these causes in the fight for trans rights: Transgender Law Center Trans Lifeline D", "date_str": "2026-09-17T16:02:55+00:00", "hash": "315235294c44cfcb", "title_fa": "جوایز موسیقی ویدیویی MTV 2016 مملو از هنرمندان، ویدیوها و لحظات نمادین بود — آیا از آن زمان تاکنون با هم مطابقت داشته است؟ پادکست بزرگترین ستاره های پاپ", "summary_fa": "جوایز موسیقی ویدئویی ام تی وی در سال 2016 نشان دهنده نقطه اوج یک دوره موسیقی پاپ و فرهنگ بود، با اجرای حرفه ای از بیانک و ریحانا و لحظات بزرگ برای دریک و کانیه وست، در میان بسیاری دیگر از حضورهای روی صحنه از برخی از بزرگ ترین نام های آن دوره. یک دهه بعد، به نظر می‌رسد که پایان دوران VMAها و شاید برای نمایش‌های جوایز موسیقی به طور کلی باشد، زیرا ما به دوره‌ای رفتیم که در آن حضور همزمان این همه سوپراستار در یک ساختمان سخت‌تر می‌شد. در این قسمت «لحظه‌های بزرگ در تاریخ ستاره‌های پاپ» از پادکست بزرگترین ستاره‌های پاپ، به یکی از خاطره‌انگیزترین جوایز موسیقی ویدیویی در تاریخ نمایش نگاه می‌کنیم، با لحظاتی که 10 سال بعد همچنان خوشحال، مجذوب و گیج‌کننده است. اندرو آنتربرگر میزبان، معاون سردبیر بیلبورد، کیتی اتکینسون دیجیتال، به خاطر یادآوری خاطرات ما از این رویداد، و همچنین غذای تازه‌ای که در حال حاضر برای بازدید مجدد از مراسم یک دهه بعد داریم، پیوسته است. در طول راه، ما به تمام سوالات مبرم در مورد جوایز موسیقی ویدئویی MTV 2016 پاسخ می‌دهیم که چه زمینه‌ای در پشت این همه A-listers وجود داشت که هنوز در VMA ها به یکباره نمایش داده می‌شوند، و چرا بسیاری از آنها از حضور مجدد خودداری کردند؟ آیا منطقی بود که اجرای Rihanna Video Vanguard را به چهار قسمت تقسیم کنیم (و کدام مورد مورد علاقه ما بود)؟ تصمیم او برای بوسیدن (مطمئناً) منحنی تلاش دریک هنگام اهدای جایزه چه تأثیری بر اسطوره‌های هر دوی آنها داشت؟ آیا ترکیب Beyonc s Lemonade نقطه اوج جدیدی برای اجرای نمایش های جوایز به طور کلی بود؟ G-Eazy چقدر مقصر است که عملکرد بازگشت بریتنی اسپیرز آنطور که انتظار می رفت به زمین نرسید؟ آیا نیک جوناس بیکن یک معامله خام دریافت کرد؟ و شاید مهمتر از همه:"}, {"source": "Billboard", "title": "Former UnitedMasters Legal Chief Sasha Safavi Launches New Law Firm Called Syndicate", "link": "https://www.billboard.com/pro/unitedmasters-sasha-safavi-launches-law-firm-syndicate/", "summary": "Sasha Safavi , who has spent the past five years as head of legal and music licensing at distribution and label services company UnitedMasters, has left to start his own law firm called Syndicate. As part of the move, Safavi launches with UnitedMasters as one of his first clients, alongside Audiomack, Rebellion Records and sports media company Overtime. Related Billboard s 2026 Indie Power Players Revealed Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction Safavi has spent much of the past decade in the distribution world, having worked at TuneCore prior to his stint at UnitedMasters working on direct licensing deals with DSPs and other commercial deals. At UnitedMasters, he also oversaw artist deals and brand partnerships with the likes of the NFL, NBA, TikTok and the 2022 World Cup, and worked on brand campaigns for AT T, Meta and McDonald s, among others. UM — founded by Steve Stoute — is connected with Stoute’s brand agency Translation; across the two companies, Safavi oversaw some $250 million in transactions over the past five years. “Our clients become family. We make memories together, and we are right there for the moments that change the trajectory of their lives,” Safavi said in a statement to Billboard . “We move with grace and integrity on their behalf, while pushing them towards greatness internally. In a rapidly evolving entertainment industry, we’re building a law firm for the next generation of global leaders. Safavi, who was named as one of Billboard ’s Indie Power Players earlier this year, is setting up Syndicate across three divisions — creators, athletics and corporations — with the idea of the company being more a business partner than law firm, including by building out an in-house AI tool it is calling Aaliyah and hiring data analysts and engineers to help its clients navigate the legal landscape.", "date_str": "2026-09-17T16:01:29+00:00", "hash": "72215bc759e6349c", "title_fa": "ساشا صفوی، رئیس سابق حقوقی یونایتد مستر، موسسه حقوقی جدیدی به نام سندیکا را راه اندازی کرد", "summary_fa": "ساشا صفوی که پنج سال گذشته را به عنوان رئیس بخش حقوقی و صدور مجوزهای موسیقی در شرکت توزیع و خدمات لیبل یونایتد مسترز گذرانده است، برای راه اندازی موسسه حقوقی خود به نام سندیکیت ترک کرده است. به عنوان بخشی از این حرکت، صفوی با UnitedMasters به ​​عنوان یکی از اولین مشتریان خود، در کنار Audiomack، Rebellion Records و شرکت رسانه ورزشی Overtime راه اندازی می کند. پخش‌کننده‌های قدرت مستقل بیلبورد مرتبط 2026 بیلبورد برای افزودن آلبوم‌های رسانه‌ای هوشمند به عنوان فرمت‌های فروش واجد شرایط نمودار، معرفی شد. DSP ها و سایر معاملات تجاری. در UnitedMasters، او همچنین بر معاملات هنرمندان و شراکت با برندهایی مانند NFL، NBA، TikTok و جام جهانی 2022 نظارت داشت و در کمپین‌های برند برای AT T، Meta و McDonalds و غیره کار کرد. UM - که توسط استیو استوت تأسیس شد - با آژانس برند Stoute's Translation در ارتباط است. صفوی در طول پنج سال گذشته در میان این دو شرکت، نزدیک به 250 میلیون دلار بر مبادلات نظارت داشته است. «مشتریان ما به خانواده تبدیل می شوند. صفوی در بیانیه‌ای به بیلبورد گفت: «ما با هم خاطرات می‌سازیم و برای لحظاتی هستیم که مسیر زندگی آنها را تغییر می‌دهد. ما از طرف آنها با لطف و صداقت حرکت می‌کنیم و در عین حال آنها را به سمت عظمت داخلی سوق می‌دهیم. در یک صنعت سرگرمی که به سرعت در حال تکامل است، ما در حال ایجاد یک شرکت حقوقی برای نسل بعدی رهبران جهانی هستیم. صفوی که در اوایل سال جاری به عنوان یکی از بازیکنان مستقل بیلبورد معرفی شد، در حال راه‌اندازی سندیکا در سه بخش - سازندگان، ورزش‌ها و شرکت‌ها - با این ایده که این شرکت بیشتر یک شریک تجاری باشد تا شرکت حقوقی، از جمله با ساخت یک ابزار هوش مصنوعی داخلی که Aaliyah را فرا می‌خواند و"}, {"source": "Billboard", "title": "LISA, RAYE, Sienna Spiro & More Added as Performers on 2026 MTV VMAs", "link": "https://www.billboard.com/music/awards/2026-vmas-additional-performers-announced-lisa-raye-1236342221/", "summary": "LISA , RAYE , Sienna Spiro , Shaboozey (with and without Gunna ) and GENER8ION and Yung Lean will join show opener Madonna for performances at the 2026 VMAs. These will be the first VMAs performances for most of these artists, but LISA performed “New Woman” and “Rockstar” on the 2024 telecast. Hosted by Snoop Dogg, the VMAs will air Sunday, Sept. 27 (7:30-9:30 PM, ET/4:30-6:30 PM, PT) on CBS, simulcast on MTV and streaming on Paramount+ (Premium) in the U.S. The show will also be available globally the next day on Paramount+ and MTV. Related Madonna to Open 2026 VMAs — Her First Time Performing on the Show in 23 Years Snoop Dogg to Host 2026 MTV VMAs Nirvana Is the 2026 MTV Video Vanguard Recipient LISA returns to the VMAs stage for the television debut of her new single “SaWaDiKa” from her forthcoming EP PRESS PLAY , out Oct. 23. With 10 career VMAs nods, including four this year, LISA is the most-nominated K-pop solo artist in show history. In 2022, she became the first K-pop soloist to win a VMA: best K-pop for “Lalisa.” She won again in that category in 2024 with “Rockstar” and in 2025 with “Born Again,” a collab with Doja Cat and RAYE . Speaking of RAYE, the British singer/songwriter and producer will make her VMAs performance debut. The two-time VMAs winner is nominated twice this year, including in the song of the year category for “Where Is My Husband!” That ebullient hit reached No. 11 on the Billboard Hot 100. Following her own North American tour and the release of her sophomore album This Music May Contain Hope (which reached No. 11 on the Billboard 200), RAYE is currently on a stadium tour with Bruno Mars . She is set to make her film debut in Yann Demange’s upcoming thriller Lineage. First-time nominee Sienna Spiro will make her VMAs performance debut and compete for best new artist. The acclaimed British singer/songwriter recently released her debut album Visitor, which reached No. 9 on the Billboard 200. Her single “Die on This Hill” reached No. 19 on the Hot 100 and is a top Grammy contender for record and song of the year nominations. Spiro’s music has amassed over 1 billion global streams to date. Country/hip-hop pioneer Shaboozey will make his VMAs performance debut with his single “Cowgirl,” which jumps to a new peak, No. 42, on this week’s Hot 100. He’ll also be joined by hip-hop heavyweight Gunna for the first broadcast performance of their collaboration, “High Noon.” Shaboozey has received five career VMAs nods, including two this y", "date_str": "2026-09-17T16:00:00+00:00", "hash": "de7f2ef24858b8f9", "title_fa": "LISA، RAYE، Sienna Spiro و بیشتر به عنوان نوازنده در MTV VMAهای 2026 اضافه شدند", "summary_fa": "LISA، RAYE، Sienna Spiro، Shaboozey (با و بدون Gunna) و GENER8ION و Yung Lean برای اجرا در VMAs 2026 به Madonna افتتاحیه نمایش خواهند پیوست. این اولین اجراهای VMA برای اکثر این هنرمندان خواهد بود، اما LISA \"زن جدید\" و \"راک استار\" را در پخش تلویزیونی 2024 اجرا کرد. به میزبانی Snoop Dogg، VMAs یکشنبه، 27 سپتامبر (7:30-9:30 بعد از ظهر، ET/4:30-6:30 بعد از ظهر، PT) از CBS، پخش همزمان در MTV و پخش جریانی در Paramount+ (Premium) در ایالات متحده پخش می شود. این نمایش همچنین روز بعد در Paramount+ و MTV در سطح جهانی در دسترس خواهد بود. مربوطه مدونا برای افتتاحیه VMAهای 2026 — اولین باری که بعد از 23 سال در این برنامه اجرا کرد، اسنوپ داگ میزبان MTV VMAهای 2026 شد. 23 اکتبر. LISA با 10 نوید VMA حرفه ای، از جمله چهار جایزه در سال جاری، نامزدترین هنرمند انفرادی کی پاپ در تاریخ نمایش است. در سال 2022، او اولین سولیست کی پاپ شد که برنده VMA شد: بهترین کی پاپ برای «لالیسا». او در سال 2024 با «راک استار» و در سال 2025 با «دوباره متولد شده»، همکاری با گربه دوجا و RAYE، بار دیگر در آن دسته برنده شد. صحبت از RAYE، خواننده/ترانه سرا و تهیه کننده بریتانیایی اولین اجرای خود را در VMA انجام خواهد داد. برنده دو جایزه VMA امسال دو بار نامزد شده است، از جمله در بخش آهنگ سال برای \"شوهر من کجاست!\" این موفقیت درخشان به شماره 11 در بیلبورد هات 100 رسید. پس از تور خود در آمریکای شمالی و انتشار آلبوم دومش This Music May Contain Hope (که به شماره 11 بیلبورد 200 رسید)، RAYE در حال حاضر در یک تور استادیوم با برونو مارس است. او قرار است اولین فیلم خود را در فیلم هیجان انگیز آینده یان دیمانژ Lineage انجام دهد. سینا اسپیرو"}, {"source": "Billboard", "title": "Colin Kaepernick Says His Mom Told Him to Date Taylor Swift, Thought They ‘Would Be Perfect Together’", "link": "https://www.billboard.com/music/music-news/colin-kaepernick-mom-date-taylor-swift-perfect-for-him-1236342474/", "summary": "Taylor Swift was always meant to be with an NFL star, in the eyes of Colin Kaepernick s mom. Though the pop star would ultimately married Travis Kelce of the Kansas City Chiefs in 2026, the former San Francisco 49ers quarterback wrote in his memoir published Tuesday (Sept. 15), The Perilous Fight , that his mother, Teresa, once suggested he date Swift. Kaepernick used the moment as an example of how his parents, who are white and adopted him when he was baby, didn t understand his true personality and identity as a person of color. Related Colin Kaepernick Finally Responds to Jay-Z s Yankee Stadium Freestyle: I View That as Speaking to a Guilty Conscience Taylor Swift s Music Videos Are Now All Available to Watch on Spotify, From Tim McGraw to Opalite Taylor Swift Cheers On Husband Travis Kelce at Chiefs Home Opener Against Broncos, With Tom Cruise by Her Side “It was disappointing to me that my mother didn’t seem capable of seeing who I really was,” Kaepernick wrote in the book. “Years later, when I was in the NFL, she told me that I should ask out Taylor Swift (long before Travis Kelce made his move) because we would be perfect together. The civil rights activist added, No slight to Taylor, but she was not my type. Kaepernick who is biracial and identifies as a Black man contrasted this anecdote with another memory of his mom being unsupportive of his high-school relationship with a Black classmate named Crystal. I asked Crystal to the homecoming dance, a formal affair involving fancy gowns, tuxedoes and corsages. When I got the official portrait from that night, featuring me and Crystal posed up in that classic, airbrushed frame, my mother hid it away in the back of a drawer, he wrote. “My mother convinced me to ask Lindsay, the daughter of one of her friends, to the next formal dance, the athlete continued. Lindsay was white. When I brought that picture home, my mother promptly plastered it on the wall for all to see. In her mind, Crystal was just a phase. Lindsay was the kind of girl I should want.” Both Swift and Kaepernick would get their happy endings. The latter is married to radio personality Nessa Diab, with whom he welcomed a child in 2022. Their nuptials weren t quite as high-profile as the 14-time Grammy winner s, which took place over Fourth of July weekend this year with a reported 1,000 guests in attendance at Madison Square Garden in New York City. Swift whose latest album, The Life of a Showgirl , spent 12 weeks atop the Billboard 200 la", "date_str": "2026-09-17T15:37:07+00:00", "hash": "d034410b6bbdcab9", "title_fa": "کالین کپرنیک می‌گوید که مادرش به او گفته با تیلور سویفت قرار بگذارد و فکر می‌کرد که با هم عالی خواهند بود.", "summary_fa": "از نظر مادر کالین کپرنیک، تیلور سوئیفت همیشه قرار بود با یک ستاره NFL باشد. اگرچه این ستاره پاپ در نهایت در سال 2026 با تراویس کلسه از چیفز کانزاس ازدواج کرد، بازیکن سابق تیم سانفرانسیسکو 49رز در خاطرات خود که روز سه شنبه (15 سپتامبر) منتشر شد، با عنوان The Perilous Fight نوشت که مادرش، ترزا، یک بار به او پیشنهاد داد که با سوئیفت قرار بگیرد. کپرنیک از این لحظه به عنوان مثالی استفاده کرد که نشان می‌دهد چگونه والدینش، که سفیدپوست هستند و او را در کودکی به فرزندخواندگی پذیرفته‌اند، شخصیت و هویت واقعی او را به‌عنوان یک رنگین‌پوست درک نکرده‌اند. کالین کپرنیک مرتبط در نهایت به ورزشگاه یانکی جی‌زی پاسخ می‌دهد: من این را به‌عنوان صحبت کردن با عذاب وجدان می‌دانم موزیک ویدیوهای تیلور سویفت اکنون برای تماشا در Spotify در دسترس هستند، از تیم مک‌گرو تا اوپالیت تیلور سویفت با تشویق شوهرش، تراویس کلس، اوپن‌کلس، توسط تام‌رووست اوپن‌کلس، در اسپاتیفای. کاپرنیک در این کتاب نوشت: «برای من ناامیدکننده بود که مادرم به نظر نمی‌رسید که من واقعاً کیستم را ببیند». \"سالها بعد، زمانی که من در NFL بودم، او به من گفت که باید از تیلور سویفت (مدتها قبل از حرکت تراویس کلس) درخواست کنم، زیرا ما با هم عالی خواهیم بود. این فعال حقوق مدنی اضافه کرد: \"برای تیلور کوچک نیست، اما او نوع من نیست. کپرنیک که دو نژاد است و به عنوان یک مرد سیاهپوست شناخته می شود، این حکایت غیرقابل حمایت از رابطه خود را با یکی دیگر از حکایت های غیرمنتظره رابطه اش در تضاد قرار داد. همکلاسی سیاه پوست به نام کریستال. از کریستال خواستم تا رقص بازگشت به خانه را برگزار کند. او نوشت: وقتی پرتره رسمی آن شب را گرفتم که من و کریستال را در آن قاب کلاسیک و ایربراش ژست گرفتم، مادرم آن را در"}, {"source": "Billboard", "title": "Molly Tuttle, Brandi Carlile, Tyler Childers Lead 25th Annual Americana Honors & Awards Winners", "link": "https://www.billboard.com/lists/americana-honors-awards-winners-list-2026/", "summary": "Molly Tuttle , Brandi Carlile and Tyler Childers were among the big winners at Wednesday night s (Sept. 16) 25th annual Americana Honors Awards ceremony, held at Nashville’s Ryman Auditorium. Tuttle, who released the pop-inflected album So Long Little Miss Sunshine earlier this year, picked up her first artist of the year win. “I am shocked, so honored to just see my name up there with musical heroes,” Tuttle said, while praising how Americana music and the AMA “brings us together, all these different styles of music.” The evening opened in a mighty fashion, as Chris Stapleton joined The Heartbreakers to launch the show with renditions of classics like American Girl, You Wreck Me and Breakdown. The Heartbreakers gave their first performance together since 2017, as they and the late Tom Petty were honored during ceremony with the lifetime achievement award. “It heals and makes you feel good and makes you wanna drive too fast and it makes you wanna play music–that’s what it did for me,” Stapleton said of the group’s music catalog while presenting the lifetime achievement association to Tom Petty and the Heartbreakers. Petty’s daughter Adria Petty accepted the accolade. “They created defiant, hopeful music,” Petty said of the music the group made, adding of Tom Petty, “He didn’t care that much for the music industry…but he cared about the music community with his whole heart.” The celebration also honored Robert Plant and the late Dolly Parton with the lifetime achievement award. Buddy Miller feted Plant, who then took the stage and thrilled the crowd with a mini-set including “Angel Dance” and a rendition of the Black American gospel song “Satan Your Kingdom Must Come Down.” This year’s Americana Honors Awards also came just weeks after the passing of one of the evening’s honorees, lifetime achievement award honoree Dolly Parton, who died on Aug. 25 at age 80. Emmylou Harris, who worked with Parton and Linda Ronstadt on 1987 s Trio and 1989 s Trio II , and had a top 5 country hit in 1977 with the Parton-written song To Daddy, took the stage to honor her musical colleague. Harris comments were followed by a video acceptance speech that Parton had filmed prior to her passing. I m so honored to receive the lifetime achievement award from the Americana Music Association, Parton said in the video. I mean, roots music, what is now called Americana Music, is what I grew up playing back in the Smoky Mountains. It s that same music that drew me back to East Tennessee", "date_str": "2026-09-17T15:29:31+00:00", "hash": "dffa9f070f763166", "title_fa": "مولی تاتل، برندی کارلیل، تایلر چایلدرز برندگان جوایز و افتخارات بیست و پنجمین سالانه Americana", "summary_fa": "مولی تاتل، برندی کارلیل و تایلر چایلدرز از جمله برندگان بزرگ مراسم چهارشنبه شب (16 سپتامبر) بیست و پنجمین مراسم سالانه جوایز افتخارات آمریکاییانا بودند که در سالن ریمن نشویل برگزار شد. تاتل که اوایل امسال آلبوم So Long Little Miss Sunshine را منتشر کرد، اولین هنرمند سال خود را برنده شد. تاتل گفت: \"من شوکه شده ام، بسیار مفتخرم که نام خود را در کنار قهرمانان موسیقی می بینم.\" این شب به شکلی قدرتمند آغاز شد، زیرا کریس استپلتون به The Heartbreakers پیوست تا نمایش را با اجرای آثار کلاسیکی مانند American Girl، You Wreck Me و Breakdown آغاز کند. Heartbreakers اولین اجرای مشترک خود را از سال 2017 انجام دادند، زیرا آنها و تام پتی فقید در طی مراسم با جایزه یک عمر دستاورد تجلیل شدند. استاپلتون در مورد کاتالوگ موسیقی گروه در حالی که انجمن دستاوردهای یک عمر را به تام پتی و Heartbreakers ارائه می دهد، گفت: \"این کار باعث بهبودی و ایجاد احساس خوب در شما می شود و باعث می شود که بخواهید خیلی سریع رانندگی کنید و باعث می شود که بخواهید موسیقی بنوازید - این کاری است که برای من انجام داد.\" آدریا پتی دختر پتی این جایزه را پذیرفت. پتی درباره موسیقی ساخته شده توسط گروه گفت: «آنها موسیقی سرپیچی و امیدوارکننده خلق کردند. در این جشن همچنین رابرت پلانت و دالی پارتون فقید با جایزه یک عمر دستاورد تجلیل شد. بادی میلر با پلانت به روی صحنه رفت و با یک مینی ست شامل «رقص فرشته» و اجرای آهنگ انجیل سیاه آمریکایی «Satan Your Kingdom Must Come Down» جمعیت را به وجد آورد. جوایز افتخارات آمریکاینا امسال نیز تنها چند هفته پس از درگذشت یکی از برگزیدگان این شب، دالی پارتون، برنده جایزه یک عمر دستاورد، که در 25 اوت در 80 سالگی درگذشت، برگزار شد."}, {"source": "Billboard", "title": "Grammy Museum to Expand Grammy Camp to 5th U.S. City", "link": "https://www.billboard.com/pro/grammy-museum-to-expand-grammy-camp-to-fifth-city/", "summary": "The Grammy Museum continues its expansion of Grammy Camp, a program for high school students eager to pursue careers in the music industry. Starting in summer 2027, Grammy Camp will be held in Seattle, in addition to its Los Angeles, Miami, Nashville and New York locations. Grammy Camp is a national music industry program for high school students interested in having a career in music. Students from across the country can apply for a variety of Grammy Camp programs. Grammy Camp is designed to provide students valuable insight from real-world music makers to give campers the best chance of achieving success in their chosen career. Related Will Grammy Museum’s Olivia Rodrigo Exhibit Boost Her Grammy Chances? The Cure Uraveled to Open With Cameron Crowe-Hosted Q A Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction In partnership with Inspire EDU, the Grammy Museum now offers undergraduate credit for successful completion of Grammy Camp Los Angeles, with additional accreditation information for the other locations to be announced later this year. Each student will be issued a transcript from Golden West College, a regionally accredited institution where the credit(s) will be earned through, to submit to the higher education institution they attend. The acceptance of the undergraduate college credits is at the discretion of that institution. “Accreditation adds an exciting new dimension to Grammy Camp,” Arin Canbolat , vp of education community engagement, Grammy Museum, said in a statement. “Students already come away with meaningful learning, performance experience, mentorship and industry connections, and now they can connect that work to their broader educational journey. Through our collaboration with Inspire EDU and our expansion to Seattle this year, we are continuing to build an experience that supports young people as artists, students and future music professionals, while reducing barriers and expanding opportunities in more communities.” Mike Packer , founder and president, Inspire EDU, added: “Grammy Camp has long provided students with an extraordinary opportunity to learn from working professionals and experience the music industry firsthand. By adding undergraduate college credit, we are recognizing the rigor and value of that experience while helping students take a meaningful step toward their educational and career goals.” The 2027 Grammy Camp seaso", "date_str": "2026-09-17T15:15:12+00:00", "hash": "c8ccc028c870bed6", "title_fa": "موزه گرمی برای گسترش کمپ گرمی به پنجمین شهر ایالات متحده", "summary_fa": "موزه گرمی به گسترش کمپ گرمی ادامه می‌دهد، برنامه‌ای برای دانش‌آموزان دبیرستانی که مشتاق دنبال کردن مشاغل در صنعت موسیقی هستند. از تابستان 2027، کمپ گرمی علاوه بر مکان های لس آنجلس، میامی، نشویل و نیویورک در سیاتل برگزار می شود. Grammy Camp یک برنامه ملی صنعت موسیقی برای دانش آموزان دبیرستانی است که علاقه مند به داشتن حرفه ای در موسیقی هستند. دانشجویان از سراسر کشور می توانند برای انواع برنامه های کمپ گرمی درخواست دهند. کمپ گرمی به گونه ای طراحی شده است که بینش ارزشمندی را از سازندگان موسیقی دنیای واقعی به دانش آموزان ارائه دهد تا به اردونشینان بهترین شانس برای دستیابی به موفقیت در حرفه انتخابی خود را بدهد. مطالب مرتبط آیا نمایشگاه اولیویا رودریگو در موزه گرمی شانس دریافت گرمی او را افزایش می دهد؟ The Cure Uraveled برای افتتاح با میزبانی Cameron Crowe Q یک بیلبورد برای افزودن آلبوم‌های رسانه هوشمند به عنوان فرمت‌های فروش واجد شرایط نمودار Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل Tupac Shakur انجام می‌دهد در همکاری با Inspire EDU، موزه گرمی اکنون اعتبار دوره کارشناسی را برای تکمیل موفقیت‌آمیز Camps Angelscre ارائه می‌دهد. اواخر سال جاری اعلام خواهد شد. برای هر دانشجو از کالج گلدن وست، یک موسسه معتبر منطقه‌ای که اعتبار(ها) از طریق آن کسب می‌شود، رونوشت صادر می‌شود تا به موسسه آموزش عالی که در آن شرکت می‌کنند ارسال کند. پذیرش اعتبارات دانشگاه در مقطع کارشناسی به تشخیص آن موسسه می باشد. آرین کانبولات، معاون تعامل جامعه آموزشی، موزه گرمی، در بیانیه ای گفت: «اعتبار بخشی جدید و هیجان انگیز به کمپ گرمی می بخشد. \"دانش آموزان در حال حاضر با یادگیری معنادار، تجربه عملکرد، مربیگری و ارتباطات صنعتی دست یافته اند و اکنون می توانند این کار را به سفر آموزشی گسترده تر خود متصل کنند."}, {"source": "Billboard", "title": "Billboard’s Music Industry Events Calendar", "link": "https://www.billboard.com/pro/music-industry-events-calendar-festivals-awards-conferences/", "summary": "As part of our continuing efforts to serve the music industry and its creators, Billboard Pro now features a music industry events calendar for readers. The calendar will act as music s most complete summary major national and international industry events, from conferences to festivals to networking mixers and more. Just as Billboard is music s must-read source for news, charts and analysis, now it also is the go-to for business happenings. Related Dates Announced for SXSW London Debut Billboard to Add Smar 27 سپتامبر جوایز موسیقی ویدئوی MTV (لس آنجلس) 28 سپتامبر جوایز BMI لندن"}, {"source": "Deadline", "title": "The Montclair Film Festival To Honor Rachel Maddow, Tony Gilroy, Jack O’Connell, Ava DuVernay & More", "link": "https://deadline.com/2026/09/rachel-maddow-jack-oconnell-ava-duvernay-montclair-film-festival-1237106560/", "summary": "EXCLUSIVE: The Montclair Film Festival will be honoring filmmaker Tony Gilroy, star Jack O Connell, filmmaker Ava DuVernay Rachel Maddow, among many others at this years 14th edition in Montclair, NJ. The festival runs from Oct. 16-25. Maddow and director Ben Klein will be bestowed with the David Carr Award for Truth in Non-Fiction filmmaking for [ ]", "date_str": "2026-09-17T16:54:31+00:00", "hash": "063dbcdcabf06954", "title_fa": "جشنواره فیلم مونتکلیر به افتخار ریچل مدو، تونی گیلروی، جک اوکانل، آوا دوورنی و غیره", "summary_fa": "اختصاصی: جشنواره فیلم مونتکلیر از تونی گیلروی فیلمساز، ستاره جک او کانل، فیلمساز آوا دوورنی ریچل مدو و بسیاری دیگر در چهاردهمین دوره امسال در مونتکلیر، نیوجرسی، تقدیر خواهد کرد. این جشنواره از 16 تا 25 اکتبر برگزار می شود. به مدو و کارگردان بن کلاین جایزه دیوید کار برای حقیقت در فیلمسازی غیرداستانی برای [ ] اعطا خواهد شد. در شب پایانی آن، یکشنبه، 25 اکتبر. استفان کولبرت پس از نمایش QA با گیلروی مدیریت خواهد کرد که در آن گیلروی جایزه فیلمساز 2026 را دریافت خواهد کرد. در ددلاین تماشا کنید دوشنبه، 19 اکتبر، مدرسه عالی آکادمی مونتکلیر کیمبرلی، جشنواره با جایزه بازیگر سال 2026 خود از O Connell تقدیر خواهد کرد. او در جدیدترین فیلم نتفلیکس دنی بویل، جوهر در نقش لری لمب، ویراستاری که با کمک روپرت مرداک، The Sun را در بریتانیا راه اندازی کرد، بازی می کند. آوا دوورنی نامزد اسکار برای فیلم چهاردهمین جایزه مستندساز تجلیل خواهد شد. او در 23 اکتبر این جایزه را در مدرسه عالی MKA اعطا خواهد کرد. او همچنین پس از نمایش فیلم 14 با کولبر گفتگو خواهد کرد. روز یکشنبه، 18 اکتبر در The Bellevue Theatre، این جشنواره پس از نمایش فیلم جدیدش ژوزفین، از بث دی آرا جو کارگردان با کارگردانی موفق 2026 تقدیر می کند. همچنین در روز یکشنبه، اکتبر 18 در مدرسه عالی آکادمی مونتکلیر کیمبرلی، این جشنواره از استفان برسفورد فیلمنامه نویس با جایزه فیلمنامه نویس سال 2026 ما برای ویژگی های فوکوس السینور تقدیر می کند. اندرو اسکات و اولیویا کولمن داستان هنرپیشه ایان چارلسون را دنبال می کند که در حالی که آماده می شد اجرای زندگی خود را در هملت در تئاتر ملی لندن انجام دهد، با مشکلات باورنکردنی روبرو شد."}, {"source": "Deadline", "title": "‘Doctor Who’ Regen Is Go! BBC Calls On Producers To Pitch “Brave” New Vision For Sci-Fi Series", "link": "https://deadline.com/2026/09/doctor-who-tender-bbc-calls-1237106539/", "summary": "The BBC has fired the starting gun on the regeneration of Doctor Who. The British broadcaster has today launched a competitive tender for Season 16, in which producers will pitch in a bake-off-style process to refresh the iconic sci-fi series. The tender process follows the BBC announcing a major creative rethink of Doctor Who in [ ]", "date_str": "2026-09-17T16:35:21+00:00", "hash": "9e750c6534d3c56c", "title_fa": "\"Doctor Who\" Regen Is Go! بی‌بی‌سی از تهیه‌کنندگان می‌خواهد که چشم‌انداز جدید «شجاع» را برای سریال‌های علمی تخیلی ارائه کنند", "summary_fa": "بی‌بی‌سی اسلحه شروع را روی بازسازی Doctor Who شلیک کرده است. پخش‌کننده بریتانیایی امروز یک مناقصه رقابتی برای فصل 16 راه‌اندازی کرده است که در آن تهیه‌کنندگان روندی کاملاً بی‌سابقه را برای تجدید سریال علمی تخیلی نمادین ارائه می‌کنند. روند مناقصه پس از اعلام بی‌بی‌سی انجام شد که بازنگری خلاقانه‌ای در مورد Doctor Who در [ ] در سندی برای دعوت از ارسال‌ها، بی‌بی‌سی گفت که تهیه‌کنندگان باید چشم‌اندازی برای Doctor Who که می‌تواند در سال 2028/29 به پرده‌ها بازگردد (که توسط Deadline پیش‌بینی شده است) را شرح دهند و اطمینان حاصل کند که سریال مرتبط، شگفت‌انگیز، جذاب، شجاع و الهام‌بخش برای مخاطبان طولانی‌مدت باقی می‌ماند. تماشا در آخرین مهلت اخبار مرتبط اخبار استودیو بی بی سی لس آنجلس رئیس بدون فیلمنامه رایان او داود را برای نظارت بر فیلمنامه به عنوان مارک لینزی انجی استفنسون اخبار خروج بیل نیگی بازی تایتان ادبی اجتماعی چالش برانگیز در ریچارد کرتیس اولین کمد صوتی کمدی کم ما منعطف هستیم. بی بی سی گفت: قسمت هایی که سریال را تشکیل می دهند. ما لزوماً به دنبال این نیستیم که با یک مدل نمایشگر سخت‌گیر کار کنیم و یک بار در مرحله تولید انتظار داریم که سریال از نویسندگان اپیزودیک نیز استفاده کند. در ادامه این سند آمده است: از نظر بصری، سریال باید احساسی سینمایی، متمایز و جاه طلبانه داشته باشد و بتواند برای جلب توجه مخاطبان در بازار جهانی به شدت رقابتی رقابت کند. ما رویکردهای نوآورانه برای تولید، ساختن جهان، جلوه های بصری و داستان سرایی را تشویق می کنیم که مقیاس و تأثیر احساسی جهان دکتر هو را به حداکثر می رساند. تهیه‌کنندگان باید حداقل یک شخصیت همراه برای سریال بسازند و داستان‌ها باید مخاطبان را به زمان‌ها و مکان‌های خارق‌العاده‌ای، از محیط‌های تاریخی گرفته تا آینده‌های دور، جهان‌های بیگانه و زمین معاصر منتقل کنند."}, {"source": "Deadline", "title": "Pitt Street Productions Developing Feature Adaptation of Jessica Joyce Romance Novel ‘The Ex Vows’", "link": "https://deadline.com/2026/09/the-ex-vows-movie-set-jessica-joyce-book-pitt-street-1237106490/", "summary": "EXCLUSIVE: Pitt Street Productions has locked down feature film rights to Jessica Joyce s 2024 romance novel The Ex Vows with plans to package an adaptation imminently. An instant USA Today bestseller, The Ex Vows follows two estranged exes who are forced to team up to rescue their best friend s chaotic wedding. As they spend nine [ ]", "date_str": "2026-09-17T16:30:00+00:00", "hash": "8addfb2093840f4d", "title_fa": "پیت استریت پروداکشن در حال توسعه اقتباسی از رمان عاشقانه جسیکا جویس «قول سابق»", "summary_fa": "انحصاری: Pitt Street Productions حقوق فیلم داستانی رمان عاشقانه The Ex Vows جسیکا جویس در سال 2024 را با برنامه ای برای بسته بندی اقتباسی قریب الوقوع مسدود کرده است. The Ex Vows که یکی از پرفروش‌ترین کتاب‌های USA Today است، دو مرد سابق را دنبال می‌کند که مجبور می‌شوند برای نجات عروسی آشفته بهترین دوستشان با هم متحد شوند. همانطور که آنها نه [ ] را خرج کردند، کتاب ناشر برکلی، اثری از خانه تصادفی پنگوئن، یکی از کتاب‌های بوک تاک بود. پیت استریت پروداکشنز پس از تولی imb Machu [ ] به پایان می‌رسد. چند روز پس از نمایش جهانی خود در جشنواره فیلم نیویورک، هات اسپرینگز چهاردهمین فیلم مستند موردانتظار نامزد اسکار آوا دوورنی را نمایش خواهد داد. HSDFF میزبان اولین نمایش در ایالات متحده از Pretenders، مستند جاس کراولی درباره کریسی هایند و گروهش و فیلم دیگری با مضمون موسیقی به نام Darlene Love: I Know Where I ve Been به کارگردانی بری آوریچ خواهد بود. لاو، خواننده آر بی و سول که توسط همسالانش به عنوان یکی از بزرگترین خواننده های تمام دوران شناخته می شود، به عنوان صندلی افتخاری جشنواره خدمت خواهد کرد. داستان‌های مرتبط پادکست گفتگوی مستند پادکست در جشنواره مستند Hot Springs و گفتگو با مدیر اجرایی کن جاکوبسون و سفری جانبی به هلدینگ مستند Natchez Liat، از E Ask E. Jean, The Librarians جوایز برتر جشنواره فیلم مستند معتبر هات اسپرینگز را می گیرند و شانس اسکار را افزایش می دهند برای اولین بار، HSDFF یک میزگرد مستند از مدعیان اصلی جوایز اسکار را تشکیل می دهد. در این پنل که با شرکت Deadline ارائه شده است، دکتر آمریکایی (کارگردان پو سی تنگ)، بسته شدن (کارگردان میکا مارکزاک)، روزی روزگاری در هارلم (تهیه کننده لیانی گریوز)، و کوه نگه داشتن (کارگردان بیلیانا توتوروف) حضور خواهند داشت. (من افتخار مدیریت آن بحث را خواهم داشت). هر یک از فیلم های برنده جایزه در جشنواره نمایش داده می شوند. در ددلاین تماشا کنید"}, {"source": "Deadline", "title": "What To Expect For ‘Heated Rivalry’ Season 2: Everything We Know So Far", "link": "https://deadline.com/feature/heated-rivalry-season-2-news-updates-everything-we-know-1236867258/", "summary": "There is still a long wait to be had for the highly anticipated second season of Heated Rivalry. When Season 1 of the Crave book adaptation of Rachel Reid’s Game Changers series skated quietly onto HBO Max on Nov. 28, 2025, it quickly built momentum and became a phenomenon. Season 2 is in the works [ ]", "date_str": "2026-09-17T16:25:58+00:00", "hash": "3e388e12dbe9236d", "title_fa": "برای فصل 2 \"رقابت داغ\" چه انتظاری داریم: هر آنچه که تاکنون می دانیم", "summary_fa": "هنوز برای فصل دوم مورد انتظار Heated Rivalry باید منتظر ki, die droomt van een toekomst vol vliegmachines en andere wonderen. Dit kostuumdrama ging op 16 september in première en staat nu al in de top 10 met meest bekeken series op Netflix. Op plek 8 om precies te zijn, dus er is nog ruimte voor verbetering! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Kostuumdrama op Netflix heeft top 10-notering te pakken appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-17T12:20:05+00:00", "hash": "3a3db910e4306e61", "title_fa": "درام صحنه و لباس در نتفلیکس به رتبه 10 برتر دست یافته است", "summary_fa": "این یک دستورالعمل برای موفقیت است: یک درام صحنه و لباس را در نتفلیکس منتشر کنید و بینندگان بقیه کار را انجام خواهند داد. تقریباً یک درام صحنه و لباس وجود ندارد که در سرویس استریم به خوبی عمل نکند! از این نظر، جای تعجب نیست که لالکا اکنون گل می زند. لالکا در 10 نفر برتر نتفلیکس قرار دارد لالکا یک درام صحنه و لباس در نتفلیکس است که بر اساس فیلم کلاسیکی به همین نام توسط نویسنده بولسلاو پروس ساخته شده است. داستان لهستانی است و در ورشو قرن نوزدهم می گذرد و حول محور استانیسلاو ووکولسکی، تاجر جاه طلبی می چرخد ​​که می خواهد به هر قیمتی از نردبان اجتماعی بالا برود. هنگامی که او عاشق ایزابلا Łęcka اشرافی می شود، در دنیایی گرفتار می شود که در آن عشق و موقعیت به طور ناگسستنی به هم مرتبط هستند. در حالی که ووکولسکی تمام تلاشش را می کند تا قلب ایزابلا را به دست آورد، او سعی می کند از انتظارات ظالمانه اشراف رهایی یابد. رابطه آنها دائماً توسط تفاوت عظیم در ریشه ها و جاه طلبی های شخصی که آنها را بیشتر و بیشتر از هم دور می کند مورد آزمایش قرار می گیرد. برخلاف کتاب لالکا، بازخوانی یک به یک کتاب نیست، زیرا کمی پیچیده‌تر است. رمان پروس روی سه مرد از سه نسل مختلف تمرکز دارد. قهرمان غم‌انگیز پروس که گرفتار عیب‌های مهلکی است، استانیسلاو ووکولسکی، تاجر موفقی است که مشتاق به رسمیت شناخته شدن توسط اشراف منحط لهستانی است و ناامیدانه عاشق ایزابلای زیبای یخی و بلندپایه می‌شود. داستان ووکولسکی با داستان کارمند قدیمی عاشقانه و عاشقانه ایگناسی رزکی، که مشتاقانه آرزوی انقلاب های 1 eert voor het eerst een vrouwelijk Monster en duikt diep in vrouwelijke woede en onderdrukking, thema s die naar mijn gevoel opvallend actueel zijn. Ik kan niet wachten om dit met de wereld te delen. Monster: The Lizzie Borden Story staat as we speak op Netflix. Je kunt de serie vanavond nog opzetten! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Schokkende serie met bijlmoordenaar staat nú op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-17T09:30:10+00:00", "hash": "1610271d9c97d46e", "title_fa": "سریال تکان دهنده با قاتل تبر اکنون در نتفلیکس است", "summary_fa": "جفری دامر، اد جین، برادران منندز، آیا می دانید هنوز کجا می خواهیم برویم؟ ما البته در مورد سریال Monster صحبت می کنیم! و از امروز یک قسمت جدید به نام Monster: The Lizzie Borden Story دارد. Monster: The Lizzie Borden Story Monster: The Lizzie Borden Story فصل چهارم سریال موفق رایان مورفی در مجموعه گلچین جنایی واقعی Monster است. این مجموعه هشت قسمتی داستان لیزی بوردن، زن متهم به قتل بدنام با تبر پدر و نامادری اش در ایالت ماساچوست آمریکا در سال 1892 را روایت می کند. اگرچه لیزی در نهایت تبرئه شد، اما این پرونده همچنان یکی از معروف ترین معمای قتل حل نشده در تاریخ آمریکا است. الا بیتی در نقش لیزی بوردن بازی می کند، در حالی که چارلی هانام (اد جین) نقش پدرش اندرو بوردن را بازی می کند. ربکا هال، ویکی کریپس و بیلی لورد، از جمله، در فصل چهارم Monster نیز دیده می شوند. داستان واقعی، یکی از خالقان سریال Monster، ایان برنان، قبلاً در رسانه های آمریکایی درباره داستان واقعی اظهار داشت: آنها به معنای واقعی کلمه فکر می کردند یک زن برای بلند کردن تبر ضعیف تر از آن است. در آن زمان، زن بودن تقریباً شبیه به یک گونه کاملاً متفاوت بود. بیتی بازیگر نقش اول زن صحبت کرد: برای تماشاگران برای تجربه کاوش در داستان لیزی بوردن و سوالاتی که زندگی او تا به امروز ایجاد می کند، بسیار هیجان زده هستم. کشف روانشناسی این فرد پیچیده و بررسی جنایت آمریکایی که به ابعاد تقریباً افسانه ای رسیده است، رویایی بود که به حقیقت پیوست. این فصل برای اولین بار
