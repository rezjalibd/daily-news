، بنیانگذار Bridgewater Associates و توتو وولف، مدیر عامل میلیاردر مرسدس F1، توافق کردند که رهبران خواستار باید استانداردهای بالا را با مراقبت واقعی از تیم‌های خود همراه کنند. همانطور که دالیو می گوید، مدیریت باید «عشق سخت» را پیاده کند. دالیو هفته گذشته در نشست آسیایی موسسه میلکن در سنگاپور گفت: شعار من کار معنادار و روابط معنادار است. \"وقتی من می گویم عشق سخت، چیز سختی وجود دارد، اما آن عنصر عشق، آن عنصر مراقبت متقابل نیز وجود دارد.\" دالیو، که بریج واتر را به بزرگترین صندوق تامینی جهان تبدیل کرد، گفت که رهبران به یک ماموریت روشن نیاز دارند و باید مردم را برای انجام آن مسئول بخواهند. اما او استدلال کرد که فشار بدون احساس هدف مشترک می تواند یک تیم را تضعیف کند. او می‌گوید: «شما می‌خواهید عشق سختی را با بچه‌هایتان داشته باشید؛ عشق سختی را با همه چیز می‌خواهید، زیرا سختی شما را قوی‌تر می‌کند». و همچنین وقتی یک تیم دارید، باید آن تیم را موفق کنید.» وولف یک مطالعه موردی ارائه کرد که نشان می‌دهد چگونه درست کردن این تعادل"}, {"source": "Business Insider", "title": "The Eurosummer season is getting longer and more popular. These 4 charts show how and where Americans are vacationing.", "link": "https://www.businessinsider.com/eurosummer-italy-charts-north-americans-flying-these-european-cities-countries-2026-9", "summary": "Naples, Italy, has seen the fastest growth in flight capacity from North America over the past three years. Alessandro Tortora/Getty Images More North Americans are flocking to Europe for summer vacation. Business Insider analyzed flight data to identify the trendiest, most popular destinations. Over 1.5 million seats were added on flights to Italy, while capacity doubled for Czechia and Croatia. Whether it's eating gelato under the Mediterranean sun or exploring a medieval city, North Americans can't get enough of summer trips to Europe . Business Insider analyzed data from Cirium, an aviation analytics firm, to create four charts that show how Eurosummer is on the rise — and which destinations are the trendiest. We looked at the number of seats on flights from North America to Europe. Unlike just measuring the number of flights, this also accounts for the airplanes' capacity. Airlines scheduled 69% more seats in July 2026 than in July 2010. Meanwhile, the number of flights went up 59%, from roughly 15,700 to 24,900. As the data is based on flight schedules rather than border crossings, it does not necessarily reflect tourists' final destinations. Even so, passenger demand still informs where airlines send their fleets and launch new routes. Cirium's data also show that airlines are adding more seats in summer than in winter. In 2026, there were 77% more seats from North America to Europe in July than in January. In 2010, there was a 50% gap between those months. However, there is also some country-level data showing that the summer travel season is getting longer, as more people choose to fly later in the year. Spanish government statistics show that 57% more Americans arrived in the country in October 2025 than in October 2019. Overall arrivals during the summer months of 2019 and 2025 increased by a quarter. Which countries are becoming more popular? The UK has long been the most popular transatlantic market — its 15 million annual seats are nearly double those of France and Germany — due to strong business links and airline partnerships that make it a useful hub connecting to destinations elsewhere in Europe. To find where more North Americans are flocking, we focused on changes in flight capacity between the years ending in July 2023 and July 2026. This also helps minimize the fluctuation in recovery times from the pandemic. That expansion has not been spread evenly across Europe. Only four countries saw fewer seats across the period. There are no lo", "date_str": "2026-10-12T10:44:00+00:00", "hash": "b1ceeb17faaa4ad9", "title_fa": "فصل یورو تابستان طولانی تر و محبوب تر می شود. این 4 نمودار نشان می دهد که آمریکایی ها چگونه و کجا تعطیلات را می گذرانند.", "summary_fa": "ناپل، ایتالیا، سریع ترین رشد را در ظرفیت پرواز از آمریکای شمالی طی سه سال گذشته داشته است. الساندرو تورتورا/ گتی ایماژز آمریکایی های شمالی بیشتری برای تعطیلات تابستانی به اروپا می روند. Business Insider داده های پرواز را تجزیه و تحلیل کرد تا مرسوم ترین و محبوب ترین مقاصد را شناسایی کند. بیش از 1.5 میلیون صندلی در پروازهای ایتالیا اضافه شد، در حالی که ظرفیت برای چک و کرواسی دو برابر شد. چه با خوردن ژلاتو زیر آفتاب مدیترانه یا کاوش در یک شهر قرون وسطایی، مردم آمریکای شمالی از سفرهای تابستانی به اروپا سیر نمی شوند. Business Insider داده‌های Cirium، یک شرکت تجزیه‌وتحلیل هوانوردی را تجزیه و تحلیل کرد تا چهار نمودار ایجاد کند که نشان می‌دهد یورو تابستان چگونه در حال افزایش است – و کدام مقاصد مد روز هستند. ما به تعداد صندلی‌های پروازهای آمریکای شمالی به اروپا نگاه کردیم. بر خلاف اندازه گیری فقط تعداد پروازها، این نیز ظرفیت هواپیماها را محاسبه می کند. خطوط هوایی در جولای 2026 69 درصد بیشتر از ژوئیه 2010 صندلی برنامه ریزی کردند. در همین حال، تعداد پروازها 59 درصد افزایش یافت و از حدود 15700 به 24900 رسید. از آنجایی که داده ها بر اساس برنامه پروازها به جای گذرگاه های مرزی است، لزوماً مقصد نهایی گردشگران را منعکس نمی کند. با این وجود، تقاضای مسافر همچنان به این موضوع اطلاع می دهد که خطوط هوایی ناوگان خود را به کجا ارسال می کنند و مسیرهای جدید را راه اندازی می کنند. داده های سیریوم همچنین نشان می دهد که خطوط هوایی در تابستان تعداد صندلی های بیشتری نسبت به زمستان اضافه می کنند. در سال 2026، در ژوئیه 77 درصد صندلی‌های بیشتری از آمریکای شمالی به اروپا نسبت به ژانویه وجود داشت. در سال 2010، 50 درصد فاصله بین آن ماه ها وجود داشت. با این"}, {"source": "Business Insider", "title": "I drove Honda's new Prelude. It may matter more to Honda than to buyers.", "link": "https://www.businessinsider.com/honda-prelude-review-2026-10", "summary": "The 2026 Honda Prelude. Ain t she pretty in blue? Ben Shimkus/Business Insider Honda revived the Prelude as a roughly $44,000 hybrid coupe after 25 years. I drove the car for a week. It's fun and spunky — but who is going to buy this? Limited supply suggests Honda may see it more as a halo car than a volume seller. It's been a quarter century since Honda had a new Prelude arriving at dealerships. The coupe — which was popular in the 1990s with enthusiasts who liked to tinker with tuner cars — was discontinued in 2001. So, I wouldn't blame you if you don't recognize the nameplate. I also wouldn't blame you if you do remember it and find Honda's new approach to the beloved car a little surprising. Unlike the Prelude of yesteryear, the new one is certainly not cheap. My Boost Blue tester has a sticker price of $43,650, including destination. Optional summer tires pushed the suggested price to $44,850. On paper, this car makes almost no sense. Who exactly is the buyer? Prelude purists may bristle at the hybrid powertrain and price. Young shoppers looking for an affordable coupe have cheaper options. Drivers chasing outright performance can get substantially more power elsewhere. After 400 miles, I started to think the Prelude makes more sense for Honda than it does for any one obvious customer. The Prelude is fun — just not in the obvious way The Honda Prelude is a looker from the front. Ben Shimkus/Business Insider Honda calls the new version a sporty grand tourer. It's aiming for a niche part of the US market: It's comfortable and efficient enough for long drives, while maintaining a visual appeal that's very different from the vehicular blobs filling today's grocery store parking lot. I say it nails the aesthetics. My Boost Blue tester was almost aggressively photogenic, with bulging wheel arches and a sloping roofline that gave it a poor man's Porsche vibe. As I drove slowly past a construction site in Brooklyn, a worker asked me to lower my window. \"Sweet car!\" he said. As I drove away, I heard him yell to a coworker: \"Damn, that's a Honda?\" Underneath its curvy coupe body sits Honda's deeply engineered two-motor hybrid system, good for 200 horsepower and an EPA-estimated 44 mpg combined. It also borrows suspension, steering, and Brembo brake hardware from the Civic Type R and luxury interior elements from its high-end luxury brand, Acura. Looks like an Acura with some Honda badges! Ben Shimkus/Business Insider It's not particularly fast. That trade-off b", "date_str": "2026-10-12T10:11:01+00:00", "hash": "5ca9c8f84cbf37b1", "title_fa": "من پرلود جدید هوندا را سوار شدم. شاید برای هوندا بیشتر از خریداران مهم باشد.", "summary_fa": "هوندا پرلود 2026. آیا او در آبی زیبا نیست؟ بن شیمکوس/بن شیمکوس/ هوندا، پرلود را به عنوان یک کوپه هیبریدی تقریباً 44000 دلاری پس از 25 سال احیا کرد. من یک هفته با ماشین رفتم. این سرگرم کننده و شیک است - اما چه کسی می خواهد این را بخرد؟ عرضه محدود نشان می دهد که هوندا ممکن است آن را بیشتر به عنوان یک خودروی هاله ای ببیند تا یک فروشنده حجم. ربع قرن از ورود هوندا یک پرلود جدید به نمایندگی‌ها می‌گذرد. کوپه - که در دهه 1990 در بین علاقه مندانی که دوست داشتند با ماشین های تیونر کار کنند، محبوب بود - در سال 2001 متوقف شد. بنابراین، اگر پلاک نام را نمی شناسید، شما را سرزنش نمی کنم. همچنین اگر آن را به خاطر داشته باشید و رویکرد جدید هوندا به خودروی محبوب را کمی شگفت‌انگیز بدانید، شما را سرزنش نمی‌کنم. برخلاف Prelude سال گذشته، نسخه جدید مطمئناً ارزان نیست. تستر My Boost Blue دارای قیمت برچسب 43650 دلار است، با احتساب مقصد. تایرهای تابستانی اختیاری قیمت پیشنهادی را به 44850 دلار رساندند. روی کاغذ، این خودرو تقریباً هیچ معنایی ندارد. خریدار دقیقا کیه؟ محرک‌های پرلود ممکن است با قوای محرکه هیبریدی و قیمت آن خراشیده شوند. خریداران جوانی که به دنبال یک کوپه مقرون به صرفه هستند، گزینه های ارزان تری دارند. رانندگانی که به دنبال عملکرد بی‌نظیر هستند، می‌توانند به طور قابل‌توجهی قدرت بیشتری در جاهای دیگر دریافت کنند. پس از طی 400 مایل، به این فکر کردم که Prelude برای هوندا منطقی تر از هر مشتری آشکاری است. Prelude سرگرم کننده است - نه به شکل واضحی Honda Prelude یک نگاه از جلو است. بن شیمکوس/ بیزینس اینسایدر هوندا نسخه جدید را یک گرند تورر اسپرت می نامد. هدف آن بخش مهمی از بازار ایالات متحده است: برای رانندگی های طولانی به"}, {"source": "Business Insider", "title": "The era of the 400-mile range EV is upon us", "link": "https://www.businessinsider.com/400-mile-range-ev-charging-volvo-bmw-mercedes-2026-10", "summary": "The next generation of EVs is rolling out. Their biggest improvement: more range. Sjoerd van der Wal/Getty Images There's a fresh batch of EVs heading to the US. They're getting 400 miles of range. That type of range in the US has been reserved for shoppers splashing out on six-figure vehicles. The new batch still has luxury prices — but could quickly filter into mass-market vehicles. Range anxiety? That's so 2026. The auto industry is slowly flipping its calendars into the 2027 model year , and the transition is bringing a new crop of EVs with 400-plus miles of range. That was once a rare bragging point reserved for ultra-luxury sedans and gargantuan electric trucks. It's an important development, especially for the US market. While the rest of the world has started to embrace fully electric driving amid sky-high fuel costs , American drivers have lagged China and Europe in adopting EVs , held back by range anxiety, high vehicle prices, and limited public charging access. Automakers' response: Make EVs go farther in the US market. European manufacturers are leading that charge. BMW's next-generation EVs, called Neue Klasse, are the clearest example. The coming i3 sedan is expected to travel up to 468 miles on a charge, while BMW says its new iX4 SUV coupe can go as far as 428 miles. Those are preliminary estimates based on EPA testing procedures. Its iX3 crossover SUV, meanwhile, has an official EPA rating of up to 434 miles. Strikingly vibrant. Introducing THE NEW BMW iX4. #BMWiX4 #BMW #BMWNewEra #NeueKlasse #BMWGroup https://t.co/4kqvYE1E9s — BMW (@BMW) October 7, 2026 Fellow German luxury automaker Mercedes-Benz is also joining the race. The coming electric C-Class has a range of up to 474 miles, under Europe's more generous range testing system. Swedish automaker Volvo is also releasing the EX60 next year, including a trim with 400 miles of range. The cars are largely priced in the mid-$60,000 range. America has seen some 400-mile electric vehicles before, but so far, they've remained in a small corner of the consumer market. The Lucid Air, priced between $70,000 and $250,500, boasts a 400-plus-mile range for consumers willing to make mortgage-like payments on a vehicle. GM's electric trucks and Cadillac Escalade IQ can also clear 400 miles, but their longest-range versions rely on enormous 205-kilowatt-hour battery packs. The fresh EVs coming from luxury European carmakers feature smaller, more energy-dense battery cells that use their power more eff", "date_str": "2026-10-12T10:09:01+00:00", "hash": "882adb73a6316432", "title_fa": "عصر خودروهای برقی با برد 400 مایل در راه است", "summary_fa": "نسل بعدی خودروهای برقی در حال عرضه است. بزرگترین پیشرفت آنها: برد بیشتر. Sjoerd van der Wal/Getty Images یک سری جدید از خودروهای الکتریکی در حال حرکت به سمت ایالات متحده هستند. آنها 400 مایل برد دارند. این نوع محدوده در ایالات متحده برای خریدارانی که از وسایل نقلیه شش رقمی استفاده می کنند در نظر گرفته شده است. دسته جدید هنوز هم قیمت های لوکس دارد - اما می تواند به سرعت در خودروهای بازار انبوه فیلتر شود. اضطراب محدوده؟ یعنی 2026. صنعت خودرو به آرامی تقویم های خود را به سال مدل 2027 تغییر می دهد و این انتقال محصول جدیدی از خودروهای برقی با برد بیش از 400 مایل را به ارمغان می آورد. این زمانی نقطه افتخار نادری بود که برای سدان های فوق لوکس و کامیون های برقی غول پیکر محفوظ بود. این یک پیشرفت مهم است، به ویژه برای بازار ایالات متحده. در حالی که بقیه جهان شروع به پذیرش رانندگی کاملاً الکتریکی در میان هزینه‌های بالای سوخت کرده‌اند، رانندگان آمریکایی در پذیرش خودروهای برقی از چین و اروپا عقب افتاده‌اند و به دلیل نگرانی از برد، قیمت‌های بالای وسایل نقلیه و دسترسی محدود به شارژ عمومی عقب مانده‌اند. پاسخ خودروسازان: خودروهای برقی را در بازار ایالات متحده بیشتر کنید. تولید کنندگان اروپایی این هزینه را رهبری می کنند. نسل بعدی خودروهای برقی بی ام و که Neue Klasse نام دارند، واضح ترین نمونه هستند. انتظار می‌رود که سدان i3 با یک بار شارژ تا 468 مایل را طی کند، در حالی که ب‌ام‌و می‌گوید کوپه SUV جدید iX4 می‌تواند تا 428 مایل را طی کند. اینها برآوردهای اولیه بر اساس روش های آزمایش EPA هستند. در همین حال، کراس اوور SUV iX3 آن دارای رتبه رسمی EPA تا 434 مایل است. به طرز چشمگیری پر جنب و جوش. معرفی BMW iX4 جدید. #BMWiX4"}, {"source": "Business Insider", "title": "A Starbucks-Chipotle deal would be a high-stakes bet on Brian Niccol’s magic touch", "link": "https://www.businessinsider.com/starbucks-chipotle-deal-brian-niccol-turnaround-magic-wall-street-stocks-2026-10", "summary": "Starbucks is reportedly exploring a takeover of Chipotle, people familiar with the matter told the FT. Bloomberg/Getty Images; Beata Zawrzel/NurPhoto via Getty Images Chipotle has struggled without Brian Niccol. Now Starbucks may bring him back to fix it. Real-estate overlap gives the deal some sauce, but Wall Street sees plenty of risk. Sign up for First Trade , Business Insider's daily markets newsletter. Corporate America loves a boomerang CEO. Think Bob Iger 's return to Disney, or Elliott Hill coming out of retirement for Nike. But what Starbucks CEO Brian Niccol is apparently considering is in a category of its own. The FT reported last week that Starbucks has explored an acquisition of Chipotle in what would be the restaurant industry's biggest deal ever. Here's the twist: Niccol was CEO of Chipotle before jumping to Starbucks. He could now end up buying his old company. Since Niccol's move was announced in August 2024, Wall Street has sent the two companies in opposite directions. Starbucks became a turnaround story, while Chipotle struggled to replace the man who helped make it one. The chart below shows the dynamic in action: Chipotle has fallen an eye-watering 43% over the period, while Starbucks is up roughly 18% — though it has still lagged the S P 500's 46% gain. Chipotle's slump reflects more than Niccol's departure, of course. The chain has also faced softer sales, higher costs, and food-safety headaches. But the gap makes it look like a tempting turnaround target — especially to the exec who helped build it and knows it better than almost anyone. The CEO premium comes full circle On the surface, the combo of Starbucks and Chipotle sounds like some sort of cursed menu experiment. Pumpkin-spice burrito , anyone? But this is less a coffee-and-burrito synergy story than a CEO-conviction trade. That makes the strongest rationale for the deal not any sort of ill-fated food concoction, but Niccol himself. He's already proven he can improve restaurant operations, refresh a brand, and drive investor excitement. His \" Back to Starbucks \" effort has begun to win over the market, and buying Chipotle would allow him to apply a version of that same playbook to the company he once ran. There's also significant overlap between the chains' real-estate footprints. About 90% of US Chipotle locations are within one mile of a Starbucks, according to research from Stephens analyst Jim Salera. That could create opportunities for shared real-estate development, b", "date_str": "2026-10-12T09:50:01+00:00", "hash": "185c0a6f98743ad0", "title_fa": "معامله استارباکس و چیپاتل یک شرط بندی پرمخاطره بر روی لمس جادویی برایان نیکول خواهد بود.", "summary_fa": "افراد آشنا به این موضوع به FT گفتند که طبق گزارش ها، استارباکس در حال بررسی خرید Chipotle است. بلومبرگ/گتی ایماژ; Beata Zawrzel/NurPhoto از طریق Getty Images Chipotle بدون برایان نیکول تلاش کرده است. حالا استارباکس ممکن است او را بازگرداند تا آن را برطرف کند. همپوشانی املاک و مستغلات به این معامله کمک می کند، اما وال استریت ریسک زیادی می بیند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. شرکت های آمریکایی یک مدیر عامل بومرنگ را دوست دارند. به بازگشت باب ایگر به دیزنی فکر کنید یا الیوت هیل از دوران بازنشستگی برای نایک خارج شود. اما آنچه ظاهراً برایان نیکول، مدیر عامل استارباکس در نظر دارد، در دسته‌بندی خاص خود قرار دارد. FT هفته گذشته گزارش داد که استارباکس خرید Chipotle را در بزرگترین معامله صنعت رستوران شناسی مورد بررسی قرار داده است. پیچ و تاب اینجاست: نیکول قبل از رفتن به استارباکس، مدیرعامل چیپوتل بود. او اکنون می تواند شرکت قدیمی خود را بخرد. از زمانی که حرکت نیکول در آگوست 2024 اعلام شد، وال استریت این دو شرکت را در جهت مخالف فرستاده است. استارباکس تبدیل به یک داستان چرخشی شد، در حالی که چیپوتل برای جایگزینی مردی که به ساخت آن کمک کرد تلاش می کرد. نمودار زیر پویایی در عمل را نشان می‌دهد: Chipotle در این دوره افت چشمگیر 43 درصدی را تجربه کرده است، در حالی که استارباکس تقریباً 18 درصد رشد داشته است - اگرچه هنوز هم نسبت به S P 500 با افزایش 46 درصدی عقب مانده است. البته رکود چیپوتل بیش از خروج نیکول را منعکس می کند. این زنجیره همچنین با فروش کمتر، هزینه های بالاتر و سردردهای ایمنی مواد غذایی مواجه شده است. اما این شکاف باعث می‌شود که آن را مانند یک هدف وسوسه‌انگیز وسوسه‌انگیز به نظر برسند - به‌ویژه برای مدیران"}, {"source": "Business Insider", "title": "Passengers ranked the top 10 airlines with the best in-flight WiFi. Elon Musk's Starlink is all over the list.", "link": "https://www.businessinsider.com/airlines-best-wifi-internet-ranking-2026-10", "summary": "Airlines are upgrading their in-flight WiFi offerings. eastwest photo/Getty Images Skytrax's World Airline Awards introduced a new award in 2026: World's Best Onboard WiFi. Qatar Airways won first place, followed by Delta Air Lines and United Airlines. Seven out of the top 10 airlines are partnered with Elon Musk's Starlink. Move aside priority boarding and extra legroom — airlines are investing in high-speed in-flight WiFi as a key amenity to attract customers. This year, Skytrax's World Airline Awards added a World's Best Onboard WiFi category \"to reflect the importance to today's customer experience of fast and free onboard connectivity,\" Skytrax wrote in a press release. The ranking was determined by surveying passengers from over 100 nationalities between September 2025 and August 2026 in the world's largest airline passenger satisfaction survey. One WiFi provider popped up again and again in Skytrax's ranking of winning airlines: Starlink. Of the top 10 airlines recognized for having the best in-flight WiFi offerings, seven have partnerships with Elon Musk's high-speed internet company — an indication of how Starlink is cornering the market. Over 40 carriers worldwide have partnered with Starlink, which provides streaming-quality WiFi on flights via its network of over 11,000 satellites. Here are the top 10 airlines with the best onboard WiFi, ranked by passengers. 10. Emirates A Boeing 777-300ER aircraft operated by Emirates, registration A6-ENM, takes off from Warsaw Chopin Airport in Warsaw, Poland, on May 3, 2026. The airplane is operating flight EK180 to Dubai, United Arab Emirates. (Photo by Mateusz Wlodarczyk/NurPhoto via Getty Images) Mateusz Wlodarczyk/NurPhoto via Getty Images Emirates was one of the first airlines to offer Starlink WiFi on its A380 aircraft, and plans to add Starlink to its fleet by mid-2027. 9. EVA Air This picture taken in Tangerang on February 15, 2012 shows an Eva air airplane is flying over the Sukarno-Hatta airport in Tangerang. Eva air is the second largest Taiwanese airline founded in 1989. AFP PHOTO / ADEK BERRY (Photo credit should read ADEK BERRY/AFP via Getty Images) ADEK BERRY/AFP via Getty Images EVA Air's onboard WiFi service is provided by Panasonic Avionics Corporation. 8. Virgin Atlantic The Virgin logo sits on the tail-fins of passenger aircraft, operated by Virgin Atlantic Airways Ltd, grounded on the tarmac at Manchester Airport, operated by Manchester Airport Plc, in Manchester, U.K., on Monday, June ", "date_str": "2026-10-12T09:32:01+00:00", "hash": "e4dd489b4f2b162b", "title_fa": "مسافران 10 شرکت هواپیمایی برتر را با بهترین وای فای در پرواز رتبه بندی کردند. استارلینک ایلان ماسک در سراسر این فهرست قرار دارد.", "summary_fa": "خطوط هوایی در حال ارتقاء وای فای خود در پرواز هستند. عکس شرق غرب/ گتی ایماژ جوایز هواپیمایی جهانی Skytrax جایزه جدیدی را در سال 2026 معرفی کرد: بهترین وای فای داخلی جهان. قطر ایرویز مقام اول را کسب کرد و پس از آن دلتا ایر لاین و یونایتد ایرلاینز قرار گرفتند. هفت شرکت از 10 شرکت هواپیمایی برتر با استارلینک ایلان ماسک شریک هستند. سوار شدن با اولویت و فضای بیشتر برای پا را کنار بگذارید - خطوط هوایی در حال سرمایه گذاری روی وای فای پرسرعت در حین پرواز به عنوان یکی از امکانات کلیدی برای جذب مشتریان هستند. Skytrax در یک بیانیه مطبوعاتی نوشت، امسال، جوایز جهانی اسکای‌ترکس، دسته‌بندی بهترین وای‌فای داخلی جهان را «برای نشان دادن اهمیت تجربه مشتری امروزی از اتصال سریع و رایگان هواپیما» اضافه کرد. این رتبه بندی با بررسی مسافران از بیش از 100 ملیت بین سپتامبر 2025 تا آگوست 2026 در بزرگترین نظرسنجی رضایت مسافران خطوط هوایی جهان تعیین شد. یکی از ارائه دهندگان وای فای بارها و بارها در رتبه بندی خطوط هوایی برنده Skytrax ظاهر شد: Starlink. از 10 شرکت هواپیمایی برتر که به دلیل داشتن بهترین پیشنهادات وای فای در پرواز شناخته شده اند، هفت شرکت با شرکت اینترنت پرسرعت ایلان ماسک شراکت دارند – که نشان دهنده این است که Starlink چگونه بازار را درگیر کرده است. بیش از 40 شرکت مخابراتی در سراسر جهان با Starlink شریک شده اند که WiFi با کیفیت پخش جریانی را در پروازها از طریق شبکه بیش از 11000 ماهواره خود ارائه می دهد. در اینجا 10 شرکت هواپیمایی برتر با بهترین وای فای داخلی، رتبه بندی شده توسط مسافران آورده شده است. 10. امارات یک هواپیمای بوئینگ 777-300ER که توسط امارات اداره می شود، با نام A6-ENM، از فرودگاه شوپن ورشو در ورشو، لهستان، در 3 می 2026 برمی خیزد."}, {"source": "Business Insider", "title": "The creepiest urban legend from every US state", "link": "https://www.businessinsider.com/urban-legends-from-every-us-state", "summary": "Bigfoot is the star of one of the most well-known urban legends in the US. Christy Rowe/Getty Images There are famous urban legends, including Bigfoot and the Loch Ness monster. However, there are also plenty of local myths that have not made it into mainstream pop culture. Keep reading to find out the creepiest urban legend that takes place in your state. Have you ever felt a chill as you walk down your street, or drive along a dark highway in your home state? You might want to check this list to see if your state's creepiest urban legend unfolded near you. Every country, state, and town has its own urban legends known to residents and fans of the paranormal. Some are attempts to explain mysterious phenomena or tragedies, while others are passed down due to our fascination with the dark and macabre. Some areas have capitalized on local urban legends to attract tourists and boost local economies. In the West Virginia city of Point Pleasant, for example, the legend of Mothman is integral to the community. The Mothman Festival is held every September and includes guest speakers, a street fair, bus tours, live music, food trucks, and more. There's even a Mothman museum. It's not for nothing. The Main Street Point Pleasant organization told The River Cities Tribune Register in 2024 that it estimates the festival brings about $2 million to the city's economy every year. But not every urban legend is that well known. We chose the creepiest urban legend we could find in every state, from the little-known to the mainstays like Bigfoot and the Jersey Devil. ALABAMA: Hell s Gate Bridge The bridge. Google Maps The generally accepted story of Hell's Gate Bridge starts in the 1950s, according to the Oxford Paranormal Society ; a young couple driving over the bridge somehow drove their car off the bridge one night, and they both drowned. There are two legends associated with Hell's Gate Bridge: one is that if you drive your car out to the middle of the bridge and turn off the lights, the couple will magically appear in your car and leave a wet spot on the seat. The other, which is how the bridge got its name, is the belief that if you drive over the bridge and look over your shoulder halfway through, the scenery behind you turns into a portal to hell engulfed in flames. Potentially to curb ghost hunters and bored teenagers, Hell's Gate Bridge is closed to cars, according to The Anniston Star , and it is in such disrepair that walking across is strongly discouraged. ALAS", "date_str": "2026-10-12T09:30:01+00:00", "hash": "8b9304dabc7ff261", "title_fa": "وحشتناک ترین افسانه شهری از هر ایالت ایالات متحده", "summary_fa": "Bigfoot ستاره یکی از شناخته شده ترین اسطوره های شهری در ایالات متحده است. کریستی رو/گتی ایماژ افسانه های شهری معروف، از جمله پاگنده و هیولای دریاچه نس وجود دارد. با این حال، اسطوره های محلی زیادی نیز وجود دارد که آن را به جریان اصلی فرهنگ پاپ تبدیل نکرده است. به خواندن ادامه دهید تا ترسناک ترین افسانه شهری را که در ایالت شما اتفاق می افتد بیابید. آیا تا به حال هنگام راه رفتن در خیابان خود یا رانندگی در بزرگراهی تاریک در ایالت خود احساس سرما کرده اید؟ ممکن است بخواهید این لیست را بررسی کنید تا ببینید آیا ترسناک ترین افسانه شهری ایالت شما در نزدیکی شما آشکار شده است یا خیر. هر کشور، ایالت و شهر، افسانه های شهری خاص خود را دارد که برای ساکنان و طرفداران ماوراء الطبیعه شناخته شده است. برخی تلاش‌هایی برای توضیح پدیده‌ها یا تراژدی‌های اسرارآمیز هستند، در حالی که برخی دیگر به دلیل شیفتگی ما به تاریکی و ترسناک منتقل می‌شوند. برخی از مناطق از افسانه های شهری محلی برای جذب گردشگران و تقویت اقتصاد محلی استفاده کرده اند. به عنوان مثال، در شهر پوینت پلیزنت ویرجینیای غربی، افسانه موتمن جزء جدایی ناپذیر جامعه است. جشنواره Mothman هر ماه سپتامبر برگزار می شود و شامل سخنرانان مهمان، نمایشگاه خیابانی، تورهای اتوبوس، موسیقی زنده، کامیون های غذا و غیره است. حتی یک موزه Mothman نیز وجود دارد. بیهوده نیست. سازمان Main Street Point Pleasant به The River Cities Tribune Register در سال 2024 گفت که تخمین می‌زند این جشنواره سالانه حدود 2 میلیون دلار برای اقتصاد شهر به ارمغان می‌آورد. اما هر افسانه شهری آنقدر شناخته شده نیست. ما ترسناک‌ترین افسانه شهری را که می‌توانستیم در هر ایالت پیدا کنیم، از افراد کم‌شناخته گرفته تا تکیه‌گاه‌هایی مانند Bigfoot و Jersey Devil، انتخاب کردیم. آلاباما: پل دروازه جهنم پل. نقشه های"}, {"source": "Business Insider", "title": "The annoying scam that may be hiding in your work calendar", "link": "https://www.businessinsider.com/work-calendar-invite-scam-phishing-ai-deepfakes-2026-10", "summary": "That meeting on your calendar might not be what it seems. Getty Images; Rebecca Zisser/BI The only thing worse than a meeting that should've been an email? A meeting that's a scam. Calendar phishing is on the rise. Here's why your work schedule is a target. One victim learned she'd been hacked when her contacts received a bogus calendar invite from her. When Pete Thomas spots a meeting on his calendar that he doesn't remember scheduling, the startup executive launches a mini investigation. He searches his inbox for the sender's name, and if that fails, he tries LinkedIn. If Thomas still comes up empty or senses tomfoolery, he'll scan the invitation's contents for odd URLs or other red flags before hitting delete. He's received several in recent months that failed those checks. \"It's a distraction,\" said Thomas, CTO of Kapwork, a fintech firm in Los Angeles. \"You always have to look for context.\" As if email and text message scams weren't enough, workers are contending with a growing wave of phishing attempts arriving through their calendars. In August, calendar-led attacks surged more than tenfold from July, according to a recent study from email security firm Sublime, while a midyear report from Microsoft found that such attacks nearly quadrupled in June from May. Cybersecurity pros say calendars offer attackers advantages over more traditional avenues, and that AI is helping to make the schemes more convincing. They also warn that AI agents could give attackers a leg up by accepting fraudulent invitations on workers' behalf. \"You suddenly have new and interesting opportunities because of these personal agents,\" said Hugh Thompson, program chair of RSAC, an annual cybersecurity conference, and former chief technology officer of software firm Symantec. Risky business The goal of most calendar scammers, digital safety experts say, is to lure victims to phishing sites or deploy social engineering attacks that trick people into revealing sensitive information. The tactic is especially problematic for workers in jobs that rely on regularly meeting with strangers online, such as sales, recruiting, consulting, and other client-facing roles. Aman Gairola, cofounder of Indian design agency Say Design, thought he'd landed a potential client in June when someone booked a meeting on his calendar through his company's website. The invitation included a link to what appeared to be a Google Drive folder containing a project brief. Gairola said he clicked the link and la", "date_str": "2026-10-12T09:17:01+00:00", "hash": "af42c9e4a09b4885", "title_fa": "کلاهبرداری آزاردهنده ای که ممکن است در تقویم کاری شما پنهان شده باشد", "summary_fa": "آن جلسه در تقویم شما ممکن است آنطور که به نظر می رسد نباشد. گتی ایماژ; ربکا زیسر/BI تنها چیزی بدتر از یک جلسه که باید یک ایمیل باشد؟ جلسه ای که کلاهبرداری است. فیشینگ تقویم در حال افزایش است. این است که چرا برنامه کاری شما یک هدف است. یکی از قربانیان زمانی متوجه شد که هک شده است. وقتی پیت توماس جلسه‌ای را در تقویم خود مشاهده می‌کند که زمان‌بندی آن را به خاطر نمی‌آورد، مدیر اجرایی استارت‌آپ تحقیقات کوچکی را آغاز می‌کند. او در صندوق ورودی خود نام فرستنده را جستجو می کند و اگر ناموفق بود، لینکدین را امتحان می کند. اگر توماس همچنان خالی ظاهر شود یا ابلهانه را احساس کند، محتویات دعوتنامه را برای URL های عجیب و غریب یا سایر پرچم های قرمز قبل از زدن دکمه حذف اسکن می کند. او چندین بار در ماه‌های اخیر دریافت کرده است که در آن چک‌ها شکست خورده است. توماس، مدیر ارشد فناوری Kapwork، یک شرکت فین‌تک در لس‌آنجلس، می‌گوید: «این یک حواس‌پرتی است. \"شما همیشه باید به دنبال زمینه باشید.\" گویی کلاهبرداری های ایمیل و پیام های متنی کافی نبودند، کارگران با موج فزاینده ای از تلاش های فیشینگ که از طریق تقویم آنها وارد می شود، دست و پنجه نرم می کنند. طبق مطالعه اخیر شرکت امنیتی ایمیل Sublime، در ماه آگوست، حملات تقویمی بیش از ده برابر نسبت به جولای افزایش یافت، در حالی که گزارش اواسط سال مایکروسافت نشان داد که چنین حملاتی در ژوئن نسبت به ماه می تقریباً چهار برابر شده است. متخصصان امنیت سایبری می‌گویند که تقویم‌ها نسبت به روش‌های سنتی‌تر مزایایی را به مهاجمان ارائه می‌کنند و هوش مصنوعی به متقاعد کردن این طرح‌ها کمک می‌کند. آنها همچنین هشدار می‌دهند که عوامل هوش مصنوعی می‌توانند با پذیرش دعوت‌های تقلبی از طرف کارگران، به مهاجمان کمک کنند. هیو"}, {"source": "Business Insider", "title": "A tech CEO who cut his staff from over 1,000 to 120 says AI is boosting the value of 'high-agency' generalists", "link": "https://www.businessinsider.com/bird-ceo-says-ai-is-empowering-high-agency-generalist-workers-2026-9", "summary": "Bird s CEO Robert Vis says AI is making high-agency generalists more valuable at work. Jose Sarmento Matos/Bloomberg via Getty Images Bird CEO Robert Vis said AI gives an edge to 'high agency' generalists who can work across roles. Bird's head count has dropped from more than 1,000 to 120 as AI automates more tasks. \"If you had very high performance but you were not multidisciplinary, you would not stay,\" he said. Being a specialist may be getting harder at some AI-powered companies. \"The profile that we were very focused on was people with high agency,\" Robert Vis, the CEO of communications infrastructure company Bird, told Business Insider. \"If you're high agency and you're full stack, then AI leverages you to basically be your best self.\" Vis made the comments in late September after Bird announced that it had completed $450 million in debt financing led by JPMorgan, Capital One, and Citi. The company also said its head count fell from more than 1,000 people to 120 over roughly three years as it automated more of its operations and favored employees with high agency and multidisciplinary skills. Vis said AI is helping employees work across tasks that companies have historically treated as distinct roles. In engineering, for example, he said the technology favors people who understand not just how to write code but also how a product should work. \"If you're an engineer and you're extremely good at just code but you have no product sense, that wouldn't work at Bird,\" he said. A new kind of generalist Vis isn't the first executive to argue that AI could give an edge to workers with range and initiative. Figma CEO Dylan Field has said the technology is empowering \" generalist behavior \" as the once-distinct worlds of product, design, development, and research start to blur. Ravi Kumar, CEO of Cognizant, has similarly said workers who combine subject expertise with technological skills may become more relevant than people with narrow expertise alone. The trend is not universal, however. Business Insider previously reported that consulting firms are increasingly prioritizing specialists with deep industry or technical expertise as AI erodes the value of broad strategy work. At Bird, however, Vis said AI is widening the work employees can take on beyond engineering. The tools can help workers operate within design systems or automate routine parts of support, sales, and accounting. \"It's not like you need zero designers, but you need less, and it enables entir", "date_str": "2026-10-12T09:11:01+00:00", "hash": "bd2b091e222d6ab9", "title_fa": "یک مدیر عامل فناوری که کارکنان خود را از بیش از 1000 به 120 کاهش داده است، می‌گوید هوش مصنوعی ارزش متخصصان عمومی «سازمان عالی» را افزایش می‌دهد.", "summary_fa": "رابرت ویس، مدیرعامل Bird می‌گوید که هوش مصنوعی باعث می‌شود افراد با آژانس‌های بالا در محل کار ارزشمندتر شوند. خوزه سارمنتو ماتوس/ بلومبرگ از طریق Getty Images Bird، رابرت ویس، مدیر عامل شرکت گتی ایمیجز گفت که هوش مصنوعی به ژنرال‌های آژانس عالی که می‌توانند در نقش‌ها کار کنند برتری می‌دهد. تعداد سر پرنده از بیش از 1000 به 120 کاهش یافته است زیرا هوش مصنوعی وظایف بیشتری را خودکار می کند. او گفت: \"اگر عملکرد بسیار بالایی داشتید اما چند رشته ای نبودید، نمی ماندید.\" ممکن است متخصص بودن در برخی از شرکت‌های مجهز به هوش مصنوعی سخت‌تر شود. رابرت ویس، مدیرعامل شرکت زیرساخت‌های ارتباطی برد، به Business Insider گفت: «نمایه‌ای که ما روی آن بسیار متمرکز بودیم، افرادی بودند که دارای نمایندگی بالایی بودند. \"اگر شما دارای نمایندگی بالا هستید و تمام افراد را در اختیار دارید، هوش مصنوعی از شما استفاده می کند تا اساسا بهترین خود باشید.\" Vis این اظهارات را در اواخر سپتامبر پس از اینکه Bird اعلام کرد که 450 میلیون دلار تامین مالی بدهی به رهبری JPMorgan، Capital One و Citi را تکمیل کرده است، بیان کرد. این شرکت همچنین گفت که تعداد کارمندان آن از بیش از 1000 نفر به 120 نفر در طول تقریباً سه سال کاهش یافته است زیرا بیشتر عملیات خود را خودکار کرده و کارمندانی را با مهارت‌های چند رشته‌ای و نمایندگی بالا ترجیح می‌دهد. Vis گفت هوش مصنوعی به کارمندان کمک می کند تا در تمام وظایفی که شرکت ها در طول تاریخ به عنوان نقش های متمایز در نظر گرفته اند، کار کنند. به عنوان مثال، در زمینه مهندسی، او گفت که این فناوری به افرادی کمک می کند که نه تنها نحوه نوشتن کد بلکه نحوه عملکرد یک محصول را نیز می دانند. او گفت: \"اگر شما یک مهندس هستید و در کدنویسی بسیار خوب"}, {"source": "Business Insider", "title": "How AI has raised the bar for Two Sigma internships and future hires", "link": "https://www.businessinsider.com/two-sigma-interns-productive-ai-skills-recruitment-2026-10", "summary": "Two Sigma, the $80 billion quant hedge fund, had 82 interns this past summer. Two Sigma Quant giant Two Sigma's summer interns were significantly more productive this year thanks to AI. This change means the firm is valuing softer skills like judgment and communication more than ever. The firm's internship program is a critical talent pipeline for the 1,700-person asset manager. Two Sigma's interns had a very productive summer. So productive that it's raising the bar for future interns. A majority of the $80 billion firm's intern class of 82 math whizzes completed their core projects weeks earlier than past cohorts and were able to work additional tasks, known as stretch goals, according to Evan Anger, the manager's head of talent acquisition. \"We put as much into the onboarding and training of our interns as we do our full-time employees,\" Anger said. A new part of training this year was dedicated to LLM sessions from senior leaders. Two Sigma, which was launched in 2001 by former D.E. Shaw quants John Overdeck and David Siegel, has run its internship program since 2009. The program has produced more than 200 of the firm's 1,700 employees, including eight managing directors — a critical talent pipeline as hedge funds and top tech firms battle for world-class data scientists, engineers, and technologists. The firm has expanded into real estate and private markets in recent years, but a majority of its assets are in systematic funds. Those core quant strategies have required top-notch coders and software engineers to stay atop the ultra-competitive field. Now, after the successful summer, Two Sigma is rethinking the skills it emphasizes in its internships and what it's looking for in new hires. AI, Anger said, has raised expectations for the \"depth and contribution\" an intern can achieve in their few months on the job. Judgment and communication skills in focus Two Sigma isn't planning on turning its internship over to a crew of English majors and philosophy grad students anytime soon. \"We are still looking for people who understand what's going on under the hood,\" Anger said. \"If you have AI build something and you don't understand it, that's not good.\" But the productivity of 2026's class — which was split between interns working on engineering problems and financial modeling projects — puts more of an emphasis on softer skills. Judgment and communication, Anger said, are new focuses for the firm's campus recruiting team as \"AI has leveled the playing fie", "date_str": "2026-10-12T09:10:01+00:00", "hash": "00f4832dfe764638", "title_fa": "چگونه هوش مصنوعی سطح کارآموزی دو سیگما و استخدام های آینده را بالا برده است", "summary_fa": "دو سیگما، صندوق تامینی 80 میلیارد دلاری، تابستان گذشته 82 کارآموز داشت. کارآموزان تابستانی دو سیگما، غول دو سیگما کوانت، امسال به لطف هوش مصنوعی، به طور قابل توجهی بازدهی بیشتری داشتند. این تغییر به این معنی است که شرکت بیش از هر زمان دیگری به مهارت‌های نرم‌تری مانند قضاوت و ارتباط ارزش می‌دهد. برنامه کارآموزی این شرکت یک خط لوله استعدادهای حیاتی برای مدیر دارایی 1700 نفر است. کارآموزان دو سیگما تابستان بسیار پرباری را سپری کردند. آنقدر سازنده است که سطح کارآموزان آینده را بالا می برد. به گفته ایوان انگر، رئیس استعدادیابی مدیر، اکثریت کلاس کارآموزی 80 میلیارد دلاری این شرکت با 82 ویزیس ریاضی، پروژه های اصلی خود را هفته ها زودتر از همگروه های گذشته تکمیل کردند و توانستند وظایف دیگری را که به عنوان اهداف کششی شناخته می شوند، انجام دهند. انگر گفت: «ما به اندازه کارمندان تمام وقت خود برای استخدام و آموزش کارورزان خود هزینه می کنیم. بخش جدیدی از آموزش امسال به جلسات LLM از رهبران ارشد اختصاص داشت. دو سیگما که در سال 2001 توسط D.E سابق راه اندازی شد. شاو از جان اوردک و دیوید سیگل دوری می‌کند، برنامه کارآموزی خود را از سال 2009 اجرا کرده است. این برنامه بیش از 200 کارمند از 1700 کارمند شرکت، از جمله هشت مدیر عامل را تولید کرده است. این شرکت در سال‌های اخیر به بازارهای املاک و مستغلات و خصوصی گسترش یافته است، اما اکثر دارایی‌های آن در صندوق‌های سیستماتیک هستند. این استراتژی‌های کمیت اصلی به کدنویسان و مهندسان نرم‌افزار درجه یک نیاز دارند تا در صدر میدان رقابتی باقی بمانند. اکنون، پس از تابستان موفقیت‌آمیز، دو سیگما در حال بازنگری در مهارت‌هایی است که در دوره‌های کارآموزی خود بر آن تاکید دارد و در استخدام‌های جدید به دنبال چه چیزی است. انجر گفت هوش مصنوعی انتظارات را برای \"عمق"}, {"source": "Business Insider", "title": "Meet the scrappy entrepreneurs getting their piece of the AI buildout pie", "link": "https://www.businessinsider.com/ai-data-center-business-opportunities-entrepreneurial-boom-food-housing-parking-2026-10", "summary": "National Jobsite Catering serves about 1,500 meals on an average day at each of its dozen data center construction sites. Jason Andrew for BI At 5 a.m. in Northern Virginia , chefs are already preparing chicken and chile roja enchiladas, fried shrimp tacos, and big batches of rice and beans to feed thousands of data center construction workers. By late morning, a crew brings the food from the off-site kitchen to a break tent where workers can pick up lunch without leaving the worksite. They don't pay: The Big Tech companies spending billions on AI infrastructure foot the bill. On an average day, National Jobsite Catering serves about 1,500 meals at each of its dozen data center construction sites across Northern Virginia, Texas, Ohio, Louisiana , Nevada, and Georgia, founder Scott Kaplan tells me. The busiest sites serve twice as many. After one to three years, the crews wrap up and move on. Kaplan, whose business used to consist of a fleet of food trucks catering one-off events along the East Coast, designed a venture that can follow them. If you build it, they will cook. Local restaurants and caterers partner with National Jobsite Catering to scale up and serve an influx of workers. Jason Andrew for BI National Jobsite Catering is part of the economic ecosystem being generated by America's data center boom. The tech giants leading the AI buildout are expected to spend more than $5 trillion on technology and data centers through 2030, with more than 1,500 data centers already in the works in the US. The room where a worker sleeps , the gym he hits before his shift, his parking spot, his lunch — these are all provided by a growing network of businesses. Local firms in the suburban and rural areas where the bulk of data centers are being built can get a windfall from a single project, but a more lasting proposition is the opportunity to serve site-to-site as construction crews move around. Whether that translates into lasting benefits for host towns is at the heart of growing pushback against the wave of data centers popping up across the country. Kaplan recognized the new opportunity a few years ago when a hyperscaler hired him to bring trucks to a site outside Philadelphia to feed 2,500 workers. \"Literally the town that it was in had one restaurant — and it was in a strip club,\" he says. To avoid a lunch-hour bottleneck, Kaplan proposed preparing meals in a temporary kitchen and bringing them to the site. After replicating this model for other projects, h", "date_str": "2026-10-12T09:06:01+00:00", "hash": "31abfba1bec14e73", "title_fa": "با کارآفرینان نامرغوبی آشنا شوید که قطعه خود را از کیک ساخت هوش مصنوعی دریافت می کنند", "summary_fa": "پذیرایی ملی Jobsite Catering حدود 1500 وعده غذایی را در روز در هر یک از دوجین سایت ساخت و ساز مرکز داده خود سرو می کند. جیسون اندرو برای BI در ساعت 5 صبح در ویرجینیای شمالی، سرآشپزها در حال تهیه انچیلاداهای مرغ و شیلی، تاکو میگوی سرخ شده، و دسته های بزرگ برنج و لوبیا برای تغذیه هزاران کارگر ساختمانی مرکز داده هستند. تا اواخر صبح، خدمه غذا را از آشپزخانه خارج از محل کار به چادر استراحت می‌آورند، جایی که کارگران می‌توانند ناهار را بدون ترک محل کار بردارند. آنها پولی نمی پردازند: شرکت های بزرگ فناوری که میلیاردها دلار برای زیرساخت های هوش مصنوعی هزینه می کنند، این هزینه را انجام می دهند. اسکات کاپلان موسس به من می گوید که به طور متوسط ​​روزانه، National Jobsite Catering حدود 1500 وعده غذایی را در هر یک از دوجین سایت ساخت و ساز مرکز داده خود در ویرجینیای شمالی، تگزاس، اوهایو، لوئیزیانا، نوادا و جورجیا سرو می کند. شلوغ ترین سایت ها دو برابر بیشتر خدمات ارائه می دهند. بعد از یک تا سه سال، خدمه جمع می شوند و ادامه می دهند. کاپلان، که تجارتش قبلاً شامل ناوگانی از کامیون‌های مواد غذایی بود که رویدادهای یکباره در امتداد ساحل شرقی را پذیرایی می‌کردند، سرمایه‌گذاری را طراحی کرد که می‌تواند آنها را دنبال کند. اگر بسازی، می پزند. رستوران‌ها و کترینگ‌های محلی با National Jobsite Catering همکاری می‌کنند تا هجوم کارگران را افزایش دهند و خدمات ارائه دهند. جیسون اندرو برای BI National Jobsite Catering بخشی از اکوسیستم اقتصادی است که توسط رونق مرکز داده آمریکا ایجاد می شود. انتظار می‌رود غول‌های فناوری که در ساخت هوش مصنوعی پیشرو هستند تا سال 2030 بیش از 5 تریلیون دلار برای فناوری و مراکز داده هزینه کنند و بیش از 1500 مرکز داده در حال حاضر در ایالات متحده کار"}, {"source": "Business Insider", "title": "Business is booming in a small Louisiana town as a huge Meta AI data center project brings in thousands of workers", "link": "https://www.businessinsider.com/meta-ai-data-center-construction-louisiana-local-business-growth-economy-2026-10", "summary": "Holy Tacos and other businesses are opening in Richland Parish as Meta builds its data center. Tim Allen Meta is building its largest data center to date in northeast Louisiana. Over 7,500 workers are expected to be on the construction site at the project's peak. Residents are launching businesses to capitalize on the opportunity. The construction workers building Meta's largest-ever data center are arriving in a tiny Louisiana town with more than specialized skills and manpower. They've also got cash to spend. It's a fact that local entrepreneurs are leveraging to build new businesses. \"It's been a good opportunity for everybody,\" David Rodgers, the cofounder of Ice Queen, a local business, told Business Insider. \"I tell people, you can't stop it unless you have $50 billion. You might as well get on board and go with the flow.\" Meta is building its largest data center to date, Hyperion, in Louisiana s Richland Parish. USA TODAY Network via Reuters Connect Meta said the data center , dubbed Hyperion, will span nearly 10 million square feet in rural Holly Ridge and will support more than 7,500 jobs at peak construction. That's a workforce larger than the population of Aspen, Colorado. While the influx of workers is straining the local housing market and disrupting aspects of daily life, their presence has also boosted the region's economy. Spinning straw into gold Holly Ridge is a very small sliver of the nearly 19,600 residents in Richland Parish , where agriculture has been the main industry for decades. Before Meta arrived, the smattering of towns, villages, and unincorporated areas that make up Richland Parish hadn't seen significant economic growth in years. Tim Allen, a Richland Parish restaurant owner, lived through that stagnation in the nearby town of Rayville. \"Rayville has been a small community my whole life, and it's been in decline over the last several years. We have a lot of people whose children are moving out, and they usually don't come back,\" Allen said. \"Growing up, downtown Rayville had multiple businesses, hardware stores, and clothing stores. One by one, they shut down until only a couple of stores were left.\" When Meta announced its project in 2024, Allen and his family were among those who saw an opportunity to turn things around. Holy Tacos in Rayville, Louisiana, opened its doors in April 2025. Tim Allen \"Since Meta's announcement, we've seen old businesses revitalize and new ones open, including ours,\" Allen said. Holy Tacos ope", "date_str": "2026-10-12T09:03:01+00:00", "hash": "58ebf7be4d48aad3", "title_fa": "کسب و کار در یک شهر کوچک لوئیزیانا در حال رونق است زیرا یک پروژه بزرگ مرکز داده متا هوش مصنوعی هزاران کارگر را جذب می کند.", "summary_fa": "Holy Tacos و سایر مشاغل در Richland Parish افتتاح می شوند زیرا Meta مرکز داده خود را می سازد. تیم آلن متا در حال ساخت بزرگترین مرکز داده خود تا به امروز در شمال شرقی لوئیزیانا است. انتظار می رود بیش از 7500 کارگر در محل ساخت و ساز در اوج پروژه حضور داشته باشند. ساکنان در حال راه اندازی مشاغل هستند تا از فرصت استفاده کنند. کارگران ساختمانی که بزرگ‌ترین مرکز داده متا را می‌سازند، با بیش از مهارت‌ها و نیروی انسانی به یک شهر کوچک لوئیزیانا می‌رسند. آنها همچنین پول نقدی برای خرج کردن دارند. این یک واقعیت است که کارآفرینان محلی در حال اهرم برای ایجاد کسب و کارهای جدید هستند. دیوید راجرز، بنیانگذار Ice Queen، یک تجارت محلی، به Business Insider گفت: \"این فرصت خوبی برای همه بود.\" من به مردم می گویم، شما نمی توانید جلوی آن را بگیرید مگر اینکه 50 میلیارد دلار داشته باشید. متا در حال ساخت بزرگترین مرکز داده خود تا به امروز، Hyperion، در ریچلند پریش لوئیزیانا است. شبکه USA TODAY از طریق رویترز کانکت متا گفت که مرکز داده با نام Hyperion تقریباً 10 میلیون فوت مربع در روستایی Holly Ridge خواهد بود و از بیش از 7500 شغل در زمان اوج ساخت پشتیبانی می کند. این نیروی کار بیشتر از جمعیت آسپن، کلرادو است. در حالی که هجوم کارگران بازار مسکن محلی را تحت فشار قرار می دهد و جنبه های زندگی روزمره را مختل می کند، حضور آنها به اقتصاد منطقه نیز رونق داده است. ریسندگی کاه به طلا هالی ریج قطعه بسیار کوچکی از نزدیک به 19600 ساکن در ریچلند پریش است، جایی که کشاورزی برای دهه ها صنعت اصلی بوده است. قبل از ورود متا، انبوه شهرها، دهکده‌ها و نواحی نامشخصی که ریچلند پریش را تشکیل می‌دهند، طی سال‌ها رشد اقتصادی قابل توجهی نداشتند. تیم"}, {"source": "Business Insider", "title": "I spent years trying to be a supermom. Getting sick taught me that my son needed to see me rest, too.", "link": "https://www.businessinsider.com/chronic-illness-slowed-me-down-son-child-learning-self-care-2026-10", "summary": "The author, pictured with her son, said she is glad she is modeling healthy self-care. Courtesy of Ashley Archambault. Health struggles have forced me to be a less-present mom than I've been in the past. I felt a lot of guilt about this until I realized that my son needs to see me take care of myself. Now I'm showing him that rest is allowed and needed, and that's important, too. I've been dealing with health struggles for years and often feel a ton of mom guilt about not being there for my son as much as I used to be when he was younger. I was a single mom for the first seven years of his life, and he watched me do it all. He saw me work and then do everything around the house, all while still spending a lot of time with him. But I sometimes wonder if the pressure I put on myself to do it all on my own is part of why I burned out. About five years ago, it seemed like I got sick suddenly, but my symptoms had likely been mounting for years. It's also possible that being so busy kept me from noticing and dealing with my symptoms. I used to be able to do so much with my son outside, like playing basketball or going on a family hike nearly every weekend. Those are the things I miss doing with him the most, but what he misses most is me getting down on the floor to build Lego creations with him. My current orthopedic struggles make that impossible right now. I seriously hurt my back and hips about two years ago. After years of repeated injuries in the area, my back locked up out of nowhere, and I couldn't walk the next morning. I lost so much function overnight that just sitting and standing became major challenges. While I can't quite build Legos on the floor yet, I have come a long way in my physical recovery. At first, I didn't handle missing out on things well When I first started getting sick a lot, I cried often about missing out on things with my son. For instance, if I got a terrible migraine , I'd miss entire weekends with him or important events. It felt like I was missing major moments. Instead of giving myself any grace, I just put more pressure on myself to get better for my son. But of course, that's not how getting better works. I was finally diagnosed with endometriosis last year and have seen improvements with various treatments. That has given me a lot of hope. But getting to this point took me accepting that I have a health condition that isn't going away and requires a lot of management. That takes time, time that will take me away from pare", "date_str": "2026-10-12T09:02:01+00:00", "hash": "7d96216b433dc145", "title_fa": "من سالها تلاش کردم تا یک سوپرمادر باشم. مریض شدن به من آموخت که پسرم هم باید استراحت کند.", "summary_fa": "نویسنده که در تصویر با پسرش به تصویر کشیده شده است، گفت که خوشحال است که از خود مراقبتی سالم الگوبرداری می کند. با حسن نیت از اشلی آرچمبل. مشکلات سلامتی مرا مجبور کرده است که نسبت به گذشته مادری کمتر حاضر باشم. من در این مورد احساس گناه زیادی داشتم تا اینکه متوجه شدم پسرم باید ببیند که از خودم مراقبت کنم. اکنون به او نشان می دهم که استراحت مجاز و لازم است و این نیز مهم است. من سال‌هاست که با مشکلات سلامتی دست و پنجه نرم می‌کنم و اغلب احساس گناه می‌کنم که به اندازه زمانی که پسرم کوچکتر بودم در کنار پسرم نبودم. من در هفت سال اول زندگی او یک مادر مجرد بودم و او تمام این کارها را از من دید. او دید که من کار می کنم و بعد همه کارهای خانه را انجام می دهم، در حالی که هنوز زمان زیادی را با او سپری می کنم. اما گاهی فکر می‌کنم فشاری که به خودم وارد می‌کنم تا همه این کارها را به تنهایی انجام دهم، بخشی از دلیل سوختگی من است؟ حدود پنج سال پیش، به نظر می رسید که به طور ناگهانی بیمار شدم، اما احتمالاً سال هاست که علائم من افزایش یافته است. همچنین ممکن است مشغله زیاد من را از توجه و برخورد با علائمم باز داشته باشد. من قبلاً می توانستم کارهای زیادی را با پسرم در خارج از خانه انجام دهم، مانند بازی بسکتبال یا رفتن به یک پیاده روی خانوادگی تقریباً هر آخر هفته. اینها چیزهایی هستند که من بیشتر از همه دلم برای انجام دادن با او تنگ شده است، اما چیزی که او بیشتر از همه دلتنگش می شود این است که روی زمین بیایم تا با او آثار لگو بسازم. مبارزات ارتوپدی فعلی من این کار را در حال حاضر غیرممکن"}, {"source": "Business Insider", "title": "I retired in my early 50s to care for my husband with dementia. We've exhausted his 401(k) and had to sell our house.", "link": "https://www.businessinsider.com/long-term-care-dementia-401k-selling-home-alzheimers-2026-10", "summary": "Wendy Rowland cared for her husband with early-onset dementia before he went into a care facility. Wendy Rowland Wendy Rowland returned to work in her 50s to support her husband with early-onset dementia. Her husband, once a printing worker, now resides in a costly memory care facility in Tennessee. Rowland navigated financial challenges like selling the home and managing expenses with limited aid. This as-told-to essay is based on a conversation with Wendy Rowland, 53, who lives in Mississippi. Rowland, who was a stay-at-home mom , returned to work in her 50s to help pay for her husband's long-term care , as he suffers from early-onset dementia. This interview has been edited for length and clarity. My husband has early-onset Lewy body dementia . He is 59 and has been in a memory care facility for over two years now. We have already used his 401(k), and I sold the house we had for over 20 years. Once the money from that is gone, I'm not sure what will happen. We met at the same printing company in Memphis. My husband had been printing since he was 18. We had a strong suspicion that his job may have had something to do with his condition because of all the chemicals. He worked in brand labels. I worked until our first son was born. I had another son from a previous relationship. We started to notice things that were going on in his early 50s. He would try to do things he had done a million times over the course of his life, and they would come out a little backward. The rest of the family would say, \"Oh, that's just him.\" I would reply, \"No, it's not really.\" We noticed this most clearly when he was driving. He would make turns in front of others, and the accidents started happening. He would also fix a water line incorrectly. All of his wires were getting crossed. Are you paying for your own or your loved one's long-term care? Do you have thoughts to share about long-term care in the US? To share your story with a reporter, please fill out this quick form . There were vacations we would go on a little before his diagnosis, when he would wander off or get agitated because he thought he had left something somewhere. He was let go from his job, and that's when we went for his official diagnosis. His mother was diagnosed around the same time as him. He had two kids, a wife of 20-something years, the house in the country that he always wanted, and the boat he always wanted. He did everything that he was supposed to do, and then life happened. His specific deme", "date_str": "2026-10-12T09:00:01+00:00", "hash": "c5689ca9abea7c73", "title_fa": "من در اوایل 50 سالگی بازنشسته شدم تا از شوهرم مبتلا به زوال عقل مراقبت کنم. ما 401 (k) او را خسته کرده ایم و مجبور شدیم خانه خود را بفروشیم.", "summary_fa": "وندی رولند از شوهرش که دچار زوال عقل زودرس بود، قبل از رفتن به مرکز مراقبت از او مراقبت کرد. وندی رولند وندی رولند در 50 سالگی به سر کار بازگشت تا از شوهرش که دچار زوال عقل زودرس بود حمایت کند. شوهرش که زمانی کارگر چاپ بود، اکنون در یک مرکز گران قیمت مراقبت از حافظه در تنسی زندگی می کند. رولند چالش‌های مالی مانند فروش خانه و مدیریت هزینه‌ها را با کمک محدود پشت سر گذاشت. این مقاله گفته شده بر اساس گفتگو با وندی رولند 53 ساله است که در می سی سی پی زندگی می کند. رولند که یک مادر خانه نشین بود، در دهه 50 زندگی خود به سر کار بازگشت تا به پرداخت هزینه های مراقبت طولانی مدت شوهرش کمک کند، زیرا او از زوال عقل زودرس رنج می برد. این مصاحبه برای طولانی بودن و وضوح ویرایش شده است. شوهر من زودرس زوال عقل بدن لویی دارد. او 59 سال دارد و اکنون بیش از دو سال است که در مرکز مراقبت از حافظه است. ما قبلاً از 401(k) او استفاده کرده‌ایم، و خانه‌ای را که بیش از 20 سال داشتیم فروختم. وقتی پول آن تمام شد، مطمئن نیستم چه اتفاقی خواهد افتاد. در همان شرکت چاپ در ممفیس با هم آشنا شدیم. شوهرم از 18 سالگی چاپ می کرد. ما به شدت مشکوک بودیم که ممکن است شغل او به دلیل همه مواد شیمیایی، ربطی به وضعیت او داشته باشد. او در لیبل های برند کار می کرد. من تا زمانی که اولین پسرمان به دنیا آمد کار کردم. من یک پسر دیگر از رابطه قبلی داشتم. ما متوجه چیزهایی شدیم که در اوایل دهه 50 او در جریان بود. او سعی می کرد کارهایی را که در طول زندگیش میلیون ها بار انجام داده بود انجام دهد و آنها کمی عقب"}, {"source": "Business Insider", "title": "TikTok's CEO says people are going all in on AI agents without understanding how they work", "link": "https://www.businessinsider.com/tiktok-ceo-shou-zi-chew-not-understanding-ai-agent-permissions-2026-10", "summary": "TikTok CEO Shou Chew said users should review the permissions and controls they grant to their AI agents. Taylor Hill/FilmMagic TikTok CEO Shou Zi Chew said people are using AI agents without understanding how they operate. He said users need to be more mindful about what permissions they give their agents. The personal AI agent horror stories have been rolling in as more companies launch these tools. TikTok CEO Shou Zi Chew has a reminder for AI agent fans: take a beat to understand them before diving in. \"A lot of users may be giving permissions to the agents to do a lot of things for them, without really understanding what kind of permissions you have actually given,\" Chew said, speaking at a conference organized by DBS Bank in Singapore on Monday. For example, he said that agents who have been given credit card information to purchase items for users may be \"overly eager to deliver,\" and end up buying much more than they were asked to. The executive added that TikTok is training its staff on what information they should not include in public chats with AI agents, such as trade secrets or privileged legal information. \"So people, you know, sometimes are over enthusiastic about how they use it,\" he said. \"So I think understanding, you know, where the boundaries of what is reasonable and acceptable use, is important.\" Chew made these comments at the DBS Asia Future Forward Conference, whose theme centered on how AI could be implemented in Asia to create real value. During his fireside chat, he also talked about how he uses AI as a diet coach and to answer medical questions. Personal AI agents have seen a boom in the past few months, with the introduction of tools like Meta's Muse assistant, SpaceXAI's Grok Bot, OpenAI's Dots, and the startup Instinct's AI agents. They've been hailed as productivity boosters, handling mundane tasks for users, such as bookings, audits, and repetitive purchases. But users have also shared some nightmare stories of their agents going rogue and taking actions they hadn't anticipated. Software company founder Shane Mac told Business Insider that his AI agent, tasked with sending him a month-end audit of his bank account, accidentally posted it to his company's Slack chat . Others have talked about their agents hallucinating information and misunderstanding instructions. Austin Welch, who works in finance in Houston, told Business Insider that his Instinct agent accidentally ordered 20 pounds of chicken for his meal with his par", "date_str": "2026-10-12T08:57:38+00:00", "hash": "edc1709e68fd74a2", "ti
