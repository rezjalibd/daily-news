      backdrop-filter: blur(4px);
      display: none;
      align-items: center;

به قدرت برسد، نتواند امکان دستیابی ایران به سلاح هسته‌ای را فراهم کند.", "date_str": "2026-11-21T16:59:23+00:00", "hash": "095e26b9126bad13", "title_fa": "دونالد ترامپ می‌گوید با «گروه سوم» رهبران جمهوری اسلامی به دنبال توافقی دائمی است", "summary_fa": "ترامپ تأکید کرد به دنبال دستیابی به توافقی دائمی با تهران است که حتی اگر رئیس‌جمهوری بی‌کفایت در آمریکا به قدرت برسد، نتواند امکان دستیابی ایران به سلاح هسته‌ای را فراهم کند. دونالد ترامپ، رئیس‌جمهور آمریکا، می‌گوید پس از کنار زدن دو گروه از رهبران جمهوری اسلامی، اکنون با «گروه سوم» آن‌ها سروکار دارد که به‌گفتهٔ او احتمالاً منطقی‌تر از رهبران پیشین هستند، اما همچنان تعامل با آن‌ها بسیار دشوار است. او در عین حال تأکید کرد که به دنبال دستیابی به توافقی دائمی با حکومت ایران است تا حتی اگر در آینده رئیس‌جمهوری بی‌کفایت در آمریکا به قدرت برسد، نتواند امکان دستیابی ایران به سلاح هسته‌ای را فراهم کند. آقای ترامپ روز شنبه ۳۰ آبان در گفت‌وگوی تلفنی با شبکهٔ فاکس‌نیوز، در پاسخ به این پرسش که آیا پس از پایان جنگ، رژیم کنونی ایران همچنان بر سر کار خواهد بود، گفت تغییر رژیم هرگز دغدغهٔ اصلی او نبوده است. او افزود: «بعضی‌ها از تغییر رژیم صحبت می‌کنند، اما باید توضیح دهند منظورشان چیست؛ چون من تاکنون دو رژیم را از میان برداشته‌ام. گروه اول را از میان برداشتم، گروه دوم را هم همین‌طور. اکنون با گروه سوم سروکار داریم.» در جریان جنگ ۴۰روزهٔ آمریکا و اسرائیل با ایران که نهم اسفند پارسال آغاز شد، علی خامنه‌ای، رهبر وقت جمهوری اسلامی، و شمار چشمگیری از مقام‌های ارشد سیاسی، نظامی و امنیتی کشته شدند. پس از کشته شدن علی خامنه‌ای، پسر او مجتبی خامنه‌ای به‌عنوان رهبر جمهوری اسلامی معرفی شد، هرچند از آن زمان هنوز هیچ تصویر یا صدایی از او منتشر نشده است. رئیس‌جمهور آمریکا در ادامهٔ مصاحبه با فاکس‌نیوز گفت با توجه به این تغییرات می‌توان تحولات رخ‌داده را «نهایت تغییر رژیم» توصیف کرد، هرچند به‌گفتهٔ او، رویکرد مقام‌های کنونی جمهوری اسلامی تفاوت چندانی با پیشینیان ندارد. ترامپ افزود: «احتمالاً این افراد منطقی‌تر هستند، اما بسیار بسیار دشوارند.", "image_url": "https://gdb.rferl.org/8257bd33-2452-4860-95b0-7acccaa809fd_w1200_h630.jpg", "category": "ه ان است.» در ادامه خلاصه‌ای از این میزگیر را که تضاد میان گسترش عاملیت، سواد و هویت‌یابی جدید زنان با ساختارهای سنتی، قوانین ناکارآمد و سیطره فرهنگ پدرسالار را واکاوی کرده می‌خوانید. شیرین احمدنیا، که عنوان نخستین زن رییس انجمن جامعه‌شناسی ایران را هم در کارنامه دارد در این مصاحبه با تاکید بر نشانه‌های سنتی‌بودن جامعه ایران گفته‌است: «ما نباید گول میانگین‌های آماری جامعه را بخوریم؛ برای نمونه اگرچه متوسط سطح تحصیلات زنان ارتقا یافته است، اما با دقت در تنوع منطقه‌ای و جغرافیایی، متوجه می‌شویم که", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B1_wbsr__v1024x512__box_0%2C11%2C596%2C325.jpeg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۳۰ آبان • ۱۹:۳۴"}, {"source": "IranWire", "title": "غریب‌آبادی از رایزنی دو ساعته با هیات قطری در تهران خبر داد", "link": "https://iranwire.com/fa/news-1/160564-%D8%BA%D8%B1%DB%8C%D8%A8%D8%A2%D8%A8%D8%A7%D8%AF%DB%8C-%D8%A7%D8%B2-%D8%B1%D8%A7%DB%8C%D8%B2%D9%86%DB%8C-%D8%AF%D9%88-%D8%B3%D8%A7%D8%B9%D8%AA%D9%87-%D8%A8%D8%A7-%D9%87%DB%8C%D8%A7%D8%AA-%D9%82%D8%B7%D8%B1%DB%8C-%D8%AF%D8%B1-%D8%AA%D9%87%D8%B1%D8%A7%D9%86-%D8%AE%D8%A8%D8%B1-%D8%AF%D8%A7%D8%AF/", "summary": "کاظم غریب‌آبادی، معاون حقوقی و بین‌المللی وزارت امور خارجه جمهوری اسلامی، از سفر هیات قطری به تهران در شامگاه جمعه و برگزاری رایزنی دو س ...", "date_str": "2026-11-21T16:04:33+00:00", "hash": "f291b36a28bf6524", "title_fa": "غریب‌آبادی از رایزنی دو ساعته با هیات قطری در تهران خبر داد", "summary_fa": "کاظم غریب‌آبادی، معاون حقوقی و بین‌المللی وزارت امور خارجه جمهوری اسلامی، از سفر هیات قطری به تهران در شامگاه جمعه و برگزاری رایزنی دو س ... غریب‌آبادی روز شنبه ۳۰ آبان در جمع خبرنگاران گفت جزئیات هر موضوع، از جمله مسایل مربوط به مواد غنی‌شده، به آغاز مذاکرات موکول خواهد شد. پیشتر باراک راوید، خبرنگار اکسیوس، گزارش داده بود علی ذوادی، فرستاده قطر، شامگاه جمعه به تهران سفر کرده و با مقام‌های جمهوری اسلامی گفت‌وگو کرده است. او ذوادی را دیپلماتی باسابقه و وزیر امور راهبردی قطر معرفی کرد. غریب‌آبادی درباره محاصره اقتصادی اه‌های تقویت و توسعه همکاری‌ها گفت‌وگو کردند. شماری از افسران ارشد نظامی و مقام‌های رسمی دو کشور نیز در این نشست حضور داشتند. این تحولات در حالی رخ می‌دهد که تنش و درگیری میان نیروهای جمهوری اسلامی و آمریکا در روزهای اخیر افزایش یافته است. روابط عمومی ارتش جمهوری اسلامی روز شنبه ۳۰ آبان اعلام کرد سامانه‌های پدافند هوایی این نیرو شامگاه جمعه یک جنگنده اف-۱۶ آمریکایی را بر فراز خلیج فارس هدف قرار داده و به آن آسیب رسانده‌اند. ارتش جمهوری اسلامی همچنین گفت خلبان این جنگنده مجبور به لغو ماموریت و فرود اضطراری در یکی از فرودگاه‌های منطقه شده است. با این حال، رویترز گزارش داد مقام‌های آمریکایی ادعای ارتش جمهوری اسلامی درباره آسیب دیدن جنگنده اف-۱۶ را تایید نکرده‌اند. همچنین روابط عمومی سپاه پاسداران روز شنبه اعلام کرد نیروهای پدافند هوایی این نهاد یک پهپاد شناسایی را در شمال خلیج فارس، مقابل سواحل بوشهر، رهگیری و سرنگون کرده‌اند. سپاه در اطلاعیه خود با اشاره به این رویداد گفت هرگونه نقض حریم هوایی ایران را غیرقابل پذیرش می‌داند و به آن", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/image_zGKN__v1024x512__box_0%2C0%2C1200%2C632.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۳۰ آبان • ۱۷:۵۹"}, {"source": "Iran International", "title": "منچسترسیتی ۱-۱ فولام؛ اوضاع سیتی پس از فیفادی هم بهتر نشد؛ چهارمین بازی پیاپی بدون برد", "link": "https://www.iranintl.com/202611216132", "summary": "منچسترسیتی در هفته یازدهم لیگ برتر انگلستان، در ورزشگاه اتحاد مقابل فولام به تساوی یک بر یک رسید و برای چهارمین مسابقه متوالی از کسب پیروزی بازماند. سیتی‌زن‌ها البته سه بازی قبلی در لیگ برتر را باخته بودند.", "date_str": "2026-11-21T14:57:17+00:00", "hash": "af8374d62b151007", "title_fa": "منچسترسیتی ۱-۱ فولام؛ اوضاع سیتی پس از فیفادی هم بهتر نشد؛ چهارمین بازی پیاپی بدون برد", "summary_fa": "منچسترسیتی در هفته یازدهم لیگ برتر انگلستان، در ورزشگاه اتحاد مقابل فولام به تساوی یک بر یک رسید و برای چهارمین مسابقه متوالی از کسب پیروزی بازماند. سیتی‌زن‌ها البته سه بازی قبلی در لیگ برتر را باخته بودند.", "image_url": "https://i.iranintl ن زمان می دهد تا مقررات مرکز داده خود را بررسی کند. Loudoun County دارای بالاترین تمرکز مراکز داده در سراسر جهان است. شهرستان ویرجینیا در قلب رونق مرکز داده آمریکا، برنامه های کاربردی را برای یک سال متوقف کرده است. هیئت نظارت شهرستان لودون در جلسه ای در اوایل این هفته به وقفه در برنامه های مرکز داده و پست های برق رأی داد. شهرستان لودون دارای بالاترین تمرکز مراکز داده در جهان است که به آن لقب \"کوچه مرکز داده\" را داده است. گوگل و بسیاری از شرکت های فناوری دیگر در آنجا امکاناتی دارند. هیأت مدیره گفت که پس از تصمیم گیری در مورد اصلاحیه های طرح جامع و بخش بندی شهرستان لودون، این وقفه پایان می یابد. هیئت مدیره در فوریه 2024 بررسی سیاست‌های مرکز داده و پست‌های الکتریکی خود را آغاز کرد. در بیانیه‌ای مطبوعاتی از شهرستان لودون گفت: «دلیل هیئت برای بررسی توقف اقدامات در مورد برنامه‌های قانونی این است که زمان لازم را برای استان فراهم کند تا بررسی مداوم سیاست‌ها و مقررات مرکز داده را تکمیل کند». این شهرستان گفت که توسعه دهندگان می توانند در طول وقفه به ارسال درخواست ها ادامه دهند و کارکنان شهرستان لودون همچنان به بررسی آنها و برنامه ریزی جلسات استماع با کمیسیون برنامه ریزی ادامه خواهند داد. با این حال، هیئت مدیره می گوید تا زمانی که بررسی کامل نشود، هیچ جلسه استماع یا رأی گیری عمومی برگزار نخواهد شد. به گفته این شهرستان، این تصمیم می تواند بر 33 برنامه فعال تأثیر بگذارد. بسیاری از شهرها و شهرهای ایالات متحده پروژه های بزرگ", "image_url": "https://i.insider.com/6b01d6fed6c5d341c9b4bf27?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۳۰ آبان • ۲۲:۱۳"}, {"source": "Business Insider", "title": "I grew up with 5 siblings and raised 4 kids. The biggest lesson I learned is that fair doesn't always mean equal.", "link": "https://www.businessinsider.com/large-family-six-siblings-lessons-parenting-four-children-2026-11", "summary": "The author grew up with five siblings and learned a lot about parenting before having her four kids. Patty Schmidt I grew up with five siblings and learned about fairness and conflict long before becoming a mom. I get.com/img/gallery/common-reasons-why-your-iphone-keeps-randomly-turning-off/l-intro-1794857831.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple"], "datetime_fa": "۳۰ آبان • ۱۹:۴۵"}, {"source": "Business Insider", "title": "I tried Ina Garten's overnight mac and cheese. It's super easy, and one of the best dishes I've made for Thanksgiving.", "link": "https://www.businessinsider.com/ina-garten-overnight-mac-and-cheese-recipe-2026-11", "summary": "Ina Garten s overnight mac and cheese was everyone s favorite dish at Friendsgiving. Anneta Konstantinides/Business Insider I made Ina Garten's overnight mac and cheese recipe for Friendsgiving. The dish includes Gruyère and white cheddar, and the simple recipe barely requires any prep. It was the dish everyone couldn't stop talking about. From a comforting five-cheese penne to her easy weeknight Bolognese , an Ina Garten pasta dish has never led me astray. So why should I stop just because it's the holidays? The \"Barefoot Contessa\" star calls her overnight mac and cheese the \"perfect make-ahead dish,\" which sounded great for the hectic season. Plus, Garten says it's the \"creamiest, crustiest, most delicious mac and cheese\" she's ever made. Obviously, I had to try it. Ina Garten s overnight mac and cheese only needs a few ingredients. Anneta Konstantinides/Business Insider To make Garten's dish for four, you'll need: 8 ounces of cavatappi or elbow macaroni 3 cups of heavy cream 2 cups of grated Gruyère cheese 1 cup of grated sharp white cheddar 2 tablespoons of unsalted butter, melted ¼ teaspoon of ground nutmeg 1 ½ cups of fine fresh white breadcrumbs I doubled this recipe to make enough pasta for six people, and I should note that I didn't make my own breadcrumbs. I was cooking multiple Ina Garten dishes for Friendsgiving and, as Garten herself says, sometimes store-bought is fine! If you do want to make your own breadcrumbs, Garten's instructions are as follows: Remove the crusts from five slices of om your favorite wearable", "date_str": "2026-11-21T15:45:00+00:00", "hash": "002427efa684002d", "title_fa": "راه‌هایی که می‌توانید به عمر باتری Fitbit خود کمک کنید", "summary_fa": "Fitbits تا ابد دوام نمی‌آورند، اما چند راه آسان وجود دارد که می‌توانید از طریق پوشیدنی‌های مورد علاقه‌تان سال‌های بیشتر شمارش قدم‌ها و پایش ضربان قلب را دریافت کنید. Gado/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover هر Fitbit دارای عمر باتری درجه بندی شده است، معمولاً بین چهار تا 10 روز. آخرین Fitbit Edge (به بررسی Fitbit Edge ما مراجعه کنید) و Fitbit Air (به بررسی Fitbit Air ما مراجعه کنید) دارای رتبه بندی برای هر بار شارژ تا هفت روز هستند. برای اطمینان از دوام باتری تا حد امکان، همیشه از کابل شارژی که همراه دستگاه است استفاده کنید. اگرچه آنها شارژرهای اختصاصی هستند، اما می توانید جایگزین های شخص ثالث برای برخی از مدل ها پیدا کنید. اما به عنوان یک قاعده، اگر نسخه اصلی را گم کردید، جایگزینی را مستقیماً از گوگل یا آمازون خریداری کنید. خاموش کردن صفحه نمایش همیشه روشن به عمر باتری کمک می کند. با Charge 5 و 6، Inspire 3، Sense 2 و Versa 2 و 4، نمایشگر همیشه روشن به شدت عمر باتری را به تنها سه روز در هر بار شارژ کاهش می دهد. برای Edge، می‌تواند آن را تا دو روز کاهش دهد. همچنین باید روشنایی صفحه نمایش را در داخل خانه کم کنید، در صورت وجود دستگاه، مدت زمان کوتاه تری را انتخاب کنید و از استفاده از صفحه های ساعت متحرک که به باتری بیشتری نیاز دارند خودداری کنید. علاوه بر این، استفاده از GPS داخلی را در مدل هایی که از آن پشتیبانی می کنند محدود کنید، زیرا باتری را نیز به سرعت تخلیه می کند. شما فقط تا 10 ساعت با Fitbit Edge، پنج ساعت با Charge 4، 5، و 6، و 12 ساعت با Sense، Sense 2، Versa 3 و Versa 4 فرصت خواهید داشت. اگر Fitbit تنظیمات GPS قابل تنظیم", "image_url": "https://www.engadget.com/img/gallery/ways-you-can-help-your-fitbits-battery-last-longer/l-intro-1794855759.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۳۰ آبان • ۱۹:۱۵"}, {"source": "Engadget", "title": "The pros and cons of using a VPN over encrypted DNS", "link": "https://www.engadget.com/2317883/pros-cons-using-vpn-over-encrypted-dns/", "summary": "Explore the perks and drawbacks of choosing a VPN over encrypted DNS, from privacy and security to speed, costs, and control over your browsing habits.", "date_str": "2026-11-21T15:30:00+00:00", "hash": "88456b785c64a4f6", "title_fa": "مزایا و معایب استفاده از VPN روی DNS رمزگذاری شده", "summary_fa": "مزایا و معایب انتخاب VPN را بر روی DNS رمزگذاری شده، از حریم خصوصی و امنیت گرفته تا سرعت، هزینه ها و کنترل عادات مرور خود کاوش کنید. یک VPN بیشتر از پرس و جوهای DNS شما محافظت می کند، اما آیا ارزش هزینه اضافی را دارد؟ ما مبادلات را می سنجیم تا به شما در تصمیم گیری کمک کنیم. Nicoelnino/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover مهم نیست که چقدر به اینترنت سر و کار دارید، همیشه این امکان وجود دارد که امنیت یا حریم خصوصی شما به صورت آنلاین به خطر بیفتد. در حالی که ممکن است ایمن سازی 100 درصد مرور شما غیرممکن باشد، چند راه وجود دارد که می توانید بدون تلاش یا هزینه زیاد از خود محافظت کنید. دو گزینه موثر VPN و DNS رمزگذاری شده هستند که هر دو می توانند به روش های بسیار متفاوتی از شما محافظت کنند. هر کدام معایب خاص خود را نیز دارند، اما اگر بدانید به دنبال چه چیزی هستید، پیدا کردن موردی که برای شما بهتر کار می کند آسان است. در سطح پایه، DNS رمزگذاری شده به دیگران کمک می‌کند تا نبینند از کدام وب‌سایت‌ها بازدید می‌کنید، و VPN برای مخفی کردن آدرس IP شما و رمزگذاری ترافیک است، به همین دلیل است که بررسی اینکه آیا VPN شما کار می‌کند بسیار مهم است. اگر می‌خواهید به محتوایی دسترسی پیدا کنید که در کشور شما در دسترس نیست، یک VPN نیز می‌تواند مفید باشد. استفاده از هر کدام مزایای امنیتی دارد و مهمتر از همه، می توانید از آنها با هم استفاده کنید. اگر نگران این هستید که ISP خود یا هر شخص دیگری آنچه را که به صورت آنلاین انجام می‌دهید ببیند یا به اطلاعات خصوصی شما دسترسی پیدا کند، یک VPN معمولاً راه حلی است، اما ارزش دانستن نکات و جزئیات", "image_url": "https://www.engadget.com/img/gallery/the-pros-and-cons-of-using-a-vpn-over-encrypted-dns/l-intro-1794592469.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۳۰ آبان • ۱۹:۰۰"}, {"source": "Business Insider", "title": "An entrepreneur is transforming a Cold War-era nuclear silo into an underground data center. Take a look.", "link": "https://www.businessinsider.com/cold-war-nuclear-missile-silo-data-center-2026-4", "summary": "Halik s decommissioned nuclear silo is 165 feet deep. Nuclear Bunker Living/YouTube Entrepreneur Nik Halik bought a defunct nuclear missile silo in Colorado for over $10 million. The US government once used the facility to power, house, and potentially fire nuclear missiles. Halik plans to turn the 200,000-square-foot facility into a data center to power AI. A decommissioned nuclear silo near Denver that could once launch three 4.5-megaton nuclear missiles at a moment's notice is now an entrepreneur's pet project. Nik Halik, an Australian venture capitalist, purchased the decommissioned Cold War-era nuclear missile silo from the US government in 2021 for more than $10 million. For the past five years, Halik has been overseeing its transformation into a modern, renovated facility, where he plans to house an AI data center . After recent tech outages have prompted some people to stock up on generators and emergency kits , the underground facility in Colorado offers a closer look at Cold War-era infrastructure built to operate off the grid, as well as efforts to protect servers in ultra-secure facilities. The project is on brand for Halik, a self-described \"thrillionaire\" whose past endeavors have included skydiving over Mount Everest , training in Russia as a civilian cosmonaut, and diving 5 miles deep to the deck of the Titanic . He said his interest in these types of structures pairs with his vision for what they could become. \"I'm immersed in the world of castles and underground bunkers,\" Halik told Business Insider. \"I'm a value-facturer. I like things that I can add value to.\" Halik took Business Insider on a tour of the facility . See what it looks like inside the roughly 75-year-old nuclear silo. The facility was built in Colorado in 1959 for $47 million, or $350 million in today s dollars. Other Titan I silos like Halik s were built in Colorado. Carl Iwasaki/Getty Images At the beginning of the Cold War, the US began developing intercontinental ballistic missiles (ICBMs) at a rapid pace. Following the US' first operational ICBM , the SM-65 Atlas, the Titan I went under development in the mid-1950s. According to the National Park Service , the Titan I missiles were 98 feet tall and could deliver a nuclear warhead over 6,000 miles. Eighteen silos, like Halik's and the one pictured, were built across the US to house these missiles during the Cold War. Four large diesel engines powered the facility. Another Titan I silo near Denver. Thanks to diesel powe", "date_str": "2026-11-21T15:37:01+00:00", "hash": "ec46c4e0e8bbd02d", "title_fa": "یک کارآفرین در حال تبدیل یک سیلو هسته ای دوران جنگ سرد به یک مرکز داده زیرزمینی است. نگاهی بیندازید.", "summary_fa": "سیلوی هسته ای از کار افتاده هالیک 165 فوت عمق دارد. نیک هالیک، کارآفرین یوتیوب، یک سیلو موشک هسته ای منسوخ شده در کلرادو را به قیمت بیش از 10 میلیون دلار خریداری کرد. دولت ایالات متحده زمانی از این تاسیسات برای تامین انرژی، نگهداری و شلیک احتمالی موشک های هسته ای استفاده می کرد. هالیک قصد دارد این مرکز 200000 فوت مربعی را به یک مرکز داده برای تقویت هوش مصنوعی تبدیل کند. یک سیلو هسته‌ای از کار افتاده در نزدیکی دنور که زمانی می‌توانست سه موشک هسته‌ای 4.5 مگاتونی را در یک لحظه پرتاب کند، اکنون یک پروژه خانگی کارآفرین است. نیک هالیک، سرمایه‌دار استرالیایی، سیلو موشک هسته‌ای از رده خارج شده دوران جنگ سرد را در سال 2021 به قیمت بیش از 10 میلیون دلار از دولت ایالات متحده خریداری کرد. در پنج سال گذشته، هالیک بر تبدیل آن به یک مرکز مدرن و بازسازی شده نظارت داشته است، جایی که او قصد دارد یک مرکز داده هوش مصنوعی را در آن مستقر کند. پس از قطعی‌های اخیر فناوری که برخی از مردم را وادار کرد تا ژنراتورها و کیت‌های اضطراری را ذخیره کنند، تأسیسات زیرزمینی در کلرادو نگاهی دقیق‌تر به زیرساخت‌های دوران جنگ سرد که برای کار خارج از شبکه ساخته شده بود، و همچنین تلاش‌هایی برای محافظت از سرورها در تأسیسات فوق‌ایمن ارائه می‌دهد. این پروژه برای هالیک، یک «هیجان‌انگیز» که خود را «تریلیونر» توصیف می‌کند، طراحی شده است که تلاش‌های گذشته‌اش شامل چتربازی بر فراز قله اورست، آموزش در روسیه به عنوان یک فضانورد غیرنظامی، و غواصی در عمق 5 مایلی تا عرشه تایتانیک بوده است. او گفت که علاقه او به این نوع ساختارها با دیدگاه او در مورد آنچه که می توانند تبدیل شوند جفت می شود. هالیک به Business Insider گفت: «من در دنیای قلعه ها و پناهگاه های زیرزمینی غوطه", "image_url": "https://i.insider.com/69d7fc9696ef6a4c9d12164f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۳۰ آبان • ۱۹:۰۷"}, {"source": "Business Insider", "title": "The 9 biggest differences between the 'Sunrise on the Reaping' book and movie", "link": "https://www.businessinsider.com/hunger-games-sunrise-on-the-reaping-book-vs-movie-differences-2026-11", "summary": "Joseph Zada as Haymitch Abernathy in The Hunger Games: Sunrise on the Reaping. Murray Close/Lionsgate \"The Hunger Games: Sunrise on the Reaping\" is based on the novel by Suzanne Collins. The film stays true to the book, with a few noticeable exceptions. Maysilee's actions in the arena changed, and Plutarch Heavensbee played a larger role. \"The Hunger Games: Sunrise on the Reaping\" was released on Friday, bringing Haymitch Abernathy's Hunger Games to the big screen. Directed by Francis Lawrence , the film was a largely faithful adaptation of Suzanne Collins' 2025 \"Hunger Games\" prequel , \"Sunrise on the Reaping.\" It was no small feat to make the movie book-accurate, as the story features twice as many tributes sent into the Hunger Games arena and a slew of heartbreaking deaths that Haymitch, played by Joseph Zada, witnesses firsthand. However, Lawrence and his crew did make a few notable deviations from the original book in the movie, some of which had lasting implications for the larger \"Hunger Games\" universe. Check out nine of the biggest changes between the \"Sunrise on the Reaping\" book and movie. Spoilers ahead. The mockingjay pin only makes a blink-and-you ll-miss-it appearance. A Mockingjay pin from The Hunger Games. MediaNews Group/Bay Area News via Getty Images Any \"Hunger Games\" fan knows the mockingjay pin is a significant symbol in the series. In the books, Madge Undersee gives Katniss the pin to wear as her token in the arena, and as a result, Katniss comes to be synonymous with the mockingjay as a beacon for the rebellion. In \"Catching Fire,\" Katniss learns the pin originally belonged to Madge's aunt Maysilee Donner, who competed alongside Haymitch in the 50th Hunger Games. And in \"Sunrise on the Reaping,\" readers get even more context about the pin. According to the novel, Tam Amber, Lenore Dove's uncle, designed the pin as part of a set for Maysilee and her twin Merrilee for their 13th birthdays. Merrilee lost her hummingbird pin, while Maysilee refused to wear hers because she thinks there is \"something unnatural about a bird that's half-mutt,\" as she tells Haymitch. She says she will wear the pin if she makes it home from the Hunger Games after learning they're viewed as a symbol of resistance, though she's never given the chance. The pin's origin in the films has been different since \"The Hunger Games\" was released in 2012. Madge doesn't exist in the movie; instead, an older woman gives Katniss the pin at the Hob. The differentiation cont", "date_str": "2026-11-21T15:35:01+00:00", "hash": "170ad4c5476fc4c4", "title_fa": "9 تفاوت بزرگ بین کتاب و فیلم «طلوع خورشید در درو»", "summary_fa": "جوزف زادا در نقش هیمیچ آبرناتی در بازی های گرسنگی: طلوع خورشید در درو. موری کلوز/لاینزگیت «بازی‌های گرسنگی: طلوع آفتاب در درو» بر اساس رمانی از سوزان کالینز ساخته شده است. فیلم به جز چند استثنای قابل توجه به کتاب وفادار می ماند. اقدامات Maysilee در عرصه تغییر کرد و Plutarch Heavensbee نقش بزرگتری را ایفا کرد. «بازی‌های گرسنگی: طلوع آفتاب در درو» روز جمعه اکران شد و بازی‌های گرسنگی هیمیچ آبرناتی را به نمایش درآورد. این فیلم به کارگردانی فرانسیس لارنس اقتباسی وفادار از پیش درآمد سوزان کالینز در سال ۲۰۲۵ «بازی‌های گرسنگی»، «طلوع خورشید در درو» بود. این کار کوچکی نبود که کتاب فیلم را دقیق کرد، زیرا داستان دو برابر تعداد زیادی ادای احترام به بازی‌های گرسنگی و تعداد زیادی از مرگ‌های دلخراش است که هایمیچ با بازی جوزف زادا از نزدیک شاهد آن بود. با این حال، لارنس و خدمه اش چند انحراف قابل توجه از کتاب اصلی در فیلم داشتند که برخی از آنها پیامدهای ماندگاری برای جهان بزرگتر «بازی های گرسنگی» داشتند. ۹ مورد از بزرگترین تغییرات بین کتاب و فیلم «طلوع خورشید در درو» را بررسی کنید. اسپویلر در پیش است. پین mockingjay فقط یک چشمک می‌زند و شما آن را از دست خواهید داد. یک سنجاق مقلد از The Hunger Games. گروه MediaNews/ اخبار منطقه خلیج از طریق گتی ایماژ هر طرفدار «Hunger Games» می داند که سنجاق مقلد نماد مهمی در این مجموعه است. در کتاب‌ها، Madge Undersee سنجاقی را به کتنیس می‌دهد تا به عنوان نشانه‌اش در میدان بپوشد، و در نتیجه، Katniss مترادف با Mockingjay به عنوان چراغی برای شورش می‌شود. در «آتش گرفتن»، کتنیس متوجه می‌شود که سنجاق در اصل متعلق به عمه مایج می‌سیلی دانر بوده است که در کنار هیمیچ در پنجاهمین بازی‌های گرسنگی شرکت کرده است. و در «طلوع خورشید در درو»، خوانندگان زمینه‌های بیشتری", "image_url": "https://i.insider.com/6b00a255d6c5d341c9b4bb68?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۳۰ آبان • ۱۹:۰۵"}, {"source": "Business Insider", "title": "What Jensen Huang’s allies say they've told him since his resignation: 'Let's fight'", "link": "https://www.businessinsider.com/jensen-huang-nvidia-ceo-comeback-advice-allies-2026-11", "summary": "Jensen Huang is fielding calls and emails from tech CEOs as he games out a possible return to Nvidia. Jens Kalaene/picture alliance via Getty Images Jensen Huang is working the phones as he games out a return to Nvidia as CEO. A slew of tech CEOs say they've recently spoken to the 63-year-old chip mogul. Nvidia's board said it has no plans to reinstate Huang as CEO. As Jensen Huang games out a possible return to Nvidia as CEO, the 63-year-old chip mogul is turning to a pocket-sized lifeline: his phone. On the other end of the line are a series of tech CEOs, Nvidia employees, and President Donald Trump, who are offering kind words and positing avenues by which he could return to the helm . \"I have been telling Jensen that he needs to work out, watch the sunrise, and get eight hours of sleep,\" venture capitalist Gavin Baker said recently in an interview on CNBC. \"I think he has more to contribute to America, to AI, and technology.\" Huang resigned on November 12 in the wake of accusations that he had at least two affairs, one with a Chinese executive that US intelligence says is spying for Beijing and another with a direct report at Nvidia. Huang has since indicated an interest in returning as CEO. In a lengthy X post five days after he resigned, Huang said he's seen an \"outpouring of calls from NVIDIA's employees, investors, business partners, and customers for me to return as CEO.\" \"Many continue to reach out to me directly,\" he added. Nvidia's board, however, has said that it has no plans to reinstate the founder, who wrote in a note to staff that he had been \"unfaithful\" to his wife, Lori Huang. Here's what some influential people say they told Huang. President Donald Trump President Trump said he called Huang to ask how he s doing. Kent NISHIMURA / AFP via Getty Images Trump says he called Jensen Huang at least twice since news of his affairs broke. In a White House press conference three days before Huang resigned, Trump said he'd called Huang that day \"just to see if he's feeling all right.\" Trump said he asked Huang whether he knew that Alice Huang (no relation), the former CEO of Megaspeed and his alleged paramour, was a spy for China. Trump said Huang said he didn't know. Then, in an interview with Stephen A. Smith, Trump said Huang called him at a separate time, telling the president that he feels bad for what he's done to his family. The New York Times reported that in one of those calls, Trump urged Huang to fight to keep his job. Travis Kalanick", "date_str": "2026-11-21T15:31:41+00:00", "hash": "b02ba50d945dc87a", "title_fa": "آنچه که متحدان جنسن هوانگ می گویند از زمان استعفا به او گفته اند: \"بیا بجنگیم\"", "summary_fa": "جنسن هوانگ در حال بررسی تماس‌ها و ایمیل‌های مدیران عامل فناوری است تا احتمال بازگشت به انویدیا را مشخص کند. Jens Kalaene/تصویر اتحاد از طریق Getty Images جنسن هوانگ در حال کار بر روی تلفن‌های همراه با بازگشت به Nvidia به عنوان مدیرعامل است. تعدادی از مدیران عامل فناوری می گویند اخیراً با غول تراشه 63 ساله صحبت کرده اند. هیئت مدیره انویدیا اعلام کرد که هیچ برنامه ای برای بازگرداندن هوانگ به عنوان مدیرعامل ندارد. در حالی که جنسن هوانگ بازگشت احتمالی به انویدیا را به عنوان مدیر عامل بازی می کند، این غول تراشه 63 ساله به یک راه نجات جیبی روی می آورد: تلفن خود. در آن سوی خط، مجموعه‌ای از مدیران عامل فناوری، کارمندان انویدیا و رئیس‌جمهور دونالد ترامپ قرار دارند که سخنان محبت آمیزی ارائه می‌کنند و راه‌هایی را برای بازگشت او به سکان هدایت می‌گویند. گاوین بیکر، سرمایه‌گذار خطرپذیر اخیراً در مصاحبه‌ای با CNBC گفت: «من به جنسن گفته‌ام که او باید ورزش کند، طلوع خورشید را تماشا کند و هشت ساعت بخوابد. فکر می‌کنم او باید بیشتر به آمریکا، هوش مصنوعی و فناوری کمک کند.» هوانگ در 12 نوامبر در پی اتهاماتی مبنی بر داشتن حداقل دو رابطه استعفا داد، یکی با یک مدیر اجرایی چینی که اطلاعات ایالات متحده می گوید برای پکن جاسوسی می کند و دیگری با گزارش مستقیم در Nvidia. هوانگ از آن زمان علاقه خود را به بازگشت به عنوان مدیرعامل نشان داده است. در یک پست طولانی X پنج روز پس از استعفای خود، هوانگ گفت که او شاهد \"تماس‌هایی از سوی کارمندان، سرمایه‌گذاران، شرکای تجاری و مشتریان NVIDIA برای بازگشت من به عنوان مدیرعامل بوده است.\" او افزود: «بسیاری همچنان مستقیماً با من تماس می گیرند. هیئت مدیره انویدیا، با این حال، گفته است که هیچ برنامه ای برای بازگرداندن بنیانگذار، که در یادداشتی به کارکنان", "image_url": "https://i.insider.com/6b0070d50b69407d788a4f10?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه"], "datetime_fa": "۳۰ آبان • ۱۹:۰۱"}, {"source": "Business Insider", "title": "Redwood Materials found a very practical use for AI: Sorting old batteries", "link": "https://www.businessinsider.com/redwood-materials-ai-battery-sorting-recycling-2026-11", "summary": "A Redwood Materials battery-sorting system. Redwood Materials A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . Recycling batteries sounds like a great idea. Until you realize someone has to sort through mountains of them first. It's a tricky job. Batteries come in all shapes and sizes, with different chemical ingredients . Mixing up the wrong ones can make recycling less efficient and more expensive. Enter AI . Redwood Materials , the battery recycling startup founded by Tesla cofounder JB Straubel, has built an automated sorting system that can identify batteries with more than 98% accuracy, according to the company. Here's how it works. Old batteries arrive in a jumble of boxes and bins. Machines separate them into a single-file line. Each battery then passes through a tunnel equipped with cameras and sensors that examine its label, shape, and weight. AI figures out what kind of battery it is and sends it to the right place for recycling. Redwood developed an AI model for this, trained on the company's voluminous battery data, and it runs on a cluster of GPUs on site. The system was built in just a few months and can handle several tons of batteries an hour. Why does this matter? Redwood wants to recover valuable materials such as lithium, nickel, and cobalt, rather than relying so heavily on mining and imports. This is a neat example of AI tackling a messy, unglamorous industrial problem. And potentially making American manufacturing more competitive. Sign up for the AI Insider newsletter here . Reach out to یز، برخی از دسته‌بندی‌های محصولات فناوری وجود دارد که باید از آنها صرفنظر کنید و جدید (یا شاید بازسازی شده) خریداری کنید. به‌علاوه، برخی از این دستگاه‌ها نگرانی‌های بهداشتی را افزایش می‌دهند، مانند هدفون‌ها و سایر پوشیدنی‌ها، در حالی که برخی از دسته‌های دستگاه‌ها مانند هارد دیسک‌ها و بانک‌های باتری با افزایش سن یا استفاده، قابلیت اطمینان خود را از دست می‌دهند. بنابراین دفعه بعد که در یک فروشگاه ساده خرید می‌کنید یا در یک صفحه آگهی‌های محلی به صورت آنلاین مرور می‌کنید، سراغ هیچ یک از این محصولات نروید. همچنین ارزش این را دارد که قبل از اینکه خودتان هر فناوری مورد استفاده را برای فروش فهرست کنید، این نکات را در نظر داشته باشید. Gorodenkoff/Getty Images این احتمالاً اولین دسته ای است که وقتی به چیزی فکر می کنید که نمی خواهید بعد از شخص دیگری از آن استفاده کنید، به ذهنتان خطور می کند. هدفون ها تا حد", "image_url": "https://www.engadget.com/img/gallery/5-gadgets-you-should-never-buy-used/l-intro-1794851054.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۳۰ آبان • ۱۸:۱۵"}, {"source": "Business Insider", "title": "I'm a real estate developer selling a $30 million mansion, and here’s why I’d accept Anthropic shares instead of cash", "link": "https://www.businessinsider.com/thirty-million-la-mansion-accepts-anthropic-shares-as-payment-2026-11", "summary": "Phillip Braunstein, a developer in LA, is willing to trade his $29,995,000 mansion for shares of OpenAI or Anthropic. Courtesy of Carolwood Estates Phillip Braunstein is willing to trade his $29,995,000 mansion for shares of OpenAI or Anthropic. The LA developer says a sluggish LA luxury market and his AI optimism prompted the offer. Braunstein says he believes that AI shares could multiply in value over time. This as-told-to essay is based on a conversation with Phillip Braunstein, president of Colossal Properties and owner of the home at 1210 Chickory Lane in the Brentwood neighborhood of Los Angeles. The property is listed for $29,995,000 and accepts shares from OpenAI and Anthropic as payment. The conversation has been edited for length and clarity. I've been in construction and real estate development for almost 15 years, and I've also become increasingly involved in tech investing . I started building this house in Brentwood in 2021. It's an architectural modern residence with almost four stories, including a basement and a rooftop deck with views of the Pacific Ocean, downtown Los Angeles, and the Getty Museum. I've put a lot into the property. But when I put it on the market, I also started thinking about what else I might accept as payment. I'm a big believer in AI, and I thought: If somebody has a significant amount of equity in OpenAI or Anthropic, why not consider trading the house for that? Why I'm open to AI shares The Los Angeles luxury property market has been sluggish, as many who could afford such properties are deterred by the mansion tax. Courtesy of Carolwood Estates I started using AI heavily in 2023, initially for personal applications. Then I got deeper into it and started building an actual stock-trading algorithm with a friend and neighbor who was formerly the director of Applied AI at Google. At the same time, my friends and I were talking about getting investment stakes in AI companies . Meanwhile, the Los Angeles real estate market was very soft. The mansion tax had been introduced, and there was also uncertainty around a proposed billionaire tax in California. There were a lot of questions about whether people with the net worth to buy a property at this price point would want to remain in Los Angeles. So I thought, you know what? If someone has a lot of equity in OpenAI or Anthropic , I'd be happy to take it. As someone who uses AI heavily, I really believe in the technology. I wanted to let the marketplace know that if someo", "date_str": "2026-11-21T14:00:01+00:00", "hash": "64c02ecf6f4db362", "title_fa": "من یک توسعه دهنده املاک و مستغلات هستم که یک عمارت 30 میلیون دلاری می فروشم، و به همین دلیل است که به جای پول نقد، سهام آنتروپیک را می پذیرم.", "summary_fa": "فیلیپ براونشتاین، یک توسعه دهنده در لس آنجلس، مایل است عمارت 29,995,000 دلاری خود را با سهام OpenAI یا Anthropic معامله کند. فیلیپ براونشتاین با حسن نیت از Carolwood Estates مایل است عمارت 29,995,000 دلاری خود را با سهام OpenAI یا Anthropic معامله کند. توسعه‌دهنده لس‌آنجلس می‌گوید که بازار لوکس LA و خوش‌بینی هوش مصنوعی او باعث این پیشنهاد شده است. براونشتاین می گوید که او معتقد است که ارزش سهام هوش مصنوعی در طول زمان می تواند چند برابر شود. این مقاله گفته شده بر اساس گفتگو با فیلیپ براونشتاین، رئیس کلوسال پرپرتیز و صاحب خانه در 1210 Chickory Lane در محله برنت وود لس آنجلس است. این دارایی به قیمت 29,995,000 دلار فهرست شده است و سهام OpenAI و Anthropic را به عنوان پرداخت می پذیرد. گفتگو برای طولانی بودن و وضوح ویرایش شده است. من تقریباً 15 سال است که در ساخت و ساز و توسعه املاک و مستغلات بوده ام و همچنین به طور فزاینده ای درگیر سرمایه گذاری در فناوری شده ام. ساختن این خانه را در برنت‌وود در سال 2021 آغاز کردم. این یک اقامتگاه مدرن با معماری تقریباً چهار طبقه است، شامل یک زیرزمین و یک عرشه روی پشت بام با چشم‌اندازی از اقیانوس آرام، مرکز شهر لس‌آنجلس، و موزه گتی. من مقدار زیادی برای ملک گذاشته ام. اما وقتی آن را به بازار عرضه کردم، به این فکر کردم که چه چیز دیگری را می توانم به عنوان پرداخت بپذیرم. من به هوش مصنوعی اعتقاد زیادی دارم و فکر کردم: اگر کسی مقدار قابل توجهی از سهام در OpenAI یا Anthropic دارد، چرا خانه را برای آن معامله نکنیم؟ چرا من برای سهام هوش مصنوعی باز هستم بازار املاک لوکس لس آنجلس کساد بوده است، زیرا بسیاری از کسانی که می توانند چنین املاکی را بخرند با مالیات عمارت منصرف شده اند.", "image_url": "https://i.insider.com/6b00a1990b69407d788a51be?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Google"], "datetime_fa": "۳۰ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I've bought Amtrak's USA Rail Pass 4 times. There are huge perks to using the $499 pass, and a few frustrations.", "link": "https://www.businessinsider.com/amtrak-usa-rail-pass-pros-cons-according-to-frequent-traveler-2026-7", "summary": "I ve bought the Amtrak USA Rail Pass four times. Malia Yoshioka Over the past year and a half, I've purchased Amtrak's $499 USA Rail Pass four times. The pass, which allows me to book 10 train tickets in 30 days, is a great way to see the country. However, delays can throw off my entire itinerary, and I can't book a roomette using the pass. Over the past year and a half, I've traveled through most of the continental US by train. One way I've kept costs down is by taking advantage of Amtrak's $499 USA Rail Pass , which allows 10 train segments — or tickets — within a 30-day period. I've now purchased the pass four times, often combining trips to visit friends, attend conferences, and explore destinations I might otherwise overlook. Although there are definite frustrations with planning and managing a Rail Pass trip, the perks still outweigh the downsides, in my opinion. The pass makes it easy to explore the country. zrfphoto/Getty Images One of my favorite ways to use the pass is to add stops to existing trips. For example, I needed to travel from Chicago to Florida to see my mother for Mother's Day, which already would've cost more than $200 round-trip if I purchased individual train tickets. Flights were similarly priced as well, so I opted to use a Rail Pass and tack on a few extra stops along the way. During the trip, I traveled to Holland, Michigan, for the annual Tulip Time festival, rerouted through Washington, DC, just in time to make the peak blooms of cherry blossom season , and spent 24 hours in Savannah visiting with a friend. The stops really added to the experience and were things I wouldn't have experienced had I flown or bought a single Amtrak ticket. When my train has a Sightseer Lounge, I take full advantage of the views. Malia Yoshioka It's not available on every train, but when it is, I love spending time in the Sightseer Lounge , a spacious public car with panoramic windows to take in the views. Th ب اسفنجی است»", "summary_fa": "در دنیایی که به طور فزاینده ای بازه های توجه کوتاه، افت رسانه های اجتماعی و چرخش مغزی در حال سقوط است، جای تعجب است که چرا بسیاری از برنامه های تلویزیونی در دوره استریم طولانی تر شدند. به عنوان مثال، سیتکام پخش 22 دقیقه ای تا حد زیادی با درامدی 30 دقیقه ای جایگزین شد و رویه 43 دقیقه ای تحت الشعاع مجموعه درام پریمیوم یک ساعته قرار گرفت. با این حال، نتفلیکس [ ] نتفلیکس با مفهومی بسیار کوتاهتر در حداقل دستمزد به موفقیت دست یافته است. این مجموعه کمدی که از جرمی گارلیک و ویل فلپس ساخته می‌شود، شامل 14 قسمت بین 12 تا 20 دقیقه در قسمت اول آن است که در پایان اکتبر عرضه شد. در یک پیتزا مشترک و با بازی SNL عزیز، گریس ریتر، آیدان میچو، هاید هیلی، جولیا دایسزار، لوک برک، رایان میچو، تامی آرمسترانگ و رندال پارک، اپیزودهای کوتاه آن یک ویژگی هستند، نه یک اشکال. فلپس به ددلاین گفت: «آینده این قسمت‌های 15 دقیقه‌ای باب اسفنجی است که واقعاً سریع است. هیچ چربی وجود ندارد.» در واقع، نتفلیکس اپیزودهای کوتاهی را برای این نمایش درخواست کرد، که زندگی خود را با مجموعه‌ای از طرح‌های یوتیوب آغاز کرد که در نیمه‌های شب با کارآموزان به عنوان اپراتورهای دوربین و یک مدیر ساختمان که میکروفون پررونق را مدیریت می‌کرد، شروع شد. گارلیک گفت: \"وقتی قرارداد را بسته‌ایم، [نت‌فلیکس] گفت که می‌خواهند حداقل 12 و نیم دقیقه باشد. چالش جالبی بود زیرا اکثر برنامه‌های تلویزیونی اپیزودیک 22 تا 30 صفحه‌اند. تقریباً مثل این بود که در حال اختراع ساختار جدیدی بودیم و سخت بود.\" اپیزودها نیز 20 دقیقه بود و فیلمنامه‌های تصویربرداری حدود 15 صفحه بودند و بازیگران تشویق به بهبود شدند. فلپس افزود: \"شما می توانید به خوبی مخاطب را برای 15 دقیقه مجذوب خود کنید.\" جرمی و من از فیلمنامه‌نویسی سنتی", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Minimum_Wage_n_S1_00_04_13_18.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۳۰ آبان • ۲۲:۳۶"}, {"source": "Variety", "title": "How the ‘Elsinore’ Makeup Team Transformed Stars Andrew Scott and Olivia Colman to Bring the Story of Ian Charleson to Life", "link": "https://variety.com/2026/artisans/news/elsinore-makeup-olivia-colman-andrew-scott-1236954968/", "summary": "In “Elsinore,” Andrew Scott plays real-life actor Ian Charleson, who performed his final role while dying of AIDS. Written by Stephen Beresford, “Elsinore” follows the deeply emotional and inspirational true story of Charleson as he confronts his mortality with courage, honesty and wit. On Nov. 13, 1989, Charleson walked onto the stage at London’s National [ ]", "date_str": "2026-11-21T19:09:40+00:00", "hash": "b72b39e428ad0dd9", "title_fa": "چگونه تیم آرایش «السینور» ستاره‌های اندرو اسکات و اولیویا کولمن را متحول کردند تا داستان ایان چارلسون را زنده کنند.", "summary_fa": "اندرو اسکات در «السینور» نقش بازیگر واقعی زندگی را ایان چارلسون بازی می‌کند که آخرین نقش خود را هنگام مرگ بر اثر ایدز بازی کرد. «السینور» که توسط استفن برسفورد نوشته شده است، داستان واقعی عمیقاً احساسی و الهام‌بخش چارلسون را دنبال می‌کند که او با شجاعت، صداقت و شوخ طبعی با مرگش روبرو می‌شود. در 13 نوامبر 1989، چارلسون به روی صحنه تئاتر ملی لندن رفت [ ] در «السینور»، اندرو اسکات نقش بازیگر واقعی زندگی را ایان چارلسون بازی می کند که آخرین نقش خود را هنگام مرگ بر اثر ایدز ایفا کرد. این فیلم زندگی‌نامه‌ای (در حال حاضر در سینماها) اسکات را با اولیویا کولمن که قبلاً در کنار او در «فلی‌بگ» بازی کرده بود، پیوند می‌دهد. این بار، پیوند آنها خاص است زیرا کولمن در نقش مارگارت جانسون، دکتری که چارلسون را درمان می کند، بازی می کند. برای «السینور»، هر دو بازیگر نیاز داشتند تا خود را تبدیل کنند - نه تنها به افراد واقعی که آنها را به تصویر می‌کشیدند، بلکه به دهه 1980 نیز برمی‌گشتند. اینجاست که نادیا استیسی، رئیس بخش آرایش نقش کلیدی ایفا کرد. استیسی که ماه گذشته در جشنواره فیلم میدلبورگ مورد تجلیل قرار گرفت، در مورد کار و رویکرد خود به فیلم صحبت کرد و توضیح داد که \"وقتی افراد واقعی وجود دارند، باید با آنها همدردی کنید.\" استیسی دهه 80 را به عنوان دوره ای دشوار برای بازسازی توصیف کرد، با توجه به اینکه به راحتی می تواند کلیشه ای شود. او گفت: \"شما فوراً تصور می کنید که همه مجوز دارند.\" \"رویکرد من هر بار این است که شما نباید به آرایش مو و آرایش توجه کنید، مگر اینکه واقعاً بخواهید به آرایش مو و آرایش توجه کنید. داستان خودش گفت. من فقط باید سفر او را تعریف کنم و ما را در دوره ای قرار دهم", "image_url": "https://variety.com/wp-content/uploads/2026/11/elsinore-E_03084_R_rgb.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۳۰ آبان • ۲۲:۳۹"}, {"source": "Hollywood Reporter", "title": "Hollywood’s Biggest Watch Nerds Are Obsessing Over These Indie Brands", "link": "https://www.hollywoodreporter.com/lifestyle/style/indie-watch-brands-hollywood-1236760300/", "summary": "From Keanu Reeves to Samuel L. Jackson to Ryan Reynolds, in-the-know insiders favor niche watchmakers that surprise and spark conversations.", "date_str": "2026-11-21T19:00:00+00:00", "hash": "2211b28b7e1994ee", "title_fa": "بزرگ‌ترین نردهای ساعت‌های هالیوود به این برندهای مستقل وسواس دارند", "summary_fa": "از کیانو ریوز گرفته تا ساموئل ال. جکسون تا رایان رینولدز، افراد آگاه به ساعت‌سازانی علاقه‌مند هستند که باعث تعجب و جرقه گفتگو می‌شوند. ساعت ساز Denis Flageollet De Bethune را در سال 2002 با مجموعه دار هنری دیوید زانتا تأسیس کرد. DB25 Digitale زمان دیجیتال را مجدداً تصور می کند، با ساعت نمایش داده شده به صورت جداگانه در بالای دقیقه بر روی یک دیسک چرخان، در حالی که یک تابع کروی فاز ماه در مرکز صفحه ای قرار دارد که از تیتانیوم آبی ساخته شده است، که همه در یک محفظه تیتانیوم 42 میلی متری تنظیم شده است. در شرکت 1916، ساحل منهتن. ساعت‌ساز فلیکس باومگارتنر و طراح اصلی مارتین فری در سال 1997 شرکت Urwerk را تأسیس کردند و نام برند را برای شهر بین‌النهرین اور، جایی که سومری‌ها در زمان‌سنجی پیشگام بودند، نامیدند. UR-300 Time Quantum یک رویکرد مجسمه‌سازی به زمان از طریق یک قاب فلزی T شکل به کار می‌گیرد که اعداد روی آن می‌چرخند و مرتب می‌شوند تا ساعت‌ها و دقیقه‌ها را نمایش دهند. در Urwerk ایالات متحده آمریکا، بورلی هیلز. داستان‌های مرتبط تلویزیون ملانیا ترامپ بر تلاش‌های بشردوستانه در اولین نمایش شیک برای فیلم‌های مستند دنباله‌دار سریال دو قسمتی تاکید می‌کند فلورانس پیو جشن بازیگری باند رابرت پتینسون: او رای شماره 1 در arn made the comment while wearing a red beret and military-style jacket, an image that fit the occasion: Mexico’s Revolution Day, observed every Nov. 20 to mark the start of the 1910 armed uprising against Porfirio Díaz, who had been in power for more than 30 years. Trueno and Gorillaz s Damon Albarn perform at Corona Capital on Friday (Nov. 20). Credit: Liliana Estrada LILIANA ESTRADA Earlier in the set, Johnny Marr joined the band for “The Empty Dream Machine” and “Casablanca ; he played on the studio versions of both on Gorillaz’s The Mountain (2026). He also performed “The Plastic Guru” and “The Sweet Prince,” which also appear on the album. Trueno, meanwhile, joined the collective — formed 28 years ago by Albarn, former frontman of Blur, and illustrator Jamie Hewlett — for “THE MANIFESTO,” their collaboration from The Mountain . He also freestyled during “Clint Eastwood,” the song that closed the set. When Trueno shouted “ ¡Viva México, cabrones! ” during “Clint Eastwood,” Albarn burst out laughing and kept singing offbeat as he tried to hold it together. Trueno also used the stage to hype up his favorite soccer team, Club Atlético Boca Juniors, proudly wearing the club’s blue-and-gold jersey. Mexican singer Luisa Almaguer was another special guest, joining Gorillaz for “Latin Simone (¿Qué Pasa Contigo?),” the 2001 song originally sung by the late Cuban star Ibrahim Ferrer for the band’s self-titled debut album. Her appearance mad", "date_str": "2026-11-21T18:46:58+00:00", "hash": "ae306d31d21d6362", "title_fa": "گوریلاز «روح انقلابی» مکزیک را در Corona Capital جشن می‌گیرد، جانی مار و ترئونو را بیرون می‌آورد.", "summary_fa": "گوریلاز روز جمعه (20 نوامبر) برای اولین بار در هشت سال گذشته به مکزیکوسیتی بازگشت و روز افتتاحیه Corona Capital را عنوان کرد. در طول برنامه مورد انتظار، دیمون آلبارن، خواننده، «روح انقلابی» کشور را تحسین کرد. گیتاریست جانی مار و رپر آرژانتینی Trueno به عنوان مهمان ویژه به گروه ملحق شدند - و آلبارن نیز به کلودیا شینبام رئیس جمهور مکزیک فری les, six new floats and more than 11,000 volunteers and participants for its milestone march. Erika Ender Celebrates 35-Year Career in Panama Panamanian singer-songwriter Erika Ender celebrated her 35-year musical career in Panama with the premiere of a musical based on her life and the presentation of her book, AprEnder El Éxito , which is currently available for pre-order. The musical Erika Ender — written and directed by Venezuelan playwright Benjamín Cohen and featuring a cast of approximately 80 performers — held its grand international premiere on Thursday (Nov. 19) at the National Theater in Panama City. In addition to Ender and her family, the event was attended by prominent figures from the music and entertainment industries, including Desmond Child, Elena Rose, Elvis Crespo, Aymée Nuviola and Diana Reyes, as well as Panamanian boxing legend Roberto Durán. Also in attendance was Randy Cuevas, of the band Rabanes, who was responsible for the musical arrangements for the production. Before the show began, Ender was presented with a medal in recognition of merit and an exceptional artistic career by Panama’s Minister of Culture, Maruja Herrera. The award is a new annual honor designed to celebrate individuals who, through their personal example and artistic work, make an extraordinary contribution to Panama’s cultural enrichment and international profile. The following morning, at the same venue, the book was presented during an event moderated by media personality Ismael Cala. SIGAL RATNER", "date_str": "2026-11-21T15:00:00+00:00", "hash": "e154554c30689019", "title_fa": "فید، آنتونی راموس و دیگران برای پیوستن به صدمین رژه روز شکرگزاری میسی و لحظات نشاط‌آور بیشتر در موسیقی لاتین", "summary_fa": "ویراستاران بیلبورد از نقاط عطف شغلی گرفته تا انتشار موسیقی جدید تا اطلاعیه های مهم و آن لحظات مهم کوچک، لحظات نشاط آور در موسیقی لاتین را برجسته می کنند. این چیزی است که این هفته در دنیای موسیقی لاتین اتفاق افتاد. فید و آنتونی راموس به صدمین نسخه رژه روز شکرگزاری میسی //news.recart.ir/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
