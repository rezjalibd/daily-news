niversal Music Group تماس با درآمد Q3 نوامبر 2026 2-8 نوامبر 2-8 نوامبر جشنواره"}, {"source": "Billboard", "title": "Mark Pucci, Veteran Music Publicist & Recognized Blues Advocate, Dies at 79", "link": "https://www.billboard.com/pro/mark-pucci-death-publicist-lynyrd-skynyrd-johnny-cash-dead/", "summary": "Mark Pucci , a veteran music industry publicist and passionate blues advocate who worked with artists ranging from The Allman Brothers Band to Kenny Chesney over a five-decade career, has died at age 79. During two separate stints at Capricorn Records, Pucci helped lead PR efforts for a who s-who of Southern rock legends including The Allman Brothers Band, The Marshall Tucker Band and Lynyrd Skynyrd. He later founded the Atlanta-based firm Mark Pucci Media, where he represented stars like Johnny Cash, Roy Orbison and Carl Perkins, while simultaneously working to sustain and preserve the legacy of the blues music he loved. For his efforts on the latter front, in 2008, he was honored with the Keeping Blues Alive Award from the Blues Foundation in Memphis, Tenn. Related Gone But Not Forgotten: Musicians We Lost in 2026 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit Pucci began working at Capricorn — which was at the forefront of the Southern rock explosion of the mid-1970s — as publicity director before later moving up to vp of publicity and general manager. During those years, he was also hired to work on Jimmy Carter s 1976 presidential campaign, handling PR and promoting benefit concerts designed to bolster Carter s national profile and fill his campaign coffers. As founder and owner of Mark Pucci Media, his client list was stacked with music icons. In addition to Cash, Orbison and Perkins, he represented such names as John Mayall, Taj Mahal, Gordon Lightfoot, Derek Trucks, The Fabulous Thunderbirds, Charlie Musselwhite and Delbert McClinton. Pucci was predeceased by his wife Patricia Powers Pucci; parents Anna and James Pucci; brothers Joseph and James Pucci; sisters Dolores Kenna and Carol Dinkowitz; brother-in-law Pete Dinkowitz; and niece Susan Iversen. He is survived by sister-in-law Gertrude Pucci, niece Diana Nunno (John), niece Tina Hulsman (Chris), nephew Peter Dinkowitze (Wendy) and several more nieces and nephews. He also left behind office assistant and friend Karin Johnson, The Renteral family, his Blues family, the lunch bunch crew and his cat, Elvis. Memorial services will be hold on Oct. 28 from 10am to noon and 6 pm to 9 pm at South Care Cremation Funeral Society in Alpharetta, Ga. Gifts in honor of Pucci can be made to Lifeline Animal Project at www.lifelineanimal.org .", "date_str": "2026-10-16T23:12:14+00:00", "hash": "d824aaa86a6de254", "title_fa": "مارک پوچی، روزنامه‌نگار پیشکسوت موسیقی و مدافع شناخته‌شده بلوز، در ۷۹ سالگی درگذشت.", "summary_fa": "مارک پوچی، تبلیغ نویس کهنه کار صنعت موسیقی و طرفدار پرشور بلوز که در طول پنج دهه فعالیت حرفه ای با هنرمندانی از گروه برادران آلمن تا کنی چسنی کار می کرد، در سن 79 سالگی درگذشت. در طی دو دوره جداگانه در Capricorn Records، پوچی به رهبری تلاش های روابط عمومی برای گروهی از راک های جنوبی، از جمله گروه راک، همه گروه های راک توو، کمک کرد. گروه و Lynyrd Skynyrd. او بعداً شرکت Mark Pucci Media مستقر در آتلانتا را تأسیس کرد، جایی که او نماینده ستارگانی مانند جانی کش، روی اوربیسون و کارل پرکینز بود، در حالی که به طور همزمان برای حفظ و حفظ میراث موسیقی بلوز مورد علاقه خود تلاش می کرد. به خاطر تلاش‌هایش در جبهه دوم، در سال 2008، او مفتخر به دریافت جایزه زنده نگه داشتن بلوز از بنیاد بلوز در ممفیس، تن شد. مطالب مرتبط رفته اما فراموش نشده است: نوازندگانی که در سال 2026 از دست دادیم، دیدی از زندان نیوجرسی به مکان مشابهی در پنسیلوانیا ویزر نقل مکان کرد تا جایزه Legend of Live را در اجلاس موسیقی زنده بیلبورد در سال 2026 دریافت کند. بعداً به سمت معاون تبلیغات و مدیر کل ارتقا یافت. در آن سال‌ها، او همچنین برای کار در کمپین ریاست‌جمهوری جیمی کارتر در سال 1976، مدیریت روابط عمومی و ترویج کنسرت‌های سودمند که برای تقویت نمایه ملی کارتر و پر کردن خزانه‌های مبارزات انتخاباتی‌اش طراحی شده بودند، استخدام شد. به عنوان بنیانگذار و مالک رسانه مارک پوچی، لیست مشتریان او با نمادهای موسیقی انباشته شده بود. او علاوه بر کش، اوربیسون و پرکینز، نام‌هایی چون جان مایال، تاج محل، گوردون لایت‌فوت، درک تراکس، تاندربردز افسانه‌ای، چارلی ماسلوایت و دلبرت مک‌کلینتون را بر عهده داشت. پوچی توسط همسرش پاتریشیا پاورز پوچی از دنیا رفت. والدین آنا و جیمز پوچی؛ برادران جوزف و جیمز پوچی؛"}, {"source": "Billboard", "title": "Drake Sued Over ‘Janice STFU’: Songwriter Claims Chorus Is ‘Literally Identical’ to His Demo", "link": "https://www.billboard.com/pro/drake-janice-stfu-lawsuit-songwriter-sues-copied-demo/", "summary": "Drake is accused in a new lawsuit of “shamelessly” using a songwriter’s demo without credit or compensation for the hook of his chart-topping Iceman single “Janice STFU.” The Friday (Oct. 16) legal complaint, filed by Gregory Korn and Jonathan Steinsapir of Kinsella Holley Iser Kump Steinsapir and first obtained and reported by Billboard , alleges that the chorus of Drake’s May mega-hit is “literally identical” to a demo sent by composer Aviel Calev Hirschfield to Drake’s team at the beginning of 2026. “Janice STFU” spent two weeks atop the Billboard Hot 100 and spent 20 weeks at No. 1 on Billboard s Hot Rap Songs tally, his longest-running reign on that chart. Drake s team said in a Friday statement to Billboard , Let us be absolutely clear: These allegations are categorically, unequivocally and completely denied. There is not one iota of truth to these accusations, and we reject every attempt to portray these claims as established facts. Related ‘Janice STFU’ Is Now Drake’s Longest-Leading No. 1 on Hot Rap Songs Chart Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit Hirschfield claims he wrote the demo in December 2025 and January 2026 over an audio bed he’d received from producer duo Michael “Finatik” Mulé and Isaac “Zac” De Boni (known as FNZ), frequent Drake collaborators. Hirschfield interpolated the 2011 Lykke Li track “I Follow Rivers” and says he specifically wrote the song for Drake, with whom he’d previously been listed as a co-writer on the 2022 Beyoncé track “Heated.” According to the lawsuit, Hirschfield sent his finished demo to FNZ and other producers who worked with Drake, but never got a reply. He first heard “Janice STFU” when Iceman came out on streaming. “Fifteen seconds in, Avi was stunned to hear Drake perform word-for-word, note-for-note, beat-by-beat, the exact same chorus that he (Avi) had recorded and sent,” reads the complaint. FNZ are credited as co-writers on “Janice STFU,” which also interpolates “I Follow Rivers.” Hirschfield says the song’s hook is “literally identical” to both the melody and lyrics from his demo, which features the lines: “Reach me, baby/ Call my phone and say you need me, baby/ I’m so green, you gotta teach me, baby/ From Vancouver, you a BC, baby/ Pull up Maybach, beep beep, baby/ And my shit came with the heat seats, baby/ Swear my label gotta free me, baby/ Blow on me just like some green tea, baby.” Since ", "date_str": "2026-10-16T22:05:19+00:00", "hash": "fee580041e2e66ca", "title_fa": "دریک به خاطر «جانیس STFU» شکایت کرد: ترانه‌سرا ادعا می‌کند که گروه کر «به معنای واقعی کلمه شبیه به نسخه نمایشی» او است", "summary_fa": "دریک در یک شکایت جدید متهم به استفاده \"بی شرمانه\" از دمو یک ترانه سرا بدون اعتبار یا غرامت برای قلاب تک آهنگ Iceman خود \"Janice STFU\" است که در صدر جدول قرار گرفته است. جمعه (اکتبر 16) شکایت حقوقی که توسط گریگوری کورن و جاناتان استاینساپیر از Kinsella Holley Iser Kump Steinsapir ارائه شد و برای اولین بار توسط بیلبورد به دست آمد و گزارش شد، ادعا می‌کند که گروه کر هیت فوق‌العاده دریک در ماه مه «به معنای واقعی کلمه شبیه به دمویی است که توسط آهنگساز آویل به تیم دروکفیلد در ابتدای 2060 فرستاده شده است. \"جانیس STFU\" دو هفته را در صدر جدول 100 بیلبورد سپری کرد و 20 هفته را در رتبه اول جدول آهنگ های رپ داغ بیلبورد سپری کرد که طولانی ترین دوره سلطنت او در آن چارت است. تیم دریک در بیانیه روز جمعه به بیلبورد گفت: اجازه دهید کاملاً واضح بگوییم: این اتهامات به طور قاطع، صریح و به طور کامل رد می شوند. این اتهامات یک ذره حقیقت ندارد و ما هر تلاشی برای نشان دادن این ادعاها به عنوان حقایق ثابت را رد می کنیم. «جانیس STFU» مرتبط اکنون طولانی‌ترین شماره پیشرو دریک است. 1 در نمودار آهنگ‌های رپ داغ، دیدی از زندان نیوجرسی به مکان مشابهی در پنسیلوانیا ویزر منتقل شد تا جایزه Legend of Live را در اجلاس موسیقی زنده بیلبورد در سال 2026 دریافت کند. \"Zac\" De Boni (معروف به FNZ)، همكاران مكرر دريك. هیرشفیلد آهنگ سال 2011 لیکه لی را با نام «I Follow Rivers» درج کرد و گفت که او این آهنگ را به طور خاص برای دریک نوشته است، که قبلاً با او به عنوان یکی از نویسندگان در آهنگ 2022 بیانسه «Heated» فهرست شده بود. طبق این دادخواست، هیرشفیلد نسخه ی نمایشی تمام شده خود را برای FNZ و سایر تهیه کنندگانی"}, {"source": "Billboard", "title": "In Canada: Cardi B Named First-Ever Global Woman of the Year at Billboard Canada Women in Music 2026", "link": "https://www.billboard.com/pro/cardi-b-billboard-canada-women-in-music-2026-award-news/", "summary": "Cardi B will make history at Billboard Canada Women In Music 2026. The global superstar will come to the celebration at Rebel in Toronto to accept Billboard Canada ’s first-ever Global Woman of the Year award on November 24. Cardi B will be a guest of honour at Billboard Canada Women In Music 2026, where she will be honoured for her influence and accomplishments worldwide. She will bring her unmatched charisma and style to the star-studded celebration to accept the award. Related Cardi B Reacts to Historic VMAs Win With Kehlani After Missing 2026 Ceremony: As I Deserve, B h Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit In less than a decade since her breakout single “Bodak Yellow” shot to the top of the Billboard charts, Cardi has made an undeniable impact on the global music landscape. She’s filled the record books with accomplishments, including in Canada, where she has racked up 46 charting songs on the Billboard Canadian Hot 100, including eight top 10 hits. This year’s Little Miss Drama Tour was a completely sold-out arena tour throughout North America, another historic feat for a female rapper, including highlight shows at Vancouver’s Rogers Arena, Toronto’s Scotiabank Arena and Hamilton’s TD Coliseum. In a career full of accolades, she has maintained her unfiltered, vulnerable and often hilarious charisma and her impeccable style — which she will bring to Billboard Canada Women In Music — as well as her unbreakable flow, which merges seamlessly with hard-hitting beats, pop hooks and Latin rhythms. This year’s third edition of Billboard Canada Women In Music will be more global than ever, bringing together Canada’s most exciting musicians with the biggest names across the world — as well as luminaries from across the music industry. Melissa Bubb-Clarke will accept this year’s Executive of the Year award , one of the Canadian music industry’s biggest honours. As chief commercial officer, Bubb-Clarke has been a driving force behind a prosperous period of growth for Live Nation Canada. Since joining the country s biggest live music and entertainment company in 2024, she has been a key figure in multiple major initiatives through partnerships and commercial strategy: the transformation of RBC Amphitheatre, the second season of Toronto s biggest concert venue Rogers Stadium, the opening of HISTORY Ottawa and major festivals throughout the country. Kristy Fl", "date_str": "2026-10-16T21:42:52+00:00", "hash": "b893020835a23b00", "title_fa": "در کانادا: Cardi B اولین زن جهانی سال در Billboard Canada Women in Music 2026", "summary_fa": "کاردی بی در Billboard Canada Women In Music 2026 تاریخ ساز خواهد شد. این سوپراستار جهانی به جشن Rebel در تورنتو خواهد آمد تا اولین جایزه ج aar in een ongemakkelijke situatie brengt. Vooral haar gevoelens voor Andrew (Graham Phillips), een jeugdvriend op wie ze al jarenlang verliefd is, maken alles ingewikkelder. Wanneer de vakantie voorbij is en Maelyn met haar familie naar huis rijdt, vraagt ze het universum om haar te laten zien wat haar gelukkig zou maken. Kort daarna gebeurt er iets onverwachts: ze wordt plotseling wakker aan het begin van dezelfde kerstvakantie. Tot haar verbazing blijken alle gebeurtenissen zich opnieuw af te spelen, alsof de afgelopen dagen nooit hebben plaatsgevonden. Al snel ontdekt Maelyn dat ze gevangen zit in een tijdlus. Iedere keer wanneer er iets misgaat, belandt ze opnieuw aan het begin van de vakantie. Hoewel ze aanvankelijk niet begrijpt wat haar overkomt, besluit ze haar bijzondere situatie te gebruiken om andere keuzes te maken. Ze probeert fouten te voorkomen, haar relaties te verbeteren en eindelijk duidelijkheid te krijgen over haar gevoelens voor Andrew. In a Holidaze verschijnt op 2 december 2026 op Netflix. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Wegzwijmelen bij nieuwe romantische kerstfilm op Netflix appeared ", "date_str": "2026-10-17T10:17:39+00:00", "hash": "fa91c8aa5a9ed9cf", "title_fa": "از فیلم عاشقانه کریسمس جدید در نتفلیکس غمگین باشید", "summary_fa": "البته شما می خواهید در این کریسمس کاملاً غمگین شوید. با All You Need Is Love با رابرت تن برینک و با یک فیلم کریسمس در نتفلیکس. در این صورت، In a Holidaze جدید به شدت توصیه می شود. فیلم رمانتیک کریسمس جدید در نتفلیکس: In a Holidaze In a Holidaze یک کمدی رمانتیک کریسمس جدید در نتفلیکس است که بر اساس رمانی به همین نام اثر کریستینا لورن ساخته شده است. داستان درباره زن جوانی می‌چرخد که در طول تعطیلات در یک حلقه زمانی مرموز گیر می‌کند. این به او فرصتی دوباره و دوباره می دهد تا تعطیلات کریسمس خود را متفاوت کند و به تدریج متوجه می شود که چه چیزی او را واقعاً خوشحال می کند. مالین جونز (مدی زیگلر) آن زن جوانی است که از مسیری که زندگی اش در آن در حال پیشرفت hat You See ظاهر خواهند شد. این پروژه که توسط PinkPantheress نویسندگی و تهیه‌کننده اجرایی مشترک است، قرار است پس از سه سال تک‌آهنگ‌های آزاد، در 13 نوامبر از طریق آتلانتیک رکوردز منتشر شود، زیرا گروه دختر -"}, {"source": "Rolling Stone", "title": "‘A Drop in the Bucket’: Trump’s Diesel Deal With Russia Is Desperate Political Theater", "link": "https://www.rollingstone.com/politics/politics-features/trump-diesel-deal-russia-gas-prices-1235644071/", "summary": "The president's big favor for Vladimir Putin isn't going to bring down prices for Americans", "date_str": "2026-10-17T14:00:00+00:00", "hash": "a1f7c8473c9c839a", "title_fa": "\"یک قطره در سطل\": معامله دیزلی ترامپ با روسیه یک تئاتر سیاسی ناامیدکننده است", "summary_fa": "لطف بزرگ رئیس جمهور به ولادیمیر پوتین باعث کاهش قیمت ها برای آمریکایی ها نمی شود. هفته گذشته دونالد ترامپ - تایید در زیر آب، با افزایش سرسام‌آور قیمت گاز، با جنگ فاجعه‌باری که آغاز کرد، و با خیره شدن به بشکه انتخابات میان‌دوره‌ای که سال‌ها می‌توانست حزبش را از بین ببرد - به سمت شرق، به ولادیمیر پوتین از روسیه نگاه کرد. نتیجه یک معامله نفتی بود که کارشناسان می گویند یک حرکت ناامیدکننده تئاتر سیاسی است، درخواستی برای رای دهندگان که در درازمدت به منافع ایالات متحده آسیب می رساند. و بدتر از آن - حتی چیزها را در پمپ ارزانتر نمی کند. در 9 اکتبر، ترامپ اعلام کرد که ایالات متحده به طور موقت برخی از تحریم‌های نفت روسیه را لغو می‌کند و پیشنهاد کرد که ایالات متحده می‌تواند این محصول را به منظور کاهش قیمت داخلی سوخت خریداری کند. در مقابل، روسیه قول داد که فوراً 2.25 میلیون بشکه گازوئیل را به بازارهای جهانی از جمله ایالات متحده عرضه کند. این طرح بلافاصله بحث برانگیز شد. این نشان دهنده تسلیم شدن در برابر روسیه بود که صادرات نفت آن به دلیل حملات مکرر اوکراین به تاسیسات پالایشی آنها به شدت مانع شده است. در ساده‌ترین سطح ممکن، هدف ترامپ روشن بود: قیمت‌های سوخت، به‌ویژه گازوئیل بالا است، بنابراین اعلام این که تعداد بیشتری وارد بازار خواهد شد، می‌تواند چیز خوبی باشد. اما مانند بسیاری از برنامه‌های ترامپ، این توافق نیز به خوبی اصلاح شده بود. اول، کارشناسان می گویند، میزان گازوئیلی که روسیه متعهد شده است، کسری از چیزی است که ایالات متحده به تنهایی در یک روز استفاده می کند. بخش انرژی ایالات متحده تقریباً 3 میلیون بشکه در روز مصرف می کند و تقاضای جهانی حدود 29 میلیون بشکه در روز است."}, {"source": "Rolling Stone", "title": "Antonio Banderas Joins Nicolas Cage in ‘True Detective’ Season 5", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/antonio-banderas-nicolas-cage-true-detective-season-5-1235644361/", "summary": "Less than a week after Cage leaked the news, HBO confirmed the casting and said filming will begin in 2027", "date_str": "2026-10-17T13:25:01+00:00", "hash": "b9b5e02bb2af0a2f", "title_fa": "آنتونیو باندراس به نیکلاس کیج در فصل پنجم سریال True Detective پیوست", "summary_fa": "کمتر از یک هفته پس از افشای خبر کیج، HBO انتخاب بازیگران را تایید کرد و گفت که فیلمبرداری در سال 2027 آغاز خواهد شد. HBO خبر انتخاب بازیگران را در تیزری فاش کرد که فصل‌های گذشته True Detective - متیو مک‌کانهی و وودی هارلسون، کالین فارل و وینس وان و غیره را بازبینی می‌کرد. - قبل از اعلام کیج و باندراس به عنوان دو نفر آینده. جز نام این دو شخصیت جزییات داستانی دیگری درباره فصل پنجم فاش نشد: کیج نقش هنری لوگان و باندراس نقش رای گارسیا را بازی خواهد کرد. همانطور که قبلاً گزارش شده بود، فصل آینده در خلیج جامائیکا، نیویورک - دور از شب همیشگی آلاسکا در فصل 4 - و فیلمبرداری آن در سال 2027 آغاز خواهد شد. شاید خود کیج زمانی که آخر هفته گذشته در یک پنل Comic-Con در مورد مشارکت خود خبر داد، اعلامیه HBO را تسریع کرد. فکر می کنم احتمالاً فصل دیگری از تلویزیون را اجرا خواهم کرد. کیج گفت، فکر می کنم ممکن است فصلی از True Detective را اجرا کنم. اشکالی ندارد که من اولین کسی هستم که این را اعلام می کنم، درست است؟» داستان های پرطرفدار دیو گرول و پت اسمیر سبک فو فایترز را به سبک بسیار بی پروا می آورند، «درباره تو» فارل تلاش می کند تاریخ را بازنویسی کند و چاد هوگو را از نپتون پاک کند، سازنده ادعا می کند که نیل یانگ «Digger» را ستایش می کند: «بهترین فیلمی که تا به حال برای اجراهای جدید در سنین پایین داشته ام». سالگرد مرگ او انتخاب بازیگران اصلاً غافلگیرکننده نبود: تا اوت 2025 شایعه شده بود که کیج در فصل 5 True Detective بازی خواهد کرد. به همین ترتیب، هالیوود ریپورتر نوشت، شایعاتی در مورد پیوستن باندراس به گروه بازیگران برای اولین بار اواخر سال گذشته منتشر شد. اگرچه هر دو"}, {"source": "Rolling Stone", "title": "Watch 26 Versions of ‘God Only Knows’ By the Beach Boys and Their Offshoot Bands", "link": "https://www.rollingstone.com/music/music-lists/beach-boys-god-only-knows-all-the-versions-1235643250/", "summary": "The future of the Beach Boys is in doubt following Mike Love's health issues, but they leave us with six decades of incredible music, including this masterpiece they've played thousands of times", "date_str": "2026-10-17T13:15:00+00:00", "hash": "07f49b94057645cf", "title_fa": "26 نسخه از «فقط خدا می داند» توسط پسران ساحل و گروه های فرعی آنها را تماشا کنید", "summary_fa": "آینده بیچ بویز به دلیل مشکلات سلامتی مایک لاو در هاله ای از ابهام قرار دارد، اما آن ها ما را با شش دهه موسیقی باورنکردنی، از جمله شاهکاری که هزاران بار نواخته اند، باقی می گذارند. او در سالن رایمن در نشویل به طرفدارانش گفت: «همه چیزی که ما داریم، واقعاً امشب است. مایک، او اصرار داشت که اینجا باشد... او بیش از 7000 برنامه زنده اجرا کرده است. و امشب دقیقاً 7422 خواهد بود. من فکر می کنم این جایی است که ما در آن هستیم. او در حال شمارش است.» ممکن است این عدد کاملاً دقیق باشد، اما ما تعجب خواهیم کرد، زیرا لاو از سال 1962 تقریباً بدون توقف در تور بوده است و بسیاری از رویدادهای خصوصی و نمایش های ویژه را با گروه های اسپین آف مانند گروه مایک لاو بی پایان تابستان ساحلی و مایک لاو دین تورنس اجرا کرده است. بیچ بویز نیز در بسیاری از موارد دو یا حتی سه کنسرت در یک روز اجرا کرده است. در این مرحله، شمارش تک تک نمایش‌هایی که عشق در طول سال‌ها بازی کرده است، احتمالاً حتی برای او غیرممکن است. تورنس در ماه جولای به ما گفت: «او یک وایکینگ است. او اکنون در حال مبارزه است. حالش خوب نیست، و در حال تقلا است، اما تا زمانی که واقعاً تمام نشود، متوقف نمی‌شود. و من فکر می‌کنم او احتمالاً می‌خواهد حتی در جاده بمیرد.» وایکینگ زرادخانه عظیمی از آهنگ ها را در هر زمان که می نوازد دارد، اما تقریبا همیشه به معروف ترین آهنگ های Beach Boys در دهه 1960 پایبند است. لاو در سال 2012 به رولینگ استون گفت: \"من همیشه احساس می‌کردم که مردم بر اساس آهنگ‌هایی که با آن‌ها شناخته شده‌اید به دیدن شما می‌آیند.\""}, {"source": "Rolling Stone", "title": "Pharrell Trying to ‘Rewrite History’ and ‘Erase’ Chad Hugo from Neptunes, Producer Claims", "link": "https://www.rollingstone.com/music/music-news/pharrell-chad-hugo-neptunes-copyright-infringement-lawsuit-1235644309/", "summary": "\"Hugo has always been at the center of the Neptunes' success and is equally responsible for the duo’s special place in the industry,\" a new court filing says", "date_str": "2026-10-17T00:27:38+00:00", "hash": "5c79fd9a29b4383d", "title_fa": "فارل در حال تلاش برای \"بازنویسی تاریخ\" و \"پاک کردن\" چاد هوگو از نپتون، ادعای تهیه کننده", "summary_fa": "یک پرونده جدید دادگاه می گوید: «هوگو همیشه در مرکز موفقیت نپتون ها بوده و به همان اندازه مسئول جایگاه ویژه این دو در صنعت است. دوتای تاثیرگذار در یک پرونده جدید دادگاه، هوگو و وکیلش، برنت لیمن، با ادعای ویلیامز مبنی بر اینکه این دعوی فقط یک آهنگ مورد بحث را مشخص می کند، مخالفت می کنند. در عوض، هوگو می‌گوید که این پرونده شامل مجموعه بسیار گسترده‌تری از آثار می‌شود که ناشی از آهنگ‌سازی‌هایی است که این دو طی تقریباً 50 جلسه استودیویی بین سال‌های 2019 و 2021 ایجاد کردند. او استدلال می‌کند که ویلیامز و شرکت‌های وابسته به او، برچسب‌های ضبط و ناشران رکوردهای مورد نیاز برای شناسایی نحوه انتشار نهایی آن آهنگ‌ها را کنترل می‌کنند. هوگو می‌گوید که آهنگ «U Gotta» از EarthGang را به عنوان یکی از نمونه‌هایش انتخاب کرده است، زیرا گفته می‌شود علیرغم اینکه خود هنرمندان موسیقی مشارکت‌های او را تأیید کرده‌اند، از تیتراژ آهنگ حذف شده است. در پرونده جدید هوگو که توسط رولینگ استون به دست آمده، آمده است: «مدافعان از دادگاه می‌خواهند تا قبل از ارائه یک سند، چاد هوگو را از «نپتون‌ها» بر روی دادخواست‌ها بنویسد. اما نپتون ها دو نفر بودند. به مدت سه دهه، هوگو و فارل ویلیامز با هم آلبوم هایی را با این نام نوشتند و تولید کردند. هوگو همیشه در مرکز موفقیت The Neptunes بوده است و به همان اندازه مسئول جایگاه ویژه این دو در صنعت است. در چند سال گذشته، ویلیامز به دنبال حذف هوگو از یکی از بزرگترین دوتایی های هیپ هیپ در تمام دوران بوده است. این مورد در مورد تلاش ویلیامز برای بازنویسی تاریخ و تبدیل موفقیت نپتون ها به اثر تنها یک نفر است."}, {"source": "Rolling Stone", "title": "Timothy Busfield’s Child Sexual Abuse Case Dismissed", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/timothy-busfield-child-sexual-abuse-case-dismissed-1235643841/", "summary": "A New Mexico judge determined that Albuquerque prosecutors failed to allow the grand jury to hear from more witnesses", "date_str": "2026-10-16T21:22:31+00:00", "hash": "d10cc56331624660", "title_fa": "پرونده آزار جنسی کودکان تیموتی باسفیلد رد شد", "summary_fa": "یک قاضی نیومکزیکو تشخیص داد که دادستان های آلبوکرکی به هیئت منصفه اجازه ندادند تا از شاهدان بیشتری استماع کند. تیموتی باسفیلد پرونده سوء استفاده جنسی از کودکان خود را رد کرده است، پس از اینکه قاضی نیومکزیکو تشخیص داد که دادستان های آلبوکرکی با عدم اجازه دادن به هیئت منصفه برای استماع شاهدان بیشتر، نادرست عمل کرده اند. این بازیگر 69 ساله زمانی که در ژانویه دستگیر شد، به اتهام سوء رفتار در رابطه با بازیگران کودک دوقلویی که با آنها در سریال تلویزیونی فاکس کار می کرد، در ژانویه دستگیر شد. اگرچه باسفیلد به شدت این ادعاها را رد کرد و آنها را \"دروغ های وحشتناک\" خواند، اما در ماه بعد توسط هیئت منصفه در چهار مورد ارتباط جنسی جنایی با یک کودک متهم شد. باسفیلد در ماه ژوئن درخواستی برای ابطال کیفرخواست ارائه کرد و وکلای او استدلال کردند که دادستان نقش خود را به عنوان دستیار بی طرف هیئت منصفه رها کرده، قانون را اشتباه بیان کرده و دسترسی هیئت منصفه به شاهدان را مسدود کرده است. علیرغم درخواست اعضای هیئت منصفه سه بار جداگانه برای شنیدن شاهدان بیشتر، هیئت منصفه فقط از کارآگاه اصلی و باسفیلد شهادت شنیدند. در حکمی که روز جمعه صادر شد، یک قاضی در کنار باسفیلد قرار گرفت و کیفرخواست را باطل کرد و نوشت: «وکیل دادگستری به شیوه‌ای منصفانه و بی‌طرفانه عمل نکرد... در انجام این کار، رسیدگی هیئت منصفه به گونه‌ای انجام شد که قوانین هیئت منصفه بزرگ را که برای محافظت از یکپارچگی ساختاری سیستم هیئت منصفه بزرگ ما از پیش داوری پیش داوری طراحی شده بود، نقض کرد.» با این حال، قاضی خاطرنشان کرد که دادستان ها همچنان آزادند که پرونده های کیفری جدیدی را علیه باسفیلد آغاز کنند."}, {"source": "Rolling Stone", "title": "Brooklyn Punk Duo Venus Twins Tell Us How They Ended Up in Olivia Rodrigo’s New Music Video", "link": "https://www.rollingstone.com/music/music-features/venus-twins-olivia-rodrigo-chappell-roan-expectations-video-1235643173/", "summary": "The real-life identical twins show up as part of a Family Feud -style scene in the new \"Expectations\" video co-starring Chappell Roan", "date_str": "2026-10-16T20:51:24+00:00", "hash": "1f02b8afe102da64", "title_fa": "دوقلوهای ونوس بروکلین پانک به ما می گویند که چگونه در موزیک ویدیو جدید اولیویا رودریگو به پایان رسیدند.", "summary_fa": "دوقلوهای همسان در زندگی واقعی به عنوان بخشی از صحنه ای به سبک دشمنی خانوادگی در ویدیوی جدید \"Expectations\" با همبازی چپل روآن اولیویا رودریگو برای ریمیکس Expectations او با چاپل روان، پر از صحنه های کمدی سرگرم کننده است، از جمله دیوید برن به عنوان مجری نمایش بازی و تهیه کننده دن نیگرو به همراه صداپیشه. اما برای طرفداران صحنه راک زیرزمینی نیویورک، سورپرایز دیگری در انتظار است: جیک و مت درتینگ، خواهر و برادرهای همسان که بیشتر به عنوان دو دونفره باحال و جذاب گلم-پانک/نویز-پاپ شناخته می‌شوند، به عنوان بخشی از تیم رودریگو در مسابقه‌ای به سبک فامیلی فیود تقریباً در نیمه‌ی راه ویدیو حاضر می‌شوند. وقتی یک روز بعد از پخش ویدیو از طریق Zoom به آنها می‌رسیم، هر دو برادر همچنان از هیجان غوغا می‌کنند و می‌گویند تلفن‌هایشان کاملاً با اعلان‌ها منفجر شده است. مت می گوید که پاسخ دادن به همه واقعاً سخت است، که این چیز خوبی است. با این حال، من می خواهم به همه پاسخ دهم. من می خواهم مانند، متشکرم! دوقلوهای ونوس که علاوه بر انتشار موسیقی به تنهایی برخی از بهترین استیج‌های باشگاه شهر را به عنوان بخشی از ترکیب زنده Fantasy of a Broken Heart زینت داده‌اند، برای اولین بار حدود یک ماه پیش از یک نماینده بازیگران در مورد اجرای موسیقی-ویدئویی احتمالی شنیدند. جیک می گوید، این غیر اختصاصی بود. فکر می‌کنم شاید می‌گفت هنرمند برنده گرمی، اما آنها در این مورد سکوت کردند.» مت می‌گوید فکر می‌کنم آنها فقط به دنبال پانک‌ها بودند. افراد جالب و پانک ها، فکر می کنم نقل قول بود. جیک می‌افزاید: «کسی که انتخاب می‌کند احتمالاً ما را در اینستاگرام پیدا کرده است و می‌گوید، این دوقلوها عجیب هستند.» این دو نفر که قبل از نقل مکان به نیویورک در منطقه فورت ورث، تگزاس بزرگ شده‌اند، تجربه‌ای روی صفحه داشتند، از جمله"}, {"source": "Rolling Stone", "title": "Selma Blair Issues First Statement Since Plane Incident: ‘Did Not Intend to Harm Anyone’", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/selma-blair-first-statement-plane-incident-1235644142/", "summary": "“There was no attempt to open the door of the aircraft,” actress’ rep says in statement, reiterating that Blair suffered a “medical emergency” aboard plane", "date_str": "2026-10-16T20:38:54+00:00", "hash": "62cc137dff71f65f", "title_fa": "سلما بلر اولین بیانیه پس از حادثه هواپیما را صادر کرد: \"قصد آسیب رساندن به کسی را نداشتم\"", "summary_fa": "نماینده بازیگر زن در بیانیه‌ای گفت: «هیچ تلاشی برای باز کردن در هواپیما صورت نگرفته است» و تکرار کرد که بلر در هواپیما دچار «اورژانس پزشکی» شده است. سلما بلر اولین بیانیه خود را پس از حادثه بازیگر زن در پرواز صادر کرده است و سخنگوی بلر گفته است که برخلاف گزارش‌ها، سلما قصد آسیب رساندن به کسی را نداشته است. نماینده بلر در بیانیه ای به People گفت: \"از یکشنبه شب، گزارش عمومی آنچه برای سلما در یک پرواز به نیویورک رخ داد تقریباً به طور کامل بر اساس بیانیه پلیس و یک تیتر ده ساله ساخته شده است. یکشنبه شب، بلر به اتهام حمله به چندین مهماندار و رفتارهای نامنظم اضافی که در پروازی از فرودگاه بین المللی John F به فرودگاه بین المللی دلتا نشان داده شده بود، بازداشت شد. فرودگاه کندی نماینده بلر در ابتدا گفت که این بازیگر از یک اورژانس پزشکی رنج می‌برد، اما تحقیقات اولیه نشان می‌دهد که بازیگر زن با سه مهماندار هواپیما درگیری داشته که منجر به جراحات آنها شده است. نماینده بلر بدون ذکر جزئیات گفت، تعداد انگشت شماری از روزنامه نگاران برای گزارش در مورد سلما به عنوان یک انسان به جای یک تیتر وقت صرف کرده اند و ما از آنها سپاسگزاریم. اما گزارش منصفانه استثنا بوده است، و در فضای باقی مانده از سکوت ما، حدس و گمان به چیزی تبدیل شده است که به عنوان واقعیت تلقی می شود. با این حال، می‌توانیم این رکورد را در چند نقطه از قبل در گردش عمومی تصحیح کنیم. این نماینده مجدداً تاکید کرد که بلر در حین پرواز یک اورژانس پزشکی را تجربه کرده است و خطرناک ترین اتهام علیه بازیگر زن را رد کرد: اینکه بلر در اواسط پرواز تلاش کرد درب هواپیما را باز کند."}, {"source": "Hollywood Reporter", "title": "Mahershala Ali Put His Two Oscars Into a Cabinet: “I Felt a Sense of Accomplishment, Not Fulfillment”", "link": "https://www.hollywoodreporter.com/movies/movie-news/mahershala-ali-two-oscars-in-cabinet-london-green-book-1236734282/", "summary": "In London, the star also discussed playing people who \"haven’t been seen,\" nearly going crazy on 'True Detective,' police brutality and how 'Green Book' made him feel like a \"golden boy,\" followed by vitriol.", "date_str": "2026-10-17T14:25:17+00:00", "hash": "e43de9e95eb2917b", "title_fa": "ماهرشالا علی دو جایزه اسکار خود را در کابینه گذاشت: \"احساس موفقیت داشتم، نه تحقق\"", "summary_fa": "در لندن، این ستاره همچنین درباره بازی در نقش افرادی که «دیده نشده‌اند»، تقریباً دیوانه‌شده در «کارآگاه واقعی»، خشونت پلیس و اینکه چگونه «کتاب سبز» باعث می‌شود او احساس یک «پسر طلایی» کند، صحبت کرد. ماهرشالا علی، برنده دو جایزه اسکار و بافتا، روز شنبه در یک سینمای شلوغ لندن، اطلاعاتی در مورد کار، حرفه و فیلم جنایی وجودی جدید خود با نام «مادرت مادرت مادرت» به اشتراک گذاشت. او در یک جلسه Screen Talk به عنوان بخشی از هفتادمین دوره جشنواره فیلم لندن BFI (LFF) که روز یکشنبه به پایان می‌رسد، سخنرانی کرد. علی در پاسخ به این سوال که دو جایزه اسکار خود را برای نقش هایش در مهتاب و کتاب سبز کجا نگه می دارد، گفت: این دیوانه به نظر می رسد. آنها در یک کابینه هستند. من نمی توانم آنها را در حال حاضر ببینم به طرز عجیبی احساس می کردم خیلی کامل شده ام. این احمقانه به نظر می رسد، اما باید آنها را از محدوده دیدم خارج می کردم تا بتو ئیس-دریفوس، آلیسون جنی و اد هریس شروع شد. کیری گفت: \"خواندن اولیه ای که من انجام دادم، جولیا و آلیسون و اد بودند که این خواندن را انجام می دادند. بنابراین، آره، طرفداران بزرگ آن سه در آنجا. این همان ایمیلی است که شما دریافت می کنید، و می گویید، لعنتی! خوب، عالی. بله، من این کار را انجام خواهم داد.\" لیلی راب بعداً با بازی خواهر کیری به بازیگران پیوست. او و کیری برای تعطیلات از والدین محافظه‌کارشان (لوئیس دریفوس و هریس) دیدن می‌کنند، و او نسخه‌ای از کتاب جدیدی را که نوشته است، می‌آورد که کثیفی از گذشته خانواده را آشکار می‌کند. راب برای انتشار کتاب از پدر و مادرش درخواست می‌کند، علی‌رغم اینکه آن‌ها را در نور منفی قرار می‌دهد، در حالی که شخصیت کیری به عنوان واسطه در هنگام بروز تنش‌ها، از جمله با خواهر لویی-دریفوس (جنی) عمل می‌کند. نمایشنامه اکتبر افتتاح می شود. 18 در تئاتر هادسون برای"}, {"source": "Hollywood Reporter", "title": "Indiana vs. Ohio State: Where to Watch the Top-Five College Football Matchup Online", "link": "https://www.hollywoodreporter.com/tv/tv-news/watch-indiana-vs-ohio-state-football-game-free-streams-2026-1236734000/", "summary": "Here's how to livestream the Big Ten showdown between the Buckeyes and Hoosiers on Saturday, Oct. 17.", "date_str": "2026-10-17T12:15:00+00:00", "hash": "3805daa274d8141e", "title_fa": "ایندیانا در مقابل ایالت اوهایو: کجا می توان مسابقه فوتبال برتر کالج را به صورت آنلاین تماشا کرد", "summary_fa": "در اینجا نحوه پخش زنده مسابقه Big Ten بین Buckeyes و Hoosiers در روز شنبه، 17 اکتبر آمده است. اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، هالیوود ریپورتر ممکن است کمیسیون وابسته دریافت کند. تیم های اوهایو ایالت باکییز و ایندیانا هوزیرز یک روز بزرگ از فوتبال کالج را با مسابقه پنج برتر خود در 17 اکتبر آغاز می کنند. بازی شنبه ساعت 9 صبح PT/12 بعد از ظهر پخش می شود. ET در Fox، برای پخش مستقیم از طریق DirecTV (با یک دوره آزمایشی رایگان پنج روزه)، Fubo (با یک دوره آزمایشی رایگان پنج روزه)، Sling و Hulu + Live TV در دسترس است. طرفداران همچنین می توانند بازی Big Ten را از طریق Fox One نکه، او را در سفری شدید از میان برخی از بلندترین گردنه‌های کوهستانی اروپا دنبال می‌کند و در عین حال مراقبه‌ای درباره زندگی مدرن و مطالعه شخصیت‌ها نیز ارائه می‌کند. برای یکی، حتی در عصر عشایر دیجیتالی، سبک زندگی شنل همه چیز را تحت فشار قرار می دهد. و سپس، رابطه او با شریک زندگی اش نینا باعث می شود اولویت های زندگی خود را زیر سوال ببرد. داستان های مرتبط فیلم ها فیلم غافلگیر کننده جشنواره فیلم لندن است... من بازی Rocky Movies Chase Infiniti's The Julia Set خریداری شده توسط Sony Pictures Classics For U.S., International Territories. بنابراین، برای مناظر کوهستانی و روزهای طاقت فرسا دوچرخه سواری آماده شوید تا نفستان را بند بیاورید و سوالاتی در مورد انتخاب های زندگیتان در ذهنتان بچرخد! فیلم Elk و Dogwoof جاده کامل را تولید کردند و آندریاس دالزگارد، آنا گوداس، اولی هاربوتل، میریام نورگارد به عنوان تهیه کننده مشغول به کار بودند. جاناتان موز به عنوان فیلمبردار و تدوین توسط مارتین آنتون انجام شد. پس از اولین نمایش جهانی جشنواره فیلم زوریخ، جاده کامل در هفتادمین دوره جشنواره فیلم BFI لندن به نمایش درآمده است. THR در مورد فیلم با Bonkes در لندن صحبت کرد و با Schnell از طریق Zoom in Bolzano تماس گرفت."}, {"source": "Hollywood Reporter", "title": "Miley Cyrus Tearfully Pays Tribute to Dolly Parton With “Jolene” Performance at Hollywood Bowl: “Me and Dolly, We Are Eternal”", "link": "https://www.hollywoodreporter.com/music/music-news/miley-cyrus-dolly-parton-hollywood-bowl-jolene-watch-1236734264/", "summary": "The singer told the crowd that one of the things that inspired her to play the venue was the memory of the only time she was able to sit and enjoy a Parton show at the Hollywood Bowl.", "date_str": "2026-10-17T04:48:51+00:00", "hash": "7d8603bd89fd9e1c", "title_fa": "مایلی سایرس با اشک از دالی پارتون با اجرای «جولین» در هالیوود بول ادای احترام کرد: «من و دالی، ما ابدی هستیم»", "summary_fa": "این خواننده به جمعیت گفت که یکی از چیزهایی که او را برای بازی در محل ترغیب کرد، خاطره تنها زمانی بود که توانست بنشیند و از نمایش پارتون در هالیوود بول لذت ببرد. نوشته نیکول فل، مک کینلی e at the BFI London Film Festival on Saturday as he recalled the young boy at the heart of Moonlight. The Barry Jenkins drama won him one of his two Oscars and recently marked its 10th anniversary. During a Screen Talk hosted by Amon Warmann, Ali was discussing [ ]", "date_str": "2026-10-17T14:28:04+00:00", "hash": "d9d6c0546b8326cf", "title_fa": "ماهرشالا علی با یادآوری صحنه \"مهتاب\" گریه می کند، در \"آیه عنکبوتی\" در گفتگوی لندن سکوت می کند: \"من باید مراقب باشم\"", "summary_fa": "ماهرشالا علی روز شنبه در جشنواره فیلم BFI لندن در حالی که پسر جوانی را در قلب مهتاب به یاد می آورد، اشک ریخت. درام بری جنکینز یکی از دو جایزه اسکار را برای او به ارمغان آورد و اخیراً دهمین سالگرد آن را جشن گرفت. در طول یک گفتگوی نمایشی که توسط آمون وارمن میزبانی می شد، علی در حال بحث و گفتگو بود [ ] وقتی وارمن از او پرسید که دلیل قدرت ماندگار فیلم چیست، علی مکث کرد، با احساسات غلبه کرد و اشک ها را پاک کرد. او گفت: «ببخشید، فقط یک ثانیه لازم است. محبوب در Variety: «هر وقت مردم گوشت را روی استخوان‌های کسانی می‌اندازند که دیده نشده‌اند یا لحظه‌ای را تجربه نکرده‌اند، فکر می‌کنم این مهم است». فکر می‌کنم «مهتاب» توانست آن شخصیت‌ها را شخصی کند.» برای بازی در نقش خوان، علی از مردی استفاده کرد که تمام عمرش را می‌شناخت، شخصیتی شبیه عمو که با او در بازی بسکتبال بزرگ شده بود و به عنوان معلم جایگزین نیز کار می‌کرد. این مرد در حالی که علی در دانشگاه بود دستگیر و روانه زندان شد که این بازیگر را متحیر کرد. علی گفت: «در ساخت فیلم به خاطر انسان بودن همه در محیط و تربیت من به او خیلی فکر کردم. او در مورد واکنش های پس از «کتاب سبز» که در آن نقش پیانیست دان شرلی را در مقابل ویگو مورتنسن بازی می کرد، صادق بود. این اولین نقش او به این بزرگی بود، و واکنش‌های منفی شامل بحث و جدل در مورد تحریم‌هایی که خانواده شرلی داشتند و چه چیزی را تحریم نکرده بودند، بود. علی گفت: «هنوز پای کار ایستاده‌ام. من در کنار کار ایستاده‌ام» و افزود که او همچنین بر «تجربه به‌عنوان یک کل و آنچه که به من آموخته است» می‌ایستد."}, {"source": "Variety", "title": "‘The Angry Birds Movie 3’ Unpacked by VFX Supervisor, Including Red’s Redesign and Character-Effects Automation: ’He’s Similar by Choice’", "link": "https://variety.com/2026/film/global/the-angry-birds-movie-3-red-redesign-character-automation-1236914681/", "summary": "The red-feathered hero of “The Angry Birds Movie 3” looks reassuringly familiar, but DNEG Animation had to rebuild much of him to bring the franchise back to theaters. And as the studio reconstructed Red’s fur, facial rig and expressions, it also developed a system that ultimately automated character-effects work on roughly 75% of the film’s [ ]", "date_str": "2026-10-17T13:56:06+00:00", "hash": "a4960bbcaf8a6228", "title_fa": "«فیلم پرندگان خشمگین 3» توسط VFX Supervisor بازگشایی شد، شامل طراحی مجدد و اتوماسیون جلوه‌های شخصیت Red: «او با انتخاب شبیه است»", "summary_fa": "قهرمان پر قرمز «فیلم پرندگان خشمگین 3» به طرز اطمینان‌بخشی آشنا به نظر می‌رسد، اما انیمیشن DNEG مجبور شد بسیاری از او را بازسازی کند تا فرنچایز را به سینماها بازگرداند. و همانطور که استودیو خز، دکل صورت و حالت‌های رد را بازسازی کرد، همچنین سیستمی را توسعه داد که در نهایت افکت‌های کاراکتر خودکار روی تقریباً 75 درصد از انیمیشن [ ] DNEG فیلم کاراکترهای فرنچایز را بازسازی کرد و در عین حال جریان کاری را ایجاد کرد که قادر به خودکارسازی افکت‌های شخصیت در حداکثر 75 درصد از هار شات است. در تورین، پاتریک هاربون، ناظر VFX، روز جمعه در کنفرانس View در تورین گفت: \"او با انتخابش شبیه است.\" داستان‌های مرتبط شب راکین سال نو دیک کلارک با رایان سیکرست برای اولین بار در شبکه ABC و Disney+ برای اولین بار Shawn Levy وارد معامله کلی دیزنی شد. آخرین ماجراجویی آنها DNEG وظایف انیمیشن را از تولیدات Sony Pictures Animation در پشت دو فیلم اول بر عهده می گیرد. محبوب در Variety تحویل فنی هر چیزی جز ساده بود. در واقع، ابزارهای نظافت، ریگ کردن و روکش کردن اختصاصی که در پیشینیان استفاده می شد، نمی توانست به سادگی به خط لوله DNEG منتقل شود. هاربون به شوخی گفت: \"باید از این شروع کنیم. یک نسخه مرغ کنده شده قرمز.\" حتی هندسه زیرین آن قبل از اینکه تیم بتواند پرهای آن را بازسازی کند، نیاز به کار مجدد داشت."}, {"source": "Variety", "title": "Joel               <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
