یلدر در مورد مکالمه آنها گفت: من به هیچ وجه از او چیزی نشنیده بودم... او از حال من پرسید. از او پرسیدم که آیا چیزهایی در مورد این فیلم دیده است و چه احساسی نسبت به آن دارد. او به من گفت که چیزهایی دیده است، اما بیشتر چیزها را نمی بیند، بنابراین چیزهایی شنیده است، اما واقعاً چیزی نخوانده است. و سپس، در پایان، او به من گفت: «به تو اعتماد دارم.» من گفتم، «باشه، متشکرم.» داستان‌های مرتبط «قطار به بوسان» کارگردان یئون سانگ هو، «بهشت گمشده»، فروش 118 کشوری را در پیش از جشنواره هاوایی در ایالات متحده آمریکا، باو فیلدر، ادامه داد، ما در مورد برخی چیزهای دیگر من صحبت کردیم. برای به اشتراک گذاشتن، اما بعد از آن، او دوباره در پایان تماس گفت - من به شما اعتماد دارم. و من نمی دانم منظور او از آن چیست. پرطرفدار در Variety You Can See Everything به کارگردانی فیلدر و لنس اوپنهایم، هلمز پریم تایم، هولمز و شریک زندگی‌اش بیلی ایوانز را در آخرین هفته‌های زندگی‌شان قبل از شروع حکم 11 ساله زندان هومز دنبال می‌کند. سازندگان فیلم 34 روز قبل از اینکه هلمز به زندان برود با این زوج نقل مکان کردند. فیلدر به Wired گفت که پس از شنیدن این که هولمز و ایوانز تلاش کرده اند و نتوانسته اند مستندی درباره آنها به A24 ارائه کنند، با"}, {"source": "Variety", "title": "Globo, Netflix Strike Biggest Licensing Deal Between the Two Companies, Led by Walter Salles’ Oscar Winner ‘I’m Still Here’ (EXCLUSIVE)", "link": "https://variety.com/2026/streaming/global/globo-netflix-im-still-here-walter-salles-india-a-love-story-1236916336/", "summary": "When the going gets tough, the tough get together: Brazil s Globo, Latin America’s biggest media company, has struck an 18-title licensing deal with Netflix, led by one jewel in Globo’s crown, Walter Salles’ Academy Award winner “I’m Still Here.” Kicking in from December, the agreement sees titles rolling out on Netflix through mid-2027. The wide-ranging [ ]", "date_str": "2026-10-19T14:00:00+00:00", "hash": "5f71fd6c0c375aa9", "title_fa": "گلوبو، نتفلیکس بزرگترین قرارداد صدور مجوز را بین دو شرکت به رهبری والتر سالز برنده اسکار «من هنوز اینجام» (انحصاری)", "summary_fa": "وقتی اوضاع سخت می‌شود، سخت‌ها جمع می‌شوند: برزیل گلوبو، بزرگ‌ترین شرکت رسانه‌ای آمریکای لاتین، قراردادی با نتفلیکس 18 عنوان مجوز منعقد کرده است که توسط یک جواهر در تاج گلوبو، برنده جایزه اسکار والتر سالز، «من هنوز اینجا هستم» رهبری می‌شود. این توافق که از دسامبر آغاز می شود، عناوین را تا اواسط سال 2027 در نتفلیکس منتشر می کند. قرارداد گسترده [ ] همچنین شامل «هند – یک داستان عاشقانه» می‌شود که توسط گلوریا پرز، پیشکسوت نویسندگان تله‌نوولای برزیلی، و به کارگردانی مارکوس شچتمن، ساخته شد، که برنده جایزه بین‌المللی امی در سال 2009 برای بهترین تله‌نوولا شد. داستان‌های مرتبط «قطار به بوسان» کارگردان یئون سانگ‌هو، «بهشت گمشده» فروش ۱۱۸ کشوری را پیش از جشنواره هاوایی در ایالات متحده کسب کرد. کمان همچنین در این ترکیب «ویتوریا» به کارگردانی آندروشا وادینگتون، کارگردان سرشناس سینمای تلویزیون («تحت فشار»، «اورژانس 53») و با بازی فرناندا مونته نگرو، نامزد جایزه اسکار («ایستگاه مرکزی») در یک اجرای مرکزی تحسین برانگیز در نقش یک پیرمرد 80 ساله که در حال مبارزه با مواد مخدر برای افشاگری است. جزئیات محبوب در حقوق تنوع متفاوت است. \"من هنوز اینجا هستم\" که توسط Goodfellas در سراسر جهان در معاملات تئاتر فروخته شد، فقط برای برزیل مجوز گرفته است. نتفلیکس در «India – A Love Story»، ایالات متحده و آمریکای لاتین را که یک مرکز تلویزیونی است، بسته است. هفت فصل سریال Vai Que Cola که توسط لئاندرو سوارس ساخته شده و توسط ژائو فونسکا و رجیس فاریا کارگردانی شده است، بزرگترین سریال کمدی تلویزیونی پولی برزیل، که در سال‌های 2013-26 پخش شد، توسط نتفلیکس در برزیل خریداری شد. Vitória، در مقابل برای جهان خریداری شده است. تولیدات اصلی Globo در نتفلیکس، دوبله و زیرنویس به چندین زبان در دسترس قرار خواهند گرفت. این بسته شامل 14 فیلم، سه تله رمان و یک سریال است."}, {"source": "Variety", "title": "Locarno Golden Leopard Winner Sho Miyake Gets First North American Retrospective, 14-City Tour (EXCLUSIVE)", "link": "https://variety.com/2026/film/news/locarno-winner-sho-miyake-north-american-retrospective-1236915534/", "summary": "Japanese director Sho Miyake, whose “Two Seasons, Two Strangers” won the Golden Leopard at Locarno in 2025, will get his first North American retrospective at New York’s Metrograph from Nov. 7–17. It is one stop on a Japan Foundation tour of 14 cities in eight countries. The Metrograph program, titled “Unspoken Gestures: The Films of [ ]", "date_str": "2026-10-19T14:00:00+00:00", "hash": "a01aeecb0298f27c", "title_fa": "شو میاکه، برنده پلنگ طلایی لوکارنو، اولین تور 14 شهر در آمریکای شمالی را دریافت کرد (اختصاصی)", "summary_fa": "شو میاکه کارگردان ژاپنی که «دو فصل، دو غریبه» او برنده پلنگ طلایی در لوکارنو در سال 2025 شد، اولین نمایش گذشته نگر آمریکای شمالی خود را از 7 تا 17 نوامبر در متروگراف نیویورک دریافت خواهد کرد. این یک توقف در تور بنیاد ژاپن در 14 شهر در هشت کشور است. برنامه متروگراف با عنوان «ژست‌های ناگفته: فیلم‌های [ این فیلم‌ها شامل اولین فیلم او در سال 2012، «پخش»، که برای اولین بار در لوکارنو به نمایش درآمد، و «کابین خلبان» (2014)، فیلمی 64 دقیقه‌ای که OMSB تهیه‌کننده-رپ و همکارش بیم را در یک آپارتمان کوچک در حومه توکیو تماشا می‌کند. «And Your Bird Can Sing» (2018) با فیلم کوتاه «8 آگوست» 2016 و «دو فصل، دو غریبه» با فیلم کوتاه «Nagahama» در سال 2016 همراه شده است. درام بوکس «کوچک، آهسته اما ثابت» (2022) و «همه شب‌های طولانی» (2024) ترکیب را تکمیل می‌کنند. محبوب در Variety Miyake همچنین دو فیلم را انتخاب کرده است که بر کار او به عنوان انتخاب های کارتونی تأثیر گذاشته اند: فیلم موج سواری دیوید الفیک در سال 1973 «سفر کریستال» و درام «تعطیلات غمگین» محصول سال 2007 آئویاما شینجی، قسمت پایانی آئویاما «Kitakyushu Asano Tagadanobu». او هر دو را در 8 نوامبر، پس از Q As پس از \"کوچک، آهسته اما ثابت\" و \"دو فصل، دو غریبه\" روز قبل معرفی خواهد کرد. برنامه E Chomiake گفت: \"برای مدت طولانی، شو میاکه یکی از بهترین اسرار سینمای بین المللی بوده است، هر یک از فیلم های او بی سر و صدا اما با قدرت در میان ناهنجاری فرهنگ فیلم معاصر فرود می آیند. با این نگاه به گذشته، ما به مرد یک میکروفون می دهیم و از تماشاگران نیویورکی می خواهیم که با صدای یک هنرمند اصلی فیلم ژاپنی شرکت کنند.\""}, {"source": "Variety", "title": "Elon Musk Says He Will Give One SpaceX Share ‘to Every Kid in America’ — a Giveaway That Would Amount to Over $10.5 Billion", "link": "https://variety.com/2026/digital/news/elon-musk-spacex-share-to-every-kid-in-america-10-5-billion-1236916380/", "summary": "Is Elon Musk aiming to share a piece of his staggering wealth or is he trying to build a new generation of investors in his SpaceX? Early Monday, the tech mega-billionaire posted on X, Next year, I will give one of my SpaceX shares to every kid in America. This will be the first [ ]", "date_str": "2026-10-19T13:59:12+00:00", "hash": "4932688da87b4275", "title_fa": "ایلان ماسک می‌گوید که یک سهم اسپیس ایکس را به هر بچه در آمریکا اهدا خواهد کرد - هدایایی که بالغ بر 10.5 میلیارد دلار خواهد بود.", "summary_fa": "آیا ایلان ماسک قصد دارد بخشی از ثروت خیره کننده خود را به اشتراک بگذارد یا در تلاش است تا نسل جدیدی از سرمایه گذاران را در SpaceX خود بسازد؟ اوایل دوشنبه، این ابر میلیاردر فناوری در X پست شد، سال آینده، من یکی از سهام اسپیس ایکس خود را به هر بچه ای در آمریکا خواهم داد. این اولین [ ] ماسک خواهد بود که ثروتمندترین فرد جهان توضیح نداد که چگونه به هر بچه ای در ایالات متحده یکی از سهام شرکتش تعلق می گیرد. اما این فقط یک افت در سطل ثروت کلی اوست: ماسک حدود 6.42 میلیارد سهام اسپیس ایکس را در اختیار دارد که نشان دهنده 48.4 درصد از سهام سودمند شرکت است. بر اساس گزارش بلومبرگ، به طور کلی، دارایی خالص او در حال حاضر 908 میلیارد دلار برآورد شده است. داستان‌های مرتبط «قطار به بوسان» کارگردان «یئون سانگ‌هو» «بهشت گمشده» فروش ۱۱۸ کشوری را پیش از جشنواره هاوایی به دست آورد. اداره سرشماری، 21.1٪ از تقریباً 341.8 میلیون نفر ساکن ایالات متحده تا ژوئیه 2025 کمتر از 18 سال داشتند که در کل حدود 72.1 میلیون نفر است. اگر همه 72 میلیون سهم اسپیس ایکس را دریافت کنند، ارزش کل 10.5 میلیارد دلار با قیمت فعلی سهام خواهد بود. شرکت ماسک که در Variety SpaceX محبوب است، شرکت سازنده موشک و اپراتور پرواز فضایی، ارائه‌دهنده خدمات اینترنت ماهواره‌ای، شرکت هوش مصنوعی و مالک X (توئیتر سابق) را در بر می‌گیرد. SpaceX در ژوئن به صورت عمومی عرضه شد. قیمت آن 150 دلار به ازای هر سهم بود، سپس در هفته پس از عرضه اولیه سهام به 225.64 دلار برای هر سهم رسید، اما از آن زمان کاهش یافته است. در حال حاضر زیر 150 دلار برای هر سهم معامله می شود. چه چیزی ماسک را تشویق کرد تا تعهدی برای اهدای سهام اسپیس"}, {"source": "Variety", "title": "‘Slow Horses’ Season 7 Taps ‘The Other Bennet Sister’ Star Varada Sethu, ‘Mank’s’ Tuppence Middleton", "link": "https://variety.com/2026/tv/global/slow-horses-season-7-varada-sethu-tuppence-middleton-1236916373/", "summary": "“Slow Horses” Season 7 has unveiled some new additions to the cast including Varada Sethu and Tuppence Middleton. Sethu recently appeared as Ann Baxter in “The Other Bennet Sister” and has also starred in Andor and Jurassic World: Dominion. Middleton has appeared in “The Forsytes” and “Downton Abbey: A New Era” as well as previously [ ]", "date_str": "2026-10-19T13:52:12+00:00", "hash": "09032dfc8e44bca5", "title_fa": "«اسب‌های آهسته» فصل هفتم، «خواهر دیگر بنت» ستاره وارادا ستو، «مانک» تاپنس میدلتون", "summary_fa": "فصل هفتم «اسب‌های آهسته» از تعدادی بازیگر جدید از جمله Varada Sethu و Tuppence Middleton رونمایی کرده است. ستو اخیراً در نقش آن باکستر در «خواهر دیگر بنت» ظاهر شد و در فیلم‌های Andor و Jurassic World: Dominion نیز بازی کرده است. میدلتون در «فورسایت‌ها» و «داونتون ابی: عصر جدید» ظاهر شده است و همچنین قبلاً [ ] «اسب‌های کند» فصل 7 از تعدادی بازیگر جدید از جمله Varada Sethu و Tuppence Middleton رونمایی کرده است. البته اولدمن ستاره سریال «اسب‌های آهسته» است، سریال تلویزیونی اپل درباره گروهی متشکل از ماموران اطلاعاتی MI5. در فصل هفتم که در Variety محبوب است، ایتان مورهاوس («مبلند»)، مراب نینیدزه («هوملند») و جاشوا مک‌گوایر («طلا») نیز به او خواهند پیوست. جیمز کالیس نیز در نقش کلود ویلان دلپذیر بازخواهد گشت. «اسب‌های آهسته» بر اساس بهترین کتاب «میک هرون» ساخته شده است. فصل هفتم از «بازیگران بد» اقتباس شده است. لمب و تیمش - که شامل جک لودن در نقش ریور کارترایت، کریستوفر چانگ در نقش رادی هو، ساسکیا ریوز در نقش کاترین استندیش و ایمی-فیون ادواردز در نقش شرلی داندر هستند - در حال شکار یک خال در قلب دولت بریتانیا قبل     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
