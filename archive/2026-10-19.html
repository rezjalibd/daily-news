ontroller it's a full shell that your Nintendo Switch slides into and locks in with a simple latch system that feels secure without being annoying to use. Once it's in place, it feels more like holding a proper controller with a screen attached the grips are thicker and shaped more like what you would find on a standard console controller, so your hands have something to rest on instead of flattening out against the Joy-Cons. The sticks are full-sized, the triggers have more travel, and there are four back buttons you can map if you like customizing controls. You still get motion controls and rumble, and there is also a USB-C passthrough for charging or video output. The right stick sits a bit too far out, so using it for camera control or aiming can feel cramped and slightly awkward. It is manageable for short bursts, but it can get uncomfortable over time. The kickstand is also limited it works, but you don't get much flexibility in how you prop the system up. And because everything is built into one shell, you lose the option to detach the controllers entirely, which is part of what makes the Switch unique in the first place. And while the added bulk improves grip, it makes the system less portable. Still, if you mostly play in handheld mode and want something sturdier with drift-resistant sticks, the Nitro Deck feels great, especially at this discounted price. Our Best Editor-Vetted Tech Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $199.00 (List Price $249.00) Apple HomeView Smart Display (Silver, 2026 Release) $289.99 (List Price $299.00) Apple TV 4K 4th Gen 12", "date_str": "2026-10-19T12:30:00+00:00", "hash": "43b3480e9e4cdc1a", "title_fa": "این جایگزین Joy-Con برای سوئیچ نینتندو در حال حاضر 56٪ تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. CRKD Nitro Deck (در نسخه Renegade Raider Fortnite Edition) به 34.99 دلار در W       media: [{"source": "Billboard", "title": "Este Haim Says Ursula & Stevie Nicks Inspired Her ‘Witchy’ Role as Marvel’s Newest Villain, Chooses Taylor Swift’s Most Autumnal Song", "link": "https://www.billboard.com/culture/tv-film/este-haim-how-stevie-nicks-ursula-inspired-marvel-role-1236362102/", "summary": "You may know Este Haim best as one-third of the sister rock trio HAIM , but to her friends children — and countless others who will tune in this Halloween season — she s going down in history as the voice behind Hallow s Eve in Marvel’s Spidey and the Avengers: Halloween Team Up . Related Taylor Swift s 13 Most Autumnal Songs (Led by All Too Well, of Course) Here s How Greta Gerwig Got Led Zeppelin to Say Yes to Using Stairway to Heaven in Narnia Trailer Anderson .Paak, Gabrielle Union and More Join A Proud Family Wizmas Holiday Special I got more calls about this than I did when [HAIM] released our first record, she tells Billboard after a busy morning spent promoting the project in New York City. All of my friends that have kids were just like, Why didn t you tell me about this? I m gonna be such a popular auntie at Christmastime. Her first-ever voice-acting project, the festive animated special — which premiered in late September on Disney Jr. and Disney+ — might seem like a random side quest for the eldest Haim sister, but in reality, it ties in a number of her favorite things. First of all, she s a longtime fan of Fall Out Boy, whose frontman Patrick Stump composes the music for Marvel s Spidey series and voiced Hallows Eve s sidekick, Jack O’Lantern, in the Halloween crossover with Avengers . Speaking of being a Disney villain, part of my evil plan was, This is my way of meeting Patrick Stump,' Este says. And I did it. I mean, we didn t meet in person, we met over Zoom. But that filled my cup, let me tell you. He s so nice, and he s so talented, and you can tell that he like really loves doing the music on this show. She s also a huge Halloween fan in general. Usually, she and her sisters, Danielle and Alana, do a group costume, which might be more complicated this year now that Este lives in New York City while the other two are still based in Los Angeles. We haven t really figured it out yet, Este says. We re running out of time, [but] I have faith. We re going to figure it out. But most significantly, Este has been dreaming of this opportunity for a very long time. To be honest, I wrote in my diary over 10 years ago, How fun would it be to be a Marvel villain?' she recalls. So I voiced it to the universe, and then here we are now. Marvel’s Spidey and the Avengers: Halloween Team Up chronicles how Hallow s Eve — a character taken directly from the comic books — and Jack O Lantern s mischievous plot to ruin Halloween forever by playing tricks on tri", "date_str": "2026-10-19T14:00:00+00:00", "hash": "26e7ea8ec4823806", "title_fa": "استه هایم می‌گوید اورسولا و استیوی نیک الهام‌بخش نقش «جادوگر» او به‌عنوان جدیدترین شرور مارول بودند و پاییزی‌ترین آهنگ تیلور سویفت را انتخاب کرد.", "summary_fa": "ممکن است استه هایم را به عنوان یک سوم از خواهر سه‌گانه راک HAIM بشناسید، اما برای فرزندان دوستانش - و تعداد بی‌شماری دیگر که در این فصل هالووین کوک می‌کنند - او به عنوان صدای پشت Hallows Eve در Marvel’s Spidey و Avengers: Halloween Team Up در تاریخ ثبت می‌شود. 13 آهنگ پاییزی ترین آهنگ تیلور سوئیفت مرتبط (البته به رهبری همه خیلی خوب) او به بیلبورد می گوید که [HAIM] پس از یک صبح پر مشغله برای تبلیغ پروژه در شهر نیویورک، اولین آلبوم ما را منتشر کرد. همه دوستان من که بچه دارند اینطور بودند که چرا این موضوع را به من نگفتی؟ من در کریسمس یک خاله محبوب خواهم بود. اولین پروژه صداپیشگی او، انیمیشن ویژه جشن - که در اواخر سپتامبر در دیزنی جونیور و دیزنی + نمایش داده شد - ممکن است به نظر یک جستجوی جانبی تصادفی برای بزرگترین خواهر هایم باشد، اما در واقعیت، به تعدادی از چیزهای مورد علاقه او گره می خورد. اول از همه، او یکی از طرفداران قدیمی Fall Out Boy است، که پاتریک استامپ، رهبر آن، موسیقی سریال Spidey مارول را می‌سازد و صداپیشگی همکار Hallows Eve، Jack O'Lantern، در کراس اوور هالووین با Avengers. استه می‌گوید، وقتی صحبت از شرور دیزنی شد، بخشی از نقشه شیطانی من این بود که این راه من برای ملاقات با پاتریک استامپ است. و من این کار را کردم. منظورم این است که ما شخصاً ملاقات نکردیم، ما از طریق زوم ملاقات کردیم. اما این جام من را پر کرد، بگذارید به شما بگویم. او خیلی خوب است، و بسیار با استعداد است، و می توانید بگویید که او واقعا دوست دارد موسیقی این برنامه را اجرا کند. او همچنین به طور کلی یک طرفدار بزرگ هالووین است. معمولاً او و خواهرانش، دانیل و آلانا، یک لباس گروهی می‌سازند، که"}, {"source": "Billboard", "title": "Mötley Crüe Plots 4th Las Vegas Residency Featuring Songs That Haven’t Been Played Live ‘In Decades’", "link": "https://www.billboard.com/music/rock/motley-crue-2027-las-vegas-carnival-sins-residency-dates-1236362235/", "summary": "Mötley Crüe fans are going to feel good about the band s latest news: After three prior stints in Sin City, the group is embarking on a fourth Las Vegas residency, Billboard can exclusively reveal. The heavy-metal rockers announced Monday (Oct. 19) that they ll be setting up shop at The Colosseum at Caesars Palace starting March 12, 2027, with a total of eight shows running through April 3. Alongside Billboard , Mötley Crüe shared the news via a characteristically spooky video featuring a sinister clown spokesperson, on par with the residency s theme: Carnival of Sins , named after the band s 2006 live album. Featuring stunning visuals and a fan-voted setlist of iconic hits including songs returning to the stage for the first time in decades this special limited run of performances promises to highlight the legendary bravado, spectacle, and high-voltage energy only Mötley Crüe can deliver, a press release reads. Tickets for the excursion will first become available for members of Mötley Crüe s S.I.N. Club and Citi card holders in a presale beginning at 10 a.m. PT on Tuesday (Oct. 20). Members of Caesars Rewards, Caesars Entertainment’s loyalty program, and Live Nation customers will then have access to a presale beginning at 10 a.m. PT on Thursday (Oct. 22), after which the remaining seats will go on sale on Friday (Oct. 23). A portion of the proceeds will go toward Nevada Partnership for Homeless Youth. Known as the pioneers of the hard rock Las Vegas residency, Mötley Crüe first hunkered down in Vegas in 2012 with its Takes On Sin City stint. The following year, the rockers returned with its Evening In Hell residency, after which it wouldn t embark on another Sin City stay until 2025. Though the band will undoubtedly have more than enough fan-favorite tracks to choose from in terms of setlist, it hasn t released a proper studio album since 2008. That year s Saints Of Los Angeles debuted at No. 4 on the Billboard 200 , a chart on which Mötley Crüe has notched 16 entries. See the Mötley Crüe At The Colosseum At Caesars Palace, Carnival Of Sins in Sin City dates below: March 2027 Marxh 19, 20, 24, 26, 27 and 31 April 2027 April 2 and 3 View this post on Instagram", "date_str": "2026-10-19T14:00:00+00:00", "hash": "ed86e5528a2584aa", "title_fa": "موتلی کرو چهارمین اقامتگاه لاس وگاس را با آهنگ هایی که \"در دهه ها\" به صورت زنده پخش نشده اند را طراحی می کند.", "summary_fa": "طرفداران Mötley Crüe نسبت به آخرین اخبار گروه احساس خوبی خواهند داشت: بیلبورد می تواند به طور انحصاری فاش کند پس از سه دوره قبلی در شهر گناه، گروه در حال شروع چهارمین اقامتگاه لاس وگاس است. راکرهای هوی متال دوشنبه (19 اکتبر) اعلام کردند که از 12 مارس 2027 در کولوسئوم در کاخ سزار دایر خواهند بود و در مجموع هشت نمایش تا 3 آوریل ادامه خواهند داشت. در کنار بیلبورد، موتلی کرو این خبر را از طریق یک ویدیوی ترسناک با یک سخنگوی دلقک شوم به اشتراک گذاشت، همتراز با موضوع محل اقامت: کارناوال گناهان، نامگذاری شده از آلبوم زنده گروه در سال 2006. در بیانیه مطبوعاتی آمده است که این مجموعه محدود اجراهای ویژه شامل تصاویری خیره کننده و مجموعه ای از آهنگ های محبوب از جمله آهنگ هایی که برای اولین بار در دهه ها به صحنه بازمی گردند، نوید برجسته کردن جسارت افسانه ای، تماشایی، و انرژی ولتاژ بالا را می دهد که فقط Mötley Crüe می تواند ارائه دهد. بلیت‌های این سفر ابتدا برای اعضای Mötley Crüe S.I.N در دسترس خواهد بود. دارندگان کارت باشگاه و سیتی در پیش فروش از ساعت 10 صبح روز سه شنبه (20 اکتبر) به وقت محلی آغاز می شوند. اعضای Caesars Rewards، برنامه وفاداری Caesars Entertainment و مشتریان Live Nation از ساعت 10 صبح به وقت PT در روز پنجشنبه (22 اکتبر) به پیش فروش دسترسی خواهند داشت و پس از آن، بقیه صندلی‌ها در روز جمعه (23 اکتبر) به فروش می‌رسند. بخشی از عواید به مشارکت نوادا برای جوانان بی خانمان اختصاص خواهد یافت. Mötley Crüe که به عنوان پیشگامان اقامتگاه هارد راک لاس وگاس شناخته می شود، برای اولین بار در سال 2012 در وگاس با حضور در شهر Takes On Sin City وارد شد. سال بعد، راکرها با اقامتگاه Evening In Hell خود بازگشتند، پس"}, {"source": "Billboard", "title": "Selena Gomez Laments How Nicotine Vaping ‘Changed’ Her Voice: ‘It’s So Stupid’", "link": "https://www.billboard.com/music/pop/selena-gomez-laments-nicotine-vaping-changed-voice-so-stupid-1236362611/", "summary": "Selena Gomez has always made a point of being very honest with her fans. Which is why it was not surprising that in a candid Instagram Story post on Sunday (Oct. 18), the 34-year-old singer got real about the negative effects of vaping nicotine has had on her voice. I m not gonna be able to change my voice, she said in the post . I vaped nicotine a lot Nicotine is so hard to quit, and I think I just wanted to say, if you’re going through it, or if you’re even trying to vape, it’s just not worth it. It’s so stupid, and it’s changed my voice.” The singer said that if fans don t like hearing her voice it s totally fine. Just don t listen to it. Just don t listen, she suggested. The good news is that Gomez said she s excited because she s stopped vaping. I just hope that I can keep it up, she added before giving her fans a positive affirmation to hold onto. If you are going through something, you can get through it too. It sucks. According to the Cleveland Clinic , among the dangers of vaping are addiction to nicotine, asthma, cancer, lung scarring, coughing, shortness of breath and a dry/irritated mouth and throat. Gomez, who has a noticeably husky, raspy voice at times, answered a fan question about her vocal quirkiness during an Instagram Live session last December. “Sometimes things happen,” she said, cutting her answer short before giving any specific details. “I get weird. My throat kind of swells inside sometimes. That’s all.” Gomez has also been candid over the years about her struggles with bipolar disorder and the autoimmune condition lupus , which can also cause vocal fatigue, hoarseness and a rough, altered vocal quality. The London-focused sixth season of Gomez s Hulu comedy series, Only Murders in the Building , returns on Dec. 8.", "date_str": "2026-10-19T13:00:53+00:00", "hash": "ee67d3dad5969b8c", "title_fa": "سلنا گومز ابراز تاسف", "summary_fa": "سلنا گومز همیشه صادقانه با طرفدارانش صحبت کرده است. به همین دلیل تعجب آور نبود که در یک پست صادقانه در استوری اینستاگرام در روز یکشنبه (18 اکتبر)، این خواننده 34 ساله از تأثیرات منفی نیکوتین بر روی صدایش آگاه شد. او در این پست گفت من نمی توانم صدایم را تغییر دهم. من نیکوتین زیاد مصرف کردم ترک کردن نیکوتین بسیار سخت است، و فکر می‌کنم فقط می‌خواستم بگویم اگر در حال گذراندن آن هستید، یا حتی اگر سعی می‌کنید سیگار بکشید، ارزشش را ندارد. این خیلی احمقانه است و صدای من را تغییر داده است.» این خواننده گفت که اگر طرفداران از شنیدن صدای او خوششان نمی آید، خیلی خوب است. فقط بهش گوش نده فقط گوش نده، او پیشنهاد کرد. خبر خوب این است که گومز گفت که او هیجان زده است زیرا او دیگر بخار نگرفته است. فقط امیدوارم که بتوانم آن را ادامه دهم، او قبل از اینکه به طرفدارانش تأیید مثبت بدهد، اضافه کرد. اگر از چیزی عبور می کنید، می توانید از آن نیز عبور کنید. به درد میخوره به گفته کلینیک کلیولند، از جمله خطرات سیگار کشیدن اعتیاد به نیکوتین، آسم، سرطان، زخم ریه، سرفه، تنگی نفس و خشکی/تحریک دهان و گلو است. گومز که گاهی صدایی درشت و خشن دارد، دسامبر گذشته در یک جلسه لایو اینستاگرام به یک سوال طرفداران در مورد عجیب بودن صدایش پاسخ داد. او گفت: «بعضی اوقات چیزهایی اتفاق می‌افتد. \"عجیب می شوم. گاهی اوقات گلویم در داخل متورم می شود. همین است.» گومز همچنین در طول سال‌ها در مورد مبارزه‌اش با اختلال دوقطبی و بیماری خودایمنی لوپوس که می‌تواند باعث خستگی صدا، گرفتگی صدا و تغییر کیفیت صدای خشن و خشن شود، صریح بوده است. فصل ششم سریال کمدی هولو گومز با محوریت لندن، فقط قتل‌ها در ساختمان، در 8 دسامبر باز می‌گردد."}, {"source": "Billboard", "title": "KATSEYE Give Crucial Update on Sophia Laforteza’s Return: ‘We Can’t Wait For Her to Come Back’", "link": "https://www.billboard.com/music/pop/katseye-update-sophia-laforteza-return-timeline-1236362606/", "summary": "KATSEYE are planning to welcome member Sophia Laforteza back sooner than you think. At Sunday night s (Oct. 18) 2026 Victoria s Secret Fashion Show, Lara Raj, Megan Skiendiel, Yoonchae Jeong and Daniela Avanzini gave the first timeline for Laforteza s return from a temporary hiatus the group s label announced in April to allow the 23-year-old singer to focus on her mental health and wellness. We are so happy that she s coming back, Raj told E! News at the VS show, where she strutted the catwalk along with Skiendiel, Jeong and Avanzini before the group performed Pinky Up and Animal. We re so proud of her. She s really been so brave, she added. We respect her so much for taking the space and taking time for her health. She s our sister, so we can t wait for her to come back. KATSEYE are in the midst of their first-ever arena tour, with upcoming dates slated for Tuesday (Oct.20) in Charlotte, N.C., as well as gigs across North America through Nov. 24, wrapping up with two shows at Palacio de los Deportes in Mexico City on Nov. 27 and 28. The group said they are ready for Laforteza to be back in the fold in January. We ve been through so much together, and we ve built such a family together, Skiendiel said. Being able to go through this journey with my sisters has just been the best experience of my life. Earlier this month, the group s label, HYBE x Geffen, first confirmed that Laforteza would be back on stage in January . “Sophia has been prioritizing her health and well-being with our full support and resources,” the company said in a statement, noting that the singer would not be part of the North American WILDWORLD tour or any promotional activities for the remainder of this year. “We look forward to welcoming her back as KATSEYE continues this next chapter together in 2027,” the statement continued. “We are incredibly grateful to EYEKONS for the continued love, support, and understanding you’ve shown Sophia and KATSEYE. Thank you for standing by her, and we look forward to celebrating her return with you in the new year.” In her own update on her Instagram Story, Laforteza described the work she s been doing since going on hiatus. “It hasn’t been easy,” she wrote. “But I have been putting in the work by receiving the care I need, learning the tools to better support myself, and doing everything I can to nurture my well-being, noting that her goal is to return, happier, healthier, stronger and more grounded. In addition to Laforteza s hiatus, fellow band ", "date_str": "2026-10-19T12:32:48+00:00", "hash": "1fefb8b3e36427e5", "title_fa": "KATSEYE به روز رسانی مهمی در مورد بازگشت سوفیا لافورتزا: \"ما نمی توانیم صبر کنیم تا او برگردد\"", "summary_fa": "KATSEYE در حال برنامه ریزی برای استقبال از عضو Sophia Laforteza زودتر از آنچه فکر می کنید. در یکشنبه شب (18 اکتبر) 2026 فشن شو ویکتوریا سکرت، لارا راج، مگان اسکیندیل، یونچای جونگ و دانیلا آوانزینی اولین جدول زمانی بازگشت لافورتزا از یک وقفه موقتی را که لیبل گروه در آوریل اعلام کرد ارائه کردند تا به خواننده 23 ساله اجازه دهد تا بر سلامت روان و سلامت او تمرکز کند. راج به E گفت: ما از بازگشت او بسیار خوشحالیم! اخبار در نمایش VS، جایی که او به همراه اسکیندیل، جئونگ و آوانزینی قبل از اجرای گروه Pinky Up و Animal روی کت واک رفت. ما خیلی به او افتخار می کنیم او افزود که او واقعاً بسیار شجاع است. ما به او احترام زیادی می گذاریم که این فضا را می گیرد و برای سلامتی اش وقت می گذارد. او خواهر ماست، پس نمی‌توانیم صبر کنیم تا او برگردد. KATSEYE در بحبوحه اولین تور عرصه خود در تاریخ است، با تاریخ های آینده برای سه شنبه (20 اکتبر) در شارلوت، N.C، و همچنین کنسرت هایی در سراسر آمریکای شمالی تا 24 نوامبر، با دو نمایش در Palacio de los Deportes در مکزیکوسیتی در تاریخ 27 و 28 نوامبر آماده است. ژانویه. اسکیندیل گفت: ما خیلی چیزها را با هم گذرانده ایم و چنین خانواده ای را با هم ساخته ایم. اینکه توانستم این سفر را با خواهرانم پشت سر بگذارم بهترین تجربه زندگی من بوده است. در اوایل این ماه، لیبل گروه، HYBE x Geffen، برای اولین بار تایید کرد که لافورتزا در ژانویه به روی صحنه خواهد رفت. این شرکت در بیانیه‌ای گفت: «سوفیا سلامت و رفاه خود را با حمایت و منابع کامل ما در اولویت قرار داده است. در ادامه بیانیه آمده است: \"ما مشتاقانه منتظر بازگشت او هستیم زیرا KATSEYE فصل بعدی را با"}, {"source": "Billboard", "title": "Jamie T Scores Second Consecutive U.K. No. 1 Album With ‘Ghosts (100 Days of Morning)’", "link": "https://www.billboard.com/music/chart-beat/jamie-t-uk-number-one-album-ghosts-100-days-morning-1236362588/", "summary": "Jamie T has earned his second consecutive chart-topping album as Ghosts (100 Days of Morning) enters the U.K.’s Official Albums Chart at No. 1. The indie icon first hit the top of the charts in 2022 with The Theory of Whatever , his fifth studio album. All six of Jamie T’s studio albums have all peaked inside the top five following Panic Prevention (2007, No. 4), Kings Queens (2009, No. 2), Carry on the Grudge (2014, No. 4) and Trick (2016, No. 3). British drum’n’bass duo Chase Status end the week at No. 2 with their eighth studio album, Generic Everything . The placing matches their previous best with 2011’s Idols and 2013’s Brand New Machine . Olivia Rodrigo’s you seem pretty sad for a girl so in love holds its position at No. 3, followed by Michael Jackson’s The Essential greatest hits collection. Olivia Dean’s The Art of Loving lifts two places to No. 5; the album will compete at the Mercury Prize ceremony this Thursday (Oct. 22) in Newcastle upon Tyne alongside RAYE’s This Music May Contain Hope , Paul McCartney’s The Boys of Dungeon Lane and more. Troye Sivan earns a fourth top 10 placing on the Official Albums Chart with new LP She’s The Best (No. 9), following 2015’s Wild (No. 5), 2018’s Bloom (No. 10), 2023’s Something To Give Each Other (No. 4). Pet Shop Boys score a 28th top 40 album with their Alan Turing tribute record, A man from the future (No. 19). Geese frontman Cameron Winter, meanwhile, earns his first solo project inside top 40 with his acclaimed Live At Carnegie Hall LP at No. 20.", "date_str": "2026-10-19T11:57:13+00:00", "hash": "51c36533fd4ae7ce", "title_fa": "جیمی تی برای دومین بار پیاپی آلبوم شماره 1 بریتانیا را با \"ارواح (100 روز صبح)\" به دست آورد.", "summary_fa": "جیمی تی دومین آلبوم متوالی خود را در صدر جدول به دست آورد زیرا Ghosts (100 Days of Morning) در جدول آلبوم های رسمی بریتانیا در رتبه 1 قرار گرفت. نماد مستقل برای اولین بار در سال 2022 با The Theory of Whatever، پنجمین آلبوم استودیویی خود، در صدر جدول قرار گرفت. هر شش آلبوم استودیویی جیمی تی همگی در بین پنج آلبوم برتر قرار گرفته‌اند که عبارتند از: پیشگیری از وحشت (2007، شماره 4)، Kings Queens (2009، شماره 2)، Carry on the Grudge (2014، شماره 4) و Trick (2016، شماره 3). گروه موسیقی دو نفره درام اند بیس بریتانیا، Chase Status، هفته را با هشتمین آلبوم استودیویی خود، Generic Everything، در رتبه دوم به پایان رساندند. این جایگاه با بهترین های قبلی خود با Idols 2011 و Brand New Machine در سال 2013 مطابقت دارد. به نظر می‌رسد اثر اولیویا رودریگو شما برای یک دختر بسیار غمگین است، بنابراین عاشق جایگاه خود را در رتبه 3 قرار می‌دهد و پس از آن مجموعه آثار برتر The Essential اثر مایکل جکسون قرار دارد. کتاب The Art of Loving اثر Olivia Dean دو رتبه را به رتبه 5 می رساند. این آلبوم در مراسم جایزه مرکوری این پنجشنبه (اکتبر. 22) در نیوکاسل از تاین در کنار این موسیقی ممکن است امید داشته باشد از RAYE، پسران سیاه چال پل مک کارتنی و غیره. تروی سیوان با آلبوم جدید She’s The Best (شماره 9)، پس از وایلد (شماره 5)، بلوم 2018 (شماره 10)، 2018 بلوم (شماره 10)، سال 2023، چیزی برای دادن به یکدیگر (شماره 4) چهارمین 10 آلبوم برتر را به دست آورد. پت شاپ بویز با رکورد ادای احترام آلن تورینگ، مردی از آینده (شماره 19) بیست و هشتمین آلبوم برتر 40 آلبوم را به ثمر رساند. در همین حال، کامرون وینتر، خواننده گروه Geese، اولین پروژه انفرادی خود را"}, {"source": "Billboard", "title": "Taylor Swift Earns Third Consecutive Week as U.K. No. 1 With ‘Patient Zero’", "link": "https://www.billboard.com/music/chart-beat/taylor-swift-third-week-uk-no-1-patient-zero-1236362594/", "summary": "Taylor Swift is No. 1 on the U.K.’s Official Singles Chart for a third consecutive week with “Patient Zero” (charts dated Oct. 17). The song appeared on the Encore deluxe edition of her record-breaking album The Life of a Showgirl alongside new tracks “Cleveland!,” “Pink Clouding” and “Babylon.” Swift premiered the music video for “Patient Zero” on Sept. 27 at the 2026 MTV VMAs , where she also collected the inaugural artist director prize. “Patient Zero” is Swift’s third U.K. No. 1 of 2026 following “Opalite” and Toy Story 5 track “I Knew It, I Knew You.” On Saturday (Oct. 17), Swift gave a surprise live performance at the Academy Museum Gala, and gave The Life of a Showgirl track “The Fate of Ophelia” its live debut. Cardiff-born Jamie Miller follows at No. 2 as his breakout single “Babydoll” rises one place to a new peak. Ashe’s “Stop The Wedding!” is up one spot to reach a new best for the rising pop act. Sienna Spiro’s “Great Expectation is down two spots to No. 4, followed by Adéla’s Nicole Kidman” at No. 5, up three on last week. 13 years after its original release, P!nk’s “Just Give Me a Reason” is back inside the top 40 and up to No. 15 as it enjoys a spike on streaming following attention on social media. Recent Billboard cover star Noah Kahan sees gains for “Willing and Able” which rises three spots to No. 17. Rising R B and rap artist Season 25 earns his first top 40 placing with “Shotta’s” up to No. 38.", "date_str": "2026-10-19T11:54:08+00:00", "hash": "1885c8f453d709da", "title_fa": "تیلور سوئیفت با «بیمار صفر» سومین هفته متوالی رتبه اول بریتانیا را کسب کرد.", "summary_fa": "تیلور سوئیفت برای سومین هفته متوالی با «Patient Zero» (نمودار مورخ 17 اکتبر) شماره 1 جدول تک‌نفره‌های رسمی بریتانیا است. این آهنگ در نسخه لوکس Encore آلبوم رکوردشکن او به نام The Life of a Showgirl در کنار آهنگ‌های جدید «Cleveland!»، «Pink Clouding» و «Babylon» ظاهر شد. سوئیفت موزیک ویدیوی «Patient Zero» را در 27 سپتامبر در MTV VMA 2026 به نمایش گذاشت، جایی که او جایزه کارگردانی هنرمند افتتاحیه را نیز دریافت کرد. «بیمار صفر» سومین شماره سوئیفت در بریتانیا است. 1 از 2026 به دنبال آهنگ \"Opalite\" و Toy Story 5 \"I Knew It, I Knew You.\" روز شنبه (17 اکتبر)، سوئیفت یک اجرای زنده غافلگیرکننده در گالا موزه آکادمی اجرا کرد و آهنگ The Life of a Showgirl \"The Fate of Ophelia\" را برای اولین بار به صورت زنده اجرا کرد. جیمی میلر که در کاردیف متولد شده است در رتبه دوم قرار می گیرد و تک آهنگ او \"Babydoll\" یک مکان به اوج جدیدی می رسد. Ashe's \"Stop The Wedding!\" یک نقطه برای رسیدن به بهترین جدید برای کنش پاپ در حال رشد است. فیلم «انتظار بزرگ» از سینا اسپیرو دو پله در رتبه اول قرار دارد. 4، و پس از آن نیکول کیدمن از آدلا در رتبه 5، سه افزایش نسبت به هفته گذشته. 13 سال پس از انتشار اولیه، P!nk با نام \"Just Give Me a Reason\" دوباره در بین 40 فیلم برتر و رتبه 15 قرار گرفته است، زیرا از افزایش پخش جریانی در رسانه های اجتماعی برخوردار است. اخیراً \"نوآ کاهان\" ستاره کاور بیلبورد را به خود جلب کرده است. شماره 17. Rising R B و هنرمند رپ فصل 25 اولین رتبه 40 برتر خود را با \"Shotta's\" تا شماره 38 به دست آورد. «Patient Zero» سومین شماره 1 سوئیفت در بریتانیا در سال 2026 پس از آهنگ «Opalite» و «Toy Story"}, {"source": "Billboard", "title": "Miley Cyrus Hits Back at Criticism of First Hollywood Bowl Show: ‘The Only Thing That I Have Is This Moment With All of You’", "link": "https://www.billboard.com/music/pop/miley-cyrus-responds-criticism-first-hollywood-bowl-show-1236362598/", "summary": "After telling fans on night one (Oct. 16) at the Hollywood Bowl that it had always been a dream of hers to play the iconic Los Angeles venue, Miley Cyrus hit back at critics of that performance during her second show on Sunday night (Oct. 18). Related ONEFOUR Team Up With Penrith Chamber Orchestra for World-Premiere Made Men Show ‘I’m Experiencing Everything I’ve Ever Wanted’: Recapping Miley’s Live Return, On Her Own Terms Wolfmother, Ball Park Music and Yothu Yindi to Headline Sydney s Aloha Festival “I’ve never heard that I don’t put my heart into something,” Cyrus told the audience at her second Hollywood Bowl show, according to a video of her comments posted on X by The Hollywood Reporter . “I don’t know if any of you heard that. That somebody was doing commentary to get clickbait on their video talking about my show on Friday night, but I’m a lot of things, yeah, and we’re not even going to entertain that.” Though she didn t refer to a specific complaint, the comments were seemingly in reference to videos that claimed Miley (the singer recently changed her stage name to a mononym) was not fully present and did not sing all the words at her first full concert in four years. You all have been with me long enough to know that anytime I m doing something meaningful that s gonna be a stepping stone in my life, in my career to become the artist and the person that I want to be, she said. You know that it s been controversial. And the controversy, you know, it used to be a lot of fun. It still can be. I can be pretty melted. I love that about me. I actually used to live my life pretty hard. Because life’s hard, so I thought I had to get hard. … But, you know, I didn’t enjoy my life as much when I was living hard. I love pouring myself into something.” Then Cyrus got real about the difficulty of getting back on stage to perform after so many years and her decision to step back from the rigors of major tours. “It is hard for me to stand up here and do this show,” Miley added. “It does not come as natural as it once did to me before. Because, like all of us, we change, we evolve, we grow, and we find what gets to come with us. What continues to fit. And you all are more to me than an experiment. That is absolutely not what this is. This is not an experiment of you. This is an experience for me. You all make the experience possible. The only way that I get to test my personal boundaries, my limits, what I think I can do The singer got real, admitting that befor", "date_str": "2026-10-19T11:50:37+00:00", "hash": "f1cfda34c3a6c6dd", "title_fa": "مایلی سایرس به انتقاد از اولین نمایش کاسه هالیوود پاسخ داد: \"تنها چیزی که من دارم این لحظه با همه شماست\"", "summary_fa": "مایلی سایرس پس از اینکه در شب اول (16 اکتبر) در هالیوود بول به طرفداران گفت که بازی در مکان نمادین لس آنجلس همیشه رویای او بوده است، مایلی سایرس در دومین برنامه خود در یکشنبه شب (18 اکتبر) به منتقدان آن اجرا پاسخ داد. تیم مرتبط ONEFOUR با ارکستر مجلسی پنریث برای اولین نمایش جهانی مردانه ساخته شده «من هر چیزی را که همیشه می‌خواستم تجربه می‌کنم» را تجربه می‌کنم: بازخوانی بازگشت زنده مایلی، با شرایط خودش گرگ‌مادر، موسیقی بال پارک و یوتو ییندی به عنوان سرفصل سیدنی، چیزی را نشنیدم که آلوها در سیدنی قرار گرفت. بر اساس ویدئویی که توسط هالیوود ریپورتر از نظرات او در X منتشر شده است، مخاطبان دومین برنامه هالیوود بول او. \"من نمی دانم که آیا هیچ یک از شما این را شنیده اید یا خیر. اینکه یک نفر در حال تفسیر برای دریافت طعمه کلیک روی ویدیوی خود بود که در مورد برنامه من در جمعه شب صحبت می کرد، اما من خیلی چیزها را دوست دارم، بله، و ما حتی قرار نیست آن را سرگرم کنیم.\" اگرچه او به شکایت خاصی اشاره نکرد، اما ظاهراً نظرات مربوط به ویدیوهایی بود که ادعا می کردند مایلی (این خواننده اخیراً نام هنری خود را به یک نام متفرقه تغییر داده است) به طور کامل حضور نداشته و در اولین کنسرت کامل خود در چهار سال گذشته تمام کلمات را نخوانده است. او گفت: همه شما به اندازه کافی با من بوده اید تا بدانید که هر زمان که من کاری معنادار انجام می دهم که می تواند پله ای در زندگی من باشد، در حرفه من برای تبدیل شدن به هنرمند و شخصی که می خواهم باشم. می دانید که بحث برانگیز بوده است. و جنجال، می دانید، قبلاً بسیار سرگرم کننده بود. هنوز هم می تواند باشد. من می توانم خیلی"}, {"source": "Billboard", "title": "Kings of Leon Announce 2027 Australian Tour, Headlining Sydney Summertime", "link": "https://www.billboard.com/music/concerts/kings-of-leon-sydney-summertime-ocean-alley-1236362575/", "summary": "Kings of Leon will tour Australia in February and March 2027, playing outdoor shows in Sydney, Brisbane and Melbourne with Australian band Ocean Alley as special guests. The run opens in Auckland and follows the Nov. 6 release of their 10th studio album, O My Beloved . The Sydney show is their headline slot at Sydney Summertime on Sunday, Feb. 28, with the new outdoor concert series at Centennial Park run by Black Peach . The series previously announced The Strokes as its first headliner for Feb. 20, with Beck, Courtney Barnett and Promiseland, making Kings of Leon the second international headliner. More headliners are set to be announced in the coming months. From there, the band plays Brisbane Showgrounds on Wednesday, March 3, and Flemington Racecourse in Melbourne on Friday, March 5, after opening at Live at The Domain in Auckland on Wednesday, Feb. 24. The dates skip Adelaide and Perth. The tour follows a stripped-back turn for the Followill family band, brothers Caleb, Nathan and Jared and cousin Matthew. O My Beloved is their first self-produced full-length, released via Love Tap Records and Virgin Music Group two years after 2024’s Can We Please Have Fun . The 11-track set reflects on their families, childhoods and shared history. The band announced it Sept. 10 with the single “My Whole World” and a sold-out show at The Basement East in Nashville. “KOYSAR” is also out. JamBase reported that Caleb Followill wrote “My Whole World” while recovering from a foot injury, and that the band set aside several more electric songs for the quieter material. “I thought, wouldn’t it be beautiful to ma  "title_fa": "داستان رهبر روحانی یهودی، ربه، که توسط بیل کلینتون و جورج دبلیو بوش به رسمیت شناخته شد، در فیلم مستند \"فرستاده نور\" گفته می شود.", "summary_fa": "انحصاری: خاخام مناخم مندل اشنیرسون، معروف به ربه، داستان خود را در یک فیلم مستند از تیم سازنده The Journey of Menachem Begin و با محوریت: Joe Lieberman روایت می‌کند. این سند، فرستاده نور، دوربین‌هایی را به نمایش می‌گذارد و رهبر تحول‌آفرین جنبش چاباد-لوباویچ را مستند می‌کند. آموزه های ربه تحت تأثیر [ ] این فیلم مستند داستان رب را از طریق یکی از قابل مشاهده ترین و بحث برانگیزترین ایده های او بازگو می کند: منورای عمومی. برای ربه، نور هانوکا باید دیده شود، نه اینکه پشت درهای بسته نگه داشته شود. هنگامی که منوراهای غول پیکر در میادین عمومی در سراسر آمریکا شروع به برخاستن کردند، آتش یک مبارزه ملی را بر سر اینکه زندگی یهودی چقدر باید قابل مشاهده باشد، برانگیخت و هم این سوال و هم مرد پشت آن را در مرکز زندگی عمومی آمریکا قرار داد. اخبار مرتبط اخبار Paper Tiger Furies برای جشنواره فیلم دوحه نمایش های گالا اخبار Huw Edwards درام برای Skydance UK Network 5 در حال بررسی توسط Ofcom The Rebbe با بوش، رونالد ریگان، جیمی کارتر و جرالد فورد ملاقات کرد. کلینتون پس از مرگش مدال طلای کنگره را به خاطر رهبری اخلاقی‌اش به او اعطا کرد و بوش او را به دفتر بیضی دعوت کرد تا از تعهدش به آموزش قدردانی کند. راشل گرینبرگ کارگردان گفت: «آنچه مرا به سمت ربه جذب کرد تأثیر فوق‌العاده‌ای بود که یک مرد می‌توانست بر جهان داشته باشد. «منورای عمومی دریچه‌ای به دید بزرگ‌تر او ارائه می‌دهد: این باور که هویت یهودی باید آشکارا پذیرفته شود و هر فرد، صرف‌نظر از ایمان یا پیشینه، مسئولیت ایجاد تفاوت را دارد. از طریق این فیلم، ما مردی را که در پس آن دیدگاه قرار دارد، بررسی خواهیم کرد، که چگونه دیگران را الهام بخشید تا آن را زنده کنند، و نمونه او چه چیزی می"}, {"source": "Deadline", "title": "Thessaloniki: Walter Thompson-Hernández’s ‘If I Go Will They Miss Me’ Among Titles Set For International Competition", "link": "https://deadline.com/2026/10/thessaloniki-international-competition-2026-1237167437/", "summary": "EXCLUSIVE: Walter Thompson-Hernández’s buzzy indie feature If I Go Will They Miss Me is among 10 titles screening in the International Competition at this year’s Thessaloniki Film Festival. If I Go Will They Miss Me debuted at this year’s Sundance Film Festival and was released theatrically by James Shani’s Rich Spirit. Danielle Brooks, J. Alphonse [ ]", "date_str": "2026-10-19T13:20:48+00:00", "hash": "71dde87e61a6ccfc", "title_fa": "تسالونیکی: والتر تامپسون-هرناندز «اگر بروم دلتنگ من خواهند شد» در میان عناوین مسابقه بین‌المللی", "summary_fa": "اختصاصی: فیلم مستقل والتر تامپسون-هرناندز، اگر بروم، دلتنگ من خواهند شد، در میان 10 عنوانی است که در رقابت بین المللی جشنواره فیلم تسالونیکی امسال به نمایش درآمده است. اگر من بروم، آیا آنها برایم تنگ خواهند شد در جشنواره فیلم ساندنس امسال برای اولین بار توسط فیلم Rich Spirit ساخته جیمز شانی اکران شد. دانیل بروکس، جی. آلفونس [ ] هیئت داوران مسابقه بین المللی امسال در تسالونیکی توسط گایا فورر، برنامه نویس فیلم و مدیر هنری Giornate degli Autori رهبری می شود. آشیلئاس کیریاکیدیس، نویسنده، مترجم، فیلمنامه نویس و فیلمساز؛ و جک تارلینگ، تهیه کننده. تماشا در ددلاین جایزه اسکندر طلایی «تئو آنجلوپولوس» بهترین فیلم بلند با 10000 یورو جایزه نقدی همراه است، در حالی که جایزه بهترین کارگردانی اسکندر نقره ای 5000 یورو جایزه نقدی دارد. هیئت داوران جایزه بهترین بازیگر مرد و جایزه بهترین بازیگر زن را نیز اهدا خواهد کرد. هیئت داوران همچنین ممکن است جایزه بهترین فیلمنامه یا جایزه بهترین دستاورد هنری را اعطا کند. برای مشاهده لیست کامل عناوین مسابقات بین المللی به پایین بروید. · عشق جدید شجاع، ماریا بک، دانمارک-سوئد-یونان، 106΄ · اگر من بروم دلتنگ من خواهند شد، والتر تامپسون-هرناندز، ایالات متحده آمریکا، 91΄ · Les Indes، Pauline Julier، Nicolas Chapoulier، Switzerland-Suden-Greece، NetherGame، 81'Spain، Saint-andres 95΄ · The Incomer, Louis Paxton, UK, 101' · The Riverbank, Enock Carvalho, Matheus Farias, برزیل-آلمان, 119' · Too Many Beasts, Sarah Arnold, فرانسه, 95' · A Day in the Life of Jo: Chapter Phaedra 8, Jacque-Franceu, Greece-8-Franceu."}, {"source": "Deadline", "title": "‘Grey’s Anatomy’ Star Kevin McKidd & Laura Fraser Cast In BBC’s ‘The Young Team’ From Director Paul McGuigan", "link": "https://deadline.com/2026/10/bbc-the-young-team-kevin-mckidd-laura-fraser-paul-mcguigan-1237167419/", "summary": "EXCLUSIVE: Grey s Anatomy star Kevin McKidd and Laura Fraser (Breaking Bad) have been cast in the BBC’s The Young Team, a homecoming project for McKidd and director Paul McGuigan. The pair will star alongside a clutch of young talent who have appeared in the likes of Mobland, 28 Years Later: The Bone Temple and Half [ ]", "date_str": "2026-10-19T13:00:00+00:00", "hash": "d5d544675bfc6d69", "title_fa": "کوین مک‌کید ستاره‌های «Grey’s Anatomy» و لورا فریزر بازیگران «تیم جوان» بی‌بی‌سی از کارگردان پل مک‌گیگان", "summary_fa": "اختصاصی: کوین مک‌کید، ستاره Gray s Anatomy و لورا فریزر (Breaking Bad) در سریال The Young Team بی‌بی‌سی، پروژه بازگشت به خانه مک‌کید و کارگردان پل مک‌گویگان، انتخاب شدند. این زوج در کنار گروهی از استعدادهای جوان که در فیلم‌هایی مانند موبلند ظاهر شده‌اند، 28 سال بعد: معبد استخوانی و نیمه [ ] به کارگردانی شماره خوش شانس اسلوین مک‌گویگان و توزیع‌شده توسط فاکس اینترتینمنت گلوبال، تیم جوان نوجوانی را دنبال می‌کند که آزی ویلیامز در یک شب در خیابان، آزی ویلیامز و دوستانش را در خیابانی در جمعه شب، در خیابان اس. بطری های شراب تونیک در دست و تکنو نوازی از بلندگوهای حلبی. آزی آماده سیگار کشیدن، مصرف قرص، نوشیدن شراب و مبارزه است. او مشتاق است که به طور کامل وارد باند محلی شود. اما وقتی آزی که مصمم است خود را ثابت کند، حرکتی جسورانه انجام می دهد، درگیری وحشیانه باندی با آزی در قلب آن بسیار محکم رخ می دهد. اخبار مرتبط اخبار Tall Tales قتل به امتیازات بین المللی جدید تبدیل می شود زیرا فصل 2 اخبار شکل می گیرد خائنان مشهور: بی بی سی می گوید این کاملاً نادرست است. در ددلاین در کنار مک‌کید و فریزر تماشا کنید، این سریال جاکوب جیمز اسمیت (MobLand) را در نقش آزی، کانر نیوال (28 سال بعد: معبد استخوان، نعناع) در نقش کنزی بزرگ و اسکات گرینن (نیم مرد، بازی‌های گرسنگی: طلوع آفتاب در درو) در نقش اک انتخاب کردند."}, {"source": "Deadline", "title": "‘NAZA, حه برای نمایش چهار فیلم قطری در لحظه عطف برای اخبار صنعت محلی جیمز گری می گوید که او دو عاشق را در نظر می گیرد اولین فیلم موفق او: به فیلم هایی که قبل از این بسیار ساخته بودم توجه نمی کنم. مجموعه Gala همچنین شامل فیلم ماجراجویی خانوادگی Fing کارگردان استرالیایی Jeffrey Walker است! ; ادوارد گفت: بین دنیاها و صخره های سرخ برونو دومونت، منتخب تورنتو از Maiken Baird. منتخب نمایش‌های ویژه شامل «آرتو» ساخته عبدالرحمن سیساکو، اولین فیلم غوطه‌ورانه ۳۶۰ درجه کارگردان تیمبوکتو مالیایی‌تبار موریتانیایی است که توسط کمیته فیلم نیز حمایت شد."}, {"source": "Deadline", "title": "Huw Edwards Drama For Skydance UK Network 5 Being Probed By Ofcom", "link": "https://deadline.com/2026/10/huw-edwards-5-drama-ofcom-investigation-power-downfall-1237167389/", "summary": "Power: The Downfall of Huw Edwards is being probed by Ofcom over fairness and privacy. An investigation has been launched into the two-part series for Skydance UK network 5 under the fairness and privacy section of the regulator s Broadcasting Code. No more detail was forthcoming. We are investigating a fairness and privacy complaint about this [ ]", "date_str": "2026-10-19T09:52:03+00:00", "hash": "d2816470e2fb81b4", "title_fa": "درام Huw Edwards برای Skydance UK Network 5 در حال بررسی توسط آفکام", "summary_fa": "Power: Downfall of Huw Edwards توسط Ofcom بر سر رعایت انصاف و حفظ حریم خصوصی بررسی می شود. تحقیقاتی در مورد این سریال دو قسمتی برای شبکه 5 Skydance UK تحت بخش انصاف و حفظ حریم خصوصی در کد پخش مقررات تنظیم کننده آغاز شده است. جزئیات بیشتری در دسترس نبود. ما در حال بررسی یک شکایت انصاف و حفظ حریم خصوصی در مورد این هستیم [ ] با بازی مارتین کلونز در نقش ادواردز، پاور اتهامات مربوط به رابطه بین مجری اخبار بی بی سی و یک نوجوان آسیب پذیر را بررسی کرد. ادواردز به یکی از شناخته شده ترین مجریان اخبار بریتانیا تبدیل شد، قبل از اینکه اتهامات سوء رفتار در محل کار و محکومیت پورنوگرافی کودک شهرت او را خراب کرد. در سال 2024، او به ساختن تصاویر ناشایست از کودکان اعتراف کرد و به حبس تعلیقی محکوم شد. اخبار مرتبط اخراج‌ها در جشنواره‌های ریکوشه تهیه‌کننده در تعمیرگاه اتفاق می‌افتند نکات مهم MIPCOM 2026: گشت و گذار در موج جدید تلویزیون با YouTube، Baywatch، Skydance، Banijay More ادواردز علناً از این 5 درام انتقاد کرده است و می‌گوید تیم پشت آن هیچ تلاشی برای تأیید داستان آن نکرده است. Watch on Deadline ادواردز علناً نگفته است که شکایت کرده است، اما این نوع شکایات باید یا از طرف شخص تحت تأثیر قرار گرفته باشد یا توسط شخصی مجاز توسط شخص تحت تأثیر، طبق کد Ofcom. آفکام اکنون قبل از تصمیم گیری از هر دو طرف نمایندگی خواهد گرفت و این می تواند شامل یک جلسه استماع خصوصی با شاکی، 5 و تهیه کننده Wonderhood Studios باشد. سخنگوی 5 به ددلاین گفت: ما پای برنامه ایستاده ایم و قاطعانه از این شکایت دفاع خواهیم کرد. 5 (کانال 5 سابق) قبلاً گفته بود که پاور بر اساس مصاحبه‌های گسترده با قربانی و خانواده‌اش و همچنین گزارش دادگاه بوده است."}, {"source": "Deadline", "title": "‘Tall Tales & Murder’ Scores New International Deals As Season 2 Takes Shape", "link": "https://deadline.com/2026/10/tall-tales-and-murder-international-season-2-chris-addison-1237167375/", "summary": "EXCLUSIVE: Crime caper Tall Tales Murder has racked up more international sales as the team behind the show turn their attention to Season 2. The series bowed on RTÉ in Ireland last month to critical acclaim, and it will soon be on the BBC in the UK. Filmin has now nabbed the Avalon-distributed show [ ]", "date_str": "2026-10-19T09:29:53+00:00", "hash": "fe9ad0aa53952277", "title_fa": "«داستان‌های بلند و قتل» با شکل‌گیری فصل دوم، معاملات بین‌المللی جدیدی به‌دست می‌آورد", "summary_fa": "انحصاری: فیلم جنایی Tall Tales Murder فروش بین المللی بیشتری را به خود اختصاص داده است زیرا تیم سازنده سریال توجه خود را به فصل 2 معطوف کرده است. این سریال ماه گذشته در RTÉ در ایرلند مورد تحسین منتقدان قرار گرفت و به زودی در بی بی سی در بریتانیا پخش خواهد شد. فیلمین اکنون نمایش توزیع شده توسط آوالون [ ] Tall Tales Murder بر اساس «سه گانه دوبلین» اثر Caimh McDonnell ساخته شده است و سفارشی دو فصلی را دریافت کرده است. آوالون این سریال را با متروپولیتن پیکچرز تولید می کند. این اثر توسط استوارت کارولان (عشق/نفرت) نوشته شده است. اخبار مرتبط اخبار خائنان مشهور: بی‌بی‌سی می‌گوید کاملاً نادرست است جیمز آکاستر از بازیگران همکارش شکایت کرد اخبار ماچو بانتر ما هرگز به خاطر هوش مصنوعی به مخاطبان دروغ نخواهیم گفت، کیت فیلیپس، یکی از خالقان بی‌بی‌سی، کریس ادیسون (Veep) در جلسه بین‌المللی Cannes IP در هفته گذشته، می‌گوید: به فشار توزیع خود در سریال ادامه می دهد. در ددلاین تماشا کنید او به ددلاین گفت که چگونه نمایش از کتاب‌ها تکامل یافته است، در حالی که شروع به فکر کردن به اجرای دوره دوم سریال می‌کند. \"هر اقتباسی با منبع اصلی متفاوت خواهد بود، فقط میزان متفاوت بودن آن است. ما در فصل اول آنقدر منبع را پشت سر گذاشتیم که وارد فصل 2 می‌شوید، شما از صخره خارج می‌شوید. در آن نقطه جهان کاملاً دیگری است. \"فصل اول کمی عجیب شروع می شود و به آرامی به موز تبدیل می شود، بنابراین این بدان معناست که نقطه انتخاب فصل 2 موز است.\" بازیگران Tall Tales Murder شامل الا لیلی هایلند (Black Doves)، آیدان گیلن (Game of Thrones) و فیلیپا دان (Amandaland) هستند."}, {"source": "Netflix NL", "title": "Netflix komt uit het niets met nieuwe Bridgerton-serie", "link": "https://www.netflix-nederland.nl/netflix-komt-uit-het-niets-met-nieuwe-bridgerton-serie/", "summary": "Een oud gezegd luidt: je kunt nóóit genoeg Bridgerton hebben in je leven. Dat is natuurlijk een grapje, maar Netflix komt daadwerkelijk met een nieuwe Bridgerton-serie. Een spiksplinternieuwe spin-off dus! Netflix komt met Bridgerton-spin-off We zijn momenteel in afwachting van seizoen 5 van Bridgerton, maar in 2023 konden we óók aan de slag met Queen Charlotte: A Bridgerton Story. Die spin-off was een groot succes en daarom heeft de streamingdienst nu een nieuw project aangekondigd. Er wordt namelijk gewerkt aan een nieuwe serie (een stand-alone serie dus) over Violet Bridgerton! Netflix heeft de titel daarvan nog niet bekendgemaakt, maar wij willen best een gokje wagen. Wordt het misschien Violet Bridgerton: A Bridgerton Story? Of Lady Violet: A Bridgerton Story? Het verhaal van de nieuwe spin-off draait natuurlijk om de jonge Violet Ledger, die later bekend zal worden als Lady Violet Bridgerton, de moeder van de acht kinderen uit de beroemde familie. Violet Bridgerton In de oorspronkelijke serie kennen we Violet als een liefdevolle moeder die haar kinderen voortdurend aanmoedigt om voor de ware liefde te kiezen. De spin-off laat zien hoe zij zelf als jonge vrouw de liefde ontdekt. Een belangrijk onderdeel daarvan is haar ontmoeting met Edmund Bridgerton, een jonge burggraaf die uiteindelijk haar echtgenoot wordt. De show vertelt hoe hun bijzondere liefdesverhaal begint en hoe ze samen de basis leggen voor de familie Bridgerton. Hun relatie is extra bijzonder omdat Violet en Edmund in de oorspronkelijke serie worden beschreven als een stel dat oprecht verliefd op elkaar was. In een wereld waarin huwelijken binnen de aristocratie vaak worden gesloten vanwege geld, status en familiebelangen, vormt hun huwelijk een voorbeeld van echte liefde. Die overtuiging geeft Violet later ook mee aan haar kinderen. Shonda Rhimes buigt zich momenteel dus over Bridgerton seizoen 5, en het zesde seizoen van deze serie is ook al aangekondigd. Daarnaast werkt ze aan de nieuwe spin-off, waarover we je verder nog niets kunnen vertellen. De releasedatum is nog volstrekt onbekend! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! Dit bericht op Instagram bekijken Een bericht gedeeld door Bridgerton (@bridgertonnetflix) The post Netflix komt uit het niets met nieuwe Bridgerton-serie appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-19T11:00:17+00:00", "hash": "10c452b469d4c960", "title_fa": "نتفلیکس با سریال جدید بریجرتون از هیچ جا بیرون آمد", "summary_fa": "یک ضرب المثل قدیمی وجود دارد: شما هرگز نمی توانید بریجرتون کافی را در زندگی خود داشته باشید. البته این یک شوخی است، اما نتفلیکس در واقع در حال ساخت یک سریال جدید بریجرتون است. یک اسپین آف کاملاً جدید! نتفلیکس با اسپین آف بریجرتون می آید ما در حال حاضر منتظر فصل 5 سریال بریجرتون هستیم، اما در سال 2023 می توانیم با ملکه شارلوت: داستان بریجرتون نیز شروع کنیم. آن اسپین آف موفقیت بزرگی بود و به همین دلیل است که سرویس استریم اکنون پروژه جدیدی را اعلام کرده است. سریال جدید (سریال مستقل) درباره ویولت بریجرتون در حال کار است! نتفلیکس هنوز عنوان را اعلام نکرده است، اما ما حاضریم حدس بزنیم. آیا این احتمالاً Violet Bridgerton: A Bridgerton Story است؟ یا لیدی ویولت: داستان بریجرتون؟ داستان اسپین آف جدید به طور طبیعی حول محور ویولت لجر جوان می چرخد ​​که بعداً با نام لیدی ویولت بریجرتون، مادر هشت فرزند خانواده مشهور شناخته می شود. ویولت بریگرتون در سری اصلی ما ویولت را به عنوان مادری دوست داشتنی می شناسیم که دائماً فرزندانش را تشویق می کند تا عشق واقعی را انتخاب کنند. اسپین آف نشان می دهد که او چگونه عشق را به عنوان یک زن جوان کشف می کند. بخش مهمی از این موضوع ملاقات او با ادموند بریگرتون است، یک ویسکونت جوان که در نهایت شوهرش می شود. این نمایش می گوید که چگونه داستان عشق خاص آنها شروع می شود و چگونه آنها با هم پایه و اساس خانواده بریجرتون را می گذارند. رابطه آنها بسیار خاص است زیرا در سریال اصلی، ویولت و ادموند به عنوان زوجی توصیف می شوند که واقعاً عاشق یکدیگر بودند. در دنیایی که ازدواج در طبقه اشراف اغلب برای پول، موقعیت و منافع خانوادگی ترتیب داده می شود، ازدواج آنها نمونه ای از عشق واقعی است. ویولت"}, {"source": "Pitchfork", "title": "Hot Chip’s New Album Puts Them A Long Way From Kansas", "link": "https://pitchfork.com/story/hot-chips-new-album-puts-them-a-long-way-from-kansas/", "summary": "Lead single “Random Violence” is a tribute to the late JD Twitch", "date_str": "2026-10-19T14:05:57+00:00", "hash": "c6785028089bb8e3", "title_fa": "آلبوم جدید هات چیپ آنها را از کانزاس دور می کند", "summary_fa": "تک‌آهنگ اصلی \"Random Violence\" ادای احترامی است به مرحوم JD Twitch Loader Save Story ذخیره این داستان Comment Loader Save Story Save this Story Hot Chip آلبوم جدیدی در راه دارد به نام A Long Way From Kansas که قرار است در 8 ژانویه از راه برسد. آنها اعلامیه را با یک آهنگ جدید Vitimolate به نام \"R\" به اشتراک گذاشتند. JD Twitch. ویدئوی آن را به کارگردانی جک کول در زیر ببینید. جو گدارد از هات چیپ در بیانیه ای به اشتراک گذاشت: «سال گذشته در سپتامبر، دوست قدیمی و دی جی باهوش ما، کیت مک آیور از Optimo در گلاسکو، پس از تشخیص تومور مغزی غیرقابل عمل چند ماه قبل، درگذشت. او تا حد زیادی از کلمات ترانه الهام گرفت. او عاشق موسیقی بود و به سوسیالیسم معتقد بود. بسیاری از کلمات مستقیماً به مرگ او و خاطرات حضور در باشگاه ساب در گلاسکو مربوط می شود، جایی که 20 سال پیش با هم آشنا شدیم. A Long Way From Kansas اولین باری است که فلیکس مارتین، عضو گروه، بر روی یک آلبوم هات چیپ آواز می خواند و بث دیتو و ادی چاکون نیز در آن حضور دارند. این رکورد پس از آلبوم Freakout/Release 2022 Hot Chip است. از آن زمان، گروه در سال 2025 نسخه جدیدی از مجموعه پرطرفدار خود Joy In Repetition را به اشتراک گذاشت، در فصل دوم سریال Beef Netflix ظاهر شد و بیستمین سالگرد دومین آلبوم خود، The Warning را جشن گرفت. راه طولانی از Kansa s: 01 Stack Around 02 Waiting Around 03 Random Violence 04 The Mask Is Slipping 05 Splinter 06 Shortcut To Love 07 Me In Your Head ft. Beth Ditto 08 Hook Me Up 09 Secular Hymns 10 The Garrushing 10 The Garrushing"}, {"source": "Pitchfork", "title": "Watch Taylor Swift Debut “The Fate of Ophelia” Live at the Academy Museum Gala", "link": "https://pitchfork.com/story/watch-taylor-swift-debut-the-fate-of-ophelia-live-at-the-academy-museum-gala/", "summary": "She also performed “Love Story,” “Blank Space,” and her Toy Story 5 original song “I Knew It, I Knew You”", "date_str": "2026-10-18T16:39:55+00:00", "hash": "ce5e087afe47ee30", "title_fa": "اولین نمایش تیلور سویفت «سرنوشت اوفلیا» را به صورت زنده در گالا موزه آکادمی تماشا کنید", "summary_fa": "او همچنین \"داستان عشق\"، \"فضای خالی\" و آهنگ اصلی خود \"داستان اسباب بازی 5\" \"I Knew It, I Knew You\" را اجرا کرد. این خواننده و ترانه سرا آهنگ The Life of a Showgirl \"The Fate of Ophelia\" را به صورت زنده به او داد و همچنین Blank Space، \"Love Story\" و \"I Knew It, I Knew You\" را اجرا کرد، آهنگ اصلی او برای Toy Story 5 در اوایل امسال. ویدیوهای شب را در زیر تماشا کنید. کانن sionally، که او در ماه مارس منتشر کرد. از زمانی که این رکورد را حذف کرد، او همچنان مشغول اجرا است، نمایش خود را در جاده ها، به جوایز BRIT، و شنبه شب زنده می آورد. اگرچه این فیلم اولین مستند هنرمند ویلسون خواهد بود، او قبلاً در موسیقی کار کرده است. او سال گذشته موزیک ویدیوی \"همه چیز عشق صلح آمیز است\" از بون آیور را کارگردانی کرد که در آلبوم SABLE، FABLE این خواننده و ترانه سرا ظاهر شد. بازبینی ما از Kiss All Time. دیسکو، گاهی اوقات"}, {"source": "Rolling Stone", "title": "RJ Mitte’s Mom Says There Were ‘Concerns’ About ‘Breaking Bad’ Star’s Mental Health", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/rj-mitte-mom-concerns-death-1235644541/", "summary": "Dyna Mitte said she encouraged her son to speak with a therapist before his death by suicide earlier this month", "date_str": "2026-10-19T14:25:13+00:00", "hash": "71b052ce3596d591", "title_fa": "مادر RJ Mitte می‌گوید نگرانی‌هایی درباره سلامت روان ستاره «Breaking Bad» وجود دارد", "summary_fa": "داینا میته گفت که پسرش را تشویق کرده است تا قبل از مرگ او در اوایل ماه جاری با یک درمانگر صحبت کند، مادر RJ Mitte گفت که خانواده، دوستان و تیم بازیگر فقید قبل از خودکشی او در اوایل این ماه نگرانی‌هایی در مورد سلامت روان او داشتند. داینا میته در صحبت با هالیوود ریپورتر توضیح داد که این موضوع مربوط به \"اقدام خاصی\" نیست که ستاره سابق بریکینگ بد انجام می دهد، بلکه \"بیشتر در مورد مکالمه ای است که ما داشتیم - نه فقط با من، بلکه با تیم و دوستانش.\" داینا گفت که او میته را «تشویق کرد» تا «با یک درمانگر صحبت کند و احساسات او و نحوه دیدنش را در میان بگذارد. یک درمانگر می تواند آنچه را که دیده و شنیده است، بدون اینکه سهم شخصی در آن داشته باشد، به او بگوید.» میت در 12 اکتبر در خانه خود در براونزویل، تگزاس بر اثر خودکشی درگذشت. این دینا بود که پسرش را پیدا کرد. او گفت: \"وقتی چیزی شما را عذاب می دهد - چه برای یک ساعت، یک روز، یک هفته یا یک ماه - فکر می کنم مردم می توانند لحظات ضعیفی داشته باشند.\" \"من معتقدم که در این مورد این اتفاق افتاد. این بدان معنا نیست که او درگیری های شخصی نداشته است. او با من، خواهرش، اعضای خا در سال 1972 احساس کردند. گروه در واقع بسیار سبز بود، آنها عمدتاً در حال نواختن متریال‌های بی‌نظیر Wild Life در سال 1971 بودند، و مک کارتنی حاضر نبود حتی یک آهنگ بیتلز را وارد مجموعه کند. زمانی که گروه در اواخر سال 1975 به جاده بازگشت، کمی تغییر کرد. موفقیت گروه موسیقی در سال 1973 و ونوس و مریخ در سال 1975 به آنها آثاری مانند جت، اجازه بده آن را بچرخانم، خانم. Vanderbilt، Band on the Run، Listen to What the Man Said، و Venus and Mars/Rock Show برای اضافه کردن به مجموعه، به همراه"}, {"source": "Rolling Stone", "title": "Ella Langley’s ‘Dandelion’ Is Frontrunner for 2027 Grammys’ Best Contemporary Country Album", "link": "https://www.rollingstone.com/music/music-features/grammys-2027-best-contemporary-country-album-predictions-1235644241/", "summary": "Langley seems unstoppable, but Megan Moroney, Kacey Musgraves, Luke Combs, and Carter Faith all released superb modern-day country LPs", "date_str": "2026-10-19T13:14:33+00:00", "hash": "b1e40ffe6f61288c", "title_fa": "«قاصدک» الا لنگلی پیشتاز برای بهترین آلبوم کانتری معاصر گرمی 2027 است.", "summary_fa": "لنگلی غیرقابل توقف به نظر می رسد، اما مگان مورونی، کیسی ماسگریوز، لوک کامبز، و کارتر فیث همگی ال پی کانتری های امروزی فوق العاده ای منتشر کردند که پیش از نامزدی جایزه گرمی در 16 نوامبر، رولینگ استون در حال تقسیم 11 دسته بندی مختلف است. برای هر کدام، نامزدها و همچنین اینکه چه کسی (و چه کسی باید) در شب گرمی برنده شود را پیش‌بینی می‌کنیم. با توجه به اینکه نامزدهای آلبوم کانتری اکنون به دو دسته سنتی و معاصر تقسیم شده اند، وقتی صحبت از ضبط با صدای توانگ به میان می آید، همه چیز کمی جالب تر (و پیچیده تر) است. با این حال، چه چیزی پیچیده نیست؟ تسلط الا لنگلی در این سال. LP قاصدک سال دوم او یکی از بهترین هاست که احتمالاً یک شاهکار غیرممکن است. RJ Curtis، مدیر اجرایی Country Radio Broadcasters, Inc، می‌گوید: «ما در اینجا درباره یک پدیده فرهنگی صحبت می‌کنیم. با این وجود، این دسته‌بندی غنی از رکوردهای پویا است که توسط برخی از بزرگترین ستاره‌های این ژانر ساخته شده‌اند. لوک کامبز، راهی که من کارتر هستم، ایمان کارتر، دره گیلاس، الا لنگلی، قاصدک مگان مورونی، ابر 9 کیسی ماسگریوز، میانه ناکجاآباد الا لنگلی، قاصدک بار دیگر، همه چیز در راه است الا لنگلی. اما این مقوله سختی است که عمدتاً توسط رکوردهای مرزی ساخته شده توسط هنرمندان زن رهبری می شود. وارد گونتر از مؤسسه زنده ویسکی جم نشویل و میزبان موسیقی کانتری برای اپل موزیک می گوید: «این یک سال بیانیه برای زنان است. \"الا، کیسی و مگان با پروژه های بزرگ. کارتر فیث فرصتی بیرونی دارد، اما از نظر انتقادی شایسته است که به آنها بپیوندد. فرضیه‌سازی جالب است، اما در واقع این به الا می‌رسد.» قاصدک شایسته است: یک آلبوم کانتری عالی و گسترده که توسط لنگلی، میراندا لمبرت و بن وست تهیه شده است،"}, {"source": "Rolling Stone", "title": "‘The Simpsons’ Debuts New Voice for Apu After Nine Years of Silence", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/the-simpsons-apu-sunil-malhotra-new-voice-hank-azaria-1235644520/", "summary": "Sunil Malhotra took over for longtime actor Hank Azaria as the beloved character in Sunday night’s episode", "date_str": "2026-10-19T07:34:29+00:00", "hash": "8b1503341127add3", "title_fa": "«The Simpsons» پس از نه سال سکوت، صدای جدیدی را برای Apu منتشر کرد", "summary_fa": "سونیل مالهوترا بازیگر قدیمی هنک آزاریا را به عنوان شخصیت محبوب در اپیزود یکشنبه شب The Simpsons در اپیزود یکشنبه شب، Apu Nahasapeemapetilon مورد علاقه طرفداران را بازگرداند و صدای جدیدی را برای این شخصیت پس از 9 سال فاش کرد. آپو در \"انتقام گیری با سونیل مالهوترا\" ظاهر شد که هنک آزاریا را به عهده گرفت، که در گذشته صداپیشگی آپو را بر عهده داشت. این شخصیت از قسمت اکتبر 2017 «سرفسون‌ها» شنیده شده است، اما صدای جدید او برای طرفداران شگفت‌انگیز بود زیرا سازندگان از قبل انتخاب بازیگران را اعلام نکردند. مالهوترا به ورایتی گفت: «زمانی که نماینده‌ام با من در مورد تست بازیگری سیمپسون‌ها تماس گرفت، دقیقاً می‌دانستم که این نقش برای چه نقشی است، و این ایده در واقع باعث شد شکمم غرق شود. «اما مسلماً بخشی از من نیز کنجکاو بود. هشت سال از صحبت‌های آپو در برنامه می‌گذشت، و مرا به این فکر انداخت: آیا اتاق نویسندگان اکنون متفاوت به نظر می‌رسد؟ آیا آنها می توانستند او را به گونه ای برگردانند که اشتباهات گذشته را تصدیق کرده و عذرخواهی کند؟ آیا می توانم شخصیت را مال خودم کنم و به نوعی او را پس بگیرم؟ و آیا آن‌ها می‌توانستند همه اینها را به روشی بی‌تردید سیمپسون‌ها به دست آورند که طرفداران را ناامید نکند؟ او اضافه کرد که نمی‌خواهد نقش اصلی این شوخی باشد و گفت که فقط در صورتی نقش را در نظر می‌گیرد که بتواند ابتدا با مجری برنامه مت سلمان و تهیه‌کننده همکار سزار مازاریگوس ملاقات کند. این آغاز یک تجربه عمیق مشترک بود که امیدوارم برای طرفداران قدیمی سیمپسون‌ها و برای برخی دیگر از بچه‌های آسیای جنوبی که در راه تماشا می‌کردند، به همان اندازه رضایت‌بخش باشد."}, {"source": "Rolling Stone", "title": "Miley Cyrus Responds to Criticism of Hollywood Bowl Show: ‘I Am Fully Present’", "link": "https://www.rollingstone.com/music/music-news/miley-cyrus-hollywood-bowl-show-criticism-response-1235644514/", "summary": "“I can take a lot, but one thing I will not stand is any question about where my heart is when I’m on the stage”", "date_str": "2026-10-19T07:01:15+00:00", "hash": "4e217eaaa0baa32f", "title_fa": "پاسخ مایلی سایرس به انتقاد از سریال بولینگ هالیوود: «من کاملاً حاضرم»", "summary_fa": "مایلی سایرس با انتقاد از نمایش کامبک خود در هالیوود بول در جمعه شب، گفت: «می‌توانم خیلی چیزها را تحمل کنم، اما یک چیز را تحمل نمی‌کنم این است که وقتی روی صحنه هستم، قلبم کجاست.» مایلی سایرس به انتقاد از نمایش بازگشت خود در هالیوود بول در جمعه شب پرداخت و از ویدیوهای طعمه کلیک کرد که او را متهم به سرمایه‌گذاری کامل در اجرا نکرده است، زیرا او تک تک آهنگ‌ها را نخوانده است. او در دومین کنسرت باول خود در یکشنبه شب به تماشاگران گفت: من هرگز نشنیده ام که دلم برای چیزی نمی گذارد. من نمی دانم که آیا کسی از شما این را شنیده است، او در مورد انتقاد گفت. اینکه یک نفر در حال تفسیر برای دریافت طعمه کلیک روی ویدیوی خود بود که در مورد برنامه من در جمعه شب صحبت می کرد، اما من خیلی چیزها هستم و ما حتی قرار نیست آن را سرگرم کنیم. این خواننده که چهار سال قبل از جمعه شب اجرای زنده نداشت، اضافه کرد که هر زمان که کاری انجام دهد که پله ای برای زندگی یا حرفه او باشد، بحث برانگیز بوده است. او گفت و بحث این بود که قبلاً بسیار سرگرم کننده بود. هنوز هم می تواند باشد. من می توانم خیلی ذوب شوم من آن را در مورد خودم دوست دارم. من واقعاً زندگیم را خیلی سخت می‌گذراندم. از آنجا که زندگی سخت است، بنابراین فکر کردم باید سخت بگیرم. اما، می دانید، زمانی که سخت زندگی می کردم، از زندگی ام لذت نمی بردم. من عاشق ریختن خودم در چیزی هستم. کوروش ادامه داد: برای من سخت است که اینجا بایستم و این نمایش را انجام دهم. به اندازه قبل طبیعی نیست. زیرا مانند همه ما، ما تغییر می کنیم، متحول می شویم، رشد می کنیم و آنچه را که با"}, {"source": "Rolling Stone", "title": "Here Are the Best Podcasts About Songwriting", "link": "https://www.rollingstone.com/music/music-features/best-songwriting-podcasts-music-industry-1235644396/", "summary": "Seven essential shows highlighting creators and collaborators dive deep into how inspiration becomes a finished recording", "date_str": "2026-10-18T23:12:39+00:00", "hash": "7465cb34ef8d0aca", "title_fa": "در اینجا بهترین پادکست های مربوط به ترانه سرایی وجود دارد", "summary_fa": "هفت نمایش ضروری که سازندگان و همکاران را برجسته می‌کنند، عمیقاً به این می‌پردازند که چگونه الهام به یک ضبط تمام‌شده تبدیل می‌شود. صنعت امروزی که توسط جریان‌ها و نرخ‌های حق‌الامتیاز جزئی هدایت می‌شود، حفظ این هنر را برای نویسندگان سخت‌تر کرده است، اما این امر مانع تلاش افراد با استعداد نمی‌شود. رونق پادکست‌های مربوط به خلق آهنگ ثابت می‌کند که آهنگ‌سازی جذابیت جهانی دارد. برخی از قسمت‌ها نام‌ها و چهره‌های قابل تشخیص را روی صندلی مهمان قرار می‌دهند، اما بسیاری از آن‌ها خلاقیت‌های پنهان پشت صحنه را مورد توجه قرار می‌دهند. اگرچه لازم نیست که یک نوازنده باشید تا بپرسید چگونه انجام می شود، بسیاری از این پادکست ها توسط ترانه سرایان حرفه ای میزبانی می شوند. آنچه آنها به اشتراک می گذارند تأکید بر کار سخت بی وقفه ای است که برای رسیدن به اولین ضربه لازم است و پیوند مداوم برای ادامه حرکت. پیام واضح است: جذاب نیست، اما هنگامی که یک آهنگ با مردم ارتباط برقرار کند، کاملاً ارزش آن را دارد. در اینجا هفت پادکست ترانه سرایی پیشنهاد می کنیم که بر اساس تاریخ راه اندازی از طولانی ترین تا جدیدترین سفارش داده شده اند. دو موسیقیدان ساکن لیورپول، سیمون باربر و برایان اوکانر، که به طور حرفه ای با نام سوداجرکر شناخته می شوند، به مدت 15 سال میزبان پادکست Sodajerker در ترانه سرایی بوده اند. آنها که عمیقاً در روند ترانه سرایی با سازندگان کلاسیک و فعلی بررسی می شوند، از پل مک کارتنی، پل سیمون، جیمی وب و تاد راندگرن و اخیراً از چاکا خان و فیل کالینز استقبال کرده اند. قسمت‌ها بر آهنگ‌های شاخص خاص تمرکز می‌کنند در حالی که انتشار فعلی هر مهمان را نیز برجسته می‌کنند و اغلب بینش آشکاری را ارائه می‌دهند. این پادکست برنده جایزه مستند سرویس جهانی بی‌بی‌سی رازهای ترانه سرایی را تولید کرد و از"}, {"source": "Rolling Stone", "title": "See Red Hot Chili Peppers, Dave Grohl Perform at Silverlake Conservatory’s 25th Anniversary Show", "link": "https://www.rollingstone.com/music/music-live-reviews/rhcp-dave-grohl-vince-staples-silverlake-conservatory-25-1235644482/", "summary": "Saturday’s concert at Hollywood Palladium in L.A. raised money for SCM, which provides free music lessons to children in need", "date_str": "2026-10-18T20:03:36+00:00", "hash": "103df9e53dfa2c48", "title_fa": "اجرای Red Hot Chili Peppers، Dave Grohl در نمایشگاه 25 سالگی هنرستان Silverlake را ببینید.", "summary_fa": "کنسرت روز شنبه در هالیوود پالادیوم در لس‌آنجلس، پولی را برای SCM جمع‌آوری کرد، که آموزش‌های رایگان موسیقی را به کودکان نیازمند ارائه می‌کند. مجموعه آن‌ها در میان مجموعه‌ای از نکات برجسته از فهرست A-List بود که شامل فو فایترز بود که گرد و غبار کمیاب خود را پاک می‌کردند، و وینس استیپلز، که هم گروهش شامل فارغ‌التحصیلان کنسرواتوار سیلورلیک می‌شد. برای جشن گرفتن ربع قرن شاخص SCM، هنرستان این کنسرت را به جای شام خصوصی سالانه خود برگزار کرد. کنسرواتوار موسیقی سیلورلیک که در سال 2001 توسط مایکل «فلیا» بالزاری و کیت «تری» بری به همراه دوستش پیتر وایس تأسیس شد، طبق بیانیه‌ای «شکاف‌های موجود در برنامه‌نویسی آموزش موسیقی در مدارس دولتی لس‌آنجلس را پر می‌کند» و هر هفته به 1000 دانش‌آموز درس موسیقی ارائه می‌دهد، به‌عنوان یک پشت‌نویس به‌روزرسانی شده که روی امضای دست‌نویس به‌روزرسانی می‌شود. برنامه بورس تحصیلی آن به بیش از 200 دانش آموزی که خانواده آنها در غیر این صورت قادر به پرداخت هزینه های درس موسیقی نیستند، کمک می کند، کلاس های موسیقی رایگان، سازها، لوازم، کلاس های گروه و رویدادها را ارائه می دهد. این شب دستاوردهای دانش آموزان خود را برجسته کرد و این رویداد را با گروه دانشجویی SCM SCM All Stars و یک گروه برنجی SCM معروف به Highsteppers هالیوود افتتاح کرد. اولی آهنگ‌های مورد علاقه طرفداران مانند کاور کلاسیک فانک Ohio Players و جلد محبوب RHCP \"Love Rollercoaster\" و \"Our House\" توسط Madness را ارائه کرد. همچنین آخر هفته تولد فلی بود، و به همین مناسبت، هالیوود هایستپرز «When the Saints Go Marching In» را اجرا کردند، در حالی که یکی از بنیانگذاران SCM و نوازنده باس RHCP کیک تولدی روی صحنه دریافت کردند."}, {"source": "Rolling Stone", "title": "How to Watch ‘Snapped: Killer Moms’ Online Without Cable", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/how-to-watch-snapped-killer-moms-online-free-without-cable-1235643698/", "summary": "The new Snapped spin-off looks at true-crime cases where mothers turned to violence to protect their children", "date_str": "2026-10-18T20:01:00+00:00", "hash": "9a5127cb0b2b8203", "title_fa": "نحوه تماشای آنلاین «Snapped: Killer Moms» بدون کابل", "summary_fa": "اسپین آف جدید Snapped به مواردی می‌پردازد که در آن مادران برای محافظت از فرزندان خود به خشونت روی آورده‌اند. پس از 36 فصل، سریال مستند جنایی واقعی و محبوب Snapped در فیلم Snapped: Killer Moms در حال پخش شدن است. سری جدید به بررسی خشونت‌هایی می‌پردازد که برخی از مادران برای محافظت از فرزندان خود انجام داده‌اند. Oxygen در نسخه‌ای گفته است: «Snapped: Killer Moms یک سریال جنایی واقعی است که داستان‌های پراحساس و پرمخاطره را نشان می‌دهد که در آن عشق بی‌قید و شرط مادری به خونریزی تبدیل می‌شود، زیرا مادرسالارها برای محافظت یا انتقام از فرزندانشان دست از هیچ کاری نمی‌کشند.» هر قسمت لایه‌های زنان به ظاهر معمولی را که غرایز مادرانه آنها را به سمت خشونت غیرقابل تصور سوق می‌دهد، پوست می‌کند.» Killer Moms دو اسپین آف دیگر Snapped را دنبال می کند: Snapped: Behind Bars که فصل سوم آن در دسامبر گذشته به پایان رسید و Snapped: Killer Couples که هجدهمین فصل خود را در تابستان گذشته پخش کرد. به دنبال تماشای سریال جدید جنایی واقعی هستید؟ در اینجا همه چیزهایی است که باید در مورد نحوه تماشای Snapped: Killer Moms و مکان پخش آنلاین آن بدون کابل بدانید. Snapped: Killer Moms به طور انحصاری در Oxygen True Crime پخش خواهد شد. این سریال یکشنبه 18 اکتبر ساعت 21 پخش می شود. ET/PT، و قسمت‌های بعدی در همان زمان پخش خواهد شد. اگر کابل ندارید، می‌توانید Snapped: Killer Moms را با استفاده از هر سرویس پخش زنده تلویزیونی که حاوی Oxygen True Crime است، به صورت آنلاین تماشا کنید. در اینجا سه ​​مورد از بهترین گزینه‌ها، از جمله پخش‌کننده‌های آزمایشی رایگان وجود دارد که می‌توانید از آنها برای پخش رایگان Snapped: Killer Moms استفاده کنید."}, {"source": "Rolling Stone", "title": "Cindy Crawford, Kaia Gerber Pay Tribute to Presley Gerber: ‘Til We Meet Again Our Sweet Boy’", "link": "https://www.rollingstone.com/culture/culture-news/cindy-crawford-kaia-gerber-tribute-presley-gerber-1235644475/", "summary": "“My articulation is no match against this, the magnitude of losing you. I am, quite literally, down on my fucking knees,” model’s younger sister writes in first public statement since her brother’s death", "date_str": "2026-10-18T19:35:21+00:00", "hash": "d46acc98c8a31056", "title_fa": "سیندی کرافورد و کایا گربر به پریسلی گربر ادای احترام می‌کنند: «تا زمانی که پسر شیرین ما را دوباره ملاقات کنیم»", "summary_fa": "خواهر کوچکتر مدل در اولین بیانیه عمومی پس از مرگ برادرش، کایا گربر و سیندی کرافورد هر دو یکشنبه، تقریباً یک ماه پس از 2 سالگی مدل، در رسانه‌های اجتماعی ادای احترام به پریسلی گربر را در رسانه‌های اجتماعی ادای احترام کردند: \"تصادف من با این، بزرگی از دست دادن تو نیست. من به معنای واقعی کلمه روی زانوهای لعنتی ام افتاده ام.\" ما احساس خوشبختی می کنیم که 27 سال پریسلی را در زندگی خود داشتیم. کرافورد در اولین پست اینستاگرامی خود پس از مرگ پریسلی در 20 سپتامبر نوشت: او روح شیرین و زیبایی است که دوست داشت و دوستش داشت، اکنون و برای همیشه. ما از هجوم عشق و حمایت بسیاری از ک بالا، کمدی و غیره انجام خواهد داد. بازی ادامه دارد! شرکت مدیریت استعداد و تولید Entertainment 360 (بازی تاج و تخت، ریپلی، استیک)، مستقر در شهر قرن، و شرکت سرمایه‌گذاری ریسک‌پذیر مبتنی بر بازی‌های مبتنی بر سانتا مونیکا، Griffin Gaming Partners، برای راه‌اندازی HITpoint Entertainment، یک شرکت جدید که به معرفی شخصیت‌ها، دنیاها و بازی‌های تلویزیونی به فیلم‌ها و داستان‌های ویدیویی اختصاص دارد، با یکدیگر همکاری کرده‌اند. HITpoint استعداد و تخصص تولید Entertainment 360 را با روابط Griffin Gaming در این بخش گرد هم می آورد. گریفین با سرمایه گذاری های خود در صنعت بازی های ویدیویی و فضاهای مجاور، بیش از 1.6 میلیارد دلار دارایی تحت مدیریت دارد. در اوایل سال جاری، گریفین صندوقی را برای عناوین بازی های مستقل با پتانسیل هالیوود راه اندازی کرد. هر دو شرکت تجربه ای در تقاطع بازی و هالیوود دارند. مشتریان Entertainment 360 در حال نوشتن و بازی در فیلم آینده The Legend of Zelda هستند، و این شرکت همچنین در حال تولید قرارداد اقتباسی اخیراً با یونیورسال برای یک ملک آتاری است که فوراً فاش نشد. و پیتر لوین، یکی از بنیانگذاران و مدیر عامل Griffin Gaming، نقش کلیدی در آوردن Fallout به روی صفحه داشت. شرکا گفتند که HITpoint اقتباس‌هایی را در طیف کاملی از ژانرهای ارائه شده در بازی - از اکشن، ترسناک، و تماشایی با مفهوم بالا گرفته تا کمدی، عاشقانه، و داستان‌های دوران بلوغ تهیه، توسعه، بسته‌بندی و تولید خواهد کرد. شرکت جدید تشخیص می دهد که چگونه بازی های اصلی در چشم انداز سرگرمی تبدیل شده اند، به طوری که تخمین زده می شود بیش از 3.7 میلیارد نفر در سراسر جهان به طور فعال بازی های ویدیویی انجام می دهند."}, {"source": "Hollywood Reporter", "title": "Angry Golf Bros Tried to Ruin Heather McMahon. She Released a Hulu Special Instead", "link": "https://www.hollywoodreporter.com/tv/tv-features/heather-mcmahon-interview-ryder-cup-1236734182/", "summary": "In 'By a Thread' and this interview, the comedian tackles the bizarre fallout from the Rider Cup gaffe that put her in the crosshairs of the manosphere: \"Men don't want women in their spaces.\"", "date_str": "2026-10-19T14:00:00+00:00", "hash": "77f0c9b6f0c375c8", "title_fa": "Angry Golf Bros سعی کرد هدر مک ماهون را خراب کند. او در عوض یک Hulu Special منتشر کرد", "summary_fa": "در «با یک نخ» و این مصاحبه، کمدین به پیامد عجیب و غریب گاف رایدر کاپ می‌پردازد که او را در تیررس مانوسفر قرار داد: «مردها زنان را در فضاهایشان نمی‌خواهند». برای لحظه ای کوتاه در سال 2025، به نظر می رسید که هدر مک ماهون در شرف کنسل شدن است - و در یک رشته از وقایع آنقدر مضحک که کمدین نمی توانست خودش فیلمنامه آن را بنویسد. او که برای شرکت در اولین سه راهی جام رایدر، تورنمنت سالانه ای که قرار بود نبردی دوستانه بین گلف بازان آمریکایی و اروپایی باشد، استخدام شده بود، در تلاش بود تا بر جمعیت خود پیروز شود: یک گروه ترکان و مغولان خشن، عمدتا مست، مردانه و قاطعانه آمریکایی در کورس لانگ آیلند. هنگامی که آنها شروع به سر دادن شعار \"لعنت به تو، روری\" کردند، که به روی ستاره گلف ایرلند شمالی، روری مک ایلروی می پردازد، مک ماهون فرصتی دید تا خود را با مخاطبان جدیدش خشنود کند. چیزی که او به دست آورد یک حادثه بین المللی جزئی بود. داستان‌های مرتبط تلویزیون همه باید آرام شوند -- کمدین لورا راموسو می‌گوید که می‌تواند در این کسب‌وکار کمک کند تا بوون یانگ و مت راجرز لاس کالتوریستاس در دیزنی پلاس پخش شوند، Hulu این مسابقات مک ماهون را اخراج کرد. تنش بین دو تیم بالا گرفت. او یک عذرخواهی عمومی از مک ایلروی صادر کرد، اما خیلی دیر شده بود. او به مدت 72 ساعت دریافت کننده زیربخش گلف ویتریول و تهدیدات مانوسفر بود. او می گوید که برای مبارزه فیزیکی با چالش هایی روبرو شده است. هنگامی که او از یک خاموشی کوتاه رسانه های اجتماعی بازگشت، از اینکه دید خوراکش پاک شده است، خیالش راحت شد. مک ماهون به یاد می آورد: «تیلور سوئیفت واقعا الاغ من را نجات داد. برای سه روز خیلی بد بود، و"}, {"source": "Hollywood Reporter", "title": "Edward Berger Talks Filmmaking in a Streaming Age: “The Movie Industry Needed Netflix to Wake Up”", "link": "https://www.hollywoodreporter.com/movies/movie-news/conclave-edward-berger-netflix-world-war-z-mia-market-1236735243/", "summary": "The German filmmaker told the MIA Market in Rome a \"failure\" with ‘World War Z’ opened the way to an eventual Oscar-winning ‘Conclave’ collaboration.", "date_str": "2026-10-19T13:44:16+00:00", "hash": "eb280c51e5ad1466", "title_fa": "ادوارد برگر درباره فیلمسازی در عصر پخش صحبت می کند: \"صنعت فیلم برای بیدار شدن به نتفلیکس نیاز داشت\"", "summary_fa": "این فیلمساز آلمانی به بازار MIA در رم گفت که \"شکست\" با \"World War Z\" راه را برای همکاری نهایی \"Conclave\" برنده اسکار باز کرد. ادوارد برگر، فیلمساز سازنده فیلم All Quiet on the Western Front و Conclave، روز دوشنبه در مورد ساخت فیلم برای سالن‌ها یا سرویس‌های پخش در یک کسب‌وکار که به طور فزاینده‌ای دچار اختلال می‌شود، صحبت کرد. \"من فکر می کنم هیچ درست یا غلطی وجود ندارد. هر فیلم جایگاه خود را پیدا می کند. برگر به بازار MIA در رم در طی یک گفتگوی کنار آتش گفت: همه این رسانه‌ها افزوده‌کننده هستند. کارگردان و تهیه‌کننده آلمانی همچنین از پخش‌کننده‌های اصلی به خاطر تکان دادن یک تجارت سینمایی که نیاز به ایده‌های تازه و مخاطبانی دارد که از دوران همه‌گیری بیرون می‌آیند تمجید کردند. «صنعت سینما برای بیدار شدن به نتفلیکس نیاز داشت. برگر استدلال کرد که آنها یک اخلالگر واقعی بودند. او اضافه کرد که با الهام گرفتن نتفلیکس از صنعت سینما در میان رونق در باکس آفیس برای استودیوها و استریمرهای بزرگ هالیوود، جدول تا حدودی تغییر کرده است. داستان‌های مرتبط پیش‌نمایش درآمد کسب‌وکار نت‌فلیکس: زمانی نیست که دوباره فیلم‌ها را آرام کنیم، به ما اجازه می‌دهد به پشت پرده اسکیت بازی نخبگان نگاه کنیم (پیش‌پرده اختصاصی) برگر همچنین در خلال سخنرانی‌اش در رم استدلال کرد که یادگیری از اشتباهات بیش از هر چیز باعث الهام بخشیدن به حرفه‌اش شد. او توضیح داد: «چیزی که بیش از همه به من آموخت شکست بود. برگر به دومین فیلمش، جنگ جهانی زد، که با برد پیت همکاری داشت، اشاره کرد، زیرا او را وادار به این داشت که شغلش به کجا می‌رود. برگر گفت: \"همه چیز مربوط به خودت است. فقط زمانی فیلم بسازید که از درون آمده باشد. وقتی چیزی در مورد شما وجود دارد که واقعاً می خواهید بگویید، پس آن را می سازید.\""}, {"source": "Hollywood Reporter", "title": "Netflix Earnings Preview: Not the Time to Chill", "link": "https://www.hollywoodreporter.com/business/business-news/netflix-earnings-preview-near-term-pain-long-term-gain-layoffs-1236734764/", "summary": "A C-suite reshuffle has led at least one Wall Street analyst to cut his financial forecasts. Another echoes a widely held sentiment: \"A new path is being laid; it may take time.\"", "date_str": "2026-10-19T13:40:12+00:00", "hash": "5d7f7265fa1e31cc", "title_fa": "پیش‌نمایش درآمد نتفلیکس: زمان آرامش نیست", "summary_fa": "تغییر در C-suite باعث شده حداقل یکی از تحلیلگران وال استریت پیش بینی های مالی خود را کاهش دهد. دیگری بازتاب یک احساس عمومی است: \"مسیری جدید در حال ایجاد است؛ ممکن است زمان ببرد.\" نتفلیکس برای جلب توجه دیگران نیازی به گزارش درآمد سه ماهه سوم خود در روز سه شنبه ندارد. در حال حاضر همه نوع چشم و گوش در هالیوود و در وال استریت برای روز بر روی آن بوده است. به هر حال، استریمر جهانی با بیشترین اخراج‌های خود در سال‌های اخیر، با حدود 6 درصد از نیروی کار خود، و جایگزینی شگفت‌انگیز مدیر ارشد محتوای بلا باجاریا با پیتر رایس، در تیتر اخبار بوده است. هجوم تغییرات پس از ابراز تاسف تد ساراندوس، مدیر عامل نتفلیکس در نشست بلومبرگ اسکرین تایم در سپتامبر رخ داد. 30 که «به طور کلی، ما به آن سرعتی که من می‌خواهم رشد نمی‌کنیم، و در حال کار روی سریع‌تر کردن آن هستیم». به نظر می رسد پیام این است: اکنون زمان آرامش نیست. در واقع، شتاب تعامل استریمر، تحلیلگران و مدیریت وال استریت را ناامید کرده است، با رقابت شدید برای جلب توجه مخاطبان از سوی یوتیوب و TikTok به عنوان پس‌زمینه. در نتیجه، سهام نتفلیکس نزدیک به 65.08 دلار به پایین ترین حد خود در 52 هفته گذشته معامله می شود. و برخی از تحلیلگران اهداف قیمت سهام خود را در استریمر کاهش داده اند. در میان فهرست محتوای سه ماهه سوم نتفلیکس می‌توان به 72 Hours With Kevin Hart، The Whisper Man، The Hawk، فصل آخر Outer Banks، Monster: The Lizzie Borden Story، The Gentlemen فصل 2 و Home Run Derby اشاره کرد. برخی در وال استریت انتظار دارند افزایش اخیر قیمت ها آخرین نتایج سه ماهه را تقویت کند، در حالی که برخی دیگر تعجب می کنند که آیا کاهش مشاغل و تغییرات اجرایی اعتراف به"}, {"source": "Hollywood Reporter", "title": "Walter Isaacson Launches New Podcast to Examine the Builders of AI, Including Elon Musk", "link": "https://www.hollywoodreporter.com/business/digital/walter-isaacson-new-podcast-ai-elon-musk-1236733980/", "summary": "The biographer on his new show, where he interviews Peter Thiel, Dario and Daniela Amodei, Musk and more and whether Musk has changed.", "date_str": "2026-10-19T13:00:00+00:00", "hash": "eb9f3e624be7abff", "title_fa": "والتر ایزاکسون پادکست جدیدی را برای بررسی سازندگان هوش مصنوعی از جمله ایلان ماسک راه اندازی کرد.", "summary_fa": "زندگی‌نامه‌نویس در برنامه جدیدش، جایی که با پیتر تیل، داریو و دانیلا آمودی، ماسک و غیره مصاحبه می‌کند و اینکه آیا ماسک تغییر کرده است یا خیر. والتر آیزاکسون، نویسنده بیوگرافی استیو جابز و ایلان ماسک، در حال چرخش لنز خود به هوش مصنوعی است. ایزاکسون پادکست جدیدی با نام The Builders with Walter Isaacson راه اندازی می کند که در آن با ایلان ماسک یکی از بنیانگذاران Open AI، پیتر تیل بنیانگذار Palantir، Fei-Fei Li \"Godmother of AI\"، بنیانگذاران Anthropic، Dario و Daniela Amodei، LucaRcre, Palantircul more. ایزاکسون به هالیوود ریپورتر گفت: «هوش مصنوعی متحول‌کننده‌ترین فناوری است که شاید از زمان ظهور الکتریسیته، 130 سال پیش، داشته‌ایم، و آنقدر سریع اتفاق می‌افتد که من می‌خواستم با افرادی که آن را ایجاد می‌کنند یک شیرجه عمیق داشته باشم و آن را به موقع‌تر از یک کتاب انجام دهم. من همچنین می‌خواستم مستقیماً از آنها بشنوم، به خصوص که فکر می‌کنم هم فرصت‌ها و هم خطرات عظیمی وجود دارد، و به‌ویژه می‌خواستم عوامل مستقلی را که از کنترل خارج می‌شوند عقب نشینی کنم و اگر مطمئن نیستیم می‌توانیم آنها را کنترل کنیم، چرا آنها را می‌سازیم.» شرکت پادکست Kaleidoscope این نمایش را راه اندازی می کند که با مشارکت در Ramp تولید و توسط iHeartPodcasts توزیع می شود. این نمایش در اکتبر آغاز می شود. 20 با اپیزود ماسک، و دو بار در هفته تا ژانویه ادامه می یابد، با آیزاکسون به ضبط مصاحبه های بیشتری در طول پاییز ادامه می دهد. ایزاکسون به خاطر پرفروش‌ترین بیوگرافی‌هایش از استیو جابز و همچنین لئوناردو داوینچی و انتشار ایلان ماسک در سال 2023 شناخته می‌شود، که همچنین برخی انتقادات را از سوی برخی که ادعا می‌کردند او به طور کامل جنبه تاریک‌تر ماسک را بازجویی نکرده بود، برانگیخت. ایزاکسون همچنین پادکست بعدی به نام On Musk را با Kaleidoscope راه اندازی کرد."}, {"source": "Hollywood Reporter", "title": "‘Up Again’ Lets Us Peek Behind the Curtain of Elite Figure Skating (Exclusive Trailer)", "link": "https://www.hollywoodreporter.com/movies/movie-news/up-again-figure-skating-doc-film-trailer-jihlava-hbo-max-1236735161/", "summary": "Eliška Andršová Cílková's feature debut and portrait of three-time Czech figure skating champion Barbora Vránková premieres at the Ji.hlava Doc Fest and will come to HBO Max across Europe.", "date_str": "2026-10-19T11:30:00+00:00", "hash": "66aa49343796b9b1", "title_fa": "«دوباره بالا» به ما اجازه می‌دهد به پشت پرده اسکیت فیزیکی نخبگان نگاه کنیم (تریلر اختصاصی)", "summary_fa": "اولین کار برجسته Eliška Andršová Cílková و پرتره باربورا ورانکوا قهرمان سه دوره اسکیت نمایشی چک در جشنواره Ji.hlava Doc Fest نمایش داده می شود و برای HBO Max در سراسر اروپا پخش خواهد شد. «دوباره بالا» اولین فیلم بلند کارگردان و آهنگساز اهل چک الیشکا آندرشووا سیلکوا است. پرتره تایم لپس باربورا ورانکوا، قهرمان سه دوره اسکیت نمایشی چک، دوره ای مهم از زندگی او را در سنین 15 تا 18 سالگی به تصویر می کشد. این فیلم که اولین نمایش جهانی خود را در جشنواره بین المللی فیلم مستند Ji.hlava در 24 اکتبر در دو بخش First Lights جشنواره و مسابقه شادی چک دریافت می کند، توسط Pilot Film و nutprodukce در تاریخ 29 اکتبر در سینماهای چک اکران می شود. Up Again سپس از 4 دسامبر در HBO Max در تمام مناطق اروپایی در دسترس خواهد بود. داستان‌های مرتبط تلویزیون بی‌بی‌سی می‌گوید شکایت جیمز آکاستر به خاطر ماچو شوخی در مورد خائنان مشهور کاملاً نادرست است. به دنبال رویای خود: قهرمان شدن اروپا – شاید حتی جهان – شود. باربورا در دنیایی بزرگ می‌شود که ارزش یک فرد با عملکرد، امتیازات و رتبه‌بندی سنجیده می‌شود، خلاصه یک فیلم را برجسته می‌کند. با افزایش فشار، بحرانی به وجود می‌آید و کمی قبل از اولین قهرمانی اروپا - رویدادی که برای تمام زندگی خود آماده کرده بود، کناره‌گیری می‌کند. فیلم رصدی نوید یک نگاه شکننده و صمیمی را در پشت پرده اسکیت بازی نخبگان می‌ده وربین ها شروع به آزار و ناراحتی کرد. او در پایان با تیم سازنده در این باره صحبت کرد و گفت که ناراضی است و احساس می کند که از او جدا شده است. روز دوشنبه، یکی از نمایندگان بی‌بی‌سی این مقاله را به طور کامل تکذیب کرد و به THR گفت: ادعای کنایه زدن در میان بازیگران سریال و ادعاهای شکایت در مورد متلک کردن کاملاً نادرست است. هیچ حادثه ای با این ماهیت وجود نداشت و هیچ مدرکی برای حمایت از این ادعاها وجود ندارد."}, {"source": "Hollywood Reporter", "title": "European Producers Must Get Bigger to Compete, Says EU Policy Chief: “We Must Invest in Companies”", "link": "https://www.hollywoodreporter.com/tv/tv-news/european-producers-eu-chief-1236735171/", "summary": "The comments by Giuseppe Abbamonte, director for media policy for the European Commission, at the MIA Market in Rome came amid calls for ways foreign players can help finance local films and TV series.", "date_str": "2026-10-19T09:40:51+00:00", "hash": "7965982ef0f5b443", "title_fa": "رئیس سیاست اتحادیه اروپا می گوید: \"ما باید در شرکت ها سرمایه گذاری کنیم\" تولیدکنندگان اروپایی برای رقابت باید بزرگتر شوند.", "summary_fa": "اظهارات جوزپه آبامونته، مدیر سیاست رسانه ای کمیسیون اروپا، در بازار MIA در رم در بحبوحه درخواست ها برای یافتن راه هایی برای کمک به بازیگران خارجی برای کمک مالی به فیلم ها و سریال های تلویزیونی محلی بیان شد. MIA Market روز دوشنبه گزارش داد که تولیدکنندگان اروپایی دیگر فقط با یکدیگر رقابت نمی کنند، بلکه با استودیوها و استریمرهای آمریکایی رقابت می کنند، یوتیوب و پلتفرم های اجتماعی باید بودجه عمومی و خصوصی جدیدی را برای جلب توجه مخاطبان و درآمدهای بین المللی دریافت کنند. اظهارات او در حالی بیان شد که بازار MIA در رم با یک پانل در مورد همکاری تولیدکنندگان اروپایی در یک سیاست سمعی و بصری در سراسر اتحادیه اروپا در بحبوحه تجارت جهانی که با تجمیع و خرید شرکت های اروپایی توسط رقبای آمریکایی به هم خورده بود، آغاز شد. Sky که متعلق به Comcast است، با خرید عملیات پخش و پخش ITV در بریتانیا در قراردادی به ارزش 2.1 میلیارد دلار موافقت کرده است. RTL در آلمان در حال ترکیب پخش کننده رایگان پیشرو در بازار خود با شماره
