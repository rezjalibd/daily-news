sputed the explanation and shared a grainy photo she said showed the bird on display beside a $15,000 price tag. “So you’re not only rude, you’re also a liar. Got it,” she wrote, recounting what she said was a condescending exchange in which an employee quoted the price before offering to find “something comparable.” She also rejected any suggestion she was punching down at a small business, noting she had been shopping at one when the alleged slight occurred. “You don’t get a free pass to treat people less than in your store just because you are a small business,” she wrote. “It’s not that hard to be kind.” She closed with a parting shot: “Your store is really cool. Unfortunately, you aren’t.” In its Sunday statement, Art of Play had struck a more conciliatory tone, allowing that the “negative experience Kelly described … would resonate with anyone who has ever felt judged in a shop” and emphasizing that all visitors are “equally welcome.” The shop also said it had been overwhelmed by the response to Clarkson’s post, writing that it was “suddenly attacked by 8 million people who have never visited our store,” and signed off with a nod to the singer’s own catalog: “What doesn’t kill you makes you stronger” — a line from her 2012 hit “Stronger (What Doesn’t Kill You).” The exchange comes during a transitional stretch for Clarkson. In August, she aired the series finale of her Daytime Emmy-winning program The Kelly Clarkson Show after seven seasons, saying she wanted to “prioritize my kids.” She has since returned to NBC’s The Voice for its 30th season alongside Adam Levine, Queen Latifah and Riley Green. One of the most successful artists to emerge from reality television — she won the first season of American Idol in 2002 — Clarkson has topped th", "date_str": "2026-10-12T04:43:48+00:00", "hash": "0e0f0d948ba1d049", "title_fa": "کلی کلارکسون در مورد دشمنی فروشگاه بروکلین دو برابر می‌شود: «شما هم دروغگو هستید»", "summary_fa": "اختلاف کلی کلارکسون با یکی از فروشگاه‌های بروکلین بالا گرفته است، به طوری که خواننده اکنون فروشگاه را متهم به دروغ گفتن می‌کند، پس از آن که حساب کاربری او را به سبک Pretty Woman رد کرد. کلارکسون ابتدا در آخر هفته در پستی که در X به اشتراک گذاشته شد، فروشگاه تخصصی Art of Play را فراخواند و گفت که کارکنان به گونه ای با او رفتار کرده اند که انگار نمی تواند کالای آن را بخرد و این تجربه را با فیلم جولیا رابرتز در سال 1990 مقایسه کرد. فروشگاه روز یکشنبه (اکتبر) پاسخ داد. 11) از طریق اینستاگرام، گفت که موردی که کلارکسون در مورد آن پرسیده بود - \"مولی\"، یک ماشین پرنده آوازخوان و رقصنده که در نمایش های جادویی آن استفاده می شود - \"به طور دائم به دیوار متصل است و برای فروش نیست.\" کلارکسون آن را نمی خرید. در یک پست جدید در استوری اینستاگرام، این زن 44 ساله با این توضیح مخالفت کرد و یک عکس دانه دانه به اشتراک گذاشت که به گفته او پرنده را در کنار برچسب قیمت 15000 دلاری نشان می داد. بنابراین شما نه تنها بی ادب هستید، بلکه یک دروغگو نیز هستید. متوجه شدم،» او نوشت، و آنچه را که می‌گفت یک مبادله تحقیرآمیز بود که در آن یک کارمند قبل از پیشنهاد یافتن «چیزی قابل مقایسه» قیمت را نقل کرد. او همچنین هر گونه پیشنهادی را که در حال ضربه زدن به یک کسب و کار کوچک بود رد کرد، و اشاره کرد که در یکی از آن‌ها خرید کرده بود که مورد ادعای جزئی رخ داد. او نوشت: «شما یک مجوز رایگان برای رفتار کمتر از فروشگاهتان با مردم دریافت نمی‌کنید، فقط به این دلیل که یک تجارت کوچک هستید. \"مهربان بودن چندان سخت نیست.\" او با یک عکس جدایی بسته شد: «فروشگاه شما"}, {"source": "Billboard", "title": "Mike Love Is ‘Facing Serious Health Challenges,’ Says John Stamos", "link": "https://www.billboard.com/music/music-news/mike-love-health-update-beach-boys-1236358865/", "summary": "Mike Love, the sole remaining original member of The Beach Boys still touring under the group s name, is facing serious health challenges, John Stamos wrote in an update to fans on Sunday (Oct. 11). Related Beach Boys Reschedule Remaining Summer 2026 North American Tour Dates to Allow Singer Mike Love to Recharge Law Order: Special Victims Unit : Here Are All the Musician Guest Stars, Ranked Nickelback to Return to Australia for the First Time Since 2019 Stamos, who sometimes performs with The Beach Boys, posted a candid note on Instagram en route to Sunday night s concert at Nashville s Ryman Auditorium. Stamos said he was struggling to put my feelings into words. He made the post following Saturday s (Oct. 10) concert in Cincinnati, marking the group s return after the Beach Boys hit pause on a summer tour in July to allow Love time to recharge. The announcement affected six weeks worth of tour dates, totaling nearly 30 shows. Footage from the Cincinnati show on social media showed Stamos introducing Love and helping a feeble Love walk out and sit in a chair, where Love remained through the evening, occasionally joining in on songs. Other band members took turns singing lead on tunes usually handled by Love, according to Rolling Stone . My beloved friend, father figure, musical hero and mentor, Mike Love, is facing serious health challenges, said Stamos, who did not give specific details about Love s health condition. We hope he’ll be doing what he loves for years to come, but we don’t know what the future holds. We have tonight. His message continued: Mike is a fighter. Despite doctors, family and friends urging him to focus on his health, he insists on being on stage. He says he needs his band, the audience, his friends and drummer surrounding him to lift him up. I’ve played with Mike for 41 years, said Stamos. I never imagined how deeply it would affect me to see someone larger than life face something so human and fragile. The Mike Love we see tonight may not be exactly the Mike we’ve always known. But he’s still every bit the Mike we love. Stamos said he hoped to be completely present onstage with Love at Sunday night s concert, to feel that first chord hit and watch age, illness and time disappear. The Beach Boys have a limited slate of dates scheduled currently , including a Nov. 11 performance at Walt Disney World s Epcot theme park near Orlando, Fla., and a Nov. 13 concert at the Hard Rock Hotel and Casino in Bristol, Va. Looking ahead to 2027, ", "date_str": "2026-10-12T03:14:02+00:00", "hash": "15684da8bec8f09b", "title_fa": "جان استاموس می‌گوید مایک لاو با چالش‌های جدی سلامتی مواجه است", "summary_fa": "جان استاموس در به روز رسانی روز یکشنبه (11 اکتبر) برای طرفداران نوشت: مایک لاو، تنها عضو اصلی باقی مانده از The Beach Boys که هنوز تحت نام این گروه در حال تور است، با چالش های سلامتی جدی مواجه است. مربوط به Beach Boys زمان‌بندی مجدد تاریخ‌های باقیمانده تور آمریکای شمالی تابستان 2026 تا به خواننده مایک لاو اجازه می‌دهد تا دوباره شارژ کند حکم قانونی: واحد قربانیان ویژه: اینجا همه ستاره‌های مهمان نوازنده هستند، رتبه‌بندی نیکل بک برای بازگشت به استرالیا برای اولین بار از سال 2019 استموس، که گاهی اوقات نمی‌تواند در یک‌شنبه شب در اینستاگرام برنامه اجرا کند. کنسرت در نشویل s Ryman Auditorium. استاموس گفت که در تلاش است تا احساسات من را در قالب کلمات بیان کند. او این پست را بعد از کنسرت شنبه (10 اکتبر) در سینسیناتی انجام داد، که نشان دهنده بازگشت گروه پس از توقف گروه بیچ بویز در تور تابستانی در ژوئیه بود تا زمان عشق دوباره شارژ شود. این اعلامیه بر تاریخ تورهای شش هفته ای تأثیر گذاشت که در مجموع نزدیک به 30 نمایش را شامل می شود. فیلمی از نمایش سینسیناتی در رسانه های اجتماعی نشان می دهد که استاموس عشق را معرفی می کند و به عشق ضعیف کمک می کند تا از خانه بیرون برود و روی صندلی بنشیند، جایی که لاو تا عصر باقی می ماند، گاهی اوقات به آهنگ ها می پیوندد. به گفته رولینگ استون، سایر اعضای گروه به نوبت آهنگ‌هایی را که معمولاً توسط Love اجرا می‌شود، می‌خواندند. استاموس که جزئیات خاصی در مورد وضعیت سلامتی لاو ارائه نکرد، گفت: دوست محبوب، شخصیت پدر، قهرمان موسیقی و مربی من، مایک لاو، با چالش های جدی سلامتی مواجه است. ما امیدواریم که او در سال‌های آینده کاری را که دوست دارد انجام دهد، اما نمی‌دانیم آینده چه خواهد بود. امشب داریم"}, {"source": "Billboard", "title": "Harry Styles Dedicates Moment to Oscar Belgal After ICE Shooting: ‘Look After Each Other,’ He Tells NYC Crowd", "link": "https://www.billboard.com/music/pop/harry-styles-oscar-belgal-ice-shooting-msg-concert-nyc-1236358841/", "summary": "On Saturday night, Harry Styles asked a sold-out Madison Square Garden crowd to turn their attention to Oscar Belgal, the 28-year-old man who was shot by ICE in his car in the Bronx, New York City, earlier this week while his 5-year-old son was in the backseat. I just want us to take a moment to think about Oscar Belgal tonight, said Styles, guitar in hand before performing Sign of the Times, one of the final songs on his Together, Together setlist on Saturday (Oct. 10). Concertgoers captured the moment and uploaded the clip to TikTok , as they ve done with many of Styles interactions with fans throughout the star s 30-night residency at the Garden. I want us to just think, [to] remember, to just look after each other, Styles told the audience in a speech in which he didn t say ICE, but seemingly referenced the situation with ICE and the administration s deportation agenda after saying Belgal s name. It is up to us to make the cities that we live in places we want to see, Styles said. It s up to us to make the world a place that we want to see, that we want to give to our children. So please continue looking after each other, and remember, your friends, the people you love, the people who don t look like you and aren t born where you are from: they deserve respect, love, dignity. Please get home safely and look after each other, Styles urged the crowd. On Thursday, Belgal was backing his car into a parking spot in the Marble Hill neighborhood with his young son in tow when he was surrounded by Immigration and Customs Enforcement officers in plain clothes. His vehicle started to move forward, and he was shot in the neck, according to NYPD commissioner Jessica S. Tisch , who says at least one ICE officer fired seven shots. City police, who are not involved in federal immigration enforcement, arrived at the scene after hearing a report of shots fired and transported Belgal to the hospital. Belgal is now being held at Metropolitan Detention Center in Brooklyn, while the child is safe and in the care of a family member. Federal officials described Belgal as an illegal alien gang member from the Dominican Republic who refused to get out of his car and smashed into two government vehicles. Tisch reported Belgal has had two prior arrests in New York City: One for robbery in 2023, in which he pleaded guilty to fourth-degree grand larceny and received five years probation, and one for criminal sale of a controlled substance in 2025, which is still pending. Mayor Zoh", "date_str": "2026-10-12T01:56:16+00:00", "hash": "87d9c09d3866bf06", "title_fa": "هری استایلز پس از فیلمبرداری در ICE لحظه ای را به اسکار بلگال اختصاص می دهد: او به جمعیت نیویورک می گوید: «به همدیگر توجه کنید»", "summary_fa": "شنبه شب، هری استایلز از جمعیت فروخته شده مدیسون اسکوئر گاردن خواست تا توجه خود را به اسکار بلگال، مرد 28 ساله‌ای که در اوایل این هفته در ماشینش در برانکس، نیویورک سیتی در حالی که پسر 5 ساله‌اش روی صندلی عقب نشسته بود، مورد اصابت گلوله ICE قرار گرفت، معطوف کنند. استایلز در حالی که گیتار در دست داشت قبل از اجرای Sign of the Times، یکی از آخرین آهنگ‌های او در لیست مجموعه‌های Together، Together در روز شنبه (10 اکتبر) گفت، فقط می‌خواهم امشب لحظه‌ای به اسکار بلگال فکر کنیم. کنسرت‌روان لحظه را شکار کردند و کلیپ را در TikTok آپلود کردند، همانطور که با بسیاری از تعاملات Styles با طرفداران در سراسر اقامت 30 شبه ستاره در باغ انجام دادند. استایلز در یک سخنرانی به حضار گفت که در آن نگفت ICE، اما ظاهراً پس از گفتن نام بلگال به وضعیت ICE و دستور کار اخراج دولت اشاره کرد. استایلز گفت، این به ما بستگی دارد که شهرهایی را که زندگی می کنیم در مکان هایی بسازیم که می خواهیم ببینیم. این به ما بستگی دارد که دنیا را به مکانی تبدیل کنیم که می خواهیم ببینیم و می خواهیم به فرزندانمان بدهیم. پس لطفاً به مراقبت از یکدیگر ادامه دهید و به یاد داشته باشید، دوستانتان، افرادی که دوستشان دارید، افرادی که شبیه شما نیستند و در جایی که شما به دنیا آمده‌اند: آنها سزاوار احترام، عشق و کرامت هستند. استایلز از جمعیت خواست، لطفا با خیال راحت به خانه برگردید و مراقب یکدیگر باشید. روز پنج‌شنبه، بلگال در حال عقب‌نشینی از ماشین خود در محل پارکینگ در محله ماربل هیل با پسر خردسالش بود که توسط مأموران اداره مهاجرت و گمرک با لباس شخصی محاصره شد. به گفته جسیکا اس تیش، کمیسر پلیس نیویورک، که می گوید حداقل یک افسر ICE هفت تیر شلیک کرده"}, {"source": "Billboard", "title": "Fans Choose Troye Sivan’s ‘She’s the Best’ as This Week’s Favorite New Music", "link": "https://www.billboard.com/music/music-news/troye-sivan-shes-the-best-new-music-poll-results-1236358805/", "summary": "She s the Best , the new studio album from Troye Sivan , tops this week s new music poll. Related Troye Sivan, Remi Wolf, Slayyyter Pitbull: New Music Friday Guide Troye Sivan Shares How He Got Nicole Kidman for She s the Best Video (And What He Thinks of ADÉLA s Hit) Troye Sivan’s ‘She’s the Best’ Album: All 12 Tracks Ranked Listeners voted in a poll published Friday (Oct. 9) on Billboard , choosing Sivan s latest full-length LP as their favorite new music. The album rose above new releases from Cardi B, Slayyyter, Ez Mil with Eminem, Pitbull, Remi Wolf and more on the poll, landing 56% of the vote by closing time on Sunday. As long as there s cultural conversation and people kind of listening to the songs and understanding what I m trying to say, and watching the videos, that s kind of my thing that I care about, Sivan told Billboard during a recent interview on the release of his new album, which arrived Friday. Of the set s title track, She s the Best an advance single that boasts Nicole Kidman as the star of its music video Sivan said, It s such an important song to me. It s just something I hadn t explored before in music. It s something I ve felt for my whole life and never really had a way to express it. The album is such a journey, he shared. There s sort of whiplash between these songs that I feel like I m performing on stage they re super big, and bombastic and then all of a sudden I m like depressed and lonely in my hotel room, writing songs about this man I have not met yet, these manifestation love songs, there s almost like this pathetic element to the album as well. I think I spent so much time in both of those places and neither felt like they were really totally fulfilling me. He continued, When I arrived at She s the Best, I think that s also why I made it the album title I realized that was the one thing that is constant in my life, and that has always been constant, and the stability of it and the support I ve had from the women and feminine people in my life has been the thing that s got me through all areas. Coming up behind She s the Best on the poll are Cardi B s Don t Chart, with 9% of the vote, and Slayyyter s I Think He s Got a Girl, with 7% of the vote. See the final results of this week s poll below. Take Our Poll", "date_str": "2026-10-11T22:42:06+00:00", "hash": "2355be82977fbcf1", "title_fa": "طرفداران تروی سیوان «او بهترین است» را به عنوان موسیقی جدید مورد علاقه این هفته انتخاب کردند", "summary_fa": "او بهترین است، آلبوم استودیویی جدید از Troye Sivan، در نظرسنجی جدید موسیقی این هفته در صدر قرار دارد. Troye Sivan، Remi Wolf، Slayyyter Pitbull: New Music Friday Guide Troye Sivan به اشتراک می‌گذارد که چگونه نیکول کیدمن را برای او بهترین ویدیو (و آنچه او درباره ضربه ADÉLA فکر می‌کند) به اشتراک می‌گذارد. ، آخرین LP کامل سیوان را به عنوان موسیقی جدید مورد علاقه خود انتخاب کردند. این آلبوم بالاتر از انتشارات جدید از Cardi B، Slayyyter، Ez Mil با Eminem، Pitbull، Remi Wolf و موارد دیگر در نظرسنجی قرار گرفت و با بسته شدن زمان در روز یکشنبه، 56 درصد از آرا را به خود اختصاص داد. سیوان طی مصاحبه اخیر در انتشار آلبوم جدیدش که روز جمعه وارد بازار شد به بیلبورد گفت تا زمانی که گفتگوی فرهنگی وجود دارد و مردم به آهنگ ها گوش می دهند و می فهمند که من چه می خواهم بگویم و ویدیوها را تماشا می کنند، این چیزی است که به آن اهمیت می دهم. از ترانه تیتراژ مجموعه، او بهترین تک آهنگ پیشرفته است که نیکول کیدمن را به خود می بالد، همانطور که ستاره موزیک ویدیوی آن سیوان گفت: این آهنگ بسیار مهمی برای من است. این چیزی است که قبلاً در موسیقی کشف نکرده بودم. این چیزی است که من در تمام زندگی خود احساس کردم و هرگز راهی برای بیان آن نداشتم. او به اشتراک گذاشت آلبوم چنین سفری است. نوعی شلاق بین این آهنگ‌ها وجود دارد که احساس می‌کنم دارم روی صحنه اجرا می‌کنم، آن‌ها فوق‌العاده بزرگ و غم‌انگیز هستند و بعد ناگهان در اتاق هتلم افسرده و تنها می‌شوم و درباره مردی که هنوز ندیده‌ام آهنگ می‌نویسم، این آهنگ‌های عاشقانه تجلی، تقریباً مانند این عنصر رقت‌انگیز در آلبوم نیز وجود دارد. فکر می‌کنم زمان زیادی را در هر دوی این مکان‌ها صرف کردم"}, {"source": "Billboard", "title": "Ella Langley Addresses Bomb Threat That Led to Show Cancellation: ‘A Concert’s Not Worth a Human Life’", "link": "https://www.billboard.com/music/country/ella-langley-concert-bomb-threat-stage-return-1236358808/", "summary": "Ella Langley returned to the stage in Lubbock, Texas, Saturday night (Oct. 10) after canceling Friday s concert in Tulsa, Okla., due to a security threat that had been called in ahead of the event. Related Ella Langley Cancels Oklahoma Concert Hours Before Showtime Citing Serious Security Threat Ella Langley s Choosin Texas All the Hot 100 Hits That Set Records for Most Weeks at No. 1 Here s the Date of the 2027 ACM Awards – And How to Get Tickets Though local law enforcement swept Tulsa s BOK Center and its surroundings and determined the threat was not credible on Friday, the show was still called off. Langley explained why that decision was made on Saturday in Lubbock. When it comes to keeping you safe, and making sure that this show is a safe place for us to come and enjoy our music, it will happen. But the second it feels like it s not, I m not doing it. I m not doing it because a concert s not worth a human life. It s not, Langley said, as seen in a fan-filmed video clip from Saturday s show at United Supermarkets Arena. I would ve made yesterday s decision 10 billion times over. I would have, she added. The Choosin Texas hitmaker her single holds the record for the most weeks at No. 1 on the Billboard Hot 100 continued to address the situation for a couple more minutes before launching into her song Loving Life Again. Langley told the crowd, While I m grateful to get to do what I do, it s not the most important thing in this life. The most important thing in this life is the people around you that love you, and that are there for you no matter what. The most important thing in this life is making sure you wake up every day and feel like, you know what, I m good today. I m so grateful to have woken up today. She then turned to her faith, saying, The most important thing in this life, number one, is your relationship with Jesus Christ. If it wasn t for Him, I would ve canceled this show tonight, said Langley, who s currently on her Dandelion Tour, in support of her album of the same name. I would have. But I felt this calling and this tug at my chest that says, It s OK. We are safe and we can do this show. I decided to [perform tonight] because of Him right there. She went on, Every time I see do not fear in the Bible, I underline it. Every single time. I m not going to live in fear. We are going to put on music and get to do this for the rest of our lives, and I know that. I know that because this is my calling. This is the thing that I was called to", "date_str": "2026-10-11T21:19:17+00:00", "hash": "fcc3a8b1b092a39b", "title_fa": "الا لنگلی به تهدید بمب گذاری که منجر به لغو نمایش شد، پرداخت: \"یک کنسرت ارزش یک زندگی انسان را ندارد\"", "summary_fa": "الا لنگلی، شنبه شب (10 اکتبر) پس از لغو کنسرت جمعه در تولسا، اوکلا، به دلیل یک تهدید امنیتی که پیش از مراسم فراخوانده شده بود، به صحنه در لوبوک، تگزاس بازگشت. مربوطه الا لنگلی کنسرت اوکلاهاما را ساعاتی قبل از زمان پخش کنسرت لغو کرد و به استناد تهدیدات امنیتی جدی الا لنگلی Choosin Texas همه 100 آهنگ داغی که رکوردها را برای اکثر هفته‌ها در رتبه اول ثبت کردند. 1 در اینجا تاریخ جوایز ACM 2027 است – و نحوه دریافت بلیط اگرچه مجری قانون محلی مرکز BOK تولسا و اطراف آن را تحت کنترل درآورد و تشخیص داد که تهدید در روز جمعه معتبر نیست، نمایش همچنان متوقف شد. لنگلی توضیح داد که چرا این تصمیم روز شنبه در لوبوک گرفته شد. وقتی نوبت به حفظ امنیت شما می‌رسد و مطمئن می‌شوید که این نمایش مکانی امن برای آمدن و لذت بردن از موسیقی‌مان است، این اتفاق می‌افتد. اما دومی که احساس می کنم اینطور نیست، من این کار را نمی کنم. من این کار را انجام نمی دهم زیرا یک کنسرت ارزش جان یک انسان را ندارد. لنگلی گفت که اینطور نیست، همانطور که در یک کلیپ ویدیویی که توسط طرفداران از نمایش شنبه در یونایتد سوپرمارکت آرنا دیده می شود، اینطور نیست. من تصمیم دیروز را 10 میلیارد بار می گرفتم. او افزود، من می خواهم. آهنگساز Choosin Texas که رکورددار بیش‌ترین هفته‌ها در رتبه 1 در بیلبورد Hot 100 است، پیش از اجرای آهنگ Loving Life Again، چند دقیقه دیگر به این وضعیت پرداخت. لنگلی به جمعیت گفت، در حالی که من از انجام کاری که انجام می دهم سپاسگزارم، اما این مهم ترین چیز در این زندگی نیست. مهمترین چیز در این زندگی افرادی هستند که در اطراف شما هستند که شما را دوست دارند و هر چه باشد در کنار شما هستند."}, {"source": "Deadline", "title": "The BBC’s Content Chief Has A Message For Reality TV Snobs", "link": "https://deadline.com/2026/10/bbc-kate-phillips-on-traitors-reality-tv-snobs-top-gear-1237154708/", "summary": "Kate Phillips, the BBC’s content chief, has a message for reality TV snobs. Phillips was at MIPCOM during a BBC Studios Reality Check session to talk up the power of reality TV and unscripted more broadly, with a call for more pitches from reality producers. For me reality is the hardest genre for us to [ ]", "date_str": "2026-10-12T14:14:31+00:00", "hash": "50285f0dec6330f0", "title_fa": "مدیر محتوای بی بی سی پیامی برای اسنوب های تلویزیون واقعیت دارد", "summary_fa": "کیت فیلیپس، مدیر محتوای بی‌بی‌سی، پیامی برای اسنوب‌های تلویزیون واقعیت دارد. فیلیپس در MIPCOM در یک جلسه بررسی واقعیت استودیوی بی‌بی‌سی حضور داشت تا در مورد قدرت تلویزیون واقعیت صحبت کند و فیلمنامه‌ای را به طور گسترده‌تر منتشر کند، و با فراخوانی برای ارائه پیشنهادات بیشتر از سوی تولیدکنندگان واقعیت، صحبت کرد. برای م  recent love for Canadian content. In an interview today at MIPCOM Cannes alongside Meatballs co-star Maddie Phillips, G.K. praised the likes of streamer Crave for commissioning risk-taking programs. Speaking about Meatballs, a new version of the Bill Murray-starring camp comedy [ ]", "date_str": "2026-10-12T12:13:15+00:00", "hash": "2d2d342b309a200c", "title_fa": "رابی جی.کی. در کمدی هوس انگیز «کوفته»: «تغییرات بزرگ ارزش انجام دادن دارد»", "summary_fa": "شکست داغ رقابت رابی جی.کی. از سریال کمدی آینده خود یعنی Meatballs حمایت می کند تا عشق اخیر به محتوای کانادایی را عمیق تر کند. در مصاحبه ای امروز در MIPCOM Cannes در کنار مدی فیلیپس، یکی از بازیگران فیلم Meatballs، G.K. افرادی مانند استریمر کراو را به دلیل راه اندازی برنامه های ریسک پذیر تحسین کرد. او در مورد Meatballs، نسخه جدیدی از کمدی کمپ با بازی بیل موری [ ] صحبت کردن در مورد Meatballs، نسخه جدید کمدی کمدی با بازی بیل موری از ایوان رایتمن، گفت: این یک نوسان بزرگ است و همانطور که از کریو و دیگران دیدیم، نوسان های بزرگ ارزش برداشتن دارد. ددلاین از G.K. که نقش دیل را بازی می‌کند، و فیلیپس را با لحن میت‌بالز، که به‌عنوان یک تخیل بداخلاقانه و بی‌احترامی از کمدی کلاسیک محبوب کانادایی 1979 معرفی می‌شود، پرسید که آیا یک کمدی با مضمون جنسی برای مخاطبان امروزی پس از دوره‌ای که اغلب برای کمدی خنده‌دار بازی می‌کردند، جواب داد. اخبار مربوط به آخرین مهلت را تماشا کنید واترفال دستان ران پرلمن کنترل مخاطبان با مبلغ 275000 دلار اخبار صندوق سازنده اخبار پدرو پینا: یوتیوب برای تولید محتوا سرمایه گذاری نشده است، G.K.، که گفت بسیاری از طنز نمایش از سبک ساختگی آن نشات می گیرد، گفت. آونگ از یک طرف تاب می خورد و حالا به طرف دیگر تاب می خورد. قرار است چیزی برای همه وجود داشته باشد که با آن طنین انداز شود، زیرا همه شخصیت ها بسیار متفاوت هستند، و تفنگ شوخی همیشه به سمت شخصیت های مختلف نشانه می رود، بنابراین شما مجبور خواهید بود به چیزی که برایتان خنده دار است، سفر کنید. مردم برای این کار آماده هستند. فیلیپس، که نقش شخصیت اصلی اسکایپر را بازی می‌کند، فیلمبرداری را به‌گونه‌ای توصیف کرد که احساس می‌کنند گروهی از بچه‌های تئاتر در یک کلاس"}, نجلس به پلتفرمی برای خواهران پنیا تبدیل شده است تا داستان‌های مهاجر خود را به اشتراک بگذارند. آتزیریا به RS می‌گوید: «باریو درایو بازتابی از هویت من به‌عنوان فردی عجیب و غریب و بدون سند است. \"بسیاری از کارها فقط از بقا ناشی می شود.\" از سال 2020، این برند پوشاک و لوازم جانبی مجموعه‌هایی با رنگ‌های روشن منتشر کرده است که 100 درصد درآمد آن به صندوق DACA (اقدام معوق برای ورود به دوران کودکی) اختصاص می‌یابد. پنیا می‌گوید: «ما از سود آن کالا استفاده می‌کنیم تا بتوانیم برای تمدید DACA افراد دیگر هزینه کنیم. \"در حال حاضر فقط تمدید است زیرا شما نمی توانید برای DACA به عنوان یک متقاضی جدید درخواست دهید.\" از زمانی که ترامپ برای اولین بار روی کار آمد، او سعی کرد به برنامه دوران اوباما پایان دهد و سیاست های مهاجرتی او حفاظت از این"}, {"source": "Rolling Stone", "title": "Fontaines D.C. Make Dystopian Rock That Hits Just Right for Dark Times", "link": "https://www.rollingstone.com/music/music-album-reviews/fontaines-d-c-dopamine-chamber-album-review-1235637810/", "summary": "On Dopamine Chamber , the Irish band reaches further into electronic moodiness while delivering hard-hitting reflections on how to stay sane — and maybe even hopeful — these days", "date_str": "2026-10-12T13:30:00+00:00", "hash": "be23f5f98b97fd9a", "title_fa": "Fontaines D.C راک دیستوپیایی را می سازد که برای Dark Times به درستی برخورد می کند", "summary_fa": "در Dopamine Chamber، گروه ایرلندی در حالی که بازتاب‌های سختی را در مورد چگونگی سالم ماندن - و شاید حتی امیدوارکننده - ارائه می‌کند، بیشتر به سمت بدخلقی الکترونیکی می‌رود. خطوط بیس پرهیاهو یادآور Joy Division و New Order بود، گیتارهای دندانه دار پاییز را تداعی می کردند. اما این بچه‌ها حس منحصر به فرد ایرلندی خود را از غزل، طنز پوچ‌گرایانه و روحیه فقیرانه داشتند. شما باید یک ورزش اسپویل واقعی باشید تا عاشق گروهی نشوید که رهبر آن، گریان چتن، به رولینگ استون بریتانیا گفته است. که دوست دارد قبل از نمایش با گوش دادن به کتاب صوتی جیمز جویس دوبلینی ها استراحت کند. هر یک از آلبوم‌های بعدی Fontaines متفاوت و جاه‌طلبانه‌تر بودند، و آنها واقعاً با LP 2024 خود، Romance، به اوج رسیدند، صدای خود را به سبک سنگین آلت راک و صنعتی دهه نود، بریت‌پاپ، و یک کانن رویایی-راک از Cocteau Twins تا Deftones تا Lana Del Rey، در حالی که بازتابی از امیدهای بسیار سخت و حتی فراگیر ارائه می‌دهند. این روزگار تاریک فزاینده آلبوم پنجم آنها، اتاق دوپامین، روحیه جهانی سازی مشابهی دارد. گروه در حال فراتر از پایه‌های گیتار-راک خود است، و در آهنگ‌هایی که به نظر می‌رسد طراحی‌شده‌تر از بی‌نظمی است، عمیق‌تر به خلق و خوی الکترونیکی و فراگیری ارکسترال می‌رود. اما این بار در سرتاسر جهان از همه طرف به عذاب رسیده است. ضبط با پخش شوم کم پایان Six Shot Morning آغاز می شود. چاتن با یک باریتونی تاریک درباره دره سیلیکون می خواند که وجود ما را تسخیر می کند، قبل از ارائه آهنگی که ایدئولوژی فراانسانی الیگارش های فناوری مانند پیتر تیل را به شعر طنزآلود پاپ تبدیل می کند: من و تو یک میلیون سال زندگی می کنیم/همیشه، همیشه."}, {"source": "Rolling Stone", "title": "The 2027 Grammys’ Race for Record of the Year Is the Most Competitive in Ages", "link": "https://www.rollingstone.com/music/music-features/grammys-2027-record-of-the-year-predictions-nominees-1235640528/", "summary": "Ella Langley, Taylor Swift, and Raye are all destined for nominations — not to mention Olivia Rodrigo and Olivia Dean", "date_str": "2026-10-12T13:05:09+00:00", "hash": "b7a017a73f5dcb22", "title_fa": "مسابقه گرمی 2027 برای رکورد سال، رقابتی ترین مسابقه در اعصار مختلف است", "summary_fa": "الا لنگلی، تیلور سوئیفت، و ری همگی برای نامزدی نامزد شده‌اند - به الیویا رودریگو و اولیویا دین اشاره نکنیم. برای هر کدام، نامزدها و همچنین اینکه چه کسی (و چه کسی باید) در شب گرمی برنده شود را پیش‌بینی می‌کنیم. رکورد سال که نباید با آهنگ سال اشتباه گرفته شود، نسخه ضبط شده یک آهنگ را گرامی می دارد و به همه افرادی که در ساخت موسیقی آن دست دارند داده می شود. محصول امسال احتمالاً شاهد مقابله هنرمندان با سابقه در مقابل تازه واردان نسبتاً در ترکیبی از ژانرها، از جمله الا لنگلی، ری، نوح کاهان، و پروتئن رزال a خواهد بود. تونی گروینو، سردبیر Tidal، به گرمی اشاره می کند. آنها سعی می کنند که سن کمتری داشته باشند و مخاطبان جوان م] لذتی که در صدای آن مرد ایجاد شد وقتی او شنید، اوه، آره، این نمایش ماست. آن لبخند، تعداد داستان‌هایی که داشت، زیرا بزرگ‌ترینش هفت یا هشت سال بود، بنابراین در حال رشد از کوکاملون بود، اما دو نفر دیگر هنوز در سن بودند. شما نمی توانید آن احساس را توصیف کنید. اگر کوکاملون یک فرد بود، برای رای دادن به اندازه کافی پیر بود. اولین ویدیو در سپتامبر 2006 در یوتیوب منتشر شد، و بیش از 200 میلیون مشترک و 200 میلیارد بازدید بعد از آن، غوغایی از رسانه های پیش دبستانی است. اما برند کودکان خود را در میانه یک لحظه جالب می بیند. سازندگان یوتیوب تقاضای زیادی دارند، و این خوش شانس است که شاید اولین کسی باشد که به لطف معاملاتی مانند نتفلیکس و دیزنی، آن را خارج از این پلتفرم بزرگ کرده است. این شرکت روی مدلی شرط بندی می کند که حتی با قطع قراردادها برای حضور در سایر پلتفرم ها، آن را در یوتیوب رشد دهد. و سال آینده، Moonbug با فرنچایز: CoComelon: The Movie،"}, {"source": "Hollywood Reporter", "title": "How to Spend a Few Days in Victoria, Australia: “The Vibes are Immaculate”", "link": "https://www.hollywoodreporter.com/lists/australia-travel-restaurants-hotels-qantas-schedule-itinerary/", "summary": "The Hollywood Reporter heads Down Under for five days in Australia as the NFL makes history.", "date_str": "2026-10-12T13:00:00+00:00", "hash": "a8a3aebf64b8421d", "title_fa": "چگونه چند روز را در ویکتوریا، استرالیا بگذرانیم: \"حال و هوا بی عیب و نقص هستند\"", "summary_fa": "هالیوود ریپورتر به مدت پنج روز در استرالیا به سر می برد تا NFL تاریخ ساز شود. ساعت بعد از 9 شب است در پرواز QF94 کانتاس با سرویس از لس آنجلس به ملبورن، استرالیا و مسافران کلاس تجاری در حال انبار کردن چمدان‌های بالای سر هستند و تا 15 ساعت آینده روی صندلی‌های خود مستقر می‌شوند. حتی با یک پرواز طولانی چند دقیقه بعد از بالا آمدن چرخ‌ها، انرژی شادی‌بخش در داخل کابین جریان می‌یابد و زنی که لبخندی گشاد به تن دارد و یک سویشرت سان فرانسیسکو 49ers دارد از صندلی خود خارج می‌شود تا با درخواستی جسورانه به مسافر دیگری نزدیک شود - برای گرفتن عکس سلفی. او با نادیده گرفتن یک بازیگر مشهور با ظاهری زیبا که جلوی او ایستاده است، خود را پایین م همهجانبه‌اش، که اکنون در جشنواره فیلم لندن نمایش داده می‌شود، با هدف تغییر باورهای غلط و نشان دادن فروتنی در درک ژاپنی‌ها از قدرت است. ممکن است متوجه نشوید که چقدر می‌خواهید در مورد سومو بدانید تا زمانی که با تجربه «سومو: روح وزن ندارد» اثر Erik Shirai به پشت صحنه بروید. این مستند که برای اولین بار در ونیز به نمایش درآمد و اکنون در هفتادمین دوره جشنواره فیلم لندن (LFF) که از 13 اکتبر آغاز می شود، نمایش داده می شود، مخاطبان را به دنیای خصوصی بدنام سومو، از آموزش طاقت فرسا و تشریفات تا درد و فداکاری می برد. این فیلم سینمایی تعدادی از کشتی گیران را در مراحل مختلف حرفه خود دنبال می کند، از جمله یوکوزونا، عنوانی که نشان دهنده بالاترین رتبه در سومو حرفه ای در طول یک سال است. آنها Terunofuji Haruo، Hiradoumi Yuki، Yonezawaryu Daiki و Kosei Motomura هستند. یکی از نکات کلیدی اهمیت روحیه جنگندگی است. یا همانطور که در خلاصه داستان آمده است: قدرت واقعی نه در گوشت، بلکه در پالایش روح سنجیده می شود. داستان های مرتبط سبک زندگی کوئنتین تارانتینو اولین حضور در وست اند The Popinjay Cavalier تاریخ اکران در فیلم های تئاتر فونیکس میرن مک، سی جی بکفورد امیدوارند خودشان را در درام رمانتیک پیدا کنند آرتور کلارا: تصاویر انحصاری آستین با نگاه اول، مستندی که برای آن هارشیهان و شایرایدر نقش سینما را بر عهده داشته است. ویراستار، v rit صمیمی را با مشاهدات شاعرانه ترکیب می کند تا بیشتر در مورد ورزشی که اغلب برای کسانی که خارج از ژاپن به نظر می رسد غریبه به نظر می رسد، اطلاعات بیشتری نشان دهد. این فیلم که توسط ESPN Film ارائه شده است، محصول Rise Films با همکاری Real Lava و Generation11 است."}, {"source": "Hollywood Reporter", "title": "Quentin Tarantino’s West End Debut ‘The Popinjay Cavalier’ Sets Launch Date at Phoenix Theatre", "link": "https://www.hollywoodreporter.com/lifestyle/arts/quentin-tarantino-popinjay-cavalier-sacha-tickets-phoenix-1236727624/", "summary": "The play's lead star Sacha Baron Cohen said he is \"beyond delighted\" to be losing his \"West End virginity\" with the famed writer-director.", "date_str": "2026-10-12T08:24:19+00:00", "hash": "ae7b2fbceb508c0a", "title_fa": "اولین نمایش «The Popinjay Cavalier» کوئنتین تارانتینو در وست اند در تئاتر فینیکس مشخص شد.", "summary_fa": "ساشا بارون کوهن، ستاره اصلی این نمایش، گفت که \"فراتر از خوشحالی\" از دست دادن \"بکارت وست اند\" خود با نویسنده و کارگردان مشهور است. اولین بازی کوئنتین تارانتینو در وست اند یک تاریخ مشخص شده است. Popinjay Cavalier، از سونی پیکچرز انترتینمنت و سونیا فریدمن پروداکشنز، در 18 مارس 2027 با پیش نمایش از 23 فوریه و رزرو تا 13 ژوئن در تئاتر فینیکس افتتاح می شود. فروش بلیت ها از دوشنبه، از 25 (33 دلار) آغاز می شود. نویسنده و کارگردان تارانتینو گفت: من مشتاقم که شبی عالی را به West End ارائه دهم. ساشا بارون کوهن در حال بازی در فیلم Ali G: Who Iz I؟ ، نقش اصلی را در اولین حضور او در West End به دست آورده است. او در مورد تماس تلفنی خود با مؤلف توضیح داد: من قبل از اینکه بتواند اولین مادرش را بگوید، گفتم بله. وقتی بهترین کارگردان دنیا تماس می گیرد، شما سوالی نمی پرسید. من بسیار خوشحالم که با هم بکارت وست اند خود را از دست خواهیم داد. من به او قول داده ام که مهربان نباشد. داستان‌های مرتبط فیلم‌هایی که در MIPCOM می‌فروشند: مهیج‌های جاسوسی، عاشقانه‌های سلطنتی و فیلم‌های حماسی زولو میرن مک، سی‌جی بکفورد امیدوارند خودشان را در درام رمانتیک پیدا کنند آرتور کلارا: تصاویر منحصر به فرد آستین با نگاه اول که در اروپای دهه 1830 اتفاق می‌افتد. و لباس مبدل با الهام از حماسه‌های بزرگ صحنه و صفحه نمایش. کمپانی سازنده ادامه داد: جشنی فراگیر از تئاتر و عاشقانه‌های اوج آن، که با سبک خاص تارانتینو و شوخ طبعی بی‌گمان روایت می‌شود، The Popinjay Cavalier از ژانر کلاسیک swashbuckler هالیوود قدیمی، شامل نوشته‌های جورج بروس، ارنست وایدا و جسی لاسکی جونیور الهام گرفته شده است."}, {"source": "Hollywood Reporter", "title": "What’s Selling at MIPCOM: Spy Thrillers, Royal Romances and a Zulu Epic", "link": "https://www.hollywoodreporter.com/movies/movie-features/whats-selling-mipcom-spy-thrillers-royal-romances-1236723470/", "summary": "With vertical video, AI and YouTube upending the TV business, buyers heading to Cannes will find that everything old is suddenly new again.", "date_str": "2026-10-12T08:00:00+00:00", "hash": "495e62a05ddb4322", "title_fa": "آنچه در MIPCOM به فروش می رسد: مهیج جاسوسی، عاشقانه های سلطنتی و حماسه زولو", "summary_fa": "با ویدیوی عمودی، هوش مصنوعی و یوتیوب که تجارت تلویزیون را متحول می کند، خریدارانی که به کن می روند متوجه می شوند که همه چیز قدیمی ناگهان دوباره جدید شده است. چند سالی است که کسب و کار تلویزیون را مانند این آزمایش کرده اند. درام‌های عمودی اولین گوشی از آزمایش به جریان اصلی در حال حرکت هستند، محتوای تولید شده توسط هوش مصنوعی به خط لوله تولید می‌رود و سازندگان ادعا می‌کنند که سهم فزاینده‌ای از زمان تماشاگران را دارند. یوتیوب، که اکنون برنده آشکار جنگ های ویدیویی است، شرایط را تعیین می کند، در حالی که تلویزیون تجاری در تلاش برای یافتن مدل های جدید است. تمام این اختلالات در چهار روز MIPCOM، بزرگترین نمایشگاه تجاری تلویزیونی جهان که از 12 تا 15 اکتبر برگزار می شود، متمرکز خواهد بود. پرنتیس فریزر، رئیس شرکت Fox Entertainment Global از بازار سال 2026 می‌گوید: امسال چیزی ذاتاً متفاوت است. ما از این هفته برای ارتباط مجدد با شرکای بین المللی در تمام مشاغل جدید استفاده می کنیم و در عین حال همچنان کسب و کار تلویزیونی سنتی خود را حفظ می کنیم. داستان های مرتبط فیلم شورش: چرا مستند برادفورد 12 بسیار به موقع است و مدیران آن می خواهند مردم بدانند که مشکلات شما توسط ایلان ماسک ساخته شده است، نه اخبار مهاجران راسل برند برای شروع دادگاه تجاوز جنسی به دادگاه لندن می رسد در حالی که بسیاری از بحث ها و بحث های امسال در مورد تلویزیون جدید و اصلی تلویزیون COMIP هنوز در جریان است. خریداران جهانی که به جنوب فرانسه می‌روند سیر خواهند شد: راه‌اندازی مجدد فرنچایز، درام‌های دوره‌ای، هیجان‌انگیز جاسوسی و حتی یک حماسه زولو در کنار قالب‌های تازه‌ای از فرمت‌های بدون فیلمنامه به امید تبدیل شدن به خائنان بعدی. پخش‌کننده‌های عمومی Pitch و پخش‌کننده‌های منتخب این درام جدید بریتانیایی را با بازی"}, {"source": "Hollywood Reporter", "title": "Mirren Mack, CJ Beckford Hope to Find Themselves in Romantic Drama ‘Arthur & Clara’: Exclusive Austin First-Look Images", "link": "https://www.hollywoodreporter.com/movies/movie-news/austin-arthur-and-clara-film-images-mirren-mack-cj-beckford-1236726941/", "summary": "They play two young people who run away to the same farmhouse in the British countryside in screenwriter and director Kieran Bourne’s feature debut, the first feature from producer Candid Broads.", "date_str": "2026-10-12T08:00:00+00:00", "hash": "6630a5cecaf94dfe", "title_fa": "میرن مک و سی جی بکفورد امیدوارند خودشان را در درام رمانتیک «آرتور و کلارا» پیدا کنند: تصاویر منحصر به فرد آستین با نگاه اول", "summary_fa": "آنها نقش دو جوان را بازی می کنند که در اولین فیلمنامه نویس و کارگردان کایران بورن، اولین فیلم از تهیه کننده Candid Broads، به یک خانه مزرعه در حومه بریتانیا فرار می کنند. درام عاشقانه شخصیت محور آرتور کلارا، اولین فیلمنامه‌نویس و کارگردان کایران بورن (لهستانی، من پیلاتس هستم)، قرار است اولین نمایش جهانی خود را در جشنواره فیلم آستین، که از 29 اکتبر تا 29 نوامبر برگزار می‌شود، داشته باشد. 5. در این فیلم مستقل، که اولین تلاش شرکت سازنده Candid Broads Productions (The Date، Swim Sistas) به سمت ساخت فیلم بلند است، میرن مک (28 سال بعد: معبد استخوان، هدا) و سی جی بکفورد (هزار ضربه، بلیتز) بازی می‌کنند. بکفورد نقش یک فیلمساز را بازی می‌کند، در حالی که مک نقش بازیگری را به تصویر می‌کشد که هر دو به امید یافتن خود به یک خانه مزرعه فرار می‌کنند. در عوض، آنها متوجه می شوند که فقط به یک نفر نیاز دارند تا آنها را واقعی ببینند. داستان‌های مرتبط فیلم‌هایی که در MIPCOM به فروش می‌رسند: مهیج‌های جاسوسی، عاشقانه‌های سلطنتی و فیلم‌های حماسی زولو Gaza Doc NAZA بدون توزیع‌کننده پس از برانگیختن اعتراض‌ها از 500 هزار دلار فراتر رفت که در انزوای آرام حومه بریتانیا، آرتور کلارا یک کاوش صمیمی از هویت و اصیل است. بورن توضیح داد که آرتور کلارا داستان ارتباط واقعی انسانی در دنیایی است که به طور فزاینده ای منزوی شده است، و در زمانی که بیشتر تعاملات با غریبه ها دیگر حضوری نیست، برای من مهم بود که آن را بگویم. در حالی که بر پیوند بین دو نفر متمرکز است، اما مأموریت نهایی نشان دادن ارتباطی است که باید با خود داشته باشیم. این داستانی است که امیدوارم مخاطبان سال های آینده با آن طنین انداز باشند."}, {"source": "Variety", "title": "Italy Celebrates ‘E.T.’ Designer Carlo Rambaldi’s Upcoming Hollywood Walk of Fame Star", "link": "https://variety.com/2026/film/global/italy-e-t-designer-carlo-rambaldi-hollywood-walk-of-fame-1236908923/", "summary": "Italy is celebrating the Hollywood Walk of Fame star to be posthumously unveiled on Oct. 15 honoring special effects maestro Carlo Rambaldi, best known for designing the iconic alien title character in Steven Spielberg s E.T. the Extra-Terrestrial. Rambaldi, who died in 2012 at age 86, is a three-time Academy Award winner for his work in [ ]", "date_str": "2026-10-12T14:24:22+00:00", "hash": "1f7266fae6a1a8c7", "title_fa": "ایتالیا جشن «E.T.» طراح آینده ستاره هالیوود پیاده روی مشاهیر کارلو رامبالدی", "summary_fa": "ایتالیا ستاره پیاده روی مشاهیر هالیوود را جشن می گیرد که پس از مرگ در 15 اکتبر به افتخار استاد جلوه های ویژه کارلو رامبالدی، که بیشتر به خاطر طراحی شخصیت عنوان بیگانه در فیلم E.T استیون اسپیلبرگ شناخته می شود، رونمایی می شود. فرازمینی رامبالدی که در سال 2012 در سن 86 سالگی درگذشت، برنده سه جایزه اسکار برای کارش در [ ] قبل از E.T. رامبالدی پیش از این با استیون اسپیلبرگ در «برخورد نزدیک از نوع سوم» همکاری کرده بود. او متعاقباً با دیوید لینچ در کالت کلاسیک Dune کار کرد. فهرست بلندبالایی از کارگردانان برتری که رامبالدی در طول دوران کاری پرافتخار خود با آنها کار کرد، عبارتند از: فدریکو فلینی، لوچینو ویسکونتی، پیر پائولو پازولینی، مارکو فرری، ماریو باوا، داریو آرجنتو، لوسیو فولچی، جان هیوستون، ریدلی اسکات و الیور استون. محبوب در Variety Rambaldi در روستای Vigarano Mainarda، خارج از شهر فرارا، در شمال ایتالیا در منطقه امیلیا رومانیا، پسر یک مکانیک دوچرخه متولد شد. او در سال 1951 از آکادمی هنرهای زیبا در بولونیا فارغ التحصیل شد و با وجود اینکه آرزوی هنرمند شدن را داشت، زمانی که از او خواسته شد در سال 1956 یک اژدها برای یک فیلم علمی تخیلی کم‌هزینه بسازد، به دنیای سینما کشیده شد. لوسیا بورگونزونی، معاون وزیر فرهنگ ایتالیا، که مسئول بخش فیلم این کشور است، گفت: داستان کارلو رامبالدی از شهر کوچکی در استان فرارا تا هالیوود نشان می دهد که چگونه ایتالیا می تواند استعدادهایی تولید کند که می توانند چشم انداز سینمای جهان را تغییر دهند. او افزود که نبوغ او در میان حومه شهر فرارا و آکادمی هنرهای زیبا در بولونیا، در فرهنگ سخت کوشی و درخشندگی که امیلیا رومانیا همیشه آن را پرورش داده است، پرورش یافت."}, {"source": "Variety", "title": "‘Miami Vice ’85’ First Look: Michael B. Jordan and Austin Butler Revive Tubbs and Crockett as Reboot Begins Filming", "link": "https://variety.com/2026/film/news/miami-vice-85-first-look-michael-b-jordan-austin-butler-filming-1236908988/", "summary": "Michael B. Jordan and Austin Butler s Miami Vice 85 reboot has dropped its first look at the two stars in character as filming has started. Jordan is Ricardo Tubbs and Butler is Sonny Crockett in the reboot, based on the popular 80s detective show that ran from 1984 to 1989. In the original series, Don [ ]", "date_str": "2026-10-12T14:02:39+00:00", "hash": "6657cb0b8f1ec892", "title_fa": "«Miami Vice 85» اولین نگاه: مایکل بی جردن و آستین باتلر تابس و کراکت را احیا می کنند در حالی که فیلمبرداری ریبوت آغاز می شود", "summary_fa": "با شروع فیلمبرداری، ریبوت Miami Vice 85 مایکل بی جردن و آستین باتلر اولین نگاه خود را به این دو ستاره در شخصیت انداخته است. جردن ریکاردو تابز است و باتلر سانی کراکت در ریبوت، بر اساس نمایش پلیسی محبوب دهه 80 که از سال 1984 تا 1989 اجرا شد. ادی گاتگی، والتون گوگینز، آندر هالند و مایکل ایربی. کارگردانی این فیلم جوزف کوسینسکی است که اخیراً F1 و Top Gun: Maverick را بر عهده داشته است و در 19 مه 2028 وارد سینماها خواهد شد. محبوب در Variety راه‌اندازی مجدد، زرق و برق و فساد میامی اواسط دهه 80 را بررسی می‌کند و الهام گرفته از قسمت آزمایشی و فصل اول سبک فیلم‌های شاخص فیلم و مجموعه‌های تلویزیونی است. دن گیلروی فیلمنامه را بر اساس شخصیت هایی که توسط آنتونی یرکوویچ از مجموعه تلویزیونی خلق شده است، نوشته است. اریک وارن سینگر پیش نویس فیلمنامه قبلی را نوشته بود. دیلن کلارک و کوسینسکی به عنوان تهیه کننده در این فیلم حضور دارند. معاون اجرایی توسعه تولید سارا اسکات و مدیر خلاق توسعه تولید کریستینا هافروگ بر پروژه یونیورسال نظارت خواهند کرد. جردن پس از برنده شدن     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
