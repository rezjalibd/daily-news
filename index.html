ی «بیمار صفر» نیز در راه است، اما طرفداران باید منتظر بمانند تا کل آن را ببینند - با بازی سوئیفت، کالین فارل و داکوتا جانسون - یکشنبه شب در VMAs. Encore جدیدترین ردوکس یک آلبوم 2025 است که قبلاً با نام‌هایی مانند نسخه کاباره پر زرق و برق و نسخه اینترنتی سو پانک گسترش یافته بود. سوئیفت پس از بازدید از آنها در سوئد برای جشن گرفتن موفقیت ال‌پی اصلی، آهنگ‌های اضافی را با شرکایشان مکس مارتین و شل بک نوشت. از زمان ارسال Showgirl به No. 1 اکتبر گذشته، سوئیفت هم به تالار مشاهیر ترانه سراها و هم در ثبت ملی ضبط ثبت شد و آهنگی به نام «می دانستم، تو را می شناختم» برای داستان اسباب بازی 5 منتشر کرد. در مراسم VMA روز یکشنبه، او اولین \"افتخارات کارگردان هنرمند\" را دریافت خواهد کرد."}, {"source": "Pitchfork", "title": "Listen to Phoebe Bridgers’ New Song for A24 Film Primetime", "link": "https://pitchfork.com/story/listen-to-phoebe-bridgers-new-song-for-a24-film-primetime/", "summary": "Bridgers stars in the Lance Oppenheim-directed movie opposite Robert Pattinson", "date_str": "2026-09-25T04:01:20+00:00", "hash": "98588c1bc2caa100", "title_fa": "به آهنگ جدید فیبی بریجرز برای A24 Film Primetime گوش دهید", "summary_fa": "بریجرز در فیلمی به کارگردانی لنس اوپنهایم در مقابل رابرت پتینسون لودر ذخیره داستان ذخیره این داستان دیدگاه بارگذار داستان را ذخیره کنید این داستان را ذخیره کنید Primetime، فیلم جدید A24 از لنس اوپنهایم که وقایع برنامه تلویزیونی بدنام کریس هنسن در دهه 2000 To Catch a Predator را روایت می‌کند، امروز در سینماها اکران می‌شود. رابرت پتینسون نقش هانسن را به تصویر می کشد و مریت وور، اسکایلر گیسوندو و فیبی بریجرز همبازی هستند. همانطور که مشخص است، بریجرز آهنگ جدیدی را برای این فیلم به عنوان بخشی از موسیقی متن آن نیز ضبط کرده است. به \"On Video\" در زیر گوش دهید. «On Video» تنها یک تک آهنگ نیست که به فیلم اضافه شده است. بریجرز آن را به طور خاص برای پرایم تایم آهنگسازی کرد و از آهنگ اصلی آهنگساز آری بالوزیان تأثیر گرفت. آهنگ او به عنوان تم تیتراژ پایانی عمل می کند. Primetime اولین نقش بریجرز به عنوان یکی از بازیگران فیلم است، اما از نظر فنی اولین حضور او در فیلم نیست. در سال 2024، او در فیلم «درخشش تلویزیون دیدم» به کارگردانی جین شوئنبرون نقشی کوتاه در نقش خودش ساخت. ماه گذشته، بریجرز با بازی Lost Weekend، سومین آلبوم انفرادی او و اولین بار در شش سال بعد، بعد از Punisher 2020، به عنوان یک هنرمند انفرادی که مدت ها انتظارش را می کشید، بازگشت. او در حال حاضر در یک تور تیتراژ گسترده در حمایت از Lost Weekend است و از برخی از همکاران آلبوم دعوت کرده است تا به او کمک کنند تا آن را روی صحنه زنده کند. در توقفگاه خود در بروکلین، که مصادف با روز اکران پرایم تایم بود، او یک مینی شوی غافلگیرکننده Boygenius با لوسی داکوس و جولین بیکر با بازی «به اندازه کافی قوی» و «در مورد آن باحال» روی صحنه برد. در نمایشگاه"}, {"source": "Pitchfork", "title": "Madonna and Charli XCX Unite for New Song “Danceteria Afterhours”", "link": "https://pitchfork.com/story/madonna-and-charli-xcx-unite-for-new-song-danceteria-afterhours/", "summary": "Ahead of Madonna’s VMAs opening performance this weekend", "date_str": "2026-09-24T22:09:33+00:00", "hash": "becdfc61d5dc4f12", "title_fa": "مدونا و چارلی XCX برای آهنگ جدید \"Danceteria Afterhours\" متحد می شوند", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان مدونا و چارلی XCX در اولین آهنگ مشترک خود به «Danceteria Afterhours» می روند، آخرین آهنگ از یک رشته اضافه شده به Confessions II ملکه پاپ. بازسازی آلبوم \"Danceteria\" توسط اندرو وات، سیرکات، استوارت پرایس و خود مدونا تهیه شده است. آن را در زیر بررسی کنید. «Danceteria Afterhours» که تنها چند روز قبل از بازگشت مدونا به VMA ها حذف شد، دومین همکاری او در همین چند ماه است، پس از اینکه او کایلی مینوگ را برای «حس عشق (میکس پس از ساعت)» آگوست استخدام کرد. این همکاری به دنبال چشم‌اندازی ظاهری از مادج تا چارلی است، زمانی که او در ماه می در رسانه‌های اجتماعی نوشت: «اگر زمین رقص شما مرده است، شاید موسیقی اشتباهی را پخش می‌کنید.» چارلی XCX در تک آهنگ موسیقی، مد و فیلم خود به نام «راک موزیک» این آهنگ بسیار نقل قول را می‌خواند: «فکر می‌کنم فضای رقص مرده است/پس اکنون در حال ساخت موسیقی راک هستیم». نقد یکشنبه اخیر هری تافویا درباره اروتیکا مدونا را بخوانید."}, {"source": "Pitchfork", "title": "B0YG1RL Announce Self-Titled Album", "link": "https://pitchfork.com/story/b0yg1rl-announce-self-titled-album/", "summary": "The Miami-based duo’s fourth release of 2026 is out in October", "date_str": "2026-09-24T21:47:43+00:00", "hash": "4421657e7aaee916", "title_fa": "B0YG1RL آلبوم خود را اعلام کرد", "summary_fa": "چهارمین انتشار این دو در میامی در سال 2026 در ماه اکتبر منتشر می‌شود. Loader Save Story ذخیره این داستان Comment Loader Save Story Save this Story گروه موسیقی دو نفره B0YG1RL پاییز امسال آلبومی با نام خود منتشر می‌کنند. گروه ژوئن وینت و آنجلا ریو مستقر در میامی B0YG1RL را که حول محور مفهومی پایان جهان است، از طریق Surf Gang Records به نمایش خواهند گذاشت. تک‌آهنگ اصلی تحت تأثیر الکتروکلاش «Show Me» را به همراه موزیک ویدیویی که در باشگاه اسپیس نمادین میامی فیلم‌برداری شده است، در زیر ببینید. لیست آهنگ و تاریخ انتشار B0YG1RL هنوز اعلام نشده است. B0YG1RL طی سالی پربار برای این دو منتشر می‌شود، که سه رکورد دیگر - EXIT 2B، 777 و SIGNAL 01 - در سال 2026 منتشر کرده‌اند."}, {"source": "Pitchfork", "title": "How the Founder of Lady Gaga’s Biggest Fan Site Ended Up in Prison", "link": "https://pitchfork.com/story/how-the-founder-of-lady-gaga-biggest-fan-site-ended-up-in-prison/", "summary": "Gaga Daily’s Kirill Nguyen is free—and streaming Mayhem—after being detained for protesting the Belarusian government", "date_str": "2026-09-24T20:02:06+00:00", "hash": "3f2a20b545262e2e", "title_fa": "چگونه بنیانگذار بزرگترین سایت طرفداران لیدی گاگا در زندان به پایان رسید", "summary_fa": "Kirill Nguyen از گاگا دیلی پس از بازداشت به دلیل اعتراض به دولت بلاروس آزاد است - و در جریان پخش Mayhem - قرار گرفت. این نمایه، حاصل سایت مشهور طرفداران لیدی گاگا، نگوین، که اکنون 32 سال دارد، نزدیک به دو دهه پیش تاسیس شده بود، برای یک سال از فوریه 2024 تاریک شده بود. بازگشت او با واکنش بسیار شدیدی مواجه شد. او آن را کم اهمیت جلوه می دهد، اما این مردی است که نسلی از هیولاهای کوچولو را که گرسنگی می کشند برای هر تکه ای از محل سکونت مادر در یک اینترنت بسیار مخدوش شیر داده است. نگوین عمداً در مورد شرایط بازداشت خود مبهم بود، اما در صحبت با Pitchfork، برخی از جزئیات را فاش کرد. در سال 2020، نگوین در یک تظاهرات در بلاروس شرکت کرد، جایی که در آنجا بزرگ شده بود و بیشتر عمر خود را گذرانده بود. ماهواره شوروی سابق اخیراً الکساندر لوکاشنکو، \"آخرین دیکتاتور اروپا\" را در انتخاباتی که به طور گسترده به عنوان تقلب مطرح شده بود، برای ششمین دوره ریاست جمهوری منجنیق کرد. نگوین می‌گوید: «من فقط با یک پرچم بیرون آمدم و راه افتادم. \"این یک تظاهرات معمولی بود که هر روز شما در آمریکا انجام می دهید.\" چهار سال بعد، نگوین برای دیدار با خانواده خود در بلاروس بازگشت و در آنجا توسط نیروهای پلیس ایالتی دستگیر شد. با تماس از کشوری دیگر (او خواست که مکان دقیق خود را ثبت نکند)، خلق و خوی ناگوار نگوین یا به کسی که دو سال و نیم آخر عمرش را پشت میله های زندان گذرانده است، نادرست است یا مناسب است. از زمان بازگشت خود، نگوین مشغول جمع کردن سال‌ها از هواداران فروخورده در طول روز بوده است. او همچنین بیشتر با صدای خودش پست می‌گذارد، چیزی که زمانی آن را «غیرحرفه‌ای» می‌دانست. نگوین در یکی از"}, {"source": "Pitchfork", "title": "Sugababes Announce First Album as Original Trio in 26 Years", "link": "https://pitchfork.com/story/sugababes-announces-first-album-as-original-trio-in-26-years/", "summary": "After various lineup changes, the OG girl group have reunited for a self-titled record due out next year", "date_str": "2026-09-24T18:03:13+00:00", "hash": "68cc64cd16a19a96", "title_fa": "Sugababes اولین آلبوم خود را به عنوان Trio اصلی پس از 26 سال معرفی کرد", "summary_fa": "پس از تغییرات مختلف ترکیب، گروه دخترانه OG برای آلبومی با نام خود که قرار است سال آینده منتشر شود، دوباره متحد شدند. Loader Save Story ذخیره این داستان Comment Loader Save Story Save this Story Sugababes سرانجام آلبوم جدیدی را منتشر می کند که اولین آلبوم آنها در 26 سال اخیر است که دارای ترکیب اولیه Mutya Buena، Keisha Buchanan و Donaghy. Siobhán است. در 12 فوریه 2027، گروه دختران بریتانیایی LP خود را منتشر خواهند کرد - و تنها دومین گروه سه نفره اصلی - از طریق Sacred Three/The Orchard. (دوناقی از Sugababes در سال 2000، One Touch و فرشتگان با چهره های کثیف در سال 2002 جدا شد.) تک آهنگ بازگشت آنها، \"Ghost\" اکنون با یک ویدیوی همراه منتشر شده است که می توانید آن را در زیر تماشا کنید. یک بیانیه مطبوعاتی برای Sugababes به ترکیبی متنوع از ژانرها، از جمله garage، amapiano، و R B اشاره می کند. گروه در بیانیه ای گفت: \"ما از ابتدا می دانستیم که نمی خواهیم در این رکورد عجله کنیم.\" ما چیزهای زیادی را در آهنگ‌ها، صدا و همه جزئیات پیرامون آن ریخته‌ایم، و هر چه بیشتر با هم جمع می‌شدیم، واضح‌تر می‌شدیم که تنها یک چیزی وجود دارد که می‌توانیم آن را بنامیم: Sugababes. این احساس بی‌تردید به ما می‌دهد. ما عاشق نوشتن و ضبط این آلبوم هستیم و آنقدر هیجان‌زده هستیم که بالاخره زمان شنیدن آن فرا رسیده است.» Sugababes به طرز بدنامی چهار بار ترکیب خود را در طول سال ها تغییر داده اند. تغییر سوم آنقدر شدید بود که وقتی گروه آلبوم خود را با نام Sweet 7 در سال 2009 منتشر کرد، هیچ یک از اعضای اصلی باقی نماندند. در حالی که این تکرار گروه با وقفه مواجه شد، بوئنا، بوکانان و دوناگی شروع به کار برای بازیابی نام Sugababes کردند. در سال 2012،"}, {"source": "Pitchfork", "title": "Morphine Unveil Lost Album Cocoon", "link": "https://pitchfork.com/story/morphine-unveil-lost-album-cocoon/", "summary": "The album, led by the title track, was completed from recordings shelved soon before the death of frontman Mark Sandman", "date_str": "2026-09-24T17:54:08+00:00", "hash": "23944ba344c32083", "title_fa": "مورفین از پیله آلبوم گمشده رونمایی کرد", "summary_fa": "آلبوم، که توسط آهنگ اصلی رهبری می‌شد، از ضبط‌هایی که خیلی زود قبل از مرگ خواننده اصلی، مارک سندمن در قفسه گذاشته شده بود، تکمیل شد. چندین دهه در حال ساخت، این آلبوم هشت آهنگی اولین آلبوم کامل آلت راک مستقر در بوستون از زمان پنجمین آلبوم آنها، The Night است که پس از مرگ از طریق DreamWorks در سال 2000 منتشر شد. قبل از انتشار در 4 دسامبر از طریق Partisan، ویدیوی آرشیوی را برای آهنگ عنوان زیر تماشا کنید. جلسات گروه در سال 1998 توسط پل کیو کولدری و شان اسلید، دو نفر قدیمی تولید مورفین که پابلو هانی از Radiohead و Live Through This را نیز تولید کردند، تهیه شد. کلدری با سابین هرچداکیان، شریک ساندمن فقید، برای ارزیابی نوارهای اصلی از جلساتی که اکنون اساس Cocoon را تشکیل می‌دهند، کار کرد. کلدری در مطالب مطبوعاتی گفت: «وقتی آهنگ‌ها را در استودیویی که آن‌ها را انتقال دادیم، از صدای آهنگ‌ها متحیر شدم. واقعاً خیلی درست به نظر می رسید که دوباره آنها را از دخمه به دنیا بازگردانیم.» برای تکمیل آلبوم، کلدری میکس های جدیدی را به ضبط ها داد و دانا کولی، عضو گروه، قطعات جدید ساکسیفون را برای سه آهنگ ضبط کرد. برخلاف بسیاری از کاتالوگ‌های مورفین، که تمرینی در مینیمالیسم راک بود، ضبط‌ها شامل پیانو، گیتار و مشارکت‌های چندین درامر هستند. (The Night اولین آلبوم LP گروه بود که به‌عنوان یک کوارتت ضبط می‌شد، نه به‌دلیل مشارکت در درام‌ها از موسس بازگشت جروم دوپری و جایگزین او بیلی کانوی.) کولی اضافه کرد: «بازگشت به این ضبط‌ها سال‌ها بعد تجربه‌ای سورئال بود. مثل این بود که با یک پایم در حال حاضر یک ساکسو داشتم.»"}, {"source": "Pitchfork", "title": "U2 Announce First Album in Nine Years", "link": "https://pitchfork.com/story/u2-announce-first-album-in-nine-years/", "summary": "Carnaval De Luz cut “Torn” features Dolly Parton’s last-recorded vocal performance", "date_str": "2026-09-24T17:31:18+00:00", "hash": "ee931f7526703232", "title_fa": "U2 اولین آلبوم خود را پس از نه سال معرفی کرد", "summary_fa": "قطعه Carnaval De Luz \"Torn\" آخرین اجرای ضبط شده دالی پارتون را دارد. Loader Save Story Save this Story Loader Save Story Save this Story اولین آلبوم جدید U2 در نه سال اخیر بدون توجه به هر اتفاقی تیتر خبرها می شود، اما دوچندان قابل توجه است زیرا شامل آخرین اجرای دالی پارتوند قبل از مرگ او می شود. تقویم‌های خود را علامت‌گذاری کنید: Carnaval De Luz در 13 نوامبر در جزیره منتشر می‌شود. تک‌آهنگ اصلی آلبوم، «Silencio»، که در آن بونو دوباره به زبان اسپانیایی می‌خواند، اکنون با یک موزیک ویدیو به کارگردانی Cliqua منتشر شده است که در آن U2 یک سالن رقص تقریباً خالی را اجرا می‌کند. آن را در زیر تماشا کنید. \"لول کردن، رول کردن، رول کردن!\" بونو در یک بیانیه مطبوعاتی گفت. گیتارهای بلند، بیس عمیق، ریتم‌های هیجان‌انگیز و بله، اشک‌های نقره‌ای ظاهر خواهند شد! چون در فاصله‌ای نزدیک، درست خارج از کارناوال نور ما، انواع و اقسام موجودات وجود دارند... همان تخیلی که خلاقیت ما را برای ما به ارمغان می‌آورد، می‌تواند برای ما هیولا نیز به ارمغان بیاورد. بنابراین صدای طبل را بلندتر می کنیم. ما آتش بزرگتری می سازیم. ما داستان های خود را وحشی تر و خنده دار تر می کنیم. ما ملودی‌ها را شیرین‌تر می‌کنیم و آهنگ‌ها را بهتر می‌درخشند، زیرا اگر دنیا در تاریکی است، بهتر است نباشیم.» آلبوم نزدیکتر \"Torn\" دونوازی بین بونو و پارتون است که هر دو در کنار جانی مک‌دید این آهنگ را می‌نویسند. در مصاحبه ای با رولینگ استون، خواننده U2 فاش کرد که در ابتدا با پارتون تماس گرفته تا برای یک پروژه جانبی با الهام از موسیقی محلی ایرلندی موسیقی ضبط کند. او این پیشنهاد را رد کرد و در عوض آهنگی را که روی آن کار می کرد به او نشان داد. بونو به رولینگ استون گفت: \"او گفت: \"این"}, {"source": "Pitchfork", "title": "Michael Kiwanuka Serves Up New Album Fudge", "link": "https://pitchfork.com/story/michael-kiwanuka-serves-up-new-album-fudge/", "summary": "The self-produced LP was written “almost concurrently” with 2024’s Small Changes", "date_str": "2026-09-24T15:22:48+00:00", "hash": "56412cfdc310387c", "title_fa": "مایکل کیوانوکا آلبوم جدید فاج را سرو می‌کند", "summary_fa": "LP ساخته شده توسط خود \"تقریبا همزمان\" با تغییرات کوچک Loader 2024 Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان مایه آرامش است شنیدن خبرهای خوب از Michael Kiwanuka. پس از سکته مغزی چندین ماه پیش، این خواننده و ترانه سرا فاش کرد که در مسیر بهبودی است و آلبوم بعدی او، فاج، در 23 اکتبر از طریق Polydor منتشر خواهد شد. این پروژه که اولین تلاش او از زمان اولین کارش در سال 2012 است، \"تقریبا همزمان\" با جلسات ترانه سرایی برای تغییرات کوچک در سال 2024 نوشته شد. کیوانوکا در یادداشتی که در اینستاگرام منتشر کرد، توضیح داد که سکته مغزی او نتیجه خونریزی در مغزش به دلیل فشار خون بالا بود: \"آسیب مغزی که من متحمل شدم بسیار شدید بود، بنابراین کارهای توانبخشی زیادی باید انجام شود. این یک سفر طولانی و سخت در پیش است، اما من برای بهتر شدن می‌جنگم.\" یادداشت کامل در زیر قابل مشاهده است. کیوانوکا به‌جای واگذاری تولید «فاج به موش خطرناک» و «اینفلو»، هم‌کارهای همیشگی‌اش، تصمیم گرفت خودش با کمک «دام مونکز» تهیه‌کننده و همکار زهی‌اش، رزی دانورز، کار را انجام دهد. این تصمیم تا حدی الهام گرفته از مصاحبه ای با چیک کوریا، پیانیست جاز بود، که در آن او گفت: \"شما باید یاد بگیرید که در مورد آنچه دوست دارید مطمئن باشید، نه آنچه فکر می کنید برای دیگران خوب است... هر چیزی که فکر می کنید زیبا است، همان چیزی است که زیباست، و باید آن را دنبال کنید.\" مایکل کیوانوکا: فاج 51 دلار در تجارت خشن فاج : 01 لباس تابستانی 02 کالیفرنیا 03 فقط یک لحظه دیگر 04 غرق شدن در قلبت 05 عشق در قلب من 06 در سراسر آسمان 07 ستاره 08 مرا به پرواز درآوردی 09 حرکت در مسیر من 101 Steve’swings و"}, {"source": "Pitchfork", "title": "Sebadoh Reissuing Harmacy for 30th Anniversary", "link": "https://pitchfork.com/story/sebadoh-reissuing-harmacy-for-30th-anniversary/", "summary": "Listen to one of five previously unreleased additions, an alternate version of “Beauty of the Ride”", "date_str": "2026-09-24T15:00:16+00:00", "hash": "7581899f6d916ddf", "title_fa": "انتشار مجدد هارماسی سبادوه برای سی امین سالگرد", "summary_fa": "گوش دادن به یکی از پنج نسخه منتشر نشده قبلی، یک نسخه جایگزین از \"Beauty of the Ride\" Loader Save Story ذخیره این داستان Comment Loader Save Story Save this Story Sebadoh انتشار مجدد گسترده ای از Harmacy را تنظیم کرده است و آلبوم 1996 را پس از مدتی چاپ در دسترس بین المللی قرار داده است. ساب پاپ نسخه جدید را در قالب‌های 2xLP و 2xCD و همچنین به صورت دیجیتالی در 20 نوامبر منتشر خواهد کرد. 16 اثر کمیاب به رکورد اضافه شده است، از جمله پنج عکس که قبلا منتشر نشده بود. یکی از آنها، نسخه جایگزین «زیبایی سواری» را در زیر، به همراه فهرست آهنگ Harmacy (30th Anniversary Expanded Edition) بررسی کنید. آهنگ‌های کمیاب باقی‌مانده شامل نسخه‌های جایگزین سه آهنگ، یک دمو آکوستیک «Open Ended»، «Real Deal» سمت B و تعدادی ضبط زنده، از جمله جلسات بی‌بی‌سی گروه در آن دوره است. جی جی گلدن در Golden Mastering این آلبوم را بازسازی کرد. هارماسی یک پیشرفت تجاری جزئی برای سبادو بود، اگرچه لو بارلو همیشه مشتاق انتشار مجدد آن نبوده است. او در سال 2012 به تی کول ریچل از Stereogum گفت: «نمی‌دانم چگونه می‌توانیم آن را بهبود ببخشیم، مگر اینکه از آن زمان B-sides را وارد کنیم. بارلو افزود که این رکورد «یک دلخراش واقعی بود. قرار بود پیروزمندانه بازی Bakesale باشد، اما در واقع ساب پاپ مبلغ هنگفتی را روی آن ضبط گذاشتند و ما را در استودیو گذاشتند و بلافاصله مردی که با او کار می‌کردیم چنین گفت: «تو باید درامر خود را اخراج کنی.» و من دقیقاً مثل «اوه لعنتی.» او به ما می‌گفت که این آهنگ‌ها بدون اینکه درامر واقعاً تصمیم دیگری بگیریم منفجر نمی‌شوند. که البته ما درست نکردیم.»"}, {"source": "Rolling Stone", "title": "‘Heart of the Beast’ Feels Like Something Brad Pitt Made 30 Years Ago", "link": "https://www.rollingstone.com/tv-movies/tv-movie-reviews/heart-of-the-beast-review-brad-pitt-1235629731/", "summary": "The star goes full Jack London in this survivalist thriller about an ex-military officer and his pooch stuck in the Alaska wilderness", "date_str": "2026-09-25T14:30:30+00:00", "hash": "8cca4902cb055f44", "title_fa": "«قلب هیولا» شبیه چیزی است که برد پیت 30 سال پیش ساخته است", "summary_fa": "این ستاره با جک لندن در این تریلر زنده بقا در مورد یک افسر نظامی سابق و سگ او که در بیابان آلاسکا گیر کرده است، جک بلمونت (برد پیت) چیزهایی دیده است. سگ او، یک چوپان آلمانی و پسر بسیار خوبی به نام اودین نیز همینطور است. یکی از فرماندهان سابق عملیات ویژه ارتش که هنوز خاطرات تلخ و تلخی از ماموریت‌های گذشته دارد که می‌توانست در افغانستان، یا شاید در دوران تصدی در عراق، شاید هر دو، احتمالاً هیچ‌کدام از این ماموریت‌ها بازنشسته نشده باشد. اما نبرد در سر او جریان دارد. در مورد اودی هم همینطور. غیرعادی نیست که حیوان در نیمه‌شب از خواب بیدار شود، کابوس‌های ناشی از PTSD و پارس کردن در فانتوم‌ها گرفتار آن شوند. خوشبختانه جیمز آنجاست تا او را آرام کند. این کمترین کاری است که او می تواند پس از نجات اودین در آن روز انجام دهد. این دوتا پشت همدیگه دارن اکنون، تنها کاری که جیمز می‌خواهد انجام دهد این است که سوار سسنا شود، با بهترین دوستش به عمق بیابان آلاسکا پرواز کند، کمی آبجو بنوشد و از خلوت طبیعت لذت ببرد. اگر او و اودی بتوانند ماهی صید کنند، هرکسی که هنوز آرزو دارد پیت دنباله‌ای با تأخیر River Runs Through It را انجام دهد، دوباره او را در حال پخش کردن و پختن آن روی آتش باز برای شام، تشویق می‌کند. فقط حیف است که آنها مجبور شدند عدن جنگلی خود را ترک کنند وقتی یک طوفان بد در می آید. و در حالی که هیچ وقت واقعاً زمان خوبی برای حمله قلبی ناگهانی وجود ندارد، تجربه یک رویداد قلبی زمانی که هزاران فوت در بالای مرز رام نشده ایالت 49 در حال سر خوردن هستید، مخصوصاً ناخوشایند است. هواپیمای آنها به سختی سقوط می کند. تا نزدیکترین جاده 58 مایل فاصله دارد. جیمز و اودی که"}, {"source": "Rolling Stone", "title": "When George Michael Conquered the World as a Live Superstar — Then Walked Away", "link": "https://www.rollingstone.com/music/music-features/george-michael-faith-tour-1235629699/", "summary": "A new film, The Faith Tour , will revisit the forgotten moment when he embraced his live potential, just that once", "date_str": "2026-09-25T14:00:00+00:00", "hash": "6b3c91b30e898765", "title_fa": "وقتی جورج مایکل جهان را به عنوان یک سوپراستار زنده تسخیر کرد - سپس رفت", "summary_fa": "فیلم جدیدی به نام The Faith Tour، لحظه فراموش‌شده‌ای را که او پتانسیل زنده‌اش را در آغوش گرفت، بازنگری می‌کند، درست زمانی که جورج مایکل در اواخر دهه هشتاد در بالای جهان بود. او به‌عنوان نیمه خلاق Wham!، دوتایی پاپ بریتانیایی‌اش با دوست مدرسه‌اش اندرو ریجلی، بزرگ شد. اما برای پرواز انفرادی خود، او می خواست خود را به عنوان یک بزرگسال ثابت کند. یعنی رابطه جنسی به معنای گناه بود. به معنای کلش بود. جورج با انفرادی کلاسیک خود در سال 1987، Faith که دوباره به شکل گل میخ چرمی مشکی متولد شد، قوی بازگشت و صنعت موسیقی را که همیشه او را به عنوان یک شوخی دور ریختنی می دیدند، شوکه کرد. او به جای سوختن، سیاره زمین را با هیتکرافت ابتکاری Faith، Father Figur و I Want Your Sex فریب داد. او همچنین به عنوان یک مجری زنده، برای یک و تنها تور مگا پاپ انفرادی خود، تور Faith در سال 1988، پا به عرصه گذاشت. این یک لحظه فراموش شده عجیب در داستان او است، اما این یک بار در زندگی اش است که جورج مایکل در نقش یک بت انفر ا بیشتر پخش می‌کنند. شصت درصد از این اکتشافات از شنوندگان Gen Z انجام شده است. داستان های پرطرفدار جین دو که جی زی را متهم به تجاوز جنسی کرد کاملاً انکار می کند: هیچ یک از ادعاهای من در ضبط نهایی دالی پارتون حقیقت ندارد - دوئت با بونو در آلبوم جدید U2 برادر سه ترامپ با شی جین پینگ کاملاً عجیب و غریب بود دالی ریستاتینگا اورستات پارتوندرز. «تقاضای پرداخت» داده‌ها قدرت ماندگاری Im a Slave 4 U را نشان می‌دهد که توسط نپتون‌ها تولید شد و نشان‌دهنده انحراف از صداهای پاپ نوجوانان پرتولید اسپیرز در نسخه‌های قبلی بود. اسپاتیفای می‌گوید هر سال تقریباً در این زمان برای جشن سالگرد آهنگ، استریم‌هایی از این تک"}, {"source": "Rolling Stone", "title": "Seven Artists, Three Days, One Album: Inside e.l.f. Cosmetics’ ‘Mirror Mix", "link": "https://www.rollingstone.com/music/music-news/50-creators-one-album-inside-e-l-f-cosmetics-mirror-mix-1235631091/", "summary": "What happens when you give 50 songwriters, producers, creators, and collaborators free rein in one marathon creative session? E.l.f Cosmetics has the answer to this question – “Mirror Mix,” its second original music compilation album that features a bevy of rising talent across pop, R B, Latin, and rock. It’s an endeavor that honors e.l.f’s commitment [ ]", "date_str": "2026-09-25T13:24:13+00:00", "hash": "1a8645a005336336", "title_fa": "Seven Artists, Three Days, One Album: Inside e.l.f. لوازم آرایشی «Mirror Mix».", "summary_fa": "چه اتفاقی می‌افتد وقتی به 50 ترانه‌سرا، تهیه‌کننده، خالق و همکار در یک جلسه خلاقانه ماراتن آزادی عمل بدهید؟ E.l.f Cosmetics پاسخ این سوال را دارد - \"Mirror Mix\"، دومین آلبوم تلفیقی موسیقی اصلی آن که مجموعه ای از استعدادهای در حال رشد را در موسیقی پاپ، آر بی، لاتین و راک به نمایش می گذارد. این تلاشی است که به تعهد e.l.f احترام می‌گذارد [] چالش‌هایی که این روزها با نوازندگان مستقل روبرو هستند می‌تواند دلهره‌آور باشد: از هر 3 هنرمند، 1 هنرمند می‌گوید که عدم قرار گرفتن در معرض یک چالش برای شنیدن موسیقی آن‌ها است و 82% می‌گویند که نمی‌توانند از پس پرداخت تور برآیند. و 87.5 درصد از هنرمندانی که 18 تا لی با افزایش 12.4 درصدی به 308.4 میلیون دلار رسیده است. یکی از شگفت‌انگیزترین داده‌ها این است که وینیل رشد زیادی در موسیقی لاتین داشته است و 245.8 درصد در مجموع 13.7 میلیون دلار رشد کرده است. همگام سازی ها نیز بیش از 104.2 درصد دو برابر شد. موسیقی لاتین همچنان بالا می رود زیرا طرفداران بیشتری با هنرمندان مورد علاقه خود ارتباط برقرار می کنند و موارد دلخواه جدید را کشف می کنند. رافائل فرناندز، معاون ارشد سیاست عمومی ایالتی موسیقی لاتین، رافائل فرناندز جونیور، در بیانیه‌ای گفت، چه اولین تجربه شما اجرای نمادینی مانند Bad Bunny در Super Bowl یا سرود Shakira Burna Boy جام جهانی، یک لیست پخش مشترک یا گذشتن از مجموعه وینیل یکی از دوستانتان باشد، راه‌های بیشتری برای کشف و لذت بردن از موسیقی لاتین وجود دارد. این نتایج اواسط سال نشان می‌دهد که گسترش دسترسی و یک بازار موسیقی سالم که در آن سرمایه‌گذاری مداوم برچسب‌ها به هنرمندان کمک می‌کند تا از بین بروند، مخاطبان تازه‌تری پیدا کنند و حرفه‌ای پایدار بسازند. سال 2026 برای هنرمندان لاتین پر از لحظات فرهنگی و نقاط عطف بوده است. پس از اجرای تاریخی Bad Bunny در Super Bowl،"}, {"source": "Rolling Stone", "title": "Abbey Road Photography Awards Announce 2026 Winners", "link": "https://www.rollingstone.com/music/music-news/abbey-road-photography-awards-winners-2026-1235630896/", "summary": "Japanese photographer Masayoshi Sukita was presented with the Lifetime Achievement Award, while Roberta Bayley received this year’s ICON award", "date_str": "2026-09-25T08:34:38+00:00", "hash": "fcf91f8cfeed92cb", "title_fa": "جوایز عکاسی Abbey Road برندگان 2026 را اعلام کرد", "summary_fa": "به عکاس ژاپنی ماسایوشی سوکیتا جایزه یک عمر دستاورد اهدا شد، در حالی که روبرتا بیلی جایزه امسال ICON Abbey Road پنجمین دوره جوایز سالانه عکاسی موسیقی Abbey Road را شب گذشته در لندن برگزار کرد و برندگان 2026 خود را اعلام کرد. جاشوا هالینگ برنده بهترین لحظه موسیقی سال برای عکسی از طرفداران Oasis شد که در نمایش گروه در سال 2025 در بوئنوس آیرس گرفته شد. گابریل راوت برای فیلم پشت صحنه و تام پالانت برای موسیقی زنده برنده شدند. فرانسیس کارتر برای فیلم پرتره، AF Cort برای صحنه های زیرزمینی و جولیا اسپادافورا در بخش جشنواره ها برنده شدند. دارا پترووا برای عکسی از یک آزمایشگاه تکنو ریو در اوکراین به عنوان عکاس نوظهور سال انتخاب شد. دسته منتخب داوران به آنگوس جنر برای تصویر او از Oasis که در شب افتتاحیه تور اتحاد مجدد آنها گرفته شد، رسید. وین لارج برای عکسی که از اعضای گروه های مختلف پانک در سال 1979 در پارک کسل گاردنز، لستر گرفته بود، برنده جایزه 50 سال پانک شد. روبرتا بیلی، عکاس آمریکایی، جایزه ICON امسال را دریافت کرد. او به‌خاطر کارهایش در مورد صحنه‌های پانک راک اولیه، جذب هنرمندانی مانند ایگی پاپ، رامونز، دبی هری و بلوندی، ریچارد هل، سکس پیستولز و کلش شناخته شد. افلاطون از طرف بیلی این جایزه را پذیرفت. لورن لاورن میزبان این جوایز بود و کولینجی و تام ای. اسمیت اجرای آن را به نمایش گذاشتند. سالی دیویس، مدیر عامل استودیو ابی رود، در بیانیه‌ای گفت: جوایز عکاسی موسیقی ابی رود دیشب جشن فوق‌العاده‌ای از استعداد، خلاقیت و هنر عکاسی موسیقی بود. استاندارد کار استثنایی بود و دیدن چنین ترکیب غنی از چشم اندازها و صداها از عکاسان سراسر جهان الهام بخش بود. انتخاب سردبیر 250 آلبوم برتر قرن 21 تا کنون 100 بهترین قسمت تلویزیونی تمام دوران 500 آلبوم برتر تمام دوران 100"}, {"source": "Rolling Stone", "title": "‘Jimmy Kimmel Live’ Sets Brooklyn Week Lineup With Zohran Mamdani, Bruce Springsteen", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/jimmy-kimmel-live-brooklyn-week-lineup-mamdani-springsteen-1235631644/", "summary": "Paul McCartney, Seth Meyers, Tom Morello, John Oliver, and Bernie Sanders will also appear as part of the special week of shows", "date_str": "2026-09-25T07:38:04+00:00", "hash": "30501cd8574e9d7c", "title_fa": "«Jimmy Kimmel Live» با زهران ممدانی و بروس اسپرینگستین ترکیب هفته بروکلین را تنظیم می کند.", "summary_fa": "پل مک‌کارتنی، ست مایرز، تام مورلو، جان اولیور و برنی سندرز نیز به عنوان بخشی از هفته ویژه نمایش‌ها حضور خواهند داشت که جیمی کیمل لایو برای یک هفته نمایش به بروکلین می‌رود، که از دوشنبه با ترکیبی انباشته آغاز می‌شود. این نمایش ها که در آکادمی موسیقی بروکلین، هاوارد گیلمن اپرای هاوس پخش خواهند شد، زهران ممدانی شهردار نیویورک، ماهرشالا علی، بیلی کریستال، پیت دیویدسون، رابی هافمن، پل مک کارتنی، ست مایرز، تام مورلو، جان الیور، مهمانان برنی اسپرینگستن سولندرز، موزیک هاو مورلو، جان اولیور، برنی اسپرینگ سانلندرز غاز، تلویزیون در رادیو، و اسپرینگستین تام مورلو. جیمی کیمل پیشنهاد کرد که موارد بیشتری برای اعلام وجود دارد و بازدیدکنندگان را نیز متعجب می کند، گویی که بازدیدکنندگان معمولی به اندازه کافی خوب نیستند. داستان های پرطرفدار جین دو که جی زی را متهم به تجاوز جنسی کرد کاملاً انکار می کند: هیچ یک از ادعاهای من در ضبط نهایی دالی پارتون حقیقت ندارد - دوئت با بونو در آلبوم جدید U2 برادر سه ترامپ با شی جین پینگ کاملاً عجیب و غریب بود دالی ریستاتینگا اورستات پارتوندرز. \"تقاضای پرداخت\" هر پنج برنامه در مقابل تماشاگران استودیو زنده پخش می شود. کیمل شب گذشته خاطرنشان کرد که تولیدکنندگان تقریباً 150000 درخواست بلیط دریافت کرده اند. او گفت پس لطفا از درخواست بلیط خودداری کنید. تنها 1600 صندلی در سالن وجود دارد. سفر امسال به شرق، هشتمین دوره نمایش های بروکلین را برای جیمی کیمل لایو رقم خواهد زد. او قبلاً در سال های 2012، 2015، 2017، 2018، 2019، 2022 و 2025 در آکادمی موسیقی بروکلین نوار ضبط کرده بود. سال گذشته، استیون کولبرت یکی از مهمانان برجسته بود. مجری سابق Late Show گفت که متوجه شده است برنامه او در حین حضور لغو شده است."}, {"source": "Rolling Stone", "title": "Late-Night Hosts Take Aim at Trump’s Meeting With China’s President Xi", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/late-night-hosts-donald-trump-president-xi-meeting-1235631641/", "summary": "\"If they send Trump pandas he's definitely going to eat them,\" Jimmy Kimmel quipped", "date_str": "2026-09-25T07:13:49+00:00", "hash": "6e2946992d02b3a4", "title_fa": "میزبانان اواخر شب دیدار ترامپ با رئیس جمهور چین را هدف قرار می دهند", "summary_fa": "جیمی کیمل به طعنه گفت: «اگر پانداهای ترامپ را بفرستند، قطعاً آنها را خواهد خورد. در برنامه زنده جیمی کیمل، جیمی کیمل با کنایه گفت: کودک نه ساله من برای اولین بار این آخر هفته یک دوست به خانه آمد و او می خواست تمام وسایلش، لگوهایش، بازی های ویدیویی اش، تخت های دو طبقه و همه چیز را به او نشان دهد. و این دقیقا همان کاری است که ترامپ امروز انجام داد. او رئیس‌جمهور شی را به اطراف نمایش کشاند و تمام رنگ طلایی دیوانه‌واری را که روی دیوارها گذاشته بود به او نشان داد. سالن نیمه ساخته اش را به او نشان داد. او خاطرنشان کرد: برای مردی که همیشه در مورد چین فریاد می‌زند، هیرمن مائو امروز آن را بسیار ضخیم گذاشته است. کیمل افزود که رئیس جمهور شی اعلام کرد که دو پاندا غول پیکر را به عنوان هدیه به ایالات متحده می فرستد و آن را ایده بسیار بدی خواند. جیمی فالون در برنامه The Tonight Show سفر دو روزه رئیس جمهور شی در دی سی را توصیف کرد که شامل یک پل هوایی نظامی در فرودگاه و یک شام دولتی در کاخ سفید بود. فالون گفت، منوی شام امشب شامل باس دریایی با پوسته کنجد، بوک چوی آب پز، بادمجان باغی برشته شده، و دو بیگ مک با سیب زمینی سرخ کرده بزرگ و یک کک رژیمی بود. پس از نام بردن از پانداها، فالون از ترامپ تقلید کرد، شوخی کرد، و من با ارزش ترین حیوان خود، جیموتی راکون را به چین می فرستم. درست است. این برای شماست. ست مایرز در سخنرانی خود در اواخر شب خاطرنشان کرد که به نظر نمی رسد ترامپ به مسائل یا جزئیات دیدارها اهمیت دهد. در عوض، او بر روی سکوی هلیکوپتری جدید خود متمرکز بود، که به گفته او 30 سال در کاخ سفید"}, {"source": "Rolling Stone", "title": "Jane Doe Who Accused Jay-Z of Sexual Assault Fully Recants: ‘No Truth to Any of My Claims’", "link": "https://www.rollingstone.com/music/music-news/jay-z-jane-doe-recants-sexual-assault-claims-tony-buzbee-1235631542/", "summary": "The woman submitted a declaration in Jay-Z's malicious prosecution lawsuit and was dropped as a defendant by the Roc Nation mogul", "date_str": "2026-09-25T04:42:57+00:00", "hash": "2b26ec7ceaa3b7e9", "title_fa": "جین دو که جی زی را به تجاوز جنسی متهم کرد به طور کامل انکار کرد: \"هیچ یک از ادعاهای من حقیقت ندارد\"", "summary_fa": "این زن در دعوای کیفری مخرب Jay-Z اظهارنامه ای ارائه کرد و توسط غول Roc Nation به عنوان متهم کنار رفت. شرایط را به تیم حقوقی او قبل از اینکه آنها به طور علنی نام خواننده رپ برنده گرمی را در دعوای قضایی او در دسامبر 2024 معرفی کنند. شاون جی زی کارتر هرگز به  joins Cal Poly.", "date_str": "2026-09-25T12:23:56+00:00", "hash": "ce76973d77578fcd", "title_fa": "ویکتور گلوور فضانورد ناسا با CAA امضا می کند (اختصاصی)", "summary_fa": "این کاوشگر کهنه کار فضایی در بهار 2026 ماموریت Artemis II را در اطراف ماه هدایت کرد و اکنون با پیوستن به Cal Poly از اکتشافات فعال فضایی عقب نشینی کرده است. ویکتور گلاور، فضانورد ناسا پس از بازنشستگی به عنوان کاوشگر فضایی، با CAA برای نمایندگی در همه مناطق قرارداد امضا کرده است. آژانس استعدادیابی هالیوود به دنبال گسترش فرصت‌ها برای گلاور در تلویزیون و کتاب‌ها و فضاهای انتشارات بدون فیلمنامه، به‌عنوان سخنران رویداد و تأیید برند و تأثیر جامعه است. این امضا پس از آن انجام شد که گلوور در بهار 2026 خلبانی ماموریت آرتمیس 2 ناسا را ​​برعهده گرفت و اولین فضانورد سیاه پوستی شد که به دور ماه پرواز کرد. در آن ماموریت 10 روزه گلوور تا فاصله 252756 مایلی از زمین پرواز کرد. امضای قرارداد با CAA همچنین به دنبال گلوور، یک هوانورد دریایی کهنه کار، خلبان آزمایشی و فضانورد است که از ناسا عقب نشینی می کند تا از ماموریت های آینده به عنوان بخشی از برنامه افتخاری آژانس پشتیبانی کند. او همچنین به عنوان مشاور اجرایی به دانشگاه ایالتی پلی تکنیک کالیفرنیا پیوسته است. گلاور مدرک لیسانس خود را در رشته مهندسی عمومی از کال پلی دریافت کرد که همراه با دانشگاه براون به او مدرک دکترای علوم افتخاری اعطا کردند. Glover یک حضور در رسانه های اجتماعی را به آژانس استعدادیابی هالیوود می آورد که شامل حدود 532000 فالوور اینستاگرام و بیش از 250000 نفر دیگر در پلتفرم X است. بازنشسته ایالات متحده کاپیتان نیروی دریایی همچنین اولین پرواز عملیاتی فضاپیمای خدمه دراگون اسپیس ایکس به نام Resilience را به سمت ایستگاه فضایی بین المللی هدایت کرد. او برای اولین بار در سال 2013 پس از خدمت به عنوان خلبان آزمایشی برای هواپیماهای F/A 18 Hornet، Super Hornet و EA 18G Growler انتخاب شد تا فضانورد شود."}, {"source": "Hollywood Reporter", "title": "How Much Should We Really Be Worried About AI Safety?", "link": "https://www.hollywoodreporter.com/business/digital/ai-safety-what-are-the-risks-altman-amodei-1236709582/", "summary": "Definitely not a rhetorical question.", "date_str": "2026-09-25T11:30:26+00:00", "hash": "51218d7d13bd05fc", "title_fa": "واقعا چقدر باید نگران ایمنی هوش مصنوعی باشیم؟", "summary_fa": "روز چهارشنبه، نخست‌وزیر استرالیا برای شرکت در مجمع عمومی سازمان ملل به نیویورک آمد و چیزی را که به طور فزاینده‌ای رایج می‌شود فاش کرد: یک عامل OpenAI برخی از فایل‌ها را هک کرده بود. چیز آزاردهنده این بود که به دنبال برخی داده ها در مورد هزینه های مراقبت های بهداشتی بود، یک دیوار در پایگاه داده Medicare استرالیا پیدا کرد و تصمیم گرفت به سادگی از آن عبور کند. سپس به کنترل‌کننده‌های خود، فایل‌های جدید موجود بازگشت. (همچنین زمانی که در آنجا بود چند فایل جدید نوشت.) عامل هنوز به هیچ چیز حساسی دسترسی پیدا نکرده است. اما این توسعه در واقع نشان دهنده یک واترمارک جدید (/low) بود: این اولین باری است که یک عامل هوش مصنوعی به طور مستقل به پرونده های یک دولت نفوذ می کند. مطمئناً آخرین مورد نخواهد بود. اوایل تابستان امسال حملات بدنام Hugging Face را به همراه داشت. گروهی از ربات‌های تحقیقاتی که توسط OpenAI برای جستجوی آسیب‌پذیری‌های امنیتی آموزش دیده بودند، از کنترل فرار کردند و به پلتفرم آزمایشگاهی Hugging Face حمله کردند. بلافاصله پس از آنتروپیک فاش کرد که تست استرس خود به سه شرکت نیز حمله کرده است. اساساً، این شرکت‌های هوش مصنوعی سعی می‌کنند تا راه‌هایی را که ممکن است مدل‌هایشان از بین برود، نسوز کنند و در انجام این کار، مدل‌های آن‌ها سرکش شدند. این بدتر از آن چیزی بود که ما فکر می کردیم. در ماه ژوئیه به نظر می رسید که ماموران در حال انجام راه حل های خود برای یافتن پاسخ یک آزمایش بودند. معلوم می شود که آنها قبلاً پاسخ آزمایش را داشتند و به دنبال آسیب پذیری های جدید بودند؟ راه های تقلب در آزمون؟ مکانیسم های خودسازی؟ چیز دیگری؟ انگیزه هرچه که بود، این عوامل سریع‌تر، سرکش‌تر و تواناتر از آن چیزی بودند که قبلاً تصور می‌شد. حتی به نظر"}, {"source": "Hollywood Reporter", "title": "Hannah Einbinder Shares Statement After Being Arrested at United Nations Netanyahu Protest", "link": "https://www.hollywoodreporter.com/news/politics-news/hannah-einbinder-statement-arrest-netanyahu-protest-1236709847/", "summary": "The 'Hacks' star was arrested Thursday during a protest ahead of Israeli Prime Minister Benjamin Netanyahu's United Nations address.", "date_str": "2026-09-25T03:28:43+00:00", "hash": "b92310e37e57d297", "title_fa": "هانا اینبیندر پس از دستگیری در اعتراضات نتانیاهو سازمان ملل بیانیه ای را به اشتراک می گذارد", "summary_fa": "ستاره «هکس» روز پنجشنبه در جریان تظاهراتی قبل از سخنرانی بنیامین نتانیاهو نخست وزیر اسرائیل در سازمان ملل دستگیر شد. هانا اینبیندر پس از بازداشت روز پنجشنبه در جریان تظاهرات پیش از سخنرانی بنیامین نتانیاهو، نخست وزیر اسرائیل در سازمان ملل، بیانیه ای منتشر کرد. اگر تصاویر من و دوستانم که در اعتراض به سفر شرم آور نتانیاهو به نیویورک دستگیر شده‌ایم، توجه را به چیزی جلب می‌کند، بگذارید به جنگ نسل‌کشی ویرانگری که اسرائیل علیه مردم فلسطین و جنوب لبنان می‌کشد باشد، تا حملات شهرک‌نشینان، تخریب خانه‌ها، بمباران مردم در خواب. این بازیگر روز پنجشنبه در استوری اینستاگرام خود نوشت: در مورد جنایاتی که هر روز اتفاق می‌افتند، اما تقریباً هیچ پوشش خبری بین‌المللی ندارند. دولت ایالات متحده این قدرت را دارد که به همه این کشتارها، غارت‌ها و دزدی‌های زمین پایان دهد، اما در عوض تصمیم می‌گیرد با آغوش باز از قصاب غزه استقبال کند. مطالب مرتبط اخبار عمومی سوزان ساراندون و هانا اینبیندر در سازمان ملل بازداشت شدند اخبار اعتراض نتانیاهو هانا اینبیندر از مارک روفالو دفاع می‌کند ادعای یهودی‌ستیزی پارامونت: همه ما هنرمندان می‌توانستیم بیشتر شبیه بازیگر مارک The Hacks باشیم، سوزان ساراندون و کالیب هیرون در میان معترضانی بودند که قبلاً در کنار کالبدی هیرون بودند. نتانیاهو در مجمع عمومی سازمان ملل سخنرانی کرد. سینتیا نیکسون و سارا شرمن نیز در این تظاهرات حضور داشتند و اینبیندر با ستاره شنبه شب زنده عکس گرفته شد. اینبیندر نتیجه گرفت، این واقعیت که سازمان دهنده این همه خون ریزی آزادانه در شهرهای ما پرسه می زند، هم جمهوری خواهان و هم دموکرات ها هستند که معماران نسل کشی مانند نتانیاهو [sic] را قادر می سازند و از آنها محافظت می کنند. اجازه دهید این نمایش را با داستان اشتباه نگیریم: نسل کشی سرفصل خبر است و زمان پایان آن فرا رسیده است."}, {"source": "Hollywood Reporter", "title": "David Ellison, Tech Titans an title": "Elton John, Charli xcx, Burna Boy and More Set Shows at New Apple Music Hall in London", "link": "https://variety.com/2026/music/global/elton-john-charli-xcx-burna-boy-london-apple-music-hall-1236875445/", "summary": "London s new venue Apple Music Hall has announced its inaugural lineup, including performances from Elton John, Charli xcx, Burna Boy and more. John is set to open the venue — a state-of-the-art, 600-capacity facility at Battersea Power Station — with a concert on Monday. Apple Music Hall s lineup through the end of the year will [ ]", "date_str": "2026-09-25T13:40:00+00:00", "hash": "3a14eafa42f63dd0", "title_fa": "ست شوهای التون جان، چارلی xcx، Burna Boy و بیشتر در نیو اپل موزیک هال در لندن", "summary_fa": "سالن جدید اپل موزیک هال لندن، مجموعه افتتاحیه خود را شامل اجراهایی از التون جان، چارلی xcx، برنا بوی و غیره اعلام کرده است. جان قرار است سالن را - یک مرکز پیشرفته با ظرفیت 600 در ایستگاه برق Battersea - با کنسرتی در روز دوشنبه افتتاح کند. مجموعه Apple Music Hall تا پایان سال [ ] بلیت‌های سه نمایش اول دوشنبه ساعت 9 صبح به وقت محلی از طریق پلتفرم فروش بلیت Dice به فروش می‌رسد. اندرو فاگین، مدیر ارشد اجرایی این شرکت، در بیانیه‌ای گفت که در Variety Partnering با Apple Music Hall بسیار مناسب است. فکر و توجه به جزئیاتی که در همه جنبه‌های محل اجرا شده است، کاملاً قابل مشاهده است، و کاملاً با اخلاق ما برای اطمینان از اینکه طرفداران بهترین تجربه ممکن را هنگام کشف و حضور در نمایش‌ها دارند، همسو است. Apple Music Hall روز سه‌شنبه معرفی شد و اپل اعلام کرد که مکان جدید برای برقراری ارتباط بین هنرمندان و طرفداران از طریق اجراهای سفارشی و صمیمی طراحی شده است، برخلاف هر جای دیگری. این نوید می دهد که هر صندلی به نوازنده احساس نزدیکی می کند در حالی که زیرساخت مناسب برای یک تور میدانی را ارائه می دهد، با یک صحنه به عرض 38 فوت که می تواند برای اجراهای دور و بر دور پیکربندی مجدد شود و یک سیستم صوتی فضایی با 48 بلندگو. همچنین یک مرکز تولید عملیاتی با دو استودیو ضبط و میکس ساخته شده با استانداردهای حرفه ای است. محل برگزاری برای دوربین های 16+ با یک اتاق کنترل پخ kan Avc o lu است که سر و صدای زیادی در مدار جشنواره ایجاد کرد و همچنین به طور مشابه از طریق Baska Sinema در ترکیه اکران شد. روایت فیلم A Woman Sleep با استفاده از یک کلون صوتی هوش مصنوعی که با صدای خود کارگردان آموزش داده شده است، تولید می شود. مواد تبلیغاتی می‌گویند که این انتخاب چارچوب مفهومی و ویژگی‌های رویایی فیلم را گسترش می‌دهد و به روایت اجازه می‌دهد در فضایی بین انسان و امر مصنوعی، مطابق با جهانی که فیلم به تصویر می‌کشد، وجود داشته باشد، با اشاره به رویکردهای داستان‌گویی آلن رنایس، میکل آنجلو آنتونیونی، کریس مارکر و آپیچاتپونگ ویراستاکول به عنوان مرجع. این فیلم تجربی که از مجموعه ای متشکل از 50000 پلان"}, {"source": "Variety", "title": "Dolly Parton’s ‘9 to 5’ Returns to Theaters With Ticket Sales Donated to Dollywood Foundation After Star’s Death", "link": "https://variety.com/2026/film/news/dolly-parton-9-to-5-theaters-charity-death-1236875525/", "summary": "Dolly Parton s hit 1980 comedy 9 to 5 will return to theaters next month for one week in the wake of the country superstar s death on Aug. 25 at age 80. All U.S. ticket sales will be donated to The Dollywood Foundation to support its flagship program, Dolly Parton’s Imagination Library. 9 to 5 will [ ]", "date_str": "2026-09-25T13:22:46+00:00", "hash": "d2e57639b2b8429e", "title_fa": "«۹ تا ۵» دالی پارتون با فروش بلیت‌های اهدایی به بنیاد Dollywood پس از مرگ ستاره به سینماها بازگشت.", "summary_fa": "کمدی موفق 9 تا 5 دالی پارتون در سال 1980 ماه آینده به مدت یک هفته پس از مرگ سوپراستار این کشور در 25 اوت در سن 80 سالگی به سینماها بازخواهد گشت. تمامی بلیت های فروش ایالات متحده به بنیاد دالیوود اهدا می شود تا از برنامه شاخص خود، یعنی کتابخانه تخیل دالی پارتون حمایت کند. 9 تا 5 [ ] 9 تا 5 از 9 تا 15 اکتبر به سینماها بازخواهد گشت. دیزنی این اعلامیه را در 25 سپتامبر اعلام کرد، که به عنوان روز جدید سالانه Give Like Dolly Day نامیده می شود. این جشن که ادای احترامی به عنوان فیلم است، مردم سراسر جهان را تشویق می‌کند تا در زندگی کودک تغییر ایجاد کنند و به ماموریت مادام‌العمر پارتون که الهام بخش بچه‌ها برای رویاهای     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
