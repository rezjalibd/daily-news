      media: [{"source": "Billboard", "title": "Latin Grammys 2026 Recap: Rosalía & Karol G Win, Daddy Yankee Is Honored & More | Billboard News", "link": "https://www.billboard.com/video/latin-grammys-2026-recap-rosalia-karol-g-wins-daddy-yankee/", "summary": "This is partner content. From Rosalía’s wins for album of the year ( Lux ) and song of the year (“La Perla”) to Karol G’s best urban music album victory for Tropicoqueta , we’re looking back at the the 2026 Latin Grammy’s biggest wins, emotional speeches and standout performances. Watch Daddy Yankee’s person of the year tribute, Juanes and Carín León’s duet, and the moving José Alfredo Jiménez tribute featuring The Warning and Camila Fernández. Narrator: Legendary moments, unexpected surprises and amazing performances. We re in Las Vegas, and Billboard , together with Lexus, celebrate the magic of the Latin Grammys with a recap of everything you missed, presented by Lexus. Karol G wins best urban music album for Tropicoqueta . Rosalía swept the top prize for song of the year for her catchy “La Perla” and crowned the night by conquering the coveted trophy for album of the year for Lux . Milo J took home the award for record of the year for “Niño.” Xavi wins his first Latin Grammy and dedicates it to Mexico. Also, newcomer Aria Vega won the coveted award for best new artist. But let s not forget these moments. Rosalía premiered the performance among the clouds of Lux alongside a dance cast of celestial aesthetics. And Daddy Yankee, named person of the year, got everyone on their feet singing along with a medley of his greatest hits that featured the participation of a star-studded cast: J Wheeler, French Montana, Feid, Punjabi artist Diljit Dosanjh and even LL Cool J. Could this be a preview of what Daddy Yankee has in store? Keep watching for more!", "date_str": "2026-11-13T19:50:30+00:00", "hash": "af65be773528b115", "title_fa": "خلاصه گرمی لاتین 2026: روزالیا و کارول جی برنده شدند، بابا یانکی تجلیل شد و بیشتر | اخبار بیلبورد", "summary_fa": "این محتوای شریک است. از برنده‌های روزالیا برای آلبوم سال (لوکس) و آهنگ سال (\"La Perla\") تا پیروزی بهترین آلبوم موسیقی شهری کارول جی برای Tropicoqueta، ما به بزرگترین برنده‌ها، سخنرانی‌های احساسی و اجراهای برجسته گرمی لاتین 2026 نگاه می‌کنیم. ادای احترام شخصیت سال بابا یانکی، دونوازی خوانس و کارین لئون، و ادای احترام خوزه آلفردو جیمنز با حضور The Warning و Camila Fernández را تماشا کنید. راوی: لحظات افسانه ای، شگفتی های غیرمنتظره و اجرای شگفت انگیز. ما در لاس وگاس هستیم و بیلبورد، همراه با Lexus، جادوی گرمی لاتین را با خلاصه‌ای از همه چیزهایی که از دست داده‌اید، که توسط Lexus ارائه شده است، جشن می‌گیریم. کارول جی برنده بهترین آلبوم موسیقی شهری برای Tropicoqueta شد. روزالیا برای آهنگ جذاب خود \"La Perla\" جایزه برتر سال را به خود اختصاص داد و با فتح جایزه محبوب آلبوم سال برای لوکس، تاج شب را به دست آورد. میلو جی جایزه رکورد سال را برای «نینو» به خانه برد. ژاوی اولین گرمی لاتین خود را برد و آن را به مکزیک تقدیم کرد. همچنین، آریا وگا، تازه وارد، برنده جایزه بهترین هنرمند جدید شد. اما این لحظات را فراموش نکنیم. روزالیا این اجرا را در میان ابرهای لوکس در کنار گروه رقصی از زیبایی‌شناسی آسمانی اجرا کرد. و بابا یانکی، که به عنوان شخصیت سال انتخاب شد، همه را به آواز خواندن همراه با ترکیبی از بهترین آهنگ‌های خود که شامل حضور بازیگران پر ستاره‌ای بود، برانگیخت: جی ویلر، فرنچ مونتانا، فید، هنرمند پنجابی دیلجیت دوسانج و حتی ال‌ال کول جی. به تماشای بیشتر ادامه دهید! خلاصه گرمی لاتین 2026: روزالیا کارول جی برد، بابا یانکی بیشتر تجلیل شد | اخبار بیلبورد اشتراک‌گذاری در فیس‌بوک اشتراک‌گذاری در X + گزینه‌های اشتراک‌گذاری اضافی اضافه شد اشتراک‌گذاری در Pinterest اشتراک‌گذاری در Tumblr اشتراک‌گذاری در Reddit اشتراک‌گذاری در LinkedIn اشتراک‌گذاری در Whats", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/LG26.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۳:۲۰"}, {"source": "Billboard", "title": "Gene Autry’s Guitar in Global Dispute", "link": "https://www.billboard.com/music/country/gene-autry-guitar-global-dispute-1236381848/", "summary": "As programmers prepare Christmas playlists, the Gene Autry recordings “Rudolph, the Red-Nosed Reindeer” and “Here Comes Santa Claus (Down Santa Claus Lane)” are currently top of mind. But a 1931 Autry recording – “That Silver-Haired Daddy of Mine,” which charted on Billboard ’s all-genre hit parade in 1935 – is suddenly timely, as well, in a real-life detective story that’s erupted into a trans-Atlantic legal tiff. A rare Martin OM-45 guitar, one of only 50 produced in the early-1930s, was found in a Swedish farmhouse among the inheritance a father left to his daughter when he died in February 2021. The guitar, it turns out, was likely owned by Autry and stolen from him in 1932. The exact journey the instrument took cannot be fully traced, but steps were taken somewhere in the past 90 years to conceal its identity. The process of uncovering the guitar’s authenticity and tracing its original ownership back to Autry, a Country Music Hall of Fame member who was an iconic singing cowboy during much of the 20th century, reads like a C.S.I. forensics drama, laid out in a four-part series by Swedish newspaper Göteborgs-Posten . Autry’s widow, Jackie Autry, is now embroiled in a tug of war over the instrument, which she believes should be returned to the Autry Museum of the American West, a Los Angeles institution that documents cowboy and Native American history. “I don’t have any of Gene’s guitars anymore,” Jackie told Göteborgs-Posten . “They’re all at the museum now because that’s where it belongs. It belongs to the public, not to me, not to her.” “Her” would be the daughter of Owe Jakobsson, a Swedish woman named Sandra who was left in charge of her daddy’s estate after his death. Owe had inherited the instrument from his father, Gunnar, who was an inventive repairman. The original guitar had amateur-grade modifications made to the neck and bridge, and Sandra received a $7,000 offer for the Martin when she was selling off pieces of the estate. Another potential buyer tipped her off that it was likely worth far more, and they discovered that even a modern replica is worth about $12,000. This guitar, which had all the earmarks of being an original, could be worth six figures. Sandra took the instrument to a Stockholm guitar shop for restoration, and there, Leif Lundbäck discovered a name, Gene Autry, that had been covered with black paint. He also found a serial number when he detached the neck. The Martin company, they would discover, has documentation from se", "date_str": "2026-11-13T19:41:01+00:00", "hash": "896807ea4ab2435c", "title_fa": "گیتار ژن اوتری در منازعه جهانی", "summary_fa": "همانطور که برنامه نویسان لیست های پخش کریسمس را آماده می کنند، آهنگ های ضبط شده Gene Autry \"Rudolph, the Red-Nosed Reindeer\" و \"Here Comes Santa Claus (Down Santa Claus Lane)\" در حال حاضر مورد توجه قرار گرفته اند. اما یک ضبط اوتری در سال 1931 - «آن بابای مو نقره‌ای من» که در رژه همه ژانرهای بیلبورد در سال 1935 به نمایش درآمد - ناگهان در یک داستان کارآگاهی واقعی که به یک جریان قانونی فرا آتلانتیک تبدیل شده است، به موقع است. یک گیتار کمیاب مارتین OM-45، یکی از تنها 50 گیتار تولید شده در اوایل دهه 1930، در یک خانه مزرعه سوئدی در میان ارثی که پدر برای دخترش در فوریه 2021 درگذشت، پیدا شد. معلوم شد که گیتار احتمالاً متعلق به اوتری بوده و در سال 1932 از او دزدیده شده است. 90 سال برای پنهان کردن هویت خود. روند کشف اصالت گیتار و ردیابی مالکیت اصلی آن به Autry، یکی از اعضای تالار مشاهیر موسیقی کانتری که در بیشتر قرن بیستم یک گاوچران آوازخوان نمادین بود، شبیه یک C.S.I است. درام پزشکی قانونی، در یک مجموعه چهار قسمتی توسط روزنامه سوئدی Göteborgs-Posten. بیوه اوتری، جکی اوتری، اکنون درگیر جنگی بر سر ساز است که به عقیده او باید به موزه اوتری غرب آمریکا، یک موسسه لس آنجلس که تاریخ گاوچران و بومیان آمریکا را مستند می کند، بازگردانده شود. جکی به Göteborgs-Posten گفت: «من دیگر هیچ یک از گیتارهای Gene را ندارم. همه آنها اکنون در موزه هستند زیرا به این موزه تعلق دارد. متعلق به مردم است، نه به من و نه او.» \"او\" دختر اوه یاکوبسون، زنی سوئدی به نام ساندرا خواهد بود که پس از مرگ پدرش، سرپرستی املاک پدرش را بر عهده داشت. اُو این ساز را از پدرش گونار که یک تعمیرکار مبتکر بود به ارث برده بود. گیتار اصلی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Guitar-CR-Olof-Ohlsson-Goteborgs-Posten.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۳:۱۱"}, {"source": "Billboard", "title": "EJAE, Megan Moroney, Queen Latifah & More to Perform at 100th Macy’s Thanksgiving Parade: See the Lineup", "link": "https://www.billboard.com/culture/tv-film/macys-thanksgiving-day-parade-2026-performers-lineup-1236381868/", "summary": "Music fans have a lot to be thankful for ahead of this year’s Macy Thanksgiving Day Parade, which announced on Friday (Nov. 13) its 2026 lineup of performers featuring big names in pop, K-pop, country and more. Billboard Hot 100 -charting stars Megan Mooney and Teddy Swims will both deliver musical performances backdropped by the company’s iconic flagship location on 34th Street in New York City. Other artists who will sing, dance and bring festive cheer to the parade route while catching rides on the various floats in the mix are EJAE of Kpop Demon Hunters girl group HUNTR/X, real-life K-pop boy band RIIZE, Queen Latifah, Jimmy Fallon and The Roots, JoJo, Keke Palmer, Smash Mouth, Mckenna Grace and DEVO. Additionally, the Indigo Girls, Natasha Bedingfield, Blues Traveler, Feid, Icona Pop, II Volo, Wyclef Jean, Natalie Merchant, Jamie Miller, Ryan Peter Murphy, Leslie Odom Jr., Anthony Ramos, Melissa Joan Hart, Jack McBrayer, Janet McTeer, Holly Robinson Peete and Rodney Peete will make appearances on the annual NBC program, along with Megan Hilty, who will lead a tribute to Dolly Parton following the country icon’s death at the age of 80 this year. What makes the 2026 show especially exciting is that this year will mark the 100th Macy’s Thanksgiving Parade. “We’re creating a celebration of unprecedented scale and will deliver an unforgettable Thanksgiving for millions across the country,” stated chief marketing officer Sharon Otterman of the milestone. “Macy’s Thanksgiving Day Parade brings the extraordinary together: iconic entertainers and emerging talent, artistry and imagination, hometown pride, cherished traditions and the thrill of discovering something new,” she added. TODAY hosts Savannah Guthrie, Hoda Kotb and Al Roker will once again helm the program, with further performers and Broadway stars to be announced as the big day draws nearer. And of course, one guy who’s never missed a parade — Santa Claus — will close out the event, as is tradition. The 2026 Macy’s Thanksgiving Day Parade kicks off at 8:30 a.m. ET on NBC, Peacock and Telemundo. Last year, it featured performers such as Cynthia Erivo, Lainey Wilson, Ciara, Conan Gray, Busta Rhymes, Foreigner and Debbie Gibson.", "date_str": "2026-11-13T19:20:59+00:00", "hash": "744306a5ec526ae2", "title_fa": "EJAE، مگان مورونی، ملکه لطیفه و سایرین در صدمین رژه شکرگزاری میسی اجرا می کنند: ترکیب را ببینید", "summary_fa": "طرفداران موسیقی باید قبل از رژه روز شکرگزاری میسی امسال، که در روز جمعه (13 نوامبر) فهرست نوازندگان سال 2026 خود را با نام های بزرگ پاپ، کی پاپ، کانتری و غیره معرفی کرد، سپاسگزار باشند. مگان مونی و تدی سوئیمز، ستاره‌های بیلبورد Hot 100، هر دو اجراهای موزیکال را با پس‌زمینه لوکیشن شاخص این شرکت در خیابان 34 شهر نیویورک ارائه خواهند کرد. دیگر هنرمندانی که آواز می خوانند، می رقصند و شادی جشن را به مسیر رژه می رسانند در حالی که سوار بر شناورهای مختلف این ترکیب می شوند، EJAE از گروه دخترانه Kpop Demon Hunters، HUNTR/X، گروه پسران کی پاپ واقعی RIIZE، کوئین لطیفه، جیمی فالون و The Roots، JoJo, S. DEVO. علاوه بر این، دختران نیلی، ناتاشا بدینگفیلد، مسافر بلوز، فید، آیکونا پاپ، II ولو، وایکلف جین، ناتالی مرچنت، جیمی میلر، رایان پیتر مورفی، لزلی اودوم جونیور، آنتونی راموس، ملیسا جوآن هارت، جک مک برایر، جانت رابینت و هولیت رابینزون در پی‌نِیِس حضور خواهند داشت. برنامه سالانه NBC، همراه با مگان هیلتی، که امسال پس از مرگ نماد کشور در سن 80 سالگی، ادای احترام به دالی پارتون را رهبری خواهد کرد. چیزی که نمایش 2026 را به ویژه هیجان انگیز می کند این است که امسال صدمین رژه شکرگزاری میسی برگزار می شود. شارون اوترمن، افسر ارشد بازاریابی، از نقطه عطف گفت: «ما جشنی در مقیاس بی‌سابقه ایجاد می‌کنیم و روز شکرگزاری فراموش‌نشدنی را برای میلیون‌ها نفر در سراسر کشور به ارمغان می‌آوریم. او افزود: \"رژه روز شکرگزاری میسی چیزهای خارق العاده را گرد هم می آورد: سرگرمی های نمادین و استعدادهای نوظهور، هنر و تخیل، غرور زادگاه، سنت های گرامی و هیجان کشف چیز جدید.\" ساوانا گاتری، هدی کاتب و آل راکر میزبان امروز، بار دیگر هدایت این برنامه را برعهده خواهند داشت و با نزدیک‌تر شدن روز بزرگ، بازیگران دیگر و ستاره‌های", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2248725140-e1794595650183.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۲:۵۰"}, {"source": "Billboard", "title": "20 Years Without Valentín Elizalde: Makers of New Docuseries Discuss the Late Musical Icon & His Still-Unsolved Murder", "link": "https://www.billboard.com/music/latin/valentin-elizalde-docuseries-killing-of-the-golden-rooster-1236381872/", "summary": "The 72 hours leading up to the murder of regional Mexican music icon Valentín Elizalde , which occurred in the early hours of Nov. 25, 2006, in the border city of Reynosa, Mexico, are the central focus of the new HBO Max docuseries The Killing of The Golden Rooster ( Valentín: La muerte del Gallo de Oro ). The series, which premiered globally on Thursday (Nov. 12), explores Elizalde s life and legacy through firsthand accounts and archival material. It delves into his origins, musical career and final hours, as well as the theories and lingering questions surrounding a case that shook a nation 20 years ago while his musical legacy continues to resonate across generations. The murder of Valentín Elizalde has remained unresolved for 20 years, says Esteban Vidal, executive producer of HBO Max, in an interview with Billboard Español . Two decades after his death, we felt it was an important moment to revisit his story, his profile, and to address an issue that persists in the country: violence and impunity. Directed by Ida Cuellar, The Killing of The Golden Rooster reconstructs the singer s final hours across three episodes, and examines the various theories surrounding his murder: a forbidden love, possible ties to organized crime and a betrayal from within his inner circle. The docuseries features voices such as Fausto Tano Castro Elizalde, Valentín s cousin and the sole survivor of the attack; Gabriela Sabag, the singer s ex-wife; Gabriela Elizalde, his daughter; Alejandro Lira, a songwriter and friend of Valentín; Héctor López, his manager; and contemporary regional Mexican star Carín León. “This is not a judicial investigation; it’s a documentary,” clarifies Alejandro Sugich, executive producer of Sula Entertainment. That s why we aimed to include all perspectives. Sugich also mentions that he maintained communication with the singer’s family and hopes that, after the docuseries release, his relatives will see it as a “tribute” to the life and work of the Gallo de Oro, while maintaining impartiality. I spoke with his mother, his son-in-law, and everyone else, Sugich says. I think they may have initially thought the documentary was being told from the perspective of someone they don’t have a relationship with. But here, the protagonist is Valentín Elizalde and the impunity in Mexico — that’s what the docuseries is about. Valentina Elizalde, the late singer’s daughter, issued a statement on Wednesday (Nov. 11) on her Instagram account on behalf of her famil", "date_str": "2026-11-13T19:17:17+00:00", "hash": "3a90ec9a235a8d11", "title_fa": "20 سال بدون والنتین الیزالد: سازندگان مستندهای جدید درباره نماد موسیقی متاخر و قتل هنوز حل نشده او بحث می کنند", "summary_fa": "72 ساعت منتهی به قتل نماد موسیقی منطقه ای مکزیکی والنتین الیزالد، که در ساعات اولیه 25 نوامبر 2006، در شهر مرزی رینوسا، مکزیک رخ داد، محور اصلی مستند جدید HBO Max The Killing of The Golden Rooster (Valentín: La Muerte) است. این سریال که در روز پنجشنبه (12 نوامبر) در سطح جهانی پخش شد، زندگی و میراث الیزالد را از طریق گزارش های دست اول و مطالب بایگانی بررسی می کند. این کتاب به ریشه‌ها، حرفه موسیقی و ساعات پایانی او و همچنین تئوری‌ها و پرسش‌های طولانی پیرامون پرونده‌ای می‌پردازد که 20 سال پیش ملتی را تکان داد در حالی که میراث موسیقی او همچنان در نسل‌ها طنین‌انداز می‌شود. استبان ویدال، تهیه‌کننده اجرایی HBO Max، در مصاحبه‌ای با Billboard Español می‌گوید قتل والنتین الیزالد ۲۰ سال است که حل‌نشده باقی مانده است. دو دهه پس از مرگ او، ما احساس کردیم که لحظه مهمی است برای بازبینی داستان، مشخصات او و پرداختن به موضوعی که در کشور وجود دارد: خشونت و مصونیت از مجازات. The Killing of The Golden Rooster به کارگردانی آیدا کوئلار، ساعات پایانی خواننده را در سه قسمت بازسازی می‌کند و نظریه‌های مختلف پیرامون قتل او را بررسی می‌کند: عشق ممنوع، پیوندهای احتمالی با جنایات سازمان‌یافته و خیانت از درون دایره درونی‌اش. این سریال مستند صداهایی مانند فائوستو تانو کاسترو الیزالد، پسر عموی والنتین و تنها بازمانده حمله را به نمایش می‌گذارد. گابریلا ساباگ، همسر سابق این خواننده؛ گابریلا الیزالد، دخترش؛ الخاندرو لیرا، ترانه سرا و دوست والنتین. هکتور لوپز، مدیر او؛ و ستاره مکزیکی معاصر، کارین لئون. آلخاندرو سوگیچ، تهیه‌کننده اجرایی Sula Entertainment، توضیح می‌دهد: «این یک تحقیق قضایی نیست، یک مستند است. به همین دلیل هدف ما این بود که همه دیدگاه ها را در بر بگیرد. سوگیچ همچنین اشاره می کند که ارتباط خود را با خانواده خواننده حفظ کرده و امیدوار است", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Valentin-Elizalde-Docuseries-Art-cr-HBO-Max-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۲:۴۷"}, {"source": "Billboard", "title": "Hilary Duff & More Take the Stage at Billboard Live Music Summit 2026 | Billboard News", "link": "https://www.billboard.com/video/hilary-duff-weezer-billboard-live-music-summit-2026-recap/", "summary": "This is p amba Schutte to Series Regular for Season 2", "link": "https://variety.com/2026/tv/news/pluribus-season-2-samba-schutte-series-regular-1236947123/", "summary": "Samba Schutte has been upped to series regular status for Pluribus Season 2, Variety has learned. Schutte is known for playing Mr. Diabaté in Season 1 as a guest star. Like Rhea Seehorn s Carol, the character is immune to the outbreak and lives a hedonistic lifestyle. Schutte is also known for starring in the HBO [ ]", "date_str": "2026-11-13T18:00:00+00:00", "hash": "92aee9e96dc461b5", "title_fa": "«Pluribus» سامبا شوته را به سریال معمولی برای فصل 2 تبلیغ می‌کند", "summary_fa": "ورایتی دریافت که سامبا شوته برای فصل دوم Pluribus به وضعیت عادی سریال ارتقا یافته است. شوته برای بازی در نقش آقای دیاباته در فصل 1 به عنوان ستاره مهمان شناخته شده است. مانند کارول ریا سیهورن، این شخصیت از شیوع بیماری مصون است و سبک زندگی لذت‌گرایانه دارد. شوته همچنین برای بازی در HBO شناخته شده است [ ] او توسط هنرمندان مبتکر و هنرمندان تثبیت شده بازنگری می شود. در کنار سیهورن و شوته، کارولینا ویدرا و کارلوس مانوئل وسگا نیز در این فیلم حضور دارند. در حال حاضر فصل دوم Pluribus در حال تولید است. فصل اول در نوامبر 2025 در اپل تی‌وی پخش شد. این سریال پس از انتشار با استقبال خوبی از سوی منتقدان و مخاطبان مواجه شد. این یکی از نامزدترین سریال‌های جوایز امی امسال بود که در مجموع 18 نامزدی برای فصل اول خود کسب کرد. این فیلم شش جایزه امی را برای فصل اول دریافت کرد، از جمله برنده شدن سیهورن برای بازیگر نقش اول زن در یک سریال درام. وینس گیلیگان، خالق سریال، برنده جایزه امی برای نویسندگی برجسته برای یک سریال درام شد. برنده‌های اضافی برای ویرایش تصویر برجسته برای یک سریال درام، میکس صدای فوق‌العاده برای یک کمدی یا درام (یک ساعت)، موسیقی برجسته اصلی عنوان اصلی و طراحی تولید برجسته برای یک برنامه روایی معاصر (یک ساعت یا بیشتر) بود. «پلوریباس» توسط تلویزیون سونی پیکچرز برای اپل تی‌وی تولید می‌شود و گیلیگان، گوردون اسمیت، آلیسون تاتلاک، دایان مرسر، جف فراست، جن کارول و ترینا سیوپی تهیه‌کننده اجرایی آن هستند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Pluribus_Photo_010601.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی"], "datetime_fa": "۲۲ آبان • ۲۱:۳۰"}, {"source": "Billboard", "title": "Grammy Premiere Ceremony, Where Most Awards Are Presented, to Stream Live on Disney+ for the First Time", "link": "https://www.billboard.com/music/awards/grammy-premiere-ceremony-2027-stream-live-disney-plus-1236381697/", "summary": "The Recording Academy is upgrading the way it treats the 90 or so categories (out of 100 total) that are not presented on the live Grammy telecast. These categories are presented on what the academy calls the Premiere Ceremony, which has streamed live on the Grammys website in recent years. This year, for the first time, it will stream live exclusively on Disney+ Sunday, Feb. 7, at 2:30 p.m. ET / 11:30 a.m. PT. Related 2027 Grammy Nominations Final Predictions: Album of the Year 2027 Grammy Nominations Final Predictions: Record Song of the Year 2027 Grammy Nominations Final Predictions: Best New Artist The Premiere Ceremony will be produced by Fulwell Entertainment for the first time. Fulwell Entertainment, headed by Ben Winston , has produced the live Grammy Awards telecast every year since 2021. In the past, the ceremony was produced in-house by academy executives. “The Premiere Ceremony has always been one of the most celebratory moments of Grammy Sunday,” Harvey Mason Jr. , Grammys CEO, said in a statement. “With the ceremony streaming on Disney+ for the first time, even more fans will get to be part of that celebration. To bring it to life for a new audience, we couldn’t ask for a better partner than Fulwell, and I’m confident they’ll bring the same magic they bring to the telecast year after year.” Winston, who has personally won 13 Primetime Emmys since 2016, Eric Pankowski and Greg V. Fera will serve as executive producers of the Premiere Ceremony. Branden Chapman, Chantel Sausedo, Rex Supa and Ruby Marchand will serve as producers on behalf of the Recording Academy. The Recording Academy is elevating its treatment of the vast majority of Grammy categories that are not presented on the live telecast in another way. This year, for the first time, it is announcing the nominees in all 100 categories on a livestream. In the past, it announced the nominees in about 18 categories the six General Field categories and then a representative sampling of other categories. The remainder were simply listed in a press release. (The nominations announcement will stream on the Grammys website and its YouTube channel on Monday, Nov. 16, at 7:45 a.m. ET/4:45 a.m. PT.) The Premiere Ceremony will again be held at the Peacock Theater at L.A. Live. The Grammy telecast will be held at the nearby Crypto.com Arena. After airing on CBS every year from 1973 to 2026, it will debut live across ABC, Disney+ and Hulu at 7 p.m. ET/4 p.m. PT. (That’s an hour earlier than in the pa", "date_str": "2026-11-13T19:00:00+00:00", "hash": "657daafcd388e3fa", "title_fa": "مراسم اولین گرمی، جایی که بیشترین جوایز اهدا می شود، برای اولین بار به صورت زنده از دیزنی پلاس پخش می شود", "summary_fa": "آکادمی ضبط در حال ارتقای نحوه برخورد با 90 دسته بندی (از 100 کل) است که در پخش زنده گرمی ارائه نمی شوند. این دسته بندی ها در آنچه آکادمی آن را مراسم برتر می نامد ارائه می شود که در سال های اخیر به طور زنده در وب سایت گرمی پخش شده است. امسال، برای اولین بار، به طور انحصاری در دیزنی + یکشنبه، 7 فوریه، ساعت 14:30 به صورت زنده پخش می شود. ET / 11:30 صبح PT. پیش‌بینی‌های نهایی نامزدهای گرمی 2027: آلبوم سال 2027 نامزدهای گرمی پیش‌بینی‌های نهایی: ضبط آهنگ سال نامزدهای گرمی 2027 پیش‌بینی‌های نهایی: بهترین هنرمند جدید مراسم اولین بار توسط فولول اینترتینمنت تولید می‌شود. Fulwell Entertainment، به سرپرستی بن وینستون، از سال 2021 هر سال پخش زنده جوایز گرمی را تهیه کرده است. در گذشته، این مراسم توسط مدیران آکادمی در داخل سازمان تولید می شد. هاروی میسون جونیور، مدیرعامل گرمی در بیانیه‌ای گفت: \"مراسم اولین جشن گرمی همیشه یکی از جشن‌ترین لحظات یکشنبه گرمی بوده است.\" \"با پخش مراسم برای اولین بار در دیزنی +، طرفداران بیشتری می توانند بخشی از آن جشن باشند. برای زنده کردن آن برای مخاطبان جدید، ما نمی‌توانیم شریکی بهتر از فولول بخواهیم، ​​و من مطمئن هستم که آنها همان جادویی را که سال به سال برای پخش تلویزیونی به ارمغان می‌آورند، خواهند آورد.» وینستون که از سال 2016 شخصا برنده 13 جایزه امی اولیه شده است، اریک پانکوفسکی و گرگ وی فرا به عنوان تهیه کنندگان اجرایی مراسم اولین نمایش حضور خواهند داشت. براندن چپمن، شانتل ساسودو، رکس سوپا و روبی مارچند به‌عنوان تهیه‌کننده از طرف آکادمی ضبط فعالیت خواهند کرد. آکادمی ضبط در حال بهبود رفتار خود با اکثریت قریب به اتفاق دسته بندی های گرمی است که در پخش زنده تلویزیونی به روش دیگری ارائه نمی شوند. امسال برای اولین بار نامزدهای هر 100", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2197340345-e1794583314591.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۲:۳۰"}, {"source": "Billboard", "title": "The Pack Members, Too Short, Mistah F.A.B. & G-Eazy Pay Tribute to Young L After His Reported Death", "link": "https://www.billboard.com/music/rb-hip-hop/the-pack-young-l-death-too-short-musician-tributes-1236381715/", "summary": "The Pack s Young L (born Lloyd Omadhebo) has reportedly passed away at age 39, and musicians are remembering the artist. Related Stephen Curry to Produce Upcoming Documentary on Bay Area Rap Legend Mac Dre: Exclusive E-40 Too Short to Perform at 2026 NFL Honors Gone But Not Forgotten: Musicians We Lost in 2026 Too Short shared the news on Instagram Thursday (Nov. 12) with a heartbreaking tribute paying homage to the artist Rest in peace Nephew. You The Pack influenced so many artists it’s impossible to measure the impact that you had on the culture, the Bay Area legend wrote. If you know you know. R.I.P. Young Lloyd. I never heard a Young L beat that didn’t SLAP. A cause of death has not been shared. Short signed Young L and The Pack to his Jive Records imprint, Up All Nite, in the mid-2000s following the success of their breakout hit Vans and served as a mentor for the crew. Comments from plenty of hip-hop contemporaries poured into Too Short s comments section, with the likes of G-Eazy , Ty Dolla $ign, Chuck Inglish, LaRussell, Casey Veggies, Guapdad 4000 and more reacting to Young L s passing. Definition of a legend changed the game forever, G-Eazy penned. Young L formed The Pack alongside Lil B, StunnaMan and Lil Uno in 2005. The Berkley native mixed the West Coast s hyphy movement with elements of The Neptunes futuristic production to define the group s signature minimalistic sound. I LOVE YOU BIG BRO. I can’t stop crying. I done listen to yo dang voicemails 1000 times already. Imma miss them late night and early morning calls, Lil Uno wrote on IG . But like we always say we gotta complete the mission. Watch over me, I need you. I can t believe it, I don t wanna to believe it this shit hurt man, I don t know what to do, StunnaMan added in a tribute to Young L on his IG Story. Oakland rap dignitary Mistah F.A.B. also gave Young L his flowers on social media . YOUNG LEGEND, the master mind, the Architect, the creator it wouldn’t be no DOPE ERA CLOTHING IF I didn’t see him drawing up and cooking @pinkdolphinclothing ideas at moms house in EL CERRITO, he wrote. THE PACK THE TRENDSETTERS AND SITTING IN THE DRIVER SEAT WAS BABY BRO. After releasing a pair of mixtapes, The Pack earned its breakthrough hit with Vans, which arrived in 2006 and reached No. 58 on the Billboard Hot 100 for the group s only entry on the chart. The Pack released a pair of projects on Too Short s Up All Nite: Skateboards 2 Scrapers in 2006 and 2007 s Based Boys . After leaving the i", "date_str": "2026-11-13T18:55:28+00:00", "hash": "fcb3888f50d8a320", "title_fa": "The Pack Members, Too Short, Mistah F.A.B. و G-Eazy به جوان L پس از مرگ گزارش شده او ادای احترام می کنند", "summary_fa": "گروه Pack s Young L (متولد Lloyd Omadhebo) در سن 39 سالگی درگذشت و نوازندگان این هنرمند را به یاد می آورند. استفان کری مستندی را در مورد افسانه رپ Bay Area تولید می‌کند Mac Dre: E-40 انحصاری برای اجرا در NFL 2026 خیلی کوتاه است. برادرزاده افسانه Bay Area نوشت: You The Pack هنرمندان زیادی را تحت تأثیر قرار دادید که اندازه‌گیری تأثیری که بر فرهنگ داشتید غیرممکن است. اگه میدونی میدونی R.I.P. لوید جوان. من هرگز صدای Young L را نشنیدم که SLAP نخورد. علت مرگ به اشتراک گذاشته نشده است. Young L و The Pack در اواسط دهه 2000 پس از موفقیت موفقیت آمیز موفقیت آمیز Vans و به عنوان مربی برای خدمه، امضای کوتاهی از Young L و The Pack در چاپ رکوردهای Jive Records خود، Up All Nite، امضا کردند. نظرات بسیاری از هم‌عصران هیپ‌هاپ در بخش نظرات Too Short ریخته شد، با افرادی مانند G-Eazy، Ty Dolla $ign، Chuck Inglish، LaRussell، Casey Veggies، Guapdad 4000 و دیگران که به پاس یانگ L واکنش نشان دادند. G-Eazy نوشت، تعریف یک افسانه بازی را برای همیشه تغییر داد. Young L در سال 2005 گروه The Pack را در کنار Lil B، StunnaMan و Lil Uno تشکیل داد. بومی برکلی حرکت هیفی ساحل غربی را با عناصر تولید آینده نپتونز ترکیب کرد تا صدای مینیمالیستی مشخص گروه را تعریف کند. من تو را دوست دارم برادر بزرگ. نمی توانم جلوی گریه ام را بگیرم. من قبلاً 1000 بار به پست های صوتی yo dang گوش داده ام. لیل اونو در IG نوشت: دلم برای تماس‌های آخر شب و صبح زود تنگ می‌شود. اما همانطور که همیشه می گوییم باید ماموریت را کامل کنیم. مراقب من باش من به تو نیاز دارم StunnaMan در ادای احترامی به Young L در IG Story خود اضافه کرد: نمی‌توانم آن را", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/young-l-2007-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۲ آبان • ۲۲:۲۵"}, {"source": "Billboard", "title": "Alex Warren ‘Would Be Shocked’ If 2026 Kids’ Choice Awards Doesn’t Break a Slime Record During His Hosting Debut: ‘It’s a Priority of Mine’", "link": "https://www.billboard.com/music/awards/alex-warren-talks-hosting-2026-kids-choice-awards-1236381835/", "summary": "Hosts of the Kids’ Choice Awards pretty much have to be willing to be slimed. Alex Warren , who is hosting the show on Saturday (Nov. 14) isn’t just willing, he’s really looking forward to it. Warren, 26, grew up watching the show with his brother and two sisters, and has fond memories of those experiences. Related Cue the Slime: Taylor Swift, Ariana Grande Sabrina Carpenter Lead 2026 Kids Choice Awards Nominations: Full List Stop the Sliming! Ashe to Perform Her Wedding Hit at 2026 Kids Choice Awards Alex Warren Makes No Ordinary Award Show Debut at the 2025 AMAs In addition to hosting the show, Warren is a nominee: He’s up for favorite music collaboration for “Bloodline” (with Jelly Roll ). He was also nominated for two awards at last year’s show, favorite viral song for his megahit “Ordinary” and favorite male breakout artist. The show will afford Warren a chance to show his exuberant personality, a side of him that didn’t come across in his breakthrough hit, the rather solemn power ballad “Ordinary.” Warren has become an awards show regular in the past year, winning best new artist at the 2025 VMAs and being nominated in that category at the Grammys in February. He won four awards, including song of the year, at the iHeartRadio Music Awards in March. The Kids’ Choice Awards will broadcast live from Television City in Hollywood on Saturday, Nov. 14, from 8:00 to 9:30 p.m. ET (5:00 to 6:30 p.m. PT) on CBS and Nickelodeon. The show will also stream live on Paramount+ for Premium subscribers, with on-demand viewing available the following day for Premium and Essential subscribers. Jamie Miller will open the show with the U.S. television debut of his viral hit Babydoll.” Ashe will sing her Stop the Wedding!, a current top 30 hit on the Billboard Hot 100. Electronic duo Sofi Tukker will perform its dance track Tsunami.” Actor Chris Pratt is this year’s recipient of the King of Comedy Award, which went to Adam Sandler in 2023 and Jack Black in 2025. The KCAs are produced by Done + Dusted. Exuding a kid-like energy and enthusiasm, Warren chatted with Billboard the day before he makes his awards-show hosting debut. At last year’s Kids’ Choice Awards, you were nominated and also presented alongside Leon Thomas. What do you remember from the show? Last year specifically, what I remember the most is the slime. Just because the viscosity of that was quite insane. I d never been slimed before — and growing up, I had always dreamed of it. So we would try to do the DI", "date_str": "2026-11-13T18:50:06+00:00", "hash": "2b351bd50c03d62a", "title_fa": "الکس وارن \"شکه خواهد شد\" اگر جوایز انتخاب کودکان 2026 رکورد اسلایم را در اولین میزبانی او نشکند: \"این یک اولویت برای من است\"", "summary_fa": "میزبانان جوایز منتخب کودکان تقریباً باید مایل باشند که اسلیم شوند. الکس وارن، که میزبان برنامه در روز شنبه (14 نوامبر) است، نه تنها مایل است، بلکه واقعا مشتاقانه منتظر آن است. وارن 26 ساله با برادر و دو خواهرش با تماشای برنامه بزرگ شد و خاطرات خوبی از آن تجربیات دارد. Cue the Slime مرتبط: تیلور سوئیفت، آریانا گرانده سابرینا کارپنتر، پیشتازان جوایز انتخاب کودکان در سال 2026 نامزدهای جوایز انتخابی: فهرست کامل Stop the Sliming! Ashe آهنگ عروسی خود را در جوایز انتخاب بچه‌ها در سال 2026 اجرا می‌کند الکس وارن در AMAs 2025 هیچ نمایش معمولی جایزه‌ای ندارد. او همچنین نامزد دریافت دو جایزه در نمایش سال گذشته شد، آهنگ محبوب ویروسی برای مگا هیت خود \"Ordinary\" و هنرمند محبوب مرد محبوب. این نمایش به وارن فرصتی می‌دهد تا شخصیت پرشور خود را نشان دهد، جنبه‌ای از او که در اثر موفقیت‌آمیزش، تصنیف نسبتاً قدرتمند قدرتمند «معمولی» با آن مواجه نشد. وارن در سال گذشته به یک برنامه دائمی جوایز تبدیل شده است و برنده بهترین هنرمند جدید در جوایز VMA 2025 و نامزدی در آن بخش در گرمی در فوریه شده است. او برنده چهار جایزه از جمله آهنگ سال در مراسم جوایز موسیقی iHeartRadio در ماه مارس شد. جوایز منتخب کودکان شنبه، 14 نوامبر، از ساعت 8:00 تا 21:30 به صورت زنده از تلویزیون سیتی در هالیوود پخش می شود. ET (5:00 تا 6:30 بعد از ظهر PT) در CBS و Nickelodeon. این نمایش همچنین برای مشترکین Premium به صورت زنده در Paramount+ پخش خواهد شد و در روز بعد برای مشترکین Premium و Essential امکان مشاهده بر اساس تقاضا در دسترس خواهد بود. جیمی میلر نمایش را با ایالات متحده افتتاح خواهد کرد. اولین نمایش تلویزیونی موفقیت ویروسی او Babydoll.\" Ashe خود را Stop the Wedding! را خواهد خواند، یک 30 آهنگ برتر کنونی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P1055GPQ-e1794593232952.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۲:۲۰"}, {"source": "Billboard", "title": "John Morgan’s ‘Cry Baby’ Turns Personal Hurt Into a Potential Hit: ‘Just a Part of Life’", "link": "https://www.billboard.com/music/country/john-morgan-cry-baby-makin-tracks-1236381815/", "summary": "Apologies suck. They’re necessary in any adult relationship, but saying the right words, at the right time, is tricky, and muffing it up can actually dig the hole deeper. More importantly, if an apology is due, it means somebody did — or said — something hurtful. Having made a mistake that requires an “I’m sorry” is what sucks the most about trying to make amends. “If you care about a person in a relationship, there’s going to be times where you’re pissed off at each other, and you’re gonna say something that just comes right out,” says John Morgan . “People get stressed, you know, and they say things that you wouldn’t normally say. That’s just part of life, being able to grow through those moments.” Apologizing for a stray remark is one thing. Taking ownership for a series of mistakes is next level, and songwriter Tully Kennedy (“If I Didn’t Love You,” “Tip It on Back”), around the time of his 20th wedding anniversary, took stock of the relationship he’d built with his wife. “I’m thinking about all the times I wasn’t the best boyfriend back in the day, or the best husband,” he says. “I looked at her, and I said, ‘You know, sorry I made you cry, baby.’” He had a writing appointment that day — April 11, 2025 — at BMG Music on Nashville’s Music Row with Kurt Allison (“Anytime Soon,” “Seein’ Red”) and Lydia Vaughan (“If I Didn’t Love You,” “Bar None”), and on his commute, that personal moment started to feel like the foundation for a song. “’Cry Baby’ — I loved the play on the hook,” Kennedy says. “If you look at ‘Cry Baby,’ there’s so many different ways you can take that.” When he suggested the title at BMG, Vaughan fixated on the option Kennedy preferred, even before he finished explaining it, and they all dove in. Allison had a moody, introspective-sounding musical track that he’d created, and when he played it, Kennedy gave it a thumbs up. “You can’t really go too far down the road if you’re not matching a vibe with [the idea], especially that title,” Allison notes. “That title has to really land in a certain spot.” Kennedy sang the first couple lines in a conversational tone, approximating the apology he’d offered to his wife. The goal was to develop it with phrases that some guy listening in his car could envision saying to his other half: vulnerable, but not weak. “I’m 51 now, so I can look back and be like, ‘Boy, I handled that wrong,’” Kennedy says. “It’s actually been a great tool in my songwriting in these later years, because I can look back on a", "date_str": "2026-11-13T18:42:38+00:00", "hash": "bc5dc31b5bd8dbfa", "title_fa": "«بچه گریه کن» جان مورگان صدمه شخصی را به یک ضربه بالقوه تبدیل می کند: «فقط بخشی از زندگی»", "summary_fa": "عذرخواهی بد است آنها در هر رابطه بزرگسالی ضروری هستند، اما گفتن کلمات مناسب، در زمان مناسب، دشوار است، و خفه کردن آن در واقع می تواند سوراخ را عمیق تر کند. مهمتر از آن، اگر عذرخواهی به دلیل عذرخواهی باشد، به این معنی است که کسی کاری آزاردهنده انجام داده یا گفته است. مرتکب اشتباهی که مستلزم عبارت «متاسفم» است، چیزی است که در تلاش برای جبران آن بسیار بد است. جان مورگان می‌گوید: «اگر به فردی در یک رابطه اهمیت می‌دهید، زمان‌هایی پیش می‌آید که از دست یکدیگر عصبانی می‌شوید و چیزی را می‌گویید که درست به دست می‌آید». مردم استرس می‌گیرند، می‌دانید، و چیزهایی می‌گویند که شما معمولاً نمی‌گفتید. این فقط بخشی از زندگی است، توانایی رشد در آن لحظات.» معذرت خواهی برای اظهارات سرگردان یک چیز است. مالکیت یک سری از اشتباهات در مرحله بعدی قرار دارد و تالی کندی، ترانه‌سرا («اگر تو را دوست نداشتم»، «به آن اشاره کن»)، در حوالی بیستمین سالگرد ازدواجش، رابطه‌ای را که با همسرش ایجاد کرده بود، بررسی کرد. او می‌گوید: «من به تمام مواقعی فکر می‌کنم که در آن روز بهترین دوست پسر یا بهترین شوهر نبودم. به او نگاه کردم و گفتم: «می‌دانی، متاسفم که باعث گریه‌ات شدم، عزیزم.» او در آن روز - 11 آوریل 2025 - در BMG Music on Nashville's Music Row با کرت آلیسون (\"به زودی\"، \"Seein' Red\") و \"Lidia Vaughan\"، \"B Love You\" و \"I Love You\" یک قرار نویسندگی داشت. رفت و آمد، آن لحظه شخصی شروع به احساس کرد که پایه و اساس یک آهنگ است. کندی می‌گوید: «گریه کن عزیزم». «اگر به «کرای بیبی» نگاه کنید، راه‌های مختلفی وجود دارد که می‌توانید آن را انجام دهید.» وقتی او عنوان را در BMG پیشنهاد کرد، وان حتی قبل از اینکه توضیحش را تمام کند، روی گزینه‌ای که کندی ترجیح می‌داد، ثابت", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/John-Morgan-CR-Matthew-Berinato-billboard-1800-.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۲:۱۲"}, {"source": "Billboard", "title": "The Italy-Based Kappa FuturFestival Debuts in Mexico This Weekend — Can It Find Its Groove in a Crowded Market?", "link": "https://www.billboard.com/music/music-news/kappa-futur-festival-italy-mexico-debut-monterrey-interview-1236380510/", "summary": "So many festivals are synonymous with the sites where they happen. Coachella wouldn t be Coachella without the polo field, palm trees and mountains in the distance. Glastonbury s identity is intertwined with the terrain of Worthy Farm. Kappa FuturFestival in Turin, Italy has built a global reputation on both its sharp programming and the former industrial site where the fest has happened for the last 17 years. This weekend, Kappa organizers are taking a gamble with the first ever edition outside of Turin. FuturFestival Mexico happens in Monterrey on Nov. 13-14 at Parque Fundidora, a sprawling site that was once home to a steel and iron foundry. The lineup includes a chic list of DJs and producers including Âme b2b Marcel Dettman, Moodymann b2b Carl Craig, Carlita, Chloé Caillet, Diplo, Damian Lazarus, Dennis Cruz, Ki/Ki, Omri., Skream, Vintage Culture, Maceo Plex b2b Tiga and more. In fact, it s the shared DNA between Parque Fundidora and the Turin site, Parco Dora, that led Kappa organizers to Monterrey. Parco Dora, an industrial site that was formerly home to a Fiat steel-making facility and a tire manufacturing plant, has since been renovated into a sprawling park. Parque Fundidora, once home to the first foundry of its kind in Latin America, has gotten a similar transformation, now hosting a wide range of events, from marathons to fashion shows to other large-scale festivals like Tecate Pa l Norte, which brings roughly 100,000 attendees and will next happen at the site in March. The Torino event is in a pretty special location, so for us there wasn t a time frame [in terms of bringing it to another city], we were just looking for the right venue, says Kappa co-founder Luigi “Gigi” Mazzoleni. I don t see FuturFestival in an empty field like 90% of festivals around the world, and with the two parks having similar backgrounds, it felt like it was meant to be in Monterrey. An area of Parque Fundidora in Monterrey, Mexico Courtesy of Kappa FuturFestival Kappa FuturFestival is operated by its Turin-based parent company Movement Entertainment, which Mazzoleni founded alongside Maurizio Juni Vitale. The pair now operate the company with their third partner, Gian Luca Brignone. Movement/Kappa partnered with the Mexico City-based dance event producer Lostnights for FuturFestival Mexico. Lostnights has a strong track record in the space, producing events in Mexico and beyond including the Day Zero brand (which is based in Tulum and hosts editions in Brazil, Bali ", "date_str": "2026-11-13T18:32:09+00:00", "hash": "fd56d4d83134a268", "title_fa": "جشنواره کاپا فیوچر مستقر در ایتالیا این آخر هفته در مکزیک آغاز به کار کرد - آیا می تواند در بازار شلوغ شیار خود را پیدا کند؟", "summary_fa": "بسیاری از جشنواره ها مترادف با مکان هایی هستند که در آن برگزار می شوند. کواچلا بدون زمین چوگان، درختان نخل و کوه‌های دوردست، کواچلا نخواهد بود. هویت گلاستونبری با زمین مزرعه ارزشی در هم آمیخته است. کاپا فیوچر فستیوال در تورین، ایتالیا شهرت جهانی هم با برنامه‌ریزی دقیق خود و هم در سایت صنعتی سابق که این جشنواره در 17 سال گذشته برگزار شده است، به دست آورده است. این آخر هفته، برگزارکنندگان کاپا با اولین نسخه خارج از تورین قمار می کنند. جشنواره FuturFestival مکزیک در 13 تا 14 نوامبر در مونتری در Parque Fundidora برگزار می‌شود، سایتی وسیع که زمانی محل ریخته‌گری فولاد و آهن بود. این مجموعه شامل لیست شیکی از دی جی ها و تهیه کنندگان از جمله Âme b2b Marcel Dettman، Moodymann b2b Carl Craig، Carlita، Chloé Caillet، Diplo، Damian Lazarus، Dennis Cruz، Ki/Ki، Omri.، Skream، Vintage Culture، Maceo Plex b2 است. در واقع، این DNA مشترک بین Parque Fundidora و سایت تورین، Parco Dora است که برگزارکنندگان کاپا را به مونتری هدایت کرد. Parco Dora، یک سایت صنعتی که قبلاً محل تأسیسات فولادسازی فیات و یک کارخانه تولید تایر بود، از آن زمان به یک پارک گسترده بازسازی شده است. Parque Fundidora که زمانی محل اولین ریخته‌گری در نوع خود در آمریکای لاتین بود، تحول مشابهی را تجربه کرد و اکنون میزبان طیف گسترده‌ای از رویدادها، از ماراتن‌ها گرفته تا نمایش‌های مد و جشنواره‌های بزرگ دیگری مانند Tecate Pa l Norte است که تقریباً 100000 شرکت‌کننده را به همراه دارد و بعداً در ماه مارس در سایت برگزار می‌شود. لوئیجی «جیجی» ماتزولنی، یکی از بنیانگذاران کاپا، می گوید که رویداد تورینو در یک مکان بسیار ویژه است، بنابراین برای ما چارچوب زمانی [از لحاظ آوردن آن به شهر دیگر] وجود نداشت، ما فقط به دنبال مکان مناسب بودیم. من جشنواره FuturFestival را در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/BB_3-SOLAR-STAGE.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۲:۰۲"}, {"source": "Billboard", "title": "From U2 & Dolly Parton’s Duet to ‘The Hunger Games’ Soundtrack, Which New Music Release Is Your Favorite This Week? Vote!", "link": "https://www.billboard.com/music/music-news/u2-dolly-parton-hunger-games-soundtrack-best-new-music-poll-1236381798/", "summary": "Next week may kick off with the reveal of the 2027 Grammy nominations on Nov. 16, but for now, New Music Friday is the primary focus. Related The Hunger Games Soundtrack, ATEEZ, U2 Feat. Dolly Parton More: New Music Friday Guide Belly Gang Kushington Is Bringing the Motivation Back to Atlanta Rap: This S t Is Bliss for Me Right Now Leon Thomas Penned Hits For Ariana Grande and SZA — Now He s R B s Hottest Rock Star The Hunger Games: Sunrise on the Reaping soundtrack leads this week s roundup. The 29-song set features contributions from Noah Kahan, The Smashing Pumpkins, Gigi Perez, Bella Kay, Stevie Nicks, Noah Cyrus and Ella Langley, as well as appearances by franchise stars Whitney Peak, Mckenna Grace and Jennifer Lawrence. Legendary rock band U2 also shared its new Carnaval de Luz album, which includes Torn, a heart-wrenching duet featuring the final recording of the late Dolly Parton. Three-time Grammy-nominated R B singer Snoh Aalegra returned with Legendary Love , her first studio album in five years, while South Korean boy band ATEEZ dropped its 15th minialbum, Golden Hour: Part.6 . Several hip-hop stars released new projects, including Belly Gang Kushington ( Good Dope Sells Itself ), Offset ( GMFU ), Westside Gunn ( Heelmatic ) and Babyface Ray ( Unf kwitable 2 ). This New Music Friday also featured new projects from Becky Hill ( Rebecca ), David Kushner ( Devotion ), Jake Bugg ( Alamo ), Randy Travis ( Same Old Way ), Say Now ( Say What You See ), Waylon Jennings ( Diamonds ), Rochelle Jordan ( Disc 4 EP), Wiz Khalifa ( Cool ), Benny the Butcher, Black Soprano Family Fuego Base ( A Friend of Ours 2 ), Naomi Sharon ( No Sleep In Paradise: Still Awake* ), 2hollis ( Piroutte ) and Tannerélle ( Situation Blue ) and Sleep Hallow ( Still Sleep?? ). As for singles, three-time Grammy winner Leon Thomas leads the pack with Trophy, a sexy bedroom jam that doubles as his first solo offering of 2026. Fall Out Boy followed up the announcement of their 2027 global tour with a new single called Aces, a melodic slice of the band s signature pop-punk style. Don Toliver continued teasing Nitrous with the release of Party With the Boys, and Drake shared the cult classic Hate Sleeping Alone in honor of the 15th anniversary of Take Care . New singles also arrived from IDK, Eminem and J Dilla (“Welcome”); Venna and Odeal ( Lo Life ); Kameron Marlowe ( Tell By Now ); Tito Double P ( Francia ); Avery Anna ( Roadkill ); FLO ( Leave You ); 54 Ultra ( Honeymoon ); 2 Chainz", "date_str": "2026-11-13T18:30:58+00:00", "hash": "fded6829a63cf792", "title_fa": "از دوئت U2 و دالی پارتون تا موسیقی متن «بازی‌های گرسنگی»، کدام نسخه جدید موسیقی مورد علاقه شما در این هفته است؟ رای بده", "summary_fa": "هفته آینده ممکن است با معرفی نامزدهای گرمی 2027 در 16 نوامبر آغاز شود، اما در حال حاضر، New Music Friday تمرکز اصلی است. مرتبط با موسیقی متن The Hunger Games، ATEEZ، U2 Feat. دالی پارتون بیشتر: راهنمای جدید موسیقی جمعه Belly Gang Kushington انگیزه را به رپ آتلانتا باز می‌گرداند: این S t Is Bliss for Me Right Now لئون توماس آهنگ‌هایی را برای آریانا گرانده و SZA نوشته است — اکنون او داغ‌ترین ستاره راک RB است. این مجموعه 29 آهنگی شامل مشارکت‌هایی از نوح کاهان، کدو تنبل‌های شکسته، جیجی پرز، بلا کی، استیوی نیکس، نوح سایرس و الا لنگلی، و همچنین حضور ستاره‌های فرنچایز ویتنی پیک، مک‌کنا گریس و جنیفر لارنس است. گروه راک افسانه ای U2 همچنین آلبوم جدید Carnaval de Luz خود را به اشتراک گذاشت که شامل Torn، یک دونوازی دلخراش با آخرین ضبط دالی پارتون فقید است. Snoh Aalegra خواننده سه بار نامزد جایزه گرمی R B با Legendary Love، اولین آلبوم استودیویی خود در پنج سال گذشته بازگشت، در حالی که گروه پسر کره جنوبی ATEEZ پانزدهمین آلبوم کوچک خود، Golden Hour: Part.6 را منتشر کرد. چندین ستاره هیپ هاپ پروژه های جدیدی منتشر کردند، از جمله Belly Gang Kushington ( Good Dope Sells Itself )، Offset ( GMFU )، Westside Gunn ( Heelmatic ) و Babyface Ray ( Unf kwitable 2 ). این جمعه موزیک جدید همچنین پروژه‌های جدیدی از بکی هیل (ربکا)، دیوید کوشنر (وفاداری)، جیک باگ (آلامو)، رندی تراویس (همان روش قدیمی)، اکنون بگو (آنچه می‌بینید)، ویلون جنینگز (الماس)، روشل جردن (دیسک 4 EP)، ویز خلیفه (خانواده) ویز خلیفا (خانواده) Friend of Ours 2)، نائومی شارون (No Sleep In Paradise: Still Awake*)، 2hollis (Piroutte) و Tannerélle (Stuation Blue) و Sleep Hallow (هنوز خواب؟) در مورد تک‌آهنگ‌ها، لئون توماس، برنده سه جایزه گرمی، با Trophy، یک جام سکسی در اتاق", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Dolly-Parton-Glastonbury-Getty-Images.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۲:۰۰"}, {"source": "Billboard", "title": "Stolen (Not Super) Intelligence: Why Congress Must Stop Big AI From Ripping Off Creators (Guest Column)", "link": "https://www.billboard.com/pro/congress-stop-big-ai-ripping-off-creators-jerrold-nadler/", "summary": "For over 30 years, I’ve had the privilege of sitting on the House Judiciary Committee, and one of my priorities has been to ensure that the most powerful companies are held to account for ripping off Americans. As we grapple with fast-moving technological change, lawmakers must be vigilant that new technologies do not create new socio-economic harms. Sadly, some of the largest and wealthiest AI companies are running roughshod over intellectual property (IP) rights. Far from being super intelligence — as President Trump calls it — when you look at how these models are trained, they can more fittingly be described as stolen intelligence. There are currently dozens of lawsuits in the U.S. and around the world alleging that AI companies have violated copyright by training their models on millions of articles, songs, books, voice recordings, videos and other creative content without permission and without payment. Related The Elvis AI Lawsuit, Explained CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive The outcome of these lawsuits will have far-reaching ramifications. Worryingly, Trump’s Department of Justice is trying to put its finger on the scale, siding with billionaires in Silicon Valley against the creative and cultural beating heart of America, made up of thousands of journalists, authors, artists, actors, songwriters and musicians. Last month, the DOJ filed a brief in the New York Times v. Microsoft and OpenAI in support of Microsoft and OpenAI. The Times alleges that Microsoft and OpenAI copied millions of its articles to train ChatGPT. Recently unsealed court filings show that a senior Microsoft scientist privately described the practice as an astonishing theft of unprecedented proportions, yet Donald Trump and his hand-picked lawyers argue that the clear evidence of market harm isn’t theft, but fair use. While just one filing, AI developers everywhere may try to use the Trump Administration’s argument to defend the practice of mass intellectual property theft. It’s not just the free press that’s under attack. Just look at the music industry. Suno, the most widely used AI music generator, is being sued by major record labels for training its model on their recordings without permission. Like OpenAI, Suno claims this is fair use, despite admitting in court that it trained on essentially", "date_str": "2026-11-13T18:29:05+00:00", "hash": "f748418bc14c55e2", "title_fa": "هوش دزدیده شده (نه فوق العاده): چرا کنگره باید هوش مصنوعی بزرگ را از حذف سازندگان متوقف کند (ستون مهمان)", "summary_fa": "برای بیش از 30 سال، من این امتیاز را داشتم که در کمیته قضایی مجلس نمایندگان حضور داشته باشم، و یکی از اولویت های من این بوده است که اطمینان حاصل کنم که قدرتمندترین شرکت ها به دلیل از بین بردن آمریکایی ها مسئول شناخته می شوند. در حالی که ما با تغییرات سریع تکنولوژی دست و پنجه نرم می کنیم، قانونگذاران باید مراقب باشند که فناوری های جدید آسیب های اجتماعی و اقتصادی جدیدی ایجاد نکنند. متأسفانه، برخی از بزرگترین و ثروتمندترین شرکت‌های هوش مصنوعی در مورد حقوق مالکیت معنوی (IP) به سختی کار می‌کنند. به دور از هوش فوق العاده - همانطور که رئیس جمهور ترامپ آن را می نامد - وقتی به نحوه آموزش این مدل ها نگاه می کنید، می توان آنها را به عنوان اطلاعات سرقت شده توصیف کرد. در حال حاضر ده‌ها پرونده قضایی در ایالات متحده و سراسر جهان وجود دارد که ادعا می‌کند شرکت‌های هوش مصنوعی با آموزش مدل‌های خود بر روی میلیون‌ها مقاله، آهنگ، کتاب، صدای ضبط‌شده، ویدئو و سایر محتوای خلاقانه بدون اجازه و بدون پرداخت حق نسخه‌برداری را نقض کرده‌اند. دعوی مرتبط با هوش مصنوعی الویس، توضیح نشانه‌های CL با THEBLACKLABEL، اتحاد مجدد با تدی تهیه‌کننده طولانی‌مدت برای شرایط جوی شدید، بندهای شعاع و یافتن نسل بعدی سرفصل‌های جشنواره: این یک مبارزه سال به سال برای زنده ماندن است. نگران‌کننده است که وزارت دادگستری ترامپ در تلاش است تا انگشت خود را روی ترازو بگذارد و در کنار میلیاردرهای سیلیکون ولی علیه قلب تپنده خلاق و فرهنگی آمریکا، متشکل از هزاران روزنامه‌نگار، نویسنده، هنرمند، بازیگر، ترانه سرا و موسیقی‌دان قرار بگیرد. ماه گذشته، وزارت دادگستری یک گزارش مختصر در نیویورک تایمز علیه مایکروسافت و OpenAI در حمایت از Microsoft و OpenAI ارائه کرد. تایمز ادعا می کند که مایکروسافت و OpenAI میلیون ها مقاله خود را برای آموزش ChatGPT", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/rep-jerrold-nadler-headshot-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Microsoft", "عامل‌های هوشمند"], "datetime_fa": "۲۲ آبان • ۲۱:۵۹"}, {"source": "Billboard", "title": "Bad Gyal, Luísa Sonza, Milo J & More: Best Quotes From Billboard Brasil and Billboard Español’s 2026 Latin Grammys Activation", "link": "https://www.billboard.com/music/latin/2026-latin-grammys-billboard-meta-best-music-artist-quotes-1236380596/", "summary": "Ahead of the 27th Annual Latin Grammy Awards, Billboard Brasil and Billboard Español teamed up with Meta for a two-day activation at the Museum of Illusions in Las Vegas on Nov. 10–11. The immersive experience brought artists and nominees into a world of mind-bending exhibits, where they tried on Meta s smart glasses, explored optical illusions and stepped in front of the camera for candid conversations about their music, careers and more. From personal revelations and unexpected anecdotes to reflections on creative breakthroughs, the artists had plenty to share. Here are 15 of the most memorable quotes from the experience. Luísa Sonza on her breakthrough beyond Brazil For Brazilian pop star Luísa Sonza, earning her first Latin Grammy nomination outside the Brazilian categories — best reggaetón performance for “Uñas afiladas” with Sofía Reyes — was an unexpected milestone. “The nomination was a surprise to me. I didn t think it would happen,” she said, describing the recognition as “something very beautiful, an achievement.” What made the moment even more meaningful was sharing it with an artist she considers a friend. Sonza recalled how their collaboration came together organically, without awards or commercial expectations in mind: “We didn t make the songs thinking about anything else, just because we liked each other. Their creative chemistry was so immediate that one studio session yielded three songs, all of which they eventually released. View this post on Instagram Bruses on Rosalía, vulnerability and redefining success The Mexican singer-songwriter had plenty to celebrate with three Latin Grammy nominations, but she also found time to give a hat tip to the competition. “Rosalía, it s an honor to lose to you. I love you so much,” she joked. Beyond the playful remark, the Tijuana native reflected on the emotional journey behind her album, Desde el Coma — which took three years to complete — explaining that mental health has long been central to her songwriting, which began as a form of personal journaling before her music reached a wider audience. “I ve always made songs about mental health, you know? And I started making music by writing as if it were my personal diary,” she said. As her career grew, so did her understanding of what achievement really means. “Success looks different to me now. It s really beautiful, and I think I m a very successful woman, and that has nothing to do with musical success.” View this post on Instagram J Noa on taking", "date_str": "2026-11-13T18:21:21+00:00", "hash": "9278eead1a6171c1", "title_fa": "Bad Gyal، Luísa Sonza، Milo J و بیشتر: بهترین جملات از Billboard Brasil و Billboard Español's Latin Gramys 2026 Activation", "summary_fa": "پیش از بیست و هفتمین جوایز سالانه گرمی لاتین، بیلبورد برزیل و بیلبورد اسپانیا با متا برای فعالسازی دو روزه در موزه توهمات در لاس وگاس در 10 تا 11 نوامبر همکاری کردند. این تجربه همهجانبه هنرمندان و نامزدها را وارد دنیایی از نمایشگاه‌های شگفت‌انگیز کرد، جایی که آنها عینک هوشمند متا را امتحان کردند، توهمات نوری را بررسی کردند و برای گفتگوهای صریح در مورد موسیقی، حرفه و موارد دیگر جلوی دوربین رفتند. از افشاگری‌های شخصی و حکایت‌های غیرمنتظره گرفته تا تأملاتی در مورد پیشرفت‌های خلاقانه، هنرمندان چیزهای زیادی برای به اشتراک گذاشتن داشتند. در اینجا 15 مورد از به یاد ماندنی ترین نقل قول های این تجربه آورده شده است. لوئیزا سونزا در موفقیت خود فراتر از برزیل برای ستاره پاپ برزیلی، لوئیزا سونزا، کسب اولین نامزدی گرمی لاتین خارج از رده های برزیل - بهترین اجرای رگیتون برای \"Uñas afiladas\" با سوفیا ریس - یک نقطه عطف غیرمنتظره بود. این نامزدی برای من غافلگیرکننده بود. فکر نمی‌کردم این اتفاق بیفتد، او گفت و این شناخت را به عنوان «چیزی بسیار زیبا، یک دستاورد» توصیف کرد. چیزی که این لحظه را معنادارتر کرد، به اشتراک گذاشتن آن با هنرمندی بود که او دوستش می‌داند. سونزا به یاد می آورد که چگونه همکاری آنها به صورت ارگانیک و بدون جوایز یا انتظارات تجاری در ذهن ایجاد شد: \"ما آهنگ ها را به فکر چیز دیگری نمی دانیم، فقط به این دلیل که یکدیگر را دوست داشتیم. شیمی خلاقانه آنها به قدری فوری بود که در یک جلسه استودیویی سه آهنگ به دست آمد که در نهایت همه آنها را منتشر کردند. این پست را در اینستاگرام  in Early 2028", "link": "https://variety.com/2026/tv/news/tv-academy-cancels-televerse-2027-emmy-season-return-2028-1236947153/", "summary": "Televerse is taking a telebreak. The Television Academy’s TV festival, which launched in 2025 and continued this year, won’t be back in 2027 — and will move to earlier in the year when it returns in 2028, the org announced Friday. That now places Televerse at the start of the Emmy FYC season, as opposed [ ]", "date_str": "2026-11-13T18:15:51+00:00", "hash": "29af8f64ccebf446", "title_fa": "آکادمی تلویزیون تلویزیون تلویزیونی را برای فصل امی 2027 لغو کرد. جشنواره در اوایل سال 2028 بازخواهد گشت", "summary_fa": "Televerse در حال گرفتن یک تله‌بریک است. این سازمان جمعه اعلام کرد، جشنواره تلویزیونی آکادمی تلویزیون، که در سال 2025 راه اندازی شد و امسال نیز ادامه یافت، در سال 2027 باز نمی گردد - و در اوایل سال، زمانی که در سال 2028 باز می گردد، حرکت خواهد کرد. که اکنون Televerse را در شروع فصل Emmy FYC قرار می دهد، در مقابل [ ] \"به دنبال بازخورد روشنگرانه از شرکت کنندگان و شرکای صنعت ما، آکادمی تلویزیون مشتاق است اعلام کند Televerse در یک بازه زمانی جدید در سه ماهه اول سال 2028 بازخواهد گشت، و اجازه می دهد دوره گسترده تری برای ایجاد بر اساس جشنواره محبوب دو سال در بیانیه ای برگزار شود.\" \"تاریخ و جزئیات جدید به محض در دسترس شدن اعلام خواهد شد. ما مشتاقانه منتظر ادامه جشن تلویزیون خارج از چارچوب در اوایل سال 2028 هستیم. داستان های مرتبط آه، مریم! شیدایی لس آنجلس را تصاحب می کند: کارگردان سام پینکلتون در آوردن پدیده کمدی سرکش برادوی به فول هاوس در Ahmanson دایانا سیلورز با غم و اندوه روبرو می شود و در آلبوم دوم شخصی و عمیق بزرگ می شود. پخش تلویزیونی امی به خانه جدیدی می رود (آمازون پرایم ویدیو)، اما مشغول تکمیل ادغام با همتای نیویورکی خود، آکادمی ملی علوم هنرهای تلویزیونی است. Televerse امسال از جمعه، 14 اوت تا یکشنبه، 16 اوت 2026، در JW Marriott در L.A. Live در مرکز شهر لس آنجلس برگزار شد. Televerse در ابتدا به عنوان یک رویداد ترکیبی مصرف‌کننده/صنعت، با تجمع‌ها و پنل‌هایی برای طرفداران تلویزیون، اما همچنین به عنوان اولین دسته رسمی از رویدادهای کمپین مرحله دوم امی برای نمایش‌ها و ستاره‌های نامزد ارائه شد.", "image_url": "https://variety.com/wp-content/uploads/2025/03/TV-Academy-Televerse.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۱:۴۵"}, {"source": "Variety", "title": "‘Sunset P.I.’ Sets NBC Release Date, Jake Johnson Comedy Series Drops New First-Look Photos", "link": "https://variety.com/2026/tv/news/sunset-p-i-nbc-release-date-jake-johnson-1236947108/", "summary": "NBC has set the premiere date for its new comedy series Sunset P.I. The single-camera comedy will debut Monday, Feb. 8 at 8:30 pm ET/PT. Episodes will be available to stream the next day on Peacock. NBC has also released new first-look images from the series, which can be seen below. The series stars Jake [ ]", "date_str": "2026-11-13T18:00:00+00:00", "hash": "f92797f1debffe69", "title_fa": "«Sunset P.I.» تاریخ انتشار NBC را تعیین می‌کند، سریال کمدی جیک جانسون عکس‌های تازه‌ای را منتشر می‌کند", "summary_fa": "NBC تاریخ پخش سریال کمدی جدید خود Sunset P.I را تعیین کرده است. این کمدی تک دوربینی دوشنبه 8 فوریه ساعت 20:30 به وقت ET/PT پخش خواهد شد. اپیزودها برای پخش در روز بعد در Peacock در دسترس خواهند بود. شبکه NBC نیز تصاویر جدیدی از این سریال منتشر کرده است که در ادامه می توانید مشاهده کنید. جیک [ ] بازیگران این سریال جیک جانسون، جین لوی، لنگستون کرمان، مری شالبی و کیث دیوید هستند. این فیلم به عنوان یک کمدی در محل کار به دنبال میکی وایلدر (جانسون) و سایر بازرسان خصوصی در آژانس کارآگاهی هالیوود او توصیف می شود. داستان‌های مرتبط جوایز بازی برای معرفی نامزدهای 2026 هفته آینده پیش از شروع بازی GTA 6، پلی‌استیشن 5 به پخش زنده برای نمایش دسامبر (اختصاصی) درام جنگی مالزی، The Ghost and the Gun Sets عرضه جهانی نتفلیکس (انحصاری) Sunset P.I. توسط Dan Goor و Luke Del Tredici که به عنوان تهیه کننده اجرایی نیز فعالیت می کنند، ساخته شده است. آکیوا شافر کارگردانی و تهیه کنندگی اجرایی آن را بر عهده داشت. یونیورسال تلویزیون استودیو است. غروب P.I. در ابتدا به عنوان بخشی از آخرین فصل آزمایشی NBC ساخته شد و به طور رسمی در ماه مه پخش شد. این نمایش به عنوان یک رقیب قوی برای دریافت سریال از پرش دیده می شد و یکی از چهار سریال جدیدی بود که پخش کننده برای فصل 2026-2027 سفارش داد. سایر موارد عبارتند از درام پلیسی Line of Fire، ریبوت فیلم The Rockford Files با دیوید Boreanaz و کمدی چند دوربینی Newlyweds.", "image_url": "https://variety.com/wp-content/uploads/2026/11/NUP_212340_00010.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۲۲ آبان • ۲۱:۳۰"}, {"source": "Billboard", "title": "Jamie Miller’s ‘Babydoll’ Scores a Fourth Straight Week as the U.K.’s No. 1 Single", "link": "https://www.billboard.com/music/pop/jamie-miller-babydoll-uk-number-one-single-fourth-week-1236381681/", "summary": "Jamie Miller s Babydoll has earned a fourth consecutive week at the No. 1 spot on the U.K.’s Official Singles Chart dated Nov. 13. Related Chartbreaker: Inside Jamie Miller’s Viral But ‘Authentic’ Strategy for ‘Babydoll’ and Why ‘Social Media Is How You Become Successful Today Aria Vega Wins Best New Artist at the 2026 Latin Grammys: Dreams Know No Fear On Winning First Latin Grammy, Camila Fernández Thanks Expectant Baby for Strength to be Here The song first hit the top spot in October, and is the second longest-running No. 1 of 2026 so far, behind only Sam Fender and Olivia Dean ’s “Rein Me In” (23 weeks). Miller s song is currently placed at No. 45 on the Billboard Hot 100 , its best ever position yet. Speaking to Billboard for its Chartbreaker column, the Cardiff-born act discussed the explosion of the song following a viral social media campaign. “It feels like the song has kind of unified people, and it’s been so amazing to see how fun it’s been for everybody — from kids in Africa and people in Sweden to these amazing dance groups in America and TV shows in the U.K.” Ashe ’s “Stop the Wedding!” is up to No. 2 for a new peak and a career-best for the rising pop act. Tate McRae’s “Housewife” is at No. 3, followed by Sienna Spiro’s “Great Expectation” at No. 4. Sombr’s “My Body Isn’t Ready” is up four places to a new peak at No. 5. Olivia Rodrigo’s “Take Me Home (4 Christmas)” makes its chart debut at No. 8, the first Christmas song to land inside the top 10 in 2026. She has two further tracks inside the top 40, with Chappell Roan collaboration “Expectations” at No. 7 and “Stupid Song” at No. 26. Elsewhere, Wham!’s “Last Christmas” is up 32 places to No. 22 and Mariah Carey’s “All I Want for Christmas Is You” lifts 46 places to No. 36. Sam Fender’s cover of The Rolling Stones’ classic “You Can’t Always Get What You Want” debuts at No. 39; the cover was recorded for the John Lewis Christmas advert which aired on British television Nov. 3.", "date_str": "2026-11-13T18:00:00+00:00", "hash": "20d97a8c2bbe350d", "title_fa": "«Babydoll» جیمی میلر چهارمین هفته متوالی را به عنوان تک‌آهنگ شماره 1 بریتانیا کسب کرد.", "summary_fa": "بازی Babydoll جیمی میلر برای چهارمین هفته متوالی در رتبه اول جدول تک آهنگ های رسمی بریتانیا در تاریخ 13 نوامبر قرار گرفت. Chartbreaker مرتبط: استراتژی ویروسی اما «معتبر» جیمی میلر برای «Babydoll» و چرا «رسانه های اجتماعی چگونه امروز موفق می شوید آریا وگا برنده بهترین هنرمند جدید در گرمی لاتین 2026: Dreams Know No Fear On Winning First Grammy لاتین است، Camila Ferrength برای اولین آهنگ گرمی لاتین، کامیلا فرنگنت، اولین ترانه بابی را تشکر می کنم. رتبه اول در ماه اکتبر، و دومین طولانی ترین شماره 1 سال 2026 تاکنون است، پس از سم فندر و اولیویا دین \"Rein Me In\" (23 هفته). آهنگ میلر در حال حاضر در رتبه 45 در بیلبورد Hot 100 قرار دارد که بهترین موقعیت آن تاکنون است. در صحبت با بیلبورد برای ستون Chartbreaker، بازیگر متولد کاردیف در مورد انفجار این آهنگ پس از یک کمپین رسانه های اجتماعی ویروسی بحث کرد. به نظر می‌رسد این آهنگ به نوعی مردم را متحد کرده است، و دیدن این که چقدر برای همه سرگرم‌کننده بوده است - از بچه‌های آفریقا و مردم سوئد گرفته تا این گروه‌های رقص شگفت‌انگیز در آمریکا و برنامه‌های تلویزیونی در بریتانیا، بسیار شگفت‌انگیز است.» Ashe 's \"Stop the Wedding!\" تا شماره 2 برای یک اوج جدید و بهترین حرفه ای برای بازی پاپ در حال افزایش است. «خانه‌دار» از تیت مک‌ری در رتبه 3 قرار دارد و پس از آن «انتظار بزرگ» از سینا اسپیرو در رتبه 4 قرار دارد. «بدن من آماده نیست» سامبر با چهار پله صعود به اوج جدیدی در رتبه 5 رسیده است. «Take Me Home (4 Christmas)» از Olivia Rodrigo اولین آهنگ خود را در جدول رتبه 8 نشان می دهد، اولین آهنگ کریسمس که در سال 2026 در بین 10 آهنگ برتر قرار گرفت. او دو ترانه دیگر در بین 40 آهنگ", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Jamie-Miller-Matthew-Langlois-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۱:۳۰"}, {"source": "Billboard", "title": "James Blunt Flies to His Third U.K. No. 1 Album With ‘Airplane Mode’", "link": "https://www.billboard.com/music/chart-beat/james-blunt-airplane-mode-number-one-album-uk-1236381701/", "summary": "James Blunt has held off Royal Blood to earn his third U.K. No. 1 LP on the Nov. 13-dated Official Albums Chart with Airplane Mode . The set is Blunt’s first U.K. No. 1 album since 2007’s All the Lost Souls ; he also hit the top spot in 2004 with his bestselling debut LP, Back to Bedlam . “I can t tell you how grateful I am to every single person who has gone out there and downloaded, or bought or streamed my album,” Blunt told the Official Charts Company. “From the bottom of my heart, thank you so much! Following at No. 2 is Brighton-formed rock duo Royal Blood with its fifth studio album, Dead Company . It’s the pair s first LP to not hit the No. 1 spot following Royal Blood (2014), How Did We Get So Dark? (2017), Typhoons (2021), Back to the Water Below (2023). Olivia Rodrigo ’s you seem pretty sad for a girl so in love closes the week at No. 3, down one spot. Skepta’s first solo LP in seven years, The Fork and Knife , lands at No. 4, securing the grime legend his fourth consecutive top five finish. Kings of Leon’s O My Beloved finishes the week at No. 5, continuing a streak that has seen each of the Followill clan’s 10 studio LPs landing inside the top five. There’s also top 40 debuts this week for Steven Wilson ( Requiem for a Village , No. 6), George Michael ( The Faith Tour , No. 7), Rex Orange County ( Dream Fatigue , No. 18) and Tinie Tempah ( The Night’s Not Dead , No. 20).", "date_str": "2026-11-13T18:00:00+00:00", "hash": "b2c1979ab607dc1a", "title_fa": "جیمز بلانت با «حالت هواپیما» به سومین آلبوم شماره 1 خود در بریتانیا پرواز می کند.", "summary_fa": "جیمز بلانت از رویال خون خودداری کرد تا سومین آلبوم LP شماره 1 خود را در جدول آلبوم های رسمی تاریخ 13 نوامبر با حالت هواپیما کسب کند. این مجموعه اولین آلبوم Blunt در بریتانیا از سال 2007 به بعد از All the Lost Souls است. او همچنین در سال 2004 با اولین آلبوم پرفروش خود، بازگشت به بدلام، به مقام اول رسید. بلانت به شرکت نمودارهای رسمی گفت: «نمی توانم به شما بگویم که چقدر از تک تک افرادی که به آنجا رفته اند و آلبوم من را دانلود کرده یا خریده یا پخش کرده اند سپاسگزارم. \"از ته قلبم، خیلی از شما متشکرم! در رتبه دوم، دو گروه راک Royal Blood با پنجمین آلبوم استودیویی خود، Dead Company، برایتون قرار دارند. این اولین LP این زوج است که بعد از رویال خون (2014)، How Did We Get So Dark? رودریگو برای دختری بسیار غمگین به نظر می‌رسد، بنابراین هفته را در رتبه سوم قرار می‌دهد و اولین آلبوم انفرادی Skepta در هفت سال اخیر، The Fork and Knife، در رتبه اول قرار می‌گیرد. 4، اسطوره کثیف را برای چهارمین رتبه متوالی خود در پنج تیم برتر تضمین کرد. Kings of Leon's O My Beloved هفته را در رتبه 5 به پایان می رساند و به روندی ادامه می دهد که هر یک از 10 LP استودیویی از قبیله Followill در بین پنج آلبوم برتر قرار گرفته اند. همچنین 40 کار اول این هفته برای استیون ویلسون (مرثیه برای یک دهکده، شماره 6)، جورج مایکل (تور ایمان، شماره 7)، رکس اورنج کانتی (خستگی رویایی، شماره 18) و تینی تمپا (شب نمرده، شماره 20) وجود دارد. این مجموعه اولین شماره بریتانیایی بلانت است. 1 آلبوم از سال 2007، All the Lost Souls. او همچنین در سال 2004 با اولین آلبوم پرفروش خود، بازگشت به بدلام، به مقام اول رسید. بلانت", "image_url": "https:/ rake: Challenge Accepted The Emmy-nominated actor opened up about the possibility of returning to his breakout role as Kurt Hummel in the Ryan Murphy-created musical dramedy on The Daily Beast’s Obsessed , revealing he thinks his character could very well be working for a certain Gen Z pop star in the present day. At this point, I’m just curious, he began on the interview posted Wednesday (Nov. 11), noting he d recently had a “nice conversation with someone” about the intentions for the reboot. “I’m gonna have more conversations soon,” he continued. From what I heard, it sounded very funny and it sounded like a good idea. As for what he thinks Kurt is up to now — beyond raising a family with Darren Criss Blaine Anderson — the author theorized that his character is hopefully in a high-ranking role at a fashion brand à la Miranda Priestly in The Devil Wears Prada . Or, I could also see him on tour with Chappell Roan, styling her,” he said. Glee originally ran on Fox from 2009 to 2015, ending with Kurt and Blaine as Broadway stars with a baby on the way, with Michele s character Rachel Berry — also a Broadway star — as their surrogate. The show has remained a force in pop culture as fans continue to stream it, and the Glee cast remains the act with the fourth-most entries on the Billboard Hot 100 . (Only Drake, Taylor Swift and Future have more.) The Glee -boot will soon find a home on Disney+ and Hulu, which handed it a series order in October after Murphy teased the month prior that he d finished a script. “I’ve been in touch with around 10 of the original cast members,” the screenwriter said in September. “It’s very sweet, and they all had a lot of questions, but they all were very enthusiastic about the idea.” Watch Colfer s full interview below.", "date_str": "2026-11-13T17:50:19+00:00", "hash": "9407e8159753a3f7", "title_fa": "کریس کولفر می‌گوید که در حال مذاکره برای «Glee»-boot است، آنچه را که فکر می‌کند کرت اکنون انجام می‌دهد به اشتراک می‌گذارد (نکته: شامل چاپل روان می‌شود)", "summary_fa": "راه اندازی مجدد Glee به طور کامل در حال انجام است، Lea Michele و O.G. گفته می شود که اعضای بازیگران در حال بازگشت هستند. آیا کریس کولفر یکی از آنهاست؟ مطالب مرتبط The Glee Reboot رسما در دست ساخت است هری شوم جونیور. خطاب به اینکه آیا او در بوت Glee خواهد بود یا نه: من در حال حاضر واقعاً، واقعاً مشغول هستم. فاش می کند که فکر می کند شخصیت او می تواند در حال حاضر برای یک ستاره پاپ خاص Gen Z کار کند. در این مرحله، من فقط کنجکاو هستم، او در مصاحبه ای که چهارشنبه (11 نوامبر) ارسال شد، شروع کرد و خاطرنشان کرد که اخیراً یک \"گفتگوی خوب با کسی\" در مورد اهداف راه اندازی مجدد داشته است. او ادامه داد: به زودی گفتگوهای بیشتری خواهم داشت. از چیزی که شنیدم خیلی خنده دار به نظر می رسید و ایده خوبی به نظر می رسید. در مورد آنچه که کرت تا به امروز فکر می کند - فراتر از تشکیل خانواده با دارن کریس بلین اندرسون - نویسنده این نظریه را مطرح کرد که امیدواریم شخصیت او در نقشی عالی در یک برند مد à la Miranda Priestly در The Devil Wears Prada باشد. یا می‌توانستم او را در تور با چپل روان ببینم که به او استایل می‌دهد.» Glee در ابتدا از سال 2009 تا 2015 در شبکه فاکس اجرا می‌شد و با کرت و بلین به عنوان ستاره‌های برادوی با یک نوزاد در راه، با شخصیت میشل، ریچل بری - که او نیز یک ستاره برادوی است - به عنوان جانشین آنها پایان یافت. این نمایش همچنان به عنوان یک نیروی در فرهنگ پاپ باقی مانده است، زیرا طرفداران به پخش آن ادامه می دهند، و بازیگران Glee همچنان با چهارمین بیشترین ورودی در Billboard Hot 100 هستند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P103M4CQ-e1794587294285.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۲ آبان • ۲۱:۲۰"}, {"source": "Billboard", "title": "Executive Turntable: Drew Wilson Named PRG CFO, TuneCore Elevates Tash Shah", "link": "https://www.billboard.com/lists/executive-turntable-drew-wilson-prg-tash-shah-tunecore/", "summary": "Production Resource Group has named Drew Wilson chief financial officer. Wilson joins from SoundCloud, where he served as chief operating and financial officer. In his new role, he will report directly to PRG’s CEO, Lawrence Burian . “Drew brings a tremendous depth of experience leading finance and operations across some of the most dynamic businesses in entertainment, media and music,” Burian said in a statement. “At PRG, our business and financial strategies are closely connected, and we are accelerating our investment in the very best people, technology, equipment and execution for our clients around the world. Drew understands the complexities of scaling creative businesses, and his leadership will be invaluable as we continue to strengthen PRG, expand our global capabilities and position the company for long-term growth. Wilson added, “In a world increasingly shaped by AI, shared live experiences are more valuable than ever, and PRG is at the center of them. The company’s global scale and the creativity of this team are what brought me here. I’m thrilled to join Lawrence and the leadership team in putting PRG’s uniquely talented people, technology and equipment behind the world’s biggest in-person moments and driving our next chapter of profitable growth.” — Ariel King See more music industry hires and promotions below. Tash Shah (TuneCore) TuneCore has named Tash Shah vp of global marketing. She will report to Brian Miller , the company’s chief business officer. Shah first joined TuneCore back in 2023, when she served as vp, international. “Independent artists who are already building an audience need more than a place to upload music,” Miller said in a statement. “They need a partner that helps them grow. Tash has spent three years understanding what those artists need, and she has the vision to make TuneCore the platform they choose to build their careers on. I’m excited to see her lead our global marketing team into this next chapter.” Shah added, “TuneCore has always been a space for artists to distribute their music, but we know their journey begins long before that moment and continues far beyond it. I ار خواهد گرفت. چاندرا باتناگار، مدیر اجرایی ACLU SoCal، گفت، آوا به میلیون ها نفر کمک کرده است تا با کار مداوم حفاظت از حقوق مدنی، گسترش فرصت ها و تقویت مشارکت دموکراتیک مشارکت کنند. مخصوصاً مناسب است که آوا را در [ ] جشن دوورنی در دسامبر جشن بگیریم. 9، در یک رویداد خصوصی در موزه ملی ژاپنی آمریکایی در لس آنجلس در آستانه روز حقوق بشر. این جایزه از کمک های خارق العاده او در پیشبرد حقوق مدنی، آزادی های مدنی و عدالت اجتماعی از طریق داستان سرایی تقدیر می کند. دوورنی گفت، به رسمیت شناخته شدن توسط ACLU کالیفرنیای جنوبی، اینجا در شهری که مرا بزرگ کرد، افتخاری عمیق است. از «سیزدهم» تا «چهاردهم» و پس از آن، من جذب داستان‌هایی شده‌ام که در قلب کار ناتمام دموکراسی ما زندگی می‌کنند. من این افتخار را به عنوان یادآوری می پذیرم که حقوقی که ما گرامی می داریم بیش از تحسین ما نیاز دارد. آنها مشارکت ما را می طلبند. و من قصد دارم به دادن مال خود ادامه دهم. در این شب یک نمایش ویژه از مستند جدید دوورنی از نتفلیکس، \"14th\" برگزار می شود و پس از آن گفتگو با فیلمساز و پذیرایی خصوصی انجام می شود. «چهاردهم» تاریخچه و اهمیت پایدار اصلاحیه چهاردهم را بررسی می‌کند و چگونگی تضمین شهروندی، حفاظت برابر و روند قانونی آن را به شکل‌دهی به دموکراسی ایالات متحده در حالی که با چالش‌های جدید در روزگار کنونی مواجه است، ردیابی می‌کند. این فیلم از طریق مصاحبه با مورخان، محققین حقوقی، رهبران منتخب، مدافعان و مفسران فرهنگی، بحث‌های معاصر در مورد حقوق مدنی، مهاجرت، حق رای و قدرت دولت را به اصلاحیه قانون اساسی مرتبط می‌کند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/GettyImages-2299441342.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۲۲ آبان • ۲۱:۰۰"}, {"source": "Billboard", "title": "Ye Lawsuit: Musician Says He Was Locked in Wyoming HS to Write ‘Nebuchadnezzar’ Opera", "link": "https://www.billboard.com/pro/kanye-west-opera-lawsuit-musician-alleges-locked-wyoming-hs/", "summary": "Ye (the artist formerly known as Kanye West ) is facing a new lawsuit that claims an opera musician was locked inside a Wyoming high school band  منفی مواجه شد (لس آنجلس تایمز آن را", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2303590348-e1794586174885.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۲۰:۱۴"}, {"source": "Billboard", "title": "Bono Says Dolly Parton ‘Sang Herself to Some Other Place’ on the New U2 Song ‘Torn’: ‘It Feels Like a Prayer … For America’", "link": "https://www.billboard.com/music/rock/bono-dolly-parton-u2-torn-prayer-america-kimmel-watch-1236381702/", "summary": "In life, Dolly Parton always looked for ways to bring people together. In death, it seems, her work carries on. The members of U2 sat on the Jimmy Kimmel Live! couch on Thursday night (Nov. 12) to discuss their new album , Carnaval de Luz , whose final track, Torn , features the last-ever vocals recorded by Parton, who died at 80 on Aug. 25 after a brief battle with cancer. Is there anyone else that the whole world is going to agree upon other than Dolly?, Bono said about the universal outpouring of love and devotion that followed Parton s passing earlier this year. Dolly Parton is a mythical figure who actually existed recently, he continued. And our hearts are broken by this, but we are also blessed to be given her last vocal. Bono said the group very much wanted to work with Parton and they pitched her a few ideas, including a kind of folky thing called Lifelong that he described as a dizzy, drunken marriage song. Dipping into his best/worst Tennessee accent, Bono said Parton told the group that it was perhaps, a little too Irish for me if that s okay.' Instead, Parton said she had a song she d started and was happy to let U2 tinker, adding that she was excited to see where they d take it. The implication here, of course, is, if I don t like where you take it, it will never see the light of day,' Bono said of Parton s thrown gauntlet. Guitarist The Edge said it was a real shock that Parton was willing to put her musical destiny in their hands because they
