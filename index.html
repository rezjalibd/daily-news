<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۲ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۲ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۳ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۰۲:۴۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۵۲</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۸۹</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۵۶</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

صره دریایی آمریکا داشته است، را رد کرد و گفت هیچ مقام رسمی صحت اجرای چنین طرحی در یکی دو روز اخیر را تأیید نکرده بود. دور دوم محاصره آمریکا علیه بنادر ایرانی از اواخر تیرماه و در پی حملات ایران به چند نفتکش در تنگه هرمز و فروپاشی تفاهم‌نامه اسلام‌آباد آغاز شد. وزارت خزانه‌داری آمریکا از شهریور ماه نیز طرح تشدید تحریم‌ها علیه ایران را با عنوان «عملیات طرد اقتصادی» آغاز کرد. دونالد ترامپ در گفت‌وگوی روز یکشنبه با تری ینگست، خبرنگار فاکس نیوز، خبر داد تماس‌ها و گفت‌وگوها بین واشینگتن و تهران همچنان به‌طور غیرمستقیم ادامه دارد، اما مقام‌های ایرانی را به «رقصندگان حرفه‌ای» تشبیه کرد و افزود: «آن‌ها مدام حرف می‌زنند. تنها کاری که می‌کنند حرف زدن", "image_url": "https://gdb.rferl.org/801bf561-2108-4f26-87f5-5c130fe885e8_cx0_cy1_cw0_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۱ آذر • ۲۲:۱۹"}, {"source": "Euronews Persian", "title": "رشد ۴.۵٪ اقتصاد اسرائیل در میانه جنگ؛ اروپا از جهش فناوری اسرائیل چه می‌آموزد؟", "link": "https://parsi.euronews.com/2026/11/22/israel-is-set-to-become-the-worlds-25th-largest-economy-what-can-europe-learn-from-its-tec", "summary": "صندوق بین‌المللی پول می‌گوید اقتصاد مبتنی بر فناوری اسرائیل تا ۲۰۲۶ و با وجود سال‌ها جنگ، از سوئد و ایرلند پیشی گرفته و به بیست‌وپنجمین اقتصاد بزرگ جهان بدل می‌شود. سیاستمداران اروپایی و اسرائیلی این هفته در اورشلیم درباره روابط نزدیک‌تر و الگوی نوآوری آن گفت‌وگو می‌کنند؛ اروپا چه می‌تواند بیاموزد؟", "date_str": "2026-11-22T17:34:57+00:00", "hash": "7c3018505c99c3e8", "title_fa": "رشد ۴.۵٪ اقتصاد اسرائیل در میانه جنگ؛ اروپا از جهش فناوری اسرائیل چه می‌آموزد؟", "summary_fa": "صندوق بین‌المللی پول می‌گوید اقتصاد مبتنی بر فناوری اسرائیل تا ۲۰۲۶ و با وجود سال‌ها جنگ، از سوئد و ایرلند پیشی گرفته و به بیست‌وپنجمین اقتصاد بزرگ جهان بدل می‌شود. سیاستمداران اروپایی و اسرائیلی این هفته در اورشلیم درباره روابط نزدیک‌تر و الگوی نوآوری آن گفت‌وگو می‌کنند؛ اروپا چه می‌تواند بیاموزد؟", "image_url": "https://images.euronews.com/articles/stories/10/00/34/64/1200x675 e_fa": "۱ آذر • ۱۹:۰۸"}, {"source": "BBC Persian", "title": "کاپ ۳۱؛ اختلاف نظر بر سر سوخت‌های فسیلی مانع از توافق در اجلاس تغییرات اقلیمی شد", "link": "https://www.bbc.com/persian/articles/cme39qrr62z0o?at_medium=RSS&at_campaign=rss", "summary": "اجلاس تغییرات اقلیمی سازمان ملل متحد، کاپ ۳۱، در آنتالیای ترکیه دو روز پس از موعد بدون دستیابی به توافق به پایان می‌رسد؛ اتحادیه اروپا و برخی دیگر از طرف‌ها با پیش‌نویس نهایی مخالفت کردند، زیرا که در آن هیچ اشاره‌ای به ضرورت حذف تدریجی سوخت‌های فسیلی، که عامل اصلی گرمایش جهانی هستند، نشده بود.", "date_str": "2026-11-22T15:43:55+00:00", "hash": "84e92a9a5125e935", "title_fa": "کاپ ۳۱؛ اختلاف نظر بر سر سوخت‌های فسیلی مانع از توافق در اجلاس تغییرات اقلیمی شد", "summary_fa": "اجلاس تغییرات اقلیمی سازمان ملل متحد، کاپ ۳۱، در آنتالیای ترکیه دو روز پس از موعد بدون دستیابی به توافق به پایان می‌رسد؛ اتحادیه اروپا و برخی دیگر از طرف‌ها با پیش‌نویس نهایی مخالفت کردند، زیرا که در آن هیچ اشاره‌ای به ضرورت حذف تدریجی سوخت‌های فسیلی، که عامل اصلی گرمایش جهانی هستند، نشده بود. مراد کوروم، وزیر محیط زیست ترکیه و رئیس اجلاس کاپ ۳۱، اعلام کرد که این توافق‌نامه تصویب نشد؛ موضوعی که به گفته ازمی استالارد، خبرنگار بی‌بی‌سی که در اجلاس آنتالیا حضور دارد، نشان‌دهنده یک تحول تقریبا بی‌سابقه است. آقای کوروم گفت که پس از ناکامی پیش‌نویس چهارم در دستیابی به توافق میان هیئت‌ها، پیش‌نویس جدیدی برای توافق اقلیمی ارائه نخواهد شد. کریس بوون، وزیر استرالیایی و یکی از میزبانان مشترک این اجلاس، گفت که برخی طرف‌ها تهدید کردند در صورت گنجاندن موضوع سوخت‌های فسیلی، میز مذاکره را ترک خواهند کرد، در حالی که گروهی دیگر خواستار گنجاندن آن بودند. آقای بوون گفت که این اجلاس با «پیچیده‌ترین و پرتنش‌ترین فضای ژئوپلیتیک در دوران اخیر» روبرو بوده است. دارا اوبراین، رئیس هیئت نمایندگی اتحادیه اروپا در این اجلاس، برخی کشورهای نفت‌خیز و تولیدکنندگان سوخت‌های فسیلی را متهم کرد که مذاکرات در ترکیه را «به گروگان گرفتند»؛ زیرا که در چهارمین پیش‌نویس توافق نیز هیچ اشاره‌ای به سوخت‌های فسیلی نشده بود. برخی کشورهای عربی ابراز داشته‌اند که با حسن نیت همچنان در گفتگوها مشارکت خواهند کرد. روسیه ضمن دفاع از مخالفت خود با گنجاندن تعهدی برای گذار از سوخت‌های فسیلی، در سخنرانی‌اش مستقیما از اتحادیه اروپا انتقاد کرد. میاتا فان‌بوله، وزیر انرژی بریتانیا، گفت که عدم موفقیت مذاکرات در «ایجاد اجماع» میان طرفین، «مایوس‌کننده» است. علاوه بر بریتانیا، کشورهای دیگر هم اعلام کردند که از پیش‌نویس ارائه‌شده در این اجلاس توسط میزبانان مشترک، ترکیه و استرالیا، عمیقا مایوس و سرخورده شده‌اند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/1dd0/live/0d5c1260-e686-11f1-a094-5fdc692f3e33.jpg", "category": "هوش مصنوعی مولد", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱ آذر • ۱۹:۱۳"}, {"source": "Euronews Persian", "title": "کاوشگر «بپی‌کلمبو» پس از هشت سال وارد مدار سیاره عطارد شد", "link": "https://parsi.euronews.com/2026/11/22/the-bepicolombo-space-probe-has-entered-mercurys-orbit-after-an-eight-year-journey", "summary": "این مأموریت با هدف مطالعهٔ همهٔ جنبه‌های سیاره عطارد انجام می‌شود تا به دانشمندان کمک کند این سیاره و روند تکامل منظومهٔ شمسی‌مان را بهتر درک کنند.", "date_str": "2026-11-22T15:28:29+00:00", "hash": "ef01a6fdd9714c6d", "title_fa": "کاوشگر «بپی‌کلمبو» پس از هشت سال وارد مدار سیاره عطارد شد", "summary_fa": "این مأموریت با هدف مطالعهٔ همهٔ جنبه‌های سیاره عطارد انجام می‌شود تا به دانشمندان کمک کند این سیاره و روند تکامل منظومهٔ شمسی‌مان را بهتر درک کنند.", "image_url": "https://images.euronews.com/articles/stories/10/00/34/85/1200x675_cmsv2_8d959ab9-579e-58ed-9907-ccbb77f4f2f1-10003485.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱ آذر • ۱۸:۵۸"}, {"source": "IranWire", "title": "اتحادیه عرب حمله جمهوری اسلامی به بحرین را محکوم کرد", "link": "https://iranwire.com/fa/news-1/160594-%D8%A7%D8%AA%D8%AD%D8%A7%D8%AF%DB%8C%D9%87-%D8%B9%D8%B1%D8%A8-%D8%AD%D9%85%D9%84%D9%87-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D8%A8%D9%87-%D8%A8%D8%AD%D8%B1%DB%8C%D9%86-%D8%B1%D8%A7-%D9%85%D8%AD%DA%A9%D9%88%D9%85-%DA%A9%D8%B1%D8%AF/", "summary": "اتحادیه عرب و دولت‌های عربستان سعودی، امارات متحده عربی و قطر، حمله جمهوری اسلامی به یک تاسیسات صنعتی غیرنظامی در بحرین را محکوم کردند و ...", "date_str": "2026-11-22T15:10:33+00:00", "hash": "eddd51f77a8727ec", "title_fa": "اتحادیه عرب حمله جمهوری اسلامی به بحرین را محکوم کرد", "summary_fa": "اتحادیه عرب و دولت‌های عربستان سعودی، امارات متحده عربی و قطر، حمله جمهوری اسلامی به یک تاسیسات صنعتی غیرنظامی در بحرین را محکوم کردند و ... اتحادیه عرب یک‌شنبه اول آذر ۱۴۰۵، در بیانیه‌ای اعلام کرد این حمله نقض حاکمیت بحرین و قوانین بین‌المللی است و می‌تواند به افزایش تنش‌ها در منطقه منجر شود. این اتحادیه با اعلام همبستگی با دولت و مردم بحرین، از اقدامات این کشور برای حفاظت از امنیت و تمامیت ارضی خود حمایت کرد و از جامعه بین‌المللی خواست با محکوم کردن حمله و تلاش برای توقف اقدامات تنش‌زا، مانع گسترش بحران و تهدید صلح منطقه‌ای شود. وزارت خارجه عربستان نیز حملات ایران به بحرین را به «شدیدترین لحن ممکن» محکوم کرد و در بیانیه‌ای در شبکه اجتماعی ایکس، بر همبستگی کامل ریاض با بحرین در اقدامات این کشور برای حفظ امنیت و ثبات تاکید کرد. این وزارتخانه همچنین تهران را به تضعیف امنیت و ثبات منطقه‌ای متهم کرد. وزارت خارجه امارات متحده عربی نیز حملات اخیر را نقض آشکار حاکمیت بحرین خواند و بر حمایت کامل خود از این کشور و تمامی اقدامات آن برای حفظ امنیت و ثبات تاکید کرد. قطر هم در بیانیه‌ای جداگانه، حمله ایران به یک تاسیسات صنعتی غیرنظامی در بحرین را محکوم کرد و مخالفت قاطع خود با حملات به تاسیسات اقتصادی، اماکن غیرنظامی و غیرنظامیان را اعلام کرد. وزارت خارجه قطر هشدار داد ادامه این حملات به تشدید خطرناک تنش‌ها منجر می‌شود و امنیت و ثبات منطقه را تهدید می‌کند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/image_RlPq__v1024x512__box_0%2C311%2C576%2C614.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱ آذر • ۱۸:۴۰"}, {"source": "Iran International", "title": "بارسلونا ۳-۲ ویارئال؛ کامبک بارسا در نی که به گفته او «قصد بر هم زدن نظم عمومی و تحریک احساسات مردم را داشته باشند»، برخورد «قاطع» خواهد شد. بعدازظهر سه‌شنبه ۲۶ آبان ۱۴۰۵، صدها نفر در آبدانان در اعتراض به جان‌باختن ۱۳ کارگر در واژگونی اتوبوس کارکنان پتروپالایش دهلران تجمع کردند. معترضان با سردادن شعارهایی علیه مقام‌های حکومتی، به وضعیت جاده‌ها، کمبود زیرساخت‌ها در استان ایلام و سوء مدیریت اعتراض کردند. بخش بزرگی از بازار آبدانان نیز در همراهی با معترضان و خانواده‌های جان‌باختگان اعتصاب کرد. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/WhatsApp_Image_2026-11-22_at_9.26.29_AM_MWDf__v1024x512__box_0%2C52%2C1300%2C736.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱ آذر • ۱۸:۰۷"}, {"source": "Independent Persian", "title": "قمار پرمخاطرهٔ ایران در خلیج فارس؛ نفتکش‌ها در مسیر تقابل با نیروی دریایی آمریکا", "link": "https://www.independentpersian.com/node/423307/%D8%AF%DB%8C%D8%AF%DA%AF%D8%A7%D9%87/%D9%82%D9%85%D8%A7%D8%B1-%D9%BE%D8%B1%D9%85%D8%AE%D8%A7%D8%B7%D8%B1%D9%87%D9%94-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%AF%D8%B1-%D8%AE%D9%84%DB%8C%D8%AC-%D9%81%D8%A7%D8%B1%D8%B3%D8%9B-%D9%86%D9%81%D8%AA%DA%A9%D8%B4%E2%80%8C%D9%87%D8%A7-%D8%AF%D8%B1-%D9%85%D8%B3%DB%8C%D8%B1-%D8%AA%D9%82%D8%A7%D8%A8%D9%84-%D8%A8%D8%A7-%D9%86%DB%8C%D8%B1%D9%88%DB%8C-%D8%AF%D8%B1%DB%8C%D8%A7%DB%8C%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7", "summary": "جمهوری اسلامی ایران خود را برای اقدامی احتمالی آماده می‌کند تا محاصرهٔ دریایی آمریکا علیه صادرات نفتش را بشکند. بر اساس این طرح، قرار است کاروانی از بیش از ۱۴ نفتکش از تنگهٔ هرمز عبور کند؛ اقدامی که می‌تواند به رویارویی با نیروی دریایی آمریکا بینجامد و چه بسا حملات ایران به تأسیسات انرژی در سراسر خلیج فارس را در پی داشته باشد. بر اساس اطلاعاتی که دستگاه‌های اطلاعاتی غرب طی روزهای اخیر جمع‌آوری کرده‌اند، ایران در حال آماده‌سازی این کشتی‌ها برای خروج از خلیج فارس و ورود به دریای عمان است. مقصد نهایی این کشتی‌هایی ظاهراً ause the standard Frame has b", "date_str": "2026-11-22T16:31:01+00:00", "hash": "19de4227980e8cd8", "title_fa": "بهترین تلویزیون‌های قاب هنری 2026: سامسونگ، هایسنس و TCL چگونه با هم مقایسه می‌شوند؟", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید تلویزیون‌های هنری، مانند قاب سامسونگ و فریم پرو، به گونه‌ای طراحی شده‌اند که وقتی به عنوان تلویزیون از آن استفاده نمی‌کنید، شبیه نقاشی‌های آویزان به نظر می‌رسند. Steven Cohen/Business Inside تلویزیون‌های برتر وقتی واقعاً در حال تماشای محتوا هستید شگفت‌انگیز به نظر می‌رسند، اما وقتی آنها را خاموش می‌کنید - خوب، این داستان متفاوت است. اکثر تلویزیون‌ها اساساً مستطیل‌های بزرگ مشکی هستند که فضای دیوار را اشغال کرده و در اتاق شما بیرون می‌آیند. این مشکلی است که سامسونگ هنگام عرضه Frame در سال 2017 تصمیم به حل آن گرفت و دلیل بزرگی برای محبوبیت تلویزیون های فریم سبک است. بهترین تلویزیون‌های قاب به‌گونه‌ای ساخته شده‌اند که به‌عنوان قطعات طراحی عمل کنند و در عین حال تمام ویژگی‌هایی را که از یک نمایشگر هوشمند مدرن انتظار دارید ارائه می‌دهند. آنها دارای صفحه نمایش های ضد تابش هستند که ظاهر بوم را تقلید می کنند، پایه های باریکی دارند که نزدیک به دیوار قرار می گیرند و از قاب های قابل تعویض برای ظاهری سفارشی تر پشتیبانی می کنند. وقتی تماشای تلویزیون را تمام کردید، آنها می توانند به جای آن نقاشی ها، عکاسی و سایر هنرهای دیجیتال را طی کنند. سامسونگ همچنان در رده ای که به ایجاد آن کمک کرده است پیشتاز است، اما برندهایی مانند Hisense، TCL، Amazon، LG و Walmart نیز جایگزین های هنری خود را ارائه می دهند. من چند سال گذشته را صرف آزمایش چندین نسخه از قاب سامسونگ کرده ام، از جمله فریم استاندارد و فریم پرو رده بالا. من همیشه از طراحی سامسونگ قدردانی کرده‌ام، اما می‌خواستم ببینم رقابت چگونه پیش می‌رود. آیا گزینه‌هایی مانند Hisense CanvasTV، TCL NXTVISION TV، و Amazon Ember Artline TV واقعاً همان حس گالری را بدون برش دادن به", "image_url": "https://i.insider.com/6b030fe573f126f9eccb951b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آذر • ۲۰:۰۱"}, {"source": "Business Insider", "title": "I tried onion rings from Burger King, Dairy Queen, and Sonic. One chain was the clear winner.", "link": "https://www.businessinsider.com/best-onion-rings-fast-food-chain-comparison-winner-2026-11", "summary": "I tried onion rings from three popular fast-food chains: Burger King, Dairy Queen, and Sonic. Ted Berg I ordered onion rings from Burger King, Dairy Queen , and Sonic to find the best fast-food option. I wasn't impressed by Sonic's onion rings, and the ones at Burger King were mostly breading. Ultimately, Dairy Queen was the clear winner, with a crunchy onion ring that was packed with flavor. Whenever I enter a fast-food restaurant , there's always one question lingering in the back of my mind: Should I get french fries or onion rings? Although french fries are a great side to any fast-food meal, onion rings can be a delicious alternative — if they're done right. Usually, I can tell how decent fries will be just by looking at them, but there's more uncertainty with onion rings. How crunchy is the batter? Will the onion inside add flavor and texture, or will it simply slither out of its breading on the first bite? So, I found fast-food chains near me that had onion rings on the menu — Dairy Queen, Sonic, and Burger King — and set out to see which served the best version of the side. I started at Dairy Queen. Ted Berg The first fast-food chain I went to was Dairy Queen, a restaurant founded as an ice-cream shop that now has over 7,800 locations worldwide. Because there are no Dairy Queen locations in New York City , where I live, I went to a DQ Grill Chill in Middletown, New York, instead, which features a full menu in addition to the chain's trademark desserts. I ordered a \"regular\" size of onion rings — the smallest on the menu — which cost almost $5 and included eight fairly hearty-looking rings stacked neatly into a cardboard container. They were served piping hot and were lightly greasy. I loved the texture of Dairy Queen s onion rings. Ted Berg The onion rings at Dairy Queen had a pronounced crunch to the outer breading, which was mildly salty. The texture was great: the onions inside weren't slimy, and the batter clung nicely when I bit into them. There was a hint of sweetness to the onions as well. In general, these seemed surprisingly upscale for a fast-food onion ring — on par with something you might get at a decent pub, where you'd spend way more than $5 for them. Next, I visited Sonic. Ted Berg To continue my hunt for the best fast-food onion ring, I went to Sonic, a chain known for its slushies, burgers, and retro drive-in style. The chain has over 3,000 locations across the US, including one that's about a 15-minute bike ride from my New York ", "date_str": "2026-11-22T16:18:01+00:00", "hash": "5e7cafba76da8db7", "title_fa": "من حلقه های پیاز را از Burger King، Dairy Queen و Sonic امتحان کردم. یک زنجیره برنده آشکار بود.", "summary_fa": "من حلقه‌های پیاز را از سه زنجیره محبوب فست فود امتحان کردم: Burger King، Dairy Queen و Sonic. تد برگ اول حلقه های پیاز را از Burger King، Dairy Queen و Sonic سفارش داد تا بهترین گزینه فست فود را پیدا کند. حلقه‌های پیاز سونیک تحت تأثیر قرار نگرفتم و حلقه‌های برگر کینگ بیشتر نان می‌زدند. در نهایت، Dairy Queen با یک حلقه پیاز ترد که مملو از طعم بود، برنده واضح بود. هر زمان که وارد یک رستوران فست فود می شوم، همیشه یک سوال در ذهن من وجود دارد: آیا سیب زمینی سرخ کرده یا پیاز حلقه ای تهیه کنم؟ اگرچه سیب زمینی سرخ شده یک طرف عالی برای هر وعده غذایی فست فودی است، حلقه های پیاز می توانند جایگزین خوشمزه ای باشند – اگر درست تهیه شوند. معمولاً می توانم فقط با نگاه کردن به سیب زمینی سرخ شده بفهمم که چقدر خوب است، اما عدم اطمینان بیشتر در مورد حلقه های پیاز وجود دارد. خمیر چقدر ترد است؟ آیا پیاز داخل طعم و بافت می‌دهد یا به سادگی در اولین لقمه از حالت نان خارج می‌شود؟ بنابراین، من زنجیره‌های فست فود را در نزدیکی خود پیدا کردم که حلقه‌های پیاز در منو داشتند - Dairy Queen، Sonic، و Burger King - و تصمیم گرفتم ببینم کدام یک بهترین نسخه از غذا را ارائه می‌کنند. من از Dairy Queen شروع کردم. تد برگ اولین فست فود زنجیره ای که به آن رفتم Dairy Queen بود، رستورانی که به عنوان یک بستنی فروشی تاسیس شد و اکنون بیش از 7800 مکان در سراسر جهان دارد. از آنجایی که هیچ مکان Dairy Queen در شهر نیویورک، جایی که من زندگی می کنم، وجود ندارد، به جای آن به یک DQ Grill Chill در میدل تاون، نیویورک رفتم، که علاوه بر دسرهای علامت تجاری زنجیره، منوی کاملی دارد. من", "image_url": "https://i.insider.com/6afe05dc73f126f9eccb7f5a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آذر • ۱۹:۴۸"}, {"source": "Business Insider", "title": "I've traveled to over 100 countries. I'd recommend these 5 destinations for a festive holiday trip.", "link": "https://www.businessinsider.com/best-cities-to-visit-for-holidays-christmas-winter-travel-2026-11", "summary": "One of my favorite destinations to visit during the holiday season is Bolzano, which is home to a historic Christmas market. Kaitlyn Rosati I'm a frequent solo traveler who loves the holiday season. After traveling to 100 countries , there are a few destinations I love visiting around Christmas. My favorite Christmas market is in Italy, and I think winter is an underrated time to visit Tokyo. I have been solo traveling for a decade, and if there's one thing I love more than traveling alone, it's traveling during the holidays . What can I say? I'm a big kid at heart who loves all things merry and bright. Christmas has always been one of my favorite times of the year, not just because of holiday cheer, but because it provides a unique way to learn about destinations and cultures around the globe. If you're like me and want an epic festive holiday trip, after years of field research, here are five destinations that do it best, from someone who's traveled around the globe. Rovaniemi, Finland, is a winter wonderland. captiontk Kaitlyn Rosati When I first started solo traveling, I was enamored with the idea of sleeping in an igloo at the Arctic Circle. Pair that with my love for the holidays, and it was a no-brainer to book a flight to Rovaniemi, Finland, for December, where the airport has a welcome sign that reads, \"Santa's Official Home Airport.\" Rovaniemi really is a winter wonderland: Here, you can ride a husky-led sled, visit a reindeer farm, and even meet the man himself at Santa Claus Village. It's home to Santa Claus' Post Office, a real running postal service. Though I arrived by plane, there's also the Santa Claus Express , a 12-hour overnight sleeper train from Helsinki to Rovaniemi that zips through the snow-capped Finnish countryside. If you're lucky, you might even catch sight of the northern lights — the Arctic Circle is one of the best places in the world to see them. Christmas in Tokyo might not be a traditional choice, but it s one of the most fun. captiontk Kaitlyn Rosati Although Christmas isn't a designated national holiday in Japan, Tokyo still goes big. Throughout the months of November and December, holiday markets pop-up all around the city, with some offering that European market feel. The Roppongi Hills Christmas Market, for example, offers rows and rows of sparkling lights which perfectly frame the Tokyo Tower. On the fourth floor of Tokyo Skytree, you can visit a Christmas market that feels like one you'd find in Austria or Germany:", "date_str": "2026-11-22T16:09:01+00:00", "hash": "dc6ab52c363bd721", "title_fa": "من به بیش از 100 کشور سفر کرده ام. من این 5 مقصد را برای یک سفر تعطیلات جشن توصیه می کنم.", "summary_fa": "یکی از مقاصد مورد علاقه من برای بازدید در فصل تعطیلات بولزانو است که بازار تاریخی کریسمس را در خود جای داده است. Kaitlyn Rosati من یک مسافر انفرادی مکرر هستم که عاشق فصل تعطیلات هستم. پس از سفر به 100 کشور، چند مقصد وجود دارد که دوست دارم در حوالی کریسمس از آنها دیدن کنم. بازار کریسمس مورد علاقه من در ایتالیا است و فکر می کنم زمستان زمان دست کم گرفته شده ای برای بازدید از توکیو است. من یک دهه است که به تنهایی سفر می کنم، و اگر چیزی وجود دارد که بیشتر از سفر به تنهایی دوست دارم، آن سفر در تعطیلات است. چه بگویم؟ من در قلب بچه بزرگی هستم که همه چیز شاد و درخشان را دوست دارم. کریسمس همیشه یکی از زمان‌های مورد علاقه من در سال بوده است، نه فقط به دلیل شادی تعطیلات، بلکه به این دلیل که راهی منحصر به فرد برای یادگیری مقاصد و فرهنگ‌های سراسر جهان است. اگر شما هم مانند من هستید و می خواهید یک سفر تعطیلات جشن حماسی داشته باشید، پس از سال ها تحقیق میدانی، در اینجا پنج مقصدی که این کار را به بهترین شکل انجام می دهند، از طرف شخصی که به سراسر جهان سفر کرده است، آورده شده است. رووانیمی، فنلاند، سرزمین عجایب زمستانی است. captiontk کیتلین روزاتی وقتی برای اولین بار سفر انفرادی را شروع کردم، شیفته این بودم که در یک ایگلو در دایره قطب شمال بخوابم. این را با عشق من برای تعطیلات جفت کنید، و رزرو پرواز به رووانیمی، فنلاند، برای ماه دسامبر، جایی که فرودگاه دارای تابلوی خوشامدگویی است که روی آن نوشته شده است، \"فرودگاه رسمی خانه بابا نوئل\"، بی خیال بود. رووانیمی واقعاً یک سرزمین عجایب زمستانی است: در اینجا، می‌توانید سوار سورتمه‌های هاسکی شوید، از مزرعه گوزن شمالی بازدید کنید و حتی", "image_url": "https://i.insider.com/6afdda0ed6c5d341c9b4a875?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آذر • ۱۹:۳۹"}, {"source": "Business Insider", "title": "A couple in their 50s spent $1 million building their forever home. It has a gym, pool, and aging-in-place features.", "link": "https://www.businessinsider.com/couple-50s-built-million-dollar-home-aging-in-place-2026-11", "summary": "Carla and Tony Stamper built their dream house. Mike Belleme for BI In 2022, Tony and Carla Stamper were on the cusp of becoming empty nesters . At the time, Tony, 55, and Carla, 54, lived in the North Carolina home where they had raised their four kids for about a decade. As their youngest was preparing for college and they began thinking about retirement, they wondered whether it was time to move. First, they looked at condos, thinking they might want something low maintenance so they could focus on travel . \"It didn't take us too long to figure out that's just not something that's conducive to what we like,\" Carla, a content creator, told Business Insider about herself and her husband Tony, a construction manager in the commercial industry. \"We like to work outside, and we like projects.\" The more they talked, the more they wondered if it were time to bring to life a dream they'd had for almost the entirety of their 30-year marriage: building a forever home. The Stampers wanted to create a space they could grow old in as they look toward retirement, which they plan to do in 2029, and beyond. Business Insider's Retirement, Remodeled series takes readers inside the homes people are transforming for their retirement years, from practical aging-in-place upgrades to major overhauls. Reach out to Samantha Pettyjohn to share your renovation story. The Stampers decided to build their dream house instead of downsizing. Mike Belleme for BI Because of Tony's work in construction, building a home was always something the Stampers spoke about, with Carla describing it as a \"pipe dream\" for much of their marriage. When they realized it would be financially feasible to build their home with the proceeds from the sale of their house and a loan, it felt like fate. \"We were like, 'This is our time. Our kids are grown. They're almost out of the house. Let's do it,'\" Carla said. \"And I wasn't getting any younger,\" Tony agreed. \"It was going to be now or never.\" In May 2022, they bought an acre of land in Fort Mill, South Carolina, for $110,000, giving them a suburban environment and an easy commute to Charlotte, North Carolina . The Stampers liked the idea of living somewhere that balanced a quiet feel with proximity to a city. They wanted their home to serve them now and down the line. Mike Belleme for BI Carla and Tony intended for their new house to be their forever home, where they could entertain their children and two grandchildren, and age in place s e-storage-usage/", "summary": "Apple Intelligence has a lot of neat tricks, but you might prefer to disable them if you need every bit of free space possible.", "date_str": "2026-11-22T15:45:00+00:00", "hash": "ff00e6e2e5e0ede9", "title_fa": "Apple Intelligence چقدر در آیفون شما استفاده می کند؟", "summary_fa": "Apple Intelligence ترفندهای منظمی دارد، اما اگر به هر ذره فضای خالی ممکن نیاز دارید، ممکن است ترجیح دهید آنها را غیرفعال کنید. امکانات Apple Intelligence هزینه ذخیره سازی بالایی دارد. Primakov/Shutterstock افزودن Engadget در Google: منبع ترجیحی Google Discover Apple Intelligence به‌روزرسانی‌ها و بهبودهای قابل توجهی را با iOS 27 دریافت کرد و همه آن ویژگی‌های جدید فضای بسیار زیادی را در تلفن شما اشغال می‌کنند. برای کسانی که علاقه ای به استفاده از Apple Intelligence ندارند، یا نمی خواهند حجم زیادی از فضای ذخیره سازی را کنار بگذارند، راهی برای بازپس گیری آنچه که به روز رسانی خورده است وجود دارد. این فراتر از غیرفعال کردن ویژگی‌های هوشمند Apple iPhone شماست، اما تنها چند دقیقه طول می‌کشد تا از بین برود. میزان دقیق فضایی که Apple Intelligence در iOS 27 اشغال می کند جهانی نیست. طبق گفته‌های اپل، در iPhone Duo، iPhone Air و iPhone 17 Pro یا جدیدتر تا 14 گیگابایت و در سایر مدل‌های آیفون سازگار به 8 گیگابایت نیاز دارد. با این حال، برخی از افراد گزارش داده اند که این ویژگی ها بین 9 تا 16 گیگابایت را اشغال می کند. برای کسانی که تنها 128 گیگابایت فضای ذخیره سازی دارند، این بیش از 12 درصد فضای شما را چیزی اشغال می کند که حتی ممکن است نخواهید از آن استفاده کنید. در iOS 27، غیرفعال کردن Apple Intelligence به سادگی چرخاندن یک ضامن مانند قبل نیست. حتی اگر ویژگی‌های مختلف را خاموش کنید، iOS آنها را در صورت تغییر نظر نگه می‌دارد. با این حال، Apple Intelligence تنها زمانی کار می کند که زبان دستگاه شما و زبان سیری روی یک گزینه تنظیم شده باشند. بنابراین برای بازگرداندن فضای خود، باید زبان سیری را تغییر دهید در حالی که زبان آیفون خود را یکسان می‌گذارید: به تنظیمات، سپس سیری بروید و زبان را", "image_url": "https://www.engadget.com/img/gallery/how-much-storage-does-apple-intelligence-use-on-your-iphone/l-intro-1794596549.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple"], "datetime_fa": "۱ آذر • ۱۹:۱۵"}, {"source": "Business Insider", "title": "I bought my first rental property at 23. Now I own 12 homes and make enough money to quit my day job.", "link": "https://www.businessinsider.com/bought-12-rental-properties-make-money-to-quit-day-job-2026-11", "summary": "Ryan Chaw outside one of his properties in Stockton, California. Courtesy of Ryan Chaw Real estate investor Ryan Chaw bought his first property at 23. He eventually earned enough rental income to quit his job as a pharmacist in 2023. Chaw expanded outside his home state of California, and hopes to keep buying more homes. This as-told-to essay is based on a conversation with Ryan Chaw, a 34-year-old who quit his job as a pharmacist and now lives off rental income from his 12 properties. Chaw, who lives in Sacramento, California, bought his first property at 23 years old and rented it out by the room. The following has been edited for length and clarity. Early in life, I realized that investing in real estate was the best way to create generational wealth. My grandpa bought a set of flats in the San Francisco Bay Area, and not only was he able to retire early , but he also was able to support me and my brother through college. Back in the 1950s, the properties were dirt cheap, but as time went on, those properties went up in value tremendously, and the rents went up as well. When my parents eventually sold my grandpa's properties after he passed away, they sold them for about $3.6 million. That was more money than they made in their entire lives. They worked 40 hours a week, essentially, for 30 years while this single set of flats in San Francisco sat for the same amount of time, and they made more with the flats. It put things into perspective for me: work smarter, not harder. So I became obsessed with that concept, and I had a really good example. Still, it was scary to dive into real estate investing . It's intimidating to get into something you've never done before and know nothing about. I wasn't taking much action on buying a house. I was talking about buying rentals a lot, and my dad called me out and said, \"Hey Ryan, you seem to be talking about rentals, but I haven't seen you even contact a real estate agent yet. Isn't that the first step?\" I remember at the time I kind of got angry, more at myself. That same day, I called a real estate agent, drove down to Stockton, California, which is about an hour away from me, and saw three or four properties. I put an offer on one of the properties that same day. I didn't know what I was doing. It was a $262,000 house, but I put down $100,000 for my down payment because I didn't know that the normal down payment people put down is 20%. Chaw outside his first rental home in Stockton, California. Courtesy of Rya", "date_str": "2026-11-22T15:22:01+00:00", "hash": "f69b3a44a49d19c5", "title_fa": "من اولین ملک اجاره ای خود را در 23 سالگی خریدم. اکنون 12 خانه دارم و آنقدر پول دارم که بتوانم کار روزانه ام را رها کنم.", "summary_fa": "رایان چاو در خارج از یکی از املاک خود در استاکتون، کالیفرنیا. با حسن نیت از رایان چاو، سرمایه گذار املاک و مستغلات، رایان چاو اولین ملک خود را در 23 سالگی خرید. او در نهایت درآمد کافی از اجاره به دست آورد تا شغل خود را به عنوان داروساز در سال 2023 ترک کند. چاو به خارج از ایالت زادگاهش کالیفرنیا گسترش یافت و امیدوار است به خرید خانه های بیشتری ادامه دهد. این مقاله گفته شده بر اساس گفتگو با رایان چاو، 34 ساله ای است که شغل خود را به عنوان داروساز ترک کرد و اکنون از درآمد اجاره 12 ملک خود زندگی می کند. چاو که در ساکرامنتو، کالیفرنیا زندگی می کند، اولین ملک خود را در 23 سالگی خرید و آن را در کنار اتاق اجاره کرد. موارد زیر برای طول و وضوح ویرایش شده است. در اوایل زندگی، متوجه شدم که سرمایه گذاری در املاک و مستغلات بهترین راه برای ایجاد ثروت نسلی است. پدربزرگ من یک مجموعه آپارتمان در منطقه خلیج سانفرانسیسکو خرید و نه تنها توانست زودتر بازنشسته شود، بلکه توانست از من و ب ake the dip, which feeds about 10 people, you'll need: A 6-quart slow cooker or Crock-Pot A rotisserie chicken (or 1 lb of cooked chicken) 12 fluid ounces Frank's RedHot Buffalo sauce ½ cup ranch dressing 16-ounce cream cheese 1 cup shredded cheddar cheese 1 cup shredded mozzarella cheese Salt, pepper, garlic powder I always start by separating the breasts from the rotisserie chicken and removing the skin. Erin McDowell/Business Insider I like to use rotisserie chicken for this recipe because it's often easier and cheaper than buying chicken breasts and boiling them myself. I find that the rotisserie chicken also packs much more flavor, and saves me from having to do any actual cooking. Then I shred the rotisserie chicken. Erin McDowell/Business Insider I usually do this step by hand, but you can also use two forks to shred your chicken. By the end, you should have about 3 cups of shredded rotisserie chicken. I put the cream cheese in the slow cooker and cut it into cubes with a knife. Erin McDowell/Business Insider This helps ensure the cream cheese melts evenly and is well-distributed throughout the dip. You can use full-fat or low-fat cream cheese for this dip, depending on your preference — I've had success using both. I then add the rotisserie chicken to the slow cooker and season it. Erin McDowell/Business Insider I usually eyeball how much seasoning I use, but typically go for about a tablespoon of garlic powder, a tablespoon of salt, and a few dashes of pepper. I add the two types of ", "date_str": "2026-11-22T15:12:01+00:00", "hash": "bb3bb0f42b3ca6fb", "title_fa": "من این دیپ مرغ آهسته پز بوفالو را هر روز شکرگزاری درست می کنم. همیشه برای جمعیت خوشایند است.", "summary_fa": "دیپ مرغ بوفالو تنها به شش ماده نیاز دارد. ارین مک داول/Business Insider من هر روز شکرگزاری همان دیپ مرغ بوفالو را درست می کنم. این فقط شش ماده به اضافه چاشنی ها نیاز دارد و در یک اجاق آهسته با هم می آید. این برای جمعیت خوشایندتر است و ساختن آن به طرز باورنکردنی آسان است. روز شکرگزاری به urce": "Billboard", "title": "ATEEZ Earn Fourth No. 1 on Billboard 200 With ‘GOLDEN HOUR : Part.6’", "link": "https://www.billboard.com/music/chart-beat/ateez-golden-hour-part6-no1-billboard-200-chart-1236387535/", "summary": "ATEEZ earn their fourth No. 1 on the Billboard 200 albums chart as GOLDEN HOUR : Part.6 debuts atop the tally (dated Nov. 28). It’s the 10th top 10-charted project for the act, all of which have come since 2022. With the arrival, ATEEZ stand alone as the group with the most top 10s in the 2020s. Among all acts this decade, only YoungBoy Never Broke Again (15) and Taylor Swift (14) have more. Related During ATEEZ s Biggest Year, Leader Hongjoong Wanted to Share a Song About Having Enough Olivia Rodrigo’s ‘Stupid Song’ Hits No. 1 on Billboard’s Pop Airplay Chart Britney Spears Apologizes to Her Family on Instagram: I Just Miss Them Like Crazy GOLDEN HOUR : Part.6 bows with 195,000 equivalent album units earned in the United States in the week ending Nov. 19, largely driven by pure album sales (191,000). Also in the top 10, U2 collects its 14th top 10 as the band’s new studio album, Carnaval de Luz , debuts at No. 4. The Billboard 200 chart ranks the most popular albums of the week in the U.S. based on multi-metric consumption as measured in equivalent album units, compiled by Luminate. Units comprise album sales, track equivalent albums (TEA) and streaming equivalent albums (SEA). Each unit equals one album sale, or 10 individual tracks sold from an album, or 2,500 ad-supported or 1,000 paid/subscription on-demand official audio and video streams generated by songs from an album. The new Nov. 28, 2026-dated chart will be posted in full on Billboard s website on Nov. 24. For all chart news, follow @billboard and @billboardcharts on both X, formerly known as Twitter, and Instagram. Of GOLDEN HOUR : Part.6 ’s 195,000 first-week equivalent album units, album sales comprise 191,000 (it debuts at No. 1 on the Top Album Sales chart), SEA units comprise 4,000 (equaling 4.04 million on-demand official streams of the set’s songs) and TEA units comprise a negligible sum. ATEEZ have logged their 10 top 10s on the Billboard 200 consecutively. The act claimed its first top 10 with the No. 3-peaking THE WORLD EP.1 : MOVEMENT in 2022. In total, with 10 top 10s in the 2020s, ATEEZ now solely have the most top 10s among groups this decade. The act was previously tied with Stray Kids (which got its ninth top 10 — and ninth No. 1 — in August with This That ). GOLDEN HOUR : Part.6 ’s album sales were bolstered by its availability across 32 CD and vinyl variants (all containing collectible items such as photocards and posters, with some items randomized), including signed edition", "date_str": "2026-11-22T21:40:27+00:00", "hash": "ff9b04c735e925e8", "title_fa": "ATEEZ رتبه چهارم بیلبورد 200 را با «ساعت طلایی: قسمت 6» کسب کرد", "summary_fa": "ATEEZ چهارمین شماره 1 خود را در جدول آلبوم های بیلبورد 200 به عنوان اولین ساعت طلایی: قسمت 6 در صدر جدول (به تاریخ 28 نوامبر) به دست آورد. این دهمین پروژه 10 نمودار برتر برای این بازی است که همگی از سال 2022 ارائه شده‌اند. با ورود، ATEEZ به عنوان گروهی با بیشترین 10 فیلم برتر در دهه 2020 ایستاده است. در بین تمام بازیگران این دهه، فقط یانگ‌بوی هرگز دوباره شکسته نشد (15) و تیلور سوئیفت (14) بیشتر دارند. مرتبط در طول بزرگ‌ترین سال ATEEZ، رهبر Hongjoong می‌خواست آهنگی درباره داشتن آهنگ احمقانه اولیویا رودریگو به شماره 1 جدول پخش پاپ بیلبورد به اشتراک بگذارد: بریتنی اسپیرز از خانواده‌اش در اینستاگرام عذرخواهی می‌کند: من فقط دلم برایشان تنگ می‌شود. واحدهای معادل آلبومی که در هفته منتهی به 19 نوامبر در ایالات متحده به دست آمد، عمدتاً ناشی از فروش خالص آلبوم (191,000) بود. همچنین در بین 10 آلبوم برتر، U2 چهاردهمین 10 آلبوم برتر خود را به عنوان آلبوم استودیویی جدید گروه، Carnaval de Luz، در رتبه 4 جمع آوری کرد. نمودار بیلبورد 200 محبوب ترین آلبوم های هفته را در ایالات متحده بر اساس مصرف چند متری که بر حسب واحدهای آلبوم معادل اندازه گیری شده توسط Lumin گردآوری شده است، رتبه بندی می کند. واحدها شامل ف  "https://www.hollywoodreporter.com/tv/tv-news/tom-jackson-dead-espn-denver-broncos-1236760660/", "summary": "He spent nearly 30 years with the network, often teaming with Chris Berman: “We’ve lost one of the best human beings ever to walk the planet.”", "date_str": "2026-11-22T16:45:47+00:00", "hash": "35f5a435fd530d78", "title_fa": "تام جکسون، پشتیبان تمام حرفه‌ای Denver Broncos و تحلیلگر ESPN در ۷۵ سالگی درگذشت.", "summary_fa": "او نزدیک به 30 سال را با این شبکه گذراند و اغلب با کریس برمن همکاری داشت: \"ما یکی از بهترین انسان هایی را که تا به حال روی این سیاره قدم گذاشته اند، از دست داده ایم.\" تام جکسون که ۱۴ فصل به عنوان یک مدافع خط دفاعی سرسخت در دفاع معروف «نارنجی کراش» دنور برونکوس به عنوان یک آنالیزور محبوب فوتبال در ESPN حضور داشت، درگذشت. خانواده او به شبکه گفتند که جکسون 75 ساله بود. جزئیات دیگری از مرگ او بلافاصله در دسترس نیست. جکسون بیشتر به خاطر کارش در کنار کریس برمن در برنامه‌های ESPN NFL Primetime و Sunday NFL Countdown شناخته می‌شد، جایی که این زوج برداشت‌های طنز و سرگرم‌کننده خود را از نکات برجسته بازی‌ها ارائه می‌کردند. داستان‌های مرتبط موسیقی اوج نمایش نیمه‌وقت: ماشین A-List Eventizing Pro Games فیلم‌های لنس برادوی، Pitcher Turned Olympus Has Fallen بازیگر، در ۴۳ سالگی درگذشت، برمن در بیانیه‌ای گفت: «همه ما حیرت زده‌ایم». \"من حیرت زده ام، ما حیرت زده ایم و شما حیرت زده اید. ما یکی از بهترین انسان هایی را که تا کنون روی سیاره راه رفته است، تام جکسون را از دست داده ایم. من خوش شانس بودم که 30 سال در کنار تام کار کردم... این کار عشقی برای کل تیم ما بود، چه جلوی دوربین و چه پشت آن. ما همیشه امیدوار بودیم که بینندگانمان از نمایش‌ها به همان اندازه که ما هر هفته آن را برایشان می‌آوریم لذت ببرند.» برمن در یکشنبه شب شمارش معکوس NFL گفت که مرگ جکسون غیرمنتظره بود و او روز سه شنبه با بهترین دوستش \"به طور طولانی\" صحبت کرد. او گفت: «او 75 سال حیاتی بود. او در بیانیه خود گفت: \"تام بسیار بیشتر از یک تحلیلگر ماهر NFL بود.\" هیچ کس مهربان تر، متفکرتر، وفادارتر یا جذاب تر از او نبود. و وقتی نوبت", "image_url": "https://www.hollywoodreporter.com/wp-content/u         const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
