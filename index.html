ventory, and how close the event is. That means you may occasionally find tickets below face value, while seats for especially popular events can cost considerably more. Browse tickets at StubHub. A major reason StubHub is widely trusted is its FanProtect Guarantee, which ensures buyers receive valid tickets in time for the event. If there's an issue, such as invalid tickets or delivery problems, StubHub will attempt to provide replacement tickets or issue a refund. When an event is canceled and not rescheduled, buyers may receive either a full refund or a 120% credit toward a future purchase. That said, StubHub isn't without drawbacks. Service fees can be higher than those of some competing platforms, and because prices are set by sellers, availability and cost can vary significantly. It's also important to note that FanProtect does not guarantee refunds for postponed or rescheduled events unless the event is officially canceled. Below, we break down how StubHub works in 2025, including its buyer protections, refund policies, fees, and tips for avoiding scams—so you can decide whether it's the right place to buy tickets for your next event. Is StubHub legit? In short, StubHub is a trustworthy platform for buying and selling tickets to major events. Although the company itself is not the seller, it still offers safeguards for both parties in a sale to prevent potential scams. It does, however, mean that StubHub does not control the pricing of event tickets — these are set by the users selling them. The site will instead recommend price points for sellers during the listing process. StubHub offers a 100% guarantee on every order through its exclusive FanProtect Guarantee, which I've broken down below. Browse tickets at StubHub. Ma", "date_str": "2026-09-08T18:22:38+00:00", "hash": "0b7d20ca3e53096edda93192947c012254191acab5d11599e6a19f3d58658576", "title_fa": "آیا StubHub قانونی است؟ به همین دلیل است که ما به سایت برای خرید و فروش مجدد بلیط اعتماد داریم", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. ماریسیو سانتانا بیشتر بدانید. CBS Photo Archive; Pedro Becerra/Getty Images StubHub یکی از بزرگ‌ترین نام‌ها در فروش مجدد بلیت است که فهرست‌هایی برای کنسرت‌ها، رویدادهای ورزشی، تئاتر، کمدی، جشنواره‌ها و رویدادهای زنده دیگر دارد. به ویژه زمانی که یافتن بلیط از طریق فروشنده اصلی دشوار است، می تواند مفید باشد، اما قیمت ها می تواند بسیار متفاوت باشد. ما نگاهی دقیق‌تر به نحوه کار StubHub و آنچه قبل از خرید بلیط باید بدانیم انداختیم. این پلتفرم به‌عنوان بازاری عمل می‌کند که به جای تعیین قیمت بلیط، خریداران را با فروشندگان بلیت مرتبط می‌کند. فروشندگان معمولاً قیمت‌های درخواستی خود را انتخاب می‌کنند، که می‌تواند بر اساس تقاضا، مکان صندلی، موجودی موجود و نزدیکی رویداد در نوسان باشد. این بدان معناست که ممکن است گهگاه بلیط هایی کمتر از قیمت اسمی پیدا کنید، در حالی که صندلی برای رویدادهای محبوب می تواند بسیار بیشتر باشد. بلیط ها را در StubHub مرور کنید. دلیل اصلی مورد اعتماد StubHub ضمانت FanProtect آن است که تضمین می کند خریداران بلیط های معتبر را به موقع برای رویداد دریافت می کنند. اگر مشکلی وجود داشته باشد، مانند بلیت‌های نامعتبر یا مشکلات تحویل، StubHub تلاش می‌کند بلیت‌های جایگزین ارائه کند یا بازپرداخت وجه را صادر کند. هنگامی که یک رویداد لغو می شود و دوباره برنامه ریزی نمی شود، خریداران ممکن است بازپرداخت کامل یا 120٪ اعتبار برای خرید آینده دریافت کنند. با این حال، StubHub بدون اشکال نیست. هزینه‌های خدمات می‌تواند بالاتر از برخی از پلتفرم‌های رقیب باشد، و چون قیمت‌ها توسط فروشندگان تعیین می‌شود، در دسترس بودن و هزینه می‌تواند به‌طور قابل توجهی متفاوت باشد. همچنین مهم است که توجه داشته باشید که FanProtect بازپرداخت برای رویدادهای به تعویق افتاده یا برنامه ریزی مجدد را تضمین نمی کند"}, {"source": "Business Insider", "title": "Where to buy 2026 US Open tickets for the tennis tournament in NewYork", "link": "https://www.businessinsider.com/guides/tickets/where-to-buy-2026-us-open-tennis-tickets", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Matthew Stockman; Julian Finney/Getty The 2026 US Open is entering its final stretch at the USTA Billie Jean King National Tennis Center in Flushing, New York, with the singles quarterfinals underway and the tournament running through September 13. Defending champion Carlos Alcaraz is still in contention, while world No. 1 Jannik Sinner withdrew before the tournament, and Novak Djokovic was eliminated in the first round. If you're hoping to catch the remaining matches in person, we've broken down where to buy US Open tickets and what you can expect to pay. On the women's side, Aryna Sabalenka, Coco Gauff, Jessica Pegula, and Elena Rybakina are among the biggest names still chasing the title. With several American players also reaching the quarterfinals, there's plenty of star power left as the tournament heads toward championship weekend. Below, I'll break down how to buy 2026 US Open tickets, including last-second options from StubHub and Vivid Seats , the gameplay schedule, and what to know before heading to Flushing Meadows. If you're tuning in from home, check out our guide on where to watch the US Open for streaming options. US Open 2026 schedule This year's US Open started with Fan Week through August 29, while the singles main draw runs from August 30 to September 13. The revamped Mixed Doubles Championship happens early: qualifying was on August 24, the first round and quarterfinals were on August 25, and the semifinals and championship were on August 26. The USTA explicitly notes that the schedule, match times, and sessions are subject to change — find tickets now on StubHub and Vivid Seats . Men's and Women's Singles August 23, 2026 - Fan Week begins August 24, 2026 - Singles qualifying August 25, 2026 - Singles qualifying August 26, 2026 - Singles qualifying August 27, 2026 - Men's and women's singles qualifying August 30-31, 2026 - Men's and women's singles first round September 1, 2026 - Men's and women's singles first round September 2, 2026 - Men's and women's singles second round September 3, 2026 - Men's and women's singles second round continues September 4, 2026 - Men's and women's singles third round September 5, 2026 - Men's and women's singles third round continues September 6, 2026 - Men's and women's singles Round of 16 September 7, 2026 - Men's and women's singles Round of 16 September 8-9, 2026 - Men's and women's singles quarterfinals Se", "date_str": "2026-09-08T18:13:49+00:00", "hash": "86b7446d97f97adca1bafd6285fa7da9cb08e6dfdfc3923f24b647706d04c221", "title_fa": "از کجا می توان بلیت 2026 US Open را برای مسابقات تنیس در نیویورک خریداری کرد", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید متیو استاکمن؛ جولیان فینی/گتی مسابقات آزاد USTA 2026 در حال ورود به آخرین مرحله خود در مرکز ملی تنیس USTA Billie Jean King در فلاشینگ، نیویورک است، در حالی که مرحله یک چهارم نهایی انفرادی در حال انجام است و تورنمنت تا 13 سپتامبر ادامه دارد. کارلوس آلکاراز، مدافع عنوان قهرمانی، همچنان در رقابت است، در حالی که شماره جهانی جهان. 1 Jannik Sinner قبل از مسابقات کنار رفت و نواک جوکوویچ در دور اول حذف شد. اگر امیدوار هستید که مسابقات باقیمانده را شخصاً تماشا کنید، ما به تفکیک مکان‌هایی برای خرید بلیط اوپن ایالات متحده و آنچه می‌توانید انتظار پرداخت داشته باشید، پرداخته‌ایم. در بخش زنان، آرینا سابالنکا، کوکو گاوف، جسیکا پگولا و النا ریباکینا از جمله بزرگ‌ترین نام‌هایی هستند که همچنان به دنبال این عنوان هستند. با رسیدن چندین بازیکن آمریکایی به مرحله یک چهارم نهایی، همچنان که مسابقات به سمت آخر هفته قهرمانی پیش می رود، نیروی ستاره ای زیادی باقی مانده است. در زیر، نحوه خرید بلیط‌های اوپن آمریکا 2026 را شرح می‌دهم، از جمله گزینه‌های ثانیه آخر از StubHub و Vivid Seats، برنامه بازی، و آنچه باید قبل از رفتن به فلاشینگ میدوز بدانید. اگر از خانه تنظیم می‌کنید، راهنمای ما را در مورد مکان تماشای US Open برای گزینه‌های پخش بررسی کنید. برنامه آزاد US Open 2026 امسال با هفته هواداران تا 29 آگوست آغاز شد، در حالی که قرعه کشی اصلی تک نفره از 30 اوت تا 13 سپتامبر برگزار می شود. مسابقات قهرمانی دونفره مختلط بازسازی شده زودتر برگزار می شود: مقدماتی در 24 آگوست، دور اول و یک چهارم نهایی در 25 آگوست، و برنامه نیمه نهایی، 6 قهرمانی ایالات متحده نه در اوت TA بود. و جلسات ممکن است تغییر"}, {"source": "Business Insider", "title": "This AI assistant bought me whey protein and booked a cabin for my birthday", "link": "https://www.businessinsider.com/instinct-is-the-ai-assistant-silicon-valley-cant-stop-talking-2026-9", "summary": "Instinct helped me buy whey protein from Costco and book a cabin for my birthday Reuters and Associated Press Instinct, an invitation-only AI assistant going viral in Silicon Valley, can handle real-world errands through text messages. A version of this story appeared in the BI Tech Memo newsletter. Sign up for the weekly BI Tech Memo newsletter here . Here's everything that Instinct — an invitation-only AI assistant going viral among Silicon Valley tech types — has done for me over the past few days: • Booked a cabin for my birthday and made a dinner reservation. • Ordered whey protein from Costco. • Faxed (faxed!) an obscure document to my bank so I could get a late-fee refund. • Checked whether a new dentist was in-network and made an appointment. • Dealt with a human customer service representative at my insurance company. • Canceled several recurring subscriptions I'd forgotten about. • Responded to my emails. Honestly, this service is nuts. And sure, AI tools like OpenClaw, Codex , and Claude Code can already do some of these things. But what makes Instinct different is that it lives in your text messages. There's nothing to set up, and no technical fiddling. You send it a text, and it gets to work. VCs see the magic, too. The WSJ reported that Instinct is raising $250 million at a $2.5 billion valuation. Its founder, Noah Shinn, is a 23-year-old Northeastern University dropout and an early employee at AI company Sierra. Shinn did not respond to multiple requests for comment. Instinct is part of Silicon Valley's next big bet: that AI should stop telling us how to do things and just start doing them for us, something that the industry calls \"agentic AI.\" My colleague Hugh Langley reported that Meta is testing something similar called Hatch. There is, naturally, a catch. An assistant cannot run your life without gaining access to a lot of it. The more hooks that you let Instinct sink into your digital life by connecting it to your email, calendar, and anything else that requires you to log in, the more useful it is. Its terms of service also allow it to train its models on user data. Shinn did not respond to multiple requests for comment. So here's the part where I should tell you to tread with caution. Instead, I'm just going to leave you with an invitation to sign up. Write to me and tell me the craziest thing you tried. Have a tip? Contact Pranav Dixit via email at pranavdixit@protonmail.com or Signal at 1-408-905-9124 . Use a personal email address", "date_str": "2026-09-08T18:13:25+00:00", "hash": "b60ba8c41bda8dcd8812515006c73ea5fc9059f355db20d40eedd3dfa73fac4e", "title_fa": "این دستیار هوش مصنوعی برای من پروتئین آب پنیر خرید و برای تولدم یک کابین رزرو کرد", "summary_fa": "Instinct به من کمک کرد پروتئین آب پنیر را از Costco بخرم و برای تولدم یک کابین رزرو کنم. رویترز و Associated Press Instinct، یک دستیار هوش مصنوعی فقط دعوت‌نامه‌ای که در Silicon Valley در حال گسترش است، می‌تواند از طریق پیام‌های متنی به انجام وظایف دنیای واقعی بپردازد. نسخه ای از این داستان در خبرنامه BI Tech Memo ظاهر شد. برای خبرنامه هفتگی BI Tech Memo اینجا ثبت نام کنید. در اینجا همه چیزهایی است که Instinct - یک دستیار هوش مصنوعی فقط دعوت‌نامه که در بین انواع فناوری سیلیکون ولی در حال گسترش است - در چند روز گذشته برای من انجام داده است: • یک کابین برای تولدم رزرو کرد و یک شام رزرو کرد. • پروتئین آب پنیر را از Costco سفارش داد. • یک سند مبهم را به بانکم فکس کردم (فکس شد!) تا بتوانم هزینه تاخیر دریافت کنم. • بررسی کرد که آیا یک دندانپزشک جدید در شبکه است یا خیر و قرار ملاقات گذاشته است. • با یک نماینده خدمات مشتری انسانی در شرکت بیمه خود برخورد کردم. • چندین اشتراک تکراری را که فراموش کرده بودم لغو کرد. • به ایمیل های من پاسخ داد. انصافاً این سرویس آجیل است. و مطمئنا، ابزارهای هوش مصنوعی مانند OpenClaw، Codex و Claude Code می‌توانند برخی از این کارها را انجام دهند. اما چیزی که Instinct را متفاوت می کند این است که در پیام های متنی شما زندگی می کند. چیزی برای تنظیم وجود ندارد، و هیچ مشکل فنی وجود ندارد. شما به آن پیامک می‌فرستید، و کار شروع می‌شود. VC ها نیز جادو را می بینند. WSJ گزارش داد که Instinct در حال افزایش 250 میلیون دلاری با ارزش 2.5 میلیارد دلاری است. بنیانگذار آن، نوح شین، یک جوان 23 ساله است که از دانشگاه نورث ایسترن انصراف داده و در ابتدا کارمند"}, {"source": "Business Insider", "title": "OpenAI CFO Sarah Friar says ChatGPT's ads should be like 'if Google and Meta had a baby'", "link": "https://www.businessinsider.com/openai-cfo-chatgpts-ads-google-and-meta-had-a-baby-2026-9", "summary": "Sarah Friar, OpenAI s chief financial officer. PATRICK T. FALLON/AFP via Getty Images Sarah Friar, OpenAI's CFO, said ChatGPT's ads could be like 'if Google and Meta had a baby.' OpenAI's ads push is an attempt to monetize its base of 1 billion weekly users. Friar made the remarks at a San Francisco conference on Tuesday morning. Congratulations to Google and Meta — they're expecting. OpenAI's chief financial officer, Sarah Friar, was describing her company's ads ambitions on Tuesday when she said that ChatGPT is like \"if Google and Meta had a baby.\" Friar made the remarks before a full room of investors and analysts at Goldman Sachs' Communacopia + Technology Conference in San Francisco. The comment succinctly outlines OpenAI's ambition to turn ChatGPT into a money-printing ads platform, following in the footsteps of its tech giant predecessors. In just seven months of placing ads on the chatbot, OpenAI's ads business is now raking in cash at a rate that Friar said would equal $1 billion in revenue if mapped across a full year. She attributed the \"baby\" idea to Fidji Simo, the former OpenAI executive who stepped down this year from her role running the company's commercial operations. Friar went on to explain that she thinks ChatGPT can use the data it learns from its users to bring the \"intent\" of a Google search together with the \"context\" that Meta has on its social media users. \"It's high intent search, you're telling a lot, but with the context — it's not quite people like me, it's me, because it has all the memory of me,\" Friar said. \"So when you put those two things together, the ability to have a really potent ad platform is clearly there.\" Right now, OpenAI serves basic ads underneath ChatGPT's responses if a user is on the free or Go subscription tiers. Friar expects a more complex, more tailored format in the future. She said her team has shown her \"early indications\" of what a more AI-native ad format could look like as they develop the platform's basics and scale its availability. \"This is all before we've really launched a format that feels truly endemic to AI,\" Friar said. \"That's what I get super excited about.\" OpenAI's focus on advertising marks a full 180 since 2024, when CEO Sam Altman said he found the idea of combining ads and AI \"uniquely unsettling.\" The ambitions are a break from rival Anthropic, which has skewered the idea of ads in chatbot responses. Each of the companies is preparing to go public in highly anticipated IPOs that", "date_str": "2026-09-08T18:05:48+00:00", "hash": "7ae2892c624e9ca4b2aa6d7fffbde7a4b7841fc241f09e7d1885b019e31d0375", "title_fa": "سارا فریار، مدیر مالی OpenAI می‌گوید تبلیغات ChatGPT باید مانند «اگر گوگل و متا بچه دار شوند» باشد.", "summary_fa": "سارا فریار، مدیر ارشد مالی OpenAI. PATRICK T. FALLON/AFP از طریق Getty Images سارا فریار، مدیر مالی OpenAI، گفت که تبلیغات ChatGPT می‌تواند شبیه به \"اگر گوگل و متا بچه دار شوند.\" فشار تبلیغات OpenAI تلاشی برای کسب درآمد از پایگاه 1 میلیارد کاربر هفتگی آن است. فریار این سخنان را در کنفرانسی در سانفرانسیسکو صبح سه شنبه بیان کرد. به Google و Meta تبریک می گویم - آنها منتظر هستند. مدیر مالی OpenAI، سارا فریار، در روز سه‌شنبه در حال توصیف جاه‌طلبی‌های تبلیغاتی شرکتش بود که گفت که ChatGPT مانند \"اگر گوگل و متا بچه دار می‌شدند\" است. Friar made the remarks before a full room of investors and analysts at Goldman Sachs' Communacopia + Technology Conference in San Francisco. این نظر به طور خلاصه، جاه‌طلبی OpenAI را برای تبدیل ChatGPT به یک پلتفرم تبلیغاتی چاپ پول، دنباله‌روی غول‌های فناوری پیشین خود نشان می‌دهد. تنها در هفت ماه از قرار دادن تبلیغات در ربات چت، کسب و کار تبلیغات OpenAI اکنون با نرخی که فریار می گوید اگر در طول یک سال کامل نقشه برداری شود، معادل یک میلیارد دلار درآمد دارد. او ایده «کودک» را به فیجی سیمو، مدیر اجرایی سابق OpenAI که امسال از سمت مدیریت عملیات تجاری شرکت کنار رفت، نسبت داد. فریار در ادامه توضیح داد که فکر می‌کند ChatGPT می‌تواند از داده‌هایی که از کاربرانش می‌آموزد استفاده کند تا «نیت» جستجوی Google را با «زمینه» که متا در کاربران رسانه‌های اجتماعی خود دارد، همراه کند. فریار گفت: \"این جستجو با هدف بالا است، شما خیلی چیزها را می گویید، اما با زمینه - این کاملاً شبیه افراد من نیست، بلکه من هستم، زیرا تمام خاطرات من را دارد.\" بنابراین وقتی این دو مورد را کنار هم قرار دهید، توانایی داشتن یک پلتفرم تبلیغاتی واقعاً قدرتمند به وضوح وجود دارد. در حال حاضر، اگر کاربر"}, {"source": "Business Insider", "title": "The US Navy is applying lessons from USS Abraham Lincoln’s tough deployment to another aircraft carrier preparing to head out", "link": "https://www.businessinsider.com/us-navy-learning-from-tough-uss-abraham-lincoln-deployment-2026-9", "summary": "The US Navy said it s maximizing supplies and food on another carrier readying to deploy. US Navy photo by Mass Communications Specialist First Class Luke McCall The US Navy said it's applying lessons from USS Abraham Lincoln's deployment to another carrier. USS Theodore Roosevelt will have more logistics support, food, supplies, and entertainment options. The US conflict with Iran has entered its sixth month and put strain on military assets. The US Navy's next aircraft carrier set to deploy will be carrying extra supplies so it can remain self-sufficient for longer, top service officials said on Tuesday, a move intended to address logistics issues that have surfaced on other ships during the Iran war. USS Theodore Roosevelt is preparing to depart from its home port of San Diego in the coming weeks. Navy leadership said the aircraft carrier is incorporating lessons learned from others that participated in combat operations against Iran this year. Adm. Daryl Caudle , the chief of naval operations, said the Roosevelt is \"putting those lessons into action\" using what the Navy learned from aircraft carriers USS Abraham Lincoln and USS Gerald R. Ford. \"That starts with logistics,\" Caudle said in a video address, explaining that \"Roosevelt is maximizing its loadout of food, retail products, and hygiene items before getting underway.\" Speaking next to him in the video, Master Chief Petty Officer of the Navy John Perryman said that the vessel's crew \"is converting available spaces into additional storage, building the ability to remain self-sufficient for longer periods, especially when resupply may be difficult.\" Both the Ford and Lincoln endured lengthy, extended deployments in the Middle East, supporting combat operations against Iran. Ford spent a post-Cold War record-breaking 326 days at sea; Lincoln, already at more than 280 days, is still on its way home after a stop in Thailand. The USS Abraham Lincoln aircraft carrier departed Thailand on Sunday after five days in port. Thananuwat Srirasant/Getty Images Reports emerged last month detailing supply issues aboard Lincoln, with families expressing concern over the living conditions and the well-being of the crew, some 5,000 sailors and Marines. Multiple reports indicated that key logistics centers had been affected by the war, straining Navy crews. Democratic lawmakers have pressed the Pentagon for answers. While peacetime carrier deployments may be six or seven months, demands can be higher during periods o", "date_str": "2026-09-08T17:55:12+00:00", "hash": "d46aeb9e2180f839da8f571a5134b509ef2eaf807bdec6f1ba065f8f87765a2c", "title_fa": "نیروی دریایی ایالات متحده در حال استفاده از درس های استقرار سخت یو اس اس آبراهام لینکلن برای ناو هواپیمابر دیگری است که آماده خروج است.", "summary_fa": "نیروی دریایی ایالات متحده اعلام کرد که در حال به حداکثر رساندن ذخایر و مواد غذایی در ناو دیگری است که آماده استقرار است. عکس نیروی دریایی ایالات متحده توسط متخصص ارتباطات جمعی درجه یک لوک مک کال نیروی دریایی ایالات متحده گفت که در حال استفاده از درس های استقرار یو اس اس آبراهام لینکلن در یک ناو دیگر است. USS Theodore Roosevelt پشتیبانی لجستیکی، غذا، لوازم و گزینه های سرگرمی بیشتری خواهد داشت. درگیری آمریکا با ایران وارد ششمین ماه خود شده و بر دارایی های نظامی فشار وارد کرده است. مقامات ارشد خدماتی روز سه‌شنبه گفتند که ناو هواپیمابر بعدی نیروی دریایی ایالات متحده که قرار است مستقر شود، تدارکات اضافی را حمل خواهد کرد تا بتواند برای مدت طولانی‌تری خودکفا بماند، اقدامی با هدف رسیدگی به مسائل لجستیکی که در سایر کشتی‌ها در طول جنگ ایران ظاهر شده است. USS Theodore Roosevelt در حال آماده شدن برای خروج از بندر اصلی خود در سن دیگو در هفته های آینده است. رهبری نیروی دریایی گفت که این ناو هواپیمابر درس های آموخته شده از دیگرانی را که امسال در عملیات جنگی علیه ایران شرکت کرده اند، ترکیب می کند. دریاسالار داریل کادل، رئیس عملیات دریایی، گفت که روزولت با استفاده از آموخته های نیروی دریایی از ناوهای هواپیمابر یو اس اس آبراهام لینکلن و یو اس اس جرالد آر. فورد، «این درس ها را عملی می کند». کادل در یک آدرس ویدیویی گفت: «این با تدارکات شروع می‌شود،» و توضیح داد که «روزولت در حال به حداکثر رساندن بار خود از مواد غذایی، محصولات خرده‌فروشی و اقلام بهداشتی قبل از شروع است». جان پریمن، افسر ارشد نیروی دریایی، در کنار او در این ویدئو گفت که خدمه کشتی \"در حال تبدیل فضاهای موجود به ذخیره سازی اضافی هستند و توانایی خودکفایی را برای دوره های طولانی تر،"}, {"source": "Lifehacker", "t crease,\" or where the display folds in. If so, the Ultra could have one of the better-looking foldable displays on the market, but, again, we won't know until tomorrow. While most of the iPhone Ultra's specs are exciting, one thing is anything but: its price. A foldable iPhone was always doomed to be expensive, but thanks to the ongoing memory crisis , all tech is pricier than ever. Rumors suggest the iPhone Ultra will start at more than $2,000. As of this article, Apple's most expensive iPhone is the $2,000 2TB iPhone 17 Pro Max, but even it has a starting price of $1,199 for 256GB. iPhone 18 Pro and iPhone 18 Pro Max announcement Apple isn't doing away with its traditional iPhone design. On the contrary, the other iPhones Apple is expected to announce tomorrow, the iPhone 18 Pro and iPhone 18 Pro Max, will be small updates from last year's iPhone 17 Pro and iPhone 17 Pro Max. (As an owner of the latter, I'm happy I don't have much pressure to upgrade.) Here's what's new from last year : According to the rumors, the iPhone 18 Pro line may ship with slightly smaller Dynamic Islands than before. While you'll still see the camera cutout, it won't be quite ", "date_str": "2026-09-08T17:00:21+00:00", "hash": "1683e9cb4b0fd44195fb1929a499576529fecd0f46f6033dec04b76559c5483b", "title_fa": "پنج دستگاهی که انتظار دارم اپل روز چهارشنبه معرفی کند", "summary_fa": "اپل یک رویداد بزرگ برای فردا برنامه ریزی کرده است. چهارشنبه 9 شهریور ساعت 13. ET، این شرکت در مرحله مجازی برای معرفی یک سری محصولات جدید خواهد رفت. این محصولات دقیقاً چه هستند، فقط اپل با اطمینان می داند. اما به لطف درز و شایعات، ما به طور کلی می دانیم که برخی از این به روز رسانی ها چه خواهند بود. من مطمئن هستم که فردا شاهد معرفی این پنج دستگاه خواهیم بود، اگرچه اپل ممکن است به روز رسانی های دیگری را نیز برای ما آماده کند. معرفی آیفون اولترا معرفی محصول تعیین کننده فردا برای اپل آیفون اولترا خواهد بود. Ultra اولین آیفون تاشو اپل است که بدون شک بزرگترین بروزرسانی خط تولید آیفون در چند سال اخیر (یا شاید تا کنون) بوده است. مانند سایر گوشی‌های تاشو، آیفون اولترا در حالت بسته از نمایشگر کوچک‌تری بهره می‌برد (شاید 5.5 اینچ)، و باز می‌شود تا نمایشگر بزرگ‌تری را در داخل نمایش دهد (شایعه‌ها حاکی از آن است که 7.8 اینچ است). اطلاعات فاش شده حاکی از آن است که این دستگاه ها علاوه بر دوربین سلفی، دو دوربین پشتی نیز خواهند داشت، اگرچه ممکن است به جای Face ID از Touch ID استفاده کند. اپل احتمالاً تراشه جدید A20 خود را با تمام آیفون‌های جدید خود، از جمله Ultra، در سال جاری معرفی خواهد کرد. طبق شایعات، این شرکت ممکن است 12 گیگابایت رم و باتری بزرگتر برای قرار دادن نمایشگرهای دوگانه 5000 یا 5500 میلی آمپر ساعتی داشته باشد. در حالی که تا زمانی که آن را نبینیم مطمئناً نمی‌دانیم، اما فاش‌شده نشان می‌دهد که اپل توانسته است ظاهر «چین» Ultra را کاهش دهد، یا اینکه صفحه نمایش کجا تا می‌شود. در حالی که بیشتر مشخصات آیفون اولترا هیجان انگیز است، یک چیز چیزی جز: قیمت آن است. یک آیفون تاشو همیشه محکوم به گرانی"}, {"source": "Lifehacker", "title": "10 Shows Like 'The Paper' You Should Watch Next", "link": "https://lifehacker.com/entertainment/the-best-shows-like-the-paper?utm_medium=RSS", "summary": "We may earn a commission from links on this page. After a handful of false starts involving planned spin-offs and/or reboots, The Office universe continues in The Paper , returning for its second season on Peacock. The show follows the same documentary crew that followed the staff of Dunder Mifflin for nearly a decade heading to Toledo in order to keep tabs on the staff of the Toledo Truth Teller , a legacy Midwestern newspaper that's doing about as well as any other American paper. (Poorly). Filled with cringe comedy and ripped-from-your-workplace personalities, it's the most recent entry in the storied tradition of TV series set in and around an American workplace. Once you've completed your season two binge, here are 10 other shows to get you through the workweek. St. Denis Medical (2024 ) St. Denis Medical co-creator Justin Spitzer was a writer and producer on The Office back in the day, so it's not surprising that there are major vibe similarities between it and The Paper . The former takes place in the title's St. Denis Regional Medical Center, and follows the medical staff dealing with demanding patients on one side and an even more challenging medical system on the other. Allison Tolman leads an impressive cast that includes Wendi McLendon-Covey and David Alan Grier, with the show blending the workplace-mockumentary comedy style with relatable themes about how much it stinks to be a practitioner or a patient stuck in the American medical system. Stream St. Denis Medical on Peacock . St. Denis Medical (2024 ) at Peacock Learn More Learn More at Peacock Sports Night (1998 2000) Created by Aaron Sorkin in the wake of the early success of West Wing, Sports Night was just as acclaimed (and won a bunch of Emmys) though it didn't have nearly the longevity, only running for two seasons before becoming a cult favorite. Robert Guillaume plays the managing editor of a SportsCenter -esque show struggling to stay on the air. He's joined by a cast that includes Josh Charles, Perter Krause, Felicity Huffman, William H. Macy, Joshua Malina, and Clark Gregg, in an ostensible sitcom that plays as much as a fast-moving, fast-talking comedy-drama with layered, complex characters. Buy Sports Night on Prime Video . Sports Night (1998 2000) at Prime Video Learn More Learn More at Prime Video Abbott Elementary (2021 ) Quickly establishing itself as one of the great workplace mockumentaries, Quinta Brunson's Abbott Elementary portrays its cast of (mostly) well-meaning char", "date_str": "2026-09-08T16:30:00+00:00", "hash": "6de9d0cbfd1ec50f74a3580ce4fda61152a1a5525b30d96b3bad2900559e9c06", "title_fa": "10 نمایش مانند \"کاغذ\" که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. پس از چند شروع نادرست شامل اسپین‌آف‌های برنامه‌ریزی‌شده و/یا راه‌اندازی مجدد، دنیای Office در The Paper ادامه می‌یابد و برای فصل دوم خود در Peacock بازمی‌گردد. این نمایش همان گروه مستندسازی را دنبال می‌کند که نزدیک به یک دهه کارکنان داندر میفلین را دنبال می‌کردند و به تولدو می‌رفتند تا از کارکنان روزنامه حقیقت‌گوی تولدو، یک روزنامه قدیمی میدوسترن که مانند هر روزنامه آمریکایی دیگر کار می‌کرد، نگاهی داشته باشند. (بد). مملو از کمدی های ترسناک و شخصیت های بریده شده از محل کار شما، این جدیدترین ورودی در سنت داستانی سریال های تلویزیونی است که در یک محل کار آمریکایی و در اطراف آن اتفاق می افتد. هنگامی که فصل دوم پرخوری خود را کامل کردید، در اینجا 10 نمایش دیگر وجود دارد که شما را در طول هفته کاری راهنمایی می کند. St. Denis Medical (2024) جاستین اسپیتزر، یکی از خالقان St. Denis Medical در آن روزگار نویسنده و تهیه‌کننده The Office بود، بنابراین تعجب آور نیست که شباهت‌های زیادی بین آن و The Paper وجود دارد. اولی در مرکز پزشکی منطقه‌ای سنت دنیس اتفاق می‌افتد و کادر پزشکی را دنبال می‌کند که از یک طرف با بیماران خواستار سروکار دارند و از طرف دیگر یک سیستم پزشکی حتی چالش‌برانگیزتر. آلیسون تولمن بازیگری تاثیرگذار را رهبری می‌کند که شامل وندی مک‌لندون-کاوی و دیوید آلن گریر می‌شود، با این نمایش که سبک کمدی ساختگی در محل کار را با مضامین مرتبط ترکیب می‌کند که نشان می‌دهد یک پزشک یا یک بیمار در سیستم پزشکی آمریکا چقدر بدبو است. Stream St. دنیس پزشکی در مورد طاووس St. Denis Medical (2024) در Peacock بیشتر بیاموزید در Peacock Sports Night (1998 2000) که توسط آرون سورکین در پی موفقیت اولیه West Wing ایجاد شد، Sports Night به همان اندازه تحسین شد"}],
      media: [{"source": "Billboard", "title": "‘Wicked’ Is Going on Tour With a Live Symphony Orchestra", "link": "https://www.billboard.com/music/music-news/wicked-film-tour-live-symphony-orchestra-1236336024/", "summary": "The Wicked movie is gearing up to defy gravity all over again, and this time with a live orchestra behind them. Wicked: Part One is heading to concert halls around the world, where audiences will be able to watch the blockbuster film on a massive screen while a full symphony orchestra performs Stephen Schwartz and John Powell s music live, synchronized to the action onscreen. Related Wicked Soundtrack Tops Multiple Billboard Charts, Makes Historic Start on Billboard 200 Every Song From Both Wicked Films, Ranked From Worst to Best Ariana Grande Surprise Releases 12-Track Petal (The Complete Live Album) The live-to-film series will kick off with a special preview in San Francisco on Jan. 16, 2027, before its world premiere at New York s Radio City Music Hall on Jan. 23. From there, Wicked: Part One in Concert will travel to Chicago, Mexico City, Guadalajara, Monterrey, Toronto, Montreal and Vancouver, with additional cities to be announced. The concert experience comes at a time when music from Wicked proved to be a blockbuster in its own right. Wicked: The Soundtrack , credited to Cynthia Erivo , Ariana Grande and various other artists, debuted at No. 2 on the Billboard 200 in December 2024, becoming the highest-debuting soundtrack ever from a big-screen adaptation of a stage musical. Those songs from Popular to Defying Gravity will get an entirely new setting. The concerts are being produced through a collaboration between Universal Film, Universal Destinations Experiences and Hurwitz Concerts, the company founded by Oscar-winning composer Justin Hurwitz. Hurwitz Concerts has previously brought films including La La Land and Whiplash to concert stages, with orchestras performing their scores live alongside the movies. I absolutely love the live-to-film format and think the Wicked films are so perfect for it, Hurwitz said in a statement shared with Billboard . It s an honor for me to help bring Stephen Schwartz s masterpiece musical and John Powell and Schwartz s brilliant, cinematic score to concert venues around the world. For Schwartz, the new format gives audiences another way to experience the music that fans have already embraced on screen and on the record. When I ve seen live concerts of film scores, I ve always found it an amazing experience, so I m delighted that the Wicked movies are now becoming film concerts, Schwartz also shared in a statement. Find the dates and locations (so far) below: San Francisco (preview concert) January 16, 2027 New Yo", "date_str": "2026-09-09T14:30:00+00:00", "hash": "52de6bb3cd95e1fd6ce013c8ea05f321d8a72e68731799c98abe07d9188e6b64", "title_fa": "\"Wicked\" با یک ارکستر سمفونیک زنده به تور می رود", "summary_fa": "فیلم Wicked در حال آماده شدن است تا بار دیگر جاذبه را به چالش بکشد، و این بار با یک ارکستر زنده پشت سر آنها. Wicked: Part One به سالن‌های کنسرت در سراسر جهان می‌رود، جایی که مخاطبان می‌توانند فیلم پرفروش را روی صفحه‌ای عظیم تماشا کنند، در حالی که یک ارکستر سمفونیک کامل موسیقی استیون شوارتز و جان پاول را به صورت زنده و هماهنگ با اکشن روی صفحه اجرا می‌کند. موسیقی متن مرتبط Wicked برترین نمودارهای متعدد بیلبورد است، شروعی تاریخی در بیلبورد دارد 200 هر آهنگ از هر دو فیلم Wicked، رتبه از بدترین تا بهترین آریانا گراند سورپرایز انتشار 12 آهنگ گلبرگ (آلبوم زنده کامل) The live-to-film with a Francis preview on 6 on Janco. 2027، قبل از نمایش جهانی آن در رادیو سیتی موزیک هال نیویورک در 23 ژانویه. از آنجا، Wicked: Part One in Concert به شیکاگو، مکزیکو سیتی، گوادالاخارا، مونتری، تورنتو، مونترال و ونکوور سفر خواهد کرد و شهرهای دیگری نیز اعلام خواهند شد. تجربه کنسرت در زمانی اتفاق می‌افتد که موسیقی Wicked به خودی خود یک پرفروش بود. Wicked: The Soundtrack، که به سینتیا اریوو، آریانا گرانده و هنرمندان مختلف دیگر اعتبار داده شده است، اولین بار در رتبه اول عرضه شد. 2 در بیلبورد 200 در دسامبر 2024، تبدیل به بالاترین موسیقی متن فیلم از یک اقتباس روی صفحه نمایش بزرگ از یک موزیکال صحنه. این آهنگ‌ها از Popular تا Defying Gravity تنظیمات کاملاً جدیدی خواهند داشت. این کنسرت ها از طریق همکاری بین Universal Film، Universal Destinations Experiences و Hurwitz Concerts، شرکتی که توسط آهنگساز برنده اسکار جاستین هورویتز تأسیس شده، تولید می شود. کنسرت‌های Hurwitz قبلاً فیلم‌هایی از جمله La La Land و Whiplash را به صحنه‌های کنسرت آورده بود و ارکسترها موسیقی خود را به صورت زنده در کنار فیلم‌ها اجرا می‌کردند. هورویتز در بیانیه‌ای که با بیلبورد"}, {"source": "Billboard", "title": "Ariana Grande, Shakira & Burna Boy Score 2026’s Top Summer Songs on Billboard’s Global Charts", "link": "https://www.billboard.com/music/chart-beat/top-summer-songs-global-charts-2026-1236336221/", "summary": "Ariana Grande ’s “Hate That I Made You Love Me” and Shakira and Burna Boy ’s “Dai Dai” dominate as Billboard ’s No. 1 global songs for summer 2026. The songs rule recaps covering Memorial Day through Labor Day for the Billboard Global 200 and Billboard Global Excl. U.S. charts, respectively. Related Ella Langley s Choosin Texas Is No. 1 on Billboard s Songs of the Summer Chart for 2026 — a Historic One for Country Music Summer Songs 1958-2026: The Top 10 Tunes of Each Summer Which Artists Have Had the Most Success All-Time on Billboard’s Songs of the Summer Chart? The retrospectives reflect performance on the weekly Global 200 and Global Excl. U.S. from charts dated June 6 through Sept. 12. The recaps rank songs based on streaming and sales activity culled from more than 200 territories around the world, as compiled by Luminate. The Global 200 is inclusive of worldwide data and Global Excl. U.S. comprises data from territories excluding the United States. Titles among the top 10 2025 global summer hits were ineligible to appear on this year’s season-ending tallies. (Notably, countries in the Southern Hemisphere were not in summer the past three months. Still, the lists below might help music fans in those territories channel sultry summer vibes.) “Hate That I Made You Love Me” launched at No. 1 on the Global 200 dated June 13 and has led for three total weeks, while placing in the top five continuously since its debut. The song is the lead single from Grande’s studio album petal , which, in August, opened as her seventh No. 1 on the U.S.-based Billboard 200 . “Dai Dai (FIFA World Cup Official Song 2026)” ran up 10 consecutive weeks atop Global Excl. U.S. (July 4-Sept. 5). The song, which became the first official World Cup anthem to lead the chart, benefited from World Cup performances that bookended celebrations of the latest edition of soccer’s signature competition. Shakira and Burna Boy sang it for a reported 80,000-plus fans at the opening ceremony June 11 at Mexico City’s Estadio Azteca. During the final match on July 19, Shakira, Justin Bieber, BTS and Madonna headlined the first-ever World Cup final halftime show , also featuring Burna Boy, among others, at MetLife Stadium in East Rutherford, N.J., an 11-minute showcase that included “Dai Dai.” Billboard Global 200 Top 10 Songs, Summer 2026: No. 1, “Hate That I Made You Love Me,” Ariana Grande No. 2, “Choosin’ Texas,” Ella Langley No. 3, “Billie Jean,” Michael Jackson No. 4, “Dai Dai (FIFA World Cu", "date_str": "2026-09-09T14:24:53+00:00", "hash": "91b8dbb3c2e673093a51d7b72577c8d2e0a9530f85a954b9738e6d103edc92f1", "title_fa": "آریانا گرانده، شکیرا و برنا بوی اسکور برترین آهنگ‌های تابستانی ۲۰۲۶ در نمودارهای جهانی بیلبورد", "summary_fa": "آهنگ آریانا گرانده «بغض از اینکه باعث شدم تو را دوست داشته باشی» و «دای دای» از شکیرا و برنا پسر به‌عنوان آهنگ‌های شماره 1 جهانی بیلبورد برای تابستان 2026 غالب هستند. قانون آهنگ‌ها به طور خلاصه روز یادبود تا روز کارگر را برای Billboard Global 200 و Billboard Global Excl پوشش می‌دهد. نمودارهای ایالات متحده، به ترتیب. مربوط به الا لنگلی Choosin Texas Is No. 1 در جدول آهنگ‌های تابستانی بیلبورد برای سال 2026 - یک آهنگ تاریخی برای آهنگ‌های تابستانی موسیقی کانتری 1958-2026: 10 آهنگ برتر هر تابستان کدام هنرمندان بیشترین موفقیت را در جدول آهنگ‌های تابستانی بیلبورد داشته‌اند؟ گذشته نگرها عملکرد هفتگی Global 200 و Global Excl را منعکس می کند. ایالات متحده از نمودارهای تاریخ 6 ژوئن تا 12 سپتامبر. خلاصه‌ها آهنگ‌ها را بر اساس فعالیت‌های پخش و فروش که از بیش از 200 منطقه در سراسر جهان جمع‌آوری شده‌اند، رتبه‌بندی می‌کنند. Global 200 شامل داده های سراسری و جهانی است. ایالات متحده شامل داده های مربوط به سرزمین هایی به استثنای ایالات متحده است. عناوینی که در میان 10 فیلم برتر جهانی تابستان 2025 قرار گرفتند، واجد شرایط حضور در فهرست پایان فصل امسال نبودند. (به ویژه، کشورهای نیمکره جنوبی در سه ماه گذشته در تابستان نبودند. با این وجود، فهرست‌های زیر ممکن است به طرفداران موسیقی در آن مناطق کمک کند تا حال‌های گرم تابستانی را ایجاد کنند.) «بغض از اینکه باعث شدم تو را دوست داشته باشی» در رتبه اول جهانی 200 در تاریخ 13 ژوئن قرار گرفت و در مجموع سه هفته پیشتاز بوده است، در حالی که از زمان اولین حضور خود پیوسته در بین پنج رتبه برتر قرار گرفته است. این آهنگ تک آهنگ اصلی از گلبرگ آلبوم استودیویی گرانده است که در ماه اوت به عنوان هفتمین شماره 1 او در بیلبورد 200 مستقر در ایالات متحده افتتاح شد."}, {"source": "Billboard", "title": "Don Toliver, Doja Cat & Noah Kahan to Appear in Season 5 of Amazon Music Live", "link": "https://www.billboard.com/music/music-news/amazon-music-live-2026-don-toliver-doja-cat-noah-kahan-1236336222/", "summary": "Amazon Music Live unveiled its lineup for season five of the concert series, featuring performances from Doja Cat, Don Toliver, Noah Kahan and more. The pre-taped concerts will air directly after Thursday Night Football on Amazon Music, Prime Video and Twitch. Kahan will kick off the series on Sept. 24, which takes fans inside his Great Divide World Tour farewell show at T-Mobile Park in Seattle. 2026 has been a banner year for Toliver. He notched his first No. 1 album atop the Billboard 200 following the release of his OCTANE album in January. The Cactus Jack artist wrapped up the second North American leg of his OCTANE World Tour in Brooklyn over the weekend, and the raucous Barclays Center show will stream on Amazon Music live on Oct. 1. Toliver had plenty of guests join him throughout the trek and the surprises continued in Brooklyn with appearances from Cardi B, Busta Rhymes, Sexyy Red and more. Doja Cat is slated to kick off the North American leg of her Tour Ma Vie world tour on Oct. 1 in Detroit, and she s set to celebrate her 31st birthday on the road with a special concert at The Forum in Los Angeles come Oct. 22, which is the day after she blows out her candles. The show will be part of Amazon Music Live this season on Oct. 29. Rounding out the season, Lainey Wilson will be taking over Mohegan Sun Arena on Oct. 10, which serves as a return to the venue where the singer played her first arena show in 2023. The performance will air on Oct. 15, following Thursday Night Football s matchup featuring the Seattle Seahawks paying a visit to the Denver Broncos. Amazon Music Live", "date_str": "2026-09-09T14:13:38+00:00", "hash": "78d66edbc5289621f39fd6a4c0607c9c0bcc12374f4401e5ef1785946fa7a200", "title_fa": "Don Toliver، Doja Cat و Noah Kahan در فصل 5 آمازون Music Live ظاهر می شوند", "summary_fa": "آمازون موزیک لایو ترکیب خود را برای فصل پنجم این مجموعه کنسرت با اجرای دوجا گربه، دان تولیور، نوح کاهان و غیره رونمایی کرد. کنسرت های از پیش ضبط شده مستقیماً بعد از پنجشنبه شب فوتبال در آمازون موزیک، پرایم ویدیو و توییچ پخش می شود. کاهان این سریال را در 24 سپتامبر آغاز خواهد کرد، که طرفداران را به نمایش خداحافظی تور جهانی Great Divide در پارک T-Mobile در سیاتل می برد. سال 2026 برای تولیور یک سال تبلیغاتی بوده است. او اولین شماره اش را زد. 1 آلبوم در بالای بیلبورد 200 پس از انتشار آلبوم OCTANE او در ژانویه. هنرمند کاکتوس جک دومین مرحله از تور جهانی OCTANE خود را در آمریکای شمالی در آخر هفته در بروکلین به پایان رساند، و نمایش پر سر و صدا مرکز Barclays در تاریخ 1 اکتبر به صورت زنده از آمازون موزیک پخش خواهد شد. تولیور مهمانان زیادی را در طول سفر به او ملحق کردند و ش ed items chosen by the late Queen of Country, as well as the Acoustic Suites, which feature Parton s acoustic guitars and personally curated album art and other instruments, a custom leather SongTeller journal and optional in-room songwriting sessions. The Six Sisters suites , inspired by the singer s strong bond with her five sisters, can host up to six guests and features a record player with Dolly s albums, nearly endless vanity space and a large living room area with a curved couch. In addition, the hotel will feature the elaborate, two-story SongTeller Suite, as well as 9 to 5 Music Moments, which will fill the air in the Listening Lobby with one of Parton s iconic songs at the top of every hour. Guests can also dip into the It s All Writing Hour, a creative writing and journaling hour in the Listening Lobby that will provide guests with supplies to write their own hit song. The hotel — created by Parton and entertainment company Herschend — will also feature a number of music venues, including Parton s Live, with a full menu and bar and live music every night of the week, the Jolene s lounge, which will host nightly performances from the city s up-and-coming songwriters and singers and the SongTeller Cafe in the lobby. The Life of Many Colors Museum , slated to open in October on the third floor of the SongTeller Hotel, will be the largest exhibit celebrating [Parton s] life in the world to date, spanning every dynamic decade from the top of the mountains to the top of the world, according to the hotel s website. It promises to employ state-of-the-art technology used to film Parton earlier this year to allow the Jolene singer to narrate her life in music and movies, family and faith, combined in a kaleidoscope of dreams, hopes, and, of course, dazzling style. Her mosaic of memories, as songwriter, actress, musician, philanthropist, the Smoky Mountain Songbird and global icon, create the gritty and glittery backdrop for her story to unfold. The Museum will also host an Imagination Library zone paying homage to t", "date_str": "2026-09-09T13:30:22+00:00", "hash": "0e46273c56a096ea425409bdca73033d3d5d344e92ea106332b00e6023e5031e", "title_fa": "تاریخ افتتاحیه هتل SongTeller Dolly Parton و موزه Life of Many Colors در نشویل", "summary_fa": "تاریخ افتتاح هتل و موزه دالی پارتون در نشویل نزدیک است. هتل SongTeller و موزه Life of Many Colors به ​​طور رسمی در 29 سپتامبر افتتاح می شود و دو پروژه بزرگ را که نماد کشور قبل از مرگش در 80 سالگی در 25 اوت در حال کار بود، به ثمر رساند. این هتل دارای 245 اتاق و سوئیت میهمان است، از جمله اتاق‌های کینگ با چشم‌انداز وسیع از مرکز شهر نشویل و رودخانه کامبرلند، همه با آیتم‌های انتخاب شده توسط ملکه فقید کانتری، و همچنین سوئیت‌های آکوستیک، که دارای گیتارهای آکوستیک پارتون و هنر آلبوم شخصی و سایر سازها، یک اتاق آهنگ چرمی سفارشی و جلسه آهنگ‌نویس ژورنال است. سوئیت های Six Sisters، الهام گرفته از پیوند قوی خواننده با پنج خواهرش، می توانند تا شش مهمان را میزبانی کنند و دارای یک دستگاه ضبط با آلبوم های دالی، فضای روشویی تقریبا بی پایان و یک اتاق نشیمن بزرگ با یک کاناپه منحنی است. علاوه بر این، این هتل دارای سوئیت استادانه و دو طبقه SongTeller و همچنین 9 تا 5 لحظه موسیقی است که هوای لابی Listening را با یکی از آهنگ های نمادین پارتون در هر ساعت پر می کند. مهمان‌ها همچنین می‌توانند در It s All Writing Hour، یک ساعت نوشتن خلاقانه و ژورنال‌نویسی در لابی Listening که وسایلی را برای مهمانان فراهم می‌کند تا آهنگ موفق خود را بنویسند، بپردازند. این هتل که توسط Parton و شرکت سرگرمی هرشند ایجاد شده است، همچنین دارای چندین مکان موسیقی، از جمله Partons Live، با منوی کامل و بار و موسیقی زنده هر شب در هفته، سالن Jolene است که میزبان اجراهای شبانه از ترانه سرایان و خوانندگان جدید شهر و کافه SongTeller در لابی است."}, {"source": "Billboard", "title": "For King & Country, CeCe Winans, TobyMac Among GMA Dove Awards First Round of Performers & Presenters", "link": "https://www.billboard.com/music/awards/for-king-country-cece-winans-tobymac-gma-dove-awards-1236336035/", "summary": "The upcoming 57th annual GMA Dove Awards is gearing up to be a star-studded event. For King Country, CeCe Winans, Anthony Brown, Julie Chen Moonves, Karen Peck, Lisa Knowles Smith and Sarai Rivera are all slated to present, while the first round of performers are TobyMac, Anne Wilson, Chosen Road, Tasha Cobbs Leonard and Tauren Wells. This year s nominees for artist of the year are Lauren Daigle, Brandon Lake, Josiah Queen, Phil Wickham and CeCe Winans. For King Country is also up for rap/hip-hop recorded song of the year, while Wilson is up for country/roots recorded song of the year. Chosen Road is up for bluegrass recorded song of the year, Cobbs Leonard is up for honors including traditional Gospel recorded song of the year, and Wells is up for contemporary Gospel recorded song of the year, and TobyMac is up for short form music video of the year. Additionally, this year will feature the introduction of a new accolade, the Community Impact Award for Peace Purpose, presented by Jesus Calling. The award is inspired by the late Sarah Young, the author of the best-selling Jesus Calling book, and recognizes an organization that does meaningful, faith-driven work beyond the music industry. The inaugural recipient is God Behind Bars, a nonprofit that brings a faith-driven message to incarcerated individuals and their families. Chen Moonves will introduce and present the honor. More performers and presenters will be revealed in coming weeks. The upcoming GMA Dove Awards will be held Oct. 6, 2026 at Nashville s Bridgestone Arena. The show will air on TBN and on the TBN+ app on Friday, Oct. 9 at 7:30 p.m. and 10 p.m. ET and will also be simulcast on SiriusXM The Message. An encore presentation will air on TBN and on the TBN+ app on Oct. 17 at 7:30 p.m. and 10 p.m. ET. The 57th annual GMA Dove Awards are produced by the Gospel Music Association, in partnership with TPR. The GMA s Jackie Patillo and Justin Fratt, in addition to artist, songwriter and GMA Dove Awards host Tauren Wells serve as executive producers, while Curtis Stoneberger and Paul Wright serve as producers. Russell E. Hall returns as director, with Scott Moore and Go Live Productions serving as production manager.", "date_str": "2026-09-09T13:00:00+00:00", "hash": "3069013acdd79e6d53b5864adce461a3b8e9e011e151c708fd9a546619667a4c", "title_fa": "برای King & Country، CeCe Winans، TobyMac در میان جوایز GMA Dove دور اول مجریان و مجریان", "summary_fa": "پنجاه و هفتمین دوره جوایز سالانه GMA Dove در حال آماده شدن است تا یک رویداد پر ستاره باشد. برای King Country، CeCe Winans، Anthony Brown، Julie Chen Moonves، Karen Peck، Lisa Knowles Smith و Sarai Rivera همگی قرار است حضور داشته باشند، در حالی که دور اول اجراکنندگان TobyMac، Anne Wilson، Chosen Road، Tasha Cobbs Leonard و Tauren Wells هستند. نامزدهای امسال هنرمند سال عبارتند از: لورن دایگل، براندون لیک، جوزیا کوئین، فیل ویکهام و سی سی وینز. برای کینگ کانتری نیز به عنوان آهنگ ضبط شده رپ/هیپ هاپ سال انتخاب شده است، در حالی که ویلسون به عنوان آهنگ سال ضبط شده کانتری/ریشه انتخاب شده است. Chosen Road برای بهترین آهنگ سال ضبط شده بلوگراس، کابز لئونارد برای افتخارات از جمله آهنگ سنتی سال ضبط شده انجیل، و ولز برای آهنگ ضبط شده انجیل معاصر سال، و TobyMac برای فرم کوتاه موزیک ویدیوی سال انتخاب شده است. علاوه بر این، امسال با معرفی یک جایزه جدید، جایزه تاثیر جامعه برای هدف صلح، توسط عیسی کالینگ ارائه خواهد شد. این جایزه با الهام از سارا یانگ فقید، نویسنده کتاب پرفروش عیسی ندای الهام گرفته شده است و سازمانی را که کار معنادار و مبتنی بر ایمان فراتر از صنعت موسیقی انجام می دهد، به رسمیت می شناسد. دریافت‌کننده افتتاحیه خدا پشت میله‌ها است، یک سازمان غیرانتفاعی که پیامی مبتنی بر ایمان را برای افراد زندانی و خانواده‌هایشان به ارمغان می‌آورد. چن مونوز این افتخار را معرفی و ارائه خواهد کرد. مجریان و مجریان بیشتری در هفته های آینده معرفی خواهند شد. جوایز آتی GMA Dove در 6 اکتبر 2026 در ورزشگاه بریجستون نشویل برگزار خواهد شد. این برنامه جمعه 9 اکتبر ساعت 19:30 از شبکه TBN و برنامه +TBN پخش خواهد شد. و ساعت 10 شب ET و همچنین به صورت همزمان در SiriusXM The Message پخش خواهد شد."}, {"source": "Billboard", "title": "Los Gemelos de Sinaloa Announce ‘The Gemeliza’ Album & Tour for 2026", "link": "https://www.billboard.com/music/latin/los-gemelos-de-sinaloa-the-gemeliza-album-and-tour-2026-1236336098/", "summary": "After debuting this year on the Billboard charts with their collaboration with Clave Especial and Fuerza Regida Ferrari, which reached No. 1 on Hot Regional Mexican Songs, Los Gemelos de Sinaloa are set to begin a new chapter alongside Street Mob Records, with a new album and tour, Billboard can exclusively announce today (Sept. 9). The Gemeliza Album will arrive on Sept. 24, while The Gemeliza Tour, promoted by Live Nation, will kick off on Oct. 23 at the Arizona Financial Theatre in Phoenix, Arizona, marking the duo s first tour in three years. We’re really excited to get back on the road, be with our fans, and finally bring this music to them live, Los Gemelos de Sinaloa said in a statement shared with Billboard . We’ve been spending so much time in the studio creating new music, and I can’t wait for everyone to hear the album on September 24th and then experience these songs together with us on tour. Comprised of brothers Juan Moisés and Roberto Cárdenas, originally from Paramount, California, Los Gemelos de Sinaloa first gained recognition on TikTok and YouTube a couple of years ago with their corridos sierreños, and today they have nearly 8 million monthly listeners on Spotify. In April of this year, they signed with Street Mob Records, the label of Jesús Ortiz Paz from Fuerza Regida, and shortly after made their debut on the Billboard charts with Ferrari, which entered the Billboard Hot 100 (No. 86), reached No. 6 on Hot Latin Songs and landed at No. 1 on Hot Regional Mexican Songs (chart dated May 2.) Their hits also include Amor, No Le Aflojo, Si Me Ven and Ahora Todo es Diferente. The Gemeliza Tour will visit cities such as El Paso, Chicago, Denver and Atlanta, before concluding on Dec. 12 at the YouTube Theater in Inglewood, California. General ticket sales begin Friday (Sept. 11) at 10 a.m. local time via LiveNation.com. Check out all the announced dates below: Oct. 23 — Phoenix, AZ — Arizona Financial Theatre Oct. 24 — El Paso, TX — Abraham Chavez Theatre Oct. 30 — Irving, TX — The Pavilion at Toyota Music Factory Nov. 6 — Chicago, IL — Aragon Ballroom Nov. 13 — Denver, CO — Fillmore Auditorium Nov. 22 — Atlanta, GA — Coca-Cola Roxy Nov. 25 — San Jose, CA — San Jose Civic Nov. 28 — Anaheim, CA — Honda Center Dec. 12 — Inglewood, CA — YouTube Theater", "date_str": "2026-09-09T13:00:00+00:00", "hash": "ed355665611607ade213a4fbd0475e029d4e0c70b0ed5fd5de7f085c62c12a75", "title_fa": "Los Gemelos de Sinaloa آلبوم و تور «The Gemeliza» را برای سال 2026 معرفی کرد.", "summary_fa": "Los Gemelos de Sinaloa پس از حضور در نمودارهای بیلبورد امسال با همکاری آنها با Clave Especial و Fuerza Regida Ferrari که به رتبه 1 در آهنگ های Hot Regional Mexican Songs رسید، قرار است فصل جدیدی را در کنار Street Mob Records با آلبوم و تور جدید آغاز کند. آلبوم Gemeliza در 24 سپتامبر وارد بازار می شود، در حالی که The Gemeliza Tour که توسط Live Nation تبلیغ می شود، در اکتبر آغاز می شود. 23 در تئاتر مالی آریزونا در فینیکس، آریزونا، اولین تور این دو در سه سال گذشته را رقم زد. Los Gemelos de Sinaloa در بیانیه‌ای که با Billboard به اشتراک گذاشته شد، گفت: ما واقعاً هیجان‌زده هستیم که به جاده بازگردیم، در کنار طرفداران خود باشیم و در نهایت این موسیقی را به صورت زنده برای آنها بیاوریم. ما زمان زیادی را در استودیو صرف ساختن موسیقی جدید کرده‌ایم، و من نمی‌توانم منتظر بمانم تا همه آلبوم را در 24 سپتامبر بشنوند و سپس این آهنگ‌ها را با ما در تور تجربه کنند. Los Gemelos de Sinaloa متشکل از برادران Juan Moisés و Roberto Cárdenas، که اصالتاً اهل پارامونت، کالیفرنیا هستند، برای اولین بار چند سال پیش در TikTok و YouTube با corridos sierreños خود به رسمیت شناخته شدند و امروز آنها تقریباً 8 میلیون شنونده ماهانه در Spotify دارند. در آوریل سال جاری، آنها با Street Mob Records، لیبل Jesús Ortiz Paz از Fuerza Regida قرارداد امضا کردند و مدت کوتاهی پس از آن اولین حضور خود را در نمودارهای بیلبورد با فراری انجام دادند، که وارد Billboard Hot 100 (شماره 86) شد، به شماره 6 در Hot Latin Songs (در Mexicanted Maytong Songs) رسید. 2.) موفقیت های آنها همچنین شامل Amor، No Le Aflojo، Si Me Ven و Ahora Todo es Diferente است. تور Gemeliza از شهرهایی مانند ال پاسو، شیکاگو،"}, {"source": "Billboard", "title": "‘SNL UK’ Announces Musical Guests, Hosts For Opening Weeks of Season 2", "link": "https://www.billboard.com/culture/tv-film/snl-uk-musical-guests-hosts-season-2-1236336299/", "summary": "Saturday Night Live U.K. has set the hosts and musical guests for the first three episodes of its second season. The British spinoff of the legendary New York-based NBC sketch show — which concluded its 51st season earlier this year — will roll out the first of six episodes beginning this weekend with host Jeff Goldblum and musical guest CMAT, according to an Instagram post announcing the lineups. The cast of 11 somewhat unknown British stand-up comedians and social media stars who starred in the first-ever sanctioned overseas version of the show, which debuted earlier this year, will all return for season two. That means that Hammed Animashaun, Ayoade Bamgboye, Larry Dean, Celeste Dring, George Fouracres, Ania Magliano, Annabel Marlow, Al Nash, Jack Shep, Emma Sidi and Paddy Young will be back for six more shows this year, followed by more episodes in 2027. According to The Hollywood Reporter , Freddie Meredith ( Such Brave Girls ) will join the cast this go-round after the first season debuted to relatively positive reviews. Following Goldblum, actor-comedian Jamie Demetriou ( Fleabag ) is up on Sept. 19 with rock duo Royal Blood as musical guest, followed by Chicken Soup Date host Amelia Dimoldenberg and U.K. singer Rachel Chinouriri on Sept. 26. SNL producer/creator Lorne Michaels is executive producer of the U.K. version, with James Longman serving as lead producer. In addition, Laura Claxton has been promoted to co-head writer, with Heather MacVean signing on as costume designer. Sinead Oldnall will lead the U.K. talent team as director of on-screen talent. The inaugural season of SNL U.K. kicked off on March 21 of this year with SNL veteran Tina Fey as host and Wet Leg as musical guest. The rest of the season featured actors Jamie Dornan ( Trolls World Tour ) , Riz Ahmed ( Sound of Metal ), Nicola Coughlan ( Derry Girls ), Aimee Lou Wood ( Sex Education ), Hannah Waddingham ( Ted Lasso ), Ncuti Gatwa ( Doctor Who ) and comedian Jack Whitehall. The season s musical guests also included Wolf Alice, Kasabian, Jorja Smith, Foo Fighters, MEEK, Myles Smith and Holly Humberstone. Check out the promo for the first episode of season two starring Goldblum and newbie Meredith below. View this post on Instagram", "date_str": "2026-09-09T12:32:35+00:00", "hash": "a9accafd85c0f6230752c6fe988ba38d592cd7fd8f9b951eb2d0b22671d9e20c", "title_fa": "'SNL UK' مهمانان موزیکال، میزبانان هفته های افتتاحیه فصل 2 را اعلام کرد", "summary_fa": "Saturday Night Live U.K میزبانان و مهمانان موزیکال سه قسمت اول فصل دوم خود را تعیین کرده است. طبق یک پست اینستاگرامی که خط‌آپ‌ها را اعلام می‌کند، اسپین‌آف بریتانیایی برنامه افسانه‌ای اسکچ NBC مستقر در نیویورک - که پنجاه و یکمین فصل خود را در اوایل امسال به پایان رساند - اولین قسمت از شش قسمت را که این آخر هفته با مجری جف گلدبلوم و مهمان موسیقی CMAT آغاز می‌شود، پخش خواهد کرد. بازیگران 11 استندآپ کمدین و ستاره های رسانه های اجتماعی تا حدی ناشناخته بریتانیایی که در اولین نسخه تحریم شده در خارج از این سریال که در اوایل امسال پخش شد، بازی کردند، همگی برای فصل دوم بازخواهند گشت. این بدان معناست که Hammed Animashaun، Ayoade Bamgboye، Larry Dean، Celeste Dring، George Fouracres، Ania Magliano، Annabel Marlow، Al Nash، Jack Shep، Emma Sidi و Paddy Young امسال برای شش نمایش دیگر بازخواهند گشت و پس از آن در سال 2027 قسمت های بیشتری عرضه خواهند شد. بر اساس گزارش هالیوود ریپورتر، فردی مردیت (دختران چنین شجاع) پس از انتشار اولین فصل با نقدهای نسبتاً مثبت، به این گروه بازیگران خواهد پیوست. پس از گلدبلوم، جیمی دمتریو (Fleabag) بازیگر و کمدین در 19 سپتامبر با دو راک رویال بلاد به عنوان مهمان موزیکال، و پس از آن آملیا دیمولدنبرگ مجری سوپ مرغ و راشل چینوریری خواننده بریتانیایی در 26 سپتامبر. تهیه کننده و خالق SNL، تهیه کننده اجرایی مایکل، لورن است. نسخه، با جیمز لانگمن به عنوان تهیه کننده اصلی. علاوه بر این، لورا کلاکستون به عنوان یکی از نویسندگان، با امضای هدر مک وین به عنوان طراح صحنه و لباس، ارتقا یافته است. Sinead Oldnall به عنوان کارگردان استعدادهای روی پرده، تیم استعدادهای درخشان بریتانیا را رهبری خواهد کرد. فصل افتتاحیه SNL U.K در 21 مارس سال جاری با Tina Fey کهنه کار SNL به عنوان"}, {"source": "Billboard", "title": "Suno Launches First AI Music Models ‘in Partnership With the Music Industry’", "link": "https://www.billboard.com/pro/suno-launches-ai-music-models-partnership-with-music-biz/", "summary": "Suno launched v6, its latest batch of AI music models on Wednesday (Sept. 9) — its first in partnership with the music industry, as the company says. Suno, which was recently valued at $5.4 billion, also announced that in the future it will be launching products to provide AI-enabled remixing, sampling and other derivative features for music from participating partners. The news comes just hours after Suno inked its latest music partnership with French giant Believe . Alongside Warner Music Group and BMG, Suno s two other music industry allies, Believe s participating music will train the v6 models, along with what s called user inputs. On a special bonus episode of Billboard On the Record, Mikey Shulman , CEO and co-founder of Suno, explains the training process and how user input plays into it. Related Suno Inks Strategic Partnership With Believe Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction When users make a song, they will implicitly tell us whether it is good or bad — or more accurately, [Suno] will give users two songs and they will implicitly tell us one of those is better than the other, Shulman says. We are able to take that signal and learn from it what makes a song particularly catchy, particularly good and use that information about these differences between songs to steer our models toward making music better. Jack Brody , chief product officer at Suno, clarifies that while Suno s music industry partners will receive a revenue share for their contributions to Suno, it s not in exchange for training. We consider this [the] partnership launching, and that s why the payment starts, Brody says. But it s not because of the training data or the way that we built the model itself. It s actually everything else the part the partnership enables in the future I think the wrong way to think about these deals is that these deals are about making our models better. It s not really about the data. According to Suno, there are three products within this new roll out — v6, v6 Wild and v6 Mini — all of which are said to be the fastest and highest audio quality of any of their models to date. Suno will also retire its previous models, and as of Sept. 3, the company has significantly limited downloads of its music — all of which were first promised in Suno s partnership with WMG in late 2025. A blog post about v6 details some of the new features available, includ", "date_str": "2026-09-09T11:57:00+00:00", "hash": "22607ebff928386ff5c273fdbe47d3663856133fb05c0ce1f25aa76501c6e926", "title_fa": "سونو اولین مدل های موسیقی هوش مصنوعی را با همکاری صنعت موسیقی راه اندازی کرد", "summary_fa": "سونو نسخه ۶، آخرین دسته از مدل‌های موسیقی هوش مصنوعی خود را در روز چهارشنبه (۹ سپتامبر) راه‌اندازی کرد – همانطور که این شرکت می‌گوید اولین آن با همکاری صنعت موسیقی است. سونو که اخیراً 5.4 میلیارد دلار ارزش داشت، همچنین اعلام کرد که در آینده محصولاتی را برای ارائه ریمیکس، نمونه برداری و سایر ویژگی های مشتق شده برای موسیقی از شرکای شرکت کننده با هوش مصنوعی عرضه خواهد کرد. این خبر تنها چند ساعت پس از آن منتشر شد که سونو آخرین همکاری موسیقی خود را با غول فرانسوی Believe امضا کرد. در کنار گروه موسیقی Warner و BMG، دو متحد دیگر سونو در صنعت موسیقی، موسیقی شرکت‌کننده Believe مدل‌های v6 را همراه با آنچه ورودی‌های کاربر نامیده می‌شود، آموزش خواهند داد. در قسمت جایزه ویژه Billboard On the Record، مایکی شولمن، مدیرعامل و یکی از بنیانگذاران Suno، روند آموزش و نحوه ورود ورودی کاربر به آن را توضیح می دهد. همکاری استراتژیک Suno Inks مرتبط با Believe Billboard برای افزودن آلبوم های رسانه های هوشمند به عنوان فرمت های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را بعد از محکومیت قتل Tupac Shakur انجام می دهد وقتی کاربران آهنگی را می سازند، به طور ضمنی به ما می گویند که خوب است یا بد - یا به طور دقیق تر، [Suno] به طور ضمنی به ما می گویند که یکی از آن دو آهنگ بهتر است و آنها به ما می گویند. شولمن می گوید دیگر. ما می‌توانیم آن سیگنال را بگیریم و از آن بیاموزیم که چه چیزی یک آهنگ را به‌ویژه جذاب و به‌ویژه خوب می‌کند و از اطلاعات مربوط به این تفاوت‌ها بین آهنگ‌ها برای هدایت مدل‌هایمان به سمت بهتر کردن موسیقی استفاده کنیم. جک برودی، مدیر تولید در سونو، تصریح می‌کند که در حالی که شرکای صنعت موسیقی سونو سهم"}, {"source": "Billboard", "title": "All-Star Cast For Billie Eilish-Led ‘The Bell Jar’ Adaptation Revealed", "link": "https://www.billboard.com/culture/tv-film/billie-eilish-the-bell-jar-adaptation-cast-revealed-1236336286/", "summary": "Billie Eilish will be surrounded by an all-star cast when she makes her feature film acting debut in director Sarah Polley s anticipated adaptation of Sylvia Plath s 1963 novel The Bell Jar . According to Variety , two-time Oscar winner Eilish will play the main character Esther Greenwood in the big screen version of Plath s semi-autobiographical book about an aspiring writer juggling a magazine summer internship in New York as she struggles with anxiety and societal expectations on women of the 1950s. The only novel written by Plath, who died by suicide a month after the book was released in the U.K., was first adapted for the screen in 1979, with several stalled attempts to reboot it for the cinema over the past two decades as vehicles for Julia Stiles and Dakota Fanning. Variety reported that production has wrapped on the movie that Polley ( Women Talking ) directed from her own screenplay. In addition to Eilish, the cast will reportedly feature Oscar nominee Carey Mulligan playing Esther s mother, Mrs. Greenwood, as well as Danielle Deadwyler ( P-Valley ) playing Esther s psychiatrist, Dr. Nolan, The Studio s Ike Barinholtz as wealthy N.Y. radio host Lenny, Heated Rivalry star Connor Storrie as blind date from hell Marco and Dylan Hawco ( Youngblood ) as Esther s first boyfriend, Buddy Willard. The cast for the Focus Features film will also include Lily Taylor ( To the Bone ) as Jay Cee, the editor of Ladies Day magazine, where Esther is hired as an intern, Ella Beatty ( If I Had Legs I d Kick You ) as old friend Joan and Maggie Kuntz ( The Gilded Age ) as Doreen, a fellow intern and Esther s best friend in N.Y. Though the adaptation marks Eilish s first movie role, she has dabbled in acting before. In 2023 she made her acting debut in an episode of Donald Glover and Janine Nabers Amazon Prime limited series Swarm . She also has two Oscars on the shelf already, both for Best Original Song, first in 2022 for the James Bond theme song No Time to Die and again in 2024 for the Barbie movie ballad What Was I Made For? No release date has been announced for the film yet.", "date_str": "2026-09-09T11:52:32+00:00", "hash": "fad66613af08199aaae843a5910414de896eb2c2bc0b41be254ca4a9a4a3bc97", "title_fa": "بازیگران تمام ستاره برای اقتباس «The Bell Jar» به رهبری بیلی آیلیش فاش شد", "summary_fa": "بیلی آیلیش وقتی اولین بازیگری فیلم بلند خود را در اقتباس مورد انتظار سارا پولی از رمان 1963 سیلویا پلات، The Bell Jar انجام داد، توسط یک بازیگر تمام ستاره احاطه خواهد شد. به گزارش ورایتی، آیلیش برنده دو جایزه اسکار، نقش شخصیت اصلی استر گرین‌وود را در نسخه بزرگ کتاب نیمه اتوبیوگرافی پلات در مورد نویسنده‌ای مشتاق که در یک دوره کارآموزی تابستانی در مجله‌ای در نیویورک شعبده بازی می‌کند، در حالی که با اضطراب و انتظارات اجتماعی از زنان دهه 1950 دست و پنجه نرم می‌کند، بازی می‌کند. تنها رمان نوشته شده توسط پلات، که یک ماه پس از انتشار کتاب در بریتانیا در اثر خودکشی درگذشت، برای اولین بار در سال 1979 برای سینما اقتباس شد، با چندین تلاش متوقف شده برای راه اندازی مجدد آن برای سینما در طول دو دهه گذشته به عنوان وسیله نقلیه برای جولیا استایلز و داکوتا فانینگ. ورایتی گزارش داد که تولید فیلمی که پولی (زنان صحبت می کنند) از روی فیلمنامه خودش کارگردانی کرده است به پایان رسیده است. علاوه بر آیلیش، بازیگران این فیلم ظاهراً کری مولیگان نامزد اسکار را در نقش مادر استر، خانم گرین‌وود، و همچنین دانیل ددوایلر (پی-ولی) در نقش روانپزشک استر، دکتر نولان، آیک بارین‌هولتز از استودیو در نقش ثروتمند N.Y. مارکو و دیلن هاوکو (Youngblood) در نقش بادی ویلارد، اولین دوست پسر استر. بازیگران فیلم Focus Features همچنین شامل لیلی تیلور (تا استخوان) در نقش جی سی، سردبیر مجله Ladies Day هستند، جایی که استر به عنوان کارآموز استخدام می‌شود، الا بیتی (اگر پاها داشتم، شما را لگد می‌زدم) در نقش دوست قدیمی جوآن و مگی کونتز (دوست طلایی و بهترین دوست در دوران طلایی، اسطوره‌ای در نقش) N.Y. اگرچه این اقتباس اولین نقش سینمایی ایلیش را نشان می دهد، او قبلاً در بازیگری فعالیت می کرد."}, {"source": "Deadline", "title": "Megan Lawless Joined By Fivel Stewart, Savanah Moss, Liv Morgan & Carter Jenkins In ‘Ping’; Ultimate Media Group & CAA Launch TIFF Market Sales", "link": "https://deadline.com/2026/09/fivel-stewart-savanah-moss-liv-morgan-join-megan-lawless-ping-1237070696/", "summary": "EXCLUSIVE: Production is underway in Mississippi on psychological thriller Ping, starring Obsession actress Megan Lawless. Lawless is joined in the cast by Fivel Stewart (The Recruit), creator Savanah Moss, WWE star Liv Morgan (Bad Lieutenant: Tokyo) and Carter Jenkins (After). Jason Buckley s Ultimate Media Group (UMG) is launching international sales at the TIFF market and [ ]", "date_str": "2026-09-09T14:30:00+00:00", "hash": "26f44925cca6bbd9fe44597fb11bbee2fe0caa5d09aca5fc9e9feabdf85     let currentTab = 'persian';
    let searchQuery = '';

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const items = data[currentTab] || [];
      const filtered = items.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = filtered.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card">
            <div class="news-header">
              <span class="news-num">${num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
