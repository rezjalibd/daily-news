<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۱۷ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۱۷ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۸ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۲۰:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">

        <span class="badge" id="badge-persian">۲۲</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۴۱</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">

        <span class="badge" id="badge-media">۱۷</span>

    <main id="newsContainer" class="news-grid"></main>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">

      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

تکام، ماموریت این گروه جلوگیری از انتقال سامانه‌های تسلیحاتی پیشرفته، فناوری‌های دارای کاربرد دوگانه نظامی و غیرنظامی، اقلام مشمول تحریم و جریان‌های درآمدی غیرقانونی از طریق مرزهای زمینی ایران و دریای خزر است. برد کوپر در این بیانیه گفته است: «تشکیل کارگروه دروازه آهنین، موفقیت محاصره دریایی مستحکم ما علیه ایران را تقویت می‌کند.» فرمانده سنتکام همچنین تاکید کرده است که افزایش همکاری میان نهادهای دولت آمریکا، توانایی جمهوری اسلامی برای تامین مالی تروریسم، بازسازی کارخانه‌های تولید تسلیحات و تجدید ذخایر نظامی خود را بیش از پیش محدود خواهد کرد. سنتکام در بخش دیگری از بیانیه خود اعلام کرده است که محاصره دریایی آمریکا در ماه‌های اخیر از صادرات بیش از ۲۵ میلیارد دلار نفت خام ایران جلوگیری کرده است. این ستاد نظامی همچنین تاکید کرده که محدودیت‌های دریایی علیه تمامی کشتی‌هایی که وارد بنادر ایران می‌شوند یا از آن‌ها خارج می‌شوند، همچنان با سخت‌گیری اجرا خواهد شد. تشکیل کارگروه «دروازه آهنین» نشان‌دهنده گسترش دامنه اقدامات آمریکا از کنترل مسیرهای دریایی به مقابله با انتقال تسلیحات و محموله‌های مشمول تحریم از طریق مرزهای زمینی ایران و دریای خزر است.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D8%B3%D9%86%D8%AA%DA%A9%D8%A7%D9%85_qSVM__v1024x512__box_0%2C0%2C1488%2C782.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۶ آبان • ۱۷:۳۴"}, {"source": "Independent Persian", "title": "تهدید و مذاکره؛ سپاه: شهر زیرزمینی داریم و محدودیت برد موشک را برداشته‌ایم", "link": "https://www.independentpersian.com/node/423086/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D8%AA%D9%87%D8%AF%DB%8C%D8%AF-%D9%88-%D9%85%D8%B0%D8%A7%DA%A9%D8%B1%D9%87%D8%9B-%D8%B3%D9%BE%D8%A7%D9%87-%D8%B4%D9%87%D8%B1-%D8%B2%DB%8C%D8%B1%D8%B2%D9%85%DB%8C%D9%86%DB%8C-%D8%AF%D8%A7%D8%B1%DB%8C%D9%85-%D9%88-%D9%85%D8%AD%D8%AF%D9%88%D8%AF%DB%8C%D8%AA-%D8%A8%D8%B1%D8%AF-%D9%85%D9%88%D8%B4%DA%A9-%D8%B1%D8%A7-%D8%A8%D8%B1%D8%AF%D8%A7%D8%B4%D8%AA%D9%87", "summary": "همزمان با آن که تلاش میانجی‌ها برای رساندن تهران و واشنگتن به ED ، سازمانی فعال در حوزه سلامت روان، نشان می‌دهد این رفتار با برخی شاخص‌های نامناسب سلامت روان ارتباط دارد. براساس این نظرسنجی، ۹۰ درصد کودکان و نوجوانان ۹ تا ۱۷ ساله دست‌کم یک بار از چت‌بات‌های هوش مصنوعی استفاده کرده‌اند. حدود ۵۸ درصد برای انجام تکالیف مدرسه و ۵۷ درصد هنگام احساس غم، استرس، تنهایی یا فشار روانی سراغ هوش مصنوعی می‌روند. همچنین ۱۲ درصد شرکت‌کنندگان گفته‌اند از چت‌بات‌ها برای دوستی یا داشتن همراه استفاده می‌کنند. پژوهشی دیگر نیز نشان داده بود تقریباً یک نفر از هر پنج دانش‌آموز دبیرستانی، خودش یا یکی از دوستانش از هوش مصنوعی برای برقراری رابطه عاشقانه استفاده کرده است. کایلا اندرسون، معاون پژوهش و ارزیابی بنیاد JED، می‌گوید بررسی داده‌ها نشان می‌دهد نوجوانانی که هنگام ناراحتی و فشار روانی به هوش مصنوعی پناه می‌برند، بیشتر از دیگران با مشکلات سلامت روان روبه‌رو هستند. سابقه افکار خودکشی و اقدام به آن نیز در میان این گروه بیشتر بوده است. بچه‌ها چه حسی نسبت به هوش مصنوعی دارند؟ حرف‌های غیرمنتظره ۷ نوجوان 07 شهریور 05 مطالعه &#x27; 18 نوجوانان اکنون صحبت با هوش مصنوعی را به انسان ترجیح می‌دهند 05 آذر 04 مطالعه &#x27; 2 بااین‌حال، پژوهشگران تأکید می‌کنند که این ارتباط به معنای اثبات آسیب‌رسان‌بودن هوش مصنوعی نیست. اندرسون توضیح می‌دهد که هنوز مشخص نیست استفاده از چت‌بات‌ها باعث تشدید مشکلات روانی می‌شود یا نوجوانانی که از قبل با چنین مشکلاتی مواجه بوده‌اند، بیشتر به هوش مصنوعی روی می‌آورند.", "image_url": "https://api2.zoomit.ir/media/child-using-ai-technology-6aef2d7f354e588119e4836e?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۶ آبان • ۱۹:۲۰"}, {"source": "Business Insider", "title": "I don't allow my toddler screen time. Sometimes I envy the parents who do.", "link": "https://www.businessinsider.com/dont-allow-screens-toddler-envy-parents-who-do-2026-11", "summary": "The author said she and her husband have tried very hard to keep their 2-year-old away from screens. She admits it s sometimes harder than expected. Courtesy of Renate Flanagan. Before having kids, my husband and I knew we wanted to keep screens at bay for as long as possible. Now that we have a child, we've mostly stuck to that plan, but it isn't always easy. Sometimes I'm a little envious of those who do allow screens, but I'm still happy with the decision. Even before having a kid, my husband and I discussed our parenting values . We knew we wanted our future child to grow up speaking English and my husband's native language of Dutch . Instead of expensive trips to Disney World , we agreed we would take our child to visit real castles in Europe. We were also aligned on delaying screen time as long as possible. For us, that meant our child wouldn't use cellphones, tablets, or watch television. Now that we have a kid, our theoretical parenting philosophies have been tested against a real-world toddler. We've stuck to our guns, but sometimes we question whether parenting would be easier on us if we let our son have screen time . We've held to our no-screen values, with a few exceptions Our son is almost 3, and for the most part, he has an analog childhood , playing with blocks, cars, and coloring books instead of technology. Do you have a hot take on a common parenting belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. In practice, we've made a few exceptions for screens. Our son is allowed to have video calls with his grandparents. He can watch television with us if it's an educational or news program in Dutch or a cooking show. We made temporary exceptions during the World Cup and the Olympics. But, when it's adult programming, my son tends to lose interest after a few minutes and then prefers to play with his toys. We understand the temptation of letting a screen entertain a toddler Our son has been on the move since he started crawling at 6 months old, and walking at a year old. Since he started crawling, he never stays in one place unless he's sleeping. For most day-to-day activities, we don't mind that our son is a busy, active toddler, but the r به", "image_url": "https://i.insider.com/6ad8eb6a510d67c758d856a2?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۱۹:۵۹"}, {"source": "Business Insider", "title": "AI is changing what it takes to get hired as a mathematician", "link": "https://www.businessinsider.com/ai-math-hiring-academia-papers-journals-phd-charisma-communication-2026-11", "summary": "A math professor at the University of Chicago says AI is changing hiring processes in academia. Jacek Boczarski/Anadolu via Getty Images Mathematicians are struggling as AI upends their field. One professor says that mathematicians need to develop better communication skills to stay relevant. Charisma can help scholars set themselves apart, he said. AI is lowering the barriers to mathematical discovery . One prominent math professor says that means hiring practices in academia need to get a whole lot more personal, and mathematicians need to get a whole lot more eloquent at communicating their ideas. \"I am looking for a narrative of where you want mathematics to go, the technical ability to explain why this may be possible,\" Frank Calegari, a math phenom at the University of Chicago, wrote in a recent essay about what he's looking for in a researcher. At issue for Calegari is the distinct possibility that low-level researcher positions across academia will be filled by students who only got there by churning out AI-generated proofs . A 30-minute discussion, though, would differentiate those slop-producers from promising candidates with a clear vision and a talent for communication. \"The hiring process is going to have to be much more about personal interactions than a paper file,\" Calegari said in his essay, which was posted on Terence Tao's blog. Calegari slammed what he described as \"lazy committees\" that hired students based on a single paper or academic publication, which could now be sired by AI. \"Once we take this approach, we then have the responsibility to train our own graduate students to be better able to communicate mathematics, something that we should take much more seriously,\" he said. Last month, Cornell professor Steven Strogatz remarked that mathematicians with \"rizz,\" a slang term for charisma, had newfound stock because they could explain AI-generated results and turn them into new questions. The brusque push by AI companies into mathematics has caused consternation and head-scratching among many a math geek, as the field ponders how to stay relevant while OpenAI floods the field with hundreds of proposed solutions to the world's most complex problems. Some professors have sworn off AI altogether. Most, however, are trying to find ways to incorporate the technology into their work. Students across the country are also struggling to adapt, demanding that their professors publish clear guidance on how to use AI, if at all. \"We are lacking", "date_str": "2026-11-07T16:17:17+00:00", "hash": "518175f45d76a0b7", "title_fa": "هوش مصنوعی آنچه را که برای استخدام به عنوان یک ریاضیدان لازم است تغییر می دهد", "summary_fa": "یک استاد ریاضی در دانشگاه شیکاگو می گوید هوش مصنوعی در حال تغییر فرآیندهای استخدام در دانشگاه است. Jacek Boczarski/Anadolu از طریق Getty Images ریاضیدانان در حال مبارزه هستند زیرا هوش مصنوعی رشته خود را ارتقا می دهد. یکی از استادان می گوید که ریاضیدانان باید مهارت های ارتباطی بهتری را توسعه دهند تا مرتبط بمانند. او گفت که کاریزما می تواند به دانشمندان کمک کند تا خود را متمایز کنند. هوش مصنوعی موانع کشف ریاضی را کاهش می دهد. یک استاد برجسته ریاضی می‌گوید این بدان معناست که شیوه‌های استخدام در دانشگاه باید کاملا شخصی‌تر شوند و ریاضیدانان باید در انتقال ایده‌های خود بسیار شیواتر باشند. فرانک کالگاری، یک پدیده ریاضی در دانشگاه شیکاگو، در مقاله‌ای اخیر درباره آنچه که در یک محقق به دنبال آن است، نوشت: «من به دنبال روایتی هستم که می‌خواهید ریاضیات به کجا برود، توانایی فنی برای توضیح اینکه چرا این ممکن است ممکن باشد. مشکل کالگاری این است که موقعیت‌های پژوهشگر سطح پایین در سراسر دانشگاه توسط دانشجویانی پر شود که تنها با ارائه شواهد تولید شده توسط هوش مصنوعی به آنجا رسیده‌اند. با این حال، یک بحث 30 دقیقه ای، این تولیدکنندگان را از نامزدهای آینده دار با چشم انداز روشن و استعداد ارتباط متمایز می کند. کالگاری در مقاله خود که در وبلاگ ترنس تائو منتشر شد، گفت: «فرایند استخدام باید بیشتر از یک پرونده کاغذی در مورد تعاملات شخصی باشد. کالگاری آنچه را که او به عنوان «کمیته‌های تنبل» توصیف می‌کند که دانشجویان را بر اساس یک مقاله یا نشریه دانشگاهی استخدام می‌کنند، مورد انتقاد قرار داد، که اکنون می‌تواند توسط هوش مصنوعی اداره شود. او گفت: «زمانی که این رویکرد را در پیش گرفتیم، پس از آن مسئولیت داریم که دانشجویان تحصیلات تکمیلی خود را آموزش دهیم تا بتوانند بهتر ریاضیات را با هم ارتباط برقرار کنند، چیزی که", "image_url": "https://i.insider.com/6aef393a8f37e8e0b5bab064?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI"], "datetime_fa": "۱۶ آبان • ۱۹:۴۷"}, {"source": "Business Insider", "title": "I ordered the same meal at Chipotle and Qdoba. One chain was the clear winner.", "link": "https://www.businessinsider.com/chipotle-vs-qdoba-burrito-bowl-comparison-which-is-better-review-2026-11", "summary": "I was curious which chain offered better value and flavors, so I decided to settle the Chipotle versus Qdoba debate for myself. Savannah Born I ordered a burrito bowl, chips, and spicy salsa at Chipotle and Qdoba to compare the chains. My meal was cheaper at Qdoba, mostly because the chain didn't charge extra for queso or guacamole. Both chains served hefty portions and OK salsa, but Chipotle was my winner for its burrito bowl. Whether for guacamole, queso, or burritos, few things are more polarizing than Chipotle and Qdoba, two of the largest Mexican-inspired restaurant chains in the United States. Compared to Chipotle, a massive publicly traded company with more than 4,000 locations worldwide, Qdoba is modest in size, operating 893 total locations across the United States, Canada, and Japan. Qdoba is a privately owned chain that relies heavily on franchising, which makes up the majority of its locations. The chain reportedly had nearly $1.3 billion in systemwide sales in the US in 2025, according to Technomic data . By comparison, Chipotle generated over $11 billion in systemwide sales in 2025, earning it a spot among the highest-grossing fast-food chains in the US. Another key distinction: the company owns and operates nearly all of its locations. Even so, the chains have a few similarities. Both famously serve customizable cuisine and were founded in Denver in the 1990s. Business aside, as a customer, I was curious which chain offered a better value and more flavorful options. So, I visited both and ordered a similar burrito bowl topped with seven key ingredients, plus a side of chips and spicy salsa. Here's how my meals stacked up in taste, price, and value. I started at Chipotle, where I d eaten many times. Savannah Born Chipotle was my lifeline in college, and I've been pretty loyal to it in recent years during the rare occasions I opt for fast-casual dining . The chain is known for its made-to-order format, allowing customers to customize bowls, tacos, salads, and burritos. It also offers family meal deals , which are discounted bundles for four to six people. Many fans also rave about its six-ingredient guacamole , which is said to be mashed up fresh every day. Then I went to Qdoba, a chain I d never tried. Savannah Born I'd never visited a Qdoba before, but I was open to seeing if the underdog could become my new go-to. Like Chipotle, Qdoba is recognized for its personalized fare. However, I find variety sets it apart. Beyond the basics, Qdoba of", "date_str": "2026-11-07T16:08:01+00:00", "hash": "c84a68f0fbcd95fd", "title_fa": "من همان غذا را در Chipotle و Qdoba سفارش دادم. یک زنجیره برنده آشکار بود.", "summary_fa": "کنجکاو بودم که کدام زنجیره ارزش و طعم بهتری دارد، بنابراین تصمیم گرفتم بحث Chipotle و Qdoba را برای خودم حل کنم. Savannah Born در Chipotle و Qdoba یک کاسه بوریتو،  expenses , and she also contributes to my monthly mortgage payment. Not only has it been financially beneficial, but Jennifer has also become part of our family. As a single mom , I always loved the idea of living with friends later in life. I pictured something like \"The Golden Girls\" — gray hair, grown children, and long days laughing with my closest companions. I never expected that lifestyle to happen at 41, while I was still raising my kids on my own and figuring out what came next. But that all changed this past summer, when I texted my friend Jennifer and asked if she'd consider moving in with us. Jennifer and I weren't very close before this. Sure, we checked in on each other from time to time, and would go to dinner or a movie together every few months, but that was it. Even though we weren't best friends , I still thought she and I would be ideal roommates because we're both clean, organized, and responsible. Plus, we were both looking for a financial reset. I'd been planning a move to Paris and had put my side hustles on the back burner, but when the move fell through, I was stretched thin as a single mom covering a mortgage alone. Similarly, at 49, Jennifer was burned out from leading a media network and a mental-health nonprofit. She was also single, living alone in an apartment — since her kids are all grown — and shouldering all her expenses. We realized that sharing a home could help us both save some money while we figured out our next steps. Because we weren't super close friends to begin with, we didn't have to worry about the arrangement infringing upon our relationship. And as long as my two teenage kids were fine with it, I felt good about the decision. So, after two weeks of discussion, Jennifer moved in. Sharing expenses made room for small joys again It never felt awkward bringing a new person into our home. Sarah Gallucci The first weekend we lived together, I was surprised there wasn't any awkwardness. She fit right in, asking about our shower schedules, what time we woke up and went to bed, and the WiFi password. Thankfully, our two-story home gave everyone enough privacy, with my room on the first floor and Jennifer's and my kids' rooms on the second, so we never felt like we were stepping on each other's toes. Our two-story ho", "date_str": "2026-11-07T16:07:01+00:00", "hash": "025e729d24bf8cd8", "title_fa": "من یک مادر مجرد 41 ساله با 2 نوجوان هستم. شش ماه پیش از دوستم خواستم که با ما نقل مکان کند.", "summary_fa": "زندگی دوستی با من و فرزندانم به هر دوی ما امکان پس انداز پول را داده است. سارا گالوچی برای صرفه جویی در پول، از دوستم جنیفر پرسیدم که آیا او می خواهد با من و دو فرزندم زندگی کند. ما مخارج خانه را با هم تقسیم می کنیم، و او نیز در پرداخت ماهانه وام مسکن من مشارکت می کند. نه تنها از نظر مالی مفید بوده است، بلکه جنیفر نیز بخشی از خانواده ما شده است. به عنوان یک مادر مجرد، همیشه این ایده را دوست داشتم که در آینده با دوستان زندگی کنم. چیزی شبیه «دختران طلایی» را به تصویر کشیدم - موهای خاکستری، کودکان بالغ و روزهای طولانی خندیدن با نزدیکترین همراهانم. من هرگز انتظار نداشتم که این سبک زندگی در 41 سالگی اتفاق بیفتد، در حالی که من هنوز بچه هایم را به تنهایی بزرگ می کردم و می فهمیدم چه اتفاقی می افتد. اما همه چیز در تابستان گذشته تغییر کرد، زمانی که به دوستم جنیفر پیام دادم و از او پرسیدم که آیا او قصد دارد با ما زندگی کند. من و جنیفر قبل از این خیلی صمیمی نبودیم. مطمئناً، ما هر از چند گاهی با هم چک می‌کردیم و هر چند ماه یک بار با هم به شام ​​یا سینما می‌رفتیم، اما تمام شد. با وجود اینکه ما بهترین دوستان نبودیم، هنوز فکر می‌کردم من و او هم اتاقی ایده‌آلی خواهیم بود، زیرا هر دو تمیز، منظم و مسئولیت‌پذیر هستیم. به علاوه، هر دوی ما به دنبال تنظیم مجدد مالی بودیم. من در حال برنامه ریزی برای نقل مکان به پاریس بودم و هوس های جانبی خود را در پشت مشعل قرار داده بودم، اما وقتی این حرکت به پایان رسید، به عنوان یک مادر مجرد که به تنهایی وام مسکن را پوشش می دهد، لاغر شدم. به همین ترتیب، در 49", "image_url": "https://i.insider.com/6aeba742308912814ed7103c?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۶ آبان • ۱۹:۳۷"}, {"source": "Business Insider", "title": "My 15-year-old dog was struggling to walk, so I taught him Pilates. His recovery inspired me to start a business.", "link": "https://www.businessinsider.com/senior-golden-retriever-pilates-inspired-business-2026-11", "summary": "Jillian Loustaunau and her dog, Weasel, at her Pilates studio. Courtesy of Jillian Loustanau Jillian Loustaunau was concerned when her beloved dog, Weasel, began to lose strength in his legs. The fitness instructor introduced him to Pilates moves to build muscle and improve his alignment. His improvement inspired her to launch \"Pawlates 101,\" training other pets in the practice online. This story is based on an interview with Jillian Loustaunau, 36, the owner of a Pilates studio in Kailua, O'ahu. It has been edited for length and clarity. I never imagined that my efforts to help my beloved dog, Weasel, regain his mobility would a) be so successful and b) lead to the launch of my new business. But here I am with a much healthier companion and an enterprise that encourages other animal lovers to help their pets in a similar way. My dog couldn't walk in a straight line Weasel, who turns 16 next month, has always been an active, energetic golden retriever. Before his red coat turned gray six years ago, people would ask me how old he was. \"Ten,\" I'd reply. They nearly always took it to mean 10 months because he looked and behaved like a puppy . One day in May, however, he seemed really off. We were walking home from lunch, just around the block, and he couldn't walk in a straight line. It was almost as if he were drunk, and I wasn't sure if I needed to carry him. Loustanau and Weasel during one of their workouts. Courtesy of Jillian Loustanau It was hard to get a formal diagnosis at the vet. A client at my Pilates studio, a surgical vet, took a look, as well. She did a test where she flipped Weasel's back paw under, and he kept it like that. Sh  هر ایالت ایالات متحده نیاز دارید", "summary_fa": "دستمزدها تقریباً در هر ایالت افزایش یافت، اما هنوز به اندازه ای نیست که بتواند خانه معمولی را بپردازد. Grace Cary/Getty Images درآمد تقریباً در هر ایالت افزایش یافته است، اما خرید خانه آسان‌تر نشده است. درآمد متوسط ​​ملی هنوز 31136 دلار کمتر از هزینه خانه با قیمت متوسط ​​است. داده های Realtor.com نشان می دهد که درآمد اضافی مورد نیاز برای خرید خانه از 2287 تا 98469 دلار متغیر است. تقریباً همه ایالت‌های ایالات متحده در سال گذشته با افزایش درآمد خانوار مواجه شدند، با این حال هنوز برای خرید خانه‌های معمولی کافی نیست. ایالت هایی مانند رود آیلند و ویرجینیا شاهد افزایش نسبتاً زیادی در درآمد از سال 2024 تا 2025 بوده اند - به ترتیب 9.02٪ و 7.85٪ - اما طبق داده های سرشماری ایالات متحده و Realtor.com، پنج رقم اضافی برای استطاعت یک خانه با قیمت متوسط ​​در هر ایالت مورد نیاز است. هانا جونز، اقتصاددان ارشد Realtor.com گفت که اگرچه خانوارها پول بیشتری به دست می آورند، افزایش نرخ وام مسکن از سال گذشته کمکی نمی کند. جونز گفت: «نرخ وام مسکن بیش از یک درصد بیشتر از یک سال گذشته است، که بودجه خریداران را کاهش می‌دهد و سود حاصل از کاهش قیمت مسکن و افزایش درآمد را جبران می‌کند». در سطح ملی، متوسط ​​درآمد خانوار برای خرید خانه با قیمت متوسط ​​در هیچ ایالتی کافی نیست.» متوسط ​​درآمد ملی خانوار در سال 2025 84780 دلار بود که تقریباً 3.8 درصد نسبت به سال قبل افزایش داشت. با این حال، با در نظر گرفتن نرخ وام مسکن 7.32٪ و 10٪ پیش پرداخت، با فرض اینکه نرخ وام مسکن 7.32٪ و پیش پرداخت 10٪ در سپتامبر 2026 باشد، با متوسط ​​قیمت فهرست 419,250 دلار در سپتامبر 2026، این مبلغ 31,136 دلار کمتر از درآمد توصیه شده برای خرید است. Realtor مقدار اضافی مورد نیاز بالاتر", "image_url": "https://i.insider.com/6aedef8880d4b24f18346e47?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۱۷:۵۳"}, {"source": "Business Insider", "title": "Warren Buffett isn't running Berkshire anymore. You wouldn't know it.", "link": "https://www.businessinsider.com/warren-buffett-berkshire-hathaway-earnings-stocks-portfolio-cash-buybacks-abel-2026-11", "summary": "Warren Buffett is the former CEO and chairman of Berkshire Hathaway. Daniel Zuchnik/WireImage Warren Buffett is no longer at the helm of Berkshire Hathaway, but you might not know it. Berkshire bought and sold few stocks last quarter, echoing Buffett's final years in charge. New CEO Greg Abel did ramp up stock buybacks to $9.6 billion worth, the highest figure in years. Warren Buffett is no longer running Berkshire Hathaway, but you almost wouldn't know it. The famed investor's conglomerate reported third-quarter earnings on Saturday, showing minimal stock buying and selling. That was typical during the final years of Buffett's six decades in charge, as the bargain hunter struggled to find deals on stocks and businesses during a historic stock-market boom. He stepped down as Berkshire's CEO at the end of 2025, and as chairman this September. Under new CEO Greg Abel , Berkshire was a net seller of stocks last quarter, buying $2.4 billion and selling $2.8 billion. That's a striking slowdown from the second quarter, when it bought a net $20 billion of stocks. Berkshire's cash pile shrank by around $8 billion, to $357 billion, after subtracting $20.5 billion in Treasury payables. It has still more than doubled in size since the end of 2023, reflecting Buffett's prolonged struggle to find value . One of Abel's key changes, in consultation with Buffett, has been to accelerate buybacks. He repurchased $9.6 billion of Berkshire stock last quarter, marking the busiest period for buybacks in years. That looks to have been a good call, as Berkshire stock has surged from below $500 at the end of September to a record high above $570 this week. Berkshire reported $12.7 billion of operating income, a 6% drop from the same quarter last year. That was fueled by a sharp decline in insurance underwriting income and lower insurance investment income, which offset higher profits from BNSF Railway , Berkshire Hathaway Energy, and the manufacturing, service, and retailing businesses. The conglomerate owns scores of businesses, including Geico, See's Candies, and Duracell, and also holds multibillion-dollar stakes in public companies such as Apple, Coca-Cola, and American Express. Berkshire shareholders will have to wait until next week, when it files its third-quarter portfolio disclosure, to learn what stocks it bought and sold last quarter. Abel has hewed closely to Buffett's approach during his first year as CEO, appearing to follow some classic advice for successors: \"If it", "date_str": "2026-11-07T14:18:18+00:00", "hash": "6067b923c78fa8d3", "title_fa": "وارن بافت دیگر برکشایر را اداره نمی کند. شما آن را نمی دانید.", "summary_fa": "وارن بافت، مدیرعامل و رئیس سابق برکشایر هاتاوی است. دانیل زوشنیک/WireImage وارن بافت دیگر در راس برکشایر هاتاوی نیست، اما ممکن است آن را ندانید. برکشایر در سه ماهه گذشته سهام کمی خرید و فروخت که بازتاب آخرین سال‌های مدیریت بافت است. گرگ آبل، مدیرعامل جدید، بازخرید سهام را به 9.6 میلیارد دلار افزایش داد که بالاترین رقم در سال‌های اخیر است. وارن بافت دیگر برکشایر هاتاوی را اداره نمی کند، اما تقریباً نمی دانید. شرکت سهامی سرمایه گذار مشهور روز شنبه درآمد سه ماهه سوم را گزارش کرد که حداقل خرید و فروش سهام را نشان می دهد. این امر در سالهای پایانی شش دهه ریاست بافت معمولی بود، زیرا شکارچی معامله برای یافتن معاملات سهام و مشاغل در طول رونق تاریخی بازار سهام تلاش می کرد. او در پایان سال 2025 از سمت مدیرعاملی برکشایر کناره‌گیری کرد و در سپتامبر امسال به‌عنوان رئیس هیئت مدیره این شرکت کنار رفت. برکشایر تحت مدیریت جدید، گرگ آبل، یک فروشنده خالص سهام در سه ماهه گذشته بود و 2.4 میلیارد دلار خرید و 2.8 میلیارد دلار فروخت. این کاهش قابل توجهی نسبت به سه ماهه دوم است، زمانی که 20 میلیارد دلار خالص سهام خرید. انباشت نقدی برکشایر پس از کسر 20.5 میلیارد دلار از بدهی های خزانه داری، حدود 8 میلیارد دلار کاهش یافت و به 357 میلیارد دلار رسید. اندازه آن از پایان سال 2023 تاکنون بیش از دو برابر شده است که نشان دهنده تلاش طولانی بافت برای یافتن ارزش است. یکی از تغییرات کلیدی آبل، با مشورت بافت، تسریع ss Insider I set the oven to 350 degrees Fahrenheit and buttered a 9-inch-by-13-inch pan. I also washed, peeled, and quartered my sweet potatoes. I placed my sweet potatoes in a large pot and covered them with cold water. Anneta Konstantinides/Business Insider I brought the pot to a boil over high heat, then lowered the heat to maintain a low boil for 20 minutes while the potatoes cooked. You'll know they're ready when the potatoes are fork-tender. I drained the potatoes, placed them in a large bowl, and added the butter and seasonings. Anneta Konstantinides/Business Insider I threw in the brown sugar, vanilla, salt, cinnamon, and butter, adding the latter in knobs so it'd be easy to mix. Then it was time to mash. Anneta Konstantinides/Business Insider The recipe recommends using a potato masher to mix the ingredients until they're \"well combined.\" I don't own one, so I simply used a big wooden serving fork — it worked like a charm! I transferred my mashed sweet potatoes to the baking pan, smoothing the top. Anneta Konstantinides/Business Insider I sprinkled the pecans on top, then evenly covered the casserole with my miniature marshmallows. I cover", "date_str": "2026-11-07T14:18:02+00:00", "hash": "0a0e13273c6a8891", "title_fa": "من کاسه سیب زمینی شیرین دالی پارتون را برای Friendsgiving درست کردم. در عرض چند دقیقه ناپدید شد.", "summary_fa": "دیگ سیب زمینی شیرین دالی پارتون در Friendsgiving من مورد استقبال قرار گرفت. سباستین اسمیت دالی پارتون و خواهرش در سپتامبر 2024 کتاب آشپزی به نام \"Good Lookin' Cookin'\" منتشر کردند. این کتاب دارای یک بخش کامل با دستور العمل های شکرگزاری، از جمله کاسه سیب زمینی شیرین است. من این غذا را برای Friendsgiving درست کردم، و موفقیت بزرگی بود. دالی پارتون همیشه دوست داشت برای عزیزانش، از جمله دخترخوانده‌اش، مایلی سایرس، مهمانی‌هایی با غذاهای راحتی جنوبی ترتیب دهد. نماد کشور فقید آنقدر آن را دوست داشت که حتی با خواهرش راشل پارتون جورج یک کتاب آشپزی نوشت که در سال 2024 منتشر شد. و بهترین دستور این دسته، کاسرول سیب زمینی شیرین پارتون اس     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
