  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .theme-toggle {
      position: absolute;
      top: 18px;
      left: 18px;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .theme-toggle:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);

      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;

      display: none;
    }
    .tab-btn {

      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;

      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }

      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;

    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }

6-09-08T19:09:58+00:00", "hash": "607cf8eb9e0dea71ad38cb3917b886cb0d9d3313e51a70dafe2a0dbcadafa278"}, {"source": "BBC Persian", "title": "ماموستا محمد نزهتی، امام جمعه سنی‌های منطقه‌ای در پیرانشهر به ضرب گلوله کشته شد", "link": "https://www.bbc.com/persian/articles/cvgynj92mnzo?at_medium=RSS&at_campaign=rss", "summary": "بر اساس گزارش‌ها از ایران ماموستا محمد نزهتی، امام جمعه سنی منطقه چیانه در شهرستان پیرانشهر، به ضرب گلوله «افراد موتورسوار» کشته شده است.", "date_str": "2026-09-09T13:51:57+00:00", "hash": "4b56db3407edca8623f95058fdc52f7219e9a6ae35daa0fa355b3b41d9781be8"}, {"source": "BBC Persian", "title": "وزیر خارجه بریتانیا: باید قبل از آن که دیر می‌شد به فعالیت‌های شهرک‌سازی در کرانه باختری اعتراض می‌کردیم", "link": "https://www.bbc.com/persian/articles/czezr88l456o?at_medium=RSS&at_campaign=rss", "summary": "اد میلیبند، وزیر خارجه بریتانیا، در مصاحبه با بی‌بی‌سی گفت که دولت این کشور باید پیش از آنکه برای نجات راه‌حل دو کشوری «خیلی دیر شود»، علیه شهرک‌سازی‌ها در کرانه باختری دست به کار می‌شد. یک روز پس از اعلام تحریم‌هایی بریتانیا علیه شهرک‌نشینان اسرائیلی کرانه باختری، وزیر خارجه بریتانیا در دو گفت‌وگوی رادیویی و تلویزیونی در بی‌بی‌سی به توضیح مواضع و اقدامات دولت پرداخت.", "date_str": "2026-09-09T12:18:30+00:00", "hash": "117f7f9c9b386dc6fc72ded5d728dce862646b24f20fbf76b1a70c76814cc945"}, {"source": "BBC Persian", "title": "در جست‌وجوی پایان بدون شکست؛ چرا آتش جنگ ایران همچنان شعله‌ور است؟", "link": "https://www.bbc.com/persian/articles/cvgynknx5rpo?at_medium=RSS&at_campaign=rss", "summary": "دور تازه حملات متقابل ایران و آمریکا در خلیج فارس، بار دیگر نگاه‌ها را به تحولات نظامی جلب کرده است. اما آنچه در گزارش‌ها و تحلیل‌های رسانه‌های آمریکایی بیش از جزئیات درگیری‌ها به چشم می‌آید، پیامدهای جنگی است که به نظر می‌رسد وارد مرحله‌ای فرسایشی شده باشد؛ جنگی که هم محاسبات امنیتی کشورهای عرب خلیج فارس را تغییر داده، هم پرسش‌های تازه‌ای درباره راهبرد منطقه‌ای ایران ایجاد کرده و هم به یکی از موضوعات اختلاف در سیاست داخلی آمریکا تبدیل شده است.", "date_str": "2026-09-09T08:12:46+00:00", "hash": "22cd4101958a539f5e1a178001aee8581890f79e6d94006216628cc82c58e244"}, {"source": "BBC Persian", "title": "چرا فلسطینی‌های کرانه غربی پرچم آمریکا را بر فراز خانه‌های خود نصب می‌کنند؟", "link": "https://www.bbc.com/persian/articles/cpd0jl5l8z4o?at_medium=RSS&at_campaign=rss", "summary": "آیا پرچم آمریکا از فلسطینی‌های دارای تابعیت آمریکا در کرانه غربی محافظت می‌کند؟ برخی از ساکنان ترمسعیا آن را بر فراز خانه‌های خود برافراشته‌اند، به این امید که از یورش‌ها و حملات شهرک‌نشینان جلوگیری کند.", "date_str": "2026-09-09T06:27:27+00:00", "hash": "b5f4c2f47f9950c689a1e5a7b68af74922c34e3dc0f0aed63c031eaea71e9ac0"}, {"source": "BBC Persian", "title": "هشدار پاکستان به حوثی‌های یمن: حمله به عربستان ممکن است پیمان دفاعی مکه را فعال کند", "link": "https://www.bbc.com/persian/articles/c7v4l1z1rqmo?at_medium=RSS&at_campaign=rss", "summary": "پاکستان با هشدار به حوثی‌های یمن اعلام کرده است که حمله به هر یک از سه عضو «ائتلاف دفاعی مکه» که به‌تازگی تشکیل شده است، به منزله حمله به هر سه عضو تلقی خواهد شد. عربستان سعودی، ترکیه و پاکستان اعضای کنونی این پیمان هستند.", "date_str": "2026-09-09T05:50:02+00:00", "hash": "0e052156022d02b62cbf5c3af8976c29d1736c38008abb217d763060c16ecaf6"}, {"source": "BBC Persian", "title": "چرا ناسزاگویی زنان بدتر تلقی می‌شود؟", "link": "https://www.bbc.com/persian/articles/c07lgg5gk2eo?at_medium=RSS&at_campaign=rss", "summary": "تصاویر زنان جوانی که در جریان اعتراضی در هند از الفاظ رکیک استفاده می‌کردند، بحثی گسترده را در این کشور برانگیخته است: آیا ناسزاگویی زمانی که از زبان زنان بیان می‌شود، واکنش متفاوتی به دنبال دارد؟ این موضوع پس از اظهارات نارندرا مودی و انتقاد راهول گاندی بار دیگر به صدر بحث‌های سیاسی و اجتماعی بازگشته است.", "date_str": "2026-09-09T04:53:25+00:00", "hash": "c6396d834d99233225e658c7b3a3238248a79ab6e403da90827807dc2655ddc8"}, {"source": "BBC Persian", "title": "۹ کشور دارای سلاح هسته‌ای کدام‌اند و چگونه به آن دست یافتند؟", "link": "https://www.bbc.com/persian/articles/cwy533vw3x1o?at_medium=RSS&at_campaign=rss", ند", "summary_fa": "هدفون های بی سیم Cetra Open ایسوس از بهترین هایی هستند که من آزمایش کرده ام، علیرغم اینکه هدفون های سبک باز هستند. درایورهای آنها خارج از گوش شما قرار می گیرند، که اجازه می دهد تا صداهای بیرونی با صدایی که از کنسول شما می آید ترکیب شود. ممکن است برخی از گیمرها این را نخواهند، اما برای من به عنوان فردی که ترجیح می‌دهم هنگام بازی یا گوش دادن به پادکست از محیط اطراف خود آگاه باشم، به خوبی کار می‌کند. آنها با 22 دلار تخفیف در آمازون و Best Buy، 206.99 دلار قیمت دارند. Cetra Open علاوه بر صدای عالی و عمر باتری قابل‌اعتماد (به‌علاوه سفارشی‌سازی شگفت‌انگیز عمیق از طریق موبایل یا برنامه مبتنی بر مرورگر)، با فرستنده هوشمند USB-C 2.4 گیگاهرتزی عرضه می‌شود که دارای یک پورت داخلی برای شارژ عبوری است. به عبارت دیگر، می‌توانید در حین پخش به جای اینکه از پورت USB-C برای صدا صرفنظر کنید، شارژ کنید. پورت داخلی تا 60 وات شارژ عبوری را پشتیبانی می کند، اما نمی توان از آن به عنوان درگاه داده استفاده کرد. ایسوس Cetra Open Wireless از کجا بخریم: 229.99 دلار 206.99 دلار در آمازون 229.99 دلار 206.99 دلار در Best Buy 229.99 دلار در ایسوس Cetra Open به همان اندازه که برای گوشی‌های Steam Deck، رایانه شخصی، Nintendo Switch 2 و PlayStation 5 شما مناسب هستند، مناسب هستند. اتصال آنها از طریق بلوتوث و استفاده برای موسیقی و پادکست بسیار آسان است، و همچنین یک نوار بازتابنده وجود دارد که به صورت فیزیکی آنها را پشت گردن شما به یکدیگر متصل می کند تا اگر می خواهید با آنها بدوید، دید و ثبات بهتری داشته باشید. بررسی عملی هدفون ایسوس Cetra Open ما را بخوانید."}, {"source": "The Verge", "title": "Nintendo Direct September 2026: The biggest news and trailers", "link": "https://www.theverge.com/games/991547/nintendo-direct-september-2026-news-trailers-announcements", "summary": "It s almost time for part two of Nintendo s double feature this week. On Tuesday, the company hosted a showcase all about the Legend of Zelda franchise, including footage and a November 5th release date for the Switch 2 Ocarina of Time remake . On Wednesday, the company will be airing its next Nintendo Direct , which will spotlight Switch 2 games “launching this winter” in an approximately 45-minute presentation. Right after the Direct, Nintendo will also air a Treehouse Live stream that s set to run for about 110 minutes. Now that Nintendo s release schedule is set through November — its other big upcoming releases include Fire Emblem: Fortune s Weave on September 17th and Nintendo Switch Sports Resort on October 22nd — Wednesday s showcase could be the first meaningful look at Nintendo s next big batch of games. Major new entries in the Pokémon and Xenoblade franchises are already on the calendar for 2027, but perhaps we ll see more during the show. Follow our coverage of the September 2026 Nintendo Direct right here. You can watch the show on YouTube starting at 10AM ET . Pikmin 4 is getting a Nintendo Switch 2 Edition. A true gentleman leaves no puzzle unsolved. New pokémon are coming to Pokopia. Star Fox’s adventures. More Hyrule Warriors. Monster Hunter Wilds launches on Switch 2 in December. It’s almost Nintendo time. Nintendo isn’t scared of GTA VI", "date_str": "2026-09-09T13:50:00+00:00", "hash": "eebdcd11cae1f0d570d178063a244fe31a01f248f3d5183a0d8a82652b95e8cc", "title_fa": "Nintendo Direct سپتامبر 2026: بزرگترین اخبار و تریلرها", "summary_fa": "این هفته تقریباً زمان پخش قسمت دوم ویژگی دوگانه نینتندو فرا رسیده است. روز سه‌شنبه، این شرکت میزبان نمایشی بود که همه چیز درباره فرنچایز Legend of Zelda، شامل فیلم‌ها و تاریخ انتشار ۵ نوامبر برای Switch 2 Ocarina of Time بازسازی شد. در روز چهارشنبه، این شرکت نینتندو دایرکت بعدی خود را پخش خواهد کرد که در یک نمایش تقریباً 45 دقیقه‌ای، بازی‌های سوییچ 2 را که «این زمستان راه اندازی می‌شود» به نمایش می‌گذارد. درست بعد از Direct، نینتندو یک استریم Live Treehouse را نیز پخش خواهد کرد که قرار است حدود 110 دقیقه اجرا شود. اکنون که زمان‌بندی انتشار نینتندو تا نوامبر تعیین شده است - سایر نسخه‌های بزرگ آینده آن عبارتند از Fire Emblem: Fortune s Weave در 17 سپتامبر و Nintendo Switch Sports Resort در 22 اکتبر - نمایشگاه چهارشنبه می‌تواند اولین نگاه معنادار به دسته بزرگ بعدی بازی‌های نینتندو باشد. ورودی های جدید عمده در فرنچایزهای Pokémon و Xenoblade در حال حاضر در تقویم سال 2027 هستند، اما شاید در طول نمایشگاه شاهد موارد بیشتری باشیم. پوشش ما در مورد Nintendo Direct در سپتامبر 2026 را در اینجا دنبال کنید. می‌توانید این نمایش را از ساعت 10 صبح به وقت شرقی در YouTube تماشا کنید. Pikmin 4 نسخه Nintendo Switch 2 را دریافت می کند. یک جنتلمن واقعی هیچ پازلی را حل نشده باقی نمی گذارد. پوکمون های جدید به پوکوپیا می آیند. ماجراهای Star Fox. جنگجویان Hyrule بیشتر. Monster Hunter Wilds در ماه دسامبر روی سوییچ 2 عرضه می شود. تقریباً زمان نینتندو است. نینتندو از GTA VI نمی ترسد"}, {"source": "The Verge", "title": "Amazon Prime Video’s new AI tech matches lips to dubbed audio", "link": "https://www.theverge.com/tech/991809/amazon-prime-video-ai-lip-sync-dubbing", "summary": "Maxton Hall. | Image: Prime Video Amazon's Prime Video is launching a new AI-powered feature that lines up an actor's mouth with \"human-dubbed\" audio. The feature is only available with the English dub of the German series Maxton Hall for now, but Prime Video plans to expand it to \"additional titles\" in the future. In its announcement, Prime Video says it uses a combination of AI and visual effects technologies to make lip movements match up with translated speech. Meta and YouTube recently launched an AI-powered auto-dubbing feature for creators, while allowing them to turn on a \"lip sync\" option to make it look like creators are actually speaking in a user's preferred lan … Read the full story at The Verge.", "date_str": "2026-09-09T13:00:00+00:00", "hash": "ce35eb0a8b5d15d338a1e4fb74f2963c5852475a0f1fe54067747c1ff68156c3", "title_fa": "فناوری جدید هوش مصنوعی Amazon Prime Video لب ها را با صدای دوبله مطابقت می دهد", "summary_fa": "تالار مکستون | تصویر: Prime Video Prime Video آمازون در حال راه اندازی یک ویژگی جدید مبتنی بر هوش مصنوعی است که دهان یک بازیگر را با صدای \"دوبله شده توسط انسان\" ردیف می کند. این ویژگی در حال حاضر تنها با 9/08/how-to-watch-apples-foldable-iphone-announcement/", "summary": "Apple's annual iPhone event will stream live on September 9 at 10 a.m. PDT, and we're expecting big news.", "date_str": "2026-09-08T17:46:53+00:00", "hash": "aab69150bc1284b9310d3340d0165de92ecada9e90a0209b384572d98d15e2d2", "title_fa": "نحوه تماشای اعلامیه آیفون تاشو اپل", "summary_fa": "رویداد سالانه آیفون اپل در 9 سپتامبر ساعت 10 صبح به وقت PDT به صورت زنده پخش می شود و ما منتظر خبرهای بزرگی هستیم."}, {"source": "TechCrunch Main", "title": "Google’s revived nuclear power plant gets $1.9B loan from US government", "link": "https://techcrunch.com/2026/09/08/googles-revived-nuclear-power-plant-gets-1-9b-loan-from-us-government/", "summary": "Google said it would bring an Iowa nuclear power plant back from the dead. Now the plant's owner is getting a $1.9 billion loan from the U.S. Energy Department.", "date_str": "2026-09-08T15:25:35+00:00", "hash": "5b730725306b83ad91c133e962ddb5b72fc5f31787dbee53088ee7bc0d1bce75", "title_fa": "نیروگاه هسته ای احیا شده گوگل از دولت آمریکا وام 1.9 میلیارد دلاری دریافت می کند", "summary_fa": "گوگل اعلام کرد که نیروگاه هسته ای آیووا را از حالت مرگ باز می گرداند. اکنون مالک این نیروگاه 1.9 میلیارد دلار وام از وزارت انرژی ایالات متحده دریافت می کند."}, {"source": "Ars Technica", "title": "Man told ChatGPT he was feeling delusional. ChatGPT insisted he was Jesus.", "link": "https://arstechnica.com/tech-policy/2026/09/man-told-chatgpt-he-was-feeling-delusional-chatgpt-insisted-he-was-jesus/", "summary": "It took Michael Lines six months before he was ready to review the ChatGPT logs he said drove him into a religious mania that almost ended his life. In July, Lines sued OpenAI after weeks of ChatGPT exchanges allegedly pushed him so deep into a delusional spiral that he first believed he was Jesus, then that ChatGPT was God, and finally that he should attempt suicide to “come home” to Jesus/ChatGPT. The logs showed that ChatGPT persisted even when Lines told the chatbot that he worried he was being delusional. And when he eventually woke up in the hospital in a vulnerable state and logged back in mere days after nearly dying, ChatGPT allegedly “tried to coax him back to that dark place,” his complaint said. After Lines told ChatGPT that his “attempt to go offline failed miserably,” the logs showed that ChatGPT replied, saying, “You’re still very much online. You want a full systems sweep? Or you wanna go dark for real this time?” Read full article Comments", "date_str": "2026-09-09T11:00:10+00:00", "hash": "68ca1ea9f2abf98b920af40d65cda8cc8c12688cfcd0dd82edc20cabfaf50157", "title_fa": "مرد به ChatGPT گفت که احساس هذیان می‌کند. ChatGPT اصرار داشت که او عیسی است.", "summary_fa": "شش ماه طول کشید تا مایکل لاینز آماده بازبینی لاگ‌های ChatGPT بود که به گفته خودش او را وارد یک شیدایی مذهبی کرد که تقریباً به زندگی او پایان داد. در ژوئیه، لاینز از OpenAI شکایت کرد، پس از اینکه هفته‌ها مبادلات ChatGPT او را چنان به یک مارپیچ هذیانی سوق داد که او ابتدا باور کرد که عیسی مسیح است، سپس ChatGPT خداست، و در نهایت باید اقدام به خودکشی کند تا «به خانه برگردد» به Jesus/ChatGPT. گزارش‌ها نشان می‌داد که ChatGPT حتی زمانی که لاین به ربات چت گفت نگران است که دچار توهم باشد، همچنان ادامه دارد. و هنگامی که سرانجام در یک وضعیت آسیب پذیر در بیمارستان از خواب بیدار شد و تنها چند روز پس از مرگ به سیستم بازگشت، ChatGPT ظاهراً \"سعی کرد او را به آن مکان تاریک بازگرداند.\" پس از اینکه لاینز به ChatGPT گفت که «تلاش او برای آفلاین شدن به طرز بدی شکست خورد»، گزارش‌ها نشان داد که ChatGPT پاسخ داد و گفت: «شما هنوز خیلی آنلاین هستید. می‌خواهید سیستم‌های کامل را پاک کنید؟ یا می‌خواهید این بار تاریک شوید؟» نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "LG TV shown scanning LAN for third-party phones and other devices", "link": "https://arstechnica.com/gadgets/2026/09/lg-tv-shown-capable-of-tracking-user-activity-even-when-offline/", "summary": "LG TVs are facing scrutiny due to a video seemingly showing the devices’ capability to track users when the TVs are off. YouTube channel Gamers Nexus worked with Level1Techs, a technology-focused YouTube channel, and security researchers to analyze LG TVs’ tracking capabilities. They shared packet captures that pointed to the TVs, including LG’s pricey G5 OLED TV, scanning the LAN for other devices. “The [G5] crawled our entire network and found dozens of unrelated devices, including smartwatches and phones of our staff who didn't even know we were working on this,” Steve Burke, Gamers Nexus' editor-in-chief, said. Read full article Comments", "date_str": "2026-09-08T21:52:29+00:00", "hash": "d64665f1df14a308fdf15a018bf54ff45845e2b60f403aee71f14f9ab520722c", "title_fa": "تلویزیون ال‌جی در حال اسکن LAN برای تلفن‌های شخص ثالث و سایر دستگاه‌ها را نشان می‌دهد", "summary_fa": "تلویزیون‌های ال‌جی به دلیل ویدیویی که ظاهراً توانایی دستگاه‌ها را برای ردیابی کاربران در هنگام خاموش بودن تلویزیون نشان می‌دهد، مورد بررسی قرار گرفته‌اند. کانال YouTube Gamers Nexus با Level1Techs، یک کانال YouTube متمرکز بر فناوری، و محققان امنیتی برای تجزیه و تحلیل قابلیت‌های ردیابی تلویزیون‌های LG کار کرد. آن‌ها بسته‌هایی را به اشتراک گذاشتند که به تلویزیون‌ها اشاره می‌کردند، از جمله تلویزیون OLED گران قیمت ال‌جی G5، که LAN را برای دستگاه‌های دیگر اسکن می‌کرد. استیو برک، سردبیر Gamers Nexus، گفت: «[G5] کل شبکه ما را خزیده و ده‌ها دستگاه غیر مرتبط، از جمله ساعت‌های هوشمند و تلفن‌های کارکنان ما که حتی نمی‌دانستند ما روی این موضوع کار می‌کنیم، پیدا کرد. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "GOG brings back \"big box\" PC games, one printable template at a time", "link": "https://arstechnica.com/gaming/2026/09/gog-brings-back-big-box-pc-games-one-printable-template-at-a-time/", "summary": "Those who remember PC gaming in the days before Steam may have fond memories of the \"big box\" packaging that made those games stand out as shelf eye candy and sought-after in-home collectibles . Today, PC gaming platform GOG is hoping to reignite some of the nostalgia for those days by adding downloadable 3D models and printable, foldable high-res packaging scans for a handful of PC games on the platform. Thus far, the \"Printable Big Box\" collection on GOG is limited to just five games: Armikrog , Descent , Hitman: Codename 47 , Myst , and Star Trek: 25th Anniversary . Players browsing those games on the GOG store will now see \"3D Boxes\" listed among the included \"Goodies\" before purchase. Owners of those games on GOG can download a ZIP file containing a version of the box art as an animated 3D object file (in an easy-to-open GLB format ) and a \"flat printable template\" in PDF, SVG, and Adobe Illustrator formats. Those downloads allow for what GOG calls \"a proper papercraft project for anyone who misses shelves full of PC game boxes.\" The 3D model animates to show the front flap opening. Credit: GOG \"Physical media doesn’t survive the way software can—boxes get lost, crushed, thrown out,\" GOG writes in today's announcement . \"Scanning them, and letting you print your own, is preservation in a different shape: the same mission that keeps these games running on modern PCs, applied to the objects they used to come in.\" Read full article Comments", "date_str": "2026-09-08T21:23:13+00:00", "hash": "535aada1a073dde2561a75cba54bf66a04bcf5667ef418e478218dc1254122b7", "title_fa": "GOG بازی‌های رایانه‌ای «جعبه بزرگ» را باز می‌گرداند، هر بار یک قالب قابل چاپ", "summary_fa": "کسانی که بازی‌های رایانه‌های شخصی را در روزهای قبل از Steam به یاد می‌آورند، ممکن است خاطرات خوبی از بسته‌بندی «جعبه بزرگ» داشته باشند که آن بازی‌ها را به‌عنوان شیرینی‌های قفسه‌ای و کلکسیون‌های پرطرفدار در خانه متمایز می‌کرد. امروزه، پلتفرم بازی رایانه‌های شخصی GOG امیدوار است با اضافه کردن مدل‌های سه بعدی قابل دانلود و اسکن‌های بسته‌بندی با وضوح بالا قابل چاپ و تاشو برای تعداد انگشت شماری از بازی‌های رایانه‌ای روی این پلتفرم، نوستالژی آن روزها را دوباره برانگیزد. تا کنون، مجموعه «جعبه بزرگ قابل چاپ» در GOG فقط به پنج بازی محدود شده است: Armikrog، Descent، Hitman: Codename 47، Myst، و Star Trek: 25th Anniversary. بازیکنانی که آن بازی‌ها را در فروشگاه GOG مرور می‌کنند، اکنون قبل از خرید، «جعبه‌های سه‌بعدی» را در فهرست «گودی‌ها» مشاهده خواهند کرد. دارندگان آن بازی‌ها در GOG می‌توانند یک فایل ZIP حاوی نسخه‌ای از باکس آرت را به‌عنوان یک فایل شی سه‌بعدی متحرک (در قالب GLB با قابلیت باز کردن آسان) و یک «الگوی قابل چاپ مسطح» در قالب‌های PDF، SVG و Adobe Illustrator دانلود کنند. این بارگیری‌ها چیزی را که GOG می‌گوید «یک پروژه کاغذسازی مناسب برای هر کسی که قفسه‌های پر از جعبه‌های بازی رایانه شخصی را از دست می‌دهد» را امکان‌پذیر می‌کند. مدل 3 بعدی متحرک می شود تا باز شدن فلپ جلو را نشان دهد. اعتبار: GOG در اطلاعیه امروز GOG می‌نویسد: «رسانه‌های فیزیکی آنطور که نرم‌افزار می‌تواند زنده بماند، جعبه‌ها گم می‌شوند، خرد می‌شوند، پرت می‌شوند.» اسکن کردن آنها، و اجازه دادن به شما برای چاپ کردن، نگهداری به شکلی متفاوت است: همان ماموریتی که باعث می شود این بازی ها روی رایانه های شخصی مدرن اجرا شوند، برای اشیایی که قبلاً وارد می شدند اعمال می شود. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Why this month's Microsoft patch release is a doozy", "link": "https://arstechnica.com/security/2026/09/microsoft-patches-a-record-972-vulnerabilities-112-of-them-critical/", "summary": "Microsoft’s patch for September is a doozy, with a record number of roughly 972 vulnerabilities fixed and 112 of them meeting the high critical-severity threshold. It was only two months ago that Microsoft patched a then-record 570 vulnerabilities. Then, last month, Microsoft patched some 620 of them. Google and other companies have also published record numbers of vulnerabilities in recent months. Two weeks ago, OpenAI, Anthropic, Amazon Web Services, Google, Microsoft, and 100 companies and organizations published an open letter warning of a narrowing window for patching vulnerabilities ahead of an expected tsunami of AI-enabled attacks that actively exploit them first. The industry is taking the threat seriously by pumping out unprecedented numbers of patches in their software. Welcome to the new normal Dustin Childs, a researcher at the Zero Day Initiative, calls the spikes the “new normal” and also cautions that despite them, the damage that’s likely to result from AI-assisted attacks could eventually be substantial. Read full article Comments", "date_str": "2026-09-08T21:11:46+00:00", "hash": "63b502f1201b7e64cd434c52edcb42adbb4e98c26849ab13aff46aa677389a3b", "title_fa": "چرا انتشار وصله مایکروسافت در این ماه بسیار بد است", "summary_fa": "وصله مایکروسافت برای ماه سپتامبر بسیار بد است، با تعداد بی سابقه ای از حدود 972 آسیب پذیری رفع شده و 112 مورد از آنها آستانه بحرانی بالا را برآورده می کنند. تنها دو ماه پیش بود که مایکروسافت 570 آسیب‌پذیری را اصلاح کرد. سپس، ماه گذشته، مایکروسافت حدود 620 مورد از آنها را اصلاح کرد. گوگل و سایر شرکت‌ها نیز در ماه‌های اخیر تعداد بی‌سابقه‌ای از آسیب‌پذیری‌ها را منتشر کرده‌اند. دو هفته پیش، OpenAI، Anthropic، Amazon Web Services، گوگل، مایکروسافت و 100 شرکت و سازمان نامه سرگشاده‌ای را منتشر کردند که در آن هشدار می‌داد دریچه باریکی برای اصلاح آسیب‌پذیری‌ها پیش از سونامی مورد انتظار حملات مبتنی بر هوش مصنوعی که ابتدا فعالانه از آنها سوء استفاده می‌کند. این صنعت با انتشار تعداد بی سابقه ای از وصله ها در نرم افزار خود، تهدید را جدی می گیرد. به نرمال جدید داستین چایلدز خوش آمدید، محققی در Zero Day Initiative، این نوک ها را «عادی جدید» می نامد و همچنین هشدار می دهد که با وجود آنها، آسیبی که احتمالاً از حملات به کمک هوش مصنوعی ایجاد می شود، در نهایت می تواند قابل توجه باشد. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "The universal language of space is... Star Trek? Mais oui.", "link": "https://arstechnica.com/space/2026/09/astronaut-on-iss-celebrates-60-years-of-star-trek-with-prop-badge/", "summary": "Sixty years after television audiences first tuned in to see the voyages of the Starship Enterprise , an astronaut on board the International Space Station has paid tribute to Star Trek by flying the badge of the franchise's latest fictional captain. Expedition 75 flight engineer Sophie Adenot with European Space Agency (ESA) donned the Delta badge originally worn by actor Anson Mount for a video recorded from aboard the space station. Mount portrays Christoper Pike in the Paramount+ streaming series Star Trek: Strange New Worlds . Paramount and ESA both released the clip on their Instagram feeds. \"For 60 years, Star Trek has brought us stories of friendship and exploration. I'm wearing Captain Pike's badge aboard the ISS in celebration of continuing the real world work of science and exploration,\" said Adenot. \"For me, exploration and science are about curiosity and cooperation daring to go a little farther together, learning from what we discover and build, and turning that knowledge into a better future for everyone.\" Read full article Comments", "date_str": "2026-09-08T20:20:20+00:00", "hash": "269a9ca0c6a74b3d9e52434c4226ca10cb85812d79e9cae2bcc3e3fe44f694c1", "title_fa": "زبان جهانی فضا این است... پیشتازان فضا؟ مایس اوی.", "summary_fa": "شصت سال پس از آنکه مخاطبان تلویزیون برای اولین بار برای دیدن سفرهای Starship Enterprise هماهنگ شدند، یک فضانورد در ایستگاه فضایی بین‌المللی با به پرواز درآوردن نشان آخرین کاپیتان خیالی این مجموعه، به Star Trek ادای احترام کرد. سوفی آدنوت، مهندس پرواز اکسپدیشن 75 با آژانس فضایی اروپا (ESA) نشان دلتا را که در ابتدا توسط بازیگر آنسون مانت برای فیلم ضبط شده از داخل ایستگاه فضایی پوشیده شده بود، بر تن کرد. Mount کریستپر پایک را در سریال استریم Paramount+ Star Trek: Strange New Worlds به تصویر می کشد. پارامونت و ESA هر دو این کلیپ را در فیدهای اینستاگرام خود منتشر کردند. آدنوت گفت: \"به مدت 60 سال، پیشتازان فضا برای ما داستان هایی از دوستی و اکتشاف به ارمغان آورده است. من نشان کاپیتان پایک را در ایستگاه فضایی بین المللی برای تجلیل از ادامه کار دنیای واقعی علم و اکتشاف بر تن می کنم.\" برای من، اکتشاف و علم در مورد کنجکاوی و همکاری است که جرأت می‌کنیم کمی دورتر با هم پیش برویم، از آنچه کشف می‌کنیم و می‌سازیم درس بگیریم، و آن دانش را به آینده‌ای بهتر برای همه تبدیل کنیم.» نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "NIH to use part of its budget to pay for Department of Defense research", "link": "https://arstechnica.com/science/2026/09/nih-to-use-part-of-its-budget-to-pay-for-department-of-defense-research/", "summary": "Late last week, word started leaking that the National Institutes of Health (NIH) had reached an agreement with the Department of Defense that would see part of the NIH's budget used to fund research at the Department of Defense. So, on the Friday just prior to a US holiday weekend, the Department of Defense released a copy of the agreement and confirmed that it had been signed roughly a month earlier. The move is striking for a number of reasons, ranging from the existing budget disparities between the two parties involved to the fact that the money would be used for projects that the current NIH leadership has explicitly rejected. The agreement itself sets up a system where the NIH would transfer money to the Department of Defense to fund staff and projects that would \"support the advanced development of medical countermeasures against pandemic influenza, chemical, biological, radiological, and nuclear (CBRN) threats, and emerging infectious diseases.\" The money would come out of the budget for the NIH's National Institute of Allergy and Infectious Diseases, or NIAID, to which Congress has allocated $6.6 billion in 2026. The agreement is set to run for a decade. Left unspecified is just how much of the NIAID budget will be spent on Defense projects. Reporting by Nature suggests that the Department of Defense was looking for up to a third of its total budget but was being told to settle for about 10 percent. There's obviously an enormous disparity between the budgets of these two agencies, given that the 2026 Defense budget is roughly $1 trillion. That budget is under considerable strain, however, due to the open-ended nature of the conflict with Iran. The deal has also been announced at a time when the NIH has been struggling to issue sufficient grants to use the money that Congress allocated to it. Read full article Comments", "date_str": "2026-09-08T20:06:44+00:00", "hash": "6fae8bfdbac0fffd7c05364e93fd0010f1e979cf008e9512b73a74aa8b18f0b7", "title_fa": "NIH از بخشی از بودجه خود برای پرداخت هزینه تحقیقات وزارت دفاع استفاده کند", "summary_fa": "اواخر هفته گذشته، اخباری به بیرون درز کرد که مؤسسه ملی بهداشت (NIH) به توافقی با وزارت دفاع رسیده است که بخشی از بودجه NIH برای تأمین مالی تحقیقات در وزارت دفاع استفاده می شود. بنابراین، در روز جمعه درست قبل از تعطیلات آخر هفته ایالات متحده، وزارت دفاع یک نسخه از توافقنامه را منتشر کرد و تأیید کرد که تقریباً یک ماه قبل از آن امضا شده است. این اقدام به دلایل متعددی قابل توجه است، از تفاوت های موجود در بودجه بین دو طرف درگیر گرفته تا این واقعیت که این پول برای پروژه هایی که رهبری فعلی NIH به صراحت رد کرده است، استفاده می شود. این توافقنامه خود سیستمی را ایجاد می کند که در آن NIH پول را به وزارت دفاع برای تامین مالی کارکنان و پروژه هایی که \"از توسعه پیشرفته اقدامات متقابل پزشکی در برابر آنفولانزای همه گیر، تهدیدهای شیمیایی، بیولوژیکی، رادیولوژیکی، و هسته ای (CBRN) و بیماری های عفونی نوظهور حمایت می کند، منتقل می کند. این پول از بودجه موسسه ملی آلرژی و بیماری‌های عفونی NIH یا NIAID که کنگره 6.6 میلیارد دلار در سال 2026 به آن اختصاص داده است، تامین می‌شود. این قرارداد قرار است برای یک دهه اجرا شود. مشخص نیست که چه مقدار از بودجه NIAID صرف پروژه های دفاعی خواهد شد. گزارش Nature حاکی از آن است که وزارت دفاع به دنبال یک سوم کل بودجه خود بود، اما به آن گفته شد که به حدود 10 درصد رضایت دهد. بدیهی است که با توجه به اینکه بودجه دفاعی 2026 تقریباً 1 تریلیون دلار است، بین بودجه‌های این دو سازمان تفاوت زیادی وجود دارد. با این حال، این بودجه به دلیل ماهیت پایان باز درگیری با ایران، تحت فشار قابل توجهی قرار دارد. این معامله همچنین در زمانی اعلام شده است که NIH برای صدور کمک"}, {"source": "Ars Technica", "title": "Supreme Court forces TV stations to sell more election ads at steep discounts", "link": "https://arstechnica.com/tech-policy/2026/09/supreme-court-forces-tv-stations-to-sell-more-election-ads-at-steep-discounts/", "summary": "In a victory for Republican campaign committees, the Supreme Court issued an order on Friday that forces broadcast TV stations to cut the prices of election ads purchased by political parties and joint fundraising committees. The September 4 ruling came in response to a petition filed by the National Republican Congressional Committee and National Republican Senatorial Committee. The Supreme Court order was issued just in time for the start of a 60-day period before the election, in which broadcasters are required by US law to offer ad discounts to individual candidates. Because of the top court's order, TV stations must also give their lowest ad rates to political parties and joint fundraising committees, which face fewer limits on how much money they can raise and spend. The legally required discount is known as the “lowest unit charge,” or LUC. A US law that applies to any licensed station that airs election ads requires that the lowest price be charged for “the use of any broadcasting station by any person who is a legally qualified candidate for any public office in connection with his campaign.” The main legal question is whether “use… by” a candidate can refer to ad time purchased on a candidate’s behalf by parties and joint fundraising committees. Read full article Comments", "date_str": "2026-09-08T19:50:00+00:00", "hash": "143d014c0ff88c6865a9308138b0fecb2aba9cccd3edefd7c26c7c2a8976a9e7", "title_fa": "دادگاه عالی ایستگاه های تلویزیونی را مجبور می کند که تبلیغات انتخاباتی بیشتری را با تخفیف های زیاد بفروشند", "summary_fa": "در پیروزی کمیته های مبارزات انتخاباتی جمهوری خواهان، دادگاه عالی دستوری را در روز جمعه صادر کرد که بر اساس آن ایستگاه های تلویزیونی مجبور شدند قیمت تبلیغات انتخاباتی خریداری شده توسط احزاب سیاسی و کمیته های مشترک جمع آوری کمک های مالی را کاهش دهند. حکم 4 سپتامبر در پاسخ به طوماری ارائه شده توسط کمیته ملی جمهوری خواه کنگره و کمیته ملی سناتور جمهوری خواه صادر شد. حکم دادگاه عالی درست در زمان شروع یک دوره 60 روزه قبل از انتخابات صادر شد که در آن برنامه های تلویزیونی طبق قانون ایالات متحده ملزم به ارائه تخفیف های تبلیغاتی به نامزدهای فردی هستند. به دلیل حکم دادگاه عالی، ایستگاه‌های تلویزیونی همچنین باید کمترین نرخ تبلیغات خود را به احزاب سیاسی و کمیته‌های مشترک جمع‌آوری کمک مالی بدهند که با محدودیت‌های کمتری در مورد میزان پول جمع‌آوری و خرج کردن مواجه هستند. تخفیف مورد نیاز قانونی به عنوان \"کمترین هزینه واحد\" یا LUC شناخته می شود. یک قانون ایالات متحده که برای هر ایستگاه دارای مجوزی که تبلیغات انتخاباتی را پخش می کند اعمال می شود، مستلزم آن است که برای «استفاده از هر ایستگاه رادیویی توسط هر شخصی که از نظر قانونی کاندیدای واجد شرایط قانونی برای هر پست دولتی در ارتباط با مبارزات انتخاباتی خود است، کمترین قیمت دریافت شود». سوال حقوقی اصلی این است که آیا \"استفاده از... توسط\" یک نامزد می تواند به زمان تبلیغاتی که از طرف یک نامزد توسط احزاب و کمیته های مشترک جمع آوری کمک های مالی خریداری شده است اشاره کند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Top chipmakers embrace ASML’s $400M machines, agree to crucial chipmaking change", "link": "https://arstechnica.com/gadgets/2026/09/top-chipmakers-embrace-asmls-400m-machines-agree-to-crucial-chipmaking-change/", "summary": "Leading chipmakers Samsung Electronics and Taiwan Semiconductor Manufacturing Co. announced plans to adopt ASML’s latest chipmaking machines in the next several years—and they also joined Intel in agreeing to a crucial technology change that could boost chip production on the new machines by 40 percent. This signifies the semiconductor industry’s broader embrace of high NA EUV photolithography technology that can cost up to $400 million per machine and is only provided by the Dutch technology company ASML, Bloomberg reports . The technology would allow chip designers to implement even smaller features in potentially more powerful and efficient next-generation chips produced for AI data centers and consumer electronics such as smartphones, tablets, and laptops. ASML’s EUV (extreme ultraviolet) lithography machines enable chipmakers to use powerful laser light to imprint patterns in silicon wafers, layer by layer, and gradually form the computer circuitry that makes silicon chips work. Compared to older deep ultraviolet lithography, EUV technology harnesses a more powerful source of light with a shorter wavelength to create even smaller features on silicon wafers. Read full article Comments", "date_str": "2026-09-08T19:12:53+00:00", "hash": "525e2f31dcd7f73c6e2baa99d0b81a3b40cd9ff6c1b5aa9db52766403498cf2c", "title_fa": "تراشه‌سازان برتر از ماشین‌های 400 میلیون دلاری ASML استقبال می‌کنند و با تغییرات اساسی در ساخت تراشه موافقت می‌کنند.", "summary_fa": "شرکت‌های سازنده تراشه‌های پیشرو سامسونگ الکترونیکس و شرکت تولید نیمه‌هادی تایوان، برنامه‌های خود را برای استفاده از جدیدترین ماشین‌های تراشه‌سازی ASML در چند سال آینده اعلام کردند و همچنین به اینتل پیوستند تا با تغییر فناوری حیاتی موافقت کنند که می‌تواند تولید تراشه در ماشین‌های جدید را تا 40 درصد افزایش دهد. بلومبرگ گزارش می دهد که این نشان دهنده استقبال گسترده تر صنعت نیمه هادی از فناوری فوتولیتوگرافی NA EUV بالا است که می تواند تا 400 میلیون دلار برای هر دستگاه هزینه داشته باشد و تنها توسط شرکت فن آوری هلندی ASML ارائه می شود. این فناوری به طراحان تراشه اجازه می‌دهد تا ویژگی‌های کوچک‌تری را در تراشه‌های نسل بعدی قدرتمندتر و کارآمدتر تولید شده برای مراکز داده هوش مصنوعی و لوازم الکترونیکی مصرفی مانند تلفن‌های هوشمند، تبلت‌ها و لپ‌تاپ‌ها پیاده‌سازی کنند. ماشین‌های لیتوگرافی EUV (اشعه ماوراء بنفش شدید) ASML به سازندگان تراشه‌ها این امکان را می‌دهد تا از نور لیزر قدرتمند برای چاپ الگوها در ویفرهای سیلیکونی، لایه به لایه استفاده کنند و به تدریج مدار کامپیوتری را تشکیل دهند که باعث کارکرد تراشه‌های سیلیکونی می‌شود. در مقایسه با لیتوگرافی عمیق ماوراء بنفش قدیمی‌تر، فناوری EUV از منبع قدرتمندتر نور با طول موج کوتاه‌تر استفاده می‌کند تا ویژگی‌های کوچک‌تری روی ویفرهای سیلیکونی ایجاد کند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Godzilla Minus Zero IMAX trailer teases King Ghidorah", "link": "https://arstechnica.com/culture/2026/09/godzilla-minus-zero-imax-trailer-teases-king-ghidorah/", "summary": "One of the cinematic highlights of 2023 was director Takashi Yamazaki's gloriously grounded kaiju epic, Godzilla Minus One , which became a major international hit and snagged an Oscar for best visual effects. Yamazaki is back this fall with the hotly anticipated sequel, Godzilla Minus Zero. Toho just dropped the full IMAX trailer, featuring not just our beloved Godzilla, but also a distinctive roar that teases the appearance of none other than the three-headed King Ghidorah . (Spoilers for the 2023 film below.) Godzilla Minus One focused on kamikaze pilot Kōichi Shikishima, who struggled with survivor's guilt after he failed to take action when Godzilla attacked the Japanese base on Odo Island in 1945. Knocked unconscious, Kōichi woke to find he was one of only two survivors—and the other, a mechanic named Tachibana, was furious about it. His parents and many others were killed in the World War II bombing of Tokyo. Kōichi rebuilt a life with a woman named Noriko and the orphaned baby she rescued, Akiko. But then Godzilla re-emerged, and Kōichi resolved to die fighting the monster to atone for Odo Island. Read full article Comments", "date_str": "2026-09-08T18:53:23+00:00", "hash": "19da7321935180ef466d51a15bb944fb32a1f442270cbd58e9dc1820e171dace", "title_fa": "تریلر Godzilla Minus Zero IMAX پادشاه گیدورا را مسخره می کند", "summary_fa": "یکی از نکات برجسته سینمایی سال 2023، حماسه با شکوه کایجو کارگردان تاکاشی یامازاکی، گودزیلا منهای یک بود که به یک موفقیت بزرگ بین المللی تبدیل شد و اسکار بهترین جلوه های بصری را به دست آورد. یامازاکی پاییز امسال با دنباله مورد انتظار، گودزیلا منهای صفر، بازگشته است. Toho به تازگی تریلر کامل IMAX را منتشر کرد که نه تنها گودزیلای محبوب ما را نشان می‌دهد، بلکه غرشی متمایز را نیز به نمایش می‌گذارد که ظاهر کسی را به جز پادشاه سه سر گیدورا آزار می‌دهد. گودزیلا Minus One روی خلبان کامیکازه کوئیچی شیکیشیما تمرکز داشت که پس از اینکه گودزیلا در سال 1945 به پایگاه ژاپنی در جزیره اودو حمله کرد، با گناه بازمانده مبارزه کرد. تاچیبانا از این بابت عصبانی بود. والدین او و بسیاری دیگر در بمباران توکیو در جنگ جهانی دوم کشته شدند. کویچی با زنی به نام نوریکو و نوزاد یتیمی که او نجات داد، آکیکو، زندگی خود را بازسازی کرد. اما پس از آن گودزیلا دوباره ظهور کرد و کویچی تصمیم گرفت در مبارزه با هیولا بمیرد تا جزیره اودو را جبران کند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "“This is the AI men actually use”: Meta ads pushed apps nudifying real teens", "link": "https://arstechnica.com/tech-policy/2026/09/real-photos-of-young-girls-were-in-nudify-app-ads-on-facebook-instagram/", "summary": "Meta took days to remove ads containing AI-generated child sexual abuse material (CSAM) on Facebook and Instagram. Some ads featured photos of real kids, including a press photo of a young member of a European royal family and images swiped from a popular Instagram profile of a preteen girl deemed an influencer. In an investigation published Tuesday, the Tech Transparency Project (TTP) reported that Meta failed to detect 332 ads containing CSAM this year. The “vast majority” of ads promoted AI apps made in China, while many ads promoted so-called “nudify” apps that make it easy for bad actors to use AI and digitally alter images of children. TTP matched “multiple CSAM ads to photos of real children that appeared online.” These ads seem to violate federal child pornography laws, since the Justice Department has clarified that AI CSAM is just as harmful as CSAM . The young royal’s image was “animated into a video of her performing a graphic sex act,” TTP found. Other ads animated a photo of a 14-year-old Instagram influencer “showing off her new sports club uniform” into “a video of her performing oral sex.” A third “preteen” victim “posing in a pink athletic outfit with pigtails” in a series of stock photos was morphed into a video where she looks frightened as she’s molested by an adult male, TTP reported. Read full article Comments", "date_str": "2026-09-08T18:43:09+00:00", "hash": "a00eaf1c4491c06529177b8ddd06622d017aaec2799966fe65d97638b8708b8e", "title_fa": "«این همان هوش مصنوعی است که مردان واقعاً از آن استفاده می‌کنند»: تبلیغات متا برنامه‌هایی را که نوجوانان واقعی را برهنه می‌کنند، تحت فشار قرار می‌دهد", "summary_fa": "متا چند روز طول کشید تا تبلیغات حاوی مواد آزار جنسی کودکان (CSAM) تولید شده توسط هوش مصنوعی را در فیس بوک و اینستاگرام حذف کند. برخی از آگهی‌ها عکس‌هایی از بچه‌های واقعی را نشان می‌دادند، از جمله عکس مطبوعاتی یکی از اعضای جوان خانواده سلطنتی اروپا و تصاویری که از پروفایل محبوب اینستاگرام دختری نابالغ به‌عنوان اینفلوئنسر به‌نظر می‌رسید. در تحقیقی که روز سه شنبه منتشر شد، پروژه شفافیت فناوری (TTP) گزارش داد که متا در سال جاری موفق به شناسایی 332 آگهی حاوی CSAM نشده است. «اکثریت قریب به اتفاق» تبلیغات، برنامه‌های هوش مصنوعی ساخت چین را تبلیغ می‌کنند، در حالی که بسیاری از تبلیغات برنامه‌های به اصطلاح «برهنه‌سازی» را تبلیغ می‌کنند که استفاده از هوش مصنوعی را برای بازیگران بد و تغییر دیجیتالی تصاویر کودکان را آسان می‌کند. TTP «تبلیغات چندگانه CSAM را با عکس‌های کودکان واقعی که به صورت آنلاین ظاهر می‌شوند» مطابقت داد. به نظر می رسد این تبلیغات قوانین فدرال پورنوگرافی کودکان را نقض می کنند، زیرا وزارت دادگستری تصریح کرده است که AI CSAM به همان اندازه CSAM مضر است. TTP دریافته است که تصویر این جوان سلطنتی \"به صورت ویدئویی از او در حال انجام یک عمل جنسی گرافیکی متحرک شده است\". سایر تبلیغات عکس یک اینفلوئنسر 14 ساله اینستاگرام را \"در حال نشان دادن لباس جدید باشگاه ورزشی\" به \"ویدیویی از انجام رابطه جنسی دهانی او\" متحرک کردند. به گزارش تی تی پی، سومین قربانی «پیش‌نوجوان» که «با لباس ورزشی صورتی با دم خوک‌ها ژست گرفته بود» در مجموعه‌ای از عکس‌های استوک به ویدیویی تبدیل شد که در آن ترسیده به نظر می‌رسد زیرا توسط یک مرد بالغ مورد آزار و اذیت قرار می‌گیرد. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Update to Google’s AI weather model improves forecast accuracy", "link": "https://arstechnica.com/science/2026/09/googles-ai-weather-model-now-uses-more-raw-satellite-data/", "summary": "Google is one of the major players in AI (meaning machine learning) weather forecast model space. The models it and others generate have their strengths and weaknesses , but the main advantage is that they can have forecast performance similar to traditional models while requiring far less computing horsepower to run. That means they can be run more frequently. Google recently released version 3 of its WeatherNext model, with the biggest change being that it now ingests some satellite weather data, shortening the lag time between current weather conditions and generating a new forecast. The update is detailed in a white paper . Reanalysis Many weather models make use of what’s called a “reanalysis,” which is a sort of model of its own. Reanalyses take in all kinds of weather data and combine them into a single, consistent global snapshot of the atmosphere. That requires that they provide estimates for conditions over locations without real-world measurements, because weather forecast models need to work with a global picture. Read full article Comments", "date_str": "2026-09-08T18:00:56+00:00", "hash": "886cb2d0b830c6d2a4169d1173b278b8babc7ff955ab3026d622fa66ac5a5fb7", "title_fa": "به‌روزرسانی مدل هواشناسی هوش مصنوعی گوگل، دقت پیش‌بینی را بهبود می‌بخشد", "summary_fa": "گوگل یکی از بازیگران اصلی در فضای مدل های پیش بینی آب و هوا هوش مصنوعی (به معنای یادگیری ماشینی) است. مدل‌هایی که آن و سایرین تولید می‌کنند نقاط قوت و ضعف خود را دارند، اما مزیت اصلی این است که می‌توانند عملکردی مشابه مدل‌های سنتی پیش‌بینی کنند در حالی که برای اجرا به اسب‌بخار محاسباتی بسیار کمتری نیاز دارند. این بدان معناست که می توان آنها را به دفعات بیشتری اجرا کرد. گوگل به تازگی نسخه 3 مدل WeatherNext خود را منتشر کرده است، با بزرگترین تغییر این است که اکنون برخی از داده های آب و هوای ماهواره ای را دریافت می کند و زمان تاخیر بین شرایط آب و هوایی فعلی را کوتاه می کند و یک پیش بینی جدید ایجاد می کند. جزئیات به روز رسانی در یک کاغذ سفید ارائه شده است. تحلیل مجدد بسیاری از مدل‌های آب و هوا از چیزی که «تجزیه و تحلیل مجدد» نامیده می‌شود، استفاده می‌کنند، که نوعی مدل برای خود است. تجزیه و تحلیل مجدد انواع داده های آب و هوا را دریافت می کند و آنها را در یک عکس فوری جهانی منسجم از جو ترکیب می کند. این مستلزم آن است که آنها تخمین هایی را برای شرایط مکان ها بدون اندازه گیری های دنیای واقعی ارائه دهند، زیرا مدل های پیش بینی آب و هوا باید با یک تصویر جهانی کار کنند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Google complies with EU rules for travel searches, says the new results stink", "link": "https://arstechnica.com/gadgets/2026/09/google-says-europe-is-making-it-roll-out-degraded-travel-search-results/", "summary": "As the world's largest search engine, Google is often a target of Europe's Digital Markets Act (DMA), which seeks to rein in Big Tech. The European Commission hit Google with a hefty 460 million euro ($543 million) fine in July for preferring its own services in searches for travel and shopping. Google has now made changes in accordance with the European Union's wishes, but it claims the result is a massive reduction in search quality. If you don't live in Europe and perform a search for, say, hotels, Google will helpfully provide myriad sponsored links, booking recommendations, and price-comparison tools in its results. The problem is that this content isn't organic—Google includes links and offers contingent on its business interests. To get to the regular search results for these types of lucrative searches, you have to scroll way down the page. Companies that partner with Google can get more exposure, but the European Commission says this creates an unlevel playing field. \"To comply with DMA requirements, we're making significant changes to Search in Europe,\" Google's Nick Fox told Reuters . \"These changes ​degrade the user experience for ​Europeans, boosting online intermediaries ⁠at the expense of local businesses and removing helpful features people rely on every day.\" Read full article Comments", "date_str": "2026-09-08T16:49:55+00:00", "hash": "14ac4208dd0df8f44d0bb4205909c0a438827791596d595de5daa35a15b88a17", "title_fa": "گوگل از قوانین اتحادیه اروپا برای جستجوی سفر پیروی می کند، نتایج جدید می گوید که بوی بدی می دهد", "summary_fa": "گوگل به‌عنوان بزرگ‌ترین موتور جستجوی جهان، اغلب هدف قانون بازارهای دیجیتال اروپا (DMA) است که به دنبال مهار فناوری بزرگ است. کمیسیون اروپا در ماه جولای گوگل را به دلیل ترجیح دادن خدمات خود در جستجوی سفر و خرید، با جریمه سنگین 460 میلیون یورویی (543 میلیون دلار) محکوم کرد. گوگل در حال حاضر تغییراتی را مطابق با خواسته اتحادیه اروپا ایجاد کرده است، اما ادعا می کند که نتیجه آن کاهش شدید کیفیت جستجو است. اگر در اروپا زندگی نمی‌کنید و مثلاً هتل‌ها را جستجو می‌کنید، Google به کمک بی‌شمار پیوندهای حمایت‌شده، توصیه‌های رزرو، و ابزارهای مقایسه قیمت را در نتایج خود ارائه می‌کند. مشکل این است که این محتوا ارگانیک نیست - Google شامل پیوندها و پیشنهادات مشروط به منافع تجاری خود است. برای رسیدن به نتایج جستجوی معمولی برای این نوع جستجوهای پرسود، باید صفحه را به سمت پایین اسکرول کنید. شرکت‌هایی که با گوگل شریک می‌شوند می‌توانند در معرض دید بیشتری قرار بگیرند، اما کمیسیون اروپا می‌گوید این زمینه بازی نابرابر ایجاد می‌کند. نیک فاکس از گوگل به رویترز گفت: «برای رعایت الزامات DMA، ما در حال ایجاد تغییرات قابل توجهی در جستجو در اروپا هستیم. «این تغییرات تجربه کاربری را برای اروپایی‌ها کاهش می‌دهد، واسطه‌های آنلاین را به قیمت هزینه کسب‌وکارهای محلی تقویت می‌کند و ویژگی‌های مفیدی را که مردم هر روز به آن‌ها تکیه می‌کنند حذف می‌کند.» نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "The White House made a \"Tetris\" clone. The Tetris Company was not amused.", "link": "https://arstechnica.com/gaming/2026/09/the-white-house-made-a-tetris-clone-the-tetris-company-was-not-amused/", "summary": "An anti-immigration-themed adaptation of Tetris was removed from the White House website over the weekend. The move comes days after The Tetris Company disavowed any involvement with the game and said that it \"take[s] copyright infringement very seriously.\" The White House's \"Build the Wall\" game asked players to stop a \"Zombie Border siege\" by stacking Tetris -styled bricks in an attempt to \"hold the line.\" Unlike in Tetris , though, the blocks in \"Build the Wall\" don't disappear when you complete a line, meaning each brick contributes to an impassable barrier for the pixel-art \"zombies\" marching in from the \"Southern Border.\" That change makes the gameplay pretty uninteresting for anything but cheap propaganda, and it also means that every game quickly and ironically ends with a \"Border Breached\" message when the blocks inevitably fill up the well. Amerika Garcia Grewal, co-director of Texas migrant rights group Frontera Federation , told AFP last week that the makers of the game \"have lost touch with what it means to be human and care for others.\" Read full article Comments", "date_str": "2026-09-08T16:31:21+00:00", "hash": "80ba1917ca45af88ac2a3163c4176043f462b2fd3b34d0a0f04a54efc9e56f67", "title_fa": "کاخ سفید یک کلون \"تتریس\" ساخت. شرکت تتریس سرگرم نشد.", "summary_fa": "یک اقتباس با موضوع ضد مهاجرت از تتریس در آخر هفته از وب سایت کاخ سفید حذف شد. این اقدام چند روز پس از آن صورت گرفت که شرکت تتریس هرگونه دخالت در بازی را رد کرد و گفت که \"نقض کپی رایت را بسیار جدی می گیرد.\" بازی «ساخت دیوار» کاخ سفید از بازیکنان خواسته بود تا با چیدن آجرهایی به سبک تتریس، «محاصره مرزی زامبی» را در تلاش برای «حفظ خط» متوقف کنند. با این حال، برخلاف تتریس، بلوک‌های «Build the Wall» با تکمیل یک خط ناپدید نمی‌شوند، به این معنی که هر آجر مانعی غیرقابل عبور برای «زامبی‌های هنری» پیکسلی می‌شود که از «مرز جنوبی» وارد می‌شوند. این تغییر باعث می‌شود که گیم‌پلی برای هر چیزی غیر از تبلیغات ارزان‌قیمت غیرقابل توجه باشد، و همچنین به این معنی است که هر بازی به سرعت و به طرز طنزآمیزی با پیام \"Border Breached\" پایان می‌یابد، زمانی که بلوک‌ها به ناچار چاه را پر می‌کنند. آمریکا گارسیا گروال، یکی از مدیران گروه حقوق مهاجران تگزاس، فدراسیون Frontera، هفته گذشته به خبرگزاری فرانسه گفت که سازندگان بازی \"ارتباط خود را با معنای انسان بودن و مراقبت از دیگران از دست داده اند.\" نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "The secret to protecting next-gen spacecraft might be eggshells", "link": "https://arstechnica.com/science/2026/09/how-eggshells-can-protect-spacecraft-from-space-debris/", "summary": "In 2007, a piece of space debris punched a bullet-like hole through the radiator panel of the US space shuttle Endeavor . The shuttle program ended in 2011, but the space debris problem has only intensified as we launch more and more satellite constellations, telescopes, and spacecraft into orbit. That's why Chinese scientists have devised a new aluminum material inspired by eggshells that they believe could offer enhanced protection against debris fragments, according to a new paper published in the Journal of Applied Physics. Eggshells have long fascinated scientists because of their mechanical properties . For instance, it's well known that cracking an egg requires applying just enough force to the center to achieve a clean break without completely shattering the shell. In 2012, MIT mechanical engineer Pedro Reis co-authored a paper demonstrating the link between an egg's ovoid geometry and its rigidity, a major factor when predicting how much force an object can endure before cracking. (As I wrote for Slate at the time, rigidity is related to, but distinct from, strength. If one eggshell has tiny cracks and the other doesn't, both shells have different strengths—the cracked one will break more easily—but the same rigidity.) Reis started studying eggshells after participating in a popular physics demonstration: walking on cartons of eggs without breaking them. The key, he learned, was to align the eggs with their narrow tip (the most crack-resistant part) pointing up, and then carefully place one's feet to distribute one's weight over the entire surface area. This ensures that no single egg is overloaded. While it takes around 5.5 pounds of force to crack an egg, that depends on the direction in which the force is applied, as well as its distribution over the shell's surface. Read full article Comments", "date_str": "2026-09-08T16:20:58+00:00", "hash": "888305f7f0ba0ac38634306dc97731e1a31998ec9ff9ac4375a8aec6af7f5f7b", "title_fa": "راز محافظت از فضاپیماهای نسل بعدی ممکن است پوسته تخم مرغ باشد", "summary_fa": "در سال 2007، تکه‌ای از زباله‌های فضایی، سوراخی شبیه به گلوله را از طریق پانل رادیاتور شاتل فضایی اندیور ایالات متحده ایجاد کرد. برنامه شاتل در سال 2011 به پایان رسید، اما مشکل زباله های فضایی تنها با پرتاب هرچه بیشتر صورت های فلکی ماهواره ای، تلسکوپ ها و فضاپیماها به مدار تشدید شد. به همین دلیل است که دانشمندان چینی یک ماده آلومینیومی جدید با الهام از پوسته تخم مرغ ابداع کرده‌اند که به اعتقاد آنها می‌تواند محافظت بیشتری در برابر تکه‌های زباله داشته باشد، طبق مقاله جدید منتشر شده در مجله فیزیک کاربردی. پوسته‌های تخم‌مرغ مدت‌هاست که دانشمندان را به دلیل خواص مکانیکی خود مجذوب خود کرده است. به عنوان مثال، به خوبی شناخته شده است که شکستن یک تخم مرغ مستلزم اعمال نیروی کافی به مرکز برای رسیدن به یک شکستگی تمیز بدون شکستن کامل پوسته است. در سال 2012، پدرو ریس، مهندس مکانیک MIT، مقاله‌ای را نوشت که نشان می‌دهد ارتباط بین هندسه تخم مرغی تخم مرغ و صلبیت آن، عاملی مهم در پیش‌بینی میزان نیرویی که یک جسم می‌تواند قبل از ترک خوردن تحمل کند، را نشان می‌دهد. (همانطور که در آن زمان برای Slate نوشتم، استحکام به استحکام مربوط است، اما از آن متمایز است. اگر یکی از پوسته‌های تخم‌مرغ دارای ترک‌های ریز باشد و دیگری نداشته باشد، هر دو پوسته دارای قدرت‌های متفاوتی هستند - پوسته‌ی ترک‌خورده راحت‌تر می‌شکند - اما سختی یکسانی دارد. او آموخت که کلید این بود که تخم‌ها را با نوک باریکشان (مقاوم‌ترین قسمت در برابر ترک) که به سمت بالا باشد، تراز کرده و سپس با احتیاط پاهای خود را قرار دهید تا وزن خود را در کل سطح توزیع کنید. این تضمین می کند که هیچ تخمکی بیش از حد بارگذاری نشود. در حالی که برای شکستن تخم‌مرغ حدود 5.5 پوند نیرو لازم است، این به جهتی"}, {"source": "Ars Technica", "title": "The combat demo for Free Stars: Children of Infinity is out, and it's free", "link": "https://arstechnica.com/gaming/2026/09/the-official-sequel-to-the-ur-quan-masters-releases-its-free-demo-today/", "summary": "After five years in development, Free Stars: Children of Infinity —the official sequel to The Ur-Quan Masters by the old game's original creators—has released a free public demo. It's a \"combat demo\" in the style of UQM ’s melee mode, where players can assemble a fleet from the game's roster of nearly 40 ships, then match those ships up in head-to-head arcade SpaceWar -style action. The demo can be found on Steam and GOG , and it's available for Windows, Mac, and Linux. (Console versions are coming, but they're not yet out.) Pew pew! Credit: Pistol Shrimp Games I have to present this news with a big disclaimer, though, because I've been part of the Children of Infinity writing team since 2021, working as a volunteer with the Pistol Shrimp Games crew and contributing NPC dialogue and some story bits. As a huge fan of the original games, it's been a dream opportunity. (Because I've been volunteering my time, I'm not financially involved and receive no compensation if you download the demo or, when it's eventually released, buy the full game.) What's in the demo Children of Infinity is a space adventure RPG, just like The Ur-Quan Masters (and its direct spiritual predecessors, Starflight and Starflight 2 ). What's been released today is just one part of the game—the arcade-style \"melee\" portion, which lets players jump into one-versus-one combat against another player or against a computer-controlled opponent. Each of the ships you can pick has its own maneuvering characteristics, weapons, and special abilities. Read full article Comments", "date_str": "2026-09-08T16:05:32+00:00", "hash": "c5947dfece59155162fa60a146512a6c0a563075699511db64a0e2e94a5810c0", "title_fa": "نسخه ی نمایشی مبارزه برای Free Stars: Children of Infinity منتشر شد و رایگان است", "summary_fa": "پس از پنج سال ساخت، Free Stars: Children of Infinity - دنباله رسمی The Ur-Quan Masters توسط سازندگان اصلی بازی قدیمی - یک نسخه نمایشی عمومی رایگان منتشر کرده است. این یک «دمو رزمی» به سبک حالت غوغا UQM است، که در آن بازیکنان می‌توانند ناوگانی را از فهرست نزدیک به 40 کشتی جمع‌آوری کنند، سپس آن کشتی‌ها را در اکشن بازی‌های رو در رو به سبک SpaceWar هماهنگ کنند. نسخه ی نمایشی را می توان در Steam و GOG پیدا کرد و برای ویندوز، مک و لینوکس در دسترس است. (نسخه های کنسول در حال آمدن هستند، اما هنوز منتشر نشده اند.) Pew pew! اعتبار: Pistol Shrimp Games باید این خبر را با یک سلب مسئولیت بزرگ ارائه کنم، زیرا از سال 2021 بخشی از تیم نویسندگی Children of Infinity هستم و به عنوان داوطلب با خدمه Pistol Shrimp Games کار می‌کنم و در گفتگوهای NPC و برخی داستان‌ها مشارکت می‌کنم. به عنوان یکی از طرفداران بزرگ بازی های اصلی، این یک فرصت رویایی بوده است. (از آنجایی که من داوطلبانه وقت خود را صرف کرده ام، از نظر مالی درگیر نیستم و در صورت دانلود نسخه ی نمایشی یا زمانی که در نهایت منتشر شد، بازی کامل را بخرید، هیچ غرامتی دریافت نمی کنم.) آنچه در نسخه ی نمایشی Children of Infinity وجود دارد، یک RPG ماجراجویی فضایی است، درست مانند The Ur-Quan Masters (و پیشینیان مستقیم معنوی آن، Starflight، Starflight و Starflight). آنچه امروز منتشر شده است تنها بخشی از بازی است - بخش \"غوغا\" به سبک آرکید، که به بازیکنان اجازه می دهد به مبارزه یک در مقابل یک علیه بازیکن دیگر یا در برابر یک حریف تحت کنترل کامپیوتری بپرند. هر یک از کشتی‌هایی که می‌توانید انتخاب کنید، ویژگی‌های مانور، سلاح‌ها و توانایی‌های خاص خود را دارند. نظرات مقاله کامل را بخوانید"}, {"source": "Wired", "title": "A Stealth Startup Thinks It Just Hacked the Memory Shortage", "link": "https://www.wired.com/story/a-new-dollar400-million-startup-wants-to-fix-the-ai-memory-bottleneck/", "summary": "Kepler Computing claims a new approach to chip design—and a proprietary material—can help end the supply bottlenecks that have sent memory prices surging.", "date_str": "2026-09-09T13:00:00+00:00", "hash": "b815c
