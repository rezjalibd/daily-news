 Ti West, is expected to [ ]", "date_str": "2026-11-13T15:32:12+00:00", "hash": "29ab6156bfe4dcf7", "title_fa": "باکس آفیس: «Ebenezer» جانی دپ در پیش نمایش 1.5 میلیون دلار درآمد کسب کرد.", "summary_fa": "جانی دپ برای اولین بار پس از فیلم Fantastic Beasts: The Crimes of Grindelwald در سال 2018، در یک فیلم بزرگ هالیوود با ایبنیزر از پارامونت به پرده سینما بازگشت. برداشت جدید و کمدی تیره او از سریال سرود کریسمس در پیش نمایش 1.5 میلیون دلاری در باکس آفیس فروش داشته است. Ebenezer، به کارگردانی Ti West، انتظار می‌رود که [] دپ در جریان محاکمه آزار خانگی خود علیه همسر سابقش امبر هرد از هالیوود کناره‌گیری کند، اما او همچنان مشغول ساخت فیلم‌های مستقل و بین‌المللی در خارج از کشور بود. او همچنان مشغول درام 2020 «میناماتا»، قطعه دوره ای 2023 «ژان دو بری» بود و فیلم بیوگرافی «Modì, Three Days on the Wing of Madness» در سال 2024 را کارگردانی کرد. ابنزر اولین فیلم مهم هالیوودی خود را در هشت سال پس از Fantastic Beats نشان می‌دهد (برادران وارنر در سومین فیلم، اسرار دامبلدور، مادز میکلسن را جایگزین او کرد). در مرحله بعد، او در تریلر انتقام جویانه Lionsgate به همراه مدلین کلین و پنه لوپه کروز بازی خواهد کرد که قرار است در ماه مارس اکران شود. بازیگران Ebenezer همچنین شامل روپرت گرینت در نقش باب کراچیت کارمند اسکروج، ایان مک‌کلن، دیزی ریدلی، سم کلافلین، اندرو رایزبورو در نقش شبح گذشته کریسمس، ترامل تیلمن در نقش هدیه کریسمس و رابرت استرنج در نقش کریسمس هنوز در راه است.", "image_url": "https://variety.com/wp-content/uploads/2026/11/MCDEBAC_PA010.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۲ آبان • ۱۹:۰۲"}, {"source": "Variety", "title": "‘Prima Facie’ Review: Cynthia Erivo Brings Conviction, but Not Necessarily a Conviction, to an Impassioned but Clunky Legal Drama", "link": "https://variety.com/2026/film/reviews/prima-facie-review-cynthia-erivo-1236946882/", "summary": "When a successful stage play is transferred to the screen, the typical concern is how much to “open it out” for the new medium: too little, and you wonder why they bothered; too much, and you lose the electric intimacy that galvanized audiences in the first place. It’s to the credit of “Prima Facie,” director [ ]", "date_str": "2026-11-13T15:18:43+00:00", "hash": "4d7f4c7fddecded9", "title_fa": "نقد و بررسی «Prima Facie»: سینتیا اریوو برای یک درام حقوقی پرشور اما سخت، محکومیت را به ارمغان می‌آورد، اما نه لزوماً یک محکومیت", "summary_fa": "وقتی یک نمایش صحنه موفق به صفحه نمایش منتقل می شود، نگرانی معمول این است که چقدر باید آن را برای رسانه جدید \"باز کرد\": خیلی کم است، و شما تعجب می کنید که چرا آنها اذیت شدند. بیش از حد، و شما صمیمیت الکتریکی را که در وهله اول بینندگان را برانگیخته بود، از دست می دهید. این به اعتبار کارگردان «Prima Facie» است [ ] ستاره نقش برنده تونی جودی کامر را به عنوان یک وکیل دادگستری موفق به ارث می برد که در یک پرونده تجاوز جنسی شاکی شد، اما فیلم ضربه صحنه سوزانا وایت کمی ثابت می ماند. و موضوع هنوز یقه شما را جلب می کند: با تأمل بر تأثیر روانی تجاوز جنسی، و احتمال طولانی کشاندن مجرمان به عدالت حتی از درون سیستم قانونی، این هفته در یک لحظه خاص در سینماهای بریتانیا فرود می آید - زیرا محکومیت برجسته راسل برند نشانگر یک پیروزی همه جانبه جنسی برای افراد غیرقانونی است. فقط حیف که فیلم بهتری نیست. اقتباس میلر از نمایشنامه خودش گرم و سرد است، زیرا تقسیم جریان تئاتری جریان آگاهی منبع به دیالوگ و اجرای مونولوگ داخلی، پاداش های متفاوتی را به همراه دارد. در اینجا نوشته‌های بسیار سنگینی وجود دارد، اما در جاهای دیگر فیلمنامه هوشمندانه تصور می‌شود - تضاد بین صداهای درونی و بیرونی، آگاهی دوگانه و تغییر رمزهای روزمره قهرمان داستان تسا انسلر، یک زن سیاه‌پوست طبقه کارگر و یک وکیل تحصیل‌کرده در کمبریج را تعریف می‌کند که به‌دلیل فقدان وکیل‌زاده‌ای که در کمبریج به دنیا آمده است، به مبارزه می‌پردازد. و سینتیا اریوو، با به ارث بردن یک نقش مجرب که جودی کامر تونی و اولیویه را به ارث برد، کار قابل قبولی را با آن انجام می دهد - قوی ترین در قسمت میانی فیلم، که یک مطالعه خام و دردناک از PTSD را بلافاصله پس", "image_url": "https://variety.com/wp-content/uploads/2026/09/MV5BMGVmMjIzMmItMzY2ZS00MzJlLWE5MTItNTZkMGI3YzZlMzdlXkEyXkFqcGc@._V1_.jpg?crop=0px%2C15px%2C1200px%2C675px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۲ آبان • ۱۸:۴۸"}, {"source": "Billboard", "title": "Queen Latifah’s Full-Circle Moment: How the Rock Hall Honoree Is Giving Back to New Jersey", "link": "https://www.billboard.com/music/rb-hip-hop/queen-latifah-rock-hall-you-can-go-home-doc-interview-1236378188/", "summary": "“First of all, let me teach you how to walk through Newark. Don t say ‘New-work,’” quips Queen Latifah, playfully schooling me on the proper pronunciation of her hometown. “It s just one syllable. Never get caught saying ‘New-work.’” The spirited polymath remains as sly and quick-witted as ever, nearly four decades after bursting onto the hip-hop scene in the late 1980s. More than three decades after delivering her seminal rallying cry, “U.N.I.T.Y.,” Latifah is channeling that same spirit of empowerment into giving back to the city that raised her. In her upcoming BET documentary, You Can Go Home Again — set to premiere Nov. 27 — the rap pioneer is in restoration mode, helping provide affordable housing for families in her hometown of Newark, New Jersey. “I grew up in a very busy place where I got to experience jazz, gospel and rock and roll. I got to see hip-hop being born. I experienced love for the first time, death for the first time, danger and excitement in every possible way,” she recalls. For Latifah, her commitment to uplifting her community comes at a crowning moment in her storied career. On Saturday (Nov. 14), she ll be inducted into the Rock Roll Hall of Fame as a recipient of the Early Influence Award. She joins a star-studded class of musical luminaries, including Phil Collins, Celia Cruz, Sade, Oasis and Fela Kuti, alongside fellow hip-hop trailblazers Wu-Tang Clan and MC Lyte. “There are so many people I carry in my heart and on my back,” she says. “The KRS-Ones of the world, the Public Enemys of the world — I m not me without them. They showed us how to do it. They took us little baby acts on tour and taught us how to do things. I really appreciate them.” Billboard spoke with Queen Latifah about the meaning of home, her upcoming documentary, and earning her place in the Rock Roll Hall of Fame. You ve built an incredible legacy in entertainment, but now you re helping families in Newark find a place to call home. When you think about everything you ve accomplished, what makes this chapter of your life, particularly giving back, so meaningful to you? I ve always loved real estate and interior design. It s always been something I m into. So, to be able to see something go from an idea to actual brick and mortar, with people living there, is incredible. To see it come to fruition and know there are people who will be living in these apartments, getting up and going to work, who may work for BET or may be the next executive who gives me a job ", "date_str": "2026-11-13T15:00:00+00:00", "hash": "dff5c53de07b47ea", "title_fa": "لحظه کامل ملکه لطیفه: چگونه افتخاری راک هال به نیوجرسی برمی گردد", "summary_fa": "ملکه لطیفه با شوخی به من آموزش می دهد که چگونه در نیوآرک قدم بزنید. \"این فقط یک هجا است. هرگز با گفتن \"کار جدید\" گرفتار نشوید.\" این پلیماث با روحیه مانند همیشه حیله گر و تیزبین است، تقریباً چهار دهه پس از ورود به صحنه هیپ هاپ در اواخر دهه 1980. لطیفه بیش از سه دهه پس از ایراد فریاد تجمع کننده خود، «U.N.I.T.Y.»، همان روحیه توانمندی خود را برای پس دادن به شهری که او را بزرگ کرده است، هدایت می کند. در مستند آینده او BET، You Can Go Home Again - که قرار است در 27 نوامبر اکران شود - پیشگام رپ در حالت بازسازی است و به ارائه مسکن مقرون به صرفه برای خانواده ها در زادگاهش نیوآرک، نیوجرسی کمک می کند. من در مکانی بسیار شلوغ بزرگ شدم که جاز، گاسپل و راک اند رول را تجربه کردم. تولد هیپ هاپ را دیدم. من برای اولین بار عشق را تجربه کردم، برای اولین بار مرگ، خطر و هیجان را به هر طریق ممکن تجربه کردم.» برای لطیفه، تعهد او به ارتقای جامعه اش در نقطه پایانی از زندگی حرفه ای او رخ می دهد. در روز شنبه (14 نوامبر)، او به عنوان دریافت کننده جایزه Eward به تالار مشاهیر راک رول معرفی خواهد شد. او به کلاس ستاره‌ای از مشاهیر موسیقی، از جمله فیل کالینز، سلیا کروز، ساد، اوسیس و فلا کوتی، در کنار وو تانگ کلن و ام‌سی لایت، پیشگامان هیپ‌هاپ می‌پیوندد. او می‌گوید: «مردم زیادی هستند که من در قلب و پشتم حمل می‌کنم. \"KRS-Ones جهان، دشمنان عمومی جهان - من بدون آنها من نیستم. آنها به ما نشان دادند که چگونه این کار را انجام دهیم. آنها به ما بازیگران کودک کوچک را به تور بردند و به ما یاد دادند که چگونه کارها را انجام دهیم. من واقعاً از آنها", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P108EAHP-e1794519407886.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۲ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Taylor Swift to Perform at CMA Awards for First Time in 13 Years", "link": "https://www.billboard.com/music/awards/taylor-swift-perform-cma-awards-2026-1236381663/", "summary": "Taylor Swift is returning to the CMA Awards stage for her first performance at the ceremony in 13 years, the CMAs and ABC announced on Friday (Nov. 13). The 60th Annual CMA Awards will air live from Nashville Wednesday, Nov. 18, on ABC and Disney+ (and available the following day on Hulu). Related Taylor Swift to Receive 2026 Sherry Lansing Leadership Award From Greta Gerwig at Women in Entertainment Gala Travis Kelce Plans to Consult Taylor Swift on This Business Venture: I ll See What My Wife Can Cook Up Taylor Swift Celebrates Her 2026 CMA Award Nomination: I Haven t Yee d My Last Haw Swift, who has won CMA entertainer of the year winner twice, is nominated for a CMA Award this year for single of the year for I Knew It, I Knew You, which marks her 26th career CMA nomination. The pop superstar wrote and recorded I Knew It, I Knew You which topped the Billboard Hot 100 for two weeks for the animated movie Toy Story 5 , which released earlier this year. Swift also co-produced the track with Jack Antonoff. Swift has earned nine total CMA Awards wins to date. The singer-songwriter, who was just inducted into the Nashville Songwriters Hall of Fame during a Music City ceremony a few weeks ago, has never won a CMA in the single of the year category, though she was previously nominated in the category in 2013, for her work on Highway Don t Care, recorded with Tim McGraw and Keith Urban. The 14-time Grammy winner first attended the CMAs in 2006, and picked up her first win the following year with the horizon award. In 2009, she became the youngest CMA entertainer of the year winner in history. The 2013 CMA Awards saw Swift earn the pinnacle award, which had previously been awarded to artists including Tim McGraw, George Strait, Faith Hill, Keith Urban, Brad Paisley and Rascal Flatts. That year, she also performed her hit Red with Vince Gill and Alison Krauss, marking her most recent performance on the CMA Awards stage. The 60th Annual CMA Awards is a production of the Country Music Association, with Robert Deaton serving as executive producer, Alan Carter serving as director, and Jon Macks serving as head writer. Ella Langley leads this year s CMA Awards with nine nominations, followed by Miranda Lambert with five. Lainey Wilson will host the CMAs for a third consecutive year.", "date_str": "2026-11-13T14:38:19+00:00", "hash": "9357f26027bcfac7", "title_fa": "تیلور سویفت برای اولین بار پس از 13 سال در جوایز CMA اجرا می کند", "summary_fa": "CMA و ABC در روز جمعه (13 نوامبر) اعلام کردند که تیلور سوئیفت برای اولین اجرای خود در مراسم پس از 13 سال به صحنه جوایز CMA بازمی گردد. شصتمین جوایز سالانه CMA به طور زنده از نشویل چهارشنبه، 18 نوامبر، در ABC و Disney+ پخش خواهد شد (و روز بعد در Hulu در دسترس است). تیلور سویفت مرتبط برای دریافت جایزه رهبری شری لنسینگ 2026 از گرتا گرویگ در جشن زنان در سرگرمی تراویس کلس قصد دارد با تیلور سویفت در مورد این سرمایه گذاری تجاری مشورت کند: خواهم دید که همسرم چه چیزی می تواند بپزد تیلور سوئیفت جشن سال 2026 خود را جشن می گیرد. سوئیفت که دو بار برنده جایزه بهترین سرگرمی سال CMA شده است، امسال برای تک آهنگ سال برای I     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
