e) $289.99 (List Price $289.99) Apple TV 4K 4th Gen 128GB Streaming Player (2026 Model) $299.00 (List Price $299.00) Ring Indoor Cam Plus 2K Wired Security Camera (2-Pack, White) $99.99 (List Price $119.98) TCL Tab 10 Gen 4 128GB 10.1\" Tablet (Dark Blue/", "date_str": "2026-10-14T18:30:00+00:00", "hash": "552071c321ef384d", "title_fa": "بهترین تلویزیون OLED برای اکثر مردم در حال حاضر 400 دلار تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. OLEDها به داشتن بهترین کیفیت تصویری که تلویزیون‌ها می‌توانند ارائه دهند، شناخته شده‌اند. یکی از بزرگترین معایب OLED ها قیمت آنهاست. اگر هرگز OLED نداشته اید زیرا هزینه آن بسیار بالاست، سامسونگ یک OLED ساخته است که در دسترس است: تلویزیون سری S90H سامسونگ. در حال حاضر، تلویزیون 65 اینچی سری S90H سامسونگ پس از 21 درصد تخفیف، 1497.99 دلار (در اصل 1897.99 دلار) است و با توجه به ابزارهای ردیابی قیمت، به پایین ترین قیمت خود رسیده است. این تلویزیون همچنین یکی از بهترین تلویزیون های OLED برای اکثر مردم به حساب می آید. تلویزیون هوشمند OLED S90H سری 65 اینچی Samsung Vision AI (مدل 2026، 65S90H) OLED HDR+ با Glare Free، پردازنده NQ4 AI Gen3، 4K AI Upscaling Pro، AI Motion Enhancer Pro، الکسا داخلی 89 دلار با قیمت 1.497 دلار. 400.00 دلار دریافت معامله دریافت معامله 1497.99 دلار در آمازون 1897.99 دلار صرفه جویی 400.00 دلار آنچه که تلویزیون S90H سامسونگ را متمایز می کند کیفیت تصویر آن است، زیرا با OLED های بسیار گران تر قابل مقایسه است. بر اساس بررسی CNET، برخی از ویژگی های برجسته دیگر زمان پاسخگویی عالی آن برای بازی 9.33 میلی ثانیه و فیلتر ضد انعکاس آن است که آن را برای محیط های روشن بسیار مناسب می کند. پوشش ضد انعکاس نمایشگر به از بین بردن تابش خیره کننده و بازتاب هنگام تماشای تلویزیون در طول روز یا زمانی که لامپ ها یا چراغ ها در زوایایی قرار می گیرند که باعث می شود صفحه نمایش کمتر دیده شود، کمک می کند. این یک مزیت بزرگ است که تلویزیون‌های OLED به روشنی تلویزیون‌های QLED شناخته شده‌اند. در بالای پوشش تخصصی، خروجی نور S90H با OLED"}, {"source": "Lifehacker", "title": "Four New Features Coming to Your iPhone in iOS 27.2 (and One That Will Be Missing)", "link": "https://lifehacker.com/tech/new-features-coming-to-iphone-ios-272?utm_medium=RSS", "summary": "We may earn a commission from links on this page. If you're like most people, you might still be getting used to iOS 27 on your iPhone. Perhaps you haven't even installed it yet, or maybe you're confused about why iOS 27.0.1 exists. (The short answer: The iPhone 18 Pro is a bit glitchy .) But there's a new iPhone update on the horizon that adds even more new features and changes to the mix: iOS 27.2. While this update isn't nearly as big of an overhaul as iOS 27 itself, it's still impactful even if Apple already removed its best new feature. Here's what's new. The update is currently in testing, so if you want to try it out early, y ou can enroll your iPhone in Apple's beta and check these features out today. Just know that all betas come with some level of risk, so if you decide to go down this path, create a proper backup of all important data before installing the beta. iPhone 18 Pro $1,199.00 at Apple Shop Now Shop Now $1,199.00 at Apple iPhone 18 Pro Max $1,299.00 at Apple Shop Now Shop Now $1,299.00 at Apple iPhone Duo $1,999.00 at Apple Pre-order Here Pre-order Here $1,999.00 at Apple SEE 0 MORE iOS 27.2 expands \"Call Context\" Call Context is an excellent use of Apple Intelligence. When you're on a phone call, Apple Intelligence checks if the phone number you're calling is related to a business that you have relevant information for elsewhere on your device. If so, it fetches that information for you and displays it on the call screen. For example, if you're talking with your airline's customer service line, Call Context can proactively display your flight number based on the itinerary it finds in your email. With iOS 27.2, Call Context now includes anniversary alerts. If you're on a phone call with someone you have a saved anniversary for, that alert will appear on-screen. That way, you can get a small reminder if you call a friend on their birthday, but you happened to forget the occasion. (Thank you, technology, for saving some of us from our thoughtlessness, even if you are enabling bad habits.) FaceTime is getting ASL support As part of a previous announcement of accessibility features , Apple revealed it was adding a new API to FaceTime that supports adding a human interpreter to video calls. This feature did not make it to iOS 27, but it appears to be rolling out in Apple's next update, making video calls more accessible going forward. Apple TV profiles are coming to iPhone and iPad If you have an Apple TV, you likely know you can set up prof", "date_str": "2026-10-14T17:30:00+00:00", "hash": "ad1a7aaf6a55dd95", "title_fa": "چهار ویژگی جدید که در iOS 27.2 به آیفون شما می‌آیند (و یکی که گم خواهد شد)", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اگر شما هم مانند اکثر مردم هستید، ممکن است همچنان به iOS 27 در آیفون خود عادت کنید. شاید حتی هنوز آن را نصب نکرده باشید، یا شاید در مورد دلیل وجود iOS 27.0.1 سردرگم شده باشید. (پاسخ کوتاه: آیفون 18 پرو کمی پرگل است.) اما به‌روزرسانی جدید آیفون در افق وجود دارد که ویژگی‌ها و تغییرات جدید بیشتری را به ترکیب اضافه می‌کند: iOS 27.2. در حالی که این به روز رسانی تقریباً به اندازه خود iOS 27 یک تغییر اساسی نیست، حتی اگر اپل قبلاً بهترین ویژگی جدید خود را حذف کرده باشد، هنوز تأثیرگذار است. در اینجا چه چیزی جدید است. این به‌روزرسانی در حال حاضر در مرحله آزمایش است، بنابراین اگر می‌خواهید زودتر آن را امتحان کنید، می‌توانید آیفون خود را در نسخه بتا اپل ثبت کنید و امروز این ویژگی‌ها را بررسی کنید. فقط بدانید که همه نسخه های بتا با سطحی از خطر همراه هستند، بنابراین اگر تصمیم دارید این مسیر را طی کنید، قبل از نصب نسخه بتا یک نسخه پشتیبان مناسب از تمام داده های مهم ایجاد کنید. iPhone 18 Pro 1,199.00 دلار در Apple Shop اکنون خرید کنید 1,199.00 دلار در Apple iPhone 18 Pro Max 1,299.00 دلار در Apple Shop Now اکنون خرید کنید 1,299.00 دلار در Apple iPhone Duo 1,999.00 دلار در Apple iPhone Duo پیش‌سفارش در اینجا. پیش‌سفارش اینجا 0. \"Call Context\" Call Context استفاده عالی از هوش اپل است. وقتی در حال تماس تلفنی هستید، Apple Intelligence بررسی می‌کند که آیا شماره تلفنی که با آن تماس می‌گیرید مربوط به کسب‌وکاری است که اطلاعات مربوط به آن را در جای دیگری در دستگاه خود دارید یا خیر. اگر چنین است، آن اطلاعات را برای شما واکشی می کند و در صفحه تماس نمایش می دهد. به"}, {"source": "Lifehacker", "title": "10 Shows Like 'East of Eden' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-east-of-eden?utm_medium=RSS", "summary": "We may earn a commission from links on this page. It turns out the kids can't get enough of John Steinbeck. The Florence Pugh-led, Zoe Kazan-created adaptation of his novel East of Eden has been a massive hit for Netflix, its epic story covering decades in the lives of two California families in the run-up to World War I. And why not? It's got grand family drama and plenty of sex, set against a massive historical backdrop and stuffed with biblical allusions that make it all feel like less of a guilty pleasure. If this is your bag, here are more similar shows to stream after you've finished your binge-watch. The House of the Spirits (2026) One generation will inevitably influence those that follow, for better and worse sins and strengths in equal measure, dramatized most succinctly, perhaps, by Steinbeck's East of Eden and in Isabel Allende's seminal novel, adapted here (indicentally, both books are among the most frequently challenged in the United States). Told from the perspective of Alba (Rochi Hern ndez), House of the Spirits starts in the 1970s and works backward as Alba explores four generations of family history through he journals of her grandmother, Clara (Dolores Fonzi). Though their country is never named, Allende based it all on the real history of Chile through those decades of political violence and upheaval, and on her own family's triumphs and tragedies in its wake. Stream The House of the Spirits on Prime Video. The House of the Spirits (2026) at Prime Video Learn More Learn More at Prime Video War and Peace (2016) The most recent adaptation of Leo Tolstoy's epic, and a pretty good one. We begin in 1805, during the height of the Napoleonic Wars, meeting Pierre (Paul Dano), the idealistic illegitimate son of an oligarch; romantic and impulsive dancer Natasha (Lily James); and thoughtful, high-minded Andrei (James Norton), destined to become a soldier. Throughout the years of war that follow, the three of them and their families move in and out of each other's lives, as tragedy alternately unites and divides them. Stream War and Peace on Peacock and Prime Video . War and Peace (2016) at Peacock Learn More Learn More at Peacock Pachinko (2022 ) Starting in 1915, this multigenerational saga follows one woman (played in different time periods by Youn Yuh-jung and Kim Min-ha) and her family, taking us from the Japanese occupation of Korea through the decades of the Korean diaspora. With her opportunities limited, Sunja leaves her home and family", "date_str": "2026-10-14T17:00:00+00:00", "hash": "98426b0e53ede4f1", "title_fa": "10 نمایش مانند \"شرق عدن\" که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. معلوم شد بچه ها از جان اشتاین بک سیر نمی شوند. اقتباسی که زوئی کازان به رهبری فلورانس پوگ از رمان او شرق عدن خلق کرد، موفقیت بزرگی برای نتفلیکس بود، داستان حماسی آن دهه‌ها از زندگی دو خانواده کالیفرنیایی را در آستانه جنگ جهانی اول پوشش می‌دهد. و چرا که نه؟ این یک درام خانوادگی بزرگ و روابط جنسی فراوان است، در یک پس‌زمینه تاریخی عظیم و مملو از اشارات کتاب مقدسی است که باعث می‌شود کمتر احساس گناه کند. اگر این کیف شماست، در اینجا نمایش‌های مشابه بیشتری برای پخش جریانی پس از پایان تماشای پرخوری وجود دارد. خانه ارواح (2026) یک نسل به ناچار بر روی نسل‌های بعدی تأثیر می‌گذارد، برای گناهان و نقاط قوت بهتر و بدتر، که به طور خلاصه، شاید در شرق عدن اثر اشتاین بک و در رمان اصلی ایزابل آلنده، که در اینجا اقتباس شده است، به طور خلاصه به نمایش درآمده است (به طور غیرعادی، هر دو کتاب در ایالات متحده از جمله کتاب‌هایی هستند که اغلب به چالش کشیده می‌شوند). از دیدگاه آلبا (روچی هرن روشن)، خانه ارواح در دهه 1970 شروع می شود و به عقب عمل می کند زیرا آلبا چهار نسل از تاریخ خانواده را از طریق مجله های مادربزرگش، کلارا (دولورس فونزی) بررسی می کند. اگرچه نام کشور آنها هرگز ذکر نشده است، اما آلنده همه آن را بر اساس تاریخ واقعی شیلی در طی آن دهه‌های خشونت و تحولات سیاسی، و پیروزی‌ها و تراژدی‌های خانواده‌اش در پی آن است. خانه ارواح را در پرایم ویدیو پخش کنید. The House of the Spirits (2026) در Prime Video بیشتر بدانید در Prime Video War and Peace (2016) جدیدترین اقتباس از حماسه لئو تولستوی و اقتباس بسیار خوب. ما در سال 1805، در دوران اوج جنگ های"}, {"source": "Lifehacker", "title": "Your PC Has Over 1,400 (Known) Security Flaws—Here's How to Fix Them", "link": "https://lifehacker.com/tech/your-pc-has-over-1400-known-security-flaws-heres-how-to-fix-them?utm_medium=RSS", "summary": "Microsoft's monthly Patch Tuesday bug count has been trending higher since the beginning of the summer, and October is no different. The company just issued fixes for a record 1,411 vulnerabilities, including three zero-days, which are flaws that have been actively exploited or publicly disclosed before an official patch is available, making them especially risky. For comparison, in October 2025, Microsoft issued patches for fewer than 180 flaws six of which were zero-days which was considered a large update at the time. Fixes typically numbered in the double digits until the middle of this year, when the totals jumped to 206 (June), 570 (July), 400 (August), and 966 (last month). That steep increase is largely attributable to AI models , which are making it easier for bad actors to develop hacking tools to exploit vulnerabilities, and for companies to find and patch these flaws more quickly. This means that update cycles are being shortened and/or include a significantly higher number of fixes. Companies like Microsoft are using AI to discover and address bugs, though AI isn't as good at the latter, and may, in some cases, introduce additional vulnerabilities in the process . October's Patch Tuesday fixes 1,411 flaws, including three zero-days As BleepingComputer reports , the October 2026 security update addresses flaws across the following categories: 677 elevation-of-privilege vulnerabilities, 40 security feature bypass vulnerabilities, 317 remote-code-execution vulnerabilities, 254 information disclosure vulnerabilities, 28 spoofing vulnerabilities, and 73 denial-of-service vulnerabilities. 70 of the bugs are rated \"critical\" and include remote code execution, elevation of privilege, and spoofing flaws. Microsoft patched an additional 348 bugs earlier this month for various Azure, Mariner, and Microsoft products. One of the zero-days patched this month has been actively exploited in the wild. CVE-2026-96951 is a security feature bypass vulnerability in Windows Shell that allows attackers unauthorized access over a network. Microsoft has not provided details on who disclosed this flaw or how it was exploited. The other two zero-days were publicly disclosed. CVE-2026-108398 is a security feature bypass vulnerability in the .NET framework that would allow attackers to bypass Windows Defender Application Control restrictions and run unauthorized applications without user interaction. This flaw has been attributed to James Forshaw of Google Project Zero. F", "date_str": "2026-10-14T16:30:00+00:00", "hash": "bc75318a845be8ec", "title_fa": "رایانه شما بیش از 1400 نقص امنیتی (معروف) دارد—در اینجا نحوه رفع آنها آورده شده است", "summary_fa": "تعداد باگ‌های ماهانه Patch Tuesday مایکروسافت از ابتدای تابستان روند افزایشی داشته است و اکتبر نیز تفاوتی ندارد. این شرکت به تازگی اصلاحاتی را برای رکورد 1411 آسیب پذیری، از جمله سه روز صفر، که نقص هایی هستند که به طور فعال مورد سوء استفاده قرار گرفته اند یا قبل از در دسترس قرار گرفتن وصله رسمی به صورت عمومی افشا شده اند، صادر کرده است و آنها را به ویژه خطرناک می کند. برای مقایسه، در اکتبر 2025، مایکروسافت وصله‌هایی برای کمتر از 180 نقص منتشر کرد که شش مورد از آنها صفر روز بود که در آن زمان به‌روزرسانی بزرگی در نظر گرفته می‌شد. اصلاحات معمولاً تا اواسط سال جاری دو رقمی بودند، زمانی که تعداد کل به 206 (ژوئن)، 570 (ژوئیه)، 400 (اوت) و 966 (ماه گذشته) رسید. این افزایش شدید تا حد زیادی به مدل‌های هوش مصنوعی نسبت داده می‌شود، که توسعه ابزارهای هک برای سوء استفاده از آسیب‌پذیری‌ها را برای بازیگران بد آسان‌تر می‌کند و شرکت‌ها می‌توانند این نقص‌ها را سریع‌تر پیدا کرده و اصلاح کنند. این بدان معناست که چرخه‌های به‌روزرسانی کوتاه می‌شوند و/یا تعداد قابل توجهی اصلاحات را شامل می‌شوند. شرکت‌هایی مانند مایکروسافت از هوش مصنوعی برای کشف و رسیدگی به باگ‌ها استفاده می‌کنند، اگرچه هوش مصنوعی در مورد دوم خوب نیست و ممکن است در برخی موارد آسیب‌پذیری‌های بیشتری را در این فرآیند معرفی کند. وصله سه‌شنبه اکتبر ۱۴۱۱ نقص را برطرف می‌کند، از جمله سه روز صفر همانطور که BleepingComputer گزارش می‌دهد، به‌روزرسانی امنیتی اکتبر ۲۰۲۶ نقص‌های دسته‌های زیر را برطرف می‌کند: ۶۷۷ آسیب‌پذیری elevation-of-privilege، ۴۰ آسیب‌پذیری دور زدن ویژگی‌های امنیتی، ۳۱۷ اطلاعات از راه دور execuure-code-4. آسیب‌پذیری، ۲۸ آسیب‌پذیری جعل و ۷۳ آسیب‌پذیری انکار سرویس."}, {"source": "Lifehacker", "title": "Samsung's Dolby Atmos Soundbar (With a Wireless Subwoofer) Is $110 Off Right Now", "link": "https://lifehacker.com/tech/samsungs-dolby-atmos-soundbar-with-wireless-subwoofer-deal-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Samsung s HW-Q600F soundbar is down to $389.99 at Amazon from $499.99, a $110 discount that brings it to its lowest price ever, according to price trackers . This 2025 model sits in the middle of Samsung s Q-Series lineup and pairs a sleek, angular bar with a subwoofer in a 3.1.2 setup, where the bar s nine drivers cover the left, center, and right channels as well as two up-firing height channels. Those up-firing drivers let it handle Dolby Atmos and other object-based audio correctly, an advantage over Samsung s 5.1-channel HW-B750F , though it gives up the extra audio channels, app support, and broader connectivity of the pricier HW-Q800F . Samsung Q-Series Soundbar HW-Q600F $389.99 at Amazon $499.99 Save $110.00 Get Deal Get Deal $389.99 at Amazon $499.99 Save $110.00 Samsung B-Series Soundbar HW-B750F $297.99 at Amazon $499.99 Save $202.00 Get Deal Get Deal $297.99 at Amazon $499.99 Save $202.00 Samsung Q-Series Soundbar HW-Q800F $1,097.99 at Amazon Shop Now Shop Now $1,097.99 at Amazon SEE 0 MORE For everyday listening, the HW-Q600F performs particularly well, with balanced tuning across the stereo and center channels that keeps dialogue clear without requiring much adjustment. It also preserves the dynamics of a soundtrack, so an explosion still lands with more force than the conversation before it. Dolby Atmos also brings a modest sense of height, and effects track cleanly from left to right. Surround sound, on the other hand, is less convincing, since the soundbar doesn t include rear satellite speakers and downmixes surround formats, which limits its ability to convincingly place effects behind you. You do get a graphic equalizer and sound presets for adjusting the audio to your preferences, though without a companion app, you ll be making those changes through the included remote. On the connectivity side, the bar includes an HDMI input, so you can plug a game console into it and pass video through to your TV , while an optical port covers older devices. That said, HDMI audio latency runs slightly high, potentially requiring an adjustment in your TV's settings to keep dialogue synchronized with what's happening on screen. As for wireless connectivity, it is limited to Bluetooth, meaning no wifi streaming or multi-room audio. Also, Samsung's SpaceFit Sound Pro room correction and Q-Symphony integration, which lets the TV s ", "date_str": "2026-10-14T16:00:34+00:00", "hash": "3b5bbfe549d9ea58", "title_fa": "ساندبار Dolby Atmos سامسونگ (با ساب ووفر بی سیم) در حال حاضر 110 دلار تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. بر اساس ردیاب‌های قیمت، نوار صوتی HW-Q600F سامسونگ از 499.99 دلار به 389.99 دلار در آمازون کاهش یافته است، یک تخفیف 110 دلاری که آن را به پایین‌ترین قیمت خود می‌رساند. این مدل 2025 در وسط سری Q سامسونگ قرار دارد و یک نوار شیک و زاویه‌دار را با یک ساب ووفر در تنظیمات 3.1.2 جفت می‌کند، که در آن نوار نه درایور کانال‌های چپ، مرکزی و راست و همچنین دو کانال ارتفاع شلیک بالا را پوشش می‌دهد. این درایورهای فعال به آن اجازه می‌دهند Dolby Atmos و دیگر صداهای مبتنی بر شی را به درستی مدیریت کند، که این مزیتی نسبت به HW-B750F 5.1 کاناله سامسونگ است، اگرچه کانال‌های صوتی اضافی، پشتیبانی از برنامه و اتصال گسترده‌تر HW-Q800F گران‌تر را از بین می‌برد. Soundbar سری Q سامسونگ HW-Q600F 389.99 دلار در آمازون 499.99 دلار صرفه جویی 110.00 دلار دریافت معامله دریافت معامله 389.99 دلار در آمازون 499.99 دلار صرفه جویی 110.00 دلار سامسونگ Soundbar سری B HW-B750F در 297.9 دلار آمازون دریافت کنید. معامله دریافت معامله 297.99 دلار در آمازون 499.99 دلار صرفه جویی 202 دلاری سامسونگ سری Q Soundbar HW-Q800F 1097.99 دلار در آمازون همین حالا خرید کنید 1097.99 دلار در آمازون ببینید بدون نیاز به تنظیم زیاد، گفتگو را شفاف نگه می دارد. همچنین پویایی یک موسیقی متن را حفظ می کند، بنابراین یک انفجار همچنان با قدرت بیشتری نسبت به مکالمه قبل از آن فرود می آید. Dolby Atmos همچنین حس متوسطی از ارتفاع را به ارمغان می‌آورد و افکت‌ها از چپ به راست به‌خوبی دنبال می‌شوند. از سوی دیگر، صدای فراگیر کمتر قانع‌کننده است، زیرا نوار صوتی شامل بلندگوهای ماهواره‌ای پشتی نیست و فرمت‌های فراگیر را کاهش می‌دهد، که توانایی"}, {"source": "Lifehacker", "title": "I Tried Google's New Gemini 4 Argon Model, and Here's How It Measures up to GPT-6", "link": "https://lifehacker.com/tech/heres-how-gemini-4-argon-compares-to-gpt-6?utm_medium=RSS", "summary": "Gemini 3.1 Pro launched back in February of this year quite a while ago, in AI terms. Now Google has jumped to the next full number with Gemini 4 Argon, which it says \"excels at deep work in complex, real-world tasks.\" You can get the new AI model now inside the Gemini app if you're on the AI Pro ($19.99 a month) or AI Ultra ($99.99 or $199.99 a month) plans. Users on the free and AI Plus ($4.99 a month) plans miss out for now, though you can expect a smaller, cut-down version of Gemini 4 Argon to roll out to these tiers eventually. What can Gemini 4 Argon do? Google has a long list of areas where the new AI model excels. There's mention of complex engineering tasks (like checking millions of lines of code for efficiency improvements), predicting molecular structures in chemistry, and delivering 3D visualizations. It also enhances knowledge work across legal, finance, science, and coding. Google says Gemini 4 Argon is now better at advanced physics modeling, picking through genetic databases, protecting software from vulnerabilities, and resolving problems in physical space (handy for robotics development). The new model \"answers questions more directly with less hedging, doesn't repeat itself more than necessary, and skips clich s throughout the responses,\" according to Google. Gemini has some suggestions for how to use the new model. Credit: Lifehacker With many in the industry worried about an AI-driven apocalypse of some form or another , Google has upped its defenses against misuse and jailbreaking. The company has significantly upgraded its blockers for harmful requests, limits on AI agent overreach, and resistance to malicious prompt injections. All of these stats are things you would expect to read about in a new AI model announcement, whether it's from Google, Anthropic, or OpenAI: \"Our new model is better and safer than ever, and particularly good in these specific benchmarks we've chosen.\" But is it any more helpful for the average user tapping away in the Gemini app? I don't have any pressing scientific breakthroughs to research or large-scale software optimizations to run, but I have put Gemini 4 Argon to the test against GPT-6 Sol, which is the latest model available to consumers through the ChatGPT app though you need to be on at least the Plus plan ($19.99 a month) to get to it. Testing Gemini 4 Argon against GPT-6 Sol Make no mistake: Both of these new AI models are quite capable. I first prompted Gemini 4 Argon and GPT-6 Sol with the foll", "date_str": "2026-10-14T15:00:00+00:00", "hash": "31a71c5433172f46", "title_fa": "من مدل جدید جمینی 4 آرگون گوگل را امتحان کردم و در اینجا نحوه اندازه گیری آن تا GPT-6 آمده است.", "summary_fa": "Gemini 3.1 Pro در فوریه سال جاری، مدتی پیش، از نظر هوش مصنوعی، عرضه شد. اکنون گوگل با Gemini 4 Argon به عدد کامل بعدی رسیده است که می گوید \"در کارهای عمیق در کارهای پیچیده و دنیای واقعی برتری دارد.\" اگر از برنامه‌های AI Pro (19.99 دلار در ماه) یا AI Ultra (99.99 دلار یا 199.99 دلار در ماه) استفاده می‌کنید، اکنون می‌توانید مدل جدید هوش مصنوعی را در برنامه Gemini دریافت کنید. کاربران برنامه های رایگان و AI Plus (4.99 دلار در ماه) فعلاً از دست می دهند، اگرچه می توانید انتظار داشته باشید که نسخه کوچکتر و کوچکتر Gemini 4 Argon در نهایت به این سطوح عرضه شود. Gemini 4 Argon چه کاری می تواند انجام دهد؟ گوگل فهرست بلندبالایی از حوزه هایی دارد که مدل جدید هوش مصنوعی در آنها برتری دارد. به وظایف مهندسی پیچیده (مانند بررسی میلیون‌ها خط کد برای بهبود کارایی)، پیش‌بینی ساختارهای مولکولی در شیمی، و ارائه تجسم‌های سه بعدی اشاره شده است. همچنین کار دانش را در زمینه های حقوقی، مالی، علمی و کدنویسی افزایش می دهد. گوگل می گوید Gemini 4 Argon اکنون در مدل سازی فیزیک پیشرفته، انتخاب از طریق پایگاه داده های ژنتیکی، محافظت از نرم افزار در برابر آسیب پذیری ها و حل مشکلات در فضای فیزیکی (برای توسعه روباتیک مفید است) بهتر است. به گفته گوگل، مدل جدید \"مستقیم‌تر به سؤالات با پوشش‌دهی کمتر پاسخ می‌دهد، بیش از حد لازم تکرار نمی‌شود، و از کلیشه‌ها در تمام پاسخ‌ها صرفنظر می‌کند.\" Gemini برای نحوه استفاده از مدل جدید پیشنهاداتی دارد. اعتبار: لایف هکر با توجه به اینکه بسیاری در صنعت نگران یک آخرالزمان مبتنی بر هوش مصنوعی هستند، گوگل دفاع خود را در برابر سوء استفاده و جیلبریک افزایش داده است. این شرکت به طور قابل توجهی مسدود کننده های خود را برای درخواست های مضر، محدودیت"}],
      media: [{"source": "Billboard", "title": "Malcolm Todd’s ‘Earrings’ Leads Top Gabb Music Songs for Second Month", "link": "https://www.billboard.com/music/chart-beat/malcolm-todd-earrings-number-1-top-gabb-music-songs-sept-2026-1236361205/", "summary": "Malcolm Todd ’s “Earrings” is No. 1 on the Top Gabb Music Songs chart for the second month in a row, crowning the September 2026 survey after first reigning over the August list. Billboard has partnered with Gabb Wireless, a phone company for kids and teens, to present a monthly chart, which launched in October 2024, tracking on-demand streams via its Gabb Music platform. Gabb Music offers a vast catalog of songs, all of which are selected by the Gabb team to include only kid- and teen-appropriate content. Gabb Music streams are not currently factored into any other Billboard charts. “Earrings” reached a new peak of No. 19 on the weekly Billboard Hot 100 in September and did not depart the top 20 for the entire month. The track, which was originally released in 2024, has spent three months on Top Gabb Music Songs; it debuted at No. 9 on the July 2026 tally. “Earrings” leads the chart over Stella Lefty ’s “Boston,” which rises five positions to a new peak of No. 2. Like “Earrings,” “Boston” also debuted on the July 2026 survey, bowing at No. 21. “Boston” spent the entirety of September at its peak so far of No. 2 on the Hot 100, while her album Long Way Home started at No. 11 on the Billboard 200 dated Sept. 5. In all, the top 10 of Top Gabb Music Songs features seven songs performed by women for September, the most in any month since the ranking’s October 2024 inception. Two of those are by the same act: Olivia Rodrigo , whose “The Cure” and “Deja Vu” appear at Nos. 8 and 9, respectively. Two of those songs are also newcomers to the region. Alyssa Grace’s “Bloodstream” zooms 16 positions to No. 4, while KATSEYE is the month’s top debut with “Hootie Frutti” at No. 6. The former returned to its peak of No. 45 on the Hot 100 in September, and the latter bowed at No. 31 on the tally at the end of August. And following her Aug. 25 death, Dolly Parton ’s “9 to 5” becomes the country singer’s first Top Gabb Music Songs appearance, debuting at No. 20. See the 25-position chart below. Top Gabb Music Songs Earrings, Malcolm Todd (=) Boston, Stella Lefty (+5) Choosin Texas, Ella Langley (-1) Bloodstream, Alyssa Grace (+16) Lush Life, Zara Larsson (-2) Hootie Frutti, KATSEYE (debut) Ordinary, Alex Warren (-2) The Cure, Olivia Rodrigo (-4) Deja Vu, Olivia Rodrigo (=) Demons, Josiah Queen (-4) God s Plan, Drake (+4) Beautiful Things, Benson Boone (-1) Billie Jean, Michael Jackson (-5) Bad Taste, Freya Skye (debut) Hate That I Made You Love Me, Ariana Grande (-3) Drivers", "date_str": "2026-10-15T14:19:40+00:00", "hash": "58647dd05215093a", "title_fa": "آهنگ «گوشواره» مالکوم تاد برای ماه دوم در صدر آهنگ‌های برتر موسیقی گاب قرار گرفت.", "summary_fa": "آهنگ «گوشواره» مالکوم تاد برای دومین ماه متوالی در رتبه اول جدول آهنگ‌های موسیقی برتر گاب قرار دارد و پس از اولین بار در فهرست اوت، در نظرسنجی سپتامبر 2026 تاجگذاری کرد. بیلبورد با Gabb Wireless، یک شرکت تلفنی برای کودکان و نوجوانان، برای ارائه نمودار ماهانه، که در اکتبر 2024 راه اندازی شد، همکاری کرده است و جریان های درخواستی را از طریق پلت فرم Gabb Music خود ردیابی می کند. Gabb Music کاتالوگ وسیعی از آهنگ ها را ارائه می دهد که همه آنها توسط تیم Gabb انتخاب شده اند تا فقط محتوای مناسب برای کودکان و نوجوانان را شامل شوند. جریان‌های موسیقی Gabb در حال حاضر در نمودارهای بیلبورد دیگر لحاظ نمی‌شوند. \"گوشواره\" در سپتامبر به اوج جدید شماره 19 در 100 بیلبورد داغ هفتگی رسید و در کل ماه از بین 20 تای برتر جدا نشد. این آهنگ که در ابتدا در سال 2024 منتشر شد، سه ماه را در آهنگ های موسیقی Top Gabb سپری کرده است. در جولای 2026 در رتبه 9 قرار گرفت. \"Earrings\" در جدول بالاتر از \"Boston\" از Stella Lefty قرار دارد، که با پنج رتبه به اوج جدید رتبه 2 صعود کرد. مانند \"Earrings\"، \"Boston\" نیز در نظرسنجی ژوئیه 2026 اولین نمایش خود را داشت و در رتبه 21 قرار گرفت. آلبوم \"Boston\" کل آلبوم خود را در سپتامبر 10 در اوج خود سپری کرد، در حالی که آلبوم Ho10 در اوج خود تا کنون بود. Way Home از شماره 11 بیلبورد 200 مورخ 5 سپتامبر شروع شد. در مجموع، 10 آهنگ برتر موسیقی Top Gabb دارای هفت آهنگ است که توسط زنان برای ماه سپتامبر اجرا شده است، که بیشترین تعداد در هر ماه از زمان آغاز این رتبه بندی در اکتبر 2024 است. دو نفر از آن‌ها با همین عمل هستند: اولیویا رودریگو، که «درمان» و «دژاوو» او"}, {"source": "Billboard", "title": "Billboard Latin Music Awards Announce New Fan Favorite Artist Category: Here’s Who Is Competing & How to Vote", "link": "https://www.billboard.com/music/latin/billboard-latin-music-awards-favorite-artist-vote-1236360901/", "summary": "Just one week away from the 2026 Billboard Latin Music Awards, a new category is giving fans a historic opportunity to choose one of the night’s winners: Fan Favorite Artist. Announced on Thursday (Oct. 15), the award will be contested by this year’s top five finalists: Fuerza Regida , Karol G , Peso Pluma , Prince Royce and Tito Double P . The winner will be revealed live during the Thursday, Oct. 22 ceremony, which will air on Telemundo and Peacock starting at 8 p.m. ET from the James L. Knight Center in Miami. Related Premios Billboard de la Música Latina 2026: Cómo ver la ceremonia, quiénes actuarán y más Peso Pluma Leads 2026 Billboard Latin Music Awards Finalists: Complete List Holy S : Powderfinger Overwhelmed By Demand, Expands 2027 Reunion Tour Peso Pluma leads this year’s list of finalists to the Billboard Latin Music Awards, including Artist of the Year and Global 200 Latin Song of the Year. Fuerza Regida is a finalist in 12 categories, including Artist of the Year and Global 200 Latin Artist of the Year; Karol G follows with nine, among them Artist of the Year and Tour of the Year; while Prince Royce rounds out the top five with eight, including Tropical Artist of the Year, Solo and Tropical Song of the Year. Voting is now open at Telemundo.com/vota . Eligible fans can cast up to 10 votes per day using a Google account and an additional 10 votes per day with an NBCUniversal profile, for a total of up to 20 votes per day across both options. Voting is free and open to individuals aged 13 and older residing in the United States, the District of Columbia and Puerto Rico, in accordance with the official rules. Voting will close on Thursday, Oct. 22, at approximately 7 p.m. ET, subject to the official rules. The artist who receives the highest number of valid votes will become the first-ever winner of the Fan Favorite Artist award. The 2026 Billboard Latin Music Awards will bring together the biggest names in Latin music for a night of unforgettable performances, collaborations and special honors. Among the special honorees, Cristian Castro will receive the Billboard Lifetime Achievement Award, Rubén Blades will receive the Billboard Icon Award, Rosalía the Billboard Hall of Fame Award and Fuerza Regida the Billboard Vanguard Award. Confirmed performers and presenters for the ceremony also include Carlos Rivera, Chuyin, Elvis Crespo, Erick Brian, Ha*Ash, Jessi Uribe, Kapo, La Nueva Ola de la Cumbia, Manuel Turizo, Melymel, Nanpa Básico, Nella, Ozuna", "date_str": "2026-10-15T13:45:00+00:00", "hash": "6ec19016d3e4ca31", "title_fa": "جوایز موسیقی لاتین بیلبورد دسته بندی هنرمند مورد علاقه جدید طرفداران را اعلام کرد: در اینجا چه کسی رقابت می کند و چگونه رای می دهد", "summary_fa": "تنها یک هفته تا جوایز موسیقی لاتین بیلبورد 2026 فاصله دارد، دسته بندی جدیدی به طرفداران فرصتی تاریخی می دهد تا یکی از برندگان شب را انتخاب کنند: هنرمند مورد علاقه طرفداران. این جایزه در روز پنجشنبه (15 اکتبر) اعلام شد، توسط پنج فینالیست برتر امسال رقابت خواهند کرد: Fuerza Regida، Karol G، Peso Pluma، Prince Royce و Tito Double P. برنده به طور زنده در مراسم پنجشنبه، 22 اکتبر، که از ساعت 8 بعد از ظهر از تلویزیون Telemundo و Peacock پخش می شود، مشخص خواهد شد. ET از جیمز ال. مرکز شوالیه در میامی. جایزه‌های مرتبط Billboard de la Música Latina 2026: Cómo ver la ceremonia, quiénes actuarán y más Peso Pluma فینالیست‌های جوایز موسیقی لاتین بیلبورد 2026 پیشتاز شد: فهرست کامل Holy S: Powderfinger تحت تأثیر تقاضا، گسترش فهرست نهایی سال 2027 از Peso Pluma جوایز موسیقی لاتین بیلبورد، از جمله هنرمند سال و جهانی 200 آهنگ لاتین سال. Fuerza Regida فینالیست در 12 بخش، از جمله هنرمند سال و جهانی 200 هنرمند لاتین سال است. کارول جی با 9 نفر، از جمله هنرمند سال و تور سال، دنبال می‌شود. در حالی که شاهزاده رویس با هشت نفر، از جمله هنرمند گرمسیری سال، انفرادی و ترانه گرمسیری سال، پنج نفر برتر را تکمیل می کند. رای گیری اکنون در Telemundo.com/vota باز است. طرفداران واجد شرایط می‌توانند با استفاده از حساب Google روزانه حداکثر 10 رای و با نمایه NBCUniversal روزانه 10 رای دیگر، برای مجموع حداکثر 20 رای در روز در هر دو گزینه، شرکت کنند. رای دادن برای افراد 13 ساله و بالاتر که در ایالات متحده، ناحیه کلمبیا و پورتوریکو زندگی می کنند، بر اساس قوانین رسمی آزاد و رایگان است. رای گیری در روز پنجشنبه، 22 اکتبر، تقریباً ساعت 7 بعد از ظهر پایان می یابد. ET، با توجه به قوانین رسمی. هنرمندی که"}, {"source": "Billboard", "title": "Celine Dion Honored With Iconic Doll Paying Tribute to Her Legendary 1998 ‘My Heart Will Go On’ Oscars Performance", "link": "https://www.billboard.com/music/pop/celine-dion-signature-barbie-titanic-look-oscars-1236361162/", "summary": "Celine Dion is getting her own Barbie doll for Christmas. Mattel announced that the Canadian powerhouse vocalist is next in line for a Barbie Signature doll, and it pays tribute to one of the most iconic looks in the always fashionable singer s fashion repertoire. Related Randy Rainbow Quotes Jay-Z s 99 Problems in RFK Jr.-Roasting New Song Parody: The Worms in His Brain Clearly Drove Him Insane Celine Dion Falls Mid-Performance During Paris Concert Then Carries On Like the Pro She Is Geordie Greep Responds to Sexual Misconduct Allegation, Cancels Tour Dates (UPDATE) The elegant doll — available for preorder now for $60 at Mattel Creations — commemorates Dion s unforgettable performance of her Titanic theme song My Heart Will Go On from the 1998 Academy Awards show. The doll features a recreation of the turtleneck navy blue long-sleeve maxi dress Dion wore at the Oscars, including a miniature glittering necklace inspired by the blue heart-shaped Heart of the Ocean diamond necklace from the Oscar-winning drama. In a statement, Dion said, “It is a true honor to join the Barbie legacy with a doll inspired by one of the most meaningful moments of my career. I hope this doll inspires everyone to express themselves with confidence, follow their dreams and believe in the power of their own voice.” The doll is slated to ship on or before Dec. 31. Dion joins a long list of Barbie Signature dolls honoring iconic musicians, a roster that includes: Miley Cyrus, Whitney Houston, Diana Ross, Aaliyah, Stevie Nicks, Kylie Minogue, Lenny Kravitz, Tina Turner, Juan Gabriel, Elton John, Elvis and more. The singer is in the midst of a 26-date residency run in Paris, which kicked off on Sept. 12 and marked Dion s return to the regular performance after a six-year hiatus due to her battle with the rare neurological disorder Stiff-Person Syndrome. The current string of shows will wrap up on Saturday (Oct. 17) before picking up with 10 more gigs in May 2027.", "date_str": "2026-10-15T13:14:16+00:00", "hash": "d1cd6bb1ea7c06b1", "title_fa": "سلین دیون با عروسک نمادین ادای احترام به اجرای افسانه‌ای او در اسکار «قلب من ادامه خواهد داد» در سال 1998 تجلیل شد.", "summary_fa": "سلین دیون عروسک باربی خودش را برای کریسمس می گیرد. متل اعلام کرد که این خواننده قدرتمند کانادایی در ردیف بعدی برای عروسک باربی سیگنچر قرار دارد و به یکی از نمادین ترین ظاهرها در رپرتوار مد این خواننده همیشه شیک ادای احترام می کند. نقل قول های مرتبط رندی رینبو 99 مشکل جی زی در RFK جونیور - تقلید آهنگ جدید در حال برشته کردن: کرم ها در مغز او به وضوح او را دیوانه کردند. (به روز رسانی) این عروسک زیبا - که اکنون با قیمت 60 دلار در Mattel Creations برای پیش‌سفارش موجود است - اجرای فراموش‌نشدنی دیون از آهنگ موضوع تایتانیک My Heart Will Go On از نمایش جوایز اسکار در سال 1998 را به یاد می‌آورد. این عروسک بازآفرینی از لباس ماکسی آستین بلند آبی سرمه ای یقه ای است که دیون در اسکار پوشیده بود، از جمله یک گردنبند مینیاتوری پر زرق و برق که الهام گرفته از گردنبند الماس آبی قلب اقیانوس از درام برنده اسکار است. دیون در بیانیه‌ای گفت: «پیوستن به میراث باربی با عروسکی که از یکی از مهم‌ترین لحظات زندگی‌ام الهام گرفته شده است، افتخار واقعی است. امیدوارم این عروسک الهام بخش همه باشد تا با اعتماد به نفس خود را بیان کنند، رویاهای خود را دنبال کنند و به قدرت صدای خود ایمان داشته باشند.\" قرار است این عروسک در تاریخ 31 دسامبر یا قبل از آن ارسال شود. دیون به لیست بلندبالایی از عروسک‌های باربی سیگنیچر برای تجلیل از نوازندگان نمادین ملحق می‌شود، فهرستی که شامل: مایلی سایرس، ویتنی هیوستون، دایانا راس، عالیه، استیوی نیکس، کایلی مینوگ، لنی تورنر، ال گاویس، ال گالینا، ال گالینا، و بیشتر است. این خواننده در بحبوحه یک دوره اقامت 26 روزه در پاریس است که در 12 سپتامبر آغاز شد و نشان داد دیون پس از وقفه ای شش ساله به"}, {"source": "Billboard", "title": "Kid Rock Shares Why Eminem Switched Songs on His Faith-Based Album – And Whether They Talk Politics Together", "link": "https://www.billboard.com/music/music-news/kid-rock-halfway-2-jesus-interview-1236360949/", "summary": "The surprising new collaboration between Kid Rock and Eminem on the former s equally surprising new faith-based album Halfway 2 Jesus has taken some, well, surprising turns during the days before its Oct. 17 release. When the album was announced earlier this month, accompanied by the single James 1:17 (Jesus Is King), Eminem was listed on the track 7 Sins. Now he s part of Heal My Faith, while Lil Wayne became a replacement for 7 Sins following some last-minute maneuvering. It s a lot of stress and a lot of anxiety, but it s so good, Rock (real name Bob Ritchie) told Billboard during a visit this week with other reporters to his Dixie Ridge farm spread in Nashville, in the hills overlooking downtown (and next door to a new golf course built by Justin Timberlake). It s giving me the exact record I wanted, he says of the last-minute change. I am so frickin’ stoked, and I feel like the biggest weight I have ever felt (doing an album) has been lifted. I have never experienced good anxiety and stress before. The switch-up came with a bit of comic, manic machinations that Rock said reminded him of making Devil Without a Cause , his 1998 breakthrough. There was a lot of last minute (stuff) on that record, too, Rock recalled. I didn t scream My name is Kid! until we were mixing the song ( Bawitaba ), til we were in the mix room. What went down is that, despite their widely differing and publicly expressed political postures, Rock first approached Eminem about a year ago with Heal My Faith, previously titled Lord Above and Show Me Love. It continues a recording relationship that includes Eminem appearing on F-ck Off from Devil Without a Cause ; Rock popping into the 2013 video for Eminem s Berzerk ; and both appearing on Trick Trick s From the D remix. We ve been friends for, like, 40 years, said Rock, an avowed friend and outspoken supporter of U.S. President Donald Trump and many in his administration. I really didn t want to drag him into my political world . We talk about (politics) a little bit, not a ton. There s a lot of stuff we agree on, and we can have a laugh about what (we don t). That s why I asked him to write a verse for me. Subsequently, however, Eminem heard 7 Sins and decided he would rather rap on that. We agreed we didn t need two songs together people are going to think we re dating, Rock said with a laugh. So Eminem cut a verse for that and the song was placed in the finished queue only to have him reach out to Rock earlier this month, after t", "date_str": "2026-10-15T13:00:00+00:00", "hash": "7ad839dc0a8ad7ee", "title_fa": "کید راک به اشتراک می‌گذارد که چرا امینم آهنگ‌ها را در آلبوم مبتنی بر ایمان خود تغییر داد - و اینکه آیا آنها با هم درباره سیاست صحبت می‌کنند", "summary_fa": "همکاری جدید و غافلگیرکننده‌ای بین کید راک و امینم در آلبوم جدید و به همان اندازه غافلگیرکننده‌ی او که مبتنی بر ایمان بود، Halfway 2 Jesus در روزهای قبل از انتشار آن در 17 اکتبر تغییراتی شگفت‌انگیز داشته است. هنگامی که آلبوم در اوایل این ماه معرفی شد، همراه با تک آهنگ جیمز 1:17 (عیسی پادشاه است)، امینم در آهنگ 7 Sins قرار گرفت. اکنون او بخشی از Heal My Faith است، در حالی که لیل وین پس از چند مانور در آخرین لحظه، جایگزین 7 Sins شد. راک (نام واقعی باب ریچی) در جریان بازدید این هفته با خبرنگاران دیگر از مزرعه Dixie Ridge خود در نشویل، در تپه های مشرف به مرکز شهر (و در مجاورت یک زمین گلف جدید که توسط جاستین تیمبرلیک ساخته شده است) به بیلبورد گفت: استرس و اضطراب زیادی دارد، اما خیلی خوب است. او در مورد تغییر لحظه آخری می گوید، این دقیقا رکوردی را که می خواستم به من می دهد. من خیلی عصبانی هستم و احساس می‌کنم بزرگترین وزنه‌ای که تا به حال احساس کرده‌ام (انجام یک آلبوم) برداشته شده است. قبلاً هرگز اضطراب و استرس خوبی را تجربه نکرده بودم. این تغییر با کمی دسیسه های کمیک و شیدایی همراه بود که به گفته راک، او را به یاد ساخت Devil Without a Cause، موفقیت او در سال 1998، انداخت. راک به یاد می آورد که در آن رکورد نیز لحظات آخر (موارد) زیادی وجود داشت. من فریاد نزدم اسم من بچه است! تا اینکه داشتیم آهنگ (باویتابا) رو میکس میکردیم تا اینکه تو اتاق میکس بودیم. چیزی که پایین آمد این بود که علیرغم موضع گیری های سیاسی بسیار متفاوت و علنی آنها، راک برای اولین بار حدود یک سال پیش با Heal My Faith، که قبلاً عنوان Lord Above and Show Me Love را داشت، به امینم"}, {"source": "Billboard", "title": "BLACKPINK’s JENNIE ‘Steps’ Out For New Netflix Release", "link": "https://www.billboard.com/culture/tv-film/blackpink-jennie-steps-netflix-someone-to-hold-1236361091/", "summary": "JENNIE is getting her steps in. The BLACKPINK star shares a snippet of her new song “Someone to Hold,” the first track showcased from the forthcoming Netflix animated film, Steps . The K-pop idol s fresh cut soundtracks the comedy adventure s main trailer, which drops today (Oct. 15). “I am so excited to join the Steps family and it was really fun making my first song for an animated film,” JENNIE comments in a statement issued this morning. “I love how much heart and personality the characters have, and I’m so happy I got to be a little part of their world.” “Someone to Hold” is written and produced by Justin Tranter, who also wrote and produced three more original songs for the film’s official soundtrack, one each for Steps co-star Amanda Seyfried , U.K. pop artist Rose Gray, and Atlantic Records-signed Chinese-American alt-pop singer-songwriter Emei , with a score by Academy Award-winner Kris Bowers ( Bridgerton ). Its voice cast also features Ali Wong, Stephanie Hsu, Nikki Glaser, Daniel Radcliffe, Young Mazino, Peter Dinklage and Bette Midler. “I hope you enjoy Steps and ‘Someone to Hold’ as much as I do, and I can’t wait for you guys to hear it, enthuses JENNIE, who is coming off her biggest hit as a solo artist with her guest work on Tame Impala s Dracula remix, which went to No. 5 on the Billboard Hot 100 and No. 2 on the Official U.K. Singles Chart. Directed by Alyce Tzue and John Ripa, Steps takes the tale of Cinderella in a different direction. According to a statement, Cinderella s “evil” stepsisters Lilith (Ali Wong) steals the magic wand belonging to the Fairy Godmother (Bette Midler) and hijacks the Royal Ball with Margot (Stephanie Hsu). Enter Priscilla (Nikki Glaser), a “villainous schemer who swoops in and snatches the throne.” With Priscilla in charge, consider the party over. And the happily-ever-after ending ruined. Realizing her terrible move, Lilith must join forces with Cinderella (Amanda Seyfried) in an epic quest, with battles royale and friendships forged along the way. “The story in Steps lends itself beautifully to a variety of voices and sonics, and the main throughline in the soundtrack is dance music, explains Tranter. Someone to Hold is pure danceable joy inspired by vintage organic dance pop, he continues, while EMEI’s The Understudy is an underdog anthem hidden in a French electro house Trojan horse. Gray’s Meet Me on the Dance Floor is a modern electro dance pop, and the only villain song in animated film history that yo", "date_str": "2026-10-15T13:00:00+00:00", "hash": "1752debf6c87c72d", "title_fa": "جنی «Steps» از BLACKPINK برای انتشار جدید نتفلیکس", "summary_fa": "جنی در حال انجام مراحل خود است. ستاره BLACKPINK قطعه‌ای از آهنگ جدید خود \"Someone to Hold\" را به اشتراک می‌گذارد، اولین آهنگی که از انیمیشن آینده نتفلیکس، Steps به نمایش گذاشته شده است. تریلر اصلی فیلم ماجراجویی کمدی که امروز (15 اکتبر) پخش می‌شود، موسیقی متن فیلم The K-pop idol را پخش می‌کند. جنی در بیانیه‌ای که امروز صبح منتشر شد، می‌گوید: «من بسیار هیجان‌زده هستم که به خانواده Steps ملحق شدم و ساختن اولین آهنگم برای یک فیلم انیمیشن واقعاً سرگرم‌کننده بود. من عاشق قلب و شخصیت شخصیت‌ها هستم و بسیار خوشحالم که بخشی از دنیای آنها هستم.» \"Someone to Hold\" توسط جاستین ترانتر نوشته و تهیه شده است، او همچنین سه آهنگ اصلی دیگر را برای موسیقی متن رسمی فیلم نوشته و تولید کرده است، هر کدام یک آهنگ برای آماندا سیفرید، همبازی استپ، رز گری هنرمند پاپ بریتانیا، و آلت پاپ چینی-آمریکایی امضا شده توسط آتلانتیک رکوردز (آکادمی آکادمی، خواننده، ترانه‌سرا، آکادمی، آکادمی، آکادمی، آکادمی، آکادمی، آکادمی، آکادمی، آکادمی. بریجرتون). صداپیشگان آن نیز شامل علی ونگ، استفانی هسو، نیکی گلسر، دنیل رادکلیف، یانگ مازینو، پیتر دینکلیج و بت میدلر هستند. \"امیدوارم شما هم مثل من از Steps و \"Someone to Hold\" لذت ببرید، و من بی صبرانه منتظر شنیدن آن هستم، JENNIE که بزرگترین موفقیت خود را به عنوان یک هنرمند انفرادی با کار مهمان خود در ریمیکس Tame Impalas Dracula، که به شماره 5 در بیلبورد Hot 100 و No. استپ به کارگردانی آلیس تزو و جان ریپا، داستان سیندرلا را در مسیری متفاوت قرار می دهد. بر اساس بیانیه‌ای، لیلیت (علی ونگ)، خواهرخوانده‌های «شیطان» سیندرلا، عصای جادویی متعلق به مادرخوانده پری (بت میدلر) را می‌دزدند و توپ سلطنتی را با مارگوت (استفانی هسو) می‌ربایند. وارد پریسیلا (نیکی گلاسر) می‌شوید، یک «مدیر شرور که وارد می‌شود و تاج و تخت را می‌رباید». با سرپرستی پریسیلا،"}, {"source": "Billboard", "title": "Selena Gomez Talks ‘Sweet’ First Wedding Anniversary Celebration With Benny Blanco: ‘We’re So Cheesy’", "link": "https://www.billboard.com/music/pop/selena-gomez-sweet-wedding-anniversary-celebration-blanco-1236361154/", "summary": "Some traditions are just too sweet to pass up. On the red carpet at her fourth annual Rare Impact Fund Benefit event at the Hollywood Palladium in Los Angeles on Wednesday night (Oct. 14), Selena Gomez talked to Extra about how she marked her one-year anniversary with husband producer Benny Blanco , 38, last month. Related Randy Rainbow Quotes Jay-Z s 99 Problems in RFK Jr.-Roasting New Song Parody: The Worms in His Brain Clearly Drove Him Insane Martin Short Nearly Derailed Selena Gomez and Benny Blanco s Wedding Reception With Frosting Faux Pas: Everything Was Perfect Except Geordie Greep Responds to Sexual Misconduct Allegation, Cancels Tour Dates (UPDATE) Saying the low-key celebration was so sweet, Gomez, 34, said the couple actually just ate a piece of cake and watched videos in our pajamas. When asked what videos they watched, Gomez smiled, The wedding videos! We re so cheesy. The couple made it official on Sept. 27 last year in Santa Barbara, Calif. after two years of dating and on their anniversary this year Blanco posted a photo on Instagram of the traditional set-aside piece of wedding cake sitting on a pink plate with the phrase LOVE IS LOVE on it. “Year old cake never tasted so good,” Blanco wrote in the caption, sharing another photo on his Story from the couple’s wedding ceremony, writing, “1 year down… forever to go…” Blanco was unfamiliar with the cake-saving tradition until Gomez s grandmother alerted him to it and he was totally down, except the piece they had on reserve had a few bites taken out of it already. You see, instead of one of those huge, multitiered wedding cakes, the couple decided to go for a small cake. The only problem was that Gomez s Only Murders in the Building co-star Martin Short thought it was a prop and he tucked into it on the sly. “He just ate it with his hand, and they had to put it back together,” Blanco revealed while co-hosting Today with Jenna Sheinelle last month. So, instead of savoring the cake on their one-year anniversary, they only had six slices left this year. “I hope you only have to eat it for the first year,” Blanco said. “I don’t want to be eating this thing on year six. I didn’t even wrap it correctly. It’s probably furry now.” Wednesday night s Rare Impact Fund benefit in support of increasing access to youth mental health services and education was hosted by Gomez and emceed by actor/comedian Sean Hayes and featured performances from Leon Bridges and Bella Kay.", "date_str": "2026-10-15T12:45:45+00:00", "hash": "71e7cc1c653a1df8", "title_fa": "سلنا گومز در اولین جشن سالگرد ازدواجش با بنی بلانکو \"شیرین\" صحبت می کند: \"ما خیلی شیک هستیم\"", "summary_fa": "برخی از سنت‌ها آنقدر شیرین هستند که نمی‌توان از آنها گذشت. سلنا گومز چهارشنبه شب (14 اکتبر) بر روی فرش قرمز چهارمین رویداد سالانه خود در مراسم اهدای مزایای صندوق تاثیر نادر در هالیوود پالادیوم در لس آنجلس، با Extra درباره چگونگی جشن یک سالگی خود با همسرش بنی بلانکو، تهیه کننده 38 ساله، در ماه گذشته صحبت کرد. نقل قول های مرتبط رندی رنگین کمان 99 مشکل جی زی در RFK جونیور - تقلید آهنگ جدید برشته کردن: کرم ها در مغز او به وضوح او را دیوانه کردند. ادعای سوء رفتار، تاریخ های تور را لغو کرد (به روز رسانی) گومز 34 ساله با گفتن اینکه جشن آرام بسیار شیرین بود، گفت که این زوج در واقع فقط یک تکه کیک خوردند و ویدیوهایی را با لباس خواب ما تماشا کردند. وقتی از گومز پرسیده شد که چه فیلم هایی را تماشا کرده اند، لبخند زد، فیلم های عروسی! ما خیلی شیطونیم این زوج در 27 سپتامبر سال گذشته در سانتا باربارا، کالیفرنیا، پس از دو سال آشنایی و در سالگرد ازدواجشان در سال جاری، بلانکو عکسی را در اینستاگرام از کیک عروسی که روی یک بشقاب صورتی نشسته بود، با عبارت LOVE IS LOVE در اینستاگرام منتشر کرد. بلانکو در توضیح این عکس نوشت: «کیک یکساله هرگز اینقدر خوش طعم نبود. ببینید، به جای یکی از آن کیک های عروسی بزرگ و چند طبقه، این زوج تصمیم گرفتند به سراغ یک کیک کوچک بروند. تنها مشکل این بود که مارتین شورت، همبازی گومز فقط قتل‌ها در ساختمان، فکر می‌کرد که این یک تکیه‌گاه است و با حیله‌گری وارد آن شد. بلانکو در حالی که ماه گذشته با Jenna Sheinelle میزبان امروز بود، فاش کرد: \"او فقط آن را با دستش خورد و مجبور شدند دوباره آن را جمع کنند.\" بنابراین، به جای مزه مزه کردن کیک در"}, {"source": "Billboard", "title": "NBA Star Anthony Edwards Named His 2026 ‘White Boy of the Year’ and You’ll Never Guess Who Beat Out Travis Kelce and Tom Holland", "link": "https://www.billboard.com/music/pop/justin-bieber-white-boy-of-year-anthony-edwards-believe-that-1236361133/", "summary": "Grammys are great, Oscars divine, Emmys are a dream and Super Bowl trophies are tops. But in the world of Minnesota Timberwolves shooting guard Anthony Ant Edwards, the only hardware that matters is his annual tongue-in-cheek Believe That Awards. And the winner of one of the top prizes at the second-annual BTA honor could not be more apt this year. After bestowing the jokey prize on actor Timothée Chalamet last year, Edwards announced that the coveted 2026 White Boy of the Year prize went to Justin Bieber . The resurgent Swag star beat out some stiff competition from Kansas City Chiefs Super Bowl legend Travis Kelce, Spider-Man star Tom Holland, World Cup viral Viking Erling Haaland and perennial contender actor Robert Pattinson. Bieber couldn t make it, but he sent in a video to commemorate his career high-point. Mr. Anthony Edwards himself honoring me with the White Boy of the Year award. Man, thank you bro, said Bieber in the vertical clip in which he was wearing a gray hoodie. This is special. Everyone knows how influenced I am by Black culture and this one s sweet. I appreciate you guys, I ll tap in with you guys soon. All right. The awards celebrating standout moments, cultural disruptors and iconic achievements across sports and entertainment, filtered through the unapologetic and uncensored lens of Edwards, is available to screen on Edwards YouTube page now. The whole affair had a playfully casual mood, with Edwards casually eating his dinner while presenting the prizes and gleefully razzing the winners during their acceptance speeches. Other hotly contested categories included the Main Character of the Year, which featured Zendaya, Cardi B, Keke Palmer and Mr. Beast going up against the night s winner, viral comedian Druski. I thought I was getting white man of the year award! the comedian said in a beamed-in acceptance speech from what looked like the inside of a plane. Chalamet was not totally shut out this year, though. He earned a nom for Iconic Performance of the Year for his role in Marty Supreme , with stiff competition from Inda Navarette ( Obsession ), Jaafar Jackson ( Michael ), Anne Hathaway ( The Odyssey ) and the night s winner, Michael B. Jordan, for this searing dual role as Smoke and Stack in Sinners . Other winners included: IShowSpeed (Creator of the Year), Timberwolves power forward Jaden McDaniels (Stood on Bidness), Timberwolves point guard LaMelo Ball (Bring Ya Ass), tennis champ Coco Gauff (Beauty and the Best — Outstanding ", "date_str": "2026-10-15T12:05:54+00:00", "hash": "9dc350d394947433", "title_fa": "آنتونی ادواردز ستاره NBA سال 2026 خود را به عنوان پسر سفیدپوست سال انتخاب کرد و هرگز حدس نخواهید زد که چه کسی تراویس کلس و تام هالند را شکست داد.", "summary_fa": "گرمی ها عالی هستند، اسکار الهی، امی ها یک رویا هستند و جام های سوپر بول برترین ها هستند. اما در دنیای آنتونی مورچه ادواردز، گارد تیراندازی مینه‌سوتا تیمبرولوز، تنها سخت‌افزاری که اهمیت دارد جوایز سالانه او به نام Believe That است. و برنده یکی از جوایز برتر در دومین افتخار سالانه BTA امسال نمی تواند مناسب تر باشد. پس از اعطای جایزه جوکی به بازیگر تیموتی شالامه در سال گذشته، ادواردز اعلام کرد که جایزه پسر سفید سال 2026 به جاستین بیبر تعلق گرفت. ستاره احیا شده Swag از رقبای سرسختی از تراویس کلس، اسطوره سوپربول کانزاس سیتی، تام هالند ستاره مرد عنکبوتی، وایکینگ ارلینگ هالند ویروسی جام جهانی و رابرت پتینسون بازیگر مدعی همیشگی شکست خورد. بیبر نتوانست به آن برسد، اما او در یک ویدیو برای بزرگداشت نقطه اوج حرفه ای خود ارسال کرد. آقای خود آنتونی ادواردز از من با جایزه پسر سفید سال تقدیر کرد. مرد، متشکرم برادر، بیبر در کلیپ عمودی که در آن یک هودی خاکستری پوشیده بود، گفت. این خاص است. همه می دانند که من چقدر تحت تأثیر فرهنگ سیاه پوست هستم و این یکی شیرین است. من از شما تشکر می کنم، به زودی با شما بچه ها تماس خواهم گرفت. بسیار خوب. جوایز جشن لحظات برجسته، اخلالگران فرهنگی و دستاوردهای نمادین در ورزش و سرگرمی، که از طریق لنز غیرقابل معذرت و سانسور ادواردز فیلتر شده است، اکنون در صفحه YouTube Edwards برای نمایش در دسترس است. کل ماجرا حالتی بازیگوشانه داشت، به طوری که ادواردز به طور معمول شام خود را در حین اهدای جوایز می خورد و با خوشحالی برندگان را در طول سخنرانی های پذیرش آنها به خاک و خون می کشید. دیگر مقوله‌های مورد مناقشه شامل شخصیت اصلی سال بود که زندایا، کاردی بی، کیک پالمر و آقای هیولا در مقابل برنده شب، کمدین ویروسی"}, {"source": "Billboard", "title": "SXSW London Confirms Dates & Theme for 2027 Edition: Here’s What to Expect", "link": "https://www.billboard.com/pro/sxsw-london-2027-dates-theme-tickets/", "summary": "SXSW London has confirmed its conference dates and unveiled the theme for 2027 s event. Next year’s edition will take place between May 24-29 in Shoreditch, east London for the third consecutive year. SXSW London first arrived in the English capital in 2025, with its second edition taking place in June 2026. Super early bird passes are on sale from Friday (Oct. 16) and half price until Dec. 1. Related SXSW London: 7 Biggest Takeaways From 2026 s Diverse Headline-Grabbing Program Hilary Duff to Receive Outstanding Pop Tour of the Year Award at 2026 Billboard Live Music Summit Judge Rules Woman Accused of Shooting at Rihanna A$AP Rocky s Home Mentally Fit to Stand Trial SXSW London’s theme for 2027 has been billed as ‘The Power of Human Potential’ with 14 tracks across the programming track. These include returns for ‘AI Experience’, ‘Frontier Technologies’, ‘Health Longevity’ and ‘Society Rewired’, as well as new tracks such as ‘Future Earth’ and ‘Sports’. Billboard has hosted THE STAGE at the London event, a continuation of its existing presence at SXSW in Austin, TX. In 2025, afrobeats star Tems headlined the event , followed by DJ AG in 2026. At 2026’s edition, SXSW London reports that over 20,000 festivalgoers attended the event, alongside 863 speakers and 256 artists. Previous speakers include Sir Tim Berners-Lee, Demis Hassabis, Michelle Obama, Esther Perel, the Russo brothers, Idris Elba and the late Dr. Jane Goodall. Conference and screen submissions are open via SXSW London’s official website ; conference submissions close on Nov. 12, with screen submissions closing on Jan. 31, 2027. Katy Arnander , chief programming officer at SXSW London, said: “The 2027 theme, ‘The Power of Human Potential’, is as much a call to action as it is a programming theme. SXSW London is the global festival for the convergence of business, tech, creativity and culture. The conversations on our stages, at our parties and in our networking sessions shape what happens in the year ahead.” She added, “In our third year, we look forward to once again welcoming artists, inventors, leaders, founders and policymakers to lead conversations, make connections, and bring curiosity and practical optimism to the future of their industries and our collective society.” Billboard ’s parent company PMC is the largest shareholder of SXSW and its brands are official media partners of SXSW.", "date_str": "2026-10-15T11:54:14+00:00", "hash": "74a32f40b1a82075", "title_fa": "SXSW لندن تاریخ ها و موضوع را برای نسخه 2027 تأیید می کند: این چیزی است که باید انتظار داشت", "summary_fa": "SXSW لندن تاریخ کنفرانس خود را تایید کرده و موضوع رویداد سال 2027 را معرفی کرده است. نسخه سال آینده برای سومین سال متوالی بین 24 تا 29 می در شوردیچ، شرق لندن برگزار خواهد شد. SXSW لندن برای اولین بار در سال 2025 وارد پایتخت انگلیس شد و دومین نسخه آن در ژوئن 2026 برگزار شد. بلیط های فوق زودرس پرنده از جمعه (16 اکتبر) و نیم بها تا 1 دسامبر به فروش می رسد. مرتبط SXSW لندن: 7 بزرگ‌ترین پیشنهاد از سال 2026، برنامه‌های مختلف تیتربرانگیز هیلاری داف برای دریافت جایزه بهترین تور پاپ سال در سال 2026 در اجلاس موسیقی زنده بیلبورد، قاضی حکم می‌دهد که زن متهم به تیراندازی در ریانا A$ AP Rockyalit برای St. سال 2027 به عنوان \"قدرت پتانسیل انسانی\" با 14 آهنگ در سراسر مسیر برنامه نویسی نامگذاری شده است. این موارد شامل بازگشت‌هایی برای «تجربه هوش مصنوعی»، «فناوری‌های مرزی»، «طول عمر طولانی سلامت» و «جامعه مجدد» و همچنین آهنگ‌های جدیدی مانند «زمین آینده» و «ورزش» است. بیلبورد میزبان STAGE در رویداد لندن است، که ادامه حضور فعلی خود در SXSW در آستین، تگزاس است. در سال 2025، Tems، ستاره afrobeats، تیتر این رویداد بود و پس از آن DJ AG در سال 2026. در نسخه 2026، SXSW لندن گزارش داد که بیش از 20000 تماشاگر جشنواره در کنار 863 سخنران و 256 هنرمند در این رویداد شرکت کردند. سخنرانان قبلی عبارتند از: سر تیم برنرز لی، دمیس حسابیس، میشل اوباما، استر پرل، برادران روسو، ادریس البا و مرحوم دکتر جین گودال. ارسالی کنفرانس و صفحه نمایش از طریق وب سایت رسمی SXSW لندن باز است. ارسال‌های کنفرانس در 12 نوامبر به پایان می‌رسد و ارسال‌ها در صفحه نمایش در 31 ژانویه 2027 بسته می‌شود. کیتی آرناندر، مدیر برنامه‌نویسی SXSW لندن، گفت: «موضوع سال 2027، «قدرت بالقوه انسانی»، به همان اندازه که"}, {"source": "Billboard", "title": "Inside Starlight Festival’s Historic Debut at the Great Pyramids of Giza", "link": "https://www.billboard.com/music/music-news/starlight-festival-great-pyramids-of-giza-1236361129/", "summary": "The Great Pyramids of Giza became the backdrop for one of electronic music’s most ambitious destination festivals as EXIT and P+US, Venture Lifestyle’s electronic music platform, brought the inaugural Starlight Festival to Egypt on Oct. 9 and 10. The sold-out event marked the first multi-day, multi-stage electronic music festival staged at Giza, bringing together more than 60 international and regional artists and attendees from 114 countries. Organizers said it was also the largest electronic music event held at the historic site, since a concert by French pioneer Jean-Michel Jarre held in 1999. Belgian techno heavyweight Charlotte de Witte made her Egyptian debut alongside a lineup featuring Michael Bibi, Adriatique, Indira Paganotto, Enrico Sangiuliano, Vintage Culture, Pete Tong and WhoMadeWho. Beyond the main stage, EXIT’s No Sleep stage hosted Charlie Sparks, BIIA, Layla Benitez, Paolo Ferrara and Olympe, while live performances from Satori and Giolì Assia added another dimension to the weekend. Multimedia studio Sila Sveta designed the festival’s visual production, using elaborate lighting and optical illusions to create the impression of the pyramids floating above the stage. Starlight also marked the final stop on EXIT’s eight-event international tour, which took the Serbian festival across Europe and into Egypt after it was forced to leave its longtime home following its public support for student-led protests in Serbia. “In the year we could not gather at home, we found ourselves bringing people together in front of the greatest wonder of the ancient world,” said EXIT founder and CEO Dušan Kovačević . The festival also reflected the growing importance of music tourism, with international audiences increasingly traveling for experiences that combine music, culture and destination. “An extraordinary location should deepen the experience, rather than become a substitute for it,” Kovačević explained, emphasizing that electronic music and club culture would remain central to Starlight’s identity. For Venture Lifestyle founder and CEO Rabih Mokbel , the partnership offered an opportunity to position Egypt as a serious contender in the international festival market. “It shows that Egypt has the potential to host world-class festivals that can compete on an international level, not just because of the artists or production, but because of the destination itself,” he said. Mokbel also emphasised the importance of placing regional artists alongside establ", "date_str": "2026-10-15T11:24:29+00:00", "hash": "cdadd631bdcea4e2", "title_fa": "اولین حضور تاریخی جشنواره Inside Starlight در اهرام بزرگ جیزه", "summary_fa": "اهرام بزرگ جیزه پس‌زمینه یکی از جاه‌طلبانه‌ترین فستیوال‌های مقصد موسیقی الکترونیک شد، زیرا EXIT و P+US، پلتفرم موسیقی الکترونیک Venture Lifestyle، افتتاحیه جشنواره Starlight را در 9 و 10 اکتبر به مصر آورد. این رویداد فروخته شده، اولین جشنواره چند روزه و چند مرحله‌ای موسیقی الکترونیک را رقم زد که بیش از هنرمندان بین‌المللی از مناطق مختلف جیزه را گرد هم می‌آورد. 114 کشور سازمان دهندگان گفتند که از زمان کنسرت پیشگام فرانسوی ژان میشل ژار که در سال 1999 برگزار شد، این همچنین بزرگترین رویداد موسیقی الکترونیکی بود که در این مکان تاریخی برگزار شد. فراتر از صحنه اصلی، صحنه بدون خواب EXIT میزبان چارلی اسپارکس، BIIA، لیلا بنیتز، پائولو فرارا و المپ بود، در حالی که اجراهای زنده از Satori و Giolì Assia بعد دیگری به آخر هفته اضافه کردند. استودیوی چند رسانه ای سیلا سوتا، تولید بصری جشنواره را با استفاده از نورپردازی دقیق و توهمات نوری برای ایجاد تصور اهرام شناور بالای صحنه طراحی کرد. Starlight همچنین آخرین ایستگاه تور بین‌المللی هشت رویدادی EXIT را رقم زد، که جشنواره صربستان را در سراسر اروپا و مصر برد، پس از آن که پس از حمایت عمومی از تظاهرات دانشجویان در صربستان مجبور به ترک خانه قدیمی خود شد. دوشان کواچویچ، بنیانگذار و مدیر اجرایی EXIT گفت: «در سالی که نتوانستیم در خانه جمع شویم، متوجه شدیم که مردم را در مقابل بزرگترین شگفتی دنیای باستان گرد هم می‌آوریم. این جشنواره همچنین نشان دهنده اهمیت روزافزون گردشگری موسیقی بود و مخاطبان بین المللی به طور فزاینده ای برای تجربه هایی که موسیقی، فرهنگ و مقصد را با هم ترکیب می کنند، سفر می کردند. کواچویچ با تاکید بر اینکه موسیقی الکترونیک و فرهنگ کلوپ در هویت استارلایت محور باقی خواهند ماند، توضیح داد: «یک مکان فوق‌العاده باید تجربه را عمیق‌تر کند، نه اینکه جایگزینی برای آن شود»."}, {"source": "Billboard", "title": "‘Holy S—‘: Powderfinger Overwhelmed By Demand, Expands 2027 Reunion Tour", "link": "https://www.billboard.com/music/rock/powderfinger-overwhelmed-demand-expands-2027-reunion-tour-1236361118/", "summary": "It should take a lot to surprise the members of Powderfinger , one of Australia’s most successful rock bands of the past 30 years. When the pre-sale opened this week for the band’s reunion tour , the Powderfinger camp was collectively gobsmacked. “Holy s !!! Thank you, thank you, thank you!!!,” reads a message from the Finger, whose classic lineup of Bernard Fanning (vocals), Ian Haug (guitars), Darren Middleton (guitars), John “JC” Collins (bass) and Jon Coghill (drums) are on the comeback trail. When pre-sales began Wednesday, Oct. 14, fans “showed up for us in a way none of us saw coming,” the note continues. “You set alarms, sat in queues and cheered each other on in the comments. Some of you are planning to travel across the country, and some from the other side of the world. After all these years, that means more to us than we can put into words.” After five consecutive ARIA No. 1 albums, 18 ARIA Awards and three APRA Awards including a brace for song of the year, Powderfinger called time on their illustrious career with The Sunsets Farewell tour, a 34-date national trek in September–November 2010. Taking its name from the classic song from 2004’s ARIA No. 1 album Vulture Street , the Sunsets jaunt shifted more than 300,000 tickets. Few Aussie acts can command that type of box office action. Next year’s tour promises to dwarf it. The 18 dates announced at the start of last week has now ballooned to 26, and stretches into November 2027, with additional shows locked in for Sydney, Melbourne, Brisbane and Perth. “The demand blew us away,” the message continues. It went so far beyond the presale allocation that we added six new shows across Brisbane, Perth, Sydney and Melbourne, and those tickets flew too. Powderfinger’s tour will feature a homegrown support cast, all of them performing under “stadium-sized big top” in central city locations across the country, including multiple dates in Cairns, far north Queensland. The general on-sale starts from Monday, Oct. 19. Powderfinger Australia Tour 2027 : Friday, Sept. 3 – Brisbane, Brisbane Showgrounds Saturday, Sept. 4 – Brisbane, Brisbane Showgrounds Monday, Sept. 6 – Brisbane, Brisbane Showgrounds Wednesday, Sept. 8 Brisbane Showgrounds Friday, Sept. 10 – Brisbane, Brisbane Showgrounds Saturday, Sept. 11 – Brisbane, Brisbane Showgrounds Friday, Sept. 17 – Cazalys Stadium, Cairns Saturday, Sept. 18 Cazalys Stadium, Cairns Friday, Sept. 24 Wellington Square, Perth Saturday, Sept. 25 Wellington Square, Perth", "date_str": "2026-10-15T10:00:03+00:00", "hash": "c4daed97fa9fe31a", "title_fa": "«Holy S—»: Powderfinger تحت تاثیر تقاضا، گسترش تور 2027 Reunion", "summary_fa": "غافلگیری اعضای Powderfinger، یکی از موفق ترین گروه های راک استرالیا در 30 سال گذشته، باید خیلی طول بکشد. وقتی پیش فروش این هفته برای تور اتحاد مجدد گروه باز شد، کمپ Powderfinger مجموعاً غمگین شد. \"س مقدس!!! متشکرم، متشکرم، متشکرم!!!» در پیامی از Finger، که ترکیب کلاسیک آن برنارد فانینگ (خواننده)، ایان هاگ (گیتار)، دارن میدلتون (گیتار)، جان «جی سی» کالینز (بیس) و جان کوگیل (درامز) در مسیر بازگشت هستند، آمده است. وقتی پیش‌فروش‌ها در روز چهارشنبه، 14 اکتبر برای ما آغاز شد. یادداشت ادامه می‌دهد: «شما آلارم‌ها را تنظیم کردید، در صف‌ها نشستید و در نظرات یکدیگر را تشویق کردید. برخی از شما در حال برنامه ریزی برای سفر به سراسر کشور و برخی از آن سوی جهان هستید. بعد از این همه سال، این برای ما بیش از آن چیزی است که بتوانیم در کلمات بیان کنیم.» پس از پنج آلبوم متوالی شماره 1 ARIA، 18 جایزه ARIA و سه جایزه APRA از جمله یک جایزه برای آهنگ سال، Powderfinger با تور The Sunsets Farewell، یک سفر ملی با 34 تاریخ در سپتامبر تا نوامبر 2010، نام خود را از آهنگ کلاسیک No20IA04 گرفته است. 1 آلبوم خیابان کرکس، گردش غروب غروب بیش از 300000 بلیط را جابه جا کرد. تعداد کمی از بازیگران استرالیایی می توانند این نوع اکشن های باکس آفیس را فرمان دهند. تور سال آینده وعده می دهد که آن را کوتوله کند. 18 تاریخ اعلام شده در ابتدای هفته گذشته اکنون به 26 تاریخ رسیده است و تا نوامبر 2027 ادامه دارد، با نمایش های اضافی برای سیدنی، ملبورن، بریزبن و پرث. این پیام ادامه می‌دهد: «تقاضا ما را منفجر کرد». آنقدر فراتر از تخصیص پیش فروش بود که شش نمایش جدید در بریزبن، پرث، سیدنی و ملبورن اضافه کردیم و آن بلیط ها نیز پرواز کردند. تور پودرفینگر شامل یک بازیگر"}, {"source": "Deadline", "title": "Donald Trump Says Execution Of Fort Hood Shooter Will Not Be Live Streamed", "link": "https://deadline.com/2026/10/trump-ford-hood-shoot-execution-live-stream-1237158037/", "summary": "Donald Trump has reversed the Pentagon s plans to live stream the December execution of Nidal Malik Hasan, convicted of killing 13 and injuring dozens of others in a shooting rampage at Fort Hood. Trump posted on Truth Social on Thursday, I think streaming the execution for all to see might have been a strong deterrent [ ]", "date_str": "2026-10-15T14:22:16+00:00", "hash": "0f6ac0fa1348c375", "title_fa": "دونالد ترامپ می گوید اعدام فورت هود شوتر به صورت زنده پخش نمی شود", "summary_fa": "دونالد ترامپ برنامه های پنتاگون برای پخش زنده اعدام نیدال مالک حسن را که به کشتن 13 نفر و زخمی کردن ده ها نفر دیگر در تیراندازی در فورت هود محکوم شده بود، لغو کرد. ترامپ روز پنجشنبه در سایت Truth Social پست کرد، من فکر می‌کنم پخش این اعدام برای همه ممکن است یک عامل بازدارنده قوی باشد [ ] وقتی پنتاگون هفته گذشته برنامه‌های خود را برای پخش جریانی اعدام اعلام کرد، بلافاصله با اعتراض تعدادی از گروه‌های مذهبی و سیاستمداران راست و چپ مواجه شد. ترامپ در این هفته در اظهارنظرهایی برای خبرنگاران اشاره کرد که در حال بررسی مجدد این طرح است. دیده بان در ددلاین ترامپ نوشت که در صورت صلاحدید خانواده قربانیان ممکن است شخصاً اعدام را ببینند. آنها سزاوار شهادت عدالت هستند! اعدام با جوخه تیر برای 3 دسامبر برنامه ریزی شده است. اسقف اعظم پل کوکلی، رئیس کنفرانس اسقف های کاتولیک ایالات متحده، برنامه های پخش زنده اعدام را ترویج وحشیانه فرهنگ مرگ خواند. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید."}, {"source": "Deadline", "title": "Ralph Fiennes Reunites With ‘Conclave’ Producer & Studiocanal For Story Of Legendary Trainer Henry Cecil & Champion Horse Frankel", "link": "https://deadline.com/2026/10/ralph-fiennes-play-henry-cecil-film-about-top-horse-frankel-1237157998/", "summary": "EXCLUSIVE: Three-time Oscar nominee Ralph Fiennes is reuniting with Conclave producer Tessa Ross and A Bigger Splash backer Studiocanal on Unbeaten, a biopic of legendary British horse racing trainer Henry Cecil and his most famous charge, Frankel. Fiennes will star as Cecil and serve as executive producer on the film, which is being lined up [ ]", "date_str": "2026-10-15T14:02:52+00:00", "hash": "5557fdb004c38e64", "title_fa": "رالف فاینس برای داستان مربی افسانه ای هنری سیسیل و قهرمان اسب فرانکل با تهیه کننده Conclave و Studiocanal دوباره متحد می شود.", "summary_fa": "اختصاصی: رالف فاینس، نامزد سه جایزه اسکار، با تسا راس، تهیه‌کننده Conclave و استودیوکانال، حامی A Bigger Splash، در فیلم Unbeaten، یک فیلم زندگی‌نامه‌ای از هنری سیسیل، مربی افسانه‌ای بریتانیایی اسب‌سواری و معروف‌ترین متهم او، فرانکل، دوباره متحد می‌شود. فاینز در نقش سیسیل ایفای نقش خواهد کرد و به عنوان تهیه کننده اجرایی در این فیلم که در حال ساخت است، ایفای نقش خواهد کرد. [ ] اختصاصی: رالف فاینس، نامزد سه جایزه اسکار، با تسا راس، تهیه کننده Conclave و حامی A Bigger Splash، استودیوکانال در Unbeaten، یک فیلم زندگی نامه ای از مربی افسانه ای و مشهورترین اسب سوار بریتانیایی خود، فرانسیل است. فیلمنامه از نامزد Boardwalk Empire WGA، Bash Doran، تهیه کننده مشاور Beef، توسط برنده بفتا، Nora Fingscheidt (System Crash) با راس تهیه کننده برای House Productions و Rory Aitken تهیه کننده برای Escapade Pictures کارگردانی خواهد شد. 42 نیز تولید خواهد کرد. Pic با پشتیبانی BBC Film and Conclave و Access Entertainment حامی منطقه مورد علاقه توسعه داده شده است. اخبار مرتبط اخبار رالف فاینس، کالین فارل واگنر مورا مجموعه ای برای هنر کمدی از کارگردان فرناندو مایرلس، فیلمنامه نویس کریستوفر همپت hristmas is een Amerikaanse kerst- en dramafilm uit 2026, geschreven en geregisseerd door Tyler Perry (van onder meer Doing Life). Het verhaal speelt zich af in New York, waar een predikant probeert een kerk nieuw leven in te blazen. Wat aanvankelijk een nieuwe kans lijkt, verandert in een moeilijke strijd waarin zijn geloof en zelfs de toekomst van een hele gemeenschap op het spel komen te staan. De hoofdrol is voor Isaac (Durrell Tank Babbs), een predikant die een moeilijke periode doormaakt. Wanneer hij de kerk van zijn familie erft, verhuist hij samen met zijn vrouw Rebecca (Fantasia Barrino) en hun gezin naar New York. De kerk bevindt zich in een achterstandswijk waar veel bewoners met problemen kampen. Isaac krijgt de zware taak om het gebedshuis te herstellen en opnieuw een belangrijke plek binnen de gemeenschap te geven. Reddingspoging is ingewikkelder Al snel ontdekt Isaac dat het redden van de kerk veel ingewikkelder is dan hij had verwacht. Niet alleen staat de toekomst van het gebouw en de geloofsgemeenschap onder druk, ook zijn persoonlijke overtuigingen worden zwaar op de proef gesteld. Hij worstelt met twijfels over zijn geloof en wordt geconfronteerd met verleidingen die hem van zijn oorspronkelijke missie dreigen af te brengen. Daarnaast krijgt Isaac te maken met een mysterieuze en sinistere tegenstander, die een bedreiging vormt voor alles wat hij probeert op te bouwen. Terwijl de problemen zich opstapelen, dreigt hij niet alleen zijn kerk kwijt te raken, maar komen ook zijn gezin en de mensen in zijn omgeving steeds verder onder druk te staan. Met Kerstmis in aantocht moet Isaac een manier vinden om zijn geloof en vertrouwen terug te winnen. Een belangrijke rol in The Gospel of Christmas is weggelegd voor muziek en gospelzang. De film bevat zowel traditionele als moderne gospelnummers, aangevuld met rap en kerstmuziek. Op 11 november komt deze kerstfilm uit op Netflix! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebo
