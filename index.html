s://www.rollingstone.com/music/music-news/madonna-danceteria-vmas-2026-charli-xcx-sabrina-carpenter-1235632854/", "summary": "Sabrina Carpenter and Charli XCX joined the Queen of Pop on stage for a star-studded performance", "date_str": "2026-09-28T11:52:22+00:00", "hash": "5427b167a95d1968", "title_fa": "«Danceteria» مدونا یکی از بهترین لحظات در تاریخ VMA بود", "summary_fa": "سابرینا کارپنتر و چارلی XCX برای اجرای پر ستاره به ملکه پاپ روی صحنه ملحق شدند. او عملاً این برنامه را در اولین باری که در سال 1984 پخش شد اختراع کرد و اولین حضور بدنام خود را با لباس عروس سفیدش در نقش عروس رسوایی در فیلم Like a Virgin انجام داد. آن اجرا برای او شگفت‌انگیز بود، اما شگفتی‌های بزرگ‌تر برای VMA ها، لحظه‌ای است که این رویداد از آن زمان همیشه آرزوی انجام آن را داشته است. او را به عنوان ملکه سابق و آینده این نمایش تثبیت کرد. اما عجیب به نظر می رسد، تا دیشب، او از سال 2003، زمانی که نسخه بهتری از Like a Virgin را در جلسه آرایش افسانه ای خود با بریتنی اسپیرز انجام داد، VMA ها را تکان نداده بود. بنابراین خطرات برای بازگشت مورد انتظار او در شب گذشته بالا بود. اما بازی شگفت‌انگیز او با سابرینا کارپنتر و چارلی XCX، با ترکیبی از One Step Away، Bring Your Love و Danceteria، از Confessions II اخیرش، نشان را ربود. این فقط نقطه برجسته شب نبود. این یکی از خیره کننده ترین اجراها در کل تاریخ VMA ها بود. مناسب است که او با سابرینا شروع کرد، زمانی که مدونا بریتنی را زیر و رو کرد، فقط چهار سال داشت، اما یک دختر اساسی از خانه سیکونه بود. مادر است، صدای ناله در آغاز، زمانی که مدونا تعلیمات خود را در دیسکو می خواند. او گفت که زمین رقص یک مکان نیست. این یک آستانه است. فضایی آیینی که در آن حرکت جای زبان را می گیرد. سابرینا که کلاه سیاه پوشیده بود، پیانو می نواخت و مدونا بالای آن می پیچید. آنها دوئت کوچلا-کشی خود را به نام «عشق تو را بیاور» را با سابرینا انجام دادند که در لیدرهوسن مشکی پر زرق و برق خود می پیچید و"}, {"source": "Rolling Stone", "title": "The VMAs: The One Night When MTV Pretends to be MTV", "link": "https://www.rollingstone.com/music/music-news/mtv-vmas-2026-madonna-taylor-swift-review-1235632807/", "summary": "Madonna, Snoop, Nirvana, Taylor, and the ghost of the Nineties loomed large at the annual awards show", "date_str": "2026-09-28T11:30:43+00:00", "hash": "eaea5056c7bcf0b7", "title_fa": "VMAs: The One Night When MTV وانمود می کند که MTV است", "summary_fa": "مدونا، اسنوپ، نیروانا، تیلور، و شبح دهه نود در مراسم جوایز سالانه حضور داشتند ستاره جوایز موسیقی ویدئویی MTV 2026؟ آن دهه نود خواهد بود، که در تمام طول شب ظاهر شد. این مراسم توسط اسنوپ داگ با ادای احترام به نیروانا برگزار شد. مدونا برنده بزرگ و مجری افتتاحیه شب بود. یک فیلم کمدی در مورد Spice Girls وجود داشت. همه آزادی 90 را خواندند. کل برنامه پر از انرژی دهه نود بود و وعده داد که شب بزرگی برای سر میکس-آ-لات و سوفی بی هاوکینز باشد. اما این قابل درک است، زیرا آن روزها، روزهای شکوه MTV بود، و این زمانی بود که VMA ها به عنوان مهمانی تلویزیونی سال، هر سال حکمرانی کردند. این اولین سالی بود که VMA ها یک شبکه جدید دریافت کردند که از CBS و همچنین Paramount+ و هر آنچه از MTV باقی مانده بود پخش شد. بنابراین تم دهه نود راهی برای یادآوری روسای جدید شرکت‌ها به نظر می‌رسید که چرا MTV به عنوان مرکز موسیقی فرهنگ پاپ حکومت می‌کرد. با این حال این نمایش نکات برجسته زیادی داشت. مدونا با سابرینا کارپنتر و چارلی XCX در حال سفر به زمان دیسکو در Danceteria. تیلور سوئیفت در حال نمایش ویدیوی مهیج قتل بیمار صفر. نیروانا مطلقاً هیچ کاری انجام نمی دهد. اگر معلوم شود که این آخرین VMA است، آن‌ها به سبکی ظاهر شدند. اسنوپ آن را به عنوان مجری که چندین بار در این مهمانی بازی کرده است، کشته است، حتی چند نفر از افراد ماه را برنده شده است، بنابراین او یک O.G است. چه کسی می داند چگونه کار می کند او فقط به عنوان اسنوپ دادگاه داشت، لاآآآآآیید. او قول داد امشب بزرگترین مهمانی است که VMA ها تا به حال دیده اند. اگر من برخی از آن icky icky خاص را ارائه نمی کردم، یک مهمانی اسنوپ"}, {"source": "Rolling Stone", "title": "Pearl Jam Officially Welcome Abe Laboriel Jr. as New Drummer During Thunderous Ohana Headlining Set", "link": "https://www.rollingstone.com/music/music-live-reviews/pearl-jam-abe-laboriel-jr-billy-strings-ohana-festival-1 ston-1235632791/", "summary": "The duo previously collaborated on a joint single, “Ahí”", "date_str": "2026-09-28T07:07:24+00:00", "hash": "78d3c287e76881f9", "title_fa": "تماشای Drake Join Karol G برای اجرای «One Dance» در هیوستون", "summary_fa": "دریک یکشنبه شب در کنسرت کارول جی در هیوستون یک حضور غافلگیرکننده داشت. این خواننده رپ برای اجرای آهنگ سال 2016 آهنگ One Dance به خواننده کلمبیایی پیوست. نمایش کارول جی در استادیوم Reliant آخرین توقف در Viajando Por El Mundo Tropitour او بود که در ژوئیه آغاز شد. این سفر جهانی تا سال 2027 ادامه دارد و در آمریکای شمالی، اروپا و آمریکای جنوبی توقف دارد. آخرین آلبوم او، No Me Arrepiento de Sentir Tanto، اوایل امسال وارد بازار شد. دریک قبلاً در ماه ژوئیه در نمایشگاه تورنتو کارول جی ظاهر شد، جایی که او در سالن Jumbotron نمایش داده شد. او بعداً نام او را در آهنگ Maid of Honor New Bestie بررسی کرد. این دو سپس یک تک آهنگ مشترک به نام Ah منتشر کردند که در No Me Arrepiento de Sentir Tanto ظاهر شد. کارول به رولینگ استون گفت که آواز خواندن دریک به زبان اسپانیایی همیشه برای من باورنکردنی بوده است. شروع کردیم به صحبت در مورد ساختن آن به صورت دونفره، مانند آیات که به یکدیگر پاسخ می دهند. و من نمی دانم، اما دوست دارم دریک آن را به اسپانیایی بخواند. داستان‌های پرطرفدار U2 رویای همه چیز را دوباره انجام می‌دهد ری، سامبر، تدی سوئیمز، آدام لمبرت به جورج مایکل در MTV VMA سلام می‌کنند چگونه ترامپ رئیس اوباش ایالات متحده شد SNL: تماشا کنید کاتسی در اجرای حیوانات، هوتی فروتی دریک اخیراً از پروژه‌ای که به‌خاطر ترس از خود دست‌نیافتنی است، رونمایی کرد. در این کلیپ دریک در حال رقصیدن در عمارت وسیع خود و رانندگی با قایق سبز-آهکی خود در امتداد افق شیک تورنتو است. پیوستن به یک گفتگوی صمیمی بین مادرش، ساندرا آیسمام گراهام، و بهترین دوستانش. و یک جفت کت و شلوار 150000 دلاری مرد آهنی را به تن کرد. این ویدیو همچنین آهنگ‌هایی را با دان تولیور و"}, {"source": "Rolling Stone", "title": "Taylor Swift Pays Tribute to Dolly Parton While Accepting Video of the Year Award at 2026 VMAs", "link": "https://www.rollingstone.com/music/music-news/taylor-swift-dolly-parton-vmas-video-of-the-year-ophelia-1235631582/", "summary": "Swift dedicates the award for “The Fate of Ophelia” to Dolly Parton, “the ultimate showgirl”", "date_str": "2026-09-28T02:35:57+00:00", "hash": "0e7351220daaf44c", "title_fa": "تیلور سویفت هنگام دریافت جایزه بهترین ویدیوی سال در VMA 2026 به دالی پارتون ادای احترام کرد.", "summary_fa": "سوئیفت جایزه «سرنوشت اوفلیا» را به دالی پارتون، «بزرگترین شوی‌گرل» تقدیم می‌کند، تیلور سویفت جایزه بهترین موزیک ویدیو خود را در مراسم جوایز ویدیو موزیک ۲۰۲۶ در روز یکشنبه به دختر فقید دالی پارتون، دختر نمایش برتر تقدیم کرد. ویدیوی برنده، The Fate of Ophelia، از آخرین آلبوم سوئیفت، The Life of a Showgirl، توسط خود سوئیفت نوشته و کارگردانی شده است. داستان‌های پرطرفدار U2 همه چیز را رویا می‌برند، ری، سامبر، تدی سوئیمز، آدام لمبرت به جورج مایکل در MTV VMA سلام می‌کنند چگونه ترامپ رئیس اوباش ایالات متحده شد SNL: تماشا کنید Katseye Perform Animal، Hootie Frutti از اینکه این جایزه را به این ویدیو دادید بسیار متشکرم. من خیلی به آن افتخار می کنم. از طرفداران، از شما برای رای دادن به آن متشکرم. من فقط، من عاشق ساختن این ویدیو بودم، زیرا می‌خواستم شبیه یک عکس ممتد به نظر برسد، بنابراین درباره پنهان کردن بریدگی‌ها در مکان‌ها چیزهای زیادی یاد گرفتم، و می‌خواهم از همه کسانی که در فیلمبرداری این ویدیو به من کمک کردند تشکر کنم. او مدی مور، طراح رقص ویدیو، اتان تابمن، فیلمبردار آن، رودریگو پریتو، و تدوینگر آن، شانکلر هاینس، فریاد زد. و در آخر، اما مهمتر از همه، سوئیفت اضافه کرد، می‌خواهم از یک نفر تشکر کنم و این جایزه را به یک نفر تقدیم کنم، که بدون او این اتفاق نمی‌افتاد، و آن شخص دختر نمایشی نهایی، دالی پارتون است. هر آهنگی که او می نوشت، داستان سرایی او بسیار زنده و بسیار غنی بود. گوش دادن به آهنگ های او، مانند تماشای بهترین موزیک ویدیویی است که تا به حال در زندگی خود دیده اید، هر بار که می شنوید او چه نوشته است. مرد، او با چنین لطف و شادی و عشق و قدردانی به خاطر این واقعیت که مجبور به انجام این کار شد، این کار را"}, {"source": "Rolling Stone", "title": "GENER8ION and Yung Lean Premiere Electrifying Performance of ‘Storm II’ at 2026 VMAs", "link": "https://www.rollingstone.com/music/music-news/gener8ion-yung-lean-storm-ii-vmas-performance-1235631664/", "summary": "Yung Lean and a large swath of dancers recreated the viral music video featuring Damien Jalet’s mesmerizing choreography", "date_str": "2026-09-28T02:26:56+00:00", "hash": "c8ad4bc64da6b418", "title_fa": "GENER8ION و Yung Lean اولین اجرای برقی «Storm II» در VMAهای 2026", "summary_fa": "یونگ لین و تعداد زیادی از رقصندگان، موزیک ویدیوی ویروسی را بازسازی کردند که شامل طراحی رقص مسحورکننده دیمین جالت، یونگ لین و گروهی از رقصندگان بود، صحنه جوایز موسیقی ویدئویی MTV 2026 را با اجرای زنده همکاری Lean با GENER8ION، در مراسم MTV، در مراسم Strmbut II، روشن کردند. در نقطه اوج این شب، هنرمندان و رقصندگان موزیک ویدیوی دوم از دو قسمت طوفان خود را در حضور تماشاگران زنده بازسازی کردند. در بالای اجرای آنها، یونگ لین قبل از اینکه راهی صحنه اصلی شود و مجسمه را بر روی زمین بکوبد، یک فرد ماه را گرفت. یونگ لین که مستقیماً موزیک ویدیو را منعکس می‌کرد، در کنار گروهی از رقصندگان با یونیفورم مدرسه بود که در رقص گیرا ایجاد شده توسط دیمین جالت موج می‌زدند. After an energetic and meticulous performance by the dancers, Yung Lean left the formation and spat a blue ice cream cone into the camera lens as the song faded out. داستان‌های پرطرفدار U2 همه چیز را دوباره رویا می‌کنم، ری، سومبر، تدی سوئیمز، آدام لامبرت به جورج مایکل سلام می‌کنند در MTV VMA چگونه ترامپ رئیس اوباش ایالات متحده شد SNL: تماشا کنید Katseye Perform Animal را تماشا کنید، Hootie Frutti Storm امشب نامزد چهار جایزه، از جمله بهترین ویدیوی مستقیم (Lorasv) از جمله بهترین ویدیوی سالانه شد. بهترین رقص (دیمین جالت). استورم در میان فهرست انباشته تصاویری از برخی از بزرگ‌ترین نام‌های موسیقی برای ویدیوی سال قرار داشت، از جمله آریانا گرانده (بغض که باعث شد تو عاشق من شوی)، برونو مارس (من فقط می‌توانم)، مدونا (اعترافات دوم فیلم)، سابرینا کارپنتر (اشک‌ها) و تیلور سویفت (سرنوشت اوفلیا)."}, {"source": "Rolling Stone", "title": "Sienna Spiro Nabs Best New Artist at 2026 MTV Video Music Awards", "link": "https://www.rollingstone.com/music/music-news/sienna-spiro-best-new-artist-2026-vmas-1235631056/", "summary": "“I didn’t think this would happen, so I just have to say thank you so much,” Spiro said in her short and sweet speech", "date_str": "2026-09-28T02:18:27+00:00", "hash": "785d64fae9144a4a", "title_fa": "Sienna Spiro Nabs بهترین هنرمند جدید در 2026 MTV Video Music Awards", "summary_fa": "اسپیرو در سخنرانی کوتاه و شیرین خود گفت: «فکر نمی‌کردم این اتفاق بیفتد، بنابراین فقط باید از شما تشکر کنم. اسپیرو به دریافت‌کنندگان برجسته‌ای مانند نیروانا، امینم، اولیویا رودریگو و بیلی آیلیش می‌پیوندد. اوایل شب، اسپیرو برای اولین بار با اجرای Great Expectation به صحنه VMA رفت. اسپیرو در سخنرانی کوتاه و شیرین خود گفت: فکر نمی کردم این اتفاق بیفتد، بنابراین فقط باید از شما تشکر کنم. از هواداران و مردمی که به من رای دادند تشکر می کنم. دوستت دارم من نمی توانم این را باور کنم او از تیمش در Capitol Records، زنان خدمه، مادرش و خواهرش تشکر کرد. برای لحظه‌ای به نظر می‌رسید که او آماده است تا نام‌های بیشتری را به صدا درآورد، اما تصمیم گرفت آن را با نفس تنگی بپیچد، حتی نمی‌دانم. درست مانند بسیاری از نامزدهای همکارش، اسپیرو سال‌ها را صرف ساختن موسیقی و به اشتراک‌گذاری آن در TikTok کرد قبل از اینکه اخیراً ظاهر شود. صدای جازی اسپیرو با الهام از بزرگانی مانند فرانک سیناترا، نینا سایمون و اتا جیمز همچنان خواننده بریتانیایی را متمایز می کند. پاییز گذشته، اسپیرو لحظه موفقیت خود را با Die on the Hill پشت سر گذاشت و به موقع برای انتشار اولین آلبوم او Visitor در سال 2026، طرفداران جدیدی را در سراسر برکه جذب کرد. داستان‌های پرطرفدار U2 همه چیز را دوباره رویا می‌کنم، ری، سومبر، تدی سوئیمز، آدام لمبرت به جورج مایکل در مراسم MTV VMA سلام می‌کنند چگونه ترامپ رئیس اوباش ایالات متحده شد SNL: تماشا کنید Katseye Perform Animal، Hootie Frutti امسال، رده بهترین هنرمند جدید با ستارگان در حال ظهور پر شد. تاد، مایلز اسمیت و استلا لفتی. الکس وارن برنده بهترین هنرمند جدید سال گذشته VMA خود را به اسپیرو تقدیم کرد."}, {"source": "Hollywood Reporter", "title": "What Will David Ellison Name His Mega Hollywood Studio?", "link": "https://www.hollywoodreporter.com/business/business-news/david-ellison-name-paramount-warner-skydance-1236712904/", "summary": "It can't be Paramount Skydance Warner Bros. Discovery. So that leaves a few options...", "date_str": "2026-09-28T13:12:03+00:00", "hash": "c182ed129c0aa0e0", "title_fa": "دیوید الیسون استودیوی مگا هالیوود خود را چه نام خواهد گذاشت؟", "summary_fa": "این نمی تواند پارامونت اسکای دنس برادران وارنر دیسکاوری باشد. بنابراین چند گزینه باقی می‌ماند... منطق ادغام استودیو بزرگ‌تر-بهتر است تقریباً تا زمانی که این صنعت وجود داشته در هالیوود باز می‌گردد. بنابراین، همچنین، در مورد چنین تثبیت چشم‌اندازی کنید. به عنوان مثال، در سال 1933، گروه کمدی برادران مارکس، نام شرکت تولید خود را با یک چشمک مشخص، به عنوان شرکت بین‌المللی ادغام شده وابسته به تولیدات جهانی فیلم در داکوتای شمالی، معرفی کردند. این نام باعث می‌شود گفتن با صدای بلند پارامونت اسکای‌دنس برادران وارنر دیسکاوری پس از خشک شدن جوهر نهایی در ادغام 111 میلیارد دلاری دیوید الیسون، تقریباً مانند نسیمی به نظر برسد. اما، برای این روزگار، حتی پنج کلمه ترکیبی از نام‌های استودیویی چند قرنی در هر طرف یک شرکت رسانه‌ای نوپا، با یک کانال کابلی که در انتهای آن نقش بسته است، خیلی زیاد به نظر می‌رسد. این معضلی است که تیم الیسون با آن مواجه است: او نام شرکتی را که ظاهراً نیمی از هالیوود را جارو کرده است، چیست؟ عنوان چیزی که تا به حال WarnerMount نامیده می شد، که به طور مشخص در استودیوی خریداری شده پیشتاز بود، یا ParaBros، که بیشتر اشاره ای به اپتیک ترکیب C-suite خریداران دارد، هنوز معرفی نشده است و پارامونت همچنان مادر است و از اظهار نظر در مورد زاویه این ستون خودداری می کند. اما نام چیز کمی نیست. این تصمیم هم به صنعت و هم به جمعیت وال استریت نشان می دهد که مالک جدید آن چه اولویتی دارد. در مقیاس بزرگ، می توان گفت که جهت استراتژیک را تعیین می کند. آیا الیسون با توجه به تمام صحبت هایش در مورد مقابله با غول های فناوری در اقتصاد توجه، می خواهد به آینده نگاه کند، نه به عقب؟ یا عشق او به صنعت سرگرمی و فیلمسازی با بودجه کلان، به جنبه نوستالژیک"}, {"source": "Hollywood Reporter", "title": "Madrid’s Iberseries & Platino Industria Bosses Tout Expansion and Innovation: “The Key Is Usefulness”", "link": "https://www.hollywoodreporter.com/business/business-news/iberseries-platino-industria-2026-preview-ai-usefulness-1236697465/", "summary": "Samuel Castro, Juan Alía and Adriana Castillo discuss what's new for the sixth edition, the prominence of microdramas and AI as topics, and how Mexico and Portugal will share the spotlight with Spain.", "date_str": "2026-09-28T12:30:00+00:00", "hash": "8e9b46bf3406d9eb", "title_fa": "مدیران Iberseries و Platino Industria مادرید توسعه و نوآوری را مطرح می کنند: \"کلید مفید بودن است\"", "summary_fa": "ساموئل کاسترو، خوان آلیا و آدریانا کاستیلو درباره چیزهای جدید نسخه ششم، برجستگی درام های کوچک و هوش مصنوعی به عنوان موضوعات و اینکه مکزیک و پرتغال چگونه در کانون توجه اسپانیا قرار خواهند گرفت، بحث می کنند. همه نگاه ها به مادرید است! پایتخت اسپانیا و مرکز تولید فیلم و تلویزیون، اهالی صنعت رسانه و سرگرمی، از جمله تهیه‌کنندگان، خلاقان و مدیران از اروپا، آمریکای لاتین و ایالات متحده را گرد هم می‌آورد. و فراتر از آن، برای بحث در مورد فرصت های محتوای اسپانیایی و پرتغالی زبان و موضوعات داغ صنعت در ششمین نسخه Iberseries Platino Industria این هفته. این رویداد بزرگ سالانه که از سه شنبه تا جمعه برگزار می‌شود، توسط بنیاد Secuoya، بزرگترین آژانس جمع‌آوری حقوق اسپانیا، EGEDA، و فدراسیون ایبرو-آمریکایی FIPCA، سازماندهی شده است، بار دیگر سخنرانی‌های اصلی، بحث‌های پنل، نمایش‌ها، جلسات سخنرانی و رویدادهای اجتماعی را همراه با انواع نوآوری‌ها برگزار می‌کند. داستان‌های مرتبط فیلم‌ها نائومی واتس از بیلی کروداپ به دلیل حمایت از فعالیت‌های یائسگی‌اش تمجید می‌کند: فیلم‌های بسیار شیرین -- و سکسی آنا کندریک درباره کارگردانی هفت شوهر اولین هوگو هوش مصنوعی، درام‌های کوچک، تولیدات مشترک، اقتباس‌های ادبی در مادرید و بسیاری موارد دیگر در طول چهار روز پخش خواهند شد. در میان بسیاری از سخنرانان و میزگردهای مطرح در Iberseries، افرادی مانند Katina Medina Mora هستند که مجموعه‌هایی مانند Off Campus، The Summer I Turned Pretty، Emily in Paris و Swagger و فیلم‌هایی مانند LuTo، Luis Fern ndez، رئیس NBCUniversal Telemundo Enterprises، vPedroEa، و Pedro. THR با ساموئل کاسترو، مدیر شرکت Iberseries Platino Industria، رئیس Iberseries، Juan Al a، رئیس Platino Industria، و Adriana Castillo، هماهنگ کننده عمومی Platino Industria، برای پیش نمایش ویترین رویداد صنعت محتوای اسپانیایی و پرتغالی زبان در سال 2026 و آنچه در این سال متفاوت است، صحبت کرد."}, {"source": "Hollywood Reporter", "title": "Italy’s Fandango Distribution Acquires Zurich Doc Jury President’s ‘Rescue’, RTS Joins as Broadcaster (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/fandango-zurich-rescue-documentary-rts-film-jury-president-1236713457/", "summary": "The agreements land as Sine Plambech, currently heading up Zurich's documentary competition jury, presents her harrowing analysis of Europe's \"externalization\" of migration control to North Africa.", "date_str": "2026-09-28T12:30:00+00:00", "hash": "b284b7474891d5ec", "title_fa": "توزیع Fandango ایتالیا \"نجات\" رئیس هیئت داوران Doc زوریخ را به دست آورد، RTS به عنوان پخش کننده می پیوندد (انحصاری)", "summary_fa": "این توافق‌ها زمانی شکل می‌گیرند که سینه پلامبک، که در حال حاضر ریاست هیئت داوران مسابقه مستند زوریخ را بر عهده دارد، تحلیل دلخراش خود را از «برونی‌سازی» اروپا از کنترل مهاجرت به شمال آفریقا ارائه می‌کند. به گزارش هالیوود ریپورتر، کمپانی ایتالیایی Fandango Distribution، نجات Sine Plambech را برای تمامی حقوق، از جمله اکران در سینما، خریداری کرده است. Radio T l vision Suisse (RTS) به عنوان یک پخش کننده وارد شده و به شرکای پیش فروش DR، VPRO، SVT و NRK، در معاملاتی که توسط Autlook Filmsales مستقر در وین، که فروش جهانی فیلم را بر عهده دارد، مذاکره کرده است. این توافق‌نامه‌ها به‌عنوان پلمبک، که به‌عنوان رئیس هیئت داوران مسابقه مستند در بیست و دومین جشنواره فیلم زوریخ خدمت می‌کند، اولین نمایش اروپایی فیلم نجات را در بخش اکنون/آینده جشنواره در این هفته ارائه می‌کند. داستان‌های مرتبط فیلم‌ها سی‌امین سالگرد جشنواره فیلم شب‌های سیاه تالین با فیلم‌های اولیا فیلم کن افتتاح می‌شود کیسی افلک در مورد رقابت مت دیمون، یک تماس تلفنی با کری     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
