      media: [{"source": "Billboard", "title": "Donnie Iris, ‘Ah! Leah!’ and ‘The Rapper’ Singer Dies at 83", "link": "https://www.billboard.com/music/rock/donnie-iris-death-ah-leah-the-rapper-singer-dies-obituary-1236368700/", "summary": "Pittsburgh rocker Donnie Iris, best known for his 1981 No. 29 Billboard Hot 100 new wave hit Ah! Leah! and his 1970s Hot 100 No. 2 song The Rapper with the group the Jaggerz, has died at 83. Related Ryan Gosling s Dead Man s Bones Duo Creep Back With Romantic Lost in the Night Video Starring Noah Jupe and Rain Spencer Gone But Not Forgotten: Musicians We Lost in 2026 Taylor Swift, George Strait, Lee Thomas Miller More Celebrated During Nashville Songwriters Hall of Fame Gala The news was shared by Donnie Iris the Cruisers drummer Joe Vitale Jr., who wrote, Tonight, I have some very sad news to share. Many of you may already know about this, but today my boss and friend Donnie Iris passed away at the age of 83, in a Facebook post on Monday (Oct. 26). At the first full show I performed with them in 2021, right before we went on stage, Donnie turned to me and gave me a huge hug. He always had an infectious smile, incredible energy and a wonderous personality. After you meet him, you honestly just love him. You could just sit and talk with him, laugh with him. He was King Cool. No cause of death had been announced at press time. A beloved staple of the Pittsburgh music scene, Elwood City native Iris was diagnosed with bladder cancer in 2023 shortly after his 80th birthday show, later canceling several shows and continuing to perform until announcing his retirement from the stage earlier this month after a final gig at Citizens Live at The Wylie in Pittsburg on Sept. 28. After much thought, and in light of recent health issues, I have made the difficult decision to retire from future concert performances, Iris wrote on Oct. 9. Music has given me far more than I could ever put into words. From the earliest days to every chapter of my life, your support has been a constant source of joy and inspiration. Dominic Ierace was born on Feb. 28, 1943 in New Castle, Pa., and got his start in grade school singing at weddings and talent contests. The man who would grow up to be dubbed Pittsburgh s King Cool of Rock and Roll first played with the doo-wop group The Fabutons in high school, then with the R B/rock cover bands the Tri-Vels and Donnie and the Donnells while at Slippery Rock State College, before dropping out to pursue a music career. He found success pretty quickly with The Rapper from his group The Jaggerz, a swinging rock tune about a smooth-talking dude who uses a series of smarmy lines to pick up women at bars. The song he recorded for Gamble Records (formed", "date_str": "2026-10-27T15:46:33+00:00", "hash": "5b28e9fa00a7d556", "title_fa": "دانی آیریس، «آه! لیا!» و خواننده «رپ» در ۸۳ سالگی درگذشت", "summary_fa": "دانی آیریس، راک‌باز پیتسبورگ، که بیشتر به‌خاطر آهنگ 100 بیلبورد شماره 29 خود در موج جدید Ah! لیا! و آهنگ 100 شماره 2 داغ او در دهه 1970 رپر با گروه جگرز در 83 سالگی درگذشت. Related Dead Man's Bones Duo رایان گاسلینگ با ویدیوی رمانتیک گمشده در شب با بازی نوح جوپ و رین اسپنسر رفته اما فراموش نشده است: نوازندگانی که در سال 2026 گم کردیم تیلور سویفت، جورج استریت، لی توماس میلر بیشتر جشن گرفته شد در طول نشویل اخبار آهنگسازان دان. درامر جو ویتال جونیور، که نوشت، امشب، یک خبر بسیار ناراحت کننده برای به اشتراک گذاشتن دارم. شاید بسیاری از شما قبلاً در مورد این موضوع بدانید، اما امروز رئیس و دوست من دانی آیریس در سن 83 سالگی در یک پست فیس بوک در روز دوشنبه (26 اکتبر) درگذشت. در اولین نمایش کاملی که با آنها در سال 2021 اجرا کردم، درست قبل از اینکه روی صحنه برویم، دانی به سمت من برگشت و مرا در آغوش گرفت. او همیشه لبخندی عفونی، انرژی باورنکردنی و شخصیتی شگفت انگیز داشت. بعد از ملاقات با او، صادقانه او را دوست دارید. شما فقط می توانید با او بنشینید و صحبت کنید، با او بخندید. او کینگ کول بود. هیچ علت مرگ در زمان مطبوعات اعلام نشده بود. آیریس اهل الوود سیتی که یکی از اعضای محبوب صحنه موسیقی پیتزبورگ است، در سال 2023 کمی پس از نمایش 80 سالگی اش به سرطان مثانه مبتلا شد، بعداً چندین برنامه را لغو کرد و تا اعلام بازنشستگی خود از صحنه در اوایل این ماه پس از اجرای آخرین کنسرت در Citizens Live در The Wylie 28 Sept در پیت، به اجرای برنامه ادامه داد. آیریس در 9 اکتبر نوشت، پس از تفکر زیاد، و با توجه به مسائل بهداشتی اخیر، تصمیم سختی برای بازنشستگی از کنسرت‌های آینده گرفتم.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/donnie-iris-1982-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۱۹:۱۶"}, {"source": "Billboard", "title": "Tate McRae, Olivia Rodrigo, Chappell Roan & More: Highlights of This Week’s Billboard Charts", "link": "https://www.billboard.com/lists/tate-mcrae-olivia-rodrigo-chappell-roan-chart-highlights-oct/", "summary": "Tuesday is new Billboard chart day each week! As all charts update each Tuesday, here’s a look at highlights of the latest rankings, dated Oct. 31 and reflecting the Oct. 16-22 measurement week, according to data tracker Luminate. Among this week’s chart stars are Tate McRae, Olivia Rodrigo, Chappell Roan, Zach Bryan and Lana Del Rey. Thanks to new releases, multiple stars are at career-high ranks, led by McRae, who claims her highest Billboard Hot 100 placement as a lead act as “Housewife” debuts at No. 2. The song also arrives as her second No. 1 on both the Billboard Global 200 and Billboard Global Excl. U.S. Related Olivia Rodrigo’s ‘You Seem Pretty Sad for a Girl So in Love’ Returns to No. 1 on Billboard 200 Roan matches her Hot 100 best as “Expectations,” with Olivia Rodrigo, bounds 63-3. The song surges following the Oct. 15 release of its remix and video, adding Roan. It was originally released in June by Rodrigo only on her album you seem pretty sad for a girl so in love . Plus, Del Rey ties her top Hot 100 showing as Bryan’s “Lies,” on which she’s featured, launches at No. 4. It’s her third top 10, following her featured role on Taylor Swift’s “Snow on the Beach” in 2022 and her own “Summertime Sadness,” with Cedric Gervais (No. 6, 2013). “Lies” is from Bryan’s Young Manhood and Other Donatable Organs , which starts as his fifth No. 1 on Top Country Albums, Top Rock Albums and Americana/Folk Albums. Read on for more key highlights from this week’s Billboard charts below. For a deeper dive into all of the above and more, go to Billboard ’s Chart Beat hub, sign up for the weekly Chart Beat newsletter , among other e-blasts, and browse the full menu of Billboard ’s charts, which refresh every Tuesday (and each Wednesday during holiday weeks).", "date_str": "2026-10-27T15:35:45+00:00", "hash": "1e10e09402418621", "title_fa": "تیت مک‌ری، اولیویا رودریگو، چاپل روان و موارد دیگر: نکات برجسته نمودارهای بیلبورد این هفته", "summary_fa": "سه شنبه هر هفته روز جدید نمودار بیلبورد است! طبق گزارش ردیاب داده Luminate، از آنجایی که همه نمودارها هر سه شنبه به روز می شوند، در اینجا نگاهی به نکات مهم آخرین رتبه بندی، در تاریخ 31 اکتبر و منعکس کننده هفته اندازه گیری 16 تا 22 اکتبر است. از جمله ستاره‌های این هفته می‌توان به تیت مک‌ری، اولیویا رودریگو، چاپل روآن، زک برایان و لانا دل ری اشاره کرد. به لطف نسخه‌های جدید، چندین ستاره در رتبه‌های بالای حرفه‌ای قرار دارند، به رهبری مک‌ری، که ادعا می‌کند بالاترین جایگاه خود را در بیلبورد Hot 100 به‌عنوان نقش اصلی به‌عنوان «خانه‌دار» در رتبه 2 قرار می‌دهد. این آهنگ همچنین به عنوان دومین شماره 1 او در بیلبورد جهانی 200 و بیلبورد جهانی می‌رسد. یو.اس.روان با الیویا رودریگو با امتیاز 63-3 بهترین رقابت خود را در 100 داغ خود به عنوان \"انتظارات\" دارد. این آهنگ پس از انتشار ریمیکس و ویدیوی خود در 15 اکتبر افزایش یافت و Roan را اضافه کرد. این در ابتدا توسط رودریگو در ژوئن منتشر شد و تنها در آلبوم او به نظر می رسد که برای دختری بسیار عاشق غمگین به نظر می رسد. به‌علاوه، دل ری بهترین نمایش 100 داغ خود را به عنوان «دروغ‌ها» از برایان، که در آن نقش‌آفرینی می‌کند، در رتبه 4 قرار می‌گیرد. این سومین 10 نمایش برتر او پس از نقش برجسته‌اش در «برف در ساحل» تیلور سویفت در سال 2022 و «Summertime Sadness, 30، C2» (No.30, Gerricvais) است. «دروغ‌ها» از «جوانمردی و سایر اعضای قابل اهدای برایان» است که به عنوان پنجمین شماره او شروع می‌شود. 1 در آلبوم‌های برتر کشور، آلبوم‌های راک برتر و آلبوم‌های آمریکایی/فولک. برای اطلاعات مهم بیشتر از نمودارهای بیلبورد این هفته در زیر بخوانید. \"Choosin' Texas\" برای بیست و پنجمین هفته رکورددار خود در صدر 100 رکورددار است. همزمان، آلبوم مادر قاصدک", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/olivia-rodrigo-chappell-roan-expectations-Phoenix-Johnson-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۱۹:۰۵"}, {"source": "Billboard", "title": "Ariana Grande Shines Brighter Than a Christmas Tree in Luxury Brand’s Musical Holiday Spectacular Campaign Video", "link": "https://www.billboard.com/music/music-news/ariana-grande-swarovski-musical-holiday-campaign-video-1236368690/", "summary": "Who needs Christmas tree ornaments when you ve already got all the sparkle you need? Ariana Grand e raises the question through her shimmering new Swarovski holiday musical campaign, which the iconic jewelry brand unveiled Tuesday (Oct. 27). Related Ariana Grande Is So Honored to Be the New Ambassador for This Sparkling Brand Ariana Grande Shows Off New Bob That Has Boyfriend Ricky Alvarez Falling in Love All Over Again Ariana Grande Mourns Coco, Her Beloved Dog of 17 Years: I Will Miss You Every Day Soundtracked by a theatrical orchestral arrangement that switches back and forth between jazzy and classical styles, the minute-long video opens with the pop star in a white suit and top hat, outfitted with many silver gems and brooches. She then leads a group of similarly dapper-looking backup dancers in a routine on a grand staircase before the scene switches to Grande in a princess gown surrounded by pink feathers. Other scenes in the sequence show Grande poking her head inside a festive dollhouse to hand a present to its miniature residents and channeling her inner ballerina in a Swan Lake -inspired sequence. At the end, the video cuts to the Wicked actress watching the ad in a theater, cheering as the credits roll before winking at the camera. Grande has been the face of Swarovski since July 2024 and has starred in a number of seasonal campaigns for the brand, including visuals for Valentine s Day, summer and one called Ariana Grande’s Fantasy Garden Comes to Life. I cannot wait to embark on this journey and to inspire others to embrace their own unique sparkle, she stated when the partnership was first announced. The Grammy winner is currently on a break from the public eye since the conclusion of her Eternal Sunshine Tour in September. Her rep announced she d be taking time away from the spotlight in August amid a spike in public scrutiny stemming from her physical appearance in the Petal music video. Billboard later confirmed that Grande still planned to do promo for her upcoming film, Focker-in-Law , as well as her brands, including R.E.M. Beauty. Watch Grande sparkle in Swarovski s new holiday campaign above.", "date_str": "2026-10-27T15:30:41+00:00", "hash": "264b981475c52a5d", "title_fa": "آریانا گرانده در ویدیوی کمپین تماشایی موزیکال تعطیلات برند لوکس، درخشان تر از درخت کریسمس می درخشد.", "summary_fa": "چه کسی به زیور آلات درخت کریسمس نیاز دارد وقتی که شما تمام درخشش مورد نیاز خود را دارید؟ آریانا گرند ای این سوال را از طریق کمپین موسیقی درخشان جدید خود در تعطیلات سواروسکی که این برند جواهرات نمادین روز سه شنبه (27 اکتبر) رونمایی کرد، مطرح می کند. آریانا گرانده بسیار مفتخر است که سفیر جدید این برند درخشان است. این ویدئوی یک دقیقه‌ای با سبک‌های جازی و کلاسیک با ستاره پاپ با کت و شلوار سفید و کلاه بالا، مجهز به جواهرات نقره و سنجاق‌های فراوان آغاز می‌شود. او سپس گروهی از رقصندگان پشتیبان با ظاهری شبیه به هم را در یک روال روی پلکانی بزرگ پیش از اینکه صحنه به گرانده در لباس شاهزاده خانمی که با پرهای صورتی احاطه شده است تغییر کند، رهبری می کند. صحنه‌های دیگر این سکانس نشان می‌دهد که گرانده سرش را در داخل یک عروسک‌خانه جشن می‌برد تا هدیه‌ای را به ساکنان مینیاتوری آن بدهد و بالرین درونی‌اش را در سکانسی الهام‌گرفته از دریاچه قو هدایت می‌کند. در پایان، این ویدیو به بازیگر Wicked مربوط می‌شود که در حال تماشای آگهی در یک تئاتر است و در حالی که تیتراژ پخش می‌شود قبل از چشمک زدن به دوربین، تشویق می‌کند. گرانده از جولای 2024 چهره سواروسکی بوده است و در تعدادی از کمپین های فصلی این برند، از جمله تصاویری برای روز ولنتاین، تابستان و یکی به نام باغ فانتزی آریانا گراند به زندگی می آید، ایفای نقش کرده است. او زمانی که برای اولین بار این همکاری را اعلام کرد، نمی‌توانم صبر کنم تا این سفر را آغاز کنم و دیگران را تشویق کنم تا درخشش منحصر به فرد خود را در آغوش بگیرند. برنده گرمی در حال حاضر از زمان پایان تور Eternal Sunshine خود در ماه سپتامبر، از انظار عمومی فاصله گرفته است. نماینده او در ماه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/ariana-grande-swarovski-holiday-screenshot-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۵ آبان • ۱۹:۰۰"}, {"source": "Billboard", "title": "50 Cent Sues Rick Ross Ex in $6M Defamation Lawsuit Over ‘Offensive’ Posts About Teenage Son", "link": "https://www.billboard.com/pro/50-cent-sues-rick-ross-ex-over-posts-about-teenage-son/", "summary": "50 Cent is suing Rick Ross ex-girlfriend over highly offensive social media posts about his 14-year-old son, including “sexually degrading” insults and a “fabricated medical diagnosis.” In a lawsuit Monday (Oct. 26) in Los Angeles federal court, attorneys for the rapper (Curtis Jackson) accuse Tiallondra Tia Kemp of defamation over her posts last week about Sire Jackson, in which she claimed he had autism due to conduct by his mother, Daphne Joy, when she was pregnant with him. Related 50 Cent Says He Had a Strong Feeling Suspect Accused of Assaulting Rick Ross Son Was Innocent After Posting Bond Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania “Ms. Kemp shamelessly used the label ‘on the spectrum’ as a pejorative slur hurled at a child to humiliate him and his family. But autism is not shameful,” 50 Cent’s lawyers write. “What is shameful is fabricating a diagnosis for a private child, inventing a sexually degrading cause for it, and broadcasting both to a mass audience.” The star’s lawyers say the offensive comments, under an Instagram photo of Sire and his parents, were made as part of an effort “to settle a score with his father” via a “a mass-audience campaign of falsehood and sexual degradation.” “This action arises from a grown adult’s deliberate decision to use a young child as a prop and a punchline in order to wound the child’s father,” 50 Cent’s lawyers write. “S.J. is a minor and not a public figure.” Monday’s federal lawsuit, obtained and first reported by Billboard , builds on a case filed earlier that day in Florida court, in which 50 accused Kemp of cyberstalking and harassing Sire. That case, which also seeks a restraining order, was first reported by TMZ. According to the new California lawsuit, the full caption under Kemp’s original post of Sire and his mother read: “Btchhhh azzzz @50cent U wanna play? U have NO room to post anyone’s child when urs on the spectrum and the reason being this hoooo was still swallowing 10,000 gallons of CUMMM when she was pregnant.” Kemp s comments appear to have been in response to posts earlier this month in which 50 Cent trolled Ross over an alleged assault on his 21-year-old son, whom he shares with Kemp. The rapper posted an image of the suspected assailant s mugshot and joked that he would bail him out. Kemp later repeated her claims several times, according to 50 Cent s lawyers, including in more", "date_str": "2026-10-27T15:26:29+00:00", "hash": "76fadccfe409b2c4", "title_fa": "شکایت 50 سنت از ریک راس سابق در شکایت 6 میلیون دلاری افترا به دلیل پست های توهین آمیز درباره پسر نوجوان", "summary_fa": "50 سنت از دوست دختر سابق ریک راس به دلیل پست های بسیار توهین آمیز در رسانه های اجتم ad to celebrate the past — but also introduce the future of R B.” With that in mind, this year s Soul Train Awards will feature only two fan-voted categories: R B/Soul Song of the Year, with voting on BET.com and Spotify’s RNB X International Artist, with voting in the Spotify app. The revamped format for the two-hour show will also be comprised of tributes to three special artist honorees representing Classic Soul, New Soul and Soul Personified. Chaka Khan was recently announced as the 2026 recipient of the Classic Soul Honor. On Tuesday (Oct. 27), it was revealed that Durand Bernarr will be presented with the Soul Personified Honor. Related Here Are Special Award Recipients Performers for the 2026 Soul Train Awards: Updating List Ryan Gosling s Dead Man s Bones Duo Creep Back With Romantic Lost in the Night Video Starring Noah Jupe and Rain Spencer Taylor Swift, George Strait, Lee Thomas Miller More Celebrated During Nashville Songwriters Hall of Fame Gala “We’ve learned over the last couple of years that finding a bridge for the generations is important as is honoring [legacies],” explains BET executive vp, specials, music programming music strategy, Connie Orlando , who joined Carr for Billboard ’s Zoom interview. “People miss that and really gravitate toward it. In addition to Classic Soul, we’ll have a New Soul award honoring someone who is super-hot right now. And we’ll have a Soul Personified award for an artist who’s hitting on all cylinders and personifies soul music.” The New Soul honoree, as well as the performer lineup, will be revealed in the coming weeks. Two show staples will also return. One is the Soul Cypher, which featured Marsha Ambrosius, Eric Bellinger, Nicci Gilbert and Arin Ray when the Soul Train Awards last aired in 2023. The second is the BET Amplified Stage, which showcases emerging artists. The 2023 show spotlighted October London and Honey Bxby on the Amplified Stage. The Soul Train Awards will be taped in Chicago on Nov. 5. It will then be broadcast on Nov. 27 (8 p.m. ET/PT) — including for the first time on CBS. Actor Anthony Anderson will host, as previously announced. As for what prompted the award show’s return after two years, Carr — named BET president last December — says, “It’s an iconic brand. When we pause", "date_str": "2026-10-27T15:07:25+00:00", "hash": "587e27eb3f672732", "title_fa": "BET جوایز Soul Train را بازسازی می کند: نمایش \"ما می دانستیم که این نمی تواند یک پدربزرگ باشد\"", "summary_fa": "هنگامی که جوایز Soul Train در 27 نوامبر پس از دو سال وقفه بازمی گردند، رئیس BET، لوئیس کار، به بینندگان وعده یک چیز می دهد. او به بیلبورد می‌گوید: «ما می‌دانستیم که این نمی‌تواند یک قطار روح پدربزرگ باشد. ما می دانستیم که باید گذشته را جشن بگیریم - اما همچنین آینده R B را معرفی کنیم. با در نظر گرفتن این موضوع، امسال جوایز Soul Train تنها دارای دو دسته با رای طرفداران خواهد بود: R B/Soul Song of the Year، با رای دادن در BET.com و Spotify's RNB X International Artist، با رای دادن در برنامه Spotify. قالب اصلاح‌شده برای نمایش دو ساعته نیز شامل ادای احترام به سه هنرمند ویژه‌ای است که به نمایندگی از کلاسیک سول، روح جدید و روح شخصیت‌پردازی می‌شوند. چاکا خان اخیراً به‌عنوان برنده جایزه کلاسیک Soul Honor در سال 2026 معرفی شد. روز سه شنبه (27 اکتبر) مشخص شد که دیورند برنار با Soul Personified Honor اهدا خواهد شد. موارد مرتبط در اینجا دریافت کنندگان جایزه ویژه بازیگران جوایز Soul Train 2026 هستند: لیست به روز رسانی رایان گاسلینگ Dead Mans Bones Duo Reep With Romantic Lost in the Night با بازی نوح جوپ و راین اسپنسر تیلور سویفت، جورج استریت، لی توماس میلر بیشتر از هالوویل در طول ناریتش یاد گرفتیم. در چند سال گذشته یافتن پل ارتباطی برای نسل‌ها و احترام به [میراث] مهم است. \"مردم آن را از دست می دهند و واقعاً به سمت آن جذب می شوند. علاوه بر کلاسیک سول، ما یک جایزه New Soul برای قدردانی از فردی که در حال حاضر فوق العاده داغ است، خواهیم داشت. و ما یک جایزه Soul Personified برای هنرمندی خواهیم داشت که در تمام استوانه ها ضربه می زند و موسیقی روح را به تصویر می کشد.\" برگزیده New Soul و همچنین ترکیب مجریان در هفته های", "image_url": "https://www.billboard.com/wp-content/uploads/2026/06/2281334022-e1781377984493.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آبان • ۱۸:۳۷"}, {"source": "Billboard", "title": "Turnpike Troubadours Earn First Hot 100 Hit With Zach Bryan Collab ‘Plainsman’", "link": "https://www.billboard.com/music/chart-beat/turnpike-troubadours-first-hot-100-hit-zach-bryan-collab-1236368726/", "summary": "Turnpike Troubadours land their first career entry on the Billboard Hot 100 , thanks to the group’s featured appearance on Zach Bryan’s “Plainsman.” The track, from Bryan’s new eight-song set, Young Manhood and Other Donatable Organs (released Oct. 16 via Belting Bronco/Warner Records), launches at No. 45 on the chart dated Oct. 31 almost entirely from streaming. It earned 6 million official U.S. streams in the Oct. 16-22 tracking week, according to Luminate, along with nearly 1,000 downloads sold. “Plainsman” also arrives at No. 14 on both the Hot Country Songs and Hot Rock Alternative Songs charts, likewise giving Turnpike Troubadours their first appearance on each ranking. Cowritten by Bryan and Turnpike Troubadours frontman Evan Felker, “Plainsman” marks the first recording between the two Oklahoma acts. Bryan is famously a longtime fan of the group. On his 2023 song “East Side of Sorrow,” he nodded to the band s reunion and its first album in six years, singing, “I heard Turnpike’s back together and they’re writin’ songs.” The group went on to open for Bryan on select dates of his Quittin’ Time Tour in 2024. Until now, Turnpike Troubadours’ chart success had come largely on the album side. The band has charted five titles on the Billboard 200 , Top Country Albums and Americana/Folk Albums charts, with four reaching the top 10 of the lattermost list, including 2017’s No. 1, A Long Way From Your Heart . The group’s first appearance on a Billboard songs chart came last year, when “Heaven Passing Through,” from its latest LP, The Price of Admission , debuted on Country Airplay. The single peaked at No. 46 this March over a 33-week run on the chart. As for Bryan, Young Manhood and Other Donatable Organs debuts at No. 2 on the Billboard 200 with 65,000 equivalent album units earned. It also opens at No. 1 on Top Country Albums, Top Rock Albums and Americana/Folk Albums, giving him his fifth No. 1 on all three charts.", "date_str": "2026-10-27T15:00:51+00:00", "hash": "fdc991acdcd6f011", "title_fa": "Turnpike Troubadours اولین ضربه 100 داغ را با Zach Bryan Collab \"Plainsman\" کسب کردند", "summary_fa": "Turnpike Troubadours اولین ورود حرفه‌ای خود را در Billboard Hot 100 به لطف حضور برجسته گروه در «Plainsman» زک برایان به دست آورد. این آهنگ، از مجموعه هشت آهنگ جدید برایان، «جوانمردی و سایر اعضای اهدایی» (که در 16 اکتبر از طریق Belting Bronco/Warner Records منتشر شد)، تقریباً به طور کامل از پخش در رده 45 جدول تاریخ 31 اکتبر قرار دارد. در اکتبر 6 میلیون استریم رسمی در ایالات متحده کسب کرد. طبق گزارش Luminate، هفته ردیابی 16 تا 22، همراه با نزدیک به 1000 دانلود فروخته شده است. \"Plainsman\" همچنین در جدول آهنگ های Hot Country Songs و Hot Rock Alternative Songs به رتبه 14 می رسد و به همین ترتیب Turnpike Troubadours اولین حضور خود را در هر رتبه بندی می دهد. «Plainsman» که توسط برایان و اوان فلکر، خواننده گروه Turnpike Troubadours نوشته شده است، اولین ضبط بین دو بازیگر اوکلاهاما است. برایان معروف است که از طرفداران قدیمی این گروه است. در آهنگ 2023 خود \"East Side of Sorrow\"، او برای اتحاد مجدد گروه و اولین آلبوم آن پس از شش سال سرش را تکان داد و این جمله را خواند: \"من شنیدم که Turnpike با هم برگشته است و آنها در حال نوشتن آهنگ هستند.\" این گروه در تاریخ‌های منتخب تور Quittin’ Time Tour در سال 2024 برای برایان باز شد. گروه پنج عنوان را در بیلبورد 200، آلبوم‌های برتر کشوری و آلبوم‌های آمریکایی/آمریکانا/فولک به دست آورده است که چهار عنوان آن به 10 فهرست آخر رسیده‌اند، از جمله شماره 1 سال 2017، راه طولانی از قلب شما. اولین حضور این گروه در جدول آهنگ های بیلبورد سال گذشته بود، زمانی که \"Heaven ن» در جشنواره کن به رقابت پرداخت. فیلم «Import» که در بلگراد، صربستان گرفته شده است، به دنبال دنی اینگرام، یک دانشجوی سابق بسکتبال دبیرستانی است که رویاهای حرفه ای او به دلیل یک آسیب جدی از مسیر خارج می شود. او که مصمم است شانس دوم را به دست آورد، به اروپای شرقی می رود، جایی که برای ورود به بسکتبال رقابتی تلاش می کند و توسط استخدام کنندگان دور می شود. دنی که ناامید از ادامه بازی است، آسیب خود را پنهان می کند و با نیما، پرستار سوری که از جامعه مهاجر محلی مراقبت می کند، که به او شغلی بسیار مورد نیاز را پیشنهاد می کند، در تماس است. وقتی بالاخره فرصت بازی برای پارتیزان به دست می‌آید، دنی باید تصمیم بگیرد که چقدر حاضر است برای دنبال کردن رویاهای بسکتبال خود پیش برود. Charades ماه آینده فروش بین المللی خود را در بازار فیلم آمریکا آغاز خواهد کرد. پیر مازارس، یکی از بنیانگذاران Charades، گفت: \"واردات دیدگاه جدیدی را در مورد ورزشی ارائه می دهد که مدت ها توسط تسلط ایالات متحده بر تصویر جهانی بسکتبال شکل گرفته است. در صربستان، بسکتبال چیزی بیش از یک بازی است - یک دین است.\" «پل اسکاردوف فضای منحصر به فرد و خشن آن را به تصویر می کشد و داستانی", "image_url": "https://variety.com/wp-content/uploads/2026/10/261021-IMPORT-KEYART-1_Norman-Wong.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۱۸:۴۷"}, {"source": "Variety", "title": "Sosie Bacon Joins Nikolaj Coster-Waldau in ‘Black Tapes’ Series at MGM+", "link": "https://variety.com/2026/tv/news/sosie-bacon-nikolaj-coster-waldau-black-tapes-series-mgm-1236932042/", "summary": "Sosie Bacon is set for a lead role in the upcoming MGM+ series The Black Tapes, Variety has learned. Bacon will star in the series alongside previously announced cast member Nikolaj Coster-Waldau. As previously reported, the show is based on the hit horror podcast of the same name and will begin production on its eight-episode [ ]", "date_str": "2026-10-27T15:00:00+00:00", "hash": "d096129a82e8b7ab", "title_fa": "سوسی بیکن به نیکولای کوستر والداو در سریال «نوارهای سیاه» در MGM+ می‌پیوندد.", "summary_fa": "ورایتی دریافته است که سوسی بیکن قرار است در سریال آینده MGM+ The Black Tapes ایفای نقش کند. بیکن در این سریال در کنار نیکولای کوستر والدائو، بازیگری که قبلا اعلام شده بود، بازی خواهد کرد. همانطور که قبلاً گزارش شده بود، این سریال بر اساس پادکست ترسناک پرطرفدار با همین نام ساخته شده است و تولید آن در هشت قسمت آغاز خواهد شد [ ] در لاگ لاین رسمی آمده است: «Dr. ریچارد استرند (کاستر والداو)، روانپزشکی درخشان با گذشته ای مرموز، با دانشمند وسواس و بی رحم الکس ریگان (بیکن) همکاری می کند تا موارد ماوراء الطبیعه تسخیر، دارایی ها، ناپدید شدن ها و افسانه های شوم - نوارهای سیاه بدنام را از بین ببرند. اما همانطور که استرند و ریگان رازهای این رویدادها را کشف می کنند، دنیای پنهانی را در پشت دنیای ما کشف می کنند و باید یک توطئه آخرالزمانی چند صد ساله را کشف کنند. داستان‌های مرتبط تیلور سوئیفت صدمین هفته خود را در جایگاه شماره 1 بیلبورد 200 سپری می‌کند، زیرا Life of a Showgirl در هفته 2 از Encore Rebound، Patient Zero تیلور سویفت در رتبه اول باقی می‌ماند. 1 برای هفته دوم در نمودار مجردها، ریگان بیشتر به عنوان یک فیزیکدان باهوش و روشمند توصیف می‌شود که به تحقیقات نوارهای سیاه به عنوان یک افشاگر می‌پیوندد، اما به سرعت آموزش‌های بسیار علمی خود را می‌یابد به این معنی که نمی‌تواند شواهد فزاینده‌ای را نادیده بگیرد که این اسرار شامل چیزی فراتر از دنیای طبیعی است. بیکن اخیراً فیلمبرداری فصل 2 اسکارپتا را برای آمازون به پایان رسانده و همچنین در نمایش هایی مانند Mare of Easttown، Narcos: Mexico و 13 Reasons Why بازی کرده است. در این فیلم، او در فیلم‌هایی از جمله لبخند و لبخند ۲ ایفای نقش کرده است و در ادامه در فیلم کمدی ترسناک خانوادگی که توسط", "image_url": "https://variety.com/wp-content/uploads/2026/10/Sosie-Bacon-Headshot-Photo-Credit-Martin-Rusch-e1793111187794.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "How KATSEYE’s Sophia Laforteza Made ‘Forgotten Island’ INXS Cover Her Own: ‘She Really Has the Story in Her DNA’", "link": "https://www.billboard.com/culture/tv-film/katseye-sophia-laforteza-forgotten-island-inxs-cover-video-1236368521/", "summary": "With Forgotten Island s central story of friendship and themes inspired by Philippines mythology, Filipino-American singer Sophia Laforteza of the global girl group KATSEYE was a fitting pick to make music for the DreamWorks Animation film. In a new digital bonus feature debuting exclusively on Billboard , Sophia and her collaborators including composer Nathan Matthew David, producer Mike Elizondo and writers/directors Joel Crawford and Januel P. Mercado take viewers inside the studio to discuss the making of her cover of INXS Never Tear Us Apart for the film, which arrives on digital platforms Tuesday (Oct. 27) with more than 60 minutes of bonus content. Related KATSEYE s Sophia Says Her INXS Cover for Forgotten Island Is The Most Sophia Thing I Could Do Why Filipino Pop Powerhouses SB19 BINI Are Embracing the Grammys Asian Pop Category: We See It as a Door Opening, Not a Box Closing SB19 Has No Plans to Stop Breaking Barriers: It Feels Like We re Unstoppable ‘Never Tear Us Apart’ is really kind of the journey of this movie and of the girls’ friendship – their anthem, in a way, Crawford says of lead besties Raissa and Jo (voiced by singer/songwriter H.E.R.). For Sophia and Mike and Nathan to make it an interpretation that stands on its own is an incredible accomplishment, Mercado adds of reinterpreting the 1988 top 10 Billboard Hot 100 hit for INXS. For David, Sophia immediately impressed him in the studio. Right from the beginning of her vocal session, we knew it was going to be really special. I think she just sang the hell out of this song. Sophia s personal connection to the film as a Filipino American was what drove home the musical connection. Hearing her talk about how she really has the story in her DNA, in her soul what she brought to this, I can’t imagine anyone else, Crawford says. That story was Sophia s north star as she navigated making Never Tear Us Apart her own. As a performer, my strength is, if you tell me what the story is, I’ll tell it the best way that I can, she says in the bonus feature. I got to watch the scene while singing it, and I really tried to take every ounce of knowledge I knew just growing up in this world. This is one of the most beautiful things I think I’ll ever do. Watch the full bonus feature here: Sophia is currently on hiatus from KATSEYE, but HYBE announced earlier this month that she plans to return to group activities in January 2027. She stepped back from the group in August to focus on her mental health, mean", "date_str": "2026-10-27T15:00:00+00:00", "hash": "0a1479e7cb08f702", "title_fa": "سوفیا لافورتزا از KATSEYE چگونه «جزیره فراموش شده» را ساخت INXS پوشش خود را: «او واقعاً داستان را در DNA خود دارد»", "summary_fa": "سوفیا لافورتزا، خواننده فیلیپینی-آمریکایی از گروه جهانی دختران KATSEYE، با داستان اصلی دوستی جزیره فراموش شده و مضامین الهام گرفته شده از اساطیر فیلیپین، انتخاب مناسبی برای ساخت موسیقی برای فیلم انیمیشن DreamWorks بود. سوفیا و همکارانش از جمله آهنگساز ناتان متیو دیوید، تهیه کننده مایک الیزوندو و نویسندگان/کارگردانان جوئل کرافورد و ژانوئل پی. Mercado بینندگان را به داخل استودیو می برد تا درباره ساخت کاور INXS Never Tear Us Apart برای این فیلم که از سه شنبه (27 اکتبر) روی پلتفرم های دیجیتالی با بیش از 60 دقیقه محتوای جایزه می آید، بحث کنند. سوفیای مرتبط KATSEYE می گوید جلد INXS او برای Forgotten Island بهترین کاری است که می توانم انجام دهم چرا پاپ پاپ فیلیپینی SB19 BINI دوباره گرمی را پذیرفته است رده: ما آن را به عنوان یک درب باز می بینیم، نه یک جعبه بسته شدن SB19 هیچ برنامه ای برای توقف آن ندارد. «هرگز ما را از هم جدا نکن» واقعاً نوعی سفر این فیلم و دوستی دختران است – سرود آن‌ها، به نوعی، کرافورد درباره بهترین بازیگران اصلی رایسا و جو (با صدای خواننده/ترانه‌سرا H.E.R.) می‌گوید. برای سوفیا و مایک و ناتان که تفسیری بی‌نظیر از آن بسازند، موفقیتی باورنکردنی است، مرکادو تفسیر مجدد 10 موفقیت برتر بیلبورد 100 برتر سال 1988 را برای INXS اضافه می‌کند. برای دیوید، سوفیا بلافاصله او را در استودیو تحت تأثیر قرار داد. درست از ابتدای جلسه آواز او، ما می دانستیم که واقعاً خاص خواهد بود. من فکر می کنم او فقط از این آهنگ جهنم خوانده است. ارتباط شخصی سوفیا با فیلم به عنوان یک آمریکایی فیلیپینی چیزی بود که ارتباط موسیقی را به خانه رساند. کرافورد می‌گوید با شنیدن صحبت‌های او درباره اینکه واقعاً چگونه داستان را در DNA خود دارد، در روحش که چه چیزی را به این موضوع رساند، نمی‌توانم شخص دیگری", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/sophia-laforteza-forgotten-island-2026-billboard-1800.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Here Are Special Award Recipients & Performers for the 2026 Soul Train Awards: Updating List", "link": "https://www.billboard.com/lists/soul-train-awards-2026-special-awards-recipients-performers/", "summary": "BET is starting to announce the talent that will appear on the 2026 Soul Train Awards . The show, hosted by actor Anthony Anderson , will air on BET on Friday, Nov. 27, at 8 p.m. ET/PT, with a simulcast on CBS, BET Her, VH1, MTV2 and LOGO. Grammy-winning singer, songwriter and producer Durand Bernarr will receive the Soul Personified Honor and perform on the show. Bernarr will also host the 2026 Soul Train Awards Red Carpet Show: Back on Track . This digital experience is billed as “a reimagination of the traditional red carpet.” Chaka Khan has already been announced as the recipient of the Classic Soul Honor. Related Chaka Khan to Receive Classic Soul Honor at 2026 Soul Train Awards This is the first Soul Train Awards since 2023 and the first ever to simulcast on CBS. The two-hour show will tape on Thursday, Nov. 5, in Chicago. Anderson, best known for his role on ABC’s long-running Black-ish , previously hosted the Soul Train Awards in 2013. The show will be light on competitive award categories (just two, both fan-voted) but heavy on special awards and performances. In addition, the show will crown the greatest R     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
